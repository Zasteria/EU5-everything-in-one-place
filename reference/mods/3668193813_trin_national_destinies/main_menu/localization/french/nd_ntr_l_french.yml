l_french:
 STATIC_MODIFIER_NAME_nd_mana_o_te_toa: "Mana o te Toa"
 STATIC_MODIFIER_DESC_nd_mana_o_te_toa: "Le mana des guerriers parcourt le pays. Du haka tonitruant à l'éclair du taiaha au combat, chaque iwi sait que la force et le courage définissent qui nous sommes."
 STATIC_MODIFIER_NAME_nd_mana_o_te_moana: "Mana o te Moana"
 STATIC_MODIFIER_DESC_nd_mana_o_te_moana: "L'océan est notre autoroute et notre patrimoine. Nos ancêtres ont traversé la plus grande mer du monde pour atteindre ces îles, et désormais la même maîtrise de la navigation guide notre commerce et notre exploration."
 STATIC_MODIFIER_NAME_nd_ahi_ka_musket: "Ahi Ka : le feu du mousquet"
 STATIC_MODIFIER_DESC_nd_ahi_ka_musket: "Le tonnerre du mousquet a changé à jamais la guerre. Des chefs comme Hongi Hika ont montré que ceux qui maîtrisent les nouvelles armes en premier peuvent remodeler l’équilibre des pouvoirs dans tout Aotearoa."
 STATIC_MODIFIER_NAME_nd_ahi_ka_gunfighter_pa: "Ahi Ka : Le tireur Pa"
 STATIC_MODIFIER_DESC_nd_ahi_ka_gunfighter_pa: "Notre père a été reconstruit pour un nouveau type de guerre. Les tranchées en zigzag, les doubles palissades et les bunkers souterrains transforment chaque fortification en un piège mortel pour les attaquants brandissant des mousquets et des canons."
 STATIC_MODIFIER_NAME_nd_kotahitanga_militant: "Kotahitanga : Résistance armée"
 STATIC_MODIFIER_DESC_nd_kotahitanga_militant: "Sous le roi Maori, les iwi se sont unis non seulement en conseil mais aussi en armes. La terre sera défendue par la force, et aucune puissance étrangère ne prendra ce qui nous appartient sans combattre."
 STATIC_MODIFIER_NAME_nd_kotahitanga_diplomatic: "Kotahitanga : Voix unie"
 STATIC_MODIFIER_DESC_nd_kotahitanga_diplomatic: "Le Kingitanga parle d'une seule voix au nom de tous les Maoris. Grâce à la diplomatie et à l’unité d’objectifs, nous garantirons notre souveraineté et nos terres par la négociation plutôt que par l’effusion de sang."
 nd_ntr.1.t: "Aotearoa United"
 nd_ntr.1.d: "The iwi of Aotearoa have come together under a single sovereignty. For centuries, the tribes of these islands have lived as independent nations, trading pounamu and obsidian, waging war over mana and resources, building great pa on every strategic hilltop. Now, the shared identity of the Maori people has crystallized into something greater than any single iwi could achieve alone.\n\nThe question before us is what kind of nation Aotearoa will become. Shall we draw upon the warrior traditions that have defined our people: the haka, the taiaha, the unbreakable will of the toa? Or shall we look to the ocean that brought our ancestors here, building upon the navigational mastery and cultural traditions that make us unique among the peoples of the world?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ntr.1.a: "Nous sommes les enfants de Tu : la force par le combat !"
 nd_ntr.1.b: "Nous sommes les enfants de Tangaroa : maîtrise de la mer !"
 nd_ntr.2.t: "Les guerres des mousquets"
 nd_ntr.2.d: "The arrival of European firearms has transformed warfare in Aotearoa utterly. Chiefs who acquire muskets first hold devastating advantage over those who still fight with taiaha and mere. Hongi Hika of Ngapuhi demonstrated this when he returned from England in 1821 with hundreds of muskets, launching raids that reached from the Bay of Islands to the shores of Lake Rotorua.\n\nBut the Maori genius for adaptation runs deep. Within a generation, every major iwi has armed itself, and our engineers have redesigned the traditional pa to withstand the new weapons. The gunfighter pa, with its zigzag trenches, double palisades, and underground bunkers, may be the most sophisticated indigenous fortification system in the world.\n\nWill we embrace the offensive power of the musket, or master the defensive art of the new pa?"
 nd_ntr.2.a: "Armez chaque guerrier. Le mousquet change tout."
 nd_ntr.2.b: "Fortifiez et endurez. Le père nous protégera."
 nd_ntr.3.t: "Le Kingitanga"
 nd_ntr.3.d: "In the face of growing pressure on Maori lands and sovereignty, a movement has emerged to unite the iwi under a single monarch. At Pukawa, on the shores of Lake Taupo, the great chief Potatau Te Wherowhero has been nominated as the first Maori King. The Kingitanga, the King Movement, represents the most ambitious attempt at pan-tribal unity in Maori history.\n\nThe movement's supporters argue that only a united Maori nation can resist the loss of lands and the erosion of sovereignty. But the question of how to achieve this unity divides opinion. Some believe armed resistance is the only answer. Others argue that the Kingitanga's greatest power lies in presenting a united diplomatic front, speaking with one voice for all Maori."
 nd_ntr.3.a: "Le roi nous mènera à la guerre s'il le faut."
 nd_ntr.3.b: "Le roi parlera d'une seule voix au nom de tous les Maoris."
 nd_ntr.4.t: "The Greenstone Trails"
 nd_ntr.4.d: "The greenstone of the South Island, pounamu, has become the most prized material in all of Aotearoa. Found only in the rivers and mountains of Te Wai Pounamu, this nephrite jade is tougher than any other stone of the islands and takes a polish that gleams like the sea. A mere of greenstone or a hei-tiki pendant carries the mana of its owner.\n\nThe stone is carried out along the trails of Ngai Tahu, over the passes of the Southern Alps and by canoe along the coasts of both islands. Obsidian, argillite and finished adzes pass back the same way, and gifts of stone bind distant hapu to one another. A single mere pounamu may be worth more than all the food a hapu can grow in a season. The trails are not merely paths; they are an economy."
 nd_ntr.4.a: "Pounamu est la richesse de notre nation."
 nd_ntr.5.t: "Le Whare Wananga"
 nd_ntr.5.d: "The whare wananga, houses of higher learning, represent the pinnacle of Maori intellectual tradition. Within these sacred institutions, carefully selected students of chiefly lineage spend years memorizing vast bodies of knowledge: whakapapa genealogies stretching back to the arrival of the great canoes, karakia for every occasion, the movements of stars that guide ocean voyages, and the medicinal properties of every plant in the forest.\n\nThe tohunga who graduate from these schools are the living repositories of their people's accumulated wisdom. At places like Te Rawheoro in Tolaga Bay, knowledge passes from generation to generation through structured oral instruction that rivals the universities of Europe in its rigor and depth."
 nd_ntr.5.a: "La connaissance est le véritable taonga de notre peuple."
 nd_ntr_pa_engineering: "Pa Ingénierie"
 nd_ntr_pa_engineering_desc: "La science de la construction de colonies fortifiées au sommet d'une colline, pa, avec de multiples terrasses défensives, palissades et scènes de combat."
 nd_ntr_toa_warriors: "Guerriers Toa"
 nd_ntr_toa_warriors_desc: "La tradition guerrière des toa, des combattants d'élite formés aux arts martiaux mau rakau et maniant le taiaha, le simple et le tewhatewha."
 nd_ntr_waka_taua_tradition: "Tradition Waka Taua"
 nd_ntr_waka_taua_tradition_desc: "Les grandes pirogues de guerre qui transportent jusqu'à une centaine de guerriers, leurs proues et étambots sculptés annonçant le mana de leur iwi."
 nd_ntr_wharenui_tradition: "Tradition Wharenui"
 nd_ntr_wharenui_tradition_desc: "Les maisons de réunion sculptées qui servent de centres de gouvernance tribale, de cérémonie et de préservation du whakapapa."
 nd_ntr_horticultural_mastery: "Gardens of Rongo"
 nd_ntr_horticultural_mastery_desc: "Gardens are laid out in plots between low rows of stone, and gravel and sand are carried to them to warm the soil, so that the crops of the tropics bear in a colder land. What the gardens, the forest and the sea give is laid up in storehouses raised on posts."
 nd_ntr_mau_rakau: "Mau Rakau"
 nd_ntr_mau_rakau_desc: "L'art martial consistant à manier les armes traditionnelles (taiaha, tewhatewha, patu) avec l'équilibre, le timing et la précision qui ne peuvent provenir que d'années d'entraînement."
 nd_ntr_iwi_governance: "Gouvernance Iwi"
 nd_ntr_iwi_governance_desc: "Le système sophistiqué d'autorité principale, où Ariki et Rangatira dirigent grâce à une combinaison de mana hérité et de réussite personnelle."
 nd_ntr_pounamu_mastery: "The Greenstone Trails"
 nd_ntr_pounamu_mastery_desc: "Trails over the passes of the Southern Alps and canoe routes along the coasts carry greenstone north, and obsidian, argillite and finished adzes pass back along them. Where the trails end, workshops grind stone into tools."
 nd_ntr_waka_hourua_voyaging: "Voyage Waka Hourua"
 nd_ntr_waka_hourua_voyaging_desc: "Le canot océanique à double coque capable de traverser de vastes étendues de haute mer, guidé par une navigation stellaire ancestrale et une connaissance des courants océaniques."
 nd_ntr_whare_wananga: "Où Wananga"
 nd_ntr_whare_wananga_desc: "Les écoles sacrées d'enseignement supérieur où les tohunga maîtrisent le whakapapa, l'astronomie, la médecine et les connaissances rituelles qui maintiennent la cohésion de la société maorie."
 nd_ntr_rahui_conservation: "Conservation de Rahui"
 nd_ntr_rahui_conservation_desc: "Le système d'interdiction temporaire des ressources, rahui, qui permet aux zones de pêche, aux forêts et aux jardins épuisés de se rétablir, garantissant ainsi une utilisation durable des terres."
 nd_ntr_flax_weaving_tradition: "Tissage Harakeke"
 nd_ntr_flax_weaving_tradition_desc: "The art of weaving harakeke flax into cloaks, baskets, ropes, and sails, an industry that produces both everyday necessities and treasured ceremonial garments.\n\n#italic Available in: $nd_ntr_pounamu_workshop$#!"
 nd_ntr_star_navigation: "Navigation par étoiles"
 nd_ntr_star_navigation_desc: "L'ancienne science polynésienne de l'orientation par les étoiles, la houle et le vol des oiseaux, une tradition de navigation qui a conquis le Pacifique."
 nd_ntr_hapuu_alliances: "Alliances Hapu"
 nd_ntr_hapuu_alliances_desc: "Le réseau complexe de relations intertribales, d'alliances matrimoniales et d'échanges de cadeaux qui unissent les hapu en temps de paix et de guerre."
 nd_ntr_european_contact: "Commerce de contact européen"
 nd_ntr_european_contact_desc: "The arrival of European traders and whalers opens new markets for Maori agricultural produce, flax, and timber. The ships pay for their pigs and potatoes in muskets.\n\n#italic Available in: $nd_ntr_pounamu_workshop$#!"
 nd_ntr_whalebone_artistry: "Artistique en os de baleine"
 nd_ntr_whalebone_artistry_desc: "The transformation of whale bone into finely carved weapons, ornaments, and ritual objects, a tradition that elevates raw material into expressions of tribal identity.\n\n#italic Available in: $nd_ntr_pounamu_workshop$#!"
 nd_ntr_potato_revolution: "Révolution de la pomme de terre"
 nd_ntr_potato_revolution_desc: "L’adoption rapide de la pomme de terre européenne transforme l’agriculture maorie. Plus facile à cultiver que le kumara et produisant des rendements bien supérieurs, la pomme de terre alimente un boom démographique et un excédent commercial."
 nd_ntr_musket_trade: "Commerce de mousquets"
 nd_ntr_musket_trade_desc: "L'échange de surplus agricoles, de lin et de bois contre des mousquets européens, un commerce qui remodèlera l'équilibre des pouvoirs entre les iwi."
 nd_ntr_tribal_mana: "Mana tribal"
 nd_ntr_tribal_mana_desc: "Le prestige accumulé et l’autorité spirituelle de la nation, le mana qui découle des victoires militaires, des récoltes réussies et des réalisations des grands chefs."
 nd_ntr_inter_island_trade: "Commerce inter-îles"
 nd_ntr_inter_island_trade_desc: "Des réseaux commerciaux maoris reliant les îles du Nord et du Sud, transportant le pounamu vers le nord et les surplus agricoles vers le sud à bord de waka, puis de navires de style européen."
 nd_ntr_pa_adaptation: "Pa Adaptation"
 nd_ntr_pa_adaptation_desc: "Les premières modifications de la conception traditionnelle des pa en réponse aux nouvelles menaces, aux fossés plus profonds, aux palissades plus solides et aux nouvelles approches du positionnement défensif."
 nd_ntr_musket_adaptation: "Adaptation du mousquet"
 nd_ntr_musket_adaptation_desc: "L'intégration complète des armes à feu dans la guerre maorie, y compris des mousquets modifiés avec des trous de contact élargis pour un tir plus rapide et l'utilisation tactique des tirs de volée depuis des positions fortifiées."
 nd_ntr_gunfighter_pa: "Le tireur Pa"
 nd_ntr_gunfighter_pa_desc: "La refonte révolutionnaire du pa pour la guerre avec des armes à feu, des tranchées en zigzag, des doubles palissades avec rembourrage en lin, des bunkers souterrains et des tunnels de communication."
 nd_ntr_commercial_agriculture: "Agriculture commerciale"
 nd_ntr_commercial_agriculture_desc: "L'expansion rapide de l'agriculture maorie pour approvisionner les colonies européennes et les navires de passage. En quelques décennies, les iwi ont produit des tonnes de pommes de terre, de blé et de porc destinés à l'exportation."
 nd_ntr_whalers_economy: "Économie des baleiniers"
 nd_ntr_whalers_economy_desc: "Engagement des Maoris dans l’industrie baleinière côtière, fournissant de la main-d’œuvre, de la nourriture et un accès aux côtes en échange de biens et de technologies européens."
 nd_ntr_taua_warfare: "Guerre Taua"
 nd_ntr_taua_warfare_desc: "The organized war parties, taua, that combine traditional warrior discipline with musket firepower, striking with devastating speed across great distances. Each is a party of kin raised for one season's campaign."
 nd_ntr_he_whakaputanga_sovereignty: "La souveraineté de Whakaputanga"
 nd_ntr_he_whakaputanga_sovereignty_desc: "La Déclaration d'indépendance des tribus unies de Nouvelle-Zélande, signée en 1835, affirme la souveraineté maorie et établit un cadre d'autonomie gouvernementale."
 nd_ntr_trading_vessels: "Navires de commerce"
 nd_ntr_trading_vessels_desc: "Maori-owned and operated trading ships that carry agricultural produce between settlements and across the Tasman to Sydney, a maritime commercial fleet rivaling colonial efforts.\n\n#italic Available in: $nd_ntr_waka_yard$#!"
 nd_ntr_kingitanga: "Kingitanga"
 nd_ntr_kingitanga_desc: "Le Maori King Movement, une institution pantribale unissant les iwi sous un seul souverain pour résister à l'aliénation des terres et affirmer une gouvernance collective maorie."
 nd_ntr_modern_pa_warfare: "Guerre de Pa moderne"
 nd_ntr_modern_pa_warfare_desc: "Les systèmes défensifs sophistiqués des guerres néo-zélandaises, où des pa comme Ruapekapeka combinent bunkers souterrains, lignes de tranchées en enfilade et profondeur tactique pour vaincre les armées professionnelles."
 nd_ntr_maori_commerce: "Commerce maori"
 nd_ntr_maori_commerce_desc: "L'essor des entreprises commerciales maories, des minoteries, des navires de commerce et des exportations de blé, prouve que l'économie indigène peut rivaliser sur un pied d'égalité avec le commerce colonial."
 nd_ntr_kotahitanga: "Kotahitanga"
 nd_ntr_kotahitanga_desc: "Le mouvement d'unité qui rassemble les dirigeants maoris dans les parlements et les conseils pour répondre à des préoccupations communes par le biais d'une action collective et d'un soutien mutuel."
 nd_ntr_cultural_renaissance: "Renaissance culturelle"
 nd_ntr_cultural_renaissance_desc: "Une floraison d'arts, de langue et d'identité maoris, la détermination de préserver et de revitaliser les traditions qui définissent ce que signifie être Maori."
 nd_ntr_land_resistance: "Résistance terrestre"
 nd_ntr_land_resistance_desc: "La défense acharnée des terres maories contre l'aliénation, par le biais de contestations judiciaires, de résistance passive et, si nécessaire, d'opposition armée."
 nd_ntr_runanga_councils: "Conseils de Runanga"
 nd_ntr_runanga_councils_desc: "Le système de conseils tribaux, runanga, qui assure une gouvernance structurée, un règlement des différends et une prise de décision collective dans l'ensemble de la société maorie."
 a_nd_ntr_toa: "Guerriers Toa"
 a_nd_ntr_toa_desc: "Des guerriers maoris d'élite formés à l'art martial du mau rakau, maniant le bâton taiaha et le club patu avec une habileté dévastatrice. Leur cri de guerre, le haka, fait peur à tout ennemi."
 a_nd_ntr_toa_levy: "Prélèvement Toa"
 a_nd_ntr_toa_levy_desc: "Les guerriers iwi appelés au service combattent avec des armes traditionnelles et la détermination farouche qui définit l'esprit martial maori."
 a_nd_ntr_pa_defenders: "Pa Défenseurs"
 a_nd_ntr_pa_defenders_desc: "Des guerriers armés de mousquets spécialisés dans la défense des tireurs pa, combattant depuis des tranchées en zigzag et des doubles palissades avec une précision mortelle."
 n_nd_ntr_waka_taua: "Waka Taua"
 n_nd_ntr_waka_taua_desc: "De grandes pirogues de guerre taillées dans des rondins simples, ornées de sculptures en spirale et d'étambots à plumes, transportant des dizaines de guerriers toa au combat."
 n_nd_ntr_waka_hourua: "Waka Hourua"
 n_nd_ntr_waka_hourua_desc: "Des canots océaniques à double coque capables de traverser de vastes étendues du Pacifique ouvert, guidés par la science ancienne de la navigation stellaire polynésienne."
 nd_ntr_pa: "Pennsylvanie"
 nd_ntr_pa_desc: "Une colonie fortifiée au sommet d'une colline avec de multiples terrasses défensives, des palissades en bois et des scènes de combat, l'épine dorsale de la défense territoriale maorie."
 nd_ntr_whare_wananga_building: "Où Wananga"
 nd_ntr_whare_wananga_building_desc: "Une école sacrée d'enseignement supérieur où les tohunga préservent et transmettent les connaissances accumulées du peuple maori à travers les générations."
 nd_ntr_wharenui: "Wharenui"
 nd_ntr_wharenui_desc: "Une maison de réunion sculptée, ornée de sculptures complexes qui codent la généalogie et l'histoire tribales, servant de centre de gouvernance et de cérémonie communautaires."
 nd_ntr_pounamu_workshop: "Adze Makers' Workshop"
 nd_ntr_pounamu_workshop_desc: "A workshop at the end of the stone trails, where blocks of argillite and basalt are flaked and ground into adzes and chisels, the tools that fell the trees and shape the canoes. Weavers and bone carvers work beside the adze makers."
 nd_ntr_rua_kumara: "Pataka"
 nd_ntr_rua_kumara_desc: "A storehouse raised on posts, out of reach of rats and damp, its front carved to show the wealth of the hapu. Preserved birds, dried fish and fern root are kept in it through the winter."
 nd_ntr_pa_maintenance: "Entretien du père"
 nd_ntr_pa_maintenance_desc: "Le bois pour les palissades et la pierre pour les fondations maintiennent les défenses du pa contre les intempéries et les attaques."
 nd_ntr_wananga_upkeep: "Entretien de Wananga"
 nd_ntr_wananga_upkeep_desc: "Du bois pour entretenir la maison sacrée du savoir et du papier pour enregistrer les connaissances accumulées du tohunga."
 nd_ntr_wharenui_maintenance: "Entretien de Wharenui"
 nd_ntr_wharenui_maintenance_desc: "Bois pour les panneaux sculptés et les poteaux structurels, et pierre pour les fondations et le trottoir environnant de la salle de réunion."
 nd_ntr_pounamu_processing: "Adze Grinding"
 nd_ntr_pounamu_processing_desc: "Quarried stone is flaked to shape, then ground on wet sandstone and hafted as adzes and chisels."
 nd_ntr_rua_maintenance: "Pataka Upkeep"
 nd_ntr_rua_maintenance_desc: "Timber for the posts and the carved boards, flax for the baskets and the lashings, and stone for the ovens in which the food is cooked before it is stored."
 nd_ntr_flax_weaving: "Tissage Harakeke"
 nd_ntr_flax_weaving_desc: "Tissage traditionnel de fibres de lin harakeke, teintes et transformées en manteaux, paniers et cordages."
 a_nd_ntr_taua_levy: "Taua"
 a_nd_ntr_taua_levy_desc: "A musket war party of a few hundred kinsmen. It moves by canoe and forest track faster than any marching column, opens with the haka and a volley, and goes home when the season turns."
 levy_nd_ntr_taua: "Taua"
 levy_nd_ntr_taua_desc: "War parties raised by the hapu for a season's campaign."
 nd_ntr_whalebone_carving: "Sculpture en os de baleine"
 nd_ntr_whalebone_carving_desc: "Les os de baleine récoltés sur le rivage sont transformés avec des outils spécialisés en armes, ornements et objets rituels d'une grande importance culturelle."
 levy_nd_ntr_toa: "Prélèvement des Guerriers Toa"
 levy_nd_ntr_toa_desc: "Les guerriers iwi répondent à l'appel aux armes, amenant leur taiaha et leur féroce haka sur le champ de bataille."
 a_nd_ntr_tupara: "Mousquetaires Tupara"
 a_nd_ntr_tupara_desc: "Guerriers maoris armés de tupara, fusils de chasse à double canon chargés de balles de mousquet, modifiés avec des trous de contact élargis pour un tir rapide en combat rapproché."
 n_nd_ntr_trading_schooner: "Goélette de commerce maori"
 n_nd_ntr_trading_schooner_desc: "Des voiliers de style européen détenus et pilotés par des Maoris, transportant les surplus agricoles entre les colonies et traversant la mer de Tasmanie jusqu'à Sydney."
 nd_ntr_musket_pa: "Mousquet Pa"
 nd_ntr_musket_pa_desc: "Une fortification reconstruite pour l'ère des armes à feu, des palissades doubles avec rembourrage en lin, des tranchées en zigzag pour les tirs de mousquet et des portes renforcées pour résister aux assauts."
 nd_ntr_musket_pa_maintenance: "Entretien du mousquet"
 nd_ntr_musket_pa_maintenance_desc: "Bois pour les palissades et armement pour les crosses de mousquets de la garnison."
 nd_ntr_flour_mill: "Moulin à farine maori"
 nd_ntr_flour_mill_desc: "Des moulins à eau transforment le blé en farine destinée à l'exportation, symbole de l'entreprise commerciale maorie rivalisant avec l'industrie coloniale."
 nd_ntr_milling_upkeep: "Opérations de fraisage"
 nd_ntr_milling_upkeep_desc: "Le blé est moulu en farine à l'aide de meules alimentées à l'eau, produisant un excédent de céréales commerciales destiné à l'exportation vers les colonies européennes."
 nd_ntr_waka_yard: "Chantier naval de Waka"
 nd_ntr_waka_yard_desc: "Un chantier de construction navale où les artisans maoris construisent à la fois des navires de commerce traditionnels waka et de style européen."
 nd_ntr_shipyard_upkeep: "Opérations du chantier naval"
 nd_ntr_shipyard_upkeep_desc: "Bois et fournitures navales pour entretenir le chantier naval et équiper les navires."
 nd_ntr_runanga_house: "Maison Runanga"
 nd_ntr_runanga_house_desc: "Une maison de conseil formelle où les chefs tribaux se réunissent pour délibérer sur des questions de gouvernance, de justice et d'action collective."
 nd_ntr_runanga_upkeep: "Entretien de Runanga"
 nd_ntr_runanga_upkeep_desc: "Du bois pour l'entretien de la maison du conseil et du tissu pour le mobilier de cérémonie et les vêtements nécessaires aux délibérations formelles."
 nd_ntr_kotahitanga_hall: "Salle Kotahitanga"
 nd_ntr_kotahitanga_hall_desc: "Une salle de réunion pan-tribale où les dirigeants maoris de tout le motu se réunissent pour discuter de questions affectant tous les iwi, l'incarnation physique de l'unité."
 nd_ntr_kotahitanga_upkeep: "Entretien de la salle Kotahitanga"
 nd_ntr_kotahitanga_upkeep_desc: "Du bois pour entretenir la salle de réunion et du papier pour les pétitions, les déclarations et les archives du parlement pan-tribal."
 nd_ntr_tupara_musketeers: "Mousquetaires Tupara"
 nd_ntr_tupara_musketeers_desc: "L'adoption du fusil à double canon, tupara, par les guerriers maoris, qui modifient les armes pour un tir plus rapide et adaptent leurs tactiques en conséquence."
 nd_ntr_provisioning_trade: "Commerce d’approvisionnement"
 nd_ntr_provisioning_trade_desc: "Pigs and potatoes supplied to visiting European ships and paid for in muskets, an early and lucrative form of Maori commercial enterprise."
 nd_ntr_formed_tt: "Aotearoa a été créée"
 nd_ntr_path_a_tt: "Choisissez Mana o te Toa"
 nd_ntr_path_b_tt: "J'ai choisi Mana o te Moana"
 nd_ntr_destiny: "Destin d'Aotearoa"
 nd_ntr_destiny_desc: "Avec les iwi unis sous une souveraineté unique, Aotearoa se trouve à la croisée des chemins. Le chemin choisi lors de la formation s'ouvre désormais sur un grand destin national. La stabilité et le but guideront la voie à suivre."
 nd_ntr_dest_tu: "Te Ara o Tu"
 nd_ntr_dest_tu_desc: "Claim dominion over Tamaki Makaurau and project power beyond the horizon to the island of Niue. The mana of the confederation must be known on every shore before the war parties of Tu, the god of war, put to sea."
 nd_ntr_dest_taua: "Taua du Pacifique"
 nd_ntr_dest_taua_desc: "The war parties of Aotearoa sail beyond the horizon in the great waka taua. Tongatapu of Tonga and the great islands of Fiji must fall under our mana. The wealth of conquest funds the next campaign."
 nd_ntr_dest_whenua: "Mana Whenua"
 nd_ntr_dest_whenua_desc: "The great southern land beckons, and the double-hulled voyaging canoes can cross the Tasman. Plant the taiaha among the Eora on the shores of Botany Bay and claim the lands of the Dharug people. Only the mightiest nation, rich in gold and steeped in prestige, can accomplish this."
 nd_ntr_dest_tangaroa: "Te Ara ou Tangaroa"
 nd_ntr_dest_tangaroa_desc: "La générosité de Tangaroa traverse nos marchés. Construisez une économie de pêche et de commerce digne du dieu de l'océan, en accumulant des richesses et en maintenant la stabilité nécessaire aux longs voyages."
 nd_ntr_dest_hokinga: "Te Hokinga Wairua"
 nd_ntr_dest_hokinga_desc: "The spirit of the great voyaging ancestors returns. The canoes sail back to Rarotonga, from whose Avana passage tradition says the fleet set out. Banking is embraced, and Waitangi in the Bay of Islands grows from a landing place into a harbour town. A nation of traders, scholars, and mariners."
 nd_ntr_dest_waitangi_grown_tt: "Waitangi is ours and has grown into a town or become the seat of a market"
 nd_ntr_dest_moana: "Te Mana ou te Moana"
 nd_ntr_dest_moana_desc: "Become the undisputed masters of the Pacific. Embrace the scientific revolution, accumulate vast wealth, and carry the mana of Aotearoa to Havai'i, the Hawaiki of the ancestors, where the marae of Taputapuatea stands. Aotearoa then stands among the great maritime powers of the world."
 nd_ntr.6.t: "Le destin d'Aotearoa"
 nd_ntr.6.d: "The islands are united, the iwi speak as one. Now a greater question presents itself: what shall Aotearoa become? The ancestors who crossed the Pacific in nothing but waka hourua could not have imagined the nation that has risen from their landing places. But they would recognize the ambition, the drive to push beyond every horizon, that burns in the hearts of their descendants.\n\nOur destiny awaits."
 nd_ntr.6.a: "Ka tu tatou, nous nous lèverons !"
 nd_ntr.7.t: "Consolidation des îles"
 nd_ntr.7.d: "Tamaki Makaurau, the city of a hundred lovers, the isthmus between two harbors, serves as our base of power. And beyond the horizon, the island of Niue has fallen under the mana of our warriors, the first conquest beyond Aotearoa's home waters.\n\nWith this foothold in the wider Pacific, our toa look further outward. The ocean stretches before us, studded with island kingdoms that could fall under the sovereignty of a truly ambitious nation."
 nd_ntr.7.a: "Les îles sont à nous. Maintenant, nous regardons au-delà."
 nd_ntr.8.t: "Le Taua du Pacifique"
 nd_ntr.8.d: "Our war canoes have crossed open ocean to bring the mana of Aotearoa to distant shores. The kingdoms of Tonga and the chiefdoms of Fiji have been brought under our sovereignty, the first time a Polynesian power has projected force so far beyond its home waters.\n\nThe veterans of these campaigns return with new knowledge and confidence. Some argue for honing our offensive capabilities to press even further. Others believe the priority should be consolidating control over these vast new territories, binding the conquered peoples to our cause through integration and shared purpose."
 nd_ntr.8.a: "Aiguisez le taiaha pour la prochaine campagne."
 nd_ntr.8.b: "Liez ces peuples à notre mana."
 nd_ntr.9.t: "Mana Whenua : la grande terre du sud"
 nd_ntr.9.d: "The impossible has been achieved. The warriors of Aotearoa have crossed the Tasman and planted their standard on the shores of the great southern continent. The lands around Botany Bay, vast, fertile, and rich in resources, now answer to a Maori sovereign.\n\nThis is the apex of Aotearoa's martial destiny, a conquest that dwarfs anything the ancestors could have imagined. But holding such territory demands a choice: do we pursue total military dominance, reinforcing our armies at the expense of all else? Or do we settle these new lands, assimilating the local peoples and building a civilization that can endure?"
 nd_ntr.9.a: "Domination totale : renforcer et conquérir."
 nd_ntr.9.b: "S'installer et construire ; cette terre est à nous maintenant."
 nd_ntr.10.t: "La route de l'océan"
 nd_ntr.10.d: "The markets of Aotearoa overflow with the bounty of Tangaroa. Fish from every coast, pounamu from the rivers of Te Wai Pounamu, and the products of a thriving maritime economy fill our trading vessels. The ancestors who navigated by the stars to reach these islands would approve; we have turned the ocean from a barrier into a highway.\n\nOur merchants range further with each passing year, establishing trade connections that bring wealth and knowledge flooding into our harbors."
 nd_ntr.10.a: "L'océan fournit ; nous suivrons ses courants."
 nd_ntr.11.t: "Te Hokinga Wairua : le grand voyage"
 nd_ntr.11.d: "The spirit of the great voyaging ancestors has returned in a new form. Where they crossed the Pacific with stars and courage, we now build trade networks and institutions that span the ocean. Banking houses in our ports finance ventures to distant markets. Our canoes have found the way back to Rarotonga, and the harbour at Waitangi is crowded with ships.\n\nSome see this as the foundation for a true trade empire: our merchants should dominate every market in the Pacific, building grand cities that attract the wealth of the world. Others argue for a different kind of wealth: the exchange of knowledge and culture that comes from welcoming the world to our shores."
 nd_ntr.11.a: "Construisez le plus grand empire commercial du Pacifique."
 nd_ntr.11.b: "Bienvenue au monde dans notre wharenui."
 nd_ntr.12.t: "Te Mana o te Moana : Seigneurs du Pacifique"
 nd_ntr.12.d: "Aotearoa has achieved what no Polynesian nation has ever accomplished: a scientific and economic transformation that places it among the great powers of the world. Our fleets patrol waters from New Zealand to the equator, and the homeland of the ancestors at Havai'i answers to Aotearoa. Our scholars and tohunga have embraced the scientific revolution without abandoning the wisdom of the ancestors.\n\nThis is the pinnacle of the maritime destiny. But even now, there are those who debate how best to wield this power. Shall we build an invincible navy to enforce our will across the Pacific? Or shall we become a nation of knowledge and diplomacy, respected and courted by all, feared by none, but underestimated at the world's peril?"
 nd_ntr.12.a: "Nos navires de guerre gouverneront ces eaux."
 nd_ntr.12.b: "La connaissance est la forme la plus véritable du mana."
 STATIC_MODIFIER_NAME_nd_ntr_dest_toa_strike: "Te Patu : La grève"
 STATIC_MODIFIER_DESC_nd_ntr_dest_toa_strike: "Les guerriers d'Aotearoa ont perfectionné l'art de la frappe décisive, rapide, écrasante et imparable. Nos campagnes commencent avant même que l’ennemi ne sache que nous arrivons."
 STATIC_MODIFIER_NAME_nd_ntr_dest_toa_mana: "Te Mana Motuhake : Autorité souveraine"
 STATIC_MODIFIER_DESC_nd_ntr_dest_toa_mana: "Les peuples conquis reconnaissent le mana d'Aotearoa. Grâce à l’intégration et au partage d’objectifs, les nouveaux territoires sont liés à la couronne, même si l’expansion rapide met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_ntr_dest_whenua_war: "Te Pakanga Nui : La Grande Guerre"
 STATIC_MODIFIER_DESC_nd_ntr_dest_whenua_war: "La mobilisation de guerre totale soutient la conquête du continent sud. Toutes les ressources sont affectées au renforcement des armées et au maintien de la campagne, au détriment des relations diplomatiques."
 STATIC_MODIFIER_NAME_nd_ntr_dest_whenua_settle: "Te Nohoanga : la colonie"
 STATIC_MODIFIER_DESC_nd_ntr_dest_whenua_settle: "Les colons suivent les guerriers, plantant du kumara et construisant du pa sur les rives d'une nouvelle terre. Le contrôle s'établit par l'occupation et l'assimilation, même si le coût de la construction dans ces terres lointaines est élevé."
 STATIC_MODIFIER_NAME_nd_ntr_dest_hokinga_trade: "Te Hokohoko Nui : Le grand commerce"
 STATIC_MODIFIER_DESC_nd_ntr_dest_hokinga_trade: "Les marchands d'Aotearoa dominent les routes commerciales du Pacifique. Nos villes se transforment en grands entrepôts qui attirent les commerçants de l’autre côté de l’océan, leur richesse soutenant le prestige de la nation."
 STATIC_MODIFIER_NAME_nd_ntr_dest_hokinga_whanau: "Te Whanaungatanga : La parenté"
 STATIC_MODIFIER_DESC_nd_ntr_dest_hokinga_whanau: "Le principe de whanaungatanga, de parenté et de connexion, s'étend au-delà de l'iwi pour embrasser le monde dans son ensemble. Les visiteurs et les commerçants sont les bienvenus, les connaissances s'échangent et Aotearoa prospère grâce à son ouverture."
 STATIC_MODIFIER_NAME_nd_ntr_dest_moana_thalasso: "Te Tino Rangatiratanga ou te Moana"
 STATIC_MODIFIER_DESC_nd_ntr_dest_moana_thalasso: "Souveraineté absolue sur l'océan. Les navires de guerre d'Aotearoa patrouillent dans le Pacifique d'un horizon à l'autre, faisant respecter les routes commerciales et projetant une puissance qui exige la reconnaissance du monde entier."
 STATIC_MODIFIER_NAME_nd_ntr_dest_moana_matau: "Te Matauranga : la connaissance"
 STATIC_MODIFIER_DESC_nd_ntr_dest_moana_matau: "Le plus grand trésor est la connaissance. Les érudits, diplomates et espions d'Aotearoa tissent un réseau d'influence qui s'étend bien au-delà de ce qu'une flotte pourrait accomplir, garantissant les intérêts de la nation grâce à la sagesse."
 nd_ntr_whare_toa: "Te Whare Toa"
 nd_ntr_whare_toa_desc: "Une grande salle d'entraînement de guerriers où les traditions martiales d'Aotearoa, de l'art ancien du mau rakau à la guerre interarmes moderne, sont transmises de génération en génération."
 nd_ntr_whare_toa_upkeep: "Entretien de la salle des guerriers"
 nd_ntr_whare_toa_upkeep_desc: "Armes, bois pour les terrains d'entraînement et pierres pour les murs fortifiés de la salle des guerriers."
 nd_ntr_whare_taonga: "Te Whare Taonga"
 nd_ntr_whare_taonga_desc: "Un grand trésor et un centre commercial sur la côte, où la richesse du Pacifique coule entre les mains des Maoris, le pounamu, la soie, les épices et les produits d'une douzaine de nations insulaires."
 nd_ntr_whare_taonga_upkeep: "Entretien de la maison au trésor"
 nd_ntr_whare_taonga_upkeep_desc: "Bois pour la structure de l'entrepôt, toile pour l'emballage et la présentation, et outils pour peser et mesurer les marchandises commerciales."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_ntr_bureaucracy_authority: "Tikanga Maori"
 AUTO_MODIFIER_DESC_nd_ntr_bureaucracy_authority: "Les institutions d'Aotearoa - les conseils de rangatira, les maisons d'apprentissage tohunga, les fortifications pa, le droit coutumier du muru et de l'utu et le mouvement unificateur de Kingitanga - sont devenues un appareil administratif cohérent. A partir de cette fondation, la confédération iwi commence à gouverner comme un seul État sans abandonner le mana tribal qui l'a créée."

 ntr_rangatiratanga_bureaucracy: "Rangatiratanga"
 ntr_rangatiratanga_bureaucracy_desc: "Le rangatira (chef) et l'ariki (chef suprême) dirigent les iwi et les hapu par leur mana hérité et leur autorité personnelle, conseillés à chaque étape par le conseil des anciens koroua. L'autorité est consensuelle et non coercitive : un rangatira qui perd du mana perd des adeptes, et la confédération des tribus est maintenue par la reconnaissance mutuelle entre ces conseils de chefs plutôt que par un seul décret souverain. Bien entretenu, le système donne au royaume un réservoir important de gouverneurs locaux légitimes ; négligé, il se dissout dans l’autonomie de l’iwi constituant."

 ntr_tohunga_whare_wananga_bureaucracy: "Tohunga moi te Whare Wananga"
 ntr_tohunga_whare_wananga_bureaucracy_desc: "Les tohunga étaient des spécialistes qui détenaient le plus grand savoir tapu sur les iwi : les généalogies whakapapa, les chemins des étoiles et les routes maritimes, la sculpture du pounamu et le travail du bois, les arts de guérison et le rituel karakia qui ouvrait ou clôturait chaque entreprise. Leurs apprentis étudiaient dans les whare wananga, des maisons d'apprentissage sacrées où les connaissances étaient transmises oralement de génération en génération. Démanteler la classe tohunga revenait à rompre la lignée de la mémoire elle-même, mais un sacerdoce corrompu ou égoïste pouvait transformer cette même autorité en un monopole privé de la vérité."

 ntr_pa_network_bureaucracy: "Whakapakari Pa"
 ntr_pa_network_bureaucracy_desc: "Le pa était une colonie au sommet d'une colline ou d'une péninsule défendue par des fossés, des palissades, des plates-formes de combat et - après le contact européen - des terrasses munies de meurtrières. Chaque iwi entretenait plusieurs pa clés destinées aux campagnes saisonnières et comme refuges en temps de guerre, construites et réparées par le travail communautaire issu des hapu environnants. Le réseau a donné à Aotearoa une profondeur défensive qui déconcerterait les généraux britanniques lors des guerres néo-zélandaises des années 1860, mais l'obligation de travail incombait aux cultivateurs, qui payaient en kumara et en sueur pour les murs qu'ils ne souhaitaient pas toujours construire."

 ntr_muru_me_utu_bureaucracy: "Muru moi Utu"
 ntr_muru_me_utu_bureaucracy_desc: "Le droit coutumier de la restitution et de la réciprocité. Muru était le raid de pillage ritualisé par lequel un hapu offensé prenait les biens des parents du délinquant pour rétablir l'équilibre brisé par une violation du tapu ou une insulte au mana. Utu était le principe plus large qui exigeait que chaque cadeau, blessure et honneur reçoive une réponse en nature. Ensemble, ils constituaient un ordre juridique imposé par la communauté qui contournait les ordres de tout chef : le mana était préservé, les gens nourris et les querelles duraient à travers les générations tandis que les pouvoirs de l'État central restaient d'autant plus minces."

 ntr_kingitanga_bureaucracy: "Te Kingitanga"
 ntr_kingitanga_bureaucracy_desc: "En 1858, les chefs du centre de l'île du Nord se sont réunis à Ngaruawahia et ont élu Te Wherowhero Potatau comme premier roi maori. Inspiré en partie de la monarchie britannique que les chefs observaient depuis le traité de Waitangi de 1840, le Kingitanga visait à mettre un terme à l'aliénation des terres ancestrales en unissant les iwi sous un souverain unique capable de négocier avec la Couronne sur un pied d'égalité. En tant qu’institution, elle représente le moment où la confédération iwi se transforme en royauté nationale : le prix payé pour l’indépendance du rangatira, le gain d’une légitimité unifiée."
