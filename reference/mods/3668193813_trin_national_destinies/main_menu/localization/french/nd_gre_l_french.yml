l_french:
 STATIC_MODIFIER_NAME_nd_gre_megali_idea: "L'idée Megali"
 STATIC_MODIFIER_DESC_nd_gre_megali_idea: "Le rêve de restaurer la souveraineté grecque sur les terres de l’Empire byzantin brûle de mille feux. Constantinople nous appelle : la ville de nos ancêtres, siège de la civilisation orthodoxe, attend ses héritiers légitimes."
 STATIC_MODIFIER_NAME_nd_gre_hellenic_enlightenment: "Lumières helléniques"
 STATIC_MODIFIER_DESC_nd_gre_hellenic_enlightenment: "La Grèce est à l’avant-garde d’une nouvelle ère de raison et d’apprentissage. S'appuyant sur la sagesse de leurs ancêtres classiques et sur les courants intellectuels de l'Europe moderne, les érudits grecs forgent une nation fondée sur l'éducation, l'entreprise maritime et les idéaux démocratiques de l'ancienne polis."
 STATIC_MODIFIER_NAME_nd_gre_fire_ship_legacy: "L'héritage des navires de pompiers"
 STATIC_MODIFIER_DESC_nd_gre_fire_ship_legacy: "Les exploits audacieux des capitaines des pompiers grecs ont semé la terreur dans les flottes ennemies de toute la mer Égée. Cette tradition de guerre navale audacieuse, où le courage et l'ingéniosité l'emportent sur la supériorité numérique, définit l'approche grecque de la puissance maritime."
 STATIC_MODIFIER_NAME_nd_gre_phanariot_diplomacy: "Réseaux Diplomatiques Phanariotes"
 STATIC_MODIFIER_DESC_nd_gre_phanariot_diplomacy: "Les familles grecques instruites du district de Phanar ont cultivé un réseau de relations diplomatiques s'étendant de Constantinople aux cours d'Europe. Leurs talents linguistiques et leur sens politique servent la cause grecque depuis les lieux du pouvoir."
 STATIC_MODIFIER_NAME_nd_gre_phanariot_commerce: "Empire commercial phanariote"
 STATIC_MODIFIER_DESC_nd_gre_phanariot_commerce: "Les princes marchands du Phanar ont tiré parti de leur position privilégiée pour construire des réseaux commerciaux qui s’étendent à l’échelle de l’Empire ottoman et au-delà. Les maisons de commerce grecques dominent le commerce des céréales de la mer Noire à la Méditerranée."
 nd_gre.1.t: "La naissance de la Hellas"
 nd_gre.1.d: "After centuries of foreign domination, a Greek state rises once more from the ashes of antiquity. The blue and white banner flies over Athens, and the question that has haunted the Greek nation for generations now demands an answer: what shall this reborn Hellas become?\n\nSome look eastward, toward Constantinople and the lost glory of the Roman Empire of the Greeks. The Megali Idea, the Great Idea, calls for nothing less than the restoration of Greek sovereignty over the lands where Greek civilization once flourished. This is a path of ambition, of Orthodox destiny, of reclaiming what was taken.\n\nOthers look to the future rather than the past. The scholars of the Greek Enlightenment, men like Rigas Feraios and Adamantios Korais, envision a modern republic, a beacon of learning and commerce in the Eastern Mediterranean. This is a path of reason, of maritime enterprise, of proving that the heirs of Pericles can build a new civilization worthy of their ancestors.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_gre.1.a: "Constantinople sera à nouveau nôtre !"
 nd_gre.1.b: "Nous serons la lumière du nouvel âge."
 nd_gre.2.t: "Feu sur l'eau"
 nd_gre.2.d: "On a moonless night, a small vessel packed with gunpowder and combustible materials creeps toward the enemy flagship. The crew, volunteers who know they may not survive, guide their floating inferno through the darkness. When the fire ship finds its mark, the explosion lights up the sea: the enemy admiral's vessel erupts in a column of flame visible for miles.\n\nThis is the Greek way of naval warfare. Outnumbered and outgunned, the sailors of Hydra, Spetses, and Psara have turned the fire ship into an art form. Where the Ottomans have warships built for battle, the Greeks have merchant vessels, daring captains, and the willingness to turn their own ships into weapons. The tactic has proven devastatingly effective; enemy fleets now hesitate to anchor near Greek waters, knowing that any moonless night could bring fire from the darkness."
 nd_gre.2.a: "Qu'ils craignent nos flammes !"
 nd_gre.3.t: "L'ascendant des phanariotes"
 nd_gre.3.d: "In the shadow of the Ecumenical Patriarchate, the great families of the Phanar district have risen to extraordinary influence. These educated, multilingual Greek nobles, the Phanariots, serve as dragomans, physicians, and administrators at the highest levels of Ottoman governance. They govern the Danubian Principalities, translate diplomatic correspondence, and command respect in every court from Vienna to St. Petersburg.\n\nYet this power comes with a choice. The Phanariots can leverage their position to build diplomatic networks that serve Greek national interests: eyes and ears in every capital, alliances forged in the corridors of power. Or they can turn their attention to commerce, using their privileged access to Ottoman markets to build Greek merchant houses that dominate the trade routes of the Eastern Mediterranean."
 nd_gre.3.a: "La plume est plus puissante que l'épée."
 nd_gre.3.b: "Le commerce est la véritable voie vers le pouvoir."
 nd_gre.4.t: "La Société des Amis"
 nd_gre.4.d: "In a modest house in Odessa, three Greek merchants (Nikolaos Skoufas, Emmanuil Xanthos, and Athanasios Tsakalov) have founded a secret society dedicated to the liberation of the Greek nation. They call it the Filiki Eteria, the Society of Friends.\n\nOrganized in the manner of Freemasonry and the Carbonari, with four levels of initiation and an elaborate system of codes and signals, the Society spreads rapidly through the Greek diaspora. Merchants in every major port, priests in every parish, captains on every island: the network grows invisible to Ottoman eyes. Members contribute to a war chest, smuggle weapons, and prepare the ground for revolution.\n\nThe day of reckoning approaches. When the signal is given, the entire Greek world will rise as one."
 nd_gre.4.a: "La liberté ou la mort !"
 nd_gre_mountain_strongholds: "Forteresses de montagne"
 nd_gre_mountain_strongholds_desc: "Les montagnes escarpées de Grèce ont toujours été le dernier refuge des libres. Les positions fortifiées dans les hautes terres offrent un refuge contre les envahisseurs et servent de bases aux combattants de la résistance."
 nd_gre_orthodox_identity: "Identité orthodoxe"
 nd_gre_orthodox_identity_desc: "La foi grecque orthodoxe constitue la force unificatrice de l’identité hellénique, préservant la langue, le savoir et la conscience nationale à travers des siècles de domination étrangère."
 nd_gre_olive_cultivation: "Culture d'oliviers"
 nd_gre_olive_cultivation_desc: "L'olivier est le fondement de l'agriculture grecque, fournissant de l'huile, de la nourriture et des biens commerciaux qui soutiennent les civilisations méditerranéennes depuis l'Antiquité."
 nd_gre_armatoloi_tradition: "Armatoloi Tradition"
 nd_gre_armatoloi_tradition_desc: "Les Armatoloi, milices chrétiennes chargées de garder les cols de montagne, forment le noyau de la capacité militaire grecque, mêlant l'autorité officielle aux compétences de combat des guerriers des hautes terres."
 nd_gre_aegean_seamanship: "Matelotage égéen"
 nd_gre_aegean_seamanship_desc: "Des générations de marins grecs ont maîtrisé les eaux dangereuses de la mer Égée, ses tempêtes soudaines et ses canaux rocheux, créant ainsi une tradition de matelotage inégalée parmi les communautés insulaires."
 nd_gre_monastic_learning: "Apprentissage monastique"
 nd_gre_monastic_learning_desc: "Les monastères du Mont Athos et d’autres lieux saints grecs préservent non seulement la foi orthodoxe mais l’ensemble du corpus du savoir grec : les manuscrits, la philosophie et les germes d’un futur réveil national."
 nd_gre_klepht_warfare: "Guerre de Klepht"
 nd_gre_klepht_warfare_desc: "Les Klephts, bandits des montagnes qui refusent l'autorité ottomane, perfectionnent l'art de la guérilla : tendre une embuscade, attaquer et disparaître dans les hautes terres. Leurs tactiques de délit de fuite s'avèrent plus efficaces que les formations linéaires européennes en terrain montagneux."
 nd_gre_diaspora_trade_networks: "Réseaux commerciaux de la diaspora"
 nd_gre_diaspora_trade_networks_desc: "Les communautés marchandes grecques dispersées à travers la Méditerranée et la mer Noire créent un réseau commercial interconnecté, canalisant richesse et informations vers la patrie grecque."
 nd_gre_millet_governance: "Gouvernance du mil"
 nd_gre_millet_governance_desc: "Dans le cadre du système ottoman du mil, la communauté grecque orthodoxe exerce une autonomie significative en matière d’éducation, de religion et de droit des personnes, maintenant les traditions administratives qui serviront un jour un État grec restauré."
 nd_gre_phanariot_patronage: "Patronage des Phanariotes"
 nd_gre_phanariot_patronage_desc: "Les riches familles Phanariot de Constantinople créent des académies et des écoles qui enflamment les Lumières grecques modernes, formant une génération d’érudits qui défendront les arguments en faveur de la nation grecque."
 nd_gre_island_shipyards: "Chantiers navals de l'île"
 nd_gre_island_shipyards_desc: "Les chantiers navals d'Hydra, Spetses et Psara produisent des navires agiles dirigés par des marins expérimentés : une flotte marchande qui se double d'une formidable force navale lorsque le besoin s'en fait sentir."
 nd_gre_guerrilla_doctrine: "Doctrine de guérilla"
 nd_gre_guerrilla_doctrine_desc: "Les combattants grecs codifient les tactiques de guerre en montagne développées au fil des siècles de résistance : contrôler les hauteurs, frapper les lignes de ravitaillement, ne jamais proposer de bataille aux conditions de l'ennemi."
 nd_gre_merchant_marine: "Marine marchande"
 nd_gre_merchant_marine_desc: "À la fin du XVIIIe siècle, la marine marchande grecque s'est développée pour dominer le transport maritime de la Méditerranée orientale, avec plus d'un millier de navires battant couleurs grecques et dix-huit mille marins expérimentés prêts à servir."
 nd_gre_fire_ship_tactics: "Tactiques des pompiers"
 nd_gre_fire_ship_tactics_desc: "Les commandants de la marine grecque perfectionnent la tactique dévastatrice du navire-incendie : de petits navires remplis de poudre à canon et de combustibles, enfoncés dans les navires de guerre ennemis par des équipages volontaires qui s'échappent en barque au dernier moment."
 nd_gre_patriarchal_schools: "Écoles patriarcales"
 nd_gre_patriarchal_schools_desc: "Sous le patronage du Patriarcat œcuménique, les écoles grecques préservent et transmettent l’enseignement classique, produisant une population alphabétisée qui devance leurs dirigeants ottomans en matière d’éducation."
 nd_gre_greek_enlightenment: "Lumières grecques"
 nd_gre_greek_enlightenment_desc: "Des intellectuels grecs comme Eugenios Voulgaris et Rigas Feraios synthétisent la philosophie grecque classique avec la pensée européenne moderne, posant les bases intellectuelles de l’indépendance et de la nation grecques."
 nd_gre_aegean_trade_ascendancy: "Ascendant commercial égéen"
 nd_gre_aegean_trade_ascendancy_desc: "Greek merchants exploit successive European wars to challenge Western dominance of Mediterranean trade. Currants, grain, and olive products flow from Greek ports to markets across Europe.\n\n#italic Available in: $nd_gre_olive_press$#!"
 nd_gre_filiki_eteria: "Filiki Éteria"
 nd_gre_filiki_eteria_desc: "La Société des Amis, une organisation révolutionnaire clandestine fondée en 1814 à Odessa, rassemble des marchands, des membres du clergé, des chefs militaires et des intellectuels grecs dans une conspiration qui ébranlera l’Empire ottoman jusqu’à ses fondations."
 nd_gre_philhellene_corps: "Corps philhellène"
 nd_gre_philhellene_corps_desc: "Des volontaires européens inspirés par la civilisation grecque classique, les Philhellènes, apportent une formation militaire moderne et un idéalisme romantique à la cause grecque, formant des unités d'élite qui combattent aux côtés des irréguliers grecs."
 nd_gre_aegean_brig_design: "Conception du brick égéen"
 nd_gre_aegean_brig_design_desc: "Les constructeurs navals grecs perfectionnent ce brick rapide et bien armé pour en faire leur navire de guerre emblématique : suffisamment agile pour distancer les navires de ligne ennemis, mais doté d'une puissance de feu suffisante pour dominer les eaux insulaires de la mer Égée."
 nd_gre_national_awakening: "Réveil national"
 nd_gre_national_awakening_desc: "La conscience nationale grecque se cristallise en une force politique puissante, unissant les communautés de la diaspora, les marchands insulaires, les guerriers des montagnes et les Phanariotes instruits derrière le rêve d’un État grec indépendant."
 nd_gre_constitution_of_epidaurus: "Constitution d'Épidaure"
 nd_gre_constitution_of_epidaurus_desc: "La Constitution provisoire de 1822, rédigée à Epidaure, établit les fondements de la gouvernance démocratique grecque : un document révolutionnaire qui déclare la souveraineté du peuple grec et garantit les droits individuels."
 nd_gre_hellenic_university: "Université hellénique"
 nd_gre_hellenic_university_desc: "La création d’institutions grecques d’enseignement supérieur transforme Athènes en un centre d’érudition et de culture, formant les administrateurs, les enseignants et les intellectuels qui construiront l’État grec moderne."
 nd_gre_modern_navy: "Marine moderne"
 nd_gre_modern_navy_desc: "La tradition de la marine marchande grecque évolue vers une force navale professionnelle, combinant le matelotage des communautés insulaires avec la doctrine et la technologie navales européennes modernes."
 nd_gre_irredentist_spirit: "Esprit Irrédentiste"
 nd_gre_irredentist_spirit_desc: "La croyance selon laquelle des millions de Grecs vivent encore sous domination étrangère alimente un esprit national expansionniste : la conviction que les frontières de la Grèce doivent englober toutes les terres où la civilisation grecque a pris racine."
 a_nd_gre_armatoloi: "Armatoloi"
 a_nd_gre_armatoloi_desc: "Miliciens chrétiens recrutés dans les hauts plateaux grecs, experts en guerre en montagne et en tactiques de guérilla. Les Armatoloi gardent les cols de montagne et servent de colonne vertébrale militaire à la résistance grecque."
 a_nd_gre_klephts: "Klephts"
 a_nd_gre_klephts_desc: "Bandits des montagnes devenus combattants de la liberté, les Klephts sont passés maîtres dans les embuscades et les raids. Rapides et insaisissables, ils frappent depuis les hautes terres et disparaissent avant que l'ennemi ne puisse répondre."
 n_nd_gre_fire_ship: "Navire de pompiers Hydriote"
 n_nd_gre_fire_ship_desc: "Un petit navire marchand rempli de poudre à canon et de matériaux combustibles, piloté par des volontaires audacieux qui l'enfoncent dans les navires de guerre ennemis. Ce qui lui manque en termes de durabilité est compensé par une puissance offensive dévastatrice."
 a_nd_gre_philhellene_guard: "Garde philhellène"
 a_nd_gre_philhellene_guard_desc: "Infanterie d'élite formée aux méthodes militaires européennes modernes, intégrant à la fois l'esprit combatif grec et la discipline militaire philhellène. Ces troupes représentent l’avenir des armes grecques."
 n_nd_gre_aegean_brig: "Brick égéen"
 n_nd_gre_aegean_brig_desc: "Un navire rapide et bien armé conçu dans les chantiers navals des îles grecques. Le brick Aegean allie vitesse et puissance de feu, excellant dans les patrouilles, les blocus et les raids commerciaux dans les eaux insulaires de la Méditerranée orientale."
 nd_gre_mountain_refuge: "Refuge de montagne Klepht"
 nd_gre_mountain_refuge_desc: "Une cachette fortifiée dans les hauts plateaux grecs, offrant un abri aux résistants et servant de base aux opérations de guérilla contre les envahisseurs."
 nd_gre_athonite_monastery: "Monastère athonite"
 nd_gre_athonite_monastery_desc: "Un centre d'apprentissage orthodoxe calqué sur les grands monastères du Mont Athos, préservant les manuscrits, formant des érudits et servant de phare de l'identité culturelle grecque."
 nd_gre_merchant_house: "Maison marchande grecque"
 nd_gre_merchant_house_desc: "Un établissement commercial géré par la diaspora grecque, reliant les marchés locaux au réseau commercial méditerranéen plus large. Les maisons de marchands grecques dominent le commerce des céréales et des produits de luxe de la Méditerranée orientale."
 nd_gre_hydriote_shipyard: "Chantier naval Hydriote"
 nd_gre_hydriote_shipyard_desc: "Un chantier naval spécialisé dans la tradition des grands centres de construction navale insulaires (Hydra, Spetses et Psara) produisant des navires rapides et bien construits, dotés d'équipages de marins égéens expérimentés."
 nd_gre_phanariot_academy: "Académie Phanariote"
 nd_gre_phanariot_academy_desc: "Une institution d'enseignement fondée par de riches mécènes Phanariot, proposant un enseignement en philosophie classique, en sciences modernes et en langues européennes : le berceau des Lumières grecques."
 nd_gre_olive_press: "Presse à olives"
 nd_gre_olive_press_desc: "Une installation de transformation d'olives grecque traditionnelle, convertissant la récolte d'anciennes plantations en huile, en produits alimentaires et en produits exportables qui soutiennent l'économie méditerranéenne."
 nd_gre_naval_academy: "Académie navale hellénique"
 nd_gre_naval_academy_desc: "Un établissement de formation moderne pour la marine grecque, combinant des siècles de tradition de matelotage égéen avec la science navale européenne pour produire des officiers dignes du patrimoine maritime grec."
 nd_gre_refuge_upkeep: "Entretien de la garnison de montagne"
 nd_gre_refuge_upkeep_desc: "Armes, bétail, tissus et cuir pour armer et soutenir la garnison des hautes terres."
 nd_gre_monastery_maintenance: "Entretien monastique"
 nd_gre_monastery_maintenance_desc: "Papier, cire d'abeille, tissu et verre pour la copie de manuscrits, bougies liturgiques, vêtements et fenêtres."
 nd_gre_merchant_operations: "Opérations marchandes"
 nd_gre_merchant_operations_desc: "Tissu, papier, sel et cire d'abeille consommés dans les opérations quotidiennes et le commerce d'une maison marchande grecque."
 nd_gre_shipyard_maintenance: "Opérations du chantier naval"
 nd_gre_shipyard_maintenance_desc: "Bois, goudron et fournitures navales pour la construction et la réparation des navires."
 nd_gre_academy_costs: "Opérations de l'Académie"
 nd_gre_academy_costs_desc: "Papier, livres, verre et cire d'abeille consommés pour l'enseignement scientifique, l'entretien des bibliothèques et les études du soir."
 nd_gre_olive_pressing: "Production d'huile d'olive"
 nd_gre_olive_pressing_desc: "Pressage traditionnel des olives grecques en huile, un incontournable du commerce et de la cuisine méditerranéenne depuis l'Antiquité."
 nd_gre_currant_export: "Commerce d'exportation de groseilles"
 nd_gre_currant_export_desc: "Transformation et exportation de groseilles grecques, un fruit séché de luxe prisé dans toute l'Europe et l'une des exportations agricoles grecques les plus précieuses."
 nd_gre_naval_academy_costs: "Opérations de l'Académie navale"
 nd_gre_naval_academy_costs_desc: "Armes, papier, fournitures navales et outils pour les exercices d'entraînement, l'instruction à la navigation et le matelotage pratique."
 levy_nd_gre_armatoloi: "Prélèvement Armatoloi"
 levy_nd_gre_armatoloi_desc: "Milice des hautes terres composée de paysans et de soldats grecs, entraînés dans les traditions de guerre en montagne des Armatoloi."
 nd_gre_formed_tt: "La Grèce est formée"
 nd_gre_path_a_tt: "Choisissez l'idée Megali"
 nd_gre_path_b_tt: "Choisissez les Lumières helléniques"
 # ===== DESTINY LOCALIZATION =====
 # Destiny advance names and descriptions
 nd_gre_destiny: "Destin de l'Hellas"
 nd_gre_destiny_desc: "La Grèce se trouve à la croisée des chemins. La nation qui a donné au monde la démocratie, la philosophie et les Jeux Olympiques doit maintenant tracer sa voie à travers une époque d’empires. Atteignez la stabilité pour commencer le voyage."
 nd_gre_dest_straits: "Récupérer le détroit"
 nd_gre_dest_straits_desc: "Le Bosphore et les Dardanelles sont les clés du destin grec. Constantinople, la ville du désir du monde, doit être arrachée aux mains étrangères. Prenez l'ancienne capitale et les détroits qui la gardent et construisez l'armée qui pourra les retenir."
 nd_gre_dest_ionian: "La côte Ionienne"
 nd_gre_dest_ionian_desc: "The western coast of Anatolia was Greek for two thousand years before it was anything else. From Smyrna to Trebizond, Greek communities still endure under foreign rule. Reclaim these lands, and let Smyrna grow into the first port of the Levant under its Greek merchants."
 nd_gre_dest_smyrna_developed_tt: "We own #bold Smyrna#! and its development is at least #bold 44#!"
 nd_gre_dest_megali: "Le Megali réalisé"
 nd_gre_dest_megali_desc: "La Grande Idée atteint son point culminant. D’Antioche à Chypre, les terres de la Méditerranée orientale sont réunies sous la bannière hellénique. C’est la restauration dont des générations de Grecs ont rêvé : la pleine floraison de la civilisation orthodoxe renaissante."
 nd_gre_dest_republic: "La République savante"
 nd_gre_dest_republic_desc: "La Grèce sera une république d'érudits et de marchands, et non une pâle imitation d'empires disparus. Adoptez les nouvelles connaissances, remplissez le trésor grâce au commerce et sécurisez la Crète pour ancrer la puissance maritime grecque en Méditerranée centrale."
 nd_gre_dest_maritime: "Domination maritime"
 nd_gre_dest_maritime_desc: "Greek ships dominate the trade lanes of the Eastern Mediterranean. Silk flows through Greek ports, Greek merchants set prices in every bazaar from Alexandria to Venice. Build up Chios, the home of the great merchant houses, and secure prestige worthy of the heirs of Pericles."
 nd_gre_dest_chios_developed_tt: "We own #bold Chios#! and its development is at least #bold 23#!"
 nd_gre_dest_light: "Lumière du Nouvel Âge"
 nd_gre_dest_light_desc: "Greece becomes what the Enlightenment thinkers always envisioned: a beacon of learning, science, and republican governance that lights the way for the entire world. Embrace the printing press that carries Greek letters home, amass the wealth to sustain a great state, and raise Athens into a capital of learning, so that civilization's torch burns brightest where it was first kindled."
 nd_gre_dest_athens_developed_tt: "We own #bold Athens#! and its development is at least #bold 58#!"
 # Destiny event titles, descriptions, and options
 nd_gre.5.t: "Le destin de l'Hellas"
 nd_gre.5.d: "L’État grec a atteint la stabilité nécessaire pour poursuivre un destin plus grand. Que ce destin réside dans la récupération des terres perdues ou dans la construction d’une nouvelle civilisation, les fondations sont désormais solides. Le chemin à parcourir est long, mais Hellas n’a jamais manqué d’ambition."
 nd_gre.5.a: "Notre destin nous attend."
 nd_gre.6.t: "La traversée du détroit"
 nd_gre.6.d: "Greek soldiers stand where the legions of Justinian once marched. The great dome of the Hagia Sophia, defiled for centuries, is cleansed and reconsecrated. The Ecumenical Patriarch returns to his ancient seat, and the bells of Constantinople ring out across the Bosphorus for the first time in an age.\n\nThe Dardanelles, too, are in Greek hands: the narrow passage that connects the Black Sea to the Mediterranean, the most strategic waterway in the world. No ship passes without Greek permission. The dream of generations is becoming reality."
 nd_gre.6.a: "La Ville est à nouveau à nous !"
 nd_gre.7.t: "Le retour en Ionie"
 nd_gre.7.d: "The Greek tricolor flies over Smyrna's waterfront, where Greek merchants have traded since the age of Homer. In the east, Trebizond (the last outpost of the Roman Empire, which held out for eight years after Constantinople itself had fallen) is Greek again.\n\nBut governing these reconquered lands demands choices. The military imperative calls for strong garrisons and efficient recruitment to hold a vast frontier. The spiritual imperative calls for the restoration of Orthodoxy in lands where the faith was suppressed for centuries, reuniting the Greek world under one church and one civilization."
 nd_gre.7.a: "Garnissez les frontières."
 nd_gre.7.b: "Restaurez la foi."
 nd_gre.8.t: "La grande idée réalisée"
 nd_gre.8.d: "From the Adriatic to the Euphrates, from the Black Sea to Cyprus, the lands where Greek was once the language of empire are united once more. This is what Kolettis proclaimed from the podium in Athens (the Megali Idea, the Great Idea), and it has been achieved in full.\n\nWhat now? Some see a new Byzantium: an empire of thrones and armies, a successor state to the Rome that Constantine built. Others see a shield of Orthodoxy: a sacred commonwealth whose purpose is the defense and propagation of the true faith. The empire is built. Its character remains to be defined."
 nd_gre.8.a: "Nous sommes les héritiers de Byzance."
 nd_gre.8.b: "Nous sommes le bouclier de la chrétienté."
 nd_gre.9.t: "Une République du savoir"
 nd_gre.9.d: "The banking houses of Athens and Thessaloniki hum with activity. Greek merchants have embraced the new financial instruments sweeping Europe, and the treasury swells with the proceeds of maritime commerce. Crete, the great island that guards the southern Aegean, flies the Greek flag, its harbors sheltering the merchant fleet that is the true source of Greek power.\n\nThis is the Greece that Korais imagined: prosperous, educated, modern. Not a revival of ancient empires but something new: a nation that proves the classical virtues of reason and enterprise can flourish in the modern world."
 nd_gre.9.a: "La connaissance est la vraie richesse."
 nd_gre.10.t: "Maîtres des voies maritimes"
 nd_gre.10.d: "Greek ships carry silk and spices from the markets of the East to the harbors of the West. The merchant marine that once traded in currants and olive oil now dominates the luxury trade of the entire Eastern Mediterranean. Greek commercial houses set prices, Greek captains know every current and shoal, Greek factors operate in every port from Marseille to Alexandria.\n\nHow shall this maritime dominion be wielded? Some favor a commercial fleet strategy: expanding raw material production and using diplomatic charm to secure favorable trade agreements across the Mediterranean. Others advocate free port policies: reducing construction costs to build great harbors, attracting vassal trade through generous terms, accepting that military readiness may suffer."
 nd_gre.10.a: "Le commerce et la diplomatie vont de pair."
 nd_gre.10.b: "Ouvrez nos ports à tous ceux qui font du commerce."
 nd_gre.11.t: "La lumière du nouvel âge"
 nd_gre.11.d: "Greece has achieved what the philosophers of the Enlightenment could only dream of. Greek presses print the classics and the new sciences side by side, and the schools are full. Athens is once again a center of learning that rivals any capital in Europe. The wealth of the nation sustains great institutions, and the prestige of the Greek state commands respect from every court and counting house in the world.\n\nTwo visions compete for the soul of this enlightened republic. The heirs of Pericles argue for Athenian democracy: a state that integrates its peoples, governs through popular will, and expands through diplomatic persuasion rather than conquest. The heirs of Themistocles argue for maritime empire: a naval power that projects strength across the seas, hiring the best soldiers money can buy and building a fleet that commands every strait and harbor."
 nd_gre.11.a: "Les urnes, pas l’épée."
 nd_gre.11.b: "Commandez les mers."
 # Destiny timed modifier names and descriptions
 STATIC_MODIFIER_NAME_nd_gre_dest_imperial_garrisons: "Garnisons impériales"
 STATIC_MODIFIER_DESC_nd_gre_dest_imperial_garrisons: "The reconquered lands of Ionia are secured by a network of Greek garrisons, ensuring rapid recruitment and reliable supply lines across the expanded frontier, though the cost of maintaining this military infrastructure strains the treasury."
 STATIC_MODIFIER_NAME_nd_gre_dest_orthodox_restoration: "Restauration orthodoxe"
 STATIC_MODIFIER_DESC_nd_gre_dest_orthodox_restoration: "The Greek church reclaims its ancient role across Ionia and Pontus. Communities that endured centuries of foreign rule are welcomed back into the Orthodox fold, and assimilation proceeds rapidly, though the focus on spiritual renewal slows material construction."
 STATIC_MODIFIER_NAME_nd_gre_dest_new_byzantium: "La nouvelle Byzance"
 STATIC_MODIFIER_DESC_nd_gre_dest_new_byzantium: "Greece proclaims itself the successor to the Roman Empire of the East. The imperial name, a vast army, and the prestige of Constantinople all serve to overawe rivals, though the focus on land power means the navy must make do with less."
 STATIC_MODIFIER_NAME_nd_gre_dest_shield_orthodoxy: "Bouclier de l'Orthodoxie"
 STATIC_MODIFIER_DESC_nd_gre_dest_shield_orthodoxy: "Greece consecrates itself as the defender of the Orthodox faith. The realm holds steady in its faith and the nation negotiates from a position of moral authority, though the costs of maintaining a sacred commonwealth generate some inflationary pressure."
 STATIC_MODIFIER_NAME_nd_gre_dest_commercial_fleet: "Flotte commerciale"
 STATIC_MODIFIER_DESC_nd_gre_dest_commercial_fleet: "Greek merchant ships ply every trade route in the Mediterranean, expanding raw material output and building diplomatic goodwill through profitable commerce, though the commercial orientation leaves the army as an afterthought."
 STATIC_MODIFIER_NAME_nd_gre_dest_free_port: "Politique du port franc"
 STATIC_MODIFIER_DESC_nd_gre_dest_free_port: "Greek harbors welcome all comers with minimal tariffs and generous construction subsidies. Vassal states benefit from Greek commercial infrastructure and repay it with loyalty, though the open economy complicates military supply."
 STATIC_MODIFIER_NAME_nd_gre_dest_athenian_democracy: "La démocratie athénienne renaît"
 STATIC_MODIFIER_DESC_nd_gre_dest_athenian_democracy: "L’esprit de l’agora athénienne revit dans la république grecque moderne. L’État intègre ses peuples par la citoyenneté, gouverne par le consentement populaire et préfère l’absorption diplomatique à la conquête."
 STATIC_MODIFIER_NAME_nd_gre_dest_maritime_empire: "Empire maritime de la mer Égée"
 STATIC_MODIFIER_DESC_nd_gre_dest_maritime_empire: "Greece commands the seas as Themistocles once commanded the fleet at Salamis. Heavy warships project Greek power across the Mediterranean, and foreign mercenaries supplement the citizen levy, though the burdens of a maritime empire breed war-weariness."
 # Destiny building names and descriptions
 nd_gre_imperial_basilica: "Basilique Impériale"
 nd_gre_imperial_basilica_desc: "Une grande basilique orthodoxe construite dans la tradition de Sainte-Sophie, un monument à l'empire hellénique restauré et à la foi durable qui a soutenu le peuple grec à travers des siècles de domination étrangère."
 nd_gre_basilica_maintenance: "Entretien de la basilique"
 nd_gre_basilica_maintenance_desc: "De la cire d'abeille pour les cierges liturgiques, de l'encens pour les encensoirs, du tissu pour les vêtements sacerdotaux et du marbre pour la restauration incessante des mosaïques sacrées."
 nd_gre_hellenic_lyceum: "Lycée hellénique"
 nd_gre_hellenic_lyceum_desc: "Un centre d'apprentissage dans la tradition du Lycée original d'Aristote - combinant philosophie naturelle, mathématiques et science moderne dans une institution qui aspire à faire progresser la connaissance humaine comme le faisaient autrefois les anciens."
 nd_gre_lyceum_maintenance: "Opérations au lycée"
 nd_gre_lyceum_maintenance_desc: "Papier, livres, instruments en verre et outils pour l'expérimentation scientifique, la recherche philosophique et la formation de la prochaine génération d'érudits grecs."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_gre_bureaucracy_authority: "Autorité bureaucratique hellénique"
 AUTO_MODIFIER_DESC_nd_gre_bureaucracy_authority: "The institutions of the Greek lands are kept by the Hellenic state: the Patriarchate's communal courts, the Phanariot dragomanate, the kodjabashi notables, the pact of armatoloi and klephts, the autonomy of Mount Athos and the secretariats of Kapodistrias. Greece can sustain three more standing institutions."


 gre_patriarchikon_bureaucracy: "Patriarchikon"
 gre_patriarchikon_bureaucracy_desc: "La nomination par Mehmed II de Gennadius II Scholarios le 6 janvier 1454 a fait du patriarche œcuménique de Constantinople le mil-basi du Rum, conférant à l'Église la juridiction civile sur le droit de la famille, la résolution des conflits et l'éducation orthodoxe pour chaque chrétien orthodoxe sous la domination ottomane. Le Saint-Synode des douze métropolitains et le Conseil national mixte permanent, codifiés par les ordonnances générales de 1862, firent du Patriarcat le gouvernement laïc et spirituel d'une république orthodoxe qui survécut longtemps à l'Empire qui l'avait nommé."

 gre_phanariotai_bureaucracy: "Phanariotaï"
 gre_phanariotai_bureaucracy_desc: "De 1669 à 1821, les dynasties grecques du quartier Phanar de Constantinople - Mavrokordatos, Ypsilantis, Soutzos, Kallimachi - monopolisèrent les quatre grandes charges de la Sublime Porte : Grand Dragoman de la Porte, Grand Dragoman de la Flotte, et de 1711 à 1714 les hospodarats de Moldavie et de Valachie. Formés au savoir classique et à l'art politique ottoman, ils traduisirent des traités, menèrent la diplomatie impériale et dirigèrent les principautés danubiennes pour le sultan, jusqu'à ce que la révolution grecque de 1821 et l'occupation russe de 1828 mettent fin à leur époque."

 gre_kodjabashides_bureaucracy: "Kodjabashides"
 gre_kodjabashides_bureaucracy_desc: "Les primates chrétiens (proestoi, prokritoi, demogerontes) de la Grèce ottomane se sont consolidés après la reconquête du Péloponnèse en 1715 en une oligarchie héréditaire de propriétaires fonciers fiscalistes. Formalisés vers 1747, les kodjabashides collectaient le cizye et autres prélèvements auprès de la reaya orthodoxe, siégeaient dans les conseils provinciaux ottomans et exerçaient de facto une autonomie judiciaire sur leurs districts. Leurs privilèges ont produit un loyalisme pragmatique que les klephtes et les armatoloi n'aimaient pas, mais que la Sublime Porte cultivait."

 gre_armatoliki_bureaucracy: "Armatoliki"
 gre_armatoliki_bureaucracy_desc: "À partir du milieu du XVe siècle, à partir des premiers armatoliki accordés dans la chaîne d'Agrafa en Thessalie, les Ottomans ont chargé des kapetanioi grecs - souvent d'anciens capitaines klephts transformés - de policer les districts montagneux infestés de brigands en Macédoine, en Épire, en Acarnanie et en Étolie. La frontière entre les armatolos sanctionnés et les klephts hors-la-loi était une question de patronage plutôt que de principe : lorsque la faveur ottomane se détériora, les capitaines s'enfuirent dans les hautes terres et rejoignirent le brigandage que leurs successeurs étaient payés pour supprimer, produisant ainsi le réseau de milices qui formerait le noyau de la révolution de 1821."

 gre_hagion_oros_bureaucracy: "Hagion Oros"
 gre_hagion_oros_bureaucracy_desc: "Bénéficiant d'une autonomie complète et d'une exonération fiscale par Alexios Ier Comnène vers 1095 et confirmée par le firman de Murad II de 1430 en échange d'un tribut annuel, la péninsule monastique du Mont Athos se gouverne elle-même à travers la Sainte Communauté de vingt monastères dirigeants qui se réunit à Karyes. Au cours de quatre siècles de domination ottomane, les scriptoria athonites ont préservé l'héritage classique et patristique grec, les ateliers de peinture d'icônes ont soutenu la continuité artistique byzantine et l'interdiction faite aux femmes et aux seigneurs féodaux a fait de la Montagne Sainte une île souveraine de spiritualité orthodoxe en dehors de toute juridiction temporelle."

 gre_kapodistriaka_grammateia_bureaucracy: "Kapodistriaka Grammateia"
 gre_kapodistriaka_grammateia_bureaucracy_desc: "Arrivé à Nauplie le 7 janvier 1828, Ioannis Kapodistrias suspendit la constitution de Trézène et gouverna par cinq secrétariats centralisés (Intérieur, Finances, Affaires ecclésiastiques et Instruction publique, Justice, Guerre et Marine) soutenus par le conseil consultatif du Panellinion. Il fonda la Banque nationale, frappa le phénix, fonda la première Académie militaire hellénique, dissout le Sénat du Péloponnèse et arrêta le Maniot bey Petrobey Mavromichalis, dont les fils l'assassinèrent à l'église de Saint Spyridon le 27 septembre 1831 - prix pour imposer un État unifié aux capitaines de clan qui avaient gagné la guerre."
