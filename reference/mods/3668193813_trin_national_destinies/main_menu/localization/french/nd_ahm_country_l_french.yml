l_french:
 AHM: "Ahom"
 AHM_ADJ: "Ahom"
 AHM_f: "Royaume Ahom"
 AHM_f_desc: "Restaurer le mandat des Swargadeo sur la vallée du Brahmapoutre. Six siècles de règne des Tai-Ahom ont tenu cette partie de l'Asie du Sud contre chaque vague d'envahisseurs, repoussant les Moghols dix-sept fois et liant les collines, les vallées et les rivières sous les chroniques de la cour de Buranji, le système de corvée paik et une religion qui a tissé l'animisme Tai dans la dévotion Saiva et Vaishnava. Le royaume invaincu de Charaideo renaît."
