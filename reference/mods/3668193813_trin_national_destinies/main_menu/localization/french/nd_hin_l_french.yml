l_french:
 STATIC_MODIFIER_NAME_nd_padshah_e_hind: "Padshah-e-Hind"
 STATIC_MODIFIER_DESC_nd_padshah_e_hind: "L'empereur de l'Inde commande les armées les plus puissantes de l'Est. Des éléphants de guerre à la cavalerie massive en passant par les mousquetaires disciplinés, les traditions martiales d'un continent répondent à un trône unique."
 STATIC_MODIFIER_NAME_nd_daulat_e_hindustan: "Daulat-e-Hindustan"
 STATIC_MODIFIER_DESC_nd_daulat_e_hindustan: "La richesse de l'Inde découle de ses métiers à tisser et de ses champs. La mousseline bengali, le calicot gujarati et les épices de Malabar affluent dans les trésors d'un sous-continent unifié, attirant des marchands des quatre coins du monde."
 STATIC_MODIFIER_NAME_nd_chakravarti_samrat: "Chakravarti Samrat"
 STATIC_MODIFIER_DESC_nd_chakravarti_samrat: "L'Empereur Universel règne par mandat divin et avec le consentement d'une centaine de cours vassales. Comme Ashoka avant lui, le Chakravarti lie le sous-continent non seulement par la force, mais par la légitimité d’une gouvernance juste."
 nd_hin.1.t: "L'unification de l'Hindoustan"
 nd_hin.1.d: "The dream of centuries is realized. From the snowy passes of the Hindu Kush to the tropical shores of Cape Comorin, from the salt marshes of Kutch to the river deltas of Bengal, the subcontinent answers to one sovereign. This is not merely the conquest of territory, but the forging of a civilization-state. The legacy of Ashoka, the ambition of Alauddin Khalji, the vision of Akbar, all converge in this moment. But what shape will this new Hindustan take? Will it be an empire of the sword, imposing order through military supremacy? A land of merchants and artisans, whose wealth draws the envy of the world? Or a sovereign guided by the ancient ideal of the Chakravarti, the wheel-turning monarch who rules through righteousness?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_hin.1.a: "Nous sommes le Padshah-e-Hind, l'empereur de toute l'Inde"
 nd_hin.1.b: "Nous sommes le Daulat-e-Hindustan, la richesse de l'Inde"
 nd_hin.1.c: "Nous sommes le Chakravarti Samrat, l'Empereur Universel"
 nd_hin.2.t: "Le système Mansabdari"
 nd_hin.2.d: "L’administration d’un sous-continent exige plus que de l’énergie brute, elle nécessite du système. Les rangs mansabdari, codifiés pour la première fois par Akbar en 1571, attribuent à chaque noble un grade numérique qui détermine à la fois son allocation personnelle et son obligation d'entretenir la cavalerie. Un mansabdar de 5 000 zat et 5 000 sawar doit entretenir cinq mille cavaliers à ses propres frais, financés par des missions de revenus temporaires appelées jagirs. Le système est brillamment flexible : un mansabdar peut être promu, rétrogradé ou transféré selon la volonté de l'empereur. Aucun fief héréditaire ne s’enracine. Aucun chef de guerre régional ne s’installe. L’ensemble de l’appareil impérial, militaire, fiscal, administratif, fonctionne comme une extension de la personne du souverain. Mais sur quel aspect de ce système devons-nous insister ? Le mérite bureaucratique qui fait du mansabdari une machine de gouvernance, ou l’obligation militaire qui en fait un instrument de guerre ?"
 nd_hin.2.a: "Promouvoir par le mérite, récompenser la compétence et non la naissance"
 nd_hin.2.b: "Renforcer l'obligation de cavalerie ; nos cavaliers sont notre force"
 nd_hin.3.t: "Les Karkhanas impériaux"
 nd_hin.3.d: "Les karkhanas sont la fierté de la maison impériale, de vastes ateliers où des centaines d'artisans travaillent sous le patronage impérial pour produire des biens d'une qualité inégalée. Dans le karkhana-yi-shahi d'Agra et de Fatehpur Sikri, les tisserands créent des tissus d'or et de fine mousseline si fins qu'un boulon de vingt mètres peut passer à travers une bague. Les peintres enluminent les manuscrits dans le style miniature persan, tandis que les armuriers forgent l'acier de Damas pour en faire des armes d'un savoir-faire exquis. Les karkhanas ont un double objectif : ils fournissent à la cour le luxe le plus raffiné, démontrant la magnificence impériale aux ambassades et aux marchands en visite, tout en fournissant également à l'armée des armes, des armures et des équipements standardisés. Devons-nous orienter les karkhanas vers l’enrichissement du trésor grâce aux exportations de textiles, ou vers l’équipement de l’armée la plus redoutable d’Asie ?"
 nd_hin.3.a: "Les métiers à tisser habilleront le monde : les tissus de l'Hindoustan sont notre or"
 nd_hin.3.b: "Les forges armeront l'empire ; nos armes doivent être sans égal"
 nd_hin.4.t: "Sulh-i-Kul : Paix universelle"
 nd_hin.4.d: "Dans un sous-continent d’hindous et de musulmans, de jaïns et de bouddhistes, de sikhs et de chrétiens, de zoroastriens et de juifs, la question de la coexistence religieuse n’est pas académique : elle est existentielle. La doctrine de Sulh-i-Kul, la paix universelle entre toutes les religions, représente la réponse la plus audacieuse. Exprimé pour la première fois dans l'Ibadat Khana, la maison d'adoration de Fatehpur Sikri où Akbar a invité les érudits de toutes les confessions à débattre, Sulh-i-Kul soutient qu'aucune religion ne possède à elle seule la vérité complète. La taxe jizya pour les non-musulmans est abolie. Les fêtes hindoues sont célébrées à la cour. Les mystiques soufis et les érudits brahmanes conseillent l'empereur dans une égale mesure. L'Ibadat Khana devient le symbole vivant d'une civilisation suffisamment confiante pour contenir des multitudes."
 nd_hin.4.a: "Que toutes les religions s'épanouissent sous notre protection"
 nd_hin.5.t: "La grande route nationale"
 nd_hin.5.d: "Le Sadak-e-Azam, la Grande Route, est l’artère principale du sous-continent. Aménagé à l'origine à l'époque Mauryan, il a été transformé par Sher Shah Suri en une merveille d'infrastructure impériale. Plus de trois mille kilomètres de routes pavées s'étendent du Bengale à la frontière nord-ouest, bordées tous les deux kos de sarais où les voyageurs trouvent repos, fourrage et protection. Des arbres d'ombrage sont plantés sur toute sa longueur ; des puits sont creusés à intervalles réguliers ; les soldats patrouillent contre les bandits. La route transporte non seulement des marchandises mais aussi la gouvernance elle-même, les dépêches impériales parcourent son longueur en plusieurs jours, reliant la cour moghole à ses provinces les plus éloignées. Ce qui prenait autrefois des mois prend désormais des semaines."
 nd_hin.5.a: "La route lie l'empire aussi sûrement que n'importe quelle armée"
 STATIC_MODIFIER_NAME_nd_hin_mansabdar_merit: "Méritocratie Mansabdari"
 STATIC_MODIFIER_DESC_nd_hin_mansabdar_merit: "Le système mansabdari récompense le talent plutôt que la naissance, attirant les administrateurs les plus compétents du sous-continent au service impérial."
 STATIC_MODIFIER_NAME_nd_hin_mansabdar_military: "Cavaliers Mansabdari"
 STATIC_MODIFIER_DESC_nd_hin_mansabdar_military: "L'obligation mansabdari garantit que chaque noble maintient une cavalerie proportionnelle à son rang, créant ainsi une vaste réserve de cavaliers entraînés."
 STATIC_MODIFIER_NAME_nd_hin_karkhana_textiles: "Exportations de textiles de Karkhana"
 STATIC_MODIFIER_DESC_nd_hin_karkhana_textiles: "Les ateliers impériaux produisent de la mousseline, du calicot et du drap d'or destinés à l'exportation vers les marchés du monde connu."
 STATIC_MODIFIER_NAME_nd_hin_karkhana_weapons: "Production d'armes de Karkhana"
 STATIC_MODIFIER_DESC_nd_hin_karkhana_weapons: "Les forges impériales standardisent la production d'armes, équipant les armées de l'Hindoustan de fusils à mèche, de canons et de lames en acier Damas."
 nd_hin_elephant_warfare: "Guerre des éléphants"
 nd_hin_elephant_warfare_desc: "L’éléphant de guerre domine les champs de bataille indiens depuis l’Antiquité. Blindées et équipées d'archers, ces forteresses vivantes peuvent briser n'importe quelle formation."
 nd_hin_temple_architecture: "Architecture des temples"
 nd_hin_temple_architecture_desc: "Les imposants temples Shikhara de l'Inde, avec leurs sculptures en pierre complexes et leurs flèches vertigineuses, sont autant de monuments de dévotion et de maîtrise artistique."
 nd_hin_varna_governance: "Gouvernance de Varna"
 nd_hin_varna_governance_desc: "La hiérarchie sociale complexe du système jati fournit un cadre de gouvernance, chaque communauté remplissant des rôles spécialisés au sein de l'ordre impérial."
 nd_hin_spice_trade: "Commerce des épices"
 nd_hin_spice_trade_desc: "Le monopole indien sur le poivre, la cardamome, la cannelle et les clous de girofle attire les commerçants de Rome vers la Chine depuis des millénaires."
 nd_hin_sarai_networks: "Réseaux Saraï"
 nd_hin_sarai_networks_desc: "The system of imperial sarais provides lodging, stabling, and security for merchants and travelers along the great trade routes of India."
 nd_hin_jagirdari_system: "Système Jagirdari"
 nd_hin_jagirdari_system_desc: "Les concessions de terres de Jagir soutiennent une aristocratie militaire obligée de maintenir la cavalerie et l'infanterie au service de l'empereur."
 nd_hin_sultanate_court: "Cour du Sultanat"
 nd_hin_sultanate_court_desc: "Les cours du sultanat de Delhi ont fusionné la culture littéraire persane avec les traditions artistiques indiennes, produisant ainsi une civilisation courtoise cosmopolite."
 nd_hin_sowar_tradition: "Tradition Sowar"
 nd_hin_sowar_tradition_desc: "Les sowar, cavaliers lourdement blindés équipés de lance, d'épée et d'arc composite, forment la cavalerie d'élite de la tradition militaire du sultanat."
 nd_hin_grand_trunk_road: "Grande route nationale"
 nd_hin_grand_trunk_road_desc: "Le Sadak-e-Azam s'étend sur plus de trois mille kilomètres du Bengale jusqu'à la frontière nord-ouest, la plus grande autoroute d'Asie."
 nd_hin_textile_mastery: "Maîtrise textile"
 nd_hin_textile_mastery_desc: "Indian textiles, Bengali muslin, Gujarati calico, Kashmiri shawls, are prized across the world for their fineness and artistry."
 nd_hin_mansabdari_system: "Système Mansabdari"
 nd_hin_mansabdari_system_desc: "Le système mansabdari attribue à chaque noble un rang numérique déterminant son salaire, ses obligations de cavalerie et ses responsabilités administratives."
 nd_hin_barqandaz_tradition: "Tradition de Barqandaz"
 nd_hin_barqandaz_tradition_desc: "Les barqandaz, infanterie armée à mèche, amènent la guerre à la poudre sur le champ de bataille indien avec des tirs de volée disciplinés."
 nd_hin_sulh_i_kul: "Sulh-i-Kul"
 nd_hin_sulh_i_kul_desc: "La doctrine de la paix universelle entre les religions soutient qu’aucune religion ne possède la vérité complète et que toutes peuvent prospérer sous la protection de l’empereur."
 nd_hin_imperial_karkhanas: "Karkhanas impériaux"
 nd_hin_imperial_karkhanas_desc: "Les karkhanas royaux sont de vastes ateliers impériaux où les artisans produisent des textiles, des armes, des bijoux et des manuscrits sous le patronage direct de l'État."
 nd_hin_silahdar_guards: "Gardes Silahdar"
 nd_hin_silahdar_guards_desc: "Les Silahdar sont les gardes du corps de cavalerie personnels de l'empereur, équipés des plus belles armures et armes des karkhanas impériaux."
 nd_hin_maktab_system: "Système Maktab"
 nd_hin_maktab_system_desc: "Le réseau d’écoles primaires maktab propose une alphabétisation de base et un enseignement coranique, étendant l’apprentissage au-delà des tribunaux et des madrasas."
 nd_hin_zabt_revenue: "Système de revenus Zabt"
 nd_hin_zabt_revenue_desc: "Le système zabt d'Akbar normalise la mesure des terres et l'évaluation des impôts, remplaçant les exactions arbitraires par une collecte de revenus mesurée et prévisible."
 nd_hin_rocket_corps: "Corps de fusée"
 nd_hin_rocket_corps_desc: "Les roquettes à enveloppe en fer, mises au point à Mysore par Hyder Ali et perfectionnées par Tipu Sultan, représentent une avancée révolutionnaire dans la technologie de l'artillerie."
 nd_hin_princely_diplomacy: "Diplomatie princière"
 nd_hin_princely_diplomacy_desc: "Le réseau complexe de traités, d’hommages et d’alliances matrimoniales liant des centaines d’États princiers au centre impérial."
 nd_hin_bengal_textiles: "Textiles du Bengale"
 nd_hin_bengal_textiles_desc: "Le Bengale produit la mousseline la plus fine au monde, un tissu si fin qu'on l'appelle « air tissé ». Ces tissus se vendent à des prix extraordinaires sur les marchés européens et asiatiques."
 a_nd_hin_war_elephant: "Éléphant de guerre"
 a_nd_hin_war_elephant_desc: "Éléphants blindés portant des howdahs remplis d'archers et de lanceurs de javelot. Leur charge peut briser les formations ennemies et provoquer la panique chez les chevaux."
 a_nd_hin_sowar: "Sowar"
 a_nd_hin_sowar_desc: "Cavaliers lourdement blindés de la tradition du sultanat, équipés d'une lance, d'une épée tulwar et d'un arc composite."
 a_nd_hin_barqandaz: "Barqandaz"
 a_nd_hin_barqandaz_desc: "Mousquetaires à mèche disciplinés qui lancent des tirs de volée dévastateurs depuis des positions préparées."
 a_nd_hin_barqandaz_levy: "Prélèvements de Barqandaz"
 a_nd_hin_barqandaz_levy_desc: "L'infanterie provinciale à mèche levée grâce au système de prélèvement, fournissant l'épine dorsale de la poudre à canon des armées de campagne indiennes."
 a_nd_hin_silahdar: "Silahdar"
 a_nd_hin_silahdar_desc: "La cavalerie d'élite de la maison de l'empereur, vêtue des plus belles armures et brandissant des armes forgées dans les karkhanas impériaux."
 a_nd_hin_rocket_corps: "Corps de fusée"
 a_nd_hin_rocket_corps_desc: "Troupes d'artillerie spécialisées équipées de roquettes à enveloppe en fer pouvant être tirées en salves rapides pour dévaster les formations ennemies à distance."
 nd_hin_sarai: "Saraï"
 nd_hin_sarai_desc: "Une auberge impériale en bord de route offrant un hébergement, des écuries et des installations de marché aux marchands et aux voyageurs le long des routes commerciales."
 nd_hin_sarai_upkeep: "Dispositions de Saraï"
 nd_hin_sarai_upkeep_desc: "Maintaining a sarai requires grain for travelers, fodder for their animals and firewood for the kitchens."
 nd_hin_karkhana: "Karkhana"
 nd_hin_karkhana_desc: "Un atelier impérial où des artisans qualifiés produisent des textiles, de la ferronnerie et des produits de luxe sous le patronage de l'État."
 nd_hin_karkhana_operation: "Opérations Karkhana"
 nd_hin_karkhana_operation_desc: "Les artisans impériaux teignent et tissent des tissus bruts pour en faire des textiles fins d'une qualité inégalée."
 nd_hin_ibadat_khana: "Ibadat Khana"
 nd_hin_ibadat_khana_desc: "Un lieu de culte où les érudits de toutes confessions se réunissent pour débattre de théologie, incarnant l'idéal de coexistence religieuse."
 nd_hin_ibadat_khana_upkeep: "Entretien scolaire"
 nd_hin_ibadat_khana_upkeep_desc: "Soutenir les érudits et les scribes qui travaillent à l'Ibadat Khana nécessite du papier pour leurs écrits, du tissu pour l'ameublement et de l'encens pour les cérémonies religieuses."
 nd_hin_maktab: "Maktab"
 nd_hin_maktab_desc: "Une école primaire dispensant un enseignement d’alphabétisation et d’instruction religieuse, étendant l’apprentissage au-delà de l’élite."
 nd_hin_maktab_upkeep: "Fournitures Maktab"
 nd_hin_maktab_upkeep_desc: "Du papier et du matériel d'écriture pour les étudiants et les enseignants du maktab, complétés par des livres et des bougies en cire d'abeille pour l'étude du soir."
 nd_hin_jagir: "Domaine Jagir"
 nd_hin_jagir_desc: "Domaine militaire foncier dont le détenteur est tenu d'entretenir la cavalerie et les soldats pour le service impérial."
 nd_hin_jagir_upkeep: "Entretien de Jagir"
 nd_hin_jagir_upkeep_desc: "Chevaux, armes et cuir pour harnais et armures entretenus par l'obligation de cavalerie du jagirdar."
 nd_hin_shikhara_temple: "Temple Shikhara"
 nd_hin_shikhara_temple_desc: "Un imposant temple hindou avec des flèches en pierre finement sculptées, un centre de dévotion, de pèlerinage et de vie culturelle."
 nd_hin_temple_upkeep: "Entretien des temples"
 nd_hin_temple_upkeep_desc: "Pierre pour l’entretien et l’agrandissement continus du complexe du temple, ainsi que de l’encens et de la cire d’abeille pour le rituel quotidien."
 nd_hin_rangkhana: "Rangkhana"
 nd_hin_rangkhana_desc: "A dye house of the rangrez, the dyers of Hindustan. Cloth is washed in running water between the dye baths, so it is built on a river."
 nd_hin_textile_dyeing_pm: "Teinture textile"
 nd_hin_textile_dyeing_pm_desc: "Cotton cloth is steeped in alum and dyed with madder and indigo. The colors hold through washing, and are prized across the world."
 levy_nd_hin_war_elephant: "Prélèvement sur les éléphants de guerre"
 levy_nd_hin_war_elephant_desc: "Éléphants élevés dans les domaines nobles et les garnisons provinciales pour le service impérial."
 levy_nd_hin_barqandaz: "Prélèvement de Barqandaz"
 levy_nd_hin_barqandaz_desc: "Infanterie à mèche à mèche élevée grâce au système de prélèvement provincial."
 nd_hin_formed_tt: "L'Hindoustan a été formé"
 nd_hin_path_a_tt: "Choisissez Padshah-e-Hind"
 nd_hin_path_b_tt: "Choisissez Daulat-e-Hindustan"
 nd_hin_path_c_tt: "Choisissez Chakravarti Samrat"
 nd_hin_destiny: "Destin de l'Hindoustan"
 nd_hin_destiny_desc: "Le sous-continent est uni, mais l’unité n’est qu’un début. Le destin de l’Hindoustan reste à écrire : l’Inde se tournera-t-elle vers l’extérieur pour conquérir ou vers l’intérieur pour prospérer ?"
 nd_hin_dest_frontier: "La frontière du Nord-Ouest"
 nd_hin_dest_frontier_desc: "Secure Kabul and Kandahar, the mountain passes that control access to the subcontinent. No emperor of India is safe while these gates remain in foreign hands."
 nd_hin_dest_persia: "La conquête de la Perse"
 nd_hin_dest_persia_desc: "Suivez les traces des Ghaznavides et des Timurides. Prenez Ispahan et Herat, plaçant l’ancien cœur de la Perse sous la domination hindoustanie."
 nd_hin_dest_imperium: "Imperium universel"
 nd_hin_dest_imperium_desc: "The ultimate expression of Hindustani power: Baghdad, seat of the Abbasid caliphs, and Mecca, the holy city of Islam, both under the Padshah's rule. This is the empire that Alexander dreamed of. Armies bound so far west march by the Grand Trunk Road, which must be built first."
 nd_hin_dest_ports: "Les ports occidentaux"
 nd_hin_dest_ports_desc: "Surat et Goa dominent la côte ouest de l'Inde, où les marchands européens arrivent affamés d'épices et de textiles. Contrôlez ces ports et contrôlez les richesses qu’ils génèrent."
 nd_hin_dest_prosperity: "La prospérité de l'Inde"
 nd_hin_dest_prosperity_desc: "Adoptez des institutions bancaires modernes et développez le commerce de la soie. La richesse de l’Inde est légendaire : faites de cette légende une réalité qui transformera l’économie."
 nd_hin_dest_ocean: "Maître de l'Océan Indien"
 nd_hin_dest_ocean_desc: "Control Hormuz and Aden, the chokepoints that command all trade between East and West. Every ship carrying spices, silk, or cotton must pass through Hindustani waters."
 nd_hin.6.t: "Le destin de l'Hindoustan"
 nd_hin.6.d: "L’Inde est unifiée. Le grand sous-continent, qui abrite des centaines de millions d’habitants, répond à un seul souverain. Mais que se passe-t-il ensuite ? Les armées du Padshah ont fait leurs preuves contre tous les challengers du sous-continent. Est-ce qu'ils regardent désormais au-delà de ses frontières ? Ou bien la véritable force de l’Hindoustan ne réside-t-elle pas dans la conquête mais dans la richesse inimaginable qui circule à travers ses marchés et ses ports ?"
 nd_hin.6.a: "Notre destin attend"
 nd_hin.7.t: "La frontière du Nord-Ouest"
 nd_hin.7.d: "Les cols de l'Hindu Kush ont été la voie d'invasion de tous les conquérants qui ont jamais menacé l'Inde - d'Alexandre de Macédoine aux Ghaznavides en passant par Timur lui-même. Aujourd’hui, pour la première fois, un empereur de l’Inde détient ces portes de montagne. Kaboul et Kandahar sont à nous, et avec eux la certitude qu'aucune armée ne descendra plus jamais par le Khyber pour ravager les plaines de l'Hindoustan. La frontière est sécurisée. Mais pour le Padshah, ce n’est pas un point final : c’est un tremplin."
 nd_hin.7.a: "Les portes de l'Inde sont entre nos mains"
 nd_hin.8.t: "La conquête de la Perse"
 nd_hin.8.d: "Ispahan est tombée. Hérat est tombée. L'ancien cœur de la civilisation perse, qui abrite poètes, philosophes, astronomes et architectes, appartient désormais au Padshah de l'Hindoustan. Il ne s’agit pas d’un simple raid frontalier : c’est le renversement de siècles d’histoire, lorsque les rois perses et les conquérants turcs envahissaient les cols pour piller l’Inde. Aujourd’hui, l’Inde est revenue en arrière. La question est de savoir comment gouverner ces vastes nouveaux territoires. Allons-nous absorber leur peuple dans notre empire, mêlant civilisations perse et indienne ? Ou devons-nous extraire leurs richesses pour alimenter de nouvelles conquêtes ?"
 nd_hin.8.a: "Intégrer la Perse dans notre empire"
 nd_hin.8.b: "Dépouiller leurs trésors et armer nos légions"
 nd_hin.9.t: "Imperium universel"
 nd_hin.9.d: "Bagdad et La Mecque s'inclinent devant le Padshah. Le siège du califat abbasside et la ville la plus sainte de l’Islam se trouvent tous deux dans les domaines hindoustani. Aucun souverain depuis les premiers califes n’a détenu une telle combinaison de pouvoir temporel et d’autorité religieuse. L'empire s'étend du Gange au Tigre, des villes saintes d'Arabie jusqu'aux routes de la soie d'Asie centrale. C’est la monarchie universelle que Timur et Alexandre recherchaient tous deux mais qu’aucun d’eux n’a réalisée. Comment l’histoire se souviendra-t-elle de cet exploit ?"
 nd_hin.9.a: "Comme l'empereur Ghazi, défenseur de la foi"
 nd_hin.9.b: "En tant qu'héritier d'Alexandre, souverain de toute l'Asie"
 nd_hin.10.t: "Les ports occidentaux"
 nd_hin.10.d: "Surat and Goa are ours. The great harbors of India's western coast, where ships from Arabia, Persia, East Africa, and Europe converge, now fly the banner of Hindustan. Portuguese carracks and Arab dhows alike must negotiate with Hindustani port authorities. The customs revenues alone are staggering, but the true value is strategic. Whoever controls these ports controls the flow of goods between East and West."
 nd_hin.10.a: "La richesse du monde passe entre nos mains"
 nd_hin.11.t: "La prospérité de l'Inde"
 nd_hin.11.d: "L'économie indienne a atteint un nouveau niveau de sophistication. Les banques, calquées sur les shroffs et les hundis du Gujarat, facilitent le commerce sur de vastes distances. La soie circule sur nos marchés, reliant l’Inde aux réseaux commerciaux de luxe de la Chine et de la Perse. Les fondements institutionnels d’une économie moderne prennent forme. Mais comment diriger cette prospérité ? Vers les exportations textiles qui ont déjà fait de l’Inde l’atelier du monde ? Ou envers les institutions bancaires qui promettent de transformer la manière dont la richesse elle-même est créée et gérée ?"
 nd_hin.11.a: "Les métiers à tisser de l'Inde habilleront le monde"
 nd_hin.11.b: "Nos banques rivaliseront avec les Médicis"
 nd_hin.12.t: "Maître de l'Océan Indien"
 nd_hin.12.d: "Ormuz et Aden sont à nous. Les deux grands points d’étranglement de l’océan Indien (le détroit d’Ormuz commandant le golfe Persique et Aden commandant la mer Rouge) sont désormais sous contrôle hindoustani. Chaque balle de soie, chaque sac de poivre, chaque coffre de coton qui circule entre l'Est et l'Ouest doit passer par les eaux que nous contrôlons. Les Portugais rêvaient de contrôler ce commerce depuis leurs usines dispersées; nous y sommes parvenus grâce au simple poids de l’empire continental projeté sur les mers. Allons-nous imposer un monopole du fer sur ces routes, ou en faire des centres commerciaux cosmopolites qui attirent des marchands de toutes les nations ?"
 nd_hin.12.a: "Renforcer notre monopole maritime"
 nd_hin.12.b: "Que toutes les nations commercent sous notre protection"
 STATIC_MODIFIER_NAME_nd_hin_dest_persian_integration: "Intégration persane"
 STATIC_MODIFIER_DESC_nd_hin_dest_persian_integration: "Les administrateurs, poètes et érudits persans sont absorbés par le système impérial, enrichissant la culture hindoustanie des anciennes traditions iraniennes."
 STATIC_MODIFIER_NAME_nd_hin_dest_persian_plunder: "Pillage de la Perse"
 STATIC_MODIFIER_DESC_nd_hin_dest_persian_plunder: "La richesse de la Perse alimente une expansion militaire rapide, finançant de nouveaux régiments et fortifications à travers l’empire."
 STATIC_MODIFIER_NAME_nd_hin_dest_ghazi_emperor: "Empereur Ghazi"
 STATIC_MODIFIER_DESC_nd_hin_dest_ghazi_emperor: "Le Padshah est reconnu comme le guerrier suprême de la foi, dont les conquêtes de l'Inde à l'Arabie ont uni le monde islamique sous un seul souverain."
 STATIC_MODIFIER_NAME_nd_hin_dest_alexander_heir: "Héritier d'Alexandre"
 STATIC_MODIFIER_DESC_nd_hin_dest_alexander_heir: "L'empire du Padshah s'étend du Gange au Tigre, dépassant même le domaine d'Alexandre. Les peuples assujettis sont intégrés dans une monarchie universelle."
 STATIC_MODIFIER_NAME_nd_hin_dest_textile_empire: "Empire textile"
 STATIC_MODIFIER_DESC_nd_hin_dest_textile_empire: "Les exportations indiennes de coton, de mousseline et de soie dominent les marchés mondiaux, faisant de l'Hindoustan l'atelier du monde."
 STATIC_MODIFIER_NAME_nd_hin_dest_banking_houses: "Maisons bancaires"
 STATIC_MODIFIER_DESC_nd_hin_dest_banking_houses: "Des institutions financières sophistiquées (les shroffs, les hundis et les mahajans) facilitent le commerce et les investissements à travers le sous-continent."
 STATIC_MODIFIER_NAME_nd_hin_dest_maritime_monopoly: "Monopole maritime"
 STATIC_MODIFIER_DESC_nd_hin_dest_maritime_monopoly: "L’Hindoustan exerce un contrôle exclusif sur les routes commerciales de l’océan Indien, taxant chaque cargaison qui passe par ses points d’étranglement."
 STATIC_MODIFIER_NAME_nd_hin_dest_cosmopolitan_ports: "Ports cosmopolites"
 STATIC_MODIFIER_DESC_nd_hin_dest_cosmopolitan_ports: "Les grands ports de l’Hindoustan accueillent des marchands de toutes les nations, devenant des centres cosmopolites dynamiques où convergent les cultures et les marchandises."
 nd_hin_diwan_i_am: "Diwan-je-Suis"
 nd_hin_diwan_i_am_desc: "La salle de l'audience publique, où le Padshah rend la justice et reçoit les tributs de ses vastes domaines."
 nd_hin_diwan_upkeep: "Entretien des tribunaux"
 nd_hin_diwan_upkeep_desc: "Du tissu fin pour les courtisans, du papier pour les scribes et des meubles pour la grande salle d'audience."
 nd_hin_bandar: "Bandar"
 nd_hin_bandar_desc: "Autorité portuaire impériale régissant les grands ports de commerce de la côte de l'océan Indien."
 nd_hin_bandar_upkeep: "Entretien portuaire"
 nd_hin_bandar_upkeep_desc: "Bois d'œuvre, goudron et outils pour l'entretien des quais, entrepôts et installations portuaires du port impérial."

 # ===== BUREAUCRACIES =====
 hin_dharmasastra_council_bureaucracy: "Conseil du Dharmasastra"
 hin_dharmasastra_council_bureaucracy_desc: "Un banc permanent de juristes pandits à Varanasi, Mithila, Nadia et Tirupati délivrant des nibandhas contraignants tirés du Manusmriti, du Yajnavalkya Smriti et du Mitakshara de Vijnaneshvara. En codifiant le devoir de caste, l'héritage et les obligations rituelles, le conseil construit le socle juridique sur lequel repose la société civile hindoue : un appareil juridique dont les tribunaux coloniaux hériteront plus tard sous le nom de « droit anglo-hindou »."

 hin_mathadhipati_network_bureaucracy: "Réseau Mathadhipati"
 hin_mathadhipati_network_bureaucracy_desc: "Les quatre sièges cardinaux Shankaracharya fondés par Adi Shankara au huitième siècle (Sringeri au sud, Govardhan à Puri à l'est, Dvaraka à l'ouest et Jyotirmath dans l'Himalaya) rejoints par le Kanchi Kamakoti. En 1336, Vidyaranya de Sringeri sanctifia les frères Harihara et Bukka comme premiers rois de Vijayanagara, un précédent pour les sièges monastiques légitimant les souverains et disciplinant la dérive doctrinale à travers le sous-continent."

 hin_devasthanam_trusts_bureaucracy: "Fiducies Devasthanam"
 hin_devasthanam_trusts_bureaucracy_desc: "Les grandes économies de temples de Tirupati Tirumala, Jagannath Puri, Madurai Meenakshi, Somnath et Rameswaram, détenaient au XIVe siècle de vastes dotations foncières, géraient des banques de dépôts, entretenaient des réserves de céréales et nourrissaient quotidiennement des dizaines de milliers de personnes via le système prasadam. Le temple de Tirumala est devenu à lui seul l’institution la plus riche du début de l’Inde du Sud moderne : une économie sacrée parallèle en dehors des livres de recettes du roi."

 hin_mahanavami_court_bureaucracy: "Cour Mahanavami"
 hin_mahanavami_court_bureaucracy_desc: "Le festival royal de neuf jours organisé à Vijayanagara pendant Navaratri, décrit en détail par Domingo Paes et Abdul Razzaq Samarqandi dans les années 1440 et 1520. Devant les Nayaks assemblés, le roi exerçait sa souveraineté : un tribut était payé, des revues militaires étaient organisées et la hiérarchie feudataire du royaume était remise en scène chaque année. Relancé sous une forme modifiée par les Marathes sous le nom de cour de Dussehra à Pune et Satara."

 hin_nayankara_system_bureaucracy: "Système Nayankara"
 hin_nayankara_system_bureaucracy_desc: "L'ordre militaire de Vijayanagara dans lequel les Nayaks (des chefs guerriers issus en grande partie des communautés Telugu Kamma et Balija) détenaient des terres amaram en échange de quotas de cavalerie. Le système a déployé l'armée de l'empire à faible coût monétaire, mais a délégué un véritable pouvoir territorial aux Nayaks, qui sont devenus les États successeurs de Madurai, Tanjavur et Gingee après la catastrophe de Talikota en 1565."

 hin_tirtha_mela_bureaucracy: "Administration de Tirtha Mela"
 hin_tirtha_mela_bureaucracy_desc: "La gouvernance rotative des grandes fêtes de pèlerinage : le Kumbh à Prayag, Haridwar, Ujjain et Nashik sur un cycle de douze ans ; Ratha Yatra de Jagannath à Puri ; le Mahamaham à Kumbakonam; les jours de baignade à Rameswaram. Une géographie sacrée panindienne administrée par des collèges brahmanes tournants qui liaient les régions éloignées à un calendrier rituel commun bien avant qu’un centre politique ne le puisse."

 hin_ashta_pradhan_bureaucracy: "Ashta Pradhan"
 hin_ashta_pradhan_bureaucracy_desc: "Le Conseil des huit ministres institué par Chhatrapati Shivaji lors de son couronnement en 1674 à Raigad : le Peshwa (premier ministre), Amatya (finances), Sachiv (correspondance), Mantri (renseignements), Senapati (commandant), Sumant (affaires étrangères), Nyayadhish (juge en chef) et Panditrao (affaires religieuses). Chaque bureau détenait un portefeuille plutôt qu'un fief, une alternative explicite hindou-Pad-Padshahi à la hiérarchie moghole mansabdari."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_hin_bureaucracy_authority: "Autorité bureaucratique impériale"
 AUTO_MODIFIER_DESC_nd_hin_bureaucracy_authority: "On the unification of Hindustan, the throne inherits the institutional substrate of every Hindu-revival polity that came before, and gains the ability to host historical bureaucracies."
