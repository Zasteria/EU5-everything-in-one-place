l_french:
 STATIC_MODIFIER_NAME_nd_spa_universal_monarchy: "Monarchie universelle"
 STATIC_MODIFIER_DESC_nd_spa_universal_monarchy: "L’Espagne est le champion de la chrétienté, ses tercios sont les meilleurs soldats d’Europe et sa foi est le fondement inébranlable d’un empire à l’échelle mondiale."
 STATIC_MODIFIER_NAME_nd_spa_empire_of_the_indies: "Empire des Indes"
 STATIC_MODIFIER_DESC_nd_spa_empire_of_the_indies: "De Séville à Manille, les flottes espagnoles relient un empire commercial mondial, dont les ports regorgent des richesses de deux hémisphères."
 nd_spa.1.t: "La naissance de l'Espagne"
 nd_spa.1.d: "The crowns are united, the Moors driven from their last stronghold, and the banner of Spain flies over lands our ancestors could scarcely imagine. In Seville and Valladolid, in Barcelona and Toledo, the peoples of Iberia look to a common destiny. Yet the path forward divides before us. Shall Spain be the sword of Catholic Europe, our tercios the terror of heretics and infidels, our Inquisition the guarantor of orthodoxy, our king the champion of a universal Christian order? Or shall we look westward, where our caravels have found a New World of unimaginable riches, building not merely a kingdom but a global empire of commerce, colonies, and treasure fleets that will make Seville the center of the world?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_spa.1.a: "Nous sommes l'épée de la chrétienté."
 nd_spa.1.b: "La richesse des Indes sera la nôtre."
 STATIC_MODIFIER_NAME_nd_spa_reconquista_triumphant: "Reconquista triomphante"
 STATIC_MODIFIER_DESC_nd_spa_reconquista_triumphant: "La lutte de sept cents ans pour la péninsule ibérique est gagnée. Les armes chrétiennes ont prévalu et la ferveur de la croisade brille."
 STATIC_MODIFIER_NAME_nd_spa_convivencia_legacy: "L'héritage de Convivencia"
 STATIC_MODIFIER_DESC_nd_spa_convivencia_legacy: "Des siècles de coexistence entre les communautés chrétiennes, musulmanes et juives ont laissé à l’Espagne un réservoir de connaissances diverses et de sophistication culturelle."
 nd_spa.2.t: "La chute de Grenade"
 nd_spa.2.d: "Le deuxième jour de janvier, Boabdil, le dernier émir de Grenade, remit les clés de l'Alhambra aux rois catholiques Ferdinand et Isabelle. Sept siècles de Reconquista sont terminés. Le croissant maure a été frappé sur toutes les tours de la péninsule ibérique, remplacé par la croix et la bannière de Castille et d'Aragon. Dans les rues de Grenade, les fidèles célèbrent avec des processions et des Te Deums. Pourtant, au milieu de la liesse, une question persiste. Les populations maures et juives conquises possèdent des compétences, des connaissances et des réseaux commerciaux qui ont enrichi la péninsule ibérique depuis des générations. Allons-nous aller de l’avant avec la pureté religieuse, en expulsant ou en convertissant tous ceux qui ne partagent pas la vraie foi, ou devons-nous préserver l’héritage intellectuel de la convivencia, la tradition de coexistence qui a fait d’Al-Andalus un phare d’apprentissage ?"
 nd_spa.2.a: "Pureté de la foi avant tout."
 nd_spa.2.b: "Préservez la sagesse de la coexistence."
 STATIC_MODIFIER_NAME_nd_spa_tercio_combined_arms: "Tercio : Doctrine interarmes"
 STATIC_MODIFIER_DESC_nd_spa_tercio_combined_arms: "Le tercio combat comme un seul organisme, les piquiers protégeant les arquebusiers, les épéistes comblant les brèches, chaque homme confiant sa vie à la formation."
 STATIC_MODIFIER_NAME_nd_spa_tercio_expeditionary: "Tercio : Doctrine expéditionnaire"
 STATIC_MODIFIER_DESC_nd_spa_tercio_expeditionary: "Les tercios espagnols ont appris à combattre loin de chez eux, dans les marécages des Flandres, les montagnes d'Italie, les forêts du Nouveau Monde, en adaptant leurs tactiques à chaque terrain."
 nd_spa.3.t: "La révolution du grand capitaine"
 nd_spa.3.d: "Dans les guerres d'Italie, Gonzalo Fernández de Cordoba, El Gran Capitan, a transformé l'art de la guerre. Là où d'autres armées s'appuient sur des masses de piquiers ou une cavalerie mercenaire coûteuse, Cordoue a forgé un nouveau type de formation : le tercio. Trois mille hommes, piquiers, épéistes armés de la redoutable espada Ropera et arquebusiers, s'entraînent ensemble pour former une seule unité interarmes. A Cérignole en 1503, cette formation révolutionnaire brise la gendarmerie française, prouvant qu'une infanterie disciplinée pouvait vaincre la meilleure cavalerie lourde d'Europe. Le tercio dominera les champs de bataille européens pendant le prochain siècle et demi. Devons-nous perfectionner le tercio en tant qu'instrument combiné de choc et de discipline, ou le perfectionner pour les longues marches et les campagnes lointaines qu'exige l'empire tentaculaire de l'Espagne ?"
 nd_spa.3.a: "Perfectionnez l’art des armes combinées."
 nd_spa.3.b: "Forgez des soldats capables de combattre n’importe où."
 STATIC_MODIFIER_NAME_nd_spa_treasure_fleet_monopoly: "Monopole des trésors de la Couronne"
 STATIC_MODIFIER_DESC_nd_spa_treasure_fleet_monopoly: "Tout le commerce colonial passe par la Casa de Contratación à Séville. Le monopole de la Couronne garantit que chaque once d'argent et chaque balle d'indigo enrichit le trésor royal."
 STATIC_MODIFIER_NAME_nd_spa_treasure_fleet_commerce: "Libre Commerce des Indes"
 STATIC_MODIFIER_DESC_nd_spa_treasure_fleet_commerce: "En relâchant le monopole et en permettant une participation plus large au commerce colonial, le commerce des Indes circule plus librement, enrichissant les marchands et les fabricants de toute l'Espagne."
 nd_spa.4.t: "La flotte au trésor"
 nd_spa.4.d: "Deux fois par an, les grands convois se rassemblent, la Flota de Indias partant de Séville pour les ports de Veracruz, de Portobelo et de Carthagène, et revenant chargée de l'argent de Potosi, de l'or de la Nouvelle-Grenade, de l'indigo et de la cochenille du Mexique. La Casa de Contratación supervise chaque manifeste de fret, chaque liste de passagers, chaque réal d'argent qui traverse le front de mer de Séville. Il s’agit du plus grand système organisé de commerce transocéanique que le monde ait jamais connu. Mais le monopole qui le rend rentable le rend aussi rigide. Les marchands de Cadix et de Barcelone militent pour le droit de commercer librement avec les colonies. Devons-nous maintenir l'emprise de fer de la Couronne sur le commerce colonial, en maximisant les revenus royaux mais en limitant l'entreprise privée, ou ouvrir le commerce à une participation plus large, en acceptant des revenus de la Couronne inférieurs en échange d'une économie plus dynamique ?"
 nd_spa.4.a: "Le monopole de la Couronne est absolu."
 nd_spa.4.b: "Laissez le commerce circuler librement."
 nd_spa_reconquista_fortress_tradition: "Alcazars of the Crown"
 nd_spa_reconquista_fortress_tradition_desc: "The royal alcazars of Segovia, Toledo and Seville are palace and fortress in one, taken over from Moorish builders and garrisoned in the king's name inside the cities themselves."
 nd_spa_mesta_privilege: "Merino Flocks"
 nd_spa_mesta_privilege_desc: "The flocks of Castile winter in Extremadura and La Mancha and summer in the mountains of León and Soria, walking the royal drove roads between them. Their fine short fleece has no equal in Europe, and the sheep that bear it may not be taken out of the kingdom."
 nd_spa_military_orders: "Ordres militaires ibériques"
 nd_spa_military_orders_desc: "Les Ordres de Santiago, Calatrava et Alcantara, moines-guerriers qui tenaient la frontière et dont les Grands Maîtres commandaient de vastes domaines et des levées fidèles."
 nd_spa_fueros_and_cortes: "Fueros et Cortès"
 nd_spa_fueros_and_cortes_desc: "Les fueros accordent des libertés et des privilèges locaux, tandis que les assemblées des Cortes de Castille, d'Aragon et de Catalogne donnent la parole aux domaines du royaume."
 nd_spa_jinete_tradition: "Tradition Jinete"
 nd_spa_jinete_tradition_desc: "Les jinetes, cavaliers légers montant à la jineta avec des étriers courts et des lances légères, sont la quintessence des cavaliers ibériques, héritiers d'une tradition partagée entre cavaliers chrétiens et maures."
 nd_spa_burgos_wool_market: "Marché de la laine de Burgos"
 nd_spa_burgos_wool_market_desc: "Les grandes foires de la laine de Burgos acheminent la toison mérinos castillane vers les métiers à tisser de Flandre et d'Italie, faisant de la laine le premier grand produit d'exportation de l'Espagne."
 nd_spa_catholic_monarchs: "Les Rois Catholiques"
 nd_spa_catholic_monarchs_desc: "Ferdinand d'Aragon et Isabelle de Castille unifièrent les couronnes, soumirent la noblesse, réformèrent l'administration et mirent l'Espagne sur la voie de l'empire."
 nd_spa_reconquista_culmination: "Point culminant de la Reconquista"
 nd_spa_reconquista_culmination_desc: "La chute de Grenade en 1492 a achevé la reconquête chrétienne de la péninsule ibérique, longue de plusieurs siècles, contre la domination musulmane."
 nd_spa_inquisition: "L'Inquisition espagnole"
 nd_spa_inquisition_desc: "Créée en 1478, l'Inquisition a servi d'instrument à la Couronne pour faire respecter le conformisme religieux et éradiquer l'hérésie, étendant sa portée à tous les territoires espagnols."
 nd_spa_iberian_exploration: "Exploration ibérique"
 nd_spa_iberian_exploration_desc: "Les navigateurs espagnols ont poussé au-delà du monde connu, Colomb vers l'ouest, Magellan autour du globe, guidés par les progrès de la cartographie, de l'astronomie et de la construction navale."
 nd_spa_medina_del_campo: "Foires de Medina del Campo"
 nd_spa_medina_del_campo_desc: "Les grandes foires de Medina del Campo ont attiré des marchands de toute l'Europe, devenant ainsi l'un des principaux centres bancaires, d'échange et de commerce international du continent."
 nd_spa_rise_of_the_tercio: "L'avènement du Tercio"
 nd_spa_rise_of_the_tercio_desc: "Le tercio, la formation d'infanterie interarmes révolutionnaire espagnole composée de piquiers, d'épéistes et d'arquebusiers, dominait les champs de bataille européens de Cerignola à Rocroi."
 nd_spa_colonial_trade_infrastructure: "Infrastructure commerciale coloniale"
 nd_spa_colonial_trade_infrastructure_desc: "The trade of the Indies is bound by law to Seville, and the river below the city is hard for laden ships. From 1535 a judge of the Indies sits at Cádiz to clear ships that load and unload there, and others follow in the Canaries. The ports beyond Seville take their share of the trade under the eye of the crown."
 nd_spa_mission_system: "Système de missions"
 nd_spa_mission_system_desc: "Les missionnaires franciscains, dominicains et jésuites ont établi un vaste réseau de missions à travers les Amériques, convertissant les peuples autochtones et étendant l'influence culturelle espagnole."
 nd_spa_galley_fleet: "Flotte de galères méditerranéennes"
 nd_spa_galley_fleet_desc: "Les galeras reales espagnoles patrouillaient en Méditerranée, protégeant les routes commerciales, combattant les corsaires ottomans et projetant la puissance aragonaise-catalane de Barcelone à Naples."
 nd_spa_treasure_fleet_system: "Système de flotte au trésor"
 nd_spa_treasure_fleet_system_desc: "La Flota de Indias, convois organisés naviguant entre Séville, les Caraïbes et le Pacifique, constituait le plus grand système de commerce transocéanique du début du monde moderne."
 nd_spa_spanish_galleon: "Galion espagnol"
 nd_spa_spanish_galleon_desc: "Le galion, conçu dans les années 1550 par Pedro Menendez de Aviles et Alvaro de Bazan, combinait un armement lourd avec une capacité de chargement, servant à la fois de navire de guerre et de transporteur de trésors."
 nd_spa_potosi_silver: "Silver Économie de Potosi"
 nd_spa_potosi_silver_desc: "Les mines d’argent de Potosi et de Zacatecas ont déversé un torrent de métaux précieux dans le trésor espagnol, finançant les armées et les flottes tout en remodelant l’économie mondiale."
 nd_spa_manila_galleon: "Route des galions de Manille"
 nd_spa_manila_galleon_desc: "À partir de 1565, le Galion de Manille reliait Acapulco aux Philippines, transportant la soie, la porcelaine et les épices chinoises vers l'ouest et l'argent américain vers l'est à travers le Pacifique."
 nd_spa_armada_tradition: "Provisioning the Armadas"
 nd_spa_armada_tradition_desc: "Biscuit, salt pork, wine and cordage for the armadas are bought, stored and loaded by the king's purveyors in the fleet ports, so that a fleet is fitted out in a season and kept at sea for a year."
 nd_spa_bourbon_arsenal_reforms: "Réformes de Bourbon Arsenal"
 nd_spa_bourbon_arsenal_reforms_desc: "La dynastie des Bourbons a créé des usines royales d'armes, de construction navale, de verre et de porcelaine, des manufactures parrainées par l'État pour moderniser la base industrielle espagnole."
 nd_spa_infanteria_de_marina: "Infanterie de Marina"
 nd_spa_infanteria_de_marina_desc: "Fondée en 1537 sous le nom de Tercio de Galeras, l'infanterie de marine espagnole est le plus ancien corps de marine au monde, combattant à bord de navires de guerre et dans des opérations amphibies à travers le monde."
 nd_spa_bourbon_centralization: "Centralisation des Bourbons"
 nd_spa_bourbon_centralization_desc: "Les décrets de Nueva Planta abolissent les lois distinctes d'Aragon, de Valence et de Catalogne, les remplaçant par une administration castillane et créant un État unitaire centralisé."
 nd_spa_colonial_plantations: "Système de plantation coloniale"
 nd_spa_colonial_plantations_desc: "Les haciendas et plantations coloniales espagnoles produisaient du tabac, du sucre, du cacao et de l'indigo pour les marchés européens, soutenant ainsi l'économie transatlantique."
 nd_spa_cadiz_constitution: "Constitution de Cadix"
 nd_spa_cadiz_constitution_desc: "La Constitution de 1812, rédigée à Cadix assiégée lors de l'invasion napoléonienne, proclamait la souveraineté populaire, la séparation des pouvoirs et le suffrage universel masculin, phare du constitutionnalisme libéral."
 nd_spa_guerrilla_tradition: "Tradition de guérilla"
 nd_spa_guerrilla_tradition_desc: "La guerre péninsulaire a donné au monde le mot « guérilla », petite guerre. Les irréguliers espagnols harcelèrent sans relâche les armées de Napoléon, prouvant que la résistance populaire pouvait saigner une superpuissance."
 nd_spa_economic_societies: "Sociétés économiques"
 nd_spa_economic_societies_desc: "Les Sociedades Economicas de Amigos del Pais, sociétés économiques des amis du pays, ont promu l'amélioration agricole, l'innovation industrielle et l'enseignement scientifique dans toute l'Espagne."
 nd_spa_imperial_legacy: "Héritage impérial"
 nd_spa_imperial_legacy_desc: "Trois siècles de gouvernance d’un empire mondial ont laissé à l’Espagne une expérience inégalée en matière d’administration coloniale, de négociation diplomatique et de gouvernance multicontinentale."
 a_nd_spa_rodelero: "Rodelero"
 a_nd_spa_rodelero_desc: "L'infanterie à l'épée et au bouclier, de féroces combattants au corps à corps qui chargeaient en formations de piques pour tailler l'ennemi au corps à corps, une tradition née lors de la Reconquista."
 a_nd_spa_jinete: "Jinete"
 a_nd_spa_jinete_desc: "Cavaliers légers montant à la jineta, étriers courts, lances légères, boucliers ronds, héritiers d'une tradition équestre ibérique partagée entre cavaliers chrétiens et maures."
 a_nd_spa_tercio: "Tercio"
 a_nd_spa_tercio_desc: "La légendaire formation d'infanterie interarmes d'Espagne : piquiers, épéistes et arquebusiers combattant en un tout discipliné. La terreur des champs de bataille européens depuis plus d'un siècle."
 n_nd_spa_galera_real: "Galère Real"
 n_nd_spa_galera_real_desc: "Une galère de guerre royale de la flotte espagnole de la Méditerranée, plus lourde et plus lourdement armée que les galères standards, transportant des compléments de soldats pour les actions d'abordage."
 n_nd_spa_galleon: "Galion espagnol"
 n_nd_spa_galleon_desc: "Un voilier de guerre lourdement armé conçu pour escorter les convois de trésors à travers l'Atlantique, combinant une formidable puissance de feu latérale avec une capacité de chargement substantielle."
 a_nd_spa_infanteria_de_marina: "Infanterie de Marina"
 a_nd_spa_infanteria_de_marina_desc: "Le corps d'infanterie de marine le plus ancien du monde, descendant du Tercio de Galeras. Spécialistes du combat à bord et de l'assaut amphibie."
 nd_spa_alcazar: "Alcazar"
 nd_spa_alcazar_desc: "Un palais fortifié alliant défense militaire et administration royale, héritage architectural de siècles de guerre de frontière entre royaumes chrétiens et maures."
 nd_spa_mesta_sheepwalk: "Esquileo"
 nd_spa_mesta_sheepwalk_desc: "A shearing house beside a royal drove road. The merino flocks are shorn here in spring on their way to the summer pastures of the north, and the fleeces are sorted, washed and baled for the fairs."
 nd_spa_colonial_mission: "Mission coloniale"
 nd_spa_colonial_mission_desc: "Un complexe missionnaire franciscain ou dominicain, une église, une école, un atelier et un dortoir, créé pour convertir et éduquer les peuples autochtones des Amériques espagnoles."
 nd_spa_casa_de_contratacion: "Juzgado de Indias"
 nd_spa_casa_de_contratacion_desc: "The court of a judge of the Indies in a port outside Seville. Ships bound for the Indies are registered here, their cargoes inspected and the crown's dues collected, so that they need not go up the river."
 nd_spa_silver_minting_house: "Monnaie d'argent"
 nd_spa_silver_minting_house_desc: "Une monnaie royale transformant l'argent colonial en pièces de monnaie, les reales de a ocho, pièces de huit, qui sont devenues la première monnaie véritablement mondiale."
 nd_spa_royal_foundry: "Fonderie Royale"
 nd_spa_royal_foundry_desc: "Une manufacture parrainée par l'État créée sous les réformes Bourbon, fabriquant des canons, forgeant des armes et produisant le matériel qui soutient la puissance militaire de l'Espagne."
 nd_spa_camino_real: "Chemin Réel"
 nd_spa_camino_real_desc: "La Voie Royale, qui fait partie du système routier radial de Charles III reliant Madrid à toutes les grandes villes, améliorant ainsi le commerce, les communications et l'administration à travers le royaume."
 nd_spa_alcazar_garrison: "Garnison de l'Alcazar"
 nd_spa_alcazar_garrison_desc: "La garnison permanente de l'alcazar, entretenue avec des armes et des provisions pour défendre la forteresse et projeter l'autorité royale."
 nd_spa_merino_wool_processing: "Traitement de la laine mérinos"
 nd_spa_merino_wool_processing_desc: "La laine mérinos castillane, appréciée dans toute l'Europe pour sa finesse, est triée, nettoyée et préparée pour être exportée vers les métiers à tisser des Flandres et de l'Italie."
 nd_spa_mission_upkeep: "Opérations de mission"
 nd_spa_mission_upkeep_desc: "Le travail quotidien de la mission : enseigner le catéchisme, entretenir l'église, cultiver les champs et produire des biens pour la communauté environnante."
 nd_spa_trade_house_operations: "Court of Registry"
 nd_spa_trade_house_operations_desc: "The daily work of the judge and his clerks: registering ships, reviewing manifests and seeing that the crown's rules for the Indies trade are kept."
 nd_spa_proveeduria: "Proveeduria de Armadas"
 nd_spa_proveeduria_desc: "The yard of the purveyor general in a fleet port. Hemp, pitch and canvas are bought on contract and kept in the king's stores beside the quay, next to the ovens that bake the ship's biscuit."
 nd_spa_jarcia_y_lona: "Rigging and Sailcloth"
 nd_spa_jarcia_y_lona_desc: "Hemp is spun and tarred into cordage and canvas is cut into sails in the king's stores, ready to be loaded when the fleet comes in."
 nd_spa_silver_minting: "Frappe d'argent"
 nd_spa_silver_minting_desc: "L'argent colonial est analysé, affiné et frappé en pièces de monnaie à la Monnaie royale, produisant les légendaires pièces de huit."
 nd_spa_cannon_founding: "Fondation du canon"
 nd_spa_cannon_founding_desc: "Le fer est fondu et transformé en pièces d'artillerie à la Fonderie royale, approvisionnant les armées et les fortifications espagnoles en munitions modernes."
 nd_spa_road_maintenance: "Entretien des routes"
 nd_spa_road_maintenance_desc: "Des équipes d'ouvriers entretiennent les surfaces pavées, les ponts et le drainage du Camino Real, gardant ainsi les artères du royaume ouvertes au commerce et aux courriers."
 levy_nd_spa_rodelero: "Rodelero Lévy"
 levy_nd_spa_rodelero_desc: "Des combattants à l'épée et au bouclier issus des communautés frontalières ibériques, perpétuant les traditions de combat rapproché de la Reconquista."
 levy_nd_spa_jinete: "Jinete Levy"
 levy_nd_spa_jinete_desc: "Cavaliers légers issus des frontières ibériques, chevauchant dans le style jineta, rapides, agiles et mortels dans les escarmouches et les poursuites."
 nd_spa_formed_tt: "L'Espagne s'est formée"
 nd_spa_path_a_tt: "Choisissez la monarchie universelle"
 nd_spa_path_b_tt: "Choisissez l'Empire des Indes"
 nd_spa_dest_sevilla_developed_tt: "We own #bold Seville#! and its development is at least #bold 75#!"

 # ===== DESTINY TREE LOCALIZATION =====

 # Advance names and descriptions
 nd_spa_destiny: "Destin espagnol"
 nd_spa_destiny_desc: "L’Espagne se trouve à la croisée des chemins. La couronne est unie et le royaume sécurisé, maintenant un destin plus grand nous attend. Parvenez à la stabilité et tracez le cap de la nation espagnole."
 nd_spa_dest_italian_wars: "Les guerres d'Italie"
 nd_spa_dest_italian_wars_desc: "La richesse et le prestige de l’Italie entraînent l’Espagne dans la grande lutte de pouvoir pour la péninsule. Prenez Naples et Milan pour établir la suprématie espagnole sur l'Italie."
 nd_spa_dest_army_of_flanders: "L'Armée des Flandres"
 nd_spa_dest_army_of_flanders_desc: "La portée de l'Espagne s'étend vers le nord. Prenez Anvers, au cœur des provinces les plus riches d’Europe, entretenez une grande armée et adoptez une organisation militaire professionnelle."
 nd_spa_dest_defender_of_christendom: "Défenseur de la chrétienté"
 nd_spa_dest_defender_of_christendom_desc: "L'Espagne aspire à être le champion universel de la foi catholique. Contrôlez Rome, Tunis et la Sicile tout en maintenant la stabilité nécessaire pour diriger toute la chrétienté."
 nd_spa_dest_caribbean_foothold: "Implantation dans les Caraïbes"
 nd_spa_dest_caribbean_foothold_desc: "Le Nouveau Monde nous appelle. Établissez une base à La Havane et assurez la circulation du sucre sur vos marchés, première étape vers un empire colonial mondial."
 nd_spa_dest_pacific_link: "Le lien du Pacifique"
 nd_spa_dest_pacific_link_desc: "Du Mexique à Manille, forgez la plus grande route commerciale que le monde ait jamais connue. Contrôlez Tenochtitlan et Manille, reliant les richesses de l’Asie aux Amériques."
 nd_spa_dest_global_empire: "L'empire mondial"
 nd_spa_dest_global_empire_desc: "Complete the conquest of the greatest indigenous empire in the Americas. Every fleet of the Indies sails from Seville and returns to it, and the city on the Guadalquivir is built up to twice what it was; the silver it lands is struck into pieces of eight. Requires Cusco, Seville at 75 development and a Silver Minting House in three places."

 # Destiny event localization
 nd_spa.5.t: "Une couronne unie"
 nd_spa.5.d: "Les royaumes d’Ibérie sont unis sous une seule couronne. La Reconquista est un souvenir vivant, la foi est forte et les armes espagnoles sont respectées dans toute la chrétienté. Depuis les tribunaux de Tolède et de Valladolid, depuis les ports de Barcelone et de Séville, se dessinent les ambitions d'une grande nation. Que ce soit par l'épée des fidèles ou par les richesses de pays lointains, l'Espagne laissera sa marque sur le monde."
 nd_spa.5.a: "Notre destin nous attend."

 nd_spa.6.t: "Le prix de l'Italie"
 nd_spa.6.d: "Les bannières de l'Espagne flottent sur Naples et Milan. Ce que des générations de princes italiens, de rois de France et d’empereurs allemands ont lutté pour contrôler repose désormais entre les mains des Espagnols. Les tercios défilent dans les rues des villes qui ne répondaient autrefois qu'à leurs propres seigneurs, et les vice-rois espagnols administrent les terres les plus riches d'Europe. L’Italie est à nous, et avec elle, la clé de la maîtrise méditerranéenne et de l’hégémonie européenne."
 nd_spa.6.a: "L'Italie s'incline devant la couronne espagnole."

 nd_spa.7.t: "L'Armée des Flandres"
 nd_spa.7.d: "La Route d'Espagne, ce couloir légendaire qui s'étend de Milan aux Pays-Bas en passant par la Savoie et la Franche-Comté, transporte désormais un flux constant d'hommes, d'argent et de munitions vers le nord. À Anvers, la ville la plus riche d’Europe, les gouverneurs espagnols supervisent un empire commercial qui rivalise avec celui colonial. L’Armée des Flandres, ce redoutable instrument du pouvoir des Habsbourg, tient les Pays-Bas dans une poigne de fer. Pourtant, le maintien de cette armée lointaine met à rude épreuve même les vastes ressources de l’Espagne. Allons-nous perfectionner la machine militaire, en investissant des trésors dans la discipline et les fortifications ? Ou tirer parti de nos relations dynastiques, en utilisant la diplomatie pour gérer ce que la force seule ne peut soutenir ?"
 nd_spa.7.a: "La discipline et l'acier tiendront la Flandre."
 nd_spa.7.b: "Les liens dynastiques se lient plus fermement que le fer."

 nd_spa.8.t: "Défenseur de la chrétienté"
 nd_spa.8.d: "Des rives de Tunis aux collines de Rome, des ports de Sicile aux forteresses des Flandres, la puissance espagnole encercle la Méditerranée et domine l'Europe. Aucun roi de la chrétienté ne commande de telles armées, aucun prince ne défend la foi avec autant de zèle, aucun royaume ne s’étend sur de telles distances. Le rêve d’une monarchie chrétienne universelle, entrevu pour la première fois par Charles Quint alors qu’il s’agenouillait devant le pape à Bologne, est à portée de main. L’Espagne sera-t-elle le champion de l’orthodoxie catholique, une puissance en croisade dont les armées sont l’épée de l’Église ? Ou allons-nous construire un empire des Habsbourg, une dynastie dont le réseau d’alliances et de possessions en fait l’arbitre des affaires européennes ?"
 nd_spa.8.a: "Nous sommes l'épée de la Sainte Église."
 nd_spa.8.b: "La maison des Habsbourg gouvernera tout."

 nd_spa.9.t: "La Perle des Antilles"
 nd_spa.9.d: "La Havane est la porte d'entrée du Nouveau Monde, un port-forteresse où se rassemblent les flottes au trésor, où la canne à sucre adoucit l'air et où les richesses de deux continents passent entre les mains des Espagnols. Depuis ce bastion des Caraïbes, les routes s'étendent vers l'extérieur : au sud vers les richesses du Pérou, à l'ouest jusqu'à l'argent du Mexique, à l'est jusqu'aux marchés en attente de Séville. La colonie n’est plus une expérience, elle est le fondement d’un empire mondial."
 nd_spa.9.a: "Les Indes sont notre droit de naissance."

 nd_spa.10.t: "Le galion de Manille"
 nd_spa.10.d: "L'impossible a été réalisé. Les navires espagnols traversent désormais le Pacifique, reliant l’argent du Mexique à la soie et aux épices d’Asie. À Manille, les jonques chinoises envahissent le port aux côtés des galions espagnols, échangeant de la porcelaine et des laques contre de l'argent américain. À Acapulco, l'arrivée annuelle du galion de Manille déclenche une frénésie commerciale qui attire des marchands de toutes les Amériques. Aucune autre nation n’a forgé un tel lien, une seule route commerciale qui ceinture le globe. La couronne va-t-elle resserrer son emprise sur ce monopole océanique, en construisant une flotte qui domine le Pacifique ? Ou allons-nous ouvrir les ports, laissant l’entreprise privée multiplier les richesses qui circulent le long de cette route remarquable ?"
 nd_spa.10.a: "La couronne contrôle le commerce du Pacifique."
 nd_spa.10.b: "Ouvrez les ports à tous ceux qui souhaitent faire du commerce."

 nd_spa.11.t: "L'Empire sur lequel le soleil ne se couche jamais"
 nd_spa.11.d: "Des Andes aux Philippines, des Caraïbes à la Méditerranée, l’Empire espagnol s’étend sur tous les continents et sur tous les océans. Les anciennes villes des Incas arborent désormais la bannière de la Castille, et dans tous les coins de ce vaste domaine, la loi espagnole, la foi espagnole et la langue espagnole prennent racine. Aucun empire dans l’histoire n’a gouverné une telle diversité de peuples sur de telles distances. Allons-nous centraliser ce colosse à travers un système de vice-royautés et d’audiences, liant l’empire par une loi et une administration uniformes ? Ou allons-nous laisser l’argent qui coule de Potosi et de Zacatecas devenir le fondement de la puissance économique espagnole, investissant les richesses de l’empire dans des flottes, des fortifications et des travaux publics ?"
 nd_spa.11.a: "Une loi, une foi, un empire."
 nd_spa.11.b: "L'argent sera notre fondement."

 # Timed modifier names and descriptions
 STATIC_MODIFIER_NAME_nd_spa_dest_iron_discipline: "Discipline de fer"
 STATIC_MODIFIER_DESC_nd_spa_dest_iron_discipline: "L'armée de Flandre s'entraîne sans cesse, ses garnisons fortifiées et ses recrues aguerries par les rigueurs du service nordique, même si l'économie nationale supporte le coût d'une guerre perpétuelle."
 STATIC_MODIFIER_NAME_nd_spa_dest_habsburg_diplomacy: "Diplomatie des Habsbourg"
 STATIC_MODIFIER_DESC_nd_spa_dest_habsburg_diplomacy: "Grâce au mariage, à l'alliance et à la gestion prudente des revendications dynastiques, les Habsbourg tissent un réseau d'influence à travers l'Europe, même si chaque nouvel engagement entraîne l'Espagne plus profondément dans des guerres coûteuses."
 STATIC_MODIFIER_NAME_nd_spa_dest_catholic_champion: "Champion catholique"
 STATIC_MODIFIER_DESC_nd_spa_dest_catholic_champion: "L'Espagne se présente comme le défenseur armé de la foi catholique, ses armées consacrées au service de l'Église, ses guerres bénies par le Pape lui-même."
 STATIC_MODIFIER_NAME_nd_spa_dest_habsburg_imperium: "Empire des Habsbourg"
 STATIC_MODIFIER_DESC_nd_spa_dest_habsburg_imperium: "La dynastie des Habsbourg se trouve à cheval sur l'Europe, son prestige inégalé et son poids diplomatique décisif dans chaque négociation, même si la vie intellectuelle de cet empire tentaculaire souffre des exigences de la gouvernance."
 STATIC_MODIFIER_NAME_nd_spa_dest_crown_fleet: "Flotte de la Couronne"
 STATIC_MODIFIER_DESC_nd_spa_dest_crown_fleet: "La flotte royale domine les voies maritimes du Pacifique, ses blocus étouffent ses rivaux et ses traditions de matelotage sont inégalées, bien que l'obsession de la couronne pour le commerce océanique tire les ressources de son pays d'origine."
 STATIC_MODIFIER_NAME_nd_spa_dest_free_ports: "Ports francs des Indes"
 STATIC_MODIFIER_DESC_nd_spa_dest_free_ports: "En ouvrant les ports coloniaux à un commerce plus large, les matières premières circulent librement et les marchands prospèrent, même si l'armée permanente, privée de revenus de monopole, devient de plus en plus coûteuse à entretenir."
 STATIC_MODIFIER_NAME_nd_spa_dest_centralized_viceroyalties: "Vice-royautés centralisées"
 STATIC_MODIFIER_DESC_nd_spa_dest_centralized_viceroyalties: "Un système de vice-rois, d'audiencias et d'intendants lie l'empire sous une loi uniforme. Les populations coloniales sont intégrées, les fonctionnaires locaux répondent devant la couronne et l'efficacité administrative atteint de nouveaux sommets."
 STATIC_MODIFIER_NAME_nd_spa_dest_silver_standard: "Étalon Argent"
 STATIC_MODIFIER_DESC_nd_spa_dest_silver_standard: "La richesse de Potosi et de Zacatecas se consacre aux navires de guerre, aux fortifications et aux travaux publics. L'argent finance une marine qui domine les océans et une armée plus grande que n'importe quel rival ne peut rivaliser."

 # Building names and descriptions
 nd_spa_escorial: "L'Escurial"
 nd_spa_escorial_desc: "Le grand monastère-palais de San Lorenzo de El Escorial, à la fois résidence royale, monastère, bibliothèque et mausolée, incarnation architecturale de la prétention de l'Espagne à être le défenseur de la chrétienté."
 nd_spa_escorial_administration: "Administration de l'Escorial"
 nd_spa_escorial_administration_desc: "La vaste bureaucratie du palais-monastère traite la correspondance provenant de tous les coins de l'empire, ses commis et scribes vêtus de draps fins tenant des registres de la monarchie universelle au milieu de salles richement meublées."
 nd_spa_real_audiencia: "Audience réelle"
 nd_spa_real_audiencia_desc: "Une Cour d'appel royale, l'institution judiciaire et administrative suprême de la gouvernance coloniale, faisant respecter la loi espagnole et les droits de la couronne sur les vastes territoires des Indes."
 nd_spa_audiencia_operations: "Opérations Audience"
 nd_spa_audiencia_operations_desc: "Le travail quotidien de l'Audiencia : entendre les affaires, enregistrer les jugements, émettre des décrets et maintenir la correspondance juridique et les volumes de référence qui lient les provinces lointaines à la couronne espagnole, ses juges vêtus de drap fin."

 # ===== BUREAUCRACY UNLOCK =====
 AUTO_MODIFIER_NAME_nd_spa_bureaucracy_authority: "Gouvernement conciliaire des Habsbourg"
 AUTO_MODIFIER_DESC_nd_spa_bureaucracy_authority: "The councils gathered at Valladolid, Madrid, and Seville have matured into a permanent apparatus of state: letrado jurists, royal magistrates, and chartered tribunals binding peninsular Spain and her overseas dominions to the will of the king. From this conciliar foundation the distinctive institutions of Hispanic governance take their durable form. Four of the seven can be kept at once."

 # ===== BUREAUCRACIES =====
 spa_consejo_real_bureaucracy: "Colegios Mayores"
 spa_consejo_real_bureaucracy_desc: "The six Colegios Mayores were endowed to lodge poor scholars of law and theology: San Bartolomé at Salamanca in 1401, three more in the same city, Santa Cruz at Valladolid and San Ildefonso at Alcalá. Their graduates came to fill the councils, the high courts and the bishoprics of the monarchy, and each college kept a network of former fellows who advanced its men. The crown gained a standing reserve of trained letrados. By the seventeenth century the colleges had become closed circles of well-born families, which the reform of 1771 finally broke."

 spa_casa_de_contratacion_bureaucracy: "Consulado de Cargadores a Indias"
 spa_casa_de_contratacion_bureaucracy_desc: "Chartered in 1543, the Consulado de Cargadores a Indias was the guild of the Seville merchants who shipped to the Indies. Its prior and consuls judged commercial suits, organised the lading of the fleets, and came to farm the avería, the levy that paid for the convoy escorts. The crown borrowed from the guild constantly and confirmed its monopoly in return. The guild defended that monopoly against Cádiz, against foreign houses and against the merchants of Mexico and Lima, long after it had ceased to serve the trade."

 spa_consejo_de_indias_bureaucracy: "Conseil des Indes"
 spa_consejo_de_indias_bureaucracy_desc: "Créé par Charles Quint en 1524 sur le modèle conciliaire du Conseil de Castille, le Conseil des Indes gouverna l'empire espagnol d'outre-mer depuis Madrid jusqu'en 1834. Ses six à dix membres royaux rédigèrent toute la législation coloniale, nommèrent vice-rois et magistrats d'audience, vérifièrent les résidences des gouverneurs sortants et siégèrent comme cour d'appel suprême pour le Nouveau Monde. Aucune entreprise majeure aux Indes (une campagne, une réforme, une nomination ecclésiastique) ne se déroulait sans sa consultation écrite au roi."

 spa_mesta_bureaucracy: "Maestranzas de Caballería"
 spa_mesta_bureaucracy_desc: "The Real Maestranza de Caballería of Ronda was founded in 1573, after Philip II asked the nobility of the towns to form brotherhoods that would keep them practised in horsemanship and arms. Seville followed in 1670, Granada in 1686 and Valencia in 1697. The maestrantes drilled in the riding school and the bullring, and bred and schooled horses for the cavalry. Under the Bourbons they won a royal prince as elder brother and a jurisdiction of their own, which put them beyond the reach of the ordinary magistrates."

 spa_inquisicion_bureaucracy: "Tribunal du Santo Oficio"
 spa_inquisicion_bureaucracy_desc: "Autorisé par Sixte IV en 1478 et inauguré par les Rois catholiques en 1480, le Saint-Office de l'Inquisition opérait en dehors du contrôle papal par l'intermédiaire de quatorze tribunaux locaux à travers la Castille, l'Aragon et les Indes. Les inquisiteurs nommés par la Couronne ont imposé l’orthodoxie des conversos et des moriscos, jugé les sorcières et les érudits humanistes, censuré la presse par le biais de l’Index et mené l’autodafé en tant que théâtre public de l’autorité monarchique. Les confiscations de biens des condamnés remplissaient le trésor royal, mais l'institution rongeait les réseaux commerciaux inverses sur lesquels reposait le commerce castillan et refroidissait la vie intellectuelle ouverte des universités espagnoles."

 spa_encomienda_bureaucracy: "Encomienda"
 spa_encomienda_bureaucracy_desc: "Définie dans la loi en 1503, l'encomienda accordait à un conquistador ou à un colon le droit de percevoir un tribut et du travail auprès d'une communauté indienne spécifiée en échange d'une protection et d'une instruction chrétienne. Le système a implanté une classe seigneuriale espagnole dans le Nouveau Monde presque du jour au lendemain, mais les dénonciations de Las Casas et le débat de Valladolid ont forcé Charles Quint à promulguer les nouvelles lois de 1542 interdisant les nouvelles concessions et abolissant l'héritage. La révolte coloniale (l’assassinat du vice-roi Nez Vela au Pérou) a reporté l’application de la loi, et l’encomienda s’est transformée en repartimiento rotatif : une conscription de travail administrée par la couronne mais partout abusée par les fonctionnaires locaux et les curés de paroisse."

 spa_corregimiento_bureaucracy: "Corrégiment"
 spa_corregimiento_bureaucracy_desc: "Magistrats royaux nommés dans les communes de Castille à partir de 1480, les corregidores étaient exclusivement issus des letrados non nobles des facultés de droit. Chaque corregidor présidait le cabildo, jugeait les affaires de première instance, collectait les impôts royaux et surveillait la frontière entre la juridiction de la couronne et les immunités de l'église, du seigneur et de la ville à charte. Après la répression de la révolte des comuneros de 1520-1521, le corregimiento devint le principal levier par lequel la couronne des Habsbourg brisa l'autonomie municipale et absorba les anciennes villes de la Vieille Castille dans l'administration unitaire du royaume."
