l_french:
 STATIC_MODIFIER_NAME_nd_kaz_legacy_of_kasym: "L'héritage de Kasym Khan"
 STATIC_MODIFIER_DESC_nd_kaz_legacy_of_kasym: "Sous Kasym Khan, le khanat kazakh atteignit son apogée, alignant deux cent mille cavaliers et commandant tout le Desht-i Kipchak de l'Irtych à l'Oural. Son autorité centralisée, soutenue par le mandat Chinggisid, a forgé des clans dispersés en une seule force terrifiante."
 STATIC_MODIFIER_NAME_nd_kaz_three_zhuz_confederacy: "Confédération des Trois Zhuz"
 STATIC_MODIFIER_DESC_nd_kaz_three_zhuz_confederacy: "Le génie de la gouvernance kazakhe ne réside pas dans le pouvoir d’un seul khan mais dans l’équilibre de trois zhuz, les hordes Grande, Moyenne et Junior. Chacun entretient ses pâturages, ses biys, ses traditions. L’unité naît du consensus et non du commandement, et la steppe perdure car aucune défaite ne peut briser l’ensemble."
 nd_kaz.1.t: "Le Khanat kazakh"
 nd_kaz.1.d: "When Janibek and Kerei led their followers away from the crumbling authority of Abu'l-Khayr's Uzbek confederation, they did not merely rebel, they founded a nation. Two hundred thousand nomads chose freedom on the open steppe over submission, and from that exodus the Kazakh people were born.\n\nNow the khanate stands at a crossroads that will define its character for generations. The Chinggisid tradition demands a strong khan who can unite the clans under a single banner, marshaling the full strength of the steppe against any foe. But the reality of the vast Desht-i Kipchak favors a different wisdom: the confederal division of the three zhuz, where each horde governs its own pastures and the khan rules by consensus with the biys and sultans.\n\nWhich path shall define the Kazakh nation?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_kaz.1.a: "Un khan, une nation, comme l'a ordonné Kasym"
 nd_kaz.1.b: "Trois Zhuz, un peuple, la force par l'équilibre"
 nd_kaz.2.t: "Le Jeti Zhargy"
 nd_kaz.2.d: "In the twilight years of the seventeenth century, Khan Tauke assembled the three greatest biys of the Kazakh nation: Tole Bi of the Great Zhuz, Kazybek Bi of the Middle Zhuz, and Aiteke Bi of the Junior Zhuz. Together they codified the customary law of the steppe into the Jeti Zhargy, the Seven Codes.\n\nThese laws regulated everything from inheritance and marriage to livestock disputes and the punishment of crimes. They established the authority of the biy courts as the arbiters of justice across the vast steppe, binding diverse clans under a common legal framework without imposing centralized tyranny.\n\nThe Jeti Zhargy represents a choice: shall the law serve to strengthen the khan's authority over all disputes, or shall it enshrine the biys as the true pillars of governance?"
 nd_kaz.2.a: "La loi renforce la main du khan"
 nd_kaz.2.b: "Les biys sont la vraie voix de la steppe"
 nd_kaz.3.t: "Triomphe à Anyrakay"
 nd_kaz.3.d: "For years the Dzungar Khanate had pressed westward, and the catastrophe of 1723, the Aktaban Shubyryndy, the Great Retreat, had nearly broken the Kazakh nation. Families scattered, herds were lost, and despair gripped the steppe.\n\nBut in the spring of 1730, the tide turned. Khan Abulkhair rallied thirty thousand warriors from all three zhuz, an unprecedented feat of unity. At Anyrakay, over forty days of fighting across two hundred kilometers of steppe, the legendary batyrs Bogenbai, Kabanbai, and Nauryzbai shattered the Dzungar advance. The invaders were expelled from Zhetysu, and the Kazakh people proved that the steppe could not be conquered.\n\nThis victory demands a decision: shall we press our advantage and pursue the Dzungars to their ruin, or consolidate what we have won and rebuild the solidarity of the three zhuz?"
 nd_kaz.3.a: "Poursuivez l'ennemi en retraite. La steppe est à nous"
 nd_kaz.3.b: "Reconstruire et réunir. Les zhuz doivent être unis"
 nd_kaz.4.t: "L'échange cheval-soie"
 nd_kaz.4.d: "Between 1759 and 1796, the Qing emperor issued special decrees governing the horse trade with the Kazakh Khanate. The Kazakhs possessed what China needed most, hardy steppe horses by the tens of thousands, and China offered what the steppe desired: bolts of silk, tea, and manufactured goods.\n\nThis was no mere barter. The horse-silk exchange became a pillar of diplomacy, a regulated system of trade and tribute that enriched both empires. Kazakh bais grew wealthy beyond imagination, the legendary Aldan owned twenty-four thousand horses, while the nation's total herds numbered in the millions. The steppe had found a way to convert its boundless grasslands into enduring wealth."
 nd_kaz.4.a: "La richesse de la steppe coule vers l'est et l'ouest"
 STATIC_MODIFIER_NAME_nd_kaz_code_of_the_steppe: "Code de la Steppe"
 STATIC_MODIFIER_DESC_nd_kaz_code_of_the_steppe: "Le Jeti Zhargy a codifié le droit coutumier des clans nomades en un code juridique unifié, renforçant ainsi l'autorité du khan sur les conflits à travers la vaste steppe."
 STATIC_MODIFIER_NAME_nd_kaz_biy_councils: "Autorité des Biys"
 STATIC_MODIFIER_DESC_nd_kaz_biy_councils: "Le Jeti Zhargy a consacré les tribunaux biy comme fondement de la justice kazakhe, créant un système de gouvernance décentralisé qui respecte l'autonomie de chaque zhuz tout en les liant au droit commun."
 STATIC_MODIFIER_NAME_nd_kaz_steppe_resurgent: "La résurgence des steppes"
 STATIC_MODIFIER_DESC_nd_kaz_steppe_resurgent: "Le triomphe d'Anyrakay a déclenché la fureur martiale de la nation kazakhe. Enhardie par la victoire, notre cavalerie chevauche avec un objectif renouvelé, et le souvenir de nos plus grands batyrs inspire chaque guerrier."
 STATIC_MODIFIER_NAME_nd_kaz_zhuz_solidarity: "Solidarité des Zhuz"
 STATIC_MODIFIER_DESC_nd_kaz_zhuz_solidarity: "L'unité sans précédent des trois zhuz à Anyrakay a démontré que la nation kazakhe est plus forte lorsqu'elle est unie. Les liens forgés dans une lutte commune soutiennent désormais une mobilisation plus profonde."
 STATIC_MODIFIER_NAME_nd_kaz_silk_road_wealth: "La richesse de la Route de la Soie"
 STATIC_MODIFIER_DESC_nd_kaz_silk_road_wealth: "Le commerce réglementé de la soie de cheval a transformé les vastes prairies de la steppe en une source de richesse commerciale durable."
 nd_kaz_horse_archer_tradition: "Tradition de l'archer à cheval"
 nd_kaz_horse_archer_tradition_desc: "L'arc composite et le poney des steppes sont les deux piliers de la guerre kazakhe. Dès l'enfance, tout nomade apprend à tirer à cheval au grand galop, le fameux tir kazakh, une volée vers l'arrière en retraite, qui a brisé de nombreuses armées de poursuite."
 nd_kaz_horse_breeding_mastery: "Maîtrise de l'élevage de chevaux"
 nd_kaz_horse_breeding_mastery_desc: "The Kazakhs breed some of the hardiest horses in the world, compact, enduring animals that can survive on steppe grass alone. Wealthy bais own herds numbering in the tens of thousands, and the nation's equine wealth is the foundation of both its military power and its trade.\n\n#italic Available in: $nd_kaz_horse_stud$#!"
 nd_kaz_aul_organization: "Organisation d'Aoul"
 nd_kaz_aul_organization_desc: "The aul, the nomadic camp, is the basic unit of Kazakh society. Each aul moves with the seasons, following ancient migration routes between winter shelters and summer pastures. Their felt yurts can be raised in an hour and dismantled in less.\n\n#italic Available in: $nd_kaz_aul_encampment$#!"
 nd_kaz_quriltay_tradition: "Tradition du Quriltay"
 nd_kaz_quriltay_tradition_desc: "In the Chinggisid tradition, the quriltay assembly gathers the clan elders, sultans, and military leaders to elect a khan, plan the year's migration, and allocate winter pastureland. It is the beating heart of steppe governance.\n\n#italic Available in: $nd_kaz_quriltay_ground$#!"
 nd_kaz_yasa_legacy: "L'héritage des Yasa"
 nd_kaz_yasa_legacy_desc: "Le Yasa de Gengis Khan, codifié en 1206, reste la tradition juridique fondatrice de la steppe. Ses principes de responsabilité collective, de commandement hiérarchique et de droits pastoraux régissent les relations entre le khan et le clan."
 nd_kaz_ru_bonds: "Liens du Ru"
 nd_kaz_ru_bonds_desc: "Chaque Kazakh connaît son ru, son clan patrilinéaire, retraçant sept générations d'ancêtres. Ces liens généalogiques transcendent les frontières du zhuz, unissant la nation par le sang et les obligations partagés."
 nd_kaz_guard_cavalry: "Garde du Quriltay"
 nd_kaz_guard_cavalry_desc: "La suite personnelle du khan, choisie parmi les meilleurs cavaliers de chaque clan lors de l'assemblée du Quriltay. Ces guerriers à cheval servent à la fois de garde du corps et de cavalerie de choc, constituant le tranchant de l'autorité du khan."
 nd_kaz_silk_road_waystations: "Étapes de la Route de la Soie"
 nd_kaz_silk_road_waystations_desc: "Along the caravan routes that cross the steppe, Kazakh waystations provide shelter, fresh horses, and provisions to traveling merchants. These posts connect the cities of Transoxiana to the markets of China and beyond.\n\n#italic Available in: $nd_kaz_caravan_waystation$#!"
 nd_kaz_kasym_khan_era: "L'ère de Kasym Khan"
 nd_kaz_kasym_khan_era_desc: "Sous Kasym Khan (r. 1509-1518), le khanat kazakh atteignit son apogée, apparemment capable de déployer deux cent mille cavaliers. Son autorité s'étendait de l'Irtych à l'Oural, et toutes les puissances voisines craignaient les cavaliers kazakhs."
 nd_kaz_horse_trade_mastery: "Commerce de chevaux des steppes"
 nd_kaz_horse_trade_mastery_desc: "Les chevaux kazakhs sont appréciés dans toute l’Asie centrale pour leur endurance, leur pied sûr et leur capacité à prospérer sur un fourrage clairsemé des steppes. Le commerce de ces animaux constitue l'atout commercial le plus précieux du khanat."
 nd_kaz_barymta_raids: "Tradition de Barymta"
 nd_kaz_barymta_raids_desc: "Barymta, le raid rituel du bétail, sert à la fois de redistribution économique et d'entraînement martial. Les jeunes guerriers font leurs preuves en s'emparant des chevaux des clans rivaux, et cette pratique maintient l'avantage des compétences de cavalerie nomade entre les guerres."
 nd_kaz_seasonal_migration: "Migration saisonnière"
 nd_kaz_seasonal_migration_desc: "La migration annuelle entre les zhailau (pâturages d'été) et les kystau (camps d'hiver) rythme la vie nomade. Ce cycle entretient les prairies, nourrit les troupeaux et maintient la population dispersée sur le territoire, rendant le khanat remarquablement résistant aux invasions."
 nd_kaz_tore_cavalry: "Lanciers déchirés"
 nd_kaz_tore_cavalry_desc: "Les Tore, l'aristocratie chinggiside, assurent la cavalerie lourde de choc de l'armée kazakhe. Ces nobles lanciers, vêtus de mailles et brandissant de longues lances, mènent la charge décisive qui brise les formations ennemies après que les archers à cheval les ont ramollies."
 nd_kaz_jeti_zhargy: "Jeti Zhargy"
 nd_kaz_jeti_zhargy_desc: "The Seven Codes of Khan Tauke, assembled by the three great biys Tole, Kazybek, and Aiteke, codified the customary law of the Kazakh nation into a comprehensive legal framework governing inheritance, marriage, criminal justice, and pastoral rights.\n\n#italic Available in: $nd_kaz_biy_court$#!"
 nd_kaz_kumis_tradition: "Tradition Kumis"
 nd_kaz_kumis_tradition_desc: "Kumis, fermented mare's milk, is the sacred drink of the steppe, served at every gathering from humble aul feasts to the quriltay itself. Its production is both a culinary art and an economic activity sustaining nomadic communities.\n\n#italic Available in: $nd_kaz_kumis_brewery$#!"
 nd_kaz_zhuz_system: "Division des Trois Zhuz"
 nd_kaz_zhuz_system_desc: "La division de la nation kazakhe en Grand, Moyen et Junior Zhuz, chacun avec son propre territoire, ses sultans et ses traditions, constitue à la fois la plus grande vulnérabilité et la plus grande force du khanat. Aucune défaite ne peut détruire une nation répartie en trois hordes autonomes."
 nd_kaz_composite_bow_mastery: "Maîtrise de l'arc composite"
 nd_kaz_composite_bow_mastery_desc: "L'arc classique kazakh composite, composé de cornes, de tendons et de bois, offre une puissance dévastatrice à cheval. Des générations de raffinement l'ont rendu plus léger, plus réactif et plus précis, permettant le fameux tir kazakh arrière au grand galop."
 nd_kaz_caravan_tolls: "Péages pour caravanes"
 nd_kaz_caravan_tolls_desc: "Le contrôle des routes caravanières des steppes permet aux Kazakhs de percevoir des péages sur le trafic de la Route de la Soie traversant leur territoire. Les marchands paient pour un passage sûr, de nouvelles montures et une protection contre les bandits."
 nd_kaz_dzungar_mobilization: "Mobilisation Dzoungar"
 nd_kaz_dzungar_mobilization_desc: "La menace existentielle de l’invasion Dzoungar a forcé une mobilisation sans précédent de l’ensemble de la nation kazakhe. La zhasaq, milice tribale, fut constituée par décret du khan, attirant tous les hommes valides des trois zhuz pour défendre la patrie."
 nd_kaz_batyr_tradition: "Tradition batyr"
 nd_kaz_batyr_tradition_desc: "The batyr, the warrior champion, is the highest honor in Kazakh martial culture. Men like Bogenbai, Kabanbai, and Nauryzbai earned their title through feats of individual valor in battle, and their names echo through the centuries in epic poetry.\n\n#italic Available in: $nd_kaz_batyr_training_ground$#!"
 nd_kaz_togan_defenses: "Postes de garde Togan"
 nd_kaz_togan_defenses_desc: "Contrairement aux peuples sédentaires qui construisent des murs, les Kazakhs défendent leur territoire à travers des postes de garde mobiles et des postes de surveillance le long de la frontière. Ces togans fournissent une alerte précoce en cas d'invasion et servent de points de ralliement aux milices."
 nd_kaz_anyrakay_triumph: "Triomphe à Anyrakay"
 nd_kaz_anyrakay_triumph_desc: "La bataille de quarante jours à Anyrakay en 1730, où les forces kazakhes unies d'Abulkhair Khan détruisirent l'avancée des Dzungar à travers deux cents kilomètres de steppe, prouva qu'une cavalerie nomade coordonnée sur trois zhuz pouvait vaincre n'importe quel ennemi."
 nd_kaz_horse_silk_exchange: "Échange cheval-soie"
 nd_kaz_horse_silk_exchange_desc: "Le commerce réglementé entre le khanat kazakh et la dynastie Qing, échangeant des chevaux robustes des steppes contre de la soie, du thé et des produits manufacturés. Cela devint un pilier de la diplomatie et une source d'immense richesse pour les baïs kazakhs."
 nd_kaz_abulkhair_diplomacy: "La diplomatie d'Abulkhair"
 nd_kaz_abulkhair_diplomacy_desc: "Khan Abulkhair du Junior Zhuz a parcouru un paysage diplomatique périlleux, cherchant des alliances avec la Russie contre les Dzoungars tout en tentant de préserver la souveraineté kazakhe. Son sens politique pragmatique a établi le modèle de la diplomatie des steppes à l’ère des grands empires."
 nd_kaz_batyr_champions: "Champions de Batyr"
 nd_kaz_batyr_champions_desc: "L'expression ultime de la tradition martiale kazakhe : des guerriers légendaires qui combinent la maîtrise de l'arc composite, de la lance et du combat à cheval dans un seul ensemble dévastateur. Leurs faits d’armes inspirent des armées entières."
 nd_kaz_ablai_khan_reforms: "Les réformes d'Ablai Khan"
 nd_kaz_ablai_khan_reforms_desc: "Khan Ablai (r. 1771-1781) fut le dernier khan à exercer une véritable autorité sur les trois zhuz. Ses manœuvres diplomatiques entre la Russie et la Chine, combinées à des réformes internes centralisatrices, représentèrent l’épanouissement final du khanat kazakh en tant que puissance indépendante."
 nd_kaz_pastoral_wealth: "Richesse pastorale"
 nd_kaz_pastoral_wealth_desc: "At its peak, the Kazakh nation counted millions of horses, cattle, sheep, and camels. This livestock wealth, when properly managed and traded, rivals the silver mines and plantations of sedentary empires.\n\n#italic Available in: $nd_kaz_livestock_market$#!"
 nd_kaz_nomadic_logistics: "Logistique Nomade"
 nd_kaz_nomadic_logistics_desc: "Des siècles de migration saisonnière ont donné aux Kazakhs une compréhension inégalée de la logistique des steppes, de l'emplacement des sources d'eau, de la capacité de charge des pâturages et des itinéraires les plus rapides à travers des prairies apparemment sans piste."
 nd_kaz_warrior_code: "Code du guerrier kazakh"
 nd_kaz_warrior_code_desc: "La codification des traditions martiales nomades, depuis l'entraînement des archers à cheval jusqu'aux protocoles de guerre dans les steppes, préserve les compétences de combat qui ont soutenu la nation kazakhe à travers des siècles de conflit."
 nd_kaz_alash_identity: "Identité d'Alash"
 nd_kaz_alash_identity_desc: "Alash, l'ancêtre légendaire du peuple kazakh, donne son nom au sentiment durable d'identité commune qui lie les trois zhuz malgré la fragmentation politique. À une époque d’empires envahissants, cette conscience culturelle constitue l’ultime défense de la nation."
 nd_kaz_steppe_resistance: "Résistance des steppes"
 nd_kaz_steppe_resistance_desc: "The boundless steppe cannot be conquered by fortresses or supply lines. Every invading army that marches into the grasslands finds itself stretched thin, harried by mobile cavalry, and slowly consumed by the vastness itself.\n\n#italic Available in: $nd_kaz_steppe_arsenal$#!"
 nd_kaz_zhyrau_poets: "Poètes de Jyrau"
 nd_kaz_zhyrau_poets_desc: "The zhyrau, wandering poet-sages who compose epic verse on the deeds of batyrs, the wisdom of biys, and the beauty of the steppe, are the keepers of Kazakh memory. Their oral tradition preserves the nation's history more faithfully than any archive.\n\n#italic Available in: $nd_kaz_shezhire_archive$#!"
 nd_kaz_livestock_modernization: "Modernisation de l'élevage"
 nd_kaz_livestock_modernization_desc: "L'application de nouvelles techniques d'élevage et de connaissances vétérinaires aux vastes troupeaux kazakhs augmente à la fois la qualité et la quantité de la production animale, transformant le nomadisme pastoral en un système économique plus productif."
 nd_kaz_zhuz_unity: "Unité Zhuz"
 nd_kaz_zhuz_unity_desc: "La prise de conscience croissante d’une identité kazakhe commune transcendant les frontières du zhuz jette les bases d’une conscience nationale pan-kazakhe, renforçant les liens qui maintiennent la nation unie contre les pressions extérieures."
 a_nd_kaz_horse_archers: "Archers à cheval kazakhs"
 a_nd_kaz_horse_archers_desc: "L'épine dorsale de la guerre nomade : une cavalerie rapide armée d'arcs composites, maîtres de la feinte retraite et de la volée arrière dévastatrice."
 a_nd_kaz_quriltay_guard: "Garde du Quriltay"
 a_nd_kaz_quriltay_guard_desc: "La suite d'élite du khan, choisie parmi les meilleurs cavaliers de chaque clan lors de l'assemblée annuelle du quriltay."
 a_nd_kaz_tore_lancers: "Lanciers déchirés"
 a_nd_kaz_tore_lancers_desc: "Cavalerie noble Chinggisid brandissant de longues lances, ces troupes de choc lourdes délivrent la charge décisive qui brise les formations ennemies."
 a_nd_kaz_zhasaq_militia: "Milice Zhasaq"
 a_nd_kaz_zhasaq_militia_desc: "Infanterie tribale mobilisée par décret du khan en période de menace existentielle, composée de tous les hommes valides des trois zhuz."
 a_nd_kaz_batyr_champions: "Champions de Batyr"
 a_nd_kaz_batyr_champions_desc: "Des champions guerriers légendaires qui combinent la maîtrise de l'arc, de la lance et de l'équitation dans une fusion inégalée de puissance de frappe mobile."
 nd_kaz_horse_stud: "Haras des steppes"
 nd_kaz_horse_stud_desc: "Des terrains d'élevage où sont élevés les chevaux des steppes les plus robustes, des animaux compacts et endurants qui survivent uniquement grâce à l'herbe et constituent le fondement à la fois de la puissance militaire et de la richesse commerciale kazakhe."
 nd_kaz_quriltay_ground: "Terrain de Quriltay"
 nd_kaz_quriltay_ground_desc: "Un lieu d'assemblée permanent où les anciens des clans, les sultans et les chefs militaires se réunissent pour élire les khans, planifier les migrations et régler les différends selon la tradition chinggisid."
 nd_kaz_caravan_waystation: "Station de passage de caravane"
 nd_kaz_caravan_waystation_desc: "Un poste commercial de la Route de la Soie fournissant un abri, des montures fraîches et des provisions aux marchands traversant la steppe, reliant les marchés de Transoxiane à la Chine."
 nd_kaz_aul_encampment: "Campement d'Aul"
 nd_kaz_aul_encampment_desc: "Le camp nomade organisé, unité de base de la société kazakhe, où des yourtes en feutre sont élevées le long des routes de migration saisonnière entre Zhailau et Kystau."
 nd_kaz_kumis_brewery: "Brasserie Kumis"
 nd_kaz_kumis_brewery_desc: "Installations pour la production de kumis, lait de jument fermenté, boisson sacrée de la steppe servie lors des fêtes, assemblées et célébrations à travers la nation kazakhe."
 nd_kaz_batyr_training_ground: "Terrain d'entraînement de Batyr"
 nd_kaz_batyr_training_ground_desc: "Une académie martiale de la steppe où de jeunes guerriers s'entraînent aux arts du tir à l'arc monté, du combat à la lance et de la retraite simulée sous la direction de batyrs vétérans."
 nd_kaz_biy_court: "Cour de Biy"
 nd_kaz_biy_court_desc: "Une institution judiciaire où les biys, juges héréditaires, règlent les litiges selon le Jeti Zhargy, le droit coutumier codifié de la nation kazakhe."
 nd_kaz_frontier_watchtower: "Tour de guet de la frontière"
 nd_kaz_frontier_watchtower_desc: "Postes de garde le long de la frontière de la steppe fournissant une alerte précoce en cas d'invasion, servant de points de ralliement pour la milice et imposant l'usure à toute force d'invasion."
 nd_kaz_khans_chancellery: "Chancellerie de Khan"
 nd_kaz_khans_chancellery_desc: "Le centre administratif de l'autorité du khan, où les décrets sont rédigés, les tributs sont collectés et les affaires des trois zhuz sont coordonnées."
 nd_kaz_livestock_market: "Marché aux bestiaux"
 nd_kaz_livestock_market_desc: "Une plaque tournante commerciale centrale où sont achetés et vendus les vastes troupeaux de la steppe kazakhe, reliant les producteurs pastoraux aux marchands de la Route de la Soie."
 nd_kaz_steppe_arsenal: "Arsenal des steppes"
 nd_kaz_steppe_arsenal_desc: "Un dépôt d'armes contenant des stocks d'arcs, de lances, de sabres et, de plus en plus, d'armes à feu pour la défense de la patrie kazakhe."
 nd_kaz_shezhire_archive: "Archives Shezhire"
 nd_kaz_shezhire_archive_desc: "Une institution dédiée à la préservation du shezhire, des archives généalogiques et des histoires orales qui constituent l'épine dorsale de l'identité kazakhe, à travers le travail des poètes-sages zhyrau."
 nd_kaz_horse_rearing: "Élevage de chevaux"
 nd_kaz_horse_rearing_desc: "Élevage de chevaux de steppe robustes issus de troupeaux pastoraux pour le service militaire et le commerce."
 nd_kaz_council_provisions: "Dispositions du Conseil"
 nd_kaz_council_provisions_desc: "Bétail et textiles fournis pour soutenir les assemblées du Quriltay."
 nd_kaz_caravan_supply: "Fourniture de caravanes"
 nd_kaz_caravan_supply_desc: "Provisions et supports de remplacement fournis aux caravanes de la Route de la Soie."
 nd_kaz_felt_production: "Production de feutre"
 nd_kaz_felt_production_desc: "Sheep wool is beaten, wetted and rolled into felt for yurt coverings and clothing. The felt is sold as cloth."
 nd_kaz_kumis_brewing: "Brasserie Kumis"
 nd_kaz_kumis_brewing_desc: "Fermentation du lait de jument en kumis, la boisson traditionnelle des nomades des steppes."
 nd_kaz_arms_maintenance: "Entretien des armes"
 nd_kaz_arms_maintenance_desc: "Armes et chevaux entretenus pour l'entraînement des champions batyrs."
 nd_kaz_court_expenses: "Frais de justice"
 nd_kaz_court_expenses_desc: "Documents administratifs pour les tribunaux municipaux et les procédures judiciaires."
 nd_kaz_watch_upkeep: "Entretien de la montre"
 nd_kaz_watch_upkeep_desc: "Armes et provisions pour la garnison de la tour de guet de la frontière."
 nd_kaz_chancellery_upkeep: "Entretien de la Chancellerie"
 nd_kaz_chancellery_upkeep_desc: "Documents administratifs pour les opérations de la chancellerie du khan."
 nd_kaz_livestock_trade: "Commerce du bétail"
 nd_kaz_livestock_trade_desc: "La vente et l'échange organisés de bétail au marché central."
 nd_kaz_arms_stockpile: "Stock d’armes"
 nd_kaz_arms_stockpile_desc: "Armes et armes à feu conservées dans l'arsenal des steppes pour la défense nationale."
 nd_kaz_oral_tradition: "Tradition orale"
 nd_kaz_oral_tradition_desc: "La préservation et la transmission des généalogies kazakhes et de la poésie épique par les poètes-sages zhyrau."
 nd_kaz_formed_tt: "Le Kazakh a été formé"
 nd_kaz_path_a_tt: "Choisissez l'héritage de Kasym Khan"
 nd_kaz_path_b_tt: "Choisissez la Confédération des Trois Zhuz"
 nd_kaz_destiny: "Destin du khanat kazakh"
 nd_kaz_destiny_desc: "Le Khanat kazakh est né des cendres de la confédération ouzbèke. La nation doit maintenant choisir sa voie : forgera-t-elle un empire de conquête ou construira-t-elle une richesse durable à travers la steppe sans limites ?"
 nd_kaz_dest_syr_darya: "Villes du Syr-Daria"
 nd_kaz_dest_syr_darya_desc: "Reclaim the ancient Syr Darya cities of Sighnaq, Sawran and Otrar, the first seats of the Kazakh Khanate, and prove that the steppe's rightful rulers have returned."
 nd_kaz_dest_transoxiana: "Conquête de la Transoxiane"
 nd_kaz_dest_transoxiana_desc: "Marchez vers le sud pour vous emparer des villes légendaires de Samarkand et de Boukhara, joyaux de l'héritage timuride. Les cavaliers kazakhs chevaucheront là où Gengis et Timur régnaient autrefois."
 nd_kaz_dest_kipchak_empire: "Empire du Desht-i Kipchak"
 nd_kaz_dest_kipchak_empire_desc: "Unite the entire Kipchak steppe from the Volga to the Irtysh under Kazakh rule. Seize Astrakhan, the ruins of the Golden Horde capital at Sarai and Qashliq on the Irtysh, and restore the empire of Jochi Khan."
 nd_kaz_dest_silk_road: "Domination de la Route de la Soie"
 nd_kaz_dest_silk_road_desc: "Contrôlez la ville du Turkestan, le cœur spirituel de la steppe du Kipchak, et veillez à ce que les chevaux circulent sur les marchés kazakhs. Construisez les fondations d’un empire commercial pastoral."
 nd_kaz_dest_pastoral_mastery: "Maîtrise pastorale"
 nd_kaz_dest_pastoral_mastery_desc: "Secure Isfijab, embrace banking and build up Turkestan, the seat of the khans. The wealth of millions of livestock shall rival any sedentary kingdom."
 nd_kaz_dest_turkestan_developed_tt: "We own #bold Turkestan#! and its development is at least #bold 18#!"
 nd_kaz_dest_boundless_steppe: "La steppe sans limites"
 nd_kaz_dest_boundless_steppe_desc: "Seize Chach, the gateway to Transoxiana's silk markets, build it into a great city and make the Kazakh economy a center of continental trade. The steppe shall know no limits."
 nd_kaz_dest_chach_developed_tt: "We own #bold Chach#! and its development is at least #bold 29#!"
 nd_kaz.5.t: "Destin du khanat kazakh"
 nd_kaz.5.d: "The Kazakh Khanate stands at the threshold of greatness. From the rolling grasslands of the Desht-i Kipchak to the snow-capped peaks of the Tian Shan, the descendants of Janibek and Kerei have built a nation. But a nation is not yet an empire, and the choices made now will determine whether the Kazakhs are remembered as conquerors or as the wisest stewards the steppe has ever known.\n\nThe path forward is ours to choose."
 nd_kaz.5.a: "La steppe attend notre destin"
 nd_kaz.6.t: "Villes du Syr-Daria"
 nd_kaz.6.d: "Sighnaq, Sawran and Otrar, the ancient cities along the Syr Darya, have fallen under Kazakh dominion once more. These were the first seats of Kazakh power, where Janibek Khan held court and where the caravans of the Silk Road crossed paths with the nomadic hordes. Their reconquest marks the beginning of a greater ambition.\n\nThe walls of sedentary cities now shelter the khan's banners, and the world takes notice."
 nd_kaz.6.a: "Le premier pas sur un long chemin"
 nd_kaz.7.t: "Conquête de la Transoxiane"
 nd_kaz.7.d: "The unthinkable has been achieved. Kazakh cavalry rides through the streets of Samarkand, past the Registan and the turquoise domes of Timur's legacy. Bukhara, the Noble City, has opened its gates. The great oasis cities that once looked down upon the nomads of the steppe now pay tribute to a Kazakh khan.\n\nThis conquest demands a decision: shall we rule these cities with an iron fist, or harness their wealth through a more subtle arrangement?"
 nd_kaz.7.a: "Les villes s'agenouillent devant la steppe"
 nd_kaz.7.b: "Laissez-les rendre hommage et garder leurs voies"
 nd_kaz.8.t: "Empire du Desht-i Kipchak"
 nd_kaz.8.d: "From the banks of the Volga to the Irtysh at Qashliq, from Astrakhan to the ruins of Sarai where the Golden Horde once ruled, the entire Desht-i Kipchak now answers to a single khan. The Kazakh nation has achieved what no successor state of the Jochid Ulus managed since its collapse: the reunification of the western and eastern steppe under one banner.\n\nThis is more than conquest. This is the restoration of an empire that shook the world."
 nd_kaz.8.a: "Nous sommes les héritiers de Jochi Khan"
 nd_kaz.8.b: "Nous forgeons notre propre héritage dans la steppe"
 nd_kaz.9.t: "Domination de la Route de la Soie"
 nd_kaz.9.d: "The sacred city of Turkestan, home to the shrine of Khoja Ahmed Yasawi, stands firmly within Kazakh hands. More importantly, the trade routes that crisscross the steppe now flow through Kazakh-controlled markets where horses, the true currency of the nomad, are traded in their tens of thousands.\n\nThe foundations of a pastoral commercial empire have been laid."
 nd_kaz.9.a: "La richesse de la steppe coule entre nos mains"
 nd_kaz.10.t: "Maîtrise pastorale"
 nd_kaz.10.d: "The Kazakh steppe economy has matured beyond simple pastoralism. Banking institutions now facilitate the trade in livestock and horses that once relied on barter alone. The city of Isfijab serves as a hub where nomadic wealth meets sedentary commerce, and Turkestan, where the khans hold court beside the shrine of Ahmad Yasawi, has grown at a pace that would astonish the khans of old.\n\nTwo paths of prosperity present themselves: shall we double down on the pastoral wealth that makes the steppe unique, or leverage our position as the indispensable link in the continental caravan trade?"
 nd_kaz.10.a: "Les seigneurs des chevaux deviendront encore plus riches"
 nd_kaz.10.b: "Les routes des caravanes sont notre véritable richesse"
 nd_kaz.11.t: "La steppe sans limites"
 nd_kaz.11.d: "Chach, the gateway between the steppe and the silk-producing heartland of Central Asia, has been secured, and with it a flood of silk, tea, and precious goods pours into Kazakh markets. The nation has achieved what seemed impossible for a pastoral people: an economy that rivals any sedentary empire, built not on mines or plantations but on the boundless grasslands and the animals that sustain them.\n\nThe steppe has no walls, and neither does Kazakh ambition. A final choice remains: shall we concentrate this wealth into great cities, or spread it across the eternal pastures?"
 nd_kaz.11.a: "Construire une métropole digne de la steppe"
 nd_kaz.11.b: "Les pâturages éternels soutiennent tout"
 STATIC_MODIFIER_NAME_nd_kaz_dest_timurids_humbled: "Les Timourides humiliés"
 STATIC_MODIFIER_DESC_nd_kaz_dest_timurids_humbled: "La conquête de la Transoxiane démontre la suprématie de la cavalerie des steppes sur les troupes de garnison des villes sédentaires. Les compagnies mercenaires affluent sous la bannière du khan."
 STATIC_MODIFIER_NAME_nd_kaz_dest_oasis_tributaries: "Affluents des oasis"
 STATIC_MODIFIER_DESC_nd_kaz_dest_oasis_tributaries: "Plutôt que de détruire les richesses des villes conquises, le khan prélève un tribut par vassalité, accélérant ainsi l'incorporation de nouveaux territoires."
 STATIC_MODIFIER_NAME_nd_kaz_dest_successor_of_jochi: "Successeur de Jochi"
 STATIC_MODIFIER_DESC_nd_kaz_dest_successor_of_jochi: "En revendiquant l'héritage de Jochi Khan et de la Horde d'Or, le Khanat kazakh impose le respect de tous les peuples turcs et négocie depuis une position de prestige inattaquable."
 STATIC_MODIFIER_NAME_nd_kaz_dest_steppe_imperium: "Impérial des steppes"
 STATIC_MODIFIER_DESC_nd_kaz_dest_steppe_imperium: "Un nouvel empire s'élève sur la steppe, non pas une restauration mais quelque chose d'original. Les peuples conquis sont rapidement absorbés et l'autorité du khan pour faire la guerre est reconnue sur tout le continent."
 STATIC_MODIFIER_NAME_nd_kaz_dest_horse_lords: "Seigneurs des chevaux"
 STATIC_MODIFIER_DESC_nd_kaz_dest_horse_lords: "Les baïs kazakhs contrôlent des troupeaux qui se comptent par millions. Cette richesse pastorale est le moteur du développement institutionnel, même si la dépendance à l’égard de l’élevage rend les opérations bancaires formelles plus coûteuses."
 STATIC_MODIFIER_NAME_nd_kaz_dest_caravan_kings: "Rois de la caravane"
 STATIC_MODIFIER_DESC_nd_kaz_dest_caravan_kings: "Le contrôle kazakh des routes caravanières continentales crée un réseau de relations diplomatiques et permet une reprise rapide après les perturbations, même si l’accent mis sur le commerce se fait au détriment de la préparation militaire."
 STATIC_MODIFIER_NAME_nd_kaz_dest_nomad_metropolis: "Métropole nomade"
 STATIC_MODIFIER_DESC_nd_kaz_dest_nomad_metropolis: "Une grande ville s'élève sur la steppe, un centre commercial et diplomatique où la richesse nomade se transforme en splendeur urbaine, attirant des marchands et des envoyés de tout le continent."
 STATIC_MODIFIER_NAME_nd_kaz_dest_eternal_pastures: "Pâturages éternels"
 STATIC_MODIFIER_DESC_nd_kaz_dest_eternal_pastures: "Plutôt que de concentrer la richesse dans les villes, les Kazakhs ont répandu la prospérité dans les vastes prairies. Chaque domaine prospère, le prélèvement se renforce et la steppe elle-même devient le monument de la grandeur kazakhe."
 nd_kaz_khans_war_camp: "Camp de guerre de Khan"
 nd_kaz_khans_war_camp_desc: "Le centre de commandement mobile du khan kazakh lors des grandes campagnes, un vaste complexe de yourtes, de chariots de ravitaillement et de corrals qui sert de centre névralgique de la guerre dans les steppes."
 nd_kaz_great_bazaar: "Grand Bazar"
 nd_kaz_great_bazaar_desc: "Un vaste marché permanent où s'échangent les richesses pastorales de la steppe aux côtés de la soie, des épices et des produits manufacturés du monde sédentaire, cœur commercial de l'empire commercial kazakh."
 nd_kaz_war_camp_upkeep: "Entretien du camp de guerre"
 nd_kaz_war_camp_upkeep_desc: "Armes, chevaux, cuir et provisions pour le centre de commandement mobile du khan."
 nd_kaz_bazaar_operations: "Opérations de bazar"
 nd_kaz_bazaar_operations_desc: "Tissus, bétail, sel et outils nécessaires au maintien des opérations commerciales du grand bazar."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_kaz_bureaucracy_authority: "Autorité du Khan kazakh"
 AUTO_MODIFIER_DESC_nd_kaz_bureaucracy_authority: "With the khanate proclaimed, the customs of the steppe can be kept as standing institutions. The khan has room for three more of them."

 kaz_jeti_jargy_bureaucracy: "Jeti Jargy"
 kaz_jeti_jargy_bureaucracy_desc: "Au cours des dernières décennies du XVIIe siècle, Tauke Khan a convoqué les trois plus grands biys (Tole Bi du Zhuz senior, Kazybek Bi du Moyen, Aiteke Bi du Junior) et a codifié le droit coutumier de la steppe dans le Jeti Jargy, les Sept Codes. Les codes réglementent le prix du sang, le prix de la mariée, le vol de bétail et la punition des crimes; ils consacrent le tribunal de biy comme la véritable autorité judiciaire de la steppe. Là où les codes sont respectés, les Kazakhs ordinaires trouvent une protection contre la violence arbitraire des clans; là où ils se décomposent, les vendettas et les vols de bétail barymta reviennent."

 kaz_three_zhuz_confederation_bureaucracy: "Les Trois Zhuz"
 kaz_three_zhuz_confederation_bureaucracy_desc: "Le génie de la gouvernance kazakhe après Kasym Khan ne réside pas dans un seul khan mais dans l'équilibre de trois zhuz : l'Ulu, ou Senior, paissant à Jetysu; l'Orta, ou Milieu, sur la steppe centrale; et le Kishi, ou Junior, le long du Yaik. Chaque zhuz possède ses propres pâturages, ses propres biys, sa propre lignée de khans descendants de Janibek et Kerei. L'unité naît du consensus, jamais du commandement. Cet arrangement rend la steppe presque impossible à conquérir : mais chaque zhuz peut traiter et traite de manière indépendante avec les puissances étrangères, comme Abulkhair l’a fait avec la Russie en 1731."

 kaz_ak_suiek_tore_bureaucracy: "Ak-Suiek Tore"
 kaz_ak_suiek_tore_bureaucracy_desc: "Kazakh society is rigidly bisected between Ak-Suiek (white bone) and Kara-Suiek (black bone). Only descendants of Chinggis Khan through Jochi, the Tore, may claim the title of khan or sultan; only Tore may speak in the Kuralay assembly with binding authority. Below them, Kara-Suiek clans are led by their own biys and batyrs but barred from sovereign office. The Tore caste gives the Kazakhs an unbroken chain of legitimate rule from Janibek to Kenesary, but their endogamous insularity hollows out the political role of the lesser clans."

 kaz_aksakal_aul_governance_bureaucracy: "Gouvernance d'Aksakal Aul"
 kaz_aksakal_aul_governance_bureaucracy_desc: "Au-dessous des khans et hors de portée de toute chancellerie, la vie nomade kazakhe traverse l'aul - un camp d'hiver ou d'été composé peut-être d'une douzaine de yourtes appartenant à un seul groupe de parenté élargi. L'aksakal, la barbe blanche, est l'aîné dont la parole règle les droits de pâturage, les contrats de mariage et les différends quotidiens qui n'atteignent jamais un tribunal biy. L'institution n'a ni bâtiment, ni parchemin, ni salaire ; elle opère partout où les Kazakhs plantent leurs tentes. Quand le khan exige plus que ce que les anciens de l'aoul pensent, l'aoul migre tout simplement hors de portée."

 kaz_batyr_war_bands_bureaucracy: "Bandes de guerre Batyr"
 kaz_batyr_war_bands_bureaucracy_desc: "En dehors de la hiérarchie formelle des Tore se trouvent les batyrs, des guerriers de tout clan qui ont obtenu le titre grâce à des actes d'armes. Bogenbai, Kabanbai, Nauryzbai : les noms résonnent dans la tradition kazakhe comme ceux des hommes qui ont brisé l'invasion Dzoungar à Anyrakay en 1730 après la retraite catastrophique d'Aktaban Shubyryndy en 1723. Un batyr commande une troupe de guerre composée de ses propres parents et admirateurs ; il ne répond au khan que par choix, combat lorsqu'il y a de l'honneur ou du pillage à gagner et se disperse à la fin de la campagne. L’institution constitue le réservoir de main-d’œuvre militaire le plus profond de la steppe, mais elle fonctionne au barymta et ne peut être désactivée une fois la campagne terminée."
