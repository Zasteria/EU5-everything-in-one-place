l_french:
 NIN: "Assyria"
 NIN_ADJ: "assyrien"
 NIN_f: "Empire assyrien"
 NIN_f_desc: "Athur renaît. Là où le Patriarcat d’Orient et les réseaux monastiques de Tur Abdin assurent la continuité politique, le modèle impérial sargonide en fournit la forme : Ninive comme capitale, une armée professionnelle permanente, une fonction publique araméenne et l’administration de déportation et d’intégration qui unissait autrefois Babylone, le Levant et Memphis sous une seule couronne. Voilà à quoi aurait pu ressembler l’Empire néo-assyrien s’il avait survécu, grâce au catholicisme de Séleucie-Ctésiphon, à une renaissance contrefactuelle du pic de 671 av. J.-C. sous Esarhaddon et Ashurbanipal, canalisé par les institutions chrétiennes syriaques médiévales et couronné à Ninive."
