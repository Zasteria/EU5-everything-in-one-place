l_french:
 TBT: "Tibet"
 TBT_ADJ: "Tibétain"
 TBT_f: "Empire tibétain"
 TBT_f_desc: "Restaurez l'empire de l'ère Yarlung (Bod chen po) de Songtsen Gampo, Trisong Detsen et Ralpacan, lorsque les armées tibétaines chevauchaient de Lhassa jusqu'à la frontière Tang et tenaient le bassin du Tarim contre la Chine. Il s’agit du Tibet guerrier-impérial des édits aux piliers de pierre et de la synthèse bon-bouddhiste, et non de la théocratie Gelug ultérieure des lamas. Du Potala à Samye, l'étendard du Tsenpo se dresse à nouveau sur le Toit du Monde."
