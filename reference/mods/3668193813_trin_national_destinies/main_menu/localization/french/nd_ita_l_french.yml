l_french:
 STATIC_MODIFIER_NAME_nd_ita_patria_unita: "Patrie Unita"
 STATIC_MODIFIER_DESC_nd_ita_patria_unita: "L’Italie a été transformée en un seul État-nation sous un régime centralisé. Le rêve de Mazzini et de Garibaldi est devenu réalité : un peuple, un gouvernement, un destin."
 STATIC_MODIFIER_NAME_nd_ita_repubblica_delle_citta: "République de la Ville"
 STATIC_MODIFIER_DESC_nd_ita_repubblica_delle_citta: "L'Italie a embrassé son héritage comme une constellation de grandes villes (Venise, Florence, Milan, Naples), chacune apportant son génie à une république fédérée qui valorise avant tout la liberté, le commerce et le savoir."
 STATIC_MODIFIER_NAME_nd_ita_arsenale_naval_supremacy: "Suprématie navale de l'Arsenale"
 STATIC_MODIFIER_DESC_nd_ita_arsenale_naval_supremacy: "Les grands arsenaux italiens produisent des galères de guerre à un rythme inégalé en Méditerranée, et nos capitaines savent les utiliser."
 STATIC_MODIFIER_NAME_nd_ita_arsenale_merchant_fleet: "Flotte marchande de l'Arsenale"
 STATIC_MODIFIER_DESC_nd_ita_arsenale_merchant_fleet: "La tradition italienne de construction navale s'est tournée vers le commerce, produisant une flotte marchande qui transporte des marchandises du Levant vers les Flandres."
 STATIC_MODIFIER_NAME_nd_ita_irredenta_march: "Marche Italia Irredenta"
 STATIC_MODIFIER_DESC_nd_ita_irredenta_march: "Les feux du réveil national brûlent dans toute la péninsule. Les volontaires se rassemblent sous la bannière d’une Italie unie, marchant pour reconquérir chaque centimètre carré du territoire italophone."
 STATIC_MODIFIER_NAME_nd_ita_nation_building: "Construction de la nation"
 STATIC_MODIFIER_DESC_nd_ita_nation_building: "Le rêve d’une nation italienne a été conquis sur le champ de bataille ; il doit maintenant être cimenté par des écoles, des chemins de fer et des institutions qui unissent la péninsule en une véritable nation."
 nd_ita.1.t: "La naissance de l'Italie"
 nd_ita.1.d: "At last, the Italian peninsula stands united under a single banner. For centuries, the land of Dante, Machiavelli, and da Vinci was fractured among warring city-states, foreign overlords, and papal territories. Now that fragmentation is ended.\n\nBut unity raises a fundamental question: what kind of Italy shall this be? The peninsula's traditions pull in two directions. One path leads toward a centralized kingdom, a modern nation-state with uniform laws, a national army, and a single capital, modeled on the great powers of Europe. The other path honors the Italian genius for civic self-governance, the commune tradition that created Florence, Venice, and Genoa, each a republic of unprecedented wealth and culture.\n\nThe choice will shape Italy's destiny for generations.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ita.1.a: "Une nation, indivisible : forgez le Royaume d’Italie."
 nd_ita.1.b: "Une république de grandes villes : que chacune apporte son génie."
 nd_ita.2.t: "L'Arsenal de la République"
 nd_ita.2.d: "The great arsenals of Italy have reached an apex of productivity. In Venice, the Arsenale, stretching across forty-five hectares of the city's eastern shore, can outfit a complete war galley in a single day, an industrial feat unmatched anywhere in Europe. Sixteen thousand arsenalotti labor within its walls, organized into specialized guilds of sawyers, caulkers, oar-makers, and rope-spinners.\n\nThis tradition of industrial shipbuilding has spread to other Italian ports. Genoa, Naples, and Livorno have all established their own arsenals, each learning from the Venetian model. The question now is how to deploy this maritime capability."
 nd_ita.2.a: "Développez la flotte : la Méditerranée est notre mer."
 nd_ita.2.b: "Investissez dans la marine marchande : le commerce est notre force."
 nd_ita.3.t: "Les banquiers de Florence"
 nd_ita.3.d: "In the counting houses of Florence, a revolution in finance has transformed the way Europe does business. The great banking families (the Medici, the Bardi, the Peruzzi, the Strozzi) have invented instruments of credit that make it possible to move wealth across vast distances without ever touching a gold coin.\n\nBills of exchange, letters of credit, and the sistema di partita doppia, double-entry bookkeeping, allow Italian bankers to track every transaction with mathematical precision. Their branch networks stretch from London to Constantinople, and the florin has become the currency of international trade. Kings and popes alike depend on Italian credit to finance their ambitions."
 nd_ita.3.a: "La richesse des nations transite par nos banques."
 nd_ita.4.t: "Le Risorgimento"
 nd_ita.4.d: "A great awakening sweeps across the Italian peninsula. In secret lodges and public squares, in pamphlets and poetry, the dream of Italian nationhood has caught fire. Giuseppe Mazzini's 'Young Italy' movement has planted the seed; now it bears fruit in the form of a mass political movement that transcends the old boundaries of kingdom and duchy.\n\nThe Carbonari conspirators, the volunteers of Garibaldi's Red Shirts, the diplomatic cunning of Cavour: all have converged toward a single purpose. The foreign yoke is thrown off, the petty principalities dissolved. Italy, the land that gave the world the Renaissance and Roman law, now reclaims its place among the great nations.\n\nThis is a moment that demands a vision for the future."
 nd_ita.4.a: "Marchez ! Italia irrédenta doit être récupérée."
 nd_ita.4.b: "Construisez la nation : écoles, chemins de fer et institutions."
 nd_ita.5.t: "La Galleasse en guerre"
 nd_ita.5.d: "Italian naval engineers have perfected the galleass, a revolutionary warship that combines the maneuverability of the galley with the firepower of a sailing warship. These floating fortresses, mounting heavy guns on a continuous deck above the rowers, can deliver devastating broadsides while maintaining the ability to operate in the shallow, wind-fickle waters of the Mediterranean.\n\nAt the great Battle of Lepanto in 1571, six Venetian galleasses anchored the Christian line, their concentrated artillery fire shattering the Ottoman formation before the fleets even closed to boarding range. The galleass has proven that firepower, not just ramming and boarding, can decide a naval engagement."
 nd_ita.5.a: "Nos navires sont les murs de l'Italie."
 nd_ita_communal_governance: "Gouvernance Communale"
 nd_ita_communal_governance_desc: "La commune italienne, république urbaine autonome, est l’une des innovations politiques les plus distinctives du monde médiéval. Des villes comme Florence, Sienne et Lucques ont développé des systèmes sophistiqués de conseils élus, de constitutions écrites et de magistrats civiques."
 nd_ita_maritime_republics: "Républiques maritimes"
 nd_ita_maritime_republics_desc: "Venise, Gênes, Pise et Amalfi, les quatre républiques maritimes dont les flottes marchandes et les galères de guerre ont dominé le commerce méditerranéen pendant des siècles, établissant des comptoirs commerciaux et des colonies de la mer Noire à l'Atlantique."
 nd_ita_guelf_ghibelline: "Guelfe et Gibelin"
 nd_ita_guelf_ghibelline_desc: "La grande lutte entre factions entre les Guelfes pontificaux et les Gibelins impériaux a façonné la politique italienne pendant deux siècles, forgeant une tradition de loyauté civique féroce et de sophistication politique née de négociations constantes entre puissances concurrentes."
 nd_ita_florentine_banking: "Banque florentine"
 nd_ita_florentine_banking_desc: "Les grandes maisons bancaires de Florence (Médicis, Bardi et Peruzzi) ont inventé la finance moderne : lettres de change, comptabilité en partie double et réseaux de succursales internationales qui déplaçaient les capitaux à travers l'Europe."
 nd_ita_silk_trade: "Commerce de la soie italienne"
 nd_ita_silk_trade_desc: "Les ateliers de soie de Lucques, Florence et Venise produisaient des tissus d'une qualité légendaire, combinant la soie grège importée d'Orient avec des techniques italiennes de teinture et de tissage pour créer les textiles les plus recherchés d'Europe."
 nd_ita_condottiero_tradition: "Condottiero Tradition"
 nd_ita_condottiero_tradition_desc: "Les condottieri, capitaines mercenaires professionnels et leurs compagnies, transformèrent la guerre italienne en un art sophistiqué. Des dirigeants comme Sforza, Colleoni et Hawkwood commandaient des armées de lanciers blindés et d’arbalétriers sous contrat avec la cité-État la plus offrante."
 nd_ita_venetian_shipcraft: "Navire vénitien"
 nd_ita_venetian_shipcraft_desc: "L'Arsenal de Venise était le plus grand complexe industriel du monde préindustriel, capable de produire en un seul jour un navire de guerre entièrement équipé. Ses méthodes de montage à la chaîne anticipaient de quatre siècles la révolution industrielle."
 nd_ita_humanist_learning: "Apprentissage humaniste"
 nd_ita_humanist_learning_desc: "Les studia humanitatis (l'étude des textes classiques latins et grecs, de la rhétorique, de l'histoire et de la philosophie morale) ont commencé en Italie avec Pétrarque et Boccace, créant un mouvement intellectuel qui a remodelé la civilisation européenne."
 nd_ita_galleass_warfare: "Guerre de galasses"
 nd_ita_galleass_warfare_desc: "Le galleass, développé dans l'Arsenal vénitien, était un navire de guerre révolutionnaire montant une artillerie lourde au-dessus des bancs de rames. Lors de la bataille de Lépante en 1571, six galleasses vénitiennes ont brisé la formation de la flotte ottomane avant même la fermeture des flottes."
 nd_ita_murano_glasscraft: "Verrerie de Murano"
 nd_ita_murano_glasscraft_desc: "Les verriers de Murano, séquestrés sur leur île pour protéger leurs secrets commerciaux, ont développé des techniques d'une sophistication inégalée (verre cristallo, millefiori, lattimo) qui ont fait du verre vénitien le produit de luxe le plus prisé en Europe."
 nd_ita_commedia_dell_arte: "Commedia dell'Arte"
 nd_ita_commedia_dell_arte_desc: "La tradition théâtrale italienne de la comédie improvisée, avec ses personnages phares (Arlecchino, Colombina, Pantalone, le Dottore), s'est répandue à travers l'Europe, faisant des artistes italiens les artistes les plus célèbres du continent."
 nd_ita_palazzo_civic_tradition: "Palais Tradition Civique"
 nd_ita_palazzo_civic_tradition_desc: "Le palazzo pubblico, le palais civique, était l'expression architecturale du gouvernement communal italien. Du Palazzo Vecchio de Florence au Palais des Doges de Venise, ces bâtiments abritaient des conseils, des tribunaux et des archives qui administraient les gouvernements urbains les plus sophistiqués d'Europe."
 nd_ita_counter_reformation: "Contre-Réforme"
 nd_ita_counter_reformation_desc: "L’Italie était au cœur de la Contre-Réforme catholique. Le Concile de Trente (1545-1563), la fondation des Jésuites et l'Inquisition romaine émanèrent tous du sol italien, réaffirmant l'orthodoxie catholique et lançant une campagne de renouveau spirituel."
 nd_ita_porto_franco_tradition: "Porto Franco"
 nd_ita_porto_franco_tradition_desc: "In 1591 and 1593 Grand Duke Ferdinando I issued the Livornine, inviting merchants of every nation (Levantines, Spaniards, Portuguese, Greeks, Germans, Jews, Turks, Moors, Armenians and Persians) to settle at Livorno with freedom of worship and of trade. A fishing village became one of the great ports of the Mediterranean, and Genoa answered with a free port of its own."
 nd_ita_accademia_tradition: "Tradition de l'Académie"
 nd_ita_accademia_tradition_desc: "L'Italie a été la pionnière de l'académie moderne : l'Accademia della Crusca a standardisé la langue italienne, l'Accademia dei Lincei a fait progresser les sciences naturelles (comprenant Galilée parmi ses membres) et d'innombrables académies artistiques ont formé les meilleurs peintres et sculpteurs d'Europe."
 nd_ita_grand_tour: "Le Grand Tour"
 nd_ita_grand_tour_desc: "Au XVIIIe siècle, aucune éducation de gentleman européen n'était complète sans un Grand Tour d'Italie. Les ruines de Rome, l'art de Florence, la musique de Naples et les canaux de Venise ont attiré des milliers de riches voyageurs, faisant de l'Italie la capitale culturelle du monde civilisé."
 nd_ita_enlightened_reforms: "Des réformes éclairées"
 nd_ita_enlightened_reforms_desc: "Les penseurs italiens des Lumières (« Sur les crimes et les châtiments » de Cesare Beccaria, « La science de la législation » de Gaetano Filangieri) ont remodelé la pensée européenne sur la justice, la gouvernance et les droits de l’individu. Leurs idées ont influencé les réformateurs de Catherine la Grande à Thomas Jefferson."
 nd_ita_risorgimento: "Risorgimento"
 nd_ita_risorgimento_desc: "Le grand mouvement d'unification nationale italienne (impulsé par l'idéalisme de Mazzini, le génie militaire de Garibaldi et la ruse diplomatique de Cavour) a transformé une « expression géographique » en un État-nation. Les Bersaglieri, infanterie légère d'élite avec leurs chapeaux à plumes distinctifs, en sont devenus le symbole."
 nd_ita_carbonari_networks: "Réseaux Carbonari"
 nd_ita_carbonari_networks_desc: "Les Carbonari, « charbonniers », étaient la société révolutionnaire secrète la plus influente d'Italie. Opérant à travers des rituels codés et des cellules clandestines dans toute la péninsule, ils ont organisé des soulèvements contre la domination étrangère et semé les graines du nationalisme italien."
 nd_ita_industrial_awakening: "L'éveil industriel"
 nd_ita_industrial_awakening_desc: "Le Piémont et la Lombardie ont mené la transformation industrielle de l'Italie : le programme de construction ferroviaire de Cavour, l'aciérie Ansaldo de Gênes et les usines textiles de la vallée du Pô ont amené l'industrie moderne sur une terre longtemps définie par l'agriculture et l'artisanat."
 nd_ita_national_education: "Éducation Nationale"
 nd_ita_national_education_desc: "La loi Casati de 1859 et les réformes éducatives qui ont suivi ont créé un système scolaire italien unifié, luttant contre l'extrême analphabétisme régional de la péninsule et construisant une identité nationale partagée grâce à l'enseignement de l'italien standard."
 nd_ita_irredentism: "Italia Irredenta"
 nd_ita_irredentism_desc: "La doctrine de l'Italia Irredenta, « l'Italie non rachetée », exigeait l'incorporation de tous les territoires italophones, en particulier le Trentin, Trieste, l'Istrie et la Dalmatie, dans l'État italien, motivant l'ambition diplomatique et la planification militaire."
 a_nd_ita_condottiero_lances: "Condottier Lances"
 a_nd_ita_condottiero_lances_desc: "Cavalerie lourde dans la tradition condottiero, ces lanciers blindés servent sous contrat et sont réputés pour leurs charges dévastatrices et leur flexibilité tactique."
 a_nd_ita_condottiero_lances_levy: "Condottier Lances"
 a_nd_ita_condottiero_lances_levy_desc: "Cavalerie Levy élevée dans la tradition italienne des condottieros, des cavaliers blindés s'appuyant sur des siècles d'expertise en matière de guerre mercenaire."
 n_nd_ita_galleass: "Gallasse"
 n_nd_ita_galleass_desc: "Un navire de guerre massif combinant la puissance des rames et l'artillerie à bord. Développé à Venise, le galleass monte des canons lourds sur un pont de tir continu au-dessus des rameurs, délivrant une puissance de feu dévastatrice tout en conservant sa maniabilité dans les eaux méditerranéennes."
 a_nd_ita_bersaglieri: "Bersaglieri"
 a_nd_ita_bersaglieri_desc: "Infanterie légère d'élite de l'ère du Risorgimento, réputée pour sa vitesse, son adresse au tir et ses tactiques agressives. Identifiés par leurs chapeaux à larges bords distinctifs ornés de plumes de grand tétras."
 nd_ita_banco: "Banque"
 nd_ita_banco_desc: "Une maison bancaire italienne de tradition florentine, facilitant le commerce international grâce à des lettres de change, des lettres de crédit et des réseaux de succursales s'étendant à travers l'Europe."
 nd_ita_setificio: "Setificio"
 nd_ita_setificio_desc: "Un atelier de soie italien où les maîtres tisserands transforment la soie grège et les teintures en tissus fins d'une qualité extraordinaire, poursuivant les traditions perfectionnées à Lucques, Florence et Venise."
 nd_ita_arsenale: "Arsenale"
 nd_ita_arsenale_desc: "Un grand complexe naval sur le modèle de l'Arsenal vénitien, où des milliers d'artisans spécialisés produisent des navires de guerre et des navires marchands avec une efficacité inégalée au monde."
 nd_ita_palazzo_comunale: "Palais communal"
 nd_ita_palazzo_comunale_desc: "Un palais civique abritant les organes du gouvernement communal (conseils élus, palais de justice et archives administratives) incarnant la tradition italienne d'autonomie urbaine."
 nd_ita_porto_franco: "Porto Franco"
 nd_ita_porto_franco_desc: "A free port: goods may be landed, stored in bonded warehouses and shipped out again without paying duty, and the foreign merchants who handle them live under the protection of the prince with their own consuls, churches and synagogues."
 nd_ita_accademia: "Académie"
 nd_ita_accademia_desc: "Une académie des arts et des sciences de tradition italienne, où des érudits, des artistes et des philosophes naturels font progresser les connaissances humaines et affinent la langue et la culture italiennes."
 nd_ita_vetreria: "Vétrérie"
 nd_ita_vetreria_desc: "Une verrerie de style Murano où des maîtres artisans produisent du verre cristallo, millefiori et lattimo selon des techniques vénitiennes soigneusement gardées."
 nd_ita_manifattura: "Manifestation"
 nd_ita_manifattura_desc: "Une manufacture industrielle italienne produisant de l'acier et des produits finis, représentant la transformation industrielle qui a accompagné l'unification nationale."
 nd_ita_carbonari_lodge: "Lodge Carbonari"
 nd_ita_carbonari_lodge_desc: "Un lieu de rencontre clandestin de la société révolutionnaire Carbonari, où les patriotes se rassemblent pour comploter contre la domination étrangère et faire avancer la cause de la nation italienne."
 nd_ita_silk_weaving: "Tissage de la soie italienne"
 nd_ita_silk_weaving_desc: "La célèbre technique italienne de tissage de la soie grège et des teintures pour obtenir des tissus fins d'une qualité extraordinaire, perfectionnée dans les ateliers de Florence, Lucques et Venise."
 nd_ita_banking_operations: "Opérations bancaires"
 nd_ita_banking_operations_desc: "L'appareil administratif d'une maison bancaire italienne : les employés tiennent les grands livres en partie double, manipulent les lettres de change et gèrent la correspondance internationale dans des documents reliés en toile fine."
 nd_ita_arsenale_maintenance: "Entretien de l'Arsenal"
 nd_ita_arsenale_maintenance_desc: "L'approvisionnement constant en bois, goudron, outils et matériel naval était nécessaire pour maintenir un grand complexe de chantiers navals opérationnel et construire des navires de guerre."
 nd_ita_venetian_glassmaking: "Verrerie vénitienne"
 nd_ita_venetian_glassmaking_desc: "L'art secret de la fabrication du verre de Murano, produisant du cristallo, du millefiori et d'autres produits en verre exquis en utilisant des techniques étroitement gardées par les autorités vénitiennes."
 nd_ita_palazzo_upkeep: "Entretien du palais"
 nd_ita_palazzo_upkeep_desc: "La pierre, les papiers administratifs et les beaux tissus nécessaires au maintien d'un palais communal et de ses fonctions bureaucratiques dans une dignité civique appropriée."
 nd_ita_porto_franco_upkeep: "Free Port Upkeep"
 nd_ita_porto_franco_upkeep_desc: "Stone for the moles and warehouses, paper for the bills of lading and the registers of the customs house, and stores for the ships that call."
 nd_ita_accademia_upkeep: "Entretien académique"
 nd_ita_accademia_upkeep_desc: "Les livres, le papier et les instruments scientifiques en verre nécessaires aux recherches d'une académie, depuis les télescopes de Galilée jusqu'aux appareils des chimistes."
 nd_ita_steel_forging: "Forgeage d'acier italien"
 nd_ita_steel_forging_desc: "Une sidérurgie moderne utilisant des méthodes italiennes, combinant les traditions sidérurgiques lombardes avec des techniques industrielles pour produire un acier de haute qualité pour la construction et l'armement."
 nd_ita_carbonari_upkeep: "Entretien des Carbonaris"
 nd_ita_carbonari_upkeep_desc: "Les pamphlets, les manifestes et le vin qui soutiennent un réseau de cellules révolutionnaires, les patriotes se réunissent dans les tavernes, débattant de la libération autour de livres de philosophie politique."
 levy_nd_ita_condottiero_lances: "Condottiero Levy Lances"
 levy_nd_ita_condottiero_lances_desc: "Cavalerie Levy élevée dans la tradition italienne condottiero."
 nd_ita_formed_tt: "L'Italie s'est formée"
 nd_ita_path_a_tt: "Choisissez le destin#bold Patria Unita#!"
 nd_ita_path_b_tt: "Choisissez le destin#bold Repubblica delle Citta#!"
 nd_ita_dest_rome_developed_tt: "We own #bold Rome#! and its development is at least #bold 63#!"
 nd_ita_destiny: "Le destin italien"
 nd_ita_destiny_desc: "L’Italie est unie, mais l’unité n’est qu’un début. La péninsule qui a donné au monde Rome, la Renaissance et les fondements de la civilisation moderne doit désormais choisir son avenir parmi les grandes puissances. Stabilisez la nouvelle nation et tracez votre voie."
 nd_ita.6.t: "Le destin italien"
 nd_ita.6.d: "The dream of Italian unity has been achieved. From the Alps to Sicily, from the Ligurian coast to the Adriatic shore, the peninsula is one. But the great question remains: what shall Italy become?\n\nThe foundations are laid. Now we must build upon them, with purpose, with ambition, and with the knowledge that we are the heirs of Rome and the Renaissance both. The future of the Mediterranean, perhaps of Europe itself, turns upon the choices we make in this decisive hour."
 nd_ita.6.a: "Le destin de l'Italie commence maintenant."
 nd_ita.7.t: "Les terres non rachetées"
 nd_ita.7.d: "The tricolore flies over Trieste and Trento at last. For decades, Italian patriots spoke of the terre irredente, the unredeemed lands where Italian was spoken but foreign flags flew. Now they are Italian.\n\nThe army that accomplished this feat has been tempered in the crucible of irredentist warfare. Our soldiers know what it means to fight for national honor, and the general staff has proven its capacity for combined-arms operations against a European great power. Italy has announced its arrival on the stage of history."
 nd_ita.7.a: "Chaque centimètre carré du sol italien nous appartient."
 nd_ita.8.t: "Le Quatrième Rivage"
 nd_ita.8.d: "Italian boots tread the sands of North Africa. Tunisia and Tripolitania, lands that once formed the breadbasket of the Roman Empire, now fall under the Italian flag. The Mediterranean is no longer a barrier but a bridge, connecting the mother country to its new African provinces.\n\nBut an overseas empire demands choices. Some argue for rapid military buildup, conscripting colonial regiments, establishing garrisons, and preparing for the next war of expansion. Others see the value of naval dominance, controlling the sea lanes that connect Italy to its new possessions, and projecting power through the fleet rather than the barracks."
 nd_ita.8.a: "Levez les légions : l’Afrique a besoin de soldats."
 nd_ita.8.b: "Commandez la mer : la flotte est notre force."
 nd_ita.9.t: "Mare Nostrum"
 nd_ita.9.d: "Mare Nostrum, Our Sea. The words of the ancient Romans ring true once more. From Malta to the shores of Egypt, from Thessaloniki to the coasts of Libya, the Italian flag commands respect across the breadth of the Mediterranean.\n\nThis is not merely an empire of territory but an empire of influence, of trade routes and chokepoints, of cultural prestige and military power. Italy has achieved what no Italian state has accomplished since the fall of Rome: dominion over the inner sea.\n\nThe question now is how to wield this power. Some urge a new Roman imperium, centralized authority, mass levies, and the diplomatic weight of a true great power. Others advocate a fortress strategy, making Italy's Mediterranean positions impregnable through the trace italienne fortifications that Italian engineers pioneered."
 nd_ita.9.a: "Restaurer l'empire romain."
 nd_ita.9.b: "Fortifiez chaque position : l’Italie est imprenable."
 nd_ita.10.t: "Le Stato da Mar"
 nd_ita.10.d: "The Lion of Saint Mark once flew over the trading posts of the Adriatic and the fortresses of the Ionian shore. Now Italy inherits that legacy, not as a single maritime republic but as a confederation of great cities, each contributing its genius to a shared commercial destiny.\n\nVenetian merchants handle the spice trade, Genoese bankers finance the ventures, Florentine workshops transform raw silk into fine cloth, and Neapolitan shipwrights build the galleys that carry it all. The Dominio da Mar lives again, an Italian Mediterranean where commerce is king."
 nd_ita.10.a: "La mer est notre marché."
 nd_ita.11.t: "La Banque d'Italie"
 nd_ita.11.d: "Italian banking has reclaimed its ancient preeminence. The tradition of the Medici and the Bardi lives on in a modern form, a unified Italian banking system that commands the flow of capital across Europe. Bills of exchange drawn on Italian houses are honored from London to Constantinople, and the gold reserves of the Banca d'Italia rival those of any nation.\n\nWith Crete secured, the central Mediterranean's greatest waypoint, Italian commercial networks now stretch unbroken from the western Mediterranean to the Levant. The question is how to leverage this financial power."
 nd_ita.11.a: "Diplomatie et influence : à la manière des Médicis."
 nd_ita.11.b: "Monopoliser les routes : contrôler le commerce."
 nd_ita.12.t: "La Renaissance universelle"
 nd_ita.12.d: "The numbers do not lie. Italian cities lead the world in population, in wealth, in the production of goods both fine and common. Italian banks command the flow of capital from the Baltic to the Levant. Italian institutions of learning set the standard that all others aspire to reach.\n\nThis is no mere prosperity. It is a second Renaissance. Where the first Rinascimento revived the arts and letters of antiquity, this Rinascimento Universale has created something new: a civilization of commerce, culture, and innovation that radiates outward from the Italian peninsula to transform the world. The question now is how to sustain this golden age."
 nd_ita.12.a: "Investissez dans la connaissance : les idées sont éternelles."
 nd_ita.12.b: "Construire l’infrastructure de la prospérité."
 nd_ita_fortezza_moderna: "Fortezza Moderne"
 nd_ita_fortezza_moderna_desc: "Un complexe de forteresse italienne de pointe intégrant la trace italienne, la conception de bastion angulaire mise au point par les ingénieurs militaires italiens et qui a révolutionné la guerre défensive à travers l'Europe."
 nd_ita_fortezza_maintenance: "Entretien de la forteresse"
 nd_ita_fortezza_maintenance_desc: "La pierre, le fer et les armes à feu nécessaires pour maintenir une forteresse italienne moderne prête au combat."
 nd_ita_conservatorio: "Conservatoire"
 nd_ita_conservatorio_desc: "Un conservatoire italien de musique et d'arts, où compositeurs, musiciens et interprètes se forment dans la tradition qui a produit Vivaldi, Monteverdi et la forme lyrique qui a conquis les scènes européennes."
 nd_ita_conservatorio_upkeep: "Entretien du conservatoire"
 nd_ita_conservatorio_upkeep_desc: "Les instruments en papier, en tissu fin et en verre nécessaires au maintien d'un conservatoire et de ses artistes dans la tradition italienne."
 nd_ita_dest_irredenta: "Italia Irredenta"
 nd_ita_dest_irredenta_desc: "Les terres irrédentes (Trieste, Trente et les terres italophones encore sous domination étrangère) doivent être reconquises. Rassemblez une armée digne de la cause et marchez pour libérer chaque centimètre carré du sol italien."
 nd_ita_dest_quarta_sponda: "Le Quatrième Rivage"
 nd_ita_dest_quarta_sponda_desc: "La rive sud de la Méditerranée, la Tunisie et la Tripolitaine, alimentait autrefois l'Empire romain. Avec une armée professionnelle à ses côtés, l’Italie peut établir son empire africain et contrôler la Méditerranée centrale."
 nd_ita_dest_mare_nostrum: "Mare Nostrum"
 nd_ita_dest_mare_nostrum_desc: "Mare Nostrum, Notre Mer. De Thessalonique à Alexandrie, de Smyrne au détroit de Messine, l’Italie doit contrôler tout le bassin méditerranéen. Ce n’est qu’alors que les héritiers de Rome auront véritablement restauré l’imperium."
 nd_ita_dest_stato_da_mar: "État de la mer"
 nd_ita_dest_stato_da_mar_desc: "Le Stato da Mar vénitien, l’État maritime, a été construit sur la suprématie commerciale de l’Adriatique. Sécurisez Raguse, assurez-vous que la soie italienne circule sur nos marchés et jetez les bases d'un empire commercial qui rivalise avec la Sérénissime."
 nd_ita_dest_banca_italia: "Banque d'Italie"
 nd_ita_dest_banca_italia_desc: "Le secteur bancaire italien doit reconquérir la prééminence de l’ère Médicis. Sécurisez la Crète comme point de passage clé de la Méditerranée centrale, remplissez votre trésorerie et adoptez la révolution bancaire lancée par les financiers italiens."
 nd_ita_dest_rinascimento: "Rinascimento Universel"
 nd_ita_dest_rinascimento_desc: "A universal renaissance: Italy as the wealthiest and most commercially connected nation in the world. Master global trade, fill the coffers, and rebuild Rome as the popes of the first Renaissance began to, until the city of ruins and pasture is a capital again. Requires Rome at 63 development and 3,000 gold."
 STATIC_MODIFIER_NAME_nd_ita_dest_legioni_africane: "Légion Africaine"
 STATIC_MODIFIER_DESC_nd_ita_dest_legioni_africane: "Les légions africaines italiennes et les régiments coloniaux recrutés, entraînés et mis en garnison pour tenir la Quatrième Côte et se préparer à une nouvelle expansion sur le littoral méditerranéen."
 STATIC_MODIFIER_NAME_nd_ita_dest_dominio_dei_mari: "Dominio dei Mari"
 STATIC_MODIFIER_DESC_nd_ita_dest_dominio_dei_mari: "La flotte italienne domine les vagues entre la Sicile et la côte africaine, projetant sa puissance par le biais d'une domination navale plutôt que de garnisons, une stratégie maritime digne de la tradition vénitienne et génoise."
 STATIC_MODIFIER_NAME_nd_ita_dest_imperium_romanum: "Novum Imperium Romanum"
 STATIC_MODIFIER_DESC_nd_ita_dest_imperium_romanum: "Nouvel Empire romain, l’Italie exerce la puissance militaire agressive d’un véritable hégémon méditerranéen, projetant rapidement sa force sur ses dominions, même si la tension d’une campagne perpétuelle fait des ravages."
 STATIC_MODIFIER_NAME_nd_ita_dest_traccia_italiana: "Traccia Italienne"
 STATIC_MODIFIER_DESC_nd_ita_dest_traccia_italiana: "La trace italienne, un bastion angulaire mis au point par les ingénieurs militaires italiens, fait de chaque position italienne à travers la Méditerranée une forteresse imprenable défendue par l'artillerie moderne."
 STATIC_MODIFIER_NAME_nd_ita_dest_diplomazia_medicea: "Diplomatie médicale"
 STATIC_MODIFIER_DESC_nd_ita_dest_diplomazia_medicea: "À la manière des Médicis, l’influence par la finance, la diplomatie par la générosité, le pouvoir par la culture des amis. Les ambassadeurs italiens sont les bienvenus dans toutes les cours et le crédit italien ouvre toutes les portes."
 STATIC_MODIFIER_NAME_nd_ita_dest_monopolio_rotte: "Monopolio delle Rotte"
 STATIC_MODIFIER_DESC_nd_ita_dest_monopolio_rotte: "Les marchands et les banquiers italiens ont accaparé les routes commerciales les plus rentables de la Méditerranée, extrayant la richesse de chaque transaction ; bien qu’un commerce aussi agressif fasse monter les prix."
 STATIC_MODIFIER_NAME_nd_ita_dest_rinascimento_universale: "Rinascimento Universel"
 STATIC_MODIFIER_DESC_nd_ita_dest_rinascimento_universale: "Une renaissance universelle, les institutions, académies et ateliers italiens stimulent l’avancement des connaissances humaines, attirant des talents du monde entier et garantissant que les idées nées en Italie remodèlent la civilisation."
 STATIC_MODIFIER_NAME_nd_ita_dest_crocevia_continenti: "Crocevia dei Continenti"
 STATIC_MODIFIER_DESC_nd_ita_dest_crocevia_continenti: "L’Italie se trouve à la croisée des continents, un empire commercial cosmopolite où les peuples les plus divers sont les bienvenus, les infrastructures sont construites pour durer et la loyauté des sujets se gagne par la prospérité plutôt que par la force."

 # ===== BUREAUCRACIES =====
 ita_consiglio_dei_dieci_bureaucracy: "Conseil des Dieci"
 ita_consiglio_dei_dieci_bureaucracy_desc: "Créé le 25 juin 1310 après l'échec de la conspiration de Tiepolo et rendu permanent en 1335, le Conseil vénitien des Dix dirigeait les services de renseignement et le tribunal des crimes politiques de la République. Les dénonciations anonymes glissées par la bocche di leone contournèrent le Maggior Consiglio, plus lent, donnant à l'État un instrument rapide contre la trahison au prix du ressentiment patricien."
 ita_casa_di_san_giorgio_bureaucracy: "Maison de San Giorgio"
 ita_casa_di_san_giorgio_bureaucracy_desc: "Agréée le 23 avril 1407 pour consolider les dettes de guerre croissantes de Gênes avec Venise, la Casa delle compere e dei banchi di San Giorgio gérait les actions transférables de luoghi, le monopole du sel et les fermes fiscales de la République. Saluée comme la première banque publique moderne au monde, elle a précédé la Banque d'Angleterre de près de trois siècles et a soutenu le crédit génois jusqu'à la suppression de Napoléon en 1805."
 ita_santo_uffizio_bureaucracy: "Église Saint-Office"
 ita_santo_uffizio_bureaucracy_desc: "La bulle Licet ab initio du pape Paul III du 21 juillet 1542 établit la Congrégation sacrée suprême de l'Inquisition romaine et universelle sous la direction du cardinal Carafa. Le Saint-Office opérait par l'intermédiaire de tribunaux diocésains dans toute la péninsule, administrait l'Index des livres interdits à partir de 1559 et servait de tribunal doctrinal de la Contre-Réforme."
 ita_arsenale_di_venezia_bureaucracy: "Arsenal de Venise"
 ita_arsenale_di_venezia_bureaucracy_desc: "Le chantier naval d'État vénitien, dont la structure actuelle date de 1104 sous le Doge Ordelafo Faliero, fut agrandi par l'Arsenale Nuovo en 1320. À son apogée au début du XVIe siècle, il employait 16 000 arsenalotti et pouvait équiper une galère par jour sur une chaîne de production de pièces standardisées, faisant de la flotte de la République le moteur de son empire commercial à travers le Stato da Mar."
 ita_condotta_bureaucracy: "Système de la Condotta"
 ita_condotta_bureaucracy_desc: "Le système de capitulation italien par lequel les cités-États des XIVe et XVe siècles embauchaient des condottieri professionnels dans le cadre de contrats standardisés spécifiant la ferma (période de service), le salaire et l'aspetto (intervalle de renouvellement). Lorsqu'une condotta arrivait à expiration, le capitaine ne pouvait pas faire la guerre à son ancien employeur pendant deux ans. Le système a remplacé les milices civiques par des capitaines nobles sous contrat et a dominé la guerre italienne jusqu'à l'invasion de Charles VIII en 1494."
 ita_accademie_bureaucracy: "Académie"
 ita_accademie_bureaucracy_desc: "Les sociétés savantes qui ont institutionnalisé la haute culture italienne : l'Accademia della Crusca, fondée à Florence en 1583, a fixé la langue vernaculaire littéraire à travers son Vocabolario de 1612, modèle pour la future Académie française de Richelieu ; l'Accademia dei Lincei, fondée à Rome le 17 août 1603 par le prince Federico Cesi, fut la première académie scientifique au monde et comptait Galileo Galilei parmi ses premiers membres."
 ita_parlamento_siciliano_bureaucracy: "Parlement sicilien"
 ita_parlamento_siciliano_bureaucracy_desc: "Le Parlement sicilien, dont l'origine remonte à la Curia Regis de Roger II à Mazara en 1130 et codifié par les constitutions de Frédéric II de 1232. Ses trois brazos (militare (nobles), ecclesiastico (clergé) et demaniale (villes royales)) se réunissaient pour accorder des donativos à la couronne. Survivant à la domination aragonaise, espagnole et bourbonienne jusqu'en 1816, elle fut l'institution parlementaire la plus ancienne de la péninsule."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_ita_bureaucracy_authority: "Autorité bureaucratique italienne"
 AUTO_MODIFIER_DESC_nd_ita_bureaucracy_authority: "United Italy inherits the institutions of Venice, Genoa, Florence, the Papal States and the southern kingdoms. Four of the seven can be kept at once."
