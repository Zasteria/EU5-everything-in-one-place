l_french:
 STATIC_MODIFIER_NAME_nd_riders_of_the_naam: "Cavaliers du Naam"
 STATIC_MODIFIER_DESC_nd_riders_of_the_naam: "Le pouvoir divin du nom coule dans les veines de nos cavaliers. La tradition de la cavalerie Nakoms, transmise de père en fils depuis que les fondateurs sont partis de Mamprusi vers le nord, définit notre force. Aucun empire du Sahel ne peut égaler le tonnerre de nos guerriers à cheval à travers les prairies."
 STATIC_MODIFIER_NAME_nd_mogho_naaba_court: "La cour du Mogho Naba"
 STATIC_MODIFIER_DESC_nd_mogho_naaba_court: "Le Mogho Naba se situe au sommet d’une hiérarchie qui s’étend de Ouagadougou à chaque village. Ses ministres, le Ouidi Naba commandant la cavalerie, le Baloum Naba supervisant l'intendance, le Larl Naba gardant les douanes royales, forment une administration d'une sophistication remarquable pour le Sahel."
 STATIC_MODIFIER_NAME_nd_mossi_earth_awakening: "Éveil du sanctuaire terrestre"
 STATIC_MODIFIER_DESC_nd_mossi_earth_awakening: "Les prêtres de terre tengsoba ont renoué leur lien avec la terre. Les anciens sanctuaires des tengbiise dégagent un pouvoir spirituel, protégeant notre peuple des religions étrangères et liant la communauté au sol qui le soutient."
 nd_msi.1.t: "La fondation de Mossi"
 nd_msi.1.d: "The scattered Mossi kingdoms have been united under a single banner. From the Volta headwaters to the edges of the Sahel, the descendants of Ouédraogo now speak with one voice. But what kind of nation shall we forge from this union? The Nakomsé warrior aristocracy stands ready to ride, their cavalry the terror of Mali and Songhai alike. Yet the Mogho Naba's court in Ouagadougou offers another path, the sacred institution of naam, the elaborate hierarchy of provincial nabas and village chiefs, a system of governance that has endured for centuries through wisdom rather than conquest alone.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_msi.1.a: "Que les sabots de nos chevaux secouent la terre !"
 nd_msi.1.b: "La sagesse du Mogho Naba guidera notre peuple."
 nd_msi.2.t: "Les Nakoms chevauchent"
 nd_msi.2.d: "Les cavaliers Nakoms ont formalisé leurs anciennes traditions de cavalerie en une force de combat disciplinée. Depuis que les ancêtres fondateurs sont partis vers le nord depuis les terres Mamprusi, la guerre à cheval est le droit de naissance de la classe dirigeante Mossi. Désormais, grâce à des terrains d'entraînement et des programmes d'élevage appropriés, notre cavalerie sème la peur dans le cœur des royaumes voisins. Le tonnerre des sabots à travers la savane est le son du pouvoir Mossi."
 nd_msi.2.a: "Le nom nous donne le droit de rouler et de gouverner."
 nd_msi.3.t: "L'institution sacrée du Naam"
 nd_msi.3.d: "Le Mogho Naba a achevé la transformation de la gouvernance mossi en un système de royauté sacrée sans équivalent au Sahel. Le pouvoir du naam, l'autorité divine de gouverner, circule du Mogho Naba aux chefs de village en passant par les nabas provinciaux, créant ainsi une chaîne ininterrompue d'autorité légitime. La cérémonie quotidienne du faux départ, où le Mogho Naba monte à cheval comme pour abandonner son peuple avant de se laisser convaincre de rester, rappelle que l'engagement du roi envers ses sujets se renouvelle chaque matin."
 nd_msi.3.a: "Le nom perdure, et notre royaume aussi."
 nd_msi.4.t: "Les sanctuaires terrestres parlent"
 nd_msi.4.d: "Les tengbiise, les premiers habitants de nos terres, ont renouvelé l'ancienne alliance entre le peuple et la terre. Dans chaque village, le prêtre de la terre tengsoba s'occupe des bosquets sacrés où habitent les esprits de la terre. Ces sanctuaires sont antérieurs à la conquête des Nakoms et leur pouvoir reste essentiel à la vie des Mossi. La terre accorde la fertilité à nos champs, la protection à nos villages et une autorité spirituelle qui complète le pouvoir politique des nabas. Alors que l’influence islamique s’infiltre depuis le nord, nos sanctuaires terrestres constituent des bastions de traditions ancestrales."
 nd_msi.4.a: "Les esprits de la terre gardent notre mode de vie."
 nd_msi.5.t: "Carrefour du Sahel"
 nd_msi.5.d: "Les commerçants mossi ont mis en place un réseau de caravansérails reliant nos marchés aux grandes routes transsahariennes. Les tissus de coton tissés sur nos métiers à bandes, le bétail de nos troupeaux et le mil de nos champs coulent vers le nord, tandis que le sel, les noix de cola et les produits de luxe voyagent vers le sud à travers notre territoire. En taxant et en protégeant ces routes commerciales, les Mossi sont devenus des intermédiaires essentiels dans le commerce du Sahel occidental, devenant prospères sans les guerres de conquête qui ont ravagé le Mali et Songhaï."
 nd_msi.5.a: "Nos marchés seront le lieu de rencontre des nations."
 nd_msi_nakomse_horsemen: "Équitation Nakoms"
 nd_msi_nakomse_horsemen_desc: "Les traditions de cavalerie de l'aristocratie guerrière Nakoms, dont la lignée remonte aux cavaliers fondateurs de Mamprusi."
 nd_msi_earth_shrine_tradition: "Tradition du sanctuaire terrestre"
 nd_msi_earth_shrine_tradition_desc: "Pratique ancienne consistant à entretenir des sanctuaires sacrés en terre entretenus par des prêtres tengsoba, liant la communauté au pouvoir spirituel de la terre."
 nd_msi_ironworking_lineages: "Lignées de travailleurs du fer"
 nd_msi_ironworking_lineages_desc: "Les redoutées castes de forgerons des Mossi, dont la maîtrise de la fusion et du forgeage du fer est considérée à la fois essentielle et spirituellement dangereuse."
 nd_msi_volta_agriculture: "Agriculture Volta"
 nd_msi_volta_agriculture_desc: "Intensive cultivation of millet, sorghum, and other crops in the fertile Volta River headwaters region. In the dry north the crusted ground is opened with planting pits before the rains."
 nd_msi_naba_hierarchy: "Hiérarchie Naba"
 nd_msi_naba_hierarchy_desc: "Le système à plusieurs niveaux de nabas provinciaux, de chefs de district et de nabas de village qui transmet l'autorité du Mogho Naba dans tout le royaume."
 nd_msi_cotton_weaving: "Tissage de coton"
 nd_msi_cotton_weaving_desc: "Le tissage traditionnel du tissu en coton sur métier à tisser, où les femmes filent et teignent le fil tandis que les hommes le tissent pour en faire les textiles Mossi distinctifs."
 nd_msi_lancer_tradition: "Tradition des Lanciers"
 nd_msi_lancer_tradition_desc: "Guerriers à cheval professionnels armés de lances à pointe de fer forgées par les forgerons Mossi, le bras lourd de la cavalerie Nakoms."
 nd_msi_sacred_kingship: "Royauté sacrée"
 nd_msi_sacred_kingship_desc: "L'institution du naam, l'autorité divine pour gouverner et la cour élaborée du Mogho Naba avec ses six puissants ministres."
 nd_msi_mali_resistance: "Résistance au Mali"
 nd_msi_mali_resistance_desc: "The Mossi kingdoms' defiant resistance against the Mali Empire, raiding its caravans and garrisons rather than submitting to its authority. Behind the horsemen the commoners march on foot with their bows."
 nd_msi_horse_rearing: "Élevage de chevaux"
 nd_msi_horse_rearing_desc: "Specialized breeding programs that produce the hardy horses essential to Mossi cavalry dominance across the Sahel grasslands."
 nd_msi_sahel_trade_network: "Réseau commercial du Sahel"
 nd_msi_sahel_trade_network_desc: "Un réseau de marchés et de caravansérails reliant les terres mossi aux routes commerciales transsahariennes, échangeant du coton, du bétail et des céréales contre du sel et des produits de luxe."
 nd_msi_provincial_courts: "Cours provinciales"
 nd_msi_provincial_courts_desc: "Le système de gouvernance régionale dans lequel les nabas provinciaux tiennent leur tribunal, administrent la justice et perçoivent les tributs avec une autonomie locale considérable."
 nd_msi_iron_guard_tradition: "Tradition de la Garde de Fer"
 nd_msi_iron_guard_tradition_desc: "Infanterie d'élite armée d'armes de fer Mossi supérieur, entraînée à tenir le terrain pendant que la cavalerie manœuvre."
 nd_msi_songhai_defiance: "Défi Songhaï"
 nd_msi_songhai_defiance_desc: "La résistance obstinée des Mossi à l'expansion de Songhaï, fortifiant les villages et utilisant leur connaissance du terrain pour contrebalancer les avantages militaires de l'empire plus vaste."
 nd_msi_mask_artistry: "Artistique du masque"
 nd_msi_mask_artistry_desc: "The distinctive tall masks of the Mossi, carved to honor ancestors and nature spirits, used in festivals and ceremonies that bind communities together."
 nd_msi_trade_caravans: "Caravanes commerciales"
 nd_msi_trade_caravans_desc: "Organized trading expeditions that carry Mossi goods across the Sahel, establishing diplomatic relationships alongside commercial ones."
 nd_msi_ancestor_veneration: "Vénération des ancêtres"
 nd_msi_ancestor_veneration_desc: "L'approfondissement des pratiques de culte ancestral, où les offrandes dans les sanctuaires patrilinéaires relient les vivants à la sagesse et à la protection de leurs ancêtres."
 nd_msi_dolo_tradition: "Dolo Tradition"
 nd_msi_dolo_tradition_desc: "The communal brewing of dolo, millet beer that serves as both a staple beverage and a centerpiece of social and religious gatherings."
 nd_msi_fortified_villages: "Villages Fortifiés"
 nd_msi_fortified_villages_desc: "The practice of surrounding villages with defensive walls and ditches, creating a network of strongpoints across Mossi territory."
 nd_msi_sahel_riders_advance: "Cavaliers du Sahel"
 nd_msi_sahel_riders_advance_desc: "Des guerriers à cheval adaptés à toute la gamme du terrain sahélien, aussi à l'aise dans les prairies que dans les garrigues, avec des tactiques affinées au fil des siècles de guerre frontalière."
 nd_msi_naam_consolidation: "Consolidation de noms"
 nd_msi_naam_consolidation_desc: "Le renforcement de l'autorité sacrée du Mogho Naba, centralisant l'institution du naam pour créer une gouvernance plus efficace à travers les royaumes-unis."
 nd_msi_gold_dust_trade: "Commerce de poussière d’or"
 nd_msi_gold_dust_trade_desc: "Mossi merchants gain access to the gold dust trade flowing from southern mines through their territory, enriching the kingdom's treasury."
 nd_msi_indigo_dyeing: "Teinture indigo"
 nd_msi_indigo_dyeing_desc: "The mastery of indigo dyeing techniques that transform Mossi cotton cloth into prized trade goods sought across West Africa.\n\n#italic Available in: $nd_msi_weaving_house$#!"
 nd_msi_false_departure_ceremony: "Cérémonie de faux départ"
 nd_msi_false_departure_ceremony_desc: "Le rituel quotidien où le Mogho Naba monte à cheval comme pour partir, pour ensuite être persuadé de rester, un symbole puissant de l'alliance entre le dirigeant et le peuple."
 nd_msi_regional_autonomy: "Autonomie régionale"
 nd_msi_regional_autonomy_desc: "C'est l'équilibre délicat entre autorité centrale et autonomie provinciale qui a permis aux royaumes mossi de gouverner des peuples divers sans provoquer de rébellion."
 nd_msi_naam_cavalry_advance: "Cavalerie Naam"
 nd_msi_naam_cavalry_advance_desc: "La dernière grande évolution de la guerre à cheval Mossi, combinant l'équitation traditionnelle avec une discipline tactique moderne sous l'autorité du Naam."
 nd_msi_mogho_naba_reforms: "Réformes Mogho Naba"
 nd_msi_mogho_naba_reforms_desc: "Des réformes administratives qui modernisent l’État mossi tout en préservant les institutions essentielles du naam et l’autorité sacrée du Mogho Naba."
 nd_msi_sahel_diplomacy: "Diplomatie sahélienne"
 nd_msi_sahel_diplomacy_desc: "Une tradition diplomatique sophistiquée s’est développée au fil de siècles de navigation entre empires plus grands, de maintien de l’indépendance grâce à la construction d’alliances et de négociations judicieuses."
 nd_msi_cotton_exports: "Exportations de coton"
 nd_msi_cotton_exports_desc: "The expansion of Mossi cotton cloth production from local trade to major export commodity, with strip-woven textiles reaching markets across the Sahel and beyond.\n\n#italic Available in: $nd_msi_weaving_house$#!"
 nd_msi_warrior_aristocracy: "Aristocratie guerrière"
 nd_msi_warrior_aristocracy_desc: "La classe guerrière Nakoms a affiné ses traditions martiales pour en faire un établissement militaire professionnel, combinant les traditions de cavalerie noble avec un entraînement discipliné."
 nd_msi_mossi_jurisprudence: "Jurisprudence Mossi"
 nd_msi_mossi_jurisprudence_desc: "La codification des traditions juridiques mossi, s'appuyant sur la double source d'autorité politique des nabas et d'autorité spirituelle des prêtres de terre tengsoba."
 nd_msi_modern_horsemen: "Cavaliers modernes"
 nd_msi_modern_horsemen_desc: "The adaptation of Mossi cavalry to the modern age, combining traditional grassland mobility with contemporary military organization. A standing body of horse is kept under the Ouidi Naba."
 nd_msi_mossi_renaissance: "Renaissance Mossi"
 nd_msi_mossi_renaissance_desc: "Un épanouissement de la vie intellectuelle mossi, alors que les systèmes de connaissances traditionnelles s'engagent dans les nouvelles idées circulant le long des routes commerciales du Sahel."
 nd_msi_sahel_confederation: "Confédération du Sahel"
 nd_msi_sahel_confederation_desc: "La vision d’une union politique sahélienne plus large, étendant le modèle Mossi de gouvernance fédérée aux peuples voisins dans un cadre partagé."
 nd_msi_industrial_weaving: "Tissage Industriel"
 nd_msi_industrial_weaving_desc: "The mechanization of the ancient strip-loom tradition, transforming Mossi cotton weaving from a village craft into an industrial enterprise.\n\n#italic Available in: $nd_msi_weaving_house$#!"
 nd_msi_lasting_traditions: "Des traditions durables"
 nd_msi_lasting_traditions_desc: "La remarquable persistance des traditions culturelles mossi, des masques, des sanctuaires terrestres, du naam, des cérémonies quotidiennes, qui ont traversé des siècles de changement et de pressions extérieures."
 nd_msi_volta_breadbasket: "Corbeille à Pain Volta"
 nd_msi_volta_breadbasket_desc: "La transformation du cours supérieur de la Volta en une région agricole majeure, nourrissant une population croissante grâce à une agriculture intensifiée et à des techniques améliorées."
 a_nd_msi_nakomse_horsemen: "Cavaliers Nakoms"
 a_nd_msi_nakomse_horsemen_desc: "Les guerriers à cheval de la classe dirigeante Mossi, dont la tradition de cavalerie remonte aux ancêtres fondateurs qui chevauchaient vers le nord depuis Mamprusi. Armés de lances et combattant à cheval à travers les prairies ouvertes, ils incarnent le pouvoir naam."
 a_nd_msi_lancers: "Lanciers mossi"
 a_nd_msi_lancers_desc: "Cavalerie professionnelle armée de lances à pointe de fer forgées par les forgerons Mossi. Ces guerriers à cheval combinent les compétences traditionnelles de conduite des Nakoms avec un armement plus lourd, formant le bras de frappe des armées Mossi."
 a_nd_msi_iron_guard: "Garde de fer Mossi"
 a_nd_msi_iron_guard_desc: "Infanterie lourde équipée d'armes et d'armures supérieures issues des redoutées lignées de forgerons Mossi. Ces soldats tiennent la ligne pendant que la cavalerie manœuvre, leurs boucliers et leurs lames de fer témoignent du savoir-faire de la forge."
 a_nd_msi_sahel_riders: "Cavaliers du Sahel"
 a_nd_msi_sahel_riders_desc: "Des guerriers à cheval adaptés à tout le spectre du terrain sahélien, des prairies ouvertes aux broussailles du désert. Rapides et tactiquement flexibles, ils excellent dans les manœuvres de flanc et les raids rapides."
 a_nd_msi_naam_cavalry: "Cavalerie Naam"
 a_nd_msi_naam_cavalry_desc: "La dernière évolution de la tradition montée Nakoms, combinant des siècles d'équitation en prairie avec une discipline tactique moderne. Elevés grâce au système de prélèvements auprès des familles nobles qui portent le nom, ils luttent autant pour le droit divin que pour le territoire."
 a_nd_msi_talse_bowmen: "Talse Bowmen"
 a_nd_msi_talse_bowmen_desc: "The commoners of the villages, called out on foot with bows and poisoned arrows. They follow the noble horse and hold what it has taken."
 a_nd_msi_ouidi_riders: "Ouidi Riders"
 a_nd_msi_ouidi_riders_desc: "Horsemen kept under arms the year round by the Ouidi Naba, the minister of the cavalry. They are drilled as one body and still ride with the lance."
 levy_nd_msi_nakomse_horsemen: "Prélèvement des cavaliers de Nakoms"
 levy_nd_msi_nakomse_horsemen_desc: "Cavalerie noble issue de l'aristocratie guerrière Nakoms, raiders à cheval qui incarnent la tradition des cavaliers fondateurs des royaumes Mossi."
 levy_nd_msi_naam_cavalry: "Prélèvement de cavalerie Naam"
 levy_nd_msi_naam_cavalry_desc: "Le contingent de cavalerie noble et soldat élevé sous l'autorité sacrée du naam, combinant l'équitation traditionnelle Mossi avec une équitation en formation disciplinée."
 levy_nd_msi_talse_bowmen: "Talse Bowmen Levy"
 levy_nd_msi_talse_bowmen_desc: "Commoners raised from the villages to fight on foot with the bow."
 nd_msi_nabas_court: "La cour de Naba"
 nd_msi_nabas_court_desc: "Le complexe administratif d'un naba mossi, où le chef tient sa cour entouré de ses ministres et serviteurs. Les tribunaux provinciaux reflètent la structure du palais du Mogho Naba à Ouagadougou, créant une chaîne de gouvernance de la capitale au village."
 nd_msi_earth_shrine: "Sanctuaire terrestre"
 nd_msi_earth_shrine_desc: "Un bosquet sacré entretenu par le prêtre de la terre tengsoba, où des offrandes sont faites aux esprits de la terre. Ces anciens sanctuaires sont antérieurs à l’autorité politique Mossi et restent essentiels à la fertilité agricole et à la cohésion communautaire."
 nd_msi_forge: "Forge Mossi"
 nd_msi_forge_desc: "Un atelier géré par les redoutées lignées de forgerons des Mossi, qui détiennent les connaissances dangereuses et puissantes de la fonte du fer. Leurs forges produisent les armes, les outils et les instruments nécessaires à la vie militaire et agricole du royaume."
 nd_msi_caravanserai: "Caravansérail du Sahel"
 nd_msi_caravanserai_desc: "Une station de repos fortifiée le long des routes commerciales, offrant un abri, de l'eau et des marchés aux caravanes qui transportent du sel, des noix de cola, du coton et du bétail à travers le Sahel."
 nd_msi_weaving_house: "Maison de tissage"
 nd_msi_weaving_house_desc: "Un atelier où les hommes Mossi travaillent sur des métiers à tisser à bandes étroites, tissant des fils de coton filés et teints par les femmes pour en faire de longues bandes qui sont cousues ensemble pour fabriquer des robes et des étoffes commerciales."
 nd_msi_zai_fields: "Zai Fields"
 nd_msi_zai_fields_desc: "Before the rains, pits are dug into hard and crusted ground and a handful of manure is laid in each. The first storm fills them, and the millet is sown where the water stood."
 nd_msi_zai_upkeep: "Digging the Pits"
 nd_msi_zai_upkeep_desc: "Hoes for the digging and manure from the herds, every dry season."
 nd_msi_horse_stud: "Horse Stud"
 nd_msi_horse_stud_desc: "Herds of brood mares kept for the naba. Horses do not thrive far to the south, so every court of the Volta buys its mounts from studs such as this."
 nd_msi_dolo_house: "Dolo House"
 nd_msi_dolo_house_desc: "A compound where the women brew dolo, the red millet beer. Neighbours gather under its shelter on market day."
 nd_msi_kimse_roogo: "Kimse Roogo"
 nd_msi_kimse_roogo_desc: "The house of the ancestors of a lineage. Its masks are kept here between funerals, and the elder brings the offerings."
 nd_msi_kimse_roogo_upkeep: "Keeping the Masks"
 nd_msi_kimse_roogo_upkeep_desc: "Wood for new masks, pigment to repaint the old, and fibre for the costumes of the dancers."
 nd_msi_court_maintenance: "Entretien des tribunaux"
 nd_msi_court_maintenance_desc: "Le bétail et les tissus fins nécessaires au maintien de la dignité et du fonctionnement du tribunal administratif d'un naba."
 nd_msi_shrine_offerings: "Offrandes au sanctuaire"
 nd_msi_shrine_offerings_desc: "Du bétail était sacrifié, des bougies en cire d'abeille allumées et de l'encens brûlé dans les sanctuaires en terre pour maintenir l'alliance entre la communauté et les esprits de la terre."
 nd_msi_forge_upkeep: "Production de forges"
 nd_msi_forge_upkeep_desc: "Les forges sacrées des lignées de forgerons fondaient du minerai de fer avec du charbon de bois pour produire les outils nécessaires à l'agriculture et à la guerre des Mossi."
 nd_msi_caravanserai_upkeep: "Entretien du caravansérail"
 nd_msi_caravanserai_upkeep_desc: "Livestock, millet, salt and cloth for the caravans and their handlers who rest at the station."
 nd_msi_weaving_upkeep: "Tissage de coton"
 nd_msi_weaving_upkeep_desc: "Le fil de coton filé et teint à l'indigo est tissé sur des métiers à bandes étroites pour former le tissu distinctif commercialisé à travers le Sahel."
 nd_msi_horse_breeding: "Horse Breeding"
 nd_msi_horse_breeding_desc: "Brood mares are kept on the open grassland and fed millet through the dry season. The colts go to the Nakomsé."
 nd_msi_dolo_brewing: "Brasserie Dolo"
 nd_msi_dolo_brewing_desc: "Sprouted millet is boiled for two days over a wood fire in great clay jars. The beer is sold on market day and poured at every funeral."
 nd_msi_indigo_processing: "Indigo Dyeing"
 nd_msi_indigo_processing_desc: "The woven strips are steeped in the dye pits again and again until they are nearly black. Dark blue cloth sells for twice the price of white."
 nd_msi_export_cotton: "Trade Cloth"
 nd_msi_export_cotton_desc: "Plain strip cloth is woven in bulk and rolled into bales for the caravans. It is counted out as money in the markets to the south."
 nd_msi_power_looms: "Power Looms"
 nd_msi_power_looms_desc: "Driven looms weave the narrow strip many times faster than a man at the treadles. The cloth is still sewn together strip by strip."
 nd_msi_formed_tt: "Mossi est formé"
 nd_msi_path_a_tt: "Choisissez les Cavaliers du Naam"
 nd_msi_path_b_tt: "Choisissez la cour du Mogho Naba"
 nd_msi_dest_ouagadougou_court_tt: "Owns #bold Ouagadougou#! with at least #bold 19#! development"
 nd_msi_dest_ouagadougou_market_tt: "Owns #bold Ouagadougou#! with at least #bold 31#! development"
 nd_msi_destiny: "Destin Mossi"
 nd_msi_destiny_desc: "Les royaumes Mossi sont unis. Que ce soit par le tonnerre de la cavalerie ou la sagesse de la cour du Mogho Naba, un destin plus grand attend les enfants d'Oudraogo."
 nd_msi_dest_sahel_vanguard: "Avant-garde du Sahel"
 nd_msi_dest_sahel_vanguard_desc: "Conquer the Dagomba lands to the south, securing the gateway cities of Yendi and Salaga for the Mossi cavalry. Fill the war chest for the campaigns to come."
 nd_msi_dest_niger_campaign: "Campagne du Niger"
 nd_msi_dest_niger_campaign_desc: "Poussez vers le nord pour vous emparer de la riche ville commerçante de Djenn et du passage du fleuve Niger à Say. Les trésors de la Boucle du Niger attendent ceux qui auront l'audace de les saisir."
 nd_msi_dest_war_camp: "Camp de guerre du Naam"
 nd_msi_dest_war_camp_desc: "Terminez la conquête de la Boucle du Niger en prenant Tombouctou et Gao, les villes légendaires qui servaient autrefois de capitales au Mali et au Songhaï. Avec ces prix en main, l’empire de cavalerie Mossi surpassera tout ce qui l’a précédé."
 nd_msi_dest_court_foundation: "Fondation de la Cour"
 nd_msi_dest_court_foundation_desc: "Establish the Mogho Naba's court as the center of a prosperous realm. Secure salt for the markets and build up Ouagadougou, the seat of the Mogho Naba."
 nd_msi_dest_naam_institutions: "Institutions Naam"
 nd_msi_dest_naam_institutions_desc: "Adoptez des institutions financières modernes et étendez la portée commerciale de la cour à la ville commerçante d'or de Begho. Le système Naam assure la stabilité ; maintenant, il doit aussi assurer la prospérité."
 nd_msi_dest_market_hall: "Grand Marché du Sahel"
 nd_msi_dest_market_hall_desc: "Transform the Mossi realm into the premier trading power of the Sahel. Bring gold to the capital markets, raise Ouagadougou to twice its old size, and secure the southern trade hub of Kong."
 nd_msi.6.t: "Le chemin du destin Mossi"
 nd_msi.6.d: "Les royaumes Mossi ont réalisé une unité dont nos ancêtres ne faisaient que rêver. Des tribunaux de Ouagadougou aux tribunaux provinciaux du Yatenga et de Tenkodogo, le pouvoir du naam nous lie. Maintenant, la question n’est pas de savoir si nous allons durer, les Mossi ont toujours enduré, mais comment nous allons grandir. Notre destin est devant nous, attendant d’être façonné par les choix de cette génération."
 nd_msi.6.a: "Le nom nous guidera vers la grandeur."
 nd_msi.7.t: "Le Dagomba Soumettre"
 nd_msi.7.d: "Le tonnerre de la cavalerie Mossi a résonné dans les prairies du sud. Le royaume Dagomba, dont les guerriers contestaient autrefois notre passage, s'incline désormais devant le pouvoir des Nakoms. Les marchés de Yendi et Salaga, riches en noix de cola et en liens commerciaux avec les royaumes forestiers, alimentent désormais notre machine de guerre. Nos cavaliers évoluent librement depuis les sources de la Volta jusqu'à la lisière de la ceinture forestière. Le premier coup est porté ; le Niger Bend vous appelle."
 nd_msi.7.a: "Nos sabots nous porteront encore plus loin."
 nd_msi.8.t: "Les chutes du Niger Bend"
 nd_msi.8.d: "Djenn, le joyau du Niger, est tombé aux mains des Mossi. Notre cavalerie, descendante des guerriers qui ont attaqué les caravanes du Mali pendant des siècles, s'est enfin emparée du butin que leurs ancêtres ne pouvaient que piller. La grande mosquée en briques crues domine les bannières mossi, et le commerce fluvial qui enrichissait autrefois Songhaï passe désormais entre nos mains. Comment consolider cette conquête ?"
 nd_msi.8.a: "Frappez vite, frappez fort. Le Sahel nous craint !"
 nd_msi.8.b: "Nos cavaliers sont notre héritage, notre force en selle."
 nd_msi.9.t: "Maîtres du Niger"
 nd_msi.9.d: "Tombouctou et Gao, les piliers jumeaux de la civilisation sahélienne, répondent désormais au Mogho Naba. Ce que les empires du Mali et de Songhaï ont construit au fil des siècles, la cavalerie Mossi l'a revendiqué en une génération. Les caravanes transsahariennes qui transportaient autrefois le sel et l’or à travers les royaumes étrangers passent désormais sous notre protection. Les érudits des madrasas de Tombouctou parlent des Mossi avec la même crainte autrefois réservée à Mansa Musa. Comment allons-nous gouverner ce vaste domaine ?"
 nd_msi.9.a: "Nous sommes l'hégémonie. Tous s'inclinent devant le nom."
 nd_msi.9.b: "Nous sommes l'empire. Tous servent la bannière Mossi."
 nd_msi.10.t: "La Cour prend racine"
 nd_msi.10.d: "The Mogho Naba's vision of a prosperous, well-ordered realm is beginning to bear fruit. Salt caravans arrive regularly at our markets, bringing the essential commodity that preserves food and enables long-distance trade. Ouagadougou has outgrown the compound of the naba, and new wards spread around the court. The dual authority of political naam and spiritual earth-priest power creates a stability that neighboring kingdoms envy. This is governance as the ancestors intended."
 nd_msi.10.a: "La prospérité croît là où la bonne gouvernance prend racine."
 nd_msi.11.t: "Le Naam embrasse le commerce"
 nd_msi.11.d: "L’ancienne institution du nom s’est révélée remarquablement adaptable. Ce qui a commencé comme un mandat divin de gouverner s’est transformé en un cadre de gouvernance économique. Les marchands mossi, opérant sous la protection et la réglementation de la hiérarchie naba, ont établi des relations commerciales permanentes s'étendant jusqu'aux forêts riches en or de Begho, au sud. L'adoption par la Cour de pratiques financières modernes n'a pas diminué son caractère sacré, mais elle a plutôt démontré que la sagesse et la richesse ne doivent pas nécessairement être rivales."
 nd_msi.11.a: "Le commerce circulera par les canaux du nom."
 nd_msi.11.b: "La sagesse de la cour attire tous ceux qui recherchent l'ordre."
 nd_msi.12.t: "L'âge d'or des Mossi"
 nd_msi.12.d: "Gold flows through our capital markets. The trade hub of Kong connects our realm to the wealth of the forest kingdoms. Ouagadougou has become the market where the Sahel and the forest meet. The Mogho Naba presides over a realm that would astonish the founding ancestors, not because it was won by the sword, but because it was built by the steady application of naam's wisdom to the challenges of governance and commerce. The Mossi model, stability through sacred hierarchy, prosperity through controlled trade, stands as a beacon for the Sahel."
 nd_msi.12.a: "Laissons la prospérité des Mossi éclairer la voie à suivre."
 nd_msi.12.b: "Le nom perdure, un héritage pour tous les âges."
 STATIC_MODIFIER_NAME_nd_msi_dest_sahel_thunder: "Tonnerre du Sahel"
 STATIC_MODIFIER_DESC_nd_msi_dest_sahel_thunder: "La simple rumeur d'une cavalerie Mossi en marche pousse les ennemis à se précipiter pour fortifier leurs villes. La guerre arrive rapidement, même si le coût du maintien d’une réputation aussi redoutable met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_msi_dest_raider_legacy: "Héritage des pillards"
 STATIC_MODIFIER_DESC_nd_msi_dest_raider_legacy: "Les cavaliers Mossi maintiennent la tradition de raid de leurs ancêtres Nakoms, renforçant rapidement et soutenant les campagnes loin de chez eux grâce à une recherche de nourriture efficace."
 STATIC_MODIFIER_NAME_nd_msi_dest_niger_hegemony: "Hégémonie du Niger"
 STATIC_MODIFIER_DESC_nd_msi_dest_niger_hegemony: "La cavalerie Mossi a prouvé qu’elle pouvait prendre n’importe quelle ville du Sahel. Notre capacité à prendre d’assaut les fortifications et à dicter les conditions de paix reflète l’écrasante supériorité militaire du Naam."
 STATIC_MODIFIER_NAME_nd_msi_dest_sahel_empire: "Empire du Sahel"
 STATIC_MODIFIER_DESC_nd_msi_dest_sahel_empire: "Un vaste empire s'étendant à travers le Sahel, entretenu par une armée professionnelle et des auxiliaires mercenaires. Le coût du maintien de tant de relations diplomatiques n’est rien à côté de la force militaire acquise."
 STATIC_MODIFIER_NAME_nd_msi_dest_naam_prosperity: "Naam Prospérité"
 STATIC_MODIFIER_DESC_nd_msi_dest_naam_prosperity: "La sage gouvernance du Mogho Naba a créé un réseau commercial florissant. Les commerçants prospèrent grâce à des politiques stables et les bonnes pratiques financières du royaume maintiennent l'inflation sous contrôle."
 STATIC_MODIFIER_NAME_nd_msi_dest_court_wisdom: "La sagesse de la cour"
 STATIC_MODIFIER_DESC_nd_msi_dest_court_wisdom: "La sophistication du système judiciaire mossi permet l’absorption pacifique des peuples voisins par la diplomatie plutôt que par la guerre. Les conditions de paix favorables reflètent la réputation de la Cour, même si l'accent mis sur la gouvernance laisse moins d'énergie à l'innovation militaire."
 STATIC_MODIFIER_NAME_nd_msi_dest_sahel_golden_age: "Âge d’or du Sahel"
 STATIC_MODIFIER_DESC_nd_msi_dest_sahel_golden_age: "Une ère de prospérité sans précédent transforme le cœur du pays Mossi. Les villes se développent, les routes relient les marchés et les gens éprouvent une profonde satisfaction à l'égard de la gestion de leur dirigeant."
 STATIC_MODIFIER_NAME_nd_msi_dest_naam_legacy: "L'héritage de Naam"
 STATIC_MODIFIER_DESC_nd_msi_dest_naam_legacy: "L’héritage durable de la gouvernance naam garantit la stabilité entre les générations. Les peuples voisins considèrent les Mossi avec respect plutôt que crainte, et la noblesse constitue un pilier du royaume."
 nd_msi_war_camp: "Camp de guerre Mossi"
 nd_msi_war_camp_desc: "Un campement militaire permanent où la cavalerie Nakoms est entraînée, équipée et rassemblée pour les campagnes de conquête qui ont porté la bannière Mossi de la Volta au Niger. Les forges du camp produisent des armes tandis que ses corrals abritent les plus belles montures de cavalerie du Sahel."
 nd_msi_grand_market: "Grand Marché de Mossi"
 nd_msi_grand_market_desc: "Un vaste complexe commercial où les commerçants de tout le Sahel se réunissent sous la réglementation et la protection des responsables du marché nommés par Mogho Naba. Le sel du nord, l'or du sud, les tissus des métiers à tisser Mossi et le bétail des prairies changent de mains dans un échange ordonné qui enrichit tous les participants."
 nd_msi_war_camp_upkeep: "Approvisionnement du camp de guerre"
 nd_msi_war_camp_upkeep_desc: "Armes, armures de cuir et montures de cavalerie nécessaires au maintien du camp militaire permanent qui soutient les campagnes de conquête Mossi."
 nd_msi_grand_market_upkeep: "Opérations de marché"
 nd_msi_grand_market_upkeep_desc: "Tissu de coton pour la présentation des marchandises commerciales, sel pour les échanges commerciaux et récipients en poterie pour peser et stocker les produits échangés."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_msi_bureaucracy_authority: "L’art politique des Mossi"
 AUTO_MODIFIER_DESC_nd_msi_bureaucracy_authority: "L’État mossi unifié hérite de la boîte à outils institutionnelles forgée à Wagadugu, Ouahigouya et des quatre royaumes fondateurs : le Conseil Nayiri des Cinq Naabas, le tribunal du Vendredi Naam, le double pacte politico-spirituel avec les prêtres de terre tengsoba, le système provincial nakomse qui alignait la cavalerie du Sahel et la charte commerciale Yarse qui ancrait Wagadugu sur le circuit Salaga-Tombouctou. Choisissez les institutions à maintenir en vie."
 msi_nayiri_council_bureaucracy: "Conseil Nayiri des Cinq Naabas"
 msi_nayiri_council_bureaucracy_desc: "Le conseil électoral et consultatif du Mogho Naaba, composé depuis la fondation du Wagadugu de cinq ministres du palais : le Baloum Naaba, chef de la maison du roi ; le Gounga Naaba, chef d'infanterie ; le Larle Naaba, gardien des tombeaux royaux et des coutumes ; le Kamsaogo Naaba, gérant des eunuques du palais ; et le Ouidi Naaba, palefrenier royal et chef de cavalerie, doyen des ministres. Le conseil sélectionnait chaque nouveau Mogho Naaba parmi les fils éligibles du défunt roi et pouvait écarter un héritier jugé inapte à la guerre ou à des fonctions. Les cinq mêmes fonctions gouvernaient la cour du Yatenga à Ouahigouya, et le veto du conseil sur la succession en faisait le contrepoids institutionnel au trône pour toute l'ère précoloniale."
 msi_friday_court_bureaucracy: "Tribunal du vendredi de Moro-Naba"
 msi_friday_court_bureaucracy_desc: "L'audience hebdomadaire d'investiture du Naam à Wagadugu, attestée par la tradition orale depuis la fondation de la ville et encore jouée à l'aube tous les vendredis à l'ère moderne. Le Mogho Naaba sort du palais vêtu de rouge et assis sur un cheval comme pour la guerre ; les chefs de province, les ministres et les chefs de lignage se rangent par rang dans la cour ; les serments de loyauté sont renouvelés et les doléances entendues. Le rituel est le mécanisme institutionnel par lequel le naam, le droit divin de commander, circule du trône vers chaque chefferie de l'empire. Aucun nouveau chef de village ou de province ne peut gouverner sans que son nom ne soit conféré à Wagadugu."
 msi_tengsoba_compact_bureaucracy: "Compact du Prêtre de la Terre de Tengsoba"
 msi_tengsoba_compact_bureaucracy_desc: "Le double peuplement entre les conquérants Mossi issus du mariage de la princesse Yennenga et du chasseur Riale au début du XIIIe siècle et les peuples autochtones voltaïques (Nyonyose, Kibsi, Doghosie) qui détenaient les terres avant eux. L’autorité politique mossi (naam) appartient aux nakomse; l'autorité spirituelle sur le sol - tenga - appartient au prêtre de la terre tengsoba, toujours issu de la lignée autochtone. Aucun champ ne peut être défriché, aucun village fondé, aucune pluie invoquée sans la sanction rituelle du tengsoba. Le pacte est la base institutionnelle de la stabilité rurale mossi : il permet à une maigre aristocratie guerrière de gouverner une population conquise beaucoup plus importante sans exterminer sa religion."
 msi_nakomse_provincial_bureaucracy: "Gouvernance provinciale de Nakomse"
 msi_nakomse_provincial_bureaucracy_desc: "Le système patrilinéaire par lequel les fils du Mogho Naaba (les Dimas) se voyaient attribuer des provinces et les cousins ​​​​nakomse étaient nommés dans des chefferies moindres au cœur du pays Mossi. Chaque nakomse détenait son territoire par droit héréditaire de conquête, devait le service de cavalerie sur convocation royale, collectait un tribut par l'intermédiaire des chefs de village et transmettait une part au trône. Ce système a donné à l'empire sa célèbre cavalerie à longue portée - ce sont les cavaliers Mossi qui ont attaqué le Mali en 1328-1338 et ont repoussé une expédition Songhaï en 1483 - mais il a également alimenté la tendance centrifuge qui a donné naissance aux royaumes rivaux de Wagadugu, Yatenga, Tenkodogo, Fada N'Gourma et (plus tard) Boussouma."
 msi_yarse_charter_bureaucracy: "Charte commerciale de Yarse"
 msi_yarse_charter_bureaucracy_desc: "L’incorporation institutionnelle des caravaniers musulmans yarse, de langue mandé, descendants des commerçants Dyula-Wangara arrivés en pays mossi aux XVIe et XVIIe siècles. Obtenant des droits de résidence formels à la fin du XVIIIe siècle (certaines sources datent d'une concession de Naaba Saaga en 1780), les Yarse géraient des quartiers à Wagadugu, Kaya, Rakaye et Patenga, payaient des frais de commerce au trône et dominaient le circuit longue distance de kola-sel-textile entre la forêt Akan à Salaga et la boucle du Niger à Tombouctou. Leurs lignées marchandes endogames ont préservé l’islam et l’alphabétisation à la cour sans convertir le trône, et ont fourni à l’État mossi sa source de revenus la plus fiable et sa seule fenêtre sur le monde politique musulman sahélien."
