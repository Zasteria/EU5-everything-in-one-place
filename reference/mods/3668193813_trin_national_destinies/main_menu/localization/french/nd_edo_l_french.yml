l_french:
 STATIC_MODIFIER_NAME_nd_obas_divine_authority: "L'autorité divine d'Oba"
 STATIC_MODIFIER_DESC_nd_obas_divine_authority: "L'Oba règne en tant qu'incarnation divine de l'État d'Edo, sa parole loi, son palais le centre de tout pouvoir. Les chefs héréditaires servent à son gré et les guildes de guerriers marchent sous ses ordres."
 STATIC_MODIFIER_NAME_nd_city_of_guilds: "Cité des guildes"
 STATIC_MODIFIER_DESC_nd_city_of_guilds: "Benin City prospère en tant que métropole de guildes d'artisans organisées, chacune maîtrisant un métier héréditaire sous le patronage royal. Les fondeurs de laiton, les sculpteurs d'ivoire, les maroquiniers et les tisserands constituent l'épine dorsale économique et culturelle du royaume."
 nd_edo.1.t: "Le Royaume du Bénin"
 nd_edo.1.d: "The Edo people have united under a single banner. Benin City, with its massive earthwork fortifications and broad avenues lined with guild workshops, stands as one of the great cities of West Africa. The Oba's palace dominates the skyline, its walls decorated with bronze plaques depicting the kingdom's history.\n\nBut the character of this new kingdom remains to be determined. Will the Oba assert absolute divine authority, concentrating all military and political power in the palace? Or will the kingdom's strength flow from its extraordinary guild system (the brass-casters of Igun Street, the ivory carvers, the blacksmiths) whose hereditary crafts have made Benin famous across the known world?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_edo.1.a: "L'Oba est le royaume ; tout le pouvoir découle du palais."
 nd_edo.1.b: "Les guildes sont le royaume ; leur métier est notre force."
 STATIC_MODIFIER_NAME_nd_edo_ewuare_conqueror: "Ewuare le Conquérant"
 STATIC_MODIFIER_DESC_nd_edo_ewuare_conqueror: "Suivant le modèle d'Oba Ewuare, le royaume poursuit une expansion agressive, soumettant les peuples voisins et exigeant un tribut en captifs et en ressources."
 STATIC_MODIFIER_NAME_nd_edo_ewuare_builder: "Ewuare le constructeur"
 STATIC_MODIFIER_DESC_nd_edo_ewuare_builder: "Suivant le modèle d'Oba Ewuare, le royaume investit dans la reconstruction de la capitale, l'expansion des travaux de terrassement et la fréquentation des arts et des festivals qui définissent l'identité d'Edo."
 nd_edo.2.t: "L'héritage d'Ewuare"
 nd_edo.2.d: "Oba Ewuare the Great transformed the Edo kingdom from a collection of loosely affiliated communities into an imperial state. He renamed the kingdom, rebuilt Benin City with broad streets radiating from the palace, reformed the political hierarchy by appointing the crown prince Edaiken as the seventh member of the Uzama council, and led military expeditions eastward against the Igala kingdom at Idah and westward to subdue the Yoruba towns of Owo and Idanre.\n\nHis campaigns expanded Benin's territory to over 5,000 square miles, creating a network of tributary relationships that fueled the kingdom's economy with levies of manpower and resources. But Ewuare was also a patron of arts and festivals, introducing the Igue ceremony and the guild of costume and bead workers.\n\nWill we follow the path of Ewuare the conqueror, or Ewuare the builder?"
 nd_edo.2.a: "Son épée a façonné notre domination."
 nd_edo.2.b: "Sa vision a bâti notre capitale."
 STATIC_MODIFIER_NAME_nd_edo_portuguese_arms: "Commerce d'armes portugais"
 STATIC_MODIFIER_DESC_nd_edo_portuguese_arms: "Les armes à feu et les fournitures militaires européennes transitent par les ports du Bénin, renforçant ainsi les forces armées du royaume et permettant une modernisation militaire rapide."
 STATIC_MODIFIER_NAME_nd_edo_portuguese_trade: "Alliance commerciale portugaise"
 STATIC_MODIFIER_DESC_nd_edo_portuguese_trade: "Les liens commerciaux avec les marchands portugais ont ouvert de nouveaux marchés pour le poivre, l'ivoire et l'huile de palme du Bénin, enrichissant ainsi le trésor du royaume et élargissant ses réseaux commerciaux."
 nd_edo.3.t: "Arrivée des Portugais"
 nd_edo.3.d: "Portuguese sailors have appeared on the coast near Benin City, bearing strange goods and stranger customs. Their delegations assiduously seek commercial treaties with the Oba, recognizing Benin as the most powerful polity in the region.\n\nThe Oba's position is strong. He has prohibited the sale of male slaves, he needs them for his own army, and imposed strict controls on all trade through royal monopoly. The Portuguese offer firearms, brass ingots for the bronze-casters, and access to distant markets. In return they seek pepper, ivory, cloth, and beads.\n\nThe question is not whether to trade, but what to prioritize. Shall we focus on acquiring European arms to strengthen our military, or on building lasting commercial relationships that will enrich the kingdom for generations?"
 nd_edo.3.a: "Leurs armes rendront nos guerriers invincibles."
 nd_edo.3.b: "Leurs marchés enrichiront nos commerçants."
 nd_edo.4.t: "Maîtres de la cire perdue"
 nd_edo.4.d: "The Igun Eronmwon, the guild of brass-casters on Igun Street, have reached an extraordinary level of mastery. Using the ancient lost-wax technique, where molten metal is poured into precisely carved wax and clay moulds, they produce portrait heads, commemorative plaques, and ceremonial objects of astonishing naturalism and detail.\n\nTheir work serves a political purpose as much as an artistic one. The bronze plaques that line the palace walls depict the history of the kingdom, the deeds of past Obas, and the proper order of the world. Every plaque is a statement of power, legitimacy, and cultural identity. The guild's hereditary membership ensures their secrets are preserved across generations, and their status as the highest-ranking artisan guild in Benin reflects the kingdom's understanding that artistic excellence is inseparable from political authority."
 nd_edo.4.a: "Leur art immortalise notre royaume."
 nd_edo.5.t: "La Cour de la Reine Mère"
 nd_edo.5.d: "The institution of the Iyoba, the Queen Mother, has become a formidable pillar of Benin's political structure. The Iyoba commands her own palace, her own court, and most remarkably, her own military regiment. This is no mere ceremonial honor.\n\nThe Iyoba's regiment provides the Oba with a loyal military force separate from the warrior guilds and noble retinues, a counterbalance to any faction that might threaten royal authority. Her political influence extends through her own network of advisors and agents, giving the monarchy a second center of power that strengthens the whole structure.\n\nThe establishment of this institution represents a sophisticated understanding of governance, that concentrated power is less stable than distributed loyalty."
 nd_edo.5.a: "Le Iyoba nous renforce tous."
 nd_edo_ogiso_legacy: "L'héritage d'Ogiso"
 nd_edo_ogiso_legacy_desc: "Les traditions de l'ancienne dynastie Ogiso, les « souverains du ciel », constituent le fondement spirituel de l'identité d'Edo et du culte des ancêtres."
 nd_edo_iya_fortifications: "Fortifications d'Iya"
 nd_edo_iya_fortifications_desc: "L'immense système de douves et de remparts en terrassement entourant Benin City, commencé sous Oba Oguola, atteint une hauteur de 18 mètres et encercle toute la capitale."
 nd_edo_early_guilds: "Première organisation de guilde"
 nd_edo_early_guilds_desc: "The first organization of Benin's artisan guilds under royal patronage, establishing the hereditary craft traditions that would define the kingdom's economy. The royal weavers, the Owina n'Ido, are counted among the oldest.\n\n#italic Available in: $nd_edo_owina_ward$#!"
 nd_edo_warrior_guilds: "Tradition de la guilde des guerriers"
 nd_edo_warrior_guilds_desc: "Les guildes guerrières organisées du Bénin, équipées d'épées, de lances et de boucliers en peau d'éléphant ou de crocodile, réputées pour leur discipline sur toute la côte guinéenne."
 nd_edo_oral_histories: "Histoires orales d'Edo"
 nd_edo_oral_histories_desc: "Les riches traditions orales préservent la généalogie des Obas, les actes des ancêtres et les coutumes juridiques du peuple Edo à travers les générations."
 nd_edo_ewuare_reforms: "Les réformes d'Ewuare"
 nd_edo_ewuare_reforms_desc: "Les réformes politiques radicales d'Oba Ewuare le Grand, qui centralisa l'autorité royale, réorganisa le conseil d'Uzama et transforma le Bénin en un État impérial."
 nd_edo_eben_tradition: "Tradition de l'épée d'Eben"
 nd_edo_eben_tradition_desc: "La maîtrise de l'eben, l'épée courte traditionnelle d'Edo, maniée par les guildes de guerriers dans des formations disciplinées, que les observateurs étrangers comparaient favorablement à celles de Guinée."
 nd_edo_uzama_reform: "Réforme Uzama"
 nd_edo_uzama_reform_desc: "La réforme de la noblesse héréditaire Uzama, plaçant les faiseurs de rois traditionnels sous un contrôle royal plus ferme et réduisant leur pouvoir indépendant."
 nd_edo_regional_trade: "Réseaux commerciaux régionaux"
 nd_edo_regional_trade_desc: "Le rôle du Bénin en tant qu'intermédiaire entre les royaumes d'Afrique de l'Ouest, échangeant du poisson, du sel, de l'igname, du coton et des perles de pierres semi-précieuses dans la région du Bas Niger."
 nd_edo_expanded_earthworks: "Travaux de terrassement élargis"
 nd_edo_expanded_earthworks_desc: "L'extension des terrassements défensifs du Bénin jusqu'à la périphérie de la ville, créant un système interconnecté de douves et de remparts couvrant des milliers de kilomètres carrés."
 nd_edo_court_arts: "Mécénat des arts de la cour"
 nd_edo_court_arts_desc: "Le patronage de l'Oba envers les guildes d'artisans héréditaires, produisant des sculptures en ivoire, des sculptures en bronze, des perles de corail et des textiles richement décorés pour la cour royale."
 nd_edo_portuguese_contact: "Contact portugais"
 nd_edo_portuguese_contact_desc: "L'arrivée des commerçants portugais vers 1486, ouvrant le Bénin au commerce atlantique et apportant de nouveaux biens, technologies et relations diplomatiques."
 nd_edo_igun_eronmwon: "Maîtrise d'Igun Eronmwon"
 nd_edo_igun_eronmwon_desc: "The brass-casters of Igun Street achieve mastery of the lost-wax technique, producing the bronze plaques, portrait heads, and ceremonial objects that define Benin's artistic legacy.\n\n#italic Available in: $nd_edo_igun_workshop$#!"
 nd_edo_guild_warrior_tradition: "Tradition des guerriers de guilde"
 nd_edo_guild_warrior_tradition_desc: "La maturation des guildes guerrières organisées du Bénin en une force militaire disciplinée, équipée d'épées, de lances et de flèches empoisonnées, capable de mobiliser 20 000 soldats en une seule journée."
 nd_edo_royal_monopoly: "Monopole commercial royal"
 nd_edo_royal_monopoly_desc: "The Oba's strict control over all foreign trade, creating royal monopolies on pepper, ivory, and palm oil that gave Benin a strong bargaining position with European merchants. Coral, too, is the Oba's alone to give.\n\n#italic Available in: $nd_edo_market_house$ and $nd_edo_igun_workshop$#!"
 nd_edo_pepper_trade: "Commerce d’exportation de poivre"
 nd_edo_pepper_trade_desc: "The systematic export of pepper and ivory to European markets, with the Oba controlling prices and quantities to maximize the kingdom's profit."
 nd_edo_lower_niger_control: "Administration du Bas-Niger"
 nd_edo_lower_niger_control_desc: "The extension of Benin's administrative reach across the Lower Niger, establishing tributary relationships with neighboring polities through a combination of military force and diplomacy. War canoes carried the Oba's armies along the creeks and lagoons as far as Eko, the war camp that became Lagos."
 nd_edo_iyoba_institution: "Établissement Iyoba"
 nd_edo_iyoba_institution_desc: "L'établissement de l'Iyoba, la reine mère, en tant qu'institution politique dotée de son propre palais, de sa cour et de son régiment militaire, contrepoids aux factions nobles."
 nd_edo_palace_societies: "Sociétés de palais"
 nd_edo_palace_societies_desc: "Les sociétés de palais Iwebo, Iweguae et Ibiwe qui géraient respectivement la garde-robe, les insignes et la maison de l'Oba, formaient une bureaucratie professionnelle au sein de la cour royale."
 nd_edo_ivory_exports: "Maîtrise de l'exportation de l'ivoire"
 nd_edo_ivory_exports_desc: "The height of Benin's ivory trade, with skilled carvers producing elaborate tusks, armlets, and decorative objects for both domestic use and European markets.\n\n#italic Available in: $nd_edo_igbesanmwan_ward$#!"
 nd_edo_firearms_adoption: "Adoption des armes à feu"
 nd_edo_firearms_adoption_desc: "L'intégration des armes à feu européennes dans l'armée béninoise, d'abord grâce au commerce portugais, puis par l'intermédiaire des marchands néerlandais et britanniques."
 nd_edo_benin_city_planning: "Planification urbaine du Bénin"
 nd_edo_benin_city_planning_desc: "L'organisation urbaine sophistiquée de Benin City, avec de larges rues partant du palais de l'Oba, des quartiers de corporations spécialisés et des quartiers résidentiels planifiés."
 nd_edo_isekpokin_guild: "Guilde Isekpokin"
 nd_edo_isekpokin_guild_desc: "La guilde Isekpokin de travailleurs du bouclier et du cuir, produisant les boucliers distinctifs en peau d'éléphant et de crocodile portés par les guerriers béninois au combat."
 nd_edo_absolute_monarchy: "Monarchie absolue"
 nd_edo_absolute_monarchy_desc: "L'apogée de l'autorité absolue de l'Oba, avec tous les aspects de la vie politique, économique, militaire et religieuse centrés sur le palais royal."
 nd_edo_musketeer_regiments: "Régiments de mousquetaires d'Edo"
 nd_edo_musketeer_regiments_desc: "La réorganisation des corporations de forgerons du Bénin pour fabriquer localement des armes légères, réduisant ainsi la dépendance vis-à-vis des importations européennes de matériel militaire."
 nd_edo_palm_oil_trade: "Commerce de l'huile de palme"
 nd_edo_palm_oil_trade_desc: "L’expansion des exportations d’huile de palme en tant que produit commercial majeur, complétant le déclin des échanges de poivre et d’ivoire au cours de la période ultérieure."
 nd_edo_european_diplomacy: "Diplomatie européenne"
 nd_edo_european_diplomacy_desc: "Les manœuvres diplomatiques sophistiquées du Bénin entre des puissances européennes concurrentes, portugaises, néerlandaises et britanniques, rivalisant les unes contre les autres pour maintenir l'indépendance."
 nd_edo_defensive_warfare: "Doctrine de guerre défensive"
 nd_edo_defensive_warfare_desc: "L'évolution du royaume vers une stratégie militaire défensive, tirant parti des fortifications massives en terrassement et de la connaissance du terrain local contre les incursions étrangères."
 nd_edo_military_manpower: "Réserve d'effectifs militaires"
 nd_edo_military_manpower_desc: "L'interdiction de l'Oba de vendre des esclaves mâles, préservant la main-d'œuvre du royaume pour ses propres besoins militaires et assurant une large réserve de guerriers."
 nd_edo_guild_codification: "Codification de guilde"
 nd_edo_guild_codification_desc: "The formal codification of guild traditions, techniques, and hereditary rights, preserving centuries of accumulated knowledge in brass-casting, ivory-carving, and textile production."
 nd_edo_local_firearms: "Fabrication locale d'armes à feu"
 nd_edo_local_firearms_desc: "The development of indigenous firearms production by reorganized blacksmith guilds, achieving partial independence from European arms imports.\n\n#italic Available in: $nd_edo_igun_workshop$#!"
 nd_edo_sovereignty_defense: "Défense de la souveraineté"
 nd_edo_sovereignty_defense_desc: "La résistance déterminée du royaume à l'empiétement colonial européen, s'appuyant sur des siècles de tradition militaire et sur les avantages naturels des fortifications en terre."
 nd_edo_trade_diversification: "Diversification du commerce"
 nd_edo_trade_diversification_desc: "La diversification de l'économie d'exportation du Bénin au-delà du commerce traditionnel du poivre, de l'ivoire et de l'huile de palme pour inclure les produits manufacturés et les matériaux transformés."
 nd_edo_cultural_resilience: "Résilience culturelle"
 nd_edo_cultural_resilience_desc: "La force durable de l'identité culturelle d'Edo, les traditions des guildes, les rituels de l'Oba, l'héritage de la fonte du bronze, persistant à travers des siècles de pressions et de changements extérieurs."
 a_nd_edo_eben_warriors: "Guerriers d'Ében"
 a_nd_edo_eben_warriors_desc: "Infanterie d'épée Edo disciplinée brandissant l'épée courte traditionnelle Eben et des boucliers en peau d'éléphant. Les observateurs étrangers ont noté que leur organisation surpassait toute autre force sur la côte guinéenne."
 a_nd_edo_guild_warriors: "Guerriers de guilde"
 a_nd_edo_guild_warriors_desc: "Les guildes guerrières organisées du Bénin, équipées d'épées, de lances et de flèches empoisonnées. Capable d'être mobilisé vingt mille hommes en un seul jour sous le commandement de l'Oba."
 a_nd_edo_iyoba_guard: "Garde Iyoba"
 a_nd_edo_iyoba_guard_desc: "Le propre régiment de la reine mère, une force militaire loyale commandée personnellement par les Iyoba. Ils servent de contrepoids aux cortèges nobles et aux factions des guildes de guerriers."
 a_nd_edo_musketeers: "Mousquetaires d'Edo"
 a_nd_edo_musketeers_desc: "Les régiments de mousquetaires du Bénin, armés localement et équipés d'armes à feu fabriquées par les guildes de forgerons réorganisées du royaume, réduisent ainsi la dépendance vis-à-vis des importations d'armes européennes."
 n_nd_edo_war_canoe: "Edo War Canoe"
 n_nd_edo_war_canoe_desc: "A great dugout hewn from a single forest tree, paddled by dozens of men and packed with warriors. Fleets of them carried the Oba's armies through the creeks and lagoons to the war camp at Eko. Swift in shoal water where no ship can follow, but a poor platform for guns."
 nd_edo_igun_workshop: "Atelier de la rue Igun"
 nd_edo_igun_workshop_desc: "Les ateliers de la guilde Igun Eronmwon, rue Igun, où des fondeurs de laiton héréditaires produisent les célèbres bronzes du Bénin selon la technique ancienne de la cire perdue."
 nd_edo_isekpokin_ward: "Isekpokin Ward"
 nd_edo_isekpokin_ward_desc: "The quarter of the Isekpokin, the hereditary guild of leather workers. Here hides of forest game are cured and stretched over frames to make the tall shields of the warrior guilds, along with quivers, sheaths and the leather fans of the court."
 nd_edo_market_house: "Maison du marché d'Oba"
 nd_edo_market_house_desc: "Une maison de commerce royale où tout le commerce extérieur passe sous le monopole de l'Oba. Le poivre, l'ivoire et l'huile de palme sont pesés, taxés et répartis par les agents royaux."
 nd_edo_iya_earthwork: "Iya terrassement"
 nd_edo_iya_earthwork_desc: "Une section du système massif de douves et de remparts qui encerclait autrefois Benin City et ses territoires environnants, atteignant des hauteurs de 18 mètres avec des cercles de fossés et de remparts interconnectés."
 nd_edo_warrior_barracks: "Caserne de la guilde des guerriers"
 nd_edo_warrior_barracks_desc: "Terrains d'entraînement et armureries pour les guildes de guerriers organisées, où les soldats s'entraînent à l'utilisation de l'épée, de la lance et de l'arc d'Eben sous la direction de chefs de guerre héréditaires."
 nd_edo_ogiso_shrine: "Sanctuaire ancestral Ogiso"
 nd_edo_ogiso_shrine_desc: "Un sanctuaire dédié à l'ancienne dynastie Ogiso, les « dirigeants du ciel » qui ont précédé la dynastie Oba et dont l'héritage spirituel sous-tend la pratique religieuse et l'identité culturelle d'Edo."
 nd_edo_storyteller_hall: "Salle des conteurs"
 nd_edo_storyteller_hall_desc: "Un lieu de rassemblement où les griots et les historiens oraux préservent et transmettent les généalogies, les lois et les récits épiques du peuple Edo à travers l'art du conte."
 nd_edo_admin_hall: "Salle administrative d'Oba"
 nd_edo_admin_hall_desc: "Une salle de gouvernance où les fonctionnaires nommés par l'Oba gèrent la collecte des tributs, l'administration territoriale et la hiérarchie complexe des chefs héréditaires et nommés."
 nd_edo_palace_hall: "Salle de la Société du Palais"
 nd_edo_palace_hall_desc: "Le siège des sociétés des palais Iwebo, Iweguae et Ibiwe, organisations professionnelles gérant la garde-robe, les insignes et les fonctions cérémonielles de la maison royale."
 nd_edo_obas_court: "Cour d'Oba"
 nd_edo_obas_court_desc: "La magnifique cour royale de l'Oba, centre d'autorité politique, de mécénat culturel et de réception diplomatique pour tout le royaume."
 nd_edo_brass_casting: "Moulage en laiton"
 nd_edo_brass_casting_desc: "Le processus de moulage à la cire perdue de la guilde Igun Eronmwon, façonnant des lingots de cuivre et des colorants pour en faire des plaques de bronze, des têtes de portrait et des objets de cérémonie qui ornent le palais de l'Oba."
 nd_edo_pepper_trade_pm: "Commerce du poivre et de l'ivoire"
 nd_edo_pepper_trade_pm_desc: "Le monopole royal du commerce du poivre et de l'ivoire, géré par les agents de l'Oba qui contrôlent les prix, les quantités et l'accès aux marchands européens."
 nd_edo_earthwork_maintenance: "Entretien des terrassements"
 nd_edo_earthwork_maintenance_desc: "L'entretien constant du système de douves et de remparts nécessite du bois pour le revêtement, de la pierre pour le renforcement et des équipes de travail organisées dirigées par les fonctionnaires de l'Oba."
 nd_edo_guild_training: "Entraînement militaire de guilde"
 nd_edo_guild_training_desc: "Les guildes de guerriers maintiennent leur préparation grâce à un entraînement régulier au combat à l'épée, à la lance et à l'arc, consommant des armes et des provisions pour maintenir leurs rangs prêts au combat."
 nd_edo_ancestral_rites: "Rites ancestraux"
 nd_edo_ancestral_rites_desc: "Les cérémonies régulières honorant les ancêtres Ogiso nécessitent du bétail pour les sacrifices et de la cire d'abeille pour les bougies cérémonielles, préservant ainsi le fondement spirituel de la société Edo."
 nd_edo_lost_wax_casting: "Moulage à la cire perdue"
 nd_edo_lost_wax_casting_desc: "A model of wax over a clay core is cased in clay and fired. The wax runs out, molten brass is poured in its place, and the plaque or head is broken out of the mould."
 nd_edo_ivory_carving: "Sculpture en ivoire"
 nd_edo_ivory_carving_desc: "The Igbesanmwan carve tusks for the royal altars, and armlets, masks, and saltcellars for the court and for sale to the ships."
 nd_edo_coral_beadwork: "Travail de perles de corail"
 nd_edo_coral_beadwork_desc: "Coral bought from the ships is cut, bored, and strung into the crowns, collars, and netted shirts worn by the Oba and those chiefs he chooses to honor."
 nd_edo_guild_processing: "Traitement de l'atelier de guilde"
 nd_edo_guild_processing_desc: "Les premières guildes d'artisans transformaient le cuivre brut et le bois en outils et en ferronnerie utilitaire sous le patronage royal."
 nd_edo_gunsmithing: "Igun Ematon Gunsmithing"
 nd_edo_gunsmithing_desc: "The blacksmiths of Igun Ematon, neighbours of the brass casters, forge barrels and locks and stock them in local hardwood, so that the Oba need not wait on a trading ship for his guns."
 nd_edo_shield_hide_working: "Shield Hide Working"
 nd_edo_shield_hide_working_desc: "Hides are cured with bark, cut and stretched over wooden frames into shields and war gear."
 nd_edo_storytelling: "Tradition du conte"
 nd_edo_storytelling_desc: "Les historiens oraux qui préservent l'héritage d'Edo ont besoin de papier pour leurs archives et de colorants pour leurs histoires illustrées, préservant ainsi la mémoire vivante du royaume."
 nd_edo_court_administration: "Administration des tribunaux"
 nd_edo_court_administration_desc: "L'appareil bureaucratique du gouvernement d'Oba exige du papier pour les archives et du tissu pour les vêtements officiels, maintenant ainsi la hiérarchie complexe des chefs nommés."
 nd_edo_palace_upkeep: "Entretien de la société du palais"
 nd_edo_palace_upkeep_desc: "Les trois sociétés du palais entretiennent la garde-robe et les insignes de l'Oba, exigeant des tissus fins et des teintures pour les vêtements de cérémonie élaborés portés à la cour."
 nd_edo_royal_upkeep: "Entretien de la cour royale"
 nd_edo_royal_upkeep_desc: "La magnifique cour de l'Oba a besoin de tissus fins et de teintures pour la garde-robe royale, de cadeaux diplomatiques et de cérémonies élaborées qui témoignent de l'autorité royale."
 levy_nd_edo_iyoba_guard: "Garde Iyoba"
 levy_nd_edo_iyoba_guard_desc: "Le régiment personnel de la reine mère, composé de soldats et de paysans fidèles à la maison des Iyoba."
 nd_edo_formed_tt: "Le Royaume du Bénin a été formé"
 nd_edo_path_a_tt: "Choisissez l'autorité divine d'Oba"
 nd_edo_path_b_tt: "Choisissez la Cité des Guildes"
 nd_edo_destiny: "Destin du Bénin"
 nd_edo_destiny_desc: "Le Royaume du Bénin est forgé. Maintenant, l'Oba doit décider de la voie à suivre : ce royaume deviendra-t-il un empire militaire ou une puissance économique alimentée par des guildes ?"
 nd_edo_dest_western_wars: "Guerres occidentales"
 nd_edo_dest_western_wars_desc: "Subjugate the Yoruba heartland at Oyo-Ile and seize the trading port of Calabar to establish the Oba's military dominion over the Lower Niger and beyond. The warrior guilds must have their barracks."
 nd_edo_dest_northern_reach: "Portée Nord"
 nd_edo_dest_northern_reach_desc: "Extend the Oba's power into the Hausa states by conquering Kano and the Bornu capital of Ngazargamu, bringing the great trading cities of the Sahel under Benin's authority. The warriors of the eben sword must be trained."
 nd_edo_dest_imperial_dominion: "Domination impériale"
 nd_edo_dest_imperial_dominion_desc: "The Oba's armies must reach the gold fields of Kumasi and the legendary city of Timbuktu, establishing Benin as the supreme power of West Africa. The guild warriors must be organized."
 nd_edo_dest_guild_wealth: "Richesse de guilde"
 nd_edo_dest_guild_wealth_desc: "Le système des guildes doit générer suffisamment d'excédents pour remplir le trésor de l'Oba, englobant les institutions bancaires pour formaliser la sophistication économique croissante du royaume."
 nd_edo_dest_artisan_power: "Pouvoir artisanal"
 nd_edo_dest_artisan_power_desc: "The guild wards must raise the development of Benin City to 14 while ivory, worked by the kingdom's master carvers, flows through the capital's markets to distant lands."
 nd_edo_dest_guild_imperium: "Impérium de guilde"
 nd_edo_dest_guild_imperium_desc: "Benin's guild system must reach its apex: a wealthy kingdom whose capital has grown to a development of 19, twice what it was, and which holds the sacred city of Ife, where the brass-casting tradition originated in the art of the Yoruba ancestors."
 nd_edo.6.t: "Destin du Royaume"
 nd_edo.6.d: "The Kingdom of Benin stands at a crossroads. The Oba's palace rises above a city of broad avenues and guild workshops, its walls adorned with bronze plaques depicting the deeds of past rulers. The earthwork fortifications stretch for miles in every direction.\n\nBut a stable kingdom is merely a beginning. The path chosen at the kingdom's founding now beckons, whether through the sword or through the workshop, Benin's destiny awaits."
 nd_edo.6.a: "Notre destin est écrit en bronze."
 nd_edo.7.t: "Les campagnes occidentales"
 nd_edo.7.d: "The Oba's warriors have marched west and east, bringing the ancient city of Oyo-Ile and the trading port of Calabar under Benin's authority. The Yoruba and the peoples of the Cross River now acknowledge the Oba's supremacy.\n\nThese conquests echo the campaigns of Oba Ewuare himself, who first extended Benin's power beyond its heartland. The warrior guilds have proven their worth, and the kingdom's borders now encompass a vast territory of diverse peoples and resources."
 nd_edo.7.a: "L'épée de l'Oba va loin."
 nd_edo.8.t: "Domination sur le Nord"
 nd_edo.8.d: "The great walled cities of the Hausa, Kano with its dye pits and leather markets, and Ngazargamu, capital of the Bornu empire, now fly the banner of Benin. The Oba's armies have crossed the vast savanna to bring these wealthy trading centers under his authority.\n\nThis is an empire of unprecedented scope for a kingdom born in the forests of the Lower Niger. The question now is how to consolidate these conquests. Shall the Oba forge his warriors into an even more fearsome fighting force, or establish a system of tributaries that enriches the kingdom while pacifying the conquered?"
 nd_edo.8.a: "Nos guerriers sont les meilleurs d’Afrique de l’Ouest."
 nd_edo.8.b: "Laissons les affluents remplir nos caisses."
 nd_edo.9.t: "L'Empire de l'Oba"
 nd_edo.9.d: "From the gold fields of Kumasi to the legendary libraries of Timbuktu, the Oba's dominion stretches across the breadth of West Africa. No ruler in the region's history has commanded such vast territory, a military achievement that would astonish the Portuguese traders who first came seeking pepper and ivory.\n\nThe bronze plaques in the palace must be extended to record these triumphs. But the nature of this empire's military strength remains to be decided. Shall the Oba invest in a professional imperial army drawing on all the conquered peoples, or pursue a grand strategy of diplomatic intimidation backed by overwhelming force?"
 nd_edo.9.a: "Construisez la plus grande armée que l’Afrique de l’Ouest ait connue."
 nd_edo.9.b: "Que notre réputation précède nos armées."
 nd_edo.10.t: "Le Trésor des Guildes"
 nd_edo.10.d: "The guild system has generated extraordinary wealth. The brass-casters, ivory-carvers, cloth-weavers, and leather-workers produce goods that command premium prices in markets near and far. The Oba's treasury overflows with the proceeds of royal monopoly trade, and the kingdom's adoption of formal banking practices has given it financial sophistication unprecedented in the region.\n\nBenin City thrives as a metropolis of organized industry, where every street belongs to a guild and every craft is perfected across generations."
 nd_edo.10.a: "Les guildes sont la richesse du royaume."
 nd_edo.11.t: "Maîtres de leur métier"
 nd_edo.11.d: "The guild workshops have become engines of development, driving growth across the kingdom. Ivory carved by Benin's master artisans flows through the capital's markets to buyers across the known world. The kingdom's development has outpaced its neighbors, built on the foundation of hereditary craft knowledge refined over centuries.\n\nThe guilds now stand at a crossroads of their own. Some guild masters push for ever-greater artistic refinement, literacy, education, the preservation of techniques in writing rather than memory alone. Others see the future in commerce, expanding diplomatic ties, opening new markets, leveraging the guild system's wealth to project influence abroad."
 nd_edo.11.a: "La maîtrise de l'artisanat exige la maîtrise des connaissances."
 nd_edo.11.b: "Nos marchands transporteront les marchandises de la guilde dans chaque port."
 nd_edo.12.t: "L'Imperium de la Guilde"
 nd_edo.12.d: "Benin has achieved what no other West African kingdom has managed, an empire built not primarily on conquest but on the productive power of its guild system. The kingdom's wealth, its cultural influence, its diplomatic connections all flow from the workshops of Igun Street and their counterparts across the realm.\n\nThe sacred city of Ife, where the artistic tradition of bronze-casting first took root among the Yoruba, now acknowledges Benin's cultural supremacy. The circle is complete, from Ife the art came, and to Ife's masters Benin now stands as proof of what that art can build.\n\nHow shall this imperium express its power in the years ahead?"
 nd_edo.12.a: "Construisez une ville qui rivalise avec n’importe quelle ville du monde."
 nd_edo.12.b: "Laissez notre culture atteindre tous les rivages."
 STATIC_MODIFIER_NAME_nd_edo_dest_warriors_of_oba: "Guerriers de l'Oba"
 STATIC_MODIFIER_DESC_nd_edo_dest_warriors_of_oba: "The Oba's warrior guilds have been forged into the most fearsome fighting force in West Africa, their morale unbreakable and their tactics refined through campaigns across the savanna. The men kept under arms are missed on the farms."
 STATIC_MODIFIER_NAME_nd_edo_dest_tributaries_of_oba: "Affluents de l'Oba"
 STATIC_MODIFIER_DESC_nd_edo_dest_tributaries_of_oba: "Un vaste réseau d'États tributaires soutient la machine militaire de l'Oba, réduisant le coût d'entretien des armées tandis que des compagnies de mercenaires complètent les guildes de guerriers."
 STATIC_MODIFIER_NAME_nd_edo_dest_imperial_army: "L'armée impériale d'Oba"
 STATIC_MODIFIER_DESC_nd_edo_dest_imperial_army: "Une armée impériale professionnelle tirant de la cavalerie et de l'artillerie de tous les territoires conquis, unifiée sous le commandement suprême de l'Oba en une force d'une vitesse et d'une puissance dévastatrices."
 STATIC_MODIFIER_NAME_nd_edo_dest_grand_strategy: "Grande stratégie du Bénin"
 STATIC_MODIFIER_DESC_nd_edo_dest_grand_strategy: "La réputation de l'Oba pour sa force militaire écrasante précède ses armées, permettant une annexion rapide de ses rivaux tandis qu'un vaste réseau d'espionnage protège l'empire des menaces internes."
 STATIC_MODIFIER_NAME_nd_edo_dest_master_craftsmen: "Maîtres artisans"
 STATIC_MODIFIER_DESC_nd_edo_dest_master_craftsmen: "Les maîtres de guilde ont élevé leurs métiers héréditaires au niveau du grand art, favorisant l'influence culturelle et l'alphabétisation à travers le royaume, même si l'accent mis sur l'atelier plutôt que sur le champ de guerre rend les campagnes plus coûteuses."
 STATIC_MODIFIER_NAME_nd_edo_dest_merchant_princes: "Princes marchands"
 STATIC_MODIFIER_DESC_nd_edo_dest_merchant_princes: "Une nouvelle classe de riches commerçants de guilde a émergé, exerçant une influence diplomatique et un sens financier qui ouvrent les marchés et forgent des alliances à travers le monde commercial."
 STATIC_MODIFIER_NAME_nd_edo_dest_artisan_metropolis: "Métropole Artisanale"
 STATIC_MODIFIER_DESC_nd_edo_dest_artisan_metropolis: "Benin City est devenue une véritable métropole industrielle organisée, où une planification urbaine efficace et de puissants centres commerciaux attirent le commerce de pays lointains."
 STATIC_MODIFIER_NAME_nd_edo_dest_cultural_renaissance: "Renaissance culturelle"
 STATIC_MODIFIER_DESC_nd_edo_dest_cultural_renaissance: "La richesse du système des guildes a financé une expansion maritime, la construction de navires et la formation de marins pour transporter les célèbres produits artisanaux du Bénin vers les ports de toute la côte ouest-africaine et au-delà."
 nd_edo_war_palace: "Palais de guerre d'Oba"
 nd_edo_war_palace_desc: "Le centre de commandement fortifié de l'armée impériale d'Oba, combinant l'architecture traditionnelle des palais du Bénin avec des casernes militaires, des armureries et des conseils de guerre tirés des territoires conquis."
 nd_edo_guild_masters_hall: "Salle des maîtres de guilde"
 nd_edo_guild_masters_hall_desc: "La grande salle de réunion des maîtres de guilde du Bénin, où les chefs de chaque guilde artisanale héréditaire se réunissent pour coordonner la production, fixer des normes de qualité et gérer les vastes réseaux commerciaux qui soutiennent la richesse du royaume."
 nd_edo_war_palace_maintenance: "Entretien du palais de guerre"
 nd_edo_war_palace_maintenance_desc: "Le palais de guerre impérial a besoin d'un approvisionnement constant en armes, en matériaux de construction et en provisions pour entretenir sa garnison et la structure de commandement militaire de l'Oba."
 nd_edo_guild_masters_maintenance: "Entretien de la salle de guilde"
 nd_edo_guild_masters_maintenance_desc: "La salle des maîtres de guilde nécessite du cuivre pour les démonstrations, de l'ivoire pour les œuvres d'exposition, du tissu pour les cérémonies et du papier pour les archives des normes de guilde et des accords commerciaux."

 # ===== BUREAUCRACIES =====
 edo_uzama_nihinron_bureaucracy: "Uzama Nihinron"
 edo_uzama_nihinron_bureaucracy_desc: "Les sept chefs faiseurs de rois héréditaires du Bénin métropolitain (Oliha, Edohen, Ezomo, Ero, Eholo n'Ire, Oloton et Ihaza) dont les fonctions sont antérieures à la dynastie Oba elle-même. La tradition veut que les Uzama aient invité les Oranmiyan d'Ife à envoyer un fils pour les gouverner vers 1200, fondant la lignée des Eweka Ier. Ils conservent le droit constitutionnel d'installer chaque nouvel Oba : aucune accession de roi n'est légitime sans le couronnement à Usama, où l'Oliha place la couronne de perles sur sa tête. Après les réformes d'Ewuare d'environ 1440, ils furent déchus du pouvoir administratif mais conservèrent le rôle de faiseur de roi, ce qui en faisait un contrepoids permanent à l'autorité royale."
 edo_eghaevbo_nogbe_bureaucracy: "Eghaevbo n'Ogbe"
 edo_eghaevbo_nogbe_bureaucracy_desc: "Ewuare le Grand (r. c.1440-1473) réorganisa la gouvernance du Bénin autour de trois sociétés de palais, chacune ayant son siège dans son propre quartier de la résidence de l'Oba : Iwebo (chefs d'insignes, d'airain et d'ivoire), Iweguae (chefs de la personne et de la maison du roi) et Ibiwe (chefs du harem et des enfants royaux). Chaque société admettait des hommes par nomination royale plutôt que par naissance ; leurs membres titrés formaient collectivement les Eghaevbo n'Ogbe, les chefs du palais, un corps délibérément construit pour donner à l'Oba un bras administratif indépendant de l'Uzama et des chefs de ville."
 edo_igun_eronmwon_bureaucracy: "Guilde des cuivres d'Igun-Eronmwon"
 edo_igun_eronmwon_bureaucracy_desc: "La guilde des fondeurs de laiton de la rue Igun à Benin City détenait le monopole royal sur le moulage à la cire perdue des plaques commémoratives, des têtes et des figurines maintenant connues sous le nom de bronzes du Bénin (en fait un alliage de laiton au plomb issu du commerce du cuivre transsaharien et plus tard atlantique). Le maître de guilde, l'Inneh n'Igun-Eronmwon, était classé parmi les chefs supérieurs des Iwebo. Une guilde parallèle, les sculpteurs d'ivoire Igbesanmwan, fournissait les défenses sculptées des autels royaux. Ensemble, ils produisirent le témoignage durable de l'histoire dynastique que la cour d'Edo considérait comme ses archives en métal et en ivoire."
 edo_igue_festival_bureaucracy: "Fête de l'Igué"
 edo_igue_festival_bureaucracy_desc: "Codifiée par Ewuare vers 1440 et toujours observée au Bénin moderne, la Igue est la fête annuelle du renouveau royal. Le cycle de rites - Ague, Otue, Ugie Erha Oba, Ugie Oro, Igue proprement dit et le Jour de Fer de clôture - dure plusieurs semaines chaque décembre et exige que chaque chef titré du royaume se rende au palais de l'Oba, présente un hommage, prête le serment de loyauté de l'année et se soumette aux sacrifices propitiatoires qui renouvellent l'autorité mystique du roi. L'Igue est à la fois un rituel calendaire, une évaluation d'hommage et une révision constitutionnelle : un chef qui ne se présente pas est traité comme ayant rompu son serment de fidélité."
 edo_iyase_warcommand_bureaucracy: "Iyase n'Ode"
 edo_iyase_warcommand_bureaucracy_desc: "Doyen des Eghaevbo n'Ore (les chefs de ville) et commandant de guerre constitutionnel de l'État d'Edo, l'Iyase dirige les armées de l'Oba sur le terrain tandis que le roi lui-même reste rituellement dans le palais. Ce bureau combine le commandement opérationnel, le recrutement des levées régionales et le droit de refuser une guerre qu'Iyase juge ingagnable (un échec qui a produit les révoltes d'Iyase n'Ode et d'Iyase Esebo au XVIIIe siècle. L'ambivalence du titre) le général en chef du trône et le rebelle militaire le plus probable du trône : reflète la tension de l'État d'Edo entre la royauté sacrée et la réalité du champ de bataille."
 edo_ologboona_residency_bureaucracy: "Résidence Ologbo'na"
 edo_ologboona_residency_bureaucracy_desc: "Alors que l'empire du Bénin s'étendait vers l'ouest et le nord aux XVe et XVIe siècles sous Ewuare, Ozolua et Esigie, les Oba envoyèrent des Ologbo'na (appelés Olaen dans certains districts de l'ouest) - des résidents royaux issus des sociétés du palais - aux tribunaux d'Akure, d'Owo, des villes d'Ekiti, de Mahin et des fondations côtières d'Edo qui devinrent Lagos. Chaque Ologbo'na évaluait le tribut annuel des esclaves, de l'ivoire, du tissu et du sel et envoyait les fonds à Benin City. La résidence a rendu fonctionnel le système affluent du Bénin, mais l'extorsion documentée dans les archives d'Akure et d'Owo a généré le ressentiment chronique qui a éclaté lors des révoltes du XVIIe siècle."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_edo_bureaucracy_authority: "Autorité du tribunal de l'Oba"
 AUTO_MODIFIER_DESC_nd_edo_bureaucracy_authority: "On formation, Benin gains the ability to host the historical institutions of the Edo state: the kingmaker Uzama, the palace societies of Iwebo, Iweguae, and Ibiwe, the brass-casters' guild, the Igue calendar of divine kingship, the Iyase war-command, and the residencies over the tributary towns. Three of the six can be kept at once."
 nd_edo_igbesanmwan_ward: "Igbesanmwan Ward"
 nd_edo_igbesanmwan_ward_desc: "The quarter of the Igbesanmwan, the hereditary guild of ivory carvers. They work for the Oba, to whom one tusk of every elephant killed is owed."
 nd_edo_owina_ward: "Owina n'Ido Ward"
 nd_edo_owina_ward_desc: "The quarter of the Owina n'Ido, the royal weavers. Their guild is held to be as old as the Ogiso kings, and the patterned cloths of the court are theirs alone to weave."
 nd_edo_owina_weaving: "Royal Weaving"
 nd_edo_owina_weaving_desc: "Cotton is spun, dyed, and woven on the upright loom into the cloths of the court and the plain blue and striped cloths sold to the ships."
