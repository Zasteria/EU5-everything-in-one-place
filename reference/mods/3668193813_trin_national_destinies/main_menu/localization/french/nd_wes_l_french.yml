l_french:
 STATIC_MODIFIER_NAME_nd_westphalian_sovereignty: "Souveraineté westphalienne"
 STATIC_MODIFIER_DESC_nd_westphalian_sovereignty: "Le système westphalien d’égalité souveraine entre les États, où chaque prince est maître de son propre royaume, libre de toute ingérence extérieure en matière de religion et de gouvernance."
 STATIC_MODIFIER_NAME_nd_red_earth_justice: "La Terre Rouge"
 STATIC_MODIFIER_DESC_nd_red_earth_justice: "Sur le Rote Erde, le Blutbann de l'Empereur tient toujours. À travers les anciens tribunaux véhmiques, la Westphalie exerce une tradition unique de justice impériale qui s'étend à tout le royaume, faisant respecter l'ordre là où les autres autorités échouent."
 nd_wes.1.t: "L'essor de la Westphalie"
 nd_wes.1.d: "The lands between the Rhine and the Weser have been united under Westphalian authority. From the salt springs of the Hellweg to the forges of the Sauerland, from the Hanseatic counting houses of Dortmund to the secretive tribunal halls where hooded judges dispense the Emperor's justice: this is a land shaped by commerce, law, and the hard lessons of religious war.\n\nWestphalia stands at a crossroads. It can champion the revolutionary principle that every state, great or small, possesses equal sovereignty and the right to determine its own confession, the very principle that will one day bear its name. Or it can draw upon its ancient and unique judicial authority, the Vehmic courts of the Red Earth, to impose order through the weight of imperial law.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_wes.1.a: "Cuius regio, eius religio : la souveraineté pour tous"
 nd_wes.1.b: "La Terre Rouge se souvient de la justice de l'Empereur"
 STATIC_MODIFIER_NAME_nd_wes_peace_congress_diplomacy: "Diplomatie du Congrès"
 STATIC_MODIFIER_DESC_nd_wes_peace_congress_diplomacy: "Le précédent de la paix par congrès diplomatique, où les différends entre États souverains sont résolus par la négociation entre les délégués assemblés plutôt que sur le champ de bataille."
 STATIC_MODIFIER_NAME_nd_wes_peace_congress_tolerance: "Coexistence religieuse"
 STATIC_MODIFIER_DESC_nd_wes_peace_congress_tolerance: "La garantie des droits confessionnels : les communautés catholiques, luthériennes et calvinistes peuvent pratiquer librement leur foi, et aucun prince ne peut imposer la conversion aux sujets d'une confession reconnue."
 nd_wes.2.t: "La paix de Westphalie"
 nd_wes.2.d: "After decades of devastation that has killed millions and left entire regions depopulated, the warring powers of Europe have assembled in our cities of Munster and Osnabruck. The negotiations have lasted years, involving over a hundred delegations, but at last the treaties are sealed.\n\nThe Peace of Westphalia establishes principles that will reshape the world: the sovereign equality of states, the right of each prince to determine his realm's religion, and the settlement of disputes through diplomatic congress rather than crusade. Our cities have given their name to a new order.\n\nHow shall we honor the legacy of this peace?"
 nd_wes.2.a: "Défendre le système diplomatique du Congrès"
 nd_wes.2.b: "Consacrer les droits de toutes les confessions"
 STATIC_MODIFIER_NAME_nd_wes_napoleonic_reform: "Code Napoléon"
 STATIC_MODIFIER_DESC_nd_wes_napoleonic_reform: "Le Code Napoléon a balayé les privilèges féodaux, aboli le servage et instauré l'égalité devant la loi. La Westphalie devient le premier État allemand doté d’une constitution écrite moderne."
 nd_wes.3.t: "Le Code Napoléon en Westphalie"
 nd_wes.3.d: "A new era dawns for Westphalia. The feudal order that has governed these lands for centuries is being dismantled. A written constitution (the first of its kind in any German state) has been proclaimed, establishing a centralized administration, an elected legislature, and the revolutionary principle of equality before the law.\n\nSerfdom is abolished. The guilds lose their monopolies. For the first time, Jews receive full legal equality. The Napoleonic Code replaces the patchwork of local customs and privileges with a single, rational legal framework. Whether these reforms survive depends on what follows, but Westphalia will never be the same."
 nd_wes.3.a: "L'ordre ancien cède la place à la raison"
 nd_wes_formed_tt: "La Westphalie s'est formée"
 nd_wes_path_a_tt: "La Westphalie poursuit l’égalité souveraine"
 nd_wes_path_b_tt: "La Westphalie défend la justice de la Terre Rouge"
 nd_wes_dest_munster_developed_tt: "We own #bold Münster#! and its development is at least #bold 32#!"
 nd_wes_hellweg_salt_trade: "Commerce de sel du Hellweg"
 nd_wes_hellweg_salt_trade_desc: "Les sources salines naturelles le long du Hellweg, l'ancienne route commerciale est-ouest traversant la Westphalie, soutiennent une industrie du sel florissante depuis l'Antiquité. Des villes comme Soest, Unna, Werl et Salzkotten se sont enrichies grâce à l'évaporation de la saumure dans l'or blanc qui préservait le poisson, salaisonnait la viande et alimentait le réseau commercial hanséatique."
 nd_wes_vehmic_courts: "Tribunaux véhmiques"
 nd_wes_vehmic_courts_desc: "Les Vehmgerichte de Westphalie constituent une institution judiciaire unique : des tribunaux secrets composés de juges non professionnels habilités par l'empereur lui-même à prononcer des peines capitales. Opérant depuis Dortmund et à travers la Terre Rouge, ces tribunaux font respecter l'ordre là où la justice ordinaire échoue, leurs verdicts étant appliqués par des Freischoffen sous serment qui peuvent poursuivre les condamnés à travers l'Empire."
 nd_wes_soest_municipal_law: "Loi municipale de Soest"
 nd_wes_soest_municipal_law_desc: "Le code municipal de Soest, l’un des plus anciens et des plus influents de l’Allemagne médiévale, a servi de modèle à des dizaines de villes à travers l’Empire. Ses dispositions en matière d’autonomie civique, de régulation du marché et de processus juridique ont fait des villes westphaliennes des centres d’innovation juridique."
 nd_wes_dortmund_market_rights: "Droits de marché de Dortmund"
 nd_wes_dortmund_market_rights_desc: "Le statut de ville libre impériale et les privilèges commerciaux de Dortmund en ont fait la ville hanséatique la plus importante de Westphalie. Son Rathaus servait de siège de gouvernance civique et d'arbitrage commercial, un modèle d'autonomie urbaine imité dans toute la région."
 nd_wes_hanseatic_commerce: "Commerce hanséatique"
 nd_wes_hanseatic_commerce_desc: "Dortmund et Soest comptent parmi les villes hanséatiques les plus importantes de Westphalie. Leurs marchands échangent du sel, des produits métalliques et des tissus le long de la route du Hellweg et à travers les réseaux hanséatiques s'étendant de Novgorod à Londres, apportant richesse et liens cosmopolites au cœur de la Westphalie."
 nd_wes_freischoffen_tradition: "Tradition de Freischoffen"
 nd_wes_freischoffen_tradition_desc: "Les juges libres des tribunaux de Vehmic sont issus des hommes libres de Westphalie, liés par des serments sacrés de faire respecter la justice impériale. Leur discipline martiale et leur engagement inébranlable en faveur de l'ordre en font de redoutables milices urbaines : des soldats qui se battent non pour être payés mais pour la loi."
 nd_wes_hellweg_infrastructure: "Infrastructure du chemin Hellweg"
 nd_wes_hellweg_infrastructure_desc: "Le Hellweg, qui traverse la Westphalie de Duisburg à Paderborn, est l'une des routes commerciales les plus anciennes et les plus importantes d'Allemagne. Les investissements dans l'entretien des routes, la construction de ponts et de gares routières transforment cette voie médiévale en une véritable autoroute commerciale."
 nd_wes_circle_assembly: "Assemblée du cercle"
 nd_wes_circle_assembly_desc: "Le Cercle du Bas-Rhénan-Westphalie, l'un des cercles impériaux établis par les réformes de Maximilien Ier de 1512, offre un forum de gouvernance collective. Ses assemblées coordonnent la fiscalité, les contributions militaires et la résolution des différends entre les divers territoires laïcs et ecclésiastiques du Cercle."
 nd_wes_sauerland_ironworks: "Forges sidérurgiques du Sauerland"
 nd_wes_sauerland_ironworks_desc: "Les montagnes du Sauerland, au sud de la Westphalie, possèdent un minerai de fer abondant, des forêts pour le charbon de bois et des cours d'eau rapides pour l'énergie hydraulique. Les hauts fourneaux alimentés au charbon de bois et les marteaux à eau produisent des armes, des outils et des produits métalliques qui approvisionnent les marchés de tout l'Empire."
 nd_wes_soest_feud_legacy: "L'héritage de Soest Feud"
 nd_wes_soest_feud_legacy_desc: "La Soest Feud de 1444-1449, au cours de laquelle la ville la plus riche de Westphalie défia l'archevêque de Cologne et endura un siège de cinq ans, démontra que les villes westphaliennes se battraient farouchement pour leur autonomie. L’héritage de cette résistance obstinée façonne les traditions défensives westphaliennes."
 nd_wes_kreistruppen_obligation: "Obligation de Kreistruppen"
 nd_wes_kreistruppen_obligation_desc: "Le Cercle de Basse-Rhénanie-Westphalie a l'obligation de fournir des contingents de troupes à la Reichsarmee. Ces Kreistruppen, recrutés dans les domaines laïcs et ecclésiastiques sous la supervision de colonels de cercle, forment une infanterie défensive disciplinée, entraînée à la protection des frontières et aux campagnes impériales."
 nd_wes_westphalian_printing: "Impression westphalienne"
 nd_wes_westphalian_printing_desc: "L'imprimerie se répand rapidement dans les centres urbains de Westphalie, produisant des tracts théologiques, des commentaires juridiques et de la correspondance commerciale. Munster, Cologne et Dortmund deviennent des centres régionaux de la culture imprimée, accélérant la diffusion de l'alphabétisation et de l'apprentissage."
 nd_wes_sauerland_arms_trade: "Commerce d'armes du Sauerland"
 nd_wes_sauerland_arms_trade_desc: "The iron forges of the Sauerland supply not only local needs but feed a growing export trade in firearms and weapons. Westphalian metalwork gains a reputation for quality, competing with the armories of Nuremberg and Liege.\n\n#italic Available in: $nd_wes_sauerland_forge$#!"
 nd_wes_peace_of_westphalia: "Paix de Westphalie"
 nd_wes_peace_of_westphalia_desc: "La Paix de Westphalie, signée à Munster et Osnabruck en 1648, a mis fin à la guerre de Trente Ans et a établi les principes d'État souverain et de tolérance religieuse qui définissent encore les relations internationales. La Westphalie a donné son nom au nouvel ordre mondial."
 nd_wes_linen_industry: "Industrie du lin westphalienne"
 nd_wes_linen_industry_desc: "La Westphalie orientale, centrée sur Bielefeld et Osnabruck, se développe pour devenir l'une des principales régions productrices de lin d'Allemagne. Les tisserands ruraux transforment le lin cultivé localement en tissus que les marchands westphaliens exportent vers les marchés des Pays-Bas, de l'Angleterre et au-delà."
 nd_wes_confessional_balance: "Équilibre confessionnel"
 nd_wes_confessional_balance_desc: "Le règlement religieux consécutif aux ravages de la guerre de Trente Ans établit un équilibre délicat entre les communautés catholiques et protestantes en Westphalie, où les populations mixtes exigent une coexistence pragmatique plutôt qu'une conformité forcée."
 nd_wes_imperial_circle_defense: "Défense du Cercle Impérial"
 nd_wes_imperial_circle_defense_desc: "Le Cercle du Bas-Rhénan-Westphalie coordonne la défense collective à travers des programmes de fortifications, des obligations de garnison et des exercices militaires conjoints. Les contributions du Cercle renforcent les défenses des frontières et soutiennent les campagnes impériales contre les menaces extérieures."
 nd_wes_line_infantry_reform: "Infanterie de ligne westphalienne"
 nd_wes_line_infantry_reform_desc: "Les réformes militaires françaises transforment les forces westphaliennes en régiments d’infanterie de ligne modernes, formés aux dernières doctrines tactiques et équipés d’armes standardisées. Ces soldats professionnels représentent une rupture décisive avec les anciennes traditions miliciennes."
 nd_wes_constitutional_experiments: "Expériences constitutionnelles"
 nd_wes_constitutional_experiments_desc: "La Westphalie devient un laboratoire de gouvernance constitutionnelle, expérimentant des constitutions écrites, des assemblées représentatives et une rationalisation administrative qui préfigurent le mouvement constitutionnel allemand plus large."
 nd_wes_textile_expansion: "Expansion textile"
 nd_wes_textile_expansion_desc: "Westphalian linen production expands from cottage industry to organized manufacture, with merchants coordinating networks of rural spinners and weavers. Bielefeld's bleaching fields process cloth for export markets across Europe.\n\n#italic Available in: $nd_wes_linen_house$#!"
 nd_wes_napoleonic_code: "Code Napoléon"
 nd_wes_napoleonic_code_desc: "L'introduction du Code Napoléon dans le royaume de Westphalie abolit le privilège féodal, établit l'égalité devant la loi et crée la première constitution moderne de l'histoire allemande. Ces réformes, bien qu’imposées de l’extérieur, laissent une marque permanente sur les traditions juridiques et administratives westphaliennes."
 nd_wes_industrial_awakening: "L'éveil industriel"
 nd_wes_industrial_awakening_desc: "The transition from water-powered forges to steam-driven factories transforms the Westphalian economy. The Sauerland's metalworking tradition and the Ruhr's coal deposits combine to create one of Germany's earliest industrial regions.\n\n#italic Available in: $nd_wes_sauerland_forge$#!"
 nd_wes_sovereign_equality: "Égalité souveraine"
 nd_wes_sovereign_equality_desc: "Le principe westphalien d’égalité souveraine (selon lequel chaque État, quelle que soit sa taille ou sa puissance, possède des droits inhérents à l’autonomie gouvernementale) est passé d’un expédient diplomatique à une doctrine fondamentale du droit international."
 nd_wes_civic_emancipation: "Émancipation civique"
 nd_wes_civic_emancipation_desc: "L'héritage de la réforme napoléonienne porte ses fruits à mesure que les populations urbaines de Westphalie acquièrent de nouvelles libertés : l'abolition des monopoles de guilde, l'égalité juridique quelle que soit la foi et l'émergence d'une société civile moderne à partir des vestiges de l'obligation féodale."
 nd_wes_hellweg_saltworks: "Salines du Hellweg"
 nd_wes_hellweg_saltworks_desc: "Installations d'évaporation de saumure le long de la route commerciale Hellweg, où les sources salées naturelles sont canalisées vers des tours d'évaporation graduées et des chaudières pour produire du sel destiné au commerce."
 nd_wes_vehmic_tribunal: "Tribunal Vehmique"
 nd_wes_vehmic_tribunal_desc: "Une salle du tribunal du Vehmgericht, où les juges libres de l'empereur tiennent leurs audiences sous serment de secret, rendant la justice capitale au nom de l'autorité impériale sur la Terre Rouge de Westphalie."
 nd_wes_hanseatic_kontor: "Kontor hanséatique"
 nd_wes_hanseatic_kontor_desc: "Une maison de commerce westphalienne dans la tradition hanséatique, où les commerçants de Dortmund et de Soest entreposent des marchandises, négocient des contrats et entretiennent les réseaux commerciaux qui relient le Hellweg au monde hanséatique au sens large."
 nd_wes_sauerland_forge: "Forge du Sauerland"
 nd_wes_sauerland_forge_desc: "Une forge alimentée au charbon de bois dans les montagnes du Sauerland, utilisant des soufflets et des marteaux hydrauliques pour fondre le minerai et produire des armes, des outils et des produits métalliques à partir des riches gisements de Westphalie."
 nd_wes_linen_house: "Maison de linge"
 nd_wes_linen_house_desc: "Un atelier textile westphalien où le lin cultivé localement est transformé en toile de lin par filage, tissage et blanchiment - le fondement du système de production proto-industriel centré sur Bielefeld."
 nd_wes_rathaus: "Hôtel de ville de Westphalie"
 nd_wes_rathaus_desc: "Un hôtel de ville civique dans la grande tradition westphalienne, siège de l'autonomie municipale où des conseils de bourgeois élus administrent la justice, régulent les marchés et gèrent les affaires de villes commerçantes fières et indépendantes."
 nd_wes_pm_brine_evaporation: "Évaporation de la saumure"
 nd_wes_pm_brine_evaporation_desc: "La saumure naturelle des sources salées de Westphalie est chauffée dans des chaudières alimentées par du bois local, avec des bassins d'évaporation recouverts de pierre produisant du sel cristallisé pour le réseau commercial hanséatique."
 nd_wes_pm_saltworks_maintenance: "Entretien des salines"
 nd_wes_pm_saltworks_maintenance_desc: "Entretien des tours d'évaporation graduées, des chaudières et des canaux de saumure des salines du Hellweg."
 nd_wes_pm_tribunal_maintenance: "Entretien du Tribunal"
 nd_wes_pm_tribunal_maintenance_desc: "Tenir à jour les registres, les sceaux et l'appareil d'exécution du système judiciaire de Vehmic."
 nd_wes_pm_kontor_maintenance: "Entretien du comptoir"
 nd_wes_pm_kontor_maintenance_desc: "Entretenir les entrepôts, les livres de comptes et l'infrastructure commerciale de la maison de commerce hanséatique."
 nd_wes_pm_charcoal_smelting: "Fonderie de charbon de bois"
 nd_wes_pm_charcoal_smelting_desc: "Le minerai de fer des collines du Sauerland est fondu dans des hauts fourneaux alimentés au charbon de bois et forgé en armes et en outils à l'aide de marteaux à eau."
 nd_wes_pm_industrial_steel: "Acier industriel"
 nd_wes_pm_industrial_steel_desc: "La transition vers des fours à coke et des convertisseurs Bessemer permet une production de masse d'acier, transformant le Sauerland d'une région sidérurgique traditionnelle en un centre de l'industrie lourde moderne."
 nd_wes_pm_forge_maintenance: "Entretien de la forge"
 nd_wes_pm_forge_maintenance_desc: "Entretien des fours, des roues hydrauliques et des martelages des forges du Sauerland."
 nd_wes_pm_linen_weaving: "Tissage de lin"
 nd_wes_pm_linen_weaving_desc: "Le lin cultivé localement est filé et tissé sur des métiers à tisser manuels, puis blanchi dans les célèbres champs de blanchiment de Bielefeld."
 nd_wes_pm_linen_maintenance: "Entretien de la maison de linge"
 nd_wes_pm_linen_maintenance_desc: "Entretien des métiers à tisser, des champs de blanchiment et du matériel de filature des ateliers de lin westphaliens."
 nd_wes_pm_rathaus_maintenance: "Entretien de la Mairie"
 nd_wes_pm_rathaus_maintenance_desc: "Tenir à jour les archives civiques, les salles du conseil et l'infrastructure administrative de la mairie de Westphalie."
 a_nd_wes_kreistruppen: "Kreistruppen"
 a_nd_wes_kreistruppen_desc: "Infanterie disciplinée du Cercle de Basse-Rhénanie-Westphalie, issue des domaines laïcs et ecclésiastiques pour remplir les obligations militaires obligatoires du Cercle envers la Reichsarmee. Formé aux tâches de défense des frontières et de fortification."
 a_nd_wes_freischoffen: "Garde de Freischoffen"
 a_nd_wes_freischoffen_desc: "Milice urbaine composée de juges libres des tribunaux de Vehmic, des hommes de Westphalie liés par serment qui servent d'exécutants de la justice impériale. Leur discipline et leur esprit d'initiative reflètent la tradition vehmique d'une autorité décisive et inflexible."
 a_nd_wes_line_regiment: "Régiment de ligne westphalien"
 a_nd_wes_line_regiment_desc: "Infanterie de ligne professionnelle formée à la doctrine tactique moderne, équipée de mousquets et de baïonnettes standardisés. La ligne westphalienne représente la transformation de la milice féodale en armée permanente disciplinée."
 levy_nd_wes_freischoffen: "Garde de Freischoffen"
 levy_nd_wes_freischoffen_desc: "Milice urbaine composée de juges libres liés par serment, issus des populations bourgeoises et militaires de Westphalie pour faire respecter l'autorité des tribunaux Vehmic."
 levy_nd_wes_kreistruppen: "Kreistruppen"
 levy_nd_wes_kreistruppen_desc: "Infanterie de la milice du Cercle issue des domaines westphaliens pour remplir les obligations militaires du Cercle de Basse-Rhénanie-Westphalie envers la Reichsarmee."
 nd_wes_destiny: "Destin westphalien"
 nd_wes_destiny_desc: "La Westphalie s'est levée. Les terres situées entre le Rhin et la Weser sont unies et l’avenir s’offre à nous. Que ce soit par la plume de la diplomatie ou par l’épée de la justice, notre destin nous attend."
 nd_wes_dest_congress: "Le Congrès des Nations"
 nd_wes_dest_congress_desc: "Faire de la Westphalie un centre de commerce international et de diplomatie. Assurez le contrôle des réseaux commerciaux d’Amsterdam et adoptez les institutions financières qui financeront notre vision de l’égalité souveraine entre les nations."
 nd_wes_dest_balance: "Équilibre des pouvoirs"
 nd_wes_dest_balance_desc: "The Westphalian system requires not just principles but power to enforce them. Extend our influence to The Hague, grow our treasury, and build Münster into a city fit to house the envoys of every crown."
 nd_wes_dest_eternal_peace: "Paix perpétuelle"
 nd_wes_dest_eternal_peace_desc: "The ultimate expression of Westphalian sovereignty: a world order where disputes are resolved through reason, not force. Reach Geneva, conclude the Peace of Westphalia, and build the institutions of lasting peace."
 nd_wes_dest_vehme: "L'Ascendant Vehme"
 nd_wes_dest_vehme_desc: "Les tribunaux Vehmiques de la Terre Rouge étendront leur portée. Amenez Cologne et Kassel sous notre autorité, prouvant ainsi que la justice de l'Empereur ne connaît pas de frontières. Maintenir la stabilité pendant que nous élargissons notre juridiction."
 nd_wes_dest_landfriede: "L'Éternel Landfriede"
 nd_wes_dest_landfriede_desc: "The Landfrieden, the sworn peace of the realm, requires enforcement. Seize Frankfurt, seat of imperial coronations, and Brunswick in the east. Let the Circle's assembly sit, and build an army capable of imposing order across the German lands."
 nd_wes_dest_reichsgericht: "Le Tribunal Impérial"
 nd_wes_dest_reichsgericht_desc: "La justice de la Terre Rouge s'étendra de la mer du Nord jusqu'aux Alpes. Prenez Magdebourg et Nuremberg, les grandes villes impériales, et établissez un tribunal suprême pour gouverner la nation allemande par une loi appuyée par la force."
 nd_wes.4.t: "Le destin de la Westphalie"
 nd_wes.4.d: "Westphalia stands united, its people prosperous and its borders secure. But unity alone is not destiny. The world watches to see what Westphalia will become: a beacon of sovereign equality that reshapes the international order, or a fortress of imperial justice that imposes law upon the chaos of competing states.\n\nOur path is chosen. Now we must walk it."
 nd_wes.4.a: "Notre destin attend"
 nd_wes.5.t: "Le Congrès se réunit"
 nd_wes.5.d: "Amsterdam's great counting houses now answer to Westphalian authority. The merchant princes of the Rhine delta, the bankers who finance the wars of kings, all acknowledge our sovereignty. With this commercial power at our disposal, Westphalia can convene a congress of nations, not as a neutral bystander, but as a power whose word carries the weight of gold.\n\nThe first congress of Westphalian diplomacy will set the precedent for a new kind of international order."
 nd_wes.5.a: "Laissons les nations prendre place"
 nd_wes.6.t: "La Terre Rouge s'agrandit"
 nd_wes.6.d: "Cologne's great cathedral now stands within our jurisdiction. The Archbishop's ancient claims to supremacy over Westphalia are extinguished: it is the Vehmic courts, not the episcopal see, that dispense justice in these lands. In Kassel, Hessian lords bend to Westphalian law.\n\nThe hooded judges of the Vehmgericht ride further than ever before. Where they go, order follows."
 nd_wes.6.a: "La justice de l'Empereur va loin"
 nd_wes.7.t: "L'équilibre des pouvoirs"
 nd_wes.7.d: "From The Hague, Westphalia's diplomats orchestrate a delicate equilibrium among the powers of Europe. Our treasury is full, Münster has grown into a city of embassies, our institutions are mature. The question now is how to use this position.\n\nShall we establish permanent courts of international arbitration, where disputes between sovereign states are settled by reason and law? Or shall we pursue armed neutrality, building a treasury that makes Westphalia indispensable to every belligerent while keeping our own armies at peace?"
 nd_wes.7.a: "Création de tribunaux d'arbitrage international"
 nd_wes.7.b: "Poursuivre une politique de neutralité profitable"
 nd_wes.8.t: "L'Éternel Landfriede"
 nd_wes.8.d: "Frankfurt and Brunswick have submitted to Westphalian authority. The Landfrieden (the sworn public peace of the Empire) is no longer an aspiration but a reality enforced by Westphalian arms. Our army marches where the Vehmic courts decree, and no lord dares break the peace.\n\nBut enforcement requires a system. Shall we centralize authority in the Crown, ruling through iron decree? Or shall we organize the Imperial Circles into a collective defense, a militia of the realm that enforces order through common obligation?"
 nd_wes.8.a: "Règle par décret de fer de la Couronne"
 nd_wes.8.b: "Organiser les Cercles en une milice commune"
 nd_wes.9.t: "Paix perpétuelle"
 nd_wes.9.d: "Geneva lies within our reach. The peace signed at Münster and Osnabrück has taught the powers to settle by treaty what they could not settle by war. Westphalia stands at the apex of its diplomatic power, the very embodiment of the principle that bears its name: the sovereign equality of all states, great and small.\n\nThe Hall of Peace awaits its purpose. Will it become a shrine to universal human rights, where the dignity of every subject is recognized regardless of birth or confession? Or will it become the engine of a free trade order, where the commerce of nations flows without hindrance and wealth secures the peace that armies cannot?"
 nd_wes.9.a: "Proclamer les droits universels de tous"
 nd_wes.9.b: "Construire un ordre de libre-échange entre nations souveraines"
 nd_wes.10.t: "Le Tribunal Impérial"
 nd_wes.10.d: "Magdeburg and Nuremberg bow to Westphalian authority. From the North Sea to the heart of the Empire, the Red Earth's justice holds sway. No prince defies the tribunal, no bandit escapes the hooded judges, no rebellion goes unpunished.\n\nThe supreme court of the realm must now choose its character. Shall it serve as the instrument of imperial order, projecting military power to enforce the peace? Or shall it become a people's court, integrating the conquered territories through law and justice rather than garrison and sword?"
 nd_wes.10.a: "Le tribunal est au service de l'ordre impérial"
 nd_wes.10.b: "Que le tribunal serve la justice du peuple"
 STATIC_MODIFIER_NAME_nd_wes_dest_arbitration: "Tribunal d'arbitrage"
 STATIC_MODIFIER_DESC_nd_wes_dest_arbitration: "La Cour d'arbitrage de Westphalie arbitre les différends entre États souverains, résolvant les conflits par le raisonnement juridique plutôt que par la force. Ses décisions ont une autorité morale dans toute l’Europe."
 STATIC_MODIFIER_NAME_nd_wes_dest_neutrality: "Neutralité armée"
 STATIC_MODIFIER_DESC_nd_wes_dest_neutrality: "La Westphalie maintient une neutralité rentable, finançant les guerres des autres tout en gardant ses propres armées en paix. La réduction de l’épuisement dû à la guerre et les prêts moins chers compensent le coût du maintien de la préparation."
 STATIC_MODIFIER_NAME_nd_wes_dest_universal_rights: "Droits universels"
 STATIC_MODIFIER_DESC_nd_wes_dest_universal_rights: "La Déclaration westphalienne des droits universels reconnaît la dignité inhérente à chaque sujet, indépendamment de sa naissance, de sa confession ou de sa nationalité. Le développement prospère dans le nouvel ordre, même si la population devient de plus en plus complaisante quant à sa prospérité."
 STATIC_MODIFIER_NAME_nd_wes_dest_free_trade_order: "Ordre de libre-échange"
 STATIC_MODIFIER_DESC_nd_wes_dest_free_trade_order: "L’ordre de libre-échange westphalien ouvre les marchés au-delà des frontières souveraines, enrichissant tous les participants grâce à un commerce sans restriction. L’establishment militaire diminue à mesure que le commerce remplace la conquête."
 STATIC_MODIFIER_NAME_nd_wes_dest_iron_law: "Loi de fer"
 STATIC_MODIFIER_DESC_nd_wes_dest_iron_law: "Le décret de fer de la couronne westphalienne ne tolère aucune dissidence. Une autorité centralisée et une police secrète vigilante assurent l'ordre dans tout le royaume, même si l'appareil de contrôle s'agrandit de plus en plus."
 STATIC_MODIFIER_NAME_nd_wes_dest_circle_militia: "Milice du Cercle"
 STATIC_MODIFIER_DESC_nd_wes_dest_circle_militia: "Les Cercles Impériaux sont organisés en une force de défense collective, chaque territoire fournissant des troupes et du ravitaillement. Un recrutement rapide et une logistique fiable se font au détriment du prestige martial."
 STATIC_MODIFIER_NAME_nd_wes_dest_imperial_order: "Ordre Impérial"
 STATIC_MODIFIER_DESC_nd_wes_dest_imperial_order: "Le Tribunal westphalien projette la puissance militaire pour faire respecter la paix impériale. Des tactiques supérieures et le droit de mener une guerre juste font des armées du royaume un redoutable instrument d’ordre."
 STATIC_MODIFIER_NAME_nd_wes_dest_peoples_court: "Justice populaire"
 STATIC_MODIFIER_DESC_nd_wes_dest_peoples_court: "Le Tribunal populaire de Westphalie intègre les territoires conquis par une application équitable de la loi plutôt que par une occupation militaire. Les terres dévastées se rétablissent plus rapidement sous une gouvernance juste et les sujets étrangers adoptent la domination westphalienne."
 nd_wes_friedenssaal: "Salle Friedens"
 nd_wes_friedenssaal_desc: "La salle de la Paix, inspirée de la salle du Rathaus de Munster où fut signée la Paix de Westphalie. Un centre de médiation diplomatique et d'arbitrage international, où le principe d'égalité souveraine se concrétise dans la pierre, le verre et le parchemin."
 nd_wes_pm_friedenssaal_maintenance: "Entretien de la Salle de la Paix"
 nd_wes_pm_friedenssaal_maintenance_desc: "Entretenir les archives diplomatiques, les salles de conférence et le mobilier de cérémonie du Friedenssaal."
 nd_wes_high_court: "Haute Cour de Westphalie"
 nd_wes_high_court_desc: "Le tribunal suprême de la justice westphalienne, héritier de l'ancienne tradition véhmique mais opérant à l'échelle impériale. Des juges en robe appliquent la loi du royaume depuis un palais de justice fortifié, soutenus par des huissiers armés et de vastes archives de précédents juridiques."
 nd_wes_pm_high_court_maintenance: "Entretien de la Haute Cour"
 nd_wes_pm_high_court_maintenance_desc: "Maintenir les archives judiciaires, les salles d'audience et l'appareil d'exécution de la Haute Cour de Westphalie."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_wes_bureaucracy_authority: "Autorité institutionnelle westphalienne"
 AUTO_MODIFIER_DESC_nd_wes_bureaucracy_authority: "Westphalia's web of cathedral chapters, Imperial Circle co-presidencies, Hanseatic quarters, and Vehmic free courts can sustain real institutional ministries: three bureaucracies of its choosing may be operated from the day Westphalia is formed."

 wes_reichskreis_bureaucracy: "Reichskreis de Westflischer"
 wes_reichskreis_bureaucracy_desc: "Le Cercle impérial westphalien établi par les réformes du Reichstag de 1500 et 1512, l'un des dix Kreise régionaux qui coordonnaient la défense, exécutaient la loi impériale et répartissaient l'impôt de guerre du Rmermonate entre les membres territoriaux. Co-dirigé par l'évêque de Münster et le duc de Clèves-Jlich, le Kreistag légiférait sur les prélèvements régionaux, réglementait la monnaie et surveillait le Landfrieden - et devint après 1648 l'appareil Friedensvollzug exécutant les clauses territoriales et confessionnelles de la paix de Westphalie."

 wes_femgericht_bureaucracy: "Femgericht"
 wes_femgericht_bureaucracy_desc: "The Vehmic free courts whose secret tribunals sat at the Freistühle of Dortmund, Arnsberg, and Volmarstein and reached their apogee between 1300 and 1500. Operating under the nominal authority of the Archbishop of Cologne as Duke of Westphalia, the Femgericht summoned defendants by sealed writ and executed verdicts (almost always hanging) through Frohnboten across the Empire. Free judges sworn to secrecy on pain of death were drawn from sworn freemen rather than territorial nobility, making the Veme a parallel justice that bypassed the seigneurial courts of the Westphalian aristocracy."

 wes_domkapitel_bureaucracy: "Domkapitel der Stifter"
 wes_domkapitel_bureaucracy_desc: "Les chapitres cathédraux de Münster, Paderborn et Osnabrck qui élisaient les princes-évêques de Westphalie parmi la chevalerie impériale. Les chanoines exigeaient l'Ahnenprobe (preuve de seize ancêtres nobles) faisant de chaque chapitre une réserve aristocratique fermée. Les chapitres rédigeaient les capitulations électorales qui contraignaient chaque nouveau prince-évêque et, grâce au patriciat Erbmnner distinctif de Münster, fusionnaient l'Église territoriale avec le régime urbain pour produire la gouvernance aristocratique-bourgeoise caractéristique de la Westphalie."

 wes_hansedrittel_bureaucracy: "Westflisches Hansedrittel"
 wes_hansedrittel_bureaucracy_desc: "Le tiers westphalien de la Ligue hanséatique, l'un des trois tertiae votants au Hansetag, comprenant les membres de Dortmund, Soest, Münster, Lippstadt, Osnabrck et Maas-Niederrhein. Le quartier coordonnait les péages sur le Hellweg, gérait le Kontore à Bergen et Bruges par l'intermédiaire d'un ltermnner nommé, défendait les libertés urbaines contre les princes territoriaux et disciplinait les villes membres par le biais de la Verhansung - expulsion temporaire de la ligue. Sous la direction de Soest, elle dominait le commerce intérieur du sel et des céréales jusqu'à ce que la guerre de Trente Ans brise son réseau commercial."

 wes_markgenossenschaft_bureaucracy: "Markgenossenschaft"
 wes_markgenossenschaft_bureaucracy_desc: "Les assemblées communes de Westphalie qui géraient les forêts, les pâturages, la tourbe et les eaux par des conseils de villageois assermentés sous Markenrechte codifiée, présidés par le Holzgrafen au Markdinge. Combinée avec le régime distinctif de l'Eigenbehrige - par lequel les paysans étaient personnellement liés à un manoir mais détenaient des parcelles héréditaires et une voix communautaire significative - la Markgenossenschaft a donné aux villageois westphaliens plus de sécurité que les serfs de la Gutsherrschaft de l'Elbe oriental n'ont jamais bénéficié, et a survécu à chaque réforme territoriale jusqu'à ce que les Markenteilungen du XIXe siècle brisent les communes."
