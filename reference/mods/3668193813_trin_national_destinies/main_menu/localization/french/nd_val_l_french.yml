l_french:
 STATIC_MODIFIER_NAME_nd_val_furs_i_viles_reials: "The King's Towns Under the Furs"
 STATIC_MODIFIER_DESC_nd_val_furs_i_viles_reials: "The kingdom is governed as James the Conqueror meant it to be: royal towns of free settlers, one written law for all of them, and jurats who answer to the Crown and to nobody's castle. The towns grow and the courts are quick. The barons who wanted the custom of Aragon have not changed their minds."
 STATIC_MODIFIER_NAME_nd_val_jurisdiccio_alfonsina: "The Alfonsine Jurisdiction"
 STATIC_MODIFIER_DESC_nd_val_jurisdiccio_alfonsina: "The lords have accepted the Furs, and have been paid for it with the lower justice over every village of fifteen hearths they hold. They are content, their Muslim tenants are left to farm in peace because they are the lords' income, and the barons' horse rides when the king calls. What the Crown gave away it will not get back."
 STATIC_MODIFIER_NAME_nd_val_catalani_a_roma: "Catalani in the Curia"
 STATIC_MODIFIER_DESC_nd_val_catalani_a_roma: "Nephews hold the red hats, cousins the castles of the Papal State, and clerks from Xàtiva the chancery. Every court in Italy has learned to deal with Valencians. Every cathedral chapter at home counts the benefices that went to one family's friends."
 STATIC_MODIFIER_NAME_nd_val_or_de_roma: "The Gold of Rome"
 STATIC_MODIFIER_DESC_nd_val_or_de_roma: "What the family gathered in Rome it has spent at home: a duchy bought outright, a palace, a collegiate church, cane fields and mills. The kingdom has a first house, and builders have work for a generation."
 STATIC_MODIFIER_NAME_nd_val_carta_del_senyor: "The Lord's Charter"
 STATIC_MODIFIER_DESC_nd_val_carta_del_senyor: "The new settlers hold their plots on the lord's terms: a share of every crop, days of labour on his land, and no leaving without his leave. The estates are whole again. The settlers have long memories."
 STATIC_MODIFIER_NAME_nd_val_carta_del_poblador: "The Settler's Charter"
 STATIC_MODIFIER_DESC_nd_val_carta_del_poblador: "The new settlers pay a light fixed rent and may sell what they hold. Families come from as far as Mallorca and Genoa to take the empty houses. The lords were promised their old incomes and are still waiting for them."
 STATIC_MODIFIER_NAME_nd_val_promesa_de_basset: "Basset's Promise"
 STATIC_MODIFIER_DESC_nd_val_promesa_de_basset: "The dues are abolished, as the general said they would be. The countryside is armed and willing, and the name of the government is cheered in every village square. There is not a lord in the kingdom who would not see it fall."
 STATIC_MODIFIER_NAME_nd_val_fe_dels_senyors: "Faith Kept With the Lords"
 STATIC_MODIFIER_DESC_nd_val_fe_dels_senyors: "The promise made on the beach has been disowned. The lords keep their rents and lend their sons to the regiments as officers. The peasants who came out with their fowling pieces have gone home, and they will not come out again."
 nd_val.1.t: "The Kingdom of Valencia"
 nd_val.1.d: "From the Sénia to the Segura the land between the sierra and the sea has a government of its own again, and it is a kingdom, with a law of its own. James the Conqueror made it one on purpose. He would not hand his conquest to the barons who had ridden with him, so he peopled its towns with free settlers and gave them the Furs: one written law, sworn by every king after him. The barons wanted the custom of Aragon instead, under which a lord is judge in his own lands, and for ninety years they refused the Furs outright.\n\nThe quarrel can be settled two ways. The kingdom can stand on the king's towns and their law, and let the barons like it or not. Or it can do what Alfons the Benign did in 1329: bring the lords inside the Furs by granting them jurisdiction over their own vassals, most of them Muslim farmers whom no lord can afford to lose.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_val.1.a: "One law, and the king's towns to keep it."
 nd_val.1.b: "Let the lords judge their vassals, and swear the Furs."
 nd_val.1.a_tt: "Strong towns and quick lawmaking. The barons are left resentful."
 nd_val.1.b_tt: "Contented barons, protected Muslim tenants and the lords' cavalry. The Crown gives up part of its power."
 nd_val_formed_tt: "Valencia has been formed"
 nd_val_path_a_tt: "Chose the #bold King's Towns#! destiny"
 nd_val_path_b_tt: "Chose the #bold Alfonsine Jurisdiction#! destiny"
 nd_val_comuna_needs_canal_tt: "An irrigation system stands in this location"
 nd_val.2.t: "Twice Loyal"
 nd_val.2.d: "In the spring of 1363 Peter of Castile came down the Túria with his army and camped in the king's own garden palace outside the walls. The city had no garrison worth the name. Its guilds manned the towers, its jurats rationed the grain, and after a fortnight the Castilian went away. He came back in 1364 and sat before the walls for months, until Peter the Ceremonious brought a relieving army along the shore and a fleet beside it.\n\nThe king had not expected the city to hold once, and it held twice. He has granted it the right to crown its arms and to set a letter L on either side of them: loyal, and loyal again. The board that keeps the walls and ditches, set up a few years before the war, has been given its taxes for ever."
 nd_val.2.a: "Dues voltes lleial."
 nd_val.2.a_tt: "Twice loyal: the city earned the two letters on its arms."
 nd_val.3.t: "The Innocents, the Mad and the Witless"
 nd_val.3.d: "On the first Sunday of Lent in 1409, Father Joan Gilabert Jofré was walking to the cathedral to preach when he came on a crowd of boys stoning a madman in the street. He got between them, took the man to his convent, and then preached a different sermon from the one he had prepared. In this city, he said, there are many pious works, but one is wanting: a house where the poor innocent and the mad can be taken in, because they wander the streets hungry and cold and are hurt, and hurt others.\n\nA merchant named Llorenç Salom was in the congregation. Within days he and nine others had put up the money. Their rule says the house shall be governed by ten laymen of the city for ever, and that no cleric and no knight shall sit among them. King Martin has given it his privilege."
 nd_val.3.a: "Let it be the merchants' house, and let it stand."
 nd_val.3.a_tt: "The first house in Europe built to shelter the insane, and laymen govern it."
 nd_val.4.t: "A Borja in the Chair of Peter"
 nd_val.4.d: "The conclave could not agree, and so it chose an old man who would not live long: Alfons de Borja, a canon lawyer from the country outside Xàtiva. He has taken the name Calixtus, and he has already sent for his nephews. One of them, Roderic, is twenty five, clever, and about to become a cardinal and vice chancellor of the Church.\n\nThe Romans have a word for what is arriving. They say the Church is in the hands of the catalani, and they do not mean it kindly. The family now holds the richest patronage in Christendom. It can spend it in Rome, filling the Curia and the castles with its own people. Or it can carry it home, where a duchy on the coast at Gandia can be had for money."
 nd_val.4.a: "Fill the Curia with our own. Rome is where power is."
 nd_val.4.b: "Bring the money home and buy Gandia."
 nd_val.4.a_tt: "Influence and informants in every Italian court. The clergy at home resent it."
 nd_val.4.b_tt: "A great house and great building works in the kingdom."
 nd_val.5.t: "The Emptied Villages"
 nd_val.5.d: "In the valleys behind the coast there are villages where the ovens are cold and the irrigation gates stand open. The people who farmed them are gone, a third of the kingdom, and the lords whose whole income was a share of those harvests are ruined men holding worthless mortgages.\n\nThe remedy is as old as the kingdom: the carta de poblament, a charter that offers the houses and the plots to whoever will come. Everything turns on its terms. The lords want the old shares, a third or a quarter of every crop, with labour dues and a ban on leaving. Settlers who are asked for that much will come slowly, and from the poorest places. Offer a light fixed rent and they will come from Mallorca, from Genoa and from the mountains of the north, and the lords will be poorer for good."
 nd_val.5.a: "The lords were promised their incomes. Their terms stand."
 nd_val.5.b: "Fill the land first. Light rents, and the right to sell."
 nd_val.5.a_tt: "The estates recover and yield more. The settlers are bitter."
 nd_val.5.b_tt: "The villages fill quickly. The lords lose income and say so."
 nd_val.6.t: "The General on the Beach"
 nd_val.6.d: "In August 1705 an allied fleet anchors off Altea and puts ashore a Valencian: Joan Baptista Basset, a carpenter's son who learned war as an engineer in Italy and Hungary. He speaks to the peasants of the Marina in their own language, and he tells them what they have waited a century to hear. Under King Charles there will be no more shares of the crop for the lord, no more labour dues, nothing but what James the Conqueror laid down.\n\nThe countryside rises behind him. They call themselves maulets, and Dénia, Gandia and Alzira open their gates. It is not at all clear that the general had anyone's authority to say what he said. The lords of the kingdom are asking that question loudly, and they command most of what cavalry the kingdom has."
 nd_val.6.a: "He promised it in our name. Abolish the dues."
 nd_val.6.b: "No general makes law on a beach. The lords keep their rents."
 nd_val.6.a_tt: "A countryside in arms and grateful. Every lord becomes an enemy."
 nd_val.6.b_tt: "The lords stay loyal and officer the army. The peasants go home angry."
 nd_val.7.t: "A Poor Tinder Seller"
 nd_val.7.d: "The post from Madrid reaches the city on 23 May 1808 with the gazette that prints the abdications of Bayonne. A crowd gathers in the Plaça de les Panses and nobody in authority will say anything. Then Vicent Doménech, who sells sulphur tapers from a tray, takes off his red sash, tears it, ties the pieces to a cane with a sheet of stamped paper, and climbs on a chair.\n\nA poor palleter, he shouts, declares war on Napoleon. The crowd carries him to the Captain General's door. Within the week a junta governs in the old kingdom's name, the parishes are enrolling, and when Marshal Moncey arrives before the gates in June with eight thousand men he is beaten off from the walls and marches back the way he came."
 nd_val.7.a: "Un pobre palleter li declara la guerra a Napoleó!"
 nd_val.7.a_tt: "A poor tinder seller declares war on Napoleon, and the kingdom follows him."
 nd_val_tribunal_de_les_aigues: "Tribunal de les Aigües"
 nd_val_tribunal_de_les_aigues_desc: "Every Thursday at noon the syndics of the canals of the Horta sit in a half circle outside the Apostles' Door of the cathedral. A farmer who took water out of his turn, or let a channel flood a neighbour's field, is called by the name of his canal, heard, and judged on the spot by men who irrigate from the other canals. Nothing is written down and there is no appeal. James the Conqueror gave the settlers the canals in 1239, to be used as was of old the custom in the time of the Saracens, and the court is older than his grant."
 nd_val_orde_de_montesa: "Orde de Montesa"
 nd_val_orde_de_montesa_desc: "When the Temple was suppressed, James II would not see its Valencian castles pass to the Hospital, which already held too many. In 1317 the pope allowed him an order of his own for this kingdom alone: Santa Maria de Montesa, under the rule of Calatrava, with the castle of Montesa for its seat and the plain red cross of Saint George, in later years, for its badge. Its brethren hold the Maestrat in the north and watch the Granadan road in the south."
 nd_val_aljames_del_regne: "Aljames del Regne"
 nd_val_aljames_del_regne_desc: "The conquest did not empty the land. In the mountain valleys and on the lords' estates the Muslim villages remain, each an aljama with its own qadi, its own mosque and its own sharia in matters among themselves. They pay heavier rents than any Christian settler would accept, which is exactly why their lords protect them. The saying in the kingdom is that he who has a Moor has gold."
 nd_val_paper_de_xativa: "Paper de Xàtiva"
 nd_val_paper_de_xativa_desc: "The geographer al-Idrisi wrote in the twelfth century that Xàtiva made paper such as was found nowhere else in the civilised world, and that it was sent east and west. The mills on the Albaida still beat linen rags to pulp, and the royal chancery writes its registers on the sheet called xativí."
 nd_val_dues_voltes_lleial: "Dues Voltes Lleial"
 nd_val_dues_voltes_lleial_desc: "Peter of Castile besieged the city in 1363 and again in 1364 and took it neither time. Peter the Ceremonious rewarded it with a crown over its arms and two letters L beside them, for a city twice loyal. The more useful legacy is the Fàbrica de Murs i Valls, the board that has kept the walls, the gates and the ditches since 1358."
 nd_val_centenar_de_la_ploma: "Centenar de la Ploma"
 nd_val_centenar_de_la_ploma_desc: "On 3 June 1365, in the camp before Morvedre, the king gave the city a company of its own: the Centenar of the Glorious Saint George, a hundred crossbowmen sworn to escort the city's banner whenever it leaves the walls. Ten are men of lineage and thirty each come from the greater, the middling and the lesser hand of the citizens. They wear a white surcoat with a red cross, and a heron's feather in the helmet that gives them their common name."
 nd_val_obra_de_manises: "Obra de Manises"
 nd_val_obra_de_manises_desc: "The Boïl lords of Manises settled Muslim potters from Málaga on their land, and the craft they brought has outgrown the place it came from. A white tin glaze, cobalt blue, and over it a film of copper and silver that comes out of the third firing shining like gold. Florentine bankers order whole services with their arms in the middle of each dish."
 nd_val_ignoscents_folls_e_orats: "Ignoscents, Folls e Orats"
 nd_val_ignoscents_folls_e_orats_desc: "In 1409 a Mercedarian friar preached that the city lacked a house for the mad, and ten merchants founded one within the year: the Hospital of the Innocents, the Mad and the Witless. It is governed by laymen under the city's protection, and it is the first house in Christendom built for that purpose alone."
 nd_val_els_borja: "Els Borja"
 nd_val_els_borja_desc: "Alfons de Borja, born outside Xàtiva, is elected pope as Calixtus III in 1455. His nephew Roderic, born in Xàtiva, is elected as Alexander VI in 1492. Between them the family holds Rome for fifteen years and its chancery for forty, and fills both with countrymen whom the Romans call, without affection, the catalani."
 nd_val_trapigs_de_la_safor: "Trapigs de la Safor"
 nd_val_trapigs_de_la_safor_desc: "Around Gandia and Oliva the irrigated plain is planted with sugar cane, and beside the fields stand the trapigs where it is crushed and boiled. The sugar goes to Germany through the Ravensburg company's factors, and the mills make the dukes of Gandia the richest lords in the kingdom."
 nd_val_arcabussers_del_centenar: "Arcabussers del Centenar"
 nd_val_arcabussers_del_centenar_desc: "The company of the banner keeps its feather and its place of honour, and changes its weapon. The hundred now carry arquebuses, drill on the riverbank on feast days, and are the first men on the walls when the bell of the cathedral rings the alarm."
 nd_val_escriva_de_racio: "Escrivà de Ració"
 nd_val_escriva_de_racio_desc: "Lluís de Santàngel, son of a Valencian merchant house of converted Jews, keeps the accounts of the king's household and farms the customs of the kingdom. In 1492 he tells the queen that she need not pawn her jewels, and advances 1,140,000 maravedís so that a Genoese captain may sail west. The first letter announcing what the captain found is addressed to him."
 nd_val_rajoleta_de_manises: "Rajoleta de Manises"
 nd_val_rajoleta_de_manises_desc: "Alfonso the Magnanimous floors the Castel Nuovo of Naples with painted tiles from Manises, ordered by the thousand with his devices on them, and Alexander VI lays them in his own apartments in the Vatican. The potteries now fire as many tiles as dishes."
 nd_val_guarda_de_la_costa: "Guarda de la Costa"
 nd_val_guarda_de_la_costa_desc: "Since Algiers became a corsair port, no village within a night's row of the sea sleeps soundly. From the 1550s the kingdom answers with towers set within sight of one another along the whole coast, guards who signal with smoke by day and fire by night, and companies of horse that ride between the towers and gallop to wherever sails are reported."
 nd_val_cartes_de_poblament: "Cartes de Poblament"
 nd_val_cartes_de_poblament_desc: "A carta de poblament is a contract between a lord and the families who will people his village: so many houses, so many plots, such a share of each crop, such days of labour. The kingdom was settled by hundreds of them after the conquest, and after 1609, when the Moriscos were put on ships and a third of the kingdom's people were gone, it was settled by them again."
 nd_val_escola_valenciana: "Escola Valenciana"
 nd_val_escola_valenciana_desc: "Joan de Joanes paints the Saviour holding up the Host for every parish that can afford him. Francesc Ribalta and his son bring the dark manner home from Madrid. Josep de Ribera, a shoemaker's son from Xàtiva, takes it to Naples and signs himself español, and Valencian, for the rest of his life."
 nd_val_comerc_de_la_neu: "Comerç de la Neu"
 nd_val_comerc_de_la_neu_desc: "On the north slopes of the Mariola and the Aitana stand stone wells as deep as a house. In winter gangs of men tread the snow into them in layers between straw. From June it is cut out in blocks and carried down by mule at night to the cities, where the fishmonger packs his catch in it, the physician prescribes it for fevers, and the city council fixes its price like that of bread."
 nd_val_maulets: "Maulets"
 nd_val_maulets_desc: "In 1705 Joan Baptista Basset landed at Altea and promised the peasants of the Marina an end to their lords' dues if they declared for the Archduke Charles. They did, by the thousand, and were called maulets. They carried the kingdom for King Charles in four months. After Almansa, in 1707, the kingdom lost its Furs for having done so."
 nd_val_pisa_de_l_alcora: "Pisa de l'Alcora"
 nd_val_pisa_de_l_alcora_desc: "In 1727 the Count of Aranda opened a manufactory of fine faience in his town of l'Alcora, in the hills behind Castelló. He hired painters from Moustiers, kept a drawing school for the apprentices at his own cost, and obtained freedom from customs for the ware. Within a generation it was on every good table in Spain and was being copied in France."
 nd_val_canem_de_la_plana: "Cànem de la Plana"
 nd_val_canem_de_la_plana_desc: "The irrigated plain around Castelló grows the best hemp in the peninsula. The navy's agents contract for the crop years ahead, and the walks of the Plana spin it into cable, shrouds and sailcloth yarn for the arsenal at Cartagena."
 nd_val_arrossars_de_la_ribera: "Arrossars de la Ribera"
 nd_val_arrossars_de_la_ribera_desc: "Rice gives three or four times what wheat gives on the same ground, and it grows in marsh that would otherwise give nothing. Field by field it spreads around the Albufera and up the Xúquer. Everyone also knows that the villages beside the rice bury more than they baptise, from the tertian fever that comes off the standing water. The council bans new paddies near the towns, and the paddies go on spreading."
 nd_val_novatores: "Novatores"
 nd_val_novatores_desc: "From 1687 a circle meets in the house of the priest Baltasar Íñigo to do mathematics: Tomàs Vicent Tosca, Joan Baptista Corachan and their friends. They read Descartes and Gassendi, observe with telescopes, and write textbooks of the new science in a university town whose chairs still teach Aristotle. Their opponents call them innovators and mean it as an insult. They keep the name."
 nd_val_crida_del_palleter: "La Crida del Palleter"
 nd_val_crida_del_palleter_desc: "On 23 May 1808 a seller of sulphur tapers named Vicent Doménech tied his sash and a sheet of stamped paper to a cane in the Plaça de les Panses and declared war on Napoleon. The city rose behind him, and after the city the kingdom: parish companies and bands in the sierra that the French never finished chasing."
 nd_val_draps_d_alcoi: "Draps d'Alcoi"
 nd_val_draps_d_alcoi_desc: "Alcoi has made woollens for three centuries and has no flat ground, no good road and no port. It has the Molinar, a torrent that falls through a ravine fast enough to turn a wheel on every ledge. In 1818 the clothiers bring in carding and spinning machines. In 1821 twelve hundred hand spinners from the villages around march into town and break them, and the clothiers order new ones."
 nd_val_paper_de_fumar: "Paper de Fumar"
 nd_val_paper_de_fumar_desc: "The same water that fulls cloth beats rags. Alcoi's mills make writing paper from the middle of the eighteenth century, and then find the trade that makes them known on two continents: the thin unsized sheet in which a smoker rolls his own tobacco, sold in little books with a printed cover."
 nd_val_observacions_de_cavanilles: "Observacions de Cavanilles"
 nd_val_observacions_de_cavanilles_desc: "The botanist Antoni Josep Cavanilles walks the whole kingdom between 1791 and 1793 with a notebook and a barometer. His two volumes describe each district in turn: its rocks and waters, what is grown and what could be, the number of households then and a century before, and why the rice villages are dying. No other kingdom of the monarchy has been measured so closely."
 a_nd_val_frares_de_montesa: "Frares de Montesa"
 a_nd_val_frares_de_montesa_desc: "Knight brethren of the Order of Montesa in mail and white mantles. They are few and well armoured, and are sworn not to leave the field without their master's leave. They are slow to gather far from their own commanderies."
 levy_nd_val_frares_de_montesa: "Brethren of Montesa"
 levy_nd_val_frares_de_montesa_desc: "The clergy of a location where a Comanda de Montesa stands ride out as knights of the order."
 a_nd_val_centenar_de_la_ploma: "Centenar de la Ploma"
 a_nd_val_centenar_de_la_ploma_desc: "The crossbowmen of the city's banner, in white surcoats with the cross of Saint George and a heron's feather in the helmet. They are quick to muster and shoot well. In mail shirts and little else, they suffer when the fight comes to close quarters."
 levy_nd_val_centenar_de_la_ploma: "Centenar de la Ploma Levy"
 levy_nd_val_centenar_de_la_ploma_desc: "Burghers chosen from every rank of the citizens to escort the banner."
 a_nd_val_arcabussers_del_centenar: "Arcabussers del Centenar"
 a_nd_val_arcabussers_del_centenar_desc: "The company of the banner rearmed with the arquebus. They are still the first to the walls and still lightly protected."
 levy_nd_val_arcabussers_del_centenar: "Arquebusiers of the Centenar Levy"
 levy_nd_val_arcabussers_del_centenar_desc: "Burghers of the company of the banner, mustered with firearms."
 a_nd_val_cavalleria_de_la_costa: "Cavalleria de la Costa"
 a_nd_val_cavalleria_de_la_costa_desc: "The mounted companies of the coast guard. They patrol between the watchtowers and reach a landing before the raiders have loaded their captives. They are fast and always first on the ground, and they hit like a patrol and not like a battle line."
 a_nd_val_maulets: "Maulets"
 a_nd_val_maulets_desc: "Peasants in arms for the promise that their lords' dues will end. They come on with fowling pieces and sickles in a furious first rush. Against drilled foot in the open they do not hold."
 levy_nd_val_maulets: "Maulet Levy"
 levy_nd_val_maulets_desc: "Catalan-speaking peasants and laborers of the kingdom, risen against their lords and for their king."
 a_nd_val_partides: "Partides"
 a_nd_val_partides_desc: "Parish bands under a friar, a notary or a smuggler. They cut convoys in the orange groves and the sierra and are gone before the dragoons arrive. They will not stand to be charged."
 levy_nd_val_partides: "Partida Levy"
 levy_nd_val_partides_desc: "Peasants and laborers of the kingdom raised by parish against an occupying army."
 nd_val_comuna_de_regants: "Comuna de Regants"
 nd_val_comuna_de_regants_desc: "The irrigators of one canal as a sworn body. They elect a syndic, clean the channels and mend the weir at their own cost, and take the water by turn. Quarrels over water are judged within the week by farmers of the neighbouring canals, and that is the end of them."
 nd_val_comuna_de_regants_maintenance: "Cleaning the Channels"
 nd_val_comuna_de_regants_maintenance_desc: "Every spring the water is shut off, and the commune digs out the silt and repairs the weir with timber, stone and its own labour."
 nd_val_comanda_de_montesa: "Comanda de Montesa"
 nd_val_comanda_de_montesa_desc: "A commandery of the Order of Montesa: a castle or strong house, a knight commander, a handful of brethren and chaplains, and the villages whose rents keep them in horses and mail. Where one stands, the clergy of the place ride as knights."
 nd_val_comanda_de_montesa_maintenance: "The Commander's Table"
 nd_val_comanda_de_montesa_maintenance_desc: "Arms, remounts, white mantles and the daily board of a house of knights."
 nd_val_fabrica_de_murs_i_valls: "Fàbrica de Murs i Valls"
 nd_val_fabrica_de_murs_i_valls_desc: "The board of walls and ditches. Deputies of the three estates and the town's magistrates hold a tax on grain and meat, and spend it on the walls and gates, the sewers, the roads out of town and the bridges. It was founded after a flood threw the wall down."
 nd_val_fabrica_de_murs_i_valls_maintenance: "Works of the Board"
 nd_val_fabrica_de_murs_i_valls_maintenance_desc: "Dressed stone, lime mortar and scaffolding timber for the year's repairs, and masons to do them."
 nd_val_obrador_de_manises: "Obrador de Manises"
 nd_val_obrador_de_manises_desc: "A pottery in the manner of Manises and Paterna: wheels, glazing vats and a kiln that must be fired three times for the best ware."
 nd_val_manises_obra_daurada: "Obra Daurada"
 nd_val_manises_obra_daurada_desc: "Dishes, jars and basins in white tin glaze, painted in blue and finished with a copper lustre that shines like gold."
 nd_val_manises_rajoleta: "Rajoleta"
 nd_val_manises_rajoleta_desc: "Painted floor tiles, fired by the thousand and shipped in crates to the palaces of Naples and Rome."
 nd_val_hospital_dels_ignoscents: "Hospital dels Ignoscents"
 nd_val_hospital_dels_ignoscents_desc: "The Hospital of the Innocents, the Mad and the Witless. The insane are lodged, fed and set to light work here, and kept out of reach of the street boys' stones. Ten merchants paid for it and ten laymen govern it."
 nd_val_hospital_dels_ignoscents_maintenance: "Keeping the House"
 nd_val_hospital_dels_ignoscents_maintenance_desc: "Bread, bedding, clothing and the apothecary's bill for those the house takes in."
 nd_val_trapig: "Trapig"
 nd_val_trapig_desc: "A sugar mill of the Safor. Mules turn stone rollers that crush the cane, the juice is boiled down in a row of coppers, and the syrup is poured into clay cones to set into loaves."
 nd_val_trapig_sucre: "Sugar Loaves"
 nd_val_trapig_sucre_desc: "Cane crushed and boiled over wood fires, and set in clay moulds made by the thousand in Paterna."
 nd_val_torre_de_guaita: "Torre de Guaita"
 nd_val_torre_de_guaita_desc: "A stone watchtower on the shore, its door a ladder's height above the ground. Two or three guards keep it, with a small gun and a stack of brushwood. Smoke by day and fire by night carries the alarm down the coast faster than a galley can row."
 nd_val_torre_de_guaita_maintenance: "The Watch"
 nd_val_torre_de_guaita_maintenance_desc: "Powder and shot, brushwood and pitch for the signal, and a horse for the rider who carries the alarm inland."
 nd_val_cava_de_neu: "Cava de Neu"
 nd_val_cava_de_neu_desc: "A snow well on a north slope: a stone pit as deep as a house under a vaulted roof. Snow is trodden into it through the winter, and cut out in blocks in summer for the towns below."
 nd_val_cava_de_neu_maintenance: "Packing the Snow"
 nd_val_cava_de_neu_maintenance_desc: "Straw and matting to layer the snow, timber for the roof, and stone for the lining."
 nd_val_reial_fabrica_de_l_alcora: "Reial Fàbrica de l'Alcora"
 nd_val_reial_fabrica_de_l_alcora_desc: "A manufactory of fine faience on the model of the Count of Aranda's works: hundreds of hands under one roof, painters trained in its own drawing school, and kilns that never go cold."
 nd_val_alcora_pisa_fina: "Pisa Fina"
 nd_val_alcora_pisa_fina_desc: "Tin-glazed tableware painted in the French manner, and in later years pipe clay and a soft porcelain from the same kilns."
 nd_val_filador_de_canem: "Filador de Cànem"
 nd_val_filador_de_canem_desc: "A hemp walk. The stalks are retted, broken and combed, spun by men walking backwards down a long shed, and laid up into cable for the navy."
 nd_val_filador_cordam: "Cordam"
 nd_val_filador_cordam_desc: "Cable, shrouds and running rigging of tarred hemp."
 nd_val_fabriques_del_molinar: "Fàbriques del Molinar"
 nd_val_fabriques_del_molinar_desc: "Mills built ledge above ledge on a torrent that falls through a ravine, each one taking the water the last one has used. Fulling stocks first, then carding and spinning machines."
 nd_val_molinar_draps: "Draps"
 nd_val_molinar_draps_desc: "Woollen cloth carded and spun by water power."
 nd_val_molinar_paper: "Paper de Fumar"
 nd_val_molinar_paper_desc: "Rag paper, and above all the thin sheet in which a smoker rolls his tobacco."
 # ===== DESTINY =====
 nd_val_dest_valencia_46_tt: "Valencia is ours and has at least 46 development"
 nd_val_dest_valencia_55_tt: "Valencia is ours and has at least 55 development"
 nd_val_dest_obradors_tt: "At least 3 of our locations have an Obrador de Manises"
 nd_val_dest_alacant_ciutat_tt: "Alicante is ours and has grown into a city"
 nd_val_dest_gandia_44_tt: "Gandia is ours and has at least 44 development"
 nd_val_dest_trapigs_tt: "At least 2 of our locations have a Trapig"
 nd_val_destiny: "Regne per Si"
 nd_val_destiny_desc: "The kingdom is a realm of its own, with its own law, its own Corts and its own coin, and whoever rules it swears the Furs before he is obeyed. Bring the country to good order (stability of 75) and the estates will stand behind the government that keeps the oath."
 nd_val_dest_cami_de_requena: "El Camí de Requena"
 nd_val_dest_cami_de_requena_desc: "The capital eats Castilian wheat and builds with Castilian pine, and both come down one road, past the dry port of Requena where another king's officers take their toll on every cart and every flock. Hold Requena, let the city of Valencia grow to 46 development, and keep 1,000 gold in the treasury: the customs house on the capital's own road should be the capital's."
 nd_val_dest_croada_de_barbaria: "La Croada de Barbaria"
 nd_val_dest_croada_de_barbaria_desc: "In 1397 corsairs sacked Torreblanca and carried off the monstrance with the Host in it. The next summer a fleet armed in Valencia and Mallorca fell on Tedelis, the port they had sailed from, and the city paid for its galleys with annuities sold on its own credit. Take Tedelis on the Barbary shore, embrace Banking, raise Valencia to 55 development and hold 2,000 gold."
 nd_val_dest_art_major_de_la_seda: "L'Art Major de la Seda"
 nd_val_dest_art_major_de_la_seda_desc: "The velvet weavers wrote their ordinances in 1479, Genoese masters brought the new looms, and within a lifetime the trade filled a whole quarter of the capital. Silk needs dye from over the sea, merchants who already ship the kingdom's lustreware, and a second port. Embrace the Printing Press, bring dyes to the capital's market, keep three Obradors de Manises at work, make Alicante a city, and hold 3,000 gold and 75 prestige."
 nd_val_dest_marquesat_de_villena: "El Marquesat de Villena"
 nd_val_dest_marquesat_de_villena_desc: "In 1366 a lord of this kingdom, Alfons of Aragon, count of Dénia, was made marquis of Villena: a Valencian house holding the plateau beyond the frontier, with Chinchilla as its chief town. What a lord holds by grant of one king can be lost at the word of the next. Take Villena and Chinchilla for the kingdom and reach 50 prestige, and the marquisate is held by right."
 nd_val_dest_regne_de_murcia: "El Regne de Múrcia"
 nd_val_dest_regne_de_murcia_desc: "James the Just took the whole kingdom of Murcia in 1296 and was left with its northern third eight years later. The rest is the same irrigated country as Oriola, worked by the same Muslim farmers, and the lords who would be given it keep their courts at home. Take Murcia, Cartagena and Lorca, raise Gandia to 44 development, and hold 2,000 gold."
 nd_val_dest_croada_d_almeria: "La Croada d'Almeria"
 nd_val_dest_croada_d_almeria_desc: "The treaty of 1308 promised the Crown a sixth of the kingdom of Granada, with Almeria as its head. The king sailed from Valencia the next summer, sat before the walls until winter, and came home with nothing. The coast beyond it grows cane, as the plain of Gandia does. Take Almeria, Mojácar and Adra, keep two Trapigs at work, and hold 3,000 gold and 75 prestige."
 nd_val.8.t: "The Oath on the Furs"
 nd_val.8.d: "In the cathedral, before the three estates, the ruler has sworn to keep the Furs and privileges of the kingdom, and only then have the estates sworn to him. It is the order of things James the Conqueror laid down: first the law, then the obedience. The syndics of the royal towns stood on one side and the barons on the other, and for once neither left before the end."
 nd_val.8.a: "First the law, then the obedience."
 nd_val.8.a_tt: "The Corts stand more readily behind the government."
 nd_val.9.t: "The Dry Port"
 nd_val.9.d: "The customs house at Requena has changed masters. The carts of Castilian wheat still come down from the plateau, and the rafts of pine still ride the spring flood to the timber yards below the city walls, but the toll on them is now taken by officers of this kingdom. The jurats of Valencia have asked that the proceeds go to the works of the city. They would."
 nd_val.9.a: "The capital's road belongs to the capital."
 nd_val.9.a_tt: "Town building is cheaper and tariffs can be set higher."
 nd_val.10.t: "The Fleet Comes Home from Tedelis"
 nd_val.10.d: "The galleys are back in the Grau with the banner of the crusade at the masthead. Tedelis was taken in a morning. The monstrance stolen from Torreblanca was not in it, and the emir of the country now offers to give it back for the prisoners. The captains have another proposal. The galleys are paid for, the crews are raised, and the Barbary coast is long: let the city issue letters of marque and keep them at sea."
 nd_val.10.a: "Ransom the monstrance and bring it home in procession."
 nd_val.10.b: "Keep the galleys out. Let them pay for themselves."
 nd_val.10.a_tt: "A devout and united kingdom, and a fleet that comes home whole."
 nd_val.10.b_tt: "Cheap privateers who take prizes."
 nd_val.11.t: "The Velvet Weavers"
 nd_val.11.d: "The guild of velluters has a house of its own now, and its examiners can stop any loom in the city. The old masters want the ordinances kept to the letter: so many threads to the palm, a seal on every piece, and no man admitted who did not serve his years here. The merchants point at the Genoese, who weave a lighter velvet that sells better and who have cousins in every port from Lisbon to Chios. They ask that the foreigners be let in as masters."
 nd_val.11.a: "The ordinances, to the letter. Our seal must mean something."
 nd_val.11.b: "Admit the Genoese masters, patterns and cousins and all."
 nd_val.11.a_tt: "More silk and fuller cities. Newcomers find the door shut."
 nd_val.11.b_tt: "Wider sea trade and finer cloth. Old customs give way to foreign ones."
 nd_val.12.t: "The Marquis and the King"
 nd_val.12.d: "Villena and Chinchilla answer to this kingdom, and the lords who took them have come to court to learn on what terms they will hold them. They expect the terms of 1329: the Furs sworn, and justice over their own vassals in return. No one at court proposes anything else. A baron who is judge in his own villages is a baron with a reason to defend them."
 nd_val.12.a: "The Furs sworn, and each lord judge in his own lands."
 nd_val.12.a_tt: "A warlike nobility that produces captains."
 nd_val.13.t: "The Huerta of Murcia"
 nd_val.13.d: "The plain of the Segura is ours from Oriola to the sea at Cartagena. It is the richest land the kingdom has taken since the Conquest and it is full of Muslim farmers who know its canals better than any settler will. The lords who are to have it want them left exactly where they are. There is a second question, which is where the rents will go. At Gandia the duke is building, and he keeps men at his table for no better reason than that they write verse."
 nd_val.13.a: "Leave the farmers on the land. A lord protects his income."
 nd_val.13.b: "Let the rents go to Gandia, and the poets with them."
 nd_val.13.a_tt: "More wheat and oil. The tenants are not converted."
 nd_val.13.b_tt: "More artists, more works begun, and cheaper to keep."
 nd_val.14.t: "The Keys of Almeria"
 nd_val.14.d: "Where James the Just sat through an autumn and went home, the banner of the kingdom now hangs from the Alcazaba. The sixth part of Granada promised in 1308 has been collected, late. The lords who came with their horse expect a repartiment, as their grandfathers had in Valencia: so many villages each, with their vassals and their cane fields. The king's council would rather put royal captains in the castles and keep the coast in one hand."
 nd_val.14.a: "Share out the land. They rode for it."
 nd_val.14.b: "The castles are the king's, and so are their captains."
 nd_val.14.a_tt: "Lords eager for the next campaign. Their new lands pay the Crown little."
 nd_val.14.b_tt: "Cheap, well kept fortresses and steady garrisons."
 STATIC_MODIFIER_NAME_nd_val_dest_custodia_rescatada: "The Monstrance Ransomed"
 STATIC_MODIFIER_DESC_nd_val_dest_custodia_rescatada: "The Host stolen from Torreblanca has come home and been carried through the streets, and the fleet that fetched it was laid up in good order."
 STATIC_MODIFIER_NAME_nd_val_dest_cors_de_la_ciutat: "The City's Corsairs"
 STATIC_MODIFIER_DESC_nd_val_dest_cors_de_la_ciutat: "The jurats issue letters of marque, and the galleys of the crusade stay at sea at the expense of whoever they catch."
 STATIC_MODIFIER_NAME_nd_val_dest_ordenances_dels_velluters: "Ordinances of the Velvet Weavers"
 STATIC_MODIFIER_DESC_nd_val_dest_ordenances_dels_velluters: "Every piece is counted, measured and sealed, and no one weaves who did not learn here. The cloth is trusted, and the trade is closed."
 STATIC_MODIFIER_NAME_nd_val_dest_mestres_genovesos: "The Genoese Masters"
 STATIC_MODIFIER_DESC_nd_val_dest_mestres_genovesos: "Foreign weavers sit in the guild with their own patterns and their own correspondents abroad. The velvet is better and it travels further; the trade is no longer a family matter."
 STATIC_MODIFIER_NAME_nd_val_dest_horta_dels_vassalls: "The Vassals' Huerta"
 STATIC_MODIFIER_DESC_nd_val_dest_horta_dels_vassalls: "The Muslim farmers of the Segura keep their fields, their canals and their mosques, because their lords will not hear of anything else."
 STATIC_MODIFIER_NAME_nd_val_dest_cort_de_gandia: "The Court at Gandia"
 STATIC_MODIFIER_DESC_nd_val_dest_cort_de_gandia: "The rents of the south are spent on a palace, and on the men who write at its table."
 STATIC_MODIFIER_NAME_nd_val_dest_repartiment_d_almeria: "The Repartiment of Almeria"
 STATIC_MODIFIER_DESC_nd_val_dest_repartiment_d_almeria: "The conquest has been divided among the lords who made it. They are ready for another, and what they hold pays the Crown little."
 STATIC_MODIFIER_NAME_nd_val_dest_guarnicions_del_rei: "The King's Garrisons"
 STATIC_MODIFIER_DESC_nd_val_dest_guarnicions_del_rei: "Royal captains hold the castles of the new coast, paid and relieved from the capital."
 nd_val_dest_collegi_de_la_seda: "Col·legi de la Seda"
 nd_val_dest_collegi_de_la_seda_desc: "The house of the velvet weavers. Its examiners admit the masters, inspect the looms and put the seal on every piece of silk that leaves the city."
 nd_val_dest_collegi_de_la_seda_maintenance: "Examination Pieces"
 nd_val_dest_collegi_de_la_seda_maintenance_desc: "Silk and dye for the masterpieces, and paper for the registers of masters and seals."
 nd_val_dest_cort_ducal: "Cort Ducal"
 nd_val_dest_cort_ducal_desc: "The household of a great lord in his own town: a palace, a chancery, a table for poets and a retinue that musters at its gate."
 nd_val_dest_cort_ducal_maintenance: "The Lord's Household"
 nd_val_dest_cort_ducal_maintenance_desc: "Paper for the chancery, cloth and furniture for the hall, and wine for the table."

 # ===== BUREAUCRACIES =====
 val_mustassaf_bureaucracy: "Mustassaf"
 val_mustassaf_bureaucracy_desc: "The office the conquerors found in Muslim Valencia and kept: the city had its mustassaf soon after 1238, a century before Barcelona named one in 1339. Each year a citizen is drawn by lot to hold it. He tests weights and measures, posts the price of bread, meat and fish, condemns bad food, inspects the work of the guilds, and sees that streets are kept clean and houses built by the rule. His fines are paid on the spot."
 val_pare_d_orfens_bureaucracy: "Pare d'Òrfens"
 val_pare_d_orfens_bureaucracy_desc: "On 6 March 1338 Peter the Ceremonious recognised, at the city's request, a curator of the orphans and the destitute of Valencia, and in 1407 Martin the Humane made him a judge apart from the criminal court. He binds orphans and abandoned youths to masters as apprentices and servants, inspects their contracts, holds their wages until they marry or come of age, and has the idle whipped and driven from the city. Castelló copied the office in 1386, Zaragoza in 1475 and Tudela in 1527."
 val_lligallo_bureaucracy: "Lligallo"
 val_lligallo_bureaucracy_desc: "In 1271 James the Conqueror allowed the men of Morella to hold a lligallo in their district. On its day each year the herders of the mountain gather, every stray beast found since the last meeting is brought in and returned to its owner, the statutes are read aloud and the officers are chosen. The custom is kept across the north of the kingdom and down to the lower Ebro."
 val_governacio_bureaucracy: "Governació"
 val_governacio_bureaucracy_desc: "Since the reforms of 1344 the king is represented in the kingdom by a portantveus de general governador, who must be a native of it. One governor sits in Valencia, with lieutenants beyond the Uixó at Castelló and beyond the Xúquer at Xàtiva, and another in Orihuela for the land beyond Xixona. Their business is government and above all justice, and in need they raise and lead the host. From 1520 they serve under the viceroy."

 # The auto modifier that grants the country's slots on formation
 AUTO_MODIFIER_NAME_nd_val_bureaucracy_authority: "Offices of the Kingdom of Valencia"
 AUTO_MODIFIER_DESC_nd_val_bureaucracy_authority: "Two institutions of the kingdom of Valencia can be kept at once, chosen among the Mustassaf, the Pare d'Òrfens, the Lligallo and the Governació."
