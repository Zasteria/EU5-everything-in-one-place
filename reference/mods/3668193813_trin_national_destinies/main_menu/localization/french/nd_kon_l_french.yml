l_french:
 STATIC_MODIFIER_NAME_nd_kon_christian_diplomacy: "Diplomatie chrétienne du Kongo"
 STATIC_MODIFIER_DESC_nd_kon_christian_diplomacy: "Le Manikongo a embrassé la foi de Rome, ouvrant des voies diplomatiques avec les cours d'Europe. Des envoyés kongolais se rendent à Lisbonne et au Vatican, tandis que des missionnaires et des érudits apportent connaissances et techniques à Mbanza Kongo."
 STATIC_MODIFIER_NAME_nd_kon_strength_of_ancestors: "La force des ancêtres"
 STATIC_MODIFIER_DESC_nd_kon_strength_of_ancestors: "Le Manikongo tire son autorité des traditions des fondateurs : les maîtres forgerons qui ont forgé le royaume. Les tambours de guerre résonnent à travers les provinces et les guerriers boucliers sont prêts à défendre chaque frontière."
 STATIC_MODIFIER_NAME_nd_kon_antonine_fervor: "Ferveur d'Antonin"
 STATIC_MODIFIER_DESC_nd_kon_antonine_fervor: "Les enseignements de la prophétesse se sont répandus à travers le pays, proclamant que les racines sacrées du royaume sont plus profondes que n'importe quelle croyance étrangère. Les gens se mobilisent autour de cette vision d’une foi typiquement kongolaise."
 STATIC_MODIFIER_NAME_nd_kon_national_renaissance: "Renaissance Kongolaise"
 STATIC_MODIFIER_DESC_nd_kon_national_renaissance: "Un sentiment renouvelé d'identité kongolaise surgit à travers le royaume, alors que les gens redécouvrent et célèbrent les traditions, les arts et les systèmes de gouvernance qui rendent leur civilisation unique."
 nd_kon.1.t: "Le Royaume du Kongo renaît"
 nd_kon.1.d: "The great work is complete. From the banks of the mighty Nzadi, the river the foreigners call Congo, to the shores of the western ocean, the scattered provinces once more answer to a single throne. Mbanza Kongo stands as the heart of a reunited realm, its stone churches and ancient spirit houses alike testament to a kingdom that bridges worlds.\n\nThe Manikongo must now choose the path forward. Shall we embrace the connections forged with the kingdoms across the sea, using their faith and learning to strengthen our own? Or shall we look inward, to the iron traditions and ancestral wisdom that built this kingdom long before any foreign ship appeared on our horizon?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_kon.1.a: "Nous marcherons avec Rome et Lisbonne."
 nd_kon.1.b: "Notre force réside dans la forge et dans les ancêtres."
 nd_kon.2.t: "La Prophétesse du Kongo"
 nd_kon.2.d: "A young woman of noble birth has risen from the ashes of decades of civil war, claiming to be possessed by the spirit of Saint Anthony. But her teachings are no simple repetition of European doctrine: Dona Beatriz Kimpa Vita proclaims that Jesus Christ was born in Mbanza Kongo, that the Mother of God was a Kongolese woman, and that the saints were the ancestors of the Kongolese people.\n\nHer Antonine movement sweeps through the countryside, offering hope to a people exhausted by war. She calls for the reunification of the kingdom and the restoration of the abandoned capital. Thousands flock to her banner, and the old powers, both Kongolese and European, watch with unease."
 nd_kon.2.a: "Laissez son message unir notre peuple."
 nd_kon.2.b: "Canalisez le zèle de ses partisans au service du royaume."
 nd_kon.3.t: "L'identité kongolais"
 nd_kon.3.d: "As the age of revolutions reshapes the world, the people of Kongo look to their own heritage with renewed pride. The raffia cloth patterns that once served as currency, the iron-forging traditions that gave birth to kings, the drum signals that coordinated armies across vast distances: these are not relics of a vanished past but living traditions that define who the Kongolese are.\n\nScholars and elders work to preserve and celebrate the kingdom's unique cultural legacy, ensuring that the identity of Kongo endures regardless of what changes the future may bring."
 nd_kon.3.a: "Nos traditions sont notre force."
 nd_kon.3.b: "La fierté de notre peuple deviendra notre force en armes."
 nd_kon_iron_tradition: "Maîtrise du fer"
 nd_kon_iron_tradition_desc: "Les fondateurs du Kongo étaient maîtres de forge, et le forgeron reste une figure d'autorité spirituelle et politique. Les outils en fer, les armes et les symboles de la royauté proviennent des forges kongolaises."
 nd_kon_shield_warriors: "Guerriers Boucliers"
 nd_kon_shield_warriors_desc: "L'infanterie lourde du Kongo transporte de grands boucliers et des épées au combat, formant un noyau discipliné qui absorbe les charges ennemies avant de contre-attaquer au corps à corps."
 nd_kon_nzo_a_nkisi_tradition: "Tradition Nzo à Nkisi"
 nd_kon_nzo_a_nkisi_tradition_desc: "Les maisons des esprits du Kongo sont des dépositaires de nkisi : des objets sacrés chargés de pouvoir spirituel. Ces sanctuaires ancrent les communautés et renforcent l'autorité des dirigeants locaux."
 nd_kon_raffia_weaving: "Tissage de raphia"
 nd_kon_raffia_weaving_desc: "Les tisserands kongolais transforment les fibres de raphia en tissus luxueux aux tissages serrés et aux motifs complexes, teints et brodés selon des normes qui font du tissu un moyen d'échange fiable."
 nd_kon_nzimbu_currency: "Monnaie du coquillage Nzimbu"
 nd_kon_nzimbu_currency_desc: "Les coquilles nzimbu en spirale de Luanda servent de monnaie standardisée au royaume. Cent achètent une poule, deux mille une chèvre : un système monétaire sophistiqué qui facilite le commerce à travers le royaume."
 nd_kon_pombo_scouts: "Éclaireurs de Pombo"
 nd_kon_pombo_scouts_desc: "Troupes d'éclaireurs d'élite de l'armée Kongo, les pombos sont entraînés à suivre le rythme des cavaliers montés à pied. Ils servent d'yeux et d'oreilles au royaume, poursuivant les ennemis en fuite et reconnaissant les positions ennemies."
 nd_kon_stone_masonry: "Maçonnerie en pierre"
 nd_kon_stone_masonry_desc: "Sous Afonso Ier, les ouvriers kongolais apprirent les techniques européennes de construction en pierre, élevant des églises et des palais mêlant méthodes importées et sensibilités locales : un témoignage physique de la synthèse culturelle du royaume."
 nd_kon_royal_school: "Ecole Royale de Mbanza Kongo"
 nd_kon_royal_school_desc: "By 1516, over a thousand students attended the royal school at Mbanza Kongo, with additional schools established in the provinces. The result was a fully literate noble class unprecedented in sub-Saharan Africa. Its teachers, the mestres, are Kongolese nobles themselves."
 nd_kon_mbanza_capital: "Mbanza-Kongo"
 nd_kon_mbanza_capital_desc: "La capitale du royaume se transforme en une véritable ville, ses rues portent des noms, ses cathédrales et chapelles en pierre côtoient les structures traditionnelles. Mbanza Kongo est le cœur politique, spirituel et économique du royaume."
 nd_kon_provincial_dukes: "Ducs provinciaux"
 nd_kon_provincial_dukes_desc: "Les six grandes provinces (Nsundi, Mpangu, Mbata, Soyo, Mbamba et Mpemba) sont organisées sous des gouverneurs nommés qui portent des titres ducaux de style européen, créant une hiérarchie administrative structurée."
 nd_kon_copper_trade: "Commerce du cuivre"
 nd_kon_copper_trade_desc: "The copper deposits of the region fuel a trade in worked metal that stretches across Central Africa and beyond, providing the kingdom with a valuable commodity alongside its textile and ivory exports.\n\n#italic Available in: $nd_kon_iron_forge$#!"
 nd_kon_musket_regiment: "Régiment de mousquets"
 nd_kon_musket_regiment_desc: "Les troupes kongolaises entraînées à l’utilisation des armes à feu européennes forment des régiments de mousquets organisés, combinant technologie militaire importée et traditions tactiques indigènes."
 nd_kon_atlantic_diplomacy: "Diplomatie atlantique"
 nd_kon_atlantic_diplomacy_desc: "Les envoyés du royaume naviguent dans la politique complexe du monde atlantique, s'engageant auprès des cours portugaises, néerlandaises et papales. Les ambassadeurs kongolais sont reçus à Lisbonne et à Rome, érigeant le royaume en puissance souveraine reconnue."
 nd_kon_cloth_market_tradition: "Tradition du marché aux tissus"
 nd_kon_cloth_market_tradition_desc: "Dedicated markets for the trade of raffia cloth emerge in the kingdom's towns, where the libongo, standardized cloth currency, changes hands alongside imported European goods and regional commodities."
 nd_kon_missionary_education: "Éducation missionnaire"
 nd_kon_missionary_education_desc: "Les missionnaires jésuites et capucins fondent des collèges dans le royaume, enseignant la lecture, l'écriture, la théologie et les sciences européennes. La classe alphabétisée qui en résulte comble le fossé entre les traditions de connaissances kongolaises et européennes."
 nd_kon_battle_drums: "Tambours et signaux de combat"
 nd_kon_battle_drums_desc: "Un système complexe de tambours, de cornes et de fanions permet aux commandants kongolais de coordonner leurs forces sur le champ de bataille, dirigeant avec précision le centre et les deux ailes de leurs formations de combat."
 nd_kon_battle_formations: "Tactiques en trois divisions"
 nd_kon_battle_formations_desc: "Les armées kongolaises se déploient dans une formation sophistiquée de trois divisions, un centre fort flanqué de deux ailes mobiles, coordonnées par un système élaboré de signaux à tambour et de drapeaux de bataille."
 nd_kon_fortress_walls: "Fortifications de Mbanza"
 nd_kon_fortress_walls_desc: "Les villes clés et les positions stratégiques reçoivent des fortifications défensives, combinant la construction de palissades indigènes avec des techniques apprises du génie militaire européen."
 nd_kon_syncretic_faith: "Foi syncrétique"
 nd_kon_syncretic_faith_desc: "La pratique kongolais du christianisme incorpore des éléments de croyance traditionnelle, créant une culture religieuse distinctive qui reconnaît à la fois la croix et le nkisi. Cette synthèse renforce la cohésion sociale au sein de diverses communautés."
 nd_kon_lucanzos_tradition: "Lucanzos"
 nd_kon_lucanzos_tradition_desc: "Des détachements spéciaux appelés lucanzos sont entraînés aux raids, aux embuscades et à la guerre non conventionnelle. Ces troupes d’élite opèrent de manière indépendante, frappant là où l’ennemi est le plus faible et se retirant avant un engagement décisif."
 nd_kon_long_distance_trade: "Commerce à longue distance"
 nd_kon_long_distance_trade_desc: "Les marchands kongolais étendent leurs réseaux profondément à l’intérieur du pays, échangeant du tissu, du cuivre, du sel et de l’ivoire le long des routes qui relient la côte atlantique au cœur de l’Afrique centrale."
 nd_kon_antonine_movement: "Le mouvement antonin"
 nd_kon_antonine_movement_desc: "Le mouvement antonin de Dona Beatriz Kimpa Vita proclame un christianisme distinctement kongolais, enseignant que les figures sacrées de la foi étaient kongolaises. Même si sa prophétesse est martyrisée, le message de fierté culturelle du mouvement perdure."
 nd_kon_civil_war_resilience: "Résilience à la guerre civile"
 nd_kon_civil_war_resilience_desc: "Le royaume endure cinquante ans de guerre civile dévastatrice suite à la bataille de Mbwila. Même si elle est battue, l'idée du Kongo en tant que royaume unifié ne meurt jamais, et la résilience du peuple lui permet de traverser les années les plus sombres."
 nd_kon_restored_kingdom: "Royaume restauré"
 nd_kon_restored_kingdom_desc: "Après des décennies de fragmentation, le royaume est progressivement réunifié sous une autorité royale renouvelée. Les provinces reconnaissent à nouveau un Manikongo central et l'appareil de gouvernance est reconstruit."
 nd_kon_coastal_defense: "Défense côtière"
 nd_kon_coastal_defense_desc: "Alors que les puissances européennes deviennent plus agressives le long de la côte, le Kongo fortifie ses frontières et ses positions stratégiques, faisant de toute invasion une proposition coûteuse pour les conquérants potentiels."
 nd_kon_ivory_export: "Exportation d'ivoire"
 nd_kon_ivory_export_desc: "Ivory becomes one of the kingdom's most lucrative exports, processed and traded to European merchants who prize the material for luxury goods. The trade enriches the kingdom's coffers and sustains its economy."
 nd_kon_national_identity: "Identité Congolaise"
 nd_kon_national_identity_desc: "À une époque de changement révolutionnaire, le peuple du Kongo réaffirme son héritage culturel unique : les arts textiles, les traditions du fer, les langues des tambours et les systèmes de gouvernance qui définissent leur civilisation."
 nd_kon_modern_army: "Armée moderne"
 nd_kon_modern_army_desc: "L'armée kongolaise adopte des méthodes de formation, des tactiques et une organisation modernes, créant ainsi une force professionnelle capable de défendre la souveraineté du royaume dans un monde en évolution."
 nd_kon_independence_spirit: "Esprit d'indépendance"
 nd_kon_independence_spirit_desc: "Alors que les pressions coloniales s'accentuent à travers l'Afrique, les Kongolais s'appuient sur des siècles de fière souveraineté pour résister à la domination étrangère, préservant ainsi l'indépendance et l'intégrité territoriale du royaume."
 nd_kon_palm_oil_economy: "Économie de l’huile de palme"
 nd_kon_palm_oil_economy_desc: "The transition to palm oil as a major export commodity diversifies the kingdom's economy, providing a sustainable revenue source as traditional trade patterns shift in the industrial age."
 a_nd_kon_shield_warriors: "Guerriers Boucliers"
 a_nd_kon_shield_warriors_desc: "Infanterie lourde kongolaise armée de grands boucliers et d'épées. Ces troupes disciplinées constituent l’épine dorsale défensive de l’armée, absorbant les salves ennemies avant de se lancer dans un combat au corps à corps décisif."
 a_nd_kon_pombo_scouts: "Éclaireurs de Pombo"
 a_nd_kon_pombo_scouts_desc: "Troupes de poursuite d'élite entraînées pour suivre le rythme des cavaliers à pied. Les pombos servent d'éclaireurs, de tirailleurs et de poursuivants, utilisant leur vitesse exceptionnelle et leur connaissance du terrain pour déjouer l'ennemi."
 a_nd_kon_musket_regiment: "Régiment de Mousquets Kongolais"
 a_nd_kon_musket_regiment_desc: "Troupes de mousquetaires organisées combinant les armes à feu européennes avec la discipline tactique congolaise. Au XVIIe siècle, le Kongo envoya des centaines de mousquetaires entraînés aux côtés des forces traditionnelles."
 a_nd_kon_lucanzos: "Lucanzos"
 a_nd_kon_lucanzos_desc: "Troupes de détachement spéciales entraînées aux raids, aux embuscades et à la guerre non conventionnelle. Les Lucanzos frappent rapidement et disparaissent, perturbant les lignes de ravitaillement ennemies et semant la confusion en territoire hostile."
 a_nd_kon_modern_infantry: "Infanterie Congolaise Moderne"
 a_nd_kon_modern_infantry_desc: "Infanterie kongolaise professionnellement formée, équipée d'armes et de tactiques modernes, représentant l'adaptation du royaume aux réalités militaires de l'ère industrielle."
 nd_kon_iron_forge: "Forge de fer"
 nd_kon_iron_forge_desc: "Une forge traditionnelle kongolaise où les maîtres forgerons produisent des armes, des outils et les symboles en fer de l'autorité royale. La forge est à la fois atelier et espace sacré."
 nd_kon_nzo_a_nkisi: "Nzo à Nkisi"
 nd_kon_nzo_a_nkisi_desc: "Une maison spirituelle traditionnelle kongolais contenant des nkisi : des objets sacrés censés canaliser le pouvoir spirituel. Ces sanctuaires servent de centres de vie communautaire et de renforcement de l'autorité locale."
 nd_kon_stone_church: "Église en pierre"
 nd_kon_stone_church_desc: "Une église construite dans le style mis au point par Afonso Ier, mêlant la maçonnerie en pierre européenne aux sensibilités architecturales kongolaises. Ces bâtiments sont à la fois des lieux de culte et des symboles de l’engagement du royaume envers le reste du monde."
 nd_kon_cloth_market: "Marché aux tissus"
 nd_kon_cloth_market_desc: "Un marché dédié au commerce du tissu de raphia, où la monnaie libongo change de mains et où les marchands de tout le royaume se rassemblent pour échanger des marchandises."
 nd_kon_mestre_school: "School of the Mestres"
 nd_kon_mestre_school_desc: "A school in the manner of the royal school at Mbanza Kongo, where lay teachers of noble birth, the mestres, teach the sons of the nobility to read and write Portuguese and Latin and to keep the faith in their home provinces."
 nd_kon_jesuit_college: "Collège des Jésuites"
 nd_kon_jesuit_college_desc: "Un établissement d'enseignement créé par des missionnaires jésuites, enseignant l'alphabétisation, la théologie et les sciences européennes aux fils de la noblesse kongolaise."
 nd_kon_mbanza_fortress: "Forteresse de Mbanza"
 nd_kon_mbanza_fortress_desc: "Une fortification défensive combinant la construction de palissades indigènes avec l'ingénierie militaire européenne, protégeant les villes clés et les positions stratégiques du royaume."
 nd_kon_antonine_shrine: "Sanctuaire d'Antonin"
 nd_kon_antonine_shrine_desc: "Un lieu de culte dédié à la tradition antonine, où sont conservés et célébrés les enseignements de Kimpa Vita, selon lesquels les figures sacrées du christianisme étaient kongolaises."
 nd_kon_palm_oil_press: "Presse à huile de palme"
 nd_kon_palm_oil_press_desc: "Une installation de transformation des fruits du palmier en huile destinée à l'exportation, représentant l'adaptation économique du royaume aux nouvelles tendances du commerce mondial."
 nd_kon_raffia_looms: "Mpusu Looms"
 nd_kon_raffia_looms_desc: "Upright looms on which the leaf fibre of the raffia palm is woven into mpusu, the patterned cloth of Kongo. Portuguese visitors set the best of it beside velvet and damask. Bundles of it pass as money across the kingdom."
 nd_kon_ivory_carvers: "Ivory Carvers"
 nd_kon_ivory_carvers_desc: "Workshops where tusks from the interior are cut into horns, bracelets and lidded boxes, carved with the same interlace as the raffia cloths. Horns of this work were given to the courts of Europe and kept by the Medici."
 nd_kon_raffia_cloth_production: "Raffia Velvets"
 nd_kon_raffia_cloth_production_desc: "Raffia fibre is woven, cut into pile, embroidered and dyed. The finished cloths are traded as fine cloth and counted out as libongo, the cloth money of the kingdom."
 nd_kon_copper_working: "Travail du cuivre"
 nd_kon_copper_working_desc: "Le cuivre régional est transformé en bijoux ornementaux, en bracelets et en produits commerciaux appréciés dans toute l'Afrique centrale."
 nd_kon_ivory_processing: "Ivory Carving"
 nd_kon_ivory_processing_desc: "Ivory from the interior is worked with tools into finished pieces prized at court and in the Atlantic trade."
 nd_kon_forge_maintenance: "Production de forges"
 nd_kon_forge_maintenance_desc: "Les forgerons kongolais transforment le fer et le charbon de bois en outils, en armes et en fer, symboles de l'autorité royale."
 nd_kon_shrine_offerings: "Offrandes au sanctuaire"
 nd_kon_shrine_offerings_desc: "Offrandes rituelles de poterie, de tissu et de cire d'abeille pour maintenir le pouvoir spirituel du nkisi et soutenir la communauté rassemblée autour du sanctuaire."
 nd_kon_church_maintenance: "Entretien de l'église"
 nd_kon_church_maintenance_desc: "L'entretien des églises en pierre nécessite de la pierre pour les réparations, du bois pour les échafaudages et le mobilier, ainsi que des outils pour les maçons travaillant dans le style kongo-européen."
 nd_kon_cloth_market_operation: "Opérations de marché"
 nd_kon_cloth_market_operation_desc: "Les opérations quotidiennes du marché aux draps, y compris le stockage du tissu de raphia teint pour le commerce."
 nd_kon_mestre_school_upkeep: "Mestres' Lessons"
 nd_kon_mestre_school_upkeep_desc: "Paper for the copybooks, cloth for the mestres' stipends, and wax for the lessons that run past dusk."
 nd_kon_college_upkeep: "Entretien du collège"
 nd_kon_college_upkeep_desc: "Papier, livres et autres matériels nécessaires au maintien des programmes éducatifs du collège jésuite."
 nd_kon_fortress_garrison: "Garnison de la forteresse"
 nd_kon_fortress_garrison_desc: "Les armes, les matériaux de construction et l'équipement en cuir nécessaires pour armer et entretenir la garnison de la forteresse."
 nd_kon_antonine_offerings: "Dévotions antonines"
 nd_kon_antonine_offerings_desc: "Encens et tissus utilisés dans les pratiques cultuelles distinctives du mouvement antonin, remplissant le sanctuaire du parfum de la dévotion et des couleurs de la foi kongolaise."
 nd_kon_oil_processing: "Traitement du pétrole"
 nd_kon_oil_processing_desc: "Les fruits du palmier sont pressés au feu de bois et transformés en huile utilisée pour la cuisine, le savon et les médicaments : un produit polyvalent prisé dans le commerce régional et atlantique."
 levy_nd_kon_shield_warriors: "Prélèvement du guerrier bouclier"
 levy_nd_kon_shield_warriors_desc: "Infanterie lourde issue des provinces, armée de grands boucliers et d'épées dans la tradition kongolais."
 levy_nd_kon_lucanzos: "Lucanzos Lévy"
 levy_nd_kon_lucanzos_desc: "Des détachements spéciaux formés pour les raids et la guerre non conventionnelle, composés des combattants les plus expérimentés du royaume."
 STATIC_MODIFIER_NAME_nd_kon_antonine_mobilization: "Mobilisation antonine"
 STATIC_MODIFIER_DESC_nd_kon_antonine_mobilization: "La ferveur du mouvement antonin se met au service du royaume, alors que les partisans de Kimpa Vita se rallient à la bannière du Manikongo avec le dévouement des fidèles."
 STATIC_MODIFIER_NAME_nd_kon_national_mobilization: "Mobilisation nationale"
 STATIC_MODIFIER_DESC_nd_kon_national_mobilization: "La fierté renouvelée du peuple kongolais se traduit par une préparation militaire, alors que les guerriers qui se battent pour leur héritage culturel se battent avec une détermination née d'une profonde identité."
 nd_kon_formed_tt: "Le Kongo a été formé"
 nd_kon_path_a_tt: "A choisi la diplomatie chrétienne du Kongo"
 nd_kon_path_b_tt: "Choisissez la force des ancêtres"
 nd_kon_destiny: "Le Royaume Réunifié"
 nd_kon_destiny_desc: "Les provinces éparses répondent une fois de plus à un seul Manikongo. Le royaume doit désormais choisir sa voie : vers l'extérieur, vers le monde extérieur, ou vers l'intérieur, vers la forge et les ancêtres."
 nd_kon_dest_embassy: "L'Ambassade à Rome"
 nd_kon_dest_embassy_desc: "Faire du Kongo un royaume chrétien reconnu en établissant des liens diplomatiques et institutionnels avec l’Europe. Adoptez le secteur bancaire et développez le commerce de l’ivoire pour financer cette ambition."
 nd_kon_dest_atlantic: "Le réseau commercial atlantique"
 nd_kon_dest_atlantic_desc: "Extend Kongolese control over the Atlantic coast by securing the island of Sao Tome and the port of Gabun, and by raising Mbanza Soyo, the kingdom's own harbour on the great river, into a town. A trade network will connect the interior to the world."
 nd_kon_dest_soyo_town_tt: "#bold Mbanza Soyo#! is ours and has grown into a town"
 nd_kon_dest_christendom: "Kongo et chrétienté"
 nd_kon_dest_christendom_desc: "Achieve the ultimate expression of Kongo's diplomatic vision: take Lisbon itself, master the new ocean routes, and prove that the Manikongo stands as an equal among the monarchs of Christendom."
 nd_kon_dest_interior: "Maître de l'Intérieur"
 nd_kon_dest_interior_desc: "Kongolese authority is pushed beyond the traditional six provinces into the Congo basin interior. The Teke are subdued, the Pool region is held at Boma, and iron forges are lit in three of the kingdom's towns to arm the advance."
 nd_kon_dest_lunda: "La marche Lunda"
 nd_kon_dest_lunda_desc: "The copper-rich heartland of the Lunda is entered. Mussumba, the Katanga region and Kazembe on the far side of the copper country are taken, and the wealth of the interior fuels the empire's ambitions."
 nd_kon_dest_heart: "Coeur de l'Afrique"
 nd_kon_dest_heart_desc: "The entire Congo basin is commanded, from the cataracts of Nyangwe to the northern reaches at Bangui. Mbanza Kongo stands as a city at its centre and iron forges burn in ten towns: the greatest empire Central Africa has ever seen."
 nd_kon_dest_mbanza_kongo_city_tt: "#bold Mbanza Kongo#! is ours and has grown into a city"
 nd_kon_dest_three_forges_tt: "An #bold Iron Forge#! stands in at least #bold 3#! of our locations"
 nd_kon_dest_ten_forges_tt: "An #bold Iron Forge#! stands in at least #bold 10#! of our locations"
 nd_kon.4.t: "Le Royaume restauré"
 nd_kon.4.d: "Les tambours résonnent de Mbanza Kongo jusqu'aux provinces les plus lointaines. Le Manikongo est assis sur un trône qui n'a jamais été vraiment perdu, seulement contesté. Aujourd’hui, le royaume est à nouveau uni, prêt à écrire le prochain chapitre de sa longue histoire."
 nd_kon.4.a: "Que les tambours portent notre triomphe."
 nd_kon.5.t: "Envoyés à travers la mer"
 nd_kon.5.d: "Les ambassadeurs kongolais ont été reçus dans les cours d'Europe, présentant en cadeau de l'ivoire et du fin tissu de raphia. Les spécialistes de Mbanza Kongo étudient désormais les systèmes et institutions bancaires de l’Occident, adaptant ce qui sert le royaume et écartant ce qui ne sert pas. Le Manikongo est reconnu comme un souverain parmi les souverains."
 nd_kon.5.a: "Notre voix est entendue dans les couloirs du pouvoir."
 nd_kon.6.t: "Maîtres de la côte atlantique"
 nd_kon.6.d: "Les navires et marchands kongolais dominent désormais les routes commerciales de Sao Tomé à la côte gabonaise. L'ivoire, le cuivre et les tissus fins s'écoulent vers l'extérieur tandis que les biens, les connaissances et les devises européennes entrent. La question maintenant est de savoir comment utiliser cette richesse : construire une flotte marchande qui rivalise avec toutes celles de l'Atlantique, ou investir dans les écoles et les institutions qui assureront l'avenir du royaume pour des générations."
 nd_kon.6.a: "Construisez la flotte et remplissez-la d'ivoire."
 nd_kon.6.b: "Investissez dans les écoles et les institutions."
 nd_kon.7.t: "Le Manikongo à Lisbonne"
 nd_kon.7.d: "Ce qui était autrefois impensable est désormais réalité : la bannière du Kongo flotte sur Lisbonne même, et l'ambassadeur du Manikongo parcourt les couloirs du Vatican sur un pied d'égalité. Le royaume que les Portugais pensaient autrefois protéger a dépassé ses futurs tuteurs. La question est maintenant de savoir s’il faut formaliser cette nouvelle position par la reconnaissance papale et le prestige diplomatique, ou s’il faut l’utiliser comme fondement d’un empire commercial qui s’étend au-delà de l’Atlantique."
 nd_kon.7.a: "Recherchez la reconnaissance formelle du Pape."
 nd_kon.7.b: "Nos marchands deviendront princes."
 nd_kon.8.t: "Au-delà des six provinces"
 nd_kon.8.d: "Les armées du Manikongo ont franchi les frontières des six provinces traditionnelles et planté l'étendard du royaume sur les terres des Téké et des peuples de la région du Pool du grand fleuve. L'intérieur s'ouvre devant nous et les richesses du bassin du Congo sont à notre portée."
 nd_kon.8.a: "La forge demande plus de fer."
 nd_kon.9.t: "La richesse des Lunda"
 nd_kon.9.d: "La grande marche vers l’intérieur a atteint les terres cuivrées des Lunda. Mussumba, siège du Mwata Yamvo, est tombé aux mains des Kongolais, et les mines du Katanga alimentent désormais le trésor royal. Cette richesse peut être extraite en guise d'hommage pour alimenter une expansion ultérieure, ou les vétérans qui l'ont conquise peuvent être honorés et retenus en tant que corps d'élite endurci par des années de campagne dans la jungle."
 nd_kon.9.a: "Extrayez l’hommage en cuivre."
 nd_kon.9.b: "Honorez nos vétérans de la jungle."
 nd_kon.10.t: "Empire du Congo"
 nd_kon.10.d: "Des cataractes de Nyangwe aux confins nord de Bangui, de la côte atlantique aux mines de cuivre de l'extrême intérieur : le Manikongo commande un empire qui s'étend au cœur de l'Afrique. Aucun royaume au sud du Sahara n’a jamais réuni un territoire aussi vaste sous un seul trône. La couronne de fer des fondeurs-forgerons repose désormais sur le front d'un véritable empereur. Comment cet empire sera-t-il gouverné : par l’autorité absolue du trône de fer, ou par le réseau de rivières qui relie ce vaste royaume ?"
 nd_kon.10.a: "Règle depuis le trône de fer."
 nd_kon.10.b: "Commandez les rivières, commandez le royaume."
 STATIC_MODIFIER_NAME_nd_kon_dest_ivory_fleet: "Flotte d'ivoire"
 STATIC_MODIFIER_DESC_nd_kon_dest_ivory_fleet: "Des navires marchands kongolais chargés d'ivoire, de cuivre et de raphia sillonnent les routes commerciales de l'Atlantique, enrichissant les coffres du royaume et étendant sa portée commerciale."
 STATIC_MODIFIER_NAME_nd_kon_dest_mission_schools: "Écoles missionnaires"
 STATIC_MODIFIER_DESC_nd_kon_dest_mission_schools: "Les écoles créées grâce à des partenariats avec des missionnaires européens diffusent l'alphabétisation et les connaissances institutionnelles dans les provinces du Kongo."
 STATIC_MODIFIER_NAME_nd_kon_dest_papal_recognition: "Reconnaissance papale"
 STATIC_MODIFIER_DESC_nd_kon_dest_papal_recognition: "Le pape a officiellement reconnu le Manikongo comme un monarque chrétien souverain, accordant au Kongo une position diplomatique qui impose le respect dans toute la chrétienté."
 STATIC_MODIFIER_NAME_nd_kon_dest_merchant_princes: "Princes marchands du Kongo"
 STATIC_MODIFIER_DESC_nd_kon_dest_merchant_princes: "L'élite marchande du Kongo a accédé à des positions d'influence énorme, ses réseaux commerciaux s'étendant sur l'Atlantique et générant des richesses qui remodèlent l'économie du royaume."
 STATIC_MODIFIER_NAME_nd_kon_dest_copper_tribute: "Hommage au cuivre"
 STATIC_MODIFIER_DESC_nd_kon_dest_copper_tribute: "Les territoires Lunda conquis paient un tribut en cuivre et autres métaux, enrichissant le trésor royal au détriment de la bonne volonté diplomatique avec les voisins."
 STATIC_MODIFIER_NAME_nd_kon_dest_jungle_veterans: "Vétérans de la jungle"
 STATIC_MODIFIER_DESC_nd_kon_dest_jungle_veterans: "Les vétérans des campagnes éprouvantes à travers les forêts du bassin du Congo sont devenus une force combattante d'élite, endurcie par des années de guerre dans la jungle et totalement fidèle aux Manikongo."
 STATIC_MODIFIER_NAME_nd_kon_dest_iron_throne: "Le trône de fer"
 STATIC_MODIFIER_DESC_nd_kon_dest_iron_throne: "The Manikongo rules as absolute emperor from the iron throne, the ancient symbol of the master smiths who founded the kingdom transformed into the seat of continental power. The electors of the great lineages are no longer asked, and they resent it."
 STATIC_MODIFIER_NAME_nd_kon_dest_river_kings: "Rois des rivières"
 STATIC_MODIFIER_DESC_nd_kon_dest_river_kings: "L'empire est gouverné par le réseau de rivières qui relient ses vastes territoires, avec des gouverneurs régionaux commandant les voies navigables qui servent d'autoroutes reliant le royaume entre eux."
 nd_kon_embassy_house: "Maison de l'Ambassade"
 nd_kon_embassy_house_desc: "Une grande résidence diplomatique où se rencontrent les envoyés kongolais et étrangers, combinant des éléments architecturaux européens avec le design kongolais. Elle sert à la fois d’ambassade et de vitrine culturelle."
 nd_kon_embassy_maintenance: "Opérations de l'ambassade"
 nd_kon_embassy_maintenance_desc: "L'entretien de la maison de l'ambassade nécessite du papier pour la correspondance, des tissus fins pour les cadeaux diplomatiques et des meubles pour recevoir des invités de marque."
 nd_kon_royal_forge: "Forge Royale"
 nd_kon_royal_forge_desc: "La forge suprême du Manikongo, où le fer et le cuivre les plus fins sont transformés en armes, insignes et outils de l'empire. Les maîtres forgerons accomplissent des rituels sacrés en façonnant les métaux qui symbolisent l'autorité royale."
 nd_kon_royal_forge_maintenance: "Opérations de la Forge Royale"
 nd_kon_royal_forge_maintenance_desc: "Les maîtres forgerons travaillent le fer et le cuivre avec le charbon de bois provenant des magasins de bois, forgeant des armes et les insignes en fer de l'autorité royale qui symbolisent le pouvoir kongolais."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_kon_bureaucracy_authority: "Offices of the Court of Mbanza Kongo"
 AUTO_MODIFIER_DESC_nd_kon_bureaucracy_authority: "The court of Mbanza Kongo has room for three institutions among the Mwene Provinces, the Kanda Council, the Nzimbu Royal Monopoly, the Royal Chancery and the São Salvador Confraternities."

 kon_mwene_provinces_bureaucracy: "Provinces de Mwene"
 kon_mwene_provinces_bureaucracy_desc: "Le Manikongo divise le royaume en six provinces (Soyo, Mpemba, Mbamba, Mpangu, Mbata et Nsundi) chacune gouvernée par un mani nommé et alterné au gré du trône. Les mani-gouverneurs détiennent des pouvoirs militaires, fiscaux et judiciaires délégués mais restent des agents salariés du roi. Le système a donné à Afonso I une portée administrative sans précédent dans le bassin du Congo; laissés sans maintien, les gouverneurs retranchés dans des tribunaux rivaux, comme Soyo le fit à partir de la fin du XVIIe siècle."

 kon_kanda_council_bureaucracy: "Conseil de Kanda"
 kon_kanda_council_bureaucracy_desc: "L'aristocratie mwisikongo était organisée en lignées matrilinéaires kanda dont les chefs supérieurs - parmi eux les Mwene Vunda, Mwene Mbata et Mwene Soyo - détenaient le droit d'élire chaque nouveau Manikongo. La succession kongolaise était élective, non strictement héréditaire, et le conseil liait le trône à ses grands clans. Lorsque le conseil se divisa lors de la bataille de Mbwila en 1665, le royaume s'effondra dans une guerre civile de quarante ans entre les prétendants de Kimpanzu et de Kinlaza."

 kon_nzimbu_monopoly_bureaucracy: "Monopole royal de Nzimbu"
 kon_nzimbu_monopoly_bureaucracy_desc: "Les nzimbu, petites coquilles d'escargots marins récoltées sous monopole royal dans l'île de la baie de Luanda, servaient de monnaie au royaume, calibrées et comptées dans des pots de dénomination fixe. Les Manikongo prélevaient une taxe d'entrée annuelle en nzimbu sur chaque mâle adulte et redistribuaient les coquilles sous forme de titres, de salaires et d'hommages. La prise de Luanda par les Portugais en 1576 et l'inondation du marché par les cauris brésiliens détruisirent le monopole en une génération."

 kon_royal_chancery_bureaucracy: "Chancellerie Royale de Mbanza Kongo"
 kon_royal_chancery_bureaucracy_desc: "Afonso I Mvemba a Nzinga (r.1509-1542) fonda une chancellerie alphabétisée permanente à Mbanza Kongo qui produisit plus de quatre cents lettres portugaises et latines adressées aux rois du Portugal, aux papes de Rome et aux gouverneurs provinciaux du Kongo. Composée de scribes kongolais formés aux missions et d'un petit corps de religieux portugais, la chancellerie archivait les traités, rédigeait les décrets royaux et soutenait les ambassades à Lisbonne. Sous le règne de Garcia II (1641-1661), elle négocia directement avec les Habsbourg hollandais et espagnols."

 kon_sao_salvador_confraternities_bureaucracy: "Alors les confréries salvadoriennes"
 kon_sao_salvador_confraternities_bureaucracy_desc: "Après l'élévation de la cathédrale de Mbanza Kongo au rang d'évêché en 1596, la capitale rebaptisée So Salvador a développé un réseau dense de confréries laïques catholiques - parmi elles le Saint-Esprit, Notre-Dame du Rosaire et Saint Antoine. Les confréries organisaient des processions, finançaient l'entretien de la cathédrale, rançonnaient les membres réduits en esclavage et organisaient des œuvres caritatives pour les pauvres des villes. Les nobles de Mwisikongo se disputaient les postes d'officiers, faisant des confréries une institution civique parallèle où le statut de membre importait autant que le rang de la lignée."
