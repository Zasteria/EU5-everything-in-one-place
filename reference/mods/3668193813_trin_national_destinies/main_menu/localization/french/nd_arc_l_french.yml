l_french:
 # === Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_arc_apostolic_sanctuary: "Sanctuaire Apostolique"
 STATIC_MODIFIER_DESC_nd_arc_apostolic_sanctuary: "Le royaume reste le bouclier apostolique. Le Catholicos de Sis préside sans union, la couronne hethumide défend l'ancienne théologie et le royaume se renforce de la cohésion d'une Église nationale indivise. Les tribunaux latins grognent ; le peuple se lève."
 STATIC_MODIFIER_NAME_nd_arc_latin_union: "Union Latine des Sis"
 STATIC_MODIFIER_DESC_nd_arc_latin_union: "Le Concile de Sis prête serment à Rome. Les marchands latins affluent à Ayas sous la croix de l'union, les maisons chevaleresques envoient leurs plus jeunes fils servir à la cour, et Chypre et les États croisés ouvrent leurs galères à la bannière cilicienne. Les monastères des Highlands murmurent contre cette trahison."
 STATIC_MODIFIER_NAME_nd_arc_levon_crown: "La couronne de Levon"
 STATIC_MODIFIER_DESC_nd_arc_levon_crown: "Le pape Célestin III et l'empereur Henri VI envoyèrent tous deux des couronnes à Tarse. Levon était un roi reconnu par le monde entier."
 STATIC_MODIFIER_NAME_nd_arc_genoese_partners: "Partenaires génois"
 STATIC_MODIFIER_DESC_nd_arc_genoese_partners: "La République de San Giorgio prend les entrepôts de Mopsuestia. Le fer, le bois et les épices du royaume circulent sous le lion de Gênes."
 STATIC_MODIFIER_NAME_nd_arc_venetian_partners: "Partenaires vénitiens"
 STATIC_MODIFIER_DESC_nd_arc_venetian_partners: "Venise signe à Ayas. Rien qu'en 1301, les galères transportaient quatre-vingt-dix mille ducats de commerce par le port."
 STATIC_MODIFIER_NAME_nd_arc_steppe_brotherhood: "Confrérie des steppes"
 STATIC_MODIFIER_DESC_nd_arc_steppe_brotherhood: "Hethum, je suis allé à Karakorum. L'alliance mongole-arménienne fait valoir ses arguments contre les Mamelouks ; le royaume chasse aux côtés de l'Ilkhanat."
 STATIC_MODIFIER_NAME_nd_arc_hedged_diplomacy: "Diplomatie couverte"
 STATIC_MODIFIER_DESC_nd_arc_hedged_diplomacy: "L’étreinte mongole est utile mais jamais digne de confiance. La couronne construit ses propres murs, répare ses propres ports et se souvient du départ de ses alliés."
 STATIC_MODIFIER_NAME_nd_arc_patriarchal_seat: "Siège patriarcal"
 STATIC_MODIFIER_DESC_nd_arc_patriarchal_seat: "Le Catholicos réside dans le royaume. Là où siège le patriarche se trouve le centre spirituel du monde arménien."
 STATIC_MODIFIER_NAME_nd_arc_royal_banneret: "Bannière royale"
 STATIC_MODIFIER_DESC_nd_arc_royal_banneret: "Chevaliers liés à la couronne, assermentés à la bannière Hethumid. Une armée chevaleresque permanente, payée par la bourse du roi, formée au commandement royal."
 STATIC_MODIFIER_NAME_nd_arc_frontier_orders: "Commandes de frontière"
 STATIC_MODIFIER_DESC_nd_arc_frontier_orders: "Ordres militaires croisés chargés des marches. Hospitaliers à Selefkia, Templiers à Bagras, Teutoniques à Harunia : une ceinture de fer contre les Mamelouks."
 STATIC_MODIFIER_NAME_nd_arc_island_kingdom: "Royaume insulaire"
 STATIC_MODIFIER_DESC_nd_arc_island_kingdom: "L'union des maisons Lusignan avec Chypre lie deux couronnes en un seul royaume méditerranéen. De Famagouste à Ayas, une flotte, une bannière, une maison royale."

 # === Formation Event ===
 nd_arc.1.t: "Le Conseil de Sis"
 nd_arc.1.d: "The crown of Sis is set; the kingdom holds. Yet the prelates have come to the citadel with a question that cannot be deferred. For two centuries the Apostolic Church has stood apart from Chalcedon and from Rome alike, the older theology preserved by mountains and martyrs. Now the Latins offer aid in exchange for union, the Crusaders speak of one obedience, the Italian merchants ask whose chapel they may use in Ayas. The highland clergy refuse: better the Mamluk than the Pope, better isolation than the loss of the kingdom's soul. The barons in Frankish surcoats answer them: better Cyprus than ruin, better the Pope than the desert. Two paths open before the Catholicate; both are the kingdom's life.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_arc.1.a: "Sanctuaire apostolique : gardez le royaume indivis dans la foi"
 nd_arc.1.b: "Union latine des Sis : ouvrir le royaume à la chrétienté croisée"

 # === DHE Events ===
 nd_arc.2.t: "La couronne à Tarse"
 nd_arc.2.d: "Le 6 janvier 1198, dans la cathédrale de Tarse, Lévon le Magnifique reçut des mains de l'archevêque de Mayence la couronne que l'empereur Henri VI lui avait envoyée, et d'un légat distinct la couronne que le pape Célestin III lui avait également envoyée. Il se tenait comme roi devant le monde latin et le monde grec ensemble ; le royaume qui n'était qu'une principauté arménienne devint un royaume de la chrétienté. La monnaie frappée à Sis portait son image couronnée, les chartes étaient scellées en cinq langues et les chroniques de trois églises enregistraient son accession. La lignée Hethumid qui suivit hérita d'un royaume reconnu par le monde."
 nd_arc.2.a: "Par la grâce de Dieu, un roi."

 nd_arc.3.t: "Les concessions italiennes"
 nd_arc.3.d: "Gênes et Venise plaident toutes deux leur cause auprès de Sis. Chaque république offre des franchises douanières, une coopération navale, des quartiers fortifiés ; chacun réclame de meilleurs entrepôts, des droits moindres, le droit de consul. Les traités de 1201, 1215 et 1245 sont ouverts à la chancellerie, prêts à être renouvelés sous le lion que la couronne préfère. Le royaume ne peut pas servir les deux républiques avec la même faveur. Le choix définira quelle flotte italienne considère le Levant comme sa mer."
 nd_arc.3.a: "A Gênes : les entrepôts de Mopsuestia"
 nd_arc.3.b: "Vers Venise : les galères d'Ayas"

 nd_arc.4.t: "L'ambassade au Karakorum"
 nd_arc.4.d: "En 1254, Hethum Ier chevaucha vers l'est à travers les terres mongoles jusqu'à la cour du Grand Khan Mngke. Il parcourut quatre mille milles et fut reçu en audience pendant cinquante jours. Il revint avec des promesses : que les églises chrétiennes des terres sous contrôle mongol seraient exonérées d'impôts, que la Cilicie et l'Ilkhanat feraient campagne ensemble contre les Mamelouks, et que Jérusalem pourrait un jour redevenir chrétienne. L'alliance mongole-arménienne, scellée par ce voyage, a façonné la stratégie du royaume pendant un siècle. La question est de savoir jusqu’où s’engager."
 nd_arc.4.a: "Presser l'alliance : tout miser sur la confrérie des steppes"
 nd_arc.4.b: "Utilisez l'alliance, mais n'en dépendez jamais"

 nd_arc.5.t: "Le catholicisme de Hromkla"
 nd_arc.5.d: "Lorsque les Seldjoukides fermèrent les hauts plateaux, le Catholicos de l'Église apostolique arménienne se retira vers l'ouest. Le siège fut transféré à Hromkla sur l'Euphrate, puis à Sis même. Là où siège le patriarche se trouve la capitale spirituelle du monde arménien ; et là où repose la couronne héthumide, réside désormais le patriarche. Des évêques d'Anatolie, de Cilicie et de la diaspora viennent à Sis pour confirmation. Le royaume n'est plus seulement un refuge pour l'Église : il est le siège de l'Église. Les pièces de monnaie des pèlerins remplissent les assiettes d'offrandes, les bibliothèques monastiques s'engraissent et la bénédiction du catholicisme légitime la couronne."
 nd_arc.5.a: "La couronne et la croix, dans une seule ville."

 nd_arc.6.t: "Les ordres chevaleresques de la couronne"
 nd_arc.6.d: "Sous les rois Lusignan, la culture chevaleresque d'Outremer se greffe formellement sur le système militaire hethumide. Des tournois sont proclamés à Sis, des hérauts enregistrent des armoiries et les ordres de la Croix de Cilicie et des Chevaliers de Saint Thaddée sont organisés. La question est de savoir s'il faut lier les ordres directement à la couronne comme une bannière royale, ou accorder des châteaux frontières aux ordres croisés établis et les laisser défendre les marches dans leur propre discipline. Les deux produisent des chevaliers ; la différence est qui les commande."
 nd_arc.6.a: "Banneret royal : chevaleries liées à la couronne"
 nd_arc.6.b: "Ordres de frontière : Hospitaliers et Templiers en marche"

 nd_arc.7.t: "La Concorde Chypriote"
 nd_arc.7.d: "Les Lusignan de Chypre et les Lusignan de Cilicie sont la même maison. Mariages, partages et successions entrelacent les couronnes ; avec le temps, la même bannière flotte au-dessus de Sis et de Famagouste. La Concorde officialise l'union : amirauté partagée, coutumes partagées, diplomatie partagée. Le royaume de Cilicie cesse d'être une péninsule sur une côte hostile ; il devient la moitié d’un royaume maritime dont l’autre moitié est une île-forteresse de la Méditerranée orientale. Le rêve que les Mamelouks ont brisé en 1375 est rétabli comme politique."
 nd_arc.7.a: "Une maison, une mer."

 # === Advances ===
 nd_arc_kingship_of_levon: "Royauté de Levon"
 nd_arc_kingship_of_levon_desc: "La couronne envoyée par l'empereur Henri VI et le pape Célestin III en 1198 fit de la principauté cilicienne un royaume reconnu par l'ensemble de la chrétienté. Le siège royal de Sis est devenu le cœur d’un État arménien internationalement légitime."
 nd_arc_cilician_knights: "Chevaliers ciliciens"
 nd_arc_cilician_knights_desc: "Culture chevaleresque franque greffée sur l'ancienne cavalerie arménienne aznavur. Bouclier de lance et de cerf-volant, tournoi et bataille façon tournoi, un hybride arménien-latin qui combattait aussi bien que n'importe quel cheval lourd croisé."
 nd_arc_mavragort_levy: "Montagne Mavragort"
 nd_arc_mavragort_levy_desc: "Les hauts plateaux ciliciens situés derrière la plaine côtière sont encore arméniens de souche et apostoliques de foi. C'est à partir d'eux que le royaume lève une infanterie robuste, adaptée au pays accidenté des cols du Taurus."
 nd_arc_pilgrim_crossroads: "Carrefour des pèlerins"
 nd_arc_pilgrim_crossroads_desc: "Monastère de Drazark, Tarse la ville de Saint Paul, la route de Jérusalem : le royaume se situe à la limite occidentale du monde arménien et à la limite orientale du monde latin. Les pèlerins traversent les deux sens et leurs offrandes construisent une culture."
 nd_arc_catholicate_of_sis: "Catholicat de Sis"
 nd_arc_catholicate_of_sis_desc: "Le siège patriarcal de l’Église apostolique arménienne est transféré en Cilicie. Là où siège le Catholicos se trouve le centre spirituel du monde arménien ; et à partir de 1293, ce siège est à Sis même."
 nd_arc_italian_concessions: "Concessions italiennes"
 nd_arc_italian_concessions_desc: "Les traités avec Pise, Gênes et Venise accordent aux marchands italiens des exonérations fiscales, des fondachi et une juridiction consulaire. Les recettes douanières du royaume gonflent ; rien qu'en 1301, les galères vénitiennes transportent quatre-vingt-dix mille ducats à travers Ayas."
 nd_arc_mongol_alliance: "Alliance mongole"
 nd_arc_mongol_alliance_desc: "Le voyage d'Hethum Ier au Karakorum en 1254 forge un axe stratégique avec les Mongols contre le sultanat mamelouk. Le royaume est devenu le flanc occidental de l'Ilkhanat pendant la guerre chrétienne."
 nd_arc_hethumid_constabulary: "Constabulaire Hethumide"
 nd_arc_hethumid_constabulary_desc: "Smbat le Connétable, frère du roi Héthum Ier, codifia le droit militaire du royaume dans ses Assises d'Antioche. Le corps de cavalerie royale était entraîné selon une seule discipline, responsable devant un seul commandement."
 nd_arc_korikos_galleys: "Galères Korikos"
 nd_arc_korikos_galleys_desc: "Le port fortifié de Korikos était à la fois un château et un arsenal royal. La flotte royale y hivernait, alimentant la doctrine navale du royaume, basée sur les galères."
 nd_arc_lusignan_chivalry: "Chevalerie Lusignan"
 nd_arc_lusignan_chivalry_desc: "Les rois Lusignan de la fin de la Cilicie ont importé dans son intégralité la haute culture chevaleresque d'Outremer : tournois, hérauts, ordres chevaleresques et une identité de croisade consciente à l'image de la chrétienté latine."
 nd_arc_smpadagirk: "Smpadagirk"
 nd_arc_smpadagirk_desc: "Le livre de droit de Smbat le Connétable, compilé en 1265 à partir de sources romaines, canoniques, franques et arméniennes. La première codification systématique du droit civil et pénal cilicien."
 nd_arc_silk_road_terminus: "Terminus de la Route de la Soie"
 nd_arc_silk_road_terminus_desc: "Les routes caravanières venant de la steppe et de la Chine se terminaient à Ayas. Marco Polo est entré en Asie par ce port ; l'embouchure ouest de la Route de la Soie était cilicienne."
 nd_arc_cypriot_concord: "Concorde chypriote"
 nd_arc_cypriot_concord_desc: "La maison Lusignan régnait à la fois sur Chypre et sur la Cilicie. Les mariages mixtes, les pactes de succession et l'amirauté partagée ont tissé les deux couronnes en un seul projet dynastique méditerranéen."
 nd_arc_order_commanderies: "Commanderies de commande"
 nd_arc_order_commanderies_desc: "Des fortifications hospitalières, templières et teutoniques parsemaient les marches ciliciennes. Les ordres détenaient Bagras, Trapessac, T'il Hamtun, Selefkia et Sarvandikar en coopération avec la couronne."
 nd_arc_crusader_galleon: "Galion croisé"
 nd_arc_crusader_galleon_desc: "Le navire de guerre lourd de classe galion adopté par les chantiers italiens et aragonais. Les constructeurs navals ciliciens, ayant accès au bois du Taurus et aux modèles italiens, ont produit des navires méditerranéens capables de naviguer dans l'océan."
 nd_arc_tax_farmer_nakharars: "Nakharars, fermier fiscal"
 nd_arc_tax_farmer_nakharars_desc: "La couronne hethumide liait les maisons nobles nakharar à l'administration fiscale royale. Des privilèges fiscaux étaient accordés en échange d'un serment de loyauté et d'un service militaire."
 nd_arc_apostolic_synodics: "Synodes apostoliques"
 nd_arc_apostolic_synodics_desc: "Les écoles apostoliques de Sis répondaient aux écoliers latins avec leur propre théologie systématique. Les collèges synodiques formaient le clergé à la patristique, au droit canonique et aux conflits avec Rome."
 nd_arc_levantine_thalassocracy: "Thalassocratie levantine"
 nd_arc_levantine_thalassocracy_desc: "Le royaume qui a survécu à 1375 en maîtrisant la mer réalise sa longue ambition : la Méditerranée orientale comme eau cilicienne, de Chypre à Antioche jusqu'à la route d'Alexandrie."
 nd_arc_constitutional_catholicosate: "Catholicossat constitutionnel"
 nd_arc_constitutional_catholicosate_desc: "Un conseil d'État où le patriarche de Sis siège avec le roi et la haute noblesse. Conscience et couronne dans une seule chambre, l'Église apostolique comme partenaire constitutionnelle."
 nd_arc_diaspora_networks: "Réseaux de la diaspora arménienne"
 nd_arc_diaspora_networks_desc: "Les maisons de marchands arméniens se sont répandues à travers l'Europe, l'Inde et la Perse sous le patronage de Sis. La couronne parraine des colonies commerciales, envoie des consuls et achemine les fonds vers le pays."
 nd_arc_mekhitarist_press: "Presse Mekhitariste"
 nd_arc_mekhitarist_press_desc: "La congrégation arménienne catholique Mekhitar de Sébaste, fusionnée avec les écoles apostoliques Sis, est à l'origine d'une révolution de l'imprimerie : dictionnaires, grammaires, traductions classiques et presse périodique nationale."
 nd_arc_industrial_combinats: "Combinats industriels ciliciens"
 nd_arc_industrial_combinats_desc: "Fer du Taureau, cuivre de l'Anti-Taureau, bois des pentes de cèdres et fournitures navales de la côte : des complexes industriels intégrés ancrent l'économie du défunt royaume."
 nd_arc_civic_order: "Ordre Civique Méditerranéen"
 nd_arc_civic_order_desc: "Une couronne constitutionnelle de Sis, où l'Église apostolique, la noblesse héréditaire, les bourgeois marchands et le cabinet royal partagent la gouvernance selon une loi civique codifiée."

 # === Buildings ===
 nd_arc_sis_citadel: "Citadelle de Sis"
 nd_arc_sis_citadel_desc: "Le siège royal Hethumid creusé dans les falaises au-dessus de Sis. Dans ses murs, le roi d'Arménie tenait sa cour, le Catholicos résidait et l'armée du royaume se rassemblait."
 nd_arc_drazark_monastery: "Monastère de Drazark"
 nd_arc_drazark_monastery_desc: "Le monastère royal hethumide au pied du Taurus, scriptorium et nécropole de la dynastie. Ses bibliothèques préservaient la mémoire littéraire du royaume."
 nd_arc_hromkla_catholicate: "Siège catholique"
 nd_arc_hromkla_catholicate_desc: "La résidence patriarcale de l'Église apostolique arménienne. Depuis Hromkla sur l'Euphrate et finalement à Sis même, le Catholicos gouvernait l'Église arménienne."
 nd_arc_ayas_customhouse: "Douane d'Ayas"
 nd_arc_ayas_customhouse_desc: "Le port fortifié d'Ayas était la richesse du royaume sous forme de pierre. Les galères italiennes, les caravanes mongoles et les navires de pèlerinage y ont tous payé leur dû."
 nd_arc_mopsuestia_emporium: "Magasin Mopsuestia"
 nd_arc_mopsuestia_emporium_desc: "L'entrepôt fluvial sur le Pyramus où les entrepôts génois recevaient du bois et du fer ciliciens, et où les caravanes de la Route de la Soie déposaient des épices et de la soie pour les expédier vers l'ouest."
 nd_arc_order_commandery: "Commanderie d'Ordre"
 nd_arc_order_commandery_desc: "Château frontière tenu par un ordre militaire. Les Hospitaliers, les Templiers et les Teutoniques obtinrent des points forts ciliciens en coopération avec la couronne."
 nd_arc_apostolic_seminary: "Séminaire Apostolique"
 nd_arc_apostolic_seminary_desc: "Les écoles de Sis où le clergé apostolique se formait à la théologie, au droit canonique et aux langues de dispute. La réponse intellectuelle du royaume aux universités latines."
 nd_arc_royal_arsenal: "Arsenal Royal"
 nd_arc_royal_arsenal_desc: "Les chantiers navals royaux et les fonderies d'armes. Le bois, le fer et la main d'œuvre ciliciens se sont combinés sous la gestion de la couronne pour produire une flotte capable de naviguer sur l'océan."
 nd_arc_taurus_combinat: "Taureau Combiné"
 nd_arc_taurus_combinat_desc: "Industrie lourde intégrée produisant du fer, du cuivre, des fournitures navales et de l'acier. Ancré sur les ressources minérales du Taureau et sur le bassin de main-d'œuvre croissant du royaume."

 # === Building Production Method Loc ===
 nd_arc_sis_citadel_upkeep: "Garnison de la Citadelle"
 nd_arc_sis_citadel_upkeep_desc: "Pierre, maçonnerie, armes et outils pour entretenir la forteresse royale."
 nd_arc_drazark_upkeep: "Entretien monastique"
 nd_arc_drazark_upkeep_desc: "Cire d'abeille pour les bougies, papier pour les scriptoria, livres pour la bibliothèque et encens pour la liturgie."
 nd_arc_hromkla_upkeep: "Maison patriarcale"
 nd_arc_hromkla_upkeep_desc: "L'approvisionnement de la résidence du Catholicos : cire d'abeille, papier, livres et encens."
 nd_arc_ayas_upkeep: "Fonctionnement des douanes"
 nd_arc_ayas_upkeep_desc: "Magasins navals pour le port, papier pour les registres, tissus pour les douaniers et outils pour les quais."
 nd_arc_cilician_workshop: "Atelier cilicien"
 nd_arc_cilician_workshop_desc: "Les manufactures sous licence italienne sur le fleuve Pyramus : des facteurs génois transformant le fer cilicien et le bois de Taurus en fournitures navales de qualité chantier naval, et des tisserands génois filant la soie grège de la Route de la Soie en tissus fins pour les marchés méditerranéens. Là où Mopsuestia est le registre des douanes, l'atelier est le métier à tisser et la fonderie."
 nd_arc_mopsuestia_upkeep: "Douanes et grand livre"
 nd_arc_mopsuestia_upkeep_desc: "Papier pour les registres des contrats génois-ciliciens, tissu pour les chambres du consul, cire d'abeille pour les presses à sceaux et outils pour les quais."
 nd_arc_export_pm: "Exportation de fer et de bois"
 nd_arc_export_pm_desc: "Le fer cilicien des mines de Taurus et le bois des pentes de cèdres étaient transformés en fournitures navales de qualité chantier naval. Les facteurs italiens achètent la production des chantiers égyptiens et égéens."
 nd_arc_silk_caravan_pm: "Commerce des caravanes de soie"
 nd_arc_silk_caravan_pm_desc: "La soie grège et les colorants de la Route de la Soie reçus dans les entrepôts de Pyramus et transformés en tissus fins sur des métiers à tisser sous licence italienne avant d'être expédiés à Gênes, Venise et les ports tyrrhéniens."
 nd_arc_commandery_upkeep: "Service de Commanderie"
 nd_arc_commandery_upkeep_desc: "Pierre et maçonnerie pour les réparations, armes pour les frères et cire d'abeille pour la chapelle."
 nd_arc_seminary_upkeep: "Bibliothèque du séminaire"
 nd_arc_seminary_upkeep_desc: "Papier, livres, cire d'abeille et tissu : les matériaux de travail d'une école apostolique."
 nd_arc_arsenal_upkeep: "Opération Arsenal"
 nd_arc_arsenal_upkeep_desc: "Bois de construction, fournitures navales, outils et canons : les matériaux d'un chantier naval d'État."
 nd_arc_combinat_steel_pm: "Aciéries Combinat"
 nd_arc_combinat_steel_pm_desc: "Fer, charbon et outils combinés dans des fours intégrés pour produire de l'acier industriel."

 # === Units ===
 a_nd_arc_cilician_knights: "Chevaliers ciliciens"
 a_nd_arc_cilician_knights_desc: "Cavalerie lourde de souche arménienne aznavur armée et entraînée à la manière franque. La lance, le bouclier cerf-volant, la monture dressée en tournoi : l'élite du royaume."
 a_nd_arc_mavragort: "Montagne Mavragort"
 a_nd_arc_mavragort_desc: "L'infanterie arménienne des hautes terres des cols du Taurus, levée pour escarmoucher dans les pays accidentés et tendre des embuscades dans les défilés."
 a_nd_arc_cilician_lancers: "Lanciers ciliciens"
 a_nd_arc_cilician_lancers_desc: "Le corps royal de cavalerie de la maréchaussée Hethumid. Smbat le manuel d'exercices du connétable, la livrée du roi et la discipline d'une force chevaleresque permanente."
 a_nd_arc_lusignan_knights: "Chevaliers Lusignan"
 a_nd_arc_lusignan_knights_desc: "Le corps chevaleresque complet du défunt royaume sous le règne des Lusignan : annoncé, ordonné, payé par la couronne et aussi compétent que n'importe quel autre en Outremer."
 n_nd_arc_royal_galley: "Galère royale"
 n_nd_arc_royal_galley_desc: "Le navire de guerre de classe galère de la flotte royale du royaume, stationné à Korikos. Léger, rapide et adapté au Levant : le cheval de bataille de la puissance maritime cilicienne."
 n_nd_arc_crusader_galleon: "Galion croisé"
 n_nd_arc_crusader_galleon_desc: "Le galion lourd adapté des modèles italiens et aragonais, construit dans les chantiers ciliciens à partir de bois de Taurus. Le premier navire de guerre à capacité océanique du royaume."

 # === Levies ===
 levy_nd_arc_cilician_knights: "Prélèvement des chevaliers ciliciens"
 levy_nd_arc_cilician_knights_desc: "La cavalerie lourde des maisons nobles de Nakharar, convoquée sous la bannière royale."
 levy_nd_arc_mavragort: "Prélèvement de Mavragort"
 levy_nd_arc_mavragort_desc: "Infanterie des Highlands issue de la paysannerie apostolique du Taureau."

 nd_arc_pyramus_warehouses: "Entrepôts Pyramus"
 nd_arc_pyramus_warehouses_desc: "Les entrepôts sous licence génoise sur les quais du fleuve Pyramus à Mopsuestia. Le fer, le bois et la soie du royaume passaient par leur comptabilité dans les grands livres génois, et la fortune des Ciliciens augmentait avec le commerce italien qui les traversait."
 nd_arc_royal_admiralty: "Amirauté royale de Sis"
 nd_arc_royal_admiralty_desc: "Le chantier naval d’État, la fonderie d’armes et la bureaucratie navale sont sous la direction directe de la couronne. Le bois, le fer, le travail et la tradition cilicienne de la construction navale italienne se sont combinés pour former une flotte capable de conquérir la Méditerranée orientale."
 nd_arc_formed_tt: "Formation de l'Arménie cilicienne"
 nd_arc_path_a_tt: "Voie du Sanctuaire apostolique choisie"
 nd_arc_path_b_tt: "Voie choisie pour l’Union latine"
 nd_arc_dest_sis_developed_tt: "We own #bold Sis#! and its development is at least #bold 30#!"
 nd_arc_dest_ayas_developed_tt: "We own #bold Ayas#! and its development is at least #bold 40#!"
 nd_arc_levantine_free_port: "Port franc levantin"
 nd_arc_levantine_free_port_desc: "La libéralisation des douanes à la fin de l'Empire à Ayas, Famagouste et dans les ports secondaires. Les marchands italiens et du Nord entrent à égalité ; La navigation cilicienne rivalise par la qualité et non par le tarif."

 # === Destiny Tree ===
 nd_arc_destiny: "Le long horizon de Sis"
 nd_arc_destiny_desc: "La couronne est posée, la question de l'Église est résolue. Le royaume doit désormais choisir le type d’État qu’il entend devenir au cours des siècles à venir."
 nd_arc_dest_levant_vanguard: "Avant-garde du Levant"
 nd_arc_dest_levant_vanguard_desc: "Récupérez Jérusalem et Edessa. La première restauration des États chrétiens de l’ère des Croisés doit venir de Cilicie, sinon elle ne viendra pas du tout."
 nd_arc_dest_liberation_sees: "Libération des sièges"
 nd_arc_dest_liberation_sees_desc: "Bring Aleppo and Damascus under Cilician arms. The patriarchates of the eastern Christian world must answer to the Apostolic crown of Sis, and Sis itself must be built up into a seat worthy of the Catholicate."
 nd_arc_dest_apostolic_imperium: "Empire apostolique"
 nd_arc_dest_apostolic_imperium_desc: "Acre, la dernière capitale des Croisés. Mossoul, le siège oriental. Le royaume achève son héritage : l'Orient chrétien rassemblé sous une seule bannière, avec une armée et un trésor pour le tenir."
 nd_arc_dest_cilician_reach: "Portée cilicienne"
 nd_arc_dest_cilician_reach_desc: "Antalya et Rhodes sécurisés, le secteur bancaire adopté. Le royaume projette ses marchands et ses galères au-delà de sa propre côte et dans le sud de la mer Égée."
 nd_arc_dest_aegean_condominium: "Condominium égéen"
 nd_arc_dest_aegean_condominium_desc: "La Crète et Modon répondent à Sis. Le royaume partage la Méditerranée orientale sans rival ; ses galères hivernent où bon leur semble."
 nd_arc_dest_mediterranean_apex: "Sommet méditerranéen"
 nd_arc_dest_mediterranean_apex_desc: "Alexandria's road and Smyrna's wealth pay their dues at Sis. The eastern sea is a Cilician lake; the kingdom is the bourse of three continents, and the port of Ayas has grown to carry their trade."

 # === Destiny Path Variable Tooltips ===
 # (formed_tt and path_x_tt already defined above)

 # === Destiny Events ===
 nd_arc.8.t: "Le long horizon"
 nd_arc.8.d: "La chancellerie a produit un mémorandum. Une fois la question de l'Église réglée, le concile regarde vers l'avenir : non pas vers la prochaine campagne ou la prochaine récolte, mais vers la forme que prendra le royaume dans un siècle. Terre ou mer, restauration ou projection, chrétien oriental ou cosmopolite méditerranéen. Le choix n’est plus entre les options ; c'est entre les futurs."
 nd_arc.8.a: "Fixez le cap du royaume."

 nd_arc.9.t: "Edessa et Jérusalem récupérées"
 nd_arc.9.d: "La bannière de la couronne apostolique flotte au-dessus d'Édesse, la ville perdue par Baudouin en 1144, et au-dessus de Jérusalem, perdue en 1187. Ce que deux siècles d'efforts croisés n'ont pas réussi à restaurer, le royaume cilicien l'a maintenant restauré. Le Catholicos bénit les nouveaux sièges, les chroniques de trois églises consignent les noms des capitaines du roi et une génération de pèlerins arméniens voit ses villes les plus saintes sous sa propre couronne."
 nd_arc.9.a: "Le Saint-Sépulcre se tient sous notre croix."

 nd_arc.10.t: "Alep et Damas"
 nd_arc.10.d: "Alep, la grande capitale commerciale de la Syrie. Damas, la ville omeyyade aux soixante-dix mosquées et patriarcat des orthodoxes orientaux. Les deux villes sont tombées aux armes ciliciennes ; les deux doivent maintenant être gouvernés. La chancellerie présente deux mémorandums. Les maréchaux proposent d'utiliser les villes capturées comme points de départ pour une guerre ultérieure : le butin, les recrues et l'élan peuvent porter la bannière jusqu'en Égypte. Le Catholicos et son synode proposent le contraire : les sièges chrétiens d'Orient ont été récupérés, et la réconciliation sous l'obéissance apostolique doit précéder toute nouvelle conquête. Le choix définira la prochaine génération."
 nd_arc.10.a: "Une charte de conquérant : appuyez sur l'avantage."
 nd_arc.10.b: "Une réconciliation des sièges : guérissez d’abord l’Église."

 nd_arc.11.t: "L'Empire apostolique"
 nd_arc.11.d: "Acre, où périt le croisé Outremer en 1291, arbore la croix de Cilicie. Mossoul, où l'Église d'Orient était patriarcale, répond au Catholicos de Sis. L’armée a fait ce qu’aucun croisé, aucun mongol et aucun byzantin n’a jamais fait : rassembler l’Orient chrétien sous une seule couronne. Le tribunal doit maintenant décider quel est l'imperium. Un royaume militant dont les levées se rassemblent selon des principes chrétiens et dont les sermons s'adressent à Jérusalem ? Ou un héritage administré dont la première tâche est d'assimiler les vaincus et de les gouverner en Ciliciens ?"
 nd_arc.11.a: "Une Jérusalem arménienne : un imperium chrétien militant."
 nd_arc.11.b: "Un héritage apostolique : gouverner, ne pas parader."

 nd_arc.12.t: "Antalya et Rhodes"
 nd_arc.12.d: "La côte sud de l'Anatolie et la grande île-forteresse de Rhodes sont entrées dans la sphère cilicienne. Les fondachi arborent des bannières ciliciennes aux côtés des Italiens ; les Hospitaliers, là où ils séjournent, tiennent leurs commanderies en vassaux du royaume. La banque est arrivée à Sis : les instruments de crédit italiens font désormais partie de chaque contrat de chancellerie. Le royaume n'est plus une péninsule levantine ; c'est une puissance maritime sur la rive occidentale de la Méditerranée orientale."
 nd_arc.12.a: "Les galères répondent à Sis."

 nd_arc.13.t: "Crète et Morée"
 nd_arc.13.d: "Candie, Modon et les ports de Morée ont été intégrés à la rotation d'hivernage de la flotte cilicienne. L'étendue du royaume s'étend désormais de Famagouste à la mer Ionienne. Deux républiques italiennes proposent de s'intégrer au système commercial du royaume. Gênes propose un contrat de facteur continental : des facteurs ciliciens-génois gérant le volume des échanges de Tabriz à Bruges. Venise propose une copropriété maritime : amirautés partagées, exploration partagée, drapeau du royaume porté au-delà des Piliers et dans l'Atlantique."
 nd_arc.13.a: "Un axe génois : volume des échanges commerciaux à travers les continents."
 nd_arc.13.b: "Un axe vénitien : une copropriété maritime au-delà de la mer intérieure."

 nd_arc.14.t: "Le sommet de la Méditerranée"
 nd_arc.14.d: "La route d'Alexandrie et les richesses de Smyrne sont entrées dans les mœurs du royaume. L'ancienne Méditerranée orientale, mer de trois continents, répond en pratique à un seul royaume : l'héritier de la Cilicie, l'héritier de Lusignan Chypre, le patron des républiques italiennes. La chancellerie présente deux visions de ce qu'il faut faire du sommet. Construisez la bourse de Sis : un véritable centre d'échange du Levant, la capitale financière de l'Est. Ou naviguez vers l'extérieur : portez le drapeau et le peuple du royaume à travers la Méditerranée occidentale et au-delà, la thalassocratie cosmopolite que la Cilicie a toujours voulu être."
 nd_arc.14.a: "Construire la Bourse : Sis comme capitale financière de l'Est."
 nd_arc.14.b: "Les Lions d'Arménie : thalassocratie cosmopolite."

 # === Destiny Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_arc_dest_conquerors_charter: "Une charte de conquérant"
 STATIC_MODIFIER_DESC_nd_arc_dest_conquerors_charter: "The captured patriarchates supply men, money, and momentum. The kingdom's hosts march again before the cities have cooled, and the spoils of two great conquests flood the Cilician treasury, and its prices."
 STATIC_MODIFIER_NAME_nd_arc_dest_reconciled_sees: "Réconciliation des sièges"
 STATIC_MODIFIER_DESC_nd_arc_dest_reconciled_sees: "Le catholicisme apostolique rassemble les patriarcats récupérés en une seule obédience. Les communautés hérétiques sont tolérées dans certaines limites, la théologie plus ancienne gagne en clarté et les habitants du royaume se lassent de la guerre qui les a amenés ici."
 STATIC_MODIFIER_NAME_nd_arc_dest_armenian_jerusalem: "Une Jérusalem arménienne"
 STATIC_MODIFIER_DESC_nd_arc_dest_armenian_jerusalem: "Le royaume se proclame protecteur de la Jérusalem chrétienne. Les prélèvements sont organisés par principe, les sujets païens sont tolérés sous l'ordre apostolique protecteur et la cour se développe en prodiguant sa propre légende."
 STATIC_MODIFIER_NAME_nd_arc_dest_apostolic_inheritance: "Héritage apostolique"
 STATIC_MODIFIER_DESC_nd_arc_dest_apostolic_inheritance: "Les vaincus sont assimilés, les hérités intégrés. Le royaume administre ce qu’il a gagné en tant qu’État unique, acceptant le gouvernement plus large que cela nécessite."
 STATIC_MODIFIER_NAME_nd_arc_dest_genoese_axis: "Axe génois"
 STATIC_MODIFIER_DESC_nd_arc_dest_genoese_axis: "Les facteurs ciliciens-génois gèrent le commerce terrestre du royaume de Tabriz à Bruges. Les centres commerciaux se multiplient. Les populations soumises aux facteurs italiens se plaignent du privilège des commis étrangers."
 STATIC_MODIFIER_NAME_nd_arc_dest_venetian_axis: "Axe vénitien"
 STATIC_MODIFIER_DESC_nd_arc_dest_venetian_axis: "Shared admiralties, shared explorers, shared yards. The fleet runs lean and sails far, but the army diminishes in expectation as the navy claims the crown's purse."
 STATIC_MODIFIER_NAME_nd_arc_dest_levantine_bourse_mod: "La Bourse de Sis"
 STATIC_MODIFIER_DESC_nd_arc_dest_levantine_bourse_mod: "Sis devient le centre d'échange de l'Est : les contrats sont réglés quotidiennement, la prospérité s'appuie sur un commerce lisible, les travaux publics augmentent dans chaque port. Les provinces riches, cependant, deviennent conscientes de leur richesse."
 STATIC_MODIFIER_NAME_nd_arc_dest_armenian_lions: "Les Lions d'Arménie"
 STATIC_MODIFIER_DESC_nd_arc_dest_armenian_lions: "Des équipages cosmopolites, des courts multilingues et une thalassocratie fière de son sang mêlé. Le royaume grandit en population et en cultures acceptées, même si ses rivaux lui refusent la paix facile."

 # === Destiny Buildings ===
 nd_arc_greater_catholicate: "Grand catholicisme"
 nd_arc_greater_catholicate_desc: "Le quartier général militaro-religieux de l’Orient chrétien restauré. Cathédrale, rassemblement chevaleresque et conseil de guerre sous un même toit à Sis : l'institution qui maintient l'unité de l'Imperium apostolique."
 nd_arc_levantine_bourse: "Bourse maritime levantine"
 nd_arc_levantine_bourse_desc: "La clairière de la Méditerranée orientale. Les facteurs italiens, arméniens, grecs et égyptiens concluent quotidiennement leurs contrats ici ; le drapeau et la monnaie du royaume sont acceptés au pair de Famagouste à Marseille."

 # === Destiny Building PMs ===
 nd_arc_greater_catholicate_upkeep: "Maison catholique"
 nd_arc_greater_catholicate_upkeep_desc: "De la cire d'abeille pour la liturgie perpétuelle, des livres pour la curie, de l'encens pour les cérémonies d'État et des armes pour les frères armés."
 nd_arc_bourse_upkeep: "Fonctionnement de la Bourse"
 nd_arc_bourse_upkeep_desc: "Papier pour les livres de comptes journaliers, toile fine pour les livrées des facteurs, toile pour les assistants et outils pour la presse des contrats."

 # === Bureaucracies ===
 arc_catholicate_of_sis_bureaucracy: "Catholicat de Sis"
 arc_catholicate_of_sis_bureaucracy_desc: "Siège patriarcal de l'Église apostolique arménienne, transféré de Hromkla à Sis en 1293 après que les Mamelouks eurent pillé l'ancien siège et résidant dans la capitale royale sous la protection des Hethumides. Le Catholicos a présidé le Synode de Sis, le conseil permanent des évêques, et a confirmé la théologie apostolique contre les ouvertures romaines successives de 1198, 1244, 1289 et 1307. De ses scriptoria sont issus les grands évangiles arméniens enluminés de Sis et de Drazark, et de ses tribunaux est né le droit canonique qui liait chaque communauté arménienne de la Crimée à la Perse. Là où se trouvait le Catholicos se trouvait le centre spirituel du monde arménien."
 arc_royal_chancery_bureaucracy: "Chancellerie royale de Sis"
 arc_royal_chancery_bureaucracy_desc: "Le bureau d'écriture des rois Hethumid, une adaptation consciente de la pratique de la chancellerie franque greffée sur la tradition royale arménienne. Lévon Ier scella ses chartes en cinq langues ; les assises d'Antioche furent traduites en arménien sous Smbat le connétable vers 1265 ; la monnaie royale portait des légendes latines, arméniennes et parfois arabes. La chancellerie servait d'interface diplomatique du royaume avec Rome, les empereurs byzantins, les khans mongols de Tabriz et les républiques italiennes, rédigeant les traités multilingues dont les clauses survivent dans les archives de Sis, de Gênes, de Venise et du Vatican."
 arc_italian_factors_court_bureaucracy: "Tribunal des facteurs italiens"
 arc_italian_factors_court_bureaucracy_desc: "Les juridictions consulaires détenues par les communautés marchandes génoises et vénitiennes d'Ayas et de Mopsuestia en vertu des traités de 1201, 1215 et 1245. Chaque république installait son propre consul, qui détenait la juridiction civile et commerciale sur les marchands de sa nation dans le royaume, gardait son propre sceau et répondait au Doge plutôt qu'au Catholicos ou au roi. Cet arrangement fut le prix de l'intégration méditerranéenne : les capitaux, les navires et le crédit italiens circulèrent à travers les ports ciliciens aux conditions fixées dans la loggia de San Giorgio et le Rialto, et la couronne héthumide eut accès au commerce à longue distance qu'aucun royaume oriental ne pourrait autrement toucher."
 arc_connetablie_bureaucracy: "Connectable du Royaume"
 arc_connetablie_bureaucracy_desc: "Le commandement militaire de style franc du royaume héthumide, adopté de la principauté croisée d'Antioche et formalisé sous les dynasties Rubenid et Hethumid. Le connétable (gundstabl) dirigeait l'armée féodale et la hiérarchie chevaleresque de soixante barons. Le frère d'Hethum Ier, Smbat le Connétable (1208-1276), traduisit les assises d'Antioche en arménien et codifia les obligations de chevalier sur le modèle latin - les barons du royaume devaient chacun un contingent fixe de cavalerie sous la bannière du connétable. Il s'agissait d'un prélèvement féodal de style latin sur le sol arménien, qui donnait au royaume une armée que les Mamelouks mettaient deux siècles à détruire."
 arc_customs_diwan_of_ayas_bureaucracy: "Diwan des douanes d'Ayas"
 arc_customs_diwan_of_ayas_bureaucracy_desc: "L'administration douanière du grand port du royaume sur le golfe d'Iskenderun, principal entrepôt méditerranéen de l'Arménie cilicienne et - après la prise d'Acre par les Mamelouks en 1291 - le principal port chrétien pour le commerce du Levant. Marco Polo a navigué depuis Ayas en 1271 ; La Pratica della Mercatura de Francesco Pegolotti, écrite vers 1340, énumère ses droits, devises et poids avec minutie. Les rois Héthumides accordaient des tarifs réduits aux républiques favorisées et versaient le reste dans le trésor royal, mais le coût du régime tombait sur les fellahins de l'intérieur dont le grain était taxé à la porte puis au port pour nourrir la ville marchande."

 # === Bureaucracy Authority ===
 AUTO_MODIFIER_NAME_nd_arc_bureaucracy_authority: "Chancellerie Hethumide"
 AUTO_MODIFIER_DESC_nd_arc_bureaucracy_authority: "The kingdom of Cilicia governs itself from the citadel of Sis through a permanent administrative apparatus: the royal chancery, the Catholicate's synod, the consular courts of the Italian factors, and the customs offices of Ayas. Three of the kingdom's institutions of state can be kept standing at once."
