l_french:
 STATIC_MODIFIER_NAME_nd_masters_of_the_monsoon: "Maîtres de la mousson"
 STATIC_MODIFIER_DESC_nd_masters_of_the_monsoon: "Le destin de Kilwa repose sur les vagues. Les vents de mousson qui transportent les boutres entre l’Afrique, l’Arabie et l’Inde sont l’élément vital de notre empire. Maîtrisons ces vents, étendons nos flottes marchandes dans tous les ports de l’océan Indien et faisons de nos ports le lien indispensable du commerce mondial."
 STATIC_MODIFIER_NAME_nd_jewel_of_the_swahili_coast: "Joyau de la côte swahili"
 STATIC_MODIFIER_DESC_nd_jewel_of_the_swahili_coast: "Kilwa sera la merveille des mers orientales, non seulement un point de passage pour les marchands, mais aussi un phare de la civilisation islamique. Que nos mosquées en pierre de corail rivalisent avec les grandes maisons d'enseignement du Caire et de Bagdad, que nos savants illuminent la foi et que notre langue swahili devienne la langue du raffinement de Sofala aux Comores."
 nd_kws.1.t: "L'ascendant du sultanat"
 nd_kws.1.d: "The scattered settlements of the Swahili coast have been gathered under one dominion. From the island fortress of Kilwa Kisiwani, our sultan gazes across waters that shimmer with possibility. To the south, the gold fields of Sofala pour wealth northward along routes we now control. To the east, the monsoon winds promise the riches of Arabia, Persia, India, and distant China. But a sultanate is more than its treasury. Will we pour our energies into extending our maritime reach across the Indian Ocean, building the greatest merchant fleet on the eastern seas, or will we invest in the magnificence of our cities, making Kilwa itself a jewel that draws scholars, artisans, and pilgrims from across the Islamic world?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_kws.1.a: "Nos boutres commanderont tous les vents de mousson"
 nd_kws.1.b: "Laissez Kilwa briller comme un phare de la civilisation"
 nd_kws.2.t: "L'or de Sofala"
 nd_kws.2.d: "Les marchands de Kilwa ont accompli ce qu'aucune autre puissance côtière n'a pu réaliser : le contrôle total du commerce de l'or de Sofala. Chaque once d’or qui quitte les mines proches du Grand Zimbabwe doit passer par les mains des Kilwan. La rivière Buzi traverse Sofala jusqu'au port, où nos facteurs pèsent, analysent et réexportent le métal précieux vers des acheteurs enthousiastes en Arabie et en Inde. Le sultan doit décider comment exploiter ce monopole. Devons-nous nous concentrer sur la maximisation du flux d’or via notre port, en gardant nos commerçants comme intermédiaires essentiels, en assumant des droits sur chaque transaction, ou allons-nous nous enfoncer plus profondément à l’intérieur, en établissant un contrôle direct sur les régions minières et en éliminant les intermédiaires qui se dressent entre nous et les champs aurifères ?"
 nd_kws.2.a: "Laissons la marée dorée traverser nos ports"
 nd_kws.2.b: "Envoyez nos agents dans les mines mêmes"
 STATIC_MODIFIER_NAME_nd_kws_golden_tide: "Marée dorée"
 STATIC_MODIFIER_DESC_nd_kws_golden_tide: "Les ports de Kilwa regorgent d'or de Sofala, ses marchands étant les intermédiaires essentiels de la route commerciale la plus riche du monde."
 STATIC_MODIFIER_NAME_nd_kws_interior_extraction: "Extraction intérieure"
 STATIC_MODIFIER_DESC_nd_kws_interior_extraction: "Les agents de Kilwan opèrent profondément à l’intérieur du pays, s’assurant que les matières premières proviennent directement de leur source et éliminant les intermédiaires."
 nd_kws.3.t: "Husuni Kubwa : Le Grand Palais"
 nd_kws.3.d: "Sur le promontoire surplombant l'océan Indien, un palais à l'ambition vertigineuse s'élève du rocher de corail. Husuni Kubwa, la Grande Forteresse, compte plus d'une centaine de pièces, un bassin de baignade octogonal, un vaste tribunal de commerce pour recevoir les délégations marchandes et une mosquée privée où le sultan peut prier tout en regardant la mer. Le sultan al-Hasan ibn Sulaiman a créé une résidence qui rivalise avec tout ce qui a été construit sur le continent africain. Le palais est plus qu'une maison : c'est une déclaration à tout capitaine étranger qui entre dans le port de Kilwa qu'il ne s'agit pas d'un poste de traite perdu, mais du siège d'une véritable civilisation."
 nd_kws.3.a: "Un palais digne de notre grandeur"
 STATIC_MODIFIER_NAME_nd_kws_palace_of_wonder: "Palais des Merveilles"
 STATIC_MODIFIER_DESC_nd_kws_palace_of_wonder: "Husuni Kubwa témoigne de la grandeur de Kilwan, ses cent chambres et ses vues sur l'océan impressionnent les ambassadeurs et les marchands."
 nd_kws.4.t: "La Grande Mosquée de Kilwa"
 nd_kws.4.d: "La Grande Mosquée de Kilwa Kisiwani a été agrandie pour devenir une structure à couper le souffle. Ses seize baies couvertes de dômes et de voûtes créent un intérieur unique sur la côte africaine, et son grand dôme, le plus grand d'Afrique de l'Est, s'élève au-dessus des fidèles lors des prières du vendredi. Les murs en chiffon de corail encastrés dans du mortier de calcaire brillent de blanc sur le ciel tropical. Mais la mosquée n’est pas seulement un lieu de culte. Sa cour accueille des érudits venus d'aussi loin que la Perse et l'Égypte, attirés par la réputation du savoir de Kilwan. Le sultan est confronté à un choix : consacrer la mosquée principalement à l'approfondissement de la piété de ses sujets, ou la développer comme un centre d'échange intellectuel qui attire les esprits les plus brillants du monde islamique."
 nd_kws.4.a: "Une maison de dévotion avant tout"
 nd_kws.4.b: "Une maison d'apprentissage pour les âges"
 STATIC_MODIFIER_NAME_nd_kws_dome_of_faith: "Dôme de la Foi"
 STATIC_MODIFIER_DESC_nd_kws_dome_of_faith: "La Grande Mosquée de Kilwa rayonne d'autorité religieuse sur toute la côte swahili, son grand dôme symbole de dévotion inébranlable."
 STATIC_MODIFIER_NAME_nd_kws_seat_of_learning: "Siège d'apprentissage"
 STATIC_MODIFIER_DESC_nd_kws_seat_of_learning: "Des érudits du monde islamique se rassemblent dans les cours des mosquées de Kilwa, faisant du sultanat un phare de connaissances et d'échanges intellectuels."
 nd_kws.5.t: "Navires à l'horizon"
 nd_kws.5.d: "D'étranges navires sont apparus au large des côtes swahilies, d'énormes châteaux de bois hérissés de canons, pilotés par des hommes à la peau pâle qui parlent d'un roi loin à l'ouest. Les Portugais sont arrivés. Leur commandant, Francisco de Almeida, exige que Kilwa se soumette à la suprématie commerciale portugaise : leurs navires seuls transporteront les marchandises entre la côte et l'Inde, et le sultan devra payer un tribut annuel. Derrière le langage diplomatique se cache une flotte de navires de guerre plus puissante que tout ce que nos boutres peuvent rivaliser. La cour du sultan est en pleine tourmente. Certains conseillers appellent au défi, rallier les villes côtières, fortifier les ports, refuser à ces envahisseurs le mouillage dont ils ont besoin. D’autres soutiennent qu’une diplomatie intelligente et une coopération sélective peuvent préserver l’autonomie des Kilwan alors que les étrangers vont inévitablement trop loin."
 nd_kws.5.a: "Nous ne nous inclinerons pas devant les tyrans étrangers"
 nd_kws.5.b: "Pliez comme la paume, ne cassez pas"
 STATIC_MODIFIER_NAME_nd_kws_defy_the_invaders: "Défi à Kilwa"
 STATIC_MODIFIER_DESC_nd_kws_defy_the_invaders: "Kilwa a choisi la résistance plutôt que la soumission. Ses ports sont fortifiés, ses guerriers résolus, et les marécages et les mers de mousson seront la tombe de l'envahisseur."
 STATIC_MODIFIER_NAME_nd_kws_diplomacy_of_survival: "Diplomatie de survie"
 STATIC_MODIFIER_DESC_nd_kws_diplomacy_of_survival: "Kilwa se plie mais ne casse pas. Grâce à une diplomatie prudente, des réseaux de renseignement et une coopération sélective, le sultanat préserve sa véritable indépendance pendant que les étrangers s'épuisent."
 nd_kws_swahili_warrior_tradition: "Tradition guerrière swahili"
 nd_kws_swahili_warrior_tradition_desc: "Les colonies côtières maintiennent une tradition de milice enracinée dans la défense des ports insulaires et des routes commerciales contre les pillards."
 nd_kws_coral_stone_masonry: "Maçonnerie en pierre de corail"
 nd_kws_coral_stone_masonry_desc: "Les constructeurs de Kilwan développent la technique distinctive consistant à couper des blocs de chiffon de corail dans le récif et à les placer dans du mortier de calcaire, créant ainsi l'architecture en pierre blanche qui définit la civilisation swahili."
 nd_kws_ivory_trade: "Commerce de l'ivoire"
 nd_kws_ivory_trade_desc: "Les marchands swahili établissent les chaînes d'approvisionnement qui amènent l'ivoire brut d'éléphant de l'intérieur vers les ateliers côtiers, où il est transformé en produits de luxe destinés à l'exportation à travers l'océan Indien."
 nd_kws_makutano_markets: "Marchés de Makutano"
 nd_kws_makutano_markets_desc: "Les carrefours des villes swahilies deviennent des centres commerciaux organisés où les commerçants africains, arabes et indiens échangent des marchandises selon des règles commerciales établies."
 nd_kws_monsoon_navigation: "Navigation pour la mousson"
 nd_kws_monsoon_navigation_desc: "Les marins swahilis maîtrisent les vents saisonniers de mousson qui régissent la navigation dans l'océan Indien, le kaskazi soufflant du nord-est de décembre à mars, le kusi du sud-est de juin à octobre."
 nd_kws_shirazi_dynasty: "Dynastie Shirazi"
 nd_kws_shirazi_dynasty_desc: "La dynastie Shirazi au pouvoir, dont les origines remontent à la ville perse de Shiraz, confère à Kilwa une gouvernance islamique légitime et des liens avec le monde musulman dans son ensemble."
 nd_kws_swahili_synthesis: "Synthèse swahili"
 nd_kws_swahili_synthesis_desc: "L'identité culturelle swahili émerge de la fusion des traditions bantoues, arabes et persanes, une civilisation maritime distinctement africaine mais cosmopolite dans sa perspective."
 nd_kws_dhow_building_tradition: "Tradition de construction de boutre"
 nd_kws_dhow_building_tradition_desc: "Kilwan shipwrights perfect the construction of lateen-rigged dhows, from tiny zambucs for coastal work to ocean-going vessels capable of reaching India on the monsoon winds.\n\n#italic Available in: $nd_kws_swahili_dockyard$#!"
 nd_kws_funduq_network: "Réseau Funduq"
 nd_kws_funduq_network_desc: "A network of funduqs, merchant warehouses and hostels, allows foreign traders to store goods, negotiate deals, and find lodging in every major Swahili port."
 nd_kws_copper_coinage: "Monnaie de cuivre"
 nd_kws_copper_coinage_desc: "Kilwa commence à frapper ses propres pièces de cuivre, l'un des seuls États d'Afrique subsaharienne à émettre des pièces de monnaie. Les pièces circulent du Grand Zimbabwe à Zanzibar, facilitant le commerce et projetant l'autorité commerciale de Kilwan."
 nd_kws_merchant_marine: "Marine marchande"
 nd_kws_merchant_marine_desc: "Un système formalisé de flotte marchande émerge, avec des familles bourgeoises de Kilwan équipant et équipant des convois commerciaux saisonniers qui suivent les vents de mousson entre l'Afrique et l'Asie."
 nd_kws_husuni_kubwa: "Husuni Kubwa"
 nd_kws_husuni_kubwa_desc: "La construction de Husuni Kubwa, le Grand Palais, avec ses cent pièces, sa piscine octogonale et sa vue imprenable sur l'océan Indien, marque l'apogée de l'ambition architecturale de Kilwan."
 nd_kws_indian_ocean_network: "Réseau Océan Indien"
 nd_kws_indian_ocean_network_desc: "Les relations commerciales de Kilwa s'étendent désormais sur l'ensemble de l'océan Indien, de la côte indienne de Malabar aux ports du golfe Persique et aux îles aux épices de l'Asie du Sud-Est."
 nd_kws_sofala_gold_monopoly: "Monopole d'or de Sofala"
 nd_kws_sofala_gold_monopoly_desc: "Kilwa's control of Sofala, the sole coastal outlet for the gold mines of Great Zimbabwe, gives the sultanate a near-total monopoly on East African gold entering the Indian Ocean trade.\n\n#italic Available in: $nd_kws_mint$#!"
 nd_kws_great_mosque: "La Grande Mosquée"
 nd_kws_great_mosque_desc: "La Grande Mosquée de Kilwa Kisiwani, avec ses seize baies en forme de dôme et le plus grand dôme d'Afrique de l'Est, devient à la fois le cœur spirituel du sultanat et un centre d'érudition islamique."
 nd_kws_sofala_garrison: "Garnison de Sofala"
 nd_kws_sofala_garrison_desc: "Des gardes d'élite sont stationnés le long de la route commerciale de l'or de Sofala à Kilwa, protégeant les caravanes et les facteurs qui soutiennent la richesse du sultanat."
 nd_kws_mtepe_construction: "Deep-Sea Dhows"
 nd_kws_mtepe_construction_desc: "The shipwrights of the coast build the bangala, a large dhow with a high carved stern, for the long monsoon passage to Arabia and India."
 nd_kws_zanzibar_entrepot: "Entrepôt de Zanzibar"
 nd_kws_zanzibar_entrepot_desc: "Zanzibar apparaît comme un port secondaire majeur de l’empire commercial de Kilwan, son port profond et sa position stratégique en faisant un nœud essentiel du commerce dans l’océan Indien."
 nd_kws_island_dominion: "Domination insulaire"
 nd_kws_island_dominion_desc: "Kilwa étend son autorité sur la chaîne d'îles s'étendant de Pemba et Zanzibar jusqu'à la Mafia et les Comores, créant un empire maritime de fiefs insulaires."
 nd_kws_resist_the_portuguese: "Résistez aux Portugais"
 nd_kws_resist_the_portuguese_desc: "L’arrivée des navires de guerre portugais menace l’ensemble du système commercial swahili. Kilwa se prépare à défendre sa souveraineté contre un adversaire technologiquement supérieur mais stratégiquement étendu."
 nd_kws_coastal_defense_fleet: "Flotte de défense côtière"
 nd_kws_coastal_defense_fleet_desc: "Kilwa développe des galères de guerre spécialisées conçues pour les eaux côtières peu profondes de la côte swahili, plus rapides et plus maniables dans les conditions locales que les navires européens à fort tirant d'eau."
 nd_kws_fortified_harbors: "Ports fortifiés"
 nd_kws_fortified_harbors_desc: "Les principaux ports du sultanat sont renforcés par des murs et des tours de guet en pierre de corail, créant un réseau de mouillages fortifiés capables de résister aux bombardements navals."
 nd_kws_kilwa_chronicle: "La Chronique de Kilwa"
 nd_kws_kilwa_chronicle_desc: "La compilation de la Chronique de Kilwa, un document historique en arabe détaillant les dynasties, le commerce et les relations du sultanat, marque une étape importante dans la conscience historique de l'Afrique de l'Est."
 nd_kws_stone_town_expansion: "Agrandissement de Stone Town"
 nd_kws_stone_town_expansion_desc: "Le noyau urbain en pierre de corail de Kilwa s'agrandit avec de nouveaux quartiers marchands, des travaux publics et des complexes résidentiels, créant la ville de pierre swahili distinctive qui inspire l'admiration des visiteurs étrangers."
 nd_kws_sovereignty_tradition: "Tradition de souveraineté"
 nd_kws_sovereignty_tradition_desc: "Ayant résisté à l’ingérence portugaise, la tradition politique de Kilwan met l’accent sur la préservation de la souveraineté grâce à une gestion habile des rivalités des grandes puissances."
 nd_kws_revived_gold_routes: "Les routes de l’or relancées"
 nd_kws_revived_gold_routes_desc: "As Portuguese control over the southern coast weakens, Kilwan merchants reassert their dominance over the gold and ivory trade routes connecting the interior to the Indian Ocean.\n\n#italic Available in: $nd_kws_ivory_workshop$#!"
 nd_kws_customs_administration: "Administration des douanes"
 nd_kws_customs_administration_desc: "Une administration douanière systématisée perçoit des droits sur les marchandises entrant et sortant des ports de Kilwan, fournissant ainsi au sultanat une base de revenus fiable, indépendante du commerce direct."
 nd_kws_swahili_literary_tradition: "Tradition littéraire swahili"
 nd_kws_swahili_literary_tradition_desc: "La langue swahili développe une riche tradition littéraire, de la poésie, des chroniques et des textes religieux écrits en écriture arabe, créant une identité culturelle partagée à travers la côte."
 nd_kws_indian_ocean_diplomacy: "Diplomatie de l'Océan Indien"
 nd_kws_indian_ocean_diplomacy_desc: "Kilwa entretient des relations diplomatiques à travers le monde de l’océan Indien, équilibrant les intérêts omanais, portugais et locaux grâce à des manœuvres politiques astucieuses."
 nd_kws_swahili_awakening: "L'éveil swahili"
 nd_kws_swahili_awakening_desc: "Une nouvelle conscience de l'identité swahili émerge, non seulement en tant que peuple commerçant, mais en tant que civilisation avec sa propre tradition littéraire, son patrimoine architectural et son destin politique."
 nd_kws_modern_indian_ocean_trade: "Commerce moderne dans l’océan Indien"
 nd_kws_modern_indian_ocean_trade_desc: "Kilwa s'adapte au monde en voie d'industrialisation, modernisant ses installations portuaires et ses pratiques commerciales tout en maintenant les réseaux commerciaux de l'océan Indien qui la soutiennent depuis des siècles."
 nd_kws_constitutional_sultanate: "Sultanat constitutionnel"
 nd_kws_constitutional_sultanate_desc: "Le sultanat évolue vers un système de gouvernance plus structuré, avec des organes consultatifs formels tempérant le pouvoir absolu et assurant la stabilité grâce à la continuité institutionnelle."
 a_nd_kws_swahili_askari: "Swahili Askari"
 a_nd_kws_swahili_askari_desc: "Des combattants de la milice côtière issus des colonies insulaires, experts dans la défense des ports et dans les combats sur les terrains marécageux du littoral."
 n_nd_kws_kilwa_dhow: "Sofala Runner"
 n_nd_kws_kilwa_dhow_desc: "A light, fast vessel kept for the passage south of Kilwa, where the monsoon ships from Arabia and India cannot go and return in one season. With a small crew it carries cloth and beads down to Sofala and brings the gold of the interior back."
 a_nd_kws_sofala_guard: "Garde Sofala"
 a_nd_kws_sofala_guard_desc: "Soldats d'élite chargés de protéger la route vitale du commerce de l'or entre Sofala et la côte. Sélectionnés pour leur loyauté et leur endurance, ils patrouillent sur certains des sentiers caravaniers les plus précieux d'Afrique."
 n_nd_kws_mtepe: "Bangala"
 n_nd_kws_mtepe_desc: "A large deep-sea dhow with a high carved stern, known to the Arabs as the baghlah. It carries the trade of the coast to Aden, Hormuz, and the ports of India on the monsoon."
 n_nd_kws_zanzibari_galley: "Galère de guerre de Zanzibar"
 n_nd_kws_zanzibari_galley_desc: "Une cuisine à rames conçue pour les eaux côtières peu profondes de la côte swahili. Plus rapide et plus maniable dans les eaux confinées que les navires de guerre européens à fort tirant d'eau."
 n_nd_kws_merchant_levy: "Boutre de prélèvement marchand"
 n_nd_kws_merchant_levy_desc: "Les navires de commerce armés ont été mis au service naval en temps de guerre. Equipés de marins marchands expérimentés, ces boutres connaissent tous les récifs et courants de la côte."
 nd_kws_coral_mosque: "Mosquée en pierre de corail"
 nd_kws_coral_mosque_desc: "Une mosquée construite à partir de blocs de chiffon de corail découpés dans le récif et encastrés dans du mortier de calcaire, style architectural emblématique de la civilisation swahili."
 nd_kws_funduq: "Funduq"
 nd_kws_funduq_desc: "Un entrepôt marchand et une auberge où les commerçants étrangers peuvent stocker des marchandises, négocier des accords et trouver un logement. Le funduq est l’infrastructure essentielle du commerce international swahili."
 nd_kws_swahili_dockyard: "Chantier naval swahili"
 nd_kws_swahili_dockyard_desc: "Une installation de construction navale spécialisée où des maîtres artisans construisent des boutres, des mtepes et d'autres navires en utilisant des techniques traditionnelles affinées au fil des siècles de navigation dans l'océan Indien."
 nd_kws_mint: "Menthe Kilwa"
 nd_kws_mint_desc: "L'une des seules installations de frappe de monnaie en Afrique subsaharienne, produisant les pièces de cuivre qui circulent dans tout l'empire commercial de Kilwan et au-delà."
 nd_kws_makutano: "Makutano"
 nd_kws_makutano_desc: "Un marché carrefour swahili où les commerçants africains, arabes et indiens convergent pour échanger ivoire, or, tissus, céramiques et épices sous l'œil vigilant des collecteurs d'impôts du sultan."
 nd_kws_mosque_upkeep: "Entretien de la mosquée"
 nd_kws_mosque_upkeep_desc: "Entretien de la structure en pierre de corail et fourniture de fournitures aux érudits et aux fidèles de la mosquée."
 nd_kws_funduq_maintenance: "Entretien Funduq"
 nd_kws_funduq_maintenance_desc: "Frais de fonctionnement de l'entrepôt du commerçant, y compris le matériel de stockage et les provisions pour les commerçants en visite."
 nd_kws_dockyard_maintenance: "Entretien du chantier naval"
 nd_kws_dockyard_maintenance_desc: "Du bois, des fournitures navales et les salaires des charpentiers navals qualifiés qui maintiennent les opérations du chantier naval."
 nd_kws_mint_operations: "Opérations de la Monnaie"
 nd_kws_mint_operations_desc: "Des lingots de cuivre sont frappés dans les pièces de monnaie distinctives de Kilwan et dans les ferronneries décoratives qui circulent à travers le réseau commercial de l'océan Indien."
 nd_kws_makutano_upkeep: "Entretien du marché"
 nd_kws_makutano_upkeep_desc: "Entretien des étals du marché et mise à disposition des marchandises d'échange qui attirent les commerçants au carrefour."
 nd_kws_ivory_carving_pm: "Sculpture en ivoire"
 nd_kws_ivory_carving_pm_desc: "Des artisans qualifiés transforment l’ivoire brut d’éléphant en produits de luxe finement sculptés destinés aux cours d’Arabie, d’Inde et de Chine."
 nd_kws_gold_refining_pm: "Raffinage de l'or"
 nd_kws_gold_refining_pm_desc: "L'or brut de la route commerciale de Sofala est raffiné, analysé et transformé en bijoux et en lingots commerciaux destinés à l'exportation à travers l'océan Indien."
 levy_nd_kws_swahili_askari: "Swahili Askari Prélèvement"
 levy_nd_kws_swahili_askari_desc: "Des miliciens insulaires issus des colonies côtières pour défendre les ports et les routes commerciales du sultanat."
 levy_nd_kws_merchant_fleet: "Prélèvement sur la flotte marchande"
 levy_nd_kws_merchant_fleet_desc: "Des boutres marchands armés furent mis en service en temps de guerre, avec pour équipage les marins expérimentés des maisons de commerce de Kilwa."
 nd_kws_coral_fortress: "Forteresse de Corail"
 nd_kws_coral_fortress_desc: "Un port fortifié de défense construit à partir de blocs de pierre de corail, conçu pour résister aux bombardements navals et protéger les approches de l'île."
 nd_kws_customs_house: "Bureau des douanes"
 nd_kws_customs_house_desc: "Une administration douanière formelle qui perçoit des droits sur toutes les marchandises entrant et sortant du port, systématisant ainsi les recettes commerciales du sultanat."
 nd_kws_swahili_academy: "Académie swahili"
 nd_kws_swahili_academy_desc: "Un centre d'érudition islamique et de culture littéraire swahili où les érudits étudient le Coran, composent de la poésie et préservent les traditions intellectuelles de la côte."
 nd_kws_fortress_upkeep: "Entretien de la forteresse"
 nd_kws_fortress_upkeep_desc: "Pierres et armements nécessaires à l'entretien de la forteresse de corail et de sa garnison."
 nd_kws_customs_upkeep: "Opérations douanières"
 nd_kws_customs_upkeep_desc: "Matériels administratifs et fournitures nécessaires au fonctionnement de l'appareil de perception des douanes."
 nd_kws_academy_upkeep: "Entretien de l'Académie"
 nd_kws_academy_upkeep_desc: "Papier, encre et fournitures pour les universitaires et les étudiants de l'académie."
 nd_kws_formed_tt: "Le sultanat de Kilwa a été formé"
 nd_kws_path_a_tt: "Choisissez les maîtres#bold du destin Monsoon#!"
 nd_kws_path_b_tt: "Choisissez le joyau#bold de la côte Swahili pour le destin#!"
 nd_kws_destiny: "Le destin de Kilwa"
 nd_kws_destiny_desc: "Le sultanat de Kilwa est forgé. Ses dirigeants doivent désormais décider s’ils souhaitent projeter leur puissance à travers l’océan Indien ou construire une civilisation qui traversera les âges."
 nd_kws_dest_monsoon_reach: "Portée de la mousson"
 nd_kws_dest_monsoon_reach_desc: "Étendre l’influence commerciale de Kilwan sur toute la longueur de la côte swahili. Contrôlez les couloirs commerciaux allant de Mogadiscio au nord jusqu'à l'or de Sofala au sud, faisant du sultanat l'intermédiaire indispensable du commerce de l'Afrique de l'Est."
 nd_kws_dest_monsoon_fleet: "La flotte de mousson"
 nd_kws_dest_monsoon_fleet_desc: "Les boutres Kilwan doivent porter la bannière du sultanat au-delà des eaux africaines. Saisissez le grand entrepôt d'Aden à l'embouchure de la mer Rouge et rejoignez la côte de Malabar en Inde, où vous attendent les marchés aux épices les plus riches du monde."
 nd_kws_dest_ocean_hegemony: "Hégémonie de l’océan Indien"
 nd_kws_dest_ocean_hegemony_desc: "Du détroit d’Ormuz aux ports du Gujarat, qu’aucun navire ne traverse l’océan Indien sans le départ de Kilwan. Prenez le contrôle des points d'étranglement qui régissent le commerce mondial et faites de Kilwa la puissance maritime suprême des mers orientales."
 nd_kws_dest_kilwa_19_tt: "#bold Kilwa Kisiwani#! is owned and has development of at least #bold 19#!"
 nd_kws_dest_kilwa_25_tt: "#bold Kilwa Kisiwani#! is owned and has development of at least #bold 25#!"
 nd_kws_dest_coral_cities: "Villes de corail"
 nd_kws_dest_coral_cities_desc: "Élargir la portée du sultanat à travers l'océan Indien occidental, en étendant la civilisation swahili à Madagascar tout en investissant dans les institutions qui transforment un poste commercial en un véritable État."
 nd_kws_dest_swahili_renaissance: "Renaissance swahili"
 nd_kws_dest_swahili_renaissance_desc: "Push the boundaries of the Swahili world deep into the interior, reaching Great Zimbabwe itself. Kilwa Kisiwani is to be rebuilt in coral stone until its development reaches 19."
 nd_kws_dest_beacon_of_civilization: "Phare de la civilisation"
 nd_kws_dest_beacon_of_civilization_desc: "Let Kilwa become a center of learning and culture to rival Cairo or Baghdad. Embrace the new institutions of banking and commerce, extend influence to northern Madagascar, and raise the development of Kilwa Kisiwani to 25, twice what it was."
 nd_kws.6.t: "Le destin de Kilwa"
 nd_kws.6.d: "Les tours en pierre de corail de Kilwa Kisiwani brillent de blanc sur le ciel tropical. Depuis cette forteresse insulaire, le sultan surveille un domaine qui s'étend de l'île au continent, du port à l'arrière-pays. Le sultanat de Kilwa a été proclamé, mais son véritable destin n'est pas encore écrit. Les vents de la mousson murmurent des possibilités : de vastes empires océaniques et des cours de savoir scintillantes. Les choix qui suivront détermineront si le nom de Kilwa résonnera à travers les mers ou brillera comme un phare de civilisation pour tous ceux qui le recherchent."
 nd_kws.6.a: "Notre destin attend"
 nd_kws.7.t: "Commandement de la côte"
 nd_kws.7.d: "De l’ancien port de Mogadiscio au nord au port riche en or de Sofala au sud, toute la côte est-africaine tombe désormais sous la domination de Kilwan. Chaque navire marchand qui sillonne ces eaux rend hommage aux facteurs du sultan. Les capitaines des boutres rapportent que les vents de mousson saisonniers transportent bien plus que des marchandises : ils transmettent la nouvelle de la puissance croissante de Kilwa dans tous les ports de l'océan Indien. Ce qui était autrefois une chaîne de colonies commerciales indépendantes est désormais un empire commercial unifié, et ses ambitions s’étendent bien au-delà des côtes africaines."
 nd_kws.7.a: "La côte est à nous - maintenant place à l'océan"
 nd_kws.8.t: "À travers la mer de mousson"
 nd_kws.8.d: "Les marchands de Kilwan ont réalisé ce que peu de dirigeants africains osaient rêver : une présence permanente sur les côtes de l’Inde et de l’Arabie. Les agents du sultan opèrent à Aden, porte d'accès à la mer Rouge, et sur les marchés aux épices de la côte de Malabar. Kilwa n’est plus simplement une puissance africaine mais une force dans le monde plus vaste de l’océan Indien. Le tribunal débat désormais de la manière de consolider ces acquis. Certains amiraux sont favorables à la constitution d'une force navale écrasante pour garantir la suprématie maritime des Kilwan. D’autres affirment que le contrôle des flux de biens précieux (poivre, cannelle, soie) générera une richesse qu’aucune flotte ne peut égaler."
 nd_kws.8.a: "Nos navires de guerre domineront ces eaux"
 nd_kws.8.b: "Contrôlez les épices, contrôlez le monde"
 nd_kws.9.t: "Seigneurs de l'océan Indien"
 nd_kws.9.d: "Le détroit d'Ormuz, les portes du golfe Persique, les ports du Gujarat, tous s'inclinent devant l'autorité maritime de Kilwan. Aucune autre puissance ne peut égaler la portée du sultanat à travers l’océan Indien. De la mer Rouge à la côte de Malabar, les facteurs, amiraux et diplomates de Kilwan exploitent un réseau commercial d’une ampleur stupéfiante. La question est désormais de savoir comment gouverner cet empire océanique. Kilwa règnera-t-elle comme une thalassocratie, projetant la puissance militaire de sa flotte pour faire respecter l'ordre à travers les mers ? Ou les maisons marchandes de Kilwa gouverneront-elles par le commerce, créant un réseau de partenaires dépendants liés par le profit plutôt que par la force ?"
 nd_kws.9.a: "La mer elle-même est notre domaine"
 nd_kws.9.b: "Laissons le commerce lier ce que la force ne peut pas"
 nd_kws.10.t: "Villes de Corail et de Lumière"
 nd_kws.10.d: "Les cités de corail blanc de la côte swahilie grandissent et se multiplient. De Kilwa aux lointaines côtes de Madagascar, l’architecture, le droit et le savoir swahili se sont répandus le long des routes commerciales. Le sultanat a investi non seulement dans le commerce mais aussi dans les institutions qui assurent la permanence de l'État : codes juridiques, traditions savantes et systèmes administratifs qui transforment le tribut en gouvernance. Là où autrefois les commerçants allaient et venaient avec la mousson, des colonies permanentes s'élèvent désormais, leurs mosquées de corail et leurs tribunaux savants attirant des visiteurs de tout le monde islamique."
 nd_kws.10.a: "Notre civilisation prend racine"
 nd_kws.11.t: "L’épanouissement de la culture swahili"
 nd_kws.11.d: "A remarkable transformation has taken place in the Kilwan lands. The sultanate's influence now extends deep into the interior, reaching even the great stone court of Great Zimbabwe, whose kings hold the gold of the plateau. But it is not conquest alone that marks this age. It is a cultural flowering without precedent on the African coast. Poets compose in Swahili, scholars debate philosophy in coral-walled academies, and artisans create works that astonish visitors from abroad. The sultan must choose how to channel this creative energy. Will Kilwa nurture a golden age of arts and scholarship, or will it focus on consolidating its expanded territory into a unified and integrated realm?"
 nd_kws.11.a: "Laissons les poètes et les érudits nous guider"
 nd_kws.11.b: "Nous devons d'abord gouverner ce que nous détenons"
 nd_kws.12.t: "La balise brille"
 nd_kws.12.d: "Kilwa est le plus grand centre de la civilisation islamique de l’hémisphère sud. Ses académies attirent des érudits du Caire à Samarkand, ses bibliothèques conservent des œuvres perdues ailleurs et sa tradition littéraire swahili a produit un corpus de poésie et de philosophie qui enrichit le monde islamique tout entier. Les voyageurs qui visitent Kilwa en parlent comme ils parlaient autrefois de Cordoue ou de Bagdad, un lieu où convergent connaissance et beauté. Alors que le sultanat atteint le sommet de sa réussite culturelle, deux visions de son avenir émergent. Certains érudits préconisent que Kilwa devienne une véritable maison de sagesse, englobant toutes les connaissances, quelle que soit leur source. D’autres pensent que le sultanat devrait utiliser son autorité culturelle pour construire un ordre gouvernemental éternel."
 nd_kws.12.a: "La connaissance ne connaît pas de frontières"
 nd_kws.12.b: "Notre héritage sera une gouvernance éternelle"
 STATIC_MODIFIER_NAME_nd_kws_dest_monsoon_dominance: "Dominance de la mousson"
 STATIC_MODIFIER_DESC_nd_kws_dest_monsoon_dominance: "Les flottes de guerre de Kilwan contrôlent les voies maritimes de la mousson, leurs débarquements rapides semant la peur chez leurs rivaux côtiers."
 STATIC_MODIFIER_NAME_nd_kws_dest_spice_monopoly: "Monopole des épices"
 STATIC_MODIFIER_DESC_nd_kws_dest_spice_monopoly: "L'emprise de Kilwa sur le commerce des épices génère une richesse fabuleuse, ses maisons de marchands prêtant des capitaux à travers l'océan Indien."
 STATIC_MODIFIER_NAME_nd_kws_dest_thalassocracy: "Kilwan Thalassocratie"
 STATIC_MODIFIER_DESC_nd_kws_dest_thalassocracy: "Kilwa gouverne l’océan Indien comme une véritable thalassocratie, sa puissance navale projetant sa puissance de l’Afrique vers l’Inde et au-delà."
 STATIC_MODIFIER_NAME_nd_kws_dest_merchant_princes: "Princes marchands"
 STATIC_MODIFIER_DESC_nd_kws_dest_merchant_princes: "Les grandes familles marchandes de Kilwa gouvernent un empire commercial par le biais du commerce et du patronage, reliant les ports éloignés par une prospérité partagée."
 STATIC_MODIFIER_NAME_nd_kws_dest_golden_age_arts: "L'âge d'or des arts"
 STATIC_MODIFIER_DESC_nd_kws_dest_golden_age_arts: "Un âge d'or de poésie, d'architecture et d'érudition swahili transforme le sultanat en un phare de réussite culturelle."
 STATIC_MODIFIER_NAME_nd_kws_dest_interior_dominion: "Domination intérieure"
 STATIC_MODIFIER_DESC_nd_kws_dest_interior_dominion: "L'autorité de Kilwa s'étend profondément à l'intérieur du pays, intégrant divers peuples dans un royaume unifié sous la gouvernance swahili."
 STATIC_MODIFIER_NAME_nd_kws_dest_house_of_wisdom: "Maison de la Sagesse"
 STATIC_MODIFIER_DESC_nd_kws_dest_house_of_wisdom: "Les académies de Kilwa englobent toutes les connaissances, attirant des érudits de toutes confessions et traditions vers le plus grand centre d'apprentissage des mers du sud."
 STATIC_MODIFIER_NAME_nd_kws_dest_eternal_sultanate: "Le Sultanat éternel"
 STATIC_MODIFIER_DESC_nd_kws_dest_eternal_sultanate: "Les institutions gouvernementales de Kilwa atteignent une permanence qui transcende les dirigeants individuels, créant ainsi un ordre politique durable."
 nd_kws_bahari_emporium: "Magasin Bahari"
 nd_kws_bahari_emporium_desc: "Une grande maison de commerce océanique où convergent les marchands de tout l'océan Indien : le cœur commercial de l'empire maritime de Kilwa."
 nd_kws_emporium_operations: "Opérations du magasin"
 nd_kws_emporium_operations_desc: "Le vaste appareil logistique permettant de recevoir, de cataloguer et de redistribuer les marchandises en provenance de tous les coins du monde commercial de l’océan Indien."
 nd_kws_dar_al_ilm: "Dar al-Ilm"
 nd_kws_dar_al_ilm_desc: "La Maison du savoir : une grande académie où les érudits se réunissent pour étudier la théologie, la philosophie, la médecine et les sciences naturelles, rivalisant avec les grandes madrasas du monde islamique."
 nd_kws_dar_al_ilm_upkeep: "Opérations de l'Académie"
 nd_kws_dar_al_ilm_upkeep_desc: "Du papier, des livres, de l'encre et des fournitures pour les érudits, les scribes et les étudiants qui remplissent les salles du Dar al-Ilm."
 AUTO_MODIFIER_NAME_nd_kws_bureaucracy_authority: "Diwan sultanique"
 AUTO_MODIFIER_DESC_nd_kws_bureaucracy_authority: "On formation, Kilwa inherits the institutional apparatus of the Mahdali Kilwa Sultanate: the Sultan's wazir-led chancery at Husuni Kubwa, the wakili port-masters of every coastal suk, the Sharifian Sayyid claim of the Mahdali dynasty, the liwali governors of the tributary harbors, and the gold-tribute bond with Sofala. Two bureaucracy slots are granted. With the one sharia law gives, three of the historical institutions of the Swahili coast can be kept."
 kws_wazir_diwan_bureaucracy: "Diwan de Wazir"
 kws_wazir_diwan_bureaucracy_desc: "Chancellerie et conseil intérieur du sultan, présidés par le wazir depuis les salles d'audience de Husuni Kubwa. Ibn Battuta, visitant Kilwa en 1331, a décrit des pétitions parvenant au sultan al-Hasan ibn Sulaiman par l'intermédiaire de ce bureau. Le wazir rédigeait des décrets, gérait le trésor et coordonnait la correspondance du sultan avec les dirigeants étrangers d'Aden à Ormuz. Une chancellerie unifiée au sein d'un système de cités-États marchandes resserre inévitablement l'emprise du sultan aux dépens des familles patriciennes qui dirigent depuis longtemps chaque port comme le leur."
 kws_wakili_suk_bureaucracy: "Maîtrise du port de Wakili-Suk"
 kws_wakili_suk_bureaucracy_desc: "La capitainerie et l'appareil douanier qui géraient tous les ports swahilis, de Mogadiscio au nord à Sofala au sud. Chaque suk avait son wakili, qui pesait les cargaisons, prélevait l'ushur (un dixième du droit) et jugeait les différends commerciaux entre les marchands arabes, persans, indiens et swahilis. À la fin du XIVe siècle, Mahdali décrète des tarifs standardisés à Pemba, Mafia et Kilwa Kisiwani, transformant une confédération de ports indépendants en un réseau commercial coordonné. Les peuples bantous tributaires de la côte ont subi les conséquences de l'augmentation des droits de douane."
 kws_sharifian_mahdali_bureaucracy: "Conseil Sharifian Mahdali"
 kws_sharifian_mahdali_bureaucracy_desc: "L'appareil généalogique et cérémonial par lequel la dynastie Mahdali (au pouvoir à partir de 1277) revendiquait une descendance des Sharifs Banu Mahdal du Yémen, faisant à son tour remonter la lignée jusqu'au Prophète par l'intermédiaire de son cousin Ali. S'opposant à l'ancienne légende persane de la fondation Shirazi, la revendication chérifienne a conféré au sultanat une légitimité islamique à travers l'océan Indien, a rapproché le clergé sunnite du trône et a été formalisée dans la Chronique de Kilwa composée sous le sultan Muhammad Ibn al-Husayn al-Qulati. Les communautés marchandes dhimmi hindoues et chrétiennes du réseau commercial plus large se trouvaient structurellement en dehors du nouvel ordre sacré."
 kws_liwali_governorate_bureaucracy: "Gouvernorat côtier de Liwali"
 kws_liwali_governorate_bureaucracy_desc: "Le système de gouverneurs de district de Liwali nommés à partir de Kilwa Kisiwani pour administrer les ports tributaires du sultanat : Mafia, Pemba, Vumba Kuu, Mombasa, Mogadiscio, Sofala. Les Liwalis étaient généralement des parents Mahdali formés au tribunal, alternés entre les postes pour empêcher le retranchement local qui avait fragmenté les politiques côtières antérieures. Le système maintenait la côte ensemble sous un seul trésor, mais privait les patriciats marchands de pouvoir indépendant - et, lorsque la rotation s'accélérait à la fin du XVe siècle, instable, il privait la côte d'une administration locale chevronnée."
 kws_sofala_gold_vassalage_bureaucracy: "Sofala Gold Vassalité"
 kws_sofala_gold_vassalage_bureaucracy_desc: "The tributary bond by which Sofala, the southernmost Swahili port at the mouth of the Buzi River, paid annual tribute in gold dust to Kilwa from c.1300. The gold flowed from the workings of the Zimbabwe plateau, sent down to the coast by the rulers of Great Zimbabwe and, from the fifteenth century, by the Mwene Mutapa; in return Kilwa granted Sofala exclusive access to monsoon shipping and Indian cloth. When the bond weakened in the early sixteenth century, the entire monopoly collapsed: the Portuguese attack of 1505 found the tribute already failing. A grand bargain when it works; once entrenched, the merchant patriciates of the home islands resent funding a southern outpost they cannot directly tax."
 nd_kws_kutchi_financiers: "Kutchi Financiers"
 nd_kws_kutchi_financiers_desc: "Bhatia and Khoja merchants from Kutch settle in the ports of the coast. They advance cloth, beads and coin to the caravans that go inland, take the ivory in payment when the caravans come back, and lend to the sultan against the customs of his harbours."
 nd_kws_ivory_workshop: "Ivory Workshop"
 nd_kws_ivory_workshop_desc: "A carvers' workshop in a coastal town, where tusks brought down from the interior are sawn, turned and carved. Out of it come the side-blown siwa horns of the Swahili courts, combs, bangles and the hilts that the smiths of Arabia mount on their daggers."
 nd_kws_gold_mounted_ivory_pm: "Gold-Mounted Ivory"
 nd_kws_gold_mounted_ivory_pm_desc: "Carved ivory set with gold from the southern routes: dagger hilts, caskets and regalia for buyers who want both treasures of the coast in one piece."
 nd_kws_stone_house: "Stone House"
 nd_kws_stone_house_desc: "The coral rag house of a patrician family, roofed on mangrove poles and plastered with lime. Imported porcelain stands in the carved wall niches called zidaka, and a visiting merchant lodges as the guest of the family that brokers his trade."
 nd_kws_stone_house_upkeep: "Stone House Upkeep"
 nd_kws_stone_house_upkeep_desc: "Coral stone and lime for the walls, mangrove poles for the roof and porcelain for the niches."
 nd_kws_kutchi_house: "Kutchi Merchant House"
 nd_kws_kutchi_house_desc: "The counting house of a merchant family from Kutch. It advances cloth, beads and coin to the caravans going inland and takes ivory in payment when they return."
 nd_kws_kutchi_house_upkeep: "Counting House Upkeep"
 nd_kws_kutchi_house_upkeep_desc: "Paper for the ledgers, cloth to advance to the caravans and silver coin to settle accounts."
