l_french:
 STATIC_MODIFIER_NAME_nd_rom_imperium_restitutum: "Imperium Romanum restitutum"
 STATIC_MODIFIER_DESC_nd_rom_imperium_restitutum: "L’Empire romain a été restauré non pas comme une idée, mais comme une réalité d’acier et de droit. Depuis les sept collines de Rome, les aigles survolent à nouveau un territoire qui s'étend d'un océan à l'autre. Les légions marchent à nouveau (disciplinées, implacables, irrésistibles) et le monde se souvient de ce que signifie défier Rome. La loi universelle lie chaque province au centre, et l'autorité de l'Imperator ne tolère aucune dissidence."
 STATIC_MODIFIER_NAME_nd_rom_lux_aeterna: "Lux Aeterna"
 STATIC_MODIFIER_DESC_nd_rom_lux_aeterna: "Rome perdure non pas grâce à ses légions, mais grâce à ce qu’elle représente. Être Romain, c'est être civilisé : connaître le droit, valoriser le savoir, construire des routes et des aqueducs qui traversent les âges. Cet empire restauré ne se contente pas de conquérir ; ça se transforme. Tous les peuples qu’elle touche reçoivent le don de la civilisation romaine et, en retour, Rome absorbe ce qu’il y a de meilleur en eux. La lumière éternelle du Caput Mundi illumine le monde."
 nd_rom.1.t: "SPQR : Senatus Populusque Romanus"
 nd_rom.1.d: "It is done. What centuries of ambition, blood, and devotion have labored toward is now manifest: the Roman Empire stands reborn. The ancient seat of the Caesars at Rome is ours. The walls of Constantinople bow to our standard. From the forums where Cicero spoke to the harbors where the grain ships once sailed, this dominion spans the known world.\n\nThe Senate and People of Rome (those ancient words, half-forgotten in the long darkness since the fall) ring out again through marble halls. Scholars weep. Soldiers kneel before the eagles. The common folk whisper that the prophecy has been fulfilled: Rome is eternal.\n\nBut a restored empire must choose its soul. The old Romans knew two paths to greatness, and the question that divided Caesar from Augustus, Trajan from Hadrian, now falls to us. Shall Rome rule through the irresistible force of its legions, imposing universal order through strength? Or shall Rome rule through the irresistible force of its civilization, making all peoples wish to call themselves Roman?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_rom.1.a: "Les aigles obscurciront tous les horizons."
 nd_rom.1.b: "Que la lumière de Rome illumine chaque pays."
 # ===== DESTINY LOCALIZATION =====

 # Variable tooltips
 nd_rom_formed_tt: "L'Empire romain est formé"
 nd_rom_path_a_tt: "Choisissez le destin#bold Imperium Romanum Restitutum#!"
 nd_rom_path_b_tt: "Choisissez le destin#bold Lux Aeterna#!"
 nd_rom_dest_alexandria_developed_tt: "We own #bold Alexandria#! and its development is at least #bold 59#!"
 nd_rom_dest_carthage_developed_tt: "We own #bold Tunis#!, the site of Carthage, and its development is at least #bold 47#!"
 nd_rom_dest_rome_developed_tt: "We own #bold Rome#! and its development is at least #bold 63#!"

 # Destiny Root
 nd_rom_destiny: "SPQR restauré"
 nd_rom_destiny_desc: "L’Empire romain renaît. Stabilisez le royaume et choisissez la voie qui définira cette nouvelle Rome pour les âges."

 # Path A: Imperium Romanum Restitutum
 nd_rom_dest_pax_imposita: "Pax Romana Imposita"
 nd_rom_dest_pax_imposita_desc: "La paix de Rome n'est pas donnée : elle s'impose. Étendez les aigles au-delà des anciennes frontières. Les villes saintes d’Arabie et du Rhin germanique doivent se plier à l’autorité romaine."
 nd_rom_dest_limes_ultimus: "Limes Ultimus"
 nd_rom_dest_limes_ultimus_desc: "Les vieux limes constituaient une ligne de retraite. Les nouveaux citrons verts sont une ligne d'avancée. Repoussez les frontières jusqu'au cœur de la Russie et dans les hauts plateaux de la Perse. Faites savoir au monde qu’il n’y a aucune terre que Rome ne puisse atteindre."
 nd_rom_dest_orbis_terrarum: "Orbis Terrarum"
 nd_rom_dest_orbis_terrarum_desc: "The inhabited world, the orbis terrarum, is Rome. From the green hills of Ireland to the bazaars of Samarkand, from the forests of Novgorod to the deserts of Arabia, no corner of the earth lies beyond the reach of the legions, drilled anew in pike and shot."

 # Path B: Lux Aeterna
 nd_rom_dest_renovatio_studii: "Études de rénovation"
 nd_rom_dest_renovatio_studii_desc: "Un renouveau des apprentissages. Les institutions bancaires et le commerce de la soie de Rome financent un nouvel âge d'or de l'érudition. C’est la richesse de la civilisation, et non l’épée, qui liera le monde à Rome."
 nd_rom_dest_mare_mercator: "Mare Nostrum Mercator"
 nd_rom_dest_mare_mercator_desc: "The Mediterranean is truly 'our sea' once more: not as a Roman lake of warships, but as the greatest market the world has ever known. Alexandria, the emporium of the East, and Carthage, the second city of the Latin West, are built up into the harbours they were under the Caesars. Roman printing presses spread knowledge as Roman ships spread goods."
 nd_rom_dest_caput_mundi: "Caput Mundi"
 nd_rom_dest_caput_mundi_desc: "The Head of the World. Rome is not merely a city or even an empire: it is the fountainhead of civilization itself. The town that shrank among its ruins is built up to twice what it was. Scientific revolution flows from Roman academies. Every nation measures itself against the Roman standard."

 # Destiny Events
 nd_rom.2.t: "Le Sénat se réunit"
 nd_rom.2.d: "Pour la première fois depuis plus de mille ans, le Sénat romain se réunit dans son ancienne salle. Les salles de marbre résonnent des délibérations alors que les sénateurs, venus des quatre coins de cet empire renaissant, débattent de l'avenir de Rome. Les aigles ont été élevés. La question n’est plus de savoir si Rome perdure, mais comment elle perdurera."
 nd_rom.2.a: "Rome Aeterna !"

 nd_rom.3.t: "Pax Romana Imposita"
 nd_rom.3.d: "Les légions ont franchi des frontières dont même Trajan rêvait. Les villes saintes d'Arabie sont tombées. Les tribus germaniques d'outre-Rhin, ces éternelles épines dans le flanc de Rome, sont enfin mises au pas. Les forts romains se dressent désormais là où aucun aigle romain n’a volé auparavant. La première phase de la nouvelle conquête est terminée, et le monde en prend conscience : il ne s’agit pas d’une restauration cérémonielle. C’est Rome telle qu’elle a toujours été censée être."
 nd_rom.3.a: "Les aigles volent où ils veulent."

 nd_rom.4.t: "Au-delà des anciennes frontières"
 nd_rom.4.d: "The legions have achieved what no Roman army has done before. Moscow and Isfahan (cities that the ancient Romans never saw, never even imagined) now fly the Roman standard. The frontier stretches from the frozen forests of Russia to the sun-baked plateaus of Persia.\n\nBut such an empire demands a choice about how its soldiers are organized. Shall we maintain the old Roman tradition of a small, supremely disciplined professional army? Or shall we embrace the reality of our vast frontiers and expand the limitanei, the border garrison system, to defend every mile of the limes?"
 nd_rom.4.a: "La qualité plutôt que la quantité. Formez les meilleurs."
 nd_rom.4.b: "Développez les garnisons frontalières."

 nd_rom.5.t: "Le monde est Rome"
 nd_rom.5.d: "It is done. From the green hills of Ireland to the ancient crossroads of Samarkand, from the frozen rivers of Novgorod to the burning sands of Arabia: all roads lead to Rome. The orbis terrarum, the circle of the known world, is Roman.\n\nPhilosophers debate whether this unprecedented dominion should be used to enforce a permanent peace, or whether Rome's nature demands eternal expansion. The legions await their orders."
 nd_rom.5.a: "Notre force garantit la paix éternelle."
 nd_rom.5.b: "La faim de Rome ne pourra jamais être rassasiée."

 nd_rom.6.t: "Études de rénovation"
 nd_rom.6.d: "Un nouvel âge d’or de l’apprentissage commence. Les banques romaines financent la construction de grandes bibliothèques et académies à travers tout l’empire. Des érudits de toutes les provinces (philosophes grecs, mathématiciens égyptiens, astronomes persans) se réunissent à Rome pour partager leurs connaissances. La soie qui circule sur les marchés romains sert à financer des manuscrits qui survivront aux empires. C'est là le véritable cadeau de Rome au monde : non pas l'épée, mais le livre."
 nd_rom.6.a: "Que la connaissance soit notre plus grande conquête."

 nd_rom.7.t: "Le marché romain"
 nd_rom.7.d: "The Mediterranean, Mare Nostrum, hums with commerce as it has not done since the height of the old empire. Roman trade routes stretch from the Atlantic to the Indian Ocean. The printing press, that most revolutionary of inventions, spreads Roman law, Roman knowledge, and Roman prices to every corner of the known world.\n\nThis unprecedented prosperity raises a question: shall Rome invest in its scholars and universities, building the most learned civilization the world has ever seen? Or shall it codify its commercial law, making Roman markets the standard against which all others are measured?"
 nd_rom.7.a: "Investissez dans les universitaires et les universités."
 nd_rom.7.b: "Codifier le droit commercial romain."

 nd_rom.8.t: "Caput Mundi"
 nd_rom.8.d: "Rome is the head of the world: not through conquest, but through the irresistible force of civilization. The scientific revolution that reshapes the world flows from Roman academies. Every nation that wishes to be called civilized adopts Roman institutions, Roman law, Roman standards of learning.\n\nThis civilizational supremacy offers Rome a final choice. Shall it embrace universal humanism, making all peoples equal under Roman law regardless of creed? Or shall it extend its diplomatic network to make Rome the indispensable arbiter of all nations, an empire without end, bound not by force but by necessity?"
 nd_rom.8.a: "Humanisme universel sous le droit romain."
 nd_rom.8.b: "Un empire sans fin."

 # Timed modifier names and descriptions
 STATIC_MODIFIER_NAME_nd_rom_dest_praetorian_discipline: "Discipline prétorienne"
 STATIC_MODIFIER_DESC_nd_rom_dest_praetorian_discipline: "Les armées de Rome sont entraînées selon un niveau de perfection que l’ancienne garde prétorienne envierait. Moins nombreux mais d’une compétence inégalée, ces soldats maintiennent les frontières grâce à leur excellence professionnelle."
 STATIC_MODIFIER_NAME_nd_rom_dest_limitanei_expansion: "Expansion Limitée"
 STATIC_MODIFIER_DESC_nd_rom_dest_limitanei_expansion: "Le système de garnison frontalière a été massivement étendu. Chaque kilomètre du limes est défendu par des soldats-agriculteurs sédentaires qui connaissent intimement leur territoire. Le séparatisme dépérit là où les légions veillent."
 STATIC_MODIFIER_NAME_nd_rom_dest_pax_imperialis: "Pax Impériale"
 STATIC_MODIFIER_DESC_nd_rom_dest_pax_imperialis: "La paix de Rome est absolue. Aucune nation n’ose défier un empire qui s’étend à travers le monde connu. Les sujets romains sont loyaux parce qu’ils ne connaissent aucune alternative, et la force écrasante de Rome rend toute résistance vaine."
 STATIC_MODIFIER_NAME_nd_rom_dest_bellum_perpetuum: "Bellum perpétuel"
 STATIC_MODIFIER_DESC_nd_rom_dest_bellum_perpetuum: "Rome est une machine de conquête qu’on ne peut arrêter. La guerre alimente le trésor grâce au pillage, et le trésor finance davantage de guerre. Le cycle s’auto-entretient, même si les campagnes constantes font monter les prix sans cesse."
 STATIC_MODIFIER_NAME_nd_rom_dest_collegium_doctorum: "Doctorat collégial"
 STATIC_MODIFIER_DESC_nd_rom_dest_collegium_doctorum: "Les grands collèges de Rome font l’envie du monde entier. Des chercheurs de tous les pays cherchent à être admis, et les connaissances qu’ils produisent génèrent une prospérité sans précédent. Le coût d’entretien de ces institutions signifie moins d’argent pour les légions."
 STATIC_MODIFIER_NAME_nd_rom_dest_lex_mercatoria: "Lex Mercatoria"
 STATIC_MODIFIER_DESC_nd_rom_dest_lex_mercatoria: "Le droit commercial romain, la Lex Mercatoria, est la norme selon laquelle tous les échanges commerciaux se déroulent. Les marchands romains bénéficient d’avantages inégalés sur chaque marché, et les centres commerciaux romains dominent le paysage économique."
 STATIC_MODIFIER_NAME_nd_rom_dest_universitas_romana: "Université romaine"
 STATIC_MODIFIER_DESC_nd_rom_dest_universitas_romana: "Le système universitaire romain a réalisé quelque chose sans précédent : une norme véritablement universelle d’apprentissage et de gouvernance. L'humanisme romain enseigne que tous les peuples sont égaux devant la loi, même si cette tolérance signifie moins de zèle pour la conversion religieuse."
 STATIC_MODIFIER_NAME_nd_rom_dest_imperium_sine_fine: "Imperium Sinus Fine"
 STATIC_MODIFIER_DESC_nd_rom_dest_imperium_sine_fine: "Empire sans fin : l’ancienne prophétie s’accomplit, mais par la diplomatie plutôt que par la conquête. Rome est la nation indispensable, l’arbitre de tous les différends, le centre de toutes les alliances. Le prix de cette suprématie diplomatique est une dilution de l’autorité royale directe."

 # Building names and descriptions
 nd_rom_castra_aeterna: "Castra Aéterna"
 nd_rom_castra_aeterna_desc: "L'éternelle forteresse légionnaire : une installation militaire permanente construite selon les normes de l'ingénierie romaine, avec en garnison des soldats professionnels qui vivent et meurent à la frontière. Ces forteresses projettent la puissance romaine sur de vastes distances."
 nd_rom_forum_universale: "Forum Universel"
 nd_rom_forum_universale_desc: "Un grand centre civique combinant marché, bibliothèque et académie dans la tradition romaine. Ici, les marchands font du commerce selon le droit romain tandis que les érudits étudient dans les universités romaines, créant ainsi un centre de civilisation qui attire le monde à Rome."

 # Production method names
 nd_rom_castra_maintenance: "Approvisionnement légionnaire"
 nd_rom_castra_maintenance_desc: "Des armes, des pierres pour les murs et des outils pour les ingénieurs qui maintiennent la forteresse opérationnelle."
 nd_rom_forum_maintenance: "Administration des forums"
 nd_rom_forum_maintenance_desc: "Du papier pour les archives, du tissu pour la décoration, du verre pour les fenêtres et du marbre pour les colonnades."

# ===== BUREAUCRACIES =====
 rom_senatus_renovatus_bureaucracy: "Senatus Romanus Renovatus"
 rom_senatus_renovatus_bureaucracy_desc: "À la Pentecôte 1144, après la mort du pape Innocent II, la population romaine sous Giordano Pierleoni proclama le senatus renovatio, élisant cinquante-six sénateurs du Capitole pour administrer la ville au mépris de la règle temporelle papale. Le réformateur lombard Arnold de Brescia devint le chef intellectuel de la commune et poussa le pape Eugène III à l'exil en 1146 avant sa pendaison en 1155. Les versions de la commune sénatoriale persistèrent jusqu'à la fin de la période médiévale, ancrant le gouvernement civique-aristocratique contre les cardinaux."
 rom_curia_romana_bureaucracy: "Curie romaine"
 rom_curia_romana_bureaucracy_desc: "Créée par le pape Urbain II (r. 1088-1099) sur le modèle des règlements monastiques clunisiens et du conseil royal capétien, la Curie romaine devient le tribunal administratif le plus sophistiqué de la chrétienté latine. Le Sacré Collège des Cardinaux, réuni en consistoires réguliers, servait de conseil permanent aux papes ; Les départements Cancellaria, Dataria et Signature étaient chacun dirigés par un cardinal. Des avocats canonistes formés à Bologne, comme Hostiensis, ont transformé la Curie en un centre d'échange continental pour les affaires ecclésiastiques et politiques."
 rom_camera_apostolica_bureaucracy: "Caméra Apostolique"
 rom_camera_apostolica_bureaucracy_desc: "Le trésor papal, dirigé par le Camerlingue de la Sainte Église Romaine. La fonction de camerarius a été instituée par le pape Urbain II et, au milieu du XIIe siècle, il était membre régulier de la Curie. Après Innocent III (1198-1216), l'évaluation régulière des impôts des croisades a construit le premier système de revenus transfrontalier de la chrétienté latine, et la Caméra a conduit au XIIIe siècle le passage des paiements en nature à la monnaie frappée dans toute l'Europe méditerranéenne."
 rom_corpus_iuris_civilis_bureaucracy: "Corpus Iuris Civilis"
 rom_corpus_iuris_civilis_bureaucracy_desc: "La redécouverte et l'enseignement de la compilation juridique de Justinien du VIe siècle ont commencé à Bologne dans les années 1080, lorsque la comtesse Mathilde de Canossa a invité le juriste Irnerius (le lucerna iuris) à donner une conférence sur le Digeste. Son école de glossateurs fonda ce qui devint l'Université de Bologne en 1088, et le ius commune qui en résulta fusionna le droit romain et le droit canonique dans la grammaire juridique commune de l'Europe latine, remplaçant la coutume féodale locale dans les villes marchandes de la péninsule."
 rom_rota_romana_bureaucracy: "Sacra Rota Romana"
 rom_rota_romana_bureaucracy_desc: "La cour d'appel apostolique est issue de l'Audientia Sacri Palatii de la Curie du XIIe siècle et formalisée le 16 septembre 1331 par la constitution Ratio iuris du pape Jean XXII. Opérant d'abord depuis Avignon puis depuis le Palais apostolique, son collège d'auditeurs rotatifs est devenu la cour d'appel suprême de la chrétienté latine pour les affaires ecclésiastiques et civiles. Il s’agit du plus ancien tribunal en activité en Europe."
 rom_banco_santo_spirito_bureaucracy: "Banque de Santo Spirito"
 rom_banco_santo_spirito_bureaucracy_desc: "Fondée par le pape Paul V le 13 décembre 1605 dans le Palazzo del Banco construit sous Léon X sur la Via dei Banchi, la Banque du Saint-Esprit fut la première banque centrale d'Europe à opérer au-dessus du niveau de la cité-État. Subordonnée à l'archihôpital de Santo Spirito (fondé en 1201), elle fut le premier émetteur de papier-monnaie en 1786 sous Pie VI et resta la principale source de crédit pour la construction ecclésiastique et commerciale dans les États pontificaux pendant près de quatre siècles."
 rom_pontifex_maximus_bureaucracy: "Pontife Maxime"
 rom_pontifex_maximus_bureaucracy_desc: "Titre de grand prêtre de la religion d'État romaine, détenu par Auguste et ses successeurs jusqu'à ce que Gratien le cède en 383 à l'évêque Damase de Rome. Latent dans la majeure partie de la papauté médiévale, le titre a été relancé au XVe siècle par les papes humanistes - Nicolas V, Pie II et surtout Jules II - comme un programme délibéré représentant le pontife romain comme héritier de la dignité impériale des Césars et fusionnant l'Antiquité classique avec l'Église militante."

# Auto-modifier loc
 AUTO_MODIFIER_NAME_nd_rom_bureaucracy_authority: "Autorité impériale romaine"
 AUTO_MODIFIER_DESC_nd_rom_bureaucracy_authority: "The restored empire inherits the Senate, the papal Curia, the jurists of Bologna and the treasuries of the city of Rome. It can sustain four more standing institutions."
