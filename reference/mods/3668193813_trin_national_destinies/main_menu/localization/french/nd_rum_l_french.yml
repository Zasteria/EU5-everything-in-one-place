l_french:
 STATIC_MODIFIER_NAME_nd_sultan_of_two_seas: "Sultan des Deux Mers"
 STATIC_MODIFIER_DESC_nd_sultan_of_two_seas: "Tout comme Alaeddin Keykubat régnait autrefois de la Méditerranée à la mer Noire, le sultanat de Rum projettera également sa puissance sur les deux côtes de l’Anatolie. Notre cavalerie tonnera à travers les plateaux et nos galères domineront les détroits."
 STATIC_MODIFIER_NAME_nd_crossroads_of_civilizations: "Carrefour des civilisations"
 STATIC_MODIFIER_DESC_nd_crossroads_of_civilizations: "L'Anatolie a toujours été au point de rencontre de l'Est et de l'Ouest. Le Sultanat de Rum embrassera cet héritage, accueillant des marchands de tous les pays et des érudits de toutes traditions, construisant un royaume où le commerce et la culture prospèrent ensemble."
 STATIC_MODIFIER_NAME_nd_rum_ahi_revival: "Renaissance de la Confrérie Ahi"
 STATIC_MODIFIER_DESC_nd_rum_ahi_revival: "Les guildes Ahi ont été revigorées, leurs ateliers bourdonnent de productivité et leurs principes de commerce honnête et d'entraide se répandent dans les villes d'Anatolie."
 STATIC_MODIFIER_NAME_nd_rum_mevlana_legacy: "L'héritage de Mevlana"
 STATIC_MODIFIER_DESC_nd_rum_mevlana_legacy: "Les enseignements de Mevlana Rumi résonnent à travers les tekkes et les medreses de Rum, inspirant une tolérance et une profondeur spirituelle qui attirent les chercheurs du monde islamique."
 nd_rum.1.t: "Le Sultanat restauré"
 nd_rum.1.d: "The banner of the Seljuks flies once more over the heartland of Anatolia. Where once a dozen beyliks squabbled over the carcass of the old sultanate, a single sovereign now commands the allegiance of all Turkic lords from the Black Sea to the Mediterranean. The caravanserais that line the ancient roads stand ready to channel the wealth of nations, while the ghulam cavalry that once rode at the Sultan's side awaits a new master's call.\n\nThe question now is what manner of realm this restored sultanate shall become. Shall it follow the path of the warrior-sultans who once made the Crusaders tremble and the Byzantines flee, projecting military power across two seas? Or shall it embrace its destiny as the great crossroads of civilization, where Persian poetry, Greek philosophy, and Turkic valor meet in the bazaars and medreses of Konya and Kayseri?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_rum.1.a: "Nous sommes le Sultan des Deux Mers !"
 nd_rum.1.b: "Nous sommes au carrefour des civilisations !"
 nd_rum.2.t: "La Confrérie Ahi renaît"
 nd_rum.2.d: "Les ateliers de nos villes s'animent avec un esprit jamais vu depuis l'époque d'Ahi Evran lui-même. Les confréries Ahi, ces guildes remarquables qui allient la dévotion soufie à un savoir-faire honnête, se sont réorganisées sous notre patronage. Des tanneurs aux chaudronniers, des tisserands aux forgerons, les artisans d'Anatolie se lient par des serments de fraternité, d'équité et d'entraide. Leurs zaviyes servent d'hôtellerie aux voyageurs, leurs conseils règlent les différends sans recours aux tribunaux, et leurs jeunes apprentis s'entraînent aux armes comme aux métiers, prêts à défendre les villes qui les soutiennent."
 nd_rum.2.a: "Laissez les guildes prospérer sous notre protection."
 nd_rum.2.b: "Laissons les confréries unir nos communautés."
 nd_rum.3.t: "Les Derviches tourneurs de Konya"
 nd_rum.3.d: "Dans le tekke de Konya, les adeptes de Mevlana Jalaluddin Rumi poursuivent la pratique sublime du sema : la danse tourbillonnante qui rapproche le dévot du divin. L'Ordre Mevlevi est devenu le cœur spirituel de notre royaume, attirant des poètes, des érudits et des mystiques du monde islamique. Leur message d’amour et de tolérance universels a atténué les conflits sectaires et inspiré une floraison de littérature et de musique persanes qui confère au sultanat de Roum un prestige bien au-delà de ce que les armées seules pourraient réaliser."
 nd_rum.3.a: "Les derviches apportent sagesse et harmonie à notre royaume."
 nd_rum.3.b: "Leurs bibliothèques et leurs écoles constituent le véritable trésor."
 nd_rum.4.t: "Les chantiers navals des Deux Mers"
 nd_rum.4.d: "Le grand chantier naval d'Alanya, creusé dans la paroi rocheuse de la péninsule de la Tour Rouge, résonne une fois de plus du bruit du marteau et de la scie. Construite par le sultan Alaeddin Keykubat pour projeter la puissance seldjoukide à travers la Méditerranée, cette structure remarquable, composée de cinq galeries voûtées ouvertes sur la mer, permet désormais de lancer des navires portant notre étendard. Avec les installations navales de Sinop sur la mer Noire, notre royaume contrôle les côtes que les anciens sultans seldjoukides appelaient leurs domaines jumeaux. Le Sultan des Deux Mers n'est plus seulement un titre."
 nd_rum.4.a: "Nos galères domineront les deux mers."
 nd_rum_ghulam_tradition: "Tradition de la cavalerie Ghulam"
 nd_rum_ghulam_tradition_desc: "La pratique seldjoukide consistant à former des soldats esclaves d’élite, les ghulams, en une force de cavalerie disciplinée fidèle uniquement au sultan. Issus de jeunes capturés et entraînés à l'équitation et au combat, ces guerriers formaient l'épine dorsale de la garde royale seldjoukide."
 nd_rum_caravanserai_network: "Réseau de caravansérails"
 nd_rum_caravanserai_network_desc: "Les Seldjoukides ont construit plus d'une centaine de caravansérails à travers l'Anatolie, espacés d'une journée de voyage le long des routes commerciales. Ces points de passage fortifiés offraient un hébergement, de la nourriture et des soins médicaux gratuits à tous les voyageurs pendant trois jours : un système d'infrastructure commerciale remarquable."
 nd_rum_turkmen_raiders: "Raiders turkmènes"
 nd_rum_turkmen_raiders_desc: "Les tribus turkmènes semi-nomades qui formèrent l'avant-garde de l'expansion seldjoukide. Rapides, intrépides et adeptes des tactiques de délit de fuite, ils servaient de pilleurs de frontières et d'éclaireurs du sultanat."
 nd_rum_iqta_system: "Système de concession de terres Iqta"
 nd_rum_iqta_system_desc: "Le système seldjoukide accorde des droits fiscaux sur des parcelles de terrain aux commandants militaires en échange d'un service de cavalerie. Cet arrangement de type timar garantissait un approvisionnement immédiat en guerriers à cheval sans maintenir une armée permanente permanente."
 nd_rum_medrese_foundations: "Fondations Medrese"
 nd_rum_medrese_foundations_desc: "Les grandes medreses de Konya, Kayseri et Sivas, institutions d'enseignement islamique qui ont préservé et transmis les connaissances en théologie, droit, médecine et mathématiques pendant l'âge d'or seldjoukide."
 nd_rum_seljuk_bureaucracy: "Tradition administrative seldjoukide"
 nd_rum_seljuk_bureaucracy_desc: "Le système bureaucratique d'influence perse a hérité du Grand Empire Seldjoukide, avec ses conseils de divan, ses vizirs et ses structures de gouvernance provinciales qui maintenaient l'ordre parmi les diverses populations d'Anatolie."
 nd_rum_uc_beyleri: "Guerriers Beylik de la Frontière"
 nd_rum_uc_beyleri_desc: "Les uc beyleri, seigneurs frontaliers qui entretenaient des garnisons le long de la frontière byzantine. Leurs guerriers, endurcis par des escarmouches constantes, servaient de première ligne de défense et de fer de lance de l'expansion."
 nd_rum_ahi_guilds: "Guildes de la Confrérie Ahi"
 nd_rum_ahi_guilds_desc: "Les remarquables confréries Ahi qui allient spiritualité soufie et savoir-faire artisanal. Fondées par Ahi Evran au XIIIe siècle, ces corporations organisaient les artisans, réglementaient le commerce, fournissaient des services sociaux et entretenaient même des milices armées pour la défense urbaine."
 nd_rum_alanya_shipyard: "Chantier naval d'Alanya"
 nd_rum_alanya_shipyard_desc: "Le grand arsenal naval d'Alanya, construit en 1227 par le sultan Alaeddin Keykubat. Creusées dans la presqu'île rocheuse sous la Tour Rouge, ses cinq galeries voûtées permettaient de construire et de lancer des navires directement dans la Méditerranée."
 nd_rum_mevlevi_order: "Ordre Mevlevi"
 nd_rum_mevlevi_order_desc: "L'ordre soufi fondé par les adeptes de Mevlana Jalaluddin Rumi à Konya. Connus pour leur cérémonie de derviche tourneur (sema), les Mevlevi sont devenus l'un des mouvements spirituels les plus influents du monde islamique."
 nd_rum_darussifa: "Tradition Darssifa"
 nd_rum_darussifa_desc: "La tradition seldjoukide de construire des hôpitaux (darssifas) rattachés aux complexes de mosquées. Ces institutions fournissaient des soins médicaux à tous, sans distinction de foi ou de richesse, et perfectionnaient les connaissances médicales grâce à des traitements pratiques."
 nd_rum_persian_court: "Culture de cour turco-persane"
 nd_rum_persian_court_desc: "La culture de cour raffinée du sultanat de Roum, où le persan était la langue de la poésie et de l'administration, l'arabe la langue de la religion et le turc la langue militaire : une civilisation trilingue d'une sophistication remarquable."
 nd_rum_silk_trade: "Commerce de la soie anatolienne"
 nd_rum_silk_trade_desc: "The silk production and trade that flourished in Anatolia under Seljuk patronage, with Bursa and other cities becoming major centers of silk weaving that supplied markets across the Mediterranean. The looms stand in the halls of the Ahi guilds."
 nd_rum_sipahi_tradition: "Cavalerie Sipahi"
 nd_rum_sipahi_tradition_desc: "La force de cavalerie professionnelle soutenue par le système de concession de terres timar. Les Sipahis étaient tenus d'entretenir des chevaux, de l'équipement et des serviteurs en échange des revenus de leurs terres assignées : un système militaire féodal qui produisait de redoutables guerriers à cheval."
 nd_rum_composite_bowmen: "Tradition de l’arc composite"
 nd_rum_composite_bowmen_desc: "La maîtrise turque de l'arc composite : une arme de corne, de bois et de tendons qui pouvait être utilisée à cheval ou à pied. Cette tradition d'excellence en tir à l'arc a donné aux armées anatoliennes un avantage décisif à distance."
 nd_rum_grand_bazaar: "Grand Bazar"
 nd_rum_grand_bazaar_desc: "Les marchés couverts des grandes villes anatoliennes, où des centaines de magasins proposaient des produits du monde connu. Ces centres commerciaux animés constituaient le cœur économique du sultanat."
 nd_rum_dhimmi_tolerance: "Tolérance Dhimmi"
 nd_rum_dhimmi_tolerance_desc: "La politique seldjoukide de tolérance relative envers les communautés chrétiennes, juives et autres non musulmanes. Les artisans grecs, les marchands arméniens et les soldats géorgiens ont tous trouvé leur place au sein de la société diversifiée du sultanat."
 nd_rum_carpet_production: "Tradition du tapis anatolien"
 nd_rum_carpet_production_desc: "The distinctive carpet weaving traditions of Anatolia, which blended Central Asian nomadic patterns with settled workshop techniques to create some of the most prized textiles in the world. The guild halls of the towns take up the craft."
 nd_rum_anatolian_fortresses: "Tradition de la forteresse anatolienne"
 nd_rum_anatolian_fortresses_desc: "Le réseau de châteaux et de fortifications construits sur le terrain montagneux de l'Anatolie, depuis les citadelles d'Ankara et de Konya jusqu'aux forteresses côtières d'Alanya et de Sinop."
 nd_rum_port_system: "Système portuaire des deux mers"
 nd_rum_port_system_desc: "Le développement des installations portuaires sur les côtes de la Méditerranée et de la mer Noire, répondant à l'ambition seldjoukide d'être le sultan des deux mers et contrôlant le commerce maritime le long des deux côtes."
 nd_rum_azab_levies: "Infanterie légère Azab"
 nd_rum_azab_levies_desc: "Infanterie auxiliaire légère issue de la population paysanne, les azabs servaient de troupes de garnison, d'auxiliaires de siège et d'écrans remplaçables pour la cavalerie la plus précieuse. Leur grand nombre compensait leur moindre équipement."
 nd_rum_gunpowder_adoption: "Arsenal de poudre à canon"
 nd_rum_gunpowder_adoption_desc: "La création d'arsenaux pour la production et le stockage d'armes à poudre (canons, bombardes, puis armes à feu) marquant le passage d'une guerre purement cavalière à une tactique interarmes."
 nd_rum_trade_insurance: "Système d'assurance commerciale"
 nd_rum_trade_insurance_desc: "L'innovation seldjoukide de l'assurance commerciale soutenue par l'État, où le trésor indemnisait les marchands pour les marchandises perdues à cause du banditisme ou d'un accident de la route. Ce système remarquable encourageait le commerce à longue distance en réduisant les risques."
 nd_rum_copper_works: "Travaux de cuivre anatoliens"
 nd_rum_copper_works_desc: "The exploitation of Anatolia's rich copper deposits, particularly around Kastamonu and Tokat, which supplied raw material for the distinctive Seljuk metalwork tradition of engraved copper vessels and decorative arts. The coppersmiths work in the halls of the Ahi guilds."
 nd_rum_waqf_system: "Système de dotation Waqf"
 nd_rum_waqf_system_desc: "Le système de dotations caritatives (waqf) qui finançait les médres, les hôpitaux, les caravansérails et les soupes populaires. Ces pieuses fondations fournissaient une source de revenus stable aux institutions publiques échappant au contrôle direct de l’État."
 nd_rum_akinci_raiders: "Akinci Raiders"
 nd_rum_akinci_raiders_desc: "L'akinci, cavalerie légère irrégulière qui servait d'avant-garde et de force de raid du sultanat. Opérant en avance sur l'armée principale, ils ont exploré le territoire ennemi, perturbé les lignes d'approvisionnement et semé la terreur grâce à des raids rapides et dévastateurs."
 nd_rum_imperial_administration: "Administration impériale"
 nd_rum_imperial_administration_desc: "La centralisation de la gouvernance provinciale sous la direction de fonctionnaires nommés, remplaçant le système beylik semi-autonome par une structure administrative plus unifiée digne d'un empire."
 nd_rum_nizam_troops: "Nizam-i Jedid"
 nd_rum_nizam_troops_desc: "Le Nouvel Ordre, une infanterie disciplinée entraînée selon les lignes de l'Europe occidentale, équipée d'armes à feu et d'exercices modernes. Cette réforme visait à créer une armée permanente professionnelle pour remplacer les forces traditionnelles de moins en moins fiables."
 nd_rum_state_manufactories: "Manufactures d'État"
 nd_rum_state_manufactories_desc: "Des installations de production centralisées établies sous la direction de l’État, produisant des textiles, des armes et d’autres biens destinés à la fois à la consommation intérieure et à l’exportation : une première tentative d’industrialisation dirigée par l’État."
 nd_rum_tax_reform: "Réforme fiscale centralisée"
 nd_rum_tax_reform_desc: "L'abolition de l'agriculture fiscale et la mise en place d'une perception directe des impôts par les fonctionnaires salariés, augmentant les revenus de l'État et réduisant l'exploitation des paysans par les collecteurs d'impôts intermédiaires."
 nd_rum_mohair_industry: "Industrie du Mohair Angora"
 nd_rum_mohair_industry_desc: "Le traitement du mohair provenant des chèvres Angora originaires d'Anatolie centrale : une fibre de luxe prisée dans toute l'Europe pour son éclat brillant et sa douceur, constituant un produit d'exportation lucratif."
 nd_rum_naval_modernization: "Modernisation navale"
 nd_rum_naval_modernization_desc: "La modernisation des capacités navales du Sultanat, en s'appuyant sur la tradition seldjoukide des chantiers navals d'Alanya et de Sinop pour créer une flotte capable de projeter sa puissance en Méditerranée."
 nd_rum_xebec_fleet: "Kırlangıç Squadrons"
 nd_rum_xebec_fleet_desc: "The adoption of the kırlangıç, the swallow of the Ottoman fleet: a fast, lateen-rigged Mediterranean vessel ideal for both commerce raiding and coastal patrol. Light and maneuverable, it could outrun heavier European warships."
 nd_rum_modern_army: "Armée anatolienne moderne"
 nd_rum_modern_army_desc: "La transformation finale de l'armée du Sultanat en une force moderne, des officiers professionnels, un équipement standardisé et des tactiques modernes remplaçant les derniers vestiges de la tradition militaire médiévale."
 nd_rum_anatolian_railways: "Chemin de fer anatolien"
 nd_rum_anatolian_railways_desc: "La construction de lignes ferroviaires reliant les villes d'Anatolie, reliant le royaume avec des rails de fer et permettant un mouvement rapide des troupes et des marchandises à travers le plateau."
 nd_rum_constitutional_reform: "Réforme constitutionnelle"
 nd_rum_constitutional_reform_desc: "L’introduction de principes constitutionnels limitant l’autorité royale et créant des organes consultatifs : une réforme modernisatrice qui cherchait à renforcer l’État par une gouvernance partagée."
 nd_rum_conscription: "Conscription universelle"
 nd_rum_conscription_desc: "L'introduction du service militaire obligatoire pour tous les sujets masculins, créant une armée de masse qui faisait appel à l'ensemble de la population plutôt que de compter uniquement sur des soldats professionnels et des levées féodales."
 nd_rum_national_awakening: "Réveil national anatolien"
 nd_rum_national_awakening_desc: "L’émergence d’une conscience nationale moderne parmi les peuples d’Anatolie, portée par l’imprimerie, l’éducation publique et un sentiment croissant d’identité partagée transcendant les loyautés tribales et régionales."
 nd_rum_anatolian_mining: "Industrie minière anatolienne"
 nd_rum_anatolian_mining_desc: "The industrial exploitation of Anatolia's mineral wealth: chromite, iron, and copper deposits that would become strategically vital resources in the age of modern industry. The ores of the plateau are brought to the furnaces of the state manufactories and made into steel."
 a_nd_rum_ghulam: "Cavalerie Ghulam"
 a_nd_rum_ghulam_desc: "Elite slave cavalry loyal only to the Sultan. Capturés dans leur jeunesse et entraînés à l'équitation et au combat dès l'enfance, les ghulams formaient la force de cavalerie la plus disciplinée et la plus fiable de l'armée seldjoukide."
 a_nd_rum_turkmen_raider: "Raider turkmène"
 a_nd_rum_turkmen_raider_desc: "Cavalerie légère turkmène semi-nomade, maître de la tradition des raids dans la steppe. Cavaliers rapides, insaisissables et experts, ils frappent sans avertissement et disparaissent avant que l'ennemi ne puisse répondre."
 a_nd_rum_uc_warrior: "Guerrier Uc"
 a_nd_rum_uc_warrior_desc: "Infanterie de garnison frontalière des marches frontalières (uc). Endurcis par les escarmouches constantes avec les forces byzantines et croisées, ces guerriers sont coriaces, ingénieux et habitués à se battre en infériorité numérique."
 n_nd_rum_seljuk_galley: "Galère de guerre seldjoukide"
 n_nd_rum_seljuk_galley_desc: "Une galère de guerre lourde construite dans la tradition des chantiers navals d'Alanya. Plus robustes et plus rapides que les galères standards, ces navires portent la bannière du Sultan aussi bien sur la Méditerranée que sur la mer Noire."
 a_nd_rum_sipahi: "Sipahi"
 a_nd_rum_sipahi_desc: "Cavalerie lourde professionnelle soutenue par le système de concession de terres Timar. Chaque sipahi possède ses propres chevaux de guerre, armes et serviteurs : un chevalier féodal du monde turc, redoutable à la fois dans la charge de choc et dans la poursuite."
 a_nd_rum_composite_archer: "Archer à arc composite"
 a_nd_rum_composite_archer_desc: "Infanterie armée du puissant arc composite turc, capable de lancer des volées dévastatrices à des distances que les arbalétriers européens ont du mal à égaler. Leur cadence de tir rapide et leur mobilité les rendent mortels en terrain découvert."
 a_nd_rum_azab: "Azab"
 a_nd_rum_azab_desc: "Infanterie légère auxiliaire levée auprès de la population paysanne. Bien que légèrement équipés, les azabs servent d'écrans remplaçables, de troupes de garnison et d'ouvriers de siège, libérant la cavalerie professionnelle pour des engagements décisifs."
 a_nd_rum_akinci: "Akinci Raider"
 a_nd_rum_akinci_desc: "Cavalerie légère irrégulière qui devance l'armée principale, attaquant profondément le territoire ennemi. Leur rapidité, leur férocité et leur habileté à vivre de la terre en font la terreur des populations frontalières et le fléau de la logistique ennemie."
 a_nd_rum_nizam: "Nizam-i Jedid"
 a_nd_rum_nizam_desc: "Soldats du Nouvel Ordre, infanterie disciplinée entraînée aux tactiques de style européen, équipée de mousquets et de baïonnettes modernes. Ils représentent la pointe de la réforme militaire dans le sultanat."
 n_nd_rum_xebec: "Kırlangıç"
 n_nd_rum_xebec_desc: "A fast, lateen-rigged Mediterranean vessel equally suited to commerce raiding and naval patrol. Light and maneuverable, the kırlangıç can outrun most warships and outfight most merchantmen."
 a_nd_rum_modern_infantry: "Infanterie anatolienne moderne"
 a_nd_rum_modern_infantry_desc: "Soldats professionnels du sultanat moderne, équipés de mousquets rayés et entraînés aux tactiques européennes contemporaines. Le point culminant de décennies de réforme militaire."
 a_nd_rum_conscript: "Conscrit anatolien"
 a_nd_rum_conscript_desc: "Des soldats venus de toute l’Anatolie grâce à la conscription universelle. Bien que moins expérimentées que les troupes professionnelles, leur nombre et leur esprit combatif en font une force redoutable."
 nd_rum_caravanserai: "Caravansérail"
 nd_rum_caravanserai_desc: "Une auberge fortifiée en bord de route offrant un abri, de la nourriture et des soins médicaux aux marchands et aux voyageurs de passage. Les Seldjoukides en construisirent plus d'une centaine à travers l'Anatolie, chacun espacé d'une journée de voyage."
 nd_rum_medrese: "Medrese"
 nd_rum_medrese_desc: "Une institution islamique d'enseignement supérieur, enseignant la théologie, le droit, la médecine et les mathématiques. Les grandes médreses de Konya et de Kayseri étaient des centres d'érudition renommés dans le monde islamique médiéval."
 nd_rum_ahi_guild_hall: "Salle de la guilde Ahi"
 nd_rum_ahi_guild_hall_desc: "La salle de réunion et l'atelier d'une confrérie Ahi, en partie salle de guilde, en partie loge soufie, en partie armurerie de la milice. Ici, les artisans apprennent leur métier, règlent les différends et entretiennent le tissu social de la ville."
 nd_rum_bazaar: "Grand Bazar"
 nd_rum_bazaar_desc: "Un marché couvert où des centaines de magasins proposent des produits du monde connu. Le cœur économique de la ville, où la soie, les épices, le cuivre et les tapis rencontrent le porte-monnaie de l'acheteur."
 nd_rum_port_warehouse: "Entrepôt portuaire"
 nd_rum_port_warehouse_desc: "Installations de stockage et d'amarrage côtiers soutenant le commerce maritime du Sultanat. Les marchandises sont chargées et déchargées sous le regard vigilant de la capitainerie du port."
 nd_rum_arsenal: "Arsenal de poudre à canon"
 nd_rum_arsenal_desc: "Une installation militaire pour la production et le stockage de canons, de mousquets et de poudre à canon. L'arsenal marque la transition vers une guerre moderne dans le Sultanat."
 nd_rum_manufactory: "Manufacture d'État"
 nd_rum_manufactory_desc: "Une installation de production dirigée par l'État produisant des textiles, de la métallurgie et d'autres biens destinés à l'usage national et à l'exportation."
 nd_rum_railway_station: "Gare"
 nd_rum_railway_station_desc: "Une gare le long des nouvelles lignes ferroviaires reliant les villes d'Anatolie entre elles. Des rails de fer transportent des marchandises, des soldats et des idées à travers le plateau à une vitesse sans précédent."
 nd_caravanserai_upkeep: "Entretien du caravansérail"
 nd_caravanserai_upkeep_desc: "Providing food, fodder, firewood, and shelter for merchants and their animals at a Seljuk roadside inn."
 nd_medrese_upkeep: "Entretien de la Medrese"
 nd_medrese_upkeep_desc: "Fournir à un établissement d’enseignement islamique du papier, des livres et du matériel scientifique."
 nd_ahi_guild_upkeep: "Production de la salle de guilde"
 nd_ahi_guild_upkeep_desc: "Les artisans Ahi tissent de la laine avec des teintures fines pour en faire des tissus teints, suivant les traditions de la guilde d'Ahi Evran."
 nd_darussifa_upkeep: "Entretien de l'hôpital"
 nd_darussifa_upkeep_desc: "Maintaining a Seljuk hospital with medicaments, linen for dressings, and pottery for pharmacological preparations."
 nd_bazaar_upkeep: "Entretien du bazar"
 nd_bazaar_upkeep_desc: "Entretien des halles couvertes et des étals marchands d'un grand bazar."
 nd_port_warehouse_upkeep: "Entretien des entrepôts portuaires"
 nd_port_warehouse_upkeep_desc: "Entretenir les infrastructures de commerce côtier avec du bois et des fournitures navales."
 nd_arsenal_upkeep: "Entretien de l'arsenal"
 nd_arsenal_upkeep_desc: "Fabriquer et stocker des armes, des canons et des fournitures militaires."
 nd_manufactory_upkeep: "Entretien de l'usine"
 nd_manufactory_upkeep_desc: "Exploitation d'une manufacture dirigée par l'État produisant des textiles et de la métallurgie."
 nd_railway_upkeep: "Entretien ferroviaire"
 nd_railway_upkeep_desc: "Entretenir les rails en fer, les traverses en bois et les infrastructures de la gare."
 nd_rum_silk_weaving: "Tissage de la soie"
 nd_rum_silk_weaving_desc: "The guild's looms are turned to the Bursa silk tradition: raw silk and fine dyes are woven into luxurious textiles."
 nd_rum_carpet_weaving: "Tissage de tapis"
 nd_rum_carpet_weaving_desc: "The guild's workshops are given over to carpets: wool is dyed with indigo and with madder fixed in alum, and hand-knotted into intricate geometric patterns."
 nd_rum_copper_smelting: "Coppersmithing"
 nd_rum_copper_smelting_desc: "The guild's coppersmiths beat the copper of Kastamonu and Tokat into cauldrons, ewers, trays, and tools."
 nd_rum_mohair_processing: "Traitement du mohair"
 nd_rum_mohair_processing_desc: "Transformation de la toison de chèvre Angora avec de la soie pour obtenir des textiles mohair brillants prisés dans toute l'Europe."
 nd_rum_steel_furnaces: "Steel Furnaces"
 nd_rum_steel_furnaces_desc: "The iron of Divriği and Bilecik is smelted with the coal of Ereğli into steel in the furnaces of the state."
 STATIC_MODIFIER_NAME_nd_rum_guild_solidarity: "Solidarité de guilde"
 STATIC_MODIFIER_DESC_nd_rum_guild_solidarity: "Les confréries Ahi unissent les communautés par le partage de l'artisanat, l'entraide et la défense civique armée : un réseau de solidarité qui renforce le tissu social du royaume."
 STATIC_MODIFIER_NAME_nd_rum_mevlevi_scholarship: "Bourse Mevlevi"
 STATIC_MODIFIER_DESC_nd_rum_mevlevi_scholarship: "Les bibliothèques et écoles Mevlevi attirent des érudits et des poètes du monde islamique, faisant du Sultanat un centre d’apprentissage et de réalisation artistique."
 nd_rum_formed_tt: "Le rhum s'est formé"
 nd_rum_path_a_tt: "A choisi le sultan des deux mers"
 nd_rum_path_b_tt: "A choisi le carrefour des civilisations"
 nd_rum_destiny: "Destin du rhum"
 nd_rum_destiny_desc: "Le sultanat a été restauré. Choisissez maintenant la voie qui définira son héritage : projeterez-vous votre puissance sur deux mers ou construirez-vous le plus grand carrefour de civilisation que le monde ait connu ?"
 nd_rum_dest_coasts: "Commandez les côtes"
 nd_rum_dest_coasts_desc: "Sécurisez les villes portes qui gardent les frontières de l'Anatolie. Alep ouvre la route vers la Syrie et le Levant, tandis qu'Edirne commande le passage vers l'Europe. Une fois ces ancres tenues, le sultan des Deux Mers commence à mériter son titre."
 nd_rum_dest_straits: "Maître du détroit"
 nd_rum_dest_straits_desc: "La ville de Constantine et le siège des califes abbassides doivent tous deux s'incliner devant la bannière du sultan. Constantinople contrôle le détroit entre l’Europe et l’Asie, tandis que Bagdad constitue le point d’ancrage des confins orientaux du monde islamique."
 nd_rum_dest_sultan: "Sultan des Sultans"
 nd_rum_dest_sultan_desc: "L’aspiration ultime de la souveraineté turque : tenir Le Caire, Tabriz et La Mecque sous une seule bannière. Le souverain qui contrôle le Nil, la frontière caspienne et les villes saintes de l’Islam peut à juste titre revendiquer le titre de Sultan des Sultans."
 nd_rum_dest_silkroad: "La renaissance de la Route de la Soie"
 nd_rum_dest_silkroad_desc: "L'Anatolie se situe au terminus occidental de l'ancienne Route de la Soie. En développant les institutions bancaires et en assurant la circulation de la soie sur le marché des capitaux, le Sultanat peut redevenir le grand pont commercial entre l’Est et l’Ouest."
 nd_rum_dest_emporium: "Emporium de l'Est"
 nd_rum_dest_emporium_desc: "The markets of Rum overflow with the riches of the world. Saffron from the Anatolian highlands joins silk, copper, and wool in bazaars that rival any in the world. Sivas, where the road from Tabriz meets the roads to Sinop and the Cilician ports, is held and grown into the emporium it was under the Seljuk sultans."
 nd_rum_dest_sivas_developed_tt: "#bold Sivas#! is owned and has at least #bold 29#! development"
 nd_rum_dest_crossroads: "Lumière d'Anatolie"
 nd_rum_dest_crossroads_desc: "The Sultanate stands at the pinnacle of civilization: a realm where scientific inquiry, artistic achievement, and commercial prosperity have merged into something greater than any of its parts. Medreses stand in five of its towns and hospitals that teach medicine in two of its cities. Konya, the capital of the Seljuk sultans and the city of Mevlana, is held and built up to twice what it was. The Light of Anatolia shines across the world."
 nd_rum_dest_konya_developed_tt: "#bold Konya#! is owned and has at least #bold 46#! development"
 nd_rum.5.t: "Le destin du rhum"
 nd_rum.5.d: "Le sultanat de Rum est restauré et stable, ses terres étant unies sous un seul souverain. Les anciennes routes d'Anatolie transportent aussi bien des marchands que des soldats, et les medreses bourdonnent d'érudition. Le destin du royaume se déroule désormais devant nous."
 nd_rum.5.a: "Un nouveau chapitre commence."
 nd_rum.6.t: "Les côtes sécurisées"
 nd_rum.6.d: "La bannière du Sultanat flotte sur Alep et Edirne. Des minarets de Syrie aux murs de Thrace, l’autorité du sultan s’étend au-delà du cœur de l’Anatolie. Les côtes de la Méditerranée et de la mer Noire s’ouvrent à nos ambitions, et le titre de Sultan des Deux Mers prend un nouveau sens."
 nd_rum.6.a: "Les mers connaîtront notre nom."
 nd_rum.7.t: "Maître du détroit"
 nd_rum.7.d: "Constantinople et Bagdad sont tombés aux mains de nos armées. La cité des empereurs et la cité des califes répondent désormais au sultan de Rum. Cette double conquête fait écho aux ambitions des plus grands empires islamiques : allons-nous adopter l’esprit guerrier ghazi qui a conquis ces villes, ou forger une garde impériale professionnelle digne de les gouverner ?"
 nd_rum.7.a: "L'esprit ghazi brûle dans nos cœurs."
 nd_rum.7.b: "Une garde impériale défendra nos conquêtes."
 nd_rum.8.t: "Sultan des Sultans"
 nd_rum.8.d: "Le Caire, Tabriz et la Mecque s'inclinent devant notre trône. La richesse du Nil, la force de la frontière caspienne et l'autorité spirituelle des Villes saintes convergent toutes dans notre royaume. Aucun sultan dans le monde islamique ne possède un tel pouvoir ou un tel prestige. Devrions-nous revendiquer la souveraineté universelle qu’exige cette position, ou établir une paix durable sur les terres d’Islam ?"
 nd_rum.8.a: "Nous sommes le Sultan Universel."
 nd_rum.8.b: "Bâtissons une Pax Islamique."
 nd_rum.9.t: "La Route de la Soie relancée"
 nd_rum.9.d: "The caravanserais that dot the Anatolian landscape once more bustle with merchants bearing silk from the East. Our banking houses extend credit, our bazaars overflow with exotic goods, and the name of Rum is spoken with respect in trading houses from Venice to Samarkand. The old Silk Road lives again, with our cities at its heart."
 nd_rum.9.a: "La richesse des nations coule entre nos mains."
 nd_rum.10.t: "Le grand magasin"
 nd_rum.10.d: "Les marchés du rhum se sont développés au-delà de simples étapes sur la Route de la Soie. Le safran, la soie, la laine et le cuivre transitent dans nos bazars en quantités qui étonnent les visiteurs étrangers. Nos marchands sont devenus des puissances indépendantes. Allons-nous donner à ces princes marchands les moyens d’étendre notre portée commerciale ou de nourrir l’économie de bazar qui fait de nos villes l’envie du monde ?"
 nd_rum.10.a: "Donnez du pouvoir aux princes marchands."
 nd_rum.10.b: "Les bazars sont le cœur de notre richesse."
 nd_rum.11.t: "La lumière de l'Anatolie"
 nd_rum.11.d: "Le sultanat de Rhum est un phare de civilisation. Nos érudits font progresser les connaissances humaines, nos artisans créent des œuvres d’une beauté durable et nos marchands relient les peuples du monde. Cet épanouissement prendra-t-il la forme d’une grande renaissance culturelle et spirituelle, ou construirons-nous un empire de caravanes qui relie les continents entre eux par le commerce ?"
 nd_rum.11.a: "Laissez la sagesse de l'Anatolie éclairer le monde."
 nd_rum.11.b: "Les caravanes relieront le monde."
 STATIC_MODIFIER_NAME_nd_rum_dest_ghazi_spirit: "Esprit du Ghazi"
 STATIC_MODIFIER_DESC_nd_rum_dest_ghazi_spirit: "La tradition guerrière sacrée des Ghazis frontaliers alimente nos armées d’une juste ferveur, leur permettant de se rétablir rapidement et de combattre avec une détermination infatigable."
 STATIC_MODIFIER_NAME_nd_rum_dest_imperial_guard: "Garde Impériale"
 STATIC_MODIFIER_DESC_nd_rum_dest_imperial_guard: "Une garde impériale professionnelle garantit l’efficacité militaire sur terre et sur mer, même si le maintien d’une telle force d’élite met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_rum_dest_universal_sultan: "Sultan universel"
 STATIC_MODIFIER_DESC_nd_rum_dest_universal_sultan: "La revendication d’une souveraineté universelle sur le monde islamique impose la loyauté des sujets et le respect des rivaux, même si l’ambition impériale fait grimper toujours plus les coûts de construction."
 STATIC_MODIFIER_NAME_nd_rum_dest_pax_islamica: "Pax Islamique"
 STATIC_MODIFIER_DESC_nd_rum_dest_pax_islamica: "La paix du sultan s'étend sur toutes les terres d'Islam, permettant aux régions dévastées de se relever, aux divers peuples de s'intégrer et aux réseaux de renseignement d'atteindre tous les coins du royaume."
 STATIC_MODIFIER_NAME_nd_rum_dest_merchant_princes: "Princes Marchands du Rhum"
 STATIC_MODIFIER_DESC_nd_rum_dest_merchant_princes: "The great merchants of the Sultanate wield influence rivaling that of nobles, expanding diplomatic reach and trade revenue, though their commercial priorities sometimes divert resources from military supply."
 STATIC_MODIFIER_NAME_nd_rum_dest_bazaar_economy: "Économie du bazar"
 STATIC_MODIFIER_DESC_nd_rum_dest_bazaar_economy: "L'économie dynamique du bazar d'Anatolie stimule la production de matières premières, construit la tradition navale à travers le commerce côtier et donne à nos flottes l'expérience nécessaire pour renforcer le commerce maritime."
 STATIC_MODIFIER_NAME_nd_rum_dest_anatolian_renaissance: "Renaissance anatolienne"
 STATIC_MODIFIER_DESC_nd_rum_dest_anatolian_renaissance: "A great cultural and spiritual flowering transforms the Sultanate, drawing the faithful to its lodges and medreses, expanding governance capacity, and hardening the realm's defenses."
 STATIC_MODIFIER_NAME_nd_rum_dest_caravan_empire: "Empire des caravanes"
 STATIC_MODIFIER_DESC_nd_rum_dest_caravan_empire: "Un réseau commercial continental qui relie les religions et les civilisations, réduisant le coût des guerres au-delà des frontières religieuses tout en enrichissant la classe marchande et en projetant la puissance navale."
 nd_rum_imperial_divan: "Divan Impérial"
 nd_rum_imperial_divan_desc: "Le conseil suprême du sultan des sultans, où se décide le sort des empires. Cette grande salle de gouvernance projette l’autorité de la souveraineté universelle à travers le monde islamique."
 nd_rum_house_of_wisdom: "Maison de la Sagesse"
 nd_rum_house_of_wisdom_desc: "Une académie d'apprentissage qui rassemble des érudits, des traducteurs et des scientifiques du monde entier, faisant revivre l'esprit du grand Bayt al-Hikma abbasside au cœur de l'Anatolie."
 nd_divan_upkeep: "Administration du Divan"
 nd_divan_upkeep_desc: "Maintenir le conseil suprême du sultan des sultans avec de beaux documents, un mobilier luxueux et des tissus de cérémonie."
 nd_wisdom_upkeep: "Entretien de l'Académie"
 nd_wisdom_upkeep_desc: "Fournir à une académie d’apprentissage du papier, des livres savants et de l’encens pour l’atmosphère contemplative de l’étude."

 rum_divan_i_humayun_bureaucracy: "Divan-ı Âlâ"
 rum_divan_i_humayun_bureaucracy_desc: "The great council of the sultans of Rum, held again as it was at Konya. The vizier presides as sahib-i divan. Beside him sit the müstevfi who keeps the accounts, the tuğrai who draws the sultan's cipher, the müşrif who inspects, the arız who musters the army and the pervane who registers every grant of land. Petitions from the provinces are heard here, and the beys who once ruled alone now wait on its decisions."
 rum_devshirme_bureaucracy: "Gulamhane"
 rum_devshirme_bureaucracy_desc: "The school of the palace slaves, as the Seljuk sultans kept it. Boys taken in war or bought on the frontier, many of them Greek, are converted and raised in the palace as the sultan's own men. They fill his guard and his household offices and some rise to govern, as Celaleddin Karatay did. They owe nothing to any Turkmen house, and the Turkmen houses know it."
 rum_timar_system_bureaucracy: "Pervane"
 rum_timar_system_bureaucracy_desc: "The officer of the great divan who keeps the register of every grant of revenue made to a horseman, and seals its deed. A grant is held for service under arms, it is not inherited, and it is struck from the register when its holder fails the muster. While the register is kept the horsemen ride when called and their districts answer to the sultan. When it is not, grants pass from father to son and become lordships."
 rum_seyhulislam_bureaucracy: "Kadı'l-kudat"
 rum_seyhulislam_bureaucracy_desc: "The chief judge of the sultanate, seated at Konya. He names the kadı of every town and stands over the teachers of the medreses that the Seljuk viziers built at Konya, Kayseri and Sivas. His ruling gives the sultan's acts their lawfulness, and a learned man of any town can rise through his courts and schools without the favor of a bey."
 rum_vakif_network_bureaucracy: "Réseau Vakif"
 rum_vakif_network_bureaucracy_desc: "The charitable endowment, an irrevocable trust by which a sultan, a vizier or a princess sets aside the income of villages and shops for ever. The Seljuks of Rum endowed hospitals at Kayseri and Divriği, medreses at Konya and Sivas, and hans a day's march apart on the caravan roads, where any traveler is lodged and fed for three days. What is endowed is lost to the treasury and can not be taken back."
 rum_iltizam_bureaucracy: "Mukataa"
 rum_iltizam_bureaucracy_desc: "The farming of revenue. The right to collect what a district owes is sold for a sum paid in advance, and the buyer keeps whatever more he can raise. Anatolia was governed this way under the Ilkhans, when the great men of Konya bid for whole provinces. The treasury has its coin at once, and the village pays for the bidder's profit."
 rum_millet_system_bureaucracy: "Zimmet"
 rum_millet_system_bureaucracy_desc: "The covenant of protection as the sultans of Rum kept it. The Greek and Armenian towns of Anatolia keep their bishops and their churches, settle suits among themselves before their own clergy, and pay the cizye through their own headmen. A rock church in Cappadocia names the sultan beside the emperor in its dedication. The communities stay loyal and stay apart."

 AUTO_MODIFIER_NAME_nd_rum_bureaucracy_authority: "Divans of the Sultans of Rum"
 AUTO_MODIFIER_DESC_nd_rum_bureaucracy_authority: "The court of the new sultans keeps the offices of the Seljuks of Konya: the great divan, the chancery of the tuğrai, the treasury and the chief judge. Three more institutions can be kept at a time."
