 # === FORMATION EVENT ===
 nd_cth.1.t: "La renaissance de Carthage"
 nd_cth.1.d: "The ancient city rises again. Where once the Phoenician traders built a thalassocracy that rivaled Rome itself, a new Carthage now commands the crossroads of the Mediterranean. The cothon harbors of old may lie in ruins, but the spirit of Baal Hammon and the legacy of Hannibal Barca stir in the hearts of our people.\n\nTwo visions compete for the soul of this reborn nation. Shall we reclaim the seas as our ancestors did: masters of trade, shipbuilding, and maritime dominion from the Pillars of Hercules to the shores of Sicily? Or shall we forge a continental empire worthy of the Barcid generals, drawing upon the diverse peoples of Africa and Iberia as Carthage always did: not through citizen armies but through the disciplined strength of recruited nations?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cth.1.a: "Commandez les mers comme le faisaient nos ancêtres"
 nd_cth.1.b: "Construisez un empire digne des Barcides"

 # === FORMATION CHOICE MODIFIERS ===
 STATIC_MODIFIER_NAME_nd_cth_thalassocracy: "Thalasassocratie punique"
 STATIC_MODIFIER_DESC_nd_cth_thalassocracy: "Carthage contrôle la Méditerranée grâce aux mêmes instruments qui ont construit l'empire punique d'origine : un savoir-faire marin inégalé, des réseaux commerciaux de grande envergure et la richesse commerciale qu'ils génèrent."
 STATIC_MODIFIER_NAME_nd_cth_punic_imperium: "Impérial punique"
 STATIC_MODIFIER_DESC_nd_cth_punic_imperium: "Dans la tradition d'Hamilcar et d'Hannibal, la nouvelle Carthage bâtit sa puissance grâce à l'excellence militaire, en recrutant les meilleurs guerriers parmi les peuples soumis et en les transformant en un instrument de conquête discipliné."

 # === ADVANCE EVENT 2: TOPHET ===
 nd_cth.2.t: "Consécration du Tophet"
 nd_cth.2.d: "At the ancient precinct of Salambo, where thousands of stelae still stand inscribed to Baal Hammon and Tanit, the sacred flames burn once more. The Tophet (that most sacred and most debated of Carthaginian institutions) has been restored as the spiritual heart of the reborn nation.\n\nWhether the urns once held the ashes of sacrificed firstborn or merely stillborn children given to the gods, the Tophet's power as a symbol of Punic devotion is beyond question. The triangular sign of Tanit, carved into fresh stone, declares to all who pass: Carthage remembers its gods."
 nd_cth.2.a: "Les dieux de Carthage veillent sur nous"

 # === ADVANCE EVENT 3: THE LETTERED TIMBERS ===
 nd_cth.3.t: "The Lettered Timbers"
 nd_cth.3.d: "In the yards the ribs lie stacked in rows, each with a Punic letter painted on it, and the same letters run along the keel to show where every rib belongs. A crew that has never built a warship can follow the marks. A Carthaginian galley lost off Marsala around 241 BC still carries them.\n\nRome learned what the method was worth. Early in the first war it took a stranded Carthaginian warship as its pattern, and Pliny says the fleet built on that pattern was afloat sixty days after the trees were felled.\n\nThe method is ours again. Hulls are cut and lettered through the winter and put together when the fleet calls for them. The first war galleys built this way are on the slips."
 nd_cth.3.a: "Lay down the keels"

 # === ADVANCE EVENT MODIFIERS ===
 STATIC_MODIFIER_NAME_nd_cth_baal_hammon_blessing: "Bénédiction de Baal Hammon"
 STATIC_MODIFIER_DESC_nd_cth_baal_hammon_blessing: "Les anciens dieux de Carthage sourient au Tophet restauré. La dévotion religieuse renforce les liens de la société punique."
 STATIC_MODIFIER_NAME_nd_cth_punic_engineering: "L'héritage de l'ingénierie punique"
 STATIC_MODIFIER_DESC_nd_cth_punic_engineering: "Parts are cut and lettered ahead of need and assembled in order. The habit spreads from the shipyards to every building site in Carthage."

 # === DESTINY VARIABLES ===
 nd_cth_formed_tt: "Carthage renaît"
 nd_cth_path_a_tt: "Le chemin de la Thalassocratie"
 nd_cth_path_b_tt: "Le chemin de l'Empire punique"
 nd_cth_dest_carthage_developed_tt: "We own #bold Tunis#!, the site of Carthage, and its development is at least #bold 62#!"
 nd_cth_dest_campania_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in #bold Campania#!"

 # === ADVANCES ===
 nd_cth_tophet_cult: "Culte de Baal Hammon"
 nd_cth_tophet_cult_desc: "La restauration du Tophet en tant que centre de culte punique, honorant les anciens dieux Baal Hammon et Tanit par le biais de rituels et de dévotion."
 nd_cth_sacred_band_tradition: "Tradition de la bande sacrée"
 nd_cth_sacred_band_tradition_desc: "S'appuyant sur l'héritage des soldats citoyens d'élite de Carthage - la Bande Sacrée - qui combattaient en tant qu'infanterie lourde dans les anciennes formations de phalange."
 nd_cth_tyrian_purple: "Violet tyrien"
 nd_cth_tyrian_purple_desc: "La renaissance de l'ancien artisanat phénicien consistant à extraire la teinture violette des escargots de mer murex, produisant ainsi le légendaire tissu violet tyrien qui valait autrefois plus que l'or."
 nd_cth_triple_wall: "Fortifications à triple paroi"
 nd_cth_triple_wall_desc: "Les défenses massives à trois murs qui protégeaient autrefois Carthage (trois murs concentriques avec des écuries pour les éléphants de guerre et des casernes à l’intérieur) inspirent une nouvelle génération de fortifications."
 nd_cth_cothon_docks: "Lettered Timbers"
 nd_cth_cothon_docks_desc: "Carthaginian shipwrights painted a letter on every rib and matched it on the keel, so a hull went together in the order its parts were marked. Yards that work this way build war galleys in batches and replace a lost fleet in a season."
 nd_cth_numidian_cavalry: "Tradition de la cavalerie numide"
 nd_cth_numidian_cavalry_desc: "Le recrutement et l'entraînement de cavaliers légers numides qui chevauchent sans bride et lancent des javelots avec une précision mortelle : la meilleure cavalerie légère de l'ancienne Méditerranée."
 nd_cth_phoenician_glass: "Verrerie phénicienne"
 nd_cth_phoenician_glass_desc: "Les Phéniciens étaient des verriers légendaires et Carthage hérite de leurs techniques : production de récipients en verre translucide, de perles colorées et d'objets décoratifs prisés dans toute la Méditerranée."
 nd_cth_council_of_elders: "Conseil des Anciens"
 nd_cth_council_of_elders_desc: "Le Sénat carthaginois (le Conseil des Anciens) gouvernait par délibération et consensus, assurant une administration stable et une gouvernance prudente."
 nd_cth_libyan_infantry_reforms: "Réformes de l'infanterie libyenne"
 nd_cth_libyan_infantry_reforms_desc: "Réorganisation de l'infanterie libyenne concernée en formations de lances disciplinées, équipées de casques en bronze et de boucliers aspis à la manière de l'ancienne infanterie lourde punique."
 nd_cth_naval_rams: "Tactiques du bélier naval"
 nd_cth_naval_rams_desc: "Le développement du quinquérème (le navire de guerre à cinq rives qui était le navire emblématique de Carthage) armé d'un bélier de bronze dévastateur à la proue."
 nd_cth_punic_literacy: "Tradition littéraire punique"
 nd_cth_punic_literacy_desc: "When Carthage fell, Rome gave its libraries away to the kings of Numidia. Punic was still spoken and written in Africa five centuries later. The script returns to use, and the presses of Carthage print in it."
 nd_cth_carthaginian_diplomacy: "Diplomatie carthaginoise"
 nd_cth_carthaginian_diplomacy_desc: "La tradition diplomatique de Carthage : un réseau de traités, d'accords commerciaux et de réseaux de renseignement qui s'étendait autrefois des îles Tin jusqu'aux côtes de l'Afrique de l'Ouest."
 nd_cth_royal_purple_monopoly: "Monopole Royal Pourpre"
 nd_cth_royal_purple_monopoly_desc: "Le contrôle de l'État sur le commerce lucratif de la teinture pourpre, assurant le monopole de Carthage sur le produit de luxe le plus prestigieux du monde méditerranéen."
 nd_cth_mediterranean_dominance: "Domination navale méditerranéenne"
 nd_cth_mediterranean_dominance_desc: "Maîtrise carthaginoise de la Méditerranée centrale, contrôlant les voies maritimes entre l'Afrique, la Sicile et la Sardaigne grâce à un matelotage et des tactiques de galère supérieurs."
 nd_cth_punic_urban_planning: "Urbanisme punique"
 nd_cth_punic_urban_planning_desc: "La disposition systématique des villes carthaginoises : quadrillage de rues régulier, insulae à plusieurs étages, drainage sophistiqué et zonage minutieux des quartiers commerciaux et résidentiels."
 nd_cth_mercenary_reforms: "Réformes de l'armée mercenaire"
 nd_cth_mercenary_reforms_desc: "La restructuration des forces mercenaires polyglottes de Carthage en contingents organisés avec une logistique standardisée, s'appuyant sur des recrues ibériques, gauloises, libyennes et numides."
 nd_cth_punic_military_reform: "Réforme militaire punique"
 nd_cth_punic_military_reform_desc: "Une restructuration complète de l'armée carthaginoise, dépassant le recours aux bandes de mercenaires pour se diriger vers une force permanente professionnelle dotée d'un équipement et d'une formation standardisés."
 nd_cth_barcid_legacy: "L'héritage des Barcides"
 nd_cth_barcid_legacy_desc: "Le souvenir de la dynastie des Barcides (Hamilcar, Hasdrubal et surtout Hannibal) inspire une nouvelle ère d’ambition navale et d’audace stratégique."
 nd_cth_punic_institutions: "Renouveau institutionnel punique"
 nd_cth_punic_institutions_desc: "La restauration systématique des institutions administratives carthaginoises (les suffètes, le trésor, le recensement et les tribunaux) fournissant un cadre pour une gouvernance moderne."
 nd_cth_siege_engineering: "Ingénierie de siège punique"
 nd_cth_siege_engineering_desc: "S'appuyant sur les traditions techniques qui ont permis de construire les immenses fortifications de Carthage, les experts puniques en matière de siège développent des techniques permettant à la fois de construire et de briser les murs les plus puissants."
 nd_cth_punic_constitution: "Réforme constitutionnelle punique"
 nd_cth_punic_constitution_desc: "Aristote a loué la constitution carthaginoise comme étant l'une des plus belles du monde antique. Sa renaissance établit un système équilibré de magistrats, de conseils et d'assemblées populaires."
 nd_cth_carthaginian_renaissance: "Renaissance culturelle carthaginoise"
 nd_cth_carthaginian_renaissance_desc: "Une floraison d'arts, d'érudition et de littérature puniques, s'appuyant sur le riche héritage de la civilisation phénicienne et carthaginoise pour créer une identité culturelle distinctive."
 nd_cth_modern_punic_fleet: "Flotte punique moderne"
 nd_cth_modern_punic_fleet_desc: "La transformation de la marine carthaginoise de la guerre basée sur les galères à la construction navale moderne, tout en conservant le matelotage et les traditions tactiques de l'ancienne flotte."
 nd_cth_neo_punic_industry: "Industrie néo-punique"
 nd_cth_neo_punic_industry_desc: "Le développement industriel des territoires carthaginois, s'appuyant sur des siècles d'expertise artisanale dans le travail du métal, la verrerie, la production textile et la transformation agricole."

 # === UNITS ===
 a_nd_cth_sacred_band: "Bande sacrée"
 a_nd_cth_sacred_band_desc: "Infanterie lourde citoyenne d'élite issue des familles les plus riches de Carthage, entraînée dès sa jeunesse à la guerre de phalange. La Bande Sacrée constitue l'épine dorsale de l'armée citoyenne."
 a_nd_cth_numidian_horse: "Cheval léger numide"
 a_nd_cth_numidian_horse_desc: "Des cavaliers numides rapides qui chevauchent sans bride ni selle, lançant des javelots avec une précision mortelle avant de s'éloigner. Maîtres de la poursuite et de la guerre dans le désert."
 n_nd_cth_war_galley: "Galère de guerre punique"
 n_nd_cth_war_galley_desc: "Un navire de guerre spécialement construit dans la tradition carthaginoise, plus rapide et plus maniable que les galères standards, conçu pour les actions d'éperonnage et d'abordage."
 a_nd_cth_libyan_spearmen: "Lanciers libyens"
 a_nd_cth_libyan_spearmen_desc: "Infanterie africaine disciplinée armée de longues lances, de casques en bronze et de boucliers ronds. Ces soldats soumis constituent le noyau fiable des armées terrestres carthaginoises."
 n_nd_cth_quinquereme: "Quinquérème punique"
 n_nd_cth_quinquereme_desc: "Le puissant quinquérème : un navire de guerre à cinq flancs armé d'un bélier de bronze dévastateur. Le navire emblématique de la puissance navale carthaginoise, capable de dominer n'importe quelle bataille navale."

 # === BUILDINGS ===
 nd_cth_tophet: "Sanctuaire de Tophet"
 nd_cth_tophet_desc: "Enceinte sacrée dédiée à Baal Hammon et Tanit, où sont érigées des stèles et des offrandes faites selon l'ancienne tradition religieuse punique."
 nd_cth_punic_shipyard: "Chantier naval punique"
 nd_cth_punic_shipyard_desc: "Une installation portuaire protégée construite selon les principes du cothon : des postes d'amarrage couverts, des quais de réparation et des rampes de mise à l'eau qui permettent une construction et une maintenance rapides des navires de guerre."
 nd_cth_glassworks: "Verrerie punique"
 nd_cth_glassworks_desc: "Atelier spécialisé dans l'art verrier phénicien ancien, produisant des vases colorés, des perles et du verre décoratif prisés dans les réseaux commerciaux méditerranéens."
 nd_cth_dye_works: "Travaux de teinture puniques"
 nd_cth_dye_works_desc: "Une installation côtière pour l'extraction et la transformation de la teinture pourpre murex, la légendaire pourpre tyrienne qui était autrefois le monopole des marchands phéniciens."
 nd_cth_punic_citadel: "Citadelle punique"
 nd_cth_punic_citadel_desc: "Une fortification massive inspirée des triples murs de l'ancienne Carthage, avec d'épais remparts en pierre, des fossés profonds et des chambres internes pour le stockage des fournitures."
 nd_cth_emporium: "Magasin punique"
 nd_cth_emporium_desc: "Poste de traite côtier fortifié dans la tradition carthaginoise, où les marchands de toute la Méditerranée se réunissent pour échanger des marchandises sous la protection de la loi punique."
 nd_cth_fondouk: "Fondouk punique"
 nd_cth_fondouk_desc: "Une maison de commerce fortifiée dans la tradition carthaginoise, offrant hébergement, entrepôt et espace commercial aux divers marchands des réseaux commerciaux méditerranéens."
 nd_cth_suffete_court: "Cour des Suffètes"
 nd_cth_suffete_court_desc: "Le siège des suffètes (les magistrats jumelés qui gouvernaient Carthage) a été restauré en tant que centre d'administration civique, de justice et de tenue des registres publics."

 # === PRODUCTION METHODS ===
 nd_cth_tophet_maintenance: "Offres Tophet"
 nd_cth_tophet_maintenance_desc: "De l'encens, des animaux sacrificiels et des pierres pour les stèles : les offrandes traditionnelles pour soutenir l'enceinte sacrée."
 nd_cth_shipyard_maintenance: "Opérations du chantier naval"
 nd_cth_shipyard_maintenance_desc: "Bois, fournitures navales et ferrures nécessaires au maintien du chantier naval de Cothon en état de préparation opérationnelle."
 nd_cth_glass_production: "Verrerie phénicienne"
 nd_cth_glass_production_desc: "La transformation du sable et des colorants minéraux en récipients en verre finis, selon des techniques héritées des maîtres artisans phéniciens."
 nd_cth_glassworks_maintenance: "Entretien de la verrerie"
 nd_cth_glassworks_maintenance_desc: "Combustible et matériaux de four nécessaires pour maintenir les fours à verre à température de fonctionnement."
 nd_cth_purple_cloth_production: "Teinture pourpre tyrien"
 nd_cth_purple_cloth_production_desc: "L'extraction laborieuse de la teinture violette des escargots murex et son application sur des tissus tissés, produisant ainsi le légendaire tissu fin violet tyrien prisé à travers la Méditerranée."
 nd_cth_dye_maintenance: "Entretien des travaux de teinture"
 nd_cth_dye_maintenance_desc: "Cuves de poterie, sel pour la conservation et carburant pour maintenir le processus d'extraction des colorants."
 nd_cth_citadel_maintenance: "Garnison de la Citadelle"
 nd_cth_citadel_maintenance_desc: "Pierre pour les réparations, armes pour la garnison et renforts en fer pour maintenir la force défensive de la citadelle."
 nd_cth_emporium_maintenance: "Opérations du magasin"
 nd_cth_emporium_maintenance_desc: "Tissu pour les étalages marchands, poterie pour les marchandises commerciales et bois pour entretenir le poste de traite et ses installations d'entreposage."
 nd_cth_fondouk_maintenance: "Opérations Fondouk"
 nd_cth_fondouk_maintenance_desc: "Textiles, poteries pour la présentation des marchandises marchandes et bois pour l'entretien de la maison de commerce et de ses installations d'entreposage."
 nd_cth_suffete_maintenance: "Administration des tribunaux"
 nd_cth_suffete_maintenance_desc: "Papier pour les archives, tissu pour les vêtements officiels et pierre pour l'entretien des bâtiments civiques du tribunal suffète."

 # ===== DESTINY ADVANCES =====
 nd_cth_destiny: "Destin de Carthage"
 nd_cth_destiny_desc: "The foundations of reborn Carthage are secure. From this base of stability, a great destiny beckons, but which destiny shall it be?"

 nd_cth_dest_sardinian_sea: "Commandement de la mer de Sardaigne"
 nd_cth_dest_sardinian_sea_desc: "Sécurisez la Sardaigne et la Corse pour dominer la Méditerranée centrale. Contrôlez ces bastions insulaires et remplissez le trésor pour financer une expansion ultérieure. Nécessite de choisir la voie Thalasassocratique."
 nd_cth_dest_pillars_of_hercules: "Les colonnes d'Hercule"
 nd_cth_dest_pillars_of_hercules_desc: "Commandez le détroit où la Méditerranée rencontre l'Atlantique. Saisissez Cadix, Gibraltar et Carthagène pour contrôler les voies maritimes occidentales et les anciennes routes commerciales puniques."
 nd_cth_dest_mare_nostrum: "Mare Nostrum"
 nd_cth_dest_mare_nostrum_desc: "Make the entire Mediterranean a Punic lake. Command Genoa, Alexandria, and Crete (the three corners of Mediterranean commerce) and raise Carthage itself to twice the city it was, as befits the greatest harbour of the western sea."

 nd_cth_dest_african_hegemony: "Hégémonie africaine"
 nd_cth_dest_african_hegemony_desc: "Assurer la domination sur l’ouest de l’Afrique du Nord en conquérant Fès et Tanger. Construisez l’armée qui portera les ambitions puniques au-delà de l’Afrique. Nécessite de choisir la voie Barcid Imperium."
 nd_cth_dest_iberian_campaign: "La campagne ibérique"
 nd_cth_dest_iberian_campaign_desc: "Traversez le détroit comme le faisait autrefois Hamilcar. Conquérez Grenade, Cordoue et Séville, les riches villes du sud de la péninsule ibérique qui ont financé les premières campagnes Barcid contre Rome."
 nd_cth_dest_hannibal_ante_portas: "Hannibal avant Portas"
 nd_cth_dest_hannibal_ante_portas_desc: "Finish what Hannibal could not. Take Rome and Naples, the heart of the ancient enemy, and hold half of Campania, the land that went over to him after Cannae. With the Eternal City in Punic hands, the Mediterranean world bows to Carthage at last."

 # ===== DESTINY EVENTS =====

 # Root event
 nd_cth.4.t: "Le destin de Carthage"
 nd_cth.4.d: "Carthage stands reborn, its foundations secure and its people united. The ancient city that once commanded half the Mediterranean now faces a choice that will define its future for centuries to come.\n\nThe suffetes and the Council of Elders debate endlessly. Some point to the harbors, the cothons, the merchant fleets: the instruments that built Carthaginian power in the first place. Others invoke the memory of the Barcid generals, who proved that Carthage could match any land power in open battle.\n\nThe destiny of Carthage awaits."
 nd_cth.4.a: "Notre destin est écrit dans les étoiles"

 # Path A Stage 1
 nd_cth.5.t: "Commandement de la mer de Sardaigne"
 nd_cth.5.d: "The islands of Sardinia and Corsica (those ancient prizes over which Carthage and Rome first came to blows) are ours once more. The Sardinian Sea, that vital corridor between Africa and Europe, is now a Punic lake.\n\nFrom Cagliari and Ajaccio, our merchant fleets can reach any port in the western Mediterranean within days. The island fortresses that once served as stepping stones for Roman conquest now serve as bastions of Punic commerce."
 nd_cth.5.a: "Les routes maritimes sont ouvertes"

 # Path A Stage 2
 nd_cth.6.t: "Les colonnes d'Hercule"
 nd_cth.6.d: "The ancient boundary stones of the known world stand under Punic authority. Cadiz (Gadir, as the Phoenicians called it) was the oldest colony in the west, founded before Carthage itself. Gibraltar, the rock that guards the passage between seas, is ours.\n\nCartagena (New Carthage, Hasdrubal's capital in Iberia) completes the chain. Every ship that passes between the Atlantic and the Mediterranean must now reckon with Punic power. The question is whether to turn outward toward the vast ocean, or inward to master the trade of the inner sea."
 nd_cth.6.a: "Regardez au-delà des piliers vers l’Atlantique"
 nd_cth.6.b: "Maîtriser le commerce de la mer intérieure"

 # Path A Stage 3
 nd_cth.7.t: "Mare Nostrum"
 nd_cth.7.d: "From Genoa to Alexandria, from Crete to the Pillars of Hercules, the Mediterranean is a Punic sea. The dream that Rome achieved through legions and roads, Carthage has accomplished through ships and trade: a commercial empire spanning three continents.\n\nThe harbors of Genoa funnel the wealth of Europe. The granaries and workshops of Alexandria channel the riches of the East. The harbors of Crete command the sea lanes between them all. Carthage sits at the center, the spider in a web of commerce that makes the old Roman mare nostrum seem parochial by comparison.\n\nThis is the Punic thalassocracy fulfilled: not through the sword, but through the ledger and the sail."
 nd_cth.7.a: "Forgez une domination impériale durable"
 nd_cth.7.b: "Que le commerce soit notre couronne"

 # Path B Stage 1
 nd_cth.8.t: "Hégémonie africaine"
 nd_cth.8.d: "The western reaches of North Africa bow to Punic authority. Fez, the ancient capital of Morocco, and Tangier, the gateway to the strait, are now Carthaginian possessions. The Berber and Arab peoples of the Maghreb serve under the banner of the new Punic empire, just as the Numidians and Libyans once served under the Barcids.\n\nWith Africa secured, the army grows stronger by the day. The diverse peoples of the continent provide cavalry, infantry, and specialists of every kind. The path northward beckons."
 nd_cth.8.a: "L'Afrique est à nous - maintenant regardez vers le nord"

 # Path B Stage 2
 nd_cth.9.t: "La campagne ibérique"
 nd_cth.9.d: "Hamilcar Barca crossed into Iberia to rebuild Carthaginian power after the First Punic War. His son Hannibal launched the greatest military campaign of antiquity from these same shores. Now a new generation of Punic soldiers stands in Granada, Cordoba, and Sevilla: the rich cities of Andalusia that once funded Barcid ambitions.\n\nThe veterans of this campaign are hardened by siege and battle. The question is whether to forge them into a professional elite or to open the ranks wider, drawing on the vast manpower of our African territories."
 nd_cth.9.a: "Forgez une armée professionnelle vétéran"
 nd_cth.9.b: "Recrutez dans nos vastes domaines africains"

 # Path B Stage 3
 nd_cth.10.t: "Hannibal avant Portas"
 nd_cth.10.d: "Hannibal ad portas: 'Hannibal is at the gates!' The cry that once terrorized Roman mothers into silence now echoes through the streets of the Eternal City itself. Rome has fallen. Naples has fallen. The ancient enemy that razed Carthage to the ground and sowed its fields with salt has been brought to its knees.\n\nWhat Hannibal could not achieve with his elephants and genius, what Hasdrubal could not accomplish with reinforcements from Iberia, the new Carthage has done. The Punic eagle perches where the Roman wolf once stood.\n\nThe world holds its breath. What will the new masters of Rome build upon the ruins of the old?"
 nd_cth.10.a: "Que le triomphe punique résonne à travers les âges"
 nd_cth.10.b: "Construire un nouvel ordre à partir de cette conquête"

 # ===== DESTINY TIMED MODIFIERS =====

 STATIC_MODIFIER_NAME_nd_cth_dest_atlantic_gateway: "Porte d'entrée vers l'Atlantique"
 STATIC_MODIFIER_DESC_nd_cth_dest_atlantic_gateway: "Le commandement des Colonnes d'Hercule ouvre le vaste Atlantique à l'exploration punique, étendant la portée diplomatique et navale de Carthage au-delà du monde antique."
 STATIC_MODIFIER_NAME_nd_cth_dest_merchant_princes: "Princes marchands de la Méditerranée"
 STATIC_MODIFIER_DESC_nd_cth_dest_merchant_princes: "The wealthiest merchants of the Mediterranean converge on Punic ports, offering favorable credit and strengthening relations, though the comfort of prosperity dulls military preparedness."
 STATIC_MODIFIER_NAME_nd_cth_dest_punic_dominion: "Domination punique"
 STATIC_MODIFIER_DESC_nd_cth_dest_punic_dominion: "Le bassin méditerranéen relève d'une administration punique unifiée, avec des peuples soumis progressivement absorbés dans la vie civique carthaginoise."
 STATIC_MODIFIER_NAME_nd_cth_dest_queen_of_the_sea: "Reine de la mer"
 STATIC_MODIFIER_DESC_nd_cth_dest_queen_of_the_sea: "Carthage presides over the greatest trade network the Mediterranean has ever known, its merchant agents doubling as an unrivaled intelligence network, though such mastery breeds complacency."
 STATIC_MODIFIER_NAME_nd_cth_dest_iberian_veterans: "Vétérans ibériques"
 STATIC_MODIFIER_DESC_nd_cth_dest_iberian_veterans: "The veterans of the Iberian campaign form the professional core of the Punic army, rapidly reinforced and quickly mustered, though the hard campaigning takes its toll on the troops."
 STATIC_MODIFIER_NAME_nd_cth_dest_african_recruits: "Recrues africaines"
 STATIC_MODIFIER_DESC_nd_cth_dest_african_recruits: "Les vastes territoires africains fournissent de solides garnisons et la confiance nécessaire pour mener des guerres d’agression, même si la pression exercée par le maintien de telles forces à travers le continent alimente la hausse des prix."
 STATIC_MODIFIER_NAME_nd_cth_dest_punic_triumph: "Triomphe punique"
 STATIC_MODIFIER_DESC_nd_cth_dest_punic_triumph: "La chute de Rome couronne Carthage comme le maître incontesté de la Méditerranée, lui accordant un levier inégalé dans les négociations de paix tandis que les richesses pillées soutiennent l'armée."
 STATIC_MODIFIER_NAME_nd_cth_dest_new_punic_order: "Nouvel ordre punique"
 STATIC_MODIFIER_DESC_nd_cth_dest_new_punic_order: "Avec la chute de Rome, Carthage construit un nouvel ordre politique : un empire multiethnique qui embrasse diverses confessions et convertit les peuples soumis à la vie civique punique."

 # ===== DESTINY BUILDINGS =====

 nd_cth_dest_cothon_emporium: "Magasin Grand Cothon"
 nd_cth_dest_cothon_emporium_desc: "Un complexe portuaire-marché monumental alliant l'ancienne tradition de construction navale de Cothon à l'infrastructure commerciale d'une grande maison de commerce méditerranéenne."
 nd_cth_dest_barcid_academy: "Académie militaire barcide"
 nd_cth_dest_barcid_academy_desc: "Une école de formation d'officiers inspirée par le génie stratégique d'Hamilcar, Hasdrubal et Hannibal Barca, formant la prochaine génération de commandants puniques."

 # ===== DESTINY PRODUCTION METHODS =====

 nd_cth_dest_cothon_emporium_maintenance: "Opérations du magasin"
 nd_cth_dest_cothon_emporium_maintenance_desc: "Du bois pour les infrastructures portuaires, du tissu et du papier pour les opérations marchandes et des outils pour entretenir les machines commerciales complexes."
 nd_cth_dest_barcid_academy_maintenance: "Opérations de l'Académie"
 nd_cth_dest_barcid_academy_maintenance_desc: "Armes et chevaux pour l'entraînement, cuir pour l'équipement et papier pour les manuels stratégiques et la correspondance des officiers."

 # ===== BUREAUCRACIES =====

 cth_diwan_al_insha_bureaucracy: "Andalusi Secretaries"
 cth_diwan_al_insha_bureaucracy_desc: "When Valencia fell in 1238 and Seville in 1248, the secretaries of al-Andalus crossed to Tunis, and the Hafsid sultans gave them the chancery. Ibn al-Abbar of Valencia drafted the sultan's letters from 1240. The Banu Khaldun of Seville served the court for a century, and Ibn Khaldun began his career there in 1352, writing the sultan's mark of validation on decrees. The newcomers reorganised the administration on the model of Cordoba and Seville and became the sultans' closest advisers. The Almohad shaykhs and the tribes of the interior resented them, and in the next century scribes of Almohad descent took many of the offices back."
 cth_qadi_al_jamaa_bureaucracy: "Qadi al-Jama'a"
 cth_qadi_al_jamaa_bureaucracy_desc: "Le cadi en chef Maliki d'Ifriqiya, siégeant à Tunis. Le Maghreb a préféré le titre de qadi al-jama'a (juge de la communauté) au titre oriental de qadi al-qudat, reflétant la tradition malékite d'une hiérarchie judiciaire communautaire plutôt que centralisée. Les détenteurs notables ailleurs dans les royaumes almoravides et almohades comprenaient Ibn Rushd al-Jadd et Qadi Iyad de Ceuta. Le bureau arbitrait les contrats, les successions et le statut personnel et, par l'intermédiaire de son autorité d'appel, supplantait progressivement le droit coutumier des confédérations berbère et arabe."
 cth_diwan_al_bahr_bureaucracy: "Diwan al-Bahr"
 cth_diwan_al_bahr_bureaucracy_desc: "Le bureau maritime hafside, bureau des douanes et des recettes de Tunis, La Goulette et Bougie qui taxait les marchandises débarquées par les caravanes sahariennes et échangées via les funduqs européens. Les marchands génois, pisans, catalans et vénitiens louaient leurs entrepôts au diwan et payaient ses dîmes (ushur) en vertu de traités permanents comme celui de 1323. Le bureau maritime enregistrait chaque dû de port et chaque concession, garantissant la prospérité des XIVe et XVe siècles."
 cth_ribat_network_bureaucracy: "Réseau Ribat"
 cth_ribat_network_bureaucracy_desc: "La chaîne de monastères frontaliers fortifiés - Sousse, Monastir, Tit, le Ribat al-Fath almohade à Sal et Ribat Taza - qui combinaient devoir de garnison et dévotion religieuse. Les murabitun qui les équipaient s'engageaient à une vigilance perpétuelle contre les raids chrétiens et les incursions bédouines, gagnant la baraka grâce au service aux frontières. Au XIIIe siècle, de nombreux ribats étaient devenus des centres du turuq proto-soufi, fusionnant les idéaux guerriers et ascétiques à un coût modeste pour le trésor central mais au prix d'un établissement religieux militant peu à l'aise avec le commerce cosmopolite des villes côtières."
 cth_taife_reisi_bureaucracy: "Ta'ife Reisi"
 cth_taife_reisi_bureaucracy_desc: "La guilde des capitaines corsaires, formalisée par Hayreddin Barberousse après sa consolidation d'Alger en 1518 et adoptée tour à tour par Tunis et Tripoli. Les reises autorisées par le divan de régence apportaient des captifs, des marchandises et des rançons au trésor, tandis que leur conseil (le ta'ifa) élisait son propre kapudan-rais et dirigeait la flotte corso comme un service autonome. Au XVIIe siècle, la classe des capitaines avait éclipsé la vieille aristocratie tribale dans la vie politique des régences barbaresques."

 AUTO_MODIFIER_NAME_nd_cth_bureaucracy_authority: "Appareil administratif permanent"
 AUTO_MODIFIER_DESC_nd_cth_bureaucracy_authority: "The institutional inheritance of Ifriqiya (the Andalusi secretaries of the Hafsid chancery, the Maliki judiciary, the maritime bureau, the ribat network, and the corsair admiralty) supplies a foundation for two more standing institutions."
