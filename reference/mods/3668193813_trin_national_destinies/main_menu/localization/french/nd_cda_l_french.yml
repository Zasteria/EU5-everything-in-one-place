# ============================================================================
# Static Modifiers (formation choices + advance event modifiers)
# ============================================================================
 STATIC_MODIFIER_NAME_nd_cda_mediterraneum_aragonense: "Méditerranée Aragonense"
 STATIC_MODIFIER_DESC_nd_cda_mediterraneum_aragonense: "La couronne regarde vers l'est. Les consulats catalans de Bruges à Constantinople, les mercenaires d'Almogavar vendant leurs serpes à n'importe quel prince qui voulait les payer, et le Senyera Reial à quatre barres survolant une mer Méditerranée devenue lac aragonais. Primauté navale, profondeur mercenaire, culture cosmopolite et diplomatie tournée vers l’extérieur, au prix de l’acceptation d’un système politique divisé par la mer plutôt que de le souder à l’intérieur des terres."
 STATIC_MODIFIER_NAME_nd_cda_hispano_aragonese: "Couronne hispano-aragonaise"
 STATIC_MODIFIER_DESC_nd_cda_hispano_aragonese: "Si la péninsule ibérique doit être unifiée, qu’elle le soit vers l’est. La couronne déplace son poids administratif vers l’intérieur des terres : intégrant les populations castillanes et andalouses, professionnalisant les prélèvements et utilisant la machinerie successorale de la politique dynastique de Trastamara pour faire à la Castille ce que la Castille nous a fait dans une autre chronologie. Profondeur de main-d’œuvre, annexions bon marché, consolidation du contrôle au prix d’une posture belligérante et d’une réforme centralisatrice."
 STATIC_MODIFIER_NAME_nd_cda_compromise_legitimist: "Légitimité du Trastamara"
 STATIC_MODIFIER_DESC_nd_cda_compromise_legitimist: "Neuf arbitres réunis à Caspe en 1412 choisirent Ferdinand d'Antequera, le prince Trastamara d'origine castillane, comme héritier légitime du trône d'Aragon. Le choix de la continuité dynastique lie la couronne au réseau successoral ibérique pour les siècles à venir."
 STATIC_MODIFIER_NAME_nd_cda_compromise_pactist: "Maison d'Urgell justifiée"
 STATIC_MODIFIER_DESC_nd_cda_compromise_pactist: "Le compromis de Caspe va dans l'autre sens : Jaume II d'Urgell, le prétendant catalan d'origine, prend le trône. Les nobles pacificateurs et les grandes villes de la Couronne déclarent leurs privilèges affirmés contre toute future succession étrangère."
 STATIC_MODIFIER_NAME_nd_cda_catalan_atlas: "Projet cartographique de Cresques"
 STATIC_MODIFIER_DESC_nd_cda_catalan_atlas: "La famille Cresques de Majorque a mis le monde en parchemin. Des royaumes marins avec un demi-siècle d'avance sur leurs rivaux en matière de présence et d'exploration maritimes."
 STATIC_MODIFIER_NAME_nd_cda_humanist_court: "Le Naples de Lorenzo Valla"
 STATIC_MODIFIER_DESC_nd_cda_humanist_court: "La cour Magnanime choisit l'humanisme. Valla travaille sur ses Elegantiae, Beccadelli compile les paroles spirituelles du roi et les scriptoria royales copient les manuscrits grecs. Le soft power aragonais rayonne au nord, en Toscane et au-delà."
 STATIC_MODIFIER_NAME_nd_cda_arms_of_naples: "Patronage d'armes"
 STATIC_MODIFIER_DESC_nd_cda_arms_of_naples: "La cour Magnanime patronne les condottieri, les ingénieurs militaires et la classe des officiers des guerres d'Italie. L'or aragonais afflue vers les meilleurs soldats de l'époque et Naples devient le terrain d'essai du métier des armes méditerranéen."

# ============================================================================
# Formation Event (nd_cda.1)
# ============================================================================
 nd_cda.1.t: "L'Empire aragonais"
 nd_cda.1.d: "From Barcelona's quay the king's galley flies the Senyera Reial, four red bars on gold that the chroniclers say were drawn in royal blood. Naples bows. Palermo bows. Cagliari, Palma, Valencia, Zaragoza all wait on the verdict. The Crown of Aragon, four kingdoms and three duchies bound only by a peripatetic sovereign and the Consolat de Mar, has reached a moment its rivals dread: a single ruler, a single court, a single project that is no longer postponed.\n\nThe royal council asks what the project shall be. The Catalan merchants want a Mediterranean lake: Athens recovered, Egypt courted, the consulates reinforced from Bruges to Trebizond, the Almogavars on retainer, the four bars flying over every harbour where bills of exchange are settled. The Aragonese nobility and the new Trastamara administrators see otherwise: westward, toward an Iberia unified on the crown's terms before Castile can do it on theirs. Both paths are real. Alfonso the Magnanimous truly did pivot east; the Compromise of Caspe truly did seat us in the Iberian dynastic web. The court must choose which Aragon survives.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cda.1.a: "Mediterraneum Aragonense que la mer soit à nous"
 nd_cda.1.b: "Ibérie hispano-aragonaise, à nos conditions"

# ============================================================================
# Advance DHE Events
# ============================================================================
# Catalan Atlas (nd_cda.2): single option
 nd_cda.2.t: "L'Atlas des Cresques"
 nd_cda.2.d: "Le cartographe juif Cresques Abraham de Majorque et son fils Jafuda ont réalisé l'atlas mondial commandé par Père III. Six panneaux in-folio en vélin montrent la Méditerranée avec des détails de portulan sans précédent, les caravanes d'or africaines de Mansa Musa et les routes de la soie vers l'est jusqu'à Cathay. L'œuvre est à la fois un cadeau de mariage pour le roi de France, une diplomatie et une reconnaissance. Aucune autre cour chrétienne n’a quelque chose de comparable. Les pilotes de Gênes et de Venise en demandent discrètement des exemplaires. Les marins de la Couronne ont une longueur d'avance d'une génération."
 nd_cda.2.a: "Le monde est notre thème."

# Compromise of Caspe (nd_cda.3): branching
 nd_cda.3.t: "Le compromis de Caspe"
 nd_cda.3.d: "Marti the Humane has died at Poblet without a legitimate heir. The crown stands vacant and five claimants press their cases: among them Ferdinand of Antequera, Castilian-born Trastamara prince and victor over Granada, and Jaume of Urgell, the native Catalan candidate descended in the male line from Jaume II. Nine arbiters from Aragon, Catalonia and Valencia have gathered at Caspe to render a binding judgement. The court awaits the king's preference, knowing the arbiters' sentence is secretly malleable.\n\nFerdinand brings dynastic weight, Castilian alliance, and the prestige of the recent Granadan campaigns. Jaume brings the loyalty of the Catalan nobility and the unbroken line of the Casa d'Arago. The choice will define whether the crown faces inward toward Iberian dynastic politics, or outward toward Catalan particularism."
 nd_cda.3.a: "Couronne de la dynastie Ferdinand d'Antequera avant tout"
 nd_cda.3.b: "Couronne Jaume d'Urgell la ligne reste catalane"

# Magnanimous Court (nd_cda.4): branching
 nd_cda.4.t: "Alphonse le Magnanime à Naples"
 nd_cda.4.d: "Naples has fallen, the Castel Nuovo flies the Senyera, and Alfonso V has installed his court in the city he fought five years to take. Lorenzo Valla (the philologist who proved the Donation of Constantine a forgery) sits in the king's pay. Antonio Beccadelli, called the Panormita, drafts the king's table-talk. Greek manuscripts arrive by the shipload from Constantinople in flight from the Ottomans. The court is suddenly the most brilliant on the Italian peninsula, more learned than Florence and more cosmopolitan than Rome.\n\nBut the same court hosts condottieri waiting for assignments, the king's military engineers studying gunpowder fortifications, and the bravos of the Italian Wars. Alfonso must decide where the patronage flows: into the humanist project that will outlast his name, or into the army of Mediterranean professionals that will keep his crown standing while he is alive."
 nd_cda.4.a: "La bibliothèque de l'humanisme de Naples au-dessus des armes"
 nd_cda.4.b: "L'arsenal des soldats napolitains au-dessus des scribes"

# Consolat de Mar (nd_cda.5): single option
 nd_cda.5.t: "La Livre du Consolat de Mar"
 nd_cda.5.d: "Des siècles de coutumes maritimes catalanes ont été compilées dans la Llibre del Consolat de Mar, le droit privé de la navigation le plus complet jamais écrit dans l'Europe chrétienne. Marseille l'adopte. Pise l'adopte. Acre, Trapani, Famagouste, Bruges partout où accostent les navires des quatre bars, le Consolat est la loi qui décide qui paie le largage, qui assure la cargaison, qui arbitre entre le capitaine et le marchand. La couronne n'a pas le monopole du commerce lui-même, mais tout différend porté devant n'importe quel consul, où qu'il soit, est réglé selon les règles aragonaises-catalanes."
 nd_cda.5.a: "Lex maritima nostra."

# Renaixenca (nd_cda.6): single option
 nd_cda.6.t: "La Renaixença"
 nd_cda.6.d: "Bonaventura Aribau publie l'Oda a la Patria. Jacint Verdaguer prépare l'Atlantida. Les Jocs Florals sont restaurés à Barcelone et le catalan commence son retour de la cuisine et de la taverne à l'imprimerie, à l'université et au parlement. Ce qui fut pendant deux siècles le dialecte régional d'une province périphérique redevient la langue d'une littérature, d'une politique, d'un espace public. La langue vernaculaire du Consolat de Mar trouve sa voix moderne et derrière elle, un projet national."
 nd_cda.6.a: "La voix de la Catalogne revient."

# ============================================================================
# Advances (display names + descriptions)
# ============================================================================
# Age 1
 nd_cda_pacta_conventa: "Pacta Conventa"
 nd_cda_pacta_conventa_desc: "Le privilège général de 1283 et le serment du couronnement aragonais lient la couronne aux pactes constitutionnels du royaume. La célèbre formule « nous, qui valons autant que vous et ensemble plus que vous, vous acceptons comme notre roi et seigneur, à condition que vous respectiez nos libertés et nos lois ; sinon, non », c'est sans précédent dans l'Europe chrétienne."
 nd_cda_consolat_de_mar: "Livre du Consolat de Mar"
 nd_cda_consolat_de_mar_desc: "Le code maritime catalan compilé est adopté de Marseille à Acre comme lex maritima de la Méditerranée. La Couronne d'Aragon ne possède pas de monopole sur le commerce lui-même, mais tout conflit commercial entendu dans n'importe quel consulat est réglé selon les règles aragonaises-catalanes."
 nd_cda_catalan_company: "Entreprise catalane en Grèce"
 nd_cda_catalan_company_desc: "Les Almogavars de Roger de Flor entrent en service auprès de Byzance en 1303, puis se taillent les duchés d'Athènes et de Néopâtre pour couronner les Aragonais, première projection de puissance ibérique en Méditerranée orientale et modèle de deux siècles d'entreprise mercenaire catalane."
 nd_cda_almudin_tradition: "Almudn de Valencia"
 nd_cda_almudin_tradition_desc: "Le grand marché couvert aux céréales de Valence, l'Almudn, devient l'épine dorsale alimentaire de la campagne méditerranéenne de la Couronne. L'administration centralisée des greniers confère au royaume un avantage en matière d'approvisionnement militaire inégalé dans la péninsule ibérique du 14e siècle."
# Age 2
 nd_cda_catalan_atlas: "Atlas catalan"
 nd_cda_catalan_atlas_desc: "L'Atlas catalan de 1375 de la famille Cresques fait de la cartographie aragonaise-majorquine la plus avancée de tous les États chrétiens. Les pilotes de Gênes et de Venise en demandent discrètement des exemplaires ; les marins du royaume détiennent une génération d'avance en matière de renseignement maritime."
 nd_cda_compromise_of_caspe: "Compromis de Caspe"
 nd_cda_compromise_of_caspe_desc: "La crise de succession de 1412 est résolue lorsque neuf arbitres élisent un nouveau roi par la procédure légale plutôt que par l'épée. Le règlement change définitivement la manière dont la couronne aragonaise conçoit la légitimité par pacte, par élection, par sentence contraignante."
 nd_cda_magnanimous_court_tradition: "Cour des Magnanimes"
 nd_cda_magnanimous_court_tradition_desc: "Alphonse V installe sa cour itinérante à Naples (1442). Lorenzo Valla, Beccadelli, Pontano et Manetti entrent dans la maison royale ; la première cour de la Renaissance au nord de Florence, financée par une couronne ibérique, projette le soft power aragonais à travers l’Italie."
 nd_cda_drassanes_tradition: "Drassanes Reials"
 nd_cda_drassanes_tradition_desc: "Les Chantiers Royaux de Barcelone, d'architecture navale gothique, capables de déposer simultanément trente galères sous un seul toit, deviennent l'épine dorsale industrielle de la puissance maritime catalane-aragonaise."
 nd_cda_catalan_galley: "Galère catalane"
 nd_cda_catalan_galley_desc: "Le navire de guerre emblématique de la domination méditerranéenne de la Couronne est standardisé en tant que classe. Plus rapide que la galère génoise, à coque renforcée pour le travail amphibie, la galère catalane protège les convois consulaires et débarque les Almogavars sur une centaine de côtes."
# Age 3
 nd_cda_senyera_consulates: "Consulats Senyera"
 nd_cda_senyera_consulates_desc: "Le réseau Consols dels Catalans couvre tous les grands ports méditerranéens et s'étend jusqu'à Bruges et Londres. Chaque consulat exploite le Senyera Reial à quatre barres et accorde aux commerçants catalans une protection extraterritoriale en vertu du droit commercial aragonais."
 nd_cda_llotja_tradition: "The Caricatori"
 nd_cda_llotja_tradition_desc: "The grain of Sicily leaves the island through the royal loading ports: Sciacca, Girgenti, Licata, Termini. At each the master portolan weighs the cargo and sells the licence to export it, and the Crown's merchants carry the harvest to every shore of the inner sea."
 nd_cda_mediterranean_viticulture: "Viticulture méditerranéenne"
 nd_cda_mediterranean_viticulture_desc: "Les régions viticoles du Peneds, du Priorat, de la Sicile, du Campanien et des Pouilles reposent toutes sous la couronne aragonaise. Une économie viticole à l’échelle du continent, inégalée par aucun rival."
 nd_cda_neapolitan_humanism: "Humanisme napolitain"
 nd_cda_neapolitan_humanism_desc: "Après la mort d'Alphonse V, le projet culturel qu'il a fondé lui survit : l'Académie de Pontano, l'imprimerie de Naples de Sixtus Riessinger (1471) et les scriptoria royales soutiennent l'humanisme aragonais jusqu'à la fin du XVe siècle."
# Age 4
 nd_cda_generalitat: "The Overseas Parliaments"
 nd_cda_generalitat_desc: "Sicily and Sardinia are given parliaments on the Catalan pattern, sitting in three arms: the barons, the prelates and the royal towns. A deputation of each realm watches over what was granted between sessions. A crown that is held to its pacts is voted its donatives."
 nd_cda_tercio_de_napoles: "Tercio de Npoles"
 nd_cda_tercio_de_napoles_desc: "Les réformes de Gonzalo de Crdoba pendant les guerres d'Italie (1495-1504) produisent le tercio : un carré d'infanterie lourde interarmes alignant ensemble le brochet, l'épée et l'arquebuse. Dans notre chronologie, l'innovation fleurit sous le parrainage catalan-aragonais plutôt que castillan."
 nd_cda_royal_galiot: "Royal Galiot"
 nd_cda_royal_galiot_desc: "Les Drassanes Reials adaptent le navire de guerre à rames aux premières conditions modernes : une galiote plus rapide et plus légère pour la défense côtière, l'escorte de convois et les escarmouches anti-ottomanes de la Méditerranée du XVIe siècle."
 nd_cda_consolat_supremacy: "Suprématie de Consolat"
 nd_cda_consolat_supremacy_desc: "Le code maritime catalan est devenu la lex maritima méditerranéenne, même là où les pavillons aragonais ne flottent plus. La Couronne exploite l’infrastructure juridique pour assurer la primauté du commerce."
# Age 5
 nd_cda_pactist_resistance: "Résistance pactiste"
 nd_cda_pactist_resistance_desc: "Des juristes aragonais comme Llus de Peguera articulent la doctrine selon laquelle les pactes constitutionnels ne peuvent être abrogés unilatéralement par une couronne absolutiste. Testée lors de la révolte catalane de 1640 et de la guerre de Succession d'Espagne, la doctrine confère au royaume une capacité inhabituelle de résistance juridique et armée aux excès de la royauté."
 nd_cda_late_neapolitan_court: "Cour napolitaine tardive"
 nd_cda_late_neapolitan_court_desc: "Naples devient l'une des plus grandes villes d'Europe sous la persistance tardive des Aragonais. Le patronage de Vico, Pergolèse et Galiani soutient la primauté culturelle aragonaise dans le sud de l'Italie tout au long du siècle des Lumières."
 nd_cda_almadraba_fishery: "Pêcherie d'Almadraba"
 nd_cda_almadraba_fishery_desc: "Le casier à thon rouge almadraba d'origine phénicienne, perfectionné par les pêcheurs catalans-siciliens, devient la plus grande pêcherie pré-moderne organisée de la Méditerranée. L’exportation du thon salé devient une industrie monopolistique d’État."
# Age 6
 nd_cda_renaixenca: "Jocs Florals"
 nd_cda_renaixenca_desc: "The Floral Games of Barcelona are restored in 1859, and every spring the poets of the Crown compete for the natural flower, the golden eglantine and the golden violet. Aribau's Oda a la Patria and Verdaguer's Atlàntida are read aloud to crowds, and a public sphere returns to the language of the Consolat de Mar."
 nd_cda_indianas_industry: "Industrie de l'Indiana"
 nd_cda_indianas_industry_desc: "L'industrie catalane du coton imprimé, les Indianas, est devenue la première usine textile mécanisée de la péninsule ibérique. Barcelone devient « la fbrica de Espanya », l'atelier industriel de la couronne aragonaise."

# ============================================================================
# Custom Units
# ============================================================================
 n_nd_cda_catalan_galley: "Galère catalane"
 n_nd_cda_catalan_galley_desc: "Le navire de guerre standardisé de la flotte méditerranéenne de la Couronne. Renforcé pour le travail amphibie, plus rapide que ses rivaux génois, conçu pour convoyer le commerce catalan et débarquer les Almogavars sur des plages hostiles."
 n_nd_cda_levy_galley: "Galère de prélèvement catalan"
 n_nd_cda_levy_galley_desc: "Variante de prélèvement côtier-bourgeois de la galère catalane, levée dans les villes portuaires de Barcelone, Valence, Palma, Naples et Palerme. Équipé d'ouvriers et de paysans du bord de la Méditerranée."
 n_nd_cda_royal_galiot: "Royal Galiot"
 n_nd_cda_royal_galiot_desc: "L'évolution moderne de la galère des Drassanes Reials, un navire à rames plus léger et plus rapide pour la défense côtière et les escarmouches anti-ottomanes à la fin des guerres méditerranéennes."
 a_nd_cda_tercio_de_napoles: "Tercio de Npoles"
 a_nd_cda_tercio_de_napoles_desc: "Le carré d'infanterie interarmes forgé dans la Naples aragonaise pendant les guerres d'Italie : pique, épée et arquebuse intégrés dans une seule unité tactique. L'infanterie lourde la plus disciplinée de l'Europe du XVIe siècle."

# ============================================================================
# Levy
# ============================================================================
 levy_nd_cda_catalan_galley: "Galère de prélèvement catalan"
 levy_nd_cda_catalan_galley_desc: "Prélèvement sur les galères financé par les bourgeois et composé d'équipages de paysans et d'ouvriers et prélevé dans les villes portuaires méditerranéennes de la Couronne."

# ============================================================================
# Custom Buildings
# ============================================================================
 nd_cda_casa_llotja_de_mar: "Caricatore"
 nd_cda_casa_llotja_de_mar_desc: "A royal loading port on the Sicilian model. Grain is stored in pits cut above the quay, weighed by the master portolan and shipped under a licence bought from the Crown. Buyers' factors from every port of the inner sea keep a table here."
 nd_cda_generalitat_hall: "Hall of the Three Arms"
 nd_cda_generalitat_hall_desc: "The house where the three arms of a realm's parliament meet: the barons, the prelates and the syndics of the royal towns. The donative is voted here, and the Crown is held to its sworn pacts."
 nd_cda_magnanimous_court: "Cour magnanime"
 nd_cda_magnanimous_court_desc: "La cour itinérante de la Renaissance fondée par Alphonse V à Naples en 1442. Lorenzo Valla, Beccadelli, Pontano et Manetti y ont servi ; Les scriptoria royales copiaient les manuscrits grecs arrivant en fuite de l'Empire d'Orient en déclin."
 nd_cda_almudin: "Almudn"
 nd_cda_almudin_desc: "Le grand grenier gothique couvert de Valence, étendu à toutes les villes de la Couronne. Stockage alimentaire centralisé, marchés de céréales à des prix équitables et infrastructures d'approvisionnement pour les campagnes méditerranéennes."
 nd_cda_drassanes_reials: "Drassanes Reials"
 nd_cda_drassanes_reials_desc: "Les Chantiers Navals Royaux de Barcelone ont conservé une architecture navale gothique, capable de poser simultanément jusqu'à trente galères sous un seul toit couvert. L’épine dorsale industrielle de la puissance maritime catalano-aragonaise."
 nd_cda_senyera_consulate: "Consulat de Senyera"
 nd_cda_senyera_consulate_desc: "Un consulat catalan du réseau Consols dels Catalans, pilotant le Senyera Reial à quatre barres. Accorde une protection extraterritoriale aux marchands de la Couronne et applique le droit commercial aragonais dans le port d'accueil."
 nd_cda_mediterranean_vineyard: "Vignoble méditerranéen"
 nd_cda_mediterranean_vineyard_desc: "Production de vin des régions viticoles du Peneds, du Priorat, de la Sicile, du Campanien ou des Pouilles. Les vins de la Couronne transitent par le réseau commercial catalan de Bruges à Constantinople."
 nd_cda_almadraba: "Almadraba"
 nd_cda_almadraba_desc: "Le casier à thon rouge almadraba catalano-sicilien. Une pêcherie à l’échelle industrielle alimentant le marché méditerranéen d’exportation du thon salé, l’une des plus grandes industries protéiques prémodernes d’Europe."
 nd_cda_catalan_cotton_mill: "Filature de coton catalane"
 nd_cda_catalan_cotton_mill_desc: "Manufacture de coton imprimé de Barcelone. L'industrie indienne a mécanisé la fbrica de Espanya, l'atelier industriel de la défunte couronne aragonaise."

# ============================================================================
# Production Method Display Names
# ============================================================================
 nd_cda_llotja_maintenance: "Loading Port Operations"
 nd_cda_llotja_maintenance_desc: "The licence registers and ledgers of the master portolan, and the table kept for the buyers' factors."
 nd_cda_generalitat_maintenance: "Parliament Operations"
 nd_cda_generalitat_maintenance_desc: "The records, sealed acts and ceremonial supplies of a realm's parliament."
 nd_cda_court_patronage: "Patronage de la Cour"
 nd_cda_court_patronage_desc: "Les salaires des érudits humanistes, les livres de la bibliothèque royale, les soieries et les vins d'une cour de la Renaissance."
 nd_cda_almudin_maintenance: "Opérations de grenier"
 nd_cda_almudin_maintenance_desc: "Les stocks de céréales, les réparations de maçonnerie et les ouvrages en bois du système de greniers couverts de Valence."
 nd_cda_drassanes_maintenance: "Opérations du chantier naval"
 nd_cda_drassanes_maintenance_desc: "Le bois, les fournitures navales, le goudron et le fer forgé consommés par les Chantiers Royaux de Barcelone."
 nd_cda_consulate_maintenance: "Opérations du consulat"
 nd_cda_consulate_maintenance_desc: "Le papier, le tissu, les sceaux de cire et les vins de table d'un établissement consul catalan dans un port étranger."
 nd_cda_vineyard_production: "Production de vin"
 nd_cda_vineyard_production_desc: "Viticulture méditerranéenne : le pressoir, la cave, les amphores et les fûts d'exportation des régions viticoles du Peneds, du Priorat, de la Sicile, du Campanien et des Pouilles."
 nd_cda_almadraba_maintenance: "Opérations de casiers à thon"
 nd_cda_almadraba_maintenance_desc: "Les filets, les mâts, le sel et les cordages de l'almadraba à nageoires rouges catalano-siciliennes."
 nd_cda_indianas_production: "Production de l'Indiana"
 nd_cda_indianas_production_desc: "Fabrication mécanisée du coton imprimé : coton, fibre, teinture et premières presses industrielles de l'innovation textile catalane."

 nd_cda_almoixerifat_reform: "Réforme Almoixerifat"
 nd_cda_almoixerifat_reform_desc: "Les bureaux médiévaux des douanes et du trésor aragonais (almoixerifats, à l'origine des institutions andalouses adoptées par la couronne de reconquista) sont rationalisés selon des lignes italiennes tardives et absolutistes, modernisant la collecte des impôts et l'administration de la construction."
 nd_cda_companyies_de_catalans: "Entreprises de Catalans"
 nd_cda_companyies_de_catalans_desc: "Les sociétés par actions de la fin du XIXe siècle, Banc de Barcelona, ​​Companyia Trasatlntica, La Maquinista Terrestre i Martima, financent l'expansion industrielle catalane et transforment les marchés de capitaux de la couronne en l'épine dorsale financière de l'industrialisation de l'Europe du Sud."
 nd_cda_modernisme: "Modernisme"
 nd_cda_modernisme_desc: "Gaud, Domnech et Montaner, Puig et Cadafalch. Le renouveau littéraire de la Renaixena s'épanouit dans une civilisation bâtie qui définit Barcelone comme l'un des centres majeurs de l'art moderne européen."

# Tooltip keys for hidden_effect set_variable lines
 nd_cda_formed_tt: "Formation de l'Empire aragonais"
 nd_cda_path_a_tt: "Chemin Mediterraneum Aragonense choisi"
 nd_cda_path_b_tt: "Voie hispano-aragonaise choisie"
 nd_cda_dest_naples_developed_tt: "We own #bold Naples#! and its development is at least #bold 57#!"
 nd_cda_dest_barcelona_developed_tt: "We own #bold Barcelona#! and its development is at least #bold 60#!"
 nd_cda_dest_palma_developed_tt: "We own #bold Palma#! and its development is at least #bold 35#!"
 nd_cda_dest_valencia_developed_tt: "We own #bold Valencia#! and its development is at least #bold 73#!"
 nd_cda_catalan_galley_levy: "Taxe de galère catalane"
 nd_cda_catalan_galley_levy_desc: "Les villes portuaires méditerranéennes de la Couronne lèvent leurs propres taxes sur les galères. Les bourgeois de Barcelone, Valence, Palma, Naples et Palerme financent les coques ; les paysans et les ouvriers du bord de la Méditerranée les rament. Mobilisation de masse d’une puissance maritime sans le coût d’une flotte permanente."

# ============================================================================
# DESTINY TREE
# ============================================================================
# Path tooltip keys (nd_cda_path_a_tt / nd_cda_path_b_tt) are defined earlier
# in the file with the formation-event variable tooltips.

# Destiny advances
 nd_cda_destiny: "Projet Impérial"
 nd_cda_destiny_desc: "La couronne ainsi formée doit maintenant choisir le type d’empire qu’elle entend devenir. La route bifurque : une thalassocratie de la Méditerranée orientale, ou une puissance coloniale atlantique. Une stabilité supérieure à 75 maintient le royaume uni pour le choix."

 nd_cda_dest_catalan_greece: "Récupérer la Grèce catalane"
 nd_cda_dest_catalan_greece_desc: "Récupérez le duché d'Athènes, le duché de Néopâtre et le comté aragonais de Patras, conquêtes orientales de la Compagnie catalane de 1303 à 1311. Possédez Athènes, Neopatras et Patras et détenez mille pièces d'or pour financer l'expédition."
 nd_cda_dest_aegean_empire: "Empire égéen"
 nd_cda_dest_aegean_empire_desc: "Take the strategic island arc that severs the eastern Mediterranean: Crete (Candia), Rhodes, and Chios. Field an army of fifty thousand men and build up Naples, the capital of the eastern venture, to make the conquest stick."
 nd_cda_dest_mare_nostrum: "Mare Nostrum Aragonense"
 nd_cda_dest_mare_nostrum_desc: "The Mediterranean is the Crown's lake. Hold Famagusta on Cyprus, Alexandria in Egypt, and Tunis at the choke point of the inner sea. Three thousand gold, seventy-five prestige and a Barcelona grown into the home port of the inner sea mark the apex. Unlocks the Drassanes Maxima."

 nd_cda_dest_atlantic_bridgehead: "Tête de pont de l'Atlantique"
 nd_cda_dest_atlantic_bridgehead_desc: "Saisissez les archipels étapes de l'Atlantique : les Canaries (Teguise), Madère (Funchal) et les Açores (Ponta Delgada). Avec mille pièces d'or en réserve, la Couronne transpose sa tradition de navigation à travers les Colonnes d'Hercule."
 nd_cda_dest_catalan_caribbean: "Caraïbes catalanes"
 nd_cda_dest_catalan_caribbean_desc: "Plant the four bars over Hispaniola (Bohio) and Cuba (La Habana), embrace the New World institution, and build up Palma, whose chartmakers and captains first sailed for the ocean islands. The first Catalan-Aragonese plantation Atlantic."
 nd_cda_dest_atlantic_empire: "Empire atlantique catalan"
 nd_cda_dest_atlantic_empire_desc: "Reach the mainland: Tenochtitlan (the Mexica capital), Calamari (Cartagena de Indias) and Mayapan (Yucatan) all under Catalan-Aragonese sponsorship. Three thousand gold, seventy-five prestige and a Valencia grown rich on financing the voyages. Unlocks the Casa de Contratacio Catalana."

# Destiny event titles, descriptions, and option text
# nd_cda.7: Destiny root acknowledgment
 nd_cda.7.t: "Le projet impérial"
 nd_cda.7.d: "Le conseil royal de Barcelone a tranché la question. Le royaume est un, le trône est un, le projet est un et la voie à suivre sera désormais mesurée en objectifs concrets, et non en abstractions de la rhétorique de cour. La chronique de ce que deviendra la couronne d'Aragon ouvre un nouveau chapitre, et les secrétaires du roi s'y mettent."
 nd_cda.7.a: "Que le travail commence."

# nd_cda.8: Path A Stage 1: Catalan Greece
 nd_cda.8.t: "Les duchés restaurés"
 nd_cda.8.d: "Athènes est tombée. Néopatras s'est incliné. La bannière aragonaise flotte à nouveau sur l'Acropole, où la Compagnie catalane de Roger de Flor a soulevé pour la première fois en 1311 une revendication vieille de deux siècles, en sommeil depuis que les Acciaiuoli florentins ont expulsé le dernier duc catalan en 1388, désormais consolidé avec de l'acier. La chronique de Ramon Muntaner est relue à haute voix à la cour. La frontière orientale de la Couronne est rouverte."
 nd_cda.8.a: "Athènes est à nouveau à nous."

# nd_cda.9: Path A Stage 2: Aegean Empire branching
 nd_cda.9.t: "La garnison égéenne"
 nd_cda.9.d: "Candia, Rhodes, Chios (the strategic island chain of the eastern Mediterranean) all bow to the four bars. Venetian galleys must now ask permission to pass; Genoese factors petition the Crown for trade licenses; Mamluk envoys arrive in Naples to sound out terms. The kingdom has the islands. The question is what kind of empire to administer them as.\n\nThe military council wants strong garrisons in every island citadel: Aragonese soldiers, Catalan officers, the Acropolis at Athens turned back into a fortress as in the Catalan Company days. The chancellery prefers the Venetian model: bailiffs and consuls, hands-off rule, integration of the Greek and Latin populations through privilege rather than presence."
 nd_cda.9.a: "Mettez en garnison chaque citadelle."
 nd_cda.9.b: "Baillis et bailliages de style vénitien."

# nd_cda.10: Path A Stage 3: Mare Nostrum branching
 nd_cda.10.t: "Mare Nostrum"
 nd_cda.10.d: "Famagusta, Alexandria, Tunis. The three terminals of the eastern Mediterranean trade triangle all fly the Senyera. The pilots of Genoa and Venice file their cargoes through Catalan consulates; the Mamluk sultanate has either fallen or come to terms; the Maghreb pays the Crown's tribute. There has not been a Mediterranean power of this scale since Rome.\n\nThe court must now decide what to do with such a position. The Pope offers a crusade title and the right to call any expedition against the Ottomans a holy war. The merchant houses of Barcelona prefer that the king consolidate the peace and turn the inner sea into a free Aragonese trading lake under a single administered customs system."
 nd_cda.10.a: "Prenez la croix des croisés et terminez le travail."
 nd_cda.10.b: "La paix du roi Mare Pacatum."

# nd_cda.11: Path B Stage 1: Atlantic Bridgehead
 nd_cda.11.t: "Les piliers croisés"
 nd_cda.11.d: "Les Canaries sont aragonais. Madère est aragonaise. Les Açores sont aragonais. Trois archipels formant une chaîne de tremplin à travers l'Atlantique, la même chaîne que celle utilisée dans une autre chronologie par la Castille pour atteindre les Indes, constituent désormais la tête de pont de la Couronne. Les marins catalans qui ont passé deux siècles à apprendre la Méditerranée pratiquent cette science à travers le détroit de Gibraltar. L'océan occidental est devenu un espace navigable."
 nd_cda.11.a: "Vers l'ouest."

# nd_cda.12: Path B Stage 2: Catalan Caribbean branching
 nd_cda.12.t: "Les Indes catalanes"
 nd_cda.12.d: "Hispaniola is the Crown's. Cuba is the Crown's. La Habana flies the four bars rather than the lions and castles. The first Aragonese-Catalan plantations are set out, Catalan emigrants disembark at the new docks, and the question of how to administer the Indies becomes urgent.\n\nThe military adventurers (the conquistadors) petition the king for charters to conquer mainland kingdoms in his name. The clergy and the chancellery want a more orderly system: encomiendas administered through licensed grants, missionary orders training a converted indigenous labor force, and the Crown holding a tighter rein on its colonial captains."
 nd_cda.12.a: "Affrétez les conquistadors."
 nd_cda.12.b: "Licence du système encomienda."

# nd_cda.13: Path B Stage 3: Atlantic Empire branching
 nd_cda.13.t: "La Casa de Contratacio"
 nd_cda.13.d: "Tenochtitlan has fallen. The Yucatan is administered. Calamari sends its emerald and gold convoys up to Barcelona under Catalan flags. The Atlantic empire is now a fact, and the Crown founds in Barcelona the Casa de Contratacio Catalana, the trade administration that will license every voyage to the Indies, levy the royal fifth on every cargo, and adjudicate every colonial dispute under the Consolat de Mar.\n\nThe court debates how to run the system. The merchants of Barcelona, Valencia and Palma want a tightly licensed monopoly trade: Indies bullion flowing through a few designated ports under fixed customs schedules. The Trastamara administrators see otherwise: open the colonial system to Catalan migration, integrate the colonies into the realm as overseas kingdoms, raise their development the way Naples and Sicily were raised."
 nd_cda.13.a: "Le monopole échange les Indes contre la Couronne."
 nd_cda.13.b: "Implantation et intégration des royaumes d'outre-mer."

# Destiny timed modifier names and descriptions
 STATIC_MODIFIER_NAME_nd_cda_dest_acropolis_garrison: "Garnison de l'Acropole"
 STATIC_MODIFIER_DESC_nd_cda_dest_acropolis_garrison: "Soldats aragonais dans chaque citadelle de l'île, d'Athènes à Rhodes. Officiers catalans, sergents aragonais, garnisons de forteresse entraînés selon la vieille tradition d'Almogavar. Difficile de les déloger, mais les renforcer à travers la Méditerranée orientale coûte bien plus cher que le renforcement des fronts intérieurs."
 STATIC_MODIFIER_NAME_nd_cda_dest_catalan_bailiwick: "Bailliages catalans"
 STATIC_MODIFIER_DESC_nd_cda_dest_catalan_bailiwick: "Le modèle vénitien gouverne de manière légère par l’intermédiaire d’huissiers, de consuls et d’élites grecques et latines cooptées localement. Le Senyera vole mais ne met pas en garnison. La diplomatie remplace l’occupation."
 STATIC_MODIFIER_NAME_nd_cda_dest_crusader_aragon: "Croisé Aragon"
 STATIC_MODIFIER_DESC_nd_cda_dest_crusader_aragon: "Le pape accorde le titre de croisade. Les armes aragonaises transforment la domination méditerranéenne en une guerre sainte contre les Ottomans, les Mamelouks et le Maghreb. L'avantage tactique contre les incroyants se paya en épuisement de guerre parmi les sujets chrétiens de la Couronne."
 STATIC_MODIFIER_NAME_nd_cda_dest_sea_kings_peace: "La paix de Sea King"
 STATIC_MODIFIER_DESC_nd_cda_dest_sea_kings_peace: "La Méditerranée devient une zone douanière administrée unique sous arbitrage aragonais. Les maisons de commerce de Barcelone prospèrent, l'armée coûte moins cher à entretenir et les accords de paix sont négociés à partir d'une position de suprématie régionale incontestée."
 STATIC_MODIFIER_NAME_nd_cda_dest_conquistadors_catalans: "Conquistadors Catalans"
 STATIC_MODIFIER_DESC_nd_cda_dest_conquistadors_catalans: "La Couronne accorde des chartes de conquête aux aventuriers militaires de Catalogne, de Valence et de Naples. Les royaumes indigènes du continent tombent aux mains de petites bandes de capitaines catalans-aragonais armés de canons, au prix de l'inflation qu'entraînent toujours les chocs sur les lingots."
 STATIC_MODIFIER_NAME_nd_cda_dest_encomienda_catalana: "Encomienda catalane"
 STATIC_MODIFIER_DESC_nd_cda_dest_encomienda_catalana: "Subventions d'encomienda sous licence administrées par les ordres missionnaires. La conversion de la population indigène se fait à travers les écoles et les paroisses ; les sujets coloniaux s'intègrent dans le royaume de la Couronne en vertu des mêmes pactes constitutionnels qui régissent la Catalogne, Valence et Naples."
 STATIC_MODIFIER_NAME_nd_cda_dest_indies_trade: "Monopole du commerce des Indes"
 STATIC_MODIFIER_DESC_nd_cda_dest_indies_trade: "La Casa de Contratacio autorise chaque voyage. Les lingots indiens transitent par Barcelone, Valence et Palma sous un contrôle douanier strict. La capacité diplomatique se développe et les guerres deviennent moins coûteuses à déclarer, mais le prestige de la Couronne se dégrade légèrement à mesure que le projet impérial devient une entreprise commerciale plutôt que chevaleresque."
 STATIC_MODIFIER_NAME_nd_cda_dest_atlantic_dominion: "Domination atlantique"
 STATIC_MODIFIER_DESC_nd_cda_dest_atlantic_dominion: "Les colonies sont intégrées en tant que royaumes d'outre-mer comme Naples ou la Sicile, uniquement de l'autre côté de l'océan. Les émigrés catalans cultivent des plantations et des villes ; la position de la Couronne parmi les grandes puissances est reconnue ; la croissance démographique et la reprise coloniale sont accélérées par le système de colonisation ouvert."

# Destiny capstone buildings
 nd_cda_drassanes_maxima: "Drassanes Maxima"
 nd_cda_drassanes_maxima_desc: "L'évolution à l'échelle impériale des Drassanes Reials. Un grand quartier général naval méditerranéen construit dans le cadre du projet Mare Nostrum, capable de mettre en service quatre navires de guerre à la fois et de soutenir la flotte orientale de la Couronne à partir d'un seul chantier naval."
 nd_cda_drassanes_maxima_maintenance: "Opérations du chantier naval impérial"
 nd_cda_drassanes_maxima_maintenance_desc: "Le bois, les provisions navales, le goudron, le fer et les armes consommés par l'évolution à l'échelle impériale des chantiers navals royaux."

 nd_cda_casa_contratacio: "Casa de Contratación Catalana"
 nd_cda_casa_contratacio_desc: "Le parallèle de Barcelone avec la Casa de Contratación castillane. Autorise chaque voyage vers les Indes, prélève le cinquième royal sur les cargaisons de lingots, enregistre les émigrants catalans et tranche les différends commerciaux coloniaux sous la direction du Consolat de Mar, l'administration commerciale impériale de la Couronne."
 nd_cda_casa_contratacio_maintenance: "Opérations de la maison de commerce"
 nd_cda_casa_contratacio_maintenance_desc: "Le papier, les registres, les tissus fins et les meubles de chambre de l'administration commerciale impériale de la Couronne à Barcelone."

# ============================================================================
# Bureaucracies (4 institutions; 2 slots granted by auto_modifier + 1 capital = 3 effective)
# ============================================================================
 AUTO_MODIFIER_NAME_nd_cda_bureaucracy_authority: "Couronne des Chancelleries d'Aragon"
 AUTO_MODIFIER_DESC_nd_cda_bureaucracy_authority: "The Crown's pactist administration spans four kingdoms separated by sea. The royal council may keep two of its four standing institutions at once."

 cda_reial_cancelleria_bureaucracy: "Reial Cancelleria d'Arag"
 cda_reial_cancelleria_bureaucracy_desc: "La chancellerie royale aragonaise, professionnalisée sous Jaume II à partir de 1290 environ et codifiée par les Ordinacions de la Casa Reial de Pere III de 1344. Composé de lettres formées à l'université, il publie des décrets en catalan, en aragonais, en latin et (à partir d'Alphonse V) en italien, maintenant l'un des registres diplomatiques les plus disciplinés d'Europe médiévale, le fondement de la prose littéraire catalane et la cohérence administrative de la Couronne dans quatre royaumes séparés par la mer."

 cda_generalitat_bureaucracy: "Corts Generals de Montsó"
 cda_generalitat_bureaucracy_desc: "The general parliament of the whole Crown, first gathered at Monzón in 1289. The town lies on the border of Aragon and Catalonia, so Aragonese, Catalans and Valencians can be summoned to one place without any of them leaving the Crown's own ground for a foreign realm. Each sits apart and votes by its own laws, and the king hears their grievances before a donative is granted. One summons serves every realm, and none of them is bound by what another conceded."

 cda_consolat_de_mar_bureaucracy: "Consolat de Mar"
 cda_consolat_de_mar_bureaucracy_desc: "Première juridiction maritime de la Méditerranée, affrété à Valence en 1283 par Père III le Grand et codifiée dans la Llibre del Consolat de Mar, dont les articles régissent la responsabilité des armateurs, les salaires des équipages et les cas de prise de Barcelone à Messine en passant par Trapani. Au XVe siècle, sa jurisprudence en langue catalane est la lingua franca du commerce méditerranéen, citée dans les tribunaux génois et vénitiens et traduite dans toutes les principales langues méditerranéennes."

 cda_sommaria_bureaucracy: "Regia Camera della Sommaria"
 cda_sommaria_bureaucracy_desc: "Tribunal suprême des comptes du royaume de Naples, agrandi par Alphonse V le Magnanime après sa conquête en 1442 d'un noyau angevin du XIIIe siècle. Ses luogotenenti et razionali vérifient tous les revenus du domaine, les droits de douane et les taxes féodales dues des Abruzzes à la Calabre, fournissant ainsi l'épine dorsale fiscale qui finance la cour humaniste d'Alphonse à Castel Nuovo et ses guerres d'Italie. Naples devient l'atelier de l'art politique aragonais de la fin du Moyen Âge."
