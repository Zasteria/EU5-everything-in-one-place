l_french:
 YMP: "Yamato"
 YMP_ADJ: "Japonais impérial"
 YMP_f: "Empire Yamato"
 YMP_f_desc: "Le rêve pour lequel Toyotomi Hideyoshi est mort. En 1592, il lança les armées de samouraïs du Japon unifié contre la Corée et vers la Chine Ming, dans le but rien de moins qu'un empire dirigé par le Japon sur toute l'Asie de l'Est ; seule sa mort en 1598 fit échouer la campagne et donna à Tokugawa un prétexte pour deux siècles et demi d'isolement. L’empire Yamato est l’alternative : le bakufu refuse le sakoku, la guerre Imjin réussit et le trône du chrysanthème s’étend de Hokkaido au Yangtsé en passant par Hanseong. Les châteaux japonais s'élèvent au-dessus de Pyongyang, les samouraïs deviennent le corps d'officiers impériaux d'un ordre continental et le Mikado règne sur un empire d'Asie de l'Est construit à partir de l'ambition d'Edo plutôt que de son isolement."
