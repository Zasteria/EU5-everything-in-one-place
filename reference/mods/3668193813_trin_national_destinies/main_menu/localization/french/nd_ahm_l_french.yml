l_french:
 # Formation Event
 nd_ahm.1.t: "Le mandat de Swargadeo rétabli"
 nd_ahm.1.d: "Six centuries since Sukaphaa led his Tai band over the Patkai passes into the Brahmaputra valley, the Swargadeo's banner is raised again over Charaideo. The maidam mounds of seventeen kings stand untouched on the ridge above us. The paik bells ring across the valley calling every household to service. The seven Borgohain offices await their charters, the Borphukan rides out toward Guwahati, and the namghars of Sankardev's disciples are filling with gathered villagers. The Mughals battered themselves seventeen times against this kingdom and broke; now we choose what shape the unconquered realm will take.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ahm.1.a: "Restaurer le mandat Tai de Swargadeo"
 nd_ahm.1.b: "Embrassez le dharma Vaishnava de Sankardev"

 # DHE Battle of Saraighat
 nd_ahm.2.t: "Lachit Borphukan sur le Brahmapoutre"
 nd_ahm.2.d: "L'armada moghole de Ram Singh est ancrée au large de Saraighat. Lachit Borphukan, mourant de fièvre et porté dans une civière, a refusé de battre en retraite. Ce soir, le Borphukan rassemble ses commandants : la flotte Bachari devrait-elle tendre une embuscade aux navires de guerre moghols au coude du fleuve où le Brahmapoutre se rétrécit, ou devrions-nous brûler nos propres villages, nous retirer dans les collines et laisser la mousson et la jungle tuer ? Les Moghols n’ont jamais perdu une campagne, mais ils n’ont jamais non plus combattu dans notre pays."
 nd_ahm.2.a: "Frappez au coude de la rivière, laissez le Brahmapoutre être leur tombe"
 nd_ahm.2.b: "Brûlez la vallée, laissez la jungle et la mousson les tuer"

 # DHE Sankardev's Vaishnavism
 nd_ahm.3.t: "La Bhakti de Srimanta Sankardev"
 nd_ahm.3.d: "Srimanta Sankardev est descendu du pèlerinage de Mahapurusha avec la dévotion Eka-Sarana à un Dieu unique, accessible sans prêtres brahmanes, chantée en assamais dans les namghars de chaque village. Les satras se remplissent de disciples. L’orthodoxie brahmane de notre cour appelle cela une hérésie. Les peuples Bodo et Kachari trouvent un chemin vers notre religion qui ne nécessite pas qu’ils abandonnent leurs dieux. Le Swargadeo doit statuer sur ce que Eka-Sarana signifie pour le royaume."
 nd_ahm.3.a: "Faites d'Eka-Sarana la foi du royaume"
 nd_ahm.3.b: "Que les namghars se tiennent à côté des vieux sanctuaires"

 # DHE Buranji Tradition
 nd_ahm.4.t: "Les Buranjis de la Cour"
 nd_ahm.4.d: "Les historiens de la cour ont achevé le dernier volume du Buranji relatant les règnes des Swargadeos, les ambassades reçues, les guerres menées, les lignées des grandes fonctions. Écrits d'abord en écriture Tai-Ahom et désormais traduits en assamais, les Buranjis sont la mémoire du royaume. Peu d’États d’Asie du Sud tiennent des registres aussi systématiques que les nôtres ; peu de dirigeants peuvent parler avec l’autorité de six siècles de continuité dynastique documentée. Le tribunal ordonne que les chroniques soient formellement codifiées et que des copies soient envoyées à chaque satra."
 nd_ahm.4.a: "Les Buranjis préservent la mémoire du royaume"

 # DHE Paik Codification
 nd_ahm.5.t: "Le rouleau Paik"
 nd_ahm.5.d: "Chaque homme adulte de la vallée doit du service. Les ministres Borgohain ont achevé le grand recensement du paik : chaque maison apporte un paik à l'État, organisé en got de trois ou quatre hommes, affectés à l'une des grandes fonctions. Trois paiks soutiennent le quatrième sur le terrain. La milice du royaume, son travail pour les routes, les digues et les chantiers navals, son assiette fiscale dérivent tous de cette institution unique. Avec les rôles codifiés, aucun Swargadeo ne gouvernera sans connaître la force de son royaume envers l'homme."
 nd_ahm.5.a: "Le système Paik est l’épine dorsale du royaume"

 # Static Modifiers
 STATIC_MODIFIER_NAME_nd_ahm_swargadeo_mandate: "Mandat de Swargadeo"
 STATIC_MODIFIER_DESC_nd_ahm_swargadeo_mandate: "La restauration Tai-Ahom : corvée paik, cour Buranji, les sept grands offices et la tradition équestre de la noblesse dragon, le royaume invaincu des héritiers de Sukaphaa."
 STATIC_MODIFIER_NAME_nd_ahm_eka_sarana_dharma: "Eka-Sarana Dharma"
 STATIC_MODIFIER_DESC_nd_ahm_eka_sarana_dharma: "Le néo-Vaishnavisme de Sankardev comme principe organisateur du royaume : namghar dans chaque village, satra dans chaque district, dévotion accessible à toutes les castes comme aux peuples des collines."
 STATIC_MODIFIER_NAME_nd_ahm_lachit_naval_doctrine: "La doctrine de la rivière Lachit"
 STATIC_MODIFIER_DESC_nd_ahm_lachit_naval_doctrine: "Le Brahmapoutre est notre mur. La flotte Bachari patrouille dans les virages ; le canon fluvial répond depuis les berges fortifiées ; aucune armada moghole ne passera."
 STATIC_MODIFIER_NAME_nd_ahm_jungle_resistance: "Résistance de la jungle"
 STATIC_MODIFIER_DESC_nd_ahm_jungle_resistance: "Villages incendiés, population retirée, embuscades sur les collines, attrition de la mousson, l'envahisseur combat les moustiques et la famine plus que les soldats."
 STATIC_MODIFIER_NAME_nd_ahm_official_vaishnavism: "Vaishnavisme officiel"
 STATIC_MODIFIER_DESC_nd_ahm_official_vaishnavism: "Eka-Sarana comme religion d'État : fréquentation du namghar obligatoire, patronage du satra central, les peuples des collines attirés dans le giron sanskritisé."
 STATIC_MODIFIER_NAME_nd_ahm_religious_pluralism: "Pluralisme religieux"
 STATIC_MODIFIER_DESC_nd_ahm_religious_pluralism: "Sanctuaires Tai, temples Saiva, namghars Vaishnava et bosquets sacrés tribaux, tous sous la protection du Swargadeo, la religion du royaume est la religion de chaque village."
 STATIC_MODIFIER_NAME_nd_ahm_buranji_court: "Tribunal de Buranji"
 STATIC_MODIFIER_DESC_nd_ahm_buranji_court: "Six siècles de continuité dynastique documentée, copiés dans chaque satra et cités dans chaque échange diplomatique, un État avec une mémoire plus longue que n'importe lequel de ses rivaux."
 STATIC_MODIFIER_NAME_nd_ahm_paik_codified: "Paik codifié"
 STATIC_MODIFIER_DESC_nd_ahm_paik_codified: "Chaque mâle adulte inscrit sur les listes, chacun des quatre assignés à son bureau, chaque digue, route et chantier naval construit par le travail rémunéré que le royaume mobilisait pour la maison."

 # Advances
 nd_ahm_paik_system: "Le système Paik"
 nd_ahm_paik_system_desc: "L'institution de corvée de travail qui organisait chaque homme adulte Ahom en un got de quatre et assignait chacun à l'un des grands bureaux. La milice du royaume, ses travaux publics et son assiette fiscale dérivent tous du paik."
 nd_ahm_buranji_tradition: "Chroniques de Buranji"
 nd_ahm_buranji_tradition_desc: "La tradition des chroniques judiciaires commencées sous Sukaphaa, écrite d'abord en Tai-Ahom puis en Assamais, constitue l'une des grandes historiographies de l'Asie du Sud et l'épine dorsale documentaire de la continuité dynastique."
 nd_ahm_charaideo_maidam: "Charaideo Maidams"
 nd_ahm_charaideo_maidam_desc: "La nécropole du monticule royal de Charaideo, où la tradition funéraire dérivée de Tai s'est poursuivie pendant six siècles de rois Ahom, le cœur spirituel du royaume et le site légitime de chaque couronnement."
 nd_ahm_borgohain_offices: "Les sept grands offices"
 nd_ahm_borgohain_offices_desc: "Burhagohain, Borgohain, Borpatrogohain, Borphukan, Borbarua et les fonctions inférieures, une noblesse de conseil qui équilibrait l'autorité royale et administrait le royaume de Charaideo à Guwahati."
 nd_ahm_hill_auxiliaries: "Auxiliaires de colline"
 nd_ahm_hill_auxiliaries_desc: "Les combattants Garo, Naga, Bodo et Kachari ont été attirés au service d'Ahom grâce à une alliance rémunérée et à une exemption de corvée, maîtres du terrain de la jungle qui a brisé toutes les armées d'invasion."
 nd_ahm_riverine_fleet: "La flotte du Brahmapoutre"
 nd_ahm_riverine_fleet_desc: "Les bateaux fluviaux légers Bachari et Kosa armés de canons formaient la flotte de patrouille qui contrôlait les virages et les points d'étranglement du Brahmapoutre sous le commandement du Borphukan."
 nd_ahm_namghar_network: "Réseau Namghar"
 nd_ahm_namghar_network_desc: "Salle de prière néo-Vaishnava de Sankardev, l'institution au niveau du village de la religion Eka-Sarana qui relie colline, vallée et rivière selon un rituel de dévotion partagé."
 nd_ahm_eka_sarana_movement: "Le mouvement Eka-Sarana"
 nd_ahm_eka_sarana_movement_desc: "La réforme bhakti de Srimanta Sankardev : dévotion à un Dieu unique en assamais vernaculaire, accessible sans prêtres brahmanes, attirant à la fois les fidèles des tribus et des castes inférieures."
 nd_ahm_tai_dragoons: "Dragons Tai"
 nd_ahm_tai_dragoons_desc: "Infanterie montée de la cour Ahom, descendante de la tradition de cavalerie Tai qui traversa le Patkai avec Sukaphaa, l'arme de frappe d'élite du royaume."
 nd_ahm_saraighat_doctrine: "Doctrine Saraighat"
 nd_ahm_saraighat_doctrine_desc: "Les tactiques navales et terrestres de Lachit Borphukan qui détruisirent la flotte moghole à Saraighat en 1671 coordonnèrent l'embuscade de Bachari, l'artillerie des berges et l'assaut maritime d'élite."
 nd_ahm_dolakharia_dockyard: "Chantier naval de Dolakharia"
 nd_ahm_dolakharia_dockyard_desc: "Le quartier général naval du Borphukan à Guwahati, la forteresse fluviale et le chantier naval contrôlant l'embouchure du Brahmapoutre, là où le royaume rencontrait la frontière moghole."
 nd_ahm_satra_monasteries: "Monastères Satra"
 nd_ahm_satra_monasteries_desc: "Les complexes monastiques des successeurs institutionnels de Sankardev sont devenus des puissances économiques, culturelles et politiques à part entière, des dépositaires de l'érudition des manuscrits et de la réforme Vaishnava."
 nd_ahm_seventeen_invasions: "Dix-sept invasions repoussées"
 nd_ahm_seventeen_invasions_desc: "Depuis le raid de Turbak en 1532 jusqu'aux campagnes mogholes des années 1660 et 1670, chaque expédition impériale en Assam s'est brisée contre la jungle, la mousson et les défenses du Borphukan."
 nd_ahm_brahmaputra_command: "Commandement du Brahmapoutre"
 nd_ahm_brahmaputra_command_desc: "La rivière sert d'autoroute logistique et de barrière, permettant un mouvement rapide des Ahom, refusant l'approvisionnement des ennemis et reliant la vallée là où les routes ne pouvaient pas atteindre."
 nd_ahm_jaibanmar_artillery: "Artillerie de Jaibanmar"
 nd_ahm_jaibanmar_artillery_desc: "Le corps d'artillerie lourde Ahom, mélangeant des conceptions indiennes et perses dans des canons pivotants d'artillerie de campagne et fluviale sur des navires de guerre, des canons jaiban dans des positions fortifiées."
 nd_ahm_ryotwari_paik: "La réforme Paik de Rudra Singha"
 nd_ahm_ryotwari_paik_desc: "La restructuration par Rudra Singha du système de corvée formalisant le service militaire, l'obligation de travaux publics et l'évaluation des revenus dans une seule institution intégrée."
 nd_ahm_muga_silk: "Culture de la soie Muga"
 nd_ahm_muga_silk_desc: "La soie dorée d'Assam, produite à partir du ver à soie Antheraea assamensis, un textile unique à la vallée du Brahmapoutre et l'exportation de luxe la plus distinctive du royaume."
 nd_ahm_chronicle_codification: "Codification des Chroniques"
 nd_ahm_chronicle_codification_desc: "Codification formelle des Buranjis par les historiens de la cour sous Rudra Singha, fixant les archives dynastiques et administratives comme corpus documentaire légitimant le royaume."
 nd_ahm_modern_paltan: "Perceuse Paltan moderne"
 nd_ahm_modern_paltan_desc: "Les exercices d'infanterie d'influence européenne se sont combinés au recrutement paik, les réformes modernisatrices adoptées à la fin de la période Ahom pour faire face aux armées birmanes et britanniques équipées d'armes à feu."
 nd_ahm_assam_tea: "Culture du thé Assam"
 nd_ahm_assam_tea_desc: "La culture singulière qui a défini l'économie moderne de la vallée du Brahmapoutre. Les plantations de thé se sont d'abord développées sous le patronage d'Ahom, puis agrandies par les planteurs coloniaux."
 nd_ahm_borphukan_office: "La vice-royauté du Borphukan"
 nd_ahm_borphukan_office_desc: "La gouvernance vice-royale du Bas Assam depuis Guwahati, équilibrant la cour de Swargadeo à Rangpur et Charaideo et gérant la frontière moghole."
 nd_ahm_swargadeo_court: "Cour de Swargadeo"
 nd_ahm_swargadeo_court_desc: "L'évolution absolutiste de la royauté Ahom sous Rudra Singha et Siva Singha, avec une cérémonie judiciaire formelle, une loi codifiée et une haute culture sanscrite patronnée."
 nd_ahm_anti_burmese_resistance: "Résistance anti-birmane"
 nd_ahm_anti_burmese_resistance_desc: "La brutale occupation birmane de 1817 à 1826 a brisé le royaume mais a forgé une identité vernaculaire assamaise dans la résistance, une défense partisane liant à nouveau collines et vallées."
 nd_ahm_assamese_revival: "Renouveau culturel assamais"
 nd_ahm_assamese_revival_desc: "Littérature vernaculaire, danse sattriya des satras et synthèse des traditions Tai, Bodo, Kachari et sanskritique en une identité culturelle assamienne unifiée."
 nd_ahm_brahmaputra_industry: "Industrie du Brahmapoutre"
 nd_ahm_brahmaputra_industry_desc: "Modernisation tardive de l'économie fluviale avec des moulins, des chantiers navals et des usines textiles sur les rives du Brahmapoutre."
 nd_ahm_modernized_levy: "Prélèvement Paltan modernisé"
 nd_ahm_modernized_levy_desc: "Le système de corvée Paik a été mis à jour pour former une infanterie de ligne entraînée en Europe, synthèse de six siècles de recrutement Ahom et de doctrine militaire moderne."

 # Buildings
 nd_ahm_paik_office: "Bureau Paik"
 nd_ahm_paik_office_desc: "Bureau des travaux de corvée relevant d'un des grands offices, organisant le village en quatre dans la milice, les équipes de travail et la base des revenus du royaume."
 nd_ahm_paik_office_maintenance: "Fonctionnement du Bureau Paik"
 nd_ahm_paik_office_maintenance_desc: "Les commis, les scribes et les surveillants maintiennent les rôles de paik et assignent les ménages au service."
 nd_ahm_buranji_archive: "Archives Buranji"
 nd_ahm_buranji_archive_desc: "Le scriptorium des chroniques judiciaires où les histoires du royaume en langue Tai-Ahom et Assamais sont écrites, copiées et stockées la mémoire documentaire du royaume."
 nd_ahm_buranji_maintenance: "Scriptorium de Buranji"
 nd_ahm_buranji_maintenance_desc: "Scribes copiant des volumes de chroniques sur des manuscrits sanchipat en utilisant de l'encre, de la cire d'abeille et des couvertures en papier relié."
 nd_ahm_maidam_complex: "Complexe Charaideo Maidam"
 nd_ahm_maidam_complex_desc: "La nécropole du monticule royal où la tradition funéraire dérivée de Tai s'est poursuivie pendant six siècles de rois Ahom, le cœur spirituel du royaume."
 nd_ahm_maidam_maintenance: "Vénération de Madame"
 nd_ahm_maidam_maintenance_desc: "Monticules de terre aux parois de pierre entretenus par des réparations de maçonnerie, des reconsécrations périodiques et les offrandes des membres vivants de la lignée royale."
 nd_ahm_namghar: "Namghar"
 nd_ahm_namghar_desc: "Salle de prière du village de Sankardev, noyau institutionnel de la religion Eka-Sarana : salle ouverte avec support central pour les écritures, récitation commune et aucun sanctuaire restreint à la caste."
 nd_ahm_namghar_maintenance: "Culte de Namghar"
 nd_ahm_namghar_maintenance_desc: "Le rassemblement quotidien du naam-prasanga, la récitation du kirtan et les manuscrits du Bhagavata Purana qui ancrent la vie dévotionnelle du village."
 nd_ahm_dockyard: "Chantier naval de Dolakharia"
 nd_ahm_dockyard_desc: "Le quartier général naval du Borphukan à Guwahati, la forteresse fluviale et le chantier naval d'où la flotte du Brahmapoutre part pour faire face à chaque incursion moghole."
 nd_ahm_dockyard_maintenance: "Opérations de la flotte fluviale"
 nd_ahm_dockyard_maintenance_desc: "Charpentiers de bateaux, ouvriers sur câble et équipages de matériel naval entretenant les escadrons de bachari et de kosa de la flotte du Brahmapoutre."
 nd_ahm_satra: "Satra"
 nd_ahm_satra_desc: "Complexe monastique Vaishnava du scriptorium manuscrit de la lignée Eka-Sarana, du centre de dévotion, du domaine agricole et de la circonscription politique réunis en une seule institution."
 nd_ahm_satra_maintenance: "Vie monastique satra"
 nd_ahm_satra_maintenance_desc: "Les bhakats et adhikars du satra dans leurs devoirs de dévotion, de scribe et d'administration sous l'autorité du satradhikar."
 nd_ahm_muga_silk_processing: "Traitement de la soie Muga"
 nd_ahm_muga_silk_processing_desc: "La culture, le dévidage et le tissage de la soie Muga à partir du ver à soie Antheraea assamensis dans des ateliers organisés par des satras, produisant le tissu doré emblématique du royaume."
 nd_ahm_tea_cultivation: "Culture du thé"
 nd_ahm_tea_cultivation_desc: "Camellia sinensis assamica sauvage introduite en culture supervisée par satra, la première production formelle de thé dans la vallée du Brahmapoutre."
 nd_ahm_river_industry: "Travaux industriels du Brahmapoutre"
 nd_ahm_river_industry_desc: "Manufactures modernisées en bord de rivière combinant moulin, chantier naval et usines textiles de la fin de l'Ahom et des infrastructures industrielles post-restauration sur le Brahmapoutre."
 nd_ahm_river_industry_maintenance: "Opérations industrielles"
 nd_ahm_river_industry_maintenance_desc: "Les charpentiers, forgerons et mécaniciens de chantier entretiennent les usines et produisent des outils, du bois et de la ferronnerie transformée pour l'économie régionale."
 nd_ahm_river_textile_works: "Travaux textiles fluviaux"
 nd_ahm_river_textile_works_desc: "Tissage à l'échelle industrielle de coton et de soie Muga destinés à l'exportation via le réseau commercial du Brahmapoutre."

 # Units
 a_nd_ahm_paik_militia: "Milice Paik"
 a_nd_ahm_paik_militia_desc: "Des fantassins enrôlés dans la corvée, la majeure partie de chaque armée Ahom, armés d'une lame khanda, d'un bouclier en peau et d'une mèche ou d'un arc selon l'époque."
 a_nd_ahm_hill_auxiliary: "Auxiliaires de colline"
 a_nd_ahm_hill_auxiliary_desc: "Combattants Garo, Naga, Bodo et Kachari sous le commandement d'Ahom, maîtres des embuscades dans la jungle et des collines brisées entourant la vallée du Brahmapoutre."
 a_nd_ahm_dragoon: "Dragons Tai"
 a_nd_ahm_dragoon_desc: "Infanterie montée de la cour Ahom, descendante de la tradition de cavalerie Tai qui traversait le Patkai avec Sukaphaa, l'arme de frappe d'élite du royaume."
 a_nd_ahm_borphukan_marines: "Marines de Borphukan"
 a_nd_ahm_borphukan_marines_desc: "L'infanterie navale d'élite de Lachit Borphukan, vainqueur à Saraighat en 1671 où ils abordèrent et détruisirent une armada moghole sur le Brahmapoutre."
 a_nd_ahm_jaibanmar: "Artillerie de Jaibanmar"
 a_nd_ahm_jaibanmar_desc: "Corps d'artillerie lourde Ahom, équipé du canon jaiban et des canons pivotants qui combinaient les influences d'artillerie indienne et perse."
 a_nd_ahm_paltan: "Paltan moderne"
 a_nd_ahm_paltan_desc: "L'infanterie de ligne formée par les Européens a été recrutée par le biais de la corvée Paik, les réformes modernisatrices de la fin de la période Ahom, pour faire face à des ennemis équipés d'armes à feu."
 a_nd_ahm_assamese_paltan: "Paltan assamais"
 a_nd_ahm_assamese_paltan_desc: "Infanterie de ligne moderne élevée grâce au recrutement paik, synthèse de six siècles de tradition de prélèvement Ahom et d'exercices militaires contemporains."
 n_nd_ahm_river_warship: "Navire de guerre du Brahmapoutre"
 n_nd_ahm_river_warship_desc: "Les bateaux fluviaux légers Bachari et Kosa armés de canons forment la flotte de patrouille du Brahmapoutre sous le commandement du Borphukan."

 # Variable tooltips (gate the destiny tree)
 nd_ahm_formed_tt: "A formé le royaume Ahom"
 nd_ahm_path_a_tt: "A choisi le mandat Tai de Swargadeo"
 nd_ahm_path_b_tt: "Choisissez le dharma Eka-Sarana de Sankardev"
 nd_ahm_dest_guwahati_developed_tt: "Guwahati is ours and has reached #bold 24#! development"
 nd_ahm_dest_charaideo_developed_tt: "Charaideo is ours and has reached #bold 43#! development"
 nd_ahm_dest_bordowa_developed_tt: "Bordowa is ours and has reached #bold 21#! development"

 # ===== DESTINY TREE =====

 # Destiny advances
 nd_ahm_destiny: "Le royaume invaincu"
 nd_ahm_destiny_desc: "Six siècles de règne des Tai-Ahom, dix-sept invasions mogholes repoussées. Le choix des Swargadeo entre portée impériale et fédération dévotionnelle définira ce que deviendra ce royaume."
 nd_ahm_dest_bengal_frontier: "Poussez vers la vallée de Surma"
 nd_ahm_dest_bengal_frontier_desc: "Cross the Brahmaputra delta and seize the lower Bengal frontier. Take Sylhet on the Surma and Mymensingh on the Old Brahmaputra to break out of the Assamese basin and into Bengal proper. Guwahati, the gate of the valley, is built up as the base of every campaign down the river."
 nd_ahm_dest_bengal_core: "S'emparer des capitales du Bengale"
 nd_ahm_dest_bengal_core_desc: "The Husayn Shahi seats fall before the paik militia. Take Gaur on the Ganges and Sonargaon on the Meghna, the twin capitals of medieval Bengal, and take up the matchlock, as the Ahoms did from the Bengal army they broke in 1533, to hold the conquered country."
 nd_ahm_dest_imperial_court: "L'Imperium de Swargadeo"
 nd_ahm_dest_imperial_court_desc: "Pandua bows, the Burmese frontier breaks at Pinya and Sagaing. The Tai mandate now reaches from the Patkai to the lower Ganges. Charaideo, the first capital and the burial ground of the kings, is rebuilt to twice its old size, and the imperial court there fuses Charaideo dynastic legitimacy with Sanskritic Bengal high culture."
 nd_ahm_dest_satra_outreach: "Les Satras embrassés"
 nd_ahm_dest_satra_outreach_desc: "Sankardev's reform crosses into the wider eastern world. With the Renaissance embraced and Muga silk traded through the kingdom's market, the satras become a network reaching beyond the valley, and Bordowa, where Sankardev was born and raised his first prayer hall, grows into its mother house."
 nd_ahm_dest_bay_pilgrimage: "Le pèlerinage de la Baie-Côte"
 nd_ahm_dest_bay_pilgrimage_desc: "Prenez Chittagong et Khulna, plantez des satras sur la côte des Sundarbans et reliez les embouchures des rivières au réseau Vaishnava. Munie de l’imprimerie et d’un trésor de deux mille pièces d’or, la fédération dévotionnelle atteint la mer."
 nd_ahm_dest_pan_vaishnava: "Le Commonwealth Pan-Vishnava"
 nd_ahm_dest_pan_vaishnava_desc: "Mrauk-U, Chandrawip et Pegu se joignirent sous la protection de Swargadeo. Avec le commerce mondial et trois mille or dans le trésor, le Mahapurusha Mahasattra devient le siège d'un maharaja de l'Est, souverain d'un Commonwealth Vaishnava de la côte de la baie."

 # Destiny event 6: Root committed
 nd_ahm.6.t: "Le destin choisi"
 nd_ahm.6.d: "Les ministres Borgohain se réunissent à Charaideo pour lire les chroniques du choix qui vient d'être fait. Les historiens de la cour préparent de nouveaux volumes Buranji ; les jeunes prêtres consacrent un terrain nouveau aux rois à venir ; le Borphukan chevauche vers l'est pour faire sonner les cloches du paik. Le royaume invaincu entame sa deuxième ère."
 nd_ahm.6.a: "Le règne des Swargadeo recommence"

 # Destiny event 7: Bengal Frontier
 nd_ahm.7.t: "Le Surma et le vieux Brahmapoutre"
 nd_ahm.7.d: "Sylhet est tombé, Mymensingh est tombé, la frontière du bas Bengale est détenue par Ahom Paiks pour la première fois de notre histoire. La chronique dit qu'aucun Tai-Ahom Swargadeo n'a jamais régné à l'ouest du delta du Brahmapoutre. La chronique est désormais fausse. Les gouverneurs Husayn Shahi se retirent à Gaur et envoient des lettres d'alarme à Delhi. Le royaume est passé au Bengale."
 nd_ahm.7.a: "La frontière se déplace vers l'ouest"

 # Destiny event 8: Bengal Core
 nd_ahm.8.t: "Gaur Falls, Sonargaon soumet"
 nd_ahm.8.d: "L’autorité de Husayn Shahi est brisée. Gaur, la grande capitale du Gange, est occupée ; Sonargaon sur la Meghna se soumet à la gouvernance Borgohain. Les historiens de Buranji entament un nouveau chapitre : le royaume de Sukaphaa règne désormais du Patkai au bas Gange. Le conseil de Borgohain débat de la manière de mener la conquête. La corvée paik devrait-elle être étendue aux nouveaux districts, mobilisant chaque foyer bengali dans la machine impériale ? Ou les bureaux de Borgohain devraient-ils être transplantés dans leur intégralité, gouvernant par l’intermédiaire de la noblesse bengali existante ?"
 nd_ahm.8.a: "Étendez la corvée Paik, chaque foyer sert l'imperium"
 nd_ahm.8.b: "Transplanter la gouvernance Borgohain à travers la noblesse locale"

 # Destiny event 9: Imperial Court capstone
 nd_ahm.9.t: "La cour impériale de Charaideo"
 nd_ahm.9.d: "Pandua se soumet, Pinya tombe, les monastères de Sagaing ouvrent leurs portes. La bannière de Swargadeo flotte désormais sur un empire continental s'étendant des collines birmanes jusqu'à la plaine inondable du Gange. La cour de Charaideo est reconstruite comme un siège impérial. Cérémonial sanscrit fusionné au rituel dynastique Tai, chroniques de Buranji fusionnées à l'historiographie de la cour perse. Le Borphukan demande au Swargadeo où se tourne désormais le royaume : consolidation continentale, ou plus loin vers la frontière orientale ?"
 nd_ahm.9.a: "Consolider l'empire de Swargadeo"
 nd_ahm.9.b: "Poussez plus à l’est pour briser la frontière birmane"

 # Destiny event 10: Satra Outreach
 nd_ahm.10.t: "Les Satras s'étendent vers l'extérieur"
 nd_ahm.10.d: "Muga silk passes through the satra workshops and out to the markets of the wider world; the scribes of the satras copy the Bhagavata Purana in Assamese onto leaves of sanchi bark, and the copies are read aloud to lay hearers across the eastern marches. Sankardev's bhakti reform (once a movement of the upper Brahmaputra) now reaches into the Sundarbans and the hill kingdoms beyond. The namghars are beginning to network."
 nd_ahm.10.a: "Laisse l'Eka-Sarana s'écouler vers l'extérieur"

 # Destiny event 11: Bay Pilgrimage
 nd_ahm.11.t: "Les Sundarbans ouverts au Satra"
 nd_ahm.11.d: "Le port de Chittagong et les forêts intertidales de Khulna répondent désormais au Swargadeo. Les satras envoient leurs bhakats sur les rivières pour planter des namghars parmi les pêcheurs des Sundarbans et les planteurs de riz de Chittagong. Les satradhikars débattent de la manière dont le nouveau réseau devrait être gouverné : comme un conseil de satras égaux se réunissant en pèlerinage sur la côte, ou comme un mouvement populaire Eka-Sarana se propageant sans hiérarchie parmi les villageois ordinaires ?"
 nd_ahm.11.a: "Formez le conseil satra sur la côte de la baie"
 nd_ahm.11.b: "Que le mouvement namghar se répande parmi le peuple"

 # Destiny event 12: Pan-Vaishnava capstone
 nd_ahm.12.t: "Le Maharaja de l'Est"
 nd_ahm.12.d: "Mrauk-U s'incline, Chandrawip le rejoint, la cour bouddhiste de Pegu accepte la souveraineté protectrice des Swargadeo. Le Mahapurusha Mahasattra est consacré comme siège d'un Commonwealth Vaishnava s'étendant des Sundarbans au delta de l'Irrawaddy. Le Swargadeo est salué comme le Maharaja de l’Est. La Cour se demande comment ce Commonwealth devrait être organisé : à travers le commerce côtier et les relations diplomatiques avec l'ensemble de l'océan Indien, ou à travers le seul réseau satra, une fédération de dévotion tournée vers l'intérieur ?"
 nd_ahm.12.a: "Ouvrir le Commonwealth au commerce de la Baie"
 nd_ahm.12.b: "Liez la fédération par satra seul"

