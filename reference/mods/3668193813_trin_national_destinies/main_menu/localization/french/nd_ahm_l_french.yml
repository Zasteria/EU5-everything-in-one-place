 # Destiny static modifiers
 STATIC_MODIFIER_NAME_nd_ahm_dest_paik_imperial: "Impérial Paik"
 STATIC_MODIFIER_DESC_nd_ahm_dest_paik_imperial: "Chaque foyer du Bengale conquis entrait sur les rouleaux de paik, le système de corvées s'étendait à l'échelle continentale, la machine impériale mobilisée vers le village."
 STATIC_MODIFIER_NAME_nd_ahm_dest_borgohain_governance: "Gouvernance Borgohain"
 STATIC_MODIFIER_DESC_nd_ahm_dest_borgohain_governance: "Les sept grandes fonctions transplantées au Bengale, gouvernant par l'intermédiaire de la noblesse zamindari existante, une mobilisation plus lente mais une absorption plus douce du pays conquis."
 STATIC_MODIFIER_NAME_nd_ahm_dest_swargadeo_imperium: "L'Imperium de Swargadeo"
 STATIC_MODIFIER_DESC_nd_ahm_dest_swargadeo_imperium: "Charaideo reconstruit comme siège impérial, des garnisons tissées à travers le continent, les Buranjis révisés pour enregistrer un royaume s'étendant du Patkai au bas Gange."
 STATIC_MODIFIER_NAME_nd_ahm_dest_burmese_frontier: "Frontière birmane"
 STATIC_MODIFIER_DESC_nd_ahm_dest_burmese_frontier: "Le Patkai traversa dans l'autre sens. Flottes fluviales sur l'Irrawaddy, garnisons paik dans la zone sèche, dragons Tai chevauchant la haute plaine de Birmanie."
 STATIC_MODIFIER_NAME_nd_ahm_dest_satra_diplomacy: "Diplomatie satra"
 STATIC_MODIFIER_DESC_nd_ahm_dest_satra_diplomacy: "Les bhakats servent d'envoyés ; les satras comme ambassades. La réforme de Sankardev parcourt les routes commerciales de la côte de la Baie sous le sceau de Swargadeo."
 STATIC_MODIFIER_NAME_nd_ahm_dest_namghar_outreach: "Sensibilisation de Namghar"
 STATIC_MODIFIER_DESC_nd_ahm_dest_namghar_outreach: "Le mouvement Eka-Sarana devance la hiérarchie satra namghars dans chaque village de pêcheurs, la dévotion laïque parmi les planteurs de riz des Sundarbans et la côte de Chittagong."
 STATIC_MODIFIER_NAME_nd_ahm_dest_eastern_maharaja: "Maharaja de l'Est"
 STATIC_MODIFIER_DESC_nd_ahm_dest_eastern_maharaja: "Le Commonwealth de la côte de la baie lié par le commerce Chittagong, Mrauk-U, Pegu sous la souveraineté protectrice de Swargadeo, les envoyés de l'océan Indien arrivant à Charaideo."
 STATIC_MODIFIER_NAME_nd_ahm_dest_satra_commonwealth: "Commonwealth des Satras"
 STATIC_MODIFIER_DESC_nd_ahm_dest_satra_commonwealth: "Une fédération tournée vers l'intérieur de namghars et de satras s'étendant du Brahmapoutre à l'Irrawaddy, liés par la dévotion plutôt que de commercialiser la lignée Mahapurusha comme la constitution du royaume."

 # Destiny buildings
 nd_ahm_imperial_court: "Cour Impériale"
 nd_ahm_imperial_court_desc: "La pierre angulaire du chemin A : une cour syncrétique Tai-Hindu combinant le rituel dynastique Charaideo avec la haute culture sanscrite du Bengale, siège de l'imperium continental de Swargadeo."
 nd_ahm_imperial_court_maintenance: "Cérémonie de la Cour Impériale"
 nd_ahm_imperial_court_maintenance_desc: "Soies de cour, papier de cérémonie, meubles laqués et encens rituels respectant le protocole impérial de la cour syncrétique des Swargadeo."
 nd_ahm_mahapurusha_satra: "Mahapurusha Mahasattra"
 nd_ahm_mahapurusha_satra_desc: "La pierre angulaire du Chemin B : le grand satra de la lignée Mahapurusha, siège du satradhikar du Commonwealth pan-Vaishnava et nœud du réseau namghar de la côte de la baie."
 nd_ahm_mahapurusha_maintenance: "Culte du Mahasattra"
 nd_ahm_mahapurusha_maintenance_desc: "Copie de manuscrits, lampes votives à la cire d'abeille, encens pour le naam-prasanga quotidien et livres imprimés apportés par les bhakats aux satras du Commonwealth au sens large."

 # Bureaucracy: institutional layers of the Tai-Ahom polity
 ahm_patro_mantri_sabha_bureaucracy: "Patro Mantri Sabha"
 ahm_patro_mantri_sabha_bureaucracy_desc: "Le conseil permanent des sept grands offices : Burhagohain, Borgohain, Borpatrogohain, Borphukan, Borbarua, Bargohain et les officiers inférieurs. Codifié sous Suhungmung (r. 1497-1539) et élargi sous Pratap Singha, le Sabha confirmait la succession au trône de Swargadeo et pouvait destituer les rois inaptes. Le contrôle constitutionnel du régime Ahom le distinguait de ses voisins moghols et bengalis : les Swargadeo gouvernaient avec le conseil, jamais au-dessus de lui."
 ahm_paik_khel_bureaucracy: "Administration de Paik-Khel"
 ahm_paik_khel_bureaucracy_desc: "Le bureau de corvée permanent sous les gardiens du paik-roll de Likchau. Codifié sous Momai Tamuli Borbarua (1609), chaque homme adulte était inscrit dans un got de trois ou quatre paiks, chaque paik devant un service tournant à un bureau de Khel. Trois paiks soutenaient le quatrième dans la milice ou dans le service du travail. Le système équipait la flotte fluviale du Bachari, construisait les digues du Brahmapoutre et constituait la levée permanente qui a brisé les armées mogholes dix-sept fois au cours du XVIIe siècle."
 ahm_buranji_likchau_bureaucracy: "Buranji Likchau"
 ahm_buranji_likchau_bureaucracy_desc: "L’appareil de chronique judiciaire institutionnalisé. Les Buranjis (le mot signifie « réserve de choses sans précédent ») ont d'abord été écrits en écriture Tai-Ahom, puis en Assamais. Un corps de scribes instruits assistait à chaque audience du tribunal, à chaque ambassade et à chaque campagne, produisant l'une des grandes traditions de chroniques non impériales de l'Asie du Sud. Les Buranjis ont été consultés comme précédent juridique et comme dossier diplomatique jusqu'au XIXe siècle, une mémoire institutionnelle qui manquait aux voisins du royaume."
 ahm_sattradhikar_mandali_bureaucracy: "Sattradhikar Mandali"
 ahm_sattradhikar_mandali_bureaucracy_desc: "L'assemblée institutionnalisée des autorités monastiques Vaishnava, chefs des satras fondée sous Srimanta Sankardev (1449-1568) et codifiée par Madhabdev. Les grands satras - Auniati, Dakhinpat, Garhmur, Kuruwabahi - détenaient des concessions de terres de la couronne en régime debottar et brahmottar, administraient leurs propres cultivateurs, dirigeaient les congrégations du village namghar et arbitraient les différends en dehors des tribunaux Patra Mantri. La dévotion Eka-Sarana a offert aux Bodo, aux Kachari et aux autres peuples de la vallée une voie d'intégration que l'hindouisme brahmanique leur refusait."

 # Auto-modifier: bureaucracy slot grant on formation
 AUTO_MODIFIER_NAME_nd_ahm_bureaucracy_authority: "Autorité bureaucratique d'Ahom"
 AUTO_MODIFIER_DESC_nd_ahm_bureaucracy_authority: "Le mandat restauré du Swargadeo confère une autorité institutionnelle sur les bureaux de Patra Mantri. Deux créneaux bureaucratiques sont accordés ; le tribunal de Garhgaon en ajoute un de plus."
 nd_ahm_eka_sarana_workshop: "Atelier Eka-Sarana"
 nd_ahm_eka_sarana_workshop_desc: "Le complément côté production du satra. Là où le monastère copie les Écritures et organise la prière, l'atelier bobine la soie muga des cocons rassemblés dans les bosquets du haut Assam et presse les feuilles de thé de la vallée du Brahmapoutre dans des coffres de qualité commerciale. Une manufacture sous licence Satra sous la surveillance de Sattradhikar."
 nd_ahm_workshop_muga_silk_pm: "Déroulage de la soie Muga"
 nd_ahm_workshop_muga_silk_pm_desc: "Les vers à soie dorés Antheraea muga du haut Assam, se nourrissent d'arbres Som et Sualu. Les reelers filent les cocons dans la soie dorée emblématique de la vallée du Brahmapoutre, prisée dans les tribunaux du nord de l'Inde et du Bhoutan."
 nd_ahm_workshop_assam_tea_pm: "Culture du thé Assam"
 nd_ahm_workshop_assam_tea_pm_desc: "Le thé sauvage introduit par Singpho dans les contreforts du Brahmapoutre-Patkai, cultivé comme plante de plantation, transformé dans des jardins sous licence satra. Thé en brique et en coffre pour le commerce intérieur et dans le golfe du Bengale."
