l_french:
 STATIC_MODIFIER_NAME_nd_light_of_knowledge: "La Lumière de la Connaissance"
 STATIC_MODIFIER_DESC_nd_light_of_knowledge: "Suivant la vision d'Usman dan Fodio, le califat se consacre à la poursuite du savoir, de la jurisprudence et d'une gouvernance juste. Les écoles se multiplient dans les émirats, les érudits sont honorés au-dessus des guerriers et l'administration de la justice suit la lettre de la loi sacrée."
 STATIC_MODIFIER_NAME_nd_banner_of_jihad: "La bannière du Jihad"
 STATIC_MODIFIER_DESC_nd_banner_of_jihad: "Le Califat brandit l’étendard vert de la guerre sainte. Des cavaliers peuls sortent de chaque émirat pour apporter la lumière de la vraie foi aux non convertis, et le tonnerre des sabots à travers le Sahel annonce l'expansion du royaume de Dieu."
 STATIC_MODIFIER_NAME_nd_bello_reforms: "Les réformes administratives de Bello"
 STATIC_MODIFIER_DESC_nd_bello_reforms: "Le sultan Muhammad Bello a codifié la gouvernance du califat, établissant une administration systématique, une fiscalité standardisée et un réseau de messagerie reliant Sokoto à chaque capitale provinciale."
 STATIC_MODIFIER_NAME_nd_dan_fodio_legacy: "L'héritage des Shehu"
 STATIC_MODIFIER_DESC_nd_dan_fodio_legacy: "L’héritage intellectuel et spirituel d’Usman dan Fodio perdure à travers les générations, inspirant les érudits, les juristes et les réformateurs du monde musulman."
 nd_sko.1.t: "La fondation du califat de Sokoto"
 nd_sko.1.d: "The jihad has triumphed. Where once the Hausa kings ruled through custom and caprice, a new order rises, one grounded in the revealed word of God and the scholarly tradition of Usman dan Fodio. The city of Sokoto stands as the seat of the Commander of the Faithful, and from its mosques and courts flows the authority that binds thirty emirates into a single Caliphate.\n\nBut the question remains: what shall define this new state? Shall it be the sword that carved it from the wreckage of old kingdoms, or the pen that gave it purpose? The path we choose now will echo through the centuries.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_sko.1.a: "Que la connaissance illumine le Sahel"
 nd_sko.1.b: "Laissons les cavaliers porter la foi"
 nd_sko.2.t: "Les enseignements du Shehu"
 nd_sko.2.d: "Les écrits d’Usman dan Fodio, en arabe, haoussa et fulfulde, sont devenus le fondement intellectuel de notre État. Ses traités sur la gouvernance, la jurisprudence et les obligations des fidèles circulent de Sokoto jusqu'aux ribats les plus éloignés. Les étudiants viennent de tout le Sahel pour étudier auprès d'érudits qui ont appris aux pieds du Shehu. C’est plus qu’une simple instruction religieuse : c’est la création d’une classe dirigeante instruite et instruite, capable d’administrer un empire par la loi plutôt que par les caprices arbitraires de petits rois."
 nd_sko.2.a: "Son héritage perdurera"
 nd_sko.3.t: "L'administration de Muhammad Bello"
 nd_sko.3.d: "Le sultan Muhammad Bello, fils du Shehu, s'est révélé non seulement un guerrier mais aussi un brillant administrateur. Là où son père a fourni la vision, Bello a construit l’appareil d’État. Il a codifié la gouvernance de la charia dans tous les émirats, établi le système de communication kofa reliant Sokoto aux capitales provinciales par le biais de courriers montés, agrandi les écoles et les bibliothèques et fondé de nouvelles villes le long du système frontalier des ribat. Sous sa main, le califat est passé d’un ensemble de territoires conquis à un empire fonctionnel, l’État le plus peuplé d’Afrique de l’Ouest."
 nd_sko.3.a: "Le Califat est bien gouverné"
 nd_sko.4.t: "L'autorité du calife"
 nd_sko.4.d: "Le titre d'Amir al-Mu'minin, Commandeur des croyants, a plus qu'un poids cérémoniel dans notre califat. Les émirs, bien qu'ils gouvernent leurs provinces avec une autonomie considérable, reconnaissent Sokoto comme la source de l'autorité légitime. Les différends entre émirats sont réglés par la cour du sultan et la nomination de nouveaux émirs nécessite l'approbation du calife. Cet équilibre entre autorité centrale et autonomie provinciale s’est avéré remarquablement efficace, permettant une adaptation locale tout en maintenant l’unité d’objectif qui rassemble trente émirats différents sous une même bannière de foi."
 nd_sko.4.a: "L'unité par la foi et la loi"
 nd_sko.5.t: "L'héritage durable de Dan Fodio"
 nd_sko.5.d: "Des générations après la mort d'Usman dan Fodio, son héritage intellectuel et spirituel reste la force animatrice du califat. Ses écrits sont étudiés dans toutes les mosquées et écoles du Sahel. Son modèle d’État islamique, fondé sur l’érudition, régi par la loi et engagé dans la réforme morale de la société, continue d’inspirer les réformateurs et les penseurs bien au-delà des frontières du califat. Le Shehu a peut-être disparu, mais le mouvement qu’il a déclenché brûle toujours autant."
 nd_sko.5.a: "Sa lumière ne s'effacera jamais"
 nd_sko_hausa_urbanism: "Urbanisme Haoussa"
 nd_sko_hausa_urbanism_desc: "Les grandes villes fortifiées du pays haoussa (Kano, Katsina, Zazzau) sont des centres d'artisanat, de commerce et de culture, réputés pour leurs textiles teints à l'indigo et leurs marchés animés."
 nd_sko_trans_saharan_networks: "Réseaux transsahariens"
 nd_sko_trans_saharan_networks_desc: "Ancient trade routes stretching across the desert connect Hausaland to North Africa, carrying gold, slaves, leather, and kola nuts northward and salt, horses, and manufactured goods southward."
 nd_sko_fulani_pastoral: "Tradition pastorale peule"
 nd_sko_fulani_pastoral_desc: "La profonde expertise du peuple peul en matière d'élevage de bétail fait vivre les communautés du Sahel, fournissant du lait, de la viande, du cuir et la richesse qui sous-tend à la fois le commerce et la puissance militaire."
 nd_sko_sahel_horsemanship: "L'équitation sahélienne"
 nd_sko_sahel_horsemanship_desc: "Les guerriers à cheval des prairies du Sahel comptent parmi les meilleurs cavaliers d'Afrique, leurs lanciers et leurs archers à cheval dominant les combats en champ ouvert à travers la savane."
 nd_sko_islamic_learning: "Apprentissage islamique"
 nd_sko_islamic_learning_desc: "Des réseaux d’érudits, d’enseignants et de prédicateurs itinérants diffusent le savoir islamique dans tout le pays haoussa, établissant ainsi les fondations intellectuelles qui déclencheront un jour une révolution."
 nd_sko_walled_cities: "Villes fortifiées"
 nd_sko_walled_cities_desc: "Les birni, immenses murs de terrassement et de pierre encerclant les villes haoussa, protègent les populations urbaines et leurs richesses des pillards, créant ainsi des centres de civilisation défendables à travers le Sahel."
 nd_sko_kano_textile_trade: "Commerce de textiles de Kano"
 nd_sko_kano_textile_trade_desc: "Kano's legendary dye pits and weaving workshops produce millions of rolls of cloth annually, making the city one of the great manufacturing centers of the pre-industrial world.\n\n#italic Available in: $nd_sko_kano_dye_pit$#!"
 nd_sko_quranic_schools: "Écoles coraniques"
 nd_sko_quranic_schools_desc: "Un réseau d’écoles coraniques dispense un enseignement sur l’alphabétisation arabe, la jurisprudence islamique et les sciences, créant ainsi une classe savante qui transcende les frontières ethniques et politiques."
 nd_sko_emirate_traditions: "Traditions des Émirats"
 nd_sko_emirate_traditions_desc: "Les traditions militaires des émirats haoussa produisent des forces de garnison disciplinées, entraînées à défendre les murs de la ville et à maintenir l'ordre dans leurs domaines."
 nd_sko_leather_guilds: "Guildes du cuir"
 nd_sko_leather_guilds_desc: "Les tanneurs du pays haoussa produisent des articles en cuir d'une telle qualité qu'ils sont commercialisés à travers le Sahara. Kano exporte à elle seule des millions de peaux et de sandales tannées chaque année."
 nd_sko_dan_fodio_teachings: "Enseignements de Dan Fodio"
 nd_sko_dan_fodio_teachings_desc: "La prédication réformiste d’Usman dan Fodio appelle à un retour aux fondamentaux coraniques et à la purification de la pratique islamique du syncrétisme, jetant ainsi les bases idéologiques de la révolution."
 nd_sko_ribat_frontier: "Frontière du Ribat"
 nd_sko_ribat_frontier_desc: "Établissements frontaliers fortifiés combinant garnison militaire et école islamique, les ribats servent à la fois de bastions défensifs et de centres de propagation de la foi."
 nd_sko_kano_emporium: "Magasin de Kano"
 nd_sko_kano_emporium_desc: "Sous le califat, Kano s'épanouit comme le cœur commercial du Sahel, un carrefour où les caravanes transsahariennes rencontrent les marchés locaux dans un centre d'activité économique extraordinaire."
 nd_sko_jihad_cavalry: "Cavalerie du Jihad"
 nd_sko_jihad_cavalry_desc: "Les guerriers à cheval du jihad peul forment la force de frappe d’élite du califat, combattant avec la lance et l’épée sous la bannière verte de la foi."
 nd_sko_sharia_courts: "Tribunaux de la charia"
 nd_sko_sharia_courts_desc: "La mise en œuvre de la charia comme fondement de la gouvernance remplace la justice arbitraire des anciens rois haoussa par un système juridique codifié administré par des cadis formés."
 nd_sko_caliphal_authority: "Autorité califale"
 nd_sko_caliphal_authority_desc: "Le sultan de Sokoto, en tant que Commandeur des fidèles, exerce l'autorité religieuse et politique suprême sur le système des émirats, arbitre les différends et confirme la nomination des émirs."
 nd_sko_bello_administration: "Administration de Bello"
 nd_sko_bello_administration_desc: "Le sultan Muhammad Bello transforme le califat d'un mouvement révolutionnaire en un État bureaucratique fonctionnel, codifiant la gouvernance, établissant des réseaux de communication et fondant de nouvelles villes."
 nd_sko_textile_manufactory: "Manufacture textile"
 nd_sko_textile_manufactory_desc: "Les installations de production de tissus à grande échelle dans les villes califales emploient des milliers de tisserands, teinturiers et tailleurs, produisant des textiles destinés à un usage domestique et à l’exportation dans toute l’Afrique de l’Ouest."
 nd_sko_kofa_system: "Système de communication Kofa"
 nd_sko_kofa_system_desc: "The kofa system of mounted couriers links Sokoto with provincial emirates, enabling rapid communication and administrative coordination across the vast Caliphate."
 nd_sko_emirate_cavalry: "Cavalerie blindée des Émirats"
 nd_sko_emirate_cavalry_desc: "La cavalerie lourde des émirats se lance dans la bataille vêtue de cottes de mailles, ses chevaux blindés et ses lances levées, les troupes de choc aristocratiques de la machine militaire du califat."
 nd_sko_reformed_levies: "Taxes réformées"
 nd_sko_reformed_levies_desc: "Des levées militaires réorganisées, issues de la population diversifiée du califat, fournissent des forces d'infanterie soutenues pour de longues campagnes de consolidation et de défense."
 nd_sko_scholarly_tradition: "Tradition savante"
 nd_sko_scholarly_tradition_desc: "La tradition d'érudition islamique du califat, héritée de Dan Fodio et développée par des générations de juristes, de théologiens et de scientifiques, fait de Sokoto un phare du savoir en Afrique de l'Ouest."
 nd_sko_sahel_grain_trade: "Commerce des céréales au Sahel"
 nd_sko_sahel_grain_trade_desc: "Les excédents agricoles des vallées fluviales fertiles du califat alimentent à la fois la croissance démographique et un commerce actif de céréales avec les États voisins."
 nd_sko_fortified_emirates: "Émirats fortifiés"
 nd_sko_fortified_emirates_desc: "Les ouvrages défensifs renforcés à travers le système des émirats, depuis les murs de birni améliorés jusqu'aux nouveaux bastions des ribats, créent un réseau résilient de positions fortifiées."
 nd_sko_caliphate_resurgent: "Résurrection du califat"
 nd_sko_caliphate_resurgent_desc: "Confronté à de nouvelles menaces et à une guerre changeante, le califat modernise ses forces militaires, adoptant des armes à feu et réformant ses tactiques pour défendre le royaume des fidèles."
 nd_sko_kano_industrial_center: "Centre industriel de Kano"
 nd_sko_kano_industrial_center_desc: "La production proto-industrielle de Kano développe le tissage du textile, le travail du cuir et l'artisanat du métal pour répondre à la demande croissante, présageant une transformation de l'économie du califat."
 nd_sko_pan_islamic_diplomacy: "Diplomatie panislamique"
 nd_sko_pan_islamic_diplomacy_desc: "Le califat s’étend au-delà du Sahel pour forger des liens avec le monde musulman au sens large, du Maroc à l’Empire ottoman, en quête de solidarité, de commerce et de reconnaissance."
 nd_sko_legacy_of_dan_fodio: "L'héritage de Dan Fodio"
 nd_sko_legacy_of_dan_fodio_desc: "L’héritage intellectuel et spirituel d’Usman dan Fodio transcende le califat lui-même, inspirant les mouvements de réforme islamique à travers l’Afrique de l’Ouest et au-delà pendant des générations."
 a_nd_sko_fulani_lancer: "Lancier Peul"
 a_nd_sko_fulani_lancer_desc: "Cavalerie légère des prairies du Sahel, les lanciers Peuls sont des pillards et des éclaireurs rapides dont l'équitation est inégalée en pleine savane."
 a_nd_sko_emirate_guard: "Garde de l'Émirat"
 a_nd_sko_emirate_guard_desc: "Infanterie disciplinée issue des forces de garnison des émirats haoussa, entraînée à tenir les murs des villes et à maintenir l'ordre dans leurs domaines."
 a_nd_sko_jihad_horseman: "Cavalier du Jihad"
 a_nd_sko_jihad_horseman_desc: "Guerriers à cheval du jihad peul, chevauchant avec lance et épée sous la bannière verte de la foi. Leurs charges brisent les formations ennemies en rase campagne."
 a_nd_sko_armored_horseman: "Cavalier blindé"
 a_nd_sko_armored_horseman_desc: "Cavalerie lourde Peul vêtue de cottes de mailles et de plaques, montée sur des chevaux blindés. Ces guerriers aristocratiques lancent des charges de choc dévastatrices auxquelles peu d'adversaires peuvent résister."
 a_nd_sko_jihad_levy_unit: "Prélèvement sur le Jihad"
 a_nd_sko_jihad_levy_unit_desc: "Infanterie de masse levée parmi les fidèles de tout le califat pendant les périodes de guerre sainte, animée par le zèle religieux et luttant pour défendre ou étendre le royaume de l'Islam."
 a_nd_sko_reformed_infantry: "Infanterie réformée"
 a_nd_sko_reformed_infantry_desc: "Des soldats du califat modernisés équipés d'armes à feu et formés à des tactiques réformées, représentant l'adaptation de l'État de Sokoto à la nature changeante de la guerre."
 nd_sko_kano_dye_pit: "Fosse à teinture de Kano"
 nd_sko_kano_dye_pit_desc: "Les anciennes fosses de teinture d'indigo de Kano fonctionnent depuis des siècles, produisant le tissu bleu profond qui est la marque de l'art textile haoussa et un produit d'exportation majeur."
 nd_sko_zango: "Zango"
 nd_sko_zango_desc: "A caravan camp outside the city gate. The landlords of the quarter lodge the strangers, store their loads and find buyers for them."
 nd_sko_majema: "Majema"
 nd_sko_majema_desc: "The tanners' yard. Goatskins are tanned with the pods of the acacia and dyed red, and sold north across the desert as Morocco leather."
 nd_sko_red_leather: "Red Goatskin"
 nd_sko_red_leather_desc: "Skins are soaked, scraped, tanned with acacia pods and dyed red."
 nd_sko_cattle_camp: "Camp de bétail peul"
 nd_sko_cattle_camp_desc: "Un établissement pastoral géré où les éleveurs Peuls s'occupent de leur bétail, produisant du lait, de la viande, du cuir et l'excédent de richesse qui fait vivre les communautés nomades et urbaines."
 nd_sko_birni_walls: "Murs de Birni"
 nd_sko_birni_walls_desc: "Ces murs massifs de terrassement et de pierre entourant les cités-États haoussa ont protégé les populations urbaines et leurs richesses des pillards pendant des siècles."
 nd_sko_ribat: "Ribat"
 nd_sko_ribat_desc: "Établissement frontalier fortifié combinant garnison militaire et école islamique, le ribat sert à la fois de bastion défensif et de centre de propagation de la foi parmi les populations frontalières."
 nd_sko_cloth_manufactory: "Manufacture de tissus"
 nd_sko_cloth_manufactory_desc: "Une installation de production textile à grande échelle employant des tisserands, des teinturiers et des tailleurs pour produire des tissus à des volumes industriels destinés à la consommation intérieure et à l'exportation transsaharienne."
 nd_sko_dye_pit_maintenance: "Opérations dans les fosses de teinture"
 nd_sko_dye_pit_maintenance_desc: "Woven cloth is steeped in the indigo pits and beaten to a dark gloss. The glazed blue cloth of Hausaland is a staple of the trans-Saharan trade."
 nd_sko_cattle_camp_maintenance: "Opérations du camp de bétail"
 nd_sko_cattle_camp_maintenance_desc: "Les éleveurs peuls donnent du mil à leur bétail, produisant du bétail pour la viande, le lait, le cuir et l'excédent de richesse qui fait vivre les communautés du Sahel."
 nd_sko_birni_maintenance: "Entretien des murs"
 nd_sko_birni_maintenance_desc: "L'entretien des murs de birni nécessite un réapprovisionnement régulier en pierre et en matériaux de construction pour maintenir l'intégrité défensive."
 nd_sko_ribat_maintenance: "Entretien du Ribat"
 nd_sko_ribat_maintenance_desc: "Le maintien d'un ribat frontalier nécessite de la pierre pour la fortification, des armes pour sa garnison et du papier pour les érudits qui enseignent dans ses murs."
 nd_sko_cloth_manufactory_maintenance: "Opérations de fabrication"
 nd_sko_cloth_manufactory_maintenance_desc: "L'usine teint et finit des tissus en vrac pour en faire des textiles fins destinés à un usage domestique et à l'exportation transsaharienne."
 nd_sko_saharan_caravan: "Provisioning the Caravans"
 nd_sko_saharan_caravan_desc: "Millet and meat for the drivers, salt for the camels, and leather for water skins and pack saddles."
 nd_sko_indigo_dyeing: "Dyeing for Export"
 nd_sko_indigo_dyeing_desc: "Raw cotton is bought in, woven, dyed in the pits and beaten to a gloss. The cloth is baled for the caravans to Tripoli and Timbuktu."
 levy_nd_sko_fulani_lancer: "Lanciers peuls"
 levy_nd_sko_fulani_lancer_desc: "Cavalerie légère issue des communautés pastorales peules, ces lanciers sont des pillards et des éclaireurs rapides dont l'équitation domine les prairies du Sahel."
 levy_nd_sko_emirate_guard: "Gardes de l'émirat"
 levy_nd_sko_emirate_guard_desc: "Infanterie disciplinée provenant des forces de garnison des émirats haoussa, entraînée à tenir les murs de la ville et à maintenir l'ordre."
 levy_nd_sko_jihad_levy: "Prélèvements sur le Jihad"
 levy_nd_sko_jihad_levy_desc: "Infanterie de masse levée parmi les fidèles de tout le califat pendant les périodes de guerre sainte, motivée par le zèle religieux pour défendre ou étendre le royaume de l'Islam."
 nd_sko_formed_tt: "Sokoto a été formé"
 nd_sko_path_a_tt: "Choisissez la lumière de la connaissance"
 nd_sko_path_b_tt: "Choisissez la bannière du Jihad"
 nd_sko_dest_sokoto_seat_tt: "Owns #bold Sokoto#! with at least #bold 14#! development"
 nd_sko_dest_sokoto_beacon_tt: "Owns #bold Sokoto#! with at least #bold 18#! development"
 nd_sko_destiny: "Destin du Califat"
 nd_sko_destiny_desc: "Le califat de Sokoto a été proclamé. Une fois la stabilité assurée, le Commandeur des Croyants doit désormais choisir la voie qui définira ce nouvel État pour des générations."
 nd_sko_dest_scholars_path: "Les savants de Tombouctou"
 nd_sko_dest_scholars_path_desc: "Étendre la portée intellectuelle du califat à Tombouctou, le plus grand centre d'apprentissage islamique en Afrique de l'Ouest. Placer ses érudits, ses bibliothèques et ses universités sous le patronage de Sokoto."
 nd_sko_dest_house_of_wisdom: "La Maison de la Sagesse"
 nd_sko_dest_house_of_wisdom_desc: "Build a network of scholarly institutions rivaling any in the Muslim world. Secure Djenne's ancient center of learning, embrace banking, and build up Sokoto, the seat of the Caliph and his scholars."
 nd_sko_dest_beacon_of_learning: "Phare d'apprentissage"
 nd_sko_dest_beacon_of_learning_desc: "Make the Sokoto Caliphate the intellectual capital of West Africa. Embrace the printing press to spread knowledge, achieve the highest prestige, and raise Sokoto to twice its old size."
 nd_sko_dest_jihad_path: "La chute de Bornu"
 nd_sko_dest_jihad_path_desc: "Conquérir Ngazargamu, l'ancienne capitale du Bornu, et amener cet État islamique rival sous la bannière du Califat. Construisez une armée puissante digne du jihad."
 nd_sko_dest_sword_of_the_sahel: "Épée du Sahel"
 nd_sko_dest_sword_of_the_sahel_desc: "Repoussez les frontières de la foi vers le sud, dans le pays Yoruba. Prenez Oyo-Ile, la grande capitale yoruba et la ville porte d'Ilorin. Maintenez une puissante armée permanente pour faire respecter l’autorité du califat."
 nd_sko_dest_master_of_sudan: "Maître du Soudan"
 nd_sko_dest_master_of_sudan_desc: "Dominez tout le Soudan central, des hauts plateaux de l'Adamawa aux forêts du Bénin. Avec une armée d’une taille inégalée et du plus grand prestige, le Califat domine toute l’Afrique de l’Ouest."
 nd_sko.6.t: "Le destin du califat"
 nd_sko.6.d: "Le califat de Sokoto se situe à la croisée des chemins de l’histoire. Les fondations ont été posées, les émirs nommés, les tribunaux établis, la foi proclamée. Mais que deviendra ce califat ? Le chemin à parcourir s’étend vers un avenir incertain, et les choix que nous faisons aujourd’hui résonneront pendant des générations. Le Commandeur des Croyants doit décider : devons-nous construire un empire de l’esprit ou de l’épée ?"
 nd_sko.6.a: "Notre chemin est tracé"
 nd_sko.7.t: "Les savants de Tombouctou"
 nd_sko.7.d: "Tombouctou, la ville historique de Sankoré et sa grande mosquée-université, est passée sous notre influence. Pendant des siècles, cette ville a été le cœur intellectuel de l’Afrique de l’Ouest, abritant des milliers de manuscrits, des centaines d’érudits et une tradition d’apprentissage qui est antérieure de plusieurs générations à notre califat. Aujourd'hui, ses bibliothèques et ses salles de classe servent la vision de Dan Fodio, et les érudits de Tombouctou correspondent avec ceux de Sokoto dans un grand échange de connaissances."
 nd_sko.7.a: "Laissez les connaissances circuler entre nos villes"
 nd_sko.8.t: "La Maison de la Sagesse"
 nd_sko.8.d: "The Caliphate's scholarly network has grown into something remarkable. From Timbuktu to Djenne, from Kano to Sokoto, a web of madrasas, libraries, and courts of jurisprudence spans the Sahel. Students travel from distant lands to study under our scholars, and the Caliphate's reputation for learning draws merchants and diplomats alike.\n\nHow shall we direct this intellectual wealth?"
 nd_sko.8.a: "Doter généreusement les savants"
 nd_sko.8.b: "Étendre la tolérance à tous les Gens du Livre"
 nd_sko.9.t: "Phare d'apprentissage"
 nd_sko.9.d: "The Sokoto Caliphate has become what dan Fodio always dreamed, a state where knowledge reigns supreme, where the printing press multiplies the word of God and the insights of scholars, and where Sokoto, once a war camp, has grown into a city of schools. The grand madrasas of Sokoto are spoken of from Fez to Cairo.\n\nHow shall we wield this intellectual authority?"
 nd_sko.9.a: "Centraliser l’administration des connaissances"
 nd_sko.9.b: "Laissez la réforme et l’innovation prospérer librement"
 nd_sko.10.t: "La chute de Ngazargamu"
 nd_sko.10.d: "Ngazargamu, l'ancienne capitale de l'empire Bornu, est tombée aux mains des cavaliers du califat. Pendant des siècles, Bornu a été un centre rival de l'autorité islamique au Soudan central, se réclamant de la grande dynastie Sayfawa et ses érudits contestant nos prétentions réformistes. Aujourd’hui, ses murs sont brisés, son armée dispersée et ses territoires ouverts à la foi telle que nous la prêchons. Le jihad avance vers l’est."
 nd_sko.10.a: "Bornu se soumettra à la vraie foi"
 nd_sko.11.t: "Épée du Sahel"
 nd_sko.11.d: "The green banner of the Caliphate flies over Oyo-Ile, the once-mighty capital of the Yoruba empire, and over Ilorin, the gateway between the savanna and the forest. The jihad has carried the faith further than dan Fodio himself might have imagined. The Caliphate's armies are feared from the Niger to the Benue.\n\nHow shall we organize our military forces for the campaigns ahead?"
 nd_sko.11.a: "Mettre l’accent sur la mobilisation rapide et l’offensive"
 nd_sko.11.b: "Augmenter les prélèvements massifs auprès des fidèles"
 nd_sko.12.t: "Maître du Soudan"
 nd_sko.12.d: "From the Adamawa highlands to the forests of Benin, the Sokoto Caliphate holds dominion over the entire Central Sudan. No power in West Africa can challenge the authority of the Commander of the Faithful. The horsemen of the jihad patrol frontiers that stretch a thousand miles, and the emirs govern a mosaic of peoples united under the banner of Islam.\n\nHow shall the Caliphate maintain this vast domain?"
 nd_sko.12.a: "Par la paix de Sokoto"
 nd_sko.12.b: "À travers une guerre sainte sans fin"
 STATIC_MODIFIER_NAME_nd_sko_dest_scholarly_endowment: "Dotation scientifique"
 STATIC_MODIFIER_DESC_nd_sko_dest_scholarly_endowment: "Les généreuses dotations du califat en madrasas et en bibliothèques ont attiré des universitaires de tout le monde musulman, élargissant ainsi les relations diplomatiques, même si le coût du maintien de ces institutions pèse sur la cour."
 STATIC_MODIFIER_NAME_nd_sko_dest_people_of_the_book: "Les gens du livre"
 STATIC_MODIFIER_DESC_nd_sko_dest_people_of_the_book: "Le califat étend une tolérance mesurée aux chrétiens et aux juifs en tant que peuple du Livre, reconnaissant leur statut protégé par la loi islamique et promouvant l’harmonie sociale dans les divers émirats."
 STATIC_MODIFIER_NAME_nd_sko_dest_caliphal_administration: "Administration califale"
 STATIC_MODIFIER_DESC_nd_sko_dest_caliphal_administration: "Un système bureaucratique centralisé émanant de Sokoto lie plus étroitement les émirats à la capitale, facilitant l'intégration des territoires conquis, même si le maintien de l'appareil administratif nécessite des emprunts substantiels."
 STATIC_MODIFIER_NAME_nd_sko_dest_reform_of_minds: "Réforme des esprits"
 STATIC_MODIFIER_DESC_nd_sko_dest_reform_of_minds: "L'esprit de réforme intellectuelle défendu par Dan Fodio s'épanouit, encourageant l'innovation et l'adoption de nouvelles idées, même si la demande croissante de nourriture de la population urbaine met à rude épreuve la production agricole."
 STATIC_MODIFIER_NAME_nd_sko_dest_rapid_mobilization: "Mobilisation rapide"
 STATIC_MODIFIER_DESC_nd_sko_dest_rapid_mobilization: "La machine militaire du Califat est optimisée pour des campagnes offensives rapides, avec des troupes rassemblées et déployées à une vitesse remarquable, même si le maintien des fortifications capturées met à rude épreuve la trésorerie."
 STATIC_MODIFIER_NAME_nd_sko_dest_mass_levies: "Prélèvements de masse"
 STATIC_MODIFIER_DESC_nd_sko_dest_mass_levies: "Les fidèles répondent en grand nombre à l’appel aux armes, fournissant des renforts bon marché et une armée attendue de taille qui intimide les États voisins."
 STATIC_MODIFIER_NAME_nd_sko_dest_pax_sokotana: "Pax Sokotana"
 STATIC_MODIFIER_DESC_nd_sko_dest_pax_sokotana: "La suprématie militaire écrasante du califat lui permet de dicter ses conditions en position de force, réduisant ainsi le coût de l'entretien de ses armées et imposant le respect à la table des négociations."
 STATIC_MODIFIER_NAME_nd_sko_dest_unending_jihad: "Jihad sans fin"
 STATIC_MODIFIER_DESC_nd_sko_dest_unending_jihad: "Le califat mène une guerre sainte perpétuelle, ses armées étant endurcies par des campagnes constantes. L’épuisement de la guerre s’estompe rapidement et les batailles sont décidées rapidement, même si l’obligation religieuse du jihad fait de la déclaration formelle de guerre une question de justification théologique."
 nd_sko_grand_madrasa: "Grande Médersa"
 nd_sko_grand_madrasa_desc: "Un magnifique centre d'érudition islamique où les étudiants étudient le Coran, la jurisprudence, l'astronomie et la médecine sous le patronage du Califat, joyau intellectuel du Sahel."
 nd_sko_madrasa_maintenance: "Opérations de la madrasa"
 nd_sko_madrasa_maintenance_desc: "La grande madrasa a besoin d'un approvisionnement constant en papier pour les manuscrits, en livres pour sa bibliothèque et en cire d'abeille pour les bougies qui éclairent ses salles d'étude."
 nd_sko_ribat_al_nasr: "Ribat al-Nasr"
 nd_sko_ribat_al_nasr_desc: "La Forteresse de la Victoire, une grande place forte militaire combinant les traditions défensives des birni avec la capacité offensive d'une base avancée, équipée pour mettre en garnison et projeter sa puissance sur de vastes distances."
 nd_sko_ribat_nasr_maintenance: "Opérations de forteresse"
 nd_sko_ribat_nasr_maintenance_desc: "Le Ribat al-Nasr a besoin d'armes pour sa garnison, de pierre pour ses murs, de chevaux pour sa cavalerie et de cuir pour son équipement et ses harnais."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_sko_bureaucracy_authority: "Bureaucratie califale"
 AUTO_MODIFIER_DESC_nd_sko_bureaucracy_authority: "Le califat de Sokoto maintient un appareil administratif permanent liant les Sarkin Musulmi aux émirats : le wazirat, les tribunaux alcalins, les jakadas, le réseau ribat et les oulémas Maliki. Le calife peut activer les institutions pour remettre de l'ordre dans l'État du jihad."

 sko_wazirate_bureaucracy: "Wazirat de Sokoto"
 sko_wazirate_bureaucracy_desc: "Créé par Muhammad Bello (calife 1817-1837), le wazir servait de ministre en chef et de principale interface entre les Sarkin Musulmi et les émirats. Gidado dan Laima, le premier wazir de Bello, a établi le modèle : un érudit-bureaucrate de Toronkawa qui s'occupait de la correspondance de l'émirat, transmettait les décrets califaux et arbitre les différends inter-émirats. Un wazirat en activité centralise l’autorité ; un pays négligé permet aux émirs d'ignorer l'ordre de Sokoto."

 sko_alkali_courts_bureaucracy: "Système judiciaire alcalin"
 sko_alkali_courts_bureaucracy_desc: "Each emirate maintained alkali (qadi) courts trained in Maliki fiqh, the dominant school of West African Islamic jurisprudence. The judges applied sharia in matters of marriage, inheritance, contracts, and crime, displacing the customary Hausa law (gargajiya) of the pre-jihad order. The chief alkali at Sokoto served as appellate authority for the entire caliphate. Predictable Islamic justice satisfied the clergy and gave the peasants recourse against arbitrary noble power, but stripped the old Hausa nobility of their customary jurisdictions."

 sko_jakada_network_bureaucracy: "Réseau hommage Jakada"
 sko_jakada_network_bureaucracy_desc: "Les jakada étaient des agents résidents et des envoyés tournants du calife stationnés dans chaque capitale d'émirat, chargés de collecter l'impôt foncier kurdin kasa, les frais d'adhésion kurdin sarauta auprès des nouveaux émirs, des esclaves et des céréales à expédier à Sokoto. Sur le modèle de l'amil abbasside et du système de messagerie haoussa d'avant le jihad, ils rendaient compte des affaires de l'émirat et pouvaient demander l'intervention du calife. Lorsqu’ils étaient loyaux, ils gardaient les comptes de l’émirat honnêtes ; corrompus, ils s'enrichissaient aux dépens du trône."

 sko_toronkawa_emirates_bureaucracy: "Ordre de l'Émirat de Toronkawa"
 sko_toronkawa_emirates_bureaucracy_desc: "The emirates of Sokoto were not appointed offices but hereditary lineages: each tuta (flag) was granted to a Fulbe clan: predominantly the Toronkawa, the Torodbe of Senegal-Futa Toro origin from which the Fodio family itself descended. The Sullubawa held Kano, the Sungawa held Daura, the Mallawa held Katagum. This produced a cohesive Fulbe aristocratic order across the caliphate, raising clan levies on demand, but locked Hausa commoners out of the highest offices and sowed the resentment that fuelled the 1817 Hadejia revolt."

 sko_ribat_network_bureaucracy: "Réseau frontalier du Ribat"
 sko_ribat_network_bureaucracy_desc: "Le ribat (une colonie frontalière fortifiée combinant mosquée, madrasa et garnison) était une institution centrale de l’État du jihad. Usul al-Siyasa de Bello a explicitement ordonné la construction de ribats le long des frontières avec Bornu, les refuges païens haoussa de Maradi et les peuples non musulmans du sud. Chacune abritait un érudit résident, une garnison de muhajirun (soldats réfugiés) et une école pour la population frontalière. Le réseau servait à la fois de ceinture défensive, d’appareil missionnaire et de moteur d’une lente islamisation."

 sko_ulama_council_bureaucracy: "Conseil des oulémas Maliki"
 sko_ulama_council_bureaucracy_desc: "Sokoto était un État fondé par des érudits. Les mallams du cercle de Dan Fodio et leurs successeurs - les héritiers d'Abdullahi à Gwandu, ceux de Bello à Sokoto et les alcalis qu'ils formaient - formèrent un corps collectif de juristes malékites dont les fatwas réglementaient la pratique du marché, la capture d'esclaves et les conflits théologiques. Le Bayan Wujub al-Hijra (1806), Kitab al-Farq (1807) et Diya al-Hukkam (1812) constituent le document textuel. Les oulémas ont donné au califat sa légitimité et ses critiques les plus sévères ; leur fracture était à l’origine de la révolte de Hadejia et des troubles mahdistes des années 1840."
