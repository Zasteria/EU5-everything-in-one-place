 # DESTINY TIMED MODIFIER NAMES AND DESCRIPTIONS
 # ============================================================
 STATIC_MODIFIER_NAME_nd_khl_dest_monsoon_compact: "Le Pacte de mousson"
 STATIC_MODIFIER_DESC_nd_khl_dest_monsoon_compact: "Le califat commerce avec les puissances de la mousson en tant que partenaires et non en tant que sujets. Des usines Khilafan apparaissent à Calicut, Cochin, Acheen et Brunei. Les marchands indiens et malais sont acceptés à la cour califale ; Les commerçants arabes, persans et tamouls partagent des entrepôts ; l’océan Indien devient une zone de libre-échange multinationale du Khilafan."
 STATIC_MODIFIER_NAME_nd_khl_dest_pepper_monopoly: "Le monopole du poivre"
 STATIC_MODIFIER_DESC_nd_khl_dest_pepper_monopoly: "Le poivre, les clous de girofle et la muscade sont réservés au col califal. Les commerçants étrangers sans licence du Khilafan sont saisis ; le commerce des épices devient un strict monopole royal. Le trésor s'engraisse et les corsaires s'enrichissent, mais le corps diplomatique se réduit à mesure que les ambassades étrangères partent en signe de protestation."

 STATIC_MODIFIER_NAME_nd_khl_dest_oceanic_civilization: "Civilisation océanique"
 STATIC_MODIFIER_DESC_nd_khl_dest_oceanic_civilization: "Le Khilafah n’est plus un empire continental doté d’une marine ; c'est une civilisation maritime à part entière. Les communautés commerciales arabophones prospèrent de Mombasa à Manille ; Les flottes d'exploration du Khilafan s'étendent au-delà de la mousson vers le Pacifique ouvert ; les routes des épices ne sont plus des routes mais l’épine dorsale d’un système politique hémisphérique."
 STATIC_MODIFIER_NAME_nd_khl_dest_pan_islamic_university: "Le réseau universitaire panislamique"
 STATIC_MODIFIER_DESC_nd_khl_dest_pan_islamic_university: "Le Bayt al-Hikmah n'est plus une bibliothèque mais un réseau : des universités secondaires à Cordoue, au Caire, à Bagdad, à Boukhara, à Lahore et à Aceh, enseignant toutes le programme unifié du Khilafan, partageant toutes des manuscrits via des coursiers califaux. Les mondes chrétien et hindou sont mécontents de la domination culturelle, mais les érudits du Califat s'étendent sur tous les continents."

 STATIC_MODIFIER_NAME_nd_khl_dest_hindu_jihad: "Le Jihad hindou"
 STATIC_MODIFIER_DESC_nd_khl_dest_hindu_jihad: "La campagne de l'Est se poursuit. Les armées du Khilafan poussent au-delà de Delhi dans le Deccan, la vallée du Gange et les côtes sud. Les forteresses des royaumes hindous tombent une à une sous le train de siège unifié du Khilafan ; les grandes villes-temples du sud se soumettent ou sont détruites."
 STATIC_MODIFIER_NAME_nd_khl_dest_andalusi_reconquista: "La Reconquista andalouse"
 STATIC_MODIFIER_DESC_nd_khl_dest_andalusi_reconquista: "La blessure de 1492 est inversée. Grenade est restaurée, puis Tolède, puis la péninsule italienne se courbe. Les ordres des croisés chrétiens apportent une réponse finale, et l’antagonisme du monde latin atteint son paroxysme, mais les bannières califales avancent malgré tout."

 STATIC_MODIFIER_NAME_nd_khl_dest_universal_sword: "L'épée universelle"
 STATIC_MODIFIER_DESC_nd_khl_dest_universal_sword: "La chrétienté hérétique et l’Inde païenne sont toutes deux ouvertes aux armées califales. La cavalerie sipahi, le corps des janissaires, le train d'artillerie moghole et les reconquérants andalous font campagne sur des théâtres coordonnés. Aucune puissance sur terre ne dispose d’une force capable de les arrêter dans une bataille ouverte."
 STATIC_MODIFIER_NAME_nd_khl_dest_caliphal_imperium: "L'Empire califal"
 STATIC_MODIFIER_DESC_nd_khl_dest_caliphal_imperium: "Le monde conquis est administré. Des forts s'élèvent dans chaque province conquise ; le réseau routier impérial s'étend de Lisbonne à Lahore ; Des missions diplomatiques califales sont envoyées sur chaque trône restant. Le Khilafah n’est pas seulement une armée mais un État, le premier et le seul État universel au monde."

 # ============================================================
 # DESTINY BUILDINGS
 # ============================================================
 nd_khl_bayt_al_hikmah_restored: "Bayt al-Hikmah restauré"
 nd_khl_bayt_al_hikmah_restored_desc: "La deuxième Maison de la Sagesse : une institution mondiale combinant traduction, bibliothèque, observatoire et université. Le premier Bayt al-Hikmah était celui de Bagdad ; celui-ci est celui du monde. Les manuscrits arrivent de Mombasa et de Malacca aux côtés de ceux de Cordoue et de Boukhara, tous traduits en arabe par une équipe permanente de traducteurs."
 nd_khl_caliphal_foundry: "Fonderie impériale califale"
 nd_khl_caliphal_foundry_desc: "L'armurerie universelle du Califah. Les fonderies de canons du Caire, d'Edirne, de Lahore et de Cordoue sont unifiées en un seul système de production ; les bombardes, mortiers, canons de campagne et fusils à mèche standardisés sont moulés selon une spécification unique et expédiés à chaque arsenal califal."

 # Maintenance PMs for destiny buildings
 nd_khl_bayt_al_hikmah_restored_scholarship: "Traduction universelle"
 nd_khl_bayt_al_hikmah_restored_scholarship_desc: "Papier, livres reliés, tissus manuscrits et pierres précieuses décoratives pour la Maison mondiale de la Sagesse."
 nd_khl_caliphal_foundry_maintenance: "Opérations de la fonderie impériale"
 nd_khl_caliphal_foundry_maintenance_desc: "Armes, armes à feu, outils et stock de fer pour la production de canons califaux et d'armes légères."

 # ===== BUREAUCRACIES =====
 khl_diwan_al_mazalim_bureaucracy: "Dar al-'Adl"
 khl_diwan_al_mazalim_bureaucracy_desc: "The House of Justice. Nur al-Din built the first in Damascus around 1163 and sat in it twice a week to hear complaints against his own officers. Baybars built another below the citadel of Cairo in the 1260s, and heard petitions there with the chief judges of the four schools beside him. In the restored Caliphate anyone may hand in a written petition, from any province, against any governor or tax farmer, and the answer goes back in the Caliph's name."
 khl_bayt_al_mal_bureaucracy: "Diwan al-Zimam"
 khl_bayt_al_mal_bureaucracy_desc: "The bureau of control. The Abbasid Caliph al-Mahdi, who reigned from 775 to 785, set an audit office beside every bureau of state and a central one above them all to check their books. A Caliphate that reaches from al-Andalus to the Indus cannot keep its revenue in one treasury. Every province keeps its own, and the Zimam in the capital reads each ledger, sets what was assessed against what arrived, and sends its clerks to ask about the difference."
 khl_pan_islamic_ulama_bureaucracy: "Conseil panislamique des oulémas"
 khl_pan_islamic_ulama_bureaucracy_desc: "L'unification des quatre madhhabs sunnites orthodoxes (Hanafi, Shafi'i, Maliki, Hanbali) sous le patronage califal commun, sur le modèle de la pratique mamelouke consistant à asseoir un cadi en chef de chaque madhhab et étendue à l'échelle impériale. Des fatwas coordonnées, une procédure harmonisée et un corps de formation cléricale transrégional ancré à al-Azhar. Le prix de la consolidation orthodoxe est payé par les communautés dhimmi dont le vieux pluralisme juridique se rétrécit sous la pression sunnite soutenue."
 khl_hajj_caravan_bureaucracy: "Kiswa of the Kaaba"
 khl_hajj_caravan_bureaucracy_desc: "Whoever holds Mecca and Medina clothes the Kaaba. Each year a new covering, the kiswa, travels with the pilgrimage, a custom the Abbasid Caliph al-Mahdi made annual. From 1349 the Mamluk sultans paid for it out of the rents of three Egyptian villages set aside for nothing else. With the cloth go gifts for the sharifs and the poor of the two cities. The caravans of Egypt, Syria, Iraq and Yemen meet at Mecca each year under their rulers' banners. Any ruler can send pilgrims. The covering is the Caliph's alone."
 khl_bayt_al_hikmah_bureaucracy: "Réseau Bayt al-Hikmah"
 khl_bayt_al_hikmah_bureaucracy_desc: "La renaissance à l’échelle universelle de la Maison de la Sagesse abbasside, fondée sous al-Ma’mun à Bagdad vers 830. Une fédération de bureaux de traduction et d’observatoires réunit les académies de Tolède, Cordoue, Le Caire, Damas, Bagdad, Ispahan et Samarkand en un seul appareil scientifique transrégional. Les œuvres grecques, sanscrites, persanes et latines transitent par un pipeline de traduction coordonné. Les juristes orthodoxes qui suivent al-Ghazali et se méfient de la falsafa comme d’une intrusion rationaliste considèrent le réseau avec méfiance."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_khl_bureaucracy_authority: "Autorité califale"
 AUTO_MODIFIER_DESC_nd_khl_bureaucracy_authority: "On restoring the universal Caliphate, the Khilafah gains the institutional authority to host the historical bureaucracies of the imperial Khilafah."
