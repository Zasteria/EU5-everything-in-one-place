 # ============================================================
 # DESTINY TREE: advance names and descriptions
 # ============================================================
 nd_khl_destiny: "Le calife universel couronné"
 nd_khl_destiny_desc: "La première khutba est lue dans mille minbars au nom d'un calife. D’Al-Andalus au Sind, le monde reconnaît un seul souverain des croyants. Le chemin emprunté par le Califat à partir de cette heure façonnera chaque époque qui suivra."

 nd_khl_dest_two_seas: "Maîtrise des Deux Mers"
 nd_khl_dest_two_seas_desc: "Sécurisez Bab al-Mandab et le détroit d'Ormuz. Aden et Ormuz sont les portes du commerce de la mousson ; contrôle des deux moyens, le drapeau du Khilafah commande chaque boutre de Sofala à Canton. Le trésor califal puise dans les richesses de l’océan Indien pour la première fois depuis les routes maritimes fatimides."

 nd_khl_dest_spice_crescent: "Le croissant aux épices"
 nd_khl_dest_spice_crescent_desc: "Tenez Calicut et Goa, les entrepôts de Malabar, et introduisez le commerce de la soie et du poivre sur les marchés du Khilafan. Le croissant de ports de l’océan Indien s’étendant d’Aden à Cochin devient un système marchand unique, le commerce des épices étant un instrument de la politique califale."

 nd_khl_dest_two_oceans_caliphate: "Le Califat des Deux Océans"
 nd_khl_dest_two_oceans_caliphate_desc: "Prenez Mombasa, Malacca et Aceh. La bannière du Califat flotte désormais sur les deux rives de l'océan Indien et aux portes de la mer de Chine méridionale. Le Bayt al-Hikmah est reconstruit à l’échelle de l’empire : une institution mondiale d’apprentissage qui synthétise les connaissances de trois civilisations."

 nd_khl_dest_two_cities: "Les deux villes des Francs"
 nd_khl_dest_two_cities_desc: "Conquer Rome and Vienna. The two great Frankish capitals fall to the Caliphal sword: the See of Saint Peter and the gate of central Europe. Ribats are raised in ten places to hold the marches behind the advance. The Christian empires of the Latins are broken at their heart; jihad against Christendom is no longer a frontier action but a planetary fact."

 nd_khl_dest_hammer: "Le marteau de la chrétienté et de l'Inde"
 nd_khl_dest_hammer_desc: "Hold Kataka, Vijayanagar and Toledo. The Gajapati kings of Odisha, whose coast no sultan of Delhi or Bengal could take, are brought under direct Caliphal rule; the southern Hindu power of Vijayanagar is broken in turn, and the old capital of Castile is taken in the west. Two thousand ducats are laid by. East and West fall to one hammer."

 nd_khl_dest_world_submits: "Le monde se soumet"
 nd_khl_dest_world_submits_desc: "Take Paris, Venice, and Madrid. The three capitals of Frankish power, Capet, Doge, and Habsburg, fall to the Caliphal armies, and ribats stand in twenty-five places across the conquests. The Imperial Foundry is built to commemorate the conquest: a universal armory casting the cannon of every conquest from Cordoba to Lahore to one specification."

 # ============================================================
 # Variable tooltip update for destiny path
 # ============================================================
 # (path tooltips already defined above; nd_khl_path_b has no destiny branch)

 # ============================================================
 # DESTINY EVENTS: titles, descriptions, options
 # ============================================================
 nd_khl.14.t: "Le calife universel couronné"
 nd_khl.14.d: "La bay'ah est jurée devant un million de témoins. Des marches de la Kaaba à la porte de Topkapi, de la Qarawiyyin au fort de Lahore, tous les cadi, cheikh, sayyid, chérif et émir du monde sunnite posent la main sur celle du calife et lui promettent obéissance. Le calife n’est plus un dirigeant parmi tant d’autres ; il est l'Amir al-Mu'minin en fait, pas seulement en titre. Une nouvelle ère commence."
 nd_khl.14.a: "Que le Califa perdure pour toujours"

 nd_khl.15.t: "Les deux mers sont à nous"
 nd_khl.15.d: "L'amiral califal d'Aden rapporte : le Bab al-Mandab est fermé à tous les drapeaux sauf le vert. L'amiral califal d'Ormuz rapporte : le détroit est patrouillé par des boutres et des navires de guerre du Khilafan, aucun navire franc ne passe sans payer. Les deux portes de la mousson sont enfin ouvertes ; l'océan Indien est redevenu une mer musulmane."
 nd_khl.15.a: "Embarquez pour le Malabar"

 nd_khl.16.t: "Le croissant aux épices"
 nd_khl.16.d: "Calicut et Goa se tiennent sous la bannière califale. Le Zamorin envoie des cadeaux ; les anciens sultans bahmanis rendent hommage ; l'Estado da India portugais est réduit à quelques forts côtiers et à un souvenir. Le poivre de Malabar, le coton de Coromandel et la soie du Bengale affluent désormais vers les usines du Khilafan. Le grand vizir du calife présente deux politiques pour le nouveau commerce."
 nd_khl.16.a: "Commerce coopératif avec les puissances de la mousson"
 nd_khl.16.b: "Monopole forcé : produits califaux uniquement"

 nd_khl.17.t: "Les deux océans parlent arabe"
 nd_khl.17.d: "Mombasa, Malacca, Aceh. La côte swahili, le détroit de Malacca, la pointe nord de Sumatra. Le Khilafah détient l’entrée et la sortie ainsi que toutes les îles intermédiaires. De la péninsule arabique aux îles aux épices, aucun marchand ne se déplace sans un laissez-passer califal ; aucune flotte ne navigue sans la bannière verte. Les océans du monde sont bilingues : arabe et silence. Quelle sera la grande œuvre de cette heure ?"
 nd_khl.17.a: "Un empire du commerce universel"
 nd_khl.17.b: "Un empire de l’apprentissage universel"

 nd_khl.18.t: "Rome et Vienne automne"
 nd_khl.18.d: "Le Pape s'enfuit vers Avignon ; l'Empereur se retire au-delà des Alpes. Les minarets s'élèvent sur les Sept Collines ; l'appel à la prière résonne du Stephansdom. La chrétienté latine qui résiste au Califat depuis neuf siècles est brisée dans ses capitales. Les armées califales avancent ; le travail n'est pas encore terminé."
 nd_khl.18.a: "Direction Paris et Madrid"

 nd_khl.19.t: "Les chutes Hammer à l’est et à l’ouest"
 nd_khl.19.d: "Kataka is taken: the throne of the Gajapati kings, which no sultan of Delhi could seize, answers to the Khilafah. Vijayanagar is broken: the great Hindu southern empire is reduced to ash. India answers to one Caliph. In the same hour, the last Aragonese and Castilian holdouts fall, and the Mediterranean is bracketed by Khilafan banners. The next campaign begins. Where shall the sword fall?"
 nd_khl.19.a: "Le jihad oriental : l’Inde doit être islamique"
 nd_khl.19.b: "La reconquête occidentale : l’Ibérie et l’Italie doivent être islamiques"

 nd_khl.20.t: "Le monde se soumet"
 nd_khl.20.d: "Paris, Venise, Madrid. Les Capets, le Doge, les Habsbourg, les trois trônes tombent en une seule décennie. La Méditerranée est un lac du Califan ; la côte atlantique est une frontière du Khilafan ; le drapeau califal flotte de Lisbonne à Lahore. Aucune puissance sur terre ne résiste. Le grand vizir présente deux mémorandums pour le nouvel ordre universel."
 nd_khl.20.a: "Le Khilafah perfectionne l'épée universelle"
 nd_khl.20.b: "Le Califah perfectionne l’État universel"

