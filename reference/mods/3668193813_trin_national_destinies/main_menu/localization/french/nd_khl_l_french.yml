l_french:
 # ============================================================
 # Formation event
 # ============================================================
 nd_khl.1.t: "Le Califah universel restauré"
 nd_khl.1.d: "After a millennium of dynastic fragmentation, the ummah is one again. Mecca, Medina, Cairo, Damascus, Baghdad, and the seats of the old Umayyad and Abbasid caliphates answer to a single throne. The black standard of the Prophet flies from al-Andalus to Sindh; the call to Friday prayer in every congregational mosque is offered in the name of one Caliph. This is not the work of any one dynasty, Umayyad, Abbasid, Fatimid, Almohad, Mamluk, or Ottoman, but the Rashidun ideal made flesh: the universal community of believers under one banner.\n\nThe ulama gather in council. The viziers wait at the gate of the diwan. The world holds its breath. What kind of Khilafah will rise from this restoration?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_khl.1.a: "Le calife à la Mecque : restaurer l’idéal Rashidun"
 nd_khl.1.b: "Le calife à Bagdad : relancer la civilisation abbasside"
 nd_khl.1.c: "L'Épée et le Sultan : un Khilafah militant de la poudre à canon"

 # ============================================================
 # Formation choice modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_khl_caliph_in_mecca: "Le calife à la Mecque"
 STATIC_MODIFIER_DESC_nd_khl_caliph_in_mecca: "Le calife règne depuis le Haramayn, les deux saintes mosquées. L'autorité religieuse rayonne depuis la Mecque et Médine ; le modèle fondateur du Rashidun est restauré. La charia est la loi, les oulémas sont les seuls ministres qui comptent, et la Oumma se convertit par le prestige et l'exemple autant que par l'épée."
 STATIC_MODIFIER_NAME_nd_khl_caliph_in_baghdad: "Le calife à Bagdad"
 STATIC_MODIFIER_DESC_nd_khl_caliph_in_baghdad: "Le Khilafah fait revivre la civilisation impériale abbasside : une synthèse cosmopolite du savoir arabe, persan et turc. Bayt al-Hikmah est reconstruite, le grand mouvement de traduction reprend et la cour du Khilafan accueille des érudits de toutes confessions. Le calife gouverne le monde depuis une ville de ministères, de bibliothèques et de bazars."
 STATIC_MODIFIER_NAME_nd_khl_sword_and_sultan: "L'épée et le sultan"
 STATIC_MODIFIER_DESC_nd_khl_sword_and_sultan: "Le Khilafah est l’empire mondial de la poudre à canon. Les canons lancés au Caire, les mousquetaires entraînés à Edirne, les soldats esclaves élevés à Cordoue et dans le Caucase défilent sous une même bannière. Le calife est un imam guerrier : le jihad contre la chrétienté, l’Inde hindoue et les sectes hétérodoxes est une politique permanente de l’État."

 # ============================================================
 # DHE event modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_khl_translation_movement: "Le mouvement de traduction"
 STATIC_MODIFIER_DESC_nd_khl_translation_movement: "Les textes grecs, sanskrits, persans et syriaques sont systématiquement traduits en arabe. Les héritiers de Hunayn ibn Ishaq travaillent dans le nouveau Bayt al-Hikmah, et la science des trois civilisations passe dans une seule langue."
 STATIC_MODIFIER_NAME_nd_khl_falsafa_revival: "Le renouveau de la Falsafa"
 STATIC_MODIFIER_DESC_nd_khl_falsafa_revival: "Ibn Sina, al-Farabi et Ibn Rushd sont relus dans chaque cour du Khilafan. La philosophie islamique reprend sa place entre la révélation et la raison ; la synthèse qui a produit Thomas d'Aquin se renouvelle dans sa propre patrie."

 STATIC_MODIFIER_NAME_nd_khl_amir_al_hajj: "L'Émir al-Hajj"
 STATIC_MODIFIER_DESC_nd_khl_amir_al_hajj: "La caravane de pèlerinage annuelle est désormais une institution d'État, commandée par l'émir al-Hajj nommé par le calife lui-même. Héberger le pèlerin est le premier devoir du calife après la défense de la foi."
 STATIC_MODIFIER_NAME_nd_khl_zubayda_road: "Le Darb Zubayda"
 STATIC_MODIFIER_DESC_nd_khl_zubayda_road: "Des puits, des citernes, des caravansérails et des relais s'étendent de Kufa à La Mecque, du nom de Zubayda bint Ja'far, petite-fille du calife al-Mansur. La route des pèlerins est aussi une route commerciale, et la route commerciale est aussi une route d'État."

 STATIC_MODIFIER_NAME_nd_khl_baghdad_reborn: "Bagdad renaît"
 STATIC_MODIFIER_DESC_nd_khl_baghdad_reborn: "L'horreur de 1258, lorsque les Mongols de Hulegu pillèrent Bagdad et jetèrent les bibliothèques des califes dans le Tigre, est enfin inversée. La Cité de la Paix est reconstruite ; la Ville Ronde est repensée ; le Tigre reflète à nouveau les dômes et les minarets."
 STATIC_MODIFIER_NAME_nd_khl_dar_al_islam_unbroken: "Dar al-Islam ininterrompu"
 STATIC_MODIFIER_DESC_nd_khl_dar_al_islam_unbroken: "La fragmentation du monde post-mongol est guérie. Chaque communauté sunnite, de Grenade à l’Indus, sait qu’elle s’inscrit dans un seul Dar al-Islam, défendu par un seul calife."

 STATIC_MODIFIER_NAME_nd_khl_ulama_concord: "La Concorde des Oulémas"
 STATIC_MODIFIER_DESC_nd_khl_ulama_concord: "Les quatre madhhabs sunnites : Hanafi, Shafi'i, Maliki et Hanbali, se réunissent en conseil sous le patronage du calife. Des différences subsistent, mais les écoles se reconnaissent mutuellement et se reconnaissent au-dessus de toutes une autorité suprême."
 STATIC_MODIFIER_NAME_nd_khl_madhhab_synthesis: "La synthèse du Madhhab"
 STATIC_MODIFIER_DESC_nd_khl_madhhab_synthesis: "Une nouvelle génération de juristes formés dans les quatre madhhabs qui les composent, produisent un fiqh synthétique adapté à un empire qui s'étend sur les musulmans berbères, arabes, persans, turcs et indiens."

 STATIC_MODIFIER_NAME_nd_khl_caliphal_guard: "La garde califale Ghulam"
 STATIC_MODIFIER_DESC_nd_khl_caliphal_guard: "Les soldats esclaves élevés dès l'enfance dans la maison du calife forment une garde à cheval d'élite, consacrée uniquement au trône. Leur loyauté va uniquement au calife, et non à aucune tribu, dynastie ou province."
 STATIC_MODIFIER_NAME_nd_khl_ghulam_governors: "Gouverneurs Ghulam"
 STATIC_MODIFIER_DESC_nd_khl_ghulam_governors: "Les ghulam les plus compétents sont envoyés comme commandants et gouverneurs de province. Ils n'ont aucun parent local à favoriser, aucune revendication héréditaire indigène, seulement leur serment au calife qui les a élevés."

 STATIC_MODIFIER_NAME_nd_khl_caliphal_artillery: "Le parc d'artillerie califale"
 STATIC_MODIFIER_DESC_nd_khl_caliphal_artillery: "Les grands bombardements de siège lancés au Caire, les mortiers à Edirne et les canons de campagne des fonderies de Constantinople se déplacent sous un seul commandement califal. Aucune forteresse au monde n’est hors de portée."
 STATIC_MODIFIER_NAME_nd_khl_jihad_of_the_gun: "Le Jihad des armes"
 STATIC_MODIFIER_DESC_nd_khl_jihad_of_the_gun: "Les corps de janissaires, les arquebusiers mamelouks et les mousquetons moghols sont unifiés en une seule doctrine : le jihad de la poudre. Les ennemis du Khalafah font face à une puissance de feu concentrée pour des raisons religieuses."

 STATIC_MODIFIER_NAME_nd_khl_indian_ocean_supremacy: "Suprématie de l'océan Indien"
 STATIC_MODIFIER_DESC_nd_khl_indian_ocean_supremacy: "D'Aden à Calicut, de Mombasa à Malacca, la bannière califale régit le commerce de la mousson. L'intrusion portugaise est repoussée ; le commerce des épices circule à nouveau sous la protection du Califan."
 STATIC_MODIFIER_NAME_nd_khl_mediterranean_thalassocracy: "Thalassocratie Méditerranéenne"
 STATIC_MODIFIER_DESC_nd_khl_mediterranean_thalassocracy: "La flotte d'Alexandrie, les chantiers navals de la Corne d'Or et les capitaines corsaires du Maghreb répondent à un Kapudan Pacha. La Méditerranée devient un lac Khilafan."

 STATIC_MODIFIER_NAME_nd_khl_quranic_press: "La presse coranique"
 STATIC_MODIFIER_DESC_nd_khl_quranic_press: "La composition arabe, longtemps résistée par les calligraphes, est enfin maîtrisée. Les Corans imprimés, les recueils de hadiths et les manuels de dévotion parviennent à chaque mosquée de village."
 STATIC_MODIFIER_NAME_nd_khl_scientific_press: "La presse scientifique"
 STATIC_MODIFIER_DESC_nd_khl_scientific_press: "Des traités d’astronomie, de médecine, de mathématiques et de droit sortent par milliers des presses du Califan. La connaissance scientifique se propage plus rapidement que jamais dans l’histoire islamique."

 STATIC_MODIFIER_NAME_nd_khl_sober_sufism: "Le chemin sobre"
 STATIC_MODIFIER_DESC_nd_khl_sober_sufism: "Les ordres Naqshbandi et Qadiriyya gagnent la faveur du calife : leur soufisme sobre et érudit renforce l’orthodoxie plutôt que de la contester. La dévotion mystique renforce l'État."
 STATIC_MODIFIER_NAME_nd_khl_ecstatic_sufism: "Le chemin extatique"
 STATIC_MODIFIER_DESC_nd_khl_ecstatic_sufism: "Les ordres Mevlevi, Bektashi et Chishti prospèrent sous le patronage du calife. La musique, la poésie et la danse deviennent des outils de conversion islamique universelle au-delà des frontières culturelles."

 STATIC_MODIFIER_NAME_nd_khl_central_diwan: "Le Diwan Central"
 STATIC_MODIFIER_DESC_nd_khl_central_diwan: "Les registres fiscaux de Lisbonne à Lahore sont unifiés. Le diwan califal tient un registre unique pour le monde entier, et c'est à partir de ce registre que le monde est gouverné."
 STATIC_MODIFIER_NAME_nd_khl_provincial_timariots: "Timariots provinciaux"
 STATIC_MODIFIER_DESC_nd_khl_provincial_timariots: "La cavalerie Sipahi, les détenteurs d'iqta et les concessionnaires de terres mamelouks sont unifiés sous un système de tenure unique : servir le calife pendant la guerre, détenir des terres en retour. Les levées de cavalerie provinciales se multiplient dans tout l'empire."

 STATIC_MODIFIER_NAME_nd_khl_silver_dirham_standard: "L'étalon du dirham argent"
 STATIC_MODIFIER_DESC_nd_khl_silver_dirham_standard: "Un seul poids d'argent, frappé dans les ateliers de Cordoue à Boukhara, est accepté sur tous les marchés du Califat. La manipulation des devises par les dirigeants locaux prend fin ; le dirham califal est la norme mondiale."
 STATIC_MODIFIER_NAME_nd_khl_caliphal_mints: "Les menthes califales"
 STATIC_MODIFIER_DESC_nd_khl_caliphal_mints: "L'argent de l'Hindu Kush, de l'Anatolie et du Sahel entre dans les ateliers califaux ; l'or d'Afrique de l'Ouest et d'Égypte est converti en dinar Khilafan. Le trésor déborde."

 STATIC_MODIFIER_NAME_nd_khl_modernist_reform: "Le calife Tanzimat"
 STATIC_MODIFIER_DESC_nd_khl_modernist_reform: "Droit codifié, armées de conscrits, fonctionnaires salariés, écoles techniques, télégraphes et chemins de fer : le Khilafah se modernise par le haut, en s'inspirant des modèles européens sans renoncer à l'identité islamique."
 STATIC_MODIFIER_NAME_nd_khl_salafi_revival: "Le renouveau salafiste"
 STATIC_MODIFIER_DESC_nd_khl_salafi_revival: "Un retour à la voie des salaf al-salih, les pieux ancêtres. Les accumulations de siècles sont supprimées ; une orthodoxie sunnite plus légère, plus dure et plus militante émerge, rejetant à la fois l’hétérodoxie soufie et la réforme européenne."

 # ============================================================
 # Advance event titles and descriptions
 # ============================================================
 nd_khl.2.t: "La Maison de la Sagesse rouvre"
 nd_khl.2.d: "Deux siècles après que les Mongols de Hulegu ont jeté les livres de Bayt al-Hikmah dans le Tigre, une nouvelle Maison de la Sagesse s'élève dans le quartier restauré de Bagdad. Des traducteurs en grec, syriaque, persan et sanscrit travaillent aux côtés de philosophes arabes ; L'ancienne vision d'al-Ma'mun est renouvelée. Déjà des manuscrits de Galien, d'Aristote et d'Aryabhata circulent à nouveau, copiés en naskh élégant dans des dizaines de madrasas de Fès à Samarkand. Le calife se tient à côté du traducteur en chef et demande : quel genre de connaissance devons-nous honorer en premier ?"
 nd_khl.2.a: "Traduisez toutes les sciences du monde"
 nd_khl.2.b: "Restaurer la tradition philosophique"

 nd_khl.3.t: "Le Hajj calife"
 nd_khl.3.d: "Jusqu'à présent, trois caravanes de pèlerins convergeaient vers La Mecque chaque année, une de Damas, une du Caire et une de Bagdad, chacune commandée par un officier d'un dirigeant différent, chacune protégée par différentes tribus bédouines payant des pots-de-vin différents. Le nouveau décret califal change cela. Désormais, un seul Amir al-Hajj, nommé par le calife et ne rendant compte à personne d'autre, commande toutes les caravanes de pèlerins. Les puits du Darb Zubayda sont réparés ; les forts de la route syrienne sont en garnison ; la grande caravane du Caire est réorganisée. Comment le Calife projettera-t-il cette nouvelle institution ?"
 nd_khl.3.a: "Faites de la caravane du Hajj une marche d'État"
 nd_khl.3.b: "Faire du chemin des pèlerins une route commerciale"

 nd_khl.4.t: "Bagdad se relève à nouveau"
 nd_khl.4.d: "Sur les rives du Tigre, des maçons posent les fondations d'un nouveau palais califal là où se dressait autrefois la Ville ronde d'al-Mansur. Les nouvelles madrasas montent ensuite : la Mustansiriyya est reconstruite, puis la Nizamiyya. Les ingénieurs restaurent les canaux d'irrigation brisés par les Mongols. Le traumatisme de 1258, lorsque le Tigre était noir de l'encre des livres noyés et rouge du sang du dernier calife abbasside, est enfin guéri par l'artisanat ordinaire. Où doivent se concentrer les efforts du Califat ?"
 nd_khl.4.a: "Reconstruire Bagdad pour en faire la plus grande ville du monde"
 nd_khl.4.b: "Restaurez chaque province en ruine de la Oumma"

 nd_khl.5.t: "Le Conseil des oulémas"
 nd_khl.5.d: "Pour la première fois depuis les débuts des Abbassides, les principaux juristes des quatre madhhabs sunnites siègent ensemble en conseil. Le mufti hanafite de Constantinople, le cheikh shafi'ite d'al-Azhar, l'imam malékite des Qarawiyyin et l'alim hanbalite de La Mecque débattent des limites de ce qui est permis, de ce qui est interdit et de ce qui est laissé à la discrétion. Le calife préside mais ne vote pas. Que va-t-il advenir de ce synode ?"
 nd_khl.5.a: "Affirmer l’orthodoxie par l’unité"
 nd_khl.5.b: "Forger une nouvelle jurisprudence universelle"

 nd_khl.6.t: "Le calife Ghulam"
 nd_khl.6.d: "Le système des esclaves et des soldats, autrefois la malédiction des derniers Abbassides lorsque les ghilman devinrent faiseurs de rois à Samarra, est aujourd'hui l'institution la plus fiable du Califat. Les garçons du Caucase, du Soudan et des Balkans sont achetés, convertis, scolarisés, entraînés et liés au seul calife. Ils n’ont aucun parent à privilégier ni aucune patrie vers laquelle fuir. À mesure que le corps grandit, le calife doit décider quel travail il doit accomplir."
 nd_khl.6.a: "Déployez le ghulam comme garde du calife"
 nd_khl.6.b: "Envoyez les meilleurs en tant que gouverneurs provinciaux"

 nd_khl.7.t: "Le califat de la poudre à canon"
 nd_khl.7.d: "Les bombardements de Mehmed ont autrefois abattu les murs de Constantinople. Les mousquetaires de Selim ont balayé les Mamelouks à Marj Dabiq. Les artilleurs de Babur ont brisé les Lodis à Panipat. Aujourd’hui, ces traditions, ottomane, mamelouke, moghole, s’agenouillent toutes devant un calife et se fondent en une seule doctrine de guerre. Les maîtres artilleurs de Topkapi exercent à Alep ; les arquebusiers moghols s'entraînent au Caire ; les fonderies d'Edirne, d'Alexandrie et de Lahore fabriquaient des canons selon une spécification unique. Comment appliquer la nouvelle doctrine ?"
 nd_khl.7.a: "Le train d’artillerie califale"
 nd_khl.7.b: "Le jihad armé de mousquets"

 nd_khl.8.t: "Deux océans, une bannière"
 nd_khl.8.d: "La flotte d'Alexandrie porte la bannière verte du calife ; il en va de même pour le chantier naval de Suez, l'escadre d'Aden, la patrouille d'Ormuz, la flotte corsaire du Maghreb et les navires de ligne ottomans Kapudan-i Derya. Pour la première fois depuis les Fatimides, l’océan Indien et la Méditerranée sont contrôlés ensemble. L’intrusion portugaise peut recevoir une réponse coordonnée. Où le Califat frappera-t-il en premier ?"
 nd_khl.8.a: "Chassez les Francs de l'océan Indien"
 nd_khl.8.b: "Maîtrisez la Méditerranée comme un lac Khilafan"

 nd_khl.9.t: "Type arabe"
 nd_khl.9.d: "Après deux siècles de résistance des corporations de calligraphes, la première imprimerie en écriture arabe est autorisée à Constantinople, puis au Caire, puis à Bagdad, puis à Cordoue. Le problème technique de l’arabe cursif, avec ses lettres changeant de forme selon leur position, a enfin été résolu par les typographes du Khilafan. Les livres qui coûtaient autrefois un an de salaire coûtent désormais des semaines. Le calife doit décider ce qui sortira en premier des nouvelles presses."
 nd_khl.9.a: "Imprimez le Coran pour chaque mosquée de village"
 nd_khl.9.b: "Imprimez les sciences pour chaque madrasa"

 nd_khl.10.t: "Les Tariqas s'unissent"
 nd_khl.10.d: "Jusqu'à ce concile, chaque ordre soufi, le Naqshbandi, le Qadiriyya, le Mevlevi, le Bektashi, le Chishti, le Shadhili, a répondu à sa propre silsila de maîtres et de disciples, tantôt orthodoxes, tantôt hétérodoxes, souvent les deux. Désormais, les principaux cheikhs des grands ordres se rassemblent sous le patronage du calife. Le calife propose : il n'y a pas une seule voie soufie, mais il y a un seul Khilafah, et chaque ordre doit le servir. Les commandes acceptent. La question est de savoir quel soufisme fleurira."
 nd_khl.10.a: "Patronner les ordres sobres et orthodoxes"
 nd_khl.10.b: "Patronner les commandes extatiques et converties"

 nd_khl.11.t: "Le Diwan Universel"
 nd_khl.11.d: "L'iqta abbasside, l'iqta mamelouke, le timar seldjoukide-ottoman, le jagir moghol, tous les quatre représentaient la même idée dans des langues différentes : un soldat détient des terres de l'État et sert l'État en temps de guerre. Le grand vizir du Khilafan propose qu'ils soient unifiés, codifiés et rationalisés en un système foncier unique, gérable à partir d'un seul registre dans le Diwan central. La réforme se heurte à la résistance des détenteurs établis. Comment sera-t-il mis en œuvre ?"
 nd_khl.11.a: "Centraliser l'imposition au Diwan"
 nd_khl.11.b: "Autonomisez les Timariots locaux en échange de services"

 nd_khl.12.t: "Le dirham du Califan"
 nd_khl.12.d: "Depuis l’époque d’Abd al-Malik, le dirham est la monnaie d’argent du monde islamique, et depuis le lendemain, chaque dirigeant local l’a dégradé pour son propre bénéfice. La réforme du Khilafan interdit la frappe locale, fixe le poids et la teneur en argent du dirham par décret califal et tamponne les nouvelles pièces de quelques monnaies centrales sous surveillance directe. Les marchands de Grenade au Bengale feront confiance à cette monnaie. Quelle est la politique monétaire du Khalafah ?"
 nd_khl.12.a: "Un étalon en argent pur, monnaie califale uniquement"
 nd_khl.12.b: "Ouvrez les ateliers califaux, augmentez l'offre"

 nd_khl.13.t: "Le calife Tanzimat"
 nd_khl.13.d: "Les navires à vapeur européens accostent dans les ports du Khilafan. Les lignes télégraphiques européennes atteignent les capitales du Califan. Les armées européennes, dix fois plus petites que celles du calife, battent ses forces frontalières à l'aide d'exercices et de mousquets rayés. La réforme n’est plus facultative. Le grand vizir présente deux mémorandums : l'un appelant à une loi codifiée, à des armées de conscrits, à des écoles techniques, à des fonctionnaires salariés et à une économie industrielle ; l’autre appelant à un retour à la voie des salaf, à un dépouillement des accrétions, à un renouveau orthodoxe militant. Le calife entend les deux et doit choisir."
 nd_khl.13.a: "Moderniser par le haut ; adopter ce qui fonctionne"
 nd_khl.13.b: "Retour sur le chemin des pieux ancêtres"

 # ============================================================
 # Advances
 # ============================================================
 nd_khl_mujahid_levy: "Volontaires Moudjahid"
 nd_khl_mujahid_levy_desc: "Le combattant volontaire qui répond à l'appel du calife pour défendre le Dar al-Islam, issu de toute la Oumma sans égard à la tribu ou à la terre."
 nd_khl_ribat_network: "Le réseau Ribat"
 nd_khl_ribat_network_desc: "La garnison-monastère frontière, moitié forteresse et moitié retraite, tient les marches du Califah. De la Tunisie aghlabide à la frontière du Khorasan, les ribats de la oumma constituent désormais un système défensif unique."
 nd_khl_hajj_logistics: "Logistique du Hajj"
 nd_khl_hajj_logistics_desc: "Le pèlerinage annuel à La Mecque est codifié comme une institution étatique permanente. L'Amir al-Hajj commande ; le Trésor califal souscrit ; les puits, forts et relais du Darb Zubayda et de la route syrienne sont entretenus par décret califal."
 nd_khl_grand_jami: "La mosquée Grand Jami"
 nd_khl_grand_jami_desc: "La mosquée congrégationaliste de prière du vendredi est le centre visible de chaque ville du Califan. De la mosquée des Omeyyades de Damas à la Grande Mosquée de Cordoue, les grands jami du Khilafah définissent le tissu urbain du monde islamique."
 nd_khl_caliphal_diwan: "Le Diwan calife"
 nd_khl_caliphal_diwan_desc: "L'appareil bureaucratique abbasside, le diwan al-rasa'il, le diwan al-jund, le diwan al-kharaj, est restauré en tant que colonne vertébrale de l'État universel. Des scribes qualifiés administrent en arabe standardisé à partir d'une seule chancellerie."
 nd_khl_universal_sharia: "Charia universelle"
 nd_khl_universal_sharia_desc: "Les quatre madhhabs sunnites, Hanafi, Shafi'i, Maliki, Hanbali, sont reconnues comme une seule jurisprudence appliquée à travers l'empire. Là où ils diffèrent, les cadis appliquent le madhhab local ; là où ils sont d’accord, la loi est universelle."

 nd_khl_bayt_al_hikmah: "Bayt al-Hikmah restauré"
 nd_khl_bayt_al_hikmah_desc: "La Maison de la Sagesse d'Al-Ma'mun, la grande académie de traduction qui traduisait la science grecque, sanscrite et persane en arabe, est reconstruite à Bagdad. Les héritiers de Hunayn ibn Ishaq travaillent dans des chambres restaurées ; les manuscrits détruits par les Mongols sont copiés à partir d'exemplaires survivants de Cordoue, du Caire et de Boukhara."
 nd_khl_ghulam_corps: "Le Corps Ghulam"
 nd_khl_ghulam_corps_desc: "La garde à cheval composée de soldats esclaves, perfectionnée sous al-Mu'tasim et affinée par toutes les dynasties islamiques depuis, constitue la cavalerie personnelle du calife. Les ghulam répondent au trône seul, et non à la tribu ou à la province."
 nd_khl_caliphal_galley: "La galère califale"
 nd_khl_caliphal_galley_desc: "Les flottes méditerranéennes de Cordoue, Tunis, Alexandrie et Constantinople sont unifiées en une seule marine califale. Les traditions de construction navale levantine, maghrébine et andalouse se fertilisent mutuellement."
 nd_khl_caliphal_dirham: "Le dirham califal"
 nd_khl_caliphal_dirham_desc: "Le dirham en argent d'Abd al-Malik de 696 est restauré comme monnaie universelle. La frappe locale est réglementée ; les poids sont standardisés ; le dirham du Khilafan devient la monnaie de réserve mondiale."
 nd_khl_universal_madrasah: "La Médersa universelle"
 nd_khl_universal_madrasah_desc: "La Nizamiyya, la Mustansiriyya, al-Azhar, la Qarawiyyin, les grandes madrasas de Boukhara, Samarkand et Cordoue enseignent un programme unifié du Khilafan. Un universitaire formé à Fès peut enseigner à Lahore."
 nd_khl_tariqa_unification: "Les Tariqas unifiées"
 nd_khl_tariqa_unification_desc: "Les ordres soufis, Naqshbandi, Qadiriyya, Mevlevi, Bektashi, Chishti, Shadhili, sont placés sous le patronage califal. Le calife n'approuve aucune tariqa, mais tous les ordres l'acceptent comme Amir al-Mu'minin."

 nd_khl_post_mongol_restoration: "Restauration post-mongole"
 nd_khl_post_mongol_restoration_desc: "Les dégâts du siècle mongol, villes pillées, irrigation ruinée, manuscrits perdus, populations décimées, sont systématiquement réparés. Les ingénieurs et les bureaucrates du Khalafah défont ce que Hulegu, Timur et la peste noire avaient accompli ensemble."
 nd_khl_gunpowder_caliphate: "Le califat de la poudre à canon"
 nd_khl_gunpowder_caliphate_desc: "Les bombardes ottomanes, les arquebuses mameloukes et les fusils à mèche moghols sont fusionnés en une seule doctrine khilafan de guerre à poudre. Les fonderies califales fabriquaient des canons selon une spécification unique, du Caire à Lahore."
 nd_khl_universal_iqta: "Iqta universel"
 nd_khl_universal_iqta_desc: "Les systèmes d'octroi de terres des Abbassides (iqta), des Mamelouks (iqta), des Seldjoukides-Ottomans (timar) et des Moghols (jagir) sont unifiés en un seul régime : détenir des terres pour le service, perdre des terres pour défaut de service."
 nd_khl_two_oceans_fleet: "La Flotte des Deux Océans"
 nd_khl_two_oceans_fleet_desc: "La flotte méditerranéenne à Constantinople et Alexandrie et la flotte de l'océan Indien à Suez et Aden sont placées sous un commandement califal unifié. De Gibraltar à Malacca, un seul Kapudan Pacha commande."
 nd_khl_arabic_press: "L'imprimerie arabe"
 nd_khl_arabic_press_desc: "Le problème technique de la composition cursive en arabe est enfin résolu. Les Corans imprimés, les recueils de hadiths, les manuels juridiques et les traités scientifiques propagent l'alphabétisation à une vitesse sans précédent."
 nd_khl_caliphal_corsairs: "Corsaires califaux"
 nd_khl_caliphal_corsairs_desc: "Les corsaires barbaresques, les corsaires levantins et les pillards adenis naviguent tous sous des lettres de marque califales. Les ennemis du Khalafah ne peuvent pas déplacer un navire marchand sans payer."
 nd_khl_sharif_legitimacy: "Légitimité de Sharif"
 nd_khl_sharif_legitimacy_desc: "La descendance du calife de la famille du Prophète est publiquement affirmée par chaque chérif de La Mecque, Médine et Hadramawt. La légitimité du Califat est liée à la lignée du Prophète lui-même."

 nd_khl_caliphal_corps: "Le corps des esclaves califaux"
 nd_khl_caliphal_corps_desc: "Le système des janissaires des Ottomans, les mamelouks Bahri et Burji, le ghulam persan : tous sont absorbés dans un seul corps d'esclaves califaux comptant des dizaines de milliers. Il s'agit de la première armée professionnelle permanente au monde."
 nd_khl_tofangchi: "Le Corps Tofangchi"
 nd_khl_tofangchi_desc: "Le mousquetaire persan-moghol tofangchi est unifié avec l'arquebusier mamelouk et le tfeki ottoman en une seule tradition d'infanterie légère califale : la mèche et la discipline."
 nd_khl_oceanic_galleon: "Le galion océanique"
 nd_khl_oceanic_galleon_desc: "Combinant le gréement d'un boutre de l'océan Indien avec la construction d'un galion ibérique, le galion océanique Khilafan transporte le commerce califal et les armes califales à travers les deux océans."
 nd_khl_universal_court: "La Cour universelle"
 nd_khl_universal_court_desc: "La cour divani abbasside de Bagdad, le protocole de Topkapi des Ottomans, le darbar moghol, tous sont absorbés dans un seul cérémonial de cour khilafan, projetant la souveraineté universelle."
 nd_khl_pan_sunni_authority: "Autorité pan-sunnite"
 nd_khl_pan_sunni_authority_desc: "Le calife est reconnu simultanément comme imam des quatre madhhabs sunnites. Sa khutba du vendredi est lue dans toutes les mosquées congrégationnelles de Grenade à Sumatra."
 nd_khl_imperial_integration: "Intégration impériale"
 nd_khl_imperial_integration_desc: "Les musulmans berbères, arabes, égyptiens, levantins, anatoliens, persans, turcs, indiens et andalous se considèrent tous comme les sujets d'un Khilafah d'abord, et ensuite comme membres de leurs communautés locales."

 nd_khl_caliphal_absolutism: "Absolutisme califal"
 nd_khl_caliphal_absolutism_desc: "Le calife n’est plus le premier parmi ses pairs parmi les dirigeants locaux du monde sunnite ; il est le souverain absolu d’un seul État intégré s’étendant sur trois continents."
 nd_khl_modern_navy: "La marine califale moderne"
 nd_khl_modern_navy_desc: "Frégates et navires de ligne, chantiers navals calqués sur les meilleures pratiques ibériques et atlantiques, capitaines professionnels issus d'une seule académie du Khilafan : la marine se modernise sans perdre son caractère méditerranéen et de mousson."
 nd_khl_caliphal_bank: "La banque califale"
 nd_khl_caliphal_bank_desc: "Un réseau de crédit du Khilafan utilisant des sakk (chèques), des suftaja (lettres de change) et les nouveaux prêts institutionnels du monde post-Réforme relient le Caire, Damas, Bagdad, Constantinople, Alep et Cordoue en un seul système financier."
 nd_khl_caliphal_science: "La révolution scientifique califale"
 nd_khl_caliphal_science_desc: "Les astronomes, mathématiciens, médecins et chimistes du Khilafah, travaillant de La Mecque à Cordoue au sein d'une seule communauté scientifique arabe, conduisent un Khilafan parallèle à la révolution scientifique européenne."
 nd_khl_universal_legitimacy: "Légitimité universelle"
 nd_khl_universal_legitimacy_desc: "Les États chrétiens et hindous acceptent la préséance diplomatique du Califat ; les dirigeants de l'Espagne, de la France, du Saint Empire romain germanique et des royaumes hindous s'adressent au calife comme à un pair ou à un supérieur. Le Khilafah est la première puissance mondiale."

 nd_khl_caliphal_tanzimat: "Le calife Tanzimat"
 nd_khl_caliphal_tanzimat_desc: "Droit codifié, armées de conscrits, fonctionnaires salariés, écoles techniques, télégraphes, chemins de fer : le Khilafah se modernise par le haut, en s'inspirant des modèles européens sans renoncer à son caractère islamique."
 nd_khl_modern_army: "L'armée califale moderne"
 nd_khl_modern_army_desc: "La conscription remplace la levée et le corps d'esclaves. Les mousquets rayés remplacent les fusils à mèche. Les bataillons entraînés remplacent la cavalerie sipahi. La Nizami Jadid est l’armée modèle du défunt Khalafah."
 nd_khl_steam_navy: "La marine à vapeur"
 nd_khl_steam_navy_desc: "Les frégates à vapeur et les cuirassés construits dans les chantiers navals du Khilafan, de Constantinople à Bombay, portent la bannière verte dans l'ère de la guerre navale industrielle."
 nd_khl_pan_islamic_congress: "Le Congrès panislamique"
 nd_khl_pan_islamic_congress_desc: "Institution diplomatique moderne, le Congrès califal parle au nom de la Oumma lors du Concert des puissances. Là où les empires européens envoient des ministres des Affaires étrangères, le Califat envoie une voix unique à la communauté islamique mondiale."
 nd_khl_industrial_khilafah: "Le Califah industriel"
 nd_khl_industrial_khilafah_desc: "Filatures de coton en Égypte, fonderies en Anatolie, chantiers navals à Suez, métiers à tisser mécanisés à Damas et réseaux ferroviaires reliant Le Caire, Bagdad et Lahore : le Khilafah s'industrialise selon ses propres conditions."

 # ============================================================
 # Custom unit names
 # ============================================================
 a_nd_khl_mujahid_volunteers: "Volontaires Moudjahid"
 a_nd_khl_mujahid_volunteers_desc: "Infanterie volontaire de toute la Oumma, motivée par la foi et l'appel du calife. Très motivé mais légèrement blindé."
 a_nd_khl_ghulam_cavalry: "Cavalerie Ghulam"
 a_nd_khl_ghulam_cavalry_desc: "Le soldat-esclave du calife montait la garde, élevé dès l'enfance et lié seul au trône. Cavalerie de choc d'élite dans la tradition Yarmuk."
 n_nd_khl_caliphal_galley: "Galère califale"
 n_nd_khl_caliphal_galley_desc: "Cuisine méditerranéenne combinant les traditions de construction navale andalouse, maghrébine, égyptienne et levantine. Le navire de guerre standard de la flotte méditerranéenne unifiée du Khilafan."
 n_nd_khl_caliphal_galleon: "Galion califal"
 n_nd_khl_caliphal_galleon_desc: "Navire de guerre lourd de haute mer combinant la conception d'un galion ibérique avec un gréement de l'océan Indien, adapté aussi bien à la protection commerciale en Méditerranée qu'à la saison de la mousson."
 a_nd_khl_caliphal_corps: "Corps des esclaves califaux"
 a_nd_khl_caliphal_corps_desc: "Infanterie d'esclaves équivalente aux janissaires : entraînées, entraînées encore, nourries par la cuisine du calife, payées par le trésor du calife et liées au seul calife."
 a_nd_khl_tofangchi: "Mousquetaires Tofangchi"
 a_nd_khl_tofangchi_desc: "Tirailleurs mousquetaires légers dans la tradition perse-moghole, armés de mèches à mèche et entraînés pour harceler des formations plus importantes."
 n_nd_khl_oceanic_galleon: "Galion océanique"
 n_nd_khl_oceanic_galleon_desc: "Le grand navire de guerre à bord de la Flotte des Deux Océans, conçu pour des opérations navales soutenues à la fois en Méditerranée et dans l'océan Indien."
 n_nd_khl_caliphal_frigate: "Frégate califale"
 n_nd_khl_caliphal_frigate_desc: "Navire de guerre rapide modernisé combinant les meilleures traditions navales ibériques et ottomanes, le cheval de bataille de la marine califale de l'ère absolutiste."
 a_nd_khl_nizami_jadid: "Nizami Jadid"
 a_nd_khl_nizami_jadid_desc: "L'armée du Nouvel Ordre : une infanterie de conscrits entraînée à la manière européenne mais servant sous le drapeau du Khilafan. Mousquet rayé, uniforme moderne, corps d'officiers professionnels."
 n_nd_khl_steam_frigate: "Frégate à vapeur califale"
 n_nd_khl_steam_frigate_desc: "Navire de guerre moderne à vapeur construit dans les chantiers navals de Suez, Constantinople et Bombay, projetant la puissance navale du Khilafan dans l'ère industrielle."

 # ============================================================
 # Custom buildings
 # ============================================================
 nd_khl_ribat_garrison: "Ribat"
 nd_khl_ribat_garrison_desc: "Garnison-monastère frontalier abritant des combattants volontaires et des ascètes lors des marches du Khilafah. Mi-forteresse, mi-retraite religieuse."
 nd_khl_hajj_caravanserai: "Caravansérail du Hajj"
 nd_khl_hajj_caravanserai_desc: "Complexe fortifié avec écuries, citernes d'eau et dortoirs ombragés le long de la route des pèlerins. Entretenu par décret califal, il dessert aussi bien les pèlerins que les caravanes marchandes."
 nd_khl_grand_jami_mosque: "Mosquée Grand Jami"
 nd_khl_grand_jami_mosque_desc: "La grande mosquée congrégationaliste de prière du vendredi, le cœur visible de chaque ville du Califan. Le minbar d'où est délivrée la khutba du calife."
 nd_khl_caliphal_diwan_building: "Diwan calife"
 nd_khl_caliphal_diwan_building_desc: "La chancellerie et le ministère des Finances du Khilafah, avec ses scribes formés, ses registres scellés et ses protocoles arabes standardisés."
 nd_khl_bayt_al_hikmah_building: "Bayt al-Hikmah"
 nd_khl_bayt_al_hikmah_building_desc: "Maison de la Sagesse : une grande bibliothèque, une académie de traduction et un observatoire combinés. Les manuscrits grecs, sanscrits, persans et syriaques sont traduits en arabe ; la nouvelle science est générée en dialogue avec la tradition traduite."
 nd_khl_caliphal_mint: "Menthe califale"
 nd_khl_caliphal_mint_desc: "Monnaie du dirham en argent et du dinar en or, frappés selon les spécifications de poids califales et acceptés sur tous les marchés du Khilafah."
 nd_khl_universal_madrasah_building: "Médersa universelle"
 nd_khl_universal_madrasah_building_desc: "Collège religieux et universitaire enseignant le programme unifié du Khilafan. Un érudit formé à Fès peut enseigner à Boukhara ; un diplômé d'Al-Azhar sert à Lahore."
 nd_khl_sufi_khanqah: "Khanqah soufie"
 nd_khl_sufi_khanqah_desc: "Lodge soufi abritant une confrérie tariqa. Les frères mènent le dhikr, accueillent les voyageurs, soutiennent les convertis et lient la communauté locale au réseau universel calife soufi."
 nd_khl_caliphal_bank_building: "Banque califale"
 nd_khl_caliphal_bank_building_desc: "Important établissement de crédit proposant des prêts sakk, suftaja et institutionnels modernes à travers le réseau financier pan-Khilafan."

 # ============================================================
 # Building maintenance PMs (avoid auto-generated names)
 # ============================================================
 nd_khl_ribat_maintenance: "Garnison de Ribat"
 nd_khl_ribat_maintenance_desc: "Entretien standard du ribat frontière : armes, pierres de fortification et remontées."
 nd_khl_caravanserai_maintenance: "Service de caravansérail"
 nd_khl_caravanserai_maintenance_desc: "Approvisionnement de l'auberge des pèlerins : tissus, bétail et céréales pour les voyageurs."
 nd_khl_grand_jami_maintenance: "Entretien du Grand Jami"
 nd_khl_grand_jami_maintenance_desc: "Pierre, manuscrits et marbre décoratif pour la grande mosquée congrégationaliste."
 nd_khl_diwan_maintenance: "Opérations Diwan"
 nd_khl_diwan_maintenance_desc: "Papier, tissu de scribe et pierres précieuses de cérémonie pour l'appareil bureaucratique."
 nd_khl_bayt_al_hikmah_scholarship: "Mouvement de traduction"
 nd_khl_bayt_al_hikmah_scholarship_desc: "Papier, toile de reliure et codex reliés pour la grande académie de traduction."
 nd_khl_mint_maintenance: "Opérations de la Monnaie"
 nd_khl_mint_maintenance_desc: "Lingots d'argent, alliages de cuivre et outils de frappe pour la monnaie califale."
 nd_khl_madrasah_maintenance: "Programme d'études de la médersa"
 nd_khl_madrasah_maintenance_desc: "Papier, étoffe d'érudit et textes d'étude reliés pour la madrasa universelle."
 nd_khl_khanqah_maintenance: "Khanqah Hospitalité"
 nd_khl_khanqah_maintenance_desc: "Tissu, céréales et laine pour la loge soufie et ses voyageurs."
 nd_khl_bank_maintenance: "Opérations bancaires"
 nd_khl_bank_maintenance_desc: "Du papier pour les grands livres, de l'argent et de l'or pour les réserves et des pierres précieuses pour les garanties."

