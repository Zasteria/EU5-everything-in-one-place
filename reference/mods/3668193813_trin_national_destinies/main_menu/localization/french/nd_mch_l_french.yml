l_french:
 STATIC_MODIFIER_NAME_nd_mch_way_of_the_ancestors: "Chemin des Ancêtres"
 STATIC_MODIFIER_DESC_nd_mch_way_of_the_ancestors: "La nation mandchoue préserve son héritage martial et ses traditions steppiques. La Voie des Ancêtres exige la maîtrise de l'équitation, du tir à l'arc et de la chasse : les compétences qui ont forgé un empire à partir de tribus dispersées."
 STATIC_MODIFIER_NAME_nd_mch_dragon_throne: "Le trône du dragon"
 STATIC_MODIFIER_DESC_nd_mch_dragon_throne: "Les dirigeants mandchous adhèrent au mandat du Ciel et à l’appareil de la civilisation chinoise. Adoptant une gouvernance bureaucratique et des traditions savantes, l’empire est administré par les institutions de l’art politique confucéen."
 nd_mch.1.t: "Le destin mandchou"
 nd_mch.1.d: "The scattered Jurchen tribes have been forged into a single nation: the Manchu. From the forests of the Changbai Mountains to the banks of the Songhua, the banners now fly united. But unity raises a question that will define our future: shall we preserve the traditions of our ancestors (the hunt, the horse, the discipline of the niru), or shall we look southward, toward the vast civilization whose wealth and learning beckon from beyond the Willow Palisade? The path we choose now will shape the Manchu for generations.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mch.1.a: "Nous sommes cavaliers et guerriers : les ancêtres nous guident."
 nd_mch.1.b: "Nous gouvernerons depuis le Trône du Dragon lui-même."
 nd_mch.2.t: "Le système Niru"
 nd_mch.2.d: "Notre organisation militaire et civile a été transformée grâce au système niru. Chaque compagnie de trois cents hommes sert non seulement d'unité de combat mais aussi de district administratif, responsable de l'impôt, du recensement et du service du travail. A travers le niru, chaque homme de la nation a un rôle : chasseur, agriculteur, soldat, artisan. La question qui se pose à nous est de savoir s’il faut mettre l’accent sur le potentiel militaire de cette organisation ou sur sa capacité de gouvernance civile."
 nd_mch.2.a: "Les niru existent pour mettre des guerriers sur le terrain."
 nd_mch.2.b: "Le niru gouvernera aussi bien que combattra."
 nd_mch.3.t: "La palissade de saules"
 nd_mch.3.d: "Un grand terrassement de fossés, de remblais et de saules marque désormais la limite de la patrie mandchoue. La palissade de saules s'étend du Shanhaiguan jusqu'à la frontière, séparant la Mandchourie de la Mongolie et des terres chinoises du Liaodong. Les postes de surveillance de Karun surveillent les postes frontières, contrôlant les mouvements des marchands, des colons et des ennemis potentiels. La Palissade préserve le caractère de nos terres ancestrales tout en défendant notre profondeur stratégique."
 nd_mch.3.a: "La patrie est sécurisée."
 nd_mch.4.t: "Le Haut Qing"
 nd_mch.4.d: "Sous une direction impériale vigoureuse, l’État mandchou a atteint son apogée. Le royaume s'étend du fleuve Amour aux jungles de Birmanie, des déserts du Turkestan à l'île de Taiwan. La population a augmenté, les greniers débordent et le trésor est plein. Pourtant, ce moment de pouvoir suprême nous présente un choix : allons-nous nous lancer dans les dix grandes campagnes pour pacifier chaque frontière, ou consolider cette prospérité et laisser la richesse de l'empire devenir le fondement d'une stabilité durable ?"
 nd_mch.4.a: "Lancez les dix grandes campagnes."
 nd_mch.4.b: "Que la prospérité de Qianlong s'épanouisse."
 STATIC_MODIFIER_NAME_nd_mch_niru_mobilization: "Mobilisation Niru"
 STATIC_MODIFIER_DESC_nd_mch_niru_mobilization: "Le système niru place toute la nation mandchoue sur le pied de guerre, chaque compagnie étant prête à déployer ses trois cents hommes à tout moment."
 STATIC_MODIFIER_NAME_nd_mch_niru_administration: "Administration de Niru"
 STATIC_MODIFIER_DESC_nd_mch_niru_administration: "Les sociétés niru constituent l'épine dorsale administrative de l'État mandchou, collectant les impôts, enregistrant les populations et maintenant l'ordre."
 STATIC_MODIFIER_NAME_nd_mch_ten_great_campaigns: "Dix grandes campagnes"
 STATIC_MODIFIER_DESC_nd_mch_ten_great_campaigns: "Une série de campagnes militaires décisives ont étendu l'autorité mandchoue à tous les coins du royaume, démontrant les prouesses martiales continues des armées de la Bannière."
 STATIC_MODIFIER_NAME_nd_mch_qianlong_prosperity: "La prospérité de Qianlong"
 STATIC_MODIFIER_DESC_nd_mch_qianlong_prosperity: "L'empire connaît une époque de prospérité sans précédent. La croissance démographique, l’expansion agricole et une gestion budgétaire prudente ont créé un âge d’or d’abondance."
 nd_mch_shamanic_traditions: "Traditions chamaniques mandchoues"
 nd_mch_shamanic_traditions_desc: "Le culte d'Abka Enduri, le Dieu du Ciel, et la vénération des esprits ancestraux par l'intermédiaire de chamans héréditaires unissent les clans mandchous dans une pratique spirituelle partagée."
 nd_mch_aha_retainers: "Système de retenue Aha"
 nd_mch_aha_retainers_desc: "Les serviteurs asservis servent les maisons nobles mandchoues, fournissant une réserve de main-d'œuvre militaire qui peut être mobilisée en temps de guerre."
 nd_mch_sable_fur_trade: "Commerce des fourrures de zibeline"
 nd_mch_sable_fur_trade_desc: "Les forêts de Mandchourie produisent les plus belles peaux de zibeline au monde, prisées par les marchands de Pékin à Boukhara."
 nd_mch_jurchen_horsemanship: "Équitation Jurchen"
 nd_mch_jurchen_horsemanship_desc: "Dès l'enfance, chaque guerrier Jurchen apprend à monter le robuste cheval mandchou à travers les rivières gelées et les forêts denses de son pays natal."
 nd_mch_ginseng_monopoly: "Monopole du ginseng"
 nd_mch_ginseng_monopoly_desc: "Le ginseng sauvage des monts Changbai se vend à des prix extraordinaires sur les marchés chinois. L'État mandchou contrôle absolument ce commerce."
 nd_mch_niru_organization: "Organisation militaire Niru"
 nd_mch_niru_organization_desc: "Le système niru organise le peuple mandchou en compagnies militaro-administratives de trois cents personnes, formant la base des armées Banner."
 nd_mch_border_market_diplomacy: "Diplomatie des marchés frontaliers"
 nd_mch_border_market_diplomacy_desc: "Trade markets at Fushun, Kaiyuan, and other border towns serve as both commercial exchanges and diplomatic meeting points between Jurchen, Mongol, and Chinese merchants. Sable is made up into robes for the buyers of the Ming court.\n\n#italic Available in: $nd_mch_fur_workshop$#!"
 nd_mch_bayara_guard: "Garde Impériale Bayara"
 nd_mch_bayara_guard_desc: "Les Bayara constituent l'élite des armées de la Bannière, des guerriers choisis qui servent de garde personnelle du Khan, réputés pour leur férocité au combat."
 nd_mch_manchu_script: "Baksi Scribes"
 nd_mch_manchu_script_desc: "The Jurchen chieftains keep baksi, learned men who write their letters in Mongolian and read Chinese books aloud to them. The court's clerks and translators are drawn from their pupils."
 nd_mch_karun_system: "Surveillance de la frontière de Karun"
 nd_mch_karun_system_desc: "Un réseau de postes frontières karun dotés de soldats Banner surveille la frontière, contrôle les mouvements et collecte des renseignements."
 nd_mch_jianzhou_unification: "Unification de Jianzhou"
 nd_mch_jianzhou_unification_desc: "La consolidation des tribus Jianzhou Jurchen sous une seule maison dirigeante crée la base politique à partir de laquelle émerge la nation mandchoue."
 nd_mch_eight_banners: "Mongol Banners"
 nd_mch_eight_banners_desc: "The Mongols who have joined the Manchu are enrolled in eight banners of their own, beside the eight of the Manchu. Steppe horsemen are entered on the same rolls and drilled under the same captains."
 nd_mch_banner_garrisons: "Garnisons de bannières"
 nd_mch_banner_garrisons_desc: "Les garnisons permanentes de bannières dans les villes stratégiques maintiennent la préparation militaire mandchoue tout en formant la prochaine génération de guerriers."
 nd_mch_willow_palisade: "Palissade de saule"
 nd_mch_willow_palisade_desc: "La grande barrière de terrassement composée de fossés, de remblais et de saules marque la limite de la patrie mandchoue, contrôlant la migration et défendant la profondeur stratégique."
 nd_mch_hanjun_integration: "Intégration de la bannière Hanjun"
 nd_mch_hanjun_integration_desc: "Les familles martiales chinoises qui ont fait défection pour la cause mandchoue sont organisées en leurs propres compagnies de bannières, les Hanjun, combinant la discipline mandchoue avec les connaissances militaires chinoises."
 nd_mch_tribute_system: "Système d'hommage"
 nd_mch_tribute_system_desc: "L'État mandchou hérite et perfectionne le système de tribut, liant les États vassaux par le biais de rituels diplomatiques et d'échanges de biens de prestige."
 nd_mch_seven_grievances: "Les sept griefs"
 nd_mch_seven_grievances_desc: "La proclamation par Nurhaci des Sept griefs contre les Ming fournit un casus belli formel et rallie la nation mandchoue à la cause de la conquête."
 nd_mch_ujen_cooha_tradition: "Infanterie lourde Ujen Cooha"
 nd_mch_ujen_cooha_tradition_desc: "Les Ujen Cooha, infanterie blindée lourde des armées Banner, allient la discipline martiale mandchoue aux équipements militaires les plus récents."
 nd_mch_kangxi_reforms: "Réformes Kangxi"
 nd_mch_kangxi_reforms_desc: "Le long règne de l’empereur Kangxi établit un modèle d’absolutisme éclairé, combinant gouvernance confucéenne et vigueur militaire mandchoue."
 nd_mch_high_qing: "Qing élevé"
 nd_mch_high_qing_desc: "L’empire Mandchou atteint son apogée territoriale et démographique : la plus grande population et l’un des plus grands empires terrestres que le monde ait jamais connu."
 nd_mch_siku_quanshu: "Siku Quanshu"
 nd_mch_siku_quanshu_desc: "La Bibliothèque complète des Quatre Trésors, la plus grande compilation littéraire de l'histoire chinoise, préserve et systématise les connaissances accumulées sur la civilisation."
 nd_mch_canton_system: "Système de cantons"
 nd_mch_canton_system_desc: "Foreign trade is channeled through a single port and the licensed Hong merchants of the Cohong, who stand surety for every ship. State revenue is maximized and contact with the outside world is managed."
 nd_mch_green_standard_legacy: "Village Braves"
 nd_mch_green_standard_legacy_desc: "For a hard campaign the provincial officials raise braves, Han volunteers from the villages who are paid while the war lasts and sent home when it ends. The Banners are spared and the treasury pays for no idle men."
 nd_mch_tongzhi_restoration: "Jiaqing Reforms"
 nd_mch_tongzhi_restoration_desc: "On the death of the Qianlong Emperor in 1799 his favourite Heshen is struck down and his fortune confiscated. The road of remonstrance is opened to officials again, the court's expenses are cut and the White Lotus rebellion is put down."
 nd_mch_self_strengthening: "Provincial Arsenals"
 nd_mch_self_strengthening_desc: "In the long Jinchuan war of the 1770s guns are cast in the field and matchlocks made in the provinces, since nothing heavy can be carried from the capital into the mountains. The arsenals are kept after the war to arm the garrisons from local iron."
 nd_mch_beiyang_army: "Ten Great Campaigns"
 nd_mch_beiyang_army_desc: "In 1792 the Qianlong Emperor counts ten complete victories, from Dzungaria to Nepal. The battalions picked and drilled for those wars, musketeers trained to storm the stone towers of Jinchuan, are kept at the capital as the model for the Banners."
 nd_mch_manchurian_homeland: "Défense intérieure de la Mandchourie"
 nd_mch_manchurian_homeland_desc: "The ancestral Manchurian homeland is closed to Han settlement and guarded against Russian traders and trappers on the Amur. The generals of Mukden, Jilin and Heilongjiang hold it for the Banners."
 nd_mch_new_policies: "Statecraft Learning"
 nd_mch_new_policies_desc: "Officials turn from textual study to the practical problems of government. Essays on the grain transport, the salt monopoly, the currency and the frontier are gathered and printed in 1826 as the Collected Writings on Statecraft, and governors try the proposals in their provinces."
 a_nd_mch_bayara: "Garde Bayara"
 a_nd_mch_bayara_desc: "Les Bayara, « Valiant Warriors », sont la cavalerie de garde d'élite du Mandchou Khan, sélectionnée parmi les meilleurs cavaliers des armées de la Bannière."
 a_nd_mch_meiren_cavalry: "Cavalerie de la bannière Meiren"
 a_nd_mch_meiren_cavalry_desc: "Cavalerie lourde dirigée par Meiren-i Janggin, commandants du régiment Banner, qui sert de bras de choc à l'armée mandchoue."
 a_nd_mch_ujen_cooha: "Ujen Cooha"
 a_nd_mch_ujen_cooha_desc: "L'infanterie lourde des armées Banner, des guerriers blindés entraînés à la fois au combat mandchou traditionnel et aux armes à feu modernes."
 a_nd_mch_green_standard: "Village Braves"
 a_nd_mch_green_standard_desc: "Han volunteers raised by provincial officials for one campaign, armed with matchlock, bow and spear. More numerous than the Banners and paid less, and slow to gather from their villages."
 a_nd_mch_beiyang: "Jianrui Battalion"
 a_nd_mch_beiyang_desc: "The Scaling Ladder Battalion, picked bannermen drilled in the Fragrant Hills to storm the stone towers of Jinchuan. Musketeers trained for the assault, with a heavy train of powder and ladders behind them."
 a_nd_mch_aha: "Aha serviteurs"
 a_nd_mch_aha_desc: "Serviteurs asservis et serviteurs des maisons nobles mandchoues qui servent comme infanterie légère en temps de guerre, appréciés pour leur endurance en campagne."
 nd_mch_ginseng_post: "Poste de traite du ginseng"
 nd_mch_ginseng_post_desc: "Une station commerciale agréée pour la transformation et la vente de ginseng sauvage de Mandchourie, l'un des produits médicinaux les plus précieux d'Asie de l'Est."
 nd_mch_palisade_fort: "Fort de la palissade de saules"
 nd_mch_palisade_fort_desc: "Une section fortifiée de la Willow Palisade, des remblais de terre surmontés de saules entrelacés, adossés à un profond fossé, défendant la patrie mandchoue."
 nd_mch_banner_garrison: "Garnison de bannières"
 nd_mch_banner_garrison_desc: "Une installation militaire permanente abritant les soldats de Banner et leurs familles, servant à la fois de caserne et de centre administratif pour le district environnant."
 nd_mch_fur_workshop: "Atelier de fourrure de zibeline"
 nd_mch_fur_workshop_desc: "Un atelier spécialisé dans le traitement et la transformation des peaux de zibeline, de martre et de renard des forêts de Mandchourie pour le commerce du luxe."
 nd_mch_karun_post: "Poste frontière de Karun"
 nd_mch_karun_post_desc: "Une station de surveillance des frontières occupée par des patrouilles de cavalerie Banner, surveillant les passages frontaliers et collectant des renseignements sur les mouvements au-delà de la Palissade."
 nd_mch_cohong: "Cohong"
 nd_mch_cohong_desc: "The hall of the licensed Hong merchants, through whose hands every cargo of tea, silk and porcelain passes to the foreign ships, and who answer to the customs superintendent for their conduct."
 nd_mch_cohong_upkeep: "Cohong Accounts"
 nd_mch_cohong_upkeep_desc: "Paper for the licences and the ledgers, silver for the security each house deposits, and cloth for the sample rooms."
 nd_mch_machinery_bureau: "Provincial Arsenal"
 nd_mch_machinery_bureau_desc: "A workshop under the provincial governor where matchlocks are forged and guns are cast for the garrisons, from iron and coal bought by the state."
 nd_mch_rifle_works: "Matchlock Shop"
 nd_mch_rifle_works_desc: "The fowling guns of the Banners and the Green Standard are forged and bored from iron over coal fires."
 nd_mch_gun_foundry: "Gun Foundry"
 nd_mch_gun_foundry_desc: "Siege and field guns are cast in iron and bronze on the patterns of the Board of Works."
 nd_mch_sable_robes: "Sable Robes"
 nd_mch_sable_robes_desc: "The best pelts are matched, dyed and sewn into robes and collars for the border markets."
 nd_mch_ginseng_processing: "Traitement du ginseng"
 nd_mch_ginseng_processing_desc: "Le séchage, le tri et le classement minutieux des racines de ginseng sauvage destinées à la vente aux apothicaires chinois."
 nd_mch_palisade_maintenance: "Entretien de la palissade"
 nd_mch_palisade_maintenance_desc: "L'entretien régulier de la palissade de saules, la replantation de saules, le dégagement des fossés et la réparation des remblais."
 nd_mch_banner_training: "Formation sur les bannières"
 nd_mch_banner_training_desc: "Le régime d'entraînement martial rigoureux des garnisons de Banner, mettant l'accent sur le tir à l'arc monté, le combat à la lance et la coordination des unités."
 nd_mch_fur_curing: "Traitement de la fourrure"
 nd_mch_fur_curing_desc: "Les peaux brutes de zibeline, de martre et de renard sont salées, étirées et fumées pour obtenir du cuir finement séché pour le commerce du luxe."
 nd_mch_karun_patrol: "Patrouille Karun"
 nd_mch_karun_patrol_desc: "Patrouilles montées qui s'étendent le long de la frontière entre les postes frontières de Karun, assurant la surveillance et interceptant les passages non autorisés."
 levy_nd_mch_meiren_cavalry: "Prélèvement de cavalerie de la bannière Meiren"
 levy_nd_mch_meiren_cavalry_desc: "Cavalerie de bannières issue des domaines nobles et soldats, dirigée par leurs commandants régimentaires meiren."
 levy_nd_mch_green_standard: "Levy of Braves"
 levy_nd_mch_green_standard_desc: "Infantry raised from the Han villages of the provinces for the length of a campaign."
 levy_nd_mch_aha: "Prélèvement de retenue Aha"
 levy_nd_mch_aha_desc: "Infanterie légère levée auprès des serviteurs esclaves attachés aux maisons nobles mandchoues."
 nd_mch_formed_tt: "Le Mandchou a été formé"
 nd_mch_path_a_tt: "A choisi la voie des ancêtres"
 nd_mch_path_b_tt: "Choisissez le trône du dragon"
 nd_mch_destiny: "Le destin mandchou"
 nd_mch_destiny_desc: "La nation mandchoue est unie sous les bannières. Il faut maintenant répondre à la grande question : allons-nous partir en conquérants de la steppe, ou allons-nous nous diriger vers le sud pour revendiquer le trône du dragon de Chine ?"
 nd_mch_dest_banner_supremacy: "Suprématie de la bannière"
 nd_mch_dest_banner_supremacy_desc: "Étendre la domination militaire mandchoue au-delà de la patrie. Battez les tribus mongoles à Buir Nuur et démontrez que les armées de bannières sont la force suprême dans la steppe du nord."
 nd_mch_dest_northern_khanate: "Le Khanat du Nord"
 nd_mch_dest_northern_khanate_desc: "Prenez Urga, le cœur sacré de la Mongolie, et établissez la suzeraineté mandchoue sur la steppe du nord. Construisez le trésor qui soutient un empire continental."
 nd_mch_dest_steppe_apex: "Empire des steppes"
 nd_mch_dest_steppe_apex_desc: "Étendez la bannière mandchoue de Kashgar à Lhassa, en conquérant les oasis de la Route de la Soie et le plateau tibétain. Forgez le plus grand empire d’Asie intérieure depuis les Mongols."
 nd_mch_dest_dragon_capital: "La Capitale du Dragon"
 nd_mch_dest_dragon_capital_desc: "Traversez la Willow Palisade et saisissez Dadu, l'ancienne capitale du nord de la Chine. Établissez le règne mandchou depuis le siège du trône du dragon."
 nd_mch_dest_mandate_of_heaven: "Le mandat du ciel"
 nd_mch_dest_mandate_of_heaven_desc: "Claim the Mandate of Heaven through institutional mastery and economic growth. Banking is embraced, and Mukden, where the dynasty was proclaimed in 1636, is built up into a capital fit for it."
 nd_mch_dest_shenyang_developed_tt: "Shenyang is ours and has been built up to a development of at least 36"
 nd_mch_dest_celestial_empire: "L'Empire Céleste"
 nd_mch_dest_celestial_empire_desc: "Complete the conquest of China by securing Guangzhou and its southern trade, and the rich lands of Jiangnan below the Yangtze. The wealthiest empire in the world is then ours."
 nd_mch_dest_jiangnan_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in #bold Jiangnan#!"
 nd_mch.5.t: "Le destin mandchou se dévoile"
 nd_mch.5.d: "Avec la stabilité rétablie et les bannières flottant fièrement, la nation mandchoue est prête à écrire son chapitre de l’histoire. Les bases ont été posées. Ce qui reste, c’est la volonté de bâtir sur ces bases."
 nd_mch.5.a: "Notre destin nous attend."
 nd_mch.6.t: "Suprématie de la bannière"
 nd_mch.6.d: "Les armées Banner ont fait leurs preuves contre les cavaliers mongols à Buir Nuur. La steppe tremble devant la discipline des Huit Bannières, et les tribus qui attaquaient autrefois nos frontières envoient désormais des envoyés pour leur rendre hommage. La Voie des Ancêtres a été confirmée par la conquête."
 nd_mch.6.a: "La steppe s'incline devant la Bannière."
 nd_mch.7.t: "Le Khanat du Nord"
 nd_mch.7.d: "Avec Ourga entre nos mains, l’État mandchou est devenu la puissance suprême de la steppe du nord. La question est désormais de savoir comment consolider ce vaste domaine. Devons-nous établir des marchés aux chevaux le long de la frontière pour profiter du commerce nomade, ou mettre en garnison les cols montagneux pour créer une défense nord imprenable ?"
 nd_mch.7.a: "Ouvrez les marchés aux chevaux à tous."
 nd_mch.7.b: "Fortifiez les cols contre toutes les menaces."
 nd_mch.8.t: "Empire des steppes"
 nd_mch.8.d: "Des monts Changbai au Pamir, de l'Amour gelé au toit du monde, la bannière mandchoue flotte sur le plus grand empire d'Asie intérieure depuis Gengis Khan. Nous avons conquis des peuples que les Mongols eux-mêmes ne pouvaient pas retenir. Nous devons maintenant décider comment exercer ce pouvoir : en tant que conquérants agités à la recherche perpétuelle de nouveaux horizons, ou en tant que gardiens éternels de l’ordre steppique que nous avons créé."
 nd_mch.8.a: "Nous marchons toujours en avant."
 nd_mch.8.b: "La Bannière éternelle garde ce qu'elle a gagné."
 nd_mch.9.t: "La Capitale du Dragon"
 nd_mch.9.d: "Dadu est tombé aux mains des armées de la Bannière. L'ancienne capitale de la Chine du Nord, siège des Yuan et des Ming avant nous, est aujourd'hui au service de la dynastie Mandchoue. Depuis la Cité Interdite, nous contemplons une civilisation de centaines de millions d'habitants. Le Trône du Dragon est à nous."
 nd_mch.9.a: "Nous gouvernons depuis le trône du dragon."
 nd_mch.10.t: "Le mandat du ciel"
 nd_mch.10.d: "L’empire s’est développé au-delà de tout ce que nos ancêtres auraient pu imaginer. Les institutions prospèrent, le commerce circule sur des milliers de marchés et le trésor se gonfle d'argent. Le Mandat du Ciel n'est pas simplement revendiqué mais démontré par une bonne gouvernance. Pourtant, deux philosophies d’administration rivalisent pour retenir notre attention : devons-nous construire une bureaucratie confucéenne plus profonde pour relier l’empire, ou réformer la monnaie pour libérer la puissance du commerce basé sur l’argent ?"
 nd_mch.10.a: "Approfondir la bureaucratie confucéenne."
 nd_mch.10.b: "Établissez l’étalon argent."
 nd_mch.11.t: "L'Empire Céleste"
 nd_mch.11.d: "Guangzhou est sécurisée, et avec elle le dernier joyau des réseaux commerciaux chinois. L'Empire céleste s'étend des forêts de Mandchourie jusqu'au delta de la rivière des Perles, englobant la civilisation la plus riche et la plus peuplée de la planète. Deux visions se présentent désormais quant à la manière dont ce colosse va engager le monde : allons-nous construire une marine pour projeter notre puissance à travers les mers, ou devons-nous nous tourner vers l’intérieur pour consolider cette vaste domination en un tout inébranlable ?"
 nd_mch.11.a: "Construisez les flottes de l'Empire Céleste."
 nd_mch.11.b: "Consolidez l’empire de l’intérieur."
 STATIC_MODIFIER_NAME_nd_mch_dest_horse_markets: "Marchés aux chevaux nomades"
 STATIC_MODIFIER_DESC_nd_mch_dest_horse_markets: "Les marchés de chevaux frontaliers canalisent la richesse du commerce de la steppe à travers des échanges contrôlés par les Mandchous, enrichissant les seigneurs de la Bannière tout en réduisant le coût de leur cavalerie."
 STATIC_MODIFIER_NAME_nd_mch_dest_garrison_passes: "Garnison des Passes"
 STATIC_MODIFIER_DESC_nd_mch_dest_garrison_passes: "Les cols de montagne et les passages de rivières de la steppe du nord sont fortifiés et mis en garnison, créant un réseau défensif imprenable surveillé par des agents de renseignement."
 STATIC_MODIFIER_NAME_nd_mch_dest_conquerors_march: "La marche du conquérant"
 STATIC_MODIFIER_DESC_nd_mch_dest_conquerors_march: "Les armées Banner marchent avec l’élan incessant d’une avalanche, leurs lignes de ravitaillement s’étendant à travers les continents. Le prix de cette expansion sans fin est la négligence des préoccupations maritimes."
 STATIC_MODIFIER_NAME_nd_mch_dest_eternal_banner: "La bannière éternelle"
 STATIC_MODIFIER_DESC_nd_mch_dest_eternal_banner: "Les Huit Bannières sont les gardiens éternels de l'ordre des steppes, projetant l'autorité mandchoue par une action décisive rapide et le prestige de l'invincibilité."
 STATIC_MODIFIER_NAME_nd_mch_dest_confucian_bureau: "Bureaucratie confucéenne"
 STATIC_MODIFIER_DESC_nd_mch_dest_confucian_bureau: "Un vaste appareil de fonctionnaires érudits administre l’empire selon les principes confucéens, liant divers peuples sous une culture administrative partagée."
 STATIC_MODIFIER_NAME_nd_mch_dest_silver_standard: "Étalon Argent"
 STATIC_MODIFIER_DESC_nd_mch_dest_silver_standard: "L'économie de l'empire est réformée autour de la monnaie d'argent, stabilisant les prix et renforçant les réseaux commerciaux au prix du recours à des soldats professionnels coûteux."
 STATIC_MODIFIER_NAME_nd_mch_dest_maritime_projection: "Projection maritime"
 STATIC_MODIFIER_DESC_nd_mch_dest_maritime_projection: "L'Empire Céleste construit une marine digne de la plus grande civilisation du monde, projetant sa puissance à travers les mers pour protéger les routes commerciales et affirmer sa souveraineté sur les eaux côtières."
 STATIC_MODIFIER_NAME_nd_mch_dest_imperial_consolidation: "Consolidation Impériale"
 STATIC_MODIFIER_DESC_nd_mch_dest_imperial_consolidation: "L'empire se replie sur lui-même pour perfectionner son administration. La tolérance religieuse et la modernisation militaire unissent le royaume tandis qu’une gouvernance stable réduit la complaisance à l’égard de la prospérité."
 nd_mch_horse_stud: "Haras de chevaux Banner"
 nd_mch_horse_stud_desc: "Un établissement d'élevage géré par l'État produisant les robustes chevaux des steppes qui transportent la cavalerie Banner à travers les vastes territoires de l'empire Mandchou."
 nd_mch_horse_breeding: "Élevage de chevaux"
 nd_mch_horse_breeding_desc: "L'élevage systématique de chevaux de guerre mandchous, combinant la robustesse des chevaux des steppes avec une sélection rigoureuse pour leur force et leur endurance."
 nd_mch_exam_hall: "Salle d'examen impériale"
 nd_mch_exam_hall_desc: "Une grande salle où les candidats passent les examens de la fonction publique impériale, porte d'entrée vers les nominations officielles dans la vaste bureaucratie Qing."
 nd_mch_examination_admin: "Administration des examens"
 nd_mch_examination_admin_desc: "La préparation, l'impression et l'administration sécurisée des examens de la fonction publique, nécessitant de grandes quantités de papier, de textes de référence et de toges officielles."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_mch_bureaucracy_authority: "Appareil double impérial"
 AUTO_MODIFIER_DESC_nd_mch_bureaucracy_authority: "The Aisin-Gioro have erected a Manchu administrative apparatus parallel to the inherited Han ministries. Banners, the Imperial Household Department, and the Lifan Yuan answer to the throne directly, granting three bureaucracy slots."

 mch_eight_banners_bureaucracy: "Offices of the Banner Commanders"
 mch_eight_banners_bureaucracy_desc: "Each of the twenty-four banners, eight Manchu, eight Mongol and eight Han, has a commander who keeps the rolls of its hereditary soldier households: who is born, who is of age to serve, who draws the stipend of silver and rice and who holds banner land. From 1723 the commanders sit in permanent offices in the capital, and the banners answer to the throne and no longer to the princes who once owned them. Rolls that are kept give the dynasty its army and its census at once. Rolls that are neglected fill with absentees who draw pay without service."

 mch_neiwufu_bureaucracy: "Département de la Maison Impériale"
 mch_neiwufu_bureaucracy_desc: "Le Neiwufu, composé de serviteurs Aisin-Gioro (booi) issus des trois bannières supérieures, dirigeait la cour intérieure parallèlement et structurellement au-dessus des Han Six Boards. Elle gérait la Cité interdite, les ateliers impériaux, la bourse privée, le monopole du sel de Yangzhou et l'autorisation des commerçants du canton de Hong : un fisc privé qui contournait le ministère du Revenu et répondait uniquement à l'empereur. Sous Kangxi et Qianlong, elle est devenue la branche la plus puissante de l'administration métropolitaine."

 mch_lifan_yuan_bureaucracy: "Lifan Yuan"
 mch_lifan_yuan_bureaucracy_desc: "La Cour des affaires coloniales, créée en 1638 et élevée au rang de ministère en 1644, gouvernait les sujets non-Han de la dynastie : les ligues de Khalkha et de Mongolie intérieure, le Tibet sous les Dalaï et les Panchen Lamas, les oasis de Tarim et de Zoungharie conquises en 1759 et la frontière de Kyakhta avec la Russie. Il appliquait le registre de la noblesse mongole, supervisait les paiements de favoritisme des lamaïstes et dirigeait la diplomatie impériale des frontières entièrement en dehors de la structure ministérielle Han."

 mch_grand_council_bureaucracy: "Grand Conseil"
 mch_grand_council_bureaucracy_desc: "L'empereur Yongzheng créa le Junji Chu en 1729 en tant que petit conseil de guerre secret pour contourner le Grand Secrétariat pendant les campagnes zunghariennes. Il est devenu l'organe central de prise de décision des Qing : une poignée de princes et de fonctionnaires Han de confiance lisant les mémoriaux du palais, rédigeant des réponses vermillon et signant la volonté de l'empereur dans une politique sans trace dans les archives publiques. Ses membres ne détenaient aucun portefeuille formel, seulement la confiance de l'empereur."

 mch_banner_garrisons_bureaucracy: "Garnisons de bannières"
 mch_banner_garrisons_bureaucracy_desc: "Après 1644, la dynastie a cantonné des garnisons à huit bannières à des points stratégiques du territoire Ming conquis : des villes-bannières fortifiées (Mancheng) à l'intérieur de Pékin, Xi'an, Hangzhou, Nanjing, Jingzhou, Guangzhou et le cœur de la Mandchourie. Le Zhufang Baqi a imposé l'autorité de la dynastie sur la majorité Han et a maintenu les bannières socialement séparées (juridictions séparées, écoles de langues séparées, bassins matrimoniaux séparés) pendant deux siècles et demi."

 mch_marriage_alliance_bureaucracy: "Alliance de mariage Khorchin"
 mch_marriage_alliance_bureaucracy_desc: "Les mariages dynastiques liant les Aisin-Gioro aux Khorchin et à d'autres maisons princières de Mongolie orientale, codifiés dans le kheshig des épouses impériales et les mariages de princesses mongoles à partir de Hong Taiji. L'impératrice Xiaozhuang, une princesse de Khorchin, représentait le système : chaque empereur Qing jusqu'à Qianlong était élevé par une impératrice douairière de sang mongol, et les nobles mongols siégeaient dans la garde impériale et le Lifan Yuan en tant que parents plutôt que sujets."
