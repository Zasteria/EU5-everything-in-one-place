 # ===== Variable tooltips =====
 nd_pon_formed_tt: "La restauration pontique a été proclamée"
 nd_pon_path_a_tt: "Choisissez le destin#bold Restauration romaine#!(Restauration Komnénienne)"
 nd_pon_dest_smyrna_developed_tt: "Smyrna is held by the crown and has at least #bold 44#! development"
 nd_pon_dest_constantinople_developed_tt: "Constantinople is held by the crown and has at least #bold 62#! development"
 nd_pon_dest_trebizond_developed_tt: "Trebizond is held by the crown and has at least #bold 44#! development"
 nd_pon_path_b_tt: "Choisissez le destin#bold Commonwealth de la mer Noire#!(République pontique)"

 # ===== Formation event nd_pon.1 =====
 nd_pon.1.t: "Héritier de la rive pontique"
 nd_pon.1.d: "From the cliff monastery of Sumela on Mount Mela to the silver veins of Argyria, from the harbour of Trebizond to the Pontic-Greek villages of the Caucasian foothills, the Pontic-Greek world is being reassembled. The basileus is to be enthroned in the Hagia Sophia of Trebizond, the heir of Alexios I Komnenos and his Pontic descendants who held this corner of the Roman world for 257 years before Mehmed's siege of 1461.\n\nBut the form of the new realm is contested. The court chronicler Bessarion of Trebizond and the metropolitan of Sumela urge a Komnenian Restoration: the basileus crowned in purple, an imperial liturgy and chrysobull, the silver-mining oligarchs of Argyria as the senatorial class, the kingdom organised as a small-scale basileia. The merchant councils of Trebizond, Sinope, and Kerasounta urge a Pontic Republic: the three urban triads as constitutional partners under royal charter, an autocephalous Pontic Orthodox Church as the political centre, the basileus as a primus inter pares confirmed by the burgher assemblies.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_pon.1.a: "Restauration Comnénienne - la basilée de la rive pontique"
 nd_pon.1.b: "République pontique - le Commonwealth urbain et marchand"

 # ===== Formation timed modifiers =====
 STATIC_MODIFIER_NAME_nd_pon_komnenian_restoration: "Restauration Comnénienne"
 STATIC_MODIFIER_DESC_nd_pon_komnenian_restoration: "Le basileus trône en pourpre dans la basilique Sainte-Sophie de Trébizonde. L'argent d'Argyrie coule dans le fisc impérial, le cérémonial tardif romain est observé, le chrysobull est scellé à l'encre violette. Une petite basileia conserve l'idée impériale sur la rive pontique."

 STATIC_MODIFIER_NAME_nd_pon_pontic_republic: "République pontique"
 STATIC_MODIFIER_DESC_nd_pon_pontic_republic: "Trébizonde, Sinopé et Kerasounta siègent ensemble à l'assemblée bourgeoise. L’Église orthodoxe pontique autocéphale détient le centre politique ; le basileus est confirmé dans ses fonctions par les conseils marchands des trois emporia pontiques."

 # ===== nd_pon.2: Coronation at Trebizond =====
 nd_pon.2.t: "Couronnement à Sainte-Sophie de Trébizonde"
 nd_pon.2.d: "The basileus walks beneath the painted Pantocrator in the Hagia Sophia of Trebizond, the church Manuel I Komnenos raised in 1238. The metropolitan of Trebizond places the diadem on his head, sings the polychronion in Pontic-Greek inflection, and seals the chrysobull in violet. The court is now ceremonial; the question is what to do with the ceremony.\n\nSome of the senate argue for projecting the imperial claim outward: a small basileia speaking peer-to-peer with Constantinople, Venice, and the Caucasian crowns, drawing prestige from the Komnenoid lineage. Others argue for projecting it inward: the diadem becomes the centre of a court of office and rank, binding the Pontic-Greek nobility into a Trapezuntine archontate."
 nd_pon.2.a: "Projeter la revendication impériale vers l'extérieur"
 nd_pon.2.b: "Lier la noblesse par le biais du greffe"

 STATIC_MODIFIER_NAME_nd_pon_imperial_claim: "Revendication impériale des Comnènes"
 STATIC_MODIFIER_DESC_nd_pon_imperial_claim: "Le basileus parle comme un pair des grandes couronnes romaines, latines et caucasiennes. La lignée Komnenoid a du poids à Constantinople, à Venise et à Tbilissi."

 STATIC_MODIFIER_NAME_nd_pon_pontic_archontate: "Archontat Pontique"
 STATIC_MODIFIER_DESC_nd_pon_pontic_archontate: "La noblesse pontique-grecque est liée à une cour de fonction et de rang, tirant satisfaction du cérémonial de la basileia comnénienne."

 # ===== nd_pon.3: The Sumela Endowment =====
 nd_pon.3.t: "La dotation de Sumela"
 nd_pon.3.d: "The basileus's chrysobull is delivered to the abbot of Sumela, the cliff-cut monastery of the Theotokos on Mount Mela above Trabzon, founded under Theodosius I in 386. The chrysobull endows the monastery with revenues from the silver of Argyria, exempts its peasants from the levies, and confirms its possession of the Panagia Sumeliotissa, the icon of the Theotokos that Alexios III Komnenos installed in 1364.\n\nThe abbot writes back to ask what the basileus expects of the endowment. Shall Sumela become a contemplative scriptorium, a Pontic-Greek Mount Athos preserving the icons and chronicles? Or shall it work as a frontier mission, taking in highland villagers, baptising Lazi and Tzanid converts, feeding the Pontic peasantry from its granaries?"
 nd_pon.3.a: "Un scriptorium et une école d'icônes du Mont Pontique"
 nd_pon.3.b: "Une mission frontalière de travail des hauts plateaux pontiques"

 STATIC_MODIFIER_NAME_nd_pon_sumela_scriptorium: "Scriptorium de Sumela"
 STATIC_MODIFIER_DESC_nd_pon_sumela_scriptorium: "Le monastère de la falaise devient le Mont Athos pontique-grec : un scriptorium, une école d'icônes, un centre d'enseignement orthodoxe pontique dont les livres circulent de Sumela à Sinope en passant par Caffa."

 STATIC_MODIFIER_NAME_nd_pon_sumela_frontier: "Mission frontière de Sumela"
 STATIC_MODIFIER_DESC_nd_pon_sumela_frontier: "Les moines de Sumela se rendent dans les hautes terres, baptisant les villageois Lazi et Tzanides et nourrissant la paysannerie pontique avec les greniers du monastère."

 # ===== nd_pon.4: Argyria Silver Strike =====
 nd_pon.4.t: "L'argent d'Argyrie"
 nd_pon.4.d: "The mine-overseers of Argyria and Halybe send word that the deep galleries have struck a fresh seam. The Pontic Alps have not yielded silver in this volume since the days of Mithridates Eupator. Within months the Trapezuntine aspron is restruck heavier; within a year the basileus's customs officers in Trebizond are weighing Italian carracks to make sure they do not undercut the Pontic coin.\n\nThe assayers warn that the rapid output will be inflationary. The treasurers, however, are smiling: this is the moment that finances every project the basileia has put off for a century."
 nd_pon.4.a: "Réamorçage de l'aspron Trapézuntine"

 STATIC_MODIFIER_NAME_nd_pon_argyria_strike: "Frappe d'argent d'Argyria"
 STATIC_MODIFIER_DESC_nd_pon_argyria_strike: "Les veines profondes de l'Argyrie produisent de l'argent dans des volumes jamais vus depuis Mithridates Eupator. Le fisc pontique est plein ; le coût est une certaine inflation à mesure que le nouvel aspron s'installe."

 # ===== nd_pon.5: Compact with the Bagrationi =====
 nd_pon.5.t: "Le Compact avec les Bagrationi"
 nd_pon.5.d: "The Bagrationi king of Georgia receives the Pontic ambassador in the cathedral of Mtskheta. The two crowns share a Christian frontier against the Turkmen beyliks of the upland passes; they share a Komnenoid bloodline three generations deep, since Maria-Despoina of Trebizond married Alexios II Komnenos's heir; and they share a fear that the Pontic shore and the Caucasian valleys will be swallowed piecemeal if they do not act in concert.\n\nThe ambassador returns with two offers laid in parallel. The first is a marriage alliance: the Pontic and Bagrationi houses bound into one legitimacy, the Komnenoid claim and the Bagrationi crown braided permanently. The second is a military league: a joint commitment to campaign together against the beyliks, with shared frontier garrisons in the upland passes."
 nd_pon.5.a: "Une alliance de mariage avec la maison Bagrationi"
 nd_pon.5.b: "Une ligue militaire contre les beyliks des hautes terres"

 STATIC_MODIFIER_NAME_nd_pon_bagrationi_marriage: "Mariage Bagrationi"
 STATIC_MODIFIER_DESC_nd_pon_bagrationi_marriage: "Les maisons Komnenoid et Bagrationi sont liées en une seule légitimité chrétienne frontalière. Les diplomates du basileus parlent avec un poids supplémentaire à Tbilissi, à Erzurum et dans les vallées du Caucase."

 STATIC_MODIFIER_NAME_nd_pon_caucasian_league: "Ligue chrétienne du Caucase"
 STATIC_MODIFIER_DESC_nd_pon_caucasian_league: "Les armées pontique et géorgienne font campagne ensemble contre les beyliks turkmènes des cols des hautes terres. Les garnisons frontalières sont partagées ; la main d’œuvre circule dans les deux sens."

 # ===== nd_pon.6: The Pontic Carrack =====
 nd_pon.6.t: "La première caraque pontique"
 nd_pon.6.d: "The shipyards at the mouth of the Trebizond stream have copied the Genoese carrack from the yards at Caffa, married it to the Pontic galley's deeper draught, and produced something neither Italian nor strictly Trapezuntine. The first vessel sails the Trebizond-Sinope-Caffa circuit under Pontic colours, returning with cargoes of Crimean grain, Tatar furs, and Caucasian wine that the old Pontic galleys could never carry in such volume.\n\nThe basileus's admirals press for a permanent admiralty: a fleet command at Trebizond, paid berthing for Pontic merchants at Sinope and Kerasounta, and a tariff structure that prices Italian carracks out of Pontic waters."
 nd_pon.6.a: "Louez l'Amirauté pontique à Trébizonde"

 STATIC_MODIFIER_NAME_nd_pon_pontic_admiralty: "Amirauté pontique"
 STATIC_MODIFIER_DESC_nd_pon_pontic_admiralty: "Un commandement de flotte siège à Trébizonde. Des caraques pontiques sillonnent le triangle de la mer Noire sous les couleurs pontiques ; les marins et les chantiers navals se multiplient à Sinope et Kerasounta."

 # ===== nd_pon.7: 1461 Averted =====
 nd_pon.7.t: "1461 évité"
 nd_pon.7.d: "Mehmed the Conqueror's army stands before the walls of Trebizond. The siege engines have been rolled across the Pontic Alps from Erzurum; the Ottoman fleet is anchored off Platana. In the historical chronicle the Komnenoi surrendered: David Komnenos walked out under safe-conduct, was deported to Adrianople, and was strangled in 1463 with most of his family. The empire of the Komnenoi-of-Trebizond, founded in 1204, perished in 1461.\n\nNot this time. The walls hold. The relief column from the Caucasian league breaks Mehmed's encirclement; the Pontic carracks burn the Ottoman supply ships at Platana; the cliff monasteries of Sumela become field hospitals. After three months of siege the Ottoman army withdraws across the Pontic Alps. The empire of the Komnenoi has outlived the Roman Constantinople by eight years and counting.\n\nWhat does 1461 averted mean for the kingdom going forward? Some argue for defiance, taking the survival as the foundation of a Pontic-Roman idea that cannot be erased. Others argue for renewal, integrating Constantinopolitan refugees into a Pontic state that knows itself, finally, as the legitimate Roman heir."
 nd_pon.7.a: "Pontic Defiance - l'empire qui n'est pas tombé"
 nd_pon.7.b: "Pont post-impérial - intégrer les réfugiés romains"

 STATIC_MODIFIER_NAME_nd_pon_pontic_defiance: "Défi pontique"
 STATIC_MODIFIER_DESC_nd_pon_pontic_defiance: "L'empire qui n'est pas tombé. Trébizonde se dresse ; le règne des Comnènes ; l'idée romaine a un cœur pontique, défendu par les armes par tous les villageois des Alpes pontiques."

 STATIC_MODIFIER_NAME_nd_pon_post_imperial_pontus: "Pont post-impérial"
 STATIC_MODIFIER_DESC_nd_pon_post_imperial_pontus: "Les réfugiés constantinopolitains affluent dans l’empire pontique. Le royaume les intègre comme l’héritier légitime de l’idée romaine, se sachant finalement comme l’empire qui a survécu."

 # ===== nd_pon.8: The Pontic Phanar =====
 nd_pon.8.t: "Les Phanariotes Pontiques"
 nd_pon.8.d: "A class of bilingual mercantile-administrative families has consolidated itself across the Pontic shore. They were merchants of the Trebizond-Sinope-Caffa triangle a century ago; they are now diplomats, customs officers, financial undersecretaries to the basileus, and translators between Pontic-Greek, Tatar Turkish, Russian, and Italian. The court chronicler calls them the Pontic Phanariots, after the comparable class that grew up around the Patriarchate of Constantinople.\n\nThe basileus's secretaries press for formal recognition: charters for the Pontic Phanariot houses, integration of their networks into the Pontic diplomatic corps, recognition of their schools as the kingdom's secondary educational backbone."
 nd_pon.8.a: "Louez les maisons pontiques Phanariot"

 STATIC_MODIFIER_NAME_nd_pon_phanariot_network: "Réseau Pontique Phanariote"
 STATIC_MODIFIER_DESC_nd_pon_phanariot_network: "Les clans marchands bilingues pontique-grec-turc-russe constituent l'épine dorsale diplomatique du royaume. Leurs réseaux atteignent Constantinople, Moscou, Venise et Le Caire."

 # ===== nd_pon.9: Pontic Megale Idea =====
 nd_pon.9.t: "L’idée du Mégale pontique"
 nd_pon.9.d: "The 19th-century Pontic-Greek awakening has come. The villages of the Pontic Alps, the merchant clans of Trebizond and Sinope, the monks of Sumela and the Cappadocian rock-hewn sanctuaries, and the Caucasian Pontic-Greek diaspora villages have organised themselves into a single national project. The pamphleteers of Trebizond write of a Pontic Megale Idea, distinct from the Constantinopolitan one: the gathering-in of every Pontic-Greek community from the Crimean coast to the Cappadocian uplands.\n\nThe form of the renewed Pontic state is contested. Some call for an Eastern Empire, an Orthodox imperial revival in the Komnenian-Byzantine mould, projecting Pontic-Greek culture across the Black Sea world. Others call for a constitutional Pontic state, drawing on the burgher tradition of Trebizond and Sinope, organised as a parliamentary republic of free Pontic-Greek peoples."
 nd_pon.9.a: "Un empire oriental de renouveau orthodoxe"
 nd_pon.9.b: "Une république constitutionnelle pontique des peuples libres"

 STATIC_MODIFIER_NAME_nd_pon_eastern_empire: "Empire d'Orient"
 STATIC_MODIFIER_DESC_nd_pon_eastern_empire: "Un renouveau impérial orthodoxe dans le moule comnénien-byzantin. La couronne pontique s’étend au-delà de la mer Noire comme alternative chrétienne orientale aux puissances occidentales."

 STATIC_MODIFIER_NAME_nd_pon_pontic_constitution: "Constitution pontique"
 STATIC_MODIFIER_DESC_nd_pon_pontic_constitution: "Une république parlementaire de peuples pontiques-grecs libres. La tradition bourgeoise de Trébizonde et de Sinope devient l'épine dorsale constitutionnelle du nouvel État pontique."

 # ===== Advances =====
 nd_pon_komnenian_coronation: "Couronnement des Comnènes de Trébizonde"
 nd_pon_komnenian_coronation_desc: "Le basileus pontique trône dans la basilique Sainte-Sophie de Trébizonde, soutenant l'idée impériale des Comnènes de Trébizonde qui régnèrent sur la rive pontique de 1204 à 1461."

 nd_pon_sumela_endowment: "Monastère de Sumela"
 nd_pon_sumela_endowment_desc: "Dotez le monastère creusé dans la falaise de la Theotokos Sumela sur le mont Mela, fondé en 386 après JC. Maison mère de la tradition monastique pontique-grecque."

 nd_pon_argyria_tradition: "Exploitations d'argent d'Argyrie"
 nd_pon_argyria_tradition_desc: "Ouvrez les filons d'argent d'Argyria et d'Halybe dans les Alpes pontiques, les anciennes mines qui alimentaient la pièce d'aspron trapézuntine."

 nd_pon_akrites_tradition: "Akrites pontiques"
 nd_pon_akrites_tradition_desc: "Infanterie akritique garde-frontière des Alpes pontiques : des villageois de montagne coriaces en garnison dans les cols d'altitude."

 nd_pon_pontic_liburnae: "Liburnes pontiques"
 nd_pon_pontic_liburnae_desc: "Le successeur de la mer Noire de la liburna romaine tardive, une petite galère d'escorte rapide sillonnant le circuit Trébizonde-Sinope-Caffa."

 nd_pon_pontic_emporia: "Emporia marchande pontique"
 nd_pon_pontic_emporia_desc: "Trebizond, Sinope, and Kerasounta as autonomous merchant communes under royal charter, the urban triad of the Pontic shore."

 nd_pon_cappadocian_sanctuary: "Sanctuaires creusés dans le roc de Cappadoce"
 nd_pon_cappadocian_sanctuary_desc: "L'école de Goreme et Soganli composée de chapelles creusées dans des grottes, reconverties par l'État pontique en tant que points d'ancrage culturels de la frontière sud."

 nd_pon_argyria_mines: "Expansion minière d'Argyria"
 nd_pon_argyria_mines_desc: "Expansion permanente de l’économie minière d’argent des Alpes pontiques. La monnaie aspron est refrappée et le fisc impérial rempli."

 nd_pon_caucasian_compact: "Pacte chrétien du Caucase"
 nd_pon_caucasian_compact_desc: "Pacte diplomatique avec les Bagrationi de Géorgie et la maison arménienne Mamikonid-Bagratuni, scellant la frontière chrétienne du Caucase."

 nd_pon_trapezitai_levy: "Trapèze pontique"
 nd_pon_trapezitai_levy_desc: "Cavalerie légère de la côte pontique : éclaireurs, pillards, tirailleurs à cheval le long de la route Trébizonde-Sinope."

 nd_pon_pontic_vernacular: "Pontique-grec vernaculaire"
 nd_pon_pontic_vernacular_desc: "Le dialecte pontique-grec, distinct du grec constantinopolitain, devient la langue de la chronique judiciaire et du scriptorium de Sumela."

 nd_pon_pontic_carrack: "Caraque pontique"
 nd_pon_pontic_carrack_desc: "Une caraque de la mer Noire mariant la tradition des galères trapézuntines avec un gréement italien copié des Génois de Caffa."

 nd_pon_imperial_court_revival: "Cour impériale comnénienne"
 nd_pon_imperial_court_revival_desc: "La cour cérémonielle capitale des Comnènes-de-Trébizonde : Silentiarii, chrysobulls, les formes bibelots de l'adresse romaine tardive."

 nd_pon_pontic_triangle: "Commerce du Triangle Pontique"
 nd_pon_pontic_triangle_desc: "Le triangle Trébizonde-Sinope-Caffa s'est lié en une seule circulation de marchés pontiques-grecs, génois et tatars."

 nd_pon_autocephaly: "Autocéphalie orthodoxe pontique"
 nd_pon_autocephaly_desc: "L'Église orthodoxe pontique revendique son indépendance administrative de Constantinople, centrée sur le siège métropolitain de Trébizonde."

 nd_pon_komnenoid_diplomacy: "Réseaux diplomatiques komnénoïdes"
 nd_pon_komnenoid_diplomacy_desc: "La revendication des Komnénoïdes devient une monnaie diplomatique : mariages cousins ​​​​avec les tribunaux trapézuntines, italiennes, tatares, caucasiennes et grecques de la mer Égée."

 nd_pon_1461_averted: "1461 évité"
 nd_pon_1461_averted_desc: "Le siège de Trébizonde par Mehmed le Conquérant est brisé. L'empire des Comnènes de Trébizonde survit à la Constantinople romaine."

 nd_pon_kapheneia: "Le Kaphénéion pontique"
 nd_pon_kapheneia_desc: "La taverne-café du village pontique-grec : raki trapézuntin, vin pontique, l'échange d'actualités de chaque place de village."

 nd_pon_confessional_pontus: "Cour confessionnelle pontique"
 nd_pon_confessional_pontus_desc: "L’Église orthodoxe pontique autocéphale régularise les tribunaux confessionnels, protégeant l’orthodoxie contre l’influence latine, arménienne et soufie."

 nd_pon_stratiotai: "Stratiotai pontique"
 nd_pon_stratiotai_desc: "La tradition de l'infanterie blindée comnénienne renaît : stratiotai de la fin du Moyen Âge de la noblesse pontique-grecque et des villageois libres."

 nd_pon_pontic_factors: "Facteurs marchands pontiques"
 nd_pon_pontic_factors_desc: "Les marchands pontiques-grecs opèrent à Venise, Gênes, Le Caire et Alexandrie, reliant le royaume au commerce méditerranéen et levantin."

 nd_pon_pontic_phanariots: "Phanariotes pontiques"
 nd_pon_pontic_phanariots_desc: "Une classe administrative-mercantile bilingue pontique-grec-turc-russe, épine dorsale diplomatique et commerciale du royaume."

 nd_pon_pontic_ship_of_line: "Navire pontique de la ligne"
 nd_pon_pontic_ship_of_line_desc: "Navire de ligne de la mer Noire construit dans les chantiers de Trébizonde, la tradition navale pontique mature se concrétise."

 nd_pon_pontic_absolutism: "Absolutisme centralisé pontique"
 nd_pon_pontic_absolutism_desc: "Le basileus règne à travers la cour comnénienne rénovée : un analogue de la mer Noire des projets de centralisation pétersbourgeois ou versaillais."

 nd_pon_pontic_roads: "Routes alpines pontiques"
 nd_pon_pontic_roads_desc: "Des routes aménagées à travers les Alpes pontiques, rendant l'argent de l'Argyrie, le bois des forêts pontiques et les céréales du Caucase accessibles depuis Trébizonde."

 nd_pon_pontic_megale: "Idée de mégale pontique"
 nd_pon_pontic_megale_desc: "L'éveil au XIXe siècle de la diaspora pontique-grecque en un projet national unique, distinct de l'idée de la mégale constantinopolitaine."

 nd_pon_pontic_industry: "Révolution industrielle pontique"
 nd_pon_pontic_industry_desc: "Les premiers moulins mécanisés le long des rivières des Alpes pontiques, l'affinage de l'argent d'Argyria, le chantier naval de Trébizonde."

 nd_pon_pontic_constitutional: "Mouvement constitutionnel pontique"
 nd_pon_pontic_constitutional_desc: "La classe Phanariote, les guildes marchandes de Trébizonde et les réseaux monastiques Sumela réforment le royaume en un État pontique constitutionnel."

 # ===== Buildings =====
 nd_pon_sumela_monastery: "Monastère de Sumela"
 nd_pon_sumela_monastery_desc: "Le monastère de Theotokos Sumela, taillé dans une falaise, sur le mont Mela, au-dessus de Trabzon. Fondée en 386 après JC ; maison mère de la tradition monastique pontique-grecque."

 nd_pon_argyria_silver_mine: "Mine d'argent d'Argyrie"
 nd_pon_argyria_silver_mine_desc: "Les profondes exploitations d'argent d'Argyria et d'Halybe dans les Alpes pontiques. Source de l'argent qui soutenait l'aspron Trapezuntine."

 nd_pon_rock_hewn_sanctuary: "Sanctuaire creusé dans le roc"
 nd_pon_rock_hewn_sanctuary_desc: "Sanctuaire chrétien rupestre de tradition pontique-cappadocienne : cellules, chapelles et réfectoires creusés dans le tuf volcanique."

 nd_pon_komnenian_court: "Cour impériale comnénienne"
 nd_pon_komnenian_court_desc: "Le cérémonial de la cour trapezuntine des Comnènes de Trébizonde, préservant la basileia romaine tardive de la capitale."

 nd_pon_kapheneion: "Kaphénéion pontique"
 nd_pon_kapheneion_desc: "Taverne-café rural pontique-grec, le bureau d'échange de nouvelles du village. Distille le raki Trapezuntine à partir de fruits et de vins locaux."

 # ===== Building PMs =====
 nd_pon_sumela_office: "Office liturgique de Sumela"
 nd_pon_sumela_office_desc: "Bougies en cire d'abeille, papier et livres pour la liturgie pontique-grecque, copiés et reliés au scriptorium de la falaise."

 nd_pon_argyria_extraction: "Extraction d'argent d'Argyrie"
 nd_pon_argyria_extraction_desc: "Extraction en profondeur du minerai d'argent des veines d'Argyria, affiné avec des outils en pierre et des forges pontiques."

 nd_pon_sanctuary_office: "Liturgie du sanctuaire cappadocien"
 nd_pon_sanctuary_office_desc: "La poterie, le papier et la cire d'abeille des chapelles rupestres creusées dans la roche de la Cappadoce."

 nd_pon_komnenian_ceremonial: "Cérémonie de la cour comnénienne"
 nd_pon_komnenian_ceremonial_desc: "Tissu fin, papier, cire d'abeille et livres pour les Silentiarii et les chrysobulls de la cour pontique."

 nd_pon_kapheneion_distilling: "Distillation pontique du Raki"
 nd_pon_kapheneion_distilling_desc: "Raki trapézuntin distillé à partir de vin pontique et de fruits du verger, pilier du kapheneion du village."

 # ===== Units =====
 a_nd_pon_akrites: "Akrites pontiques"
 a_nd_pon_akrites_desc: "Infanterie frontière akritique des Alpes pontiques : villageois coriaces des hautes terres, spécialistes de la défense, maîtres des cols rocheux."

 a_nd_pon_trapezitai: "Trapèze pontique"
 a_nd_pon_trapezitai_desc: "Tirailleurs à cheval de la côte pontique : éclaireurs rapides et estafettes le long de la route Trébizonde-Sinope."

 a_nd_pon_stratiotai: "Stratiotai pontique"
 a_nd_pon_stratiotai_desc: "Infanterie blindée de la fin du Moyen Âge de la noblesse pontique-grecque et des villageois libres, équipée du fer de l'Argyrie et de la discipline des traités militaires de Sumela."

 n_nd_pon_trapezuntine_liburnian: "Liburnien trapézuntin"
 n_nd_pon_trapezuntine_liburnian_desc: "Descendant de la mer Noire du liburna romain tardif : petit, rapide, utilisé comme escorte de convoi de céréales et comme bateau d'expédition."

 n_nd_pon_pontic_carrack: "Caraque pontique"
 n_nd_pon_pontic_carrack_desc: "Caraque de la Mer Noire à coque Trapézuntine et gréement italien, bête de somme du circuit Trébizonde-Sinope-Caffa."

 n_nd_pon_pontic_ship_of_line: "Navire pontique de la ligne"
 n_nd_pon_pontic_ship_of_line_desc: "Un navire de ligne de la mer Noire construit dans les chantiers de Trébizonde, avec une coque extra-épaisse pour la houle pontique."

 # ===== Levies =====
 levy_nd_pon_akrites: "Prélèvement pontique d'Akrites"
 levy_nd_pon_akrites_desc: "Levée d'infanterie frontalière des montagnes akritiques dans les villages des hautes terres des Alpes pontiques."

 levy_nd_pon_trapezitai: "Prélèvement trapézoïdal pontique"
 levy_nd_pon_trapezitai_desc: "Levée de cavalerie légère issue de la petite noblesse de la rive pontique et des contreforts du Caucase."

 # ===== New buildings (added in fix pass) =====
 nd_pon_pontic_funduq: "Funduq pontique"
 nd_pon_pontic_funduq_desc: "Entrepôt marchand urbain pontique-grec : stockage en vrac de céréales, de vin, d'argent et de fourrures pour le triangle Trébizonde-Sinope-Caffa."

 nd_pon_pontic_bank_house: "Maison de la banque pontique"
 nd_pon_pontic_bank_house_desc: "Maison financière pontique-grecque de l'époque des Phanariotes : clans marchands mettant en commun leurs capitaux, émettant des lettres de change, accordant des crédits au basileus."

 nd_pon_trebizond_arsenal: "Arsenal de Trébizonde"
 nd_pon_trebizond_arsenal_desc: "Le chantier-arsenal naval à l'embouchure du ruisseau de Trébizonde, réaménagé en base navale en activité pour le navire pontique de ligne."

 nd_pon_argyria_refining_works: "Travaux de raffinage d'Argyria"
 nd_pon_argyria_refining_works_desc: "Travaux de raffinage industriel tardif à Argyria : extraction mécanisée et raffinage de l'acier à partir du fer Pontique et du charbon d'Erzurum."

 # New PMs
 nd_pon_funduq_maintenance: "Opérations Funduq"
 nd_pon_funduq_maintenance_desc: "Tissu, papier et poterie pour les employés et l'entrepôt du magasin marchand pontique."

 nd_pon_bank_house_maintenance: "Opérations bancaires"
 nd_pon_bank_house_maintenance_desc: "Papier, livres et draps fins pour les banques Phanariot et leurs lettres de change."

 nd_pon_arsenal_maintenance: "Opérations de l'Arsenal de Trébizonde"
 nd_pon_arsenal_maintenance_desc: "Bois d'œuvre, fournitures navales et outils pour le chantier naval de Trébizonde."

 nd_pon_refining_steel: "Raffinage de l'acier Argyria"
 nd_pon_refining_steel_desc: "Le fer et le charbon étaient transformés en acier pontique dans les raffineries mécanisées d'Argyrie."

 # New advances (added in fix pass)
 nd_pon_admiralty_reform: "Réforme de l'Amirauté pontique"
 nd_pon_admiralty_reform_desc: "Commandement naval centralisé à Trébizonde, rénovation des chantiers navals et constitution des équipages permanents de la flotte des navires pontiques de ligne."

 nd_pon_pontic_mining_revival: "Reprise de l’exploitation minière alpine pontique"
 nd_pon_pontic_mining_revival_desc: "L'exploitation minière et le raffinage modernisés dans les Alpes pontiques sont le moteur de l'économie pontique de la fin de l'industrie : le fer, le cuivre, l'argent et l'acier proviennent des exploitations des hautes terres."

 # ==========================================================================
 # ===== DESTINY TREE LOCALIZATION =====
 # ==========================================================================

 # ----- Destiny advance names and descriptions -----
 nd_pon_destiny: "Le destin pontique"
 nd_pon_destiny_desc: "La restauration pontique est proclamée. La basileia de Trébizonde trace désormais son chemin : la restauration romaine comnénienne, ou le Commonwealth de la mer Noire. Choisissez à la formation ; le chemin se déroule ensuite en trois étapes."

 nd_pon_dest_anatolikon: "La reconquête de l'Anatolikon"
 nd_pon_dest_anatolikon_desc: "Reach back from the Pontic shore into the old Anatolian heartland. Reconquer Bursa (Prousa) and Iznik (Nicaea), the cradle cities of late-Roman Asia Minor and the seat of the second Roman exile after 1204. The crown's prestige must be worthy of the deed."

 nd_pon_dest_aegean_strategos: "Le Stratège égéen"
 nd_pon_dest_aegean_strategos_desc: "Push the Komnenian frontier into the Aegean and the European Balkans. Hold Smyrna, Chios, and Edirne; raise the Trapezitai to ride the new frontier and build Smyrna up as the fleet's Aegean harbour. The Pontic-Roman crown now speaks as a peer of all the western powers."

 nd_pon_dest_nea_rhomaion: "Nea Rhomaion: New Rome Restored"
 nd_pon_dest_nea_rhomaion_desc: "The Komnenian basileus returns from Pontic exile to the Queen of Cities. Hold Constantinople, Thessaloniki, and Athens under one Roman crown; fill the half empty City within its walls until it is twice what it was; reach 75 prestige and 3000 gold. Unlocks the Hagia Sophia Nea Rhomaion in the capital."

 nd_pon_dest_pontic_network: "Le réseau commercial pontique"
 nd_pon_dest_pontic_network_desc: "Relier le littoral de la mer Noire en une seule circulation marchande dirigée par le Pontique. Tenez Tana sur la mer d'Azov et Cetatea Alba à l'embouchure du Dniestr ; avoir de la soie au marché de Trébizonde ; atteindre 1000 pièces d'or. La rive pontique devient l'échange central du monde de la mer Noire."

 nd_pon_dest_caucasian_compact_full: "Le Pacte du Caucase dans son intégralité"
 nd_pon_dest_caucasian_compact_full_desc: "La couronne Bagrationi de Géorgie et les royaumes d'Imereti et de Lazica se regroupent dans le Commonwealth pontique. Tenez Tbilissi et Kutaisi ; adopter l’institution bancaire ; atteindre 2000 pièces d'or."

 nd_pon_dest_council_of_faithful: "Le Conseil des Fidèles"
 nd_pon_dest_council_of_faithful_desc: "The Black Sea Commonwealth at its full extent. Hold Sukhumi, Batumi, and Poti to bind the western Caucasian shore; embrace the Renaissance that Bessarion of Trebizond carried west; build Trebizond up to twice what it was and raise gold to 3000. A federated Orthodox commonwealth of Greek-Caucasian-Pontic peoples. Unlocks the Pontic Council Hall in the capital."

 # ----- Destiny event nd_pon.10 (root) -----
 nd_pon.10.t: "Le destin pontique"
 nd_pon.10.d: "The chrysobull of formation has been sealed in violet, the basileus is enthroned, and the new banner of Pontus flies above Trebizond. Now the kingdom must look forward. The senate-chronicle of Bessarion records two great destinies open to the Pontic-Greek house: the slow march of the Komnenoi-of-Trebizond back to the Queen of Cities, gathering all that was lost in 1204 and 1453, or the patient weaving of a Black Sea Commonwealth: a federated Orthodox compact of Pontic, Caucasian, and frontier peoples around the central shore.\n\nThe choice has been made; what follows is the long work of bringing the destiny into being."
 nd_pon.10.a: "Laissez le destin se dérouler."

 # ----- Destiny event nd_pon.11 (Path A Stage 1) -----
 nd_pon.11.t: "L'Anatolikon récupéré"
 nd_pon.11.d: "Des colonnes pontiques descendent de Bursa et d'Iznik. Les anciens thèmes romains d'Anatolikon et d'Opsikion se retrouvent sous les bannières pontiques-comnéniennes. Le premier rêve de la restauration romaine se réalise : l'empire de la rive pontique s'étend désormais jusqu'au cœur anatolien de la maison romaine tardive."
 nd_pon.11.a: "Les thèmes anatoliens sont à nouveau présents."

 # ----- Destiny event nd_pon.12 (Path A Stage 2) -----
 nd_pon.12.t: "La portée égéenne"
 nd_pon.12.d: "Smyrne, Chios et Edirne arborent les couleurs pontiques. La basileia comnénienne n'est plus une curiosité pontique mais une puissance romaine de la mer Égée et des Balkans. La cour de Trébizonde débat de la manière de projeter la nouvelle force : par mer, avec une thalassocratie pontique de caraques et de galères dirigeant les îles de la mer Égée : ou par terre, avec l'armée de campagne stratiotai devenant un corps romain permanent sur les théâtres occidentaux."
 nd_pon.12.a: "Une thalassocratie pontique de la mer Égée."
 nd_pon.12.b: "Un corps de campagne stratégique permanent."

 # ----- Destiny event nd_pon.13 (Path A Stage 3, capstone) -----
 nd_pon.13.t: "Nea Rhomaion: New Rome Restored"
 nd_pon.13.d: "The Komnenian basileus rides into Constantinople through the Golden Gate. The Hagia Sophia is reconsecrated under the Pontic-Orthodox rite; the chrysobull of New Rome is sealed in violet ink. Thessaloniki and Athens kneel under the same Roman crown. The empire of the Komnenoi-of-Trebizond, founded in Pontic exile in 1204, has restored the Roman idea in fact as well as in name.\n\nWhat shape does the restored Rome take? The court chronicler argues for Basileus Rhomaion: the empire fully restored, the basileus speaking as Caesar Augustus from the cathedra of Justinian. The metropolitans argue for Pax Komnenia: a settled Roman order, a Komnenian peace across the eastern Mediterranean, the empire's energies turning to consolidation."
 nd_pon.13.a: "Basileus Rhomaion : César Auguste restauré."
 nd_pon.13.b: "Pax Komnenia : la paix comnénienne."

 # ----- Destiny event nd_pon.14 (Path B Stage 1) -----
 nd_pon.14.t: "Le réseau commercial de la mer Noire"
 nd_pon.14.d: "Tana sur la mer d'Azov et Cetatea Alba à l'embouchure du Dniestr rejoignent la circulation commerciale pontique. Des caraques pontiques sillonnent le triangle de la mer Noire d'un bout à l'autre ; le marché de Trébizonde est le lieu d'échange central de tous les produits de la mer Noire. Les premières fondations du Commonwealth de la mer Noire sont posées."
 nd_pon.14.a: "La mer Noire est une mer pontique."

 # ----- Destiny event nd_pon.15 (Path B Stage 2) -----
 nd_pon.15.t: "Le Pacte du Caucase dans son intégralité"
 nd_pon.15.d: "The Bagrationi king of Georgia signs the Pontic compact in the cathedral of Mtskheta; the Imeretian crown and the Lazic frontier-lords follow. Tbilisi and Kutaisi join the Pontic council. The Caucasian-Christian frontier is folded into the Black Sea Commonwealth as full partners.\n\nWhat shape does the Caucasian-Pontic union take? The court favours a Caucasian Dynasty: Bagrationi-Komnenoid blood braided into one ruling house, a single mercantile-Christian dynasty governing both shores. The merchant councils favour a Caucasian League: a federated league of Pontic-Caucasian trading cities, governed by an annual council at Trebizond, with no single dynasty above the burgher delegates."
 nd_pon.15.a: "Une dynastie dirigeante caucasienne-pontique."
 nd_pon.15.b: "Une ligue fédérée caucasienne-pontique."

 # ----- Destiny event nd_pon.16 (Path B Stage 3, capstone) -----
 nd_pon.16.t: "Le Conseil des Fidèles"
 nd_pon.16.d: "The Black Sea Commonwealth assembles its first full council at Trebizond. The burgher delegates of Sinope, Caffa, Tana, and the new Caucasian member-cities of Sukhumi, Batumi, and Poti sit alongside the metropolitan of Trebizond, the abbot of Sumela, and the basileus's chairman. The federated Orthodox commonwealth of Greek-Caucasian-Pontic peoples is now a recognised polity.\n\nWhat form does the Council take? The metropolitans urge an Orthodox Council: an explicitly confessional body, the Pontic answer to the Council of Trent. The Phanariot houses urge a pluralist Phanariot Commonwealth: a council where confessional questions are bracketed and Pontic-Greek diaspora administrators serve as the spine of governance."
 nd_pon.16.a: "Un Conseil orthodoxe des fidèles."
 nd_pon.16.b: "Un Commonwealth Phanariote pluraliste."

 # ----- Destiny timed modifiers -----
 STATIC_MODIFIER_NAME_nd_pon_dest_aegean_thalassocracy: "Thalasscratie égéenne"
 STATIC_MODIFIER_DESC_nd_pon_dest_aegean_thalassocracy: "Des caraques et des galères pontiques envahissent les îles de la mer Égée. La portée de l’empire est une portée navale ; le basileus règne depuis un pont autant que depuis un trône."

 STATIC_MODIFIER_NAME_nd_pon_dest_strategoi_legacy: "L'héritage stratégique"
 STATIC_MODIFIER_DESC_nd_pon_dest_strategoi_legacy: "Les stratiotai pontiques deviennent un corps de campagne romain permanent. Le recrutement est régulier, le moral remonte rapidement, l'avantage de la cavalerie s'affine."

 STATIC_MODIFIER_NAME_nd_pon_dest_basileus_rhomaion: "Basileus Rhomaion"
 STATIC_MODIFIER_DESC_nd_pon_dest_basileus_rhomaion: "Le basileus parle comme César Auguste depuis la cathédrale de Justinien dans la basilique Sainte-Sophie. L'empire est entièrement restauré. Le coût est élevé : le nouveau fisc gonfle à mesure que l’argent est refait pour le cérémonial impérial."

 STATIC_MODIFIER_NAME_nd_pon_dest_pax_komnenia: "Pax Comnénie"
 STATIC_MODIFIER_DESC_nd_pon_dest_pax_komnenia: "La paix comnénienne s’installe dans toute la Méditerranée orientale. Le territoire ami restaure les troupes usées ; l'armée intérieure apprend à supporter de longues campagnes ; les peuples romains acceptent une guerre prolongée pour le bien de l’empire."

 STATIC_MODIFIER_NAME_nd_pon_dest_caucasian_dynasty: "Dynastie caucasienne-pontique"
 STATIC_MODIFIER_DESC_nd_pon_dest_caucasian_dynasty: "La lignée Bagrationi-Komnenoid lie les deux couronnes en une seule maison dirigeante. Les marchands pontiques trouvent un accueil plus amical à l'étranger ; les provinces dévastées se rétablissent plus rapidement sous la norme dynastique."

 STATIC_MODIFIER_NAME_nd_pon_dest_caucasian_league: "Ligue caucasienne-pontique"
 STATIC_MODIFIER_DESC_nd_pon_dest_caucasian_league: "Ligue fédérée de villes commerçantes pontiques-caucasiennes, gouvernée par un conseil annuel à Trébizonde. La capacité marchande de chaque ville membre augmente ; les réseaux maritimes vont plus loin que jamais."

 STATIC_MODIFIER_NAME_nd_pon_dest_council_orthodox: "Conseil orthodoxe des fidèles"
 STATIC_MODIFIER_DESC_nd_pon_dest_council_orthodox: "Le Conseil des fidèles en tant qu'organe confessionnel explicitement orthodoxe. Les communautés hérétiques sont tolérées dans le cadre du Commonwealth ; les effectifs des garnisons augmentent régulièrement ; les mouvements de prétendants dépérissent sous la légitimité conciliaire."

 STATIC_MODIFIER_NAME_nd_pon_dest_council_phanar: "Commonwealth Phanariote"
 STATIC_MODIFIER_DESC_nd_pon_dest_council_phanar: "Le Conseil des Croyants comme gouvernance phanariote pluraliste : les administrateurs de la diaspora pontique-grecque sont l'épine dorsale du Commonwealth. Les postes de gouverneur naval se multiplient ; les prélèvements recrutent plus rapidement. Le coût : la politique du conseil détourne l’attention de la lenteur de la formation des généraux."

 # ----- Destiny capstone buildings -----
 nd_pon_hagia_sophia_nea_rhomaion: "Sainte-Sophie Nea Rhomaion"
 nd_pon_hagia_sophia_nea_rhomaion_desc: "La grande église de Constantinople récupérée, restaurée pour devenir le siège de la basileia comnénienne de la Nouvelle Rome. La cathédrale de Justinien est à nouveau occupée par un empereur romain, cette fois de la lignée pontique-comnénoïde."

 nd_pon_nea_rhomaion_ceremonial: "Nouveau cérémonial impérial romain"
 nd_pon_nea_rhomaion_ceremonial_desc: "Tissus fins, papiers, livres, cire d'abeille et encens pour le cérémonial restauré de la Nouvelle Rome : les chrysobulles, les polychronies, les grandes liturgies des cathédrales."

 nd_pon_council_hall: "Salle du Conseil pontique"
 nd_pon_council_hall_desc: "La salle du conseil du Commonwealth de la mer Noire : une salle du conseil marchand sur le modèle Phanariot où les délégués bourgeois de chaque ville membre se réunissent sous la présidence pontique."

 nd_pon_council_hall_clerks: "Greffiers de la salle du conseil"
 nd_pon_council_hall_clerks_desc: "Papier, livres et tissus fins pour le secrétariat du Conseil des Fidèles : des commis bilingues copiant des procès-verbaux en mains grecques, caucasiennes et italiennes."


 # ----- Bureaucracy authority (auto_modifier) -----
 AUTO_MODIFIER_NAME_nd_pon_bureaucracy_authority: "Autorité impériale komnénoïde"
 AUTO_MODIFIER_DESC_nd_pon_bureaucracy_authority: "The restored Komnenoid imperial household at Trebizond inherits the institutional apparatus of the Trapezuntine Empire: the autocephalous Pontic synod at Sumela, the multilingual Logothesion, the Argyria silver-mining authority, and the Caffa-Trebizond mercantile council. Two of the empire's four institutions can be kept standing at once."

 # ----- Bureaucracies -----
 pon_synodos_of_the_pontic_church_bureaucracy: "Synodes de l'Église pontique"
 pon_synodos_of_the_pontic_church_bureaucracy_desc: "Le synode orthodoxe pontique autocéphale, dirigé par le métropolite de Trébizonde, s'est réuni au monastère-falaise de Sumela au-dessus de la vallée des Pyxites. Le synode a réuni les évêques de Trébizonde, Kerasounta, Sinope et les hégumènes de Sumela, Vazelon et Peristera aux côtés des sièges orthodoxes du Caucase de Lazique et d'Abkhazie. Il a baptisé ses propres évêques, conservé un calendrier distinct honorant les saints Eugène et Aquila de Trébizonde et autorisé les ateliers d'icônes de l'école pontique. Son autonomie par rapport à Constantinople était antérieure à 1204 et a survécu à l'empire d'une génération."

 pon_logothesion_of_trebizond_bureaucracy: "Logothésion de Trébizonde"
 pon_logothesion_of_trebizond_bureaucracy_desc: "La chancellerie impériale des Comnènes-de-Trébizonde, calquée sur la tradition logothète constantinopolitaine mais adaptée à un environnement diplomatique polyglotte. Sous les protonotarios et les megas logariastes, il émettait des chrysobulls dans la main de la chancellerie trapézuntine et rédigeait de la correspondance en grec, persan, turc mongol et latin italien aux Ilkhans, aux sultans d'Aqquyunlu, aux podestats génois, aux bailos vénitiens et aux lignes collatérales comnéniennes. Ses gardiens des parchemins récitaient la polychronie comnénienne à chaque audience, liant un petit empire à un vaste réseau diplomatique."

 pon_argyria_mint_bureaucracy: "Autorité de la Monnaie et des Mines d'Argyria"
 pon_argyria_mint_bureaucracy_desc: "L'appareil coordonné d'extraction et de frappe de l'argent de l'empire trapézuntin. Les mines d'Argyria dans les Alpes pontiques au sud de Tripolis (Gumushane moderne, la maison de l'argent) fournissaient des lingots à la Monnaie impériale de Trébizonde, qui frappait l'aspron-trachy et l'aspron-komnenaton en argent en émissions continues de haute finesse à partir du XIIIe siècle. Le despote ton metallon relevait directement de la maison comnénienne ; L'argent trapézuntin circulait comme moyen standard du commerce de la mer Noire, accepté à Caffa, Sinope, Tana et chez les beyliks anatoliens."

 pon_caffa_trebizond_council_bureaucracy: "Conseil Mercantile de Caffa-Trébizonde"
 pon_caffa_trebizond_council_bureaucracy_desc: "Le conseil permanent des principales familles marchandes pontiques-italiennes-caffan réglementant le commerce de la mer Noire, les conflits de prises, les incidences douanières et les escortes de convois. Les lignes archontico-mercantiles pontiques (Tzanichites, Skouterides, Mesarites, Doranites) côtoyaient les maisons génoises-Caffan (Gattilusio, Centurione, Di Negro) et les familles de marchands grecs sinopés. Le conseil se réunissait de façon saisonnière à Trébizonde et à Caffa sous la présidence conjointe trapézuntine-génoise, fixait les droits du kommerkion sur le trafic de céréales, de poisson salé, de caviar, d'alun, de soie et d'esclaves, et arbitrait les cas de prix interurbains. C'est l'antécédent trapézuntin du dernier Commonwealth marchand Phanariot."
