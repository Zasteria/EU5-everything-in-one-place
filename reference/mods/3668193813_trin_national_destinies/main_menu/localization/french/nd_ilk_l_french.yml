l_french:
 STATIC_MODIFIER_NAME_nd_scourge_of_the_caliphate: "Fléau du Califat"
 STATIC_MODIFIER_DESC_nd_scourge_of_the_caliphate: "Dans la tradition de Hulegu, qui renversa le califat abbasside et noya Bagdad dans le sang, l’Ilkhanat sera un instrument de conquête. La machine de guerre mongole, perfectionnée au fil de générations de guerres dans les steppes, balayera toute résistance devant elle."
 STATIC_MODIFIER_NAME_nd_persianate_khanate: "Khanat persan"
 STATIC_MODIFIER_DESC_nd_persianate_khanate: "Suivant la sagesse de Ghazan Khan et de son vizir Rashid al-Din, l'Ilkhanate embrasse la tradition administrative perse sophistiquée. En synthétisant les prouesses militaires mongoles avec la gouvernance, la tolérance et l’érudition perses, nous forgeons un royaume plus grand que l’une ou l’autre tradition à elle seule."
 STATIC_MODIFIER_NAME_nd_ilk_faith_of_the_ilkhan: "Foi de l'Ilkhan"
 STATIC_MODIFIER_DESC_nd_ilk_faith_of_the_ilkhan: "La conversion publique d'Ilkhan a uni les divers peuples du royaume sous une foi commune, conférant une légitimité à la domination mongole et ouvrant de nouveaux canaux d'échange culturel."
 STATIC_MODIFIER_NAME_nd_ilk_universal_chronicle: "La Chronique universelle"
 STATIC_MODIFIER_DESC_nd_ilk_universal_chronicle: "L’achèvement du Jami al-Tawarikh, l’œuvre la plus ambitieuse jamais entreprise dans l’histoire du monde, a fait de l’Ilkhanat un phare du savoir. Les chercheurs du monde entier sont attirés par nos bibliothèques."
 nd_ilk.1.t: "L'Ilkhanat restauré"
 nd_ilk.1.d: "The fractured remnants of Hulegu's domain are united once more beneath a single banner. From the highlands of Armenia to the Persian Gulf, from the banks of the Tigris to the mountains of Khorasan, the Ilkhanate stands restored: the westernmost arm of the Mongol world empire.\n\nBut what manner of state shall this be? The old ways of the steppe, the thundering cavalry, the relentless advance, the sacking of cities that dare resist, still course through our veins. Yet around us lies Persia, with its ancient bureaucracies, its scholars and merchants, its traditions of tolerance and learning stretching back millennia.\n\nShall we be conquerors, as Hulegu was when he destroyed Baghdad? Or shall we be builders, as Ghazan was when he reformed the realm and embraced its peoples?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ilk.1.a: "Nous sommes le tourbillon de la steppe."
 nd_ilk.1.b: "Nous sommes les héritiers des deux mondes."
 nd_ilk.2.t: "Le Khan embrasse la foi"
 nd_ilk.2.d: "For decades, the question of religion has plagued the Ilkhanate. The early Ilkhans flirted with Nestorian Christianity, Buddhism, and shamanism, while ruling over a vast Muslim population that viewed them as heathen invaders. Now, following the example of Mahmud Ghazan, the Ilkhan has publicly embraced Islam, not as an act of spiritual conviction alone, but as a masterstroke of political pragmatism.\n\nThe conversion transforms the very nature of Ilkhanid rule. No longer foreign overlords imposed by the sword, the Khans become legitimate Muslim sovereigns in the eyes of their subjects. Mosques are repaired, Islamic law finds its place alongside the Yasa, and the ulama are drawn into the machinery of government.\n\nYet this is no wholesale abandonment of the Mongol heritage. The Yasa still governs military affairs, the Tengri sky still watches over the steppe-born nobility, and the tradition of religious tolerance, a cornerstone of Mongol governance, endures. The conversion is a bridge, not a barrier."
 nd_ilk.2.a: "Que la foi unisse ce que l'épée a divisé."
 nd_ilk.2.b: "Les méthodes de nos ancêtres nous ont assez bien servies."
 nd_ilk.3.t: "Le Recueil des Chroniques"
 nd_ilk.3.d: "Rashid al-Din Hamadani, the brilliant Jewish convert who serves as Grand Vizier, has completed the most ambitious work of historiography the world has ever seen. The Jami al-Tawarikh, the Compendium of Chronicles, is nothing less than a universal history of mankind, stretching from the creation of Adam through the conquests of Genghis Khan to the present day.\n\nDrawing on Chinese, Mongol, Persian, Arabic, Hebrew, and Frankish sources, employing scholars from across the known world, and illustrated with watercolors blending Chinese and Persian artistic traditions, this masterwork represents the very essence of the Ilkhanate: a place where civilizations meet, mingle, and produce something greater than any one alone.\n\nRashid al-Din has also established the Rab-i Rashidi, a vast scholarly quarter in Tabriz housing libraries, hospitals, workshops for manuscript production, and residences for scholars from every corner of the earth."
 nd_ilk.3.a: "La connaissance est la véritable forme de conquête."
 nd_ilk.3.b: "Laissez cette grande œuvre parler pour nous au monde."
 nd_ilk.4.t: "Le Dôme de Soltaniyeh"
 nd_ilk.4.d: "Rising above the Iranian plateau like a jewel set in the earth, the Dome of Soltaniyeh is complete. Commissioned by Oljeitu as the centerpiece of his new capital, this octagonal structure crowned by the largest brick dome ever constructed stands as testimony to the Ilkhanate's architectural ambition.\n\nIts double-shell dome, an engineering marvel, would inspire builders for centuries: the technique would find its way to Brunelleschi's Florence and the great mosques of the Safavid era. The interior is adorned with the finest tilework, calligraphy, and painted murals that Persian artisans can produce, blending Islamic geometric precision with the bold colors favored by the Mongol court.\n\nSoltaniyeh itself, purpose-built as an imperial capital on the road between Tabriz and Isfahan, represents the Ilkhanate's transformation from nomadic conquerors into settled rulers who commission wonders."
 nd_ilk.4.a: "Un monument à notre héritage durable."
 nd_ilk_keshig_tradition: "Tradition Keshig"
 nd_ilk_keshig_tradition_desc: "Les Keshig, la garde personnelle du Khan, représentent le summum de la tradition militaire mongole, des guerriers sélectionnés pour leur loyauté et leur habileté, formés aux arts de la guerre dès l'enfance."
 nd_ilk_tamma_system: "Système de garnison Tamma"
 nd_ilk_tamma_system_desc: "Le système Tamma stationne des forces de garnison permanentes dans les territoires conquis, issues de chiliarchies sélectionnées de la levée mongole. Ces garnisons sécurisent les terres nouvellement conquises et projettent la puissance mongole dans les régions sédentaires."
 nd_ilk_yam_restoration: "Restauration du relais Yam"
 nd_ilk_yam_restoration_desc: "Le système de relais postal de Yam, l'épine dorsale de communication de l'Empire mongol, est restauré et étendu à travers les vastes domaines de l'Ilkhanat, permettant une transmission rapide des ordres et des renseignements."
 nd_ilk_ordu_tradition: "Tradition du campement d'Ordu"
 nd_ilk_ordu_tradition_desc: "L’Ordu, campement militaire mobile de la classe dirigeante mongole, sert à la fois de tribunal et de garnison : un héritage des origines nomades qui continue d’ancrer l’organisation militaire ilkhanide."
 nd_ilk_decimal_organization: "Organisation militaire décimale"
 nd_ilk_decimal_organization_desc: "Le système décimal mongol organise toutes les forces militaires en unités de dix, cent, mille et dix mille (les arban, jagun, minghan et tumen), créant une armée d'une coordination et d'une discipline inégalées."
 nd_ilk_religious_pragmatism: "Pragmatisme religieux"
 nd_ilk_religious_pragmatism_desc: "Les premiers Ilkhans pratiquaient une tolérance religieuse remarquable, protégeant les chrétiens nestoriens, les bouddhistes, les musulmans et les chamans : une politique pragmatique née de la gouvernance d'un empire de nombreuses confessions."
 nd_ilk_chinese_siege_craft: "Artisanat de siège chinois"
 nd_ilk_chinese_siege_craft_desc: "L'armée de Hulegu comprenait un millier de foyers d'hommes catapulteurs, de lanceurs de naphta et d'arbalétriers chinois. Leur expertise en matière de guerre de siège, inégalée dans le monde médiéval, a fait s'effondrer les murs de Bagdad et d'Alamut."
 nd_ilk_silk_road_revival: "La renaissance de la Route de la Soie"
 nd_ilk_silk_road_revival_desc: "Sous la domination mongole, la Route de la Soie connaît une renaissance. La Pax Mongolica rend le commerce continental plus sûr qu'il ne l'a été depuis des siècles, et les caravansérails ilkhanides abritent les marchands de Tabriz à Cathay."
 nd_ilk_steppe_horse_husbandry: "Élevage de chevaux des steppes"
 nd_ilk_steppe_horse_husbandry_desc: "La tradition mongole consistant à entretenir de vastes troupeaux de chevaux, chaque guerrier possédant trois à cinq montures, garantit que la cavalerie de l'Ilkhanat reste la meilleure de la région."
 nd_ilk_court_patronage: "Patronage des Arts à la Cour"
 nd_ilk_court_patronage_desc: "La cour ilkhanide devient un centre dynamique de production artistique, mêlant les traditions artistiques mongoles, perses, chinoises et byzantines dans une nouvelle esthétique distinctive."
 nd_ilk_multicultural_diwan: "Diwan multiculturel"
 nd_ilk_multicultural_diwan_desc: "L’administration ilkhanide emploie des individus talentueux quelle que soit leur origine : des bureaucrates persans, des scribes ouïghours, des financiers juifs et des médecins nestoriens servent tous dans le diwan."
 nd_ilk_maragheh_observatory: "Observatoire de Maragheh"
 nd_ilk_maragheh_observatory_desc: "L'observatoire de Maragheh, fondé sous Hulegu avec l'astronome Nasir al-Din al-Tusi, devient l'institution astronomique la plus avancée au monde, produisant les célèbres tables stellaires Zij-i Ilkhani."
 nd_ilk_qurchi_guard: "Garde Qurchi"
 nd_ilk_qurchi_guard_desc: "Les Qurchi, la garde intérieure des Ilkhan, évoluent à partir de la tradition Keshig antérieure pour devenir une force d'élite de cavalerie lourde mongole-persane, combinant les tactiques de choc de la steppe avec l'armure et la discipline de la tradition chevaleresque perse."
 nd_ilk_tabriz_silk_trade: "Commerce de la soie à Tabriz"
 nd_ilk_tabriz_silk_trade_desc: "Le grand bazar de Tabriz, que Marco Polo considère comme l'un des plus riches au monde, traite et commercialise la soie provenant de toute l'Asie, faisant de l'Ilkhanat le premier intermédiaire du commerce de luxe eurasien."
 nd_ilk_ghazans_conversion: "La conversion de Ghazan"
 nd_ilk_ghazans_conversion_desc: "La conversion de Mahmud Ghazan à l'islam en 1295 transforme l'Ilkhanate d'occupation étrangère en un État islamique légitime, résolvant ainsi des décennies de tensions entre les dirigeants mongols et leurs sujets musulmans."
 nd_ilk_jami_al_tawarikh: "Jami al-Tawarikh"
 nd_ilk_jami_al_tawarikh_desc: "Le Compendium des Chroniques de Rashid al-Din est la première véritable histoire mondiale : un ouvrage monumental s'appuyant sur des sources chinoises, mongoles, persanes, arabes et franques, illustré dans un style mêlant les traditions orientales et occidentales."
 nd_ilk_rashidi_endowment: "Dotation Rashidi"
 nd_ilk_rashidi_endowment_desc: "Le Rab-i Rashidi, le grand quartier scientifique de Rashid al-Din à Tabriz, abrite des bibliothèques, des hôpitaux et des ateliers de production de manuscrits : une université avant que les universités n'existent dans la plupart des pays du monde."
 nd_ilk_unified_coinage: "Monnaie unifiée"
 nd_ilk_unified_coinage_desc: "La réforme monétaire de Ghazan Khan établit une monnaie bimétallique standardisée dans tout l'Ilkhanate, remplaçant le mélange chaotique de monnaies locales et facilitant le commerce à longue distance."
 nd_ilk_persian_military_reform: "Réforme militaire perse"
 nd_ilk_persian_military_reform_desc: "À mesure que l'Ilkhanat s'installe au cœur de la Perse, l'armée évolue d'une force purement steppique à une armée mixte disciplinée combinant les traditions de cavalerie mongole avec l'infanterie et les fortifications perses."
 nd_ilk_dome_of_soltaniyeh: "Dôme de Soltaniyeh"
 nd_ilk_dome_of_soltaniyeh_desc: "Le mausolée d'Oljeitu à Soltaniyeh, couronné par le plus grand dôme de brique jamais construit, constitue le chef-d'œuvre architectural de l'Ilkhanat : un monument qui influencera les bâtisseurs de Florence à Ispahan."
 nd_ilk_yasa_codification: "Codification Yasa"
 nd_ilk_yasa_codification_desc: "L’ancienne Yasa de Gengis Khan est codifiée et harmonisée avec la loi islamique et la tradition administrative persane, créant ainsi un cadre juridique qui s’appuie sur les trois piliers de l’identité ilkhanide."
 nd_ilk_frontier_cavalry: "Tradition de la cavalerie frontalière"
 nd_ilk_frontier_cavalry_desc: "La tradition de la cavalerie des steppes perdure le long des frontières de l'Ilkhanat, où les archers à cheval patrouillent les frontières comme le faisaient leurs ancêtres : un lien vivant avec les guerriers à cheval de Gengis Khan."
 nd_ilk_centralized_taxation: "Fiscalité centralisée"
 nd_ilk_centralized_taxation_desc: "S'appuyant sur les réformes fiscales de Ghazan, l'Ilkhanat développe un système fiscal centralisé qui remplace les exactions arbitraires par une collecte régulière et prévisible des recettes."
 nd_ilk_persianate_bureaucracy: "Bureaucratie persane"
 nd_ilk_persianate_bureaucracy_desc: "L'appareil administratif de l'Ilkhanat mûrit pleinement pour devenir une bureaucratie persane : la superposition mongole a été absorbée et une fonction publique sophistiquée gouverne le royaume."
 nd_ilk_trade_network_maturation: "Maturation du réseau commercial"
 nd_ilk_trade_network_maturation_desc: "Des générations d'investissements dans les caravansérails, les routes et les infrastructures de marché portent leurs fruits à mesure que les réseaux commerciaux de l'Ilkhanate atteignent leur pleine maturité, reliant l'Est et l'Ouest."
 nd_ilk_gunpowder_adoption: "Adoption de la poudre à canon"
 nd_ilk_gunpowder_adoption_desc: "L’Ilkhanat, qui fut le premier à amener les ingénieurs de siège chinois vers l’ouest, intègre désormais pleinement les armes à poudre dans son armée : une continuation appropriée de son rôle de pont entre les civilisations."
 nd_ilk_mounted_fusiliers: "Fusiliers montés"
 nd_ilk_mounted_fusiliers_desc: "L'évolution de la cavalerie ilkhanide atteint son apogée avec les fusiliers à cheval, des cavaliers armés d'armes à feu qui combinent la mobilité de la steppe avec la puissance de feu de l'ère moderne."
 nd_ilk_industrial_synthesis: "Synthèse industrielle"
 nd_ilk_industrial_synthesis_desc: "La longue tradition de synthèse des technologies de l'Est et de l'Ouest de l'Ilkhanate trouve une nouvelle expression à mesure que les méthodes industrielles transforment la production à travers le royaume."
 nd_ilk_constitutional_reform: "Réforme constitutionnelle"
 nd_ilk_constitutional_reform_desc: "L’ancienne tension entre la coutume mongole, la loi islamique et l’administration perse trouve une solution dans la réforme constitutionnelle : un cadre de gouvernance tiré des trois traditions."
 nd_ilk_legacy_of_mongol_persia: "L'héritage de la Perse mongole"
 nd_ilk_legacy_of_mongol_persia_desc: "La synthèse unique de l'Ilkhanat entre les civilisations mongole, persane et islamique est reconnue comme l'une des grandes réalisations culturelles de l'histoire : un héritage de tolérance, d'érudition et d'éclat artistique."
 nd_ilk_national_identity: "Identité nationale"
 nd_ilk_national_identity_desc: "Après des siècles d'évolution, l'Ilkhanat s'est forgé une identité nationale distincte, ni purement mongole ni purement perse, mais quelque chose de nouveau et de durable."
 a_nd_ilk_keshig: "Garde Keshig"
 a_nd_ilk_keshig_desc: "Les Keshig sont la garde personnelle du Khan, des guerriers d'élite à la loyauté éprouvée et aux compétences martiales inégalées. Sélectionnés parmi les plus belles familles du royaume, ils servent à la fois de gardes du corps et de corps d'officiers."
 a_nd_ilk_tamma: "Garnison de Tamma"
 a_nd_ilk_tamma_desc: "Les garnisons Tamma sont des forces militaires permanentes stationnées dans les territoires conquis. Issus de chiliarchies sélectionnées, ces guerriers à cheval détiennent des terres nouvellement conquises et projettent l'autorité mongole dans les régions habitées."
 a_nd_ilk_siege_engineers: "Ingénieurs de siège ilkhanides"
 a_nd_ilk_siege_engineers_desc: "Recrutés parmi les milliers de foyers d'hommes catapulteurs chinois que Hulegu a amenés vers l'ouest, ces spécialistes emploient des trébuchets, du naphte et des arbalètes avec une précision dévastatrice contre les positions fortifiées."
 a_nd_ilk_qurchi: "Garde Qurchi"
 a_nd_ilk_qurchi_desc: "Les Qurchi représentent l'évolution de la tradition de la garde mongole, une cavalerie lourde qui combine les tactiques de choc de la steppe avec l'armure et la discipline de style persan, formant la force de frappe d'élite de l'Ilkhanat."
 a_nd_ilk_reformed_infantry: "Infanterie Ilkhanide réformée"
 a_nd_ilk_reformed_infantry_desc: "À mesure que l'Ilkhanat s'installe dans son domaine perse, son infanterie évolue au-delà des prélèvements tribaux pour devenir une force disciplinée, entraînée à la fois à la flexibilité tactique mongole et aux techniques de siège perses."
 a_nd_ilk_late_horse_archers: "Archers à cheval ilkhanides"
 a_nd_ilk_late_horse_archers_desc: "Héritiers de la tradition des archers à cheval de la steppe mongole, ces cavaliers frontaliers maintiennent les anciennes compétences de la guerre à l'arc composite le long des vastes frontières de l'Ilkhanat."
 a_nd_ilk_gunpowder_cavalry: "Fusiliers montés ilkhanides"
 a_nd_ilk_gunpowder_cavalry_desc: "L'évolution finale de la cavalerie ilkhanide, des fusiliers à cheval qui manient des armes à feu à cheval, combinant la mobilité légendaire des cavaliers mongols avec la puissance meurtrière de la poudre à canon."
 nd_ilk_yam_station: "Gare d'Igname"
 nd_ilk_yam_station_desc: "Une station relais du système postal de Yam, fournissant des chevaux frais et des fournitures aux messagers transportant les ordres du Khan à travers la vaste étendue de l'Ilkhanat."
 nd_ilk_caravanserai: "Caravansérail ilkhanide"
 nd_ilk_caravanserai_desc: "Une auberge fortifiée en bordure de route construite le long de la Route de la Soie, offrant abri, eau et sécurité aux marchands et à leurs caravanes. Ces grandes structures, construites en pierre et ornées de tuiles, constituent l'épine dorsale du commerce transcontinental."
 nd_ilk_rab_i_rashidi: "Rab-i Rashidi"
 nd_ilk_rab_i_rashidi_desc: "Inspiré du grand quartier scientifique de Rashid al-Din à Tabriz, ce complexe abrite des bibliothèques, des hôpitaux, des scriptoria et des logements pour les universitaires : un centre d'apprentissage où les connaissances du monde connu sont rassemblées, traduites et préservées."
 nd_ilk_observatory: "Observatoire Ilkhanide"
 nd_ilk_observatory_desc: "Un observatoire astronomique dans la tradition de Maragheh, équipé des meilleurs instruments de l'époque. Ici, les astronomes cartographient le ciel, dressent des tables d'étoiles et font progresser la science de la mécanique céleste."
 nd_ilk_ordu: "Campement d'Ordu"
 nd_ilk_ordu_desc: "Campement militaire permanent de tradition mongole, servant à la fois de garnison et de centre administratif. L'Ordu maintient la préparation martiale des régions frontalières du royaume."
 nd_ilk_mint: "Menthe Ilkhanide"
 nd_ilk_mint_desc: "Une monnaie royale produisant une monnaie standardisée dans la tradition de la réforme monétaire de Ghazan Khan. Le poids et la pureté uniformes des pièces ilkhanides facilitent le commerce dans tout le royaume."
 nd_ilk_silk_processing: "Nasij Weaving"
 nd_ilk_silk_processing_desc: "Silk is woven with thread of beaten gold into nasij, the cloth of gold of the khans. The inventories of the popes list it as Tartar cloth."
 nd_ilk_horse_breeding: "Herds of the Khan"
 nd_ilk_horse_breeding_desc: "Brood mares are kept on reserved grazing and wintered on grain. Each year the remounts are driven to the army, three to five for every rider."
 nd_ilk_gunpowder_manufacture: "Powder and Shot"
 nd_ilk_gunpowder_manufacture_desc: "Barrels are forged and powder is mixed from saltpeter in the camp arsenal. The firearms go to the regiments quartered beside it."

 nd_ilk_atelier: "Atelier Ilkhanide"
 nd_ilk_atelier_desc: "Un atelier de cour où les maîtres artisans produisent de superbes peintures miniatures persanes et des manuscrits enluminés, mêlant les traditions artistiques mongoles, chinoises et perses dans le style distinctif ilkhanide."
 nd_ilk_bazaar: "Bazar Ilkhanide"
 nd_ilk_bazaar_desc: "Un grand marché couvert dans la tradition des bazars de Tabriz, que Marco Polo qualifiait de plus riche du monde, où les marchands de toute l'Eurasie se rassemblent pour échanger de la soie, des épices et des biens précieux."
 nd_ilk_qoruq: "Qoruq"
 nd_ilk_qoruq_desc: "A stretch of steppe closed to all herds but the khan's. The horses of the army are bred here, on the winter grazing of Mughan and Arran and the summer uplands above them."
 nd_ilk_nasij_karkhana: "Nasij Karkhana"
 nd_ilk_nasij_karkhana_desc: "A workshop of the court. Weavers of silk and gold thread are settled here with their families and work for the khan alone."
 nd_ilk_kitabkhana: "Kitabkhana"
 nd_ilk_kitabkhana_desc: "A book workshop of scribes, gilders and binders, kept beside the court atelier. The chronicles and treatises of the realm are copied here year after year."
 nd_ilk_qurkhana: "Qurkhana"
 nd_ilk_qurkhana_desc: "The arsenal of an ordu. The armourers and powder makers of the camp work here."
 nd_ilk_manuscript_production: "Copying and Illumination"
 nd_ilk_manuscript_production_desc: "Works of history, science and literature are copied on fine paper, illuminated and bound in leather. One copy is made in Arabic and one in Persian."
 nd_ilk_yam_maintenance: "Entretien de la station Yam"
 nd_ilk_yam_maintenance_desc: "Entretien d'un relais postal mongol avec des chevaux frais et du fourrage."
 nd_ilk_caravanserai_upkeep: "Entretien du caravansérail"
 nd_ilk_caravanserai_upkeep_desc: "Maintenir un poste commercial fortifié sur la Route de la Soie avec des murs en pierre et des installations de stockage."
 nd_ilk_scholarly_upkeep: "Entretien scientifique"
 nd_ilk_scholarly_upkeep_desc: "Approvisionnement d’un complexe hospitalo-universitaire en papier, encres et matériel scientifique."
 nd_ilk_observatory_upkeep: "Entretien de l'Observatoire"
 nd_ilk_observatory_upkeep_desc: "Entretenir des instruments astronomiques et fournir du papier pour les enregistrements dans un observatoire."
 nd_ilk_ordu_upkeep: "Entretien d'Ordu"
 nd_ilk_ordu_upkeep_desc: "Fournir à un campement militaire mongol des chevaux, des armes et du matériel."
 nd_ilk_mint_upkeep: "Entretien de la menthe"
 nd_ilk_mint_upkeep_desc: "Exploitation d'un atelier monétaire ilkhanide, transformation de l'argent et du cuivre en monnaie standardisée."
 nd_ilk_atelier_upkeep: "Entretien des ateliers"
 nd_ilk_atelier_upkeep_desc: "Fourniture à un atelier judiciaire de papier et de colorants pour l'enluminure de manuscrits et la peinture de miniatures."
 nd_ilk_bazaar_upkeep: "Entretien du bazar"
 nd_ilk_bazaar_upkeep_desc: "Entretien des halles en pierre et des étals couverts d'un grand marché ilkhanide."
 STATIC_MODIFIER_NAME_nd_ilk_mongol_traditions: "Traditions mongoles"
 STATIC_MODIFIER_DESC_nd_ilk_mongol_traditions: "Les anciennes habitudes de la steppe perdurent : la tolérance de la tente, la mobilité du cavalier, le pragmatisme du nomade. Ces traditions ont bien servi nos ancêtres et elles nous servent encore."
 STATIC_MODIFIER_NAME_nd_ilk_chronicle_diplomacy: "Chronique Diplomatie"
 STATIC_MODIFIER_DESC_nd_ilk_chronicle_diplomacy: "La portée universelle du Jami al-Tawarikh démontre au monde la sophistication culturelle de l'Ilkhanat, gagnant le respect et l'attention des tribunaux et des érudits étrangers."
 nd_ilk_formed_tt: "L'Ilkhanat a été formé"
 nd_ilk_path_a_tt: "Choisissez le Fléau du Califat"
 nd_ilk_path_b_tt: "Choisissez le khanat persan"
 nd_ilk_dest_tabriz_developed_tt: "Owns #bold Tabriz#! with at least #bold 24#! development"
 nd_ilk_dest_soltaniyeh_developed_tt: "Owns #bold Soltaniyeh#! with at least #bold 44#! development"
 nd_ilk_destiny: "L'héritage des Ilkhans"
 nd_ilk_destiny_desc: "L'Ilkhanat est restauré. Maintenant, la question se pose : quel héritage ce royaume laissera-t-il au monde ? La stabilité doit primer avant que de grandes ambitions puissent prendre forme."
 nd_ilk_dest_storm: "La tempête mongole"
 nd_ilk_dest_storm_desc: "Dans la tradition de Hulegu, qui a saccagé Bagdad et brisé le califat abbasside, l’Ilkhanat tourne son regard vers le Levant. Damas et Alep doivent tomber avant l’avancée mongole."
 nd_ilk_dest_subjugation: "Soumission des empires"
 nd_ilk_dest_subjugation_desc: "Une fois le Levant sécurisé, les ambitions de l'Ilkhanat grandissent. Constantinople et Le Caire (les joyaux jumeaux du vieux monde) doivent se soumettre à l'autorité du Khan. Il faut un hôte puissant."
 nd_ilk_dest_world_empire: "Empire mondial des Khans"
 nd_ilk_dest_world_empire_desc: "Le dernier chapitre du rêve mongol : un empire s’étendant de Samarcande à Delhi, du golfe Persique aux villes saintes d’Arabie. Aucun royaume n’a atteint une telle domination depuis Alexandre."
 nd_ilk_dest_synthesis: "La synthèse persane"
 nd_ilk_dest_synthesis_desc: "Rather than conquest, the Ilkhanate pursues the path of Ghazan Khan, who walled Tabriz anew and raised the suburb of Shanb-i Ghazan beside it. Tabriz is to be held and built up, and new institutions embraced."
 nd_ilk_dest_golden_age: "L'âge d'or de Tabriz"
 nd_ilk_dest_golden_age_desc: "Les traditions commerciales et intellectuelles de l'Ilkhanat connaissent un âge d'or. La soie circule sur nos marchés, les institutions prennent racine et le trésor se gonfle grâce à la richesse du commerce Est-Ouest."
 nd_ilk_dest_enlightenment: "Berceau des civilisations"
 nd_ilk_dest_enlightenment_desc: "The Ilkhanate becomes what it was always meant to be: a place where civilizations meet and create something greater. Hormuz controls the trade of the Gulf, Bukhara anchors the realm's scholarly tradition, and Soltaniyeh, the capital Oljeitu raised on a summer pasture, has grown to twice its size."
 nd_ilk.5.t: "Le destin d'Ilkhan"
 nd_ilk.5.d: "The Ilkhanate stands firm, its foundations secure and its people content. From the highlands of Armenia to the shores of the Persian Gulf, from Mesopotamia to Khorasan, the realm is stable and ready to be shaped by the will of the Ilkhan.\n\nThe path chosen at the moment of restoration now takes on its full significance. Whether through the thunder of cavalry or the steady growth of commerce and learning, the Ilkhanate will leave its mark upon the world."
 nd_ilk.5.a: "Notre destin nous attend."
 nd_ilk.6.t: "Les chutes du Levant"
 nd_ilk.6.d: "Damascus and Aleppo have fallen to the armies of the Ilkhan, completing the conquest that Hulegu himself could not finish. The Levantine lands (cradle of ancient civilizations, crossroads of three continents) now lie within the Mongol domain.\n\nHulegu's forces reached these lands in 1260 but were turned back at Ayn Jalut. Now, at last, the Ilkhanate commands the full extent of the Fertile Crescent, from the Tigris to the Mediterranean."
 nd_ilk.6.a: "Le travail inachevé de Hulegu est terminé."
 nd_ilk.7.t: "Les trônes jumeaux"
 nd_ilk.7.d: "Constantinople and Cairo (the two greatest cities of the old world) have submitted to the authority of the Ilkhan. The Roman successor in the Bosporus and the Egyptian power on the Nile are broken. No force remains that can contest Mongol supremacy in the western half of the known world.\n\nThis is a feat that would have staggered even Genghis Khan. The question now is how to consolidate these vast conquests: through the fear that Mongol armies inspire, or through the careful extraction of wealth from subjugated lands."
 nd_ilk.7.a: "Qu'ils tremblent à notre approche."
 nd_ilk.7.b: "Dépouillez les terres conquises de leurs richesses."
 nd_ilk.8.t: "Domination sans fin"
 nd_ilk.8.d: "From Samarkand's turquoise domes to Delhi's minarets, from the shores of the Persian Gulf to the holy cities of Arabia, the Ilkhanate commands an empire of staggering scope. This is the Mongol dream made manifest: a universal empire stretching across civilizations, religions, and peoples.\n\nThe Khan must now decide the nature of this dominion. Will it be a Pax Mongolica: a great peace enforced by Mongol order, where trade flows freely and subjects are bound by loyalty? Or will it remain an engine of eternal conquest, forever expanding, forever hungry?"
 nd_ilk.8.a: "Imposez la paix au Khan."
 nd_ilk.8.b: "La conquête ne finit jamais."
 nd_ilk.9.t: "La synthèse prend racine"
 nd_ilk.9.d: "The vision of Ghazan Khan bears fruit. The Ilkhanate has grown prosperous not through plunder but through cultivation. Tabriz has spread beyond the walls Ghazan gave it, and the bankers of the bazaar now serve the court.\n\nThe synthesis of Mongol vigor and Persian sophistication is no longer an aspiration but a reality. New institutions take root in fertile soil, and the treasury reflects not the spoils of war but the patient accumulation of a well-governed state."
 nd_ilk.9.a: "Nous construisons ce que d’autres ne peuvent que conquérir."
 nd_ilk.10.t: "La floraison de Tabriz"
 nd_ilk.10.d: "The Ilkhanate enters its golden age. Silk from China flows through our markets, scholars from across the known world gather in our libraries, and the wealth of East-West trade fills our coffers. Tabriz, which Marco Polo called the richest city in the world, lives up to its reputation and then some.\n\nThis flowering can take two forms: a commercial renaissance focused on the bazaars and caravanserais that make the Ilkhanate the crossroads of Eurasian trade, or a scholarly renaissance that builds upon the intellectual traditions of Maragheh, the Rab-i Rashidi, and the Jami al-Tawarikh."
 nd_ilk.10.a: "Laissez les bazars de Tabriz étonner le monde."
 nd_ilk.10.b: "Laissez nos érudits éclairer les ténèbres."
 nd_ilk.11.t: "Où les civilisations se rencontrent"
 nd_ilk.11.d: "The Ilkhanate has achieved something no other realm in history can claim: a true synthesis of civilizations. Mongol, Persian, Turkic, Arab, Armenian, Georgian, all contribute to a cultural whole that is greater than any of its parts.\n\nHormuz controls the trade routes of the Gulf, Bukhara anchors the eastern scholarly tradition, and Soltaniyeh stands between them as a capital worthy of both. The Ilkhanate is recognized across the world as a beacon of learning, tolerance, and prosperity.\n\nThis legacy can be expressed through universal knowledge (a commitment to learning that transcends all boundaries) or through cosmopolitan empire (a state that embraces all peoples and reaches out to every corner of the world)."
 nd_ilk.11.a: "La connaissance ne connaît pas de frontières."
 nd_ilk.11.b: "Tous les peuples trouvent leur place dans notre royaume."
 STATIC_MODIFIER_NAME_nd_ilk_dest_terror_march: "Marche terroriste"
 STATIC_MODIFIER_DESC_nd_ilk_dest_terror_march: "La pratique mongole de résistance dévastatrice et de conquêtes en garnison garantit une soumission rapide, même si le coût économique du maintien d’une si vaste présence militaire met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_ilk_dest_plunder_riches: "Butin de l'Empire"
 STATIC_MODIFIER_DESC_nd_ilk_dest_plunder_riches: "L'extraction systématique des richesses des terres conquises finance la machine militaire de l'Ilkhanat, même si les dépenses somptueuses de la cour augmentent parallèlement à ses revenus."
 STATIC_MODIFIER_NAME_nd_ilk_dest_pax_mongolica: "Pax Mongolique"
 STATIC_MODIFIER_DESC_nd_ilk_dest_pax_mongolica: "La grande paix du Khan descend sur le monde conquis. Le commerce circule librement, les réseaux de renseignement unissent l’empire et les peuples soumis acceptent leur place dans l’ordre mongol."
 STATIC_MODIFIER_NAME_nd_ilk_dest_eternal_conquest: "Conquête éternelle"
 STATIC_MODIFIER_DESC_nd_ilk_dest_eternal_conquest: "L'Ilkhanat est une épée qui ne dort jamais. Ses armées se déplacent à une vitesse terrifiante, renforçant les pertes et prenant l’initiative avant que les ennemis ne puissent réagir."
 STATIC_MODIFIER_NAME_nd_ilk_dest_tabriz_renaissance: "Renaissance de Tabriz"
 STATIC_MODIFIER_DESC_nd_ilk_dest_tabriz_renaissance: "L’essor commercial de Tabriz transforme l’Ilkhanat en la première puissance commerciale du Moyen-Orient, même si la prospérité confortable engendre une certaine complaisance."
 STATIC_MODIFIER_NAME_nd_ilk_dest_scholarly_exchange: "Échange scientifique"
 STATIC_MODIFIER_DESC_nd_ilk_dest_scholarly_exchange: "La tradition de l'Ilkhanat consistant à rassembler des érudits de toutes les civilisations crée un réseau intellectuel qui accélère l'intégration de divers peuples et l'art de la diplomatie."
 STATIC_MODIFIER_NAME_nd_ilk_dest_universal_knowledge: "Connaissance universelle"
 STATIC_MODIFIER_DESC_nd_ilk_dest_universal_knowledge: "The Ilkhanate commits itself to the pursuit of knowledge without boundaries (astronomy, medicine, history, theology), creating schools that serve all estates and faiths."
 STATIC_MODIFIER_NAME_nd_ilk_dest_cosmopolitan_empire: "Empire cosmopolite"
 STATIC_MODIFIER_DESC_nd_ilk_dest_cosmopolitan_empire: "L'Ilkhanat s'ouvre au monde, élargissant sa portée diplomatique et ses horizons commerciaux au-delà de la sphère traditionnelle mongole-perse."
 nd_ilk_war_college: "Collège de guerre ilkhanide"
 nd_ilk_war_college_desc: "A military academy that synthesizes the siege craft of Chinese engineers, the cavalry tactics of the Mongol steppe, and the disciplined infantry traditions of Persia, training commanders in the art of total war."
 nd_ilk_war_college_upkeep: "Entretien du Collège de guerre"
 nd_ilk_war_college_upkeep_desc: "Maintenir une académie militaire avec des armes, des chevaux et du matériel de formation pour l'instruction des officiers."
 nd_ilk_academy: "Académie des sciences ilkhanides"
 nd_ilk_academy_desc: "Une grande institution d'apprentissage dans la tradition de Maragheh et de Rab-i Rashidi, où astronomes, médecins, historiens et philosophes du monde connu se réunissent pour faire progresser la connaissance humaine."
 nd_ilk_academy_upkeep: "Entretien de l'Académie"
 nd_ilk_academy_upkeep_desc: "Fournir à un centre d'apprentissage du papier, des livres, des instruments en verre et des appareils en cuivre pour la recherche scientifique."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_ilk_bureaucracy_authority: "Divan des Ilkhans"
 AUTO_MODIFIER_DESC_nd_ilk_bureaucracy_authority: "Le tribunal de Tabriz est devenu un appareil administratif permanent : le sahib-divan présidant ses bureaux des finances, de la correspondance et de l'audit ; les yarghuchi appliquent la loi chinggisid aux côtés du cadi qui applique la charia. À partir de cette double fondation mongole-persane, les institutions étatiques distinctives de l’Ilkhanat commencent à prendre leur forme durable."

 ilk_yarghu_bureaucracy: "Cour de Yarghu"
 ilk_yarghu_bureaucracy_desc: "Rattaché à la cour royale, le yarghu était le tribunal de droit coutumier mongol dirigé par des juges yarghuchi : d'abord des princes et des noyans mongols, puis des bureaucrates persans. Il appliquait le qanun-e rasti et le yasa, les règles de Gengis Khan, dans les cas impliquant les Mongols et les grands émirs. Les Ilkhans l'assimilaient rhétoriquement à la charia, mais dans la pratique, les tribunaux yarghu et cadi fonctionnaient en parallèle, des juridictions fixées par le justiciable plutôt que par l'infraction."

 ilk_sahib_divan_bureaucracy: "Vizirat Sahib-Divan"
 ilk_sahib_divan_bureaucracy_desc: "Le chef-vizirat persan qui dirigeait la bureaucratie civile de l'Ilkhanat depuis Tabriz, coordonnait le divan-i istifa (finances), le divan-i insha (chancellerie) et l'audit. Tenu par Shams al-Din Juvayni, puis par Rashid al-Din Hamadani de 1298 à 1318, le bureau tirait parti des héritages administratifs sassanides et abbassides. La chancellerie de Rashid al-Din a produit le Jami al-Tawarikh et les tablettes fiscales standardisées yarligh qui sont devenues le modèle institutionnel de l'art politique persan."

 ilk_tax_cadaster_bureaucracy: "Cadastre fiscal de Ghazan"
 ilk_tax_cadaster_bureaucracy_desc: "La grande réforme fiscale de 1295-1304, dans laquelle Ghazan Khan et Rashid al-Din ordonnèrent un recensement des terres, fixèrent des taux d'imposition standardisés par district, abolirent les pires exactions des nomades et les abus fiscaux en matière d'agriculture, et publièrent des tablettes yarligh en bronze enregistrant les obligations de chaque sujet. La réforme a inversé l’effondrement budgétaire catastrophique d’Arghun-Gaykhatu et a restauré la base agricole de la Perse. Son registre est devenu le modèle institutionnel hérité des Jalayirids, Timurids et Safavides."

 ilk_mazalim_bureaucracy: "Court of the Friday Mosque"
 ilk_mazalim_bureaucracy_desc: "A Mongol answered to the yarghu and a Muslim to the qadi, and a quarrel between the two had no judge. In 1303 Ghazan Khan gave it one. Twice a month qadis, sayyids, shaikhs and ulama sat in the Friday mosque beside the betikchis, the Mongol secretaries, and heard such cases together, along with appeals no single court could settle. The ruling rested on sharia and bound the Mongol party as well. For the first time a townsman could bring a soldier of the conquerors before a judge."

 ilk_maragha_observatory_bureaucracy: "Observatoire de Maragha"
 ilk_maragha_observatory_bureaucracy_desc: "Le grand rasadkhana fondé en 1259 sous Hulagu et dirigé par Nasir al-Din al-Tusi, comprenant une tour centrale, cinq plates-formes circulaires, une fonderie métallurgique, des dortoirs et une bibliothèque réputée à 400 000 volumes. Tusi, Mu'ayyad al-Din al-Urdi, Qutb al-Din Shirazi et une génération d'astronomes résidents ont compilé le Zij-i Ilkhani (1271) et développé le Tusi-couple, fondations géométriques pour les observatoires ultérieurs de Samarkand, Istanbul et Jaipur."

 ilk_keshig_bureaucracy: "Keshig"
 ilk_keshig_bureaucracy_desc: "Garde de maison impériale héritée de l'Empire mongol, comprenant les veilles de jour et de nuit (turqaut et kebte'ul) organisées par équipes de mille. Le service Keshig était à la fois une cavalerie d'élite, un cérémonial de cour et une école de formation pour les futurs généraux, gouverneurs et vizirs, qui apprenaient les armes et l'administration en tant que compagnons personnels du Khan. Sous les Ilkhans, les émirs keshig supérieurs devinrent un corps aristocratique qui décidait des successions et pouvait dominer le trône lui-même."
