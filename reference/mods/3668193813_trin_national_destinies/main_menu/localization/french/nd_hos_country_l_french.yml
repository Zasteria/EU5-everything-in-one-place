 HOS: "Saint John"
 HOS_ADJ: "Hospitalier"
 HOS_f: "Ordre souverain de Saint-Jean"
 HOS_f_desc: "Refondé l'Ordre Souverain Militaire Hospitalier de Saint-Jean de Jérusalem, la confrérie croisée qui a perdu la Terre Sainte et qui a néanmoins survécu. Depuis leur forteresse de Rhodes, puis de Malte, les Chevaliers de Saint-Jean maintiennent la croix blanche à huit pointes comme un ordre catholique souverain : une confrérie multinationale de langues, une flotte qui traque les corsaires de la Méditerranée et une tradition hospitalière qui fonda les premiers véritables hôpitaux de la chrétienté."
