l_french:
 STATIC_MODIFIER_NAME_nd_pearl_of_the_indian_ocean: "Perle de l'Océan Indien"
 STATIC_MODIFIER_DESC_nd_pearl_of_the_indian_ocean: "Les ports de Mogadiscio, Merca et Barawa sont de véritables joyaux le long de la côte de Benadir, leurs ports regorgeant de boutres transportant du tissu, de l'ivoire et des épices vers l'Arabie, l'Inde et au-delà. Les marchands somaliens surfent sur les vents de mousson avec la confiance de plusieurs générations, et les commerçants étrangers savent que les richesses de l’océan Indien passent entre les mains des Somaliens."
 STATIC_MODIFIER_NAME_nd_lords_of_the_waters: "Seigneurs des Eaux"
 STATIC_MODIFIER_DESC_nd_lords_of_the_waters: "L'héritage d'Ajuran perdure dans les puits de calcaire et les canaux d'irrigation qui font fleurir l'intérieur aride. Celui qui contrôle l’eau contrôle le peuple, et l’administration centralisée qui s’est développée autour de ces ouvrages hydrauliques a forgé un État plus fort et plus unifié que ses voisins, capable de nourrir des armées et de faire croître des villes là où d’autres ne voient que de la poussière."
 nd_soi.1.t: "L'unification de la Somalie"
 nd_soi.1.d: "From the ancient ports of Zeila and Berbera in the north to the storied harbors of Mogadishu and Merca along the Benadir coast, the Somali lands are united under a single banner. For centuries the Somali people have been traders and warriors, their dhows mastering the monsoon winds of the Indian Ocean, their horsemen ranging across the Horn of Africa. The Ajuran sultans built a hydraulic empire around the waters of the Jubba and Shabelle, while the merchants of Mogadishu minted their own coins and wove cloth prized from Egypt to India.\n\nNow the clans have come together. But what shall define this new nation, the outward reach of its merchants across the seas, or the inward strength of its waters and governance?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_soi.1.a: "Nous sommes les marchands de la mousson."
 nd_soi.1.b: "Nous sommes les maîtres des puits."
 nd_soi.2.t: "La conquête des hautes terres"
 nd_soi.2.d: "In 1529, Imam Ahmad ibn Ibrahim al-Ghazi, known as Gurey, the Left-Handed, launched a campaign from the Adal Sultanate that would shake the foundations of Christian Abyssinia. Somali and Afar horsemen, armed with sabers from the markets of Zeila and Arabia, swept through the Ethiopian highlands in a series of devastating victories. Within a decade, three-quarters of the Ethiopian Empire lay under Muslim control.\n\nThe Futuh al-Habasha, the Conquest of Abyssinia, demonstrated the striking power of Somali cavalry and the reach of Somali ambition. Ahmad's horsemen wore face-covering helmets and breastplates, their mounts similarly armored, and they employed hit-and-run tactics perfectly suited to the rugged terrain. Though Ahmad himself fell in 1543, the campaigns proved that the Somali military tradition could challenge even the greatest powers of East Africa.\n\nShall we embrace the spirit of Ahmad Gurey's campaigns, or seek strength through diplomacy?"
 nd_soi.2.a: "Partez comme Ahmad Gurey chevauchait."
 nd_soi.2.b: "Forgez des alliances plutôt que des conquêtes."
 nd_soi.3.t: "Le pacte ottoman-somalien"
 nd_soi.3.d: "When Portuguese warships appeared off the Benadir coast in the early sixteenth century, sacking Barawa in 1507 and destroying Mogadishu in 1542, the Somali city-states recognized that no single power could resist European naval might alone. The Ajuran Sultanate reached out to the Ottoman Empire, and in the 1580s a remarkable cooperation took shape. Somali fleets joined the Turkish corsair Mir Ali Bey in a combined expedition that drove the Portuguese from Pate, Mombasa, and Kilwa.\n\nCoastal watchtowers equipped with long-range telescopes scanned the horizon for hostile sails, while Somali galleys patrolled the waters between Mogadishu and the Swahili coast. The alliance demonstrated that Indian Ocean powers could resist European encroachment through unity and strategic cooperation."
 nd_soi.3.a: "La mer appartient à ceux qui la défendent."
 nd_soi.4.t: "Les monnaies des sultans"
 nd_soi.4.d: "The Sultanate of Mogadishu became one of the few African states to mint its own coinage, a testament to the sophistication of its commercial networks. Mogadishu currency bore the names of twenty-three successive sultans, and pieces have been found as far away as the present-day United Arab Emirates. The minting of coins centralized the sultanate's commercial hegemony, allowing Mogadishu to set the terms of trade across the western Indian Ocean.\n\nAlongside this financial innovation, the city's weavers produced the famous toob benadir, cloth so fine that Ibn Battuta declared Mogadishu's textiles unequalled when he visited in 1330. By the nineteenth century, one in five residents of Mogadishu were weavers, and the cloth was exported to Egypt, Syria, and Arabia.\n\nShall we build our wealth on the strength of our currency, or the renown of our cloth?"
 nd_soi.4.a: "Laissez nos pièces parler pour nous sur tous les marchés."
 nd_soi.4.b: "Laissez notre tissu habiller le monde."
 nd_soi.5.t: "L'avènement du Gobroon"
 nd_soi.5.d: "In the late seventeenth century, as the Ajuran Sultanate fractured under the weight of tyrannical rule and rebellious clans, a new power emerged along the Shabelle River. The Gobroon family, regarded as saints in the Islamic tradition, united the Geledi clan into a sultanate centered on Afgooye. Under the Gobroon dynasty, the Geledi Sultanate consolidated control over the Jubba and Shabelle valleys and the Benadir coast, developing new systems of agriculture and taxation.\n\nThe dynasty's defining moment came in 1843 when Geledi forces marched against the Bardera Sultanate, a strict religious settlement that imposed Sharia prohibitions threatening Geledi commercial interests. The decisive victory at Bardera reasserted Geledi dominance over the interior trade routes and proved that the successor states could project power as effectively as the old Ajuran.\n\nShall the Gobroon legacy be one of agricultural prosperity, or military strength?"
 nd_soi.5.a: "Les rivières nourriront une grande nation."
 nd_soi.5.b: "La force garantit ce que la prospérité crée."
 nd_soi.6.t: "Les métiers à tisser du Benadir"
 nd_soi.6.d: "The weaving tradition of the Benadir coast is among the oldest and most refined in East Africa. The Tunni coastal artisans and other Somali weavers produce the alindi and toob benadir, cloth known by different names in the hinterland and on the coast, but prized everywhere. When Ibn Battuta visited Mogadishu in 1330, he recorded that the city's textiles were exported to Egypt and beyond, describing them as without equal.\n\nThe weaving houses of Mogadishu and Merca are not merely workshops but centers of cultural identity, where patterns and techniques are passed down through generations. Each bolt of cloth carries the story of a people who turned cotton and dyes into objects of beauty and instruments of trade."
 nd_soi.6.a: "Une tradition tissée dans notre identité même."
 nd_soi_xeer_codification: "Codification Xeer"
 nd_soi_xeer_codification_desc: "Le xeer somalien, un ensemble de lois coutumières non écrites négociées par les conseils des anciens, régit tout, depuis l'indemnisation du sang jusqu'aux droits à l'eau. Sa codification dans un cadre juridique formel renforce la gouvernance clanique."
 nd_soi_pastoral_economy: "Économie pastorale"
 nd_soi_pastoral_economy_desc: "L'élevage de chameaux, de bovins, de moutons et de chèvres constitue l'épine dorsale de la vie économique somalienne. La maîtrise des techniques pastorales et de la transformation des peaux crée des excédents pour le commerce."
 nd_soi_monsoon_navigation: "Navigation pour la mousson"
 nd_soi_monsoon_navigation_desc: "Les marins somaliens comprennent depuis longtemps les vents de mousson saisonniers qui relient la Corne de l’Afrique à l’Arabie, à l’Inde et au-delà. Ces connaissances permettent un commerce maritime fiable à travers l’océan Indien."
 nd_soi_clan_warrior_traditions: "Traditions des guerriers du clan"
 nd_soi_clan_warrior_traditions_desc: "Les clans somaliens entretiennent de féroces traditions guerrières, notamment dans le combat à cheval. Les cavaliers armés de lances et de sabres constituent la force de frappe d'élite des armées somaliennes."
 nd_soi_mogadishu_foundations: "Fondations de Mogadiscio"
 nd_soi_mogadishu_foundations_desc: "La ville de Mogadiscio, fondée par des marchands arabes et somaliens, est devenue un centre commercial majeur de l'océan Indien, ses marchés attirant des commerçants de trois continents."
 nd_soi_islamic_scholarship: "Bourse islamique"
 nd_soi_islamic_scholarship_desc: "Les érudits somaliens de l'école de jurisprudence Shafi'i gagnent en renommée dans le monde musulman. Des personnalités comme Uthman bin Ali Zayla'i en Égypte et Abd al-Aziz de Mogadiscio aux Maldives transmettent l'enseignement somalien à l'étranger."
 nd_soi_ajuran_state_formation: "Formation de l'État Ajuran"
 nd_soi_ajuran_state_formation_desc: "Le sultanat d’Ajuran crée un appareil administratif centralisé sans précédent dans la Corne de l’Afrique, utilisant le contrôle des ressources en eau pour construire un État bureaucratique fonctionnel."
 nd_soi_ajuran_hydraulic_works: "Travaux hydrauliques d'Ajuran"
 nd_soi_ajuran_hydraulic_works_desc: "Les Ajuran, en tant que dynastie de l'eau, monopolisent les rivières Jubba et Shabelle grâce à des puits de calcaire, des citernes et des canaux d'irrigation. Leur ingénierie hydraulique rend les terres arides productives et incite les nomades à s'y installer."
 nd_soi_monsoon_trade_routes: "Routes commerciales de la mousson"
 nd_soi_monsoon_trade_routes_desc: "Les marchands somaliens établissent des routes commerciales régulières, guidées par les vents saisonniers de la mousson, reliant Mogadiscio, Merca et Barawa aux ports d'Arabie, d'Inde, de Perse et même de Chine."
 nd_soi_dhow_building: "Bâtiment de boutre"
 nd_soi_dhow_building_desc: "Les constructeurs navals somaliens construisent les boutres rapides qui dominent le commerce dans l'océan Indien, des navires en planches cousues conçus pour affronter les vents de mousson et transportant des marchandises sur de vastes distances avec un équipage minimal."
 nd_soi_benadir_textile_tradition: "Tradition textile de Benadir"
 nd_soi_benadir_textile_tradition_desc: "The toob benadir, woven cloth specialized for the markets of Egypt and Syria, makes Mogadishu a major textile center. Ibn Battuta himself described the city's fabrics as without equal.\n\n#italic Available in: $nd_soi_weaving_house$#!"
 nd_soi_mogadishu_coinage: "Monnaie de Mogadiscio"
 nd_soi_mogadishu_coinage_desc: "Le sultanat de Mogadiscio frappe sa propre monnaie portant les noms de ses sultans, centralisant ainsi l’hégémonie commerciale dans tout l’océan Indien occidental."
 nd_soi_adal_cavalry_tactics: "Tactiques de cavalerie Adal"
 nd_soi_adal_cavalry_tactics_desc: "La cavalerie du sultanat d'Adal, blindée de casques et de cuirasses couvrant le visage, emploie des tactiques de délit de fuite dévastatrices. Leurs cavaliers portent des sabres provenant des marchés de Zeila et d'Arabie."
 nd_soi_zeila_gateway: "Passerelle Zeila"
 nd_soi_zeila_gateway_desc: "Le port de Zeila, principal port du sultanat d'Adal, sert de porte d'entrée entre la Corne de l'Afrique et la péninsule arabique, canalisant un flux d'esclaves, d'ivoire et de marchandises."
 nd_soi_futuh_al_habasha: "Futuh al-Habasha"
 nd_soi_futuh_al_habasha_desc: "The Conquest of Abyssinia by Imam Ahmad ibn Ibrahim al-Ghazi demonstrates the devastating reach of Somali cavalry, as three-quarters of the Ethiopian Empire falls under Muslim control. Matchlockmen hired in Arabia and sent by the Ottoman pasha of Zabid land at Zeila and bring gunfire to the wars of the Horn."
 nd_soi_benadir_coastal_defense: "Défense côtière de Benadir"
 nd_soi_benadir_coastal_defense_desc: "Le sultanat d'Ajuran organise un système de défense côtière contre les incursions portugaises, avec des tours de guet, des troupes de garnison et une flotte de galères protégeant les ports de Benadir."
 nd_soi_benadir_naval_defense: "Défense navale de Benadir"
 nd_soi_benadir_naval_defense_desc: "Des galères de guerre construites dans les ports de Mogadiscio et de Merca patrouillent le long de la côte de Benadir, engageant des navires portugais et hostiles pour protéger le commerce somalien."
 nd_soi_ottoman_alliance: "Alliance ottomane-somalienne"
 nd_soi_ottoman_alliance_desc: "Dans les années 1580, les cités-États somaliennes coopèrent avec les forces ottomanes pour chasser les Portugais des principaux ports d’Afrique de l’Est, notamment Pate, Mombasa et Kilwa."
 nd_soi_frankincense_trade: "Commerce de l'encens"
 nd_soi_frankincense_trade_desc: "La Corne de l’Afrique exporte de l’encens et de la myrrhe depuis l’Antiquité. Le contrôle somalien de ces résines aromatiques constitue une source constante de richesse provenant de l'ancienne terre de Pount."
 nd_soi_warsangali_enterprise: "Entreprise Warsangali"
 nd_soi_warsangali_enterprise_desc: "The Warsangali Sultanate controls the Maakhir Coast in northern Somalia, maintaining independent trading networks that supplement the commerce of the southern Benadir ports. Its harbours sort, grade and pack the frankincense of the northern scarps for the markets of Arabia and India.\n\n#italic Available in: $nd_soi_beeyo_grove$#!"
 nd_soi_shafii_jurisprudence: "Jurisprudence Shafi'ite"
 nd_soi_shafii_jurisprudence_desc: "Somali Islamic scholars of the Shafi'i school develop a sophisticated jurisprudential tradition that complements the customary xeer, creating a dual legal framework. Their students open schools in every town, so that the law finds readers."
 nd_soi_successor_states: "États successeurs"
 nd_soi_successor_states_desc: "Le déclin du sultanat d'Ajuran donne naissance à une mosaïque d'États successeurs, les sultanats Geledi, Hobyo et Majeerteen, chacun héritant de différents aspects de la gouvernance d'Ajuran."
 nd_soi_gobroon_dynasty: "Dynastie Gobroon"
 nd_soi_gobroon_dynasty_desc: "La famille Gobroon, considérée comme des saints dans la tradition islamique, unit le clan Geledi en un puissant sultanat centré sur Afgooye, consolidant ainsi son contrôle sur les vallées de Jubba et de Shabelle."
 nd_soi_shabelle_agriculture: "Agriculture de Shabelle"
 nd_soi_shabelle_agriculture_desc: "Building on the Ajuran hydraulic legacy, the Geledi develop intensive agriculture along the Shabelle valley, producing surplus grain, cotton, and other crops for domestic consumption and export."
 nd_soi_merchant_diaspora: "Diaspora marchande"
 nd_soi_merchant_diaspora_desc: "Des communautés marchandes somaliennes s'établissent au Caire, à Damas, à Moka, à Mombasa, à Aden et dans les îles de l'océan Indien, créant ainsi un réseau commercial qui s'étend sur trois continents."
 nd_soi_geledi_mobilization: "Mobilisation Geledi"
 nd_soi_geledi_mobilization_desc: "Le sultanat de Geledi développe un système de mobilisation militaire s'appuyant sur les traditions guerrières de ses clans constitutifs, envoyant des forces irrégulières rapides pour des campagnes le long de la vallée de Jubba."
 nd_soi_inland_caravan_trade: "Commerce intérieur des caravanes"
 nd_soi_inland_caravan_trade_desc: "Les routes des caravanes reliant la côte de Benadir à Harar et à l'intérieur de l'Éthiopie transportent de l'ivoire, du bétail, des peaux et des tissus, enrichissant ainsi les clans somaliens de l'intérieur des terres."
 nd_soi_bardera_campaign: "Campagne Bardera"
 nd_soi_bardera_campaign_desc: "En 1843, les forces Geledi marchent contre le sultanat de Bardera, une communauté religieuse stricte dont les interdictions sur l'esclavage et certains commerces menacent les intérêts commerciaux des Geledi. Cette victoire décisive réaffirme le contrôle des routes commerciales intérieures."
 nd_soi_benadir_prosperity: "Benadir Prospérité"
 nd_soi_benadir_prosperity_desc: "La côte de Benadir atteint l'apogée de sa prospérité commerciale, Mogadiscio, Merca et Barawa servant d'entrepôts pour tout l'océan Indien occidental."
 nd_soi_jubba_development: "Développement de la vallée de Jubba"
 nd_soi_jubba_development_desc: "Le développement agricole s'étend le long de la vallée de la rivière Jubba, transformant des terres autrefois pastorales en terres agricoles productives sous l'administration Geledi."
 nd_soi_geledi_warfare: "Guerre Geledi"
 nd_soi_geledi_warfare_desc: "Le sultanat Geledi affine sa tradition militaire en envoyant une infanterie mobile irrégulière issue des clans de la vallée de Shabelle pour des campagnes rapides à travers la Corne de l'Afrique."
 nd_soi_dual_legal_system: "Double système juridique"
 nd_soi_dual_legal_system_desc: "L’intégration du droit coutumier xeer avec la charia islamique crée un double cadre juridique sophistiqué, dans lequel les anciens des clans et les érudits religieux coopèrent pour régler les différends."
 nd_soi_ivory_trade: "Exportation d'ivoire et de bétail"
 nd_soi_ivory_trade_desc: "Somalia's export economy diversifies, with ivory, livestock, hides, frankincense, and myrrh flowing through the Benadir ports to markets across the Indian Ocean and Red Sea.\n\n#italic Available in: $nd_soi_weaving_house$#!"
 nd_soi_national_awakening: "Réveil national somalien"
 nd_soi_national_awakening_desc: "Une identité somalienne partagée, enracinée dans une langue, une religion et une culture pastorale communes, commence à transcender les divisions claniques, jetant les bases d’une conscience nationale unifiée."
 nd_soi_port_modernization: "Modernisation du port"
 nd_soi_port_modernization_desc: "The harbors of Mogadishu and the Benadir coast are improved to accommodate the larger vessels of the modern era, securing Somalia's continued role in Indian Ocean commerce."
 nd_soi_clan_unification: "Unification des clans"
 nd_soi_clan_unification_desc: "Le processus d'unification des clans somaliens en une structure nationale cohérente, dépassant le système de lignage segmentaire vers un modèle de gouvernance plus centralisé."
 nd_soi_modern_military: "Traditions militaires modernes"
 nd_soi_modern_military_desc: "L'héritage guerrier de la Somalie s'adapte aux exigences de la guerre moderne, combinant l'organisation militaire clanique traditionnelle avec de nouvelles disciplines et tactiques."
 nd_soi_trade_revival: "Reprise du commerce dans l'océan Indien"
 nd_soi_trade_revival_desc: "Les marchands somaliens reprennent leur place dans les réseaux commerciaux de l’océan Indien, tirant parti de siècles de connaissances maritimes et de la position stratégique de la Corne de l’Afrique."
 nd_soi_literary_traditions: "Traditions littéraires et orales"
 nd_soi_literary_traditions_desc: "La tradition orale somalienne, l’une des plus riches d’Afrique, commence à trouver une expression écrite, préservant des siècles de poésie, de généalogie et de droit coutumier pour les générations futures."
 a_nd_soi_horsemen: "Cavaliers somaliens"
 a_nd_soi_horsemen_desc: "Guerriers à cheval des clans somaliens, armés de lances, de sabres et de boucliers. Ces cavaliers emploient des tactiques dévastatrices de délit de fuite, apprises au cours de siècles de raids pastoraux et de campagnes du sultanat d'Adal."
 a_nd_soi_horsemen_levy: "Cavaliers somaliens"
 a_nd_soi_horsemen_levy_desc: "Cavalerie clanique élevée grâce à des systèmes de prélèvement traditionnels, ces guerriers pasteurs forment l'arme de frappe mobile des armées somaliennes."
 a_nd_soi_malassay: "Malassay"
 a_nd_soi_malassay_desc: "The household cavalry of the Adal sultans, the corps from which Imam Ahmad himself rose. Riders in helmet and breastplate on horses shipped in through Zeila, they are the armoured fist behind the clan light horse, and a costly one to keep in the field."
 a_nd_soi_adal_matchlockmen: "Adal Matchlockmen"
 a_nd_soi_adal_matchlockmen_desc: "Musketeers hired in Arabia and lent by the Ottoman governors of Yemen. In 1542 their fire broke the Portuguese at Wofla. Slow to load and slow to bring up, they win by the terror of gunfire on armies that have never stood under it."
 a_nd_soi_coastal_guards: "Gardes côtières de Benadir"
 a_nd_soi_coastal_guards_desc: "Troupes de garnison stationnées dans les tours de guet et les fortifications de la côte de Benadir, entraînées pour défendre Mogadiscio, Merca et Barawa contre les raids maritimes et les incursions portugaises."
 a_nd_soi_geledi_irregulars: "Irréguliers Geledi"
 a_nd_soi_geledi_irregulars_desc: "Infanterie légère rapide du sultanat Geledi, issue des clans de la vallée de Shabelle. Ils excellent dans le déploiement rapide et les tactiques de guérilla sur les zones riveraines du sud de la Somalie."
 n_nd_soi_dhow: "Boutre somalien"
 n_nd_soi_dhow_desc: "Un navire rapide en planches cousues conçu pour affronter les vents de mousson de l'océan Indien. Les boutres somaliens transportent un armement plus petit que les navires européens, mais sont plus rapides et nécessitent moins d'équipage, ce qui les rend idéaux pour le commerce sur de longues distances."
 n_nd_soi_benadir_galley: "Galère de guerre de Benadir"
 n_nd_soi_benadir_galley_desc: "Un robuste navire de guerre côtier construit dans les ports de Mogadiscio et de Merca, conçu pour patrouiller la côte de Benadir et affronter les navires hostiles dans les eaux peu profondes le long de la Corne de l'Afrique."
 nd_soi_limestone_well: "Puits de calcaire d'Ajuran"
 nd_soi_limestone_well_desc: "Grands puits construits en calcaire, faisant partie de l'infrastructure hydraulique du sultanat d'Ajuran. Ces puits et citernes servent les pasteurs nomades de la Corne de l’Afrique depuis des siècles, attirant les colonies et permettant l’agriculture dans les terres arides."
 nd_soi_weaving_house: "Maison de tissage de Mogadiscio"
 nd_soi_weaving_house_desc: "Un atelier où le célèbre tissu Toob Benadir est tissé, teint et préparé pour l'exportation. La tradition du tissage de la côte de Benadir produit des textiles prisés de l'Egypte à l'Inde."
 nd_soi_caravanserai: "Caravansérail somalien"
 nd_soi_caravanserai_desc: "Une halte fortifiée le long des routes commerciales reliant la côte de Benadir à l'intérieur, offrant un abri, de l'eau et des provisions aux marchands et à leur bétail."
 nd_soi_xeer_council: "Salle du Conseil de Xeer"
 nd_soi_xeer_council_desc: "Un lieu de rassemblement où les anciens du clan somalien se réunissent pour négocier et statuer sur le droit coutumier des xeer, réglant les différends sur les droits à l'eau, l'indemnisation du sang et les frontières des clans."
 nd_soi_coastal_watchtower: "Tour de guet côtière"
 nd_soi_coastal_watchtower_desc: "Une tour de pierre construite le long de la côte de Benadir, équipée de vigies qui scrutent l'horizon à la recherche de flottes hostiles. Une partie du système de défense Ajuran contre les incursions navales portugaises."
 nd_soi_mogadishu_mint: "Menthe de Mogadiscio"
 nd_soi_mogadishu_mint_desc: "Une installation de frappe qui produit la monnaie distinctive de Mogadiscio, des pièces portant les noms des sultans. La Monnaie centralise l’hégémonie commerciale de l’empire commercial somalien."
 nd_soi_well_maintenance: "Entretien des puits"
 nd_soi_well_maintenance_desc: "L'entretien des puits de calcaire d'Ajuran nécessite de la pierre pour les réparations du revêtement, des outils pour les travaux d'excavation et du bois pour les échafaudages et l'équipement."
 nd_soi_cloth_dyeing: "Teinture de tissus"
 nd_soi_cloth_dyeing_desc: "Les teintures et les tissus bruts importés sont transformés en toob benadir exquis, des textiles finis prisés dans tout l'océan Indien, de l'Égypte à l'Inde."
 nd_soi_caravan_provisioning: "Approvisionnement des caravanes"
 nd_soi_caravan_provisioning_desc: "Le caravansérail doit être approvisionné en céréales, en bétail et en sel pour nourrir et conserver les provisions des marchands et de leurs animaux le long des routes commerciales intérieures."
 nd_soi_elder_council_upkeep: "Entretien du Conseil des Anciens"
 nd_soi_elder_council_upkeep_desc: "Le maintien du conseil xeer nécessite du bétail pour les festins, de l'encens pour les rassemblements cérémoniels et du papier pour enregistrer le droit coutumier et les décisions."
 nd_soi_watchtower_garrison: "Garnison de la Tour de Guet"
 nd_soi_watchtower_garrison_desc: "La tour de guet côtière nécessite des armes et des pierres pour les fortifications, ainsi que du bois pour les plates-formes de guet et l'équipement de signalisation."
 nd_soi_coin_striking: "Frappe de pièces"
 nd_soi_coin_striking_desc: "L'argent et le cuivre sont frappés dans la monnaie distinctive du sultanat, reconnue dans tout l'océan Indien occidental."
 nd_soi_frankincense_processing: "Traitement de l'encens"
 nd_soi_frankincense_processing_desc: "La préparation et le classement de la résine d'encens destinée à l'exportation, en utilisant un emballage en fibre pour l'emballage, une tradition remontant à l'ancienne terre de Pount."
 nd_soi_hide_curing: "Masquer le durcissement"
 nd_soi_hide_curing_desc: "Les peaux de bétail sont séchées et transformées en cuir, un élément de base de l'économie pastorale somalienne et un produit d'exportation précieux."
 STATIC_MODIFIER_NAME_nd_soi_spirit_of_gurey: "Esprit de Gurey"
 STATIC_MODIFIER_DESC_nd_soi_spirit_of_gurey: "L'esprit de conquête de l'Imam Ahmad Gurey pousse nos guerriers vers l'avant avec une ferveur sacrée et des compétences de cavalerie inégalées."
 STATIC_MODIFIER_NAME_nd_soi_diplomatic_pact: "Pacte diplomatique"
 STATIC_MODIFIER_DESC_nd_soi_diplomatic_pact: "Plutôt que la conquête, nous cherchons à nous renforcer par le biais d’alliances et d’accords commerciaux qui projettent l’influence somalienne à travers l’océan Indien."
 STATIC_MODIFIER_NAME_nd_soi_mogadishu_cloth_dominance: "La domination du tissu à Mogadiscio"
 STATIC_MODIFIER_DESC_nd_soi_mogadishu_cloth_dominance: "Les métiers à tisser de Mogadiscio produisent les tissus les plus fins de l’océan Indien, et nos tisserands font l’envie de l’Égypte et de la Syrie."
 STATIC_MODIFIER_NAME_nd_soi_mogadishu_gold_standard: "Mogadiscio Gold Standard"
 STATIC_MODIFIER_DESC_nd_soi_mogadishu_gold_standard: "Notre monnaie est reconnue et acceptée de l'Arabie jusqu'en Inde, donnant aux commerçants somaliens un avantage sur chaque marché où ils pénètrent."
 STATIC_MODIFIER_NAME_nd_soi_gobroon_agricultural_reform: "Réforme agricole de Gobroon"
 STATIC_MODIFIER_DESC_nd_soi_gobroon_agricultural_reform: "L'investissement de la dynastie Gobroon dans l'agriculture de la vallée de Shabelle transforme l'économie somalienne, rendant l'intérieur fluvial aussi productif que le commerce côtier."
 STATIC_MODIFIER_NAME_nd_soi_gobroon_military_expansion: "Expansion militaire de Gobroon"
 STATIC_MODIFIER_DESC_nd_soi_gobroon_military_expansion: "Le sultanat Geledi projette sa puissance militaire dans toute la Corne de l’Afrique, sécurisant les routes commerciales et soumettant les clans rivaux par la force des armes."
 levy_nd_soi_horsemen: "Cavaliers somaliens"
 levy_nd_soi_horsemen_desc: "Cavalerie de clan issue des nomades pastoraux, porteuse des traditions guerrières à cheval du peuple somalien."
 levy_nd_soi_geledi_irregulars: "Irréguliers Geledi"
 levy_nd_soi_geledi_irregulars_desc: "Infanterie légère issue des clans du sultanat Geledi, spécialisée dans les mouvements rapides à travers le terrain fluvial du sud de la Somalie."
 nd_soi_beeyo_grove: "Frankincense Grove"
 nd_soi_beeyo_grove_desc: "A tapping ground on the limestone scarps above the northern coast, where the wild trees that bleed beeyo and meydi resin belong to the lineages that cut them. The bark is scored, the tears harden for weeks, and the harvest is carried down to the ports of Maydh and Las Khorey."
 nd_soi_resin_tapping: "Resin Tapping"
 nd_soi_resin_tapping_desc: "Tappers score the bark of each tree and return to scrape off the hardened tears, carrying the resin down from the scarps in baskets of woven fiber."
 nd_soi_geledi_granary: "Grenier Geledi"
 nd_soi_geledi_granary_desc: "Une installation de stockage de céréales construite le long de la vallée de Shabelle, faisant partie de l'infrastructure agricole du sultanat de Geledi. Ces greniers assurent la sécurité alimentaire et permettent une production excédentaire pour le commerce."
 nd_soi_benadir_warehouse: "Entrepôt Benadir"
 nd_soi_benadir_warehouse_desc: "Une grande installation de stockage dans les ports de Benadir, contenant des marchandises provenant de l'autre côté de l'océan Indien, des épices d'Inde, des tissus de Mogadiscio, de l'ivoire de l'intérieur, en attente de commerce ou de transbordement."
 nd_soi_madrasa: "Dugsi"
 nd_soi_madrasa_desc: "A Quran school kept by a wadaad. Children learn their letters on wooden tablets by the Somali names for the Arabic vowels, a method tradition credits to Sheikh Yusuf al-Kawneyn."
 nd_soi_bardic_hall: "Salle des Bardiques"
 nd_soi_bardic_hall_desc: "Un lieu de rassemblement où les poètes et conteurs somaliens préservent et interprètent les riches traditions orales de leur peuple, les généalogies, le droit coutumier, les poèmes héroïques et la sagesse des aînés."
 n_nd_soi_merchant_vessel: "Navire marchand somalien"
 n_nd_soi_merchant_vessel_desc: "Un navire commercial rapide de l'océan Indien conçu pour les longues routes de mousson entre la côte de Benadir, l'Arabie et l'Inde. Plus rapide que les navires européens de taille comparable, mais plus légèrement armé."
 a_nd_soi_modern_cavalry: "Cavalerie moderne somalienne"
 a_nd_soi_modern_cavalry_desc: "Des guerriers à cheval modernisés alliant les compétences traditionnelles de la cavalerie somalienne à de nouvelles armes et tactiques, servant d'éclaireurs et de raiders rapides à l'ère de la guerre moderne."
 nd_soi_grain_storage: "Stockage des céréales"
 nd_soi_grain_storage_desc: "Le grenier nécessite un approvisionnement constant en céréales pour reconstituer les réserves, des récipients en poterie pour un stockage scellé et des outils pour l'entretien des installations."
 nd_soi_goods_handling: "Manutention des marchandises"
 nd_soi_goods_handling_desc: "L'entrepôt a besoin de bois pour les caisses et les étagères, de poterie pour les récipients de stockage scellés et d'outils pour les travaux de chargement et de réparation afin de conserver les diverses marchandises du commerce de l'océan Indien."
 nd_soi_scholarly_endowment: "School Upkeep"
 nd_soi_scholarly_endowment_desc: "The school needs paper for its older students, cloth for the teacher's keep, and incense for the mosque it stands beside."
 nd_soi_bardic_patronage: "Patronage bardique"
 nd_soi_bardic_patronage_desc: "L'entretien de la salle bardique nécessite du bétail pour les festins, du tissu pour les vêtements de cérémonie et les décorations de la salle, ainsi que de la bière pour les rassemblements communautaires qui perpétuent la tradition orale."
 nd_soi_ivory_grading: "Classement de l'ivoire"
 nd_soi_ivory_grading_desc: "Les défenses en ivoire brut sont classées et sculptées pour en faire des articles de luxe destinés à l'exportation, un artisanat spécialisé qui coûte le plus cher sur les marchés de l'océan Indien."
 nd_soi_formed_tt: "La Somalie a été formée"
 nd_soi_path_a_tt: "Choisissez la Perle de l'Océan Indien"
 nd_soi_path_b_tt: "Choisissez les seigneurs des eaux"
 nd_soi_destiny: "Destin somalien"
 nd_soi_destiny_desc: "Avec l’unification de la Somalie, les bases d’un objectif plus ambitieux sont posées. Que les vents de mousson portent nos boutres à la gloire ou que les puits de l’intérieur soutiennent un empire, le peuple somalien est prêt à façonner la Corne de l’Afrique et l’océan Indien au-delà."
 nd_soi_dest_aden_gateway: "Porte d'Aden"
 nd_soi_dest_aden_gateway_desc: "The Bab-el-Mandeb strait controls all trade between the Indian Ocean and the Red Sea. By securing Aden and raising Zeila from a landing place into a town, Somalia commands the chokepoint of maritime commerce that has enriched the region since the days of the Land of Punt."
 nd_soi_dest_zeila_town_tt: "#bold Zeila#! is ours and has grown into a town"
 nd_soi_dest_swahili_reach: "Portée swahili"
 nd_soi_dest_swahili_reach_desc: "De Mogadiscio à Kilwa, la flotte marchande somalienne étend ses réseaux commerciaux de mousson le long de toute la côte est-africaine, établissant ainsi une domination commerciale sur les cités-États swahilies qui commerçaient autrefois sur un pied d’égalité."
 nd_soi_dest_ocean_dominion: "Domination de l'Océan"
 nd_soi_dest_ocean_dominion_desc: "L'océan Indien est une mer somalienne. D’Aden à Zanzibar, de Mombasa aux marchés aux épices de l’Est, les marchands et navires de guerre somaliens contrôlent les routes commerciales qui soutiennent les empires. La perle de l'Océan Indien en est devenue la maîtresse."
 nd_soi_dest_highland_conquest: "Conquête des hautes terres"
 nd_soi_dest_highland_conquest_desc: "Following in the footsteps of Imam Ahmad Gurey, Somali forces push into the Ethiopian highlands. The ancient city of Gondar falls, and with it the myth of Ethiopian invincibility. The hydraulic state, its wells and canals grown around Merca on the Shabelle, expands its reach to the mountain springs that feed the Nile."
 nd_soi_dest_merca_developed_tt: "#bold Merca#! is ours and has reached a development of 18"
 nd_soi_dest_empire_consolidation: "Consolidation Impériale"
 nd_soi_dest_empire_consolidation_desc: "Les églises rupestres de Lalibela et la cour fortifiée d'Ankober dépendent désormais de l'autorité somalienne. Une armée professionnelle sécurise le vaste territoire, tandis que la tradition Ajuran de gouvernance centralisée lie les hauts plateaux conquis au cœur de la Somalie."
 nd_soi_dest_horn_master: "Maître du cor"
 nd_soi_dest_horn_master_desc: "Avec Massawa et Suakin sous contrôle somalien, toute la Corne de l’Afrique, depuis la côte de la mer Rouge jusqu’à l’océan Indien, relève d’une seule puissance. Les seigneurs des eaux sont également devenus les seigneurs des terres, commandant un empire depuis les affluents du Nil jusqu’aux mers de mousson."
 nd_soi.7.t: "Un destin forgé"
 nd_soi.7.d: "The unification of the Somali clans was only the beginning. Before us lies a choice already made, whether to look outward across the waves or inward across the arid plains. The path is set. Now we must walk it.\n\nFrom the ancient ports that knew the pharaohs' ships to the caravan routes where frankincense still perfumes the air, the Somali nation has the means to build something that will endure. Our poets will sing of what comes next for generations."
 nd_soi.7.a: "Que le voyage commence."
 nd_soi.8.t: "La porte des larmes"
 nd_soi.8.d: "Bab-el-Mandeb, the Gate of Tears, is ours. The narrow strait where the Red Sea meets the Indian Ocean has been a chokepoint of world trade since the time of Solomon and Sheba. Now Somali customs collectors greet every vessel that passes between Arabia and Africa.\n\nFrom Aden's harbor, our merchants can reach Egypt, India, and the Spice Islands. The incense that once made this land the Punt of legend now flows through markets we control. The first link in a chain that will stretch across the ocean has been forged."
 nd_soi.8.a: "Chaque navire qui passe paie son dû."
 nd_soi.9.t: "La côte swahili"
 nd_soi.9.d: "Somali dhows now anchor in the harbors of Kilwa and Lamu, ports that once rivaled Mogadishu in the Indian Ocean trade. The Swahili coast, with its coral-stone cities and gold-dust commerce, has been brought into the Somali trading sphere.\n\nOur captains know these waters as well as their own, the monsoon winds that fill their sails were charted by their grandfathers. But extending our reach this far south demands new methods. Shall we rely on intelligence networks and hired swords, or assert our dominance through the power of our fleet?"
 nd_soi.9.a: "Placez nos agents dans chaque port."
 nd_soi.9.b: "Nos navires de guerre maintiendront la paix."
 nd_soi.10.t: "Seigneurs de la mousson"
 nd_soi.10.d: "From Aden to Zanzibar, from the Red Sea to the Swahili coast, the Indian Ocean trade flows through Somali hands. What the Portuguese and Ottomans fought over for centuries, we have claimed through the mastery of wind and wave that our people have possessed since before the world's great religions were born.\n\nThe pearl of the Indian Ocean has become its crown. Our trading houses in Mogadishu, Kilwa, and Mombasa set the prices that merchants from Cairo to Calicut must accept. But how shall we govern this vast maritime domain, through the soft power of diplomacy and reputation, or through the hard calculus of commercial monopoly?"
 nd_soi.10.a: "Que notre nom impose le respect dans tous les tribunaux."
 nd_soi.10.b: "L’or parle plus fort que les diplomates."
 nd_soi.11.t: "La marche sur Gondar"
 nd_soi.11.d: "The Ethiopian highlands, unconquered for millennia, have fallen to Somali arms. Gondar, the city of castles built by Emperor Fasilides, now flies our banner. The achievement surpasses even the great Imam Ahmad Gurey's campaigns, for where he swept through and withdrew, we have come to stay.\n\nThe rivers that flow from these mountains, tributaries of the Nile itself, now pass through lands we control. The Ajuran dream of a hydraulic empire, once confined to the wells and canals of the Somali lowlands, has expanded to encompass the very source of the region's waters."
 nd_soi.11.a: "Les hauts plateaux se plient à notre volonté."
 nd_soi.12.t: "Le regroupement"
 nd_soi.12.d: "Lalibela's churches and Ankober's fortress mark the extent of an empire that stretches from the Indian Ocean to the Ethiopian plateau. Holding this vast territory demands more than military force, it requires the administrative discipline the Ajuran perfected and the faith that binds our people.\n\nThe conquered highland peoples are diverse in language and religion. Some may be won through the sword of faith, others through the steady hand of garrison rule. How shall we bind this empire together?"
 nd_soi.12.a: "La foi du Prophète unit tous les peuples."
 nd_soi.12.b: "L'ordre vient de la force, pas des sermons."
 nd_soi.13.t: "Maître de la Corne de l'Afrique"
 nd_soi.13.d: "From Suakin on the Red Sea to the monsoon coast of the Indian Ocean, the entire Horn of Africa answers to Somali authority. Massawa, the ancient port that connected Aksum to the world, now serves a new empire. The lords of the waters have become lords of all they survey.\n\nNo power in East Africa can challenge us. The question now is what kind of empire we shall be, one that grows fat on the spoils of conquest, or one that brings order and prosperity to the lands under our rule."
 nd_soi.13.a: "Que le vaincu enrichisse le conquérant."
 nd_soi.13.b: "Nous apportons la paix d'une main forte."
 STATIC_MODIFIER_NAME_nd_soi_dest_merchant_intelligence: "Intelligence marchande"
 STATIC_MODIFIER_DESC_nd_soi_dest_merchant_intelligence: "Les maisons de commerce somaliennes servent de réseaux de renseignement, collectant des informations depuis tous les ports de l’océan Indien. Nos marchands sont nos espions, et nos espions sont partout."
 STATIC_MODIFIER_NAME_nd_soi_dest_naval_hegemony: "Hégémonie navale"
 STATIC_MODIFIER_DESC_nd_soi_dest_naval_hegemony: "Les navires de guerre somaliens patrouillent sur les voies commerciales de l’océan Indien, renforçant notre domination commerciale avec la menace de la force navale. Une flotte qui protège le commerce n’a pas à craindre les coûts de maintenance."
 STATIC_MODIFIER_NAME_nd_soi_dest_monsoon_diplomacy: "Diplomatie de la mousson"
 STATIC_MODIFIER_DESC_nd_soi_dest_monsoon_diplomacy: "Le prestige de maîtriser le commerce de l'océan Indien donne aux diplomates somaliens un poids dans chaque négociation. Notre parole porte loin et notre portée s’étend plus loin."
 STATIC_MODIFIER_NAME_nd_soi_dest_commercial_supremacy: "Suprématie commerciale"
 STATIC_MODIFIER_DESC_nd_soi_dest_commercial_supremacy: "Les richesses de l’océan Indien transitent par les marchés somaliens et nos réseaux commerciaux réduisent le coût de tout, des armées aux opérations bancaires."
 STATIC_MODIFIER_NAME_nd_soi_dest_holy_warriors: "Guerriers sacrés"
 STATIC_MODIFIER_DESC_nd_soi_dest_holy_warriors: "L’esprit du jihad qui a poussé Ahmad Gurey à s’installer dans les hauts plateaux éthiopiens perdure. Nos soldats combattent avec le zèle de la foi, et le prix d’une guerre juste est supporté avec joie."
 STATIC_MODIFIER_NAME_nd_soi_dest_garrison_state: "État de garnison"
 STATIC_MODIFIER_DESC_nd_soi_dest_garrison_state: "Les vastes conquêtes de la Corne exigent une approche systématique de l’administration militaire, avec des garnisons, un recrutement rapide et un commandement centralisé unissant l’empire."
 STATIC_MODIFIER_NAME_nd_soi_dest_plunder_of_empires: "Pillage des empires"
 STATIC_MODIFIER_DESC_nd_soi_dest_plunder_of_empires: "La richesse des empires conquis enrichit l’État somalien, à mesure que les trésors et les temples de la Corne rapportent leurs siècles de richesses accumulées."
 STATIC_MODIFIER_NAME_nd_soi_dest_pax_somalis: "Pax Somaliens"
 STATIC_MODIFIER_DESC_nd_soi_dest_pax_somalis: "Sous la domination somalienne, les divers peuples de la Corne de l’Afrique trouvent une certaine mesure d’ordre et de stabilité. La conversion, une gouvernance de qualité et la discipline militaire soutiennent la paix."
 nd_soi_ocean_trading_house: "Maison de commerce de l'océan Indien"
 nd_soi_ocean_trading_house_desc: "Un grand établissement commercial combinant entrepôt, comptoir et salle de réception diplomatique, à partir duquel les marchands somaliens coordonnent les échanges commerciaux dans tout le bassin de l'océan Indien."
 nd_soi_imperial_cistern: "Citerne Impériale"
 nd_soi_imperial_cistern_desc: "Un complexe monumental de stockage d'eau dans la tradition Ajuran, conçu pour servir un empire. Ces vastes citernes collectent et distribuent l'eau à travers les territoires conquis, étendant ainsi le contrôle de l'État hydraulique au-delà du cœur de la Somalie."
 nd_soi_ocean_trade_coordination: "Coordination du commerce maritime"
 nd_soi_ocean_trade_coordination_desc: "La gestion du commerce dans l’océan Indien nécessite du papier pour les contrats et les manifestes, du tissu fin pour les cadeaux diplomatiques et de l’encens pour les cérémonies qui scellent les accords commerciaux."
 nd_soi_cistern_engineering: "Ingénierie des citernes"
 nd_soi_cistern_engineering_desc: "La citerne impériale nécessite de la pierre pour la construction et le revêtement, des outils pour les travaux d'excavation et de maçonnerie, ainsi que du bois pour les échafaudages et les canaux d'aqueduc."

# ===== BUREAUCRACY =====
 AUTO_MODIFIER_NAME_nd_soi_bureaucracy_authority: "Appareil du cor"
 AUTO_MODIFIER_DESC_nd_soi_bureaucracy_authority: "The institutions of the Somali state (the Ajuran hydraulic imamate, the Walashma sultanic court, the xeer customary law of the clan elders, the Sufi tariqa networks of Quranic learning, the abbaan caravan-protection of the inland trade, and the maritime sultanates of the Bari and Benadir coasts) have matured into a coherent administrative apparatus. From this foundation Somalia's distinctive institutions of clan, faith, and commerce begin to take their durable form."
 soi_ajuran_hydraulic_administration_bureaucracy: "Administration hydraulique d'Ajuran"
 soi_ajuran_hydraulic_administration_bureaucracy_desc: "Les dirigeants Gareen du sultanat d'Ajuran (XIIIe-XVIIe siècles) imposèrent le seul empire hydraulique que l'Afrique puisse produire, monopolisant les rivières Shabelle et Jubba grâce à des puits artificiels, des digues et des canaux d'irrigation construits par des creuseurs spécialisés de Madinle. L'imam régnait par l'intermédiaire de wazirs, d'émirs et de naa'ibs, fut le premier à imposer un système régulier de tribut aux éleveurs et agriculteurs des environs et frappa des pièces de bronze portant son nom dans l'arrière-pays de Mogadiscio. Le système a survécu sous une forme modifiée jusqu'au 19e siècle ; sa logique fiscale a été héritée par chaque État somalien successeur, mais au prix d’un ressentiment permanent de la part de l’intérieur du clan non irrigué."
 soi_walashma_sultanate_court_bureaucracy: "Cour du sultanat de Walashma"
 soi_walashma_sultanate_court_bureaucracy_desc: "La dynastie Walashma régnait sur Ifat (1285-1415) et son successeur Adal (1415-1577) depuis Zeila et Harar, ce dernier fortifié et frappant sa propre monnaie. Le sultan était le souverain nominal de Walashma, issu d'une lignée du XIIIe siècle remontant à Wali Asma ; dans la pratique, les émirs gouvernaient les provinces, et à partir de 1471, lorsque l'émir Laday Usman s'empara de Dakkar, le véritable pouvoir appartenait à l'émir Harari qui détenait le palais tandis que le sultan gardait la forme cérémonielle. Le tribunal diwan des cadis, sanctionné par l'émir et conseillé par les érudits de Kabir, appliquait la charia dans les affaires civiles et pénales et liait la population musulmane urbaine au trône."
 soi_xeer_shir_beeleed_bureaucracy: "Xeer et le Shir Beeleed"
 soi_xeer_shir_beeleed_bureaucracy_desc: "Le droit coutumier somalien non écrit, transmis oralement et entré bilatéralement entre les clans adjacents par l'intermédiaire de leurs aînés. Les différends sont résolus lors du shir beeleed, l'assemblée du clan en plein air où tout homme adulte peut prendre la parole et où les anciens xeer begti jugent selon le précédent. L'indemnisation est versée en mag (ou diya), versée par le groupe de la lignée du délinquant payant le mag à la famille de la victime sous forme de bétail, de chameaux ou de pièces de monnaie. Le système ne nécessite aucun État central, est antérieur aux sultanats, leur survit à tous et reste la loi de facto dans une grande partie de l’intérieur de la Somalie. La couronne ne peut la supplanter sans briser la légitimité des clans."
 soi_sufi_tariqa_network_bureaucracy: "Réseau Soufi Tariqa"
 soi_sufi_tariqa_network_bureaucracy_desc: "La Qadiriyya, l'ordre soufi sunnite le plus ancien et le plus important de Somalie à partir du XIIIe siècle, et la Salihiyya fondée par Sayyid Muhammad Salih (1854-1919) et propagée dans la région de Jowhar par Muhammad Gulid (mort en 1918) et dans le Moyen Juba par Isma'il ibn Ishaq al-Urwayni. Les confréries dirigeaient les écoles coraniques du royaume, négociaient les conflits entre clans par le biais d'un arbitrage cheikhly et reliaient la côte et l'intérieur de la Somalie au monde islamique plus large de l'océan Indien par le biais de leurs chaînes de descendance spirituelle silsila. Au XIXe siècle, les réseaux de tariqa étaient les seules institutions à atteindre toutes les communautés somaliennes, chevauchant la carte clanique sans toutefois coïncider avec elle."
 soi_abbaan_caravan_brokerage_bureaucracy: "Courtage de caravanes Abbaan"
 soi_abbaan_caravan_brokerage_bureaucracy_desc: "L'institution somalienne de protection des caravanes par laquelle un commerçant étranger ou de l'intérieur du pays ne pouvait pas se déplacer à l'intérieur des terres sans obtenir un abbaan, un hôte-protecteur issu du clan local dont le territoire la caravane traverserait. L'abbaan garantissait un passage sûr, réglait les différends locaux et organisait le ravitaillement en échange d'une part des tâches ; la lignée religieuse Reer Mumin, répartie sur la route allant de Mogadiscio à Luuq, donnait des sanctions religieuses et jugeait les différends commerciaux moyennant des honoraires. Le système gérait l’ensemble du commerce intérieur de l’ivoire, des peaux, de l’encens et des esclaves sans État, gardant la richesse entre les mains du clan au détriment de toute recette douanière centralisée."
 soi_boqor_of_the_coast_bureaucracy: "Boqor de la Côte"
 soi_boqor_of_the_coast_bureaucracy_desc: "Le modèle de sultanat maritime centralisé perfectionné par les Majeerteen sur la côte de Bari sous Boqor Osman Mahamuud (r. ca. 1844-1929), avec des antécédents dans l'ancien sultanat de Mogadiscio de Fakr ad-Din. Les Boqor prélevaient des droits de douane sur l'encens, la pêche et le transport maritime dans l'océan Indien qui touchaient Bosaso, Alula et Bandar Ziada, appliquaient la loi sur le sauvetage des épaves, exemptaient les éleveurs locaux de maintenir leur loyauté envers le clan et signaient des traités avec les envoyés britanniques et italiens en tant qu'égal souverain. Tous les organes d'un État maritime intégré, mais ancrés sur la côte tandis que l'intérieur restait la propriété du xeer."
