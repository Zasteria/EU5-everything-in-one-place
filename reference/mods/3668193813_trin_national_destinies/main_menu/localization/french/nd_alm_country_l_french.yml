 ALM_f: "Califat almohade"
 ALM_f_desc: "Le califat almohade (al-Muwa??idun, « ceux qui affirment l'unité divine ») était l'empire berbère musulman qui succéda aux Almoravides et unifia le Maghreb et al-Andalus sous un seul règne depuis sa capitale Marrakech. Fondée sur le mouvement de réforme religieuse d'Ibn Tumart et consolidée par Abd al-Mu'min, à son apogée sous Yaqub al-Mansur, elle s'étendait des côtes atlantiques du Maroc jusqu'à la Tripolitaine et vers le nord jusqu'à la péninsule ibérique, où Séville servait de siège péninsulaire. État sunnite du Maghreb avec Marrakech et Fès comme noyau, il a besoin du noyau almohade d’Afrique du Nord ; la réunification d'al-Andalus est la prérogative du calife, et non sa condition préalable."
