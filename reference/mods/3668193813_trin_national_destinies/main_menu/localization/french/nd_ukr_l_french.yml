l_french:
 STATIC_MODIFIER_NAME_nd_ukr_sich_republic: "République de Sich"
 STATIC_MODIFIER_DESC_nd_ukr_sich_republic: "La Rada a parlé. La Ruthénie sera gouvernée comme le voulaient les ancêtres cosaques, par la libre assemblée des guerriers, où chacun porte un sabre et un vote. La tradition Sich perdure."
 STATIC_MODIFIER_NAME_nd_ukr_breadbasket: "Le grenier de l'Europe"
 STATIC_MODIFIER_DESC_nd_ukr_breadbasket: "La terre noire donne sa générosité. Du Dniepr au Dniestr, les céréales ruthènes nourrissent le continent et la richesse de leurs récoltes construit une civilisation durable."
 STATIC_MODIFIER_NAME_nd_ukr_cossack_autonomy: "Autonomie cosaque"
 STATIC_MODIFIER_DESC_nd_ukr_cossack_autonomy: "L'Hetmanat est indépendant. L'armée cosaque ne répond à aucun souverain étranger et la rada gouverne comme l'exigent les anciennes libertés."
 STATIC_MODIFIER_NAME_nd_ukr_pereiaslav_compact: "Pacte de Pereiaslav"
 STATIC_MODIFIER_DESC_nd_ukr_pereiaslav_compact: "Grâce à une alliance avec une grande puissance, l’Hetmanat sécurise ses frontières et accède à des ressources qu’aucun État frontalier ne pourrait rassembler seul."
 STATIC_MODIFIER_NAME_nd_ukr_orthodox_scholarship: "Bourse orthodoxe"
 STATIC_MODIFIER_DESC_nd_ukr_orthodox_scholarship: "L’Académie devient une forteresse de savoir orthodoxe, formant un clergé et des érudits qui défendent la foi par la raison et l’érudition."
 STATIC_MODIFIER_NAME_nd_ukr_western_learning: "Apprentissage occidental"
 STATIC_MODIFIER_DESC_nd_ukr_western_learning: "Adoptant la méthode jésuite et le programme latin, l'Académie relie l'Orient et l'Occident, apportant le savoir européen au monde orthodoxe."
 nd_ukr.1.t: "La naissance de la Ruthénie"
 nd_ukr.1.d: "Kyiv stands once more as the capital of a Ruthenian state. From the rapids of the Dnieper to the forests of Volhynia, the scattered principalities and Cossack hosts have been united under one banner. But what kind of nation shall this be? The Zaporozhian tradition calls for a warrior republic, a land where every Cossack is equal in the rada and where the sabers of the Sich guard the frontier against all comers. Yet the black earth speaks a different promise: the richest soil in Europe, capable of feeding empires. Shall Ruthenia be defined by the saber or by the plow?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ukr.1.a: "Laissons la Sich Rada gouverner. Nous sommes des guerriers avant tout !"
 nd_ukr.1.b: "La terre noire sera notre richesse et notre destin."
 nd_ukr.2.t: "Le soulèvement de Khmelnitski"
 nd_ukr.2.d: "L'armée cosaque s'est levée. Sous Bohdan Khmelnytsky, les cosaques zaporogues ont brisé les armées envoyées pour les subjuguer, remportant victoire sur victoire à Jovti Vody, Korsun et Pyliavtsi. L’ordre ancien est rompu. Pour la première fois, un Hetmanat cosaque gouverne un État indépendant au cœur de l’Europe. Mais ce triomphe soulève une question qui résonnera pendant des générations : l’Hetmanat peut-il résister seul aux empires qui l’entourent, ou doit-il rechercher la protection d’une puissance plus grande ? À Pereiaslav, les envoyés proposent une alliance qui garantirait les frontières mais lierait le destin de la nation à un autre trône."
 nd_ukr.2.a: "L'Hetmanat doit tenir debout par ses propres forces !"
 nd_ukr.2.b: "Signez le traité. Nos frontières ont besoin de garanties."
 nd_ukr.3.t: "L'Académie Kyiv-Mohyla"
 nd_ukr.3.d: "En 1632, le métropolite Petro Mohyla transforma une modeste école confrérie en quelque chose d'inédit, la première institution orthodoxe d'enseignement supérieur dans tous les pays slaves orientaux. Prenant comme modèle les collèges jésuites de Pologne, Mohyla a créé un programme qui mariait l'érudition latine et la théologie orthodoxe. La bibliothèque de l'Académie contient huit mille volumes, presque tous en latin, ouvrant une fenêtre sur la philosophie, la science et les lettres occidentales qu'aucune institution orthodoxe n'avait proposée auparavant. Les diplômés dirigent ensuite des églises, conseillent des hetmans et transmettent leurs connaissances à travers l’Europe de l’Est. La question est de savoir à quoi servira cet apprentissage : à la défense de la tradition orthodoxe ou à l’adoption de l’innovation occidentale ?"
 nd_ukr.3.a: "L'Académie sera un rempart de la foi orthodoxe."
 nd_ukr.3.b: "Apprenons de l’Occident et surpassons-les."
 nd_ukr.4.t: "La flotte Tchaïka"
 nd_ukr.4.d: "Depuis les rapides du Dniepr, part une flotte de chaikas, bateaux légers et rapides, taillés dans des troncs d'arbres et équipés de fauconets. Chacun transporte cinquante guerriers entraînés à l’art des embuscades navales. Ces pillards cosaques sont devenus la terreur de la mer Noire, frappant les ports ottomans de Trabzon à Sinop et apparaissant même devant les murs d'Istanbul lui-même. En 1615, quatre-vingts chaikas transportant quatre mille Cosaques traversèrent la mer Noire et incendièrent les faubourgs de la capitale ottomane. Les amiraux du sultan, commandant des galères trois fois plus grandes, ne peuvent attraper ces fantômes qui attaquent à l'aube et disparaissent à la tombée de la nuit."
 nd_ukr.4.a: "La mer Noire tremble à la vue de nos voiles !"
 nd_ukr.5.t: "L'âge d'or de Mazepa"
 nd_ukr.5.d: "Sous l'hetman Ivan Mazepa, l'Hetmanat entre dans son âge d'or. Mécène doté d’une vision extraordinaire, Mazepa investit ses richesses dans les églises, les monastères et l’Académie de Kiev-Mohyla, où les inscriptions dépassent les deux mille étudiants. L’architecture baroque ukrainienne distinctive, exubérante, colorée et provocante, s’élève à travers le pays. Les tribunaux de l'Hetmanat administrent la justice, ses imprimeries publient des ouvrages théologiques et savants, et ses officiers cosaques deviennent une élite cultivée qui rivalise en sophistication avec la szlachta polonaise. Il s’agit d’une brève et brillante floraison de la civilisation ruthène."
 nd_ukr.5.a: "Que cet âge d’or perdure !"
 nd_ukr_ruthenian_principalities: "Principautés ruthènes"
 nd_ukr_ruthenian_principalities_desc: "Les principautés ruthènes fragmentées (Halytch, Volhynie, Kiev) portent l'héritage de la Russie kiévienne, préservant les traditions slaves de gouvernance princière et de diplomatie interdynastique."
 nd_ukr_frontier_warriors: "Guerriers de la frontière"
 nd_ukr_frontier_warriors_desc: "À la frontière de la steppe, les guerriers ruthènes développent les compétences de combat à cheval qui définiront la tradition militaire cosaque pendant des siècles."
 nd_ukr_black_earth: "Terre noire"
 nd_ukr_black_earth_desc: "Le chernozem, terre noire, de la steppe ruthène est le sol agricole le plus riche d'Europe, capable de produire des récoltes qui nourrissent des empires entiers."
 nd_ukr_kyivan_heritage: "Patrimoine de Kiev"
 nd_ukr_kyivan_heritage_desc: "L'héritage spirituel du baptême de la Russie et des grandes églises de Kiev perdure, liant les terres ruthènes à leur identité chrétienne orthodoxe."
 nd_ukr_steppe_horsemanship: "Équitation des steppes"
 nd_ukr_steppe_horsemanship_desc: "Les cavaliers ruthènes adoptent les techniques de conduite des nomades des steppes, élevant des montures robustes et entraînant une cavalerie légère capable de parcourir de longues distances à travers les prairies."
 nd_ukr_sich_democracy: "La démocratie sich"
 nd_ukr_sich_democracy_desc: "Le Sich zaporozhien développe une démocratie militaire unique en Europe, une république de guerriers où l'assemblée générale élit tous les officiers et l'hetman lui-même."
 nd_ukr_chumak_routes: "Itinéraires Chumak"
 nd_ukr_chumak_routes_desc: "Les Chumaks, commerçants cosaques itinérants, conduisent leurs chariots tirés par des bœufs à travers la steppe, transportant du sel de Crimée et des céréales de l'intérieur le long de couloirs commerciaux établis."
 nd_ukr_rada_tradition: "Rada Tradition"
 nd_ukr_rada_tradition_desc: "La Rada cosaque, le conseil militaire général, établit des précédents de prise de décision collective qui contraignent même les hetmans les plus puissants."
 nd_ukr_kuren_system: "Système Kuren"
 nd_ukr_kuren_system_desc: "Le kurin, la compagnie cosaque de base composée de cinquante à cent guerriers, sert à la fois d'unité militaire et d'institution sociale, chacun élisant son propre ataman."
 nd_ukr_dnipro_fisheries: "Pêcheries du Dniepr"
 nd_ukr_dnipro_fisheries_desc: "The Dnieper and its tributaries teem with fish and waterfowl, sustaining the Cossack way of life and supporting a tradition of mead-brewing from steppe honey.\n\n#italic Available in: $nd_ukr_medovarnia$#!"
 nd_ukr_border_militia: "Milice frontalière"
 nd_ukr_border_militia_desc: "The men of the frontier towns and villages take their turn at the field watch, riding out to the grave mounds above the Tatar trails. When the smoke rises, the watch gathers on foot to harry the raiders and free their captives."
 nd_ukr_chaika_raiders: "Les pillards de Tchaïka"
 nd_ukr_chaika_raiders_desc: "La chaika, un bateau de guerre léger sculpté dans un seul tronc et armé de fauconets, permet aux raids cosaques d'attaquer les ports ottomans de la mer Noire à une vitesse dévastatrice."
 nd_ukr_black_sea_raids: "Raids en mer Noire"
 nd_ukr_black_sea_raids_desc: "Des flottes cosaques comptant jusqu'à trois cents chaikas terrorisent la côte ottomane de la mer Noire, attaquant de Trabzon jusqu'à la banlieue d'Istanbul même."
 nd_ukr_tabor_warfare: "Guerre du Thabor"
 nd_ukr_tabor_warfare_desc: "The tabor, a mobile fortress of chained wagons, allows Cossack armies to defend against superior cavalry forces by creating instant field fortifications."
 nd_ukr_brotherhood_schools: "Écoles de la Fraternité"
 nd_ukr_brotherhood_schools_desc: "Les confréries orthodoxes créent des écoles dans les villes ruthènes, enseignant l'alphabétisation, la théologie et les langues classiques pour défendre la foi contre le prosélytisme catholique."
 nd_ukr_salt_trade: "Commerce du sel"
 nd_ukr_salt_trade_desc: "Le sel de Crimée, transporté vers le nord par les caravanes Chumak, devient un élément de base du commerce ruthène, enrichissant les villes commerçantes le long du Dniepr."
 nd_ukr_zaporozhian_fleet: "Flotte zaporozhienne"
 nd_ukr_zaporozhian_fleet_desc: "Les forces navales organisées de l'armée zaporozhienne entretiennent des chantiers navals permanents le long du Dniepr, capables de lancer des expéditions de raid à travers la mer Noire."
 nd_ukr_khmelnytsky_uprising: "Insurrection de Khmelnitski"
 nd_ukr_khmelnytsky_uprising_desc: "La rébellion de Bohdan Khmelnytsky en 1648 brise l'ordre ancien et crée un Hetmanat cosaque indépendant, le premier État ruthène depuis des siècles."
 nd_ukr_registered_cossack_army: "Armée cosaque enregistrée"
 nd_ukr_registered_cossack_army_desc: "Le système des Cosaques enregistrés transforme les guerriers frontaliers irréguliers en une armée permanente disciplinée organisée en régiments de polk sous la direction de polkovnyks professionnels."
 nd_ukr_hetmanate_governance: "Gouvernance de l'Hetmanate"
 nd_ukr_hetmanate_governance_desc: "L'Hetmanat cosaque développe un système administratif sophistiqué avec des élus, des codes de lois écrits et une bureaucratie militaire."
 nd_ukr_mohyla_learning: "Tradition de l’Académie Mohyla"
 nd_ukr_mohyla_learning_desc: "L'Académie de Kiev-Mohyla, la première institution orthodoxe d'enseignement supérieur du monde slave oriental, forme des membres du clergé, des diplomates et des érudits qui façonnent la vie intellectuelle ruthène."
 nd_ukr_orthodox_brotherhoods: "Fraternités orthodoxes"
 nd_ukr_orthodox_brotherhoods_desc: "Lay Orthodox confraternities organize schools, printing presses, and charitable works. The Dormition Brotherhood of Lviv bought the press of Ivan Fedorov and printed in Church Slavonic from 1591."
 nd_ukr_grain_export: "Exportation de céréales"
 nd_ukr_grain_export_desc: "Ruthenian grain, produced in staggering quantities from the black earth, enters European markets via the Dnieper and overland trade routes.\n\n#italic Available in: $nd_ukr_chernozem_estate$#!"
 nd_ukr_mazepa_golden_age: "L'âge d'or de Mazepa"
 nd_ukr_mazepa_golden_age_desc: "Sous l'hetman Ivan Mazepa, l'Hetmanate connaît un extraordinaire épanouissement culturel, les églises, les académies et les imprimeries prolifèrent à travers le pays."
 nd_ukr_regimental_system: "Système régimentaire"
 nd_ukr_regimental_system_desc: "Le polkova systema, le système territorial régimentaire, organise l'Hetmanat en districts militaro-administratifs, chacun fournissant des troupes et une gouvernance."
 nd_ukr_sloboda_settlement: "Colonie de Sloboda"
 nd_ukr_sloboda_settlement_desc: "Sloboda, des colonies libres et exonérées d'impôts, attirent des colons à la frontière, peuplant les terres vides des steppes avec des communautés agricoles."
 nd_ukr_cossack_constitution: "Constitution cosaque"
 nd_ukr_cossack_constitution_desc: "La Constitution de Pylyp Orlyk de 1710, parmi les plus anciennes d'Europe, codifie les droits des Cosaques et limite le pouvoir de l'Hetman par des principes constitutionnels."
 nd_ukr_steppe_cavalry_tactics: "Tactiques de cavalerie des steppes"
 nd_ukr_steppe_cavalry_tactics_desc: "Les tactiques évolutives de la cavalerie cosaque allient la tradition nomade des steppes à la science militaire européenne, produisant des cavaliers légers d'une vitesse et d'une puissance de frappe exceptionnelles."
 nd_ukr_national_awakening: "Réveil national"
 nd_ukr_national_awakening_desc: "Le réveil national ruthène voit les poètes, les érudits et les historiens redécouvrir et célébrer l'identité, la langue et l'héritage culturel ruthènes distincts."
 nd_ukr_modern_agriculture: "Agriculture moderne"
 nd_ukr_modern_agriculture_desc: "Les méthodes agricoles scientifiques appliquées à l'incomparable chernozem transforment la Ruthénie en le grenier de l'Europe, les exportations de céréales alimentant le continent."
 nd_ukr_kobzar_tradition: "Tradition Kobzar"
 nd_ukr_kobzar_tradition_desc: "The kobzari, blind wandering minstrels who sing the epic dumy, preserve the memory of Cossack glory. They are bound in guilds with an elected elder, a secret speech of their own and years of apprenticeship before a singer may take the road."
 nd_ukr_university_reform: "Réforme universitaire"
 nd_ukr_university_reform_desc: "S'appuyant sur la tradition de l'Académie Mohyla, les universités ruthènes adoptent l'érudition moderne et forment une nouvelle génération d'intellectuels et de professionnels."
 nd_ukr_haidamaka_rising: "L'ascension d'Haidamaka"
 nd_ukr_haidamaka_rising_desc: "Les soulèvements de Haidamaka canalisent l’esprit martial cosaque dans des révoltes populaires, démontrant que la tradition de la résistance armée perdure au cœur de la Ruthène."
 a_nd_ukr_zaporozhian: "Cosaque zaporozhien"
 a_nd_ukr_zaporozhian_desc: "Cavalerie légère du Zaporozhian Sich, raiders experts et cavaliers qui frappent rapidement et disparaissent dans la steppe."
 a_nd_ukr_registered_cossack: "Cosaque enregistré"
 a_nd_ukr_registered_cossack_desc: "Soldats cosaques professionnels organisés en régiments de polks, alliant résistance aux frontières et discipline militaire."
 a_nd_ukr_cossack_light_horse: "Cheval léger cosaque"
 a_nd_ukr_cossack_light_horse_desc: "Guerriers à cheval rapides de l'Hetmanate, descendants de la tradition steppique de la guerre mobile."
 a_nd_ukr_field_watch: "Field Watch"
 a_nd_ukr_field_watch_desc: "Frontier foot who keep the watch on the steppe trails. Quick to gather and quick to strike, they are not armed to stand in a battle line."
 n_nd_ukr_chaika: "Tchaïka"
 n_nd_ukr_chaika_desc: "Un bateau de guerre léger sculpté dans un seul tronc d'arbre, armé de fauconets et piloté par cinquante pillards cosaques. Rapide et peu profond, idéal pour les opérations fluviales et côtières."
 n_nd_ukr_war_chaika: "Tchaïka de guerre"
 n_nd_ukr_war_chaika_desc: "Une version améliorée de la chaika cosaque, capable de mener des opérations soutenues en mer Noire contre la navigation ottomane."
 nd_ukr_sich_fortification: "Fortification de Sich"
 nd_ukr_sich_fortification_desc: "Un camp cosaque fortifié sur le modèle du légendaire Zaporozhian Sich, des terrassements, des palissades et des casernes défendant la frontière."
 nd_ukr_chumak_post: "Poste de traite de Chumak"
 nd_ukr_chumak_post_desc: "Une étape sur les routes commerciales Chumak où les caravanes tirées par des bœufs se reposent et échangent du sel, des céréales et d'autres marchandises."
 nd_ukr_mohyla_academy: "Académie Kyiv-Mohyla"
 nd_ukr_mohyla_academy_desc: "La première institution orthodoxe d'enseignement supérieur du monde slave oriental, enseignant le latin, la philosophie, la théologie et les arts libéraux."
 nd_ukr_chernozem_estate: "Domaine de Tchernozem"
 nd_ukr_chernozem_estate_desc: "Un domaine agricole situé sur la légendaire terre noire de la steppe ruthène, produisant des céréales en quantités qui étonnent les visiteurs européens."
 nd_ukr_tabor_encampment: "Campement de Thabor"
 nd_ukr_tabor_encampment_desc: "Position défensive de chariots enchaînés remplis de terre et d'hommes armés, les cosaques répondent à la supériorité de la cavalerie ennemie."
 nd_ukr_brotherhood_school: "École de la Fraternité"
 nd_ukr_brotherhood_school_desc: "Une école fondée par une confrérie orthodoxe pour enseigner l'alphabétisation, la théologie et les langues classiques pour la défense de la foi."
 nd_ukr_sloboda: "Colonie de Sloboda"
 nd_ukr_sloboda_desc: "Une colonie frontalière gratuite où les colons bénéficient d'exonérations fiscales en échange de l'installation et de la défense de terres désertes de steppe."
 nd_ukr_medovarnia: "Médovarnie"
 nd_ukr_medovarnia_desc: "Une distillerie de miel produisant de l'hydromel et de la liqueur à partir des produits apicoles abondants de la steppe et des forêts ruthènes."
 nd_ukr_brotherhood_press: "Brotherhood Press"
 nd_ukr_brotherhood_press_desc: "The printing house of an Orthodox brotherhood, set beside its school. Primers, psalters and polemical tracts are printed here in Church Slavonic."
 nd_ukr_kobzar_guild: "Kobzar Guild"
 nd_ukr_kobzar_guild_desc: "The brotherhood of the blind singers of a district. It keeps a lamp before its icon in the parish church, judges its own members and admits apprentices to the craft."
 nd_ukr_sich_garrison: "Garnison de Sich"
 nd_ukr_sich_garrison_desc: "Guerriers armés entretenant les défenses de la fortification du Sich, consommant des armes, du bétail pour se ravitailler et des outils pour l'entretien."
 nd_ukr_chumak_operations: "Opérations Chumak"
 nd_ukr_chumak_operations_desc: "Commerce terrestre de sel, de bétail et d'articles en cuir le long des routes caravanières Chumak, avec des chariots tirés par des bœufs nécessitant des harnais et des accessoires en cuir."
 nd_ukr_academy_operations: "Opérations de l'Académie"
 nd_ukr_academy_operations_desc: "Les activités scientifiques de l'Académie Mohyla, consommant du papier, des livres et du verre pour les fenêtres et les instruments scientifiques."
 nd_ukr_grain_processing: "Transformation des grains"
 nd_ukr_grain_processing_desc: "Transformation du blé ruthène abondant en bière pour la consommation locale et l'exportation."
 nd_ukr_estate_upkeep: "Estate Upkeep"
 nd_ukr_estate_upkeep_desc: "Ploughs and harness, oxen for the heavy soil and timber for the barns."
 nd_ukr_tabor_supply: "Approvisionnement en Tabor"
 nd_ukr_tabor_supply_desc: "Entretenir les défenses du fort de wagons mobiles avec du bois pour la réparation des wagons, des armes pour la garnison et du bétail pour les provisions et le transport."
 nd_ukr_school_operations: "Opérations scolaires"
 nd_ukr_school_operations_desc: "Les activités d'enseignement et d'impression de l'école de la confrérie, consommant du papier, de la cire d'abeille pour les bougies et du tissu pour les robes et les meubles."
 nd_ukr_sloboda_farming: "L'agriculture de Sloboda"
 nd_ukr_sloboda_farming_desc: "Agriculture frontalière dans les colonies de Sloboda, culture du blé, élevage du bétail et utilisation d'outils pour travailler la terre noire."
 nd_ukr_mead_brewing: "Brassage d'hydromel"
 nd_ukr_mead_brewing_desc: "Brassage d'hydromel et de liqueur ruthène traditionnels à partir de miel et de céréales des steppes."
 nd_ukr_church_slavonic_printing: "Church Slavonic Printing"
 nd_ukr_church_slavonic_printing_desc: "Books are printed from cast type on paper, with the rubrics in red."
 nd_ukr_kobzar_guild_upkeep: "Guild Upkeep"
 nd_ukr_kobzar_guild_upkeep_desc: "Wood for kobzas and banduras, wax for the guild lamp and cloth for the singers."
 levy_nd_ukr_cossack_light_horse: "Prélèvement sur les chevaux légers cosaques"
 levy_nd_ukr_cossack_light_horse_desc: "Mobilisation des cavaliers cosaques rapides des communes rurales de l'Hetmanate."
 levy_nd_ukr_field_watch: "Field Watch Levy"
 levy_nd_ukr_field_watch_desc: "The frontier villages, the hired hands of the border towns and the Cossacks of the steppe edge are called out against a raid."
 levy_nd_ukr_war_chaika: "Prélèvement Chaika de guerre"
 levy_nd_ukr_war_chaika_desc: "Mobilisation de bateaux de guerre cosaques pour les opérations de raid sur la mer Noire."
 nd_ukr_formed_tt: "La Ruthénie s'est formée"
 nd_ukr_path_a_tt: "A choisi la République Sich"
 nd_ukr_path_b_tt: "Choisissez le grenier de l'Europe"
 nd_ukr_dest_kyiv_developed_tt: "We own #bold Kyiv#! and its development is at least #bold 36#!"
 nd_ukr_dest_khadjibey_developed_tt: "We own #bold Khadjibey#!, it is a city and its development is at least #bold 11#!"
 nd_ukr_dest_three_siches_tt: "At least #bold 3#! of our locations have a #bold Sich Fortification#!"
 nd_ukr_dest_estates_tt: "At least #bold 10#! of our locations have a #bold Chernozem Estate#!"
 nd_ukr_destiny: "Le destin ruthène"
 nd_ukr_destiny_desc: "La Ruthénie renaît des cendres de la fragmentation. Une fois Kiev sécurisée et la stabilité restaurée, la nation doit désormais choisir sa voie, le sabre ou la charrue, la conquête ou la culture."
 nd_ukr_dest_black_sea_gate: "La porte de la mer Noire"
 nd_ukr_dest_black_sea_gate_desc: "Seize the gateway to the Black Sea. Take the Crimean port of Kaffa, secure the Zaporizhzhian rapids at Kichkas and raise three siches to hold the road south."
 nd_ukr_dest_crimean_conquest: "La conquête de Crimée"
 nd_ukr_dest_crimean_conquest_desc: "Break the Crimean Khanate. Capture the Perekop gate, the fortress of Azov and Qirq Yer, the rock where the khans first sat, to dominate the northern Black Sea coast."
 nd_ukr_dest_black_sea_empire: "Empire de la mer Noire"
 nd_ukr_dest_black_sea_empire_desc: "Complete the Cossack dream: master both shores of the Black Sea. Take the ports of Sinop and Trebizond, which the Cossack boats once raided, and the Taman peninsula to forge an empire of raiders and warriors."
 nd_ukr_dest_grain_port: "Le port céréalier"
 nd_ukr_dest_grain_port_desc: "Sécuriser le site de Khadjibey sur la côte de la mer Noire, future porte d'entrée des céréales ruthènes vers les marchés européens. Construisez le trésor qui convient à une puissance agraire montante."
 nd_ukr_dest_black_earth_wealth: "Richesse de la Terre Noire"
 nd_ukr_dest_black_earth_wealth_desc: "Embrace modern banking and build up Kyiv, where the Contract Fair gathers the landowners of the whole black earth each winter to sell their harvests forward."
 nd_ukr_dest_breadbasket_empire: "Empire du grenier à pain"
 nd_ukr_dest_breadbasket_empire_desc: "Cover the black earth with great estates, raise a city at Khadjibey and make it the grain port of the continent. The nation that feeds Europe commands Europe."
 nd_ukr.6.t: "Le destin ruthène"
 nd_ukr.6.d: "Le pays de Ruthénie est à nouveau uni. Des contreforts des Carpates aux rapides du Dniepr, une nation s'est forgée à partir des principautés dispersées et des armées cosaques. La rada s’est réunie, les banderoles ont été hissées et Kiev est fière. Ce qui a été brisé par la marée mongole a été restauré. La question n’est plus de savoir si la Ruthénie survivra, mais de savoir ce qu’elle deviendra."
 nd_ukr.6.a: "Notre destin nous attend !"
 nd_ukr.7.t: "La porte de la mer Noire"
 nd_ukr.7.d: "Kaffa est tombée aux mains des cosaques. Le grand marché aux esclaves de Crimée, où pendant des siècles les pillards du Khan vendaient les Ruthènes capturés aux esclaves ottomans, est le nôtre. A Kichkas, les rapides zaporozhges grondent sous nos bateaux. La porte de la mer Noire est ouverte. Les raids qui ont terrorisé notre peuple pendant des générations vont désormais se dérouler dans la direction opposée."
 nd_ukr.7.a: "La Crimée connaîtra notre colère !"
 nd_ukr.8.t: "Le port de Khadjibey"
 nd_ukr.8.d: "Là où le Dniestr se jette dans la mer Noire, le port de Khadjibey a été sécurisé. Ce modeste mouillage se trouve sur l’arrière-pays agricole le plus riche d’Europe, la terre noire qui s’étend sans fin au nord et à l’est. Des charrettes à bœufs chargées de céréales bordent déjà les routes. Là où les chariots Chumak circulaient autrefois par voie terrestre, les navires transporteront désormais du blé ruthène vers les marchés affamés de la Méditerranée. L'avenir est écrit dans les céréales."
 nd_ukr.8.a: "Notre récolte nourrira le monde !"
 nd_ukr.9.t: "La chute de la Crimée"
 nd_ukr.9.d: "Le Khanat de Crimée est brisé. Perekop, l'isthme étroit qui protégeait la péninsule pendant des siècles, a été pris d'assaut. A Azov, la forteresse qui gardait l'estuaire du Don a capitulé. Pour la première fois de mémoire d’homme, la puissance ruthène s’étend jusqu’aux rives de la mer Noire sans l’ombre des raids tatars. La question est désormais de savoir quoi faire de cette victoire. Certains préconisent de raser toutes les forteresses et de chasser la population restante, un bilan final de siècles de raids d'esclaves. D'autres conseillent la colonisation et l'assimilation, transformant la steppe en terres agricoles ruthènes."
 nd_ukr.9.a: "Rasez le khanat, payez des siècles de souffrance !"
 nd_ukr.9.b: "Colonisez la steppe, faites-la nôtre par la charrue et par l'action."
 nd_ukr.10.t: "La révolution bancaire"
 nd_ukr.10.d: "Les céréales ruthènes se vendent désormais à des prix élevés sur les marchés européens, et le trésor se gonfle d'argent. La question se pose : comment gérer cette richesse ? Une faction préconise une banque d'État sous l'autorité de l'Hetman, un instrument centralisé pour financer les armées, construire des routes et lier les peuples soumis par une dépendance financière. Une autre faction, les marchands de Kiev et de Lviv, plaide pour des marchés ouverts, permettant aux commerçants de fixer les prix, de laisser les capitaux circuler librement, et la richesse naturelle de la Ruthénie attirera les investissements de tout le continent."
 nd_ukr.10.a: "L'État commande la bourse."
 nd_ukr.10.b: "Libérez les marchés. La prospérité suit la liberté."
 nd_ukr.11.t: "Maîtres de la mer Noire"
 nd_ukr.11.d: "Sinop est tombé. Le port ottoman où les flottes de chaika attaquaient autrefois arbore désormais la bannière ruthène. Sur la péninsule de Taman, la porte du Kouban est sécurisée. La mer Noire, autrefois lac ottoman, puis frontière contestée, est désormais un domaine ruthène. Du Dniepr à la côte anatolienne, des navires de construction cosaque patrouillent dans les eaux que leurs grands-pères traversaient en tant que pillards. Un empire d’eau et de steppe s’étend devant la nation. Certains demandent que la flotte soit libérée pour dominer tous les rivages. D’autres voient dans ces conquêtes la fondation d’un nouvel empire pontique, grande puissance forgée sur la mer."
 nd_ukr.11.a: "Libérez les pillards. La mer est notre terrain de chasse !"
 nd_ukr.11.b: "Nous construirons un empire pontique qui rivalisera avec les anciens."
 nd_ukr.12.t: "Le grenier de l'Europe"
 nd_ukr.12.d: "La transformation est terminée. Les céréales ruthènes nourrissent la moitié du continent. Depuis les bureaux de change de Khadjibey et de Kiev, les commerçants négocient des contrats qui déterminent si les villes prospèrent ou meurent de faim. La terre noire s'est révélée plus puissante que n'importe quelle armée, et les nations qui considéraient autrefois la Ruthénie comme une frontière arriérée courent désormais ses faveurs. La question demeure : cette suprématie agricole servira-t-elle de pont vers le monde, liant les nations à la table commune ? Ou bien la récolte sera-t-elle industrialisée et ses bénéfices canalisés vers une modernisation qui rendra la Ruthénie autosuffisante à tous égards ?"
 nd_ukr.12.a: "Nourrissez le continent, liez les nations à notre table."
 nd_ukr.12.b: "Industrialiser la récolte, forger notre propre avenir."
 STATIC_MODIFIER_NAME_nd_ukr_dest_raze_khanate: "La vengeance du Sich"
 STATIC_MODIFIER_DESC_nd_ukr_dest_raze_khanate: "Les marchés aux esclaves de Crimée brûlent. Des siècles de raids récompensés en une seule campagne de juste fureur."
 STATIC_MODIFIER_NAME_nd_ukr_dest_settle_steppe: "Règlement des steppes"
 STATIC_MODIFIER_DESC_nd_ukr_dest_settle_steppe: "La steppe conquise est colonisée par des colons ruthènes, transformant les pâturages nomades en terres agricoles ordonnées."
 STATIC_MODIFIER_NAME_nd_ukr_dest_pontic_raiders: "Raiders pontiques"
 STATIC_MODIFIER_DESC_nd_ukr_dest_pontic_raiders: "The Black Sea belongs to Cossack raiders whose assault craft strike with impunity across both shores. Few courts receive the envoys of a raiding state."
 STATIC_MODIFIER_NAME_nd_ukr_dest_pontic_empire: "Empire pontique"
 STATIC_MODIFIER_DESC_nd_ukr_dest_pontic_empire: "Un nouvel empire maritime s'élève sur la mer Noire, forgé par la conquête et soutenu par la tradition navale."
 STATIC_MODIFIER_NAME_nd_ukr_dest_state_banking: "Banque d'État"
 STATIC_MODIFIER_DESC_nd_ukr_dest_state_banking: "Le trésor de l'Hetman contrôle les flux de capitaux, finance l'expansion et lie les sujets grâce au pouvoir financier."
 STATIC_MODIFIER_NAME_nd_ukr_dest_free_markets: "Marchés libres"
 STATIC_MODIFIER_DESC_nd_ukr_dest_free_markets: "Les marchés ouverts et le libre-échange attirent les investissements de tout le continent, même si les coûts bureaucratiques d’un État marchand pèsent sur le tribunal."
 STATIC_MODIFIER_NAME_nd_ukr_dest_feed_continent: "Nourrir le continent"
 STATIC_MODIFIER_DESC_nd_ukr_dest_feed_continent: "La diplomatie céréalière ruthène lie les nations à la table, même si la priorité du laboureur laisse l'armée sous-dimensionnée."
 STATIC_MODIFIER_NAME_nd_ukr_dest_industrial_harvest: "Récolte industrielle"
 STATIC_MODIFIER_DESC_nd_ukr_dest_industrial_harvest: "L’agriculture modernisée favorise l’autosuffisance et l’expansion, même si l’accent mis sur l’intérieur des terres néglige la flotte."
 nd_ukr_cossack_arsenal: "Arsenal cosaque"
 nd_ukr_cossack_arsenal_desc: "Une importante usine d'armes cosaque produisant des armes, des munitions et des équipements pour les armées et les flottes de l'empire de la mer Noire."
 nd_ukr_grain_exchange: "Bourse aux céréales"
 nd_ukr_grain_exchange_desc: "Une salle internationale de commerce des céréales où les marchands négocient des contrats qui déterminent si des villes éloignées prospèrent ou meurent de faim."
 nd_ukr_arsenal_maintenance: "Opérations d'Arsenal"
 nd_ukr_arsenal_maintenance_desc: "La production d’armes consomme des armes à retravailler, du fer à fondre, des outils à fabriquer et du salpêtre à fabriquer des munitions."
 nd_ukr_exchange_operations: "Opérations d'échange"
 nd_ukr_exchange_operations_desc: "Les opérations administratives de la bourse aux céréales, consommant du papier pour les contrats, du tissu pour l'ameublement et des outils pour le matériel de pesée."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_ukr_bureaucracy_authority: "Autorité de l'Hetmanate"
 AUTO_MODIFIER_DESC_nd_ukr_bureaucracy_authority: "The Hetman's bulava, the Heneralna Starshyna, and the regimental colonels together exercise sovereign authority over the Cossack lands. Three bureaucracy slots are open for the institutions of the Cossack state."

 ukr_zaporizhian_sich_bureaucracy: "Sich zaporizhien"
 ukr_zaporizhian_sich_bureaucracy_desc: "La république-forteresse des rapides du Dniepr, dont la Sich Rada (l'assemblée de tous les cosaques) élisait le Kosh Otaman pour un mandat d'un an et approvisionnait l'armée de Khmelnytsky à partir de ses compagnies kurin. Le Sich a modelé une démocratie directe de la base cosaque : l'otaman gouvernait par acclamation et pouvait être destitué à n'importe quel conseil. Sa coutume égalitaire imposait des limites permanentes aux prétentions des starshyna au statut de noblesse."

 ukr_polkovnyk_regimental_bureaucracy: "Administration régimentaire de Polkovnyk"
 ukr_polkovnyk_regimental_bureaucracy_desc: "Les régiments territoriaux (polky) dans lesquels Bohdan Khmelnytsky organisa les terres libérées après 1648. Chacun des dix polky était gouverné par un colonel nommé par l'hetman et confirmé par les cosaques du régiment ; le polkovnyk commandait le régiment en temps de guerre, présidait en paix la cour régimentaire et administrait les villes et villages du polkov. Les autorités militaires et civiles fusionnées en un seul officier ont fait du régiment l'unité dirigeante de base de l'Hetmanate."

 ukr_heneralna_starshyna_bureaucracy: "Heneralna Starshyna"
 ukr_heneralna_starshyna_bureaucracy_desc: "L'état-major des officiers généraux qui servait de cabinet permanent de l'hetman à partir du milieu du XVIIe siècle. Il comprenait le heneralnyi obozny (intendant), deux heneralni suddi (juges généraux), le heneralnyi pysar (chancelier), le heneralnyi pidskarbi (trésorier), deux heneralni osavuly, le bundleuzhny (porteur de masse) et le khorunzhy (porte-étendard). Depuis Hloukhiv, après 1708, la Starshyna dirigeait les bureaux exécutifs de l'État."

 ukr_heneralnyi_sud_bureaucracy: "Heneralnyi Sud"
 ukr_heneralnyi_sud_bureaucracy_desc: "Le Tribunal général de l'Hetmanat, chambre d'appel présidée par les deux heneralni suddi à partir de 1654. Il appliquait un ordre juridique à plusieurs niveaux : le Statut lituanien de 1588 dans son édition polonaise de 1648 pour les cosaques de la noblesse et de la petite noblesse, le droit municipal de Magdebourg dans les villes à charte, dont Kiev, et le droit coutumier cosaque en matière militaire. Le tribunal parcourait le circuit, entendait des affaires mixtes cosaques-russes et disciplinait les régiments par l'intermédiaire du Tribunal militaire général."

 ukr_kyiv_mohyla_academy_bureaucracy: "Académie Kyiv-Mohyla"
 ukr_kyiv_mohyla_academy_bureaucracy_desc: "Fondée en 1632 lorsque le métropolite Petro Mohyla a fusionné l'école de la Fraternité de Kiev avec l'école de la Laure de Pechersk sur le modèle collégial jésuite. Après Hadiach 1658, il obtint un rang académique officiel et forma l'élite orthodoxe lettré de l'Hetmanat - les futurs hetmans Vyhovsky, Samoilovych, Mazepa et Polubotok y étudièrent tous. Sous le règne de Mazepa, les effectifs dépassaient les deux mille et l'académie fournissait des scribes pour chaque régiment."

 ukr_pacta_et_constitutiones_bureaucracy: "Pacta et Constitutiones"
 ukr_pacta_et_constitutiones_bureaucracy_desc: "Le cadre constitutionnel à plusieurs niveaux qui définissait l'autonomie de l'Hetmanat. Les articles Pereyaslav de 1654 énumèrent les droits que l'armée cosaque conservait sous le tsar; le Traité de Hadiach (1658) projetait un Grand-Duché de Rus' comme troisième partenaire du Commonwealth polono-lituanien; La Constitution Bendery de Pylyp Orlyk (1710) séparait les pouvoirs législatif, exécutif et judiciaire sous un conseil général triennal. Chaque nouvel hetman a juré de rédiger une nouvelle rédaction : la constitution vivante qui liait le protecteur."
