l_french:
 STATIC_MODIFIER_NAME_nd_lat_frankish_feudal_order: "Ordre féodal franc"
 STATIC_MODIFIER_DESC_nd_lat_frankish_feudal_order: "L’Empire latin a été organisé sur le modèle de la féodalité occidentale. Les seigneurs croisés tiennent leurs fiefs par le service militaire, liés par les coutumes de France et de Flandre. L'empereur règne comme le premier parmi ses pairs, son autorité reposant sur la force de ses chevaliers à cheval et la loyauté de ses vassaux."
 STATIC_MODIFIER_NAME_nd_lat_venetian_partnership: "Partenariat vénitien"
 STATIC_MODIFIER_DESC_nd_lat_venetian_partnership: "La République Sérénissime est considérée comme le partenaire indispensable de l'empire. Les marchands vénitiens contrôlent les ports, les flottes et le flux de marchandises à travers Constantinople. Le podestat siège au conseil de l'empereur, et le fil d'or du commerce lie l'empire plus sûrement que n'importe quel serment féodal."
 STATIC_MODIFIER_NAME_nd_lat_romania_divided: "La Roumanie divisée"
 STATIC_MODIFIER_DESC_nd_lat_romania_divided: "Les territoires de l'ancien Empire romain ont été répartis entre les conquérants, chaque seigneur consolidant son emprise sur les terres grecques."
 STATIC_MODIFIER_NAME_nd_lat_codified_law: "Loi codifiée de Roumanie"
 STATIC_MODIFIER_DESC_nd_lat_codified_law: "Les assises de Roumanie ont établi un cadre juridique commun à l'ensemble des seigneuries latines, mettant de l'ordre dans le patchwork de traditions juridiques franques, vénitiennes et byzantines."
 nd_lat.1.t: "L'Empire Latin"
 nd_lat.1.d: "Constantinople has fallen, not to the infidel, but to the soldiers of the Cross. The greatest city in Christendom now belongs to the Latin lords who breached its ancient walls. Emperor and Doge, knight and merchant, must now decide what kind of empire will rise from the ashes of Byzantium.\n\nThe feudal lords of France, Flanders, and the Rhineland look to organize these conquered lands as they would any Western kingdom: fiefs parceled out, vassals bound by oath, the emperor supreme in war. But the Venetians who made this conquest possible demand their share: the harbors, the trade routes, the warehouses that made Constantinople the crossroads of the world.\n\nTwo visions compete for the soul of this new empire. Will it be a kingdom of knights, or an empire of merchants?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_lat.1.a: "Règle comme le règnent les Francs : par lance, par serment, par la loi féodale"
 nd_lat.1.b: "Embrassez Venise : le commerce liera cet empire ensemble"
 nd_lat.2.t: "La Partitio Roumaniee"
 nd_lat.2.d: "The conquered territories of Romania have been formally divided among the victors. By the terms of the partition treaty agreed before the walls were even breached, the emperor receives one quarter of all lands, Venice claims three-eighths (including the choicest harbors and islands) and the remaining three-eighths are distributed among the crusader barons as feudal fiefs.\n\nThe Duchy of Athens, the Principality of Achaea, the Kingdom of Thessalonica, and a constellation of island lordships now dot the map of Greece. Each lord rules his portion with the customs of his homeland, creating a mosaic of Western feudalism overlaid on ancient Greek soil."
 nd_lat.2.a: "Les terres de Roumanie sont à nous et nous les gouvernons"
 nd_lat.3.t: "Les assises de Roumanie"
 nd_lat.3.d: "A comprehensive legal code has been compiled to govern the feudal relations of the Latin lords in Greece. Drawing from the customs of Jerusalem, the laws of Champagne, and the practices of the Morea, the Assizes of Romania establish the rights and obligations of every vassal, from the humblest sergeant to the greatest baron.\n\nThe code addresses land tenure, military service, inheritance, and the administration of justice. It creates a common legal language for lords who came from every corner of Western Europe, binding them into a coherent feudal society despite their diverse origins."
 nd_lat.3.a: "Que la loi roumaine soit connue de tous"
 nd_lat_formed_tt: "L'Empire latin est créé"
 nd_lat_path_a_tt: "La voie féodale franque a été choisie"
 nd_lat_path_b_tt: "La voie du partenariat vénitien a été choisie"
 nd_lat_dest_thebes_developed_tt: "We own #bold Thebes#! and its development is at least #bold 26#!"
 nd_lat_partitio_romaniae: "Partitio Roumaniee"
 nd_lat_partitio_romaniae_desc: "La partition formelle des territoires de l'Empire byzantin entre les conquérants latins, établissant une mosaïque féodale d'États croisés à travers la Grèce et la Thrace."
 nd_lat_frankish_chivalry: "Chevalerie franque"
 nd_lat_frankish_chivalry_desc: "La tradition de cavalerie lourde des chevaliers croisés français et flamands, dont la charge montée dévastatrice décida des batailles d'Andrinople au Péloponnèse."
 nd_lat_latin_patriarchate: "Patriarcat latin"
 nd_lat_latin_patriarchate_desc: "L'établissement d'un patriarche catholique à Constantinople, remplaçant la hiérarchie orthodoxe et affirmant l'autorité ecclésiastique romaine sur les églises grecques."
 nd_lat_feudal_levy_system: "Système de prélèvement féodal"
 nd_lat_feudal_levy_system_desc: "L'obligation de tout vassal latin de fournir des hommes armés pour les campagnes de l'empereur, obligeant les seigneurs féodaux de Roumanie au service militaire."
 nd_lat_assizes_tradition: "Assises de Roumanie"
 nd_lat_assizes_tradition_desc: "Le code juridique féodal complet régissant les seigneuries latines de Grèce, codifiant les coutumes occidentales en matière de régime foncier, de service militaire et de justice dans un contexte oriental."
 nd_lat_venetian_quarter: "Quartier vénitien"
 nd_lat_venetian_quarter_desc: "Le quartier marchand vénitien de Constantinople, une enclave autonome où le commerce de l'Est et de l'Ouest circule à travers les entrepôts et les comptoirs vénitiens."
 nd_lat_greek_silk_revival: "Renaissance de la soie grecque"
 nd_lat_greek_silk_revival_desc: "The Latin lords recognized the value of the Byzantine silk industry and encouraged its continuation, blending Greek artisanship with access to Western markets.\n\n#italic Available in: $nd_lat_fondaco$#!"
 nd_lat_pronoiar_system: "Système Pronoiar"
 nd_lat_pronoiar_system_desc: "The Latins adapted the Byzantine pronoia system, granting revenue-producing lands to mounted soldiers in exchange for military service, a hybrid of Western feudalism and Eastern administration."
 nd_lat_golden_horn_trade: "Commerce de la Corne d'Or"
 nd_lat_golden_horn_trade_desc: "Le port de la Corne d'Or reste le carrefour du commerce méditerranéen, reliant les routes commerciales de la mer Noire aux marchés de l'Italie, de l'Égypte et du Levant."
 nd_lat_archipelago_lordships: "Seigneuries de l'archipel"
 nd_lat_archipelago_lordships_desc: "Le duché de l'archipel et les seigneuries latines dispersées des îles de la mer Égée, où règnent les seigneurs vénitiens et francs depuis des châteaux fortifiés surplombant la mer."
 nd_lat_latin_greek_synthesis: "Synthèse latin-grec"
 nd_lat_latin_greek_synthesis_desc: "Au fil des générations, les seigneurs latins de Grèce ont absorbé des éléments de la culture byzantine : la langue grecque, les coutumes orthodoxes et les pratiques administratives orientales mélangées aux traditions féodales occidentales."
 nd_lat_strait_control: "Contrôle du détroit"
 nd_lat_strait_control_desc: "Contrôle des détroits du Bosphore et des Dardanelles, les passages étroits entre l'Europe et l'Asie qui commandent le flux commercial et les armées entre la Méditerranée et la mer Noire."
 nd_lat_aegean_fleet: "Flotte égéenne"
 nd_lat_aegean_fleet_desc: "Une flotte de galères adaptées de la tradition byzantine des dromons, spécialement construites pour les eaux insulaires de la mer Égée où la vitesse et la maniabilité comptent plus que l'armement lourd."
 nd_lat_confessional_unity: "Unité confessionnelle"
 nd_lat_confessional_unity_desc: "Efforts visant à rapprocher la population grecque orthodoxe de Rome, par la persuasion, la conversion et l'autorité du Patriarcat latin."
 nd_lat_bosphorus_arsenal: "Arsenal du Bosphore"
 nd_lat_bosphorus_arsenal_desc: "Un arsenal naval sur les rives du Bosphore, s'appuyant sur des siècles d'expertise en construction navale byzantine pour entretenir la flotte de l'empire."
 nd_lat_frankish_mercenaries: "Tradition mercenaire franque"
 nd_lat_frankish_mercenaries_desc: "La pénurie perpétuelle de main-d'œuvre de l'Empire latin a créé une dépendance à l'égard des compagnies de mercenaires - des soldats de fortune catalans, aragonais, italiens et français prêts à se battre pour être payés."
 nd_lat_latin_administration: "Administration latine"
 nd_lat_latin_administration_desc: "Le développement progressif d’un système administratif cohérent mêlant les pratiques bureaucratiques byzantines à la gouvernance féodale occidentale."
 nd_lat_renewed_imperium: "Imperium renouvelé"
 nd_lat_renewed_imperium_desc: "L’Empire latin réaffirme sa prétention en tant que successeur légitime de Rome, tirant son prestige de sa possession de Constantinople et des anciens insignes impériaux."
 nd_lat_mediterranean_arsenal: "Arsenal méditerranéen"
 nd_lat_mediterranean_arsenal_desc: "La capacité navale de l'empire atteint de nouveaux sommets avec la galleass, une galère à canon lourd combinant l'architecture navale vénitienne et l'expertise maritime byzantine."
 nd_lat_hellenistic_renaissance: "Renaissance hellénistique"
 nd_lat_hellenistic_renaissance_desc: "Un épanouissement culturel alors que les latinistes redécouvrent le patrimoine philosophique et scientifique grec conservé dans les bibliothèques et les monastères de Constantinople."
 nd_lat_balkan_consolidation: "Consolidation des Balkans"
 nd_lat_balkan_consolidation_desc: "L’intégration systématique des territoires des Balkans dans l’administration impériale, remplaçant la mosaïque de seigneuries semi-indépendantes par une gouvernance directe."
 nd_lat_constitutional_empire: "Empire constitutionnel"
 nd_lat_constitutional_empire_desc: "L'évolution de la gouvernance de l'Empire latin vers un cadre constitutionnel, équilibrant l'autorité impériale avec les droits des seigneurs féodaux et des communes marchandes."
 nd_lat_eastern_modernization: "Modernisation orientale"
 nd_lat_eastern_modernization_desc: "The adoption of modern industrial and manufacturing techniques at the Bosphorus Arsenal, transforming it from a traditional shipyard into a naval supplies manufactory.\n\n#italic Available in: $nd_lat_arsenal$#!"
 nd_lat_crossroads_hegemony: "Hégémonie à la croisée des chemins"
 nd_lat_crossroads_hegemony_desc: "L’Empire latin exploite sa position au carrefour de l’Europe et de l’Asie pour dominer le commerce méditerranéen, contrôlant les flux de marchandises entre l’Est et l’Ouest."
 nd_lat_latin_legacy: "L'héritage latin"
 nd_lat_latin_legacy_desc: "Les traditions militaires durables de l'Empire latin : une synthèse des tactiques de cavalerie lourde franque, de la doctrine défensive byzantine et de la guerre disciplinée moderne."
 a_nd_lat_frankish_knight: "Chevalier franc"
 a_nd_lat_frankish_knight_desc: "Chevaliers croisés en armure venus du cœur de la France et des Flandres, dont la charge montée dévastatrice a porté la Quatrième Croisade jusqu'aux murs de Constantinople."
 a_nd_lat_pronoiar: "Pronoier"
 a_nd_lat_pronoiar_desc: "Les soldats à cheval obtenaient des domaines de pronoia en échange de leur service militaire, mêlant la tradition byzantine d'attribution de terres aux techniques de combat chevaleresques occidentales."
 n_nd_lat_dromon: "Dromo latin"
 n_nd_lat_dromon_desc: "Une galère de guerre issue de la tradition byzantine du dromon, adaptée par les charpentiers latins pour la patrouille et le combat dans les eaux étroites de la mer Égée et du Bosphore."
 n_nd_lat_galleass: "Galleasse latine"
 n_nd_lat_galleass_desc: "Une galère de guerre lourde équipée d'une artillerie importante, combinant la conception de la coque vénitienne avec les traditions maritimes byzantines pour créer un formidable navire pour la guerre en Méditerranée orientale."
 nd_lat_crusader_tower: "Tour des Croisés"
 nd_lat_crusader_tower_desc: "Maison-tour fortifiée de style franc, construite pour sécuriser le territoire conquis et servir de siège à un seigneur latin."
 nd_lat_tower_maintenance: "Garnison de la tour"
 nd_lat_tower_maintenance_desc: "La garnison et l'entretien d'une maison-tour franque, nécessitant de la pierre pour les réparations, du bois pour les échafaudages et des armes pour les défenseurs."
 nd_lat_fondaco: "Fondaco"
 nd_lat_fondaco_desc: "Une maison de commerce de style vénitien combinant entrepôt, résidence et marché, où les commerçants de toute la Méditerranée exercent leurs activités."
 nd_lat_fondaco_trade: "Commerce de la soie"
 nd_lat_fondaco_trade_desc: "La transformation et l'exportation de la soie et des textiles teints à travers le réseau commercial vénitien."
 nd_lat_fondaco_maintenance: "Entretien de la maison de commerce"
 nd_lat_fondaco_maintenance_desc: "Les coûts permanents liés à l'entretien d'une maison de commerce : tissu pour l'exposition, papier pour les comptes et bois pour les réparations."
 nd_lat_island_lordship: "Seigneurie de l'île"
 nd_lat_island_lordship_desc: "Un domaine côtier fortifié sur l'une des îles de la mer Égée, où un seigneur latin commande à la fois soldats et marins depuis son château au-dessus du port."
 nd_lat_lordship_maintenance: "Garnison de la Seigneurie"
 nd_lat_lordship_maintenance_desc: "L'entretien de la garnison et des installations portuaires d'une seigneurie insulaire."
 nd_lat_mercenary_hall: "Salle des Mercenaires"
 nd_lat_mercenary_hall_desc: "Un lieu de rassemblement et une caserne pour les compagnies de mercenaires occidentales qui constituent un complément crucial à la main-d'œuvre féodale limitée de l'Empire latin."
 nd_lat_mercenary_maintenance: "Approvisionnement des mercenaires"
 nd_lat_mercenary_maintenance_desc: "Les armes, chevaux et provisions nécessaires au maintien d'une garnison de mercenaires permanente."
 nd_lat_arsenal: "Arsenal du Bosphore"
 nd_lat_arsenal_desc: "Un chantier naval majeur sur les rives du Bosphore, s'appuyant sur des siècles de savoir-faire byzantin et vénitien en matière de construction navale."
 nd_lat_arsenal_maintenance: "Opérations d'Arsenal"
 nd_lat_arsenal_maintenance_desc: "Le bois, les fournitures navales et le goudron nécessaires pour maintenir les voies maritimes de l'arsenal actives et la flotte en réparation."
 nd_lat_arsenal_shipwright: "Production de fournitures navales"
 nd_lat_arsenal_shipwright_desc: "Les ateliers de l'arsenal produisent des cordes, des toiles et des accessoires pour la flotte à partir de bois brut et de fer."
 nd_lat_latin_academy: "Académie latine"
 nd_lat_latin_academy_desc: "Une institution d'apprentissage où se rencontrent les études latines et grecques, préservant l'héritage intellectuel des deux traditions."
 nd_lat_academy_maintenance: "Entretien de l'Académie"
 nd_lat_academy_maintenance_desc: "Le papier, les livres et le verre pour les fenêtres étaient nécessaires au maintien d'un centre d'apprentissage."
 nd_lat_destiny: "Destin de l'Empire latin"
 nd_lat_destiny_desc: "Une fois Constantinople sécurisée et l'empire proclamé, les seigneurs latins doivent désormais décider de la forme de leur destin : que ce soit par l'épée ou par le grand livre."
 nd_lat_dest_greek_conquest: "Conquête de la Grèce"
 nd_lat_dest_greek_conquest_desc: "Les seigneurs croisés doivent rassembler toute la Grèce sous la bannière latine. Athènes, joyau de l'Antiquité, et Thessalonique, porte d'entrée de la Macédoine, doivent toutes deux se soumettre à la domination franque."
 nd_lat_dest_anatolian_march: "La marche anatolienne"
 nd_lat_dest_anatolian_march_desc: "Une fois la Grèce sécurisée, l’Empire latin tourne son regard vers l’autre côté du détroit. Les anciennes villes de Bursa et Konya (sièges du pouvoir turc) doivent tomber pour étendre l’empire en Asie Mineure."
 nd_lat_dest_new_jerusalem: "La nouvelle Jérusalem"
 nd_lat_dest_new_jerusalem_desc: "L’ambition ultime des croisés : reconquérir la Terre Sainte elle-même. Antioche et Jérusalem, prises perdues de la première croisade, doivent être placées sous la protection impériale latine. C’est le point culminant de deux siècles de croisade."
 nd_lat_dest_aegean_dominion: "Domination égéenne"
 nd_lat_dest_aegean_dominion_desc: "The Venetian vision demands control of the sea lanes. Rhodes, where the Aegean opens on the Levant, and the great island of Crete must be secured to complete the chain of trading posts that the Duchy of Naxos began in the Cyclades."
 nd_lat_dest_silk_monopoly: "Le monopole de la soie"
 nd_lat_dest_silk_monopoly_desc: "Constantinople's silk trade was once the envy of the world. Restore the capital's market as the great emporium of luxury goods, where silk from the East flows through Latin hands to Western buyers, and build up Thebes, the silk town of Frankish Greece, whose looms once wove for the emperors."
 nd_lat_dest_eastern_emporium: "Le magasin de l'Est"
 nd_lat_dest_eastern_emporium_desc: "Étendez le réseau commercial au maximum. Kaffa sur la mer Noire et Smyrne sur la côte égéenne ancreront un empire commercial s’étendant sur deux mers, soutenu par des institutions bancaires modernes."
 nd_lat.4.t: "Destin de l'Empire latin"
 nd_lat.4.d: "The Latin Empire stands at a crossroads. Constantinople is ours, but the empire's future remains unwritten. Will the sons of the crusaders push ever eastward, as their fathers intended? Or will the merchant princes of Venice chart a course through commerce and control of the seas?\n\nThe choice we made at the empire's founding now bears fruit. Our destiny beckons."
 nd_lat.4.a: "Notre destin attend"
 nd_lat.5.t: "La conquête de la Grèce"
 nd_lat.5.d: "Athens and Thessaloniki fly the banner of the Latin Empire. The Duchy of Athens, once a prize fought over by Burgundian and Catalan adventurers, now answers to Constantinople. The Kingdom of Thessalonica, briefly held and quickly lost in the first years of the conquest, has been recovered and secured.\n\nAll of Greece, from the Peloponnese to Macedonia, acknowledges Latin overlordship. The crusader states are no longer isolated outposts. They form a coherent feudal realm."
 nd_lat.5.a: "Greece is ours. Now we look to greater conquests"
 nd_lat.6.t: "La marche en Anatolie"
 nd_lat.6.d: "The banners of the Latin Empire now fly over the citadels of Bursa and Konya. What the Byzantine emperors struggled for centuries to hold, the Frankish knights have seized in a generation. The rich plains of Anatolia, once the heartland of Roman power, are open to Latin settlement and exploitation.\n\nBut the march has stretched our resources thin. Two approaches present themselves: press on with crusading zeal, or consolidate our gains with careful administration."
 nd_lat.6.a: "Press onward. God wills it!"
 nd_lat.6.b: "Consolider - conserver ce que nous avons pris"
 nd_lat.7.t: "La nouvelle Jérusalem"
 nd_lat.7.d: "The Cross stands triumphant over Antioch and Jerusalem. The dream that launched a thousand ships and sent a hundred thousand men into the wilderness of the East has been realized under the banner of the Latin Empire. The Holy Sepulchre itself is under our protection.\n\nThis is more than a military achievement: it is a vindication of the entire crusading ideal. The question now is whether this empire will be a holy kingdom consecrated to God, or a secular imperium in the Roman tradition."
 nd_lat.7.a: "Un royaume consacré à Dieu"
 nd_lat.7.b: "Une nouvelle Rome, héritière des Césars"
 nd_lat.8.t: "Domination de la mer Égée"
 nd_lat.8.d: "Rhodes and the island of Crete now anchor the Venetian trading network in the Aegean. From Candia's great harbor to the walled port of Rhodes, Latin merchants control the sea lanes that connect Constantinople to the wider Mediterranean.\n\nEvery ship that passes through these waters pays tribute to the empire. The Aegean has become a Latin lake."
 nd_lat.8.a: "La mer est à nous"
 nd_lat.9.t: "Le monopole de la soie"
 nd_lat.9.d: "Constantinople has reclaimed its ancient role as the world's greatest marketplace for luxury goods, and at Thebes the looms are busy again. Silk from China and Persia, spices from India, and furs from the north all flow through our markets, taxed and traded by Latin merchants.\n\nThe question before us is how to best exploit this windfall. We could invest in the production of finished goods, transforming raw silk into fine cloth. Or we could focus on customs revenues, taxing the flow of goods through our harbors."
 nd_lat.9.a: "Investissez dans nos ateliers et nos métiers à tisser"
 nd_lat.9.b: "Taxer le commerce qui nous traverse"
 nd_lat.10.t: "Le magasin de l'Est"
 nd_lat.10.d: "From Kaffa on the Black Sea to Smyrna on the Aegean coast, the Latin Empire's trading network spans two seas and a dozen peoples. Our merchants trade in every port, our bankers finance every venture, our ships carry the goods of three continents.\n\nWe stand at the crossroads of the world. Shall we focus on the rich Levantine trade routes to the south, or turn northward to dominate the Black Sea and its hinterland?"
 nd_lat.10.a: "Le Levant est notre avenir"
 nd_lat.10.b: "La mer Noire sera notre domaine"
 STATIC_MODIFIER_NAME_nd_lat_dest_march_zeal: "Zèle de croisade"
 STATIC_MODIFIER_DESC_nd_lat_dest_march_zeal: "La ferveur de la guerre sainte pousse les armées latines plus profondément en Anatolie, acceptant la perturbation économique comme le prix d’une juste conquête."
 STATIC_MODIFIER_NAME_nd_lat_dest_march_pragmatism: "Consolidation anatolienne"
 STATIC_MODIFIER_DESC_nd_lat_dest_march_pragmatism: "Une approche méthodique pour conserver les territoires anatoliens conquis, réduisant les coûts militaires tout en construisant un système de garnison durable."
 STATIC_MODIFIER_NAME_nd_lat_dest_holy_crusade: "Sainte Croisade triomphante"
 STATIC_MODIFIER_DESC_nd_lat_dest_holy_crusade: "La reconquête de la Terre Sainte a galvanisé la chrétienté. Pèlerins et guerriers affluent vers la bannière latine, inspirée de la mission sacrée de l'empire."
 STATIC_MODIFIER_NAME_nd_lat_dest_latin_imperium: "Impérial latin"
 STATIC_MODIFIER_DESC_nd_lat_dest_latin_imperium: "The Latin Empire styles itself as the true heir to Rome, a secular imperial power commanding respect through prestige, law, and diplomacy."
 STATIC_MODIFIER_NAME_nd_lat_dest_silk_exchange: "Bourse de la soie de Constantinople"
 STATIC_MODIFIER_DESC_nd_lat_dest_silk_exchange: "L'investissement de l'empire dans la production et la transformation de la soie a créé une industrie de produits de luxe florissante, même si l'accent mis sur le commerce a un coût pour la préparation navale."
 STATIC_MODIFIER_NAME_nd_lat_dest_customs_revenue: "Douanes de carrefour"
 STATIC_MODIFIER_DESC_nd_lat_dest_customs_revenue: "Un régime douanier systématique taxe l’immense flux de marchandises transitant par les ports de Constantinople, finançant d’ambitieux projets de construction à travers l’empire."
 STATIC_MODIFIER_NAME_nd_lat_dest_levantine_network: "Réseau commercial levantin"
 STATIC_MODIFIER_DESC_nd_lat_dest_levantine_network: "Un réseau commercial tentaculaire reliant les ports du Levant aux marchés européens, générant d’immenses richesses mais détournant les ressources des activités scientifiques."
 STATIC_MODIFIER_NAME_nd_lat_dest_black_sea_hegemony: "Hégémonie de la mer Noire"
 STATIC_MODIFIER_DESC_nd_lat_dest_black_sea_hegemony: "L'Empire latin domine la mer Noire, contrôlant le flux de céréales, de fourrures et d'esclaves en provenance des rives nord grâce à son réseau de colonies commerciales."
 nd_lat_holy_sepulchre: "Commanderie du Saint-Sépulcre"
 nd_lat_holy_sepulchre_desc: "Commanderie militaro-religieuse fortifiée dédiée à la défense de la Terre Sainte, avec en garnison des chevaliers ayant juré de protéger les sites sacrés de la chrétienté."
 nd_lat_commandery_maintenance: "Garnison de la Commanderie"
 nd_lat_commandery_maintenance_desc: "Les armes, pierre pour les fortifications et cire d'abeille pour la chapelle qui entretiennent une commanderie de chevaliers croisés."
 nd_lat_emporion: "Emporion"
 nd_lat_emporion_desc: "Un grand entrepôt commercial où les marchands de toute la Méditerranée et au-delà se rassemblent pour acheter, vendre et échanger des marchandises sous la protection du droit latin."
 nd_lat_emporion_maintenance: "Opérations d'entrepôt"
 nd_lat_emporion_maintenance_desc: "Le tissu, le papier, le bois et le sel nécessaires au fonctionnement d'un important poste de traite international."

 # ===== BUREAUCRACIES =====
 lat_partitio_romaniae_bureaucracy: "Partitio Roumaniee"
 lat_partitio_romaniae_bureaucracy_desc: "Le traité signé le 1er octobre 1204 divise l'Empire byzantin entre les vainqueurs de la quatrième croisade - trois huitièmes à Venise, un quart à l'empereur Baudouin et le reste inféodé aux barons croisés détenant la plena potestas en échange d'un service militaire annuel du 1er juin au 29 septembre. hôte formidable."
 lat_cour_des_pairs_bureaucracy: "Cour des Pairs"
 lat_cour_des_pairs_bureaucracy_desc: "La Haute Cour, conseil féodal des barons sur le modèle de la curia regis du royaume de Jérusalem. A Constantinople, l'empereur le convoqua avec le podestat vénitien et son conseil de six membres ; à Andravida, douze baronnies achéennes réduisirent leur prince au rang de premier parmi ses pairs, avec interdiction de décréter la peine capitale sans leur consentement. Ses jugements constituent la base du précédent codifié ultérieurement dans les Assises de Romanie."
 lat_patriarchatus_latinus_bureaucracy: "Patriarchatus Latinus"
 lat_patriarchatus_latinus_bureaucracy_desc: "Le Patriarcat latin a été établi après la conquête du 13 avril 1204, avec le sous-diacre vénitien Thomas Morosini consacré comme premier patriarche. Elle a supplanté le Patriarcat œcuménique orthodoxe, imposé le rite romain et les pains sans levain aux églises byzantines, exigé que les nouveaux évêques soient consacrés selon des formes latines et mené des offices en latin plutôt qu'en grec - le levier théologique de l'Union des Églises qui était le prétexte ecclésiastique initial de la Croisade."
 lat_podesta_venetus_bureaucracy: "Podesta Vénétus"
 lat_podesta_venetus_bureaucracy_desc: "Le podestat vénitien de Constantinople, qui gouvernait les trois huitièmes de la ville au nord de la Mese attribués à Venise, utilisait le titre byzantin de despote pour affirmer une quasi-égalité avec l'empereur et répondait au doge plutôt qu'au trône latin. À la tête d'un conseil de six membres et d'une liste distincte de fonctionnaires dans les ports de l'empire, il était un ambassadeur et un vice-gérant plus qu'un vassal - un rôle continué après 1265 par son successeur le Bailo pendant des siècles au-delà de la restauration paléologue."
 lat_assises_de_romanie_bureaucracy: "Assises de Roumanie"
 lat_assises_de_romanie_bureaucracy_desc: "Le code juridique de la Frankokratia, compilé à partir des coutumes de la Principauté d'Achaïe et des précédents de la Haute Cour. Il s'inspire des Assises de Jérusalem et greffe la pratique byzantine de la pronoia sur la procédure féodale franque, régissant la tenure des paroiskoi, les obligations du fief et la position juridique de la population grecque. Grâce à l’Achaïe, ses normes se sont répandues à Chypre et dans les îles de la mer Égée en tant que texte juridique canonique de la Grèce latine jusqu’à la fin du XVe siècle."

 AUTO_MODIFIER_NAME_nd_lat_bureaucracy_authority: "Autorité impériale latine"
 AUTO_MODIFIER_DESC_nd_lat_bureaucracy_authority: "The settlement of the Fourth Crusade left the Latin Empire its partition treaty, its court of peers, its Latin Patriarchate, the Venetian Podesta and the Assizes of Romania. The empire can sustain three more standing institutions."
