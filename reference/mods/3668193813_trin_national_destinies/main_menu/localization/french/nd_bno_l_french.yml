l_french:
 STATIC_MODIFIER_NAME_nd_thalassocracy_of_the_eastern_seas: "Thalassocratie des mers orientales"
 STATIC_MODIFIER_DESC_nd_thalassocracy_of_the_eastern_seas: "Le destin de Bornéo repose sur les vagues. Des ports aux parfums de camphre de Brunei aux quais au poivre de Banjarmasin, nos sultanats contrôlent les voies maritimes qui relient les îles aux épices à la Chine et à l'Inde. Que chaque embouchure de détroit et de rivière réponde à notre drapeau."
 STATIC_MODIFIER_NAME_nd_lords_of_the_rainforest: "Seigneurs de la forêt tropicale"
 STATIC_MODIFIER_DESC_nd_lords_of_the_rainforest: "L’intérieur de Bornéo est une forteresse impénétrable de jungle, de rivière et de montagne. Les peuples Dayak qui maîtrisent ce territoire sont des guerriers inégalés : leurs épées mandau et leurs sarbacanes à pointe empoisonnée ont repoussé tous les envahisseurs qui osaient s'aventurer en amont. Nous unirons ces clans en une armée que le monde n’a jamais vue."
 STATIC_MODIFIER_NAME_nd_bno_banjarmasin_pepper_boom: "Boom du poivre de Banjarmasin"
 STATIC_MODIFIER_DESC_nd_bno_banjarmasin_pepper_boom: "Le commerce du poivre de Banjarmasin a atteint son apogée, avec des marchands de tout l'archipel et d'ailleurs se disputant l'accès à nos récoltes."
 STATIC_MODIFIER_NAME_nd_bno_diamond_rush: "Ruée vers le diamant"
 STATIC_MODIFIER_DESC_nd_bno_diamond_rush: "Les champs de diamants alluviaux de Landak et Cempaka ont attiré des mineurs et des marchands de toute l’île, alimentant un élan de prospérité."
 nd_bno.1.t: "L'unification de Bornéo"
 nd_bno.1.d: "The great island of Borneo, third largest in the world, has at last been brought under a single sovereignty. For centuries, coastal sultanates from Brunei in the north to Banjarmasin in the south competed with inland Dayak confederacies for control of the island's immense resources: camphor worth its weight in silver, diamonds from the ancient alluvial fields of Landak, pepper that drew traders from China and India, and ironwood hardened by millennia of tropical growth.\n\nNow, for the first time, the maritime ambitions of the coastal sultans and the jungle prowess of the interior peoples are unified under one banner. But this new state must choose its character. Shall we look outward across the Sulu Sea and the straits of Makassar, building a thalassocracy to rival Brunei's golden age under Sultan Bolkiah? Or shall we turn inward, harnessing the fearsome warriors of the longhouses and the inexhaustible resources of the world's oldest rainforest?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_bno.1.a: "Commandez les mers : notre destin repose sur les vagues"
 nd_bno.1.b: "Maîtrisez la jungle : aucune armée ne peut nous égaler dans nos forêts"
 nd_bno.2.t: "Le commerce du poivre de Banjarmasin"
 nd_bno.2.d: "Under Sultan Mustain Billah, the Sultanate of Banjarmasin reached the peak of its commercial power in the early seventeenth century. Pepper plantations spread across the southern river valleys, and Banjarmasin became the dominant trading hub between the Straits of Malacca and the Spice Islands of Maluku. Merchants from Java, China, India, and even Europe competed for access to Banjarmasin's wharves, where pepper was measured by the ton and contracts were sealed with oaths sworn on the Quran.\n\nThis wealth did not come without cost: control of the pepper trade meant control of the rivers, and the sultan's warboats patrolled every tributary. Yet the choice before us now is how to invest this bounty: shall we deepen our commercial networks, or turn the profits toward developing our diamond and mineral wealth?"
 nd_bno.2.a: "Développer les routes commerciales du poivre à travers l'archipel"
 nd_bno.2.b: "Investissez dans les champs de diamants et l’extraction minière"
 nd_bno.3.t: "La thalassocratie du Brunei"
 nd_bno.3.d: "Under Sultan Bolkiah, the fifth Sultan of Brunei, the sultanate expanded from a coastal trading post into a true thalassocracy: an empire of the seas. Brunei's writ ran from the coasts of Sarawak and Sabah to the southern Philippines, encompassing the Sulu Archipelago and reaching as far as Manila Bay. This was not an empire of territory but of trade routes: Brunei collected tolls on all water traffic passing through its sphere, and its camphor, whose wholesale value equalled its weight in silver, drew merchants from as far as the Mediterranean.\n\nThe sultan's court became a center of Islamic learning and Malay literary culture, attracting scholars and traders who spread the faith along every coast the sultanate touched. Brunei's golden age demonstrated that an island state could project power across vast stretches of ocean through commerce, diplomacy, and the judicious deployment of war prahus."
 nd_bno.3.a: "Un âge d’or digne de mémoire"
 nd_bno.4.t: "Les raids Dayak de la mer d'Iban"
 nd_bno.4.d: "The Iban people, known to outsiders as the Sea Dayaks, earned their fearsome reputation through generations of seaborne raiding from the rivers of Sarawak. Their bangkong war canoes, some over ninety feet long, could carry dozens of warriors armed with mandau swords and iron-tipped blowpipes. The Iban developed sophisticated naval tactics: small, poorly-manned canoes would be sent forward as bait, drawing enemy vessels into pursuit until they passed concealed positions where the main fleet waited in ambush.\n\nBy the nineteenth century, the Saribas Iban could assemble pirate fleets of two hundred bangkongs, striking terror along the entire northwest coast of Borneo. Their nocturnal attacks, using two-metre blowpipes that brought silent death in the darkness, were legendary. Even the well-armed ships of European colonial powers learned to respect the Dayak raiders who knew every river, reef, and current of these waters."
 nd_bno.4.a: "Les rivières et les mers de Bornéo nous appartiennent"
 nd_bno.5.t: "Les champs de diamants de Landak"
 nd_bno.5.d: "The alluvial diamond deposits of the Landak district, near the west coast of Borneo, are among the oldest known sources in the world: mining here dates back to at least 600 AD, making Borneo one of humanity's first diamond sources alongside India. The great Matan diamond, weighing 367 carats, was discovered by a Dayak laborer in these fields in 1787, the largest gem-quality rough diamond ever found in Kalimantan.\n\nBut diamonds were only one facet of Borneo's mineral wealth. Gold from the rivers of Sambas and Bau, antimony from the hills of Sarawak, iron ore from the interior mountains: all fed into a mining economy that attracted Chinese kongsi companies in the seventeenth century, organized into cooperative mining ventures that transformed the landscape. The wealth drawn from Borneo's earth has shaped the island's politics for centuries."
 nd_bno.5.a: "La terre livre ses trésors à qui sait où chercher"
 nd_bno.6.t: "Résistance contre l’empiétement européen"
 nd_bno.6.d: "As European colonial powers tightened their grip on the archipelago (the Dutch from the south and east, the British from the northwest) the peoples of Borneo mounted fierce resistance. Pangeran Antasari, the Banjarese prince who led the Banjar War of 1859-1863 against the Dutch, became the symbol of this defiance. He coordinated resistance across ethnic lines, smuggling firearms from the Kutai Sultanate and rallying both Banjar Malays and Dayak warriors to his cause.\n\nThe jungle itself became an ally. Dutch columns advancing upriver found their supply lines stretched to breaking, their soldiers felled by tropical disease, and their flanks harassed by warriors who melted back into the forest after each ambush. Though colonial power eventually prevailed through sheer material advantage, the spirit of resistance shaped Borneo's identity for generations."
 nd_bno.6.a: "Nos forêts et nos rivières sont nos plus grandes fortifications"
 nd_bno_headhunting_rites: "Rites de chasse aux têtes"
 nd_bno_headhunting_rites_desc: "La tradition Dayak de chasse aux têtes n'était pas une simple sauvagerie mais une pratique profondément spirituelle : on croyait que la tête d'un ennemi vaincu capturait le pouvoir de son âme, accordant force et protection à la communauté."
 nd_bno_longhouse_tradition: "Tradition de la maison longue"
 nd_bno_longhouse_tradition_desc: "Les grandes maisons longues de Bornéo, élevées sur pilotis en bois de fer et s'étendant jusqu'à trois cents mètres, servent de forteresses communales où des dizaines de familles vivent, travaillent et se défendent ensemble."
 nd_bno_riverine_navigation: "Navigation fluviale"
 nd_bno_riverine_navigation_desc: "Les rivières de Bornéo sont ses autoroutes. La maîtrise de la navigation fluviale (lecture des courants, navigation dans les rapides et construction de navires adaptés à la fois à la navigation fluviale et à la haute mer) est le fondement de toute puissance insulaire."
 nd_bno_jungle_ironworking: "Travail du fer dans la jungle"
 nd_bno_jungle_ironworking_desc: "Les forgerons Dayak forgent l'épée mandau à partir de minerai de fer récolté dans les montagnes intérieures, combinant un corps en fer doux pour éviter la casse avec un bord en fer plus dur pour un tranchant dévastateur."
 nd_bno_animist_spiritualism: "Spiritualisme animiste"
 nd_bno_animist_spiritualism_desc: "Avant l’arrivée de l’Islam, les peuples de Bornéo pratiquaient des traditions animistes centrées sur les esprits de la forêt, des rivières et des ancêtres : des croyances qui sous-tendent encore l’identité culturelle Dayak."
 nd_bno_forest_product_trade: "Commerce des produits forestiers"
 nd_bno_forest_product_trade_desc: "Les forêts de Bornéo recèlent des trésors autres que le bois : du rotin, de la cire d'abeille, de l'ivoire de calao et des nids d'oiseaux prisés dans toute l'Asie de l'Est pour leurs prétendues propriétés médicinales."
 nd_bno_sumpit_mastery: "Maîtrise du Sommet"
 nd_bno_sumpit_mastery_desc: "Le sumpit, la sarbacane Dayak, est une arme d'une précision terrifiante. Les fléchettes contenant du poison d'arbre ipoh peuvent provoquer la mort d'une seule égratignure, et les chasseurs expérimentés peuvent atteindre des cibles à plus de trente mètres."
 nd_bno_bangkong_warcraft: "Warcraft de Bang Kong"
 nd_bno_bangkong_warcraft_desc: "Le canot de guerre de Bangkok est l'arme des Sea Dayaks : un navire rapide et maniable sculpté dans un seul grand arbre, capable de transporter des dizaines de guerriers le long des rivières et à travers la mer."
 nd_bno_camphor_monopoly: "Monopole du camphre"
 nd_bno_camphor_monopoly_desc: "Borneo camphor, harvested from the Dryobalanops trees of the interior forests, commanded prices equivalent to its weight in silver on international markets.\n\n#italic Available in: $nd_bno_camphor_post$#!"
 nd_bno_brunei_thalassocracy: "Thalassocratie de Brunei"
 nd_bno_brunei_thalassocracy_desc: "Under Sultan Bolkiah, the Sultanate of Brunei became a true maritime empire, controlling trade routes from Sarawak to the southern Philippines. His capital stood on piles over the water of the estuary."
 nd_bno_malay_court_culture: "Culture de la cour malaise"
 nd_bno_malay_court_culture_desc: "Les tribunaux des sultanats de Bornéo ont adopté les traditions raffinées de la culture aristocratique malaise : des cérémonies élaborées, une littérature courtoise et un ordre social hiérarchique."
 nd_bno_kutai_hindu_legacy: "L'héritage hindou de Kutai"
 nd_bno_kutai_hindu_legacy_desc: "The Kutai Kingdom, founded in the fourth century, was the earliest Hindu polity in the East Indies. Its stone inscriptions in Pallava script are among the oldest evidence of Indian cultural influence in Southeast Asia."
 nd_bno_island_fortification: "Fortification de l'île"
 nd_bno_island_fortification_desc: "Les embouchures des rivières et les promontoires côtiers de Bornéo offrent des positions défensives naturelles qui, une fois fortifiées par des palissades en bois et des emplacements de canons, peuvent contrôler l'accès à des côtes entières."
 nd_bno_iban_sea_dayak_raids: "Raids Dayak de la mer d'Iban"
 nd_bno_iban_sea_dayak_raids_desc: "Les Dayaks de la mer d'Iban comptent parmi les guerriers les plus redoutés de l'Asie du Sud-Est maritime : leurs flottes de Bangkong, leurs tactiques d'embuscade coordonnées et leurs attaques nocturnes à la sarbacane ont brisé la volonté de forces bien plus importantes."
 nd_bno_spice_island_routes: "Itinéraires de l’île aux épices"
 nd_bno_spice_island_routes_desc: "Bornéo se trouve au carrefour entre les îles aux épices des Moluques, les marchés chinois et les routes commerciales vers l'Inde : une position offrant un immense avantage commercial pour ceux qui peuvent l'obtenir."
 nd_bno_landak_diamond_fields: "Champs de diamants de Landak"
 nd_bno_landak_diamond_fields_desc: "The alluvial diamond deposits of Landak, mined since at least 600 AD, make Borneo one of the world's oldest diamond sources. The great Matan diamond of 367 carats was found here.\n\n#italic Available in: $nd_bno_diamond_workshop$#!"
 nd_bno_banjarmasin_sultanate_rise: "Montée du sultanat de Banjarmasin"
 nd_bno_banjarmasin_sultanate_rise_desc: "Le sultanat de Banjar, fondé en 1526 après la chute de Negara Daha, a amené la gouvernance islamique et les réseaux commerciaux dans le sud de Bornéo."
 nd_bno_islamization_of_borneo: "Islamisation de Bornéo"
 nd_bno_islamization_of_borneo_desc: "La propagation de l'Islam sur les côtes de Bornéo a transformé le paysage politique de l'île, créant un réseau de sultanats liés par la foi, le commerce et le mariage dynastique."
 nd_bno_sulu_sea_dominance: "Domination de la mer de Sulu"
 nd_bno_sulu_sea_dominance_desc: "Control of the Sulu Sea means control of the trade routes linking Borneo, the Philippines, and the Spice Islands: a maritime dominion enforced by war prahus and by the brass swivel guns that the founders of Brunei cast for them."
 nd_bno_rattan_ironwood_exports: "Exportations de rotin et de bois de fer"
 nd_bno_rattan_ironwood_exports_desc: "Bornean ironwood, virtually indestructible and resistant to termites and saltwater, commands premium prices. Combined with rattan exports, these forest products are the backbone of the interior economy."
 nd_bno_sultanate_naval_reform: "Réforme navale du Sultanat"
 nd_bno_sultanate_naval_reform_desc: "Les sultanats de Bornéo modernisent leurs prahus de guerre avec des supports de canons et des constructions plus lourdes, créant ainsi une flotte de galères capable de défendre le vaste littoral de l'île."
 nd_bno_banjarmasin_pepper_trade: "Commerce du poivre de Banjarmasin"
 nd_bno_banjarmasin_pepper_trade_desc: "Sous le sultan Mustain Billah, Banjarmasin est devenue la plaque tournante dominante du commerce du poivre entre Malacca et Maluku, avec des marchands de Java, de Chine et d'Inde en compétition pour l'accès."
 nd_bno_anti_piracy_patrols: "Patrouilles anti-piratage"
 nd_bno_anti_piracy_patrols_desc: "Des patrouilles navales organisées répriment la piraterie endémique dans les eaux côtières de Bornéo, protégeant ainsi le commerce et projetant l'autorité de l'État insulaire unifié."
 nd_bno_chinese_kongsi_mining: "Mines chinoises de Kongsi"
 nd_bno_chinese_kongsi_mining_desc: "Chinese mining kongsi, cooperative companies organized by clans from Guangdong and Fujian, bring advanced mining techniques and labor organization to Borneo's gold and diamond fields.\n\n#italic Available in: $nd_bno_diamond_workshop$#!"
 nd_bno_dayak_confederation: "Confédération Dayak"
 nd_bno_dayak_confederation_desc: "Les divers peuples Dayak de l'intérieur (Iban, Bidayuh, Kayan, Kenyah et des dizaines d'autres) sont organisés en une confédération militaire lâche, s'appuyant sur les guerriers spécialisés de chaque tribu."
 nd_bno_court_of_the_sultan: "Cour du Sultan"
 nd_bno_court_of_the_sultan_desc: "Le tribunal du sultanat de Brunei ou de Banjarmasin devient un centre d'administration, de justice et de diplomatie, s'appuyant à la fois sur la jurisprudence islamique et sur le droit adat indigène."
 nd_bno_islamic_scholarship: "Bourse islamique"
 nd_bno_islamic_scholarship_desc: "Les mosquées et les madrasas ont diffusé l'enseignement islamique dans les régions côtières de Bornéo, créant ainsi une classe alphabétisée d'érudits, de juges et d'administrateurs."
 nd_bno_banjarmasin_naval_arsenal: "Arsenal naval de Banjarmasin"
 nd_bno_banjarmasin_naval_arsenal_desc: "Les rivières du sud de Bornéo fournissent le bois et la ferronnerie pour une flotte de galères armées de canons, combinant les traditions locales de construction navale avec la technologie de la poudre à canon."
 nd_bno_european_resistance: "Résistance européenne"
 nd_bno_european_resistance_desc: "La résistance de Pangeran Antasari contre l’expansion coloniale néerlandaise a démontré que les jungles et les rivières de Bornéo pouvaient saigner même les armées de l’ère industrielle."
 nd_bno_gold_antimony_mines: "Mines d'or et d'antimoine"
 nd_bno_gold_antimony_mines_desc: "The gold fields of Sambas and Bau, combined with antimony deposits in Sarawak's hills, fuel an expanding mining economy that reshapes the island's interior.\n\n#italic Available in: $nd_bno_diamond_workshop$#!"
 nd_bno_pangeran_antasari_legacy: "L'héritage de Pangeran Antasari"
 nd_bno_pangeran_antasari_legacy_desc: "Le prince banjarais qui a mené la guerre de Banjar est devenu un symbole de résistance : coordonnant les forces malaises et Dayak, faisant passer des armes en contrebande depuis Kutai et menant une campagne de guérilla qui a duré des années."
 nd_bno_strait_toll_system: "Système de péage du détroit"
 nd_bno_strait_toll_system_desc: "Le contrôle des détroits et des embouchures des rivières autour de Bornéo permet de percevoir des péages sur tout le trafic maritime : un système mis au point par le sultanat de Brunei au sommet de sa puissance."
 nd_bno_borneo_interior_roads: "Routes intérieures de Bornéo"
 nd_bno_borneo_interior_roads_desc: "Cutting roads through Borneo's dense interior rainforest connects the coast to the mineral-rich hinterland, allowing efficient extraction and administration of previously isolated regions. The tracks reach the limestone caves where swiftlet nests are cut for the China trade."
 nd_bno_banjar_war_resistance: "Résistance à la guerre de Banjar"
 nd_bno_banjar_war_resistance_desc: "Les leçons de la guerre de Banjar (tactiques de guérilla en terrain dense, coopération militaire interethnique et exploitation des lignes de ravitaillement intérieures) façonnent une doctrine militaire moderne."
 nd_bno_modern_pepper_plantations: "Plantations de poivre modernes"
 nd_bno_modern_pepper_plantations_desc: "La culture industrielle du poivre transforme les vallées fluviales du sud de Bornéo en l'une des principales régions productrices d'épices au monde."
 nd_bno_unified_island_administration: "Administration insulaire unifiée"
 nd_bno_unified_island_administration_desc: "Pour la première fois, un système administratif unique relie les divers sultanats côtiers et confédérations intérieures de Bornéo sous une gouvernance coordonnée."
 nd_bno_coastal_modernization: "Modernisation côtière"
 nd_bno_coastal_modernization_desc: "Les chantiers navals, phares et installations portuaires modernes transforment les villes côtières de Bornéo de postes commerciaux traditionnels en centres de commerce régional."
 nd_bno_diamond_trade_reform: "Réforme du commerce du diamant"
 nd_bno_diamond_trade_reform_desc: "La rationalisation des pratiques d'extraction et de commerce fait entrer l'industrie du diamant de Bornéo dans l'ère moderne, reliant les anciens gisements de Landak aux marchés mondiaux des pierres précieuses."
 nd_bno_borneo_sovereignty: "Souveraineté de Bornéo"
 nd_bno_borneo_sovereignty_desc: "Un Bornéo unifié affirme sa souveraineté en tant que grande puissance insulaire : reconnue par les États voisins et imposant le respect par sa richesse, sa force militaire et son patrimoine culturel."
 a_nd_bno_dayak_headhunters: "Chasseurs de têtes Dayak"
 a_nd_bno_dayak_headhunters_desc: "Des guerriers armés de Mandau issus des communautés des maisons longues, dont les traditions de chasse aux têtes forgent des combattants intrépides qui sèment la terreur chez tous ceux qui les affrontent dans la jungle."
 a_nd_bno_blowgunners: "Sarbacanes de Bornéo"
 a_nd_bno_blowgunners_desc: "Tirailleurs armés de la sarbacane de sommité, tirant des fléchettes à pointe empoisonnée en bambou et en bois de fer. Une simple égratignure causée par leurs fléchettes empoisonnées à l'ipoh peut entraîner la mort en quelques minutes."
 a_nd_bno_iban_sea_raiders: "Pillards marins d'Iban"
 a_nd_bno_iban_sea_raiders_desc: "Amphibious warriors of the Sea Dayak tradition, equally at home raiding from bangkong war canoes or fighting through dense jungle, known for their devastating ambush tactics. They wear little armor and suffer when a formed enemy stands to meet them."
 n_nd_bno_prahu_bangkong: "Prahu Bang Kong"
 n_nd_bno_prahu_bangkong_desc: "La pirogue de guerre rapide des peuples Dayak : légère, maniable et taillée dans un seul grand arbre. Ce qui lui manque en armement, il le compense par la vitesse et la férocité de son équipage."
 n_nd_bno_sultanate_war_prahu: "Guerre du Sultanat Prahu"
 n_nd_bno_sultanate_war_prahu_desc: "Une galère armée plus lourde développée par les sultanats côtiers, montant des canons parallèlement aux tactiques d'abordage traditionnelles. Ces navires patrouillent dans les détroits et les embouchures des rivières de Bornéo."
 n_nd_bno_pepper_trader: "Négociant en poivre de Bornéo"
 n_nd_bno_pepper_trader_desc: "Un navire de commerce rapide optimisé pour les routes des épices entre Bornéo, Maluku et l'archipel au sens large. La vitesse est sa meilleure défense contre la piraterie endémique de ces eaux."
 n_nd_bno_banjarmasin_cannon_boat: "Bateau-canon Banjarmasin"
 n_nd_bno_banjarmasin_cannon_boat_desc: "Une galère fluviale armée de canons lourds, développée pour patrouiller les voies navigables du sud de Bornéo. Son faible tirant d'eau lui permet de naviguer dans les affluents où les gros navires ne peuvent pas suivre."
 nd_bno_longhouse: "Maison longue Dayak"
 nd_bno_longhouse_desc: "Une grande demeure communautaire élevée sur pilotis en bois de fer, abritant des dizaines de familles sous un même toit. La maison longue sert de forteresse, de grenier, d’armurerie et de centre de la vie communautaire."
 nd_bno_longhouse_upkeep: "Entretien de la maison longue"
 nd_bno_longhouse_upkeep_desc: "Conserver la structure massive en bois de fer et en bambou d'une maison longue traditionnelle."
 nd_bno_camphor_post: "Poste de traite du camphre"
 nd_bno_camphor_post_desc: "Un dépôt commercial spécialisé dans le camphre de Bornéo, la résine aromatique récoltée sur les arbres Dryobalanops qui se vend à des prix équivalents à son poids en argent."
 nd_bno_camphor_processing: "Traitement du camphre"
 nd_bno_camphor_processing_desc: "Camphor crystals brought down from the interior forests are cleaned, sorted, and packed in jars for the ships."
 nd_bno_diamond_workshop: "Atelier sur la mine de diamant"
 nd_bno_diamond_workshop_desc: "Une exploitation minière alluviale extrayant des diamants des graviers fluviaux en utilisant des techniques traditionnelles d'orpaillage et d'éclusage perfectionnées au fil des siècles dans le district de Landak."
 nd_bno_alluvial_mining: "Exploitation minière alluviale"
 nd_bno_alluvial_mining_desc: "Extraction de diamants et de pierres précieuses à partir de graviers fluviaux à l'aide de techniques traditionnelles d'orpaillage et d'éclusage."
 nd_bno_pepper_estate: "Domaine de la plantation de poivre"
 nd_bno_pepper_estate_desc: "Une plantation de poivre gérée le long des vallées fluviales du sud de Bornéo, produisant l'épice qui a fait de Banjarmasin l'un des grands ports commerciaux de l'archipel."
 nd_bno_pepper_cultivation: "Culture du poivre"
 nd_bno_pepper_cultivation_desc: "Cultiver et récolter du poivre dans les plantations de vigne des vallées fluviales humides du sud de Bornéo."
 nd_bno_sultanate_mosque: "Mosquée du Sultanat"
 nd_bno_sultanate_mosque_desc: "Un centre d'apprentissage et de jurisprudence islamiques, combinant les fonctions de mosquée, de madrasa et de tribunal. Ces institutions diffusent l’alphabétisation et les capacités administratives dans les sultanats côtiers."
 nd_bno_mosque_maintenance: "Entretien de la mosquée"
 nd_bno_mosque_maintenance_desc: "Entretenir la maçonnerie et la bibliothèque d'une mosquée et d'une madrasa du sultanat."
 nd_bno_beeswax_processing_pm: "Traitement de la cire d'abeille"
 nd_bno_beeswax_processing_pm_desc: "The combs are cut down at night from the high branches of the tapang. The wax is melted, strained, and cast into cakes for export."
 nd_bno_tapang_grove: "Tapang Grove"
 nd_bno_tapang_grove_desc: "A stand of tapang, the honey trees of the Bornean forest. Each tree has its owner, and the combs are taken by climbers who go up on pegs driven into the trunk."
 nd_bno_water_village: "Kampong Ayer"
 nd_bno_water_village_desc: "A town of houses raised on ironwood piles over the estuary and joined by plank walks. Its market is held in boats that pass from house to house."
 nd_bno_water_village_upkeep: "Piles and Walkways"
 nd_bno_water_village_upkeep_desc: "Ironwood for the piles, tar for the boats, and fish for the market."
 nd_bno_rattan_works: "Rattan Works"
 nd_bno_rattan_works_desc: "Rattan cut in the forest is split and woven here into mats, baskets, and cane work for the river ports."
 nd_bno_rattan_weaving_pm: "Rattan Weaving"
 nd_bno_rattan_weaving_pm_desc: "Cane is scraped, split into strips, and plaited into mats and baskets on frames of ironwood."
 nd_bno_nest_cave: "Nest Cave"
 nd_bno_nest_cave_desc: "A limestone cave where swiftlets build their nests high in the roof. The right to gather them is held by the families of the district and the harvest is sold to China."
 nd_bno_birds_nest_pm: "Récolte des nids d'oiseaux"
 nd_bno_birds_nest_pm_desc: "The nests are cut from the cave roof by climbers on rattan ladders and bamboo poles. They are prized in China as a tonic and a delicacy."
 nd_bno_gold_panning_pm: "Opérations d’orpaillage"
 nd_bno_gold_panning_pm_desc: "Orpaillage alluvial des rivières de Bornéo à l'aide de techniques perfectionnées par les mineurs chinois de Kongsi."
 nd_bno_antimony_smelting_pm: "Fusion d'antimoine"
 nd_bno_antimony_smelting_pm_desc: "Fusion du minerai d'antimoine des collines du Sarawak en outils et alliages métalliques."
 levy_nd_bno_dayak_headhunters: "Bande de chasseurs de têtes Dayak"
 levy_nd_bno_dayak_headhunters_desc: "De féroces guerriers Dayak venus des maisons longues de l'intérieur : des chasseurs de têtes brandissant des mandau qui terrorisent les envahisseurs côtiers."
 levy_nd_bno_iban_sea_raiders: "Flotte de raiders maritimes d'Iban"
 levy_nd_bno_iban_sea_raiders_desc: "Guerriers amphibies Iban qui attaquent par voie fluviale et maritime : redoutés sur les côtes de Bornéo pour leurs attaques rapides en chaloupe."
 nd_bno_formed_tt: "Bornéo a été formé"
 nd_bno_path_a_tt: "Choisissez la Thalassocratie des Mers de l'Est"
 nd_bno_path_b_tt: "Choisissez les seigneurs de la forêt tropicale"
 nd_bno_dest_ngabang_developed_tt: "Ngabang is held and its development is at least #bold 18#!"
 nd_bno_dest_martapura_developed_tt: "Martapura is held and its development is at least #bold 28#!"
 nd_bno_destiny: "Destin de Bornéo"
 nd_bno_destiny_desc: "La grande île reste unifiée. Nous devons maintenant prouver que Bornéo peut perdurer comme bien plus qu’un simple ensemble de sultanats fluviaux et de confédérations de maisons longues. Stabilisez le royaume avant de choisir notre voie à suivre."
 nd_bno_dest_sulu: "Domination de la mer de Sulu"
 nd_bno_dest_sulu_desc: "Saisissez l'archipel de Sulu et faites de Bornéo la puissance maritime dominante dans les mers orientales. Le contrôle de Sulu ouvre les routes commerciales vers les Philippines et les îles aux épices. Nécessite le contrôle de Maimbung et l’accès au commerce du poivre."
 nd_bno_dest_straits: "Maître du détroit"
 nd_bno_dest_straits_desc: "Commandez les grands points d’étranglement maritimes de l’Asie du Sud-Est. Avec Malacca et Ternate sous notre bannière, chaque navire qui navigue entre l'océan Indien et le Pacifique se doit de rendre hommage à Bornéo."
 nd_bno_dest_archipelago: "Empire de l'archipel"
 nd_bno_dest_archipelago_desc: "De la baie de Manille au détroit de Makassar, le monde insulaire de l’Asie du Sud-Est répond à Bornéo. C’est l’empire maritime dont le sultan Bolkiah de Brunei ne pouvait que rêver : une thalassocratie couvrant tout l’archipel."
 nd_bno_dest_interior: "Coeur de la jungle"
 nd_bno_dest_interior_desc: "Build up Ngabang, the seat of the Landak diggings, and make the interior of Borneo a source of unmatched wealth. Gold from the rivers, diamonds from the earth, and ironwood from the ancient forests: the rainforest is an inexhaustible treasury for those who know its secrets."
 nd_bno_dest_rivers: "Seigneur des mille rivières"
 nd_bno_dest_rivers_desc: "Étendre la puissance fluviale de Bornéo au-delà de l'île. Palembang, le grand sultanat du fleuve Sumatra, partage notre modèle de domination des voies navigables intérieures. Conquérez-le et prouvez que les seigneurs de la forêt tropicale peuvent projeter leur pouvoir à travers les mers."
 nd_bno_dest_sovereignty: "Souveraineté du royaume vert"
 nd_bno_dest_sovereignty_desc: "The interior of Borneo (the oldest rainforest on Earth) becomes the seat of a great power, with Martapura built up as its inland capital. From Java's heartland to the jungle-clad mountains of the interior, the Lords of the Rainforest have built an empire that no colonial power can penetrate."
 nd_bno.7.t: "Un Bornéo unifié"
 nd_bno.7.d: "The longhouse councils and the sultanate courts have at last acknowledged a single sovereign authority over the world's third-largest island. From the mangrove swamps of the south to the mountain forests of the Crocker Range, from the river deltas of Sarawak to the diamond fields of Landak, Borneo speaks with one voice.\n\nThis is no small achievement. The island's immense size, impenetrable interior, and staggering cultural diversity (Dayak, Malay, Kutai, Banjar, Iban, and dozens more) have defeated every previous attempt at unification. The question now is not whether we can hold this realm together, but what we shall make of it."
 nd_bno.7.a: "Bornéo uni ne fait qu'un"
 nd_bno.8.t: "La chute de Sulu"
 nd_bno.8.d: "The Sulu Archipelago, that chain of islands stretching between Borneo and Mindanao, has long been the domain of independent sultans and pirate chiefs who preyed upon the sea lanes with impunity. Our war prahus have broken their resistance. The harbour of Maimbung, seat of the Sulu Sultanate, now flies our banner.\n\nWith Sulu in our hands, we command the sea routes connecting Borneo to the Philippines and the Spice Islands beyond. The pepper merchants who once had to negotiate with a dozen petty rulers now deal with one authority. This is the first step toward a true thalassocracy of the eastern seas."
 nd_bno.8.a: "Les routes maritimes nous sont ouvertes"
 nd_bno.9.t: "Commandement du détroit"
 nd_bno.9.d: "Two of the most strategically vital points in all of Southeast Asia now answer to Borneo. Malacca, the ancient gateway between the Indian Ocean and the South China Sea, channels the riches of India, Arabia, and East Africa through our customs houses. Ternate, the volcanic spice island that once drove European powers to war, adds cloves and nutmeg to our dominion.\n\nThis is a thalassocracy not merely of coasts but of chokepoints. Every merchant vessel, every war fleet, every diplomatic mission that passes through these waters must reckon with Borneo's reach. The question is how to wield this power: shall we grow rich from tolls and trade agreements, or shall we build the naval force to project our authority further still?"
 nd_bno.9.a: "Établir des péages à chaque détroit"
 nd_bno.9.b: "Construire des flottes pour renforcer notre monopole sur les épices"
 nd_bno.10.t: "Empire de l'Archipel"
 nd_bno.10.d: "Manila Bay and the Makassar Strait (the northern and southern gates of the island world) now both fly Borneo's flag. What Sultan Bolkiah achieved in Brunei's golden age was merely the prelude. We have built something far greater: a maritime empire encompassing the Philippines, the Spice Islands, the Malay Peninsula, and the vast island of Borneo itself.\n\nOur war prahus patrol waters that span over three thousand miles. Our merchants trade from the Bay of Bengal to the coast of New Guinea. This is a power built not on Continental conquest but on the mastery of wind, wave, and the thousands of islands that dot the seas between Asia and Australia. Shall we consolidate this domain through diplomacy and integration, or maintain it through overwhelming naval supremacy?"
 nd_bno.10.a: "Gouverner par la diplomatie et la prospérité partagée"
 nd_bno.10.b: "Règle à travers la flotte - nos prahus sont la loi"
 nd_bno.11.t: "Trésors de l'intérieur"
 nd_bno.11.d: "While lesser powers quarrel over coastal trading posts, we have turned our attention to the true wealth of Borneo: its interior. The diamond fields of Landak, mined since before the age of the Prophet, yield gems that rival anything from India. Gold dust gathers in every river bend. Ironwood forests, some trees a thousand years old, provide timber that no termite can gnaw and no saltwater can rot.\n\nOur roads and river improvements now connect the coast to the heart of the jungle. Where once only the bravest Dayak traders ventured, now a regular trade in gold, diamonds, camphor, and beeswax flows toward the coast. The rainforest is not an obstacle. It is our greatest asset."
 nd_bno.11.a: "La jungle cède ses richesses à ceux qui la respectent"
 nd_bno.12.t: "Les royaumes fluviaux"
 nd_bno.12.d: "Palembang has fallen. The great Sumatran river sultanate, which once controlled the interior waterways of southern Sumatra as we control the rivers of Borneo, now acknowledges our sovereignty. This conquest was not merely strategic but symbolic: we have proven that Borneo's model of riverine power (control the rivers, control the land) can be projected across the seas.\n\nOur armies, hardened in jungle warfare and river fighting, have shown themselves superior to any force that relies on roads and open ground. The question is how to consolidate this victory: shall we govern through military strength, or use our mineral wealth to buy the loyalty of a vast inland empire?"
 nd_bno.12.a: "Gouverner grâce à la force de nos flottes fluviales"
 nd_bno.12.b: "Laissons la richesse en diamants acheter la fidélité des sujets"
 nd_bno.13.t: "Souveraineté du royaume vert"
 nd_bno.13.d: "The interior heartland of Java (the most populous island in the archipelago) has been brought under our dominion. Mataram, seat of the great Javanese kingdoms, now answers to the Lords of the Rainforest. This is an achievement that would have seemed impossible to the Dayak longhouse chiefs of a century ago: an empire stretching from the oldest rainforest on Earth across the richest agricultural lands of the tropics.\n\nWe have built this power not through naval supremacy but through the mastery of interior warfare, the development of our mineral wealth, and the patient absorption of the peoples who share our island and archipelago. Shall we honor the resistance legacy of Pangeran Antasari, building an army that can never be conquered, or forge a new Dayak identity that unites every people of the interior?"
 nd_bno.13.a: "Honorez l'héritage de la résistance d'Antasari"
 nd_bno.13.b: "Forgez un nouvel empire Dayak à partir des peuples de la jungle"
 STATIC_MODIFIER_NAME_nd_bno_dest_strait_tolls: "Revenus des péages du détroit"
 STATIC_MODIFIER_DESC_nd_bno_dest_strait_tolls: "Les points d’étranglement de l’Asie du Sud-Est génèrent un flux constant de revenus de péage pour chaque navire qui traverse nos eaux, même si le maintien de ces vastes possessions maritimes met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_bno_dest_spice_fleets: "Suprématie de la flotte d'épices"
 STATIC_MODIFIER_DESC_nd_bno_dest_spice_fleets: "Nos flottes de guerre exercent un monopole sur le commerce des épices, obligeant les États voisins à accepter nos conditions. La projection constante de la puissance navale se fait au détriment du prestige du royaume sur terre."
 STATIC_MODIFIER_NAME_nd_bno_dest_island_empire: "Administration de l'Empire insulaire"
 STATIC_MODIFIER_DESC_nd_bno_dest_island_empire: "Un système administratif sophistiqué relie les îles les plus éloignées de notre empire maritime, intégrant divers peuples sous une couronne commune."
 STATIC_MODIFIER_NAME_nd_bno_dest_sea_of_prahus: "Mer de Prahus"
 STATIC_MODIFIER_DESC_nd_bno_dest_sea_of_prahus: "Nos flottes de prahu de guerre patrouillent dans chaque détroit et port, projetant une force navale écrasante qui nous permet de frapper n'importe où dans l'archipel avec une vitesse dévastatrice."
 STATIC_MODIFIER_NAME_nd_bno_dest_river_lords: "Domination des seigneurs des rivières"
 STATIC_MODIFIER_DESC_nd_bno_dest_river_lords: "Notre maîtrise de la guerre fluviale et de la logistique intérieure nous permet d'attaquer n'importe quelle fortification le long des voies navigables, même si la marine côtière souffre de sa concentration sur l'intérieur des terres."
 STATIC_MODIFIER_NAME_nd_bno_dest_diamond_throne: "Trône de diamant"
 STATIC_MODIFIER_DESC_nd_bno_dest_diamond_throne: "L’immense richesse minérale de l’intérieur de Bornéo finance une armée plus nombreuse que n’importe quel voisin ne peut en déployer, même si cette focalisation sur l’intérieur limite notre portée diplomatique."
 STATIC_MODIFIER_NAME_nd_bno_dest_pangeran_legacy: "L'héritage de Pangeran Antasari"
 STATIC_MODIFIER_DESC_nd_bno_dest_pangeran_legacy: "Les traditions de guérilla de la résistance de Pangeran Antasari perdurent dans notre cavalerie et nos combattants de la jungle, qui peuvent se renforcer rapidement et opérer avec un financement minimal."
 STATIC_MODIFIER_NAME_nd_bno_dest_dayak_empire: "Empire Dayak"
 STATIC_MODIFIER_DESC_nd_bno_dest_dayak_empire: "Les divers peuples Dayak ont ​​été unis en une seule identité impériale, avec un recrutement rapide, une attrition minimale de l'offre et une économie stable."
 nd_bno_strait_citadel: "Citadelle du détroit"
 nd_bno_strait_citadel_desc: "Un complexe portuaire fortifié contrôlant l’un des points d’étranglement maritimes de l’Asie du Sud-Est. Des bastions en pierre et des emplacements de canons protègent le mouillage tandis que les douanes extraient les péages de chaque navire qui passe."
 nd_bno_citadel_upkeep: "Entretien de la Citadelle"
 nd_bno_citadel_upkeep_desc: "Entretenir les fortifications en pierre, les magasins navals et les infrastructures douanières d'une citadelle de détroit."
 nd_bno_ironwood_fortress: "Forteresse de Bois de Fer"
 nd_bno_ironwood_fortress_desc: "Une immense forteresse intérieure construite à partir de bois de fer de Bornéo : un bois si dense qu'il coule dans l'eau et résiste à la pourriture pendant des siècles. Ces forteresses contrôlent les systèmes fluviaux de l’intérieur, projetant leur puissance au plus profond de la jungle."
 nd_bno_fortress_upkeep: "Entretien de la forteresse"
 nd_bno_fortress_upkeep_desc: "Entretenir les palissades en bois de fer, les tours de guet et les chaînes de blocage des rivières d'une forteresse intérieure."
 AUTO_MODIFIER_NAME_nd_bno_bureaucracy_authority: "Trône des Sultanats de Bornéo"
 AUTO_MODIFIER_DESC_nd_bno_bureaucracy_authority: "Du cabinet des quatre wazirs de Brunei aux gouverneurs pangerans des districts du diamant et de l’or, du Tuai Rumah des maisons longues en amont à l’amirauté lanoun des mers du nord, le patrimoine institutionnel de chaque sultanat côtier et de chaque pacte intérieur est rassemblé sous un seul trône. L’État unifié dispose de l’appareil nécessaire pour faire de lui-même quelque chose de plus que la somme de ses sultanats."
 bno_wazir_council_bureaucracy: "Conseil Wazir de Brunei"
 bno_wazir_council_bureaucracy_desc: "Le cabinet civil à quatre piliers qui a donné au sultanat de Brunei sa forme administrative depuis le règne du sultan Bolkiah (r. 1485-1524) jusqu'au XIXe siècle. Le Pengiran Bendahara dirigeait la chancellerie et était le doyen des quatre ; le Pengiran Di-Gadong détenait le trésor et les douanes à l'embouchure du fleuve Brunei ; le Pengiran Pemancha surveillait les terres du sultan et les juridictions en amont ; le Pengiran Temenggung commandait les prahus de guerre et la garde du palais. Issus des nobles clans Berunai par nomination sultanique, les wazirs exerçaient en pratique des fonctions dans des lignées nobles et le conseil, siégeant dans l'istana, pouvait l'emporter sur n'importe quel sultan. Tous les autres sultanat de Bornéo ont copié le modèle en miniature."
 bno_pangeran_mining_bureaucracy: "Districts miniers de Pangeran"
 bno_pangeran_mining_bureaucracy_desc: "Les gouverneurs héréditaires agréés des champs de diamants de Landak et de Cempaka, des mines d'or de Bau et de Sambas et des filons d'antimoine du haut Sarawak. Les pangerans de Sambas, Mempawah et Landak délivraient des concessions minières, prenaient une proportion fixe du rendement (un dixième était la coutume) et arbitraient les différends entre les fraternités kongsi des mineurs Hakka (la République de Lanfang à Mandor à partir de 1777, le Heshun Zongting à Monterado, le Dagang à Mempawah), les bassins de main-d'œuvre Dayak et la capitale côtière malaise. Les Sambas pangerans étaient parfois plus riches que leurs suzerains nominaux du Brunei, mais le pouvoir a obligé le trône à accepter l'autonomie gouvernementale des kongsi et la prédominance démographique des Hakka dans les districts miniers."
 bno_tuai_rumah_compact_bureaucracy: "Maison longue compacte Tuai Rumah"
 bno_tuai_rumah_compact_bureaucracy_desc: "La reconnaissance coutumière du chef de la maison longue Iban et Bidayuh (le Tuai Rumah, avec de hauts chefs régionaux appelés Penghulu et le suprême Temenggong des Sea Dayaks) comme interlocuteur du trône pour les communautés en amont du Sungai Rajang, du Sungai Sarawak et du Sungai Sariba. Chaque Tuai Rumah était le chef élu de sa maison longue bilek (trente à soixante maisons sous un même toit en bois de fer), responsable des décisions adat, de l'attribution des parcelles sur brûlis et de l'envoi de guerriers à l'appel du sultan. Le pacte a donné au trône côtier ce que l'administration directe n'a jamais réalisé : des recrues des hautes terres, une paix médiatrice entre les maisons longues en conflit et un canal reconnu pour les tributs forestiers, en échange de la non-ingérence dans l'adat."
 bno_lanun_admiralty_bureaucracy: "Amirauté Lanun Sea-Raider"
 bno_lanun_admiralty_bureaucracy_desc: "Le régime de piraterie institutionnalisé des mers de Sulu et du nord de Bornéo, par lequel les sultans de Brunei et de Sulu et (après 1768 environ) les petits datus de Tempasuk, de la baie de Marudu et de Pandasan ont autorisé les croisières Iranun et Balanini contre les navires espagnols, néerlandais et Bugis en échange d'une part publiée d'esclaves, de rançons et de marchandises. Les flottes lanun (parfois fortes de 200 prahus, avec des équipages issus des Iranun du sud de Mindanao et des Balanini Samal de Tawi-Tawi) ont couru d'avril à octobre sur la mousson du sud-ouest, ont attaqué jusqu'à Java et Célèbes, et ont ramené leurs captures chez elles pour adjudication sultanique et revente au marché Jolo de Sulu. L’institution a rendu la côte nord riche et redoutée, et a résisté à l’intrusion européenne pendant deux générations au-delà de ce que sa simple faiblesse aurait permis."
 bno_basanga_tribute_bureaucracy: "Hommage à la forêt de Basanga"
 bno_basanga_tribute_bureaucracy_desc: "L'adat-hommage coutumier des produits forestiers par lequel les peuples Bidayuh, Penan et Dayak de l'intérieur des terres livraient du rotin, du camphre (le précieux barus de Bornéo), du bois d'aigle gaharu, de la cire d'abeille, de la résine de sang de dragon, des nids d'oiseaux comestibles et des pierres de bézoard aux agents côtiers de Malaisie et de Brunei en échange de sel, d'outils en fer et de tissus de commerce. Le basanga était évalué par les chefs de district pour chaque maison longue, collecté dans les postes commerciaux au bord de la rivière (le pasar) à la tête des Sungai Sambas et du Sungai Sarawak, et envoyé au sultanat comme part du trône des produits des hautes terres. Le système était l'économie de travail de l'intérieur pré-moderne : le camphre barus de Bornéo était vendu à Alep et au Caire pour son poids en argent, et les nids d'oiseaux de Niah financent toujours les fortunes du Sarawak. Mais cela dépendait de la tenue du système de postes commerciaux."
 nd_bno_mandau_forge: "Mandau Forge"
 nd_bno_mandau_forge_desc: "An upriver smithy where Dayak smiths smelt the ore of the interior and forge the mandau from it. The finest old blades were called mantikei, after the Ngaju village that made them."
 nd_bno_mandau_forging: "Mandau Forging"
 nd_bno_mandau_forging_desc: "Iron smelted in a clay furnace and charcoal burned from the forest around it. A soft body is welded to a hard edge, and the blade is ground hollow on one face and rounded on the other."
 nd_bno_kubu: "Kubu"
 nd_bno_kubu_desc: "A stockade of ironwood posts raised at a river mouth or on a headland, with swivel guns behind the palisade. Whoever holds the kubu decides who goes upriver."
 nd_bno_kubu_upkeep: "Kubu Upkeep"
 nd_bno_kubu_upkeep_desc: "Ironwood for the palisade, swivel guns for the embrasures and arms for the men who watch the river."
 nd_bno_lantaka_foundry: "Lantaka Foundry"
 nd_bno_lantaka_foundry_desc: "A brass foundry of the Brunei water villages. Its swivel guns arm the war prahus of the island, and the small ones change hands as money: a fine, a debt or a bride price can be paid in guns."
 nd_bno_lantaka_casting: "Lantaka Casting"
 nd_bno_lantaka_casting_desc: "Copper and tin melted over charcoal and poured into clay moulds, then chased with the petal and scroll work of the Brunei founders."
