l_french:
 nd_num_formed_tt: "Numunu Sookobitu formé"
 nd_num_path_a_tt: "Chemin de l'Empire continental"
 nd_num_path_b_tt: "Voie de la nation souveraine"
 nd_num_dest_guachichil_share_tt: "At least half of the Guachichil area is held by us or our subjects"
 nd_num_dest_council_lodges_tt: "A #bold Council Lodge#! stands in at least #bold 8#! of our locations"
 # ============================================================
 # Static modifier loc (formation choices + DHE rewards)
 # ============================================================
 STATIC_MODIFIER_NAME_nd_num_continental_empire: "Empire continental"
 STATIC_MODIFIER_DESC_nd_num_continental_empire: "Numunu Sookobitu chevauche en tant qu'empire d'hommage de raid. Les paraibos et les tekwuniwapi commandent un État mobile extrayant le tribut des régions frontalières, des captifs absorbés par la nation par le biais de la bande de guerre, l'économie du bison soutenant un empire qui se déplace avec le troupeau."
 STATIC_MODIFIER_NAME_nd_num_sovereign_nation: "Nation souveraine"
 STATIC_MODIFIER_DESC_nd_num_sovereign_nation: "La nation Comanche est consolidée en tant qu'État avec des frontières définies, le Conseil de la nation Comanche siège en permanence, une école d'alphabétisation numérique et de diplomatie de traités avec les puissances voisines. L'empire du cheval devient une nation parmi les nations."
 STATIC_MODIFIER_NAME_nd_num_council_hill_compact: "Pacte de Council Hill"
 STATIC_MODIFIER_DESC_nd_num_council_hill_compact: "À Council Hill, les paraibos négocient un pacte continental, les ambassades sont reçues avec un protocole formel. Les Comanches parlent comme la puissance suprême des plaines du sud."
 STATIC_MODIFIER_NAME_nd_num_council_hill_armed_peace: "Paix armée"
 STATIC_MODIFIER_DESC_nd_num_council_hill_armed_peace: "La paix en position de force : chaque concession des voisins se reflète dans un campement fortifié Comanche. Les troupeaux de chevaux restent sellés, prêts."
 STATIC_MODIFIER_NAME_nd_num_assimilation_engine: "Les nations absorbées"
 STATIC_MODIFIER_DESC_nd_num_assimilation_engine: "Les Mexicains, les Pueblos, les Anglos capturés lors de raids sont adoptés, élevés comme des enfants Comanches et se marient dans les bandes. Les Comanches deviennent une nation multiethnique grâce au moteur d'incorporation captive."
 STATIC_MODIFIER_NAME_nd_num_tribute_engine: "Extraction d'hommage"
 STATIC_MODIFIER_DESC_nd_num_tribute_engine: "Les captifs sont rachetés à leurs proches contre des chevaux, des armes et de l'argent. Le cycle de raid saisonnier devient un système de tribut garantissant le trésor impérial."
 STATIC_MODIFIER_NAME_nd_num_comanchero_license: "Licence Comanchero"
 STATIC_MODIFIER_DESC_nd_num_comanchero_license: "Les commerçants du Nouveau-Mexique sont autorisés à entrer dans la Comancheria. Des caravanes traversent le Llano transportant des armes et des objets métalliques vers le nord, revenant avec des chevaux, des peaux et des captifs à destination du marché de Santa Fe."
 STATIC_MODIFIER_NAME_nd_num_direct_caravan: "Commerce direct de caravanes"
 STATIC_MODIFIER_DESC_nd_num_direct_caravan: "Les Comanche envoient leurs propres caravanes au sud jusqu'à Santa Fe et à l'est jusqu'aux colonies anglo-saxonnes. Aucun intermédiaire ne prend part au commerce frontalier."
 STATIC_MODIFIER_NAME_nd_num_great_raid_press: "Appuyez sur le Raid"
 STATIC_MODIFIER_DESC_nd_num_great_raid_press: "Le cycle de raids saisonniers vers le Texas, Coahuila et Nuevo Leon dépouille les provinces du nord du Mexique de leur bétail et de leurs captifs. Les cavaliers reviennent chargés."
 STATIC_MODIFIER_NAME_nd_num_great_raid_consolidate: "Consolider le raid"
 STATIC_MODIFIER_DESC_nd_num_great_raid_consolidate: "Les chevaux capturés et les guerriers absorbés sont rassemblés en bandes. L'armée grandit grâce au raid plutôt que d'y être dépensée."
 STATIC_MODIFIER_NAME_nd_num_mexico_offensive: "Offensive Bajio"
 STATIC_MODIFIER_DESC_nd_num_mexico_offensive: "La colonne de huit cents guerriers passe par Saltillo et Monterrey jusqu'au Bajio lui-même. Zacatecas brûle ; les haciendas de San Luis Potosi sont payantes ou vides. À chaque cycle, la ligne de guerre se déplace vers le sud."
 STATIC_MODIFIER_NAME_nd_num_mexico_consolidation: "Frontière tributaire"
 STATIC_MODIFIER_DESC_nd_num_mexico_consolidation: "Le nord du Mexique n’est plus tant pillé que taxé. Les gouverneurs provinciaux négocient des paiements annuels en chevaux, en argent et en captifs rachetés ; le trésor de la Comancheria fonctionne avec le peso mexicain."
 STATIC_MODIFIER_NAME_nd_num_llano_refuge: "Refuge Llano Estacado"
 STATIC_MODIFIER_DESC_nd_num_llano_refuge: "Le Llano Estacado est une mer d'herbe sans repère, sans source d'eau connue de l'étranger. Entrer, c’est mourir de soif ; les Quahadi y parcourent par la Grande Ourse et la mémoire."
 STATIC_MODIFIER_NAME_nd_num_numic_orthography: "Orthographe numérique"
 STATIC_MODIFIER_DESC_nd_num_numic_orthography: "La langue Comanche reçoit une forme écrite. Les alphabets des écoles diffusent les traditions puhakat, les chants de Buffalo et les histoires du conseil dans des archives permanentes."

 # ============================================================
 # Formation event
 # ============================================================
 nd_num.1.t: "Numunu Sookobitu se lève"
 nd_num.1.d: "From the Llano Estacado the paraibos have summoned the bands: Penateka of the honey-eaters, Yamparika of the root-eaters, Quahadi of the antelope, Nokoni who-turn-back, Kotsoteka the buffalo-eaters. The Spanish horse-stock has long since become the foundation of a new economy; the bison herds still cover the southern plains; northern Mexico pays tribute or burns. The question is what shape the Comanche state should take.\n\nShould Numunu Sookobitu remain the great mobile empire of raid-and-tribute, expanding through the war-band and the captive incorporated as kin? Or should the Comanche consolidate as a sovereign nation among nations, with formal borders, written treaties, and the schoolhouse Numic alphabet?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_num.1.a: "Empire continental, le raid est l'État."
 nd_num.1.b: "Nation souveraine, le conseil siège en permanence."

 # ============================================================
 # DHE event loc
 # ============================================================
 nd_num.2.t: "Le cheval revient dans les plaines"
 nd_num.2.d: "The Pueblo Revolt of 1680 has scattered the Spanish horse herds across the Southern Plains. What was once a luxury gifted to a few chiefs becomes the everyday property of every Comanche warrior. The Numunu transform from foot-skirmishers into the most accomplished light cavalry the continent has ever seen, the herds following the bison cycle as the warriors follow the herds.\n\nThe paraibos must decide how to wield this new mobility: press the raids deep into Mexico while the advantage is fresh, or consolidate the herds and the absorbed warriors into a deeper army?"
 nd_num.2.a: "Appuyez sur les raids pendant que les Espagnols sont assommés !"
 nd_num.2.b: "Construisez les troupeaux et regroupez les guerriers absorbés dans les bandes."

 nd_num.3.t: "Les nations absorbées"
 nd_num.3.d: "A captive Mexican woman, taken at twelve, has borne three Comanche sons and now sits as the senior wife of a Penateka war-chief. A Pueblo silversmith, abducted from Taos in his youth, hammers Comanche bridle ornaments. An Anglo orphan, raised among the Yamparika, speaks no English and counts coup beside his adopted brothers.\n\nThis is how the Comanche grew: not as a closed bloodline but as a nation that absorbed its captives into kinship. The council debates whether the nation should formalize this engine of assimilation, or instead extract tribute from the captured: ransoming them back to their kin and turning the raid-cycle into a continental treasury."
 nd_num.3.a: "Adoptez les captifs, la nation grandit par absorption."
 nd_num.3.b: "Rançonner les captifs, le raid finance le trésor."

 nd_num.4.t: "Le commerce des Comancheros"
 nd_num.4.d: "The Comancheros (New Mexican traders licensed by the Comanche to cross the Llano) arrive at the encampments with metal goods, weapons, dried chiles. They depart with horses, bison hides, and captives bound for the Santa Fe market. This is the borderlands trade circuit: a parasitic economy on the Spanish frontier, the Comanche its sole sovereign.\n\nShould the council license the Comancheros formally as the Comanche trade arm, extracting a share of every caravan, or should the Comanche send their own riders south, cutting out the New Mexican middleman entirely?"
 nd_num.4.a: "Permettez aux Comancheros de les laisser travailler pour nous."
 nd_num.4.b: "Envoyez des caravanes Comanche directement à Santa Fe."

 nd_num.5.t: "Colline du Conseil"
 nd_num.5.d: "At Council Hill, the great parliament-stone east of the Wichita range, the paraibos receive emissaries from Texas, from the United States, from the Mexican governors. Each delegation arrives bearing gifts; each departs with a treaty written in a hand the Comanche can now read.\n\nThe question before the council is the diplomatic posture itself: should the Comanche speak to neighbors as a continental compact, the senior signatory among the Plains nations? Or should every embassy be received as supplicants beside fortified war-camps, peace negotiated only from a position of armed superiority?"
 nd_num.5.a: "Le Compact Continental parle comme la puissance principale."
 nd_num.5.b: "Paix armée, chaque ambassade à côté d'un camp de guerre."

 nd_num.6.t: "Le grand raid"
 nd_num.6.d: "Eight hundred Comanche horse-warriors ride south out of the Llano in late summer. Three weeks later the Coahuila haciendas burn for two hundred miles; the captives (children, women, horses by the thousand) return north with the war-band. This is not a campaign but a season. Northern Mexico has paid this tribute for a century.\n\nDoes the council press the raid harder, while the Mexican states are absorbed in their civil wars? Or consolidate the gains and rotate the warriors home to teach the new horse-doctrine to a fresh generation?"
 nd_num.6.a: "Appuyez sur le raid Le Mexique est ouvert."
 nd_num.6.b: "Faites tourner les guerriers pour former la prochaine génération."

 nd_num.7.t: "Le cœur du Llano Estacado"
 nd_num.7.d: "The Llano Estacado (the Staked Plain) is the Quahadi heartland and the Comanche refuge. A mesa-top sea of grass three hundred miles across, with no landmark, no surface water the outsider can find. Spanish columns vanished here in the 1700s; American cavalry would later vanish here too. The Quahadi guides navigate by Big Dipper and the memory of generations, leading the bands to hidden springs at predawn.\n\nThe council fortifies the heartland: war-camps at every approach, supply caches along the secret paths, the Llano declared the inviolable sanctuary of the Comanche state."
 nd_num.7.a: "Le Llano est scellé."

 nd_num.8.t: "L'alphabet numérique"
 nd_num.8.d: "A schoolhouse rises at the council ground. The Comanche language (Numu Tekwapuha) is given written form, the elders dictating the Buffalo songs, the puhakat medicine traditions, the council histories into permanent record. Children learn to read in their own tongue before they ride.\n\nThe Comanche, once the most mobile nation on the continent, anchor themselves in script. The nation will outlive the bison."
 nd_num.8.a: "Numu Tekwapuha est écrit."

 # ============================================================
 # Advance loc
 # ============================================================
 # Age 1
 nd_num_numic_migration: "Migration des plaines numériques"
 nd_num_numic_migration_desc: "Les Numunu se séparent de la tradition shoshonéenne plus large et migrent vers le sud vers les plaines, apprenant le cycle du bison et l'herbe saisonnière."
 nd_num_seasonal_camp: "Camp de bisons saisonnier"
 nd_num_seasonal_camp_desc: "Des camps mobiles suivent les troupeaux de bisons à travers les plaines du sud, traitant les peaux à chaque arrêt. Le fondement de l’économie des Plaines."
 nd_num_skirmisher_tradition: "Tradition des tirailleurs numériques"
 nd_num_skirmisher_tradition_desc: "Les guerriers à pied Comanche d'avant-cheval combattent sur le terrain accidenté du pays des canyons avec un arc et une lance, l'ancien style de combat Numic."
 nd_num_medicine_bundle: "Pack de médecine Puhakat"
 nd_num_medicine_bundle_desc: "Chaque guerrier porte un paquet de médicaments assemblé à partir de sa quête de vision. La tradition puhakat lie les Comanche aux esprits ancestraux et confère une protection lors du raid."
 nd_num_council_lodge_tradition: "Tradition de la Loge du Conseil"
 nd_num_council_lodge_tradition_desc: "Les paraibos de chaque bande se réunissent à la loge du conseil pour débattre des questions de guerre et de paix, aucune décision contraignante sans consensus entre les bandes."
 nd_num_big_dipper_navigation: "Navigation dans la Grande Ourse"
 nd_num_big_dipper_navigation_desc: "Les Comanche naviguent autour de la Grande Ourse comme pôle cosmologique et boussole terrestre, chevauchant de nuit à travers le Llano sans piste jusqu'à des sources qu'aucun étranger ne peut trouver."
 # Age 2
 nd_num_horse_mastery: "Maîtrise du cheval Comanche"
 nd_num_horse_mastery_desc: "Après que la révolte des Pueblo de 1680 ait dispersé les troupeaux espagnols, les Comanches sont devenus la cavalerie légère la plus accomplie du continent. Chaque guerrier possède des chevaux ; les bandes se déplacent avec le troupeau."
 nd_num_paraibos_confederation: "Confédération Paraïbos"
 nd_num_paraibos_confederation_desc: "Les cinq grandes bandes Penateka, Yamparika, Quahadi, Nokoni, Kotsoteka se confédérent sous un conseil paraibos. Le chef de la paix et le chef de guerre tekwuniwapi parlent avec une autorité distincte."
 nd_num_horse_warrior: "Guerrier cheval Comanche"
 nd_num_horse_warrior_desc: "L'archer à cheval emblématique des Plaines, combattant en selle avec un arc et une lance espagnole, maîtrisait parfaitement les manœuvres qu'aucune cavalerie européenne ne pouvait égaler."
 nd_num_pueblo_lessons: "Leçons de Pueblo"
 nd_num_pueblo_lessons_desc: "Les orfèvres, tisserands et palefreniers Pueblo capturés enseignent leur métier aux groupes. La première vague du moteur d’incorporation captive."
 nd_num_buffalo_hide_trade: "Commerce de peaux de buffles"
 nd_num_buffalo_hide_trade_desc: "Les peaux de bison deviennent la principale exportation de la Comancheria. La transformation des peaux est industrialisée dans les camps saisonniers ; les groupes échangent des peaux contre des produits métalliques dans les avant-postes de Comanchero."
 nd_num_tekwuniwapi_doctrine: "Doctrine Tekwuniwapi"
 nd_num_tekwuniwapi_doctrine_desc: "Le chef de guerre commande par acclamation et mène les raids par son exemple personnel. L'autorité en temps de guerre s'acquiert en selle et n'est pas héritée du conseil."
 # Age 3
 nd_num_comanchero_trade: "Réseau commercial Comanchero"
 nd_num_comanchero_trade_desc: "Les nouveaux commerçants mexicains sont autorisés à traverser le Llano et à commercer avec les bandes. Le circuit commercial frontalier fait de Santa Fe un marché dépendant des Comanches."
 nd_num_captive_incorporation: "Constitution en société captive"
 nd_num_captive_incorporation_desc: "Les captifs mexicains, pueblos et anglo-saxons sont adoptés comme enfants Comanche, se marient dans les groupes et deviennent des Numunu à part entière en une génération. La nation grandit par absorption."
 nd_num_raid_economy: "Raid-Économie"
 nd_num_raid_economy_desc: "Le cycle de raid saisonnier devient l’activité économique centrale de l’empire. Les provinces du nord du Mexique paient un tribut ou brûlent ; le trésor des Comanches se remplit de chevaux et d'argent."
 nd_num_raider_doctrine: "Doctrine des pillards"
 nd_num_raider_doctrine_desc: "Une arme de cavalerie spécialisée, légère, rapide et auto-approvisionnée pour le long trajet, est séparée de la principale tradition des guerriers à cheval pour le raid dédié au Mexique."
 nd_num_horse_aristocracy: "Aristocratie du cheval"
 nd_num_horse_aristocracy_desc: "La richesse de Comancheria se compte en chevaux. Un homme avec cent chevaux parle au conseil ; un homme qui en a cinq cents donne ses filles en alliance aux bandes voisines."
 nd_num_buffalo_monopoly: "Monopole stratégique des bisons"
 nd_num_buffalo_monopoly_desc: "Les Comanche contrôlent les troupeaux de bisons des plaines du sud en imposant des limites de chasse saisonnières aux nations rivales. Le troupeau est la ressource stratégique de l'empire."
 # Age 4
 nd_num_council_of_comanche_nation: "Conseil de la Nation Comanche"
 nd_num_council_of_comanche_nation_desc: "La confédération paraibos est formalisée sous le nom de Conseil de la nation Comanche, un sénat permanent de chefs de bande qui lie l'ensemble de la confédération à une politique commune."
 nd_num_llano_estacado: "Llano Estacado Heartland"
 nd_num_llano_estacado_desc: "La Staked Plain est fortifiée comme le refuge des Comanches, le cœur inviolable des Quahadi où aucune armée extérieure ne peut survivre sans un guide Comanche."
 nd_num_tribute_system: "Système d'hommage impérial"
 nd_num_tribute_system_desc: "Les provinces du nord du Mexique paient un tribut annuel en chevaux, en argent et en licences commerciales pour échapper au cycle des raids. Le trésor des Comanches atteint son apogée."
 nd_num_medicine_lodge: "Tradition de la Loge de Médecine"
 nd_num_medicine_lodge_desc: "Les loges de médecine permanentes abritent les puhakat, les guérisseurs dont les paquets lient les bandes aux esprits ancestraux."
 nd_num_horse_breeding_program: "Programme d'élevage de chevaux"
 nd_num_horse_breeding_program_desc: "L'élevage sélectif à partir des lignées espagnoles, Pueblo et anglo absorbées produit le poney Comanche petit, robuste, inégalé dans les plaines."
 nd_num_great_raid_doctrine: "Doctrine du Grand Raid"
 nd_num_great_raid_doctrine_desc: "Le raid annuel de la fin de l'été au Mexique est régularisé comme une campagne doctrinale de huit cents guerriers chevauchant vers le sud, trois mois de route, revenant avec les captures d'une saison."
 # Age 5
 nd_num_council_hill: "Diplomatie de Council Hill"
 nd_num_council_hill_desc: "La grande pierre parlementaire à l'est de la chaîne de Wichita reçoit les ambassades du Texas, des États-Unis et des gouverneurs mexicains. Les Comanches parlent comme une puissance continentale."
 nd_num_bison_strategic_economy: "Économie stratégique du bison"
 nd_num_bison_strategic_economy_desc: "Les troupeaux de bisons sont gérés comme le fondement stratégique de l'empire : quotas de chasse, sanctuaires saisonniers, troupeau défendu comme propriété de l'État."
 nd_num_frontier_diplomacy: "Diplomatie des frontières"
 nd_num_frontier_diplomacy_desc: "Les missions diplomatiques permanentes à San Antonio, Santa Fe et Washington négocient les zones frontalières comme un système étatique triangulaire, les Comanches étant les partenaires principaux."
 nd_num_eagle_warrior: "Aristocratie Guerrière Aigle"
 nd_num_eagle_warrior_desc: "Cavalerie d'élite du haut empire, issue des grandes lignées d'aristocrates équestres, les Eagle Warriors mènent le Grand Raid et commandent à Council Hill."
 nd_num_quahadi_homeland: "Patrie Quahadi"
 nd_num_quahadi_homeland_desc: "La bande Quahadi, les mangeurs d'antilopes du Llano, fortifie le cœur du pays avec des caches de ravitaillement cachées et des chemins d'eau secrets dont seuls leurs guides se souviennent."
 nd_num_borderland_caravan: "Réseau de caravanes Borderland"
 nd_num_borderland_caravan_desc: "Les caravanes Comanche s'étendent au nord jusqu'à l'Arkansas, au sud jusqu'à Saltillo et à l'est jusqu'à la rivière Rouge. Le circuit commercial des régions frontalières est entièrement administré par les Comanches."
 # Age 6
 nd_num_numic_literacy: "Alphabétisation Numic Schoolhouse"
 nd_num_numic_literacy_desc: "Numu Tekwapuha reçoit une forme écrite. Les chants de Buffalo, les traditions puhakat et les histoires du conseil entrent dans les archives permanentes. Les enfants Comanches lisent dans leur propre langue."
 nd_num_treaty_diplomacy: "Diplomatie des traités"
 nd_num_treaty_diplomacy_desc: "Les Comanche entrent dans le système des traités internationaux en tant que signataire souverain, des accords écrits liant les États-Unis, le Mexique et les nations des Plaines."
 nd_num_sovereign_endurance: "Endurance souveraine"
 nd_num_sovereign_endurance_desc: "Numunu Sookobitu surmonte la décimation des bisons, la cavalerie américaine et la dépossession qui a brisé toutes les autres nations des Plaines. L'empire du cheval devient un État permanent."
 nd_num_modern_plains_cavalry: "Cavalerie moderne des plaines"
 nd_num_modern_plains_cavalry_desc: "La tradition du cheval Comanche, modernisée avec des carabines à chargement par la culasse et la selle de la fin de l'Empire. La dernière cavalerie Comanche à construire."
 nd_num_constitution_of_comancheria: "Constitution de la Comancheria"
 nd_num_constitution_of_comancheria_desc: "Une constitution écrite formalise le Conseil de la nation Comanche en tant que législature d'un État souverain. L'empire du cheval devient une république."
 nd_num_industrial_horse_corral: "Corral de chevaux industriel"
 nd_num_industrial_horse_corral_desc: "Des programmes d'élevage sélectif à grande échelle, des écuries modernes et une économie d'exportation de chevaux. Comancheria fournit des montures de cavalerie à la moitié du continent."

 # ============================================================
 # Unit loc
 # ============================================================
 a_nd_num_skirmisher: "Tirailleurs numériques"
 a_nd_num_skirmisher_desc: "Guerriers à pied Comanche d'avant-cheval avec arc et lance, combattant sur le terrain accidenté du pays des canyons."
 a_nd_num_horse_warrior: "Guerrier cheval Comanche"
 a_nd_num_horse_warrior_desc: "L'archer à cheval emblématique des Plaines, combattant depuis la selle avec un arc composite et une lance espagnole, est la cavalerie légère la plus accomplie du continent."
 a_nd_num_raider: "Pillard Comanche"
 a_nd_num_raider_desc: "Cavalerie spécialisée dans la guerre de raid, légère et auto-approvisionnée pour la traversée profonde du Mexique, moteur du cycle de raid saisonnier."
 a_nd_num_eagle_warrior: "Aigle Guerrier"
 a_nd_num_eagle_warrior_desc: "Cavalerie d'élite du haut empire, issue des grandes lignées de chevaux aristocrates, les Eagle Warriors mènent le Grand Raid."
 a_nd_num_modern_horse_warrior: "Cavalerie Comanche moderne"
 a_nd_num_modern_horse_warrior_desc: "Guerriers à cheval Comanche de la fin de l'Empire, armés de carabines à chargement par la culasse, héritiers de l'ère de survie de la tradition des grandes Plaines."

 # ============================================================
 # Levy loc
 # ============================================================
 levy_nd_num_eagle_warrior: "Prélèvement du guerrier aigle"
 levy_nd_num_eagle_warrior_desc: "Cavalerie d'élite issue des grandes lignées équestres-aristocrates."
 levy_nd_num_raider: "Prélèvement des pillards"
 levy_nd_num_raider_desc: "Des raiders légers du groupe de cavalerie noble, auto-approvisionnés pour la chevauchée profonde."
 levy_nd_num_horse_warrior: "Prélèvement sur les guerriers à cheval"
 levy_nd_num_horse_warrior_desc: "Archers à cheval Comanche du noble bassin, l'emblématique cavalerie légère des Plaines."
 levy_nd_num_skirmisher: "Prélèvement des tirailleurs numériques"
 levy_nd_num_skirmisher_desc: "Tirailleurs à pied du pool paysan, l'ancienne tradition de combat à cheval."

 # ============================================================
 # Building loc
 # ============================================================
 nd_num_bison_camp: "Camp de bisons"
 nd_num_bison_camp_desc: "Camp mobile de transformation des peaux suivant les troupeaux de bisons, fondement de l'économie des plaines."
 nd_num_council_lodge: "Loge du Conseil"
 nd_num_council_lodge_desc: "Les paraibos de chaque bande se réunissent ici pour débattre de la guerre et de la paix ; pas de décision contraignante sans consensus."
 nd_num_horse_corral: "Corral de dressage de chevaux"
 nd_num_horse_corral_desc: "Terre d'élevage de l'aristocratie équestre Comanche ; des lignées sélectives de souches espagnoles, pueblo et anglo produisent le poney Comanche."
 nd_num_comanchero_post: "Poste de traite de Comanchero"
 nd_num_comanchero_post_desc: "Les commerçants néo-mexicains agréés Comanche échangent des produits métalliques contre des chevaux, des peaux et des captifs à destination de Santa Fe."
 nd_num_llano_fortress: "Campement de Llano Estacado"
 nd_num_llano_fortress_desc: "Camp de guerre fortifié au cœur du pays Quahadi, caches d'eau cachées et dépôts de ravitaillement connus uniquement des guides Comanche."
 nd_num_medicine_lodge_bld: "Loge de Médecine"
 nd_num_medicine_lodge_bld_desc: "Sanctuaire puhakat permanent abritant les paquets de médicaments qui lient les anneaux aux esprits ancestraux."
 nd_num_constitution_hall: "Salle de la Constitution"
 nd_num_constitution_hall_desc: "La salle du conseil de l'État souverain moderne des Comanches, où siège le Conseil de la nation Comanche en tant que corps législatif."

 # ============================================================
 # Production method loc
 # ============================================================
 nd_num_pm_basic_bison_hide: "Peau de bison de base"
 nd_num_pm_basic_bison_hide_desc: "Les camps saisonniers de transformation des peaux tannent le cuir de bison et de bétail pour le commerce et la couverture des tipis."
 nd_num_pm_bison_hide_specialization: "Spécialisation Peau de bison"
 nd_num_pm_bison_hide_specialization_desc: "Production industrialisée de peaux de bison pour le commerce d'exportation de Comanchero. L'approvisionnement en cuir de Santa Fe passe par Comancheria."
 nd_num_pm_strategic_bison: "Économie stratégique du bison"
 nd_num_pm_strategic_bison_desc: "Gérer les stocks de bisons sous quotas de chasse ; le troupeau est traité comme propriété de l'État et le cuir est la première exportation de l'empire."
 nd_num_pm_basic_horse_breeding: "Élevage de chevaux de base"
 nd_num_pm_basic_horse_breeding_desc: "Chevaux de race espagnole élevés pour les plaines ; le poney Comanche émerge d'un élevage sélectif dans chaque campement."
 nd_num_pm_breeding_program: "Programme de sélection sélective"
 nd_num_pm_breeding_program_desc: "Le croisement de lignées espagnoles, pueblo et anglo absorbées sous les lignées équestres-aristocrates produit un cheval des plaines plus profond et plus robuste."
 nd_num_pm_industrial_horse: "Corral de chevaux industriel"
 nd_num_pm_industrial_horse_desc: "Des méthodes modernes et stables à grande échelle Comancheria devient le premier exportateur de montures de cavalerie du continent."
 nd_num_pm_council_maintenance: "Entretien du Conseil"
 nd_num_pm_council_maintenance_desc: "Bois pour la charpente du lodge, bétail et laine pour les fêtes du conseil, cire d'abeille pour les séances nocturnes."
 nd_num_pm_comanchero_maintenance: "Entretien Comanchero"
 nd_num_pm_comanchero_maintenance_desc: "Les chevaux et le cuir coulent vers l'extérieur ; les armes et le tabac affluent vers l’intérieur. Le poste de Comanchero tire sa marge du commerce frontalier."
 nd_num_pm_llano_maintenance: "Entretien du campement de Llano"
 nd_num_pm_llano_maintenance_desc: "Chevaux pour les patrouilles, cuir pour les selles, armes pour les guerriers, gibier sauvage des chasseurs Quahadi."
 nd_num_pm_medicine_maintenance: "Entretien du pavillon de médecine"
 nd_num_pm_medicine_maintenance_desc: "Cire d'abeille pour les bougies de la loge, fourrure pour les paquets de médicaments, gibier sauvage et médicaments pour les cérémonies du puhakat."
 nd_num_pm_constitution_maintenance: "Entretien de la salle de la Constitution"
 nd_num_pm_aristocrat_breeding: "Élevage de chevaux aristocrates"
 nd_num_pm_aristocrat_breeding_desc: "Programmes d'élevage sélectif sous les grandes lignées de chevaux-aristocrates, qui contrôlent seules les meilleures lignées de poneys Comanche."
 nd_num_pm_tribute_hide: "Production de peaux d'hommage"
 nd_num_pm_tribute_hide_desc: "La transformation des peaux de bison s'est développée pour alimenter le commerce d'exportation des Comanchero, l'économie de raid convertissant le bétail capturé et les excédents de troupeaux en cuir."
 nd_num_pm_constitution_maintenance_desc: "Papier pour les archives, livres pour la bibliothèque du Parlement, mobilier pour la chambre."

 # ============================================================
 # Destiny tree localization
 # ============================================================

 # Destiny advances
 nd_num_destiny: "Destin de Numunu Sookobitu"
 nd_num_destiny_desc: "L’empire du cheval existe. Les paraibos doivent maintenant décider si l’État Numunu sera présenté comme un empire tributaire continental ou siégera comme une nation souveraine parmi les nations."
 nd_num_dest_a1_northern_frontier: "Frontière hommage au nord du Mexique"
 nd_num_dest_a1_northern_frontier_desc: "Take the Tamaulipeco lowlands south of the Rio Grande as the first tribute-frontier of the empire. Own #bold Tamaulipeco#! and #bold Maratine#!, taken by the mounted warriors of the bands."
 nd_num_dest_a2_coahuila_dominion: "Domaine de Coahuila"
 nd_num_dest_a2_coahuila_dominion_desc: "The Guachichil and Coahuila highlands fall to the southern raid. Own #bold Guachichil#!, #bold Cuencame#!, and #bold Chisos#!, make the long raid a doctrine of war, and bring half of the Guachichil country under Comanche rule."
 nd_num_dest_a3_continental_hegemony: "Hégémonie continentale"
 nd_num_dest_a3_continental_hegemony_desc: "Numunu Sookobitu becomes the senior power of the continent. Own #bold Mapimi#!, #bold Cuanales#!, #bold Alazapa#!, and #bold Xumani#!; set the tribute system over the conquered country; hold 75 prestige and 3000 gold. Unlocks the Imperial Bison-Council Hall."
 nd_num_dest_b1_indigenous_alliance: "Alliance autochtone régionale"
 nd_num_dest_b1_indigenous_alliance_desc: "Embrace the institution of #bold Legalism#!, hold 50 prestige and 75 stability. The first foundations of the sovereign Comanche state are laid in council protocol and written law."
 nd_num_dest_b2_plains_coalition: "Coalition autochtone à l'échelle des plaines"
 nd_num_dest_b2_plains_coalition_desc: "Embrace the #bold Printing Press#! and pivot the Plains nations into a Comanche-led coalition. Own #bold He Sapa#! (the Black Hills) and #bold Awatixa#! (the Mandan villages); hold 2000 gold and 50 prestige."
 nd_num_dest_b3_pan_indigenous_confederation: "Confédération panautochtone"
 nd_num_dest_b3_pan_indigenous_confederation_desc: "The Comanche-led Indigenous federation is recognized as a sovereign signatory among the great powers. Embrace #bold Global Trade#!; own #bold Iisaxpuatahcheeaashe#!, #bold Marapa#!, and #bold Minisose#!; raise a Council Lodge in eight places of the realm; hold 75 prestige and 75 stability. Unlocks the Treaty Hall."

 # Destiny event titles, descriptions, options
 nd_num.9.t: "Le chemin du destin s'ouvre"
 nd_num.9.d: "Les paraibos ont tracé le cap de la nation. Les bandes avancent dans la direction choisie, le cycle de raids saisonniers se transformant en un empire continental, ou le conseil s'érigeant en noyau diplomatique d'une fédération autochtone."
 nd_num.9.a: "Le chemin est tracé."

 nd_num.10.t: "La frontière de l'hommage"
 nd_num.10.d: "Les cavaliers Comanche ont traversé le Rio Grande et brisé la côte de Tamaulipeco. Maratine rend hommage en bétail et en chevaux ; les rancheros du cours inférieur du fleuve livrent leur prélèvement saisonnier à une ambassade Comanche. La première véritable province impériale de Numunu Sookobitu se trouve au sud du fleuve. L’empire du cheval s’étend jusqu’au Mexique."
 nd_num.10.a: "La frontière sud est la nôtre."

 nd_num.11.t: "Les chutes de Coahuila au raid"
 nd_num.11.d: "Guachichil. Cuen est venu. Chisos. Le haut désert de Coahuila et Durango plie sous le raid saisonnier. Les presidios espagnols sont abandonnés ; Les communautés autochtones saluent l’effondrement de l’autorité vice-royale provoqué par les Comanches. La question posée au Conseil : les bandes poussent-elles encore plus le raid pendant que les États mexicains chancellent, ou fortifient-elles ce qu'elles ont pris et absorbent-elles les populations absorbées dans l'empire ?"
 nd_num.11.a: "Appuyez sur le raid Le Mexique est ouvert jusqu'à Zacatecas !"
 nd_num.11.b: "Fortifiez la nouvelle domination, rendez-la permanente."

 nd_num.12.t: "Hégémonie continentale"
 nd_num.12.d: "Mapimi, Cuanales, Alazapa, Xumani du Bolson de Mapimi à la Sierra Madre, du Nuevo Leon au plateau de Chihuahuan, tient l'empire continental. Les paraibos siègent au sommet d’une structure impériale qui subordonne tous les États sédentaires du nord du Mexique. Le conseil débat de la forme de l'administration permanente de l'empire : une structure vice-royale calquée sur les institutions espagnoles absorbées, ou un système de tribut et de trésor dans le style Comanche ?"
 nd_num.12.a: "Établir une vice-royauté Comanche sur les conquêtes."
 nd_num.12.b: "Convertissez l'hommage en un trésor continental unifié."

 nd_num.13.t: "Le Conseil des Nations Alliées"
 nd_num.13.d: "Sur le terrain du conseil, les paraibos reçoivent les premières ambassades officielles des nations environnantes Apache, Kiowa et Pueblo. La langue Comanche a reçu une forme écrite ; les traités sont signés d’une main que les groupes peuvent lire. Le travail de l’État souverain Comanche ne commence pas dans le camp de guerre mais dans la Chambre."
 nd_num.13.a: "L’alliance autochtone prend forme."

 nd_num.14.t: "La Coalition à l'échelle des plaines"
 nd_num.14.d: "Les Black Hills sont sacrées pour les Lakota ; les villages fluviaux du Missouri abritent les Mandan et les Hidatsa. Le conseil Comanche a étendu sa portée pour intégrer ces nations du Nord dans la confédération, l'imprimerie transportant la langue Numunu et les textes des traités dans le couloir des Plaines. Le conseil débat de la forme de la coalition plus large : un conseil d’égaux assis en permanence à Council Hill, ou un réseau d’envoyés diplomatiques mobiles atteignant chaque capitale autochtone, des terres Apache aux Grands Lacs ?"
 nd_num.14.a: "Convoquer un conseil pan-plaines permanent."
 nd_num.14.b: "Envoyez des envoyés Comanche dans chaque capitale autochtone."

 nd_num.15.t: "La Confédération panautochtone"
 nd_num.15.d: "La chaîne Bighorn, Marapa, Minisose. La fédération dirigée par les Comanches s'étend du Llano Estacado à la Saskatchewan, des Black Hills aux berges de la rivière Mandan. Les États-Unis et le Mexique négocient sur un pied d’égalité ; le Royaume-Uni envoie un chargé d'affaires. Les Comanches deviennent le pivot souverain d’un bloc autochtone dans le système international. Le conseil clôture la question avec une seule décision : la fédération doit-elle reposer sur le Pacte pan-autochtone de protocole du conseil et de spiritualité partagée, ou sur une constitution écrite liant chaque nation signataire en tant que sujet fédéral ?"
 nd_num.15.a: "Le protocole du conseil du Pacte panautochtone et la chanson de Buffalo nous lient."
 nd_num.15.b: "Fédération écrite du Pacte constitutionnel, chaque nation étant signataire."

 # Static modifier loc: destiny timed modifiers
 STATIC_MODIFIER_NAME_nd_num_dest_a2_press_north: "Appuyez sur le raid mexicain"
 STATIC_MODIFIER_DESC_nd_num_dest_a2_press_north: "Tandis que les États mexicains sont plongés dans leurs guerres civiles, le raid Comanche s'enfonce plus profondément dans les présidios des hautes terres. Chaque saison, la troupe de guerre revient chargée de captifs, de chevaux et d'argent."
 STATIC_MODIFIER_NAME_nd_num_dest_a2_fortify_gains: "Fortifier la frontière"
 STATIC_MODIFIER_DESC_nd_num_dest_a2_fortify_gains: "Les provinces mexicaines conquises sont fortifiées, des cachettes et des corrals de chevaux construits à travers le nouveau dominion, les populations absorbées intégrées dans le système des bandes. L'empire devient permanent."
 STATIC_MODIFIER_NAME_nd_num_dest_a3_continental_viceroyalty: "Vice-royauté continentale"
 STATIC_MODIFIER_DESC_nd_num_dest_a3_continental_viceroyalty: "Une structure vice-royale Comanche remplace les institutions espagnoles brisées, des paraibos siègent en tant que gouverneurs impériaux sur les provinces absorbées. Le clergé de toutes confessions s'incline devant le conseil, mais les missionnaires anglo-saxons sont éloignés de la portée du nouvel empire."
 STATIC_MODIFIER_NAME_nd_num_dest_a3_unifying_tribute: "Trésorerie continentale unifiée"
 STATIC_MODIFIER_DESC_nd_num_dest_a3_unifying_tribute: "Les hommages du nord du Mexique, le commerce des Comancheros et l'exportation des peaux de bison sont unifiés sous un seul trésor impérial. Les commerçants frontaliers et les marchands absorbés sont intégrés au conseil ; l’inflation est contrôlée, le crédit est bon marché, l’empire prospère."
 STATIC_MODIFIER_NAME_nd_num_dest_b2_pan_plains_council: "Conseil Pan-Plaines"
 STATIC_MODIFIER_DESC_nd_num_dest_b2_pan_plains_council: "Le terrain du conseil permanent accueille les envoyés de toutes les nations des Plaines. Les bandes de mercenaires sont évitées par un prélèvement de coalition ; la dévastation de l’ancien cycle de raid est réparée grâce à un effort collectif."
 STATIC_MODIFIER_NAME_nd_num_dest_b2_diplomatic_envoys: "Envoyés diplomatiques mobiles"
 STATIC_MODIFIER_DESC_nd_num_dest_b2_diplomatic_envoys: "Des envoyés formés par les Comanches atteignent toutes les capitales autochtones, des Apaches aux Grands Lacs, transportant l'écriture numique et les textes des traités. La coalition rejette les bandes de mercenaires comme outils des puissances européennes."
 STATIC_MODIFIER_NAME_nd_num_dest_b3_pan_indigenous_pact: "Pacte pan-autochtone"
 STATIC_MODIFIER_DESC_nd_num_dest_b3_pan_indigenous_pact: "La fédération repose sur le protocole du conseil et la spiritualité partagée des Plaines. La chanson de Buffalo lie la coalition ; les puhakat parlent d'une seule voix ; la construction de l’infrastructure du conseil est le devoir de chaque bande signataire."
 STATIC_MODIFIER_NAME_nd_num_dest_b3_constitutional_pact: "Pacte constitutionnel"
 STATIC_MODIFIER_DESC_nd_num_dest_b3_constitutional_pact: "Une constitution fédérale écrite lie chaque signataire autochtone en tant que sujet souverain de la confédération dirigée par les Comanches. Les marchands bourgeois administrent le commerce international ; les envoyés s'étendent du Llano à l'Arctique."

 # Destiny capstone buildings
 nd_num_imperial_bison_council: "Salle du Conseil impérial des bisons"
 nd_num_imperial_bison_council_desc: "Le régime politique suprême de Numunu, où les paraibos et les tekwuniwapi co-dirigent l'empire continental. Sous l'étendard du Conseil du Bison, les nations absorbées sont gouvernées comme des provinces impériales."
 nd_num_treaty_hall: "Salle des Traités et école Numic"
 nd_num_treaty_hall_desc: "La chambre diplomatique de l'État souverain Comanche, avec l'école Numic attenante. Les traités avec les États-Unis, le Mexique et les nations autochtones sont rédigés, débattus, signés et archivés sous un même toit."

 # Destiny capstone production methods
 nd_num_pm_imperial_bison_council_maintenance: "Entretien du Conseil Impérial"
 nd_num_pm_imperial_bison_council_maintenance_desc: "Chevaux pour la garde impériale, cuir pour les selles des paraibos, armes pour la troupe de guerre, bétail pour les fêtes du conseil."
 nd_num_pm_treaty_hall_maintenance: "Entretien de la Salle des Traités"
 nd_num_pm_treaty_hall_maintenance_desc: "Papier pour les projets de traités, livres pour la bibliothèque de l'école, tissus fins pour le protocole de la chambre, meubles pour les sièges diplomatiques."

 # ============================================================
 # Bureaucracy slot grant + bureaucracy display strings
 # ============================================================
 AUTO_MODIFIER_NAME_nd_num_bureaucracy_authority: "Autorité fédérale de Comancheria"
 AUTO_MODIFIER_DESC_nd_num_bureaucracy_authority: "Les cinq hordes de Numunu Sookobitu ont proclamé la fédération, et quatre institutions Comanche sont prêtes à devenir des organes permanents : le Conseil de la Nation Comanche sous le double bureau paraibos-tekwuniwapi, la Fédération Multi-Horde de Penateka, Yamparika, Quahadi, Nokoni et Kotsoteka, le régime de licence commerciale Comanchero et le système d'incorporation captive qui transforme le cycle de raid en un moteur démographique. Deux emplacements s'ouvrent à côté de l'emplacement implicite de la capitale, permettant à trois des quatre d'être retranchés tandis que le quatrième reste un conseil convoqué à l'occasion, selon l'ancienne coutume de la fédération."

 num_council_of_comanche_nation_bureaucracy: "Conseil de la Nation Comanche"
 num_council_of_comanche_nation_bureaucracy_desc: "L'assemblée inter-bandes sous la double codirection des paraibos et des tekwuniwapi. Les paraibos (chefs de paix) négociaient le tribut, la rançon des prisonniers et les licences Comanchero ; les tekwuniwapi (chefs de guerre) dirigeaient le cycle de raids. Lorsque les divisions convergeaient vers Council Hill ou Big Spring, l'autorité jumelée s'élevait sur les cinq hordes à la fois, ratifiant la paix, la guerre et la redistribution entre les bandes. Maintenu, le conseil parle d'une seule voix; négligés, les paraibos et les tekwuniwapi tirent dans des directions opposées et la fédération roule sans ligne."

 num_multi_horde_federation_bureaucracy: "Fédération multi-horde"
 num_multi_horde_federation_bureaucracy_desc: "La structure fédérale en cinq divisions relie Penateka des mangeurs de miel, Yamparika des mangeurs de racines, Quahadi de l'antilope, Nokoni qui fait demi-tour et Kotsoteka les mangeurs de buffles. Chaque horde gardait ses propres paraibos et son propre rayon de raid : Penateka au sud jusqu'à Coahuila, Quahadi à l'ouest à travers le Llano Estacado, Yamparika au nord jusqu'à l'Arkansas. La fédération a regroupé les divisions pour la guerre et a ratifié la paix au conseil interbande, mais n'a jamais aboli l'autonomie au niveau des divisions. Entretenue, chaque horde gouverne son propre territoire; négligées, les divisions s'affrontent et le conseil de Council Hill ne parvient pas à réunir le quorum."

 num_comanchero_license_bureaucracy: "Licence commerciale Comanchero"
 num_comanchero_license_bureaucracy_desc: "Le système douanier administré par les Comanches réglemente les commerçants hispaniques et pueblos - les comancheros - qui entraient en Comancheria pour vendre des chevaux, des peaux, des captifs et de l'argent. Les Comanche accordaient des licences, fixaient les taux de change aux foires de rendez-vous et prenaient une part de chaque caravane. Dans les années 1830, les comancheros opéraient sous un régime douanier reconnu, retournant chaque année aux points d'eau fixes que les paraibos avaient désignés comme marchés agréés. Les récits texans décrivent un non-État doté d’un mécanisme tarifaire fonctionnel. Entretenus, les marchés alimentent la trésorerie de la fédération ; négligés, ils se transforment en routes de contrebande et les bandes les plus anciennes accusent les paraibos de s'enrichir grâce aux marchands Pueblo."

 num_captive_incorporation_bureaucracy: "Système d'incorporation captive"
 num_captive_incorporation_bureaucracy_desc: "La pratique institutionnalisée consistant à absorber des captifs (mexicains, pueblos, anglo) dans des bandes comanches en tant que parents adoptifs. Les captifs étaient emmenés lors de raids, rançonnés à leurs proches contre des chevaux ou de l'argent, ou, s'ils étaient jeunes, élevés comme des enfants Comanche et mariés dans les lignées. Au XIXe siècle, un pourcentage important de la population Comanche était mexicaine ou anglo-descendante en captivité, et l'institution était devenue le moteur démographique de la fédération. Entretenus, les captifs deviennent Comanche et la fédération multiethnique s'agrandit; négligés, les non assimilés forment une faction rancunière et les lignées plus anciennes se plaignent de la dilution des bandes."
 STATIC_MODIFIER_NAME_nd_num_paraibo_confederation: "Confédération Paraibo-Tekwuniwapi"
 STATIC_MODIFIER_DESC_nd_num_paraibo_confederation: "La gouvernance fédérale Numunu : paraibos (chefs de paix) et tekwuniwapi (chefs de guerre) dirigeant les cinq grandes divisions (Penateka, Yamparika, Quahadi, Nokoni, Kotsoteka) par l'intermédiaire du Conseil de la nation Comanche à Council Hill. Assemblage inter-bandes, liens de parenté, cohésion économique des bisons. Pas de royaume unitaire; l'Empire Comanche est une confédération."
