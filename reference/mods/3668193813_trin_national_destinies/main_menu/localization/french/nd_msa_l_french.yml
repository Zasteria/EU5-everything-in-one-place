l_french:
 STATIC_MODIFIER_NAME_nd_msa_thalassocratic_emporium: "Magasin thalassocratique"
 STATIC_MODIFIER_DESC_nd_msa_thalassocratic_emporium: "Le détroit de Malacca est le carrefour du monde connu et nous en sommes les gardiens. Tout navire transportant de la soie de Chine, des épices des Moluques ou des étoffes de l'Inde doit passer par nos eaux. Nous construirons le plus grand entrepôt que le monde ait jamais vu."
 STATIC_MODIFIER_NAME_nd_msa_sultanate_of_the_faithful: "Sultanat des Fidèles"
 STATIC_MODIFIER_DESC_nd_msa_sultanate_of_the_faithful: "Du Hukum Kanun Melaka aux madrasas qui parsèment nos villes, le sultanat malais est un phare de la civilisation islamique dans les mers orientales. Nos codes juridiques régissent le commerce et la justice, nos érudits éclairent la foi et notre sultan règne comme l'ombre de Dieu sur terre."
 STATIC_MODIFIER_NAME_nd_msa_maritime_law_enforced: "Application du droit maritime"
 STATIC_MODIFIER_DESC_nd_msa_maritime_law_enforced: "L’Undang-Undang Laut Melaka est appliqué d’une main de fer. Les pirates sont traqués, des péages sont perçus et chaque navire dans nos eaux répond au Laksamana."
 STATIC_MODIFIER_NAME_nd_msa_maritime_law_liberal: "Droit maritime libéralisé"
 STATIC_MODIFIER_DESC_nd_msa_maritime_law_liberal: "L'Undang-Undang Laut Melaka encourage le libre passage et les transactions équitables. Les marchands de toutes les nations savent que les détroits sont ouverts au commerce honnête."
 STATIC_MODIFIER_NAME_nd_msa_johor_resistance: "Résistance du Johor"
 STATIC_MODIFIER_DESC_nd_msa_johor_resistance: "La chute de Malacca a renforcé notre détermination. Depuis Johor, les héritiers du sultanat mènent une campagne inlassable pour récupérer ce qui a été perdu, puisant leur force dans la jungle et la loyauté du peuple malais."
 nd_msa.1.t: "La naissance de la Malaisie"
 nd_msa.1.d: "The Malay Peninsula stands united under a single sultanate for the first time since the great days of Malacca. The Straits stretch before us: the richest sea lane in all the world, where the riches of China, India, and the Spice Islands converge. Our court draws scholars and merchants from across the Islamic world, and the Hukum Kanun Melaka provides a legal framework admired from Gujarat to Guangzhou.\n\nBut what kind of state shall this new Malaya be? Shall we build upon our command of the Straits, turning every port into a warehouse of the world's trade, or shall we look inward to the strength of our faith and law, making the sultanate a model of Islamic governance that lesser rulers will emulate?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_msa.1.a: "Nous sommes les gardiens du détroit."
 nd_msa.1.b: "Nous sommes les serviteurs de Dieu et de la loi."
 nd_msa.2.t: "L'Undang-Undang Laut Melaka"
 nd_msa.2.d: "The sea captains of the sultanate have gathered at the court of the Sultan to codify the maritime laws that govern our waters. The Undang-Undang Laut Melaka, the Maritime Laws of Malacca, will regulate everything from the duties of a ship's captain to the rights of passengers, from the division of salvage to the punishment of mutiny.\n\nCompiled under the authority of the Laksamana, these laws draw on centuries of Malay seafaring wisdom and Islamic jurisprudence. They will define how trade is conducted across the Straits. The question is whether these laws should prioritize strict enforcement of tolls and anti-piracy patrols, or whether a more liberal approach, encouraging free passage and attracting merchants through fair dealing, would better serve the sultanate's interests."
 nd_msa.2.a: "Les Laksamana feront respecter l'ordre sur ces eaux."
 nd_msa.2.b: "Faites savoir aux marchands que les détroits sont ouverts à tous ceux qui traitent équitablement."
 nd_msa.3.t: "La chute de Malacca et le successeur du Johor"
 nd_msa.3.d: "Malacca, the jewel of the Straits, has been seized by a foreign power. Sultan Mahmud Shah, the last ruler of old Malacca, retreated south with his court and warriors to establish a new base at Johor. His sons would found the successor sultanates of Johor and Perak, each carrying forward the traditions and legitimacy of Malacca.\n\nThe Johor Sultanate, backed by the loyalty of the Orang Laut sea nomads and the memory of Malacca's greatness, wages a guerrilla campaign to deny the invaders control of the Straits. The jungle hinterland provides refuge, while Malay knowledge of coastal waters gives the sultans an advantage that no foreign fleet can easily overcome. The spirit of resistance burns bright."
 nd_msa.3.a: "Malacca est peut-être tombée, mais la Malaisie perdure."
 nd_msa.4.t: "La boîte de Perak"
 nd_msa.4.d: "Rich deposits of tin have been discovered in the river valleys of Perak. The metal, essential for pewter, bronze, and increasingly for industrial applications, flows from Perak's mines to the ports of the peninsula and from there to the world. The Malay tin trade transforms Perak from a quiet riverside sultanate into one of the wealthiest states in Southeast Asia.\n\nChinese miners flock to the diggings, Bugis traders handle the export, and the Sultan of Perak grows rich from the taxes levied on every ingot that leaves his territory. Tin joins spices and pepper as the pillars of the Malay economy."
 nd_msa.4.a: "Laissez l'étain couler, et la richesse suivra."
 nd_msa_orang_laut_alliance: "Alliance Orang Laut"
 nd_msa_orang_laut_alliance_desc: "Les Orang Laut, les gens de la mer, sont les yeux et les bras du sultanat sur l'eau. Ces nomades marins patrouillent dans les détroits, repoussent les pirates et guident les navires marchands vers nos ports en échange de patronages et de titres royaux."
 nd_msa_hulubalang_tradition: "Tradition Hulubalang"
 nd_msa_hulubalang_tradition_desc: "Les Hulubalang sont les guerriers d'élite de la cour malaise, assermentés au service du sultan. Armés du kris, le poignard à lame ondulée sacré dans la culture martiale malaise, ils servent à la fois de gardes du palais et de troupes de choc au combat."
 nd_msa_entrepot_system: "Système d'entrepôt"
 nd_msa_entrepot_system_desc: "Le génie de Malacca n’a jamais été la production mais la redistribution. Les marchandises en provenance de Chine, d’Inde, d’Arabie et des îles aux épices convergent dans les entrepôts malais avant d’être réexpédiées à travers le monde connu."
 nd_msa_adat_governance: "Gouvernance Adat"
 nd_msa_adat_governance_desc: "Avant l’Islam et avant le sultanat, le monde malais était régi par l’adat : ​​le droit coutumier. Ces anciennes traditions de consensus, de réciprocité et d’autorité locale constituent le fondement sur lequel le sultanat bâtit son administration."
 nd_msa_istana_tradition: "Tradition d'Istana"
 nd_msa_istana_tradition_desc: "L'Istana, le palais royal, est le cœur de la vie politique malaise. Des cérémonies de cour élaborées, un protocole strict et l'affichage rituel des insignes renforcent le mandat divin du sultan et la hiérarchie du royaume."
 nd_msa_bendahara_laksamana: "Système Bendahara-Laksamana"
 nd_msa_bendahara_laksamana_desc: "Le sultanat malais divise la gouvernance entre les Bendahara, qui administrent les affaires intérieures et la diplomatie, et les Laksamana, qui commandent la flotte et font respecter le droit maritime. Ce système dualiste empêche un seul fonctionnaire d’accumuler trop de pouvoir."
 nd_msa_islamic_learning: "Centres d'apprentissage islamique"
 nd_msa_islamic_learning_desc: "Malacca n'est pas simplement un port de commerce : c'est un centre d'érudition islamique où les oulémas d'Arabie, d'Inde et de Java se réunissent pour enseigner et débattre. Les madrasas du sultanat forment des érudits, des juristes et des administrateurs qui portent la foi à travers l'archipel."
 nd_msa_undang_undang_laut: "Undang-Undang Laut Melaka"
 nd_msa_undang_undang_laut_desc: "Les lois maritimes de Malacca régissent tous les aspects de la vie maritime, depuis l'autorité du capitaine d'un navire jusqu'au traitement des passagers et des marchandises. Compilés sous l’autorité royale, ils représentent le corpus de droit maritime le plus sophistiqué d’Asie du Sud-Est."
 nd_msa_cosmopolitan_port: "Port cosmopolite"
 nd_msa_cosmopolitan_port_desc: "Les musulmans gujarati, les hindous tamouls, les bouddhistes chinois et les marchands javanais se mélangent librement sur les marchés de Malacca. Cette tolérance envers toutes les confessions et cultures n'est pas un simple idéalisme : c'est le secret du succès commercial du port."
 nd_msa_penjajap_warships: "Navires de guerre Penjajap"
 nd_msa_penjajap_warships_desc: "Le penjajap est une galère de guerre longue et étroite conçue pour les eaux peu profondes du détroit. Rapides à la voile comme à la rame, ces navires excellent dans les raids, les poursuites et la guerre côtière là où les navires européens à quille profonde ne peuvent pas les suivre."
 nd_msa_lancaran_tradition: "Tradition Lancaréenne"
 nd_msa_lancaran_tradition_desc: "Le lancaran est un navire de guerre malais de taille moyenne, plus rapide qu'un jong mais plus lourdement armé qu'un perahu de raid. Construits spécialement pour les opérations d'escorte commerciale et de lutte contre la piraterie, les lancarans sont les bêtes de somme de la flotte malaise."
 nd_msa_strait_defense: "Réseau de défense du détroit"
 nd_msa_strait_defense_desc: "Les tours de guet et les stations de signalisation le long du détroit permettent au sultanat de surveiller tout le trafic maritime et de répondre rapidement aux menaces. Ce réseau transforme les eaux étroites en un atout défensif plutôt qu'en une vulnérabilité."
 nd_msa_johor_successor: "État successeur du Johor"
 nd_msa_johor_successor_desc: "Lorsque Malacca tomba, ses héritiers ne périrent pas. Les sultans de Johor ont perpétué la légitimité et les traditions du vieux Malacca, menant une guérilla contre les occupants étrangers et maintenant la revendication malaise sur le détroit."
 nd_msa_spice_redistribution: "Redistribution des épices"
 nd_msa_spice_redistribution_desc: "Cloves from the Moluccas, pepper from Sumatra, cinnamon from Lanka: the spices of the East converge in Malay entrepots, where they are graded, repackaged, and shipped onward to the markets of India, Arabia, and beyond."
 nd_msa_perak_tin_boom: "Perak Tin Boom"
 nd_msa_perak_tin_boom_desc: "Les gisements alluviaux d'étain des vallées fluviales de Perak sont parmi les plus riches au monde. Les mineurs chinois, les intermédiaires Bugis et les sultans malais profitent tous du commerce de l'étain, qui transforme l'économie de la péninsule."
 nd_msa_hukum_kanun: "Hukum Kanun Melaka"
 nd_msa_hukum_kanun_desc: "Le Hukum Kanun Melaka est un code juridique complet mêlant la charia islamique et le droit coutumier malais. Il couvre le droit constitutionnel, pénal, commercial et familial, constituant le fondement juridique de l'administration du sultanat."
 nd_msa_ghali_besar_tradition: "Tradition Ghali Besar"
 nd_msa_ghali_besar_tradition_desc: "Le Ghali Besar, la grande galère, est le plus grand navire de guerre de la flotte malaise. Propulsés par des centaines de rameurs et hérissés de canons pivotants, ces navires défendent le détroit contre tout venant."
 nd_msa_rivalry_modernization: "Modernisation de la rivalité"
 nd_msa_rivalry_modernization_desc: "Competition between the Malay sultanates (Johor against Aceh, Perak against Selangor) drives military innovation. Gunpowder weapons, professional soldiers, and European-influenced fortifications gradually replace older methods of war. Bronze swivel guns, the lela and the smaller rentaka, are cast in the ports and carried on campaign."
 nd_msa_pelabuhan_tradition: "Tradition Pelabuhan"
 nd_msa_pelabuhan_tradition_desc: "Le pelabuhan, le grand port, est bien plus qu'un quai. C'est un quartier commercial autonome avec des entrepôts, des chantiers navals, des bureaux de douane et des quartiers pour les marchands de toutes les nations. Construire un pelabuhan déclare un port ouvert sur le monde."
 nd_msa_bugis_alliance: "Alliance Bugis"
 nd_msa_bugis_alliance_desc: "Les Bugis de Sulawesi sont réputés à la fois comme de féroces guerriers et des marchands avisés. Leur alliance avec les sultanats malais apporte des épées mercenaires, une expertise commerciale et des connexions avec les réseaux maritimes de l'archipel oriental."
 nd_msa_court_patronage: "Patronage de la Cour du Sultanat"
 nd_msa_court_patronage_desc: "La cour malaise nourrit une riche tradition littéraire et artistique. Le Hikayat Hang Tuah, le Sejarah Melayu et d'innombrables autres œuvres de poésie et d'histoire sont composés sous le patronage royal, faisant de la langue malaise la lingua franca de l'Asie du Sud-Est maritime."
 nd_msa_global_pepper: "Commerce mondial du poivre"
 nd_msa_global_pepper_desc: "Le poivre de l’intérieur de la péninsule malaise et des États affluents de Sumatra entre sur les marchés mondiaux via nos ports. La demande de l’Europe, de l’Inde et de la Chine garantit que le poivre reste l’un des produits les plus précieux de l’économie malaise."
 nd_msa_diaspora_network: "Réseau de la diaspora malaise"
 nd_msa_diaspora_network_desc: "Les marchands et colons malais se trouvent des côtes de l'Inde aux Philippines, du Siam aux Moluques. Cette diaspora lointaine fournit des renseignements, des relations commerciales et un levier diplomatique dans toute l’Asie maritime."
 nd_msa_modern_lancaran: "Flotte Lancaran moderne"
 nd_msa_modern_lancaran_desc: "La tradition lancaran évolue avec le temps. Les navires de patrouille modernes combinent un gréement européen avec une coque malaise, créant ainsi des navires rapides et polyvalents, parfaitement adaptés aux eaux peu profondes et insulaires du détroit."
 nd_msa_centralized_sultanate: "Sultanat centralisé"
 nd_msa_centralized_sultanate_desc: "Le sultan resserre son emprise sur les rênes du pouvoir, subordonnant les Bendahara et les Temenggung à l'autorité royale directe. Les chefs provinciaux sont remplacés par des gouverneurs nommés et la collecte des impôts est systématisée."
 nd_msa_tin_industry: "Industrie de la fonte d'étain"
 nd_msa_tin_industry_desc: "Advanced smelting techniques transform raw tin ore into high-quality ingots for export. The tin industry employs thousands and generates enormous revenue for the sultanate's treasury.\n\n#italic Available in: $nd_msa_tin_smeltery$#!"
 nd_msa_blockade_mastery: "Maîtrise du blocus"
 nd_msa_blockade_mastery_desc: "Des siècles de contrôle de la voie maritime la plus étroite d'Asie ont donné à la flotte malaise une compréhension inégalée de la guerre de blocus. Aucun navire ne traverse le détroit sans la connaissance et le consentement du sultan."
 nd_msa_silat_tradition: "Tradition Silat"
 nd_msa_silat_tradition_desc: "Le Silat, l'art martial malais, est codifié à partir de ses nombreuses variantes régionales pour devenir une discipline formelle enseignée dans les cours royales et les écoles militaires. L'art gracieux mais mortel met l'accent sur la vitesse, l'effet de levier et l'utilisation mortelle du kris."
 nd_msa_literary_renaissance: "Renaissance littéraire nusantara"
 nd_msa_literary_renaissance_desc: "La langue malaise atteint son plein épanouissement en tant que lingua franca littéraire de l'archipel. Des chroniques royales du Sejarah Melayu aux épopées romantiques de la tradition Hikayat, la littérature malaise définit l'identité culturelle de la région."
 nd_msa_modern_harbor: "Infrastructure portuaire moderne"
 nd_msa_modern_harbor_desc: "Des grues à vapeur, des postes d'amarrage en eau profonde et des entrepôts construits selon les spécifications européennes transforment les ports malais en installations commerciales modernes capables de gérer le volume massif du commerce mondial qui transite par les détroits."
 nd_msa_national_awakening: "Réveil national malais"
 nd_msa_national_awakening_desc: "Une nouvelle génération d’intellectuels malais, formés à la fois dans les traditions islamiques et occidentales, articule une vision de l’identité nationale malaise qui transcende les sultanats individuels. L’idée d’une nation malaise unifiée prend racine."
 nd_msa_plantation_economy: "Économie des plantations"
 nd_msa_plantation_economy_desc: "Le caoutchouc, l'huile de palme et d'autres cultures de plantation diversifient l'économie malaise au-delà de l'étain et des épices. Les sols fertiles et le climat tropical de la péninsule se révèlent idéaux pour une agriculture commerciale à grande échelle."
 nd_msa_naval_modernization: "Modernisation navale"
 nd_msa_naval_modernization_desc: "Les navires de guerre à vapeur et l'artillerie moderne remplacent les galères et les lancarans d'autrefois. La flotte malaise s'adapte à la nouvelle ère de la guerre navale tout en conservant sa maîtrise des eaux du détroit."
 nd_msa_constitutional_sultanate: "Sultanat constitutionnel"
 nd_msa_constitutional_sultanate_desc: "Le pouvoir absolu du sultan cède la place à un cadre constitutionnel qui équilibre l'autorité royale avec les droits du peuple. Une bureaucratie moderne administre l’État, tandis que le sultan conserve son rôle de symbole et de gardien religieux."
 nd_msa_straits_integration: "Intégration des établissements des détroits"
 nd_msa_straits_integration_desc: "Les grands ports de la péninsule (Malacca, Penang, Singapour) sont regroupés au sein d'une zone économique intégrée. Des douanes unifiées, des poids standardisés et des horaires d'expédition coordonnés font du détroit une entité commerciale unique."
 n_nd_msa_orang_laut_raider: "Pillard Orang Laut"
 n_nd_msa_orang_laut_raider_desc: "Les Orang Laut, le peuple de la mer, servent le sultan en tant qu'irréguliers navals, utilisant leur connaissance approfondie des eaux côtières pour patrouiller dans les détroits, chasser les pirates et harceler les navires ennemis."
 a_nd_msa_hulubalang: "Hulubalang"
 a_nd_msa_hulubalang_desc: "Les Hulubalang sont les guerriers d'élite de la cour malaise. Armés du kris sacré et entraînés au silat, ils servent à la fois de gardes de palais et d'infanterie de choc, leur loyauté fanatique n'ayant d'égale que leur habileté au corps à corps."
 n_nd_msa_penjajap: "Penjajap"
 n_nd_msa_penjajap_desc: "Une galère de guerre longue et étroite conçue pour les eaux peu profondes du détroit. Le Penjajap excelle dans les raids rapides et la guerre côtière, s'élançant dans des canaux que les navires plus lourds ne peuvent pas suivre."
 n_nd_msa_lancaran: "Lancaran"
 n_nd_msa_lancaran_desc: "Un navire de guerre malais de taille moyenne combinant la puissance de la voile et de la rame. Le lancaran sert de principal navire d'escorte commerciale et de lutte contre la piraterie, suffisamment rapide pour pourchasser les pillards et suffisamment bien armé pour les dissuader."
 n_nd_msa_ghali_besar: "Ghali Bésar"
 n_nd_msa_ghali_besar_desc: "La grande galère de la flotte malaise, propulsée par des centaines de rameurs et armée de canons pivotants. Le Ghali Besar est l'instrument d'autorité navale du sultan sur le détroit."
 n_nd_msa_modern_lancaran: "Lancaran moderne"
 n_nd_msa_modern_lancaran_desc: "Un navire de patrouille mis à jour alliant la conception malaise à faible tirant d'eau à un gréement et un armement modernes. Le lancaran moderne conserve l'avantage traditionnel malais dans les eaux du détroit et de l'archipel."
 nd_msa_entrepot_warehouse: "Entrepôt Entrepôt"
 nd_msa_entrepot_warehouse_desc: "Un immense complexe d'entrepôts où des marchandises du monde entier sont stockées, classées et réexpédiées. L'entrepôt d'entrepôt est l'infrastructure physique de l'économie intermédiaire malaise."
 nd_msa_istana: "Istana"
 nd_msa_istana_desc: "L'Istana est le palais royal d'un sultanat malais, un centre d'autorité politique, de cérémonies et de mécénat culturel. Son architecture élaborée et ses rituels de cour incarnent la majesté de la tradition dirigeante malaise."
 nd_msa_tin_smeltery: "Fonderie d'étain"
 nd_msa_tin_smeltery_desc: "Une installation de traitement où le minerai d'étain brut provenant des fouilles de la rivière est fondu en lingots purs destinés à l'exportation. La fonderie représente le cœur industriel de l’économie florissante de l’étain de Perak."
 nd_msa_madrasa: "Madrasa malaise"
 nd_msa_madrasa_desc: "Une école islamique où les érudits étudient le Coran, la jurisprudence et les sciences. Les madrasas du sultanat malais forment les juristes, les administrateurs et les chefs religieux qui gouvernent le royaume et propagent la foi."
 nd_msa_strait_watchtower: "Tour de guet du détroit"
 nd_msa_strait_watchtower_desc: "Un poste d'observation fortifié le long du détroit de Malacca, permettant au sultanat de surveiller le trafic maritime, de détecter les pirates et de coordonner les patrouilles navales dans ses eaux territoriales."
 nd_msa_pelabuhan: "Pelabuhan"
 nd_msa_pelabuhan_desc: "Un grand complexe portuaire avec des postes d'amarrage en eau profonde, des entrepôts, des chantiers navals et des installations douanières. Le pelabuhan est la porte commerciale du sultanat, ouverte aux marchands de toutes les nations."
 nd_msa_pm_spice_redistribution: "Redistribution des épices"
 nd_msa_pm_spice_redistribution_desc: "Le classement et le reconditionnement des épices de l'archipel oriental pour leur expédition vers l'Inde, l'Arabie et la Chine."
 nd_msa_court_ceremony: "Cérémonie à la Cour"
 nd_msa_court_ceremony_desc: "Les rituels et le protocole élaborés de la cour royale malaise, consommant des soies et des tissus fins pour montrer leur majesté."
 nd_msa_tin_smelting: "Fonderie d'étain"
 nd_msa_tin_smelting_desc: "Le minerai d'étain brut est fondu en lingots raffinés à l'aide de fours à charbon, produisant de l'étain destiné à l'exportation dans le monde connu."
 nd_msa_manuscript_copying: "Copie de manuscrits"
 nd_msa_manuscript_copying_desc: "La transcription de textes religieux, de codes juridiques et d'œuvres littéraires par des érudits de madrasa."
 nd_msa_watchtower_upkeep: "Entretien de la tour de guet"
 nd_msa_watchtower_upkeep_desc: "Entretien de la garnison de la tour de guet avec des armes et des matériaux de construction."
 nd_msa_harbor_operations: "Opérations portuaires"
 nd_msa_harbor_operations_desc: "Les besoins continus en matière d’entretien et d’approvisionnement d’un grand port commercial."
 levy_nd_msa_hulubalang: "Prélèvement Hulubalang"
 levy_nd_msa_hulubalang_desc: "Guerriers d'élite brandissant le kris, issus des soldats et des nobles du sultanat."
 levy_nd_msa_penjajap: "Prélèvement Penjajap"
 levy_nd_msa_penjajap_desc: "Galères de guerre équipées par les communautés maritimes du détroit."
 levy_nd_msa_orang_laut: "Prélèvement Orang Laut"
 levy_nd_msa_orang_laut_desc: "Des pillards nomades marins qui patrouillent dans les eaux côtières du sultanat."
 a_nd_msa_bugis_warrior: "Guerrier Bugis"
 a_nd_msa_bugis_warrior_desc: "Fierce warrior-merchants from Sulawesi, the Bugis serve the Malay sultanates as both mercenary soldiers and trade intermediaries. Their charge and their skill at flanking are feared, though a band that sees the day going against it will break off."
 a_nd_msa_rentaka_battery: "Lela and Rentaka Battery"
 a_nd_msa_rentaka_battery_desc: "The lela and the smaller rentaka are bronze swivel guns cast in the Malay ports. Light enough to be carried by two men, they are mounted on stockades and on the gunwales of war boats and are quickly brought into action. Against stone walls they do little."
 a_nd_msa_pendekar: "Pendékar"
 a_nd_msa_pendekar_desc: "Maîtres praticiens du silat, l'art martial malais. Les Pendekar sont des guerriers d'élite dont la vitesse, la technique et la maîtrise mortelle du kris en font une infanterie de choc dévastatrice."
 n_nd_msa_modern_corvette: "Corvette moderne"
 n_nd_msa_modern_corvette_desc: "Un navire de guerre de patrouille de l'ère de la vapeur adapté aux eaux peu profondes et insulaires du détroit. Rapide et agile, la corvette moderne maintient la tradition malaise de domination maritime jusqu'à l'ère industrielle."
 nd_msa_plantation_estate: "Domaine des plantations"
 nd_msa_plantation_estate_desc: "Domaine agricole à grande échelle produisant du caoutchouc, de l’huile de palme ou d’autres cultures commerciales tropicales. L'économie des plantations diversifie la richesse de la Malaisie au-delà de l'étain et des épices."
 nd_msa_plantation_processing: "Traitement des plantations"
 nd_msa_plantation_processing_desc: "Les vignes de poivre et autres cultures d'épices sont cultivées, récoltées et préparées pour le commerce d'exportation lucratif."
 levy_nd_msa_pendekar: "Pendekar Lévy"
 levy_nd_msa_pendekar_desc: "Maîtres silat d'élite issus des soldats du sultanat."
 nd_msa_formed_tt: "La Malaisie a été formée"
 nd_msa_path_a_tt: "Choisissez le magasin thalassocratique"
 nd_msa_path_b_tt: "A choisi le Sultanat des Fidèles"
 nd_msa_destiny: "Destin de la Malaisie"
 nd_msa_destiny_desc: "La péninsule malaise est à nouveau unie. La question est maintenant de savoir ce que deviendra cette nouvelle Malaisie : un empire maritime s’étendant sur les mers, ou un phare de la civilisation islamique illuminant l’Orient. Stabilisez le royaume et définissez votre cap."
 nd_msa_dest_straits_gateway: "La porte du détroit"
 nd_msa_dest_straits_gateway_desc: "Contrôlez les deux extrémités du détroit de Malacca en vous emparant de Palembang à Sumatra et d'Aceh à l'approche ouest. Avec ces grands ports entre nos mains, aucun navire n'entre ou ne sort du détroit sans le consentement des Malais."
 nd_msa_dest_spice_monopoly: "Le monopole des épices"
 nd_msa_dest_spice_monopoly_desc: "La fabuleuse richesse des îles aux épices doit passer par les seules mains des Malais. Saisissez Banda et Ternate, les cœurs jumeaux du commerce du clou de girofle et de la muscade, et faites de nos entrepôts l'unique porte d'entrée entre l'Est et l'Ouest."
 nd_msa_dest_nusantara_thalassocracy: "Thalassocratie Nusantara"
 nd_msa_dest_nusantara_thalassocracy_desc: "De Makassar à Canton, tous les grands ports des mers orientales doivent répondre au sultan de Malaisie. Construisez l'Emporium Agung, le Grand Marché, et prouvez que l'ère de la thalassocratie malaise est de retour."
 nd_msa_dest_hukum_proclaimed: "Le Hukum Kanun proclamé"
 nd_msa_dest_hukum_proclaimed_desc: "Proclamer le Hukum Kanun Melaka comme code juridique universel du sultanat, mêlant la charia islamique au droit coutumier malais. Adoptez l’institution bancaire pour formaliser le droit commercial et montrez au monde que la justice malaise est sans égal."
 nd_msa_dest_eastern_light: "Lumière des mers orientales"
 nd_msa_dest_eastern_light_desc: "Faire du sultanat le principal centre d’apprentissage islamique à l’est de Bagdad. Adoptez l’imprimerie pour diffuser le Coran et l’érudition juridique. Assurez-vous que le papier est négocié sur le marché de votre capitale : l'encre des érudits est l'élément vital de la civilisation."
 nd_msa_dest_dar_al_islam: "Dar al-Islam de l'Archipel"
 nd_msa_dest_dar_al_islam_desc: "The Malay sultanate stands as the undisputed heart of Islamic civilization in the eastern world. Keep madrasas in five of your towns, build Malacca up into a city worthy of the faith it carried across the archipelago, and complete the pilgrimage by bringing Mecca itself under your protection."
 nd_msa_dest_malacca_developed_tt: "Malacca is held and its development is at least #bold 34#!"
 nd_msa_dest_madrasas_tt: "At least 5 of our locations have a Malay Madrasa"
 nd_msa.5.t: "Le destin de la Malaisie"
 nd_msa.5.d: "La péninsule est unie, les détroits sécurisés. Mais ce n’est qu’un début. Un destin plus grand nous attend : un destin qui sera façonné par les choix que nous ferons dans les années à venir. Les traditions de nos ancêtres éclairent la voie à suivre."
 nd_msa.5.a: "Notre destin se déroule devant nous."
 nd_msa.6.t: "La passerelle du détroit sécurisée"
 nd_msa.6.d: "D'Aceh à l'ouest jusqu'à Palembang au sud, les abords du détroit de Malacca sont désormais sous contrôle malais. Tout navire marchand transportant de la soie, des épices ou de la porcelaine doit traverser les eaux où passe l'ordre du sultan. Le système des grands entrepôts peut désormais fonctionner à son plein potentiel : aucune puissance rivale ne peut détourner le commerce autour de nous."
 nd_msa.6.a: "Les détroits sont à nous."
 nd_msa.7.t: "Maîtres du commerce des épices"
 nd_msa.7.d: "Banda and Ternate, the fabled Spice Islands, now answer to the Sultan of Malaya. The cloves, nutmeg, and mace that the world craves pass through our warehouses before reaching any foreign port. This monopoly grants us enormous power. But how shall we wield it?\n\nWe could build upon our diplomatic relationships, using trade to bind allies and subjects to us through prosperity. Or we could arm our merchant fleet, ensuring that any nation that dares challenge our monopoly will face the full force of Malay naval power."
 nd_msa.7.a: "Le commerce lie le monde à nous."
 nd_msa.7.b: "Nos marchands naviguent avec des canons chargés."
 nd_msa.8.t: "La thalassocratie Nusantara"
 nd_msa.8.d: "From the pepper gardens of Sumatra to the porcelain kilns of Guangzhou, from the tin mines of Perak to the clove groves of Ternate, the Malay thalassocracy spans the eastern seas. The Emporium Agung rises in our greatest port: a market of unimaginable scale where the wealth of three continents converges.\n\nShall we consolidate this empire through commerce and centralized administration, making our burghers the richest in the world? Or shall we assert ourselves as the unchallenged maritime hegemon, ensuring that our naval supremacy is beyond question?"
 nd_msa.8.a: "Que l'Emporium Agung soit notre monument."
 nd_msa.8.b: "Les mers s'inclinent devant la Malaisie."
 nd_msa.9.t: "Le Hukum Kanun proclamé"
 nd_msa.9.d: "Lors d'une grande cérémonie à la cour du sultan, le Hukum Kanun Melaka est proclamé code juridique universel du royaume. La charia islamique et l'adat malais sont intégrés dans un système juridique complet qui régit le commerce, la famille, la justice pénale et les questions constitutionnelles. Les marchands de tout l’océan Indien reconnaissent l’équité et la sophistication des tribunaux malais."
 nd_msa.9.a: "Que la justice règne sur nos terres."
 nd_msa.10.t: "La lumière des mers orientales"
 nd_msa.10.d: "Scholars from Arabia, Persia, India, and Java flock to the madrasas of the sultanate. The printing of the Quran and legal commentaries in Jawi script spreads Islamic learning to every corner of the archipelago. Our courts are renowned for their learning and our judges for their wisdom.\n\nShall we formalize the sharia court system, bringing Islamic jurisprudence to bear on every aspect of governance? Or shall we invest in expanding the madrasa network, making the sultanate the intellectual capital of the Islamic East?"
 nd_msa.10.a: "La loi sera notre fondement."
 nd_msa.10.b: "La connaissance est la véritable forme d'adoration."
 nd_msa.11.t: "Dar al-Islam de l'Archipel"
 nd_msa.11.d: "The sultanate has achieved what no other Muslim state east of Delhi has accomplished: the creation of a true Dar al-Islam spanning the seas from the Malay Peninsula to the holy cities of Arabia. The Darul Hukum rises as the ultimate expression of our commitment to Islamic governance.\n\nShall we use this position to centralize authority under the Sultan as Commander of the Faithful, subordinating the nobility to the divine law? Or shall we become a beacon of faith that lifts all our people through education, culture, and communal solidarity?"
 nd_msa.11.a: "Le Sultan est l'ombre de Dieu."
 nd_msa.11.b: "La foi appartient à tous les croyants."
 STATIC_MODIFIER_NAME_nd_msa_dest_entrepot_dominance: "Domination de l'entrepôt"
 STATIC_MODIFIER_DESC_nd_msa_dest_entrepot_dominance: "Notre réseau commercial lie les nations à nous grâce à une prospérité mutuelle. Tous les tribunaux d'Asie savent que l'amitié malaise signifie l'accès aux marchés les plus riches du monde."
 STATIC_MODIFIER_NAME_nd_msa_dest_armed_trade: "Commerce armé"
 STATIC_MODIFIER_DESC_nd_msa_dest_armed_trade: "Nos navires marchands naviguent avec des canons chargés et des équipages prêts au combat. Le monopole commercial malais est renforcé non seulement par une supériorité commerciale, mais aussi par une force navale écrasante."
 STATIC_MODIFIER_NAME_nd_msa_dest_world_emporium: "Magasin mondial"
 STATIC_MODIFIER_DESC_nd_msa_dest_world_emporium: "L'Emporium Agung est le plus grand marché du monde oriental, un monument au génie commercial malais où les bourgeois d'une douzaine de nations font du commerce sous la loi malaise."
 STATIC_MODIFIER_NAME_nd_msa_dest_maritime_hegemon: "Hégémon maritime"
 STATIC_MODIFIER_DESC_nd_msa_dest_maritime_hegemon: "Aucune flotte n'ose défier la suprématie malaise sur les mers orientales. Du détroit de Malacca à la mer de Chine méridionale, la marine du sultan est l'arbitre final de tous les différends maritimes."
 STATIC_MODIFIER_NAME_nd_msa_dest_sharia_courts: "Tribunaux de la charia"
 STATIC_MODIFIER_DESC_nd_msa_dest_sharia_courts: "Les tribunaux formels de la charia administrent la loi islamique dans tout le sultanat, assurant justice et stabilité tout en réglementant l'activité commerciale sous la direction divine."
 STATIC_MODIFIER_NAME_nd_msa_dest_madrasa_network: "Réseau de madrasas"
 STATIC_MODIFIER_DESC_nd_msa_dest_madrasa_network: "Un vaste réseau de madrasas éduque la population du sultanat à la fois en matière d'érudition religieuse et de sciences du monde, repoussant les frontières de la connaissance dans l'Orient islamique."
 STATIC_MODIFIER_NAME_nd_msa_dest_ummah_united: "Oumma unie"
 STATIC_MODIFIER_DESC_nd_msa_dest_ummah_united: "Le Sultan règne en tant que Commandeur des Fidèles, subordonnant l'ancien ordre aristocratique à la loi divine. L'autorité spirituelle découle de la couronne, liant la Oumma sous un seul souverain juste."
 STATIC_MODIFIER_NAME_nd_msa_dest_beacon_of_faith: "Phare de la foi"
 STATIC_MODIFIER_DESC_nd_msa_dest_beacon_of_faith: "Le sultanat brille comme un phare de la civilisation islamique, où la solidarité communautaire et l’excellence scientifique élèvent tous les croyants vers un avenir plus éclairé."
 nd_msa_emporium_agung: "Emporium Agung"
 nd_msa_emporium_agung_desc: "Le Grand Marché : un complexe commercial colossal où convergent les marchandises de trois continents. La soie de Chine, les épices des Moluques, les tissus d'Inde et l'argent du Japon changent de mains sous un même toit régi par le droit commercial malais."
 nd_msa_emporium_operations: "Opérations du magasin"
 nd_msa_emporium_operations_desc: "Les opérations quotidiennes de l'Emporium Agung nécessitent de grandes quantités de matériaux pour entretenir ses entrepôts, ses quais et ses bureaux administratifs."
 nd_msa_darul_hukum: "Darul Hukum"
 nd_msa_darul_hukum_desc: "La Maison de la Loi : un grand complexe combinant une cour suprême de la charia, une bibliothèque royale et une madrasa du plus haut niveau. C'est le cœur institutionnel de la gouvernance islamique malaise, où la jurisprudence et l'érudition sont au service de la foi."
 nd_msa_darul_hukum_operations: "Cour de jurisprudence"
 nd_msa_darul_hukum_operations_desc: "Le fonctionnement continu du Darul Hukum nécessite du matériel scientifique, des fournitures religieuses et des biens administratifs."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_msa_bureaucracy_authority: "Sultanat de l'appareil malais"
 AUTO_MODIFIER_DESC_nd_msa_bureaucracy_authority: "Les quatre piliers de l'administration de Melaka (Bendahara, Penghulu Bendahari, Temenggung, Laksamana) sont devenus un appareil administratif permanent, le sceau de la chancellerie reconnu de Pasai à Patani, les chapitres du Hukum Kanun reliés en manuscrit propre sur chaque banc de cadi côtier. C’est sur cette base que les institutions distinctives de l’État malais commencent à prendre leur forme durable."

 msa_bendahara_grand_vizierate_bureaucracy: "Grand-Vizirat de Bendahara"
 msa_bendahara_grand_vizierate_bureaucracy_desc: "La plus haute fonction civile du sultanat de Melaka, occupée à l'âge d'or du royaume par Tun Perak (vers 1456-1498), qui, sous le nom de Bendahara, dirigea le royaume à travers cinq sultans, repoussa deux invasions siamoises en 1456 et 1488 et dirigea la chancellerie, les affaires étrangères et les nominations nobles depuis sa résidence à Bukit Chine. La fonction était héréditaire dans la lignée Tun ; dans la pratique, Bendahara était de facto le premier ministre tandis que le sultan présidait. L'institution a survécu à la chute de Melaka : les Bendaharas de Johor ont finalement fondé l'État séparatiste de Pahang en 1770 et sont devenus des sultans à part entière."

 msa_laksamana_admiralty_bureaucracy: "Amirauté de Laksamana"
 msa_laksamana_admiralty_bureaucracy_desc: "Le poste d'amiral de la flotte, exercé dans la tradition de Melaka par le célèbre Hang Tuah et ses successeurs. Le Laksamana commandait le kelulus royal, dirigeait la garde du corps du sultan de hulubalang et surveillait les détroits contre les pirates et les vassaux récalcitrants de Pasai à Patani. Après 1511, l'institution déménagea avec le sultan à Johor ; son keris était tenu sous la gorge de tout chef qui ne rendait pas hommage. Le bureau a persisté pendant la période de la fédération Bugis-Riau en tant que branche navale du Yam Tuan Muda."

 msa_hukum_kanun_bureaucracy: "Hukum Kanun Melaka"
 msa_hukum_kanun_bureaucracy_desc: "Le code juridique compilé sous le sultan Muzaffar Shah (r. 1446-1459) et affiné sous Mahmud Shah (r. 1488-1511), survivant dans une trentaine de recensions manuscrites à travers le monde malais. Ses quarante-quatre chapitres fusionnaient la charia islamique avec l'adat malais, et le code fut adopté comme texte de référence par les sultanats ultérieurs de Johor, Pahang, Kedah et Patani. L'ordonnance complémentaire Undang-Undang Laut Melaka, l'ordonnance maritime de Mahmud Shah, régissait l'autorité à bord des navires, les conflits de cargaison et les bénéfices du voyage, et était contraignante pour tous les navires naviguant sous le registre de Melaka, de Mergui à Maluku."

 msa_shahbandaria_bureaucracy: "Shahbandaria des Quatre Quartiers"
 msa_shahbandaria_bureaucracy_desc: "Les quatre officiers portuaires de Melaka, chacun dirigeant une communauté commerciale étrangère agréée de l'entrepôt du Suma Oriental de Tom Pires (vers 1515) : le Shahbandar des Gujaratis, le Shahbandar des Tamouls et Pegu, le Shahbandar des Javanais, des Moluques et de Luçon, et le Shahbandar des Chinois et du Champa. Chacun percevait les droits d'importation au taux publié, attribuait des parcelles d'entrepôt, réglait les différends au sein de sa communauté selon son propre droit coutumier et représentait ses marchands auprès de la chancellerie de Bendahara. L'institution a rendu Melaka gouvernable aussi bien par la couronne que par les marchands."

 msa_orang_laut_compact_bureaucracy: "Orang Laut Tanah-Air Compact"
 msa_orang_laut_compact_bureaucracy_desc: "L'accord institutionnel entre le trône malais et les nomades marins Orang Laut des archipels de Riau-Lingga et Tudjuh, par lequel les peuples de la mer détenaient des droits coutumiers sur des eaux territoriales spécifiques (tanah air, « terre et eau ») en échange d'un service naval auprès du sultan. Attesté dans le récit du Sejarah Melayu sur Sang Nila Utama, le pacte a donné à Melaka et Johor un corps de pilotes, d'auxiliaires navals irréguliers et d'informateurs dont la connaissance de chaque récif, de Singapour à Lingga, était inégalée. Les Orang Laut suku de Bentan et Galang étaient les faiseurs de rois de Johor : leur passage au Bugis Yam Tuan Muda en 1722 a fait de la fédération Bugis-Riau le régime politique malais dominant."
