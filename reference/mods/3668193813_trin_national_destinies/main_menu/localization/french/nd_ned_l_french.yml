l_french:
 STATIC_MODIFIER_NAME_nd_thalassocracy_of_the_north: "Thalassocratie du Nord"
 STATIC_MODIFIER_DESC_nd_thalassocracy_of_the_north: "La République néerlandaise contrôle les mers. Des bus de harengs de la mer du Nord aux grands Indiamen du VOC, nos flottes marchandes transportent les richesses du monde jusqu'aux quais d'Amsterdam. Là où d’autres voient des vagues, nous voyons des autoroutes."
 STATIC_MODIFIER_NAME_nd_cradle_of_liberty: "Berceau de la Liberté"
 STATIC_MODIFIER_DESC_nd_cradle_of_liberty: "Les Provinces-Unies constituent un modèle de tolérance dans une Europe divisée. Ici, catholiques et calvinistes vivent côte à côte, les érudits sépharades impriment librement et les réfugiés huguenots trouvent refuge. Nos universités et nos imprimeries font d’Amsterdam la capitale intellectuelle du continent."
 STATIC_MODIFIER_NAME_nd_voc_charter_spirit: "L'esprit du COV"
 STATIC_MODIFIER_DESC_nd_voc_charter_spirit: "La société à charte ouvre le monde aux entreprises néerlandaises. Actionnaires, marins et facteurs portent le drapeau orange jusqu’aux confins du globe."
 STATIC_MODIFIER_NAME_nd_wisselbank_confidence: "Confiance de Wisselbank"
 STATIC_MODIFIER_DESC_nd_wisselbank_confidence: "Le florin banco de la Banque d'Amsterdam est devenu la monnaie la plus fiable en Europe. Les billets tirés sur la Wisselbank sont acceptés d'Archange jusqu'à Cadix."
 nd_ned.1.t: "Les Provinces-Unies"
 nd_ned.1.d: "The seven provinces stand united at last. What began as a desperate revolt against tyranny has forged something the world has never seen, a republic of merchants and mariners, governed not by a crowned head but by the collective will of its States-General. The great question now is what kind of nation we shall become. Shall we turn our faces to the sea, as our shipwrights and admirals urge, building fleets to command every ocean and filling our warehouses with the riches of the Indies? Or shall we look inward to our unique gift, a society where the persecuted find refuge, where scholars debate freely, and where the printing press runs day and night? The world watches to see what this small, stubborn nation will make of its hard-won freedom.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ned.1.a: "Nous dominerons les vagues !"
 nd_ned.1.b: "Que tous ceux qui recherchent la liberté la trouvent ici."
 nd_ned.2.t: "Charte de la COV"
 nd_ned.2.d: "Les États généraux ont accordé une charte à la Vereenigde Oostindische Compagnie, la Compagnie unie des Indes orientales. Il ne s’agit pas d’une simple société commerciale. La VOC détient le droit souverain de faire la guerre, de négocier des traités et d'établir des colonies au nom de la République. Avec un capital de départ qui éclipse toute entreprise de l'histoire, la Compagnie enverra des flottes de navires marchands armés vers les îles aux épices, défiant ainsi le monopole portugais sur le commerce oriental. Des actionnaires de toutes les provinces ont investi leur fortune dans cette aventure, liant le destin de la République aux mers lointaines de l'Asie."
 nd_ned.2.a: "Le commerce des épices sera à nous."
 nd_ned.3.t: "La Wisselbank ouvre ses portes"
 nd_ned.3.d: "La ville d’Amsterdam a créé sa banque de change, la Wisselbank, pour mettre de l’ordre dans le chaos des devises étrangères dégradées qui inondent nos marchés. Désormais, toutes les lettres de change supérieures à six cents florins doivent être réglées par l'intermédiaire de la banque. Les marchands déposent leur monnaie et reçoivent du crédit en monnaie bancaire, le florin banco, dont la ville garantit la valeur. Plus de coupure, plus d'avilissement. La fiabilité de la monnaie bancaire néerlandaise incitera les commerçants de toute l'Europe à régler leurs comptes à Amsterdam, faisant de notre ville le centre d'échange du commerce mondial."
 nd_ned.3.a: "Une monnaie saine est le fondement du commerce."
 nd_ned.4.t: "L'Union d'Utrecht"
 nd_ned.4.d: "Dans la grande salle d'Utrecht, les représentants des provinces du Nord ont signé un traité d'union perpétuelle. Chaque province restera libre en matière de religion, nul ne sera persécuté à cause de sa foi. Cette déclaration sans précédent de liberté de conscience lie les provinces non pas par un sang partagé ou une couronne partagée, mais par un engagement commun envers la liberté. L'Union d'Utrecht servira de fondement à notre république, constitution née non de rois mais de citoyens libres."
 nd_ned.4.a: "Unité dans la diversité."
 nd_ned.5.t: "Maîtres de l'âge d'or"
 nd_ned.5.d: "La République néerlandaise a atteint une maîtrise des arts, des sciences et du commerce que le monde a rarement connue. Rembrandt peint à Amsterdam tandis que Vermeer capture la lumière à Delft. Huygens découvre les anneaux de Saturne tandis que Leeuwenhoek scrute dans son microscope le monde invisible qui regorge d'une goutte d'eau. La richesse des Indes coule à travers nos comptoirs, et notre flotte marchande dépasse celle de toutes les autres nations réunies. Dans ce petit pays arraché à la mer, l’ingéniosité humaine a atteint de nouveaux sommets."
 nd_ned.5.a: "Un âge d'or pour les âges."
 nd_ned_burgundian_cloth_trade: "Commerce de draps bourguignons"
 nd_ned_burgundian_cloth_trade_desc: "Les grandes halles aux draps de Bruges, Gand et Ypres sont le point d'ancrage d'un commerce textile qui s'étend des pâturages de laine anglais aux marchés de luxe italiens."
 nd_ned_herring_fleets: "Flottes de hareng"
 nd_ned_herring_fleets_desc: "Les bus de hareng hollandais naviguent en grands convois vers les zones de pêche, et de nouvelles techniques de salaison préservent les prises pour l'exportation à travers l'Europe."
 nd_ned_civic_autonomy: "Autonomie civique"
 nd_ned_civic_autonomy_desc: "Les villes des Pays-Bas protègent farouchement leurs privilèges, créant une tradition d'autonomie bourgeoise qu'aucun suzerain ne peut facilement supprimer."
 nd_ned_waterschappen: "Waterschappen"
 nd_ned_waterschappen_desc: "Les offices des eaux, coopératives démocratiques plus anciennes que n’importe quel parlement, coordonnent le travail incessant de construction de digues, d’assèchement des marais et de maintien de la mer à distance."
 nd_ned_watergeuzen: "Eaugeuzen"
 nd_ned_watergeuzen_desc: "Les Sea Beggars harcèlent les navires ennemis depuis leurs bases de raid, frappant rapidement et disparaissant dans les bas-fonds côtiers avant que les navires de guerre plus lourds ne puissent répondre."
 nd_ned_leiden_textiles: "Textiles de Leyde"
 nd_ned_leiden_textiles_desc: "Les tisserands réfugiés flamands transforment Leiden en le plus grand centre textile d'Europe, produisant de tout, des lakens fins aux camlets et dits légers."
 nd_ned_union_of_utrecht: "Union d'Utrecht"
 nd_ned_union_of_utrecht_desc: "Le traité fondateur de la République garantit la liberté de conscience, un engagement sans précédent en faveur de la tolérance religieuse qui attirera les minorités persécutées de toute l'Europe."
 nd_ned_stadtholder_tradition: "Tradition stathouder"
 nd_ned_stadtholder_tradition_desc: "La Maison d'Orange-Nassau assure la direction militaire de la République, avec des stathouders qui combinent autorité princière et service républicain."
 nd_ned_schutterij_tradition: "Schutterij Tradition"
 nd_ned_schutterij_tradition_desc: "Chaque ville néerlandaise possède ses schutterij, des compagnies de milice civique composées de bourgeois armés qui s'entraînent régulièrement et défendent les murs de leur ville avec une fierté obstinée."
 nd_ned_voc_charter: "Charte COV"
 nd_ned_voc_charter_desc: "La Vereenigde Oostindische Compagnie, la première société multinationale cotée en bourse de l'histoire, détient des pouvoirs souverains pour faire la guerre et gouverner des territoires à travers l'Asie."
 nd_ned_fluyt_design: "Conception Fluyt"
 nd_ned_fluyt_design_desc: "Le Fluyt révolutionne le commerce maritime, un cargo bon marché et efficace nécessitant moins d'équipage que n'importe quel modèle concurrent, donnant au transport maritime néerlandais un avantage de coût imbattable."
 nd_ned_admiralties: "Amirautés"
 nd_ned_admiralties_desc: "The five admiralty boards of the Republic coordinate shipbuilding, naval operations, and convoy protection, projecting Dutch sea power from the Baltic to the East Indies. Under their convoy ships the herring busses stay out for weeks and cure the catch on board.\n\n#italic Available in: $nd_ned_haringpakkerij$#!"
 nd_ned_freedom_of_conscience: "Liberté de conscience"
 nd_ned_freedom_of_conscience_desc: "L'engagement de la République en faveur de la tolérance religieuse attire des minorités persécutées (Juifs sépharades, huguenots, mennonites) dont les compétences et les capitaux enrichissent la société néerlandaise."
 nd_ned_wisselbank: "Banque de Wissel"
 nd_ned_wisselbank_desc: "La Banque d'Amsterdam introduit une monnaie saine et un crédit fiable, faisant du florin banco la monnaie de confiance du commerce international."
 nd_ned_beurs_exchange: "Bourse d'Amsterdam"
 nd_ned_beurs_exchange_desc: "The world's first stock exchange enables the trading of company shares, commodity futures, and government bonds, the birth of modern finance."
 nd_ned_korps_mariniers: "Corps des Mariniers"
 nd_ned_korps_mariniers_desc: "Le Corps des Marines de la République, créé par Johan de Witt, fournit une infanterie amphibie d'élite pour les opérations combinées navales et terrestres."
 nd_ned_dutch_ship_of_the_line: "Navire de ligne néerlandais"
 nd_ned_dutch_ship_of_the_line_desc: "Les grands navires de guerre des guerres anglo-néerlandaises transportent des rangées de canons lourds sur plusieurs ponts, conçus pour les engagements de flotte dévastateurs de la guerre en haute mer."
 nd_ned_golden_age_mastery: "Maîtrise de l'âge d'or"
 nd_ned_golden_age_mastery_desc: "La République néerlandaise a atteint une convergence sans précédent d’éclat artistique, de découverte scientifique et de suprématie commerciale, un âge d’or qui illumine toute l’Europe."
 nd_ned_colonial_network: "Réseau colonial"
 nd_ned_colonial_network_desc: "De la Nouvelle-Amsterdam à la colonie du Cap, du Suriname à Batavia, les possessions coloniales néerlandaises forment un réseau commercial mondial tissé par le VOC et le WIC."
 nd_ned_batavian_reforms: "Réformes bataves"
 nd_ned_batavian_reforms_desc: "Les réformes révolutionnaires modernisent la gouvernance néerlandaise, remplaçant l’ancien fédéralisme provincial par une administration centralisée et une bureaucratie rationnelle."
 nd_ned_hydraulic_engineering: "Génie Hydraulique"
 nd_ned_hydraulic_engineering_desc: "Les ingénieurs néerlandais maîtrisent la science de l'eau et des stations de pompage à vapeur drainent désormais des lacs entiers, créant de nouveaux polders de terres fertiles à partir de ce qui était autrefois de l'eau libre."
 nd_ned_mercantile_legacy: "Héritage marchand"
 nd_ned_mercantile_legacy_desc: "Des siècles d’entreprises commerciales ont créé une nation de commerçants, de financiers et d’entrepreneurs dont les réseaux commerciaux s’étendent à travers le monde."
 n_nd_ned_watergeuzen: "Eaugeuzen"
 n_nd_ned_watergeuzen_desc: "Navires de raid rapides dont l'équipage est composé des Sea Beggars, des rebelles protestants qui attaquent les navires ennemis depuis les refuges côtiers."
 n_nd_ned_fluyt: "Fluyt"
 n_nd_ned_fluyt_desc: "Le cargo néerlandais révolutionnaire, peu coûteux à construire, efficace à exploiter et nécessitant moins d’équipage que n’importe quel navire comparable."
 n_nd_ned_ship_of_the_line: "Navire de ligne néerlandais"
 n_nd_ned_ship_of_the_line_desc: "Un puissant navire de guerre hérissé de canons lourds sur plusieurs ponts, construit pour les engagements de flotte des guerres anglo-néerlandaises."
 a_nd_ned_marine: "Corps Marinier"
 a_nd_ned_marine_desc: "Soldats amphibies d'élite du Corps des Marines néerlandais, entraînés pour les opérations combinées navales et terrestres et l'embarquement de navire à navire."
 a_nd_ned_schutterij: "Schutterij"
 a_nd_ned_schutterij_desc: "Milice civique composée de bourgeois armés qui défendent leurs villages avec la détermination de citoyens libres protégeant leurs propres maisons."
 nd_ned_beurs: "Beurs"
 nd_ned_beurs_desc: "Une bourse de matières premières et de valeurs où les commerçants négocient des actions, règlent des factures et spéculent sur des contrats à terme, le cœur battant de la vie commerciale néerlandaise."
 nd_ned_admiraliteit: "Amiralite"
 nd_ned_admiraliteit_desc: "Un conseil d'amirauté qui coordonne la construction navale, les réparations et les opérations navales depuis son quartier général côtier."
 nd_ned_lakenhal: "Lakenhal"
 nd_ned_lakenhal_desc: "Une grande halle aux draps où les textiles sont inspectés, estampillés de labels de qualité et vendus à des marchands de toute l'Europe."
 nd_ned_waterschap: "Waterschap"
 nd_ned_waterschap_desc: "Un office des eaux qui coordonne l’entretien des digues, le drainage et la prévention des inondations, gardant la mer à distance grâce à une action collective."
 nd_ned_haringpakkerij: "Haringpakkerij"
 nd_ned_haringpakkerij_desc: "A herring packing house on the quay, where the catch of the busses is gibbed, salted and sealed in barrels branded by the sworn packers of the Great Fishery."
 nd_ned_haringpakkerij_upkeep: "Packing House Operations"
 nd_ned_haringpakkerij_upkeep_desc: "Salt for the cure, staves and hoops for the barrels, and nets, rope and tar for the busses."
 nd_ned_voc_kamer: "VOC Chamber"
 nd_ned_voc_kamer_desc: "One of the home chambers of the East India Company, with its counting house, warehouses and wharf, where the return fleets are fitted out and their cargoes auctioned."
 nd_ned_voc_kamer_upkeep: "Chamber Operations"
 nd_ned_voc_kamer_upkeep_desc: "Ship's stores for the outbound fleet, silver for the Asian trade, and the ledgers of the Company's bookkeepers."
 nd_ned_diamantslijperij: "Diamantslijperij"
 nd_ned_diamantslijperij_desc: "A diamond cutting works, a trade brought north by the refugees of Antwerp and open to the Sephardim of Amsterdam because no guild governed it."
 nd_ned_diamond_cutting: "Diamond Cutting"
 nd_ned_diamond_cutting_desc: "Rough stones are cleaved, cut and polished on the mill into gems fit for the jewellers of Europe."
 nd_ned_herring_curing: "Salaison du hareng"
 nd_ned_herring_curing_desc: "The Dutch method of gibbing and salting herring in the barrel preserves the catch for a year, making it a staple export across Europe."
 levy_nd_ned_schutterij: "Milice Schutterij"
 levy_nd_ned_schutterij_desc: "Compagnies de milice civique composées de bourgeois armés défendant leurs villes."
 nd_ned_beurs_upkeep: "Opérations d'échange"
 nd_ned_beurs_upkeep_desc: "Exploitation d'une bourse de matières premières : gestion des grands livres, des frais de courtage et des réserves d'argent."
 nd_ned_admiraliteit_upkeep: "Opérations de l'Amirauté"
 nd_ned_admiraliteit_upkeep_desc: "Fournir à une amirauté navale du bois, des cordes et des matériaux de construction navale."
 nd_ned_lakenhal_upkeep: "Opérations de la Halle aux Draps"
 nd_ned_lakenhal_upkeep_desc: "Transformation de la laine brute et des teintures pour les halls d'inspection et de commerce des textiles."
 nd_ned_waterschap_upkeep: "Opérations de l’Office des Eaux"
 nd_ned_waterschap_upkeep_desc: "Entretenir les digues, les pompes de drainage et les infrastructures de contrôle des inondations."
 nd_ned_formed_tt: "Les Pays-Bas ont été formés"
 nd_ned_path_a_tt: "Choisissez la Thalassocratie du Nord"
 nd_ned_path_b_tt: "A choisi le Berceau de la Liberté"
 nd_ned_dest_amsterdam_developed_tt: "We own #bold Amsterdam#! and its development is at least #bold 37#!"
 nd_ned_dest_leiden_developed_tt: "We own #bold Leiden#! and its development is at least #bold 38#!"
 nd_ned_destiny: "Destin de la République"
 nd_ned_destiny_desc: "Les Provinces-Unies ont été proclamées. Nous devons maintenant décider : devons-nous contrôler les océans ou éclairer l’esprit ? Notre stabilité doit rester ferme avant que nous puissions commencer."
 nd_ned_dest_baltic_mastery: "Maîtrise Baltique"
 nd_ned_dest_baltic_mastery_desc: "Contrôlez les grands ports hanséatiques de Lübeck et Hambourg pour dominer les routes commerciales du nord qui alimentent la richesse de la République."
 nd_ned_dest_spice_venture: "L'entreprise d'épices"
 nd_ned_dest_spice_venture_desc: "Plantez le drapeau néerlandais sur le détroit de Malacca et les Moluques riches en clous de girofle, ouvrant ainsi le commerce des épices orientales à nos flottes marchandes."
 nd_ned_dest_global_thalassocracy: "Thalasscratie mondiale"
 nd_ned_dest_global_thalassocracy_desc: "Embrace global trade and build the complete maritime empire from Batavia to Ceylon. The seas belong to the Republic, and our trading factories dot every shore."
 nd_ned_dest_printing_revolution: "La révolution de l’imprimerie"
 nd_ned_dest_printing_revolution_desc: "Adoptez l’imprimerie et faites des Pays-Bas la capitale européenne de l’édition. Nos presses imprimeront ce que d’autres n’osent pas dire."
 nd_ned_dest_financial_supremacy: "Suprématie financière"
 nd_ned_dest_financial_supremacy_desc: "Establish Amsterdam as the undisputed financial center of the world: embrace global trade, keep a thriving paper market, and build the town on the Amstel up into a great city."
 nd_ned_dest_enlightened_republic: "La République éclairée"
 nd_ned_dest_enlightened_republic_desc: "Embrace the scientific revolution and bring Geneva's Calvinist intellectual tradition under our wing. Make Leiden, the seat of the Republic's first university, twice the town it was, and win scholarly renown."
 nd_ned.6.t: "Le destin de la République vous attend"
 nd_ned.6.d: "Les Provinces-Unies se trouvent à la croisée des chemins. Les fondations de notre république sont solides, notre stabilité assurée. Nous devons maintenant tracer la voie qui définira notre nation pour des générations. Deux grandes visions se disputent l'âme de la République. On nous fait signe vers le large, vers les ports lointains et les richesses des Indes. L’autre nous appelle à construire quelque chose de sans précédent en Europe : une république de libre examen, de monnaie saine et de gouvernance éclairée."
 nd_ned.6.a: "Notre destin est entre nos mains."
 nd_ned.7.t: "Maîtres des mers du Nord"
 nd_ned.7.d: "Le drapeau orange flotte désormais sur les grands ports hanséatiques. Lübeck, cette ancienne reine du commerce balte, est passée sous notre contrôle. Hambourg, porte d'entrée sur la mer du Nord et sur l'intérieur de l'Allemagne, répond à nos amirautés. Les navires céréaliers de Pologne, les flottes forestières de Scandinavie, les convois de harengs de la mer du Nord, tous traversent désormais les eaux que nous contrôlons. Notre domination sur le commerce du Nord est totale et nos marchands tournent leurs regards vers des horizons encore plus lointains."
 nd_ned.7.a: "La Baltique est un lac néerlandais."
 nd_ned.8.t: "Implantation aux îles aux épices"
 nd_ned.8.d: "Les marchands et les soldats néerlandais ont pris le contrôle des légendaires îles aux épices. Malacca, le grand point d'étranglement du commerce oriental, arbore nos couleurs, et les bosquets de clous de girofle de Ternate sont désormais à nous. La question est de savoir comment exploiter au mieux cette opportunité sans précédent. Devons-nous nous concentrer sur la construction d’un réseau commercial de convois et de facteurs, en extrayant chaque florin du commerce des épices ? Ou devrions-nous investir dans des flottes armées capables de balayer tous les rivaux de ces eaux et d’établir une suprématie navale permanente ?"
 nd_ned.8.a: "Organiser les convois commerciaux."
 nd_ned.8.b: "Construisez la flotte de guerre des Indes."
 nd_ned.9.t: "Empire des mers"
 nd_ned.9.d: "Des comptoirs d'Amsterdam aux usines fortifiées de Batavia, des plantations de cannelle de Ceylan aux entrepôts de poivre des îles aux épices, l'empire maritime hollandais s'étend désormais sur le globe. Aucune nation n’a jamais exercé une telle puissance commerciale sur un territoire aussi petit. Nos capitaines contournent le Cap avec autant de désinvolture que les pêcheurs rament jusqu'au Dogger Bank. Nous devons maintenant décider du caractère de cet empire sans précédent. Devons-nous construire des colonies permanentes et extraire les richesses de la terre ? Ou allons-nous gouverner les océans eux-mêmes, faisant du libre-échange le fondement de notre hégémonie ?"
 nd_ned.9.a: "Construisez notre domination coloniale."
 nd_ned.9.b: "Commandez le large océan."
 nd_ned.10.t: "Les Presses d'Amsterdam"
 nd_ned.10.d: "L'imprimerie a transformé les Pays-Bas en la capitale européenne de l'édition. Ce qui ne peut être imprimé à Paris ou à Londres par crainte de la censure sort librement de nos presses à Amsterdam, Leyde et La Haye. Les philosophes français, les dissidents anglais, les piétistes allemands, tous trouvent des imprimeurs consentants dans notre république. Atlas, traités scientifiques, débats théologiques et pamphlets séditieux sortent de nos ateliers dans toutes les langues d'Europe. La connaissance est devenue notre exportation la plus rentable."
 nd_ned.10.a: "Laissez les presses fonctionner jour et nuit."
 nd_ned.11.t: "La capitale financière mondiale"
 nd_ned.11.d: "Amsterdam, grown from a town on the Amstel into a great city, has become what no city has been before: the financial center of the entire world. Bills drawn on our banks are accepted from Archangel to Cadiz. Our commodity exchange sets prices that merchants in every port must follow. Government bonds, company shares, and futures contracts, financial instruments that exist nowhere else, flow through our counting houses daily. Now we must choose how to wield this unprecedented power. Shall we build a tolerant haven that attracts the best minds from every persecuted community? Or shall we forge a network of innovation that binds Europe's economies to our own?"
 nd_ned.11.a: "Bienvenue à tous ceux qui apportent du talent et du capital."
 nd_ned.11.b: "Forgez les liens du commerce."
 nd_ned.12.t: "La République éclairée"
 nd_ned.12.d: "The Republic has achieved what philosophers only dreamed of: a state governed by reason, enriched by tolerance, and illuminated by science. Leiden has doubled around its university, and our schools draw scholars from across Europe. Our observatories map the heavens, our microscopes reveal the invisible, our botanists catalogue the world's flora. With Geneva's intellectual tradition now under our protection, the Republic stands as the undisputed center of Enlightenment thought. How shall we shape this golden age of reason? As a republic of letters, where free thought transforms society? Or as a center of scientific mastery, where knowledge becomes power?"
 nd_ned.12.a: "Que la liberté de pensée soit notre credo."
 nd_ned.12.b: "Exploitez le pouvoir de la science."
 STATIC_MODIFIER_NAME_nd_ned_dest_spice_convoy: "Réseau de convois d'épices"
 STATIC_MODIFIER_DESC_nd_ned_dest_spice_convoy: "Un vaste réseau de convois marchands armés transporte les richesses des Indes le long de voies maritimes protégées, avec des agents néerlandais dans chaque port rassemblant des renseignements sur leurs rivaux."
 STATIC_MODIFIER_NAME_nd_ned_dest_armed_fleet: "Flotte armée des Indes"
 STATIC_MODIFIER_DESC_nd_ned_dest_armed_fleet: "Une flotte de guerre permanente patrouille dans les mers orientales, chassant les marines rivales des routes des épices tandis que les forces terrestres néerlandaises sont de plus en plus négligées."
 STATIC_MODIFIER_NAME_nd_ned_dest_batavian_dominion: "Domination batave"
 STATIC_MODIFIER_DESC_nd_ned_dest_batavian_dominion: "Les colonies coloniales néerlandaises extraient des matières premières à travers les tropiques, entraînant la croissance démographique dans l’empire tout en étirant les effectifs militaires."
 STATIC_MODIFIER_NAME_nd_ned_dest_ocean_sovereign: "Souverain des océans"
 STATIC_MODIFIER_DESC_nd_ned_dest_ocean_sovereign: "La République contrôle les voies maritimes du monde non pas uniquement par la force, mais également par le biais d'accords de libre-échange et de prestige diplomatique qui rendent le commerce néerlandais bienvenu partout."
 STATIC_MODIFIER_NAME_nd_ned_dest_tolerant_haven: "Havre de tolérance"
 STATIC_MODIFIER_DESC_nd_ned_dest_tolerant_haven: "Les minorités persécutées (juifs sépharades, huguenots, mennonites) affluent vers la République, enrichissant sa classe marchande alors même que les anciennes prérogatives de la couronne diminuent."
 STATIC_MODIFIER_NAME_nd_ned_dest_financial_hub: "Centre financier"
 STATIC_MODIFIER_DESC_nd_ned_dest_financial_hub: "Les innovations financières d’Amsterdam (bourses, marchés à terme, banque centrale) unissent les économies européennes sous la direction néerlandaise."
 STATIC_MODIFIER_NAME_nd_ned_dest_republic_of_letters: "République des Lettres"
 STATIC_MODIFIER_DESC_nd_ned_dest_republic_of_letters: "La République néerlandaise est devenue le cœur intellectuel de l’Europe, où le libre examen, la pensée libérale et l’alphabétisation des bourgeois atteignent des sommets sans précédent."
 STATIC_MODIFIER_NAME_nd_ned_dest_golden_age_of_science: "Âge d'or de la science"
 STATIC_MODIFIER_DESC_nd_ned_dest_golden_age_of_science: "Les scientifiques néerlandais sont à la pointe du monde en optique, en cartographie et en philosophie naturelle, créant une société stable et prospère grâce à l'application pratique des connaissances."
 nd_ned_factorij: "Facteur"
 nd_ned_factorij_desc: "Une usine commerciale hollandaise fortifiée où les agents de la Compagnie achètent des produits locaux, stockent des épices pour le voyage de retour et font flotter le drapeau tricolore au-dessus des côtes étrangères."
 nd_ned_universiteit: "Université"
 nd_ned_universiteit_desc: "Une grande université néerlandaise où les universitaires poursuivent librement leurs connaissances, attirant des étudiants de toute l'Europe pour étudier la médecine, le droit, la théologie et les sciences naturelles."
 nd_ned_factorij_upkeep: "Opérations d'usine"
 nd_ned_factorij_upkeep_desc: "Pour entretenir une usine commerciale, il faut du tissu pour les marchandises commerciales, des outils pour les réparations et des fournitures navales pour les navires de la Compagnie."
 nd_ned_universiteit_upkeep: "Opérations universitaires"
 nd_ned_universiteit_upkeep_desc: "Soutenir une université nécessite du papier pour les livres et les thèses, des volumes reliés pour la bibliothèque et du verre pour les instruments de laboratoire."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_ned_bureaucracy_authority: "Institutions républicaines"
 AUTO_MODIFIER_DESC_nd_ned_bureaucracy_authority: "Les Sept Provinces-Unies ne sont pas gouvernées par un seul souverain mais par un ensemble d'organismes : les États généraux, les chambres des Indes orientales et occidentales, les conseils d'amirauté, les polderboards. Choisissez laquelle de ces institutions nos régents consolideront."

 ned_staten_generaal_bureaucracy: "État général"
 ned_staten_generaal_bureaucracy_desc: "Les États généraux se réunissent au Binnenhof à La Haye, où une délégation par province délibère des affaires de l'Union. Les résolutions majeures nécessitent l'unanimité, c'est pourquoi le Raadpensionaris de Hollande négocie des compromis sans fin entre les sept États souverains. Tant que l'Assemblée perdure, aucun édit n'a de poids sans le consentement des régents : une légitimité républicaine de fer achetée au prix d'une détermination glaciale."

 ned_raad_van_state_bureaucracy: "Conseil de l'État"
 ned_raad_van_state_bureaucracy_desc: "Reorganised by the Instruction of 12 April 1588, the Council of State directs military finance, the war department, and the tax administration of the Generality Lands, and keeps the frontier fortresses on its yearly State of War. Stadhouders sit ex officio; ordinary members are nominated by the Provincial States. The Council is the Republic's permanent executive in matters of war and treasure, the office through which the noble service-class claims its share of the Republic against the Holland-burgher faction."

 ned_heeren_xvii_bureaucracy: "Heeren XVII"
 ned_heeren_xvii_bureaucracy_desc: "La Vereenigde Oost-Indische Compagnie, créée le 20 mars 1602, confère les pouvoirs souverains - forts, traités, guerre et argent - à dix-sept directeurs réunis alternativement à Amsterdam et à Middelburg. Huit viennent de la chambre d'Amsterdam, quatre de Zélande, un de Delft, un de Rotterdam, un de Hoorn et un d'Enkhuizen, le dix-septième siège étant tournant. Les Heeren sont d’abord des marchands, puis des hommes d’État, et notre empire d’outre-mer se plie à cet ordre."

 ned_wisselbank_bureaucracy: "Banque Wissel d'Amsterdam"
 ned_wisselbank_bureaucracy_desc: "La Banque d'échange d'Amsterdam, fondée par le vroedschap de la ville le 31 janvier 1609, fait du florin bancaire l'unité de la finance de gros européenne. Une ordonnance municipale oblige toute lettre de change supérieure à six cents florins payable à Amsterdam à être compensée dans ses livres, et ainsi chaque grand marchand de la chrétienté tient un compte sur le barrage. Là où les comptes de la Wisselbank sont sains, les capitaux sont bon marché ; là où ils glissent, tout l’édifice du crédit hollandais frémit."

 ned_admiraliteiten_bureaucracy: "Vijf Admiraliteiten"
 ned_admiraliteiten_bureaucracy_desc: "Les cinq conseils d'amirauté établis par l'instruction des États généraux du 13 août 1597 - de Maze à Rotterdam, Amsterdam, Zélande à Middelburg, Noorderkwartier à Hoorn et Enkhuizen et Frise à Dokkum - régissent les finances navales, les chantiers navals et les convois. Une cinquantaine de conseillers des sept provinces siègent, financés par les droits de douane convooien en licenten perçus dans chaque port néerlandais. C’est cette flotte corporative-provinciale, et non une marine royale, qui maintient nos navires marchands à flot d’Archangel à Batavia."

 ned_waterschappen_bureaucracy: "Waterschappen"
 ned_waterschappen_bureaucracy_desc: "The polderboards descend from the Hoogheemraadschap of Rijnland chartered in 1255. In every polder the heemraden assess each farmer's hoefslag, the section of dike bordering his land, and levy fines on neglected maintenance. The boards stand outside the provincial States and outlive every regime change (counts, Habsburgs, Republic, monarchy) because without them the sea returns. They are the deepest institution of the Low Countries, slow to dismantle and slow to restore."

 ned_stadhouderschap_bureaucracy: "Stadhouderschap"
 ned_stadhouderschap_bureaucracy_desc: "À l'origine lieutenant du souverain des Habsbourg dans chaque province, le stadhouder a survécu à la révolte en tant que capitaine général républicain. Les princes d'Orange détiennent la plupart des stadhoudérats de la République par droit quasi dynastique et commandent l'armée des États néerlandais sur le terrain. Leur utilisation des milices schutterij pour discipliner les villes rebelles en fait les rivaux perpétuels des régents hollandais : un réflexe monarchique au sein d’une république fédérale."
