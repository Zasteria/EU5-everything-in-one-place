# === Destiny Tree ===
 nd_nin_dest_hamadan_developed_tt: "Hamadan is ours and its development is at least 35"
 nd_nin_dest_nineveh_developed_tt: "Mosul is ours and its development is at least 50"
 nd_nin_dest_edessa_developed_tt: "Urfa is ours and its development is at least 35"
 nd_nin_dest_baghdad_developed_tt: "Baghdad is ours and its development is at least 36"
 nd_nin_dest_kalhu_doctrine: "Doctrine Kalūu"
 nd_nin_dest_kalhu_doctrine_desc: "Codifier la pratique de campagne de l'empire universel dans la ville-palais de Tiglath-Pileser III, Kal?u. Prenez l’Anatolie : Konya, Kayseri et Ankara passent sous la bannière impériale. La doctrine sargonide vers l'ouest s'étendait jusqu'à sa limite achéménide."
 nd_nin_dest_zagros_throne: "Le trône de Zagros"
 nd_nin_dest_zagros_throne_desc: "Cross the Zagros mountains and claim the Iranian plateau. Hamadan, the old Median Ecbatana, and Istakhr, the medieval heir of Persepolis, must be brought under direct imperial rule, and Hamadan rebuilt as a throne city. The empire reaches further east than any Sargonid managed."
 nd_nin_dest_universal_empire: "ar Kibrat Erbetti"
 nd_nin_dest_universal_empire_desc: "The Sargonid title 'King of the Four Quarters' fulfilled at last. Reach Smyrna at the Lydian frontier, Samarkand at the Sogdian, Peshawar at the Gandharan. The Achaemenid maximum reclaimed under the Sargonid crown, with the seat at Mosul, by old Nineveh, built up to receive the four quarters. Capstone: Bīt-Mātāti, the Hall of the Lands."
 nd_nin_dest_beth_hekma_imperial: "Beth Hekma à l'échelle de l'Empire"
 nd_nin_dest_beth_hekma_imperial_desc: "Élevez la Maison de la Sagesse du Patriarcat jusqu'à la portée impériale. Adoptez l’institution bancaire ; faire en sorte que le couloir de la soie atteigne la capitale impériale. La comptabilité de la fonction publique araméenne rend les opérations bancaires intelligibles pour tout marché impérial."
 nd_nin_dest_aramaic_lingua_franca: "L'araméen comme Lingua Franca"
 nd_nin_dest_aramaic_lingua_franca_desc: "Make Aramaic the standard correspondence language of the Old World market. Embrace the printing press so that Aramaic is set in type, accumulate imperial reserves, and build up Urfa, the old Edessa whose dialect became the written Syriac of every diocese."
 nd_nin_dest_imperial_silk_corridor: "Le corridor impérial de la soie"
 nd_nin_dest_imperial_silk_corridor_desc: "Restore Sennacherib's canal network and join it to the qanat works and caravanserai roads of the Old World. Build up Baghdad, the middle of the navigation from Mosul to Basra; reach the Catholicate's old metropolitanate at Bukhara; secure the silk corridor in any imperial market. Capstone: the Imperial Canal of Sennacherib."

# === Destiny Event Loc ===
 nd_nin.8.t: "La frontière anatolienne"
 nd_nin.8.d: "The kisir crosses the Cilician Gates and the great central plateau opens before the empire. Konya falls; Kayseri capitulates; Ankara accepts the Patriarchate's metropolitan and the imperial governor in turn. The Sargonid westward doctrine, last carried by Sargon II to the Halys two thousand five hundred years ago, has reached further than its founder ever managed.\n\nThe imperial chancery raises the new annal-stelae at the western frontier. The empire now stands at the gate of the old Achaemenid west."
 nd_nin.8.a: "Le kisir détient le trône anatolien."

 nd_nin.9.t: "La traversée iranienne"
 nd_nin.9.d: "Hamadan falls. The Median throne-city, the Achaemenid Ecbatana, the summer capital of the Persian Great Kings, comes under the imperial governor. Istakhr, the medieval Persian heir of Persepolis, follows. The empire stands at the heart of the old Achaemenid throne-country.\n\nThe imperial council is divided. The Maphrian-General argues for a hard eastward push: the kisir is in the field, the campaign is paid for, the moment is unrepeatable. The chancery argues for absorption: the Iranian provinces must be staffed, taxed, and integrated, or they will rebel within a generation."
 nd_nin.9.a: "Appuyez sur la campagne vers l'est. Le kisir prend le terrain."
 nd_nin.9.b: "Consolider. Intégrez le trône iranien."

 nd_nin.10.t: "Les quatre quarts"
 nd_nin.10.d: "Smyrna at the Lydian frontier. Samarkand on the Sogdian highlands. Peshawar at the Gandharan gate. The Sargonid title šar kibrāt erbetti, King of the Four Quarters, claimed by Sargon II two and a half millennia ago, is fulfilled at last by the medieval-imperial heir of his throne. The empire's reach exceeds every Sargonid maximum and matches the Achaemenid peak.\n\nThe annal-stele blank carries the new inscription, and the imperial council debates the next move. Push further from every frontier? Or garrison the lines and let the empire's mass settle?"
 nd_nin.10.a: "Empereur du monde. De chaque frontière, poussez vers l’extérieur."
 nd_nin.10.b: "Garnissez les lignes. L’empire détient ce qu’il a pris."

 nd_nin.11.t: "La Beth Hekma refondée"
 nd_nin.11.d: "The Patriarchate's House of Wisdom, the translation institute of Bar Hebraeus, the medical tradition of Jundishapur scaled at last to empire. Every provincial seat now houses a Beth Hekma annex: scribes, translators, accountants, physicians, all drawing on the same Aramaic-Greek-Persian curriculum.\n\nThe accountancy of the Aramaic civil service has made the banking institutions of the Latin Mediterranean intelligible to the imperial markets. The Cross-and-Lamassu doctrine begins to bear its civilizational fruit."
 nd_nin.11.a: "Ouvrez les portes de la chancellerie. L'empire lit."

 nd_nin.12.t: "Le Synode Araméen"
 nd_nin.12.d: "The empire's chanceries declare Aramaic the standard correspondence language for the Old World market. The Catholicos convenes a great synod at the imperial capital to coordinate the Church of the East's metropolitanates: from the Iberian counts of the Latin Mediterranean to the Khazar successor courts to the Tang-heir capitals of the eastern silk road.\n\nTwo emphases compete for the synod's outcome. The chancery's view: scale the imperial translators, build a Beth Hekma at every provincial seat. The patriarchate's view: keep the synod's coordination paramount, let the metropolitanates govern by collegial agreement."
 nd_nin.12.a: "Traducteurs impériaux. Beth Hekma à chaque siège."
 nd_nin.12.b: "Le synode siège. Patriarcat et chancellerie de concert."

 nd_nin.13.t: "Le canal de Sennachérib restauré"
 nd_nin.13.d: "Sennacherib's great riverine works at the Tigris are restored at imperial scale. The empire's engineers join the Mosul-Basra navigation to the qanat networks of the Iranian plateau, the caravanserai roads across the Levant, and the monastic way-stations of the Catholicate from the Iberian coast to Bukhara. The Old World's economic spine is rebuilt under Aramaic-imperial supervision.\n\nThe imperial council decides the corridor's emphasis. Open it as a trade corridor, with the empire's customs at every great waystation? Or build it as an internal infrastructure, with the imperial domain knit closer through the canal network?"
 nd_nin.13.a: "Ouvrez le couloir. Le commerce s'effectue d'est en ouest."
 nd_nin.13.b: "Construisez les canaux. L'empire fluvial est entier."

# === Destiny Static Modifier Loc ===
 STATIC_MODIFIER_NAME_nd_nin_dest_zagros_advance: "L'avancée du Zagros"
 STATIC_MODIFIER_DESC_nd_nin_dest_zagros_advance: "Le kisir se dirige vers l'est à travers le plateau iranien. Campagnes annuelles du Zagros, caravanes de pillage revenant vers la capitale impériale, la doctrine militaire traditionnelle de l'empire portée à son maximum opérationnel."
 STATIC_MODIFIER_NAME_nd_nin_dest_zagros_consolidation: "Le regroupement Zagros"
 STATIC_MODIFIER_DESC_nd_nin_dest_zagros_consolidation: "Les provinces iraniennes sont intégrées plutôt que pillées. Les maisons nobles mèdes et perses sont cooptées dans le système de prélèvement impérial ; les administrateurs de réinstallation déplacent les populations du cœur du pays vers les nouvelles villes-trônes en garnison."
 STATIC_MODIFIER_NAME_nd_nin_dest_world_emperor: "ar Kibrat Erbetti"
 STATIC_MODIFIER_DESC_nd_nin_dest_world_emperor: "Roi des Quatre Quartiers. L'empire s'étend depuis toutes les frontières : la côte lydienne, les hautes terres sogdiennes, la porte du Gandharan, le fleuve nubien. La portée dépasse le maximum sargonide et le pic achéménide. La tension sur la cohésion impériale est permanente."
 STATIC_MODIFIER_NAME_nd_nin_dest_consolidation_throne: "La garnison impériale"
 STATIC_MODIFIER_DESC_nd_nin_dest_consolidation_throne: "L’empire détient ce qu’il a pris. Les forts frontaliers le long des portes ciliciennes, des cols du Zagros, des hauts plateaux de Sogdian et des passages de l'Indus sont gardés toute l'année. Le kisir consolide plutôt qu'il ne s'étend ; les levées s'aiguisent derrière les murs."
 STATIC_MODIFIER_NAME_nd_nin_dest_imperial_translators: "Les traducteurs impériaux"
 STATIC_MODIFIER_DESC_nd_nin_dest_imperial_translators: "Le corps de traduction du Patriarcat est devenu empire. Chaque siège provincial abrite une annexe Beth Hekma ; chaque commis de chancellerie lit l'araméen, le grec, le persan et le latin. Les banques de l'empire garantissent le marché des prêts impériaux en s'appuyant sur la comptabilité des chancelleries."
 STATIC_MODIFIER_NAME_nd_nin_dest_aramaic_synod: "Le Synode Araméen"
 STATIC_MODIFIER_DESC_nd_nin_dest_aramaic_synod: "Le grand synode du Catholicos siège dans la capitale impériale et coordonne les métropoles de l'Église d'Orient depuis la côte latine jusqu'aux hauts plateaux de Sogdian. Les gouverneurs de province et les métropolitains se partagent le réseau routier impérial ; la portée de l'empire dans les campagnes s'approfondit."
 STATIC_MODIFIER_NAME_nd_nin_dest_silk_corridor_open: "Le couloir de la soie"
 STATIC_MODIFIER_DESC_nd_nin_dest_silk_corridor_open: "Le canal impérial de Sennachérib rejoignait les ouvrages de qanat d'Iran et les routes des caravansérails du Levant. Les coutumes de l'empire à chaque étape ; caravanes de soie de Boukhara à la péninsule ibérique payant des péages impériaux. Les importations de luxe perturbent les disciplines traditionnelles du cœur impérial."
 STATIC_MODIFIER_NAME_nd_nin_dest_canals_built: "L'empire fluvial"
 STATIC_MODIFIER_DESC_nd_nin_dest_canals_built: "Les canaux s'étendent de la source du Tigre jusqu'au golfe Persique. L'intérieur de l'empire est relié par la voie navigable et le qanat ; les chancelleries intègrent les domaines provinciaux aux rôles impériaux à une vitesse sans précédent. La doctrine de Sennachérib rendue littérale à l'échelle impériale."

# === Destiny Building Loc ===
 nd_nin_bit_matati: "Bit-Matati"
 nd_nin_bit_matati_desc: "La Salle des Terres. La salle du trône sargonide reconstruite pour un empire de portée universelle : listes d'hommages cunéiformes des quatre quartiers, colosses lamassu de chaque région conquise, grande carte du maximum achéménide gravée dans le sol. Le titre de Sargon II rendu littéral."
 nd_nin_sennacherib_canal: "Canal impérial de Sennachérib"
 nd_nin_sennacherib_canal_desc: "Le grand projet d'ingénierie fluviale de Sennachérib (704-681 avant JC), restauré à l'échelle impériale et rattaché aux ouvrages de qanat et aux routes des caravansérails de l'Ancien Monde. L'épine dorsale économique du Vieux Monde a été reconstruite sous la supervision impériale araméenne."

# === Destiny PM Loc ===
 nd_nin_bit_matati_upkeep: "Entretien de la Salle des Terres"
 nd_nin_bit_matati_upkeep_desc: "Pierre, maçonnerie, tissus fins et armements rituels pour entretenir la salle du trône universel de l'empire."
 nd_nin_sennacherib_canal_upkeep: "Entretien des canaux"
 nd_nin_sennacherib_canal_upkeep_desc: "Bois, pierre, goudron et outils pour maintenir opérationnel le réseau fluvial et qanat."

# === BUREAUCRACIES ===
 nd_nin_kisir_sharruti_bureaucracy: "Ki?ir arruti"
 nd_nin_kisir_sharruti_bureaucracy_desc: "La réforme de Tiglath-Pileser III au milieu du VIIIe siècle avant JC a créé le kisir sharruti, la première armée permanente professionnelle au monde : des soldats de carrière payés en argent du trésor royal, entraînés toute l'année, en garnison à Kalhu et Ninive. Sargon II et Sennachérib l'ont étendu au noyau de fer de l'empire. Restauré sous Mossoul, il attire des conscrits de tout l’empire et répond directement au trône, contournant les nobles."

 nd_nin_tab_rabuti_bureaucracy: "Bureau ?ab-Rabti"
 nd_nin_tab_rabuti_bureaucracy_desc: "Les administrateurs néo-assyriens de la déportation (littéralement « les grands d'en haut ») qui géraient la politique de transfert massif de population de l'empire. Les peuples vaincus furent réinstallés à travers l’empire, leurs élites intégrées au service impérial, leurs terres repeuplées de nouveaux sujets. Les déportations israélites de Sargon II en 722 avant JC et les transferts babyloniens et égyptiens ultérieurs ont eu lieu à travers ce corps. À l’échelle impériale, elle dissout la résistance régionale par des délocalisations forcées, mais à un coût effroyable pour les populations rurales."

 nd_nin_saknu_temi_bureaucracy: "Provinces d'aknu ?emi"
 nd_nin_saknu_temi_bureaucracy_desc: "La réorganisation de Sargon II à la fin du VIIIe siècle avant JC divisa l'empire en environ soixante-dix provinces, chacune sous un saknu temi (gouverneur provincial) relevant directement du trône. Chaque province tenait trois comptes parallèles (fiscal, de garnison et religieux) qui se recoupaient mutuellement. Restauré à l’échelle impériale, cet appareil à triple entrée contourne les aristocrates régionaux grâce à un pipeline direct de Mossoul à chaque chef-lieu de district."

 nd_nin_aramaic_chancery_bureaucracy: "Chancellerie impériale araméenne"
 nd_nin_aramaic_chancery_bureaucracy_desc: "Tiglath-Pileser III a institutionnalisé l'araméen comme langue administrative de l'empire aux côtés de l'akkadien au 8ème siècle avant JC. Les scribes bilingues traitaient la correspondance diplomatique, les registres fiscaux et les dépêches provinciales en araméen sur parchemin périssable, tandis que l'akkadien monumental restait pour les stèles et les inscriptions royales. La restauration syriaque le fait revivre : une classe de commis lettrés dirigeait l'empire dans une écriture que tous les marchands d'Edesse à Suse peuvent lire."

 nd_nin_bit_tuppate_bureaucracy: "Réseau de mise à niveau de bits"
 nd_nin_bit_tuppate_bureaucracy_desc: "La bibliothèque d'Assurbanipal à Ninive (milieu du VIIe siècle avant JC) était la pierre angulaire d'un réseau de bit tuppate (« maisons de tablettes ») à l'échelle de l'empire : des écoles de scribes dans chaque siège de province, copiant des textes sumériens, akkadiens et araméens, formant des commis impériaux et conservant les archives de présages qui légitimaient les décisions royales. La restauration syriaque l'intègre dans la tradition du scriptorium du Patriarcat : chaque siège métropolitain abrite une annexe du scriptorium."

 nd_nin_akitu_liturgy_bureaucracy: "Liturgie impériale d'Akitu"
 nd_nin_akitu_liturgy_bureaucracy_desc: "Le festival Akitu était le rite de couronnement du Nouvel An mésopotamien, célébré chaque année depuis plus de deux millénaires, au cours duquel le roi réaffirmait rituellement sa souveraineté devant les dieux et les vassaux assemblés. La restauration syriaque la refonde en liturgie impériale chrétienne : le patriarche couronne l'empereur chaque Nisan dans la cathédrale de Mossoul, la procession festive fait défiler l'autorité impériale à travers la ville et chaque métropole est rituellement liée au trône."

# === Bureaucracy Authority Auto-Modifier ===
 AUTO_MODIFIER_NAME_nd_nin_bureaucracy_authority: "Autorité bureaucratique sargonide"
 AUTO_MODIFIER_DESC_nd_nin_bureaucracy_authority: "On the empire's formation, the restored Sargonid administrative apparatus may host historical bureaucracies. This authority grants three slots."
