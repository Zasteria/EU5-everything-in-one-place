l_french:

# === Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_nin_sargonid_imperium: "Impérial Sargonide"
 STATIC_MODIFIER_DESC_nd_nin_sargonid_imperium: "Le modèle d'empereur-guerrier de Tiglath-Pileser, Sargon et Esarhaddon restauré. L'armée permanente Kisir Sharruti fait campagne chaque année ; la garde royale qurubuti escorte le trône ; l'appareil de siège qui a brisé Lakis et Memphis se tourne désormais vers les frontières de l'empire. La doctrine est totale : aucun ennemi hors de portée, aucun hiver ne met fin à une campagne, aucun montagnard rival ne repose en sécurité à Sapan Mati."
 STATIC_MODIFIER_NAME_nd_nin_pax_assyriaca: "Pax Assyriaque"
 STATIC_MODIFIER_DESC_nd_nin_pax_assyriaca: "Le modèle administratif-impérial, les soixante-dix provinces d'Esarhaddon ont redonné vie. Les chancelleries araméennes se reproduisent depuis la capitale impériale jusqu'à chaque siège provincial ; le corps tab-rabuti des administrateurs de réinstallation déplace les populations à travers l’empire pour briser la résistance locale et refaire les loyautés régionales ; les routes sargonides et les postes express à poneys tissent un continent. L’empire ne se contente pas de conquérir ; il s'intègre."
 STATIC_MODIFIER_NAME_nd_nin_civilizational_synthesis: "La Croix et le Lamassu"
 STATIC_MODIFIER_DESC_nd_nin_civilizational_synthesis: "Patriarche et empereur couronnés sur le même autel d'Akitu. Les chérubins de Lamassu flanquent l'abside de la cathédrale ; la bibliothèque d'Assurbanipal se trouve à côté du scriptorium patriarcal ; d'anciennes stèles inscrites en caractères cunéiformes, araméens et grecs se dressent dans les jardins impériaux. L'empire n'est pas simplement l'héritier d'Aur ou d'Antioche mais des deux à la fois, un pôle civilisationnel entre l'ouest latin et l'est perse."

 STATIC_MODIFIER_NAME_nd_nin_aramaic_chancery_modifier: "La fonction publique araméenne"
 STATIC_MODIFIER_DESC_nd_nin_aramaic_chancery_modifier: "Correspondance impériale, comptes fiscaux et rôles judiciaires, le tout en lettres araméennes. L'épine dorsale administrative de l'empire sargonide restaurée à l'échelle impériale."
 STATIC_MODIFIER_NAME_nd_nin_library_restored_modifier: "La bibliothèque d'Assurbanipal"
 STATIC_MODIFIER_DESC_nd_nin_library_restored_modifier: "La plus grande bibliothèque systématique depuis Alexandrie, refondée dans la capitale impériale. Catalogue et catalogue de classes, séries de scribes et conventions de forme de tablette, tout l'appareil savant sargonide conservé."
 STATIC_MODIFIER_NAME_nd_nin_nile_campaign: "La campagne du Nil"
 STATIC_MODIFIER_DESC_nd_nin_nile_campaign: "L'empire revendique le Nil, à la manière d'Esarhaddon à Memphis et d'Assurbanipal à Thèbes. Règle provinciale directe sur l'Égypte, en garnison à Tanis et Memphis, payée en or nubien."
 STATIC_MODIFIER_NAME_nd_nin_tributary_settlement: "Le règlement tributaire"
 STATIC_MODIFIER_DESC_nd_nin_tributary_settlement: "La leçon la plus sage des Sargonides : collecter des tributs, installer des rois clients et rentrer chez eux avant que l'empire ne s'étende trop. La portée de l'empire est préservée sans le coût d'une garnison permanente."
 STATIC_MODIFIER_NAME_nd_nin_lamassu_gates: "Les portes de Lamassu"
 STATIC_MODIFIER_DESC_nd_nin_lamassu_gates: "Des chérubins colossaux au corps de taureau se dressent aux portes impériales. Les homélies patriarcales les identifient aux chérubins de la Genèse ; les tailleurs de pierre de l'empire les identifient à leurs ancêtres sargonides."
 STATIC_MODIFIER_NAME_nd_nin_akitu_imperial: "Akitu de la Couronne"
 STATIC_MODIFIER_DESC_nd_nin_akitu_imperial: "Le festival Akitu est célébré comme rite de couronnement impérial. L'empereur renouvelle le mandat divin ; les hauts gouverneurs prêtent serment chaque année ; la continuité de l'empire est réaffirmée."
 STATIC_MODIFIER_NAME_nd_nin_akitu_patriarchal: "Akitu du Patriarche"
 STATIC_MODIFIER_DESC_nd_nin_akitu_patriarchal: "La fête d'Akitu est célébrée comme une bénédiction patriarcale. Le Catholicos consacre l'année, l'empereur reçoit la communion et les chérubins lamassu flanquant l'autel témoignent de l'alliance renouvelée."

# === Formation Event ===
 nd_nin.1.t: "Le couronnement à Ninive"
 nd_nin.1.d: "The crown of Aššur is brought from the cathedral treasury to the restored Sargonid hall at Nineveh. The Catholicos of the East stands beside the emperor; the Maphrian-General waits at the door; the abbots of Mor Gabriel and Deir al-Zafaran have come down from Tur Abdin; the senior Aramaic scribes of the imperial chancery hold the new annal-stele blank. The world has not seen a power claim the imperial inheritance of Esarhaddon and Ashurbanipal in two thousand years.\n\nThree founding doctrines wait upon the new empire. The first is the warrior-emperor template of the Sargonids: the kisir sharruti standing army, the systematic siege doctrine, the empire of annual campaigns. The second is the administrative-imperial template: the seventy provinces, the Aramaic civil service, the integration administration that bound Babylon and Memphis under one crown. The third is the civilizational synthesis: ancient stelae and the Christian cross standing together, the Patriarch crowning the emperor at the Akitu festival, the empire as the lasting pole between Latin west and Persian east.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_nin.1.a: "Nous sommes les héritiers de Sargon. Le kisir marche."
 nd_nin.1.b: "L'araméen sera la langue de l'empire. Construisez les chancelleries."
 nd_nin.1.c: "Le patriarche couronne l'empereur. Cross et Lamassu ensemble."

# === Advance DHE Events ===
 nd_nin.2.t: "La fonction publique araméenne"
 nd_nin.2.d: "La chancellerie impériale est ouverte dans la capitale, et depuis ce jour toute la correspondance impériale, les comptes fiscaux, les rôles judiciaires et les directives provinciales sont rédigés en lettres araméennes. La grande innovation administrative des Sargonides, l'élévation d'une langue non impériale à l'usage impérial, est restaurée à grande échelle. Les paysans et les bourgeois parlant araméen de l'empire, depuis les hauts plateaux Hakkari jusqu'au delta du Nil, peuvent lire les édits de l'empereur dans leur propre langue. Aucun empire de l'Antiquité, hormis les Perses achéménides qui en empruntèrent l'usage, ne gouvernait dans une telle langue."
 nd_nin.2.a: "Que l'empire écrive en araméen."

 nd_nin.3.t: "La bibliothèque restaurée"
 nd_nin.3.d: "La Bibliothèque d'Assurbanipal est reconstituée dans la capitale impériale. Les traducteurs du Patriarcat descendent de la bibliothèque Bar Hebraeus de Mossoul ; les copistes cunéiformes survivants des académies sassanides sont convoqués ; les catalogues grecs et arabes des écoles scolaires du Patriarcat sont transcrits et indexés. Les tablettes sont triées par forme et par contenu selon la convention sargonide : carrée pour la finance, ronde pour l'agriculture, organisées sous les rubriques Histoire, Droit, Science, Magie, Dogme et Légende. La première bibliothèque systématique depuis Alexandrie, revenue dans sa ville fondatrice."
 nd_nin.3.a: "Le catalogue est ouvert. L'empire relit."

 nd_nin.4.t: "La question égyptienne"
 nd_nin.4.d: "The empire stands at Damascus and surveys the Nile. Esarhaddon took Memphis in 671 BC and ruled it directly; Ashurbanipal sacked Thebes in 663 BC and pulled back to tribute. The same choice now presents itself. Direct provincial rule over Egypt is the Sargonid maximum, the empire stretched from the Hakkari to the Nubian border. Tributary settlement is the wiser Sargonid retreat, preserving reach without the cost of permanent garrison.\n\nThe imperial council is divided. The Maphrian-General favors the campaign; the chancery favors the tributary arrangement; the Patriarch warns against the long supply line."
 nd_nin.4.a: "Appuyez sur la campagne. Memphis est à nous."
 nd_nin.4.b: "Prenez l'hommage. Garnison Damas, pas Thèbes."

 nd_nin.5.t: "La porte Lamassu"
 nd_nin.5.d: "La première nouvelle porte Lamassu depuis deux mille cinq cents ans s'élève dans la capitale impériale. Les tailleurs de pierre des écoles cathédrales du Patriarcat ont travaillé aux côtés des survivants des anciennes traditions de sculpture akkadiennes, récupérées dans les sanctuaires du village de Tur Abdin et dans les contreforts de Hakkari. Le gardien au corps de taureau et à la tête humaine, identifié par les homélies patriarcales aux chérubins de la Genèse, domine la porte impériale. Les ambassades en visite des États successeurs des Croisés, des sultanats mamelouks et des khanats perses passent sous eux et se souviennent que l'empire est l'héritier d'une puissance plus ancienne que la leur."
 nd_nin.5.a: "Que les chérubins gardent l'empire."

 nd_nin.6.t: "L'Akitu du Nouvel Âge"
 nd_nin.6.d: "The Akitu festival, the Babylonian-Assyrian new-year rite where the king's mandate was renewed before the assembled gods, is reconvened at the imperial capital after three millennia. The Catholicos crowns the emperor; the Maphrian-General consecrates the imperial sword; the lamassu cherubim flank the altar; the empire's senior governors swear their annual oaths.\n\nThe rite carries weight in two registers. As an imperial coronation, it asserts the crown's divine mandate. As a patriarchal blessing, it asserts the Church of the East's senior place at the imperial court. The chancery wishes one emphasis; the patriarchate wishes another."
 nd_nin.6.a: "L'Akitu est le jour de l'empire. La couronne mène."
 nd_nin.6.b: "L'Akitu est la bénédiction du patriarche. L’Église dirige."

 nd_nin.7.t: "Le taureau du ciel"
 nd_nin.7.d: "L'empire est formé. La couronne d'Aur repose sur la tête de l'empereur ; la chancellerie araméenne a commencé sa première série de rôles provinciaux ; les abbés de Tur Abdin sont descendus pour jurer fidélité ; les portes de Lamassu sont prévues à Ninive, Mossoul et Bagdad. La voie est désormais à la construction d’un empire. Le Taureau du Ciel parcourt à nouveau la terre, et le monde se mesurera à cette restauration."
 nd_nin.7.a: "Laissons l’empire accomplir sa destinée."

# === Advance Display Names ===
 nd_nin_kisir_sharruti: "Kisir Sharruti"
 nd_nin_kisir_sharruti_desc: "L'armée permanente sargonide restaurée. La réforme de Tiglath-Pileser III en 745 av. J.-C., le premier corps professionnel rémunéré à l'année au monde, a été refondée pour devenir l'épine dorsale militaire de l'empire."
 nd_nin_qurubuti: "Garde royale Qurubuti"
 nd_nin_qurubuti_desc: "La lourde garde du corps à cheval de l'empire, prête serment lors du festival d'Akitu, issue des maisons nobles de la cour patriarcale. Le plus proche des proches du trône impérial."
 nd_nin_sapan_mati: "Doctrine Sapan Mati"
 nd_nin_sapan_mati_desc: "La doctrine frontière du Pays de Montagne. Les armées sargonides opéraient systématiquement au-delà du cœur impérial vers l'Urartu, le Zagros et le Taurus ; aucun ennemi n’était hors de portée."
 nd_nin_lamassu_monumentalism: "Monumentalisme de Lamassu"
 nd_nin_lamassu_monumentalism_desc: "Des gardiens de portes colossaux au corps de taureau et à tête humaine, identifiés par les homélies patriarcales avec les chérubins de la Genèse, élevés dans chaque résidence impériale. Pratique monumentale sargonide en costume chrétien."
 nd_nin_tab_rabuti: "Tab-rabuti"
 nd_nin_tab_rabuti_desc: "Les grands administrateurs de réinstallation des Sargonides. Populations conquises transférées et intégrées, résistances régionales brisées par une dispersion délibérée. L'instrument administratif qui délimitait l'empire."
 nd_nin_imperial_siege_doctrine: "Doctrine de siège impérial"
 nd_nin_imperial_siege_doctrine_desc: "L'appareil de siège sargonide, le plus sophistiqué de l'Antiquité. Béliers, tours de siège mobiles, corps de sape, ingénieurs de rampe, la première école de siège systématique au monde."
 nd_nin_aramaic_chancery: "Chancellerie impériale araméenne"
 nd_nin_aramaic_chancery_desc: "L'innovation administrative sargonide à l'échelle de l'empire. L'araméen, lingua franca du Patriarcat, devient la langue de la fonction publique impériale."
 nd_nin_imperial_riverine_fleet: "Flotte fluviale impériale"
 nd_nin_imperial_riverine_fleet_desc: "Les canaux militaires de Sennachérib et la flotte Tigre-Euphrate refondés. Le corridor Mossoul-Basra comme voie navigable combinée militaire et commerciale."
 nd_nin_akitu_coronation: "Couronnement d'Akitu"
 nd_nin_akitu_coronation_desc: "La fête mésopotamienne du nouvel an a été refondée en rite de couronnement impérial chrétien. Le patriarche couronne l'empereur ; les hauts gouverneurs prêtent serment chaque année ; le mandat divin est renouvelé."
 nd_nin_sargonid_provinces: "Système provincial sargonide"
 nd_nin_sargonid_provinces_desc: "Le modèle administratif de soixante-dix provinces d'Esarhaddon. Chaque province était gouvernée par un sakin temi répondant à la chancellerie impériale, avec des comptes de garnison, fiscaux et religieux tenus en parallèle."
 nd_nin_imperial_standing_army: "Armée permanente impériale"
 nd_nin_imperial_standing_army_desc: "Le Kisir Sharruti est devenu empire. Chaque province fournit un quota fixe d'infanterie permanente ; le noyau est payé toute l'année; la professionnalisation de l'empire correspond au modèle sargonide à l'échelle impériale."
 nd_nin_library_restored: "Bibliothèque d'Assurbanipal"
 nd_nin_library_restored_desc: "La plus grande bibliothèque systématique de l'Antiquité refondée dans la capitale impériale. Les conventions des catalogues sargonides et le corps des traducteurs du Patriarcat fusionnent en une archive impériale unifiée."
 nd_nin_levantine_administration: "Administration levantine"
 nd_nin_levantine_administration_desc: "Le modèle sargonide pour la Méditerranée orientale : gouverneurs provinciaux dans les grandes villes, arrangements vassaux pour les royaumes commerçants côtiers, infrastructures de tribut et de garnison à travers le Levant."
 nd_nin_annal_stelae: "Stèles annales"
 nd_nin_annal_stelae_desc: "Les stèles-annales royales sargonides érigées aux frontières de l'empire pour enregistrer les campagnes, les traités et les soumissions des tributaires. Un instrument formel de diplomatie et de prestige refondé par l'empire."
 nd_nin_imperial_khorsabad: "Khorsabad impérial"
 nd_nin_imperial_khorsabad_desc: "Le modèle Dur-Sharrukin : un quartier de la capitale impériale planifié avec un palais, un temple, des fortifications et des greniers disposés comme un seul projet. L'empire en commande un au siège impérial."
 nd_nin_egyptian_province: "La province égyptienne"
 nd_nin_egyptian_province_desc: "Memphis d'Esarhaddon (671 avant JC), Thèbes d'Assurbanipal (663 avant JC). L'intégration sargonide du Nil dans le système impérial, restaurée comme doctrine impériale : l'Égypte comme province, en garnison et taxée."
 nd_nin_imperial_tribute: "Système d'hommage impérial"
 nd_nin_imperial_tribute_desc: "L'administration sargonide des rois vassaux : tribut annuel, quotas fixes, surveillants en garnison, menace de provincialisation en cas de manquement. L’appareil formel de gestion des sujets de l’empire."
 nd_nin_royal_officer_corps: "Corps des officiers royaux"
 nd_nin_royal_officer_corps_desc: "Officiers professionnels de l'empire, formés à l'école du palais impérial. L’empire de l’époque médiévale fusionne la tradition eunuque-bureaucrate sargonide avec le programme des écoles cathédrales de Mossoul et de Bagdad."
 nd_nin_scribal_schools: "Écoles de scribes"
 nd_nin_scribal_schools_desc: "Le réseau d'écoles de scribes du palais et des provinces de l'empire, issu des académies de scribes sargonides, a fusionné avec les écoles cathédrales du Patriarcat. L'araméen, le grec, le latin, le persan et le corpus cunéiforme sont tous enseignés."
 nd_nin_imperial_absolutism: "Absolutisme impérial"
 nd_nin_imperial_absolutism_desc: "Le concept sargonide d'autorité impériale totale absorbé dans la constitution absolutiste de l'empire. L'empereur comme unique représentant terrestre de l'ordre divin, avec le Catholicos comme principal prélat consacrant."
 nd_nin_lamassu_quarter: "Quartier royal de Lamassu"
 nd_nin_lamassu_quarter_desc: "Le quartier du palais impérial reconstruit selon le modèle sargonide : à portes lamassu, cathédrale à ziggourat, une ville-palais continue s'étendant du siège patriarcal à la caserne impériale."
 nd_nin_imperial_aramaic: "Araméen impérial"
 nd_nin_imperial_aramaic_desc: "La codification de l'araméen comme langue administrative formelle de tout l'empire. La chancellerie, les tribunaux, la correspondance impériale, les rôles des impôts, le tout en lettres araméennes."
 nd_nin_imperial_levies: "Prélèvements impériaux"
 nd_nin_imperial_levies_desc: "Les levées permanentes de l'empire provenant de chaque province intégrée, descendants du corps sargonide de déportés et de conscrits provinciaux. La base de main d’œuvre de l’empire s’étend à l’échelle impériale."
 nd_nin_annexation_doctrine: "Doctrine d’annexion"
 nd_nin_annexation_doctrine_desc: "La doctrine sargonide de l'escalade : tributaire, puis vassal, puis province. L’empire applique cela de manière cohérente et absorbe les sujets sous un gouvernement direct selon un calendrier fixe."
 nd_nin_imperial_industry: "Base industrielle impériale"
 nd_nin_imperial_industry_desc: "Le complexe industriel de la fin de l'empire, construit au sommet de la logistique fluviale sargonide, des scriptoria patriarcales et des fonderies de Mossoul. Une Mésopotamie industrielle centrée sur la capitale impériale."
 nd_nin_lamassu_academy: "Académie Lamassu"
 nd_nin_lamassu_academy_desc: "L'académie impériale militaire et administrative, du nom des taureaux-chérubins gardiens à ses portes. L'état-major, les cadets de la fonction publique et les hauts membres du clergé partagent un programme d'études en araméen et en grec."
 nd_nin_imperial_constitution: "Constitution impériale"
 nd_nin_imperial_constitution_desc: "Le règlement constitutionnel formel de l'empire tardif : couronne, patriarche, sénat des gouverneurs de province et fonction publique araméenne codifiés en un seul document calqué sur les annales royales sargonides."
 nd_nin_pan_aramaic_press: "Presse panaraméenne"
 nd_nin_pan_aramaic_press_desc: "La presse impériale, issue de l'imprimerie en écriture araméenne du Patriarcat. Journaux, journaux officiels et manuels pédagogiques distribués dans chaque province impériale."
 nd_nin_destiny: "Destin Impérial"
 nd_nin_destiny_desc: "Le Taureau du Ciel parcourt la terre. L'empire est formé ; la voie de l’accomplissement impérial est ouverte."

# === Building Display Names ===
 nd_nin_lamassu_gate: "Porte Lamassu"
 nd_nin_lamassu_gate_desc: "Gardiens colossaux à tête humaine, au corps de taureau, aux portes impériales. La tradition monumentale sargonide restaurée, identifiée aux chérubins de l'iconographie chrétienne."
 nd_nin_aramaic_chancery_building: "Chancellerie Impériale"
 nd_nin_aramaic_chancery_building_desc: "Le quartier général de la fonction publique de l'empire, fonctionnant en araméen selon le modèle sargonide. Les comptes provinciaux fiscaux, judiciaires et ecclésiastiques convergent ici."
 nd_nin_riverine_naval_yard: "Chantier naval fluvial"
 nd_nin_riverine_naval_yard_desc: "Le mouillage de la flotte Tigre-Euphrate. L'infrastructure du canal militaire de Sennachérib a été restaurée en tant que voie navigable militaire et commerciale combinée."
 nd_nin_akitu_square: "Place du Festival d'Akitu"
 nd_nin_akitu_square_desc: "La grande place ouverte de la capitale impériale où est célébré le rite du couronnement du nouvel an d'Akitu. Le patriarche couronne l'empereur ; les chérubins lamassu flanquent l'autel."
 nd_nin_kisir_barracks: "Caserne Kisir Sharruti"
 nd_nin_kisir_barracks_desc: "La caserne permanente du kisir impérial, l'infanterie professionnelle ouverte toute l'année dont les Sargonides ont été les pionniers."
 nd_nin_library_of_ashurbanipal: "Bibliothèque d'Assurbanipal"
 nd_nin_library_of_ashurbanipal_desc: "La plus grande bibliothèque systématique depuis Alexandrie, refondée dans la capitale impériale. Les conventions du catalogue sargonide, le corps de traduction patriarcal et le corpus cunéiforme survivant, le tout sous un même toit."
 nd_nin_annal_stele: "Stèle annale"
 nd_nin_annal_stele_desc: "Une stèle monumentale inscrite enregistrant les campagnes, les traités ou les soumissions d'affluents. Pratique des annales royales sargonides en tant qu'instrument formel de diplomatie et de prestige."
 nd_nin_imperial_palace: "Palais impérial de Khorsabad"
 nd_nin_imperial_palace_desc: "Un quartier de la capitale impériale prévu sur le modèle Khorsabad / Dur-Sharrukin. Palais, temple, fortifications et greniers disposés ensemble comme une seule commission impériale."
 nd_nin_scribal_school: "École de scribe"
 nd_nin_scribal_school_desc: "Une académie impériale de scribes fusionnant les traditions sargonides et patriarcales. Enseignement de l'araméen, du grec, du latin et du persan ; le corpus cunéiforme sargonide conservé pour une étude avancée."
 nd_nin_imperial_quarter: "Quartier Impérial"
 nd_nin_imperial_quarter_desc: "Le quartier du palais absolutiste de la capitale impériale. Avec ses portes de Lamassu et sa cathédrale en ziggourat, une ville-palais continue, du siège patriarcal à la caserne impériale."
 nd_nin_imperial_arsenal: "Arsenal Impérial"
 nd_nin_imperial_arsenal_desc: "Le complexe d’armement industriel de la fin de l’empire. Canons, armes à feu et acier pour le corps impérial, s'appuyant sur les fonderies de Mossoul et les ateliers fluviaux."

# === Production Method Loc ===
 nd_nin_lamassu_gate_upkeep: "Entretien de la porte de Lamassu"
 nd_nin_lamassu_gate_upkeep_desc: "Pierre, maçonnerie et objets rituels pour entretenir les gardiens chérubins et leurs sanctuaires qui les flanquent."
 nd_nin_chancery_upkeep: "Opérations de la chancellerie"
 nd_nin_chancery_upkeep_desc: "Papier, encre-cire, livres et encens pour le travail quotidien de la fonction publique impériale araméenne."
 nd_nin_naval_yard_upkeep: "Opérations du chantier naval"
 nd_nin_naval_yard_upkeep_desc: "Bois d'œuvre, goudron, fournitures navales et outils pour l'entretien de la flotte fluviale impériale."
 nd_nin_akitu_upkeep: "Entretien du festival Akitu"
 nd_nin_akitu_upkeep_desc: "Encens, cire d'abeille, papier et vin pour le rite du couronnement de l'empire et ses récurrences annuelles."
 nd_nin_kisir_upkeep: "Entretien de l'armée permanente de Kisir"
 nd_nin_kisir_upkeep_desc: "Des armes, des vêtements, des chevaux et des céréales pour soutenir le corps professionnel toute l'année."
 nd_nin_library_upkeep: "Opérations de la bibliothèque"
 nd_nin_library_upkeep_desc: "Papier, livres, cire d'abeille et encens pour le travail des archives impériales."
 nd_nin_annal_stele_upkeep: "Entretien des stèles"
 nd_nin_annal_stele_upkeep_desc: "Pierre, maçonnerie et cire rituelle pour conserver les inscriptions monumentales de l'empire."
 nd_nin_palace_upkeep: "Opérations du palais"
 nd_nin_palace_upkeep_desc: "Pierre, maçonnerie, draps fins et encens pour la résidence impériale et sa cour."
 nd_nin_scribal_upkeep: "Opérations de l'école scribale"
 nd_nin_scribal_upkeep_desc: "Du papier, des livres, de la cire d'abeille et de l'encens pour le programme impérial des scribes."
 nd_nin_imperial_quarter_upkeep: "Opérations du quartier impérial"
 nd_nin_imperial_quarter_upkeep_desc: "Pierre, maçonnerie, tissus fins et armes pour la cité-palais absolutiste."
 nd_nin_arsenal_pm: "Production de l'Arsenal Impérial"
 nd_nin_arsenal_pm_desc: "Fer, charbon et outils forgés pour fabriquer des armes pour le corps impérial."

# === Unit Display Names ===
 a_nd_nin_kisir_sharruti: "Kisir Sharruti"
 a_nd_nin_kisir_sharruti_desc: "L'infanterie permanente professionnelle de l'empire, le premier corps d'armée rémunéré à l'année. Gabarit sargonide restauré sous la bannière du Patriarcat."
 a_nd_nin_qurubuti: "Qurubuti"
 a_nd_nin_qurubuti_desc: "La cavalerie de la garde royale de l'empire. Garde du corps à cheval lourd, prêté serment lors du festival Akitu, issu des maisons nobles de la cour patriarcale."
 a_nd_nin_siege_corps: "Corps de siège impérial"
 a_nd_nin_siege_corps_desc: "L'appareil de siège sargonide restauré à grande échelle. Béliers, tours de siège mobiles, corps de sape et ingénieurs de rampe dans une formation coordonnée."
 a_nd_nin_aramean_auxiliary: "Auxiliaire araméen"
 a_nd_nin_aramean_auxiliary_desc: "Infanterie de levée de la campagne araméenne de l'empire. Les descendants du corps des déportés sargonides, constitués en classe auxiliaire permanente."

# === Levy Display Names ===
 levy_nd_nin_aramean_auxiliary: "Prélèvement auxiliaire araméen"
 levy_nd_nin_aramean_auxiliary_desc: "L'infanterie de Levy issue des paysans et soldats de langue araméenne de l'empire apparaît en Mésopotamie et au Levant."

