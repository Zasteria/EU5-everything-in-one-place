l_french:
 STATIC_MODIFIER_NAME_nd_sword_of_the_sultanate: "Épée du Sultanat"
 STATIC_MODIFIER_DESC_nd_sword_of_the_sultanate: "Le sultan commande la cavalerie la plus puissante de tout l'Hindoustan. Forgées dans les traditions de la garde mamelouke et des conquêtes des Khalji, les armées de Delhi balayent les plaines avec une discipline de fer et une force écrasante."
 STATIC_MODIFIER_NAME_nd_throne_of_hindustan: "Trône de l'Hindoustan"
 STATIC_MODIFIER_DESC_nd_throne_of_hindustan: "Depuis le siège de Delhi, le sultan préside une vaste administration qui fait le pont entre le raffinement persan et l'abondance indienne. La cour attire des érudits, des poètes et des marchands du monde islamique, et les divers peuples de l’Hindoustan trouvent un objectif commun sous une gouvernance éclairée."
 STATIC_MODIFIER_NAME_nd_khalji_market_discipline: "Discipline du marché de Khalji"
 STATIC_MODIFIER_DESC_nd_khalji_market_discipline: "L'État impose un contrôle strict des prix des céréales, des tissus et des chevaux, permettant ainsi de maintenir une armée permanente massive à un coût gérable."
 STATIC_MODIFIER_NAME_nd_iqta_centralization: "Centralisation Iqta"
 STATIC_MODIFIER_DESC_nd_iqta_centralization: "L'audit systématique et la redistribution des concessions de terres iqta renforcent le contrôle direct de la couronne sur les revenus provinciaux et affaiblissent l'autonomie des gouverneurs locaux."
 STATIC_MODIFIER_NAME_nd_suri_imperial_highway: "Autoroute impériale Suri"
 STATIC_MODIFIER_DESC_nd_suri_imperial_highway: "L'expansion de la Grand Trunk Road et la construction de sarais sur toute sa longueur ont transformé le commerce terrestre, reliant le Bengale à l'Indus dans un ruban commercial continu."
 nd_dlh.1.t: "Le Sultanat restauré"
 nd_dlh.1.d: "Delhi stands once more as the seat of Muslim sovereignty over Hindustan. From the walls of Siri to the Qutb Minar, the city's skyline proclaims the power of the Sultan who has reunited these vast domains. The question now is what kind of sultanate this shall be. The martial traditions of Balban and the Khalji sultans beckon: an empire built on cavalry charges and the sharp edge of conquest. But so too does the vision of the Tughlaq administrators: a realm where Persian learning meets Indian wealth, where diverse peoples are governed through sophisticated bureaucracy rather than the sword alone. The Sultan must choose the path that will define this new era.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_dlh.1.a: "Que la cavalerie tonne à travers les plaines du Gange !"
 nd_dlh.1.b: "Nous bâtirons un empire de l’administration et de la culture."
 nd_dlh.2.t: "Les réformes du marché du sultan"
 nd_dlh.2.d: "À la manière du sultan Alauddin Khalji, l’État a imposé des contrôles de prix draconiens sur les marchés de Delhi. Trois marchés distincts ont été créés : un pour les céréales, un pour les tissus et les produits manufacturés, et un pour les chevaux, le bétail et les esclaves. Chacun est supervisé par un shahna-i-mandi qui rapporte directement aux services de renseignement. Des espions se mêlent aux commerçants pour s’assurer du respect des règles. L’objectif est clair : en fixant le prix des céréales à des niveaux artificiellement bas, les soldats peuvent percevoir des salaires modestes tout en ayant les moyens de nourrir leur famille. Le résultat est une armée permanente d'une taille sans précédent, les récits historiques revendiquant plus de 475 000 cavaliers sous la bannière de Khalji. Pourtant, de tels contrôles suscitent le ressentiment tant parmi les commerçants que parmi les agriculteurs."
 nd_dlh.2.a: "Appliquer les contrôles : l'armée doit être nourrie."
 nd_dlh.2.b: "Assouplir les marchés : la stabilité par la prospérité."
 nd_dlh.3.t: "Le système Iqta"
 nd_dlh.3.d: "Le système iqta, hérité des États islamiques antérieurs, est devenu l’épine dorsale de l’administration du sultanat. Les Iqtadars, commandants militaires dotés du pouvoir de perception des revenus sur les terres désignées, servent à la fois de gouverneurs provinciaux et de commandants militaires locaux. Sous le sultan Iltutmish, ces subventions étaient temporaires et transférables, empêchant l'émergence d'une aristocratie héréditaire foncière susceptible de contester le trône. Le sultan est désormais confronté à un choix : renforcer le contrôle central en exigeant des audits rigoureux et des transferts fréquents, renforçant la couronne mais en risquant la loyauté de l'élite militaire, ou permettre aux iqtas de devenir plus stables, en récompensant les services fidèles par la sécurité d'inamovibilité."
 nd_dlh.3.a: "Centraliser : le mandat du sultan doit être absolu."
 nd_dlh.3.b: "Laissez les iqtadars prospérer dans leurs domaines."
 nd_dlh.4.t: "Les Saraïs Impériaux"
 nd_dlh.4.d: "Dans la tradition de Sher Shah Suri, l’État s’est lancé dans un vaste programme de développement des infrastructures le long des grands axes routiers de l’Hindoustan. Tous les quatre miles, un sarai a été construit : un complexe fortifié offrant un abri, de la nourriture et des chevaux frais aux voyageurs. Chaque sarai contient une mosquée, des quartiers séparés pour les voyageurs hindous et musulmans, un puits et des écuries. Le réseau total dépasse 1 700 sarais, transformant ce qui était autrefois des voyages périlleux à travers des campagnes infestées de bandits en un commerce de routine. Les commerçants rapportent que les marchandises peuvent désormais voyager de Sonargaon au Bengale jusqu'à la frontière de l'Indus en quelques semaines plutôt qu'en mois."
 nd_dlh.4.a: "Développer davantage le réseau routier."
 nd_dlh.4.b: "Les routes sont construites. Maintenant, laissons les échanges se dérouler."
 nd_dlh_mamluk_tradition: "Tradition de la garde mamelouke"
 nd_dlh_mamluk_tradition_desc: "L'institution de formation de jeunes esclaves en tant que guerriers à cheval d'élite, héritée des traditions abbassides et ghurides, a produit la cavalerie la plus redoutable du sultanat."
 nd_dlh_iqta_system: "Concessions de terres Iqta"
 nd_dlh_iqta_system_desc: "L'attribution de droits de perception des revenus sur des territoires désignés aux commandants militaires en remplacement de leur salaire : le fondement administratif du Sultanat."
 nd_dlh_sultanate_madrasas: "College of Hauz Khas"
 nd_dlh_sultanate_madrasas_desc: "In 1352 Firuz Shah raises a college beside the great tank of Hauz Khas at Delhi. Its masters are paid from the treasury, its students are lodged and fed, and those who finish go into the sultan's service as judges and secretaries. More are endowed on its model in the towns of the realm."
 nd_dlh_military_secretariat: "Secrétariat militaire"
 nd_dlh_military_secretariat_desc: "Le Diwan-i-Arz tenait des listes détaillées de chaque soldat au service du sultan, enregistrant leur apparence, les marques de leurs chevaux et l'équipement qui leur était attribué pour prévenir la fraude."
 nd_dlh_khalji_market_controls: "Contrôles du marché de Khalji"
 nd_dlh_khalji_market_controls_desc: "Le système de marchés réglementés par l'État et de prix fixes institué par le sultan Alauddin Khalji, permettant le maintien de la plus grande armée permanente de l'Inde médiévale."
 nd_dlh_tughlaq_fortifications: "Fortifications de Tughlaq"
 nd_dlh_tughlaq_fortifications_desc: "Les forteresses austères mais massives en maçonnerie de moellons construites sous la dynastie Tughlaq, caractérisées par des murs en pente, des remparts battus et une concentration sur la fonction militaire plutôt que sur la décoration."
 nd_dlh_hasham_levies: "Système de prélèvement Hasham"
 nd_dlh_hasham_levies_desc: "La conscription de l'infanterie ordinaire, le hasham, issue de paysans hindous et musulmans, était entraînée et payée en espèces plutôt que par des concessions de terres."
 nd_dlh_royal_karkhanas: "Karkhanas royaux"
 nd_dlh_royal_karkhanas_desc: "Ateliers publics produisant des armes, des textiles et des articles de luxe pour la cour et l'armée. Des maîtres artisans du monde islamique ont été recrutés pour travailler dans ces installations."
 nd_dlh_barqandaz_tradition: "Tradition de Barqandaz"
 nd_dlh_barqandaz_tradition_desc: "Les archers à cheval du sultanat ultérieur, habiles à manœuvrer rapidement et à harceler le feu à cheval, s'appuyant sur les traditions de guerre des steppes d'Asie centrale."
 nd_dlh_sultanate_currency: "Monnaie du Sultanat"
 nd_dlh_sultanate_currency_desc: "La standardisation de la monnaie sous les sultans de Delhi, culminant avec la rupiya en argent de Sher Shah Suri : une pièce si bien conçue qu'elle est devenue la base du système monétaire indien pendant des siècles."
 nd_dlh_delhi_urbanization: "Urbanisation de Delhi"
 nd_dlh_delhi_urbanization_desc: "La transformation de Delhi en l'une des plus grandes villes du monde, Ibn Battuta la décrivant en 1334 comme la plus grande ville de tout le monde musulman."
 nd_dlh_dagh_o_chehra: "Dagh-o-Chehra"
 nd_dlh_dagh_o_chehra_desc: "Le système d'enregistrement militaire consistant à marquer les chevaux (dagh) et à maintenir des listes descriptives des soldats (chehra) pour prévenir la fraude à la paie et garantir la préparation martiale."
 nd_dlh_topchi_artillery: "Corps d'artillerie de Topchi"
 nd_dlh_topchi_artillery_desc: "L'adoption de l'artillerie à poudre par le sultanat de Delhi, s'appuyant sur les traditions d'Asie centrale et ottomanes. Les artilleurs Topchi servaient aux côtés de la cavalerie traditionnelle dans les armées du sultanat ultérieur."
 nd_dlh_suri_sarais: "Suri Saraïs"
 nd_dlh_suri_sarais_desc: "Le vaste réseau de maisons de repos en bordure de route construites par Sher Shah Suri le long de la Grand Trunk Road, offrant abri, nourriture et sécurité aux voyageurs et aux commerçants de tout le sous-continent."
 nd_dlh_suri_administrative_reform: "Réforme administrative de Suri"
 nd_dlh_suri_administrative_reform_desc: "La réorganisation du gouvernement provincial sous Sher Shah Suri, divisant l'empire en sarkars et parganas avec une évaluation systématique des revenus et une administration professionnelle."
 nd_dlh_indo_islamic_architecture: "Architecture indo-islamique"
 nd_dlh_indo_islamic_architecture_desc: "La fusion distinctive des traditions architecturales persanes et indiennes, depuis les arcs brisés et la calligraphie géométrique de l'ère Khalji jusqu'aux doubles dômes et à la toiture Bangla du Lodis."
 nd_dlh_suri_military_reform: "Réforme militaire de Suri"
 nd_dlh_suri_military_reform_desc: "La réorganisation de l'armée par Sher Shah Suri en une force disciplinée, payée de manière centralisée et dotée d'un équipement standardisé, remplaçant le système de prélèvement féodal par une infanterie professionnelle."
 nd_dlh_grand_trunk_expansion: "Agrandissement du Grand Tronc"
 nd_dlh_grand_trunk_expansion_desc: "Le développement continu du réseau routier de l'Hindoustan, avec des arbres d'ombrage, des bornes kilométriques et des ponts reliant les provinces les plus reculées de l'empire à la capitale."
 nd_dlh_centralized_revenue: "Revenus centralisés"
 nd_dlh_centralized_revenue_desc: "La mesure et l'évaluation systématiques des terres agricoles dans tout le Sultanat, en remplaçant la fiscalité basée sur des estimations par une extraction de revenus basée sur des enquêtes."
 nd_dlh_reformed_sultanate_army: "Armée réformée du Sultanat"
 nd_dlh_reformed_sultanate_army_desc: "La modernisation des forces militaires de Delhi, intégrant des exercices et des tactiques d'influence européenne aux traditions traditionnelles de cavalerie et d'artillerie du sultanat."
 nd_dlh_industrial_karkhanas: "Karkhanas industriels"
 nd_dlh_industrial_karkhanas_desc: "La transformation des ateliers royaux du Sultanat d'opérations artisanales de cour en centres de fabrication proto-industriels, produisant des textiles, des armes et des produits finis à grande échelle."
 nd_dlh_legacy_of_synthesis: "L'héritage de la synthèse"
 nd_dlh_legacy_of_synthesis_desc: "La réalisation durable du sultanat de Delhi : la création d'une civilisation indo-islamique composite qui synthétisait les traditions persanes, turques, arabes et indiennes en quelque chose de plus grand que n'importe quelle source unique."
 a_nd_dlh_mamluk_guard: "Cavalerie de la garde mamelouke"
 a_nd_dlh_mamluk_guard_desc: "Guerriers à cheval d'élite formés dès la jeunesse dans la tradition d'Asie centrale, formant la garde personnelle du sultan et la force de choc des armées du sultanat."
 a_nd_dlh_hasham_infantry: "Infanterie Hasham"
 a_nd_dlh_hasham_infantry_desc: "Des fantassins enrôlés issus de la population paysanne et payés en espèces. Bien que moins prestigieux que la cavalerie, leur nombre donnait au sultanat son avantage en termes d'effectifs."
 a_nd_dlh_barqandaz: "Barqandaz"
 a_nd_dlh_barqandaz_desc: "Archers à cheval rapides, spécialisés dans le tir de harcèlement et la poursuite rapide, employant des tactiques de steppe d'Asie centrale dans les plaines de l'Hindoustan."
 a_nd_dlh_topchi: "Topchi"
 a_nd_dlh_topchi_desc: "Artilleurs à poudre qui composaient l'équipage des batteries de canons du sultan, issus d'un mélange de traditions d'Asie centrale, ottomanes et indigènes."
 a_nd_dlh_suri_piyada: "Suri Piyada"
 a_nd_dlh_suri_piyada_desc: "Des fantassins disciplinés de l'ère Suri, entraînés et équipés selon des normes professionnelles, représentant le passage d'une levée féodale à une armée permanente."
 levy_nd_dlh_hasham: "Hasham Lévy"
 levy_nd_dlh_hasham_desc: "L'infanterie paysanne enrôlée levée grâce au système de prélèvement en espèces du sultanat, fournissant la masse de fantassins qui soutenaient la cavalerie d'élite."
 nd_dlh_tughlaqabad_fortress: "Forteresse de Tughlaqabad"
 nd_dlh_tughlaqabad_fortress_desc: "Une fortification massive construite dans le style austère Tughlaq, avec des murs inclinés en maçonnerie de moellons et des remparts battus conçus pour résister à la guerre de siège."
 nd_dlh_sarai: "Saraï"
 nd_dlh_sarai_desc: "Une maison de repos fortifiée en bord de route fournissant de la nourriture, un abri et des chevaux frais aux voyageurs et aux marchands le long des routes principales de l'empire."
 nd_dlh_madrasa: "Firuz Shahi Madrasa"
 nd_dlh_madrasa_desc: "A royal college on the model of the one at Hauz Khas. Law, tradition and the sciences are taught by salaried masters, and the judges and secretaries of the sultan's service are drawn from its students."
 nd_dlh_karkhana: "Karkhana royale"
 nd_dlh_karkhana_desc: "Un atelier public où des maîtres artisans produisent des armes, des textiles raffinés et des articles de luxe pour la cour et les armées du sultan."
 nd_dlh_diwan_i_arz: "Diwan-i-Arz"
 nd_dlh_diwan_i_arz_desc: "Le secrétariat militaire est chargé de tenir les rôles de rassemblement, de marquer les chevaux de cavalerie et d'assurer l'état de préparation et la discipline des forces armées du sultan."
 nd_dlh_fortress_maintenance: "Entretien de la forteresse"
 nd_dlh_fortress_maintenance_desc: "De la pierre pour les réparations en cours, des armes pour la garnison et des outils pour les ingénieurs qui entretiennent les remparts en moellons."
 nd_dlh_sarai_provisions: "Dispositions de Saraï"
 nd_dlh_sarai_provisions_desc: "Des céréales et du bétail pour nourrir les voyageurs et approvisionner les montures fraîches, avec du sel pour conserver les provisions le long des routes principales."
 nd_dlh_madrasa_endowment: "College Endowment"
 nd_dlh_madrasa_endowment_desc: "Papier pour les manuscrits et la correspondance scientifique, et tissu pour les robes des enseignants et des étudiants dotés par le waqf."
 nd_dlh_karkhana_inputs: "Matériaux Karkhana"
 nd_dlh_karkhana_inputs_desc: "Les artisans tissent des tissus et des teintures importés pour en faire des textiles raffinés pour la cour du sultan."
 nd_dlh_diwan_administration: "Administration de Diwan"
 nd_dlh_diwan_administration_desc: "Du papier pour les rôles de rassemblement et les registres descriptifs, de l'argent pour la solde des soldats et du tissu pour l'équipement standard fourni par le secrétariat militaire."
 nd_dlh_sultanate_minting: "Monnaie au Sultanat"
 nd_dlh_sultanate_minting_desc: "Des monnayeurs qualifiés frappent des pièces de monnaie standardisées en argent et en cuivre, produisant ainsi des métaux précieux pour le trésor du sultanat."
 nd_dlh_formed_tt: "Delhi a été créée"
 nd_dlh_path_a_tt: "Choisissez l'épée du sultanat"
 nd_dlh_path_b_tt: "A choisi le trône de l'Hindoustan"
 nd_dlh_destiny: "Destin de Delhi"
 nd_dlh_destiny_desc: "The Sultanate of Delhi stands restored. Maintenant commence le travail visant à façonner son avenir, que ce soit par l’épée ou par la plume. Atteignez la stabilité pour débloquer le chemin de votre destin que vous avez choisi."
 nd_dlh_dest_deccan_conquest: "Conquête du Deccan"
 nd_dlh_dest_deccan_conquest_desc: "The Deccan is slipping from Delhi's hand. Warangal has thrown out the Sultan's governor, and the Raichur country between the rivers is held by the new kingdom of Vijayanagar. Bring Warangal and Raichur under the Sultan's banner, as Alauddin Khalji once dreamed, and raise an army worthy of the enterprise."
 nd_dlh_dest_daulatabad_developed_tt: "We own #bold Daulatabad#! and its development is at least #bold 35#!"
 nd_dlh_dest_jaunpur_developed_tt: "We own #bold Jaunpur#! and its development is at least #bold 49#!"
 nd_dlh_dest_delhi_developed_tt: "We own #bold Delhi#! and its development is at least #bold 82#!"
 nd_dlh_dest_subjugate_south: "Soumettre le Sud"
 nd_dlh_dest_subjugate_south_desc: "With the northern Deccan secured, the Sultan's gaze turns to the great Hindu kingdom of the south. Vijayanagar must fall. Build up Daulatabad, the second capital in the Deccan, so that the campaign can be sustained from it."
 nd_dlh_dest_sultan_of_all_india: "Sultan de toute l'Inde"
 nd_dlh_dest_sultan_of_all_india_desc: "From the Himalayas to Cape Comorin, from the Indus to the Bay of Bengal: the Sultan's writ must run unchallenged. Take Madurai, Goa, and Thatta on the Indus. Command the mightiest army and the richest treasury in all the subcontinent."
 nd_dlh_dest_bengal_integration: "Intégration du Bengale"
 nd_dlh_dest_bengal_integration_desc: "Bengal, the wealthiest province in all of Hindustan, has been governed as a distant frontier for too long. Bring Gaur and Sonargaon under direct imperial administration, held by the Sultan himself and by no governor or subject prince, and harness the region's silk and rice wealth."
 nd_dlh_dest_institutional_zenith: "Zénith institutionnel"
 nd_dlh_dest_institutional_zenith_desc: "The Sultan's administration must extend its reach to the trading ports of western India. Bring Diu on the coast of Saurashtra into the imperial fold, fill the treasury, and build up Jaunpur on the Gomti into a city of scholars and officials."
 nd_dlh_dest_beacon_of_hindustan: "Phare de l'Hindoustan"
 nd_dlh_dest_beacon_of_hindustan_desc: "The Sultanate must become the greatest administrative state the subcontinent has ever known. Secure the port of Chittagong, attain the highest prestige, and build Delhi itself to twice its size."
 nd_dlh.5.t: "Le destin de Delhi"
 nd_dlh.5.d: "Le sultanat a été restauré, et avec lui la promesse d'un avenir digne de l'ancienne grandeur de Delhi. Le sultan doit maintenant tracer la voie qui permettra à cet empire de traverser les âges. Le chemin est choisi, il faut maintenant le parcourir."
 nd_dlh.5.a: "Delhi perdurera."
 nd_dlh.6.t: "La marche vers le Deccan"
 nd_dlh.6.d: "The Sultan's armies have crossed the Vindhya Range and brought the cities of the Deccan to heel. Warangal, the old seat of the Kakatiya kings, and Raichur between the Krishna and the Tungabhadra now fly Delhi's standard. The Deccan campaigns of Alauddin Khalji have been replicated, and this time, the gains shall be permanent. The wealth of the plateau flows north to Delhi, and the Hindu kingdoms of the south watch with growing alarm."
 nd_dlh.6.a: "Le Deccan s'incline devant Delhi."
 nd_dlh.7.t: "Les campagnes du Sud"
 nd_dlh.7.d: "Daulatabad has grown into a second capital, and from it the armies marched south. The mighty citadel of Vijayanagar, that last great bastion of Hindu resistance, has submitted to the Sultan's authority, and its treasure has been carted north. The southern campaigns have proven the Sultanate's military supremacy beyond any doubt. Now the Sultan must decide how to consolidate these vast new conquests."
 nd_dlh.7.a: "Marchez avec les éléphants de guerre à l’avant-garde."
 nd_dlh.7.b: "Écrasez complètement la résistance. Ne laissez rien."
 nd_dlh.8.t: "Sultan de toute l'Inde"
 nd_dlh.8.d: "Des cols enneigés du Cachemire aux villes-temples de la côte tamoule, des quais de Surat aux mangroves des Sundarbans : l'autorité du sultan s'étend sans contestation sur tout le sous-continent. Aucun dirigeant depuis Ashoka n’a commandé un tel domaine. La question qui définit désormais l’empire est de savoir si cette souveraineté universelle doit être maintenue par une guerre sainte perpétuelle, ou si le sultan doit rechercher une paix durable entre les peuples de l’Inde."
 nd_dlh.8.a: "L'épée ghazi ne doit jamais se reposer."
 nd_dlh.8.b: "Que les peuples indiens connaissent la paix."
 nd_dlh.9.t: "La richesse du Bengale"
 nd_dlh.9.d: "Les administrateurs du sultan ont achevé l'intégration du Bengale dans le système impérial. Gaur, l'ancienne capitale des sultans du Bengale, et Sonargaon, le grand magasin du delta oriental, sont désormais des provinces directement gouvernées du sultanat. La soie bengali, la mousseline et le riz coulent vers l'ouest le long de la Grand Trunk Road, enrichissant le trésor et alimentant les villes de l'Hindoustan. Le centre de gravité économique de l’empire s’est déplacé vers l’est."
 nd_dlh.9.a: "Le Bengale enrichit le royaume tout entier."
 nd_dlh.10.t: "Le Zénith Institutionnel"
 nd_dlh.10.d: "The Sultanate's administration has reached an unprecedented level of sophistication. With the ports of Gujarat under imperial control, revenue flows from every corner of the subcontinent to Delhi. The madrasas of Jaunpur produce a steady stream of trained administrators, and the sarkar system ensures that the Sultan's edicts are enforced from the Indus to the Brahmaputra. The question now is whether to pursue this administrative excellence through spiritual harmony or through systematic revenue extraction."
 nd_dlh.10.a: "Adoptez la voie soufie de la tolérance."
 nd_dlh.10.b: "Commander une enquête complète sur les revenus."
 nd_dlh.11.t: "Phare de l'Hindoustan"
 nd_dlh.11.d: "Le sultanat de Delhi est devenu ce dont rêvaient les empereurs Tughlaq : un État dont l’étendue administrative, la sophistication culturelle et la puissance économique sont inégalées dans le monde. Des chercheurs du Caire à Samarkand se rendent à Delhi pour étudier ses systèmes de gouvernance. Le sultan préside une cour cosmopolite où la poésie persane et la philosophie sanskrite cohabitent, où les mathématiques des temples hindous éclairent les tables astronomiques islamiques et où les divers peuples du sous-continent ont trouvé une identité commune sous la bannière d’une souveraineté éclairée."
 nd_dlh.11.a: "Favoriser une cour cosmopolite pour tous les peuples."
 nd_dlh.11.b: "Dotez les fondations waqf à travers le royaume."
 STATIC_MODIFIER_NAME_nd_dlh_dest_war_elephants: "Éléphants de guerre du sultan"
 STATIC_MODIFIER_DESC_nd_dlh_dest_war_elephants: "Les éléphants de guerre capturés dans les royaumes du sud forment désormais l'avant-garde des armées du sultan, même si leurs charges déchaînées laissent la dévastation sur leur sillage."
 STATIC_MODIFIER_NAME_nd_dlh_dest_scorched_earth: "Politique de la Terre Brûlée"
 STATIC_MODIFIER_DESC_nd_dlh_dest_scorched_earth: "La répression impitoyable de la résistance à travers le Deccan garantit le respect des règles, même si les méthodes employées ternissent la réputation du sultan."
 STATIC_MODIFIER_NAME_nd_dlh_dest_ghazi_tradition: "Tradition Ghazi"
 STATIC_MODIFIER_DESC_nd_dlh_dest_ghazi_tradition: "Le sultan revendique le titre de ghazi, guerrier de la foi, et l'expansion perpétuelle devient la raison d'être de l'empire, même si une guerre constante met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_dlh_dest_pax_sultanica: "Pax Sultanica"
 STATIC_MODIFIER_DESC_nd_dlh_dest_pax_sultanica: "With all of India under one banner, the Sultan inaugurates an era of internal peace and religious accommodation, though the cessation of conquest breeds complacency among the ruling class and the armies are slow to rally."
 STATIC_MODIFIER_NAME_nd_dlh_dest_sufi_tolerance: "Tolérance soufie"
 STATIC_MODIFIER_DESC_nd_dlh_dest_sufi_tolerance: "Les traditions mystiques du soufisme comblent le fossé entre les dirigeants musulmans et les sujets hindous, favorisant la confiance commerciale et la bonne volonté diplomatique, même si l’accent mis sur l’harmonie rend la cour réticente à faire la guerre."
 STATIC_MODIFIER_NAME_nd_dlh_dest_revenue_survey: "Enquête sur les revenus impériaux"
 STATIC_MODIFIER_DESC_nd_dlh_dest_revenue_survey: "Une étude approfondie de chaque champ, atelier et étal de marché de l'empire constitue la base d'une taxation systématique, renforçant la loyauté provinciale mais détournant les ressources de la collecte de renseignements."
 STATIC_MODIFIER_NAME_nd_dlh_dest_cosmopolitan_court: "Cour cosmopolite"
 STATIC_MODIFIER_DESC_nd_dlh_dest_cosmopolitan_court: "La cour de Delhi devient un phare pour les érudits, les diplomates et les poètes du monde connu, élargissant ainsi la portée et l'influence diplomatiques du sultanat."
 STATIC_MODIFIER_NAME_nd_dlh_dest_waqf_endowments: "Dotations Waqf"
 STATIC_MODIFIER_DESC_nd_dlh_dest_waqf_endowments: "Vast charitable endowments fund mosques, hospitals, and caravanserais across the empire. The scholars and imams who live on them are bound to the throne by its pious generosity."
 nd_dlh_dar_al_shuja: "Dar al-Shuja'a"
 nd_dlh_dar_al_shuja_desc: "La Maison des Braves : une académie militaire d'élite où les meilleurs guerriers du sultan sont formés à l'équitation, aux techniques de siège et à l'art de commander des armées sur les vastes distances du sous-continent."
 nd_dlh_dar_al_shuja_maintenance: "Entretien de l'Académie"
 nd_dlh_dar_al_shuja_maintenance_desc: "Les armes pour l'entraînement, les chevaux pour les exercices de cavalerie et le cuir pour les armures et la sellerie maintiennent l'académie opérationnelle."
 nd_dlh_firuzabad_complex: "Complexe de Firuzabad"
 nd_dlh_firuzabad_complex_desc: "Un grand complexe administratif et culturel inspiré de la vision de Firuz Shah Tughlaq, abritant des bibliothèques, des observatoires et des bureaux de la bureaucratie impériale."
 nd_dlh_firuzabad_maintenance: "Administration complexe"
 nd_dlh_firuzabad_maintenance_desc: "Papier pour les archives et la correspondance, toile fine pour le mobilier de la cour, mobilier pour les bureaux administratifs et verre pour les fenêtres de l'observatoire."

 # ===== BUREAUCRACIES =====
 dlh_diwan_i_wizarat_bureaucracy: "Diwan-i-Wizarat"
 dlh_diwan_i_wizarat_bureaucracy_desc: "Le bureau du wazir, organe central de l'administration fiscale du sultanat. Le diwan dressait les listes du kharaj, vérifiait les bureaux provinciaux et transmettait les ordres fiscaux du sultan à travers l'Hindoustan. Khwaja Khatir a servi Iltutmish dans ce poste ; Khan-i-Jahan Maqbul en a guidé les dernières décennies de Firuz Shah Tughluq. Un wazir compétent pouvait maintenir le trésor rempli même en cas de crise dynastique, mais le vaste pouvoir discrétionnaire de cette fonction faisait du wazir lui-même le deuxième homme du royaume et un rival inévitable des autres serviteurs du trône."
 dlh_diwan_i_insha_bureaucracy: "Dabir-i-Khas"
 dlh_diwan_i_insha_bureaucracy_desc: "The sultan's confidential secretary and his office of clerks. They wrote the firmans, the diplomas of appointment and the sultan's letters in the high Persian of the court, in a land where almost no one spoke it at home. Amir Khusrau, the court's poet, wrote a manual of letter writing in that style in 1319. A firman read out in a newly taken town told its people whose they were, and a trained office let Delhi speak to provinces months away. When it decayed under the later Tughluqs, the provinces stopped listening."
 dlh_diwan_i_risalat_bureaucracy: "Diwan-i-Risalat"
 dlh_diwan_i_risalat_bureaucracy_desc: "Le bureau des affaires religieuses et de la correspondance sortante avec les tribunaux musulmans étrangers, chargé de nommer les cadis, de recommander les muftis et de rédiger les ambassades. Le diwan a donné aux oulémas un canal institutionnel reconnu vers le trône et a fait de la diplomatie du sultanat avec le calife abbasside au Caire mamelouk, avec les tribunaux ilkhanides et plus tard timurides, et avec les dirigeants du Yémen et de la Mecque, une question formelle. Les oulémas habilités ont protégé le sultan contre les accusations d'impiété ; Si rien n’est fait, les mêmes oulémas pourraient déclarer un sultan apostat."
 dlh_shahna_i_mandi_bureaucracy: "Shahna-i-Mandi"
 dlh_shahna_i_mandi_bureaucracy_desc: "The market superintendent established by Alauddin Khalji circa 1296-1316, who fixed the price of grain, cloth, slaves, and cattle in the Delhi mandis and forbade hoarding under penalty of physical mutilation. The reform fed a vast standing army by collapsing soldier wages while keeping rural producers' purchase prices low, but it depended on aggressive enforcement, ruined the merchants of the capital, and was abandoned within months of Alauddin's death. Barani recorded the policy as an unrepeatable masterpiece of statecraft, and as a warning."
 dlh_sadr_us_sudur_bureaucracy: "Sadr-us-Sudur"
 dlh_sadr_us_sudur_bureaucracy_desc: "Le surveillant en chef des dotations caritatives (waqf), nomme les imams des mosquées congrégationnelles et distribue les allocations de l'État aux érudits (idrar). Firuz Shah Tughluq a doté les waqfs à une échelle monumentale : les karkhanas de Firuzabad, le grand canal Hisar et la fondation de Jaunpur et Hisar-Firuza ont tous transité par ce bureau. Les Sadr tenaient les registres des fondations pieuses et décaissaient leurs revenus ; entre de bonnes mains, cette fonction a fait du sultan un bâtisseur de mosquées et de madrasas dont on se souvient depuis des siècles."
 dlh_naib_i_mulk_bureaucracy: "Naib-i-Mulk"
 dlh_naib_i_mulk_bureaucracy_desc: "The regent-vizierate, an extraordinary office in which a great noble assumed the powers of the sultan during minorities, ill health, or political incapacity. Khusrau Khan deposed Mubarak Khalji from this office in 1320; Khan-i-Jahan Maqbul ran Firuz Shah's later decades from it; Bahlul Lodi rose from a kind of vice-regency in the 1450s to found the last sultanate dynasty. The institution kept the realm functioning through weak sultans, but it concentrated the realm's military and fiscal levers in the hands of one noble, and produced more than one dynastic transition along the way."
 dlh_tughluq_doab_cadaster_bureaucracy: "Cadastre Doab"
 dlh_tughluq_doab_cadaster_bureaucracy_desc: "Projet de Muhammad bin Tughluq de 1325-1351 visant à mesurer chaque parcelle du Doab entre le Gange et la Yamuna et à normaliser l'évaluation des revenus par la coudée, supplantant les anciennes méthodes d'estimation par village. Combiné avec des hausses d'impôts simultanées pendant la sécheresse, le cadastre a précipité la fuite des paysans et une famine qui a dépeuplé des districts entiers. L'appareil administratif a survécu à la catastrophe et est devenu le modèle pour les cadastres de Sher Shah Suri et, deux siècles plus tard, pour le Todar Mal d'Akbar - les bases de la sophistication fiscale moghole ont été posées ici."

 AUTO_MODIFIER_NAME_nd_dlh_bureaucracy_authority: "Diwans du Sultanat"
 AUTO_MODIFIER_DESC_nd_dlh_bureaucracy_authority: "Les diwans de Delhi (le wazirat, la chancellerie, le bureau de correspondance, le bureau du chef sadr) sont devenus un appareil institutionnel permanent. Depuis le quartier Quwwat-ul-Islam de Delhi, les registres des revenus, des nominations et des dotations pieuses sont désormais conservés comme des archives continues, et les ordres du sultan portent le poids d'une institution plutôt que d'un homme."
