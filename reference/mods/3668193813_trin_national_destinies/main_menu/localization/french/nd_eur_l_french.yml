l_french:
 STATIC_MODIFIER_NAME_nd_eur_universal_empire: "Empire universel"
 STATIC_MODIFIER_DESC_nd_eur_universal_empire: "De Charlemagne à Napoléon, le rêve d’un empire européen unique, d’une loi, d’une armée, d’un objectif, a façonné le continent. Dans le cadre de cette vision, l’Europe parle d’une seule voix, ses divers peuples étant forgés en une civilisation unifiée par une autorité centralisée et une volonté irrésistible."
 STATIC_MODIFIER_NAME_nd_eur_concert_of_sovereigns: "Concert des Souverains"
 STATIC_MODIFIER_DESC_nd_eur_concert_of_sovereigns: "L’idéal des Lumières d’une fédération volontaire, des nations souveraines liées non pas par la conquête mais par un droit partagé, un bénéfice mutuel et une coopération rationnelle. Chaque membre conserve son identité ; ensemble, ils constituent un ordre plus grand que n’importe quel empire. C’est l’Europe telle que Kant l’imaginait : une paix perpétuelle grâce à l’association volontaire."
 nd_eur.1.t: "L'unification de l'Europe"
 nd_eur.1.d: "What no emperor, no pope, no conqueror has achieved, we have accomplished. The continent of Europe, from the Atlantic shores to the Ural frontier, from the frozen north to the Mediterranean sun, stands unified under a single banner. This is the culmination of a thousand years of shared civilization: the cathedrals that pierce every skyline, the universities that light every city, the trade routes that bind every market.\n\nBut the manner of this union remains to be decided. Shall Europe be forged into a single imperium, its peoples united under one throne and one law, as Charlemagne and Napoleon dreamed? Or shall it become a concert of sovereign nations, voluntarily bound by shared principles and mutual respect, as the philosophers of the Enlightenment envisioned?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_eur.1.a: "Un trône, une loi, une Europe"
 nd_eur.1.b: "Un concert de nations libres, liées par la raison"
 nd_eur.2.t: "La République des Lettres"
 nd_eur.2.d: "Across the breadth of our unified continent, a revolution of the mind has taken hold. Scholars, philosophers, and natural scientists correspond freely across what were once hostile borders. From the salons of Paris to the coffeehouses of Vienna, from the laboratories of London to the observatories of Padua, knowledge flows unimpeded.\n\nThis 'Republic of Letters', a community of intellect transcending language and creed, represents something unprecedented in human history. The accumulated wisdom of all European peoples, freely shared and built upon, has produced an explosion of discovery that no single nation could have achieved alone."
 nd_eur.2.a: "Laissez le savoir circuler librement au-delà des frontières"
 nd_eur.3.t: "Le Congrès des Nations"
 nd_eur.3.d: "The great powers of our European state have assembled in congress to deliberate on matters of common concern. The age of bilateral diplomacy gives way to a new system, collective deliberation by the nations of the continent.\n\nThe precedent set at Westphalia, refined at Utrecht and Vienna, has evolved into something grander: a permanent framework for resolving disputes, managing trade, and coordinating policy across the entire continent. But the nature of this congress remains contested."
 nd_eur.3.a: "La diplomatie et la gouvernance partagée doivent prévaloir"
 nd_eur.3.b: "L’ordre doit être imposé par le fort"
 nd_eur.4.t: "La convergence industrielle"
 nd_eur.4.d: "The transformation that began in individual workshops and mines has become a continental phenomenon. Railways now connect every major city. Factories operate on shared standards. Raw materials flow from the periphery to industrial centers and manufactured goods flow back, creating an integrated economic system of unprecedented scale.\n\nThis industrial convergence offers two paths forward: we may direct this energy toward expanding our productive capacity, building the infrastructure that binds the continent ever more tightly together, or we may focus on extending our commercial reach, establishing European trade networks that span the globe."
 nd_eur.4.a: "Construire la base industrielle du continent"
 nd_eur.4.b: "Étendre nos réseaux commerciaux à travers le monde"
 STATIC_MODIFIER_NAME_nd_eur_republic_of_letters_flourishing: "République florissante des lettres"
 STATIC_MODIFIER_DESC_nd_eur_republic_of_letters_flourishing: "Le libre échange de connaissances au-delà des frontières européennes a produit une accélération sans précédent de la découverte et de l’apprentissage."
 STATIC_MODIFIER_NAME_nd_eur_congress_diplomacy: "Diplomatie du Congrès"
 STATIC_MODIFIER_DESC_nd_eur_congress_diplomacy: "Le système des congrès a établi un cadre de délibération collective et de résolution diplomatique qui lie les nations d’Europe entre elles."
 STATIC_MODIFIER_NAME_nd_eur_imposed_order: "Ordre continental imposé"
 STATIC_MODIFIER_DESC_nd_eur_imposed_order: "Les forts imposent l’ordre sur le continent, assurant la stabilité grâce à une autorité disciplinée plutôt qu’à un consensus négocié."
 nd_eur_industrial_convergence_modifier: "Convergence industrielle"
 nd_eur_industrial_convergence_modifier_desc: "La capacité industrielle du continent augmente à mesure que des normes partagées et des infrastructures connectées créent un système économique intégré."
 STATIC_MODIFIER_NAME_nd_eur_commercial_expansion: "Expansion commerciale continentale"
 STATIC_MODIFIER_DESC_nd_eur_commercial_expansion: "Les réseaux commerciaux européens s’étendent à travers le monde, transportant les produits de l’industrie continentale aux quatre coins du monde."
 nd_eur_latin_christendom: "Chrétienté latine"
 nd_eur_latin_christendom_desc: "L’héritage religieux commun de l’Europe médiévale, exprimé à travers les écoles cathédrales, l’apprentissage monastique et la langue universelle du latin, a jeté les bases d’une identité européenne commune."
 nd_eur_champagne_fairs: "Foires de Champagne"
 nd_eur_champagne_fairs_desc: "Les grandes foires commerciales de Champagne, de Flandre et de Rhénanie ont créé les premiers réseaux commerciaux paneuropéens, reliant les marchands italiens aux tisserands flamands et aux commerçants hanséatiques."
 nd_eur_gothic_cathedrals: "Cathédrales gothiques"
 nd_eur_gothic_cathedrals_desc: "Les grandes cathédrales gothiques (Chartres, Cologne, Reims, Burgos) représentent le premier mouvement architectural véritablement continental d'Europe. Construits au fil des générations par des maîtres bâtisseurs errants, ils exprimaient une foi commune dans la pierre et la lumière."
 nd_eur_feudal_host: "Hôte féodal"
 nd_eur_feudal_host_desc: "Le système féodal d'obligation militaire, dans lequel les vassaux devaient le service armé à leurs seigneurs, a créé la cavalerie blindée qui a dominé les champs de bataille européens pendant des siècles."
 nd_eur_studia_generalia: "Études Générales"
 nd_eur_studia_generalia_desc: "Les universités médiévales de Bologne, Paris et Oxford, studia generalia reconnues par le pape et l’empereur, ont créé une élite intellectuelle paneuropéenne qui a transcendé les frontières, enseigné en latin et jeté les bases de l’érudition moderne."
 nd_eur_urban_communes: "Communes urbaines"
 nd_eur_urban_communes_desc: "The self-governing urban communes that flourished from the Hansa cities to the Italian city-states created a distinctly European tradition of civic autonomy, trade regulation, and bourgeois prosperity.\n\n#italic Available in: $nd_eur_trade_fair$#!"
 nd_eur_renaissance_humanism: "Humanisme de la Renaissance"
 nd_eur_renaissance_humanism_desc: "La redécouverte de l’apprentissage classique, commencée en Italie et s’étendant à tout le continent, a transformé l’art, la philosophie et la gouvernance européennes. Les érudits humanistes ont récupéré les textes de Cicéron et d'Aristote, déclenchant une révolution culturelle."
 nd_eur_banking_revolution: "Révolution bancaire"
 nd_eur_banking_revolution_desc: "Les grandes maisons bancaires (les Médicis de Florence, les Fugger d'Augsbourg, les Welser de Nuremberg) ont inventé la finance moderne. Les lettres de change, la comptabilité en partie double et les réseaux de crédit internationaux ont rendu possible le commerce continental."
 nd_eur_pike_and_shot: "Brochet et Shot"
 nd_eur_pike_and_shot_desc: "La combinaison de formations massives de brochets et d’armes à poudre a transformé la guerre européenne. Des piquiers suisses aux tercios espagnols, cette révolution tactique met fin à l'ère du chevalier cuirassé."
 nd_eur_age_of_exploration: "L'ère de l'exploration"
 nd_eur_age_of_exploration_desc: "Les marins européens (portugais, espagnols, anglais, néerlandais) ont poussé au-delà du monde connu, contournant l'Afrique, traversant l'Atlantique et faisant le tour du monde. Leurs navires ont ouvert les voies maritimes qui reliaient les continents."
 nd_eur_printing_press_revolution: "Révolution de la presse à imprimer"
 nd_eur_printing_press_revolution_desc: "Gutenberg's moveable type printing press, invented in Mainz around 1440, spread across Europe within decades. By 1500, over twenty million volumes had been printed, democratizing knowledge and fueling the Reformation, the Scientific Revolution, and the Enlightenment.\n\n#italic Available in: $nd_eur_universitas$#!"
 nd_eur_court_magnificence: "La magnificence de la cour"
 nd_eur_court_magnificence_desc: "La culture de la splendeur de la cour, depuis les cérémonies élaborées de la cour bourguignonne jusqu'au patronage des artistes par les Médicis, a établi une tradition distinctement européenne de prestige d'État exprimé à travers l'architecture, l'art et les rituels."
 nd_eur_trace_italienne: "Trace Italienne"
 nd_eur_trace_italienne_desc: "Les forteresses étoilées anguleuses et discrètes développées par les ingénieurs militaires italiens en réponse à l’artillerie à poudre ont transformé la guerre européenne. Ces fortifications, perfectionnées plus tard par Vauban, redessinèrent les frontières et prolongeèrent les sièges à travers le continent."
 nd_eur_professional_diplomacy: "Diplomatie professionnelle"
 nd_eur_professional_diplomacy_desc: "Le développement des ambassades permanentes, des ambassadeurs professionnels et du protocole diplomatique, lancé par les cités-États italiennes et affiné par la France, a créé le système européen de relations internationales qui perdure encore aujourd'hui."
 nd_eur_joint_stock_companies: "Sociétés par actions"
 nd_eur_joint_stock_companies_desc: "Les sociétés par actions, depuis la Casa di San Giorgio jusqu'aux grandes Compagnies des Indes orientales, ont permis la mise en commun des capitaux de milliers d'investisseurs. Cette innovation a financé l’exploration, la colonisation et le commerce mondial européens."
 nd_eur_military_revolution: "Révolution militaire"
 nd_eur_military_revolution_desc: "La transformation des armées européennes, des levées féodales aux formations disciplinées de brochets et de mousquets, a remodelé la guerre. Le tercio espagnol, la contre-marche néerlandaise et l’organisation régimentaire ont créé les armées professionnelles qui ont dominé le monde."
 nd_eur_cuius_regio: "Cuius Région"
 nd_eur_cuius_regio_desc: "Le principe « à qui appartient le royaume, leur religion », établi lors de la paix d'Augsbourg en 1555 et confirmé en Westphalie, était le compromis durement gagné par l'Europe après des générations de guerres de religion. Il reconnaît la diversité comme une réalité de la vie européenne."
 nd_eur_scientific_method: "Méthode scientifique"
 nd_eur_scientific_method_desc: "The systematic approach to understanding the natural world, through observation, hypothesis, and experiment, arose from the intellectual ferment of Europe's universities and academies. Galileo, Kepler, and Harvey laid the foundations of modern science.\n\n#italic Available in: $nd_eur_colonial_exchange$#!"
 nd_eur_broadside_warfare: "Guerre à grande échelle"
 nd_eur_broadside_warfare_desc: "Le développement des navires de guerre à voile armés de flanc, de la caraque au galion, a permis aux marines européennes de dominer les océans du monde. Les tactiques de ligne de bataille concentraient une puissance de feu dévastatrice dans des volées coordonnées."
 nd_eur_westphalian_order: "Ordre westphalien"
 nd_eur_westphalian_order_desc: "La Paix de Westphalie de 1648 a établi les principes fondamentaux des relations internationales européennes : la souveraineté des États, la non-ingérence dans les affaires intérieures et la résolution des différends par le biais de congrès diplomatiques."
 nd_eur_standing_armies: "Armées permanentes"
 nd_eur_standing_armies_desc: "Le passage des levées féodales et des compagnies mercenaires à des armées permanentes et professionnelles a transformé l’État européen. Des exercices uniformes, une solde régulière et des officiers professionnels ont créé les forces disciplinées qui ont façonné le monde moderne."
 nd_eur_republic_of_letters: "République des Lettres"
 nd_eur_republic_of_letters_desc: "Le réseau paneuropéen de correspondance scientifique qui a prospéré à partir du XVIIe siècle, reliant les penseurs de Londres à Constantinople. À travers des lettres, des revues et des sociétés académiques, la République des Lettres a créé une communauté supranationale de savoir."
 nd_eur_mercantilist_manufactures: "Manufactures mercantilistes"
 nd_eur_mercantilist_manufactures_desc: "L’industrialisation dirigée par l’État dans le cadre d’une politique mercantiliste a créé les manufactures royales, les arsenaux et les entreprises d’État qui ont transformé les économies européennes, depuis les usines de tapisserie de Colbert jusqu’aux usines de porcelaine de Frédéric."
 nd_eur_vauban_fortifications: "Fortifications Vauban"
 nd_eur_vauban_fortifications_desc: "Marshal Vauban's perfection of the star fortress, with its geometric bastions, covered ways, and interlocking fields of fire, represented the pinnacle of European military engineering. His siege parallels and ricochet fire took fortresses as surely as his bastions held them."
 nd_eur_baroque_splendor: "Splendeur baroque"
 nd_eur_baroque_splendor_desc: "Le mouvement baroque a balayé l'Europe, de la Rome du Bernin aux palais de Vienne et de Versailles. Ce phénomène culturel continental exprimait le pouvoir et la confiance de l’État européen à travers l’architecture monumentale, la musique et l’art."
 nd_eur_global_maritime_reach: "Portée maritime mondiale"
 nd_eur_global_maritime_reach_desc: "Les marines européennes, armées de navires de ligne à bord, ont établi le commandement des océans du monde. Des Caraïbes à la mer de Chine méridionale, la puissance maritime européenne a projeté son influence continentale sur le monde entier."
 nd_eur_enlightenment_philosophy: "Philosophie des Lumières"
 nd_eur_enlightenment_philosophy_desc: "Le siècle des Lumières, de Locke et Voltaire à Kant et Montesquieu, a révolutionné la pensée européenne. Les idées de droits naturels, de séparation des pouvoirs et de contrat social ont transformé la gouvernance à travers le continent."
 nd_eur_congress_of_nations: "Congrès des Nations"
 nd_eur_congress_of_nations_desc: "L'évolution de la diplomatie européenne de l'élaboration de traités bilatéraux au système de congrès, où les grandes puissances délibéraient collectivement sur des questions d'intérêt continental, de la Westphalie à Vienne en passant par Utrecht."
 nd_eur_grande_armee: "Grande Armée"
 nd_eur_grande_armee_desc: "Le modèle napoléonien de la grande armée, des armées citoyennes massives organisées en corps autosuffisants, combinant infanterie, cavalerie et artillerie en un seul instrument dévastateur, a redéfini la guerre européenne."
 nd_eur_academy_of_sciences_tradition: "Académie des Sciences"
 nd_eur_academy_of_sciences_tradition_desc: "Les grandes académies européennes, la Royal Society de Londres, l’Académie des Sciences de Paris, les académies de Berlin, Saint-Pétersbourg et Stockholm, ont institutionnalisé la recherche scientifique et créé l’infrastructure nécessaire au progrès des connaissances."
 nd_eur_imperial_arsenal_tradition: "Arsenal Impérial"
 nd_eur_imperial_arsenal_tradition_desc: "La production d’armement standardisée, initiée par les arsenaux de Venise, les armureries de Liège et les fonderies de canons de Suède, a donné aux armées européennes un avantage technologique qui a remodelé l’équilibre des puissances mondiales."
 nd_eur_first_rate_supremacy: "Suprématie de premier ordre"
 nd_eur_first_rate_supremacy_desc: "Le navire de ligne de premier ordre, transportant 100 canons ou plus sur trois ponts de canons, était la plate-forme d'armes mobile la plus puissante de l'histoire de l'humanité. Les chantiers navals européens ont produit ces forteresses flottantes à une échelle inégalée au monde."
 nd_eur_perpetual_peace: "Paix perpétuelle"
 nd_eur_perpetual_peace_desc: "La vision kantienne d’une paix perpétuelle à travers une fédération de républiques libres, volontaires, cosmopolites, liées par la loi universelle plutôt que par la force impériale, représente la plus haute aspiration des Lumières pour la civilisation européenne."
 nd_eur_industrial_convergence: "Convergence industrielle"
 nd_eur_industrial_convergence_desc: "La diffusion de la technologie industrielle à travers le continent, des innovations britanniques aux innovations belges, françaises, allemandes et au-delà, a créé une économie industrielle européenne intégrée reliée par les chemins de fer, les télégraphes et les normes partagées."
 STATIC_MODIFIER_NAME_nd_eur_industrial_convergence: "Convergence industrielle"
 STATIC_MODIFIER_DESC_nd_eur_industrial_convergence: "La diffusion de la technologie industrielle à travers le continent, des innovations britanniques aux innovations belges, françaises, allemandes et au-delà, a créé une économie industrielle européenne intégrée reliée par les chemins de fer, les télégraphes et les normes partagées."
 nd_eur_citizen_army: "Armée citoyenne"
 nd_eur_citizen_army_desc: "Le soulèvement massif de la Révolution française a transformé la guerre : la nation entière s'est mobilisée pour la défense, produisant des armées massives de citoyens-soldats animés par une ferveur patriotique. Chaque puissance européenne a été contrainte d’adopter une forme ou une autre de cette innovation révolutionnaire."
 nd_eur_ius_gentium: "Ius Gentium"
 nd_eur_ius_gentium_desc: "Le droit des gens d'Hugo Grotius, le ius gentium, a posé les bases du droit international moderne. Les règles régissant la guerre, la diplomatie, le commerce et les droits des peuples ont créé un cadre juridique pour l’ordre européen et mondial."
 nd_eur_continental_telegraph: "Télégraphe continental"
 nd_eur_continental_telegraph_desc: "The electric telegraph connected European capitals in minutes rather than days. This revolution in communication enabled rapid coordination of policy, trade, and military operations across the entire continent.\n\n#italic Available in: $nd_eur_continental_railway$#!"
 nd_eur_universal_education: "Éducation universelle"
 nd_eur_universal_education_desc: "L’idéal des Lumières d’éducation universelle, mis en œuvre par le biais des systèmes scolaires publics et des bibliothèques publiques, a créé les sociétés les plus alphabétisées de l’histoire de l’humanité et a jeté les bases de la modernité industrielle."
 nd_eur_ironclad_fleet: "Flotte blindée"
 nd_eur_ironclad_fleet_desc: "La transition des voiliers en bois aux navires de guerre cuirassés à vapeur a rendu obsolètes du jour au lendemain des siècles de tradition navale. Les chantiers navals européens ont mené cette transformation, produisant les flottes de combat blindées qui ont dominé les mers du monde."
 nd_eur_grand_exhibition: "Grande exposition"
 nd_eur_grand_exhibition_desc: "Les grandes expositions, au Crystal Palace de Londres en 1851, à Paris en 1855 et leurs successeurs, ont présenté au monde les réalisations de l'industrie, de la science et de l'art européens. Ils représentaient le summum de la confiance européenne dans le progrès et la civilisation."
 a_nd_eur_man_at_arms: "Homme d'armes européen"
 a_nd_eur_man_at_arms_desc: "Guerriers à cheval lourdement blindés issus de la noblesse féodale, représentant la plus belle tradition chevaleresque européenne médiévale."
 a_nd_eur_pikeman: "Piquier européen"
 a_nd_eur_pikeman_desc: "Infanterie disciplinée armée de longues piques, entraînée à tenir une formation contre les charges de cavalerie. L'épine dorsale de la révolution du brochet et du tir."
 n_nd_eur_exploration_carrack: "Caraque d'exploration"
 n_nd_eur_exploration_carrack_desc: "Un navire océanique robuste conçu pour l’exploration longue distance. Plus rapides et plus maniables que les caraques standards, ces navires ouvrent les routes maritimes vers le Nouveau Monde et les Indes orientales."
 a_nd_eur_tercio: "Tercio européen"
 a_nd_eur_tercio_desc: "Formations combinées de brochet et de mousquet, le tercio était la formation d'infanterie dominante du XVIe siècle. Ces carrés disciplinés combinaient une endurance défensive et une puissance de feu offensive."
 n_nd_eur_galleon: "Galion européen"
 n_nd_eur_galleon_desc: "Un navire de guerre océanique avancé combinant un armement lourd et une navigabilité améliorée. Le galion dominait à la fois les routes commerciales de l'Atlantique et la guerre navale à l'ère des découvertes."
 a_nd_eur_line_infantry: "Infanterie de ligne européenne"
 a_nd_eur_line_infantry_desc: "Des soldats professionnels entraînés aux tactiques linéaires, tirant des volées en rangs disciplinés. Les armées permanentes des grandes puissances européennes ont été construites sur ces formations fiables et bien entraînées."
 a_nd_eur_ricochet_battery: "Ricochet Battery"
 a_nd_eur_ricochet_battery_desc: "Siege guns served by engineers trained in the methods of Vauban. Fired with reduced charges, the shot skips along a rampart and dismounts its guns. The heavy pieces are slow on the march."
 n_nd_eur_ship_of_the_line: "Navire de ligne"
 n_nd_eur_ship_of_the_line_desc: "Un puissant navire de guerre à bord conçu pour combattre en ligne de bataille, délivrant des volées coordonnées dévastatrices. Ces navires constituaient l’épine dorsale de la marine de chaque grande puissance européenne."
 a_nd_eur_grenadier: "Grenadier européen"
 a_nd_eur_grenadier_desc: "Infanterie de choc d'élite sélectionnée pour sa taille et son courage, initialement entraînée à lancer des grenades dans les fortifications. Les compagnies de grenadiers devinrent les principales troupes d'assaut des armées européennes."
 n_nd_eur_first_rate: "Navire de premier ordre"
 n_nd_eur_first_rate_desc: "Le navire de guerre le plus grand et le plus lourdement armé à flot, un trois ponts transportant plus d'une centaine de canons. Ces forteresses flottantes étaient d'un coût prohibitif et seules les plus grandes puissances navales pouvaient se permettre de les construire et de les entretenir."
 a_nd_eur_fusilier: "Fusilier européen"
 a_nd_eur_fusilier_desc: "Les citoyens-soldats de l’Europe révolutionnaire, armés de mousquets modernes et animés d’une ferveur patriotique. Enrôlés en grand nombre, ils combattirent avec la détermination d’hommes libres défendant leur patrie."
 n_nd_eur_ironclad: "Cuirassé européen"
 n_nd_eur_ironclad_desc: "Un navire de guerre à vapeur revêtu d'une armure de fer, rendant obsolètes les marines à voile en bois. Le cuirassé représentait la pointe de l’ingénierie industrielle et navale européenne."
 nd_eur_trade_fair: "Salon professionnel"
 nd_eur_trade_fair_desc: "Une halle de marché permanente à l'intersection des principales routes commerciales, accueillant des foires saisonnières où les marchands de tout le continent échangent des marchandises, règlent leurs comptes et négocient des contrats."
 nd_eur_great_cathedral: "Grande Cathédrale"
 nd_eur_great_cathedral_desc: "Une cathédrale gothique monumentale dont les voûtes vertigineuses, les arcs-boutants et les vitraux expriment l'héritage religieux et artistique commun de la civilisation européenne."
 nd_eur_universitas: "Université"
 nd_eur_universitas_desc: "Une communauté autonome d'universitaires et d'étudiants, sur le modèle des grandes universités médiévales de Bologne, Paris et Oxford, où l'apprentissage transcende les frontières nationales."
 nd_eur_banking_house: "Maison bancaire"
 nd_eur_banking_house_desc: "Une institution financière exploitant des réseaux de crédit internationaux, émettant des lettres de change et finançant des entreprises commerciales et publiques à travers le continent."
 nd_eur_grand_palace: "Grand Palais"
 nd_eur_grand_palace_desc: "Une magnifique résidence royale de tradition baroque, servant à la fois de siège du gouvernement et de manifestation du pouvoir de l'État à travers l'architecture, les jardins et le mécénat artistique."
 nd_eur_star_fortress: "Forteresse étoilée"
 nd_eur_star_fortress_desc: "Une fortification angulaire conçue pour résister aux bombardements d'artillerie, comprenant des bastions à profil bas, de larges douves et des champs de tir imbriqués. La trace italienne, perfectionnée par Vauban."
 nd_eur_colonial_exchange: "Échange colonial"
 nd_eur_colonial_exchange_desc: "Une maison de commerce côtier où les marchandises des empires d'outre-mer sont reçues, triées et distribuées sur les marchés continentaux, les épices de l'Est, l'argent des Amériques, les fourrures du Nord."
 nd_eur_state_manufactory: "Manufacture d'État"
 nd_eur_state_manufactory_desc: "Une installation de production dirigée par l'État où des artisans qualifiés produisent des produits standardisés selon des principes mercantilistes, des tapisseries, de la porcelaine, des horloges et de la ferronnerie fine."
 nd_eur_academy_of_sciences: "Académie des Sciences"
 nd_eur_academy_of_sciences_desc: "Une société savante dédiée à l'avancement de la philosophie naturelle, des mathématiques et des arts mécaniques, sur le modèle de la Royal Society et de l'Académie des Sciences."
 nd_eur_imperial_arsenal: "Arsenal Impérial"
 nd_eur_imperial_arsenal_desc: "Une vaste usine d’armement produisant des canons, des mousquets et des munitions standardisés pour les armées et les marines d’une Europe unie."
 nd_eur_continental_railway: "Chemin de fer continental"
 nd_eur_continental_railway_desc: "Un chemin de fer reliant les villes d’Europe, permettant une circulation rapide des marchandises, des personnes et des armées à travers le continent."
 nd_eur_exhibition_hall: "Salle d'exposition"
 nd_eur_exhibition_hall_desc: "Un grand pavillon présentant les réalisations industrielles, scientifiques et artistiques de la civilisation européenne, attirant des visiteurs et du prestige du monde entier."
 nd_eur_fair_goods_processing: "Traitement équitable des marchandises"
 nd_eur_fair_goods_processing_desc: "Les artisans du salon transforment les textiles bruts en tissus finis, ajoutant de la valeur grâce aux techniques de teinture et de finition."
 nd_eur_fair_maintenance: "Entretien équitable"
 nd_eur_fair_maintenance_desc: "Entretenir les stands, les entrepôts et les installations communes du salon."
 nd_eur_cathedral_maintenance: "Entretien de la cathédrale"
 nd_eur_cathedral_maintenance_desc: "Le travail sans fin d’entretien d’une grande cathédrale, de réparation de la pierre, de remplacement du verre et de préservation de la structure du bâtiment."
 nd_eur_printed_works: "Œuvres imprimées"
 nd_eur_printed_works_desc: "Les universitaires et les imprimeurs produisent des volumes reliés de textes classiques, de traités scientifiques et d'ouvrages théologiques destinés à être distribués dans toute l'Europe."
 nd_eur_universitas_maintenance: "Entretien de l'université"
 nd_eur_universitas_maintenance_desc: "Fournir à l'université du papier, des livres et des bougies pour ses halls et ses bibliothèques."
 nd_eur_banking_maintenance: "Opérations bancaires"
 nd_eur_banking_maintenance_desc: "Tenir les grands livres, la correspondance et l'infrastructure physique d'une maison bancaire internationale."
 nd_eur_palace_maintenance: "Entretien du palais"
 nd_eur_palace_maintenance_desc: "Maintenir la grandeur d’un palais baroque nécessite un investissement constant en matériaux et en main-d’œuvre qualifiée."
 nd_eur_bastion_maintenance: "Entretien des bastions"
 nd_eur_bastion_maintenance_desc: "Entretenir les murs, les bastions, les armements et les approvisionnements de garnison d'une forteresse étoilée."
 nd_eur_scientific_instruments: "Instruments scientifiques"
 nd_eur_scientific_instruments_desc: "Des artisans qualifiés fabriquent des instruments de précision (télescopes, microscopes, outils de navigation) pour les scientifiques et les explorateurs européens."
 nd_eur_exchange_maintenance: "Entretien des échanges"
 nd_eur_exchange_maintenance_desc: "Exploiter les entrepôts, les bureaux et les quais d'une bourse coloniale."
 nd_eur_manufactory_production: "Production en usine"
 nd_eur_manufactory_production_desc: "Fabrication dirigée par l'État d'outils et d'instruments standardisés utilisant du fer, du charbon et du bois."
 nd_eur_manufactory_maintenance: "Entretien de l'usine"
 nd_eur_manufactory_maintenance_desc: "Entretenir les équipements, les approvisionnements en carburant et les stocks de matières premières d'une usine d'État."
 nd_eur_academy_maintenance: "Entretien de l'Académie"
 nd_eur_academy_maintenance_desc: "Fournir à une académie des sciences des livres, du papier et du matériel de laboratoire."
 nd_eur_arsenal_production: "Production d'Arsenal"
 nd_eur_arsenal_production_desc: "Fonderie de canons en bronze et en fer dans l'arsenal impérial, fournissant des armements standardisés aux forces européennes."
 nd_eur_arsenal_maintenance: "Entretien de l'arsenal"
 nd_eur_arsenal_maintenance_desc: "Entretenir les forges, les ateliers et les stocks d'un arsenal impérial."
 nd_eur_telegraph_relay: "Relais télégraphique"
 nd_eur_telegraph_relay_desc: "Exploiter des stations télégraphiques le long du réseau ferroviaire, permettant une communication rapide à travers le continent."
 nd_eur_railway_maintenance: "Entretien ferroviaire"
 nd_eur_railway_maintenance_desc: "Entretien des voies, ponts, gares et matériel roulant du chemin de fer continental."
 nd_eur_exhibition_maintenance: "Entretien de l'exposition"
 nd_eur_exhibition_maintenance_desc: "Entretenir les pavillons, les expositions et les terrains d'une grande salle d'exposition."
 nd_eur_formed_tt: "L'Europe est unifiée"
 nd_eur_path_a_tt: "Choisissez le destin#bold Universal Empire#!"
 nd_eur_path_b_tt: "Choisissez le Concert#bold des Souverains Destin#!"
 nd_eur_dest_arsenals_tt: "At least #bold 5#! of our locations have an #bold Imperial Arsenal#!"
 nd_eur_destiny: "Destin de l'Europe"
 nd_eur_destiny_desc: "Le continent est unifié. Maintenant vient le véritable test : quel genre de civilisation cette Europe deviendra-t-elle ? Maintenir la stabilité tout en choisissant la voie qui définira une nouvelle ère de l’histoire humaine."
 nd_eur_dest_imperium: "Imperium Monde"
 nd_eur_dest_imperium_desc: "The heirs of Rome and Charlemagne look east and south. Constantinople, Jerusalem and Alexandria, the ancient seats of empire and faith, must fall under the European aegis. Only when these storied cities bow to our banner can the Universal Empire claim its inheritance."
 nd_eur_dest_global_reach: "Impérium mondial"
 nd_eur_dest_global_reach_desc: "Europe's dominion must extend beyond the continent. With fleets that reach every sea, plant our standard in the ancient capitals of the Aztec and Chinese worlds. From Tenochtitlan to Guangzhou, European power must span every ocean and every continent."
 nd_eur_dest_pax_europaea: "Pax européenne"
 nd_eur_dest_pax_europaea_desc: "The final expression of the Universal Empire: an uncontested European peace enforced across the globe. From the Ganges to the Caribbean, from the Straits of Malacca to the Great Plains, European arms must guarantee order everywhere. Only a supreme military force, the Grande Armee of all Europe, armed from five Imperial Arsenals, can sustain such a peace."
 nd_eur_dest_common_market: "Marché commun"
 nd_eur_dest_common_market_desc: "Le Concert des Souverains commence par le commerce. Construisez un marché continental où circulent librement les produits de luxe du monde, la soie de l'Est, les tissus fins de nos propres ateliers. Une Europe liée par le commerce n’aura pas besoin de chaînes."
 nd_eur_dest_enlightened_continent: "Lumières continentales"
 nd_eur_dest_enlightened_continent_desc: "La lumière de la raison doit éclairer tous les coins du continent. Embrassez la révolution scientifique, accumulez des richesses grâce à une industrie pacifique et gagnez le prestige qui vient du fait d'être la civilisation la plus avancée du monde."
 nd_eur_dest_eternal_peace: "Paix perpétuelle"
 nd_eur_dest_eternal_peace_desc: "Le rêve de Kant devenu réalité : une fédération de peuples libres, industrialisés et éclairés, liés par la loi plutôt que par la force. Adoptez à la fois la révolution industrielle et l’armée citoyenne, non pas pour la conquête, mais comme les deux fondements d’une civilisation qui durera pour toujours."
 nd_eur.5.t: "Le destin de l'Europe"
 nd_eur.5.d: "The unification of Europe is complete, but the true work has only begun. A continent of diverse peoples, languages, and traditions stands under one banner for the first time since the fall of Rome. The manner in which we govern this unprecedented achievement will determine whether European civilization reaches its fullest potential or fragments once more into squabbling kingdoms.\n\nThe foundations have been laid. Now we must build upon them."
 nd_eur.5.a: "C'est à nous de forger le destin de l'Europe"
 nd_eur.6.t: "L'héritage de Rome"
 nd_eur.6.d: "Our armies have entered Constantinople and Jerusalem, cities that once defined the boundaries of the civilized world. The Hagia Sophia and the Church of the Holy Sepulchre now stand within our borders. What Rome began, what Charlemagne attempted, what the Crusaders dreamed of, we have accomplished.\n\nThe ancient imperial capitals are ours. The Universal Empire inherits the mantle of every imperium that came before it."
 nd_eur.6.a: "Nous sommes les héritiers de toute civilisation"
 nd_eur.7.t: "Le marché continental"
 nd_eur.7.d: "The first great achievement of the Concert of Sovereigns is not a military victory but an economic one. Silk and fine cloth flow through our capital markets, the luxury goods of the world are available to our citizens not through conquest but through commerce. Merchants from every European nation trade freely under shared laws and common standards.\n\nThis is the foundation upon which a lasting peace is built: mutual prosperity."
 nd_eur.7.a: "La prospérité liera ce que la force ne peut pas"
 nd_eur.8.t: "L'Empire mondial"
 nd_eur.8.d: "European banners fly over Tenochtitlan and Guangzhou. The great civilizations of the Americas and Asia have been brought within our sphere. The question now is how to govern these vast new possessions.\n\nShall we project our naval power across the oceans, building a maritime empire that controls the world's sea lanes? Or shall we concentrate our military might on the continental heartland, forging an invincible army that no power on earth can challenge?"
 nd_eur.8.a: "Commandez les mers et le monde suit"
 nd_eur.8.b: "Nos légions seront invincibles sur terre"
 nd_eur.9.t: "Les Lumières continentales"
 nd_eur.9.d: "The scientific revolution has taken root across Europe. Our academies, universities, and learned societies have produced an explosion of knowledge unmatched in human history. The wealth accumulated through peaceful commerce funds further discovery, and the prestige of our civilization draws scholars from every corner of the world.\n\nHow shall we channel this intellectual energy?"
 nd_eur.9.a: "Ouvrir nos marchés et construire librement"
 nd_eur.9.b: "Former une nouvelle génération de diplomates"
 nd_eur.10.t: "La Pax Europaea"
 nd_eur.10.d: "From Delhi to Temasek, from Havana to the far corners of every continent, European power is unchallenged. The greatest military force ever assembled stands ready to enforce peace across the globe. This is the apex of the Universal Empire, the Pax Europaea.\n\nBut how shall this peace be maintained? Through overwhelming offensive power that crushes all resistance? Or through the patient work of integration, absorbing conquered peoples into the European fold?"
 nd_eur.10.a: "La suprématie offensive garantit une paix durable"
 nd_eur.10.b: "Intégrer et civiliser le monde"
 nd_eur.11.t: "Paix perpétuelle"
 nd_eur.11.d: "Kant wrote of a perpetual peace achieved through a federation of free republics. We have surpassed even his vision. The Concert of Sovereigns, industrialized, enlightened, bound by shared law and mutual respect, stands as the most advanced civilization in human history.\n\nTwo final visions compete for the soul of this achievement. Shall we build an industrial paradise, governed by enlightened republican principles? Or shall we create a world congress, exporting our model of cooperative civilization to every nation on earth?"
 nd_eur.11.a: "Construire la république du progrès"
 nd_eur.11.b: "Convoquer le congrès de toutes les nations"
 STATIC_MODIFIER_NAME_nd_eur_dest_colonial_supremacy: "Suprématie coloniale"
 STATIC_MODIFIER_DESC_nd_eur_dest_colonial_supremacy: "Les marines européennes contrôlent tous les océans. Nos blocus sont incassables, nos marins inépuisables, même si le maintien d’une telle flotte met à rude épreuve nos vastes ressources."
 STATIC_MODIFIER_NAME_nd_eur_dest_continental_domination: "Domination continentale"
 STATIC_MODIFIER_DESC_nd_eur_dest_continental_domination: "L’armée européenne est la force la plus puissante au monde. De vastes levées de troupes et une cavalerie d'élite imposent la volonté impériale à travers toutes les frontières, même si le coût de ces armées alimente l'inflation."
 STATIC_MODIFIER_NAME_nd_eur_dest_universal_monarchy: "Monarchie universelle"
 STATIC_MODIFIER_DESC_nd_eur_dest_universal_monarchy: "Un seul trône commande la plus grande machine militaire du monde. Les commandants européens prennent l’initiative dans chaque engagement, leurs troupes se remettant d’un revers avec une rapidité étonnante."
 STATIC_MODIFIER_NAME_nd_eur_dest_roman_peace: "Paix romaine"
 STATIC_MODIFIER_DESC_nd_eur_dest_roman_peace: "Comme Rome avant lui, l’Empire européen absorbe les peuples conquis dans sa civilisation. L'intégration et la conversion se déroulent à une vitesse sans précédent dans un esprit d'innovation."
 STATIC_MODIFIER_NAME_nd_eur_dest_free_exchange: "Échange gratuit"
 STATIC_MODIFIER_DESC_nd_eur_dest_free_exchange: "Le Concert des souverains a réduit les barrières au commerce et à la construction à travers le continent. Les navires sont construits plus rapidement, les bâtiments coûtent moins cher et l’esprit de libre-échange prévaut."
 STATIC_MODIFIER_NAME_nd_eur_dest_diplomatic_academy: "Académie Diplomatique"
 STATIC_MODIFIER_DESC_nd_eur_dest_diplomatic_academy: "Une tradition continentale de diplomatie professionnelle a pris racine. L’annexion est gérée grâce à des négociations habiles et au prestige de la couronne, même si l’establishment diplomatique n’est pas bon marché."
 STATIC_MODIFIER_NAME_nd_eur_dest_industrial_harmony: "Harmonie industrielle"
 STATIC_MODIFIER_DESC_nd_eur_dest_industrial_harmony: "Le Concert des Souverains a réalisé ce dont rêvaient les philosophes : une république industrielle harmonieuse où progrès et liberté avancent ensemble."
 STATIC_MODIFIER_NAME_nd_eur_dest_world_congress: "Congrès mondial"
 STATIC_MODIFIER_DESC_nd_eur_dest_world_congress: "The model of European cooperation has been exported to the world. Cultural influence radiates outward while quarrels between nations are brought before the congress and settled there."
 nd_eur_imperial_command: "Commandement impérial"
 nd_eur_imperial_command_desc: "Le quartier général militaire suprême de l'Empire universel, coordonnant les armées et les garnisons à travers le monde à partir d'un seul complexe fortifié de salles de guerre, d'écuries et de tours de signalisation."
 nd_eur_congress_hall: "Salle des Congrès"
 nd_eur_congress_hall_desc: "Un grand bâtiment civique où les représentants du Concert des souverains délibèrent sur des questions de gouvernance continentale, de réglementation commerciale et d'avancement des connaissances."
 nd_eur_command_maintenance: "Maintenance des commandes"
 nd_eur_command_maintenance_desc: "Entretenir les systèmes de signalisation, les écuries, les salles de cartes et les bureaux administratifs du quartier général militaire suprême."
 nd_eur_congress_maintenance: "Entretien du congrès"
 nd_eur_congress_maintenance_desc: "Entretenir les chambres, les archives et les installations diplomatiques de la salle des congrès continentale."

 # ===== BUREAUCRACIES =====
 eur_imperial_diet_bureaucracy: "Régime Impérial"
 eur_imperial_diet_bureaucracy_desc: "Sur le modèle du Reichstag du Saint Empire romain germanique (1495-1806), une assemblée permanente permanente d'électeurs, de princes et de villes impériales libres qui légiférait par consensus des domaines plutôt que par décret impérial. Le précédent fédéral le plus durable du continent : légiférer par la voix consultative des grandes chambres."
 eur_aulic_council_bureaucracy: "Conseil aulique"
 eur_aulic_council_bureaucracy_desc: "Sur le modèle du Reichshofrat établi par Maximilien Ier en 1497 et codifié par Ferdinand Ier en 1559, la cour suprême personnelle de l'empereur statue sur les conflits féodaux et les sujets impériaux immédiats. Il a contourné le Reichskammergericht des domaines et concentré l'autorité judiciaire au sein de l'exécutif."
 eur_concert_of_powers_bureaucracy: "Concert des pouvoirs"
 eur_concert_of_powers_bureaucracy_desc: "Sur le modèle du système de Vienne de 1814-1815, où Castlereagh, Metternich et le tsar Alexandre Ier ont construit un directoire à cinq pouvoirs pour gérer les conflits continentaux par le congrès plutôt que par la guerre. Le Concert a soutenu l’ordre post-napoléonien de 1815 à 1914 grâce à la diplomatie aristocratique au prix de la répression des mouvements nationalistes et populaires."
 eur_hanseatic_chamber_bureaucracy: "Chambre hanséatique"
 eur_hanseatic_chamber_bureaucracy_desc: "Sur le modèle du Hansetag tenu à Lübeck à partir de 1356, où les représentants des villes marchandes délibéraient sur les différends douaniers, les privilèges étrangers et l'application collective des mesures contre les contrevenants. Un corps fédéral de villes commerçantes plutôt que de dynasties, gouverné à l'unanimité par les conseils wendes, westphaliens et livoniens de Drittel."
 eur_ecumenical_council_bureaucracy: "Conseil œcuménique"
 eur_ecumenical_council_bureaucracy_desc: "Sur le modèle de la tradition conciliaire catholique : Constance (1414-1418) met fin au schisme d'Occident, Trente (1545-1563) codifie la Contre-Réforme. Les évêques de toute la chrétienté latine se sont réunis pour légiférer sur une doctrine et une discipline contraignantes pour l’ensemble du continent, véritable précédent le plus durable pour l’autorité délibérative à l’échelle européenne."
 eur_continental_parliament_bureaucracy: "Parlement continental"
 eur_continental_parliament_bureaucracy_desc: "Sur le modèle de l'Essai vers la paix présente et future de l'Europe de William Penn de 1693, qui proposait une Diète européenne assise autour d'une table ronde pour prévenir les querelles de préséance, avec des délégués répartis en fonction de la valeur annuelle de la production de chaque État. Affiné par De la réorganisation de Saint-Simon en 1814, qui insistait sur une classe civique alphabétisée comme électorat naturel du Parlement."
 eur_monetary_union_bureaucracy: "Union monétaire"
 eur_monetary_union_bureaucracy_desc: "Sur le modèle de l'Union monétaire latine du 23 décembre 1865, qui liait la France, la Belgique, l'Italie et la Suisse à un franc bimétallique partagé à 4,5 grammes d'argent fin. Les pièces des membres circulaient librement à travers les frontières, mais l'étalon bimétallique s'est avéré fragile face aux chocs du prix de l'argent, préfigurant les tensions centrales de chaque fédération monétaire ultérieure."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_eur_bureaucracy_authority: "Autorité bureaucratique fédérale"
 AUTO_MODIFIER_DESC_nd_eur_bureaucracy_authority: "On formation, Europe gains the authority to host pan-European federal institutions, drawn from the historical precedents of imperial diets, ecumenical councils, the Concert of Europe, the Hanseatic League, and the Enlightenment-era proposals for a continental parliament. Four bureaucracy slots are open for them."
