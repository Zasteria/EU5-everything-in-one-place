l_french:
 # Formation Event, The Birth of the Baltic Nation
 nd_lva.1.t: "La naissance de la nation balte"
 nd_lva.1.d: "The scattered Baltic tribes (Curonians, Samogitians, Semigallians, Latgalians, Old Prussians) have at last been united under a single banner. For centuries, these peoples have shared a language, a faith in the sacred groves, and a stubborn refusal to bow before foreign invaders. The Northern Crusaders broke themselves against our forest fortresses; the Amber Road carried our wealth to the courts of Europe. Now the question is: what kind of nation shall we become?\n\nThe sacred groves of Romuva still burn with the eternal flame, calling us to preserve our ancient ways and defend our forest homeland. But the amber-rich coast beckons too, promising wealth and influence for those bold enough to take to the sea.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_lva.1.a: "Gardez les bosquets sacrés et les anciennes voies"
 nd_lva.1.b: "Réclamez la domination sur la Côte d'Ambre"

 # Formation Choice Modifiers
 STATIC_MODIFIER_NAME_nd_guardians_of_the_sacred_groves: "Gardiens des Bosquets Sacrés"
 STATIC_MODIFIER_DESC_nd_guardians_of_the_sacred_groves: "Les peuples baltes tirent leur force de leurs forêts anciennes et de leurs bosquets sacrés. Aucune armée croisée n’a conquis ce que protègent les arbres."
 STATIC_MODIFIER_NAME_nd_lords_of_the_amber_coast: "Seigneurs de la Côte d'Ambre"
 STATIC_MODIFIER_DESC_nd_lords_of_the_amber_coast: "Les Courlandais étaient autrefois appelés les Vikings baltes en raison de leur maîtrise de la mer. Aujourd’hui, un peuple balte uni transforme cet héritage maritime en un empire commercial."

 # DHE Event 2, The Battle of Saule
 nd_lva.2.t: "La bataille de Saule"
 nd_lva.2.d: "En 1236, au passage marécageux près de Saule, les Samogitiens et leurs alliés de Courlande rencontrèrent au combat les Frères de l'Épée de Livonie. Les croisés, alourdis par de lourdes armures dans le terrain marécageux, furent détruits presque entièrement. Leur Grand Maître Volkwin tomba aux côtés de cinquante chevaliers : la pire défaite jamais subie par les ordres de croisades baltes. Les restes des Sword Brothers furent absorbés par l’Ordre Teutonique, mais la leçon perdura : les peuples baltes ne se soumettraient pas facilement. Nos guerriers portent la mémoire de Saule dans leur sang."
 nd_lva.2.a: "Les forêts se souviennent de Saule"

 # DHE Event 3, The Sacred Flame of Romuva
 nd_lva.3.t: "La Flamme Sacrée de Romuva"
 nd_lva.3.d: "Au cœur des terres baltes, au cœur d’une chênaie sacrée, brûle un feu qui ne s’est jamais éteint. Le Kriwe-Kriwajto, le plus grand prêtre de tous les peuples baltes, entretient cette flamme comme un pont entre les vivants et les morts. Alors que toutes les autres traditions païennes en Europe sont tombées sur la Croix, la foi Romuva perdure. Notre peuple dépose encore des offrandes sur les pierres sacrées, murmure toujours aux esprits de la forêt, marque toujours le changement des saisons avec des rites anciens qui sont antérieurs de plusieurs millénaires au christianisme. Il ne s’agit pas là d’une simple superstition : c’est le noyau spirituel de l’identité balte."
 nd_lva.3.a: "La flamme brûle éternellement"

 # DHE Event 4, The Amber Road Ascendancy
 nd_lva.4.t: "L’ascendant de la Route de l’Ambre"
 nd_lva.4.d: "L'ambre de la Baltique (les larmes dorées du soleil, comme l'appelaient les anciens) est commercialisé depuis l'âge du bronze. Depuis les rives de Curonie et de Sambie, l'ambre voyageait vers le sud le long des routes fluviales jusqu'à la Méditerranée, vers l'est jusqu'aux cours de Byzance et à l'ouest jusqu'aux ateliers de Bruges. Aujourd’hui, grâce à l’union des tribus baltes, nous contrôlons entièrement la source de cette précieuse denrée. Nous pouvons dicter nos conditions à chaque marchand qui recherche notre ambre, mais devons-nous resserrer notre emprise sur le commerce lui-même, ou utiliser notre position pour attirer les marchands vers nos côtes et profiter du flux ?"
 nd_lva.4.a: "Contrôlez les routes commerciales de l'ambre"
 nd_lva.4.b: "Faire de nos ports la porte orange"

 # DHE Event 5, The Baltic Confederation
 nd_lva.5.t: "La Confédération Baltique"
 nd_lva.5.d: "L’unification des peuples baltes s’est forgée dans le creuset d’une lutte commune contre les ordres croisés. Mais maintenant que la menace extérieure s’est éloignée, la question de la gouvernance devient urgente. Les Samogitiens, les Courlandais, les Latgaliens et les Prussiens ont chacun leurs propres traditions, leurs propres chefs, leur propre sentiment d'identité. Devrions-nous forger une autorité centrale forte, capable d’orienter les ressources de tous les pays baltes vers un objectif commun ? Ou faut-il honorer l’autonomie de chaque tribu, en créant une confédération où les coutumes et libertés locales sont préservées ?"
 nd_lva.5.a: "Un seul dirigeant pour tous les peuples baltes"
 nd_lva.5.b: "Une confédération de tribus libres"

 # DHE Timed Modifiers
 STATIC_MODIFIER_NAME_nd_saule_victory: "Victoire à Saule"
 STATIC_MODIFIER_DESC_nd_saule_victory: "La défaite écrasante des Frères de l'Épée de Livonie à Saule en 1236 fait écho à la tradition martiale balte."
 STATIC_MODIFIER_NAME_nd_sacred_flame_of_romuva: "La Flamme Sacrée de Romuva"
 STATIC_MODIFIER_DESC_nd_sacred_flame_of_romuva: "La flamme éternelle du bosquet sacré de Romuva lie les peuples baltes à leurs ancêtres et à leur foi ancienne."
 STATIC_MODIFIER_NAME_nd_amber_road_dominance: "Domination de la route ambre"
 STATIC_MODIFIER_DESC_nd_amber_road_dominance: "En contrôlant les routes commerciales de l’ambre, nous dictons le flux de l’or du Nord à travers l’Europe."
 STATIC_MODIFIER_NAME_nd_amber_road_monopoly: "Passerelle Ambre"
 STATIC_MODIFIER_DESC_nd_amber_road_monopoly: "Nos ports sont devenus la première destination des marchands en quête d’ambre baltique, attirant ainsi richesse et commerce vers nos côtes."
 STATIC_MODIFIER_NAME_nd_confederation_centralize: "Autorité balte centralisée"
 STATIC_MODIFIER_DESC_nd_confederation_centralize: "Un gouvernement central fort oriente les ressources de tous les pays baltes vers un objectif commun."
 STATIC_MODIFIER_NAME_nd_confederation_federalize: "Fédération tribale balte"
 STATIC_MODIFIER_DESC_nd_confederation_federalize: "La confédération préserve l'autonomie et les coutumes de chaque tribu balte tout en les unissant contre les menaces extérieures."

 # Variable Tooltips (for destiny system)
 nd_lva_formed_tt: "La nation balte est formée."
 nd_lva_path_a_tt: "Nous avons choisi de garder les bosquets sacrés."
 nd_lva_path_b_tt: "Nous avons choisi de revendiquer la Côte d'Ambre."

 # Advances
 nd_lva_romuva_worship: "Culte de Romuva"
 nd_lva_romuva_worship_desc: "Les bosquets sacrés des peuples baltes, où brûle la flamme éternelle et où le Kriwe-Kriwajto communie avec les esprits des morts."
 nd_lva_curonian_warriors: "Guerriers de Courlande"
 nd_lva_curonian_warriors_desc: "Les Courlandais, redoutés sous le nom de Vikings baltes, apportent leur féroce tradition guerrière à l'armée balte unifiée."
 nd_lva_amber_crafting: "Fabrication d'ambre"
 nd_lva_amber_crafting_desc: "Les artisans baltes transforment l'ambre brut en bijoux, amulettes et objets décoratifs prisés dans toute l'Europe."
 nd_lva_forest_warfare: "Guerre forestière"
 nd_lva_forest_warfare_desc: "Les forêts denses des pays baltes sont à la fois le foyer et la forteresse de leurs peuples, qui connaissent chaque chemin et chaque clairière."
 nd_lva_hill_fort_tradition: "Tradition du fort de la colline"
 nd_lva_hill_fort_tradition_desc: "The pilskalns, Baltic hilltop fortifications of earthworks and timber, have defended these lands for centuries."
 nd_lva_honey_wax_economy: "Économie du miel et de la cire"
 nd_lva_honey_wax_economy_desc: "The vast bee forests of the Baltic region produce honey and beeswax in quantities that supply churches across Western Europe.\n\n#italic Available in: $nd_lva_amber_workshop$#!"
 nd_lva_tribal_assembly: "Assemblée tribale"
 nd_lva_tribal_assembly_desc: "Le rassemblement des chefs baltes pour régler les différends, allouer les ressources et coordonner la défense contre les ennemis communs."
 nd_lva_amber_road: "La route de l'Ambre"
 nd_lva_amber_road_desc: "L’ancienne route commerciale transportant l’ambre de la Baltique vers le sud jusqu’à la Méditerranée et vers l’est jusqu’à Byzance atteint de nouveaux sommets de prospérité."
 nd_lva_curonian_seafaring: "Navigation en Courlande"
 nd_lva_curonian_seafaring_desc: "Les Courlandais maîtrisaient la construction navale et la navigation dans la tradition viking, menant des raids jusqu'au Danemark et en Suède."
 nd_lva_sacred_fire: "Le feu sacré"
 nd_lva_sacred_fire_desc: "La dernière tradition païenne d’Europe perdure dans les pays baltes, où brûle encore la flamme sacrée de Romuva."
 nd_lva_crusader_resistance: "Résistance des croisés"
 nd_lva_crusader_resistance_desc: "Des décennies de guerre contre les ordres teutonique et livonien ont fait des peuples baltes des défenseurs endurcis."
 nd_lva_forest_products: "Commerce des produits forestiers"
 nd_lva_forest_products_desc: "Les fourrures, le miel, la cire, le goudron et le bois de la Baltique circulent vers l'ouest le long des réseaux commerciaux établis vers les marchés hanséatiques."
 nd_lva_samogitian_cavalry: "Cavalerie samogitienne"
 nd_lva_samogitian_cavalry_desc: "Les cavaliers de Samogitie, maîtres de la guérilla en terrain forestier, forment la force de frappe mobile de l'armée balte."
 nd_lva_baltic_confederation: "Confédération Baltique"
 nd_lva_baltic_confederation_desc: "L'unification politique des diverses tribus baltes en une seule structure gouvernementale."
 nd_lva_coastal_vigilance: "Vigilance côtière"
 nd_lva_coastal_vigilance_desc: "Baltic tar distilleries support coastal defense, producing vital stores for shipbuilding and fortification while watchtowers guard the shoreline.\n\n#italic Available in: $nd_lva_amber_workshop$#!"
 nd_lva_pagan_resurgence: "Résurgence païenne"
 nd_lva_pagan_resurgence_desc: "Une renaissance des pratiques religieuses baltes traditionnelles réaffirme l’identité culturelle des peuples baltes."
 nd_lva_baltic_trade_network: "Réseau commercial balte"
 nd_lva_baltic_trade_network_desc: "Les comptoirs commerciaux fortifiés le long de la côte baltique créent un réseau commercial unifié rivalisant avec celui de la Hanse."
 nd_lva_amber_monopoly: "Monopole d'Ambre"
 nd_lva_amber_monopoly_desc: "Le contrôle total des principaux gisements d'ambre du monde confère à la nation balte un énorme levier économique."
 nd_lva_forest_doctrine: "Doctrine militaire forestière"
 nd_lva_forest_doctrine_desc: "Centuries of forest warfare are codified into formal military doctrine, with specialized garrisons in the hill forts.\n\n#italic Available in: $nd_lva_pilskalns$#!"
 nd_lva_cultural_preservation: "Préservation culturelle"
 nd_lva_cultural_preservation_desc: "Efforts délibérés pour protéger les langues, traditions et coutumes baltes de l’assimilation par les puissances voisines."
 nd_lva_modern_baltic_army: "Armée balte moderne"
 nd_lva_modern_baltic_army_desc: "Une armée professionnelle combinant des tactiques modernes avec la tradition balte de la guerre forestière."
 nd_lva_national_awakening: "Réveil national"
 nd_lva_national_awakening_desc: "L’émergence d’une conscience nationale balte, inspirée des idéaux des Lumières et de la redécouverte du patrimoine antique."
 nd_lva_industrial_forestry: "Foresterie industrielle"
 nd_lva_industrial_forestry_desc: "Modernized methods of timber harvesting and naval stores production supply the Baltic trading posts.\n\n#italic Available in: $nd_lva_amber_workshop$#!"
 nd_lva_modern_commerce: "Commerce balte moderne"
 nd_lva_modern_commerce_desc: "L’intégration des ports baltes dans les réseaux commerciaux européens modernes transforme l’économie côtière."

 # Units
 a_nd_lva_curonian_raider: "Pillards de Courlande"
 a_nd_lva_curonian_raider_desc: "De féroces fantassins venus de la côte de Courlande, redoutés dans toute la Baltique comme les Vikings baltes pour leurs prouesses en matière de raid."
 n_nd_lva_curonian_longship: "Drakkar de Courlande"
 n_nd_lva_curonian_longship_desc: "Un navire rapide et à faible tirant d'eau construit dans la tradition viking par des charpentiers navals de Courlande. Excellent pour les raids côtiers et les blocus."
 a_nd_lva_samogitian_horse: "Cheval léger samogitien"
 a_nd_lva_samogitian_horse_desc: "Cavalerie rapide venue des hauts plateaux boisés de Samogitie, maître des tactiques de délit de fuite contre les chevaliers en armure."
 a_nd_lva_baltic_riflemen: "Fusiliers baltes"
 a_nd_lva_baltic_riflemen_desc: "Infanterie professionnelle combinant une mousqueterie moderne avec des siècles d'expertise dans le combat forestier."

 # Buildings
 nd_lva_sacred_grove: "Bosquet sacré"
 nd_lva_sacred_grove_desc: "Un bosquet consacré de chênes centenaires où brûle la flamme éternelle de Romuva et où le Kriwe-Kriwajto accomplit des rites ancestraux."
 nd_lva_amber_workshop: "Atelier Ambre"
 nd_lva_amber_workshop_desc: "Un atelier où les artisans baltes transforment l'ambre brut en bijoux, objets religieux et pièces décoratives destinés à l'exportation."
 nd_lva_pilskalns: "Pilskalns"
 nd_lva_pilskalns_desc: "Une fortification baltique au sommet d'une colline composée de terrassements et de palissades en bois, conçue pour exploiter le terrain naturel contre les envahisseurs."
 nd_lva_ostseehandel: "Poste de traite baltique"
 nd_lva_ostseehandel_desc: "Une station commerciale côtière fortifiée où l'ambre, les fourrures, le miel et la cire sont échangés avec des marchands étrangers."

 # Production Methods
 nd_lva_sacred_grove_maintenance: "Entretien du bosquet sacré"
 nd_lva_sacred_grove_maintenance_desc: "L’entretien du bosquet sacré nécessite des offrandes de cire d’abeille, du bois pour la flamme éternelle et du bétail pour les sacrifices rituels."
 nd_lva_amber_jewelry: "Production de bijoux en ambre"
 nd_lva_amber_jewelry_desc: "L'ambre de la Baltique est sculpté et poli pour fabriquer des bijoux, des amulettes et des pièces ornementales prisées dans toute l'Europe."
 nd_lva_wax_leather_trade: "Commerce de cire et de cuir"
 nd_lva_wax_leather_trade_desc: "Transformation de la cire d'abeille et des fourrures en articles de cuir finis et en cire de bougie destinés à l'exportation vers les marchés occidentaux."
 nd_lva_tar_distillation: "Distillation du goudron"
 nd_lva_tar_distillation_desc: "Production de goudron à partir des forêts de pins de la Baltique pour la construction navale, l'imperméabilisation et l'exportation."
 nd_lva_amber_workshop_maintenance: "Entretien d'atelier"
 nd_lva_amber_workshop_maintenance_desc: "Outils et matières premières nécessaires au maintien de l'atelier d'ambre opérationnel."
 nd_lva_forest_garrison: "Garnison forestière"
 nd_lva_forest_garrison_desc: "Une garnison spécialisée entraînée à la guerre forestière, équipée de chevaux pour une réponse rapide et d'armes pour les tactiques d'embuscade."
 nd_lva_pilskalns_maintenance: "Garnison du fort"
 nd_lva_pilskalns_maintenance_desc: "Du bois, de la pierre et des armes pour entretenir le fort et équiper sa garnison."
 nd_lva_baltic_naval_stores: "Magasins navals de la Baltique"
 nd_lva_baltic_naval_stores_desc: "Transformation du bois de pin de la Baltique et du goudron en fournitures navales destinées à l'exportation vers les pays constructeurs navals de toute l'Europe."
 nd_lva_ostseehandel_maintenance: "Entretien du poste de traite"
 nd_lva_ostseehandel_maintenance_desc: "Du bois, des fourrures et de la cire d'abeille pour stocker et entretenir le poste de traite baltique."

 # Levies
 levy_nd_lva_curonian_raider: "Prélèvement des pillards de Courlande"
 levy_nd_lva_curonian_raider_desc: "De féroces fantassins de la côte de Courlande élevés grâce au système de prélèvement tribal."
 levy_nd_lva_samogitian_horse: "Prélèvement sur les chevaux légers samogitiens"
 levy_nd_lva_samogitian_horse_desc: "Des cavaliers rapides venus des hautes terres boisées de Samogitie, servant de bras de cavalerie à la levée baltique."

 # ===== DESTINY LOCALIZATION =====

 # Destiny Advance Names and Descriptions
 nd_lva_destiny: "Destin de la nation balte"
 nd_lva_destiny_desc: "Les peuples baltes se sont unis. Maintenant commence le véritable test : cette nation va-t-elle perdurer et grandir, ou s'effondrer sous le poids des ambitions de ses voisins ?"

 nd_lva_dest_sacred_frontier: "La frontière sacrée"
 nd_lva_dest_sacred_frontier_desc: "Les terres à l’est de notre patrie sont des terrains contestés entre Romuva et la chrétienté. Sécurisez Polotsk et Vitebsk pour ancrer la frontière sacrée."

 nd_lva_dest_pagan_kingdom: "Le royaume païen"
 nd_lva_dest_pagan_kingdom_desc: "Placer la grande ville de Kyiv sous domination balte et adopter une gouvernance méritocratique. Laissons les orthodoxes voir ce que la sagesse païenne peut construire."

 nd_lva_dest_eternal_flame: "La flamme éternelle"
 nd_lva_dest_eternal_flame_desc: "The last pagan kingdom in Europe must become its mightiest. Vilnius, where the eternal fire burns, is to be built up into a great capital, and Moscow and Smolensk conquered to break Christian hegemony once and for all."
 nd_lva_dest_vilnius_developed_tt: "We own #bold Vilnius#! and its development is at least #bold 45#!"

 nd_lva_dest_amber_coast: "La Côte d'Ambre"
 nd_lva_dest_amber_coast_desc: "La Ligue hanséatique s’est enrichie du commerce balte. Prenez Lübeck, le cœur de leur réseau, et redirigez cette richesse vers notre côte."

 nd_lva_dest_baltic_command: "Commandez la Baltique"
 nd_lva_dest_baltic_command_desc: "Contrôlez le carrefour du commerce de la mer Baltique en prenant Visby sur Gotland et la capitale suédoise à Stockholm."

 nd_lva_dest_mare_balticum: "Jument Balticum"
 nd_lva_dest_mare_balticum_desc: "Make the Baltic Sea a Baltic lake. Take Copenhagen to control the Sound, build up Konigsberg on the Sambian amber shore, and ensure amber flows through our markets to all of Europe."
 nd_lva_dest_konigsberg_developed_tt: "We own #bold Konigsberg#! and its development is at least #bold 43#!"

 # Destiny DHE Event, Root
 nd_lva.6.t: "Destin de la nation balte"
 nd_lva.6.d: "The Baltic nation stands at the threshold of greatness. We have united the Curonians, Samogitians, Prussians, and Latgalians under a single banner, a feat that seemed impossible when the crusading orders first marched into our forests. But unification was only the beginning. The great powers of Europe still look upon us as a barbarian curiosity, a pagan anachronism that will soon fall to the march of civilization. We shall prove them wrong."
 nd_lva.6.a: "Notre destin est à nous de le forger"

 # Destiny DHE Event, Path A Stage 1
 nd_lva.7.t: "La frontière sacrée"
 nd_lva.7.d: "Nos guerriers ont poussé vers l’est jusqu’aux frontières ruthènes, plantant le chêne sacré là où se dressait autrefois seule la croix. Polotsk et Vitebsk, anciennes villes de la route commerciale de la Dvina, répondent désormais à l'autorité balte. Les prêtres de Romuva suivent nos soldats, ravivant les anciennes coutumes dans des terres qui les avaient oubliées. La frontière entre le monde balte païen et la chrétienté orthodoxe s’est déplacée de manière décisive en notre faveur."
 nd_lva.7.a: "Les chênes sacrés poussent là où se trouvait autrefois la croix"

 # Destiny DHE Event, Path A Stage 2
 nd_lva.8.t: "Le royaume païen"
 nd_lva.8.d: "La prise de Kyiv provoque une onde de choc dans la chrétienté. La mère de toutes les villes de la Russie, berceau de la civilisation orthodoxe en Orient, arbore désormais la bannière d'un roi païen. Les chroniqueurs de toute l’Europe écrivent sur cet événement avec autant d’horreur que de fascination. Pour les peuples baltes, c’est une justification : la preuve que les anciens dieux n’ont pas abandonné ceux qui ont gardé la foi. Mais comment allons-nous gouverner ce vaste royaume ? Avec la main de fer d’un conquérant, ou avec la sagesse d’un peuple qui a survécu par adaptation ?"
 nd_lva.8.a: "Que les vieux dieux marchent vers l'est"
 nd_lva.8.b: "On endure en pliant sans se casser"

 # Destiny DHE Event, Path A Stage 3
 nd_lva.9.t: "La flamme éternelle"
 nd_lva.9.d: "Moscou est tombée. Smolensk est tombé. Les deux piliers de la puissance militaire orthodoxe du nord ont été placés sous la domination du dernier royaume païen d’Europe. La flamme éternelle de Romuva, que les croisés avaient juré d'éteindre, brûle maintenant plus fort que jamais : sa lumière est visible, métaphoriquement, depuis les murs de chaque capitale chrétienne. C’est l’apogée de la puissance balte, le moment où l’impossible devient réalité. La question est maintenant de savoir de quel genre d’empire il s’agira : celui de guerriers invaincus ou celui de sagesse éclairée ?"
 nd_lva.9.a: "Nous sommes la flamme qui ne s'éteint jamais"
 nd_lva.9.b: "La sagesse brûle plus fort que n'importe quelle épée"

 # Destiny DHE Event, Path B Stage 1
 nd_lva.10.t: "La Côte d'Ambre"
 nd_lva.10.d: "Lübeck, la reine de la Hanse, a été humiliée. Pendant des siècles, les marchands allemands se sont enrichis en contrôlant le flux des marchandises baltes (notre ambre, nos fourrures, notre cire d’abeille) vers les marchés occidentaux, en payant une fraction de leur vraie valeur. Plus maintenant. Avec Lübeck sous notre contrôle, l’ensemble du réseau commercial hanséatique doit compter avec la puissance balte. L'ambre qui échoue sur nos côtes enrichira nos trésors, pas ceux des marchands étrangers."
 nd_lva.10.a: "Le commerce de l'ambre appartient à la Baltique"

 # Destiny DHE Event, Path B Stage 2
 nd_lva.11.t: "Commandez la Baltique"
 nd_lva.11.d: "Gotland et Stockholm sont à nous. L'île de Gotland, ancien carrefour du commerce balte où se rassemblaient autrefois les commerçants vikings, sert aujourd'hui de base navale baltique commandant les voies maritimes. Stockholm, clé des eaux scandinaves, ouvre les routes du Nord à nos marchands. La tradition maritime de Courlande, autrefois considérée comme une simple piraterie, est devenue la fondation d'un empire maritime. La mer Baltique est en train de devenir notre mer."
 nd_lva.11.a: "Règle les vagues avec du fer et du chêne"
 nd_lva.11.b: "Construisez une ligue d'ambre et d'argent"

 # Destiny DHE Event, Path B Stage 3
 nd_lva.12.t: "Jument Balticum"
 nd_lva.12.d: "Copenhague est tombée, et avec elle, le contrôle du Danish Sound, le passage étroit entre la Baltique et la mer du Nord. Tous les navires qui traversent ces détroits naviguent désormais sous notre tolérance. De Lübeck à Stockholm, de Gotland à Copenhague, la mer Baltique est un lac Baltique. Le commerce de l'ambre, autrefois un modeste flux de larmes d'or transporté vers le sud par des marchands patients, est devenu un torrent de richesse qui coule à travers nos kontors. Les descendants des Vikings de Courlande ont bâti un empire non seulement basé sur la conquête, mais aussi sur le commerce, le matelotage et la générosité dorée de la mer."
 nd_lva.12.a: "La mer Baltique est notre empire"
 nd_lva.12.b: "Les rois d'ambre n'ont pas besoin de couronne mais du commerce"

 # Destiny Timed Modifiers
 STATIC_MODIFIER_NAME_nd_lva_dest_romuva_ascendant: "Ascendant Romuva"
 STATIC_MODIFIER_DESC_nd_lva_dest_romuva_ascendant: "La vieille foi avance là où la croix recule. Nos ingénieurs de siège abattent les murs des forteresses chrétiennes avec une juste fureur."
 STATIC_MODIFIER_NAME_nd_lva_dest_pagan_resilience: "La résilience païenne"
 STATIC_MODIFIER_DESC_nd_lva_dest_pagan_resilience: "Les peuples baltes ont survécu aux croisades, aux famines et aux épidémies. Cette résilience soutient désormais notre royaume en pleine croissance."
 STATIC_MODIFIER_NAME_nd_lva_dest_flame_unconquered: "La flamme invaincue"
 STATIC_MODIFIER_DESC_nd_lva_dest_flame_unconquered: "Aucune armée n'a éteint la flamme sacrée. Nos guerriers portent son esprit au combat : rapide, implacable et invincible."
 STATIC_MODIFIER_NAME_nd_lva_dest_flame_enlightened: "La flamme illuminée"
 STATIC_MODIFIER_DESC_nd_lva_dest_flame_enlightened: "La sagesse de la flamme sacrée illumine tous les peuples sous notre domination. L'intégration et l'apprentissage fleurissent dans le royaume païen."
 STATIC_MODIFIER_NAME_nd_lva_dest_sea_dominion: "Domination maritime"
 STATIC_MODIFIER_DESC_nd_lva_dest_sea_dominion: "Nos navires de guerre commandent les vagues de la Baltique. Le coût de l’entretien de l’armée et de la flotte met à rude épreuve le trésor, mais la mer est à nous."
 STATIC_MODIFIER_NAME_nd_lva_dest_trade_league: "Ligue commerciale balte"
 STATIC_MODIFIER_DESC_nd_lva_dest_trade_league: "Un réseau de comptoirs commerciaux baltes remplace le système hanséatique, canalisant le commerce via nos ports et nos entrepôts."
 STATIC_MODIFIER_NAME_nd_lva_dest_amber_empire: "Empire d'Ambre"
 STATIC_MODIFIER_DESC_nd_lva_dest_amber_empire: "De Lübeck à Copenhague, le commerce de l'ambre traverse un empire maritime baltique doté d'une puissance navale inégalée."
 STATIC_MODIFIER_NAME_nd_lva_dest_merchant_princes: "Princes marchands de la Baltique"
 STATIC_MODIFIER_DESC_nd_lva_dest_merchant_princes: "L’élite marchande de la côte baltique est devenue des princes, sauf le nom, leur richesse en ambre achetant la paix et l’influence à travers l’Europe."

 # Destiny Buildings
 nd_lva_romuva_temple: "Temple de Romuva"
 nd_lva_romuva_temple_desc: "Un grand complexe de temples en pierre abritant la flamme éternelle de Romuva, où le Kriwe-Kriwajto préside en tant qu'autorité spirituelle suprême de tous les peuples baltes."
 nd_lva_amber_kontor: "Ambre Kontor"
 nd_lva_amber_kontor_desc: "Une grande maison de commerce balte contrôlant le commerce de l'ambre, calquée sur les kontors hanséatiques mais servant les intérêts baltes plutôt que allemands."

 # Destiny Production Methods
 nd_lva_temple_maintenance: "Entretien du temple"
 nd_lva_temple_maintenance_desc: "De la cire d'abeille pour la flamme éternelle, du bois pour les structures sacrées, de la pierre pour les murs du temple et du bétail pour les offrandes rituelles."
 nd_lva_kontor_maintenance: "Entretien du Kontor"
 nd_lva_kontor_maintenance_desc: "Ambre, tissu, papier et outils pour entretenir la maison de commerce et ses opérations commerciales."

 # Bureaucracies
 AUTO_MODIFIER_NAME_nd_lva_bureaucracy_authority: "Hospodarship lituanien"
 AUTO_MODIFIER_DESC_nd_lva_bureaucracy_authority: "The Grand Duchy's hospodar inherits a working apparatus: the Council of Lords, the chancellery's Ruthenian Metrica, the voivodes of Vilnius and Trakai, the Hetman's command. Three bureaucracy slots formalise the Duchy's standing organs of state."

 lva_ponu_taryba_bureaucracy: "Ponou Taryba"
 lva_ponu_taryba_bureaucracy_desc: "Le Conseil des Seigneurs (Ponu Taryba, Rada Litewska dans la chancellerie polonaise) s'est cristallisé dans les années 1430 à partir du conseil informel du Grand-Duc et a été légalisé par le privilège d'Alexandre Jagellon de 1492. À partir de ce moment-là, le Grand-Duc ne pouvait plus mener de politique étrangère, nommer un voïvode ou révoquer un haut fonctionnaire sans le consentement du Conseil. Les postes inférieurs devaient être pourvus en présence des voïvodes de Vilnius et de Trakai. Les bancs étaient occupés par les grandes maisons de magnats catholiques (Radvilos, Gotautai, Kesgailos, Olelkoviciai) faisant du Conseil la voix institutionnelle de la classe sénatoriale lituanienne."

 lva_lietuvos_statutai_bureaucracy: "Lietuvos Statutai"
 lva_lietuvos_statutai_bureaucracy_desc: "Les trois Statuts lituaniens (1529, 1566, 1588) ont codifié le droit du Grand-Duché un demi-siècle avant que la Pologne n'obtienne un équivalent. Rédigé à la chancellerie ruthène de Vilnius, le Premier Statut fut scellé sous Sigismond Ier à l'initiative du Conseil des Lords ; la Seconde, considérablement élargie, entra en vigueur sous Sigismond Auguste ; la Troisième fut confirmée par Sigismond III Vasa le 28 janvier 1588 et resta en vigueur dans les provinces lituaniennes jusqu'au XIXe siècle. Les Statuts liaient le privilège des boyards à la procédure royale et donnaient aux juristes de la chancellerie une profession active."

 lva_vaivadijos_pavietai_bureaucracy: "Vaivadijos ir Pavietai"
 lva_vaivadijos_pavietai_bureaucracy_desc: "Après l'Union de Horodlo en 1413, le Grand-Duché adopta le modèle administratif polonais du voïvode et du châtelain, que les réformes de Sigismond Auguste de 1565-66 ont mûri en treize palatinats et leurs powiats constituants. Chacun était dirigé par un voïvode qui convoquait le prélèvement régional et présidait son sejmik, avec un starosta administrant les domaines de la couronne et dispensant la haute justice. La cour du château (Pilies Teismas) de Vilnius et les tribunaux correspondants dans les chefs-lieux ont entraîné la noblesse du duché dans un système procédural de style polonais tout en gardant intacte l'administration foncière lituanienne."

 lva_lietuvos_metrika_bureaucracy: "Lietuvos Metrika"
 lva_lietuvos_metrika_bureaucracy_desc: "La Metrica lituanienne était le registre continu de la chancellerie de tous les privilèges, jugements, traités et concessions de terres du Grand-Duché, conservé depuis la fin du XIVe siècle dans la chancellerie ruthène de Vilnius. Plus de 600 livres datent d'avant 1697, année où le polonais et le latin ont finalement supplanté le ruthène comme langue de travail de la chancellerie du Commonwealth. Les scribes lettrés qui maintenaient la Metrica étaient issus de la noblesse orthodoxe ruthène, de la classe bourgeoise catholique et du clergé de la cathédrale de Vilnius : la mémoire institutionnelle du duché."

 lva_didysis_etmonas_bureaucracy: "Didysis Etmonas"
 lva_didysis_etmonas_bureaucracy_desc: "La fonction de Grand Hetman de Lituanie (didysis etmonas, hetman wielki litewski) fut instituée le 11 septembre 1497 avec la nomination du prince Konstanty Ostrogski, vainqueur des Tatars à Ochakiv. Le Grand Hetman commandait les armées de campagne du duché en guerre, supervisait les fortifications frontalières et les garnisons en paix et publiait des ordonnances militaires contraignantes; un Field Hetman (lauko etmonas) suppléait sur le terrain. Le poste était occupé à vie et presque toujours par les grandes maisons de magnats (Ostrogski, Radvila, Sapieha, Chodkiewicz) fusionnant le commandement militaire du duché avec son élite sénatoriale."

 lva_vilniaus_akademija_bureaucracy: "Académie de Vilniaus"
 lva_vilniaus_akademija_bureaucracy_desc: "Le 1er avril 1579, le roi Stephen Bthory accorda une lettre de privilège élevant le Collège des Jésuites de Vilnius (fondé en 1570 à l'invitation de l'évêque Valerijonas Protasevicius) au rang de studium generale à part entière; Le pape Grégoire XIII confirma la fondation en octobre. C'était la troisième université du royaume polono-lituanien après l'Académie de Cracovie et l'Albertina, et la seule du Grand-Duché. Les maîtres jésuites de Vilnius formèrent les juristes de la chancellerie, le clergé de la cathédrale et la prochaine génération de fils de magnats à l'apprentissage du latin et à la théologie de la Contre-Réforme."
