l_french:
 STATIC_MODIFIER_NAME_nd_path_of_pope: "Le chemin de la pop"
 STATIC_MODIFIER_DESC_nd_path_of_pope: "Dans l’esprit de Pop, le leader Tewa qui a uni les pueblos contre la tyrannie espagnole, le Pueblo Uni embrasse la tradition guerrière. Aucune puissance étrangère ne soumettra à nouveau ces terres."
 STATIC_MODIFIER_NAME_nd_path_of_the_kiva: "Chemin de la Kiva"
 STATIC_MODIFIER_DESC_nd_path_of_the_kiva: "La kiva perdure sous la terre comme elle l'a toujours fait. Grâce aux cérémonies, aux connaissances sacrées et aux liens du clan et de la moitié, le Pueblo Uni préservera ses anciennes coutumes et s'épanouira dans la sagesse."
 nd_pue.1.t: "Le Pueblo Uni se lève"
 nd_pue.1.d: "For generations, the peoples of the desert Southwest have lived in their multistory adobe settlements, Keres at Acoma and Laguna, Tanoan speakers along the Rio Grande, Zuni in their ancient stronghold, Hopi on the distant mesas. Each pueblo governed itself through councils of elders and clan mothers, united by the kachina traditions that bind earth to sky. Now, for the first time, the pueblos have chosen to stand together as one nation. The question before the council is not whether to unite, but what the United Pueblo shall become. Some invoke the memory of Popé, whose knotted cord once rallied every pueblo against a common enemy. Others speak of the kiva: the underground heart where knowledge is preserved and the ceremonies that sustain the world are performed. Both paths lead to strength, but of different kinds.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_pue.1.a: "Nous serons comme Pop, inflexibles dans la défense de notre peuple."
 nd_pue.1.b: "La kiva perdure. Notre force découle de la tradition sacrée."
 STATIC_MODIFIER_NAME_nd_pue_revolt_spirit_unified: "Esprit de révolte, d'unité"
 STATIC_MODIFIER_DESC_nd_pue_revolt_spirit_unified: "Le soulèvement coordonné a transformé les pueblos en une seule force combattante, prête à défendre leur patrie contre tout agresseur."
 STATIC_MODIFIER_NAME_nd_pue_revolt_spirit_restored: "Esprit de la Révolte, Restauration"
 STATIC_MODIFIER_DESC_nd_pue_revolt_spirit_restored: "Avec la destruction des autels étrangers et la remise en lumière des masques kachina, les anciennes traditions ont retrouvé la place qui leur revient."
 STATIC_MODIFIER_NAME_nd_pue_turquoise_road_wealth: "Route Turquoise, Commerce"
 STATIC_MODIFIER_DESC_nd_pue_turquoise_road_wealth: "La renaissance des anciennes routes commerciales turquoise apporte de la richesse à travers les ateliers et les marchés des pueblos."
 STATIC_MODIFIER_NAME_nd_pue_turquoise_road_prestige: "Route Turquoise, Prestige"
 STATIC_MODIFIER_DESC_nd_pue_turquoise_road_prestige: "La pierre bleu-vert distinctive des pueblos est devenue une marque de statut et de sophistication à travers les réseaux commerciaux, élevant le nom du Pueblo."
 nd_pue.2.t: "Le cordon noué"
 nd_pue.2.d: "In the summer of 1680, the leader Popé sent runners to every pueblo carrying knotted cords. Each knot marked a day remaining until the coordinated uprising against Spanish colonial rule. When the cords ran out, the pueblos rose as one. Popé, a Tewa medicine man from Ohkay Owingeh who had been flogged and imprisoned for practicing the old religion, had built a secret alliance spanning hundreds of miles, from Taos in the north to the Hopi mesas far to the west. The revolt killed four hundred Spaniards and drove the remaining two thousand settlers south to El Paso. For twelve years, the pueblos governed themselves, tearing down churches, restoring kivas, and reviving the kachina ceremonies that the Spanish had tried to destroy. It was the most successful indigenous uprising against European colonialism in the Americas.\n\nThe spirit of that day lives on. How shall we honor the legacy of Popé and the warriors who fought beside him?"
 nd_pue.2.a: "La corde nouée nous lie encore : notre unité est notre arme."
 nd_pue.2.b: "Nous nous sommes battus pour restaurer nos voies sacrées. Laissez-les fleurir à nouveau."
 nd_pue.3.t: "La route des turquoises"
 nd_pue.3.d: "Long before the pueblos bore their current names, the ancient peoples of Chaco Canyon built a trade network spanning hundreds of miles. Over fifty thousand pieces of turquoise have been found in the walls of Pueblo Bonito alone, more than at every other archaeological site in the Southwest combined. The blue-green stone traveled along roads remarkably straight and wide, connecting outlying communities to the ceremonial center. Macaw feathers came north from Mesoamerica; shells arrived from the Pacific coast; copper bells from distant workshops.\n\nThough Chaco itself fell silent centuries ago, the knowledge of these roads and the art of turquoise working never vanished. The pueblo artisans of Keres, Zuni, and Hopi maintain the tradition, cutting and polishing stone with techniques passed down through generations. The revival of these trade connections offers a choice."
 nd_pue.3.a: "La turquoise est la richesse. Laissez le commerce circuler et enrichir notre peuple."
 nd_pue.3.b: "La turquoise est un héritage. Laissez sa beauté parler notre nom au monde."
 nd_pue.4.t: "La danse des Kachinas"
 nd_pue.4.d: "Deep in the subterranean kiva, the masked dancers have emerged. The kachina ceremony (the cycle of dances that brings rain to the fields, health to the people, and harmony between the living and the spirits) has reached its full expression across the United Pueblo. In the western pueblos, Hopi and Zuni dancers wear elaborately carved and painted masks representing hundreds of different kachina spirits, each with a specific role in the cosmic order. In the eastern pueblos along the Rio Grande, the ceremonies take on their own character, blending with the moiety system that divides each community into complementary halves.\n\nThe kachina tradition is more than religion. It is the mechanism by which newcomers are integrated into pueblo life, disputes are settled through ritual rather than violence, and the agricultural calendar is maintained. The emergence of the dancers from the kiva is the emergence of order from chaos, of community from scattered families."
 nd_pue.4.a: "Les Kachinas dansent. Le monde est renouvelé."
 nd_pue_defensive_architecture: "Architecture défensive des Pueblos"
 nd_pue_defensive_architecture_desc: "Les constructeurs ancestraux Pueblo ont construit des complexes en pisé à plusieurs étages sans portes ni fenêtres au rez-de-chaussée. L'entrée se faisait via des échelles passant par des trappes de toit, qui pouvaient être relevées lors d'attaques."
 nd_pue_desert_archery: "Tir à l'arc dans le désert"
 nd_pue_desert_archery_desc: "Les guerriers à l'arc Pueblo ont développé des techniques adaptées au paysage aride, utilisant le terrain des mesas, des canyons et des arroyos pour obtenir un avantage défensif maximal."
 nd_pue_acequia_irrigation: "Irrigation Acequia"
 nd_pue_acequia_irrigation_desc: "Des canaux d'irrigation communaux alimentés par gravité détournaient l'eau du Rio Grande et de ses affluents vers les champs de maïs, de haricots, de courges, de coton et de tabac."
 nd_pue_kiva_tradition: "Tradition Kiva"
 nd_pue_kiva_tradition_desc: "La kiva, une chambre cérémonielle souterraine, servait de cœur religieux, politique et social de chaque pueblo, où les connaissances sacrées étaient préservées et transmises."
 nd_pue_turquoise_trade: "Commerce des turquoises"
 nd_pue_turquoise_trade_desc: "Les artisans Pueblo ont hérité des traditions de travail de la turquoise du Chaco Canyon, produisant des ornements, des pendentifs et des objets incrustés destinés au commerce dans tout le sud-ouest et au-delà."
 nd_pue_clan_governance: "Gouvernance des clans"
 nd_pue_clan_governance_desc: "Les communautés Pueblo étaient gouvernées par des systèmes de clans et de moitiés imbriqués. Les décisions étaient prises par des conseils d'anciens représentant chaque clan, garantissant la stabilité par consensus."
 nd_pue_multistory_pueblos: "Pueblos à plusieurs étages"
 nd_pue_multistory_pueblos_desc: "Les architectes de Pueblo ont perfectionné les techniques de construction de complexes d'appartements de quatre et cinq étages en adobe et en grès, abritant des centaines de familles dans des communautés intégrées."
 nd_pue_pottery_mastery: "Maîtrise de la poterie Pueblo"
 nd_pue_pottery_mastery_desc: "Les traditions distinctives de poterie noir sur blanc et polychrome des pueblos ont atteint de nouveaux sommets artistiques, chaque village développant des styles reconnaissables."
 nd_pue_communal_militia: "Milice communale"
 nd_pue_communal_militia_desc: "La défense des Pueblo était organisée selon le système des moitiés, chaque moitié de la communauté étant chargée d'élever et de former des guerriers pour protéger la colonie."
 nd_pue_waffle_gardens: "Jardins de gaufres"
 nd_pue_waffle_gardens_desc: "Les Zuni ont perfectionné le jardin de gaufres, des plates-bandes encaissées entourées de murs bas en terre qui captaient et conservaient l'humidité précieuse du paysage aride."
 nd_pue_kachina_ceremonies: "Cérémonies Kachina"
 nd_pue_kachina_ceremonies_desc: "Le cycle élaboré de danses masquées kachina représentait des centaines d’êtres spirituels, chacun lié à des aspects spécifiques de la pluie, de la fertilité, de la guérison et de l’ordre cosmique."
 nd_pue_pueblo_trade_fairs: "Foires de Pueblo"
 nd_pue_pueblo_trade_fairs_desc: "Les rassemblements saisonniers dans les principaux pueblos servaient de foires commerciales où poteries, turquoises, textiles en coton, produits alimentaires et marchandises provenant de régions lointaines changeaient de mains."
 nd_pue_warrior_societies: "Sociétés de guerriers"
 nd_pue_warrior_societies_desc: "Chaque pueblo entretenait des sociétés guerrières liées à la tradition kachina. Les initiés ont suivi une formation rigoureuse et une préparation aux cérémonies avant de servir de gardiens de la communauté."
 nd_pue_mesa_scouts_tradition: "Tradition scoute de Mesa"
 nd_pue_mesa_scouts_tradition_desc: "Des coureurs et des éclaireurs rapides entraînés à naviguer sur le vaste terrain désertique entre les pueblos, servant à la fois de messagers et de forces de reconnaissance contre les menaces qui approchent."
 nd_pue_oral_traditions: "Traditions orales"
 nd_pue_oral_traditions_desc: "Les récits sacrés, les connaissances astronomiques, les calendriers agricoles et la mémoire historique ont été préservés grâce à des traditions orales élaborées transmises des anciens aux initiés au sein des kivas."
 nd_pue_cotton_weaving: "Tissage de coton"
 nd_pue_cotton_weaving_desc: "Les tisserands Pueblo cultivaient le coton dans des champs irrigués et produisaient des textiles d'une qualité remarquable, en utilisant des teintures naturelles et des motifs complexes, tant pour l'usage domestique que pour le commerce."
 nd_pue_inter_pueblo_council: "Conseil inter-pueblo"
 nd_pue_inter_pueblo_council_desc: "À mesure que les pueblos se rapprochaient, les représentants de chaque communauté ont commencé à se réunir en conseil formel pour coordonner la défense, gérer les ressources en eau partagées et régler les différends."
 nd_pue_mesa_fortification: "Fortification de Mesa"
 nd_pue_mesa_fortification_desc: "Les Hopi et d'autres pueblos de l'ouest ont construit leurs colonies au sommet de mesas abruptes, créant des forteresses naturelles accessibles uniquement par des sentiers escarpés et étroits, facilement défendus contre tout attaquant."
 nd_pue_pueblo_revolt: "La révolte des Pueblos"
 nd_pue_pueblo_revolt_desc: "En 1680, Pop of Ohkay Owingeh organisa le soulèvement indigène le plus réussi de l'histoire américaine, coordonnant des attaques dans des dizaines de pueblos pour chasser la domination coloniale espagnole."
 nd_pue_spiritual_restoration: "Restauration spirituelle"
 nd_pue_spiritual_restoration_desc: "Après la révolte, Pop a voyagé de pueblo en pueblo pour ordonner la destruction des églises, la restauration des kivas et la reprise des cérémonies kachina interdites."
 nd_pue_guerrilla_tactics: "Tactiques de guérilla"
 nd_pue_guerrilla_tactics_desc: "La révolte a démontré la maîtrise des Pueblos dans la guérilla, les attaques simultanées, la terre brûlée et l'exploitation du terrain désertique qu'aucune armée étrangère ne pouvait parcourir."
 nd_pue_horse_adoption: "Adoption de chevaux"
 nd_pue_horse_adoption_desc: "The Spanish retreat left behind horses that transformed Pueblo mobility. Herds are kept and bred beside the pueblos, and Pueblo warriors quickly master mounted warfare, combining it with their existing knowledge of desert combat."
 nd_pue_confederacy: "Confédération des Pueblos"
 nd_pue_confederacy_desc: "L'alliance multi-pueblo forgée par la révolte de Pop (couvrant Tewa, Tiwa, Towa, Keres, Zuni et Hopi) a prouvé que les pueblos autonomes pouvaient agir comme une nation unifiée lorsque la survie l'exigeait."
 nd_pue_trade_restoration: "Restauration du commerce"
 nd_pue_trade_restoration_desc: "Avec la levée des restrictions coloniales, les réseaux commerciaux traditionnels entre les pueblos et avec les peuples voisins ont été reconstruits, rétablissant le flux de turquoise, de poterie, de textiles et de produits alimentaires."
 nd_pue_unified_council: "Conseil unifié"
 nd_pue_unified_council_desc: "Un conseil permanent de représentants de tous les pueblos a formalisé les alliances ad hoc de l’époque de la révolte en une institution permanente de gouvernance collective."
 nd_pue_enduring_resistance: "Résistance durable"
 nd_pue_enduring_resistance_desc: "Le souvenir de la révolte et des douze années d’autonomie qui ont suivi ont inculqué une tradition de résistance disciplinée et inflexible à toute menace extérieure."
 nd_pue_advanced_irrigation: "Irrigation avancée"
 nd_pue_advanced_irrigation_desc: "Des réseaux d'acequia étendus, des barrages de contrôle améliorés et des techniques raffinées de gestion de l'eau ont permis aux pueblos de subvenir aux besoins de populations plus importantes dans le sud-ouest aride."
 nd_pue_artistic_renaissance: "Renaissance artistique des villages"
 nd_pue_artistic_renaissance_desc: "New pottery styles, finer inlay of shell and turquoise, and the weaving of wool from Spanish sheep marked a flowering of Pueblo artistic expression."
 nd_pue_mounted_tradition: "Tradition du guerrier monté"
 nd_pue_mounted_tradition_desc: "L'adoption de chevaux de la retraite espagnole a donné naissance à une nouvelle tradition de guerre à cheval dans le désert, combinant la connaissance du terrain par les Pueblo et la mobilité de la cavalerie."
 nd_pue_diplomatic_pragmatism: "Pragmatisme diplomatique"
 nd_pue_diplomatic_pragmatism_desc: "Les dirigeants Pueblo ont appris à monter les puissances coloniales les unes contre les autres, à obtenir des conditions favorables par la négociation et à maintenir leur autonomie grâce à une diplomatie astucieuse plutôt que par la seule force."
 nd_pue_sovereignty: "Souveraineté des Pueblos"
 nd_pue_sovereignty_desc: "L'affirmation de l'identité nationale Pueblo (le droit à l'autonomie gouvernementale, à l'intégrité territoriale et à l'autodétermination culturelle) comme une question de principe établi plutôt que d'aspiration."
 nd_pue_cultural_preservation: "Préservation culturelle"
 nd_pue_cultural_preservation_desc: "Face à la modernisation et aux pressions extérieures, les pueblos se sont engagés à préserver délibérément la langue, les cérémonies, les traditions artisanales et le régime foncier communal."
 nd_pue_modern_economy: "Peace with the Comanche"
 nd_pue_modern_economy_desc: "By the peace of 1786 the Comanche cease to raid the pueblos and come to trade instead. Hides, horses and trade metal are exchanged for maize, blankets and turquoise, and from 1821 wagons from Missouri come down the trail to Santa Fe."
 nd_pue_land_rights: "Droits à la terre et à l'eau"
 nd_pue_land_rights_desc: "Garantir la reconnaissance formelle du régime foncier communal et des droits ancestraux sur l’eau le long du Rio Grande et de ses affluents, garantissant ainsi le fondement matériel de la vie des Pueblo."
 nd_pue_confederal_constitution: "Constitution confédérale"
 nd_pue_confederal_constitution_desc: "Un cadre écrit codifiant les relations entre les pueblos autonomes, établissant des institutions communes tout en préservant le droit de chaque communauté à l'autonomie gouvernementale."
 nd_pue_standing_army: "Armée permanente"
 nd_pue_standing_army_desc: "The evolution of Pueblo warrior societies into a professional defense force, combining traditional knowledge of desert warfare with modern military organization. Each pueblo keeps a company under its war captain, ready to join the others on campaign."
 a_nd_pue_bow_warriors: "Guerriers à l'arc Pueblo"
 a_nd_pue_bow_warriors_desc: "Archers du désert expérimentés qui exploitent les mesas, les canyons et les arroyos du sud-ouest, ces guerriers défendent les colonies de pueblo avec une précision mortelle."
 a_nd_pue_revolt_warriors: "Guerriers de la révolte"
 a_nd_pue_revolt_warriors_desc: "Des guérilleros inspirés par l'esprit du soulèvement de Pop de 1680, spécialisés dans les embuscades coordonnées et l'exploitation du terrain désertique."
 a_nd_pue_pueblo_levy: "Guerriers Pueblo Levy"
 a_nd_pue_pueblo_levy_desc: "Milices communales issues des colonies de pueblos grâce au système des moitiés. Des défenseurs obstinés qui se battent le plus durement pour protéger leurs maisons."
 a_nd_pue_kachina_guardians: "Gardiens Kachina"
 a_nd_pue_kachina_guardians_desc: "Guerriers d'élite issus des sociétés de guerriers cérémoniaux, sanctifiés par le rituel kachina. Leur présence sur le champ de bataille inspire un courage extraordinaire."
 a_nd_pue_mesa_scouts: "Éclaireurs de Mesa"
 a_nd_pue_mesa_scouts_desc: "Des coureurs rapides du désert qui parcourent les vastes distances entre les pueblos, servant d'éclaireurs et de messagers. Ils connaissent chaque canyon, arroyo et source d’eau cachée."
 a_nd_pue_mounted_warriors: "Guerriers montés Pueblo"
 a_nd_pue_mounted_warriors_desc: "Cavalerie Pueblo formée dans la tradition de la guerre dans le désert, alliant connaissance ancestrale du terrain et mobilité des chevaux acquise après la retraite espagnole."
 a_nd_pue_war_captains_company: "War Captain's Company"
 a_nd_pue_war_captains_company_desc: "The contingent a pueblo sends to a joint campaign under its own war captain. A few dozen men who march a dry country on little and do not break, as the pueblo companies did on every expedition against the raiders of the plains."
 nd_pue_kiva: "Kiva"
 nd_pue_kiva_desc: "Une salle cérémonielle souterraine où se déroulent les danses sacrées, les décisions politiques sont prises et les traditions orales qui lient la communauté sont transmises à chaque nouvelle génération."
 nd_pue_turquoise_workshop: "Atelier Turquoises"
 nd_pue_turquoise_workshop_desc: "Un centre artisanal où la turquoise, les coquillages et le cuivre sont transformés en pendentifs, perles et ornements incrustés en utilisant des techniques héritées des maîtres artisans du Chaco Canyon."
 nd_pue_granary: "Grenier Pueblo"
 nd_pue_granary_desc: "Salles communes de stockage de nourriture au sein du complexe en pisé à plusieurs étages, étanches à la vermine et à l'humidité. Le grenier partagé garantit qu’aucune famille n’a faim lorsque la récolte est mauvaise."
 nd_pue_fortress: "Forteresse de Pueblo"
 nd_pue_fortress_desc: "Un complexe défensif en adobe à plusieurs étages sans entrée au niveau du sol. L'accès se fait par une échelle via des trappes de toit qui peuvent être relevées en quelques instants, transformant l'ensemble de la structure en forteresse."
 nd_pue_pottery_workshop: "Atelier de poterie"
 nd_pue_pottery_workshop_desc: "Un centre de production de céramiques Pueblo noir sur blanc et polychromes, où les artisans façonnent, peignent et brûlent la poterie en utilisant des techniques raffinées au fil des siècles."
 nd_pue_cotton_hall: "Salle de tissage du coton"
 nd_pue_cotton_hall_desc: "Un centre de production textile Pueblo où le coton cultivé dans des champs irrigués est filé et tissé en utilisant des colorants naturels et des motifs géométriques complexes."
 nd_pue_watchtower: "Tour de guet de Mesa"
 nd_pue_watchtower_desc: "Une tour d'observation en pierre perchée au sommet d'une mesa, faisant partie d'un réseau de stations de signalisation qui permet aux pueblos de coordonner leur défense sur de vastes distances."
 nd_pue_trade_fair: "Parc des Expositions"
 nd_pue_trade_fair_desc: "Un lieu de rassemblement saisonnier où les pueblos et les peuples voisins échangent des poteries, des turquoises, des textiles en coton, des produits alimentaires et des marchandises provenant des réseaux commerciaux."
 nd_pue_horse_herd: "Horse Herd"
 nd_pue_horse_herd_desc: "A herd bred from the horses left behind in 1680 and pastured beside the pueblo. What the pueblo does not ride is traded on to the peoples of the plains."
 nd_pue_kiva_ceremonies: "Offrandes pour la cérémonie du Kiva"
 nd_pue_kiva_ceremonies_desc: "Le cycle régulier des danses kachina et des rituels de purification nécessite des bougies en cire d'abeille, de l'encens et des récipients en argile utilisés comme offrandes sacrées."
 nd_pue_turquoise_processing: "Lapidaire Turquoise"
 nd_pue_turquoise_processing_desc: "Turquoise is cut, ground and polished into beads, pendants and inlay with stone and copper tools."
 nd_pue_granary_upkeep: "Entretien du grenier"
 nd_pue_granary_upkeep_desc: "Maintenir les greniers communaux en bon état nécessite du bois pour les poutres, de la pierre pour le plâtre en adobe et des outils pour les réparations en cours."
 nd_pue_fortress_maintenance: "Entretien de la forteresse"
 nd_pue_fortress_maintenance_desc: "Les murs massifs en pisé doivent être constamment entretenus contre l'érosion, nécessitant de la pierre pour les réparations, du bois pour le support structurel et des outils pour le travail."
 nd_pue_pottery_firing: "Cuisson de poterie"
 nd_pue_pottery_firing_desc: "L'argile locale est façonnée, peinte avec des pigments minéraux et cuite dans des fours extérieurs soigneusement gérés pour produire les céramiques Pueblo noir sur blanc et polychromes distinctives."
 nd_pue_cotton_processing: "Transformation du coton"
 nd_pue_cotton_processing_desc: "Les fibres de coton cultivées dans les champs irrigués sont filées, teintes avec des pigments minéraux et végétaux et tissées pour obtenir des tissus d'une qualité remarquable."
 nd_pue_watchtower_upkeep: "Entretien de la tour de guet"
 nd_pue_watchtower_upkeep_desc: "Les tours de guet au sommet mesa nécessitent du bois pour le remplacement des poutres, de la pierre pour les réparations structurelles et des outils pour maintenir les postes d'observation en bon état de fonctionnement."
 nd_pue_trade_fair_costs: "Approvisionnement pour salons"
 nd_pue_trade_fair_costs_desc: "L'organisation des foires commerciales saisonnières nécessite du bétail pour les festins communautaires, de la poterie comme marchandise d'échange et du sel pour la conservation des aliments et le troc."
 nd_pue_waffle_garden_upkeep: "Garden Tending"
 nd_pue_waffle_garden_upkeep_desc: "The clay walls of the cells are remade each spring, and water is carried to them in jars through the dry months."
 nd_pue_horse_breeding: "Horse Breeding"
 nd_pue_horse_breeding_desc: "Breeding stock is kept on maize through the winter, and the foals are broken for the war captain or driven to the trade fairs."
 nd_pue_waffle_garden: "Waffle Garden"
 nd_pue_waffle_garden_desc: "The Zuni kitchen garden: sunken squares walled with clay that hold what little rain falls, each one watered by hand from a jar. It feeds a pueblo where a field would fail."
 nd_pue_silverwork: "Shell and Turquoise Inlay"
 nd_pue_silverwork_desc: "Shell carried up from the Gulf of California is cut and drilled into beads, and turquoise is set into it in mosaic for pendants and ear ornaments."
 levy_nd_pue_kachina_guardians: "Prélèvement des gardiens Kachina"
 levy_nd_pue_kachina_guardians_desc: "Guerriers d'élite issus des sociétés cérémonielles, élevés lorsque le pueblo est confronté à une menace existentielle."
 levy_nd_pue_pueblo_levy: "Prélèvement de la milice Pueblo"
 levy_nd_pue_pueblo_levy_desc: "Milice communautaire issue des colonies de pueblo, organisée selon le système traditionnel des moitiés."
 nd_pue_modern_crafts: "Trade Metal Ornaments"
 nd_pue_modern_crafts_desc: "Copper and brass got in trade are hammered into bracelets and pendants and worn beside turquoise."
 nd_pue_formed_tt: "United Pueblo a été formé"
 nd_pue_path_a_tt: "Choisissez la voie de la pop"
 nd_pue_path_b_tt: "Choisissez le chemin de la Kiva"
 nd_pue_dest_fortresses_tt: "At least #bold 3#! of our locations have a #bold Pueblo Fortress#!"
 nd_pue_dest_watchtowers_tt: "At least #bold 5#! of our locations have a #bold Mesa Watchtower#!"
 nd_pue_destiny: "Destin du Pueblo Uni"
 nd_pue_destiny_desc: "Les pueblos sont unis. Une fois la stabilité assurée, le conseil doit décider de la voie à suivre : que ce soit grâce à la force de l'héritage du pape ou à la sagesse de la kiva."
 nd_pue_dest_warpath: "Le chemin de la guerre"
 nd_pue_dest_warpath_desc: "Secure the lands of the Dine and the Nde. No people who threaten the pueblos shall remain unchallenged on the borders of our homeland. Bring Dinetah and the Apache heartland under Pueblo control, and raise three pueblos into fortresses."
 nd_pue_dest_warchiefs: "Conseil des chefs de guerre"
 nd_pue_dest_warchiefs_desc: "The great canyon of the Colorado and the eastern plains must fall under Pueblo authority. The war chiefs call the men of every pueblo into the communal militia, and the neighbors learn respect."
 nd_pue_dest_turquoise_eagle: "L'aigle turquoise"
 nd_pue_dest_turquoise_eagle_desc: "The eagle soars over the entire Southwest. Bring the Mojave crossing, the Akimel heartland, and the southern hunting grounds into the confederation. Only a chain of watchtowers on five mesas can hold such an empire."
 nd_pue_dest_sacred_way: "La Voie Sacrée"
 nd_pue_dest_sacred_way_desc: "Les danseurs kachina d'Orayvi ont conservé les cérémonies les plus anciennes. Amenez les mesas Hopi dans la confédération et créez la richesse nécessaire au maintien des traditions sacrées."
 nd_pue_dest_artisan_age: "L'ère des artisans"
 nd_pue_dest_artisan_age_desc: "La poterie Pueblo est prisée dans les réseaux commerciaux. Veiller à ce que la poterie circule sur nos marchés, remplir la trésorerie et adopter de nouvelles méthodes bancaires pour financer la renaissance artisanale."
 nd_pue_dest_eternal_kiva: "La Kiva éternelle"
 nd_pue_dest_eternal_kiva_desc: "Build the Great Kiva, a ceremonial center worthy of a nation. Secure Halona Idiwana, fill the coffers, earn the world's respect, and embrace the written word to preserve sacred knowledge for all time."
 nd_pue.5.t: "Le destin du Pueblo Uni"
 nd_pue.5.d: "Les feux du conseil brûlent vivement dans chaque pueblo, du Rio Grande aux lointaines mesas. Pour la première fois de mémoire d’homme, les communautés autonomes ont choisi d’agir comme une seule nation. Les anciens ont débattu, les mères de clan ont parlé et la décision est prise. Le Pueblo Uni perdurera, mais son destin reste à écrire. Le chemin choisi lors de la formation se déroule maintenant devant nous."
 nd_pue.5.a: "Notre destin nous attend."
 nd_pue.6.t: "Sentier de guerre des Pueblos"
 nd_pue.6.d: "Les guerriers du Pueblo Uni ont sécurisé les zones frontalières. Dinetah, patrie des Dine, et le territoire Apache au sud tombent désormais sous la protection de la confédération. Le cordon noué du Pape ne lie pas seulement les pueblos aux pueblos, mais s'étend vers l'extérieur pour englober tous ceux qui souhaitent vivre en paix sous l'autorité du conseil. Ceux qui pillent nos champs et menacent notre peuple ont été mis au pas."
 nd_pue.6.a: "Les frontières sont sécurisées."
 nd_pue.7.t: "La Voie Sacrée s'ouvre"
 nd_pue.7.d: "Les mesas Hopi (Orayvi, Walpi, Shungopavi) ont rejoint la confédération, apportant avec eux les traditions kachina les plus anciennes et les plus élaborées du Sud-Ouest. Le trésor s'agrandit à mesure que la turquoise et la poterie circulent dans les réseaux commerciaux. La Voie Sacrée s'étend vers l'avant : un chemin de sagesse, de cérémonie et d'accumulation patiente de richesses et de connaissances."
 nd_pue.7.a: "Les danseurs kachina nous accueillent."
 nd_pue.8.t: "Conseil de guerre du désert"
 nd_pue.8.d: "The war chiefs of every pueblo have gathered in council. The confederation's warriors have pushed beyond the heartland, seizing the great canyon and the eastern plains. The militia of every pueblo answers the call. Now the council must decide how to press the advantage. Some advocate raids deep into enemy territory, enriching the pueblos with captured goods. Others urge the construction of a defensive network (watchtowers and mesa fortresses) to hold what has been won."
 nd_pue.8.a: "Nous faisons un raid. Le butin renforcera notre peuple."
 nd_pue.8.b: "Nous fortifions. Le désert lui-même sera notre bouclier."
 nd_pue.9.t: "La Renaissance artisanale des Pueblos"
 nd_pue.9.d: "The workshops of the United Pueblo are flourishing. Pottery painted with ancient symbols, turquoise set in shell, cotton woven in intricate patterns: Pueblo artisanship has become a source of wealth and pride. Banking institutions now finance the artisan guilds. The council must decide how to direct this renaissance. Some advocate expanding trade networks to bring Pueblo goods to distant markets. Others wish to attract foreign scholars and artisans, absorbing new techniques while preserving the core traditions."
 nd_pue.9.a: "Nos métiers seront connus sur tous les marchés."
 nd_pue.9.b: "Nous apprendrons de tous les peuples."
 nd_pue.10.t: "L'aigle turquoise"
 nd_pue.10.d: "The confederation now stretches from the Mojave crossing in the west to the plains in the east, from the great canyon in the north to the Akimel lands in the south. Signal fires pass from mesa to mesa across it. The turquoise eagle (symbol of Pueblo power and the desert sky) flies over an empire. The council must decide the character of this new power. Shall the United Pueblo be a war eagle, striking fear into all who oppose it? Or shall its strength be the unbreakable endurance that has sustained the pueblos for centuries?"
 nd_pue.10.a: "Nous sommes l'aigle de guerre. Personne ne s’opposera à nous."
 nd_pue.10.b: "Nous endurons. C'est notre plus grande force."
 nd_pue.11.t: "La Kiva éternelle"
 nd_pue.11.d: "Le Grand Kiva est complet : un centre cérémoniel monumental qui ne ressemble à rien de ce qui a été construit depuis l'époque du Chaco Canyon. Sous terre, dans la chambre sacrée, les danseurs kachina exécutent les cérémonies qui renouvellent le monde. Ci-dessus, des scribes consignent pour la première fois les traditions orales sous forme écrite, préservant ainsi un savoir transmis de bouche à oreille depuis mille ans. Le conseil se réunit pour consacrer cette réalisation. La Kiva éternelle sera-t-elle un phare d’harmonie spirituelle, accueillant tous les peuples ? Ou cela constituera-t-il la preuve que le mode de gouvernance et de communauté Pueblo a produit quelque chose de vraiment grand ?"
 nd_pue.11.a: "La kiva accueille tous ceux qui recherchent l'harmonie."
 nd_pue.11.b: "La méthode Pueblo a prouvé sa maîtrise."
 STATIC_MODIFIER_NAME_nd_pue_dest_raiders_mesa: "Les Aventuriers de la Mesa"
 STATIC_MODIFIER_DESC_nd_pue_dest_raiders_mesa: "Pueblo war parties strike deep into enemy territory, returning with spoils that enrich the confederation, though the influx of foreign goods drives prices upward."
 STATIC_MODIFIER_NAME_nd_pue_dest_desert_shield: "Bouclier du désert"
 STATIC_MODIFIER_DESC_nd_pue_dest_desert_shield: "Un réseau de forteresses mesa et de tours de guet rend le cœur du Pueblo pratiquement imprenable, même si le maintien de ces défenses met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_pue_dest_war_eagle: "Aigle de guerre"
 STATIC_MODIFIER_DESC_nd_pue_dest_war_eagle: "L'aigle turquoise sème la terreur chez les ennemis des pueblos. Les puissances étrangères reconnaissent la puissance militaire de la confédération et accordent des conditions favorables à la table des négociations."
 STATIC_MODIFIER_NAME_nd_pue_dest_indomitable: "Esprit indomptable"
 STATIC_MODIFIER_DESC_nd_pue_dest_indomitable: "L’esprit d’endurance qui a soutenu les pueblos à travers des siècles de difficultés se manifeste désormais sous la forme d’une tradition défensive inflexible. Les alliés se rallient à la bannière du pueblo indomptable."
 STATIC_MODIFIER_NAME_nd_pue_dest_ceramic_masters: "Maîtres Céramiques"
 STATIC_MODIFIER_DESC_nd_pue_dest_ceramic_masters: "Pueblo pottery commands premium prices in markets across the continent, drawing traders and expanding the confederation's diplomatic reach, though success breeds ease and the men of the workshops are slow to answer a muster."
 STATIC_MODIFIER_NAME_nd_pue_dest_desert_scholars: "Érudits du désert"
 STATIC_MODIFIER_DESC_nd_pue_dest_desert_scholars: "Les artisans et les érudits étrangers sont accueillis dans les pueblos, apportant de nouvelles techniques et idées qui se mélangent aux traditions anciennes pour produire des innovations remarquables."
 STATIC_MODIFIER_NAME_nd_pue_dest_eternal_ceremonies: "Cérémonies éternelles"
 STATIC_MODIFIER_DESC_nd_pue_dest_eternal_ceremonies: "Les cérémonies kachina du Grand Kiva attirent des pèlerins de toutes les nations. L'harmonie spirituelle des pueblos devient un modèle de coexistence pacifique entre les divers peuples."
 STATIC_MODIFIER_NAME_nd_pue_dest_pueblo_mastery: "Maîtrise des Pueblos"
 STATIC_MODIFIER_DESC_nd_pue_dest_pueblo_mastery: "Le Grand Kiva est la preuve que la méthode Pueblo (gouvernance communautaire, tradition sacrée, artisanat patient) ​​a produit une civilisation digne du respect du monde."
 nd_pue_war_council: "Salle du Conseil de guerre"
 nd_pue_war_council_desc: "Une salle du conseil fortifiée où les chefs de guerre de chaque pueblo se réunissent pour coordonner les campagnes militaires de la confédération, planifier les défenses et mobiliser les guerriers dans tout le sud-ouest."
 nd_pue_great_kiva: "Grande Kiva"
 nd_pue_great_kiva_desc: "Une salle cérémonielle souterraine monumentale rivalisant avec les grands kivas de l'ancien Chaco Canyon, où sont exécutées les danses les plus sacrées et où les traditions orales de chaque pueblo sont préservées."
 nd_pue_war_council_upkeep: "Entretien du Conseil de guerre"
 nd_pue_war_council_upkeep_desc: "L'entretien de la salle du Conseil de guerre nécessite des armes pour la garnison, du cuir pour l'équipement, des outils pour les réparations et de la pierre pour les murs en adobe."
 nd_pue_great_kiva_ceremonies: "Grandes cérémonies de Kiva"
 nd_pue_great_kiva_ceremonies_desc: "Le cycle cérémoniel élaboré du Grand Kiva nécessite de la cire d'abeille pour les bougies, de l'argile pour les récipients sacrés, des teintures pour la peinture rituelle et de l'encens pour la purification."

 AUTO_MODIFIER_NAME_nd_pue_bureaucracy_authority: "Autorité bureaucratique de la Fédération"
 AUTO_MODIFIER_DESC_nd_pue_bureaucracy_authority: "With the federation of the pueblos proclaimed in the spirit of Po'pay's coordinated rising, the offices each pueblo kept for itself are upheld by all of them together. Three of these institutions can be kept at a time."
 pue_cacique_war_captain_bureaucracy: "Cacique et capitaine de guerre"
 pue_cacique_war_captain_bureaucracy_desc: "La division structurelle de l'autorité Pueblo entre un chef rituel et politique intérieur (le cacique, en Tewa le po'kwingeh) et un chef militaire extérieur (le capitaine de guerre, en Tewa le t'owa e'). Le cacique exerçait ses fonctions à vie, était confirmé par les sociétés religieuses et se préoccupait du calendrier cérémoniel, des semailles et des récoltes, ainsi que de la paix intérieure du pueblo. Le capitaine de guerre était choisi chaque année - souvent par le cacique avec les conseils des moitiés - détenait le droit des guerriers et de la police du village, et prenait le terrain pendant la saison des raids contre les Apaches, les Navajos et les envahisseurs espagnols. Les deux fonctions se contrôlaient mutuellement : le capitaine de guerre ne pouvait entreprendre la guerre sans l'accord du cacique et la sanction rituelle des sociétés, et le cacique ne pouvait pas assurer la police du village sans la main du capitaine de guerre."
 pue_kiva_council_chamber_bureaucracy: "Salle du Conseil de Kiva"
 pue_kiva_council_chamber_bureaucracy_desc: "La salle cérémonielle souterraine qui servait de cœur politico-religieux à chaque pueblo. Entrant par une échelle par l'ouverture du toit qui représentait le sipapu de l'émergence, la kiva abritait les sociétés religieuses - le culte des kachina, les sociétés de médecine, les confréries guerrières - et était le lieu où le cacique convoquait les anciens du village pour les questions d'importance : le calendrier des fêtes, l'attribution de l'eau d'irrigation, le jugement des torts graves, la ratification de la guerre. Chaque pueblo avait plusieurs kivas, divisées par moitié ou par appartenance à une société ; les grandes kivas de construction de l'ère Chaco (Pueblo Bonito, Aztec, Casa Rinconada) en détenaient plus d'une centaine. La kiva était à la fois enceinte sacrée, salle du conseil, atelier de tissage et loge des hommes."
 pue_moiety_dual_system_bureaucracy: "Système double Moiety"
 pue_moiety_dual_system_bureaucracy_desc: "La division sociopolitique de chaque pueblo en deux moitiés complémentaires qui alternaient l'autorité selon la saison. Parmi les pueblos Tewa, il y avait les gens de l'été et les gens de l'hiver, chacun avec son propre cacique, sa propre kiva et son propre calendrier de fêtes. Chez les Hopi, la division analogue était Squash/Turquoise. L'autorité pour les affaires publiques du pueblo - attribution des champs, convocation des groupes de travail, organisation des chasses - passa d'une moitié à l'autre aux équinoxes, de sorte qu'aucune faction ne détenait le village toute l'année. Les moitiés étaient exogames : un homme d'été épousait une femme d'hiver, et les enfants prenaient la moitié de la mère, tissant le village par parenté tout en gardant ses visages publics alternés."
 pue_knotted_cord_runner_network_bureaucracy: "Réseau de coureurs de cordons noués"
 pue_knotted_cord_runner_network_bureaucracy_desc: "L'institution de coordination inter-pueblo descend de l'organisation de Po'pay de la révolte des Pueblo de 1680. Depuis son refuge à Taos, le chef religieux Tewa envoyait des coureurs vers le sud et l'ouest portant des cordes nouées en fibre de yucca avec un nœud pour chaque jour restant jusqu'au lever du soleil; les pueblos acceptèrent la corde en dénouant les nœuds à leur tour. Le jour convenu : le 10 août 1680 : les pueblos Tewa, Tiwa, Towa, Keresan, Zuni et Hopi se sont soulevés ensemble contre les Espagnols de Taos aux mesas Hopi, trois cents milles de désert coordonnés par une corde nouée. La fédération préserve le réseau de coureurs en tant qu'institution permanente : un corps de coureurs rapides entraînés dès l'enfance dans chaque pueblo, des cordes nouées comme moyen de convocation inter-pueblo et un conseil de coordination au pueblo de Taos."
 pue_pecos_plains_trade_bureaucracy: "Commerce des plaines de Pecos"
 pue_pecos_plains_trade_bureaucracy_desc: "Institution frontalière orientale par laquelle les pueblos les plus orientaux (Pecos en particulier, avec Cuartelejo et Picuris) négociaient les échanges entre le monde des pueblos agricoles et les peuples chasseurs de bisons des plaines du sud. Aux foires d'automne, organisées à Pecos en octobre et à Taos en été, Apache de Cuartelejo, Jicarilla et à partir de c. 1700 Comanche et Wichita apportèrent des peaux de bison, de la viande séchée, du suif, des captifs et des esclaves en échange de maïs, de haricots, de courges, de mantas en coton tissé, de pigments broyés et de turquoise extraite de Cerrillos. Les pueblos percevaient des péages et un pourcentage du trafic de transit ; Pecos s'est enrichi en tant que passerelle entre deux mondes. Les gouverneurs espagnols ont tenté à plusieurs reprises de supprimer les foires et ont échoué à plusieurs reprises."
