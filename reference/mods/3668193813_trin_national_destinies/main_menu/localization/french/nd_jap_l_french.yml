l_french:
 STATIC_MODIFIER_NAME_nd_tenka_fubu: "Tenka Fubu"
 STATIC_MODIFIER_DESC_nd_tenka_fubu: "Le royaume sous une seule épée. Des cendres du Sengoku Jidai naît un Japon uni par la suprématie militaire, où le clan le plus fort a imposé l'ordre par la force des armes et la maîtrise des tactiques combinées d'infanterie et d'armes à feu."
 STATIC_MODIFIER_NAME_nd_pax_tokugawa: "Pax Tokugawa"
 STATIC_MODIFIER_DESC_nd_pax_tokugawa: "La longue paix. Les États en guerre étant maîtrisés, le Japon se replie sur lui-même pour cultiver ses domaines. Les rizières s'agrandissent, les villes fortifiées prospèrent et la classe marchande devient prospère sous l'ordre stable d'un gouvernement centralisé."
 STATIC_MODIFIER_NAME_nd_land_of_rising_sun: "Pays du Soleil Levant"
 STATIC_MODIFIER_DESC_nd_land_of_rising_sun: "Une civilisation à part. Le Japon Uni affirme son identité culturelle unique : la perfection de la cérémonie du thé, le raffinement du bushido et l'épanouissement des arts qui définiront la civilisation japonaise pendant des siècles."
 nd_jap.1.t: "La fin du Sengoku"
 nd_jap.1.d: "The last embers of the Sengoku Jidai have been extinguished. Across the provinces of Japan, the banners of rival clans no longer fly in defiance. They have been torn down, burned, or pledged anew to the victorious house. The emperor sits in Kyoto as he always has, but real power now flows from one source alone.\n\nThe unifier faces a choice that will shape generations. The methods of conquest (massed ashigaru, castle sieges, the ruthless subjugation of rivals) can be turned outward, building Japan into a military power that dominates East Asia. Or the sword can be sheathed, the energies of the nation redirected toward internal development, peace, and the prosperity that comes from two centuries without war. Or perhaps the moment calls for something higher: the elevation of Japanese civilization itself, a cultural flowering that makes the islands the envy of the known world.\n\nWhich path shall define the new Japan?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_jap.1.a: "Tenka Fubu : le royaume sous une seule épée."
 nd_jap.1.b: "Recherchez la Pax Tokugawa : la prospérité par la paix."
 nd_jap.1.c: "Nous sommes le Pays du Soleil Levant. Laissez notre culture briller."
 STATIC_MODIFIER_NAME_nd_jap_sword_hunt_decree: "Décret de Katanagari"
 STATIC_MODIFIER_DESC_nd_jap_sword_hunt_decree: "La grande chasse à l’épée a dépouillé les paysans de leurs armes, consolidant les instruments de violence entre les seules mains de la classe des samouraïs. L’ordre est rétabli et la rébellion devient beaucoup moins probable."
 nd_jap.2.t: "La grande chasse à l'épée"
 nd_jap.2.d: "In the aftermath of unification, an edict is proclaimed across every province: all swords, short swords, bows, and firearms in the hands of the common people are to be confiscated. The official reason given is that the metal will be melted down to forge nails and bolts for a great statue of the Buddha: a pious fiction that few believe but all obey.\n\nThe true purpose is unmistakable. By disarming the peasantry, the new order draws an uncrossable line between the warrior class and everyone else. Never again will farmers take up arms in ikki uprisings or rally behind ambitious local lords. The sword hunt transforms Japan's social order as profoundly as any battle, establishing a monopoly on violence that will endure for centuries."
 nd_jap.2.a: "Que les épées soient rassemblées."
 nd_jap.3.t: "Sankin-Kotai proclamé"
 nd_jap.3.d: "A masterful instrument of control has been devised: the system of alternate attendance. Every daimyo in Japan must now maintain residences in both Edo and their home domain, traveling between them on a fixed schedule. Their wives and children remain in Edo permanently, honored guests who happen to be hostages.\n\nThe financial burden is staggering. The processions of each daimyo (hundreds or thousands of retainers, all in full ceremonial dress) must travel the great roads at enormous expense. Lodgings, gifts, and the maintenance of grand Edo mansions drain domain treasuries. What gold might have been spent on armies and fortifications instead flows into roads, inns, and the coffers of Edo merchants.\n\nIt is, perhaps, the most elegant system of political control ever devised. The daimyo are kept loyal not by the threat of force, but by the steady hemorrhage of their wealth."
 nd_jap.3.a: "Un système digne d’admiration."
 nd_jap.4.t: "La Renaissance Genroku"
 nd_jap.4.d: "Under the long peace, Japanese culture has reached unprecedented heights. In Edo, Osaka, and Kyoto, the merchant class patronizes arts that would have been unimaginable during the chaos of the Sengoku. Kabuki theater draws packed audiences, the haiku reaches its perfection in the verses of the wandering poets, and woodblock prints capture the floating world of pleasure quarters and natural beauty.\n\nThe tea ceremony has evolved from a simple ritual into an elaborate philosophy of aesthetics. Ceramic arts produce wares sought by collectors across East Asia. The puppet theater of bunraku achieves a dramatic sophistication that rivals any stage in the world. Even the martial arts, freed from the urgency of actual warfare, are refined into formalized schools of swordsmanship and archery.\n\nThis is the paradox of the Tokugawa peace: a warrior society that, forbidden from fighting, channels its energies into creating one of the most refined civilizations in human history."
 nd_jap.4.a: "Que mille fleurs s'épanouissent."
 STATIC_MODIFIER_NAME_nd_jap_sakoku_consolidation: "Consolidation Sakoku"
 STATIC_MODIFIER_DESC_nd_jap_sakoku_consolidation: "Avec une influence étrangère soigneusement contrôlée, le Japon se replie sur lui-même. La stabilité de l’isolement permet aux institutions nationales de mûrir sans perturbation extérieure."
 STATIC_MODIFIER_NAME_nd_jap_sakoku_rangaku: "Fenêtre Rangaku"
 STATIC_MODIFIER_DESC_nd_jap_sakoku_rangaku: "Par la petite fenêtre de Dejima, l’apprentissage du néerlandais s’infiltre au Japon. Textes médicaux, cartes astronomiques et philosophie naturelle filtrent à travers la poignée d'interprètes qui parlent la langue des barbares aux cheveux roux."
 nd_jap.5.t: "Sakoku : le pays fermé"
 nd_jap.5.d: "The edicts have been proclaimed: Japan shall close its doors to the world. Portuguese missionaries are expelled. Spanish traders are banned. The English factory at Hirado is shuttered. Only the Dutch and Chinese are permitted to trade, and only at the tiny artificial island of Dejima in Nagasaki harbor, under the strictest supervision.\n\nJapanese subjects are forbidden from traveling abroad on pain of death. Those already overseas may never return. The great ocean-going ships are ordered destroyed, replaced by coastal vessels too small to cross open water.\n\nYet the closure is not absolute. Through Dejima, a trickle of Western knowledge continues to flow, books on medicine, astronomy, and military science that a small circle of scholars study as rangaku, Dutch learning. The question is whether Japan will use this isolation to perfect its own civilization, or whether it will fall behind the Western powers that even now are exploring the globe."
 nd_jap.5.a: "Scellez les frontières : notre civilisation n’a besoin d’aucune influence extérieure."
 nd_jap.5.b: "Entretenez la fenêtre hollandaise. La connaissance ne connaît pas de frontières."
 nd_jap.6.t: "Rangaku : apprentissage du néerlandais"
 nd_jap.6.d: "For generations, a small cadre of scholars in Nagasaki has pored over Dutch texts, laboriously translating works on anatomy, astronomy, botany, and military science. What began as idle curiosity has grown into a serious intellectual movement.\n\nThe breakthrough came with the translation of a Dutch anatomy text, when Japanese physicians discovered that their traditional Chinese medical charts were riddled with errors, while the Western diagrams matched what they actually observed in dissections. The implications were profound: the barbarians, for all their crude manners, possessed genuine knowledge that Japan lacked.\n\nNow rangaku schools proliferate across the country. Domain lords sponsor scholars to study Western gunnery and fortification. Physicians adopt Western surgical techniques. Astronomers correct centuries of accumulated error. A quiet revolution in knowledge is underway: one that will prepare Japan for the shock of forced opening that lies ahead."
 nd_jap.6.a: "La connaissance est la meilleure arme."
 STATIC_MODIFIER_NAME_nd_jap_restoration_imperial: "Restauration Impériale"
 STATIC_MODIFIER_DESC_nd_jap_restoration_imperial: "L'empereur a été rétabli comme véritable souverain du Japon. La légitimité découle une fois de plus du trône du chrysanthème, et l’État centralisé tire sa force de cette ancienne source d’autorité."
 STATIC_MODIFIER_NAME_nd_jap_restoration_modernize: "Bunmei Kaika"
 STATIC_MODIFIER_DESC_nd_jap_restoration_modernize: "Civilisation et illumination ! Le Japon abandonne les anciennes contraintes et adopte une modernisation globale, la science, l’industrie et les institutions occidentales sont adoptées à une vitesse époustouflante."
 nd_jap.7.t: "Fukoku Kyohei"
 nd_jap.7.d: "Enrich the country, strengthen the military: the slogan echoes across Japan as a new era dawns. The old order is crumbling, whether from internal pressure or the threat of foreign gunboats matters less than the response. Japan must transform itself or be consumed.\n\nTwo visions compete. The first looks to the Chrysanthemum Throne: the emperor, sidelined for centuries by the shogunate, can serve as the unifying symbol of a centralized modern state. Imperial restoration would concentrate authority, sweep away the fragmented domain system, and channel national energies under a single sovereign will.\n\nThe second vision looks westward. What Japan needs is not merely new leadership but new knowledge: the sciences, industries, and institutions that have made the Western powers dominant. Send students abroad. Hire foreign advisors. Build railroads and telegraph lines. The nation that modernizes fastest survives.\n\nPerhaps both paths lead to the same destination. But the emphasis chosen now will shape Japan's character for generations."
 nd_jap.7.a: "Restaurer l'Empereur : Sonno Joi !"
 nd_jap.7.b: "Recherchez la civilisation et l’illumination : Bunmei Kaika !"
 nd_jap_za_merchant_guilds: "Guildes marchandes Za"
 nd_jap_za_merchant_guilds_desc: "La création de za, guildes marchandes monopolistiques opérant sous le patronage de temples, de sanctuaires et de maisons nobles pendant l'ère Muromachi."
 nd_jap_tachi_forging: "Forgeage Tachi"
 nd_jap_tachi_forging_desc: "L'art de forger le tachi : la longue épée incurvée du samouraï à cheval, prédécesseur du katana et symbole de la classe guerrière."
 nd_jap_shoen_estates: "Domaines Shoen"
 nd_jap_shoen_estates_desc: "Le système de domaines privés détenus par des aristocrates, des temples et des maisons de guerriers qui constitue le fondement économique du Japon médiéval."
 nd_jap_shugo_administration: "Administration des Shugos"
 nd_jap_shugo_administration_desc: "La nomination de gouverneurs militaires, shugo, pour administrer les provinces au nom du shogunat, établissant un cadre de contrôle centralisé."
 nd_jap_wokou_traditions: "Traditions Wokou"
 nd_jap_wokou_traditions_desc: "Les traditions de raids maritimes des pirates wokou qui terrorisèrent les côtes de Corée et de Chine, forgeant les premières capacités navales du Japon."
 nd_jap_nanbokucho_legacy: "L'héritage de Nanbokucho"
 nd_jap_nanbokucho_legacy_desc: "L'héritage durable de la période des Cours du Nord et du Sud : une époque divisée qui a néanmoins établi la légitimité de la succession impériale et les structures politiques qui façonneraient le Japon."
 nd_jap_muromachi_culture: "Culture Muromachi"
 nd_jap_muromachi_culture_desc: "L'épanouissement des arts d'influence zen sous les shoguns Ashikaga : peinture à l'encre, théâtre Nô, cérémonie du thé et jardins paysagers secs qui définissent l'esthétique japonaise."
 nd_jap_yari_ashigaru: "Yari Ashigaru"
 nd_jap_yari_ashigaru_desc: "L'organisation des fantassins paysans en formations disciplinées armées de longues lances yari, transformant la guerre du combat individuel des samouraïs en tactiques d'infanterie de masse."
 nd_jap_za_expansion: "Extension Za"
 nd_jap_za_expansion_desc: "La croissance des guildes marchandes au-delà de leurs patrons du temple, développant un contrôle monopolistique indépendant sur la production, le transport et la vente de produits clés."
 nd_jap_yamashiro_fortification: "Fortification de Yamashiro"
 nd_jap_yamashiro_fortification_desc: "La construction de forteresses de montagne, yamashiro, qui exploitent le terrain accidenté du Japon pour créer des positions défensives presque imprenables."
 nd_jap_tally_trade: "Commerce de compte"
 nd_jap_tally_trade_desc: "Le système de commerce maritime réglementé avec la Chine Ming à l'aide de certificats de pointage officiels, établissant la position du Japon dans le réseau commercial d'Asie de l'Est."
 nd_jap_sohei_tradition: "Traditions Sohei"
 nd_jap_sohei_tradition_desc: "La tradition des moines guerriers des grands monastères bouddhistes, de redoutables combattants qui brandissent le naginata pour défendre leurs temples et la foi."
 nd_jap_tanegashima_firearms: "Armes à feu de Tanegashima"
 nd_jap_tanegashima_firearms_desc: "L'adoption des fusils à mèche portugais, le tanegashima, et leur production de masse rapide par des forgerons japonais, ont changé à jamais la nature de la guerre japonaise."
 nd_jap_nanban_trade: "Commerce Nanban"
 nd_jap_nanban_trade_desc: "Faites du commerce avec les « barbares du sud » : des marchands portugais et espagnols qui apportent des armes à feu, le christianisme et des produits exotiques sur les côtes japonaises."
 nd_jap_castle_revolution: "Révolution du château"
 nd_jap_castle_revolution_desc: "La transformation de forteresses de montagne en châteaux de plaine avec des murs de pierre massifs, de larges douves et des donjons imposants : la signature architecturale de l'ère Sengoku."
 nd_jap_sekibune_patrol: "Hayabune Patrol Fleet"
 nd_jap_sekibune_patrol_desc: "Des navires de patrouille côtière rapides qui protègent le vaste littoral japonais contre les pirates, les contrebandiers et les intrus étrangers."
 nd_jap_ikko_ikki_suppression: "Suppression des Ikko-Ikki"
 nd_jap_ikko_ikki_suppression_desc: "L’écrasement systématique des soulèvements militants bouddhistes Ikko-ikki, mettant fin à l’ère des rébellions paysannes à motivation religieuse et consolidant l’autorité laïque."
 nd_jap_daiku_tradition: "Tradition Daiku"
 nd_jap_daiku_tradition_desc: "La tradition des maîtres charpentiers, les daiku, dont les compétences en menuiserie, construction de châteaux et de temples représentent l'un des meilleurs travaux du bois au monde."
 nd_jap_tamahagane_smithing: "Forge Tamahagane"
 nd_jap_tamahagane_smithing_desc: "L'art de fondre le sable de fer dans le four tatara pour produire du tamahagane : l'acier précieux à partir duquel les lames japonaises sont forgées."
 nd_jap_sword_hunt: "La chasse à l'épée"
 nd_jap_sword_hunt_desc: "Le Katanagari : la confiscation systématique des armes aux paysans pour consolider le monopole des samouraïs sur la violence."
 nd_jap_kenchi_land_survey: "Arpentage des terres de Kenchi"
 nd_jap_kenchi_land_survey_desc: "Des enquêtes cadastrales complètes qui mesurent chaque rizière et chaque champ, établissant une base rationnelle pour la fiscalité et l'administration du domaine."
 nd_jap_atakebune_warship: "Tekkōsen Ironclads"
 nd_jap_atakebune_warship_desc: "Massive oar-driven warships sheathed in iron plate, the floating fortresses that dominate Japanese coastal waters."
 nd_jap_korea_invasion: "Campagnes coréennes"
 nd_jap_korea_invasion_desc: "Les expéditions militaires à grande échelle dans la péninsule coréenne, des campagnes ambitieuses qui testaient la puissance militaire unifiée du Japon face aux puissances continentales."
 nd_jap_christian_expulsion: "Expulsion chrétienne"
 nd_jap_christian_expulsion_desc: "La persécution et l'expulsion systématiques des missionnaires et convertis chrétiens, affirmant la souveraineté religieuse japonaise et éliminant une menace perçue pour l'ordre social."
 nd_jap_sankin_kotai: "Sankin-Kotaï"
 nd_jap_sankin_kotai_desc: "Le système de fréquentation alternée, obligeant les daimyo à maintenir des résidences à Edo et à s'y rendre régulièrement, vidant leurs trésors tout en enrichissant la capitale."
 nd_jap_controlled_trade: "Commerce contrôlé"
 nd_jap_controlled_trade_desc: "La restriction du commerce extérieur à des ports désignés sous stricte surveillance gouvernementale, préservant la souveraineté tout en préservant l'accès aux biens essentiels."
 nd_jap_hatamoto_guard: "Garde Hatamoto"
 nd_jap_hatamoto_guard_desc: "Les serviteurs directs du shogun, des guerriers d'élite qui forment le noyau professionnel de l'establishment militaire Tokugawa."
 nd_jap_genroku_culture: "Culture Genroku"
 nd_jap_genroku_culture_desc: "L'âge d'or des arts de la période Edo : théâtre kabuki, poésie haïku, gravures sur bois ukiyo-e et esthétique raffinée de la cérémonie du thé."
 nd_jap_temple_schools: "Écoles du Temple"
 nd_jap_temple_schools_desc: "Terakoya, écoles communautaires gérées par des temples bouddhistes et des samouraïs à la retraite qui enseignent la lecture, l'écriture et le calcul aux enfants du commun."
 nd_jap_machi_bugyou: "Machi Bugyou"
 nd_jap_machi_bugyou_desc: "Le système de magistrats municipaux, des administrateurs urbains efficaces qui maintiennent l'ordre, règlent les différends et gèrent la vie commerciale trépidante des grandes villes japonaises."
 nd_jap_rangaku_studies: "Études Rangaku"
 nd_jap_rangaku_studies_desc: "L'étude systématique de la science et de la technologie occidentales à travers des textes néerlandais, jetant les bases intellectuelles de la future modernisation du Japon."
 nd_jap_kaibogaku_defense: "Défense Kaibogaku"
 nd_jap_kaibogaku_defense_desc: "Des études de défense côtière combinant la fortification traditionnelle avec la science militaire occidentale, préparant le Japon à la menace d’une puissance navale étrangère."
 nd_jap_han_reforms: "Réformes Han"
 nd_jap_han_reforms_desc: "Modernisation administrative du système de domaine, fiscalité rationalisée, efficacité bureaucratique et réforme fiscale menée par les daimyo progressistes."
 nd_jap_proto_industry: "Proto-industrialisation"
 nd_jap_proto_industry_desc: "L'émergence d'industries artisanales, de brasseries de saké et d'ateliers textiles qui commencent à transformer l'économie japonaise de l'agriculture pure vers l'industrie manufacturière."
 nd_jap_fukoku_kyohei: "Fukoku Kyohei"
 nd_jap_fukoku_kyohei_desc: "Enrichir le pays, renforcer l'armée : le cri de ralliement des modernisateurs japonais qui cherchent à bâtir une nation capable de figurer parmi les grandes puissances."
 nd_jap_meiji_precursors: "Précurseurs Meiji"
 nd_jap_meiji_precursors_desc: "Les mouvements intellectuels et politiques qui préfigurent la restauration Meiji appellent à la domination impériale, à l’apprentissage occidental et à la transformation du Japon en un État moderne et centralisé."
 n_nd_jap_kobaya: "Kobaya"
 n_nd_jap_kobaya_desc: "Navires de raid rapides utilisés par les pirates wokou, des embarcations légères et agiles construites pour la vitesse dans les eaux côtières et les frappes rapides contre la marine marchande."
 a_nd_jap_yari_ashigaru: "Yari Ashigaru"
 a_nd_jap_yari_ashigaru_desc: "Des fantassins paysans armés de longues lances yari, combattant en formations de phalange disciplinées. Ce qui leur manque dans l'entraînement martial, ils le compensent par la masse et la portée."
 a_nd_jap_sohei: "Sohei"
 a_nd_jap_sohei_desc: "Des moines guerriers bouddhistes qui luttent avec le fanatisme des dévots. Armés d'armes d'hast naginata et endurcis par la pratique ascétique, ils sont redoutables sur le champ de bataille."
 a_nd_jap_ashigaru_teppo: "Ashigaru Teppo"
 a_nd_jap_ashigaru_teppo_desc: "Infanterie paysanne massive armée de fusils à mèche Tanegashima. Ce qui leur manque en compétences martiales individuelles, ils le compensent par des tirs de volée dévastateurs qui peuvent briser même la meilleure charge de samouraï."
 n_nd_jap_sekibune: "Hayabune"
 n_nd_jap_sekibune_desc: "Navire de patrouille rapide construit pour la vitesse et la maniabilité dans les eaux côtières du Japon. Idéal pour chasser les pirates et intercepter les contrebandiers."
 n_nd_jap_atakebune: "Tekkōsen"
 n_nd_jap_atakebune_desc: "Massive floating fortresses powered by banks of oars and sheathed in iron plate. These ironclads dominate coastal waters with their heavy armament and near-impervious hulls."
 a_nd_jap_hatamoto: "Hatamoto"
 a_nd_jap_hatamoto_desc: "Les hommes-bannières, serviteurs directs du shogun, issus des familles de guerriers les plus fidèles. Ces soldats d'élite allient la discipline des troupes professionnelles aux traditions martiales de la classe des samouraïs."
 levy_nd_jap_sohei: "Sohei Lévy"
 levy_nd_jap_sohei_desc: "Des moines guerriers bouddhistes issus des communautés de temples pour combattre avec le fanatisme des dévots, armés d'armes d'hast naginata."
 levy_nd_jap_yari_ashigaru: "Yari Ashigaru Prélèvement"
 levy_nd_jap_yari_ashigaru_desc: "Des lanciers paysans rassemblés dans les communautés agricoles et des soldats de garnison, armés de longues lances yari et combattant en formations massives."
 nd_jap_za_guild_hall: "Salle de la guilde Za"
 nd_jap_za_guild_hall_desc: "Le siège d'une guilde marchande za, où les monopoles commerciaux sont gérés, les marchandises sont stockées et les frais sont collectés auprès des membres opérant sous la protection de la guilde."
 nd_jap_zen_garden: "Jardin Zen"
 nd_jap_zen_garden_desc: "Un jardin contemplatif composé de gravier ratissé, de pierres soigneusement placées et d'espaces méditatifs rattachés à un complexe de temples zen. Un lieu de raffinement artistique et de calme spirituel."
 nd_jap_yamashiro: "Yamashiro"
 nd_jap_yamashiro_desc: "Une forteresse de montagne exploitant le terrain accidenté du Japon, ses approches étroites, ses pentes abruptes et ses cours fortifiées qui rendent l'assaut presque suicidaire pour les forces attaquantes."
 nd_jap_jokamachi: "Jokamachi"
 nd_jap_jokamachi_desc: "Une ville château : le cœur administratif et commercial d'un domaine. Sous les murs de la forteresse du seigneur, les marchands, les artisans et les samouraïs créent un centre urbain prospère."
 nd_jap_tamahagane_forge: "Forge Tamahagane"
 nd_jap_tamahagane_forge_desc: "Un four tatara traditionnel où le sable de fer est fondu en tamahagane : l'acier à haute teneur en carbone à partir duquel les lames et armures légendaires du Japon sont forgées."
 nd_jap_dejima: "Poste de traite de Dejima"
 nd_jap_dejima_desc: "Un avant-poste commercial étranger contrôlé où les marchands néerlandais et chinois peuvent faire des affaires sous la stricte supervision du gouvernement. Une petite fenêtre sur le monde extérieur."
 nd_jap_terakoya: "Terakoya"
 nd_jap_terakoya_desc: "Une école-temple où des moines bouddhistes et des érudits à la retraite enseignent la lecture, l'écriture et le calcul aux enfants des roturiers. Le fondement du taux d’alphabétisation remarquablement élevé du Japon."
 nd_jap_daiba_battery: "Batterie Daiba"
 nd_jap_daiba_battery_desc: "Un emplacement d'artillerie côtière de style occidental construit pour défendre les ports contre les navires de guerre étrangers. Combinant des canons importés avec une expertise traditionnelle en matière de fortification."
 nd_jap_tachi_smithing: "Tachi Forge"
 nd_jap_tachi_smithing_desc: "La production d'épées tachi, de longues lames incurvées forgées par des maîtres forgerons selon des techniques traditionnelles transmises de génération en génération."
 nd_jap_sake_brewing: "Brassage du saké"
 nd_jap_sake_brewing_desc: "La production traditionnelle de vin de riz, pierre angulaire de la culture et de l'économie japonaises."
 nd_jap_lacquerware: "Laque Urushi"
 nd_jap_lacquerware_desc: "La production de produits laqués : bols, boîtes et meubles recouverts de sève d'arbre raffinée qui produit une finition brillante et durable prisée dans toute l'Asie de l'Est."
 nd_jap_textile_weaving: "Tissage textile"
 nd_jap_textile_weaving_desc: "Ateliers proto-industriels de tissage de soie et de coton qui représentent la transition du Japon d'une économie agraire vers une économie manufacturière."
 nd_jap_za_guild_hall_maintenance: "Entretien de guilde"
 nd_jap_za_guild_hall_maintenance_desc: "Coûts de fonctionnement d'une guilde marchande za, soie pour les échantillons commerciaux, papier pour les registres et la correspondance, et poterie pour l'exposition et l'échange."
 nd_jap_zen_garden_maintenance: "Entretien du jardin"
 nd_jap_zen_garden_maintenance_desc: "Entretenir les dispositions en pierre et les motifs de gravier d'un jardin contemplatif zen, avec des bougies et du matériel calligraphique pour la méditation et la cérémonie."
 nd_jap_yamashiro_maintenance: "Entretien de la forteresse"
 nd_jap_yamashiro_maintenance_desc: "Entretenir les palissades en bois, les murs en pierre et les armements de garnison d'une forteresse de montagne."
 nd_jap_jokamachi_maintenance: "Entretien de la ville-château"
 nd_jap_jokamachi_maintenance_desc: "Entretenir les murs en pierre, les bureaux administratifs et les archives d'une ville-château."
 nd_jap_forge_maintenance: "Opérations de forge"
 nd_jap_forge_maintenance_desc: "Fusion de sable de fer dans un four tatara traditionnel pour produire de l'acier tamahagane."
 nd_jap_dejima_maintenance: "Entretien du poste de traite"
 nd_jap_dejima_maintenance_desc: "Gérer l'échange contrôlé de soie, de porcelaine et de marchandises étrangères dans un poste de traite, avec des registres commerciaux et des documents pour la surveillance douanière."
 nd_jap_terakoya_maintenance: "Entretien de l’école du Temple"
 nd_jap_terakoya_maintenance_desc: "Fournir du papier, des bougies et des textes pédagogiques pour une école du temple paroissial où les moines enseignent aux enfants du commun la lecture et l'écriture."
 nd_jap_daiba_maintenance: "Entretien de la batterie"
 nd_jap_daiba_maintenance_desc: "Entretenir l'artillerie côtière, les réserves de poudre, les fortifications en pierre et les outils de réparation dans une batterie de défense portuaire."
 nd_jap_formed_tt: "Le Japon s'est formé"
 nd_jap_path_a_tt: "J'ai choisi Tenka Fubu."
 nd_jap_path_b_tt: "Choisissez Pax Tokugawa"
 nd_jap_path_c_tt: "Choisissez le pays du soleil levant"
 nd_jap_destiny: "Le destin du Japon"
 nd_jap_destiny_desc: "Le Japon est unifié pour la première fois depuis des générations. Les garnisons sont renforcées, les domaines consolidés. La question est désormais : que deviendra ce nouveau Japon ?"
 nd_jap_dest_northern_pacification: "Pacification du Nord"
 nd_jap_dest_northern_pacification_desc: "Secure the wild northern frontier of Ezo, from the Ishikari plain to Shizunai, where Shakushain raised the Ainu against the Matsumae in 1669. Control of these territories establishes the northern boundary of the Japanese empire. Requires owning Ishikari and Shizunai with a substantial army."
 nd_jap_dest_korean_expedition: "Expédition coréenne"
 nd_jap_dest_korean_expedition_desc: "Launch a full-scale invasion of the Korean peninsula, seizing the capital at Hanseong and the southern port of Gyeongju. Japan's armies must prove they can fight and win on continental soil. Requires conquest of Korea, professional armies and the Kenchi land survey, by whose assessed yields each domain owes its men."
 nd_jap_dest_greater_sphere: "Grande sphère asiatique"
 nd_jap_dest_greater_sphere_desc: "Japan's military ambitions reach their apex. From the Philippines to Taiwan, the islands of the Pacific and the coasts of Asia fall under Japanese hegemony. This is the culmination of Tenka Fubu on a continental scale. Requires Tondo, Formosa and a massive army."
 nd_jap_dest_domain_economy: "Économie de domaine"
 nd_jap_dest_domain_economy_desc: "La richesse d’un Japon uni provient de ses marchés de la soie et de ses réserves d’or. Consolider l’économie de domaine en un système commercial cohérent qui enrichit l’autorité centrale. Nécessite des réserves d’or substantielles, une grande stabilité et de la soie sur le marché."
 nd_jap_dest_floating_world: "Le monde flottant"
 nd_jap_dest_floating_world_desc: "Under the long peace, Japan's cities swell with merchants, artisans, and artists. The ukiyo (the floating world of pleasure quarters, kabuki theaters, and woodblock prints) becomes the envy of civilizations. Requires banking, national prestige and gold reserves."
 nd_jap_dest_eastern_workshop: "Atelier oriental"
 nd_jap_dest_eastern_workshop_desc: "Japan transforms from an agrarian society into an industrial power. Factories, shipyards, and zaibatsu conglomerates drive modernization at breathtaking speed. Requires industrialization, Shiranuka on Hokkaido's coal coast, gold reserves, and coal in the market."
 nd_jap.8.t: "Le destin du Japon"
 nd_jap.8.d: "The last rival banners have fallen. Japan is one. But unity is not a destination; it is a beginning. The question that now confronts the ruling house is as old as civilization itself: what does a great nation do with its power?\n\nThe answer will define not merely Japan's future, but its very character. Shall the sword that united the islands be turned outward, carving an empire from the coasts of Asia? Or shall it be sheathed, its energies channeled into building a civilization so refined and prosperous that conquest becomes unnecessary?"
 nd_jap.8.a: "Notre destin nous attend."
 nd_jap.9.t: "La frontière nord sécurisée"
 nd_jap.9.d: "The wild lands of Ezo have been brought under Japanese authority. The Ainu peoples, who once roamed these northern territories unchallenged, now answer to Japanese administrators. From the Ishikari plain to Shizunai, where Shakushain once raised the river chiefs against the Matsumae, the banner of the unified state flies.\n\nThese conquests are more than territorial additions. Ezo's forests, fisheries, and potential farmland represent a vast new resource base, and its northern shore looks toward Karafuto and the continent beyond.\n\nThe military machine that conquered these territories is now tested, hardened, and hungry for greater challenges. The continent beckons."
 nd_jap.9.a: "La frontière est sécurisée. Qu’y a-t-il au-delà ?"
 nd_jap.10.t: "Le soleil levant sur la Corée"
 nd_jap.10.d: "Japanese armies have crossed the strait and planted their banners on continental soil. Hanseong, the Korean capital, is in Japanese hands. Gyeongju, seat of ancient Silla glory, acknowledges Japanese supremacy. The invasion that many thought impossible has succeeded.\n\nBut holding conquered territory differs from taking it. Two approaches present themselves. The first favors raw military power, maintaining a permanent samurai vanguard on the peninsula, ready to crush any resistance and push further into Manchuria. The second takes a subtler approach, establishing a tributary system that preserves local governance while extracting tribute and obedience.\n\nOne demands more blood. The other demands more patience."
 nd_jap.10.a: "Stationnez nos samouraïs comme avant-garde permanente."
 nd_jap.10.b: "Établir un système tributaire d’États vassaux."
 nd_jap.11.t: "La grande sphère asiatique"
 nd_jap.11.d: "From Formosa to the Philippines, from Korea to the southern seas, the Japanese sphere of influence encompasses a vast arc of Asian territory. What began with the unification of the home islands has grown into something no Japanese ruler ever imagined: a maritime empire to rival those of the European powers.\n\nTwo visions for this empire compete. The naval faction argues that Japan's destiny lies on the waves: a Pacific dominion connected by sea lanes, defended by fleets, and enriched by trade. The continental faction counters that true power lies in territory: that Japan must secure its position on the Asian mainland through overwhelming military strength.\n\nThe choice will determine whether Japan becomes a thalassocracy or a land empire."
 nd_jap.11.a: "Notre destin repose sur les vagues du Pacifique."
 nd_jap.11.b: "Le véritable pouvoir se mesure en terres détenues."
 nd_jap.12.t: "L’économie des domaines s’épanouit"
 nd_jap.12.d: "The economic reorganization of Japan is bearing fruit. The domain lords, once petty warlords who funded their ambitions through rice taxes alone, now preside over diversified local economies. Silk flows from Nishijin looms, gold fills the coffers of Edo money-changers, and the great roads connecting castle towns hum with merchant traffic.\n\nThe central authority, drawing revenue from this growing commercial web, finds itself wealthier than any shogunate in history. Trade centers in Osaka, Sakai, and Hakata process goods from across the realm. Banking houses extend credit that lubricates the wheels of commerce.\n\nJapan's economy, once fragmented among hundreds of quarreling domains, has become a coherent national system. The long peace is paying dividends."
 nd_jap.12.a: "La prospérité est la véritable mesure de la bonne gouvernance."
 nd_jap.13.t: "Le monde flottant"
 nd_jap.13.d: "The long peace has wrought a transformation that no general could have achieved. Japan's cities (Edo, Osaka, Kyoto) are among the largest and most sophisticated in the world. In the pleasure quarters and theater districts, a vibrant urban culture has emerged that the warriors of the Sengoku would not recognize.\n\nTwo aspects of this cultural flowering compete for patronage. The merchant houses of Osaka and Sakai have grown fabulously wealthy, their trading networks extending across East Asia. They fund kabuki theater, sponsor artists, and quietly accumulate the real power that comes from controlling the flow of money.\n\nMeanwhile, the artists and poets of the ukiyo, the floating world, create works of breathtaking beauty. Woodblock prints, haiku poetry, and kabuki performances define a civilization at its cultural peak.\n\nWhich aspect shall the state encourage?"
 nd_jap.13.a: "Renforcez les maisons de marchands d'Osaka."
 nd_jap.13.b: "Patronisez les arts du monde flottant."
 nd_jap.14.t: "L'Atelier oriental"
 nd_jap.14.d: "Japan has achieved what seemed impossible: an industrial revolution on its own terms. The coal mines of Hokkaido feed blast furnaces. Shipyards launch modern vessels. Railways connect cities that were once weeks apart. The zaibatsu, great industrial-financial conglomerates, have become the engines of national transformation.\n\nTwo models of industrial development present themselves. The zaibatsu-led approach concentrates economic power in a handful of great firms (Mitsui, Mitsubishi, Sumitomo) that combine banking, trade, and manufacturing under single corporate umbrellas. They are ruthlessly efficient but create dangerous concentrations of private power.\n\nThe alternative is the kokusan policy: national production directed by the state, building strategic industries under government control to ensure that Japan's modernization serves the national interest rather than private profit."
 nd_jap.14.a: "Laissons les zaibatsu diriger la modernisation du Japon."
 nd_jap.14.b: "Production nationale pour l'intérêt national."
 STATIC_MODIFIER_NAME_nd_jap_dest_samurai_vanguard: "Avant-garde des samouraïs"
 STATIC_MODIFIER_DESC_nd_jap_dest_samurai_vanguard: "Une garnison permanente de samouraïs d’élite stationnée sur la péninsule coréenne, prête à écraser la résistance et à s’enfoncer plus profondément sur le continent. Le coût de la lassitude face à la guerre est réel, tout comme la capacité militaire."
 STATIC_MODIFIER_NAME_nd_jap_dest_tributary_system: "Système tributaire"
 STATIC_MODIFIER_DESC_nd_jap_dest_tributary_system: "Un réseau de vassaux et d'affluents qui reconnaît la suprématie japonaise tout en préservant la gouvernance locale. L'hommage afflue vers le Japon ; l'obéissance suit. Les nouvelles guerres sont plus faciles à justifier à travers cet ordre établi."
 STATIC_MODIFIER_NAME_nd_jap_dest_pacific_dominion: "Domination du Pacifique"
 STATIC_MODIFIER_DESC_nd_jap_dest_pacific_dominion: "Le Japon contrôle le Pacifique grâce à sa suprématie navale. La flotte impériale domine les voies maritimes allant de Taïwan aux Philippines, même si le maintien d’une force maritime aussi vaste exige des ressources de l’armée."
 STATIC_MODIFIER_NAME_nd_jap_dest_continental_hegemon: "Hégémon continental"
 STATIC_MODIFIER_DESC_nd_jap_dest_continental_hegemon: "Les armées japonaises constituent la force terrestre dominante en Asie de l’Est. Les forteresses et les lignes de ravitaillement soutiennent les opérations en profondeur sur le continent, même si la marine souffre du détournement de ressources vers l’armée."
 STATIC_MODIFIER_NAME_nd_jap_dest_merchant_houses: "Maisons de marchands d'Osaka"
 STATIC_MODIFIER_DESC_nd_jap_dest_merchant_houses: "Les grandes maisons marchandes contrôlent les flux d’argent et de marchandises à travers le Japon. Leur richesse finance des réseaux d’espionnage et des entreprises commerciales, même si l’afflux de capitaux entraîne des pressions inflationnistes."
 STATIC_MODIFIER_NAME_nd_jap_dest_ukiyo_culture: "Culture Ukiyo"
 STATIC_MODIFIER_DESC_nd_jap_dest_ukiyo_culture: "Le monde flottant de l’art, du théâtre et de la poésie atteint son apogée. Le prestige culturel du Japon perdure et sa réputation raffinée améliore les relations diplomatiques. Les arts mercenaires, cependant, sont en dessous d’une nation aussi cultivée."
 STATIC_MODIFIER_NAME_nd_jap_dest_zaibatsu_power: "Puissance Zaibatsu"
 STATIC_MODIFIER_DESC_nd_jap_dest_zaibatsu_power: "Les conglomérats industriels et financiers conduisent la modernisation du Japon avec une efficacité impitoyable. Leur portée mondiale étend la portée commerciale du Japon et leur richesse attire des mercenaires talentueux, même si leur expansion rapide met à rude épreuve les lignes d'approvisionnement."
 STATIC_MODIFIER_NAME_nd_jap_dest_kokusan_policy: "Politique du Kokusan"
 STATIC_MODIFIER_DESC_nd_jap_dest_kokusan_policy: "La production nationale dirigée par l'État garantit que la capacité industrielle du Japon sert l'intérêt national. L'influence diplomatique grandit et la nation négocie à partir d'une position de force autosuffisante."
 nd_jap_gunbatsu_hq: "Quartier général de Gunbatsu"
 nd_jap_gunbatsu_hq_desc: "Le centre de commandement de l'établissement militaire japonais, où les campagnes continentales sont planifiées, les armées organisées et la logistique de l'empire coordonnée."
 nd_jap_zaibatsu: "Zaibatsu"
 nd_jap_zaibatsu_desc: "Un conglomérat industriel et financier combinant la banque, le commerce et l'industrie manufacturière sous une seule entreprise. Le moteur de la modernisation du Japon et le fondement de sa puissance économique."
 nd_jap_gunbatsu_maintenance: "Entretien du commandement militaire"
 nd_jap_gunbatsu_maintenance_desc: "Entretenir les magasins d'armes, les dossiers administratifs, l'équipement de signalisation et les écuries d'un quartier général de commandement militaire."
 nd_jap_zaibatsu_maintenance: "Opérations industrielles"
 nd_jap_zaibatsu_maintenance_desc: "Exploiter les fours à charbon, les aciéries, les bureaux administratifs et l'outillage industriel d'un conglomérat zaibatsu."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_jap_bureaucracy_authority: "Autorité administrative de Bakouhan"
 AUTO_MODIFIER_DESC_nd_jap_bureaucracy_authority: "Unified Japan inherits the layered administrative apparatus of the Bakufu, the han domains, and the Imperial Court at Kyoto. Four more institutions may be kept at a time."

 jap_bakuhan_taisei_bureaucracy: "Bakouhan-Taisei"
 jap_bakuhan_taisei_bureaucracy_desc: "Fondement constitutionnel de l'État d'Edo, codifié après Sekigahara (1600) et ratifié par l'armistice de Genna de 1615. Le système bakuhan divisait l'autorité entre le Bakufu central d'Edo (qui détenait les affaires étrangères, la monnaie, les Cinq Kaido et les terres Tenryo) et environ 270 daimyo qui gouvernaient leur han avec une large autonomie fiscale et judiciaire en échange de serments de loyauté et du prélèvement sur le rendement du riz kokudaka. C'était une fédération par stratification plutôt que par traité."

 jap_sankin_kotai_bureaucracy: "Sankin-Kotaï"
 jap_sankin_kotai_bureaucracy_desc: "Le système de fréquentation alternative formalisé par Tokugawa Iemitsu dans la révision de 1635 du Buke Shohatto. Chaque daimyo était tenu de maintenir une résidence yashiki permanente à Edo, y laissant sa femme et son héritier comme otages de facto, et d'alterner chaque année sa propre résidence entre Edo et son domaine. Les processions le long des Cinq Kaido mettaient en faillite les grandes maisons, peuplaient Edo de consommateurs de samouraïs et attachaient le daimyo aux yeux du shogun."

 jap_roju_wakadoshiyori_bureaucracy: "Roju et Wakadoshiyori"
 jap_roju_wakadoshiyori_bureaucracy_desc: "Le cœur exécutif du Bakufu Edo. Quatre à cinq conseillers supérieurs (Roju), issus du loyaliste fudai daimyo, gouvernaient le royaume par rotation mensuelle ; les conseillers juniors (Wakadoshiyori) s'occupaient des affaires des bannières hatamoto du shogun. Un Tairo (Grand Ancien) tournant a été nommé en cas de crise. À la fin du XVIIe siècle, le système des conseillers a remplacé le gouvernement personnel des premiers shoguns par une bureaucratie collégiale de chambellans."

 jap_hyojosho_bureaucracy: "Hyojosho"
 jap_hyojosho_bureaucracy_desc: "La cour suprême du Bakufu d'Edo, réunissant les trois magistratures (le Jisha-bugyo pour les temples et sanctuaires, le Machi-bugyo pour la ville d'Edo et le Kanjo-bugyo pour le trésor) sous la présidence d'un Roju senior. Le Hyojosho entendait des affaires dépassant les frontières juridictionnelles, des appels du han et des questions capitales affectant les intérêts du bakufu. Sa codification en 1742 sous le Kujikata Osadamegaki a donné pour la première fois à l'État Tokugawa une procédure judiciaire unifiée."

 jap_buke_shohatto_bureaucracy: "Buke Shohatto"
 jap_buke_shohatto_bureaucracy_desc: "Le code de treize articles réglementant les daimyo et leurs serviteurs samouraïs, promulgué par Tokugawa Hidetada en 1615 et révisé par Iemitsu en 1635. Les articles limitaient la construction des châteaux, les alliances matrimoniales, les contacts entre factions et la taille des suites armées ; le code était lu à haute voix au début du règne de chaque shogun. Buke Shohatto constituait la classe guerrière comme un domaine légal du royaume et réservait la violence légitime au seul shogun."

 jap_sakoku_nagasaki_bugyo_bureaucracy: "Sakoku et le Bugyo de Nagasaki"
 jap_sakoku_nagasaki_bugyo_bureaucracy_desc: "Le régime de pays fermé imposé par les édits d'Iemitsu de 1633 à 1639, qui a scellé le Japon de tout contact étranger sauf par quatre canaux étroits : l'usine hollandaise de Dejima, les jonques chinoises à Nagasaki, les ambassades coréennes via Tsushima et l'hommage aux Ryukyuan via Satsuma. Le Nagasaki Bugyo, un magistrat nommé par le bakufu, contrôlait la bourse Dejima, censurait les livres occidentaux et recevait les rapports annuels des services de renseignement néerlandais Fusetsugaki. Sakoku a préservé la stabilité intérieure au prix de couper le Japon de la révolution européenne des armements."

 jap_kuge_shohatto_bureaucracy: "Kuge Shohatto"
 jap_kuge_shohatto_bureaucracy_desc: "Le code de 1615 réglementant la cour impériale de Kyoto associé au Buke Shohatto. La noblesse kuge centrée sur les Tenno était confinée à l'érudition et aux rituels, et toutes les affaires de la cour étaient acheminées par l'intermédiaire d'un agent de liaison nommé par le bakufu, le Kyoto Shoshidai. Cet arrangement préservait la légitimité théologique de l'empereur en tant que source du mandat du shogun tout en privant la cour de toute autorité pratique. La double résidence de la légitimité à Kyoto et de l'autorité à Edo a défini l'État d'Edo jusqu'en 1868."

 jap_dochu_bugyo_bureaucracy: "Dochu Bugyo et les Cinq Kaido"
 jap_dochu_bugyo_bureaucracy_desc: "Le bureau du magistrat de l'autoroute régissant les Cinq Kaido (Tokaido, Nakasendo, Koshu Kaido, Oshu Kaido et Nikko Kaido) qui rayonnaient depuis le pont Nihonbashi à Edo. Les 248 postes le long de ces routes fournissaient des chevaux, des porteurs et un logement aux fonctionnaires, aux daimyo gyoretsu et aux voyageurs autorisés. Le réseau routier soutenait le sankin-kotai, transportait les courriers du bakufu et le riz fiscal, et permettait les déplacements civils massifs qui ont produit la culture du monde flottant de Hokusai et de Hiroshige."
