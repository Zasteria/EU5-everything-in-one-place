l_french:
 STATIC_MODIFIER_NAME_nd_shl_ewig_ungedeelt: "Jusqu'à Ewig Ungedeelt"
 STATIC_MODIFIER_DESC_nd_shl_ewig_ungedeelt: "Les duchés de Schleswig et de Holstein sont à jamais indivis. Sous une volonté souveraine unique, la région frontalière est devenue un État unifié, avec une gouvernance solide et des frontières sécurisées."
 STATIC_MODIFIER_NAME_nd_shl_eider_frontier: "La frontière de l'Eider"
 STATIC_MODIFIER_DESC_nd_shl_eider_frontier: "Le Schleswig-Holstein considère sa nature comme un pont entre les mondes. Le Danemark et l'Allemagne, la Mer du Nord et la Baltique, la Scandinavie et l'Empire se rencontrent et se mélangent dans ces duchés, et de ce mélange naît la prospérité."
 STATIC_MODIFIER_NAME_nd_shl_treaty_sovereignty: "Souveraineté des traités"
 STATIC_MODIFIER_DESC_nd_shl_treaty_sovereignty: "Le Traité de Ribe a été interprété comme un mandat de souveraineté ducale, concentrant le pouvoir entre les mains du duc plutôt que dans les domaines."
 STATIC_MODIFIER_NAME_nd_shl_treaty_estates: "Partenariat successoral"
 STATIC_MODIFIER_DESC_nd_shl_treaty_estates: "Le traité de Ribe a établi un partenariat entre le duc et les domaines Holstein, les villes marchandes ayant voix au chapitre dans la gouvernance."
 STATIC_MODIFIER_NAME_nd_shl_canal_strategic: "Voie navigable stratégique"
 STATIC_MODIFIER_DESC_nd_shl_canal_strategic: "Le canal de l'Eider sert de couloir stratégique, permettant un mouvement rapide des navires entre la mer du Nord et la Baltique sans le dangereux voyage autour du Jutland."
 STATIC_MODIFIER_NAME_nd_shl_canal_commercial: "Couloir Commercial"
 STATIC_MODIFIER_DESC_nd_shl_canal_commercial: "Le canal de l'Eider est devenu une artère commerciale, permettant la circulation des marchandises entre les deux mers et enrichissant les villes riveraines."
 nd_shl.1.t: "Jusqu'à Ewig Ungedeelt"
 nd_shl.1.d: "The duchies of Schleswig and Holstein are united at last. For centuries these lands have been pulled between Denmark and the Empire, their dukes serving two masters, their people speaking two languages. The Treaty of Ribe declared these lands 'forever undivided', but unity of territory is not yet unity of purpose.\n\nThe Holsatian nobles demand a strong duke who can resist Danish encroachment and stand as sovereign in the Empire. But the merchants of Kiel and the farmers of the marshes see a different future: one where the duchy's position between two seas and two civilizations becomes its greatest asset, not a source of weakness.\n\nShall Schleswig-Holstein forge itself into a single, sovereign state? Or shall it embrace the borderland, becoming the indispensable bridge between Scandinavia and Germany?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_shl.1.a: "Nous sommes à jamais indivis, sous un seul souverain"
 nd_shl.1.b: "Nous sommes le pont entre deux mondes"
 nd_shl.2.t: "Le traité de Ribe"
 nd_shl.2.d: "On 2 March 1460, in the ancient city of Ribe, the Holsatian nobles elected King Christian I of Denmark as their new count, succeeding the extinct Schauenburg dynasty. In return, Christian swore an oath that would echo through centuries: the duchies of Schleswig and Holstein should remain 'up ewig ungedeelt' (forever undivided).\n\nThis simple phrase in Low German became the constitutional foundation of the duchies. But its meaning was contested from the start. Did it mean the duchies were bound together as one state under ducal authority? Or did it mean the estates (the knights and towns who extracted this promise) held a permanent right to share in governance?\n\nThe answer will shape the duchy's character for generations."
 nd_shl.2.a: "Le duc gouverne les terres indivises avec une autorité indivise"
 nd_shl.2.b: "Les domaines participent à la gouvernance de ces terres"
 nd_shl.3.t: "Le désastre d'Hemmingstedt"
 nd_shl.3.d: "On 17 February 1500, King John of Denmark and Duke Frederick marched against the free peasant republic of Dithmarschen with an army of over twelve thousand men, including four thousand Landsknechte and two thousand armored knights. The Dithmarscher peasants, barely six thousand strong, met them on flooded ground near the village of Hemmingstedt.\n\nThe peasants had opened the sluice gates of their dikes, flooding the low-lying marshes and funneling the invading army into narrow causeways where their numbers counted for nothing. One-third of all the knights of Schleswig and Holstein perished in the mud. The ducal banner fell. It was the worst military humiliation in the history of the duchies.\n\nBut from this disaster comes a hard lesson: in these flat, watery lands, fortification and knowledge of the terrain are worth more than cavalry charges. The marsh itself is a weapon for those who know how to wield it."
 nd_shl.3.a: "Nous ne sous-estimerons plus jamais le marais"
 nd_shl.4.t: "Le canal de l'Eider"
 nd_shl.4.d: "Since the days of the Vikings, men have dreamed of cutting a channel across the narrow neck of the Jutland peninsula to connect the North Sea to the Baltic. Duke Adolf I of Holstein-Gottorp first proposed the project in 1571, but it took two centuries of engineering advances before construction could begin.\n\nCompleted in 1784, the Eider Canal stretches from Kiel on the Baltic to the Eider estuary at Tonning on the North Sea. Ships that once braved weeks of dangerous sailing around the Skagerrak can now transit in days. The canal transforms Schleswig-Holstein from a peripheral borderland into the pivot point of northern European maritime commerce.\n\nShall the canal serve primarily as a strategic asset for the duchy's naval ambitions, or as a commercial highway enriching its merchant class?"
 nd_shl.4.a: "Une voie navigable stratégique pour notre flotte"
 nd_shl.4.b: "Une autoroute du commerce pour nos commerçants"
 nd_shl.5.t: "Christiana Albertine"
 nd_shl.5.d: "On 5 October 1665, Duke Christian Albert of Holstein-Gottorp founded a university at Kiel, naming it the Christiana Albertina after himself and his father. The duke endowed the institution with lands and privileges, drawing scholars from across the Protestant north.\n\nThe university quickly becomes a center of jurisprudence, theology, and natural philosophy. Its professors train the administrators who will govern the duchies, and its students carry the learning of Kiel to courts and counting houses across northern Europe. In a land torn between Danish and German claims, the university provides a distinctly Holsatian center of intellectual identity."
 nd_shl.5.a: "Puisse Kiel devenir un phare de l’apprentissage dans le Nord"
 nd_shl_deichbau: "Deichbau"
 nd_shl_deichbau_desc: "Depuis le XIe siècle, les habitants des marais de la mer du Nord ont construit des digues pour récupérer des terres sur la mer, créant ainsi de riches terres agricoles qui font vivre la population du Holstein."
 nd_shl_borderland_governance: "Gouvernance des zones frontalières"
 nd_shl_borderland_governance_desc: "La position unique du Holstein en tant que dépendance danoise et comté impérial a engendré une tradition de flexibilité diplomatique et de tolérance à l'égard des différences."
 nd_shl_holsatian_ritterschaft: "Ritterschaft holsacienne"
 nd_shl_holsatian_ritterschaft_desc: "La classe chevaleresque holsacienne, au service des seigneurs danois et impériaux, constitue l'épine dorsale de la capacité militaire et administrative du duché."
 nd_shl_north_sea_salt: "Sel de la Mer du Nord"
 nd_shl_north_sea_salt_desc: "Les marais côtiers produisent du sel provenant de l’eau de mer évaporée, une denrée vitale pour la conservation du poisson et de la viande destinés au commerce dans toute l’Europe du Nord."
 nd_shl_ochsenweg: "L'Ochsenweg"
 nd_shl_ochsenweg_desc: "La grande route des bœufs s'étend des pâturages du Jutland au sud jusqu'à Hambourg et au-delà. De vastes troupeaux de bétail sont conduits le long de cette ancienne route, enrichissant chaque colonie le long du chemin."
 nd_shl_treaty_of_ribe: "Traité de Ribe"
 nd_shl_treaty_of_ribe_desc: "Le traité de Ribe de 1460 a déclaré le Schleswig et le Holstein « à jamais indivis », établissant le fondement constitutionnel qui lie les duchés ensemble."
 nd_shl_kiel_harbor: "Port de Kiel"
 nd_shl_kiel_harbor_desc: "Le port naturel de Kiel sur la Baltique confère au duché une présence maritime, la construction navale et le commerce reliant le Holstein au monde hanséatique au sens large."
 nd_shl_gottorp_court: "Cour de Gottorp"
 nd_shl_gottorp_court_desc: "La cour ducale du château de Gottorp, près de la vieille ville de Schleswig, est un centre culturel et administratif, où le duc préside aux affaires danoises et allemandes."
 nd_shl_hemmingstedt: "Hemmingstedt"
 nd_shl_hemmingstedt_desc: "La bataille désastreuse de 1500, au cours de laquelle les paysans de Dithmarscher détruisirent une armée ducale dans des marais inondés, enseigna au Schleswig-Holstein le pouvoir mortel du terrain défensif et de la gestion de l'eau."
 nd_shl_salt_road_trade: "Commerce sur la route du sel"
 nd_shl_salt_road_trade_desc: "Holstein contrôle des tronçons de la route du sel reliant les mines de sel de Lunebourg aux ports de la Baltique, profitant ainsi du flux de cette denrée essentielle."
 nd_shl_dual_sea_shipyards: "Chantiers navals double mer"
 nd_shl_dual_sea_shipyards_desc: "Les constructeurs navals de Kiel construisent des navires adaptés à la fois aux eaux peu profondes de la Baltique et aux tempêtes de la mer du Nord, une polyvalence née de la position unique du duché entre deux océans."
 nd_shl_ducal_partition: "Partition Ducale"
 nd_shl_ducal_partition_desc: "La partition du Schleswig-Holstein en 1544 en parts royales et ducales a créé un système complexe de gouvernance partagée qui, paradoxalement, a renforcé la capacité administrative."
 nd_shl_early_reformation: "Première réforme"
 nd_shl_early_reformation_desc: "Le Schleswig-Holstein a adopté la Réforme luthérienne en 1528, parmi les premiers territoires d'Europe à le faire, transformant ses églises et ses écoles."
 nd_shl_gottorp_library: "Bibliothèque Gottorp"
 nd_shl_gottorp_library_desc: "Les ducs de Gottorp ont constitué une bibliothèque et un cabinet de curiosités remarquables, dont le célèbre globe de Gottorp, un monument de l'ambition scientifique baroque."
 nd_shl_diplomatic_balancing: "Équilibre diplomatique"
 nd_shl_diplomatic_balancing_desc: "Les ducs Holstein-Gottorp maîtrisaient l'art de jouer contre le Danemark contre la Suède et contre l'Empire, survivant grâce à leur agilité diplomatique plutôt qu'à leur puissance militaire."
 nd_shl_wartime_endurance: "Endurance en temps de guerre"
 nd_shl_wartime_endurance_desc: "La guerre de Trente Ans ravage les duchés, mais la population résiste. Les survivants ont reconstruit leurs fermes et leurs villes avec une résilience forgée au cours de décennies de conflit."
 nd_shl_eider_canal: "Canal de l'Eider"
 nd_shl_eider_canal_desc: "Le canal reliant la Baltique à Kiel à la mer du Nord via l'Eider fait du Schleswig-Holstein le carrefour maritime de l'Europe du Nord."
 nd_shl_university_of_kiel: "Université de Kiel"
 nd_shl_university_of_kiel_desc: "Fondée en 1665, la Christiana Albertina de Kiel est le premier centre d'apprentissage du duché, formant des universitaires, des juristes et des administrateurs destinés à servir dans le nord."
 nd_shl_holstein_cattle: "Bovins Holstein"
 nd_shl_holstein_cattle_desc: "La race Holstein-Friesian noir et blanc, développée sur les riches pâturages des marais, devient réputée dans toute l'Europe pour sa prodigieuse production laitière."
 nd_shl_gutswirtschaft: "Gutswirtschaft"
 nd_shl_gutswirtschaft_desc: "La réorganisation des domaines ducaux en exploitations agricoles rationalisées augmente les rendements et les recettes fiscales, favorisant la modernisation rurale."
 nd_shl_national_movement: "Mouvement national"
 nd_shl_national_movement_desc: "Le mouvement du Schleswig-Holstein ravive la promesse du Traité de Ribe, exigeant que les duchés restent unis et libres de l'absorption danoise."
 nd_shl_kiel_revolution: "Révolution de Kiel"
 nd_shl_kiel_revolution_desc: "La ferveur révolutionnaire envahit les ouvriers et les marins de Kiel, exigeant des droits constitutionnels et une représentation politique."
 nd_shl_industrial_shipyards: "Chantiers navals industriels"
 nd_shl_industrial_shipyards_desc: "Les chantiers navals de Kiel s'industrialisent et adoptent la construction en fer et à vapeur pour produire des navires de guerre qui serviront de point d'ancrage à une marine moderne."
 nd_shl_border_resolution: "Résolution des frontières"
 nd_shl_border_resolution_desc: "Les guerres du Schleswig-Holstein règlent par la force les armes la question frontalière vieille de plusieurs siècles, établissant une frontière claire entre la souveraineté danoise et allemande."
 a_nd_shl_marschbauer: "Holsatien Marschbauer"
 a_nd_shl_marschbauer_desc: "Milice paysanne des marais de la mer du Nord, endurcie par des vies passées à combattre la mer elle-même. Ils connaissent chaque digue, chaque écluse, chaque terrain dangereux."
 levy_nd_shl_marschbauer: "Holsatien Marschbauer"
 levy_nd_shl_marschbauer_desc: "Une levée d'infanterie paysanne des marais, experte dans les combats sur des terrains gorgés d'eau."
 a_nd_shl_ochsentreiber: "Holstein Ochsentreiber"
 a_nd_shl_ochsentreiber_desc: "Bouviers à cheval qui guident de vastes troupeaux le long de l'Ochsenweg. Excellents éclaireurs et tirailleurs, ils connaissent tous les gués et pâturages du Jutland à Hambourg."
 levy_nd_shl_ochsentreiber: "Holstein Ochsentreiber"
 levy_nd_shl_ochsentreiber_desc: "Une levée de bouviers à cheval venus de la route des bœufs, éclaireurs rapides chez eux dans les plaines ouvertes."
 n_nd_shl_pinass: "Kiel Pinass"
 n_nd_shl_pinass_desc: "Un patrouilleur rapide des chantiers navals de Kiel, construit avec un faible tirant d'eau pour la Baltique mais suffisamment robuste pour la mer du Nord. Idéal pour les patrouilles anti-piraterie et l'escorte du commerce côtier."
 nd_shl_deichamt: "Deichamt"
 nd_shl_deichamt_desc: "Un bureau de l'autorité des digues qui coordonne la construction et l'entretien des défenses maritimes, le drainage des marais et la gestion des terres agricoles récupérées."
 nd_shl_saline: "Saline"
 nd_shl_saline_desc: "Une saline côtière où la saumure de la mer du Nord est évaporée dans des bassins peu profonds, produisant le sel qui permet de conserver le poisson et la viande destinés au commerce dans toute l'Europe du Nord."
 nd_shl_hafenkontor: "Hafenkontor"
 nd_shl_hafenkontor_desc: "Comptoir marchand situé dans le port de Kiel, qui gère les flux de marchandises entre les réseaux commerciaux de la mer du Nord et de la Baltique."
 nd_shl_ochsenweg_station: "Gare d'Ochsenweg"
 nd_shl_ochsenweg_station_desc: "Une station commerciale le long de la grande route des bœufs où le bétail est reposé, pesé, taxé et échangé. Le processus des travailleurs du cuir se cache à côté des stylos."
 nd_shl_warft: "Warft"
 nd_shl_warft_desc: "Un monticule d'habitation artificiel élevé au-dessus de la ligne de crue, protégeant les colonies des ondes de tempête de la mer du Nord. Les insulaires d'Halligen les construisent depuis le Moyen Âge."
 nd_shl_kieler_werft: "Kieler Werft"
 nd_shl_kieler_werft_desc: "A shipyard on the Kiel Fjord, building vessels suited to both the shallow Baltic and the open North Sea, a versatility unique to this dual-coast duchy."
 nd_shl_lutherkirche: "Église Luther"
 nd_shl_lutherkirche_desc: "Église paroissiale réformée établie après la Réforme de 1528, servant de centre de prédication luthérienne, d'éducation et de gouvernance communautaire."
 nd_shl_gutshof: "Gutshof"
 nd_shl_gutshof_desc: "Un domaine ducal rationalisé appliquant les principes des Lumières à l'agriculture, avec une rotation des cultures, un drainage et une gestion du domaine améliorés."
 nd_shl_christiana_albertina: "Christiana Albertine"
 nd_shl_christiana_albertina_desc: "L'université fondée par le duc Christian Albert en 1665, un centre d'érudition protestante, de jurisprudence et de philosophie naturelle au cœur du Holstein."
 nd_shl_turnhalle: "Turnhalle"
 nd_shl_turnhalle_desc: "Une salle de gymnastique qui sert également de lieu de rencontre du mouvement national, où les rassemblements politiques et l'éducation civique attisent le feu de l'unité du Schleswig-Holstein."
 nd_shl_deichamt_maintenance: "Entretien de Deichamt"
 nd_shl_deichamt_maintenance_desc: "L'entretien du réseau de digues nécessite du bois pour les pilotis, de la pierre pour les revêtements et du fer pour les mécanismes d'écluse."
 nd_shl_saline_maintenance: "Production de salines"
 nd_shl_saline_maintenance_desc: "L'évaporation de la saumure de la mer du Nord sur des feux de charbon, la consommation de bois comme combustible et d'outils en fer pour entretenir les marais salants, produisant du sel pour le commerce dans toute l'Europe du Nord."
 nd_shl_hafenkontor_maintenance: "Entretien du Hafenkontor"
 nd_shl_hafenkontor_maintenance_desc: "Le fonctionnement du comptoir nécessite du bois de construction pour le bâtiment, du papier pour les registres et de la cire d'abeille pour les sceaux et les bougies."
 nd_shl_station_maintenance: "Entretien de la gare"
 nd_shl_station_maintenance_desc: "L'exploitation de la station de la route des bœufs nécessite du bois pour les enclos, du bétail pour l'alimentation et des céréales pour les bouviers qui se reposent ici."
 nd_shl_warft_maintenance: "Entretien des Warfts"
 nd_shl_warft_maintenance_desc: "L'entretien du monticule d'habitation nécessite de la pierre pour les revêtements, du bois pour les structures et du sable pour le noyau de terrassement."
 nd_shl_werft_maintenance: "Entretien du chantier"
 nd_shl_werft_maintenance_desc: "L'entretien du chantier naval nécessite du bois pour les coques, du fer pour les raccords et du goudron pour l'imperméabilisation."
 nd_shl_lutherkirche_maintenance: "Entretien de l'église Luther"
 nd_shl_lutherkirche_maintenance_desc: "L'entretien de l'église paroissiale nécessite du bois pour la structure, de la pierre pour les murs et de la cire d'abeille pour les bougies et le scellement."
 nd_shl_gutshof_maintenance: "Entretien du Gutshof"
 nd_shl_gutshof_maintenance_desc: "L'exploitation du domaine rationalisé nécessite du bois pour les bâtiments, du fer pour les outils et du bétail pour le programme d'élevage."
 nd_shl_university_maintenance: "Entretien de l'université"
 nd_shl_university_maintenance_desc: "L’entretien de l’université nécessite du papier pour les études, des livres pour la bibliothèque et de la cire d’abeille pour les bougies et les cachets."
 nd_shl_turnhalle_maintenance: "Entretien de la Turnhalle"
 nd_shl_turnhalle_maintenance_desc: "Le fonctionnement de la salle de réunion nécessite du bois pour la structure, du papier pour les brochures et du fer pour l'équipement de gymnastique."
 nd_shl_formed_tt: "Le Schleswig-Holstein est formé"
 nd_shl_path_a_tt: "Choisissez le destin#bold Up Ewig Ungedeelt#!"
 nd_shl_path_b_tt: "Choisissez le destin#bold Eider Frontier#!"
 nd_shl_destiny: "Destin des duchés"
 nd_shl_destiny_desc: "Le Schleswig-Holstein a été fusionné en un seul État. Le duché doit désormais décider de son orientation future : s'il souhaite poursuivre un pouvoir souverain ou une prééminence commerciale."
 nd_shl_dest_slesvig: "La question du Schleswig"
 nd_shl_dest_slesvig_desc: "Prenez l'ancien duché de Schleswig du contrôle danois. Prenez Flensburg et la ville de Schleswig pour unir les duchés historiques sous une seule volonté souveraine. Nécessite une armée d'au moins 30 000 hommes."
 nd_shl_dest_elbe: "Maîtres de l'Elbe"
 nd_shl_dest_elbe_desc: "Étendez la portée du duché jusqu'au grand port de Hambourg et sécurisez le sud du Jutland. L'estuaire de l'Elbe est la porte d'entrée vers le nord de l'Allemagne et doit répondre au Holstein. Nécessite une armée de 50 000 hommes et un statut international."
 nd_shl_dest_sovereign: "Le Duché Souverain"
 nd_shl_dest_sovereign_desc: "Prenez Copenhague elle-même et l’ancienne ville-traitée de Ribe, mettant fin à jamais aux prétentions danoises sur les duchés. Nécessite une armée puissante de 75 000 hommes, une trésorerie pleine et une réputation prestigieuse."
 nd_shl_dest_saltbridge: "Le pont de sel"
 nd_shl_dest_saltbridge_desc: "Construisez un pont commercial entre les deux mers. Adoptez des institutions bancaires modernes et assurez la circulation du sel sur les marchés du duché. Nécessite 1 000 pièces d'or dans le trésor."
 nd_shl_dest_twoseas: "Entre deux mers"
 nd_shl_dest_twoseas_desc: "Prenez Brême pour contrôler le commerce de la Weser et développer la fabrication de tissus sur le marché des capitaux. Le duché doit devenir le carrefour textile du nord. Nécessite 2 000 pièces d'or et un prestige international."
 nd_shl_dest_nexus: "Le Nexus Nord"
 nd_shl_dest_nexus_desc: "Own Bruges and Bergen, the anchors of the North Sea and Atlantic trade, and keep a Hafenkontor in three of the duchy's harbors. Schleswig-Holstein shall become the warehouse of Europe. Requires 3,000 gold and high prestige."
 nd_shl_dest_three_kontors_tt: "At least #bold 3#! of our locations have a #bold Hafenkontor#!"
 nd_shl.6.t: "Destin des duchés"
 nd_shl.6.d: "The union of Schleswig and Holstein is complete, but the true work has only begun. These marshlands and harbors, these cattle roads and salt pans: they are the foundation of something greater. The question is what we shall build upon them.\n\nShall we forge a sovereign state that answers to no Danish king, no Imperial diet? Or shall we embrace our nature as the bridge between worlds, growing rich on the commerce that must pass through our narrow isthmus?"
 nd_shl.6.a: "Notre destin attend"
 nd_shl.7.t: "La question du Schleswig"
 nd_shl.7.d: "Flensburg and the old city of Schleswig are ours. For centuries, these lands were held by the Danish crown, their German-speaking population subject to a foreign sovereign. No more. The duchy of Schleswig is reunited with Holstein under a single ruler.\n\nThe Danish king will not accept this quietly. But the lesson of the Treaty of Ribe still holds: these lands are forever undivided, and now they are forever ours."
 nd_shl.7.a: "Le Schleswig et le Holstein ne font qu’un"
 nd_shl.8.t: "Maîtres de l'Elbe"
 nd_shl.8.d: "Hamburg, the great free city of the Elbe, and the towns of South Jutland now fall within our sphere. The duchy commands the lower Elbe: the artery through which half of northern Germany's trade must flow.\n\nThis expansion demands a choice. Shall we impose iron discipline on our new territories, crushing resistance and forging a unified military state? Or shall we grant charters and privileges, incorporating Hamburg's merchant tradition and Jutland's communities as willing partners?"
 nd_shl.8.a: "La discipline de fer liera ces terres"
 nd_shl.8.b: "Accorder des chartes et gagner leur fidélité"
 nd_shl.9.t: "Le Duché Souverain"
 nd_shl.9.d: "Copenhagen has fallen. The ancient seat of Danish power, the city that claimed suzerainty over our duchies for centuries, is now subject to our will. With Ribe (the very city where the treaty of eternal unity was sworn) also in our hands, the circle is complete.\n\nSchleswig-Holstein is no longer a borderland caught between greater powers. It is a sovereign state in its own right, master of both shores of the Eider, both banks of the Elbe, and now the Sound itself.\n\nShall we use this power for further conquest, imposing our will across the north? Or shall we build a federation of northern states, leading through diplomacy rather than force?"
 nd_shl.9.a: "Nous imposerons notre volonté souveraine"
 nd_shl.9.b: "Nous dirigerons une fédération d’égaux"
 nd_shl.10.t: "Le pont de sel"
 nd_shl.10.d: "The duchy's merchants have embraced the new banking institutions, and salt (the white gold of the north) flows through our markets in abundance. The foundations of a great commercial state are laid.\n\nEvery barrel of herring preserved with our salt, every hide cured with our brine, every road and canal that carries these goods: all enrich the duchy's counting houses. Schleswig-Holstein is becoming what its geography always intended: a bridge of commerce between two worlds."
 nd_shl.10.a: "Le pont est construit sur du sel et de l'argent"
 nd_shl.11.t: "Entre deux mers"
 nd_shl.11.d: "Bremen is ours, and cloth from our looms reaches markets on both seas. The duchy now controls the transit routes between the North Sea and the Baltic, with manufacturing capacity to add value to the raw goods that pass through.\n\nShall we exploit this position through strict monopoly, controlling prices and excluding competitors? Or shall we declare open ports, attracting traders from every nation with the promise of low tariffs and safe harbors?"
 nd_shl.11.a: "Le monopole enrichira le duché"
 nd_shl.11.b: "Les ports ouverts attireront tous les arrivants"
 nd_shl.12.t: "Le Nexus Nord"
 nd_shl.12.d: "From Bergen's cod wharves to the cloth halls of Bruges, from the salt pans of Holstein to the spice warehouses of the Sound: all roads of northern commerce now pass through Schleswig-Holstein. The duchy has become what the old Hanse once dreamed of: the nexus of northern trade, the warehouse of Europe.\n\nShall we cement this position as a great entrepot, a neutral ground where all nations trade? Or shall we revive the spirit of the Hanseatic League, building a formal coalition of trading cities under our leadership?"
 nd_shl.12.a: "Nous sommes l'entrepôt du nord"
 nd_shl.12.b: "Nous dirigerons une nouvelle Ligue hanséatique"
 STATIC_MODIFIER_NAME_nd_shl_dest_elbe_iron: "Discipline de fer"
 STATIC_MODIFIER_DESC_nd_shl_dest_elbe_iron: "Les nouveaux territoires sont tenus par la force militaire. Les garnisons maintiennent l'ordre et le sentiment séparatiste est écrasé, mais le prestige du duché souffre de ses méthodes autoritaires."
 STATIC_MODIFIER_NAME_nd_shl_dest_elbe_charter: "Chartes sur l'Elbe"
 STATIC_MODIFIER_DESC_nd_shl_dest_elbe_charter: "Les nouveaux sujets reçoivent des chartes garantissant leurs droits traditionnels. Ils servent volontiers le duché, même si le maintien d’un royaume aussi diversifié nécessite un budget militaire plus important."
 STATIC_MODIFIER_NAME_nd_shl_dest_sovereign_conquest: "Volonté du souverain"
 STATIC_MODIFIER_DESC_nd_shl_dest_sovereign_conquest: "Le réseau de renseignement du duché s'étend à travers le nord, et la guerre revient à moindre coût pour un souverain qui a prouvé sa force en prenant Copenhague."
 STATIC_MODIFIER_NAME_nd_shl_dest_sovereign_federation: "Fédération du Nord"
 STATIC_MODIFIER_DESC_nd_shl_dest_sovereign_federation: "Le duché dirige une coalition d’États du Nord grâce à son poids diplomatique et à son autorité constitutionnelle, intégrant de nouveaux membres dans une fédération en pleine croissance."
 STATIC_MODIFIER_NAME_nd_shl_dest_twoseas_monopoly: "Monopole du transport en commun"
 STATIC_MODIFIER_DESC_nd_shl_dest_twoseas_monopoly: "Le contrôle strict de la route de transit des deux mers enrichit les forces navales et les banques du duché, même si le protectionnisme suscite la méfiance des partenaires commerciaux."
 STATIC_MODIFIER_NAME_nd_shl_dest_twoseas_openport: "Ports ouverts"
 STATIC_MODIFIER_DESC_nd_shl_dest_twoseas_openport: "Les ports francs attirent les marchands de toutes les nations, réduisant ainsi les coûts navals grâce à des patrouilles partagées et assurant la sécurité des mers pour tous."
 STATIC_MODIFIER_NAME_nd_shl_dest_nexus_entrepot: "Entrepôt du Nord"
 STATIC_MODIFIER_DESC_nd_shl_dest_nexus_entrepot: "Le duché sert d'entrepôt neutre pour toute l'Europe du Nord, renforçant le prestige naval et stabilisant l'économie tandis que les besoins de l'armée passent au second plan."
 STATIC_MODIFIER_NAME_nd_shl_dest_nexus_league: "Nouvelle Ligue Hanséatique"
 STATIC_MODIFIER_DESC_nd_shl_dest_nexus_league: "Une Ligue hanséatique relancée sous la direction du Schleswig-Holstein projette une puissance commerciale à travers les mers, les villes membres contribuant à une défense navale partagée."
 nd_shl_kieler_schloss: "Château de Kieler"
 nd_shl_kieler_schloss_desc: "Le palais souverain de Kiel, siège de la cour et du gouvernement du duché indépendant. Une résidence-forteresse dominant la côte baltique, symbolisant le triomphe du Holstein sur la suzeraineté danoise."
 nd_shl_zweiuferkontor: "Zweiuferkontor"
 nd_shl_zweiuferkontor_desc: "La Two-Shore Counting House, une grande bourse commerciale gérant le commerce de transit entre la mer du Nord et la Baltique. Les agents de toutes les nations commerçantes du Nord y ont des bureaux."
 nd_shl_schloss_maintenance: "Entretien du château"
 nd_shl_schloss_maintenance_desc: "L'entretien du palais souverain nécessite de la pierre pour les murs, du fer pour les portes, du tissu pour la cour et du papier pour la chancellerie."
 nd_shl_kontor_maintenance: "Entretien du comptoir"
 nd_shl_kontor_maintenance_desc: "Le fonctionnement du comptoir nécessite du papier pour les registres, du tissu pour les balles, du verre pour les fenêtres et des outils pour l'entrepôt."

 # ===== BUREAUCRACIES =====
 shl_ritterschaft_bureaucracy: "Ritterschaft du Schleswig-Holstein"
 shl_ritterschaft_bureaucracy_desc: "Constituée par le Traité de Ribe en 1460, la chevalerie unie des deux duchés siégeait comme une seule personne morale d'Equites Originarii à Bordesholm. Ses grands domaines Junker - Rantzau, Reventlow, Ahlefeldt, Brockdorff - couvraient la majeure partie de l'est du Holstein et étaient exonérés de l'impôt ducal. La Ritterschaft était le défenseur constitutionnel du principe up-ewig-ungedeelt : bien cultivée, elle rassemble la cavalerie lourde du royaume et lie le duc à son serment ; négligée, elle se calcifie en un frein héréditaire à toute réforme, et les paysans Holstein du Gter adelige sombrent dans la Leibeigenschaft."
 shl_landtag_bureaucracy: "Landtag der Stnde"
 shl_landtag_bureaucracy_desc: "L'assemblée tripartite des domaines des duchés, créée parallèlement à l'union de 1460. Trois bancs siégeaient : la Ritterschaft, les chapitres cathédraux de Schleswig et de Lbeck et la Vier Stäte (Schleswig, Flensburg, Kiel, Rendsburg). Le Landtag vota les impôts Bede, enregistra les Verordnungen ducaux et arbitre entre les lignes Glckstadt et Gottorp après la partition de 1544. Lorsqu'elle était convenablement convoquée à Kiel et à Rendsburg, elle donnait une légitimité aux édits royaux ; une fois contournés, les trois sièges ont riposté en bloquant la législation et en retirant la confiance des bourgeois des duchés."
 shl_kieler_umschlag_bureaucracy: "Kieler Umschlag"
 shl_kieler_umschlag_bureaucracy_desc: "La foire financière annuelle qui se tient à Kiel la semaine après l'Épiphanie. Documenté pour la première fois dans une lettre de 1469 du conseil de Lbeck, aux XVIe et XVIIe siècles, il était devenu le principal marché de crédit de l'Allemagne du Nord, des duchés et du royaume de Danemark. Holstein Junkers prêtait entre six et sept pour cent aux rois danois, aux marchands hanséatiques et aux entrepreneurs militaires; la majeure partie de la dette souveraine du royaume était renouvelée chaque janvier à Kiel. Maintenue, elle déprécie les emprunts de couronnes et épaissit la bourse des bourgeois; négligées, les taux grimpent et les propriétés franches Holstein tombent entre les mains de créanciers saisissants : le modèle de Bauernlegen de la fin du XVIe siècle."
 shl_adelige_kloster_bureaucracy: "Adelige Klster"
 shl_adelige_kloster_bureaucracy_desc: "Les quatre couvents nobles protestants - Itzehoe, Preetz, Uetersen et St. Johannis au Schleswig - qui ont survécu à la Réforme en tant que fondations collégiales pour les filles célibataires de la noblesse du Schleswig-Holstein. Réorganisés par la Klosterordnung après 1542, ils conservèrent de vastes terres ecclésiastiques, furent gouvernés par des Prpstinnen élus issus de la Ritterschaft et servaient à la fois de maisons de retraite nobles et de milieu savant luthérien-aristocratique. Soutenus, ils ancrent une culture cléricale et noble instruite ; délabrés, ils se transforment en propriétaires absents qui tirent des rentes et dont les domaines exonérés d'impôt sont de plus en plus mécontents des villes bourgeoises."
 shl_deutsche_kanzlei_bureaucracy: "Deutsche Kanzlei"
 shl_deutsche_kanzlei_bureaucracy_desc: "La Chancellerie allemande : le principal organe administratif des duchés, menant toutes ses affaires en allemand, contrairement à la Danske Kancelli de Copenhague. Basée à Gottorp sous les ducs Holstein-Gottorp avec une contrepartie à Glckstadt pour la part royale après 1648, elle codifia le Schleswigsches Landrecht et le Holsteinisches Landrecht et dépêcha les Verordnungen qui les gouvernaient. À partir de 1806, elle fut regroupée sous le nom de Schleswig-Holstein-Lauenburg Kanzlei. Doté d'un personnel approprié composé de Kanzleirte formés à Kiel et Helmstedt, il intègre le patchwork d'Amter, Klster et Adelsguter dans un État cohérent; sous-financé, il se transforme en une sinécure de paperasse ignorée dans les marais."

 # ===== BUREAUCRACY AUTHORITY (auto_modifier) =====
 AUTO_MODIFIER_NAME_nd_shl_bureaucracy_authority: "Autorité ducale du Schleswig-Holstein"
 AUTO_MODIFIER_DESC_nd_shl_bureaucracy_authority: "On formation, the Duke of Schleswig-Holstein assumes the right to operate the historic institutional apparatus of the twin duchies. Three of its [bureaucracies|e] may be kept at once."
