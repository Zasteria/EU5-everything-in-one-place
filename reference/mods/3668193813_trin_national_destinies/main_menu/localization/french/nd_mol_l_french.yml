l_french:
 nd_mol_formed_tt: "La Moldavie est formée"
 nd_mol_path_a_tt: "La Moldavie suit la voie du Bouclier de la chrétienté"
 nd_mol_path_b_tt: "La Moldavie suit le chemin de la Principauté Carrefour"
 STATIC_MODIFIER_NAME_nd_mol_shield_of_christendom: "Bouclier de la chrétienté"
 STATIC_MODIFIER_DESC_nd_mol_shield_of_christendom: "La Principauté de Moldavie se présente comme un bastion orthodoxe, ses forteresses et ses armées paysannes gardant les marches orientales de l'Europe chrétienne contre tous ceux qui voudraient les menacer."
 STATIC_MODIFIER_NAME_nd_mol_crossroads_principality: "Principauté Carrefour"
 STATIC_MODIFIER_DESC_nd_mol_crossroads_principality: "La Moldavie prospère à l’intersection des empires, transformant sa position entre l’Est et l’Ouest en un avantage grâce à une diplomatie astucieuse, des échanges culturels et un commerce de transit lucratif."
 nd_mol.1.t: "La Principauté de Moldavie"
 nd_mol.1.d: "The banner of the aurochs flies over our principality. Moldavia stands at a crossroads: literally and figuratively. To the west, the Hungarian crown claims suzerainty. To the east, the Ottoman shadow grows longer with each passing year. To the north, Poland watches with interest.\n\nOur voivode must choose how Moldavia will endure. Will we follow the path of Stephen the Great, building fortresses across every mountain pass and rallying the free peasantry into a citizen army? Or will we play the empires against each other, leveraging our position as a vital trade corridor to secure autonomy through diplomacy and prosperity?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mol.1.a: "Nous serons le bouclier qui ne se brise jamais"
 nd_mol.1.b: "Nous prospérerons entre les grandes puissances"
 nd_mol.2.t: "Le programme Forteresse"
 nd_mol.2.d: "Under the direction of the voivode, Moldavia has embarked on an unprecedented program of fortification. From the Carpathian passes to the Dniester marshes, a network of stone cetati now guards every approach to the heartland. The great fortress of Suceava, seat of the principality, has been reinforced with new walls and bastions. Cetatea Neamt crowns its mountain peak, commanding the Moldova valley. Soroca watches the eastern frontier, while Hotin guards the northern border.\n\nThis is not merely military construction: it is a declaration that Moldavia intends to endure. Shall we continue pouring resources into these defenses, or redirect our attention to training mobile field forces that can strike before the enemy reaches our walls?"
 nd_mol.2.a: "Des murs de pierre et des fossés profonds garderont notre terre"
 nd_mol.2.b: "Notre cavalerie sera notre forteresse"
 nd_mol.3.t: "Les monastères peints"
 nd_mol.3.d: "Something extraordinary is taking shape in the hills of northern Moldavia. The monasteries commissioned by our princes (Voronet, Moldovita, Humor, Sucevita) are being adorned not merely inside, but on their exterior walls with vivid frescoes depicting the Last Judgment, the Siege of Constantinople, and the lives of saints. These paintings, executed in brilliant blues and reds that seem to defy the passage of time, transform each monastery into an open Bible for the faithful.\n\nThe painted monasteries have become centers of learning, their scriptoriums producing chronicles and liturgical texts, their schools educating the sons of boyars and free peasants alike. They stand as proof that Moldavia is not merely a frontier marchland but a civilization in its own right."
 nd_mol.3.a: "Que notre foi soit peinte sur le monde"
 nd_mol.4.t: "La doctrine du désert"
 nd_mol.4.d: "In January 1475, an Ottoman army of perhaps 120,000 men under Hadim Suleiman Pasha invaded Moldavia. Stephen the Great, commanding fewer than 40,000 troops, retreated before the advancing host, destroying crops and poisoning wells as he went. When the Ottomans reached the narrow valley at Vaslui, exhausted, hungry, and disoriented by fog, the Moldavian army fell upon them from the surrounding forests. The rout was total.\n\nThe Battle of Vaslui demonstrated that a small nation could defeat a vast empire, not through matching its strength, but through patience, terrain, and the willingness to destroy one's own land rather than surrender it. Pope Sixtus IV called Stephen 'Verus Christianae Fidei Athleta': the true champion of the Christian faith. Shall we codify this doctrine of defensive devastation, or perfect the ambush tactics that delivered the killing blow?"
 nd_mol.4.a: "Laissons la terre elle-même être notre arme"
 nd_mol.4.b: "Perfectionnez l'art de l'embuscade forestière"
 STATIC_MODIFIER_NAME_nd_mol_cetatea_program: "Programme Cetatea"
 STATIC_MODIFIER_DESC_nd_mol_cetatea_program: "Un programme complet de construction de forteresses calqué sur les vingt-quatre forteresses construites sous la direction du voïvode, chacune étant positionnée pour commander un col, un gué ou un carrefour."
 STATIC_MODIFIER_NAME_nd_mol_open_field_doctrine: "Doctrine du champ ouvert"
 STATIC_MODIFIER_DESC_nd_mol_open_field_doctrine: "Plutôt que de s'abriter derrière des murs, la cavalerie moldave balaie le terrain, frappant avant que l'ennemi ne puisse déployer son équipement de siège contre nos forteresses."
 STATIC_MODIFIER_NAME_nd_mol_voronet_glory: "Gloire de Voronet"
 STATIC_MODIFIER_DESC_nd_mol_voronet_glory: "Les monastères peints de Moldavie sont devenus des chefs-d’œuvre de l’art orthodoxe, leurs fresques extérieures inspirant les pèlerins et les érudits du monde chrétien."
 STATIC_MODIFIER_NAME_nd_mol_vaslui_tactics: "Doctrine Vaslui"
 STATIC_MODIFIER_DESC_nd_mol_vaslui_tactics: "La stratégie de la terre brûlée qui a dévasté les armées d’invasion à Vaslui : détruisant les récoltes, empoisonnant les puits et transformant la terre elle-même en une arme contre l’envahisseur."
 STATIC_MODIFIER_NAME_nd_mol_guerrilla_mastery: "Maîtrise des embuscades forestières"
 STATIC_MODIFIER_DESC_nd_mol_guerrilla_mastery: "L'art des embuscades forestières moldaves : attirer les forces supérieures dans des vallées étroites et des forêts denses avant de tomber sur elles de toutes les directions."
 nd_mol_plaiesi_tradition: "Tradition Plaiesi"
 nd_mol_plaiesi_tradition_desc: "Les jouesi sont des paysans montagnards libres qui gardent les cols des Carpates, tendant des embuscades aux envahisseurs et combattant les actions retardatrices sur un terrain qu'ils connaissent intimement."
 nd_mol_boyar_privileges: "Privilèges des boyards"
 nd_mol_boyar_privileges_desc: "Les grandes familles boyardes contrôlent de vastes domaines fonciers, fournissant à la principauté des richesses agricoles et des conseils politiques dans le divan voïvodal."
 nd_mol_apiculture: "Apiculture moldave"
 nd_mol_apiculture_desc: "Les forêts de Moldavie regorgent d'abeilles et la cire d'abeille est devenue l'un des produits d'exportation les plus précieux de la principauté, commercialisée jusqu'à Constantinople et Venise."
 nd_mol_orthodox_identity: "Identité orthodoxe"
 nd_mol_orthodox_identity_desc: "La foi orthodoxe est indissociable de l’identité moldave, le siège métropolitain et les fondations monastiques servant de piliers à la conscience nationale."
 nd_mol_divan_assembly: "Assemblée du divan"
 nd_mol_divan_assembly_desc: "Le divan voïvodal, composé de grands boyards et de chefs d'église, conseille le prince sur les questions d'État, équilibrant l'autorité princière avec les conseils nobles."
 nd_mol_razesi_mobilization: "Mobilisation Razesi"
 nd_mol_razesi_mobilization_desc: "Les razesi (paysans propriétaires libres) constituent l’épine dorsale de la milice moldave. Contrairement aux serfs liés aux domaines nobles, ils se battent pour leur propre terre et leur liberté."
 nd_mol_calarasi_tactics: "Tactiques Calarasi"
 nd_mol_calarasi_tactics_desc: "La cavalerie légère calarasi emploie des tactiques de délit de fuite de style tatare, harcelant les colonnes ennemies, coupant les lignes de ravitaillement et attirant des forces plus importantes dans des embuscades."
 nd_mol_fortress_builders: "Constructeurs de forteresses"
 nd_mol_fortress_builders_desc: "Sous la direction du voïvode, un réseau de forteresses en pierre s'élève à travers la Moldavie, de Suceava et Neamt à l'ouest jusqu'à Soroca et Tighina à la frontière orientale."
 nd_mol_painted_churches: "Églises peintes"
 nd_mol_painted_churches_desc: "Les monastères du nord de la Moldavie sont ornés de fresques extérieures aux couleurs vives, chefs-d'œuvre de l'art orthodoxe qui servent d'écritures en plein air aux fidèles."
 nd_mol_suceava_court: "Tribunal de Suceava"
 nd_mol_suceava_court_desc: "La cour princière de Suceava, capitale de la Moldavie, sert à la fois de centre de gouvernance et de carrefour pour les routes commerciales reliant l'Europe centrale à la mer Noire."
 nd_mol_curteni_guard: "Garde Curteni"
 nd_mol_curteni_guard_desc: "Les curteni sont la cavalerie de la cour princière : des guerriers professionnels maintenus par le voïvode comme une force permanente indépendante des obligations militaires des boyards."
 nd_mol_voivodeship_arms: "Armes de la voïvodie"
 nd_mol_voivodeship_arms_desc: "La principauté établit ses propres armureries, réduisant ainsi sa dépendance à l'égard des armes importées et équipant l'armée professionnelle croissante d'armes forgées localement."
 nd_mol_scorched_earth: "Doctrine de la Terre Brûlée"
 nd_mol_scorched_earth_desc: "La doctrine défensive de la Moldavie transforme le terrain de la principauté en une arme : les forces en retraite détruisent les récoltes, empoisonnent les puits et abattent les arbres pour ralentir l'envahisseur."
 nd_mol_between_empires: "Entre empires"
 nd_mol_between_empires_desc: "Prise entre les ambitions ottomanes, hongroises et polonaises, la Moldavie a perfectionné l’art de monter les grandes puissances les unes contre les autres pour préserver son autonomie."
 nd_mol_professional_army: "Armée professionnelle"
 nd_mol_professional_army_desc: "Les lefegii sont des soldats professionnels salariés qui servent directement le voïvode, fournissant ainsi un noyau fiable à l'armée de la principauté, indépendamment des obligations féodales."
 nd_mol_moldavian_viticulture: "Viticulture Moldave"
 nd_mol_moldavian_viticulture_desc: "The hill country of Moldavia produces renowned wines, with the boyar estates cultivating vineyards that supply both the domestic market and the export trade.\n\n#italic Available in: $nd_mol_boyar_estate$#!"
 nd_mol_chronicle_tradition: "Chronique Tradition"
 nd_mol_chronicle_tradition_desc: "Les chroniqueurs monastiques moldaves consignent l'histoire de la principauté, préservant les connaissances et favorisant une tradition d'alphabétisation au sein de l'Église."
 nd_mol_tribute_diplomacy: "Diplomatie d'hommage"
 nd_mol_tribute_diplomacy_desc: "La Moldavie rend hommage au maintien de son autonomie interne : un arrangement pragmatique qui préserve les institutions de la principauté tout en reconnaissant un pouvoir écrasant."
 nd_mol_iasi_ascendant: "Ascendant de Iasi"
 nd_mol_iasi_ascendant_desc: "As the princely seat shifts from Suceava to Iasi, the new capital becomes a center of learning and culture at the crossroads of east and west.\n\n#italic Available in: $nd_mol_beeswax_house$#!"
 nd_mol_boyar_constitutionalism: "Constitutionnalisme boyard"
 nd_mol_boyar_constitutionalism_desc: "Les grands boyards imposent des limites constitutionnelles à l'autorité princière, établissant des précédents de gouvernance partagée qui restreignent l'arbitraire."
 nd_mol_printing_houses: "Imprimeries"
 nd_mol_printing_houses_desc: "Les imprimeries orthodoxes de Moldavie produisent des textes liturgiques, des codes juridiques et des chroniques en langue vernaculaire, diffusant ainsi l’alphabétisation au-delà des monastères."
 nd_mol_enduring_resistance: "Résistance durable"
 nd_mol_enduring_resistance_desc: "Malgré des siècles de domination étrangère, les traditions militaires moldaves perdurent : la paysannerie libre prend toujours les armes lorsqu'elle est appelée, luttant avec le désespoir de ceux qui défendent leur propre sol."
 nd_mol_phanariot_reforms: "Réformes phanariotes"
 nd_mol_phanariot_reforms_desc: "Les princes Phanariote, bien que nommés par Constantinople, introduisent des réformes administratives et juridiques inspirées des Lumières qui modernisent la gouvernance moldave."
 nd_mol_emancipation: "Émancipation"
 nd_mol_emancipation_desc: "L'abolition du servage transforme la société moldave, permettant à la population rurale de poursuivre des opportunités au-delà des domaines des boyards."
 nd_mol_national_awakening: "Réveil national"
 nd_mol_national_awakening_desc: "Une conscience croissante de l’identité nationale moldave et roumaine se répand dans la principauté, alimentée par les mouvements littéraires et l’érudition historique."
 nd_mol_modern_army: "Armée moderne"
 nd_mol_modern_army_desc: "Les forces militaires moldaves adoptent une organisation, des exercices et des équipements européens modernes, passant du statut de levées féodales à une armée nationale professionnelle."
 a_nd_mol_plaiesi: "Jouer"
 a_nd_mol_plaiesi_desc: "Gardes-frontières de montagne issus de la paysannerie libre des cols des Carpates. Les jouesi connaissent chaque sentier et chaque défilé, combattant comme des tirailleurs qui tendent une embuscade aux envahisseurs et se fondent dans les forêts."
 a_nd_mol_razesi: "Milice Razesi"
 a_nd_mol_razesi_desc: "Les paysans propriétaires libres se mobilisent pour la défense de la Moldavie. Contrairement aux serfs, les Razesi se battent pour leur propre terre, ce qui en fait des défenseurs obstinés et déterminés."
 a_nd_mol_calarasi: "Calarasi"
 a_nd_mol_calarasi_desc: "Cavalerie légère moldave qui emploie des tactiques de délit de fuite de style tatare. Les calarasi harcèlent les colonnes ennemies, attaquent les lignes de ravitaillement et attirent les forces supérieures dans des positions d'embuscade."
 a_nd_mol_curteni: "Garde Curteni"
 a_nd_mol_curteni_desc: "La cavalerie de cour du voïvode moldave : des cavaliers professionnels maintenus comme une force permanente indépendante des obligations féodales des boyards. Ils constituent l'arme de choc de l'armée de la principauté."
 a_nd_mol_lefegii: "Lefégii"
 a_nd_mol_lefegii_desc: "Infanterie professionnelle salariée au service du voïvode. Les lefegii constituent un noyau discipliné pour l'armée moldave, entraînés au combat en formation rapprochée."
 levy_nd_mol_plaiesi: "Garde-frontière de Plaiesi"
 levy_nd_mol_plaiesi_desc: "Gardes-frontières de montagne issus de la paysannerie libre, défendant les cols des Carpates."
 levy_nd_mol_razesi: "Milice Razesi"
 levy_nd_mol_razesi_desc: "Les paysans propriétaires fonciers libres se sont mobilisés en tant que milices déterminées à défendre le sol moldave."
 levy_nd_mol_calarasi: "Cavaliers Calarasi"
 levy_nd_mol_calarasi_desc: "Levée de cavalerie légère issue de la petite noblesse et des soldats, employant des tactiques de raid de style tatare."
 nd_mol_cetate: "Cetate"
 nd_mol_cetate_desc: "Une forteresse de montagne moldave construite pour commander un col, un gué ou un carrefour. Ces places fortes de pierre forment un réseau défensif à travers la principauté."
 nd_mol_painted_monastery: "Monastère peint"
 nd_mol_painted_monastery_desc: "Un monastère moldave orné de fresques extérieures aux couleurs vives, servant de centre d'apprentissage, d'art et de vie spirituelle orthodoxe."
 nd_mol_boyar_estate: "Domaine des Boyards"
 nd_mol_boyar_estate_desc: "Le domaine foncier d'un boyard moldave, produisant des richesses agricoles à partir de la vigne, de l'élevage et de la foresterie."
 nd_mol_armory: "Armurerie moldave"
 nd_mol_armory_desc: "Un atelier produisant des armes et des équipements pour les forces militaires croissantes de la principauté."
 nd_mol_beeswax_house: "Maison de transformation de la cire d'abeille"
 nd_mol_beeswax_house_desc: "Une installation de transformation de la cire d'abeille moldave en produits commerciaux, s'appuyant sur la riche apiculture forestière de la principauté."
 nd_mol_cetate_maintenance: "Garnison de la forteresse"
 nd_mol_cetate_maintenance_desc: "Pierre, fer et bois pour entretenir les murs et la garnison d'une forteresse de montagne moldave."
 nd_mol_monastery_maintenance: "Entretien monastique"
 nd_mol_monastery_maintenance_desc: "Teintures pour les fresques, cire d'abeille pour les bougies liturgiques et pierre pour l'entretien des bâtiments du monastère."
 nd_mol_estate_vineyard: "Vignoble Boyar"
 nd_mol_estate_vineyard_desc: "Le domaine boyard cultive des vignobles sur les coteaux moldaves, produisant du vin destiné à la consommation intérieure et à l'exportation."
 nd_mol_estate_maintenance: "Entretien du patrimoine"
 nd_mol_estate_maintenance_desc: "Bétail, laine et bois pour les opérations quotidiennes d'un domaine de boyards moldaves."
 nd_mol_arms_production: "Production d'armes moldaves"
 nd_mol_arms_production_desc: "Les forgerons locaux forgent des armes à partir du fer moldave, réduisant ainsi la dépendance à l'égard des armements importés."
 nd_mol_armory_maintenance: "Entretien de l'armurerie"
 nd_mol_armory_maintenance_desc: "Fer, bois et pierre pour l'entretien de l'atelier et de ses fourneaux."
 nd_mol_wax_processing: "Traitement de la cire et du tissu"
 nd_mol_wax_processing_desc: "La cire d'abeille moldave est combinée avec la laine locale pour produire du tissu ciré destiné à l'imperméabilisation et au commerce."
 nd_mol_beeswax_maintenance: "Entretien de la maison en cire d'abeille"
 nd_mol_beeswax_maintenance_desc: "Cire d'abeille, bois et poterie pour entretenir l'usine de transformation et ses opérations."
 nd_mol_printing_house: "Imprimerie Moldave"
 nd_mol_printing_house_desc: "Une imprimerie orthodoxe produisant des textes liturgiques, des chroniques et des codes juridiques en langue vernaculaire moldave."
 nd_mol_print_maintenance: "Fournitures d'impression"
 nd_mol_print_maintenance_desc: "Le papier, les teintures pour l'encre et le bois sont intégrés dans des textes liturgiques, des chroniques et des codes juridiques en langue vernaculaire."
 nd_mol_dest_defender: "Défenseur des Passes"
 nd_mol_dest_defender_desc: "Sécurisez le cœur de la Valaque en prenant Targoviste et Braïla, unissant ainsi les terres roumaines sous la direction militaire moldave. Nécessite une armée d'au moins 30 000 hommes."
 nd_mol_dest_bulwark: "Rempart du Danube"
 nd_mol_dest_bulwark_desc: "Étendre le contrôle moldave le long de la frontière du Danube. Prenez Constanta en Dobroudja et Drastar sur la rive bulgare, en construisant une chaîne de fortifications qui fait du fleuve une barrière infranchissable."
 nd_mol_dest_champion: "Champion de la Foi"
 nd_mol_dest_champion_desc: "L'expression ultime du Bouclier de la Chrétienté : planter la bannière des aurochs sur Constantinople et Varna, réalisant ainsi la vision de croisade dont Etienne le Grand ne faisait que rêver."
 nd_mol_dest_gateway: "Passerelle entre les mondes"
 nd_mol_dest_gateway_desc: "Faire de la Moldavie le corridor commercial essentiel entre l’Est et l’Ouest en sécurisant Lviv, la grande plaque tournante du commerce occidental, et en accumulant d’importantes réserves de trésorerie."
 nd_mol_dest_emporium: "Emporium de l'Est"
 nd_mol_dest_emporium_desc: "Transform Moldavia into a major economic power. Ensure wine flows through the capital market, embrace modern banking practices, and build up Cetatea Alba, the port at the mouth of the Dniester where the road from Lviv meets the Black Sea."
 nd_mol_dest_cetatea_alba_developed_tt: "We own #bold Cetatea Alba#! and its development is at least #bold 16#!"
 nd_mol_dest_dacia: "Dacia renaît"
 nd_mol_dest_dacia_desc: "Unissez les terres roumaines par la culture et la prospérité plutôt que par la seule conquête. Prenez Bucarest, adoptez l’imprimerie pour diffuser la conscience nationale roumaine et devenez un phare de prestige et de richesse."
 nd_mol_destiny: "Destin de la Moldavie"
 nd_mol_destiny_desc: "La principauté est formée. Aujourd’hui, sa véritable destinée commence : qu’elle soit le bouclier de la chrétienté ou le carrefour des empires."
 nd_mol.5.t: "Le destin de la Moldavie"
 nd_mol.5.d: "La Moldavie renaît. La bannière de l'aurochs flotte sur une principauté unie, et la question qui hante tous les voïvodes depuis Bogdan le Fondateur peut enfin trouver une réponse non pas par l'espoir, mais par l'action. Que deviendra la Moldavie ? Le sort de la principauté n’est plus entre les mains d’empereurs et de sultans étrangers : il n’appartient qu’à nous."
 nd_mol.5.a: "Notre destin est à nous de le forger"
 nd_mol.6.t: "Défenseur des Passes"
 nd_mol.6.d: "The Carpathian passes are secured, and our armies have crossed into Wallachia. Targoviste, seat of the Wallachian voivodes, flies the Moldavian banner. Braila, commanding the lower Danube, is ours. The Romanian lands begin to unite under the shield of Moldavian arms.\n\nThis is what Stephen the Great envisioned, not merely defending our borders, but extending them until no invader can threaten our heartland. The road south lies open. The Danube awaits."
 nd_mol.6.a: "Les laissez-passer sont à nous. Passons maintenant à la rivière."
 nd_mol.7.t: "La frontière du Danube"
 nd_mol.7.d: "Moldavian fortifications now line the Danube from Dobruja to the Bulgarian bank. Constanta gives us a window onto the Black Sea, while Drastar commands the river crossing that has seen armies pass for a thousand years. The ancient Roman limes, abandoned for centuries, lives again under the banner of the aurochs.\n\nOur generals debate the next phase. Some advocate garrisoning these positions permanently, creating an unbreakable defensive line. Others argue for an aggressive frontier march: using the Danube as a springboard for further expansion rather than a static barrier."
 nd_mol.7.a: "Garnissez la rivière. Que personne ne traverse."
 nd_mol.7.b: "La frontière est un tremplin et non un mur."
 nd_mol.8.t: "Champion de la Foi"
 nd_mol.8.d: "The unthinkable has been achieved. Constantinople, the Queen of Cities, the seat of emperors and patriarchs, flies the banner of the aurochs. Varna, where a crusade once perished, is redeemed. Pope Sixtus called Stephen 'Verus Christianae Fidei Athleta': the true champion of the Christian faith. We have earned that title a hundredfold.\n\nMoldavia's transformation from a frontier principality to a great Christian power is complete. But greatness demands choices. Shall we wield this power as Orthodox crusaders, extending the true faith across the lands we have conquered? Or shall we build an eternal bulwark, an impregnable fortress-state that no power on earth can overthrow?"
 nd_mol.8.a: "Nous sommes l'épée de la foi orthodoxe"
 nd_mol.8.b: "Nous sommes le mur qui ne tombera jamais"
 nd_mol.9.t: "Passerelle entre les mondes"
 nd_mol.9.d: "Lviv has entered Moldavia's commercial orbit, and with it the trade routes that connect the Baltic to the Black Sea, Central Europe to the Orient. Moldavian merchants now handle goods that once passed through foreign hands: Flemish cloth moving east, Crimean furs moving west, spices from the Levant passing through our warehouses.\n\nThe voivode's treasury swells with customs revenue. What empires could not take by force, Moldavia gains through the shrewdness of its merchants and the advantage of its geography."
 nd_mol.9.a: "Laissons la richesse des nations couler à travers nos terres"
 nd_mol.10.t: "Emporium de l'Est"
 nd_mol.10.d: "Moldavian wine is traded in markets from Venice to Constantinople. Banking houses operate in Iasi and Suceava, extending credit to merchants across Eastern Europe. At Cetatea Alba, below the walls the princes raised, ships load what the carts from Lviv bring down to the sea. What was once a frontier marchland is now a prosperous commercial state.\n\nOur advisors present two visions for the next stage. Some advocate deepening our commercial infrastructure: more markets, more warehouses, more trade agreements. Others argue that our true strength lies in cultural exchange: becoming a bridge between Latin West and Orthodox East, drawing scholars, artists, and diplomats to our courts."
 nd_mol.10.a: "Le commerce est le nerf de l’État"
 nd_mol.10.b: "Nous serons le pont entre les civilisations"
 nd_mol.11.t: "Dacia renaît"
 nd_mol.11.d: "The dream of a united Romania, not through blood and iron alone, but through shared language, culture, and prosperity, is taking shape. Bucharest, jewel of the Wallachian plain, recognizes Moldavian leadership. The printing press spreads Romanian texts from the Carpathians to the Danube. Scholars speak of Dacia reborn: the ancient kingdom rising from the ashes of a thousand years.\n\nMoldavia stands at a crossroads once more, but this time as a power rather than a pawn. Shall we forge a new Dacian identity, assimilating the diverse peoples of our realm into a unified nation? Or shall we pursue an enlightenment vision: tolerant, cosmopolitan, drawing strength from diversity rather than uniformity?"
 nd_mol.11.a: "Un peuple, une langue, un destin"
 nd_mol.11.b: "Dans la diversité, la force"
 STATIC_MODIFIER_NAME_nd_mol_dest_danube_garrison: "Garnison du Danube"
 STATIC_MODIFIER_DESC_nd_mol_dest_danube_garrison: "Les garnisons permanentes le long de la frontière du Danube maintiennent l'ordre, se remettent rapidement de la dévastation et construisent une tradition de service militaire professionnel."
 STATIC_MODIFIER_NAME_nd_mol_dest_border_march: "Marche frontalière"
 STATIC_MODIFIER_DESC_nd_mol_dest_border_march: "Une doctrine frontalière agressive qui utilise le Danube comme tremplin pour les raids et l'expansion, même si la guerre constante a des conséquences néfastes sur la production locale."
 STATIC_MODIFIER_NAME_nd_mol_dest_orthodox_champion: "Champion orthodoxe"
 STATIC_MODIFIER_DESC_nd_mol_dest_orthodox_champion: "La Moldavie utilise son nouveau pouvoir comme une épée de la foi orthodoxe, imposant le respect dans les négociations de paix tout en gardant les peuples conquis loyaux grâce à une religion commune."
 STATIC_MODIFIER_NAME_nd_mol_dest_eternal_bulwark: "Rempart éternel"
 STATIC_MODIFIER_DESC_nd_mol_dest_eternal_bulwark: "Une doctrine d’État forteresse qui réduit les coûts militaires et améliore la doctrine tactique, même si l’accent mis sur la fortification détourne les ressources de la construction civile."
 STATIC_MODIFIER_NAME_nd_mol_dest_trade_emporium: "Magasin commercial"
 STATIC_MODIFIER_DESC_nd_mol_dest_trade_emporium: "L'infrastructure commerciale de la Moldavie se développe, attirant davantage de commerçants et réduisant les coûts d'emprunt, même si une croissance rapide entraîne des pressions inflationnistes."
 STATIC_MODIFIER_NAME_nd_mol_dest_cultural_bridge: "Pont culturel"
 STATIC_MODIFIER_DESC_nd_mol_dest_cultural_bridge: "La Moldavie devient une plaque tournante diplomatique entre les civilisations, élargissant son influence grâce à ses relations et à sa loyauté vassale, même si sa réputation pacifiste rend les guerres plus coûteuses à justifier."
 STATIC_MODIFIER_NAME_nd_mol_dest_dacia_nova: "Dacia Nova"
 STATIC_MODIFIER_DESC_nd_mol_dest_dacia_nova: "Le nouvel État dace unifie ses peuples à travers une identité partagée, satisfaisant tous les états tout en assimilant diverses populations et en élargissant sa portée diplomatique."
 STATIC_MODIFIER_NAME_nd_mol_dest_moldavian_enlightenment: "Lumières moldaves"
 STATIC_MODIFIER_DESC_nd_mol_dest_moldavian_enlightenment: "An enlightenment vision that spreads letters and integrates diverse peoples through tolerance, though the nobility's military obligations diminish as cultural pursuits take precedence."
 nd_mol_citadel: "Citadelle moldave"
 nd_mol_citadel_desc: "Une grande forteresse représentant le sommet de l'architecture défensive moldave : des murs de pierre massifs, des fossés profonds et des quartiers de garnison permanents qui rendent cet endroit pratiquement imprenable."
 nd_mol_citadel_maintenance: "Garnison de la Citadelle"
 nd_mol_citadel_maintenance_desc: "Pierre, fer et bois pour entretenir les formidables défenses de la citadelle et abriter sa garnison permanente."
 nd_mol_academy: "Académie Moldave"
 nd_mol_academy_desc: "Un centre d'apprentissage et de culture roumaine, où des érudits, des théologiens et des artistes se réunissent pour étudier, enseigner et faire progresser la vie intellectuelle de la nation."
 nd_mol_academy_maintenance: "Entretien de l'Académie"
 nd_mol_academy_maintenance_desc: "Papier pour les manuscrits, livres pour la bibliothèque et tissu pour les quartiers des érudits et les vêtements de cérémonie."

# ===== BUREAUCRACIES =====
 mol_sfatul_domnesc_bureaucracy: "Sfatul Domnesc"
 mol_sfatul_domnesc_bureaucracy_desc: "Le Conseil princier des grands boyards qui conseillait l'hospodar et élisait les nouveaux princes parmi les candidats de la maison régnante. Le conseil comprenait la Mare Vornic (juge en chef), la Mare Logofat (chancelier), la Mare Vistier (trésorière), la Mare Spatar (porteuse d'épée et commandant militaire) et la Mare Postelnic, issues des grandes familles dont les généalogies relient les rôles du XVe siècle au règne d'Étienne le Grand de 1457-1504. En contraignant les décisions ducales à l'accord consultatif, le Sfatul a ancré la vie constitutionnelle moldave jusqu'à l'intermède Phanariot après 1711."

 mol_mitropolia_suceava_bureaucracy: "Mitropolie de Suceava"
 mol_mitropolia_suceava_bureaucracy_desc: "The autonomous Moldavian Orthodox see established at Suceava in 1386 and recognised in 1401 by the Ecumenical Patriarchate of Constantinople under metropolitan Joseph, with three suffragan bishoprics covering the entire principality. The Mitropolia anointed the hospodar, and a prince without its sanction was one claimant among many. It supplied literate clerks to the chancery from the Putna and Neamt monastery scriptoria, and translated patriarchal canons for use in Moldavian courts. The seat moved permanently from Suceava to Iasi in 1677, but the institution's continuity across three centuries gave the church a constitutional weight second only to the Sfatul Domnesc."

 mol_razesi_levy_bureaucracy: "Villages Libres Razesi"
 mol_razesi_levy_bureaucracy_desc: "La paysannerie libre et foncière de Moldavie, organisée en communautés villageoises obste dirigées par un cneaz et détenant des terres en copropriété dans un système de plein champ. Etienne le Grand a tiré l'oastea cea mica de ces propriétaires libres, levant l'infanterie voinici et la cavalerie légère hansari directement à partir des rouleaux razesi en échange de privilèges fiscaux et de droits de pâturage. Les villages libres réduisirent la dépendance du prince à l'égard des boyards et fournissèrent la base sociale qui rendit les armées moldaves disproportionnellement mobiles tout au long des XVe et XVIe siècles."

 mol_pravila_lupu_bureaucracy: "Pravila de Vasile Lupu"
 mol_pravila_lupu_bureaucracy_desc: "La Carte romaneasca de invatatura promulguée à Iasi en 1646, le premier code juridique imprimé en Moldavie et la première codification officielle du droit civil rédigé en roumain en utilisant l'écriture cyrillique. Compilée sous Vasile Lupu (1634-1653) par le logothète Eustratie, la Pravila s'est inspirée des Leges Coloniariae de Justinien II, du Jus Graeco-Romanum de Leunclavius ​​(Francfort 1596) et de Praxis et theoricae criminalis de Farinacci (Venise 1610), en les complétant par les normes coutumières moldaves sur la terre, la dette et la criminalité. Publié dans la presse du monastère Trei Ierarhi, le code obligeait les tribunaux de l'hospodar à une procédure écrite."

 mol_vornicii_tarii_bureaucracy: "Vornicii de Tara de Sus et Tara de Jos"
 mol_vornicii_tarii_bureaucracy_desc: "Les deux gouvernorats provinciaux divisant la Moldavie médiévale en un Haut Pays centré sur Suceava et un Bas Pays administré à partir de l'axe Brlad-Iasi. Chaque Mare Vornic exerçait une juridiction d'appel judiciaire sur sa moitié de la principauté, surveillait les parcalabi des quartiers fortifiés et les commis de parcalabies, percevait la part princière des amendes et des confiscations et dirigeait le prélèvement régional en temps de guerre. La division a survécu à la réorganisation Phanariot en tant que cadre fiscal et judiciaire résiduel et a donné aux grandes dynasties de boyards de chaque moitié une base de pouvoir régional en dehors du tribunal de la capitale."

 mol_phanariot_administration_bureaucracy: "Administration Phanariote"
 mol_phanariot_administration_bureaucracy_desc: "L'appareil gouvernemental d'après 1711 s'est installé lorsque la Porte a commencé à nommer des hospodars grecs du district du Phanar à Constantinople, en commençant par Nicolas Mavrocordatos en Moldavie et en continuant jusqu'à la révolte grecque de 1821. Les voïvodes phanariotes ont copié les modèles de Petrine et des Habsbourg : ils ont fait dépendre le rang noble du service de l'État, ont régularisé la capitation et, sous Constantin Mavrocordatos, ont aboli le servage légal des rumni en Moldavie en 1749. Le grec est devenu la langue des affaires judiciaires, l'Académie princière de Iasi a été réorganisée sous le nom de Domneasca, et le fiscalisme exigeant des tributs a maintenu les mandats courts et les administrations endettées envers les banquiers de Constantinople."

# ===== BUREAUCRACY AUTHORITY =====
 AUTO_MODIFIER_NAME_nd_mol_bureaucracy_authority: "Offices of the Principality of Moldavia"
 AUTO_MODIFIER_DESC_nd_mol_bureaucracy_authority: "The offices of Suceava and Iasi are kept by the prince: the Sfatul Domnesc of the great boyars, the Mitropolia of 1401, the razesi free villages, the printed Pravila of Vasile Lupu, the two vornici of the Upper and Lower Country and the Phanariot chancery. Moldavia can sustain three more standing institutions."
