l_french:
 STATIC_MODIFIER_NAME_nd_sword_of_babur: "Épée de Babur"
 STATIC_MODIFIER_DESC_nd_sword_of_babur: "L'Empire moghol est né de la conquête. Babur est descendu des hautes terres afghanes avec une armée aguerrie et la volonté de se tailler une dynastie dans les plaines de l'Hindoustan. Cet esprit d’expansion militaire incessante imprègne désormais nos armées, les poussant à conquérir ce que les empires mineurs ne pouvaient que convoiter."
 STATIC_MODIFIER_NAME_nd_light_of_akbar: "Lumière d'Akbar"
 STATIC_MODIFIER_DESC_nd_light_of_akbar: "Là où d’autres règnent uniquement par l’épée, Akbar a compris qu’un empire s’étendant sur une centaine de peuples doit être construit sur quelque chose de plus profond que la peur. Sa politique de sulh-i-kul, de paix universelle, a tissé les hindous, les musulmans, les jaïns et les zoroastriens en une seule tapisserie impériale. Cette tradition de synthèse guide désormais notre royaume vers la sagesse et la prospérité."
 nd_mug.1.t: "Le trône moghol"
 nd_mug.1.d: "The Peacock Throne stands assembled, its gemstones catching the light of a subcontinent united under our banner. From the snowy passes of the Hindu Kush to the sweltering plains of the Ganges, our writ now runs. But what manner of empire shall this be? Babur conquered with thunder and horsemen: his legacy demands we press ever onward, subjugating all who resist the Mughal standard. Yet Akbar showed another path: a realm where Hindu and Muslim serve side by side, where the Ibadat Khana echoes with debate rather than dogma. The choice before us will define not just our reign, but the soul of the empire itself.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mug.1.a: "Nous vaincrons comme Babur a conquis !"
 nd_mug.1.b: "Nous éclairerons comme Akbar a éclairé."
 nd_mug.2.t: "Le tonnerre de Panipat"
 nd_mug.2.d: "Lorsque la petite armée de Babur affronta la vaste armée d'Ibrahim Lodi à Panipat en 1526, il déploya une arme que l'Hindoustan n'avait jamais vue utilisée de manière aussi décisive : une artillerie de campagne massée derrière une barricade de charrettes. Les éléphants et la cavalerie de Lodi se sont écrasés contre les chariots tandis que les canons moghols déchiraient leurs rangs. En une seule matinée, le sultanat de Delhi fut brisé. Nos érudits militaires étudient désormais les tactiques de Babur avec une intensité renouvelée. Allons-nous maîtriser la puissance de feu qui nous a conquis l'Inde, ou perfectionner la charge de cavalerie qui a brisé les flancs de Lodi ?"
 nd_mug.2.a: "Que nos canons secouent la terre."
 nd_mug.2.b: "Laissez nos cavaliers balayer le terrain."
 nd_mug.3.t: "Sulh-i-Kul : Paix universelle"
 nd_mug.3.d: "En 1575, l'empereur Akbar fonda l'Ibadat Khana à Fatehpur Sikri : une maison de culte où les oulémas sunnites débattaient aux côtés des brahmanes hindous, des moines jaïns, des missionnaires jésuites et des prêtres zoroastriens. De ces discussions a émergé le sulh-i-kul, la doctrine de paix universelle d'Akbar. Il abolit la jizya, nomma les hindous aux plus hauts mansabs et déclara qu'aucun homme ne devrait être agressé en raison de sa foi. Les érudits de l’empire sont désormais aux prises avec les implications de cette situation. Devrions-nous adopter cette tolérance radicale comme philosophie de gouvernement, ou canaliser l’énergie de la réforme vers le renforcement du nerf de l’État ?"
 nd_mug.3.a: "Toutes les confessions trouveront refuge sous notre auvent."
 nd_mug.3.b: "La réforme renforcera la main du Padshah."
 nd_mug.4.t: "La grande route nationale"
 nd_mug.4.d: "S'étendant sur plus de trois mille kilomètres de Chittagong, dans la baie du Bengale, jusqu'à Kaboul, dans les hauts plateaux afghans, la Grand Trunk Road constitue l'épine dorsale de l'empire moghol. Construit à l'origine par Sher Shah Suri et agrandi sous la domination moghole, il relie les plus grandes villes de l'empire (Delhi, Agra, Lahore, Peshawar) via un réseau de sarais, de caravansérails et de gares de péage. Les marchands parcourent toute la longueur du pays en transportant de la mousseline de Dhaka, des épices du Gujarat, des chevaux d'Asie centrale et de l'argent du Bengale. Nos ingénieurs ont maintenant achevé des améliorations majeures du système routier, établissant des réseaux de relais impériaux qui accélèrent à la fois le commerce et le mouvement des décrets impériaux."
 nd_mug.4.a: "La route unit l’empire."
 STATIC_MODIFIER_NAME_nd_mug_panipat_gunpowder: "L'héritage de Panipat : la puissance de feu"
 STATIC_MODIFIER_DESC_nd_mug_panipat_gunpowder: "Notre corps d'artillerie perpétue l'innovation dévastatrice qui a remporté la bataille de Panipat."
 STATIC_MODIFIER_NAME_nd_mug_panipat_cavalry: "L'héritage de Panipat : les cavaliers"
 STATIC_MODIFIER_DESC_nd_mug_panipat_cavalry: "Notre cavalerie incarne la tactique d'encerclement rapide qui a brisé l'armée de Lodi à Panipat."
 STATIC_MODIFIER_NAME_nd_mug_sulh_i_kul_peace: "Sulh-i-Kul : Paix avec tous"
 STATIC_MODIFIER_DESC_nd_mug_sulh_i_kul_peace: "La doctrine d'Akbar sur la tolérance universelle attire la loyauté de divers peuples à travers le sous-continent."
 STATIC_MODIFIER_NAME_nd_mug_sulh_i_kul_reform: "Sulh-i-Kul : Réforme impériale"
 STATIC_MODIFIER_DESC_nd_mug_sulh_i_kul_reform: "L'énergie des réformes d'Akbar a été canalisée vers le renforcement de l'administration impériale et de l'autorité de la couronne."
 nd_mug_timurid_legacy: "L'héritage timuride"
 nd_mug_timurid_legacy_desc: "Les Moghols font remonter leur lignée à Timur et Gengis Khan : un héritage de conquêtes à cheval et d'ambition impériale qui a façonné leur approche de la direction de l'Hindoustan."
 nd_mug_chagatai_court: "Culture de la cour de Chagatai"
 nd_mug_chagatai_court_desc: "Les Moghols ont apporté la tradition littéraire persane raffinée des cours Chagatai en Inde, établissant une culture cosmopolite de poésie, de calligraphie et d'étiquette courtoise."
 nd_mug_central_asian_horsemanship: "Équitation d’Asie centrale"
 nd_mug_central_asian_horsemanship_desc: "Les traditions steppiques d'élevage de chevaux et de guerre à cheval que les Moghols rapportaient d'Asie centrale leur donnaient un avantage durable sur les plaines de l'Hindoustan."
 nd_mug_persian_admin: "Patrimoine administratif persan"
 nd_mug_persian_admin_desc: "La bureaucratie moghole s'est largement inspirée des modèles persans de gouvernance : le système du diwan, les registres des revenus fonciers et une classe professionnelle d'administrateurs écrivant en écriture persane."
 nd_mug_sufi_devotion: "Tradition dévotionnelle soufie"
 nd_mug_sufi_devotion_desc: "Les saints soufis et leurs khanqahs ont servi de ponts entre l'Islam et le paysage spirituel diversifié de l'Inde, gagnant des convertis par la dévotion et la poésie plutôt que par la force."
 nd_mug_gunpowder_revolution: "La révolution de la poudre à canon de Babur"
 nd_mug_gunpowder_revolution_desc: "Le déploiement décisif par Babur de l'artillerie de campagne de style ottoman à Panipat en 1526 introduisit une nouvelle ère de guerre à poudre dans le sous-continent indien."
 nd_mug_karkhana_tradition: "Tradition Karkhana"
 nd_mug_karkhana_tradition_desc: "Les karkhanas moghols étaient des ateliers impériaux produisant de tout, des textiles et bijoux en brocart aux armes et selles, le tout sous la supervision du Mir Saman."
 nd_mug_mansabdari_origins: "Système Mansabdari"
 nd_mug_mansabdari_origins_desc: "Le système mansabdari d'Akbar attribuait des grades numériques (mansabs) aux responsables militaires et civils, déterminant leur solde, leurs obligations en matière de troupes et leur statut au sein de la hiérarchie impériale."
 nd_mug_patronage_of_learning: "Mécénat d'apprentissage"
 nd_mug_patronage_of_learning_desc: "La cour moghole a attiré des érudits, des historiens et des scientifiques du monde islamique, finançant des traductions de textes sanskrits en persan et faisant progresser l'astronomie, les mathématiques et la médecine."
 nd_mug_miniature_painting: "Peinture miniature moghole"
 nd_mug_miniature_painting_desc: "The Mughal school of miniature painting blended Persian precision with Indian vivacity, producing masterworks under the patronage of emperors from Humayun to Shah Jahan.\n\n#italic Available in: $nd_mug_karkhana$#!"
 nd_mug_urban_planning: "Urbanisme moghol"
 nd_mug_urban_planning_desc: "Les Moghols ont construit des villes planifiées (Fatehpur Sikri, Shahjahanabad) avec des jardins symétriques, des fontaines publiques, des hammams et des systèmes sophistiqués de gestion de l'eau."
 nd_mug_barqandaz_corps: "Corps de Barqandaz"
 nd_mug_barqandaz_corps_desc: "Les barqandaz étaient des mousquetaires professionnels à mèche, souvent recrutés dans des clans et des communautés spécifiques, qui constituaient l'épine dorsale de la puissance de feu de l'infanterie moghole."
 nd_mug_topkhana_corps: "Corps Topkhana"
 nd_mug_topkhana_corps_desc: "Le topkhana était le commandement centralisé de l'artillerie impériale, unique parmi les branches militaires mogholes car étant directement sous le contrôle de l'empereur plutôt que réparti entre les mansabdars."
 nd_mug_revenue_reforms: "Réformes des recettes"
 nd_mug_revenue_reforms_desc: "Le ministre des Finances d'Akbar, Todar Mal, a introduit le système zabt : une évaluation standardisée des revenus fonciers basée sur la superficie mesurée et les rendements moyens, remplaçant les tributs arbitraires par une fiscalité prévisible."
 nd_mug_sulh_i_kul: "Sulh-i-Kul"
 nd_mug_sulh_i_kul_desc: "Le principe d'Akbar du sulh-i-kul, la paix avec tous, a aboli la taxe jizya sur les non-musulmans, nommé des hindous à de hautes fonctions et créé l'Ibadat Khana pour le dialogue interreligieux."
 nd_mug_grand_trunk_road: "Grande route nationale"
 nd_mug_grand_trunk_road_desc: "La Grand Trunk Road s'étendait sur 2 500 kilomètres de Chittagong à Kaboul, reliant les marchés de l'empire par une chaîne de sarais, de péages et de caravansérails."
 nd_mug_dhaka_muslin: "Mousseline de Dacca"
 nd_mug_dhaka_muslin_desc: "The muslins of Dhaka were so fine they were called 'woven wind': a single bolt could be drawn through a finger ring. European traders paid fortunes for this fabric that no loom in the West could replicate.\n\n#italic Available in: $nd_mug_karkhana$#!"
 nd_mug_ahadi_guard: "Garde Ahadi"
 nd_mug_ahadi_guard_desc: "Les Ahadi étaient des gentlemen troopers d'élite qui servaient de garde personnelle de l'empereur, triés sur le volet pour leur habileté au maniement des armes et leur loyauté personnelle, ne répondant à aucun mansabdar sauf au Padshah lui-même."
 nd_mug_mughal_engineering: "Ingénierie moghole"
 nd_mug_mughal_engineering_desc: "Des énormes murs de grès rouge du fort d’Agra aux canaux d’eau complexes des jardins de Shalimar, les ingénieurs moghols maîtrisaient à la fois la fortification militaire et l’ingénierie hydraulique."
 nd_mug_jharokha_darshan: "Jharokha-i-Darshan"
 nd_mug_jharokha_darshan_desc: "Chaque matin, l'empereur moghol apparaissait à la fenêtre du jharokha pour recevoir la population rassemblée : un rituel qui renforçait le lien sacré entre le dirigeant et son sujet au-delà des lignes religieuses."
 nd_mug_banduqchi_reforms: "Réformes Banduqchi"
 nd_mug_banduqchi_reforms_desc: "Au fur et à mesure que l'organisation militaire européenne pénétrait en Inde, les commandants moghols adoptèrent plus tard des formations de mousquetaires plus disciplinées, les banduqchi, entraînées au tir de volée et aux manœuvres coordonnées."
 nd_mug_textile_empire: "Empire textile moghol"
 nd_mug_textile_empire_desc: "By the 18th century, Indian textiles accounted for roughly a quarter of world manufacturing output. Mughal workshops produced silk brocades, fine muslin, chintz, and calico that clothed Europe, Africa, and Southeast Asia.\n\n#italic Available in: $nd_mug_karkhana$#!"
 nd_mug_provincial_autonomy: "Gouvernance provinciale"
 nd_mug_provincial_autonomy_desc: "Les nawabs, nizams et subadars qui gouvernaient les provinces mogholes développèrent des administrations locales de plus en plus sophistiquées : une arme à double tranchant qui maintenait l’ordre tout en permettant une éventuelle autonomie."
 nd_mug_renaissance_of_letters: "Renaissance des lettres"
 nd_mug_renaissance_of_letters_desc: "Même si la puissance militaire de l'empire diminuait, ses traditions littéraires et savantes prospérèrent : la poésie ourdou, les histoires persanes et les ouvrages théologiques arabes continuèrent à émerger des cours et madrasas mogholes."
 nd_mug_indigo_opium_trade: "Commerce de l'indigo et de l'opium"
 nd_mug_indigo_opium_trade_desc: "Les plantations d'indigo et la production d'opium de l'Inde moghole sont devenues d'importantes industries d'exportation, alimentant les teintures textiles européennes et le marché asiatique en expansion de l'opium via les ports de Surat et de Calcutta."
 a_nd_mug_barqandaz: "Barqandaz"
 a_nd_mug_barqandaz_desc: "Mousquetaires professionnels à mèche recrutés dans les communautés spécialisées, les barqandaz formaient le noyau de la puissance de feu de l'infanterie moghole. Leurs volées régulières couvraient l'avancée de la cavalerie impériale."
 a_nd_mug_barqandaz_levy: "Prélèvement de Barqandaz"
 a_nd_mug_barqandaz_levy_desc: "Infanterie à mèche tirée des traditions mousquetaires de l'empire."
 a_nd_mug_topkhana: "Topkhana"
 a_nd_mug_topkhana_desc: "Le Topkhana impérial était le corps d'artillerie moghol : de lourds canons de bronze et de fer pilotés par des artilleurs spécialisés sous commandement impérial direct, dévastateurs aussi bien en siège qu'en campagne."
 a_nd_mug_ahadi: "Garde Ahadi"
 a_nd_mug_ahadi_desc: "Cavalerie d'élite assermentée personnellement à l'empereur, les Ahadi étaient des gentlemen troopers sélectionnés pour leurs compétences martiales et leur loyauté, servant de cavalerie de choc au combat et de garde du corps à cheval de l'empereur."
 a_nd_mug_ahadi_levy: "Ahadi Lévy"
 a_nd_mug_ahadi_levy_desc: "Cavalerie de la garde impériale levée de la tradition Ahadi."
 a_nd_mug_banduqchi: "Banduqchi"
 a_nd_mug_banduqchi_desc: "Infanterie de mousquetaires réformée formée aux tirs de volée de style européen et aux tactiques linéaires, les banduqchi représentaient l'adaptation de l'armée moghole à la nature changeante de la guerre au XVIIIe siècle."
 nd_mug_karkhana: "Karkhana impérial"
 nd_mug_karkhana_desc: "Un atelier géré par l'État produisant des textiles de luxe, de la ferronnerie et des armements sous la supervision impériale. Le système karkhana centralisait la production artisanale pour la cour et l'armée."
 nd_mug_karkhana_maintenance: "Opérations Karkhana"
 nd_mug_karkhana_maintenance_desc: "L'atelier impérial tisse la soie, les teintures et les tissus pour en faire des textiles raffinés destinés à la cour et à l'exportation."
 nd_mug_sarai: "Saraï impériale"
 nd_mug_sarai_desc: "Un relais fortifié le long du réseau routier impérial, offrant un abri, des chevaux frais et un accès au marché aux marchands et aux courriers officiels empruntant la Grand Trunk Road."
 nd_mug_sarai_maintenance: "Entretien de Saraï"
 nd_mug_sarai_maintenance_desc: "Approvisionnement des voyageurs en bétail, céréales et sel, et entretien du relais le long de la route impériale."
 nd_mug_maktab: "Maktab"
 nd_mug_maktab_desc: "Une école islamique élémentaire où les enfants apprennent à lire le Coran, étudient la grammaire persane et reçoivent un enseignement de base en arithmétique et en calligraphie : le fondement de l'alphabétisation moghole."
 nd_mug_maktab_maintenance: "Opérations Maktab"
 nd_mug_maktab_maintenance_desc: "Fournir du papier, des livres et des bougies en cire d'abeille pour soutenir les études à l'école."
 nd_mug_hammam: "Hammam Impérial"
 nd_mug_hammam_desc: "Des bains publics de tradition persane, servant à la fois de lieu d'hygiène et d'institution sociale où se mélangeaient toutes les classes : une marque de la civilisation urbaine moghole."
 nd_mug_hammam_maintenance: "Opérations Hammam"
 nd_mug_hammam_maintenance_desc: "Chauffage des bains publics avec du bois de chauffage, lavage au sel et fourniture de récipients en poterie pour le bain."
 nd_mug_topkhana_arsenal: "Arsenal de Topkhana"
 nd_mug_topkhana_arsenal_desc: "Une installation centralisée pour fondre des canons, fabriquer des armes à feu et stocker de la poudre à canon : l'épine dorsale logistique de la formidable arme d'artillerie de l'empire moghol."
 nd_mug_topkhana_arsenal_maintenance: "Opérations d'Arsenal"
 nd_mug_topkhana_arsenal_maintenance_desc: "La production et le stockage continus de pièces d’artillerie et de munitions impériales."
 nd_mug_muslin_weaving: "Tissage de mousseline"
 nd_mug_muslin_weaving_desc: "The legendary fine textile production of Mughal India: cotton spun and woven into cloth so delicate it was called 'woven wind.'"
 nd_mug_parchin_kari: "Parchin Kari"
 nd_mug_parchin_kari_desc: "L'art moghol de l'incrustation de pierres semi-précieuses dans le marbre : la technique derrière les superbes panneaux décoratifs du Taj Mahal et d'autres monuments impériaux."
 nd_mug_zarb_khana: "Zarb-khana impérial"
 nd_mug_zarb_khana_desc: "La monnaie impériale, où la monnaie moghole standardisée était frappée en or, argent et cuivre : l'épine dorsale d'un système monétaire qui facilitait le commerce à travers le sous-continent."
 nd_mug_zarb_khana_maintenance: "Opérations de frappe"
 nd_mug_zarb_khana_maintenance_desc: "Traitement de l'argent et du cuivre avec des outils de frappe pour produire une monnaie impériale standardisée."
 nd_mug_silk_brocade: "Tissage De Brocart De Soie"
 nd_mug_silk_brocade_desc: "The luxury production of silk brocades interwoven with gold and silver thread: a hallmark of Mughal court fashion and a prized export commodity."
 levy_nd_mug_ahadi: "Prélèvement de la garde Ahadi"
 levy_nd_mug_ahadi_desc: "Cavalerie de famille d'élite issue de la tradition Ahadi : des gentleman troopers assermentés directement devant l'empereur, servant à la fois de garde du corps et de cavalerie de choc."
 levy_nd_mug_barqandaz: "Prélèvement de Barqandaz"
 levy_nd_mug_barqandaz_desc: "Mousquetaires à mèche recrutés dans les communautés barqandaz de l'empire : la puissance de feu constante de l'infanterie qui ancrait les lignes de bataille mogholes."
 nd_mug_formed_tt: "L'empire moghol a été formé"
 nd_mug_path_a_tt: "Choisissez l'épée de Babur"
 nd_mug_path_b_tt: "Choisissez la lumière d'Akbar"
 nd_mug_destiny: "Destin des Moghols"
 nd_mug_destiny_desc: "L'empire moghol a été proclamé. Que nous poursuivions la voie de la conquête ou de l’illumination, la stabilité du royaume doit d’abord être assurée avant de pouvoir façonner son destin."
 nd_mug_dest_deccan: "Soumettre le Deccan"
 nd_mug_dest_deccan_desc: "Les sultanats du Deccan de Golconde et de Bijapur constituent des puissances indépendantes sur notre frontière sud. Pour réaliser l'héritage de conquête de Babur, nous devons les soumettre aux normes mogholes et sécuriser les richesses du sud."
 nd_mug_dest_bengal: "Conquérir le Bengale"
 nd_mug_dest_bengal_desc: "The rich delta of Bengal (Sonargaon, Chittagong) controls access to the Bay of Bengal and produces the finest textiles in the world. A conquering empire must seize this wealth: the two ports and half of the province."
 nd_mug_dest_bengal_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in Bengal"
 nd_mug_dest_agra_developed_tt: "We own #bold Agra#! and its development is at least #bold 54#!"
 nd_mug_dest_delhi_developed_tt: "We own #bold Delhi#! and its development is at least #bold 82#!"
 nd_mug_dest_timur: "Récupérez le cœur du Timuride"
 nd_mug_dest_timur_desc: "Babur a pleuré Samarkand, le joyau perdu par sa famille. L'ambition ultime de la dynastie moghole est de récupérer les capitales ancestrales des Timurides (Samarkand, Herat et Kandahar) et d'unir l'empire de Timur à l'empire de l'Hindoustan."
 nd_mug_dest_gujarat: "Le joyau du Gujarat"
 nd_mug_dest_gujarat_desc: "Le Gujarat et son grand port de Surat sont la porte d'entrée du commerce de l'océan Indien. Sécuriser cette région et établir la soie sur nos marchés jettera les bases commerciales d’un empire prospère."
 nd_mug_dest_workshop: "Atelier du Monde"
 nd_mug_dest_workshop_desc: "India produces a quarter of the world's manufactured goods. To realize this potential, the empire must embrace modern financial institutions and build up Agra, the seat of the imperial workshops, into a great city."
 nd_mug_dest_padshah: "Padshah-i-Hind"
 nd_mug_dest_padshah_desc: "The title Padshah-i-Hind, Emperor of All India, remains aspirational until the Mughal writ runs from the Malabar Coast to the tip of the subcontinent. Madurai and Kozhikode must acknowledge our supremacy, and Delhi must be rebuilt as a capital worthy of the title."
 nd_mug.5.t: "Le destin des Moghols"
 nd_mug.5.d: "Le trône moghol est sécurisé, le royaume en paix. De Delhi à Lahore, d’Agra aux cols montagneux, notre parole fait loi. Mais un grand empire ne reste pas immobile : il grandit ou il dépérit. La question n’est plus de savoir si nous agirons, mais dans quelle direction notre ambition nous mènera."
 nd_mug.5.a: "Notre destin nous attend."
 nd_mug.6.t: "Le Deccan mis au pas"
 nd_mug.6.d: "Les sultanats du Deccan, ces fiers vestiges du royaume bahmani, ont enfin été placés sous l'autorité moghole. Golconde avec ses mines de diamants et Bijapur avec ses champs fertiles rendent désormais hommage au trône du paon. Nos armées ont prouvé que les barrières montagneuses du centre de l’Inde ne constituent pas une défense contre la détermination moghole."
 nd_mug.6.a: "Le sud plie le genou."
 nd_mug.7.t: "La conquête du Bengale"
 nd_mug.7.d: "Le Bengale est tombé aux mains de Mughal. Le grand delta du fleuve (source des mousselines les plus fines, des récoltes de riz les plus riches et accès aux mers orientales) est à nous. Nos généraux débattent désormais de la meilleure façon de consolider ces conquêtes. Certains préconisent une poigne de fer : une expansion agressive alimentée par le butin de guerre. D’autres préconisent la construction de routes militaires et de chaînes d’approvisionnement qui permettront de soutenir de nouvelles campagnes sur les vastes distances de l’empire."
 nd_mug.7.a: "Laissez l'épée parler au nom de l'empire."
 nd_mug.7.b: "Construisez les routes qui alimentent les armées."
 nd_mug.8.t: "Le retour à Samarcande"
 nd_mug.8.d: "Enfin, un empereur moghol se dresse dans le Registan de Samarkand, réalisant le rêve que Babur a porté dans sa tombe. Les terres ancestrales de Timur, des minarets d'Herat à la forteresse de Kandahar, arborent à nouveau l'étendard moghol. C'est le sommet de l'empire, l'union de deux mondes : la civilisation raffinée de l'Hindoustan unie à l'héritage martial de l'Asie centrale. Comment allons-nous exercer ce pouvoir sans précédent ?"
 nd_mug.8.a: "Nous sommes les conquérants du monde."
 nd_mug.8.b: "Nous sommes les empereurs d’une époque."
 nd_mug.9.t: "Gujarat sécurisé"
 nd_mug.9.d: "Le port de Surat arbore désormais l'étendard moghol et, avec lui, le commerce de la mer d'Arabie afflue dans notre trésor. Les communautés marchandes du Gujarat (banias hindous, bohras musulmans, commerçants parsis) apportent les biens du monde à nos portes. La soie, les épices et l'argent changent de mains sur des marchés animés qui génèrent des richesses au-delà de ce que la conquête seule pourrait jamais rapporter."
 nd_mug.9.a: "Les richesses du monde passent entre nos mains."
 nd_mug.10.t: "L'Ascendant de l'Atelier"
 nd_mug.10.d: "Les artisans et marchands indiens ont fait de l’Empire moghol le centre manufacturier du monde connu. Nos textiles habillent l'Europe et l'Afrique, nos teintures indigo colorent leurs tissus, et nos épices assaisonnent leurs tables. La question est de savoir comment entretenir au mieux ce miracle économique. Allons-nous poursuivre la synthèse culturelle : attirer à notre service les meilleurs esprits de chaque tradition ? Ou devons-nous responsabiliser nos guildes d’artisans et ouvrir nos marchés au monde ?"
 nd_mug.10.a: "Synthèse de toutes les traditions sous notre toit."
 nd_mug.10.b: "Laissez nos artisans commercer librement avec le monde."
 nd_mug.11.t: "Padshah-i-Hind"
 nd_mug.11.d: "Des cols enneigés du Cachemire à la côte bordée de palmiers de Malabar, des bazars de Surat aux temples de Madurai : tout le sous-continent indien reconnaît l'empereur moghol comme Padshah-i-Hind, empereur de toute l'Inde. Aucun royaume au monde ne possède une telle richesse, une telle diversité de peuples ou une telle profondeur de civilisation. La cour moghole débat maintenant de la manière de consacrer cette réalisation. Allons-nous construire un empire d’harmonie spirituelle où toutes les confessions s’épanouissent sous notre protection ? Ou allons-nous devenir le grand marché du monde, où toutes les nations viennent faire du commerce ?"
 nd_mug.11.a: "Un empire d'harmonie sous le ciel."
 nd_mug.11.b: "Le marché de toutes les nations."
 STATIC_MODIFIER_NAME_nd_mug_dest_iron_fist: "La poigne de fer"
 STATIC_MODIFIER_DESC_nd_mug_dest_iron_fist: "L’élan de conquête nous fait avancer. Les guerres se déclarent rapidement et l'épuisement des campagnes pèse moins lourd sur un peuple habitué à la victoire."
 STATIC_MODIFIER_NAME_nd_mug_dest_iron_road: "La route du fer"
 STATIC_MODIFIER_DESC_nd_mug_dest_iron_road: "Les routes militaires et les dépôts de ravitaillement soutiennent nos armées sur de vastes distances, même si l’accent mis sur la logistique laisse moins de place aux subtilités diplomatiques."
 STATIC_MODIFIER_NAME_nd_mug_dest_conqueror: "Conquérant du monde"
 STATIC_MODIFIER_DESC_nd_mug_dest_conqueror: "La machine militaire moghole fonctionne avec une efficacité dévastatrice : elle prend d’assaut les forteresses, exploite les avantages et mène les batailles à une conclusion rapide."
 STATIC_MODIFIER_NAME_nd_mug_dest_emperor: "Empereur d'un siècle"
 STATIC_MODIFIER_DESC_nd_mug_dest_emperor: "L'ampleur et la portée administrative de l'empire lui permettent de déployer de vastes armées tout en minimisant le gaspillage lié aux campagnes sur des terrains diversifiés."
 STATIC_MODIFIER_NAME_nd_mug_dest_synthesis: "Synthèse impériale"
 STATIC_MODIFIER_DESC_nd_mug_dest_synthesis: "La cour moghole attire des érudits, des artistes et des mystiques de toutes les traditions, rayonnant d'influence culturelle dans toute la région : même si le maintien de cette cour cosmopolite n'est pas bon marché."
 STATIC_MODIFIER_NAME_nd_mug_dest_artisans: "Liberté artisanale"
 STATIC_MODIFIER_DESC_nd_mug_dest_artisans: "Libérés des monopoles de guilde restrictifs, les artisans moghols innovent et commercent ouvertement, favorisant la reprise et la croissance sur les marchés de l'empire."
 STATIC_MODIFIER_NAME_nd_mug_dest_golden_age: "L'âge d'or de l'harmonie"
 STATIC_MODIFIER_DESC_nd_mug_dest_golden_age: "The Mughal Empire stands as a beacon of interfaith harmony. Under the emperor's protection, mosques, temples, and churches flourish side by side. Subjects of other faiths are content, and converts are drawn through persuasion rather than coercion."
 STATIC_MODIFIER_NAME_nd_mug_dest_world_market: "Marché mondial"
 STATIC_MODIFIER_DESC_nd_mug_dest_world_market: "L'Empire moghol est devenu la plaque tournante du commerce mondial, gérant de vastes réseaux commerciaux qui nécessitent des instruments financiers sophistiqués. Et les coûts qui vont avec."
 nd_mug_elephant_battery: "Batterie d'éléphants de guerre"
 nd_mug_elephant_battery_desc: "Une installation interarmes où les éléphants de guerre sont entraînés aux côtés des équipages d'artillerie, créant les plates-formes de canons dévastatrices montées sur des éléphants qui étaient une caractéristique de l'innovation militaire moghole."
 nd_mug_elephant_battery_maintenance: "Entretien de la batterie des éléphants"
 nd_mug_elephant_battery_maintenance_desc: "Entretenir les éléphants de guerre, leurs howdahs blindés, les canons qu'ils portent et les harnais en cuir qui relient le tout."
 nd_mug_diwan_i_am: "Diwan-je-Suis"
 nd_mug_diwan_i_am_desc: "La salle de l'audience publique : un grand pavillon où l'empereur est assis sur un trône élevé pour rendre la justice, recevoir des pétitions et afficher la magnificence de la souveraineté moghole à tous ceux qui se présentent devant le trône du paon."
 nd_mug_diwan_i_am_maintenance: "Opérations de la salle d’audience"
 nd_mug_diwan_i_am_maintenance_desc: "Entretenir la splendeur de la salle d'audience impériale avec des textiles raffinés, des documents administratifs, des meubles sculptés et de l'encens parfumé."
 mug_mansabdari_bureaucracy: "Mansabdari"
 mug_mansabdari_bureaucracy_desc: "L'aristocratie militaire de haut niveau d'Akbar, instituée en 1574 et raffinée sous Shah Jahan et Aurangzeb. Chaque officier de l'empire détient un double grade (zat (son niveau de salaire personnel) et sawar (le contingent de cavalerie qu'il est obligé de maintenir)) avec des grades allant de mansabdar de dix aux grands commandants de sept mille. Le système associe les traditions des bandes de guerre perses et turques à un État payé de manière centralisée, transformant la noblesse entière en officiers du trône rotatifs, transférables et révocables. Son déclin à la fin du XVIIe siècle (rouleaux de papier gonflés, pénurie de jagir, factions à la cour) est l’histoire classique de l’effondrement de la fin de l’ère moghole."
 mug_dahsala_bureaucracy: "Colonie de Dahsala"
 mug_dahsala_bureaucracy_desc: "Raja Todar Mal's ten-year revenue system, the Ain-i-Dahsala promulgated in 1582, which fixes the land-tax for a decade on the average crop-yield of the previous ten years, expressed in silver dams and converted to rupees. It is the first uniform, centrally-audited, cash-based revenue survey on the subcontinent, measured in the field by karoris (crown agents who survey holdings in bighas of the imperial standard). Predictable assessment breaks the bargaining power of the zamindars and feeds the imperial treasury without fail, but it leaves the peasant raiyat at the mercy of a rigid silver schedule when the harvest fails."
 mug_diwan_i_khalsa_bureaucracy: "Diwan-i-Khalsa"
 mug_diwan_i_khalsa_bureaucracy_desc: "Le trésor des terres de la couronne impériale, distinct du Diwan-i-Tan qui paie les salaires des mansabdar. Le territoire de Khalsa est détenu en domaine direct (jamais attribué en tant que jagir) avec des revenus allant directement à la hazana impériale sous le contrôle du Diwan-i-Ala. Akbar a considérablement augmenté la part de la khalsa au détriment de la cession; Les guerres du Deccan d'Aurangzeb inversent la tendance, affamant les khalsa pour nourrir leurs obligations de jagir. La taille de la khalsa en tant que fraction du royaume est un cadran direct entre le pouvoir central et le pouvoir aristocratique, et les umara le savent."
 mug_jagirdari_bureaucracy: "Jagirdari"
 mug_jagirdari_bureaucracy_desc: "The assignment of revenue-rights over a tract of land to a mansabdar in lieu of cash salary, transferable at the emperor's pleasure, typically every three to four years. By Akbari design jagirs are never hereditary; the rotation prevents the nobility from striking local roots and keeps the umara dependent on the throne's continuing favour. By the late Aurangzeb period the empire fields more mansabdars than there are jagirs to assign, the bejagiri crisis that produces the factionalism consuming the eighteenth century. The system rewards the noble class while transferring the cost of overextraction onto the peasant of a holding the assignee will soon leave."
 mug_mir_bakshi_bureaucracy: "Bureau de Mir Bakshi"
 mug_mir_bakshi_bureaucracy_desc: "Le payeur général de l'empire, chef du Diwan-i-Arz, qui gère le dagh (marquage des chevaux) et le chehra (rôle descriptif de chaque soldat et de sa monture) sur lesquels le système s'appuie pour empêcher les mansabdars de présenter des chevaux empruntés au rassemblement. Le Mir Bakshi audite le contingent de chaque officier, dirige le service de renseignement impérial composé de waqia-navis (rédacteurs d'événements) qui rend compte quotidiennement de chaque subah et présente les officiers à l'empereur pour promotion. Un Mir Bakshi fonctionnel fait la différence entre l’armée promise par les rouleaux de papier et l’armée que le trône peut réellement déployer à Panipat."
 mug_karkhana_bureaucracy: "Karkhanas impériaux"
 mug_karkhana_bureaucracy_desc: "Le réseau d'usines gérées par l'État - trente-huit à la mort d'Akbar, selon Ain-i-Akbari d'Abu'l-Fazl - qui produit des armes, des armures, des textiles raffinés, des bijoux, des manuscrits enluminés et les splendides objets de cour qui définissent la majesté moghole. Le Buyutat-i-Khas les administre sous le Khan-i-Saman, maître de la maison impériale ; des tisserands du Gujarat, des calligraphes d'Iran et des tailleurs de pierres précieuses de Golkonda sont amenés à Agra et à Delhi pour les recruter. Les karkhanas standardisent la qualité dans tout l'empire et absorbent les meilleures mains des bazars, mais leurs contrats d'approvisionnement privilégiés et leurs maîtres enrôlés étouffent les guildes urbaines libres de l'Hindoustan."
 mug_sadr_us_sudur_bureaucracy: "Sadr-us-Sudur"
 mug_sadr_us_sudur_bureaucracy_desc: "Sadr en chef de l'empire, juge suprême en matière de droit islamique et superviseur des subventions de subsistance madad-i-maash - des terres gratuites aux érudits, sayyids, mosquées et madrasas, et après les réformes d'Akbar également aux temples hindous et aux ascètes jaïns. Sous Akbar et Jahangir, le bureau est un véhicule de la politique sulh-i-kul (paix universelle), distribuant le patronage au clergé non musulman aux côtés des oulémas. Sous Aurangzeb, il revient à une orientation hanafite plus stricte, révoquant de nombreuses subventions antérieures. Le cadran de tolérance du sadr détermine directement la relation de l'empire avec ses sujets hindous, jaïns, sikhs et chrétiens."
 mug_jharokha_i_darshan_bureaucracy: "Jharokha-i-Darshan"
 mug_jharokha_i_darshan_bureaucracy_desc: "The daily public-audience ritual instituted by Akbar at the eastern jharokha, the latticed window of the imperial palace overlooking the Yamuna at Agra. Every dawn the Padshah presents himself to the assembled crowd, dispenses instant justice on petitions called up from the throng, and demonstrates by his sheer regular visibility that the throne is alive, watching, and approachable. Aurangzeb suspends the practice in his eleventh regnal year as un-Islamic quasi-divine display; contemporaries mark the suspension as the moment the throne loses its direct line to the people. The ritual bypasses the wakil and the umara hierarchy entirely."
 AUTO_MODIFIER_NAME_nd_mug_bureaucracy_authority: "Diwans impériaux de l'Hindoustan"
 AUTO_MODIFIER_DESC_nd_mug_bureaucracy_authority: "The Mughal Padshah commands the most elaborate administrative apparatus on the subcontinent: a layered system of diwans, bakhshis, and sadrs perfected from Akbar to Aurangzeb. The throne's authority gives room for three of the great Mughal bureaucracies, choosing which institutional hand will rule Hindustan."
