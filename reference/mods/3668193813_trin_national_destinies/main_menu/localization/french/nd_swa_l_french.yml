l_french:
 STATIC_MODIFIER_NAME_nd_swa_league_of_equals: "Ligue des égaux"
 STATIC_MODIFIER_DESC_nd_swa_league_of_equals: "Les villes de Souabe se sont liées dans une cause commune, mettant en commun leurs richesses et leurs armes pour défendre des libertés partagées contre l'ambition princière et les excès impérialistes."
 STATIC_MODIFIER_NAME_nd_swa_ducal_restoration: "Restauration Ducale"
 STATIC_MODIFIER_DESC_nd_swa_ducal_restoration: "Une main forte s'empare désormais du duché fracturé, fusionnant ses villes querelleuses et ses petits seigneurs en un État cohésif sous l'autorité princière, faisant revivre les traditions martiales des Hohenstaufen."
 nd_swa.1.t: "La question souabe"
 nd_swa.1.d: "The old Duchy of Swabia perished with the last Hohenstaufen, leaving behind a mosaic of free cities, knight-cantons, and princely territories held together only by shared language and common interest. Now that mosaic has been gathered under a single banner, but what kind of Swabia shall this be?\n\nThe cities of Augsburg, Ulm, and Memmingen have long governed themselves through councils and guilds, defending their liberties through the Swabian League. Their wealth and collective spirit made this unification possible. Yet there are those who remember that Swabia was once a stem duchy ruled by emperors, and argue that only a strong prince can hold these lands together.\n\nThe character of Swabia hangs in the balance: a confederation of free cities and cooperative estates, or a restored duchy with centralized authority.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_swa.1.a: "Nous sommes une ligue de villes libres, liées par le commerce"
 nd_swa.1.b: "La Souabe a besoin d'un duc fort pour diriger"
 nd_swa.2.t: "La maison Fugger"
 nd_swa.2.d: "What began as a modest weaving workshop in Augsburg has grown into the most powerful banking house in Christendom. The Fuggers (first Hans, then his sons and grandsons) leveraged the textile trade into a financial empire spanning from the silver mines of Tyrol to the copper fields of Hungary. Their counting houses extend credit to popes and emperors alike.\n\nJakob Fugger, called 'the Rich,' has secured mining monopolies across central Europe by offering Habsburg princes loans they cannot refuse, accepting mineral rights as collateral. His innovations in double-entry bookkeeping and international credit networks have made Augsburg the banking capital of the Empire.\n\nThe Fugger wealth is now inseparable from Swabian prosperity."
 nd_swa.2.a: "Augsbourg sera la maison de comptage de l'Europe"
 STATIC_MODIFIER_NAME_nd_swa_fugger_patronage: "Patronage Fugger"
 STATIC_MODIFIER_DESC_nd_swa_fugger_patronage: "La vaste richesse de la dynastie bancaire Fugger circule à Augsbourg, finançant des mines, des églises et des travaux publics dans toute la Souabe."
 nd_swa.3.t: "La paix d'Augsbourg"
 nd_swa.3.d: "After decades of religious strife that divided neighbor against neighbor and shattered the old Swabian League, the princes and cities of the Empire have gathered in Augsburg to settle the confessional question. The resulting peace establishes a new principle: the ruler's faith determines the faith of his land.\n\nFor Swabia, this moment carries special weight. Augsburg itself has long been home to both confessions, with Lutheran and Catholic communities sharing the same city walls in uneasy coexistence. Some Swabian cities embraced the Reformation early; others remained staunchly Catholic. The peace offers two paths: enforce confessional uniformity to strengthen state authority, or embrace the practical tolerance that Augsburg's own experience has demonstrated."
 nd_swa.3.a: "Cuius regio, eius religio : une foi, un royaume"
 nd_swa.3.b: "Laissez l'exemple d'Augsbourg nous guider vers la coexistence"
 STATIC_MODIFIER_NAME_nd_swa_cuius_regio: "Cuius Regio, Eius Religio"
 STATIC_MODIFIER_DESC_nd_swa_cuius_regio: "Le principe de la colonie d'Augsbourg confère au dirigeant l'autorité sur la foi de ses sujets, renforçant ainsi le contrôle central et l'uniformité religieuse."
 STATIC_MODIFIER_NAME_nd_swa_augsburg_coexistence: "Coexistence à Augsbourg"
 STATIC_MODIFIER_DESC_nd_swa_augsburg_coexistence: "La longue tradition de gouvernance biconfessionnelle d'Augsbourg devient un modèle pour le royaume, favorisant la tolérance et attirant des marchands de toutes confessions."
 nd_swa.4.t: "La Ligue entre sur le terrain"
 nd_swa.4.d: "The Swabian League, that great alliance of cities, princes, and knights, has proven itself not merely a diplomatic instrument but a formidable military force. When peasant armies rose across the southwest in revolt against tithes and serfdom, and when robber barons terrorized the trade roads, the League mustered its contingents and marched.\n\nUnder the command of Georg Truchsess von Waldburg, the League's army (drawn from dozens of member states, each contributing their quota of pike, horse, and cannon) crushed the rebel forces with methodical efficiency. The collective military capacity of the League has been proven beyond doubt."
 nd_swa.4.a: "La force de la Ligue réside dans son unité"
 nd_swa_formed_tt: "La Souabe est formée"
 nd_swa_path_a_tt: "La Souabe suit le chemin de la Ligue des égaux"
 nd_swa_path_b_tt: "La Souabe suit le chemin de la restauration ducale"
 nd_swa_dest_augsburg_developed_tt: "We own #bold Augsburg#! and its development is at least #bold 54#!"
 nd_swa_dest_stuttgart_developed_tt: "We own #bold Stuttgart#! and its development is at least #bold 53#!"
 nd_swa_hohenstaufen_legacy: "L'héritage de Hohenstaufen"
 nd_swa_hohenstaufen_legacy_desc: "Le souvenir de la grande dynastie des Staufer (Frédéric Barberousse, Henri VI, Frédéric II) confère prestige et poids culturel à tous ceux qui revendiquent la Souabe comme la leur."
 nd_swa_urban_league_tradition: "Tradition de la Ligue urbaine"
 nd_swa_urban_league_tradition_desc: "La longue pratique des villes souabes de s'unir en ligues pour une défense mutuelle et un avantage commercial, depuis la première ligue de 1376 jusqu'à la grande alliance de 1488."
 nd_swa_fortified_towns: "Villes fortifiées"
 nd_swa_fortified_towns_desc: "Les villes libres souabes ont investi massivement dans des murs, des tours et la formation de milices pour protéger leurs libertés contre l'agression princière."
 nd_swa_fustian_industry: "Industrie de la Fustienne"
 nd_swa_fustian_industry_desc: "Le tissage de la futaine, un mélange de coton et de lin, fit d'Augsbourg et d'Ulm les capitales textiles de l'Empire, avec une production atteignant dix mille pièces par an."
 nd_swa_imperial_knights: "Chevaliers impériaux de Souabe"
 nd_swa_imperial_knights_desc: "Les cantons chevaliers souabes maintenaient une tradition militaire indépendante de tout prince, prêtant directement allégeance à l'empereur."
 nd_swa_fugger_banking: "Banque Fugger"
 nd_swa_fugger_banking_desc: "La famille Fugger d'Augsbourg a construit la banque la plus puissante d'Europe, finançant les Habsbourg et les papes grâce à des crédits innovants garantis par des concessions minières."
 nd_swa_augsburg_metalworking: "Travail des métaux à Augsbourg"
 nd_swa_augsburg_metalworking_desc: "La guilde des armuriers et des forgerons d'Augsbourg est devenue célèbre dans toute l'Europe pour la qualité de ses armures de plaques et de ses armes blanches."
 nd_swa_league_collective_defense: "Ligue Défense Collective"
 nd_swa_league_collective_defense_desc: "The 1488 Swabian League formalized mutual defense among cities, knights, and princes, creating a federal army of 13,000 men governed by a council of three colleges. Every member owed a fixed quota of paid foot."
 nd_swa_cannon_foundries: "Fonderies de canons d'Augsbourg"
 nd_swa_cannon_foundries_desc: "La maîtrise d'Augsbourg dans la fonte du bronze et du fer s'étend naturellement à la production de pièces d'artillerie, fournissant des trains de siège à la Ligue comme à l'Empereur."
 nd_swa_circle_administration: "Administration du Cercle"
 nd_swa_circle_administration_desc: "Le système du Cercle Impérial, formalisé sous Maximilien Ier, donna à la Souabe un cadre administratif pour la perception des impôts, les prélèvements militaires et le maintien de la paix."
 nd_swa_social_welfare: "Traditions de protection sociale"
 nd_swa_social_welfare_desc: "La fondation par Jakob Fugger de la Fuggerei en 1521 (le premier complexe de logements sociaux au monde) illustre la tradition souabe de charité civique et de bien-être urbain."
 nd_swa_league_warcraft: "Ligue Warcraft"
 nd_swa_league_warcraft_desc: "La Ligue Souabe a prouvé sa valeur militaire en écrasant la Grande Guerre des Paysans de 1524-26 et en battant une alliance de barons voleurs lors de la guerre de Franconie."
 nd_swa_confessional_coexistence: "Coexistence confessionnelle"
 nd_swa_confessional_coexistence_desc: "La gouvernance biconfessionnelle d’Augsbourg (luthériens et catholiques partageant les fonctions civiques et les bâtiments religieux) est devenue un modèle de tolérance pratique dans un empire divisé."
 nd_swa_fine_cloth_manufactory: "Manufacture de tissus fins"
 nd_swa_fine_cloth_manufactory_desc: "The evolution of Swabian textiles from basic fustian to luxury fine cloth, as Augsburg's six thousand weavers refined their craft to compete with Italian and Flemish masters.\n\n#italic Available in: $nd_swa_webhaus$#!"
 nd_swa_military_reforms: "Réformes militaires souabes"
 nd_swa_military_reforms_desc: "La modernisation des contingents militaires du Cercle souabe en forces permanentes professionnelles, entraînées à la tactique du brochet et du tir dont le Landsknechte avait été le pionnier."
 nd_swa_augsburg_printing: "Presses à imprimer d'Augsbourg"
 nd_swa_augsburg_printing_desc: "Augsburg became one of the leading centers of printing in the Empire, producing religious tracts, commercial manuals, and illustrated books that spread across Europe."
 nd_swa_princely_splendor: "Splendeur princière"
 nd_swa_princely_splendor_desc: "La richesse des dynasties marchandes et des maisons princières de Souabe s'exprimait dans de magnifiques palais, églises et collections d'art qui rivalisaient avec celles de l'Empire."
 nd_swa_standing_kreis_army: "Armée permanente du Kreis"
 nd_swa_standing_kreis_army_desc: "Le Cercle souabe maintenait des forces militaires permanentes pour se défendre contre les menaces françaises et ottomanes, passant de contingents de la Ligue à des armées professionnelles permanentes."
 nd_swa_commercial_code: "Code de commerce"
 nd_swa_commercial_code_desc: "Les villes souabes ont codifié le droit commercial régissant les contrats, les partenariats et les dettes, offrant ainsi une sécurité juridique qui a attiré les commerçants de toute l'Europe."
 nd_swa_enlightenment_scholarship: "Bourse des Lumières"
 nd_swa_enlightenment_scholarship_desc: "L'Université de Tübingen et d'autres institutions souabes sont devenues des centres de pensée des Lumières, produisant des philosophes, des scientifiques et des juristes de renom."
 nd_swa_industrial_textiles: "Textiles industriels"
 nd_swa_industrial_textiles_desc: "La mécanisation de la production textile souabe, alors que les moulins à eau et les premières usines ont transformé l'ancienne tradition du tissage en industrie moderne."
 nd_swa_civic_nationalism: "Nationalisme civique"
 nd_swa_civic_nationalism_desc: "Les traditions démocratiques urbaines de Souabe ont façonné une forme particulière de nationalisme civique enraciné dans l'autonomie gouvernementale, la solidarité des corporations et la souveraineté populaire."
 nd_swa_autonomy_heritage: "Patrimoine de l'autonomie"
 nd_swa_autonomy_heritage_desc: "Même si la médiatisation napoléonienne absorbait les villes libres et les petits États de Souabe, la tradition de l'autonomie locale et de l'autogouvernance persistait dans les institutions civiques."
 nd_swa_industrial_modernization: "Modernisation industrielle"
 nd_swa_industrial_modernization_desc: "Le Wurtemberg a conduit la Souabe dans l'ère industrielle, ses traditions de travail des métaux et d'ingénierie évoluant vers une production manufacturière et d'armement moderne."
 a_nd_swa_bundschuh_militia: "Milice du Bundschuh"
 a_nd_swa_bundschuh_militia_desc: "Milice urbaine issue des guildes et des citoyens des villes libres souabes, entraînée à défendre leurs murs et leurs libertés contre les nobles agressions."
 a_nd_swa_kreisinfanterie: "Kreisinfanterie"
 a_nd_swa_kreisinfanterie_desc: "Infanterie professionnelle du Cercle impérial souabe, organisée dans le cadre des obligations militaires collectives des États membres du Cercle."
 a_nd_swa_reiter: "Reiter souabe"
 a_nd_swa_reiter_desc: "Cavalerie lourde issue des chevaliers impériaux des cantons souabes, combattant dans le rôle de choc traditionnel à cheval."
 a_nd_swa_bundesknechte: "Bundesknechte"
 a_nd_swa_bundesknechte_desc: "Paid foot of the Swabian League, sent by each member according to its quota and armoured in Augsburg and Ulm harness. From such Swabian Knechte the first Landsknechte were raised."
 a_nd_swa_augsburg_bombard: "Bombardier d'Augsbourg"
 a_nd_swa_augsburg_bombard_desc: "Artillerie de siège lourde fabriquée dans les fonderies renommées d'Augsbourg, construite avec le même savoir-faire en métallurgie qui a produit les meilleures armures d'Europe."
 levy_nd_swa_bundschuh_militia: "Prélèvement de la milice du Bundschuh"
 levy_nd_swa_bundschuh_militia_desc: "Milice levée auprès des guildes et des citoyens des villes libres souabes."
 levy_nd_swa_kreisinfanterie: "Prélèvement du Kreisinfanterie"
 levy_nd_swa_kreisinfanterie_desc: "Infanterie de cercle levée auprès des États membres du Cercle impérial souabe."
 levy_nd_swa_reiter: "Prélèvement Souabe Reiter"
 levy_nd_swa_reiter_desc: "Cavalerie lourde levée auprès des chevaliers impériaux des cantons souabes."
 nd_swa_webhaus: "Maison Web"
 nd_swa_webhaus_desc: "Une salle de tissage souabe où les maîtres de guilde supervisent la production de futaine et de tissus fins, perpétuant les traditions textiles d'Augsbourg et d'Ulm."
 nd_swa_handelskontor: "Bureau de vente"
 nd_swa_handelskontor_desc: "Un bureau commercial du réseau de la Ligue Souabe, coordonnant l'activité commerciale et représentant les intérêts collectifs des marchands alliés."
 nd_swa_fuggerhaus: "Maison Fugger"
 nd_swa_fuggerhaus_desc: "Une maison bancaire et comptable dans la tradition Fugger, gérant le crédit, les échanges et les investissements pour les dynasties marchandes d'Augsbourg."
 nd_swa_zeughaus: "Zeughaus"
 nd_swa_zeughaus_desc: "Un arsenal souabe où les métallurgistes d'Augsbourg forgent des armes et des armures pour les forces militaires de la Ligue."
 nd_swa_fuggerei: "Fuggerei"
 nd_swa_fuggerei_desc: "Un ensemble de logements sociaux calqué sur la fondation pionnière de Jakob Fugger à Augsbourg, offrant des logements abordables aux ouvriers et artisans."
 nd_swa_fustian_weaving: "Tissage Fustienne"
 nd_swa_fustian_weaving_desc: "La production de futaine à partir de coton importé et de laine locale, fondement de la richesse textile souabe."
 nd_swa_fine_cloth_production: "Production de tissus fins"
 nd_swa_fine_cloth_production_desc: "Fabrication textile raffinée produisant des tissus fins de luxe à partir de tissus de base souabes et de colorants importés."
 nd_swa_webhaus_maintenance: "Entretien de la salle de tissage"
 nd_swa_webhaus_maintenance_desc: "Entretien des métiers à tisser, des cuves de teinture et de la main d'œuvre qualifiée d'un atelier de tissage souabe."
 nd_swa_league_commerce: "Ligue Commerce"
 nd_swa_league_commerce_desc: "Les opérations commerciales d'un bureau commercial de la Ligue Souabe, coordonnant le commerce à travers le réseau des villes alliées."
 nd_swa_banking_operations: "Opérations bancaires"
 nd_swa_banking_operations_desc: "Les opérations financières d'un comptoir de style Augsbourg, gérant le crédit, les échanges et les investissements."
 nd_swa_formschneiderei: "Formschneiderei"
 nd_swa_formschneiderei_desc: "A workshop of block cutters and printers in the Augsburg manner, where pictures are cut in pearwood, printed beside the text, and coloured by hand."
 nd_swa_illustrated_printing: "Illustrated Printing"
 nd_swa_illustrated_printing_desc: "Illustrated books and single-leaf prints are pulled from carved woodblocks on paper and coloured with dyes."
 nd_swa_arms_production: "Production d'armes"
 nd_swa_arms_production_desc: "La forge d'armes et d'armures dans les célèbres ateliers de métallurgie d'Augsbourg."
 nd_swa_fuggerei_upkeep: "Entretien de la Fuggerei"
 nd_swa_fuggerei_upkeep_desc: "Entretenir les logements, les rues et les équipements communautaires d'un établissement social de type Fuggerei."
 nd_swa_destiny: "Le destin souabe"
 nd_swa_destiny_desc: "La Souabe est unie pour la première fois depuis les Hohenstaufen. Il lui faut désormais tracer sa voie : la ligue des villes forgera-t-elle un empire commercial, ou un nouveau duc restaurera-t-il la gloire de l'ancien duché originel ?"
 nd_swa_dest_handelsverein: "Le Handelsverein"
 nd_swa_dest_handelsverein_desc: "Étendre l'influence commerciale souabe le long du Rhin en sécurisant Strasbourg et en amenant la soie sur nos marchés. Nécessite de la stabilité et le chemin de la Ligue."
 nd_swa_dest_rhine_trade: "Échange continental"
 nd_swa_dest_rhine_trade_desc: "Construisez un réseau commercial s'étendant du Rhin à la Flandre en contrôlant Bruges, en adoptant le système bancaire moderne et en amassant des richesses substantielles."
 nd_swa_dest_handelshegemonie: "Handelshegemonie"
 nd_swa_dest_handelshegemonie_desc: "Achieve commercial supremacy over Europe by controlling Venice, reaching the highest prestige, amassing vast capital, and seeing Augsburg grow into the counting house of the continent."
 nd_swa_dest_stauferreich: "Le Stauferreich"
 nd_swa_dest_stauferreich_desc: "Récupérez le cœur des anciens domaines de Hohenstaufen en conquérant Nuremberg et Fribourg. Nécessite de la stabilité et le chemin de la Restauration Ducale."
 nd_swa_dest_alpine_dominion: "Domination alpine"
 nd_swa_dest_alpine_dominion_desc: "Prenez le contrôle des cols alpins en reprenant Innsbruck aux Habsbourg, tout en construisant une formidable armée et en gagnant le respect de vos pairs."
 nd_swa_dest_imperial_crown: "La couronne impériale"
 nd_swa_dest_imperial_crown_desc: "Restore the full extent of Hohenstaufen power by conquering Milan and Prague, fielding a massive army, and building Stuttgart into a residence worthy of the crown."
 nd_swa.5.t: "Le destin souabe"
 nd_swa.5.d: "Les fragments épars de l'ancien duché ont été rassemblés dans une seule main. La Souabe revit, mais la question de savoir ce qu'elle deviendra reste sans réponse. Le chemin à parcourir est long et les choix que nous faisons aujourd’hui se répercuteront à travers les siècles."
 nd_swa.5.a: "Notre destin attend"
 nd_swa.6.t: "La connexion rhénane"
 nd_swa.6.d: "The merchants of Augsburg and Ulm have long traded along the Rhine, sending their cloth and metalwork northward to the Low Countries and the Baltic. Now, with Strasbourg in our grasp, the entire upper Rhine corridor lies open to Swabian commerce.\n\nSilk flows through our markets, dyes enrich our workshops, and Fugger silver greases the wheels of trade. The old Swabian League was a defensive alliance, but the Handelsverein we are building is something far more ambitious: a commercial confederation that will bind the cities of central Europe together through shared interest and mutual profit."
 nd_swa.6.a: "Le Rhin sera notre autoroute"
 nd_swa.7.t: "L'échange continental"
 nd_swa.7.d: "Swabian merchants now trade in the great markets of Flanders, their warehouses in Bruges bulging with cloth, copper, and silver. The banking institutions we have embraced have transformed Augsburg from a provincial weaving town into the financial crossroads of Europe.\n\nThe question now is how to consolidate this commercial supremacy. Some argue that Augsburg's spy networks and financial intelligence should be weaponized to outmaneuver rivals. Others believe that an alliance with the Hanseatic cities of the north would create an unassailable trading bloc stretching from the Mediterranean to the Baltic."
 nd_swa.7.a: "Déployer nos agents sur tous les marchés"
 nd_swa.7.b: "Forger un partenariat avec la Hanse"
 nd_swa.8.t: "La Haendelshegemonie"
 nd_swa.8.d: "Venice has fallen under Swabian influence, and with it the last great independent trading power of Europe. From the textile halls of Augsburg to the lagoons of the Adriatic, from the counting houses of Bruges to the silk markets of the East, Swabian capital flows through the veins of European commerce.\n\nThis unprecedented commercial dominion raises a fundamental question about the nature of the Swabian state. Shall the great merchant families (the Fuggers, the Welsers, the Hochstetters) formally take the reins of government as merchant princes? Or shall the markets remain truly free, open to all comers, with no single dynasty able to corner trade?"
 nd_swa.8.a: "Laissons les grandes maisons gouverner pendant qu'elles font du commerce"
 nd_swa.8.b: "Les marchés libres servent tout le monde, pas seulement quelques-uns"
 nd_swa.9.t: "Le Stauferreich renaît"
 nd_swa.9.d: "The banner of the Hohenstaufen flies once more over Nuremberg's castle and the towers of Freiburg. What the last Staufer emperors lost through the chaos of the Interregnum, a new Swabian duke has reclaimed through steel and statecraft.\n\nFranconia's imperial cities and the Breisgau's fertile lands now answer to Stuttgart. The heartland is secured, but the true domains of Frederick Barbarossa and Frederick II stretched far beyond these borders, over the Alpine passes and into the rich plains of Lombardy."
 nd_swa.9.a: "Les aigles retournent dans leurs aires"
 nd_swa.10.t: "Seigneurs des Alpes"
 nd_swa.10.d: "Innsbruck has fallen. The Habsburg seat in Tyrol (gateway to Italy, guardian of the Brenner Pass) now flies the Swabian eagle. Control of the Alpine passes gives Swabia strategic command over the trade and military routes connecting Germany to Italy.\n\nThe question is how to exploit this mountain dominion. Some counsel fortifying every pass and valley, making the Alps an impregnable bastion. Others argue that the wealth of the conquered territories should be mobilized to raise massive armies for the campaigns ahead: Milan and Prague still beckon."
 nd_swa.10.a: "Fortifiez chaque passage et chaque forteresse"
 nd_swa.10.b: "Prélève les peuples des montagnes pour nos guerres"
 nd_swa.11.t: "La couronne impériale"
 nd_swa.11.d: "Milan kneels before the Swabian duke. Prague's ancient castle acknowledges a new master. From the Rhine to the Vltava, from the Alps to the plains of Lombardy, the domains of the Hohenstaufen have been restored, and surpassed.\n\nThis is a power not seen in Central Europe since Frederick II held court in Palermo and ruled from the Baltic to Sicily. The question now is what manner of empire this shall be. Some urge the duke to claim universal monarchy: to impose Swabian will on all of Christendom through force of arms. Others counsel a more measured approach: an imperial federation that binds diverse peoples through shared institutions and mutual obligation."
 nd_swa.11.a: "Une couronne, une volonté, un empire"
 nd_swa.11.b: "Un empire de nombreux peuples, une seule loi"
 STATIC_MODIFIER_NAME_nd_swa_dest_continental_exchange: "Échange continental"
 STATIC_MODIFIER_DESC_nd_swa_dest_continental_exchange: "Les réseaux de renseignements financiers d'Augsbourg s'étendent sur tout le continent, surveillant les marchés et manipulant les prix au profit des Souabes."
 STATIC_MODIFIER_NAME_nd_swa_dest_hanseatic_partnership: "Partenariat hanséatique"
 STATIC_MODIFIER_DESC_nd_swa_dest_hanseatic_partnership: "Une alliance formelle avec les villes hanséatiques crée un bloc commercial s'étendant des Alpes à la Baltique, stabilisant ainsi le commerce dans toute la région."
 STATIC_MODIFIER_NAME_nd_swa_dest_merchant_princes: "Princes marchands"
 STATIC_MODIFIER_DESC_nd_swa_dest_merchant_princes: "The great Swabian merchant dynasties govern as they trade, with calculation, ambition, and an eye toward innovation."
 STATIC_MODIFIER_NAME_nd_swa_dest_free_market: "République de libre marché"
 STATIC_MODIFIER_DESC_nd_swa_dest_free_market: "Les marchés souabes restent ouverts à tous, favorisant la concurrence, la tolérance et la prospérité pacifique."
 STATIC_MODIFIER_NAME_nd_swa_dest_alpine_fortifications: "Fortifications alpines"
 STATIC_MODIFIER_DESC_nd_swa_dest_alpine_fortifications: "Chaque col, vallée et forteresse de montagne a été fortifié, rendant le cœur de la Souabe pratiquement imprenable."
 STATIC_MODIFIER_NAME_nd_swa_dest_imperial_levies: "Prélèvements impériaux"
 STATIC_MODIFIER_DESC_nd_swa_dest_imperial_levies: "Les territoires conquis sont organisés pour fournir un maximum d'effectifs militaires, chaque peuple soumis contribuant à hauteur de son quota à l'armée souabe."
 STATIC_MODIFIER_NAME_nd_swa_dest_universal_monarchy: "Monarchie universelle"
 STATIC_MODIFIER_DESC_nd_swa_dest_universal_monarchy: "Le duc souabe revendique la domination sur toute la chrétienté, utilisant la force militaire comme principal instrument de politique."
 STATIC_MODIFIER_NAME_nd_swa_dest_imperial_federation: "Fédération Impériale"
 STATIC_MODIFIER_DESC_nd_swa_dest_imperial_federation: "Divers peuples sont liés sous l’autorité souabe par le biais d’institutions communes, d’obligations mutuelles et de promesses d’ordre."
 nd_swa_borsenhaus: "Maison Borsen"
 nd_swa_borsenhaus_desc: "Une bourse de marchandises souabe où les marchands de toute l'Europe échangent des marchandises, des crédits et des contrats à terme, renforçant ainsi la position d'Augsbourg en tant que capitale commerciale du continent."
 nd_swa_borsenhaus_maintenance: "Opérations d'échange"
 nd_swa_borsenhaus_maintenance_desc: "L'administration d'une bourse de matières premières, la maintenance des salles de marché, des grands livres et des réseaux de messagerie."
 nd_swa_kaiserpfalz: "Palatinat impérial"
 nd_swa_kaiserpfalz_desc: "Un complexe de palais impériaux dans la tradition des Hohenstaufen, servant à la fois de siège du gouvernement et de symbole de l'autorité ducale restaurée sur l'ancien duché de souche."
 nd_swa_kaiserpfalz_maintenance: "Entretien du palais"
 nd_swa_kaiserpfalz_maintenance_desc: "Entretenir les grandes salles, les fortifications et les bureaux administratifs d'un palais impérial."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_swa_bureaucracy_authority: "Schwbische Verwaltung"
 AUTO_MODIFIER_DESC_nd_swa_bureaucracy_authority: "The unified Swabian polity inherits an institutional toolkit unmatched in the Reich for its complexity: the federal Bundesrat of the Schwäbischer Bund, the Kreistag of the Imperial Circle, the constitutional Tübinger Vertrag of Württemberg, the five-canton Reichsritterschaft, and the patrician-and-guild Stadtrat of Augsburg. Three of these institutions can be sustained from the day Swabia is formed."

 swa_bundesrat_bureaucracy: "Bundesrat des Bundes suisses"
 swa_bundesrat_bureaucracy_desc: "Le Conseil fédéral de la Ligue Souabe, formé à la Diète d'Esslingen le 14 février 1488. Le Bundesrat siégeait en trois collèges - les princes, les villes impériales et les chevaliers de Sankt Jrgenschild - avec deux (plus tard trois) Hauptleute comme capitaines en chef et un nombre égal de conseillers élus dans chaque domaine, élargi de dix-huit à vingt et un par les renouvellements de 1496 et 1500. Il aligna une armée de treize mille hommes, réprimèrent la guerre des paysans de 1525 et maintinrent le sud de la Souabe uni contre les querelles et les schismes confessionnels jusqu'à ce que la Réforme brise la Ligue en 1534."

 swa_kreistag_bureaucracy: "Schwbischer Kreistag"
 swa_kreistag_bureaucracy_desc: "L'assemblée délibérante du Schwbischer Reichskreis, l'un des dix cercles impériaux créés par Maximilien Ier en 1500. Les ducs de Wurtemberg et les évêques de Constance faisaient office de kreisausschreibende Frsten, convoquant le Kreistag et présidant ses séances. Après 1512, le Kreis appliqua les verdicts du Reichskammergericht ; à partir de 1530, elle leva le contingent de l'armée impériale ; après 1555, elle veilla à la paix publique éternelle sur son territoire. Parmi les dix cercles, le Souabe était considéré comme le mieux organisé, divisé après 1563 en quatre quartiers d'exécution : Augsbourg, Constance, Wurtemberg et Bade."

 swa_tuebinger_vertrag_bureaucracy: "Tbinger Vertrag"
 swa_tuebinger_vertrag_bureaucracy_desc: "Le contrat constitutionnel conclu entre le duc Ulrich et le Landtag du Wurtemberg à Tbingen le 8 juillet 1514, à la suite du soulèvement d'Armer Konrad contre la taxe sur la consommation de viande et de vin d'Ulrich. Le traité obligeait le duché à consulter les domaines des prélats, des chevaliers et du bourgeois Ehrbarkeit sur les impôts extraordinaires, la guerre et l'aliénation territoriale, et accordait à tous les sujets le droit de libre émigration et de procédure légale en matière de vie, d'intégrité physique et d'honneur. Les historiens l'ont appelée la Magna Carta du Wurtemberg ; elle est restée la constitution territoriale, presque inchangée, jusqu'à la médiatisation napoléonienne de 1805."

 swa_reichsritterschaft_bureaucracy: "Reichsritterschaft Schwabens"
 swa_reichsritterschaft_bureaucracy_desc: "La Congrégation des chevaliers impériaux souabes, formée entre 1541 et 1545 à partir du Sankt Jrgenschild dissous et organisée en cinq cantons : Donau, Hegau-Allgu-Bodensee, Neckar-Schwarzwald, Kocher et Kraichgau. Chaque canton était gouverné par un Direktorium sous la direction d'un Ritterhauptmann élu à vie, avec un Ritterrte élu ; les cantons exerçaient des droits fiscaux et une souveraineté militaire sur leurs sujets et vendaient les domaines chevaleresques uniquement à d'autres chevaliers pour maintenir la Ritterschaft territorialement intacte. Les chevaliers souabes constituaient la corporation chevaleresque la plus dense du Reich et ont survécu, immédiatement auprès de l'empereur, jusqu'à la médiatisation en 1805/06."

 swa_augsburger_stadtrat_bureaucracy: "Augsbourg Stadtrat"
 swa_augsburger_stadtrat_bureaucracy_desc: "Le gouvernement civique patricien et de guilde d'Augsbourg, ville impériale libre depuis le 9 mars 1276. Jusqu'en 1548, le Rat siégeait sous une Zunftverfassung garantissant aux guildes la majorité sur les patriciens ; les maisons de marchands Welser, Hchstetter, Herwart, Baumgartner et Fugger côtoyaient les corporations d'artisans et les Stadtpfleger. Après la paix d'Augsbourg de 1555, un concile mixte catholique-luthérien présidait une population majoritairement protestante. L'Augsburger Stadtrat était le moteur institutionnel du commerce bancaire dans le sud de l'Allemagne - l'argent privé des Fugger prêté régulièrement aux empereurs - jusqu'à ce que la guerre de Trente Ans l'interrompe."
