l_french:
 # ============================================================
 # Variables (tooltip strings shown when set_variable fires)
 # ============================================================
 nd_pnt_formed_tt: "La Confédération Pintados est constituée."
 nd_pnt_path_a_tt: "Fondée en tant que Fédération des Datus."
 nd_pnt_path_b_tt: "Fondée sous le nom de Confrérie Kakarlong."
 nd_pnt_path_c_tt: "Fondée en tant que Confédération Maritime."

 # ============================================================
 # Static Modifiers: Formation Choices
 # ============================================================
 STATIC_MODIFIER_NAME_nd_pnt_federation_of_datus: "Fédération des Datus"
 STATIC_MODIFIER_DESC_nd_pnt_federation_of_datus: "Chaque datu de Panay, Cebu, Samar, Leyte, Bohol et Negros a cédé une mesure de son honneur à la bannière du conseil. Le conseil regroupe son autorité dans un seul navire confédéré : les royaumes ne se disputent plus et les îles parlent d'une seule voix."
 STATIC_MODIFIER_NAME_nd_pnt_kakarlong_brotherhood: "Confrérie Kakarlong"
 STATIC_MODIFIER_DESC_nd_pnt_kakarlong_brotherhood: "Les maîtres tatoueurs ont gravé les marques fondatrices sur la poitrine de chaque datu et ont juré les guerriers des îles en une seule confrérie mangayaw. Les hommes peints ont hâte de tester la nouvelle bannière contre les côtes du sud et les mers du nord."
 STATIC_MODIFIER_NAME_nd_pnt_maritime_confederation: "Confédération Maritime"
 STATIC_MODIFIER_DESC_nd_pnt_maritime_confederation: "Trois cents coques de balangay ont été posées dans les chantiers de Cebu, Iloilo et Tacloban. Les mers intérieures des Visayas appartiennent désormais à un seul peuple, et leurs marchands transporteront des perles et de l'or de Sulu au Champa sous la bannière des Pintados."

 # ============================================================
 # Static Modifiers: Advance Event Choices
 # ============================================================
 STATIC_MODIFIER_NAME_nd_pnt_maragtas_law: "Maragtas codifiées"
 STATIC_MODIFIER_DESC_nd_pnt_maragtas_law: "La chronique des dix datus et les lois de Sumakwel sont écrites en écriture baybayin et lues à haute voix à chaque conseil. La coutume devient loi."
 STATIC_MODIFIER_NAME_nd_pnt_oral_memory: "Les Binukot chantent le passé"
 STATIC_MODIFIER_DESC_nd_pnt_oral_memory: "Les femmes de haute naissance isolées conservent la chronique comme un chant vivant. Le Maragtas reste une chanson mémorisée plutôt qu'un texte fixe, et chaque génération le remodèle en fonction de son époque."
 STATIC_MODIFIER_NAME_nd_pnt_mangayaw_southern_seas: "Mangayaw du sud"
 STATIC_MODIFIER_DESC_nd_pnt_mangayaw_southern_seas: "Les flottes de raid se dirigent vers le sud, contre la côte de Sulu et le datus de Bornéo. L'or, les esclaves et les épouses reviennent dans les maisons du conseil."
 STATIC_MODIFIER_NAME_nd_pnt_mangayaw_northern_seas: "Mangayaw du Nord"
 STATIC_MODIFIER_DESC_nd_pnt_mangayaw_northern_seas: "Les flottes de raid se dirigent vers le nord, comme elles l'ont fait en 1169 lorsque les guerriers tatoués Visayan sont tombés sur la côte chinoise. Les chroniques de la dynastie Song seront relues avec une nouvelle peur."
 STATIC_MODIFIER_NAME_nd_pnt_babaylan_order: "Ordre du Babaylan"
 STATIC_MODIFIER_DESC_nd_pnt_babaylan_order: "Les prêtresses du diwata sont organisées en ordre confédéré. Le culte d'Anito est désormais formellement enseigné, avec des novices, des maîtres et un héritage de chant."
 STATIC_MODIFIER_NAME_nd_pnt_diwata_pluralism: "Diwata Pluralisme"
 STATIC_MODIFIER_DESC_nd_pnt_diwata_pluralism: "Chaque barangay garde son propre diwata ancestral. Aucune croyance n'est imposée sur les îles et les croyances étranges des commerçants étrangers sont tolérées aux côtés des esprits locaux."
 STATIC_MODIFIER_NAME_nd_pnt_balangay_merchants: "Marchands de Balangay"
 STATIC_MODIFIER_DESC_nd_pnt_balangay_merchants: "Les capitaines bourgeois parcourent les routes maritimes intérieures de Cebu à Iloilo en passant par Tacloban, avec des embranchements vers Mindoro et Mindanao. L’économie pan-visayan s’épaissit."
 STATIC_MODIFIER_NAME_nd_pnt_pintados_trade_office: "Bureau commercial de Pintados"
 STATIC_MODIFIER_DESC_nd_pnt_pintados_trade_office: "Un organisme commercial unique agréé par l'État aux prix de Cebu, pèse et tarife chaque transaction inter-îles. Les marchands s'irritent des prélèvements, mais le trésor du conseil gonfle et le crédit coule d'une seule main de confiance."
 STATIC_MODIFIER_NAME_nd_pnt_defiance_of_mactan: "Défi de Mactan"
 STATIC_MODIFIER_DESC_nd_pnt_defiance_of_mactan: "Le nom de Lapu-Lapu est gravé sur chaque fort côtier. L'Occident peut apporter ses voiles et ses fers, mais les hommes peints ne s'agenouilleront pas."
 STATIC_MODIFIER_NAME_nd_pnt_lessons_of_the_west: "Leçons de l’Occident"
 STATIC_MODIFIER_DESC_nd_pnt_lessons_of_the_west: "Les ports de Pintados font du commerce avec les capitaines carabelas. Les canons entrent dans les arsenaux du conseil et les constructeurs navals karakoa étudient les coques étrangères."
 STATIC_MODIFIER_NAME_nd_pnt_three_tongues_flourish: "Trois langues s'épanouissent"
 STATIC_MODIFIER_DESC_nd_pnt_three_tongues_flourish: "Les grammaires Hiligaynon, Cebuano et Waray sont imprimées côte à côte, les trois formes étant correctes. Les îles peintes gardent trois voix et appellent les trois Pintados."
 STATIC_MODIFIER_NAME_nd_pnt_council_vernacular: "Conseil Vernaculaire"
 STATIC_MODIFIER_DESC_nd_pnt_council_vernacular: "Un seul discours Pintados est forgé à partir des trois langues visayanes. La cour, le marché et le barangay apprennent la nouvelle langue vernaculaire ; les hommes peints deviennent une seule langue ainsi qu'une seule bannière."

 # ============================================================
 # Formation Event
 # ============================================================
 nd_pnt.1.t: "Bannière peinte sur les mers intérieures"
 nd_pnt.1.d: "The datus of Panay have come to Araut. The rajahs of Cebu have sailed from Sugbo. The seafaring captains of Samar and Leyte have rowed in from the eastern coasts. Around the council fire sit the painted men of Negros and Bohol, and the babaylan priestesses chant the names of every diwata they will offend if this oath is broken.\n\nThe Spaniards already speak of the Visayans only as Los Pintados, the Painted Ones, as if the tattoos that record every battle, every raid, every enemy slain, were our only mark. Today we make those tattoos a banner. The kingdoms that fought one another for two centuries pool their honor under a single confederate seal: Kabisay-an, the painted islands, sovereign and joined.\n\nThe council debates how this new nation will speak its first word.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_pnt.1.a: "Fédération des Datus : lier le conseil par une loi assermentée"
 nd_pnt.1.b: "Kakarlong Brotherhood - forgez les hommes peints en un seul mangayaw"
 nd_pnt.1.c: "Confédération Maritime : que les coques balangay portent notre drapeau"

 # ============================================================
 # Advance Events
 # ============================================================
 nd_pnt.2.t: "Les Maragtas à la Maison du Conseil"
 nd_pnt.2.d: "Les coutumes de Datu Sumakwel survivent dans le chant des binukot, les femmes de haute naissance isolées dont les voix préservent les lois. Le conseil débat de l'opportunité de fixer les Maragtas en écriture baybayin comme loi écrite, ou si la vie de la chronique réside dans son chant."
 nd_pnt.2.a: "Gravez les lois dans le bambou"
 nd_pnt.2.b: "Que le chant reste la loi"

 nd_pnt.3.t: "Le Conseil Mangayaw"
 nd_pnt.3.d: "Les jeunes guerriers de Cebu, Bohol et Samar réclament un grand mangayaw, un raid maritime digne d'être inscrit sur chaque coffre. Le conseil doit choisir son océan : le sud contre l’or de Sulu et de Bornéo, ou le nord contre les riches rivages de l’Empire du Milieu, comme le faisaient nos ancêtres en 1169 dans les chroniques."
 nd_pnt.3.a: "Sud : les côtes dorées de Sulu et de Bornéo"
 nd_pnt.3.b: "Nord - où nos ancêtres ont attaqué les Song"

 nd_pnt.4.t: "La question Babaylan"
 nd_pnt.4.d: "À travers les îles, les prêtresses babaylan servent un millier de diwatas locales, chaque barangay son propre panthéon. Le conseil doit décider s'il faut formaliser les prêtresses en un seul ordre confédéré, avec des novices et des maîtres et un chant fixe, ou laisser chaque barangay libre de garder ses propres esprits ancestraux."
 nd_pnt.4.a: "Ordre du Babaylan"
 nd_pnt.4.b: "Chaque barangay garde son diwata"

 nd_pnt.5.t: "Le traité sur la mer intérieure"
 nd_pnt.5.d: "Burgher captains from every Visayan port press the council to ratify their compact. The merchants want one inner-sea market; the council must decide how it shall be governed.\n\nThe traders of Cebu and Iloilo argue for a free-passage charter that lets every datu's balangay put in at any harbor under Pintados authority. The Cebu treasury argues for a single state-licensed Pintados Trade Office that prices, weighs and tariffs every transaction."
 nd_pnt.5.a: "Un pacte de libre passage : les marchands de chaque donnée sont libres de commercer"
 nd_pnt.5.b: "Un bureau commercial Pintados à Cebu : un organisme commercial agréé"

 nd_pnt.6.t: "Les voiles à Mactan"
 nd_pnt.6.d: "The strange ships have arrived. Their captain, Magalhaes, demands tribute from the rajah of Cebu and threatens fire on any datu who refuses. Lapu-Lapu of Mactan answers with steel.\n\nThe council must decide what the painted islands will be when the storm of the western sails breaks: an enemy that humbles them at every shore, or a learner that takes their cannons and their carabelas and turns them on their own coasts."
 nd_pnt.6.a: "Défiance - durcissez toutes les côtes contre eux"
 nd_pnt.6.b: "Apprenez - prenez leur fer et leurs coques"

 nd_pnt.7.t: "La synthèse Visayan"
 nd_pnt.7.d: "Three peoples, one tongue at council: the Hiligaynon of Panay, the Cebuano of the central islands, and the Waray of Samar and Leyte have begun to share more than the painted banner. Songs cross. Cookpots cross. Dialects bend toward one another in the markets and on the rower's benches.\n\nThe printers in Cebu have set the type. The council debates whether to set three Visayan grammars side by side and let all three forms be called correct, or to forge a single council vernacular and call it Pintados speech."
 nd_pnt.7.a: "Imprimez trois grammaires - laissez les langues s'épanouir"
 nd_pnt.7.b: "Forgez une langue vernaculaire du conseil à partir des trois"

 # ============================================================
 # Advances
 # ============================================================
 nd_pnt_balangay_shipwrights: "Charpentiers de Balangay"
 nd_pnt_balangay_shipwrights_desc: "Le balangay, le bateau à balancier en planches et nervures des marins visayens, est l'unité de base de l'identité des îles : chaque village côtier peut en poser un et chaque capitaine peut en équiper un. Les chantiers navals spécialisés produisent désormais des coques plus grandes, capables de traverser les mers."
 nd_pnt_datu_council: "Conseil des données"
 nd_pnt_datu_council_desc: "Chaque île significative envoie ses données au grand conseil. L'autorité est mise en commun, pas abandonnée : le conseil décide de la guerre et des traités, et ses décisions portent le poids de toutes les données qui y ont participé."
 nd_pnt_maragtas_codex: "Codex Maragtas"
 nd_pnt_maragtas_codex_desc: "La chronique de Datu Sumakwel et des dix datus de Bornéo qui ont fui vers le nord vers Panay, qui ont acheté les basses terres du roi Ati Marikudo avec un sadok d'or, devient le mythe fondateur de la confédération."
 nd_pnt_timawa_freemen: "Hommes libres de Timawa"
 nd_pnt_timawa_freemen_desc: "Entre le datus et l'oripun se trouve le timawa : des roturiers guerriers libres qui possèdent leurs armes, doivent servir dans la guerre mais pas dans l'agriculture, et forment le bras de lance de chaque barangay. La confédération régularise les timawa en tant que classe reconnue dans toutes les îles."
 nd_pnt_baybayin_visayan: "Visayan Baybayin"
 nd_pnt_baybayin_visayan_desc: "L'écriture baybayin dérivée de l'Inde est adaptée aux groupes de consonnes Hiligaynon, Cebuano et Waray. Les scribes du Conseil peuvent enregistrer la décision du conseil, le mariage d'un binukot et l'or dû en guise de dot."
 nd_pnt_kakarlong_orders: "Commandes Kakarlong"
 nd_pnt_kakarlong_orders_desc: "Des ordres de guerriers tatoués sont formalisés à travers les îles. Chaque tatouage relate un acte : un ennemi tué, un raid réussi, un village défendu. Un guerrier entièrement tatoué est un témoignage ambulant de valeur, et un conseil qui rassemble de tels hommes doit se craindre lui-même."
 nd_pnt_mangayaw_fleets: "Flottes de raid de Mangayaw"
 nd_pnt_mangayaw_fleets_desc: "Le mangayaw, le grand raid maritime, est institutionnalisé comme une pratique confédérée plutôt que comme une aventure privée. Des flottes entières de balangay naviguent sous la bannière peinte, et chaque retour réussi fait honneur à toute la confédération."
 nd_pnt_babaylan_synod: "Synode Babaylan"
 nd_pnt_babaylan_synod_desc: "Les prêtresses du diwata, guérisseuses et oracles des îles, sont rassemblées en un synode confédéré. L'anitisme devient une foi reconnue avec une formation formelle, une succession et une reconnaissance inter-îles de l'ancienneté des prêtresses."
 nd_pnt_pearl_divers: "Plongeurs de perles de Sulu"
 nd_pnt_pearl_divers_desc: "Les apnéistes visayens et les flottes perlières de Sulu travaillent sur les récifs des mers intérieures. Les perles nourrissent les orfèvres de Cebu et d'Iloilo et payent la soie et la porcelaine que le conseil achète aux jonques chinoises."
 nd_pnt_inner_sea_trade: "Réseau commercial maritime intérieur"
 nd_pnt_inner_sea_trade_desc: "Les marchés pariens de Cebu, Iloilo et Tacloban sont liés par un pacte bourgeois commun. La mer de Visayan n'est plus une série d'économies locales indépendantes mais une circulation unique de coton, de riz, de perles, d'or et de soie."
 nd_pnt_lapu_lapu_legacy: "L'héritage de Lapu-Lapu"
 nd_pnt_lapu_lapu_legacy_desc: "Le matin du 27 avril 1521, le datu de Mactan rencontra Magalhaes dans les vagues et le tua avec mille de ses timawa. Les hommes peints ont prouvé que le fer occidental n’est pas invulnérable. Chaque fort côtier est reconstruit en pensant à cette matinée."
 nd_pnt_visayan_goldsmiths: "Orfèvres Visayans"
 nd_pnt_visayan_goldsmiths_desc: "Les forgerons panday de Cebu et Butuan héritent de mille ans de tissage de granulation, de repousse et de fil d'or. Les bijoux Visayan de la haute période confédérée sont reconnus du Champa au Brunei en passant par Macao."
 nd_pnt_visayan_synthesis: "Synthèse Visayan"
 nd_pnt_visayan_synthesis_desc: "Hiligaynon de Panay, Cebuano des îles centrales et Waray de Samar et Leyte commencent à converger sous la bannière confédérée. Les pidgins commerciaux s'intègrent dans un vocabulaire commun, des fêtes communes sont organisées à travers les îles et une identité Pintados reconnaissable émerge qui n'est pas l'un des trois mais tous."
 nd_pnt_lipong_warriors: "Anciens combattants de Lipong"
 nd_pnt_lipong_warriors_desc: "Lipong est le guerrier tellement couvert de tatouages ​​qu'il ne reste aucune peau intacte. Chaque marque enregistre une bataille survécue. Le conseil réserve le rang lipong aux vétérans de trois campagnes confédérées et les présente comme bras de choc de chaque armée."
 nd_pnt_visayan_admiralty: "Amirauté Visayan"
 nd_pnt_visayan_admiralty_desc: "Un bureau de l'amirauté est établi pour coordonner les flottes balangay et karakoa de chaque île, acheminer le grand mangayaw et attribuer des stations de blocus à chaque escadron confédéré."
 nd_pnt_archipelagic_governance: "Gouvernance archipélagique"
 nd_pnt_archipelagic_governance_desc: "Le modèle confédéré évolue : les conseils provinciaux servent d'intermédiaire entre le datus d'une île et le grand conseil, et un registre des timawa et des oripun est tenu dans tout l'archipel. Les hommes peints apprennent à gouverner comme un État et non comme une fédération de querelles."
 nd_pnt_karakoa_fleets: "Flottes de Karakoa"
 nd_pnt_karakoa_fleets_desc: "Le karakoa est le grand navire de guerre à balancier Visayan : 100 pagayeurs, des ponts de combat en planches surélevées, une proue haute et un nom crié par le datu qui le commande. Les vaisseaux amiraux Karakoa dirigent chaque escadron de la flotte confédérée."
 nd_pnt_visayan_militia: "Milice du Barangay"
 nd_pnt_visayan_militia_desc: "Chaque village côtier devient un nœud défensif, avec des tours de guet, des feux de signalisation et des timawa entraînés maintenus en alerte. Les îles peintes ne se défendent pas contre une seule capitale mais contre mille barangays à la fois."
 nd_pnt_visayan_diaspora: "Diaspora Visayane"
 nd_pnt_visayan_diaspora_desc: "Les colons visayens traversent Palawan, la côte nord de Mindanao, Sabah et l'archipel de Sulu. La bannière peinte devient l'étendard d'un peuple émigré qui porte ses tatouages ​​et son balangay partout où il pose un barangay."
 nd_pnt_pintados_arsenal: "Pintados Arsenal"
 nd_pnt_pintados_arsenal_desc: "Un complexe d'arsenal confédéré s'étend sur Iloilo et Cebu, fondant des canons, forgeant des armes à feu et entraînant des canonniers. Les hommes peints, qui ont connu pour la première fois la poudre à canon auprès des commerçants chinois et bornéens, fabriquent désormais la leur."
 nd_pnt_visayan_letters: "Lettres Visayanes"
 nd_pnt_visayan_letters_desc: "L'impression vernaculaire Hiligaynon et Cebuano est florissante. Les éditions Maragtas, les cycles de chants babaylan, les chroniques datu et même un code juridique du conseil sont largement lus. Les hommes peints apprennent à lire et à écrire dans leurs trois langues."
 nd_pnt_modernised_kakarlong: "Kakarlong modernisé"
 nd_pnt_modernised_kakarlong_desc: "La tradition du tatouage-guerrier se réconcilie avec le mousquet et la ligne disciplinée. Les vétérans de Lipong s'entraînent aux côtés de jeunes recrues, et la marque sur la poitrine d'un soldat témoigne désormais à la fois d'exploits anciens et de campagnes modernes."
 nd_pnt_visayan_navy: "Pintados Marine"
 nd_pnt_visayan_navy_desc: "Une marine confédérée régulière patrouille dans les mers intérieures sous une seule enseigne plutôt que sous la forme d'une coalition de flottes de données. Les navires phares de Karakoa sont rejoints par des frégates canonnières de conception européenne, toutes arborant la bannière peinte."
 nd_pnt_kabisayan_nation: "Kabisay-une nation"
 nd_pnt_kabisayan_nation_desc: "À l’ère des réveils nationaux, les îles peintes s’articulent comme un seul peuple Kabisay : une nation civique unie par la langue, par la tradition du tatouage, par les Maragtas et par la longue mémoire du conseil."
 nd_pnt_island_industrialists: "Industriels insulaires"
 nd_pnt_island_industrialists_desc: "Les îles Visayan entrent dans l’ère industrielle en tant que fédération de villes portuaires. Les usines textiles d'Iloilo, les usines métallurgiques de Cebu et les chantiers navals de Tacloban constituent le pilier d'un corridor industriel insulaire qui exporte à travers l'Asie."
 nd_pnt_pintados_steam_navy: "Pintados Steam Marine"
 nd_pnt_pintados_steam_navy_desc: "Les chantiers navals de Cebu déposent des cuirassés aux côtés des derniers karakoa. La bannière peinte flotte désormais sur des coques en acier patrouillant dans les mers intérieures, la mer de Chine méridionale et les longues côtes de la diaspora Visayan."
 nd_pnt_kabisayan_universities: "Universités Kabisayan"
 nd_pnt_kabisayan_universities_desc: "Des universités sont fondées à Cebu, Iloilo et Tacloban. L'élite lettrée des hommes peints, scolarisée dans trois langues visayanes ainsi que l'espagnol et l'anglais, devient un pont entre le savoir asiatique et européen."

 # ============================================================
 # Units
 # ============================================================
 a_nd_pnt_timawa: "Hommes libres de Timawa"
 a_nd_pnt_timawa_desc: "Des roturiers guerriers libres qui possèdent leurs armes et doivent servir à la guerre mais pas sur le terrain. Le pilier de la ligne de lance et de bouclier de chaque barangay."
 a_nd_pnt_kakarlong: "Guerriers Kakarlong"
 a_nd_pnt_kakarlong_desc: "Des troupes de choc couvertes de tatouages ​​ont prêté serment en tant que fraternité confédérée. Ils chargent en criant le nom de chaque diwata qui sera témoin de leurs actes."
 a_nd_pnt_lipong: "Anciens combattants de Lipong"
 a_nd_pnt_lipong_desc: "Couverts de tatouages ​​sur la plante de leurs pieds, chacun marque une bataille survécue. Les lipongs sont l'arme de choc des armées confédérées, et un ennemi qui les voit arriver a des raisons d'avoir peur."
 n_nd_pnt_balangay_raider: "Pillard Balangay"
 n_nd_pnt_balangay_raider_desc: "Cuisine de raid à balancier à longue quille avec un seul mât, un pont de combat allongé et des rameurs issus de la classe Timawa. Les flottes mangayaw montent sur ces coques."
 n_nd_pnt_karakoa: "Karakoa"
 n_nd_pnt_karakoa_desc: "Le grand navire de guerre Visayan, un géant à balancier de 100 pagayeurs dont les ponts de combat surélevés et la haute proue le transforment en fort flottant. Chaque karakoa porte le nom du datu qui la commande."
 n_nd_pnt_ironclad: "Pintados Ironclad"
 n_nd_pnt_ironclad_desc: "Frégate à vapeur plaquée fer lancée depuis les chantiers de Cebu. Les hommes peints portent la tradition balangay à l'ère de la vapeur."
 n_nd_pnt_balangay: "Balangay"
 n_nd_pnt_balangay_desc: "Le stabilisateur de base en planches et nervures de chaque village côtier Visayan. Peu coûteux à construire, rapides, prélevés en grand nombre auprès des capitaines bourgeois."

 # ============================================================
 # Levies
 # ============================================================
 levy_nd_pnt_kakarlong_warriors: "Prélèvement de Kakarlong"
 levy_nd_pnt_kakarlong_warriors_desc: "Confrérie des guerriers tatoués issue de la classe des soldats."
 levy_nd_pnt_timawa_freemen: "Timawa Levy"
 levy_nd_pnt_timawa_freemen_desc: "Des roturiers guerriers libres appelés parmi les paysans et la classe des soldats."
 levy_nd_pnt_balangay: "Prélèvement Balangay"
 levy_nd_pnt_balangay_desc: "Bateaux à balancier appartenant aux bourgeois avec des rameurs paysans et ouvriers, élevés par les villages côtiers de la confédération."

 # ============================================================
 # Buildings
 # ============================================================
 nd_pnt_balangay_yard: "Cour de Balangay"
 nd_pnt_balangay_yard_desc: "Chantier côtier spécialisé dans le balancier Visayan à longue quille. Construit et répare les flottes de la confédération."
 nd_pnt_council_house: "Maison du Conseil de Datu"
 nd_pnt_council_house_desc: "La grande salle dans laquelle les datus de chaque île siègent en conseil. Les décisions prises ici lient les îles peintes."
 nd_pnt_babaylan_shrine: "Sanctuaire Babaylan"
 nd_pnt_babaylan_shrine_desc: "Centre de culte anitiste et de formation babaylan. Les guérisseurs, les oracles et les prêtresses montent ici par les ordres du synode."
 nd_pnt_parian_market: "Marché Parien"
 nd_pnt_parian_market_desc: "Bourse intérieure fortifiée où les marchands visayens, chinois, bornéens et sulu échangent des perles, de l'or, du coton et du riz dans le cadre d'un pacte parien commun."
 nd_pnt_panday_workshop: "Atelier Panday"
 nd_pnt_panday_workshop_desc: "District d'orfèvrerie produisant des travaux de granulation, de plaques de repousse et de tissage de fils d'or dans la longue tradition Cebu-Butuan."
 nd_pnt_kabisayan_arsenal: "Arsenal de Kabisayan"
 nd_pnt_kabisayan_arsenal_desc: "Le complexe d'arsenal militaire pan-visayan fonde des canons, forge des armes à feu et entraîne les équipes d'artillerie des armées confédérées."
 nd_pnt_kabisayan_university: "Université Kabisayan"
 nd_pnt_kabisayan_university_desc: "Institution supérieure d'enseignement dans la langue vernaculaire Visayan, mêlant la tradition juridique autochtone aux lettres européennes et chinoises."

 # ============================================================
 # Production methods
 # ============================================================
 nd_pnt_panday_jewelry: "Orfèvrerie Visayan"
 nd_pnt_panday_jewelry_desc: "Tissage de granulation, de repousse et de fil d'or dans la tradition panday, à partir de perles et d'or locaux."
 nd_pnt_balangay_yard_maintenance: "Entretien de la cour"
 nd_pnt_balangay_yard_maintenance_desc: "Bois d'œuvre, fournitures navales, goudron et fibres pour permettre au chantier de couper les coques."
 nd_pnt_council_house_maintenance: "Entretien du Conseil"
 nd_pnt_council_house_maintenance_desc: "Bois de construction, maçonnerie, cire d'abeille et papier pour soutenir les données assemblées et leurs scribes."
 nd_pnt_babaylan_shrine_maintenance: "Offrandes au sanctuaire"
 nd_pnt_babaylan_shrine_maintenance_desc: "Bougies en cire d'abeille, encens, tissus tissés et poterie rituelle pour les diwatas."
 nd_pnt_parian_market_maintenance: "Maintien du marché"
 nd_pnt_parian_market_maintenance_desc: "Tissus, poteries, riz et poissons fournis au parian pour le pacte marchand."
 nd_pnt_kabisayan_arsenal_maintenance: "Entretien de l'Arsenal"
 nd_pnt_kabisayan_arsenal_maintenance_desc: "Armes, armes à feu, bois et fer stockés pour entraîner les équipes d'artillerie de la confédération."
 nd_pnt_kabisayan_university_maintenance: "Entretien universitaire"
 nd_pnt_kabisayan_university_maintenance_desc: "Papier, livres, bougies en cire d'abeille et poterie pour les écoles, bibliothèques et imprimeries des universités."

 # ============================================================
 # Destiny Tree
 # ============================================================

 # --- Destiny Advances ---
 nd_pnt_destiny: "Le sommet de la bannière peinte"
 nd_pnt_destiny_desc: "La confédération pan-visayan passe de la fondation au sommet. La bannière du conseil flotte désormais sans aucun doute de Panay à Samar, et les hommes peints commencent à se disputer sur ce que sera leur nation au siècle prochain."

 nd_pnt_dest_united_council: "Conseil uni des îles peintes"
 nd_pnt_dest_united_council_desc: "Placer les quatre îles d'ancrage secondaires (Samar, Bohol, Negros et Masbate) entièrement sous l'autorité du conseil. Avec Basey, Bo-ol, Bago et Masbate siégeant au conseil, l'archipel Visayan répond à une seule bannière."

 nd_pnt_dest_visayan_renaissance: "Renaissance Visayane"
 nd_pnt_dest_visayan_renaissance_desc: "Adoptez le légalisme, prenez Tondo sur Luçon et amassez l'or (2000) et le prestige (50) pour financer une ère culturelle confédérée. Les hommes peints deviennent des mécènes des lettres, des arts et du savoir indien."

 nd_pnt_dest_kabisayan_apex: "Kabisay-un Apex"
 nd_pnt_dest_kabisayan_apex_desc: "Adoptez l'imprimerie, détenez à la fois Butuan (le cœur des orfèvres de Mindanao) et Maynila, et atteignez l'or 3000, le prestige 75. La nation civique Visayan est pleinement formée : alphabétisée, marchande, fédérée, peinte. Débloque la salle du Grand Conseil."

 nd_pnt_dest_sulu_mastery: "Maîtrise de la mer de Sulu"
 nd_pnt_dest_sulu_mastery_desc: "Conquer Maimbung and Bongao in the Sulu archipelago with the mangayaw raid fleets. The southern raid frontier opens, and the painted men replace the Sulu rajah as masters of the sea between."

 nd_pnt_dest_borneo_beachheads: "Têtes de pont de Bornéo"
 nd_pnt_dest_borneo_beachheads_desc: "Take Berune (the Brunei capital) and Surigao on the northern Mindanao coast. Set a standing admiralty over the fleets and hold 2000 gold. The mangayaw fleets land where the chronicles only let them raid."

 nd_pnt_dest_spice_talassocracy: "Talassocratie de la mer d'épices"
 nd_pnt_dest_spice_talassocracy_desc: "Hold both Ternate and Tidore, the Maluku spice islands. Send the karakoa fleets, at prestige 75. A Pintados Sulu Zone reaches the spice islands; the painted banner flies over the inner sea, the Sulu Sea, and the Moluccas. Unlocks the Pintados Raid Anchorage."

 # --- Destiny Events ---

 nd_pnt.8.t: "Le sommet de la bannière peinte"
 nd_pnt.8.d: "The council fire at Araut burns brighter than any in living memory. The datus of every island, the babaylan of every barangay, the timawa captains of every coastal village have come to declare that the painted nation is no longer a federation in formation: it is a federation in being.\n\nNow the council debates what the nation will become."
 nd_pnt.8.a: "Les îles peintes s'élèvent comme une seule"

 nd_pnt.9.t: "Conseil des Quatre Îles"
 nd_pnt.9.d: "Basey speaks for Samar. Bo-ol speaks for Bohol. Bago speaks for Negros. Masbate speaks for itself. With the Panay and Cebu rajahs already seated, every Visayan landfall now answers to a single council.\n\nNow the council must decide what shape its authority shall take. Some demand confederate law set down in baybayin: a written code that binds every datu by oath and statute. The elders argue instead for sandugo, the chronicled blood-compact: loyalty bound by ritual and personal honor, as the ten datus of Borneo bound themselves to Marikudo."
 nd_pnt.9.a: "Lier les données à la loi confédérée écrite"
 nd_pnt.9.b: "Lier les données par Sandugo Blood-Compact"

 nd_pnt.10.t: "La Renaissance des Hommes Peints"
 nd_pnt.10.d: "Les caravanes hommage de Tondo arrivent à Cebu. Le Trésor en détient suffisamment pour commander tout ce que veut le conseil. Le synode babaylan rencontre les scribes Hiligaynon dans une salle des trois langues, et une querelle éclate : cet âge d'or sera-t-il une cour de patrons, ou un ordre civique confédéré lettré ?"
 nd_pnt.10.a: "Patron le binukot, le panday, le peintre"
 nd_pnt.10.b: "Imprimer trois grammaires Visayan et un code du conseil"

 nd_pnt.11.t: "Kabisay-an, une nation peinte"
 nd_pnt.11.d: "Maynila's silver, Butuan's gold, Cebu's pearls and Iloilo's cotton sit on the same council ledger. The printing presses run in Hiligaynon, Cebuano and Waray at once. The painted islands are no longer three peoples but one civic Kabisay-an nation, with a literate elite, a federated assembly, and merchant houses that reach Champa, Macao and Brunei.\n\nWhat shape shall this apex take?"
 nd_pnt.11.a: "Une constitution civique visayane"
 nd_pnt.11.b: "Une fédération marchande pan-asiatique"

 nd_pnt.12.t: "La mer de Sulu tombe silencieuse"
 nd_pnt.12.d: "The Sulu rajah's flag is hauled down at Maimbung. Bongao's pirate-datus row out under guard. The Pintados banner now flies over the southern sea.\n\nThe captured Iranun captains kneel before the council. They will sail again. The only question is under whose order. Some councilors argue for letters of marque: leave the corsairs their crews and their fleets, and let them sail under Pintados commission. Others demand direct integration: their hulls broken up for council shipyards, their crews reassigned to standardized squadrons under royal pay."
 nd_pnt.12.a: "Délivrer des commissions de corsaire aux capitaines iraniens"
 nd_pnt.12.b: "Intégrer les flottes Sulu au conseil d'amirauté"

 nd_pnt.13.t: "Les terres de Mangayaw à Brunei"
 nd_pnt.13.d: "Berune burns under the painted banner. The Surigaonon coast of Mindanao bows to the council banner. The chronicles of the 1169 northern raid are recited at every campfire, but this time the fleets did not come back. They stayed.\n\nHow shall the council institutionalize this conquest beyond the raid?"
 nd_pnt.13.a: "Un corps de débarquement de Kakarlong permanent"
 nd_pnt.13.b: "Voies de raid permanentes en karakoa"

 nd_pnt.14.t: "L'arc des îles aux épices"
 nd_pnt.14.d: "Ternate's sultan kneels at the prow of a Pintados karakoa. Tidore's spice warehouses stand under the painted banner. From Sulu to the Moluccas, every harbor pays tribute to one council. The Sulu Zone is now a Pintados Zone, and the chronicles of the southern reavers are written in Visayan ink.\n\nHow shall the spice empire be ordered?"
 nd_pnt.14.a: "Seigneurie des pilleurs d'épices : poivre, sucre, lame"
 nd_pnt.14.b: "Domination de la mer intérieure : hommage, flottes, bannière"

 # --- Destiny Static Modifiers ---

 STATIC_MODIFIER_NAME_nd_pnt_dest_patron_arts: "Mécènes des Arts Peints"
 STATIC_MODIFIER_DESC_nd_pnt_dest_patron_arts: "Les maisons communales deviennent des tribunaux de patronage. Le chant de Binukot, l'or panday et les peintres de Cebu attirent les migrants de tout l'archipel, tandis que les anciens terrains de forage de Timawa sont calmes."

 STATIC_MODIFIER_NAME_nd_pnt_dest_three_tongues: "Les trois langues font des lettres"
 STATIC_MODIFIER_DESC_nd_pnt_dest_three_tongues: "Des grammaires imprimées du Hiligaynon, du Cebuano et du Waray circulent dans chaque maison du conseil. Une classe civique alphabétisée émerge et les îles peintes commencent à parler comme un seul peuple en trois langues."

 STATIC_MODIFIER_NAME_nd_pnt_dest_civic_nation: "La nation civique Visayan"
 STATIC_MODIFIER_DESC_nd_pnt_dest_civic_nation: "Le conseil devient un parlement. Les sièges de Datu sont hérités mais contrôlés, les hommes libres de Timawa envoient des délégués et l'assemblée gouverne les îles peintes comme une confédération constitutionnelle."

 STATIC_MODIFIER_NAME_nd_pnt_dest_mercantile_federation: "Fédération marchande Pintados"
 STATIC_MODIFIER_DESC_nd_pnt_dest_mercantile_federation: "Les maisons marchandes Pintados sont ancrées à Macao, Malacca et Brunei. La bannière peinte devient une marque de crédit sur les marchés maritimes d’Asie."

 STATIC_MODIFIER_NAME_nd_pnt_dest_kakarlong_landing_corps: "Corps de débarquement de Kakarlong"
 STATIC_MODIFIER_DESC_nd_pnt_dest_kakarlong_landing_corps: "The tattoo brotherhoods are reorganized as a permanent landing corps for inter-island war. They drill harder, recover faster, and the council pays for their initiative, but the diplomats are not consulted."

 STATIC_MODIFIER_NAME_nd_pnt_dest_karakoa_lanes: "Voies de raid de Karakoa"
 STATIC_MODIFIER_DESC_nd_pnt_dest_karakoa_lanes: "Des escadrons permanents de karakoa patrouillent à Sulu, Bornéo et Mindoro le long de voies de raid fixes. Les galères coûtent moins cher à entretenir en mer, et la bannière peinte tache toutes les cartes des eaux du sud."

 STATIC_MODIFIER_NAME_nd_pnt_dest_spice_reaver_lords: "Seigneurs pilleurs d'épices"
 STATIC_MODIFIER_DESC_nd_pnt_dest_spice_reaver_lords: "Le poivre des Moluques et le sucre sont versés dans Cebu. Les coques peintes deviennent plus résistantes grâce aux prix en argent. Mais les rizières des îles natales s'amenuisent car trop de jeunes hommes se lancent dans l'économie des épices et des lames à travers les mers du sud."

 STATIC_MODIFIER_NAME_nd_pnt_dest_inner_sea_dominion: "Domination de la mer intérieure"
 STATIC_MODIFIER_DESC_nd_pnt_dest_inner_sea_dominion: "De Sulu à Maluku, chaque port rend hommage au conseil des Pintados. Les envoyés étrangers reconnaissent la bannière peinte comme une puissance asiatique majeure, et les flottes hommage deviennent un élément permanent des mers intérieures."

 STATIC_MODIFIER_NAME_nd_pnt_dest_council_sworn_law: "Conseil lié par la loi assermentée"
 STATIC_MODIFIER_DESC_nd_pnt_dest_council_sworn_law: "Les datus prêtent allégeance à un code confédéré écrit, inscrit dans le baybayin et lu à haute voix à chaque session. Le conseil devient un tribunal ainsi qu'une assemblée de chefs."
 STATIC_MODIFIER_NAME_nd_pnt_dest_council_sandugo: "Conseil lié par Sandugo"
 STATIC_MODIFIER_DESC_nd_pnt_dest_council_sandugo: "Les datus se lient par le sandugo, le pacte de sang chronique : une coupe de vin mêlée au sang de chaque chef, bue tour à tour. La fidélité est personnelle, rituelle et héritée de père en fils."
 STATIC_MODIFIER_NAME_nd_pnt_dest_iranun_commission: "Lettres de marque Iranun"
 STATIC_MODIFIER_DESC_nd_pnt_dest_iranun_commission: "Les capitaines corsaires capturés de Sulu naviguent à nouveau, cette fois sous lettres de marque du conseil. Leur pillage revient à Cebu, mais les Espagnols, les Bornéos et les Makassarais expriment tous de nouveaux griefs contre la bannière peinte."
 STATIC_MODIFIER_NAME_nd_pnt_dest_sulu_admiralty: "Conseil de l'Amirauté de Sulu"
 STATIC_MODIFIER_DESC_nd_pnt_dest_sulu_admiralty: "Les flottes Sulu capturées sont démantelées ; leurs coques alimentent les chantiers de Cebu et d'Iloilo, leurs équipages reçoivent des salaires royaux et sont réaffectés à des escadrons standardisés. La discipline remplace le pillage comme loi de la mer du Sud."

 # --- Destiny Buildings ---
 nd_pnt_dest_grand_council_hall: "Salle du Grand Conseil"
 nd_pnt_dest_grand_council_hall_desc: "La maison du conseil suprême des Visayas fédérées. Une salle d'assemblée constitutionnelle en pierre et en bois dur, où chaque délégué datu, timawa et représentant bourgeois a un siège de droit fédéral."

 nd_pnt_dest_raid_anchorage: "Ancrage du raid Pintados"
 nd_pnt_dest_raid_anchorage_desc: "Base navale renforcée de l'empire des raids Pintados. Les navires phares de Karakoa hivernent ici, les corps de débarquement de Kakarlong s'entraînent sur la plage et les navires de récompense sont gravés et réaménagés pour le prochain mangayaw."

 nd_pnt_dest_grand_council_hall_maintenance: "Entretien de la salle du conseil"
 nd_pnt_dest_grand_council_hall_maintenance_desc: "Du papier, du tissu fin, des bougies en cire d'abeille et de la poterie du conseil pour maintenir l'assemblée fédérée en session toute l'année."

 nd_pnt_dest_raid_anchorage_maintenance: "Entretien des ancrages"
 nd_pnt_dest_raid_anchorage_maintenance_desc: "Du bois, des fournitures navales, du goudron et des armes pour maintenir la flotte de raid prête et le corps de débarquement armé."

 # ===== BUREAUCRACIES =====
 pnt_datu_council_bureaucracy: "Conseil Datu de Madja-as"
 pnt_datu_council_bureaucracy_desc: "La confédération des Datu suprêmes, fondée dans la légende par Datu Sumakwel, rassemble les kedatuan Visayan en un seul corps qui ratifie les querelles, attribue les butins des raids et discipline les chefs réfractaires. Maintenu, le conseil répond à Aklan ; négligée, la maison longue de chaque datu devient sa propre cour."
 pnt_babaylan_order_bureaucracy: "Babaylan Spirit-Ordre moyen"
 pnt_babaylan_order_bureaucracy_desc: "Les babaylan sont des prêtresses anitistes qui guérissent les malades, sanctionnent les récoltes et intercèdent auprès de diwata ; en l'absence de données, ils prennent l'autorité intérimaire sur le barangay. Parrainé par l’État, l’ordre forme une lignée rituelle cohérente ; abandonnés, des cultes dissidents prolifèrent et la frontière entre sorcellerie et culte se dissout."
 pnt_lipong_brotherhood_bureaucracy: "Confrérie tatouée Lipong"
 pnt_lipong_brotherhood_bureaucracy_desc: "Les lipong sont les guerriers binatakan les plus tatoués, chaque marque étant obtenue par des actes lors des raids mangayaw ; les tatouages ​​​​faciaux appartiennent uniquement aux tueurs avérés. En tant qu'institution, la confrérie soutient un corps permanent d'anciens combattants ; Négligés, les Lipong se transforment en bandes de guerre privées se disputant l'honneur et le butin."
 pnt_mangayaw_fleet_bureaucracy: "Flotte de Karakoa Mangayaw"
 pnt_mangayaw_fleet_bureaucracy_desc: "L'abay est une flotte coordonnée de karakoa et de balangay qui navigue dans les mers Visayan chaque saison pour capturer des captifs, des têtes et des hommages. Financé, il revient avec des esclaves et de l'or pour les capitaines timawa ; des équipages abandonnés et inactifs se transforment en pirates ou se vendent à des datus rivaux, et le nom du royaume devient synonyme de raid."
 pnt_oripun_bondage_bureaucracy: "Registre du Conseil d'Oripun"
 pnt_oripun_bondage_bureaucracy_desc: "Le droit coutumier visayan permettait à la dette de plonger un homme libre dans la servitude uripon, l'obligation étant transmise à ses enfants. Les registres d'État conservés dans chaque maison longue de données freinent les abus les plus ruineux commis par des chefs puissants et codifient les limites de ce qu'un créancier peut exiger, mais ils ne peuvent pas abolir un système intégré à la richesse précoloniale. Sans surveillance, les oripun s'enfuient dans les forêts, le tribut des buhis échoue et les hommes forts ruraux règlent les différends par des raids."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_pnt_bureaucracy_authority: "Autorité bureaucratique Pintados"
 AUTO_MODIFIER_DESC_nd_pnt_bureaucracy_authority: "On formation, the Pintados Confederation gains the right to host historical Pintados institutions. This authority grants three bureaucracy slots."
