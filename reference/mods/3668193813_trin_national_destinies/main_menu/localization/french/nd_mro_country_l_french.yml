 MRO: "Mindanao"
 MRO_ADJ: "Moro"
 MRO_f: "Sultanat de Moro"
 MRO_f_desc: "Le sultanat de Moro est la confédération panislamique non réalisée de Mindanao et de Sulu, le sultan-calife, à qui les sultanats rivaux de Sulu, Maguindanao, Lanao et Buayan, les rajahs de Butuan et les datus de Zamboanga et de la côte d'Iranun ont tous prêté un seul serment de fidélité. Son aristocratie guerrière porte les kris et kalis aux lames ondulées ; ses flottes vinta, gréées latinement et plus rapides que n'importe quel galion, harcèlent les intrus espagnols, hollandais et anglais depuis la mer de Sulu jusqu'aux Visayas. Pour le former, il faut unifier Mindanao sous la foi sunnite et asseoir un seul calife à Maimbung et Kuta Watu, l'alternative à trois siècles de conquête coloniale que les îles du sud n'ont jamais acceptées."
