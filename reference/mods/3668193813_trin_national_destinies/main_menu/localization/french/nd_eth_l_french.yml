l_french:
 STATIC_MODIFIER_NAME_nd_sword_of_zion: "Épée de Sion"
 STATIC_MODIFIER_DESC_nd_sword_of_zion: "Le trône éthiopien est le siège de la dynastie choisie par Dieu, descendante de Salomon et de la reine de Saba. Nos armées marchent sous la bannière du Lion de Juda, défenseurs de la foi chrétienne en Afrique. Que le monde tremble devant l’épée de Sion."
 STATIC_MODIFIER_NAME_nd_light_of_aksum: "Lumière d'Axoum"
 STATIC_MODIFIER_DESC_nd_light_of_aksum: "Des anciens obélisques d'Axoum aux églises rupestres de Lalibela, l'Éthiopie est un phare de civilisation depuis l'Antiquité. Notre écriture Ge'ez, nos manuscrits, nos relations diplomatiques avec des royaumes lointains, tels sont les trésors qui nous distinguent. Que la Lumière d'Axoum illumine le monde."
 STATIC_MODIFIER_NAME_nd_portuguese_arms: "Armes portugaises"
 STATIC_MODIFIER_DESC_nd_portuguese_arms: "L'expédition portugaise a introduit les mousquets à mèche et les canons dans nos armées. Les soldats éthiopiens s’entraînent désormais avec des armes à feu en plus de leurs armes traditionnelles, créant ainsi une formidable force de combat hybride."
 STATIC_MODIFIER_NAME_nd_highland_defense: "Défense des Hautes Terres"
 STATIC_MODIFIER_DESC_nd_highland_defense: "Les montagnes sont notre forteresse. Les amères leçons de la guerre d'Adal nous ont appris à utiliser le terrain des hautes terres comme notre meilleure arme, transformant chaque col de montagne en terrain de chasse pour les envahisseurs."
 STATIC_MODIFIER_NAME_nd_imperial_restoration: "Restauration Impériale"
 STATIC_MODIFIER_DESC_nd_imperial_restoration: "Le chaos de l’ère des princes est terminé. L’empereur s’assure à nouveau de la loyauté des provinces et la machinerie du gouvernement centralisé se met en marche. L’Éthiopie ne sera plus divisée."
 STATIC_MODIFIER_NAME_nd_princely_compromise: "Compromis princier"
 STATIC_MODIFIER_DESC_nd_princely_compromise: "Plutôt que d’écraser les seigneurs régionaux, l’empereur a négocié un équilibre prudent des pouvoirs. L'autonomie provinciale est préservée en échange de la loyauté envers le trône, créant ainsi un royaume diversifié mais stable."
 STATIC_MODIFIER_NAME_nd_tewodros_vision: "Vision de Téwodros"
 STATIC_MODIFIER_DESC_nd_tewodros_vision: "Le roi des bandits devenu empereur a la vision d’une Éthiopie moderne, une nation dotée d’une armée professionnelle permanente, de routes modernes et d’une administration centralisée. Le vieil ordre féodal doit se plier ou se briser."
 nd_eth.1.t: "La restauration du trône salomonien"
 nd_eth.1.d: "The highlands of the Horn are united once more under the banner of the Lion of Judah. The Solomonic dynasty, claiming unbroken descent from King Solomon and the Queen of Sheba through the Kebra Nagast, now rules over a reunified Ethiopia. From the ancient stelae of Aksum to the rock-hewn churches of Lalibela, from the Red Sea coast to the highlands of Shewa, our domain encompasses one of the oldest Christian civilizations on Earth.\n\nBut what manner of empire shall this be? The Negusa Nagast, King of Kings, must choose the path that will define Ethiopia for generations. Will we be the militant defenders of our faith, a sword raised against all who threaten Christendom in Africa? Or will we draw upon the ancient wisdom of Aksum, becoming a beacon of learning, diplomacy, and trade that commands respect through cultural grandeur rather than the spear alone?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_eth.1.a: "Nous sommes l'épée de Sion. Que personne ne conteste la foi !"
 nd_eth.1.b: "Nous sommes la Lumière d'Axoum. Que notre civilisation rayonne !"
 nd_eth.2.t: "La gloire des rois"
 nd_eth.2.d: "Scribes at the imperial court have completed a momentous work: the Kebra Nagast, the Glory of Kings. This grand compilation traces the lineage of our dynasty from King Solomon himself, through his son Menelik I who brought the Ark of the Covenant from Jerusalem to Aksum. The text weaves together biblical narrative, Ethiopian legend, and political theology into a masterwork that legitimizes the Solomonic dynasty's claim to rule.\n\nMore than mere propaganda, the Kebra Nagast establishes Ethiopia as a chosen nation with a divine mandate. Foreign ambassadors who hear its claims regard our kingdom with new reverence, while our own people find in it a profound source of national identity and purpose."
 nd_eth.2.a: "La Gloire des Rois sera l'écriture de notre nation."
 nd_eth.3.t: "La guerre d'Adal"
 nd_eth.3.d: "The Horn of Africa trembles. Imam Ahmad ibn Ibrahim al-Ghazi, known as Gragn, 'the Left-Handed', has unleashed the armies of the Adal Sultanate upon the Ethiopian highlands. His forces, armed with Ottoman firearms and burning with religious fervor, have overrun province after province, sacking churches, burning manuscripts centuries old, and putting Christian communities to the sword.\n\nThis is an existential struggle for Ethiopia's survival. The empress has desperately sought aid from abroad, and a Portuguese expedition under Cristovao da Gama has arrived at Massawa with four hundred soldiers bearing matchlock muskets and cannon, weapons Ethiopia has never seen. The question now is how to rebuild from this devastation."
 nd_eth.3.a: "Adoptez les armes à feu portugaises. Maîtrisons les armes du futur."
 nd_eth.3.b: "Faites confiance à nos montagnes ; les hauts plateaux eux-mêmes sont notre plus grande forteresse."
 nd_eth.4.t: "La splendeur de Gondar"
 nd_eth.4.d: "Emperor Fasilides has done what no Ethiopian ruler before him accomplished: he has established a permanent capital. At Gondar, north of Lake Tana, rises the Fasil Ghebbi, a royal enclosure of stone castles that would not look out of place in Europe. Influenced by Portuguese, Indian, and local architectural traditions, these structures of brown basalt and wine-colored tuff represent a new chapter in Ethiopian civilization.\n\nFor centuries, Ethiopian emperors ruled from moving camps, exhausting each locale before moving on. Gondar changes everything. A permanent capital means permanent institutions, a fixed court, established markets, resident diplomats, and a growing urban population that will transform Ethiopian society for the next century."
 nd_eth.4.a: "Gondar sera le joyau de l'Afrique."
 nd_eth.5.t: "L'ère des princes"
 nd_eth.5.d: "The assassination of Emperor Iyoas I by Ras Mikael Sehul in 1769 has plunged Ethiopia into the Zemene Mesafint, the Era of the Princes. The Solomonic emperors still sit upon their throne in Gondar, but they are puppets, their power reduced to ceremonial gestures while regional lords, the Ras and Dejazmach, wage their own wars, levy their own taxes, and rule their territories as independent fiefdoms.\n\nIn eighty-six years, twenty-three emperors will occupy the throne, most mere figureheads installed and removed at the whim of whichever warlord controls Gondar. Ethiopia faces a choice: will a strong emperor reassert central authority and crush the regional lords, or will the realm find stability through a negotiated balance of power?"
 nd_eth.5.a: "Restaurez l'autorité du trône, mettez fin à ce chaos !"
 nd_eth.5.b: "Négocier avec les princes, la stabilité par le compromis."
 nd_eth.6.t: "L'ascension de Téwodros"
 nd_eth.6.d: "From the chaos of the Zemene Mesafint emerges an unlikely savior. Kassa Hailu, a bandit chieftain from the borderlands of Qwara, has defeated every rival warlord and proclaimed himself Emperor Tewodros II, taking a name from prophecy that foretold a righteous king who would restore Ethiopia's glory.\n\nTewodros envisions nothing less than a complete transformation of Ethiopia. He disbands the feudal levies and creates a permanent standing army loyal only to the crown. He builds roads to connect the provinces. He commissions the casting of cannon at his mountain fortress of Magdala. He attempts to abolish the slave trade and reduce the power of the Church. Not since Amda Seyon has an Ethiopian emperor displayed such fierce ambition, or such willingness to break with the old order."
 nd_eth.6.a: "L'Éthiopie renaîtra à l'image de Tewodros."
 nd_eth_geez_literary_tradition: "Tradition littéraire Ge'ez"
 nd_eth_geez_literary_tradition_desc: "Le développement de l'écriture Ge'ez unique en Éthiopie et de sa tradition monastique de copie de manuscrits, créant l'une des plus anciennes cultures littéraires continues d'Afrique."
 nd_eth_shotelai_tradition: "Cavalerie Shotelai"
 nd_eth_shotelai_tradition_desc: "La tradition des guerriers des hautes terres à cheval, armés de l'épée courbée du shotel, habiles aux manœuvres de flanc à travers le plateau éthiopien."
 nd_eth_aksumite_heritage: "Patrimoine aksoumite"
 nd_eth_aksumite_heritage_desc: "L'héritage durable de l'ancien royaume d'Axoum, ses stèles, sa monnaie, ses relations commerciales avec Rome et l'Inde, qui confèrent à la civilisation éthiopienne un prestige inégalé en Afrique subsaharienne."
 nd_eth_tej_production: "Production Tej"
 nd_eth_tej_production_desc: "L'ancienne tradition éthiopienne du brassage du tej, un vin de miel au cœur des rituels sociaux, des cérémonies religieuses et de la vie quotidienne dans les hauts plateaux."
 nd_eth_amba_fortification: "Fortification d'Amba"
 nd_eth_amba_fortification_desc: "La pratique éthiopienne consistant à fortifier les mesas de montagne (ambas) au sommet plat comme des forteresses naturelles presque imprenables, utilisées pour emprisonner les rivaux, stocker des trésors et défendre les cols stratégiques."
 nd_eth_amole_trade_network: "Réseau commercial Amole"
 nd_eth_amole_trade_network_desc: "Le système commercial sophistiqué s'est construit autour des barres de sel d'Amole, extraites de la dépression de Danakil et utilisées comme monnaie dans les hauts plateaux éthiopiens et au-delà."
 nd_eth_kebra_nagast: "Kebra Nagast"
 nd_eth_kebra_nagast_desc: "La compilation du Kebra Nagast, la Gloire des Rois, un texte fondateur retraçant la descendance de la dynastie salomonienne du roi Salomon et établissant le droit divin de l'Éthiopie sur l'Arche d'Alliance."
 nd_eth_shotelai_renaissance: "Shotelai Renaissance"
 nd_eth_shotelai_renaissance_desc: "L'évolution des tactiques de cavalerie éthiopienne à l'époque de la Renaissance, combinant le shotel traditionnel avec une armure améliorée et des techniques de charge coordonnées."
 nd_eth_solomonic_admin: "Administration salomonienne"
 nd_eth_solomonic_admin_desc: "Le système administratif impérial de la dynastie salomonienne, centré sur le Negusa Nagast et ses gouverneurs nommés, maintenait le contrôle sur le vaste royaume des hautes terres."
 nd_eth_shamma_tradition: "Tissage Shamma"
 nd_eth_shamma_tradition_desc: "The distinctive Ethiopian tradition of weaving shamma cloth, white cotton garments with decorative borders, worn by all classes of Ethiopian society from peasants to emperors."
 nd_eth_red_sea_trade: "Commerce de la Mer Rouge"
 nd_eth_red_sea_trade_desc: "Accès de l'Éthiopie au réseau commercial lucratif de l'océan Indien via les ports de Massawa et Zeila sur la mer Rouge, échangeant de l'or, de l'ivoire et des esclaves contre des chevaux, des textiles et des armes."
 nd_eth_zagwe_architecture: "L'héritage architectural de Zagwe"
 nd_eth_zagwe_architecture_desc: "L'extraordinaire tradition architecturale taillée dans la roche héritée de la dynastie Zagwe, illustrée par les onze églises monolithiques de Lalibela taillées directement dans la roche vivante."
 nd_eth_portuguese_alliance: "Alliance portugaise"
 nd_eth_portuguese_alliance_desc: "La connexion diplomatique avec le Portugal, née d'une solidarité chrétienne mutuelle contre l'Islam, qui a apporté à l'Éthiopie la technologie militaire européenne et la reconnaissance diplomatique."
 nd_eth_adal_war_veterans: "Anciens combattants d'Adal"
 nd_eth_adal_war_veterans_desc: "La génération de soldats aguerris, forgés dans la guerre existentielle contre le sultanat Adal de l'imam Ahmad Gragn, des guerriers qui ont appris à se battre à la fois avec l'épée et avec une mèche."
 nd_eth_danakil_route: "Route du sel de Danakil"
 nd_eth_danakil_route_desc: "Control of the salt extraction routes from the Danakil Depression, where the brutal heat of the lowest point in Africa yields the amole bars that serve as Ethiopia's primary currency."
 nd_eth_gondarine_splendor: "Splendeur gondarine"
 nd_eth_gondarine_splendor_desc: "The establishment of Gondar as Ethiopia's first permanent capital, crowned by the magnificent Fasil Ghebbi royal enclosure with its stone castles blending Ethiopian, Portuguese, and Indian architectural influences."
 nd_eth_chewa_tradition: "Garde impériale Chewa"
 nd_eth_chewa_tradition_desc: "Le système Chewa de colonies militaires d'élite, où des soldats professionnels installés dans des provinces stratégiques servent d'armée permanente et de garde personnelle de l'empereur."
 nd_eth_gult_system: "Système Gult"
 nd_eth_gult_system_desc: "Le système éthiopien d'attribution de terres dans lequel l'empereur accorde des droits de gult aux nobles et aux commandants militaires, leur accordant le pouvoir de percevoir des impôts en échange d'obligations de service militaire."
 nd_eth_gondarine_artillery: "Artillerie gondarine"
 nd_eth_gondarine_artillery_desc: "L'adoption de l'artillerie à poudre par l'armée éthiopienne, s'appuyant sur la technologie introduite lors de l'alliance portugaise et affinée pendant la période Gondarine."
 nd_eth_beta_israel: "Tolérance Beta Israël"
 nd_eth_beta_israel_desc: "Reconnaissance des Beta Israel, des Juifs éthiopiens dont la foi remonte aux compagnons de Ménélik Ier, en tant que communauté protégée, intégrant leurs compétences en matière de travail des métaux, de tissage et de poterie dans la société éthiopienne."
 nd_eth_oromo_integration: "Intégration Oromo"
 nd_eth_oromo_integration_desc: "L'absorption progressive des peuples Oromo dans l'État éthiopien, apportant leurs traditions supérieures de cavalerie et leur économie pastorale pour enrichir la diversité militaire et culturelle de l'empire."
 nd_eth_zemene_mesafint: "Zemene Mésafint"
 nd_eth_zemene_mesafint_desc: "Les dures leçons du Zemene Mesafint, l’ère des princes, où les seigneurs de guerre régionaux ont réduit les empereurs à des marionnettes, enseignant à l’Éthiopie la fragilité du pouvoir centralisé."
 nd_eth_coffee_ceremony: "Cérémonie du café éthiopien"
 nd_eth_coffee_ceremony_desc: "La ritualisation de la consommation du café, buna en amharique, dans la cérémonie élaborée du café éthiopien, transformant une boisson stimulante en pierre angulaire de la vie sociale et du commerce."
 nd_eth_manuscript_school: "École des Manuscrits Gondarine"
 nd_eth_manuscript_school_desc: "La floraison des manuscrits enluminés éthiopiens pendant la période Gondarine, produisant des bibles et des hagiographies peintes aux couleurs vives qui représentent le summum de l'art visuel éthiopien."
 nd_eth_tewodros_reunification: "Réunification de Téwodros"
 nd_eth_tewodros_reunification_desc: "La révolution militaire et administrative de l’empereur Tewodros II, qui mit fin au Zemene Mesafint, créa une armée nationale permanente et envisagea un État éthiopien moderne et centralisé."
 nd_eth_modernization: "Modernisation éthiopienne"
 nd_eth_modernization_desc: "Le programme plus large de modernisation initié par Tewodros II, construction de routes, fabrication d'armes, réforme administrative, a été poursuivi par ses successeurs Yohannes IV et Menelik II."
 nd_eth_sovereignty: "Souveraineté abyssinienne"
 nd_eth_sovereignty_desc: "L'affirmation de l'indépendance de l'Éthiopie à l'ère du colonialisme européen, étant le seul État africain à résister avec succès à la ruée vers l'Afrique et à maintenir sa souveraineté."
 a_nd_eth_shotelai: "Shotaï"
 a_nd_eth_shotelai_desc: "Cavalerie des Highlands armée du shotel, une épée incurvée en forme de faucille conçue pour contourner le bouclier d'un adversaire. Habile aux manœuvres de flanc à travers le plateau éthiopien."
 a_nd_eth_shotelai_ren: "Renaissance Shotelai"
 a_nd_eth_shotelai_ren_desc: "Des cavaliers Shotelai améliorés avec une meilleure armure et des tactiques coordonnées, conservant leurs prouesses de flanc traditionnelles tout en s'adaptant à l'évolution de la guerre."
 a_nd_eth_adal_veterans: "Anciens combattants d'Adal"
 a_nd_eth_adal_veterans_desc: "Une infanterie aguerrie, forgée dans la guerre dévastatrice contre les forces Adal de l'imam Ahmad Gragn. Ils combattent avec la détermination désespérée de soldats qui ont fait face à l’anéantissement national."
 a_nd_eth_chewa_guard: "Garde impériale Chewa"
 a_nd_eth_chewa_guard_desc: "Cavalerie de famille d'élite du Negusa Nagast, issue des colonies militaires installées à travers l'empire. Prêtés serment devant l'empereur seul, ils sont les soldats les plus disciplinés d'Éthiopie."
 a_nd_eth_oromo_horsemen: "Cavaliers Oromo"
 a_nd_eth_oromo_horsemen_desc: "Cavalerie Oromo intégrée qui apporte la rapidité et l'agressivité des traditions de raids pastoraux à l'armée impériale éthiopienne. Rapide, intrépide et dévastateur en terrain découvert."
 a_nd_eth_tewodros_fusiliers: "Fusiliers Tewodros"
 a_nd_eth_tewodros_fusiliers_desc: "L'infanterie éthiopienne moderne réformée sous l'empereur Tewodros II, équipée de mousquets et entraînée aux exercices de style européen, représente la première armée permanente éthiopienne véritablement professionnelle."
 a_nd_eth_gondarine_cannon: "Canon Gondarine"
 a_nd_eth_gondarine_cannon_desc: "Équipages d'artillerie éthiopiens utilisant des canons adoptés à partir de la technologie portugaise, perfectionnée pendant la période Gondarine pour la guerre de siège sur les hautes terres."
 nd_eth_debra: "Débra"
 nd_eth_debra_desc: "Une église monastique éthiopienne et un scriptorium où les moines copient des manuscrits en écriture Ge'ez, préservant ainsi les textes religieux, les chroniques et l'héritage littéraire de l'une des plus anciennes civilisations d'Afrique."
 nd_eth_amole_market: "Marché d'Amolé"
 nd_eth_amole_market_desc: "Un centre commercial construit autour de l'échange de barres de sel d'Amole, des blocs de sel gemme extraits de la dépression de Danakil qui servent de monnaie dans tous les hauts plateaux éthiopiens."
 nd_eth_fasil_ghebbi: "Fasil Ghebbi"
 nd_eth_fasil_ghebbi_desc: "Une enceinte royale dans le style de l'enceinte du château de Gondar, mêlant les traditions architecturales éthiopiennes, portugaises et indiennes dans un complexe forteresse-palais de basalte brun."
 nd_eth_buna_bet: "Pari Buna"
 nd_eth_buna_bet_desc: "Un café éthiopien où la cérémonie élaborée du buna, la torréfaction, la mouture et l'infusion des grains de café, sert de centre de la vie sociale, des négociations commerciales et des rassemblements communautaires."
 nd_eth_amba: "Forteresse d'Amba"
 nd_eth_amba_desc: "Une mesa de montagne fortifiée au sommet plat, exploitant le relief spectaculaire des hautes terres éthiopiennes pour créer une forteresse naturelle accessible uniquement par des sentiers étroits et facilement défendus."
 nd_eth_tej_bet: "Pari Tej"
 nd_eth_tej_bet_desc: "Un établissement pour la production et la vente de tej, du vin de miel éthiopien, une boisson essentielle à la culture éthiopienne, consommée lors des fêtes, des cérémonies religieuses et des repas quotidiens."
 nd_eth_shamma_looms: "Shamma Looms"
 nd_eth_shamma_looms_desc: "A row of pit looms under a thatched roof. The weavers sit with their feet in the pit and work the cotton into the long white cloth worn across the highlands."
 nd_eth_amole_cuttings: "Amole Cuttings"
 nd_eth_amole_cuttings_desc: "A working on the salt plain of the Danakil, below the level of the sea. The amole, the salt bars that pass as money in the highlands, are cut here."
 nd_eth_gult_estate: "Domaine Gult"
 nd_eth_gult_estate_desc: "Domaine octroyé par l'empereur à une noblesse loyale, où le détenteur du gult perçoit des impôts et lève des prélèvements militaires en échange d'un service assermenté au trône salomonien."
 nd_eth_manuscript_copying: "Copie de manuscrits"
 nd_eth_manuscript_copying_desc: "Les moines s'efforcent de copier des textes religieux et des chroniques dans l'ancienne écriture Ge'ez, préservant ainsi la tradition littéraire éthiopienne."
 nd_eth_salt_exchange: "Échange de sel"
 nd_eth_salt_exchange_desc: "Le commerce animé des barres de sel d'Amole, pesées, classées et échangées comme monnaie contre des marchandises de toute la région."
 nd_eth_palace_upkeep: "Entretien du palais"
 nd_eth_palace_upkeep_desc: "L'entretien des châteaux en pierre, des jardins et des espaces cérémoniels de l'enceinte royale."
 nd_eth_coffee_roasting: "Torréfaction du café"
 nd_eth_coffee_roasting_desc: "La torréfaction et la mouture des grains de café éthiopiens lors de la cérémonie traditionnelle remplissent l'air de l'arôme distinctif du buna."
 nd_eth_amba_garrison: "Garnison d'Amba"
 nd_eth_amba_garrison_desc: "Des soldats armés maintiennent les défenses de la forteresse au sommet de la montagne et gardent les abords étroits."
 nd_eth_tej_brewing: "Brasserie Tej"
 nd_eth_tej_brewing_desc: "La fermentation du miel et des feuilles de gesho pour produire le tej, le vin de miel bien-aimé des Ethiopiens."
 nd_eth_gult_obligations: "Obligations de Gult"
 nd_eth_gult_obligations_desc: "Le flux de tribut des fermiers vers le détenteur du gult : bétail, céréales et main-d'œuvre en échange d'une protection militaire."
 nd_eth_shamma_weaving: "Tissage Shamma"
 nd_eth_shamma_weaving_desc: "Cotton is spun at home and woven on the pit loom into the white shamma. A coloured border is worked into the cloth of those who can pay for it."
 nd_eth_danakil_extraction: "Extraction du sel de Danakil"
 nd_eth_danakil_extraction_desc: "The salt crust is levered up in slabs and trimmed into bars of one size. Camel caravans carry the bars up the escarpment to the highland markets."
 levy_nd_eth_shotelai: "Prélèvement Shotelai"
 levy_nd_eth_shotelai_desc: "Des cavaliers des Highlands rassemblés dans les domaines nobles, armés de l'épée courbée traditionnelle du shotel."
 levy_nd_eth_shotelai_ren: "Prélèvement Shotelai Renaissance"
 levy_nd_eth_shotelai_ren_desc: "Cavalerie Shotelai améliorée prélevée auprès de la noblesse provinciale, combinant des armes traditionnelles avec une meilleure armure."
 levy_nd_eth_chewa_guard: "Prélèvement sur la garde Chewa"
 levy_nd_eth_chewa_guard_desc: "Cavalerie d'élite issue des colonies militaires Chewa, assermentée devant l'empereur et maintenue comme force de combat permanente."
 nd_eth_formed_tt: "L'Éthiopie a été créée"
 nd_eth_path_a_tt: "Choisissez le destin de l'épée#bold de Sion#!"
 nd_eth_path_b_tt: "Choisissez la Lumière#bold du destin d'Aksum#!"
 nd_eth_dest_gondar_market_tt: "Owns #bold Gondar#! with at least #bold 24#! development"
 nd_eth_dest_gondar_capital_tt: "Owns #bold Gondar#! with at least #bold 32#! development"
 nd_eth_destiny: "Le mandat salomonien"
 nd_eth_destiny_desc: "Les hauts plateaux étant unis sous le Lion de Juda, les Negusa Nagast doivent consolider leur autorité impériale. Stabilisez le royaume pour vous préparer au grand destin qui attend le trône salomonien."
 nd_eth_dest_horn: "Conquête de la Corne"
 nd_eth_dest_horn_desc: "Les bastions musulmans de Harar et de Berbera dominent les approches orientales des hauts plateaux éthiopiens. Saisissez-les pour briser le pouvoir islamique sur la Corne et ouvrir la voie vers la mer."
 nd_eth_dest_red_sea: "Maîtres de la Mer Rouge"
 nd_eth_dest_red_sea_desc: "Le contrôle d'Aden et de Suakin place toute la mer Rouge sous la domination salomonienne. Construisez une puissante armée et saisissez ces portes pour contrôler le détroit entre l’Afrique et l’Arabie."
 nd_eth_dest_new_jerusalem: "La nouvelle Jérusalem"
 nd_eth_dest_new_jerusalem_desc: "Accomplissez la prophétie salomonienne. Prenez Jérusalem et La Mecque, prouvant que les descendants de Salomon sont revenus réclamer leur héritage divin. Gagnez le prestige digne du Prêtre Jean."
 nd_eth_dest_crossroads: "Carrefour de l'Océan Indien"
 nd_eth_dest_crossroads_desc: "L’Éthiopie se situe au carrefour de l’Afrique et de l’Arabie. Attirez les richesses du commerce de l'océan Indien vers les marchés des hautes terres, le café de nos propres plateaux, l'ivoire de l'intérieur, et remplissez le trésor d'or."
 nd_eth_dest_gold_routes: "Les routes de l'or"
 nd_eth_dest_gold_routes_desc: "Extend Aksumite commercial ambitions down the Swahili coast. Take Mogadishu, embrace modern banking, and build up Gondar, where the caravans of Sennar, Massawa and the south-west meet."
 nd_eth_dest_crown_nile: "Couronne du Nil"
 nd_eth_dest_crown_nile_desc: "Claim Cairo, the greatest city of the Nile, and build a commercial empire that spans from the highland sources of the Blue Nile to the Mediterranean. Bring the spices of India to the capital's market and raise Gondar to twice its old size."
 nd_eth.7.t: "Le mandat salomonien"
 nd_eth.7.d: "The court astrologers and the Abun himself agree: the signs are auspicious. The highlands are at peace, the treasury is sound, and the authority of the Negusa Nagast is unchallenged from Tigray to Shewa. Ethiopia stands ready to fulfill whatever destiny God has ordained for the heirs of Solomon.\n\nThe scribes record this moment in the royal chronicle: on this day, the Solomonic mandate was renewed, and the empire set its face toward greatness."
 nd_eth.7.a: "Le mandat de Salomon est renouvelé."
 nd_eth.8.t: "L'épée descend sur la corne"
 nd_eth.8.d: "Harar, that fortress of Islam on our eastern frontier, has fallen to Ethiopian arms. The crescent has been torn down from its minarets and the cross raised in its place. Berbera too submits, its merchants now paying tribute to the Lion of Judah rather than to Somali sultans.\n\nThe conquest of the Horn sends a message to every Muslim state from Aden to Cairo: Ethiopia is no longer content to merely defend its mountains. The Sword of Zion reaches outward now, and it will not be sheathed until the Negusa Nagast's ambitions are fulfilled."
 nd_eth.8.a: "La Corne est à nous. Qu’y a-t-il au-delà ?"
 nd_eth.9.t: "Maîtres de la Mer Rouge"
 nd_eth.9.d: "Ethiopian banners fly over Aden and Suakin. The great strait that connects the Mediterranean world to the Indian Ocean is now firmly in Solomonic hands. No ship passes through the Bab el-Mandeb without Ethiopia's leave.\n\nThis is a transformation for a highland empire that once had no coastline at all. Ethiopian governors now administer tropical ports, collect customs on Indian spices, and oversee the provisioning of fleets. The question is whether to build naval power to dominate these waters, or to press the holy war ever deeper into the lands of Islam."
 nd_eth.9.a: "Construisez une flotte digne d'un empire maritime."
 nd_eth.9.b: "Pressez la guerre sainte : Dieu le veut !"
 nd_eth.10.t: "La nouvelle Jérusalem"
 nd_eth.10.d: "The impossible has been achieved. Ethiopian soldiers stand in Jerusalem and Mecca alike. The Solomonic prophecy is fulfilled: the descendants of Menelik I have returned to the lands of their ancestor. The Ark of the Covenant, long kept in Aksum, now rests in a land that stretches from its origin to its promised destination.\n\nChristian Europe is astonished. The legend of Prester John, the mighty Christian king beyond the lands of Islam, has become reality. Ambassadors arrive from Rome, from Constantinople, from every court in Europe, eager to treat with this African emperor who has accomplished what the Crusaders could not. How shall Ethiopia wield this extraordinary power?"
 nd_eth.10.a: "Bienvenue aux ambassadeurs. Nous sommes le Prêtre Jean."
 nd_eth.10.b: "Nous n’avons besoin d’aucune approbation étrangère. Le Lion conquiert."
 nd_eth.11.t: "Carrefour de l'Océan Indien"
 nd_eth.11.d: "Ethiopian coffee and ivory now flow through the markets of the capital, drawing merchants from Arabia, India, and beyond. The highland plateaus that once seemed isolated from the world's commerce have become a crossroads. Dhows carry our coffee to Aden and Hormuz. Ivory caravans from the interior terminate in our markets. Gold accumulates in the royal treasury at a pace that would have astonished the Aksumite kings.\n\nThe ancient dream of Aksum, to be a trading civilization that bridges Africa and the Indian Ocean world, lives again. And unlike Aksum, we command the coffee that the world is learning to crave."
 nd_eth.11.a: "Laissons la richesse de l’océan couler entre nos mains."
 nd_eth.12.t: "Les routes de l'or"
 nd_eth.12.d: "Mogadishu, jewel of the Swahili coast, now answers to the Negusa Nagast. Its ancient trading houses, accustomed to dealing in gold, ivory, and spices, have opened their ledgers to Ethiopian merchants. With the embrace of banking institutions and the growth of the great market at Gondar, Ethiopia has transformed itself from a mountain fortress into a commercial power.\n\nThe question now is how to wield this wealth. Should Ethiopia monopolize the spice routes to maximize revenue, or invest the riches into learning and reform that will endure long after the trade winds shift?"
 nd_eth.12.a: "Monopolisez les routes des épices et de l’or."
 nd_eth.12.b: "Investissez la richesse dans l’apprentissage et la réforme."
 nd_eth.13.t: "Couronne du Nil"
 nd_eth.13.d: "Cairo has fallen to the armies of Ethiopia. The greatest city of the Nile, seat of pharaohs and caliphs, answers now to the Negusa Nagast. Ethiopia controls the entire course of the sacred river from its highland sources to the Mediterranean delta, and Gondar, grown to twice its size, sells the pepper of India beside the gold of the south.\n\nThis is an empire without equal in African history. Neither the Aksumites nor the pharaohs nor the caliphs held dominion over such wealth and such breadth of commerce. Ethiopian scholars debate whether this realm more closely resembles the Queen of Sheba's legendary domain or something entirely new, a civilization that bridges Africa, Arabia, and the Mediterranean world."
 nd_eth.13.a: "Règle avec la sagesse de Makeda, reine de Saba."
 nd_eth.13.b: "Le trône salomonien est éternel et indivis."
 STATIC_MODIFIER_NAME_nd_eth_dest_bab_el_mandeb: "Gardiens du détroit"
 STATIC_MODIFIER_DESC_nd_eth_dest_bab_el_mandeb: "Les forces navales éthiopiennes patrouillent à Bab el-Mandeb, contrôlant le passage entre la mer Rouge et l'océan Indien. Un empire des hautes terres est devenu une puissance maritime."
 STATIC_MODIFIER_NAME_nd_eth_dest_crusade_onward: "Croisade sans fin"
 STATIC_MODIFIER_DESC_nd_eth_dest_crusade_onward: "La guerre sainte se poursuit sur les terres de l’Islam. Les missionnaires éthiopiens suivent le sillage des armées, convertissant les vaincus, même si le coût d'une campagne interminable met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_eth_dest_prester_john: "Le prêtre Jean révélé"
 STATIC_MODIFIER_DESC_nd_eth_dest_prester_john: "La légende du Prêtre Jean, puissant roi chrétien au-delà des terres d’Islam, est devenue réalité. Les ambassadeurs européens se rendent en masse à la cour éthiopienne et les agents éthiopiens se déplacent librement parmi les cours de la chrétienté."
 STATIC_MODIFIER_NAME_nd_eth_dest_lion_conquers: "Le Lion conquiert"
 STATIC_MODIFIER_DESC_nd_eth_dest_lion_conquers: "Le Lion de Juda s’est révélé plus puissant que n’importe quelle force déployée contre lui. Les armées éthiopiennes se déplacent avec une rapidité redoutable et un brio tactique, dictant leurs conditions aux vaincus."
 STATIC_MODIFIER_NAME_nd_eth_dest_spice_monopoly: "Monopole des épices"
 STATIC_MODIFIER_DESC_nd_eth_dest_spice_monopoly: "Les marchands éthiopiens accaparent le commerce du café, de l’ivoire et des épices le long de la côte de l’océan Indien. L’accent mis sur le commerce signifie que l’entretien des armées devient plus coûteux, mais la richesse compense largement."
 STATIC_MODIFIER_NAME_nd_eth_dest_invest_learning: "Renaissance aksoumite"
 STATIC_MODIFIER_DESC_nd_eth_dest_invest_learning: "La richesse du commerce de l’océan Indien alimente les écoles, les bibliothèques et la réforme juridique. Les érudits éthiopiens produisent des œuvres qui rivalisent avec celles du Caire ou de Constantinople."
 STATIC_MODIFIER_NAME_nd_eth_dest_queen_sheba: "Sagesse de Makeda"
 STATIC_MODIFIER_DESC_nd_eth_dest_queen_sheba: "À l’instar de la reine de Saba qui s’est rendue à Jérusalem en quête de sagesse, l’Éthiopie attire désormais à sa cour les esprits les plus sages de trois continents. Le Negusa Nagast règne par la diplomatie et la connaissance."
 STATIC_MODIFIER_NAME_nd_eth_dest_eternal_throne: "Le trône éternel"
 STATIC_MODIFIER_DESC_nd_eth_dest_eternal_throne: "The Solomonic dynasty sits upon a throne that spans from the Nile to the Indian Ocean. No prince of the blood finds a following against it, and its navy patrols the seas of a vast commercial empire."
 nd_eth_tabernacle: "Tabernacle de Sion"
 nd_eth_tabernacle_desc: "Un sanctuaire monumental construit pour abriter l'Arche d'Alliance, sur le modèle du Temple de Salomon et reflétant la revendication de l'Éthiopie en tant que gardienne de la relique la plus sainte de la chrétienté. Son clergé maintient une veillée éternelle."
 nd_eth_ark_guardians: "Gardiens de l'Arche"
 nd_eth_ark_guardians_desc: "L'ordre sacerdotal consacré à la garde du Tabernacle, à la combustion de l'encens et à l'entretien des reliques sacrées de l'alliance salomonienne."
 nd_eth_house_of_aksumite_learning: "Maison d’apprentissage aksoumite"
 nd_eth_house_of_aksumite_learning_desc: "Une grande académie où convergent les traditions savantes éthiopiennes, égyptiennes, indiennes et swahili. Les commerçants et les érudits se rassemblent pour échanger des connaissances, créant ainsi un centre d'apprentissage et de commerce sans égal en Afrique."
 nd_eth_scholarly_exchange: "Échange scientifique"
 nd_eth_scholarly_exchange_desc: "Des érudits de tout l’empire éthiopien et d’ailleurs étudient, traduisent et produisent des manuscrits dans ce grand centre d’apprentissage."

# ===== BUREAUCRACY =====
 AUTO_MODIFIER_NAME_nd_eth_bureaucracy_authority: "Appareil Salomonien"
 AUTO_MODIFIER_DESC_nd_eth_bureaucracy_authority: "Les institutions de l’État salomonien (le katama itinérant, le siège métropolitain d’Abun, l’autorité de l’Echege sur les monastères, le Fetha Nagast comme loi suprême et le double mandat gultiste qui lie les nobles et les paysans au royaume) ont mûri pour devenir un appareil administratif cohérent. C'est sur cette base que les institutions distinctives de la royauté chrétienne de l'Éthiopie commencent à prendre leur forme durable."

 eth_solomonic_katama_bureaucracy: "Katama salomonien"
 eth_solomonic_katama_bureaucracy_desc: "Le camp royal itinérant fortifié autour du Negusa Nagast, structuré de manière concentrique autour du pavillon impérial et des chapelles royales. Depuis le règne d'Amda Seyon (1314-1344) jusqu'à ce que Fasilides fixe la capitale à Gondar en 1636, l'empereur et sa cour parcouraient constamment le royaume - siégeant à la Cour suprême de justice, recevant des ambassades étrangères et projetant l'autorité salomonienne par sa présence personnelle plutôt que par des décrets écrits. Le katama était le centre politique de l'État et sa présence dans une région était, en soi, une garantie d'allégeance."

 eth_abun_metropolitanate_bureaucracy: "Métropolite d'Abun"
 eth_abun_metropolitanate_bureaucracy_desc: "The Ethiopian Tewahedo Church was led by the Abuna, a Coptic Egyptian monk consecrated by the Patriarch of Alexandria and dispatched south to Aksum. From the conversion of King Ezana in the 4th century until autocephaly in 1959, the Abuna was always a foreigner. The arrangement bound Ethiopia to Coptic Cairo for episcopal succession and gave the church a measure of independence from royal interference, but also made the appointment a perennial bargaining chip with the Mamluk sultans, who could withhold a new Abuna for decades to extort concessions."

 eth_echege_debre_libanos_bureaucracy: "Echege de Debré Libanos"
 eth_echege_debre_libanos_bureaucracy_desc: "L'abbé du grand monastère de Shewan fondé par Saint Tekle Haymanot au XIIIe siècle, qui à partir du XVe siècle détenait le titre d'Echege et l'autorité sur chaque monastère éthiopien. Deuxième au rang ecclésiastique après l'Abuna étranger, l'Echege était toujours un Ethiopien d'origine et, pendant les longues périodes où le siège d'Abuna était vacant, il devenait de facto le chef de l'Église. Cet arrangement donnait au négus un levier clérical domestique que Abuna, nommé par les coptes, ne pouvait pas avoir."

 eth_fetha_nagast_bureaucracy: "Fetha Nagast"
 eth_fetha_nagast_bureaucracy_desc: "La Loi des Rois, le code juridique Ge'ez traduit au XVe siècle à partir de la compilation copte arabe d'Abu'l-Fada'il ibn al-Assal (vers 1240). S'appuyant sur le Corpus de Justinien, les canons de Nicée et d'Antioche et le Pentateuque mosaïque, le Fetha Nagast est resté la loi suprême de l'Éthiopie jusqu'en 1931. Sa première moitié régissait la discipline de l'Église ; sa seconde moitié régissait la famille, la dette et l'administration civile. Seul le clergé pouvait le lire, et ils étaient donc les avocats du royaume, profession dont la noblesse guerrière était structurellement exclue."

 eth_gult_rist_tenure_bureaucracy: "Mandat de Gult et Rist"
 eth_gult_rist_tenure_bureaucracy_desc: "Les deux piliers du droit foncier éthiopien. Gult était un droit de fief, une concession non héréditaire du négus ou de ses gouverneurs qui conférait le droit de percevoir tribut et travail auprès d'une population définie ; le titulaire était un fief et non un propriétaire foncier, et la couronne pouvait retirer la concession à tout moment. Le Rist était le droit d'usage héréditaire inaliénable détenu par chaque descendant d'un premier détenteur ancestral, réparti de manière ambiline entre les générations. Ensemble, ils liaient les nobles à la couronne par la tenure et les paysans au sol par le lignage."

 eth_chewa_regiments_bureaucracy: "Régiments Chewa"
 eth_chewa_regiments_bureaucracy_desc: "Les colonies militaires chrétiennes établies à partir du règne d'Amda Seyon (1314-1344) et réorganisées sous le grand codificateur Zara Yaqob (1434-1468). Chaque régiment de Chewa était une force professionnelle de plusieurs milliers d'hommes, installés dans leur propre mission de Gult, entraînés à l'épée incurvée shotelai et à la lance dès l'enfance, et soutenus par le travail de la paysannerie environnante. Le régiment Abe Lahm, fondé au XIVe siècle, a combattu à Adwa en 1896, soit cinq siècles et demi après sa création."

 eth_ras_bitwoded_government_bureaucracy: "Gouvernement du Ras"
 eth_ras_bitwoded_government_bureaucracy_desc: "Le gouvernement aristocratique régional a mûri pendant le Zemene Mesafint (1769-1855), lorsque l'empereur salomonien de Gondar a été réduit à une figure de proue et que le pouvoir réel appartenait aux premiers ministres Ras-Bitwoded du Tigré, de Yejju, de Gojjam et de Shewa. Vingt-trois empereurs occupèrent le trône en quatre-vingt-six ans ; les familles Ras les nommaient et les destituaient à volonté, et le domaine d'un Ras était gouverné comme le sien. Cet arrangement préservait le royaume en déléguant l’autorité à ceux qui pouvaient la faire respecter localement, au détriment permanent de la légitimité centrale."
