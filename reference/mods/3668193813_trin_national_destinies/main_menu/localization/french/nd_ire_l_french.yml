l_french:
 STATIC_MODIFIER_NAME_nd_ire_gaelic_resurgence: "Résurgence du gaélique"
 STATIC_MODIFIER_DESC_nd_ire_gaelic_resurgence: "Le Haut Roi a restauré les anciennes lois et coutumes de l'ordre gaélique. Les juges de Brehon règlent les différends, les fils préservent les généalogies et les clans se rallient à une Irlande souveraine et libre de toute ingérence étrangère."
 STATIC_MODIFIER_NAME_nd_ire_atlantic_kingdom: "Royaume Atlantique"
 STATIC_MODIFIER_DESC_nd_ire_atlantic_kingdom: "La position de l'Irlande au bord de l'Atlantique en fait une porte d'entrée naturelle entre l'Europe et le reste du monde. Le nouveau royaume construit des navires, courtise les marchands étrangers et regarde vers l’ouest, vers le large océan."
 nd_ire.1.t: "La Haute Royauté d'Irlande"
 nd_ire.1.d: "The clans have united and the Lordship of Ireland is no more. For the first time in centuries, a single High King speaks for all of Erin. But the character of this new kingdom remains to be determined. The Brehon judges still remember the old laws, the filí still sing of ancient glories, and the people still live by the rhythms of the clan system. Yet the Atlantic stretches wide beyond our western shores, and the ports of Galway, Waterford, and Dublin hum with trade from across the sea.\n\nWill we look inward to rebuild the Gaelic order that sustained our ancestors, or outward to the ocean that connects us to the world?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ire.1.a: "Restaurer les lois Brehon"
 nd_ire.1.b: "Construire un royaume atlantique"
 nd_ire.2.t: "Le renouveau du droit Bréhon"
 nd_ire.2.d: "The Brehon legal tradition, which governed Irish society for over a thousand years, stands at a crossroads. These laws (composed by the breithemh judges and transmitted through generations of legal scholars) regulated everything from land tenure to marriage, from the price of honor to the treatment of the sick. Under English pressure, Brehon law retreated beyond the Pale, but it never died.\n\nNow the question arises: should we formalize and strengthen these native courts, or gradually adopt the common law practices that dominate our neighbors and facilitate international commerce?"
 nd_ire.2.a: "Renforcer les tribunaux de Bréhon"
 nd_ire.2.b: "Adopter les pratiques de common law"
 nd_ire.3.t: "La guerre de neuf ans"
 nd_ire.3.d: "The great Gaelic lords Hugh O'Neill, Earl of Tyrone, and Red Hugh O'Donnell have waged a bitter struggle against English encroachment. At the Battle of the Yellow Ford in 1598, O'Neill's forces destroyed an English army, proving that Irish troops could match their opponents in open battle through discipline, use of firearms, and tactical innovation. O'Neill trained his kern in the use of pike and musket, creating the first modern Irish army.\n\nThough the historical campaign ended in defeat at Kinsale, the military lessons endure. Irish warfare will never be the same."
 nd_ire.3.a: "Les leçons de la Ford Jaune perdurent"
 nd_ire.4.t: "Le vol des oies sauvages"
 nd_ire.4.d: "Following the upheavals of war, thousands of Irish soldiers have departed for the continent, entering service in the armies of France, Spain, Austria, and beyond. These 'Wild Geese' carry Irish martial traditions to every corner of Europe. The Irish Brigade in French service will earn renown at Fontenoy, while the Ultonia and Hibernia regiments serve Spain from Flanders to the Americas.\n\nThis diaspora represents both a loss and an opportunity. The soldiers who return bring continental military expertise, while those who remain abroad forge connections that benefit Irish trade and diplomacy."
 nd_ire.4.a: "Accueillons nos anciens combattants chez eux"
 nd_ire.4.b: "Cultiver nos liens avec la diaspora"
 STATIC_MODIFIER_NAME_nd_ire_brehon_courts: "Tribunaux de Bréhon restaurés"
 STATIC_MODIFIER_DESC_nd_ire_brehon_courts: "Les anciens tribunaux de Brehon ont retrouvé leur autorité formelle, réglant les différends selon la tradition juridique irlandaise."
 STATIC_MODIFIER_NAME_nd_ire_common_law_adoption: "Adoption en common law"
 STATIC_MODIFIER_DESC_nd_ire_common_law_adoption: "Les pratiques de la common law anglaise ont été adoptées parallèlement à la tradition autochtone, facilitant les relations internationales et normalisant la gouvernance."
 STATIC_MODIFIER_NAME_nd_ire_continental_veterans: "Vétérans continentaux"
 STATIC_MODIFIER_DESC_nd_ire_continental_veterans: "Les soldats revenant du service continental apportent la discipline militaire et les connaissances tactiques des meilleures armées européennes."
 STATIC_MODIFIER_NAME_nd_ire_diaspora_bonds: "Obligations de la diaspora"
 STATIC_MODIFIER_DESC_nd_ire_diaspora_bonds: "Les Irlandais de l’étranger entretiennent des liens étroits avec leur pays d’origine, canalisant leurs relations commerciales et leur influence diplomatique vers l’Irlande."
 nd_ire_tower_house_tradition: "Tradition de la maison-tour"
 nd_ire_tower_house_tradition_desc: "Le paysage irlandais est parsemé de milliers de maisons-tours, des résidences fortifiées en pierre qui servaient à la fois de sièges de clan et de bastions défensifs."
 nd_ire_brehon_law: "Loi Bréhon"
 nd_ire_brehon_law_desc: "L'ancien code juridique de l'Irlande gaélique, administré par les juges breithemh, réglementant la terre, le mariage, l'honneur et les obligations sociales."
 nd_ire_cattle_lords: "Seigneurs du bétail"
 nd_ire_cattle_lords_desc: "Le bétail est le fondement de la richesse irlandaise. Les seigneurs mesuraient leur statut en troupeaux et les vols de bétail étaient des actes à la fois économiques et politiques."
 nd_ire_tanistry: "Tanistique"
 nd_ire_tanistry_desc: "Le système gaélique de succession élective, dans lequel un taniste est choisi parmi les parents éligibles pour succéder au chef."
 nd_ire_bardic_tradition: "Écoles bardiques"
 nd_ire_bardic_tradition_desc: "Les écoles bardiques d'Irlande forment les fil, des poètes érudits qui préservent la généalogie, le droit et l'histoire à travers une tradition orale et littéraire rigoureuse."
 nd_ire_tower_house_defense: "Défenses de la tour"
 nd_ire_tower_house_defense_desc: "The tower houses of Ireland are improved with machicolations, murder holes, and thicker walls, creating a network of formidable strongpoints."
 nd_ire_gaelic_confederation: "Confédération gaélique"
 nd_ire_gaelic_confederation_desc: "Les grands seigneurs gaéliques forment une confédération sous la direction du Haut Roi, équilibrant l'autonomie des clans et la défense collective."
 nd_ire_monastic_schools: "Écoles monastiques"
 nd_ire_monastic_schools_desc: "La tradition monastique de l'Irlande, qui lui a valu autrefois le titre d'Île des saints et des érudits, continue de nourrir l'apprentissage et l'alphabétisation."
 nd_ire_redshank_tradition: "Tradition du jarret rouge"
 nd_ire_redshank_tradition_desc: "Les mercenaires écossais connus sous le nom de Redshanks complètent depuis longtemps les armées irlandaises. Leur réputation féroce et leur mobilité à travers les mers en font des alliés précieux."
 nd_ire_atlantic_fisheries: "Pêches de l'Atlantique"
 nd_ire_atlantic_fisheries_desc: "La côte ouest de l'Irlande offre de riches zones de pêche qui soutiennent les communautés côtières et forment une population de marins robustes."
 nd_ire_manuscript_tradition: "Tradition manuscrite"
 nd_ire_manuscript_tradition_desc: "The tradition of illuminated manuscripts and scholarly copying, born in monasteries like Kells and Clonmacnoise, continues in Ireland's bardic schools.\n\n#italic Available in: $nd_ire_bardic_school$#!"
 nd_ire_gaelic_lordship: "Seigneurie gaélique"
 nd_ire_gaelic_lordship_desc: "La consolidation des seigneuries gaéliques sous l'autorité royale réduit les conflits internes et renforce le royaume contre les menaces extérieures."
 nd_ire_atlantic_raiders: "Raiders de l'Atlantique"
 nd_ire_atlantic_raiders_desc: "Les corsaires irlandais s'attaquent au commerce ennemi le long des voies de navigation de l'Atlantique, transformant la position côtière de l'Irlande en un avantage stratégique."
 nd_ire_nine_years_war: "Réformes de guerre de neuf ans"
 nd_ire_nine_years_war_desc: "Les innovations militaires de Hugh O'Neill (entraînement du kern au brochet et au mousquet, adoption de tactiques européennes) transforment la guerre irlandaise."
 nd_ire_wool_trade: "Commerce de la laine irlandaise"
 nd_ire_wool_trade_desc: "Ireland's sheep produce excellent wool, and the export trade grows steadily as English and continental merchants seek Irish fleeces.\n\n#italic Available in: $nd_ire_wool_cottage$#!"
 nd_ire_hedge_schools: "Écoles de haie"
 nd_ire_hedge_schools_desc: "Lorsque l’éducation formelle est supprimée, les Irlandais créent des écoles clandestines en plein air où les universitaires enseignent le latin, l’irlandais, les mathématiques et le catéchisme."
 nd_ire_wild_geese: "Oies sauvages"
 nd_ire_wild_geese_desc: "Les soldats irlandais servant dans les armées continentales forment des régiments d’élite réputés pour leur courage. La Brigade irlandaise devient une légende sur les champs de bataille européens."
 nd_ire_linen_industry: "Industrie du Lin"
 nd_ire_linen_industry_desc: "La production de lin transforme l'économie irlandaise. La culture et le blanchiment du lin se développent rapidement, rendant le lin irlandais célèbre dans toute l'Europe."
 nd_ire_provision_trade: "Commerce de provisions"
 nd_ire_provision_trade_desc: "Ireland's exports of salted beef, butter, and pork supply the Atlantic world, from the navies of Europe to the plantations of the Caribbean.\n\n#italic Available in: $nd_ire_bleach_green$#!"
 nd_ire_penal_resistance: "Résistance pénale"
 nd_ire_penal_resistance_desc: "Malgré des lois restrictives, les institutions irlandaises perdurent grâce aux réseaux clandestins du clergé, des universitaires et des dirigeants communautaires."
 nd_ire_whiskey_tradition: "Distillation du whisky"
 nd_ire_whiskey_tradition_desc: "Le whisky irlandais, distillé à partir d'orge et vieilli en chêne, devient l'un des produits d'exportation les plus célèbres d'Irlande et un symbole d'identité nationale."
 nd_ire_parliamentary_tradition: "Tradition parlementaire"
 nd_ire_parliamentary_tradition_desc: "Le Parlement irlandais, inspiré par Grattan et les Volontaires, revendique l'indépendance législative et le droit à l'autonomie gouvernementale."
 nd_ire_diaspora_networks: "Réseaux de la diaspora"
 nd_ire_diaspora_networks_desc: "La diaspora irlandaise s'étend sur tout le monde atlantique, créant des réseaux de commerce, d'influence et de solidarité qui relient l'Irlande à tous les grands ports."
 nd_ire_revolutionary_spirit: "Esprit révolutionnaire"
 nd_ire_revolutionary_spirit_desc: "La tradition de Wolfe Tone et des United Irishmen inspire une génération prête à se battre pour la liberté, l’égalité et la souveraineté nationale."
 nd_ire_tower_house: "Maison-tour"
 nd_ire_tower_house_desc: "Une tour en pierre fortifiée, généralement haute de quatre étages ou plus, servant de résidence et de point fort au chef de clan. L'Irlande en a construit plus que partout ailleurs dans les îles britanniques."
 nd_ire_tower_house_maintenance: "Entretien de la maison-tour"
 nd_ire_tower_house_maintenance_desc: "Entretien des murs en pierre, des ouvrages défensifs et de la garnison d'une maison-tour."
 nd_ire_bardic_school: "École bardique"
 nd_ire_bardic_school_desc: "Une école pour les fils, les poètes-érudits héréditaires de l'Irlande gaélique, où les étudiants passent des années à maîtriser les subtilités du vers, de la généalogie et du droit."
 nd_ire_bardic_upkeep: "Patronage bardique"
 nd_ire_bardic_upkeep_desc: "Soutenir le fil des résidents avec du matériel d'écriture, des bougies et de l'encens qui accompagne leurs récitations."
 nd_ire_manuscript_production: "Enluminure de manuscrit"
 nd_ire_manuscript_production_desc: "Le métier minutieux de production de manuscrits enluminés dans la tradition du Livre de Kells."
 nd_ire_bleach_green: "Lin Vert Javel"
 nd_ire_bleach_green_desc: "Une installation en plein air où le lin tissé est étalé sur l'herbe et blanchi par le soleil et l'eau, produisant le célèbre lin irlandais blanc."
 nd_ire_bleach_green_maintenance: "Entretien du vert blanchissant"
 nd_ire_bleach_green_maintenance_desc: "Entretenir les séchoirs, les bacs à laver et les installations de stockage du vert de javel."
 nd_ire_linen_processing: "Tissage de lin"
 nd_ire_linen_processing_desc: "Transformation des fibres de lin en tissu de lin fin à l'aide de techniques de tissage traditionnelles irlandaises."
 nd_ire_distillery: "Distillerie de whisky"
 nd_ire_distillery_desc: "Une distillerie en pot-still produisant de l'uisce beatha, l'eau de la vie. Les alambics en cuivre transforment l'orge maltée en un whisky irlandais onctueux."
 nd_ire_distillery_maintenance: "Entretien de la distillerie"
 nd_ire_distillery_maintenance_desc: "Entretenir les alambics en cuivre, les fûts de chêne et les fours à malt qui produisent du whisky irlandais raffiné."
 nd_ire_whiskey_production: "Distillation du whisky"
 nd_ire_whiskey_production_desc: "Distiller les céréales et l'eau en un whisky irlandais onctueux grâce à la méthode traditionnelle de l'alambic."
 nd_ire_wool_cottage: "Chalet en laine"
 nd_ire_wool_cottage_desc: "Un chalet rural où des familles irlandaises filent, peignent et transforment la laine en tissu. L'industrie artisanale fait vivre de nombreux ménages agricoles."
 nd_ire_wool_cottage_maintenance: "Entretien du chalet en laine"
 nd_ire_wool_cottage_maintenance_desc: "Entretenir les rouets, les métiers à tisser et le stockage pour l'industrie de la laine artisanale."
 nd_ire_wool_processing: "Traitement de la laine"
 nd_ire_wool_processing_desc: "Peignage, filage et tissage de la laine irlandaise pour en faire des tissus destinés à l'usage domestique et à l'exportation."
 a_nd_ire_redshanks: "Chevaliers Rouges"
 a_nd_ire_redshanks_desc: "Infanterie mercenaire écossaise-irlandaise connue pour ses leggings distinctifs en cuir de cerf non tanné. Combattants rapides et agressifs expérimentés sur les terrains accidentés des Highlands et des tourbières irlandaises."
 levy_nd_ire_redshanks: "Chevaliers Rouges"
 levy_nd_ire_redshanks_desc: "Une levée de mercenaires écossais-irlandais Redshank, une infanterie légère féroce à l'aise en terrain accidenté."
 a_nd_ire_irish_pike: "Brochet irlandais"
 a_nd_ire_irish_pike_desc: "Infanterie en formation disciplinée entraînée à la manière de l'armée réformée de Hugh O'Neill. Combinant la férocité irlandaise traditionnelle avec des tactiques continentales de brochet et de tir."
 levy_nd_ire_irish_pike: "Brochet irlandais"
 levy_nd_ire_irish_pike_desc: "Une équipe de piquiers irlandais entraînés aux tactiques continentales réformées d'O'Neill, disciplinés et inébranlables en formation."
 a_nd_ire_wild_geese: "Oies sauvages"
 a_nd_ire_wild_geese_desc: "Soldats irlandais qui ont servi dans les armées d’Europe continentale et sont revenus avec la discipline et la sophistication tactique de la guerre professionnelle. Leur expérience du service français, espagnol et autrichien en fait de formidables vétérans."
 n_nd_ire_privateer: "Corsaire irlandais"
 n_nd_ire_privateer_desc: "Un navire de raid rapide et agile construit pour la guerre commerciale dans l'Atlantique. Les corsaires irlandais exploitent la position de l'île à cheval sur les principales voies de navigation pour s'attaquer au commerce ennemi."
 nd_ire_formed_tt: "Ireland has been #bold formed#!"
 nd_ire_path_a_tt: "Chose the #bold Gaelic Empire#! destiny"
 nd_ire_path_b_tt: "Choisissez le destin#bold Atlantic Dominion#!"
 nd_ire_destiny: "Le destin irlandais"
 nd_ire_destiny_desc: "L'Irlande est unifiée sous un seul Haut Roi. Le destin d’Erin (qu’il s’agisse de reconstruire le monde gaélique ou de forger un empire atlantique) l’attend."
 nd_ire_dest_ri_na_ngael: "Ri na nGaël"
 nd_ire_dest_ri_na_ngael_desc: "Prenez l'île de Man et les Hébrides intérieures pour unir tous les peuples gaéliques sous le Haut Roi. Le monde gaélique s'étend au-delà des côtes irlandaises."
 nd_ire_dest_gaelic_reconquest: "Reconquête gaélique"
 nd_ire_dest_gaelic_reconquest_desc: "The Gaelic heartlands of Scotland are reclaimed. Argyll and Edinburgh are taken, with Inverness, the gate of the Highlands, and Scone, where the kings of Scots were made on the stone that legend says came out of Ireland. A Gaelic kingdom spans both islands."
 nd_ire_dest_imperium: "Imperium Scottorum"
 nd_ire_dest_imperium_desc: "Conquer London, York and Caernarfon and unite these islands under Gaelic rule. Hold Armagh, where Brian Boru was written into the Book of Armagh as Emperor of the Irish, and build the see of Patrick up to twice what it was. Become the supreme power of the British Isles with an empire worthy of Brian Boru's legacy."
 nd_ire_dest_armagh_developed_tt: "#bold Armagh#! is owned directly and has at least #bold 20#! development"
 nd_ire_dest_galway_merchants: "Princes marchands de Galway"
 nd_ire_dest_galway_merchants_desc: "Faire de l’Irlande une puissance commerciale atlantique. Constituez des réserves d’or, développez le commerce de la laine et faites de Galway l’égal de n’importe quel port européen."
 nd_ire_dest_western_passage: "Le passage de l'Ouest"
 nd_ire_dest_western_passage_desc: "Traversez l’Atlantique jusqu’aux Açores et au-delà. Sécurisez les institutions bancaires et construisez les navires nécessaires au commerce océanique."
 nd_ire_dest_emerald_dominion: "Le domaine d'émeraude"
 nd_ire_dest_emerald_dominion_desc: "Build a transatlantic commercial empire. Hold Bermuda, accumulate vast wealth, and build Galway, the town of the fourteen merchant families, up to twice what it was."
 nd_ire_dest_galway_developed_tt: "#bold Galway#! is owned directly and has at least #bold 35#! development"
 nd_ire.5.t: "Le destin irlandais"
 nd_ire.5.d: "The High Kingship is restored and Ireland speaks with one voice for the first time in centuries. The clans that once fought each other now look outward, united under a sovereign who commands the loyalty of all Erin.\n\nThe question is not whether Ireland shall be great, but what form that greatness will take. The Gaelic world extends beyond these shores: to the Hebrides, to Man, to the highlands of Scotland where our kinsmen still speak our tongue. Or perhaps our destiny lies not in the lands of our ancestors but upon the Atlantic itself, where Irish ships can carry Irish goods to every port in the known world."
 nd_ire.5.a: "Erin va se vanter."
 nd_ire.6.t: "Roi des Gaëls"
 nd_ire.6.d: "The Isle of Man and the Inner Hebrides have fallen under the High King's authority. For the first time since the Norse invasions, the Gaelic-speaking world of the Irish Sea is united under a single ruler. The fishermen of Man, the warriors of Islay, and the clans of Ireland all acknowledge one sovereign.\n\nThis is the first step toward a greater vision: the reunification of all Gaelic peoples, from the bogs of Kerry to the highlands of Scotland, under one crown."
 nd_ire.6.a: "La mer d'Irlande est un lac gaélique."
 nd_ire.7.t: "La reconquête gaélique"
 nd_ire.7.d: "Edinburgh has fallen. The Gaelic High King now rules from Dublin to the Lothians, commanding a realm that encompasses the ancient Gaelic heartlands of both Ireland and Scotland. The clans of Argyll, the islanders of the Hebrides, and the Highland chieftains have rallied to a banner that promises the restoration of Gaelic civilization across both islands.\n\nBut this reconquest can take different forms. A military alliance with the Highland clans would create an unbreakable martial tradition, channeling the fierce independence of the Gaelic warrior into a disciplined fighting force. Alternatively, the union of Irish and Scottish learning could spark a Gaelic cultural renaissance, reviving the scholarly traditions that once made the Gaelic world the light of Western Christendom."
 nd_ire.7.a: "Forgez une alliance avec les Highlands."
 nd_ire.7.b: "Allumez une renaissance gaélique."
 nd_ire.8.t: "L'Empire des Gaëls"
 nd_ire.8.d: "London itself is in Irish hands. The High King of Ireland now commands the greatest empire these islands have ever known: not built by Norman lords or Saxon kings, but by the Gaelic peoples who were here before them all. From the bogs of Connacht to the banks of the Thames, the writ of the Ard Ri runs unchallenged.\n\nThis is a moment of supreme triumph, but also of choice. The sword that won this empire can keep it: channeling the spirit of Brian Boru into a warrior dynasty that holds its conquests through martial supremacy. Or the High King can look to Ireland's older tradition, the monastic learning that once earned it the title Island of Saints and Scholars, building an empire of the mind that outlasts any empire of the sword."
 nd_ire.8.a: "Laissez l'épée de Brian Boru nous défendre."
 nd_ire.8.b: "Nous serons à nouveau des saints et des érudits."
 nd_ire.9.t: "Les princes marchands de Galway"
 nd_ire.9.d: "The Fourteen Tribes of Galway (the great merchant families who have dominated the city's trade for generations) now operate under the patronage of the High King. Galway's harbor, facing the open Atlantic, has become the commercial heart of Ireland. Wool, hides, and fish flow outward; wine, spices, and luxury goods flow in from Iberia, France, and the Mediterranean.\n\nWith royal backing and stable governance, the merchant princes are building something unprecedented: an Irish commercial network that can compete with the great trading cities of Europe."
 nd_ire.9.a: "Galway sera notre joyau."
 nd_ire.10.t: "Le passage de l'Ouest"
 nd_ire.10.d: "Irish ships have reached the Azores, planting the green banner on Atlantic islands that serve as stepping stones to the wider world. Banking institutions have been embraced, giving Ireland the financial sophistication to fund oceanic ventures. The Atlantic, once a barrier, is becoming an Irish highway.\n\nThis is a pivotal moment. The navigators who charted these routes can be honored as a new tradition: training the next generation of Irish seafarers to explore further and fight harder on the open ocean. Alternatively, the commercial possibilities of the Azores route can be developed through factor houses: permanent Irish trading posts that gather intelligence, cultivate contacts, and channel goods back to Ireland."
 nd_ire.10.a: "Honorez la tradition des navigateurs."
 nd_ire.10.b: "Établir des maisons de facteurs à l'étranger."
 nd_ire.11.t: "Le domaine d'émeraude"
 nd_ire.11.d: "From Galway to Bermuda, from the Azores to the fishing banks of the Atlantic, Ireland has built a commercial empire that spans an ocean. Irish merchants trade in every major port, Irish ships carry goods across thousands of miles of open water, and Irish gold fills the coffers of a kingdom that was once dismissed as a backwater.\n\nThe Emerald Dominion can take one of two final forms. A provision fleet (the organized export of Irish beef, butter, and agricultural surplus) can supply the navies and colonies of the Atlantic world, making Ireland the indispensable victualler of maritime civilization. Or Ireland can declare its ports open to all comers, creating free ports that attract merchants from every nation, making the island a neutral hub of global trade."
 nd_ire.11.a: "Nous nourrirons le monde atlantique."
 nd_ire.11.b: "Déclarons nos ports ouverts à toutes les nations."
 STATIC_MODIFIER_NAME_nd_ire_dest_highland_alliance: "Alliance des Hautes Terres"
 STATIC_MODIFIER_DESC_nd_ire_dest_highland_alliance: "Les clans gaéliques d'Irlande et d'Écosse sont liés par une alliance militaire, leur tradition combinée de raids favorisant la guerre de siège et le pillage, bien que le coût du maintien de telles alliances pèse sur le trésor."
 STATIC_MODIFIER_NAME_nd_ire_dest_gaelic_renaissance: "Renaissance gaélique"
 STATIC_MODIFIER_DESC_nd_ire_dest_gaelic_renaissance: "L'union des savoirs irlandais et écossais déclenche une renaissance de l'érudition gaélique, diffusant les institutions et la prospérité tout en accélérant la construction d'une nouvelle civilisation."
 STATIC_MODIFIER_NAME_nd_ire_dest_sword_of_brian: "Épée de Brian Boru"
 STATIC_MODIFIER_DESC_nd_ire_dest_sword_of_brian: "La tradition martiale de Brian Boru perdure. Les armées irlandaises se déplacent rapidement et attaquent les fortifications avec une férocité terrifiante, même si une telle guerre agressive laisse peu de temps aux subtilités du prestige de la cour."
 STATIC_MODIFIER_NAME_nd_ire_dest_saints_and_scholars: "Île des Saints et des Érudits"
 STATIC_MODIFIER_DESC_nd_ire_dest_saints_and_scholars: "Les traditions monastiques et savantes de l'Irlande renaissent à l'échelle impériale, favorisant la croissance démographique et réduisant le coût de la construction, bien que le caractère pacifique de la cour implique un entretien militaire plus important."
 STATIC_MODIFIER_NAME_nd_ire_dest_navigator_tradition: "Tradition du navigateur"
 STATIC_MODIFIER_DESC_nd_ire_dest_navigator_tradition: "Les marins irlandais sont formés aux traditions de la navigation atlantique, explorant davantage et combattant plus durement en haute mer, même si l'orientation maritime éloigne les hommes du service terrestre."
 STATIC_MODIFIER_NAME_nd_ire_dest_factor_houses: "Maisons de facteurs"
 STATIC_MODIFIER_DESC_nd_ire_dest_factor_houses: "Permanent Irish trading posts abroad expand diplomatic reach and gather intelligence, though families grown rich abroad heed the court less."
 STATIC_MODIFIER_NAME_nd_ire_dest_provision_fleet: "Provisionnement de la flotte"
 STATIC_MODIFIER_DESC_nd_ire_dest_provision_fleet: "La générosité agricole de l'Irlande nourrit les marines et les colonies du monde atlantique. Les matières premières circulent librement et les coûts navals sont réduits, même si la dépendance du royaume à l'égard d'un commerce pacifique rend la guerre plus coûteuse."
 STATIC_MODIFIER_NAME_nd_ire_dest_free_port: "Port franc d'Irlande"
 STATIC_MODIFIER_DESC_nd_ire_dest_free_port: "Les ports irlandais sont déclarés ouverts à toutes les nations, améliorant ainsi les relations étrangères et rapprochant les sujets de la couronne, bien que le caractère ouvert du royaume signifie que les armées subissent une plus grande attrition à l'étranger."
 nd_ire_high_cross: "Monastère de la Haute Croix"
 nd_ire_high_cross_desc: "Un grand complexe monastique centré sur une haute croix en pierre ornée, servant de phare de l'apprentissage, de la foi et de l'autorité culturelle gaéliques dans la tradition de Clonmacnoise et de Glendalough."
 nd_ire_high_cross_maintenance: "Entretien monastique"
 nd_ire_high_cross_maintenance_desc: "Entretenir les scriptoria, les reliquaires et les sculptures en pierre de la communauté monastique."
 nd_ire_atlantic_exchange: "Bourse de l'Atlantique"
 nd_ire_atlantic_exchange_desc: "Une bourse commerciale spécialement conçue à cet effet où les marchands irlandais, ibériques et atlantiques mènent leurs activités de commerce transatlantique, rivalisant avec n'importe quelle bourse en Europe."
 nd_ire_exchange_maintenance: "Opérations d'échange"
 nd_ire_exchange_maintenance_desc: "Les commis, les grands livres et les coureurs assurent le fonctionnement de l'échange tandis que les marchandises circulent entre les marchés atlantiques et européens."

 # ===== BUREAUCRACIES =====
 brehon_law_bureaucracy: "Loi Bréhon"
 brehon_law_bureaucracy_desc: "Le système juridique coutumier de l'Irlande gaélique, du nom du breithem (juge), administré par des familles savantes héréditaires telles que les MacEgan et les O'Davorens. Le code était civil plutôt que pénal, réglant les différends par le prix d'honneur (eneclann) et l'indemnisation (eric) plutôt que par la punition de l'État. Sa tolérance de l'arbitrage indigène a été interdite par étapes, depuis le Statut de Kilkenny (1366) jusqu'à la décision du Banc du Roi dans l'Affaire Tanistry (1607)."
 tanistry_bureaucracy: "Tanistique"
 tanistry_bureaucracy_desc: "Le système gaélique de succession élective dans lequel le tanaïste, nommé du vivant du roi, était choisi parmi les derbfine : le groupe de parenté patrilinéaire de quatre générations partageant un arrière-grand-père commun. En privilégiant les capacités avérées sur la primogéniture, la tanistie a produit des chefs de guerre efficaces mais aussi des crises de succession chroniques. Le Banc du Roi anglais l'a invalidé dans l'Affaire Tanistry de 1607."
 bardic_schools_bureaucracy: "Écoles bardiques"
 bardic_schools_bureaucracy_desc: "Écoles héréditaires du filidh, la classe savante de l'Irlande gaélique, soutenues par le patronage aristocratique entre 1250 et 1650 environ. Les élèves étudiaient pendant douze ans pour maîtriser les mètres syllabiques stricts de Dan Direach, les généalogies des grandes maisons et les traditions de la loi Brehon. Les écoles se sont effondrées avec leurs clients lorsque les plantations et les guerres du XVIIe siècle ont détruit l'ordre gaélique."
 coyne_and_livery_bureaucracy: "Coyne et livrée"
 coyne_and_livery_bureaucracy_desc: "Coinmheadh ​​est buannacht - l'exaction gaélique par laquelle un seigneur cantonnait ses compagnies de kern, de gallowglass et de bonnacht sur la population rurale, prenant de la nourriture, un logement et du fourrage sans salaire. Le système maintenait une force militaire permanente sans frais pour le trésor du seigneur, mais les soldats eux-mêmes imposaient le prélèvement aux paysans, souvent de manière ruineuse. Interdit à plusieurs reprises par les parlements anglo-irlandais et ignoré à plusieurs reprises par les seigneurs."
 pale_administration_bureaucracy: "Administration pâle"
 pale_administration_bureaucracy_desc: "La chancellerie, l'échiquier et le château de Dublin du Lord Representative gouvernent les quatre comtés de l'English Pale : Louth, Meath, Dublin et Kildare. À partir de 1471, le poste fut occupé presque continuellement par les comtes de Kildare, qui dirigèrent l'Irlande à travers un réseau d'alliances de style gaélique au nom de la Couronne. Le Parlement irlandais n'était convoqué que lorsque le Lord Representative avait besoin de nouvelles lois ou de nouveaux impôts."
 surrender_and_regrant_bureaucracy: "Abandon et renonciation"
 surrender_and_regrant_bureaucracy_desc: "La politique Tudor, conçue sous Thomas Cromwell et poursuivie à partir des années 1540, par laquelle les seigneurs gaéliques et gaélicisés cédaient leurs terres et leurs titres coutumiers à la Couronne et les récupéraient par charte royale sous primogéniture anglaise. La composition du Connacht de 1585 étendit le système vers l'ouest, remplaçant les multiples tributs gaéliques par un impôt foncier unique et convertissant les trcha cts en baronnies. Il a démantelé la tanistique et la titularisation de Brehon d'un trait de plume."

 # ===== BUREAUCRACY UNLOCK =====
 AUTO_MODIFIER_NAME_nd_ire_bureaucracy_authority: "Appareil administratif permanent"
 AUTO_MODIFIER_DESC_nd_ire_bureaucracy_authority: "Ireland's dual administrative tradition (the Gaelic order of brehons, filidh, and clan assemblies and the Anglo-Irish chancery of Dublin Castle) provides a foundation for permanent offices. Three institutions can be kept at a time."
