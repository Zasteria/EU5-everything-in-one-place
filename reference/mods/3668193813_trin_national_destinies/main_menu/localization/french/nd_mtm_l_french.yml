l_french:
 # === Advances ===
 # Age 1
 nd_mtm_sawah_agriculture: "Culture du riz humide Sawah"
 nd_mtm_sawah_agriculture_desc: "Les sols volcaniques fertiles du centre de Java soutiennent un système intensif de culture du riz humide. Les rizières en terrasses canalisent l'eau des montagnes via des réseaux d'irrigation élaborés, produisant des récoltes abondantes qui nourrissent une population croissante."
 nd_mtm_majapahit_heritage: "Patrimoine de la cour de Majapahit"
 nd_mtm_majapahit_heritage_desc: "Mataram hérite de l'héritage culturel du grand empire Majapahit : ses protocoles courtois, ses traditions littéraires et ses concepts de royauté sacrée qui sous-tendent l'autorité politique javanaise."
 nd_mtm_empu_smithing: "Empu Keris Smithing"
 nd_mtm_empu_smithing_desc: "Les empu sont des maîtres forgerons qui forgent le keris : le poignard asymétrique sacré de Java. Combinant du fer, du nickel et du métal météorique à travers des centaines de plis, ils créent des lames censées posséder un pouvoir spirituel."
 nd_mtm_javanese_islam: "Synthèse islamique javanaise"
 nd_mtm_javanese_islam_desc: "L’Islam arrive à Java non pas pour remplacer les traditions existantes, mais pour les superposer. Les Wali Songo, neuf saints islamiques, ont répandu la foi en l'incorporant à la danse javanaise, au théâtre de marionnettes et aux rituels courtois."
 nd_mtm_keris_militia: "Milice armée de Keris"
 nd_mtm_keris_militia_desc: "Tout homme javanais de bonne réputation porte un keris. En temps de guerre, les communautés villageoises lèvent des milices armées de ces poignards sacrés et de ces lances en bambou, combattant avec la conviction spirituelle que leurs lames les protègent."
 nd_mtm_inland_trade: "Routes commerciales intérieures"
 nd_mtm_inland_trade_desc: "Les marchés intérieurs du centre de Java relient les plaines rizicoles aux producteurs d'épices, de métaux et de produits forestiers des hautes terres. Le commerce terrestre soutient l'économie agraire que les sultans de Mataram privilégient au commerce maritime."
 # Age 2
 nd_mtm_kraton_tradition: "Tradition du palais de Kraton"
 nd_mtm_kraton_tradition_desc: "Le kraton est plus qu'un palais : c'est le centre cosmologique du royaume javanais, où le souverain sert d'intermédiaire entre le ciel et la terre. Ses murs concentriques reflètent l’ordre cosmique qui légitime l’autorité royale."
 nd_mtm_batik_codification: "Codification des textiles batik"
 nd_mtm_batik_codification_desc: "Sous le patronage de la cour, la technique de teinture à la cire du batik est passée du statut d'artisanat à celui de grand art. Les maîtres artisans développent des motifs géométriques et naturalistes complexes, chacun porteur d'une signification symbolique dans la cosmologie javanaise."
 nd_mtm_court_arts: "Gamelan et Wayang Kulit"
 nd_mtm_court_arts_desc: "Les orchestres de percussions en bronze du gamelan et les marionnettes d'ombres en cuir du wayang kulit atteignent leurs formes classiques sous le patronage de Mataram. Ces arts transmettent les épopées du Ramayana et du Mahabharata, intégrant la mythologie hindoue au sein d’une cour islamique."
 nd_mtm_tumenggung_system: "Administration de Tumenggung"
 nd_mtm_tumenggung_system_desc: "Le sultan gouverne par l'intermédiaire de tumenggung nommés : des seigneurs régionaux qui administrent les territoires, collectent les impôts et lèvent des troupes au nom du trône. Leur fidélité est assurée par la distribution de terres apanages."
 nd_mtm_priyayi_class: "Classe bureaucratique Priyayi"
 nd_mtm_priyayi_class_desc: "Une nouvelle classe de fonctionnaires instruits, les priyayi, émerge pour servir le tribunal de Mataram. Élevés au statut aristocratique par nomination royale plutôt que par naissance, ils constituent l'épine dorsale administrative du sultanat en expansion."
 nd_mtm_port_suppression: "Consolidation des revenus portuaires"
 nd_mtm_port_suppression_desc: "Méfiants face à la richesse indépendante que le commerce maritime apporte aux seigneurs côtiers, les dirigeants de Mataram réorientent l'activité économique vers l'intérieur des terres. Les revenus portuaires transitent par le tribunal, renforçant ainsi l’autorité centrale aux dépens de la puissance maritime."
 nd_mtm_pesantren_network: "Réseau Pesantren"
 nd_mtm_pesantren_network_desc: "Les internats islamiques ruraux, pesantren, se sont répandus à travers Java, éduquant les jeunes à la récitation coranique, à la calligraphie arabe et aux lettres javanaises. Ils créent une classe alphabétisée fidèle à la fois à la foi et au sultan."
 # Age 3
 nd_mtm_agung_conquests: "Les conquêtes du sultan Agung"
 nd_mtm_agung_conquests_desc: "Les campagnes militaires incessantes du sultan Agung unissent la quasi-totalité de Java sous la bannière de Mataram. Le siège de Surabaya qui a duré cinq ans et l'assujettissement des royaumes côtiers de l'est de Java marquent l'apogée de la puissance militaire javanaise."
 nd_mtm_siege_tradition: "Tradition de siège javanaise"
 nd_mtm_siege_tradition_desc: "La conquête de Surabaya a démontré la maîtrise de Mataram de la guerre de siège prolongée. En construisant des barrages sur la rivière Brantas et en empoisonnant les réserves d'eau, les forces du sultan Agung ont affamé les villes fortifiées et les ont soumises sans assaut direct."
 nd_mtm_calendar_reform: "Réforme du calendrier javanais"
 nd_mtm_calendar_reform_desc: "En 1633, le sultan Agung institue un calendrier révolutionnaire qui fusionne le système solaire hindou Saka avec le calcul lunaire islamique. Cette synthèse reflète le projet plus large de Mataram d'harmoniser le passé hindou de Java avec son présent islamique."
 nd_mtm_tax_reform: "Réforme fiscale administrative"
 nd_mtm_tax_reform_desc: "Le sultan Agung restructure le code fiscal dans les territoires conquis, remplaçant les tributs ad hoc par un système rationalisé d'évaluation foncière. Les tribunaux et les procédures judiciaires sont davantage alignés sur les préceptes coraniques."
 nd_mtm_batavia_campaign: "Campagne Batavia"
 nd_mtm_batavia_campaign_desc: "En 1628-1629, le sultan Agung envoie quelque 14 000 soldats assiéger la forteresse hollandaise du VOC à Batavia. Bien que les sièges échouent en raison de difficultés de ravitaillement et de maladies, ils démontrent la volonté de Mataram de défier les intrus européens."
 nd_mtm_irrigation_expansion: "Extension de l'irrigation"
 nd_mtm_irrigation_expansion_desc: "The growing population and military ambitions of Mataram demand ever-greater rice harvests. New sawah terraces are carved from forest and hillside, extending the irrigation network that feeds the sultanate's armies and courts."
 nd_mtm_judicial_reform: "Réforme judiciaire coranique"
 nd_mtm_judicial_reform_desc: "Le sultan Agung aligne les tribunaux du sultanat sur la jurisprudence islamique, en introduisant des codes juridiques influencés par la charia qui complètent la loi adat traditionnelle javanaise. Ce double système renforce à la fois la légitimité religieuse et le contrôle administratif."
 # Age 4
 nd_mtm_trunajaya_aftermath: "L'héritage de la rébellion de Trunajaya"
 nd_mtm_trunajaya_aftermath_desc: "La rébellion dévastatrice de Trunajaya dans les années 1670 détruit presque Mataram. Les rebelles madurais s'emparent de la capitale Plered, obligeant le sultan à demander l'aide de VOC : un marché fatidique qui préserve le trône mais concède la souveraineté."
 nd_mtm_kraton_guard: "Garde du palais de Kraton"
 nd_mtm_kraton_guard_desc: "Après le traumatisme de la rébellion de Trunajaya, les sultans investissent dans un corps de garde permanent du palais : des soldats d'élite issus des classes priyayi et soldat, armés et entraînés pour défendre le kraton contre les futurs usurpateurs."
 nd_mtm_batik_larangan: "Batik Larangan"
 nd_mtm_batik_larangan_desc: "The sultans codify batik larangan: forbidden patterns reserved exclusively for royal use. The parang rusak motif becomes the supreme symbol of kingship, with its wearing by commoners punishable as an affront to cosmic order.\n\n#italic Available in: $nd_mtm_batik_workshop$#!"
 nd_mtm_pesantren_expansion: "Expansion savante Pesantren"
 nd_mtm_pesantren_expansion_desc: "The pesantren network deepens its scholarly mission, producing a class of kyai: Islamic teachers who command both religious authority and community loyalty throughout the Javanese countryside. Their books are copied by hand on dluwang, paper beaten from mulberry bark in the villages around each school."
 nd_mtm_voc_diplomacy: "Engagement diplomatique COV"
 nd_mtm_voc_diplomacy_desc: "Les sultans de Mataram entretiennent des relations de plus en plus complexes avec la Compagnie néerlandaise des Indes orientales : ils échangent des concessions contre un soutien militaire, opposent les factions VOC les unes aux autres et maintiennent une façade de souveraineté sur des domaines en déclin."
 nd_mtm_granary_system: "Système de grenier Lumbung"
 nd_mtm_granary_system_desc: "Un réseau de greniers royaux, les lumbung, stocke le riz issu des récoltes de la saison humide. Ces réserves soutiennent les armées en campagne, protègent contre la famine et donnent au sultan un levier économique sur ses sujets et ses rivaux."
 nd_mtm_road_network: "Réseau routier du centre de Java"
 nd_mtm_road_network_desc: "Les principales routes reliant le kraton aux capitales provinciales sont maintenues et élargies, permettant un mouvement plus rapide des troupes et une collecte des impôts à travers les territoires intérieurs de Mataram."
 # Age 5
 nd_mtm_succession_reforms: "Réformes successorales"
 nd_mtm_succession_reforms_desc: "Trois guerres de succession dévastatrices enseignent à la cour de Mataram de dures leçons sur le transfert ordonné du pouvoir. De nouveaux protocoles tentent de régulariser la succession, même si la réalité de la politique judiciaire javanaise reste dangereuse."
 nd_mtm_wayang_wong: "Wayang Wong Danse-Drame"
 nd_mtm_wayang_wong_desc: "La culture de cour atteint son âge d'or avec le wayang wong : un drame dansé en direct où des interprètes humains mettent en scène les mêmes épopées que les ombres chinoises. La salle d’audience Pendopo devient le théâtre d’une forme d’art unique au centre de Java."
 nd_mtm_modern_prajurit: "Prajurit modernisé"
 nd_mtm_modern_prajurit_desc: "Les régiments d'infanterie traditionnels de Mataram intègrent des armes à feu européennes et des techniques d'exercice apprises au cours de décennies de contact avec les forces VOC. Ces prajurit modernisés combinent l'esprit martial javanais avec une nouvelle discipline tactique."
 nd_mtm_cultural_rivalry: "Rivalité Surakarta-Yogyakarta"
 nd_mtm_cultural_rivalry_desc: "La division de Mataram en 1755 en tribunaux rivaux à Surakarta et Yogyakarta déclenche une extraordinaire compétition culturelle. Chaque cour défend ses propres styles de gamelan, de danse, de batik et de littérature, doublant ainsi la production créative de la civilisation javanaise."
 nd_mtm_batik_manufacturing: "Fabrication avancée de batik"
 nd_mtm_batik_manufacturing_desc: "New dyeing techniques and the refinement of the canting wax-pen allow the creation of increasingly intricate batik patterns. The cloth becomes a major export commodity, prized from the Malay world to Europe.\n\n#italic Available in: $nd_mtm_batik_workshop$#!"
 nd_mtm_teak_exploitation: "Exploitation de la forêt de teck"
 nd_mtm_teak_exploitation_desc: "Java's vast teak forests provide timber for construction, shipbuilding, and export. Systematic exploitation under royal monopoly generates revenue while supplying the materials needed for palaces, forts, and trading vessels. The felling is laid on the blandong, villages beside the forest that owe teak and are freed of other taxes."
 # Age 6
 nd_mtm_serat_tradition: "Renaissance littéraire de Serat"
 nd_mtm_serat_tradition_desc: "Les poètes de la cour javanaise produisent une littérature épanouie, le serat, mêlant chronique historique, philosophie morale et poésie mystique. Ces œuvres préservent l’identité et la sagesse javanaises à une époque d’empiétement colonial européen."
 nd_mtm_anti_colonial: "Résistance anticoloniale"
 nd_mtm_anti_colonial_desc: "Depuis la guerre de Java de Diponegoro de 1825 à 1830, l'héritage de Mataram inspire la résistance armée contre la domination coloniale néerlandaise. Ces mouvements s'appuient sur les traditions martiales javanaises et le zèle islamique pour défier la domination européenne."
 nd_mtm_modern_administration: "État administratif moderne"
 nd_mtm_modern_administration_desc: "Les administrateurs javanais adaptent les méthodes bureaucratiques modernes tout en préservant la tradition priyayi. Le résultat est un système administratif qui allie hiérarchie indigène et gouvernance rationnelle adaptée à l’ère moderne."
 nd_mtm_plantation_economy: "Économie des plantations"
 nd_mtm_plantation_economy_desc: "Les sols volcaniques fertiles de Java s'avèrent idéaux pour la culture industrielle du sucre, du tabac et du café. L’agriculture de plantation transforme l’île en l’une des économies coloniales les plus productives au monde."
 nd_mtm_national_awakening: "Réveil national javanais"
 nd_mtm_national_awakening_desc: "Une nouvelle génération de Javanais instruits redécouvre la fierté de leur héritage culturel. L'héritage des tribunaux de Mataram (leur batik, leur gamelan et leur littérature) devient le fondement d'une identité nationale naissante."
 nd_mtm_batik_export: "Économie d’exportation de batik"
 nd_mtm_batik_export_desc: "Industrial production methods allow batik to be produced at scale for global markets while maintaining the artistic quality that makes Javanese textiles prized worldwide.\n\n#italic Available in: $nd_mtm_batik_workshop$#!"
 # === Units ===
 a_nd_mtm_keris_prajurit: "Keris Prajurit"
 a_nd_mtm_keris_prajurit_desc: "Milice villageoise armée de poignards sacrés keris et de lances en bambou. Ce qui leur manque en matière de formation formelle, ils le compensent par la conviction spirituelle que leurs lames les rendent invulnérables."
 a_nd_mtm_agung_prajurit: "Prajurit d'Agung"
 a_nd_mtm_agung_prajurit_desc: "L'infanterie conquérante des campagnes du sultan Agung : des soldats disciplinés qui réduisirent Surabaya par le siège et portèrent la bannière de Mataram à travers Java."
 a_nd_mtm_sentana_cavalry: "Cavalerie Sentana"
 a_nd_mtm_sentana_cavalry_desc: "Parents royaux et nobles montés sur des poneys javanais, servant de force de frappe mobile au sultan. Leurs raids rapides perturbent les lignes de ravitaillement et les communications ennemies."
 a_nd_mtm_kraton_guard: "Garde Kraton"
 a_nd_mtm_kraton_guard_desc: "L'infanterie d'élite du palais a juré de défendre le Kraton. Armés de keris et de piques, ils constituent la dernière ligne entre le sultan et ceux qui souhaitent s'emparer du trône."
 a_nd_mtm_modern_prajurit: "Prajurit moderne"
 a_nd_mtm_modern_prajurit_desc: "Infanterie javanaise formée aux armes à feu et à la formation tactique européennes. Ils mélangent le courage martial traditionnel du prajurit avec les volées de mousquet et l'exercice discipliné de l'ère moderne."
 a_nd_mtm_pemberontak: "Pemberontak"
 a_nd_mtm_pemberontak_desc: "Des résistants anticoloniaux formés aux tactiques de guérilla. Utilisant à leur avantage la jungle dense et les rizières de Java, ils frappent les forces coloniales et se fondent dans la campagne."
 # === Buildings ===
 nd_mtm_sawah_terrace: "Terrasse Sawah"
 nd_mtm_sawah_terrace_desc: "Des rizières humides soigneusement conçues qui canalisent l'eau de source volcanique à travers des canaux bordés de pierres pour inonder les champs en terrasses. Le système sawah de Java fait vivre l'une des populations agricoles les plus denses au monde."
 nd_mtm_empu_forge: "Forge d'Empu"
 nd_mtm_empu_forge_desc: "L'atelier d'un maître forgeron empu, où le keris sacré est forgé grâce au travail rituel du métal. Chaque lame nécessite des centaines de coups de marteau et une préparation spirituelle, produisant des armes qui incarnent l'identité culturelle javanaise."
 nd_mtm_kraton_palace: "Palais Kraton"
 nd_mtm_kraton_palace_desc: "Le complexe du palais fortifié qui sert de centre cosmologique et politique du royaume javanais. Ses murs concentriques reflètent la structure de l'univers, avec le sultan au centre divin."
 nd_mtm_batik_workshop: "Atelier Batik"
 nd_mtm_batik_workshop_desc: "Un atelier spécialisé où les artisans appliquent de la cire fondue selon des motifs complexes avant de teindre le tissu en indigo naturel et en brun soga. Les textiles batik qui en résultent sont à la fois des vêtements de tous les jours et des insignes courtois."
 nd_mtm_pesantren: "Pesantren"
 nd_mtm_pesantren_desc: "Un internat islamique où les étudiants vivent sous la direction d'un professeur de kyai, étudiant le Coran ainsi que la littérature et les lettres javanaises. Le pesantren est le fondement de l’éducation rurale à Java."
 nd_mtm_benteng_fort: "Fort de Benteng"
 nd_mtm_benteng_fort_desc: "Une fortification intérieure javanaise de terre battue et de pierre, construite pour contrôler les traversées de rivières et les cols de montagne. L'expertise de Mataram en matière de siège se reflète dans ses défenses conçues pour résister aux tactiques mêmes employées par ses propres armées."
 nd_mtm_lumbung_granary: "Grenier de Lumbung"
 nd_mtm_lumbung_granary_desc: "Un entrepôt en bois surélevé distinctif avec un faîtage incurvé, conçu pour garder le riz au sec pendant la mousson humide. Les greniers royaux forment une réserve stratégique qui soutient les armées et protège contre la famine."
 nd_mtm_pendopo_hall: "Salle Pendopo"
 nd_mtm_pendopo_hall_desc: "Une salle d'audience ouverte sur les côtés avec un toit en joglo élancé soutenu par des piliers massifs en teck. Le pendopo est l'endroit où le sultan tient sa cour, où les orchestres de gamelan se produisent et où les danses wayang wong donnent vie aux épopées."
 nd_mtm_plantation_complex: "Complexe de plantations"
 nd_mtm_plantation_complex_desc: "Un domaine agricole à l'échelle industrielle combinant sucreries, séchoirs et installations de transformation. Le sol volcanique de Java et son climat tropical le rendent idéal pour les cultures commerciales."
 # === Production Methods ===
 nd_mtm_sawah_maintenance: "Irrigation de Sawah"
 nd_mtm_sawah_maintenance_desc: "L’entretien du système complexe de canaux, de déversoirs et de terrasses qui rendent possible la culture du riz humide nécessite un investissement constant en bois et en pierre."
 nd_mtm_keris_forging: "Forgeage Keris"
 nd_mtm_keris_forging_desc: "Forge des dagues sacrées keris à partir d'alliages de fer et de cuivre grâce au travail rituel des métaux, produisant ainsi des armes javanaises distinctives."
 nd_mtm_palace_upkeep: "Entretien du palais"
 nd_mtm_palace_upkeep_desc: "Le kraton demande un entretien constant : du bois pour ses pavillons en teck, de la pierre pour ses murs et du tissu fin pour son mobilier de cérémonie."
 nd_mtm_batik_dyeing: "Teinture Batik"
 nd_mtm_batik_dyeing_desc: "Transforme les tissus unis en textiles batik à motifs grâce au processus traditionnel de teinture résistante à la cire, produisant ainsi des tissus fins prisés dans toute l'Asie du Sud-Est."
 nd_mtm_pesantren_upkeep: "Opération Pesantren"
 nd_mtm_pesantren_upkeep_desc: "Les internats islamiques ont besoin de papier pour les manuscrits, de riz pour nourrir les étudiants résidents et du dévouement des professeurs de kyai."
 nd_mtm_benteng_upkeep: "Entretien du fort"
 nd_mtm_benteng_upkeep_desc: "L'entretien des murs de pierre et de la garnison du benteng nécessite un approvisionnement constant en pierre, en bois et en armes."
 nd_mtm_granary_maintenance: "Entretien du grenier"
 nd_mtm_granary_maintenance_desc: "Maintenir les entrepôts de lumbung en bon état et maintenir leurs réserves de riz fraîches nécessite un investissement continu dans la rotation du bois et des céréales."
 nd_mtm_pendopo_upkeep: "Entretien Pendopo"
 nd_mtm_pendopo_upkeep_desc: "La grande salle d'audience nécessite le remplacement de ses poutres en teck et de ses tentures en tissu de cérémonie pour rester un lieu approprié pour la culture de la cour."
 nd_mtm_sugar_processing: "Transformation du sucre"
 nd_mtm_sugar_processing_desc: "Broie la canne à sucre et fait bouillir le sirop dans des moulins à bois, produisant du sucre brut destiné à la consommation intérieure et à l'exportation."
 nd_mtm_dluwang_works: "Dluwang Works"
 nd_mtm_dluwang_works_desc: "A village yard near a pesantren where the inner bark of the paper mulberry is soaked, beaten into sheets and smoothed for the school's copyists."
 nd_mtm_dluwang_beating: "Dluwang Beating"
 nd_mtm_dluwang_beating_desc: "Strips of mulberry bark are soaked, beaten thin, dried on banana leaf and smoothed with a shell into writing sheets."
 nd_mtm_blandong_yard: "Blandong Teak Yard"
 nd_mtm_blandong_yard_desc: "A woodcutters' village beside the teak forest. Its people owe felled and squared teak and are freed of other taxes in return."
 nd_mtm_ship_timber_squaring: "Ship Timber Squaring"
 nd_mtm_ship_timber_squaring_desc: "Teak logs are squared into keels, ribs and planking and hauled out by buffalo for the shipyards of Rembang and Jepara."
 nd_mtm_royal_batik: "Production Royale de Batik"
 nd_mtm_royal_batik_desc: "Les artisans de la cour produisent du batik larangan à partir de soie et de teintures rares : des motifs restreints, dont le motif sacré parang rusak, donnant les plus beaux textiles de Java."
 nd_mtm_fine_batik: "Fabrication fine de batik"
 nd_mtm_fine_batik_desc: "Les techniques avancées du stylo à cire incliné produisent un batik d'une complexité extraordinaire à partir de tissus et de teintures, donnant des textiles fins destinés à l'exportation vers les tribunaux d'Asie du Sud-Est."
 nd_mtm_industrial_batik: "Production industrielle de batik"
 nd_mtm_industrial_batik_desc: "Les techniques d'impression au tampon sur cuivre et de teinture en masse produisent de beaux textiles batik à l'échelle industrielle, alliant esthétique traditionnelle et efficacité moderne."
 # === Levies ===
 levy_nd_mtm_kraton_guard: "Prélèvement de garde Kraton"
 levy_nd_mtm_kraton_guard_desc: "Des défenseurs d'élite du palais issus des classes de soldats et de nobles pour protéger le kraton du sultan."
 levy_nd_mtm_keris_prajurit: "Prélèvement Keris Prajurit"
 levy_nd_mtm_keris_prajurit_desc: "Milice villageoise armée de poignards sacrés keris, issus des populations paysannes et militaires."
 # === Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_mtm_agung_military_legacy: "L'héritage de l'épée d'Agung"
 STATIC_MODIFIER_DESC_nd_mtm_agung_military_legacy: "Le sultan Agung a uni Java grâce à la conquête militaire. Son héritage incite nos armées à persévérer : à saisir ce qu'exige l'épée du sultan."
 STATIC_MODIFIER_NAME_nd_mtm_agung_administrative_legacy: "L'héritage de la loi d'Agung"
 STATIC_MODIFIER_DESC_nd_mtm_agung_administrative_legacy: "La plus grande réussite du sultan Agung n'était pas la conquête mais le système administratif qui maintenait ses conquêtes ensemble. Ses réformes guident notre gouvernance."
 STATIC_MODIFIER_NAME_nd_mtm_batavia_resolve: "Résolution de Batavia"
 STATIC_MODIFIER_DESC_nd_mtm_batavia_resolve: "Le siège de Batavia a prouvé que Java ne se soumettrait pas docilement aux intrus étrangers. Même si les murs ont tenu bon, la volonté de se battre brûle plus que jamais."
 STATIC_MODIFIER_NAME_nd_mtm_batavia_lessons: "Leçons de Batavia"
 STATIC_MODIFIER_DESC_nd_mtm_batavia_lessons: "L’échec du siège a donné de dures leçons en matière de logistique et d’approvisionnement. Les futures campagnes seront mieux provisionnées et planifiées avec plus de soin."
 STATIC_MODIFIER_NAME_nd_mtm_internal_vigilance: "Vigilance interne"
 STATIC_MODIFIER_DESC_nd_mtm_internal_vigilance: "Le traumatisme de la rébellion de Trunajaya exige une vigilance éternelle. Le trône doit détecter et neutraliser les menaces avant qu’elles ne se transforment en révolte ouverte."
 STATIC_MODIFIER_NAME_nd_mtm_reconsolidation: "Reconsolidation de l'autorité"
 STATIC_MODIFIER_DESC_nd_mtm_reconsolidation: "Une fois la rébellion écrasée, le sultan entreprend de reconstruire les fondements de l'autorité royale : réaffirmant les serments de loyauté, rétablissant l'ordre et réaffirmant le droit divin du trône."
 # === Events ===
 nd_mtm.1.t: "Les conquêtes du sultan Agung"
 nd_mtm.1.d: "Sultan Agung of Mataram, the greatest of Java's Islamic rulers, has spent two decades bringing the island under his dominion. From the fertile rice lands of Central Java, his armies marched east to reduce proud Surabaya through a five-year siege, damming the Brantas River and starving the city into submission. West of the kraton, the coastal kingdoms of the Pasisir have bowed before his banner.\n\nNow Mataram stands as the undisputed master of Java. But the sultan faces a choice that will define his legacy. Shall the energy that conquered Java be turned outward in further military campaigns, or channeled inward to build the administrative foundations that can hold this vast realm together?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mtm.1.a: "L'épée qui a forgé Java le gardera."
 nd_mtm.1.b: "La loi et l'ordre sont supérieurs à la conquête."
 nd_mtm.2.t: "Le nouveau calendrier javanais"
 nd_mtm.2.d: "In a bold act of cultural synthesis, Sultan Agung announces a revolutionary new calendar for all of Java. The old Hindu Saka solar calendar, counting years from 78 CE, will henceforth follow the Islamic lunar cycle while retaining its Saka year numbering. The traditional Javanese five-day pasaran market cycle is preserved alongside the seven-day Islamic week, creating a thirty-five-day wetonan cycle unique in the world.\n\nThis is more than timekeeping: it is a statement that Javanese Islam need not abandon its Hindu-Buddhist past, but can weave it into something entirely new. The scholars of the kraton record the change, and the farmers of the sawah adjust their planting cycles to the new reckoning."
 nd_mtm.2.a: "Un calendrier pour une civilisation entre les mondes."
 nd_mtm.3.t: "Le siège de Batavia"
 nd_mtm.3.d: "In 1628, Sultan Agung dispatches an army of thousands westward to the Dutch fortress of Batavia. The campaign is the most ambitious in Javanese history: an attempt to expel the European interlopers who have established themselves on Java's northwest coast. The first assault fails, and a second army arrives in 1629, totaling some 14,000 soldiers under Dipati Ukur and Adipati Juminah.\n\nThe Mataram forces besiege the city and poison the Ciliwung River, causing a cholera plague that kills the Dutch Governor-General Jan Pieterszoon Coen himself. Yet Mataram's supply lines stretch too far, disease ravages the Javanese camp, and the siege ultimately fails.\n\nThe defeat forces a reckoning. How shall Mataram respond to this setback against a technologically advanced foe?"
 nd_mtm.3.a: "Nous reviendrons avec plus de force."
 nd_mtm.3.b: "Il faut apprendre à se battre autrement."
 nd_mtm.4.t: "La rébellion de Trunajaya"
 nd_mtm.4.d: "The Madurese prince Trunajaya has launched a devastating rebellion that nearly destroys the Mataram sultanate. Exploiting widespread anger at the excesses of Sultan Amangkurat I, whose purges claimed thousands of lives and whose corvee demands ground the peasantry, Trunajaya's forces defeat the royal army at Gegodog in 1676, capture the northern coast, and seize the capital at Plered in 1677.\n\nAmangkurat II makes the fateful decision to request VOC military assistance, promising financial concessions and territorial cessions. With Dutch help, Mataram reconquers its lost territories and captures Trunajaya at his stronghold of Kediri in 1678.\n\nThe throne is saved, but at what cost? The sultan must now decide how to rebuild: by strengthening internal security, or by reconsolidating the institutions of royal authority."
 nd_mtm.4.a: "Nous ne serons plus jamais pris au dépourvu."
 nd_mtm.4.b: "Restaurer les fondements du pouvoir royal."
 nd_mtm_formed_tt: "Mataram a été formé"
 nd_mtm_path_a_tt: "Choisissez l'héritage de l'épée d'Agung"
