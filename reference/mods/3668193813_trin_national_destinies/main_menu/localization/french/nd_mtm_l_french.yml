 # === Bureaucracies ===
 mtm_patih_lebet_bureaucracy: "Kepatihan du Patih Lebet"
 mtm_patih_lebet_bureaucracy_desc: "The patih lebet was the sultan's grand vizier and head of the kepatihan central administration, formalized by Sultan Agung at Kerta and expanded after 1680 at Kartasura. Beneath him a corps of nayaka secretaries and the patih anom understudy ran revenue, justice, and the levy of provincial troops, short-circuiting the regional adipati lords. The priyayi aristocracy resented the centralization but could not overthrow it."
 mtm_negaragung_mancanegara_bureaucracy: "Negaragung et Mancanegara"
 mtm_negaragung_mancanegara_bureaucracy_desc: "Le territoire de Mataram était organisé en anneaux concentriques : l'enceinte royale de Kutagara, le cœur du negaragung directement cultivé pour le roi, les provinces javanaises extérieures de mancanegara sous les régents adipati et la côte nord de pasisir sous la supervision de tumenggung. Chaque adipati devait un hommage annuel, des rotations de corvées au kraton et une apparition en public pasewakan. Le système a attiré la main-d'œuvre et les céréales vers l'intérieur, mais a saigné la paysannerie, provoquant des révoltes de Trunajaya (1674) à Mangkubumi (1746)."
 mtm_pajeksan_cadaster_bureaucracy: "Cadastre foncier de Pajeksan"
 mtm_pajeksan_cadaster_bureaucracy_desc: "Le pajeksan du sultan Agung était un corps d'évaluateurs des revenus de la couronne qui a mené la première enquête foncière systématique du centre de Java, enregistrant chaque champ de sawah et chaque maison sur des registres de feuilles de palmier conservés dans les archives de Kepatihan. Chaque unité de ménage cacah était inscrite sur le rouleau d'apanage d'un adipati et taxée en jours de riz et de corvée. Le système augmentait considérablement les revenus royaux mais pesait lourdement sur les cultivateurs : le quota de cacah diminuait, que la récolte ait lieu ou non."
 mtm_imogiri_tomb_shrine_bureaucracy: "Tombeau-sanctuaire royal d'Imogiri"
 mtm_imogiri_tomb_shrine_bureaucracy_desc: "En 1632, le sultan Agung commença à construire le complexe funéraire royal d'Imogiri, dans les collines au sud de sa capitale, sur le modèle des anciens sanctuaires de Giriloyo et des tombes sacrées du Wali Songo. Tous les sultans de Mataram depuis Agung y furent enterrés, et après 1755, Surakarta et Yogyakarta partagèrent le sanctuaire en alternance - la seule institution commune préservée par la dynastie divisée. Le culte a fusionné la vénération soufie des tombes avec le culte des ancêtres hindou-javanais plus ancien, sacralisant le trône d'une manière que même les sultans imposés par la VOC devaient honorer."
 mtm_bedhaya_court_arts_bureaucracy: "Arts de la cour Bedhaya"
 mtm_bedhaya_court_arts_bureaucracy_desc: "Le sultan Agung a commandé le Bedhaya Ketawang, une danse de cour sacrée pour neuf danseuses exécutée uniquement à l'occasion de l'anniversaire du couronnement du roi, à laquelle Kanjeng Ratu Kidul (la reine spirituelle de la mer du sud) s'est jointe en tant que dixième danseuse invisible. Autour d'elle se cristallisaient les musiciens de gamelan sekaten, les maîtres de marionnettes dalang du wayang kulit et les forgerons d'empu kraton. Le complexe a élevé la classe des aristocrates-administrateurs priyayi comme seuls transmetteurs de la haute culture javanaise, mais son entretien incombait à la paysannerie negaragung."
 mtm_surakarta_yogyakarta_dual_bureaucracy: "Double Cour Surakarta-Yogyakarta"
 mtm_surakarta_yogyakarta_dual_bureaucracy_desc: "Le Traité de Giyanti du 13 février 1755 mit fin à la troisième guerre de succession javanaise en divisant formellement Mataram entre Susuhunan Pakubuwono III à Surakarta et le sultan Hamengkubuwono I à Yogyakarta, chacun avec son propre kraton et kepatihan. La rivalité culturelle a produit une floraison remarquable : le style élégant alus de Surakarta et la lignée littéraire Yasadipura ; Le style gagah vigoureux et le scénario distinct de Yogyakarta. Mais la double administration a doublé le coût de la gouvernance, et la VOC a monté les tribunaux les uns contre les autres pendant un siècle."

