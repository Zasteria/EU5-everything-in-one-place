l_french:
 STATIC_MODIFIER_NAME_nd_gorkhali_conquest: "Conquête de Gorkhali"
 STATIC_MODIFIER_DESC_nd_gorkhali_conquest: "Les guerriers de Gorkha ont prouvé que les montagnes engendrent les soldats les plus féroces. Avec le khukuri en main et les vents himalayens dans leur dos, les armées Gorkhali parcourent les vallées, conquérant tous ceux qui se tiennent devant elles."
 STATIC_MODIFIER_NAME_nd_valley_of_temples: "Vallée des Temples"
 STATIC_MODIFIER_DESC_nd_valley_of_temples: "La vallée de Katmandou se présente comme un musée vivant de l’architecture divine. Les artisans Newari ont élevé des pagodes vers le ciel, et les routes commerciales qui traversent ces enceintes sacrées transportent les richesses du Tibet vers l'Inde."
 STATIC_MODIFIER_NAME_nd_unification_of_nepal: "Unification du Népal"
 STATIC_MODIFIER_DESC_nd_unification_of_nepal: "Les royaumes dispersés des collines ont été regroupés en une seule nation par la volonté de fer de la dynastie Shah. Les douze districts répondent à un trône unique et l'administration du Népal découle d'un centre unifié."
 STATIC_MODIFIER_NAME_nd_himalayan_bastion: "Bastion himalayen"
 STATIC_MODIFIER_DESC_nd_himalayan_bastion: "Les montagnes elles-mêmes sont notre forteresse. Chaque col est un piège mortel, chaque crête un rempart. Les armées étrangères qui marchent dans ces collines découvrent que le terrain se bat pour le Népal avant qu'une seule lame Gorkhali ne soit dégainée."
 STATIC_MODIFIER_NAME_nd_gurkha_renown: "Renommée des Gurkhas"
 STATIC_MODIFIER_DESC_nd_gurkha_renown: "La bravoure du soldat Gurkha est devenue une légende. Leur discipline sous le feu, leurs charges intrépides avec des khukuri tirés et leur endurance infatigable sur les terrains les plus difficiles ont gagné le respect à travers le monde."
 nd_npl.1.t: "Le Royaume du Népal"
 nd_npl.1.d: "From the snow-crowned peaks of the Himalaya to the steaming jungles of the Terai, a new kingdom takes shape. For centuries, the hills of Nepal harbored dozens of warring principalities: the Baisi and Chaubisi kingdoms, the three Malla city-states of the Kathmandu Valley, and countless petty lordships scattered across the ridges. Now they answer to a single crown.\n\nThe question before us is not whether Nepal shall endure, the mountains themselves guarantee that, but what kind of kingdom it shall become. The warriors of Gorkha who united these hills by force of arms see a martial destiny: Nepal as an unconquerable mountain fortress, its soldiers the terror of every invader who dares the passes. But the Newari craftsmen and merchants of the Valley see another path: Nepal as a bridge between civilizations, its temples drawing pilgrims, its workshops producing art that rivals any in Asia, its traders carrying salt and wool and silk across the roof of the world.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_npl.1.a: "Nous sommes les Gorkhali : les montagnes sont notre épée et notre bouclier."
 nd_npl.1.b: "La Vallée des Temples sera le joyau de l'Himalaya."
 nd_npl.2.t: "L'unification du Népal"
 nd_npl.2.d: "On the 25th of September, 1768, as the people of Kathmandu celebrated the festival of Indra Jatra, the armies of Gorkha entered the city. The Malla king Jaya Prakash Malla fled into the night, and Prithvi Narayan Shah ascended the throne of the Kathmandu Valley. Within a year, Lalitpur and Bhaktapur had also fallen.\n\nThe young king who had inherited a tiny hill principality in 1743 had spent twenty-five years in relentless preparation. He sealed alliances, trained his soldiers in mountain warfare, cut off the Valley's trade routes to starve it into submission, and finally struck at the moment of religious celebration when the defenders were distracted. His Dibya Upadesh, the 'Divine Counsel', laid out a political philosophy for governing the diverse peoples of his new kingdom: Nepal as a garden of many flowers, united under the Shah crown.\n\nThe fifty-four kingdoms of the hills are now one. The pajani system reviews every official annually. Birta land grants reward the loyal. Twelve districts, four in each region, carry the king's authority to every corner of the realm."
 nd_npl.2.a: "Le Népal est désormais un seul royaume, de Mechi à Mahakali."
 nd_npl.3.t: "La guerre anglo-népalaise"
 nd_npl.3.d: "The expanding borders of Nepal have collided with the interests of the British East India Company. In 1814, after years of frontier skirmishes and disputed territories in the Terai, war has broken out. The Company fields armies numbering thirty thousand men with modern artillery; Nepal's defenders number barely eight thousand.\n\nBut the Gurkhas fight on their own ground. General Amar Singh Thapa holds the western passes with stubborn determination. The British columns find their cannons useless in the mountains, their supply lines harassed by Gurkha raiders, their soldiers dropping from disease and exhaustion. It takes the most experienced British commander, David Ochterlony, two years and an innovative mountain campaign to finally force a decisive battle at Makwanpur.\n\nThe Treaty of Sugauli costs Nepal a third of its territory, but it gains something perhaps more valuable. The British, who have fought across India and the world, declare the Gurkha the most formidable infantry they have ever faced. They will never attempt to conquer Nepal again."
 nd_npl.3.a: "Nos montagnes sont notre plus grande forteresse. Fortifions chaque passage."
 nd_npl.3.b: "Le monde a vu ce qu'un Gurkha peut faire. Que cette réputation soit notre bouclier."
 nd_npl.4.t: "Arniko et l'héritage de la pagode"
 nd_npl.4.d: "In 1260, the young Newar architect Arniko led a delegation of eighty artisans from the Kathmandu Valley to the court of Kublai Khan in China. The Emperor, having heard of the extraordinary skill of Newari craftsmen in metalwork and temple construction, had requested their services to build a golden stupa in Tibet.\n\nArniko's genius transcended the original commission. He designed pagodas, cast bronze statues of astonishing beauty, and introduced architectural techniques that would transform building practices across the Yuan Empire. The multi-tiered pagoda style that originated in Nepal's temple squares now rises above Buddhist monasteries from Lhasa to Beijing. Arniko himself became Controller of Imperial Manufactories: a remarkable honor for a foreign artisan.\n\nThe legacy endures in every pagoda that graces the skylines of East Asia, a testament to the artistic traditions nurtured in the workshops of Patan and the temple squares of Bhaktapur."
 nd_npl.4.a: "Nos artisans portent la gloire du Népal aux quatre coins du monde."
 nd_npl_khas_warriors: "Guerriers Khas"
 nd_npl_khas_warriors_desc: "L'empire Khas Malla, dans l'ouest du Népal, a produit de féroces guerriers qui ont attaqué jusqu'au Tibet et dans la vallée de Katmandou entre le XIIe et le XIVe siècle."
 nd_npl_newari_architecture: "Architecture Newari"
 nd_npl_newari_architecture_desc: "Le peuple Newar de la vallée de Katmandou a développé une tradition architecturale distinctive de temples pagodes à plusieurs niveaux, d'entretoises en bois finement sculptées et de constructions en brique et en bois."
 nd_npl_mountain_dwellers: "Les habitants des montagnes"
 nd_npl_mountain_dwellers_desc: "La vie dans les collines himalayennes engendre la rusticité. Les armées qui envahissent ces hauteurs font face à l’épuisement, au mal de l’altitude et à un terrain infranchissable avant même de rencontrer un soldat népalais."
 nd_npl_himalayan_herbs: "Herbes himalayennes"
 nd_npl_himalayan_herbs_desc: "The foothills of the Himalaya produce an extraordinary variety of medicinal herbs and plants, traded throughout South Asia for centuries. With them goes musk, cut from the deer of the high forests and prized by every physician and perfumer of the plains."
 nd_npl_malla_governance: "Gouvernance Malla"
 nd_npl_malla_governance_desc: "Les rois Malla ont développé des systèmes administratifs sophistiqués pour gouverner les trois cités-États de la vallée de Katmandou, avec des lois et des traditions judiciaires codifiées."
 nd_npl_trans_himalayan_trade: "Commerce transhimalayen"
 nd_npl_trans_himalayan_trade_desc: "Depuis des millénaires, des routes commerciales empruntent les cols de l'Himalaya, transportant le sel et la laine du Tibet vers le sud et les céréales et les produits manufacturés vers le nord."
 nd_npl_patan_metalwork: "Ferronnerie Patan"
 nd_npl_patan_metalwork_desc: "La ville de Patan, ancienne capitale de Lalitpur, est réputée pour sa tradition métallurgique. Les artisans newar produisent des sculptures en bronze et des objets religieux d'une qualité extraordinaire."
 nd_npl_arniko_legacy: "L'héritage d'Arniko"
 nd_npl_arniko_legacy_desc: "L'architecte newar du XIIIe siècle, Arniko, a transporté la tradition architecturale des pagodes du Népal à la cour des Yuan, où elle a transformé les pratiques de construction dans toute l'Asie de l'Est."
 nd_npl_guthi_system: "Système Guthi"
 nd_npl_guthi_system_desc: "Les guthi sont des fondations communautaires qui financent les temples, les festivals et la protection sociale. Cette institution renforce les liens communautaires et assure la continuité de la vie religieuse et culturelle."
 nd_npl_pashmina_trade: "Commerce de Pashmina"
 nd_npl_pashmina_trade_desc: "The fine wool of Himalayan mountain goats is woven into pashmina, prized across South Asia and beyond for its warmth and delicacy. The looms stand in the herding villages of the wool country."
 nd_npl_newar_guilds: "Guildes Newar"
 nd_npl_newar_guilds_desc: "La société newar est organisée autour de guildes professionnelles et de groupes de castes, avec des métallurgistes, des charpentiers, des peintres et des commerçants, chacun spécialisé dans un artisanat essentiel à la vie de la vallée."
 nd_npl_durbar_squares: "Places Durbar"
 nd_npl_durbar_squares_desc: "Les places des palais royaux de Katmandou, Bhaktapur et Patan sont des centres de pouvoir politique et de réalisation artistique, remplis de temples, de cours et de monuments sculptés."
 nd_npl_mountain_fortifications: "Fortifications de montagne"
 nd_npl_mountain_fortifications_desc: "Les cols et les lignes de crête du Népal constituent des positions défensives naturelles. Les fortifier transforme un terrain déjà difficile en forteresses imprenables."
 nd_npl_gorkhali_tradition: "Tradition Gorkhali"
 nd_npl_gorkhali_tradition_desc: "Les soldats du royaume Gorkha allient endurance en montagne et discipline féroce. Ils combattent au corps à corps avec les khukuri et connaissent chaque crête et vallée de leur patrie."
 nd_npl_salt_trade: "Commerce du sel"
 nd_npl_salt_trade_desc: "The ancient trade in Tibetan salt passes through Nepal's mountain corridors, with Himalayan communities acting as intermediaries between Tibet's pastoral economy and India's agricultural plains. The same pack trains can carry an army's grain over the passes."
 nd_npl_malla_renaissance: "Malla Renaissance"
 nd_npl_malla_renaissance_desc: "The later Malla period saw an explosion of artistic achievement in the Kathmandu Valley, with paubha scroll painting, bronze sculpture, and wood carving reaching extraordinary heights under royal patronage.\n\n#italic Available in: $nd_npl_newari_workshop$#!"
 nd_npl_baisi_chaubisi: "Royaumes Baisi-Chaubisi"
 nd_npl_baisi_chaubisi_desc: "Avant l'unification, le Népal était fragmenté en royaumes Baisi (vingt-deux) et Chaubisi (vingt-quatre) : une mosaïque de principautés montagnardes constamment en compétition par le biais d'alliances, d'intrigues et de guerres."
 nd_npl_religious_syncretism: "Syncrétisme religieux"
 nd_npl_religious_syncretism_desc: "Dans la vallée de Katmandou, l’hindouisme et le bouddhisme coexistent et s’entremêlent depuis des siècles. Les mêmes divinités sont vénérées sous des noms différents et les temples servent les deux traditions."
 nd_npl_khukuri_warriors: "Guerriers Khukuri"
 nd_npl_khukuri_warriors_desc: "Le khukuri courbé vers l'avant est à la fois un outil et une arme, porté par chaque soldat Gorkhali. En combat rapproché, sa lourde lame tranchante est dévastatrice et sa redoutable réputation précède son porteur."
 nd_npl_mountain_warfare: "Guerre en montagne"
 nd_npl_mountain_warfare_desc: "Des siècles de guerre dans les collines ont produit une doctrine militaire népalaise distinctive : tenir les hauteurs, contrôler les cols, harceler les lignes de ravitaillement ennemies et combattre uniquement lorsque le terrain vous est favorable."
 nd_npl_gorkha_consolidation: "Consolidation Gorkha"
 nd_npl_gorkha_consolidation_desc: "La dynastie Shah de Gorkha transforme un petit royaume montagnard en un État centralisé, construisant l'infrastructure militaire et administrative nécessaire à l'unification."
 nd_npl_pajani_system: "Système Pajani"
 nd_npl_pajani_system_desc: "Le système d’examen annuel Pajani garantit qu’aucun fonctionnaire ne se laisse aller à la complaisance. Chaque année, les nominations sont reconsidérées et les concessions de terres reconfirmées ou révoquées."
 nd_npl_birta_grants: "Bourses Birta"
 nd_npl_birta_grants_desc: "Les concessions de terres birta exonérées d'impôt récompensent le service militaire et la loyauté administrative, encourageant l'expansion de l'armée Gorkha sans surcharger la population."
 nd_npl_valley_commerce: "Commerce de la vallée"
 nd_npl_valley_commerce_desc: "Les trois anciennes cités-États Malla de la vallée de Katmandou (Katmandou, Patan et Bhaktapur) restent des centres commerciaux prospères sous le royaume unifié."
 nd_npl_gorkha_rifles: "Fusils Gorkha"
 nd_npl_gorkha_rifles_desc: "L'introduction d'armes à feu modernes transforme l'infanterie Gorkhali en une force formidable combinant la technologie des armes européennes avec des compétences de combat en montagne inégalées."
 nd_npl_shah_unification: "Unification du Shah"
 nd_npl_shah_unification_desc: "Prithvi Narayan Shah conquiert la vallée de Katmandou en 1768, unissant les royaumes dispersés des collines dans le royaume du Népal et établissant la dynastie Shah en tant que dirigeants d'un État unifié."
 nd_npl_divya_upadesh_admin: "The Six Houses"
 nd_npl_divya_upadesh_admin_desc: "Six houses of Gorkha, the Pande, Pantha, Aryal, Khanal, Rana and Bohora, have stood beside the Shah kings since the kingdom was founded. As the realm grows, its high offices are filled from these Tharghar, and the court that is kept in their hands is kept in order."
 nd_npl_yam_between_boulders: "Mission to Peking"
 nd_npl_yam_between_boulders_desc: "By the peace made at Betrawati in 1792 an embassy is sent over the passes to Peking every five years with gifts for the emperor. The favour of a distant court costs little, and it is weighed by every power in the plains that thinks of marching into the hills."
 nd_npl_anglo_nepalese_war: "Guerre anglo-népalaise"
 nd_npl_anglo_nepalese_war_desc: "La guerre de 1814-1816 avec la Compagnie britannique des Indes orientales coûte au Népal un tiers de son territoire mais vaut aux Gurkha la réputation d'être l'infanterie la plus féroce d'Asie."
 nd_npl_rana_modernization: "Modernisation du Rana"
 nd_npl_rana_modernization_desc: "The Rana prime ministers who dominate Nepal's government from 1846 onward introduce military reforms modeled on European armies while maintaining Nepal's fierce independence. The arsenals begun under Bhimsen Thapa supply the muskets."
 nd_npl_himalayan_sovereignty: "Souveraineté himalayenne"
 nd_npl_himalayan_sovereignty_desc: "Le Népal est l’un des rares États asiatiques à n’avoir jamais été colonisé par une puissance européenne. Sa géographie montagneuse, sa réputation martiale et ses compétences diplomatiques préservent son indépendance."
 nd_npl_mountain_kingdom: "Identité du Royaume des Montagnes"
 nd_npl_mountain_kingdom_desc: "Les divers peuples du Népal (Newar, Magar, Gurung, Limbu, Rai, Chhetri et autres) se forgent une identité commune en tant que citoyens du royaume montagnard."
 a_nd_npl_khas_warrior: "Guerrier Khas"
 a_nd_npl_khas_warrior_desc: "Féroce infanterie de montagne de l'ancien empire Khas Malla, endurcie par la guerre constante à travers les crêtes occidentales de l'Himalaya."
 a_nd_npl_gorkhali_sipahi: "Gorkhali Sipahi"
 a_nd_npl_gorkhali_sipahi_desc: "Soldats disciplinés du royaume de Gorkha, entraînés à la guerre en montagne et armés du khukuri distinctif aux côtés d'armes conventionnelles."
 a_nd_npl_khukuri_skirmisher: "Tirailleurs Khukuri"
 a_nd_npl_khukuri_skirmisher_desc: "Close-combat raiders who exploit the confusion of mountain warfare, closing rapidly with their heavy khukuri blades to devastating effect. They wear no armour."
 a_nd_npl_yak_caravan: "Yak Caravan"
 a_nd_npl_yak_caravan_desc: "The pack trains of the salt trade, pressed into the army's service: yaks on the high passes, sheep and goats with saddlebags below. They carry more than a cart column and are slowed less by mountain and hill, and they are slow everywhere."
 a_nd_npl_gorkha_rifleman: "Fusilier Gorkha"
 a_nd_npl_gorkha_rifleman_desc: "L'infanterie de montagne modernisée du Népal, combinant les armes à feu européennes avec l'endurance, la discipline et la maîtrise du terrain qui rendent les soldats Gurkha légendaires."
 levy_nd_npl_khas_warrior: "Prélèvement du guerrier Khas"
 levy_nd_npl_khas_warrior_desc: "Infanterie de montagne recrutée parmi les communautés Khas des hautes terres, de féroces guerriers endurcis par la vie dans les crêtes occidentales de l'Himalaya."
 levy_nd_npl_khukuri_skirmisher: "Prélèvement des tirailleurs Khukuri"
 levy_nd_npl_khukuri_skirmisher_desc: "Des raiders de combat rapproché recrutés dans les colonies frontalières de Gorkhali, brandissant la lourde lame khukuri incurvée vers l'avant, ont un effet dévastateur lors des embuscades en montagne."
 nd_npl_pagoda_temple: "Temple de la pagode"
 nd_npl_pagoda_temple_desc: "Un temple à plusieurs niveaux dans le style architectural newari distinctif, avec des entretoises en bois finement sculptées, des murs en briques et des toits dorés s'élevant vers le ciel."
 nd_npl_himalayan_fortress: "Forteresse himalayenne"
 nd_npl_himalayan_fortress_desc: "Une forteresse de montagne construite pour contrôler un col ou une crête stratégique, exploitant les avantages défensifs naturels du terrain accidenté du Népal."
 nd_npl_himalayan_sarai: "Saraï himalayen"
 nd_npl_himalayan_sarai_desc: "Une maison de repos et un poste de traite le long des routes commerciales transhimalayennes, offrant abri et stockage aux caravanes qui transportent du sel, de la laine et des céréales entre le Tibet et l'Inde."
 nd_npl_newari_workshop: "Atelier Newari"
 nd_npl_newari_workshop_desc: "Un atelier de travail du métal et de sculpture sur bois composé d'artisans Newar, produisant des sculptures en bronze, des objets religieux et des éléments architecturaux d'un savoir-faire extraordinaire."
 nd_npl_guthi_endowment: "Dotation Guthi"
 nd_npl_guthi_endowment_desc: "Une institution fiduciaire communale qui gère les dotations foncières pour financer les temples, les festivals et la protection sociale. Le système guthi est le fondement de la vie communautaire newar."
 nd_npl_durbar_palace: "Palais Durbar"
 nd_npl_durbar_palace_desc: "Un complexe de palais royal dans la tradition Malla, avec des cours, des salles d'audience et des temples environnants qui constituent le cœur politique et culturel d'une ville népalaise."
 nd_npl_gorkhali_barracks: "Caserne de Gorkhali"
 nd_npl_gorkhali_barracks_desc: "Un centre d'entraînement militaire où l'infanterie de montagne apprend les techniques de combat qui font craindre les soldats Gorkhali dans tout le sous-continent."
 nd_npl_temple_offerings: "Offrandes au temple"
 nd_npl_temple_offerings_desc: "Les offrandes sacrées de teintures, d'encens et de bougies en cire d'abeille qui soutiennent la vie rituelle des temples-pagodes du Népal."
 nd_npl_garrison_supply: "Ravitaillement de la garnison"
 nd_npl_garrison_supply_desc: "La pierre, le bois et les armes nécessaires pour maintenir une forteresse de montagne himalayenne contre tout venant."
 nd_npl_salt_wool_trade: "Commerce de sel et de laine"
 nd_npl_salt_wool_trade_desc: "The ancient trade in Tibetan salt and wool, carried by yak caravans across the high Himalayan passes, with rice going north in return."
 nd_npl_bronze_casting: "Moulage en bronze"
 nd_npl_bronze_casting_desc: "Les métallurgistes newar de Patan utilisent le cuivre et la technique de la cire perdue pour couler des sculptures en bronze et des bijoux religieux exportés à travers le monde bouddhiste."
 nd_npl_endowment_upkeep: "Entretien de la dotation"
 nd_npl_endowment_upkeep_desc: "Les céréales, les tissus et l'encens sont gérés par les administrateurs guthi pour soutenir les institutions communautaires, les fêtes et les observances religieuses."
 nd_npl_court_maintenance: "Entretien des tribunaux"
 nd_npl_court_maintenance_desc: "Les soies, les teintures et les produits de luxe nécessaires au maintien de la splendeur d'une cour royale népalaise."
 nd_npl_barracks_upkeep: "Entretien des casernes"
 nd_npl_barracks_upkeep_desc: "Les armes, l'équipement en cuir et les outils nécessaires pour armer et entretenir un centre d'entraînement militaire de Gorkhali."
 nd_npl_herbal_trade: "Commerce des herbes himalayennes"
 nd_npl_herbal_trade_desc: "Musk pods, bitter roots and herbs are brought down from the hill forests, dried over slow fires and packed for the physicians of the plains."
 nd_npl_herb_lodge: "Herb Gatherers' Lodge"
 nd_npl_herb_lodge_desc: "Drying sheds at the edge of the hill forest. Collectors bring in musk, roots and herbs each season, and the lodge sorts, dries and packs them. It can stand only where the land is rich in game."
 nd_npl_hill_loom: "Hill Loom House"
 nd_npl_hill_loom_desc: "A house of looms in a herding village, where the under-wool of mountain goats is combed out, spun and woven into shawl cloth. It can stand only in wool country."
 nd_npl_arsenal: "Gorkhali Arsenal"
 nd_npl_arsenal_desc: "A gun foundry and magazine of the state. Smiths work iron from the hill mines into musket barrels and locks on foreign patterns, and the finished arms are stored under guard."
 nd_npl_newar_woodcarving: "Newar Woodcarving"
 nd_npl_newar_woodcarving_desc: "Carved windows, doors, struts and chests of sal wood, cut by the Newar carpenters and painted."
 nd_npl_pashmina_weaving: "Tissage Pashmina"
 nd_npl_pashmina_weaving_desc: "Le tissage de fines laines pashmina provenant de chèvres de montagne de l'Himalaya pour en faire des châles et des textiles prisés pour leur chaleur et leur délicatesse."
 nd_npl_arms_manufacturing: "Fabrication d'armes népalaises"
 nd_npl_arms_manufacturing_desc: "Local forges produce the weapons of the Gorkhali army, from the iconic khukuri to muskets adapted from European designs."
 nd_npl_formed_tt: "Le Népal a été formé"
 nd_npl_path_a_tt: "Choisissez la conquête de Gorkhali"
 nd_npl_path_b_tt: "Choisissez la Vallée des Temples"
 nd_npl_destiny: "Destin du Népal"
 nd_npl_destiny_desc: "Le Royaume du Népal a été proclamé. Maintenant commence le véritable test : ce royaume montagnard peut-il se forger un destin durable parmi les grandes puissances d’Asie ? Atteindre la stabilité pour poser les bases."
 nd_npl_dest_hills: "Conquête des collines"
 nd_npl_dest_hills_desc: "L'épée Gorkhali doit d'abord unir les contreforts. Saisissez la terre sacrée de Lumbini et pénétrez dans les plaines de Mithila à Darbhanga. Construisez une armée digne des guerriers des montagnes."
 nd_npl_dest_plains: "Descente vers les plaines"
 nd_npl_dest_plains_desc: "With the hills secure, the Gorkhali gaze turns south to the rich Gangetic plain. Raise standing companies under paid officers, and Patna and Lucknow, seats of ancient empires, must fall to Nepali arms."
 nd_npl_dest_empire: "L'empire Gorkhali"
 nd_npl_dest_empire_desc: "La vision ultime : un empire himalayen s’étendant du toit du monde jusqu’aux eaux bénites du Gange. Prenez Lhassa, la ville sacrée du Tibet, et Varanasi, la ville la plus sainte de l'hindouisme."
 nd_npl_dest_trade: "Commerce transhimalayen"
 nd_npl_dest_trade_desc: "Contrôlez les routes commerciales qui traversent les cols de montagne. Prenez Shigatse au Tibet pour dominer l'approche nord et assurer l'écoulement de la soie sur les marchés népalais."
 nd_npl_dest_artisans: "La Floraison Artisanale"
 nd_npl_dest_artisans_desc: "The workshops of the Valley must become legendary. Spread to Paro in Bhutan, embrace the printing press, and build up Kathmandu to support a renaissance of craft and learning."
 nd_npl_dest_kathmandu_developed_tt: "We own #bold Kathmandu#! and its development is at least #bold 38#!"
 nd_npl_dest_jewel: "Joyau de l'Himalaya"
 nd_npl_dest_jewel_desc: "La vallée de Katmandou deviendra le joyau culturel de l'Asie. Étendez l'influence civilisatrice du Népal à Thimpu, adoptez le commerce mondial et assurez-vous que les bijoux Newari ornent les marchés du monde."
 nd_npl.5.t: "Le royaume des montagnes s'élève"
 nd_npl.5.d: "Nepal stands united: a single crown above the land of snow and temple. The scattered principalities that once warred among themselves have been forged into a kingdom. From the Terai jungles to the high Himalayan passes, the flag of Nepal flies.\n\nBut a kingdom newly born must prove its worth. The court debates the path forward: shall Nepal be a sword or a jewel? A mountain fortress whose warriors terrify empires, or a garden of temples whose artisans and merchants earn the admiration of the world?\n\nThe foundations are laid. What rises upon them depends on the choices yet to come."
 nd_npl.5.a: "Le Népal perdurera : c'est ce que nous jurons sur les montagnes."
 nd_npl.6.t: "Les collines Soumettre"
 nd_npl.6.d: "The birth-soil of the Buddha at Lumbini now falls under Nepali sovereignty, and our armies have pushed across the Terai into the Mithila plains. The sacred sites and fertile lowlands that once fed rival kingdoms now sustain the Gorkhali war machine.\n\nLocal zamindars and petty rajas bend the knee or flee. The mountain warriors who once fought only among ridges and valleys have proven they can descend into the flatlands and conquer there too. Every hill fort and river crossing reinforces the lesson: the Gorkhali do not stop."
 nd_npl.6.a: "Les contreforts sont à nous. Maintenant : les plaines."
 nd_npl.7.t: "La conquête des plaines"
 nd_npl.7.d: "Patna, the ancient capital of Magadha, has fallen to Gorkhali arms. Lucknow, seat of the Nawabs of Awadh, follows. The mountain warriors who once seemed content with their highland kingdom have burst forth into the Gangetic heartland like a Himalayan river breaking its banks.\n\nThe conquests present a choice. We can push rapidly, sweeping through the Terai and the plains with aggressive campaigns that seize territory before our enemies can organize: speed and violence carrying the day. Or we can advance methodically, securing supply lines through the mountain passes and binding conquered peoples to Nepali rule through loyal vassals and garrison settlements."
 nd_npl.7.a: "Frappez vite : la vitesse est désormais notre arme."
 nd_npl.7.b: "Sécurisez chaque vallée avant de passer à la suivante."
 nd_npl.8.t: "L'empire Gorkhali"
 nd_npl.8.d: "From the golden rooftops of Lhasa to the burning ghats of Varanasi, the flag of Nepal flies over lands that have humbled every conqueror in history. The Potala Palace and the Vishwanath Temple, the holiest sites of Buddhism and Hinduism alike, acknowledge Nepali sovereignty.\n\nThis is no mere hill kingdom. This is an empire that bestrides the Himalaya, controlling the trade routes between India and Central Asia, commanding the sacred geography of two great faiths, and fielding armies hardened by the most demanding terrain on earth.\n\nThe question now is how to rule. Shall Nepal extract the tribute of the conqueror, or absorb these diverse peoples into a mountain civilization that transcends any single culture?"
 nd_npl.8.a: "Les vaincus connaîtront le prix de la puissance de Gorkhali."
 nd_npl.8.b: "Que chaque peuple trouve sa place au sein de l’empire des montagnes."
 nd_npl.9.t: "Les routes commerciales ouvertes"
 nd_npl.9.d: "Nepali merchants now control Shigatse, the great trading town of Tsang province in Tibet. Silk caravans from China and India pass through markets where Newari traders weigh goods and set prices. The ancient dream of Nepal as a bridge between civilizations begins to take form.\n\nSalt flows south, grain flows north, and silk from both directions meets in Kathmandu's market squares. The sarais along the mountain passes bustle with traders speaking a dozen languages. Nepal's geographic position, once seen as a curse trapped between empires, reveals itself as the kingdom's greatest asset."
 nd_npl.9.a: "Les montagnes ne divisent pas. Ils se connectent."
 nd_npl.10.t: "La Floraison Artisanale"
 nd_npl.10.d: "The workshops of Patan and Bhaktapur have entered a golden age. Bronze sculptures of extraordinary delicacy, paubha paintings alive with mineral pigments, and wood carvings of impossible intricacy flow from Newari workshops to courts and temples across Asia. The printing press has arrived in the Valley, and with it an explosion of religious texts and artistic manuals.\n\nNepal's cultural reach now extends to Bhutan, where Nepali-trained artisans build temples in the Newari style. The kingdom must decide how to sustain this flowering: through the discipline of guild regulation, ensuring quality through tradition, or through open markets that attract foreign artisans and ideas."
 nd_npl.10.a: "Les guildes garderont les standards de l'artisanat Newari."
 nd_npl.10.b: "Ouvrez les laissez-passer. Laissons le commerce transporter notre art dans le monde."
 nd_npl.11.t: "Joyau de l'Himalaya"
 nd_npl.11.d: "The Kathmandu Valley has become what Arniko's journey to the Yuan court only hinted at: the cultural and spiritual center of the Himalayan world. Newari jewelry, cast in workshops that have refined their techniques over centuries, is traded as far as Persia and Siam. Temples rise in the pagoda style from Bhutan to Bengal, all tracing their lineage to the master builders of Patan.\n\nScholars come to study at institutions where Hindu philosophy and Buddhist meditation are taught side by side. The Valley's syncretism, once a local curiosity, has become a model for religious harmony that draws admiration from far beyond the mountains.\n\nNepal must choose how to project this cultural power: through diplomatic engagement that opens doors across the world, or through deepening the Valley's role as a sacred center of pilgrimage and learning."
 nd_npl.11.a: "Que la voix du Népal soit entendue dans tous les tribunaux d'Asie."
 nd_npl.11.b: "La vallée elle-même sera la destination. Laissons le monde venir à nous."
 STATIC_MODIFIER_NAME_nd_npl_dest_terai_sweep: "Balayage du Teraï"
 STATIC_MODIFIER_DESC_nd_npl_dest_terai_sweep: "Les armées Gorkhali ont balayé les basses terres du Terai à une vitesse dévastatrice, mais cette expansion rapide met à rude épreuve la trésorerie du royaume."
 STATIC_MODIFIER_NAME_nd_npl_dest_mountain_descent: "Descente en montagne"
 STATIC_MODIFIER_DESC_nd_npl_dest_mountain_descent: "L'avancée du Népal dans les plaines se déroule méthodiquement, avec des lignes d'approvisionnement sécurisées à travers les cols de montagne et des territoires conquis liés par des vassaux fidèles."
 STATIC_MODIFIER_NAME_nd_npl_dest_nepal_ascendant: "Ascendant Népal"
 STATIC_MODIFIER_DESC_nd_npl_dest_nepal_ascendant: "L'empire Gorkhali est une réalité. Le Népal dicte ses conditions depuis une position de force absolue, ses armées enrichies par le butin de la conquête."
 STATIC_MODIFIER_NAME_nd_npl_dest_mountain_empire: "L'empire des montagnes"
 STATIC_MODIFIER_DESC_nd_npl_dest_mountain_empire: "Les divers peuples de l'empire Gorkhali sont entraînés dans une civilisation montagnarde commune, même si la réputation redoutable du Népal rend la diplomatie difficile."
 STATIC_MODIFIER_NAME_nd_npl_dest_artisan_guild: "Guilde de la Vallée"
 STATIC_MODIFIER_DESC_nd_npl_dest_artisan_guild: "Les guildes Newar appliquent des normes rigoureuses qui rendent l'artisanat de la vallée légendaire. Des crédits bon marché affluent vers les ateliers, mais l'accent mis sur l'artisanat a affaibli la cavalerie du royaume."
 STATIC_MODIFIER_NAME_nd_npl_dest_silk_road: "Route de la soie himalayenne"
 STATIC_MODIFIER_DESC_nd_npl_dest_silk_road: "Le Népal se situe au carrefour des civilisations, ses marchés étant ouverts aux commerçants de toutes confessions et de toutes nations. Les cols transportent des richesses dans les deux sens."
 STATIC_MODIFIER_NAME_nd_npl_dest_himalayan_jewel: "Joyau himalayen"
 STATIC_MODIFIER_DESC_nd_npl_dest_himalayan_jewel: "La diplomatie culturelle du Népal ouvre les portes de l'Asie. Ambassadeurs et érudits portent la renommée de la Vallée dans toutes les cours, et les idées nouvelles affluent par les mêmes canaux."
 STATIC_MODIFIER_NAME_nd_npl_dest_sacred_valley: "La Vallée Sacrée"
 STATIC_MODIFIER_DESC_nd_npl_dest_sacred_valley: "The Kathmandu Valley has become a center of religious harmony and learning, where Hindu and Buddhist traditions enrich each other under a streamlined administration. Pilgrims and scholars of both come to it, and many stay."
 nd_npl_gorkhali_citadel: "Citadelle de Gorkhali"
 nd_npl_gorkhali_citadel_desc: "Une immense citadelle de montagne construite pour projeter la puissance Gorkhali sur le territoire conquis, avec des casernes, des armureries et des postes de commandement pour les armées en constante expansion de l'empire."
 nd_npl_citadel_garrison: "Garnison de la Citadelle"
 nd_npl_citadel_garrison_desc: "Les armes, les fortifications en pierre et l'équipement en cuir nécessaires au maintien d'une citadelle de Gorkhali en tant que centre de puissance militaire."
 nd_npl_valley_academy: "Académie de la Vallée"
 nd_npl_valley_academy_desc: "Un centre d'apprentissage où la philosophie hindoue, la méditation bouddhiste et les traditions artistiques newari sont étudiées et préservées, attirant des érudits du monde himalayen."
 nd_npl_academy_upkeep: "Entretien de l'Académie"
 nd_npl_academy_upkeep_desc: "Le papier, les livres et les bougies en cire d'abeille qui soutiennent les activités scientifiques d'une académie de la Vallée et éclairent ses salles de lecture."
 npl_bhardari_sabha_bureaucracy: "Bhardari Sabha"
 npl_bhardari_sabha_bureaucracy_desc: "Le bhardari était le conseil des bhardars : les grandes maisons nobles (Pande, Thapa, Basnyat, Chautariya) détenant des fonctions de kaji et de sardar. Après la mort de Prithvi Narayan Shah en 1775, le conseil dirigea efficacement le Népal pendant les longues minorités des rois Shah, équilibrant le trône contre les kajis. Le Bhardari Sabha est le corps social des maisons nobles; bien entretenu, il stabilise la succession, négligé, il se dissout dans la guerre des factions."

 npl_mukhtiyari_bureaucracy: "Moukhtiyari"
 npl_mukhtiyari_bureaucracy_desc: "Le mukhtiyar était le tout-puissant ministre en chef du Népal, fonction institutionnalisée par Bhimsen Thapa de 1806 à 1837 sous le roi Girvan Yuddha et le jeune roi Rajendra. Détenant le sceau, l'armée et le trésor, le mukhtiyar a remplacé le conseil bhardari et a concentré l'autorité dans une seule main : un exécutif délibéré contre les factions nobles. Maintenue, la charge fait avancer le royaume au pas; lâchez prise, cela s'effondre dans un goulot d'étranglement et les kajis se retournent contre le parvenu."

 npl_pajani_bureaucracy: "Pajani"
 npl_pajani_bureaucracy_desc: "Le pajani était l'examen annuel du personnel au cours duquel chaque responsable civil et militaire se présentait au tribunal pour être reconduit; le mandat expirait par défaut chaque année. Un dispositif de l’ère du Shah visant à tenir les kajis, les sardars et les collecteurs d’impôts directement responsables devant le trône : l’opposé institutionnel de la fonction héréditaire. Maintenu, le pajani maintient les fonctionnaires vigilants; négligé, chaque poste a son prix et le favoritisme ruine la continuité dans les provinces."

 npl_newar_guthi_bureaucracy: "Newar Guthi"
 npl_newar_guthi_bureaucracy_desc: "Le système guthi est l'institution newari de fiducies perpétuelles, détenues collectivement par des clans ou des castes, qui financent l'entretien des temples, les processions des festivals, les canaux d'irrigation et les maisons de repos. Les Guthis possèdent entièrement leurs terres et les administrent à travers les générations, indépendamment du patronage royal. Les rois Malla régnaient avec le système guthi; les Shahs en ont hérité et n’ont jamais pu le dissoudre. Une infrastructure civique et religieuse parallèle à l'État : lorsqu'elle est en bon état, les fêtes se déroulent et l'irrigation coule à flot; lorsqu'ils sont négligés, les fiduciaires transforment les dotations en fiefs privés."

 npl_jagir_tenure_bureaucracy: "Régime foncier de Jagir"
 npl_jagir_tenure_bureaucracy_desc: "Jagir était la cession des revenus d'une parcelle de terrain à un soldat ou à un officier en lieu et place d'une solde en espèces ; détenu pour la durée du service et, en principe, révocable chez pajani. Aux côtés de la birta (subventions non imposables aux brahmanes, souvent héréditaires) le jagir constituait l'épine dorsale financière de l'armée de Gorkhali, permettant au royaume de déployer d'importantes forces sans trésor capable de les payer. Entretenue, l'armée se rassemble à moindre coût; négligés, les jagirdars écrasent la paysannerie et les attributions révocables se transforment en propriétés héréditaires."

 AUTO_MODIFIER_NAME_nd_npl_bureaucracy_authority: "Établissement bureaucratique"
 AUTO_MODIFIER_DESC_nd_npl_bureaucracy_authority: "Les institutions permanentes du Népal (le conseil bhardari, le sceau du mukhtiyar, la revue annuelle pajani, le Newar guthis et le système de tenure jagir) sont codifiées en tant qu'organes permanents du royaume. Le royaume peut désormais mettre en place des bureaucraties."
