l_french:
 STATIC_MODIFIER_NAME_nd_fin_thousand_lakes: "Terre aux mille lacs"
 STATIC_MODIFIER_DESC_nd_fin_thousand_lakes: "L'identité de la Finlande s'est forgée dans ses vastes étendues sauvages, ses forêts denses, ses lacs gelés et son terrain inflexible qui ont façonné un peuple d'une extraordinaire résilience. La frontière finlandaise est un bouclier contre tout envahisseur, où chaque sentier forestier devient une embuscade et chaque lac gelé une barrière."
 STATIC_MODIFIER_NAME_nd_fin_northern_trade: "Voies commerciales du Nord"
 STATIC_MODIFIER_DESC_nd_fin_northern_trade: "Des fours à goudron d'Ostrobotnie aux marchés de fourrures de l'intérieur, la richesse de la Finlande coule à travers ses forêts et ses cours d'eau. Le goudron finlandais scelle les coques des marines européennes, les fourrures finlandaises réchauffent les cours du continent et le bois finlandais construit les villes de la Baltique."
 STATIC_MODIFIER_NAME_nd_fin_agricola_legacy: "L'héritage d'Agricola"
 STATIC_MODIFIER_DESC_nd_fin_agricola_legacy: "L’œuvre de Mikael Agricola perdure : une langue finnoise écrite, une congrégation alphabétisée et un peuple capable de lire la parole de Dieu dans sa propre langue. Ce fondement de l’alphabétisation et de l’apprentissage servira à la Finlande pendant des siècles."
 STATIC_MODIFIER_NAME_nd_fin_great_wrath_survival: "Survivants de la Grande Colère"
 STATIC_MODIFIER_DESC_nd_fin_great_wrath_survival: "Les années d’occupation russe ont mis la Finlande à rude épreuve, des villages incendiés, des populations déportées, une génération entière marquée. Mais le peuple finlandais a enduré, et des cendres de la Grande Colère a émergé une nation endurcie par la souffrance et déterminée à se reconstruire."
 nd_fin.1.t: "La naissance de la Finlande"
 nd_fin.1.d: "The Finnish lands have been united under a single banner for the first time. For centuries, these territories at the edge of the known world served as a frontier between East and West: a land of endless forests, countless lakes, and a people hardened by the harshest winters in Europe. Now the question falls to us: what shall Finland become? Shall we embrace the character of our land: the impenetrable wilderness, the frozen lakes that swallow armies, the sisu that lets our people endure what others cannot? Or shall we look outward to the trade routes that connect us to the wider world: the tar that every navy needs, the furs that every court desires, the timber that builds the ships of nations?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_fin.1.a: "Nous sommes la terre elle-même. Laissons les envahisseurs s’abattre sur nos forêts."
 nd_fin.1.b: "Notre richesse circule à travers nos rivières et nos forêts vers le monde."
 nd_fin.2.t: "Le père des lettres finlandaises"
 nd_fin.2.d: "Mikael Agricola, évêque de Turku et élève de Martin Luther lui-même, a achevé l'œuvre de sa vie : la traduction du Nouveau Testament en finnois. Pour la première fois, la langue finnoise existe sous forme écrite. Son Abckiria a enseigné les lettres à notre peuple, sa Rucouskiria leur a donné des prières dans leur propre langue, et maintenant Se Wsi Testamenti apporte la parole de Dieu à chaque congrégation de langue finnoise. C’est plus qu’une réussite religieuse ; c’est la naissance de l’alphabétisation finlandaise, la base sur laquelle reposera tout apprentissage futur. Agricola a donné au peuple finlandais une voix qui peut perdurer à travers les siècles."
 nd_fin.2.a: "Laissez le travail d'Agricola éclairer l'esprit de tous les Finlandais."
 nd_fin.2.b: "Une langue écrite forge l'identité d'un peuple."
 nd_fin.3.t: "Après la grande colère"
 nd_fin.3.d: "Les années d’occupation russe (l’Isoviha, la Grande Colère) sont enfin terminées. Le bilan est catastrophique : des milliers de personnes déportées pour construire Saint-Pétersbourg, des villages finlandais incendiés, des femmes et des enfants emmenés en captivité. Rien qu'en Ostrobotnie, la moitié de la population a péri ou a fui. Mais la Finlande survit. Les fermes incendiées peuvent être reconstruites, les forêts replantées, la population se rétablit lentement. La question est de savoir comment faire face à cette reprise. Devons-nous nous endurcir contre une future invasion, en renforçant notre force militaire afin qu’une telle dévastation ne se reproduise plus jamais ? Ou devons-nous nous concentrer sur la reconstruction de ce qui a été perdu, sur le rétablissement de la stabilité, sur la croissance de notre population et sur la guérison des blessures de l’occupation ?"
 nd_fin.3.a: "Jamais plus. Nous devons être suffisamment forts pour résister à tout envahisseur."
 nd_fin.3.b: "Nous ne serons plus jamais conquis aussi facilement."
 nd_fin.4.t: "Le réveil national finlandais"
 nd_fin.4.d: "Un nouvel esprit s’empare de la Finlande. Les érudits, les poètes et les patriotes ont commencé à exprimer ce que signifie être finlandais, non pas en tant que sujets d’une plus grande puissance, mais en tant que peuple ayant sa propre langue, ses propres traditions, son propre destin. Le Kalevala, compilé à partir de poésie orale ancienne, a donné au peuple finlandais une épopée qui rivalise avec Homère. La langue finnoise, autrefois considérée comme une langue paysanne, trouve désormais sa voix dans la littérature, la science et la gouvernance. Les journaux finlandais ont diffusé des idées de conscience nationale aux quatre coins du pays. Ce réveil n’est pas né de la révolution mais de la culture : la conviction tranquille qu’un peuple qui partage une langue, un paysage et une histoire mérite de façonner son propre avenir."
 nd_fin.4.a: "La Finlande trouvera sa voix."
 nd_fin_rajakartano: "Rajakartano"
 nd_fin_rajakartano_desc: "Des manoirs frontaliers fortifiés servant d'avant-postes militaires et de centres administratifs le long de la frontière finlandaise, leurs garnisons constituant la première ligne de défense contre les pillards de l'Est."
 nd_fin_rajasotilaat: "Soldats frontaliers"
 nd_fin_rajasotilaat_desc: "La frontière orientale a engendré une tradition guerrière distinctive. Les soldats frontaliers finlandais ont appris à combattre dans des forêts denses et des terrains gelés, développant des tactiques défensives exploitant le paysage contre des ennemis numériquement supérieurs."
 nd_fin_kaskiviljely: "Kaskiviljely"
 nd_fin_kaskiviljely_desc: "La technique finlandaise de l'agriculture sur brûlis a transformé les forêts denses de pins et d'épicéas en terres cultivées fertiles. Même si les champs n'ont duré que quelques années, les rendements ont été extraordinaires, allant jusqu'à cent fois le rendement des semences."
 nd_fin_turkiskauppa: "Turkiskauppa"
 nd_fin_turkiskauppa_desc: "Les vastes forêts de Finlande regorgeaient d'animaux à fourrure et le commerce des fourrures reliait même les colonies finlandaises les plus reculées aux marchés européens. Le mot finlandais « raha », qui signifie argent, signifiait à l'origine « peau de fourrure »."
 nd_fin_frontier_resilience: "Résilience aux frontières"
 nd_fin_frontier_resilience_desc: "La vie à la frontière orientale a forgé un caractère finlandais unique : la capacité d'endurer les épreuves, de s'adapter à l'adversité et de lutter avec ténacité pour défendre son foyer et son foyer."
 nd_fin_savusauna: "Tradition Savusauna"
 nd_fin_savusauna_desc: "Le sauna à fumée est le cœur de la vie communautaire finlandaise. Plus qu'un simple bain, le sauna servait de lieu de naissance, de maison de guérison et d'espace sacré : la pièce la plus propre de toutes les colonies finlandaises."
 nd_fin_erametsastajat: "Ermetsstjt"
 nd_fin_erametsastajat_desc: "Les chasseurs finlandais parcouraient les vastes forêts intérieures, traquant le gibier et se protégeant contre les intrus. Leur connaissance approfondie du terrain les rendait inestimables en tant qu'éclaireurs et tirailleurs."
 nd_fin_kirkkotraditio: "Tradition de l'Église finlandaise"
 nd_fin_kirkkotraditio_desc: "L'Église finlandaise a développé son propre caractère au sein du monde chrétien plus large, les églises paroissiales servant de centres à la fois de vie spirituelle et de gouvernance communautaire dans les colonies finlandaises dispersées."
 nd_fin_kauppakonttori: "Tradition Kauppakonttori"
 nd_fin_kauppakonttori_desc: "Les comptoirs commerciaux finlandais reliaient les ressources de l'intérieur (fourrures, goudron, bois) aux réseaux commerciaux hanséatiques de la Baltique, apportant des marchandises et des idées européennes même dans les villes finlandaises les plus reculées."
 nd_fin_linnarakennus: "Tradition de construction de châteaux"
 nd_fin_linnarakennus_desc: "Les grands châteaux de Turku et Hme ont ancré le contrôle suédo-finlandais sur la région, servant de centres administratifs et de bastions militaires qui projetaient leur autorité à travers la nature finlandaise."
 nd_fin_tervanpolttaja: "Tradition de Tervanpolttaja"
 nd_fin_tervanpolttaja_desc: "Les fours à goudron finlandais transformèrent les forêts de pins d'Ostrobotnie en réserves navales qui scellaient les coques des flottes européennes. Au XVIIe siècle, la Finlande produisait plus de 80 % de toutes les exportations suédoises de goudron."
 nd_fin_tervakauppa: "Tervakauppa"
 nd_fin_tervakauppa_desc: "Le commerce du goudron reliait les producteurs finlandais aux grands centres de construction navale d'Europe. Les Pays-Bas consommaient à eux seuls les trois quarts de la production finlandaise de goudron, et ce commerce apportait une richesse sans précédent aux villes côtières d'Oulu et de Kokkola."
 nd_fin_agricola: "Le travail de Mikael Agricola"
 nd_fin_agricola_desc: "Mikael Agricola, évêque de Turku, a créé la langue finnoise écrite et traduit le Nouveau Testament en finnois en 1548, jetant ainsi les bases de l'alphabétisation et de l'identité culturelle finlandaise."
 nd_fin_olavinlinna: "Tradition d'Olavinlinna"
 nd_fin_olavinlinna_desc: "La forteresse d'Olavinlinna, le château de Saint-Olaf, est la forteresse médiévale en pierre la plus septentrionale du monde, construite pour garder la frontière contestée entre la Suède, la Finlande et Novgorod."
 nd_fin_rajapuolustus: "Rajapulustus"
 nd_fin_rajapuolustus_desc: "La défense organisée de la frontière finlandaise a évolué de garnisons de manoirs dispersées à une défense systématique de la frontière, avec des troupes disciplinées entraînées à exploiter les forêts et les voies navigables des régions frontalières."
 nd_fin_talvisoturi: "Talvisoturi"
 nd_fin_talvisoturi_desc: "Les rudes hivers finlandais engendrent des guerriers qui ne ressemblent à aucun autre en Europe. Les soldats hivernaux se déplacent à skis dans la neige profonde, combattent dans des conditions qui paralysent les armées conventionnelles et utilisent le paysage gelé lui-même comme une arme."
 nd_fin_uskonpuhdistus: "Réforme finlandaise"
 nd_fin_uskonpuhdistus_desc: "La Réforme atteint la Finlande grâce à Mikael Agricola et d'autres étudiants de Luther. Contrairement à de nombreux pays européens, la Réforme finlandaise a été pacifique : une transformation progressive qui a apporté l'alphabétisation, l'éducation et le renouveau religieux."
 nd_fin_talonpoikaisarmeija: "Talonpoikaisarmeija"
 nd_fin_talonpoikaisarmeija_desc: "Les paysans guerriers finlandais ont combattu dans tous les conflits à la frontière orientale. Endurcis par l’agriculture dans les conditions les plus difficiles d’Europe, ils apportent la même endurance obstinée sur le champ de bataille."
 nd_fin_pohjanmaan_kauppa: "Réseau commercial Ostrobothnien"
 nd_fin_pohjanmaan_kauppa_desc: "Les marchands d'Ostrobotnie ont construit un réseau commercial qui reliait le goudron, le bois et les fourrures finlandais aux marchés européens, faisant des villes côtières d'Oulu, Kokkola et Vaasa des centres commerciaux prospères."
 nd_fin_sahalaitos: "Tradition Sahalaitos"
 nd_fin_sahalaitos_desc: "Le développement des scieries actionnées par l'eau a transformé l'industrie du bois finlandaise. Le bois scié pourrait être exporté en quantités bien plus importantes que les grumes brutes, transformant ainsi les interminables forêts finlandaises en une source de richesse industrielle."
 nd_fin_merilinnoitus: "Tradition Merilinnoitus"
 nd_fin_merilinnoitus_desc: "La grande forteresse maritime gardant le port d'Helsinki, construite sur une chaîne d'îles à l'entrée du port, représente le sommet de la défense côtière finlandaise, combinant puissance navale et fortification imprenable."
 nd_fin_isonvihan_toipuminen: "Récupération de la Grande Colère"
 nd_fin_isonvihan_toipuminen_desc: "La catastrophique occupation russe de 1714-1721 a dévasté la Finlande, des provinces entières ont été dépeuplées et des milliers de personnes ont été déportées pour construire Saint-Pétersbourg. La reprise a pris des décennies, mais a forgé un peuple d’une extraordinaire résilience."
 nd_fin_rajahallinnan_uudistus: "Réforme de l'administration des frontières"
 nd_fin_rajahallinnan_uudistus_desc: "La modernisation de l'administration des frontières finlandaise a apporté une gouvernance efficace même dans les districts les plus reculés, remplaçant la défense ponctuelle des frontières par une gestion provinciale systématique."
 nd_fin_puutavaravienti: "Puutavaravienti"
 nd_fin_puutavaravienti_desc: "Les exportations finlandaises de bois d'œuvre ont connu une croissance spectaculaire au XVIIIe siècle, à mesure que l'industrie du sciage se développait. Le bois transformé, les approvisionnements navals et le goudron affluaient des ports finlandais vers les chantiers navals et les chantiers de construction d'Europe."
 nd_fin_jaakarit: "Jkrit"
 nd_fin_jaakarit_desc: "Les Jaegers finlandais, spécialistes de l'infanterie légère formés aux tactiques d'escarmouche indépendantes, tireurs d'élite experts qui combattent en petites unités sur des terrains difficiles. Leur maîtrise de la guerre forestière en fait des troupes d'élite."
 nd_fin_kansallisheratys: "Réveil national finlandais"
 nd_fin_kansallisheratys_desc: "La compilation du Kalevala à partir de poésie orale ancienne, l'essor de la littérature de langue finnoise et la diffusion de la conscience nationale à travers les journaux et l'éducation ont transformé l'identité finlandaise d'un dialecte régional en une culture nationale."
 nd_fin_ruukki: "Tradition Ruukki"
 nd_fin_ruukki_desc: "Les usines sidérurgiques finlandaises, ruukit, combinaient les riches gisements de minerai de fer du pays avec l'abondance de charbon de bois provenant des forêts pour produire du fer de haute qualité. Ces premiers établissements industriels ont jeté les bases de la fabrication finlandaise."
 nd_fin_sisu: "Sisu"
 nd_fin_sisu_desc: "Sisu : le concept finlandais de détermination, de courage et de résilience extraordinaires face à une adversité écrasante. Il ne s’agit pas d’un simple entêtement, mais d’un profond caractère national forgé par des siècles de difficultés frontalières."
 a_nd_fin_rajasotilaat: "Rajasotilaat"
 a_nd_fin_rajasotilaat_desc: "Soldats frontaliers finlandais, infanterie frontalière robuste entraînée pour défendre les frontières orientales par des embuscades, des fortifications et une résistance obstinée dans les forêts et les marais."
 a_nd_fin_erametsastajat: "Ermetsstjt"
 a_nd_fin_erametsastajat_desc: "Finnish wilderness hunters, woodsmen-scouts who know every trail, lake, and hiding place in the vast interior forests. They move fast, strike first from concealment, and vanish into the trees sooner than stand against a charge."
 a_nd_fin_rajapuolustaja: "Rajapulustajat"
 a_nd_fin_rajapuolustaja_desc: "Les défenseurs des frontières finlandaises sont des troupes de garnison organisées qui combinent la discipline du brochet avec les instincts défensifs engendrés par des générations de guerres frontalières."
 a_nd_fin_talvisoturi: "Talvisoturit"
 a_nd_fin_talvisoturi_desc: "Guerriers d'élite finlandais de l'hiver, infanterie adaptée pour combattre dans les conditions les plus difficiles, exploitant la neige, la glace et les terrains gelés pour neutraliser la supériorité numérique."
 a_nd_fin_talonpoikaissoturi: "Talonpoikaissoturit"
 a_nd_fin_talonpoikaissoturi_desc: "Des paysans guerriers finlandais, des agriculteurs qui prennent les armes lorsque la frontière est menacée, apportant au combat la même endurance inébranlable qui les soutient pendant les hivers nordiques."
 a_nd_fin_jaakari: "Jkrit"
 a_nd_fin_jaakari_desc: "Jaegers finlandais, infanterie légère d'élite entraînée aux tactiques d'escarmouche indépendantes. Tireurs d'élite experts combattant en petits détachements, ils excellent dans la guerre forestière et les combats irréguliers."
 nd_fin_tar_processing: "Traitement du goudron finlandais"
 nd_fin_tar_processing_desc: "Transformation du goudron et du bois de pin finlandais en magasins navals, barils scellés par corde, poix de calfeutrage et fournitures de gréement pour les chantiers navals européens."
 nd_fin_lumber_export: "Exportation de bois finlandais"
 nd_fin_lumber_export_desc: "Deals, masts and spars sawn for the export trade and tarred for the voyage to the shipyards of Europe."
 nd_fin_rajakartano_upkeep: "Entretien du manoir frontalier"
 nd_fin_rajakartano_upkeep_desc: "Entretenir la garnison, l'armurerie et les ouvrages défensifs d'un manoir frontalier fortifié, le bois pour les réparations, la pierre pour les fortifications, l'armement pour la garnison."
 nd_fin_savusauna_upkeep: "Entretien du sauna"
 nd_fin_savusauna_upkeep_desc: "Keeping the traditional smoke sauna operational: timber for fuel, clay to mend the hearth, and fresh stones for the kiuas when the old ones crack."
 nd_fin_kauppakonttori_upkeep: "Entretien du poste de traite"
 nd_fin_kauppakonttori_upkeep_desc: "Exploitation d'un poste de traite finlandais, gestion des stocks de fourrures et de marchandises."
 nd_fin_tervanpolttaja_upkeep: "Opérations du four à goudron"
 nd_fin_tervanpolttaja_upkeep_desc: "Brûler du bois de cœur de pin dans des fours en terre pour produire du goudron, le produit forestier le plus précieux de Finlande."
 nd_fin_sahalaitos_upkeep: "Opérations de scierie"
 nd_fin_sahalaitos_upkeep_desc: "Couper du bois finlandais en planches, en mâts et en bois de qualité navale pour l'exportation vers les chantiers navals européens."
 nd_fin_merilinnoitus_upkeep: "Entretien de la forteresse maritime"
 nd_fin_merilinnoitus_upkeep_desc: "Entretenir les massives fortifications en pierre, les emplacements de canons et les défenses portuaires d'une forteresse côtière."
 nd_fin_ruukki_upkeep: "Opérations sidérurgiques"
 nd_fin_ruukki_upkeep_desc: "Fusion du fer avec du charbon de bois pour forger des outils, des clous et des outils agricoles dans les usines sidérurgiques finlandaises."
 STATIC_MODIFIER_NAME_nd_fin_nation_building: "Construction de la nation"
 STATIC_MODIFIER_DESC_nd_fin_nation_building: "Une langue écrite est le fondement d'une nation. Le travail d'Agricola crée une identité finlandaise qui transcende les dialectes régionaux et les frontières tribales, forgeant ainsi un peuple."
 STATIC_MODIFIER_NAME_nd_fin_national_resolve: "Résolution nationale"
 STATIC_MODIFIER_DESC_nd_fin_national_resolve: "Le traumatisme de la Grande Colère a renforcé la détermination de la Finlande. Les peuples qui ont enduré l’occupation, la déportation et la dévastation en ressortent déterminés à ce qu’aucun futur envahisseur ne les trouve au dépourvu."
 nd_fin_formed_tt: "La Finlande a été formée"
 nd_fin_path_a_tt: "Choisissez le pays des mille lacs"
 nd_fin_path_b_tt: "Choisissez les voies commerciales du Nord"
 nd_fin_dest_vyborg_developed_tt: "We own #bold Viborg#! and its development is at least #bold 22#!"
 nd_fin_dest_helsinge_developed_tt: "We own #bold Helsinge#! and its development is at least #bold 26#!"
 nd_fin_dest_uleaborg_developed_tt: "We own #bold Uleåborg#! and its development is at least #bold 18#!"
 nd_fin_dest_abo_developed_tt: "We own #bold Åbo#! and its development is at least #bold 27#!"
 nd_fin_dest_border_manors_tt: "At least #bold 3#! of our locations have a #bold Rajakartano#!"
 nd_fin_destiny: "Destin finlandais"
 nd_fin_destiny_desc: "La Finlande est devenue une nation souveraine. La voie à suivre sera façonnée par les choix que nous ferons, que nous construisions une forteresse nord imprenable ou une puissance commerciale balte prospère."
 nd_fin_dest_karelian_march: "La marche carélienne"
 nd_fin_dest_karelian_march_desc: "Secure the ancient fortress of Korela and establish Finnish control over the Karelian borderlands. Raise three border manors to hold the eastern frontier."
 nd_fin_dest_shield_of_north: "Bouclier du Nord"
 nd_fin_dest_shield_of_north_desc: "Push deeper into Karelia, securing Olonets and Pryazha in the Aunus lands. Professionalize the army and build Viborg, the castle town of the eastern border, up into a bulwark."
 nd_fin_dest_unconquerable: "La Finlande invincible"
 nd_fin_dest_unconquerable_desc: "Control the Neva River and the fortresses of Narva and Koporye, and raise Helsinge into a fortress harbour twice the place it was, sealing Finland's dominance over the eastern Baltic approaches. No army shall pass through Finnish lands without our leave."
 nd_fin_dest_ostrobothnian_wealth: "Richesse Ostrobothnienne"
 nd_fin_dest_ostrobothnian_wealth_desc: "Établir le goudron comme fondement du commerce finlandais. Remplissez le trésor en exportant les richesses forestières finlandaises vers les marchés européens."
 nd_fin_dest_baltic_tar_kings: "Rois du goudron de la Baltique"
 nd_fin_dest_baltic_tar_kings_desc: "Make Uleåborg the tar harbour of the north and dominate the northern Baltic tar trade. Develop banking institutions to finance the expansion of Finnish commercial networks."
 nd_fin_dest_northern_empire: "Empire commercial du Nord"
 nd_fin_dest_northern_empire_desc: "Take Tallinn and command the Baltic trade routes. Embrace global trade and build Åbo into the mercantile heart of the northern seas, twice the town it was."
 nd_fin.5.t: "Le destin finlandais"
 nd_fin.5.d: "La Finlande est unie et stable : une nation de forêts, de lacs et de détermination de fer. La question de ce que nous deviendrons n’est plus abstraite. Nos choix façonneront le Nord pendant des siècles."
 nd_fin.5.a: "Notre destin est entre nos mains."
 nd_fin.6.t: "La marche carélienne"
 nd_fin.6.d: "La forteresse de Korela est tombée sous contrôle finlandais. Pendant des siècles, cette ancienne forteresse a gardé la frontière entre l'Est et l'Ouest, aujourd'hui elle protège la Finlande. Nos soldats patrouillent dans les forêts caréliennes et la frontière orientale est à nous de défendre. La marche vers la Carélie a commencé."
 nd_fin.6.a: "La Carélie est le bouclier de la Finlande."
 nd_fin.7.t: "Bouclier du Nord"
 nd_fin.7.d: "Finnish arms have pushed deep into Karelia. The lands of Aunus, once beyond our reach, now fly the Finnish banner. Our professional army patrols a frontier that stretches from the frozen north to the shores of Lake Ladoga, and behind it Viborg has been built up into the bulwark of the border. The question now is how we consolidate these gains. Do we fortify every pass and ford, turning Karelia into an impenetrable defensive zone? Or do we focus on integrating the Karelian peoples, making them Finnish in heart as well as in law?"
 nd_fin.7.a: "Renforcez chaque approche. Ne laissez passer aucune armée."
 nd_fin.7.b: "Ces Caréliens sont nos parents. Qu'ils soient Finlandais."
 nd_fin.8.t: "La Finlande invincible"
 nd_fin.8.d: "The Neva River and the fortress of Narva are in Finnish hands, and a sea fortress guards the grown harbour of Helsinge. No power can approach Finland from the east without passing through territory we command, and no Baltic fleet can operate without Finnish acquiescence. Finland has achieved what few believed possible: a northern nation, born of forests and lakes, now stands as an impregnable power that no invader can subdue. How shall we wield this strength? Through the perfection of winter warfare, making our armies the most feared in the north? Or through the quiet authority of a nation that cannot be conquered, projecting power through the sheer impossibility of our defeat?"
 nd_fin.8.a: "Nos hivers seront notre arme."
 nd_fin.8.b: "Faites-le savoir au monde : la Finlande ne peut pas être brisée."
 nd_fin.9.t: "Richesse Ostrobothnienne"
 nd_fin.9.d: "Le goudron finlandais circule sur les marchés européens. Des fours d'Ostrobotnie aux chantiers navals d'Amsterdam et de Londres, nos richesses forestières sont devenues indispensables. Le trésor se gonfle des bénéfices de ce commerce, et les marchands finlandais parlent avec une autorité croissante dans les comptoirs de la Baltique."
 nd_fin.9.a: "Nos forêts sont notre fortune."
 nd_fin.10.t: "Rois du goudron de la Baltique"
 nd_fin.10.d: "Uleåborg has grown into the tar harbour of the north, and with it we hold the heart of the northern tar trade. Finnish bankers finance the expansion of our commercial networks, and no ship sails the Baltic without Finnish tar in its hull. We have become the tar kings of the north. The question is how to build on this dominance. Shall we expand our trade fleet, projecting Finnish commercial power across the seas? Or shall we invest in developing the Finnish interior, turning raw wealth into lasting prosperity?"
 nd_fin.10.a: "Construisez des navires. Que le drapeau finlandais flotte dans tous les ports."
 nd_fin.10.b: "Investissez dans notre terre. La vraie richesse vient de l’intérieur."
 nd_fin.11.t: "Empire commercial du Nord"
 nd_fin.11.d: "Tallinn has fallen into Finnish hands, and with it command of the Baltic trade routes. Finnish merchants dominate the commerce of the north: tar, timber, furs, and iron flow through our markets to every corner of Europe. From a frontier at the edge of civilization, Finland has become the mercantile heart of the northern seas, and Åbo is twice the town it was. Shall we use this power to build diplomatic influence, making Finland the indispensable partner of every trading nation? Or shall we turn inward, using our commercial wealth to pioneer industrial development and modernize our nation?"
 nd_fin.11.a: "La Finlande sera le marchand du Nord."
 nd_fin.11.b: "Le commerce finance l’avenir. Investissez dans l’industrie."
 STATIC_MODIFIER_NAME_nd_fin_dest_fortify_frontier: "Frontière Fortifiée"
 STATIC_MODIFIER_DESC_nd_fin_dest_fortify_frontier: "Chaque col, gué et sentier forestier de Carélie a été cartographié, fortifié et mis en garnison. La frontière orientale est une zone défensive impénétrable, même si l’accent mis sur la préparation militaire a tiré des ressources du commerce."
 STATIC_MODIFIER_NAME_nd_fin_dest_karelian_integration: "Intégration carélienne"
 STATIC_MODIFIER_DESC_nd_fin_dest_karelian_integration: "Les peuples caréliens sont accueillis comme des compatriotes finlandais, partageant une langue, une foi partagée et un destin partagé. Les administrateurs finlandais apportent de l'ordre et des opportunités aux nouvelles provinces."
 STATIC_MODIFIER_NAME_nd_fin_dest_winter_doctrine: "Doctrine de guerre hivernale"
 STATIC_MODIFIER_DESC_nd_fin_dest_winter_doctrine: "Les armées finlandaises ont perfectionné l'art de la guerre hivernale, un renforcement rapide sur des terrains gelés, une endurance implacable dans des conditions qui brisent les autres armées et un esprit combatif forgé au cours des hivers les plus rigoureux d'Europe. L’état de préparation navale se détériore à mesure que les ressources sont affectées aux forces terrestres."
 STATIC_MODIFIER_NAME_nd_fin_dest_invincible_frontier: "Frontière invincible"
 STATIC_MODIFIER_DESC_nd_fin_dest_invincible_frontier: "La réputation de la Finlande en tant que nation invincible projette sa puissance sans que l'épée ne soit tirée. L'autorité de la couronne est renforcée par la fierté nationale et la position diplomatique de la Finlande se renforce de plus en plus."
 STATIC_MODIFIER_NAME_nd_fin_dest_trade_fleet: "Flotte commerciale finlandaise"
 STATIC_MODIFIER_DESC_nd_fin_dest_trade_fleet: "Une flotte croissante de navires marchands finlandais transporte du goudron, du bois et des fourrures vers tous les ports de la Baltique. Les marins affluent vers les villes côtières, même si les traditions de cavalerie de l'intérieur ont été négligées."
 STATIC_MODIFIER_NAME_nd_fin_dest_develop_interior: "Aménagement intérieur"
 STATIC_MODIFIER_DESC_nd_fin_dest_develop_interior: "Les investissements affluent vers l’intérieur de la Finlande, vers de nouvelles routes, une administration réformée et des institutions bancaires qui canalisent la richesse commerciale vers un développement durable. Une croissance rapide entraîne une certaine pression inflationniste."
 STATIC_MODIFIER_NAME_nd_fin_dest_mercantile_dominion: "Domination marchande"
 STATIC_MODIFIER_DESC_nd_fin_dest_mercantile_dominion: "Le réseau commercial finlandais s'étend sur la Baltique et au-delà. Les marchands finlandais sont les bienvenus dans tous les ports, les réseaux de renseignement finlandais cartographient chaque marché et les navires finlandais appliquent des conditions commerciales favorables."
 STATIC_MODIFIER_NAME_nd_fin_dest_industrial_pioneer: "Pionnier industriel"
 STATIC_MODIFIER_DESC_nd_fin_dest_industrial_pioneer: "La richesse commerciale finance un programme de modernisation et d’industrialisation. Les divers peuples de Finlande sont unis par la prospérité, et la légitimité de la domination finlandaise grandit à chaque nouvelle entreprise."
 nd_fin_talvitukikohta: "Talvitukikohta"
 nd_fin_talvitukikohta_desc: "Une base de guerre hivernale fortifiée conçue pour soutenir les opérations militaires au plus profond de l'intérieur finlandais. Des murs épais en rondins, des casernes chauffées et des dépôts de ravitaillement dissimulés permettent aux armées finlandaises d'opérer dans des conditions qui paralysent tout envahisseur."
 nd_fin_talvitukikohta_upkeep: "Entretien de la forteresse hivernale"
 nd_fin_talvitukikohta_upkeep_desc: "Entretenir les casernes chauffées d'une forteresse d'hiver, les ouvrages défensifs et les caches de ravitaillement dissimulées, le bois de construction et le chauffage, la pierre pour les fortifications, les armes pour la garnison."
 nd_fin_pohjolan_kauppahalli: "Pohjolan Kauppahalli"
 nd_fin_pohjolan_kauppahalli_desc: "Une grande salle de commerce du nord où les marchands finlandais font des affaires avec des commerçants de toute l'Europe. Des entrepôts de goudron et de bois, des salles de comptage pour les banquiers et des halls où les accords commerciaux façonnent l'économie de la Baltique."
 nd_fin_pohjolan_kauppahalli_upkeep: "Entretien de la salle des marchés"
 nd_fin_pohjolan_kauppahalli_upkeep_desc: "Exploitation d'une grande salle de commerce, tissu pour l'ameublement, papier pour les registres et les contrats, mobilier pour les salles de comptage et les salles de réunion."
 fin_haradshovding_ting_bureaucracy: "Hradshvding Ting"
 fin_haradshovding_ting_bureaucracy_desc: "Le tribunal médiéval suédo-finlandais des cent, où le juge de district (hradshvding) présidait une cour d'assises aux côtés de douze juges agricoles non professionnels issus des cent environnants. La constitution de 1634 comptait la Finlande parmi les retardataires du royaume ; dans la pratique, l'institution était encore plus ancienne, les conflits ruraux étant réglés de manière saisonnière et où au moins sept juges non professionnels devaient être présents pour exercer leur compétence. Le ting était le fondement de l’autonomie finlandaise en vertu de la loi suédoise."
 fin_abo_bishopric_bureaucracy: "Évêché de bo"
 fin_abo_bishopric_bureaucracy_desc: "Le diocèse de Turku (bo), mentionné pour la première fois en 1259, couvrait toute la Finlande médiévale et répondait au siège archiépiscopal d'Uppsala. Jusqu'à la fin du XIIIe siècle, l'évêque était de facto le dirigeant laïc de la Finlande ; par la suite, le chapitre de la cathédrale de Bo, le couvent dominicain fondé en 1249 et un réseau paroissial qui faisait également office d'administration locale ont fait de l'église l'institution centrale du royaume. Le premier évêque finlandais d'origine fut nommé en 1291 ; par la suite, tous les titulaires étaient d'origine finlandaise."
 fin_hakkapeliitta_levy_bureaucracy: "Rusthåll"
 fin_hakkapeliitta_levy_bureaucracy_desc: "The cavalry farms of Finland. A farmstead wealthy enough to keep a horse and an armed rider for the crown was freed of its land tax in return, and its master answered for man, mount and gear at the yearly muster. The bargain was older than the regiments it filled, and the allotment system of Charles XI fixed it in the 1680s as the rusthåll, which the Finns called rustholli. The riders became famous. The farms that mounted them were an office of the crown: a register, an inspection and a tax ledger."
 fin_birkarl_lapptribute_bureaucracy: "Hommage à Birkarl Lapp"
 fin_birkarl_lapptribute_bureaucracy_desc: "Les pirkkalaiset, marchands titulaires d'une licence royale des vallées de Tornio, Lule et Pite, qui, du XIIIe au XVIIe siècle, détenaient des droits de monopole sur le commerce et l'extraction des impôts auprès des Sami de Lappmarken. Chaque vallée fluviale constituait un lapon distinct avec ses propres birkarls ; la couronne reçut sa part, les birkarls devinrent riches et les Sami furent enfermés dans une relation coloniale qui ne prit fin que lorsque les trois villes fluviales reçurent leurs chartes de ville de 1621 et que l'État prit directement le relais."
 AUTO_MODIFIER_NAME_nd_fin_bureaucracy_authority: "Domaines administratifs finlandais"
 AUTO_MODIFIER_DESC_nd_fin_bureaucracy_authority: "Finland inherits the institutional apparatus that Swedish rule built into its territory: the ting, the bishopric, the cavalry farms, and the trade-and-tribute network of the north. It can sustain two of these institutions."
