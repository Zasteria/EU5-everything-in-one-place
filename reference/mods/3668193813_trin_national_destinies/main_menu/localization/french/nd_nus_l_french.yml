l_french:
 STATIC_MODIFIER_NAME_nd_nus_mandala_thalassocracy: "Mandala Thalassocratie"
 STATIC_MODIFIER_DESC_nd_nus_mandala_thalassocracy: "Nusantara règne comme un mandala maritime, des anneaux concentriques de souveraineté s'étendant de Java sacré à travers dix mille îles, chaque vassal étant lié par le commerce et le tribut au centre."
 STATIC_MODIFIER_NAME_nd_nus_spice_archipelago: "Archipel des épices"
 STATIC_MODIFIER_DESC_nd_nus_spice_archipelago: "Les clous de girofle de Ternate, la muscade de Banda, le poivre de Banten, Nusantara contrôle les sources des marchandises les plus convoitées au monde, et chaque navire marchand qui traverse ces eaux enrichit l'archipel."
 nd_nus.1.t: "L'unification de Nusantara"
 nd_nus.1.d: "The dream of Gajah Mada is realized anew. From the rice paddies of Java to the spice groves of the Moluccas, from the trading ports of Sumatra to the shores of Sulawesi, the scattered islands of the archipelago answer to a single authority. The concept of Nusantara, the entirety of the island realm between the seas, is no longer a poet's vision but a political reality.\n\nBut what kind of realm shall this be? The archipelago's power can be projected outward through fleets that command every strait and sea lane, binding vassals through maritime supremacy as Srivijaya once did. Or it can be turned inward, cultivating the extraordinary wealth that flows from controlling the source of the world's most precious spices, making Nusantara not a conqueror of seas, but an indispensable marketplace that the whole world must court.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_nus.1.a: "Nos flottes commanderont chaque détroit"
 nd_nus.1.b: "Le monde viendra à nous pour du piquant"
 nd_nus.2.t: "L'âge d'or de Majapahit"
 nd_nus.2.d: "In the year 1365, the court poet Prapanca composed the Nagarakretagama, describing a realm that stretched from Sumatra to Papua, from Borneo to Bali. At its center sat King Hayam Wuruk in the capital of Trowulan, a city of canals and temples, of red brick candi rising above the rice plains of eastern Java.\n\nBut the true architect of this empire was the Mahapatih Gajah Mada, who swore the legendary Palapa Oath: he would not taste spice until the entire archipelago was united under Majapahit's banner. Through a combination of military campaigns, diplomatic marriages, and trade alliances, he made good on his word. The question now is whether to follow his path of conquest outward, or to perfect the civilization he built at home."
 nd_nus.2.a: "Nous honorons le serment de Gajah Mada ; l'archipel nous appartient de droit"
 nd_nus.2.b: "Trowulan éclipsera toutes les capitales du monde"
 STATIC_MODIFIER_NAME_nd_nus_oath_of_gajah_mada: "Serment de Gajah Mada"
 STATIC_MODIFIER_DESC_nd_nus_oath_of_gajah_mada: "Tout comme Gajah Mada a autrefois juré d'unir tous les Nusantara sous une seule bannière, le royaume poursuit désormais la réalisation de sa vision par la force militaire et la juste conquête."
 STATIC_MODIFIER_NAME_nd_nus_trowulan_splendor: "Splendeur de Trowulan"
 STATIC_MODIFIER_DESC_nd_nus_trowulan_splendor: "La capitale flamboie avec la grandeur de briques rouges d'une centaine de temples candi. Poètes, architectes et érudits se réunissent dans une cour qui rivalise avec toutes celles du monde connu."
 nd_nus.3.t: "Siège de Batavia par le sultan Agung"
 nd_nus.3.d: "In 1628, Sultan Agung of Mataram assembled the largest Javanese army in living memory and marched on Batavia, the fortified trading post of the VOC that had planted itself uninvited on the north coast of Java. His forces numbered in the tens of thousands, supported by war elephants and bronze cetbang cannon. The siege was a titanic clash between Javanese sovereignty and European commercial imperialism.\n\nThough the first siege failed due to supply difficulties and Dutch naval superiority, Agung launched a second attempt in 1629, this time attempting to establish rice granaries along the route. The campaigns revealed both the military potential and the logistical challenges of resisting a naval power from a land base. Agung's legacy endures: he proved that Nusantara would not submit without a fight."
 nd_nus.3.a: "Nous tirerons les leçons des campagnes d'Agung et frapperons plus fort"
 nd_nus.3.b: "Agung a eu la sagesse de se fortifier. Ne laissez aucun envahisseur s'emparer de notre sol"
 STATIC_MODIFIER_NAME_nd_nus_agung_military_reform: "La réforme militaire d'Agung"
 STATIC_MODIFIER_DESC_nd_nus_agung_military_reform: "Les campagnes du sultan Agung contre Batavia ont démontré que la défense de Nusantara exige une capacité offensive : la capacité de projeter une force, de soutenir des sièges et de chasser les intrus étrangers de l'archipel."
 STATIC_MODIFIER_NAME_nd_nus_agung_consolidation: "La consolidation d'Agung"
 STATIC_MODIFIER_DESC_nd_nus_agung_consolidation: "La leçon de Batavia n’est pas que le siège a échoué, mais qu’aucune forteresse étrangère n’aurait dû être autorisée à s’élever en premier lieu. Chaque côte doit être surveillée, chaque approche défendue, chaque envahisseur saigné par l'attrition."
 nd_nus.4.t: "Maîtres du commerce des épices"
 nd_nus.4.d: "For centuries, the tiny volcanic islands of the Moluccas produced the only cloves and nutmeg in the world. The Banda Islands, barely visible specks in the vast ocean, supplied every grain of mace and nutmeg consumed from China to Venice. And it was the merchants and sultans of Nusantara who controlled the first and most profitable links in this chain, buying from growers, storing in great gudang warehouses, and selling to Arab, Indian, and Chinese traders at enormous markup.\n\nNow this monopoly has been consolidated under a single political authority. Where once a dozen competing sultanates undercut each other, Nusantara speaks with one voice and sets one price. The world has no choice but to pay it."
 nd_nus.4.a: "L'épice doit couler, par nos seules mains"
 nd_nus.5.t: "L'éveil Nusantara"
 nd_nus.5.d: "From Aceh to Papua, from the mountains of Sumatra to the spice groves of Ternate, a new idea takes hold: that the archipelago is not merely a collection of kingdoms and sultanates, but a single civilization bound by shared seas, interwoven trade, and centuries of cultural exchange. Javanese, Sundanese, Malay, Bugis, Balinese, Moluccan: the peoples of the islands are many, but the ocean that connects them is one.\n\nThis is the awakening of Nusantara consciousness, the realization that unity does not require uniformity, that a thousand islands can share a single destiny without abandoning their distinct identities. Gotong royong, the ancient tradition of communal labor and mutual aid, becomes the philosophical foundation of a modern state."
 nd_nus.5.a: "Bhinneka Tunggal Ika, l'unité dans la diversité"
 nd_nus_srivijaya_legacy: "L'héritage maritime de Srivijaya"
 nd_nus_srivijaya_legacy_desc: "Les traditions de Srivijaya, le premier grand empire thalassocratique de l'archipel, perdurent dans le matelotage et le commerce maritime de Nusantara."
 nd_nus_sawah_irrigation: "Irrigation de Sawah"
 nd_nus_sawah_irrigation_desc: "Le système des temples d'eau subak gère les rizières en terrasses complexes qui nourrissent les populations denses de Java et de Bali."
 nd_nus_spice_knowledge: "Connaissance des épices anciennes"
 nd_nus_spice_knowledge_desc: "Des générations de culture et de commerce de clous de girofle, de muscade et de poivre confèrent à Nusantara une expertise inégalée dans les produits les plus précieux au monde."
 nd_nus_silat_tradition: "Tradition martiale du Silat"
 nd_nus_silat_tradition_desc: "Le Pencak silat, l'art martial indigène de l'archipel, entraîne les guerriers aux techniques fluides de combat rapproché développées au cours de siècles de guerre inter-îles."
 nd_nus_mandala_statecraft: "Art de la politique du Mandala"
 nd_nus_mandala_statecraft_desc: "Le modèle de gouvernance du mandala lie les vassaux à travers des anneaux d'influence concentriques rayonnant à partir d'un centre sacré, permettant à l'archipel d'être gouverné sans frontières rigides."
 nd_nus_majapahit_golden_age: "L'âge d'or de Majapahit"
 nd_nus_majapahit_golden_age_desc: "Sous Hayam Wuruk et Gajah Mada, Majapahit a unifié l'archipel depuis sa capitale Trowulan, créant ainsi le modèle de l'unité politique de Nusantara."
 nd_nus_kris_tradition: "Kris Guerrier Tradition"
 nd_nus_kris_tradition_desc: "Le kris, le poignard asymétrique à lame ondulée de Java, est à la fois un héritage sacré et une arme de guerre, manié par des guerriers d'élite formés à l'art du silat."
 nd_nus_candi_tradition: "Tradition du temple de Candi"
 nd_nus_candi_tradition_desc: "Les temples candi en briques rouges de l'est de Java représentent des siècles de maîtrise architecturale hindoue-bouddhiste, centres d'apprentissage et de dévotion."
 nd_nus_pasar_tradition: "Tradition commerciale Pasar"
 nd_nus_pasar_tradition_desc: "Les grands marchés pasar de Nusantara sont le lieu où convergent les produits de mille îles, les épices de l'est, les textiles de l'ouest, le riz du cœur de Java."
 nd_nus_archipelagic_navigation: "Navigation archipélagique"
 nd_nus_archipelagic_navigation_desc: "Naviguer sur dix mille îles nécessite la maîtrise des courants, des vents de mousson et des trajectoires des étoiles transmises de génération en génération par les peuples marins."
 nd_nus_prahu_raiders: "Flotte de pillards de Prahu"
 nd_nus_prahu_raiders_desc: "Le prahu à double balancier est le navire le plus rapide dans les eaux insulaires, idéal pour les raids, les patrouilles côtières et la poursuite des navires ennemis dans les détroits étroits."
 nd_nus_islamic_scholarship: "Bourse islamique"
 nd_nus_islamic_scholarship_desc: "L’Islam s’est propagé pacifiquement à travers l’archipel via les commerçants et les érudits soufis. Les internats pesantren sont devenus des centres à la fois d'apprentissage religieux et de vie intellectuelle javanaise."
 nd_nus_spice_monopoly: "Monopole des épices"
 nd_nus_spice_monopoly_desc: "Le contrôle des sources d'épices des Moluques, la seule source mondiale de clous de girofle et de muscade, donne à Nusantara un levier sans précédent dans le commerce mondial."
 nd_nus_cetbang_foundries: "Fonderies de bronze de Cetbang"
 nd_nus_cetbang_foundries_desc: "Le canon javanais cetbang, coulé en bronze, témoigne d'une tradition indigène de poudre à canon antérieure au contact européen dans l'archipel."
 nd_nus_shipbuilding_mastery: "Maîtrise de la construction navale"
 nd_nus_shipbuilding_mastery_desc: "Les chantiers navals royaux de Galangan Kapal produisent du jong, du prahu et de la kora-kora en quantités qui font de Nusantara une puissance navale avec laquelle il faut compter."
 nd_nus_sultanate_governance: "Gouvernance du Sultanat"
 nd_nus_sultanate_governance_desc: "Les sultanats islamiques formalisent la gouvernance archipélagique par le biais de tribunaux syariah, de capitaines de port et d'une bureaucratie adaptée aux réalités de la domination insulaire."
 nd_nus_kora_kora_fleet: "Flotte de guerre Kora-Kora"
 nd_nus_kora_kora_fleet_desc: "La kora-kora est une immense galère de guerre des Moluques composée de centaines de guerriers, conçue pour les actions d'abordage et les combats navals rapprochés de la guerre insulaire."
 nd_nus_pepper_exports: "Exportations de poivre et d’épices"
 nd_nus_pepper_exports_desc: "Banten, Aceh et une douzaine d’autres ports acheminent le poivre, les clous de girofle et la muscade de l’archipel vers les artères du commerce mondial."
 nd_nus_wayang_arts: "Arts de la cour Wayang"
 nd_nus_wayang_arts_desc: "Le théâtre d’ombres wayang kulit transmet les histoires épiques du Ramayana et du Mahabharata, liant divers peuples à travers un héritage culturel commun."
 nd_nus_fortress_resistance: "Forteresse de la Résistance"
 nd_nus_fortress_resistance_desc: "Des fortifications benteng côtières et intérieures sont érigées pour défendre Nusantara contre les incursions coloniales européennes et affirmer la souveraineté sur l'archipel."
 nd_nus_sultan_agung_campaigns: "Campagnes du sultan Agung"
 nd_nus_sultan_agung_campaigns_desc: "Les sièges de Batavia du sultan Agung de Mataram en 1628-1629 ont démontré à la fois le potentiel militaire et la détermination farouche de la résistance javanaise au colonialisme."
 nd_nus_phinisi_tradition: "Tradition de voile Phinisi"
 nd_nus_phinisi_tradition_desc: "Le phinisi, un voilier à deux mâts de conception Bugis-Makassar, représente le summum de la construction navale indonésienne, rapide, navigable et construit pour les longs voyages."
 nd_nus_bugis_diaspora: "Diaspora bugis"
 nd_nus_bugis_diaspora_desc: "Les peuples Bugis et Makassar de Sulawesi sont les plus grands marins, commerçants, mercenaires et colons de l'archipel qui établissent des communautés de Bornéo à la péninsule malaise."
 nd_nus_mataram_statecraft: "Art politique de Mataram"
 nd_nus_mataram_statecraft_desc: "Le sultanat de Mataram centralise l'autorité politique javanaise, combinant la gouvernance islamique avec les traditions administratives javanaises préexistantes."
 nd_nus_anti_colonial_resistance: "Résistance anticoloniale"
 nd_nus_anti_colonial_resistance_desc: "D’Aceh à Ternate, de Banten à Mataram, les peuples de Nusantara organisent une résistance soutenue contre l’empiètement colonial européen."
 nd_nus_archipelagic_awakening: "L'éveil de Nusantara"
 nd_nus_archipelagic_awakening_desc: "Une nouvelle conscience émerge : l’archipel n’est pas simplement un ensemble de royaumes mais une civilisation unique unie par des mers partagées et des destins entrelacés."
 nd_nus_spice_industrialization: "Industrialisation des épices"
 nd_nus_spice_industrialization_desc: "Les méthodes modernes de transformation, de conditionnement et d'exportation transforment l'ancien commerce des épices de l'archipel en une entreprise industrielle à l'échelle mondiale."
 nd_nus_maritime_sovereignty: "Souveraineté maritime"
 nd_nus_maritime_sovereignty_desc: "Nusantara revendique un contrôle souverain sur les eaux entre ses îles, la mer n'est pas une frontière mais le tissu conjonctif de la nation."
 nd_nus_gotong_royong: "Gotong Royong"
 nd_nus_gotong_royong_desc: "L’ancienne tradition indonésienne d’entraide communautaire devient une philosophie directrice : l’État prospère lorsque tous ses peuples travaillent ensemble pour le bien commun."
 nd_nus_pancasila_foundations: "Fondations Pancasila"
 nd_nus_pancasila_foundations_desc: "Unité dans la diversité, principe philosophique selon lequel une nation composée de centaines de cultures, de langues et de confessions peut coexister dans le cadre d'un engagement commun en faveur de la tolérance et du respect mutuel."
 a_nd_nus_kris_warriors: "Kris Guerriers"
 a_nd_nus_kris_warriors_desc: "Infanterie d'élite javanaise brandissant le poignard sacré kris, entraînée à l'art martial ancien du pencak silat. Leur style de combat met l'accent sur des frappes rapprochées soudaines et dévastatrices."
 a_nd_nus_kris_levy: "Kris Levy Guerriers"
 a_nd_nus_kris_levy_desc: "Troupes de levée armées du kris traditionnel, tirées des villages et des rizières de Java."
 a_nd_nus_cetbang: "Artillerie de Cetbang"
 a_nd_nus_cetbang_desc: "Canons en bronze coulés dans la tradition javanaise, antérieurs aux armes à poudre européennes dans l'archipel. Le cetbang tire des projectiles en pierre ou en fer avec une précision mortelle."
 n_nd_nus_prahu: "Pillard de Prahu"
 n_nd_nus_prahu_desc: "Un navire rapide à double balancier construit pour la vitesse et la maniabilité dans les eaux peu profondes et les détroits étroits de l'archipel. Idéal pour les raids côtiers et la poursuite."
 n_nd_nus_kora_kora: "Galère de guerre Kora-Kora"
 n_nd_nus_kora_kora_desc: "Une immense galère de guerre des Moluques conçue pour les actions d'abordage et les combats navals rapprochés, avec un équipage composé de centaines de guerriers des îles aux épices."
 n_nd_nus_kora_kora_levy: "Kora-Kora Levy Cuisine"
 n_nd_nus_kora_kora_levy_desc: "Galères de guerre composées d'insulaires prélevés dans les communautés côtières de Nusantara."
 n_nd_nus_phinisi: "Phinisi"
 n_nd_nus_phinisi_desc: "Le célèbre voilier à deux mâts de conception Bugis-Makassar, construit pour les longs voyages océaniques. Rapide et navigable, le phinisi domine le commerce maritime et la guerre indonésiens de la fin de la période."
 nd_nus_candi: "Temple de Candi"
 nd_nus_candi_desc: "Un complexe de temples hindous-bouddhistes en briques rouges dans la tradition javanaise orientale, servant de centre de dévotion religieuse, d'apprentissage culturel et de mécénat artistique."
 nd_nus_pasar_agung: "Pasar Agung"
 nd_nus_pasar_agung_desc: "Le Grand Marché, un bazar central où convergent les produits de dix mille îles. Épices, textiles, métaux précieux et céramiques affluent dans ses étals."
 nd_nus_galangan_kapal: "Galangan Kapal"
 nd_nus_galangan_kapal_desc: "Un chantier naval royal dans la tradition javanaise et bugis, produisant du jong, du prahu, de la kora-kora et du phinisi pour les flottes marchandes et de guerre de Nusantara."
 nd_nus_benteng: "Benteng Perlawanan"
 nd_nus_benteng_desc: "Une forteresse de résistance, des fortifications côtières et intérieures construites pour repousser les envahisseurs coloniaux et affirmer la souveraineté de Nusantara sur son territoire."
 nd_nus_pesantren: "Pesantren"
 nd_nus_pesantren_desc: "Un internat islamique de tradition javanaise, où les étudiants étudient le Coran ainsi que la littérature javanaise, les mathématiques et la philosophie naturelle."
 nd_nus_sawah: "Sawah Terasing"
 nd_nus_sawah_desc: "Rizières en terrasses irriguées gérées par le système des temples d'eau subak, une merveille d'ingénierie agricole qui fait vivre la population dense de Java."
 nd_nus_padepokan: "Padepokan Silat"
 nd_nus_padepokan_desc: "Un terrain d'entraînement pour l'art martial ancien du pencak silat, où les guerriers maîtrisent les techniques de combat fluides de l'archipel."
 nd_nus_gudang_rempah: "Gudang Rempah"
 nd_nus_gudang_rempah_desc: "Un entrepôt d'épices où les clous de girofle, la muscade, le poivre et d'autres produits commerciaux précieux sont stockés, classés et préparés pour l'exportation vers les marchés mondiaux."
 nd_nus_pendopo_wayang: "Pendopo Wayang"
 nd_nus_pendopo_wayang_desc: "Une salle de spectacle en plein air où le marionnettiste dalang interprète le wayang kulit, théâtre d'ombres qui transmet les grandes épopées et unifie les cultures de l'archipel."
 nd_nus_pelabuhan: "Pelabuhan Niaga"
 nd_nus_pelabuhan_desc: "Un grand port de commerce dans la tradition Srivijaya, servant d'entrepôt où les marchandises provenant de l'océan Indien et de la mer de Chine méridionale changent de mains."
 nd_nus_candi_maintenance: "Entretien du temple"
 nd_nus_candi_maintenance_desc: "Stone and lumber for maintaining the candi temple's sacred precincts, and incense for its rites."
 nd_nus_spice_bazaar: "Opérations du bazar aux épices"
 nd_nus_spice_bazaar_desc: "Récipients en poterie et teintures pour les opérations du grand marché."
 nd_nus_shipyard_operations: "Opérations du chantier naval"
 nd_nus_shipyard_operations_desc: "Bois d'œuvre, fournitures navales, outils et goudron consommés par la construction du chantier naval royal et l'entretien du jong et du prahu."
 nd_nus_benteng_upkeep: "Entretien de la forteresse"
 nd_nus_benteng_upkeep_desc: "De la pierre pour les murs, des armes et du cuir pour les armes de la garnison, et du blé pour nourrir les soldats du benteng."
 nd_nus_pesantren_upkeep: "Entretien de l'école"
 nd_nus_pesantren_upkeep_desc: "Paper, ink, and cloth for the pesantren's religious scholars and students."
 nd_nus_irrigation_upkeep: "Culture du riz Sawah"
 nd_nus_irrigation_upkeep_desc: "Les terrasses gérées par les subaks produisent d'abondantes récoltes de riz, soutenues par des canaux d'irrigation en bambou et en bois."
 nd_nus_padepokan_upkeep: "Entretien du terrain d'entraînement"
 nd_nus_padepokan_upkeep_desc: "Armes, rembourrage en cuir et tissu pour l'équipement et les uniformes d'entraînement des guerriers silat."
 nd_nus_spice_storage: "Stockage des épices"
 nd_nus_spice_storage_desc: "Pottery vessels, timber chests, and pepper stocks held in the great spice warehouse."
 nd_nus_wayang_performances: "Spectacles Wayang"
 nd_nus_wayang_performances_desc: "Des teintures pour les marionnettes en cuir peint, du bois pour la scène et du tissu pour les costumes des artistes de la cour."
 nd_nus_port_operations: "Opérations portuaires"
 nd_nus_port_operations_desc: "Fournitures navales, bois et sel consommés par les opérations quotidiennes du port de commerce et l'approvisionnement des navires."
 levy_nd_nus_kris_warriors: "Kris Guerrier Levy"
 levy_nd_nus_kris_warriors_desc: "L'infanterie armée de Kris est levée dans les villages de Java."
 levy_nd_nus_kora_kora: "Kora-Kora Prélèvement"
 levy_nd_nus_kora_kora_desc: "Galères de guerre levées avec équipage par les insulaires de Nusantara."
 nd_nus_formed_tt: "Nusantara a été formé"
 nd_nus_path_a_tt: "Choisissez la thalassocratie Mandala"
 nd_nus_path_b_tt: "Choisissez l'archipel des épices"
 nd_nus_destiny: "Le mandat Nusantara"
 nd_nus_destiny_desc: "L’archipel étant unifié sous une seule bannière, le mandat du ciel incombe à Nusantara. La stabilité doit être maintenue comme fondement de plus grandes ambitions."
 nd_nus_dest_strait_masters: "Maîtres du détroit"
 nd_nus_dest_strait_masters_desc: "Prenez le contrôle du détroit de Malacca, le passage étroit par lequel doit s’écouler tout commerce entre l’océan Indien et la mer de Chine méridionale. La péninsule malaise doit se plier à la volonté de Nusantara."
 nd_nus_dest_champa_seas: "Domination sur les mers de Champa"
 nd_nus_dest_champa_seas_desc: "Une fois Malacca sécurisée, projetez la puissance maritime de Nusantara vers le nord dans les eaux du Champa et du golfe de Siam. Établissez la suprématie navale sur toute la mer de Chine méridionale."
 nd_nus_dest_samudra_raja: "Samudra Raja"
 nd_nus_dest_samudra_raja_desc: "Seigneur des mers. Plantant l'étendard de Nusantara sur le continent lui-même, du delta du Mékong au Chao Phraya, l'empire maritime étend son rayonnement au-delà de l'archipel. Construisez le commandement côtier de Benteng Laut pour ancrer ce domaine."
 nd_nus_dest_spice_sources: "Commandez les sources d'épices"
 nd_nus_dest_spice_sources_desc: "Les girofliers de Ternate et les plantations de muscade de Banda produisent les denrées les plus précieuses au monde. Amenez fermement ces lointains sultanats des Moluques sous le contrôle de Nusantara."
 nd_nus_dest_emporium: "Le plus grand magasin"
 nd_nus_dest_emporium_desc: "Transform Nusantara from a spice producer into the world's greatest trading emporium. Build Gresik, the port of the eastern spice fleets, up into a great harbor city, and embrace modern banking."
 nd_nus_dest_gresik_developed_tt: "Gresik is held and its development is at least #bold 38#!"
 nd_nus_dest_bumi_rempah: "Bumi Rempah"
 nd_nus_dest_bumi_rempah_desc: "The Land of Spices. Every merchant vessel on earth, from Lisbon to Canton, depends on the commodities that grow only in these islands. Hold Gowa, the harbor of Makassar where the spice ships gather, and build it up. Then raise the Pasar Dunia, the World Market, and let all nations come to Nusantara with gold in hand."
 nd_nus_dest_gowa_developed_tt: "Gowa is held and its development is at least #bold 40#!"
 nd_nus.6.t: "Le mandat Nusantara"
 nd_nus.6.d: "The scattered kingdoms and sultanates of the archipelago have been gathered under one crown. From the volcanic peaks of Java to the coral atolls of the eastern seas, Nusantara stands as a unified realm for the first time since the golden age of Majapahit.\n\nBut unity alone is not destiny. The mandate to rule ten thousand islands demands more than military conquest, it demands stability, legitimacy, and a vision for what this unprecedented archipelagic state can become. The foundations have been laid. Now the real work begins."
 nd_nus.6.a: "Le mandat de l’archipel nous appartient"
 nd_nus.7.t: "Maîtres du détroit"
 nd_nus.7.d: "The flags of Nusantara now fly over Malacca and Kedah, the chokepoints of the world's busiest maritime trade route. Every Chinese junk carrying silk to the west, every Arab dhow laden with frankincense, every Indian vessel bearing textiles and gemstones, all must pass through waters that Nusantara commands.\n\nSrivijaya understood this power seven centuries ago. The Malacca Sultanate built an empire upon it. Now Nusantara inherits their legacy and surpasses it, for no previous maritime power controlled both sides of the strait simultaneously while also commanding the vast archipelago to the south and east."
 nd_nus.7.a: "Tous ceux qui naviguent sur ces eaux naviguent avec notre permission"
 nd_nus.8.t: "La campagne en mer de Chine méridionale"
 nd_nus.8.d: "Nusantara's war fleets now patrol waters that stretch from the Mekong Delta to the Gulf of Siam. The old kingdom of Champa, the Malay coastal cities, and the trading ports of the mainland all acknowledge the supremacy of the archipelago's navy.\n\nThe question is how to consolidate this far-flung maritime dominion. Some admirals advocate for aggressive forward deployment, maintaining battle fleets in distant waters, ready to project power at a moment's notice. Others counsel a subtler approach, using the strait chokepoints as leverage for diplomatic hegemony, binding mainland states through trade dependence rather than occupation."
 nd_nus.8.a: "Nos flottes de guerre patrouilleront sur toutes les voies maritimes"
 nd_nus.8.b: "Laissons les détroits faire notre travail à notre place"
 nd_nus.9.t: "Samudra Raja : Seigneur des mers"
 nd_nus.9.d: "From the rice plains of the Chao Phraya to the spice groves of the Moluccas, from the Strait of Malacca to the Timor Sea, Nusantara's writ runs over the greatest maritime domain the world has ever seen. No naval power, not the Portuguese, not the Dutch, not the Chinese treasure fleets, can challenge our supremacy in these waters.\n\nThe Samudra Raja, the Lord of the Seas, faces a final choice. The empire can be secured through overwhelming naval and military force, modernizing the armed forces to crush any challenger. Or it can be anchored in permanent institutions, garrisons at every strait, fortresses at every harbor, a network of naval bases that will outlast any individual ruler."
 nd_nus.9.a: "Modernisez et submergez tous les challengers"
 nd_nus.9.b: "Construire les institutions permanentes de l'empire"
 nd_nus.10.t: "Les îles aux épices sous une seule couronne"
 nd_nus.10.d: "Ternate and Banda, for centuries, these tiny volcanic islands in the eastern seas were the only source of cloves and nutmeg on earth. Local sultans grew fabulously wealthy, playing Portuguese, Spanish, and Dutch traders against each other while the price of a single sack of cloves could buy a ship in Venice.\n\nNow these legendary spice islands answer to Nusantara. The middlemen have been eliminated. The growers, the warehouses, the ships, and the ports are all under a single authority. For the first time, the entire spice supply chain, from tree to ship, is controlled by one power."
 nd_nus.10.a: "L'épice coule uniquement entre nos mains"
 nd_nus.11.t: "Le grand magasin de l'Est"
 nd_nus.11.d: "The ports of Nusantara have become the crossroads of the world. Chinese merchants bring porcelain and silk, Indian traders carry textiles and gemstones, Arab voyagers offer frankincense and horses, and European ships arrive laden with silver. All come to buy what only these islands produce, and all leave paying Nusantara's price.\n\nTwo philosophies compete at court. The monopolists argue for a tight cartel, control supply, fix prices, punish smugglers, and extract maximum profit from every grain of spice. The free traders counter that an open emporium attracts more merchants, more goods, more ideas, and ultimately more wealth than any monopoly could squeeze from a restricted market."
 nd_nus.11.a: "Contrôler l’offre et fixer le prix"
 nd_nus.11.b: "Bienvenue à tous les commerçants dans nos ports ouverts"
 nd_nus.12.t: "Bumi Rempah : Le pays des épices"
 nd_nus.12.d: "Nusantara is not merely a country that trades in spices: it IS spice. The economy of the entire known world depends on commodities that grow only in these islands. No European colonial venture, no Chinese tribute mission, no Arab trading fleet can function without what Nusantara produces. The Land of Spices has become the indispensable nation.\n\nThis supreme economic position can be leveraged in different ways. Some counsel building the world's greatest marketplace, a permanent institution where all nations must come to trade, enriching the archipelago through the sheer volume of commerce. Others advocate for cultural and political hegemony, using economic leverage to project Nusantara's civilization outward, integrating diverse peoples into an ever-expanding sphere of influence."
 nd_nus.12.a: "Construisez le plus grand marché du monde"
 nd_nus.12.b: "Notre richesse projettera notre civilisation"
 STATIC_MODIFIER_NAME_nd_nus_dest_fleet_projection: "Doctrine de projection de flotte"
 STATIC_MODIFIER_DESC_nd_nus_dest_fleet_projection: "Les flottes de guerre de Nusantara maintiennent des stations permanentes dans les eaux lointaines, prêtes à projeter de la puissance à tout moment. La guerre est peu coûteuse et décisive pour ceux qui contrôlent la mer."
 STATIC_MODIFIER_NAME_nd_nus_dest_strait_hegemony: "Hégémonie du détroit"
 STATIC_MODIFIER_DESC_nd_nus_dest_strait_hegemony: "Plutôt que de patrouiller de force toutes les voies maritimes, Nusantara utilise son contrôle des points d’étranglement comme levier diplomatique, liant les États du continent par le biais de réseaux de renseignement et de dépendance commerciale."
 STATIC_MODIFIER_NAME_nd_nus_dest_naval_supremacy: "Doctrine de suprématie navale"
 STATIC_MODIFIER_DESC_nd_nus_dest_naval_supremacy: "La modernisation de l'armée de Nusantara assure une supériorité tactique sur tout rival, même si le coût du maintien de ces forces met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_nus_dest_samudra_imperium: "Institutions du Samudra"
 STATIC_MODIFIER_DESC_nd_nus_dest_samudra_imperium: "Un réseau permanent de garnisons et de bases navales ancre l'empire maritime de Nusantara, même si les coûts de l'empire font grimper le prix des emprunts."
 STATIC_MODIFIER_NAME_nd_nus_dest_spice_cartel: "Cartel des épices"
 STATIC_MODIFIER_DESC_nd_nus_dest_spice_cartel: "Nusantara exerce un monopole strict sur le commerce mondial des épices, contrôlant l'offre, fixant les prix et étendant sa portée commerciale aux marchés lointains."
 STATIC_MODIFIER_NAME_nd_nus_dest_open_emporium: "Magasin ouvert"
 STATIC_MODIFIER_DESC_nd_nus_dest_open_emporium: "Les ports de Nusantara accueillent des marchands de toutes les nations, attirant une population cosmopolite de commerçants, de colons et de mercenaires, même si l'armée s'adoucit dans cette atmosphère de commerce."
 STATIC_MODIFIER_NAME_nd_nus_dest_world_market: "Marché mondial"
 STATIC_MODIFIER_DESC_nd_nus_dest_world_market: "Le Pasar Dunia est une institution sans équivalent, un marché permanent où toutes les nations viennent commercer. L'archipel se nourrit facilement, même si l'entretien des fortifications pour protéger cette richesse coûte cher."
 STATIC_MODIFIER_NAME_nd_nus_dest_spice_empire: "Empire des épices"
 STATIC_MODIFIER_DESC_nd_nus_dest_spice_empire: "La suprématie économique devient une hégémonie culturelle. La richesse de Nusantara finance une expansion de l'influence civilisationnelle, intégrant divers peuples et projetant la culture de l'archipel à travers la région."
 nd_nus_benteng_laut: "Benteng Laut"
 nd_nus_benteng_laut_desc: "Une forteresse de commandement naval côtière, combinant la défense du port, l'ancrage de la flotte et les quartiers de garnison pour projeter la puissance maritime de Nusantara sur les mers et les détroits lointains."
 nd_nus_benteng_laut_maintenance: "Entretien de la forteresse navale"
 nd_nus_benteng_laut_maintenance_desc: "Armes, pierres et fournitures navales pour entretenir les défenses, les quais et la garnison du commandement côtier."
 nd_nus_pasar_dunia: "Pasar Dunia"
 nd_nus_pasar_dunia_desc: "Le Marché Mondial, un vaste complexe commercial permanent où les marchands de toutes les nations convergent pour acheter et vendre les biens les plus convoités au monde. L'expression ultime de la suprématie économique de Nusantara."
 nd_nus_pasar_dunia_maintenance: "Opérations sur le marché mondial"
 nd_nus_pasar_dunia_maintenance_desc: "Du papier pour les contrats et les registres, de la poterie pour les récipients de stockage et du tissu fin pour les étalages des marchands sur le grand marché mondial."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_nus_bureaucracy_authority: "Autorité impériale Nusantara"
 AUTO_MODIFIER_DESC_nd_nus_bureaucracy_authority: "The unified archipelagic state may institutionalize the practices that bound Majapahit, the Pasisir sultanates, and Mataram into permanent organs of government. Three of them may be kept at a time."

 nus_pamget_tributary_bureaucracy: "Appareil affluent Pamget"
 nus_pamget_tributary_bureaucracy_desc: "Le registre des feuilles de palmier Negarakertagama de 1365, composé par le poète de la cour Mpu Prapanca pour le roi Hayam Wuruk, répertorie les pays extérieurs de Mancanagara et les îles Nusantara proprement dites comme un mandala gradué d'affluents. Chaque année, des envoyés transportaient à Trowulan des livraisons d'or, d'esclaves, de clous de girofle et de bois aromatiques ; en retour, les dirigeants extérieurs étaient inscrits dans les registres royaux et confirmés sur leurs trônes. Le système étendait la sphère de Majapahit depuis la péninsule malaise en passant par Sulawesi jusqu'à l'ouest de la Nouvelle-Guinée, mais sa légèreté - un tribut annuel, pas des garnisons - signifiait que la faiblesse royale n'importe où sur la chaîne invitait à la rébellion à travers elle."

 nus_sumpah_palapa_bureaucracy: "Rituel de la cour Sumpah Palapa"
 nus_sumpah_palapa_bureaucracy_desc: "Patih Gajah Mada, prenant ses fonctions en 1336, jura devant le jeune roi Hayam Wuruk qu'il ne goûterait aucune épice - pas de palapa - jusqu'à ce que l'archipel soit unifié sous Majapahit. Le serment a été institutionnalisé lors du festival annuel Caitra à Trowulan, où chaque prince Bhre et raja tributaire, en robes de cour classées, renouvelaient leur allégeance pendant que le patih récitait la litanie territoriale de nusantara. Fusionnant la cérémonie royale hindoue-bouddhiste avec une doctrine laïque de souveraineté pan-archipélagique, le rituel subordonnait les grands rois régionaux à un seul axe rituel : la pierre angulaire de toute rhétorique Nusantara ultérieure."

 nus_pasisir_confederation_bureaucracy: "Confédération côtière de Pasisir"
 nus_pasisir_confederation_bureaucracy_desc: "La chaîne des sultanats portuaires du nord de Java - Demak fondé vers 1475, puis Cirebon, Banten, Tuban et Gresik - dont les capitaines de port et les magistrats de Bandar syahbandar gouvernaient les populations cosmopolites de commerçants javanais, malais, hokkien, gujarati, arabe et bugis. Après le renversement de Majapahit par Demak vers 1527, le pasisir détenait le poids politique de Java. Un conseil informel de sultans a coordonné les escortes des convois, les taux de droits de douane et les marchés du vendredi qui ont attiré le commerce des épices des Moluques vers les côtes de Java - le pouvoir reposant entre les sultans marchands et les notables oulémas commerçants contre l'aristocratie plus ancienne de l'intérieur des terres."

 nus_wali_songo_bureaucracy: "Réseau Missionnaire Wali Songo"
 nus_wali_songo_bureaucracy_desc: "Les Neuf Saints de Java - Sunan Kalijaga, Sunan Bonang, Sunan Giri et leurs semblables - ont intégré l'Islam dans la culture javanaise de 1450 à 1550 environ à travers le théâtre de marionnettes wayang, la musique gamelan et la conversion progressive des cours de Demak, Cirebon et Mataram. Ils fondèrent des écoles religieuses pesantren, composèrent de la poésie mystique Suluk et construisirent des tombeaux-sanctuaires qui attirent encore les pèlerins. Les lignées spirituelles kyai qu’ils ont fondées sont devenues l’épine dorsale religieuse de l’islam javanais, mais leur piété populiste a déstabilisé l’aristocratie hindoue-bouddhiste priyayi dont les tribunaux avaient défini la haute culture javanaise pendant mille ans."

 nus_tumenggung_regency_bureaucracy: "Système de régence de Tumenggung"
 nus_tumenggung_regency_bureaucracy_desc: "Le sultan Agung de Mataram, régnant de 1613 à 1645, remplaça les anciennes principautés cadettes Bhre de l'arrière-pays javanais par des régents tumenggung - des fonctionnaires nommés par la couronne, issus de parents royaux et de commandants santri de confiance, chargés des revenus provinciaux, des corves routières et de la levée de l'infanterie prajurit pour les guerres de Mataram. Le système a retiré le poids administratif de la côte de Pasisir à l'intérieur des terres, a imposé une culture de cour javanaise uniforme dans tout le cœur du pays et a brièvement fait de Mataram la puissance terrestre la plus puissante de l'archipel - mais il a également mis à l'écart les sultans marchands dont la richesse avait financé la conversion islamique de Java."

 nus_kapitan_magistracy_bureaucracy: "Magistrature ethnique Kapitan"
 nus_kapitan_magistracy_bureaucracy_desc: "À Malacca, Banten, Aceh, Makassar et Mataram pasisir, le sultan nomma un kapitan (capitaine, du portugais capito) pour gouverner chaque communauté étrangère ou non musulmane selon son propre droit coutumier. Le Kapitan Cina dirigeait les quartiers hokkien et cantonais; le Kapitan Kling parlait au nom des commerçants tamouls et gujarati; les Kapitan Bugis ont dirigé les colons migrants devant des tribunaux non malais. Le kapitan enregistrait les naissances, réglait les différends, collectait la taxe d'entrée et répondait au nom de sa communauté devant le syahbandar : une institution particulièrement archipélagique qui libérait le sultan de gouverner directement les diasporas tout en liant leurs richesses au trône."
