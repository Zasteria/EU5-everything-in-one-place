 AUTO_MODIFIER_NAME_nd_lxa_bureaucracy_authority: "Sao et Senabodi"
 AUTO_MODIFIER_DESC_nd_lxa_bureaucracy_authority: "The dual administrative tradition of Lan Xang (the Cao paramount-king with his Senabodi council, and the Sangha-Raja with the royal-mueang ritual order) provides a foundation for three permanent bureaucracies."
