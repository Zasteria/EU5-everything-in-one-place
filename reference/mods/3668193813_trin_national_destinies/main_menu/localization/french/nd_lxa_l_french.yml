l_french:
 STATIC_MODIFIER_NAME_nd_lxa_million_elephants: "Le million d'éléphants"
 STATIC_MODIFIER_DESC_nd_lxa_million_elephants: "Les éléphants de guerre de Lan Xang sont bien plus que des bêtes de somme. Ils sont l’incarnation vivante du pouvoir royal, chacun étant une forteresse de chair et d’ivoire qui renverse le cours de la bataille. Le royaume qui contrôle un million d’éléphants suscite la peur de tous ceux qui s’y opposent."
 STATIC_MODIFIER_NAME_nd_lxa_white_parasol: "Le parasol blanc"
 STATIC_MODIFIER_DESC_nd_lxa_white_parasol: "Sous le parasol blanc du dharma, le royaume trouve sa véritable force, non pas dans le fracas des armes, mais dans la sagesse de la sangha, la beauté du wat et l’harmonie d’un peuple uni par la foi. Le parasol abrite tous ceux qui recherchent son ombre."
 STATIC_MODIFIER_NAME_nd_lxa_defender_of_the_realm: "Défenseur du Royaume"
 STATIC_MODIFIER_DESC_nd_lxa_defender_of_the_realm: "Comme Setthathirath devant l’armée birmane, le royaume reste résolu. Chaque col de montagne devient un piège mortel, chaque sentier de la jungle un piège pour l'envahisseur."
 STATIC_MODIFIER_NAME_nd_lxa_temple_builder: "Le bâtisseur de temples"
 STATIC_MODIFIER_DESC_nd_lxa_temple_builder: "Dans la tradition de Setthathirath, qui a construit Wat Xieng Thong et Pha That Luang, le royaume canalise son énergie dans des monuments qui survivront à tout conquérant."
 STATIC_MODIFIER_NAME_nd_lxa_strict_law: "La loi stricte"
 STATIC_MODIFIER_DESC_nd_lxa_strict_law: "A l'instar de Sourigna Vongsa, le royaume applique ses lois avec une précision sans faille. Même la propre famille du roi n'est pas au-dessus de la justice, l'ordre découle d'une autorité constante."
 STATIC_MODIFIER_NAME_nd_lxa_open_borders: "Les frontières ouvertes"
 STATIC_MODIFIER_DESC_nd_lxa_open_borders: "L’âge d’or de Sourigna Vongsa prouve que la prospérité vient de l’accueil du monde. Les marchands hollandais, les commerçants chinois et les artisans de toute la région apportent leurs compétences et leur or à la cour de Vientiane."
 nd_lxa.1.t: "Le pays du million d'éléphants"
 nd_lxa.1.d: "The Lao lands are reunited under a single crown. From the misty highlands of Muang Sua to the broad plains of the Khorat Plateau, the ancient principalities have recognized a common sovereign. The Mekong River, which has always been the lifeline of the Lao people, now flows through a single kingdom.\n\nFa Ngum founded this realm with the blessing of Khmer arms and Buddhist dharma, naming it Lan Xang Hom Khao: the Land of a Million Elephants and the White Parasol. The elephants represent the military might that forged the kingdom; the parasol represents the Buddhist faith that gives it meaning.\n\nWhich legacy shall define our restored kingdom?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_lxa.1.a: "Que la terre tremble sous nos éléphants !"
 nd_lxa.1.b: "Laissez le dharma éclairer notre chemin."
 nd_lxa.2.t: "La Résistance de Setthathirath"
 nd_lxa.2.d: "King Bayinnaung of Burma has hurled his vast armies against Lan Xang, but our king has proven equal to the challenge. Setthathirath moved the capital from venerable Luang Prabang to strategic Vientiane, where the broad Mekong provides a natural moat. When the Burmese came, he refused open battle with their superior numbers and instead waged a war of jungle ambush and scorched earth.\n\nIn 1570, after Bayinnaung's retreat, Setthathirath counterattacked, capturing more than 30,000 prisoners and 100 war elephants from the fleeing Burmese columns. But the king is also a builder: Wat Xieng Thong in Luang Prabang and the great Pha That Luang stupa in Vientiane stand as testaments to his dual nature.\n\nShall we honor Setthathirath as warrior or as builder?"
 nd_lxa.2.a: "La jungle est notre forteresse. Ne laissez personne passer !"
 nd_lxa.2.b: "Nos temples survivront à n’importe quelle armée."
 nd_lxa.3.t: "L'âge d'or de Sourigna Vongsa"
 nd_lxa.3.d: "For fifty-seven years, King Sourigna Vongsa has ruled Lan Xang with a steady hand. Where his predecessors faced invasion and civil war, Vongsa has achieved something remarkable, lasting peace with both Siam and Vietnam through patient diplomacy and firm borders.\n\nIn 1641, a Dutch trading expedition under Gerrit van Wuysthoff navigated the Mekong from Cambodia to Vientiane, marveling at the wealth they found. Lan Xang exports silk, gold, ivory, deer skins, cardamom, and benzoin resin to markets as distant as China and Japan.\n\nBut Vongsa is also known as a stern lawgiver. When his own son was found guilty of adultery, the king had him executed rather than grant exception. His laws are harsh but they are applied to all equally: noble and peasant alike.\n\nHow shall we build upon this golden age?"
 nd_lxa.3.a: "La loi doit être d’acier : pas d’exceptions."
 nd_lxa.3.b: "Ouvrir plus largement nos portes sur le monde."
 nd_lxa.4.t: "L'arrivée du Phra Bang"
 nd_lxa.4.d: "A sacred Buddha image has come to our kingdom: the Phra Bang, said to have been cast in Sri Lanka and carried through the courts of the Khmer before finding its home among the Lao people. Fashioned from an alloy of gold, silver, and bronze, the Phra Bang stands in the gesture of dispelling fear, its palms turned outward in blessing.\n\nKing Visounarath has declared it the palladium of the realm. Where the Phra Bang resides, there is the spiritual heart of Lan Xang. The city of Luang Prabang itself takes its name from this sacred image, Luang meaning 'great' and Prabang for the Buddha it shelters.\n\nMonks and pilgrims have already begun to journey from across the kingdom to pay homage. The Phra Bang is more than a religious artifact; it is a symbol that the dharma has chosen Lan Xang as its home."
 nd_lxa.4.a: "Que le Phra Bang bénisse notre royaume pour toujours."
 nd_lxa_elephant_warfare: "Guerre des éléphants"
 nd_lxa_elephant_warfare_desc: "La tradition des éléphants de guerre qui donne son nom à Lan Xang : le pays du million d'éléphants."
 nd_lxa_theravada_sangha: "Sangha Theravada"
 nd_lxa_theravada_sangha_desc: "L'ordre monastique bouddhiste qui constitue le fondement spirituel et éducatif de la société laotienne."
 nd_lxa_sticky_rice_tradition: "Tradition du riz gluant"
 nd_lxa_sticky_rice_tradition_desc: "La culture du riz gluant, l'aliment de base qui définit la cuisine laotienne et la vie communautaire."
 nd_lxa_fa_ngum_legacy: "L'héritage de Fa Ngum"
 nd_lxa_fa_ngum_legacy_desc: "Les traditions militaires établies par Fa Ngum lors de sa conquête et unification des principautés laotiennes en 1353."
 nd_lxa_khmer_heritage: "Patrimoine khmer"
 nd_lxa_khmer_heritage_desc: "Les liens culturels et diplomatiques avec la cour khmère, où Fa Ngum a grandi en exil et dont il a puisé les traditions bouddhistes qui ont façonné Lan Xang."
 nd_lxa_silk_weaving: "Tradition du tissage de la soie"
 nd_lxa_silk_weaving_desc: "L'art du tissage de la soie laotien, transmis de génération en génération et produisant des textiles prisés dans toute l'Asie du Sud-Est."
 nd_lxa_mekong_trade: "Commerce du Mékong"
 nd_lxa_mekong_trade_desc: "Le développement des réseaux commerciaux le long du fleuve Mékong, artère économique de Lan Xang."
 nd_lxa_river_fleet: "Flotte fluviale"
 nd_lxa_river_fleet_desc: "Navire de patrouille conçu pour le Mékong et ses affluents, sécurisant les routes commerciales et projetant de l'énergie le long des voies navigables."
 nd_lxa_forest_trade: "Commerce des produits forestiers"
 nd_lxa_forest_trade_desc: "L'exportation de produits forestiers précieux (résine de benjoin, laque et bois durs) des forêts denses des hauts plateaux du Laos."
 nd_lxa_samsenthai_reforms: "Les réformes de Samsenthai"
 nd_lxa_samsenthai_reforms_desc: "Les réformes commerciales et administratives du roi Samsenthai, fils de Fa Ngum, qui transformèrent Lan Xang d'un État de conquête en un royaume commercial prospère."
 nd_lxa_phra_bang: "Le Phra Bang Palladium"
 nd_lxa_phra_bang_desc: "L'image sacrée de Bouddha qui sert de palladium au royaume du Laos, symbole de faveur divine et de légitimité royale."
 nd_lxa_elephant_corps_tradition: "Corps des éléphants"
 nd_lxa_elephant_corps_tradition_desc: "Le corps officiel de guerre des éléphants qui a fait craindre les armées de Lan Xang dans toute l'Asie du Sud-Est continentale."
 nd_lxa_pha_that_luang: "Pha That Luang"
 nd_lxa_pha_that_luang_desc: "Le grand stupa doré de Vientiane, monument le plus sacré du royaume laotien et phare du bouddhisme Theravada."
 nd_lxa_ivory_craft: "Artisanat en ivoire"
 nd_lxa_ivory_craft_desc: "La tradition de la sculpture sur ivoire, s'appuyant sur les vastes troupeaux d'éléphants de Lan Xang pour produire des produits de luxe destinés à l'exportation."
 nd_lxa_vientiane_capital: "Vientiane comme capitale"
 nd_lxa_vientiane_capital_desc: "L'établissement de Vientiane comme capitale permanente du Lan Xang par le roi Setthathirath, choisi pour sa position stratégique sur le Mékong."
 nd_lxa_burmese_resistance: "Résistance contre la Birmanie"
 nd_lxa_burmese_resistance_desc: "Les tactiques de guérilla et les retraites stratégiques qui ont permis à Lan Xang de survivre contre un empire birman bien plus vaste."
 nd_lxa_river_warfare: "Guerre fluviale"
 nd_lxa_river_warfare_desc: "Infanterie spécialisée entraînée au combat dans la jungle et sur les rivières, protégeant les routes commerciales du Mékong contre les pillards et les envahisseurs."
 nd_lxa_lacquerware: "Industrie de la laque"
 nd_lxa_lacquerware_desc: "La production de laques fines à partir de résine de lac récoltée en forêt, un artisanat de luxe apprécié de la tradition artisanale laotienne."
 nd_lxa_haw_kham: "Palais Haw Kham"
 nd_lxa_haw_kham_desc: "La tradition du palais royal de Lan Xang, où la monarchie laotienne exerce son autorité et reçoit les ambassades étrangères."
 nd_lxa_photisarath_reforms: "Les réformes de Photisarath"
 nd_lxa_photisarath_reforms_desc: "Déclaration du roi Photisarath du bouddhisme Theravada comme religion d'État en 1527, unifiant la vie spirituelle du royaume."
 nd_lxa_deer_skin_trade: "Commerce de peau de cerf"
 nd_lxa_deer_skin_trade_desc: "L'exportation de peaux de cerf, très demandées en Chine et au Japon, transitait par les comptoirs commerciaux d'Ayutthayan pour atteindre des marchés lointains."
 nd_lxa_firearms_adoption: "Adoption des armes à feu"
 nd_lxa_firearms_adoption_desc: "L'adoption des armes à mèche à mèche grâce aux contacts avec les commerçants européens et asiatiques pendant l'âge d'or de Sourigna Vongsa."
 nd_lxa_golden_age: "L'âge d'or de Lan Xang"
 nd_lxa_golden_age_desc: "Les cinquante-sept ans de règne de Sourigna Vongsa, une période de paix, de prospérité et d'épanouissement culturel sans précédent."
 nd_lxa_european_contact: "Contact européen"
 nd_lxa_european_contact_desc: "L'arrivée des commerçants néerlandais de COV en 1641 a ouvert pour la première fois Lan Xang au commerce et au savoir européens."
 nd_lxa_law_code: "Code de Loi de Sourigna Vongsa"
 nd_lxa_law_code_desc: "Le système juridique strict mais égalitaire établi par Sourigna Vongsa s'appliquait sans exception aux nobles comme aux roturiers."
 nd_lxa_manuscript_tradition: "Tradition manuscrite"
 nd_lxa_manuscript_tradition_desc: "La tradition bouddhiste consistant à copier des textes sacrés sur des manuscrits en feuilles de palmier, préservant et diffusant l'apprentissage du pali dans tout le royaume."
 nd_lxa_cultural_resilience: "Résilience culturelle laotienne"
 nd_lxa_cultural_resilience_desc: "La persistance de l’identité culturelle laotienne à travers des siècles de division et de pression étrangère, liée par une langue, une foi et une tradition communes."
 nd_lxa_mekong_mastery: "Maîtrise du Mékong"
 nd_lxa_mekong_mastery_desc: "La pleine exploitation du système fluvial du Mékong pour le transport, le commerce et l’extraction des ressources."
 nd_lxa_sangha_unity: "Unité de la Sangha"
 nd_lxa_sangha_unity_desc: "Le réseau monastique bouddhiste qui unit le peuple laotien au-delà des frontières politiques, assurant l'éducation, la cohésion sociale et la continuité spirituelle."
 nd_lxa_reunification: "Aspiration à la réunification"
 nd_lxa_reunification_desc: "Le rêve éternel de restaurer les frontières du royaume de Fa Ngum, unissant à nouveau tous les peuples de langue lao sous une seule couronne."
 a_nd_lxa_war_elephant: "Éléphant de guerre"
 a_nd_lxa_war_elephant_desc: "Les éléphants de guerre qui ont donné son nom à Lan Xang. Ces mastodontes blindés servent de forteresses mobiles sur le champ de bataille, écrasant les formations ennemies avec leur masse tandis que leurs cornacs lancent des javelots depuis le haut."
 a_nd_lxa_elephant_corps: "Corps des éléphants"
 a_nd_lxa_elephant_corps_desc: "Un corps officiel d'éléphants de guerre entraînés dans le cadre des réformes de Setthathirath. Chaque éléphant porte un howdah avec des guerriers entraînés, fonctionnant comme une plate-forme interarmes au pouvoir dévastateur."
 a_nd_lxa_mekong_guard: "Garde du fleuve Mékong"
 a_nd_lxa_mekong_guard_desc: "L'infanterie s'est entraînée dans les jungles dangereuses et les traversées de rivières du bassin du Mékong. Ils excellent dans les embuscades et peuvent se déplacer sur un terrain qui arrêterait une armée conventionnelle."
 a_nd_lxa_matchlock_infantry: "Infanterie à mèche laotienne"
 a_nd_lxa_matchlock_infantry_desc: "Infanterie équipée d'armes à feu à mèche acquises grâce à des contacts commerciaux européens et asiatiques pendant l'âge d'or de Sourigna Vongsa."
 n_nd_lxa_river_galley: "Cuisine du fleuve Lao"
 n_nd_lxa_river_galley_desc: "Cuisines à faible tirant d'eau conçues pour le fleuve Mékong et ses affluents. Rapides et maniables, ils patrouillent les voies navigables du royaume et protègent le trafic marchand."
 nd_lxa_wat: "Wat"
 nd_lxa_wat_desc: "Un complexe de temples bouddhistes qui sert de centre spirituel et éducatif à la communauté. Les moines enseignent la lecture et l'écriture, préservent les manuscrits et conseillent tous ceux qui le recherchent."
 nd_lxa_silk_house: "Maison de tissage de la soie"
 nd_lxa_silk_house_desc: "Un atelier dédié à l'art ancien du Laos du tissage de la soie, produisant des textiles d'une beauté et d'une valeur extraordinaires en utilisant des techniques transmises de génération en génération."
 nd_lxa_elephant_kraal: "Kraal des éléphants"
 nd_lxa_elephant_kraal_desc: "Un complexe royal pour la capture, l'entraînement et la détention d'éléphants de guerre. Le kraal est à la fois une installation militaire et un symbole du pouvoir royal."
 nd_lxa_mekong_trading_post: "Poste de traite du Mékong"
 nd_lxa_mekong_trading_post_desc: "Un entrepôt et un quai au bord de la rivière où les marchandises en provenance des hauts plateaux du Laos (soie, ivoire, benjoin et peaux de cerf) sont chargées sur des bateaux pour être transportées le long du Mékong vers des marchés lointains."
 nd_lxa_pha_that: "Pha That Stupa"
 nd_lxa_pha_that_desc: "Un grand stupa reliquaire bouddhiste, construit dans la tradition de Pha That Luang à Vientiane. Sa surface dorée attire les pèlerins et les artisans du monde bouddhiste."
 nd_lxa_royal_palace: "Haw Kham"
 nd_lxa_royal_palace_desc: "Le palais royal de la monarchie laotienne, depuis lequel le roi rend la justice et reçoit les ambassades étrangères. Son architecture ornée reflète la richesse et la sophistication de la cour."
 nd_lxa_rice_paddy: "Rizière"
 nd_lxa_rice_paddy_desc: "Rizières irriguées cultivant le riz gluant qui constitue le fondement du régime alimentaire et de la vie communautaire du Laos, alimentées par les pluies de mousson et les eaux des rivières du bassin du Mékong."
 nd_lxa_ivory_workshop: "Ivory Carvers' Workshop"
 nd_lxa_ivory_workshop_desc: "A workshop where tusks from the royal herds and the upland tribute are carved into sword hilts, manuscript covers, and the paired tusks set beside a Buddha image. It is found where ivory or elephants reach the market."
 nd_lxa_ho_tai: "Ho Tai"
 nd_lxa_ho_tai_desc: "The scripture library of a wat. Monks incise the Pali texts on dried palm leaves, blacken the cuts with soot, and bind the leaves between lacquered wooden covers."
 nd_lxa_forest_camp: "Camp de rassemblement forestier"
 nd_lxa_forest_camp_desc: "Un camp de montagne pour récolter la résine de benjoin, le lac et d'autres produits forestiers précieux dans les forêts denses de l'intérieur du Laos."
 nd_lxa_wat_maintenance: "Entretien des toilettes"
 nd_lxa_wat_maintenance_desc: "The upkeep of the temple complex, sustained by beeswax candles, incense offerings burning at the altar, and cloth for the robes of its monks."
 nd_lxa_silk_maintenance: "Tissage de la soie"
 nd_lxa_silk_maintenance_desc: "La soie brute est teinte et tissée pour fabriquer des textiles raffinés prisés dans toute l'Asie du Sud-Est."
 nd_lxa_kraal_maintenance: "Entretien du Kraal"
 nd_lxa_kraal_maintenance_desc: "Nourriture, bois, harnais en cuir et accessoires en bronze nécessaires à l'entretien du complexe d'entraînement des éléphants et à l'équipement de ses bêtes de guerre."
 nd_lxa_trading_post_maintenance: "Entretien du poste de traite"
 nd_lxa_trading_post_maintenance_desc: "Timber for dock repair, tar for the hulls of the river boats, and pottery for storage vessels."
 nd_lxa_stupa_maintenance: "Entretien du stupa"
 nd_lxa_stupa_maintenance_desc: "Feuille d'argent pour la dorure et cire d'abeille pour les offrandes cérémonielles."
 nd_lxa_palace_maintenance: "Entretien du palais"
 nd_lxa_palace_maintenance_desc: "Le bois, l'argent et les textiles raffinés soutiennent le palais royal, meublent ses salles et maintiennent la splendeur attendue de la monarchie laotienne."
 nd_lxa_benzoin_processing: "Transformation du benjoin"
 nd_lxa_benzoin_processing_desc: "Les ouvriers récoltent la résine de benjoin des styrax des hautes terres et la transforment avec de la cire d'abeille en encens fini, prisé dans les réseaux commerciaux asiatiques, de l'Inde à la Chine."
 nd_lxa_ivory_carving: "Sculpture en ivoire"
 nd_lxa_ivory_carving_desc: "Des sculpteurs qualifiés transforment les défenses d'éléphant en produits de luxe, en objets religieux et en cadeaux diplomatiques à l'aide d'outils manuels raffinés."
 nd_lxa_lac_production: "Lac Production"
 nd_lxa_lac_production_desc: "La résine de lac récoltée dans la forêt est transformée avec des substrats de bois en laques fines pour le commerce artisanal du royaume."
 nd_lxa_sticky_rice: "Culture du riz gluant"
 nd_lxa_sticky_rice_desc: "Les rizières irriguées cultivent du riz gluant en utilisant le travail des animaux et des techniques agricoles traditionnelles laotiennes, produisant ainsi la céréale de base qui définit la vie communautaire laotienne."
 nd_lxa_manuscript_copying: "Copie de manuscrits"
 nd_lxa_manuscript_copying_desc: "Pali scriptures are copied onto palm leaves with an iron stylus, inked with soot, and bound between wooden covers, spreading Buddhist learning across the kingdom."
 nd_lxa_formed_tt: "Lan Xang a été formé"
 nd_lxa_path_a_tt: "Choisissez le million d'éléphants"
 nd_lxa_path_b_tt: "Choisissez le parasol blanc"
 nd_lxa_destiny: "Destin de Lan Xang"
 nd_lxa_destiny_desc: "Le royaume est restauré. Maintenant, son destin doit être forgé, à travers le tonnerre des éléphants ou la lumière du dharma."
 nd_lxa_dest_khorat: "Assujettissement de Khorat"
 nd_lxa_dest_khorat_desc: "The kingdom's dominion is extended over the Shan highlands. The muang of Kengtung acknowledges Lan Xang's supremacy, by diplomacy or by force, and the war elephants of the crown are kept in three kraals."
 nd_lxa_dest_mekong_hegemony: "Hégémonie du Mékong"
 nd_lxa_dest_mekong_hegemony_desc: "The great Khmer temples of Angkor, the Mekong crossroads at Stung Treng and Prey Nokor at the river's mouths fall under our control. The river belongs to Lan Xang from source to sea."
 nd_lxa_dest_white_elephants: "Seigneur des éléphants blancs"
 nd_lxa_dest_white_elephants_desc: "Only a king who commands both Pegu and Ayutthaya, and whose elephants fill eight kraals, can claim dominion over all of mainland Southeast Asia. Let the white elephants bow to our throne."
 nd_lxa_dest_sangha_heart: "Cœur de la Sangha"
 nd_lxa_dest_sangha_heart_desc: "Laissez notre royaume devenir le cœur battant de l’apprentissage Theravada. Avec des finances saines et le commerce de l’ivoire qui circule sur nos marchés, nous pouvons construire des monastères qui attireront des érudits du monde bouddhiste."
 nd_lxa_dest_silk_road: "La route de la soie du Mékong"
 nd_lxa_dest_silk_road_desc: "Soie, ivoire, benjoin, peaux de cerf : les produits de nos forêts et de nos métiers à tisser doivent atteindre tous les marchés d'Asie. Que Vientiane devienne le carrefour du commerce du Mékong."
 nd_lxa_dest_light_theravada: "Lumière de Theravada"
 nd_lxa_dest_light_theravada_desc: "The dharma shall radiate from our kingdom as light from a golden stupa. Let Muang Sua, the city of the Phra Bang, grow into a seat of learning that draws monks from every Buddhist land. With learning, prosperity, and faith, Lan Xang becomes the spiritual center of all Buddhist peoples."
 nd_lxa_dest_vientiane_developed_tt: "We own #bold Vientiane#! and its development is at least #bold 29#!"
 nd_lxa_dest_muang_sua_developed_tt: "We own #bold Muang Sua#! and its development is at least #bold 41#!"
 nd_lxa_dest_three_kraals_tt: "An #bold Elephant Kraal#! stands in at least #bold 3#! of our locations"
 nd_lxa_dest_eight_kraals_tt: "An #bold Elephant Kraal#! stands in at least #bold 8#! of our locations"
 nd_lxa.5.t: "Le Royaume restauré"
 nd_lxa.5.d: "The ancient borders of Lan Xang are once more united under a single crown. From the highlands where the Mekong springs to the broad Khorat Plateau, the Land of a Million Elephants stands whole again.\n\nBut restoration is only the beginning. The great powers of Southeast Asia (Burma, Siam, Vietnam, and the Khmer) encircle our realm. Lan Xang has always lived in the shadow of greater neighbors, surviving through cunning, terrain, and the fearsome reputation of our war elephants.\n\nThe question now is whether we shall remain in that shadow, or step beyond it."
 nd_lxa.5.a: "Notre destin nous attend."
 nd_lxa.6.t: "Les hautes terres Shan soumises"
 nd_lxa.6.d: "The mountain fortress of Kengtung has submitted to the authority of Lan Xang. The Shan muang, long accustomed to playing the great powers against one another, have recognized that the Land of a Million Elephants is no longer content to remain within its traditional borders.\n\nOur elephant corps moved through the highland passes with practiced ease, terrain that would have broken a lowland army was merely another day's march for our mahouts. The Shan saw the column approaching and knew that resistance meant destruction."
 nd_lxa.6.a: "Les hauts plateaux sont à nous."
 nd_lxa.7.t: "Maîtres du Mékong"
 nd_lxa.7.d: "The ancient temple complex of Angkor Wat, that wonder of the Khmer world, now flies the banner of Lan Xang. Our armies have swept down the Mekong, taking Stung Treng and establishing control over the great river's entire navigable length.\n\nThe Khmer, who once sheltered the exiled Fa Ngum and gave him armies to conquer these very lands, now find their positions reversed. The student has surpassed the teacher.\n\nThis hegemony can be consolidated through military dominance of the river, or through a tributary system that binds conquered peoples to our court."
 nd_lxa.7.a: "Nos galères fluviales patrouilleront dans chaque tronçon."
 nd_lxa.7.b: "Que les vaincus rendent hommage et gardent leurs coutumes."
 nd_lxa.8.t: "Seigneur des éléphants blancs"
 nd_lxa.8.d: "Pegu and Ayutthaya, the capitals of Burma and Siam, kneel before the throne of Lan Xang. No Lao king has ever achieved what we have accomplished: dominion over the entire mainland of Southeast Asia, from the Irrawaddy to the Mekong delta.\n\nThe white elephants, rarest of all, have been gathered from every corner of the realm as symbols of universal sovereignty. In the court traditions of Southeast Asia, possession of white elephants is the ultimate mark of a righteous king whose merit shines across the world.\n\nHow shall we rule this vast domain?"
 nd_lxa.8.a: "En tant que seigneurs éléphants : nos bêtes de guerre imposent notre volonté."
 nd_lxa.8.b: "En tant que monarques universels : notre empire perdure."
 nd_lxa.9.t: "La Sangha s'épanouit"
 nd_lxa.9.d: "The monasteries of Lan Xang have become renowned throughout the Theravada world. Monks travel from as far as Ceylon and Burma to study at our wats, drawn by the quality of our Pali scholarship and the generous patronage of the crown.\n\nThe elephant trade, that most iconic commerce of our kingdom, fills the royal treasury, funding the construction of new temples and the copying of sacred manuscripts. Banking institutions have taken root, allowing us to finance grand works of merit."
 nd_lxa.9.a: "Le dharma devient chaque jour plus fort."
 nd_lxa.10.t: "La route de la soie du Mékong"
 nd_lxa.10.d: "Vientiane has become the great crossroads of the Mekong basin. Silk from our looms, ivory from our forests, and benzoin incense from our highlands flow downriver to meet Chinese porcelain, Indian cloth, and European curiosities flowing upriver.\n\nThe Dutch merchant van Wuysthoff, upon visiting our capital, reported to his superiors that the wealth of Lan Xang rivaled any kingdom in the East. Our markets teem with goods from every corner of Asia.\n\nShall we press our advantage through mercantile expansion or through developing our domestic craft traditions?"
 nd_lxa.10.a: "Que nos marchands s'étendent loin le long du Mékong."
 nd_lxa.10.b: "Laissez nos artisans perfectionner leur artisanat à la maison."
 nd_lxa.11.t: "Lumière de Theravada"
 nd_lxa.11.d: "The great monasteries of Lan Xang have become the foremost centers of Theravada learning in all of Asia. Our palm-leaf manuscripts, copied with meticulous care by generations of monks, preserve the Pali canon in its purest form. Scholars from every Buddhist kingdom send their brightest pupils to study at our viharas.\n\nThe printing press has arrived in our kingdom, and its first products are not secular texts but the sacred scriptures themselves, now multiplied a thousandfold and sent as gifts to monasteries across the Buddhist world.\n\nLan Xang has become what Fa Ngum dreamed: not merely a kingdom, but a beacon of the dharma. The white parasol shelters all."
 nd_lxa.11.a: "Le Dharma protège ceux qui le protègent."
 nd_lxa.11.b: "Nos stupas inspireront les fidèles pour toujours."
 STATIC_MODIFIER_NAME_nd_lxa_dest_mekong_dominance: "Dominance du Mékong"
 STATIC_MODIFIER_DESC_nd_lxa_dest_mekong_dominance: "Le Mékong est à nous de la source à la mer, et nos galères fluviales imposent notre volonté à chaque navire qui sillonne ses eaux."
 STATIC_MODIFIER_NAME_nd_lxa_dest_vassal_tribute: "Hommage vassal"
 STATIC_MODIFIER_DESC_nd_lxa_dest_vassal_tribute: "Les peuples conquis paient tribut et servent dans nos levées, liés à Lan Xang par serment et obligation plutôt que par occupation directe."
 STATIC_MODIFIER_NAME_nd_lxa_dest_elephant_emperor: "Empereur éléphant"
 STATIC_MODIFIER_DESC_nd_lxa_dest_elephant_emperor: "Les éléphants de guerre de Lan Xang sont les plus beaux de toute l'Asie, élevés dans des complexes royaux, blindés de bronze et commandés par les cornacs les plus qualifiés du monde."
 STATIC_MODIFIER_NAME_nd_lxa_dest_mekong_imperium: "Impérial du Mékong"
 STATIC_MODIFIER_DESC_nd_lxa_dest_mekong_imperium: "Un vaste empire s’étendant sur le continent asiatique du Sud-Est, maintenu par le fleuve Mékong et le prestige de la couronne laotienne."
 STATIC_MODIFIER_NAME_nd_lxa_dest_river_merchants: "Marchands fluviaux"
 STATIC_MODIFIER_DESC_nd_lxa_dest_river_merchants: "Les marchands de Vientiane parcourent le Mékong, leurs bateaux chargés de soie et d'ivoire, reliant les forêts des hauts plateaux à la mer."
 STATIC_MODIFIER_NAME_nd_lxa_dest_craft_guilds: "Guildes d'artisanat"
 STATIC_MODIFIER_DESC_nd_lxa_dest_craft_guilds: "Les guildes d'artisans de Lan Xang se sont organisées en corps puissants, leurs tisserands de soie, leurs laqueurs et leurs sculpteurs d'ivoire produisant des produits qui rivalisent avec ceux d'Asie."
 STATIC_MODIFIER_NAME_nd_lxa_dest_dharma_shield: "Bouclier du Dharma"
 STATIC_MODIFIER_DESC_nd_lxa_dest_dharma_shield: "La sangha protège le royaume aussi sûrement que n’importe quelle armée. Nos moines transmettent le dharma dans tous les coins du royaume, unissant les gens dans la foi."
 STATIC_MODIFIER_NAME_nd_lxa_dest_golden_stupa: "Le Stupa doré"
 STATIC_MODIFIER_DESC_nd_lxa_dest_golden_stupa: "Nos stupas, recouverts de feuilles d'or et s'élevant au-dessus de la canopée de la jungle, attirent les pèlerins et les marchands du monde bouddhiste, remplissant notre royaume de dévotion et de prospérité."
 nd_lxa_royal_elephant_compound: "Complexe de l'éléphant royal"
 nd_lxa_royal_elephant_compound_desc: "Un grand complexe royal pour l'élevage, le dressage et le blindage d'éléphants de guerre à l'échelle industrielle, produisant les meilleurs éléphants de combat de toute l'Asie du Sud-Est."
 nd_lxa_great_vihara: "Grand Vihara"
 nd_lxa_great_vihara_desc: "Une magnifique salle d'apprentissage bouddhiste et un complexe monastique, le principal centre d'érudition pali dans le monde Theravada, attirant des moines et des pèlerins de toute l'Asie."
 nd_lxa_elephant_compound_maintenance: "Entretien du complexe des éléphants"
 nd_lxa_elephant_compound_maintenance_desc: "Les aliments pour le bétail, les enclos en bois et les armures en bronze soutiennent le programme d'élevage des éléphants royaux."
 nd_lxa_vihara_maintenance: "Entretien du Vihara"
 nd_lxa_vihara_maintenance_desc: "Des bougies en cire d'abeille, du papier pour les manuscrits et de l'encens pour la méditation soutiennent les activités érudites et spirituelles du grand monastère."

 # ===== BUREAUCRACIES =====
 lxa_senabodi_bureaucracy: "Senabodi"
 lxa_senabodi_bureaucracy_desc: "Le haut conseil des ministres supérieurs (maha-sena et thao phraya) par l'intermédiaire duquel le roi suprême Cao dirigeait Lan Xang. Codifié sous Samsenthai (r. 1373-1416), le Senabodi était un cercle fermé issu d'une poignée de grands palais de justice ; sa concentration de l'autorité entre les mains de l'aristocratie rendit le gouvernement central redoutable tant que le conseil resta uni, mais produisit les rivalités factionnelles qui divisèrent le royaume en Vientiane, Luang Prabang et Champassak en 1707."
 lxa_mueang_long_bureaucracy: "Centre rituel de Mueang-Long"
 lxa_mueang_long_bureaucracy_desc: "La ville royale sacrée comme cœur rituel et politique du royaume - Muang Sua sous Fa Ngum, puis Vieng Chan à partir de 1560 sous Setthathirath. Le Bouddha Phra Bang (offert par la cour khmère vers 1359) et à partir de 1565 le Bouddha d'émeraude Phra Keo au Wat Pha Kaeo étaient la palladia du royaume. Le cycle annuel de Bun Phra Wet, le festival du stupa de That Luang et le rite royal du labour liaient la dynastie, la sangha et la capitale en un seul ordre rituel dont l'effondrement retraçait celui du royaume."
 lxa_sangha_raja_bureaucracy: "Hiérarchie Sangha-Raja"
 lxa_sangha_raja_bureaucracy_desc: "La hiérarchie bouddhiste Theravada formalisée par Fa Ngum et sa reine khmère Keo Kaengkanya, avec le résident Sangha-Raja royalement nommé à Wat That Luang comme chef de l'ordre. Le réseau d'écoles wat enseignait le pali, la doctrine et l'écriture lao tham, produisant ainsi une couche alphabétisée de chefs de village et de scribes. Son expansion s'est faite au détriment des anciens cultes spirituels satsana phi, aliénant les Khmu vivant dans les forêts et les peuples des hautes terres dont le culte était hors de portée de la sangha."
 lxa_khoa_aphai_bureaucracy: "Compact vassal Khoa-aphai"
 lxa_khoa_aphai_bureaucracy_desc: "The tributary compact by which the great vassal mueang of the Lan Xang sphere (Phuan at Xieng Khouang, the Sipsongchuthai twelve cantons, Houaphanh, the Khorat tributaries) rendered annual kham-kong tribute in silver, lacquer, and textiles to the Cao while keeping their hereditary chao-mueang and local courts. The compact extended royal reach without direct administration but structurally shared sovereignty with the periphery, a fragility that fractured under Burmese and Vietnamese pressure after 1560."
 lxa_kha_lao_tribute_bureaucracy: "Hommage aux hautes terres de Kha-Lao"
 lxa_kha_lao_tribute_bureaucracy_desc: "Le système d'extraction par lequel les marchands des plaines du Lao chao-mueang et de la vallée du Mékong tiraient un tribut annuel en produits forestiers - cardamome, benjoin, sticklac, bois d'aigle, peaux de cerf, ivoire d'éléphant - des Khmu, des Ksing-Mul et d'autres peuples des hautes terres collectivement appelés kha (serviteur). Le tribut alimentait le commerce à longue distance du Mékong avec Ayutthaya et Hué tout en consolidant le statut juridique de seconde classe des populations des hautes terres, défaut structurel qui a déclenché à plusieurs reprises des révoltes dans les hautes terres."

