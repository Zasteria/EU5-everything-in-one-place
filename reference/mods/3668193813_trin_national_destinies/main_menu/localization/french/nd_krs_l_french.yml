l_french:
 STATIC_MODIFIER_NAME_nd_legacy_of_saladin: "L'héritage de Saladin"
 STATIC_MODIFIER_DESC_nd_legacy_of_saladin: "Le sang des Ayyoubides coule dans les veines kurdes. Depuis les montagnes du Kurdistan, les guerriers qui unissaient autrefois le monde islamique sous Saladin chevauchent à nouveau, portant son héritage martial dans une nouvelle ère de conquête."
 STATIC_MODIFIER_NAME_nd_unity_of_the_emirates: "Unité des Émirats"
 STATIC_MODIFIER_DESC_nd_unity_of_the_emirates: "Les émirats kurdes (Soran, Baban, Bitlis, Bohtan, Ardalan) gouvernent depuis longtemps leurs vallées montagneuses avec une fière indépendance. Désormais unis sous une seule bannière, leur sagesse collective en matière de gouvernance et de diplomatie forge un État plus grand que n’importe quelle principauté."
 STATIC_MODIFIER_NAME_nd_krs_chaldiran_pact: "Pacte de Chaldiran"
 STATIC_MODIFIER_DESC_nd_krs_chaldiran_pact: "L'alliance forgée entre les émirs kurdes et le sultan ottoman lors de la bataille de Chaldiran a assuré l'autonomie et le prestige militaire des Kurdes. La cavalerie kurde s’est révélée décisive, et le pacte reste la preuve que les armes kurdes imposent le respect."
 nd_krs.1.t: "L'aube du Kurdistan"
 nd_krs.1.d: "The Kurdish people have long dwelt among the mountain fastnesses of the Zagros and Taurus, their tribal confederacies governing valleys that empires could never fully subdue. From the legacy of Saladin's Ayyubid dynasty to the autonomous emirates that carved their own domains between Ottoman and Safavid power, the Kurds have maintained an identity forged in highland stone and tempered by centuries of warfare.\n\nNow, with the formation of Kurdistan, a new chapter begins. The question facing the nation is fundamental: shall Kurdistan draw upon its martial heritage and project power outward as Saladin once did, or shall it consolidate the fractious emirates into a unified state whose strength lies in governance and cultural identity?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_krs.1.a: "Nous porterons l'épée de Saladin !"
 nd_krs.1.b: "Nous unirons les émirats en un seul peuple."
 nd_krs.2.t: "Le Sharafnama"
 nd_krs.2.d: "In 1597, Prince Sharaf Khan Bidlisi of the Bitlis Emirate completed his monumental work, the Sharafnama, the first comprehensive history of the Kurdish nation. Written in Persian to reach the widest possible audience, the Sharafnama chronicles the great Kurdish dynasties from antiquity through the Ayyubid golden age to the autonomous emirates of his own time.\n\nThe work documents the Marwanids of Amed, the Hasanwayhids, the Fadluyids, and above all the house of Saladin, weaving them into a single narrative of Kurdish civilization. For the first time, the story of the Kurdish people exists not in fragments of memory and oral tradition, but as a written record that can endure across generations.\n\nThe Sharafnama is both history and declaration, a statement that the Kurdish nation possesses a past worthy of its mountains, and a future deserving of recognition."
 nd_krs.2.a: "Notre histoire perdurera dans l'encre comme dans la pierre."
 nd_krs.3.t: "L'Alliance à Chaldiran"
 nd_krs.3.d: "In the summer of 1514, the Kurdish scholar and statesman Idris Bitlisi accomplished what no diplomat before him had managed: the unification of over twenty Kurdish emirs under a single military banner. Leveraging the Kurds' Sunni faith against the encroaching Safavid Shia state, Bitlisi persuaded the highland lords that their future lay with the Ottoman Sultan Selim I.\n\nKurdish cavalry proved decisive at the Battle of Chaldiran, where their knowledge of the terrain and fierce fighting turned the Ottoman flank against Shah Ismail's forces. In recognition, Selim sent fifteen banners and five hundred royal robes to the Kurdish princes, formalizing an arrangement of autonomy that would endure for centuries.\n\nThis alliance secured Kurdish self-governance within the Ottoman framework, the emirs retained hereditary rule, their own courts, and control of the mountain passes. It was not submission but partnership, bought with Kurdish blood on the battlefield."
 nd_krs.3.a: "Le pacte est scellé dans le sang et l’honneur."
 nd_krs.3.b: "Nous n’avons pas besoin d’alliés ; nos montagnes sont notre force."
 nd_krs_mountain_strongholds: "Forteresses de montagne"
 nd_krs_mountain_strongholds_desc: "Les hauts plateaux kurdes sont parsemés d'anciennes forteresses, Amadiya perchée sur son affleurement rocheux escarpé, Hasankeyf surplombant le Tigre depuis des falaises calcaires abruptes, des positions qui ont défié les envahisseurs pendant des millénaires."
 nd_krs_tribal_confederacy: "Confédération tribale"
 nd_krs_tribal_confederacy_desc: "La gouvernance kurde a longtemps fonctionné à travers des confédérations de tribus, chacune dirigée par un agha ou beg, unies sous des chefs suprêmes qui équilibrent l'autonomie avec la défense collective."
 nd_krs_kurdish_horsemanship: "L'équitation kurde"
 nd_krs_kurdish_horsemanship_desc: "Le plateau kurde élevait à la fois des cavaliers habiles et des chevaux de montagne robustes. La cavalerie kurde a servi sous les Ayyoubides, combattant de Damas jusqu'en Égypte."
 nd_krs_ayyubid_legacy: "L'héritage ayyoubide"
 nd_krs_ayyubid_legacy_desc: "Saladin al-Ayyubi, né du clan kurde Rawadiya, fonda une dynastie qui unifia l'Égypte et la Syrie et reconquit Jérusalem. Son héritage de prouesses martiales et de gouvernance juste définit l’identité kurde."
 nd_krs_highland_shepherds: "Bergers des Highlands"
 nd_krs_highland_shepherds_desc: "La migration saisonnière des éleveurs kurdes entre les pâturages d’été des hautes terres et les pâturages d’hiver des basses terres a soutenu une économie de laine, de fromage et de bétail antérieure aux empires."
 nd_krs_frontier_raiders: "Pilleur de frontières"
 nd_krs_frontier_raiders_desc: "Les membres des tribus kurdes aux frontières entre les grands empires ont fait du raid une forme d'art, frappant depuis des cols de montagne et disparaissant dans un terrain qu'aucun poursuivant ne pouvait parcourir."
 nd_krs_caravan_waystations: "Stations de passage pour caravanes"
 nd_krs_caravan_waystations_desc: "Les cols montagneux du Kurdistan chevauchent les routes commerciales terrestres entre la Mésopotamie, la Perse et l’Anatolie. Les relais kurdes fournissaient abri, fourrage et protection aux marchands traversant les hauts plateaux."
 nd_krs_sufi_lodges: "Sheikhs of the Qadiriya"
 nd_krs_sufi_lodges_desc: "The Qadiri order takes root in the Kurdish highlands through families of sayyids such as the Barzinji, who keep a tekiye in each valley. The sheikh feeds the traveller, shelters the fugitive, and is asked to judge between tribes at feud."
 nd_krs_mountain_ambush: "Tactiques d'embuscade en montagne"
 nd_krs_mountain_ambush_desc: "Les guerriers kurdes ont perfectionné l'art des embuscades en montagne, frappant d'en haut dans des défilés étroits où la supériorité numérique ne compte pour rien et où la connaissance du terrain vaut plus que n'importe quelle fortification."
 nd_krs_emirate_courts: "Tribunaux des Émirats"
 nd_krs_emirate_courts_desc: "Les cours des émirs kurdes (Bitlis, Soran, Ardalan, Baban) étaient des centres de poésie persane et kurde, d’érudition historique et de mécénat artistique qui rivalisaient avec de nombreuses cours royales."
 nd_krs_kurdish_bowmen: "Archers kurdes"
 nd_krs_kurdish_bowmen_desc: "Les archers kurdes, formés dès leur jeunesse dans les vallées montagneuses, pouvaient tirer des flèches depuis des positions qu'aucune cavalerie ne pouvait atteindre et qu'aucune infanterie ne pouvait prendre d'assaut."
 nd_krs_chaldiran_alliance: "Alliance Chaldiréenne"
 nd_krs_chaldiran_alliance_desc: "L'alliance entre vingt émirs kurdes et le sultan Selim Ier lors de la bataille de Chaldiran a assuré l'autonomie kurde dans le cadre ottoman et s'est avérée décisive dans le choc des empires."
 nd_krs_diyarbakir_citadel: "Citadelle de Diyarbakir"
 nd_krs_diyarbakir_citadel_desc: "Les murs de basalte de Diyarbakir s'étendent sur cinq kilomètres, mesurant trente pieds de haut et seize pieds d'épaisseur, parmi les fortifications les plus formidables du Moyen-Orient, un site du patrimoine mondial de l'UNESCO d'importance militaire durable."
 nd_krs_sharafnama: "Le Sharafnama"
 nd_krs_sharafnama_desc: "Le Sharafnama de 1597, écrit par le prince Sharaf Khan Bidlisi, est la première histoire complète de la nation kurde, une chronique des dynasties, des batailles et des traditions qui ont donné une forme littéraire à l'identité kurde."
 nd_krs_silk_road_tolls: "Péages de la Route de la Soie"
 nd_krs_silk_road_tolls_desc: "Kurdish emirates levied tolls on the caravans crossing their mountain passes between Mesopotamia and Persia, turning geography into revenue and making Kurdish goodwill essential for overland commerce."
 nd_krs_irregular_warfare: "Guerre irrégulière"
 nd_krs_irregular_warfare_desc: "Les combattants kurdes ont développé une guerre adaptée à leur terrain, mobile, décentralisée, frappant depuis des positions que les armées régulières ne pouvaient pas atteindre et se retirant dans des montagnes qu’ils considéraient comme leur propre foyer."
 nd_krs_baban_governance: "Gouvernance Baban"
 nd_krs_baban_governance_desc: "L’émirat de Baban, centré sur Sulaimani à partir de 1784, a développé des systèmes administratifs sophistiqués combinant tradition tribale et pratique bureaucratique ottomane, gouvernant le cœur du Kurde pendant deux siècles."
 nd_krs_hamidiye_cavalry: "Régiments à cheval kurdes"
 nd_krs_hamidiye_cavalry_desc: "La cavalerie kurde a servi dans les campagnes ottomanes à travers le Moyen-Orient, apportant son équitation de montagne et sa féroce loyauté tribale aux guerres impériales de Bagdad au Caucase."
 nd_krs_kurdish_madrasas: "Medreses of the Emirs"
 nd_krs_kurdish_madrasas_desc: "The Kurdish emirs endow medreses beside their courts, as the lords of Botan did with the Red Medrese of Cizre and the lords of Bahdinan with the Qubahan of Amadiya. Their students read law in Arabic and verse in Kurdish, and from them come the jurists and poets of the emirates."
 nd_krs_border_autonomy: "Autonomie des frontières"
 nd_krs_border_autonomy_desc: "Les émirs kurdes maintenaient leur autonomie gouvernementale à la frontière ottomane-safavide, leur autonomie étant garantie par leur valeur militaire en tant que gardiens des cols montagneux entre les empires."
 nd_krs_peshmerga_tradition: "Tradition peshmerga"
 nd_krs_peshmerga_tradition_desc: "Les Peshmergas, « ceux qui font face à la mort », décrivent la philosophie guerrière kurde. Des gardes-frontières tribaux aux combattants organisés, la tradition peshmerga représente un dévouement discipliné et altruiste à la défense des terres kurdes."
 nd_krs_tribal_modernization: "Modernisation tribale"
 nd_krs_tribal_modernization_desc: "La transformation de la gouvernance tribale kurde vers des structures administratives plus centralisées, adoptant des méthodes modernes de fiscalité, d’éducation et d’organisation militaire tout en préservant l’identité tribale."
 nd_krs_mountain_fortifications: "Fortifications de montagne"
 nd_krs_mountain_fortifications_desc: "Fortification systématique des cols de montagne et des hauteurs stratégiques kurdes, s'appuyant sur des millénaires d'architecture défensive d'Urartu jusqu'à la période médiévale de l'émirat pour créer des réseaux complets de défense des hautes terres."
 nd_krs_highland_trade_networks: "Réseaux commerciaux des Highlands"
 nd_krs_highland_trade_networks_desc: "Kurdish merchants connected the towns and cities of the highlands through trade networks that moved wool, livestock, metalwork, and agricultural goods across the mountain terrain."
 nd_krs_kurdish_printing: "Impression kurde"
 nd_krs_kurdish_printing_desc: "The spread of printing technology enabled the dissemination of Kurdish literature and historical works, strengthening cultural identity and literacy across the scattered mountain communities."
 nd_krs_national_awakening: "Réveil national"
 nd_krs_national_awakening_desc: "L’émergence d’une identité nationale kurde consciente, s’appuyant sur l’héritage littéraire des Sharafnama, les traditions martiales des peshmergas et l’expérience partagée de l’autonomie des montagnes."
 nd_krs_modern_irregulars: "Irréguliers modernes"
 nd_krs_modern_irregulars_desc: "Les combattants irréguliers kurdes se sont adaptés à la guerre moderne tout en conservant leurs avantages en montagne, combinant connaissance du terrain et armes modernes pour créer des forces que les armées conventionnelles ne pouvaient pas réprimer."
 nd_krs_highland_industry: "Industrie des Highlands"
 nd_krs_highland_industry_desc: "Le développement de la capacité industrielle dans les villes des hautes terres kurdes, transformant les matières premières locales et produisant des biens destinés à la fois à la consommation intérieure et au commerce régional."
 nd_krs_constitutional_movement: "Mouvement constitutionnel"
 nd_krs_constitutional_movement_desc: "Participation kurde aux mouvements constitutionnels et de réforme, cherchant la reconnaissance formelle des droits et de la gouvernance kurdes dans des cadres politiques en évolution."
 a_nd_krs_tribal_cavalry: "Cavalerie tribale kurde"
 a_nd_krs_tribal_cavalry_desc: "Cavalerie légère issue des confédérations tribales kurdes, compétente dans les raids et la reconnaissance sur les terrains de montagne et de plateau."
 a_nd_krs_highland_raiders: "Pillards des Highlands"
 a_nd_krs_highland_raiders_desc: "Des combattants de montagne kurdes qui frappent depuis des positions cachées dans les cols des hautes terres, utilisant l'avantage du terrain pour vaincre leur supériorité numérique."
 a_nd_krs_bowmen: "Archers kurdes"
 a_nd_krs_bowmen_desc: "Des archers qualifiés formés dans les vallées montagneuses, capables de tirer avec précision depuis des positions que la cavalerie ne peut pas atteindre et que l'infanterie ne peut pas prendre d'assaut."
 a_nd_krs_mountain_ambushers: "Embuscades de montagne"
 a_nd_krs_mountain_ambushers_desc: "Guérilla spécialisée dans les tactiques d'embuscade en montagne, utilisant des défilés étroits et des terrains rocheux pour avoir un effet dévastateur contre les forces conventionnelles."
 a_nd_krs_chaldiran_cavalry: "Cavalerie Chaldiréenne"
 a_nd_krs_chaldiran_cavalry_desc: "La cavalerie lourde kurde s'inspirait des cavaliers qui combattaient aux côtés des Ottomans à Chaldiran, combinant férocité tribale et discipline organisée sur le champ de bataille."
 a_nd_krs_mountain_guns: "Artillerie de montagne"
 a_nd_krs_mountain_guns_desc: "Artillerie légère adaptée à la guerre en montagne, conçue pour être transportée dans des cols étroits et déployée sur des hauteurs surplombant les positions ennemies."
 a_nd_krs_peshmerga: "Peshmergas"
 a_nd_krs_peshmerga_desc: "Infanterie de montagne disciplinée incarnant la tradition peshmerga, ceux qui font face à la mort. Habiles aux combats défensifs et à la guerre en montagne, ils constituent l’épine dorsale de la résistance kurde."
 a_nd_krs_modern_irregulars: "Irréguliers kurdes modernes"
 a_nd_krs_modern_irregulars_desc: "Une infanterie de guérilla rapide, combinant des armes modernes avec la connaissance traditionnelle kurde du terrain montagneux, frappant depuis des positions que les forces conventionnelles ne peuvent pas atteindre."
 nd_krs_mountain_stronghold: "Forteresse de montagne"
 nd_krs_mountain_stronghold_desc: "Une position de montagne fortifiée dans la tradition des hauts plateaux kurdes, utilisant le terrain naturel pour créer un point fort défensif qui domine les vallées environnantes."
 nd_krs_caravan_waystation: "Station de passage de caravane"
 nd_krs_caravan_waystation_desc: "Une étape sur les routes commerciales de montagne, offrant abri, fourrage et sécurité aux caravanes traversant les territoires kurdes entre la Mésopotamie et la Perse."
 nd_krs_sufi_lodge: "Qadiri Tekiye"
 nd_krs_sufi_lodge_desc: "The house of a Qadiri sheikh. Tribes at feud bring their quarrel here, and the sheikh's word settles the blood money and the grazing bounds. The poor are fed at its door, and the dervishes hold their dhikr in its hall."
 nd_krs_citadel: "Citadelle kurde"
 nd_krs_citadel_desc: "Une fortification urbaine majeure dans la tradition des légendaires murs de basalte de Diyarbakir, épais, hauts et construits pour résister au siège pendant des générations."
 nd_krs_madrasa: "Emir's Medrese"
 nd_krs_madrasa_desc: "A school endowed by a Kurdish emir beside his court. Its mullahs teach law and grammar, and its students copy and recite the Kurdish verse of Malaye Jaziri and Ahmad Khani, so that the language of the mountains has books of its own."
 nd_krs_highland_trade_post: "Poste commercial des Highlands"
 nd_krs_highland_trade_post_desc: "Une plaque tournante commerciale dans les hauts plateaux kurdes, reliant les communautés montagnardes aux marchés régionaux et facilitant les échanges de laine, de bétail et de ferronnerie."
 nd_krs_highland_forge: "Forge des Hautes Terres"
 nd_krs_highland_forge_desc: "Un atelier industriel dans les hauts plateaux kurdes, transformant le fer et le cuivre locaux en outils, armes et biens commerciaux pour l'économie régionale."
 nd_krs_zozan: "Zozan"
 nd_krs_zozan_desc: "A summer camp on the high pastures. The herding tribes leave their winter quarters in spring, climb with their flocks to the zozan, and return in autumn with the wool."
 nd_krs_printing_house: "Kurdish Printing House"
 nd_krs_printing_house_desc: "A press set up beside an emir's medrese. The verse of Ahmad Khani and Malaye Jaziri, long copied by hand in the students' cells, is printed here."
 nd_krs_highland_pastoral: "Summer Flocks"
 nd_krs_highland_pastoral_desc: "Flocks are driven up to the high pastures for the summer and shorn there. Salt is carried up for the animals, and the wool comes down with the tribe in autumn."
 nd_krs_printing_works: "Imprimerie kurde"
 nd_krs_printing_works_desc: "Paper, type metal and a wooden press. The works of the medrese poets and the chronicles of the emirates are set and printed for sale."
 levy_nd_krs_mountain_ambushers: "Prélèvement sur les embuscades en montagne"
 levy_nd_krs_mountain_ambushers_desc: "Guerriers tribaux issus des communautés montagnardes, experts dans les tactiques d'embuscade de guérilla et intimement liés au terrain de leur patrie."
 levy_nd_krs_highland_raiders: "Prélèvement des pillards des Highlands"
 levy_nd_krs_highland_raiders_desc: "Infanterie de raid rapide issue des tribus frontalières kurdes, experte dans l'art de frapper depuis les cols de montagne et de disparaître dans les hauts plateaux."
 nd_krs_stronghold_maintenance: "Entretien de la forteresse"
 nd_krs_stronghold_maintenance_desc: "Entretenir les fortifications en pierre, l'armurerie et l'équipement en cuir d'une forteresse de montagne."
 nd_krs_waystation_maintenance: "Opérations des stations de passage"
 nd_krs_waystation_maintenance_desc: "Approvisionnement d'un relais de caravane en nourriture, fourrage, sel et abri pour les marchands ambulants."
 nd_krs_lodge_maintenance: "Tekiye Upkeep"
 nd_krs_lodge_maintenance_desc: "The tekiye is kept in wool and cloth for its carpets and the dervishes' cloaks, and in incense for the nights of dhikr."
 nd_krs_citadel_maintenance: "Entretien de la Citadelle"
 nd_krs_citadel_maintenance_desc: "Entretenir les murs massifs, les armureries, les outils et l'équipement en cuir d'une grande citadelle urbaine et de sa garnison."
 nd_krs_madrasa_maintenance: "Medrese Upkeep"
 nd_krs_madrasa_maintenance_desc: "The medrese is supplied with paper, books and cloth for its teachers and the students lodged in its cells."
 nd_krs_trade_post_maintenance: "Opérations des postes commerciaux"
 nd_krs_trade_post_maintenance_desc: "Exploitation d'un centre commercial sur les hautes terres, gestion de l'échange de textiles, de laine et de sel sur les routes de montagne."
 nd_krs_forge_maintenance: "Opérations de forge"
 nd_krs_forge_maintenance_desc: "Fusion du fer avec du charbon de bois pour forger des outils et de la ferronnerie dans un atelier de montagne."
 STATIC_MODIFIER_NAME_nd_krs_self_reliance: "L'autonomie kurde"
 STATIC_MODIFIER_DESC_nd_krs_self_reliance: "Les montagnes du Kurdistan sont une véritable forteresse. Sans alliés à qui plaire ni obligations à honorer, le peuple kurde est seul et fort."
 nd_krs_formed_tt: "Le Kurdistan est formé"
 nd_krs_path_a_tt: "Choisissez l'héritage de Saladin"
 nd_krs_path_b_tt: "A choisi l'unité des Émirats"
 nd_krs_destiny: "Destin du Kurdistan"
 nd_krs_destiny_desc: "Le Kurdistan est sorti des cols montagneux. La question est maintenant de savoir si cette nation suivra la voie martiale de Saladin ou bâtira sa force grâce à l’unité de ses traditions d’émirat."
 nd_krs_dest_mosul: "Les portes de Ninive"
 nd_krs_dest_mosul_desc: "Mossoul et Erbil, les grandes villes de la haute Mésopotamie, doivent tomber sous domination kurde. Ces anciens sièges du pouvoir dominent la vallée du Tigre et ouvrent la route vers la Syrie."
 nd_krs_dest_aleppo: "La marche syrienne"
 nd_krs_dest_aleppo_desc: "Alep, joyau du nord de la Syrie, et Mardin, forteresse des Artoukides, doivent répondre à l'autorité kurde. Les héritiers de Saladin se dirigent vers le sud le long des routes empruntées par leurs ancêtres."
 nd_krs_dest_damascus: "La restauration ayyoubide"
 nd_krs_dest_damascus_desc: "Damas, Jérusalem et Le Caire, les trois piliers de l'empire de Saladin. Les détenir tous, c’est restaurer intégralement le domaine ayyoubide, dynastie kurde régnant du Nil au Zagros."
 nd_krs_dest_baban: "La consolidation de Baban"
 nd_krs_dest_baban_desc: "L’émirat de Baban, centré sur Sulaymaniyah, a été le pionnier d’une gouvernance kurde sophistiquée. Sécurisez le cœur du pays, construisez des institutions et prouvez que l’unité kurde peut être forgée par la loi, et pas seulement par l’épée."
 nd_krs_dest_sharaf: "L'héritage de Sharaf Khan"
 nd_krs_dest_sharaf_desc: "Tout comme Sharaf Khan Bidlisi a relaté la grandeur kurde dans le Sharafnama, le Kurdistan doit désormais prouver sa profondeur civilisationnelle, à travers la prospérité, le prestige et la maîtrise de l’économie des hauts plateaux."
 nd_krs_dest_homeland: "La patrie kurde"
 nd_krs_dest_homeland_desc: "L’aboutissement ultime de la voie de l’émirat : un Kurdistan si prospère et si bien gouverné qu’il se présente comme une patrie permanente, ses institutions rivalisant avec n’importe quel empire, ses marchés regorgeant de soie et de commerce."
 nd_krs.4.t: "Le destin du Kurdistan"
 nd_krs.4.d: "Le Kurdistan a fait ses premiers pas sur le chemin de la grandeur. Les cols de montagne qui abritaient nos ancêtres marquent désormais les frontières d’une nation dont les ambitions s’étendent au-delà de toutes les vallées. Que ce soit par la conquête ou par la gouvernance, le peuple kurde est prêt à graver son destin dans les pierres de l’histoire."
 nd_krs.4.a: "Notre destin commence dans ces montagnes."
 nd_krs.5.t: "Les portes de Ninive"
 nd_krs.5.d: "The ancient cities of upper Mesopotamia, Mosul, with its bridges spanning the Tigris, and Erbil, whose citadel has been continuously inhabited for over six thousand years, now answer to Kurdish authority. From these commanding positions, the road to Syria lies open before us.\n\nThe last time Kurdish arms held such power in Mesopotamia, Saladin himself rode at their head. That legacy now lives again."
 nd_krs.5.a: "Mossoul et Erbil sont à nous. La Syrie attend."
 nd_krs.6.t: "La marche syrienne"
 nd_krs.6.d: "Aleppo's great citadel and Mardin's clifftop fortress have submitted to Kurdish sovereignty. The Ayyubid heirs have reclaimed the northern reaches of their ancestral domain, the trade routes between Mesopotamia and the Mediterranean now run through Kurdish lands.\n\nOur armies stand at the threshold of the Levant. The question is how we press forward: with the fury of holy war, or with the measured hand of frontier lords building lasting dominion."
 nd_krs.6.a: "Avec feu et foi, nous marchons vers le sud."
 nd_krs.6.b: "Consolider. Construisez des marches fidèles."
 nd_krs.7.t: "La restauration ayyoubide"
 nd_krs.7.d: "Damascus, Jerusalem, and Cairo, the three pillars upon which Saladin built his empire, all fly the Kurdish banner once more. The restoration of the Ayyubid domain is complete. From the banks of the Nile to the peaks of the Zagros, Kurdish authority is unchallenged.\n\nThis achievement demands a statement of purpose. Shall Kurdistan claim the mantle of leadership over the Islamic world, as Saladin did when he united the faithful against the Crusaders? Or shall we style ourselves guardians of the holy places, protectors rather than conquerors?"
 nd_krs.7.a: "Nous sommes les sultans de l’Islam renaissant."
 nd_krs.7.b: "Nous serons les gardiens des lieux saints."
 nd_krs.8.t: "La consolidation de Baban"
 nd_krs.8.d: "The work of the Baban emirs lives on in the governance of Kurdistan. Sulaymaniyah, the city they founded and nurtured, serves as proof that Kurdish administration can build lasting prosperity. Law codes, tax registers, and diplomatic channels now bind the emirates together more firmly than any oath of tribal allegiance.\n\nThe foundations are laid. What rises upon them will determine whether Kurdistan endures for an age or for eternity."
 nd_krs.8.a: "Les émirats sont unis en droit."
 nd_krs.9.t: "L'héritage de Sharaf Khan"
 nd_krs.9.d: "Kurdistan has achieved what Sharaf Khan Bidlisi could only chronicle, a prosperous, prestigious Kurdish state whose cultural achievements match its political ambitions. The highland economy thrives, wool flows through mountain markets, and Kurdish scholars debate in courts that command respect.\n\nThis moment calls for a choice of emphasis. Shall we invest in the scholars and madrasas that preserve Kurdish knowledge, or in the mountain merchants whose caravans carry Kurdish goods to distant markets?"
 nd_krs.9.a: "La plume est plus puissante que le sac à main."
 nd_krs.9.b: "Le commerce construit ce que les armées ne peuvent pas construire."
 nd_krs.10.t: "La patrie kurde"
 nd_krs.10.d: "Kurdistan has become everything the scattered emirates once dreamed of, a permanent homeland, prosperous and well-governed, its institutions rooted deep in mountain soil. The great powers may have their empires, but Kurdistan has something more durable: a nation built on the bedrock of shared identity and competent governance.\n\nThe final question is one of political philosophy. Shall Kurdistan embrace the confederal traditions of its emirate past, where autonomous provinces govern themselves within a loose union? Or shall it experiment with constitutional forms that channel popular sovereignty, a mountain republic unlike any the world has seen?"
 nd_krs.10.a: "La confédération perdure, tout comme nos montagnes."
 nd_krs.10.b: "Une république des hauts plateaux."
 STATIC_MODIFIER_NAME_nd_krs_dest_northern_jihad: "Jihad du Nord"
 STATIC_MODIFIER_DESC_nd_krs_dest_northern_jihad: "Les armées kurdes balayent la Syrie avec le zèle de saints guerriers, prenant d’assaut les fortifications et poussant l’offensive sans se soucier du coût. L’élan militaire est imparable, mais une campagne soutenue pèse sur la population."
 STATIC_MODIFIER_NAME_nd_krs_dest_frontier_lords: "Seigneurs des Frontières"
 STATIC_MODIFIER_DESC_nd_krs_dest_frontier_lords: "Plutôt que de se précipiter vers le sud, les seigneurs frontaliers kurdes étendent méthodiquement leur autorité par des soumissions négociées et une mise en garnison rapide. Les populations soumises sont rapidement pacifiées, même si l’accent mis sur l’administration militaire détourne les ressources des besoins civils."
 STATIC_MODIFIER_NAME_nd_krs_dest_sultan_of_islam: "Sultan de l'Islam"
 STATIC_MODIFIER_DESC_nd_krs_dest_sultan_of_islam: "Le Kurdistan revendique le leadership islamique, faisant écho au rôle d’unificateur des fidèles joué par Saladin. Le prestige religieux et l’autorité politique se renforcent mutuellement, et même les communautés hérétiques trouvent leur place dans la tolérance kurde."
 STATIC_MODIFIER_NAME_nd_krs_dest_guardian_of_jerusalem: "Gardien de Jérusalem"
 STATIC_MODIFIER_DESC_nd_krs_dest_guardian_of_jerusalem: "Plutôt que de revendiquer une autorité universelle, le Kurdistan se positionne comme le gardien des lieux saints, reconstruisant les terres déchirées par la guerre, entretenant des réseaux de forteresses et projetant un pouvoir discret par le biais du renseignement plutôt que de la proclamation."
 STATIC_MODIFIER_NAME_nd_krs_dest_highland_scholars: "Érudits des Highlands"
 STATIC_MODIFIER_DESC_nd_krs_dest_highland_scholars: "Les madrasas et les cercles universitaires kurdes prospèrent, produisant des diplômés qui servent comme administrateurs, juristes et poètes. L’économie des hautes terres bénéficie d’une gouvernance instruite et la population augmente à mesure que la prospérité se propage."
 STATIC_MODIFIER_NAME_nd_krs_dest_mountain_merchants: "Marchands de montagne"
 STATIC_MODIFIER_DESC_nd_krs_dest_mountain_merchants: "Les marchands kurdes étendent leur présence sur les routes commerciales des hautes terres, ramenant ainsi la richesse aux communautés montagnardes. Le coût de cette expansion commerciale se traduit par des coûts d’emprunt plus élevés à mesure que le crédit sort."
 STATIC_MODIFIER_NAME_nd_krs_dest_eternal_confederacy: "Confédération éternelle"
 STATIC_MODIFIER_DESC_nd_krs_dest_eternal_confederacy: "Le Kurdistan embrasse son héritage confédéral, accordant à chaque province de l’émirat une autonomie au sein d’une union souple mais durable. La diplomatie et les réseaux d’approvisionnement unissent la confédération sans centraliser l’autorité."
 STATIC_MODIFIER_NAME_nd_krs_dest_mountain_republic: "République de montagne"
 STATIC_MODIFIER_DESC_nd_krs_dest_mountain_republic: "Le Kurdistan expérimente une gouvernance constitutionnelle, un régime politique innovant et libéral où les sujets libres participent à la gouvernance. Une république des hautes terres différente de toutes celles imaginées par les anciens empires."
 nd_krs_ayyubid_palace: "Palais ayyoubide"
 nd_krs_ayyubid_palace_desc: "Un grand palais de tradition ayyoubide, alliant fortification martiale et splendeur courtoise. Ses salles font écho au souvenir de la cour de Saladin, où guerriers et érudits se rassemblaient sous le patronage kurde."
 nd_krs_palace_maintenance: "Entretien du palais"
 nd_krs_palace_maintenance_desc: "Entretenir les cours de cérémonie, les armureries et les bureaux administratifs d'un complexe palatial de style ayyoubide."
 nd_krs_emirate_chancellery: "Chancellerie de l'Émirat"
 nd_krs_emirate_chancellery_desc: "Un centre de gouvernance et d'administration kurde, où les traditions des tribunaux de l'émirat sont préservées et modernisées. Érudits, diplomates et commerçants travaillent sous un même toit pour gérer les affaires du Kurdistan uni."
 nd_krs_chancellery_maintenance: "Opérations de la Chancellerie"
 nd_krs_chancellery_maintenance_desc: "Fournir à un centre de gouvernance kurde du papier, des livres, des tissus fins et des meubles pour ses chambres administratives et ses archives scientifiques."

 # ===== BUREAUCRACIES =====
 krs_hakim_sancaks_bureaucracy: "Hakim Sançaks"
 krs_hakim_sancaks_bureaucracy_desc: "Les gouverneurs kurdes héréditaires établis par Selim I après la bataille de Chaldiran (1514), sur le conseil diplomatique d'Idris-i Bidlisi. Contrairement au sancak ottoman standard (à rotation, nommé bureaucratiquement), les grands émirats kurdes de Hakkari, Bitlis, Cizre/Bohtan et Imadiya/Bahdinan étaient enregistrés comme ocaklik : héréditaires dans la maison du mir local, exemptés de devshirme, conservant leurs contingents tribaux, leurs tribunaux internes et leur discrétion fiscale. La colonie a donné à la Sublime Porte une frontière orientale fidèle; cela a donné aux mirs kurdes un bouclier constitutionnel autour de leur autonomie qui a perduré jusqu’au XIXe siècle."
 krs_sharafnama_register_bureaucracy: "Registre Sharafnama"
 krs_sharafnama_register_bureaucracy_desc: "La chronique généalogique et politique du prince Sharaf Khan de Bitlis achevée en persan en 1597, traitant les Marwanides d'Amed, les Hasanwayhids, les Fadluyides, les Ayyoubides de Saladin et chaque dynastie kurde contemporaine comme une seule civilisation continue. Maintenu en tant qu'institution d'État, le registre fixait les revendications généalogiques de chaque grande maison, réglait les questions de préséance au tribunal des mirates et donnait à la nation kurde un passé documenté coextensif avec sa géographie montagneuse. Les chroniqueurs ultérieurs ont continué et copié le travail ; c’est ce qui se rapproche le plus du régime politique kurde d’une archive de chancellerie de son propre passé."
 krs_naqshbandi_tariqat_bureaucracy: "Naqshbandi-Khalidi Tariqat"
 krs_naqshbandi_tariqat_bureaucracy_desc: "L'ordre soufi a été réformé et propagé par Mawlana Khalid al-Shahrazuri (décédé en 1827) de Sulaymaniyah, qui, au milieu du XIXe siècle, a supplanté l'ancienne Qadiriya en tant que réseau religieux dominant à travers le Kurdistan. Les cheikhs Khalidi gouvernaient de vastes loges (tekiyes), formaient des chaînes de disciples et, à mesure que les grandes maisons de mirats se dissolvaient une à une sous la centralisation ottomane, la combinaison agha-cheikh se lança dans l'arbitrage local, la médiation tribale et même la perception des impôts. À la fin de l’ère ottomane, les cheikhs Naqshbandi étaient devenus les véritables agents du pouvoir dans la société kurde, souvent explicitement aux dépens des familles mir survivantes qu’ils remplaçaient."
 krs_mirate_diwan_bureaucracy: "Mirate Diwan"
 krs_mirate_diwan_bureaucracy_desc: "Le conseil délibérant d'un émirat kurde, développé le plus pleinement à Bitlis sous la dynastie Sharafnama, à Sanandaj sous les Ardalans au pouvoir de longue date et à Sulaymaniyah sous les Babans. Le mir présidait un conseil composé des aghas supérieurs de son clan, du cadi en chef de l'émirat et des maîtres des contingents tribaux ; le diwan enregistrait les concessions, entendait les appels et rassemblait la cavalerie du royaume. Alors que la colonie Hakim Sancak préservait l'autonomie du mir par rapport à Istanbul, le diwan organisait cette autonomie de l'intérieur, mêlant la coutume tribale à l'arbitrage islamique et donnant au régime aristocratique kurde sa forme administrative opérationnelle."

 AUTO_MODIFIER_NAME_nd_krs_bureaucracy_authority: "Autorité Mirate"
 AUTO_MODIFIER_DESC_nd_krs_bureaucracy_authority: "Avec la formation du Kurdistan, les grandes maisons de mirats convoquent un conseil d'administration permanent, enregistrant les établissements sancak héréditaires, les généalogies Sharafnama du royaume et les réseaux religieux des tariqats soufis. C’est sur cette base que les institutions distinctives de l’État kurde commencent à prendre leur forme durable."
