l_french:
 # === FORMATION EVENT ===
 nd_tbt.1.t: "La bannière du Tsenpo se lève à nouveau"
 nd_tbt.1.d: "From the Yarlung Valley the imperial summons goes out, and the great clans of Bod ride to Lhasa beneath the white-and-red banner of the Tsenpo. The Potala stands restored above the Lhasa plain, the Jokhang's bronze doors are thrown open, and the Imperial pillar where Songtsen Gampo carved his oath in stone is washed clean of the moss of fragmentation.\n\nFor centuries the Roof of the World had splintered into ecclesiastical fiefs and pacified bonds. Now the warrior-empire of Trisong Detsen and Ralpacan, the empire that rode from Lhasa to the Tang frontier and held the Tarim oases against the Sons of Heaven, returns. But what kind of empire shall it be? The gshen-priests of Yungdrung Bon press the old imperial cult of mountain-deities and warrior-tsenpos. The lamas of Samye press the cosmopolitan synthesis of the Three Dharma Kings, the translation projects, the Mahayana mandala-empire.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tbt.1.a: "Restaurer le culte impérial Yungdrung-Bon (convertir en Bon)"
 nd_tbt.1.b: "Adoptez la synthèse bouddhiste des Rois du Dharma"

 STATIC_MODIFIER_NAME_nd_tbt_yungdrung_imperial_cult: "Culte Impérial Yungdrung Bon"
 STATIC_MODIFIER_DESC_nd_tbt_yungdrung_imperial_cult: "Le sacerdoce pré-bouddhiste du Bon à croix gammée éternelle est au service de l’État impérial. Les dieux de la montagne bénissent le Tsenpo et les rgyal-blon partent en guerre sous la bannière impériale de Yarlung."

 STATIC_MODIFIER_NAME_nd_tbt_dharma_kings_synthesis: "Synthèse des Trois Rois du Dharma"
 STATIC_MODIFIER_DESC_nd_tbt_dharma_kings_synthesis: "L'empire mandala cosmopolite de Songtsen Gampo, Trisong Detsen et Ralpacan revient. Les sutras sanscrits et chinois affluent dans la langue tibétaine ; Les salles de traduction de Samye bourdonnent grâce au travail d'une centaine de panditas."

 # === ADVANCE EVENT 2: Imperial Edicts on Stone (rdo-ring) ===
 nd_tbt.2.t: "Les édits de pierre"
 nd_tbt.2.d: "Beneath the Jokhang's outer wall a new rdo-ring rises. The chief minister, the chief lon-chen, and the heads of the great clans gather to swear the imperial oath as the inscription is carved: the Tsenpo's law, the borders of the realm, the rights and duties of every clan. As Trisong Detsen and Ralpacan once carved their oaths into stone for all generations to read, so shall this empire bind itself.\n\nBut binding works two ways. Shall the law on the pillar bind the people to the Tsenpo, or bind the Tsenpo and the rgyal-blon to one another?"
 nd_tbt.2.a: "Sculptez nos édits comme la loi suprême de tous"
 nd_tbt.2.b: "Taillez le noble serment du rgyal-blon"

 STATIC_MODIFIER_NAME_nd_tbt_law_carved_in_stone: "La loi gravée dans la pierre"
 STATIC_MODIFIER_DESC_nd_tbt_law_carved_in_stone: "L'édit impérial sur le rdo-ring est la loi suprême de chaque clan et district. Les chroniques rapporteront que personne ne l’a défié."

 STATIC_MODIFIER_NAME_nd_tbt_oath_of_the_blon: "Serment du Blond"
 STATIC_MODIFIER_DESC_nd_tbt_oath_of_the_blon: "Le pilier lie les Tsenpo et les grands clans rgyal-blon en une seule confrérie jurée. Leurs levées chevauchent à la convocation impériale ; leurs terres servent la cause impériale."

 # === ADVANCE EVENT 3: Samye and the Bon-Buddhist Debate ===
 nd_tbt.3.t: "Le débat Samyé"
 nd_tbt.3.d: "At Samye monastery, founded by Trisong Detsen in 779 to the plan of an Indian mandala, two great Buddhist schools contend for the empire's soul. The Indian master Kamalashila argues for gradual cultivation through study and discipline; the Chinese Chan teacher Heshang Moheyan argues for sudden enlightenment.\n\nIn the historical record the Indians prevailed and Heshang was sent home. But scripture and chronicle alike preserve both arguments still. The Tsenpo himself must adjudicate. Which way shall the empire's Buddhism flow?"
 nd_tbt.3.a: "Adoptez le Mahayana indien de culture progressive"
 nd_tbt.3.b: "Embrassez le Chan chinois du réveil soudain"

 STATIC_MODIFIER_NAME_nd_tbt_indian_mahayana_path: "Chemin indien Mahayana"
 STATIC_MODIFIER_DESC_nd_tbt_indian_mahayana_path: "Les salles de traduction se remplissent de panditas sanscrites. La logique, le débat et la pratique progressive du bodhisattva se sont répandus de Samye à tous les monastères du plateau."

 STATIC_MODIFIER_NAME_nd_tbt_chinese_chan_path: "Chemin du Chan chinois"
 STATIC_MODIFIER_DESC_nd_tbt_chinese_chan_path: "L'école du réveil soudain de Heshang prospère malgré l'histoire. Les maîtres Chan prennent place à Samye, et un bouddhisme plus calme et moins doctrinal s'enracine à Bod."

 # === ADVANCE EVENT 4: Tarim Basin Garrisons ===
 nd_tbt.4.t: "Les quatre garnisons du Tarim"
 nd_tbt.4.d: "The Tarim Basin oases, the Tang protectorate of Anxi, fall once again to imperial Tibetan armies. Khotan, Kashgar, Kucha, and Karashahr open their gates to riders out of the Kunlun passes. The Silk Road is in our hands. Caravans from Sogdiana and Khorasan now pay their tariffs to the Tsenpo's customs-houses.\n\nWhat shall we make of these oasis cities? Garrison them as imperial provinces and integrate the merchants directly, or hold them lightly as protectorates that pay tribute and supply auxiliaries?"
 nd_tbt.4.a: "Garnissez les oasis en tant que provinces impériales de la Route de la Soie"
 nd_tbt.4.b: "Liez les rois des oasis en tant que protectorats payant un tribut"

 STATIC_MODIFIER_NAME_nd_tbt_silk_road_dominion: "Domination de la Route de la Soie"
 STATIC_MODIFIER_DESC_nd_tbt_silk_road_dominion: "Les garnisons impériales détiennent les Quatre Garnisons. Les marchands sogdiens, khotanais et ouïghours paient leurs tarifs à Lhassa. La Route de la Soie est une route tibétaine."

 STATIC_MODIFIER_NAME_nd_tbt_oasis_protectorate: "Protectorat des Oasis"
 STATIC_MODIFIER_DESC_nd_tbt_oasis_protectorate: "Les rois des oasis conservent leurs trônes en échange de tributs, de prélèvements et de serments au Tsenpo. L'empire les détient par l'honneur plutôt que par des légions."

 # === ADVANCE EVENT 5: Treaty of 821-822 ===
 nd_tbt.5.t: "Le pilier du traité au Jokhang"
 nd_tbt.5.d: "The trilingual pillar before the Jokhang Temple records the great Sino-Tibetan peace of 821-822, the 'uncle-nephew' treaty between the Tsenpo and the Tang Son of Heaven. The frontier is fixed; the sworn boundary at the Hexi corridor is to stand 'as the rivers flow and the sun rises'.\n\nA generation has passed since the inscription was first carved. The Tsenpo's council debates whether to honor the treaty as the foundation of a stable order, or to seize the moment of weakness on the Tang frontier and renew the war that built our empire."
 nd_tbt.5.a: "Honorer les frontières jurées comme notre fondement diplomatique"
 nd_tbt.5.b: "Renouveler la guerre des frontières pendant que nous détenons l'avantage"

 STATIC_MODIFIER_NAME_nd_tbt_sworn_borders: "Frontières jurées"
 STATIC_MODIFIER_DESC_nd_tbt_sworn_borders: "Le pilier du traité demeure. Les ambassadeurs tibétains portent le sceau impérial jusqu'à Chang'an, Bagan et Samarkand. Chaque voisin prend notre parole comme étant contraignante."

 STATIC_MODIFIER_NAME_nd_tbt_frontier_war_renewed: "Guerre de frontière renouvelée"
 STATIC_MODIFIER_DESC_nd_tbt_frontier_war_renewed: "L'armée du Tsenpo se dirige vers l'est. Le couloir Hexi et les marais du Gansu sont des terrains découverts et la cause impériale exige leur remise en état."

 # === ADVANCE EVENT 6: Imperial Cabinet Codification (gar-zlon) ===
 nd_tbt.6.t: "Le Conseil des Sept Ministres"
 nd_tbt.6.d: "The chief minister Gar Tongtsen, who served Songtsen Gampo as the architect of the early empire, formalizes the gar-zlon: the seven-minister imperial cabinet. The blon-chen (chief minister), the nang-blon (interior), the phyi-blon (foreign affairs), the dmag-blon (war), the gtsang-blon (treasury), the chos-blon (religion), and the rgyal-blon-chen (master of the great clans) meet in council to administer the empire while the Tsenpo leads the host.\n\nThis is a new shape of imperial government: the Tsenpo rides at the head of his army, while the empire continues to govern itself."
 nd_tbt.6.a: "Convoquer le Conseil des Sept"

 STATIC_MODIFIER_NAME_nd_tbt_council_of_seven: "Conseil des Sept Ministres"
 STATIC_MODIFIER_DESC_nd_tbt_council_of_seven: "Le gar-zlon se réunit quotidiennement à Lhassa. L'empire continue de s'administrer lui-même même lorsque le Tsenpo est en campagne."

 # === ADVANCE EVENT 7: Tonmi Sambhota's Script Reform ===
 nd_tbt.7.t: "Les Lettres du Plateau"
 nd_tbt.7.d: "The minister Tonmi Sambhota returns from his long study in India bearing a new alphabet, adapted from a Brahmi-derived Indic script and shaped to the sounds of the Tibetan tongue. By Songtsen Gampo's order it becomes the imperial script, used for edicts, treaties, chronicles, and the first translations of Buddhist scripture.\n\nWhere before our edicts traveled by herald's voice and were forgotten in a generation, now they shall be carved on stone, brushed on palm-leaf, and printed on block. The empire learns to remember itself."
 nd_tbt.7.a: "Promulguer le scénario à travers l'empire"

 STATIC_MODIFIER_NAME_nd_tbt_letters_of_the_plateau: "Lettres du Plateau"
 STATIC_MODIFIER_DESC_nd_tbt_letters_of_the_plateau: "Des écritures imprimées au bloc et des chroniques écrites au pinceau proviennent des scriptoria impériales. L'alphabétisation se répand depuis Lhassa sur toutes les routes de la vallée."

 # === ADVANCES: AGE 1 ===
 nd_tbt_seven_ministers: "Conseil des Sept Ministres"
 nd_tbt_seven_ministers_desc: "Codifier le cabinet impérial gar-zlon de sept ministres établi par Gar Tongtsen, permettant à l'empire de s'administrer lui-même pendant que le Tsenpo fait campagne sur le terrain."
 nd_tbt_yul_sde_levy: "Prélèvement du district de Yul-sde"
 nd_tbt_yul_sde_levy_desc: "La grille administrative impériale du khri-sde rassemble les prélèvements de lances et d'arcs par foyer. Chaque district doit au Tsenpo son quota d'hommes armés."
 nd_tbt_rgyal_blon_cavalry: "Cavalerie en mailles Rgyal-blon"
 nd_tbt_rgyal_blon_cavalry_desc: "Les chroniques Tang les appelaient « des hommes et des chevaux enveloppés de fer ». Les grands clans alignent des lanciers blindés comme bras de choc de l'empire."
 nd_tbt_rdo_ring_edicts: "Édits impériaux Rdo-ring"
 nd_tbt_rdo_ring_edicts_desc: "Gravez la loi impériale sur des piliers de pierre à travers le royaume à la manière de Songtsen Gampo, Trisong Detsen et Ralpacan. Ce qui est gravé dans la pierre survit à toutes les dynasties."
 nd_tbt_yungdrung_bon: "Culte Yungdrung Bon"
 nd_tbt_yungdrung_bon_desc: "Restaurer le sacerdoce pré-bouddhiste du Bon à croix gammée éternelle en tant que culte impérial de l'État. Les divinités de la montagne et les rites guerriers bénissent la bannière du Tsenpo."
 nd_tbt_yak_wool_weaving: "Tissage de laine de yak"
 nd_tbt_yak_wool_weaving_desc: "L'épais tissu nambu feutré et les célèbres tapis tibétains, tissés à partir de laine de yack qu'aucun troupeau des plaines ne peut égaler."
 nd_tbt_tonmi_script: "La réforme du scénario de Tonmi Sambhota"
 nd_tbt_tonmi_script_desc: "Adoptez le nouvel alphabet adapté du Brahmi pour la langue tibétaine. Les scriptoria impériales peuvent désormais enregistrer les édits, les chroniques et les écritures traduites dans notre propre écriture."

 # === ADVANCES: AGE 2 ===
 nd_tbt_samye_synthesis: "Synthèse Monastique Samye"
 nd_tbt_samye_synthesis_desc: "J'ai fondé le monastère de Samye dans le plan du mandala, une université de traduction où se rencontrent les bourses du sanskrit, du chinois et du tibétain. L'empire devient le patron du bouddhisme cosmopolite."
 nd_tbt_tarim_garrisons: "Garnisons du bassin du Tarim"
 nd_tbt_tarim_garrisons_desc: "Tenez les quatre garnisons du protectorat d'Anxi contre les Tang. Les armées tibétaines sur la Route de la Soie font campagne à des milliers de kilomètres de Lhassa."
 nd_tbt_chama_trade: "Commerce de thé Chama et de chevaux"
 nd_tbt_chama_trade_desc: "Construisez le grand caravansérail de foire de la route du Chama. Le thé du Yunnan et du Sichuan coule jusqu'au plateau en échange de chevaux de guerre destinés aux armées Tang."
 nd_tbt_translation_bureau: "Bureau Impérial de Traduction"
 nd_tbt_translation_bureau_desc: "The lo-tsa-ba master translators render Sanskrit Mahayana, Chinese Chan, and Khotanese tantra into Tibetan. The plateau becomes the great compiler of Asian Buddhism, and an imperial press issues the canon in block-print editions."
 nd_tbt_himalayan_metallurgy: "Métallurgie himalayenne"
 nd_tbt_himalayan_metallurgy_desc: "Fer et cuivre tibétains d'une qualité légendaire. L'armure de la cavalerie en mailles était célèbre dans toute l'Asie pour sa qualité de fabrication."
 nd_tbt_imperial_horse_breeding: "Élevage de chevaux impérial"
 nd_tbt_imperial_horse_breeding_desc: "Les pâturages impériaux des prairies de l'Amdo nourrissent à la fois le commerce des chamas et notre propre cavalerie. Les chevaux de guerre tibétains sont demandés dans toute la Chine."

 # === ADVANCES: AGE 3 ===
 nd_tbt_uncle_nephew_treaty: "Traité oncle-neveu"
 nd_tbt_uncle_nephew_treaty_desc: "Le pilier du traité de 821-822 au Jokhang établit une paix sino-tibétaine « alors que les rivières coulent et que le soleil se lève ». L'empire comme co-égal des Tang."
 nd_tbt_rdzong_doctrine: "Doctrine de la forteresse de Rdzong"
 nd_tbt_rdzong_doctrine_desc: "Couronnant chaque rocher stratégique, les forteresses dzong enchaînent une colonne vertébrale défensive. Des murs de pierre gravissent les parois des montagnes."
 nd_tbt_khams_riders: "Khams-pa Frontier Riders"
 nd_tbt_khams_riders_desc: "Les cavaliers aux longs bras des marches orientales, formés pour les raids et les querelles, se déployèrent comme cavalerie légère frappant bien au-delà de la frontière impériale."
 nd_tbt_butter_tea_economy: "Économie du thé au beurre"
 nd_tbt_butter_tea_economy_desc: "Pressed brick-tea, salt, and yak butter, the staple trinity of plateau life. Press sheds rise on the tea land of Kham and bind the leaf into bricks for every market."
 nd_tbt_codified_imperial_law: "Loi impériale codifiée"
 nd_tbt_codified_imperial_law_desc: "Le corpus Bka' yig-tshang codifie les édits impériaux sur pierre en une tradition juridique écrite. Les juges impériaux parcourent le circuit."
 nd_tbt_high_pass_logistics: "Logistique passe-haut"
 nd_tbt_high_pass_logistics_desc: "Les officiers ravitailleurs du dmag-blon maîtrisent les hauts cols. Les colonnes impériales peuvent traverser le Kunlun et le Karakoram avec des rations intactes."

 # === ADVANCES: AGE 4 ===
 nd_tbt_imperial_guard_reform: "Réforme de la Garde Impériale (sku-srung)"
 nd_tbt_imperial_guard_reform_desc: "Établir le sku-srung comme une garde impériale permanente distincte du prélèvement. Infanterie lourde disciplinée, professionnelle et permanente."
 nd_tbt_himalayan_isolation_doctrine: "Doctrine d'isolement himalayenne"
 nd_tbt_himalayan_isolation_doctrine_desc: "Tenez l'empire derrière les cols les plus élevés de la Terre. Que les armées des plaines se brisent sur le rdzong avant d'atteindre le cœur du plateau."
 nd_tbt_state_buddhism_reform: "Réforme du bouddhisme d’État"
 nd_tbt_state_buddhism_reform_desc: "The imperial sangha is reformed as an instrument of state. Royal patronage runs the great monasteries; doctrinal disputes are settled by imperial decree, and the imperial press issues the canon in a single state edition."
 nd_tbt_revived_court_culture: "Culture judiciaire revitalisée"
 nd_tbt_revived_court_culture_desc: "La tradition de la cour impériale Yarlung est consciemment relancée : poésie, musique, saisons rituelles, chroniques des Tsenpos. Lhassa devient la capitale culturelle du monde des plateaux."
 nd_tbt_vajra_tradition: "Tradition tantrique Vajra"
 nd_tbt_vajra_tradition_desc: "Le corpus tantrique vajrayana, minutieusement traduit et indexé dans les grands monastères, devient la contribution bouddhiste distinctive de l'empire à l'Asie. Des peintures thangka en brocart de soie sont accrochées dans chaque sanctuaire impérial."
 nd_tbt_ten_pillars_taxation: "Fiscalité impériale à dix piliers"
 nd_tbt_ten_pillars_taxation_desc: "Dix piliers fiscaux standardisés sont érigés à travers l'empire, fixant la part impériale des récoltes, du troupeau et du commerce selon une loi sculptée."

 # === ADVANCES: AGE 5 ===
 nd_tbt_plateau_artillery_doctrine: "Doctrine de l'artillerie du plateau"
 nd_tbt_plateau_artillery_doctrine_desc: "Canons en bronze coulés dans les fonderies impériales de Lhassa à partir du cuivre du Khams. L'artillerie placée sur les murs du rdzong domine toutes les approches du plateau."
 nd_tbt_lhasa_grand_assembly: "Grande Assemblée de Lhassa"
 nd_tbt_lhasa_grand_assembly_desc: "Le gar-zlon se développe en une grande assemblée impériale avec des sièges pour les clans régionaux, les grands monastères et les guildes marchandes."
 nd_tbt_brick_tea_monopoly: "Monopole impérial du thé en brique"
 nd_tbt_brick_tea_monopoly_desc: "Le pressage, le scellement et l’exportation des briques de thé deviennent un monopole de la Couronne. Chaque brique est frappée du sceau impérial."
 nd_tbt_great_road_network: "Réseau routier impérial"
 nd_tbt_great_road_network_desc: "Le service routier du Tsenpo entretient un réseau de routes postales, de gares de courrier et de passages à niveau à travers l'empire. Une dépêche de Lhassa arrive à Khotan dans quatorze jours."
 nd_tbt_gold_panning_industry: "Orpaillage impérial"
 nd_tbt_gold_panning_industry_desc: "L'or et l'argent placés des sources de l'Indus, du Sutlej et du Brahmapoutre sont organisés en industries de la couronne. Les lingots tibétains achètent ce que les armées tibétaines ne peuvent atteindre."
 nd_tbt_mountain_engineering: "Corps du Génie de Montagne"
 nd_tbt_mountain_engineering_desc: "Ingénieurs impériaux spécialisés dans la construction de ponts à écluses à haute altitude au-dessus des gorges de l'Himalaya, de stupas en escalier escaladant les parois des falaises, la tradition d'ingénierie qui a rendu le rdzong possible."

 # === ADVANCES: AGE 6 ===
 nd_tbt_modern_imperial_military: "Militaire impériale moderne"
 nd_tbt_modern_imperial_military_desc: "La levée yul-sde et la cavalerie noble rgyal-blon cèdent la place à une armée professionnelle permanente, entraînée selon le modèle européen mais commandée dans la langue tibétaine."
 nd_tbt_state_printing_press: "Imprimerie d'État"
 nd_tbt_state_printing_press_desc: "Les scriptoria impériales adoptent la composition mécanique et les presses à vapeur. Des livres, des gazettes et des almanachs en écriture tibétaine affluent de Lhassa vers tous les bourgs."
 nd_tbt_himalayan_industry: "Réforme industrielle himalayenne"
 nd_tbt_himalayan_industry_desc: "Des moulins hydrauliques exploitent les grands fleuves descendant le plateau. Des fonderies de fer, des usines textiles et des usines de poudre se développent autour de Lhassa et Shigatse."
 nd_tbt_revived_imperial_idea: "Idée impériale relancée"
 nd_tbt_revived_imperial_idea_desc: "Les historiens et chroniqueurs modernes redécouvrent l’empire Yarlung et proclament sa restauration comme le destin de la nation tibétaine. Le titre du Tsenpo retrouve son ancien poids."
 nd_tbt_neutral_diplomacy_doctrine: "Diplomatie neutre asiatique"
 nd_tbt_neutral_diplomacy_doctrine_desc: "L’empire se positionne comme médiateur neutre entre les puissances des basses terres. On fait confiance aux diplomates de Lhassa pour transmettre des messages entre rivaux qui ne feraient pas confiance à leurs propres envoyés."
 nd_tbt_modern_administration: "Administration moderne"
 nd_tbt_modern_administration_desc: "Les sept ministères impériaux sont réorganisés en départements administratifs modernes. Le plateau devient un État au sens moderne, tout en restant un empire au sens ancien."

 # === BUILDINGS ===
 nd_tbt_rdo_ring: "Anneau Rdo (pilier de pierre impérial)"
 nd_tbt_rdo_ring_desc: "Un pilier monumental en pierre sur lequel sont inscrits la loi impériale, les termes des traités et les serments des grands clans. L'anneau rdo de Jokhang conserve encore le traité sino-tibétain de 821-822 gravé en trois écritures."
 nd_tbt_bon_sanctuary: "Sanctuaire Impérial du Bon"
 nd_tbt_bon_sanctuary_desc: "Un temple-forteresse Yungdrung-Bon dirigé par des prêtres gshen de la tradition pré-bouddhiste. Les rites impériaux des divinités montagnardes sont observés ici et les prélèvements locaux se rassemblent sur son parvis."
 nd_tbt_samye_monastery: "Complexe monastique de style Samye"
 nd_tbt_samye_monastery_desc: "Un grand complexe monastique en forme de mandala, inspiré de Samye, fondé par Trisong Detsen en 779. Des salles de traduction, des cours de débat, des scriptoria et des tours de stupa se regroupent autour d'un temple central."
 nd_tbt_imperial_scriptorium: "Scriptorium Impérial"
 nd_tbt_imperial_scriptorium_desc: "Le bureau de traduction et d'impression où les textes sanscrits, chinois, khotanais et persans sont convertis en écriture tibétaine et imprimés en bloc pour être distribués à travers l'empire."
 nd_tbt_rdzong: "Rdzong (Forteresse du Plateau)"
 nd_tbt_rdzong_desc: "Une forteresse de pierre perchée à flanc de falaise, colonne vertébrale stratégique du système défensif impérial. Les garnisons de Rdzong tiennent les hauts cols et surveillent les frontières impériales d'en haut."
 nd_tbt_chama_caravanserai: "Caravansérail de la Foire de Chama"
 nd_tbt_chama_caravanserai_desc: "Un caravansérail fortifié sur la route commerciale du thé et du cheval. Le thé en brique du Yunnan est échangé contre des chevaux de guerre tibétains ; les douaniers du gtsang-blon perçoivent les tarifs impériaux."
 nd_tbt_nambu_workshop: "Atelier de laine de yak de Nambu"
 nd_tbt_nambu_workshop_desc: "Une guilde de tisserands produisant du feutre nambu et les célèbres tapis tibétains. Laine de yak épaisse, foulée et teinte localement, transformée à la fois pour un usage domestique et pour l'exportation dans toute l'Asie."
 nd_tbt_council_hall: "Salle du Conseil Impérial (gar-zlon)"
 nd_tbt_council_hall_desc: "La salle où se réunissent les sept ministres impériaux pour administrer l'empire pendant la campagne du Tsenpo. Codifié par le ministre en chef Gar Tongtsen en 654-655."

 # === BUILDING PRODUCTION METHODS ===
 nd_tbt_rdo_ring_maintenance: "Entretien des piliers de pierre"
 nd_tbt_rdo_ring_maintenance_desc: "Les maçons et scribes qui nettoient, recoupent et réencrent les inscriptions sur les piliers impériaux."
 nd_tbt_bon_sanctuary_maintenance: "Entretien du sanctuaire Bon"
 nd_tbt_bon_sanctuary_maintenance_desc: "Encens, tissus rituels, lampes à beurre et offrandes du troupeau pour les rites des prêtres gshen."
 nd_tbt_samye_maintenance: "Entretien monastique de Samye"
 nd_tbt_samye_maintenance_desc: "Papier pour les traductions, cire d'abeille pour les lampes, encens pour les rites quotidiens et poterie pour les réfectoires."
 nd_tbt_scriptorium_maintenance: "Entretien du Scriptorium"
 nd_tbt_scriptorium_maintenance_desc: "Papier, cire d'abeille, poterie d'encre et blocs sculptés du scriptorium impérial."
 nd_tbt_rdzong_maintenance: "Entretien de la garnison de Rdzong"
 nd_tbt_rdzong_maintenance_desc: "Maçonnerie, armes et provisions pour les garnisons de la forteresse du haut col."
 nd_tbt_caravanserai_maintenance: "Entretien du caravansérail"
 nd_tbt_caravanserai_maintenance_desc: "Fourrage, stocks de thé en brique, étoffes du voyageur et équipement des mulets pour la foire de Chama."
 nd_tbt_nambu_maintenance: "Entretien de l'atelier Nambu"
 nd_tbt_nambu_maintenance_desc: "La laine de yak, les métiers à tisser et les outils du teinturier étaient destinés à la guilde des tisserands."
 nd_tbt_yak_wool_pm: "Tissage de feutre Nambu"
 nd_tbt_yak_wool_pm_desc: "Tissu épais en feutre de laine de yak, foulonné localement et teint grossièrement, le textile quotidien du plateau."
 nd_tbt_imperial_carpet_pm: "Tissage de tapis impérial"
 nd_tbt_imperial_carpet_pm_desc: "Tapis tibétains noués à la main, teints avec des pigments himalayens, prisés dans toute l'Asie et exportés jusqu'en Perse."
 nd_tbt_silk_weaving_pm: "Brocart de soie et de laine"
 nd_tbt_silk_weaving_pm_desc: "Le tissu thangka en brocart de soie de la tradition vajra, tissé de soie importée et de laine locale, teint aux couleurs du temple de la sangha impériale."
 nd_tbt_imperial_drape_pm: "Drapé de la cour impériale"
 nd_tbt_imperial_drape_pm_desc: "Textiles de cour en laine et soie teints aux couleurs impériales, tissés pour la cérémonie de cour relancée du Tsenpo."
 nd_tbt_council_hall_maintenance: "Entretien de la salle du conseil"
 nd_tbt_council_hall_maintenance_desc: "Papier, cire d'abeille, maçonnerie et tissus de cérémonie pour la chambre des sept ministres."

 # === UNITS ===
 a_nd_tbt_yul_sde: "Lanciers conscrits Yul-sde"
 a_nd_tbt_yul_sde_desc: "Les conscrits de la maison du prélèvement impérial du district de Khri-sde. Lance, arc long et lamelle en cuir et fer ; élevé sous un commandement noble pour les campagnes du Tsenpo."
 a_nd_tbt_rgyal_blon_cavalry: "Cavalerie en mailles Rgyal-blon"
 a_nd_tbt_rgyal_blon_cavalry_desc: "La noble cavalerie de l'empire, les cavaliers et les chevaux enfermés dans des lamelles de fer jusqu'aux yeux. Armés de la fameuse longue lance tibétaine, ils combattaient autant en rangs débarqués qu'en charge."
 a_nd_tbt_imperial_guard: "Garde Impériale à Sku-srung"
 a_nd_tbt_imperial_guard_desc: "L'infanterie professionnelle permanente de l'empire ressuscité. Là où le prélèvement Yul-sde revient chez lui chaque saison, les sku-srung servent à vie avec un salaire impérial direct."
 a_nd_tbt_khams_riders: "Khams-pa Frontier Riders"
 a_nd_tbt_khams_riders_desc: "Les cavaliers aux longs bras des Khams orientaux marchent entraînés au raid, élevés dans la querelle, déployés comme cavalerie légère frappant bien au-delà de la frontière impériale."
 a_nd_tbt_plateau_artillery: "Artillerie du Plateau"
 a_nd_tbt_plateau_artillery_desc: "Canons en bronze coulés dans les fonderies impériales de Lhassa à partir du cuivre du Khams. Les rôles d'équipage s'inspirent de la tradition du corps du génie qui a construit le rdzong."

 # === LEVIES ===
 levy_nd_tbt_yul_sde: "Prélèvement sur les conscrits de Yul-sde"
 levy_nd_tbt_yul_sde_desc: "Le prélèvement du district impérial rassemblé par les ménages à travers la grille administrative khri-sde de l'empire."
 levy_nd_tbt_rgyal_blon: "Prélèvement de cavalerie Rgyal-blon"
 levy_nd_tbt_rgyal_blon_desc: "La noblesse maillée des grands clans, convoquée à la bannière impériale."

 # === DESTINY VARIABLE TOOLTIPS ===
 nd_tbt_formed_tt: "L'Empire tibétain a été restauré"
 nd_tbt_path_a_tt: "A choisi le culte impérial Yungdrung Bon lors de sa formation"
 nd_tbt_path_b_tt: "A choisi la synthèse bouddhiste des Rois du Dharma lors de la formation"
 nd_tbt_dest_shazhou_developed_tt: "Shazhou (Dunhuang) is ours and has reached #bold 21#! development"
 nd_tbt_dest_samye_town_tt: "Samye is ours and has grown into a town"

 # ===== DESTINY TREE LOCALIZATION =====

 # === Destiny advances ===
 nd_tbt_destiny: "Le destin du Tsenpo"
 nd_tbt_destiny_desc: "La restauration impériale Yarlung est terminée. L’empire se trouve à la croisée des chemins, sur la voie guerrière de la domination de l’Asie intérieure, ou sur la voie du dharma de la civilisation universelle du Mahayana. Une stabilité de 75 ouvre la voie impériale à venir."

 # Path A: Inner Asian Empire
 nd_tbt_dest_tarim_recovery: "Marche dans la steppe"
 nd_tbt_dest_tarim_recovery_desc: "La portée de l’empire Yarlung touche déjà la frontière du Tian Shan et des Tang. Poussez maintenant vers le nord sur la steppe mongole elle-même : Karakorum et Urga reconnaissent la bannière du Tsenpo. L’empire n’est plus seulement une puissance d’Asie intérieure ; c'est un seigneur des steppes, comme l'étaient brièvement les tsenpos de Yarlung à la fin du VIIIe siècle lorsque le khaganat de Trk oriental leur rendit hommage."
 nd_tbt_dest_hexi_corridor: "Au-delà de la frontière Hexi"
 nd_tbt_dest_hexi_corridor_desc: "The historical Yarlung empire campaigned along the Tang frontier through the Wei-river and Sichuan corridors but never quite held them in fact. The destiny makes the contested frontier permanent imperial ground. Lanzhou (the upper Yellow River prefectural seat), Xining (the Qinghai corridor controlling the route to Hexi), and Chengdu (the Sichuan basin's commercial capital) all answer to Lhasa. The 763-829 Tang-Tibetan border wars end with the Tsenpo's seal on every prefectural document. Behind the new frontier Dunhuang, the garrison town where the empire once had the sutras copied by the thousand, is built up again."
 nd_tbt_dest_inner_asian_empire: "L'Empire d'Asie intérieure"
 nd_tbt_dest_inner_asian_empire_desc: "En 763 après JC, une armée tibétaine captura Chang'an elle-même ; l'empereur Tang s'enfuit et la ville de trois millions d'habitants arbora la bannière du Tsenpo pendant quinze jours avant le retrait de l'armée impériale. La pierre angulaire du destin pérennise ces quinze jours dans un règne durable sur la vallée de Wei. Chang'an rend hommage depuis le fleuve Jaune ; Kunming rend hommage au plateau du Yunnan où l'empire Yarlung avait autrefois Nanzhao comme affluent. L'empire guerrier de Trisong Detsen est restauré aux dimensions de l'empire historique qui n'a été détenu que brièvement. Débloque le palais impérial au pilier de pierre à Lhassa."

 # Path B: Dharma Imperium
 nd_tbt_dest_pala_heartland: "Récupérez le Pala Heartland"
 nd_tbt_dest_pala_heartland_desc: "Ramenez le Bihar dans le dharma Gaya à côté de l'arbre de la bodhi, Rajgir du premier conseil bouddhiste. Les sièges du Mahayana de l’ère Pala qui ont produit le bouddhisme tibétain reviennent sous la tutelle impériale."
 nd_tbt_dest_bengali_sangha: "Restaurer la Sangha bengali"
 nd_tbt_dest_bengali_sangha_desc: "Hold Pala Bengal: Gaur and Sonargaon, the lower Ganges Buddhist heartland. The imperial scriptoria absorb the Pala translation tradition and the great printing press preserves it for every monastery. Samye, the first monastery of Tibet, is built up from a mountain village into a town of translators."
 nd_tbt_dest_dharma_imperium: "L'Empire du Dharma"
 nd_tbt_dest_dharma_imperium_desc: "La Mongolie convertit sous la sangha impériale la steppe d'Orkhon et de Khentii pour devenir le bras oriental d'un empire-civilisation Mahayana s'étendant du Bengale au lac Baïkal. Débloque la Grande Maison de Traduction."

 # === Destiny variable tooltips already exist (nd_tbt_path_a_tt etc.) ===

 # === Destiny event 8: Root ===
 nd_tbt.8.t: "Le destin du Tsenpo"
 nd_tbt.8.d: "The empire is whole. The mountain-passes are watched, the rdo-ring stand inscribed, the great clans muster on imperial summons. Now the council looks beyond the plateau.\n\nThe ministers debate. Some argue the Tsenpo's destiny lies in restoration: ride east as Songtsen Gampo and Trisong Detsen rode, take back the Tarim and the Hexi corridor, build a Yarlung empire that reaches from the Karakoram to the Mongol steppe. Others argue the empire's true vocation is civilizational, not territorial: become the Mahayana axis of Asia, restore the dharma to its Pala homeland, carry the doctrine to the steppe-peoples in the lineage of the Three Dharma Kings.\n\nWhichever destiny the Tsenpo chooses, the imperial council declares the path open."
 nd_tbt.8.a: "Que la voie impériale soit ouverte"

 # === Destiny event 9: Tarim recovered ===
 nd_tbt.9.t: "La steppe s’incline devant Lhassa"
 nd_tbt.9.d: "Tibetan riders pour out of the high passes onto the Mongol steppe. Karakorum, the Khentii camp-cities, the Onon and Kerulen valleys bow before the imperial host. The Eastern Türk khaganate-successors offer the same tribute their ancestors offered Trisong Detsen in the 780s; Mongol clans fold into the imperial federation as auxiliary tümens.\n\nThe Tsenpo of Lhasa is now also a steppe-overlord. The chronicles will record that the empire reaches from Inner Asia to the Onon."
 nd_tbt.9.a: "La steppe est le pâturage du Tsenpo"

 # === Destiny event 10: Hexi corridor ===
 nd_tbt.10.t: "La frontière Tang franchie"
 nd_tbt.10.d: "Lanzhou, Xining, and Chengdu fall in succession to the imperial host. Tibet has crossed the Tang frontier proper: past the Hexi corridor, past the Anxi garrisons, into the Wei-river valley and the Sichuan basin themselves. The 763-829 border wars are over; the imperial Tibetan host stands inside what was for centuries Tang heartland. The Sichuan tea-merchants pay their tariffs to Tibetan customs-officers; Lanzhou's Yellow River dockyards build for the Tsenpo's fleet.\n\nNow the imperial council debates how to hold the conquest: as a fortified frontier-line of garrisons and watch-towers, or as the open trade-road of the chama and the Silk Route?"
 nd_tbt.10.a: "Fortifier le couloir comme ligne de garnison"
 nd_tbt.10.b: "Ouvrez le couloir comme la grande route des caravanes"

 STATIC_MODIFIER_NAME_nd_tbt_dest_hexi_garrison_line: "Ligne de garnison Hexi"
 STATIC_MODIFIER_DESC_nd_tbt_dest_hexi_garrison_line: "Tours de guet et forteresses de rdzong s'enchaînent le long du couloir. La frontière tient, mais le coût de son maintien incombe aux districts de plaine."
 STATIC_MODIFIER_NAME_nd_tbt_dest_hexi_caravan_road: "Route des caravanes Hexi"
 STATIC_MODIFIER_DESC_nd_tbt_dest_hexi_caravan_road: "Le couloir regorge de caravanes à l’est et à l’ouest. Les banques impériales soutiennent les commerçants sogdiens et ouïghours en échange de frais et de tarifs."

 # === Destiny event 11: Inner Asian Empire (capstone) ===
 nd_tbt.11.t: "Chang'an sous le pilier"
 nd_tbt.11.d: "In 763 AD, twenty thousand Tibetan riders entered Chang'an. The Tang emperor fled south; the city of three million flew the Tsenpo's banner for fifteen days before the imperial host withdrew under negotiated terms. Tang chronicles called it a humiliation; Tibetan court-records called it the high tide of the empire. Now, after centuries, the imperial host has returned, and Chang'an does not pass back. The Wei valley pays tribute to Lhasa from the Yellow River; Kunming pays tribute from the Yunnan plateau where the Yarlung empire once held Nanzhao as a tributary; the steppe-tümens, the Tarim oases, the Hexi corridor, and the Wei-Sichuan corridor all answer to the Tsenpo's pillar.\n\nThe court-scribes carve the names of every submitted ruler on the new Imperial Pillar Palace, that none may forget. The ministers debate the imperial style of the new dispensation. Shall the Tsenpo rule as a warrior-king of Yarlung, leading the host in person as the Three Dharma Kings did, or as a steppe-overlord receiving tribute from a hundred subordinate princes?"
 nd_tbt.11.a: "Dirigez l'armée impériale en tant que guerrier-Tsenpo"
 nd_tbt.11.b: "Règne en tant que seigneur des steppes des princes sujets"

 STATIC_MODIFIER_NAME_nd_tbt_dest_warrior_tsenpo: "Guerrier-Tsenpo de Yarlung"
 STATIC_MODIFIER_DESC_nd_tbt_dest_warrior_tsenpo: "Le Tsenpo chevauche à la tête de son armée tandis que Songtsen Gampo et Trisong Detsen chevauchent. L’empire est en guerre partout où passe l’étendard impérial."
 STATIC_MODIFIER_NAME_nd_tbt_dest_steppe_overlord: "Seigneur des steppes"
 STATIC_MODIFIER_DESC_nd_tbt_dest_steppe_overlord: "Une centaine de princes subordonnés payent tribut et fournissent des auxiliaires. La portée de l'empire s'étend autant par la diplomatie et les tributs que par les armes."

 # === Destiny event 12: Pala heartland ===
 nd_tbt.12.t: "Sous l'arbre Bodhi"
 nd_tbt.12.d: "Gaya falls. The Tibetan host enters the Mahabodhi temple-precinct unopposed; the bodhi-tree under which the Buddha attained enlightenment stands beneath the imperial banner. Rajgir, where the first Buddhist Council convened, opens its gates the same week.\n\nThe Pala-era heartland of the Mahayana, the cradle of the dharma that came to Tibet, is once again under Buddhist guardianship. The chronicles will say that the Tsenpo wept when he made his offerings at the Mahabodhi."
 nd_tbt.12.a: "Faire des offrandes impériales au Mahabodhi"

 # === Destiny event 13: Bengali sangha ===
 nd_tbt.13.t: "La Sangha du Bengale restaurée"
 nd_tbt.13.d: "Gaur, Sonargaon, and Monghyr, the lower Ganges Buddhist heartland, pass under the imperial banner. The lo-tsa-ba master translators arrive at the great Pala monastic foundations to copy, translate, and re-print every surviving Indic manuscript.\n\nShall this be a translation project to recover and complete the Tibetan canon, or a great gathering of Bengali panditas at Lhasa to instruct the imperial sangha directly?"
 nd_tbt.13.a: "Lancez le Grand Projet de Traduction"
 nd_tbt.13.b: "Convoquer le tribunal Pandita à Lhassa"

 STATIC_MODIFIER_NAME_nd_tbt_dest_great_translation: "Grand projet de traduction"
 STATIC_MODIFIER_DESC_nd_tbt_dest_great_translation: "Les manuscrits sanscrits et pali du Pala vihara reviennent à la langue tibétaine sous le canon impérial de l'imprimerie."
 STATIC_MODIFIER_NAME_nd_tbt_dest_pandita_court: "Cour Pandita à Lhassa"
 STATIC_MODIFIER_DESC_nd_tbt_dest_pandita_court: "Les grands panditas du Bengale, du Cachemire et du Magadha donnent quotidiennement des conférences dans les salles impériales. La cour devient cosmopolite, mais les anciennes traditions du plateau s'amenuisent."

 # === Destiny event 14: Dharma Imperium (capstone) ===
 nd_tbt.14.t: "Le Conseil universel Mahayana"
 nd_tbt.14.d: "Mongolia converts. The Orkhon and Khentii steppe acknowledge the imperial sangha; Bhagalpur on the Ganges sends its panditas to Lhasa to instruct the Mongol khans in the doctrine. The imperial Mahayana stretches from the Bay of Bengal to Lake Baikal, the eastern Buddhist civilization, fulfilled.\n\nWhat shape shall the dharma imperium take? A great universal council uniting every Buddhist tradition under Lhasa, or a permanent dual-throne dynasty of lama and khan, in the lineage of Altan Khan and the Dalai Lama?"
 nd_tbt.14.a: "Convoquer le Conseil universel du Mahayana"
 nd_tbt.14.b: "Trouvé l'Ordre Dynastique Lama-Khan"

 STATIC_MODIFIER_NAME_nd_tbt_dest_mahayana_council: "Conseil universel Mahayana"
 STATIC_MODIFIER_DESC_nd_tbt_dest_mahayana_council: "Chaque tradition bouddhiste du Bengale à la Mongolie siège sous un seul conseil impérial. Le dharma est un et Lhassa en est le siège."
 STATIC_MODIFIER_NAME_nd_tbt_dest_lama_dynasty: "Ordre Dynastique Lama-Khan"
 STATIC_MODIFIER_DESC_nd_tbt_dest_lama_dynasty: "La lignée de la souveraineté à double trône : lama et khan, sangha et steppe, sur le modèle d'Altan Khan et du Dalaï Lama. Le clergé porte la colonne vertébrale de l’empire. Les maisons de marchands en paient les frais."

 # === Destiny capstone buildings ===
 nd_tbt_imperial_pillar_palace: "Palais impérial aux piliers de pierre"
 nd_tbt_imperial_pillar_palace_desc: "Un vaste palais de pierre et de bois à Lhassa, des murs inscrits dans la tradition du Rdo-ring avec les noms de chaque oasis conquise et de chaque khanat affluent du Tarim à la steppe mongole. Abrite le terrain de rassemblement impérial et la chambre de guerre du Tsenpo."
 nd_tbt_great_translation_house: "Grande maison de traduction"
 nd_tbt_great_translation_house_desc: "Une académie monastique impériale sur le plan Samye, à l'échelle de l'ambition universelle du Mahayana. Des salles de traduction dans toutes les principales langues indiennes et asiatiques intérieures, un conseil permanent de panditas et des presses à imprimer impériales préservant le canon."

 # === Destiny capstone building production methods ===
 nd_tbt_pillar_palace_maintenance: "Entretien du palais du pilier"
 nd_tbt_pillar_palace_maintenance_desc: "Pierre, maçonnerie, armes et chevaux de guerre pour le terrain de rassemblement impérial et l'escorte permanente du Tsenpo."
 nd_tbt_translation_house_maintenance: "Entretien du bureau de traduction"
 nd_tbt_translation_house_maintenance_desc: "Du papier, de la cire d'abeille pour les lampes, de l'encens pour les rites quotidiens et des stocks de cahiers vierges pour la presse impériale."

 # === Bureaucracies ===
 AUTO_MODIFIER_NAME_nd_tbt_bureaucracy_authority: "Autorité du Tsenpo"
 AUTO_MODIFIER_DESC_nd_tbt_bureaucracy_authority: "La couronne Yarlung restaurée commande l'appareil institutionnel de la période impériale : le conseil gar-zlon, la myriarchie stong-sde, le bureau rituel bonpo et le tribunal de traduction lo-tsa-ba. Accorde deux emplacements de bureaucratie en plus de l'emplacement de la capitale impériale."

 gar_zlon_bureaucracy: "gar-zlon: Imperial Council"
 gar_zlon_bureaucracy_desc: "Codifié par le ministre en chef Gar Tongtsen Yulsung en 654-655, le gar-zlon était un cabinet permanent de sept ministres blon-po autour du grand ministre blon-chen-po, qui faisait office de chef de l'exécutif de l'empire sous le tsenpo. Les anciennes annales tibétaines et les inscriptions bilingues des traités montrent que cette structure à sept ministres a persisté tout au long de la période impériale ; les grands clans étaient liés de façon permanente à l'exécutif, et aucun acte de guerre, traité ou succession n'était scellé sans la marque du conseil. Le prix était que le tsenpo ne pouvait plus gouverner seul : le propre monopole de la lignée Gar provoqua la purge de Tridu Songtsen en 698, et après chaque clan qui suivit le Gar dans le bureau du blon-chen-po tenta à son tour de rendre la chaire héréditaire."

 stong_sde_bureaucracy: "stong-sde: Myriarchy Levy"
 stong_sde_bureaucracy_desc: "Les réformes de Songtsen Gampo dans les années 630 organisèrent le Tibet central en quatre ru (« cornes ») subdivisés en stong-sde (« mille districts ») de mille foyers chacun, chacun devant des hommes armés, des montures et des céréales au rassemblement impérial. Les agents de l'administration foncière de Yul-sde tenaient les rôles ; les tsenpos suivants étendirent le système à travers Sumpa, Zhang-zhung, Amdo et dans les oasis conquises du Tarim. Le fort-sde a donné à l'empire Yarlung une armée de campagne basée sur les paysans qu'aucune autre puissance issue des steppes de son siècle ne pouvait égaler - et a lié les ménages enrôlés dans un service militaire héréditaire qui ressemblait de plus en plus au servage à la fin de la période impériale."

 bonpo_priesthood_bureaucracy: "Culte Impérial Bonpo"
 bonpo_priesthood_bureaucracy_desc: "L'aristocratie rituelle pré-bouddhiste des tsenpos de Yarlung : juges-aumôniers, spécialistes funéraires des tombeaux impériaux de Chongye, officiers-oracles (ku-tsab) interprétant les présages qui ratifiaient la guerre et les traités, et juges rituels de la cour du tsenpo. Leur cosmologie des lha-sras tsenpo descendant du ciel sur la corde dmu a donné à la dynastie Yarlung sa légitimité sacrée. Même après la conversion bouddhiste de Trisong Detsen au VIIIe siècle, les institutions bonpo ont survécu en tant qu'appareil parallèle : et la réaction de Langdarma au IXe siècle a cherché à leur redonner la primauté. Partout où le culte bon-po persiste en tant que département de l’État, les grands clans et les anciens prêtres ont le sentiment que l’empire leur appartient."

 lo_tsa_ba_court_bureaucracy: "Tribunal de traduction lo-tsa-ba"
 lo_tsa_ba_court_bureaucracy_desc: "The imperial Buddhist translation project, the institutional achievement of the Three Dharma Kings: Songtsen Gampo, Trisong Detsen (755-797), and Tri Ralpacan (815-838). The sgra-bsgyur lo-tsa-ba ('translator-officials') were a salaried imperial corps drawing on Indian panditas at Samye (founded 779) and the standardized Tibetan vocabulary fixed by the Mahavyutpatti decrees. Their output was the bka'-'gyur and bstan-'gyur canon: one of the largest translation projects in pre-modern history. Ralpacan codified the seven-monk rule, by which seven peasant households supported each ordained monk; the warrior-clans resented the drain on rents owed them, and the assassination plots that ended Ralpacan's reign were the same factional violence Langdarma later turned against Buddhism itself."
 nd_tbt_imperial_press: "Presse Impériale"
 nd_tbt_imperial_press_desc: "Les ateliers d'édition au bloc de la chancellerie impériale et des grandes académies monastiques. Là où le scriptorium copie et le monastère traduit, la presse relie le canon impérial, le bka'-'gyur, le bstan-'gyur et les éditions modernes de la presse d'État sous forme de tirages standardisés sur bois et à caractères mobiles."
 nd_tbt_press_block_print_pm: "Édition en bloc"
 nd_tbt_press_block_print_pm_desc: "Les blocs de bois dur sculpté du canon impérial et du corpus du dharma. Tirages distribués aux académies monastiques, aux bureaux gouvernementaux et aux dzongs frontaliers."
 nd_tbt_press_scripture_pm: "Édition des Écritures impériales"
 nd_tbt_press_scripture_pm_desc: "Éditions impériales pigmentées des pages de titre bka'-'gyur et bstan-'gyur en vermillon, têtes de chapitres à la feuille d'or, le bouddhisme d'état codifié en édition monumentale."
 nd_tbt_press_modern_pm: "Presse d'État moderne"
 nd_tbt_press_modern_pm_desc: "Éditions à caractères mobiles de la chronique impériale, du droit codifié et du corpus du dharma. Éditions tibétaines vernaculaires pour les académies chos-grwa, classiques pour la chancellerie impériale."
 nd_tbt_brick_tea_press: "Presse à thé en brique"
 nd_tbt_brick_tea_press_desc: "A press shed on the tea land of Kham. The leaf is steamed, pressed in wooden moulds into trade bricks and sewn into hides for the caravans. The upstream production behind the chama tea-horse trade."
 nd_tbt_press_brick_tea_pm: "Presse à thé en brique"
 nd_tbt_press_brick_tea_pm_desc: "Leaf from the gardens is steamed and pressed into bricks for the caravan trade. Timber goes to the moulds and the fires, and hides to the packing."
 nd_tbt_thangka_atelier: "Atelier Thangka"
 nd_tbt_thangka_atelier_desc: "Les ateliers de peintres de la grande tradition tantrique thangka. Des rouleaux de soie et de coton apprêtés à la craie, peints avec des pigments minéraux malachite, cinabre, lapis, feuille d'or représentant des bouddhas, des mandalas et les portraits de la lignée impériale qui décorent chaque mur chos-grwa."
 nd_tbt_atelier_thangka_pm: "Peinture de thangka"
 nd_tbt_atelier_thangka_pm_desc: "Thangkas en rouleau de soie et de coton peints selon la tradition Karma-gadri ou Menri, pigmentés avec de la colle de peau, feuille d'or brunie sur brocart consacré, la lignée impériale rendue en couleur minérale."
