 # ===== FORMATION CHOICE MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_rom_byz_romanitas_vincit: "Romanitas Vincit"
 STATIC_MODIFIER_DESC_nd_rom_byz_romanitas_vincit: "La latinisation est terminée. La cour parle latin, la liturgie suit le rite romain et l'aigle sur notre étendard est l'aigle romain et non byzantin. L’héritage grec en est le fondement, mais le but est sans ambiguïté : être romain comme Auguste et Constantin l’étaient. Le Pape bénit le couronnement impérial. L’Occident, perdu depuis longtemps, revient à la communion impériale. Le prix en est payé par les communautés de rite grec, qui voient leur liturgie familière disparaître peu à peu dans le chant latin."
 STATIC_MODIFIER_NAME_nd_rom_byz_hellenikos_romaios: "Hellenikos Romaios"
 STATIC_MODIFIER_DESC_nd_rom_byz_hellenikos_romaios: "Nous ne prétendrons pas être ce que nous ne sommes pas. Les Romains d’Orient parlaient grec et les Romains d’Occident sont désormais bilingues. Liturgie grecque dans les églises latines. Cérémonie de la cour orientale dans les salles romaines. Les héritiers de Pléthon donnent des conférences aux côtés des canonistes latins. L’empire est ce qu’il est réellement : une synthèse. Bessarion avait raison, et Photius avait raison. Le pape doit s'accommoder d'un tribunal qui cite à la fois Cicéron et Platon dans l'original."

 # ===== FORMATION EVENT =====
 nd_rom_byz.1.t: "L'Aigle revient à Rome"
 nd_rom_byz.1.d: "It is done. After centuries of exile, after the long shame of 1204 and the long terror of 1453, the Roman Empire has returned to Rome. The basileus stands in the basilica where Constantine once knelt. The forum is ours. The Tiber is ours. The seven hills, lost since the days of Augustulus, fly the eagle once more.\n\nBut what kind of empire have we become? The vanilla effect of formation is already pulling us westward, toward Latin, toward the rite of Rome, toward the identity of the old empire. Some at court welcome this drift: at last, they say, we can stop pretending to be Greeks. Others, the philosophers and the Mezzogiorno bishops and the surviving generation of the Constantinopolitan refugees, beg us to resist it.\n\nWhich Rome shall this be? The Latin Rome of Augustus, fully restored, the East as a memory? Or the bilingual, bicultural Romaiosyne that we actually are: a synthesis that owes as much to Plethon as to Petrarch?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_rom_byz.1.a: "Romanitas Vincit. Nous sommes Latins maintenant."
 nd_rom_byz.1.b: "Hellenikos Romaios. Grec et latin ensemble."

 # ===== HERITAGE ADVANCES =====

 # Variable tooltip
 nd_rom_byz_formed_tt: "La Restauration romaine italienne s'est formée"
 nd_rom_byz_path_a_tt: "Choisissez le destin#bold Romanitas Vincit#!"
 nd_rom_byz_path_b_tt: "Choisissez le destin#bold Hellenikos Romaios#!"
 nd_rom_byz_dest_rome_developed_tt: "We own #bold Rome#! and its development is at least #bold 47#!"
 nd_rom_byz_dest_smyrna_developed_tt: "We own #bold Smyrna#! and its development is at least #bold 44#!"
 nd_rom_byz_dest_antioch_developed_tt: "We own #bold Antioch#! and its development is at least #bold 55#!"

 # Age 1
 nd_rom_byz_stratiotai_italici: "Stratiotai Italici"
 nd_rom_byz_stratiotai_italici_desc: "Le système thématique oriental, transplanté dans le sud de l'Italie et en Calabre, donne à l'empire une classe de soldats-agriculteurs qu'il n'a pas pu recruter depuis le XIe siècle. Les petits exploitants albanais et gréco-calabrais chevauchent dans la cavalerie légère impériale."
 nd_rom_byz_bilingual_chancery: "Chancellerie bilingue"
 nd_rom_byz_bilingual_chancery_desc: "Le grec et le latin deviennent co-officiels à la chancellerie impériale. Les logothètes de Constantinople et les notaires de Rome travaillent sur des documents bilingues. La portée administrative de l’empire est finalement cohérente dans les deux moitiés."
 nd_rom_byz_restored_themes: "Thèmes restaurés"
 nd_rom_byz_restored_themes_desc: "Le système thématique, la fusion orientale de l’administration militaire et civile, s’étend au sud de l’Italie. Les généraux gouvernent les provinces ; les soldats cultivent les terres qu’ils défendent. Les levées augmentent, les garnisons se renforcent, le contrôle s'approfondit."
 nd_rom_byz_filioque_reconciled: "Filioque réconcilié"
 nd_rom_byz_filioque_reconciled_desc: "La grande blessure théologique entre Constantinople et Rome se referme enfin. Les conciles de Florence et de Ferrare sont cette fois mis en œuvre, sur le sol romain, par un empereur qui peut les faire respecter. Les hérétiques sont tolérés ; la conversion s’accélère. La communauté chrétienne est entière."

 # Age 2
 nd_rom_byz_plethon_academy: "Académie de Pléthon"
 nd_rom_byz_plethon_academy_desc: "Gemistos Plethon et la diaspora grecque apportent la philosophie néoplatonicienne à l'humanisme italien. L'Académie platonicienne florentine, mais avec l'empire pour patron. Le savoir circule de Constantinople à Florence jusqu'à chaque ville impériale."
 nd_rom_byz_mezzogiorno_greeks: "Les Grecs du Mezzogiorno"
 nd_rom_byz_mezzogiorno_greeks_desc: "Les communautés grecques calabraises, apuliennes et siciliennes, marginalisées pendant des siècles sous la domination normande et angevine, deviennent un sujet privilégié de la politique culturelle impériale. Leur dialecte est reconnu ; leurs églises sont financées ; leur service est récompensé."
 nd_rom_byz_renaissance_pronoia: "Renaissance Pronoia"
 nd_rom_byz_renaissance_pronoia_desc: "Le système oriental de subvention pour service s'adapte à l'économie condottiere italienne. Terre en échange de cavalerie, mais administrée par l'appareil féodal italien latinisé. Le résultat est une cavalerie professionnelle aux conditions orientales dans les institutions occidentales."
 nd_rom_byz_bank_vestiarion: "Banque du Vestiaire"
 nd_rom_byz_bank_vestiarion_desc: "Le trésor impérial, l'ancien Vestiarion byzantin, adopte la comptabilité en partie double des maisons florentines. L'administration fiscale se renforce ; les prêts deviennent moins chers ; le fisc impérial augmente."

 # Age 3
 nd_rom_byz_mare_nostrum_renatum: "Mare Nostrum Renatum"
 nd_rom_byz_mare_nostrum_renatum_desc: "La flotte de galères impériale unifiée, combinant la tradition des galères italiennes (vénitiennes, génoises, napolitaines) avec la doctrine byzantine des dromons, règne à nouveau sur la Méditerranée comme une mer unique. L’époque des guerres entre les amirautés italiennes est révolue."
 nd_rom_byz_imperial_studia: "Etudes Impériales"
 nd_rom_byz_imperial_studia_desc: "La diaspora grecque, qui traverse désormais l'Italie en sa troisième génération, se professionnalise dans des études impériales agréées financées par le Vestiarion. La bibliothèque de Bessarion est décuplée dans les villes impériales."
 nd_rom_byz_greek_curial_reform: "Réforme de la Curie grecque"
 nd_rom_byz_greek_curial_reform_desc: "La curie papale intègre des cardinaux de rite grec et des canonistes constantinopolitains. Le pape conseille l'empereur ; l'empereur confirme le pape. Le césaropapisme et la suprématie papale se sont difficilement fusionnés en une seule ecclésiologie fonctionnelle."
 nd_rom_byz_tyrrhenian_spice: "Stations d'épices tyrrhéniennes"
 nd_rom_byz_tyrrhenian_spice_desc: "Les navires impériaux rompent le courtage vénitien et mamelouk en empruntant eux-mêmes les routes de l'Est. Les avant-postes de Crète, de Chypre et d'Égypte rétablissent un lien direct avec l'océan Indien. Les marchés romains sont à nouveau le centre mondial d'échange d'épices."

 # Age 4
 nd_rom_byz_tridentine_synthesis: "Synthèse tridentine"
 nd_rom_byz_tridentine_synthesis_desc: "Le Concile de Trente se réunit, mais avec des observateurs grecs et des légats de l'empereur. Réforme sans schisme. L'orthodoxie catholique reste unifiée, épargnant à l'Italie et à l'Est les guerres de religion qui ont ravagé le reste de l'Europe."
 nd_rom_byz_imperial_vestiarion: "Le Vestiaire Impérial"
 nd_rom_byz_imperial_vestiarion_desc: "Le Trésor impérial unifié applique les principes bancaires italiens à l’échelle du fisc oriental. Les banquiers génois et florentins trouvent des postes dans le cabinet impérial aux côtés des descendants survivants des logothètes comnéniens."
 nd_rom_byz_greek_humanism: "Humanisme de la Renaissance grecque"
 nd_rom_byz_greek_humanism_desc: "La tradition humaniste italienne, nourrie par les émigrés byzantins depuis deux générations, devient le programme culturel officiel de l'empire. Le grec classique est désormais une réussite de la cour, aux côtés du latin et du dialecte impérial."
 nd_rom_byz_imperial_ceremony: "Cérémonie Impériale Restaurée"
 nd_rom_byz_imperial_ceremony_desc: "Le rituel complexe de la cour byzantine, avec ses vêtements en soie, ses acclamations et ses prokypsis, revient à Rome. Le Livre des Cérémonies devient le manuel protocolaire de la diplomatie européenne. Se tenir devant le basileus, c’est à nouveau se tenir au centre du monde."

 # Age 5
 nd_rom_byz_new_justinianic_code: "Le nouveau code Justinianique"
 nd_rom_byz_new_justinianic_code_desc: "Le Corpus Iuris Civilis est mis à jour avec deux siècles de constitutions impériales post-restauration. Le produit devient la norme du droit civil dans toute la Méditerranée et en Europe catholique, les juristes romains redevenant les arbitres de la pratique juridique."
 nd_rom_byz_galley_schools: "Écoles de cuisine méditerranéennes"
 nd_rom_byz_galley_schools_desc: "Les académies navales de Naples, Venise (subjuguée), Constantinople et Gênes forment les officiers à la doctrine impériale unifiée. Mare Nostrum est patrouillé comme une seule flotte sous un seul commandement, et non plus comme une mosaïque d'amirautés de cités-États."
 nd_rom_byz_imperial_dragomanate: "Dragomanat Impérial"
 nd_rom_byz_imperial_dragomanate_desc: "Le bureau du drogman en chef se transforme en un corps diplomatique impérial à part entière. Des polyglottes grecs et italiens, formés au latin, au grec, à l'arabe et aux langues vernaculaires italiques, forment des légations dans toutes les cours d'Europe et du Levant."
 nd_rom_byz_roman_greek_identity: "Identité romaine-grecque"
 nd_rom_byz_roman_greek_identity_desc: "Après deux siècles de fusion, le « roman » ne distingue plus le latin du grec. Une identité de sujet impérial unifié lie les territoires de deux anciens empires sous une seule conception civique."

 # Age 6
 nd_rom_byz_imperial_enlightenment: "Lumières impériales"
 nd_rom_byz_imperial_enlightenment_desc: "La tradition humaniste gréco-italienne, la richesse du Vestiarion et le réseau Phanariote se combinent dans une Lumière romaine particulière. Vico, Beccaria, mais avec le patronage impérial et un héritage philosophique grec qui manque au reste de l'Europe."
 nd_rom_byz_modern_navy: "Marine impériale moderne"
 nd_rom_byz_modern_navy_desc: "Les écoles de galères se transforment en navires de ligne. La tradition des galères méditerranéennes, vieille de dix siècles, cède la place aux flottes impériales de haute mer au départ de Naples, de Constantinople et de Crète."
 nd_rom_byz_bilingual_education: "Enseignement Impérial Bilingue"
 nd_rom_byz_bilingual_education_desc: "Enseignement public en latin et en grec pour toutes les matières impériales. L'alphabétisation comme outil d'unification impériale. Le Romaios d'Athènes et le Romanus de Milan lisent la même gazette impériale en deux écritures."
 nd_rom_byz_imperial_codification: "Codification Impériale"
 nd_rom_byz_imperial_codification_desc: "Les chemins de fer, les télégraphes et la bureaucratie moderne s'appliquaient à tous les dominions impériaux. L’ambition codificatrice de Justinien rencontre l’administration de l’ère vapeur. L’empire est enfin aussi lisible pour lui-même que Justinien le rêvait."

 # ===== HERITAGE EVENTS =====

 # nd_rom_byz.2: Filioque Reconciled
 nd_rom_byz.2.t: "Le Filioque réconcilié"
 nd_rom_byz.2.d: "The deepest theological wound in Christendom, the Filioque controversy that split East from West for half a millennium, has been closed. The councils of Florence and Ferrara, attempted in our predecessors' time and repudiated by the Constantinopolitan crowd, are now implemented in Rome itself. Greek-rite and Latin-rite Christians acknowledge one creed, one communion, one emperor.\n\nBut who arbitrates the union? The pope insists his see is superior; the patriarchs insist on the conciliar tradition. As emperor, we must take a position."
 nd_rom_byz.2.a: "Concorde papale. Le pape est notre chancelier en matière de foi."
 nd_rom_byz.2.b: "Renaissance césaropapale. L'empereur est le plus ancien ; le pape subordonné."

 # nd_rom_byz.3: Plethon's Academy
 nd_rom_byz.3.t: "Académie de Pléthon"
 nd_rom_byz.3.d: "L'héritage intellectuel de Gemistos Plethon perdure. Les philosophes grecs qui ont fui vers l’ouest lors de la chute de Constantinople sont désormais patronnés par un empereur qui a fui vers l’est pour la reprendre. Leur académie, calquée sur l'Académie platonicienne florentine de Cosme de Médicis, est désormais une institution impériale. Néoplatonisme, philologie classique, théologie comparée : la Renaissance gagne une épine dorsale grecque."
 nd_rom_byz.3.a: "Laissons la philosophie servir l’empire."

 # nd_rom_byz.4: The Bilingual Court
 nd_rom_byz.4.t: "La Cour bilingue"
 nd_rom_byz.4.d: "Le grec et le latin sont désormais co-officiels à la chancellerie impériale. Les documents sont délivrés sous forme bilingue. Les vieux logothètes constantinopolitains, qui avaient réduit leur nombre à une poignée dans les années précédant la chute de la ville, se retrouvent restaurés aux côtés des notaires italiens de la curie romaine. La portée administrative de l'empire s'étend de manière constante de l'Adriatique à la mer Égée pour la première fois depuis cinq siècles."
 nd_rom_byz.4.a: "Restaurer les bureaux du logothète."

 # nd_rom_byz.5: The Mezzogiorno Greeks
 nd_rom_byz.5.t: "L’Italograecia se réveille"
 nd_rom_byz.5.d: "Communities we had thought lost are still there. Calabrian Greek villages where the liturgy never stopped being Greek. Apulian monasteries that preserved Constantinopolitan manuscripts through the Norman centuries. Sicilian fishing towns whose dialect retains Byzantine inflections beneath the Sicilian veneer.\n\nFor the first time in five hundred years, an emperor in Rome can speak to these Italograeci as countrymen. They flock to imperial service: as priests, as soldiers, as administrators of the new themes."
 nd_rom_byz.5.a: "Italograecia, mon frère aîné, réveille-toi."

 # nd_rom_byz.6: Mediterranean Mastery
 nd_rom_byz.6.t: "Mare Nostrum, vraiment"
 nd_rom_byz.6.d: "La flotte de galères impériale unifiée, mêlant doctrine italienne et byzantine, a démontré sa maîtrise de la Méditerranée. Les amirautés vénitiennes et génoises ont été intégrées à la structure impériale. La flotte mamelouke a été chassée de Chypre. Les corsaires maghrébins ne trouvent aucun port disposé à les accueillir. Des colonnes d'Hercule au Bosphore, chaque vague répond à un commandant impérial."
 nd_rom_byz.6.a: "La mer est à nous, comme elle est censée être."

 # ===== HERITAGE TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_rom_byz_papal_concord: "Concorde papale"
 STATIC_MODIFIER_DESC_nd_rom_byz_papal_concord: "Le pape est le chancelier de l’empire en matière de foi et un atout diplomatique de premier plan dans toute l’Europe catholique. Les cardinaux plaident la cause impériale devant les tribunaux étrangers. La dévotion s'approfondit à travers l'alliance."
 STATIC_MODIFIER_NAME_nd_rom_byz_caesaropapal_revival: "Renaissance césaropapale"
 STATIC_MODIFIER_DESC_nd_rom_byz_caesaropapal_revival: "Le modèle oriental du Commonwealth chrétien est restauré : l’empereur préside les synodes, confirme les patriarches et le pape et arbitre les conflits doctrinaux. L'autorité de la couronne sur les affaires religieuses grandit ; le clergé s'irrite ; la légitimité s’envole."
 STATIC_MODIFIER_NAME_nd_rom_byz_neoplatonic_revival: "Renaissance néoplatonicienne"
 STATIC_MODIFIER_DESC_nd_rom_byz_neoplatonic_revival: "Les héritiers de Pléthon enseignent dans chaque ville impériale. La philosophie néoplatonicienne, la philologie classique et la théologie comparée se sont répandues parallèlement au programme humaniste italien. L’alphabétisation et la croissance institutionnelle s’accélèrent."
 STATIC_MODIFIER_NAME_nd_rom_byz_logothete_revival: "La renaissance du logothète"
 STATIC_MODIFIER_DESC_nd_rom_byz_logothete_revival: "Les anciens bureaux bureaucratiques constantinopolitains, logothètes des différents départements impériaux, sont restaurés aux côtés de la chancellerie italienne. Le recrutement des conseillers devient moins cher, le cabinet est plus précis et le contrôle s'étend de plus en plus loin de la capitale."
 STATIC_MODIFIER_NAME_nd_rom_byz_italograecia: "Italogrécie"
 STATIC_MODIFIER_DESC_nd_rom_byz_italograecia: "Les communautés grecques italiennes survivantes de Calabre, des Pouilles et de Sicile, longtemps marginalisées sous la domination normande et angevine, deviennent un sujet privilégié de la politique culturelle impériale. La tradition culturelle s'approfondit ; l'assimilation s'accélère ; le séparatisme dépérit."
 STATIC_MODIFIER_NAME_nd_rom_byz_mediterranean_hegemony: "Hégémonie méditerranéenne"
 STATIC_MODIFIER_DESC_nd_rom_byz_mediterranean_hegemony: "La flotte de galères impériale unifiée règne sur la Méditerranée. Les doctrines italienne et byzantine fusionnent en un seul commandement. Les combats de galères sont dominants, les blocus sont durs et la présence maritime impériale s'étend sur tous les rivages."

 # ===== CUSTOM UNITS =====
 a_nd_rom_byz_stratiotai: "Stratiotai Italici"
 a_nd_rom_byz_stratiotai_desc: "Cavalerie légère gréco-italienne du système thématique restauré. Cavaliers albanais et calabrais-grecs issus du substrat grec du Mezzogiorno et des provinces adriatiques de l'empire. Plus rapide et plus agressive que la cavalerie de prélèvement standard d'âge 1, bien adaptée au terrain italien sur lequel ils ont grandi."
 n_nd_rom_byz_imperial_galley: "Galère Impériale"
 n_nd_rom_byz_imperial_galley_desc: "Un navire de guerre fusion d'âge 3 combinant la tradition des galères italiennes (vénitienne, génoise, napolitaine) avec la doctrine byzantine du dromon. La reine des batailles de la Méditerranée : capable d'engagements rapprochés, d'abordages et de blocus dans une égale mesure."

 # ===== CUSTOM LEVIES =====
 levy_nd_rom_byz_stratiotai: "Prélèvement Stratiotai Italici"
 levy_nd_rom_byz_stratiotai_desc: "Cavalerie légère du système thématique restauré dans le sud de l'Italie et en Calabre. Les petits exploitants gréco-italiens astreints au service militaire impérial dans le style thématique oriental : la terre en échange de la selle."

 # ===== CUSTOM BUILDINGS =====
 nd_rom_byz_studium_graecum: "Studium Graecum"
 nd_rom_byz_studium_graecum_desc: "Une académie impériale à charte combinant le Pandidakterion constantinopolitain avec le studio de la Renaissance italienne. Les successeurs néoplatoniciens de Pléthon enseignent le grec, le latin et l'arabe à la prochaine génération de clercs et d'évêques impériaux. Un Studium Graecum dans toute ville suffisamment grande est l'une des institutions les plus prestigieuses de l'empire."
 nd_rom_byz_basilica_imperialis: "Basilique Impériale"
 nd_rom_byz_basilica_imperialis_desc: "Une grande basilique impériale de rite commun latino-grec. Calquée à la fois sur Sainte-Sophie et sur Saint-Pierre, elle est la preuve visible du compromis post-tridentin : catholique dans la communion, grecque dans la liturgie là où les communautés locales la préfèrent. L'empereur s'y couronne et préside les synodes."

 # Production methods
 nd_rom_byz_studium_upkeep: "Entretien des studios"
 nd_rom_byz_studium_upkeep_desc: "Du papier, des livres, des bougies en cire d'abeille et des tissus pour les vêtements académiques soutiennent le fonctionnement quotidien du Studium."
 nd_rom_byz_basilica_upkeep: "Entretien de la basilique"
 nd_rom_byz_basilica_upkeep_desc: "Marbre pour la construction en cours, cire d'abeille pour les bougies et tissu pour les vêtements et les autels, avec des pierres précieuses pour les reliquaires et les insignes impériaux."

 # ===== DESTINY ADVANCES =====

 # Path tooltip already exists above (nd_rom_byz_path_a_tt, nd_rom_byz_path_b_tt)

 nd_rom_byz_destiny: "Destin Impérial"
 nd_rom_byz_destiny_desc: "The empire is restored, the eagle flies again over Rome. But what kind of empire have we become? The destiny of the Roman state must be chosen now, before the foundations harden into stone. Requires #bold 75 stability#!."

 # Path A
 nd_rom_byz_dest_imperium_restitutum: "Imperium restitutum"
 nd_rom_byz_dest_imperium_restitutum_desc: "The Latin imperium asserts itself beyond Italy. Aachen (where Charlemagne was crowned successor of the Caesars) and Toulouse (the gateway to the Catholic west) acknowledge Roman authority. The empire embraces the renaissance as the rebirth of classical Latinity. Requires #bold ownership of Aachen and Toulouse, embraced Renaissance institution, an army of 30,000 men#!."
 nd_rom_byz_dest_concordia_pontificia: "Concordia Pontificia"
 nd_rom_byz_dest_concordia_pontificia_desc: "Catholic monarchies bow to imperial primacy. Reims (the Capetian sacre, France's Catholic heart) and Toledo (the primatial see of Spain) come into the imperial orbit. Confessionalism cements the post-Tridentine compromise, and Rome, the pontiff's own city, is rebuilt from the town it had shrunk to. Requires #bold ownership of Reims and Toledo, embraced Confessionalism, 2000 gold, Rome owned and at 47 development#!."
 nd_rom_byz_dest_imperium_occidentis: "Imperium occidental"
 nd_rom_byz_dest_imperium_occidentis_desc: "The western Mediterranean lobe of the old Roman world rejoins the empire. Lisbon, Cordoba and Tunis fly the eagle once more. The Latin imperium has consummated its reach. Unlocks the #bold Templum Pontificis Maximi#!. Requires #bold ownership of Lisbon, Cordoba and Tunis, 3000 gold, 75 prestige, an army of 75,000 men#!."

 # Path B
 nd_rom_byz_dest_aigaion_anaktethen: "Aigaion Anaktethen"
 nd_rom_byz_dest_aigaion_anaktethen_desc: "The Aegean is reclaimed. Athens (held since 1311 by Catalan and Florentine adventurers) and Candia (Venetian Crete) return to the empire. The Greek heartland is restored not by suppression of the West but by fusion of the two halves. Requires #bold ownership of Athens and Candia, embraced Renaissance institution, an army of 30,000 men#!."
 nd_rom_byz_dest_mesogeios_synkrasis: "Mésogeios Synkrasis"
 nd_rom_byz_dest_mesogeios_synkrasis_desc: "The Mediterranean is welded into one cosmopolitan economy. Cyprus and Smyrna become joint Greek-Italian imperial entrepots. Global trade spreads through the empire's harbors, and Smyrna grows into the chief market of the Levant. Requires #bold ownership of Nicosia (Cyprus), Smyrna owned and at 44 development, embraced Global Trade, 2000 gold#!."
 nd_rom_byz_dest_romaiosyne_pleroma: "Plérome Romaiosyne"
 nd_rom_byz_dest_romaiosyne_pleroma_desc: "The Greek-Roman fullness is realized. Trebizond (the last Komnenian remnant), Antioch (the third see of the pentarchy) and Famagusta (the great Levantine entrepot) all rejoin the empire. Antioch, in ruins since the sack of 1268, is raised to twice what it was. The fusion civilization is whole. Unlocks the #bold Akademia Bilingualis#!. Requires #bold ownership of Trebizond and Famagusta, Antioch owned and at 55 development, 3000 gold, 75 prestige#!."

 # ===== DESTINY EVENTS =====

 nd_rom_byz.7.t: "Un destin impérial"
 nd_rom_byz.7.d: "The basileus walks the Forum at dawn, alone, before the daily ceremonies begin. Augustus and Constantine walked here too. So did Julian, who tried to undo the Christianization, and Theodoric, who ruled as a Roman without being one, and Justinian, whose reconquest collapsed within a generation of his death.\n\nWhat kind of empire shall this be? The choice we made on the day of formation echoes in every sphere now: the army, the coinage, the chancellery, the church. The destiny of the empire must now be hammered into law, brick and treaty before the next generation grows accustomed to its shape.\n\nThe Traditions tab opens. Three stages on the chosen path lie ahead. Choose well; the empire is watching."
 nd_rom_byz.7.a: "Cela commence."

 nd_rom_byz.8.t: "L'aigle vole vers l'ouest"
 nd_rom_byz.8.d: "Charlemagne's old palace at Aachen, where Otto III once dreamed of restoring the Roman Empire and where Frederick Barbarossa was crowned, now hosts the imperial court for a season. Its restoration is symbolic: the Romanitas of the West, the unbroken Carolingian-Ottonian thread, has folded back into the Roman imperium it always claimed to continue.\n\nIn Toulouse, the seneschal of the southern marches receives the imperial commission. The Languedoc, long contested between France and Aragon, now answers to Roman law. Latin classical learning is the empire's official program. The renaissance has a Roman patron once again.\n\nThe Latin imperium has begun its march westward."
 nd_rom_byz.8.a: "Par Aspera et Astra."

 nd_rom_byz.9.t: "Concorde avec le pape"
 nd_rom_byz.9.d: "The Catholic kings have come to terms. The kings of France submit at Reims, where their predecessors were anointed; the king of Castile yields Toledo, the primatial see, into imperial communion. The post-Tridentine settlement holds: Catholic in faith, Roman in obedience.\n\nBut the relationship between emperor and pope must now be defined for an age. Some at court, the old Italian school of canonists, urge a true concordat: the pope as a sovereign chancellor of the faith, his moral authority preserved as a diplomatic asset. Others, the Greek and reformist faction, urge an imperial curia: cardinals as imperial officers, the pope as senior bishop subordinate to the imperial throne."
 nd_rom_byz.9.a: "Pax Impériale. Le pape règne ; l'empereur règne."
 nd_rom_byz.9.b: "Curie Impériale. Le pape est au service de l'imperium."

 nd_rom_byz.10.t: "Imperium Sinus Fine"
 nd_rom_byz.10.d: "Lisbon, the western terminus of Iberia, kneels at last. Cordoba, the old caliphal seat, returns to Christian-imperial communion. Tunis, the inheritor of Carthage, joins the Roman dominion that ancient Rome could not hold for long. The Mediterranean's Western basin is once again Mare Nostrum. From the Pillars of Hercules to the Bosphorus, every coast pays imperial customs. The Romanitas Vincit destiny is fulfilled.\n\nWhat character shall this final triumph wear? The emperor's councilors are split. The military faction wants the imperium itself perpetuated as a martial enterprise: the western eagle ascendant, conquest as the empire's permanent mode. The diplomatic faction urges concord: a Catholic ecumene of consenting kings, the imperium as moral arbiter rather than perpetual conqueror."
 nd_rom_byz.10.a: "Aquila Occidentis. La conquête est notre destin."
 nd_rom_byz.10.b: "Concordia Orbis. L'écoumène catholique en paix."

 nd_rom_byz.11.t: "Le retour de la mer Égée"
 nd_rom_byz.11.d: "The Acropolis is ours again. The Catalan Company, then the Acciaioli of Florence, ruled Athens for a century and a half; now the eagle flies above the Parthenon-cathedral once more. Candia, the great Venetian fortress on Crete, has surrendered with all its galleys and archives.\n\nGemistos Plethon's heirs hold lectures in the Studium Graecum and in the Athenian schools at once. Greek and Italian scholars compete for chairs in the same imperial university system. Renaissance humanism, fed simultaneously by classical Greek manuscripts and Italian Latin learning, is the official cultural program of the empire.\n\nThe Hellenikos Romaios path shows its first fruits."
 nd_rom_byz.11.a: "Romaios kai Hellen, hama."

 nd_rom_byz.12.t: "Cosmopole méditerranéenne"
 nd_rom_byz.12.d: "Famagusta and Nicosia, the great Lusignan ports of Cyprus, have been folded into the imperial system. Smyrna, contested for a century between the Aydin Turks, the Hospitallers and the Genoese, now flies the imperial standard. Greek and Italian merchants share warehouses; their accountants work in dual ledgers; their captains carry both rites in their cabin shrines.\n\nThis is the moment of choice. The cosmopolitan vision can be pursued as a merchant koinon: the empire as the great common emporium, every harbor an open port, the Greek-Italian commercial fusion driving wealth into the imperial fisc. Or it can be pursued as thalassokratia: imperial naval mastery as the precondition for the cosmopolis, the galleys as guarantors of a Mediterranean made safe by imperial dominion."
 nd_rom_byz.12.a: "Emporion Koinon. Le magasin commun."
 nd_rom_byz.12.b: "Thalassokratia. La règle de la mer comme fondement de tout."

 nd_rom_byz.13.t: "Plérome Romaiosyne"
 nd_rom_byz.13.d: "Trebizond, the last Komnenian remnant, the empire-in-exile that outlived Constantinople, has rejoined its mother. Antioch, the third see of the apostolic pentarchy, returns to the imperial fold after seven centuries of Crusader, Mamluk and Mongol governance. Famagusta becomes the great clearinghouse of the Levantine trade, half Greek by tongue and half Italian by ledger.\n\nThe Greek-Roman fullness is realized. The empire is what Justinian dreamed of and could not achieve: a single imperium spanning Latin and Greek, Italy and Anatolia and Syria, the bilingual civilization standing as the heir of Augustus and Constantine alike.\n\nThe imperial council asks how to crown this culmination. The literary faction proposes the Polis Oikoumene: Constantinople and Rome jointly raised as cosmopolitan capitals, models of the inhabited world. The ecclesiastical faction proposes the Pentarchia Restored: the five ancient patriarchates reunited under imperial communion, the Christian East rejoined as one body."
 nd_rom_byz.13.a: "Polis Oikoumene. La polis cosmopolite."
 nd_rom_byz.13.b: "Pentaarchie restaurée. Les cinq sièges, une seule église."

 # ===== DESTINY TIMED MODIFIERS =====

 STATIC_MODIFIER_NAME_nd_rom_byz_dest_pax_imperialis: "Pax Impériale"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_pax_imperialis: "Le pape gouverne les âmes, l'empereur gouverne les royaumes ; les deux ensemble suffisent. La chrétienté latine reconnaît l’épée impériale comme le bras temporel de l’Église universelle. Les capitaines mercenaires arrivent à moindre coût, les approvisionnements s'étendent plus loin, le moral impérial se remet rapidement de tout revers."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_curia_imperialis: "Curie Impériale"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_curia_imperialis: "Les cardinaux deviennent officiers impériaux. La curie papale est intégrée à la fonction publique impériale. Les diplomates se déploient à travers l'Europe catholique avec les ordres de l'empereur, et les guerres de religion sont menées avec l'efficacité du cardinal-légat."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_aquila_occidentis: "Aquila occidentalis"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_aquila_occidentis: "L'aigle occidental est ascendant. Les armées impériales se déplacent selon la discipline tactique romaine classique ; les trains de siège brisent n’importe quelle forteresse catholique ; la guerre est déclarée avec une facilité impériale. Le coût est monétaire : la conquête incessante verse les lingots pillés dans le fisc, et la monnaie se dégrade sous la pression."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_concordia_orbis: "Concordia Orbis"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_concordia_orbis: "L’écoumène catholique des royaumes tient comme une concorde pacifique sous l’arbitrage impérial. Les domaines s'installent dans la satisfaction de la gouvernance impériale ; la prospérité provinciale augmente; de nouveaux régiments se forment rapidement lorsqu'ils sont appelés."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_emporion_koinon: "Emporion Koinon"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_emporion_koinon: "L’empire devient le grand magasin commun. Les maisons de marchands grecques et italiennes fonctionnent comme une seule. Les routes commerciales intérieures bourdonnent de facteurs bilingues et de registres communs ; la capacité marchande augmente ; le domaine bourgeois gagne en influence et en prospérité."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_thalassokratia: "Thalassokratia"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_thalassokratia: "Règle de la mer. La flotte impériale unifiée fait de la Méditerranée un lac romain. Les combats navals sont dominés, les flottes fonctionnent à moindre coût, les refuges corsaires du Maghreb dépérissent. L'armée de terre, dépriorisée au profit des galères, demande plus d'entretien pour maintenir ses standards."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_polis_oikoumene: "Polis Oikoumène"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_polis_oikoumene: "La polis cosmopolite comme capitale impériale. Rome et Constantinople deviennent des centres jumeaux du monde habité, rassemblant des érudits, des artisans et des notables de toutes les nations. Les plafonds d'alphabétisation maximum augmentent, les domaines nobles prospèrent au service impérial, les provinces dévastées se rétablissent rapidement sous le patronage impérial."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_pentarchia_restored: "Pentaarchie restaurée"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_pentarchia_restored: "Les cinq anciens patriarcats restaurés : Rome, Constantinople, Alexandrie, Antioche et Jérusalem réunis sous la communion impériale. L'Orient chrétien est rejoint. Les régiments impériaux s'appuient sur une tradition plus profonde de sainteté martiale ; les groupes d’assaut rentrent chez eux avec un zèle apostolique ; les forteresses coûtent moins cher à entretenir sur l’ensemble du territoire ecclésiastique unifié."

 # ===== DESTINY BUILDINGS =====

 nd_rom_byz_templum_pontificis: "Templum Pontificis Maximi"
 nd_rom_byz_templum_pontificis_desc: "La grande basilique-palais de l'imperium latin. Construit sur les forums romains et sur les anciennes basiliques constantiniennes, il fusionne la curie de César et le siège du Pontife Maximus en un seul complexe sacré et civique. L'empereur s'y couronne, préside les synodes et arbitre ici entre les royaumes catholiques. L'incarnation monumentale de Romanitas Vincit."
 nd_rom_byz_templum_upkeep: "Entretien du temple"
 nd_rom_byz_templum_upkeep_desc: "Du marbre pour les interminables élaborations intérieures, de l'or pour les reliquaires impériaux, du tissu fin pour les vêtements, de la cire d'abeille pour les cierges et de l'encens pour les liturgies quotidiennes en rite latin et grec conjoints."

 nd_rom_byz_akademia_bilingualis: "Académie Bilingue"
 nd_rom_byz_akademia_bilingualis_desc: "L'académie impériale polymathe du destin d'Hellenikos Romaios. Les érudits grecs et italiens partagent des pupitres ; les mathématiques sont enseignées parallèlement en notation diophantienne et vietnamienne ; la médecine, l'astronomie, le droit civil et la théologie sont dispensés en deux langues. Les érudits diplômés travaillent dans les chancelleries et les postes diplomatiques de l'empire à travers le monde habité."
 nd_rom_byz_akademia_upkeep: "Entretien de l'Académie"
 nd_rom_byz_akademia_upkeep_desc: "Du papier, des livres, des bougies en cire d'abeille et des tissus pour les vêtements académiques soutiennent l'enseignement quotidien de l'académie. Le verre pour lentilles et travaux de laboratoire soutient la nouvelle philosophie naturelle."

 # ===== BUREAUCRACIES =====
 # Six historically-grounded toggleable institutions of the BYZ-Italian
 # Roman restoration. Auto-modifier grants 3 slots; capital adds 1 = 4
 # effective. Player picks 4 of 6.

 rom_byz_senatus_bilinguis_bureaucracy: "Senatus Bilinguis Restitutus"
 rom_byz_senatus_bilinguis_bureaucracy_desc: "Après 1453, la seule cour menant des affaires à la fois en latin et en grec était la chancellerie impériale en exil : le bureau de traduction du Vatican de Georges de Trébizonde et la maison romaine de Bessarion. Rendus à la dignité impériale, tous les décrets sont publiés en deux langues et les ambassades sont reçues dans l'une ou l'autre. Là où le Senatus Romanus Renovatus de 1144, uniquement latin, était une commune citoyenne, voici son successeur impérial bilingue : une chancellerie dont la dignité de fonction repose sur la maîtrise des deux langues romanitas."

 rom_byz_schola_graecorum_bureaucracy: "Schola Graecorum Romae"
 rom_byz_schola_graecorum_bureaucracy_desc: "Le palais de Bessarion sur le Quirinal (1450-1472) était de facto l'académie grecque d'Italie, abritant Théodore Gaza, Jean Argyropoulos, Georges de Trébizonde et Janus Lascaris. Sa bibliothèque de 482 manuscrits grecs et 264 manuscrits latins a donné naissance à la Biblioteca Marciana de Venise en 1468. Sous le basileus restauré, la classe des érudits n'est plus un patronage privé mais une institution impériale - des chaires rémunérées avec une obligation de service impérial, la réponse post-ottomane à ce que sont devenus les Phanariotes sous le sultan."

 rom_byz_collegium_italograecum_bureaucracy: "Collège Italograecum"
 rom_byz_collegium_italograecum_bureaucracy_desc: "Les communautés de rite grec de Calabre, des Pouilles et de Sicile - les Griko, les Grecanici et les Italo-Albanais Arberesh qui les rejoignirent après 1448 - préservèrent la liturgie byzantine et la langue vernaculaire grecque jusqu'à l'ère moderne malgré la conquête normande de 1071. Librement administré sous le catépanat d'Italie (965-1071) et ensuite laissé aux évêques locaux, le Collegium les formalise maintenant à la cour, garantit le rite grec là où il survit et canalise la loyauté des villages du Mezzogiorno vers le trône plutôt que vers les métropolitains latins."

 rom_byz_commissio_filioque_bureaucracy: "Commission Filioque"
 rom_byz_commissio_filioque_bureaucracy_desc: "Au concile de Florence en 1439, après neuf séances sur le Filioque, le discours de Bessarion des 13-14 avril persuada la délégation grecque que les Pères grecs et latins avaient enseigné la même doctrine dans des termes différents ; le décret d'union Laetentur Caeli a été signé le 6 juillet. Répudiée à Constantinople en 1484, elle survit ici en tant qu'institution permanente : une commission permanente composée de canonistes latins et de hiéromoines grecs réconcilie le langage doctrinal, entend les appels et certifie l'enseignement légitime dans les deux rites."

 rom_byz_magisterium_maris_bureaucracy: "Magistère Maris Nostri"
 rom_byz_magisterium_maris_bureaucracy_desc: "L'Arsenal vénitien (fondé vers 1104) et l'arsenal génois ont produit l'administration navale-industrielle la plus sophistiquée de la Méditerranée médiévale - des conseils permanents, les Provveditori all'Armar et le Colleggio della Milizia da Mar, supervisant l'approvisionnement, l'équipage, les tribunaux des prises et les douanes maritimes dans tout un empire commercial. Fusionné avec la tradition byzantine survivante des dromon-corps et rendu impérial, il s'agit d'une inspection permanente de Mare Nostrum au-dessus des cités-États, prélevant des péages sur la mer et certifiant chaque capitaine qui arbore l'étendard impérial."

 rom_byz_aula_phoenicea_bureaucracy: "Aula Phénicée"
 rom_byz_aula_phoenicea_bureaucracy_desc: "Après 1453, la maison du basileus survécut en exil - les eunuques de la chambre à coucher, les protovestiarios, les parakoimomenos, les médecins impériaux, l'aristocratie constante des réfugiés qui s'attaquèrent à la cour paléologue. Restaurée, cette maison devient une cour intérieure fidèle directement à la personne de l'empereur, parallèle et au-dessus du baronnage italien et de la curie romaine : un appareil à personnel grec dont la préséance ne peut pas être contestée par la noblesse latine. Le Phénix est le symbole paléologue de la restauration : l'institution se nomme elle-même."

 # ===== AUTO-MODIFIER (slot grant on formation) =====
 AUTO_MODIFIER_NAME_nd_rom_byz_bureaucracy_authority: "Imperium Bilingue"
 AUTO_MODIFIER_DESC_nd_rom_byz_bureaucracy_authority: "The empire of the Romans, restored from Constantinople to Rome, governs in Greek and in Latin. It can sustain three more standing institutions."
