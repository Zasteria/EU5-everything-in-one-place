l_french:
 STATIC_MODIFIER_NAME_nd_golden_stool_authority: "Autorité du Tabouret d'Or"
 STATIC_MODIFIER_DESC_nd_golden_stool_authority: "Le Sika Dwa Kofi, le Tabouret d'Or né un vendredi, descendit du ciel pour sanctifier l'union du peuple Ashanti. Son autorité est absolue, aucun Asantehene n'y siège, mais règne en son nom. L'unité de la nation découle de ce symbole sacré."
 STATIC_MODIFIER_NAME_nd_gold_coast_merchants: "Seigneurs de la Côte d'Or"
 STATIC_MODIFIER_DESC_nd_gold_coast_merchants: "La richesse de la Confédération Ashanti va des champs aurifères forestiers aux forts côtiers, des caravanes de noix de cola aux marchés du nord. Kumasi se trouve au cœur des réseaux commerciaux s’étendant du Sahel à l’Atlantique, transformant la poussière d’or en monnaie d’empire."
 nd_ate.1.t: "Naissance de la Confédération Ashanti"
 nd_ate.1.d: "Under the sacred shade of the kum tree, from which our capital takes its name, the scattered Akan chiefdoms have been forged into one confederacy. The priest Okomfo Anokye called down the Golden Stool from the heavens, and upon it the soul of our nation rests. The Denkyira overlords who once demanded tribute in gold and blood have been broken, and their vassal states now look to Kumasi.\n\nBut what kind of confederacy shall this be? The Golden Stool grants authority that transcends any single chief, a sacred mandate to unite all the Akan peoples under one spiritual authority. Yet the goldfields and trade routes that made this victory possible whisper of a different destiny: a commercial empire whose merchants bring the wealth of the world to Kumasi's broad streets.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ate.1.a: "Le Tabouret commande et la nation obéit."
 nd_ate.1.b: "L’or parle plus fort que n’importe quel tabouret."
 STATIC_MODIFIER_NAME_nd_ate_denkyira_conquerors: "Conquérants de Denkyira"
 STATIC_MODIFIER_DESC_nd_ate_denkyira_conquerors: "L’armée qui a brisé les chaînes de Denkyira porte l’élan de libération. Ces vétérans connaissent le goût de la victoire contre un ennemi supérieur."
 STATIC_MODIFIER_NAME_nd_ate_confederate_unity: "Unité confédérée"
 STATIC_MODIFIER_DESC_nd_ate_confederate_unity: "Le génie de la confédération ne réside pas seulement dans la conquête mais dans l’intégration, rassemblant les peuples vaincus en tant que membres et non sujets."
 nd_ate.2.t: "La chute de Denkyira"
 nd_ate.2.d: "At the Battle of Feyiase in 1701, the combined forces of the Ashanti confederacy shattered the army of Denkyirahene Ntim Gyakari. The golden regalia of Denkyira, including the note of alliance with the Dutch at Elmina, fell into Ashanti hands. The gold mines, the coastal trade routes, and the subject peoples of Denkyira's empire now belong to the confederacy.\n\nNtim Gyakari himself was slain, and his skull would become a drinking vessel at the court of the Asantehene. The states that once bowed to Denkyira must now choose: will they be absorbed into an Ashanti military machine that rewards battlefield valor, or welcomed into a broader confederation that turns former enemies into loyal members?"
 nd_ate.2.a: "Appuyez sur l'avantage ; les vaincus servent ou ils tombent."
 nd_ate.2.b: "Prolongez la protection du tabouret ; d'anciens ennemis deviennent de futurs alliés."
 nd_ate.3.t: "Les conquêtes d'Opoku Ware"
 nd_ate.3.d: "Asantehene Opoku Ware, who succeeded the great Osei Tutu, has carried the confederacy's banners further than any before him. The Bono kingdom fell in 1723, followed by Wassa in 1726. Western Gonja submitted in 1732, and Gyaman followed in 1740. By the end of his reign, the Ashanti Confederacy controls territory stretching across what will become modern Ghana and into the Ivory Coast, with three to five million people under its authority.\n\nOpoku Ware also encouraged the expansion of craft production, establishing factories to innovate in weaving and metalwork. Under his patronage, the kente cloth tradition flourished, and Danish observers at the coast recorded their admiration for Ashanti craftsmanship."
 nd_ate.3.a: "L'héritage d'Opoku Ware perdure."
 STATIC_MODIFIER_NAME_nd_ate_kwadwo_bureaucracy: "La méritocratie de Kwadwo"
 STATIC_MODIFIER_DESC_nd_ate_kwadwo_bureaucracy: "Osei Kwadwo a remplacé la naissance par la capacité comme mesure de la valeur d'un homme au sein du gouvernement. Les Asokwafo, autrefois simples sonneurs de cor royaux, servent désormais de terrain d'entraînement aux meilleurs administrateurs de l'empire."
 STATIC_MODIFIER_NAME_nd_ate_hereditary_stability: "Stabilité héréditaire"
 STATIC_MODIFIER_DESC_nd_ate_hereditary_stability: "Les chefs traditionnels et leurs lignées constituent le fondement de la gouvernance Ashanti. Leur autorité, ancrée dans le clan et la coutume, assure la continuité à travers les générations."
 nd_ate.4.t: "Les réformes d'Osei Kwadwo"
 nd_ate.4.d: "Asantehene Osei Kwadwo, who reigned from 1764 to 1777, has fundamentally transformed how the Ashanti state governs itself. Where once hereditary chiefs filled every position of consequence, Kwadwo instituted a radical principle: appointment by ability rather than birth.\n\nThe Asokwafo, originally a troop of royal hornblowers, has been transformed into an academy for the education and training of future government officials. The most talented young men from across the confederacy are recruited into the Asokwafo community, trained in administration, diplomacy, and statecraft, and then deployed wherever the empire needs them.\n\nBut not everyone welcomes this transformation. The hereditary chiefs see their traditional prerogatives being stripped away, and they warn that meritocracy without lineage produces officials with no loyalty to anything but their own advancement."
 nd_ate.4.a: "Seule la capacité détermine la place d’un homme."
 nd_ate.4.b: "La coutume et le lignage sont le fondement de l'ordre."
 STATIC_MODIFIER_NAME_nd_ate_defiant_resistance: "Résistance provocatrice"
 STATIC_MODIFIER_DESC_nd_ate_defiant_resistance: "La forêt est notre forteresse. Chaque arbre cache un mousquetaire, chaque chemin mène à une embuscade. Que les envahisseurs apprennent que les Ashanti ne s’agenouillent pas."
 STATIC_MODIFIER_NAME_nd_ate_pragmatic_adaptation: "Adaptation pragmatique"
 STATIC_MODIFIER_DESC_nd_ate_pragmatic_adaptation: "Le monde change, et la nation sage change avec lui. Adoptez ce qui fait la force de l’ennemi (sa discipline, ses fortifications, ses méthodes) et retournez-le contre lui."
 nd_ate.5.t: "Les guerres anglo-ashanti"
 nd_ate.5.d: "The British have pushed inland from their coastal forts, claiming the protection of the Fante and the other peoples of the Gold Coast. Under Asantehene Osei Bonsu, the Ashanti answered with force. In 1824, Sir Charles MacCarthy led a British and allied force against the Ashanti at Nsamankow and was utterly defeated; his skull was taken as a gold-rimmed drinking cup by the Asantehene.\n\nBut the British returned with greater numbers and new weapons. In 1826, on the plain of Katamanso near Accra, their rockets and the massed allies of the coast broke the Ashanti army in the open field.\n\nThe confederacy faces an existential choice: dig deeper into the forest and fight a war of attrition that plays to traditional Ashanti strengths, or adapt to the enemy's methods and build the capacity to meet them on modern terms."
 nd_ate.5.a: "La forêt est notre arme. Laissez-les saigner à chaque kilomètre."
 nd_ate.5.b: "Apprenez de l'ennemi pour surpasser l'ennemi."
 nd_ate.6.t: "The Stool of Gyaman"
 nd_ate.6.d: "Word has come to Kumasi that Kwadwo Adinkra, king of Gyaman in the north-west and a tributary of the Asantehene, has had a stool of gold made for himself in the likeness of the Golden Stool. There can be no second seat for the soul of a nation. To copy the Stool is to claim what it holds.\n\nOsei Bonsu has called out the army of the confederacy and marched on Gyaman. Adinkra has been defeated and killed, his kingdom brought back under tribute, and his golden stool carried to Kumasi. There it has been melted down, and the gold cast into two masks that now hang from the Golden Stool itself."
 nd_ate.6.a: "There is one Golden Stool."
 nd_ate_akan_clan_system: "Système de clan Akan"
 nd_ate_akan_clan_system_desc: "La structure matrilinéaire du clan Akan, où l'héritage et la succession politique passent par la lignée maternelle, fournit une base stable pour la gouvernance confédérée."
 nd_ate_gold_dust_currency: "Monnaie de poussière d'or"
 nd_ate_gold_dust_currency_desc: "Akan gold dust serves as both currency and measure of wealth, weighed against standardized brass weights in every marketplace and court across the forest kingdoms."
 nd_ate_forest_warfare: "Traditions de guerre forestière"
 nd_ate_forest_warfare_desc: "Les denses forêts tropicales de la Gold Coast exigent un type de guerrier différent, capable de se déplacer silencieusement dans les sous-bois, de frapper en embuscade et de disparaître avant que l'ennemi ne puisse répondre."
 nd_ate_cola_nut_trade: "Commerce de noix de cola"
 nd_ate_cola_nut_trade_desc: "La noix de cola stimulante, cultivée dans les forêts du sud, est commercialisée vers le nord, à travers la savane, vers les communautés musulmanes où l'alcool est interdit, créant ainsi des routes commerciales lucratives vers le Sahel."
 nd_ate_shrine_houses: "Maisons-sanctuaires"
 nd_ate_shrine_houses_desc: "Des sanctuaires élaborés honorent les ancêtres et les puissantes divinités qui protègent les peuples Akan. Ces espaces sacrés unissent les communautés par une pratique spirituelle partagée."
 nd_ate_akan_metalworking: "Travail des métaux Akan"
 nd_ate_akan_metalworking_desc: "Akan goldsmiths and brass-casters produce exquisite regalia, goldweights, and ritual objects using the lost-wax casting technique passed down through generations of master craftsmen.\n\n#italic Available in: $nd_ate_abrafoo_foundry$#!"
 nd_ate_confederacy_founding: "Fondation de la Confédération"
 nd_ate_confederacy_founding_desc: "L'union des chefferies Akan dispersées sous le Tabouret d'Or, forgée grâce à la défaite des suzerains Denkyira, marque la naissance de la Confédération Ashanti."
 nd_ate_golden_stool: "Le tabouret doré"
 nd_ate_golden_stool_desc: "Le Sika Dwa Kofi, le tabouret d'or né vendredi, est descendu du ciel sur ordre du prêtre Okomfo Anokye, incarnant l'esprit et l'unité de la nation Ashanti."
 nd_ate_asafo_companies: "Entreprises Asafo"
 nd_ate_asafo_companies_desc: "Les compagnies militaires asafo, organisées autour de chefs et mesurées à l'aune de leurs « canons », constituent l'épine dorsale de l'armée Ashanti, une force structurée de guerriers armés de mousquets combattant en formations coordonnées."
 nd_ate_kente_weaving: "Tissage Kente"
 nd_ate_kente_weaving_desc: "The intricate strip-woven kente cloth, produced by specialized weavers in villages like Bonwire, is reserved for royalty and serves as both art and political statement.\n\n#italic Available in: $nd_ate_kente_workshop$#!"
 nd_ate_opoku_ware_expansion: "Extension d'Opoku Ware"
 nd_ate_opoku_ware_expansion_desc: "Sous Asantehene Opoku Ware, la confédération s'étendit jusqu'à atteindre sa plus grande étendue territoriale, conquérant Bono, Wassa, Gonja et Gyaman entre 1723 et 1750."
 nd_ate_royal_gold_mines: "Mines d'or royales"
 nd_ate_royal_gold_mines_desc: "Osei Tutu a déclaré les mines d'or possessions royales, garantissant que la richesse des champs aurifères forestiers affluait directement vers l'Asantehene et alimentait l'expansion de la confédération."
 nd_ate_kumasi_palace: "Complexe du palais de Kumasi"
 nd_ate_kumasi_palace_desc: "Le vaste palais royal de Kumasi, avec ses larges rues, ses cours et plus de soixante pièces, constitue le cœur politique et culturel de la confédération."
 nd_ate_firearms_trade: "Commerce européen des armes à feu"
 nd_ate_firearms_trade_desc: "Les Ashanti ont adopté avec enthousiasme les armes à feu européennes, en particulier le mousquet Long Dane, échangeant de l'or et des captifs contre des armes qui donnaient à leurs armées une puissance de feu dévastatrice."
 nd_ate_goldweight_standards: "Normes de poids d'or"
 nd_ate_goldweight_standards_desc: "The standardized brass goldweight system, combining Islamic, Portuguese, and local measurements, enables precise commercial transactions across the entire Akan trading world.\n\n#italic Available in: $nd_ate_abrafoo_foundry$#!"
 nd_ate_northern_trade_routes: "Routes commerciales du Nord"
 nd_ate_northern_trade_routes_desc: "Les grandes routes commerciales allant au nord de Kumasi relient la zone forestière au Sahel, échangeant des noix de cola, de l'or et des tissus contre du sel, du bétail, du beurre de karité et des produits importés."
 nd_ate_queen_mother: "L'Asantehemaa"
 nd_ate_queen_mother_desc: "La reine mère partage la responsabilité des affaires de l'État, conseillant les Asantehene et détenant le pouvoir de contrôler son autorité, une remarquable institution de gouvernance partagée."
 nd_ate_craft_specialization: "Spécialisation Village artisanal"
 nd_ate_craft_specialization_desc: "Specialized craft villages surround Kumasi: Bonwire for cloth-weaving, Ntonso for cloth-dyeing, Pankrono for pottery, Ahwiaa for woodworking, and Breman for goldsmithing."
 nd_ate_rolling_fire: "Tactiques de feu roulant"
 nd_ate_rolling_fire_desc: "Les mousquetaires Ashanti avancent sur plusieurs lignes, chacun lançant des volées et se déplaçant vers l'arrière pour recharger. Cette technique de tir roulant maintient une pression continue sur l'ennemi."
 nd_ate_coast_trade: "Relations commerciales côtières"
 nd_ate_coast_trade_desc: "Le commerce avec les forts européens sur la côte, d'abord avec les Portugais à Elmina, puis avec les Néerlandais et les Britanniques, amène des armes à feu, des textiles et des produits manufacturés à l'intérieur du pays."
 nd_ate_meritocratic_reforms: "Réformes méritocratiques"
 nd_ate_meritocratic_reforms_desc: "Asantehene Osei Kwadwo a remplacé les nominations héréditaires par un système basé sur le mérite, transformant les souffleurs de cor d'Asokwafo en une académie professionnelle de la fonction publique."
 nd_ate_asokwafo_school: "Fonction publique d'Asokwafo"
 nd_ate_asokwafo_school_desc: "L'Asokwafo, transformé de musiciens royaux en école de formation de la fonction publique, produit des administrateurs nommés en fonction de leurs capacités plutôt que de leur naissance."
 nd_ate_military_modernization: "L'armée d'Osei Bonsu"
 nd_ate_military_modernization_desc: "Sous Osei Bonsu, l'armée Ashanti a été modernisée avec des armes à feu améliorées, une meilleure organisation et des tactiques capables de vaincre les forces dirigées par les Européens."
 nd_ate_provincial_system: "Administration provinciale"
 nd_ate_provincial_system_desc: "Le système à quatre niveaux de gouvernance de l’État, du district, du village et du lignage, administré par la bureaucratie impériale de Kumasi, garantit un contrôle efficace sur l’ensemble de la confédération."
 nd_ate_bantama_tradition: "Mausolée Bantama"
 nd_ate_bantama_tradition_desc: "Le mausolée royal Bantama de Kumasi abrite les restes des Asantehenes du passé, ses murs épais marqués de symboles royaux, un site sacré reliant les vivants à l'autorité des ancêtres."
 nd_ate_odwira_festival: "Festival d'Odwira"
 nd_ate_odwira_festival_desc: "Le festival annuel de purification d'Odwira renouvelle les liens entre les Asantehene, les chefs et le peuple, réaffirmant les fondements spirituels de la confédération."
 nd_ate_gold_coast_dominance: "Dominance de la Gold Coast"
 nd_ate_gold_coast_dominance_desc: "Le contrôle de la Confédération Ashanti sur les champs aurifères intérieurs et les routes commerciales vers la côte en fait la puissance dominante de la Gold Coast."
 nd_ate_anglo_ashanti_resistance: "Résistance anglo-ashanti"
 nd_ate_anglo_ashanti_resistance_desc: "The war with the British that began in 1823 tested the confederacy against the world's foremost imperial power. The Ashanti won its first great battle, killing a British governor, and held the forest against every march on Kumasi."
 nd_ate_standing_army: "Armée permanente professionnelle"
 nd_ate_standing_army_desc: "La transition de levées basées sur les clans à une armée professionnelle permanente donne à la Confédération Ashanti une force militaire permanente capable de se déployer rapidement."
 nd_ate_kumasi_urban: "Urbanisation de Kumasi"
 nd_ate_kumasi_urban_desc: "Les larges rues de Kumasi, ses quartiers planifiés et ses vastes infrastructures en font l'une des grandes villes d'Afrique de l'Ouest, un centre de commerce, de gouvernance et de culture."
 nd_ate_gold_refining: "Raffinage de l'or"
 nd_ate_gold_refining_desc: "Advanced techniques for purifying and refining gold dust increase the value of the confederacy's primary export and strengthen its position in international trade.\n\n#italic Available in: $nd_ate_abrafoo_foundry$#!"
 nd_ate_judicial_reform: "Réforme judiciaire"
 nd_ate_judicial_reform_desc: "La centralisation du système judiciaire sous l'autorité de l'Asantehene en tant que juge suprême crée un cadre juridique unifié au sein des diverses communautés de la confédération."
 nd_ate_imperial_roads: "Réseau routier impérial"
 nd_ate_imperial_roads_desc: "Un réseau de routes entretenues rayonnant depuis Kumasi permet un déploiement militaire rapide, un commerce efficace et une communication efficace à travers le vaste territoire de la confédération."
 nd_ate_war_of_resistance: "Guerre du tabouret d'or"
 nd_ate_war_of_resistance_desc: "When the king of Gyaman had a golden stool made in the likeness of the Golden Stool, Osei Bonsu marched north in 1818, broke Gyaman and had the copy melted down. The nation takes the field as one when the Stool is slighted."
 nd_ate_cocoa_economy: "Kola Trade"
 nd_ate_cocoa_economy_desc: "With the slave ships leaving the coast, the Ashanti turn north. Kola from the forest is carried to the market of Salaga and sold to the caravans of Hausaland, where the nut is prized above every other gift.\n\n#italic Available in: $nd_ate_cocoa_plantation$#!"
 nd_ate_cultural_preservation: "Préservation culturelle"
 nd_ate_cultural_preservation_desc: "Through war and peace alike the Ashanti keep their institutions: the stool system, kente weaving, goldwork, and the Odwira festival endure as living traditions."
 nd_ate_modern_governance: "Gouvernance moderne"
 nd_ate_modern_governance_desc: "L'adaptation de la gouvernance confédérée traditionnelle aux cadres institutionnels modernes, préservant l'autorité des Asantehene au sein d'une structure administrative contemporaine."
 nd_ate_modern_army: "Armée Ashanti moderne"
 nd_ate_modern_army_desc: "Une force militaire entièrement modernisée qui combine l'esprit combatif traditionnel Ashanti avec une organisation, un équipement et des tactiques contemporaines."
 nd_ate_prempeh_legacy: "Osei Bonsu's Diplomacy"
 nd_ate_prempeh_legacy_desc: "Asantehene Osei Bonsu received the British missions of 1817 and 1820 at Kumasi and bound them by written treaty. Muslim scribes from the north kept his letters and accounts, and strangers of many nations lived under his protection in the capital."
 a_nd_ate_forest_skirmishers: "Tirailleurs de la forêt Akan"
 a_nd_ate_forest_skirmishers_desc: "Des guerriers légers entraînés dans les denses forêts tropicales de la Gold Coast. Ils se déplacent silencieusement dans les sous-bois, tirant en embuscade avant de se fondre dans les arbres."
 a_nd_ate_asafo_musketeer: "Mousquetaires d'Asafo"
 a_nd_ate_asafo_musketeer_desc: "Guerriers armés de mousquets organisés en compagnies asafo sous la direction de leurs chefs. Ils portent leurs armes sous le même angle et tirent des salves sur commande, combinant la loyauté traditionnelle du clan avec la discipline des armes à feu."
 a_nd_ate_dane_gun_infantry: "Infanterie danoise"
 a_nd_ate_dane_gun_infantry_desc: "Des soldats Ashanti armés du Long Dane, le mousquet commercial préféré des Européens, se sont entraînés à la technique du tir roulant qui lui a valu le respect des observateurs européens."
 a_nd_ate_bonsu_guard: "Garde Bonsu"
 a_nd_ate_bonsu_guard_desc: "La garde d'élite d'Asantehene Osei Bonsu, des vétérans aguerris qui ont vaincu un gouverneur britannique et ont porté son crâne comme trophée. Leur moral est inébranlable."
 a_nd_ate_professional_infantry: "Infanterie professionnelle Ashanti"
 a_nd_ate_professional_infantry_desc: "Soldats à plein temps de l'armée permanente Ashanti, maintenus toute l'année plutôt que soulevés de façon saisonnière. Ils représentent l'évolution militaire de la confédération, depuis les prélèvements claniques jusqu'à la force professionnelle."
 a_nd_ate_modern_infantry: "Infanterie Ashanti moderne"
 a_nd_ate_modern_infantry_desc: "L'évolution finale de la tradition militaire Ashanti, des soldats modernes qui héritent de l'esprit combatif des guerriers d'Osei Tutu et de la discipline organisationnelle des réformes d'Osei Bonsu."
 nd_ate_gold_treasury: "Trésor d'or"
 nd_ate_gold_treasury_desc: "Un dépôt royal où la poussière d'or est reçue, pesée par rapport à des poids d'or en laiton standardisés et stockée. Il sert à la fois de trésorerie et de centre commercial."
 nd_ate_asante_shrine: "Maison du sanctuaire Asante"
 nd_ate_asante_shrine_desc: "Un sanctuaire élaboré construit dans le style traditionnel Asante en torchis, avec des décorations murales complexes honorant de puissantes divinités et des esprits ancestraux."
 nd_ate_stool_house: "Maison de tabouret"
 nd_ate_stool_house_desc: "Un référentiel sacré abritant les tabourets claniques qui incarnent l'âme de chaque chefferie. Le plus important abrite le Tabouret d'Or lui-même, centre spirituel de la confédération."
 nd_ate_kente_workshop: "Atelier Kenté"
 nd_ate_kente_workshop_desc: "Un atelier de tissage spécialisé où les maîtres tisserands produisent du tissu kente, des textiles tissés en bandes de soie et de coton dans des motifs et des couleurs réservés à la royauté et à l'élite."
 nd_ate_palace_complex: "Complexe du palais Asante"
 nd_ate_palace_complex_desc: "Un vaste complexe royal de style Kumasi, avec de larges cours, des chambres au toit de chaume et de vastes décorations murales qui ont étonné les visiteurs européens."
 nd_ate_trade_lodge: "Loge commerciale"
 nd_ate_trade_lodge_desc: "Une étape sur les routes commerciales du nord où les marchands Ashanti échangent des noix de cola, de l'or et des tissus contre du sel, du bétail et des marchandises de tout le Sahel."
 nd_ate_asokwafo_academy: "Académie Asokwafo"
 nd_ate_asokwafo_academy_desc: "Une école de formation pour la fonction publique méritocratique, où de jeunes hommes talentueux de toute la confédération apprennent l'administration, la diplomatie et l'art de gouverner."
 nd_ate_royal_mausoleum: "Mausolée Royal"
 nd_ate_royal_mausoleum_desc: "Un complexe funéraire de style Bantama aux murs épais marqués de symboles royaux, abritant les restes des Asantehenes du passé dans un espace solennel destiné à la réflexion et à la communion ancestrale."
 nd_ate_abrafoo_foundry: "Fonderie Abrafoo"
 nd_ate_abrafoo_foundry_desc: "Un atelier de la guilde des dinandiers d'Abrafoo, où des artisans qualifiés fondaient des récipients kuduo, des poids en or et des objets de cérémonie en utilisant la technique de la cire perdue."
 nd_ate_foundry_maintenance: "Opérations de fonderie"
 nd_ate_foundry_maintenance_desc: "Les lingots de cuivre et le charbon de bois alimentent les fours de la fonderie de laiton, produisant des récipients ornementaux en kuduo et des poids d'or."
 nd_ate_trade_road_station: "Gare routière impériale"
 nd_ate_trade_road_station_desc: "Une aire de repos et un point de péage sur le réseau routier rayonnant depuis Kumasi, facilitant à la fois les mouvements militaires et le trafic commercial à travers la confédération."
 nd_ate_cocoa_plantation: "Kola Grove"
 nd_ate_cocoa_plantation_desc: "A grove of kola trees in the forest zone, tended by the villages that own it. It can be kept where the land is tropical forest and kola already reaches the market."
 nd_ate_brass_casting: "Moulage de laiton Akan"
 nd_ate_brass_casting_desc: "Les maîtres métallurgistes utilisent la technique de moulage à la cire perdue pour produire des poids d'or en laiton, des objets rituels et les insignes élaborés de la cour des Asantehene."
 nd_ate_kente_production: "Production de tissus Kente"
 nd_ate_kente_production_desc: "D'étroites bandes de soie et de coton sont tissées selon des motifs complexes et cousues ensemble pour créer les éblouissantes robes kente portées par la royauté Ashanti."
 nd_ate_goldweight_minting: "Goldweight Casting"
 nd_ate_goldweight_minting_desc: "Brass goldweights are cast to one standard that joins Islamic, Portuguese, and local measures. Every market of the Akan world weighs its gold dust against them."
 nd_ate_gold_refining_process: "Gold Refining"
 nd_ate_gold_refining_process_desc: "Gold dust is purified and worked by the goldsmiths into the regalia, rings, and sword ornaments of the court."
 nd_ate_cocoa_processing: "Kola Packing"
 nd_ate_cocoa_processing_desc: "The nuts are sorted, wrapped in fresh leaves and packed in baskets, so that they reach Salaga and the caravans of the north still moist."
 nd_ate_treasury_maintenance: "Opérations de trésorerie"
 nd_ate_treasury_maintenance_desc: "L'exploitation continue du trésor d'or, y compris l'entretien des balances, des poids et des installations de stockage."
 nd_ate_shrine_upkeep: "Entretien du sanctuaire"
 nd_ate_shrine_upkeep_desc: "L'entretien des sanctuaires, y compris la réparation des murs en torchis et la fourniture d'offrandes aux esprits."
 nd_ate_stool_house_maintenance: "Entretien de la maison des tabourets"
 nd_ate_stool_house_maintenance_desc: "Le soin et l'entretien du dépôt de tabourets sacrés, y compris la tutelle et l'entretien rituel des tabourets du clan."
 nd_ate_kente_weaving_pm: "Tissage Kente"
 nd_ate_kente_weaving_pm_desc: "La soie importée et les teintures d'origine locale sont tissées dans les motifs vibrants en bandes uniques à l'art textile Ashanti."
 nd_ate_palace_upkeep: "Entretien du palais"
 nd_ate_palace_upkeep_desc: "L'entretien du complexe du palais royal, y compris le bois, la poterie et les tissus pour les réparations et la décoration."
 nd_ate_trade_lodge_maintenance: "Entretien du pavillon"
 nd_ate_trade_lodge_maintenance_desc: "L'entretien des pavillons commerciaux le long des routes du nord, offrant un abri et des installations aux marchands ambulants."
 nd_ate_academy_maintenance: "Opérations de l'Académie"
 nd_ate_academy_maintenance_desc: "La fourniture de matériels et fournitures d’écriture pour l’académie de la fonction publique d’Asokwafo."
 nd_ate_mausoleum_maintenance: "Entretien du mausolée"
 nd_ate_mausoleum_maintenance_desc: "L'entretien du mausolée royal, nécessitant de la pierre pour les réparations structurelles et l'entretien rituel des chambres funéraires."
 nd_ate_road_maintenance: "Entretien des routes"
 nd_ate_road_maintenance_desc: "L'entretien du réseau routier impérial, nécessitant du bois pour les ponts et de la pierre pour les revêtements routiers."
 nd_ate_cocoa_cultivation: "Kola Picking"
 nd_ate_cocoa_cultivation_desc: "The pods are cut from the trees and split, and the nuts are cleaned and cured in the shade of the grove."
 nd_ate_craft_village: "Craft Village"
 nd_ate_craft_village_desc: "A village near Kumasi that keeps a single craft for the court. Pankrono is known for its pottery and Ahwiaa for its carved stools."
 nd_ate_pankrono_pottery: "Pankrono Pottery"
 nd_ate_pankrono_pottery_desc: "The women of Pankrono shape and fire the black and red pots used in every Asante household."
 nd_ate_ahwiaa_carving: "Ahwiaa Wood Carving"
 nd_ate_ahwiaa_carving_desc: "The carvers of Ahwiaa cut stools from sese wood. The stools of chiefs are ordered from them."
 nd_ate_dest_kumasi_city_tt: "#bold Kumasi#! is owned and has grown into a city"
 nd_ate_dest_trade_lodges_tt: "At least #bold 3#! owned locations have a Trade Lodge"
 nd_ate_formed_tt: "La Confédération Ashanti a été formée"
 nd_ate_path_a_tt: "A choisi l'autorité du tabouret d'or"
 nd_ate_path_b_tt: "Choisissez les seigneurs de la Gold Coast"
 nd_ate_destiny: "Destin des Ashanti"
 nd_ate_destiny_desc: "La Confédération Ashanti a été forgée, mais sa forme définitive reste à décider. Le Tabouret d'Or confère de l'autorité ; les champs aurifères apportent de la richesse. Les deux chemins mènent à la grandeur."
 nd_ate_dest_stool_wars: "Guerres du tabouret"
 nd_ate_dest_stool_wars_desc: "Le Tabouret Doré exige la soumission. Amenez les royaumes du nord sous l'autorité Ashanti en conquérant Dagbon et son centre commercial de Salaga. Accumulez 1 000 pièces d’or pour financer la campagne."
 nd_ate_dest_great_ashanti: "Grand Ashanti"
 nd_ate_dest_great_ashanti_desc: "The confederacy must project its power beyond the forest belt. Conquer Oyo-Ile, the Yoruba capital, and the Borgu stronghold of Nikki. The asafo companies must be organized, and prestige kept above 50."
 nd_ate_dest_ashanti_imperium: "Impérial Ashanti"
 nd_ate_dest_ashanti_imperium_desc: "Build an empire that stretches from the Sahara to the sea. Conquer Timbuktu, Benin, and Niani. The army must carry European firearms, with 3000 gold in the treasury and prestige above 75."
 nd_ate_dest_coast_control: "Seigneurs de la Côte"
 nd_ate_dest_coast_control_desc: "Prenez le contrôle de l'ouest de la Gold Coast en prenant Axim et Apollonia sur le territoire de Nzima. Ces positions côtières donnent un accès direct au commerce européen. Accumulez 1000 pièces d'or."
 nd_ate_dest_golden_trade: "Le commerce d'or"
 nd_ate_dest_golden_trade_desc: "Transformez la confédération en une puissance bancaire. Adoptez l'institution bancaire, accumulez 2 000 pièces d'or, assurez la circulation de l'ivoire sur vos marchés et maintenez un prestige supérieur à 50."
 nd_ate_dest_gold_empire: "Empire d'Or"
 nd_ate_dest_gold_empire_desc: "Build the wealthiest state in West Africa. Conquer Djenne to control the trans-Saharan trade terminus, raise Kumasi from a forest village into a city, keep trade lodges in three locations on the northern roads, amass 3000 gold, and reach prestige 75."
 nd_ate.7.t: "Le destin Ashanti"
 nd_ate.7.d: "La confédération est au seuil de la grandeur. Que ce soit par l'autorité du Tabouret d'Or ou le pouvoir de la poussière d'or, les Ashanti laisseront leur marque sur le monde. La voie que nous avons choisie définira la nation pour les générations à venir."
 nd_ate.7.a: "Notre destin nous attend."
 nd_ate.8.t: "Dagbon Soumet"
 nd_ate.8.d: "Le royaume du nord de Dagbon est tombé aux mains des Ashanti. Yendi, siège du Ya-Na, reconnaît désormais l'autorité du Tabouret d'Or. Le grand centre commercial de Salaga, où les noix de cola et l'or sont échangés contre du sel et du bétail, est le nôtre. La portée militaire de la confédération s'étend désormais au-delà de la forêt jusqu'à la savane."
 nd_ate.8.a: "L'autorité du Tabouret grandit."
 nd_ate.9.t: "Le Grand Ashanti"
 nd_ate.9.d: "Ashanti armies have marched far beyond the forest homeland. Oyo-Ile, the great Yoruba capital, has fallen, and the Borgu warriors have submitted. The confederacy now controls territory stretching across the entire Guinea coast hinterland.\n\nThis expansion demands a choice. We can build a war machine that mobilizes quickly and overwhelms opponents through speed and numbers, or we can establish a garrison state with fortified positions, intelligence networks, and the diplomatic leverage to strike when the moment is right."
 nd_ate.9.a: "Vitesse et force écrasante."
 nd_ate.9.b: "Fortification et renseignement."
 nd_ate.10.t: "L'Empire Ashanti"
 nd_ate.10.d: "From Timbuktu in the Sahel to Benin on the coast, from Niani in the west to the eastern forests, the Ashanti Imperium stretches across a vast swathe of West Africa. No power on the continent can match the armies that march under the Golden Stool's banner.\n\nBut how shall this imperium be governed? Through terror and overwhelming military force that crushes all resistance, or through a more measured approach that rebuilds conquered lands and turns enemies into productive subjects?"
 nd_ate.10.a: "Qu'ils craignent le nom Ashanti."
 nd_ate.10.b: "Reconstruisez ce que la guerre a brisé."
 nd_ate.11.t: "La côte est à nous"
 nd_ate.11.d: "L’ouest de la Gold Coast est désormais fermement sous contrôle Ashanti. Axim et Apollonia en territoire de Nzima donnent à la confédération un accès direct aux comptoirs européens. Les marchands Ashanti ne doivent plus compter sur des intermédiaires pour atteindre les navires au mouillage. La poussière d'or s'écoule directement des mines vers les entrepôts côtiers."
 nd_ate.11.a: "L'or coule de la forêt vers la mer."
 nd_ate.12.t: "Maîtres du métier d'or"
 nd_ate.12.d: "The Ashanti Confederacy has embraced modern banking practices and established itself as the financial heart of West Africa. Ivory, gold, cola nuts, and cloth flow through markets where Ashanti merchants set the prices. The confederacy's wealth is no longer measured only in gold dust but in the sophisticated instruments of international commerce.\n\nShall we open our ports to all comers, welcoming any ship that brings goods to trade and expanding our commercial reach across the seas? Or shall we cultivate a merchant aristocracy, a class of elite traders with the diplomatic connections and financial resources to dominate regional commerce?"
 nd_ate.12.a: "Ouvrez les ports au monde."
 nd_ate.12.b: "Cultivez nos princes marchands."
 nd_ate.13.t: "L'empire de l'or"
 nd_ate.13.d: "Djenne has fallen. The trans-Saharan trade terminus, where gold from the forest meets salt from the desert and goods from across the Islamic world, is now an Ashanti possession. The confederacy's commercial network spans from the Atlantic coast to the edge of the Sahara, from the forest goldfields to the great markets of the Sahel.\n\nThis is the apex of Ashanti commercial power. Shall the empire embrace its diverse peoples and faiths, building a cosmopolitan trading civilization that welcomes all? Or shall it invest its gold in ships and naval power, projecting Ashanti influence across the seas?"
 nd_ate.13.a: "Mille peuples sous un même toit d’or."
 nd_ate.13.b: "Construisez une flotte digne de notre richesse."
 STATIC_MODIFIER_NAME_nd_ate_dest_war_machine: "Machine de guerre Ashanti"
 STATIC_MODIFIER_DESC_nd_ate_dest_war_machine: "L'appareil militaire de la Confédération s'est transformé en une machine de guerre à réponse rapide. Les lignes de ravitaillement sont étendues, les garnisons renforcées et de nouveaux régiments levés à une vitesse terrifiante."
 STATIC_MODIFIER_NAME_nd_ate_dest_garrison_state: "État de garnison Ashanti"
 STATIC_MODIFIER_DESC_nd_ate_dest_garrison_state: "Un réseau de positions fortifiées et de réseaux d'espionnage donne à la Confédération Ashanti l'intelligence et la patience stratégique nécessaires pour choisir le moment idéal pour frapper."
 STATIC_MODIFIER_NAME_nd_ate_dest_terror_of_ashanti: "Terreur des Ashanti"
 STATIC_MODIFIER_DESC_nd_ate_dest_terror_of_ashanti: "Le nom même d’Ashanti suscite la peur chez les peuples voisins. Les mercenaires affluent vers la bannière et les villes fortifiées tombent sous l'assaut. Mais les conquêtes sans fin mettent à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_ate_dest_ashanti_pax: "Pax Ashanti"
 STATIC_MODIFIER_DESC_nd_ate_dest_ashanti_pax: "L'Empire Ashanti reconstruit ce que la guerre a brisé. Les peuples conquis sont réinstallés, les villes reconstruites et des diplomates dépêchés pour assurer le maintien de la paix."
 STATIC_MODIFIER_NAME_nd_ate_dest_open_ports: "Politique des ports ouverts"
 STATIC_MODIFIER_DESC_nd_ate_dest_open_ports: "Les ports Ashanti accueillent des navires du monde entier. Les zones côtières dévastées se rétablissent rapidement et la portée commerciale de la confédération s'étend jusqu'aux rivages lointains."
 STATIC_MODIFIER_NAME_nd_ate_dest_merchant_princes: "Princes marchands de Kumasi"
 STATIC_MODIFIER_DESC_nd_ate_dest_merchant_princes: "Une classe d’élite de marchands-diplomates Ashanti entretient des relations commerciales dans toute la région, même si leur concentration sur le commerce a un certain coût sur la préparation militaire."
 STATIC_MODIFIER_NAME_nd_ate_dest_cosmopolitan_empire: "Empire cosmopolite"
 STATIC_MODIFIER_DESC_nd_ate_dest_cosmopolitan_empire: "L’empire commercial Ashanti englobe des commerçants et des colons de toutes confessions. Cette société ouverte, soutenue par la puissance navale, projette une influence bien au-delà de l’Afrique de l’Ouest."
 STATIC_MODIFIER_NAME_nd_ate_dest_golden_fleet: "Flotte dorée"
 STATIC_MODIFIER_DESC_nd_ate_dest_golden_fleet: "L'or Ashanti finance une flotte de navires de commerce et de guerre. Les chantiers navals fonctionnent à un rythme effréné, même si les investissements détournent les ressources de l’armée de terre."
 nd_ate_war_council: "Conseil de guerre Ashanti"
 nd_ate_war_council_desc: "Le conseil militaire suprême de l'Empire Ashanti, où les plus grands généraux de la confédération planifient des campagnes qui s'étendent du Sahara à la mer."
 nd_ate_great_market: "Grand marché de Kumasi"
 nd_ate_great_market_desc: "Le légendaire marché central de Kumasi, où la poussière d'or, l'ivoire, les noix de cola, le tissu kente et les marchandises du monde entier changent de mains sous l'œil vigilant des responsables commerciaux royaux."
 nd_ate_war_council_maintenance: "Opérations du Conseil de guerre"
 nd_ate_war_council_maintenance_desc: "L'entretien des salles du conseil de guerre, y compris les cartes, les armes à exposer et les provisions pour les généraux qui planifient les campagnes de la confédération."
 nd_ate_great_market_maintenance: "Opérations de marché"
 nd_ate_great_market_maintenance_desc: "L'entretien du grand marché, y compris la construction d'étals, l'assainissement et les salaires des inspecteurs royaux du commerce qui veillent à des transactions équitables."
 AUTO_MODIFIER_NAME_nd_ate_bureaucracy_authority: "Bureau bureaucratique d'Asanteman"
 AUTO_MODIFIER_DESC_nd_ate_bureaucracy_authority: "On formation, the Confederacy is granted the framework of permanent administrative office. This opens three slots in which the Asantehene may install historical institutions of Akan governance."
 ate_asantemanhyiamu_bureaucracy: "Asantemanhyiamu"
 ate_asantemanhyiamu_bureaucracy_desc: "À Odwira, chaque année, les Asantehene convoquaient l'Asantemanhyiamu, l'assemblée nationale des amanhene : les chefs suprêmes des États Akan constituants (Mampong, Dwaben, Bekwai, Kokofu, Nsuta, Kumawu et d'autres ajoutés par la conquête). L'assemblée ratifiait les déclarations de guerre, confirmait les successions, arbitrait les différends entre les Omans et approuvait les quotas de prélèvement que chaque district fournirait. Son autorité reposait sur le pacte fondateur d'environ 1701 par lequel les confédérés d'Osei Tutu avaient mis en commun la souveraineté sous le Sika Dwa Kofi tout en conservant leurs sièges héréditaires. C'était la constitution fédérale du royaume : sans son consentement, aucun Asantehene ne pouvait contraindre les chefs."
 ate_nhenkwaa_bureaucracy: "Maison du Palais Nhenkwaa"
 ate_nhenkwaa_bureaucracy_desc: "Les Nhenkwaa étaient une caste permanente de serviteurs du palais rattachés directement aux Asantehene de Manhyia : porteurs de fusils (atumtufo), batteurs (akyeremade), souffleurs de cor (asokwafo), bourreaux (abrafo) et les sumankwafo qui entretenaient les talismans protecteurs du trône. Recrutés en grande partie parmi les captifs de guerre et les non-libres, ils se tenaient en dehors de la structure clanique matrilinéaire et devaient tout au roi ; beaucoup sont devenus des agents de confiance et des ambassadeurs. En faisant de la maison du palais un exécutif autonome, Opoku Ware (r.1720-1750) et Osei Kwadwo (r.1764-1777) contournèrent l'amanhene et construisirent un appareil d'État capable de fonctionner sans le consentement des chefs."
 ate_akwantufo_bureaucracy: "Gardiens de la route d'Akwantufo"
 ate_akwantufo_bureaucracy_desc: "Huit grandes routes partaient de Kumasi jusqu'aux provinces frontalières, creusées dans la forêt tropicale et entretenues comme artères de la Confédération. Chacune était patrouillée par des gardiens akwanmofo sous l'akwansrafohene, avec des gardiens de péage (nkwansrafo) à chaque frontière omanaise qui prélevaient des droits sur les noix de cola, le kente, l'or, les captifs, le sel et les marchandises commerciales européennes. L'ambassade de Bowdich de 1817 a décrit un trottoir de terre battue exempt de végétation - un système de travaux publics sophistiqué unique parmi les royaumes de la Côte de Guinée. Les routes servaient également d'infrastructure de prélèvement : la norme atumtufo qui parcourait chaque route rassemblait les districts le long de celle-ci."
 ate_daban_treasury_bureaucracy: "Trésor de poussière d'or de Daban"
 ate_daban_treasury_bureaucracy_desc: "La poussière d'or (sika futuro) était la monnaie de la Confédération, pesée contre des poids abrammuo en laiton coulés sous des formes géométriques et figuratives. Le Daban (le trésor royal de Manhyia) était administré par le Gyaasewahene en tant que trésorier en chef, avec le Sanaahene comme adjoint et le fotosanfohene inspectant les poids sur chaque marché. Une norme nationale d'abrammuo rendait possible sans contestation le commerce à longue distance entre les marchés Akan, et tout l'or extrait dans le royaume devait une part royale aux chambres fortes. Bowdich a vu des tas de poussière conservés dans des sacs en peau d'éléphant qu'il a estimé à des centaines de livres d'or par chambre."
 ate_kotoko_adamfo_bureaucracy: "Conseil de Kotoko et Adamfo"
 ate_kotoko_adamfo_bureaucracy_desc: "Le Kotoko était le conseil de guerre intérieur des Asantehene, du nom du porc-épic (« si vous en tuez mille, mille viendront ») qui était l'emblème du royaume. Il comprenait les grands capitaines - les Bantamahene comme commandant supérieur, les Adontenhene de l'avant-garde, les Nifahene de l'aile droite, les Benkumhene de gauche, les Kyidomhene de l'arrière - réunis sous l'arbre Bogyawe. Parallèlement, fonctionnait le système adamfo : chaque tributaire et chaque puissance étrangère se voyait attribuer à Kumasi un « ami royal » qui gérait tout son trafic diplomatique et était personnellement responsable de tout différend. Ensemble, ils ont donné à Ashanti un appareil de guerre et d’ambassade professionnalisé sans égal sur la côte guinéenne."
 STATIC_MODIFIER_NAME_nd_ate_kotoko_council: "Conseil Asantemanhyiamu"
 STATIC_MODIFIER_DESC_nd_ate_kotoko_council: "Le Conseil des Chefs qui lie les États Akan sous le Tabouret d'Or. Mampong, Bekwai, Juaben, Kokofu, Nsuta, Kumasi : chaque amanhene conserve une véritable autorité au sein de son État omanhene. L'Asantehene est élu par le conseil et peut être détrôné par celui-ci. La Confédération est liée au rituel plutôt qu'à l'absolutisme, le Tabouret d'Or au-dessus de l'homme qui y est assis."
