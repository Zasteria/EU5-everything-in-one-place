l_french:
 TDR: "Bosporus"
 TDR_ADJ: "Bosphore"
 TDR_f: "Royaume du Bosphore"
 TDR_f_desc: "Reforgez le royaume perdu de la côte pontique : un royaume gréco-gothique ancré à Mangup, héritier des princes Théodorites et des anciennes dynasties du Bosphore avant eux. Qu'il prenne la forme d'un Regnum Bospori roman ou d'un Bosphore cimmérien de rois gothiques, cela dépend de la lignée que sa cour choisit d'honorer."
