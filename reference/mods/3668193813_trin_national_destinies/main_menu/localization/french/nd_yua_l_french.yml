l_french:
 STATIC_MODIFIER_NAME_nd_yua_six_tumen_order: "Ordre des Six Tumen"
 STATIC_MODIFIER_DESC_nd_yua_six_tumen_order: "La réorganisation par Dayan Khan des tribus mongoles orientales en six divisions tumen a restauré le commandement militaire centralisé à travers la steppe. Chaque tumen répond à un prince Borjigin, mais tous répondent au Grand Khan."
 STATIC_MODIFIER_NAME_nd_yua_borjigin_autonomy: "Autonomie de Borjigin"
 STATIC_MODIFIER_DESC_nd_yua_borjigin_autonomy: "Plutôt que d'imposer une centralisation rigide, le Grand Khan a accordé à ses parents Borjigin une grande latitude pour gouverner leurs propres domaines. Cette confédération de princes, liés par le sang et la loyauté plutôt que par la hiérarchie bureaucratique, préserve la tradition steppique de gouvernement consensuel."
 STATIC_MODIFIER_NAME_nd_yua_dharma_raja: "Dharma Raja de la steppe"
 STATIC_MODIFIER_DESC_nd_yua_dharma_raja: "L’adoption du bouddhisme tibétain comme religion d’État a transformé le paysage spirituel du monde mongol. Les monastères s'élèvent à travers la steppe et le lien entre lama et khan légitime le gouvernement par le biais d'une autorité à la fois spirituelle et temporelle."
 STATIC_MODIFIER_NAME_nd_yua_tengrism_endures: "Le tengrisme perdure"
 STATIC_MODIFIER_DESC_nd_yua_tengrism_endures: "Les anciennes méthodes du Ciel Bleu Eternel n’ont pas été abandonnées. Si les religions étrangères ont leur place, la tradition guerrière mongole puise sa force dans le respect du Tengri, du ciel ouvert et des esprits des ancêtres."
 nd_yua.1.t: "La restauration des Six Tumen"
 nd_yua.1.d: "In the late fifteenth century, a young prince of the Borjigin lineage emerged from obscurity to reunite the fractured Mongol tribes. Taking the name Dayan Khan, 'Khan of the Great Yuan', Batumongke subdued rival clans and reorganized the eastern Mongol tribes into six tumen, each a division of ten thousand warriors divided between left and right wings. With the warrior queen Mandukhai Khatun fighting at his side, Dayan Khan crushed the Oirat confederacy and restored a measure of unity not seen since the fall of Dadu.\n\nThe question now is how this restored order should be governed. Centralized command under the Great Khan's direct authority would forge a disciplined military machine, but the steppe has always been governed by consensus among equals, and the Borjigin princes expect autonomy over their own tumen.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_yua.1.a: "Les Six Tumen répondront à un seul Khan."
 nd_yua.1.b: "Que chaque prince gouverne son propre domaine à la manière de Borjigin."
 nd_yua.2.t: "La rencontre à Chabchiyal"
 nd_yua.2.d: "In 1578, Altan Khan of the Tumed Mongols invited the Third Dalai Lama, Sonam Gyatso, to a historic meeting at Chabchiyal. The encounter transformed both parties: Altan Khan bestowed the title 'Dalai Lama' upon Sonam Gyatso, who in turn recognized the Mongol ruler as a reincarnation of Kublai Khan. This exchange of legitimacy (temporal power sanctifying spiritual authority, spiritual authority sanctifying temporal power) set in motion the mass conversion of the Mongols to Tibetan Buddhism.\n\nMonasteries began to appear across the steppe, monks replaced shamans as spiritual advisors to the nobility, and the violent customs of traditional nomadic life softened under Buddhist influence. Yet not all welcomed this transformation. The old Tengrist traditions ran deep in the blood of the steppe warriors, and some saw the new religion as a foreign imposition that would drain the martial spirit of the Mongol nation."
 nd_yua.2.a: "Le Dharma illuminera la steppe."
 nd_yua.2.b: "L’Eternal Blue Sky n’a pas besoin d’être remplacé."
 nd_yua.3.t: "Le défi de Ligdan Khan"
 nd_yua.3.d: "Ligdan Khan, the last to bear the title of Great Khan of the Mongols, has raised his Chakhar warriors in desperate defiance against the rising Manchu power. With his corps of three hundred baaturs, elite warriors sworn to personal loyalty, Ligdan has attempted to centralize authority over the fractious Mongol tumen, even as one tribe after another defects to the banner of Hong Taiji.\n\nThe contest is unequal: the Manchu combine Mongol cavalry traditions with Chinese administrative efficiency, while Ligdan's harsh centralization drives his own allies into enemy arms. Yet his defiance represents the last assertion of independent Mongol sovereignty, a refusal to accept that the legacy of Genghis Khan has passed to foreign hands."
 nd_yua.3.a: "Le sang de Gengis Khan ne plie pas le genou."
 nd_yua.4.t: "Le commerce du thé au cheval"
 nd_yua.4.d: "After decades of raids and reprisals, an accommodation has been reached between the steppe and the settled world. Border markets have opened where Mongol horses, furs, and hides are exchanged for Chinese tea, silk, and grain. The Ming call it 'tribute trade' to preserve face; the Mongols call it what it is, commerce between equals.\n\nThe horse-tea trade transforms the economy of the steppe. Where once the only way to acquire Chinese goods was through plunder, now Mongol herders can trade their surplus livestock for the commodities that make steppe life bearable. Tea in particular has become a staple, without it, the monotonous diet of meat and dairy is nearly unendurable."
 nd_yua.4.a: "Le commerce enrichit à la fois la steppe et les terres agricoles."
 nd_yua_keshig_tradition: "Tradition Keshig"
 nd_yua_keshig_tradition_desc: "Le keshig, la garde du corps impériale établie par Gengis Khan lui-même, servait à la fois de garde personnelle et d'école de formation pour l'élite mongole. Issus des fils de vassaux fidèles, les guerriers keshig recevaient le meilleur équipement et la meilleure formation."
 nd_yua_imperial_relay: "Réseau de relais impérial"
 nd_yua_imperial_relay_desc: "Le système de relais postal Yam qui reliait autrefois le vaste empire mongol continue de fonctionner, transportant des messages et des fonctionnaires à travers la steppe à une vitesse remarquable."
 nd_yua_dual_administration: "Double administration"
 nd_yua_dual_administration_desc: "Les Yuan combinaient la gouvernance tribale mongole avec l'administration bureaucratique chinoise, créant un système hybride dans lequel le Conseil privé gérait les affaires militaires tandis que le Secrétariat central s'occupait des affaires civiles."
 nd_yua_great_yuan_mandate: "Mandat du Grand Yuan"
 nd_yua_great_yuan_mandate_desc: "La revendication du nom dynastique du Grand Yuan, Da Yuan, porte le poids de l'héritage de Kublai Khan et le mandat de gouverner tout sous le ciel."
 nd_yua_border_provisioning: "Approvisionnement aux frontières"
 nd_yua_border_provisioning_desc: "Les greniers et les dépôts de ravitaillement le long de la frontière steppe-agraire permettent aux populations nomades de résister aux hivers rigoureux et de soutenir les campagnes militaires."
 nd_yua_genghisid_legitimacy: "Légitimité de Gengisid"
 nd_yua_genghisid_legitimacy_desc: "Chez les Mongols, seuls les descendants de Gengis Khan par l'intermédiaire de son fils Jochi, Chagatai, Ogedei ou Tolui peuvent détenir le titre de khan. Ce principe de Gengisid est le fondement de la légitimité politique du Yuan du Nord."
 nd_yua_tammachi_garrisons: "Garnisons de Tammachi"
 nd_yua_tammachi_garrisons_desc: "Les tammachi étaient des forces de garnison stationnées dans les territoires conquis, un mélange de discipline militaire mongole et de recrutement local qui offrait une capacité défensive permanente."
 nd_yua_silk_road_tribute: "Hommage à la Route de la Soie"
 nd_yua_silk_road_tribute_desc: "Le contrôle de sections des anciennes routes commerciales de la Route de la Soie permet aux Yuan du Nord d'extraire un tribut des caravanes qui passent, soutenant ainsi le trésor même si leurs possessions territoriales diminuent."
 nd_yua_khubilai_bureaucracy: "La bureaucratie de Khubilai"
 nd_yua_khubilai_bureaucracy_desc: "The administrative machinery established by Kublai Khan, adapted from Chinese models, persists in the Yuan governing tradition, census-taking, tax collection, and provincial administration by appointed officials."
 nd_yua_chao_currency: "Système de monnaie Chao"
 nd_yua_chao_currency_desc: "La dynastie Yuan a été la première à utiliser le papier-monnaie, le chao, soutenu par un décret impérial plutôt que le métal précieux. Cette innovation, radicale pour l'époque, facilitait le commerce à travers les vastes domaines mongols."
 nd_yua_composite_bow_workshops: "Ateliers d’arcs composites"
 nd_yua_composite_bow_workshops_desc: "The Mongol composite bow, crafted from layers of horn, sinew, and wood, remains the deadliest ranged weapon of the steppe. Specialized workshops ensure a steady supply of these weapons."
 nd_yua_imperial_court_culture: "Culture de la cour impériale"
 nd_yua_imperial_court_culture_desc: "La cour des Yuan mélangeait les traditions culturelles mongoles, chinoises, tibétaines et perses en une synthèse cosmopolite inégalée dans le monde médiéval."
 nd_yua_yuan_heavy_cavalry: "Cavalerie lourde Yuan"
 nd_yua_yuan_heavy_cavalry_desc: "S'appuyant à la fois sur l'équitation mongole et sur les traditions chinoises des cataphractes, la cavalerie lourde Yuan combine la mobilité de la guerre des steppes avec la puissance de choc des lanciers blindés."
 nd_yua_steppe_retreat: "Tactiques de retraite dans la steppe"
 nd_yua_steppe_retreat_desc: "Après avoir perdu la Chine, les Yuan du Nord perfectionnèrent l'art du retrait stratégique dans la vaste steppe, utilisant les prairies sans fin comme bouclier et sanctuaire."
 nd_yua_dayan_khan_revival: "La renaissance de Dayan Khan"
 nd_yua_dayan_khan_revival_desc: "La réunification des tribus mongoles par Batumongke Dayan Khan à la fin du XVe siècle a restauré l'autorité centralisée et l'efficacité militaire de la confédération fragmentée des steppes."
 nd_yua_six_tumen_reform: "Réforme des Six Tumen"
 nd_yua_six_tumen_reform_desc: "La réorganisation des tribus mongoles orientales en six tumen (les trois ailes gauches (Chakhar, Khalkha, Uriyangkhan) et les trois ailes droites (Ordos, Tumed, Yongshebu)) rétablit le système militaire décimal de Gengis Khan."
 nd_yua_horse_tea_trade: "Commerce de thé au cheval"
 nd_yua_horse_tea_trade_desc: "L'échange formel de chevaux mongols contre du thé chinois est devenu la bouée de sauvetage économique du Yuan du Nord, remplaçant les raids par un commerce régulier sur les marchés frontaliers désignés."
 nd_yua_mongol_script_revival: "Renaissance de l'écriture mongole"
 nd_yua_mongol_script_revival_desc: "La renaissance et la standardisation de l'écriture verticale traditionnelle mongole préservent l'héritage littéraire des peuples des steppes, de l'Histoire secrète des Mongols aux sutras bouddhistes."
 nd_yua_gelugpa_conversion: "Conversion Guélougpa"
 nd_yua_gelugpa_conversion_desc: "L'adoption de l'école Gelugpa (Chapeau jaune) du bouddhisme tibétain comme religion dominante des Mongols, catalysée par la rencontre historique d'Altan Khan avec le Troisième Dalaï Lama en 1578."
 nd_yua_khorchin_alliance: "Alliance Khorchine"
 nd_yua_khorchin_alliance_desc: "Les Mongols de Khorchin, résidant dans les plaines orientales, ont servi d'alliés militaires cruciaux, leurs éclaireurs de cavalerie légère fournissant des services de renseignement et de filtrage à l'armée principale."
 nd_yua_steppe_law_code: "Code de droit des steppes"
 nd_yua_steppe_law_code_desc: "S'appuyant sur le Yasa de Gengis Khan, les dirigeants ultérieurs des Yuan du Nord ont codifié le droit coutumier des steppes en codes juridiques formels régissant la propriété, le mariage et la justice pénale."
 nd_yua_altan_khan_diplomacy: "La diplomatie d'Altan Khan"
 nd_yua_altan_khan_diplomacy_desc: "Altan Khan's diplomatic opening with the Ming dynasty in 1571 ended decades of border warfare and established regular trade relations, proving that the pen could achieve what the sword could not. On the Tumed plain his Chinese settlers raised the baishin, walled farming towns, and the city of Hohhot grew from them."
 nd_yua_dharma_patronage: "Patronage du Dharma"
 nd_yua_dharma_patronage_desc: "Le patronage royal des monastères bouddhistes et des érudits a créé des centres d'apprentissage dans toute la steppe, où les moines traduisaient les écritures, pratiquaient la médecine et préservaient les connaissances astronomiques."
 nd_yua_tumen_commanders: "Commandants de Tumen"
 nd_yua_tumen_commanders_desc: "La tradition consistant à nommer des guerriers confirmés comme commandants de tumen, chefs de dix mille, garantissait que le commandement militaire restait lié à la compétence démontrée sur le champ de bataille."
 nd_yua_chakhar_baaturs: "Chakhar Baaturs"
 nd_yua_chakhar_baaturs_desc: "Les baaturs, champions guerriers du Chakhar formaient la garde personnelle de Ligdan Khan, le dernier Grand Khan des Mongols. Forts de trois cents hommes, ils étaient les meilleurs cavaliers et combattants de la steppe."
 nd_yua_ligdan_centralization: "La centralisation de Ligadan"
 nd_yua_ligdan_centralization_desc: "La tentative de Ligdan Khan de restaurer l'autorité impériale directe sur toutes les tribus mongoles par la nomination de fonctionnaires et une fiscalité centralisée, une réforme audacieuse mais finalement source de division."
 nd_yua_last_khan_defiance: "Le défi du dernier Khan"
 nd_yua_last_khan_defiance_desc: "Alors même que la menace mandchoue grandit et que les alliés font défection, l'esprit combatif des derniers khans mongols refuse de céder. Chaque bataille perdue ne fait que renforcer la détermination à résister."
 nd_yua_nomadic_adaptation: "Adaptation nomade"
 nd_yua_nomadic_adaptation_desc: "The centuries of Northern Yuan existence proved that nomadic economies could adapt and thrive, incorporating trade goods and agricultural products into the traditional pastoral cycle."
 nd_yua_great_seal_preservation: "Préservation du Grand Sceau"
 nd_yua_great_seal_preservation_desc: "Le sceau de jade de la grande dynastie Yuan, symbole physique du mandat impérial, fut conservé par les khans successifs comme preuve que la dynastie légitime perdurait dans la steppe."
 nd_yua_steppe_modernization: "Modernisation des steppes"
 nd_yua_steppe_modernization_desc: "Contact with neighboring civilizations and internal pressures drive reforms in manufacturing and production, adapting settled technologies to the needs of the steppe economy."
 nd_yua_chinggisid_renaissance: "Renaissance Gengisid"
 nd_yua_chinggisid_renaissance_desc: "Un renouveau culturel célébrant l'héritage de Gengis Khan et du Grand Empire mongol (dans la littérature, le droit et les arts) comme fondement d'une identité nationale mongole distincte."
 nd_yua_eternal_mandate: "Mandat éternel"
 nd_yua_eternal_mandate_desc: "Le mandat du Grand Yuan, transmis par la lignée des Borjigin depuis Gengis Khan jusqu'à nos jours, n'est pas simplement une revendication politique mais une vérité cosmique, le Ciel Bleu Éternel a choisi cette lignée pour gouverner."
 nd_yua_cavalry_reformation: "Réforme de la cavalerie"
 nd_yua_cavalry_reformation_desc: "Les anciennes traditions de cavalerie de la steppe sont réformées pour l'ère moderne, intégrant de nouvelles tactiques et méthodes d'entraînement tout en préservant les avantages mongols fondamentaux de la mobilité et du tir à l'arc."
 nd_yua_great_yuan_legacy: "Grand héritage du Yuan"
 nd_yua_great_yuan_legacy_desc: "L’héritage du Grand Yuan, un empire qui s’étendait autrefois de la Corée à la Hongrie, demeure une source d’inspiration et d’aspiration pour la nation mongole."
 a_nd_yua_keshig_guard: "Garde Keshig"
 a_nd_yua_keshig_guard_desc: "Gardes du corps impériaux d'élite du Grand Khan, les keshig sont issus des fils de nobles fidèles de Borjigin et entraînés à la fois au tir à l'arc monté et au combat de cavalerie lourde. Leur fidélité est absolue."
 a_nd_yua_yuan_lancer: "Yuan Lancer"
 a_nd_yua_yuan_lancer_desc: "Cavalerie lourde blindée combinant l'équitation mongole avec les traditions chinoises de la cataphracte. Ces lanciers portent à la fois une lance et un arc composite, capables de lancer des charges dévastatrices suivies d'un tir à l'arc monté."
 a_nd_yua_chakhar_baatur: "Chakhar Baatur"
 a_nd_yua_chakhar_baatur_desc: "Les baaturs, champions guerriers de la tribu Chakhar, servant de garde personnelle du dernier Grand Khan. Féroces en attaque et inébranlables en défense, ils incarnent la dernière flamme de l'indépendance mongole."
 a_nd_yua_tumen_horse: "Tumen Horse"
 a_nd_yua_tumen_horse_desc: "The herdsmen of the six tumen, called out by wing and banner with their own bows and their own strings of ponies."
 a_nd_yua_chakhar_carbineer: "Chakhar Carbineers"
 a_nd_yua_chakhar_carbineer_desc: "Chakhar horsemen who carry a carbine beside the saddle bow, drilled to fire from the saddle and ride on."
 a_nd_yua_tammachi: "Tammachi"
 a_nd_yua_tammachi_desc: "Troupes de garnison issues des populations installées à la frontière mongole-chinoise. Les tammachi combinent discipline d'infanterie et connaissance du terrain local, défendant la frontière entre steppe et terres agricoles."
 a_nd_yua_khorchin_scout: "Éclaireur Khorchin"
 a_nd_yua_khorchin_scout_desc: "Cavalerie légère des Mongols de l'est du Khorchin, maîtres de l'exploration, des raids et de la feinte retraite. Ils montent les chevaux les plus rapides et frappent là où l'ennemi s'y attend le moins."
 nd_yua_yam_station: "Gare impériale de Yam"
 nd_yua_yam_station_desc: "Un poste relais dans le système Yam, le réseau de points d'étape de l'Empire mongol qui permettait aux messages et aux fonctionnaires de traverser la steppe à une vitesse extraordinaire."
 nd_yua_secretariat: "Secrétariat du Yuan"
 nd_yua_secretariat_desc: "Un bureau administratif adapté du chinois Zhongshu Sheng, composé de fonctionnaires alphabétisés qui gèrent les affaires civiles, la fiscalité et les registres de recensement dans la tradition Yuan."
 nd_yua_steppe_granary: "Grenier des steppes"
 nd_yua_steppe_granary_desc: "Des installations de stockage de nourriture à la frontière steppe-agraire, garantissant que les populations nomades et les forces de garnison peuvent survivre aux hivers rigoureux et soutenir les opérations militaires."
 nd_yua_tibetan_temple: "Temple bouddhiste tibétain"
 nd_yua_tibetan_temple_desc: "Un monastère de l'école Gelugpa, où des moines tibétains enseignent le Dharma aux convertis mongols. Ces temples servent de centres d'alphabétisation, de médecine et d'échange culturel."
 nd_yua_border_market: "Poste de traite frontalier"
 nd_yua_border_market_desc: "Un marché désigné à la frontière steppe-agraire où les chevaux, les fourrures et les peaux mongols sont échangés contre du thé, de la soie et des céréales chinois."
 nd_yua_eight_white_yurts: "Eight White Yurts"
 nd_yua_eight_white_yurts_desc: "The tent shrine of Chinggis Khan, kept by the Darkhad who are freed of every other duty. Before these yurts a khan of the Great Yuan is raised on the white felt."
 nd_yua_bow_workshop: "Composite Bow Workshop"
 nd_yua_bow_workshop_desc: "A bowyers' workshop where horn, sinew and wood are glued in layers and left to cure for a year, the work behind every bow of the steppe."
 nd_yua_pingzhun_treasury: "Pingzhun Treasury"
 nd_yua_pingzhun_treasury_desc: "An exchange treasury of the paper currency, where chao is changed for silver at the official rate and worn notes are redeemed for new."
 nd_yua_darughachi_office: "Darughachi Office"
 nd_yua_darughachi_office_desc: "The seat of a darughachi, the resident overseer who holds the seal of a town, counts its households and gathers its tax for the khan."
 nd_yua_baishin: "Baishin"
 nd_yua_baishin_desc: "A walled settlement of Chinese farmers and craftsmen on the pasture, tilling millet and wheat for a nomad lord in return for his protection."
 nd_yua_mamba_datsan: "Mamba Datsan"
 nd_yua_mamba_datsan_desc: "The medical college of a monastery, where lamas study the Four Tantras, gather herbs and compound remedies for herders and princes alike."
 nd_yua_eight_white_yurts_rites: "Rites of the White Yurts"
 nd_yua_eight_white_yurts_rites_desc: "Sheep and mare's milk for the seasonal offerings, felt for the tents, and silk scarves for the relics."
 nd_yua_bow_making: "Bow Making"
 nd_yua_bow_making_desc: "Horn and sinew from the herds are laid over a wooden core to make the composite bows that arm the tumen."
 nd_yua_pingzhun_treasury_upkeep: "Treasury Operations"
 nd_yua_pingzhun_treasury_upkeep_desc: "Mulberry paper for the notes, a reserve of silver to stand behind them, and cinnabar for the seals."
 nd_yua_darughachi_office_upkeep: "Overseer's Household"
 nd_yua_darughachi_office_upkeep_desc: "Paper for the registers, remounts for the overseer's riders, and tools for the keeping of his seat."
 nd_yua_baishin_upkeep: "Settlement Upkeep"
 nd_yua_baishin_upkeep_desc: "Ploughs and hoes, timber for the houses and brick for the wall."
 nd_yua_mamba_datsan_upkeep: "College Dispensary"
 nd_yua_mamba_datsan_upkeep_desc: "Herbs and minerals for the remedies, paper for the medical texts, and incense for the Medicine Buddha."
 nd_yua_yam_upkeep: "Entretien du relais Yam"
 nd_yua_yam_upkeep_desc: "Des chevaux, du bétail et des outils frais pour entretenir le réseau de relais impérial, remplacer les montures usées, approvisionner les cavaliers et maintenir les postes de poste en bon état."
 nd_yua_secretariat_staff: "Administration du Secrétariat"
 nd_yua_secretariat_staff_desc: "Papier, encres et tissus fins pour les robes de bureau, les fournitures et les tenues formelles nécessaires aux opérations bureaucratiques du système administratif Yuan."
 nd_yua_grain_storage: "Gestion des réserves de céréales"
 nd_yua_grain_storage_desc: "Stocker des céréales, du bois et des outils pour le système de greniers des steppes, entretenir les structures et gérer les réserves qui soutiennent les populations frontalières pendant les hivers rigoureux."
 nd_yua_temple_offerings: "Offrandes au temple"
 nd_yua_temple_offerings_desc: "Soie, teintures, encens et papier offerts aux monastères bouddhistes, soies pour tentures d'autel, pigments pour peintures thangka, encens pour rituels et papier pour la copie de sutras."
 nd_yua_horse_tea_exchange: "Échange de thé et de cheval"
 nd_yua_horse_tea_exchange_desc: "L'échange régulier de chevaux et de bétail des steppes contre du thé chinois, avec du papier utilisé pour les documents commerciaux et les accords, élément vital de l'économie frontalière entre nomades et agriculteurs."
 levy_nd_yua_tammachi: "Prélèvement de la garnison de Tammachi"
 levy_nd_yua_tammachi_desc: "Infanterie de garnison issue des colonies frontalières, combinant les traditions martiales mongoles avec les connaissances défensives locales."
 levy_nd_yua_tumen_horse: "Tumen Horse Levy"
 levy_nd_yua_tumen_horse_desc: "Herdsmen of the six tumen, raised as light horse by the old decimal muster."
 levy_nd_yua_khorchin_scout: "Prélèvement des éclaireurs de Khorchin"
 levy_nd_yua_khorchin_scout_desc: "Des éclaireurs de cavalerie légère des tribus Khorchin, élevés grâce aux obligations de prélèvement traditionnelles mongoles."
 nd_yua_formed_tt: "Le Yuan a été formé"
 nd_yua_path_a_tt: "Choisissez l'Ordre des Six Tumen"
 nd_yua_path_b_tt: "A choisi l'autonomie de Borjigin"
 AUTO_MODIFIER_NAME_nd_yua_bureaucracy_authority: "Autorité bureaucratique du Grand Yuan"
 AUTO_MODIFIER_DESC_nd_yua_bureaucracy_authority: "Upon restoration of the Great Yuan, the dynasty unlocks the bureaucracy system and may install up to three historical institutions drawn from the branch secretariats, the Shumi Yuan privy council, the branch censorates, the Semu ethnic caste hierarchy, the Phags-pa script apparatus, and the Yangzhou salt monopoly."
 yua_zhongshu_sheng_bureaucracy: "Branch Secretariats"
 yua_zhongshu_sheng_bureaucracy_desc: "The Central Secretariat ruled the country around the capital. Everything else went to its branches, the Xing Zhongshu Sheng: in the end eleven copies of the central office, each sent out to govern a conquered land under chancellors who were almost always Mongols or Semuren, never Han. They began as headquarters that moved with the armies and stayed where the armies stopped. Later dynasties renamed and redrew them, and the provinces of China descend from them."
 yua_shumi_yuan_bureaucracy: "Shumi Yuan"
 yua_shumi_yuan_bureaucracy_desc: "Le Bureau des affaires militaires (Shumi Yuan), reconstruit par Khubilai Khan en 1263, était une réserve exclusivement mongole-Semuren. Là où le Zhongshu Sheng admettait la participation des Han aux affaires civiles, le Shumi Yuan commandait les unités keshig, les garnisons frontalières de tammachi et le tumen impérial sans Han-ren au rang supérieur pendant le premier siècle de la dynastie. Vers 1287, elle ne répondait qu'au khan, coégal du secrétariat civil. L’institution exprimait un principe structurel du Yuan : les armes restent entre les mains du peuple conquérant."
 yua_yushi_tai_bureaucracy: "Branch Censorates"
 yua_yushi_tai_bureaucracy_desc: "Khubilai Khan's decree of 1268 raised the Censorate to equal rank with the civil and military secretariats. What no earlier dynasty had was its branches: a Branch Censorate for Jiangnan and another for Shaanxi, each sending inspectors on circuit through the provinces beneath it, with the right to impeach a branch chancellor. The khans valued them as a check on their own governors. The inspectors collided endlessly with the Mongol nobility, whose ortoq trading partnerships they investigated."
 yua_semu_caste_bureaucracy: "Hiérarchie des castes Semu"
 yua_semu_caste_bureaucracy_desc: "L'innovation politique déterminante du règne des Yuan était la classification ethnique formelle à quatre niveaux : Mongols, puis Semuren (« peuple aux yeux divers » : Perses, Tangoutes, Tibétains, Ouïghours, Turcs, Européens), puis Han-ren des anciens Jin, puis Nan-ren des anciens Song du Sud. Les niveaux déterminaient l'accès aux fonctions supérieures, le statut judiciaire, les privilèges liés aux armes et l'évaluation fiscale. Le système a donné au trône un vaste bassin de loyalistes nés à l’étranger qui devaient tout à la dynastie : et a semé les rébellions Han-ren qui ont mis fin au règne des Yuan."
 yua_phags_pa_script_bureaucracy: "Appareil de script Phags-pa"
 yua_phags_pa_script_bureaucracy_desc: "En 1269, Khubilai Khan chargea le jeune lama tibétain Drogon Chogyal Phagpa de créer une écriture phonétique unique capable de transcrire toutes les langues de l'empire - mongol, chinois, tibétain, sanskrit, ouïghour, persan - en un seul ensemble de lettres carrées. Un décret impérial en a fait l'écriture officielle de la dynastie : les sceaux d'État, la monnaie et les édits en texte parallèle du Bureau des langues nationales portaient tous les lettres Phags-pa. Le Bureau a également servi d'échafaudage institutionnel pour le rôle de Phagpa en tant que précepteur impérial (Dishi), reliant le trône Yuan au monastère Sa-skya du Tibet."
 yua_yan_zheng_bureaucracy: "Yan Zheng"
 yua_yan_zheng_bureaucracy_desc: "La politique fiscale du Yuan dépendait du monopole du sel (yan zheng) administré depuis Yangzhou. Poussée à l'extrême par les ministres Lu Shi-rong (exécuté en 1285) et Sangha (exécuté en 1291), la commission Yan Yun Si monopolisa la production des salines côtières de Liang-zhe et Liang-huai, distribua les produits par l'intermédiaire de marchands agréés payés en certificats-warrants yan-yin et reversa les revenus directement au Trésor impérial. Au plus fort de son activité, le sel représentait jusqu'à quatre-vingts pour cent des revenus du gouvernement central. Cette dépendance constituait la force et la faiblesse de la dynastie : lorsque les rébellions du Yangzi dans les années 1350 perturbèrent l'extraction du sel dans le sud, les revenus centraux s'effondrèrent en une décennie."
