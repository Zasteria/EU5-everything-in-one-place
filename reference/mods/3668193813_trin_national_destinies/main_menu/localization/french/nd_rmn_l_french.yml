l_french:
 STATIC_MODIFIER_NAME_nd_rmn_antemurale_christianitatis: "Christianitatis antemurale"
 STATIC_MODIFIER_DESC_nd_rmn_antemurale_christianitatis: "La Roumanie constitue le rempart de la chrétienté contre la marée ottomane, une nation forteresse dont les montagnes et les rivières forment un bouclier naturel pour toute l’Europe."
 STATIC_MODIFIER_NAME_nd_rmn_danubian_prosperity: "La prospérité danubienne"
 STATIC_MODIFIER_DESC_nd_rmn_danubian_prosperity: "Située au carrefour de trois empires, la Roumanie exploite les richesses du Danube (ses céréales, son bétail, son sel) pour bâtir un royaume prospère et cultivé."
 STATIC_MODIFIER_NAME_nd_rmn_painted_monasteries_legacy: "L'héritage des monastères peints"
 STATIC_MODIFIER_DESC_nd_rmn_painted_monasteries_legacy: "Les monastères peints de Moldavie sont des monuments de dévotion orthodoxe et de génie artistique, inspirant la fierté culturelle des principautés unies."
 STATIC_MODIFIER_NAME_nd_rmn_press_the_advantage: "Appuyez sur l'avantage"
 STATIC_MODIFIER_DESC_nd_rmn_press_the_advantage: "Dans l'esprit de Michel le Brave, les armées roumaines s'efforcent de revendiquer ce qui appartient au peuple roumain par le sang et l'épée."
 STATIC_MODIFIER_NAME_nd_rmn_consolidate_the_realm: "Consolider le royaume"
 STATIC_MODIFIER_DESC_nd_rmn_consolidate_the_realm: "Plutôt que de s'étendre comme Michael l'a fait autrefois, la Roumanie assure son emprise sur les trois principautés, les liant par la loi et un objectif commun."
 nd_rmn.1.t: "Le royaume roumain"
 nd_rmn.1.d: "The three lands of the Romanians (Wallachia, Moldavia, and Transylvania) are united under a single crown at last. For centuries, the Romanian people endured as subjects divided between Ottoman vassalage, Habsburg domination, and precarious independence. Now, from Bucharest, the new kingdom looks upon its Carpathian heartland and the fertile Danubian plain with the question that has defined every Romanian ruler since Basarab: shall we be the shield that holds the line, or the crossroads that grows rich from all who pass?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_rmn.1.a: "Nous sommes le rempart : la dernière forteresse de la chrétienté."
 nd_rmn.1.b: "Nous sommes le carrefour : le royaume le plus riche du Danube."
 nd_rmn.2.t: "Les monastères peints"
 nd_rmn.2.d: "Dans les collines de Moldavie, les monastères construits par Étienne le Grand et ses successeurs ont été transformés de manière sans précédent. Leurs murs extérieurs brillent de fresques représentant des saints, des scènes bibliques et le siège de Constantinople, des bibliothèques théologiques entières peintes pour une congrégation illettrée. À Voronet, la nuance particulière de bleu utilisée par les peintres est devenue célèbre dans le monde orthodoxe, une couleur qui défie toute reproduction. Chez Humor, Moldovita et Sucevita, la même tradition se perpétue. Ce ne sont pas de simples églises mais des déclarations de foi en pigments et en plâtre, construites pour résister aux intempéries et à la conquête. Le pape Sixte IV a un jour nommé Étienne « Athlète Christi », et ces monastères sont son testament durable."
 nd_rmn.2.a: "Un héritage en peinture et en pierre."
 nd_rmn.3.t: "La première unification"
 nd_rmn.3.d: "En 1600, Michel le Brave accomplit ce qu'aucun dirigeant roumain n'avait fait auparavant. Il unifia la Valachie, la Transylvanie et la Moldavie sous une seule couronne. Après avoir mis en déroute les Ottomans à Calugareni avec à peine 16 000 hommes contre les forces de Sinan Pacha, il se tourna vers le nord. A Selimbar, il bat le prince de Transylvanie Andreas Bathory. En mai 1600, ses armées avaient également pris la Moldavie. Pendant un bref et brillant moment, les trois terres roumaines n’en faisaient qu’une. Mais les Habsbourg et les Polonais ne toléreraient pas une telle unité. En moins d'un an, Michael fut trahi et assassiné à Campia Turzii. Le syndicat s'est dissous aussi vite qu'il avait été forgé. Aujourd’hui, des siècles plus tard, le rêve revit. La question est de savoir quoi en faire."
 nd_rmn.3.a: "Continuez : terminez ce que Michael a commencé."
 nd_rmn.3.b: "Consolider : faire perdurer cette union."
 nd_rmn.4.t: "La guerre d'indépendance"
 nd_rmn.4.d: "À Plevna, Grivitsa et Rahova, les soldats roumains ont prouvé que cette nation pouvait figurer parmi les puissances européennes. Les Dorobanti, soldats paysans venus de chaque village du royaume, ont tenu tête aux réguliers ottomans et ont gagné l'indépendance de la Roumanie avec sang et courage. Les grandes puissances qui traitaient autrefois les principautés danubiennes comme des pions doivent désormais compter avec un royaume souverain. Le 9 mai 1877, le Parlement roumain déclara l'indépendance totale et l'armée traversa le Danube pour concrétiser cette déclaration. Le Royaume de Roumanie est reconnu par le Traité de Berlin, non plus comme un vassal, plus comme un pion, mais comme une nation à part entière."
 nd_rmn.4.a: "La Roumanie est libre."
 nd_rmn_voivodal_tradition: "Tradition voïvodale"
 nd_rmn_voivodal_tradition_desc: "Le système du voïvode, chef de guerre et prince, ancre la gouvernance roumaine à la fois dans l’autorité martiale et dans les coutumes foncières."
 nd_rmn_battle_of_posada: "L'héritage de Posada"
 nd_rmn_battle_of_posada_desc: "Lors de la bataille de Posada en 1330, Basarab Ier tendit une embuscade et détruisit une armée hongroise largement supérieure dans un col de montagne, établissant ainsi l'indépendance de la Valaque grâce à ses compétences de cavalerie et à sa connaissance du terrain."
 nd_rmn_salt_wealth: "Richesse en sel des Carpates"
 nd_rmn_salt_wealth_desc: "Les vastes gisements de sel des Carpates sont exploités depuis l'Antiquité, fournissant aux principautés roumaines une source fiable de richesse et un produit commercial crucial."
 nd_rmn_mountain_fortresses: "Forteresses de montagne"
 nd_rmn_mountain_fortresses_desc: "De Poenari à Bran, les forteresses gardant les cols des Carpates constituent l'épine dorsale de la défense roumaine contre les envahisseurs venus de toutes parts."
 nd_rmn_orthodox_foundation: "Fondation orthodoxe"
 nd_rmn_orthodox_foundation_desc: "La création de sièges métropolitains orthodoxes en Valachie et en Moldavie a donné aux principautés une indépendance spirituelle à la hauteur de leur autonomie politique."
 nd_rmn_boyar_estates: "Domaines des Boyards"
 nd_rmn_boyar_estates_desc: "La classe des propriétaires terriens boyards constituait l'épine dorsale de la gouvernance roumaine, administrant la justice et collectant des revenus dans toutes les principautés."
 nd_rmn_fortified_churches: "Églises fortifiées"
 nd_rmn_fortified_churches_desc: "Plus de 150 églises fortifiées en Transylvanie ont servi à la fois de lieux de culte et de refuges communautaires contre les pillards tatars, ottomans et autres."
 nd_rmn_danubian_trade: "Commerce danubien"
 nd_rmn_danubian_trade_desc: "Le Danube et ses affluents transportaient des céréales, du sel, du bétail et des peaux roumains vers les marchés d'Europe centrale et de la mer Noire."
 nd_rmn_order_of_the_dragon: "Ordre du Dragon"
 nd_rmn_order_of_the_dragon_desc: "Vlad Tepes a utilisé la terreur comme arme d'État, l'empalement, la terre brûlée, et l'attaque nocturne de Targoviste a démontré qu'un défenseur en infériorité numérique pouvait briser la volonté d'un envahisseur plus important."
 nd_rmn_athleta_christi: "Athlète Christi"
 nd_rmn_athleta_christi_desc: "Étienne le Grand de Moldavie a remporté 46 de ses 48 batailles, ce qui lui a valu le titre de « Champion du Christ » des mains du pape Sixte IV pour sa défense de la chrétienté lors de la bataille de Vaslui."
 nd_rmn_painted_monasteries: "Monastères peints"
 nd_rmn_painted_monasteries_desc: "Après chaque victoire, Etienne le Grand fondait un monastère. Ses successeurs ont recouvert leurs murs de fresques à couper le souffle, créant ainsi les monastères peints de Bucovine."
 nd_rmn_princely_authority: "Autorité Princière"
 nd_rmn_princely_authority_desc: "La consolidation du pouvoir voïvodal sur le conseil des boyards a renforcé la gouvernance centrale dans les principautés roumaines."
 nd_rmn_pastoral_wealth: "Richesse pastorale"
 nd_rmn_pastoral_wealth_desc: "La laine, les peaux et le bétail roumains étaient exportés en grandes quantités vers la Transylvanie, la Pologne et l'Empire ottoman, formant ainsi l'épine dorsale économique des principautés."
 nd_rmn_lefegii_tradition: "Tradition Lefegii"
 nd_rmn_lefegii_tradition_desc: "L'infanterie mercenaire professionnelle, les Lefegii, complétait les levées féodales des principautés, fournissant des troupes frontalières expérimentées et compétentes dans la guerre en montagne."
 nd_rmn_calarasi_tradition: "Tradition Calarasi"
 nd_rmn_calarasi_tradition_desc: "Les Calarasi étaient une cavalerie frontalière valaque, des éclaireurs à cheval et des patrouilleurs qui gardaient les frontières et transportaient des dépêches à travers la vaste plaine danubienne."
 nd_rmn_scorched_earth: "Doctrine de la Terre Brûlée"
 nd_rmn_scorched_earth_desc: "Les défenseurs roumains ont systématiquement refusé des ressources aux envahisseurs, empoisonnant les puits, détournant les rivières et se retirant dans les montagnes pour épuiser les forces supérieures par attrition."
 nd_rmn_curtea_de_arges: "Curtea de Arges"
 nd_rmn_curtea_de_arges_desc: "Le monastère de Curtea de Arges, construit par Neagoe Basarab en 1517, représente le summum de l'architecture ecclésiastique roumaine et du mécénat scientifique."
 nd_rmn_grain_trade: "Commerce des céréales danubiennes"
 nd_rmn_grain_trade_desc: "La plaine fertile du Danube et les basses terres valaques produisaient des excédents de blé et des peaux de bétail qui alimentaient et habillaient les marchés de Constantinople jusqu'en Europe centrale."
 nd_rmn_chancellery_reform: "Réforme de la Chancellerie"
 nd_rmn_chancellery_reform_desc: "La modernisation des chancelleries princières a introduit une tenue systématique des registres et des procédures administratives calquées sur les pratiques byzantines et polonaises."
 nd_rmn_first_unification: "Première unification"
 nd_rmn_first_unification_desc: "En 1600, Michel le Brave unifia brièvement la Valachie, la Transylvanie et la Moldavie, c'était la première fois que les trois terres roumaines étaient gouvernées par un seul prince."
 nd_rmn_confessional_resilience: "Résilience confessionnelle"
 nd_rmn_confessional_resilience_desc: "Alors que la Transylvanie devenait un champ de bataille de Réforme et de Contre-Réforme, l'Orthodoxie roumaine persistait en tant que force culturelle unificatrice dans les trois principautés."
 nd_rmn_host_reform: "Réforme de l'hôte"
 nd_rmn_host_reform_desc: "La transformation de l'Oastea d'une levée féodale en une force plus professionnelle, avec des soldats rémunérés et un équipement standardisé remplaçant les anciennes suites de boyards."
 nd_rmn_seimeni_guards: "Gardes Seimeni"
 nd_rmn_seimeni_guards_desc: "Les Seimeni étaient des gardes professionnels recrutés par les princes moldaves et valaques, une infanterie permanente payée en espèces et en terres, formant un noyau fiable autour duquel l'armée féodale était organisée."
 nd_rmn_transylvanian_mines: "Mines de Transylvanie"
 nd_rmn_transylvanian_mines_desc: "Les mines d'argent et de cuivre de Transylvanie, en particulier autour de Baia Mare et de Rosia Montana, fournissaient des richesses minérales qui attiraient les colons saxons et alimentaient le commerce régional."
 nd_rmn_pravila: "La Pravila"
 nd_rmn_pravila_desc: "La codification du droit coutumier dans des codes juridiques écrits, les Pravilele, a apporté une cohérence à la gouvernance à travers les principautés, remplaçant la tradition orale par des statuts écrits."
 nd_rmn_cultural_awakening: "Éveil culturel"
 nd_rmn_cultural_awakening_desc: "L'émergence de la littérature, des chroniques et des textes religieux de langue roumaine a favorisé une identité partagée entre les Roumains des trois principautés."
 nd_rmn_phanariote_reform: "Réforme phanariote"
 nd_rmn_phanariote_reform_desc: "Bien que l’ère phanariote ait amené des gouverneurs de langue grecque de Constantinople, elle a également introduit des réformes administratives, une codification juridique et des liens avec les idées des Lumières."
 nd_rmn_rosiori_tradition: "Tradition Rosiori"
 nd_rmn_rosiori_tradition_desc: "Les Rosiori, « les rouges », étaient l'élite de la cavalerie légère roumaine, se distinguant par leurs uniformes rouges et leurs compétences en reconnaissance, en raid et en poursuite."
 nd_rmn_vanatori_tradition: "Vanatori de Munte"
 nd_rmn_vanatori_tradition_desc: "Les Vanatori, chasseurs de montagne roumains, étaient des spécialistes de l'infanterie légère formés dans les hautes terres des Carpates, experts en embuscade, en guerre alpine et en opérations indépendantes en terrain accidenté."
 nd_rmn_organic_statute: "Statut Organique"
 nd_rmn_organic_statute_desc: "Le Regulamentul Organic de 1831-32 a établi un cadre constitutionnel moderne pour les principautés danubiennes, réformant la fiscalité, la justice et l'administration publique."
 nd_rmn_breadbasket: "Le grenier de l'Orient"
 nd_rmn_breadbasket_desc: "L'énorme production de blé de la Roumanie en a fait le grenier de l'Europe du Sud-Est, les exportations de céréales transitant par Braïla et Galati vers les marchés de la Méditerranée."
 nd_rmn_border_modernization: "Modernisation des frontières"
 nd_rmn_border_modernization_desc: "La modernisation des défenses frontalières de la Roumanie a remplacé les forteresses médiévales par des fortifications modernes adaptées à la guerre d'artillerie."
 nd_rmn_war_of_independence: "Guerre d'Indépendance"
 nd_rmn_war_of_independence_desc: "À Plevna, Grivitsa et Rahova en 1877-78, les soldats roumains combattirent aux côtés des forces russes pour obtenir leur totale indépendance face à la suzeraineté ottomane."
 nd_rmn_national_awakening: "Réveil national"
 nd_rmn_national_awakening_desc: "L’école de Transylvanie et les mouvements intellectuels ultérieurs ont standardisé la langue roumaine, relancé l’écriture de l’alphabet latin et forgé une conscience nationale moderne."
 nd_rmn_cuza_reforms: "Les réformes de Cuza"
 nd_rmn_cuza_reforms_desc: "Les réformes radicales d'Alexandru Ioan Cuza (redistribution des terres, sécularisation des monastères, éducation universelle) ont transformé la Roumanie d'une société féodale en un État moderne."
 nd_rmn_oil_industry: "Industrie pétrolière"
 nd_rmn_oil_industry_desc: "La Roumanie a été l'un des premiers producteurs de pétrole au monde, avec des raffineries à Ploiesti opérationnelles dès les années 1850. En 1900, la Roumanie était le plus grand exportateur de pétrole d’Europe."
 nd_rmn_paris_of_east: "Paris de l'Est"
 nd_rmn_paris_of_east_desc: "La transformation de Bucarest en une capitale cosmopolite (avec des boulevards d'inspiration française, une architecture néoclassique et des salons intellectuels prospères) lui a valu le surnom de « Micul Paris »."
 nd_rmn_modern_army: "Armée roumaine moderne"
 nd_rmn_modern_army_desc: "La réorganisation de l'armée roumaine selon les lignes prussiennes, avec des équipements modernes, des académies d'officiers et la conscription, a créé une force nationale compétente."
 a_nd_rmn_viteji: "Viteji"
 a_nd_rmn_viteji_desc: "Cavalerie courtisane d'élite des principautés roumaines. Les Viteji étaient des nobles mineurs avec des obligations militaires permanentes, des cavaliers rapides et habiles qui excellaient dans les raids et les embuscades dans les cols des Carpates."
 a_nd_rmn_viteji_levy: "Viteji"
 a_nd_rmn_viteji_levy_desc: "Cavalerie noble levée auprès des domaines boyards des principautés."
 a_nd_rmn_lefegii: "Lefégii"
 a_nd_rmn_lefegii_desc: "Infanterie mercenaire professionnelle des principautés roumaines. Troupes frontalières expérimentées, compétentes dans la guerre en montagne, la défense des fortifications et les escarmouches en terrain difficile."
 a_nd_rmn_calarasi: "Calarasi"
 a_nd_rmn_calarasi_desc: "Cavalerie frontalière valaque, éclaireurs à cheval et patrouilleurs qui gardaient les frontières des principautés, transportant des dépêches et attaquant les lignes de ravitaillement ennemies."
 a_nd_rmn_seimeni: "Seimeni"
 a_nd_rmn_seimeni_desc: "Infanterie permanente professionnelle des principautés roumaines. Payés en espèces et en concessions de terres, les Seimeni formaient un noyau discipliné de gardes fidèles au voïvode plutôt qu'au conseil des boyards."
 a_nd_rmn_rosiori: "Rosiori"
 a_nd_rmn_rosiori_desc: "La cavalerie légère d'élite roumaine, les Rosiori, les « Rouges », servaient de troupes de reconnaissance, de raiders et de poursuite. Se distinguent par leurs uniformes rouges et leur superbe équitation."
 a_nd_rmn_vanatori: "Vanatori de Munte"
 a_nd_rmn_vanatori_desc: "Chasseurs de montagne roumains, spécialistes de l'infanterie légère formés à la guerre alpine, experts en embuscade et en opérations indépendantes dans les hautes terres des Carpates."
 a_nd_rmn_dorobanti: "Dorobanti"
 a_nd_rmn_dorobanti_desc: "L'épine dorsale de l'armée roumaine moderne. Les Dorobanti étaient une infanterie territoriale issue des communautés paysannes du royaume, qui ont fait leurs preuves à Plevna et Grivitsa pendant la guerre d'indépendance."
 a_nd_rmn_dorobanti_levy: "Dorobanti"
 a_nd_rmn_dorobanti_levy_desc: "Infanterie territoriale levée auprès des communautés paysannes roumaines."
 a_nd_rmn_panduri: "Panduri"
 a_nd_rmn_panduri_desc: "Guérilla irrégulière des Balkans des montagnes d'Olténie. Les Panduri se spécialisaient dans les embuscades, les raids et les tactiques de la terre brûlée contre les envahisseurs ottomans."
 nd_rmn_curtea_domneasca: "Curtea Domneasca"
 nd_rmn_curtea_domneasca_desc: "La Cour Princière, siège de l'autorité voïvodale où les boyards se réunissent pour conseiller le prince, administrer la justice et coordonner la gouvernance du royaume."
 nd_rmn_fortificatie: "Forteresse de montagne"
 nd_rmn_fortificatie_desc: "Une forteresse des Carpates gardant les cols entre les principautés, formant l'épine dorsale de la défense roumaine contre les envahisseurs ottomans, hongrois et tatars."
 nd_rmn_biserica_fortificata: "Église fortifiée"
 nd_rmn_biserica_fortificata_desc: "Une institution typiquement transylvanienne, des églises construites avec des murs défensifs, des tours et des greniers pour abriter des communautés entières lors des raids."
 nd_rmn_ocna_de_sare: "Salines"
 nd_rmn_ocna_de_sare_desc: "Les mines de sel roumaines de Praid, Turda et Slanic sont exploitées depuis l'Antiquité. Le sel était si précieux qu’il servait de monnaie et finançait les trésors princiers pendant des siècles."
 nd_rmn_han_comercial: "Han commercial"
 nd_rmn_han_comercial_desc: "Une auberge commerciale danubienne où se reposent et échangent des marchandises les marchands, les bouviers et les commerçants fluviaux, les nœuds commerciaux des réseaux commerciaux roumains."
 nd_rmn_vie_domneasca: "Vie Domneasca"
 nd_rmn_vie_domneasca_desc: "Un vignoble et un chai princier. La viticulture roumaine remonte à l'époque dace, les régions de Dealu Mare et Cotnari produisant des vins prisés dans tout le sud-est de l'Europe."
 nd_rmn_scoala: "École roumaine"
 nd_rmn_scoala_desc: "Une institution d'enseignement en langue roumaine, créée lors du réveil national pour enseigner dans la langue maternelle et forger une citoyenneté alphabétisée et consciente de sa conscience nationale."
 nd_rmn_stana: "Stana"
 nd_rmn_stana_desc: "Une bergerie et une station pastorale d'altitude. Les bergers roumains conduisent leurs troupeaux à travers les Carpates depuis des temps immémoriaux, produisant de la laine, du fromage et des peaux pour le commerce."
 nd_rmn_tabara_militara: "Camp militaire"
 nd_rmn_tabara_militara_desc: "Une garnison professionnelle et un centre d'entraînement pour l'armée roumaine réformée, remplaçant les troupes féodales ad hoc de l'armée médiévale."
 nd_rmn_rafinarie: "Raffinerie de pétrole"
 nd_rmn_rafinarie_desc: "Une des premières raffineries de pétrole traitant l'abondant pétrole brut de Roumanie. Les raffineries de Ploiesti ont été parmi les premières au monde, faisant de la Roumanie un pionnier de l'ère pétrolière."
 nd_rmn_tabacarie: "Tannerie de cuir"
 nd_rmn_tabacarie_desc: "Un atelier de tannage transformant les peaux des vastes troupeaux roumains en articles en cuir destinés à l'usage domestique et à l'exportation danubienne."
 nd_rmn_court_maintenance: "Entretien des tribunaux"
 nd_rmn_court_maintenance_desc: "Entretien de la cour princière, draps et draps fins pour les livrées, cire d'abeille pour l'éclairage et papier pour la correspondance de la chancellerie."
 nd_rmn_fortress_upkeep: "Garnison de la forteresse"
 nd_rmn_fortress_upkeep_desc: "Entretien de la garnison et des défenses, pierre pour les réparations, armement pour les soldats, outils pour l'entretien et bois pour palissades et structures."
 nd_rmn_church_upkeep: "Entretien de l'église"
 nd_rmn_church_upkeep_desc: "Entretien de l'église fortifiée, cierges en cire d'abeille pour le culte, pierres pour les réparations, tissus pour les vêtements et bois pour le grenier communautaire."
 nd_rmn_salt_extraction: "Extraction du sel"
 nd_rmn_salt_extraction_desc: "Extraction et transformation du sel gemme des gisements des Carpates."
 nd_rmn_han_operations: "Opérations Han"
 nd_rmn_han_operations_desc: "Approvisionnement de l'auberge commerciale, blé et bétail pour les cuisines, sel pour la conservation et papier pour les registres commerciaux et la correspondance des marchands."
 nd_rmn_wine_production: "Production de vin"
 nd_rmn_wine_production_desc: "Culture et pressurage des raisins dans les vignobles princiers."
 nd_rmn_school_operations: "Opérations scolaires"
 nd_rmn_school_operations_desc: "Fournitures pour l'école, papier et livres pour l'enseignement, bougies en cire d'abeille pour l'étude du soir et tissu pour les bureaux et le mobilier de la salle de classe."
 nd_rmn_pastoral_operations: "Opérations pastorales"
 nd_rmn_pastoral_operations_desc: "Berger des Highlands et transformation de la laine."
 nd_rmn_camp_maintenance: "Entretien du camp"
 nd_rmn_camp_maintenance_desc: "Approvisionnement du camp militaire, armes et cuir pour les armes et équipements des soldats, blé pour les rations et tissu pour les uniformes et les tentes."
 nd_rmn_oil_refining: "Raffinage du pétrole"
 nd_rmn_oil_refining_desc: "Transformation du pétrole brut en produits raffinés."
 nd_rmn_tanning: "Tannage du cuir"
 nd_rmn_tanning_desc: "Transformation des peaux en articles en cuir destinés au commerce."
 levy_nd_rmn_viteji: "Cavalerie Viteji"
 levy_nd_rmn_viteji_desc: "Cavalerie noble levée dans les domaines des boyards."
 levy_nd_rmn_panduri: "Irréguliers Panduri"
 levy_nd_rmn_panduri_desc: "Guerillas de montagne recrutées parmi les paysans olténiens."
 levy_nd_rmn_dorobanti: "Infanterie Dorobanti"
 levy_nd_rmn_dorobanti_desc: "Infanterie territoriale levée auprès des communautés paysannes."
 nd_rmn_formed_tt: "La Roumanie est formée"
 nd_rmn_path_a_tt: "Choisissez Antemurale Christianitatis"
 nd_rmn_path_b_tt: "Choisissez la prospérité danubienne"
 nd_rmn_destiny: "Destin de la Roumanie"
 nd_rmn_destiny_desc: "Enfin uni, le royaume roumain doit désormais choisir sa voie. Sera-ce le bouclier qui garde la chrétienté ou le carrefour qui s’enrichit grâce à tous ceux qui passent ?"
 nd_rmn_dest_fortress: "Forteresse du Danube"
 nd_rmn_dest_fortress_desc: "Les forteresses danubiennes de Vidin et Nikopol doivent être arrachées aux mains ottomanes pour sécuriser la frontière sud de la Roumanie et affirmer sa prétention en tant que défenseur du monde chrétien."
 nd_rmn_dest_crescent: "Écraser le croissant"
 nd_rmn_dest_crescent_desc: "Une fois la ligne danubienne sécurisée, la campagne doit s’enfoncer plus profondément dans le territoire ottoman. Prenez Edirne, l’ancienne capitale ottomane d’Europe, et prouvez que le vent a tourné."
 nd_rmn_dest_restorer: "Restaurateur de la chrétienté"
 nd_rmn_dest_restorer_desc: "Le prix ultime : Constantinople elle-même. Prenez la ville tombée en 1453 et remettez-la aux mains des chrétiens. Le destin de la Roumanie en tant qu'Antemurale Christianitatis s'accomplira."
 nd_rmn_dest_gateway: "Porte de la mer Noire"
 nd_rmn_dest_gateway_desc: "Le port de Constanta et la côte de Dobroudja sont la clé de l'avenir commercial de la Roumanie. Contrôlez la porte de la mer Noire et les richesses céréalières de la plaine danubienne afflueront vers tous les marchés de la Méditerranée."
 nd_rmn_dest_breadbasket: "Grenier à pain des Trois Empires"
 nd_rmn_dest_breadbasket_desc: "Romania must expand its Danubian trade network by securing Ruse, the great crossing-point on the lower Danube, and by building up Braila, the port where the grain of the Wallachian plain is loaded for the sea."
 nd_rmn_dest_braila_developed_tt: "We own #bold Braila#! and its development is at least #bold 11#!"
 nd_rmn_dest_bucharest_developed_tt: "We own #bold Bucharest#! and its development is at least #bold 40#!"
 nd_rmn_dest_paris: "Le Paris des Balkans"
 nd_rmn_dest_paris_desc: "With Varna and the Black Sea coast under Romanian control, Bucharest can be built up into a cosmopolitan capital to rival any in Europe, the Micul Paris of the East."
 nd_rmn.5.t: "Le destin de la Roumanie"
 nd_rmn.5.d: "Les trois terres sont unies, la couronne assurée et le royaume en paix pour le moment. Mais la Roumanie se trouve au carrefour des empires, et la paix n’est jamais à plus d’une génération de la prochaine tempête. Les Carpates nous abritent, le Danube nous nourrit et la foi orthodoxe nous soutient. La question n’est plus de savoir si la Roumanie va perdurer, mais ce qu’elle va devenir. Il nous appartient de forger le destin du peuple roumain."
 nd_rmn.5.a: "La Roumanie perdure."
 nd_rmn.6.t: "Forteresse du Danube"
 nd_rmn.6.d: "Les forteresses de Vidin et Nikopol, autrefois lieux de rassemblement des campagnes ottomanes au cœur de l'Europe, arborent désormais l'étendard roumain. Ces anciennes forteresses situées sur la rive sud du Danube ont été la porte d'entrée par laquelle les invasions se sont succédées dans les Balkans. Plus maintenant. Les garnisons roumaines occupent désormais les murs que des générations de royaumes chrétiens n’ont pas réussi à tenir. La ligne danubienne est la nôtre et, avec elle, la première preuve que la Roumanie peut être plus qu'un État tampon. Cela peut être un rempart."
 nd_rmn.6.a: "Le Danube est notre bouclier."
 nd_rmn.7.t: "Écraser le croissant"
 nd_rmn.7.d: "Edirne est tombée. La ville qui servait de capitale ottomane avant Constantinople, où Murad Ier construisit son premier palais européen et à partir de laquelle les sultans lancèrent leurs conquêtes des Balkans, est désormais aux mains des Roumains. Le symbolisme est sans équivoque : la puissance ottomane en Europe a été brisée non pas par une coalition de grandes puissances mais par la nation qui en a le plus souffert. Nos armées se trouvent au cœur de la Thrace, et la question qui se pose à nous est de savoir comment exploiter cet avantage."
 nd_rmn.7.a: "Prenez d’assaut tous les murs : ne leur laissez pas de repos."
 nd_rmn.7.b: "Tenir bon : laisser le temps faire son œuvre."
 nd_rmn.8.t: "Restaurateur de la chrétienté"
 nd_rmn.8.d: "La croix survole Sainte-Sophie. Constantinople (la ville de Constantin, la Seconde Rome, le prix qui a échappé à toute croisade) a été restituée aux mains des chrétiens par les armes roumaines. Ce que la Quatrième Croisade a détruit et ce que les Ottomans ont revendiqué, la Roumanie l'a récupéré. Cette signification se répercute aussi bien dans la chrétienté que dans le monde islamique. Une garnison roumaine tient les murs théodosiens. Les navires roumains contrôlent le Bosphore. La question est maintenant de savoir ce que la Roumanie fera de ce formidable héritage."
 nd_rmn.8.a: "Proclamer une nouvelle Rome sous protection roumaine."
 nd_rmn.8.b: "La croisade ne prend pas fin : elle ne finira jamais."
 nd_rmn.9.t: "Porte de la mer Noire"
 nd_rmn.9.d: "Le port de Constanta et la côte balayée par les vents de Dobroudja sont désormais roumains. Là où autrefois les Génois et les Vénitiens se disputaient les privilèges commerciaux de la mer Noire et où les Ottomans contrôlaient tous les accès maritimes, les marchands roumains chargent désormais des céréales, du sel et de la laine sur des navires à destination de tous les coins de la Méditerranée. L'ancienne colonie grecque de Tomis, où Ovide a passé son exil, renaît comme la fenêtre de la Roumanie sur la mer. Les richesses de la plaine danubienne ne se dirigent plus uniquement vers les marchés ottomans ou habsbourgeois. Il coule là où la Roumanie le dirige."
 nd_rmn.9.a: "La mer est notre marché."
 nd_rmn.10.t: "Grenier à pain des Trois Empires"
 nd_rmn.10.d: "With Ruse secured and the lower Danube firmly under Romanian control, the agricultural heartland of the principalities has become the granary that feeds three empires. Romanian wheat flows downriver to the Black Sea and across the Mediterranean. Salt from the Carpathian mines travels to markets that once relied on distant suppliers. The boyar estates and peasant farms of Wallachia produce surpluses that fuel a growing commercial class in Bucharest and the Danubian river towns, and the quays of Braila are lined with grain ships. Romania is prosperous, but prosperity attracts attention."
 nd_rmn.10.a: "Vendre à tout le monde : que le surplus soit notre arme."
 nd_rmn.10.b: "Construisez d’abord des routes, des ponts et des entrepôts."
 nd_rmn.11.t: "Le Paris des Balkans"
 nd_rmn.11.d: "Varna a rejoint le littoral roumain de la mer Noire et Bucarest a été transformée. La ville qui était autrefois un bourg boueux de Valachie est aujourd'hui une capitale de boulevards, d'académies et de salons diplomatiques. Les architectes français ont conçu ses bâtiments publics. Les intellectuels roumains débattent dans des cafés qui ne seraient pas déplacés sur la rive gauche. Les ambassadeurs étrangers se battent pour avoir de l'influence à la cour royale. « Micul Paris », Petit Paris, comme l'appellent les Européens, et pour une fois la flatterie n'est pas tout à fait vide. La question est de savoir comment utiliser cette nouvelle stature."
 nd_rmn.11.a: "Ouvrez nos portes au monde."
 nd_rmn.11.b: "Commandez les routes commerciales de la mer Noire."
 STATIC_MODIFIER_NAME_nd_rmn_dest_storm_walls: "Prendre d'assaut les murs"
 STATIC_MODIFIER_DESC_nd_rmn_dest_storm_walls: "Les armées roumaines poursuivent chaque siège avec une agression furieuse, prenant d'assaut les fortifications plutôt que d'attendre que la famine fasse son œuvre."
 STATIC_MODIFIER_NAME_nd_rmn_dest_hold_line: "Tenez la ligne"
 STATIC_MODIFIER_DESC_nd_rmn_dest_hold_line: "La Roumanie mène une longue guerre, entretient ses armées à moindre coût, remplace régulièrement ses pertes et épuise l'ennemi par sa patience et son endurance."
 STATIC_MODIFIER_NAME_nd_rmn_dest_new_rome: "Une nouvelle Rome"
 STATIC_MODIFIER_DESC_nd_rmn_dest_new_rome: "La Roumanie se proclame protectrice de l’Orient chrétien, construisant un nouvel ordre impérial avec Constantinople comme centre spirituel et Bucarest comme cœur politique."
 STATIC_MODIFIER_NAME_nd_rmn_dest_eternal_crusade: "Croisade éternelle"
 STATIC_MODIFIER_DESC_nd_rmn_dest_eternal_crusade: "La Roumanie s’engage dans une guerre sainte perpétuelle, entretenant des réseaux d’espions et de mercenaires pour mener une campagne sans fin contre les ennemis de la chrétienté."
 STATIC_MODIFIER_NAME_nd_rmn_dest_export_surplus: "Excédent d'exportation"
 STATIC_MODIFIER_DESC_nd_rmn_dest_export_surplus: "Les céréales, le sel et le bétail roumains inondent les marchés du sud-est de l'Europe, enrichissant les marchands du royaume alors même que la prospérité engendre une certaine complaisance."
 STATIC_MODIFIER_NAME_nd_rmn_dest_invest_infra: "Investir dans les infrastructures"
 STATIC_MODIFIER_DESC_nd_rmn_dest_invest_infra: "Plutôt que d’exporter des matières premières, la Roumanie investit dans des routes, des ponts et des réformes administratives pour intégrer ses divers territoires dans un ensemble économique cohérent."
 STATIC_MODIFIER_NAME_nd_rmn_dest_cosmopolitan: "Capitale cosmopolite"
 STATIC_MODIFIER_DESC_nd_rmn_dest_cosmopolitan: "Bucarest devient un centre diplomatique et culturel, attirant des envoyés étrangers, des marchands et des intellectuels à la cour du royaume roumain."
 STATIC_MODIFIER_NAME_nd_rmn_dest_black_sea_trade: "Maître de la mer Noire"
 STATIC_MODIFIER_DESC_nd_rmn_dest_black_sea_trade: "La Roumanie construit une flotte commerciale pour dominer les voies commerciales de la mer Noire, protégeant ses convois céréaliers et s'établissant comme la puissance maritime de l'ouest de la mer Noire."
 nd_rmn_citadela_crestina: "Citadelle de Crestina"
 nd_rmn_citadela_crestina_desc: "Grande citadelle chrétienne, forteresse-cathédrale qui incarne le rôle de la Roumanie en tant que bouclier de la chrétienté, avec en garnison les meilleurs soldats du royaume et bénie par le patriarche orthodoxe."
 nd_rmn_bursa_comerciala: "Bourse commerciale"
 nd_rmn_bursa_comerciala_desc: "Un grand échange commercial où les marchands de céréales danubiens, les commerçants de la mer Noire et les agents miniers de Transylvanie convergent pour acheter, vendre et financer le commerce du sud-est de l'Europe."
 nd_rmn_citadel_upkeep: "Garnison de la Citadelle"
 nd_rmn_citadel_upkeep_desc: "Entretenir la citadelle chrétienne, pierre pour les murs et les tours, armes pour la garnison, outils pour les réparations et bois pour les structures et palissades."
 nd_rmn_exchange_operations: "Opérations d'échange"
 nd_rmn_exchange_operations_desc: "Exploitation de la bourse commerciale, papier pour les contrats et les grands livres, tissus pour les stands et les meubles des marchands, sel pour le commerce des matières premières et outils pour l'entretien des entrepôts."

 # ===== BUREAUCRACIES =====
 rmn_sfatul_domnesc_bureaucracy: "Sfatul Domnesc"
 rmn_sfatul_domnesc_bureaucracy_desc: "Le Conseil princier des grands boyards, attesté en Valachie depuis Basarab I et en Moldavie depuis Bogdan I. Les marele logofat, vornic, vistier, spatar et postelnic enregistrent chaque charte signée par le voïvode ; la dynastie ne règne qu'avec leur consentement. Au plein investissement, le conseil lie les grandes familles au trône ; négligé, il se divise en partis boyards rivaux (Craiovesti, Movilesti) qui déposent les princes par le bas."
 rmn_mitropolia_bureaucracy: "Mitropolie"
 rmn_mitropolia_bureaucracy_desc: "Les deux sièges métropolitains roumains : l'Ungro-Valachie confirmée par Constantinople en 1359 sous Iachint de Vicina, la Moldavie élevée au statut métropolitain en 1401 sous Iosif. Les métropolitains couronnent chaque prince, enregistrent les saints du royaume et relient les principautés au monde athonite-grec par le biais de monastères stavropégiaux (Tismana, Putna, Curtea de Arges, Neamt). Lorsque leurs monastères dédiés disparaissent, les revenus sont siphonnés vers Athos, le Sinaï et Jérusalem."
 rmn_pravila_mare_bureaucracy: "Pravila Jument"
 rmn_pravila_mare_bureaucracy_desc: "L'Indreptarea legii imprimée à Targoviste en 1652 sous Matei Basarab, s'inspirant de la basilique byzantine et des canons patriarcaux ; en Moldavie, la Carte romaneasca de invatatura (Iasi, 1646) de Vasile Lupu avait déjà fait le même travail. Pour la première fois, le droit des successions, de la dot, de la procédure pénale et de la juridiction ecclésiastique fut mis en roumain et imprimé en cyrillique sur les presses princières, enseigné dans les écoles monastiques et lu sur les bancs des tribunaux bourgeois."
 rmn_phanariot_administration_bureaucracy: "Administration des Phanariotes"
 rmn_phanariot_administration_bureaucracy_desc: "Entre 1711 (Moldavie) et 1716 (Valachie) et la Révolution grecque de 1821, la Porte a loué les deux trônes aux familles phanariotes constantinopolitaines : les Mavrocordat, Ghica, Ypsilanti, Sutu, Caradja et Callimachi. Des contrats de deux ans payés par les redevances mucarrer obligeaient les princes à récupérer leurs coûts grâce à l'agriculture fiscale. Ils ont grecisé la chancellerie, professionnalisé le divan en despartiri ministériel, aboli le servage (1746/1749) et implanté des écoles grecques à Bucarest et Iasi - mais les hauts boyards les détestaient en tant qu'étrangers et la paysannerie était pressée d'obtenir le contrat."
 rmn_asezamint_mavrocordat_bureaucracy: "Asezamintul lui Mavrocordat"
 rmn_asezamint_mavrocordat_bureaucracy_desc: "Constantin Mavrocordat a occupé chaque trône six fois entre 1730 et 1769 et a utilisé ces mandats pour faire adopter la réforme fiscale roumaine des Lumières : le rusumat (une taxe d'entrée trimestrielle fixe remplaçant les répartitions arbitraires de cisla), un catastif cadastral reconstruit, l'abolition de la servitude personnelle (la Roumanie abolie en Valachie le 5 août 1746 ; la vecinia en Moldavie le 6 avril 1749) et la conversion du boyard de seigneur domanial à fonctionnaire d'État salarié."
 rmn_regulamentul_organic_bureaucracy: "Réglementaire Bio"
 rmn_regulamentul_organic_bureaucracy_desc: "Rédigé par des commissions mixtes de boyards à Bucarest et Iasi sous la direction du gouverneur général russe Pavel Kisselyov, promulgué en Valachie le 1er juillet 1831 et en Moldavie le 1er janvier 1832. Les deux quasi-constitutions quasi identiques établissaient une seule Assemblée générale élue par principauté, un budget de l'État, une séparation des fonctions judiciaires et exécutives, des ministères (intérieur, finances, justice, affaires étrangères, guerre), un calendrier de corvée uniforme de 12 jours et l'abolition des barrières douanières entre la Valachie et la Moldavie : le cadre institutionnel qui a permis l'union de 1859."

 # ===== BUREAUCRACY AUTHORITY (auto-modifier on formation) =====
 AUTO_MODIFIER_NAME_nd_rmn_bureaucracy_authority: "Offices of the United Principalities"
 AUTO_MODIFIER_DESC_nd_rmn_bureaucracy_authority: "The offices of Wallachia and Moldavia are kept under one crown: the princely council, the metropolitan sees, the printed law and the reforms of the Phanariot century. Romania can sustain three more standing institutions."
