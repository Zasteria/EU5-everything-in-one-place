l_french:
 STATIC_MODIFIER_NAME_nd_sword_and_cross: "Épée et croix"
 STATIC_MODIFIER_DESC_nd_sword_and_cross: "L’État livonien est né du choc de l’acier et de la ferveur de la foi. Les croisés allemands ont sculpté un royaume chrétien dans la nature païenne, élevant la croix au-dessus de chaque château et cathédrale, de Riga à Reval. Les chevaliers à cheval de l'Ordre et leur dévouement fanatique à la conversion des peuples baltes définissent notre objectif national."
 STATIC_MODIFIER_NAME_nd_baltic_emporium: "Magasin Baltique"
 STATIC_MODIFIER_DESC_nd_baltic_emporium: "Riga, Dorpat et Reval ne sont pas de simples forteresses : ce sont les grands entrepôts du monde nordique. L'ambre, le bois, les fourrures et les céréales descendent la Daugava et la Dvina jusqu'à nos ports, où les marchands hanséatiques les pèsent contre les tissus, le sel et l'argent venus de l'ouest. Les richesses de la Baltique passent par les mains des Livoniens."
 STATIC_MODIFIER_NAME_nd_livonian_reformation: "Réforme de Livonie"
 STATIC_MODIFIER_DESC_nd_livonian_reformation: "La Livonie fut parmi les premiers pays hors de l’Empire à adopter les enseignements de Luther. L'ancien ordre religieux se dissout à mesure que de nouvelles idées prennent racine dans les imprimeries et les amphithéâtres de Riga."
 STATIC_MODIFIER_NAME_nd_riga_iconoclasm: "Iconoclasme de Riga"
 STATIC_MODIFIER_DESC_nd_riga_iconoclasm: "Les réformateurs ont balayé les églises de Riga à coups de marteau et de torche, brisant des icônes, fermant des monastères et confisquant des biens ecclésiastiques. L’ordre ancien est détruit racine et branche : une purification violente qui ne laisse aucune place au passé."
 STATIC_MODIFIER_NAME_nd_courland_ambition: "L'ambition de la Courlande"
 STATIC_MODIFIER_DESC_nd_courland_ambition: "Des chantiers navals de Windau et Libau surgit une flotte qui portera le drapeau courlandais jusqu'aux rivages lointains. Fort Jacob en Gambie et Nouvelle Courlande à Tobago vous attendent : le plus petit État d'Europe ose construire un empire colonial."
 STATIC_MODIFIER_NAME_nd_courland_caution: "La prudence de Courlande"
 STATIC_MODIFIER_DESC_nd_courland_caution: "La flotte du duché est mieux employée à protéger nos routes commerciales baltes et à enrichir nos ports qu'à poursuivre de lointains rêves coloniaux. Laissez les autres gaspiller leur trésor dans la fièvre tropicale. Nous deviendrons riches chez nous."
 nd_liv.1.t: "La naissance de la Livonie"
 nd_liv.1.d: "The crusaders have raised their banner over the Baltic. From the stone walls of Riga to the forest castles of Dorpat, a new Christian realm takes shape on the eastern shore of the Mare Balticum. But two visions compete for the soul of this young nation. The knights of the Order see Livonia as a bastion of militant Christianity: a frontier where the sword serves the cross, where every conquered acre brings another pagan soul to Christ. The merchants of Riga and the Hanseatic cities see something different: a gateway to the riches of the East, where amber, timber, and furs flow westward and silver flows back. Which vision shall prevail?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_liv.1.a: "Par l'épée et la croix, nous détiendrons cette terre."
 nd_liv.1.b: "Le comptoir sert à Dieu ainsi que la chapelle."
 nd_liv.2.t: "La Réforme atteint la Livonie"
 nd_liv.2.d: "En 1521, Andreas Knopken revint d'Allemagne apportant les enseignements de Luther aux églises de Riga. En trois ans, la Réforme a balayé toutes les grandes villes de Livonie : Riga, Reval, Dorpat. Melchior Hoffmann prêche des sermons enflammés à Wolmar et les foules se rassemblent pour entendre le nouvel évangile. Le conseil municipal de Riga a interdit les offices dans la cathédrale, confisqué les biens de l'église et fermé les monastères. Certains réformateurs appellent à une adoption mesurée de la nouvelle foi ; d'autres exigent la destruction de toute icône et de tout autel rappelant l'ordre ancien. En novembre 1524, des foules iconoclastes prirent d'assaut les églises. Devons-nous canaliser cette fureur ou la contenir ?"
 nd_liv.2.a: "Que la réforme se fasse par la raison et par le droit."
 nd_liv.2.b: "Démolissez les idoles ; purifiez la foi par le feu."
 nd_liv.3.t: "Le Landtag de la Marche"
 nd_liv.3.d: "Le 4 décembre 1435, les domaines rassemblés de Livonie se réunirent dans la ville de Walk pour signer l'accord de la Confédération de Livonie. L'archevêque de Riga, les évêques de Courlande, de Dorpat et de Sel-Wiek, les représentants de l'ordre de Livonie et les vassaux du pays ont tous apposé leur sceau sur ce document. La Diète de Livonie, le Landtag, constitue un forum où les intérêts concurrents de l'Ordre, de l'Église et des villes peuvent être conciliés sans effusion de sang. Il s’agit d’un compromis imparfait, mais il lie cette confédération agitée en quelque chose qui ressemble à un État."
 nd_liv.3.a: "Puisse le Landtag préserver notre unité."
 nd_liv.4.t: "L'ambition coloniale de la Courlande"
 nd_liv.4.d: "Le duc Jacob Kettler a transformé le duché endormi de Courlande en une puissance maritime. Depuis les chantiers navals de Windau, une flotte de plus de quarante navires de guerre a été lancée, équipés de plus de quatorze cents canons. En 1651, les forces courlandaises construisirent Fort Jacob sur le fleuve Gambie. En 1654, le navire de guerre à deux étages Wappen der Herzogin a navigué vers Tobago avec 124 soldats et quatre-vingts familles de colons, établissant ainsi la Nouvelle Courlande. Ce minuscule duché, d'à peine cinquante mille âmes, arbore désormais son drapeau sur deux continents. Mais le rêve est fragile. La Suède menace de guerre et les entreprises coloniales drainent le trésor. Devons-nous aller de l’avant ou consolider ce que nous avons ?"
 nd_liv.4.a: "Les mers porteront le drapeau courlandais sur tous les rivages."
 nd_liv.4.b: "Notre richesse réside dans la Baltique, pas dans les fièvres tropicales."
 nd_liv.5.t: "La bataille de Saule"
 nd_liv.5.d: "En 1236, les Frères de l'Épée de Livonie marchèrent vers le sud contre les Samogitiens et les Semigalliens. À Saule, les guerriers païens tendirent une embuscade à la colonne des croisés sur un terrain difficile. La défaite fut catastrophique : le Maître de l'Ordre et une cinquantaine de chevaliers tombèrent. Le Pape dissout les Frères de l'Épée et les survivants fusionnèrent avec l'Ordre Teutonique pour former la branche livonienne. De ce désastre est né un ordre militaire plus dur et plus discipliné, qui maintiendra la frontière balte pendant encore trois siècles."
 nd_liv.5.a: "De la défaite, nous forgeons une lame plus solide."
 nd_liv_battle_of_saule: "Schwertbrder"
 nd_liv_battle_of_saule_desc: "Les Frères de l'Épée de Livonie, les Schwertbrder, étaient l'ordre de croisade original de la Baltique, fondé en 1202. Leur défaite à Saule en 1236 a conduit à leur absorption dans l'Ordre Teutonique, mais leur esprit fanatique perdure dans la tradition militaire de Livonie."
 nd_liv_ordensburg_tradition: "Tradition d'Ordensbourg"
 nd_liv_ordensburg_tradition_desc: "L'Ordre de Livonie a construit plus de 150 châteaux en pierre à travers la Baltique : des Ordensburgen massifs qui servaient de bases militaires, de centres administratifs et de symboles de la domination allemande sur les terres conquises."
 nd_liv_amber_trade: "Ambre Baltique"
 nd_liv_amber_trade_desc: "Les rives de la Baltique orientale produisent le meilleur ambre d'Europe : une résine d'arbre fossilisée prisée depuis l'Antiquité pour les bijoux, la médecine et le commerce. Les marchands livoniens contrôlent la transformation et l'exportation de ce trésor doré."
 nd_liv_terra_mariana: "Terre Marianne"
 nd_liv_terra_mariana_desc: "La Terre de la Vierge Marie : nom donné par le pape Innocent III aux territoires croisés de Livonie. La mission religieuse visant à convertir les païens baltes constitue le fondement moral de l’État livonien."
 nd_liv_wax_trade: "Commerce de cire de Livonie"
 nd_liv_wax_trade_desc: "Beeswax from the vast forests of Livonia is indispensable for the churches and courts of western Europe. Livonian merchants ship thousands of tons annually: the candles of Christendom burn with Baltic fire. The wax is cut from hives hollowed in the living trees of the forest."
 nd_liv_hanseatic_kontor: "Kontoré hanséatique"
 nd_liv_hanseatic_kontor_desc: "Riga rejoignit la Ligue hanséatique en 1282, établissant des comptoirs commerciaux, Kontore, qui reliaient la Baltique aux grands réseaux commerciaux de l'Europe du Nord. Ces entrepôts et maisons de marchands sont les moteurs de la prospérité livonienne."
 nd_liv_domschule_tradition: "Écoles cathédrales"
 nd_liv_domschule_tradition_desc: "Les évêques de Livonie fondèrent des écoles cathédrales à Riga, Dorpat et Reval : les premières institutions d'enseignement supérieur de la Baltique. L'érudition allemande, les lettres latines et la formation théologique découlent de ces écoles dans la société au sens large."
 nd_liv_landtag: "Landtag de Marche"
 nd_liv_landtag_desc: "La Diète de Livonie, créée à Walk en 1435, créa une assemblée dirigeante pour la confédération agitée. Les représentants de l'Ordre, les évêques, les villes et les vassaux se réunissent pour résoudre les différends et coordonner la défense."
 nd_liv_baltic_timber: "Commerce du bois de la Baltique"
 nd_liv_baltic_timber_desc: "The vast pine and oak forests of Livonia produce timber, tar, and pitch for the shipyards of Europe. Rafts of logs float down the Daugava to Riga, where they are processed and shipped to England, Holland, and beyond."
 nd_liv_flax_industry: "Lin de Livonie"
 nd_liv_flax_industry_desc: "Livonian flax is spun into linen of exceptional quality, exported through Riga and Reval to markets across northern Europe. The flax fields of Latvia and Estonia sustain a thriving textile industry.\n\n#italic Available in: $nd_liv_packhaus$#!"
 nd_liv_riga_stadtrecht: "Ville de Riga"
 nd_liv_riga_stadtrecht_desc: "La loi de la ville de Hambourg adoptée par Riga régit le commerce, la propriété et la vie civique. Dans ce cadre juridique, les bourgeois de Riga bénéficient de privilèges qui attirent les commerçants et artisans de tout le monde germanophone."
 nd_liv_reformation: "La Réforme de Livonie"
 nd_liv_reformation_desc: "La Livonie fut le premier territoire en dehors du Saint Empire romain germanique à adopter la Réforme. À partir de 1521, les idées de Luther se répandirent rapidement à Riga, Reval et Dorpat, transformant le paysage religieux de la Baltique."
 nd_liv_landknechte_tradition: "Landknechte de Livonie"
 nd_liv_landknechte_tradition_desc: "Infanterie allemande de pique et de tir adaptée à la guerre baltique : entraînée pour combattre dans les forêts et les marais de la frontière orientale, où la cavalerie lourde ne peut pas opérer."
 nd_liv_grain_exports: "Commerce des céréales baltes"
 nd_liv_grain_exports_desc: "Les céréales de Livonie (seigle, blé et orge) nourrissent les villes en pleine croissance d’Europe occidentale. Les greniers de Riga sont le grenier de la Baltique, acheminant les récoltes de l'arrière-pays vers les marchés affamés de l'étranger."
 nd_liv_buffer_state: "Entre trois couronnes"
 nd_liv_buffer_state_desc: "La Livonie se situe au carrefour des ambitions russes, polono-lituaniennes et suédoises. La survie exige de l’agilité diplomatique, en jouant chaque puissance contre les autres, en gagnant du temps grâce aux traités et en maintenant une indépendance précaire."
 nd_liv_castle_network: "Réseau de châteaux de pierre"
 nd_liv_castle_network_desc: "Plus de 150 châteaux en pierre et manoirs fortifiés parsèment le paysage livonien : des massifs Ordensburgen des chevaliers aux palais épiscopaux des évêques. Ce réseau de forteresses constitue l’épine dorsale de la défense baltique."
 nd_liv_fur_trade: "Commerce des fourrures de Livonie"
 nd_liv_fur_trade_desc: "The forests of Livonia yield beaver, marten, fox, and squirrel pelts prized in the courts and markets of Europe. Livonian merchants dominate the fur trade from the interior to the harbors of Riga and Reval.\n\n#italic Available in: $nd_liv_packhaus$#!"
 nd_liv_hakenschutzen_tradition: "Hakenschtzen"
 nd_liv_hakenschutzen_tradition_desc: "Le canon à crochet, le Hakenbchse, est un élément essentiel de la défense des forteresses livoniennes. Posant leur lourd canon sur un crochet mural, ces artilleurs délivrent des tirs précis depuis les remparts du château et les fortifications de campagne."
 nd_liv_reiter_tradition: "Reiters livoniens"
 nd_liv_reiter_tradition_desc: "La tradition des pistolets à cheval descend de la cavalerie lourde de l'Ordre. Armés de pistolets à roue libre et entraînés au caracole, ces Reiters combinent l'équitation livonienne avec la puissance de feu moderne."
 nd_liv_secularization: "Sécularisation"
 nd_liv_secularization_desc: "La transformation de l'ordre militaire croisé en duché laïc : la fin du régime monastique et le début du gouvernement princier. Sous Gotthard Kettler, le dernier maître devint le premier duc."
 nd_liv_grain_staple: "Grains de base de Riga"
 nd_liv_grain_staple_desc: "Le droit de base de Riga exige que toutes les céréales transitant par la ville soient proposées à la vente sur son marché avant l'exportation. Ce monopole enrichit les bourgeois de la ville et remplit les caisses ducales."
 nd_liv_privilegium: "Privilège de Livonie"
 nd_liv_privilegium_desc: "Les droits et privilèges de la noblesse allemande balte, les Ritterschaften, constituent le fondement de la gouvernance livonienne. En échange du service militaire et de la loyauté administrative, les nobles jouissent d'une large autonomie sur leurs domaines."
 nd_liv_urban_fortification: "Fortifications modernes"
 nd_liv_urban_fortification_desc: "L’arrivée de la guerre à la poudre exige une nouvelle architecture défensive. Des murs bastionnés, des ravelins inclinés et des remparts en terrassement remplacent les tours médiévales, transformant les villes livoniennes en forteresses modernes."
 nd_liv_courland_navy: "Flotte de Courlande"
 nd_liv_courland_navy_desc: "Le duc Jacob Kettler construisit une marine de plus de quarante navires de guerre dans les chantiers navals de Windau et Libau. Cette flotte remarquable (montant plus de 1 400 canons) portait le drapeau courlandais vers les colonies du fleuve Gambie et de Tobago."
 nd_liv_kettler_manufactures: "Fabrication de Kettler"
 nd_liv_kettler_manufactures_desc: "Sous le duc Jacob Kettler, la Courlande devint un centre industriel. Des usines sidérurgiques, des scieries, des distilleries de goudron et des chemins de corde surgirent à travers le duché : une révolution proto-industrielle sur la côte baltique."
 nd_liv_colonial_ventures: "Entreprises coloniales"
 nd_liv_colonial_ventures_desc: "The tiny Duchy of Courland, barely fifty thousand souls, dared to build a colonial empire. Fort Jacob on the Gambia and New Courland on Tobago were improbable outposts of Baltic ambition in the tropics."
 nd_liv_amber_route: "Route de l'Ambre"
 nd_liv_amber_route_desc: "The ancient amber trade route, stretching from the Baltic coast to the Mediterranean, has been a source of wealth for millennia. Under Courland's stewardship, the processing and export of Baltic amber reaches its zenith. Amber is turned on the lathe and set in silver for the courts of Europe.\n\n#italic Available in: $nd_liv_bernsteinkammer$#!"
 nd_liv_ritterschaften: "Ritterschaften"
 nd_liv_ritterschaften_desc: "Les corporations nobles allemandes baltes (les Ritterschaften de Livonie, d'Estonie, de Courlande et sel) gouvernent les provinces par l'intermédiaire de leur Landtage. Cette noblesse d’entreprise façonne le droit, la fiscalité et l’administration dans toute la Baltique."
 nd_liv_courland_gunnery: "Artillerie navale de Courlande"
 nd_liv_courland_gunnery_desc: "Courland's fleet punched far above its weight thanks to the quality of its naval gunnery. Duke Jacob personally oversaw cannon founding at Courland's ironworks, producing some of the finest naval guns in the Baltic.\n\n#italic Available in: $nd_liv_eisenhammer$#!"
 nd_liv_baltic_enlightenment: "Lumières baltes"
 nd_liv_baltic_enlightenment_desc: "Johann Gottfried Herder (philosophe, théologien et pionnier du nationalisme romantique) a passé cinq années formatrices à enseigner à l'école cathédrale de Riga. Ses idées sur la culture populaire et l’identité nationale transformeraient la pensée européenne."
 nd_liv_agrarian_reform: "Réforme agraire"
 nd_liv_agrarian_reform_desc: "L'émancipation progressive de la paysannerie balte et la modernisation de l'agriculture : du travail de corve féodal au fermage libre. Les nouvelles rotations de cultures, les projets de drainage et l’agriculture scientifique augmentent les rendements et la population."
 nd_liv_port_expansion: "Port de Riga"
 nd_liv_port_expansion_desc: "Le port de Riga, dominant l'embouchure de la Daugava, s'agrandit pour accueillir le volume croissant du commerce balte. De nouveaux quais, entrepôts et bureaux de douane transforment le port médiéval en un centre commercial moderne."
 nd_liv_national_awakening: "Identité allemande balte"
 nd_liv_national_awakening_desc: "Les Allemands baltes (descendants des croisés, des marchands et des religieux qui ont construit la Livonie) développent une identité culturelle distincte. Ni purement allemandes, ni purement baltes, elles constituent une civilisation unique, forgée par sept siècles à la frontière."
 nd_liv_modern_military: "Jger de Livonie"
 nd_liv_modern_military_desc: "Infanterie légère professionnelle pour l'ère moderne : des fusiliers rapides qui combinent les traditions frontalières de la Baltique avec la discipline des tactiques de ligne européennes."
 nd_liv_industrial_timber: "Bois Industriel"
 nd_liv_industrial_timber_desc: "Les scieries à vapeur transforment l’industrie du bois dans la Baltique. Là où autrefois les grumes étaient laborieusement façonnées à la main, les scies mécaniques produisent désormais du bois standardisé destiné à l'exportation, alimentant ainsi le boom de la construction dans l'Europe industrielle."
 a_nd_liv_schwertbruder: "Schwertbrder"
 a_nd_liv_schwertbruder_desc: "The Sword Brothers : infanterie de croisade fanatique de l'Ordre de Livonie. Ces guerriers allemands combattent avec la fureur zélée des hommes qui croient que chaque bataille est menée pour le salut de leur âme."
 a_nd_liv_hakenschutzen: "Hakenschtzen"
 a_nd_liv_hakenschutzen_desc: "Artilleurs à crochet : infanterie armée d'armes lourdes de type arquebuse tirées depuis des crochets muraux ou des supports portatifs. Dévastateurs en termes de défense de siège et de positions fortifiées, ils incarnent la tradition de guerre de forteresse de la Livonie."
 n_nd_liv_courland_frigate: "Frégate de Courlande"
 n_nd_liv_courland_frigate_desc: "Un navire de guerre rapide et bien armé des chantiers navals de Windau. Construites sous la supervision personnelle du duc Jacob Kettler, ces frégates allient vitesse et puissance de feu : conçues pour les raids commerciaux et les expéditions coloniales."
 a_nd_liv_reiter: "Reiter de Livonie"
 a_nd_liv_reiter_desc: "Les pistolets à cheval descendent de la tradition de cavalerie de l'Ordre. Armés de pistolets à blocage de roue et entraînés à la tactique du caracole, ces cavaliers harcèlent les formations ennemies avant de se rapprocher pour la charge."
 a_nd_liv_jager: "Jger de Livonie"
 a_nd_liv_jager_desc: "Infanterie légère professionnelle formée dans les forêts de la Baltique : des fusiliers rapides qui utilisent le terrain, les tactiques d'embuscade et l'adresse au tir pour vaincre leurs adversaires. Le point culminant de la longue tradition militaire frontalière de la Livonie."
 nd_liv_ordensburg: "Ordensbourg"
 nd_liv_ordensburg_desc: "Un château croisé de l'ordre de Livonie : une fortification massive en pierre combinant garnison militaire, centre administratif et chapelle. Ces châteaux ont dominé le paysage baltique pendant trois siècles."
 nd_liv_kontor: "Kontor hanséatique"
 nd_liv_kontor_desc: "Un comptoir commercial de la Ligue hanséatique : entrepôt, comptoir et résidence marchande à la fois. Grâce à ces Kontore, les richesses de l’arrière-pays baltique affluent vers les marchés de l’Europe du Nord."
 nd_liv_domschule: "École secondaire"
 nd_liv_domschule_desc: "Une école cathédrale où des religieux allemands enseignent le latin, la théologie et les arts libéraux. Ces écoles constituent les fondements intellectuels de la civilisation livonienne, produisant les administrateurs et le clergé qui gouvernent la Baltique."
 nd_liv_windau_werft: "Chantier naval de Windau"
 nd_liv_windau_werft_desc: "Le chantier naval ducal de Windau (Ventspils), où fut construite la flotte du duc Jacob Kettler. À son apogée, ce chantier lançait des navires de guerre qui portaient le pavillon courlandais vers l'Afrique et les Caraïbes."
 nd_liv_bernsteinkammer: "Chambre de Bernstein"
 nd_liv_bernsteinkammer_desc: "Un atelier de transformation de l'ambre où l'ambre brut de la Baltique est trié, poli et sculpté en bijoux, objets de dévotion et produits de luxe destinés à l'exportation vers les cours et les marchés d'Europe."
 nd_liv_vasallenburg: "Vasallenbourg"
 nd_liv_vasallenburg_desc: "Manoir fortifié des vassaux allemands baltes : en partie résidence, en partie garnison, en partie centre administratif de la campagne environnante. L'épine dorsale de la défense rurale et de l'autorité noble dans toute la Livonie."
 nd_liv_getreidelager: "Getreidelager"
 nd_liv_getreidelager_desc: "Un entrepôt de céréales sur le front de mer de Riga : stockant, pesant et classant les grandes quantités de seigle, de blé et d'orge qui coulent de l'arrière-pays livonien pour alimenter les villes d'Europe occidentale."
 nd_liv_dampfsagewerk: "Usine d'amortissement"
 nd_liv_dampfsagewerk_desc: "Une scierie à vapeur qui mécanise l'industrie du bois de la Baltique. Des lames de fer entraînées par des machines à vapeur coupaient des grumes de pin et de chêne à une vitesse sans précédent, produisant ainsi du bois standardisé destiné à l'exportation."
 nd_liv_eisenhammer: "Eisenhammer"
 nd_liv_eisenhammer_desc: "A ducal hammer mill on a Courland stream. A water wheel drives the trip hammer and the bellows, bog iron and bar iron shipped from Sweden go into the forge, and muskets, anchors, nails and ship guns come out for the duke's fleet and for sale abroad."
 nd_liv_ordensburg_upkeep: "Entretien du château"
 nd_liv_ordensburg_upkeep_desc: "Les murs de pierre et les portes en fer de l'Ordensburg nécessitent un entretien constant : du mortier, du bois et des armes pour maintenir la forteresse en état de combat."
 nd_liv_kontor_maintenance: "Opérations Kontor"
 nd_liv_kontor_maintenance_desc: "Le fonctionnement quotidien d'un comptoir commercial hanséatique : tenue des registres, entreposage et flux constant de marchandises entre l'arrière-pays balte et les marchés occidentaux."
 nd_liv_domschule_upkeep: "Approvisionnement scolaire"
 nd_liv_domschule_upkeep_desc: "Papier pour les manuscrits, cire d'abeille pour les bougies et les sceaux : les modestes besoins matériels d'une école cathédrale qui dépasse largement son poids en matière de production intellectuelle."
 nd_liv_werft_maintenance: "Opérations du chantier naval"
 nd_liv_werft_maintenance_desc: "L'appétit vorace d'un chantier naval en activité : du bois séché, des cordes, du goudron et des provisions navales consommés dans le processus sans fin de construction et de réparation des navires de guerre."
 nd_liv_amber_processing: "Traitement de l'ambre"
 nd_liv_amber_processing_desc: "L'ambre brut de la Baltique est trié, coupé et poli pour en faire des bijoux et des objets de dévotion : un artisanat spécialisé transmis de génération en génération d'artisans baltes."
 nd_liv_vasallenburg_upkeep: "Entretien du manoir"
 nd_liv_vasallenburg_upkeep_desc: "La pierre et le fer étaient nécessaires pour entretenir un manoir fortifié, en gardant les murs solides, les portes fonctionnelles et la garnison locale équipée."
 nd_liv_getreidelager_upkeep: "Opérations d'entrepôt"
 nd_liv_getreidelager_upkeep_desc: "L'entretien courant et l'exploitation d'un entrepôt de céréales : balances, bacs de stockage et le travail constant de chargement et déchargement des barges sur la Daugava."
 nd_liv_dampfsagewerk_upkeep: "Opérations de scierie"
 nd_liv_dampfsagewerk_upkeep_desc: "Le charbon alimente la chaudière et les lames de scie coupent rapidement les bûches de pin et de chêne, produisant ainsi du bois standardisé pour les marchés baltes et européens."
 nd_liv_musket_forging: "Musket Forging"
 nd_liv_musket_forging_desc: "Barrels are welded and bored at the hammer mill and stocked in local birch: the muskets that Duke Jacob sold to Sweden, the Dutch and Lithuania."
 nd_liv_cannon_founding: "Cannon Founding"
 nd_liv_cannon_founding_desc: "Iron guns are cast and bored at the ducal works for the warships built at Windau and Libau. Duke Jacob is said to have watched over the founding himself."
 nd_liv_forest_apiary: "Forest Apiary"
 nd_liv_forest_apiary_desc: "Hives are hollowed in living pines and oaks, each tree under its keeper's mark. The honey is eaten at home and the wax goes to the port."
 nd_liv_wax_processing: "Tree Hive Beekeeping"
 nd_liv_wax_processing_desc: "The hives are cut, tended and robbed with rope and iron, and the wax is rendered clean for the merchants of the coast."
 nd_liv_packhaus: "Packhaus"
 nd_liv_packhaus_desc: "A merchant's packing house on the quay, where the goods of the river trade are made fit for the sea. Each lot is sorted by sworn graders before it is shipped."
 nd_liv_amber_turning: "Amber Turning"
 nd_liv_amber_turning_desc: "Amber is turned on the lathe and set in silver for caskets, cups and altar pieces."
 nd_liv_timber_trade: "Commerce du bois"
 nd_liv_timber_trade_desc: "Baltic pine and oak floated down the Daugava are dressed into masts and spars and shipped with barrels of pitch to the shipyards of western Europe."
 nd_liv_flax_processing: "Transformation du lin"
 nd_liv_flax_processing_desc: "La filature et le tissage du lin de Livonie en toile de lin fin : une exportation balte majeure appréciée pour sa qualité et sa durabilité."
 nd_liv_fur_processing: "Traitement de la fourrure"
 nd_liv_fur_processing_desc: "Beaver, marten, and fox pelts from the interior are dressed, sorted, and baled, and the best are made up into trimmings for the courts and markets of Europe."
 levy_nd_liv_schwertbruder: "Prélèvement Schwertbrder"
 levy_nd_liv_schwertbruder_desc: "Infanterie de croisade zélée issue des soldats et des paysans de Livonie, combattant dans la tradition des premiers Sword Brothers."
 levy_nd_liv_reiter: "Prélèvement Reiter"
 levy_nd_liv_reiter_desc: "Pistolets à cheval issus de la noblesse et soldats de Livonie : héritiers de la tradition de cavalerie de l'Ordre, armés d'armes à feu modernes."
 nd_liv_formed_tt: "La Livonie a été formée"
 nd_liv_path_a_tt: "Choisissez l'épée et la croix"
 nd_liv_path_b_tt: "Choisissez le Baltic Emporium"
 nd_liv_destiny: "Destin livonien"
 nd_liv_destiny_desc: "L’État de Livonie se situe au carrefour du monde balte. Que ce soit par l'épée ou par l'argent, notre destin nous attend. Mais nous devons d’abord prouver que cette jeune nation peut perdurer."
 nd_liv_dest_crusade: "La Croisade du Nord"
 nd_liv_dest_crusade_desc: "L’esprit croisé exige une expansion. Conquérez le bastion païen de Samogitie et la capitale teutonique de Königsberg pour forger un État croisé unifié à travers la Baltique orientale."
 nd_liv_dest_drang: "Drang nach Osten"
 nd_liv_dest_drang_desc: "The drive to the east continues. Pskov and Polotsk, the gateway cities to the vast Russian hinterland, are taken, and five Ordensburgen stand to hold the march."
 nd_liv_dest_dominium: "Dominium Maris Baltici"
 nd_liv_dest_dominium_desc: "Novgorod, the ancient seat of Russian trade, falls, and with it Vilnius, capital of Lithuania, and Kaunas, the castle on the Niemen. With these conquests Livonia becomes the undisputed master of the eastern Baltic: a crusader empire stretching from the Gulf of Finland to the Niemen."
 nd_liv_dest_hansa: "Porte Hanséatique"
 nd_liv_dest_hansa_desc: "Amenez Dantzig, le plus grand port du sud de la Baltique, sous contrôle livonien et rassemblez le capital pour financer un empire commercial. Riga et Dantzig contrôlent ensemble le flux de céréales, de bois et d'ambre à travers les mers du nord."
 nd_liv_dest_warehouse: "Entrepôt Baltique"
 nd_liv_dest_warehouse_desc: "Établir la Livonie comme entrepôt central de la Baltique. Adoptez le système bancaire moderne, assurez la circulation de l'ambre sur notre marché des capitaux et accumulez la richesse qui transforme un comptoir commercial en un grand magasin."
 nd_liv_dest_emporium: "Magasin suprême"
 nd_liv_dest_emporium_desc: "Conquer Lubeck itself, the queen of the Hanse, and make Livonia the supreme commercial power of northern Europe. Build Riga up into the great port of the north and fill the treasury to overflowing."
 nd_liv_dest_riga_developed_tt: "We own #bold Riga#! and its development is at least #bold 53#!"
 nd_liv_dest_five_ordensburgen_tt: "An #bold Ordensburg#! stands in at least #bold 5#! of our locations"
 nd_liv.6.t: "Le destin de la Livonie"
 nd_liv.6.d: "La Livonie s'est forgée à partir des territoires dispersés de la Baltique : un royaume où chevaliers allemands, marchands hanséatiques et peuples baltes coexistent sous une seule bannière. Mais le simple acte de formation ne suffit pas. La question qui se pose désormais à nous est fondamentale : quel type d’État la Livonie deviendra-t-elle ? La voie à suivre définira non seulement nos frontières, mais aussi notre identité même en tant que nation."
 nd_liv.6.a: "Notre destin nous attend."
 nd_liv.7.t: "La Croisade du Nord renouvelée"
 nd_liv.7.d: "Les chevaliers se sont dirigés vers le sud, en Samogitie, et vers l'est, en Prusse. Là où autrefois les païens régnaient, la croix s'élève désormais au-dessus de chaque forteresse et de chaque village. Königsberg, l'ancien siège de l'Ordre Teutonique, arbore notre bannière. L’État croisé renaît : non pas comme une confédération dispersée d’évêques et de chevaliers, mais comme un royaume unifié doté de la force de s’étendre encore davantage."
 nd_liv.7.a: "L'épée sert la croix."
 nd_liv.8.t: "La route vers l'Est"
 nd_liv.8.d: "Pskov est tombé. Polotsk est à nous. Les anciennes villes commerçantes de la frontière russe répondent désormais à l’autorité livonienne. Nos armées se trouvent au cœur d’un territoire qui était autrefois le domaine des princes orthodoxes et des boyards slaves. Mais comment gouverner ces nouvelles conquêtes ? Certains prônent le zèle de la croisade : conversion forcée, colonisation allemande, transformation complète des terres conquises. D'autres conseillent la patience : l'instauration de l'ordre par la discipline militaire et l'efficacité administrative, permettant d'absorber progressivement les nouveaux sujets."
 nd_liv.8.a: "Remplissez l’Est de colons et d’églises allemands."
 nd_liv.8.b: "Établir l'ordre militaire à la frontière."
 nd_liv.9.t: "Dominium Maris Baltici"
 nd_liv.9.d: "Novgorod, la ville légendaire aux mille églises, s'est soumise au pouvoir livonien. Vilnius, siège des grands-ducs de Lituanie, arbore notre bannière. Du golfe de Finlande aux forêts de Samogitie, des rivages de Courlande aux portes de la Moscovie, l’État croisé commande un empire. La Baltique orientale est un lac livonien. Mais avec l’empire se pose la question de son caractère. Allons-nous gouverner comme l’exigeait la croix de fer : avec l’autorité intransigeante de l’Ordre ? Ou devons-nous établir une paix livonienne, gouvernant nos divers sujets avec une force tempérée par le pragmatisme ?"
 nd_liv.9.a: "Sous la croix de fer, tous se soumettent."
 nd_liv.9.b: "Une paix livonienne gouvernera l'est."
 nd_liv.10.t: "La porte hanséatique"
 nd_liv.10.d: "Dantzig est à nous. Le plus grand port de la Baltique méridionale, où la Vistule déverse les céréales polonaises dans les cales d'un millier de navires marchands, opère désormais sous l'autorité de Livonie. Avec Riga commandant la Daugava et Dantzig commandant la Vistule, nous contrôlons les deux artères fluviales les plus puissantes du monde nordique. Les comptoirs sont pleins, les entrepôts bondés jusqu'aux poutres. Le Baltic Emporium prend forme."
 nd_liv.10.a: "La richesse de deux rivières coule entre nos mains."
 nd_liv.11.t: "L'entrepôt de Livonie"
 nd_liv.11.d: "La Livonie est devenue l'entrepôt central du monde balte. Nos banquiers étendent le crédit de Riga à Londres, notre ambre est prisé dans toutes les cours et nos marchands dominent le commerce des céréales, du bois et des fourrures. Mais deux philosophies commerciales se disputent la domination. Les marchands d'ambre prônent le monopole, contrôlant l'approvisionnement en ambre de la Baltique depuis la mine jusqu'au marché, fixant les prix que le monde doit payer. Les capitaines de port prônent l'ouverture, faisant de nos ports les plus libres d'Europe, où tout commerçant peut commercer sans restriction, convaincu que ce volume générera plus de richesse que n'importe quel monopole."
 nd_liv.11.a: "Contrôlez l’ambre, contrôlez le marché."
 nd_liv.11.b: "Ouvrez nos ports au commerce du monde."
 nd_liv.12.t: "Le magasin suprême"
 nd_liv.12.d: "Lübeck elle-même, reine de la Ligue hanséatique, la ville dont les marchands dictaient autrefois les termes de l'échange dans toute l'Europe du Nord, répond désormais à la Livonie. L'élève a dépassé le maître. Depuis nos ports, les navires transportent des marchandises baltes vers tous les coins de l’Europe et au-delà. Nos banquiers financent les guerres et les entreprises commerciales de la mer du Nord à la Méditerranée. Riga est devenue ce que Venise est au sud : le nœud indispensable du commerce, la ville sans laquelle rien ne bouge. Allons-nous diriger cet empire en tant que princes marchands, une aristocratie commerciale gouvernant par la richesse et l’influence ? Ou ferons-nous de Riga la Venise du Nord, une république de commerçants où le commerce lui-même est la loi suprême ?"
 nd_liv.12.a: "Les princes marchands régneront."
 nd_liv.12.b: "Riga sera la Venise du Nord."
 STATIC_MODIFIER_NAME_nd_liv_dest_crusader_zeal: "Zèle des croisés"
 STATIC_MODIFIER_DESC_nd_liv_dest_crusader_zeal: "La ferveur de la croisade du Nord alimente l’expansion livonienne. Les colons et les missionnaires allemands affluent dans les territoires conquis, mais les coûts d'une guerre incessante mettent à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_liv_dest_frontier_order: "Ordre des frontières"
 STATIC_MODIFIER_DESC_nd_liv_dest_frontier_order: "Les territoires conquis de l’Est sont gouvernés par un ordre militaire strict : garnisons fortifiées, patrouilles disciplinées et administration systématique. La frontière est sécurisée, même si la construction dans les nouveaux territoires coûte cher."
 STATIC_MODIFIER_NAME_nd_liv_dest_iron_cross: "Sous la Croix de Fer"
 STATIC_MODIFIER_DESC_nd_liv_dest_iron_cross: "La discipline de fer de l’ordre des croisades gouverne l’empire de Livonie. Les peuples soumis se soumettent à une autorité inflexible qui ne tolère aucune dissidence. Mais le fardeau d’une vigilance perpétuelle pèse sur une nation lasse de la guerre."
 STATIC_MODIFIER_NAME_nd_liv_dest_pax_livonica: "Pax Livonica"
 STATIC_MODIFIER_DESC_nd_liv_dest_pax_livonica: "La paix livonienne gouverne la Baltique orientale grâce à une force pragmatique. Les territoires conquis sont remis en ordre grâce à une administration efficace et à la promesse de stabilité, récompensant ceux qui se soumettent et enrichissant le royaume par le pillage."
 STATIC_MODIFIER_NAME_nd_liv_dest_amber_monopoly: "Monopole d'Ambre"
 STATIC_MODIFIER_DESC_nd_liv_dest_amber_monopoly: "La Livonie contrôle le commerce de l'ambre depuis la mine jusqu'au marché, fixant les prix, réglementant les exportations et récoltant d'énormes profits de l'appétit de l'Europe pour l'or baltique. L’assimilation des peuples assujettis progresse rapidement dans le cadre d’une intégration culturelle menée par les marchands."
 STATIC_MODIFIER_NAME_nd_liv_dest_free_port: "Charte du port franc"
 STATIC_MODIFIER_DESC_nd_liv_dest_free_port: "Les ports de Livonie sont les plus libres d'Europe : n'importe quel marchand, n'importe quel pavillon, n'importe quelle cargaison. Cette politique attire les commerçants de tout le continent, mais une nation bâtie sur un commerce ouvert a plus de mal à justifier la guerre."
 STATIC_MODIFIER_NAME_nd_liv_dest_merchant_princes: "Princes marchands"
 STATIC_MODIFIER_DESC_nd_liv_dest_merchant_princes: "Une aristocratie commerciale gouverne la Livonie : de riches familles de marchands dont l'influence s'étend aux tribunaux et aux comptoirs du nord de l'Europe. Leur portée diplomatique étend le réseau commercial livonien à travers le continent."
 STATIC_MODIFIER_NAME_nd_liv_dest_baltic_venice: "Venise Baltique"
 STATIC_MODIFIER_DESC_nd_liv_dest_baltic_venice: "Riga est devenue la Venise du Nord : une république de commerce où la fluidité des échanges est la loi suprême. La richesse de la ville entretient une force mercenaire professionnelle, et la complaisance d'une prospérité facile est tenue à distance par la recherche constante de nouveaux marchés."
 nd_liv_deutschordensschloss: "Château Deutschordens"
 nd_liv_deutschordensschloss_desc: "Un grand château de l'ordre croisé : en partie forteresse, en partie palais, en partie siège du gouvernement. Ses murs massifs et son donjon dominent le paysage, projetant la puissance et la permanence de l'État croisé de Livonie à travers les territoires conquis."
 nd_liv_borsenhaus: "Maison Borsen"
 nd_liv_borsenhaus_desc: "Une grande maison de change où les marchands de la Baltique mènent leurs affaires, négociant les prix, réglant leurs comptes et organisant l'expédition des marchandises de Riga vers les marchés européens. Le cœur commercial de l’empire commercial de Livonie."
 nd_liv_deutschordensschloss_upkeep: "Approvisionnement du château"
 nd_liv_deutschordensschloss_upkeep_desc: "Le grand château exige de la pierre pour ses murs, des armes pour sa garnison et du tissu fin pour les bannières et les tapisseries qui proclament l'autorité de l'ordre croisé."
 nd_liv_borsenhaus_upkeep: "Opérations d'échange"
 nd_liv_borsenhaus_upkeep_desc: "Le fonctionnement quotidien de la bourse : papier pour les contrats, tissus pour la corporation des marchands et outils pour entretenir les balances, poids et instruments de mesure qui assurent un commerce équitable."

 # ===== BUREAUCRACIES =====
 liv_walk_landtag_bureaucracy: "Landtag à pied"
 liv_walk_landtag_bureaucracy_desc: "The Livonian Confederation's diet, convened in 1419 at the initiative of Archbishop Johannes Ambundii at Walk (Volmar/Wolmar) and reconvened on a regular schedule until 1559. The four Estates (the Livonian Order, the prince-bishops of Riga, Dorpat, Ösel-Wiek, and Courland, the vassal Knighthoods, and the Hanseatic cities of Riga, Reval, and Dorpat) met to ratify common policy on coinage, war, treaties, and internal disputes. The Landtag was the only body that could speak for medieval Livonia as a whole; in practice it gave the secular and ecclesiastical lords a permanent veto over any single ruler's ambitions."
 liv_ordens_konvent_bureaucracy: "Ordens Konvent"
 liv_ordens_konvent_bureaucracy_desc: "La structure administrative de la branche livonienne de l'Ordre teutonique. Le Landmeister (siégé à Wenden, plus tard Riga) présidait le Grogebietiger - le collège des cinq grands officiers de Landmarschall, Grokomtur, Drapier, Spittler et Tressler - tandis que des Komture individuels commandaient les Kommenden de l'Ordre, les forteresses d'Ordensburg qui ont ancré la conquête de Riga à Narva. Le système Konvent a fusionné le chapitre monastique, le commandement militaire et l'administration territoriale en une seule institution de frères célibataires qui a dirigé le royaume des années 1240 jusqu'à la sécularisation en 1561."
 liv_hanseatic_stadtrat_bureaucracy: "Ville hanséatique"
 liv_hanseatic_stadtrat_bureaucracy_desc: "La gouvernance civique de Riga (créée en vertu de la loi Lbeck en 1201), de Reval/Tallinn (1248) et de Dorpat. Le Rat - un conseil auto-entretenu des lignées marchandes bas-allemandes les plus riches - élisait jusqu'à quatre Brgermeister parmi ses propres membres, envoyait des représentants au Hansetag à Lbeck et administrait la loi de Lbeck à l'intérieur des murs de la ville. La Confrérie des Têtes Noires, une association de marchands étrangers célibataires dont les statuts furent ratifiés à Reval en 1407 et à Riga en 1416, approvisionnait les milices urbaines, défendait les villes pendant la tradition du soulèvement nocturne de Saint-Georges et servait d'antichambre aux membres à part entière des Rats. Leurs maisons existent toujours à Tallinn et autrefois à Riga."
 liv_ritterschaft_vasallenrecht_bureaucracy: "Ritterschaft Vasallenrecht"
 liv_ritterschaft_vasallenrecht_bureaucracy_desc: "L'auto-administration corporative de la noblesse vassale allemande balte, organisée en quatre chevaleries : Harju-Viru dans le nord de l'Estonie (de facto autonome à partir de 1252), Sel-Wiek, Estland et Livland. Chaque chevalerie maintenait son propre Mannbuch (liste de vassalité), sa cour de Mannrichter et son enquête Wackenbuch sur les cotisations des paysans, et rassemblait ses membres en un corps collectif qui rassemblait la cavalerie, ratifiait la loi de la chevalerie et représentait le domaine vassal au Walk Landtag. Le Privilegium Sigismundi Augusti du 28 novembre 1561 a codifié ces privilèges dans l’Indigenat : le droit allemand balte à l’auto-administration qui a survécu à chaque changement de souveraineté (polonaise, suédoise, russe) jusqu’aux dissolutions de 1917 en Estonie et de 1920 en Livland."
 AUTO_MODIFIER_NAME_nd_liv_bureaucracy_authority: "Domaines de la Confédération de Livonie"
 AUTO_MODIFIER_DESC_nd_liv_bureaucracy_authority: "On formation, Livonia inherits the institutional patchwork of the medieval Confederation: the Walk diet, the Order's Konvent, the Hanseatic city councils, and the Ritterschaft corporations of the four Knighthoods. Grants two bureaucracy slots and unlocks the [bureaucracies|e] system, so that two institutions may be kept at once."
