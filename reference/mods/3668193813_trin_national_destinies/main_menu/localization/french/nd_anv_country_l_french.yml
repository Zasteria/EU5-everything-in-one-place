l_french:
 ANV: "Anjou"
 ANV_ADJ: "Angevin"
 ANV_f: "Empire angevin"
 ANV_f_desc: "Reforgez la domination transmanche d'Henri II Plantagenêt, liant le royaume d'Angleterre aux duchés de Normandie et d'Aquitaine et au comté d'Anjou sous une seule couronne. Royaume catholique de sujets anglo-normands, français, normands et occitans, l'Empire angevin était le plus grand régime territorial de l'Europe occidentale du XIIe siècle et sa restauration briserait les fondations du royaume français moderne."
