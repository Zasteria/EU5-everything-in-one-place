l_french:
 STATIC_MODIFIER_NAME_nd_mgo_chinggisid_restoration: "Restauration Gengisid"
 STATIC_MODIFIER_DESC_nd_mgo_chinggisid_restoration: "Le grand Khan a réuni les tumens sous l'autorité chinggisid. Les cavaliers mongols parcourent à nouveau la steppe, leur discipline de fer et leur résilience nomade ayant retrouvé leur gloire d'antan."
 STATIC_MODIFIER_NAME_nd_mgo_yellow_hat_patronage: "Patronage du Chapeau Jaune"
 STATIC_MODIFIER_DESC_nd_mgo_yellow_hat_patronage: "La Mongolie a adopté la voie Gelug, passant d'une confédération de guerriers à une civilisation de monastères et d'apprentissage. Le lien entre Khan et Lama apporte stabilité, sagesse et une nouvelle identité mongole."
 STATIC_MODIFIER_NAME_nd_mgo_tumen_reorganization: "Réorganisation de Tumen"
 STATIC_MODIFIER_DESC_nd_mgo_tumen_reorganization: "La redistribution par Dayan Khan des six tumens orientaux entre ses fils a rétabli l'ordre dans une steppe fragmentée, créant un système militaro-administratif qui canalise l'énergie nomade vers une force organisée."
 STATIC_MODIFIER_NAME_nd_mgo_gelug_conversion_path: "Conversion des Géloug"
 STATIC_MODIFIER_DESC_nd_mgo_gelug_conversion_path: "Les enseignements du Chapeau Jaune se sont répandus dans la steppe. Les monastères s'élèvent là où les ovoos se trouvaient autrefois seuls, et l'écriture mongole capture les sutras aux côtés des chroniques. Une nouvelle ère d'apprentissage et de dévotion transforme le visage de la steppe."
 STATIC_MODIFIER_NAME_nd_mgo_tengri_preservation: "Ciel bleu éternel"
 STATIC_MODIFIER_DESC_nd_mgo_tengri_preservation: "Les anciennes méthodes de Tengri perdurent. Les chamans communient avec le ciel et la terre, les guerriers tirent leur force des esprits ancestraux et la steppe hostile elle-même devient la plus grande forteresse de la Mongolie."
 nd_mgo.1.t: "La réunification de la Mongolie"
 nd_mgo.1.d: "The scattered tribes of the Mongolian steppe have been brought together once more. For generations since the collapse of the great empire, the heirs of Chinggis Khan have warred among themselves: Khalkha against Oirat, tumen against tumen, brother against brother. Now, at last, a single authority commands the loyalty of the steppe.\n\nBut what shall this new Mongolia become? The legacy of Chinggis Khan pulls in two directions. One path calls for the restoration of Chinggisid military authority: the iron discipline of the tumen, the decimal organization that once conquered half the known world. The other path, opened by contact with Tibetan lamas, promises a different transformation entirely: a Mongolia of monasteries and learning, where the khan's legitimacy flows not from the sword but from the dharma.\n\nThe choice will shape Mongolia's identity for generations to come.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mgo.1.a: "Restaurez les tumens. Nous sommes les héritiers de Gengis Khan"
 nd_mgo.1.b: "Adoptez le chapeau jaune : le dharma guidera notre peuple"
 nd_mgo.2.t: "Dayan Khan et les Six Tumens"
 nd_mgo.2.d: "In the late fifteenth century, a child named Batumongke was proclaimed khan by the warrior-queen Mandukhai. Together they would reunite the fractured Mongol nation. Taking the reign name Dayan, 'the Great Yuan', he crushed the Oirat taishis and southwestern rebels, then reorganized the entire eastern Mongol confederation into six great tumens: the Chakhar, Khalkha, Uriankhai, Ordos, Tumed, and Yonshiyebu.\n\nEach tumen was assigned to one of his eleven sons, creating a new aristocracy bound by blood to the Great Khan. This was no mere administrative reform: it was the rebirth of the decimal system that had once made Mongol armies invincible. For a generation, the steppe was united as it had not been since the time of Kublai Khan himself."
 nd_mgo.2.a: "Les six tumens roulent comme un seul"
 nd_mgo.3.t: "La rencontre à Thegchen Chonkhor"
 nd_mgo.3.d: "In 1578, Altan Khan of the Tumed invited Sonam Gyatso, head of the Gelug lineage of Tibetan Buddhism, to a great meeting on the steppe. The encounter would transform Mongolia forever. Altan Khan bestowed upon Sonam Gyatso the title 'Dalai Lama', Ocean of Wisdom, while the lama in turn recognized the khan as a reincarnation of Kublai Khan, the great patron of Buddhism.\n\nAltan Khan decreed that shamanic blood sacrifices would cease, that the images of the ongon spirits would be destroyed, and that the Gelug dharma would become the faith of the Mongols. Within fifty years, tens of thousands of young Mongolian men had taken monastic vows. Erdene Zuu, the first great monastery, rose upon the ruins of ancient Karakorum.\n\nBut not all Mongols welcomed this transformation. Many clung to the old ways of Tengri worship, seeing the Yellow Hats as foreign interlopers who would sap Mongolian martial spirit. The tension between dharma and the eternal blue sky would define Mongolian identity for centuries."
 nd_mgo.3.a: "Laisse le dharma illuminer la steppe"
 nd_mgo.3.b: "Les dieux du ciel de nos ancêtres perdureront"
 nd_mgo.4.t: "Unité de la Khalka"
 nd_mgo.4.d: "The Khalka Mongols, the largest and most central of the Mongol confederations, have at last achieved genuine unity. Where once the four Khalka khanates competed against each other and against the western Oirats, a common identity has emerged. Shared ancestry under the Chinggisid line, common pastures across the Mongolian heartland, and increasingly, a shared Buddhist faith have welded these disparate groups into a single nation.\n\nThis is no empire of conquest but something perhaps more durable: a people who recognize themselves as one. From the Altai Mountains to the Khingan Range, from the Gobi Desert to the Siberian forests, the Khalka identity becomes synonymous with Mongolia itself."
 nd_mgo.4.a: "Nous sommes un seul peuple, une seule steppe"
 nd_mgo.5.t: "Le Jebtsundamba Khutuktu"
 nd_mgo.5.d: "A remarkable figure has emerged to unite spiritual and temporal authority in Mongolia: the Jebtsundamba Khutuktu, recognized as the highest Buddhist incarnation on Mongolian soil. First established when Zanabazar, son of the Tushegtii Khan and a prodigy of art and theology, was identified as a reincarnation of the great scholar Taranatha, the institution of the Jebtsundamba would become the spiritual heart of Mongolia.\n\nZanabazar created the Soyombo script, designed magnificent Buddhist sculptures, and built monasteries that became centers of learning across the steppe. In his person, the ancient Chinggisid bloodline merged with Buddhist sanctity, creating a uniquely Mongolian form of Buddhist authority that commanded loyalty from warrior and monk alike."
 nd_mgo.5.a: "Le Bouddha vivant guide notre peuple"
 nd_mgo_steppe_horsemanship: "Équitation des steppes"
 nd_mgo_steppe_horsemanship_desc: "Le cheval mongol est petit, robuste et infatigable. Les enfants mongols apprennent à monter à cheval avant de savoir marcher, et chaque guerrier effectue une série de remontées pour la campagne."
 nd_mgo_felt_ger_camps: "Campements de Ger en feutre"
 nd_mgo_felt_ger_camps_desc: "La yourte portable en feutre permet à des armées entières de transporter leurs maisons avec elles, maintenant ainsi les lignes de ravitaillement à travers la vaste steppe sans logistique fixe."
 nd_mgo_horse_breeding: "Tradition d'élevage de chevaux"
 nd_mgo_horse_breeding_desc: "L'élevage sélectif de chevaux mongols produit des montures légendaires pour leur endurance, capables de subsister sur l'herbe clairsemée des steppes et de parcourir d'énormes distances."
 nd_mgo_ovoo_veneration: "Ovoo Vénération"
 nd_mgo_ovoo_veneration_desc: "Des cairns de pierres sacrées marquent le paysage spirituel de la steppe. Les voyageurs s'arrêtent pour faire trois fois le tour d'un ovoo et y ajoutent une pierre, honorant les esprits du ciel, de la terre et de l'eau."
 nd_mgo_wolf_hunt_drills: "Exercices de chasse au loup"
 nd_mgo_wolf_hunt_drills_desc: "La grande chasse hivernale au loup sert à la fois d’exercice d’entraînement et de contrôle de la population. Les chasseurs forment d’énormes cercles qui se resserrent au fil des jours : les mêmes tactiques d’encerclement utilisées en temps de guerre."
 nd_mgo_pastoral_wealth: "Richesse pastorale"
 nd_mgo_pastoral_wealth_desc: "Les cinq types d'élevage (chevaux, bovins, moutons, chèvres et chameaux) constituent le fondement de la richesse mongole. Des troupeaux se comptant par milliers soutiennent la nation."
 nd_mgo_chinggisid_lineage: "Lignée Gengisid"
 nd_mgo_chinggisid_lineage_desc: "Seul un descendant de Gengis Khan peut légitimement diriger les Mongols. Ce principe de légitimité du sang unit la steppe sous une autorité reconnue."
 nd_mgo_noyan_retinues: "Suite de Noyan"
 nd_mgo_noyan_retinues_desc: "Chaque noyan, seigneur mongol héréditaire, entretient une suite personnelle de cavaliers lourdement blindés, le noyau d'élite autour duquel la force de combat du tumen est organisée."
 nd_mgo_tumen_system: "Organisation Tumen"
 nd_mgo_tumen_system_desc: "Le système décimal organise les guerriers en unités de dix, cent, mille et dix mille. Chaque tumen fonctionne comme une armée autonome dotée de sa propre structure de commandement."
 nd_mgo_trans_steppe_trade: "Commerce trans-steppe"
 nd_mgo_trans_steppe_trade_desc: "Les marchands traversent la vaste steppe mongole transportant des fourrures, des chevaux et des peaux vers le sud, revenant avec des céréales, de la soie et des marchandises en fer provenant de voisins sédentaires."
 nd_mgo_kurultai_tradition: "Tradition Kurultaï"
 nd_mgo_kurultai_tradition_desc: "La grande assemblée des nobles mongols se réunit pour élire les khans, résoudre les différends et planifier les campagnes. Cette tradition de gouvernance délibérative équilibre l'autorité du khan."
 nd_mgo_composite_bow_mastery: "Maîtrise de l'arc composite"
 nd_mgo_composite_bow_mastery_desc: "Mongolian bowyers perfect the art of layering horn, wood, and sinew into compact recurve bows of extraordinary power, accurate from horseback at full gallop. The bowyers work where the herds give horn and sinew or the forest gives birch."
 nd_mgo_steppe_diplomacy: "Diplomatie des steppes"
 nd_mgo_steppe_diplomacy_desc: "Les traditions diplomatiques mongoles mélangent menace et accommodement : l'échange d'envoyés, les alliances matrimoniales entre maisons nobles et la gestion prudente des relations d'hommage."
 nd_mgo_hide_processing: "Traitement des peaux et de la laine"
 nd_mgo_hide_processing_desc: "Les artisans mongols transforment les produits animaux bruts en biens commerciaux précieux : le feutre de laine, le cuir de peaux et les fourrures qui coûtent cher sur les marchés chinois et d'Asie centrale."
 nd_mgo_dayan_khan_restoration: "La restauration de Dayan Khan"
 nd_mgo_dayan_khan_restoration_desc: "Batumongke Dayan Khan a réaffirmé l'autorité centrale des Chinggisid sur la confédération mongole fracturée, distribuant les six tumens orientaux entre ses fils pour créer un nouvel ordre gouvernemental."
 nd_mgo_yam_relay_posts: "Messages de relais Yam"
 nd_mgo_yam_relay_posts_desc: "Les stations relais Ortoo, espacées d'une journée de marche à travers la steppe, permettent aux messages et aux fournitures de parcourir les vastes distances de la Mongolie à une vitesse remarquable."
 nd_mgo_six_tumens: "Les Six Tumens"
 nd_mgo_six_tumens_desc: "La réorganisation par Dayan Khan des Mongols de l'Est en six grands tumens (Chakhar, Khalkha, Uriankhai, Ordos, Tumed et Yonshiyebu) a restauré le cadre militaro-administratif de l'empire."
 nd_mgo_mongolian_script: "Écriture mongole"
 nd_mgo_mongolian_script_desc: "L'écriture mongole traditionnelle, écrite en colonnes verticales, conserve les chroniques, les codes juridiques et la correspondance. L'alphabétisation se propage à travers les traditions scribales entretenues par les maisons nobles."
 nd_mgo_caravan_routes: "Itinéraires pour caravanes"
 nd_mgo_caravan_routes_desc: "Trade routes crossing the Mongolian steppe connect China to Central Asia, carrying tea, silk, and porcelain eastward and furs, horses, and livestock westward."
 nd_mgo_steppe_fortification: "Fortification des steppes"
 nd_mgo_steppe_fortification_desc: "Tours de guet et positions défensives exploitent l'immensité de la steppe. Les tactiques de la terre brûlée et le climat hostile créent une attrition qui brise les armées d'invasion."
 nd_mgo_sky_worship_rites: "Rites de culte du ciel"
 nd_mgo_sky_worship_rites_desc: "Le culte Tengri, vénération du ciel bleu éternel, lie l'identité mongole aux cieux illimités au-dessus de la steppe. Les cérémonies royales invoquent la bénédiction du ciel sur le règne du khan."
 nd_mgo_altan_khan_reforms: "Les réformes d'Altan Khan"
 nd_mgo_altan_khan_reforms_desc: "L'alliance d'Altan Khan en 1578 avec le Dalaï Lama a initié la transformation de la Mongolie d'une culture guerrière chamanique en une civilisation bouddhiste, interdisant les sacrifices de sang et promouvant l'éducation monastique."
 nd_mgo_keshig_tradition: "Tradition Keshig"
 nd_mgo_keshig_tradition_desc: "Le keshig, garde personnelle du khan, représente les meilleurs guerriers de Mongolie. L'adhésion est un honneur suprême et les soldats keshig surpassent les commandants ordinaires."
 nd_mgo_gelug_monasteries: "Monastères Guéloug"
 nd_mgo_gelug_monasteries_desc: "De grands monastères de la tradition Gelug s'élèvent à travers la Mongolie. Erdene Zuu, construit sur le site de l'ancien Karakorum, abrite un millier de moines et devient le centre de l'apprentissage bouddhiste mongol."
 nd_mgo_ming_border_markets: "Marchés frontaliers Ming"
 nd_mgo_ming_border_markets_desc: "Les marchés aux chevaux le long de la frontière Ming-Mongole échangent des chevaux de guerre et du bétail mongols contre des céréales, du thé, de la soie et du fer chinois. Ce commerce soutient l'économie des steppes."
 nd_mgo_imperial_guard_reform: "Réforme de la Garde Impériale"
 nd_mgo_imperial_guard_reform_desc: "Le keshig est réorganisé selon des principes professionnels, avec un entraînement systématique au combat à cheval et à pied, créant une force d'élite fidèle au seul khan."
 nd_mgo_chinggisid_law_code: "Code de loi Gengisid"
 nd_mgo_chinggisid_law_code_desc: "S'appuyant sur l'héritage du Grand Yasa, les législateurs mongols codifient le droit des steppes en un système complet régissant l'héritage, la justice pénale et les obligations des seigneurs envers leur khan."
 nd_mgo_horse_relay_expansion: "Extension du relais équestre"
 nd_mgo_horse_relay_expansion_desc: "Le système ortoo est étendu et renforcé. Des chevaux frais à chaque station permettent aux cavaliers de parcourir de vastes distances en quelques jours, reliant ensemble les territoires mongols les plus éloignés."
 nd_mgo_zanbuurch_corps: "Corps de Zanbuurch"
 nd_mgo_zanbuurch_corps_desc: "Les guerriers mongols adoptent les armes à feu de leurs voisins chinois et centrasiatiques. Les zanbuurch, mousquetaires à mèche, amènent la guerre à la poudre dans la steppe sans abandonner les traditions montées."
 nd_mgo_khalka_unification: "Unification de Khalka"
 nd_mgo_khalka_unification_desc: "Les quatre khanats de Khalka (Tushegtii, Setsen, Zasagt et Jasaktu) reconnaissent une identité mongole commune, mettant ainsi fin à des siècles de rivalité inter-Khalka."
 nd_mgo_steppe_artillery: "Artillerie des steppes"
 nd_mgo_steppe_artillery_desc: "La guerre de siège arrive dans la steppe. Les forces mongoles acquièrent et emploient des pièces d'artillerie, ajoutant ainsi une nouvelle dimension à une tradition militaire fondée sur la mobilité de la cavalerie."
 nd_mgo_jebtsundamba_line: "Lignée Jebtsundamba"
 nd_mgo_jebtsundamba_line_desc: "Le Jebtsundamba Khutuktu devient la plus haute autorité spirituelle de Mongolie. Commençant par le brillant Zanabazar, cette lignée de lamas incarnés unit la piété bouddhiste à l'héritage chinggisid."
 nd_mgo_nomadic_resilience: "Résilience nomade"
 nd_mgo_nomadic_resilience_desc: "Des générations de vie dans la steppe ont donné au soldat mongol une endurance extraordinaire. Ils se battent avec des approvisionnements minimes, supportent des températures extrêmes et se remettent de revers qui pourraient détruire les armées sédentaires."
 nd_mgo_border_defense_system: "Système de défense des frontières"
 nd_mgo_border_defense_system_desc: "La Mongolie établit un réseau de défense coordonné à travers ses frontières, combinant des patrouilles de cavalerie mobiles, des postes de surveillance en garnison et la communication rapide du système de relais Ortoo."
 nd_mgo_steppe_modernization: "Modernisation des steppes"
 nd_mgo_steppe_modernization_desc: "Les nouvelles technologies et méthodes atteignent la steppe. Les colonies fixes se développent parallèlement aux camps nomades et la Mongolie commence à développer l'infrastructure d'un État moderne."
 nd_mgo_mongolian_renaissance: "Renaissance culturelle mongole"
 nd_mgo_mongolian_renaissance_desc: "Une floraison d'arts et de lettres mongols : de nouvelles chroniques relatent l'histoire nationale, l'art bouddhiste atteint de nouveaux sommets de raffinement et l'écriture Soyombo symbolise une identité mongole affirmée."
 nd_mgo_national_cavalry_reform: "Réforme de la cavalerie nationale"
 nd_mgo_national_cavalry_reform_desc: "La tradition légendaire de la cavalerie mongole est adaptée à la guerre moderne. Les unités montées intègrent des armes à feu et un soutien d'artillerie tout en préservant la mobilité et l'équitation qui ont défini les armées mongoles pendant des siècles."
 nd_mgo_eternal_blue_sky: "L'héritage du ciel bleu éternel"
 nd_mgo_eternal_blue_sky_desc: "L'ancien héritage Tengri (le respect du ciel, de la terre et des esprits de la nature) se mélange à la philosophie bouddhiste pour créer une tradition spirituelle mongole unique qui perdure à travers les âges."
 nd_mgo_modern_administration: "Administration moderne"
 nd_mgo_modern_administration_desc: "La Mongolie développe un système administratif centralisé, remplaçant l'autorité informelle des khans nomades par une gouvernance, une tenue de registres et des institutions bureaucratiques systématiques."
 nd_mgo_great_steppe_legacy: "L'héritage de la Grande Steppe"
 nd_mgo_great_steppe_legacy_desc: "Les traditions martiales de la steppe perdurent. Les armées mongoles conservent l'excellence de la cavalerie et l'endurance nomade qui ont conquis le plus grand empire contigu de l'histoire de l'humanité."
 a_nd_mgo_mangudai: "Mangudaï"
 a_nd_mgo_mangudai_desc: "Des archers montés d'élite spécialisés dans les tactiques de simulation de retraite, attirant les ennemis à leur poursuite avant de se retourner pour lancer des volées dévastatrices. Leur nom signifie « les courageux de la fortune »."
 a_nd_mgo_tumen_rider: "Cavalerie Tumen"
 a_nd_mgo_tumen_rider_desc: "Le noyau discipliné de l’armée mongole, organisé selon l’ancien système décimal. La cavalerie Tumen combine la mobilité des cavaliers des steppes avec la discipline coordonnée des soldats professionnels."
 a_nd_mgo_keshig: "Garde Keshig"
 a_nd_mgo_keshig_desc: "La garde personnelle du khan, choisie parmi les meilleurs guerriers de chaque tumen. Les soldats Keshig sont les combattants les plus fiables et les plus compétents de Mongolie, ils ont juré de défendre le khan au péril de leur vie."
 a_nd_mgo_zanbuurch: "Mousquetaires de Zanbuurch"
 a_nd_mgo_zanbuurch_desc: "Guerriers mongols armés d'armes à feu à mèche adoptées par leurs voisins chinois et d'Asie centrale. Ils combinent la précision des mousquetaires sédentaires avec la robustesse des combattants des steppes."
 a_nd_mgo_modern_cavalry: "Hussards Khalkha"
 a_nd_mgo_modern_cavalry_desc: "Cavalerie mongole réformée équipée de carabines et de sabres, mêlant des siècles d'équitation des steppes à une discipline militaire moderne et à des tactiques d'armes à feu."
 a_nd_mgo_khorchin_rider: "Pillard de Khorchin"
 a_nd_mgo_khorchin_rider_desc: "Cavalerie légère issue des tribus Khorchin de l'est, réputée pour sa vitesse et ses prouesses en matière de raid. Ils frappent comme le vent de la steppe : rapides, soudains et disparus avant que l'ennemi ne puisse répondre."
 a_nd_mgo_noyan_cavalry: "Cavalerie lourde de Noyan"
 a_nd_mgo_noyan_cavalry_desc: "La suite blindée d'un seigneur mongol, vêtue d'une armure lamellaire et brandissant une lance et un sabre. Ils forment la force de choc qui brise les formations ennemies."
 nd_mgo_ger_encampment: "Campement de Ger"
 nd_mgo_ger_encampment_desc: "Un camp semi-permanent de tentes portatives en feutre qui sert de terrain de rassemblement militaire. Le campement de gers fournit un abri, un espace de stockage et un point de ralliement aux forces de prélèvement."
 nd_mgo_ger_maintenance: "Entretien du Ger"
 nd_mgo_ger_maintenance_desc: "Feutre de laine, bois et fourrures d'animaux pour entretenir les abris portables et garder les guerriers du camp au chaud."
 nd_mgo_bowyers_camp: "Bowyers' Camp"
 nd_mgo_bowyers_camp_desc: "A camp of bowyers beside the herds or at the forest's edge. A bow is a year in the making: a birch core, horn on the belly, sinew on the back, all bound with fish glue and left to cure."
 nd_mgo_bow_craft_method: "Composite Bow Making"
 nd_mgo_bow_craft_method_desc: "Birch, horn and sinew are laid up into composite bows with the bowyer's tools. The bows are sold as weaponry."
 nd_mgo_ortoo_station: "Station relais Ortoo"
 nd_mgo_ortoo_station_desc: "Une station du système de relais postal de Yam, qui entretient des chevaux et des cavaliers frais pour transporter des messages et des fournitures à travers la vaste steppe mongole à une vitesse extraordinaire."
 nd_mgo_relay_upkeep: "Entretien des chevaux de relais"
 nd_mgo_relay_upkeep_desc: "Des chevaux frais, du fourrage et du grain de mil pour la chaîne de remontée et les cavaliers de la station relais, garantissant que les dépêches n'attendent jamais une monture reposée."
 nd_mgo_ovoo_cairn: "Cairn d'Ovoo"
 nd_mgo_ovoo_cairn_desc: "Un cairn de pierre sacré où les voyageurs s'arrêtent pour honorer les esprits du ciel, de la terre et de l'eau. Les Ovoos marquent les lieux saints à travers la steppe et servent de points de rassemblement pour les cérémonies saisonnières."
 nd_mgo_ovoo_offerings: "Offres Ovoo"
 nd_mgo_ovoo_offerings_desc: "Livestock sacrificed, beeswax candles burned, and milk spirit poured out at the sacred ovoo to honor the spirits of sky, earth, and water."
 nd_mgo_horse_grounds: "Terrains d'élevage de chevaux"
 nd_mgo_horse_grounds_desc: "Des pâturages dédiés où les chevaux mongols sont élevés de manière sélective pour leur endurance, leur robustesse et leur vitesse qui en font les meilleurs chevaux de guerre de la steppe."
 nd_mgo_horse_care: "Gestion du troupeau de chevaux"
 nd_mgo_horse_care_desc: "Élevage sélectif de chevaux mongols robustes issus de troupeaux soigneusement gérés, produisant des montures prisées dans la steppe pour leur endurance."
 nd_mgo_kurultai_grounds: "Terrain de Kurultai"
 nd_mgo_kurultai_grounds_desc: "Le grand lieu de rassemblement où les nobles mongols se réunissent pour élire des khans, déclarer des guerres et résoudre des différends. La tradition kurultai incarne la gouvernance délibérative de la steppe."
 nd_mgo_assembly_costs: "Dispositions d'assemblage"
 nd_mgo_assembly_costs_desc: "Du bétail pour les festins, de la laine pour les grandes tentes du pavillon et du grain de mil pour nourrir les centaines de nobles cortèges rassemblés au kurultai."
 nd_mgo_buddhist_monastery: "Monastère de Guéloug"
 nd_mgo_buddhist_monastery_desc: "Un grand monastère bouddhiste dans la tradition tibétaine Gelug. Des centaines de moines étudient les sutras, produisent des œuvres d'art et entretiennent des bibliothèques qui font de ces institutions le cœur intellectuel de la Mongolie."
 nd_mgo_monastery_upkeep: "Entretien monastique"
 nd_mgo_monastery_upkeep_desc: "Du bétail pour nourrir la communauté monastique, du papier pour copier les textes sacrés et de la cire d'abeille pour les lampes rituelles qui éclairent les temples du monastère."
 nd_mgo_steppe_trading_post: "Poste de traite des steppes"
 nd_mgo_steppe_trading_post_desc: "Un établissement de marché le long des routes commerciales trans-steppiques où les bergers mongols échangent du bétail, des fourrures et des peaux contre des produits manufacturés, des céréales et des articles de luxe provenant de voisins installés."
 nd_mgo_steppe_trade_goods: "Marchandises du poste commercial"
 nd_mgo_steppe_trade_goods_desc: "Fourrures, bétail et articles en cuir apportés au marché par les bergers et les chasseurs de toute la steppe."
 nd_mgo_scribal_workshop: "Atelier de scribe"
 nd_mgo_scribal_workshop_desc: "Un centre de calligraphie et de tenue de registres mongols, où les scribes copient les chroniques, les codes juridiques et la correspondance diplomatique dans l'élégante écriture mongole verticale."
 nd_mgo_scribal_materials: "Documents de scribe"
 nd_mgo_scribal_materials_desc: "Papier, colorants pour l'encre et cire d'abeille pour les bougies et les sceaux : les fournitures essentielles des scribes qui conservent les archives écrites et les chroniques de la Mongolie."
 nd_mgo_steppe_watchtower: "Tour de guet des steppes"
 nd_mgo_steppe_watchtower_desc: "Une position de guet défensive dans la steppe ouverte, occupée par des troupes de garnison capables de repérer les ennemis qui approchent sur de grandes distances et de relayer les avertissements via le système ortoo."
 nd_mgo_watchtower_upkeep: "Garnison de la Tour de Guet"
 nd_mgo_watchtower_upkeep_desc: "Du bois pour les réparations, des armes pour la garnison et des chevaux pour les patrouilleurs qui occupent cet avant-poste frontalier."
 nd_mgo_border_market: "Marché frontalier"
 nd_mgo_border_market_desc: "Un marché animé à la frontière où les chevaux, le bétail et les fourrures mongols sont échangés contre des céréales, du thé, de la soie et des produits manufacturés chinois. Ces marchés soutiennent l'économie des steppes."
 nd_mgo_border_trade_goods: "Marchandises du commerce frontalier"
 nd_mgo_border_trade_goods_desc: "Chevaux, fourrures et bétail amenés à la frontière pour être échangés avec des marchands chinois et d'Asie centrale."
 nd_mgo_incarnation_palace: "Palais de l'Incarnation"
 nd_mgo_incarnation_palace_desc: "La grande résidence du Jebtsundamba Khutuktu, le plus haut lama incarné de Mongolie. À la fois monastère et cour royale, il sert de centre spirituel et culturel du bouddhisme mongol."
 nd_mgo_palace_upkeep: "Entretien du palais"
 nd_mgo_palace_upkeep_desc: "De la soie pour les robes de cérémonie, du papier pour les textes sacrés et du bétail pour nourrir la communauté monastique du palais."
 nd_mgo_felt_manufactory: "Manufacture de feutre"
 nd_mgo_felt_manufactory_desc: "Une installation à l'échelle industrielle pour transformer la laine mongole en feutre de haute qualité, le matériau essentiel de la vie steppique utilisé dans tout, des murs de yourtes au rembourrage des selles."
 nd_mgo_felt_production: "Production de feutre"
 nd_mgo_felt_production_desc: "Laine mongole transformée en feutre de haute qualité grâce à des techniques traditionnelles de laminage et de pressage, désormais appliquées à l'échelle industrielle."
 levy_nd_mgo_noyan_cavalry: "Prélèvement de cavalerie lourde de Noyan"
 levy_nd_mgo_noyan_cavalry_desc: "Nobles serviteurs appelés à servir dans la cavalerie lourde de leur seigneur."
 levy_nd_mgo_khorchin_rider: "Prélèvement des pillards de Khorchin"
 levy_nd_mgo_khorchin_rider_desc: "Cavaliers légers issus des communautés pastorales de la steppe."
 nd_mgo_formed_tt: "La Mongolie a été formée"
 nd_mgo_path_a_tt: "Choisissez la restauration Chinggisid"
 nd_mgo_path_b_tt: "Choisissez le mécénat Yellow Hat"
 nd_mgo_destiny: "Destin de la Mongolie"
 nd_mgo_destiny_desc: "La Mongolie a été réformée. La steppe attend un nouveau but : les héritiers de Gengis Khan récupéreront-ils leur empire ou traceront-ils une toute nouvelle voie ?"
 nd_mgo_dest_yuan_return: "Retour à Dadu"
 nd_mgo_dest_yuan_return_desc: "The old Yuan capital beckons. Seize Dadu, the summer capital at Shangdu and the northern gateway at Datong to announce that the Great Khan has returned."
 nd_mgo_dest_mandate_reclaimed: "Le mandat récupéré"
 nd_mgo_dest_mandate_reclaimed_desc: "Sécurisez la Mandchourie et le couloir du Gansu. Avec Shenyang et Lanzhou sous contrôle mongol, la voie vers le cœur du pays est ouverte."
 nd_mgo_dest_great_yuan: "Le Grand Yuan restauré"
 nd_mgo_dest_great_yuan_desc: "Achever la restauration de la suprématie mongole. Tenez les plaines centrales, la capitale du sud, et commandez la Route de la Soie de Kashgar à Kaifeng."
 nd_mgo_dest_dharma_steppe: "Le Dharma arrive dans la steppe"
 nd_mgo_dest_dharma_steppe_desc: "Forgez le lien spirituel entre la Mongolie et le Tibet. Contrôlez Lhassa et accumulez les richesses nécessaires pour soutenir une civilisation bouddhiste dans la steppe."
 nd_mgo_dest_sangha_realm: "Le royaume de la Sangha"
 nd_mgo_dest_sangha_realm_desc: "Construisez un royaume bouddhiste prospère grâce au commerce et à l’apprentissage. Adoptez le système bancaire moderne, sécurisez le thé sur vos marchés et laissez la sagesse remplacer l’épée."
 nd_mgo_dest_eternal_dharma: "Le Dharma éternel"
 nd_mgo_dest_eternal_dharma_desc: "Transform Mongolia into an enduring center of Buddhist civilization. Spread literacy through the printing press and raise Karakorum again around the monastery of Erdene Zuu."
 nd_mgo_dest_karakorum_developed_tt: "We own #bold Karakorum#! and its development is at least #bold 6#!"
 nd_mgo.6.t: "Le destin de la Mongolie"
 nd_mgo.6.d: "Mongolia stands reformed, a power of the steppe once more. The great sky stretches endlessly overhead, and beneath it the Mongolian nation draws breath for the first time in generations. But what shall this nation become?\n\nThe path chosen at our formation now opens before us. Whether we march toward the restoration of the Great Yuan or toward a new era of dharma and learning, the destiny of the Mongolian people is ours to shape."
 nd_mgo.6.a: "Le ciel bleu éternel veille sur nous"
 nd_mgo.7.t: "Bannières mongoles sur Dadu"
 nd_mgo.7.d: "The great city of Dadu (Khanbaliq, the City of the Khan) has fallen to Mongolian arms once more. Not since Toghon Temur fled northward in 1368 has a Mongol ruler sat in the old Yuan capital. The Forbidden City that Kublai Khan built stands as it always has, waiting for its rightful masters.\n\nWith the summer capital at Shangdu retaken and Datong secured as the gateway between steppe and settled lands, the first step of the Great Yuan restoration is complete. The peoples of the north look to the Mongol banner with a mixture of awe and fear, for they remember what it meant the last time it flew over these walls."
 nd_mgo.7.a: "Dadu is ours again, as it was always meant to be"
 nd_mgo.8.t: "Le mandat du Nord"
 nd_mgo.8.d: "With Manchuria under our heel and the Gansu corridor secured, the strategic position of the old Yuan dynasty has been restored in all but name. From Shenyang to Lanzhou, Mongol authority extends across the breadth of northern China.\n\nBut how shall we govern these vast conquests? Some counselors urge the path of terror: let the reputation of Mongol riders freeze our enemies in their tracks before battle is even joined. Others argue for disciplined occupation: the iron yoke of systematic Mongol administration that extracts tribute and soldiers from every conquered province."
 nd_mgo.8.a: "Laissons la terreur de notre nom passer devant nous"
 nd_mgo.8.b: "La discipline et l'ordre lieront nos conquêtes"
 nd_mgo.9.t: "Le Grand Yuan revit"
 nd_mgo.9.d: "From the Silk Road cities of Kashgar to the canals of Hangzhou, from the Central Plains of Kaifeng to the steppe heartland of Karakorum, the Mongol empire has been reborn. What Chinggis Khan began and Kublai Khan perfected, we have now restored.\n\nThe question that faces every great conqueror now confronts us: shall we rule this empire from the Khanbaliq throne as emperors of a settled civilization, managing subjects and building institutions? Or shall we remain what we have always been: world conquerors, for whom the horizon is never the boundary but merely the next objective?"
 nd_mgo.9.a: "Nous régnerons depuis le trône de Khanbaliq"
 nd_mgo.9.b: "Le monde lui-même est notre droit de naissance"
 nd_mgo.10.t: "La Lumière du Dharma"
 nd_mgo.10.d: "The sacred bond between Mongolia and Tibet has been sealed. With Lhasa under Mongolian protection, the Yellow Hat teachings flow freely northward across the mountains. Monks from Drepung and Sera travel to the steppe, founding monasteries and teaching the dharma to eager Mongolian students.\n\nThis is not merely a matter of faith. The monasteries bring literacy, record-keeping, medicine, and a cosmopolitan network of learning that connects Mongolia to the wider Buddhist world. The wealth accumulated through careful stewardship sustains this transformation, proving that Mongolia can be great without conquest alone."
 nd_mgo.10.a: "Le dharma illumine la steppe"
 nd_mgo.11.t: "Un royaume de moines et de marchands"
 nd_mgo.11.d: "Mongolia has become something its warrior ancestors would scarcely recognize: a prosperous realm of monasteries, markets, and learning. The banking institutions adopted from distant lands allow the monasteries to manage their growing wealth, while the tea trade with China enriches every settlement along the caravan routes.\n\nBut which aspect of this transformation shall we emphasize? Some advocate deepening the monastic tradition: building more monasteries, training more scholars, letting the wisdom of the sangha guide our nation's growth. Others point to the tea road and argue that Mongolia's future lies in trade: that the wealth flowing through our markets will accomplish what armies never could."
 nd_mgo.11.a: "Approfondir la sagesse de la sangha"
 nd_mgo.11.b: "La route du thé est notre chemin vers la grandeur"
 nd_mgo.12.t: "Le Dharma éternel de la steppe"
 nd_mgo.12.d: "Mongolia has achieved what no one thought possible: a nomadic civilization that rivals any settled kingdom in learning, prosperity, and culture. The great monastery complex at Erdene Zuu stands on the ruins of ancient Karakorum, where once the world's conquerors held court. Now it is monks and scholars who gather here, not warriors.\n\nThe Soyombo script created by Zanabazar has become a symbol of Mongolian identity itself, adorning everything from monastery gates to official documents. Shall we carry Zanabazar's vision forward: using culture and art as the tools of soft power? Or shall we build a universal sangha, a Buddhist community that transcends borders and binds all peoples of the steppe under the dharma's gentle authority?"
 nd_mgo.12.a: "La vision de Zanabazar sera notre guide"
 nd_mgo.12.b: "Que la sangha unisse tous les peuples"
 STATIC_MODIFIER_NAME_nd_mgo_dest_steppe_terror: "Terreur de la steppe"
 STATIC_MODIFIER_DESC_nd_mgo_dest_steppe_terror: "La réputation des cavaliers mongols les précède. Les villes se soumettent plutôt qu’elles ne subissent les conséquences de la résistance, et les ennemis hésitent à défier les héritiers de Gengis Khan."
 STATIC_MODIFIER_NAME_nd_mgo_dest_iron_yoke: "Le joug de fer"
 STATIC_MODIFIER_DESC_nd_mgo_dest_iron_yoke: "L'administration mongole systématique extrait les soldats et les tributs des provinces conquises avec une efficacité impitoyable, même si la demande constante de troupes pèse sur la population."
 STATIC_MODIFIER_NAME_nd_mgo_dest_khanbaliq_throne: "Trône de Khanbaliq"
 STATIC_MODIFIER_DESC_nd_mgo_dest_khanbaliq_throne: "Le Grand Khan règne depuis le trône de Khanbaliq en tant qu'empereur d'un vaste domaine, imposant la loyauté de divers sujets et bâtissant les institutions d'un empire sédentaire."
 STATIC_MODIFIER_NAME_nd_mgo_dest_world_conqueror: "Conquérant du monde"
 STATIC_MODIFIER_DESC_nd_mgo_dest_world_conqueror: "La quête mongole d’un empire universel se poursuit. Les réseaux de renseignement et les prétextes juridiques pour la guerre se développent rapidement, même si le maintien d’armées aussi vastes met à rude épreuve les finances publiques."
 STATIC_MODIFIER_NAME_nd_mgo_dest_monastic_wisdom: "Sagesse monastique"
 STATIC_MODIFIER_DESC_nd_mgo_dest_monastic_wisdom: "Les monastères sont devenus les moteurs de la croissance mongole, attirant colons et marchands. Mais la prospérité peut engendrer la complaisance dans une nation qui vivait autrefois par l’épée."
 STATIC_MODIFIER_NAME_nd_mgo_dest_tea_road_riches: "Richesses de la Route du Thé"
 STATIC_MODIFIER_DESC_nd_mgo_dest_tea_road_riches: "Les grandes caravanes de thé traversant la steppe versent des richesses dans les coffres mongols et ouvrent des voies diplomatiques, même si l'afflux d'argent fait grimper les prix."
 STATIC_MODIFIER_NAME_nd_mgo_dest_soyombo_legacy: "L'héritage de Soyombo"
 STATIC_MODIFIER_DESC_nd_mgo_dest_soyombo_legacy: "Les réalisations culturelles de Zanabazar (l’écriture Soyombo, la sculpture bouddhiste et l’architecture monastique) deviennent des outils du soft power mongol, gagnant une influence là où les armées ne le peuvent pas."
 STATIC_MODIFIER_NAME_nd_mgo_dest_universal_sangha: "Sangha universelle"
 STATIC_MODIFIER_DESC_nd_mgo_dest_universal_sangha: "La sangha bouddhiste transcende les frontières, créant une communauté spirituelle qui facilite les relations avec les autres nations bouddhistes et confère au clergé une influence sans précédent."
 nd_mgo_yuan_imperial_palace: "Palais impérial Yuan"
 nd_mgo_yuan_imperial_palace_desc: "Le palais restauré du Grand Khan à Khanbaliq, reconstruit dans la grandeur de la dynastie Yuan. Depuis ses salles, l’empereur mongol contrôle les richesses de la Chine et la loyauté d’une centaine de peuples."
 nd_mgo_imperial_court_upkeep: "Cour Impériale"
 nd_mgo_imperial_court_upkeep_desc: "La cour restaurée des Yuan exige des robes en soie, de la porcelaine fine, des meubles élégants et des tissus de qualité pour conserver la splendeur qui convient à la dignité du Grand Khan."
 nd_mgo_erdene_zuu_complex: "Complexe Erdene Zuu"
 nd_mgo_erdene_zuu_complex_desc: "Le grand complexe monastique sur le site de l'ancien Karakorum, abritant des centaines de moines, des bibliothèques de textes sacrés et des ateliers d'art bouddhiste. Le cœur spirituel de la civilisation mongole."
 nd_mgo_erdene_zuu_upkeep: "Entretien du complexe monastique"
 nd_mgo_erdene_zuu_upkeep_desc: "Le papier pour copier les textes sacrés, la cire d'abeille pour les lampes rituelles, le bétail pour nourrir la communauté monastique et l'encens pour le culte quotidien soutiennent ce grand centre d'apprentissage."

 # ===== BUREAUCRACY UNLOCK =====
 AUTO_MODIFIER_NAME_nd_mgo_bureaucracy_authority: "Offices of the Khalkha Assembly"
 AUTO_MODIFIER_DESC_nd_mgo_bureaucracy_authority: "A reunited Mongolia has room for three more institutions, chosen among the Khalkha confederation, the Bogd Gegen lineage, the Khalkha Jirum, the banner administration and the patronage of the Yellow Hat sangha."

 # ===== BUREAUCRACIES =====
 mgo_khalkha_tusheet_bureaucracy: "Confédération Khalkha Tsheet"
 mgo_khalkha_tusheet_bureaucracy_desc: "Après la réunification de Dayan Khan (vers 1500-1517), le royaume de Khalkha se cristallisa en trois khanats chinggisides : Tsheet (au centre), Sain Noyon (à l'ouest, séparé en 1725) et Zasagt (à l'extrême ouest). Les trois khans se sont réunis au Khree Chuulgan pour décider de la guerre, de la succession et du tribut, un compromis structurel entre les revendications des khans universels et l'autonomie patrimoniale des princes Borjigin. Tant qu'ils sont maintenus, les chuulgans se réunissent et les levées fédérées se rassemblent sous une seule bannière ; bien que négligées, les trois lignées princières s'écartent et les pouvoirs du centre ne fonctionnent que dans ses propres otogs."
 mgo_bogd_gegen_bureaucracy: "Lignée Bogd Gegen"
 mgo_bogd_gegen_bureaucracy_desc: "En 1639, les princes de Khalkha reconnurent Zanabazar, quatre ans, fils de Tsheet Khan Gombodorj et arrière-petit-fils d'Abadai Khan, comme le premier Jebtsundamba Khutuktu, le lama suprême réincarné de Khalkha Mongolie. Formé au Tibet par le Cinquième Dalaï Lama, il refonde Erdene Zuu et l'émouvante capitale monastique d'Ikh Khree (plus tard Urga). La lignée combinait une lignée Chinggisid avec une réincarnation Gelug, produisant une fonction sacrée dont la légitimité a survécu à tout khan temporel. Disponible uniquement lorsque le royaume a adopté le bouddhisme tibétain."
 mgo_khalkha_jirum_bureaucracy: "Khalkha Jirum"
 mgo_khalkha_jirum_bureaucracy_desc: "Compilé entre 1709 et 1770 environ par la grande assemblée de Khalkha sous le Tsheet Khan et le deuxième Jebtsundamba Khutuktu. Ses vingt-cinq chapitres intègrent le Yassa de Gengis Khan, les édits bouddhistes d'Altan Khan de 1577, l'Oirat-Khalkha Ikh Tsaaz de 1640 et les réglementations mongoles-Oirat imposées par les Mandchous. Les affaires étaient jugées devant des collèges de zaisangs (juges de clan) sur la base d'articles écrits, contournant les tribunaux seigneuriaux patrimoniaux. Le code permanent de la Mongolie jusqu'à ce que les codifications mandchoues des années 1780 le remplacent."
 mgo_otog_khoshuu_bureaucracy: "Administration de la bannière Otog-Khoshuu"
 mgo_otog_khoshuu_bureaucracy_desc: "Les roturiers mongols post-Yuan étaient organisés en otogs - des unités familiales décimales et pastorales comptant nominalement un millier de ménages - chacune dirigée par un taishi nommé. La colonie de Dayan Khan liait les otogs aux six tmens ; les lignées princières Khalkha les ont transformés en khoshuus héréditaires liés à un seul registre de ménage de noyan, avec leurs propres rotations de pâturages, droits postaux (rt) et listes de rassemblement. Les transferts entre khoshuus étaient interdits et la parole du noyan régissait les mouvements de chaque roturier. Les Mandchous Lifan Yuan héritèrent du système intact en 1691."
 mgo_yellow_hat_sangha_bureaucracy: "Patronage de la Sangha au Chapeau Jaune"
 mgo_yellow_hat_sangha_bureaucracy_desc: "En 1578, Altan Khan du Tmed rencontra Sonam Gyatso au monastère de Yanghua ; Altan a accordé le titre de Dalaï Lama à Sonam Gyatso, qui à son tour a proclamé Altan une réincarnation de Khubilai Khan. Le pacte faisait des khans mongols les patrons temporels de l'ordre Gelug. Renouvelé par la fondation d'Erdene Zuu par Abadai Khan en 1585 sur les ruines de Karakorum, et par la conquête du Tibet par Gshi Khan en 1642 au nom du Cinquième Dalaï Lama, le patronage accorda aux monastères des shabinar (ménages de serviteurs laïcs) exonérés de l'impôt princier - un privilège fiscal qui draina les noyans et construisit l'économie monastique de la Mongolie. Disponible uniquement lorsque le royaume a adopté le bouddhisme tibétain."
