l_french:
 STATIC_MODIFIER_NAME_nd_pol_golden_liberty: "Liberté dorée"
 STATIC_MODIFIER_DESC_nd_pol_golden_liberty: "La liberté dorée de la szlachta accorde à chaque noble une voix égale au Sejm. Les dissidents religieux trouvent refuge sous ce large auvent de tolérance, et la législature bourdonne de débats vigoureux, bien que la propre autorité de la Couronne se plie devant la volonté de la noblesse assemblée."
 STATIC_MODIFIER_NAME_nd_pol_piast_legacy: "L'héritage des Piast"
 STATIC_MODIFIER_DESC_nd_pol_piast_legacy: "En invoquant la mémoire des rois Piast qui unifièrent les terres polonaises, la Couronne réaffirme son autorité sur les nobles rebelles. Les fonctionnaires royaux appliquent les ordres du roi depuis Cracovie jusqu'aux marches, forgeant un État discipliné, même si les szlachta se plaignent de la diminution de leurs prérogatives."
 nd_pol.1.t: "La couronne de Pologne"
 nd_pol.1.d: "The white eagle rises once more over a united Polish kingdom. From the spires of Kraków to the plains of Mazovia, the Polish lands answer to one crown. But what kind of kingdom shall this be?\n\nThe szlachta, Poland's vast and proud nobility, have long claimed equal voice in the governance of the realm. Their tradition of golden liberty promises religious tolerance, parliamentary vigour, and a kingdom where even the humblest gentleman may shape the nation's destiny. Yet this same freedom can paralyse the state when decisive action is needed.\n\nAlternatively, the Crown may look to the Piast kings of old, who ruled with firm hands and built Poland from scattered tribes into a great Christian kingdom. Centralized authority, professional administration, and royal discipline could forge an instrument of power, though at the cost of noble goodwill.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_pol.1.a: "Que chaque noble parle librement au Sejm !"
 nd_pol.1.b: "La parole du roi fera loi depuis Cracovie jusqu'aux marches."
 nd_pol_piast_reunification: "Réunification Piast"
 nd_pol_piast_reunification_desc: "La lutte séculaire de la dynastie Piast pour réunifier les duchés polonais fragmentés a forgé une tradition de mariage diplomatique, de négociation et de consolidation patiente qui définit l'approche polonaise de l'art politique."
 nd_pol_wieliczka_salt: "Mines de sel de Wieliczka"
 nd_pol_wieliczka_salt_desc: "Les mines de sel royales de Wieliczka et de Bochnia comptent parmi les plus grands trésors d'Europe. Produisant un tiers des revenus de la Couronne, ces vastes galeries souterraines sont gérées par le monopole royal, leur « or blanc » finançant les ambitions de la Pologne."
 nd_pol_nihil_novi: "Nihil Novi"
 nd_pol_nihil_novi_desc: "La loi de 1505 Nihil Novi nisi commune consensu, « rien de nouveau sans le consentement commun », consacre le principe selon lequel aucune loi ne peut être adoptée sans l'accord du Sejm, faisant du parlement polonais une branche de gouvernance co-égale aux côtés de la Couronne."
 nd_pol_sukiennice_trade: "Halles commerciales de Sukiennice"
 nd_pol_sukiennice_trade_desc: "La grande Halle aux Draps de Cracovie domine la place principale du marché, ses arcades Renaissance abritant un commerce animé de tissus, d'épices, de soie, de sel et de plomb. Le Sukiennice est le cœur commercial de la vie urbaine polonaise."
 nd_pol_obrona_potoczna: "Obrona Potoczna"
 nd_pol_obrona_potoczna_desc: "La première force militaire permanente de Pologne, l'Obrona Potoczna, « défense actuelle », fut créée vers 1500 pour protéger la frontière sud-est contre les raids tatars. Ces patrouilles de cavalerie payées par la Couronne étaient le germe d'une armée permanente."
 nd_pol_straz_morska: "Sea Guard"
 nd_pol_straz_morska_desc: "When Ivan the Terrible took Narva, Sigismund Augustus answered at sea. From 1560 he issued letters of marque to captains who seized ships carrying arms and goods to the Muscovite port, and in 1568 he placed them under a Maritime Commission, the first admiralty Poland ever had. The king's privateers were called the Sea Guard."
 nd_pol_crown_arsenal: "Arsenal de la Couronne"
 nd_pol_crown_arsenal_desc: "Les zbrojownie royales, arsenaux de la Couronne, stockent et produisent les armes, armures et munitions qui équipent les armées professionnelles polonaises. Ces armureries fortifiées permettent le rassemblement rapide de forces bien équipées."
 nd_pol_vistula_flotilla: "Flottille fluviale de la Vistule"
 nd_pol_vistula_flotilla_desc: "La flottille fluviale et côtière polonaise patrouille le long des approches de la Vistule et de la Baltique, protégeant le commerce vital des céréales et fournissant une capacité navale modeste mais croissante à une puissance traditionnellement axée sur la terre."
 nd_pol_sukiennice: "Sukiennice"
 nd_pol_sukiennice_desc: "Une grande halle aux draps et une bourse commerciale dans la tradition polonaise, où les marchands se rassemblent pour échanger des textiles, des épices et des produits de luxe sous des arcades Renaissance."
 nd_pol_kopalnia_soli: "Kopalnia Soli"
 nd_pol_kopalnia_soli_desc: "Une mine de sel royale exploitée sous le monopole de la Couronne, extrayant « l'or blanc » qui finance le trésor polonais et alimente la demande insatiable de sel de l'Europe."
 nd_pol_zbrojownia: "Zbrojownia"
 nd_pol_zbrojownia_desc: "Un arsenal royal fortifié stockant des armes, des armures et des munitions. Ces armureries de la Couronne permettent d'équiper rapidement les soldats professionnels et les troupes de levée."
 n_nd_pol_kaper: "Kaper"
 n_nd_pol_kaper_desc: "A merchant ship armed and commissioned under the king's letter of marque. It carries few guns, but it does not need many to stop a trader bound for Narva and bring her into port as a prize."
 a_nd_pol_obrona_potoczna: "Obrona Potoczna"
 a_nd_pol_obrona_potoczna_desc: "Cavalerie de défense des frontières payée par la Couronne patrouillant la frontière sud-est de la Pologne. Des éclaireurs rapides et disciplinés, entraînés à intercepter les pillards tatars avant qu'ils ne puissent pénétrer profondément dans le royaume."
 nd_pol_cloth_exchange_pm: "Échange de tissus"
 nd_pol_cloth_exchange_pm_desc: "Le commerce animé de textiles, de produits teints, de papier et de sel qui soutient les opérations commerciales de Sukiennice."
 nd_pol_salt_extraction_pm: "Extraction du sel"
 nd_pol_salt_extraction_pm_desc: "Extraction du sel gemme dans des galeries souterraines profondes, extraction de « l'or blanc » de Pologne pour un usage domestique et pour l'exportation."
 nd_pol_arsenal_upkeep_pm: "Opérations d'Arsenal"
 nd_pol_arsenal_upkeep_pm_desc: "L'entretien et la production d'armes, d'armes à feu, d'équipements en cuir et de ferronnerie dans l'arsenal royal."
 nd_pol_formed_tt: "La Pologne est formée"
 nd_pol_path_a_tt: "Choisissez la Liberté Dorée"
 nd_pol_path_b_tt: "Choisissez l'héritage des Piasts"
 nd_pol_dest_warsaw_developed_tt: "We own #bold Warsaw#! and its development is at least #bold 42#!"
 nd_pol_dest_krakow_developed_tt: "We own #bold Kraków#! and its development is at least #bold 51#!"
 nd_pol_destiny: "Destin de la Pologne"
 nd_pol_destiny_desc: "L'aigle blanc s'est levé au-dessus d'un royaume-uni. La question n’est plus de savoir si la Pologne perdurera, mais quelle forme prendra sa grandeur. Stabilisez le royaume et tracez la voie pour l’avenir."
 nd_pol.2.t: "Le destin de l'aigle blanc"
 nd_pol.2.d: "La Pologne est unie et stable, ses fondations solides. Les choix que nous ferons maintenant détermineront si l’aigle blanc plane au-dessus d’une communauté de peuples libres ou d’un royaume forgé par le fer et la discipline. Notre destin nous appartient d’écrire."
 nd_pol.2.a: "La Pologne perdure. Maintenant, laissez-la s'épanouir."
 nd_pol_dest_sejm: "Triomphe du Sejm"
 nd_pol_dest_sejm_desc: "Établir le Sejm comme organe législatif suprême du royaume. Développer le commerce du sel polonais via le marché des capitaux et adopter des institutions bancaires modernes pour financer l'État parlementaire."
 nd_pol.3.t: "L'ascendant au Sejm"
 nd_pol.3.d: "Le Sejm est devenu le cœur battant de la gouvernance polonaise. La richesse du sel circule sur nos marchés de capitaux, les banques ouvrent leurs registres et chaque noble, du plus grand magnat au plus pauvre szlachcic, peut exprimer ce qu'il pense dans la chambre. La Liberté Dorée n’est pas un simple slogan ; c'est la loi du pays."
 nd_pol.3.a: "Rien de nouveau sans le consentement commun !"
 nd_pol_dest_confederation: "Confédération de Varsovie"
 nd_pol_dest_confederation_desc: "Sécurisez Gdansk et ses routes commerciales baltes pour la Couronne. Adoptez l’imprimerie pour diffuser la connaissance et la tolérance à travers le royaume, jetant ainsi les bases d’une confédération multiethnique."
 nd_pol.4.t: "La Confédération de Varsovie"
 nd_pol.4.d: "Avec Gdansk sous la couronne et l’imprimerie diffusant les idées plus rapidement que jamais, la Pologne est devenue un phare de tolérance dans une Europe déchirée par les guerres de religion. La Confédération de Varsovie proclame qu'aucun homme ne sera persécuté pour sa foi : une promesse radicale qui attire les marchands, les érudits et les réfugiés vers nos côtes. Comment allons-nous bâtir sur cet héritage ?"
 nd_pol.4.a: "Laissez le commerce balte enrichir notre confédération."
 nd_pol.4.b: "Que les persécutés trouvent ici refuge."
 STATIC_MODIFIER_NAME_nd_pol_dest_baltic_merchants: "Commerce balte"
 STATIC_MODIFIER_DESC_nd_pol_dest_baltic_merchants: "Les marchands de Gdansk acheminent les bénéfices des céréales, de l'ambre et du bois de la Baltique via les réseaux commerciaux du Commonwealth, même si le maintien de cet empire commercial met à rude épreuve les budgets militaires."
 STATIC_MODIFIER_NAME_nd_pol_dest_religious_haven: "Sanctuaire des Croyances"
 STATIC_MODIFIER_DESC_nd_pol_dest_religious_haven: "Juifs, protestants, unitariens et croyants orthodoxes affluent vers les côtes tolérantes du Commonwealth, apportant connaissances et savoir-faire, même si les vieilles traditions militaires rouillent en temps de paix."
 nd_pol_dest_republic: "Couronne du Commonwealth"
 nd_pol_dest_republic_desc: "Unite the Lithuanian and Polish crowns in a true commonwealth of peoples. Achieve supremacy in global trade, take Warsaw into the Crown and build it into the seat of the Sejm and the royal elections, and prove that a republic of nobles can rival any kingdom."
 nd_pol.5.t: "Res Publica"
 nd_pol.5.d: "Ce qui a commencé comme une union de couronnes est devenu quelque chose que personne n’aurait pu prévoir : une véritable république des nations. Les Polonais, les Lituaniens, les Ruthènes et d’innombrables autres partagent la gouvernance du plus grand État parlementaire que l’Europe ait jamais connu. Les routes commerciales mondiales transportent des céréales polonaises et du bois lituanien vers chaque port. Les universitaires débattent librement dans les salles de Cracovie. C’est la Rzeczpospolita, le Commonwealth, et l’histoire n’a jamais connu une pareille."
 nd_pol.5.a: "Un âge d’or d’apprentissage et de prospérité !"
 nd_pol.5.b: "Nous sommes les héritiers de Sarmatia renaissante !"
 STATIC_MODIFIER_NAME_nd_pol_dest_golden_age: "Âge d'or polonais"
 STATIC_MODIFIER_DESC_nd_pol_dest_golden_age: "Le Commonwealth entre dans une ère d’épanouissement culturel et économique sans précédent. Le développement s'accélère, la production augmente et les bâtiments s'élèvent à travers le royaume à moindre coût."
 STATIC_MODIFIER_NAME_nd_pol_dest_sarmatian_ideal: "Idéal sarmate"
 STATIC_MODIFIER_DESC_nd_pol_dest_sarmatian_ideal: "Les szlachta embrassent leur héritage mythique sarmate, forgeant une culture noble unique de valeur, de liberté et d'indépendance farouche qui façonne l'identité polonaise pendant des siècles."
 nd_pol_dest_silesia: "Récupération de la Silésie"
 nd_pol_dest_silesia_desc: "Récupérez les anciennes terres Piast de Silésie. Prenez Wroclaw et Opole, sièges historiques des duchés polonais perdus face à la suzeraineté bohème, et reconstruisez la force militaire de la Couronne."
 nd_pol.6.t: "Les duchés silésiens restaurés"
 nd_pol.6.d: "Wroclaw et Opole (villes fondées par les princes Piast, gouvernées par des ducs polonais pendant des siècles avant de tomber sous la domination bohème) font voler à nouveau l'aigle blanc. La reconquête de la Silésie démontre que la Couronne centralisée dispose du pouvoir militaire nécessaire pour faire valoir ses anciennes revendications. L’héritage Piast perdure."
 nd_pol.6.a: "La Silésie revient à la couronne polonaise !"
 nd_pol_dest_eastern_march: "Marches de l'Est"
 nd_pol_dest_eastern_march_desc: "Project royal power deep into the east. Seize Lviv and Smolensk, the keys to Ruthenia and the Russian frontier, raise the Obrona Potoczna to guard them, and maintain the treasury and army needed to hold these vast conquests."
 nd_pol.7.t: "La frontière orientale"
 nd_pol.7.d: "Des bannières polonaises flottent sur le haut château de Lviv et les anciens murs de Smolensk. Les marches orientales (une vaste frontière de forêts, de rivières et de frontières contestées) répondent désormais à la Couronne. Mais la détention de ces conquêtes exige un choix : devons-nous fortifier la frontière contre tout venant, ou intégrer ces terres ruthènes dans le tissu du royaume ?"
 nd_pol.7.a: "Fortifiez chaque passage et col de montagne."
 nd_pol.7.b: "Ce sont désormais des terres polonaises. Intégrez-les."
 STATIC_MODIFIER_NAME_nd_pol_dest_frontier_fortifications: "Fortifications de Kresy"
 STATIC_MODIFIER_DESC_nd_pol_dest_frontier_fortifications: "Un réseau de fortifications frontalières le long des marches orientales dissuade l’invasion et saigne les attaquants, bien que l’orientation militaire détourne les ressources de la production de matières premières."
 STATIC_MODIFIER_NAME_nd_pol_dest_ruthenia_integration: "Intégration ruthène"
 STATIC_MODIFIER_DESC_nd_pol_dest_ruthenia_integration: "Les administrateurs, les colons et les institutions polonais étendent le contrôle royal sur les territoires ruthènes conquis, les convertissant et les assimilant, bien que le prestige s'érode avec une expansion aussi rapide."
 nd_pol_dest_piast_crown: "Couronne des Piasts"
 nd_pol_dest_piast_crown_desc: "Complete the Piast dream. Crush the Teutonic Order by taking Konigsberg, seize Kyiv as the gateway to the southern steppes, raise Kraków into a coronation city worthy of the crown, and build a military monarchy that dominates Eastern Europe from the Baltic to the Black Sea."
 nd_pol.8.t: "Couronne de fer des Piasts"
 nd_pol.8.d: "Kœnigsberg est tombé. Kyiv s'agenouille devant l'aigle blanc. Des rives de la Baltique aux steppes de la mer Noire, les terres que les princes Piast rêvaient autrefois de gouverner répondent désormais à une seule couronne polonaise. Il ne s’agit pas ici du doux débat sur la république de la szlachta : il s’agit d’un royaume forgé dans le fer, tenu par la discipline et élargi par la force. L'ancienne vision de la dynastie Piast d'une grande monarchie polonaise, s'étendant d'une mer à l'autre, se réalise enfin."
 nd_pol.8.a: "Le fer et la discipline retiendront ce que nous avons gagné."
 nd_pol.8.b: "Gouvernez cet empire d’une main ferme mais compétente."
 STATIC_MODIFIER_NAME_nd_pol_dest_iron_crown: "Discipline de fer"
 STATIC_MODIFIER_DESC_nd_pol_dest_iron_crown: "Les vastes armées de la Couronne sont forgées dans la tradition des rois-guerriers Piast. Une récupération rapide, des renforts bon marché et une projection de force écrasante écrasent toute opposition."
 STATIC_MODIFIER_NAME_nd_pol_dest_imperial_administration: "Administration royale"
 STATIC_MODIFIER_DESC_nd_pol_dest_imperial_administration: "Une bureaucratie royale professionnelle gouverne les vastes domaines polonais, supprimant le séparatisme et promouvant la prospérité grâce à un gouvernement centralisé efficace."
 nd_pol_trybunaly: "Trybunaly Koronne"
 nd_pol_trybunaly_desc: "Le Crown Tribunal : la cour d'appel suprême du Commonwealth, où de nobles juges élus règlent les différends et font respecter les lois du Sejm. Un symbole de gouvernance par consentement."
 nd_pol_hetmanat: "Hetmanat"
 nd_pol_hetmanat_desc: "Le quartier général militaire de l'Hetman, où le commandant militaire supérieur de la Couronne coordonne les campagnes, rassemble les levées et entretient l'arsenal d'une machine de guerre polonaise centralisée."
 nd_pol_tribunal_operations_pm: "Administration des tribunaux"
 nd_pol_tribunal_operations_pm_desc: "Les greffiers, juges et fonctionnaires qui entretiennent la Cour suprême du Commonwealth, consomment du papier, des livres juridiques, des tissus fins et des meubles."
 nd_pol_hetman_supply_pm: "Intendant de Hetman"
 nd_pol_hetman_supply_pm_desc: "Le corps d'intendant fournissant à l'armée de l'Hetman des armes, de la maroquinerie, des chevaux de guerre et des uniformes."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_pol_bureaucracy_authority: "Autorité de la Couronne polonaise"
 AUTO_MODIFIER_DESC_nd_pol_bureaucracy_authority: "The reconstituted Polish Kingdom inherits the institutional weight of Piast and Jagiellonian governance, granting four bureaucracy slots to formalize the realm's standing organs of state."

 pol_statuty_kazimierzowskie_bureaucracy: "Statut Kazimierzowskie"
 pol_statuty_kazimierzowskie_bureaucracy_desc: "Les codes juridiques de Kazimierz le Grand - le Statut de Wislica pour la Petite Pologne (1346) et le Statut de Piotrkw pour la Grande Pologne (1347) - furent la première loi écrite complète du Royaume de Pologne. Les juges royaux se sont inspirés de ces codes pour appliquer des règles uniformes dans toute la wojewodztwa, mettant ainsi fin à la mosaïque du droit coutumier régional et liant la noblesse aux tribunaux du roi. La tradition se souvient de Kazimierz comme du roi qui « fonda la Pologne en bois et la laissa en pierre » : les statuts constituaient le cadre sur lequel cette pierre était posée."

 pol_wojewoda_kasztelan_bureaucracy: "Wojewodowie et Kasztelanowie"
 pol_wojewoda_kasztelan_bureaucracy_desc: "Hérité de l'époque de la partition Piast, le système territorial divisait le royaume en wojewodztwa sous les voïvodes qui convoquaient le prélèvement régional, et en kasztelanie centrée sur des châteaux fortifiés détenus par des châtelains dotés d'une autorité policière et judiciaire. Les deux postes étaient pourvus par la noblesse locale, fusionnant le commandement royal avec la prérogative du magnat. Le voïvode de Cracovie avait préséance sur tous les autres, siégeant au premier rang des sénateurs du royaume."

 pol_urzedy_koronne_bureaucracy: "Urzédy Koronne"
 pol_urzedy_koronne_bureaucracy_desc: "Les cinq grands offices de la Couronne - Marszalek Wielki (maréchal), Kanclerz (chancelier du sceau), Podkanclerzy (vice-chancelier), Podskarbi Koronny (trésorier) et à partir de 1503 l'Hetman Wielki (grand commandant) - étaient détenus à vie et ne pouvaient être révoqués. Royal de nom et noble en pratique, le mandat à vie rendait le licenciement presque impossible : un officier qui se conduisait mal pouvait être ignoré mais jamais révoqué. Cet arrangement assurait la continuité du royaume au prix de la liaison de l'appareil de la couronne aux clans de magnats qui occupaient les fonctions."

 pol_sejmiki_bureaucracy: "Sejmiki Ziemskie"
 pol_sejmiki_bureaucracy_desc: "From the late fourteenth century each ziemia held its own assembly of all enfranchised nobles. The sejmiki audited local taxes, elected envoys to the Sejm walny, and, crucially, bound their delegates by written instructions, the instrukcje poselskie. A deputy could not vote against his sejmik's mandate. The dietines made the szlachta a continuous political class, anchored in the localities long before the great Sejms of the sixteenth century gave them national voice."

 pol_akademia_krakowska_bureaucracy: "Académie de Cracovie"
 pol_akademia_krakowska_bureaucracy_desc: "Fondée par Kazimierz III en 1364 comme Studium Generale sur le modèle de Bologne, l'académie de Cracovie fut refondée en 1400 par la reine Jadwiga et son mari Ladislas II Jagellon avec une faculté de théologie complète dotée des joyaux de la reine. Ses maîtres fournissaient à la chancellerie royale des juristes compétents, formaient le clergé de la cathédrale et faisaient du droit canonique une profession active. Mikolaj Kopernik a étudié ici dans les années 1490 ; les chanceliers qui rédigeraient la Constitutio Nihil Novi aussi."

 pol_starostwa_bureaucracy: "Starostwa"
 pol_starostwa_bureaucracy_desc: "Les starostwa étaient des districts royaux administrés par un starosta nommé par le roi. Le starosta grodowy détenait le ius gladii (le droit de jugement capital) au sein de son starostwo, exécutant l'ordonnance du roi contre le sanctuaire des magnats. Le système de starosty était le couteau de la couronne contre l'immunité noble, et les grandes familles ne s'y sont jamais réconciliées : le privilège de Czerwinsk (1422) et les Statuts de Nieszawa (1454) étaient en partie des tentatives szlachta pour limiter ce que pouvait faire la starosty."

 pol_lanowy_cadastre_bureaucracy: "Cadastre Lan"
 pol_lanowy_cadastre_bureaucracy_desc: "Les géomètres de la Couronne mesuraient les exploitations paysannes en unités foncières standardisées (franques ou flamandes selon les régions) et les inscrivaient au cadastre royal. Une fois enregistrée, une exploitation était redevable du podatek lanowy régulier (un impôt fixe par lan) voté périodiquement par le Sejm. Le cadastre permettait à Kazimierz III et aux Jagellons de remplacer les prélèvements de guerre occasionnels par des revenus prévisibles, mais chaque enquête liait plus étroitement les paysans au sol sur lequel ils étaient mesurés, et les lois successives durcissaient cet enregistrement en attachement héréditaire."
