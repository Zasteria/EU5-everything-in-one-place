l_french:
 STATIC_MODIFIER_NAME_nd_crown_of_the_mezzogiorno: "Couronne du Mezzogiorno"
 STATIC_MODIFIER_DESC_nd_crown_of_the_mezzogiorno: "Le Royaume des Deux-Siciles est uni sous une seule couronne forte. De Naples à Palerme, l’autorité royale s’étend sans interruption, supprimant le factionnalisme baronnial et imposant une administration centralisée qui ramène l’ordre dans le sud agité. Le Mezzogiorno connaîtra une loi, un roi, un destin."
 STATIC_MODIFIER_NAME_nd_crossroads_of_the_mediterranean: "Carrefour de la Méditerranée"
 STATIC_MODIFIER_DESC_nd_crossroads_of_the_mediterranean: "Héritier des traditions normandes, grecques, arabes et latines, le Royaume des Deux-Siciles affirme son identité de grand lieu de rencontre des civilisations. Là où d’autres voient la division, nous voyons une opportunité : chez chaque marchand étranger qui accoste à Naples, chez chaque artisan qui exerce son métier à Palerme, chez chaque savant qui étudie dans nos académies."
 nd_tws.1.t: "Les Deux-Siciles unies"
 nd_tws.1.d: "At last, the ancient kingdoms of Naples and Sicily stand united under one crown. For centuries, the Mezzogiorno has been fought over by Normans, Hohenstaufen, Angevins, and Aragonese: each leaving their mark upon the land and its people. Now we must decide what this kingdom shall become.\n\nThe southern lands possess the richest farmland in Italy, the busiest ports in the Mediterranean, and a population shaped by every civilization that has touched these shores. But they also suffer from powerful barons who defy royal authority, from corsair raids that menace our coasts, and from the ancient rivalry between island and mainland.\n\nShall we forge a centralized kingdom under firm royal authority, breaking the power of the barons and building a modern state? Or shall we embrace our heritage as the crossroads of the Mediterranean, where Greek, Arab, Norman, and Latin traditions mingle to create something greater than any single culture could achieve?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tws.1.a: "Une couronne, une loi, un royaume."
 nd_tws.1.b: "Nous sommes le lieu de rencontre des civilisations."
 STATIC_MODIFIER_NAME_nd_tws_vespers_independence: "Esprit des Vêpres"
 STATIC_MODIFIER_DESC_nd_tws_vespers_independence: "Le souvenir des Vêpres siciliennes brûle : un peuple qui s’est soulevé contre l’oppression étrangère et a conquis sa liberté grâce à sa détermination."
 STATIC_MODIFIER_NAME_nd_tws_vespers_diplomacy: "Diplomatie des Vêpres"
 STATIC_MODIFIER_DESC_nd_tws_vespers_diplomacy: "Les Vêpres siciliennes ont démontré qu'une diplomatie intelligente et des alliances étrangères peuvent réaliser ce que la rébellion seule ne peut pas réaliser : l'île a assuré sa liberté en invitant la couronne d'Aragon à sa défense."
 nd_tws.2.t: "L'héritage des Vêpres"
 nd_tws.2.d: "On Easter Monday, 1282, the bells of the Church of the Holy Spirit outside Palermo rang for vespers. And the island erupted in revolt. Within six weeks, every Frenchman in Sicily was dead or fled. The Sicilian Vespers was more than a massacre: it was a declaration that the people of this land would not be ruled by foreigners who despised them.\n\nThe revolt's aftermath reshaped the Mediterranean. Charles of Anjou lost his island kingdom. Peter of Aragon gained a crown. And Sicily itself learned a hard lesson about the price of independence: that freedom won by blood must be defended by either strength or cunning.\n\nAs we study this legacy, what lesson shall we draw from it?"
 nd_tws.2.a: "La liberté est gagnée par ceux qui se battent pour elle."
 nd_tws.2.b: "Des alliances intelligentes survivent à toute rébellion."
 STATIC_MODIFIER_NAME_nd_tws_bourbon_enlightenment: "Lumières Bourbon"
 STATIC_MODIFIER_DESC_nd_tws_bourbon_enlightenment: "Les réformes progressistes des monarques Bourbon ont apporté au royaume une administration moderne, une éducation publique et une gouvernance rationnelle."
 STATIC_MODIFIER_NAME_nd_tws_bourbon_industry: "Programme Industriel Bourbon"
 STATIC_MODIFIER_DESC_nd_tws_bourbon_industry: "Le programme de la couronne en matière de manufactures royales et de développement des infrastructures transforme la capacité économique du royaume."
 nd_tws.3.t: "Les réformes Bourbon"
 nd_tws.3.d: "The Bourbon monarchs have embarked on an ambitious program of reform that would transform the kingdom. Ferdinand has established the Royal Colony of San Leucio, where silk workers enjoy benefits unheard of elsewhere in Europe: mandatory education for boys and girls alike, shorter working hours, running water in every home, and communal provision for the sick and elderly.\n\nBut the reforms extend far beyond a single colony. New legal codes drawn from Enlightenment principles aim to replace the patchwork of feudal, Norman, and Spanish law. Royal manufactories spring up to challenge the dominance of northern Italian and French industry. The question is whether to pursue the intellectual promise of these reforms (modernizing education, law, and governance) or to focus on their industrial potential, building the manufactories and infrastructure that could make the Mezzogiorno an economic power."
 nd_tws.3.a: "Éclairez l’esprit de notre peuple."
 nd_tws.3.b: "Construisez les ateliers du futur."
 nd_tws_norman_feudalism: "Cavalerie féodale normande"
 nd_tws_norman_feudalism_desc: "Les conquérants normands de l'Italie du Sud ont apporté avec eux les traditions militaires féodales du nord de la France : des chevaliers en armure qui formaient la cavalerie la plus redoutable du monde méditerranéen."
 nd_tws_masseria_system: "Système Masséria"
 nd_tws_masseria_system_desc: "Les grandes fermes fortifiées du Mezzogiorno, les masseries, constituent l'épine dorsale de la richesse agricole du sud de l'Italie : de vastes domaines produisant des céréales, des olives et du bétail qui nourrissent la Méditerranée."
 nd_tws_scuola_medica: "École Médicale Salerne"
 nd_tws_scuola_medica_desc: "L'École de Salerne est la plus ancienne école de médecine du monde occidental, où des médecins grecs, latins, arabes et juifs partagent leurs connaissances. Ses diplômés exercent la médecine dans toute l'Europe."
 nd_tws_coastal_torre_network: "Réseau de Torres Côtières"
 nd_tws_coastal_torre_network_desc: "Une chaîne de tours de guet le long des côtes de la Sicile et du sud de l’Italie fournit une alerte précoce contre les raids corsaires barbaresques et sert de réseau de défense coordonné."
 nd_tws_sicilian_vespers_legacy: "L'héritage des Vêpres siciliennes"
 nd_tws_sicilian_vespers_legacy_desc: "Le souvenir du soulèvement de 1282 contre la tyrannie angevine suscite une résistance farouche à la domination étrangère parmi les peuples des Deux-Siciles."
 nd_tws_mediterranean_granary: "Grenier Méditerranéen"
 nd_tws_mediterranean_granary_desc: "Southern Italy and Sicily have been the granary of the Mediterranean since Roman times, exporting vast quantities of wheat, olives, and other foodstuffs across the sea.\n\n#italic Available in: $nd_tws_masseria$#!"
 nd_tws_tercio_tradition: "Tercio de Naples"
 nd_tws_tercio_tradition_desc: "Sous l'influence espagnole, les royaumes de Naples et de Sicile adoptèrent le système du tercio : des formations d'infanterie disciplinées combinant pique et tir qui dominaient les champs de bataille européens."
 nd_tws_studium_naples: "Studium de Naples"
 nd_tws_studium_naples_desc: "Fondée par l'empereur Frédéric II en 1224, l'Université de Naples est la plus ancienne université d'État au monde : un défi délibéré pour les universités papales du Nord."
 nd_tws_mezzogiorno_commerce: "Commerce du Mezzogiorno"
 nd_tws_mezzogiorno_commerce_desc: "Les ports de Naples, Palerme et Messine traitent un vaste volume de commerce méditerranéen, reliant les richesses agricoles du sud aux marchés du monde connu."
 nd_tws_galeazza_tradition: "Galeazza Reale"
 nd_tws_galeazza_tradition_desc: "Les Deux-Siciles entretiennent une puissante flotte de galères de guerre spécialement conçues pour le combat méditerranéen : plus lourdes et mieux armées que les galères standards, capables de dominer les eaux contestées entre l'Italie et l'Afrique du Nord."
 nd_tws_baronial_suppression: "Suppression des barons"
 nd_tws_baronial_suppression_desc: "Les barons rebelles du Mezzogiorno qui ont sapé l'autorité royale pendant des siècles sont finalement mis au pas par des mesures juridiques et politiques systématiques."
 nd_tws_dogana_delle_pecore: "Dogana delle Pecore"
 nd_tws_dogana_delle_pecore_desc: "The royal sheep customs of Foggia, founded by Alfonso the Magnanimous in 1447, reserves the winter pastures of the Tavoliere for the flocks that come down the drove roads from the Abruzzi every autumn. Under the viceroys millions of sheep make the journey each year, and the fee on every head is among the largest revenues of the crown."
 nd_tws_san_leucio_silk: "Soierie de San Leucio"
 nd_tws_san_leucio_silk_desc: "La colonie royale de San Leucio, près de Caserta, représente une expérience révolutionnaire en matière de production industrielle : une manufacture de soie où les travailleurs bénéficient de conditions de travail progressistes, d'une éducation obligatoire et d'une aide sociale communale."
 nd_tws_real_marina: "Véritable marina"
 nd_tws_real_marina_desc: "La Marine royale des Deux-Siciles, la Real Marina, est agrandie et modernisée sous les Bourbons, mettant en service des frégates et des navires de ligne pour protéger le vaste littoral du royaume."
 nd_tws_bourbon_legal_reforms: "Réformes juridiques des Bourbons"
 nd_tws_bourbon_legal_reforms_desc: "Les monarques Bourbon remplacent la mosaïque de codes juridiques normands, angevins et espagnols par un système juridique moderne unifié inspiré des principes des Lumières."
 nd_tws_mezzogiorno_industry: "Industrie du Mezzogiorno"
 nd_tws_mezzogiorno_industry_desc: "Le développement industriel du sud de l’Italie, porté par les manufactures royales et les investissements dans les infrastructures, commence à remettre en question la domination traditionnelle des économies du nord de l’Italie."
 nd_tws_carbonari_legacy: "L'héritage des Carbonari"
 nd_tws_carbonari_legacy_desc: "Les sociétés secrètes des Carbonari, charbonniers, ont propagé les idéaux révolutionnaires de gouvernement constitutionnel et d’identité nationale dans tout le royaume, façonnant la conscience politique d’une génération."
 nd_tws_santa_fede: "Army of the Holy Faith"
 nd_tws_santa_fede_desc: "In February 1799 Cardinal Fabrizio Ruffo landed in Calabria with eight companions and no money. By June the peasant masses that gathered under his banner of the cross had marched the length of the kingdom and taken Naples back from the Parthenopean Republic."
 a_nd_tws_norman_cavaliere: "Norman Cavalière"
 a_nd_tws_norman_cavaliere_desc: "Chevaliers cuirassés dans la tradition normande, ces cavaliers lourds descendent des guerriers qui conquirent le sud de l'Italie et la Sicile au XIe siècle. Leur charge reste dévastatrice."
 a_nd_tws_tercio_napolitano: "Tercio Napolitain"
 a_nd_tws_tercio_napolitano_desc: "Infanterie disciplinée du tercio napolitain, combinant piquiers et arquebusiers dans la formidable formation espagnole qui a dominé la guerre européenne pendant plus d'un siècle."
 n_nd_tws_galeazza_reale: "Galeazza Reale"
 n_nd_tws_galeazza_reale_desc: "Une galère de guerre lourde de la flotte des Deux-Siciles, plus grande et plus lourdement armée que les galères méditerranéennes standards, conçue pour projeter sa puissance à travers les eaux contestées de la Méditerranée centrale."
 n_nd_tws_fregata_reale: "Frégate royale"
 n_nd_tws_fregata_reale_desc: "Une frégate à voile rapide de la Bourbon Royal Navy, plus légère qu'un navire de ligne mais suffisamment rapide pour patrouiller le vaste littoral du royaume et protéger sa flotte marchande."
 a_nd_tws_sanfedisti: "Sanfedisti"
 a_nd_tws_sanfedisti_desc: "Peasants and charcoal burners of Calabria and the lazzari of Naples, armed with whatever they own and marching under the cross. There are a great many of them and they do not lack fervour. They have never been drilled, and under volley fire it shows."
 nd_tws_torre_costiera: "Torre Costiera"
 nd_tws_torre_costiera_desc: "Une tour de guet côtière dans la tradition des torri costiere qui parsèment les rivages de la Sicile et du sud de l'Italie : elle fait partie d'un réseau de défense intégré qui utilise des signaux de feu et de fumée pour avertir de l'approche des raids corsaires."
 nd_tws_masseria: "Masseria"
 nd_tws_masseria_desc: "Un domaine agricole fortifié du Mezzogiorno, combinant des terres agricoles, des enclos à bétail et des murs défensifs en une unité économique autosuffisante qui alimente la Méditerranée depuis des siècles."
 nd_tws_reale_seteria: "Reale Setéria"
 nd_tws_reale_seteria_desc: "Une manufacture royale de soie dans la tradition de San Leucio, où des tisserands qualifiés produisent des étoffes de soie fine qui rivalisent avec les meilleurs ateliers de Lyon et de Florence."
 nd_tws_locazione: "Locazione della Dogana"
 nd_tws_locazione_desc: "A winter pasture of the Tavoliere, measured out and let by the royal sheep customs to the flock masters of the Abruzzi. The plough is forbidden on it, the flocks pay the crown by the head, and the wool is sold at the fair of Foggia."
 nd_tws_torre_garrison: "Garnison de Torre"
 nd_tws_torre_garrison_desc: "Une petite garnison maintient la tour de guet, gardant les armes prêtes et les feux de signalisation préparés contre les incursions corsaires."
 nd_tws_stubble_grazing: "Stubble Grazing"
 nd_tws_stubble_grazing_desc: "After the harvest the estate's own flock is turned onto the stubble. A few animals are raised for market each year."
 nd_tws_grain_export: "Masseria Husbandry"
 nd_tws_grain_export_desc: "The grain surplus of the masseria is fed to herds kept for breeding on the Apulian plain. Grain and breeding stock are consumed, and far more animals are sent to market."
 nd_tws_silk_weaving: "Tissage de la soie"
 nd_tws_silk_weaving_desc: "Les maîtres tisserands transforment la soie grège et les teintures précieuses en tissus fins d'une qualité exceptionnelle, poursuivant une tradition qui remonte à la capture normande des ouvriers de la soie byzantine."
 nd_tws_fida_flocks: "Transhumant Flocks"
 nd_tws_fida_flocks_desc: "Shepherds winter their flocks on the royal pasture, buy the crown's salt for them, and shear before the long walk back up the drove roads to the mountains."
 levy_nd_tws_norman_cavaliere: "Norman Cavaliere Levy"
 levy_nd_tws_norman_cavaliere_desc: "Cavalerie féodale issue des familles nobles normandes du Mezzogiorno, répondant à l'appel royal aux armes comme le faisaient leurs ancêtres depuis l'époque de Roger de Hauteville."
 levy_nd_tws_sanfedisti: "Sanfedisti Levy"
 levy_nd_tws_sanfedisti_desc: "The masses of the Army of the Holy Faith, raised from the peasants of the provinces and the poor of the capital."
 nd_tws_formed_tt: "Les Deux-Siciles ont été formées"
 nd_tws_path_a_tt: "Choisissez la couronne du Mezzogiorno"
 nd_tws_path_b_tt: "Choisissez Carrefour de la Méditerranée"
 nd_tws_destiny: "Destin des Deux-Siciles"
 nd_tws_destiny_desc: "Le Royaume des Deux-Siciles est forgé. Ses dirigeants doivent désormais se montrer dignes de la couronne en apportant la stabilité à ce royaume agité mais fertile."
 nd_tws_dest_crown_south: "Couronne du Sud"
 nd_tws_dest_crown_south_desc: "Comme les empereurs Hohenstaufen avant nous, nous étendrons notre autorité vers le nord. Rome, la Ville éternelle, doit reconnaître le pouvoir de la couronne méridionale. Prenez Rome et construisez une armée digne de nos ambitions."
 nd_tws_dest_peninsula: "Maître de la Péninsule"
 nd_tws_dest_peninsula_desc: "With Rome secured, the road to central Italy lies open. Florence, jewel of Tuscany, must fall under our dominion. Naples is to be built into a capital fit for the whole peninsula, and the army enlarged to match the great northern powers."
 nd_tws_dest_naples_developed_tt: "We own #bold Naples#! and its development is at least #bold 57#!"
 nd_tws_dest_rex_italiae: "Rex Italie"
 nd_tws_dest_rex_italiae_desc: "Le prix ultime : la domination sur toute l'Italie. Prenez Milan, siège de la Couronne de Fer, et Gênes, porte d'entrée de la Méditerranée occidentale. Ce n’est qu’à ce moment-là que les Deux-Siciles pourront revendiquer le titre de roi d’Italie."
 nd_tws_dest_mare_nostrum: "Mare Nostrum"
 nd_tws_dest_mare_nostrum_desc: "Les Normands de Sicile régnaient autrefois de Palerme à Tunis. Nous récupérerons cet héritage maritime. Prenez Tunis et faites de la soie la pierre angulaire de notre réseau commercial méditerranéen."
 nd_tws_dest_ionian_routes: "Routes commerciales ioniennes"
 nd_tws_dest_ionian_routes_desc: "Le contrôle de Corfou commande le passage entre l'Adriatique et la Méditerranée au sens large. Grâce à des institutions bancaires modernes et à des coffres débordants, nos marchands peuvent dominer les routes commerciales ioniennes."
 nd_tws_dest_emporium: "Magasin de la Méditerranée"
 nd_tws_dest_emporium_desc: "From Sardinia to Crete, from Naples to Tunis, our trading houses span the entire Mediterranean. This is the culmination of our maritime destiny: a commercial empire rivaling Venice and Genoa at their height. Messina, the port of the Strait and of the silk fair, is to be its great harbour."
 nd_tws_dest_messina_developed_tt: "We own #bold Messina#! and its development is at least #bold 48#!"
 nd_tws.4.t: "Le destin de deux royaumes"
 nd_tws.4.d: "The Two Sicilies stand united and stable. The ancient kingdoms of Naples and Sicily, once divided by the narrow Strait of Messina and the wider gulf of rival ambitions, now march together under one banner. The question before us is no longer whether we can survive, but what we shall become.\n\nThe Mezzogiorno is rich in grain, silk, and olive oil. Our ports command the central Mediterranean. Our people carry the blood and traditions of every civilization that has touched these shores. The foundations are laid. Now we must build upon them."
 nd_tws.4.a: "Notre destin nous attend."
 nd_tws.5.t: "La couronne du Sud revendique Rome"
 nd_tws.5.d: "Rome has fallen under our authority. For the first time since Frederick II wore both the imperial and Sicilian crowns, a southern Italian power holds the Eternal City. The Pope may protest, the northern states may tremble, but the message is clear: the Two Sicilies are no mere regional kingdom.\n\nOur soldiers have proven their worth, and our administrators are already extending royal law into the newly acquired territories. The north watches with growing unease."
 nd_tws.5.a: "Laissons Rome savoir qui dirige l’Italie maintenant."
 nd_tws.6.t: "La couronne de fer ou le Sénat"
 nd_tws.6.d: "Florence has submitted to the southern crown. The fertile lands of Tuscany, the workshops of the Arno valley, and the banking houses of the Medici's city now serve our kingdom. Central Italy is ours.\n\nBut as we push further north, we face a choice. Shall we march with the speed and force that carried the Normans from Hauteville to Palermo, emphasizing military mobility and the feudal levy that is our kingdom's martial backbone? Or shall we follow the Roman model, assimilating conquered peoples, developing their lands, and building a lasting empire through prosperity rather than the sword alone?"
 nd_tws.6.a: "Marchez vers le nord sous la Couronne de Fer."
 nd_tws.6.b: "Construisez comme les Romains."
 nd_tws.7.t: "Rex Italie"
 nd_tws.7.d: "Milano has fallen. Genoa has opened its gates. From the Alps to Sicily, from the Adriatic to the Tyrrhenian, Italy is united under the crown of the Two Sicilies. Not since the days of the Roman Empire has the peninsula known a single master, and we have achieved this from the south, from the very lands that others dismissed as a backward Mezzogiorno.\n\nFrederick II, the Stupor Mundi who amazed the world from his Sicilian court, would recognize what we have built. But how shall we consolidate this vast domain? Through the martial prestige that won it, standing as a great military power that none dare challenge? Or through investment in the land itself, making Italy the most productive and prosperous kingdom in Europe?"
 nd_tws.7.a: "Nous sommes le Stupor Mundi qui renaît."
 nd_tws.7.b: "Que le Mezzogiorno nourrisse toute l'Italie."
 nd_tws.8.t: "Les Normands retournent en Afrique"
 nd_tws.8.d: "Tunis is ours. Count Roger of Sicily first raided these coasts in the 11th century; now we hold them permanently. The granary of Rome, the gateway to the Saharan trade, and the key to controlling the narrow waist of the Mediterranean, all belong to the Two Sicilies.\n\nOur galleys patrol the waters between Sicily and Ifriqiya. Corsair raids against our coasts will become a memory. And with silk flowing through our markets, the commercial foundations of our maritime empire are firmly established."
 nd_tws.8.a: "La mer entre nos côtes est à nous."
 nd_tws.9.t: "Domination sur la mer Ionienne"
 nd_tws.9.d: "With Corfu in our hands, we command the strait that separates the Adriatic from the Ionian Sea. Every ship passing between Venice and the eastern Mediterranean must sail under the watchful eyes of our fortresses. Our banking institutions are the envy of the south, and our treasury overflows.\n\nShall we use this position to build naval supremacy, dominating the Adriatic and projecting power across the eastern Mediterranean, even at the cost of neglecting our land forces? Or shall we become the great intermediary, the silk road of the sea, where every trade route converges and every merchant finds profit?"
 nd_tws.9.a: "Commandez les mers par la force."
 nd_tws.9.b: "Laissez le commerce circuler dans nos ports."
 nd_tws.10.t: "Magasin de la Méditerranée"
 nd_tws.10.d: "From Sardinia to Crete, from the Strait of Messina to the shores of Ifriqiya, the Two Sicilies have built a commercial empire that spans the entire central and eastern Mediterranean. Our fondaci (the great merchant houses established in every major port) handle a volume of trade that rivals the golden age of Venice.\n\nThe question now is whether we press our advantage at sea, building an unchallengeable navy that secures these routes against all rivals, or consolidate our gains through financial institutions and diplomatic networks that make our merchants welcome in every port from Barcelona to Alexandria."
 nd_tws.10.a: "Notre flotte gouvernera ces eaux."
 nd_tws.10.b: "La richesse est le véritable pouvoir."
 STATIC_MODIFIER_NAME_nd_tws_dest_iron_crown: "Marche de la Couronne de Fer"
 STATIC_MODIFIER_DESC_nd_tws_dest_iron_crown: "Les armées du Sud marchent avec la rapidité et la détermination qui portaient autrefois les chevaliers normands de Calabre jusqu'aux portes de Rome. Nos levées se gonflent d'hommes désireux de servir la couronne d'Italie."
 STATIC_MODIFIER_NAME_nd_tws_dest_roman_legacy: "L'héritage des Césars"
 STATIC_MODIFIER_DESC_nd_tws_dest_roman_legacy: "Comme les Romains qui furent les premiers à unifier l’Italie, nous assimilons les peuples conquis dans notre royaume, développons leurs terres et construisons une prospérité qui transcende la conquête."
 STATIC_MODIFIER_NAME_nd_tws_dest_stupor_mundi: "Stupeur du monde"
 STATIC_MODIFIER_DESC_nd_tws_dest_stupor_mundi: "L'Émerveillement du monde (titre autrefois donné à Frédéric II) appartient désormais au royaume qu'il aimait le plus. Notre prestige militaire impose le respect dans toute l’Europe, même si notre marine souffre de négligence."
 STATIC_MODIFIER_NAME_nd_tws_dest_mezzogiorno_ascendant: "Ascendant Mezzogiorno"
 STATIC_MODIFIER_DESC_nd_tws_dest_mezzogiorno_ascendant: "Le sud se lève. Les investissements dans les matières premières, les infrastructures et la croissance démographique font du Mezzogiorno la région la plus pauvre d'Italie la plus productive."
 STATIC_MODIFIER_NAME_nd_tws_dest_adriatic_dominion: "Domination Adriatique"
 STATIC_MODIFIER_DESC_nd_tws_dest_adriatic_dominion: "Nos navires de guerre dominent les mers Adriatique et Ionienne. Chaque navire marchand naviguant dans ces eaux le fait avec notre permission, même si notre attachement à la puissance navale met à rude épreuve notre capacité à maintenir des forces terrestres."
 STATIC_MODIFIER_NAME_nd_tws_dest_silk_road_sea: "Route de la Soie de la Mer"
 STATIC_MODIFIER_DESC_nd_tws_dest_silk_road_sea: "Nos ports sont devenus le grand entrepôt de la Méditerranée, où la soie, les épices et les renseignements circulent librement. La richesse apporte du confort : peut-être trop de confort."
 STATIC_MODIFIER_NAME_nd_tws_dest_thalassocracy: "Thalassocratie sicilienne"
 STATIC_MODIFIER_DESC_nd_tws_dest_thalassocracy: "Les Deux-Siciles ont réalisé ce dont Venise et Gênes rêvaient : une véritable suprématie maritime à travers la Méditerranée centrale, avec la possibilité de projeter leur puissance vers des rivages lointains."
 STATIC_MODIFIER_NAME_nd_tws_dest_emporium_mundi: "Emporium Mundi"
 STATIC_MODIFIER_DESC_nd_tws_dest_emporium_mundi: "Le marché du monde. Nos banques offrent les meilleurs taux, nos relations diplomatiques ouvrent toutes les portes et notre gestion prudente des échanges commerciaux maintient l’inflation sous contrôle."
 nd_tws_reggia: "Reggia Reale"
 nd_tws_reggia_desc: "Un magnifique palais royal dans la tradition de la Reggia di Caserta - un siège du pouvoir centralisé à partir duquel le roi administre ses vastes domaines italiens, rivalisant avec Versailles en grandeur et en ambition."
 nd_tws_reggia_court: "Administration de la Cour royale"
 nd_tws_reggia_court_desc: "Une équipe de scribes, de courtisans et d'administrateurs maintient la bureaucratie élaborée du royaume italien centralisé depuis le palais royal."
 nd_tws_fondaco: "Fondaco des Mercanti"
 nd_tws_fondaco_desc: "Une grande maison de commerce dans la tradition des fondaci vénitiens - un entrepôt fortifié, une bourse et une douane combinés, servant de plaque tournante du commerce méditerranéen dans nos ports."
 nd_tws_fondaco_trade: "Bourse Méditerranéenne"
 nd_tws_fondaco_trade_desc: "Les commis gèrent les lettres de change, les douaniers traitent les marchandises et les courtiers négocient les accords entre les commerçants du monde méditerranéen."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_tws_bureaucracy_authority: "Cancelleria Royale"
 AUTO_MODIFIER_DESC_nd_tws_bureaucracy_authority: "From the Norman Magna Curia at Palermo to the Bourbon ministries at Naples, the kingdom's chancery has matured into a permanent administrative apparatus. The legal codes, fiscal courts, customs houses, parliaments and councils by which the realm is governed are kept as lasting offices. The Two Sicilies can sustain three more standing institutions."

 tws_constitutions_of_melfi_bureaucracy: "Constitutions de Melfi"
 tws_constitutions_of_melfi_bureaucracy_desc: "Promulgué par Frédéric II à Melfi le 1er septembre 1231, le Liber Augustalis était une codification complète de droit romain de l'administration du Regno - une réforme des assises d'Ariano de Roger II (1140) et des assises de Capoue de Frédéric (1220), rédigées avec Petrus de Vinea et les maîtres bolognais. Par ses 219 constitutions, Frédéric liait les grands feudataires aux cours royales, réglementait la monnaie et le commerce et affirmait l'imperator-rex au-dessus de toutes les autres autorités. Ernst Kantorowicz l'appelait « l'acte de naissance de l'État administratif moderne » ; elle resta le fondement du droit sicilien jusqu'aux codes napoléoniens."

 tws_camera_della_sommaria_bureaucracy: "Caméra de la Sommaire"
 tws_camera_della_sommaria_bureaucracy_desc: "Créée par Alphonse V d'Aragon à Naples en 1444 à partir de l'ancienne curia magistrorum rationalium, la Regia Camera della Sommaria était la cour financière suprême du royaume de Naples. Présidé par un luogotenente et composé de razionali (des juristes et des comptables issus en grande partie de la bourgeoisie juridique urbaine) il vérifiait les comptes royaux et municipaux, poursuivait les malversations fiscales et statuait sur les relevi baronnials (cotisations de succession). À partir de 1596, elle fut divisée en deux rotae traitant des litiges fiscaux civils et pénaux et resta le principal instrument de discipline fiscale du royaume jusqu'à son remplacement par la Corte dei Conti en 1807."

 tws_dogana_delle_pecore_bureaucracy: "Regia Dogana delle Pecore"
 tws_dogana_delle_pecore_bureaucracy_desc: "Créée à Lucera en 1447 par Alphonse V et transférée à Foggia en 1468, la Douane Royale des Moutons réglementait la grande transhumance saisonnière entre les hauts plateaux des Abruzzes et les pâturages d'hiver de la Tavoliere delle Puglie. Inspiré de la Mesta castillane, il facturait huit ducats fida pour cent moutons en échange des pâturages attribués, surveillait les tratturi contre la culture intrusive et produisait l'une des deux principales sources de revenus du royaume de Naples. Son monopole sur la Tavolière a gelé de vastes étendues comme pâturages d'hiver pendant des siècles ; Joseph Bonaparte l'abolit le 21 mai 1806."

 tws_caricatori_grain_monopoly_bureaucracy: "Caricatori del Regno"
 tws_caricatori_grain_monopoly_bureaucracy_desc: "Les ports royaux de chargement des céréales de Sicile (principalement Sciacca, Girgenti, Licata et Termini Imerese) où le blé des latifondi était stocké sous le sceau royal et expédié uniquement aux marchands détenant la tratte, les licences d'exportation vendues par la couronne. Le maestri portulani inspectait chaque chargement et les facteurs génois se disputaient le marché des licences pour avoir le droit d'expédier le surplus à Gênes, Naples, Rome et le Levant. Le système a soutenu l'âge d'or de la Sicile au XVIe siècle en tant que grenier de la Méditerranée et a donné à la couronne un levier fiscal qui dépendait, mais aussi contraignait, des domaines baronnials qui produisaient le grain."

 tws_sicilian_parliament_bureaucracy: "Parlement de Sicile"
 tws_sicilian_parliament_bureaucracy_desc: "Convoqué pour la première fois à Mazara par Roger Ier en 1097 et réuni à Palerme à partir de 1130 au Palais des Normands, le Parlamento di Sicilia est l'une des plus anciennes législatures d'Europe. Il se rassemblait en trois bracci : le bras féodal des comtes et des barons, le bras ecclésiastique des archevêques, abbés et archimandrites, et le bras démaniale des représentants des 42 villes royales. Sa fonction principale était de voter le donativo au roi en échange de la confirmation des privilèges et, pendant sept siècles, elle a limité la fiscalité royale par des habitudes de consultation qui ont survécu même à l'absolutisme espagnol. Abolie en 1812 avec la Constitution sicilienne d'inspiration britannique et finalement éteinte avec l'autonomie sicilienne en 1816."

 tws_consiglio_collaterale_bureaucracy: "Consiglio Collatéral"
 tws_consiglio_collaterale_bureaucracy_desc: "Créé sous les vice-rois espagnols de Naples pour accompagner (garantir) le vice-roi en matière de gouvernement, de justice et de finances, le Consiglio Collatérale comprenait cinq régents - des juristes typiquement espagnols et napolitains - qui traitaient les décrets et supervisaient les grandes cours du royaume. Sa section judiciaire, la Cancelleria, a été délibérément renforcée par les vice-rois pour comprimer l'ancien Sacro Regio Consiglio (la cour suprême de Naples aragonaise), déplaçant l'autorité de la magistrature autonome vers un conseil dont les membres servaient au gré de Madrid. C'est devenu le principal instrument par lequel les Habsbourg et plus tard les Bourbons ont attiré les togati - la bourgeoisie légale urbaine - vers l'administration centrale aux dépens des grandes maisons féodales."
