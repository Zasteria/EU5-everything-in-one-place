l_french:
 OYE: "Oyo"
 OYE_ADJ: "Oyo"
 OYE_f: "Empire Oyo"
 OYE_f_desc: "L'Empire d'Oyo était l'État yoruba le plus puissant et l'un des plus grands empires d'Afrique de l'Ouest, réputé pour son redoutable corps de cavalerie et son gouvernement constitutionnel sophistiqué équilibrant l'autorité d'Alaafin avec celle du conseil d'Oyo Mesi. Réunissant le cœur du pays yoruba sous la direction d'Oyo-Ile, cet empire dominait les routes commerciales entre les zones de forêt et de savane du XVe au début du XIXe siècle."
