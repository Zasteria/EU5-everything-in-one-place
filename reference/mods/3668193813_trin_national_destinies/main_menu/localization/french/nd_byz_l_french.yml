l_french:
 STATIC_MODIFIER_NAME_nd_byz_renovatio_imperii: "Rénovation Impériale"
 STATIC_MODIFIER_DESC_nd_byz_renovatio_imperii: "L'Empire romain a été restauré. En tant qu'héritiers d'Auguste et de Justinien, les Basileus revendiquent leur domination sur le monde civilisé par le biais du droit, de l'administration et de la puissance militaire."
 STATIC_MODIFIER_NAME_nd_byz_orthodox_ecumene: "L'écoumène orthodoxe"
 STATIC_MODIFIER_DESC_nd_byz_orthodox_ecumene: "Constantinople redevient le centre spirituel de la chrétienté. L'autorité du Patriarche œcuménique rayonne depuis Sainte-Sophie, attirant les fidèles dans les bras de l'Orthodoxie."
 STATIC_MODIFIER_NAME_nd_byz_hellenic_revival: "Le renouveau hellénique"
 STATIC_MODIFIER_DESC_nd_byz_hellenic_revival: "Les anciens dieux retournent dans leurs temples. Constantinople étant rendu non au Christ mais aux Olympiens, le Basileus fait revivre le culte impérial, les présages et les académies de l'Antiquité. Rome se tourne vers ses racines les plus anciennes."
 nd_byz.1.t: "La restauration de Byzance"
 nd_byz.1.d: "The eagles of Rome fly once more over Constantinople. The ancient capital, seat of emperors for a thousand years, has been reclaimed for Greek civilization and the Orthodox faith. The Hagia Sophia's dome catches the light of a new dawn.\n\nBut what shall this restored empire be? The legacy of Rome offers two visions. One looks to Justinian and the Caesars, a universal empire of law, discipline, and conquest, where the Basileus rules as God's chosen administrator of earthly affairs. The other looks to the Ecumenical Patriarch and the Desert Fathers, a sacred commonwealth where Orthodoxy unites the peoples, where monasteries preserve civilization, and where spiritual authority outshines any temporal crown.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_byz.1.d.hellenic: "The eagles of Rome fly once more over Constantinople. The ancient capital, seat of emperors for a thousand years, has been reclaimed for Greek civilization. But this is no Christian restoration: the old gods have returned to their temples, and the smoke of sacrifice rises again over the city of Constantine.\n\nWhat shall this restored empire be? The legacy of Rome offers two visions. One looks to Justinian and the Caesars, a universal empire of law, discipline, and conquest, where the Basileus rules as supreme administrator of earthly affairs. The other looks past even them, to the Olympians and the imperial cult of old, to the philosophers and oracles of antiquity, a reborn classical world where the gods themselves bless the reconquest of the Roman patrimony.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_byz.1.a: "Nous sommes Rome renaissante. Par la loi et l'épée, nous gouvernerons"
 nd_byz.1.b: "Nous sommes la lumière de l'Orthodoxie. La foi sera notre empire"
 nd_byz.1.c: "Les anciens dieux nous favorisent. Sous les Olympiens, Rome se lèvera"
 STATIC_MODIFIER_NAME_nd_byz_greek_fire_mastery: "Maîtrise du feu grec"
 STATIC_MODIFIER_DESC_nd_byz_greek_fire_mastery: "Le secret du feu liquide a été perfectionné. Nos galères sont équipées de siphons qui projettent des flammes inextinguibles à travers les vagues, transformant chaque engagement naval en incendie."
 nd_byz.2.t: "L'arme des empereurs"
 nd_byz.2.d: "The secret of Greek fire, the liquid flame that burns upon water, was perhaps the most closely guarded state secret in all of history. Invented by Kallinikos of Heliopolis in the 7th century, it was projected from bronze siphons mounted on the prows of dromons, turning Byzantine warships into floating flamethrowers.\n\nThe composition was known only to a handful of craftsmen whose families passed the formula down through generations. No enemy ever replicated it. The mere rumor that a Byzantine fleet carried siphons was often enough to prevent battle entirely. Arab, Russian, and Bulgar fleets all learned to fear the terrible cry of 'Loose the fire!' that preceded sheets of liquid flame racing across the sea."
 nd_byz.2.a: "La flamme de l'empire brûle éternellement"
 STATIC_MODIFIER_NAME_nd_byz_city_reclaimed: "La reine des villes restaurée"
 STATIC_MODIFIER_DESC_nd_byz_city_reclaimed: "Les murs de Constantinople résistent à nouveau. Les grandes citernes se remplissent d'eau douce, les aqueducs transportent la vie dans tous les quartiers et la ville reprend son ancien rôle de métropole la plus fortifiée du monde."
 STATIC_MODIFIER_NAME_nd_byz_new_golden_age: "Un nouvel âge d'or"
 STATIC_MODIFIER_DESC_nd_byz_new_golden_age: "Les marchés de Constantinople s'animent à nouveau du commerce des trois continents. Les marchands de Venise, de Gênes, d'Egypte et de Rus convergent vers la Corne d'Or, et les caisses de l'empire se gonflent des richesses du carrefour."
 nd_byz.3.t: "Constantinople restaurée"
 nd_byz.3.d: "For a thousand years, Constantinople was the greatest city in Christendom, perhaps in the world. Its triple walls defied every siege. Its underground cisterns, like the great Basilica Cistern with its 336 marble columns, held enough fresh water to sustain the population through months of blockade. Its position on the Bosphorus controlled the passage between Europe and Asia, between the Mediterranean and the Black Sea.\n\nNow the city is being rebuilt. Engineers restore the aqueducts of Valens, workers clear the debris from the great forums, and the markets of the Mese begin to fill once more with goods from distant lands. The question is whether to make Constantinople an impregnable fortress or an irresistible market."
 nd_byz.3.a: "Rendez les murs invincibles. Aucun ennemi ne passera"
 nd_byz.3.b: "Ouvrez les portes du commerce. Laisse l'or couler comme l'eau"
 STATIC_MODIFIER_NAME_nd_byz_justinianic_legacy: "L'héritage Justinien"
 STATIC_MODIFIER_DESC_nd_byz_justinianic_legacy: "La renaissance du codex juridique de Justinien a remis de l'ordre dans l'administration de l'empire. Les tribunaux suivent la loi écrite, les collecteurs d'impôts répondent aux magistrats et la machinerie de la gouvernance romaine tourne à nouveau."
 nd_byz.4.t: "La renaissance de la loi de Justinien"
 nd_byz.4.d: "The Corpus Juris Civilis, the Body of Civil Law, was Justinian's greatest monument, more enduring than the Hagia Sophia itself. Compiled between 529 and 534 by the jurist Tribonian and his team, it codified a thousand years of Roman legal thought into a coherent system that addressed marriage, property, inheritance, criminal law, and the rights of citizens.\n\nThough the original empire that produced this masterwork fell, its legal principles survived. They were studied in the universities of Bologna and Paris, and they shaped the civil law tradition of half of Europe. Now, a restored Byzantine state draws upon this heritage to build an administration that combines ancient Roman efficiency with the needs of a modern empire."
 nd_byz.4.a: "La justice est le fondement de l'empire"
 nd_byz_greek_fire: "Feu grec"
 nd_byz_greek_fire_desc: "Le secret du feu liquide qui brûle sur l'eau, projeté depuis les siphons de bronze des galères de guerre."
 nd_byz_thematic_administration: "Administration thématique"
 nd_byz_thematic_administration_desc: "Le système thématique divisait l'empire en districts militaro-administratifs où les soldats-agriculteurs défendaient les terres qu'ils cultivaient."
 nd_byz_pronoia_system: "Système Pronoia"
 nd_byz_pronoia_system_desc: "Octroi de terres aux officiers militaires en échange d'un service de cavalerie, la réponse byzantine au féodalisme occidental."
 nd_byz_silk_monopoly: "Monopole impérial de la soie"
 nd_byz_silk_monopoly_desc: "Des ateliers de soie contrôlés par l'État produisent les plus beaux textiles du monde, la pourpre tyrienne étant réservée au seul empereur."
 nd_byz_stradioti_tradition: "Tradition Stradioti"
 nd_byz_stradioti_tradition_desc: "La tradition des raiders de cavalerie légère grecque et albanaise, célèbres dans toute l'Europe pour leur vitesse et leur férocité."
 nd_byz_imperial_neoria: "Néoria impériale"
 nd_byz_imperial_neoria_desc: "Les grands chantiers navals de la Corne d'Or, où la flotte de dromons était construite et entretenue."
 nd_byz_cistern_engineering: "Ingénierie des citernes"
 nd_byz_cistern_engineering_desc: "L’art de construire de vastes réservoirs souterrains qui ont soutenu Constantinople malgré le siège et la sécheresse."
 nd_byz_book_of_the_eparch: "Livre de l'Éparque"
 nd_byz_book_of_the_eparch_desc: "Le manuel byzantin de réglementation du commerce régissant les guildes de Constantinople, des tisserands de soie aux parfumeurs."
 nd_byz_hippodrome_tradition: "Tradition de l'Hippodrome"
 nd_byz_hippodrome_tradition_desc: "L'hippodrome était le cœur politique de l'empire, où les factions de chars servaient de proto-partis et où les empereurs assuraient la légitimité populaire."
 nd_byz_justinianic_revival: "Le renouveau juridique justinianique"
 nd_byz_justinianic_revival_desc: "S'appuyer sur le Corpus Juris Civilis pour construire une administration centralisée efficace ancrée dans la tradition juridique romaine."
 nd_byz_phanariote_diplomacy: "Diplomatie phanariote"
 nd_byz_phanariote_diplomacy_desc: "Les Grecs phanariotes servaient d’administrateurs, d’interprètes et de diplomates à travers la Méditerranée orientale, maîtres de l’intrigue et de la négociation."
 nd_byz_neo_byzantine_enlightenment: "Lumières néo-byzantines"
 nd_byz_neo_byzantine_enlightenment_desc: "Une renaissance de l’apprentissage s’appuyant sur l’érudition classique et byzantine, transformant l’éducation et la gouvernance."
 nd_byz_imperial_naval_modernization: "Modernisation navale impériale"
 nd_byz_imperial_naval_modernization_desc: "La transition d'une guerre basée sur les galères à une flotte moderne, alliant tradition maritime ancienne et conception de navires contemporaine."
 n_nd_byz_dromon: "Dromon"
 n_nd_byz_dromon_desc: "Le dromon était l'épine dorsale de la marine byzantine, une galère de guerre rapide, propulsée par des rames, équipée d'un siphon en bronze pour projeter le feu grégeois. Son équipage de rameurs et de marines en faisait un instrument polyvalent de puissance navale dans les eaux confinées de la mer Égée et des détroits."
 a_nd_byz_stradioti: "Stradioti"
 a_nd_byz_stradioti_desc: "Cavalerie légère recrutée dans les frontières albanaises et grecques, les Stradioti étaient des pillards et des éclaireurs rapides dont les charges armées de javelots pouvaient briser un flanc exposé. Ils ont servi comme mercenaires dans toute l’Europe, engagés par Venise, la France et l’Espagne."
 n_nd_byz_fire_dromon: "Drimon de Feu Impérial"
 n_nd_byz_fire_dromon_desc: "Le sommet de la conception navale byzantine, un dromon lourd avec une coque renforcée et un système avancé de siphon à feu grec. Ces navires de guerre contrôlaient les eaux étroites du Bosphore et des Dardanelles, leur feu liquide les rendant presque imparables en combat rapproché."
 a_nd_byz_pronoiarioi: "Pronoiarioi"
 a_nd_byz_pronoiarioi_desc: "Cavalrymen who hold a pronoia, the revenue of a district granted for as long as they serve. They ride in mail and lamellar with lance and bow, lighter than a Western knight and steadier under orders."
 n_nd_byz_pyrpolikon: "Pyrpolikon"
 n_nd_byz_pyrpolikon_desc: "A fireship: a small fast brig packed with pitch and powder, sailed alongside an enemy ship of the line and set alight. The islanders who crew it are the last heirs of Greek fire."
 nd_byz_imperial_cistern: "Citerne Impériale"
 nd_byz_imperial_cistern_desc: "Un vaste réservoir souterrain inspiré de la légendaire Citerne Basilique de Constantinople, avec des centaines de colonnes de marbre soutenant un plafond voûté au-dessus de millions de gallons d'eau douce."
 nd_byz_silk_ergasterion: "Ergasterion en soie"
 nd_byz_silk_ergasterion_desc: "Un atelier de soie impérial où la soie grège est filée, teinte avec des pigments précieux et tissée pour former les plus beaux textiles du monde. La soie violette du Basileus est produite ici."
 nd_byz_hippodrome: "Hippodrome Impérial"
 nd_byz_hippodrome_desc: "Une arène monumentale pour les courses de chars et les cérémonies publiques. L'hippodrome était le cœur politique de l'empire, où les factions s'affrontaient et où les empereurs étaient acclamés."
 nd_byz_neorion: "Néorion byzantin"
 nd_byz_neorion_desc: "Un chantier naval impérial sur le modèle des arsenaux de la Corne d'Or de Constantinople, où les dromons sont construits, réparés et équipés de leurs siphons mortels de feu liquide."
 nd_byz_cistern_maintenance: "Entretien des citernes"
 nd_byz_cistern_maintenance_desc: "Entretenir la maçonnerie, les raccordements d'aqueduc et les systèmes de filtration des réservoirs d'eau souterrains."
 nd_byz_silk_weaving: "Tissage de la soie impériale"
 nd_byz_silk_weaving_desc: "Transformation de la soie grège et des teintures exotiques pour en faire les plus beaux textiles de la chrétienté."
 nd_byz_hippodrome_upkeep: "Opérations de l'hippodrome"
 nd_byz_hippodrome_upkeep_desc: "Entretenir les attelages de chars, les revêtements des pistes et les pierres monumentales de l'arène impériale."
 nd_byz_neorion_operations: "Opérations du chantier naval"
 nd_byz_neorion_operations_desc: "Fourniture de bois, de poix, de clous et de provisions navales pour la construction et la réparation de la flotte de dromons."
 levy_nd_byz_stradioti: "Prélèvement Stradioti"
 levy_nd_byz_stradioti_desc: "Cavalerie légère levée dans les frontières grecques et albanaises, servant de pillards et d'éclaireurs rapides dans la tradition des mercenaires Stradioti."
 levy_nd_byz_pronoiarioi: "Pronoiarioi Levy"
 levy_nd_byz_pronoiarioi_desc: "The holders of pronoia grants, called to the cavalry service their revenues are assigned for."
 levy_nd_byz_dromon: "Prélèvement de Dromon"
 levy_nd_byz_dromon_desc: "Galères de guerre à rames levées dans les provinces côtières, dirigées par des marins expérimentés dans l'ancienne tradition maritime de la marine byzantine."
 nd_byz_formed_tt: "Byzance est formée"
 nd_byz_path_a_tt: "Élu héritier de Rome"
 nd_byz_path_b_tt: "Choisissez la Lumière de l’Orthodoxie"
 nd_byz_path_c_tt: "Choisissez la Renaissance hellénique"
 nd_byz_dest_thessaloniki_developed_tt: "We own #bold Thessaloniki#! and its development is at least #bold 37#!"
 nd_byz_dest_constantinople_developed_tt: "We own #bold Constantinople#! and its development is at least #bold 62#!"
 nd_byz_dest_athens_developed_tt: "We own #bold Athens#! and its development is at least #bold 44#!"
 nd_byz_destiny: "Destin de Byzance"
 nd_byz_destiny_desc: "L'empire a été restauré. Il lui faut maintenant se montrer digne du nom de Rome."
 nd_byz_dest_exarchate: "Récupérer l'Exarchat"
 nd_byz_dest_exarchate_desc: "L'Exarchat de Ravenne fut pendant des siècles le point d'ancrage occidental de Byzance. Prenez Ravenne et Bari pour rétablir l'autorité impériale en Italie."
 nd_byz_dest_africa: "Reconquête Africaine"
 nd_byz_dest_africa_desc: "La reconquête de l'Afrique du Nord par Justinien sur les Vandales fut l'un de ses plus grands triomphes. Suivez ses traces en prenant Tunis et Tripoli."
 nd_byz_dest_renovatio: "Rénovation Impériale"
 nd_byz_dest_renovatio_desc: "La restauration complète de l'Empire romain : Rome, Antioche, Alexandrie. Trois des cinq anciennes pentarchies réunies sous un seul aigle. C’est la pierre angulaire ultime de l’héritier de Rome."
 nd_byz_dest_ecumene: "Le Siège œcuménique"
 nd_byz_dest_ecumene_desc: "Ohrid, the archbishopric that Basil II set over the Bulgarian lands, and Jerusalem, the holiest city in Christendom. Secure these sacred seats to establish the spiritual authority of the Orthodox Ecumene."
 nd_byz_dest_commonwealth: "Le Commonwealth orthodoxe"
 nd_byz_dest_commonwealth_desc: "Build a thriving economic and cultural commonwealth. Embrace banking, dominate the silk trade in your capital market, and let Thessaloniki, the second city, grow rich again on the fair of Saint Demetrius, where the merchants of the Slavic lands gather."
 nd_byz_dest_new_rome: "La nouvelle Rome"
 nd_byz_dest_new_rome_desc: "Constantinople becomes the New Rome in truth, the cultural, spiritual, and intellectual capital of the world. Embrace the printing press, fill the empty quarters within the Theodosian walls until the City is twice what it was, and prove that Byzantium's light outshines all rivals."
 nd_byz_dest_temples: "Les temples rouverts"
 nd_byz_dest_temples_desc: "Une fois les anciens dieux restaurés, leurs autels doivent se relever. Reconsacrez les temples d'Athènes, berceau de la foi olympienne, et laissez la fumée du sacrifice et la voix des oracles guider l'empire renaissant."
 nd_byz_dest_academy: "L'Académie restaurée"
 nd_byz_dest_academy_desc: "The wisdom of antiquity returns. Reopen Plato's Academy at Athens and the great schools of Ionia at Smyrna, embrace the Renaissance, and let Athens grow from a ducal town into a city of scholars, so that philosophy, mathematics, and the classical sciences flourish once more."
 nd_byz_dest_apotheosis: "Apothéose"
 nd_byz_dest_apotheosis_desc: "The classical world is whole again. With Athens and the sanctuary of Olympia held, the Basileus is acclaimed among the gods, the Olympic games unite the empire, and the civilization of antiquity stands reborn in eternal glory. The capstone of the Hellenic Renaissance."
 nd_byz_pantheon: "Le Panthéon restauré"
 nd_byz_pantheon_desc: "Un grand temple dédié aux Douze Olympiens, dont les autels sont entretenus par le sacerdoce ressuscité. De là, la vieille foi se propage à nouveau et la culture classique de l’empire rayonne vers l’extérieur."
 nd_byz_pantheon_maintenance: "Entretien du Panthéon"
 nd_byz_pantheon_maintenance_desc: "Soutenir les rites et le sacerdoce du temple avec de l'encens, des libations de vin et d'huile et des animaux sacrificiels."
 nd_byz.5.t: "Le destin de Byzance"
 nd_byz.5.d: "L’empire restauré se situe à la croisée des chemins de l’histoire. Les murs de Constantinople ont été reconstruits, Sainte-Sophie résonne à nouveau de la liturgie orthodoxe et l'étendard de l'aigle flotte au-dessus du Bosphore. Mais la restauration n’est qu’un début. L’empire qui s’étendait autrefois de l’Espagne à la Mésopotamie ne peut se contenter de ce qu’il détient. Quelle direction prendra le destin de Byzance ?"
 nd_byz.5.a: "Notre destin attend"
 nd_byz.6.t: "L'Exarchat récupéré"
 nd_byz.6.d: "The Exarchate of Ravenna was established in 584 as Byzantium's administrative center in Italy, governing the remnants of Justinian's reconquest. For nearly two centuries it held the line against Lombards and Franks, preserving Roman civilization in the West. Its loss in 751 to the Lombards marked the end of Byzantine authority in central Italy.\n\nNow Ravenna and Bari fly the imperial standard once more. The mosaics of San Vitale, depicting Justinian and Theodora in all their imperial glory, look down upon Byzantine soldiers for the first time in centuries."
 nd_byz.6.a: "L'Italie se souvient de ses maîtres romains"
 nd_byz.7.t: "L'Afrique reconquise"
 nd_byz.7.d: "In 533, Belisarius landed in Africa with just 15,000 men and, in a campaign of astonishing brilliance, destroyed the Vandal kingdom in a matter of months. The African provinces became Rome's breadbasket once more, their grain feeding Constantinople for another century.\n\nNow history repeats itself. Byzantine banners fly over Carthage's ruins and Tripoli's harbor. The question is how to use this reconquest, as a military springboard for further expansion, or as an agricultural heartland to feed the empire's growing population."
 nd_byz.7.a: "Levez des légions africaines pour les campagnes à venir"
 nd_byz.7.b: "Laissons l’Afrique nourrir l’empire comme elle nourrissait Rome"
 nd_byz.8.t: "Rénovation Impériale"
 nd_byz.8.d: "Rome. Antioch. Alexandria. Three of the five great patriarchates of ancient Christendom now answer to Constantinople. The Mediterranean is once more a Roman lake. This is the achievement that Justinian dreamed of, that Heraclius fought for, that the Palaiologoi mourned as forever lost.\n\nThe Renovatio Imperii, the Renewal of the Empire, is complete. But every great empire must choose how to sustain its greatness. Will the restored Rome bring peace and order to its subjects through law and administration? Or will it maintain its dominion through the invincible legions that won this empire?"
 nd_byz.8.a: "Laissons le droit romain mettre de l'ordre dans le monde"
 nd_byz.8.b: "Les légions sont éternelles. Ils sont l'empire"
 nd_byz.9.t: "Le Siège œcuménique"
 nd_byz.9.d: "Ohrid, seat of the archbishops whom Basil II set over the Bulgarian lands, and Jerusalem, the holiest site in Christendom, both acknowledge the authority of the Ecumenical Patriarch. The spiritual geography of Orthodoxy now radiates from Constantinople in all directions, west to the Balkans, south to the Holy Land, north to the Slavic world.\n\nMonasteries flourish, pilgrim routes multiply, and the Orthodox faithful look to the New Rome as their spiritual center. The foundation of a sacred commonwealth has been laid."
 nd_byz.9.a: "Les fidèles se rassemblent sous l'aile du Patriarche"
 nd_byz.10.t: "Le Commonwealth orthodoxe"
 nd_byz.10.d: "The empire's markets overflow with silk, spice, and the products of three continents. At Thessaloniki the fair of Saint Demetrius is crowded again with merchants from the Slavic lands. The banking institutions that once enriched Venice and Genoa now serve Byzantine commerce. The old Silk Road routes that made Constantinople the wealthiest city in the medieval world have been restored, and the capital's market dominates the eastern Mediterranean.\n\nThis prosperity can be directed in different ways. The wealth of trade can spread Byzantine culture across the known world, or the monasteries can use this golden age to advance Orthodox learning and scholarship."
 nd_byz.10.a: "Laissez notre culture suivre notre métier"
 nd_byz.10.b: "Les monastères seront des phares d'apprentissage"
 nd_byz.11.t: "La nouvelle Rome"
 nd_byz.11.d: "Constantinople is no longer merely the capital of a restored empire; it is the intellectual and spiritual center of the world. The Patriarchal Academy produces scholars and theologians who rival the best of any university in Europe. The printing press spreads Orthodox texts and Greek philosophy across the continent. Byzantine art, architecture, and thought set the standard for civilization itself.\n\nThis is the New Rome that the founders of Constantinople dreamed of, not merely a political capital, but a beacon of civilization. The question is whether to emphasize its role as the sacred center of Orthodoxy, or as the commercial crossroads of the known world."
 nd_byz.11.a: "L'orthodoxie illuminera le monde"
 nd_byz.11.b: "Constantinople est le carrefour des mondes"
 nd_byz.12.t: "Les temples rouverts"
 nd_byz.12.d: "Les dieux de l'Olympe retournent à leurs autels. Partout dans l’empire, les temples restés silencieux pendant mille ans résonnent à nouveau des hymnes et de la fumée du sacrifice. Les oracles parlent, les présages se lisent, et la foi antique de la Grèce et de Rome renaît sous le Basileus qui ose la restaurer."
 nd_byz.12.a: "Les dieux sont rentrés à la maison"
 nd_byz.13.t: "L'Académie restaurée"
 nd_byz.13.d: "La sagesse de l’Antiquité refleurit. A Athènes, l'Académie de Platon rouvre ses portes ; en Ionie, les écoles de Smyrne attirent des érudits du monde entier. Mais le renouveau classique peut prendre deux formes : les sciences naturelles rigoureuses du Lycée d'Aristote, ou la philosophie, la rhétorique et l'art de la Stoa peinte."
 nd_byz.13.a: "Le Lycée : laisser la raison et la science diriger"
 nd_byz.13.b: "La Stoa : que la philosophie et l'art ornent l'empire"
 nd_byz.14.t: "Apothéose"
 nd_byz.14.d: "Le monde classique est à nouveau entier et le Basileus est acclamé non seulement comme empereur mais comme dieu vivant, héritier d'Auguste et d'Alexandre. L’âge d’or de l’Antiquité renaît. L’empire sera-t-il lié par le culte divin impérial, ou par les Jeux olympiques rétablis qui attirent tous les Grecs dans une seule fête sacrée ?"
 nd_byz.14.a: "Laissons le Culte Impérial sanctifier notre règne"
 nd_byz.14.b: "Que l'Olympiade éternelle unisse les Hellènes"
 STATIC_MODIFIER_NAME_nd_byz_dest_african_legions: "Légions africaines"
 STATIC_MODIFIER_DESC_nd_byz_dest_african_legions: "Les provinces africaines reconquises fournissent de nouvelles recrues à l'armée impériale, levant de nouvelles légions dans la tradition de la campagne africaine de Bélisaire."
 STATIC_MODIFIER_NAME_nd_byz_dest_african_granary: "Grenier Africain"
 STATIC_MODIFIER_DESC_nd_byz_dest_african_granary: "Les plaines fertiles d'Afrique reprennent leur ancien rôle de grenier de l'empire, leurs récoltes alimentant Constantinople et alimentant la croissance."
 STATIC_MODIFIER_NAME_nd_byz_dest_pax_romana: "Pax Romana"
 STATIC_MODIFIER_DESC_nd_byz_dest_pax_romana: "Le droit et l'administration romaine apportent la paix et l'ordre dans les vastes domaines de l'empire restauré, réduisant les troubles et liant les sujets par la justice plutôt que par la force."
 STATIC_MODIFIER_NAME_nd_byz_dest_eternal_legions: "Légions éternelles"
 STATIC_MODIFIER_DESC_nd_byz_dest_eternal_legions: "Les légions qui ont conquis trois continents restent l’épine dorsale du pouvoir impérial, leur discipline et leur rapidité étant inégalées par aucune armée rivale."
 STATIC_MODIFIER_NAME_nd_byz_dest_silk_road_restored: "La Route de la Soie restaurée"
 STATIC_MODIFIER_DESC_nd_byz_dest_silk_road_restored: "Les anciennes routes commerciales qui ont rendu Constantinople riche au-delà de toute mesure circulent à nouveau, diffusant la culture et la richesse byzantines à travers le monde connu."
 STATIC_MODIFIER_NAME_nd_byz_dest_monastic_learning: "Apprentissage monastique"
 STATIC_MODIFIER_DESC_nd_byz_dest_monastic_learning: "Les grands monastères de l'Athos, du Sinaï et du Studion deviennent des centres d'érudition, préservant et faisant progresser les connaissances dans la tradition orthodoxe."
 STATIC_MODIFIER_NAME_nd_byz_dest_beacon_of_faith: "Phare de la foi"
 STATIC_MODIFIER_DESC_nd_byz_dest_beacon_of_faith: "L'orthodoxie rayonne de Constantinople comme un phare spirituel, son autorité morale attirant les fidèles et imposant les païens."
 STATIC_MODIFIER_NAME_nd_byz_dest_crossroads_of_worlds: "Carrefour des mondes"
 STATIC_MODIFIER_DESC_nd_byz_dest_crossroads_of_worlds: "Constantinople est à la jonction de l'Europe et de l'Asie, ses ports et ses marchés reliant le commerce du monde entier."
 STATIC_MODIFIER_NAME_nd_byz_dest_lyceum: "Le Lycée"
 STATIC_MODIFIER_DESC_nd_byz_dest_lyceum: "L'école de philosophie naturelle d'Aristote renaît : les sciences, la médecine et l'ingénierie de l'Antiquité sont le moteur de l'avancement de l'empire et de ses grandes œuvres."
 STATIC_MODIFIER_NAME_nd_byz_dest_painted_stoa: "La Stoa peinte"
 STATIC_MODIFIER_DESC_nd_byz_dest_painted_stoa: "Le porche où Zénon enseignait : la philosophie, la rhétorique et les arts fleurissent, et le prestige culturel de la Grèce rayonne à travers la diplomatie de l'empire."
 STATIC_MODIFIER_NAME_nd_byz_dest_imperial_cult: "Le culte impérial"
 STATIC_MODIFIER_DESC_nd_byz_dest_imperial_cult: "Le Basileus est vénéré comme un dieu vivant. L’âge d’or de l’empereur divin remplit le trésor et élève des monuments à travers le monde classique renaissant."
 STATIC_MODIFIER_NAME_nd_byz_dest_eternal_olympiad: "L'Olympiade éternelle"
 STATIC_MODIFIER_DESC_nd_byz_dest_eternal_olympiad: "The sacred games of Olympia are restored, drawing all Greeks into one festival of the gods. The priesthoods are content, the provinces are quiet, and people come from afar to settle where the games are held."
 nd_byz_imperial_triumph: "Triomphe Impérial"
 nd_byz_imperial_triumph_desc: "Un complexe triomphal monumental célébrant la restauration de Rome, alliant la grandeur des anciens forums impériaux à l'efficacité administrative byzantine."
 nd_byz_patriarchal_academy: "Académie patriarcale"
 nd_byz_patriarchal_academy_desc: "Centre d'apprentissage théologique et philosophique orthodoxe, héritier de l'ancien Pandidakterion, produisant des érudits, des scribes et des diplomates."
 nd_byz_triumph_maintenance: "Entretien Triomphe"
 nd_byz_triumph_maintenance_desc: "Entretenir les façades en marbre, les inscriptions, les mosaïques et les bureaux administratifs du complexe triomphal impérial."
 nd_byz_academy_maintenance: "Entretien de l'Académie"
 nd_byz_academy_maintenance_desc: "Fournir aux scribes, aux enseignants et aux services liturgiques de l'Académie patriarcale du papier, des livres, des bougies et des vêtements."

 # ===== Bureaucracy authority (auto-modifier) =====
 AUTO_MODIFIER_NAME_nd_byz_bureaucracy_authority: "Autorité bureaucratique impériale"
 AUTO_MODIFIER_DESC_nd_byz_bureaucracy_authority: "L’État byzantin restauré ouvre une place bureaucratique permanente supplémentaire, complétant la logothésie médiévale héritée du premier empire. Honore la règle du jeu bureaucratique de National Destinies."

 # ===== Bureaucracies =====
 byz_synodos_endemousa_bureaucracy: "Synode Endémousa"
 byz_synodos_endemousa_bureaucracy_desc: "The endemousa synodos was the permanent council of bishops resident at Constantinople, presided over by the Ecumenical Patriarch. Functioning continuously from the early Byzantine centuries through 1453, the standing synod ruled on canon law, dogma, marriages of the great families, and questions affecting the whole Orthodox world from the Balkans to Antioch. Its decisions bound the eastern Church and gave the Patriarchate corporate authority outside the throne, a parallel legitimacy the basileus could lean on, but never wholly command."

 byz_genikon_logothesion_bureaucracy: "Logothésion Genikon"
 byz_genikon_logothesion_bureaucracy_desc: "Le genikon, le Trésor général, était le bureau fiscal central de l'État moyen-byzantin à partir du VIIe siècle, dirigé par le logothète tou genikou. Ses chartoularioi tenaient les registres fiscaux à Constantinople; ses époptai auditaient les thèmes; son tribunal entendait des affaires fiscales. Là où la Basilika codifiait la loi et l’Allelengyon prélevait une charge collective, le genikon était le moteur d’audit lui-même : le bureau qui traquait les arriérés, récupérait les exemptions et supprimait les fictions des magnats des cadastres."

 byz_mesazon_bureaucracy: "Bureau du Mesazon"
 byz_mesazon_bureaucracy_desc: "Le mesazon (littéralement « l'intermédiaire ») est apparu officiellement comme un bureau d'État au sein de l'empire de Nicée et a été hérité par l'empire paléologue restauré, où des personnalités comme Demetrios Kydones et le dernier mesazon Loukas Notaras ont coordonné la politique jour et nuit pour le basileus. Technocrate unique de confiance entre le trône et le reste de l'administration, le mesazon a centralisé d'une manière que la titulature sénatoriale chargée de dignité n'aurait jamais pu centraliser - et a suscité le ressentiment des grandes maisons dont il contournait la préséance."

 byz_eparchate_bureaucracy: "Éparcat de Constantinople"
 byz_eparchate_bureaucracy_desc: "L'Éparque de Constantinople était appelée « père de la ville » et se classait juste au-dessous de l'empereur lui-même. En tant que juge suprême de la capitale, maître de ses guildes (dont Léon VI a codifié les règles dans le Livre de l'Éparque) et surveillant de l'approvisionnement en céréales, de la surveillance des incendies et de la discipline des rues, le préfet veillait à l'alimentation et à l'ordre de la plus grande ville du monde. Les dynatoi en voulaient à un officier dont l'autorité à l'intérieur des murs dépassait la leur ; le peuple faisait appel à lui chaque fois que le pain ou la justice manquaient."

 byz_mystikos_chancery_bureaucracy: "Mystikos et l'Asecretis"
 byz_mystikos_chancery_bureaucracy_desc: "The mystikos ('the secret one') served as the basileus's private secretary from the ninth century, controlling the imperial seal alongside the keeper of the inkstand and supervising the asecretis, the inner-cabinet scribes. Under Manuel I Komnenos the office grew to command the palace and the privy purse. A discreet apparatus parallel to the public chancery, the mystikos handled sensitive correspondence, internal investigations, and the throne's own intelligence, to the unease of the patriarch, whose ecclesiastical jurisdiction it could quietly skirt."
