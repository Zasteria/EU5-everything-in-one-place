l_french:
 STATIC_MODIFIER_NAME_nd_confederation_of_the_sword: "Confédération de l'Épée"
 STATIC_MODIFIER_DESC_nd_confederation_of_the_sword: "Les Shan Mong unis se sont ralliés derrière une seule bannière de guerre. Des hauts plateaux jusqu'à la vallée de l'Irrawaddy, les Sawb marchaient comme un seul homme, leur cavalerie traversant les cols comme le faisaient leurs ancêtres lorsqu'ils brisèrent les royaumes de Sagaing et de Pinya."
 STATIC_MODIFIER_NAME_nd_crossroads_of_the_plateau: "Carrefour du Plateau"
 STATIC_MODIFIER_DESC_nd_crossroads_of_the_plateau: "Les hauts plateaux Shan se situent au point de rencontre des civilisations. Les caravanes du Yunnan transportent du thé et de la soie vers le sud, tandis que les commerçants siamois apportent des marchandises de la côte. Les sawbwas président un réseau commercial florissant qui enrichit tout ce qu'il touche."
 STATIC_MODIFIER_NAME_nd_heirs_of_mong_mao: "Héritiers de Mong Mao"
 STATIC_MODIFIER_DESC_nd_heirs_of_mong_mao: "L’esprit martial de l’ancienne confédération Tai perdure. La cavalerie Shan chevauche avec le souvenir des conquêtes de Mong Mao brûlant dans le cœur."
 STATIC_MODIFIER_NAME_nd_council_of_sawbwas: "Conseil des Sawbwas"
 STATIC_MODIFIER_DESC_nd_council_of_sawbwas: "Plutôt que de gouverner par la seule force, les princes Shan ont choisi de gouverner par consensus. Le conseil des sawbwas délibère sur les questions d'État, équilibrant les ambitions de chaque mong pour le bien de tous."
 STATIC_MODIFIER_NAME_nd_caravan_prosperity: "La prospérité des caravanes"
 STATIC_MODIFIER_DESC_nd_caravan_prosperity: "Les routes commerciales passant par Kengtung bourdonnent d'activité. Huit mille mulets chargés de marchandises chinoises y transitent chaque année, et les villes Shan le long de la route s'enrichissent du commerce."
 nd_sha.1.t: "Les États Shan États-Unis"
 nd_sha.1.d: "The highland principalities of the Shan have at last come together under a single banner. For centuries, the sawbwas, the princes of the mong, have ruled their domains independently, sometimes warring among themselves, sometimes uniting against outside threats. Now, from the misty valleys of Kengtung to the fortress-towns of Hsenwi, the Shan people stand as one.\n\nBut unity is only the beginning. The question that echoes through every sawbwa's court is this: what shall the united Shan States become? A military confederation that dominates the highlands through strength of arms, as Mong Mao once did when it shattered the kingdoms of the Irrawaddy? Or a great crossroads of trade, leveraging the Shan Plateau's position between China and Siam to build wealth and influence that no army could match?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_sha.1.a: "Nous sommes les héritiers de Mong Mao. Que nos ennemis tremblent."
 nd_sha.1.b: "Notre plateau relie les empires. Que le commerce soit notre force."
 nd_sha.2.t: "La Confédération se lève"
 nd_sha.2.d: "The spirit of the great Shan confederation stirs once more. It was in 1527 that Sawlon, scion of Mong Mao's royal line, led a coalition of Shan mong against the weakened kingdom of Ava. The bickering Burmese court, riven by internal rivalries, could not withstand the united highland cavalry. Ava fell, and for nearly three decades the Shan confederation ruled Upper Burma from the very throne of their former overlords.\n\nNow the Shan confederation faces a choice that echoes through the centuries. Shall we honor the military traditions that carried our ancestors to Ava's gates, maintaining the cavalry hosts and warrior culture that made the Shan feared across the Irrawaddy valley? Or shall we build upon the political wisdom of the sawbwa council system, governing through consensus and diplomacy as our ancestors did in their mountain domains?"
 nd_sha.2.a: "Affûtez le dha et sellez les chevaux. Nous roulons comme nos ancêtres."
 nd_sha.2.b: "Le conseil des sawbwas délibère. La force vient de l’unité."
 nd_sha.3.t: "Les caravanes de Kengtung"
 nd_sha.3.d: "Kengtung has become one of the great commercial crossroads of mainland Southeast Asia. Each year, some eight thousand mules laden with goods from southern China traverse the highland passes, carrying camphor, dates, silk, tea, and walnuts southward toward Siam. They return northward laden with cotton, lacquerware, precious metals, and tobacco.\n\nThe Yunnanese merchants who lead these caravans have become familiar figures in every Shan market town. Some enjoy such close relationships with the local sawbwas that they stay in the palace itself during their visits. Chinese traders have settled permanently in Shan towns, and the Panthay Muslims among them have become a distinctive part of the highland's multi-ethnic tapestry. The wealth flowing through these routes enriches every mong they touch."
 nd_sha.3.a: "Les routes des hautes terres sont les artères de notre prospérité."
 nd_sha.4.t: "Réveil national Shan"
 nd_sha.4.d: "A new consciousness stirs among the Shan people. For generations, the sawbwas ruled their individual mong with little thought to a shared Shan identity beyond the bonds of language and faith. But as the modern world presses in, with its nation-states and its demands for centralized authority, the Shan have begun to see themselves not merely as subjects of this or that sawbwa, but as a people with a common heritage, a shared Buddhist faith, and a right to determine their own destiny.\n\nScholars collect the old chronicles. Poets compose in the Shan script. In the monasteries, monks teach not just the dharma but the history of the great Mong Mao confederation and the glory days when the Shan ruled from Ava itself. This awakening is more than nostalgia; it is a declaration that the Shan people intend to remain masters of their own highland home."
 nd_sha.4.a: "L'esprit Shan perdurera sur ces montagnes."
 nd_sha_tai_highland_warfare: "Guerre des Highlands Tai"
 nd_sha_tai_highland_warfare_desc: "Les peuples Tai qui se sont installés sur les hauts plateaux Shan ont apporté avec eux des traditions de guerre à cheval adaptées au terrain montagneux. Contrairement à la cavalerie des plaines qui comptait sur la vitesse à travers les plaines ouvertes, les cavaliers Shan ont appris à naviguer dans les cols escarpés et les vallées étroites."
 nd_sha_highland_irrigation: "Irrigation des hautes terres"
 nd_sha_highland_irrigation_desc: "Les Shan ont creusé des rizières en terrasses dans les pentes des hautes terres, canalisant les ruisseaux de montagne grâce à d'ingénieux systèmes d'irrigation pour soutenir leurs colonies de vallée."
 nd_sha_mong_system: "Le système Mong"
 nd_sha_mong_system_desc: "L'unité politique du monde Shan est le mong : une principauté centrée sur une vallée et ses hauts plateaux environnants, gouvernée par un sawbwa. Ce système décentralisé a permis aux Shan de gouverner diverses populations sur des terrains difficiles."
 nd_sha_theravada_foundations: "Fondations Theravada"
 nd_sha_theravada_foundations_desc: "Le bouddhisme Theravada a pris de profondes racines parmi le peuple Shan, se mêlant à des traditions animistes plus anciennes de culte des esprits. Les monastères sont devenus des centres d'apprentissage et de vie communautaire à chaque époque."
 nd_sha_mong_mao_legacy: "L'héritage de Mong Mao"
 nd_sha_mong_mao_legacy_desc: "Le souvenir de Mong Mao, la grande fédération Tai qui a brisé les royaumes de Sagaing et Pinya en 1364, reste la tradition martiale déterminante des hauts plateaux Shan."
 nd_sha_silver_craft: "Artisanat en argent Shan"
 nd_sha_silver_craft_desc: "Les orfèvres Shan sont réputés dans toute l’Asie du Sud-Est continentale pour leurs créations complexes. Des bols en argent, des bijoux et des objets de cérémonie ornés de motifs bouddhistes sont produits dans des ateliers répartis sur les hauts plateaux."
 nd_sha_dha_warriors_tradition: "Guerriers Dha"
 nd_sha_dha_warriors_tradition_desc: "Le dha, l’épée à simple tranchant des Shan, est à la fois un outil et une arme. Les guerriers Dha, formés dès leur jeunesse aux arts de combat des hautes terres, formaient l'épine dorsale des armées sawbwa lors des grandes campagnes confédérées."
 nd_sha_sawbwa_courts: "Tribunaux de Sawbwa"
 nd_sha_sawbwa_courts_desc: "Le haw, ou palais d'un sawbwa, est le cœur politique et culturel de chaque mong. Ici, le prince tient sa cour, rend la justice et reçoit les tributs de ses sujets et des marchands en visite."
 nd_sha_shan_monasticism: "Monachisme Shan"
 nd_sha_shan_monasticism_desc: "Les monastères bouddhistes Shan, kyaung, servent d'écoles, de centres communautaires et de référentiels d'apprentissage. L'architecture monastique Shan distinctive reflète à la fois les influences birmanes et Lan Na Thai."
 nd_sha_caravan_crossroads: "Carrefour des caravanes"
 nd_sha_caravan_crossroads_desc: "Les hauts plateaux Shan chevauchent les anciennes routes commerciales reliant le Yunnan au Siam. Des haltes de caravanes et des bourgs se sont développés le long de ces routes, transformant les Mong en centres commerciaux."
 nd_sha_multi_ethnic_governance: "Gouvernance multiethnique"
 nd_sha_multi_ethnic_governance_desc: "Les Shan Mong n’ont jamais été ethniquement homogènes. Palaung, Pa-O, Kachin, Wa, Lisu et bien d'autres peuples vivaient sous l'autorité des sawbwa. Gouverner cette mosaïque exigeait une tolérance et un pragmatisme qui sont devenus une caractéristique de l’art politique Shan."
 nd_sha_shan_confederation: "La Confédération Shan"
 nd_sha_shan_confederation_desc: "En 1527, Sawlon dirigea une coalition de Shan Mong qui captura le royaume d'Ava. Pendant près de trois décennies, la Confédération des États Shan a dirigé la Haute-Birmanie, la force politique la plus puissante de la vallée de l'Irrawaddy."
 nd_sha_sawbwa_patronage: "Patronage Sawbwa"
 nd_sha_sawbwa_patronage_desc: "Les sawbwas les plus riches sont devenus de grands mécènes de l'art et de l'architecture bouddhistes, commandant d'élégants monastères et des images distinctives de Bouddha de style Shan, caractérisées par leur grâce grande et mince."
 nd_sha_elephant_warfare: "Guerre des éléphants"
 nd_sha_elephant_warfare_desc: "Les Shan sawbwas entretenaient les éléphants de guerre comme symboles du pouvoir royal et comme instruments de guerre. Les gardes d'éléphants blindés constituaient l'élément de choc lourd des armées Shan, terrifiant les adversaires dans les étroites vallées des hautes terres."
 nd_sha_textile_mastery: "Maîtrise du textile Shan"
 nd_sha_textile_mastery_desc: "Les tisserands Shan produisaient des textiles réputés dans toute l'Asie du Sud-Est pour leurs couleurs vibrantes et leurs motifs complexes. L'artisanat a atteint son apogée avec le développement de la soie de lotus : un tissu extrêmement laborieux tissé à partir de fibres de tiges de plantes de lotus."
 nd_sha_plateau_mining: "Exploitation minière des plateaux"
 nd_sha_plateau_mining_desc: "Le plateau Shan recelait d’immenses richesses minérales : rubis et saphirs au nord, argent et plomb dans les profondeurs. Les opérations minières, bien que de petite envergure, produisaient des pierres et des métaux précieux qui enrichissaient les tribunaux sawbwa."
 nd_sha_mong_cavalry_tradition: "Tradition de la cavalerie Mong"
 nd_sha_mong_cavalry_tradition_desc: "La cavalerie lourde des Mong confédérés représentait la force de frappe d'élite des armées Shan. Issus des familles nobles de chaque principauté, ces cavaliers combinaient la mobilité des traditions steppiques avec la connaissance du terrain des hautes terres."
 nd_sha_kengtung_crossroads: "Carrefour de Kengtung"
 nd_sha_kengtung_crossroads_desc: "Kengtung became the first destination within Shan territory for caravans originating in southern China. From there, routes branched southward toward Siam. Eight thousand mules passed through annually, carrying the trade of empires. Along the routes a market was held in each place every fifth day, and the hill peoples came down to it."
 nd_sha_shan_buddhist_art: "Art Bouddhiste Shan"
 nd_sha_shan_buddhist_art_desc: "Les Shan ont développé une école d’art bouddhiste distincte. Their Buddha images (tall, slim, and graceful with elongated lines and a sense of weightlessness) reflected both Mon-Burmese traditions and Lan Na Thai aesthetics."
 nd_sha_highland_defense: "Doctrine de défense des Highlands"
 nd_sha_highland_defense_desc: "Le terrain montagneux des hauts plateaux Shan fournissait des défenses naturelles que des générations de sawbwas ont appris à exploiter. Les armées d’invasion ont vu leurs lignes de ravitaillement s’étirer à travers des cols de montagne difficiles."
 nd_sha_highland_autonomy: "Autonomie des Highlands"
 nd_sha_highland_autonomy_desc: "Même sous la suzeraineté birmane, les Shan sawb conservaient une autonomie remarquable. L'éloignement et la difficulté du relief des hautes terres rendaient le gouvernement direct peu pratique, préservant le système Mong à travers des siècles de subordination nominale."
 nd_sha_lacquerware_tradition: "Laque Shan"
 nd_sha_lacquerware_tradition_desc: "La tradition des laques Shan produisait des objets fonctionnels et décoratifs d’une grande beauté. Les artisans ont appliqué plusieurs couches de laque sur des fondations en bambou ou en bois, créant ainsi des récipients et des conteneurs prisés dans toute la région."
 nd_sha_gemstone_commerce: "Commerce de pierres précieuses"
 nd_sha_gemstone_commerce_desc: "The rubies and sapphires of the Shan Plateau entered the expanding global trade networks. Stones mined in the highlands were set in Shan silver and found their way to courts and markets from India to China."
 nd_sha_religious_scholarship: "Bourse religieuse"
 nd_sha_religious_scholarship_desc: "Shan monasteries became centers of Theravada Buddhist scholarship. Monks preserved and studied the Pali canon, while also maintaining chronicles of Shan history and the genealogies of the sawbwa lineages. Their folding books were written on sa paper, beaten from mulberry bark in the highland villages."
 nd_sha_border_diplomacy: "Diplomatie frontalière"
 nd_sha_border_diplomacy_desc: "Situés entre les grandes puissances de Birmanie, de Chine et du Siam, les Sawbwas Shan sont devenus des maîtres de la diplomatie frontalière, rendant hommage simultanément à plusieurs suzerains, rivalisant les uns contre les autres."
 nd_sha_shan_law_codification: "Codification de la loi Shan"
 nd_sha_shan_law_codification_desc: "Les lois coutumières régissant la vie des Mong ont été rassemblées et codifiées, établissant des principes juridiques standardisés dans les hauts plateaux Shan. Ces lois régissaient l'héritage, le régime foncier et les obligations entre le sawbwa et le sujet."
 nd_sha_plateau_musketeers: "Mousquetaires du Plateau"
 nd_sha_plateau_musketeers_desc: "Les armes à feu atteignirent les hauts plateaux Shan par les routes caravanières en provenance de Chine et grâce aux contacts avec les commerçants européens. Les guerriers Shan ont adapté les mousquets à la guerre en montagne, utilisant le terrain comme couverture et comme embuscade."
 nd_sha_reformed_administration: "Administration réformée"
 nd_sha_reformed_administration_desc: "À mesure que le monde se modernisait, les sawbwas avant-gardistes ont commencé à réformer l’administration de leur mong. Les documents écrits ont remplacé la tradition orale et des structures fiscales et de gouvernance plus systématiques ont émergé."
 nd_sha_renewed_independence: "Indépendance renouvelée"
 nd_sha_renewed_independence_desc: "Dans les périodes où l’autorité centrale birmane s’affaiblissait, les Shanmong saisissaient l’occasion pour réaffirmer leur indépendance. Les hauts plateaux ont toujours été plus faciles à maîtriser qu'à conquérir."
 nd_sha_shan_court_culture: "Culture de la cour Shan"
 nd_sha_shan_court_culture_desc: "Les cours des sawbwas les plus riches sont devenues des centres de culture raffinée. La musique, la danse, la poésie et les arts visuels ont prospéré sous le patronage princier, mêlant les influences Shan, birmanes et thaïlandaises."
 nd_sha_highland_fortifications: "Fortifications des Hautes Terres"
 nd_sha_highland_fortifications_desc: "The Shan strengthened their natural mountain defenses with constructed fortifications. The seat of each mong was walled and moated, and stockades, watchtowers, and fortified passes tied the walled towns into a formidable defensive network."
 nd_sha_tea_trade: "Commerce du thé des Highlands"
 nd_sha_tea_trade_desc: "Les hautes terres fraîches et brumeuses se sont révélées idéales pour la culture du thé. Le thé Shan, transformé selon des méthodes traditionnelles et commercialisé via les réseaux caravaniers, est devenu une source de revenus importante."
 nd_sha_federal_assembly: "Assemblée fédérale"
 nd_sha_federal_assembly_desc: "S'appuyant sur des siècles de tradition du conseil sawbwa, les Shan se sont orientés vers une assemblée fédérale plus formelle. Les représentants de chaque Mong se réunissaient pour délibérer sur les questions touchant tous les États Shan."
 nd_sha_modernized_mining: "Une exploitation minière modernisée"
 nd_sha_modernized_mining_desc: "De nouvelles techniques et outils ont transformé les anciennes mines du plateau Shan. La mine Bawdwin en particulier est devenue l'une des principales sources mondiales d'argent et de plomb."
 nd_sha_shan_printing: "Impression Shan"
 nd_sha_shan_printing_desc: "L'introduction de la technologie de l'imprimerie a permis une diffusion plus large des textes bouddhistes, des chroniques et des codes juridiques en écriture Shan. L'alphabétisation s'est répandue au-delà des monastères pour atteindre la population au sens large."
 nd_sha_commercial_modernization: "Modernisation commerciale"
 nd_sha_commercial_modernization_desc: "Les anciennes routes caravanières ont été complétées par des infrastructures commerciales modernes. Les bourgs se sont développés, de nouveaux produits sont entrés dans les réseaux commerciaux et l'économie Shan a commencé sa transformation."
 nd_sha_highland_defense_reform: "Réforme de la défense des Highlands"
 nd_sha_highland_defense_reform_desc: "Les réformes militaires ont modernisé les forces armées Shan tout en préservant leur expertise en matière de guerre en montagne. Une infanterie disciplinée et entraînée aux tactiques modernes complétait la cavalerie traditionnelle."
 nd_sha_national_awakening: "Réveil national"
 nd_sha_national_awakening_desc: "Une identité Shan partagée s’est cristallisée à travers les Mong. Les érudits, les moines et les poètes ont formulé une vision du peuple Shan comme une nation partageant un héritage commun, une foi bouddhiste et un droit à l’autodétermination."
 a_nd_sha_highland_cavalry: "Cavalerie des hautes terres Shan"
 a_nd_sha_highland_cavalry_desc: "Cavaliers de montagne entraînés dans les cols des hautes terres du plateau Shan, ces cavaliers peuvent naviguer sur des terrains qui arrêteraient la cavalerie des basses terres."
 a_nd_sha_dha_warriors: "Guerriers Dha"
 a_nd_sha_dha_warriors_desc: "Des épéistes d'élite brandissant le Shan dha traditionnel, une lame à un seul tranchant, en combat rapproché. Leurs charges féroces brisèrent les défenseurs d'Ava."
 a_nd_sha_elephant_guard: "Garde des éléphants de Sawbwa"
 a_nd_sha_elephant_guard_desc: "Éléphants de guerre entretenus par les tribunaux sawbwa comme symboles du pouvoir royal et instruments de guerre. Leur charge dans les étroites vallées des hautes terres fut dévastatrice."
 a_nd_sha_mong_cavalry: "Cavalerie Mong"
 a_nd_sha_mong_cavalry_desc: "Pony cavalry drawn from the noble families of the confederated mong. These horsemen formed the decisive striking force of the united Shan armies."
 a_nd_sha_plateau_musketeers: "Mousquetaires du Plateau"
 a_nd_sha_plateau_musketeers_desc: "Les guerriers Shan étaient formés à l'utilisation des armes à feu acquises via les routes commerciales Chine-Siam. Ils ont adapté les mousquets à la guerre en montagne, utilisant le terrain des hautes terres comme couverture et comme embuscade."
 nd_sha_haw: "Aubépine"
 nd_sha_haw_desc: "Le palais d'un Shan Sawbwa, servant de cœur politique et culturel au Mong. Ici, le prince tient sa cour, rend la justice et gère les affaires de sa principauté."
 nd_sha_kyaung: "Shan Kyaung"
 nd_sha_kyaung_desc: "Un monastère bouddhiste dans le style architectural Shan distinctif, mêlant les influences mon-birmanes et Lan Na Thai. Sert de centre d’apprentissage, de culte et de vie communautaire."
 nd_sha_caravan_halt: "Arrêt de caravane"
 nd_sha_caravan_halt_desc: "Une aire de repos et un poste de traite le long des routes caravanières des hautes terres reliant la Chine et le Siam. Les marchands trouvent un abri, des provisions et un marché pour leurs marchandises."
 nd_sha_silverworks: "Shan Silverworks"
 nd_sha_silverworks_desc: "Un atelier où les orfèvres Shan produisent les bols en argent complexes, les bijoux et les objets de cérémonie pour lesquels les hauts plateaux sont réputés."
 nd_sha_terrace_fields: "Champs en terrasse"
 nd_sha_terrace_fields_desc: "Des rizières en terrasses irriguées creusées dans les pentes des hautes terres, canalisant les ruisseaux de montagne pour soutenir l'agriculture sur le terrain accidenté du plateau Shan."
 nd_sha_weaving_workshop: "Atelier de tissage Shan"
 nd_sha_weaving_workshop_desc: "Un atelier produisant des textiles vibrants et de la soie de lotus rare pour laquelle les tisserands Shan sont célébrés dans toute l'Asie du Sud-Est."
 nd_sha_gemstone_mine: "Mine de pierres précieuses"
 nd_sha_gemstone_mine_desc: "Une exploitation minière extrayant les rubis, saphirs et autres pierres précieuses trouvés dans la terre riche en minéraux du plateau Shan."
 nd_sha_haw_upkeep: "Entretien du palais"
 nd_sha_haw_upkeep_desc: "Les tentures en soie, les récipients en porcelaine et autres meubles qui maintiennent la dignité de la cour du sawbwa."
 nd_sha_kyaung_upkeep: "Entretien monastique"
 nd_sha_kyaung_upkeep_desc: "Paper for Buddhist texts, beeswax for votive candles, and incense for the shrine sustain the monastery's religious functions."
 nd_sha_caravan_halt_upkeep: "Arrêter la maintenance"
 nd_sha_caravan_halt_upkeep_desc: "Feed for pack animals, timber for repairs, and leather for harness keep the caravan halt operational."
 nd_sha_silverworks_upkeep: "Orfèvrerie"
 nd_sha_silverworks_upkeep_desc: "Les orfèvres Shan transforment l'argent et le cuivre en bijoux complexes, en bols et en objets de cérémonie réputés dans toute l'Asie du Sud-Est."
 nd_sha_terrace_upkeep: "Culture du riz"
 nd_sha_terrace_upkeep_desc: "Les terrasses irriguées creusées dans les pentes des hautes terres produisent du riz, soutenu par des canaux à pans de bois qui dirigent les ruisseaux de montagne vers les rizières."
 nd_sha_weaving_upkeep: "Tissage de la soie"
 nd_sha_weaving_upkeep_desc: "Les tisserands Shan transforment le fil de soie et les teintures vibrantes en tissus fins célébrés dans toute l'Asie du Sud-Est pour ses motifs complexes."
 nd_sha_mine_upkeep: "Extraction de pierres précieuses"
 nd_sha_mine_upkeep_desc: "Les mineurs extraient des rubis et des saphirs de la terre riche en minéraux, en utilisant des étaiements en bois et des outils pour exploiter les gisements des hautes terres."
 nd_sha_lacquerware_pm: "Laque Shan"
 nd_sha_lacquerware_pm_desc: "A core of woven bamboo is coated many times over with thitsi sap and coloured with cinnabar. The finished bowls and betel boxes are sold across the region."
 nd_sha_tea_processing_pm: "Transformation du thé des Highlands"
 nd_sha_tea_processing_pm_desc: "Les théiers cultivés dans les hautes terres fraîches du Shan sont récoltés et traités selon des méthodes traditionnelles, produisant du thé fini destiné à l'exportation via les réseaux de caravanes."
 levy_nd_sha_mong_cavalry: "Prélèvement de cavalerie Mong"
 levy_nd_sha_mong_cavalry_desc: "Cavalerie lourde issue des familles nobles des mong confédérés, répondant à l'appel aux armes des sawbwa."
 levy_nd_sha_highland_cavalry: "Prélèvement de cavalerie des Highlands"
 levy_nd_sha_highland_cavalry_desc: "Cavaliers de montagne des communautés des hauts plateaux Shan, habiles à naviguer sur des terrains difficiles."
 nd_sha_highland_stockade: "Palissade des Highlands"
 nd_sha_highland_stockade_desc: "Une fortification en bois protégeant les principaux cols de montagne des hauts plateaux Shan. Les tours de guet et les palissades ont canalisé les envahisseurs vers les terrains de massacre."
 nd_sha_stockade_upkeep: "Entretien des palissades"
 nd_sha_stockade_upkeep_desc: "Bois et pierre pour réparer et renforcer les palissades et les terrassements de la palissade des hautes terres."
 nd_sha_river_trade: "Routes commerciales fluviales"
 nd_sha_river_trade_desc: "Les rivières qui traversaient les hauts plateaux du Shan ont servi de premières artères commerciales, reliant les communautés des hauts plateaux aux marchés des basses terres de la vallée de l'Irrawaddy."
 nd_sha_formed_tt: "Les États Shan ont été formés"
 nd_sha_path_a_tt: "Choisissez la Confédération de l'Épée"
 nd_sha_path_b_tt: "Choisi Carrefour du Plateau"
 nd_sha_destiny: "Destin des États Shan"
 nd_sha_destiny_desc: "The Shan principalities have united at last. Stability in the highlands marks the beginning of a greater ambition, but the path forward depends on choices already made."
 nd_sha_dest_seize_pinya: "Saisir Pinya"
 nd_sha_dest_seize_pinya_desc: "Le royaume de Pinya tomba aux mains de la confédération Shan en 1527 lorsque la cavalerie de Sawlon descendit des hautes terres. Pour suivre ses traces, partez à la conquête de Pinya et de Sagaing, les capitales jumelles de la Haute-Birmanie."
 nd_sha_dest_march_on_pagan: "Marche sur Pagan"
 nd_sha_dest_march_on_pagan_desc: "Pagan, siège de l'ancienne gloire birmane, doit reconnaître la suprématie Shan. Marchez vers le sud pour revendiquer le cœur de l’Irrawaddy et démontrer que la confédération des hautes terres est la puissance dominante de l’Asie du Sud-Est continentale."
 nd_sha_dest_lord_irrawaddy: "Seigneur de l'Irrawaddy"
 nd_sha_dest_lord_irrawaddy_desc: "L'ambition ultime de la confédération Shan : la domination sur toute la Birmanie depuis la frontière des hautes terres jusqu'aux ports côtiers. Saisissez Pegu, Martaban et Toungoo pour contrôler toute la vallée de l'Irrawaddy et les routes commerciales qui la traversent."
 nd_sha_dest_highland_commerce: "Commerce des Highlands"
 nd_sha_dest_highland_commerce_desc: "Le plateau Shan se situe au carrefour des civilisations. Développez le commerce du thé dans les hautes terres et accumulez les richesses nécessaires pour transformer les Mong de principautés isolées en un réseau commercial prospère."
 nd_sha_dest_lanna_link: "Le lien Lan Na"
 nd_sha_dest_lanna_link_desc: "Chiang Mai, cœur du royaume de Lan Na, est le terminus naturel sud des routes caravanières des hautes terres. Amenez-le dans la sphère Shan et adoptez le système bancaire moderne pour financer l’expansion du commerce sur le plateau."
 nd_sha_dest_jewel_highlands: "Joyau des Hautes Terres"
 nd_sha_dest_jewel_highlands_desc: "The Shan Plateau produces the finest rubies and sapphires in Asia, and its position between China and Siam gives it access to silk from both empires. Mongmit, the mong of the ruby tract, is to be built up into a town worthy of its stones, and the highland mong made the envy of the mainland."
 nd_sha.5.t: "Un destin commence"
 nd_sha.5.d: "The scattered mong of the Shan Plateau have found their unity at last. Where once each sawbwa looked only to his own valley and his own interests, now all stand together beneath a single banner. The question is no longer whether the Shan can unite, but what they will do with their newfound strength.\n\nThe highlands stretch before us: a realm of misty valleys, jade rivers, and mountain passes that connect the great civilizations of the world. What we build upon this plateau will be remembered for generations."
 nd_sha.5.a: "Les États Shan perdureront."
 nd_sha.6.t: "La chute de Pinya"
 nd_sha.6.d: "The ancient walls of Pinya have fallen to Shan arms. Just as Sawlon's cavalry swept down from the highlands in 1527 to shatter the bickering Burmese court, so too have our forces proven that the highland confederation is the true master of Upper Burma. The twin capitals of Pinya and Sagaing now fly the banner of the united Shan States.\n\nThe Burmese nobles who once looked upon the highland peoples with contempt now bend the knee to our sawbwa. The Irrawaddy valley lies open before us."
 nd_sha.6.a: "Tout comme Sawlon a conquis, nous aussi."
 nd_sha.7.t: "Païen sous le règne Shan"
 nd_sha.7.d: "The ancient temples of Pagan stand in the shadow of Shan banners. This city, once the heart of the great Burmese empire, now answers to the highland confederation. Our armies have marched where only the mightiest conquerors have tread.\n\nBut ruling Pagan is not the same as conquering it. The question now is how we hold what we have taken. Shall we garrison this ancient city and rebuild what war has broken, establishing permanent Shan authority over the Irrawaddy heartland? Or shall we take what wealth Pagan offers and press onward, using the momentum of victory to fuel further conquest?"
 nd_sha.7.a: "Garnissez la ville et rétablissez l’ordre."
 nd_sha.7.b: "Prenez le butin et avancez."
 nd_sha.8.t: "Seigneur de l'Irrawaddy"
 nd_sha.8.d: "From the misty highland passes to the tropical coast, the Irrawaddy valley bows to Shan authority. Pegu, Martaban, Toungoo, the great cities of Lower Burma, have all been brought under the confederation's banner. What the ancient Shan of Mong Mao could only dream, we have achieved.\n\nNow comes the question that shapes empires: how shall we govern this vast domain? A centralized highland imperium ruled from a single throne, with the sawbwas serving as provincial governors under royal command? Or a federation of mong, each retaining its autonomy but bound by treaty and common purpose to the greater Shan state?"
 nd_sha.8.a: "Un trône, un royaume : l'empire Shan s'élève."
 nd_sha.8.b: "Une fédération de free mong : plus forts ensemble."
 nd_sha.9.t: "Les caravanes arrivent"
 nd_sha.9.d: "The first great caravan of the season has arrived in the highland markets. Mules laden with Chinese tea and silk descend through the mountain passes, while merchants from the southern lowlands bring cotton, salt, and metalwork in exchange. The wealth of empires flows through our valleys.\n\nThe sawbwas have invested wisely in market infrastructure, caravan halts, and trade agreements. The tea gardens of the highland slopes now produce enough to supply merchants who carry Shan goods as far as the courts of Ayutthaya. Commerce is the lifeblood of the plateau."
 nd_sha.9.a: "Les routes commerciales sont notre trésor."
 nd_sha.10.t: "La connexion Chiang Mai"
 nd_sha.10.d: "Chiang Mai, jewel of the Lan Na kingdom, is now linked to the Shan commercial network. The caravan routes that once ended at the highland frontier now extend deep into the Tai lowlands, connecting Chinese goods to Siamese markets through the Shan Plateau. Banking houses have opened in the major mong towns, and the volume of trade has surged.\n\nBut how should this expanded network be governed? Some sawbwas argue for royal monopoly, controlling the flow of goods to maximize the treasury's share. Others advocate opening the markets freely, trusting that the resulting boom in trade will enrich everyone."
 nd_sha.10.a: "La couronne contrôlera les caravanes."
 nd_sha.10.b: "Que tous les marchands commercent librement."
 nd_sha.11.t: "Joyau des Hautes Terres"
 nd_sha.11.d: "The Shan Plateau has become one of the great commercial centers of Asia. Rubies and sapphires mined from the highland earth draw buyers from India, China, and beyond. Silk from two empires passes through our markets, enriched and re-exported at a premium. Mongmit, once a village beside the ruby diggings, has grown to rival the lowland capitals.\n\nThe wealth of the highlands has attracted the attention of the world. Shall we embrace our role as the gem kings of Asia, investing our mineral wealth in cultural prestige and the security that comes with it? Or shall we build the plateau into a great emporium: a commercial hub where the goods of all nations meet?"
 nd_sha.11.a: "Nous sommes les rois des pierres précieuses d’Asie."
 nd_sha.11.b: "Le plateau sera le magasin des nations."
 STATIC_MODIFIER_NAME_nd_sha_dest_pagan_garrison: "Garnison de Païen"
 STATIC_MODIFIER_DESC_nd_sha_dest_pagan_garrison: "Les soldats Shan maintiennent l'ordre dans l'ancienne capitale birmane, reconstruisant ce que la guerre a brisé tout en établissant une autorité permanente sur les hauts plateaux."
 STATIC_MODIFIER_NAME_nd_sha_dest_pagan_plunder: "Butin de païen"
 STATIC_MODIFIER_DESC_nd_sha_dest_pagan_plunder: "La richesse des anciens Païens alimente la machine de guerre de la confédération Shan, tandis que les trésors affluent vers le nord pour équiper de nouvelles armées en vue de nouvelles conquêtes."
 STATIC_MODIFIER_NAME_nd_sha_dest_highland_imperium: "Impérial des Hautes Terres"
 STATIC_MODIFIER_DESC_nd_sha_dest_highland_imperium: "Un empire Shan centralisé règne à partir d'un trône unique, les Sawbwas faisant office de gouverneurs provinciaux loyaux sous l'autorité suprême de la cour des Highlands."
 STATIC_MODIFIER_NAME_nd_sha_dest_federation_of_mong: "Fédération des Mong"
 STATIC_MODIFIER_DESC_nd_sha_dest_federation_of_mong: "Une confédération décentralisée de mongs libres, chacun conservant son autonomie tout en étant lié par un traité et un objectif commun. C’est la diplomatie et l’intelligence, et non la force brute, qui assurent la cohésion de la fédération."
 STATIC_MODIFIER_NAME_nd_sha_dest_caravan_monopoly: "Monopole des caravanes"
 STATIC_MODIFIER_DESC_nd_sha_dest_caravan_monopoly: "La couronne contrôle les routes des caravanes des hautes terres, tirant un maximum de revenus de chaque train mulet qui traverse le territoire Shan."
 STATIC_MODIFIER_NAME_nd_sha_dest_open_markets: "Marchés ouverts"
 STATIC_MODIFIER_DESC_nd_sha_dest_open_markets: "Les marchés Shan sont ouverts à tous. Les marchands de Chine, du Siam, d’Inde et d’ailleurs se mélangent librement, et l’essor commercial qui en résulte enrichit chacun d’entre eux."
 STATIC_MODIFIER_NAME_nd_sha_dest_gem_kings: "Rois des pierres précieuses d'Asie"
 STATIC_MODIFIER_DESC_nd_sha_dest_gem_kings: "La richesse minérale du plateau Shan a fait des Sawbwas des hautes terres les princes les plus riches de l'Asie du Sud-Est continentale. Rubis, saphirs et argent affluent des mines Shan vers les cours du monde."
 STATIC_MODIFIER_NAME_nd_sha_dest_plateau_emporium: "Magasin du Plateau"
 STATIC_MODIFIER_DESC_nd_sha_dest_plateau_emporium: "Le plateau Shan est devenu le grand carrefour du commerce asiatique. Les marchandises en provenance de Chine, d’Inde et du Siam convergent vers les marchés des hautes terres qui rivalisent avec les entrepôts côtiers."
 nd_sha_war_pavilion: "Pavillon de guerre"
 nd_sha_war_pavilion_desc: "Un centre de commandement des hautes terres à partir duquel le sawbwa dirige ses armées confédérées. Les tours de guet surveillent les cols tandis que les armureries et les casernes sont prêtes pour la prochaine campagne."
 nd_sha_war_pavilion_upkeep: "Entretien du pavillon"
 nd_sha_war_pavilion_upkeep_desc: "Armes, bois et cuir pour entretenir le pavillon de guerre des hautes terres et sa garnison de soldats Shan."
 nd_sha_gem_exchange: "Échange de pierres précieuses"
 nd_sha_gem_exchange_desc: "Une maison de commerce officielle où les rubis, saphirs et autres pierres précieuses des mines Shan sont classés, évalués et vendus à des marchands de toute l'Asie."
 nd_sha_gem_exchange_upkeep: "Opérations d'échange"
 nd_sha_gem_exchange_upkeep_desc: "Le papier pour les grands livres, les pierres précieuses pour les stocks d'exposition et l'argent pour les transactions soutiennent les opérations de la bourse des pierres précieuses des Highlands."
 nd_sha_dest_mongmit_developed_tt: "Mongmit is held and its development is at least #bold 36#!"
 nd_sha_ruby_setting_pm: "Ruby Setting"
 nd_sha_ruby_setting_pm_desc: "Rubies and sapphires from the Mogok tract are set in Shan silver. Jewelled ware of this kind is made for the courts of Ava, Yunnan, and Siam."
 nd_sha_five_day_market: "Five-Day Market"
 nd_sha_five_day_market_desc: "A market that visits five places in turn, so that each has its market day every fifth day. Hill peoples come down to it with tea, lac, and forest goods, and valley traders and Yunnanese muleteers buy from them."
 nd_sha_five_day_market_upkeep: "Market Ground"
 nd_sha_five_day_market_upkeep_desc: "Timber for the stalls, and the salt and cloth that are brought up for the hill peoples to buy."
 nd_sha_lacquer_house: "Laikha Lacquer House"
 nd_sha_lacquer_house_desc: "A village workshop of the kind found around Laikha and Kengtung. Sap is tapped from the thitsi trees of the forest and laid in many coats over woven bamboo."
 nd_sha_sa_paper_house: "Sa Paper House"
 nd_sha_sa_paper_house_desc: "Bark of the paper mulberry is boiled, beaten to pulp, and dried in the sun on cloth frames. The paper is used for the folding books of the monasteries."
 nd_sha_sa_paper_pm: "Mulberry Paper"
 nd_sha_sa_paper_pm_desc: "Mulberry bark is boiled over wood fires, beaten, and spread on frames to dry into sheets of sa paper."
 nd_sha_weng: "Weng"
 nd_sha_weng_desc: "The walled seat of a mong. A rampart of brick and earth is ringed by a moat and entered by guarded gates, as at Kengtung, whose wall had twelve."
 nd_sha_weng_upkeep: "Rampart Upkeep"
 nd_sha_weng_upkeep_desc: "Brick for the wall, timber for the gates, and arms for the watch."
 nd_sha_tea_garden: "Tawngpeng Tea Garden"
 nd_sha_tea_garden_desc: "Tea is grown on the slopes around Namhsan by the Palaung of Tawngpeng. Part of the leaf is steamed, pressed, and buried to make laphet, the pickled tea eaten across Burma."
 nd_sha_bawdwin_works: "Bawdwin Works"
 nd_sha_bawdwin_works_desc: "Chinese miners worked the Bawdwin lode north of Hsenwi for its silver from the fifteenth century. The lead they left in the slag heaps is smelted here."
 nd_sha_bawdwin_smelting_pm: "Lead Smelting"
 nd_sha_bawdwin_smelting_pm_desc: "Ore and old slag are smelted over charcoal and the lead is run into pigs."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_sha_bureaucracy_authority: "Institutions des Shan Mong"
 AUTO_MODIFIER_DESC_nd_sha_bureaucracy_authority: "The united Shan States inherit the institutional fabric woven by centuries of saopha rule, sawbwa councils, sangha patronage, and muang assemblies. The throne may institute up to two of the great Shan bureaucracies, choosing which institutional hand will rule the highlands."

 sha_saopha_court_bureaucracy: "Ha de Saopha"
 sha_saopha_court_bureaucracy_desc: "Chaque Shan Mong est gouverné par un saopha (le Tai « sao hpa », ou Seigneur du Ciel) dont l'autorité descend d'un ancêtre céleste et dont la personne est liée à la terre par un serment rituel plutôt que par la nomination d'un pouvoir supérieur. Le saopha tient sa cour dans le haw, un palais fortifié au centre de sa principauté, entouré de ministres amat, d'aumôniers panyi et du chef consort maha-devi dont la lignée est souvent plus ancienne que la sienne. L'institution confère à chaque principauté cohésion et dignité, mais chaque saopha est un souverain en miniature et résiste à la subordination à tout suprême."

 sha_sawbwa_council_bureaucracy: "Conseil de Sawbwa"
 sha_sawbwa_council_bureaucracy_desc: "La confédération périodique des saophas sous un seigneur suprême, attestée sous Mong Mao au XIVe et au début du XVe siècle lorsque Sao Hkun Hkam et ses successeurs ont attiré les mong environnants dans une fédération tributaire. Le conseil se réunit pour coordonner les prélèvements militaires, régler les différends entre les peuples et présenter des ambassades unifiées au Yunnan, à Ava et à Lanna. Chaque saopha y assiste en personne (aucun mandataire n'est autorisé) ce qui maintient chaque seigneur politiquement engagé mais ne donne au souverain aucun pouvoir pour destituer ses pairs."

 sha_pongyi_kyaung_bureaucracy: "Pongyi-Kyaung Sangha"
 sha_pongyi_kyaung_bureaucracy_desc: "Le réseau de villages et de monastères à travers lequel le bouddhisme Theravada, arrivé dans les hauts plateaux Shan au cours du XIVe siècle via le contact des Lanna et des Birmans, a remplacé l'ancienne religion spirituelle Satsana Phi. Un pongyi (moine senior) dirige un kyaung dans chaque village de toute taille, apprenant aux garçons à lire les écritures pali et shan, copiant des manuscrits et jugeant les conflits locaux selon le dhamma. Le mécénat royal finance des shwedagons et des plates-formes d'ordination, produisant le taux d'alphabétisation masculine le plus élevé de l'Asie du Sud-Est continentale, mais cette conversion aliène progressivement les peuples animistes des collines Wa, Palaung et Lahu."

 sha_muang_irrigation_bureaucracy: "Assemblée d'irrigation de Muang"
 sha_muang_irrigation_bureaucracy_desc: "Le muang lui-même est un concept hydraulique : un régime Tai défini par ses ouvrages d'irrigation partagés, les déversoirs mai-faai et les canaux d'alimentation lai-muang qui arrosent les vallées de riz humide en terrasses du plateau Shan. L'assemblée des cultivateurs keng-muang, dirigée par un maître des eaux fai-muang élu parmi les chefs de village, fixe le calendrier de plantation, attribue les parts d'eau et convoque une corvée avant la mousson pour réparer les déversoirs. Le système fournit des excédents de riz fiables pour soutenir le haw et la sangha, mais limite le pouvoir du saopha à extraire au-delà de la part habituelle."
