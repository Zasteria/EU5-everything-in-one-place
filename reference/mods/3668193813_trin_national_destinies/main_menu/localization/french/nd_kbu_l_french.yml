l_french:
 STATIC_MODIFIER_NAME_nd_sword_of_the_mai: "Épée du Mai"
 STATIC_MODIFIER_DESC_nd_sword_of_the_mai: "Les Maïs du Kanem-Bornu régnaient grâce à la force de leur cavalerie blindée et à la peur que leurs guerriers aux casques de fer inspiraient à travers le Sahel. C'est un empire forgé au combat et tenu par la lance."
 STATIC_MODIFIER_NAME_nd_crossroads_of_the_sahara: "Carrefour du Sahara"
 STATIC_MODIFIER_DESC_nd_crossroads_of_the_sahara: "Le lac Tchad se trouve au cœur du plus grand réseau commercial d'Afrique. Des caravanes transportant du natron, du coton et de l'ivoire traversent les marchés de Bornu en route vers Tripoli et le Fezzan. Il s’agit d’un royaume enrichi par le commerce, et non par la seule conquête."
 nd_kbu.1.t: "La réunification du Kanem-Bornu"
 nd_kbu.1.d: "The ancient realm of the Sayfawa has been restored. From the shores of Lake Chad to the sands of the Sahara, the lands of Kanem and Bornu are united once more under a single Mai. For centuries the Sayfawa dynasty endured, driven from Kanem by the Bulala, they rebuilt in Bornu, and now they reclaim their heritage.\n\nBut what shall define this restored empire? The Mai's armored horsemen are the terror of the Sahel, and the ribats that guard our borders have never been breached. Yet our caravans carry more wealth than our armies seize, natron, cotton, and slaves flow north to Tripoli while horses, salt, and firearms return south. The character of Kanem-Bornu will be decided now, at the moment of its restoration.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_kbu.1.a: "Par la lance et le ribat, nous sommes des guerriers."
 nd_kbu.1.b: "Par la caravane et le marché, nous sommes commerçants."
 STATIC_MODIFIER_NAME_nd_alooma_gunpowder_revolution: "La révolution de la poudre à canon d'Alooma"
 STATIC_MODIFIER_DESC_nd_alooma_gunpowder_revolution: "Les conseillers militaires turcs ont formé nos mousquetaires aux arts de la guerre avec des armes à feu, transformant ainsi l’armée de Bornu en une force de combat moderne."
 STATIC_MODIFIER_NAME_nd_alooma_fortification_system: "Le système de fortification d'Alooma"
 STATIC_MODIFIER_DESC_nd_alooma_fortification_system: "Un réseau de ribats et de camps fortifiés sécurise désormais toutes les frontières de l'empire, chaque garnison rappelant en permanence l'autorité de Bornu."
 STATIC_MODIFIER_NAME_nd_bilma_toll_masters: "Maîtres de la route de Bilma"
 STATIC_MODIFIER_DESC_nd_bilma_toll_masters: "Notre contrôle sur l’oasis de Bilma et les caravanes de sel qui la traversent nous donne un levier inégalé sur le commerce transsaharien."
 STATIC_MODIFIER_NAME_nd_sayfawa_restoration: "Restauration de Sayfawa"
 STATIC_MODIFIER_DESC_nd_sayfawa_restoration: "L’ancienne dynastie réaffirme son autorité sacrée, s’appuyant sur des siècles de légitimité pour lier l’empire à travers des temps troublés."
 STATIC_MODIFIER_NAME_nd_embrace_the_shehu: "Embrassez le Shehu"
 STATIC_MODIFIER_DESC_nd_embrace_the_shehu: "L’ancienne dynastie cède la place à une gouvernance pratique. Le conseil du Shehu règne sur la compétence et le mérite militaire plutôt que sur la lignée."
 nd_kbu.2.t: "Les réformes de Mai Idris Alooma"
 nd_kbu.2.d: "Mai Idris Alooma has transformed the armies of Bornu. Through diplomatic missions to the Ottoman Porte, he has secured Turkish military advisors who now drill our soldiers in the use of firearms. Iron-helmeted musketeers march alongside the traditional armored cavalry, and fixed military camps with defensive walls have replaced temporary encampments.\n\nAlooma's innovations extend beyond the battlefield. He has cleared the roads for commerce, designed improved boats for Lake Chad's waters, and introduced standard units of measure for grain. His ribat fortifications guard every frontier. The question now is which of his reforms we shall pursue most vigorously."
 nd_kbu.2.a: "Les mousquetaires seront notre avant-garde."
 nd_kbu.2.b: "Les ribats sécuriseront nos frontières."
 nd_kbu.3.t: "Maîtres de la Route du Sel"
 nd_kbu.3.d: "The great caravan route from Lake Chad to Tripoli passes through the salt oases of Bilma, where enormous deposits of natron and salt are extracted by the labor of thousands. Every caravan that crosses the Sahara must pass through Bornu's territory and pay our tolls. From Bilma through Fezzan to the Mediterranean, a river of wealth flows through our lands, natron, cotton, kola nuts, ivory, and ostrich feathers heading north, while horses, firearms, silk, and copper come south.\n\nOur merchants have secured dominance over this central Saharan route, making Bornu the indispensable middleman between tropical Africa and the Mediterranean world."
 nd_kbu.3.a: "Que les péages affluent dans notre trésor."
 nd_kbu.4.t: "Le crépuscule du Sayfawa"
 nd_kbu.4.d: "The Sayfawa dynasty, which has ruled for over seven centuries, the longest-reigning dynasty in recorded history, faces an existential crisis. Internal court intrigues have weakened the Mai's authority, provincial governors grow increasingly independent, and the old tribute-based economy falters as trade routes shift.\n\nYet the dynasty's name still carries immense weight. The Sayfawa trace their lineage to the legendary Sayf ibn Dhi Yazan, and their girgam, the royal chronicle, records an unbroken chain of sovereign Mais stretching back to the time of the Prophet. We must decide whether to shore up this ancient institution or embrace new forms of governance."
 nd_kbu.4.a: "Les Sayfawa sont éternels. Restaurez l'autorité des Mai."
 nd_kbu.4.b: "Le Shehu gouvernera là où les Mai ne le peuvent pas."
 nd_kbu.5.t: "La défense du Bornu"
 nd_kbu.5.d: "When the Fulani jihad erupted across Hausaland and the warriors of Usman dan Fodio swept eastward, it seemed that Bornu itself would fall. Ngazargamu, our ancient capital, was sacked in 1808. But Muhammad al-Kanemi, an Islamic scholar and military commander, rallied the Kanembu and Shuwa Arabs to the empire's defense. Leading a mixed force of students, mallams, and mercenaries, al-Kanemi defeated the jihadi forces and drove them from Bornu.\n\nAl-Kanemi established a new capital at Kukawa and formed the Majlis, an executive council that brought together the empire's diverse communities. Though the Sayfawa Mais continued as figureheads, real power now rested with the Shehu and his council. Bornu survived where other Sahelian states did not."
 nd_kbu.5.a: "Bornu endure."
 nd_kbu_kanembu_horsemen: "Cavaliers Kanembu"
 nd_kbu_kanembu_horsemen_desc: "La tradition de la cavalerie Kanembu remonte aux premiers jours de l'empire, lorsque les cavaliers blindés dominaient les prairies plates autour du lac Tchad."
 nd_kbu_sayfawa_lineage: "Lignée Sayfawa"
 nd_kbu_sayfawa_lineage_desc: "La dynastie Sayfawa revendique une descendance de Sayf ibn Dhi Yazan et règne sur le Kanem-Bornu depuis plus de sept siècles, la dynastie au règne le plus long de l'histoire enregistrée."
 nd_kbu_natron_extraction: "Extraction de Natron"
 nd_kbu_natron_extraction_desc: "Les gisements de natron autour du lac Tchad sont parmi les plus riches d'Afrique, fournissant une denrée essentielle pour le commerce, la préservation et la médecine."
 nd_kbu_early_islamization: "Islamisation précoce"
 nd_kbu_early_islamization_desc: "La conversion du Kanem à l'islam au XIe siècle sous les Sayfawa a remodelé l'identité de l'empire, le reliant au monde islamique au sens large."
 nd_kbu_ribat_tradition: "Tradition du Ribat"
 nd_kbu_ribat_tradition_desc: "Des postes frontières fortifiés gardent les frontières de l’empire, servant à la fois de garnisons militaires et de centres d’apprentissage islamique."
 nd_kbu_lake_chad_fisheries: "Pêcheries du Lac Tchad"
 nd_kbu_lake_chad_fisheries_desc: "Les vastes ressources en eau douce du lac Tchad soutiennent une industrie de la pêche florissante qui nourrit la population croissante de l'empire."
 nd_kbu_saharan_caravan_routes: "Itinéraires des caravanes sahariennes"
 nd_kbu_saharan_caravan_routes_desc: "Le Kanem-Bornu se situe à cheval sur la route caravanière transsaharienne centrale reliant le lac Tchad à Tripoli via Bilma et le Fezzan."
 nd_kbu_ottoman_firearms: "Armes à feu ottomanes"
 nd_kbu_ottoman_firearms_desc: "Des conseillers militaires turcs importés par Mai Idris Alooma ont formé les soldats de Bornu à l'utilisation des mousquets, créant ainsi la première infanterie professionnelle à poudre d'Afrique."
 nd_kbu_alooma_reforms: "Les réformes d'Alooma"
 nd_kbu_alooma_reforms_desc: "Mai Idris Alooma a transformé Bornu grâce à des réformes militaires, administratives et économiques, établissant l'empire au sommet de sa puissance."
 nd_kbu_quranic_schools: "Sangaya Schools"
 nd_kbu_quranic_schools_desc: "Boys leave home to board with a master of the Quran in the sangaya, the Kanuri school of the wooden slate. The schools spread letters through the empire and train the men who sit in Bornu's courts."
 nd_kbu_berber_camelry: "Chameau berbère"
 nd_kbu_berber_camelry_desc: "Les cavaliers de chameaux berbères constituent la force désertique à longue portée de l'empire, capables de mener des raids en profondeur à travers le Sahara."
 nd_kbu_sharia_courts: "Tribunaux de la charia"
 nd_kbu_sharia_courts_desc: "Islamic law courts replace customary justice, providing standardized legal procedures across Bornu's diverse territories."
 nd_kbu_ngazargamu_metropolis: "Métropole de Ngazargamu"
 nd_kbu_ngazargamu_metropolis_desc: "La capitale fortifiée de Ngazargamu, entourée de murs de plus de six kilomètres de long, constitue le cœur commercial et politique de l'empire."
 nd_kbu_tribute_economy: "Économie du hommage"
 nd_kbu_tribute_economy_desc: "Les revenus du gouvernement proviennent des tributs, des droits de douane et de la participation à la traite négrière qui alimente le réseau caravanier transsaharien."
 nd_kbu_mailed_cavalry_tradition: "Tradition de cavalerie postale"
 nd_kbu_mailed_cavalry_tradition_desc: "Des cavaliers lourdement blindés, cotte de mailles et casques de fer, forment la force de choc d'élite de l'armée du Bornu, chargeant en formations denses à travers les prairies sahéliennes."
 nd_kbu_cotton_industry: "Industrie du coton"
 nd_kbu_cotton_industry_desc: "Les tisserands de Bornu produisent des tissus de coton fin qui sont commercialisés à travers le Sahara, appréciés pour leur qualité, du lac Tchad à la Méditerranée."
 nd_kbu_bilma_salt_road: "Route du sel de Bilma"
 nd_kbu_bilma_salt_road_desc: "Le contrôle de l'oasis de Bilma et de ses gisements de sel confère au Bornu une mainmise sur la route transsaharienne centrale."
 nd_kbu_diplomatic_network: "Réseau Diplomatique"
 nd_kbu_diplomatic_network_desc: "Bornu entretient une correspondance diplomatique avec l'Empire ottoman, les États haoussa et les royaumes d'Afrique du Nord, projetant ainsi son influence bien au-delà de ses frontières."
 nd_kbu_scorched_earth_tactics: "Tactiques de la Terre brûlée"
 nd_kbu_scorched_earth_tactics_desc: "Les soldats de Mai Alooma brûlent tout sur leur passage pendant les campagnes, privant leurs ennemis de nourriture et brisant leur volonté de résister."
 nd_kbu_fortified_cities: "Villes fortifiées"
 nd_kbu_fortified_cities_desc: "Earthen ramparts encircle Bornu's great cities, that of Ngazargamu stretching over six kilometers in circumference. Within them the mai's quarter is raised in fired red brick."
 nd_kbu_standardized_measures: "Mesures standardisées"
 nd_kbu_standardized_measures_desc: "Standard units of measure for grain and trade goods, introduced under Alooma, facilitate commerce and tax collection across the empire. Cotton strips of a fixed width serve as money.\n\n#italic Available in: $nd_kbu_cotton_weaving$#!"
 nd_kbu_kotoko_flotilla: "Flottille Kotoko"
 nd_kbu_kotoko_flotilla_desc: "Les bateliers Kotoko du lac Tchad assurent le transport fluvial, le soutien logistique et les capacités amphibies de l'armée du Bornu."
 nd_kbu_kola_nut_trade: "Commerce de noix de kola"
 nd_kbu_kola_nut_trade_desc: "Kola nuts from the southern forests are traded through Bornu's markets to destinations across the Sahara, prized as stimulants and ceremonial gifts."
 nd_kbu_legal_codification: "Codification juridique"
 nd_kbu_legal_codification_desc: "La codification de la loi islamique sous le Mais fournit un cadre juridique uniforme pour gouverner les territoires multiethniques du Bornu."
 nd_kbu_imperial_cavalry: "Cavalerie Impériale"
 nd_kbu_imperial_cavalry_desc: "The Bornu cavalry remains the backbone of the empire's military power, with generations of breeding producing the finest warhorses in the Sahel. The great fief holders ride to the muster with their followers in lebde, quilted armor that covers horse and man alike."
 nd_kbu_leather_workshops: "Ateliers du cuir"
 nd_kbu_leather_workshops_desc: "Les vastes troupeaux autour du lac Tchad fournissent une abondance de peaux, transformées dans les tanneries de Bornu en articles de cuir exportés à travers le réseau transsaharien."
 nd_kbu_scholarly_networks: "Réseaux scientifiques"
 nd_kbu_scholarly_networks_desc: "Les oulémas de Bornu entretiennent des liens avec les centres d'apprentissage islamique de Tombouctou au Caire, garantissant ainsi que l'empire suit le rythme des développements intellectuels à travers le monde musulman."
 nd_kbu_sayfawa_twilight: "Crépuscule de Sayfawa"
 nd_kbu_sayfawa_twilight_desc: "Après sept siècles de règne, la dynastie qui a régné le plus longtemps au monde est confrontée à des défis croissants liés aux divisions internes et aux menaces externes."
 nd_kbu_reformed_musketeers: "Mousquetaires réformés"
 nd_kbu_reformed_musketeers_desc: "Une nouvelle génération de mousquetaires Bornu, mieux entraînés et équipés que leurs prédécesseurs, prend le terrain pour défendre l'empire."
 nd_kbu_natron_monopoly: "Monopole Natron"
 nd_kbu_natron_monopoly_desc: "State control over natron extraction and export provides a steady revenue stream independent of the declining slave trade.\n\n#italic Available in: $nd_kbu_natron_works$#!"
 nd_kbu_agricultural_reforms: "Réformes agricoles"
 nd_kbu_agricultural_reforms_desc: "La réinstallation des agriculteurs sur de nouvelles terres et l'amélioration des systèmes d'irrigation du lac Tchad élargissent la base agricole de l'empire."
 nd_kbu_fortified_camps: "Camps fortifiés"
 nd_kbu_fortified_camps_desc: "Permanent military encampments with defensive walls project Bornu's power across its frontier territories.\n\n#italic Available in: $nd_kbu_war_camp$#!"
 nd_kbu_saharan_diplomacy: "Diplomatie saharienne"
 nd_kbu_saharan_diplomacy_desc: "La portée diplomatique de Bornu s'étend à travers le Sahara, entretenant des alliances et des relations commerciales de Tripoli jusqu'aux royaumes forestiers."
 nd_kbu_kanemi_defense: "Défense d'al-Kanemi"
 nd_kbu_kanemi_defense_desc: "Muhammad al-Kanemi's defense of Bornu against the Fulani jihad preserved the empire when all seemed lost, establishing a new dynasty of warrior-scholars. He won it with the Kanembu spearmen who followed him out of Kanem."
 nd_kbu_kukawa_metropolis: "Métropole de Kukawa"
 nd_kbu_kukawa_metropolis_desc: "The new capital of Kukawa grows into one of sub-Saharan Africa's greatest cities, a center of commerce, scholarship, and governance, laid out along its dendal."
 nd_kbu_shehu_administration: "Administration de Shehu"
 nd_kbu_shehu_administration_desc: "Les al-Kanemi Shehus gouvernent par l'intermédiaire du conseil du Majlis, apportant une administration efficace et une gouvernance collective pour remplacer l'ancien système Mai."
 nd_kbu_bornu_chronicles: "Chroniques de Bornou"
 nd_kbu_bornu_chronicles_desc: "La tradition du Diwan, la chronique royale de Bornu, et la tradition orale des girgam préservent un millénaire d'histoire, favorisant l'alphabétisation et l'identité culturelle."
 nd_kbu_trade_modernization: "Modernisation du commerce"
 nd_kbu_trade_modernization_desc: "New commercial infrastructure modernizes Bornu's trade networks, adapting centuries-old caravan routes to changing economic conditions."
 nd_kbu_majlis_governance: "Gouvernance du Majlis"
 nd_kbu_majlis_governance_desc: "Le conseil exécutif du Majlis, établi par al-Kanemi, institutionnalise le leadership collectif et la gouvernance méritocratique au Bornu."
 a_nd_kbu_kanembu_cavalry: "Cavalerie Kanembu"
 a_nd_kbu_kanembu_cavalry_desc: "Cavaliers blindés du peuple Kanembu, l'élite montée traditionnelle de l'empire Kanem-Bornu, combattant en cotte de mailles et avec des casques de fer."
 a_nd_kbu_iron_musketeer: "Mousquetaires de fer"
 a_nd_kbu_iron_musketeer_desc: "Les mousquetaires de Bornu, formés par des conseillers militaires ottomans, portent des casques de fer distinctifs et manient les armes à feu turques avec une précision mortelle."
 a_nd_kbu_camel_rider: "Chameau berbère"
 a_nd_kbu_camel_rider_desc: "Des chameaux endurcis par le désert, d'origine berbère, qui constituent la force de raid et de reconnaissance à longue portée de l'empire à travers le Sahara."
 a_nd_kbu_mailed_cavalry: "Cavalerie envoyée par courrier"
 a_nd_kbu_mailed_cavalry_desc: "L'élite de la cavalerie de Bornu, vêtue d'une cotte de mailles complète avec des casques de fer, montée sur des chevaux blindés élevés pour la charge."
 a_nd_kbu_lebde_cavalry: "Lebde Horse"
 a_nd_kbu_lebde_cavalry_desc: "Horsemen whose mounts and bodies are wrapped in lebde, thick quilted cotton stuffed with kapok. Arrows stick in it without reaching the man. It is also so heavy and so hot that these riders advance slowly and tire fast."
 a_nd_kbu_kotoko_boatmen: "Bateliers Kotoko"
 a_nd_kbu_kotoko_boatmen_desc: "Des fluviaux qualifiés du peuple Kotoko qui naviguent sur le lac Tchad et ses affluents, assurant la logistique amphibie et le transport fluvial."
 a_nd_kbu_bornu_musketeer: "Mousquetaires du Bornou"
 a_nd_kbu_bornu_musketeer_desc: "Les mousquetaires réformés du Bornu, disciplinés et bien entraînés, représentent le noyau modernisé de l'infanterie de l'empire."
 nd_kbu_natron_works: "Travaux de Natron"
 nd_kbu_natron_works_desc: "Installations d’extraction des précieux gisements de natron découverts autour du lac Tchad, produisant un produit clé pour le commerce transsaharien."
 nd_kbu_ribat: "Ribat"
 nd_kbu_ribat_desc: "Un poste frontière fortifié alliant garnison militaire et savoir islamique, gardant les frontières de l'empire tout en propageant la foi."
 nd_kbu_caravan_depot: "Dépôt de caravanes"
 nd_kbu_caravan_depot_desc: "Un relais et un marché pour les caravanes transsahariennes, fournissant des provisions, de l'eau et des installations commerciales aux marchands traversant le désert."
 nd_kbu_madrasa: "Sangaya"
 nd_kbu_madrasa_desc: "The Quran school of the Kanuri. Pupils come from far villages to board with a goni, a master who knows the whole Book by heart. They write each lesson on a wooden slate, wash it off when it is learned, and live on the alms of the town. Where a madrasa gathers scholars for the higher sciences, the sangaya teaches the Book itself to the sons of farmers and herdsmen."
 nd_kbu_cotton_weaving: "Maison de tissage de coton"
 nd_kbu_cotton_weaving_desc: "Un atelier où des tisserands qualifiés produisent le tissu de coton fin pour lequel Bornu est réputé dans le réseau commercial transsaharien."
 nd_kbu_walled_city: "Royal Brick Enclosure"
 nd_kbu_walled_city_desc: "Inside the earthen rampart of the city the mai's own quarter is walled in fired red brick, as at Birni Gazargamo and at Gambaru. The court, the Friday mosque and the armoury stand within it, and the city is ruled from behind its gates."
 nd_kbu_tannery: "Tannerie Bornu"
 nd_kbu_tannery_desc: "Un atelier de transformation des abondantes peaux des troupeaux pastoraux du lac Tchad en articles de maroquinerie destinés à l'exportation."
 nd_kbu_war_camp: "Camp de guerre fortifié"
 nd_kbu_war_camp_desc: "Un campement militaire permanent entouré de murs défensifs, projetant la puissance militaire de Bornu sur ses territoires frontaliers."
 nd_kbu_natron_processing_pm: "Traitement du natron"
 nd_kbu_natron_processing_pm_desc: "Extraire le natron des gisements d’argile riches en minéraux autour du lac Tchad et le raffiner en sel destiné au commerce."
 nd_kbu_ribat_upkeep: "Garnison de Ribat"
 nd_kbu_ribat_upkeep_desc: "Entretien des soldats et des fortifications d'un ribat frontalier."
 nd_kbu_caravan_supplies_pm: "Approvisionnement des caravanes"
 nd_kbu_caravan_supplies_pm_desc: "Fournir de la nourriture, de l'eau et des marchandises commerciales aux caravanes du désert."
 nd_kbu_quran_instruction_pm: "Instruction coranique"
 nd_kbu_quran_instruction_pm_desc: "The Quran is taught by heart from the wooden slate."
 nd_kbu_cotton_dyeing_pm: "Teinture du coton"
 nd_kbu_cotton_dyeing_pm_desc: "Filer du coton brut et le teindre avec de l'indigo et d'autres pigments pour tisser des tissus prisés dans le réseau commercial transsaharien."
 nd_kbu_mudbrick_walls_pm: "Brickwork Upkeep"
 nd_kbu_mudbrick_walls_pm_desc: "Bricks are fired and laid to keep up the walls and gates of the royal enclosure."
 nd_kbu_hide_tanning_pm: "Cacher le bronzage"
 nd_kbu_hide_tanning_pm_desc: "Salaison au sel et transformation des peaux d'animaux brutes en cuir fini destiné à l'exportation à travers le Sahara."
 nd_kbu_camp_provisioning_pm: "Approvisionnement du camp"
 nd_kbu_camp_provisioning_pm_desc: "Maintenir un camp militaire permanent approvisionné en armes et en provisions."
 nd_kbu_natron_export_pm: "Salt Cone Moulding"
 nd_kbu_natron_export_pm_desc: "Brine from the pans is run into moulds cut from palm trunks and dried into cones and cakes, the loads the salt caravans carry south."
 nd_kbu_gabaga_strip_pm: "Gabaga Strips"
 nd_kbu_gabaga_strip_pm_desc: "Narrow strips of undyed cotton are woven to a fixed width and length. They pass from hand to hand as money in the markets of Bornu."
 nd_kbu_fish_drying_pm: "Fish Smoking"
 nd_kbu_fish_drying_pm_desc: "The catch of the lake is split, salted, and smoked over wood fires, so that it keeps on the road to the inland markets."
 nd_kbu_dendal_upkeep: "Court Procession"
 nd_kbu_dendal_upkeep_desc: "Horses, robes, and meat for the courtiers who ride to the palace each morning."
 nd_kbu_fish_camp: "Lake Chad Fish Camp"
 nd_kbu_fish_camp_desc: "A camp of fishermen on a shore rich in fish, where the catch is smoked and dried for the caravans."
 nd_kbu_dendal: "Dendal"
 nd_kbu_dendal_desc: "The broad avenue of a Kanuri capital, running from the gate to the ruler's palace. The court rides along it and the market spreads beside it. It is found only in the capital."
 a_nd_kbu_kanembu_spearmen: "Kanembu Spearmen"
 a_nd_kbu_kanembu_spearmen_desc: "The Shehu's favorite troops: spearmen of the Kanembu who fight on foot in a close rank, behind tall shields cut from the light fogo wood that grows in the shallows of Lake Chad. They hold where horsemen scatter, but they bring spears to a field of muskets."
 levy_nd_kbu_lebde_cavalry: "Lebde Horse Levy"
 levy_nd_kbu_lebde_cavalry_desc: "The fief holders of Bornu and their mounted followers, called out in quilted armor."
 levy_nd_kbu_kanembu_spearmen: "Kanembu Spearmen Levy"
 levy_nd_kbu_kanembu_spearmen_desc: "Kanembu villagers called out with spear and fogo shield, as they were when al-Kanemi came out of Kanem."
 levy_nd_kbu_kanembu_cavalry: "Prélèvement de cavalerie Kanembu"
 levy_nd_kbu_kanembu_cavalry_desc: "Des cavaliers Kanembu blindés issus des domaines nobles et soldats pour servir d'avant-garde montée de l'empire."
 levy_nd_kbu_camel_rider: "Prélèvement sur le chameau berbère"
 levy_nd_kbu_camel_rider_desc: "Des chameaux du désert issus de populations tribales et militaires, capables d'effectuer des raids à longue portée à travers le Sahara."
 nd_kbu_formed_tt: "Le Kanem-Bornu est formé"
 nd_kbu_path_a_tt: "Choisissez l'Épée du Mai"
 nd_kbu_path_b_tt: "A choisi Carrefour du Sahara"

 # ===== DESTINY LOCALIZATION =====

 # Destiny advance names and descriptions
 nd_kbu_destiny: "La restauration du Kanem-Bornou"
 nd_kbu_destiny_desc: "L'ancien royaume des Sayfawa est réuni. Maintenez la stabilité et tracez la voie future de l’empire, que ce soit en tant qu’hégémon militaire ou carrefour commercial."

 nd_kbu_dest_hausa_conquest: "Les campagnes Haoussa"
 nd_kbu_dest_hausa_conquest_desc: "The wealthy Hausa city-states of Kano, Zaria and Katsina lie on our borders, their markets fat with goods and their walls ripe for siege. They are conquered and their wealth is brought under Bornu's lance."

 nd_kbu_dest_sahel_hegemony: "Hégémonie du Sahel"
 nd_kbu_dest_sahel_hegemony_desc: "Timbuktu, Gao and Djenne, the legendary cities of the western Sahel, are made to acknowledge Bornu's supremacy, and two thousand ducats are laid by. Dominion is claimed over the entire savanna belt."

 nd_kbu_dest_mediterranean_reach: "Du Tchad à la mer"
 nd_kbu_dest_mediterranean_reach_desc: "The trans-Saharan route ends on the Mediterranean at Tripoli and Misrata. Ghadames and both ports are taken, so that the entire caravan highway from Lake Chad to the sea is held."

 nd_kbu_dest_salt_monopoly: "Maîtres du commerce du sel"
 nd_kbu_dest_salt_monopoly_desc: "Le sel et le natron de Bilma transitent par nos marchés vers le monde entier. Adoptez le système bancaire moderne et garantissez notre monopole sur les artères commerciales du sel du Sahara central."

 nd_kbu_dest_trade_crossroads: "Carrefour continental"
 nd_kbu_dest_trade_crossroads_desc: "Ivory, cotton, kola nuts, and natron, Bornu sits at the center of Africa's greatest trade network. Bring ivory to our markets and build up Ngazargamu to 14 development, so that the capital becomes a true continental crossroads."
 nd_kbu_dest_ngazargamu_developed_tt: "We own #bold Ngazargamu#! and its development is at least #bold 14#!"
 nd_kbu_dest_bilma_developed_tt: "We own #bold Bilma#! and its development is at least #bold 10#!"

 nd_kbu_dest_saharan_master: "Master du Réseau Transsaharien"
 nd_kbu_dest_saharan_master_desc: "Every caravan crossing the Sahara passes through our markets. With cotton in our markets and the salt oasis of Bilma built up to 10 development, Bornu commands the commerce of an entire continent."

 # Destiny event text
 nd_kbu.6.t: "Le chemin du Kanem-Bornu"
 nd_kbu.6.d: "La réunification est complète. Le Maï trône à Ngazargamu, le girgam écrit un nouveau chapitre de la plus longue dynastie du monde et l'empire s'étend du Sahara à la savane. Maintenant, le véritable travail commence, transformant ce royaume restauré en quelque chose qui durera encore des siècles."
 nd_kbu.6.a: "L'empire est restauré."

 nd_kbu.7.t: "La chute des villes haoussa"
 nd_kbu.7.d: "Les murs de Kano ont été percés et les émirs de Zaria s'agenouillent devant les Maï. Les grandes cités-États haoussa, longtemps rivales du Bornu, se soumettent désormais à notre autorité. Leurs teintureries, leurs forges, leurs marchés foisonnants alimentent le trésor du Kanem-Bornu. Le Sahel tremble."
 nd_kbu.7.a: "Les Haoussa se soumettent à la puissance de Bornu."

 nd_kbu.8.t: "Hégémon du Sahel"
 nd_kbu.8.d: "De Tombouctou au lac Tchad, toute la ceinture sahélienne reconnaît la suprématie du Bornou. Les grandes villes commerçantes du Niger paient désormais tribut, et notre cavalerie patrouille sans contestation sur les routes des caravanes. Mais comment allons-nous maintenir ce vaste empire ? Devons-nous extraire des richesses par le biais de raids et d’hommages, ou mettre nos conquêtes en garnison avec des forces permanentes ?"
 nd_kbu.8.a: "Raid et hommage. Laissons les faibles nous soutenir."
 nd_kbu.8.b: "Garnison et fortification, retenez ce que nous avons gagné."

 nd_kbu.9.t: "Du lac Tchad à la Méditerranée"
 nd_kbu.9.d: "L'impossible a été réalisé. Les armées du Bornu ont traversé le Sahara lui-même, s'emparant des oasis du Fezzan et du port de Tripoli. Pour la première fois, une seule puissance contrôle l’ensemble de l’autoroute transsaharienne, depuis les rives du lac Tchad jusqu’à la mer Méditerranée. Les Mai du Kanem-Bornu dirigent désormais un empire qui s'étend sur le désert."
 nd_kbu.9.a: "Nous sommes l'empire qui relie deux mondes."
 nd_kbu.9.b: "Faites connaître à nos ennemis la terreur de Bornu."

 nd_kbu.10.t: "Seigneurs de la Route du Sel"
 nd_kbu.10.d: "Les caravanes de sel de Bilma sont l’élément vital du commerce transsaharien et elles transitent désormais entièrement par nos marchés. Grâce aux pratiques bancaires modernes adoptées par nos partenaires commerciaux méditerranéens, nous avons transformé Bornu d'une simple étape en centre financier du Sahara central."
 nd_kbu.10.a: "Le sel coule entre nos mains."

 nd_kbu.11.t: "Le carrefour continental"
 nd_kbu.11.d: "Ivoire du sud, natron du lac Tchad, coton de nos métiers à tisser, noix de cola des royaumes forestiers, toutes les principales denrées de l'Afrique intérieure transitent par les marchés du Bornu. Nous sommes devenus la plaque tournante incontournable du commerce continental, le carrefour où convergent les grandes routes commerciales de l’Afrique. Devons-nous donner à notre classe marchande les moyens de stimuler cette croissance, ou l’État percevra-t-il directement ses cotisations ?"
 nd_kbu.11.a: "Donnez du pouvoir aux commerçants. Laissez le commerce prospérer."
 nd_kbu.11.b: "L'État perçoit ses péages."

 nd_kbu.12.t: "Master du Réseau Transsaharien"
 nd_kbu.12.d: "Aucune caravane ne traverse le Sahara sans passer par nos marchés. Aucun commerçant n'atteint la Méditerranée sans notre accord. Bornu a réalisé ce qu’aucun autre État sahélien n’a pu réaliser : une domination commerciale totale sur le réseau transsaharien. Les richesses de deux continents coulent à travers le lac Tchad. Comment allons-nous utiliser ce pouvoir ?"
 nd_kbu.12.a: "Construisez un grand magasin sur les côtes du Tchad."
 nd_kbu.12.b: "Laissez nos caravanes transporter la diplomatie avec le commerce."

 # Timed modifier names and descriptions
 STATIC_MODIFIER_NAME_nd_kbu_dest_raider_economy: "Économie des pillards"
 STATIC_MODIFIER_DESC_nd_kbu_dest_raider_economy: "Le butin de guerre afflue dans le trésor de Bornu alors que les groupes de raids dépouillent les territoires conquis de leurs richesses, soutenant ainsi la machine militaire de l'empire."
 STATIC_MODIFIER_NAME_nd_kbu_dest_garrison_network: "Réseau de garnison"
 STATIC_MODIFIER_DESC_nd_kbu_dest_garrison_network: "Un réseau de garnisons permanentes à travers le Sahel sécurise les conquêtes de Bornu, avec des compagnies de mercenaires complétant la cavalerie impériale."
 STATIC_MODIFIER_NAME_nd_kbu_dest_saharan_empire: "Empire saharien"
 STATIC_MODIFIER_DESC_nd_kbu_dest_saharan_empire: "Empire s'étendant sur le désert, Bornu impose le respect de la Méditerranée à la savane, ses nobles menant de vastes levées à travers toutes les frontières."
 STATIC_MODIFIER_NAME_nd_kbu_dest_terror_of_the_sahel: "Terreur du Sahel"
 STATIC_MODIFIER_DESC_nd_kbu_dest_terror_of_the_sahel: "La réputation de Bornu en tant que puissance militaire implacable réduit la volonté de résistance des ennemis, alors que les renforts et les levées arrivent à une vitesse terrifiante."
 STATIC_MODIFIER_NAME_nd_kbu_dest_merchant_princes: "Princes marchands de Bornu"
 STATIC_MODIFIER_DESC_nd_kbu_dest_merchant_princes: "Une classe montante de riches marchands Bornu favorise l'intégration des peuples conquis par le biais du commerce partagé, leur prospérité bénéficiant à tous les domaines."
 STATIC_MODIFIER_NAME_nd_kbu_dest_toll_collectors: "Percepteurs du Sahara"
 STATIC_MODIFIER_DESC_nd_kbu_dest_toll_collectors: "Des collecteurs de péages nommés par l'État à chaque passage d'oasis et de marché veillent à ce que Bornu extraie sa part de chaque caravane et commerçant."
 STATIC_MODIFIER_NAME_nd_kbu_dest_lake_chad_emporium: "Magasin du lac Tchad"
 STATIC_MODIFIER_DESC_nd_kbu_dest_lake_chad_emporium: "Les rives du lac Tchad abritent l'un des plus grands magasins d'Afrique, où les marchandises de tout le continent changent de mains et où le libre-échange prospère sous la protection de Bornu."
 STATIC_MODIFIER_NAME_nd_kbu_dest_caravan_diplomacy: "Diplomatie des caravanes"
 STATIC_MODIFIER_DESC_nd_kbu_dest_caravan_diplomacy: "Les caravanes de Bornu transportent non seulement des marchandises mais aussi des missions diplomatiques, répandant la bonne volonté et l'innovation le long des routes commerciales qui relient le continent."

 # Destiny building names and descriptions
 nd_kbu_imperial_barracks: "Caserne Impériale"
 nd_kbu_imperial_barracks_desc: "Un grand complexe militaire où les soldats d'élite de Bornu s'entraînent aux armes à feu, aux tactiques de cavalerie et à la guerre de siège, maintenant ainsi l'avantage militaire de l'empire."
 nd_kbu_grand_caravansary: "Grand Caravansaire"
 nd_kbu_grand_caravansary_desc: "Un vaste complexe commercial au service des caravanes transsahariennes, avec des entrepôts, des écuries, des logements et des halles, le tout enfermé dans des murs fortifiés."

 # Building PM names and descriptions
 nd_kbu_barracks_training_pm: "Formation militaire"
 nd_kbu_barracks_training_pm_desc: "Entraîner les soldats aux tactiques interarmes en utilisant des armes à feu, des montures de cavalerie et du matériel de siège."
 nd_kbu_caravansary_operations_pm: "Opérations de caravaning"
 nd_kbu_caravansary_operations_pm_desc: "Entretenir les installations et les services d'approvisionnement des caravanes transsahariennes passant par Bornu."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_kbu_bureaucracy_authority: "Autorité judiciaire de Sayfawa"
 AUTO_MODIFIER_DESC_nd_kbu_bureaucracy_authority: "Once Kanem-Bornu has been restored, the institutions of the Sayfawa Mais, the Council of the Twelve, the Magira's court, the mamlukan corps, the royal chancery, and the pastoral compact, operate under the throne. With the slot that sharia law gives, three of these institutions may run at a time."

 kbu_council_of_twelve_bureaucracy: "Conseil des Douze"
 kbu_council_of_twelve_bureaucracy_desc: "Le noyau institutionnel de la gouvernance Sayfawa. Les Mai régnaient à travers douze grandes fonctions, le Galadima en tant que commandant des marches occidentales et chancelier, le Yerima en tant que gardien des routes du sel et gouverneur du nord, le Kaigamarama en tant que commandant du corps royal des esclaves, le Mestrema en tant que trésorier et maître des chevaux, le Cirima en tant que gardien des plus jeunes princes et les fonctions moindres régissant les quartiers de Birni Gazargamo. Chaque charge portait un fief et un siège au conseil ; la parole du Mai exigeait l'assentiment du conseil pour être contraignante dans la coutume."

 kbu_magira_court_bureaucracy: "Cour de Magira"
 kbu_magira_court_bureaucracy_desc: "La fonction institutionnalisée de reine-mère, exercée depuis le début de la période Kanem comme un contrôle constitutionnel sur les Mai. La Magira commandait son propre trésor, sa suite et son palais à Birni Gazargamo, et son consentement formel était requis pour l'intronisation d'un nouveau Mai. La titulaire la plus célèbre, Aisa Kili Ngirmaramma, gouverna Bornu en son propre nom en tant que régente c. 1564-70 pendant la minorité d'Idris Alooma et a négocié l'ambassade ottomane qui a amené des entraîneurs de mousquets turcs dans le royaume. L’institution était spécifique à Sayfawa et sans précédent dans l’ensemble du Sahel."

 kbu_mamlukan_corps_bureaucracy: "Mousquetaires mameloukans"
 kbu_mamlukan_corps_bureaucracy_desc: "Le corps d'infanterie de soldats esclaves fondé par Mai Idris Alooma après sa mission diplomatique de 1574 auprès du gouverneur ottoman de Tripoli, Mustafa Pacha. Les instructeurs turcs ont enseigné aux soldats esclaves de Bornu l'utilisation du fusil à mèche ; le corps était logé à la cour royale, tirait son sel et ses provisions des magasins des Mai et répondait au Kaigamarama plutôt qu'à un quelconque seigneur provincial. Le corps a brisé le Bulala à Garni Kiyala en 1577 et est resté l'épine dorsale des forces permanentes de Bornu jusqu'au jihad peul de 1808."

 kbu_sayfawa_girgam_bureaucracy: "Sayfawa Girgam"
 kbu_sayfawa_girgam_bureaucracy_desc: "Chancellerie en langue arabe et chronique royale des Sayfawa Mais, entretenue sans interruption du XIe siècle jusqu'à la chute de la dynastie. Le Girgam enregistrait l'adhésion, les campagnes, les mariages et les subventions de chaque Mai ; il fut complété par le Diwan salatin Bornu et par le Kitab ghazawat Idris d'Ahmad ibn Furtu, l'imam-chroniqueur de Mai. La chancellerie employait des scribes issus des oulémas et de la diaspora Wangara ; leurs brefs donnaient force juridique aux concessions royales et liaient les générations suivantes aux obligations de leurs pères."

 kbu_kambasokis_compact_bureaucracy: "Kambasokis Compact"
 kbu_kambasokis_compact_bureaucracy_desc: "L'accord de travail de tribut et de pâturage par lequel les Sayfawa Mais liaient au trône les peuples pasteurs du bassin, les Kanembu, les Toubou, les pêcheurs Buduma des îles du lac Tchad et les Touareg des marches du nord. Chaque peuple rendait un tribut annuel en bétail, en barres de sel, en esclaves ou en chevaux et une levée saisonnière de cavalerie ; en échange, les troupes des Mai maintenaient les puits ouverts, les pillards dehors et les rotations de pâturage étaient imposées. Le pacte était régi par le droit coutumier plutôt que par un code écrit et pesait surtout sur les cultivateurs sédentaires le long du Komadugu Yobe."
