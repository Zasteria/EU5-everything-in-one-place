l_french:
 STATIC_MODIFIER_NAME_nd_sea_kings_dominion: "Domination des Sea-Kings"
 STATIC_MODIFIER_DESC_nd_sea_kings_dominion: "Le royaume restauré de Dalriada règne sur les vagues entre l'Irlande et l'Écosse comme le faisaient autrefois ses ancêtres, commandant des flottes de galères rapides à travers les eaux dangereuses des îles."
 STATIC_MODIFIER_NAME_nd_light_of_iona: "Lumière d'Iona"
 STATIC_MODIFIER_DESC_nd_light_of_iona: "S'appuyant sur l'héritage de Columba et la grande tradition monastique, la Dalriada restaurée se consacre à l'érudition, à la préservation et à la diffusion de l'apprentissage gaélique à travers le monde connu."
 STATIC_MODIFIER_NAME_nd_drd_aedan_legacy: "L'héritage d'Aedan mac Gabrain"
 STATIC_MODIFIER_DESC_nd_drd_aedan_legacy: "Dans l'esprit d'Aedan mac Gabrain, dont les flottes s'étendaient des Orcades à l'île de Man, Dalriada réaffirme son commandement sur les mers occidentales."
 STATIC_MODIFIER_NAME_nd_drd_book_of_kells_spirit: "Esprit de la page illuminée"
 STATIC_MODIFIER_DESC_nd_drd_book_of_kells_spirit: "La tradition qui a donné naissance au Livre de Kells revit, alors que les scriptoria monastiques produisent des œuvres d'un talent artistique à couper le souffle et d'un apprentissage profond."
 nd_drd.1.t: "Le Royaume renaît"
 nd_drd.1.d: "The ancient kingdom of Dal Riata, which once bridged the sea between Ireland and Scotland, rises again. From the sacred hilltop of Dunadd where kings once placed their foot upon the inauguration stone, to the holy island of Iona where Columba lit the flame of learning, this land carries memories stretching back to the dawn of the Gaelic world.\n\nThe cenela (the great kin-groups who once mustered their galley fleets at the overking's call) look to us now. The Senchus fer nAlban, that ancient census of ships and men, speaks of a people whose power was measured not in fields and castles but in oars and keels. Yet Iona's monks also remind us that Dal Riata's truest legacy was the preservation of civilization itself through the long centuries of darkness.\n\nShall we be sea-kings, commanding the tides as Aedan mac Gabrain once did? Or shall we be keepers of the sacred flame, as Columba was?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_drd.1.a: "Commandez les mers comme le faisaient nos ancêtres"
 nd_drd.1.b: "Raviver la lumière de l'héritage de Columba"
 nd_drd.2.t: "Le rassemblement des galères"
 nd_drd.2.d: "The ancient Senchus fer nAlban (the Census of the Men of Scotland) prescribed that every twenty houses owed two seven-benched galleys to the overking's fleet. This system of naval obligation, unique among the kingdoms of Britain, made Dal Riata a maritime power whose reach far exceeded its modest territory.\n\nNow that Dalriada is reborn, the galley muster resumes. From Kintyre to the Outer Hebrides, from the Antrim coast to the islands of Lorne, the cenela prepare their birlinns and long fada for the overking's call. The sea roads that once connected this scattered kingdom are alive with traffic once more."
 nd_drd.2.a: "Que nos ennemis tremblent à la vue de nos voiles"
 nd_drd.2.b: "Laissez les moines enregistrer ce que nos marins découvrent"
 nd_drd.3.t: "La cour de Breithamh"
 nd_drd.3.d: "The ancient Gaelic legal tradition of the brehon (the breitheamh) has been restored under Dalriadic rule. Unlike the feudal courts of England and Scotland, where justice flows downward from the crown, the brehon system is rooted in communal arbitration. The breitheamh sits beneath the open sky, hearing disputes between clansmen, adjudicating cattle claims, and pronouncing judgments according to the Senchus Mor: the great ancient law.\n\nThis system of customary justice binds the clans together more effectively than any army. When a man knows his grievances will be heard fairly, he has no cause for rebellion."
 nd_drd.3.a: "La justice lie ce que la force ne peut pas"
 nd_drd.4.t: "La Renaissance gaélique"
 nd_drd.4.d: "A remarkable flowering of Gaelic literature is underway in the restored kingdom. Bardic poets compose elaborate praise-poems in the classical syllabic meters, while monastic scholars copy and annotate ancient texts. The tradition that produced the Book of Kells and the Annals of Ulster is reborn: not as mere imitation, but as a living continuation.\n\nNew works in Gaelic are being composed alongside translations from Latin, Greek, and even Arabic, brought by traders along the sea routes. The scriptoria of Dalriada are producing illuminated manuscripts that rival those of any European court."
 nd_drd.4.a: "Nos paroles survivront à nos épées"
 nd_drd_dunadd_seat: "Siège de Dunadd"
 nd_drd_dunadd_seat_desc: "La restauration de Dunadd en tant que centre royal, où les rois posent leur pied sur la pierre d'inauguration comme le faisaient leurs ancêtres, symbolisant la domination sur la terre."
 nd_drd_cattle_wealth: "Seigneurs du bétail de l'Ouest"
 nd_drd_cattle_wealth_desc: "Cattle are the true currency of the Gaelic world. The wealth of a clan chief is measured in the lowing of his herds, and the cattle raid remains the ultimate test of a warrior's boldness. The beasts rendered to the chief are gathered in his folds, and their hides are salted and cured there."
 nd_drd_columban_mission: "La mission colombienne"
 nd_drd_columban_mission_desc: "Suivant le chemin de saint Colomba, qui apporta la foi d'Irlande à Iona en 563, les missionnaires monastiques répandirent le christianisme et l'alphabétisation dans les Highlands et les îles de l'ouest."
 nd_drd_galley_service: "Service de galère de la Cenela"
 nd_drd_galley_service_desc: "Les Senchus fer nAlban prescrivaient des obligations navales pour chaque groupe familial cenela : deux galères à sept bancs pour vingt maisons. Ce service de galère fit de Dalriada une puissance maritime."
 nd_drd_cross_sea_clans: "Clans à travers la mer"
 nd_drd_cross_sea_clans_desc: "Le Canal du Nord n'est pas une barrière mais une autoroute reliant les tribus gaéliques de l'Irlande et de l'Écosse, permettant la libre circulation des personnes, des idées et des allégeances."
 nd_drd_tanistry_tradition: "Tradition de la Tanistrie"
 nd_drd_tanistry_tradition_desc: "La pratique gaélique de la tanistie sélectionne comme successeur le mâle adulte le plus compétent de la famille royale, assurant ainsi un leadership fort par le mérite plutôt que par l'ordre de naissance."
 nd_drd_island_fortification: "Fortification de l'île"
 nd_drd_island_fortification_desc: "Les îles et les lacs marins dispersés de l’ouest de l’Écosse offrent des positions défensives naturelles. Avec quelques hommes et un promontoire fortifié, un clan peut tenir tête à des forces dix fois supérieures à son effectif."
 nd_drd_monastic_scriptorium: "Scriptorium monastique"
 nd_drd_monastic_scriptorium_desc: "Dans la tradition d'Iona, les scriptoria monastiques produisent des manuscrits enluminés d'une beauté extraordinaire, préservant l'apprentissage classique tout en faisant progresser la culture littéraire gaélique."
 nd_drd_herring_fishery: "Pêche au hareng"
 nd_drd_herring_fishery_desc: "The rich herring runs of the Hebrides and the Minch sustain coastal communities and provide a valuable trade good, salted and exported to markets across northern Europe. Curing yards are raised on the sea lochs."
 nd_drd_cenela_muster: "Cenela Muster"
 nd_drd_cenela_muster_desc: "La formalisation du système de recrutement des cenela, dans lequel chaque groupe familial fournit des guerriers proportionnellement à ses foyers, crée un prélèvement fiable qui peut être rapidement constitué par voie maritime."
 nd_drd_lordship_customs: "Coutumes de la Seigneurie"
 nd_drd_lordship_customs_desc: "The overking's authority is reinforced through ancient customs of tribute and feasting, where clan chiefs gather to renew their bonds of obligation and settle disputes."
 nd_drd_mainland_expansion: "Diplomatie continentale"
 nd_drd_mainland_expansion_desc: "Dalriada étend son influence au-delà des îles grâce à un réseau minutieux d'alliances matrimoniales, d'arrangements familiaux et de traités diplomatiques avec les royaumes voisins."
 nd_drd_galley_warfare: "Guerre de galère"
 nd_drd_galley_warfare_desc: "L'évolution des tactiques navales dalriadiques, combinant la vitesse du Birlinn avec l'expertise en raids côtiers, produit un style de combat particulièrement adapté à la côte ouest parsemée d'îles."
 nd_drd_charter_market: "Marchés agréés"
 nd_drd_charter_market_desc: "The establishment of formal market rights at key coastal settlements transforms scattered island trade into a structured commercial network."
 nd_drd_plantation_system: "Expansion du pâturage dans les hautes terres"
 nd_drd_plantation_system_desc: "The systematic expansion of sheep and cattle grazing across the Highlands generates wool and livestock for export, though at the cost of displacing some traditional settlements. The townships full and dye the wool in their waulking houses."
 nd_drd_clan_justice: "Justice de clan"
 nd_drd_clan_justice_desc: "La codification des traditions du droit brehon dans un cadre juridique formel, administré par des juges breitheamh héréditaires, apporte de l'ordre dans le royaume sans détruire son caractère gaélique."
 nd_drd_statecraft: "Art politique gaélique"
 nd_drd_statecraft_desc: "Les diplomates dalriadiques, qui parlent couramment les tribunaux des mondes gaélique et anglophone, se révèlent habiles à monter les grandes puissances les unes contre les autres pour préserver l'indépendance du royaume."
 nd_drd_bardic_schools: "Écoles bardiques"
 nd_drd_bardic_schools_desc: "The formal training of file poets in the classical Gaelic syllabic tradition, requiring up to twelve years of study, produces a scholarly class whose works preserve history and glorify the realm.\n\n#italic Available in: $nd_drd_scriptorium$#!"
 nd_drd_armed_galleys: "Galères de guerre armée"
 nd_drd_armed_galleys_desc: "L'installation de canons à bord de la coque de galère traditionnelle produit un navire de guerre capable de naviguer dans les eaux rocheuses et peu profondes des Hébrides tout en lançant des bordées dévastatrices."
 nd_drd_highland_levy_reform: "Réforme des prélèvements dans les Highlands"
 nd_drd_highland_levy_reform_desc: "La réorganisation du système de prélèvement des clans introduit des normes d'équipement uniformes et des exercices réguliers, transformant les membres féroces mais indisciplinés du clan en soldats fiables."
 nd_drd_cattle_drove_roads: "Routes de passage du bétail"
 nd_drd_cattle_drove_roads_desc: "Le développement de routes formelles permet aux bovins des Highlands d'être acheminés à pied vers les marchés des basses terres en grands troupeaux, reliant ainsi l'économie pastorale à des réseaux commerciaux plus larges."
 nd_drd_maritime_law: "Droit maritime des îles"
 nd_drd_maritime_law_desc: "Un système codifié de droit maritime régit le commerce, les droits de pêche et les obligations navales sur l’ensemble des territoires insulaires, mettant de l’ordre sur la côte ouest."
 nd_drd_gaelic_colleges: "Collèges gaéliques"
 nd_drd_gaelic_colleges_desc: "Les établissements formels d’enseignement supérieur, enseignant le gaélique aux côtés du latin et des langues modernes, produisent une classe administrative instruite, capable de gouverner un État moderne."
 nd_drd_clan_regiment: "Régiments de clans"
 nd_drd_clan_regiment_desc: "L'organisation des guerriers claniques traditionnels en structures régimentaires formelles, conservant leur féroce esprit de corps tout en acquérant la discipline de la guerre moderne."
 nd_drd_kelp_industry: "Industrie du varech"
 nd_drd_kelp_industry_desc: "The harvesting and burning of seaweed along the western coasts produces alkali essential for soap and glass manufacturing, providing a new source of industrial wealth. Kilns are dug along the shore, and glasshouses beside them work with the ash."
 nd_drd_gaelic_literary_revival: "Renouveau littéraire gaélique"
 nd_drd_gaelic_literary_revival_desc: "A conscious effort to collect, preserve, and publish the oral traditions of the Gaelic world produces a literary renaissance, asserting the cultural vitality of the Highland tradition.\n\n#italic Available in: $nd_drd_scriptorium$#!"
 nd_drd_emigrant_networks: "Réseaux d'émigrants"
 nd_drd_emigrant_networks_desc: "Gaelic emigrants across the Atlantic maintain strong connections to their homeland, creating commercial networks that channel wealth and ideas back to Dalriada.\n\n#italic Available in: $nd_drd_drove_station$#!"
 nd_drd_modern_fleet: "Flotte moderne"
 nd_drd_modern_fleet_desc: "Le passage des galères à rames aux voiliers modernes, construits dans les chantiers navals de la côte ouest, dote Dalriada d'une marine adaptée à l'ère de la vapeur."
 nd_drd_dun: "Dun"
 nd_drd_dun_desc: "Une forteresse fortifiée au sommet d'une colline dans l'ancienne tradition gaélique, dominant le terrain environnant depuis sa position élevée. Le plus grand dun de tous était Dunadd, siège des rois de Dalriada."
 nd_drd_scriptorium: "Scriptorium monastique"
 nd_drd_scriptorium_desc: "Un atelier au sein d'un monastère ou d'une maison religieuse dédié à la copie et à l'enluminure de manuscrits, poursuivant la tradition qui a produit le Livre de Kells."
 nd_drd_clan_hall: "Salle des clans"
 nd_drd_clan_hall_desc: "Le lieu de rassemblement du chef du clan et de ses hommes dirigeants, où les différends sont réglés par la loi brehon, où les alliances sont forgées autour de l'hydromel et où les affaires du clan sont administrées."
 nd_drd_galley_haven: "Havre de galère"
 nd_drd_galley_haven_desc: "Un mouillage côtier abrité équipé de cales de halage et d'installations de réparation pour la flotte de galères de Birlinn, servant à la fois de base navale et de plaque tournante du commerce côtier."
 nd_drd_drove_station: "Gare conduite"
 nd_drd_drove_station_desc: "Un relais le long des routes de passage du bétail où les troupeaux se reposent, s'abreuvent et font du commerce, reliant l'économie pastorale des Highlands aux marchés des basses terres et d'outre-mer."
 nd_drd_dun_maintenance: "Entretien des Dunes"
 nd_drd_dun_maintenance_desc: "Entretenir les murs de pierre, les palissades et les magasins d'armes de la forteresse perchée."
 nd_drd_cattle_tribute: "Traitement des hommages au bétail"
 nd_drd_cattle_tribute_desc: "The cattle rendered to the chief are slaughtered at Martinmas, and their hides are salted and cured into leather."
 nd_drd_cattle_fold: "Cattle Fold"
 nd_drd_cattle_fold_desc: "A stone-walled buaile on the hill pasture, where the cattle owed to the chief are gathered, counted and slaughtered. Rent, tribute and the fines of the breitheamh are all reckoned in cows."
 nd_drd_herring_station: "Herring Station"
 nd_drd_herring_station_desc: "Curing yards on the shore of a sea loch. The catch of the Minch and Loch Fyne is gutted, salted and packed in barrels for the markets of the Baltic and the Lowlands."
 nd_drd_herring_curing: "Herring Curing"
 nd_drd_herring_curing_desc: "Herring are gutted within a day of landing, salted and packed tight in barrels."
 nd_drd_waulking_house: "Waulking House"
 nd_drd_waulking_house_desc: "The taigh-luaidh of a township. The web is soaked and beaten by hand on a long board to the rhythm of the waulking songs, then dyed with crotal and heather."
 nd_drd_kelp_kiln: "Kelp Kiln"
 nd_drd_kelp_kiln_desc: "Stone-lined trenches above the tide mark. Tangle cut at low water is dried and burnt to a hard ash, the alkali of the glassmaker and the soap boiler, and a glasshouse beside the kilns uses it on the spot."
 nd_drd_kelp_glass: "Kelp Glass"
 nd_drd_kelp_glass_desc: "Sand is melted with the ash of burnt kelp into bottle and window glass."
 nd_drd_gaelic_press: "Gaelic Press"
 nd_drd_gaelic_press_desc: "A hand press beside the writing room sets the collected songs, tales and genealogies of the Gaels in type."
 nd_drd_scriptorium_maintenance: "Entretien du Scriptorium"
 nd_drd_scriptorium_maintenance_desc: "Fournir aux scribes du vélin, des pigments et des bougies en cire d'abeille pour leur travail minutieux."
 nd_drd_manuscript_production: "Enluminure de manuscrit"
 nd_drd_manuscript_production_desc: "The scribes turn from copying for their own house to illuminated books for patrons, in the Celtic tradition of intricate knotwork around religious and scholarly texts."
 nd_drd_clan_hall_maintenance: "Entretien de la salle du clan"
 nd_drd_clan_hall_maintenance_desc: "Entretenir la halle aux bois, organiser des fêtes pour les membres du clan en visite et faire couler l'hydromel lors des réunions du conseil."
 nd_drd_highland_wool: "Tissage de laine des Highlands"
 nd_drd_highland_wool_desc: "The weaving and waulking of distinctive Highland cloth from the abundant wool of mountain sheep, dyed in the tartans and plaids of the Gaelic clans."
 nd_drd_galley_haven_maintenance: "Entretien de Galley Haven"
 nd_drd_galley_haven_maintenance_desc: "Entretenir les cales de halage, les réserves de goudron et les fournitures de gréement nécessaires au maintien de la navigabilité de la flotte de Birlinn."
 nd_drd_drove_station_maintenance: "Entretien de la gare routière"
 nd_drd_drove_station_maintenance_desc: "Entretenir les enclos, les abreuvoirs et les magasins nécessaires au maintien du commerce de l'élevage du bétail."
 nd_drd_hide_tanning: "Tannage des peaux des Highlands"
 nd_drd_hide_tanning_desc: "Le salage et le tannage des peaux de bétail sont issus du commerce du bétail, produisant du cuir destiné à l'exportation vers les marchés des plaines et du continent."
 a_nd_drd_kern: "Tirailleurs de Kern"
 a_nd_drd_kern_desc: "Infanterie de raid au pied léger, armée de javelots et d'épées courtes, les kern sont les troupes de choc de la guerre gaélique : rapides, féroces et totalement intrépides."
 a_nd_drd_ceithern: "Ceithern à Coille"
 a_nd_drd_ceithern_desc: "Guerriers des bois qui exploitent les forêts et les terrains accidentés des hautes terres de l'ouest avec un effet dévastateur, tendant des embuscades à leurs ennemis dans des endroits où une armure lourde constitue un handicap."
 n_nd_drd_war_galley: "Galère de guerre dalriadique"
 n_nd_drd_war_galley_desc: "Un navire de guerre spécialement construit combinant le faible tirant d'eau et la vitesse du Birlinn traditionnel avec un canon monté, conçu pour les raids et la guerre côtière sur la côte ouest parsemée d'îles."
 levy_nd_drd_kern: "Kern Lévy"
 levy_nd_drd_kern_desc: "Un rassemblement de tirailleurs kern aux pieds légers issus des terres du clan, combattant dans la tradition des raids rapides de l'ouest gaélique."
 levy_nd_drd_ceithern: "Ceithern Levy"
 levy_nd_drd_ceithern_desc: "Une troupe forestière composée de guerriers en embuscade, recrutés dans les vallons boisés et entraînés aux tactiques de frappe et de disparition des hautes terres de l'ouest."
 nd_drd_formed_tt: "Formé#bold Dalriada#!"
 nd_drd_path_a_tt: "Choisissez le destin#bold Tides of Dominion#!"
 nd_drd_path_b_tt: "Choisissez le destin#bold Flame of Learning#!"
 nd_drd_destiny: "Destin de Dalriada"
 nd_drd_destiny_desc: "Le royaume restauré se trouve à la croisée de son destin. L'ancien siège de Dunadd vous attire, et les cenela attendent la vision de leur roi pour le royaume."
 nd_drd.5.t: "La vision d'Overking"
 nd_drd.5.d: "Depuis le sommet de Dunadd, où l'empreinte de l'inauguration est gravée dans la roche vivante, nous examinons le royaume actuel et le royaume qui pourrait être. Les routes maritimes s'étendent dans toutes les directions : à l'ouest jusqu'à l'Atlantique, au nord jusqu'aux terres nordiques, à l'est jusqu'au continent écossais, au sud jusqu'à l'Irlande. La question n’est pas de savoir si Dalriada va monter, mais jusqu’où."
 nd_drd.5.a: "Notre destin attend"
 nd_drd_dest_northern_isles: "Sécuriser les îles du Nord"
 nd_drd_dest_northern_isles_desc: "Pour commander les mers occidentales, Dalriada doit d'abord contrôler les détroits et les passages qui gardent les approches nord. Les Orcades et la côte du Lothian sont les clés de cette domination."
 nd_drd.6.t: "Le passage du Nord sécurisé"
 nd_drd.6.d: "The longships of Dalriada now patrol the waters around Orkney, and our banner flies over Edinburgh's rock. The Norse jarls who once raided our coasts with impunity now treat with us as equals. The Pentland Firth (that treacherous strait between Scotland and Orkney) is ours to command.\n\nWith the northern approaches secured, the western seaboard lies open before us. No ship passes between the Atlantic and the North Sea without Dalriadic leave."
 nd_drd.6.a: "Les routes maritimes sont à nous"
 nd_drd_dest_western_seas: "Commandement des mers occidentales"
 nd_drd_dest_western_seas_desc: "Une fois les passages du nord sécurisés, Dalriada oriente ses flottes vers un horizon plus large. Les ports nordiques et la côte anglaise doivent reconnaître la suprématie dalriadique sur les mers occidentales."
 nd_drd.7.t: "Maîtres de la mer occidentale"
 nd_drd.7.d: "Dalriadic longships range from Stavanger to York, from the Faroes to the Irish Sea. What began as a scattered island kingdom has become a maritime power that rivals the Norse and English fleets. Our birlinns are feared in every harbor from Norway to Northumbria.\n\nBut how shall we use this dominion? Some captains urge continued raiding: the old Gaelic tradition of plunder and glory. Others see richer prizes in controlling the sea lanes themselves, extracting tolls and establishing trade monopolies."
 nd_drd.7.a: "Laissons nos pillards mettre à nu les côtes"
 nd_drd.7.b: "Contrôlez les voies commerciales, contrôlez la richesse"
 STATIC_MODIFIER_NAME_nd_drd_dest_sea_raider: "Fléau des Côtes"
 STATIC_MODIFIER_DESC_nd_drd_dest_sea_raider: "Les raiders dalriadiques terrorisent les côtes du nord de l'Europe, frappant rapidement et disparaissant avant qu'une quelconque réponse puisse être organisée."
 STATIC_MODIFIER_NAME_nd_drd_dest_trade_hegemon: "Seigneurs des voies maritimes"
 STATIC_MODIFIER_DESC_nd_drd_dest_trade_hegemon: "Dalriada contrôle les voies maritimes vitales de l'Atlantique Nord, imposant des péages à chaque navire marchand qui traverse ses eaux."
 nd_drd_dest_atlantic_havens_tt: "#bold Galley Havens#! stand in at least #bold 4#! owned locations"
 nd_drd_dest_atlantic_lord: "Seigneur de l'Atlantique"
 nd_drd_dest_atlantic_lord_desc: "The ultimate ambition of the sea-kings: dominion over the Atlantic from the Faroes to the Norwegian coast, making Dalriada the undisputed master of the northern seas. Galley Havens stand in four of its harbours."
 nd_drd.8.t: "Seigneur de l'Atlantique"
 nd_drd.8.d: "From Torshavn to Bergen, from the Hebrides to the Orkneys, the banner of Dalriada flies over every harbor and headland of the North Atlantic. What the Norse achieved through centuries of raiding and settlement, Dalriada has accomplished through the unity of its Gaelic seafaring tradition.\n\nThe question now is what form this Atlantic dominion will take. Shall we build an invincible war fleet to defend our vast maritime realm by force of arms? Or shall we consolidate these far-flung territories into a true Atlantic empire, with settlers and administrators binding the islands to the crown?"
 nd_drd.8.a: "Construisez une flotte pour assombrir l'horizon"
 nd_drd.8.b: "Reliez les îles de l’Atlantique en un seul royaume"
 STATIC_MODIFIER_NAME_nd_drd_dest_storm_fleet: "La flotte de tempête"
 STATIC_MODIFIER_DESC_nd_drd_dest_storm_fleet: "Dalriada possède la force navale la plus redoutable de l'Atlantique Nord, une flotte endurcie par les tempêtes de l'Atlantique et composée des meilleurs marins gaéliques."
 STATIC_MODIFIER_NAME_nd_drd_dest_atlantic_empire: "Empire atlantique"
 STATIC_MODIFIER_DESC_nd_drd_dest_atlantic_empire: "Les colons et administrateurs dalriadiques unissent les îles dispersées de l'Atlantique en un royaume unifié, s'étendant des Féroé à la côte nordique."
 nd_drd_dest_monastic_revival: "Renaissance monastique"
 nd_drd_dest_monastic_revival_desc: "Reviving the scholarly tradition of Iona requires institutional foundations. The embrace of banking provides the wealth to endow monasteries and scriptoria across the realm, and Mull, with the abbey of Iona off its shore, is held and built up."
 nd_drd_dest_iona_developed_tt: "#bold Mull#!, the island of Iona's abbey, is owned directly and has at least #bold 8#! development"
 nd_drd.9.t: "La renaissance des Scriptoria"
 nd_drd.9.d: "Across the islands and glens of Dalriada, the sound of quill on vellum echoes once more. In stone-walled scriptoria warmed by peat fires, monks and scholars copy ancient texts, illuminate manuscripts with the intricate knotwork designs of their ancestors, and compose new works in the Gaelic tongue.\n\nThe tradition that gave the world the Book of Kells and the Book of Durrow lives again: not as antiquarian imitation, but as a living scholarly culture that engages with the wider world of European learning."
 nd_drd.9.a: "Que la lumière de l’apprentissage brille à nouveau"
 nd_drd_dest_gaelic_letters: "Lettres gaéliques"
 nd_drd_dest_gaelic_letters_desc: "La diffusion de l'imprimerie transforme la tradition monastique de Dalriada en une culture littéraire plus large, produisant des œuvres qui transmettent la pensée gaélique à un public continental."
 nd_drd.10.t: "La presse gaélique"
 nd_drd.10.d: "The arrival of the printing press in Dalriada creates a revolution. Where once a single manuscript took months of painstaking labor, now hundreds of copies can be produced in weeks. The bardic schools and monastic scriptoria adapt swiftly, seeing the press not as a threat to their tradition but as its fulfillment.\n\nGaelic grammars, histories, and poetry pour from the new presses. But debate rages over the direction of this literary flowering. The bardic schools argue for preserving the classical syllabic traditions, while the monastic scholars advocate for broader engagement with the European world."
 nd_drd.10.a: "Préserver la tradition bardique sous forme imprimée"
 nd_drd.10.b: "Diffuser nos apprentissages à travers les réseaux monastiques"
 STATIC_MODIFIER_NAME_nd_drd_dest_bardic_tradition: "Héritage du fichier"
 STATIC_MODIFIER_DESC_nd_drd_dest_bardic_tradition: "Les écoles bardiques préservent et propagent la tradition littéraire gaélique classique à travers le nouveau support imprimé, maintenant la continuité culturelle tout en atteignant un public plus large."
 STATIC_MODIFIER_NAME_nd_drd_dest_monastic_network: "Commonwealth monastique"
 STATIC_MODIFIER_DESC_nd_drd_dest_monastic_network: "Les monastères dalriadiques forment un réseau d'apprentissage s'étendant à travers l'Europe du Nord, partageant des textes et des érudits dans la tradition de la peregrinatio de Columba."
 nd_drd_dest_light_of_west: "Lumière de l'Occident"
 nd_drd_dest_light_of_west_desc: "The capstone of the Iona tradition: Dalriada becomes a beacon of learning whose scholars and institutions rival any in Europe. Scriptoria work in four of its towns. Derry, the oak grove where Columba founded his first house, is held and built up to twice what it was."
 nd_drd_dest_derry_developed_tt: "#bold Derry#! is owned directly and has at least #bold 24#! development"
 nd_drd.11.t: "Lumière du monde occidental"
 nd_drd.11.d: "What Iona was to the Dark Ages, Dalriada has become to the age of the printed book. Its colleges produce scholars whose works are read from Edinburgh to Constantinople. Its printing presses disseminate knowledge in Gaelic, Latin, and the modern tongues. Its monastic libraries (descendants of the scriptoria that preserved civilization during Europe's darkest hours) now house collections that rival the great continental universities.\n\nThis intellectual flowering must now find its fullest expression. Shall we channel our scholarly energies toward a great renaissance of Gaelic culture itself? Or shall we open our doors to the wider world, making Dalriada a crossroads of universal knowledge?"
 nd_drd.11.a: "Une renaissance gaélique pour les âges"
 nd_drd.11.b: "Devenez le carrefour de tous les savoirs"
 STATIC_MODIFIER_NAME_nd_drd_dest_gaelic_renaissance: "Renaissance gaélique"
 STATIC_MODIFIER_DESC_nd_drd_dest_gaelic_renaissance: "Une floraison consciente de la culture gaélique sous toutes ses formes (littérature, musique, droit et philosophie) affirme la vitalité durable de la tradition celtique."
 STATIC_MODIFIER_NAME_nd_drd_dest_wisdom_tradition: "Tradition de sagesse"
 STATIC_MODIFIER_DESC_nd_drd_dest_wisdom_tradition: "Dalriada devient un centre d'apprentissage universel, où les érudits de toutes traditions se réunissent pour partager leurs connaissances comme ils le faisaient autrefois à l'époque monastique."
 nd_drd_birlinn_arsenal: "Arsenal de Birlinn"
 nd_drd_birlinn_arsenal_desc: "Un grand chantier naval et une armurerie dédiés à la construction et à l'équipement de la flotte de guerre dalriadique, combinant les bateaux de construction de galères gaéliques traditionnels avec la technologie navale moderne."
 nd_drd_birlinn_arsenal_maintenance: "Entretien de l'arsenal"
 nd_drd_birlinn_arsenal_maintenance_desc: "Entretenir les cales de halage, les forges et les magasins de bois de l'arsenal naval royal."
 nd_drd_great_library: "Grande Bibliothèque de Dalriada"
 nd_drd_great_library_desc: "Un grand référentiel d'apprentissage dans la tradition d'Iona, abritant des manuscrits, des volumes imprimés et des travaux scientifiques du monde connu."
 nd_drd_great_library_maintenance: "Entretien de la bibliothèque"
 nd_drd_great_library_maintenance_desc: "Entretenir les collections, employer des scribes et des érudits et acheter de nouveaux ouvrages pour la bibliothèque."

 # === BUREAUCRACIES ===

 AUTO_MODIFIER_NAME_nd_drd_bureaucracy_authority: "Autorité du Royaume Renaît"
 AUTO_MODIFIER_DESC_nd_drd_bureaucracy_authority: "The restored Dalriadic crown gathers up the institutional inheritance of the Gaelic and Insular world: the muster-rolls of the Senchus, the courts of the breitheamh, the council at Finlaggan, the paruchia of Iona. Three of these old offices can be kept alive at any one time."

 senchus_fer_nalban_bureaucracy: "Senchus fer nAlban"
 senchus_fer_nalban_bureaucracy_desc: "Compilé au VIIe siècle et survivant dans une recension du Xe siècle, le Senchus fer nAlban (\"History of the Men of Scotland\") was both genealogy and naval levy register. It prescribed two seven-benched ships from every twenty households of the cenela, an obligation unique among the kingdoms of Britain. Revived as the muster-roll of the reborn sea-kingdom, the Senchus translates Dalriada's coast-and-island geography into permanent fleet manpower under the over-king's call."

 brehon_law_court_bureaucracy: "Cour du Breithamh"
 brehon_law_court_bureaucracy_desc: "Les breitheamh, juristes héréditaires de l'Irlande gaélique et des Highlands, ont été formés pendant vingt ans au droit coutumier des Senchus Mor. Ils étaient assis à ciel ouvert, arbitrent les réclamations concernant le bétail, les paiements d'Eric et les conflits d'héritage par un précédent plutôt que par un décret royal. Leurs tribunaux fonctionnaient parallèlement à ceux du roi, absorbaient des griefs qui autrement se seraient transformés en rébellion et survécurent dans l'Irlande gaélique jusqu'au XVIIe siècle avant que l'Affaire Tanistry ne les abolisse en 1608."

 council_of_the_isles_bureaucracy: "Conseil des îles"
 council_of_the_isles_bureaucracy_desc: "Depuis sa première charte sous Jean d'Islay jusqu'à sa confiscation sous Jacques IV en 1493, le Comhairle nan Eilean s'est réuni sur Eilean na Comhairle dans le Loch Finlaggan. Quatre grands chefs (les Maclean de Duart et Lochbuie, et les Macleod de Harris et Lewis), quatre petits thanes et quatre parents du clan Donald délibèrent sous la présidence du seigneur, règlent les différends entre les clans et engagent la diplomatie et le poids militaire de la seigneurie. Le conseil était le parlement le plus développé de la Grande-Bretagne gaélique, et sa restauration impose à la couronne les mêmes contraintes que sa forme médiévale imposait au seigneur des îles."

 buannacht_quartering_bureaucracy: "Buannacht et Coinnmheadh"
 buannacht_quartering_bureaucracy_desc: "Le buannacht, que les colons anglais anglicisaient sous le nom de bonaght, était le cess par lequel les chefs gaéliques cantonnaient leurs potences et leurs troupes de maison sur le tuath. Le corpus Brehon connaissait la pratique sous le nom de coinnmheadh ​​; les sources anglo-normandes le rendaient comme coyne et livrée. Le bœuf, la bière, l'avoine et le logement nourrissaient une suite permanente sans jamais passer par un trésor, et un seigneur militaire fort pouvait l'exiger aussi souvent qu'il avait des soldats pour le faire respecter. C'était l'impôt le plus important de l'Irlande et des Hébrides de la fin du Moyen Âge, et le principal instrument par lequel les chefs maintenaient leurs armées sur le dos du pays."

 paruchia_of_iona_bureaucracy: "Paruchie d'Iona"
 paruchia_of_iona_bureaucracy_desc: "La paruchia Columbae était la fédération de monastères fondée à partir d'Iona sous la succession abbatiale de Colum Cille (Saint Columba, décédé en 597), s'étendant à travers l'Argyll, les Hébrides et l'Irlande du Nord. Il n'a pas pris la forme territoriale diocésaine du christianisme romain ; c'était un réseau personnel et monastique à travers lequel l'érudition, les manuscrits enluminés et l'autorité ecclésiastique remontaient à la maison mère d'Iona. Les Annales d'Ulster et le Livre de Kells étaient tous deux des produits de ses scriptoria, et sa décadence en abbayes laïques héréditaires (les coarbs et les erenaghs) est le récit édifiant de toute institution cléricale laissée non entretenue."
