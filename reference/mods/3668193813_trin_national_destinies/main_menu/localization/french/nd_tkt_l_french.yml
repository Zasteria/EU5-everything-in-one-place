l_french:
 # ============================================================
 # Knights of the Temple (TKT): Localization
 # Country name and adjective live in nd_tkt_country_l_english.yml
 # ============================================================

 # === Formation event ===
 nd_tkt.1.t: "La croix à huit pointes refondée"
 nd_tkt.1.d: "The papal bull #bold Vox in excelso#! is lifted. The Pauperes Commilitones Christi Templique Salomonici, dissolved by Clement V at Vienne in 1312 and stripped from Aragon and Portugal a generation later, are refounded as a sovereign brotherhood. The Castelo dos Templarios above the Nabantia hill is ours; Peniscola or Monzon stands in our name; the Treasurer's chest is opened.\n\nBefore the chapter sits a question that has waited a hundred years. Are we the Old Order, the secret-chapter Templars whose bills of exchange once spanned Christendom and whose Latin Rule was written by Bernard of Clairvaux? Or are we the New Order of Christ, publicly papal-sanctioned, the Atlantic mandate of Henry of Sagres made our institutional heart?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tkt.1.a: "L'Ordre Ancien Restauré : la Règle de Bernard, le chapitre secret, le Beausant relevé."
 nd_tkt.1.b: "Le Nouvel Ordre du Christ : croix du Christ à la voile, mandat atlantique, réforme papale."

 # === Formation timed modifiers ===
 STATIC_MODIFIER_NAME_nd_tkt_old_order_restored: "L'ordre ancien restauré"
 STATIC_MODIFIER_DESC_nd_tkt_old_order_restored: "La dissolution est annulée. Les frères chevaliers prêtent les serments les plus anciens sous des portes scellées ; le gonfanon de Beausant s'élève au-dessus de la colline de Nabantia ; le coffre du Trésorier général est descellé sous sa forme médiévale. La confrérie est à la fois crainte et isolée."
 STATIC_MODIFIER_NAME_nd_tkt_order_of_christ: "Le nouvel ordre du Christ"
 STATIC_MODIFIER_DESC_nd_tkt_order_of_christ: "La réforme est acceptée. La croix du Christ évasée remplace l'ancien emblème sur chaque voile ; le mandat atlantique d'Henri de Sagres devient le cœur institutionnel de l'Ordre ; les postulants étrangers sont admis ; les lettres de change circulent sous sceau papal à travers l’Europe catholique."

 # === DHE 2: Tomar Convent ===
 nd_tkt.2.t: "Le Château des Templiers"
 nd_tkt.2.d: "Le plan du XIIe siècle de maître Gualdim Pais est enfin terminé. Le couvent-forteresse annelé de la colline de Nabantia est terminé : la rotonde Charola, la salle capitulaire, le cloître du Cimetière, la grande citerne. Depuis le donjon, la croix à huit pointes domine la moitié de la péninsule ibérique. La confrérie a son cœur visible."
 nd_tkt.2.a: "Construisez-le comme Bernard l’avait prévu."
 STATIC_MODIFIER_NAME_nd_tkt_castelo_templario: "Château Templier"
 STATIC_MODIFIER_DESC_nd_tkt_castelo_templario: "La conception de Maître Gualdim est terminée. Le couvent-forteresse de Tomar constitue le cœur institutionnel et cérémonial de la confrérie."

 # === DHE 3: Bills of Exchange ===
 nd_tkt.3.t: "Le coffre du trésorier réouvert"
 nd_tkt.3.d: "L'invention médiévale des Templiers est relancée dans nos chambres. Un pèlerin ou un facteur génois dépose de l'argent à la commanderie de Tomar et retire des lingots à Saragosse, à Lyon ou à Acre, le tout sous le sceau du trésorier général. Le couvent débat de la nature de son prêt : un document sobre qui soutient le nom de l'Ordre, ou un coffre agressif qui remplit les coffres mais expose l'argent au défaut."
 nd_tkt.3.a: "Prêts sobres : le mandat du trésorier vaut de l'or."
 nd_tkt.3.b: "Prêts agressifs : le coffre d’argent est grand ouvert."
 STATIC_MODIFIER_NAME_nd_tkt_treasurers_writ: "Le bref du trésorier"
 STATIC_MODIFIER_DESC_nd_tkt_treasurers_writ: "Lettres de change sous la surveillance conservatrice du Trésorier général. Les prêts sont restreints ; le nom du couvent est précieux dans toute l'Europe catholique."
 STATIC_MODIFIER_NAME_nd_tkt_silver_chest: "Le coffre d'argent"
 STATIC_MODIFIER_DESC_nd_tkt_silver_chest: "Prêts templiers agressifs : les princes, les évêques et les maisons italiennes empruntent dans les chambres du couvent. Les rendements sont plus élevés ; l'argent est exposé."

 # === DHE 4: Sagres Mandate ===
 nd_tkt.4.t: "Le mandat de Sagres"
 nd_tkt.4.d: "L'école de navigation du Cap Sagres est financée par les chambres du couvent, comme Henri du Portugal l'a financée par l'Ordre du Christ dans l'histoire de notre monde. Les frères demandent ce que devrait signifier le mandat atlantique. Certains y voient une croisade : un mouvement de flanc le long de la côte saharienne autour de Grenade et du Maroc mérinide. D'autres y voient un commerce discret : de la poussière d'or, de l'ivoire et du poivre de malagueta circulent dans les usines templières sans une seule proclamation."
 nd_tkt.4.a: "Déborder la Maure : la côte africaine est une frontière de croisade."
 nd_tkt.4.b: "Commerce tranquille : les usines travaillent en silence."
 STATIC_MODIFIER_NAME_nd_tkt_african_outflanking: "Le débordement africain"
 STATIC_MODIFIER_DESC_nd_tkt_african_outflanking: "Les caravelles templières travaillent le long de la côte saharienne comme flanc de croisade. La portée et l’agressivité augmentent ; le prix diplomatique est la franchise."
 STATIC_MODIFIER_NAME_nd_tkt_quiet_trade: "Le commerce tranquille"
 STATIC_MODIFIER_DESC_nd_tkt_quiet_trade: "Le mandat atlantique redéfini comme un commerce discret. La poussière d'or, l'ivoire et le poivre de malagueta circulent dans les usines templières sans proclamation."

 # === DHE 5: Secret Chapter ===
 nd_tkt.5.t: "Le chapitre secret codifié"
 nd_tkt.5.d: "Les initiations fermées attribuées à la confrérie médiévale, le rite de la corde, le baiser d'obéissance, les acclamations gnostiques murmurées en dialecte provençal, sont codifiées comme la discipline cachée de l'Ordre. Le chef de chapitre demande quel genre de fraternité nous devrions être. Un chapitre ouvert qui admet des postulants étrangers et habille les rites comme une dévotion mariale ? Ou un chapitre ibérique de fer, héréditaire et fermé ?"
 nd_tkt.5.a: "Chapitre ouvert : postulants étrangers admis, rites habillés en dévotion mariale."
 nd_tkt.5.b: "Chapitre de fer : héréditaire, ibérique, fermé."
 STATIC_MODIFIER_NAME_nd_tkt_open_chapter: "Le chapitre ouvert"
 STATIC_MODIFIER_DESC_nd_tkt_open_chapter: "Postulants étrangers admis ; les rites secrets habillés en dévotion mariale. Le couvent bénéficie d'un large réseau diplomatique."
 STATIC_MODIFIER_NAME_nd_tkt_iron_chapter: "Le chapitre de fer"
 STATIC_MODIFIER_DESC_nd_tkt_iron_chapter: "Le chapitre est héréditaire, ibérique et fermé. Les frères prêtent les anciens serments en latin derrière des portes scellées. La discipline est de fer ; les étrangers sont tenus à distance."

 # === DHE 6: Beausant ===
 nd_tkt.6.t: "Le Beausant élevé"
 nd_tkt.6.d: "Le gonfanon de Beausant, noir sur blanc, étendard de guerre du juste et du faux de la confrérie médiévale, se dresse de nouveau sur les compagnies ibériques. Le chapitre doit décider qui rassembler sous ses ordres : les frères-chevaliers de chaque commanderie, issus du clergé et de la petite noblesse, ou les larges confréries laïques (les milites Christi dans les ordres mineurs) qui fournissent l'essentiel des équipages armés de l'Ordre."
 nd_tkt.6.a: "Frères-chevaliers : les commanderies d'élite au complet."
 nd_tkt.6.b: "Milice de confrérie : les frères convers et les ordres mineurs."
 STATIC_MODIFIER_NAME_nd_tkt_brother_knight_levy: "Frère-Chevalier Levy"
 STATIC_MODIFIER_DESC_nd_tkt_brother_knight_levy: "Les commanderies lèvent leurs confréries armées au complet. La cavalerie lourde et les frères chevaliers entrent en campagne en nombre jamais vu depuis la Terre Sainte."
 STATIC_MODIFIER_NAME_nd_tkt_confraternity_militia: "Milice de la confrérie"
 STATIC_MODIFIER_DESC_nd_tkt_confraternity_militia: "Les confréries laïques se rassemblent aux côtés des frères. Les armées deviennent plus grandes mais moins élitistes."

 # === DHE 7: Atlantic Factories ===
 nd_tkt.7.t: "Le Facteur Général de l'Atlantique"
 nd_tkt.7.d: "Les usines de Madère, d'Arguin et de Sao Jorge da Mina, moitié banque, moitié palissade armée, se multiplient le long de la côte saharienne et guinéenne. Un officier permanent, le facteur général, est nommé à Lagos pour coordonner les analyses de poussière d'or, les expéditions de malagueta et les comptes d'esclaves et d'ivoire. Le commerce extérieur de l'Ordre bénéficie d'une seule main de coordination."
 nd_tkt.7.a: "Lagos comme siège du facteur atlantique."
 STATIC_MODIFIER_NAME_nd_tkt_factor_general: "Facteur général de l'Atlantique"
 STATIC_MODIFIER_DESC_nd_tkt_factor_general: "Un officier permanent à Lagos règne sur les usines de l'Atlantique. Le commerce extérieur de l'Ordre bénéficie d'une coordination."

 # === DHE 8: Heretical Rumours ===
 nd_tkt.8.t: "Les rumeurs de Baphomet"
 nd_tkt.8.d: "Trois siècles après le procès de Philippe le Bel, les accusations ne sont pas mortes. Culte des idoles, rites gnostiques du baiser, tête barbue appelée Baphomet vénérée en chapitre, frères crachant sur la croix lors de l'initiation : légende noire qui voyage en pamphlets, sermons et causeries de taverne de Lisbonne à Lyon. Le couvent doit choisir. Écraser les rumeurs par une purge inquisitoriale ? Ou les transformer en armes mystiques pour les réseaux de renseignement ?"
 nd_tkt.8.a: "Purge inquisitoriale : écraser les rumeurs, restaurer le nom de l'Ordre."
 nd_tkt.8.b: "Réseau Whisper : cultivez la mystique, laissez les ennemis craindre ce qu'ils ne peuvent pas prouver."
 STATIC_MODIFIER_NAME_nd_tkt_inquisitorial_purge: "Purge inquisitoriale"
 STATIC_MODIFIER_DESC_nd_tkt_inquisitorial_purge: "Le Couvent accueille une inquisition templière : les rumeurs hérétiques sont publiquement écrasées. La confiance intérieure augmente ; la tradition cachée du chapitre est perdue."
 STATIC_MODIFIER_NAME_nd_tkt_whisper_network: "Le réseau Whisper"
 STATIC_MODIFIER_DESC_nd_tkt_whisper_network: "Les rumeurs de l’ère des procès sont cultivées plutôt que réprimées. Les ennemis du Couvent craignent ce qu'ils ne peuvent prouver ; les espions voyagent sous couvert de Baphomet-mystique."

 # === DHE 9: Templar Carrack ===
 nd_tkt.9.t: "La croix sur la voile"
 nd_tkt.9.d: "La croix du Christ évasée, peinte sur la grand-voile de chaque caraque templière de Lagos aux Açores, devient la marque de voile universelle de la flotte atlantique de l'Ordre. Les constructeurs navals de Lisbonne et de Lagos sont intégrés à la confrérie en tant que frères laïcs ; les calfats et les cordiers des ports jurent une obéissance mineure. Les navires de l'Ordre arborent un signe qui sert également d'identification maritime et de revendication sacramentelle."
 nd_tkt.9.a: "Peignez chaque voile."
 STATIC_MODIFIER_NAME_nd_tkt_cross_on_sail: "Traverser sur la voile"
 STATIC_MODIFIER_DESC_nd_tkt_cross_on_sail: "Chaque caraque templière porte la croix évasée du Christ peinte sur sa grand-voile. La présence maritime de l'Ordre augmente fortement ; Les charpentiers navals jurent une obéissance mineure."

 # === DHE 10: Cartulary ===
 nd_tkt.10.t: "Le Codex Templariorum"
 nd_tkt.10.d: "Les cartulaires médiévaux de l'Ordre, énormes registres sur parchemin des chartes, des dettes, des successions et des coutumes judiciaires de chaque commanderie entre la Provence et le Tage, sont codifiés dans une seule loi écrite de la confrérie. Le Codex Templariorum se trouve à la salle capitulaire : le fondement constitutionnel d'une confrérie bancaire souveraine."
 nd_tkt.10.a: "Reliez le Codex en vélin et enchaînez-le au pupitre."
 STATIC_MODIFIER_NAME_nd_tkt_codex_templariorum: "Le Codex Templariorum"
 STATIC_MODIFIER_DESC_nd_tkt_codex_templariorum: "Les cartulaires médiévaux codifiés dans une loi écrite de la confrérie. L'administration du couvent se resserre ; la dérive séparatiste s’atténue."

 # === Advances ===
 nd_tkt_tomar_convent: "Couvent de Tomar"
 nd_tkt_tomar_convent_desc: "La forteresse-monastère du XIIe siècle de Maître Gualdim Pais, située sur la colline de Nabantia, est préservée en tant que capitale des Templiers. La rotonde de Charola, les murs annelés et la salle capitulaire réunissent la cathédrale, le trésor et la cour royale."
 nd_tkt_beausant_gonfanon: "Beausant Gonfanon"
 nd_tkt_beausant_gonfanon_desc: "La bannière de guerre noire sur blanc de la confrérie médiévale est à nouveau levée. Les commanderies frères-chevaliers rassemblent toute leur cavalerie lourde sous le commandement du Beausant."
 nd_tkt_templar_sergeants: "Sergents templiers"
 nd_tkt_templar_sergeants_desc: "Les frères de seconde classe, recrutés parmi les popes non nobles comme frères laïcs. Cheval plus léger, moins d'armure, mais discipliné et libéré de l'interdiction noble. Cavalerie légère à construire."
 nd_tkt_latin_rule: "La règle latine de Bernard"
 nd_tkt_latin_rule_desc: "La Règle de l'Ordre, rédigée par Bernard de Clairvaux au concile de Troyes en 1129. Les frères-chevaliers vivent de manière monastique : pauvreté, chasteté, obéissance sous un seul Maître."
 nd_tkt_iberian_preceptories: "Commanderies ibériques"
 nd_tkt_iberian_preceptories_desc: "Commanderies locales dispersées à travers l'Aragon, la Castille et le Portugal : chacune est un domaine fortifié avec trésor, chapelle et écuries. La cellule institutionnelle du réseau Templier."
 nd_tkt_bills_of_exchange: "Lettres de change"
 nd_tkt_bills_of_exchange_desc: "L’invention médiévale des Templiers renaît. Un pèlerin ou un marchand dépose de l'argent dans une commanderie et retire des lingots dans une autre sous le sceau du Trésorier général. L'Ordre est à nouveau la première banque internationale du monde chrétien."
 nd_tkt_secret_chapter: "Le chapitre secret"
 nd_tkt_secret_chapter_desc: "Les initiations fermées attribuées aux Templiers médiévaux, le rite de la corde, les acclamations gnostiques, le baiser d'obéissance, sont codifiés comme la discipline cachée de l'Ordre. Le chapitre cultive un réseau d'agents sous couvert de mystique."
 nd_tkt_cartulary: "Le cartulaire"
 nd_tkt_cartulary_desc: "Les registres médiévaux des Templiers, les chartes, les dettes et les coutumes successorales de chaque commanderie entre la Provence et le Tage, sont modernisés en registres à double entrée et en un code judiciaire unifié."
 nd_tkt_order_galleys: "Commander des galères"
 nd_tkt_order_galleys_desc: "Les minces galères à rames des commanderies aragonaises et catalanes, réaffectées de la logistique de Terre Sainte à la patrouille ibéro-atlantique. Cuisine à construire avec une croix du Christ."
 nd_tkt_treasurer_apparatus: "Appareil Frère-Trésorier"
 nd_tkt_treasurer_apparatus_desc: "Le bureau du Trésorier général de Tomar coordonne les finances de l'Ordre dans toutes les commanderies. Le domaine du clergé acquiert une participation permanente dans les revenus du couvent."
 nd_tkt_sagres_navigation_school: "École de navigation de Sagres"
 nd_tkt_sagres_navigation_school_desc: "Dans l'histoire alternative, financée directement par les revenus de Tomar, comme Henri du Portugal l'a financée par l'Ordre du Christ. Pilotes, cartographes et écrivains de l'Atlantique, tous en habits templiers."
 nd_tkt_templar_carrack: "Caraque des Templiers"
 nd_tkt_templar_carrack_desc: "La caraque de l'Atlantique avec la croix du Christ évasée peinte sur sa grand-voile. Le navire emblématique du mandat d’exploration de l’Ordre."
 nd_tkt_atlantic_factories: "Usines de l'Atlantique"
 nd_tkt_atlantic_factories_desc: "Madère, Arguin et Sao Jorge da Mina : le comptoir armé à la fin de chaque voyage dans l'Atlantique. Moitié banque, moitié palissade, entièrement templier."
 nd_tkt_cross_of_christ: "Croix du Christ"
 nd_tkt_cross_of_christ_desc: "La croix latine évasée avec des membres plus fins remplace l'ancien emblème des Templiers. Peint sur chaque voile et chaque fanion, il annonce la mission atlantique de l'Ordre, sanctionnée par le pape."
 nd_tkt_lay_confraternity: "Confrérie des frères laïcs"
 nd_tkt_lay_confraternity_desc: "Les confréries laïques (laici fratres) rattachées à chaque commanderie. Les soldats, les ouvriers et les bourgeois jurent une obéissance mineure et approvisionnent les équipages de l'Ordre à l'étranger."
 nd_tkt_templar_bank: "Banque des Templiers"
 nd_tkt_templar_bank_desc: "Le système financier médiéval des Templiers atteint sa maturité. Lettres de change, lettres de crédit, dépôts sûrs et transferts inter-précepteurs, le tout sous la responsabilité du Trésorier général de Tomar."
 nd_tkt_baphomet_rumours: "Rumeurs sur Baphomet"
 nd_tkt_baphomet_rumours_desc: "Les accusations hérétiques de l’époque des procès perdurent comme une légende noire dans toute l’Europe catholique. Le couvent décide de les transformer en armes : les ennemis craignent ce qu'ils ne peuvent pas prouver, et les renseignements de la confrérie voyagent sous couvert de mystique."
 nd_tkt_factor_general_advance: "Facteur général"
 nd_tkt_factor_general_advance_desc: "L'officier permanent à Lagos régissant les usines atlantiques de l'Ordre. Une administration centrale pour le système commercial templier d’outre-mer."
 nd_tkt_templar_galleon: "Galion des Templiers"
 nd_tkt_templar_galleon_desc: "Le galion atlantique complet. Coque ibérique, accastillage aragonais, frères-chevaliers artilleurs. La ligne de bataille permanente du couvent."
 nd_tkt_captaincy_of_brothers: "Capitainerie des Frères"
 nd_tkt_captaincy_of_brothers_desc: "Madère, Cap-Vert, Açores : chacun dirigé par un chevalier-capitaine relevant directement du couvent de Tomar. Le gouvernement militarisé des colonies atlantiques."
 nd_tkt_discount_bank: "Banque d'escompte"
 nd_tkt_discount_bank_desc: "La banque de l'Ordre se transforme en une institution d'escompte achetant des effets commerciaux à leur valeur nominale avant leur échéance. Les revenus basés sur les transactions évoluent avec le commerce extérieur."
 nd_tkt_tomar_cabinet: "Armoire Tomar"
 nd_tkt_tomar_cabinet_desc: "Cabinet directeur du couvent de la forteresse refondée de Tomar. Huit frères sous le Maître gèrent la politique, les finances et les flottes."
 nd_tkt_templar_frigate: "Frégate templière"
 nd_tkt_templar_frigate_desc: "Le dernier voilier de guerre de l'Ordre, plus léger que le galion, construit pour la patrouille atlantique des routes industrielles."
 nd_tkt_convent_arsenal: "Arsenal du couvent"
 nd_tkt_convent_arsenal_desc: "Les chantiers navals de l'Ordre sur le Tage et l'Algarve. Galions, frégates et navires de ravitaillement en rotation continue ; cordages et magasins navals provenant des forêts de pins appartenant au couvent."
 nd_tkt_industrial_bank: "Banque des Templiers Industriels"
 nd_tkt_industrial_bank_desc: "La banque du couvent survit à l'ère du papier-monnaie, des sociétés par actions et du commerce colonial. Les lettres de change médiévales évoluent en instruments modernes sous la même croix à huit pointes."
 nd_tkt_convent_free_port: "Port franc du couvent"
 nd_tkt_convent_free_port_desc: "Le corridor Tomar-Lagos-Faro s'est ouvert au commerce international. Les navires britanniques, hollandais et français accostaient sous pavillon du couvent, payant des péages au Trésor des Templiers."
 nd_tkt_constitutional_brotherhood: "Fraternité constitutionnelle"
 nd_tkt_constitutional_brotherhood_desc: "Le Codex Templariorum réécrit sous forme de constitution. Le Maître est contraint ; les représentants des huit langues siègent en chapitre ; la confrérie devient une république bancaire constitutionnelle."

 # === Buildings ===
 nd_tkt_tomar_convent_building: "Couvent de Tomar"
 nd_tkt_tomar_convent_building_desc: "Le Castelo dos Templarios sur la colline de Nabantia : couvent-forteresse aux anneaux, rotonde Charola, salle capitulaire, cloître du cimetière. Le cœur institutionnel et cérémonial de la confrérie."
 nd_tkt_preceptory: "Commanderie des Templiers"
 nd_tkt_preceptory_desc: "La commanderie locale de l'Ordre : caserne, trésor, chapelle, écuries, le tout derrière une courtine. La cellule institutionnelle du réseau templier médiéval."
 nd_tkt_banking_house: "Maison bancaire des Templiers"
 nd_tkt_banking_house_desc: "Lettres de change, lettres de crédit, dépôt sécurisé. L’invention financière médiévale des Templiers transposée dans une institution bancaire souveraine. Les lingots d'argent et d'or garantissent le réseau continental de crédit de la chambre."
 nd_tkt_navigation_school: "École de navigation de Sagres"
 nd_tkt_navigation_school_desc: "Pilotes, cartographes et rédacteurs de rutter de l'Atlantique. L'école de navigation financée directement par les chambres du couvent de Tomar."
 nd_tkt_atlantic_factory: "Usine Atlantique"
 nd_tkt_atlantic_factory_desc: "La maison de commerce armée à la fin de chaque voyage dans l'Atlantique. Moitié banque, moitié palissade, entièrement templier. Modèle Madère, Arguin, Sao Jorge da Mina."
 nd_tkt_chamber_of_credit: "Chambre de crédit des Templiers"
 nd_tkt_chamber_of_credit_desc: "La banque templière mature. Centre de compensation continental, coffre-fort, lettres de crédit, escompte sur les effets commerciaux. Catégorie Gouvernement, le cabinet financier du Couvent."
 nd_tkt_captaincy: "Frère-Capitaine"
 nd_tkt_captaincy_desc: "Le gouvernorat colonial militarisé : Madère, Cap-Vert, Açores dirigés par des chevaliers-capitaines répondant directement au couvent de Tomar."
 nd_tkt_convent_arsenal_building: "Arsenal du couvent"
 nd_tkt_convent_arsenal_building_desc: "Les chantiers navals de l'Ordre sur le Tage et l'Algarve. Galions, frégates et navires de ravitaillement en rotation continue ; cordages et magasins navals provenant des forêts de pins appartenant au couvent."

 # === Building PM names ===
 nd_tkt_tomar_convent_maintenance: "Entretien du couvent"
 nd_tkt_tomar_convent_maintenance_desc: "La pierre, la maçonnerie, le parchemin et le drap fin maintiennent le couvent-forteresse entier et la salle capitulaire meublée."
 nd_tkt_preceptory_maintenance: "Entretien de la précepterie"
 nd_tkt_preceptory_maintenance_desc: "Armes, outils, chevaux et vin d'autel pour la tournée quotidienne d'une commanderie templière."
 nd_tkt_banking_house_production: "Comptes de lingots"
 nd_tkt_banking_house_production_desc: "Lingots d'argent et d'or conservés dans les coffres des Templiers comme garantie pour les lettres de change et les lettres de crédit. Les outils et instruments d'analyse assurent les opérations quotidiennes de la chambre."
 nd_tkt_navigation_school_maintenance: "Entretien scolaire"
 nd_tkt_navigation_school_maintenance_desc: "Parchemin, livres, cire d'abeille et mobilier pour les pilotes et cartographes de l'école de navigation."
 nd_tkt_atlantic_factory_maintenance: "Entretien d'usine"
 nd_tkt_atlantic_factory_maintenance_desc: "Fournitures navales, papier de grand livre, armes et tissus pour la maison de commerce armée."
 nd_tkt_chamber_of_credit_maintenance: "Entretien de la chambre"
 nd_tkt_chamber_of_credit_maintenance_desc: "Parchemin, livres, cire d'abeille et mobilier pour l'appareil bancaire templier de la fin de la période."
 nd_tkt_captaincy_maintenance: "Entretien de la capitainerie"
 nd_tkt_captaincy_maintenance_desc: "Parchemin, armes, chevaux et meubles pour la maison du frère-chevalier capitaine."
 nd_tkt_convent_arsenal_maintenance: "Entretien de l'Arsenal"
 nd_tkt_convent_arsenal_maintenance_desc: "Du bois, des fournitures navales, du goudron, des outils et quelques canons maintiennent les chantiers navals de l'Ordre en rotation continue."

 # === Units ===
 a_nd_tkt_brother_knight: "Frère-Chevalier Templier"
 a_nd_tkt_brother_knight_desc: "Le frère-chevalier propre : lance, maille, croix évasée, chevauchant sous le Beausant. Prélèvement via le système de commanderie auprès des prêtres des ordres mineurs."
 a_nd_tkt_sergeant: "Sergent Templier"
 a_nd_tkt_sergeant_desc: "Le frère de seconde classe : cheval plus léger, cuir, épée. Recrutés parmi les soldats et les bourgeois comme frères laïcs dans les ordres mineurs."
 n_nd_tkt_order_galley: "Galerie de commandes"
 n_nd_tkt_order_galley_desc: "Cuisine mince de type aragonais avec la croix du Christ sur la voile d'avant. Le modèle de corso catalan reconverti en puissance côtière templière."
 n_nd_tkt_templar_carrack: "Caraque des Templiers"
 n_nd_tkt_templar_carrack_desc: "La caraque de l'Atlantique avec la croix du Christ évasée peinte sur sa grand-voile. Le navire d'exploration de l'Atlantique de l'Ordre."
 n_nd_tkt_templar_galleon: "Galion des Templiers"
 n_nd_tkt_templar_galleon_desc: "Le galion atlantique complet : coque ibérique, accastillage aragonais, frères-chevaliers artilleurs. La ligne de bataille permanente du couvent."
 n_nd_tkt_templar_frigate: "Frégate templière"
 n_nd_tkt_templar_frigate_desc: "La dernière frégate de patrouille à voile de l'Ordre, plus légère que le galion, construite pour la patrouille de la route atlantique-usine."

 # === Levies ===
 levy_nd_tkt_brother_knight: "Frère-Chevalier Levy"
 levy_nd_tkt_brother_knight_desc: "Prélèvement de cavalerie lourde auprès des frères clercs sous ordres mineurs. La force de frappe montée d'élite de l'Ordre."

 # === Event variable tooltips ===
 nd_tkt_formed_tt: "les Chevaliers du Temple ont été formés"
 nd_tkt_path_a_tt: "le chemin de l'Ancien Ordre Restauré"
 nd_tkt_path_b_tt: "le chemin du Nouvel Ordre du Christ"
 nd_tkt_continental_clearing_house: "Centre d'échange continental"
 nd_tkt_continental_clearing_house_desc: "La Banque Templière comme institution de règlement des finances interétatiques européennes. Les lettres de change de Londres, Amsterdam, Marseille et Hambourg transitent par la chambre de Tomar. Le prestige de la confrérie repose sur le coffre d'argent de la chrétienté."

 # ============================================================
 # === DESTINY TREE ===
 # Post-formation mission tree: root + 2 paths x 3 stages.
 # ============================================================

 # === Destiny advance names and descriptions ===
 nd_tkt_destiny: "Destin de la Confrérie"
 nd_tkt_destiny_desc: "La refondation du Couvent s'inscrit dans la durée. La discipline institutionnelle de la confrérie tient bon ; maintenant, le chapitre tourne son regard vers un destin : l’empire fantôme bancaire de chapitres secrets sur l’Europe catholique, ou l’empire public atlantique de la croix du Christ."

 # Path A
 nd_tkt_dest_continental_commanderies: "Commanderies continentales"
 nd_tkt_dest_continental_commanderies_desc: "Le cœur des Templiers médiévaux. Restaurer les commanderies provençales autour de#bold Avignon#!et la maison mère champenoise à#bold Troyes#!, où Bernard écrivit la Règle latine en 1129. Le réseau de commanderies continentales est l'épine dorsale de l'empire de l'ombre."
 nd_tkt_dest_court_penetration: "Pénétration des tribunaux catholiques"
 nd_tkt_dest_court_penetration_desc: "The royal treasuries of #bold Paris#! and #bold Naples#! take Templar credit, as the Temple of Paris once kept the treasure of France and Templar brothers served Charles of Anjou as treasurers at Naples. The Convent's Treasurer-General becomes the silent intermediary of Catholic state finance. Embrace #bold Banking#!, accumulate #bold 2000 gold#!, and bind the courts to the chamber."
 nd_tkt_dest_shadow_empire: "L'Empire de l'Ombre des Templiers"
 nd_tkt_dest_shadow_empire_desc: "Hold #bold London#!, #bold Rome#!, and #bold Lyon#!: the great Catholic courts, the papal seat, and the Rhone-Saone banking artery all pass through Tomar's chamber. With #bold 3000 gold#! and #bold 75 prestige#!, the Grand Chapter rises as the Convent's secret heart."

 # Path B
 nd_tkt_dest_atlantic_islands: "Les îles de l'Atlantique sécurisées"
 nd_tkt_dest_atlantic_islands_desc: "Les trois groupes d'îles à partir desquels les routes éoliennes de l'Atlantique sont commandées :#bold Funchal#!à Madère,#bold Ponta Delgada#!aux Açores et#bold Teguise#!aux Canaries. L'habit templier remplace les anciens drapeaux au-dessus des ports."
 nd_tkt_dest_african_outposts: "Les avant-postes africains-atlantiques"
 nd_tkt_dest_african_outposts_desc: "Hold #bold Arguin#! on the Mauritanian coast and #bold Cabo Corso#! on the Gold Coast. Embrace the #bold New World#! and accumulate #bold 2000 gold#!. The factor-system drives gold-dust, malagueta, and ivory through the Convent's ledgers."
 nd_tkt_dest_atlantic_imperium: "L'Imperium Templier Transatlantique"
 nd_tkt_dest_atlantic_imperium_desc: "Hold #bold Sao Tome#! on the equator and #bold Maxorata#! in the southern Canaries. Embrace #bold Global Trade#!, hold #bold 3000 gold#! and #bold 75 prestige#!, and trade #bold sugar#! through the capital market. The Atlantic Captain-General's Hall rises at Lagos."

 # === Destiny event titles, descriptions, options ===
 # Destiny root acknowledgement
 nd_tkt.11.t: "Le couvent règle son parcours à long terme"
 nd_tkt.11.d: "Le chapitre s'est réuni derrière les portes closes de la Charola. La discipline institutionnelle de la confrérie tient bon ; l'argent est dans sa poitrine ; les frères-chevaliers sont dans leurs commanderies ; la croix du Christ vole de Tomar à Sines. Le chef de chapitre pose la question qui attend depuis la levée du Vox in excelso : quel est le projet à long terme de l'Ordre ? L'Empire Templier du banquier-chevalier médiéval, ou l'Empire Atlantique de l'Ordre du Christ ?"
 nd_tkt.11.a: "Mettez la confrérie sur son destin."

 # Path A Stage 1
 nd_tkt.12.t: "Les commanderies continentales restaurées"
 nd_tkt.12.d: "La commanderie d'Avignon roule à nouveau sous la croix à huit pointes ; la maison mère de Troyes, où fut établie la Règle de Bernard en 1129, ouvre ses portes capitulaires après cent ans de silence. Le cœur templier médiéval de la Provence et de la Champagne est à nouveau institutionnel, et les frères-chevaliers du couvent parcourent les anciennes routes de commanderie de l'Europe catholique."
 nd_tkt.12.a: "Convoquer le chapitre à Troyes."

 # Path A Stage 2
 nd_tkt.13.t: "Les tribunaux catholiques s'attribuent le mérite du couvent"
 nd_tkt.13.d: "The royal treasuries of #bold Paris#! and #bold Naples#! take their loans from Tomar's chambers. The brothers debate the temper of the Convent's reach. Should the Treasurer-General cultivate a quiet, networked influence, hidden in audit-books and discreet advisors? Or should the chapter consolidate hereditary discipline at home, the iron Iberian brotherhood at full strength behind the Templar bank?"
 nd_tkt.13.a: "Le réseau judiciaire du Trésorier : discret, consultatif, audité."
 nd_tkt.13.b: "La Confrérie de Fer : héréditaire, prélevée, disciplinée."

 # Path A Stage 3
 nd_tkt.14.t: "L'Empire des Ombres Templiers terminé"
 nd_tkt.14.d: "Le Trésor de Londres, la Camera Apostolica de Rome et la Bourse de Lyon s'installent tous via Tomar. La confrérie est la magistrature silencieuse des finances de l’État catholique. Le chapitre doit décider de son visage public : une domination silencieuse, se déplaçant par des annexions éclair et des mains invisibles ? Ou un Grand Magistère ouvertement proclamé, l'Ordre reconnu comme la magistrature bancaire de l'Europe catholique ?"
 nd_tkt.14.a: "The Silent Dominion : marches forcées, annexions éclair, main invisible."
 nd_tkt.14.b: "Le Grand Magistère : ouvert, magistral, la fraternité en honneur."

 # Path B Stage 1
 nd_tkt.15.t: "Les îles de l'Atlantique sous la croix"
 nd_tkt.15.d: "Le port de Funchal à Madère, la rade de Ponta Delgada aux Açores, le quai en pierre de Teguise aux Canaries : trois groupes d'îles sous la croix évasée du Christ. Les routes des vents de l'Atlantique, les alizés et les vents d'ouest qui commandent tous les voyages entre l'Europe et la côte sud, sont désormais à nous, nous pouvons y entrer et en sortir à volonté."
 nd_tkt.15.a: "L'Atlantique est ouvert à la confrérie."

 # Path B Stage 2
 nd_tkt.16.t: "Arguin et Cabo Corso"
 nd_tkt.16.d: "Le facteur d'Arguin compte la malagueta ; la chapelle de Cabo Corso (Sao Jorge da Mina) bénit la poussière d'or dans le sceau de Tomar. Les frères débattent du mandat africain. Le couvent devrait-il le présenter comme une croisade mauritanienne, la croix du Christ à la proue des caravelles brûlant les ports mérinides ? Ou gérer un circuit de facteurs silencieux, piloté par un grand livre, sous le couvert de pièces de monnaie des Templiers ?"
 nd_tkt.16.a: "La Croisade Mauritanienne : un flanc autour de Grenade et des Mérinides."
 nd_tkt.16.b: "Le circuit du facteur : argent et ivoire, pas de proclamation."

 # Path B Stage 3
 nd_tkt.17.t: "L'Imperium Atlantique de la Croix"
 nd_tkt.17.d: "Sao Tome's equatorial church flies the cross-of-Christ above the sugar-mills; Maxorata's stone factor-house is the southernmost watch of the Canaries. Tomar's counting houses turn the islands' sugar into the Order's coin. The chapter raises the Atlantic Captain-General's Hall at Lagos and debates its institutional form: a hardened sugar-armada under brother-captains, or a chartered colonial brotherhood that opens the islands to migration and burgher-trade?"
 nd_tkt.17.a: "La Sugar Armada : frères-capitaines, flottes convoyées, ordre naval durci."
 nd_tkt.17.b: "The Chartered Brotherhood : charters, migrants, agences bancaires."

 # === Destiny timed modifier names and descriptions ===
 STATIC_MODIFIER_NAME_nd_tkt_dest_treasurers_court_network: "Le réseau de la Cour du Trésorier"
 STATIC_MODIFIER_DESC_nd_tkt_dest_treasurers_court_network: "Les chambres du couvent abritent l'argenterie des cours catholiques. La capacité de prêt augmente ; la culture des conseillers est dépréciée. Les questions navales sont négligées dans l'ombre de la chambre."
 STATIC_MODIFIER_NAME_nd_tkt_dest_iron_brotherhood: "La Confrérie de Fer"
 STATIC_MODIFIER_DESC_nd_tkt_dest_iron_brotherhood: "Le chapitre est héréditaire, ibérique et discipliné. Les commanderies des nobles lèvent au maximum leur effectif ; la dîme des biens du clergé passe par l'audit du couvent ; les frères-chevaliers récupèrent rapidement entre les batailles."
 STATIC_MODIFIER_NAME_nd_tkt_dest_silent_dominion: "Le domaine silencieux"
 STATIC_MODIFIER_DESC_nd_tkt_dest_silent_dominion: "L’empire de l’ombre évolue en silence. Marche forcée des colonnes de frères-chevaliers ; les tribunaux mineurs sont annexés avant de pouvoir appeler à l'aide. Les lignes d’approvisionnement s’étirent dans la précipitation."
 STATIC_MODIFIER_NAME_nd_tkt_dest_grand_magisterium: "Le Grand Magistère"
 STATIC_MODIFIER_DESC_nd_tkt_dest_grand_magisterium: "Le couvent gouverne ouvertement en tant que magistrature bancaire de l'Europe catholique. La tradition des frères-chevaliers est préservée au fil des campagnes ; la paysannerie sous la seigneurie templière prospère."
 STATIC_MODIFIER_NAME_nd_tkt_dest_mauritanian_crusade: "La croisade mauritanienne"
 STATIC_MODIFIER_DESC_nd_tkt_dest_mauritanian_crusade: "Le mandat de Sagres se lit comme une croisade. Les caravelles templières brûlent les ports mérinides le long de la côte saharienne ; le prestige naval de l'Ordre augmente à chaque voile."
 STATIC_MODIFIER_NAME_nd_tkt_dest_factor_circuit: "Le circuit du facteur"
 STATIC_MODIFIER_DESC_nd_tkt_dest_factor_circuit: "La poussière d'or, la malagueta et l'ivoire parcourent les registres du couvent. Les voies commerciales sont protégées ; des bourgeois circulent. Le leadership militaire s’atrophie à mesure que l’argent remplace l’épée."
 STATIC_MODIFIER_NAME_nd_tkt_dest_sugar_armada: "L'armada du sucre"
 STATIC_MODIFIER_DESC_nd_tkt_dest_sugar_armada: "Les flottes sucrières de Madère naviguent sous convoi templier. Les caravelles et les galions rentrent en Algarve avec leurs cales pleines ; les maîtres réparateurs en station maintiennent la flotte en mer."
 STATIC_MODIFIER_NAME_nd_tkt_dest_atlantic_chartered_brotherhood: "La Fraternité Agréée de l'Atlantique"
 STATIC_MODIFIER_DESC_nd_tkt_dest_atlantic_chartered_brotherhood: "Le Couvent délivre des chartes coloniales sous son propre sceau. Les migrants affluent vers les îles et les usines de l'Atlantique ; les succursales de la banque templière se multiplient le long des routes commerciales."

 # === Destiny capstone buildings ===
 nd_tkt_grand_chapter: "Grand Chapitre"
 nd_tkt_grand_chapter_desc: "Le cœur secret du couvent : la salle capitulaire fermée derrière la rotonde Charola, où les frères héréditaires et le trésorier général silencieux se réunissent autour des registres de la dette européenne. Le summum institutionnel de l’Empire de l’Ombre Templier."
 nd_tkt_grand_chapter_maintenance: "Maintenance du Grand Chapitre"
 nd_tkt_grand_chapter_maintenance_desc: "Parchemin, livres, tissus fins et cire d'abeille pour les salles d'audit cachées du chapitre et la séance privée du trésorier général."
 nd_tkt_atlantic_captain_general: "Salle du capitaine général de l'Atlantique"
 nd_tkt_atlantic_captain_general_desc: "Le cabinet militaro-mercantile de l'empire atlantique à Lagos. Rapports des frères-chevaliers capitaines de chaque colonie de l'Atlantique ; les affrètements sont tamponnés, les flottes expédiées, les audits entendus. Le summum institutionnel de l’Imperium Atlantique."
 nd_tkt_atlantic_captain_general_maintenance: "Capitaine-général d'entretien"
 nd_tkt_atlantic_captain_general_maintenance_desc: "Parchemin, fournitures navales, armes et meubles pour le commandement du capitaine général et les quartiers du capitaine-chevalier."

 # ============================================================
 # === BUREAUCRACIES ===
 # ============================================================

 tkt_sacred_convent_bureaucracy: "Sacro Capitule Général"
 tkt_sacred_convent_bureaucracy_desc: "Le Chapitre Général du Sacré Couvent, pôle constitutionnel de la confrérie. Sous la Règle latine de Bernard (Concile de Troyes 1129), le Maître est élu par le Couvent et gouverne avec le consentement du Chapitre, qui siège chaque année à Tomar pour confirmer les mesures magistrales, juger les manquements à la Règle et admettre les postulants. Ses membres sont les Maîtres provinciaux d'Aragon, de Castille, du Portugal et de Provence-en-exil, ainsi que les officiers conventuels (le Sénéchal, le Maréchal, le Drapier, l'Aumônier, le Trésorier). Les actes magistraux accomplis sans le consentement du Chapitre sont annulés par le Visiteur général, auditeur permanent des commanderies de l'Ordre."
 tkt_treasurer_general_bureaucracy: "Thésaurus des appareils"
 tkt_treasurer_general_bureaucracy_desc: "L'Appareil Trésorier Général, institution signature de l'Ordre et première société bancaire internationale de la chrétienté médiévale. Les commanderies de chaque province tiennent des coffres ouverts au dépôt ; un pèlerin ou un facteur déposant de l'argent dans une commanderie retire des lingots dans une autre sous une lettre de change scellée. L'Appareil prélève des frais de transfert, prête sous caution aux têtes couronnées (Philippe II de France a encaissé sa rançon des Plantagenêts par l'intermédiaire de la maison de Paris ; Jacques Ier d'Aragon a hypothéqué ses joyaux de la couronne par l'intermédiaire de Barcelone) et détient les morgues des frères décédés. Ses officiers sont des clercs-aumôniers soumis à la discipline monastique."
 tkt_capitulum_occultum_bureaucracy: "Capitule occulte"
 tkt_capitulum_occultum_bureaucracy_desc: "Le chapitre secret. Le procès de 1307-1314 a fixé dans la mémoire catholique la rumeur d'un chapitre intérieur caché sous celui ouvert du couvent : les initiations closes sous portes scellées, le rite de la corde, le baiser d'obéissance, les acclamations gnostiques murmurées en dialecte provençal. Refondé en tant que chambre d'enquête permanente de l'Ordre souverain à Tomar, le Capitulum Occultum vérifie la loyauté des frères, dirige des services de renseignement sous couvert d'affaires de commanderie et transforme l'héritage de la rumeur de Baphomet en une arme mystique qui voyage dans les brochures et les conversations de taverne de Lisbonne à Lyon. Ses officiers ne répondent qu'au Maître."
 tkt_capitanias_do_mar_bureaucracy: "Capitanías do Mar"
 tkt_capitanias_do_mar_bureaucracy_desc: "Les capitaineries maritimes, construites sur l'héritage de l'histoire alternative de l'Ordre du Christ d'Henri de Sagres. Le système divise chaque colonie de l'Atlantique en subventions de capitainerie héréditaires sous la direction de frères-chevaliers donatarios : Madère (Funchal, Machico), les Açores, Sao Tomé et la côte africaine à Arguin et Cabo Corso. Chacun est gouverné par un chevalier-capitaine qui répond au facteur général de Lagos et, à travers lui, au couvent de Tomar. Le capitaine exerce l'autorité judiciaire, fiscale et militaire sur la capitainerie en échange d'un dixième des revenus au trésorier général. Le modèle est mi-féodal, mi-conventuel ; c'est le véritable instrument de l'Empire atlantique dont dispose l'Ordre."

 AUTO_MODIFIER_NAME_nd_tkt_bureaucracy_authority: "Autorité Magistrale"
 AUTO_MODIFIER_DESC_nd_tkt_bureaucracy_authority: "Le couvent de Tomar peut instituer jusqu'à trois bureaux bureaucratiques permanents, issus du chapitre général du couvent sacré, de l'appareil du trésorier général, du capitulum occultum et des capitaineries maritimes, les quatre piliers de l'État templier souverain de l'histoire alternative."
 STATIC_MODIFIER_NAME_nd_tkt_militant_brotherhood: "Ordre Souverain du Temple"
 STATIC_MODIFIER_DESC_nd_tkt_militant_brotherhood: "Le noyau institutionnel de la confrérie : les frères-chevaliers et sergents liés par la Règle de Bernard, le chapitre réuni en séance secrète, le Maître élu à vie. Le clergé dirige l'armée des Templiers ; les commanderies et les couvents-forteresses sont fortifiés au-delà de tout royaume séculier ; le caractère de l'Ordre dérive vers la guerre sainte en fondant une charte. L’Ordre ne peut pas être détourné de la foi catholique. Vanilla army_order_reform peut être activé officiellement via l'onglet Gouvernement pour verrouiller le titre."
