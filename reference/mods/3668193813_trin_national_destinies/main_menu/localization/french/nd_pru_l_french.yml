l_french:
 STATIC_MODIFIER_NAME_nd_iron_kingdom: "Le Royaume de Fer"
 STATIC_MODIFIER_DESC_nd_iron_kingdom: "La Prusse n’est pas un État qui possède une armée : c’est une armée qui possède un État. Le royaume des Hohenzollern s'est forgé pour devenir la société la plus militarisée d'Europe, où la discipline, l'obéissance et la vertu martiale constituent le fondement de l'identité nationale."
 STATIC_MODIFIER_NAME_nd_enlightened_state: "L'État éclairé"
 STATIC_MODIFIER_DESC_nd_enlightened_state: "Des écoles piétistes de Halle aux réformes juridiques de Frédéric, la Prusse a poursuivi une vision de gouvernance rationnelle. Une bureaucratie efficace, une éducation universelle et une loi codifiée transforment une marche pauvre du Nord en un moteur de progrès."
 nd_pru.1.t: "La naissance de la Prusse"
 nd_pru.1.d: "The transformation is complete. From the ashes of the Teutonic Order and the sandy marches of Brandenburg, a new state has emerged: Prussia. We have broken the power of the clergy, bound the Junker nobility to our service, and imposed order upon a fractured land. Now the question stands before us: what kind of kingdom shall we build?\n\nWill we follow the path of iron, drilling our soldiers into the finest army in Europe, making war our industry and discipline our creed? Or shall we seek to become a beacon of enlightened governance, investing in schools, reforming our laws, and building a state that earns the admiration of philosophers as much as the fear of generals?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_pru.1.a: "La discipline avant tout. La Prusse marche."
 nd_pru.1.b: "Un royaume de raison et de droit."
 nd_pru.2.t: "Le système de cantonnement"
 nd_pru.2.d: "In 1733, King Frederick William I issued the Kantonreglement, dividing the kingdom into recruitment districts, cantons, each assigned to a regiment. Every able-bodied male is enrolled from birth, serving in peacetime through rotating furloughs and returning to their fields between training periods. The Junker officers command peasants from their own estates, creating bonds of loyalty that run deeper than mere military discipline.\n\nThis system gives Prussia an army far larger than its population should support: 3.6% of the total population under arms, the highest proportion in Europe. The question is how we apply this extraordinary resource."
 nd_pru.2.a: "Percez-les sans relâche. La qualité plutôt que la quantité."
 nd_pru.2.b: "Maximisez l’efficacité. Chaque cantoniste sert deux fois : comme soldat et comme agriculteur."
 nd_pru.3.t: "L'ordre oblique de bataille"
 nd_pru.3.d: "At Leuthen in December 1757, Frederick demonstrated the devastating potential of the oblique order: concentrating overwhelming force against the weakest point of the enemy line while refusing the opposite flank. With 36,000 Prussians against 66,000 Austrians, the king executed a perfect march across the enemy front, struck their exposed left flank, and rolled up the entire Austrian army in one of the most decisive victories in military history.\n\nComing just weeks after the equally stunning victory at Rossbach, Leuthen established Prussian tactical doctrine as the standard against which all European armies would measure themselves. Shall we press this advantage offensively, or use these principles to perfect our defensive warfare?"
 nd_pru.3.a: "Frappez là où ils sont les plus faibles. L'attaque oblique est notre épée."
 nd_pru.3.b: "Tenons là où nous sommes les plus forts. Laissez l’ennemi pénétrer dans nos lignes."
 nd_pru.4.t: "Le Grosser Generalstab"
 nd_pru.4.d: "Following the catastrophe of Jena-Auerstedt in 1806, reformers led by Gerhard von Scharnhorst and August von Gneisenau rebuilt the Prussian military from its foundations. In 1810, the Kriegsakademie opened its doors, selecting officers by demonstrated intelligence and merit rather than birth alone. The Great General Staff, the Grosser Generalstab, became the first permanent military planning body in history, responsible for the continuous study of war in all its dimensions.\n\nIts officers are trained to think independently, to make decisions in the absence of orders, and to coordinate operations across vast distances. This institution will shape the practice of warfare for the next century and beyond."
 nd_pru.4.a: "Une armée qui pense comme un seul esprit."
 nd_pru.5.t: "L'Allgemeines Landrecht"
 nd_pru.5.d: "In 1794, Prussia promulgated the Allgemeines Landrecht fur die Preussischen Staaten, the General State Laws, a comprehensive legal code that sought to unify the diverse provincial legal systems of the kingdom under a single framework. Drafted under the orders of Frederick the Great and completed by Carl Gottlieb Svarez, the code represents a remarkable achievement: an absolute monarchy voluntarily binding itself to the rule of law.\n\nThe Landrecht guaranteed prompt and impartial administration of justice, protected subjects against arbitrary royal will, and established legal protections for property and contract. It was not democratic, it preserved estate-based social distinctions, but it was rational, predictable, and fair within its own terms."
 nd_pru.5.a: "La loi avant tout : même le roi."
 STATIC_MODIFIER_NAME_nd_pru_cantonment_discipline: "Exercice de cantonnement"
 STATIC_MODIFIER_DESC_nd_pru_cantonment_discipline: "L'exercice et la discipline incessants transforment les recrues kantonistes brutes en soldats d'une qualité exceptionnelle."
 STATIC_MODIFIER_NAME_nd_pru_cantonment_efficiency: "Efficacité du cantonnement"
 STATIC_MODIFIER_DESC_nd_pru_cantonment_efficiency: "Le système de cantonnement maximise chaque ressource : les soldats retournent dans leurs fermes entre les campagnes, nourrissant le royaume tout en étant prêts à marcher."
 STATIC_MODIFIER_NAME_nd_pru_oblique_order_offense: "L'attaque oblique"
 STATIC_MODIFIER_DESC_nd_pru_oblique_order_offense: "Concentrez la force au point décisif. Frappez là où l'ennemi est le plus faible et brisez sa ligne avant qu'il ne puisse réagir."
 STATIC_MODIFIER_NAME_nd_pru_oblique_order_defense: "La défense oblique"
 STATIC_MODIFIER_DESC_nd_pru_oblique_order_defense: "Refusez le flanc le plus faible et présentez un front impénétrable. Laissez l’ennemi s’épuiser face à une puissance de feu disciplinée."
 nd_pru_teutonic_heritage: "Patrimoine teutonique"
 nd_pru_teutonic_heritage_desc: "Les traditions martiales et l'héritage de construction de forteresses de l'Ordre Teutonique ont jeté les bases de la culture militaire prussienne."
 nd_pru_amber_trade: "Commerce de l'ambre baltique"
 nd_pru_amber_trade_desc: "Depuis que les chevaliers teutoniques ont pris le contrôle de Königsberg, le commerce de l'ambre est un monopole prussien. La pierre dorée de la Baltique alimente le commerce et l’artisanat."
 nd_pru_vistula_grain: "Grain of the Vistula"
 nd_pru_vistula_grain_desc: "The rye and wheat of Prussia, Mazovia and Lithuania come down the Vistula and the Pregel on rafts and barges to the Prussian ports, where the Order's own grand stewards and the town merchants ship them on to Flanders and England."
 nd_pru_artushof_towns: "Courts of Arthur"
 nd_pru_artushof_towns_desc: "Thorn, Elbing, Danzig, Kulm, Braunsberg and Konigsberg: the great towns of Prussia are ruled by merchant families who trade with the Hansa and meet in halls named for King Arthur's court."
 nd_pru_junker_estates: "Domaines Junker"
 nd_pru_junker_estates_desc: "L’aristocratie foncière Junker constitue l’épine dorsale de l’État prussien. Leurs vastes domaines Ritterguter fournissent à la fois l’assiette fiscale et le corps d’officiers qui rendent la Prusse redoutable."
 nd_pru_prussian_confederation: "The Prussian Confederation"
 nd_pru_prussian_confederation_desc: "In 1440 the towns and the gentry of Prussia swore a league at Marienwerder against arbitrary rule. When it came to war the towns paid for it: Danzig's credit bought the fortress of Marienburg from the garrison's own unpaid companies. No ruler of Prussia has since governed without the estates."
 nd_pru_coinage_reform: "The Coinage Reform"
 nd_pru_coinage_reform_desc: "Nicolaus Copernicus, canon of Frauenburg, laid his treatise on money before the Prussian diet at Graudenz in 1522: debased coin drives good coin out of the land and ruins it. The Prussian coinage was called in and struck anew on his lines in 1528."
 nd_pru_ordensburg_tradition: "Tradition d'Ordensbourg"
 nd_pru_ordensburg_tradition_desc: "Les imposantes forteresses en briques de l'Ordre Teutonique (Marienburg, Königsberg, Balga) ont établi une tradition d'architecture militaire qui a façonné la doctrine défensive prussienne pendant des siècles."
 nd_pru_arms_manufacture: "Manufacture d'armes prussienne"
 nd_pru_arms_manufacture_desc: "Les fonderies de fer et les ateliers d’armement prussiens approvisionnent l’armée en pleine croissance en armements standardisés et fiables."
 nd_pru_ducal_consolidation: "Consolidation Ducale"
 nd_pru_ducal_consolidation_desc: "La transformation du duché de Prusse d'un fief polonais en un État souverain nécessitait une consolidation administrative constante et l'affirmation de l'autorité ducale sur des intérêts locaux conflictuels."
 nd_pru_hussar_tradition: "Totenkopf Tradition Hussard"
 nd_pru_hussar_tradition_desc: "Frédéric le Grand transforma les hussards de cavalerie ornementale en une arme de guerre décisive. Les Hussards Totenkopf, portant la tête de mort sur leurs mirlitons, devinrent la cavalerie légère la plus redoutée d'Europe."
 nd_pru_cameralism: "Caméralisme"
 nd_pru_cameralism_desc: "La science prussienne des finances publiques, le caméralisme, traitait le royaume comme un grand domaine à gérer avec efficacité et prévoyance, centralisant la collecte des revenus par l'intermédiaire des Domnenkammern."
 nd_pru_officer_corps: "Corps des officiers prussiens"
 nd_pru_officer_corps_desc: "Le système Cadettenhaus forme les fils Junker dès l'enfance aux sciences militaires, créant ainsi un corps d'officiers professionnels liés par le devoir, l'honneur et une loyauté absolue envers la couronne."
 nd_pru_cantonment_system: "Système de cantonnement"
 nd_pru_cantonment_system_desc: "Le règlement cantonal de 1733 divisa la Prusse en cantons de recrutement, faisant de chaque sujet masculin un soldat potentiel. Cela donnait à la Prusse une armée largement disproportionnée par rapport à sa population."
 nd_pru_oblique_order: "Tactiques d'ordre oblique"
 nd_pru_oblique_order_desc: "La perfection de l'ordre oblique par Frédéric le Grand, massant la force contre le point le plus faible de l'ennemi tout en refusant le flanc opposé, a révolutionné la guerre européenne à Leuthen et Rossbach."
 nd_pru_general_staff: "L'état-major général"
 nd_pru_general_staff_desc: "Le Grosser Generalstab, né des cendres de la défaite de 1806, fut le premier organisme de planification militaire permanent au monde. Officiers sélectionnés au mérite et formés à la réflexion stratégique à la Kriegsakademie."
 nd_pru_feldjaeger_corps: "Corps Feldjaeger"
 nd_pru_feldjaeger_corps_desc: "Les Reitende Feldjaeger, éclaireurs à cheval et fusiliers, servaient d'yeux et de courriers à l'état-major prussien, combinant mobilité et adresse au tir."
 nd_pru_allgemeines_landrecht: "Allgemeines Landrecht"
 nd_pru_allgemeines_landrecht_desc: "Les lois générales de l’État de 1794 unifièrent la jurisprudence prussienne sous un seul code rationnel : une monarchie absolue se liant à l’État de droit."
 a_nd_pru_totenkopf_hussar: "Hussards Totenkopf"
 a_nd_pru_totenkopf_hussar_desc: "Cavalerie de choc d'élite portant l'insigne de la tête de mort. Rapide, agressif et totalement intrépide : la terreur des flancs et des lignes de ravitaillement ennemis."
 a_nd_pru_feldjaeger: "Feldjaeger"
 a_nd_pru_feldjaeger_desc: "Des fusiliers légers formés comme éclaireurs et tirailleurs. Des tireurs d'élite experts qui filtrent l'avancée de l'armée et harcèlent les formations ennemies avant l'assaut principal."
 a_nd_pru_kantonist: "Kantoniste"
 a_nd_pru_kantonist_desc: "Soldats conscrits élevés grâce au système de cantonnement. Paysans formés dès leur jeunesse, ils servent leur régiment à la guerre et leurs champs de Junker en paix."
 nd_pru_cadettenhaus: "Maison des cadets"
 nd_pru_cadettenhaus_desc: "Une académie militaire prussienne formant les fils de la noblesse Junker à la tactique, à l'exercice et à la science de la guerre dès leur plus jeune âge."
 nd_pru_cadettenhaus_upkeep: "Formation des cadets"
 nd_pru_cadettenhaus_upkeep_desc: "Armes, manuels d'exercices, livres de tactiques, chevaux pour les exercices de cavalerie et uniformes consommés dans l'entraînement incessant des futurs officiers."
 nd_pru_domaenenkammer: "Chambre Domanen"
 nd_pru_domaenenkammer_desc: "Un bureau des recettes caméralist qui administre les terres de la couronne et centralise la collecte des impôts avec l'efficacité prussienne."
 nd_pru_domaenenkammer_upkeep: "Fournitures administratives"
 nd_pru_domaenenkammer_upkeep_desc: "Du papier pour les registres et la correspondance, du tissu fin pour les sceaux officiels et les draperies, et des meubles pour les salles de comptage consommés par la bureaucratie caméraliste qui suit chaque thaler circulant dans le royaume."
 nd_pru_speicher: "Quay Granary"
 nd_pru_speicher_desc: "A tall brick Speicher on the waterfront. Grain that came down the river on rafts and barges is measured, stored and turned here until a sea ship takes it west. Danzig filled a whole island with such granaries."
 nd_pru_artushof: "Court of Arthur"
 nd_pru_artushof_desc: "The Artushof, the hall of a Prussian town's merchant brotherhoods. Each brotherhood has its bench; here ships are chartered, quarrels settled, envoys feasted, and the town's mind made up before the council meets."
 nd_pru_rittergut: "Rittergut"
 nd_pru_rittergut_desc: "A knightly estate farmed for the grain trade. The lord works his own fields with the labor of peasants bound to the soil, and sends the harvest downriver. The estate yields more grain, and the district answers to its Junker."
 nd_pru_amber_guild: "Guilde de l'Ambre"
 nd_pru_amber_guild_desc: "Une salle de guilde où des maîtres artisans transforment l'ambre brut de la Baltique en produits de luxe, bijoux et pièces décoratives : une tradition remontant au monopole de l'Ordre Teutonique sur Königsberg."
 nd_pru_speicher_upkeep: "Granary Keeping"
 nd_pru_speicher_upkeep_desc: "Brick and mortar against the damp, timber for floors and hoists, and the measures and shovels of the sworn grain measurers."
 nd_pru_artushof_upkeep: "The Brotherhoods' Table"
 nd_pru_artushof_upkeep_desc: "Beer by the barrel, wine for guests of rank, and candles for the long evenings at the benches."
 nd_pru_rittergut_upkeep: "Demesne Farming"
 nd_pru_rittergut_upkeep_desc: "Draught oxen, ploughs and harrows, and timber for the barns of the lord's home farm."
 nd_pru_amber_workshop: "Traitement de l'ambre"
 nd_pru_amber_workshop_desc: "Les maîtres artisans coupent, polissent et sertissent l’ambre de la Baltique pour en faire des bijoux raffinés et des pièces décoratives prisées dans toute l’Europe."
 nd_pru_arms_foundry: "Fonderie d'armes"
 nd_pru_arms_foundry_desc: "Un atelier d'armes prussien produisant des mousquets, des baïonnettes et des munitions standardisés pour une armée en pleine croissance."
 nd_pru_iron_foundry: "Fonderie de fer"
 nd_pru_iron_foundry_desc: "Les fonderies de fer prussiennes fondaient le minerai et forgeaient des mousquets, des baïonnettes et des équipements standardisés pour l'armée en pleine croissance."
 levy_nd_pru_kantonist: "Prélèvement cantoniste"
 levy_nd_pru_kantonist_desc: "Des conscrits du système de cantonnement issus des districts de recrutement assignés, servant sous les ordres des officiers Junker de leurs domaines d'origine."
 nd_pru_formed_tt: "La Prusse est formée"
 nd_pru_path_a_tt: "Choisissez le royaume de fer"
 nd_pru_path_b_tt: "Choisissez l’État éclairé"
 nd_pru_destiny: "Le destin prussien"
 nd_pru_destiny_desc: "La Prusse est forgée. Il lui faut désormais trouver sa place parmi les grandes puissances européennes. Maintenir la stabilité pendant que nous traçons notre cap."
 nd_pru_dest_schlesien: "La conquête silésienne"
 nd_pru_dest_schlesien_desc: "Prenez la riche province de Silésie aux Habsbourg. Le contrôle de Wroclaw et de ses industries transformera la Prusse d'un royaume mineur en une véritable puissance militaire. Nécessite 30 000 hommes sous les armes."
 nd_pru_dest_krieg: "Les guerres frédériennes"
 nd_pru_dest_krieg_desc: "Étendez la domination prussienne sur la Saxe et la Poméranie. La conquête de Dresde et de Stettin sécurisera nos flancs et démontrera que la Prusse peut tenir ce qu'elle s'empare contre toute l'Europe. Nécessite 2 000 pièces d'or dans le trésor."
 nd_pru_dest_koenig: "L'héritage du roi soldat"
 nd_pru_dest_koenig_desc: "Complete the domination of northern Germany. Berlin, Magdeburg, and Hanover must fall under Prussian control, and the Cantonment System must be in place. With 75,000 soldiers and unrivaled prestige, Prussia will stand as the paramount military power of the continent."
 nd_pru_dest_pietismus: "Les écoles piétistes"
 nd_pru_dest_pietismus_desc: "La révolution éducative d'August Hermann Francke à Halle a montré ce que la gouvernance rationnelle pouvait réaliser. Saisissez Halle et adoptez l’institution bancaire pour jeter les bases économiques d’un État éclairé."
 nd_pru_dest_kameralist: "Le modèle Cameralist"
 nd_pru_dest_kameralist_desc: "Build a state that runs like a well-oiled machine. The plague of 1709 emptied Prussian Lithuania; Frederick William I resettled it from Gumbinnen with Salzburg exiles and set a War and Domains Chamber over it. Hold Gumbinnen and raise it to 20 development, amass 2,000 gold, and ensure books are traded in the capital market to fuel the Prussian bureaucracy."
 nd_pru_dest_gumbinnen_developed_tt: "We own #bold Gumbinnen#! and its development is at least #bold 20#!"
 nd_pru_dest_aufklaerung: "L'Aufklarung"
 nd_pru_dest_aufklaerung_desc: "Make Prussia the intellectual capital of Europe. Seize Leipzig (the publishing heart of the continent), hold Konigsberg, the city of the Albertina and of Kant, and raise it to 43 development, achieve the highest prestige, and embrace the Enlightenment."
 nd_pru_dest_konigsberg_developed_tt: "We own #bold Konigsberg#! and its development is at least #bold 43#!"
 nd_pru.6.t: "Le destin prussien"
 nd_pru.6.d: "The Prussian state stands at a crossroads. Behind us lie the marshes of Brandenburg and the ruined castles of the Teutonic Order. Before us stretches the future of a nation that has already defied the odds merely by existing. A kingdom built on sand, surrounded by enemies on every side, with no natural frontiers and few resources beyond the discipline of its people.\n\nYet it is precisely this adversity that has forged the Prussian character. We cannot afford the luxury of complacency. Every generation must earn anew what the last has built. The question is not whether Prussia will act, but in which direction we shall march."
 nd_pru.6.a: "La Prusse perdure."
 nd_pru.7.t: "Le viol de la Silésie"
 nd_pru.7.d: "When the young king mounted the throne and learned that the Habsburg emperor had died leaving only a daughter to inherit, he saw an opportunity that history offers perhaps once in a century. Without declaration of war, without diplomatic pretext, Prussian columns marched into Silesia, one of the richest provinces in Central Europe, with its linen manufactories, iron mines, and teeming population.\n\nThe seizure was a calculated gamble of the highest order. Every great power in Europe would oppose us. But Silesia doubles our population, triples our industry, and transforms Prussia from a curiosity into a contender. The conquest is complete. Now we must hold it."
 nd_pru.7.a: "La Silésie est prussienne."
 nd_pru.8.t: "La guerre de Sept Ans"
 nd_pru.8.d: "Prussia has survived the nightmare. Encircled by France, Austria, Russia, Sweden, and Saxony simultaneously (outnumbered five to one in every theater), the kingdom fought for seven years on the edge of annihilation. At Rossbach, at Leuthen, at Zorndorf, Prussian arms prevailed through speed, discipline, and the sheer refusal to accept defeat.\n\nThe war has devastated our lands but proven our mettle. Every court in Europe now treats Prussia as a great power. How shall we capitalize on this survival?"
 nd_pru.8.a: "Appuyez sur notre avantage. Prenez l'initiative."
 nd_pru.8.b: "Consolider et fortifier ce que nous détenons."
 nd_pru.9.t: "Maître de l'Allemagne du Nord"
 nd_pru.9.d: "The work of generations is complete. From Konigsberg to the Rhine, from the Baltic to the Harz Mountains, Prussian authority extends across the breadth of northern Germany. Berlin has grown from a provincial garrison town into one of Europe's great capitals. Magdeburg, the strongest fortress on the Elbe, guards our heartland. Hanover, once the seat of a rival electorate, now answers to our crown.\n\nPrussia commands the largest and finest army on the continent. The question before us now is how we shall wield this unprecedented power."
 nd_pru.9.a: "Mobilisation totale. Chaque ressource est au service de l'armée."
 nd_pru.9.b: "L’hégémonie prussienne parle d’elle-même."
 nd_pru.10.t: "Les Fondations Francke"
 nd_pru.10.d: "In the university town of Halle, the Pietist theologian August Hermann Francke has built something unprecedented: an entire educational complex encompassing an orphanage, schools for the poor, a pharmacy, a printing press, and a teachers' seminary. The Franckesche Stiftungen demonstrate that systematic investment in human capital yields returns no mere treasury can match.\n\nFrancke's methods (practical education, universal literacy, rational curriculum) have attracted attention across Europe. They represent the seed of something larger: a state that derives its strength not from soldiers but from the quality of its citizens."
 nd_pru.10.a: "La raison est le fondement de l’État."
 nd_pru.11.t: "La révolution caméraliste"
 nd_pru.11.d: "The Prussian model of governance has matured into a science. The Cameralists (state economists trained at Halle and Frankfurt an der Oder) treat the kingdom as a single vast estate to be managed with precision. Every forest, mine, manufactory, and customs house is inventoried, taxed, and optimized.\n\nThe result is a state of remarkable efficiency. Prussia collects more revenue per capita than France, builds more roads per square mile than England, and educates more children per parish than any kingdom in Europe. Two schools of thought compete for influence."
 nd_pru.11.a: "L'État doit construire. Investissez dans les infrastructures."
 nd_pru.11.b: "La connaissance est une richesse. Investissez dans les esprits."
 nd_pru.12.t: "L'Aufklarung triomphante"
 nd_pru.12.d: "Leipzig, the publishing capital of Europe, now operates under Prussian law. Its book fairs distribute the ideas of Kant, Lessing, and Moses Mendelssohn across the continent. Prussian universities lead the world in philosophy, theology, and the natural sciences. The Allgemeines Landrecht has codified the most comprehensive legal system in Europe.\n\nFrederick's vision of an enlightened state has been realized beyond anything he could have imagined. Prussia is admired not for the size of its army but for the quality of its governance, the tolerance of its society, and the brilliance of its thinkers. Two visions of enlightened governance now compete for the future."
 nd_pru.12.a: "Absolutisme éclairé. Réforme par le haut."
 nd_pru.12.b: "Principes constitutionnels. Réformer par la loi."
 STATIC_MODIFIER_NAME_nd_pru_dest_krieg_rapid: "Doctrine de conquête rapide"
 STATIC_MODIFIER_DESC_nd_pru_dest_krieg_rapid: "Strike before the enemy can prepare. Swift wars of aggression seize territory faster than coalitions can form against us, at the cost of diplomatic standing."
 STATIC_MODIFIER_NAME_nd_pru_dest_krieg_iron: "Consolidation du fer"
 STATIC_MODIFIER_DESC_nd_pru_dest_krieg_iron: "Fortifiez chaque conquête, réprimez chaque rébellion et alignez une armée qu'aucune alliance n'ose défier."
 STATIC_MODIFIER_NAME_nd_pru_dest_koenig_mobil: "Mobilisation totale"
 STATIC_MODIFIER_DESC_nd_pru_dest_koenig_mobil: "Every resource in the kingdom serves the war machine. Raw materials flow to foundries and arsenals, and the population accepts the burdens of military supremacy, even at the cost of court expenditures."
 STATIC_MODIFIER_NAME_nd_pru_dest_koenig_hegemon: "Hégémonie prussienne"
 STATIC_MODIFIER_DESC_nd_pru_dest_koenig_hegemon: "L'aigle couronné de Prusse impose le respect universel. Une autorité légitime, une influence culturelle et des domaines satisfaits font du royaume l'arbitre des affaires d'Europe centrale."
 STATIC_MODIFIER_NAME_nd_pru_dest_kamer_mercant: "Efficacité mercantiliste"
 STATIC_MODIFIER_DESC_nd_pru_dest_kamer_mercant: "L'État caméraliste oriente les investissements vers les infrastructures et l'industrie, réduisant ainsi les coûts de construction, stimulant la production et responsabilisant les marchands prussiens."
 STATIC_MODIFIER_NAME_nd_pru_dest_kamer_wissen: "Société Wissensgesellschaft"
 STATIC_MODIFIER_DESC_nd_pru_dest_kamer_wissen: "Une société organisée autour de la connaissance. Les universités prussiennes, les réseaux d’espionnage et les canaux diplomatiques étendent leur influence et recueillent des renseignements avec une efficacité inégalée."
 STATIC_MODIFIER_NAME_nd_pru_dest_aufkl_absolut: "Absolutisme éclairé"
 STATIC_MODIFIER_DESC_nd_pru_dest_aufkl_absolut: "Le roi-philosophe gouverne également tous ses sujets. La tolérance religieuse, l’intégration culturelle et l’acceptation de la diversité renforcent l’État de l’intérieur."
 STATIC_MODIFIER_NAME_nd_pru_dest_aufkl_verfass: "État de l'État"
 STATIC_MODIFIER_DESC_nd_pru_dest_aufkl_verfass: "Un État constitutionnel régi par la loi et non par le caprice royal. La croissance démographique s’épanouit dans des institutions stables, tandis que la réforme budgétaire réduit le coût de la guerre et de la dette."
 nd_pru_kriegsakademie: "Académie Krieg"
 nd_pru_kriegsakademie_desc: "L'École de guerre prussienne, successeur de la Kriegsakademie de Scharnhorst, forme les officiers à l'art du commandement grâce à une étude rigoureuse de la stratégie, de la tactique et de l'histoire militaire."
 nd_pru_kriegsakademie_upkeep: "Opérations du Collège de guerre"
 nd_pru_kriegsakademie_upkeep_desc: "Des armes pour les exercices, des livres de stratégie, du papier pour les plans de guerre et des chevaux pour les exercices de cavalerie utilisés dans l'entraînement de l'élite militaire prussienne."
 nd_pru_universitat: "Université"
 nd_pru_universitat_desc: "Une université de recherche prussienne de tradition humboldtienne, unissant enseignement et recherche. Ses facultés font progresser les connaissances en philosophie, en sciences naturelles et en droit."
 nd_pru_universitat_upkeep: "Opérations universitaires"
 nd_pru_universitat_upkeep_desc: "Livres pour la bibliothèque, papier pour les publications scientifiques, verre pour les appareils de laboratoire et mobilier pour les amphithéâtres consommés par la poursuite du savoir."
 pru_generaldirektorium_bureaucracy: "Directeur général"
 pru_generaldirektorium_bureaucracy_desc: "The General Superior Directory of Finance, War, and Domains, established by Frederick William I on 20 December 1722 and effective from 1723. It merged the rival General Finance Directory and General War Commissariat into a single collegial body presided over by the king himself, with five vice-presidents and fourteen councillors selected for expertise rather than birth. Its provincial Kriegs- und Domaenenkammern bypassed the noble Staende of the Junkertum and tied financial, military, and domanial administration directly to the throne. In East Prussia the land tax they gathered fell on noble estates as on peasant farms. The Directory doubled crown revenue between 1715 and 1740 and produced the absolutist apparatus that underpinned every later Hohenzollern campaign."
 pru_kantonsystem_bureaucracy: "Système cantonal"
 pru_kantonsystem_bureaucracy_desc: "Le règlement cantonal de recrutement de 1733, par lequel Frédéric-Guillaume Ier divisa le royaume en Kantone géographiquement définis, chacun lié à un régiment d'infanterie spécifique. De robustes fils de paysans étaient enrôlés dès l'adolescence et appelés à suivre deux mois de formation chaque printemps, retournant aux champs en dehors de la saison de campagne ; le système soutenait ainsi l’armée proportionnellement la plus grande d’Europe sans paralyser la base agraire. Les nobles, les bourgeois urbains, les fils uniques de fermiers, les étrangers et les artisans de valeur en étaient inconditionnellement exemptés : le fardeau de la conscription tombait sur la paysannerie des provinces orientales, les liant de plus en plus étroitement aux domaines de leurs seigneurs."
 pru_junker_corps_bureaucracy: "Generaladjutantur"
 pru_junker_corps_bureaucracy_desc: "The office of the king's adjutants general, through which every commission, promotion and leave in the Prussian army passes. Under Frederick William I it keeps the rank list of each regiment and a yearly conduct list on every officer, and the king reads them himself. Commissions are kept for the nobility: after 1763 Frederick II removes most of the commoners who were made officers during the war. Out of this office the Military Cabinet of the reform years grows."
 pru_allgemeines_landrecht_bureaucracy: "Allgemeines Landrecht"
 pru_allgemeines_landrecht_bureaucracy_desc: "Les lois générales des États prussiens, rédigées sous Frédéric II par Carl Gottlieb Svarez et Ernst Ferdinand Klein et promulguées le 5 février 1794. À travers quelque dix-sept mille articles, elles imposaient une loi rationnelle uniforme à chaque province prussienne, codifiant le droit civil, pénal, familial et administratif dans un seul recueil et obligeant même le roi à ses dispositions - une concession frappante de la monarchie absolue à l'État de droit. Le maintien de la Staendegesellschaft et du servage est-elbien reflétait son caractère transitoire ; néanmoins le Landrecht gouverna la Prusse jusqu'au Code civil impérial de 1900."
 pru_domaenenkammern_bureaucracy: "Châteaux Domaenen"
 pru_domaenenkammern_bureaucracy_desc: "Les Kriegs- und Domaenenkammern provinciales, présidées par un président de chambre et composées de conseillers salariés formés aux sciences caméralistes. Ils administraient le domaine royal, louaient les terres de la couronne dans le cadre de contrats à court terme basés sur la productivité et supervisaient la collecte des impôts dans les villes par l'intermédiaire des Steuerraete subordonnés. En substituant l'expertise fiscale professionnelle aux négociations du noble Landstaende, les Chambres extrayaient des revenus avec une discipline inégalée en Europe ; le fonctionnaire salarié de tradition continentale du XIXe siècle est leur descendant direct."
 pru_grosser_generalstab_bureaucracy: "Grosser Generalstab"
 pru_grosser_generalstab_bureaucracy_desc: "Le Grand État-major, organisé après la catastrophe d'Iéna-Auerstedt en 1806 par Scharnhorst, Gneisenau et la Commission de réorganisation militaire, et officialisé par la loi en 1814. Ses officiers étudiaient en permanence les plans de mobilisation, préparaient les cartes opérationnelles de chaque théâtre probable et apprenaient la doctrine de l'Auftragstaktik dans laquelle un subordonné exécute l'intention du commandant plutôt que d'attendre des ordres explicites. La promotion se faisait par concours et par compétence démontrée plutôt que par naissance : un reproche au corps des officiers Junker qui a fonctionné en parallèle pendant le reste du siècle, et un modèle que toutes les armées modernes finiraient par copier."
 pru_kriegsakademie_bureaucracy: "Académie Krieg"
 pru_kriegsakademie_bureaucracy_desc: "L'Allgemeine Kriegsschule, fondée à Berlin par Gerhard von Scharnhorst le 15 octobre 1810, était l'un des trois collèges destinés à former un cadre d'officier d'état-major professionnel. Trois années de mathématiques, de physique, d'histoire militaire, de tactique appliquée et de conduite d'état-major étaient une condition préalable à la nomination au Grosser Generalstab. Carl von Clausewitz avait étudié dans l'institution qui l'avait précédée sous la direction de Scharnhorst lui-même ; Helmuth von Moltke l'Ancien y enseigna dans les années 1820. Les diplômés de l’Akademie (issus en grande partie de milieux non nobles) formaient le noyau intellectuel de l’armée prussienne et plus tard allemande."
 AUTO_MODIFIER_NAME_nd_pru_bureaucracy_authority: "Bureaucratie de Hohenzollern"
 AUTO_MODIFIER_DESC_nd_pru_bureaucracy_authority: "La proclamation du Royaume de Prusse a fait mûrir l'appareil institutionnel du royaume : le Directoire général préside aux finances et à la guerre, les Kammern provinciaux prélèvent les impôts du roi, les Junker squirearchy officiers ses régiments, et le règlement cantonal enrôle ses paysans. C’est à partir de ce fondement fiscal et militaire que les institutions étatiques distinctives de la Prusse commencent à prendre leur forme durable."
