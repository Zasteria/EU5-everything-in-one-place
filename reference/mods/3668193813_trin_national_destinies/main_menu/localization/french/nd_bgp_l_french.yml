l_french:
 STATIC_MODIFIER_NAME_nd_bgp_rhone_corridor: "Le couloir du Rhône"
 STATIC_MODIFIER_DESC_nd_bgp_rhone_corridor: "D'Avignon à Lyon, le Rhône est notre grande artère, transportant le vin, la soie et la culture vers le monde entier. Nous sommes les héritiers des troubadours et de la cour papale, une civilisation qui valorise la beauté, le savoir et l’art de bien vivre."
 STATIC_MODIFIER_NAME_nd_bgp_alpine_gatekeepers: "Gardiens des portes alpines"
 STATIC_MODIFIER_DESC_nd_bgp_alpine_gatekeepers: "Nous contrôlons les hauts cols où les armées et les marchands doivent payer notre tribut. Les montagnes sont nos remparts, les cols nos portes. Ce qui traverse les Alpes passe à notre guise, et chaque train muletier qui descend en Italie enrichit notre trésor."
 STATIC_MODIFIER_NAME_nd_bgp_papal_patronage: "Patronage papal"
 STATIC_MODIFIER_DESC_nd_bgp_papal_patronage: "L'héritage de la papauté d'Avignon perdure dans nos cours : une tradition de splendeur ecclésiastique, de commande artistique et de recherche scientifique qui élève notre royaume au-dessus de ses voisins."
 STATIC_MODIFIER_NAME_nd_bgp_salt_monopoly: "Monopole du sel"
 STATIC_MODIFIER_DESC_nd_bgp_salt_monopoly: "L'or blanc de Franche-Comté coule de nos salines pour alimenter la moitié de l'Europe. Ce monopole sur la denrée la plus essentielle de la nature remplit nos coffres et lie les cantons voisins à notre commerce."
 nd_bgp.1.t: "Le Royaume restauré"
 nd_bgp.1.d: "The old Kingdom of Burgundy, the Kingdom of Arles, lives again. For centuries this realm existed only as a memory, its lands fragmented between French kings, Savoyard dukes, and Imperial pretenders. Now a single crown unites the Rhone valley from the Alpine passes to the Mediterranean shore, from the vineyards of Provence to the salt works of the Jura.\n\nBut what kind of kingdom shall this be? The Rhone corridor stretches south toward the sea, a natural highway for commerce and culture. Avignon's papal legacy and the troubadour courts offer a path of refinement, trade, and Mediterranean sophistication. Alternatively, our Alpine heartland gives us command of every pass between France and Italy: a toll-master's paradise and a mountain fortress that no army can easily breach.\n\nThe choice will define our dynasty.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_bgp.1.a: "Le Rhône est notre autoroute. Que le vin et les chants coulent vers la mer vers le sud."
 nd_bgp.1.b: "Nous sommes les gardiens des Alpes. Personne ne passera sans notre permission."
 nd_bgp.2.t: "L'héritage de la cour papale"
 nd_bgp.2.d: "For seventy years, the popes made Avignon the center of Christendom. Though the Holy See returned to Rome in 1377, the imprint of papal patronage on Provence is indelible. The Palais des Papes still towers over the Rhone, the largest Gothic palace in Europe: a monument to the artistic ambitions of Popes Clement V, John XXII, and their successors.\n\nUnder papal patronage, Simone Martini brought Sienese painting to Avignon. Matteo Giovannetti covered chapel walls with intricate frescoes. The papal library became one of Europe's finest. Pope John XXII planted the vineyards of Chateauneuf-du-Pape and refined the viticulture of the entire region.\n\nThis legacy of artistic and intellectual patronage remains a wellspring for our court."
 nd_bgp.2.a: "Nous serons de dignes héritiers de l’héritage papal."
 nd_bgp.3.t: "L'Or Blanc des Salins"
 nd_bgp.3.d: "The Grande Saline of Salins-les-Bains has produced salt for over a thousand years. In the medieval period, it became the economic capital of Franche-Comte, eight hundred workers laboring in its vast underground galleries to extract brine from wells plunging deep into the Jurassic bedrock. The salt fed Burgundy, Franche-Comte, and half the Swiss cantons.\n\nThe salines generate half the region's income. Control of this white gold gives us leverage over our neighbors and a reliable source of wealth that neither war nor famine can easily disrupt. We would be wise to expand and modernize our salt works."
 nd_bgp.3.a: "Les salines sont le trésor de notre royaume."
 nd_bgp.4.t: "Les compagnies d'ordonnance"
 nd_bgp.4.d: "Following the example of the Burgundian dukes, we have published detailed military ordinances standardizing the equipment, training, and organization of our soldiers. The old feudal host, where each lord brought whatever men he could muster in whatever arms they possessed, gives way to companies of ordonnance: permanent formations of men-at-arms, archers, pikemen, and handgunners operating under a unified chain of command.\n\nEach company of nine hundred men is organized into squadrons, with heavy cavalry supported by mounted archers and foot soldiers in disciplined combined-arms formations. Uniforms, standardized weapons, and regular drill transform a feudal rabble into a professional force."
 nd_bgp.4.a: "La discipline et l'organisation seront notre force."
 nd_bgp_troubadour_courts: "Tribunaux des Troubadours"
 nd_bgp_troubadour_courts_desc: "Les cours de Provence et de la vallée du Rhône ont donné naissance à la tradition des troubadours : le premier grand corpus de poésie lyrique profane dans une langue vernaculaire européenne, célébrant l'amour courtois, la vertu chevaleresque et le raffinement de la noblesse de langue occitane."
 nd_bgp_alpine_toll_mastery: "Maîtrise du péage alpin"
 nd_bgp_alpine_toll_mastery_desc: "Le contrôle des principaux cols alpins (Grand Saint-Bernard, Mont Cenis et Simplon) permet de percevoir des péages sur chaque caravane marchande, colonne de pèlerins et expédition militaire traversant entre la France et l'Italie."
 nd_bgp_rhone_viticulture: "Viticulture du Rhône"
 nd_bgp_rhone_viticulture_desc: "Les terrasses ensoleillées de la vallée du Rhône produisent du vin depuis l'époque romaine. Les communautés monastiques ont perfectionné l'art de la viticulture au fil des siècles, créant une tradition qui produirait à terme certains des meilleurs millésimes d'Europe."
 nd_bgp_montagnard_tradition: "Tradition montagnarde"
 nd_bgp_montagnard_tradition_desc: "La cavalerie de montagne savoyarde, des cavaliers robustes élevés dans les vallées alpines, sont particulièrement adaptés aux terrains accidentés où s'effondrent les cavaliers des plaines. Ils servent d'éclaireurs, de raiders et de défenseurs des passes."
 nd_bgp_arpitan_identity: "Identité Arpitaine"
 nd_bgp_arpitan_identity_desc: "Les traditions linguistiques arpitane et occitane unissent les divers peuples du royaume bourguignon-provençal, depuis les franco-provençaux des vallées alpines jusqu'aux troubadours provençaux du littoral méditerranéen."
 nd_bgp_comital_courts: "Tribunaux comitaux"
 nd_bgp_comital_courts_desc: "Les tribunaux comitaux de Savoie ont établi une tradition d'administration centralisée qui perdurera pendant des siècles, les comtes, puis les ducs, conservant une juridiction effective sur leurs domaines alpins fragmentés."
 nd_bgp_avignon_legacy: "Héritage d'Avignon"
 nd_bgp_avignon_legacy_desc: "Les soixante-dix années de la papauté d'Avignon (1309-1377) ont laissé une marque indélébile sur la Provence : le Palais des Papes, les traditions artistiques de Simone Martini et Matteo Giovannetti et une culture savante cosmopolite qui a persisté longtemps après le retour des papes à Rome."
 nd_bgp_chateauneuf: "Châteauneuf-du-Pape"
 nd_bgp_chateauneuf_desc: "Le pape Jean XXII plante les vignes qui porteront le nom de son château, Châteauneuf-du-Pape. En 1344, près de la moitié des terres environnantes étaient consacrées à la viticulture, produisant des vins qui rivalisaient avec les meilleurs d'Europe. L’imprimatur papal a élevé la vinification du Rhône au rang d’art."
 nd_bgp_grande_saline: "Grande Saline"
 nd_bgp_grande_saline_desc: "Les salines de Salins-les-Bains en Franche-Comté : l'un des plus grands complexes industriels d'Europe, produisant 14 000 tonnes de sel par an et employant plus de 800 ouvriers. Cet or blanc alimentait la moitié de l'Est de la France et les cantons suisses."
 nd_bgp_savoyard_chancery: "Chancellerie savoyarde"
 nd_bgp_savoyard_chancery_desc: "L'appareil administratif de l'État savoyard : une chancellerie professionnelle composée de scribes et de notaires qualifiés qui entretenaient l'appareil juridique et diplomatique d'un royaume à cheval sur les Alpes."
 nd_bgp_provencal_galleys: "Galères provençales"
 nd_bgp_provencal_galleys_desc: "Les ports de Marseille et de Toulon lancèrent des galères qui patrouillaient en Méditerranée occidentale, défendant les routes commerciales provençales et projetant leur puissance le long de la côte, du delta du Rhône jusqu'à la côte ligure."
 nd_bgp_burgundian_drill: "Foret Bourguignon"
 nd_bgp_burgundian_drill_desc: "Les réformes militaires des ducs de Bourgogne mettaient l'accent sur l'exercice régulier, l'équipement standardisé et les formations disciplinées : des innovations qui transformèrent l'armée médiévale en une armée proche d'une armée professionnelle."
 nd_bgp_ordonnance_reform: "Réforme des ordonnances"
 nd_bgp_ordonnance_reform_desc: "Les compagnies d'ordonnance : formations militaires permanentes de 900 hommes organisées en escadrons interarmes de hommes d'armes, d'archers, de piquiers et de canonniers. Créés pour la première fois par les ordonnances de Charles le Téméraire de 1471 à 1473, ils représentent une révolution dans l'organisation militaire européenne."
 nd_bgp_rhone_trade_system: "Système de Commerce du Rhône"
 nd_bgp_rhone_trade_system_desc: "Le Rhône constitue une autoroute commerciale naturelle reliant la Méditerranée au cœur de la France. Le commerce fluvial, les privilèges équitables et les réseaux commerciaux établis font de la vallée du Rhône l'un des corridors les plus prospères d'Europe occidentale."
 nd_bgp_mountain_fortresses: "Forteresses de montagne"
 nd_bgp_mountain_fortresses_desc: "Les bastilles de Savoie, forteresses de pierre dominant les cols alpins et les points d'étranglement des vallées, font de toute invasion du royaume un cauchemar de guerre de siège en terrain hostile."
 nd_bgp_literary_renaissance: "Renaissance littéraire"
 nd_bgp_literary_renaissance_desc: "Les traditions littéraires de Provence connaissent une renaissance, avec des tribunaux condescendants, des poètes et des premiers imprimeurs qui diffusent des connaissances en latin et en langue vernaculaire occitane."
 nd_bgp_order_annunciation: "Ordre de l'Annonciation"
 nd_bgp_order_annunciation_desc: "L'Ordre suprême de la Très Sainte Annonciation, fondé par Amédée VI de Savoie en 1362, compte parmi les ordres chevaleresques les plus prestigieux d'Europe. L'adhésion lie la plus haute noblesse à la cause savoyarde et renforce le prestige diplomatique à travers la chrétienté."
 nd_bgp_silk_introduction: "Ateliers de Soie"
 nd_bgp_silk_introduction_desc: "L'introduction du tissage de la soie dans la vallée du Rhône, d'abord sous influence italienne, fera de Lyon l'un des grands centres européens de la soie. L'artisanat exige des compétences, des capitaux et un accès à la soie grège de l'Est."
 nd_bgp_confessional_crossroads: "Carrefour confessionnel"
 nd_bgp_confessional_crossroads_desc: "Situé entre la France catholique, la Genève réformée et l’Empire divisé sur le plan confessionnel, le royaume bourguignon-provençal doit naviguer dans les guerres de religion avec une tolérance pragmatique ou un alignement décisif."
 nd_bgp_savoyard_infantry: "Infanterie savoyarde"
 nd_bgp_savoyard_infantry_desc: "L'infanterie savoyarde professionnelle, entraînée selon la tradition du brochet et du tir et influencée à la fois par les méthodes italiennes de condottiere et d'ordonnance bourguignonne, constitue l'épine dorsale de l'armée permanente."
 nd_bgp_centralized_administration: "Administration centralisée"
 nd_bgp_centralized_administration_desc: "Un appareil administratif centralisé, centré sur la capitale Chambéry, apporte une gouvernance cohérente aux divers territoires du royaume, des vallées alpines aux ports méditerranéens."
 nd_bgp_toll_modernization: "Modernisation des péages"
 nd_bgp_toll_modernization_desc: "Uniformisation du système de péage et de douane sur tous les cols alpins et traversées du Rhône, en remplaçant la mosaïque de péages locaux par un système de recettes rationnel qui maximise les revenus tout en réduisant les frictions pour les commerçants établis."
 nd_bgp_marseille_port: "Port de Marseille"
 nd_bgp_marseille_port_desc: "L'expansion des installations navales de Marseille transforme l'ancien port en un véritable arsenal capable de construire et d'entretenir des navires de guerre pour les opérations méditerranéennes."
 nd_bgp_university_tradition: "Tradition universitaire"
 nd_bgp_university_tradition_desc: "L'Université d'Avignon, fondée en 1303, et d'autres institutions d'enseignement à travers le royaume cultivent une tradition d'érudition juridique et théologique qui soutient la compétence administrative et la vitalité intellectuelle."
 nd_bgp_absolutist_state: "État absolutiste"
 nd_bgp_absolutist_state_desc: "Centralisation de l'autorité royale sur le modèle français, consolidant la mosaïque de juridictions féodales, de communes autonomes et de libertés ecclésiastiques en un État absolutiste unifié."
 nd_bgp_standing_army: "Armée permanente"
 nd_bgp_standing_army_desc: "Professionnalisation de l'armée en une force permanente permanente d'infanterie de ligne, remplaçant les levées saisonnières et les compagnies de mercenaires des siècles précédents par des soldats formés toute l'année aux exercices modernes."
 nd_bgp_fortress_modernization: "Modernisation de la forteresse"
 nd_bgp_fortress_modernization_desc: "Modernisation du réseau de forteresses alpines selon les principes de Vauban : forts en étoile avec bastions d'angle remplaçant les courtines médiévales, modernisés pour résister aux bombardements d'artillerie."
 nd_bgp_wine_appellations: "Appellations de vin"
 nd_bgp_wine_appellations_desc: "Codification des normes de production viticole et des appellations régionales, précurseur du système moderne d'AOC qui deviendra le cadeau de la France à la viticulture. Le contrôle qualité et l'appellation géographique protègent la réputation et la valeur des vins bourguignons et provençaux."
 nd_bgp_arsenal_expansion: "Extension de l'Arsenal"
 nd_bgp_arsenal_expansion_desc: "Expansion de la capacité navale méditerranéenne avec la construction de frégates pour la protection commerciale et la patrouille côtière, établissant une force navale propre à garantir les intérêts maritimes provençaux."
 nd_bgp_salon_culture: "Culture des salons"
 nd_bgp_salon_culture_desc: "Les Lumières arrivent dans les salons de Lyon, Avignon et Chambéry (rassemblements de philosophes, de scientifiques et de personnalités littéraires) qui débattent de philosophie naturelle, de réforme politique et des droits de l'homme."
 nd_bgp_modern_viticulture: "Viticulture moderne"
 nd_bgp_modern_viticulture_desc: "Les méthodes proto-industrielles transforment la production viticole d'un artisanat artisanal en une industrie systématique : de grands domaines employant des techniques agricoles modernes, une fermentation contrôlée et des réseaux d'exportation organisés."
 nd_bgp_constitutional_reform: "Réforme constitutionnelle"
 nd_bgp_constitutional_reform_desc: "La gouvernance représentative et les principes constitutionnels remplacent le régime absolutiste, établissant des assemblées législatives, des droits codifiés et une rationalisation administrative dans tout le royaume."
 nd_bgp_citizen_levy: "Prélèvement citoyen"
 nd_bgp_citizen_levy_desc: "Les Chasseurs Alpins, infanterie de montagne d'élite recrutée parmi les populations rustiques des vallées alpines, entraînée à la guerre sur les terrains les plus exigeants d'Europe."
 nd_bgp_alpine_infrastructure: "Infrastructure alpine"
 nd_bgp_alpine_infrastructure_desc: "Construction moderne de routes et de tunnels à travers les Alpes : des prouesses techniques qui réduisent l'isolement des vallées montagneuses et accélèrent le flux commercial à travers les barrières naturelles les plus formidables du royaume."
 nd_bgp_national_consciousness: "Conscience nationale"
 nd_bgp_national_consciousness_desc: "Une identité nationale bourguignonne-provençale distincte émerge (ni entièrement française, ni italienne, ni suisse), mais une civilisation méditerranéenne-alpine unique enracinée dans la poésie troubadour, la culture du vin, l'indépendance montagnarde et la mémoire de l'ancien royaume d'Arles."
 a_nd_bgp_montagnard_cavalry: "Cavalerie montagnarde"
 a_nd_bgp_montagnard_cavalry_desc: "De robustes cavaliers savoyards venus des vallées alpines, élevés sur des sentiers de montagne où la cavalerie des plaines ne peut opérer. Ils servent d'éclaireurs, de défenseurs des passes et de pillards dans les hauts pays."
 a_nd_bgp_ordonnance_lance: "Lance d'artillerie"
 a_nd_bgp_ordonnance_lance_desc: "Compagnies professionnelles de cavalerie interarmes organisées selon les ordonnances militaires bourguignonnes. Chaque lance comprend des hommes d'armes, des archers et une infanterie de soutien fonctionnant comme une unité interarmes disciplinée."
 a_nd_bgp_savoyard_tercios: "Tercios savoyards"
 a_nd_bgp_savoyard_tercios_desc: "Infanterie savoyarde professionnelle de pique et de tir, combinant la sophistication tactique italienne avec la discipline organisationnelle bourguignonne. Formé à la bataille ouverte et à la guerre en montagne."
 a_nd_bgp_line_infantry: "Infanterie de ligne"
 a_nd_bgp_line_infantry_desc: "Des soldats professionnels de l'armée permanente formés aux tactiques linéaires modernes, constituent l'épine dorsale fiable de l'armée du royaume."
 a_nd_bgp_chasseurs_alpins: "Chasseurs Alpins"
 a_nd_bgp_chasseurs_alpins_desc: "Infanterie de montagne d'élite : légère, rapide et impitoyablement efficace en terrain alpin. Recrutés parmi les populations montagnardes les plus robustes, ils constituent les meilleures troupes de montagne d'Europe."
 n_nd_bgp_provencal_galley: "Cuisine Provençale"
 n_nd_bgp_provencal_galley_desc: "Galères de guerre agiles en Méditerranée construites dans les ports de Provence, plus rapides que les galères standards et optimisées pour les opérations côtières en Méditerranée occidentale."
 n_nd_bgp_frigate: "Frégate provençale"
 n_nd_bgp_frigate_desc: "Frégates de patrouille rapides conçues pour la protection du commerce méditerranéen, capables d'intercepter les pirates et de faire respecter les intérêts maritimes provençaux le long des côtes."
 nd_bgp_cort_damor: "Cort d'Amor"
 nd_bgp_cort_damor_desc: "Une cour d'amour où les troubadours interprètent leurs cansos et leurs tensons, où les nobles dames tranchent les questions de dévotion courtoise et où la culture littéraire raffinée du monde occitan s'épanouit sous le patronage aristocratique."
 nd_bgp_cort_damor_patronage: "Patronage des Troubadours"
 nd_bgp_cort_damor_patronage_desc: "Entretien des activités littéraires de la cour : parchemin pour la poésie, bougies pour les représentations du soir, vin pour les festivités de la cour, draps fins pour les vêtements nobles et cadeaux pour les troubadours en visite."
 nd_bgp_col_toll_house: "Col Toll Maison"
 nd_bgp_col_toll_house_desc: "Un poste de douane fortifié près d'un col alpin, où chaque caravane marchande, train de pèlerins et colonne militaire doit s'arrêter et payer le péage avant de poursuivre son voyage à travers les montagnes."
 nd_bgp_toll_collection: "Perception des péages"
 nd_bgp_toll_collection_desc: "Coûts administratifs de fonctionnement du poste de douane : registres, sceaux, échantillons de tissus et de sel prélevés en nature, et petite bureaucratie qui enregistre chaque passage et collecte chaque ducat."
 nd_bgp_vignoble: "Vignoble"
 nd_bgp_vignoble_desc: "Domaine viticole en terrasses dans la vallée du Rhône ensoleillée, produisant des vins à partir de raisins cultivés sur des coteaux qui connaissent la vigne depuis l'époque romaine."
 nd_bgp_rhone_winemaking: "Vinification du Rhône"
 nd_bgp_rhone_winemaking_desc: "Des méthodes de vinification traditionnelles perfectionnées au fil des siècles dans la vallée du Rhône : vendanges, pressurages et élevage des vins en fûts de chêne pour produire des rouges charpentés et des rosés parfumés qui font la renommée de la région."
 nd_bgp_papal_vintages: "Millésimes papaux"
 nd_bgp_papal_vintages_desc: "Des techniques de vinification haut de gamme développées sous le patronage papal, utilisant des cépages soigneusement sélectionnés et des méthodes de production raffinées pour créer des vins dignes de la table du pontife."
 nd_bgp_palais_des_papes: "Palais des Papes"
 nd_bgp_palais_des_papes_desc: "Le plus grand palais gothique d'Europe, construit pour les papes d'Avignon. Ses chambres imposantes, ses chapelles ornées de fresques et sa vaste bibliothèque incarnent les ambitions culturelles de la papauté médiévale et continuent d'inspirer les efforts ecclésiastiques et universitaires."
 nd_bgp_papal_palace_maintenance: "Entretien du palais papal"
 nd_bgp_papal_palace_maintenance_desc: "Entretien du vaste complexe du palais, réparations de la pierre, illumination de ses nombreuses chambres, vin pour les cérémonies ecclésiastiques et soutien aux scribes et aux érudits qui travaillent dans ses murs."
 nd_bgp_saline: "Saline"
 nd_bgp_saline_desc: "Une usine d'extraction de sel, des galeries souterraines canalisant la saumure naturelle vers la surface, où elle est évaporée dans de grands chaudrons au feu de bois. L'or blanc de Franche-Comté nourrit l'Est de la France depuis un millénaire."
 nd_bgp_salt_extraction: "Extraction du sel"
 nd_bgp_salt_extraction_desc: "L'extraction systématique du sel de la saumure souterraine, en aspirant l'eau salée à travers des puits profonds, puis en l'évaporant sur des feux de bois et de charbon pour produire du sel cristallin destiné au commerce."
 nd_bgp_chancery: "Chancellerie"
 nd_bgp_chancery_desc: "Le cœur administratif de la gouvernance savoyarde : une chancellerie professionnelle où des notaires formés rédigent les lois, tiennent les archives et gèrent la correspondance diplomatique du royaume."
 nd_bgp_chancery_upkeep: "Opérations de la chancellerie"
 nd_bgp_chancery_upkeep_desc: "Frais de fonctionnement de la chancellerie, papier pour les documents, cire pour les sceaux, tissu pour les uniformes officiels, livres de droit et précédents, et bougies pour les longues heures de travail administratif."
 nd_bgp_bastille_savoyarde: "Bastille Savoyarde"
 nd_bgp_bastille_savoyarde_desc: "Une formidable forteresse de montagne construite pour dominer une vallée ou un col alpin, ses épais murs de pierre et sa position dominante la rendant pratiquement imperméable aux assauts à une époque antérieure à l'artillerie lourde."
 nd_bgp_fortress_garrison: "Garnison de montagne"
 nd_bgp_fortress_garrison_desc: "La garnison permanente d'une forteresse de montagne, des hommes armés entretenant les murs, les armes, les armes à feu et les outils nécessaires pour résister à un siège prolongé sur un terrain alpin hostile."
 nd_bgp_silk_workshop: "Atelier de la Soie"
 nd_bgp_silk_workshop_desc: "Un atelier de tissage de la soie en étoffe fine, s'appuyant sur des techniques introduites d'Italie et de la soie grège importée d'Orient. Le début de ce qui allait devenir l’une des grandes industries textiles d’Europe."
 nd_bgp_silk_weaving: "Tissage de la soie"
 nd_bgp_silk_weaving_desc: "L'art de tisser du fil de soie brute pour en faire du tissu fin, en utilisant des métiers à tisser de plus en plus sophistiqués pour produire des tissus qui rivalisent avec les meilleurs ateliers italiens."
 nd_bgp_provencal_arsenal: "Arsenal provençal"
 nd_bgp_provencal_arsenal_desc: "Un arsenal naval méditerranéen, un chantier naval, des magasins de bois, des chemins de cordage et des cales sèches pour la construction et la réparation des navires de guerre qui défendent le commerce maritime provençal."
 nd_bgp_arsenal_maintenance: "Opérations d'Arsenal"
 nd_bgp_arsenal_maintenance_desc: "Entretenir l'arsenal naval, le bois pour les coques, les provisions navales et le goudron pour le gréement et le calfeutrage, ainsi que les outils pour les charpentiers et artisans qui maintiennent la flotte prête à prendre la mer."
 nd_bgp_grand_domaine: "Grand Domaine"
 nd_bgp_grand_domaine_desc: "Un domaine viticole moderne utilisant des méthodes proto-industrielles, une culture systématique, une fermentation contrôlée et des réseaux d'exportation organisés qui transforment la viticulture traditionnelle en une entreprise commerciale."
 nd_bgp_estate_winemaking: "Vinification du Domaine"
 nd_bgp_estate_winemaking_desc: "Vinification commerciale à grande échelle sur un domaine moderne, employant des techniques agricoles améliorées et une main-d'œuvre organisée pour produire du vin destiné aux marchés nationaux et internationaux."
 levy_nd_bgp_chasseurs_alpins: "Chasseurs Alpins Levy"
 levy_nd_bgp_chasseurs_alpins_desc: "Infanterie de montagne recrutée parmi les populations rustiques des vallées alpines."
 levy_nd_bgp_montagnard_cavalry: "Prélèvement de cavalerie montagnarde"
 levy_nd_bgp_montagnard_cavalry_desc: "Cavalerie légère levée auprès de la noblesse montagnarde savoyarde."
 nd_bgp_formed_tt: "La Bourgogne-Provence est constituée"
 nd_bgp_path_a_tt: "Choisissez Le Couloir Du Rhône"
 nd_bgp_path_b_tt: "Choisissez Alpine Gatekeepers"
 nd_bgp_dest_marseille_developed_tt: "We own #bold Marseille#! and its development is at least #bold 45#!"
 nd_bgp_dest_piedmont_share_tt: "We hold at least 50% of the locations in Piedmont"
 nd_bgp_destiny: "Le royaume d'Arles renaît"
 nd_bgp_destiny_desc: "L'ancien royaume de Bourgogne revit. Une fois la stabilité assurée, le nouveau royaume doit choisir sa voie : embrasser le monde méditerranéen ou maîtriser les cols alpins."
 nd_bgp_dest_rhone_commerce: "Rhône Commerce"
 nd_bgp_dest_rhone_commerce_desc: "Prolonger le rayonnement commercial de l'axe rhodanien vers l'ouest jusqu'à Montpellier, sécuriser le littoral languedocien et imposer la soie comme un incontournable du commerce de notre capitale. Nécessite 1 000 pièces d'or dans le trésor."
 nd_bgp_dest_mare_nostrum: "Mare Nostrum"
 nd_bgp_dest_mare_nostrum_desc: "Seize Genoa, the jewel of Mediterranean trade, and integrate its mercantile networks into our growing commercial empire. Marseille, the old Phocaean harbour of our own coast, is built up beside it until the two ports answer each other across the Ligurian Sea. Requires Marseille at 45 development and prestige of 50."
 nd_bgp_dest_rhone_apex: "Le Grand Magasin"
 nd_bgp_dest_rhone_apex_desc: "Amenez Barcelone sous notre bannière, complétant ainsi notre domination sur les ports les plus riches de la Méditerranée occidentale. Amassez 3 000 pièces d’or, atteignez un prestige de 75 et adoptez l’institution du commerce mondial."
 nd_bgp_dest_alpine_mastery: "Maîtrise alpine"
 nd_bgp_dest_alpine_mastery_desc: "Extend our control over the Swiss cantons by taking Zurich, the key to central Switzerland. Maintain an army of at least 30 thousand men and stability of 75."
 nd_bgp_dest_piedmont_control: "Contrôle du Piémont"
 nd_bgp_dest_piedmont_control_desc: "Cross the Alps and seize Turin, the gateway to the Italian peninsula. Build an army of 50 thousand men and hold at least half of Piedmont, so that the plain below the passes is ours and not only its capital."
 nd_bgp_dest_alpine_hegemony: "Hégémonie alpine"
 nd_bgp_dest_alpine_hegemony_desc: "Take Milan, the richest city of northern Italy, completing our domination of both sides of the Alps. Field 75 thousand men, achieve prestige of 75, and embrace the Artillery institution."
 nd_bgp.5.t: "Le Royaume restauré"
 nd_bgp.5.d: "La couronne du royaume d'Arles repose à nouveau sur notre front. Ce qui a été divisé par des siècles de division est désormais réuni : des sommets alpins aux rives de la Méditerranée, le royaume revit. L’Histoire attend de voir ce que nous ferons de cet héritage."
 nd_bgp.5.a: "Le royaume perdure."
 nd_bgp.6.t: "Le Rhône coule vers le sud"
 nd_bgp.6.d: "Nos marchands et nos galères sillonnent désormais une route qui s'étend de Lyon à Montpellier et au-delà. Le couloir du Rhône est en train de devenir ce que la nature a toujours voulu qu'il soit : une autoroute commerciale reliant le cœur de l'Europe à la Méditerranée. La soie de l'Est arrive sur nos marchés ; le vin de nos vignes s'écoule vers tous les ports. Les revenus transforment déjà notre royaume."
 nd_bgp.6.a: "Laissez le commerce couler."
 nd_bgp.7.t: "Gênes sous notre bannière"
 nd_bgp.7.d: "The Superb Republic (La Superba) is ours. Genoa's banking houses, its fleets, its far-flung trading posts from the Black Sea to the Atlantic now serve our crown. The Genoese merchant princes, pragmatic as ever, are already adapting to our rule. The question is how best to exploit this windfall.\n\nWe could integrate Genoa's trade networks into a unified Levantine commerce system, channeling eastern goods through our ports. Alternatively, we could build upon Genoa's naval traditions to establish our own thalassocracy: a maritime power that commands respect on every sea."
 nd_bgp.7.a: "Intégrer les réseaux commerciaux génois."
 nd_bgp.7.b: "Construisez une puissance navale pour rivaliser avec n’importe quelle puissance maritime."
 nd_bgp.8.t: "Le Grand Emporium de l'Ouest"
 nd_bgp.8.d: "Barcelona, Genoa, Marseille, Montpellier, the greatest ports of the western Mediterranean, fly our banner. Our kingdom has become what the Romans once dreamed of: a single commercial civilization stretching along the entire northern Mediterranean coast. Goods flow from three continents through our harbors.\n\nThis unprecedented commercial power can be directed toward building: investing in infrastructure, reducing costs, and creating a prosperous realm. Or it can fuel a cultural renaissance that would make the troubadours weep with joy: a flowering of arts, diplomacy, and influence that cements our place among the great powers of Europe."
 nd_bgp.8.a: "Construisez le plus grand royaume commercial de la chrétienté."
 nd_bgp.8.b: "Que nos cours rivalisent avec Florence et Rome."
 nd_bgp.9.t: "Maître des passes"
 nd_bgp.9.d: "Zurich est tombée entre nos mains. Les cantons suisses se tournent désormais vers notre couronne plutôt que vers leur confédération conflictuelle. Avec cette conquête, nous contrôlons toute l'étendue de la barrière alpine : chaque col majeur, du Simplon au Saint-Gothard, répond à nos collecteurs de péages et à nos garnisons. Aucune armée ne traverse les montagnes à notre insu ; aucun marchand ne passe sans payer notre dû."
 nd_bgp.9.a: "Les Alpes sont notre forteresse et notre trésor."
 nd_bgp.10.t: "La descente en Italie"
 nd_bgp.10.d: "Turin is ours. The Savoyard dream of ruling both slopes of the Alps has been realized: we command the passes from above and the Piedmontese plain below. The rich cities of northern Italy lie open before us, their wealth a temptation to any ambitious prince.\n\nOur garrison commanders advocate for a system of iron discipline: fortified positions, rapid reinforcement, and an army that recovers from setbacks faster than any rival. Others counsel a different approach: using our strategic position to extract concessions through diplomacy backed by the threat of force, making every peace treaty and every casus belli serve our expansion."
 nd_bgp.10.a: "La discipline et le renforcement rapide sont nos points forts."
 nd_bgp.10.b: "La position stratégique est notre meilleure arme."
 nd_bgp.11.t: "L'Empire alpin"
 nd_bgp.11.d: "Milan (the beating heart of Lombardy, the richest city north of Rome) bows to our crown. We have achieved what no power since Charlemagne has managed: a single realm commanding both the Alpine barrier and the Lombard plain, straddling the great divide between northern and southern Europe.\n\nThis hegemony can take the form of military supremacy: an aggressive posture that exploits our strategic position to annex territory and project force across the continent. Alternatively, we can consolidate our mountain kingdom into an impregnable and self-sufficient realm, integrating conquered peoples and building logistical networks that make our armies tireless."
 nd_bgp.11.a: "Nous sommes des conquérants : que l’Italie tremble."
 nd_bgp.11.b: "Consolidez notre royaume de montagne en forteresse."
 STATIC_MODIFIER_NAME_nd_bgp_dest_levant_routes: "Routes du Levant"
 STATIC_MODIFIER_DESC_nd_bgp_dest_levant_routes: "L'intégration des réseaux commerciaux génois achemine les marchandises orientales via les ports provençaux, enrichissant notre royaume de matières premières provenant d'outre-Méditerranée."
 STATIC_MODIFIER_NAME_nd_bgp_dest_provencal_thalassocracy: "Thalassocratie provençale"
 STATIC_MODIFIER_DESC_nd_bgp_dest_provencal_thalassocracy: "Nos forces navales dominent la Méditerranée occidentale, sécurisant les routes commerciales et projetant leur puissance de la Catalogne jusqu’à la côte ligure."
 STATIC_MODIFIER_NAME_nd_bgp_dest_grand_emporium: "Grand magasin"
 STATIC_MODIFIER_DESC_nd_bgp_dest_grand_emporium: "Le royaume est devenu le plus grand centre commercial de la Méditerranée occidentale : un vaste espace commercial où l’argent circule librement et où les coûts de construction sont minimes."
 STATIC_MODIFIER_NAME_nd_bgp_dest_troubadour_renaissance: "Renaissance des Troubadours"
 STATIC_MODIFIER_DESC_nd_bgp_dest_troubadour_renaissance: "Un épanouissement culturel digne de la tradition des troubadours : nos cours attirent des artistes, des diplomates et des érudits, et notre influence culturelle rayonne à travers l'Europe."
 STATIC_MODIFIER_NAME_nd_bgp_dest_iron_garrison: "Garnison de Fer"
 STATIC_MODIFIER_DESC_nd_bgp_dest_iron_garrison: "Nos garnisons de montagne sont des modèles de discipline militaire : un renforcement rapide et un moral élevé rendent nos positions défensives pratiquement incassables."
 STATIC_MODIFIER_NAME_nd_bgp_dest_toll_imperium: "Impérial à péage"
 STATIC_MODIFIER_DESC_nd_bgp_dest_toll_imperium: "Notre position stratégique à cheval sur les cols alpins nous confère un levier diplomatique inégalé, tournant chaque négociation et chaque casus belli à notre avantage."
 STATIC_MODIFIER_NAME_nd_bgp_dest_alpine_imperator: "Imperateur alpin"
 STATIC_MODIFIER_DESC_nd_bgp_dest_alpine_imperator: "Une posture militaire agressive exploitant notre position alpine : nos armées conquièrent rapidement, annexent à moindre coût et extraient un tribut des vaincus."
 STATIC_MODIFIER_NAME_nd_bgp_dest_mountain_kingdom: "Royaume des Montagnes"
 STATIC_MODIFIER_DESC_nd_bgp_dest_mountain_kingdom: "Un royaume montagneux imprenable où les peuples conquis sont rapidement intégrés, les lignes d'approvisionnement fonctionnent efficacement et le rude environnement alpin renforce plutôt qu'affaiblit nos forces."
 nd_bgp_maison_de_commerce: "Maison de Commerce"
 nd_bgp_maison_de_commerce_desc: "Une grande maison de commerce méditerranéenne - un entrepôt, une bourse et un comptoir qui sert de centre névralgique de notre empire commercial, acheminant les marchandises et l'or de l'autre côté de la mer."
 nd_bgp_trading_house_maintenance: "Opérations des maisons de commerce"
 nd_bgp_trading_house_maintenance_desc: "Coûts de fonctionnement de la grande maison de commerce : papier pour les contrats et les registres, tissu pour les échantillons, sel comme étalon commercial et verre pour les fenêtres et les vitrines."
 nd_bgp_alpine_citadel: "Citadelle alpine"
 nd_bgp_alpine_citadel_desc: "Un complexe de forteresses de montagne imprenable dominant une vallée alpine stratégique : plusieurs anneaux défensifs, de profonds magasins et des fortifications conçues pour résister à l'artillerie la plus lourde. Le couronnement du génie militaire bourguignon-provençal."
 nd_bgp_citadel_garrison: "Garnison de la Citadelle"
 nd_bgp_citadel_garrison_desc: "La garnison d'élite d'une citadelle alpine : des défenseurs lourdement armés qui entretiennent des armes, des murs et des fournitures pour des sièges prolongés sur un terrain montagneux hostile."

 # ===== BUREAUCRACIES =====
 bgp_golden_fleece_bureaucracy: "Ordre de la Toison d'Or"
 bgp_golden_fleece_bureaucracy_desc: "Fondé par Philippe le Bon à Bruges le 10 janvier 1430 pour célébrer son mariage avec Isabelle de Portugal, avec le siège permanent fixé à Dijon en 1432. Les vingt-quatre (plus tard trente, puis cinquante) chevaliers de l'Ordre jurent fidélité personnelle au duc et arbitrent leurs différends uniquement au chapitre ; ses fêtes annuelles de la Saint-André réunissent la haute noblesse de chaque terre bourguignonne en un seul corps chevaleresque. Bien qu'il soit maintenu, il s'agit de l'ordre chevaleresque le plus prestigieux de la chrétienté ; bien que négligées, ses prétentions coûtent plus en subventions bourgeoises qu'elles n'en rapportent en loyauté noble."
 bgp_chambre_des_comptes_bureaucracy: "Chambre des Comptes de Dijon"
 bgp_chambre_des_comptes_bureaucracy_desc: "La chambre ducale des comptes, formalisée par l'ordonnance de Philippe le Téméraire du 11 juillet 1386 et installée à côté du palais à partir de 1460. Les commissaires aux comptes - la gens des comptes - enregistrent chaque lettre de donation, chaque provision de charge et chaque aliénation du domaine avant qu'elle puisse prendre effet ; leur personnel professionnel forme une classe de service bourgeois instruit fonctionnant sur registres et à double entrée. Survit à tous les changements de régime de 1386 à 1791. Disponible partout où se tient Dijon."
 bgp_estates_of_burgundy_bureaucracy: "Domaines de Bourgogne"
 bgp_estates_of_burgundy_bureaucracy_desc: "Les domaines provinciaux - clergé, noblesse et Bonnes Villes agréées - se réunissent en session régulière depuis l'hommage de 1361 et consentent à l'imposition comme le don gratuit. Leurs commissions de vote, les Elus généraux, administrent ce qu'ils accordent. Les assemblées bourguignonne, comtoise, provençale et dauphinoise conservent chacune leur propre constitution. Le royaume fonctionne comme un pays d'états, prospère et loyal tant que son consentement est demandé ; mutin et séparatiste alors qu’il ne l’est pas."
 bgp_vigueries_provence_bureaucracy: "Vigueries de Provence"
 bgp_vigueries_provence_bureaucracy_desc: "Héritées de la justice locale carolingienne et consolidées par Charles Ier d'Anjou après 1246, les vigueries provençales délèguent la juridiction civile et pénale à un viguier tournant annuellement, un juge-assesseur et un clavaire-trésorier dans chaque ville à charte. Le système constitue l'empreinte comitale de tous les bourgs, d'Aix à Hyères, en contournant les châteaux seigneuriaux. Codifiée par les enquêtes de 1252, 1298 et 1333, elle survit intacte dans l'appareil royal français après 1481."
 bgp_apostolic_camera_bureaucracy: "Apostolic Camera of Avignon"
 bgp_apostolic_camera_bureaucracy_desc: "L'appareil financier papal réorganisé par Jean XXII après 1316, avec plus de 650 fonctionnaires salariés s'occupant des annates, des servitia et des procurations des légats d'une ville de greffiers. Les archives du Palais des Papes, l'appareil d'appel de la Rota et les partenariats avec les banques Bardi, Peruzzi et Spini persistent longtemps après le retour de la curie à Rome en 1377. Quel que soit le royaume qui détient Avignon, hérite de la bureaucratie ecclésiale la plus centralisée de la chrétienté."
 bgp_lyon_fairs_bureaucracy: "Salons de Lyon"
 bgp_lyon_fairs_bureaucracy_desc: "Les lettres de Louis XI d'août 1463 fixent les quatre foires annuelles de Lyon (Epiphanie, Pâques, Foire d'août, Toussaint) comme franchise commerciale privilégiée du royaume, détournant délibérément les échanges de Genève. La Conservation des Foires (une commission judiciaire royale dotée d'une procédure d'appel abrégée) protège les commerçants, fait respecter les lettres de change au-delà des frontières et fait de la Foire d'août le centre de compensation des rentes et des emprunts de guerre. Dans les années 1530, les banques Capponi, Strozzi et Gondi font de Lyon une charnière du système de paiement européen."
 bgp_grande_saunerie_bureaucracy: "Grande Saunerie de Salins"
 bgp_grande_saunerie_bureaucracy_desc: "Le monopole du sel des saumures jurassiques de Salins-les-Bains, sous contrôle comital depuis que Jean de Chalon-Arlay acquiert la baronnie en 1237. Charles le Téméraire consolide les 419 parts de la Petite Saline entre 1463 et 1477; les Habsbourg finalisèrent le rachat en 1571. Vers 1590, la saunerie génère 60 pour cent des revenus du domaine du comté de Bourgogne. Ses gabelles, ses salles fortifiées et son corps d'inspection permanent constituent un appareil d'État en miniature : le droit régalien le plus lucratif du royaume."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_bgp_bureaucracy_authority: "Autorité bureaucratique"
 AUTO_MODIFIER_DESC_nd_bgp_bureaucracy_authority: "The restored Kingdom of Arles keeps the offices of the lands it gathered: the Arelat, the Valois Burgundian state, the county of Burgundy and Provence. Four of its seven institutions can be kept at once."
