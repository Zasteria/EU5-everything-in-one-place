l_french:

 # Formation Event
 nd_slo.1.t: "La naissance de la Slovaquie"
 nd_slo.1.d: "From the mist-shrouded peaks of the Carpathians to the gold-rich valleys of the Ore Mountains, a new nation stirs. For centuries, the Slovak people have been the miners, shepherds, and soldiers of Upper Hungary: their silver funded empires, their fortresses held the mountain passes, their towns grew wealthy on copper and coin. Now, as Slovakia stands on its own, a choice presents itself: shall we build upon the wealth beneath our mountains, or upon the strength of the passes that guard them?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_slo.1.a: "Nous sommes la couronne minière des Carpates"
 nd_slo.1.b: "Nous sommes le bastion frontière de la chrétienté"

 # Formation Timed Modifiers
 STATIC_MODIFIER_NAME_nd_slo_mining_crown: "Couronne minière des Carpates"
 STATIC_MODIFIER_DESC_nd_slo_mining_crown: "Les richesses minérales de la Slovaquie (argent de Banska Stiavnica, or de Kremnica, cuivre de Banska Bystrica) constituent le fondement d'une nouvelle prospérité nationale. L’innovation technique dans les mines stimule le progrès institutionnel."
 STATIC_MODIFIER_NAME_nd_slo_frontier_bastion: "Bastion frontière de la chrétienté"
 STATIC_MODIFIER_DESC_nd_slo_frontier_bastion: "Gardant les cols des Carpates contre les envahisseurs ottomans et des steppes, la tradition des forteresses slovaques et les milices de montagne forment le bouclier de l'Europe centrale. Chaque vallée est un piège mortel pour les envahisseurs."

 # Advance DHE Event: Thurzo-Fugger Partnership
 nd_slo.2.t: "Le partenariat Thurzo-Fugger"
 nd_slo.2.d: "Le partenariat entre le noble slovaque Jan Thurzo et le marchand d'Augsbourg Jakob Fugger a donné naissance à la plus grande entreprise de cuivre d'Europe. Leurs mines de Banska Bystrica produisent près de la moitié du cuivre mondial, leurs fonderies fonctionnent jour et nuit et leurs réseaux commerciaux s'étendent de Venise au Levant. Comment profiterons-nous de cette richesse extraordinaire ?"
 nd_slo.2.a: "Accordez-leur des droits miniers exclusifs"
 nd_slo.2.b: "Affrétez les guildes minières de manière indépendante"

 # Thurzo-Fugger Event Modifiers
 STATIC_MODIFIER_NAME_nd_slo_thurzo_fugger_monopoly: "Monopole Thurzo-Fugger"
 STATIC_MODIFIER_DESC_nd_slo_thurzo_fugger_monopoly: "L'entreprise Thurzo-Fugger détient les droits exclusifs sur le cuivre et l'argent slovaques. Leur capital et leur expertise propulsent la production à des niveaux sans précédent."
 STATIC_MODIFIER_NAME_nd_slo_mining_guilds_charter: "Charte des guildes minières"
 STATIC_MODIFIER_DESC_nd_slo_mining_guilds_charter: "Les guildes minières indépendantes s'affrontent librement dans les monts Métallifères slovaques, construisant des infrastructures et recrutant des mineurs qualifiés dans toute l'Europe centrale."

 # Advance DHE Event: Pressburg Coronation City
 nd_slo.3.t: "Ville du couronnement de Pressbourg"
 nd_slo.3.d: "Avec la chute de Buda aux mains des Ottomans, Pressbourg (connue des Slovaques sous le nom de Bratislava) est devenue la ville du couronnement des rois hongrois. La cathédrale Saint-Martin est désormais le théâtre du couronnement des monarques, la Diète se réunit dans nos murs et l'archevêque y siège. Pressbourg est devenue de facto la capitale d'un royaume. Comment tirer parti de cette élévation extraordinaire ?"
 nd_slo.3.a: "Que les couronnements rehaussent notre prestige"
 nd_slo.3.b: "Développer Pressbourg en tant que pôle commercial"

 # Pressburg Event Modifiers
 STATIC_MODIFIER_NAME_nd_slo_coronation_prestige: "Coronation City Prestige"
 STATIC_MODIFIER_DESC_nd_slo_coronation_prestige: "En tant que siège des couronnements royaux et de la Diète hongroise, Pressbourg impose le respect des tribunaux européens et renforce la position diplomatique de la Slovaquie."
 STATIC_MODIFIER_NAME_nd_slo_pressburg_commerce: "Commerce de Pressbourg"
 STATIC_MODIFIER_DESC_nd_slo_pressburg_commerce: "La position de Pressbourg sur le Danube, combinée à son nouveau statut de capitale politique, en fait un centre naturel de commerce entre Vienne, Buda et l'Est."

 # Advance DHE Event: Kuruc Uprising
 nd_slo.4.t: "Le soulèvement de Kuruc"
 nd_slo.4.d: "Les nobles dépossédés et les combattants protestants de Haute-Hongrie ont pris les armes sous le nom de Kuruci, des rebelles contre la domination des Habsbourg. Dirigés par des commandants charismatiques, ils mènent une guérilla dans les vallées des Carpates, incendiant et attaquant. Les terres slovaques sont déchirées entre ceux qui rejoignent la rébellion et ceux qui cherchent un compromis avec Vienne. Quelle voie sert nos intérêts ?"
 nd_slo.4.a: "Rejoignez la rébellion Kuruc !"
 nd_slo.4.b: "Cherchez un logement chez les Habsbourg"

 # Kuruc Event Modifiers
 STATIC_MODIFIER_NAME_nd_slo_kuruc_rebellion: "Esprit du Kuruci"
 STATIC_MODIFIER_DESC_nd_slo_kuruc_rebellion: "L'esprit combatif des rebelles Kuruc inspire les soldats slovaques. Leurs tactiques de guérilla dans les vallées des Carpates se révèlent d’une efficacité dévastatrice contre les armées conventionnelles."
 STATIC_MODIFIER_NAME_nd_slo_habsburg_accommodation: "Hébergement à Habsbourg"
 STATIC_MODIFIER_DESC_nd_slo_habsburg_accommodation: "En recherchant des conditions pragmatiques avec Vienne, la Slovaquie garantit la tolérance religieuse et les privilèges administratifs qui garantissent la stabilité et la position diplomatique."

 # Advance DHE Event: National Awakening
 nd_slo.5.t: "La voix d'une nation"
 nd_slo.5.d: "Ludovit Stur a accompli ce que des siècles de souffrances partagées n'ont pas pu accomplir : il a donné au peuple slovaque une langue commune. Réunis à Hlboke en 1843, Stur et ses compagnons Hodza et Hurban ont codifié le slovaque standard sur la base du dialecte slovaque central. Pour la première fois, les Slovaques de Bratislava à Kosice peuvent lire les mêmes journaux, chanter les mêmes chansons et rêver les mêmes rêves. La Matica Slovenska est prête à diffuser cette nouvelle langue dans tous les villages des Carpates."
 nd_slo.5.a: "Laissons notre langue nous unir"

 # National Awakening Modifier
 STATIC_MODIFIER_NAME_nd_slo_national_language: "La langue nationale slovaque"
 STATIC_MODIFIER_DESC_nd_slo_national_language: "La codification du slovaque standard par Ludovit Stur crée une identité culturelle commune, stimulant l'alphabétisation, la production culturelle et la fierté nationale sur l'ensemble du territoire slovaque."

 # Destiny Variable Tooltips
 nd_slo_formed_tt: "La Slovaquie a été formée"
 nd_slo_path_a_tt: "Choisissez la voie de la Couronne minière"
 nd_slo_path_b_tt: "Choisissez le chemin du Bastion Frontière"

 # === ADVANCES ===

 # Age 1: Traditions
 nd_slo_carpathian_defense: "Défense des Carpates"
 nd_slo_carpathian_defense_desc: "Les cols des Carpates constituent la forteresse naturelle de la Slovaquie. Les milices locales (les Horali) patrouillent le long des crêtes et des tours de guet parsèment les hauteurs, fournissant une alerte précoce contre les raids venant de n'importe quelle direction."
 nd_slo_mining_privilege: "Privilèges miniers royaux"
 nd_slo_mining_privilege_desc: "Les rois hongrois accordent de vastes privilèges miniers aux villes des monts Métallifères slovaques, attirant ainsi des colons allemands et établissant le cadre juridique pour les mines d'argent et de cuivre les plus productives d'Europe."
 nd_slo_valasi_herding: "Tradition pastorale valasi"
 nd_slo_valasi_herding_desc: "Les bergers valaques migrent vers les hautes terres des Carpates, apportant avec eux une économie pastorale distinctive centrée sur l'élevage de moutons, la fabrication du fromage bryndza et la transhumance saisonnière à travers les prairies de montagne."
 nd_slo_royal_charter_towns: "Villes à charte royale"
 nd_slo_royal_charter_towns_desc: "Les colonies minières comme Kremnica, Banska Stiavnica et Banska Bystrica reçoivent des chartes royales leur accordant le droit des villes allemandes, l'autonomie gouvernementale et des privilèges commerciaux qui stimulent le développement urbain."
 nd_slo_carpathian_faiths: "Mosaïque religieuse des Carpates"
 nd_slo_carpathian_faiths_desc: "Des communautés catholiques, orthodoxes et plus tard protestantes coexistent dans les régions frontalières des Carpates, où les exigences pratiques de la vie en montagne nourrissent une tradition de pragmatisme religieux."
 nd_slo_castle_building: "Tradition de construction de château"
 nd_slo_castle_building_desc: "Les grands châteaux de Spis, Orava et Trencin dominent le paysage slovaque : d'imposantes fortifications en pierre construites pour contrôler les cols de montagne et les traversées de rivières, formant un réseau défensif intégré."

 # Age 2: Renaissance
 nd_slo_valasi_riders: "Cavalerie de berger Valasi"
 nd_slo_valasi_riders_desc: "Les bergers à cheval des hautes terres des Carpates servent de cavalerie légère, leur connaissance approfondie du terrain montagneux les rendant inestimables en tant qu'éclaireurs et pillards dans les pays accidentés le long de la frontière."
 nd_slo_kremnica_tradition: "Tradition de la monnaie de Kremnica"
 nd_slo_kremnica_tradition_desc: "La Monnaie de Kremnica, fondée en 1328, produit les fameux ducats d'or qui circulent dans toute l'Europe. Ses normes de frappe précises et son expertise technique en font l'un des monnaies les plus respectées de la chrétienté."
 nd_slo_thurzo_fugger: "Entreprise Thurzo-Fugger"
 nd_slo_thurzo_fugger_desc: "Le partenariat entre Jan Thurzo et Jakob Fugger crée la plus grande entreprise productrice de cuivre au monde, traitant près de quarante pour cent de la production mondiale des mines autour de Banska Bystrica."
 nd_slo_highland_textiles: "Tradition textile des Highlands"
 nd_slo_highland_textiles_desc: "Vlach pastoral communities in the Carpathian highlands develop a tradition of wool processing, producing coarse cloth and felt from their mountain sheep flocks for trade in lowland markets.\n\n#italic Available in: $nd_slo_salas$#!"
 nd_slo_mining_technology: "Technologie minière"
 nd_slo_mining_technology_desc: "Les mineurs slovaques sont pionniers dans les systèmes de drainage des eaux, les puits de ventilation et les techniques de traitement du minerai qui poussent les mines plus profondément que jamais, maintenant ainsi la productivité même lorsque les gisements de surface sont épuisés."
 nd_slo_hungarian_levies: "Service militaire hongrois"
 nd_slo_hungarian_levies_desc: "Les soldats slovaques servent dans les armées royales hongroises, acquérant de l'expérience dans les guerres de frontière et développant une réputation d'infanterie fiable dans les campagnes contre l'expansion ottomane."

 # Age 3: Discovery
 nd_slo_banska_guard_tradition: "Garde municipale de Banska"
 nd_slo_banska_guard_tradition_desc: "Les riches villes minières des Monts Métallifères slovaques disposent de gardes professionnels formés aux tactiques de brochet et de tir, défendant leur argent et leur cuivre contre les bandits, les pillards et les incursions ottomanes."
 nd_slo_pressburg_coronation: "Ville du couronnement de Pressbourg"
 nd_slo_pressburg_coronation_desc: "Après la chute de Buda face aux Ottomans en 1541, Bratislava devient la ville du couronnement des rois hongrois. Depuis plus de deux siècles, onze monarques sont couronnés dans la cathédrale Saint-Martin."
 nd_slo_ottoman_frontier: "Défense de la frontière ottomane"
 nd_slo_ottoman_frontier_desc: "Southern Slovakia becomes a battleground as Ottoman forces push northward after Mohacs. Fortified towns and castle garrisons form a defensive line protecting the mining regions from Turkish raids."
 nd_slo_upper_hungary_refuge: "La Haute-Hongrie comme refuge"
 nd_slo_upper_hungary_refuge_desc: "As central Hungary falls under Ottoman occupation, refugees flood northward into Slovakia: nobles, burghers, scholars, and craftsmen who enrich the cultural and economic life of Upper Hungary.\n\n#italic Available in: $nd_slo_salas$#!"
 nd_slo_advanced_smelting: "Fusion avancée du minerai"
 nd_slo_advanced_smelting_desc: "New smelting techniques developed in the Slovak mining towns extract higher yields from copper and iron ore, producing tools and implements that are traded across Central Europe.\n\n#italic Available in: $nd_slo_banska_mines$#!"
 nd_slo_trnava_university: "Université de Trnava"
 nd_slo_trnava_university_desc: "Fondée par les jésuites en 1635, l'Université de Trnava devient la première institution d'enseignement supérieur de Haute-Hongrie, formant une génération de membres du clergé, d'avocats et d'administrateurs."

 # Age 4: Reformation
 nd_slo_kuruc_revolt: "Révolte de Kuruc"
 nd_slo_kuruc_revolt_desc: "The dispossessed Protestant nobles of Upper Hungary rise as Kuruci, waging guerrilla warfare through the Carpathian valleys. Their foot, the Talpasi, are raised among the Slovak and Rusyn villagers of the northern counties, and Slovak soldiers on both sides gain hard-won experience in mountain combat."
 nd_slo_reformation_towns: "Réforme dans les villes minières"
 nd_slo_reformation_towns_desc: "Les prédicateurs luthériens et calvinistes trouvent un terrain fertile dans les villes minières de Slovaquie, où les bourgeois lettrés allemands et slovaques embrassent la nouvelle foi, fondant des écoles et des imprimeries."
 nd_slo_carpathian_economy: "Commerce des Carpates"
 nd_slo_carpathian_economy_desc: "Slovakia's dual economy matures: highland shepherds produce bryndza and wool for market, while the mining towns mint ducats and trade copper ingots across Europe.\n\n#italic Available in: $nd_slo_salas$#!"
 nd_slo_counter_reformation: "Contre-Réforme"
 nd_slo_counter_reformation_desc: "Habsburg-sponsored Catholic revival brings Jesuit missions, new churches, and renewed religious authority to Slovakia. The restored faith commissions sacred jewelry and liturgical art from Kremnica's goldsmiths.\n\n#italic Available in: $nd_slo_kremnica_mint$#!"
 nd_slo_thokoly_kingdom: "Le royaume de Thokoly"
 nd_slo_thokoly_kingdom_desc: "Le bref Royaume de Haute-Hongrie d'Imre Thokoly démontre que le territoire slovaque peut servir de base de pouvoir indépendante de Vienne et de Constantinople, inspirant les générations futures."
 nd_slo_arms_manufacture: "Fabrication d'armes"
 nd_slo_arms_manufacture_desc: "The iron forges and copper smelters of the Slovak mining districts begin producing weapons and armor, supplying the frontier garrisons fighting on the Ottoman border.\n\n#italic Available in: $nd_slo_banska_mines$#!"

 # Age 5: Absolutism
 nd_slo_stiavnica_academy: "Académie des Mines de Banska Stiavnica"
 nd_slo_stiavnica_academy_desc: "Fondée en 1735 et élevée au rang d'académie royale sous Marie-Thérèse, l'Académie des Mines de Banska Stiavnica devient le premier établissement d'enseignement supérieur technique au monde, formant des ingénieurs et des minéralogistes."
 nd_slo_professional_regiments: "Régiments professionnels"
 nd_slo_professional_regiments_desc: "Dans le cadre des réformes militaires des Habsbourg, les districts slovaques lèvent des régiments d'infanterie professionnels (les Toborsek) entraînés à la tactique linéaire et équipés d'armes à feu modernes."
 nd_slo_theresian_reforms: "Réformes thérésiennes"
 nd_slo_theresian_reforms_desc: "Maria Theresa's administrative reforms bring centralized governance, standardized taxation, and systematic mineral surveys to Upper Hungary. Her consort Francis of Lorraine turns his estate at Holic into a model of the new economy: the majolica works he founds there in 1743 is the first in the kingdom."
 nd_slo_iron_industry: "Industrie du fer"
 nd_slo_iron_industry_desc: "The ironworks of the Slovak mining districts expand from raw smelting to steel production, supplying the growing Habsburg military and industrial demand.\n\n#italic Available in: $nd_slo_banska_mines$#!"
 nd_slo_technical_education: "Enseignement technique"
 nd_slo_technical_education_desc: "The mining school teaches mathematics, mechanics, hydraulics and surveying, and its masters put the lessons to work in the hills. Samuel Mikoviny, its first professor, lays out the tajchy: reservoirs whose water drives the pumps that keep the deep shafts dry."
 nd_slo_industrial_foundations: "Fondations industrielles"
 nd_slo_industrial_foundations_desc: "La transformation du bois, les forges et la fabrication du verre se développent dans les vallées slovaques, jetant les bases d'un développement industriel au-delà de l'exploitation minière traditionnelle."

 # Age 6: Revolutions
 nd_slo_national_awakening: "Réveil national slovaque"
 nd_slo_national_awakening_desc: "La codification du slovaque standard par Ludovit Stur en 1843 déclenche un mouvement culturel national. Les journaux, la littérature et l'enseignement en langue slovaque forgent une identité commune de Bratislava à Kosice."
 nd_slo_matica_slovenska: "Matica Slovenska"
 nd_slo_matica_slovenska_desc: "La Matica Slovenska, fondée en 1863, devient le cœur institutionnel de la vie culturelle slovaque, promouvant la littérature, l'éducation et la langue standard dans la région des Carpates."
 nd_slo_volunteer_corps: "Corps des volontaires slovaques"
 nd_slo_volunteer_corps_desc: "Au cours de l'année révolutionnaire de 1848, les volontaires slovaques dirigés par Stur, Hodza et Hurban prennent les armes pour les droits nationaux, luttant pour la reconnaissance contre les forces révolutionnaires hongroises."
 nd_slo_emancipation: "Émancipation paysanne"
 nd_slo_emancipation_desc: "L'abolition du servage libère la paysannerie slovaque, favorisant la croissance démographique et la mobilité économique alors que les anciens serfs entrent dans la main-d'œuvre urbaine et développent la production agricole."
 nd_slo_mining_industrialization: "Industrialisation minière"
 nd_slo_mining_industrialization_desc: "Les machines à vapeur, le transport ferroviaire et les techniques minières modernes transforment l'ancienne industrie minière slovaque, augmentant la production et reliant les monts Métallifères aux marchés européens."
 nd_slo_pan_slavic_congress: "Congrès panslave"
 nd_slo_pan_slavic_congress_desc: "Les délégués slovaques au Congrès panslave de 1848 nouent des liens avec les mouvements tchèques, polonais, serbes et autres mouvements slaves, construisant des réseaux diplomatiques qui renforcent la position de la Slovaquie."

 # === UNITS ===
 a_nd_slo_horali: "Horali"
 a_nd_slo_horali_desc: "Milice des montagnes des Carpates issue des villages des hautes terres. Des embusqués experts qui connaissent tous les cols, ravins et lignes de crête des montagnes slovaques."
 a_nd_slo_valasi: "Cavaliers Valasi"
 a_nd_slo_valasi_desc: "Bergers valaques à cheval des hautes terres des Carpates. Robuste, mobile et habitué à fonctionner de manière indépendante sur les terrains montagneux les plus difficiles."
 a_nd_slo_talpasi: "Talpasi"
 a_nd_slo_talpasi_desc: "The foot of the Kuruc risings, raised among the Slovak and Rusyn villagers of Upper Hungary. Quick to gather and to strike in the valleys, unsteady in a pitched battle."
 a_nd_slo_dobrovolnici: "Slovak Volunteers"
 a_nd_slo_dobrovolnici_desc: "Students, craftsmen and villagers who answered the call of Hurban, Stur and Hodza in 1848. Ardent, and armed with whatever was to hand."
 a_nd_slo_banska_guard: "Garde de Banska"
 a_nd_slo_banska_guard_desc: "Gardes municipaux professionnels des riches villes minières des monts Métallifères slovaques. Bien équipés et disciplinés, ils défendent l’argent et le cuivre qui financent le royaume."
 a_nd_slo_toborsek: "Toborsek"
 a_nd_slo_toborsek_desc: "Régiments d'infanterie professionnels issus des districts miniers slovaques dans le cadre des réformes militaires des Habsbourg. Formé à la guerre linéaire et équipé d'armes modernes."

 # === BUILDINGS ===
 nd_slo_banska_mines: "Travaux miniers de Banska"
 nd_slo_banska_mines_desc: "Infrastructure minière industrielle dans les monts Métallifères slovaques, exploitant de riches gisements d'argent, de cuivre et d'autres métaux à l'aide de techniques avancées de drainage et de fusion."
 nd_slo_kremnica_mint: "Menthe Kremnica"
 nd_slo_kremnica_mint_desc: "L'une des monnaies les plus respectées d'Europe, produisant les célèbres ducats de Kremnica et d'autres pièces de monnaie en or et en argent slovaques depuis 1328."
 nd_slo_salas: "Salas"
 nd_slo_salas_desc: "Un établissement de bergers valaques dans les hautes terres des Carpates, centré sur l'élevage saisonnier de moutons, la fabrication de fromage bryndza et la production de laine."
 nd_slo_carpathian_watchtower: "Tour de guet des Carpates"
 nd_slo_carpathian_watchtower_desc: "Un poste d'observation fortifié dominant un col des Carpates, fournissant une alerte précoce contre les raids et canalisant les envahisseurs vers des zones de destruction préparées."
 nd_slo_mining_academy: "Académie des Mines"
 nd_slo_mining_academy_desc: "Une institution technique calquée sur l'académie de Banska Stiavnica, formant des ingénieurs, des minéralogistes et des métallurgistes aux dernières sciences minières."
 nd_slo_tajch: "Tajch"
 nd_slo_tajch_desc: "A reservoir dammed in the hills above a mine. Its water turns the wheels that pump the shafts dry and work the stamp mills, so that the ore can be followed deeper."
 nd_slo_holic_majolica: "Holic Majolica Works"
 nd_slo_holic_majolica_desc: "A faience works on the model of the one Francis of Lorraine founded at Holic in 1743. Tin glazed tableware, painted by potters trained in the Haban tradition, is fired here for the tables of the court."

 # === PRODUCTION METHODS ===
 nd_slo_ore_smelting: "Fusion de minerai"
 nd_slo_ore_smelting_desc: "Le cuivre et le minerai de fer sont fondus en outils et en instruments à l'aide de techniques avancées de four slovaque."
 nd_slo_arms_forging: "Forgeage d'armes"
 nd_slo_arms_forging_desc: "Les fonderies de cuivre et les forges des régions minières produisent des armes et des armures pour les garnisons frontalières."
 nd_slo_steel_forging: "Forgeage de l'acier"
 nd_slo_steel_forging_desc: "La métallurgie avancée des districts miniers slovaques produit de l'acier de haute qualité à partir d'alliages de fer et de cuivre destiné à un usage industriel et militaire."
 nd_slo_mine_maintenance: "Opérations minières"
 nd_slo_mine_maintenance_desc: "Le bois pour les étais des mines, le fer pour les outils et la pierre pour les canaux de drainage soutiennent les puits miniers profonds."
 nd_slo_ducat_minting: "Frappe Ducat"
 nd_slo_ducat_minting_desc: "Gold from the Kremnica veins is smelted, refined and struck into the famous Kremnica ducats, prized across Europe for their consistent weight and purity."
 nd_slo_jewelry_craft: "Artisanat d'orfèvrerie"
 nd_slo_jewelry_craft_desc: "Les maîtres orfèvres de Kremnica façonnent le cuivre et l'argent pour en faire des bijoux, des récipients sacrés et des ornements liturgiques pour les églises et les cours nobles."
 nd_slo_mint_maintenance: "Opérations de la Monnaie"
 nd_slo_mint_maintenance_desc: "Les réserves d'or, les stocks d'argent et les matrices de fer soutiennent le fonctionnement continu du processus de frappe."
 nd_slo_bryndza_making: "Fabrication de Bryndza"
 nd_slo_bryndza_making_desc: "Le lait de brebis et le sel sont transformés en bryndza, un fromage distinctif des Carpates qui fait vivre les communautés des hautes terres et trouve des marchés dans les villes des basses terres."
 nd_slo_wool_processing: "Traitement de la laine"
 nd_slo_wool_processing_desc: "La laine de mouton des hautes terres est nettoyée, cardée et tissée en tissu grossier par les communautés pastorales valaques des colonies des Carpates."
 nd_slo_fur_tanning: "Tannage de la fourrure"
 nd_slo_fur_tanning_desc: "Sheepskins from the highland flocks are cured into fleece-lined furs by the shepherd communities, meeting the demand of refugees and settlers in Upper Hungary."
 nd_slo_salas_maintenance: "Entretien pastoral"
 nd_slo_salas_maintenance_desc: "Le bétail, le sel pour la conservation et la laine pour se réchauffer soutiennent le cycle saisonnier de la vie pastorale des Carpates."
 nd_slo_watchtower_maintenance: "Garnison de la Tour de Guet"
 nd_slo_watchtower_maintenance_desc: "Du bois, de la pierre et des armes équipent la petite garnison qui occupe ce poste d'observation de montagne."
 nd_slo_academy_maintenance: "Entretien de l'Académie"
 nd_slo_academy_maintenance_desc: "Les livres, le papier et les matériaux de construction soutiennent la bibliothèque, les laboratoires et les amphithéâtres de l'académie."
 nd_slo_tajch_maintenance: "Dam Upkeep"
 nd_slo_tajch_maintenance_desc: "Timber for the sluices, stone for the dam face and tools for the channel wardens."
 nd_slo_majolica_firing: "Majolica Firing"
 nd_slo_majolica_firing_desc: "Clay is thrown, coated in a white tin glaze, painted and fired with wood."

 # ===== DESTINY ADVANCES =====

 nd_slo_destiny: "Le carrefour des Carpates"
 nd_slo_destiny_desc: "La Slovaquie se situe au carrefour de l’Europe centrale. Riche en minéraux et gardée par des cols de montagne, cette jeune nation doit choisir sa voie : sera-t-elle connue pour la richesse qui se cache sous ses sommets, ou pour la solidité des murs qui les gardent ?"

 # Path A: Mining Crown
 nd_slo_dest_ore_mountains: "Maîtres des Monts Métallifères"
 nd_slo_dest_ore_mountains_desc: "Étendre le contrôle minier slovaque au-delà du territoire national jusqu’aux frontières silésiennes riches en minéraux. Le contrôle de Krnov et de Fryvaldov amène de nouveaux gisements d'argent et d'or sous notre administration."
 nd_slo_dest_silver_road: "La route d'argent"
 nd_slo_dest_silver_road_desc: "Le partenariat Thurzo-Fugger a montré comment les métaux slovaques pouvaient atteindre les marchés européens. Sécurisez la route commerciale vers Augsbourg et construisez les institutions financières nécessaires pour gérer un empire minier."
 nd_slo_dest_montanistica: "Académie montaniste"
 nd_slo_dest_montanistica_desc: "Transform Slovakia into Europe's center of mining science. Control the great trade cities of Nuremberg and Wroclaw, build up Kremnica, the town of the mint and of the chamber counts, and let the Bergamt administer a mineral empire."
 nd_slo_dest_kremnica_developed_tt: "We own #bold Kremnica#! and its development is at least #bold 30#!"

 # Path B: Frontier Bastion
 nd_slo_dest_pass_guard: "Gardiens des Passes"
 nd_slo_dest_pass_guard_desc: "Sécurisez les approches sud en prenant Eger et Miskolc. Ces villes fortifiées gardent la porte entre la plaine hongroise et les montagnes des Carpates ; aux mains des Slovaques, elles scellent la paroi montagneuse."
 nd_slo_dest_antemurale: "Christianitatis antemurale"
 nd_slo_dest_antemurale_desc: "La Slovaquie revendique l’ancien titre de rempart de la chrétienté. Prenez Buda elle-même et bâtissez une armée professionnelle digne de ce devoir sacré."
 nd_slo_dest_carpathian_wall: "Le mur des Carpates"
 nd_slo_dest_carpathian_wall_desc: "From Vienna to Belgrade, the Carpathian defensive line is complete. Slovakia commands the mountain fortress system that shields all of Central Europe, and Pressburg, the capital behind the wall, is built up as the seat of crown and diet."
 nd_slo_dest_pressburg_developed_tt: "We own #bold Pressburg#! and its development is at least #bold 52#!"

 # ===== DESTINY EVENTS =====

 # Root Event
 nd_slo.6.t: "Le carrefour des Carpates"
 nd_slo.6.d: "La formation de la Slovaquie a placé une nouvelle puissance au cœur de l'Europe centrale. Les montagnes des Carpates définissent notre nation : riches en argent et en cuivre sous leurs sommets, et infranchissables pour toute armée qui ne connaît pas leurs passages. Notre chemin à parcourir est marqué par les choix que nous avons faits lors de la fondation. Nous devons maintenant parcourir ce chemin jusqu’à son terme."
 nd_slo.6.a: "Notre destin nous attend dans les montagnes"

 # Path A Stage 1
 nd_slo.7.t: "Maîtres des Monts Métallifères"
 nd_slo.7.d: "Nos mineurs ont poussé au-delà de leur patrie, plaçant les régions frontalières riches en minéraux de la Silésie sous administration slovaque. Les anciennes traditions minières des Monts Métallifères (pompes à eau, puits de ventilation, fonderies avancées) servent désormais une plus grande entreprise. De Kremnica à Krnov, l’expertise minière slovaque constitue la référence en Europe centrale."
 nd_slo.7.a: "Les montagnes nous livrent leurs trésors"

 # Path A Stage 2
 nd_slo.8.t: "La route d'argent"
 nd_slo.8.d: "L'argent et le cuivre slovaques circulent le long des routes commerciales vers Augsbourg, le cœur financier de l'Europe. À l'ancien partenariat Thurzo-Fugger a succédé un réseau de relations commerciales qui s'étend sur tout le continent. Nos métaux financent les armées et construisent des cathédrales de Lisbonne à Constantinople. Comment organiser ce commerce extraordinaire ?"
 nd_slo.8.a: "Cultiver les réseaux marchands"
 nd_slo.8.b: "Établir un monopole sur la monnaie royale"

 # Path A Stage 3
 nd_slo.9.t: "Académie montaniste"
 nd_slo.9.d: "L'Académie des Mines de Banska Stiavnica est devenue la principale institution d'enseignement technique en Europe. Ses diplômés (ingénieurs, minéralogistes, métallurgistes) transportent la science minière slovaque aux quatre coins du continent. Le Bergamt, notre administration minière royale, coordonne un empire minier qui s'étend de Nuremberg à Wroclaw. C’est le sommet de la civilisation technique slovaque."
 nd_slo.9.a: "Laissons l’innovation transformer nos industries"
 nd_slo.9.b: "Laissons notre trésor déborder d'or"

 # Path B Stage 1
 nd_slo.10.t: "Gardiens des Passes"
 nd_slo.10.d: "Les villes fortifiées d’Eger et de Miskolc arborent désormais la bannière slovaque. Ces anciennes forteresses gardent la porte entre la plaine hongroise et les montagnes des Carpates. Avec leurs murs sous notre commandement, les approches sud de la Slovaquie sont fermées. Aucune armée ne peut marcher vers le nord par ces passages sans affronter nos garnisons."
 nd_slo.10.a: "Le mur de la montagne tient bon"

 # Path B Stage 2
 nd_slo.11.t: "Christianitatis antemurale"
 nd_slo.11.d: "Avec la prise de Buda, la Slovaquie s'est révélée être le bouclier de l'Europe centrale. Notre armée professionnelle, formée aux traditions de guerre en montagne des Carpates, a reconquis l'ancien siège des rois hongrois. Le titre d’Antemurale Christianitatis (Rempart de la chrétienté) nous appartient par droit d’armes. Comment consolider ce devoir sacré ?"
 nd_slo.11.a: "Former nos soldats à la guerre en montagne"
 nd_slo.11.b: "Fortifiez chaque position stratégique"

 # Path B Stage 3
 nd_slo.12.t: "Le mur des Carpates"
 nd_slo.12.d: "De Vienne à Belgrade, la ligne défensive des Carpates est complète. Les forteresses slovaques dominent chaque col de montagne, traversée de rivière et vallée stratégique. Notre réseau de garnisons constitue le système défensif le plus redoutable d'Europe : les armées qui entrent dans les Carpates n'en sortent pas. La Slovaquie est devenue le bouclier inébranlable au cœur du continent."
 nd_slo.12.a: "Personne ne franchira nos murs"
 nd_slo.12.b: "Nous combattons au nom de Dieu"

 # ===== DESTINY TIMED MODIFIERS =====

 STATIC_MODIFIER_NAME_nd_slo_dest_fugger_network: "Réseau commercial Fugger"
 STATIC_MODIFIER_DESC_nd_slo_dest_fugger_network: "Les métaux slovaques transitent par le réseau commercial Fugger vers les marchés de toute l’Europe. Les liens commerciaux noués par ce partenariat renforcent à la fois la richesse et la position diplomatique."
 STATIC_MODIFIER_NAME_nd_slo_dest_mint_monopoly: "Monopole de la Monnaie Royale"
 STATIC_MODIFIER_DESC_nd_slo_dest_mint_monopoly: "La couronne exerce un contrôle exclusif sur la monnaie slovaque et la production de métaux précieux. La monnaie royale circule selon des normes fixes, stabilisant la monnaie et renforçant l'autorité de la couronne."
 STATIC_MODIFIER_NAME_nd_slo_dest_mining_revolution: "Révolution minière"
 STATIC_MODIFIER_DESC_nd_slo_dest_mining_revolution: "La science minière slovaque a transformé l’industrie de l’extraction. Les pompes à vapeur, les relevés de précision et la métallurgie avancée font de nos mines les plus productives et innovantes d’Europe."
 STATIC_MODIFIER_NAME_nd_slo_dest_golden_treasury: "Trésor d'or"
 STATIC_MODIFIER_DESC_nd_slo_dest_golden_treasury: "Les richesses minérales accumulées dans les Carpates remplissent les coffres slovaques. Ce trésor en or finance la reconstruction, la diplomatie et la consolidation territoriale."
 STATIC_MODIFIER_NAME_nd_slo_dest_mountain_warfare: "Doctrine de guerre en montagne"
 STATIC_MODIFIER_DESC_nd_slo_dest_mountain_warfare: "Les soldats slovaques sont entraînés à l'art du combat en montagne : embuscades, raids de guérilla et utilisation du terrain pour annuler la supériorité numérique. Nos groupes de raid mettent à nu les lignes de ravitaillement ennemies, même si le maintien de ces garnisons de montagne dispersées met à rude épreuve la trésorerie."
 STATIC_MODIFIER_NAME_nd_slo_dest_garrison_network: "Réseau de garnison intégré"
 STATIC_MODIFIER_DESC_nd_slo_dest_garrison_network: "Un système coordonné de villes fortifiées, de chaînes de tours de guet et de forces de garnison maintient le contrôle de la frontière des Carpates. Chaque passage est surveillé, chaque vallée patrouillée, même si la concentration militaire sur l’intérieur ralentit l’intégration de nouveaux territoires."
 STATIC_MODIFIER_NAME_nd_slo_dest_unconquerable: "L'Invincible"
 STATIC_MODIFIER_DESC_nd_slo_dest_unconquerable: "Le réseau de forteresses de montagne de Slovaquie est légendaire. Aucune armée d'invasion n'a réussi à conquérir le mur des Carpates, et la réputation de force militaire slovaque impose le respect à la table des négociations, même si cette confiance martiale engendre la complaisance à la cour."
 STATIC_MODIFIER_NAME_nd_slo_dest_crusader_spirit: "Esprit croisé"
 STATIC_MODIFIER_DESC_nd_slo_dest_crusader_spirit: "La Slovaquie se bat avec la ferveur d'une cause sacrée. En tant que rempart de la chrétienté, chaque guerre est une croisade, chaque soldat un défenseur de la foi."

 # ===== DESTINY BUILDINGS =====

 nd_slo_dest_bergamt: "Bergame"
 nd_slo_dest_bergamt_desc: "L'Administration royale des mines : un bureau centralisé supervisant les études minières, les concessions minières, les normes d'analyse et l'enseignement technique dans tout l'empire minier slovaque."
 nd_slo_dest_krajina_fortress: "Forteresse de Krajina"
 nd_slo_dest_krajina_fortress_desc: "Une fortification frontalière majeure commandant une approche stratégique des Carpates. Construit pour résister à un siège prolongé et abriter une garnison permanente de soldats professionnels."

 # ===== DESTINY PRODUCTION METHODS =====

 nd_slo_dest_assay_office: "Bureau d'analyse"
 nd_slo_dest_assay_office_desc: "Ore from the royal mining towns is tested, weighed, and certified by crown-appointed assayers before it is struck into coinage of guaranteed purity."
 nd_slo_dest_bergamt_maintenance: "Entretien du bureau"
 nd_slo_dest_bergamt_maintenance_desc: "Le papier pour les dossiers et les enquêtes, les outils pour les tests géologiques et le fer pour l'équipement minier soutiennent les opérations administratives du Bergamt."
 nd_slo_dest_arms_depot: "Dépôt d'armes"
 nd_slo_dest_arms_depot_desc: "Le fer et le cuivre des Monts Métallifères sont forgés pour fabriquer des armes et des armures au dépôt de la forteresse, équipant ainsi la garnison d'armes produites localement."
 nd_slo_dest_krajina_maintenance: "Entretien de la forteresse"
 nd_slo_dest_krajina_maintenance_desc: "La pierre pour les murs, le bois pour les structures et les armes pour la garnison soutiennent le complexe de forteresse frontalière."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_slo_bureaucracy_authority: "Sprva de Krajinsk"
 AUTO_MODIFIER_DESC_nd_slo_bureaucracy_authority: "Le royaume slovaque hérite des institutions à plusieurs niveaux de la Haute-Hongrie (les assemblées de comitatus, les libertés royales des villes minières, la loi municipale saxonne et la chancellerie de Pressbourg) et pourrait institutionnaliser trois d’entre elles en tant que bureaucraties permanentes."

 slo_stolica_bureaucracy: "Assemblée du comté de Stolica"
 slo_stolica_bureaucracy_desc: "Hérité des comtés-châteaux rpdiens, le comitatus était l'unité de base de l'administration hongroise. Une foispn nommée par le roi présidait l'assemblée noble, mais la szlachta locale élisait l'alispn, les juges szolgabr et leurs députés à la Diète. Dans les comtés slovaques, l'assemblée s'appelait la stolica - le siège - et chacun devenait une petite république de la noblesse locale, farouche dans la défense de ses privilèges écrits et lente à obéir aux ordres royaux."

 slo_banska_mesta_bureaucracy: "Villes minières de Bansk Mest"
 slo_banska_mesta_bureaucracy_desc: "Les sept villes minières royales de Basse-Hongrie - Bansk tiavnica, Kremnica, Bansk Bystrica, Pukanec, Nov Bana, Lubietov et Bansk Bel - étaient régies par la Schemnitzer Stadt- und Bergrecht de 1255-1466, la loi minière fondatrice de l'Europe centrale. À partir de 1331, le Kammergraf de Kremnica administrait chaque atelier de monnaie et chaque puits de minerai de douze comtés, et le florin de Kremnica (23 carats 9 grains, frappé à partir de 1335) devint l'épine dorsale de l'or des revenus de la couronne hongroise."

 slo_spisska_unia_bureaucracy: "Spisk nia"
 slo_spisska_unia_bureaucracy_desc: "Founded by the privilege Stephen V granted the Saxon settlers in 1271 and codified in the Zipser Willkür of c. 1370 (the oldest German municipal law applied in Slovakia), the Province of XXIV Royal Spiš Towns ran its own elected diet, courts, and treasury. In 1412 Sigismund of Luxembourg pawned thirteen of the towns to Poland for 37,000 schock of Prague groschen to fund his Venetian war; they remained in Polish pledge until 1772, but the autonomous statute of the League survived intact."

 slo_korunovacne_mesto_bureaucracy: "Korunovacn Mesto Preporok"
 slo_korunovacne_mesto_bureaucracy_desc: "Lorsque les Ottomans prirent Buda en 1541, Pressbourg (Bratislava) devint la capitale de la Hongrie royale. De 1536 à 1783, la ville abrita la chancellerie, la cour palatine et la chambre du royaume ; de 1542 à 1848, la Diète hongroise siégea ici ; et à la cathédrale Saint-Martin, dix-neuf souverains des Habsbourg furent couronnés rois et reines de Hongrie entre 1563 et 1830. La colline du couronnement projetait la souveraineté hongroise depuis le sol slovaque tandis que Buda était turque."

 slo_trnavska_synoda_bureaucracy: "Synode de Trnavsk"
 slo_trnavska_synoda_bureaucracy_desc: "Lorsqu'Esztergom tomba aux mains des Ottomans en 1543, le siège du primat de Hongrie fut transféré à Trnava (Nagyszombat). Le cardinal Pter Pzmny a convoqué le synode provincial de Trnava de 1611 pour promulguer les réformes tridentines, a fondé l'Université de Trnava en 1635 et a reconverti la plupart des familles de magnats hongrois au catholicisme. Les terres slovaques sont devenues l’épine dorsale institutionnelle de la Contre-Réforme hongroise, mais les bourgeois luthériens des villes royales libres en ont payé le prix."

 slo_bratislavske_lyceum_bureaucracy: "Lycée de Bratislavsk"
 slo_bratislavske_lyceum_bureaucracy_desc: "Le lycée évangélique de Pressbourg, séminaire et gymnase luthérien, abrita la Société tchéco-slave à partir de 1829 et la chaire où Ludovt tr enseigna à partir de 1837. Le 2 février 1843, le cercle de tr résolut à Hlbok 5 de codifier une langue littéraire slovaque standard sur le dialecte slovaque central ; son Nauka reci slovenskej (1846) rendit publique la codification et donna naissance à l'ensemble du programme politique slovaque de 1848-49. L'institution a forgé une intelligentsia slovaque alphabétisée, distincte à la fois de la noblesse magyar et du clergé réformé tchèque."
