# === FORMATION EVENT ===
 nd_mro.1.t: "Le calife de la mer du Sud"
 nd_mro.1.d: "Three centuries of Islam have remade Mindanao. From Maimbung to Kuta Watu, from the kris-foundries of Lanao to the vinta wharves of the Iranun coast, Sunni faith has bound together what no Spanish, Dutch, or English fleet has ever conquered.\n\nNow the impossible has happened. The rival Sultanates of Sulu and Maguindanao no longer war. The rajahs of Butuan and the datus of Buayan and Zamboanga kneel together. The pandita and ulama have spoken with one voice: Mindanao must speak with one voice as well.\n\nA single oath of fealty awaits. The vinta fleets are at sail. The kalis are unsheathed. The question is what kind of polity this Moro Sultanate will be.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mro.1.a: "Le sultan-calife des Moros"
 nd_mro.1.b: "Une confédération de données"
 nd_mro.1.c: "Par l'épée et par la voile"

# === FORMATION CHOICE MODIFIERS ===
 STATIC_MODIFIER_NAME_nd_mro_sultan_caliph: "Le sultan-calife des Moros"
 STATIC_MODIFIER_DESC_nd_mro_sultan_caliph: "Un sultan, un calife, une bannière sur Mindanao. Les oulémas jurent fidélité à un seul trône ; les écoles pandita enseignent le même fiqh de Sulu à Lanao ; la conversion des données païennes et animistes se déroule sous la sanction royale. L’autorité religieuse et l’autorité politique ne font plus qu’une."
 STATIC_MODIFIER_NAME_nd_mro_datu_confederation: "Une confédération de données"
 STATIC_MODIFIER_DESC_nd_mro_datu_confederation: "Le pouvoir monte depuis le datus et non vers le bas depuis le sultan. Chaque rajah garde ses serviteurs, chaque chef son territoire ; le calife est le premier parmi ses pairs, pas le maître de tout. Le coût de l'unité est payé par une autorité centralisée, mais le gain réside dans les prélèvements de chaque clan et dans la loyauté de chaque maison de datu."
 STATIC_MODIFIER_NAME_nd_mro_sword_and_sail: "Par l'épée et par la voile"
 STATIC_MODIFIER_DESC_nd_mro_sword_and_sail: "Les flottes vinta naviguent à la nouvelle lune et reviennent chargées de butin. Des côtes Visayanes au détroit de Bornéo, les lantakas rugissent. La guerre n’est pas l’échec de l’art politique mais son instrument ; le jihad contre les incroyants est la discipline qui maintient la cohésion de la nation Moro."

# === ADVANCE EVENT 2: SHARIF UL-HASHIM ===
 nd_mro.2.t: "La Fondation de Sharif ul-Hashim"
 nd_mro.2.d: "In the year 1457 of the Christian reckoning, the Johore-born scholar and missionary Sharif ul-Hashim came to Buansa on Jolo and was acclaimed Sultan. He had crossed the seas with the Quran, the chronicles of the Prophet, and the genealogies that traced his line back to the Hashemites. Where the datu-rajah hierarchy had once ruled by ancestry alone, now it ruled by ancestry sanctified through Islam.\n\nThe Sharif's first concern is the doctrine itself: which strand of the faith shall the Moro Sultanate plant in its soil? The orthodox jurists of Mecca, with their codified Shafi'i fiqh and their disciplined schools, send their books and their scholars. The Sufi tariqa brotherhoods, with their saints and their popular conversions, send their living teachers. The Sharif must choose."
 nd_mro.2.a: "Recevez le fiqh Shafi'i orthodoxe de la Mecque"
 nd_mro.2.b: "Implanter les confréries soufies de la tariqa parmi le peuple"

# === ADVANCE EVENT 3: VINTA AND LANTAKA ===
 nd_mro.3.t: "Le Vinta et le Lantaka"
 nd_mro.3.d: "The boats are everywhere now: outrigger hulls of nara wood, lateen sails painted in the okir patterns of Sulu, deck-mounted lantakas of bronze cast at Maguindanao foundries. They are smaller than the Spanish galleons, smaller even than the Brunei perahus, but they are faster than both, and they cluster like wasps.\n\nThe debate in the Sultan's diwan is sharp. The Iranun datus want letters of marque, raids on the Visayan coast, slaves and plunder for the warrior nobility. The royal admiralty wants a regular fleet, prahus organized into squadrons, lantakas standardized, the Sulu Sea made a Moro lake. Both visions promise the same vinta, but very different uses for it."
 nd_mro.3.a: "Lâchez les corsaires iraniens sur les Visayas."
 nd_mro.3.b: "Construisez une amirauté royale pour la mer de Sulu."
 STATIC_MODIFIER_NAME_nd_mro_iranun_corsairs: "Les corsaires iraniens"
 STATIC_MODIFIER_DESC_nd_mro_iranun_corsairs: "Les Iranuns attaquent au clair de lune en flottes de quarante vintas, allant des Visayas au détroit de Malacca. Ils prennent des esclaves, de l'argent, des armes et de la réputation. Les Espagnols appellent cela la piraterie ; les Moros appellent cela la guerre."
 STATIC_MODIFIER_NAME_nd_mro_lateen_admiralty: "L'Amirauté Royale"
 STATIC_MODIFIER_DESC_nd_mro_lateen_admiralty: "Les charpentiers navals du Sultan travaillent dans des chantiers standardisés. Les coques Vinta sont mesurées selon un seul gabarit, les lantakas coulés selon un seul alésage. La mer de Sulu devient une mer disciplinée, patrouillé en escadrons sous la bannière verte."

# === ADVANCE EVENT 4: SULTAN KUDARAT ===
 nd_mro.4.t: "Le sultan Kudarat et le long défi"
 nd_mro.4.d: "He is the greatest sultan Mindanao has ever produced: Muhammad Dipatuan Kudarat, descendant of Sharif Kabungsuwan, ruler of nine modern provinces, the man who turned back the Spanish at Lamitan in 1637 with two thousand juramentado warriors and held them off for thirty more years.\n\nHis reign is the golden age of Maguindanao. His diwan receives ambassadors from Brunei, Aceh, and the Dutch. His vinta fleets dominate the Sulu Sea. His name is spoken in the same breath as Suleiman the Magnificent and Akbar the Great.\n\nNow Kudarat sends word: the Spanish have asked for terms. The choice is his to make, and his Sultanate's character will be decided by it."
 nd_mro.4.a: "Poussez le jihad de Lamitan jusqu’aux portes de Manille."
 nd_mro.4.b: "Signez la paix d'Atienza et rouvrez les ports."
 STATIC_MODIFIER_NAME_nd_mro_lamitan_jihad: "Le Jihad de Lamitan"
 STATIC_MODIFIER_DESC_nd_mro_lamitan_jihad: "Deux mille juramentados, ayant juré devant Allah de mourir pour la foi, défilent sous la bannière Moro. Les kalis sont dégainés ; les kampilans clignotent ; les flottes vinta bloquent les ports espagnols. La guerre, et non la paix, est le langage du sultan-calife."
 STATIC_MODIFIER_NAME_nd_mro_kudarat_peace: "La paix d'Atienza"
 STATIC_MODIFIER_DESC_nd_mro_kudarat_peace: "En 1645 le traité est signé. Le sultan ouvre ses ports ; Le commerce de Maguindanao est florissant. Les perles, les écailles de tortue, les esclaves, la cire d'abeille et le riz transitent par Cotabato jusqu'à Manille et Macao. L'âge d'or de Kudarat est né de la retenue et non de la guerre."

# === ADVANCE EVENT 5: PANDITA SCHOOLS ===
 nd_mro.5.t: "Le Pandita et les Ulama"
 nd_mro.5.d: "In every Moro town now there is a pandita, a man who has studied with the great teachers of Sulu, who has perhaps made the hajj to Mecca, who can read the Arabic of the Quran and write the Tausug of the chronicles. Around him gather children, but the diwan must decide which children.\n\nSome pandita teach all who can sit before them: the slave's son beside the datu's, the freeman beside the rajah's heir. Others reserve the deeper texts for the datu and ulama lines, the future judges and ambassadors of the Sultanate. Both visions promise the same scholarship, but very different societies."
 nd_mro.5.a: "Ouvrez les écoles à tous, esclaves comme fils de Datu."
 nd_mro.5.b: "Réservez-les pour les lignes datu et ulama"

# === ADVANCE EVENT 6: JURAMENTADO ===
 nd_mro.6.t: "Le Chemin du Juramentado"
 nd_mro.6.d: "He has shaved his head, bound his loins, and taken the oath before the imam: he will go forth alone or in small bands, kalis in hand, and he will not return. He believes that to fall in jihad is to enter Paradise; he believes that the colonizer's bullets cannot take from him what Allah has not willed.\n\nThe Spanish call him 'juramentado': 'one who has sworn.' They do not understand him, and they fear him.\n\nThe Sultan's diwan must decide what the throne's relation to him shall be. Sanction the juramentado as a Sultan-licensed warrior order, with imams sworn to the throne and a discipline that flows from the diwan. Or let him fight as folk resistance, beyond the throne, sworn only to Allah and his village's imam."
 nd_mro.6.a: "Sanctionnez-les en tant qu'ordre guerrier agréé par le sultan"
 nd_mro.6.b: "Laissez-les combattre en tant que résistance populaire, au-delà du trône"

# === ADVANCES (LOCALIZATION) ===
 nd_mro_sharif_ul_hashim: "Fondation de Sharif ul-Hashim"
 nd_mro_sharif_ul_hashim_desc: "L'arrivée du missionnaire sunnite Sharif ul-Hashim à Buansa en 1457 fonde le sultanat de Sulu et lie la noblesse guerrière des îles du sud à la généalogie hachémite et à la foi sunnite."
 nd_mro_kris_metallurgy: "Kris et Kalis Métallurgie"
 nd_mro_kris_metallurgy_desc: "Les kris à lames ondulées et les kalis plus longs sont forgés dans les ateliers de Mindanao avec des techniques transmises de Java et de Sulawesi : des motifs pamor martelés à partir de couches de fer, des lames bénies par des panditas, des poignées incrustées d'argent et d'ivoire."
 nd_mro_datu_oath: "Le serment de Datu"
 nd_mro_datu_oath_desc: "Le système préislamique de datu, rajah et timawa est fusionné avec le nouveau sultanat. Chaque datu conserve ses serviteurs et ses terres, mais jure fidélité au sultan-calife à la fondation de chaque règne."
 nd_mro_balangay_seafarers: "Les marins de Balangay"
 nd_mro_balangay_seafarers_desc: "Le balangay en planches, ancêtre du vinta, a traversé la mer de Sulu bien avant l'histoire. Ses successeurs transportent des guerriers Moro sur toutes les côtes situées à mille lieues de Mindanao."
 nd_mro_pandita_schools: "Écoles Panditas"
 nd_mro_pandita_schools_desc: "Le pandita enseigne le Coran et le droit dans son école aux murs ouverts. Autour de lui se rassemblent les enfants des datus et les esclaves ; de lui vient la prochaine génération de commis, de juges et d'imams de la nation Moro."
 nd_mro_vinta_fleets: "Les flottes Vinta"
 nd_mro_vinta_fleets_desc: "Navires de guerre à balancier gréés en latin et armés de lantakas montés sur le pont. Plus rapide que n'importe quel galion espagnol, plus difficile à attraper que n'importe quelle frégate hollandaise. La vinta est la pierre angulaire de la puissance maritime moro."
 nd_mro_kalis_warriors: "Guerriers de Kalis"
 nd_mro_kalis_warriors_desc: "Le kalis à lame ondulée est utilisé par tous les guerriers Moro de haut rang. Dans les abordages comme dans les escarmouches en forêt, son tranchant serpentin inflige des blessures qui résistent à la guérison."
 nd_mro_iranun_raiders: "Les pillards iraniens"
 nd_mro_iranun_raiders_desc: "Les Iranun datus de la baie d'Illana ont mené des raids depuis que les Espagnols ont mis le pied pour la première fois à Cebu. Leurs flottes s'étendent de Bornéo aux Visayas, prenant des esclaves, du pillage et de la réputation."
 nd_mro_kuta_fortifications: "Palissades de Kuta"
 nd_mro_kuta_fortifications_desc: "Le kuta est une palissade en bois annelée défendue par des lantakas, des fossés et des pointes de bambou. Kuta Watu et des dizaines d’autres comme lui résistent à l’artillerie espagnole depuis des siècles."
 nd_mro_sultan_kudarat: "Le règne du sultan Kudarat"
 nd_mro_sultan_kudarat_desc: "Muhammad Dipatuan Kudarat (r. 1619-71), the greatest sultan Mindanao has ever produced, ruler of nine modern provinces, defender of the southern islands, the man whose name is still invoked when the Moro speak of resistance."
 nd_mro_lantaka_foundries: "Fonderies de Lantaka"
 nd_mro_lantaka_foundries_desc: "Canons pivotants en bronze coulés dans les ateliers de Maguindanao et Sulu. Le lantaka arme chaque vinta et kuta et sert de monnaie dans les mariages et hommages inter-datu."
 nd_mro_sulu_brunei_axis: "L’axe Sulu-Brunei"
 nd_mro_sulu_brunei_axis_desc: "Les mariages royaux lient Sulu, Maguindanao et Brunei en une seule toile dynastique islamique s'étendant du nord de Bornéo à Mindanao. Les hommages, le commerce et les généalogies partagées maintiennent l’alliance."
 nd_mro_court_administration: "Le Diwan du Sultan"
 nd_mro_court_administration_desc: "Le sultan-calife reçoit des datus, des ambassadeurs, des panditas et des oulémas dans une cour calquée sur les grands diwans du monde islamique. Les décrets sont enregistrés en arabe et en tausug ; des ambassades arrivent d'Aceh, de Brunei et de la côte moghole."
 nd_mro_pansacan_corsairs: "Flottes de corsaires pansacan"
 nd_mro_pansacan_corsairs_desc: "Des escadrons organisés de vintas sous les datus Iranun et Samal dominent la mer de Célèbes. Ils bloquent les ports espagnols, interceptent les navires néerlandais et transforment le détroit entre Mindanao et Bornéo en une autoroute Moro."
 nd_mro_kampilan_warriors: "Les porteurs de Kampilan"
 nd_mro_kampilan_warriors_desc: "Le kampilan à deux mains, épée de l'âge d'or de Maguindanao, est manié par les troupes de choc d'élite des compagnies permanentes du sultan. Son poids écrase les casques ; sa longueur tient les piquiers espagnols à distance."
 nd_mro_pearl_trade: "Le commerce des perles de Sulu"
 nd_mro_pearl_trade_desc: "Les bancs de perles de Tawi-Tawi et de Jolo produisent des pierres précieuses qui atteignent Pékin, La Mecque et Amsterdam. Les perles Sulu sont un instrument de la diplomatie Moro et la fortune du datus Tausug."
 nd_mro_madrasah_network: "Le réseau des madrasas"
 nd_mro_madrasah_network_desc: "Dans chaque grande ville moro, des madrasas aux murs de pierre enseignent l'arabe, le fiqh et les chroniques de l'Islam. Les diplômés servent de juges, d'ambassadeurs et de panditas dans les îles du sud."
 nd_mro_garay_corsairs: "Navires de guerre corsaires Garay"
 nd_mro_garay_corsairs_desc: "Le garay est le grand navire de guerre iranien de raid de la dernière zone de Sulu - plus grand que le vinta, transportant une douzaine de lantakas, propulsé à la rame pour des conditions sans vent, conçu pour le pillage et la capture de prisonniers lors des grands raids saisonniers."
 nd_mro_juramentado: "Le Chemin du Juramentado"
 nd_mro_juramentado_desc: "Le juramentado a juré devant l'imam de mourir au jihad. Il attaque seul ou en petits groupes, kalis à la main, sachant qu'il ne reviendra pas. Il est la réponse du peuple Moro à trois siècles de guerre coloniale."
 nd_mro_cotta_fortresses: "Forteresses en pierre cuite"
 nd_mro_cotta_fortresses_desc: "La cotta est la grande forteresse de pierre des dernières guerres Moro : des citadelles fortifiées, arborant des bannières et armées de lantaka, où flotte la bannière du sultan longtemps après que le colonisateur pense que la guerre est gagnée."
 nd_mro_pearl_divers: "Tawi-Tawi Pearl Diveries"
 nd_mro_pearl_divers_desc: "Des flottes de plongée organisées composées de plongeurs Sama-Bajau et Tausug récoltent les grands bancs de perles. Leur travail, dangereux et sous-payé, alimente la richesse du défunt sultanat et alimente l’économie de la zone de Sulu."
 nd_mro_sulu_zone: "L'économie de la zone de Sulu"
 nd_mro_sulu_zone_desc: "À son apogée, la zone de Sulu est la plus grande économie d’esclavage et de pillage de l’Asie du Sud-Est maritime. Les flottes Vinta et Garay récoltent des captifs, des perles et des produits forestiers sur des milliers de kilomètres de côtes et les échangent vers Canton, Batavia et Manille."
 nd_mro_long_jihad: "Le long Jihad"
 nd_mro_long_jihad_desc: "Trois siècles de guerre coloniale n’ont pas brisé le Moro. Ils continuent de se battre, dans la kuta, dans la cotta, dans l'arrière-pays, dans la jungle, à la manière du juramentado. L’empire du colonisateur s’élève et s’effondre ; la bannière verte demeure."
 nd_mro_pan_moro_unity: "Unité Pan-Moro"
 nd_mro_pan_moro_unity_desc: "Tausug, Maguindanao, Iranun, Maranao, Sama-Bajau et Yakan se reconnaissent comme un seul peuple, les Bangsa Moro, liés par la foi, par les kalis, par la vinta et par trois siècles de résistance partagée."

 nd_mro_steam_corsairs: "Corsaires à vapeur"
 nd_mro_steam_corsairs_desc: "Les constructeurs navals Moro de Sandakan et Maimbung adoptent la petite vedette à vapeur pour succéder à la vinta. Des embarcations de raid à vapeur, plus rapides que n'importe quelle voile, plus difficiles à échapper qu'un garay à rames, transportent le long jihad dans l'ère du charbon."
 nd_mro_bangsa_moro: "Le Bangsa Moro"
 nd_mro_bangsa_moro_desc: "Tausug, Maguindanao, Maranao, Iranun, Sama-Bajau, Yakan, Sangil, Jama Mapun, Kalagan, Kalibugan, Palawani, Molbog et Sangir se reconnaissent tous comme une seule nation : le Bangsa Moro, le peuple Moro, l’alternative méridionale à l’imposition coloniale qui a duré trois siècles et ne se brisera pas."

# === BUILDINGS ===
 nd_mro_kris_foundry: "Fonderie Kris"
 nd_mro_kris_foundry_desc: "Atelier de forge traditionnel où le fer en couches est martelé dans les kris à lames ondulées et les kalis plus longs. Chaque lame porte le motif pamor de son forgeron et les bénédictions du pandita."
 nd_mro_kuta: "Kuta"
 nd_mro_kuta_desc: "Palissade en bois annelée défendue par des lantakas, des fossés et des pointes de bambou. La Kuta est la fortification de référence des îles du sud : moins chère que la pierre, plus rapide à construire et remarquablement résistante à l'artillerie coloniale en terrain tropical."
 nd_mro_lantaka_foundry: "Fonderie Lantaka"
 nd_mro_lantaka_foundry_desc: "Fonderie de bronze fondant le pistolet pivotant Lantaka. Les Lantakas arment chaque vinta et chaque kuta et servent de monnaie, de dot et d'hommage parmi les datus."
 nd_mro_diwan: "Diwan du Sultan"
 nd_mro_diwan_desc: "La cour du Sultan-Calife, calquée sur les grands diwans du monde islamique. Datus, ambassadeurs, panditas et oulémas se rassemblent ici ; les décrets sont enregistrés en arabe et en tausug."
 nd_mro_madrasah: "Mosquée-Madrasa"
 nd_mro_madrasah_desc: "Mosquée aux murs de pierre et école coranique à la fois. Les enfants de datu et d'esclaves apprennent l'arabe, le fiqh et les chroniques de l'Islam sous la tutelle du pandita."
 nd_mro_cotta: "Cotta"
 nd_mro_cotta_desc: "Grande forteresse de pierre de la fin des guerres Moro : fortifiée, arborant des bannières et armée de lantaka. Là où le kuta défie l'artillerie du colonisateur, le cotta défie ses armées."
 nd_mro_pearl_diver_camp: "Camp de plongeurs de perles"
 nd_mro_pearl_diver_camp_desc: "Flotte de plongée organisée composée de plongeurs Sama-Bajau et Tausug travaillant sur les bancs de perles de Tawi-Tawi, Jolo et de l'archipel de Sulu."

# === BUILDING PRODUCTION METHODS ===
 nd_mro_kris_smithing: "Kris Smithing"
 nd_mro_kris_smithing_desc: "Forge martelée du Kris à lame ondulée, la lame de guerrier de chaque maison de Datu."
 nd_mro_kalis_blades: "Forgeage de Kalis"
 nd_mro_kalis_blades_desc: "Forgeage du kalis plus long, la grande épée ondulée de la noblesse guerrière Moro."
 nd_mro_kris_foundry_maintenance: "Entretien de la fonderie"
 nd_mro_kris_foundry_maintenance_desc: "Du fer, du charbon de bois et du bois pour les feux de forge ; des outils pour les forgerons qui font fonctionner la fonderie."
 nd_mro_kuta_garrison: "Garnison de Kuta"
 nd_mro_kuta_garrison_desc: "Du bois pour réparer la palissade, des armes pour les gardiens, du riz et du poisson pour les nourrir."
 nd_mro_bronze_lantaka: "Moulage de Lantaka en bronze"
 nd_mro_bronze_lantaka_desc: "Moulage de canons pivotants en bronze à partir de cuivre et de fer, chaque lantaka étant dimensionné en fonction du vinta ou du mur de kuta qu'il défendra."
 nd_mro_lantaka_foundry_maintenance: "Entretien de la fonderie"
 nd_mro_lantaka_foundry_maintenance_desc: "Du cuivre et du fer pour les moules, du charbon pour les fourneaux et des outils pour les fondeurs."
 nd_mro_diwan_court: "La cour du sultan"
 nd_mro_diwan_court_desc: "Papier pour les décrets, drap fin pour les cérémonies, thé et encens pour la salle d'audience."
 nd_mro_madrasah_lessons: "Les leçons du Pandita"
 nd_mro_madrasah_lessons_desc: "Du papier pour les étudiants, de l'encens pour les prières et du tissu fin pour les robes de l'imam."
 nd_mro_cotta_garrison: "Garnison de Cotta"
 nd_mro_cotta_garrison_desc: "Armes, maçonnerie et bois de construction à réparer ; du riz et du poisson pour soutenir le long siège."
 nd_mro_pearl_harvest: "Récolte de perles"
 nd_mro_pearl_harvest_desc: "Bateaux de plongée équipés de couteaux en fer et de gréements navals ; du poisson pour nourrir les plongeurs pendant les longues journées sur les berges."
 nd_mro_pearl_camp_maintenance: "Entretien du camp"
 nd_mro_pearl_camp_maintenance_desc: "Du poisson, du bois et des fournitures navales pour maintenir la flotte de plongée en mer."

# === UNITS ===
 n_nd_mro_vinta: "Vinta"
 n_nd_mro_vinta_desc: "Lateen-rigged outrigger warship armed with deck-mounted lantakas. Faster than any Spanish galleon, harder to catch than any Dutch frigate, the cornerstone of Moro maritime power."
 n_nd_mro_garay: "Garay"
 n_nd_mro_garay_desc: "Grand navire de guerre de raid Iranun de la dernière zone de Sulu : plus grand que le vinta, propulsé à la rame pour des conditions sans vent, transportant une douzaine de lantakas et une équipe d'abordage de guerriers kalis."
 a_nd_mro_balangay_warriors: "Guerriers Balangay"
 a_nd_mro_balangay_warriors_desc: "Prélèvement côtier destiné aux raids et à la défense des côtes : les équipages des balangay, ancêtre des vinta, qui combattent sur terre comme en mer."
 a_nd_mro_kalis_warriors: "Guerriers de Kalis"
 a_nd_mro_kalis_warriors_desc: "Nobles guerriers Moro portant les kalis à lames ondulées. Dans les actions de mêlée et d'abordage, leurs lames infligent des blessures qui résistent à la guérison - les kalis sont redoutés dans toute l'Asie du Sud-Est maritime."
 a_nd_mro_kampilan_warriors: "Porteurs de Kampilan"
 a_nd_mro_kampilan_warriors_desc: "Infanterie de choc d'élite brandissant le kampilan à deux mains, épée de l'âge d'or de Maguindanao. Le kampilan écrase les casques et dégage la ligne pour les porteurs de kris derrière."

 a_nd_mro_iranun_raiders: "Raiders iraniens"
 a_nd_mro_iranun_raiders_desc: "Pirates-guerriers côtiers de la baie d'Illana - des équipages de vinta et de garay qui combattent aussi bien que les levées de terre, rapides sur le terrain côtier et dévastateurs lors de raids de pillage."
 levy_nd_mro_iranun_raiders: "Raiders iraniens"
 levy_nd_mro_iranun_raiders_desc: "Prélèvement de raid côtier depuis la baie d'Illana ; rapide, axé sur le pillage et aussi à l'aise sur terre que sur mer."
# === LEVIES ===
 levy_nd_mro_balangay_warriors: "Guerriers Balangay"
 levy_nd_mro_balangay_warriors_desc: "Des équipages de flottes de raid côtier qui combattent aussi bien sur terre qu'en mer."
 levy_nd_mro_kalis_warriors: "Guerriers de Kalis"
 levy_nd_mro_kalis_warriors_desc: "Les nobles guerriers Moro élevés pour la mêlée sous la bannière verte."
 levy_nd_mro_kampilan_warriors: "Porteurs de Kampilan"
 levy_nd_mro_kampilan_warriors_desc: "Infanterie de choc d'élite portant des kampilans de l'âge d'or de Maguindanao."

# === EVENT VARIABLE TOOLTIPS ===
 nd_mro_formed_tt: "A formé le sultanat Moro."
 nd_mro_path_a_tt: "Voie Sultan-Calife : monarchie islamique centralisée."
 nd_mro_path_b_tt: "Voie de la Confédération de Datus : noblesse guerrière fédérale."
 nd_mro_path_c_tt: "Voie de l'épée et de la voile : le jihad maritime."

# === DESTINY TREE ===
 nd_mro_destiny: "La bannière du sultan-calife"
 nd_mro_destiny_desc: "The Moro polity is proclaimed: one Sultan, one banner, one ummah from Sulu to Surigao. The pandita read the khutba in the Sultan's name; the datus kiss the green flag at every harbour. The destiny of the Bangsa Moro is now to be chosen.\n\n#bold Requires:#! 75 stability."

# Path A: Sword of the Caliph
 nd_mro_dest_juramentado_corps: "Le Corps Juramentado"
 nd_mro_dest_juramentado_corps_desc: "Standing companies of jurat-sworn warriors are raised and trained from boyhood. The kris is unsheathed in the Visayas; the Sulu vinta strikes at the Brunei coast. The southern islands learn the cost of crossing the Moro nation.\n\n#bold Requires:#! Sword and Sail destiny path; own Cebu (Singhapala); own Brunei (Berune); a Kris Foundry in 2 locations."
 nd_mro_dest_kris_foundries_tt: "A #bold $nd_mro_kris_foundry$#! stands in at least #bold 2#! of our locations"
 nd_mro_dest_lantaka_foundries_tt: "A #bold $nd_mro_lantaka_foundry$#! stands in at least #bold 2#! of our locations"
 nd_mro_dest_lantaka_armada: "L'armada de Lantaka"
 nd_mro_dest_lantaka_armada_desc: "The vinta and garay fleets patrol from Maluku to Sabah. Lantaka batteries close the Sulu and Celebes seas to colonial shipping. The Sultan-Caliph's banner flies over the spice approaches.\n\n#bold Requires:#! Own Ternate; own Brunei (Api Api); own Sandakan; a Lantaka Foundry in 2 locations."
 nd_mro_dest_sulu_caliphate: "Le Califat des Mers du Sud"
 nd_mro_dest_sulu_caliphate_desc: "Manila has fallen. Tondo prays five times a day. Gowa kneels to the Sultan-Caliph. The colonial age has been answered with sword and sail, and the southern seas are a Moro lake at last. Unlocks the Juramentado Brotherhood.\n\n#bold Requires:#! Own Maynila; own Tondo; own Gowa; 3000 gold."

# Path B: Sultan and Pandita
 nd_mro_dest_sharia_codification: "La codification de la charia"
 nd_mro_dest_sharia_codification_desc: "The qadi assemble in the Sultan's diwan. The fiqh of the southern islands is set down in writing for the first time, drawn from Shafi'i jurisprudence and Tausug custom alike. The legalist age of the Moro polity begins.\n\n#bold Requires:#! Sultan-Caliph destiny path; embraced Legalism; 1000 gold; 50 prestige."
 nd_mro_dest_pan_islamic_trade: "Le réseau commercial panislamique"
 nd_mro_dest_pan_islamic_trade_desc: "Moro pearl, beeswax, and tortoise-shell reach Aceh, Malacca, and Temasek. The Sultan's writ runs from the Sulu Sea to the Strait of Malacca, binding the Islamic trade circuits of maritime Southeast Asia under one banner.\n\n#bold Requires:#! Own Malacca; own Bandar Aceh; own Temasek; 2000 gold."
 nd_mro_dest_madrasah_civilization: "La civilisation des Panditas"
 nd_mro_dest_madrasah_civilization_desc: "The southern islands have become a beacon of Sunni civilization. Madrasahs in every town, qadi in every diwan, ulama trained in Mecca returning to teach in Cotabato and Jolo. From Palembang of Sumatra to Demak of Java, the great Islamic seats of maritime Asia answer to one Caliph.\n\n#bold Requires:#! Own Palembang; own Demak; 75 prestige; 3000 gold. Unlocks the Grand Mosque."

# === DESTINY EVENT 7: ROOT ===
 nd_mro.7.t: "La bannière déployée"
 nd_mro.7.d: "On the steps of the Sultan's diwan, the green banner of the Moros is unfurled before the assembled datus, panditas, ulama, and ambassadors of the southern islands. The shahada is recited; the kris are kissed; the Sultan's name is proclaimed in the friday khutba from Maimbung to Lake Lanao.\n\nThe path of the Moro nation is now in the Sultan's hand, and the destiny of the Bangsa Moro is open to choose."
 nd_mro.7.a: "La bannière est levée."

# === DESTINY EVENT 8: PATH A STAGE 1 ===
 nd_mro.8.t: "Le Corps Juramentado"
 nd_mro.8.d: "In the courtyard of the great kuta of Maimbung, the imam binds the loins of the first hundred. They have shaved their heads, made the wudu, and sworn before Allah and the Sultan to die in jihad rather than break ranks.\n\nThe diwan debates the corps's mission. Some demand a kris brotherhood drilled for the close-quarters shock that broke the Spanish at Lamitan. Others demand vinta corsair-juramentado, sworn to die in the boarding action against the colonial galleons. The Sultan's hand will weight the doctrine."
 nd_mro.8.a: "Entraînez la confrérie Kris - choc rapproché"
 nd_mro.8.b: "Train the vinta corsair-juramentado: naval boarding"

# === DESTINY EVENT 9: PATH A STAGE 2 ===
 nd_mro.9.t: "L'Armada prend les mers intérieures"
 nd_mro.9.d: "From the foundries of Maguindanao the lantakas come down by the hundreds. From the wharves of Sulu the vinta squadrons sail in fleets of forty. The Spanish galleon and the Dutch frigate are turned back at Ternate; the Brunei perahu falls in line at Sandakan. The southern seas are a Moro lake.\n\nThe Sultan's diwan debates the use to which this armada should be put. The Iranun datus call for the great raid: a generation of plunder reaching to Mindoro and Borneo's western coast. The royal admiralty calls for the great blockade: the closing of the Maluku spice approaches against every European flag."
 nd_mro.9.a: "Lâchez les corsaires Iranun sur les Visayas et Bornéo."
 nd_mro.9.b: "Fermez les approches des Moluques en blocus royal."
 STATIC_MODIFIER_NAME_nd_mro_dest_armada_corsairs: "L'armada iranienne"
 STATIC_MODIFIER_DESC_nd_mro_dest_armada_corsairs: "Les flottes corsaires s'étendent de Mindoro à Bornéo, emportant des esclaves, de l'argent et de la réputation. Les bandes de guerre Moro se déplacent au gré des marées, alimentées par des raids et des tributs, et gagnent en renommée à chaque campagne."
 STATIC_MODIFIER_NAME_nd_mro_dest_spice_blockade: "Le blocus des Moluques"
 STATIC_MODIFIER_DESC_nd_mro_dest_spice_blockade: "Pearls and spice flow into the Sultan's coffers as the European companies are turned away from Ternate. The blockade enriches the treasury and bends the great powers to the negotiating table, though the masons and carpenters of the home islands are pulled to the war yards."

# === DESTINY EVENT 10: PATH A STAGE 3 (CAPSTONE) ===
 nd_mro.10.t: "Le Califat des Mers du Sud"
 nd_mro.10.d: "Manila has fallen to the kalis. Tondo's bells are silent; the friday khutba is read from the cathedral pulpit of the conquistadors. Gowa kneels. Brunei renews her oath. The Sultan-Caliph of the Moros is master of every shore from Sulawesi to Luzon.\n\nThe diwan now considers the form this dominion shall take. Some say the Moro nation must become a true caliphate: a state of war and sharia, of disciplined corps and conquering armies, that shall not stop until every island flies the green banner. Others say the dominion is already won, and that the future lies in the ordered economy of the Sulu Zone: a maritime imperium of pearls, slaves, and tributary trade."
 nd_mro.10.a: "Forgez un véritable califat de l’épée et de la charia."
 nd_mro.10.b: "Maîtrisez l’économie de la zone Sulu à son apogée."
 STATIC_MODIFIER_NAME_nd_mro_dest_southern_caliphate: "Le Califat du Sud"
 STATIC_MODIFIER_DESC_nd_mro_dest_southern_caliphate: "Le califat Moro marche en corps disciplinés. Les tactiques militaires des kalis et des kampilan sont codifiées dans le manuel du sultan ; l'assiégeant apprend le fossé du kuta et le mur de pierre de la cotta. La main civile de l’État est légère, car l’épée est la loi."
 STATIC_MODIFIER_NAME_nd_mro_dest_corsair_empire: "La zone Sulu au sommet"
 STATIC_MODIFIER_DESC_nd_mro_dest_corsair_empire: "Les perles, les esclaves, la cire d'abeille et les produits forestiers traversent la zone de Sulu dans des volumes jamais vus auparavant. Le trésor se remplit ; les prêteurs de Canton offrent leurs meilleurs taux. Les îles du sud s'enrichissent grâce aux raids et au commerce, mais la conscience du monde musulman regarde d'un mauvais oeil les captifs enchaînés au marché de Jolo."

# === DESTINY EVENT 11: PATH B STAGE 1 ===
 nd_mro.11.t: "La codification de la charia"
 nd_mro.11.d: "The qadi gather under the Sultan's banner: scholars from Sulu, Maguindanao, Buayan, and Lake Lanao, each bringing his chronicles, his Shafi'i texts, and his customary law. For a year they argue.\n\nThe deeper question is theirs to settle: shall the new fiqh be pure Shafi'i orthodoxy, transplanted whole from the schools of Mecca, that the Moro nation may speak the same legal language as the wider ummah? Or shall it be a hybrid code that weaves the Quran and the Shafi'i school together with the customs of the datu, a Moro sharia answerable only to itself?"
 nd_mro.11.a: "Pure orthodoxie Shafi'i de La Mecque"
 nd_mro.11.b: "Un code hybride mêlant Shafi'i et la coutume Tausug"

# === DESTINY EVENT 12: PATH B STAGE 2 ===
 nd_mro.12.t: "Le réseau panislamique"
 nd_mro.12.d: "Moro pearl reaches Mecca. Moro beeswax reaches Hadhramaut. Moro pilgrims, robed in the white ihram, walk the haram with hajjis from Aceh, Bengal, and the Mughal coast. The southern islands have entered the Indian Ocean Islamic world as full members.\n\nThe Sultan must choose how this network will be ordered. The merchant party calls for a hajj caravan system: direct overland and overseas pilgrim routes, secured by tribute and treaty, drawing the wealth of the ummah through Maguindanao. The diplomatic party calls for a great compact with Aceh and Brunei: a confederation of Sunni sultanates that shall stand against every Christian and Hindu power in the eastern seas."
 nd_mro.12.a: "Construisez les caravanes du hajj à travers Maguindanao."
 nd_mro.12.b: "Signez le pacte Aceh-Sulu-Brunei."
 STATIC_MODIFIER_NAME_nd_mro_dest_hajj_caravans: "Les caravanes du Hajj"
 STATIC_MODIFIER_DESC_nd_mro_dest_hajj_caravans: "Les convois de pèlerins se déplacent de Cotabato à La Mecque et reviennent le long d'itinéraires sécurisés. Les marchands Moro les accompagnent ; La pièce Moro est reconnue à Aden et à Surat ; le nom du sultan est accueilli dans tous les ports de la Oumma."
 STATIC_MODIFIER_NAME_nd_mro_dest_aceh_compact: "Le Pacte d’Aceh"
 STATIC_MODIFIER_DESC_nd_mro_dest_aceh_compact: "Aceh, Sulu, Brunei et Maguindanao sont liés par un seul pacte : ambassades partagées, espions partagés, charpentiers navals partagés. Aucune puissance chrétienne ne se déplace dans les mers orientales sans que le sultan-calife en soit informé."

# === DESTINY EVENT 13: PATH B STAGE 3 (CAPSTONE) ===
 nd_mro.13.t: "La civilisation des Panditas"
 nd_mro.13.d: "The southern islands have become an Islamic civilization in their own right. Madrasahs stand in every town. The fiqh is taught in Tausug and Maguindanao Arabic alike. Pandita-judges arbitrate every dispute from Sandakan to Cebu. Pilgrims from Java and Brunei come north to study at Cotabato and Jolo.\n\nNow the Sultan-Caliph's diwan considers the apex of this civilization. Some hold that the future lies with the tariqa: the Sufi brotherhoods that have penetrated even the most remote barrios, binding the Bangsa Moro through love and song. Others hold that the future lies with the legalists: a Sultan-Solomon, ruling the southern seas in justice and order, the equal of any caliph in Islamic memory."
 nd_mro.13.a: "Renforcez les confréries soufies tariqa."
 nd_mro.13.b: "Régnez en tant que Sultan-Salomon, le sommet légaliste."
 STATIC_MODIFIER_NAME_nd_mro_dest_tariqa_brotherhood: "Les confréries Tariqa"
 STATIC_MODIFIER_DESC_nd_mro_dest_tariqa_brotherhood: "Sufi orders penetrate every village. The dhikr is sung at every haflah; conversion proceeds not by sword but by song. The Bangsa Moro embraces a wider Islam, accommodating local custom, though the legalist ulama complain of doctrinal looseness."
 STATIC_MODIFIER_NAME_nd_mro_dest_sultan_solomon: "Sultan-Salomon"
 STATIC_MODIFIER_DESC_nd_mro_dest_sultan_solomon: "Le sultan règne avec la sagesse de Sulayman : chaque requête entendue, chaque loi appliquée, chaque donnée disciplinée. Les îles du sud sont gouvernées comme un seul royaume ordonné. La discipline civile s'éloigne de la discipline martiale ; les murs du kuta s'amincissent à mesure que les salles du diwan s'agrandissent."

# === DESTINY BUILDINGS ===
 nd_mro_juramentado_brotherhood: "Confrérie du Juramentado"
 nd_mro_juramentado_brotherhood_desc: "Salle capitulaire permanente des guerriers assermentés par le jurat. Les garçons sont accueillis jeunes, entraînés pendant une décennie au kalis et au kampilan, et tenus par le serment de mourir avant de battre en retraite. La confrérie est le bras armé du sultan-calife et la terreur de chaque garnison coloniale."
 nd_mro_jurat_oath: "Le serment du Jurat"
 nd_mro_jurat_oath_desc: "Armement et provisions pour la confrérie : des lames kalis pour chaque novice, des kampilans pour le corps et les simples rations du guerrier à l'entraînement."
 nd_mro_grand_mosque: "Grande Mosquée"
 nd_mro_grand_mosque_desc: "La grande mosquée congrégationaliste des îles du sud. Son minaret s'élève au-dessus du diwan du sultan ; son mihrab désigne la Mecque ; sa khutba du vendredi lie le Bangsa Moro en une seule oumma sous un seul sultan-calife."
 nd_mro_grand_mosque_upkeep: "Le service de la mosquée"
 nd_mro_grand_mosque_upkeep_desc: "Du tissu fin pour les robes de l'imam, du papier pour les archives du cadi, de l'encens et de la cire d'abeille pour les prières du vendredi et les longues nuits de dhikr."

# ===== BUREAUCRACIES =====
 mro_ruma_bichara_bureaucracy: "Ruma Bichara"
 mro_ruma_bichara_bureaucracy_desc: "Le conseil d'État consultatif du sultanat de Sulu (son homologue de Maguindanao appelé Bichara Atas), composé des principaux datus et des sharifs résidents. Les Datu Raja Muda, Datu Maharaja Adenduk, Datu Ladja Laut et d'autres officiers titrés se sont réunis en conseil ; chacun détenait une voix, le sultan deux et le Raja Muda deux. Au-delà de ses conseils, le Ruma Bichara a élu l'héritier présumé du sultan parmi la lignée masculine, ce qui rendait impossible à tout sultan de l'ignorer."

 mro_pandita_madrasah_bureaucracy: "Réseau Pandita Madrasah"
 mro_pandita_madrasah_bureaucracy_desc: "L'éducation islamique était organisée à travers les maisons du pandita (« savant » dérivé du sanskrit) et la mosquée, établies à Mindanao et à Sulu à partir de la fin du XIIIe siècle par des missionnaires arabes. Chaque datu avait son propre pandita comme conseiller religieux ; ensemble, ils constituaient les oulémas de Bangsa Moro. L'enseignement coranique était dispensé dans les maisons de pandita et les mosquées, produisant les employés alphabétisés dont la chancellerie du sultan avait besoin et assurant la cohésion doctrinale qui soutenait la revendication du sultan et du calife."

 mro_tarsila_chancery_bureaucracy: "Chancellerie de Tarsila"
 mro_tarsila_chancery_bureaucracy_desc: "Les gardiens de la tarsila (de l'arabe silsilah, « chaîne »), les documents généalogiques écrits qui retracent les sultans de Sulu jusqu'à Sayyid Abu Bakr et, à travers lui, jusqu'au Prophète. Chaque donnée principale gardait sa propre tarsila ; la chancellerie du sultan organisait les lignées officielles, validait les revendications rivales et arbitrait les alliances matrimoniales. Sans ces parchemins, un prétendant n'était qu'un autre raja ; avec eux, il était le calife de la mer du Sud."

 mro_panglima_districts_bureaucracy: "Administration du district de Panglima"
 mro_panglima_districts_bureaucracy_desc: "La portée provinciale du Sultanat, organisée sous le district panglima (l'équivalent des maires) qui à leur tour gouvernait des capitaines de quartier aux titres variés de maharaja, orangkaya et parukka. Le panglima collectait la zakat et le tribut, administrait la justice au nom du sultan et traduisait les édits centraux en application locale. Cependant, lorsque les fonctions sont devenues héréditaires, les titres de panglima ont été transmis par héritage et les capitaines de barrio ont écrémé à tous les niveaux."

 mro_parang_sabil_brotherhood_bureaucracy: "Confrérie Parang Sabil"
 mro_parang_sabil_brotherhood_bureaucracy_desc: "L'institution des mag-sabil (Tausug : « celui qui endure les affres de la mort »), guerriers Moro qui prêtèrent le serment Napi de mourir sur le chemin de Dieu contre les incroyants. Les candidats devaient obtenir l'accord parental et l'autorisation personnelle du sultan avant d'être confiés aux imams pour une préparation spirituelle et martiale. Le mag-sabil attirait les kris et les barongs contre les garnisons espagnoles lors d'attaques que les Espagnols eux-mêmes appelaient « juramentado » en 1876. Lorsqu'il était autorisé par le sultan, il constituait le moyen de dissuasion le plus redouté du royaume ; dans le cas contraire, cela devenait une vendetta incontrôlée."

 mro_lanong_admiralty_bureaucracy: "Amirauté corsaire de Lanong"
 mro_lanong_admiralty_bureaucracy_desc: "L'établissement naval dirigé par le Datu Ladja Laut, qui, entre 1770 et 1870 environ, a lancé chaque année entre un et deux cents navires de guerre Iranun et Bangugui depuis Maimbung, Malabang et la côte iranienne. Le lanong était un balancier de trente mètres avec jusqu'à trois rangées d'avirons et des canons pivotants lantaka ; le garay plus léger attaquait plus rapidement. Les captifs vendus sur les marchés de Jolo et de Tawi-Tawi fournissaient la main-d'œuvre dont dépendait en grande partie l'économie du sultanat. Dans les années 1850, les captifs Bisaya représentaient peut-être la moitié de la population de Sulu."

# ===== AUTO-MODIFIER (slot grant on formation) =====
 AUTO_MODIFIER_NAME_nd_mro_bureaucracy_authority: "Autorité bureaucratique du Sultanat"
 AUTO_MODIFIER_DESC_nd_mro_bureaucracy_authority: "Once the Moro Sultanate is proclaimed, the Sultan-Caliph may host the historical institutions of the Bangsa Moro: the Ruma Bichara, the pandita network, the tarsila chancery, the panglima districts, the parang sabil brotherhood, and the lanong admiralty."

# ===== POLISH PASS: NEW MODIFIER LOC =====
 STATIC_MODIFIER_NAME_nd_mro_orthodox_fiqh: "Fiqh Shafi'i orthodoxe"
 STATIC_MODIFIER_DESC_nd_mro_orthodox_fiqh: "La loi codifiée de l'école Shafi'ite de La Mecque est entièrement transplantée dans les îles du sud. Les cadi citent les mêmes textes lus au Caire et à Aceh ; l'imam prêche la même khutba ; L’alphabétisation en arabe classique se propage à travers le corps des oulémas."
 STATIC_MODIFIER_NAME_nd_mro_sufi_tariqa: "Confréries soufies de la Tariqa"
 STATIC_MODIFIER_DESC_nd_mro_sufi_tariqa: "Les confréries Naqshbandi, Qadiri et Shadhili implantent leurs saints dans chaque grande ville Moro. La conversion se produit par l'amour plutôt que par l'épée, et les vieux diwata anitistes sont adoucis en pirs soufis plutôt que carrément niés."
 STATIC_MODIFIER_NAME_nd_mro_pandita_open: "Écoles Pandita ouvertes à tous"
 STATIC_MODIFIER_DESC_nd_mro_pandita_open: "Le fils de l'esclave est assis à côté des données sur la natte du pandita. Le talent monte là où le trône ne pouvait pas le prédire ; L'alphabétisation atteint tous les barangays ; le corps Moro composé de commis, de juges et d'ambassadeurs s'étend au-delà de la lignée noble."
 STATIC_MODIFIER_NAME_nd_mro_pandita_elite: "Écoles Pandita des lignées"
 STATIC_MODIFIER_DESC_nd_mro_pandita_elite: "Les textes profonds et la haute jurisprudence sont réservés aux lignes datu et ulama. Les lettrés Moro forment une caste plus resserrée et plus disciplinée ; la légitimité et l’apprentissage sont liés au noble héritage."
 STATIC_MODIFIER_NAME_nd_mro_juramentado_sanctioned: "Juramentado assermenté par le sultan"
 STATIC_MODIFIER_DESC_nd_mro_juramentado_sanctioned: "Les juramentado prêtent serment devant l'imam du sultan, formés au kuta et dirigés par des capitaines nommés par le sultan. Leur serment les lie ensemble au trône et à la foi ; le diwan contrôle quand ils marchent."
 STATIC_MODIFIER_NAME_nd_mro_juramentado_folk: "Juramentado folklorique des villages"
 STATIC_MODIFIER_DESC_nd_mro_juramentado_folk: "Le juramentado jure devant l'imam de son village, au-delà des ordres du trône. Le sultan ne lui donne pas d'ordre ; le village le fait. Là où le kuta tombe et le diwan est réduit au silence, le peuple juramentado entre seul dans le camp du colonisateur et la guerre continue."
 STATIC_MODIFIER_NAME_nd_mro_dest_kris_brotherhood: "Kris Brotherhood Foré"
 STATIC_MODIFIER_DESC_nd_mro_dest_kris_brotherhood: "Des compagnies permanentes de porteurs de kris et de kampilan s'entraînent quotidiennement dans les cours de Kuta. Le choc rapproché à lames ondulées qui a brisé les lignes espagnoles à Lamitan est désormais une doctrine permanente de l'armée Moro."
 STATIC_MODIFIER_NAME_nd_mro_dest_corsair_juramentado: "Vinta Corsair-Juramentado"
 STATIC_MODIFIER_DESC_nd_mro_dest_corsair_juramentado: "Les juramentado apprennent l'action d'abordage : les kalis en main, le saut de la vinta au gréement latin sur le pont du galion espagnol, la prière récitée au moment où les balles coloniales commencent. Une doctrine navale des morts volontaires."
 STATIC_MODIFIER_NAME_nd_mro_dest_shafii_orthodoxy: "Orthodoxie Shafi'ite"
 STATIC_MODIFIER_DESC_nd_mro_dest_shafii_orthodoxy: "Le nouveau fiqh est du pur Shafi'i, transplanté entier de La Mecque. La nation Moro parle désormais le même langage juridique que la Oumma au sens large ; le cadi cite les mêmes textes à Sulu qu'au Caire et à Aceh."
 STATIC_MODIFIER_NAME_nd_mro_dest_hybrid_law: "Code Moro de la charia"
 STATIC_MODIFIER_DESC_nd_mro_dest_hybrid_law: "Le nouveau fiqh tisse le Coran et l'école Shafi'i avec les coutumes du datu. La nation Moro a sa propre charia, qui ne répond qu’à elle-même ; la légitimité découle autant de la loi que du trône."
