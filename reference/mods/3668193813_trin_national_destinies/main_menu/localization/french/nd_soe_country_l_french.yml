l_french:
 SOE: "Songhai"
 SOE_ADJ: "Songhaï"
 SOE_f: "Empire Songhaï"
 SOE_f_desc: "L'empire Songhaï était le plus grand État de l'histoire de l'Afrique, dominant la boucle du Niger et les routes commerciales transsahariennes depuis sa capitale Gao. Sous Sonni Ali et Askia Muhammad, l’empire absorba les vestiges du Mali, contrôla les villes légendaires de Tombouctou et de Djenn et devint un centre d’érudition islamique. Restaurer cet empire signifie unir à nouveau le Sahel sous la domination Songhaï."
