l_french:
 yavana_culture: "Yavana"
 STATIC_MODIFIER_NAME_nd_yav_phalanx_reborn: "Phalange renaît"
 STATIC_MODIFIER_DESC_nd_yav_phalanx_reborn: "La phalange armée de sarissa s'est à nouveau levée dans les terres situées entre l'Indus et l'Hindu Kush. Ce que les successeurs d'Alexandre ont apporté à l'Est, nous l'avons fait nôtre."
 STATIC_MODIFIER_NAME_nd_yav_dharma_of_the_yavana: "Dharma du Yavana"
 STATIC_MODIFIER_DESC_nd_yav_dharma_of_the_yavana: "Là où la philosophie grecque rencontre la sagesse bouddhiste, une nouvelle civilisation s’épanouit. Nos pièces de monnaie portent deux écritures, nos temples deux traditions et nos érudits parlent au monde entier."
 STATIC_MODIFIER_NAME_nd_yav_questions_of_milinda: "Questions de Milinda"
 STATIC_MODIFIER_DESC_nd_yav_questions_of_milinda: "Dans la tradition des dialogues du roi Ménandre avec le moine Nagasena, notre cour embrasse l'union de la raison et de l'illumination."
 STATIC_MODIFIER_NAME_nd_yav_rational_inquiry: "Enquête rationnelle"
 STATIC_MODIFIER_DESC_nd_yav_rational_inquiry: "La méthode grecque de questionnement systématique appliquée aux mystères du monde donne lieu à des découvertes qu'aucune tradition ne pourrait réaliser à elle seule."
 STATIC_MODIFIER_NAME_nd_yav_fourfold_array: "Tableau quadruple"
 STATIC_MODIFIER_DESC_nd_yav_fourfold_array: "L'infanterie, la cavalerie, les éléphants et les archers opèrent comme une seule force coordonnée dans la tradition hellénistique des armes combinées."
 nd_yav.1.t: "La restauration Yavana"
 nd_yav.1.d: "For centuries the Yavana name has echoed through Indian chronicles: the Greeks who came from beyond the mountains, who struck coins in two languages and worshipped the Enlightened One in marble temples. Now a Sindhi Buddhist ruler has dared what no one thought possible: the revival of the Indo-Greek kingdom.\n\nFrom Thatta on the Indus delta to Peshawar in the shadow of the Khyber Pass, the ancient Yavana domains answer to a single throne once more. But what manner of state shall this be? The phalanx drills in the courtyards of Gandharan monasteries, and merchants strike bilingual coins in workshops that smell of incense and olive oil.\n\nTwo paths lie before the restored Yavana Empire: one looking to the military genius of Alexander's heirs, the other to the philosophical synthesis that made these kingdoms unique among all the world's civilizations.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_yav.1.a: "Nous ferons revivre la phalange qui a conquis la moitié du monde"
 nd_yav.1.b: "Notre dharma relie l'Orient et l'Occident dans la sagesse"
 nd_yav.2.t: "Les questions de Milinda"
 nd_yav.2.d: "In the ancient text known as the Milindapanha, the Greek king Menander (called Milinda in Pali) engaged the Buddhist monk Nagasena in a series of profound philosophical dialogues. The king asked the deepest questions about the nature of the self, of karma, of existence itself, and the monk answered with parables and razor-sharp logic.\n\nThis tradition of dialogue between Greek rational inquiry and Buddhist contemplative wisdom was the intellectual foundation of the Indo-Greek kingdoms. Now our scholars have revived these methods, hosting public debates between philosophers of every school in the gymnasia and viharas of our cities.\n\nShall we emphasize the spiritual dimension of this tradition, or its contribution to rational knowledge?"
 nd_yav.2.a: "Laissez le dialogue éclairer le chemin vers le nirvana"
 nd_yav.2.b: "Laissez la raison être notre guide pour comprendre le monde"
 nd_yav.3.t: "L'école d'art du Gandhara"
 nd_yav.3.d: "In the workshops of Gandhara, something extraordinary has emerged. Our sculptors, trained in the Greek tradition of naturalistic human representation, have turned their skills to Buddhist subjects. For the first time in history, the Buddha is depicted not as an abstract symbol (a wheel, a tree, a set of footprints) but as a serene human figure draped in a toga-like robe, his hair arranged in waves reminiscent of Apollo.\n\nThese images carry an emotional power that purely symbolic art cannot match. Pilgrims weep before the compassionate face of the Enlightened One. The art is spreading along trade routes in every direction, and with it the fame of Yavana civilization."
 nd_yav.3.a: "Notre art portera le dharma jusqu'aux extrémités de la terre"
 nd_yav.4.t: "Le quadruple tableau"
 nd_yav.4.d: "The Milinda Panha describes Menander's army as a fourfold force: elephants, cavalry, archers, and foot soldiers. Our generals have formalized this ancient doctrine into a comprehensive system of combined arms warfare.\n\nThe phalanx holds the center with their sarissas, an unbreakable wall of iron points. On the flanks, mounted archers harass and screen. Behind the lines, war elephants wait in reserve: living siege towers that shatter enemy formations when committed at the decisive moment. Skirmishers and light troops fill the gaps, maintaining contact between the four arms.\n\nNo army in India fights like this. It is neither purely Greek nor purely Indian, but something new, and devastating."
 nd_yav.4.a: "Que le quadruple tableau emporte tout devant lui"
 nd_yav_culture_conversion_tt: "Tous les Sindhi pop dans les provinces appartenant adoptent la culture Yavana"
 nd_yav_formed_tt: "Formation de l'empire Yavana"
 nd_yav_path_a_tt: "Chemin de la Phalange"
 nd_yav_path_b_tt: "Chemin du Dharma"
 nd_yav_dest_three_viharas_tt: "At least #bold 3#! of our locations have a #bold Gandhara Vihara#!"
 nd_yav_dest_taxila_developed_tt: "Owns #bold Taxila#! (Rawalpindi) and its development is at least #bold 45#!"
 nd_yav_dest_mathura_developed_tt: "Owns #bold Mathura#! and its development is at least #bold 64#!"
 nd_yav_phalanx_revival: "La renaissance de la phalange"
 nd_yav_phalanx_revival_desc: "La phalange macédonienne, amenée en Inde par les successeurs d'Alexandre, s'entraîne de nouveau dans les cours du Sind. L'infanterie lourde armée de la pique sarissa constitue l'épine dorsale de l'armée Yavana."
 nd_yav_gandhara_monasteries: "Monastères du Gandhara"
 nd_yav_gandhara_monasteries_desc: "Les monastères bouddhistes construits dans le style architectural grec servent de centres d'apprentissage et de culte, préservant les textes en grec et en prakrit."
 nd_yav_bilingual_administration: "Administration bilingue"
 nd_yav_bilingual_administration_desc: "Les documents d'État sont délivrés en grec et en prakrit, garantissant que la bureaucratie hellénistique et les sujets indiens peuvent communiquer sans barrières."
 nd_yav_elephant_corps: "Corps des éléphants"
 nd_yav_elephant_corps_desc: "Les royaumes indo-grecs ont adopté avec enthousiasme les éléphants de guerre indiens, les protégeant et installant des plates-formes de combat au sommet de ces forteresses vivantes."
 nd_yav_indus_trade: "Réseaux commerciaux de l'Indus"
 nd_yav_indus_trade_desc: "Le contrôle du fleuve Indus et des cols montagneux reliant l’Inde à l’Asie centrale donne à l’État de Yavana le contrôle de certaines des routes commerciales les plus lucratives du monde antique."
 nd_yav_bilingual_coinage: "Monnaie bilingue"
 nd_yav_bilingual_coinage_desc: "Pièces de monnaie frappées en grec sur une face et en kharosthi sur l'autre, une caractéristique de la civilisation indo-grecque qui facilite le commerce au-delà des frontières linguistiques."
 nd_yav_gajasena_tradition: "Tradition Gajasena"
 nd_yav_gajasena_tradition_desc: "La doctrine formalisée de la guerre des éléphants, entraînant des bêtes et des cornacs ensemble dans des tactiques coordonnées qui maximisent l'impact terrifiant d'une ligne d'éléphants en charge."
 nd_yav_milindapanha: "Dialogues Milindapanha"
 nd_yav_milindapanha_desc: "Les dialogues philosophiques entre rationalisme grec et contemplation bouddhiste, sur le modèle des échanges légendaires du roi Ménandre avec le moine Nagasena."
 nd_yav_gandhara_art: "École d'art du Gandhara"
 nd_yav_gandhara_art_desc: "Les techniques sculpturales grecques appliquées aux sujets religieux bouddhistes, créant les premières représentations humaines du Bouddha et établissant une tradition artistique qui se répandra dans toute l'Asie."
 nd_yav_strategoi_governance: "Gouvernance stratégique"
 nd_yav_strategoi_governance_desc: "Le système hellénistique de gouvernance provinciale à travers des stratégies militaro-civiles, adaptées aux conditions indiennes et assurant à la fois la défense des frontières et l'efficacité administrative."
 nd_yav_hellenistic_gymnasium: "Gymnase hellénistique"
 nd_yav_hellenistic_gymnasium_desc: "La tradition grecque des gymnases d’entraînement physique combinée à l’éducation philosophique, créant des citoyens formés à la fois au corps et à l’esprit."
 nd_yav_combined_arms: "Doctrine interarmes"
 nd_yav_combined_arms_desc: "The systematic coordination of infantry phalanx, war elephants, mounted archers, and light skirmishers into a single flexible fighting force, neither purely Greek nor purely Indian."
 nd_yav_syncretic_markets: "Marchés syncrétiques"
 nd_yav_syncretic_markets_desc: "Marketplaces where Greek commercial law meets Indian trading customs, overseen by agoranomoi who enforce fair weights and measures in a bilingual trading environment."
 nd_yav_dharma_statecraft: "Dharma de l'art de gouverner"
 nd_yav_dharma_statecraft_desc: "Buddhist ethical principles applied to Hellenistic governance, a philosophy of just rule that draws on both Ashoka's edicts and Aristotle's Politics."
 nd_yav_taxila_tradition: "Tradition de l'Université de Taxila"
 nd_yav_taxila_tradition_desc: "L'ancienne université de Taxila, où des universitaires de toute l'Asie se réunissaient pour étudier la médecine, les mathématiques et la philosophie, est relancée en tant que cœur intellectuel de l'État de Yavana."
 nd_yav_hippotoxotai_tradition: "Tradition des Hippotoxotai"
 nd_yav_hippotoxotai_tradition_desc: "Archers à cheval combinant l'équitation grecque avec les techniques d'arc composite de la steppe d'Asie centrale, fournissant le bras de cavalerie rapide de l'armée de Yavana."
 nd_yav_greco_buddhist_patronage: "Patronage gréco-bouddhiste"
 nd_yav_greco_buddhist_patronage_desc: "Syncrétisme religieux parrainé par l'État, où les divinités grecques sont identifiées avec des figures bouddhistes et hindoues, et où les temples servent les fidèles de plusieurs traditions sous un même toit."
 nd_yav_imperial_administration: "Administration impériale"
 nd_yav_imperial_administration_desc: "La bureaucratie hellénistique centralisée des éparches, des dioiketai et des hyparchoi s'est adaptée pour gouverner un empire sous-continental, collectant des impôts et rendant la justice dans deux langues."
 nd_yav_silk_road_entrepot: "Entrepôt de la Route de la Soie"
 nd_yav_silk_road_entrepot_desc: "The Yavana Empire sits at the junction of overland routes from China, sea routes from the Mediterranean, and river routes down the Indus, a position of extraordinary commercial power.\n\n#italic Available in: $nd_yav_bilingual_mint$#!"
 nd_yav_syntagma_reform: "Réforme du Syntagme"
 nd_yav_syntagma_reform_desc: "Le syntagme (une unité tactique de la phalange réformée) devient la base d’une armée professionnelle permanente, entraînée selon les normes hellénistiques et payée par le trésor impérial."
 nd_yav_universal_dharma: "Dharma universel"
 nd_yav_universal_dharma_desc: "Une philosophie mature de tolérance religieuse enracinée dans la compassion bouddhiste et le cosmopolitisme grec, offrant citoyenneté et dignité à tous les peuples, quelle que soit leur croyance."
 nd_yav_standing_army: "Réformes de l'armée permanente"
 nd_yav_standing_army_desc: "La transition d'une guerre de levées saisonnières à une force professionnelle permanente maintenue toute l'année, suivant le modèle hellénistique de soldats rémunérés devant leur loyauté envers l'État."
 nd_yav_gandharan_renaissance: "Renaissance gandharienne"
 nd_yav_gandharan_renaissance_desc: "Une floraison de production artistique alors que les techniques du Gandharan sont appliquées à la sculpture, à la peinture, à la ferronnerie et à l'architecture à travers tout l'empire."
 nd_yav_grand_vihara_network: "Réseau Grand Vihara"
 nd_yav_grand_vihara_network_desc: "A network of monastic universities spanning the empire, where monks copy texts, teach mathematics and medicine, and serve as the intellectual backbone of the state.\n\n#italic Unlocks: $nd_yav_bark_scriptorium$#!"
 nd_yav_enlightened_syncretism: "Syncrétisme éclairé"
 nd_yav_enlightened_syncretism_desc: "The philosophical culmination of centuries of Greco-Buddhist dialogue, a mature intellectual tradition that draws freely on Greek, Indian, and Central Asian thought."
 nd_yav_modern_phalanx: "Phalange moderne"
 nd_yav_modern_phalanx_desc: "The ancient phalanx tradition evolves into disciplined line infantry capable of volley fire, maintaining the Hellenistic emphasis on formation discipline in the age of gunpowder.\n\n#italic Unlocks: $a_nd_yav_line_phalangites$#!"
 nd_yav_industrial_crossroads: "Carrefour Industriel"
 nd_yav_industrial_crossroads_desc: "La position géographique qui faisait autrefois de l’État de Yavana un carrefour commercial stimule désormais le développement industriel, alors que les matières premières affluent de toutes les directions."
 nd_yav_yavana_legacy: "L'héritage de Yavana"
 nd_yav_yavana_legacy_desc: "The enduring legacy of the Indo-Greek synthesis, a civilization that proved East and West could merge into something greater than either alone.\n\n#italic Available in: $nd_yav_bark_scriptorium$#!"
 a_nd_yav_pezhetairoi: "Pejetairoi"
 a_nd_yav_pezhetairoi_desc: "Infanterie lourde armée de la pique sarissa, renouant avec la tradition de la phalange macédonienne qui a conquis le monde connu sous Alexandre."
 a_nd_yav_gajasena: "Gajasena"
 a_nd_yav_gajasena_desc: "Des éléphants de guerre blindés portant des tours de combat, combinant l'élevage d'éléphants indiens avec l'ingénierie militaire grecque pour créer l'arme la plus terrifiante sur le champ de bataille."
 a_nd_yav_thureophoroi: "Thuréophores"
 a_nd_yav_thureophoroi_desc: "Infanterie moyenne polyvalente portant le bouclier thureos et armée de javelots et d'épées, entraînée à combattre à la fois dans la formation grecque et dans les tactiques d'escarmouche indiennes."
 a_nd_yav_hippotoxotai: "Hippotoxotai"
 a_nd_yav_hippotoxotai_desc: "Archers à cheval combinant la discipline de la cavalerie grecque avec les techniques d'arc composite d'Asie centrale, raiders rapides qui harcèlent les flancs ennemis et filtrent l'avancée de l'armée."
 a_nd_yav_syntagma_guard: "Garde Syntagma"
 a_nd_yav_syntagma_guard_desc: "Infanterie lourde professionnelle d'élite de la phalange réformée, soldats rémunérés entraînés à combattre comme un seul organisme dans la formation syntagma."
 a_nd_yav_line_phalangites: "Phalangites of the Line"
 a_nd_yav_line_phalangites_desc: "Musket infantry drilled in the close files of the old phalanx. The line holds under fire and volleys as one body, though it is slow to change front."
 nd_yav_gandhara_vihara: "Gandhara Vihara"
 nd_yav_gandhara_vihara_desc: "Un monastère bouddhiste construit dans le style architectural gréco-bouddhiste, avec des colonnes corinthiennes encadrant des salles de méditation et des sculpteurs formés en grec créant des images du Bouddha."
 nd_yav_bilingual_mint: "Menthe Yavana"
 nd_yav_bilingual_mint_desc: "Un atelier de monnaie frappant les pièces de monnaie bilingues distinctives de l'État de Yavana : légendes grecques sur une face, Kharosthi sur l'autre."
 nd_yav_hastisala: "Hastisala"
 nd_yav_hastisala_desc: "Un complexe d'entraînement et d'écurie d'éléphants où les cornacs et les bêtes sont entraînés ensemble aux arts de la guerre, entretenant ainsi le corps d'éléphants de Yavana."
 nd_yav_gymnasium: "Gymnase"
 nd_yav_gymnasium_desc: "Un terrain d'entraînement hellénistique où les citoyens exercent leur corps et leur esprit, étudiant la philosophie et la rhétorique parallèlement à la lutte et au lancer de javelot."
 nd_yav_agora_bazaar: "Agora-Bazar"
 nd_yav_agora_bazaar_desc: "Un marché syncrétique où les pratiques commerciales grecques et les coutumes commerciales indiennes se confondent sous l'œil vigilant d'agents de marché bilingues."
 nd_yav_bark_scriptorium: "Birch Bark Scriptorium"
 nd_yav_bark_scriptorium_desc: "A copying house of the vihara network, where monks write sutras and Greek treatises in Kharosthi and Greek on rolls of birch bark, as the scribes of Gandhara did."
 nd_yav_bark_manuscripts: "Bark Manuscripts"
 nd_yav_bark_manuscripts_desc: "Paper, birch bark and ink are made into manuscripts."
 nd_yav_philosophical_press: "Philosophical Press"
 nd_yav_philosophical_press_desc: "Lead type and presses print the texts of Greco-Buddhist philosophy in two scripts."
 nd_yav_vihara_endowment: "Dotation Vihara"
 nd_yav_vihara_endowment_desc: "Des dons réguliers d'encens, de tissus et de riz soutiennent les moines et leurs efforts scientifiques."
 nd_yav_coin_striking: "Frappe de pièces"
 nd_yav_coin_striking_desc: "La frappe de pièces de monnaie bilingues en cuivre et en argent, une tradition indo-grecque vieille de plusieurs siècles facilitant le commerce interculturel."
 nd_yav_mint_operations: "Opérations de la Monnaie"
 nd_yav_mint_operations_desc: "Outils, métaux bruts et fournitures administratives nécessaires au fonctionnement de la Monnaie de Yavana."
 nd_yav_elephant_upkeep: "Entretien du corps des éléphants"
 nd_yav_elephant_upkeep_desc: "Les éléphants de guerre ont besoin de grandes quantités de nourriture, de bois spécialisé pour la construction des howdahs et d'un approvisionnement constant en animaux de remplacement."
 nd_yav_gymnasium_operations: "Opérations du gymnase"
 nd_yav_gymnasium_operations_desc: "Du papier pour les textes philosophiques, du tissu pour les vêtements de sport et de l'huile d'olive pour la pratique traditionnelle grecque de l'onction."
 nd_yav_market_operations: "Opérations de marché"
 nd_yav_market_operations_desc: "Fournitures en tissu, poterie et papier pour le marché syncrétique animé."
 nd_yav_destiny: "Récupérer la Bactriane"
 nd_yav_destiny_desc: "L’empire Yavana doit récupérer l’ancien cœur gréco-bactrien au-delà de l’Hindu Kush (Kaboul, Kandahar et Ghazni) pour restaurer toute l’étendue de l’héritage oriental d’Alexandre."
 nd_yav_dest_bactrian_march: "La marche bactrienne"
 nd_yav_dest_bactrian_march_desc: "Push the sarissa-armed phalanx northward to Balkh and Herat, the great cities of ancient Bactria, and to Termez, where a Greek fortress once kept the crossing of the Oxus."
 nd_yav_dest_sarissa_empire: "L'Empire Sarissa"
 nd_yav_dest_sarissa_empire_desc: "Carry the Hellenistic military tradition to Samarkand and to Khujand, the farthest of Alexander's cities, in the north and to Delhi in the east, forging a continental empire held together by the unbreakable phalanx."
 nd_yav_dest_alexanders_dream: "Le rêve d'Alexandre"
 nd_yav_dest_alexanders_dream_desc: "Reach the Ganges at Varanasi and Patna, the goal Alexander himself was denied, and take Ayodhya, the Saketa that the Yavana kings once besieged. With a full treasury, the conquest he began is completed."
 nd_yav_dest_bamiyan_light: "La Lumière de Bamiyan"
 nd_yav_dest_bamiyan_light_desc: "Secure the great Buddha statues of Bamiyan, fill the treasury and endow three viharas of the Gandharan kind, to build a civilization worthy of both Greek philosophy and Buddhist wisdom."
 nd_yav_dest_silk_dharma: "Le Dharma de la Soie"
 nd_yav_dest_silk_dharma_desc: "Draw silk into the capital's markets and rebuild Taxila, the old city of learning near Rawalpindi, until the Yavana realm becomes the intellectual and commercial crossroads of Asia."
 nd_yav_dest_universal_light: "La lumière universelle"
 nd_yav_dest_universal_light_desc: "Extend Greco-Buddhist learning to Mathura and Ujjain, the sacred cities of the Gangetic heartland. Raise Mathura, city of the sculptors, to twice its size and embrace modern banking to fund the greatest syncretic civilization in history."
 nd_yav.5.t: "Le retour en Bactriane"
 nd_yav.5.d: "Our armies have crossed the Hindu Kush and planted the Yavana standard in the ancient cities of Bactria. Kabul, where Alexander himself once camped. Kandahar, which bears his name in corrupted form. Ghazni, gateway to the Iranian plateau.\n\nFor the first time since the fall of the Greco-Bactrian kingdom, a single Hellenistic power commands both the Indus valley and the Afghan highlands. The mountain passes that connect India to Central Asia are ours. The trade routes that carried Greek culture eastward and Buddhist wisdom westward now flow through our customs houses.\n\nThis is only the beginning."
 nd_yav.5.a: "Les montagnes répondent une fois de plus à la phalange"
 nd_yav.6.t: "La marche bactrienne"
 nd_yav.6.d: "Balkh, the ancient capital of Bactria (the 'mother of cities' as the Arabs called it), flies the Yavana banner. Herat, jewel of Khorasan, has fallen to our phalanx. The sarissa-armed infantry that first appeared on these plains two millennia ago under Alexander have returned.\n\nOur strategoi govern provinces that stretch from the Indus delta to the gates of Persia. The combined arms doctrine of elephant, cavalry, and phalanx has proven itself against every foe. In the bazaars of Balkh, merchants strike bilingual coins bearing Greek legends and Kharosthi script.\n\nThe reconquest of Greater Bactria is complete. What remains is to decide how far the phalanx shall march."
 nd_yav.6.a: "Laissons la sarisse porter notre étendard encore plus loin"
 nd_yav.7.t: "L'Empire Sarissa"
 nd_yav.7.d: "From Samarkand's fabled markets to the walls of Delhi, the Yavana phalanx has carved an empire that dwarfs anything the original Indo-Greek kings achieved. Menander would weep with pride.\n\nOur army is the finest in Asia: disciplined infantry, screening horse archers, thundering elephant charges, all coordinated by strategoi trained in the combined arms tradition. But even the greatest army requires a doctrine for its continued growth.\n\nShall we expand our forces through mass levies and rapid maneuver, overwhelming our enemies with numbers and speed? Or shall we invest in professional training and defensive fortifications, making every soldier worth ten of the enemy?"
 nd_yav.7.a: "Inondez le champ de sarisses et d'éléphants"
 nd_yav.7.b: "Entraînez chaque soldat à combattre avec une discipline de fer"
 nd_yav.8.t: "Le rêve d'Alexandre réalisé"
 nd_yav.8.d: "The Ganges. Alexander wept because he had no more worlds to conquer, or so the legend says. In truth, his army mutinied at the Hyphasis, refusing to march further east. What Alexander could not achieve, the Yavana Empire has accomplished.\n\nOur banners fly over Varanasi, holiest city of the Hindus, and Patna, the ancient Pataliputra where Chandragupta Maurya once received Seleucid ambassadors. The sarissa and the war elephant have carried Greek arms to the heart of India.\n\nThis is the apex of Hellenistic military power. How shall we cement this achievement for eternity?"
 nd_yav.8.a: "Nos campagnes ne cesseront jamais"
 nd_yav.8.b: "Nous dicterons nos conditions au monde"
 nd_yav.9.t: "La Lumière de Bamiyan"
 nd_yav.9.d: "The great Buddhas of Bamiyan gaze down upon our soldiers with serene compassion as the Yavana standard is raised before them. These colossal statues, carved from the living rock of the Hindu Kush, represent everything our civilization aspires to be: the marriage of Greek artistic mastery and Buddhist spiritual depth.\n\nOur scholars have established a new vihara in Bamiyan's shadow, where monks debate philosophy in Greek and Prakrit, and sculptors trained in the Gandharan tradition carve images that will inspire pilgrims for centuries to come.\n\nThe path of dharma stretches onward."
 nd_yav.9.a: "Que la lumière de la sagesse illumine toutes les terres"
 nd_yav.10.t: "Le Dharma de la Soie"
 nd_yav.10.d: "Caravans bearing Chinese silk arrive at our capital's markets alongside merchants carrying Roman glass, Central Asian horses, and Indian spices. The Yavana Empire sits at the crossroads of the world's greatest trade routes, and our prosperity reflects it.\n\nOur cities grow. Our scholars multiply. The viharas and gymnasia that line our roads produce monks, philosophers, physicians, and merchants in equal measure. But prosperity creates its own choices.\n\nShall we invest this wealth in the material wellbeing of our subjects, reducing unrest and building a contented populace? Or shall we use it to draw scholars and diplomats from across the world, making our court the most cosmopolitan in Asia?"
 nd_yav.10.a: "Laissons notre peuple prospérer sous le dharma"
 nd_yav.10.b: "Que les érudits du monde se réunissent à notre cour"
 nd_yav.11.t: "La lumière universelle"
 nd_yav.11.d: "Mathura, sacred to both Buddhists and Hindus, and Ujjain, the ancient astronomical capital of India, both now shelter Yavana universities where Greek logic meets Buddhist meditation and Hindu mathematics. Our empire has become what no other civilization in history has achieved: a living synthesis of East and West.\n\nScholars travel from the Mediterranean to study at our academies. Our bilingual texts are copied in monasteries from Sri Lanka to Sogdia. The Gandharan art tradition has spread the image of the Buddha across half the world. And in our courts, philosophers of every school debate freely under the protection of a state that values wisdom above dogma.\n\nThis is the culmination of the Yavana vision. How shall we preserve it?"
 nd_yav.11.a: "Grâce à une érudition qui survit aux empires"
 nd_yav.11.b: "Par une tolérance qui embrasse toutes les confessions"
 STATIC_MODIFIER_NAME_nd_yav_dest_sarissa_tide: "Marée des Sarissas"
 STATIC_MODIFIER_DESC_nd_yav_dest_sarissa_tide: "Les prélèvements massifs et les manœuvres rapides submergent nos ennemis sous le poids de la phalange Yavana."
 STATIC_MODIFIER_NAME_nd_yav_dest_iron_discipline: "Discipline de fer"
 STATIC_MODIFIER_DESC_nd_yav_dest_iron_discipline: "La formation professionnelle et les positions fortifiées font que chaque soldat Yavana vaut dix de l'ennemi."
 STATIC_MODIFIER_NAME_nd_yav_dest_phalanx_ascendant: "Ascendant de Phalange"
 STATIC_MODIFIER_DESC_nd_yav_dest_phalanx_ascendant: "La machine militaire Yavana fonctionne avec une efficacité implacable, lançant des campagnes plus rapidement et les soutenant plus longtemps que n’importe quel rival."
 STATIC_MODIFIER_NAME_nd_yav_dest_world_conqueror: "Conquérant du monde"
 STATIC_MODIFIER_DESC_nd_yav_dest_world_conqueror: "L’Empire Yavana dicte ses conditions au monde depuis une position de suprématie militaire écrasante."
 STATIC_MODIFIER_NAME_nd_yav_dest_dharma_prosperity: "Dharma de la prospérité"
 STATIC_MODIFIER_DESC_nd_yav_dest_dharma_prosperity: "L’éthique bouddhiste du contentement et de la bonne gouvernance réduit les troubles et le séparatisme à travers l’empire."
 STATIC_MODIFIER_NAME_nd_yav_dest_cosmopolitan_court: "Cour cosmopolite"
 STATIC_MODIFIER_DESC_nd_yav_dest_cosmopolitan_court: "La cour de Yavana attire des érudits et des diplomates du monde connu, intégrant les États vassaux grâce au magnétisme culturel."
 STATIC_MODIFIER_NAME_nd_yav_dest_living_synthesis: "Synthèse vivante"
 STATIC_MODIFIER_DESC_nd_yav_dest_living_synthesis: "La fusion des traditions intellectuelles grecques et bouddhistes produit une civilisation qui attire les plus grands esprits du monde."
 STATIC_MODIFIER_NAME_nd_yav_dest_tolerant_empire: "Empire tolérant"
 STATIC_MODIFIER_DESC_nd_yav_dest_tolerant_empire: "Un État fondé sur la tolérance religieuse et la sagesse syncrétique, où toutes les confessions sont les bienvenues et où aucune n’est persécutée."
 nd_yav_strategos_akademia: "Académie Stratégos"
 nd_yav_strategos_akademia_desc: "Une académie militaire d'élite où les commandants sont formés à la doctrine interarmes de la phalange, de l'éléphant et de la cavalerie, produisant des stratèges dignes de l'héritage d'Alexandre."
 nd_yav_mahasanghika_university: "Université Mahasanghika"
 nd_yav_mahasanghika_university_desc: "Un grand centre d'apprentissage syncrétique où la philosophie grecque, la sagesse bouddhiste et les mathématiques hindoues sont étudiées ensemble, produisant des érudits qui relient les traditions intellectuelles de l'Orient et de l'Occident."
 nd_yav_akademia_training: "Formation académique"
 nd_yav_akademia_training_desc: "Armes, fortifications en pierre, armures de cuir et outils pour former la prochaine génération de commandants militaires Yavana."
 nd_yav_university_scholarship: "Bourse universitaire"
 nd_yav_university_scholarship_desc: "Le papier pour les manuscrits, les colorants pour l’enluminure et l’encens pour la méditation soutiennent le travail scientifique de l’université."

 # ===== BUREAUCRACIES =====
 yav_eparchia_strategoi_bureaucracy: "Éparchie Stratège"
 yav_eparchia_strategoi_bureaucracy_desc: "The Indo-Greek satrapal governorship adapted from Achaemenid and Seleucid practice. Each eparchy was led by a strategos, a military governor who combined Hellenistic command authority with civil revenue powers. The Shinkot reliquary inscription names the meridarch Theodorus, and the Taxila copper-plate of Patika confirms a strategos serving under Indo-Greek hegemony. The institution centralizes royal authority through standing provincial commands at the cost of the hipparch landed cavalry caste."
 yav_sangha_patronage_bureaucracy: "Patronage de la Sangha"
 yav_sangha_patronage_bureaucracy_desc: "L’appareil de dotation royale canalisant les revenus de la couronne vers l’ordre bouddhiste. Le patronage de Ménandre Ier envers la sangha est enregistré dans le Milindapanha et physiquement attesté dans les inscriptions des reliquaires Shinkot, Bajaur et Bimaran, où les officiers indo-grecs et la maison du roi consacrent des stupas et des cadeaux monastiques. Empruntant le bureau du dhamma-mahamatra d'Ashokan, l'appareil place des officiers royaux permanents au sein des viharas gréco-bouddhistes pour administrer les dotations et superviser la discipline."
 yav_polis_asty_council_bureaucracy: "Conseil Polis-Asty"
 yav_polis_asty_council_bureaucracy_desc: "Le gouvernement civique hellénistique s'appliquait aux villes indo-grecques. Sagala, Taxila et Pushkalavati ont conservé la forme grecque de la polis : un conseil (boule) de citoyens, d'archontes et d'astynomoi régulant les marchés, les tribunaux et les milices citoyennes sous l'hégémonie royale. Les monnaies civiques frappaient des tétradrachmes de poids attique avec des marques de ville, confirmant l'autorité de l'entreprise sur la monnaie. Le pouvoir afflue vers le corps marchand urbain, affaiblissant structurellement l’aristocratie de cavalerie rurale."
 yav_bilingual_chancery_bureaucracy: "Chancellerie bilingue"
 yav_bilingual_chancery_bureaucracy_desc: "Le secrétariat à double écriture qui a produit des textes officiels grecs et karoshthi-prakrit parallèles - sur les légendes des pièces de monnaie, les décrets royaux, les dédicaces de reliquaires et les comptes de revenus. Le pilier Héliodore à Besnagar, l'inscription Reh et les légendes avers et revers de chaque tétradrachme indo-grec documentent une chancellerie en activité dont les scribes étaient formés à deux écritures. L’institution favorise l’alphabétisation à la fois dans les villes de garnison grecques et dans les campagnes indiennes, mais ses coûts incombent à la classe marchande urbaine qui en assure le personnel."

 AUTO_MODIFIER_NAME_nd_yav_bureaucracy_authority: "Appareil administratif permanent"
 AUTO_MODIFIER_DESC_nd_yav_bureaucracy_authority: "The revived Yavana state inherits a layered Hellenistic-Indian institutional substrate: satrapal eparchies, civic poleis, royal patronage of the sangha, and the bilingual chancery of the Indo-Greek kings. This permanent administrative foundation grants two bureaucracy slots, enough for two of its four institutions."
