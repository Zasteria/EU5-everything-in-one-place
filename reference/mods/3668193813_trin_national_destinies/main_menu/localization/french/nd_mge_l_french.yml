l_french:
 STATIC_MODIFIER_NAME_nd_way_of_the_eternal_blue_sky: "Chemin du ciel bleu éternel"
 STATIC_MODIFIER_DESC_nd_way_of_the_eternal_blue_sky: "Sous la bannière du Ciel bleu éternel, les hordes mongoles chevauchent comme une seule personne. Chaque horizon est une frontière, chaque steppe une route pour les cavaliers du Khan. Le monde tremble devant les guerriers qui dorment en selle et les flèches lâchées au galop."
 STATIC_MODIFIER_NAME_nd_crown_of_the_world: "Couronne du monde"
 STATIC_MODIFIER_DESC_nd_crown_of_the_world: "L'Empire mongol est plus qu'une conquête : c'est un pont entre les civilisations. Du Pacifique à la Méditerranée, les marchands voyagent sous la protection du Khan, les érudits échangent leurs connaissances à travers les continents et cent langues parlent sur les marchés du Karakorum."
 nd_mge.1.t: "Restauration de l'Empire mongol"
 nd_mge.1.d: "The dream of Genghis Khan lives again. From the ruins of fragmented khanates, a single ruler has united the steppe peoples and claimed dominion over the lands between the four seas. The kurultai has spoken, and the world's largest empire is reborn.\n\nBut the question remains: what kind of empire shall this be? Will we follow the path of eternal war, riding as our ancestors did beneath the Eternal Blue Sky, bringing all nations under the hooves of our cavalry? Or shall we build an empire of law and commerce, where the Silk Road flourishes under Mongol peace, and every culture finds a place in the Khan's court?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mge.1.a: "Nous roulons sous le ciel bleu éternel !"
 nd_mge.1.b: "Nous porterons la couronne du monde."
 STATIC_MODIFIER_NAME_nd_mge_yasa_proclaimed: "Le Grand Yasa proclamé"
 STATIC_MODIFIER_DESC_nd_mge_yasa_proclaimed: "Le Khan a proclamé le Grand Yasa dans tous les pays, établissant un code universel qui lie les nobles aux roturiers, les Mongols aux étrangers."
 nd_mge.2.t: "Le Grand Yasa"
 nd_mge.2.d: "The Khan has decreed that the Great Yasa, the supreme law code first proclaimed by Genghis Khan himself, shall be enforced across all territories of the empire. This code, which prescribes absolute loyalty to the Khan, severe punishment for theft and adultery, religious tolerance, and the inviolability of ambassadors, forms the legal backbone of Mongol rule.\n\nUnder the Yasa, there is no distinction between the law that governs a Mongol noble and that which governs a Persian merchant or a Chinese scholar. All subjects are equal before the Khan's justice. This radical universalism has earned both admiration and fear: for the penalties are harsh, but the order they bring is undeniable."
 nd_mge.2.a: "Que les Yasa mettent de l'ordre dans tous les pays."
 nd_mge.2.b: "Le Yasa sera renforcé par l'épée."
 STATIC_MODIFIER_NAME_nd_mge_pax_mongolica_flourishing: "Pax Mongolica florissante"
 STATIC_MODIFIER_DESC_nd_mge_pax_mongolica_flourishing: "Sous la paix imposée par la cavalerie mongole, le plus grand réseau commercial de l’histoire s’étend de Pékin à Bagdad. Les marchands voyagent en toute sécurité et les marchandises circulent librement le long de la Route de la Soie."
 nd_mge.3.t: "La paix des Mongols"
 nd_mge.3.d: "For the first time in history, a single power controls the entire length of the Silk Road. Caravans laden with silk, spices, porcelain, and precious metals travel from the China Sea to the shores of the Mediterranean without changing hands or paying rival tolls. Genoese merchants deal directly with Chinese traders, Persian astronomers correspond with Mongol princes, and technologies flow in every direction.\n\nThe ortaq merchant partnerships, financed by Mongol princes and staffed by Muslim and Uighur traders, have created a commercial network of unprecedented scale. Paper money circulates alongside silver, and the Yam postal system carries not only official dispatches but mercantile correspondence across the vast reaches of the empire."
 nd_mge.3.a: "Les routes du Khan apportent la prospérité à tous."
 nd_mge.3.b: "Laissez les caravanes rendre hommage pour un passage en toute sécurité."
 nd_mge.4.t: "Le Keshig : Épée du Khan"
 nd_mge.4.d: "The Keshig, the Khan's imperial guard, represents the finest warriors of the Mongol Empire. Originally numbering just seventy day-guards and eighty night-guards under Genghis Khan, the Keshig has grown into a force of ten thousand elite soldiers, each handpicked from the sons of generals and tribal chiefs.\n\nA member of the Keshig outranks every other military officer in the empire, save only the Khan himself. They serve as the Khan's personal bodyguard, his household servants, his administrative core, and his shock troops in battle. To serve in the Keshig is the highest honor a warrior can achieve. And to fail in that service means death."
 nd_mge.4.a: "La garde Keshig ne faiblira jamais."
 STATIC_MODIFIER_NAME_nd_mge_thunder_of_the_khan: "Tonnerre du Khan"
 STATIC_MODIFIER_DESC_nd_mge_thunder_of_the_khan: "Les ingénieurs mongols maîtrisent les armes à poudre, adaptant les technologies chinoises et musulmanes dans un arsenal dévastateur qui combine la mobilité de la steppe avec la puissance destructrice des tirs de canon."
 nd_mge.5.t: "Tonnerre sur la steppe"
 nd_mge.5.d: "The Mongol Empire has always excelled at absorbing the military technologies of conquered peoples. Chinese engineers built our first siege weapons; Muslim artisans perfected our trebuchets. Now the empire turns its attention to the newest revolution in warfare: gunpowder firearms.\n\nMongol smiths and captured engineers have developed handheld firearms suited to steppe warfare: lighter than European muskets, carried by mounted infantry who can dismount to deliver devastating volleys before remounting and withdrawing. The thunder of the Khan's guns echoes across the plains, heralding a new age of Mongol military power."
 nd_mge.5.a: "Que le tonnerre de nos canons secoue la terre !"
 nd_mge.5.b: "Partagez ces connaissances pour la prospérité du royaume."
 nd_mge_steppe_horsemanship: "Équitation des steppes"
 nd_mge_steppe_horsemanship_desc: "Le guerrier mongol est né en selle. Les enfants apprennent à monter à cheval avant de savoir marcher, et tout berger est un cavalier potentiel."
 nd_mge_composite_bow_craft: "Artisanat d'arc composite"
 nd_mge_composite_bow_craft_desc: "L'arc composite mongol (fabriqué à partir de corne, de tendon et de bois) peut délivrer une force mortelle à des distances supérieures à 400 mètres, donnant aux archers montés un avantage décisif."
 nd_mge_great_yasa: "Le Grand Yasa"
 nd_mge_great_yasa_desc: "Le code juridique suprême de Gengis Khan lie tous les sujets de manière égale, établissant un ordre universel sur les vastes territoires de l'empire."
 nd_mge_noyan_command: "Commandement Noyan"
 nd_mge_noyan_command_desc: "Les Noyan, commandants de milliers de personnes, forment le corps des officiers de l'armée mongole, dirigeant les tumens avec une discipline qui transcende les loyautés tribales."
 nd_mge_felt_ger_encampments: "Campements de Ger en feutre"
 nd_mge_felt_ger_encampments_desc: "Les tentes mobiles en feutre, les ger, permettent aux armées mongoles d'établir et de déplacer des camps avec une rapidité remarquable, garantissant ainsi que les troupes restent approvisionnées même au plus profond du territoire ennemi."
 nd_mge_wolf_hunt_tactics: "Tactiques de chasse au loup"
 nd_mge_wolf_hunt_tactics_desc: "Le nerge, la grande chasse, entraîne les guerriers mongols à l'art de l'encerclement et de la poursuite coordonnée, des tactiques qui se traduisent directement sur le champ de bataille."
 nd_mge_ortaq_partnerships: "Partenariats Ortaq"
 nd_mge_ortaq_partnerships_desc: "Les princes mongols investissent des capitaux dans des partenariats marchands avec des commerçants musulmans et ouïghours, créant ainsi un réseau commercial qui s’étend à l’ensemble de l’empire."
 nd_mge_tumen_discipline: "Discipline Tumen"
 nd_mge_tumen_discipline_desc: "Le tumen, une unité de dix mille personnes, opère avec une précision coordonnée, chaque subdivision répondant instantanément aux drapeaux de signalisation et aux battements de tambours sur le champ de bataille."
 nd_mge_mongol_siege_corps: "Corps de siège mongol"
 nd_mge_mongol_siege_corps_desc: "Les commandants mongols recrutent des ingénieurs chinois et musulmans pour construire des trébuchets, des béliers et d'autres engins de siège, transformant ainsi une armée de cavalerie en une force capable de réduire n'importe quelle fortification."
 nd_mge_darughachi_governors: "Gouverneurs Darughachi"
 nd_mge_darughachi_governors_desc: "Les darughachi, gouverneurs nommés par les Mongols, administrent les territoires conquis, effectuent des recensements, collectent des impôts et maintiennent l'autorité du Khan auprès de diverses populations."
 nd_mge_silk_road_protection: "Protection de la Route de la Soie"
 nd_mge_silk_road_protection_desc: "Mongol cavalry patrols ensure the safety of Silk Road caravans, and toll stations collect revenue while guaranteeing merchants safe passage through the empire's vast territories."
 nd_mge_kurultai_assembly: "Assemblée Kurultaï"
 nd_mge_kurultai_assembly_desc: "Le Kurultai, la grande assemblée des chefs et généraux mongols, délibère sur les questions de succession, de guerre et de droit, ce qui confère une légitimité au règne du Khan."
 nd_mge_pax_mongolica_trade: "Pax Mongolica Commerce"
 nd_mge_pax_mongolica_trade_desc: "Under Mongol peace, the Silk Road reaches its apex. Goods, technologies, and ideas flow freely between East and West across the largest contiguous land empire in history."
 nd_mge_religious_tolerance: "Tolérance religieuse"
 nd_mge_religious_tolerance_desc: "L'Empire mongol accorde la liberté de culte à tous les sujets. Les communautés bouddhistes, musulmanes, chrétiennes et tengristes coexistent sous la protection du Khan."
 nd_mge_counterweight_trebuchet: "Trébuchet à contrepoids"
 nd_mge_counterweight_trebuchet_desc: "Les ingénieurs persans Ismail et Al-aud-Din construisent des trébuchets à contrepoids capables de lancer des projectiles de 300 kilogrammes sur 500 mètres, révolutionnant ainsi la guerre de siège mongole."
 nd_mge_paper_currency: "Papier-monnaie"
 nd_mge_paper_currency_desc: "L'Empire mongol émet des billets de banque en papier garantis par l'autorité impériale, facilitant ainsi le commerce entre les territoires où l'argent et l'or sont rares."
 nd_mge_horse_relay_posts: "Postes de relais équestres"
 nd_mge_horse_relay_posts_desc: "Les stations relais Ortoo, espacées tous les trente milles à travers l’empire, permettent aux messages de parcourir toute la longueur de la Route de la Soie en quelques jours."
 nd_mge_keshig_guard: "Garde Keshig"
 nd_mge_keshig_guard_desc: "Les Keshig, dix mille guerriers d'élite choisis parmi les fils de généraux et de chefs, servent de garde personnelle, de maison et de force militaire la plus fiable du Khan."
 nd_mge_mangudai_tactics: "Tactiques Mangudai"
 nd_mge_mangudai_tactics_desc: "Les mangudai, tirailleurs spécialisés de la cavalerie légère, feignent de battre en retraite pour attirer les ennemis dans une embuscade, puis tournent et lancent des barrages de flèches dévastateurs à courte portée."
 nd_mge_silk_road_caravanserai: "Caravansérail de la Route de la Soie"
 nd_mge_silk_road_caravanserai_desc: "De grandes auberges en bord de route offrent abri, nourriture et écuries aux marchands voyageant sur la Route de la Soie, soutenant ainsi le vaste réseau commercial de l'empire."
 nd_mge_imperial_armory: "Armurerie Impériale"
 nd_mge_imperial_armory_desc: "Centralized weapon workshops mass-produce standardized arms and armor for the Mongol military, ensuring every warrior is equipped to the Khan's specifications.\n\n#italic Available in: $nd_mge_bow_workshop$#!"
 nd_mge_gunpowder_adaptation: "Adaptation de la poudre à canon"
 nd_mge_gunpowder_adaptation_desc: "Les ingénieurs mongols adaptent les armes à poudre chinoises à la guerre dans les steppes, développant des armes à feu plus légères adaptées à la mobilité de l'infanterie à cheval."
 nd_mge_universal_chronicle: "Chronique universelle"
 nd_mge_universal_chronicle_desc: "Les historiens impériaux compilent des chroniques complètes de chaque peuple conquis, préservant les connaissances de la Chine à la Perse dans la tradition du Compendium des Chroniques de Rashid al-Din."
 nd_mge_eternal_empire: "Empire éternel"
 nd_mge_eternal_empire_desc: "L'Empire mongol préserve et transmet les réalisations culturelles de tous ses peuples, créant un héritage qui transcende toute civilisation."
 nd_mge_steppe_modernization: "Modernisation des steppes"
 nd_mge_steppe_modernization_desc: "L'empire adapte les techniques de production modernes à l'immensité de ses territoires, combinant capacité industrielle et traditions logistiques de la steppe."
 nd_mge_legacy_of_conquest: "L'héritage de la conquête"
 nd_mge_legacy_of_conquest_desc: "Les traditions martiales de Gengis Khan perdurent jusqu’à l’ère moderne. La cavalerie mongole, bien que modifiée par des siècles d'évolution, reste une force redoutable sur n'importe quel champ de bataille."
 a_nd_mge_steppe_horse_archer: "Archer à cheval des steppes"
 a_nd_mge_steppe_horse_archer_desc: "Mounted archers raised from the Mongol steppe, trained from childhood in the saddle. Every man of the household rides, each with his string of remounts, and they rain arrows on enemies while remaining frustratingly out of reach."
 a_nd_mge_wolf_raider: "Pillard de loups"
 a_nd_mge_wolf_raider_desc: "Cavalerie légère entraînée au nerge, la grande chasse, spécialisée dans l'encerclement et la poursuite. Ils frappent avec la férocité coordonnée d’une meute de loups."
 a_nd_mge_tumen_cavalry: "Cavalerie lourde de Tumen"
 a_nd_mge_tumen_cavalry_desc: "Le cœur blindé d'un tumen mongol : cavalerie lourde équipée de lances, de sabres et d'armures lamellaires, capable de délivrer des charges de choc dévastatrices."
 a_nd_mge_siege_engineer: "Ingénieur de siège mongol"
 a_nd_mge_siege_engineer_desc: "Des ingénieurs chinois et musulmans recrutés au service des Mongols, exploitant des trébuchets et autres engins de siège qui réduisent même les fortifications les plus puissantes en ruines."
 a_nd_mge_counterweight_trebuchet: "Trébuchet à contrepoids"
 a_nd_mge_counterweight_trebuchet_desc: "Un trébuchet à contrepoids articulé conçu par des ingénieurs perses, capable de lancer des projectiles massifs avec une précision dévastatrice sur de grandes distances."
 a_nd_mge_keshig: "Garde Keshig"
 a_nd_mge_keshig_desc: "La garde impériale d'élite du Khan : dix mille guerriers d'une loyauté avérée, entraînés à toutes les formes de combat, qui servent à la fois de garde du corps personnel et de troupes de choc."
 a_nd_mge_mangudai: "Tirailleurs Mangudai"
 a_nd_mge_mangudai_desc: "La cavalerie légère est maîtresse de la feinte retraite. Ils attirent les ennemis à leur poursuite, puis se retournent pour lancer des volées de flèches punitives avant de fondre à travers la steppe."
 a_nd_mge_handgunner: "Mitrailleur mongol"
 a_nd_mge_handgunner_desc: "Infanterie mongole armée d'armes à poudre adaptées, combinant la puissance de feu dévastatrice des armes à feu avec les tactiques mobiles de la guerre des steppes."
 a_nd_mge_legacy_cavalry: "Cavalerie des steppes héritées"
 a_nd_mge_legacy_cavalry_desc: "Les descendants directs des cavaliers de Gengis Khan, perpétuant des siècles de tradition de cavalerie jusqu'à l'ère moderne avec une mobilité mongole caractéristique."
 nd_mge_bow_workshop: "Atelier Arc Composite"
 nd_mge_bow_workshop_desc: "Un atelier spécialisé où les maîtres archers fabriquent le légendaire arc composite mongol à partir de couches de corne, de tendon et de bois de bouleau."
 nd_mge_ger_encampment: "Campement de Ger"
 nd_mge_ger_encampment_desc: "Une base permanente de tentes en feutre qui sert de point de rassemblement et de dépôt de ravitaillement pour les armées mongoles opérant en profondeur sur le terrain."
 nd_mge_ortaq_house: "Maison de commerce Ortaq"
 nd_mge_ortaq_house_desc: "Un bureau de partenariat où les princes mongols et les marchands musulmans coordonnent les vastes entreprises commerciales qui s'étendent sur les routes commerciales de l'empire."
 nd_mge_kurultai_hall: "Salle Kurultai"
 nd_mge_kurultai_hall_desc: "Une grande salle de réunion où les chefs, généraux et nobles mongols se réunissent pour délibérer sur les questions de guerre, de succession et de gouvernance de l'empire."
 nd_mge_imperial_mint: "Monnaie Impériale"
 nd_mge_imperial_mint_desc: "Une installation d'impression de papier-monnaie soutenue par la pleine autorité du Khan, facilitant le commerce à travers les vastes territoires de l'empire."
 nd_mge_ortoo_station: "Station relais Ortoo"
 nd_mge_ortoo_station_desc: "Une station de relais équestre dans le réseau postal de Yam, où les messagers échangent des montures pour transporter des dépêches à travers l'empire à une vitesse remarquable."
 nd_mge_caravanserai: "Caravansérail"
 nd_mge_caravanserai_desc: "Une grande auberge en bord de route offrant de la nourriture, un hébergement et des écuries aux marchands de la Route de la Soie, servant de plaque tournante pour le commerce et l'information le long des autoroutes de l'empire."
 nd_mge_khans_archive: "Archives de Khan"
 nd_mge_khans_archive_desc: "Un référentiel de connaissances recueillies aux quatre coins de l'empire : des rouleaux chinois, des manuscrits persans et des histoires orales mongoles préservées pour les générations futures."
 nd_mge_bow_making: "Fabrication d'arcs mongols"
 nd_mge_bow_making_desc: "Les maîtres archers fabriquent des arcs composites à partir de bois de bouleau, de cornes et de tendons d'animaux, produisant des armes d'une portée et d'une puissance mortelles."
 nd_mge_ger_maintenance: "Entretien du camp de Ger"
 nd_mge_ger_maintenance_desc: "Entretien des revêtements en feutre et des charpentes en bois des campements de yourtes mobiles."
 nd_mge_ortaq_operations: "Opérations commerciales d'Ortaq"
 nd_mge_ortaq_operations_desc: "Gérer les partenariats marchands et les marchandises commerciales circulant à travers le réseau commercial ortaq."
 nd_mge_kurultai_provisions: "Dispositions de Kurultai"
 nd_mge_kurultai_provisions_desc: "Nourrir et loger les chefs et les nobles rassemblés lors des grandes délibérations kurultai."
 nd_mge_paper_note_printing: "Impression de notes papier"
 nd_mge_paper_note_printing_desc: "La production de billets en papier pour le commerce impérial."
 nd_mge_ortoo_upkeep: "Entretien de la gare d'Ortoo"
 nd_mge_ortoo_upkeep_desc: "Entretenir les troupeaux de chevaux et les provisions qui assurent le fonctionnement du réseau de relais Yam."
 nd_mge_caravanserai_hospitality: "Caravansérail Hospitalité"
 nd_mge_caravanserai_hospitality_desc: "Fournir de la nourriture, un abri et des écuries aux marchands voyageant sur la Route de la Soie."
 nd_mge_archive_upkeep: "Entretien des archives"
 nd_mge_archive_upkeep_desc: "Préserver les manuscrits et les parchemins de tout l'empire dans le grand dépôt du Khan."
 nd_mge_imperial_forging: "Forgeage d'armes impériales"
 nd_mge_imperial_forging_desc: "Blades, lance heads and lamellar plate forged to one pattern in the Khan's armories."
 levy_nd_mge_noyan_retinue: "Suite de Noyan"
 levy_nd_mge_noyan_retinue_desc: "Des serviteurs de cavalerie élevés par les commandants Noyan parmi leurs propres ménages et parents tribaux."
 levy_nd_mge_legacy_cavalry: "Cavalerie des steppes héritées"
 levy_nd_mge_legacy_cavalry_desc: "Cavaliers élevés dans l'ancienne tradition de la steppe mongole, préservant l'héritage martial des cavaliers de Gengis Khan."
 STATIC_MODIFIER_NAME_nd_mge_yasa_enforcement: "Application du Yasa"
 STATIC_MODIFIER_DESC_nd_mge_yasa_enforcement: "Le Grand Yasa est appliqué avec une discipline de fer sur tous les territoires de l'empire. Là où la loi est respectée, l’ordre règne. Et ceux qui le défient rencontrent une justice rapide."
 STATIC_MODIFIER_NAME_nd_mge_silk_road_taxation: "Fiscalité de la Route de la Soie"
 STATIC_MODIFIER_DESC_nd_mge_silk_road_taxation: "Les péages mongols le long de la Route de la Soie extraient le tribut de chaque caravane qui voyage sous la protection du Khan, transformant ainsi la paix de l'empire en un flux constant de revenus."
 STATIC_MODIFIER_NAME_nd_mge_gunpowder_prosperity: "La prospérité de la poudre à canon"
 STATIC_MODIFIER_DESC_nd_mge_gunpowder_prosperity: "La connaissance des armes à poudre est partagée dans tout l’empire, stimulant l’innovation dans la production, la construction et le commerce à mesure que la nouvelle technologie transforme la vie civile aux côtés de l’armée."
 nd_mge_formed_tt: "L'empire mongol a été formé"
 nd_mge_path_a_tt: "Choisissez la voie du ciel bleu éternel"
 nd_mge_path_b_tt: "A choisi la Couronne du Monde"
 nd_mge_destiny: "Destin de l'Empire mongol"
 nd_mge_destiny_desc: "L'Empire mongol s'est à nouveau levé. Maintenez la stabilité pendant que le Khan trace le parcours de l'empire à travers l'histoire."
 nd_mge_dest_western_ride: "La balade occidentale"
 nd_mge_dest_western_ride_desc: "Terminez l'œuvre de Hulagu Khan. Amenez Bagdad et Damas sous domination mongole, étendant ainsi la portée de l’empire jusqu’au cœur du monde islamique."
 nd_mge_dest_southern_campaign: "La campagne du Sud"
 nd_mge_dest_southern_campaign_desc: "Tournez le regard conquérant vers le sud. Les richesses de l'Inde ont longtemps tenté les khans mongols : s'emparer de Delhi et de Lahore pour intégrer le sous-continent à l'empire."
 nd_mge_dest_four_seas: "Empire des Quatre Mers"
 nd_mge_dest_four_seas_desc: "La vision ultime de Gengis Khan : un empire s'étendant d'une mer à l'autre. Prenez Constantinople, Le Caire et Buda pour prouver la suprématie mongole sur trois continents."
 nd_mge_dest_silk_renewed: "La Route de la Soie renouvelée"
 nd_mge_dest_silk_renewed_desc: "Sous la paix mongole, la Route de la Soie prospère à nouveau. Assurez-vous que la soie circule sur le marché des capitaux, remplissez le trésor impérial et adoptez le système bancaire moderne."
 nd_mge_dest_exchange_civs: "Échange de civilisations"
 nd_mge_dest_exchange_civs_desc: "The empire bridges East and West, facilitating the greatest exchange of knowledge in history. Tabriz, where the scholars of Persia, China and the Franks once worked on one history of the world, is built up again, and the printing press is embraced to spread learning."
 nd_mge_dest_tabriz_developed_tt: "Tabriz is ours and has been built up to a development of at least 29"
 nd_mge_dest_universal_dominion: "Domination universelle"
 nd_mge_dest_universal_dominion_desc: "The Mongol Empire aspires to become the seat of universal civilization. Karakorum, the capital of Ogedei, is rebuilt as a city, the treasury is filled, and gems adorn the capital market."
 nd_mge_dest_karakorum_city_tt: "Karakorum is ours and has grown into a city"
 nd_mge.6.t: "L'Empire restauré"
 nd_mge.6.d: "L’Empire mongol renaît, un colosse s’étendant sur toute l’Asie. Le kurultai a affirmé l'autorité du Khan, et le peuple compte sur son dirigeant pour guider ce vaste domaine vers son destin. Que ce soit à travers le tonnerre des sabots ou le bourdonnement silencieux du commerce, la voie à suivre par l’empire sera inscrite dans les annales de l’histoire."
 nd_mge.6.a: "Le monde attend la volonté du Khan."
 nd_mge.7.t: "La balade occidentale commence"
 nd_mge.7.d: "Mongol banners fly over Baghdad and Damascus, cities that once defied the horde and now bow before the Khan. The Abbasid caliphate's former seat of power is Mongol ground, and the ancient crossroads of the Levant carry the thunder of steppe cavalry. The western frontier of the empire has been pushed beyond what even Hulagu achieved."
 nd_mge.7.a: "Du Tigre à l’Euphrate, tout nous appartient."
 nd_mge.8.t: "Les portes de l'Inde"
 nd_mge.8.d: "Delhi has fallen. The subcontinent's riches (its elephants, its spices, its teeming millions) now flow into the Mongol sphere. What the Chagatai khans attempted and failed, the restored empire has achieved. The Khyber Pass echoes with the hooves of the Khan's cavalry, and the sultans of Hindustan kneel before a power greater than any they have known.\n\nHow shall the Khan consolidate these southern conquests?"
 nd_mge.8.a: "Établissez des lignes de ravitaillement rapides en cavalerie."
 nd_mge.8.b: "Laissez notre nom semer la terreur dans leurs cœurs."
 nd_mge.9.t: "Seigneur des Quatre Mers"
 nd_mge.9.d: "Constantinople, Cairo, Buda (three cities that represent three continents, three civilizations, three millennia of history) all fly the banner of the Khan. The Mongol Empire now stretches from the Pacific to the Mediterranean, from the Arctic tundra to the Nile Delta. No empire in history has matched this scale.\n\nThe Khan stands at the pinnacle of earthly power. How shall this supreme achievement be commemorated?"
 nd_mge.9.a: "La conquête ne finira jamais."
 nd_mge.9.b: "Apportez la paix grâce à l'autorité de l'épée."
 nd_mge.10.t: "La Route de la Soie revit"
 nd_mge.10.d: "Les caravanes de soie sillonnent à nouveau le cœur de l'empire, protégées par la cavalerie mongole et taxées par les gouverneurs mongols. Les marchés de la capitale regorgent de tissus fins provenant de Chine, de pierres précieuses venues de Perse et d'épices provenant des quatre coins du monde connu. Le trésor impérial s'enrichit des péages de mille routes caravanières."
 nd_mge.10.a: "Les marchands prospèrent sous la paix du Khan."
 nd_mge.11.t: "Le grand échange"
 nd_mge.11.d: "Under Mongol rule, an unprecedented exchange of knowledge spans the continent. Chinese astronomers correspond with Persian mathematicians, Uighur scribes translate Greek philosophy, and printing presses disseminate learning in a dozen languages. The empire has become not merely a political entity but a conduit for civilization itself.\n\nHow shall the Khan direct this flowering of knowledge?"
 nd_mge.11.a: "J'ai fondé des écoles pour diffuser l'apprentissage à travers le royaume."
 nd_mge.11.b: "Donner aux commerçants les moyens de devenir des mécènes du savoir."
 nd_mge.12.t: "La couronne de toutes les nations"
 nd_mge.12.d: "The Mongol Empire has achieved what no other power in history has accomplished: a true universal state where every culture contributes, every tradition is preserved, and every people finds their place under the protection of the Khan. Karakorum stands again as a city to rival the greatest of any age, and the treasury overflows with the wealth of a continent.\n\nWhat legacy shall the Khan leave to the ages?"
 nd_mge.12.a: "Construisez la route éternelle de la prospérité."
 nd_mge.12.b: "Devenez le Khan de tous les peuples."
 STATIC_MODIFIER_NAME_nd_mge_dest_swift_cavalry: "Doctrine de la cavalerie rapide"
 STATIC_MODIFIER_DESC_nd_mge_dest_swift_cavalry: "Les lignes de ravitaillement de la cavalerie du Khan s'étendent de l'Indus au Gange, avec des stations relais assurant un renforcement et un réapprovisionnement rapides à travers les territoires conquis."
 STATIC_MODIFIER_NAME_nd_mge_dest_terror_steppe: "Terreur de la steppe"
 STATIC_MODIFIER_DESC_nd_mge_dest_terror_steppe: "La simple approche des bannières mongoles amène les villes à se rendre sans combat. La réputation du Khan précède celle de ses armées, même si la guerre constante laisse peu de temps aux études."
 STATIC_MODIFIER_NAME_nd_mge_dest_world_conqueror: "Conquérant du monde"
 STATIC_MODIFIER_DESC_nd_mge_dest_world_conqueror: "Le Khan commande la plus grande machine militaire de l'histoire. Les armées sont entretenues à moindre coût et les levées nobles se gonflent de guerriers désireux de servir le conquérant du monde connu."
 STATIC_MODIFIER_NAME_nd_mge_dest_pax_sword: "Pax par l'épée"
 STATIC_MODIFIER_DESC_nd_mge_dest_pax_sword: "Le Khan impose l'ordre sur les terres conquises grâce à une gouvernance ferme mais juste. Les peuples conquis sont intégrés à l'empire et les domaines trouvent satisfaction sous la domination mongole."
 STATIC_MODIFIER_NAME_nd_mge_dest_schools_east: "Ecoles de l'Est"
 STATIC_MODIFIER_DESC_nd_mge_dest_schools_east: "Les écoles et les observatoires de l’empire sont le moteur du progrès institutionnel et social, même si l’orientation scientifique détourne l’attention de la tradition militaire."
 STATIC_MODIFIER_NAME_nd_mge_dest_merchant_princes: "Princes marchands"
 STATIC_MODIFIER_DESC_nd_mge_dest_merchant_princes: "Les maisons de marchands habilitées dominent les centres commerciaux de l'empire, favorisant la prospérité et l'activité commerciale à travers le vaste réseau de la Route de la Soie."
 STATIC_MODIFIER_NAME_nd_mge_dest_eternal_road: "La route éternelle"
 STATIC_MODIFIER_DESC_nd_mge_dest_eternal_road: "La Route de la Soie est devenue plus qu’une route commerciale : c’est l’artère de la civilisation elle-même. Les matières premières circulent librement, les populations augmentent et l’harmonie religieuse règne dans tout l’empire."
 STATIC_MODIFIER_NAME_nd_mge_dest_khan_peoples: "Khan de tous les peuples"
 STATIC_MODIFIER_DESC_nd_mge_dest_khan_peoples: "Le Khan règne en tant que souverain sur toutes les nations de l'empire, élargissant la portée diplomatique et favorisant l'alphabétisation universelle, même si l'ouverture du royaume complique les opérations de renseignement."
 nd_mge_war_camp: "Camp de guerre mongol"
 nd_mge_war_camp_desc: "Un point de relais militaire permanent dans la tradition des grands campements de Gengis Khan, équipé pour lever, ravitailler et lancer des armées à travers les vastes frontières de l'empire."
 nd_mge_house_of_wisdom: "Maison de la Sagesse"
 nd_mge_house_of_wisdom_desc: "Un grand centre d'apprentissage inspiré du légendaire Bayt al-Hikma de Bagdad, reconstruit sous le patronage mongol pour servir de dépositaire des connaissances de chaque civilisation sous le règne du Khan."
 nd_mge_war_camp_maintenance: "Approvisionnement du camp de guerre"
 nd_mge_war_camp_maintenance_desc: "Entretenir les armes, les montures et les fournitures des bases militaires permanentes du Khan."
 nd_mge_house_wisdom_maintenance: "Entretien de la Maison de la Sagesse"
 nd_mge_house_wisdom_maintenance_desc: "Entretenir les érudits, les scribes et le matériel du plus grand centre d’apprentissage de l’empire."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_mge_bureaucracy_authority: "Chancellerie impériale du Grand Khan"
 AUTO_MODIFIER_DESC_nd_mge_bureaucracy_authority: "With the empire reunited, the four khanates' chanceries can again work as one. The Great Khan's clerks open two permanent institutional slots."

 mge_great_yasa_bureaucracy: "Le Grand Yasa"
 mge_great_yasa_bureaucracy_desc: "Le Yeke Jasaq est le droit coutumier promulgué par Gengis Khan et élaboré sous Ogedei. Il lie le clan impérial, l'armée et les peuples soumis, fixant la peine de mort pour vol et adultère, réglementant la chasse et ordonnant le keshig. Ses parchemins sont lus à haute voix à chaque kuriltai. Tant que la loi est respectée, la discipline des steppes demeure ; Autrefois négligés, les décisions contradictoires et les appels dynastiques érodent le pacte entre le khan et ses tribus."

 mge_kuriltai_assembly_bureaucracy: "Assemblée Kouriltai"
 mge_kuriltai_assembly_bureaucracy_desc: "Le kuriltai est la grande assemblée du clan impérial et des noyans supérieurs, convoqués pour élire un nouveau khan, ratifier les campagnes et partager le butin. D'Onon en 1206 à Karakorum en 1251, aucun trône mongol n'est incontesté sans lui. L'assemblée légitime le khan mais fragmente également le processus de décision impérial : la partition de l'empire après la mort de Mongke en 1259 est le plus grand échec du kuriltai."

 mge_keshig_imperial_guard_bureaucracy: "Garde Impériale Keshig"
 mge_keshig_imperial_guard_bureaucracy_desc: "Le keshig est le corps de famille de Gengis composé de dix mille hommes, divisé en la garde de jour turqaut et la garde de nuit kebte'ul. C'est à la fois le garde du corps du khan, son équipe personnelle et l'école de formation des futurs commandants et darughachi. Le recrutement prend les fils des noyans en otages, transmuant l'aristocratie héréditaire en serviteurs royaux choisis. Lorsqu'il est négligé, le corps devient une clique dorée et la capture héréditaire ferme la cour intérieure."

 mge_yam_postal_network_bureaucracy: "Réseau postal d'igname"
 mge_yam_postal_network_bureaucracy_desc: "Le yam est un système de stations relais espacées d'environ une journée de course, dirigées par des gardiens ortoochi qui fournissent des montures fraîches aux messagers impériaux portant des tablettes d'autorité paiza. Marco Polo le décrit comme la merveille de l'empire : les nouvelles, les décrets, les registres fiscaux et les marchands se déplacent sur des distances continentales en semaines plutôt qu'en mois. Le réseau est financé par la taxe Qubchur et le travail des corvées prélevées auprès des communautés paysannes le long des routes : un fardeau qu'elles ressentent amèrement mais ne peuvent refuser."

 mge_darughachi_governance_bureaucracy: "Gouvernance Darughachi"
 mge_darughachi_governance_bureaucracy_desc: "Un darughachi (basqaq en turc) est un commissaire résident nommé par les Mongols et placé au-dessus d'une ville conquise ou d'un tribunal vassal. Il fait le recensement, prélève les douanes tamgha, enrôle les artisans dans les ateliers impériaux et transmet le tribut dû au Grand Khan. Contrairement aux détenteurs de timar ou de jagir, les darughachi ne possèdent aucune terre et peuvent être transférés à volonté : la fonction est délibérément détachée des élites locales pour empêcher sa capture, et les chroniques russes et perses le décrivent comme le plus lourd des fardeaux impériaux."

 mge_yelu_chucai_synthesis_bureaucracy: "Synthèse de Yelu Chucai"
 mge_yelu_chucai_synthesis_bureaucracy_desc: "Yelu Chucai, un érudit Khitan hérité de la chancellerie Jin, a convaincu Ogedei Khan que taxer la population sédentaire était plus lucratif que de la massacrer. Sous sa direction, la cour adopte la pratique fiscale Liao-Jin : ménages enregistrés, prélèvements fixes sur l'argent et la soie, tenue des registres des scribes en chinois et commis formés au confucianisme à la place des comptables tribaux. La réforme nécessite le contrôle d'une capitale sédentaire (Karakorum ou Dadu) et aliène la noblesse des steppes, qui perd son droit de piller librement."
