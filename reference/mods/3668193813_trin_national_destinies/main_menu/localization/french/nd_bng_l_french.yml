l_french:
 STATIC_MODIFIER_NAME_nd_looms_of_sonargaon: "Métiers à tisser de Sonargaon"
 STATIC_MODIFIER_DESC_nd_looms_of_sonargaon: "Le tissu de coton le plus fin au monde provient des métiers à tisser du Bengale. La mousseline, si pure qu'on l'appelait « air tissé », domine les marchés d'Asie et au-delà, faisant du Bengale la terre commerciale la plus riche du sous-continent."
 STATIC_MODIFIER_NAME_nd_sword_of_the_ganges: "Épée du Gange"
 STATIC_MODIFIER_DESC_nd_sword_of_the_ganges: "La vaste population du Bengale, la géographie fluviale et la tradition des éléphants de guerre en font une formidable puissance militaire. Les rivières servent de routes aux armées, et les richesses du delta soutiennent des campagnes que des royaumes inférieurs ne pourraient jamais organiser."
 nd_bng.1.t: "L'essor du Bengale"
 nd_bng.1.d: "The Bengal Sultanate has united the fertile Ganges delta under a single banner. From the great ports of Chittagong and Satgaon to the legendary weaving centers of Sonargaon and Dhaka, this land commands wealth that draws the envy of empires. Chinese admirals call it 'the richest country to trade with,' and Moroccan travelers marvel at its cloth. Now, at the moment of formation, a choice presents itself: shall Bengal pour its energies into the textile trade that makes it wealthy, or forge its armies and fleets into instruments of territorial expansion?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_bng.1.a: "Laissons les métiers à tisser notre destin."
 nd_bng.1.b: "Nos rivières transporteront des armées, pas seulement des marchands."
 nd_bng.2.t: "L'âge d'or des Hussain Shahis"
 nd_bng.2.d: "Sous la dynastie Hussain Shahi, le Bengale entre dans son âge d’or. Depuis la magnifique capitale de Gaur, les territoires du sultanat s'étendent de l'Arakan à l'Orissa, de l'Assam à Tripura. Hindous et musulmans servent ensemble dans l'administration royale, les poètes composent en bengali aux côtés du persan, et les chefs-d'œuvre architecturaux de Gaur-Lakhnauti s'élèvent en brique et en terre cuite distinctives. C’est un moment d’épanouissement culturel extraordinaire, mais aussi d’ambition militaire. Les Hussain Shahis ont élargi les frontières du Bengale plus loin que n'importe quelle dynastie précédente. Comment cet âge d’or sera-t-il dirigé ?"
 nd_bng.2.a: "Patronisez les arts et les érudits du Bengale."
 nd_bng.2.b: "Exploitez notre avantage et élargissez nos frontières."
 nd_bng.3.t: "Les réformes fiscales de Murshid Quli Khan"
 nd_bng.3.d: "Murshid Quli Khan, le premier Nawab indépendant du Bengale, a transformé l'administration de la province. Déplaçant la capitale de Dhaka vers la ville nouvellement fondée de Murshidabad, il met en œuvre de vastes réformes fiscales qui systématisent la collecte des impôts au Bengale, au Bihar et en Orissa. Son système mal zamini attribue des impôts fixes aux propriétaires fonciers, remplaçant ainsi la gestion chaotique des impôts par une bureaucratie ordonnée. Le trésor du Bengale déborde, la province contribue désormais à plus de la moitié de tous les revenus impériaux moghols. Mais cette centralisation a un coût pour l’autonomie des commerçants. L’État doit-il resserrer son emprise sur les revenus ou accorder une plus grande liberté aux classes commerçantes ?"
 nd_bng.3.a: "Centraliser les revenus sous l'autorité du Nawab."
 nd_bng.3.b: "Donnez aux commerçants la liberté d’accroître notre richesse."
 nd_bng.4.t: "La Renaissance bengali"
 nd_bng.4.d: "Un grand réveil intellectuel s’agite au Bengale. Les érudits, les poètes et les réformateurs réinventent l’identité bengali à travers la littérature, la philosophie et la critique sociale. La langue bengali elle-même devient un véhicule de modernisation de la pensée, à mesure que les écrivains remettent en question les vieilles orthodoxies et envisagent une société réformée. Les universités et les imprimeries se multiplient, l'alphabétisation s'étend au-delà de l'élite traditionnelle et de nouvelles idées sur la gouvernance et les droits individuels prennent racine dans le sol fertile de la tradition intellectuelle du Bengale. Cette renaissance peut suivre deux voies : une révolution littéraire qui transforme les cœurs et les esprits, ou un mouvement de réforme pratique qui remodèle les institutions."
 nd_bng.4.a: "Que les mots écrits illuminent le Bengale."
 nd_bng.4.b: "Réformez nos institutions pour une nouvelle ère."
 STATIC_MODIFIER_NAME_nd_bng_golden_age_patronage: "Patronage de l’âge d’or"
 STATIC_MODIFIER_DESC_nd_bng_golden_age_patronage: "La cour Hussain Shahi est un phare de culture et d'apprentissage, attirant des poètes, des architectes et des érudits de tout le sous-continent."
 STATIC_MODIFIER_NAME_nd_bng_golden_age_expansion: "Extension de l'âge d'or"
 STATIC_MODIFIER_DESC_nd_bng_golden_age_expansion: "Les armées de Hussain Shahi ont repoussé au maximum les frontières du Bengale, établissant leur domination sur l'Arakan, l'Orissa et au-delà."
 STATIC_MODIFIER_NAME_nd_bng_revenue_centralization: "Centralisation des revenus"
 STATIC_MODIFIER_DESC_nd_bng_revenue_centralization: "Le système mal zamini de Murshid Quli Khan a fait du Bengale la province la plus efficacement taxée du sous-continent."
 STATIC_MODIFIER_NAME_nd_bng_merchant_freedom: "Liberté du commerçant"
 STATIC_MODIFIER_DESC_nd_bng_merchant_freedom: "Les commerçants du Bengale opèrent avec une autonomie sans précédent, leurs réseaux commerciaux s'étendant sur le golfe du Bengale et au-delà."
 STATIC_MODIFIER_NAME_nd_bng_literary_awakening: "Éveil littéraire"
 STATIC_MODIFIER_DESC_nd_bng_literary_awakening: "La Renaissance bengali a déclenché une explosion de littérature, d’érudition et d’idées nouvelles qui transforme le paysage intellectuel."
 STATIC_MODIFIER_NAME_nd_bng_reform_movement: "Mouvement réformateur"
 STATIC_MODIFIER_DESC_nd_bng_reform_movement: "Les réformateurs bengalis modernisent les institutions de la province, créant ainsi une administration plus efficace et plus réactive."
 nd_bng_delta_agriculture: "Delta-Agriculture"
 nd_bng_delta_agriculture_desc: "L’art de gérer les inondations annuelles du delta du Gange (construire des digues en terre, diriger l’eau dans des canaux et programmer la plantation du riz en fonction du cycle de la mousson) fait vivre l’une des régions les plus densément peuplées de la planète."
 nd_bng_sultanate_divan: "Divan du Sultanat"
 nd_bng_sultanate_divan_desc: "Le conseil administratif du sultanat du Bengale, le Divan, associe les traditions de gouvernance d'Asie centrale aux pratiques locales bengali, créant ainsi une bureaucratie multiculturelle où hindous et musulmans servent côte à côte."
 nd_bng_muslin_tradition: "Tradition en mousseline"
 nd_bng_muslin_tradition_desc: "Bengali weavers produce muslin so fine that travelers call it 'woven air.' The cloth of Sonargaon and Dhaka is prized from China to the Mediterranean, and the techniques are passed down through generations of master craftsmen.\n\n#italic Available in: $nd_bng_muslin_workshop$#!"
 nd_bng_river_flotilla: "Flottille fluviale"
 nd_bng_river_flotilla_desc: "Dans le Bengale riverain, le contrôle des voies navigables équivaut au contrôle du pays. Des galères à faible tirant d'eau patrouillent dans les milliers de canaux qui sillonnent le delta, assurant à la fois la sécurité militaire et la régulation commerciale."
 nd_bng_iwaz_naval_legacy: "L'héritage naval d'Iwaz Khalji"
 nd_bng_iwaz_naval_legacy_desc: "Iwaz Khalji a été le premier à organiser une force navale au Bengale islamique, reconnaissant que la marine fluviale était d'une nécessité primordiale dans un pays où les voies navigables sont plus nombreuses que les routes. Son héritage façonne la doctrine militaire du Bengale depuis des siècles."
 nd_bng_sonargaon_arong: "Sonargaon Arong"
 nd_bng_sonargaon_arong_desc: "L'arong, un marché où la mousseline est produite et vendue, atteint son apogée à Panam Nagar à Sonargaon. Ici, les marchands de toute l’Asie se rassemblent pour enchérir sur les plus beaux tissus du monde."
 nd_bng_hussain_shahi_court: "Tribunal Hussain Shahi"
 nd_bng_hussain_shahi_court_desc: "La dynastie Hussain Shahi préside l'âge d'or du Bengale depuis la capitale Gaur. Sous leur patronage, la littérature, l’architecture et l’administration bengali atteignent des sommets sans précédent."
 nd_bng_war_boat_tradition: "Tradition des bateaux de guerre"
 nd_bng_war_boat_tradition_desc: "Les bateliers de guerre du Bengale, une infanterie soutenue par des paiks qui combattent à bord d'embarcations fluviales, constituent l'épine dorsale de l'armée pendant la mousson. Là où la cavalerie échoue en terrain inondé, ces guerriers fluviaux l'emportent."
 nd_bng_adina_congregation: "Congrégation Adina"
 nd_bng_adina_congregation_desc: "Les grandes mosquées congrégationnelles du Bengale, construites dans la tradition locale distinctive en brique et en terre cuite, servent de centres à la fois de dévotion religieuse et de vie communautaire. La mosquée Adina de Pandua, calquée sur les grandes mosquées de Damas et de Ctésiphon, est la plus grande du sous-continent."
 nd_bng_bengali_coinage: "Monnaie bengali"
 nd_bng_bengali_coinage_desc: "Le sultanat du Bengale frappe ses propres tankas en argent, établissant ainsi son indépendance financière par rapport à Delhi. Ce système monétaire indépendant facilite le commerce et attire les commerçants sur les marchés du Bengale."
 nd_bng_chittagong_customs: "Douanes de Chittagong"
 nd_bng_chittagong_customs_desc: "Chittagong, le premier port maritime du Bengale, gère la majorité des exportations vers l'étranger : les mousselines fines, l'indigo, le riz et les épices affluent tandis que les chevaux, les lingots et les produits de luxe affluent de l'autre côté de l'océan Indien."
 nd_bng_muslin_export: "Exportation de mousseline"
 nd_bng_muslin_export_desc: "Bengal's muslin trade reaches global proportions. Annual fleets of five or six ships carry textiles worth eighty to ninety thousand cruzados to Malacca alone, while European trading companies compete fiercely for access to Bengal's cloth. The ships are built and fitted out at Chittagong."
 nd_bng_river_patrol: "Patrouille fluviale"
 nd_bng_river_patrol_desc: "Des bateaux de patrouille rapides protègent le vaste réseau commercial fluvial du Bengale contre la piraterie et la contrebande, garantissant que les richesses circulant dans les canaux du delta atteignent le trésor du Nawab."
 nd_bng_nawab_governance: "Gouvernance du Nabab"
 nd_bng_nawab_governance_desc: "Les Nawabs du Bengale développent une administration provinciale distincte qui équilibre l'autorité centrale avec l'autonomie locale, gérant l'une des régions les plus peuplées et productives du monde."
 nd_bng_bay_of_bengal_trade: "Commerce du Golfe du Bengale"
 nd_bng_bay_of_bengal_trade_desc: "Les réseaux commerciaux maritimes du Bengale s'étendent sur le golfe du Bengale, reliant Chittagong et Satgaon à la Birmanie, à Malacca, aux Maldives, au Sri Lanka et aux ports d'Asie du Sud-Ouest et d'Afrique de l'Est."
 nd_bng_murshidabad_silk: "Soie Murshidabad"
 nd_bng_murshidabad_silk_desc: "Murshidabad's silk weavers produce golden brocades and kincabs that are prized across the Mughal world. The city's looms turn raw silk into fabric fit for emperors, establishing Bengal as a center of luxury textile production.\n\n#italic Available in: $nd_bng_muslin_workshop$#!"
 nd_bng_revenue_reforms: "Réformes des recettes"
 nd_bng_revenue_reforms_desc: "L’évaluation et la collecte systématiques des revenus transforment le Bengale d’une province sujette au chaos fiscal en l’épine dorsale financière de l’empire moghol, contribuant à plus de la moitié de tous les revenus impériaux."
 nd_bng_arsenal_tradition: "La tradition d'Arsenal"
 nd_bng_arsenal_tradition_desc: "Les arsenaux du Bengale fabriquent de la poudre à canon, du salpêtre et des armes à l'échelle industrielle. La province est l'un des plus grands producteurs mondiaux de salpêtre, un ingrédient essentiel de la poudre à canon."
 nd_bng_matchlock_infantry: "Infanterie à mèche"
 nd_bng_matchlock_infantry_desc: "Les banduqchi bengalis, mousquetaires à mèche, combinent les traditions des armes à feu introduites d'Asie centrale avec l'organisation militaire locale. Ils fournissent une puissance de feu disciplinée aux armées du Bengale, de plus en plus dominées par la poudre à canon."
 nd_bng_diplomatic_balance: "Équilibre diplomatique"
 nd_bng_diplomatic_balance_desc: "La position géographique et l'importance économique du Bengale exigent une approche diplomatique sophistiquée, équilibrant les ambitions des empereurs moghols, des rois arakanais et des sociétés commerciales européennes."
 nd_bng_nawab_treasury: "Trésor du Nawab"
 nd_bng_nawab_treasury_desc: "Les sarraf kothhi, banques bancaires du Bengale, gèrent les flux de revenus de la province la plus riche de l'empire moghol. Les banquiers bengalis accordent des crédits à tout le sous-continent, finançant à la fois le commerce et le gouvernement."
 nd_bng_cotton_processing: "Transformation du coton"
 nd_bng_cotton_processing_desc: "Advances in cotton ginning and preparation improve the quality and quantity of raw material available to Bengal's legendary weavers, sustaining the textile industry that is the foundation of the province's wealth. Beside the fine muslins, plain piece goods are woven by the bale for the trading companies.\n\n#italic Available in: $nd_bng_muslin_workshop$#!"
 nd_bng_sepoy_corps: "Corps des cipayes"
 nd_bng_sepoy_corps_desc: "Les régiments de cipayes du Nawab représentent la professionnalisation de l'armée du Bengale. Entraînée aux exercices européens et armée de mousquets modernes, cette infanterie disciplinée constitue une force redoutable, comme le découvrent les rivaux du Nawab et la Compagnie des Indes orientales."
 nd_bng_delta_hydraulics: "Delta Hydraulique"
 nd_bng_delta_hydraulics_desc: "Des siècles d'expérience dans la gestion de l'hydrologie complexe du delta du Gange culminent dans des systèmes sophistiqués de gestion de l'eau qui soutiennent une population dense, une culture intensive du riz et une navigation commerciale."
 nd_bng_jute_industry: "Industrie du jute"
 nd_bng_jute_industry_desc: "Bengal becomes the world center of jute production and processing. The strong, flexible fiber (used for rope, sacking, and coarse textiles) becomes one of Bengal's most important export commodities in the industrial era."
 nd_bng_bengali_renaissance: "Renaissance bengali"
 nd_bng_bengali_renaissance_desc: "Une révolution intellectuelle transforme la société bengali. Les écrivains, poètes et réformateurs créent une nouvelle littérature bengali, créent des établissements d'enseignement modernes et remettent en question les conventions sociales, jetant ainsi les bases d'une identité nationale moderne."
 nd_bng_indigo_plantations: "Plantations d'indigo"
 nd_bng_indigo_plantations_desc: "Les basses terres du Bengale s'avèrent idéales pour la culture de l'indigo, et la province devient un fournisseur majeur de la teinture bleue prisée des fabricants de textiles européens. Des cuves d'indigo parsèment la campagne, transformant la plante en gâteaux de colorants concentrés destinés à l'exportation."
 n_nd_bng_river_galley: "Cuisine de la rivière Bengali"
 n_nd_bng_river_galley_desc: "Un navire à rames à faible tirant d'eau conçu pour les canaux étroits et sinueux du delta du Gange. Rapides et maniables, ces galères patrouillent sur les voies navigables qui servent d'autoroutes au Bengale."
 a_nd_bng_war_boatman: "Batelier de guerre"
 a_nd_bng_war_boatman_desc: "Infanterie fluviale qui combat depuis des bateaux et sur des rivages boueux. Pendant la saison de la mousson, lorsque la cavalerie est inutile, ces guerriers soutenus par les paiks constituent la principale force de combat du Bengale."
 n_nd_bng_patrol_boat: "Bateau de patrouille du Bengale"
 n_nd_bng_patrol_boat_desc: "Un navire rapide conçu pour protéger les routes commerciales fluviales et côtières du Bengale contre les pirates et les contrebandiers. Plus légers et plus rapides que les navires de guerre standards, les patrouilleurs sont les chevaux de bataille de la sécurité commerciale du Bengale."
 n_nd_bng_chittagong_trader: "Chittagong Trader"
 n_nd_bng_chittagong_trader_desc: "A deep trading ship built in the yards of Chittagong for the yearly run across the bay to Malacca and Pasai. It carries more than other ships of its size and sails slower, and its presence is felt in the sea lanes it works."
 a_nd_bng_banduqchi: "Banduqchi"
 a_nd_bng_banduqchi_desc: "Mousquetaires bengalis à mèche qui forment l'infanterie à poudre du sultanat et plus tard les armées du Nawab. Leurs tirs de volée disciplinés sont dévastateurs dans les terrains découverts des plaines du Bengale."
 a_nd_bng_banduqchi_levy: "Milice Banduqchi"
 a_nd_bng_banduqchi_levy_desc: "Mousquetaires de Levy issus des communautés de soldats et de paysans du Bengale, armés de fusils à mèche et entraînés aux tactiques de base de volée."
 a_nd_bng_sepoy: "Cipaye bengali"
 a_nd_bng_sepoy_desc: "Infanterie de mousquets professionnelle de l'ère Nawab, entraînée aux exercices européens et équipée de mousquets à silex. Le cipaye bengali combine la tradition martiale sous-continentale avec la discipline militaire moderne."
 nd_bng_delta_bund: "Bund Delta"
 nd_bng_delta_bund_desc: "Des remblais en terre et des systèmes de contrôle des inondations qui protègent les rizières du Bengale des inondations annuelles de la mousson. Ces digues canalisent les eaux de crue vers les canaux d’irrigation, transformant une force destructrice en abondance agricole."
 nd_bng_muslin_workshop: "Atelier Mousseline"
 nd_bng_muslin_workshop_desc: "Un atelier de tissage spécialisé où les artisans bengalis produisent les meilleurs tissus de coton au monde. La mousseline de Dhaka et de Sonargaon est si fine que des morceaux de mousseline peuvent passer à travers une bague."
 nd_bng_arong: "Arong"
 nd_bng_arong_desc: "Un marché textile bengali où sont commercialisés de la mousseline et d'autres tissus fins. Le plus grand arong de Panam Nagar à Sonargaon attire des marchands de toute l'Asie, ce qui en fait l'un des principaux centres commerciaux du sous-continent."
 nd_bng_jami_mosque: "Mosquée Jami"
 nd_bng_jami_mosque_desc: "Une grande mosquée congrégationnelle construite dans la tradition distinctive du Bengale en brique et en terre cuite, avec des toits de chala incurvés et des sculptures florales complexes qui mélangent l'architecture islamique avec les formes bengali indigènes."
 nd_bng_customs_house: "Bureau des douanes"
 nd_bng_customs_house_desc: "Un bureau des recettes portuaires qui réglemente le commerce extérieur du Bengale. Les agents des douanes évaluent les droits de douane sur les marchandises entrantes et sortantes, canalisant ainsi la richesse du commerce du golfe du Bengale vers le trésor public."
 nd_bng_arsenal: "Arsenal"
 nd_bng_arsenal_desc: "Manufacture d'armes et dépôt militaire produisant des armes à feu, de la poudre à canon et des munitions. Le Bengale est l'un des plus grands producteurs mondiaux de salpêtre, l'ingrédient essentiel de la poudre à canon."
 nd_bng_sarraf_kothhi: "Sarraf Kothhi"
 nd_bng_sarraf_kothhi_desc: "Une maison bancaire de l'ère Nawab où les financiers bengalis gèrent le crédit, échangent des devises et financent le commerce longue distance. Ces institutions font du Bengale un centre financier rivalisant avec tous ceux de l’empire moghol."
 nd_bng_indigo_vat: "cuve indigo"
 nd_bng_indigo_vat_desc: "Une installation de transformation où les plantes d'indigo sont trempées, fermentées et pressées en gâteaux de colorants concentrés destinés à l'exportation. L'indigo du Bengale approvisionne les industries textiles européennes."
 nd_bng_bund_maintenance: "Entretien des digues"
 nd_bng_bund_maintenance_desc: "Timber, stone and digging tools for the upkeep of earthen embankments and irrigation channels in the flood-prone Ganges delta."
 nd_bng_muslin_workshop_maintenance: "Production de mousseline"
 nd_bng_muslin_workshop_maintenance_desc: "Les tisserands bengalis filent le coton brut avec des colorants pour en faire une fine mousseline."
 nd_bng_arong_maintenance: "Arong Entretien"
 nd_bng_arong_maintenance_desc: "Sample cloth, storage jars and the brokers' paper consumed in running the textile marketplace."
 nd_bng_mosque_maintenance: "Entretien de la mosquée"
 nd_bng_mosque_maintenance_desc: "Stone, clay for brick and terracotta, and ceramic materials for maintaining the grand congregational mosque."
 nd_bng_customs_maintenance: "Entretien des douanes"
 nd_bng_customs_maintenance_desc: "Paper, seals of cloth and the scales and weights of port revenue collection."
 nd_bng_arsenal_maintenance: "Entretien de l'arsenal"
 nd_bng_arsenal_maintenance_desc: "Armes et armes à feu consommées pour l'entretien du dépôt militaire."
 nd_bng_sarraf_maintenance: "Entretien de la banque"
 nd_bng_sarraf_maintenance_desc: "Documents administratifs pour les opérations bancaires et de crédit."
 nd_bng_indigo_maintenance: "Traitement indigo"
 nd_bng_indigo_maintenance_desc: "Les plantes d'indigo sont trempées, fermentées et pressées en gâteaux de colorants concentrés destinés à l'exportation."
 nd_bng_muslin_weaving: "Tissage de mousseline"
 nd_bng_muslin_weaving_desc: "La technique traditionnelle bengali consistant à tisser du coton pour en faire un tissu de mousseline extraordinairement fin, à l'aide de métiers à tisser spécialisés et de générations de compétences accumulées."
 nd_bng_silk_weaving: "Tissage de la soie de Murshidabad"
 nd_bng_silk_weaving_desc: "La production de brocarts dorés, de kincabs et de textiles en soie fine dans les ateliers de Murshidabad."
 nd_bng_cotton_ginning: "Égrenage du coton"
 nd_bng_cotton_ginning_desc: "Cotton is cleaned of its seed on the roller gin, spun, and woven into plain piece goods in bulk."
 nd_bng_jute_processing: "Traitement du jute"
 nd_bng_jute_processing_desc: "Jute stalks are retted in the river, stripped, and twisted into rope and sacking for the ships."
 nd_bng_jute_works: "Jute Works"
 nd_bng_jute_works_desc: "Retting pools, stripping sheds and a rope walk beside a delta river. Bundles of jute lie in the slow water until the fibre comes away from the stalk, and it is then dried, twisted into cordage and woven into sacking. It can be built only on a river."
 levy_nd_bng_war_boatman: "Prélèvement des bateliers de guerre"
 levy_nd_bng_war_boatman_desc: "Milice d'infanterie fluviale issue des communautés du delta du Bengale, habile à combattre depuis des bateaux et sur des terrains gorgés d'eau."
 levy_nd_bng_banduqchi: "Prélèvement Banduqchi"
 levy_nd_bng_banduqchi_desc: "Milice de mousquetaires à mèche issue des populations militaires et paysannes du Bengale."
 nd_bng_formed_tt: "Le Bengale s'est formé"
 nd_bng_path_a_tt: "Choisissez les métiers à tisser de Sonargaon"
 nd_bng_path_b_tt: "Choisissez l'Épée du Gange"
 nd_bng_destiny: "Destin du Bengale"
 nd_bng_destiny_desc: "Le Bengale se trouve à la croisée des chemins de son avenir. Une fois sa formation terminée, la nation doit désormais décider de la forme de sa grandeur, que ce soit par la richesse de ses métiers à tisser légendaires ou par la force de ses armées fluviales."
 nd_bng_dest_textile_hub: "Hub textile de l’Est"
 nd_bng_dest_textile_hub_desc: "Étendre la domination textile du Bengale en prenant le contrôle de Masulipatnam sur la côte de Coromandel et en assurant la circulation de la soie sur le marché des capitaux. Cela fait du Bengale le centre de la production de tissus dans tout l’océan Indien."
 nd_bng_dest_bay_network: "Réseau du Golfe du Bengale"
 nd_bng_dest_bay_network_desc: "Projetez la puissance commerciale bengali à travers le golfe du Bengale en sécurisant Malacca et Martaban. Ces ports éloignés relient les exportations textiles du Bengale au commerce des épices de l'Asie du Sud-Est et aux routes terrestres de la Birmanie continentale."
 nd_bng_dest_woven_air: "Air tissé"
 nd_bng_dest_woven_air_desc: "La mousseline du Bengale, si fine qu'on l'appelle « air tissé », devient la base d'un monopole textile mondial. Sécurisez la côte de Malabar, dominez les marchés du coton et de la soie et faites du Bengale le premier exportateur mondial de tissus."
 nd_bng_dest_bihar_conquest: "Conquête du Bihar"
 nd_bng_dest_bihar_conquest_desc: "Sécurisez le flanc ouest du Bengale en conquérant le Bihar, le cœur de la plaine du Gange. Patna et Darbhanga contrôlent le cours moyen du grand fleuve et fournissent la profondeur stratégique dont le Bengale a besoin pour projeter sa puissance vers l'ouest."
 nd_bng_dest_ganges_campaign: "Campagne du Gange"
 nd_bng_dest_ganges_campaign_desc: "Repoussez les frontières du pouvoir bengali vers le sud jusqu'en Orissa à Cuttack et vers l'ouest le long du Gange jusqu'à la ville sacrée de Varanasi. Cela fait du Bengale la puissance dominante de l’est de l’Inde."
 nd_bng_dest_ganges_empire: "Empire du Gange"
 nd_bng_dest_ganges_empire_desc: "L'expression ultime de la puissance militaire bengali : un empire s'étendant du delta au cœur du pays moghol. Prenez Agra, Lucknow et le temple sacré de Puri. Le Bengale gouverne le Gange de la source à la mer."
 nd_bng.5.t: "Le destin du Bengale"
 nd_bng.5.d: "Le Bengale s'est levé. Ce qui était autrefois un ensemble de principautés fluviales et de provinces de sultanat est désormais une puissance unifiée commandant le delta le plus riche du monde. Les vents de mousson transportent le commerce depuis une centaine de ports ; les rivières nourrissent des champs qui nourrissent des millions de personnes. La question n’est plus de savoir si le Bengale sera grand, mais comment. Sa grandeur se mesurera-t-elle en rouleaux de tissu ou en longueurs d’acier ?"
 nd_bng.5.a: "Notre destin nous attend."
 nd_bng.6.t: "Le pôle textile de l’Est"
 nd_bng.6.d: "Les métiers à tisser du Bengale fixaient désormais le prix du tissu du Coromandel au détroit. Une fois Masulipatnam sécurisé, le commerce textile de toute la côte orientale passe entre les mains des Bengalis. Les marchands de Chine, de Perse et de la Méditerranée se disputent l’accès à notre coton et à notre soie. Les arongs de Sonargaon et les ateliers de Dhaka bourdonnent d'activité jour et nuit."
 nd_bng.6.a: "Le monde s’habille de notre tissu."
 nd_bng.7.t: "Maîtres de la Baie"
 nd_bng.7.d: "De Martaban à Malacca, les navires marchands et navires de guerre bengalis commandent désormais les voies maritimes du golfe du Bengale. Nos textiles sont échangés contre des épices des Moluques à Malacca, tandis que le teck et les rubis de Birmanie transitent par Martaban vers les marchés bengalis. Il s'agit du plus grand réseau commercial maritime depuis l'époque de Srivijaya. Mais la question demeure : devons-nous imposer notre domination grâce à la puissance navale, en projetant notre force à travers l’océan, ou devons-nous canaliser cette richesse pour construire une civilisation commerciale sans égal ?"
 nd_bng.7.a: "Commandez les mers avec des navires de guerre bengalis."
 nd_bng.7.b: "Construisez le plus grand magasin que le monde ait jamais connu."
 nd_bng.8.t: "Air tissé"
 nd_bng.8.d: "On appelle cela « l'air tissé », une mousseline si fine qu'un boulon peut passer à travers un anneau. Le monopole textile du Bengale est désormais inattaquable. Des ports de Malabar aux marchés du Levant, aucun textile ne rivalise avec le nôtre. Les marchands européens appellent Dhaka « le Manchester de l'Est », même si nous étions les premiers depuis des siècles. C'est le sommet de l'art du tisserand et le fondement d'un empire construit non pas sur la conquête mais sur l'artisanat. Allons-nous exploiter notre avantage en contrôlant exclusivement l’approvisionnement en coton, ou devons-nous ouvrir nos ports à tous et nous enrichir en volume ?"
 nd_bng.8.a: "Contrôlez l’approvisionnement en tissu du monde."
 nd_bng.8.b: "Que nos ports deviennent le carrefour du commerce."
 nd_bng.9.t: "La conquête du Bihar"
 nd_bng.9.d: "Les armées bengalies ont balayé la plaine du Gange et planté leurs bannières à Patna et Darbhanga. Le Bihar (terre de l’ancien royaume du Magadha, berceau du bouddhisme) répond désormais au Bengale. Avec ces conquêtes, le sultanat sécurise le milieu stratégique du Gange et accède au riche arrière-pays agricole du Bihar. La route vers l’ouest est ouverte."
 nd_bng.9.a: "Le Bihar est à nous. Le Gange attend."
 nd_bng.10.t: "Campagne du Gange"
 nd_bng.10.d: "La campagne a été un triomphe. Cuttack, capitale des rois Gajapati, est tombée, plaçant toute l'Orissa sous la suzeraineté bengali. À l’ouest, les ghats sacrés de Varanasi arborent désormais les couleurs bengali. Du temple de Jagannath en Orissa aux terres en feu de Kashi, la puissance du Bengale s'étend à travers toute l'est de l'Inde. Mais l’armée est loin de chez elle. Comment allons-nous consolider ces vastes nouveaux territoires, par la logistique militaire qui soutient nos forces de campagne, ou par l’ordre administratif qui transforme l’occupation en gouvernance ?"
 nd_bng.10.a: "Assurez-vous que nos lignes d’approvisionnement tiennent pour la prochaine poussée."
 nd_bng.10.b: "Établissez l'ordre dans les provinces conquises."
 nd_bng.11.t: "Empire du Gange"
 nd_bng.11.d: "C'est fait. Les capitales mogholes d'Agra et de Lucknow répondent au Bengale. Le temple du Seigneur Jagannath à Puri est sous notre protection. Du Hooghly à la Yamuna, de l'Orissa à l'Awadh, le Gange et tous ses affluents traversent le territoire bengali. Il s’agit d’un empire qui rivalise avec tous ceux de l’histoire de l’Inde, construit à partir du delta vers l’extérieur, défiant toute attente selon laquelle le Bengale resterait un marigot provincial. Cet empire reposera-t-il sur la puissance de ses levées et la terreur de ses armées, ou sur l’application calculée de la force qui assure la victoire avant le début de la bataille ?"
 nd_bng.11.a: "Levez les plus grandes armées que le sous-continent ait jamais connues."
 nd_bng.11.b: "La victoire appartient à ceux qui se préparent."
 STATIC_MODIFIER_NAME_nd_bng_dest_maritime_dominion: "Domination maritime"
 STATIC_MODIFIER_DESC_nd_bng_dest_maritime_dominion: "Les navires de guerre bengalis imposent la suprématie commerciale dans le golfe du Bengale, construisant une tradition navale qui étend la portée des navires marchands du Bengale vers des côtes toujours plus lointaines."
 STATIC_MODIFIER_NAME_nd_bng_dest_entrepot_wealth: "Richesse d'entrepôt"
 STATIC_MODIFIER_DESC_nd_bng_dest_entrepot_wealth: "Les ports du Bengale constituent la plaque tournante du commerce dans l'océan Indien. Le prestige de nos maisons de commerce perdure et les provinces déchirées par la guerre se rétablissent rapidement sous l’égide du commerce bengali."
 STATIC_MODIFIER_NAME_nd_bng_dest_cloth_monopoly: "Monopole du tissu"
 STATIC_MODIFIER_DESC_nd_bng_dest_cloth_monopoly: "Bengal's unassailable dominance of the global textile trade assimilates diverse populations into a unified Bengali identity, lending the dynasty legitimacy and the loyalty of subject peoples."
 STATIC_MODIFIER_NAME_nd_bng_dest_ocean_emporium: "Magasin océanique"
 STATIC_MODIFIER_DESC_nd_bng_dest_ocean_emporium: "La politique d'ouverture des ports du Bengale transforme ses villes en les plus grands centres commerciaux d'Asie, gagnant ainsi un levier diplomatique et des réseaux de renseignement, même si l'accent mis sur le commerce a un certain coût pour la préparation militaire."
 STATIC_MODIFIER_NAME_nd_bng_dest_river_supremacy: "Suprématie fluviale"
 STATIC_MODIFIER_DESC_nd_bng_dest_river_supremacy: "La maîtrise du Bengale en matière de logistique fluviale permet aux armées de se renforcer et de faire campagne loin le long du Gange, en alignant des forces plus importantes que ce à quoi l'ennemi s'attend."
 STATIC_MODIFIER_NAME_nd_bng_dest_occupation_order: "Ordonnance d'occupation"
 STATIC_MODIFIER_DESC_nd_bng_dest_occupation_order: "Une administration efficace des territoires conquis transforme l’occupation militaire en une gouvernance durable, avec des garnisons de mercenaires faisant respecter l’ordre tandis que des déclarations de guerre à moindre coût repoussent toujours la frontière vers l’extérieur."
 STATIC_MODIFIER_NAME_nd_bng_dest_imperial_authority: "Autorité impériale"
 STATIC_MODIFIER_DESC_nd_bng_dest_imperial_authority: "La cavalerie impériale et les garnisons fortifiées du Bengale projettent leur puissance à travers la plaine conquise du Gange, même si le maintien de ce vaste appareil militaire met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_bng_dest_conquerors_legacy: "L'héritage du conquérant"
 STATIC_MODIFIER_DESC_nd_bng_dest_conquerors_legacy: "Les armées du Bengale pillent les richesses des terres conquises, recrutent rapidement des régiments chevronnés et déploient une artillerie dévastatrice : l’héritage durable d’un royaume forgé par la conquête."
 nd_bng_golden_muslin_house: "Maison en mousseline dorée"
 nd_bng_golden_muslin_house_desc: "Le summum de l'industrie textile du Bengale, un atelier somptueux et une salle de commerce où les plus belles mousselines et soies sont produites, exposées et vendues aux marchands du monde entier."
 nd_bng_golden_muslin_maintenance: "Production de mousseline dorée"
 nd_bng_golden_muslin_maintenance_desc: "Coton, soie et teintures de première qualité consommés dans la production des textiles les plus raffinés au monde."
 nd_bng_victory_pillar: "Pilier de la Victoire"
 nd_bng_victory_pillar_desc: "Une colonne monumentale en pierre commémorant les conquêtes du Bengale le long du Gange, servant à la fois de point fort de garnison et de symbole de prouesse martiale qui inspire les troupes et impressionne les vaincus."
 nd_bng_victory_pillar_maintenance: "Entretien du pilier de la victoire"
 nd_bng_victory_pillar_maintenance_desc: "Pierre, armement et tissu pour l'entretien du monument militaire et de sa garnison."

 # ===== BUREAUCRACIES =====
 bng_diwan_i_bangala_bureaucracy: "Diwan-i-Bangala"
 bng_diwan_i_bangala_bureaucracy_desc: "Le diwan des revenus du Bengale, à l'origine un bureau subah moghol sous la colonie d'Akbar de 1582 et entièrement réorganisé par Murshid Quli Khan après qu'il soit devenu diwan en 1700 et a déplacé sa capitale de Dhaka à Murshidabad en 1717. Il a réglé les arriérés des grands zamindars, a réglé le kharaj directement avec des milliers de petits détenteurs et a remis la part impériale de la khalisa à Delhi pendant deux décennies avant le Les comptes de Diwan sont devenus une institution bengali à part entière. Les livres du bureau fixaient les revenus de chaque taluk, chaque parganah, chaque ferry et chaque barrage de pêche dans la province la plus humide, la plus riche et la plus peuplée du monde moghol."
 bng_zamindari_settlement_bureaucracy: "Talukdari Zamindari"
 bng_zamindari_settlement_bureaucracy_desc: "Le système foncier bengali à plusieurs niveaux dans lequel le trône percevait ses revenus non pas directement mais par l'intermédiaire de zamindars héréditaires qui détenaient des tenures parfois vastes et les exploitaient à leur tour auprès de talukdars et d'intermédiaires mineurs. À la fin du XVIIe siècle, les grands zamindars de Burdwan, Rajshahi, Dinajpur, Birbhum et Nadia commandaient des ressources, des sièges fortifiés et des serviteurs armés rivalisant avec les petits royaumes ; Rajshahi à lui seul payait plus de revenus que plusieurs subahs du Deccan réunis. Leur coopération a permis au royaume de continuer à fonctionner et leur résistance a mis fin aux Nawabs."
 bng_faujdari_thana_bureaucracy: "Faujdari Thanas"
 bng_faujdari_thana_bureaucracy_desc: "Le réseau de faujdars de l'ère moghole, des officiers militaires et judiciaires postés dans les thanas à travers le subah, chargés de maintenir l'ordre sur les grandes routes nationales du Bengale, de supprimer le dacoity dans le pays riverain et de mettre fin au banditisme chronique des zones de Naga et de Bhuyan dans les collines orientales. Chaque faujdar détenait un petit fauj debout composé de chevaux et de mousquetons et exerçait des pouvoirs magistraux simultanés sur les affaires pénales. Le système donnait au trône une portée dans des districts que les commis du diwan ne pouvaient pas détenir seuls, et le sceau du faujdar se tenait à la frontière entre la paix moghole et la lame du dacoit."
 bng_jagat_seth_treasury_bureaucracy: "Trésor de Jagat Seth"
 bng_jagat_seth_treasury_bureaucracy_desc: "L'alliance entre les Nawab et la dynastie bancaire Marwari de Manikchand et son neveu Fatehchand, que l'empereur Muhammad Shah a officiellement intitulé Jagat Seth, le banquier du monde. À partir des années 1720, la famille détenait le contrat de la Monnaie de Murshidabad, négociait le transfert des revenus à Delhi via des réseaux hundi s'étendant de Surat à Patna et garantissait le financement à court terme du Nawabate pour la prochaine récolte. Dans les années 1750, Robert Orme qualifiait Jagat Seth de plus grand économe et banquier du monde connu ; son retrait de confiance à Siraj ud-Daulah en 1757 rendit possible le coup d'État anglais à Plassey."
 bng_hussain_shahi_patronage_bureaucracy: "Patronage de Hussain Shahi"
 bng_hussain_shahi_patronage_bureaucracy_desc: "La culture de cour syncrétique des sultans Hussain Shahi (1493-1538) à Gaur, dont la chancellerie patronnait la poésie bengali Vaishnava aux côtés des lettres persanes et arabes, parrainait les traductions du Mahabharata en bengali par Maladhar Basu et Kavindra Parameshvara, employait le futur saint Vaishnava Sanatana Goswami comme secrétaire de cour avant sa renonciation et construisait des mosquées en brique typiquement bengali. idiomes s'inspirant de l'artisanat des temples hindous locaux. L'arrangement a enraciné le sultanat dans la population rurale hindoue et la noblesse terrienne, mais a offensé les oulémas orthodoxes qui cherchaient de l'autorité en dehors du Bengale."
 bng_naib_nazim_bureaucracy: "Naib Nazim de l'Est"
 bng_naib_nazim_bureaucracy_desc: "Le sous-gouverneur du Bengale oriental siégeait dans l'ancienne capitale moghole de Sonargaon et plus tard Dhaka, le doyen des trois nizamats subordonnés (les autres étant le Bihar et l'Orissa) sous le Nawab. Le Naib Nazim dirigeait le grand delta à mains libres, tenant sa propre cour, son propre trésor et ses propres faujdars ; en pratique, ce poste était un apanage que le Nawab offrait à un fils ou à un parent puissant, et il institutionnalisait la tension structurelle entre le port fluvial de l'Est et la capitale Murshidabad. Lorsque Sarfaraz Khan le tenait sous Shuja-ud-Din, les revenus de l'Est affluaient ; quand il ne l'a pas fait, ils ne l'ont pas fait."
 bng_subahdari_chancery_bureaucracy: "Chancellerie de Subahdari"
 bng_subahdari_chancery_bureaucracy_desc: "Le secrétariat persan du subah du Bengale, composé de scribes munshi issus des castes hindoues Kayastha et Khatri aux côtés de secrétaires musulmans formés par Mughal. La chancellerie gérait la correspondance diplomatique avec Delhi et les fermiers impériaux qui autorisaient chaque acte majeur du Nawabate, la rédaction des sanads pour les usines européennes de Hugli, Chinsura, Chandernagore et Calcutta, et la tenue de registres trilingues en persan, bengali et arabe qui liaient le subah à l'empire et au commerce mondial au-delà de celui-ci. Des plumes de la chancellerie sont sortis les mêmes traités qui, en 1765, transféraient les revenus du Bengale à une société étrangère."

 AUTO_MODIFIER_NAME_nd_bng_bureaucracy_authority: "Diwans de Murshidabad"
 AUTO_MODIFIER_DESC_nd_bng_bureaucracy_authority: "Les bureaux du Bengale (le diwan des impôts, la chancellerie, la monnaie, les faujdari thanas et les chambres du Naib Nazim) se sont durcis pour devenir un appareil institutionnel permanent. C’est sur cette base que prennent forme les institutions durables de l’État bengali, que le royaume réponde à un sultan à Gaur, à un Subadar à Dhaka ou à un Nawab à Murshidabad."
 nd_bng_bengali_type: "Bengali Movable Type"
 nd_bng_bengali_type_desc: "In 1778 the smith Panchanan Karmakar cut the first movable type for the Bengali script at Hooghly, and a grammar of the language was printed with it. From 1800 he and his pupils cast type at Serampore for Bengali and a dozen other scripts. A language that had lived in manuscript and recitation can now be set, printed and sold by the thousand."
