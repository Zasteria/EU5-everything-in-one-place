 # ============================================================
 # Variable tooltips
 # ============================================================
 nd_vjn_formed_tt: "L'Empire Karnata a été formé."
 nd_vjn_path_a_tt: "Karnata Destiny : la lignée Pampa-Virupaksha."
 nd_vjn_path_b_tt: "Karnata Destiny : la cour de Tuluva."
 nd_vjn_dest_vijayanagar_developed_tt: "We own #bold Vijayanagar#! and its development is at least #bold 49#!"
 nd_vjn_dest_pulicat_developed_tt: "We own #bold Pazhaverkadu#! (Pulicat) and its development is at least #bold 54#!"

 # ============================================================
 # Formation event
 # ============================================================
 nd_vjn.1.t: "La bannière du sanglier se lève"
 nd_vjn.1.d: "From the granite ridges above the Tungabhadra, the imperial gopurams of Vijayanagara lift their tiered crowns over a city of half a million. The throne of Hampi is yours: the Karnata Rajya restored, dharma defended, the southern peoples gathered under the saffron Varaha. But your court must choose its character. The Saluva-Tuluva transition has shown that the empire can be governed in two voices, and the rituals you privilege will define what your dynasty becomes.\n\nWill you raise the empire as the great patron of Saiva temple and Brahmin learning, anchoring legitimacy in the goddess Pampa-Virupaksha and the Sringeri matha, or will you walk the path of Krishnadeva Raya: a cosmopolitan court of Telugu poets, Vaishnava devotion, Portuguese horse-traders, and Persian envoys, an empire whose dharma flows outward through commerce?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_vjn.1.a: "La ligne Pampa-Virupaksha : temple, char et sanction brahmane"
 nd_vjn.1.b: "La cour de Tuluva : vers Telugu, dévotion Vaishnava, commerce extérieur"

 # ============================================================
 # Formation timed modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_vjn_pampa_virupaksha_line: "La ligne Pampa-Virupaksha"
 STATIC_MODIFIER_DESC_nd_vjn_pampa_virupaksha_line: "L’empire est ancré dans le rituel du temple Saiva et dans le matha Sringeri. L'approbation des brahmanes et la construction de temples monumentaux convertissent les peuples du sud et mobilisent une vaste main-d'œuvre pour l'armée impériale."
 STATIC_MODIFIER_NAME_nd_vjn_tuluva_court: "La Cour de Tuluva"
 STATIC_MODIFIER_DESC_nd_vjn_tuluva_court: "Dévotion Vaishnava, patronage littéraire Telugu et cour cosmopolite de Krishnadeva Raya. L'empire du Karnata commerce avec des marchands portugais, persans et arabes et accueille des envoyés de tout l'océan Indien."

 # ============================================================
 # Advance event 2: Krishnadeva Raya's coronation
 # ============================================================
 nd_vjn.2.t: "Le couronnement de Krishnadeva Raya"
 nd_vjn.2.d: "The third son of Tuluva Narasa Nayaka has taken the throne at Hampi. Krishnadeva (chess-master, polyglot, poet of the Amuktamalyada and patron of Allasani Peddana, scholar-warrior, and the most magnetic ruler in southern memory) is crowned at an enlarged Virupaksha temple in 1509. His reign offers two faces: Krishnadeva the philosopher-king who composed Telugu verses on statecraft, or Krishnadeva the dig-vijaya conqueror who broke the Gajapati at Kondavidu and humbled Bijapur at Raichur.\n\nHow shall your court remember him?"
 nd_vjn.2.a: "En tant qu'empereur-érudit : convoquer le Bhuvana Vijaya"
 nd_vjn.2.b: "En tant que conquérant dig-vijaya : chevauchez contre le doab"

 STATIC_MODIFIER_NAME_nd_vjn_amuktamalyada_reign: "Le règne d'Amuktamalyada"
 STATIC_MODIFIER_DESC_nd_vjn_amuktamalyada_reign: "Les vers et le patronage de l'empereur fleurissent en telugu, sanskrit, tamoul et kannada. La cour est l’étoile filante des lettres dravidiennes."
 STATIC_MODIFIER_NAME_nd_vjn_dig_vijaya_campaign: "Campagne Dig-Vijaya"
 STATIC_MODIFIER_DESC_nd_vjn_dig_vijaya_campaign: "Les armées du Karnata balayent le doab Krishna-Tungabhadra et s'écrasent sur la frontière de Gajapati. Le prestige de l'empire s'étend avec ses bannières."

 # ============================================================
 # Advance event 3: Portuguese horse trade
 # ============================================================
 nd_vjn.3.t: "Chevaux de la mer"
 nd_vjn.3.d: "The southern climate breaks horses; the empire imports its cavalry mounts. The Portuguese capture of Goa in 1510 has rearranged the trade. Arabian and Persian war-horses, once the lifeblood of the Bahmani cavalry, can now flow through Goa under continuous Portuguese factorage: reliable, sealed, and dependent on the Estado da India's goodwill. Or the empire can deal directly with the Hormuzi and Mappilla merchant houses at Bhatkal and Honnavar, paying lower prices for shipments that arrive when they arrive, with the Persian Gulf factors taking their margin in spices and saltpetre rather than Portuguese silver.\n\nThe Konkan ports are at the empire's command. The choice is whose horse-merchants they will host."
 nd_vjn.3.a: "Le facteur portugais à Goa. Approvisionnement continu, par traité."
 nd_vjn.3.b: "Les maisons Hormuzi à Bhatkal. Les chevaux arrivent, et aucune garnison étrangère non plus."
 STATIC_MODIFIER_NAME_nd_vjn_goa_partnership: "Partenariat Goa"
 STATIC_MODIFIER_DESC_nd_vjn_goa_partnership: "Les facteurs portugais à Goa livrent des chevaux de guerre arabes et persans à la cavalerie impériale sous contrat continu. L'approvisionnement est fiable, la cavalerie est montée et les Portugais sont courtisés par la faveur impériale."
 STATIC_MODIFIER_NAME_nd_vjn_hormuzi_merchants: "Marchands d'Ormuzi"
 STATIC_MODIFIER_DESC_nd_vjn_hormuzi_merchants: "Les maisons marchandes Hormuzi et Mappilla amènent des chevaux persans et arabes directement à Bhatkal et Honnavar. La cavalerie est montée à moindre prix et sans levier portugais, mais la cour hindoue doit apprendre à s'accommoder des princes marchands musulmans Konkani et les brahmanes de l'assemblée impériale râlent."

 # ============================================================
 # Advance event 4: Amara-Nayaka system
 # ============================================================
 nd_vjn.4.t: "Le système Amara-Nayaka codifié"
 nd_vjn.4.d: "Across the empire, the imperial court formalizes the system of amaram tenure: territorial governorships granted to nayaka commanders in exchange for sworn military service. Each amara-nayaka maintains a quota of cavalry, infantry, elephants, and forts; collects revenue from his territory's peasants, craftsmen, and merchants; and remits a portion to the imperial treasury. The system promises a vast standing army at the dynasty's call. It also creates dozens of military lords with armies of their own.\n\nThe court must decide how tightly the imperial chains will bind them."
 nd_vjn.4.a: "Contrôlez-les strictement : registres fiscaux, quotas scellés, affichages tournants"
 nd_vjn.4.b: "Récompensez-les généreusement : des prélèvements en échange d’autonomie"

 STATIC_MODIFIER_NAME_nd_vjn_loyal_nayakas: "Nayakas audités"
 STATIC_MODIFIER_DESC_nd_vjn_loyal_nayakas: "Les amara-nayakas servent sous des registres scellés et dans des postes tournants. La couronne les tient fermement et le trésor impérial se remplit."
 STATIC_MODIFIER_NAME_nd_vjn_imperial_levy: "Prélèvement impérial Nayaka"
 STATIC_MODIFIER_DESC_nd_vjn_imperial_levy: "Les amara-nayakas lèvent de vastes prélèvements en échange de la liberté de gestion de leurs amarams. Les bannières de l'empire flottent plus épaisses que jamais, même si les grands grandissent."

 # ============================================================
 # Advance event 5: Lessons of Talikota
 # ============================================================
 nd_vjn.5.t: "L'Ombre de Talikota évitée"
 nd_vjn.5.d: "The four-power Sultanate coalition assembled north of the Krishna in the manner of 1565: Bijapur, Ahmadnagar, Golconda, Bidar uniting their cavalry against the Karnata empire. In our world, on that Friday at Talikota, the Gilani brothers commanding Rama Raya's Muslim regiments defected mid-battle and the imperial line collapsed. The empire's regent was beheaded; Hampi was sacked for five months and never recovered.\n\nIn this age, your court has read that history before it could happen. The court purges, drills, and reorganizes the host. Two reform paths beckon: a unified command structure under a single field-marshal, or a thorough purification of court factions and dynastic rivals."
 nd_vjn.5.a: "Établir un commandement unifié sur le terrain et des exercices de style franc"
 nd_vjn.5.b: "Purger les factions ; plus de Gilanis à notre gorge"

 STATIC_MODIFIER_NAME_nd_vjn_unified_command: "Commandement impérial unifié"
 STATIC_MODIFIER_DESC_nd_vjn_unified_command: "L'armée impériale combat comme une seule colonne sous un seul Senapati, entraînée de manière continentale avec une artillerie massive. Les désastres du commandement divisé ne se reproduisent pas."
 STATIC_MODIFIER_NAME_nd_vjn_purified_court: "Cour purifiée"
 STATIC_MODIFIER_DESC_nd_vjn_purified_court: "Les factions de la cour sont dissoutes, la loyauté des commandants étrangers est examinée et l'établissement du temple est réaffirmé au cœur du rituel impérial. L’empire est idéologiquement unifié."

 # ============================================================
 # Advance event 6: Bhuvana Vijaya / Ashtadiggajas
 # ============================================================
 nd_vjn.6.t: "La salle de la conquête mondiale"
 nd_vjn.6.d: "Within the new pillared hall called Bhuvana Vijaya (the Hall of World-Conquest), the emperor convenes the literary court. Two factions wait on his patronage. The Ashtadiggajas, the eight 'elephants of the directions,' speak in Telugu: Allasani Peddana the andhra-kavita-pitamaha, Nandi Thimmana of Parijatapaharanam, Pingali Surana of the bilingual Raghava-Pandaviyam, Tenali Ramakrishna the wit. Beside them stand the Sanskrit kavya pandits of Vyasa Tirtha's circle, scholars of the Madhva matha and the dvaita Vedanta, keepers of pan-Indian classical learning, advocates of a Sanskrit court legible to every brahmin from Kashmir to Sri Lanka.\n\nThe emperor's purse can elevate one school to court office. The other will keep its honour but lose its first claim on imperial patronage."
 nd_vjn.6.a: "Le telugu est désormais une langue du dharma. Les Ashtadiggajas en résidence."
 nd_vjn.6.b: "Vyasa Tirtha à notre droite. Le sanskrit kavya est la voix de l'empire."
 STATIC_MODIFIER_NAME_nd_vjn_telugu_bhuvana: "Telugu Bhuvana"
 STATIC_MODIFIER_DESC_nd_vjn_telugu_bhuvana: "Les Ashtadiggajas en résidence au Hall de la Conquête Mondiale. Le Telugu vernaculaire devient la langue de l'empire administrée, enseignée et récitée dans les tribunaux, de Pulicat à Krishna. L'énergie littéraire d'un continent circule à travers les canaux du Karnata."
 STATIC_MODIFIER_NAME_nd_vjn_sanskrit_kavya: "Kavya sanskrit"
 STATIC_MODIFIER_DESC_nd_vjn_sanskrit_kavya: "Le dvaita matha de Vyasa Tirtha se lève à la cour. L'érudition classique panindienne donne le ton du discours impérial : tous les brahmanes du nord et du sud reconnaissent le Karnata comme un empereur du dharma, et les chroniques de l'empire sont lues dans le même sanscrit, du Cachemire à Lanka."

 # ============================================================
 # Advances: Age 1
 # ============================================================
 nd_vjn_sangama_foundation: "Fondation Sangama"
 nd_vjn_sangama_foundation_desc: "Harihara et Bukka, captifs des Tughluqs devenus fondateurs, élèvent Vijayanagara sur la rive sud de la Tungabhadra en 1336 comme rempart hindou contre l'avancée sud du sultanat. La dynastie tire sa légitimité du Saiva matha de Sringeri et de la déesse Pampa de Hampi."
 nd_vjn_kuravar_levies: "Prélèvements de Kuravar"
 nd_vjn_kuravar_levies_desc: "Les peuples des collines des Ghâts occidentaux et orientaux, les Kuravas, les Irulas et les castes forestières plus larges, fournissent des archers d'escarmouche et des porteurs de javelot à l'armée impériale. Ils connaissent la jungle et les sentiers de montagne ; la cavalerie impériale traverse le territoire qu'elle a déjà cartographié."
 nd_vjn_vidyaranya_sanction: "La sanction de Vidyaranya"
 nd_vjn_vidyaranya_sanction_desc: "Vidyaranya, le pontife Advaita Vedantin du Sringeri Sharada Peetham, bénit la fondation Sangama et donne la sanction spirituelle à la dynastie. Le matha prête son clergé érudit à la cour impériale ; l'empire est né sous la main d'un sage."
 nd_vjn_tank_irrigation: "Irrigation de réservoir"
 nd_vjn_tank_irrigation_desc: "La vallée de Tungabhadra est parsemée de réservoirs en terre kere alimentés par des barrages de dérivation anicut de l'autre côté du fleuve. Le canal Hiriya irrigue à lui seul Hampi, Kamalapura et les domaines impériaux. L'agriculture du Karnata est un festin où les pluies à elles seules seraient une famine."
 nd_vjn_dravidian_architecture: "Architecture du temple dravidien"
 nd_vjn_dravidian_architecture_desc: "Gopurams pyramidaux, mantapas étagés, piliers yali sculptés, Nandis monolithiques, rues processionnelles alignées vers le sanctuaire : l'école Vijayanagara synthétise les héritages Chola, Pallava, Hoysala et Pandya en un idiome impérial unifié."
 nd_vjn_bhakti_traditions: "Traditions de dévotion Bhakti"
 nd_vjn_bhakti_traditions_desc: "Les Alvars et les Nayanars chantaient la dévotion en tamoul ; les Haridasas le chantent désormais en kannada et en telugu. Purandaradasa, Kanakadasa et Vyasaraja unissent les peuples du sud dans une langue vernaculaire de dévotion commune qui va plus loin que la dynastie."

 # ============================================================
 # Advances: Age 2
 # ============================================================
 nd_vjn_devaraya_court: "La Cour de Devaraya II"
 nd_vjn_devaraya_court_desc: "Devaraya II, dit Gajabetegara le chasseur d'éléphants reçoit à Hampi l'ambassade d'Abdul Razzaq de Herat timouride (1442) et le marchand Niccolo de' Conti de Venise. La portée diplomatique de la cour s'étend désormais à la Perse, au Bahmani Deccan, à l'océan Indien et à la Méditerranée."
 nd_vjn_amara_nayaka_system: "Le système Amara-Nayaka"
 nd_vjn_amara_nayaka_system_desc: "Des postes de gouverneur territoriaux appelés amarams sont accordés aux commandants nayaka en échange d'un service militaire assermenté : cavalerie, infanterie, éléphants, forts et d'une part des revenus remise. L'empire lève des armées grâce à une bureaucratie féodale-militaire unique au Karnata."
 nd_vjn_saluva_consolidation: "La consolidation Saluva"
 nd_vjn_saluva_consolidation_desc: "Après le chaos de la fin de la succession Sangama, Saluva Narasimha s'empare du trône en 1485, restaure le trésor impérial et réforme l'armée sur le modèle de Vir Vir Narasimha. L'empire centralise."
 nd_vjn_swarnakara_guilds: "Guildes de bronze de Swarnakara"
 nd_vjn_swarnakara_guilds_desc: "Les swarnakara, les orfèvres du sud perpétuent la tradition de la cire perdue Chola qui a produit les bronzes de Nataraja et de Tirupati. Les ateliers impériaux produisent des icônes de procession en bronze, des lampes rituelles, des accessoires d'épée et des armures d'éléphant pour les temples et les armées de l'empire."
 nd_vjn_cosmopolitan_court: "La Cour cosmopolite"
 nd_vjn_cosmopolitan_court_desc: "Les Perses, les Arabes, les Italiens, les Portugais et les Tibétains franchissent la porte Bhima de Hampi. La cour parle telugu, sanskrit et persan ; le registre impérial est tenu en quatre écritures. L’empire du Karnata est la puissance hindoue la plus polyglotte au monde."
 nd_vjn_imperial_elephant_corps: "Corps impérial des éléphants"
 nd_vjn_imperial_elephant_corps_desc: "L'empire garde des milliers d'éléphants de guerre dans les écuries de Hampi, Penukonda et Anegondi. Des howdahs blindés, des commandants de palanquins et une caste de cornacs de maîtres-éléphants héréditaires soutiennent la tradition gajapati que l'empire du Karnata porte comme la sienne."

 # ============================================================
 # Advances: Age 3
 # ============================================================
 nd_vjn_krishnadeva_coronation: "Le couronnement de Krishnadeva Raya"
 nd_vjn_krishnadeva_coronation_desc: "Le troisième fils de Tuluva Narasa Nayaka, né en 1471, est couronné à Hampi en 1509. Soldat, érudit, homme d'État, polyglotte, poète de l'Amuktamalyada Krishnadeva régnera vingt ans et portera l'empire à son apogée absolue."
 nd_vjn_ashtadiggajas: "Les Ashtadiggajas"
 nd_vjn_ashtadiggajas_desc: "Huit « éléphants des directions » remplissent le Bhuvana Vijaya impérial, la salle de la conquête mondiale. Allasani Peddana, Nandi Thimmana, Tenali Ramakrishna, Pingali Surana et leurs camarades élèvent la littérature Telugu à un âge d'or et font de Hampi l'Athènes du sud."
 nd_vjn_arabian_horse_trade: "Le commerce des chevaux à Goa"
 nd_vjn_arabian_horse_trade_desc: "La prise de Goa par les Portugais en 1510 détourne le commerce des chevaux arabes et persans via des facteurs alliés au Karnata. La cavalerie lourde de l'empire, longtemps gênée par le climat méridional, chevauche finalement à grande échelle les Arabes importés."
 nd_vjn_coastal_emporia: "Emporia côtière"
 nd_vjn_coastal_emporia_desc: "Bhatkal, Honavar, Mangalore, Cochin, Kollam, Pulicat, Masulipatnam : l'empire du Karnata contrôle les côtes sud du côté de Malabar et de Coromandel. Les épices coulent à flots, les chevaux et l'argent affluent."
 nd_vjn_dig_vijaya_doctrine: "Doctrine Dig-Vijaya"
 nd_vjn_dig_vijaya_doctrine_desc: "La campagne hindoue classique de conquête dans toutes les directions, le dig-vijaya, est reformulée sous Krishnadeva comme une doctrine de colonnes à marche rapide, de réduction des forts par des canons retranchés et d'humiliation systématique des tribunaux feudataires."
 nd_vjn_strategic_diplomacy: "Diplomatie stratégique"
 nd_vjn_strategic_diplomacy_desc: "L’empire ne combat jamais tous les sultanats à la fois. Bijapur est humilié tandis qu'Ahmadnagar est réconcilié ; Golconde est courtisée tandis que Berar est victime d'intimidation. L'instinct diplomatique de Krishnadeva empêche la formation d'une coalition de quatre puissances pendant une génération."

 # ============================================================
 # Advances: Age 4
 # ============================================================
 nd_vjn_gajadhwaja_corps: "Le Corps des éléphants de Gajadhwaja"
 nd_vjn_gajadhwaja_corps_desc: "Sous le gajadhwaja, la bannière des éléphants, le corps impérial des éléphants de guerre est réorganisé en régiments permanents. Les Howdahs sont blindés contre les armes à feu ; les cornacs sont formés dès l'enfance ; le Karnata gajasena devient la force d'éléphants la plus redoutée du sous-continent."
 nd_vjn_aravidu_restoration: "La restauration Aravidu"
 nd_vjn_aravidu_restoration_desc: "La dynastie Aravidu sous Tirumala et ses successeurs restaure l'empire des capitales du sud Penukonda, Chandragiri, Vellore et récupère le doab. Le Karnata Rajya perdure là où il est tombé dans notre chronologie."
 nd_vjn_persian_factors: "Facteurs persans et arabes"
 nd_vjn_persian_factors_desc: "Les agents commerciaux impériaux d'Ormuz, d'Aden et de Mascate établissent des comptoirs dans les villes portuaires de Karnata. Les exportations d'épices de l'empire s'écoulent vers le nord via les réseaux marchands perses ; les importations de chevaux et d’argent reviennent."
 nd_vjn_lessons_of_talikota: "Les leçons de Talikota"
 nd_vjn_lessons_of_talikota_desc: "Qu'elles aient été évitées ou survécues, les leçons de la plaine de Talikota sont absorbées : jamais un commandement divisé ; ne faites jamais confiance aux capitaines mercenaires au-delà de leur dernier mois de paie ; réservez toujours une force de regroupement ; connaissez toujours les envoyés de l'ennemi avant la bataille."
 nd_vjn_pluralist_patronage: "Patronage pluraliste"
 nd_vjn_pluralist_patronage_desc: "Madhva mathas à Udupi, les pontifes Sringeri Advaita, Veerashaiva matas, Jain bastis et les temples Vaishnava à Tirupati et Srirangam reçoivent tous une dotation impériale. L’empire du Karnata patronne tous les courants hindous sans les forcer à dominer."
 nd_vjn_telugu_court_language: "Telugu comme langue de la cour impériale"
 nd_vjn_telugu_court_language_desc: "L'héritage Amuktamalyada de Krishnadeva élève le telugu aux côtés du sanscrit et du kannada en tant que langue de l'administration impériale. Les inscriptions, les subventions et les épopées de cour se déroulent désormais en quatre écritures ; les peuples dravidiens sont liés par leurs propres lettres à la vision impériale."

 # ============================================================
 # Advances: Age 5
 # ============================================================
 nd_vjn_nayaka_reincorporation: "La réincorporation des royaumes Nayaka"
 nd_vjn_nayaka_reincorporation_desc: "Madurai sous les Nayaks de Madurai, Thanjavur sous les Nayaks de Thanjavur, Gingee, Mysore, Ikkeri : les principautés sécessionnistes nayaka de l'effondrement post-Talikota sont ramenées sous l'autorité impériale directe. Le Karnata Rajya est entier."
 nd_vjn_imperial_treasury: "Le Trésor Impérial"
 nd_vjn_imperial_treasury_desc: "La réforme fiscale du Karnata consolide les multiples systèmes fiscaux régionaux en un trésor impérial unifié à Hampi, avec des trésors subsidiaires à Penukonda et Madurai. L'évaluation des revenus est régularisée ; les excédents financent le programme monumental impérial."
 nd_vjn_coromandel_textiles: "Manufactures textiles de Coromandel"
 nd_vjn_coromandel_textiles_desc: "Madras, Pulicat, Masulipatnam, Pondichéry, Sadras : les manufactures textiles de la côte de Coromandel produisent les plus beaux cotons peints et teints du monde moderne. Le tissu Karnata habille la Perse, l'Arabie, les îles aux épices et, de plus en plus, l'Europe."
 nd_vjn_dravidian_naval_doctrine: "Doctrine navale dravidienne"
 nd_vjn_dravidian_naval_doctrine_desc: "Les escadrons impériaux sur les côtes de Malabar et de Coromandel établissent une doctrine navale du Karnata : des frégates à faible tirant d'eau pour les eaux de mousson, associées à des navires lourds de style européen achetés via Goa ou construits dans les chantiers navals de Cochin et Pulicat."

 # ============================================================
 # Advances: Age 6
 # ============================================================
 nd_vjn_karnata_renaissance: "La Renaissance du Karnata"
 nd_vjn_karnata_renaissance_desc: "Telugu moderne sous Gurazada Apparao, Kannada moderne sous les antécédents de Kuvempu, Tamil moderne sous les précurseurs de Subramania Bharati, Malayalam moderne sous les héritiers d'Ezhuthachan : les langues dravidiennes entrent ensemble dans l'ère de l'imprimerie, fusionnées par le patronage continu de la cour impériale des quatre."
 nd_vjn_industrial_coromandel: "Coromandel industriel"
 nd_vjn_industrial_coromandel_desc: "Les filatures de coton à vapeur à Madras et Madurai, les fonderies de bronze mécanisées à Salem et les plantations de thé dans les Nilgiris font entrer l'économie impériale dans l'ère industrielle tout en préservant les guildes de swarnakara et de tisserands en tant que partenaires de main-d'œuvre qualifiée."
 nd_vjn_dravidian_cabinet: "Le cabinet dravidien"
 nd_vjn_dravidian_cabinet_desc: "Le gouvernement de cabinet moderne mène ses affaires en telugu, tamoul, kannada et malayalam, la machine impériale quadrilingue qu'aucun empire européen n'a jamais réussi à supplanter."
 nd_vjn_imperial_conscription: "Conscription impériale"
 nd_vjn_imperial_conscription_desc: "Les levées amara-nayaka sont réformées sous un commandement impérial uniforme : régiments standardisés, entraînés à la mode franque, équipés des arsenaux impériaux, enrôlés par tirage au sort dans les districts quadrilingues. L'armée du Karnata se modernise sans perdre son ancrage territorial."

 # ============================================================
 # Custom units
 # ============================================================
 a_nd_vjn_kuravar_archers: "Archers kuravars"
 a_nd_vjn_kuravar_archers_desc: "Tirailleurs des collines des Ghâts occidentaux et orientaux. Armés d'une armure légère, mobiles et à l'aise dans la jungle et les collines, les archers Kuravar font écran et se battent loin devant la cavalerie impériale."
 a_nd_vjn_arabian_warhorse: "Cheval arabe impérial"
 a_nd_vjn_arabian_warhorse_desc: "Cavalerie lourde montée sur des chevaux de guerre arabes et persans importés via Goa. Le bras de choc emblématique de l'empire Karnata sous les dynasties Tuluva et Aravidu, rapide, discipliné et faisant contrepoids à la cavalerie du Sultanat."
 a_nd_vjn_imperial_war_elephant: "Éléphant de guerre de Gajadhwaja"
 a_nd_vjn_imperial_war_elephant_desc: "Régiments permanents d'éléphants blindés sous la bannière impériale gajadhwaja. Cornacs formés dès l'enfance; des howdahs renforcés contre les armes à feu ; l'éléphant-bannière du sud."

 # ============================================================
 # Custom levies
 # ============================================================
 levy_nd_vjn_kuravar_archers: "Prélèvement d'archer Kuravar"
 levy_nd_vjn_kuravar_archers_desc: "Prélèvement de Kuravar et d'archers des castes forestières des régions montagneuses du sud."

 # ============================================================
 # Custom buildings
 # ============================================================
 nd_vjn_dravidian_temple_complex: "Complexe du temple dravidien"
 nd_vjn_dravidian_temple_complex_desc: "Complexe de temples impériaux Saiva-Vaishnava avec gopurams monumentaux, mantapas à piliers, colonnes yali sculptées et réservoir sacré. Le style Hampi Vittala, Hazara Rama, Virupaksha exporté à travers tout l'empire."
 nd_vjn_temple_maintenance: "Dotation du temple"
 nd_vjn_temple_maintenance_desc: "Dotation impériale du rituel quotidien du temple : vases en poterie, réparation de la maçonnerie, cire d'abeille pour les lampes et encens pour le sanctuaire."

 nd_vjn_amara_nayaka_estate: "Domaine Amara-Nayaka"
 nd_vjn_amara_nayaka_estate_desc: "Siège seigneurial fortifié d'un amara-nayaka, un seigneur militaire détenant un territoire en échange de cavalerie, d'infanterie, d'éléphants et de forts. L'épine dorsale de l'organisation militaire du Karnata."
 nd_vjn_nayaka_maintenance: "Établissement Nayaka"
 nd_vjn_nayaka_maintenance_desc: "Maintien du quota de troupes de l'amara-nayaka : chevaux de guerre, armes, bétail pour la suite et les rations, tissus pour les uniformes et les tentes."

 nd_vjn_tungabhadra_anicut: "Tungabhadra Anicut"
 nd_vjn_tungabhadra_anicut_desc: "Réservoir en terre alimenté par un barrage-dérivation anicut. Le modèle du canal Hiriya : les flux de mousson captés dans des réservoirs, des canaux alimentant les rizières et les vergers. La fondation agricole impériale."
 nd_vjn_anicut_maintenance: "Entretien d'Anicut"
 nd_vjn_anicut_maintenance_desc: "Parement en pierre du barrage de dérivation, des écluses en bois et réparation saisonnière de la maçonnerie après la crue de la mousson."

 nd_vjn_bhuvana_vijaya: "Bhuvana Vijaya"
 nd_vjn_bhuvana_vijaya_desc: "La salle de la conquête mondiale. Salle impériale à piliers abritant la cour des poètes Ashtadiggajas et les académies littéraires en telugu, sanscrit, kannada et tamoul. La cour des lettres du Karnata."
 nd_vjn_court_maintenance: "Patronage impérial"
 nd_vjn_court_maintenance_desc: "Dotation impériale de l'académie littéraire : papier pour les manuscrits, livres pour la bibliothèque impériale, tissus fins pour les robes de cour et encens pour les assemblées de cérémonie."

 nd_vjn_swarnakara_workshop: "Atelier Swarnakara"
 nd_vjn_swarnakara_workshop_desc: "Atelier de guilde d'orfèvres et de fondeurs de bronze perpétuant la tradition de la cire perdue Chola. Icônes de procession, lampes rituelles, bijoux et garnitures d'épées proviennent des ateliers du Karnata à travers l'océan Indien."
 nd_vjn_bronze_casting: "Coulée de bronze à la cire perdue"
 nd_vjn_bronze_casting_desc: "Cuivre et étain alliés par la méthode de la cire perdue pour fabriquer des outils, des accessoires et des ustensiles rituels. La signature métallurgique dravidienne."
 nd_vjn_chola_bronzework_tradition: "Tradition du bronze Chola"
 nd_vjn_chola_bronzework_tradition_desc: "La tradition Chola de la cire perdue qui a produit les bronzes de Nataraja et de Tirupati est préservée dans les ateliers impériaux de swarnakara. Icônes de procession, bijoux royaux et lampes rituelles circulent désormais des ateliers du Karnata vers les cours et les temples de tout l'océan Indien."
 nd_vjn_pulicat_emporia: "Pulicat Emporia"
 nd_vjn_pulicat_emporia_desc: "Madras, Pulicat, Masulipatnam, Sadras, Pondichéry : les emporia de la côte de Coromandel gèrent le commerce des épices et du textile de l'empire. Les facteurs impériaux négocient avec les sociétés commerciales européennes aux conditions du Karnata."
 nd_vjn_imperial_cannon_doctrine: "Doctrine du canon impérial"
 nd_vjn_imperial_cannon_doctrine_desc: "Les ateliers de swarnakara sont réorganisés en fonderies de canons impériales, fondant des pièces de campagne en bronze et en fer pour l'armée du Karnata. La tradition métallurgique dravidienne transforme son savoir-faire de cloche de temple en canon de siège."
 nd_vjn_modernized_garrisons: "Garnisons Nayaka modernisées"
 nd_vjn_modernized_garrisons_desc: "Amara-nayaka troop quotas modernize: firearms in place of swords and bows, drilled musketry, standardized uniforms. The nayaka forts are held by modern garrisons without losing their territorial character."
 nd_vjn_pulicat_factory: "Usine Pulicat"
 nd_vjn_pulicat_factory_desc: "Complexe d'usine et d'entrepôts de commerce côtier de Karnata. Entrepôts, postes de douane, quartiers des facteurs et quais de chargement pour le commerce du coton, de l'indigo et des épices de Coromandel."
 nd_vjn_pulicat_maintenance: "Opérations d'usine"
 nd_vjn_pulicat_maintenance_desc: "Entretien des entrepôts, des cuves de teinture et des bureaux comptables de l'usine : balles de tissus, conteneurs de poterie, échantillons de tissus fins pour les acheteurs et encens pour le hall de réception du facteur."
 nd_vjn_chola_bronzework: "Bronzerie Chola"
 nd_vjn_chola_bronzework_desc: "Fonte de bronze à la cire perdue haut de gamme : icônes de procession, bijoux et objets de cérémonie. La sortie des guildes Karnata swarnakara à leur apogée impériale."
 nd_vjn_imperial_cannon_foundry: "Fonderie de canon impériale"
 nd_vjn_imperial_cannon_foundry_desc: "Les guildes de swarnakara du Karnata se tournèrent vers la fonderie de canons impériaux : pièces de campagne en bronze et en fer pour l'armée du sud."
 nd_vjn_gajashala: "Gajashala"
 nd_vjn_gajashala_desc: "The domed elephant stables of a royal seat, as they stand at Hampi. War elephants are kept, armoured and trained here by a hereditary caste of mahouts, and regiments can be raised where the stables stand. The animals eat a district's worth of grain."
 nd_vjn_gajashala_maintenance: "Stable Keeping"
 nd_vjn_gajashala_maintenance_desc: "Elephants bought to replace the old and the dead, rice for fodder, leather for harness and howdah straps, and tools for the mahouts."

 # ============================================================
 # DESTINY TREE
 # ============================================================

 # ---- Destiny advance names and descriptions ----
 nd_vjn_destiny: "Le destin du Karnata"
 nd_vjn_destiny_desc: "Vijayanagara est restauré : les gopurams impériaux s'élèvent au-dessus de Hampi et les peuples du sud se rassemblent sous le Varaha safrané. Mais que deviendra l’empire ? Deux projets à long terme appellent le grand travail du dharma dans le nord et le grand travail de l'océan Indien. Pour entreprendre l’un ou l’autre, il faut avant tout de la stabilité."

 nd_vjn_dest_bahmani_frontier: "Marche sur la frontière Bahmani"
 nd_vjn_dest_bahmani_frontier_desc: "Les sultanats successeurs de Bahmani Bidar et de Bijapur, les premiers d’entre eux, sont situés de l’autre côté du Krishna et du Tungabhadra, les portes mêmes de l’expansion impériale vers le nord. L'hôte du Karnata doit les récupérer avant que le plateau du Deccan lui-même puisse être appelé celui de Vijayanagara."

 nd_vjn_dest_deccan_plateau: "Récupérer le plateau du Deccan"
 nd_vjn_dest_deccan_plateau_desc: "Beyond Bidar and Bijapur lie Gulbarga, Daulatabad, and Ahmednagar: the Bahmani heartland and the great Tughluq capital that once tried to swallow the south. To take them is to reverse the southward conquest of the fourteenth century and reset the imperial frontier on the Tapti. Vijayanagara itself must grow into a capital fit for the whole plateau."

 nd_vjn_dest_imperial_heartland: "Le cœur impérial restauré"
 nd_vjn_dest_imperial_heartland_desc: "De Surat sur la côte du Gujarat à Agra dans le bassin de la Yamuna, des mines de diamants de Golconde à l'ancienne citadelle de Warangal, l'empire du Karnata revendique les frontières impériales d'un dharma-raj indivis. Le Diwan-Khana du sud s'élève à Hampi, chancellerie digne de l'héritier de Bharata."

 nd_vjn_dest_konkan_thalassocracy: "La Thalassocratie Konkan"
 nd_vjn_dest_konkan_thalassocracy_desc: "La côte de Konkan Le port de Bombay et les quais de construction portugaise de Goa constituent le premier océan de l'empire. Le contrôler, c'est placer la bannière du dharma sur le commerce de la mer d'Oman et recevoir des chevaux, de l'argent et du bois de construction selon les propres conditions de l'empire."

 nd_vjn_dest_lanka_maldives: "Lanka et les atolls des Maldives"
 nd_vjn_dest_lanka_maldives_desc: "Sri Lanka (Kotte, Kandy) and the long arc of Maldive atolls lie astride the trade lanes from East Africa to Sumatra. To plant the imperial banner there is to take the keys to the Indian Ocean. The treasury must be full enough to fit out the fleets first."

 nd_vjn_dest_indian_ocean_apex: "Seigneur de l'Océan Indien"
 nd_vjn_dest_indian_ocean_apex_desc: "Malacca to the east, Hormuz to the west, Aden at the gate of the Red Sea: the three pivots of the Indian Ocean. To hold them is to be sovereign of the largest trade ocean on earth. Pulicat must grow into a great port, and there the Coromandel Bourse rises to clear the world's silk and spice."

 # ---- Destiny event 7: root ----
 nd_vjn.7.t: "Le destin du Karnata"
 nd_vjn.7.d: "Depuis le granit de Tungabhadra, depuis le trône de Hampi, l'empire surveille l'œuvre des générations à venir. Les lignes Saluva, Tuluva et Aravidu ont fondé un dharma-raj qu'aucune coalition du Sultanat ne peut briser ; les pontifes matha ont béni les insignes impériaux ; les guildes de swarnakara ont jeté une bannière Garuda en bronze et en or. Maintenant, le long travail commence. Deux destins s'ouvrent. On fait face au nord pour reconquérir le plateau du Deccan et au-delà, pour annuler la conquête du XIVe siècle, pour restaurer le cœur du dharma au cœur impérial de Bharata. On se tourne vers la mer pour hériter de l’océan Indien, pour planter la bannière impériale sur Lanka, les Maldives, Malacca, Ormuz, Aden et pour construire un empire commercial qu’aucune entreprise européenne ne peut égaler. Le tribunal choisit ; l'empire s'engage."
 nd_vjn.7.a: "Laissez le destin de Vijayanagara se dérouler."

 # ---- Destiny event 8: Bahmani Frontier ----
 nd_vjn.8.t: "Le Krishna traversé"
 nd_vjn.8.d: "Les murs de Bidar sont tombés ; Les nobles de Bijapur ont rendu la citadelle. Le Krishna a été franchi en force et les bannières impériales flottent sur le plateau ouvert du Deccan pour la première fois depuis les invasions Tughluq du XIVe siècle. Dans tout l’empire, les cloches des temples sonnent ; le matha Sringeri envoie des manuscrits à la feuille d'or à Hampi ; les amara-nayakas prêtent de nouveaux serments sur la poussière des forteresses conquises. La frontière Bahmani, la limite sud de l'éclipse du Dharma depuis deux siècles, n'existe plus."
 nd_vjn.8.a: "Continuation vers le Tapti et le Narmada."

 # ---- Destiny event 9: Reclaim the Deccan ----
 nd_vjn.9.t: "Daulatabad restauré"
 nd_vjn.9.d: "La grande forteresse de Daulatabad Devagiri avant que les Tughluqs ne la rebaptisent, la citadelle rocheuse dont Muhammad bin Tughluq a tenté de faire la capitale de son empire en ruine est entre les mains du Karnata. Gulbarga, la capitale originelle des Bahmani, s'est rendue. Les nobles d'Ahmednagar pilotent le Garuda. Le plateau du Deccan, du Tapti au Krishna, est restauré au dharma. Deux questions se posent à la cour : comment débourser la richesse conquise et comment maintenir la nouvelle frontière."
 nd_vjn.9.a: "Distribuez les trésors du Sultanat : remplissez les coffres impériaux"
 nd_vjn.9.b: "Garnison du Deccan : détenir chaque fort, financer avec des emprunts de guerre"

 STATIC_MODIFIER_NAME_nd_vjn_dest_sultanate_treasure: "Trésors du Sultanat"
 STATIC_MODIFIER_DESC_nd_vjn_dest_sultanate_treasure: "Les richesses pillées de Daulatabad et de Bidar inondent le trésor impérial et les dotations du temple. La prospérité augmente dans tout l’empire ; mais le coût de la légitimité du pillage des villes anciennes pèse sur la conscience impériale."

 STATIC_MODIFIER_NAME_nd_vjn_dest_deccan_garrisoned: "Deccan en garnison"
 STATIC_MODIFIER_DESC_nd_vjn_dest_deccan_garrisoned: "Chaque fort Bahmani abrite une garnison Karnata, financée par des emprunts de guerre impériaux auprès des banques de Hampi. La portée logistique de l'empire s'étend à travers le plateau et le casus belli de la restauration du dharma a un nouveau poids ; les intérêts du prêt sont un prix qui vaut la peine d'être payé."

 # ---- Destiny event 10: Imperial Heartland ----
 nd_vjn.10.t: "L'empire de Bharata"
 nd_vjn.10.d: "De Surat sur la côte gujarati où l'empereur moghol Akbar ne siégera plus, en passant par Agra et le bassin de la Yamuna, en passant par le pays diamantifère de Golconde, jusqu'à l'ancienne citadelle de Kakatiya de Warangal : la frontière impériale a atteint le point culminant de toutes les grandes dynasties du sud de l'Inde auparavant. Le Diwan-Khana s'élève à Hampi, une chancellerie dont les salles voûtées parlent Telugu, Sanskrit, Persan et Marathi. La cour doit décider quel genre d'empire doit être : un empire de paix du dharma, ou l'empire de souveraineté universelle du chakravartin."
 nd_vjn.10.a: "Dharma Paramount : gouverner par la paix impériale"
 nd_vjn.10.b: "Chakravartin : revendiquer la souveraineté universelle sur Bharata"

 STATIC_MODIFIER_NAME_nd_vjn_dest_dharma_paramount: "Dharma primordial"
 STATIC_MODIFIER_DESC_nd_vjn_dest_dharma_paramount: "L'empire règne selon la paix du dharma : il est tolérant envers tous les courants hindous et tous les autres courants, gouvernant par la négociation et l'exemple. La cour est animée d’une mission et la diplomatie de l’empire porte le poids de l’autorité morale."

 STATIC_MODIFIER_NAME_nd_vjn_dest_chakravartin: "Chakravartin"
 STATIC_MODIFIER_DESC_nd_vjn_dest_chakravartin: "L'empereur prend le titre de chakravartin monarque universel, tourneur de roue, souverain des quatre directions. Des sujets de toutes sortes servent la roue impériale ; le prestige du nom de l’empire ne s’efface pas ; de nouvelles guerres s’ouvrent devant lui à mesure que la roue tourne."

 # ---- Destiny event 11: Konkan Thalassocracy ----
 nd_vjn.11.t: "La mer d'Oman est à nous"
 nd_vjn.11.d: "Les quais de Goa construits par les Portugais, réparés par les artisans du Karnata et le port en eaux profondes de Bombay arborent désormais la bannière Garuda. Des escadrons impériaux de frégates à faible tirant d'eau patrouillent la côte du Konkan, de Sindhudurg à Bhatkal. Le cheval arabe, l'argent persan, le café yéménite et le poivre d'Aceh transitent désormais par les facteurs du Karnata selon les conditions fixées à Hampi. L’empire est devenu une puissance océanique et la longue thalassocratie du sud commence."
 nd_vjn.11.a: "La mer d'Oman est le premier lac de l'empire."

 # ---- Destiny event 12: Lanka and Maldives ----
 nd_vjn.12.t: "La Perle du Sud"
 nd_vjn.12.d: "La relique de la dent de Kotte, la citadelle de Kandy et le long arc des atolls des Maldives, Male, Addu, Thiladhunmathi sont des possessions impériales. La pêche aux perles de Mannar et la monnaie des cauris des Maldives alimentent l'économie impériale. La sangha Theravada de Lanka a été honorée à Hampi ; les sultans des Maldives servent de vassaux impériaux. Deux stratégies se suggèrent : gouverner Lanka en tant que province impériale directement gouvernée, ou intégrer les atolls dans un vaste réseau de facteurs commerciaux."
 nd_vjn.12.a: "Lanka comme province impériale : domination directe, reconstruction monumentale"
 nd_vjn.12.b: "Usines commerciales des Maldives : un réseau léger d’agents impériaux"

 STATIC_MODIFIER_NAME_nd_vjn_dest_lanka_dominion: "La domination de Lanka"
 STATIC_MODIFIER_DESC_nd_vjn_dest_lanka_dominion: "Le Sri Lanka est gouverné comme une province impériale directement administrée. Les routes impériales, la reconstruction de temples monumentaux et les brigades de dévastation restaurent l'île. La portée coloniale de l’empire s’étend et l’inflation des espèces conquises est freinée par une administration ordonnée."

 STATIC_MODIFIER_NAME_nd_vjn_dest_maldive_factor: "Le réseau Maldives Factor"
 STATIC_MODIFIER_DESC_nd_vjn_dest_maldive_factor: "Les facteurs impériaux sont stationnés dans les atolls des Maldives, dans les ports du sud de Lanka et sur la côte des Laquedives. Les coûts d’établissement des commerçants s’effondrent ; la capacité marchande augmente ; les escadrons impériaux imposent des blocus contre tout rival qui ose les mers du sud."

 # ---- Destiny event 13: Lord of the Indian Ocean ----
 nd_vjn.13.t: "Seigneur des Trois Océans"
 nd_vjn.13.d: "Malacca, Ormuz, Aden : les trois pivots du commerce de l'Océan Indien. Malacca sur le détroit qui sépare le golfe du Bengale de la mer de Chine méridionale ; Ormuz sur le détroit qui ouvre la porte du golfe Persique ; Aden au goulot d'étranglement de la mer Rouge. L'empire qui détient les trois est souverain de l'océan commercial, seigneur de la soie et des épices qui coulent de Canton à Lisbonne. La Bourse Impériale de Coromandel s'élève à Pulicat, le plus grand bureau de douane et bourse de l'Océan Indien. L’empire est à son apogée en matière d’empire commercial."
 nd_vjn.13.a: "Le Karnata Pax of the Seas : les flottes impériales font respecter l'ordre"
 nd_vjn.13.b: "Sociétés commerciales impériales : des facteurs agréés animent le réseau"

 STATIC_MODIFIER_NAME_nd_vjn_dest_sea_lords: "Le Karnata Pax des Mers"
 STATIC_MODIFIER_DESC_nd_vjn_dest_sea_lords: "La flotte impériale impose la paix sur trois océans. Navires lourds de ligne et frégates légères ensemble ; coques renforcées ; des équipages rigoureusement formés. Aucune escadre de compagnie européenne ne peut rivaliser avec l'ordre de bataille de l'empire dans l'océan Indien."

 STATIC_MODIFIER_NAME_nd_vjn_dest_factory_companies: "Sociétés commerciales impériales"
 STATIC_MODIFIER_DESC_nd_vjn_dest_factory_companies: "Des sociétés commerciales agréées du Karnata, calquées sur le modèle européen, mais répondant à Hampi, gèrent le réseau d'usines de l'océan Indien. La migration impériale s'écoule vers l'extérieur ; l’exploration élargit le réseau. Le renforcement de l’armée nationale devient coûteux à mesure que les meilleurs hommes trouvent fortune à l’étranger."

 # ---- Destiny path tooltip refinements (existing keys; restated for clarity) ----
 # nd_vjn_path_a_tt and nd_vjn_path_b_tt already defined above

 # ---- Destiny buildings ----
 nd_vjn_imperial_diwan_khana: "Diwan-Khana impérial"
 nd_vjn_imperial_diwan_khana_desc: "La chancellerie d'un empire restauré. Des salles voûtées dans un registre hindou-impérial qui font écho aux palais Tughluq et Bahmani du nord, une revendication visuelle délibérée sur l'héritage architectural du plateau du Deccan, aujourd'hui restauré au dharma. Chaque décret impérial affectant Bharata passe par ces salles."
 nd_vjn_diwan_maintenance: "Opérations de la chancellerie"
 nd_vjn_diwan_maintenance_desc: "Entretien de la chancellerie impériale : papier pour les subventions et les farmans, drap fin pour les robes de cérémonie, mobilier pour les longs conseils, outils pour les coupeurs de sceaux et les scribes."

 nd_vjn_coromandel_bourse: "Bourse impériale de Coromandel"
 nd_vjn_coromandel_bourse_desc: "Le grand bureau de douane et bourse commerciale de l'empire du Karnata dans l'océan Indien. Une salle côtière à piliers où les facteurs impériaux nettoient la soie de Canton, les épices de Malacca, le cheval d'Ormuz, le café d'Aden et le coton de Coromandel à destination de la moitié du monde. Le cœur financier de la thalassocratie du sud."
 nd_vjn_bourse_maintenance: "Opérations boursières"
 nd_vjn_bourse_maintenance_desc: "Entretien de la bourse impériale : papier pour les grands livres et les lettres de change, tissus fins pour les robes des facteurs, balles de tissus comme échantillons d'échange standard, outils pour les essayeurs et les fonctionnaires des douanes."

 # === BUREAUCRACIES ===

 AUTO_MODIFIER_NAME_nd_vjn_bureaucracy_authority: "Autorité impériale du Karnata"
 AUTO_MODIFIER_DESC_nd_vjn_bureaucracy_authority: "The restored Vijayanagara state inherits the institutional framework of the Sangama, Saluva, Tuluva, and Aravidu dynasties. Two of the empire's four institutions can be kept standing at once."

 vjn_pampa_virupaksha_bureaucracy: "Pampa-Virupaksha Devasthanam"
 vjn_pampa_virupaksha_bureaucracy_desc: "Le complexe du temple impérial Saiva à Hampi, où Virupaksha (une forme de Shiva) a été installé en tant que divinité tutélaire de l'empire. Depuis Harihara Ier en 1336, des subventions et des édits royaux furent émis au nom du dieu : l'empereur se présentait simplement comme l'adjoint de la divinité, et le rituel de Pampakshetra centrait la vallée de Tungabhadra en tant que géographie sacrée. Les devasthanam administraient les terres des temples, les subventions des brahmadeyas et l'économie de dons qui liaient les tribunaux de Sangama et de Tuluva à l'establishment religieux Saiva."

 vjn_diwan_kacheri_bureaucracy: "Diwan-Kacheri"
 vjn_diwan_kacheri_bureaucracy_desc: "La chancellerie impériale et le bureau des impôts ont été formalisés sous Krishnadeva Raya (r. 1509-1529) et décrits dans son traité politique Telugu l'Amuktamalyada. Le Pradhani (ministre en chef) dirigeait huit portefeuilles ministériels ; le corps Rayasam de scribes royaux a publié des sasanas (édits en cuivre) à travers le royaume en kannada, telugu, tamoul et sanskrit. Le Diwan-Kacheri a conservé une forte tradition juridique orale-sanscrite aux côtés de l'administration en langue télougou, le distinguant des chancelleries persanes contemporaines des sultanats du Deccan."

 vjn_tirumala_devasthanam_bureaucracy: "Tirumala Devasthanam"
 vjn_tirumala_devasthanam_bureaucracy_desc: "Le temple Vaishnava de Venkateswara sur les collines de Tirumala au-dessus de Tirupati. Les sept visites personnelles et les dotations somptueuses de Krishnadeva Raya (1513-1521) ont fait du sanctuaire l'équivalent Vaishnava du Saiva Pampa-Virupaksha à Hampi, équilibrant le patronage religieux de l'empire. À la fin du XVIe siècle, Tirumala était devenu le temple le plus riche du sud de l’Inde moderne grâce aux offrandes en espèces de hundi des pèlerins, aux réserves de céréales et à un système bancaire parallèle qui prêtait à des taux avantageux aux marchands et aux aristocrates Nayaka."

 vjn_coromandel_customs_bureaucracy: "Douanes de Coromandel"
 vjn_coromandel_customs_bureaucracy_desc: "L'appareil fiscal de la côte est administrant Pulicat, Negapatnam, San Thome (Mylapore) et Masulipatnam. L'État de Vijayanagara a collecté des sungam (droits de transit) par l'intermédiaire des gouverneurs des ports Adhikari nommés par l'empereur et a autorisé les guildes marchandes Ayyavole 500 et Manigramam à gérer le commerce longue distance dans l'océan Indien. Les facteurs portugais, persans et plus tard hollandais payaient les douanes en espèces et en lingots ; Les textiles de Coromandel s'étendaient jusqu'à Aceh, Pegu et les îles aux épices."
