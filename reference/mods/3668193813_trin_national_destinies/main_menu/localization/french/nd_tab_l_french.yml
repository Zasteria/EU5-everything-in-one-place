l_french:
 # ============================================================================
 # Formation event
 # ============================================================================
 nd_tab.1.t: "Le Mont Thabor"
 nd_tab.1.d: "On the chalk hilltop south of Prague, refugee peasants and burghers raise the brotherhood-republic. The chalice flies above the wagon laager. Five papal crusades have broken against Žižka's flails; the radical wing of the Hussite revolution has, against every expectation, won.\n\nNow the brotherhood must decide what kind of state it has built. The Tabor commune was always two movements at once: a millenarian peasant brotherhood preaching the imminent Kingdom of God, and an institutional republic of disciplined field armies under captains like Prokop the Great. Both wings refused the Compactata of Basel. Both rejected Roman authority. But the question they fought over for fifteen years remains: how radical should the chalice church be?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tab.1.a: "La Commune des Frères, propriété communale et calice pour tous"
 nd_tab.1.b: "Le royaume calixtin, la république hussite disciplinée de Prokop"

 # ============================================================================
 # Formation choice modifiers
 # ============================================================================
 STATIC_MODIFIER_NAME_nd_tab_commune_of_brethren: "Commune des Frères"
 STATIC_MODIFIER_DESC_nd_tab_commune_of_brethren: "L’aile radicale du Tabor l’emporte. Propriété communautaire, sacerdoce marié, femmes combattantes, liturgie vernaculaire tchèque : la confrérie est une seule chair sous le calice. La main-d'œuvre découle de la large mobilisation de chaque âme, mais la chrétienté recule devant la république hérétique de la Vltava."

 STATIC_MODIFIER_NAME_nd_tab_calixtine_compact: "Calixtine compacte"
 STATIC_MODIFIER_DESC_nd_tab_calixtine_compact: "La vision institutionnelle de Prokop le Grand prévaut. Un calice pour tous, mais une politique républicaine bohème ordonnée : nobles, bourgeois et capitaines de l'armée de campagne partagent la gouvernance selon une stricte discipline élective. Les armées de chariots sont professionnelles et le résultat de la guerre contre les croisés est décisif, mais le feu millénariste est en retrait."

 # ============================================================================
 # DHE event 2: war-wagon doctrine choice
 # ============================================================================
 nd_tab.2.t: "Vozov Hradba Le mur des wagons"
 nd_tab.2.d: "Žižka's mobile fortress doctrine has changed European warfare. Ox-drawn wagons reinforced with iron plates, fitted with hand cannon, light artillery and crossbow loopholes; chained together they form a wagon-wall that breaks knightly cavalry charges and serves as the field army's nightly camp. Where the wagons go, the brotherhood goes.\n\nThe captains debate doctrine. Žižka's school treats the wagon as an offensive system: a moving fortress projected aggressively into enemy territory, supplied by raid and tribute. Prokop's school treats it as a defensive bastion: a wagon-fort the field army falls back into to grind any attacker against."
 nd_tab.2.a: "La manière Ikovsk du wagon comme forteresse en mouvement"
 nd_tab.2.b: "Le wagon comme bastion défensif"

 STATIC_MODIFIER_NAME_nd_tab_zizka_doctrine: "Doctrine d'Ikovsk"
 STATIC_MODIFIER_DESC_nd_tab_zizka_doctrine: "L’armée de campagne se déplace là où vole le calice. Doctrine agressive du wagon-fort : concentration rapide, raids en profondeur, recrutement dans la foulée."

 STATIC_MODIFIER_NAME_nd_tab_wagon_bastion: "Bastion des wagons"
 STATIC_MODIFIER_DESC_nd_tab_wagon_bastion: "Les chariots de la confrérie sont des forteresses mobiles. Les armées croisées se frottent contre les laagers et rentrent chez elles en fragments."

 # ============================================================================
 # DHE event 3: Four Articles enforcement
 # ============================================================================
 nd_tab.3.t: "Les quatre articles de Prague"
 nd_tab.3.d: "Free preaching of the word. Communion in both kinds: the chalice for the laity. Apostolic poverty of the clergy. Severe punishment of all open sins. The Four Articles, drafted in Prague in 1420 and fought for these many years, are now the constitution of the brotherhood.\n\nBut the Articles themselves can be read two ways. The strict reading binds every Christian to the brotherhood's discipline: blasphemy, fornication, simony, drunkenness: all answerable to the elective court. The tolerant reading prizes the chalice and the vernacular word above all; let the brethren preach freely and trust the Word to do its work."
 nd_tab.3.a: "Application stricte : les péchés ouverts sont imputables à la fraternité"
 nd_tab.3.b: "Le calice pour tous : prédication vernaculaire, discipline tolérante"

 STATIC_MODIFIER_NAME_nd_tab_articulus_strict: "Article strict"
 STATIC_MODIFIER_DESC_nd_tab_articulus_strict: "L'église du calice impose la discipline apostolique. L’uniformité confessionnelle est rapide ; la dissidence populaire est rare ; les frères marchent sobrement sous le tribunal électif."

 STATIC_MODIFIER_NAME_nd_tab_articulus_tolerant: "Articulus tolérant"
 STATIC_MODIFIER_DESC_nd_tab_articulus_tolerant: "La confrérie place le calice et la Parole vernaculaire au-dessus de la discipline cléricale. Les imprimeries tchèques se multiplient et la tolérance envers les sectes chrétiennes dissidentes devient une particularité du Tabor."

 # ============================================================================
 # DHE event 4: Lipany averted
 # ============================================================================
 nd_tab.4.t: "Lipany évité"
 nd_tab.4.d: "In the history that did not happen, the Tabor and Sirotci field army shattered against the Utraquist-Catholic coalition at Lipany in May 1434. The radical wing of the Hussite revolution was destroyed in a single afternoon and the chalice church absorbed into a moderate compromise.\n\nIn this history, Lipany did not happen, or it happened differently. Prokop the Great did not die in the rout. The brotherhood's field army stands intact. Now the question is what to do with it. Press on against the crusader powers and dictate terms to the Empire? Or consolidate the brotherhood at home, integrating the surviving Sirotci radicals into a single disciplined commonwealth?"
 nd_tab.4.a: "Poussez l'armée de campagne en avant contre les croisés"
 nd_tab.4.b: "Consolider la confrérie : intégrer l'aile Sirotci"

 STATIC_MODIFIER_NAME_nd_tab_field_army_offensive: "Offensive de l'armée de campagne"
 STATIC_MODIFIER_DESC_nd_tab_field_army_offensive: "Les chariots-forteresses de la confrérie roulent en Saxe, dans le Brandebourg et en Lusace. Les puissances croisées apprennent à craindre le calice."

 STATIC_MODIFIER_NAME_nd_tab_brotherhood_consolidated: "Fraternité consolidée"
 STATIC_MODIFIER_DESC_nd_tab_brotherhood_consolidated: "Les radicaux Sirotci s'intègrent dans la structure institutionnelle de la confrérie. Les conflits entre factions se dissolvent dans une république de calice disciplinée."

 # ============================================================================
 # DHE event 5: Vernacular scripture (single-option)
 # ============================================================================
 nd_tab.5.t: "La Bible tchèque"
 nd_tab.5.d: "The Plzeň Bible (among the earliest printed Bibles in any European vernacular) finds its place in every parish hall, schoolroom, and wagon-laager chapel of the brotherhood. Tabor's egalitarian church is now an egalitarian church of literacy: peasant, burgher and noble read the same vernacular scripture, sing the same Czech hymns, and argue the same gloss in the same elective courts.\n\nNo other state in Europe will catch up to this for a century."
 nd_tab.5.a: "La Parole vernaculaire fait une fraternité lettrée"

 # ============================================================================
 # DHE event 6: Married priesthood
 # ============================================================================
 nd_tab.6.t: "Mariages apostoliques"
 nd_tab.6.d: "The chalice clergy take wives. The Tabor brotherhood follows the apostolic example over the Roman tradition: the priest is married, raises children, and tills the same fields as his flock. The clergy are not a caste apart but the senior brethren of the commune, elected and dismissed by the laity they serve.\n\nThe practice scandalizes Catholic Europe. It also doubles the rate of clerical literacy in Tabor's parishes within a generation: the priest's household becomes a school, the priest's wife a deacon in everything but name."
 nd_tab.6.a: "Le clergé est des frères, pas une caste"

 STATIC_MODIFIER_NAME_nd_tab_apostolic_clergy: "Clergé apostolique"
 STATIC_MODIFIER_DESC_nd_tab_apostolic_clergy: "Les membres du clergé paroissial mariés élèvent des familles et dirigent des écoles de village. La population, l’alphabétisation et l’unité confessionnelle grandissent ensemble."

 # ============================================================================
 # DHE event 7: Brotherhood Diet
 # ============================================================================
 nd_tab.7.t: "Le régime de la Fraternité"
 nd_tab.7.d: "Tabor's four elected captains (the founding hejtmané of 1420) become the constitutional kernel of a mature elective republic. The Brotherhood Diet, sitting biannually, is composed of city aldermen, parish elders, and field-army captains, all chosen by chalice-and-Articles oath rather than by bloodline.\n\nThe debate now is who exactly may sit. The strict reading recognizes only the field-tested captains and aldermen: the four-captain model writ large, a discipline of the elect. The open reading admits the wider commune: peasants, women preachers (a Tabor distinctive), and burghers' guilds, on the principle that the brotherhood is one body of the chalice."
 nd_tab.7.a: "Discipline à quatre capitaines : les élus dirigent la confrérie"
 nd_tab.7.b: "Ouvrir la diète : paysans, femmes, bourgeois peuvent tous siéger"

 STATIC_MODIFIER_NAME_nd_tab_four_captains: "Discipline à quatre capitaines"
 STATIC_MODIFIER_DESC_nd_tab_four_captains: "La Diète de la Fraternité est une discipline élective des confirmés : capitaines d'armée de campagne, échevins de ville, anciens de paroisse. Les décisions sont prises avec une précision militaire."

 STATIC_MODIFIER_NAME_nd_tab_open_diet: "Régime ouvert"
 STATIC_MODIFIER_DESC_nd_tab_open_diet: "La république du calice admet tous les frères et sœurs dans le corps électif. Les paysans et les prédicatrices obtiennent des sièges sans précédent ailleurs en Europe."

 # ============================================================================
 # DHE event 8: Czech humanism (single-option)
 # ============================================================================
 nd_tab.8.t: "Comenius et les humanistes tchèques"
 nd_tab.8.d: "Jan Amos Komenský (Comenius), bishop of the Czech Brethren, lays out a complete philosophy of education in the Tabor tradition: vernacular schooling for all classes and both sexes, learning by doing, knowledge organized for the commonwealth. By the eighteenth century his successors form the leading edge of European humanism.\n\nThe seed planted in 1420 (the chalice for the layman, the Word in his own tongue, the brotherhood as one school) flowers as a Czech intellectual republic that the Catholic powers cannot suppress, because every Czech peasant can read."
 nd_tab.8.a: "La tradition du calice s'épanouit comme l'humanisme tchèque"

 # ============================================================================
 # Advances
 # ============================================================================
 nd_tab_bohemian_reform_preachers: "Prédicateurs réformés de Bohême"
 nd_tab_bohemian_reform_preachers_desc: "Conrad Waldhauser, Milc de Kromer et la chapelle de Bethléem prêchent la Réforme tchèque une génération avant Hus. La prédication vernaculaire est une institution vivante avant la naissance de la confrérie."

 nd_tab_waldensian_refuge: "Refuge Vaudois"
 nd_tab_waldensian_refuge_desc: "Les Vaudois tchèques du sud de la Bohême ont conservé leurs traditions anticléricales jusqu'au XIVe siècle. Les Vaudois réfugiés grossissent les rangs de la première confrérie."

 nd_tab_jan_hus_legacy: "L'héritage de Jan Hus"
 nd_tab_jan_hus_legacy_desc: "Le prédicateur bohème de la pauvreté apostolique, excommunié en 1411, fut brûlé à Constance en 1415 sous sauf-conduit. Son martyre déclenche les guerres hussites."

 nd_tab_free_town_charters: "Chartes de ville gratuites"
 nd_tab_free_town_charters_desc: "atec, Hradec Krlov, Tabor : les villes libres tchèques sont des confréries urbaines d'artisans et de bourgeois, avec des échevins électifs et une milice civique. Ce sont des républiques en fait avant de le devenir en droit."

 nd_tab_hradiste_communes: "Hradite de Thabor"
 nd_tab_hradiste_communes_desc: "Des paysans réfugiés trouvèrent Tabor sur une colline défendable en 1420, lui donnant le nom du Mont de la Transfiguration. Pisek, Wodrian et Atec imitent le modèle fortifié-égalitaire."

 nd_tab_vozova_hradba: "Vozov Hradba Le mur des wagons"
 nd_tab_vozova_hradba_desc: "forteresse mobile d'ika : wagons à bœufs renforcés de tôles de fer, équipés de canons à main, d'artillerie légère et de meurtrières pour arbalètes. Enchaînés ensemble, ils brisent les charges de cavalerie chevaleresque. La révolution tactique du XVe siècle."

 nd_tab_pistala_handgunners: "Artilleurs de poing Ptala"
 nd_tab_pistala_handgunners_desc: "Le ptala tchèque, le sifflet, ancêtre du pistolet moderne, est une invention hussite. Des tirailleurs au canon à main choquent la cavalerie européenne depuis l'intérieur du wagon laager."

 nd_tab_brotherhood_levy: "Fraternité d'armes"
 nd_tab_brotherhood_levy_desc: "Chaque Taborite prête serment au calice et au chariot. Fléaux de battage et piques improvisées arment le citoyen-soldat ; la doctrine du wagon-fort fait de l'infanterie paysanne l'égale de la cavalerie féodale."

 nd_tab_four_articles: "Les quatre articles de Prague"
 nd_tab_four_articles_desc: "Prédication gratuite, communion sous les deux formes, pauvreté apostolique du clergé, punition sévère des péchés manifestes. Le document constitutionnel de la révolution hussite."


 nd_tab_lipany_averted: "Lipany évité"
 nd_tab_lipany_averted_desc: "Dans l'histoire, cela ne s'est pas produit, l'armée de campagne de Tabor et Sirotci s'est brisée à Lipany en 1434 et l'aile radicale a été absorbée par un utraquisme modéré. Dans cette histoire, l’armée de campagne perdure. Prokop le Grand vit. La république du calice est souveraine."

 nd_tab_sirotci_banner: "Bannière des Sirotci"
 nd_tab_sirotci_banner_desc: "Après la mort d'Ika en 1424, ses partisans les plus radicaux se nommèrent en signe de deuil les Orphelins (Sirotci). Sous Prokop le Grand, ils attaquèrent jusqu'au Brandebourg, dans la Baltique et en Hongrie."

 nd_tab_vernacular_scripture: "La Bible tchèque"
 nd_tab_vernacular_scripture_desc: "La Bible de Plzen (1432) compte parmi les premières Bibles vernaculaires imprimées de l’Europe médiévale. L'écriture vernaculaire est le moteur d'alphabétisation de la confrérie."

 nd_tab_communal_property: "Propriété Communale"
 nd_tab_communal_property_desc: "Les nouveaux frères cèdent leurs richesses privées aux entrepôts communs. La confrérie gère les champs, les magasins et la logistique de l'armée de campagne comme un seul organisme fiscal, les Jacobins médiévaux de Kautsky."

 nd_tab_itinerant_preachers: "Prédicateurs itinérants"
 nd_tab_itinerant_preachers_desc: "Les prédicateurs hussites (kazatel) parcourent les terres du calice, attirant les paysans, les femmes et les bourgeois dans la vie de la confrérie. Leurs chaires servent également de postes de recrutement."

 nd_tab_married_priesthood: "Mariages apostoliques"
 nd_tab_married_priesthood_desc: "Le clergé du calice prend des femmes, élève des familles, cultivant les mêmes champs que leurs troupeaux. Par la Réforme, les réformateurs d’Europe centrale citent le précédent Tabor."

 nd_tab_communal_charity: "Charité Communautaire"
 nd_tab_communal_charity_desc: "L'égalitarisme de Tabor s'étend à l'aumône : les hôpitaux comme cliniques et hospices, sans distinction de rang. Un modèle pour l’aide aux pauvres des paroisses de la Réforme dans toute l’Europe protestante."

 nd_tab_crusade_defied: "Croisades défiées"
 nd_tab_crusade_defied_desc: "Cinq croisades papales se sont brisées contre le calice. Avec la Réforme, cette défaite de la puissance continentale catholique est le mythe fondateur de la confiance militaire du protestantisme européen."

 nd_tab_unitas_fratrum: "Fratrum de l'Unitas"
 nd_tab_unitas_fratrum_desc: "Les frères tchèques perfectionnent le pacifisme communautaire de la commune de Tabor pour en faire l'une des premières églises d'alphabétisation de masse d'Europe et une république des lettres."

 nd_tab_brotherhood_diet: "Le régime de la Fraternité"
 nd_tab_brotherhood_diet_desc: "Les quatre capitaines élus de Tabor constituent le noyau constitutionnel d'une république élective mature : la Diète de la Fraternité composée d'échevins de la ville, d'anciens des paroisses et de capitaines de l'armée de campagne."

 nd_tab_comenius_pedagogy: "Pédagogie Coménienne"
 nd_tab_comenius_pedagogy_desc: "Comenius (Jan Amos Komensk), évêque des Frères tchèques, devient le pédagogue le plus influent d'Europe. Scolarisation vernaculaire pour toutes les classes, les deux sexes, avec trois siècles d'avance."

 nd_tab_brethren_printing: "Frères imprimant en exil"
 nd_tab_brethren_printing_desc: "Les imprimeurs des Frères tchèques gèrent une république des lettres qui vend des textes religieux et pédagogiques vernaculaires dans toute l'Europe. La presse vernaculaire devient une industrie d'exportation rentable."

 nd_tab_anti_absolutism: "Anti-absolutisme"
 nd_tab_anti_absolutism_desc: "L’éthos républicain hussite refuse de se plier aux réformes judiciaires absolutistes qui balayent l’Europe. Une alternative constitutionnelle à Versailles."

 nd_tab_czech_humanism: "Humanisme tchèque"
 nd_tab_czech_humanism_desc: "La lignée Tabor-Frères-Comenius s'épanouit à l'ère des révolutions. Religion, alphabétisation vernaculaire, charité communautaire transformées en vertu civique pour la république moderne."

 nd_tab_first_commune: "La première commune"
 nd_tab_first_commune_desc: "Les radicaux du XIXe siècle redécouvrent la confrérie Tabor comme un profond précédent pour le socialisme européen. La république du calice est nommée première commune."

 nd_tab_brotherhood_in_arms: "Fraternité d'armes"
 nd_tab_brotherhood_in_arms_desc: "Leve en masse répond à la tradition hussite des chariots de guerre. La mobilisation de masse combinée à une doctrine défensive disciplinée produit un système militaire national-républicain."

 nd_tab_civic_militia: "Milice civique"
 nd_tab_civic_militia_desc: "Le descendant moderne de la confrérie des chariots de guerre : armureries communales, exercices paroissiaux et tradition du calice et du drapeau des soldats citoyens en République tchèque."

 # ============================================================================
 # Units
 # ============================================================================
 a_nd_tab_tabor_militia: "Milice du Tabor"
 a_nd_tab_tabor_militia_desc: "Prélèvement paysan au fléau et au brochet de la confrérie des chariots de guerre. Chaque mâle taborite avait juré de défendre le calice ; la doctrine du wagon-fort fait de leurs armes improvisées un adversaire de taille pour la cavalerie féodale."

 a_nd_tab_handgunners: "Artilleurs de poing Ptala"
 a_nd_tab_handgunners_desc: "Tirailleurs tchèques à canon à main. Le ptala (sifflet), ancêtre du pistolet moderne, est une invention hussite. Choc dévastateur contre l'infanterie non blindée et la cavalerie paniquée."

 a_nd_tab_sirotci: "Infanterie lourde Sirotci"
 a_nd_tab_sirotci_desc: "Les militants radicaux des Orphelins qui sont entrés en campagne après la mort d'Ika en 1424, se faisant appeler Sirotci en signe de deuil. Sous Prokop le Grand, ils attaquèrent jusqu'au Brandebourg et dans la Baltique."

 a_nd_tab_vozova_hradba: "Vozov Hradba"
 a_nd_tab_vozova_hradba_desc: "Chariots de guerre hussites : forteresses blindées tirées par des bœufs équipées d'obusiers houfnice, de canons à main et de meurtrières pour arbalètes. Une puissance de feu défensive lente mais dévastatrice ; la formation de murs de wagons a révolutionné la guerre européenne."

 # ============================================================================
 # Levies
 # ============================================================================
 levy_nd_tab_tabor_militia: "Prélèvement de la milice du Tabor"
 levy_nd_tab_tabor_militia_desc: "Mobilisation de la paysannerie jurée par le calice. Fléau, brochet et chariot laager."

 # ============================================================================
 # Buildings
 # ============================================================================
 nd_tab_hradiste: "Hradite"
 nd_tab_hradiste_desc: "Ville de montagne fortifiée communale sur le modèle du Tabor original (1420), fondée sur une colline défendable et nommée d'après le Mont de la Transfiguration. Bastion défensif de la république du calice."

 nd_tab_articulus_house: "Maison Articulus"
 nd_tab_articulus_house_desc: "Assemblée politico-religieuse au niveau de la ville qui ratifie et applique les Quatre Articles de Prague. Le noyau de la constitution hussite-républicaine."

 nd_tab_vernacular_press: "Presse vernaculaire"
 nd_tab_vernacular_press_desc: "Imprimerie de langue tchèque. La Bohême hussite a produit l'un des premiers programmes bibliques vernaculaires de l'Europe médiévale ; la Bible de Plzen (1432) est un moteur d'alphabétisation pour la confrérie."

 nd_tab_communal_hospital: "Hôpital Communal"
 nd_tab_communal_hospital_desc: "Soins de santé égalitaires hussites : clinique et hospice pour malades, veuves, orphelins et pèlerins, sans distinction de rang. Un modèle pour l'aide aux pauvres des paroisses de la Réforme."

 nd_tab_brotherhood_treasury: "Trésor de la Fraternité"
 nd_tab_brotherhood_treasury_desc: "Administration des biens communaux. Les nouveaux frères abandonnent leurs richesses privées dans des entrepôts communs ; le Trésor gère les champs de bataille, les magasins et la logistique de l'armée de campagne comme un seul organisme fiscal."

 nd_tab_hussite_pulpit: "Chaire hussite"
 nd_tab_hussite_pulpit_desc: "Salle de recrutement dirigée par un prédicateur. Des prédicateurs itinérants (kazatel) attirent les paysans, les femmes et les bourgeois dans la vie de la confrérie ; la chaire sert également de poste de recrutement pour l'armée de campagne du calice."

 # ============================================================================
 # Building production methods
 # ============================================================================
 nd_tab_hradiste_maintenance: "Garnison Hradite"
 nd_tab_hradiste_maintenance_desc: "De la pierre, du bois, des armes et un tonneau de brassage maintiennent la garnison de Mounttown prête."

 nd_tab_articulus_maintenance: "Dossiers Articulus"
 nd_tab_articulus_maintenance_desc: "Papier, livres, bougies et bancs pour le tribunal électif. La vie constitutionnelle de la confrérie nécessite son propre appareil bureaucratique."

 nd_tab_vernacular_press_maintenance: "Opérations de presse"
 nd_tab_vernacular_press_maintenance_desc: "Papier, livres, cire d'abeille et outils d'impression. La presse ne dort jamais."

 nd_tab_communal_hospital_maintenance: "Charité hospitalière"
 nd_tab_communal_hospital_maintenance_desc: "Médicaments, bière, linge et bougies pour les malades, les veuves et les orphelins de la confrérie."

 nd_tab_brotherhood_treasury_maintenance: "Administration du Trésor"
 nd_tab_brotherhood_treasury_maintenance_desc: "Papier, livres de comptes, bougies et bancs pour les gardiens des magasins communs."

 nd_tab_hussite_pulpit_maintenance: "Disposition de la chaire"
 nd_tab_hussite_pulpit_maintenance_desc: "Des livres et des bougies pour le prédicateur ; du pain et de la bière pour les frères qui répondent à l'appel."

 nd_tab_brethren_press_pm: "Commerce du livre entre frères"
 nd_tab_brethren_press_pm_desc: "Les frères tchèques en exil impriment des textes pédagogiques et religieux vernaculaires pour les vendre dans toute l'Europe centrale et septentrionale, consommant du papier et des colorants à l'encre pour produire des livres pour la république des lettres."


 a_nd_tab_republican_infantry: "Infanterie républicaine tchèque"
 a_nd_tab_republican_infantry_desc: "Infanterie lourde moderne de levée en masse de la république du calice. La confrérie des chars de guerre de Tabor s'est transformée en une conscription républicaine de masse : un feu discipliné et dense selon l'étendard républicain tchéco-républicain."

 nd_tab_komensky_school: "École de Komensk"
 nd_tab_komensky_school_desc: "Institution pédagogique vernaculaire de la tradition des Frères tchèques. Comenius a systématisé la scolarisation pour toutes les classes et les deux sexes un siècle avant le rattrapage des Lumières ; l'école de Komensk est la réalisation au niveau paroissial de sa pédagogie."

 nd_tab_komensky_school_maintenance: "Offre scolaire"
 nd_tab_komensky_school_maintenance_desc: "Livres, papier, bougies et bancs. Les Frères enseignent en faisant des connaissances organisées pour le Commonwealth."

 # ============================================================================
 # Variable tooltips
 # ============================================================================
 nd_tab_formed_tt: "Formation de la République de Tabor"
 nd_tab_path_a_tt: "Chose the #bold Czech Reformation#! destiny (the Commune of Brethren)"
 nd_tab_path_b_tt: "Chose the #bold Communal Republic#! destiny (the Calixtine Realm)"
 nd_tab_dest_bechyne_developed_tt: "We own #bold Bechyně#!, the district of Tábor, and its development is at least #bold 24#!"
 nd_tab_dest_articulus_houses_tt: "At least 3 of our locations have an #bold Articulus House#!"
 nd_tab_dest_kutna_hora_developed_tt: "We own #bold Kutná Hora#! and its development is at least #bold 32#!"

 # ============================================================================
 # DESTINY TREE
 # ============================================================================

 # ----- Destiny Advances -----
 nd_tab_destiny: "Destin de la République du Calice"
 nd_tab_destiny_desc: "The brotherhood has won. Now the long project of the Hussite republic begins. The choice made at the founding opens one of two paths: the Commune of Brethren takes the Czech Reformation abroad, the Calixtine Realm builds the Communal Republic at home."

 nd_tab_dest_silesian_reform: "Réforme à la frontière silésienne"
 nd_tab_dest_silesian_reform_desc: "Amenez Wroclaw et Grlitz sous le calice. La Silésie et la Lusace sont la frontière naturelle de la réforme hussite ; les bourgeois de ces villes ont lu Hus, mais leurs évêques portent encore la mitre romaine. Gagnez suffisamment de prestige pour que l'Empire prenne la confrérie au sérieux en tant que puissance confessionnelle."

 nd_tab_dest_reformation_export: "Réforme continentale"
 nd_tab_dest_reformation_export_desc: "Adoptez l’institution du confessionnalisme et saisissez Wittenberg, berceau de la réforme allemande. Le calice et les quatre-vingt-quinze thèses doivent parler d’une seule voix. Les trésors financent l’impression, la mission et les armées missionnaires disciplinées du calice."

 nd_tab_dest_bohemian_synod: "Le Synode de Bohême"
 nd_tab_dest_bohemian_synod_desc: "Augsbourg, Genève, Leipzig, les trois villes de la Réforme sous un seul conseil dirigé par la Bohême. La république du calice commande une alliance protestante continentale, avec l'armée de campagne et le prestige nécessaire pour la conserver. Débloque la salle du Synode de Bohême."

 nd_tab_dest_civic_brotherhood: "La Fraternité Civique"
 nd_tab_dest_civic_brotherhood_desc: "Seat an Articulus House in three towns and build up the district of Tábor, the commune's own town. Deepen the inner commune: elective offices for parish, town, and field, and a treasury rich enough to fund the brotherhood's experiment in egalitarian governance."

 nd_tab_dest_vernacular_commonwealth: "Le Commonwealth vernaculaire"
 nd_tab_dest_vernacular_commonwealth_desc: "Embrace the Renaissance, build up Kutná Hora, where the Czech Bible was printed on the silver of the mines, and develop a Czech-language print culture so deep that paper trades through the capital market. The chalice republic becomes a continental industry of vernacular literacy."

 nd_tab_dest_demokraticky_sjezd: "Démocrate Sjezd"
 nd_tab_dest_demokraticky_sjezd_desc: "Embrassez les Lumières. La commune de Tabor couronne son long projet : un parlement tchéco-vernaculaire pleinement démocratique où peuvent siéger tous les anciens de la paroisse et les capitaines de campagne. Débloque le Demokratick Sjezd."

 # ----- Destiny DHE Events -----
 nd_tab.9.t: "Un destin pour le calice"
 nd_tab.9.d: "The brotherhood-republic stands. The Compactata are torn up; Roman authority has been refused; the wagon-walls have rolled five papal hosts back into the Empire. Now the chalice flies above a sovereign state, and the long project begins. The captains, preachers, and aldermen meet at the Articulus House to debate what comes next.\n\nThe destiny tab in the Traditions panel now lights up: your formation choice has set the path."
 nd_tab.9.a: "Le calice écrit son propre avenir"

 nd_tab.10.t: "La frontière silésienne"
 nd_tab.10.d: "Wrocław and Görlitz fly the chalice. The Silesian and Lusatian burghers, long sympathetic to Hus, now belong to the brotherhood by treaty and by garrison. Czech preachers ride out into the Empire as far as the Oder, and the chalice's prestige rises through every diet of the Hanseatic and Imperial cities.\n\nThe Silesian frontier is the chalice's first foreign harvest."
 nd_tab.10.a: "La frontière est celle de la fraternité"

 nd_tab.11.t: "La Réforme arrive"
 nd_tab.11.d: "Wittenberg has fallen to the chalice. Confessionalism is a state institution; the Bohemian seal sits beside the Saxon on Reformation tracts; the brotherhood's printers reset their forms in German as well as Czech. The Empire is on fire with reform, and the chalice republic is its senior partner.\n\nThe captains debate how to push the reform further. Send our preachers and diplomats out among the German princes, or arm the Lutheran reformers and let the brotherhood's wagons do the talking?"
 nd_tab.11.a: "Envoyez nos prédicateurs à travers l'Empire"
 nd_tab.11.b: "Armer les réformateurs luthériens"

 STATIC_MODIFIER_NAME_nd_tab_dest_brotherhood_preachers: "Prédicateurs de la Fraternité à l’étranger"
 STATIC_MODIFIER_DESC_nd_tab_dest_brotherhood_preachers: "Des prédicateurs et des diplomates hussites se répandent parmi les princes allemands. Les réseaux d'information se multiplient, les voies de traités se multiplient mais les caisses de la confrérie se mettent à rude épreuve sous le coût de l'apostolat."

 STATIC_MODIFIER_NAME_nd_tab_dest_arm_the_reformers: "Armer les réformateurs"
 STATIC_MODIFIER_DESC_nd_tab_dest_arm_the_reformers: "Les chariots bohémiens et les armes de poing Ptala renforcent chaque prélèvement luthérien. La tradition militaire se développe et les armées réformatrices se développent, mais la vieille noblesse hussite-tchèque n'apprécie pas d'être transformée en une forge pour les nouveaux arrivants étrangers."

 nd_tab.12.t: "Le Synode de Bohême"
 nd_tab.12.d: "Augsburg, Geneva, Leipzig under the chalice. Hussite, Lutheran and Reformed delegations sit at one Bohemian-led table, and a unified central-European Protestantism takes constitutional shape. The Synod Hall in Prague is the headquarters of the reform.\n\nThe captains debate the council's posture. Press for theological union and a peaceful continental settlement, or treat the synod as a militant high command, the chalice church under arms against the Catholic powers?"
 nd_tab.12.a: "Une Réforme unie sous un seul synode"
 nd_tab.12.b: "Un synode militant, l'église du calice sous les armes"

 STATIC_MODIFIER_NAME_nd_tab_dest_united_synod: "Synode de la Réforme Unie"
 STATIC_MODIFIER_DESC_nd_tab_dest_united_synod: "Les délégations hussites, luthériennes et réformées se réunissent sous un même calice. Les canaux diplomatiques s’approfondissent, les alliés et les sujets se lient plus étroitement, et même les puissances rivales réfléchissent à deux fois avant de déclarer la guerre au synode."

 STATIC_MODIFIER_NAME_nd_tab_dest_militant_synod: "Synode militant"
 STATIC_MODIFIER_DESC_nd_tab_dest_militant_synod: "La salle synodale fait également office de conseil de guerre. Les forteresses des Croisés tombent plus rapidement, les brèches sont prises d'assaut et la Réforme marche sous une seule bannière, même si chaque pièce rapporte le double pour les travaux de siège."

 nd_tab.13.t: "La Fraternité Civique"
 nd_tab.13.d: "Election is now Tabor's institution as well as its principle. Aldermen, captains, parish elders: none inherit office. Every parish elects its preacher; every town elects its captain; every field-army company elects its hejtman. The brotherhood's coffers fund the experiment, and the experiment funds the brotherhood.\n\nThe peasant in his Articulus House hears the same agenda as the burgher in his guild. No other state in Europe can say so."
 nd_tab.13.a: "La fraternité est la république"

 nd_tab.14.t: "Le Commonwealth vernaculaire"
 nd_tab.14.d: "Renaissance learning meets the Czech vernacular. Brotherhood presses run day and night; paper from the capital's market trades as far as Lübeck and Lyon. Every parish school has a printed primer; every burgher reads Czech; the commonwealth is a republic of letters before it is anything else.\n\nThe diet debates how to channel the print boom. Pour resources into the pedagogical project: the schools, the vernacular treatises, the developmental ideal? Or empower the burgher guilds whose presses and ink-mills carry it to market?"
 nd_tab.14.a: "Versez la presse dans le projet pédagogique"
 nd_tab.14.b: "Renforcez les maisons de guilde des bourgeois"

 STATIC_MODIFIER_NAME_nd_tab_dest_print_revolution: "Révolution de l'impression"
 STATIC_MODIFIER_DESC_nd_tab_dest_print_revolution: "Les presses de la Fraternité publient des traités vernaculaires par charrettes. Le développement de la République tchèque s'accélère et l'Europe prend au sérieux la république du calice comme une grande puissance des lettres."

 STATIC_MODIFIER_NAME_nd_tab_dest_burgher_compact: "Bourgeois Compact"
 STATIC_MODIFIER_DESC_nd_tab_dest_burgher_compact: "Le boom de la presse passe entre les mains des bourgeois. Les routes commerciales terrestres transportent les livres tchèques à travers l'Europe centrale et la capacité marchande augmente, mais le clergé du calice est mécontent de la nouvelle richesse et de l'influence des bourgeois."

 nd_tab.15.t: "Démocrate Sjezd"
 nd_tab.15.d: "The Enlightenment has come to the chalice republic. Comenius's pedagogy is universal; every Czech peasant reads; every parish elects to a national assembly conducted entirely in the Czech vernacular. The Demokratický Sjezd is the working democratic experiment Europe has been arguing about for two centuries.\n\nThe captains debate the final shape. Open the franchise without limit: every brother and sister, peasant or burgher, on the rolls? Or keep an elective discipline of the proven, the four-captain model writ large for a modern republic?"
 nd_tab.15.a: "Ouvrez la franchise à tous les frères et sœurs"
 nd_tab.15.b: "Une discipline élective éprouvée"

 STATIC_MODIFIER_NAME_nd_tab_dest_open_franchise: "Franchise ouverte"
 STATIC_MODIFIER_DESC_nd_tab_dest_open_franchise: "Chaque frère et sœur vote. La satisfaction successorale augmente largement et le pays dérive vers un libéralisme libre, sans précédent ailleurs en Europe."

 STATIC_MODIFIER_NAME_nd_tab_dest_disciplined_republic: "République élective disciplinée"
 STATIC_MODIFIER_DESC_nd_tab_dest_disciplined_republic: "Le modèle à quatre capitaines en grand. L'annexion des terres tchèques est peu coûteuse, les provinces déchirées par la guerre se rétablissent rapidement et une culture d'excellence qualitative imprègne les institutions de la confrérie."

 # ----- Destiny Buildings -----
 nd_tab_synod_hall: "Salle du Synode de Bohême"
 nd_tab_synod_hall_desc: "Siège du conseil continental de la Réforme. La république du calice réunit des délégations hussites, luthériennes et réformées sous un synode dirigé par la Bohême, codifiant un protestantisme unifié d’Europe centrale."

 nd_tab_synod_hall_maintenance: "Disposition synodale"
 nd_tab_synod_hall_maintenance_desc: "Des livres, du papier, de la cire d'abeille et du tissu fin pour les pères du conseil. Le synode enregistre son propre droit canonique dans une douzaine de langues vernaculaires."

 nd_tab_demokraticky_sjezd: "Démocrate Sjezd"
 nd_tab_demokraticky_sjezd_desc: "Parlement vernaculaire-tchèque : la philosophie élective de la confrérie institutionnalisée comme une assemblée civique pleinement démocratique. Tout ancien de paroisse, maître de bourgeoisie et capitaine d'armée de campagne peut siéger ; les comptes rendus et les débats sont tenus en tchèque."

 nd_tab_demokraticky_sjezd_maintenance: "Enregistrements Sjezd"
 nd_tab_demokraticky_sjezd_maintenance_desc: "Papier, livres de grand livre, meubles et draperies de chambre. L’expérience démocratique repose sur des traces écrites."

 # ============================================================================
 # Bureaucracies: chalice-republic institutions
 # ============================================================================

 AUTO_MODIFIER_NAME_nd_tab_bureaucracy_authority: "Autorité administrative de la Fraternité"
 AUTO_MODIFIER_DESC_nd_tab_bureaucracy_authority: "The chalice republic's elective machinery is mature enough to operate institutional ministries. Four chalice institutions are available, of which two may be kept standing at once."

 hejtmane_council_bureaucracy: "Conseil de l'Hejtman"
 hejtmane_council_bureaucracy_desc: "Le commandement collectif sur le terrain d'Ika en 1420, formalisé après sa mort en 1424 en tant que cadre électif de quatre capitaines siégeant pour les ailes Tabor et Sirotci. Les Hejtman étaient nommés par les échevins de la ville, les confréries paroissiales et les anciens combattants de l'armée de campagne, ratifiés en séance commune et révoqués par ceux-ci. La noblesse héréditaire n'avait pas de siège : le Conseil du Hejtman dirigeait la république du calice en temps de guerre et de paix en tant que collège apostolique."

 snem_bratrsky_bureaucracy: "Snem Bratrsk"
 snem_bratrsky_bureaucracy_desc: "La Diète de la Fraternité, convoquée à partir de 1421 à Cslav et transformée au cours des années 1430 en parlement de travail des villes hussites. Les délégués parlaient en tchèque vernaculaire et étaient comptés par confrérie paroissiale, et non par naissance ou succession. La Diète a ratifié les Quatre Articles de Prague comme loi constitutionnelle, voté des prélèvements militaires et élu les capitaines : le premier exemple durable en Europe latine d'une assemblée républicaine aveugle aux successions, où les paysans côtoyaient les bourgeois."

 articulus_tribunal_bureaucracy: "Cour de l'Articulus"
 articulus_tribunal_bureaucracy_desc: "Le tribunal religieux et juridique qui jugeait la conformité aux Quatre Articles de Prague (1420) : libre prédication, communion sous les deux espèces, pauvreté apostolique du clergé et punition sévère du péché mortel. Des prêtres mariés, des femmes prédicateurs et des anciens laïcs siégeaient en tant que juges ; Le droit canonique romain était exclu. Le tribunal ratifia les iconoclasmes, dissout les monastères et jugea le clergé catholique pour simonie, construisant une église en calice que la papauté refusa de reconnaître pendant deux siècles."

 communal_storehouses_bureaucracy: "Entrepôts Communaux"
 communal_storehouses_bureaucracy_desc: "Les kdby, grandes cuves dans lesquelles les frères et sœurs entrants remettaient leurs richesses privées en rejoignant la commune. Tabor administrait les champs, les greniers et les bagages de l'armée de campagne comme un organisme fiscal unique à partir de ces entrepôts, distribuant de la nourriture, des vêtements et des armes à la confrérie selon les besoins. Karl Kautsky a cité le kdby comme un précédent médiéval du socialisme européen ; au cours de leur décennie de travail, ils ont nourri l’armée qui a vaincu cinq croisades papales."
 STATIC_MODIFIER_NAME_nd_tab_peasant_commune: "Commune Paysanne de Thabor"
 STATIC_MODIFIER_DESC_nd_tab_peasant_commune: "La gouvernance égalitaire de la confrérie, rendue permanente. La paysannerie est ascendante dans les conseils et dans les champs ; la noblesse est diminuée là où elle n'est pas purement abolie. Propriété communale des terres et des greniers ; capitaines élus par le conseil; les Quatre Articles de Prague comme loi constitutionnelle. Le Thabor est une république au sens fort : une république paysanne hussite, et non un royaume en costume républicain."
