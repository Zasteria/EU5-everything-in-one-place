l_french:
 # === Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_gbu_frankish_imperial_kingdom: "Royaume franc-impérial"
 STATIC_MODIFIER_DESC_nd_gbu_frankish_imperial_kingdom: "La couronne que Charles le Téméraire cherchait à Trèves est enfin posée sur un front bourguignon. Les compagnies d'ordonnance chevauchent pour un roi souverain, l'Ordre de la Toison d'Or pour une cour aux prétentions les plus chevaleresques de la chrétienté. La Bourgogne frappe à partir d'une position de prestige militaire."
 STATIC_MODIFIER_NAME_nd_gbu_estates_kingdom: "Royaume des Domaines"
 STATIC_MODIFIER_DESC_nd_gbu_estates_kingdom: "Les Etats Généraux de Bourgogne siègent en véritable partenaire de la couronne. Les halles aux draps de Bruges et de Gand, les marchands brabançons, les maîtres de fer wallons envoient des députés. Le royaume est gouverné conjointement avec ses villes, et ses richesses proviennent de leurs métiers à tisser et de leurs comptoirs."

 STATIC_MODIFIER_NAME_nd_gbu_toison_dor_elite: "Chevaliers de la Toison d'Or"
 STATIC_MODIFIER_DESC_nd_gbu_toison_dor_elite: "La Toison d'Or est conservée telle que la conçut Philippe le Bon : trente et un chevaliers, les grandes maisons de Bourgogne liées par serment au duc. Un collier incrusté de bijoux ; un corps de cavalerie d'élite ; le prestige chevaleresque de la cour la plus somptueuse de la chrétienté."
 STATIC_MODIFIER_NAME_nd_gbu_toison_dor_broad: "Toison élargie"
 STATIC_MODIFIER_DESC_nd_gbu_toison_dor_broad: "L'Ordre est ouvert aux petits nobles et aux capitaines fidèles. La toison devient une institution chevaleresque nationale plutôt qu'un cercle dynastique fermé, attirant la noblesse au sens large au service du roi et projetant l'honneur bourguignon à travers l'Europe."

 STATIC_MODIFIER_NAME_nd_gbu_flemish_cloth_charter: "Charte du Drap Flamand"
 STATIC_MODIFIER_DESC_nd_gbu_flemish_cloth_charter: "Les corporations de drapiers de Gand, de Bruges et d'Ypres reçoivent leurs privilèges par écrit : le droit de contrôler les tissus, de fixer des labels de qualité, de défendre leur monopole. Les métiers à tisser doublent leur production."

 STATIC_MODIFIER_NAME_nd_gbu_estates_general: "États généraux convoqués"
 STATIC_MODIFIER_DESC_nd_gbu_estates_general: "Les Etats Généraux se réunissent à Bruges. Les nobles, le clergé et les bourgeois de chaque duché et comté parlent d’une seule voix au duc. Les subventions fiscales circulent plus facilement ; le royaume acquiert une voix constitutionnelle qu’aucune monarchie rivale ne possède encore."

 STATIC_MODIFIER_NAME_nd_gbu_trier_imperial: "Concordat de Trèves"
 STATIC_MODIFIER_DESC_nd_gbu_trier_imperial: "L'Empereur couronne le duc de Bourgogne roi à Trèves. Le titre royal est reconnu dans tout l'Empire et au-delà. La chrétienté reconnaît la restauration de l’Empire du Milieu bourguignon."
 STATIC_MODIFIER_NAME_nd_gbu_trier_unilateral: "Couronne de Bruxelles"
 STATIC_MODIFIER_DESC_nd_gbu_trier_unilateral: "L'Empereur cale ; le duc ne le fait pas. La couronne est forgée à Bruxelles et placée sans autorisation impériale. La souveraineté est proclamée par des actes et non par des lettres, et les États affirment ce qu'aucune chancellerie étrangère n'ose contester."

 STATIC_MODIFIER_NAME_nd_gbu_gendarme_reform: "Compagnies d'Ordonnance"
 STATIC_MODIFIER_DESC_nd_gbu_gendarme_reform: "L'armée permanente de Charles le Téméraire prend forme : compagnies rémunérées de gendarmes à plein régime, lance et cheval bardé, entraînés en formation tactique. La cavalerie lourde la plus disciplinée de l'époque."
 STATIC_MODIFIER_NAME_nd_gbu_militia_mobilization: "Les milices bourgeoises mobilisées"
 STATIC_MODIFIER_DESC_nd_gbu_militia_mobilization: "Les cités drapières lèvent leurs milices de piques pour défendre le royaume. Bruges, Gand, Bruxelles, Liège envoient leurs compagnies bourgeoises sur le terrain. Le nombre compense la reproduction."

 STATIC_MODIFIER_NAME_nd_gbu_croix_de_bourgogne: "Croix de Bourgogne"
 STATIC_MODIFIER_DESC_nd_gbu_croix_de_bourgogne: "Le sautoir de Saint-André, croix rouge grossière aux branches nouées, devient l'étendard de campagne de tout bataillon bourguignon. L’hôte marche sous une seule bannière et se connaît pour une seule nation."

 # === Formation Event ===
 nd_gbu.1.t: "La couronne bourguignonne"
 nd_gbu.1.d: "From Bruges to Dijon, from the Frisian dunes to the Jura watershed, the long arc of Burgundian power is at last consolidated under a single sovereign crown. The Duchy of Burgundy and the Free County, Flanders and Brabant, Picardy and Holland, Lorraine and Alsace, all the lands that Philip the Good and Charles the Bold welded into a composite state, now stand as one kingdom, answering to neither Paris nor the Empire. The Lotharingian middle kingdom is reborn.\n\nBut what kind of kingdom shall it be?\n\nCharles dreamed of a sovereign throne carved from Imperial dignity, a court of the most lavish chivalry in Europe, a standing army of gendarmes and bombards. The compagnies d'ordonnance, the Toison d'Or, the field standards of Saint Andrew, these are the regalia of a Frankish-Imperial kingdom, a state of military prestige.\n\nYet the wealth of Burgundy was always its cities. Bruges and Ghent, Brussels and Antwerp, Mechelen and Liege: the cloth halls, the kontors, the burgher militias of the great urban communes. The Etats Generaux already gather to grant or withhold the duke's funding. The kingdom could be governed jointly with its cities, a constitutional partnership unlike any other crown in Europe.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_gbu.1.a: "Royaume franc-impérial : cour, gendarme et dignité impériale"
 nd_gbu.1.b: "Royaume des États : halles aux draps, bourgeois et communauté urbaine"

 # === DHE: Order of the Golden Fleece ===
 nd_gbu.2.t: "L'Ordre de la Toison d'Or"
 nd_gbu.2.d: "On the tenth of January in the year 1430, in the great hall of his palace at Bruges, Philip the Good announces the founding of a new chivalric order on the day of his marriage to Isabella of Portugal. He names it the Toison d'Or, after the golden fleece of Jason and the Argonauts, and after the wool that has made Burgundy rich. Twenty-four knights are admitted at the founding, the great houses of the realm bound by oath to the duke. They wear a collar of jewels and golden links: the fleece itself dangles from each.\n\nThe Order is the most exclusive in Christendom. It is also a political instrument: every great noble who joins it owes the dynasty a personal debt of chivalric loyalty. But the founding raises a question that will shape the kingdom. Shall the Fleece remain the closed circle of Philip's design, thirty-one knights only? Or shall it grow, become a broader institution drawing in the wider nobility, projecting Burgundian honour across Europe?"
 nd_gbu.2.a: "Respectez la charte fondatrice : trente et un chevaliers, un cercle d'élite"
 nd_gbu.2.b: "Ouvrez l'Ordre - élargissez la toison pour en faire une institution chevaleresque nationale"

 # === DHE: Flemish Cloth Charter ===
 nd_gbu.3.t: "La Charte du Tissu"
 nd_gbu.3.d: "Les drapiers de Gand, de Bruges et d'Ypres demandent à la couronne une charte. Ils tissent la laine d'Angleterre et les teintures de Picardie depuis deux siècles. Ils veulent avoir le droit d'écrire : contrôler le tissu au métier à tisser, le marquer du label de qualité de la ville, interdire aux commerçants étrangers d'acheter des marchandises non estampillées. La couronne accorde la charte. Aux Pays-Bas, les métiers à tisser doublent leur cadence, les foulons fonctionnent jour et nuit et les draps flamands marqués du sceau de la guilde de la laine se vendent aux prix les plus élevés d'Europe."
 nd_gbu.3.a: "Les halles aux draps prospèrent."

 # === DHE: Estates General Convocation ===
 nd_gbu.4.t: "Les États généraux convoqués"
 nd_gbu.4.d: "Philippe le Bon convoque pour la première fois les Etats généraux en 1464, à Bruges : nobles, clergés et bourgeois de toutes les terres bourguignonnes, réunis pour accorder des impôts, entendre des doléances et parler d'une seule voix au duc. C'est le premier rassemblement de ce type en Europe qui réunit les députés de tant de duchés et de comtés distincts sous une seule couronne. Les Etats de Flandre et de Brabant, de Hollande et de Hainaut, de Bourgogne et de Franche-Comté délibèrent ensemble. À partir de ce moment, le royaume n'est plus gouverné uniquement par un fiat ducal, mais par des négociations entre la couronne et ses terres constituantes : un principe constitutionnel qui survivra à toutes les dynasties qui détiennent le trône."
 nd_gbu.4.a: "Que les États soient entendus."

 # === DHE: Trier Coronation ===
 nd_gbu.5.t: "La couronne à Trèves"
 nd_gbu.5.d: "In the autumn of 1473 Charles the Bold rides to Trier with two thousand horse and a chest of gold to meet Emperor Frederick III. He demands the kingdom's recognition: a crown, a royal title, the elevation of the Burgundian state to sovereign equality with France and the Empire. Frederick is amenable; the negotiations are advanced; the crown itself is brought to the city. The marriage of Frederick's son Maximilian to Charles's daughter Mary is offered as the dynastic seal.\n\nIn the original course of events, Frederick fled Trier in the night and the deal collapsed. Here the deal does not collapse. But the king must still choose: shall the crown be received from imperial hands, an act of Christendom-wide recognition that binds Burgundy to the Empire by debt of dignity? Or shall it be claimed unilaterally, forged at home and placed by Burgundian hands alone, a sovereignty that owes nothing to any other prince?"
 nd_gbu.5.a: "Recevez la couronne des mains de l'empereur, reconnue dans toute la chrétienté"
 nd_gbu.5.b: "Forger la couronne à Bruxelles : la souveraineté bourguignonne ne doit rien"

 # === DHE: Burgundian Wars ===
 nd_gbu.6.t: "L'heure des guerres de Bourgogne"
 nd_gbu.6.d: "The Swiss Confederacy strikes from the south; Lorraine rebels in the centre; King Louis of France gathers his standards on the western frontier. The Burgundian Wars are upon the kingdom. Charles musters his ordonnance companies at Nancy. Two paths lie open.\n\nThe first: deepen the standing-army reform. Pour gold into the gendarmes, the bombard train, the disciplined squadrons of paid horse. Charles's compagnies d'ordonnance are the most professional cavalry in Europe; let them be made invincible.\n\nThe second: raise the militias of the cloth cities. Bruges, Ghent, Brussels, Liege can put thousands of pikemen in the field at a season's notice. The pike-square, the urban communal levy, has bested feudal cavalry before: at Courtrai, at Stiklestad, at Sempach. Let the cities defend the kingdom that grew from them."
 nd_gbu.6.a: "La réforme de la gendarmerie : versez tout dans les compagnies d'ordonnance"
 nd_gbu.6.b: "Mobilisation des milices : lever les villes drapées sous les armes"

 # === DHE: Croix de Bourgogne ===
 nd_gbu.7.t: "Le sautoir de Saint André"
 nd_gbu.7.d: "Sur chaque bataillon bourguignon est désormais érigée la même croix rouge : deux branches grossières nouées en sautoir, la croix de Saint-André. Là où les capitaines des Habsbourg le feront un jour parcourir la moitié du monde, ici il vole d'abord vers la Bourgogne. Toute lance de gendarme, toute bannière de piquier, toute blouse d'artilleur porte la croix de Bourgogne. L'hôte marche sous une seule marque et se connaît pour une seule nation."
 nd_gbu.7.a: "Laissez voler le sautoir."

 # === Advance Names ===
 nd_gbu_flemish_weaving_guilds: "Guildes flamandes de tissage"
 nd_gbu_flemish_weaving_guilds_desc: "Les drapiers de Bruges, Gand et Ypres organisent le commerce de la laine en corporations contrôlées par la ville. Leur étoffe, tissée à partir de toison anglaise, teinte en garance picarde, estampillée du label de qualité de la ville, domine les marchés d'Europe."
 nd_gbu_burgundian_court_ceremonial: "Cérémonie de la cour bourguignonne"
 nd_gbu_burgundian_court_ceremonial_desc: "Le Coudenberg à Bruxelles, le Prinsenhof à Bruges : les ducs de Bourgogne entretiennent la cour la plus spectaculaire de l'Europe du XVe siècle. Les banquets, les tournois, les processions et l'Ordre de la Toison d'Or projettent le prestige de la dynastie dans toute la chrétienté."
 nd_gbu_bruges_kontor: "Le Kontor de Bruges"
 nd_gbu_bruges_kontor_desc: "Le comptoir hanséatique de Bruges est sur un pied d'égalité avec Lübeck. Les marchands bourguignons négocient en tant que donneurs d'ordre et non en tant que fournisseurs ; le marché de Bruges dépasse le marché hanséen de Bergen et de Novgorod."
 nd_gbu_burgundian_crossbow: "Prélèvements d'arbalètes bourguignons"
 nd_gbu_burgundian_crossbow_desc: "Les cités drapières entretiennent des corporations d'arbalétriers : les confréries Saint-Joris et Saint-Sébastien de Bruges et de Gand. Leurs membres tirent chaque semaine sur le popinjay et se tiennent prêts à prendre le mur en temps de guerre."
 nd_gbu_order_of_the_golden_fleece: "Ordre de la Toison d'Or"
 nd_gbu_order_of_the_golden_fleece_desc: "La Toison d'Or, fondée à Bruges en 1430 par Philippe le Bon, est l'ordre chevaleresque le plus exclusif de la chrétienté. Trente et un chevaliers liés par serment à la dynastie, distingués par un collier de toisons ornées de bijoux."
 nd_gbu_flemish_pikeman: "Prélèvements des piquiers flamands"
 nd_gbu_flemish_pikeman_desc: "Les milices urbaines des cités drapières servent en formation de piques. Les mêmes hommes qui ont brisé la chevalerie française à Courtrai se dressent désormais comme une place aux brochets de la Renaissance."
 nd_gbu_flemish_cloth_charter_advance: "La Charte du Tissu"
 nd_gbu_flemish_cloth_charter_advance_desc: "Les corporations de drapiers obtiennent de la couronne des privilèges écrits : le droit d'inspecter les tissus, de les marquer, de défendre leur monopole contre les marchands étrangers. Le métier à tisser flamand devient le standard de la production textile européenne."
 nd_gbu_estates_general_advance: "Convocation générale des États"
 nd_gbu_estates_general_advance_desc: "Les Etats Généraux de Bourgogne se réunissent : nobles, clergés et bourgeois de tous les duchés et comtés parlent d'une seule voix. La première institution parlementaire composite en Europe."
 nd_gbu_compagnies_dordonnance: "Compagnies d'Ordonnance"
 nd_gbu_compagnies_dordonnance_desc: "Charles le Téméraire réforme l'armée bourguignonne sur le modèle français : des compagnies permanentes d'hommes d'armes rémunérés, entraînés en formation, alternant entre garnison et campagne, payés par le trésor plutôt que par un prélèvement féodal."
 nd_gbu_burgundian_gendarme: "Le Gendarme Bourguignon"
 nd_gbu_burgundian_gendarme_desc: "La cavalerie lourde des compagnies d'ordonnance : plat complet, cheval bardé, lance et réforme tactique. Les gendarmes de Charles constituent la cavalerie de choc la plus professionnelle de la chrétienté."
 nd_gbu_coulevrinier_corps: "Corps Coulevrinier"
 nd_gbu_coulevrinier_corps_desc: "Artilleurs de poing bourguignons armés de la couleuvrine, la première arme à feu à poudre. Ils sont recrutés dans les milices urbaines et côtoient les arbalétriers sur la ligne de bataille."
 nd_gbu_trier_crown: "La couronne de Trèves"
 nd_gbu_trier_crown_desc: "Le royaume obtient la reconnaissance royale que Charles a négociée avec l'empereur Frédéric III à Trèves en 1473. La Bourgogne se présente comme une monarchie souveraine, reconnue dans toute la chrétienté."
 nd_gbu_croix_de_bourgogne_advance: "Croix de Bourgogne"
 nd_gbu_croix_de_bourgogne_advance_desc: "Le sautoir de Saint-André, croix rouge grossière aux branches nouées, est adopté comme étendard de campagne de tout bataillon bourguignon. L'hôte marche sous une seule bannière."
 nd_gbu_mechelen_foundry_advance: "La fonderie de canons de Malines"
 nd_gbu_mechelen_foundry_advance_desc: "Malines devient le centre d'armement continental. Le train d'artillerie bourguignon, organisé dans la tradition des grandes bombardes de Charles le Téméraire, livre des canons en bronze coulé aux armées du roi."
 nd_gbu_grand_privilege: "Le grand privilège"
 nd_gbu_grand_privilege_desc: "Les États fixent des limites constitutionnelles à la couronne : le droit de consentir aux impôts, de convoquer leur propre assemblée, de refuser les nominations étrangères. Le royaume est gouverné par négociation et non par décret."
 nd_gbu_low_countries_urbanism: "Urbanisme des Pays-Bas"
 nd_gbu_low_countries_urbanism_desc: "L'urbanisation la plus dense d'Europe du Nord : Anvers, Bruxelles, Gand, Bruges, Amsterdam, Liège. Les Pays-Bas bourguignons détiennent un tiers de toutes les villes du royaume et produisent l'essentiel de ses richesses."
 nd_gbu_antwerp_exchange: "La Bourse d'Anvers"
 nd_gbu_antwerp_exchange_desc: "La Bourse d'Anvers, fondée comme première bourse de matières premières au monde. Les marchands bourguignons fixaient le prix européen du poivre, du cuivre, de l'argent et des lettres de change. La bourse devient le cœur financier du commerce européen."
 nd_gbu_burgundian_inheritance: "Diplomatie successorale bourguignonne"
 nd_gbu_burgundian_inheritance_desc: "La toile dynastique bourguignonne s'étend de Clèves aux Habsbourg, de la Lorraine à l'Angleterre. La stratégie matrimoniale du royaume en fait un pilier dynastique de la politique européenne."
 nd_gbu_embellished_court: "La cour embellie"
 nd_gbu_embellished_court_desc: "Le Coudenberg s'agrandit pour devenir un véritable palais royal ; le cérémonial de la cour de Bourgogne du XVe siècle s'est propagé à l'époque baroque comme une tradition souveraine plutôt que comme une importation hispano-habsbourgeoise."
 nd_gbu_lotharingian_industry: "Industrie lotharingienne"
 nd_gbu_lotharingian_industry_desc: "Première ceinture industrielle des provinces belges : charbon de Wallonie, métallurgie liégeoise, fer de Charleroi. Le royaume s'industrialise le plus tôt parmi les puissances continentales."
 nd_gbu_belgian_textile_revolution: "La révolution textile belge"
 nd_gbu_belgian_textile_revolution_desc: "Filatures de coton mécanisées à Gand sur le modèle britannique ; laine mécanisée à Verviers ; la révolution industrielle arrive aux Pays-Bas. Les halles aux draps de la cité médiévale servent désormais de galeries au-dessus des moulins en activité jour et nuit."
 nd_gbu_constitutional_estates: "Domaines constitutionnels"
 nd_gbu_constitutional_estates_desc: "Les États généraux sont pleinement institutionnalisés comme partenaire constitutionnel de la couronne. Le parlementarisme du XIXe siècle aux conditions bourguignonnes : une tradition continue qui remonte à Philippe le Bon."

 # === Building Names ===
 nd_gbu_flemish_cloth_hall: "Halle aux draps flamande"
 nd_gbu_flemish_cloth_hall_desc: "La grande salle publique des corporations de la laine, sur le modèle de la Lakenhalle d'Ypres et de la Halle aux Draps de Bruges. Le tissu est inspecté, estampillé, taxé et commercialisé sous un même toit."
 nd_gbu_court_palace: "Palais de justice bourguignon"
 nd_gbu_court_palace_desc: "Le palais ducal - le Coudenberg, le Prinsenhof, le Hof ten Walle - où la cour la plus spectaculaire de l'Europe du XVe siècle organise ses banquets, tournois et cérémonies chevaleresques."
 nd_gbu_hanseatic_counter: "Compteur hanséatique"
 nd_gbu_hanseatic_counter_desc: "Un comptoir commercial sur le modèle de Bruges, traitant sur un pied d'égalité avec la Ligue hanséatique. Les marchands bourguignons font du commerce en tant que principaux à travers la mer du Nord et la Baltique."
 nd_gbu_toison_dor_chapter_house: "Salle Capitulaire de la Toison d'Or"
 nd_gbu_toison_dor_chapter_house_desc: "La salle capitulaire de l'Ordre de la Toison d'Or. Les chevaliers de l'ordre se rassemblent ici pour les réunions de chapitre, les serments de fidélité et les grandes fêtes de chevalerie."
 nd_gbu_gendarme_drill_yard: "Cour d'exercices de gendarmerie"
 nd_gbu_gendarme_drill_yard_desc: "Le terrain d'entraînement des compagnies d'ordonnance : compagnies permanentes de hommes d'armes rémunérés, entraînés en formation, prêts à prendre le terrain. La première véritable armée permanente du continent occidental."
 nd_gbu_mechelen_foundry: "Fonderie de Canons de Malines"
 nd_gbu_mechelen_foundry_desc: "Fonderie de bronze de Malines, fonderie de canons pour le train d'artillerie bourguignon. Centre d'armement continental et fournisseur de bombardes dans toute l'Europe."
 nd_gbu_antwerp_bourse: "Bourse d'Anvers"
 nd_gbu_antwerp_bourse_desc: "La première véritable bourse de matières premières au monde. Les lettres de change, les obligations, le cuivre, le poivre et mille autres marchandises y sont cotés, fixant quotidiennement le prix européen."
 nd_gbu_belgian_textile_mill: "Usine textile belge"
 nd_gbu_belgian_textile_mill_desc: "Filature mécanisée de coton ou de laine sur le modèle britannique. Gand, Verviers et Roubaix mènent la révolution industrielle aux Pays-Bas."

 # === PM Names ===
 nd_gbu_chapter_house_upkeep: "Gestion des commandes"
 nd_gbu_chapter_house_upkeep_desc: "L'entretien cérémonial de l'Ordre : colliers, manteaux, banquets, insignes du serment chevaleresque."
 nd_gbu_cloth_hall_weaving: "Tissage De Laine Flamand"
 nd_gbu_cloth_hall_weaving_desc: "Laine filée, teinte et tissée pour obtenir le célèbre drap flamand, estampillé du sceau de la guilde."
 nd_gbu_cloth_hall_fine_weaving: "Production de tissus fins"
 nd_gbu_cloth_hall_fine_weaving_desc: "Les plus belles qualités de drap flamand, tissées avec du fil de soie importé et les teintures les plus profondes pour la noblesse européenne."
 nd_gbu_court_palace_upkeep: "Cérémonie à la cour"
 nd_gbu_court_palace_upkeep_desc: "L'approvisionnement des banquets, des tournois, des cortèges et du cérémonial quotidien de la cour bourguignonne."
 nd_gbu_kontor_upkeep: "Opérations Kontor"
 nd_gbu_kontor_upkeep_desc: "Les opérations quotidiennes du comptoir hanséatique : registres, emballage, expédition et entrepôts."
 nd_gbu_drill_yard_upkeep: "Compagnie Maintenance"
 nd_gbu_drill_yard_upkeep_desc: "La solde, les montures, l'équipement et la formation sur le terrain des compagnies d'ordonnance permanentes."
 nd_gbu_mechelen_cannons: "Moulage de canon en bronze"
 nd_gbu_mechelen_cannons_desc: "Canon en bronze de coulée pour le train d'artillerie bourguignonne : bombardes, serpentines et fauconets au modèle de Malines."
 nd_gbu_bourse_upkeep: "Compensation boursière"
 nd_gbu_bourse_upkeep_desc: "La compensation des effets, obligations et comptes à la Bourse d'Anvers, où le prix européen de chaque marchandise négociée est fixé quotidiennement."
 nd_gbu_textile_mill_weaving: "Tissu mécanisé"
 nd_gbu_textile_mill_weaving_desc: "Filature et tissage mécanisé de coton ou de laine à l'échelle industrielle, dans la tradition gantoise et verviétoise."

 # === Unit Names ===
 a_nd_gbu_crossbowman: "Arbalétrier Bourguignon"
 a_nd_gbu_crossbowman_desc: "Arbalétrier urbain des guildes de Sint-Joris. L'infanterie de missiles disciplinée et bien équipée des villes drapées, s'entraînait au popinjay tous les dimanches et était prête à prendre le mur en temps de guerre."
 a_nd_gbu_flemish_pikeman: "Piquier flamand"
 a_nd_gbu_flemish_pikeman_desc: "Milice urbaine de brochets des Pays-Bas. La même infanterie communale qui a brisé la chevalerie française à Courtrai, s'entraîne désormais sur la place aux brochets de la Renaissance."
 a_nd_gbu_gendarme: "Gendarme bourguignon"
 a_nd_gbu_gendarme_desc: "Cavalerie lourde des compagnies d'ordonnance : assiette pleine, cheval bardé, lance couchée. Fierté de Charles le Téméraire et cavalerie de choc la plus professionnelle de la fin du XVe siècle."
 a_nd_gbu_coulevrinier: "Coulevrinier"
 a_nd_gbu_coulevrinier_desc: "Mitrailleur bourguignon armé de la couleuvrine : une arquebuse ancienne à crosse longue. Recruté dans les milices urbaines, il fait le pont entre l'arbalète et le mousquet."

 # === Levy Names ===
 levy_nd_gbu_crossbowman: "Prélèvement sur l'arbalète"
 levy_nd_gbu_crossbowman_desc: "Prélèvement auprès des guildes urbaines d'arbalétriers des cités drapières."
 levy_nd_gbu_flemish_pikeman: "Prélèvement des piquiers"
 levy_nd_gbu_flemish_pikeman_desc: "Prélèvement auprès des milices bourgeoises de brochets des Pays-Bas."

