 # === Additional advance loc ===
 nd_gbu_burgundian_painting: "Peinture flamande"
 nd_gbu_burgundian_painting_desc: "Le Retable de Gand de Van Eyck, les portraits de Van der Weyden, Memling et Bouts - les Primitifs flamands établissent une école d'art continentale dont le réalisme, la technique à l'huile et l'intensité dévotionnelle deviennent la norme de la peinture européenne."
 nd_gbu_dunkirk_privateers: "Corsaires de la Manche Bourguignonne"
 nd_gbu_dunkirk_privateers_desc: "Lettres de marque émises de Dunkerque, Ostende et Nieuport. Les corsaires bourguignons harcèlent les navires anglais et français dans la Manche et la mer du Nord, masquant ainsi le commerce du royaume pendant la guerre."

 # === Walloon Coal Basin ===
 nd_gbu_walloon_coal: "Bassin houiller wallon"
 nd_gbu_walloon_coal_desc: "The Sambre-Meuse coal belt: Charleroi, Mons, the Borinage. The richest coalfield of continental Europe and the foundation of Belgian heavy industry."
 nd_gbu_walloon_coalworks: "Charbonnières de Sambre-Meuse"
 nd_gbu_walloon_coalworks_desc: "Une mine à ciel ouvert de l'ère industrielle extrayant du charbon du bassin wallon. Charleroi, Mons et le Borinage sont les moteurs de l'industrialisation du royaume."
 nd_gbu_walloon_coal_mining: "Extraction de charbon"
 nd_gbu_walloon_coal_mining_desc: "Extraction à ciel ouvert du charbon bitumineux des filons de Sambre-Meuse, cœur du combustible industriel continental."

 # === Destiny Tree ===
 nd_gbu_destiny: "La question lotharingienne"
 nd_gbu_destiny_desc: "The crown is placed; the kingdom is formed. But the long arc of Burgundian power admits two destinies. Restore the Lotharingian Middle Kingdom as a Frankish-Imperial successor state, contesting the Imperial title across the Rhine, or extend the kingdom seaward as the financial pivot of Atlantic Europe, the bourse of bourses. Maintain stability while the realm chooses its course."

 nd_gbu_dest_rhineland_frontier: "La frontière rhénane"
 nd_gbu_dest_rhineland_frontier_desc: "Tenez la colonne vertébrale de l’ancien Empire du Milieu de Lothaire. Trèves, où l'on cultivait autrefois la pourpre de Constantin ; Aix-la-Chapelle, où est enterré Charlemagne et où sont couronnés les rois du Saint-Empire. Deux villes, un projet : le cœur carolingien reconquis par la couronne bourguignonne."
 nd_gbu_dest_imperial_march: "La marche impériale"
 nd_gbu_dest_imperial_march_desc: "Drive the Burgundian standards deeper into Imperial soil. Cologne, the great free city of the Rhine; Mainz, the elector-archbishop's seat; Kleve, holding the Lower Rhine to the sea. The kingdom becomes the dominant Rhenish power, and Nancy, which Charles the Bold meant for his capital, is built up as the hinge between its two halves."
 nd_gbu_dest_imperial_title: "La couronne de César Lotharius"
 nd_gbu_dest_imperial_title_desc: "Détiennent les villes où est construit l'Empire : Francfort, siège des élections, Worms, ville-diète, Nuremberg, gardien du Reichskleinodien. La couronne bourguignonne n'est plus un royaume parmi les royaumes mais l'héritière de l'Empire franc lui-même. César Lotharius monte à la tête de l’armée, et les presses à imprimer chantent ses louanges dans toute la chrétienté."

 nd_gbu_dest_channel_mastery: "La maîtrise du canal"
 nd_gbu_dest_channel_mastery_desc: "Contestez les eaux occidentales. Douvres commande le détroit ; Rouen la Seine ; Portsmouth le Solent. La flotte maritime bourguignonne affirme sa domination sur les routes qui transportent les tissus des Pays-Bas vers tous les marchés de l'Europe atlantique."
 nd_gbu_dest_atlantic_outposts: "Les avant-postes de l'Atlantique"
 nd_gbu_dest_atlantic_outposts_desc: "Plant the Burgundian flag on the islands beyond the western horizon. The Azores in mid-ocean; Madeira on the African coast. The kingdom takes its first ocean-facing colonies and joins the Age of Discovery on its own terms, with cloth halls behind it and Antwerp, grown from a river town into the first port of the north, as its bourse."
 nd_gbu_dest_world_bourse: "La Bourse mondiale"
 nd_gbu_dest_world_bourse_desc: "Anvers apparaît comme le cœur financier de l’Europe atlantique. Poivre des Indes et soie d'Orient s'éclaircissent à la bourse bourguignonne ; les lettres de change écrites à Gênes et à Florence sont ici honorées aux taux bourguignons. Le royaume est devenu ce qu’il a toujours voulu être : le marchand des marchands, le centre d’échange du monde."

 # === Destiny DHE Events ===
 nd_gbu.8.t: "La couronne de Lothaire restaurée"
 nd_gbu.8.d: "The accession ceremonies are concluded; the crown rests at last on a Burgundian brow. Across every cloth hall and every gendarme barracks, across the burgher markets of Antwerp and the wine cellars of Beaune, the realm takes stock of itself. A century of patient assembly (by Philip the Bold, John the Fearless, Philip the Good, Charles the Bold) has at last produced a sovereign state.\n\nThe long road, though, branches now. The realm must choose its destiny."
 nd_gbu.8.a: "Laissez le chemin choisi se dérouler."

 nd_gbu.9.t: "Le cœur carolingien"
 nd_gbu.9.d: "Trèves et Aix-la-Chapelle sont prises. Constantin le Grand tenait autrefois sa cour à la Porta Nigra ; les ossements de Charlemagne reposent sous la coupole de la chapelle palatine. Les étendards bourguignons flottent au-dessus des deux villes. La chronique du royaume se lit désormais comme la chronique de l'ancien Empire du Milieu : les terres de Lothaire Ier restaurées, le manteau impérial ajusté à l'épaule bourguignonne. Les compagnies d'ordonnance roulent vers l'est sur les voies romaines."
 nd_gbu.9.a: "La couronne lotharingienne se lève."

 nd_gbu.10.t: "La marche impériale"
 nd_gbu.10.d: "Cologne, Mainz, and Kleve fall to the Burgundian advance. The free city of the Rhine, the elector-archbishop's seat, and the Lower Rhine bishopric are all gathered into the kingdom. The Imperial diet sits in panic; Habsburg envoys ride between courts seeking allies; the College of Electors trembles.\n\nThe king must decide how to govern this conquered march. Pour gold into the war chest: press the campaign deeper, take the Empire by storm. Or open negotiations with the diet: offer the conquered princes seats at a Burgundian high court, integrate them by political bargain rather than the sword."
 nd_gbu.10.a: "Le trésor de guerre : poussez la campagne vers l'est."
 nd_gbu.10.b: "L'ouverture du régime : lier les princes conquis par un marché."

 nd_gbu.11.t: "César Lotharius couronné"
 nd_gbu.11.d: "Frankfurt, Worms, and Nuremberg fly the Burgundian saltire. The free cities of the Empire are held; the election seat where the Holy Roman kings are chosen is Burgundian; the Reichskleinodien (the imperial regalia) rest in Burgundian hands. Caesar Lotharius is the new style: the Burgundian-Lotharingian heir to Charlemagne, the Caesar of the restored Frankish Middle Kingdom.\n\nThe coronation is the work of months. Will it be commemorated as a triumph of arms, the gendarme companies riding through cheering Frankfurt streets? Or as a triumph of office, the palatine chapel raised at Aachen and the Burgundian court installed as the new Imperial seat?"
 nd_gbu.11.a: "Triumph of arms: the host parades through Frankfurt."
 nd_gbu.11.b: "Triomphe de la fonction : la cour palatine est installée à Aix-la-Chapelle."

 nd_gbu.12.t: "La maîtrise du canal"
 nd_gbu.12.d: "Douvres, Rouen et Portsmouth sont pris. Le détroit du Pas-de-Calais, l'embouchure de la Seine, le Solent et la Manche occidentale : la flotte bourguignonne mouille dans les trois. Tissus, vins, poissons et lettres de change circulent désormais sous convoi bourguignon de la Manche à la mer du Nord. Le royaume est devenu une puissance maritime."
 nd_gbu.12.a: "La Manche Bourguignonne."

 nd_gbu.13.t: "Les avant-postes de l'Atlantique"
 nd_gbu.13.d: "The Azores and Madeira fly the saltire of Saint Andrew. Burgundian factors keep books at Ponta Delgada; Burgundian sugar mills crush cane at Funchal. The kingdom has joined the Age of Discovery, with the cloth halls behind it and Antwerp as its bourse.\n\nHow shall the new outposts be governed? As royal expeditions: the Burgundian Argonauts under crown command, naval explorers in the king's service. Or as chartered trading concerns: bourgeois investors in the Estates' hands, free to expand the kingdom's reach as far as the wind will carry their ships."
 nd_gbu.13.a: "Les Argonautes : expéditions navales sous la couronne."
 nd_gbu.13.b: "Les chartes : des entreprises commerciales bourgeoises sous les États."

 nd_gbu.14.t: "La Bourse du Monde"
 nd_gbu.14.d: "Antwerp is the clearing house of the Atlantic. Pepper, silk, silver, copper, sugar, and bills of exchange clear at the Burgundian bourse. The Italian banking houses keep counting offices on the Meir; the Fugger correspondents in Augsburg follow Antwerp prices; the Spanish silver fleets remit to Burgundian factors.\n\nA final question: shall the bourse be made a true clearing house of all Europa (the dependable settlement engine for every prince's debts and merchant's bills) or shall it be the headquarters of an Atlantic floribunda, the kingdom expanding its colonial reach as far as the navy's wake will carry it?"
 nd_gbu.14.a: "La chambre de compensation : la bourse règle les dettes de l'Europe."
 nd_gbu.14.b: "Le floribunda atlantique : la zone coloniale s'étend vers la mer."

 # === Destiny Timed Modifiers ===
 STATIC_MODIFIER_NAME_nd_gbu_dest_rhineland_war_chest: "Trésor de guerre de Rhénanie"
 STATIC_MODIFIER_DESC_nd_gbu_dest_rhineland_war_chest: "Le Trésor, la Monnaie et les collecteurs d'impôts se sont tous penchés sur la campagne impériale. Les compagnies de gendarmerie se mettent en mouvement ; le train de bombardement roule vers l’est. Le royaume paie la guerre en monnaie et en inflation, mais la guerre est en train d’être gagnée."
 STATIC_MODIFIER_NAME_nd_gbu_dest_imperial_diet_overture: "Ouverture de la Diète Impériale"
 STATIC_MODIFIER_DESC_nd_gbu_dest_imperial_diet_overture: "Les princes vaincus sont convoqués devant un tribunal de grande instance bourguignon. Les garnisons tiennent les villes ; les chartes et les serments intègrent la noblesse locale par le biais de négociations plutôt que par l'épée. La marche est liée au royaume par une ligature politique, et non par le seul poids militaire."

 STATIC_MODIFIER_NAME_nd_gbu_dest_caesar_lotharius: "César Lotharius"
 STATIC_MODIFIER_DESC_nd_gbu_dest_caesar_lotharius: "Le roi de Bourgogne porte la dignité impériale. L'hôte défile dans Francfort sous le sautoir ; les bombardements annoncent la victoire à chaque siège électoral ; les chroniques parlent de César Lotharius comme de la renaissance de Charlemagne."
 STATIC_MODIFIER_NAME_nd_gbu_dest_palatine_court: "La Cour Palatine"
 STATIC_MODIFIER_DESC_nd_gbu_dest_palatine_court: "La chapelle palatine d'Aix-la-Chapelle est restaurée et devient le nouveau siège impérial. La cour bourguignonne s'installe parmi les ossements de Charlemagne ; les chantiers de construction à travers le royaume élèvent des palais à la hauteur."

 STATIC_MODIFIER_NAME_nd_gbu_dest_burgundian_argonauts: "Les Argonautes Bourguignons"
 STATIC_MODIFIER_DESC_nd_gbu_dest_burgundian_argonauts: "Les expéditions royales naviguent sous le sautoir : explorateurs au service du roi, escadres navales cartographiant l'Atlantique. La flotte s'entraîne, les chantiers navals fonctionnent, le royaume se tourne vers l'horizon occidental."
 STATIC_MODIFIER_NAME_nd_gbu_dest_atlantic_charters: "Chartes de l'Atlantique"
 STATIC_MODIFIER_DESC_nd_gbu_dest_atlantic_charters: "Les investisseurs bourgeois d'Anvers et de Bruges achètent des chartes royales et équipent leurs propres entreprises. La gamme commerciale s’étend ; les maisons de marchands tiennent des livres à travers trois océans. La portée du royaume s'accroît grâce aux capitaux privés, même si les avant-postes éloignés mettent à rude épreuve les liens de loyauté."

 STATIC_MODIFIER_NAME_nd_gbu_dest_clearing_house_europa: "Le Centre d’échange d’informations d’Europe"
 STATIC_MODIFIER_DESC_nd_gbu_dest_clearing_house_europa: "Anvers règle les dettes de l'Europe. Les banques italiennes, les marchands d'Augsbourg, les flottes d'argent espagnoles et les drapiers anglais y tiennent tous des comptes. La bourse est le moteur fiable de règlement des factures de chaque prince."
 STATIC_MODIFIER_NAME_nd_gbu_dest_atlantic_floribunda: "Floribunda atlantique"
 STATIC_MODIFIER_DESC_nd_gbu_dest_atlantic_floribunda: "Le royaume s’épanouit outre-Atlantique. Les voiles bourguignonnes envahissent les routes coloniales ; les populations indigènes des avant-postes sont absorbées par le commerce du royaume. Les nouvelles terres consomment des armées, mais la richesse qu’elles restituent est incalculable."

 # === Destiny Buildings ===
 nd_gbu_carolingian_palatium: "Palais carolingien"
 nd_gbu_carolingian_palatium_desc: "La chapelle palatine et siège royal de style carolingien : nef octogonale, colonnes de marbre, mosaïques au motif byzantin. Inspiré du palais de Charlemagne à Aix-la-Chapelle et érigé comme le sceau architectural de l'empire lotharingien restauré."
 nd_gbu_world_bourse: "Bourse mondiale"
 nd_gbu_world_bourse_desc: "L'expansion de la Bourse d'Anvers en une véritable chambre de compensation mondiale. Les lettres de change, les obligations, les matières premières et les transferts d'argent en provenance de trois océans sont compensés ici quotidiennement. La bourse est le pivot financier du monde atlantique."

 # === Destiny PMs ===
 nd_gbu_palatium_upkeep: "Entretien du Palatin"
 nd_gbu_palatium_upkeep_desc: "L'entretien cérémonial de la chapelle palatine impériale : cierges, vêtements, insignes de procession et liturgie quotidienne du César bourguignon."
 nd_gbu_world_bourse_upkeep: "Compensation du monde"
 nd_gbu_world_bourse_upkeep_desc: "La compensation des effets, des obligations et des comptes à la Bourse mondiale, où est réglé le prix européen de chaque bien échangé et de la dette de chaque prince."

 # === Bureaucracies ===
 AUTO_MODIFIER_NAME_nd_gbu_bureaucracy_authority: "Administration Composite Bourguignonne"
 AUTO_MODIFIER_DESC_nd_gbu_bureaucracy_authority: "L'État bourguignon regroupe dix-sept provinces sous une seule chancellerie magistrale. Le conseil royal peut soutenir deux institutions permanentes en plus de l'établissement de la capitale."

 gbu_etats_generaux_bureaucracy: "Etats Généraux de Bourgogne"
 gbu_etats_generaux_bureaucracy_desc: "Diète représentative permanente de l'arc bourguignon, convoquée pour la première fois à Bruges par Philippe le Bon en janvier 1464 en tant qu'assemblée unique des trois domaines de toutes ses terres. Là où les États généraux français siégeaient à la convocation du roi et se dispersaient à son gré, les États généraux bourguignons devenaient un partenaire constitutionnel permanent : le roi ne pouvait lever aucune aide sans leur consentement, et le Grand Privilège de 1477 codifiait leur droit de se convoquer. L'institution était l'ancêtre direct des États généraux de la République néerlandaise."

 gbu_toison_dor_bureaucracy: "Ordre de la Toison d'Or"
 gbu_toison_dor_bureaucracy_desc: "L'Ordre de la Toison d'Or, fondé à Bruges le 10 janvier 1430 par Philippe le Bon le jour de son mariage avec Isabelle du Portugal. Vingt-quatre chevaliers à la fondation (portés à trente et un en 1432, cinquante et un sous Charles Quint), chaque grande maison du patrimoine bourguignon lié à la dynastie par un serment chevaleresque personnel. Le Souverain-Roi d'Armes tient le registre des armoiries ; les Statuts règlent les chapitres, les expulsions et l'héritage des stalles. À la fois corps chevaleresque, instrument diplomatique et mécanisme politique pour lier la haute noblesse à la maison magistrale."

 gbu_chambre_des_comptes_bureaucracy: "Chambre des Comptes de Lille"
 gbu_chambre_des_comptes_bureaucracy_desc: "Chambre bourguignonne des comptes financiers, créée à Lille en 1386 par Philippe le Téméraire (une chambre de Bruxelles fut ajoutée en 1404 pour le domaine brabançon, et à partir de 1473 le travail de contrôle fut progressivement centralisé à Malines sous Charles le Téméraire). Ses auditeurs et trésoriers examinent chaque revenu de domaine, ferme douanière et aide féodale sur les terres du roi ; la pièce de monnaie en gros argent bourguignon fixe une norme monétaire à l'échelle du royaume. Au milieu du XVe siècle, l’une des bureaucraties du Trésor les plus disciplinées d’Europe latine."

 gbu_grand_conseil_malines_bureaucracy: "Grand Conseil de Malines"
 gbu_grand_conseil_malines_bureaucracy_desc: "Conseil judiciaire suprême et chancellerie des Pays-Bas bourguignons, institué par l'édit de Charles le Téméraire du 8 décembre 1473 à Malines comme tribunal central de dernier ressort pour les dix-sept provinces. Elle connaît des appels des conseils provinciaux de Hollande, du Brabant, de Flandre et du Hainaut ; scelle les décrets magistraux ; et contourne les cours seigneuriales de la haute noblesse. L'ancêtre institutionnel des conseils centraux bruxellois des Pays-Bas des Habsbourg."
