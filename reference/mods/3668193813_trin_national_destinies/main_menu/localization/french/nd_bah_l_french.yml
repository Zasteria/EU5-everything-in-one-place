l_french:
 # ===== ADVANCES: Age 1 =====
 nd_bah_sultanate_foundations: "Fondations du Sultanat"
 nd_bah_sultanate_foundations_desc: "Le sultanat Bahmani, né de la rébellion contre le régime lointain de Delhi, a créé le premier État musulman indépendant sur le plateau du Deccan. Sous Ala-ud-Din Hasan Bahman Shah, la nouvelle dynastie revendiquait la légitimité et centralisait l'autorité sur ses vastes domaines."
 nd_bah_gulbarga_fortress: "Fortifications de Gulbarga"
 nd_bah_gulbarga_fortress_desc: "La grande forteresse de Gulbarga, entourée de doubles douves et de quinze tours, constituait le cœur imprenable du premier État bahmani. Ses murs abritaient la première capitale et projetaient la puissance du sultanat à travers l’ouest du Deccan."
 nd_bah_persianate_darbar: "Cour persane"
 nd_bah_persianate_darbar_desc: "La cour Bahmani s'est consciemment modelée sur les traditions persanes, en faisant venir des érudits, des poètes et des administrateurs d'Iran et d'Asie centrale. La salle du Darbar est devenue un centre de culture raffinée où l'étiquette persane régissait les affaires de l'État."
 nd_bah_deccani_horsemen: "Cavaliers Deccani"
 nd_bah_deccani_horsemen_desc: "Les sultans bahmanis investirent massivement dans la cavalerie, important des chevaux arabes et persans via les ports occidentaux. Les sowars à cheval constituaient l'arme de frappe des armées du sultanat sur le plateau du Deccan."
 nd_bah_arabian_horse_trade: "Commerce de chevaux arabes"
 nd_bah_arabian_horse_trade_desc: "Le contrôle des ports de la côte ouest comme Chaul et plus tard Goa a donné aux Bahmanis un accès direct au commerce des chevaux arabes. Ces importations ont soutenu la supériorité de la cavalerie du sultanat sur ses rivaux de Vijayanagara."
 nd_bah_bahmani_legal_code: "Code juridique Bahmani"
 nd_bah_bahmani_legal_code_desc: "Les premiers sultans bahmanis ont établi un cadre juridique systématique s'appuyant sur la jurisprudence islamique et la tradition administrative perse, mettant de l'ordre dans la gouvernance de leurs divers domaines."
 nd_bah_deccan_plateau_farming: "Agriculture du plateau du Deccan"
 nd_bah_deccan_plateau_farming_desc: "Le sol noir du plateau du Deccan, enrichi par les moussons saisonnières, soutenait une agriculture extensive. Le coton, le mil et les légumineuses nourrissaient la population croissante du sultanat et alimentaient son économie."
 # ===== ADVANCES: Age 2 =====
 nd_bah_gawan_reforms: "Les réformes administratives de Gawan"
 nd_bah_gawan_reforms_desc: "Le grand vizir Mahmud Gawan a réorganisé l'État bahmani en huit provinces, chacune sous un tarafdar avec des responsabilités fixes. Ses réformes réduisirent le pouvoir de la noblesse et renforcèrent l'autorité centrale en matière de perception des impôts et des affaires militaires."
 nd_bah_gawan_madrasa: "Médersa Mahmud Gawan"
 nd_bah_gawan_madrasa_desc: "La magnifique madrasa de Bidar, construite par Mahmud Gawan en 1472, s'élevait sur trois étages et abritait une bibliothèque de trois mille manuscrits. Il est devenu un phare de l’érudition islamique, attirant des étudiants et des universitaires du monde musulman."
 nd_bah_bidriware_craft: "Ferronnerie Bidriware"
 nd_bah_bidriware_craft_desc: "Under Bahmani patronage, artisans in Bidar perfected a unique metalworking technique, casting zinc-copper alloy vessels, then inlaying them with silver in intricate arabesque patterns. Blackened with a soil paste mixed with ammonium chloride, the finished pieces became prized across the Indian Ocean world."
 nd_bah_early_gunpowder: "Poudre à canon Deccan"
 nd_bah_early_gunpowder_desc: "Le sultanat de Bahmani fut probablement le premier État indien à employer l'artillerie à poudre. Dans les années 1460, la forteresse de Kalyana avait des ports d'armes construits dans ses murs, et des artilleurs topchi servaient dans toutes les grandes campagnes."
 nd_bah_dabhol_trade: "Port de Dabhol"
 nd_bah_dabhol_trade_desc: "The capture of Dabhol and later Goa gave the Bahmanis direct access to maritime trade with Persia, Arabia, and East Africa. These ports became conduits for horse imports, luxury goods, and Persian cultural influence."
 nd_bah_persian_literary_tradition: "Cour littéraire persane"
 nd_bah_persian_literary_tradition_desc: "La cour Bahmani cultivait le persan comme langue de l'administration et de la haute culture. Des poètes, des historiens et des érudits iraniens ont trouvé un patronage à Gulbarga et Bidar, créant ainsi une tradition littéraire persane dynamique sur le sol indien."
 nd_bah_caravanserai_network: "Réseau de caravansérails"
 nd_bah_caravanserai_network_desc: "A network of caravanserais along major trade routes provided secure lodging, water, and protection for merchants crossing the Deccan. These rest houses facilitated overland commerce and helped bind the Sultanate's far-flung provinces."
 # ===== ADVANCES: Age 3 =====
 nd_bah_vijayanagara_wars: "Guerres contre Vijayanagara"
 nd_bah_vijayanagara_wars_desc: "La lutte entre le sultanat de Bahmani et l'empire de Vijayanagara a défini un siècle d'histoire du Deccani. Le contrôle du Raichur Doab, la terre fertile située entre les rivières Krishna et Tungabhadra, était une récompense perpétuelle pour laquelle il valait la peine de se battre."
 nd_bah_siege_artillery: "Corps d'artillerie de siège"
 nd_bah_siege_artillery_desc: "Sous le commandement de Mahmud Gawan, les Bahmanis ont développé des techniques de siège spécialisées, notamment l'exploitation minière et le tir de canon dirigé. Pendant le siège de Belgaum en 1472, des pompiers dévoués ont percé les fortifications en utilisant des méthodes jamais vues auparavant sur le Deccan."
 nd_bah_afaqi_deccani_balance: "Equilibre Afaqi-Deccani"
 nd_bah_afaqi_deccani_balance_desc: "Le sultanat était perpétuellement divisé entre les nobles Afaqi (Perses, Turcs et Arabes nés à l'étranger qui détenaient une influence à la cour) et les Deccanis, musulmans nés localement et affranchis Habshi qui contrôlaient les provinces. La gestion de cet équilibre était le défi central de la politique bahmanie."
 nd_bah_deccan_textiles: "Commerce textile du Deccan"
 nd_bah_deccan_textiles_desc: "The Deccan's cotton weaving traditions produced fine textiles sought after across the Indian Ocean world. The Sultanate's control of both the production centers and the western coastal ports made textiles a cornerstone of Bahmani prosperity. Its own cloth was himroo, cotton and silk woven together at Daulatabad by weavers who had come south with the Tughluq court and stayed."
 nd_bah_polygon_bastions: "Bastions Polygones"
 nd_bah_polygon_bastions_desc: "S'adaptant à l'ère de la poudre à canon, les ingénieurs militaires Bahmani ont conçu des fortifications avec des bastions angulaires capables de monter des canons dans des champs de tir qui se chevauchent. Dans les années 1460, ces innovations avaient transformé le paysage défensif du Deccan."
 nd_bah_sultanate_diplomacy: "Diplomatie du Sultanat"
 nd_bah_sultanate_diplomacy_desc: "Les sultans bahmani entretenaient des relations diplomatiques à travers le monde islamique, échangeant des ambassadeurs avec les Mamelouks, les Timurides et l'Empire ottoman. Ces relations ont fourni des recrues militaires, des échanges culturels et une légitimité politique."
 # ===== ADVANCES: Age 4 =====
 nd_bah_successor_state_legacy: "Héritage de l'État successeur"
 nd_bah_successor_state_legacy_desc: "Bien que l’État bahmani se soit fragmenté après 1518, ses traditions administratives, ses innovations militaires et ses réalisations culturelles ont perduré dans les sultanats qui lui ont succédé. Les institutions bâties par Mahmud Gawan se sont révélées plus durables que la dynastie elle-même."
 nd_bah_tofangchi_musketeers: "Mousquetaires Tofangchi"
 nd_bah_tofangchi_musketeers_desc: "L'infanterie à mèche entraînée est devenue un incontournable des armées Deccani. Ces tofangchi, dont beaucoup étaient recrutés parmi les immigrants persans et d'Asie centrale, ont introduit des tactiques d'armes à feu disciplinées sur le champ de bataille."
 nd_bah_diamond_mines: "Extraction de diamants"
 nd_bah_diamond_mines_desc: "The Deccan Plateau held some of the world's most productive diamond deposits. The Golconda mines yielded stones of legendary quality, including what would later become known as the Hope Diamond and the Koh-i-Noor."
 nd_bah_deccani_miniatures: "Peinture miniature Deccani"
 nd_bah_deccani_miniatures_desc: "Une école distinctive de peinture miniature a prospéré dans les sultanats du Deccan, mêlant les influences persanes, indiennes et même européennes dans une esthétique propre au Deccani, marquée par des couleurs vives et des images fantastiques."
 nd_bah_revenue_taraf_system: "Système de tarification des revenus"
 nd_bah_revenue_taraf_system_desc: "Le système fiscal provincial de Bahmani divisait le royaume en tarafs, chacun avec une collecte systématique des impôts supervisée par des fonctionnaires nommés au niveau central. Ce cadre, affiné au fil des générations, assurait un flux constant de revenus au trésor du Sultanat."
 nd_bah_deccani_syncretism: "Syncrétisme Deccani"
 nd_bah_deccani_syncretism_desc: "Des siècles de coexistence musulmane et hindoue sur le Deccan ont produit une culture syncrétique distinctive. Les saints soufis attiraient les fidèles hindous, les danseurs des temples se produisaient dans les cours musulmanes et les fêtes partagées brouillaient les frontières entre les communautés."
 # ===== ADVANCES: Age 5 =====
 nd_bah_nizam_administration: "Administration de Nizam"
 nd_bah_nizam_administration_desc: "Les traditions administratives de l'État bahmani ont trouvé leur pleine expression dans la gouvernance du Nizam-ul-Mulk. Une bureaucratie systématique, une évaluation régulière des revenus et une organisation provinciale maintenaient l'ordre dans tout le Deccan."
 nd_bah_european_military_contact: "Contact militaire européen"
 nd_bah_european_military_contact_desc: "Les contacts avec les conseillers militaires et les marchands européens ont introduit de nouvelles techniques d'exercices, de conception de fortifications et de déploiement d'artillerie. Les dirigeants Deccani ont adopté sélectivement ces innovations pour moderniser leurs forces armées."
 nd_bah_deccani_water_works: "Travaux d'eau de Deccani"
 nd_bah_deccani_water_works_desc: "Des puits à gradins, des aqueducs et des canaux d'irrigation élaborés à travers le Deccan ont apporté de l'eau aux régions arides et soutenu l'expansion agricole. Ces travaux publics représentaient un investissement important de l’État dans les infrastructures."
 nd_bah_reformed_sipahi: "Sipahi réformé"
 nd_bah_reformed_sipahi_desc: "S'adaptant à la nature changeante de la guerre, la cavalerie lourde Deccani subit une réforme. Les sipahi réformés combinaient des tactiques de choc traditionnelles avec des tactiques au pistolet adaptées au champ de bataille de la poudre à canon."
 nd_bah_deccani_trade_maturity: "Maturité commerciale Deccani"
 nd_bah_deccani_trade_maturity_desc: "À l'ère de l'absolutisme, les réseaux commerciaux du Deccan étaient devenus un système sophistiqué de routes commerciales terrestres et maritimes reliant le plateau intérieur aux côtes et au-delà."
 # ===== ADVANCES: Age 6 =====
 nd_bah_modern_administration: "Administration moderne"
 nd_bah_modern_administration_desc: "Les réformes administratives de l’époque des Lumières ont apporté une tenue systématisée des registres, une fiscalité régularisée et une gouvernance provinciale rationalisée aux États successeurs de la tradition bahmanie."
 nd_bah_deccani_cultural_legacy: "Héritage culturel Deccani"
 nd_bah_deccani_cultural_legacy_desc: "Les réalisations culturelles de l'ère Bahmani (articles Bidri, peinture miniature Deccani, architecture d'influence persane et tradition littéraire Dakhani) sont restées un héritage durable de la civilisation Deccani."
 nd_bah_cultural_synthesis: "Synthèse culturelle"
 nd_bah_cultural_synthesis_desc: "La longue coexistence des traditions musulmanes, hindoues et autres sur le Deccan a produit une synthèse culturelle unique dans le sous-continent, enrichissant la musique, la cuisine, la langue et les arts de formes hybrides."
 nd_bah_industrial_workshops: "Ateliers industriels"
 nd_bah_industrial_workshops_desc: "The Deccan's traditional textile crafts and metalworking traditions provided a foundation for early industrial workshops, as mechanized cotton processing and metal fabrication emerged.\n\n#italic Available in: $nd_bah_himroo_looms$#!"
 nd_bah_modern_field_guns: "Canons de campagne modernes"
 nd_bah_modern_field_guns_desc: "S'appuyant sur des siècles d'expertise en matière de poudre à canon, les arsenaux Deccani ont produit une artillerie de campagne moderne intégrant les principes de conception européens avec une capacité de fabrication locale."
 # ===== UNITS =====
 a_nd_bah_deccani_sowar: "Deccani Sowar"
 a_nd_bah_deccani_sowar_desc: "Cavalerie montée sur des chevaux arabes importés, les sowars Deccani étaient l'arme de frappe des armées bahmani. Rapides, disciplinés et élevés pour les plateaux ouverts, ils dominaient le champ de bataille."
 a_nd_bah_topchi: "Topchi"
 a_nd_bah_topchi_desc: "Le premier corps d'artillerie à poudre du sous-continent indien. Les artilleurs bahmani topchi utilisaient des canons importés ou inspirés de modèles ottomans et persans, apportant une puissance de feu dévastatrice au siège et sur le terrain."
 a_nd_bah_siege_topchi: "Siège de Topchi"
 a_nd_bah_siege_topchi_desc: "Des équipes d'artillerie de siège spécialisées qui combinaient les tirs de canon avec les opérations minières. Sous le commandement de Mahmud Gawan, ces ingénieurs ont percé les fortifications en utilisant des techniques jamais employées auparavant sur le Deccan."
 a_nd_bah_tofangchi: "Tofangchi"
 a_nd_bah_tofangchi_desc: "Infanterie à mèche entraînée, dont beaucoup sont recrutées parmi les immigrants persans et d'Asie centrale. Les tofangchi ont apporté des tirs de volée disciplinés sur le champ de bataille de Deccani, complétant l'arme de cavalerie traditionnelle du sultanat."
 a_nd_bah_reformed_sipahi: "Sipahi réformé"
 a_nd_bah_reformed_sipahi_desc: "La cavalerie lourde s'est réformée pour l'ère de la poudre à canon, combinant la tradition de la charge de choc avec des tactiques armées de pistolets. Ces cavaliers d'élite ont servi d'arme décisive dans les guerres ultérieures du Deccani."
 a_nd_bah_field_gun: "Canon de campagne Deccani"
 a_nd_bah_field_gun_desc: "Artillerie de campagne moderne s'appuyant sur des siècles d'expertise Deccani en matière de poudre à canon. Plus légers et plus mobiles que les pièces de siège, ces canons fournissaient une puissance de feu dévastatrice sur le champ de bataille."
 # ===== BUILDINGS =====
 nd_bah_qila: "Qila"
 nd_bah_qila_desc: "Une forteresse perchée sur une colline du Deccan dans la tradition bahmanie, construite à partir de basalte local et conçue pour résister à un siège prolongé. Ses tours et ses murailles dominent le plateau environnant."
 nd_bah_darbar_hall: "Salle Darbar"
 nd_bah_darbar_hall_desc: "Une salle de tribunal construite dans la tradition persane, où le sultan tient audience et où les affaires de l'État sont conduites selon l'étiquette raffinée de la cour persane."
 nd_bah_taraf_office: "Bureau de Taraf"
 nd_bah_taraf_office_desc: "Un centre administratif provincial mettant en œuvre les réformes de Mahmud Gawan, où des fonctionnaires nommés gèrent la collecte des impôts, les prélèvements militaires et la correspondance avec le tribunal central."
 nd_bah_madrasa: "Médersa"
 nd_bah_madrasa_desc: "Un centre d'apprentissage islamique sur le modèle de la magnifique madrasa de Mahmud Gawan à Bidar. Les étudiants étudient la théologie, le droit, les mathématiques et l’astronomie auprès d’érudits du monde islamique."
 nd_bah_bidri_workshop: "Atelier Bidri"
 nd_bah_bidri_workshop_desc: "Un atelier spécialisé dans le travail des métaux où les artisans pratiquent la technique Bidriware, coulant des récipients en alliage zinc-cuivre, gravant des motifs complexes et les incrustant d'argent pur avant de noircir la surface."
 nd_bah_bandargah: "Bandargah"
 nd_bah_bandargah_desc: "Un port de commerce côtier dans la tradition bahmanie, facilitant le commerce maritime avec la Perse, l'Arabie et l'Afrique de l'Est. Des entrepôts, des bureaux de douane et des quartiers commerçants bordent le front de mer."
 nd_bah_bastion: "Bastion Polygone"
 nd_bah_bastion_desc: "Une fortification angulaire conçue pour l'âge de la poudre à canon, avec des bastions qui fournissent des champs de tir de canon qui se chevauchent. Ces innovations Deccani ont précédé des développements européens similaires."
 nd_bah_revenue_office: "Bureau des recettes"
 nd_bah_revenue_office_desc: "Un centre provincial de collecte des recettes où les fonctionnaires évaluent les impôts, tiennent des registres fonciers et remettent les recettes au trésor central selon le système taraf."
 nd_bah_baoli: "Baoli"
 nd_bah_baoli_desc: "Un puits à gradins conçu pour accéder à la nappe phréatique profonde du Deccan. Ces structures monumentales servent de sources d’eau publiques, de retraites fraîches et de lieux de rassemblement."
 # ===== PRODUCTION METHODS =====
 nd_bah_sarai: "Sarai"
 nd_bah_sarai_desc: "A walled court on the road with a well, a mosque and stabling, a day's march from the next. Merchants and their pack trains lodge here on the way between the ports and the capital."
 nd_bah_sarai_upkeep: "Sarai Upkeep"
 nd_bah_sarai_upkeep_desc: "Fodder and pack animals, timber for the gates and stalls, and cloth for the lodgings."
 nd_bah_himroo_looms: "Himroo Looms"
 nd_bah_himroo_looms_desc: "Looms where a cotton warp is woven under a silk weft into himroo, a cloth made to look like Persian brocade at a fraction of its price."
 nd_bah_textile_pm: "Himroo Weaving"
 nd_bah_textile_pm_desc: "Cotton and silk are woven together into patterned himroo for robes, shawls and hangings."
 nd_bah_diamond_diggings: "Diamond Diggings"
 nd_bah_diamond_diggings_desc: "Shallow pits sunk into the river gravels of Golconda. The gravel is carried out in baskets, washed, dried and picked over by hand."
 nd_bah_diamond_pm: "Diamond Washing"
 nd_bah_diamond_pm_desc: "Gravel from the pits is washed and sieved, and the stones are picked out by hand."
 nd_bah_cotton_mill_pm: "Moulage du coton"
 nd_bah_cotton_mill_pm_desc: "Transformation mécanisée du coton brut en tissu fini à l'aide de techniques industrielles."
 # ===== BUILDING PMs (inline) =====
 nd_bah_qila_maintenance: "Garnison de la forteresse"
 nd_bah_qila_maintenance_desc: "Pierre et armes pour la garnison de la forteresse."
 nd_bah_darbar_upkeep: "Entretien du tribunal"
 nd_bah_darbar_upkeep_desc: "Silk, dyes and incense for the Persianate court."
 nd_bah_taraf_upkeep: "Frais administratifs"
 nd_bah_taraf_upkeep_desc: "Paper, cloth and sealing wax for the taraf officials managing provincial administration."
 nd_bah_madrasa_upkeep: "Matériel scientifique"
 nd_bah_madrasa_upkeep_desc: "Papier et livres pour les érudits de la madrasa et sa bibliothèque croissante de manuscrits."
 nd_bah_bidri_inputs: "Fabrication de bidriwares"
 nd_bah_bidri_inputs_desc: "Les artisans coulaient des récipients en alliage de cuivre et de zinc et les incrustaient d'argent selon des motifs arabesques complexes, produisant ainsi des pièces décoratives prisées."
 nd_bah_port_upkeep: "Entretien portuaire"
 nd_bah_port_upkeep_desc: "Bois d'œuvre et fournitures navales pour le port côtier."
 nd_bah_bastion_upkeep: "Garnison du Bastion"
 nd_bah_bastion_upkeep_desc: "Pierre et armement pour la forteresse bastion."
 nd_bah_revenue_upkeep: "Administration des recettes"
 nd_bah_revenue_upkeep_desc: "Paper and ink for records and cloth for the officials of the provincial revenue office."
 nd_bah_baoli_upkeep: "Entretien des puits"
 nd_bah_baoli_upkeep_desc: "Stone, tools and timber for maintaining the stepped well and its water channels."
 # ===== LEVIES =====
 levy_nd_bah_deccani_sowar: "Prélèvement Deccani Sowar"
 levy_nd_bah_deccani_sowar_desc: "Cavalerie montée levée auprès des domaines nobles et militaires, chevauchant des chevaux arabes importés."
 # ===== STATIC MODIFIERS (timed, from advance events) =====
 STATIC_MODIFIER_NAME_nd_bah_gawan_centralization: "La centralisation de Gawan"
 STATIC_MODIFIER_DESC_nd_bah_gawan_centralization: "Les réformes du grand vizir ont renforcé l'autorité centrale, réduisant l'autonomie provinciale et systématisant la collecte des recettes à travers les tarafs."
 STATIC_MODIFIER_NAME_nd_bah_gawan_tolerance: "La vision cosmopolite de Gawan"
 STATIC_MODIFIER_DESC_nd_bah_gawan_tolerance: "La politique de tolérance de Mahmud Gawan et son patronage d'érudits d'horizons divers ont enrichi la cour et élargi les horizons diplomatiques du sultanat."
 STATIC_MODIFIER_NAME_nd_bah_deccan_sword: "Épée du Deccan"
 STATIC_MODIFIER_DESC_nd_bah_deccan_sword: "La victoire sur le champ de bataille a renforcé la détermination du Sultanat. Nos armées sont aguerries, notre artillerie redoutée et nos engins de siège ont fait leurs preuves contre les forteresses les plus puissantes."
 STATIC_MODIFIER_NAME_nd_bah_deccan_fortifier: "Bouclier du Plateau"
 STATIC_MODIFIER_DESC_nd_bah_deccan_fortifier: "Les leçons de la guerre perpétuelle ont été appliquées à la défense. Nos forteresses sont hérissées de canons, nos garnisons sont disciplinées et nos positions frontières sont imprenables."
 STATIC_MODIFIER_NAME_nd_bah_afaqi_ascendancy: "Ascendance Afaqi"
 STATIC_MODIFIER_DESC_nd_bah_afaqi_ascendancy: "Les nobles nés à l’étranger ont prévalu, mettant leurs relations perses, leurs réseaux commerciaux et leur vision cosmopolite du monde au premier plan des affaires du Sultanat."
 STATIC_MODIFIER_NAME_nd_bah_deccani_roots: "Racines de Deccani"
 STATIC_MODIFIER_DESC_nd_bah_deccani_roots: "La noblesse d'origine locale a consolidé sa position, enracinant fermement le sultanat dans le sol du Deccan. Leurs liens profonds avec la terre assurent la stabilité et des prélèvements abondants."
 # ===== EVENTS =====
 nd_bah.1.t: "Les réformes de Mahmud Gawan"
 nd_bah.1.d: "Mahmud Gawan, the brilliant Persian-born vizier who has served the Sultanate for decades, has implemented sweeping administrative reforms. The kingdom's four provinces have been reorganized into eight tarafs, each under a centrally appointed tarafdar. Noble estates have been curtailed, revenues systematized, and the Sultanate's magnificent madrasa at Bidar stands as a monument to his vision.\n\nYet these reforms have deepened the fault line at the heart of the Bahmani state. The Afaqi nobles (Persians, Turks, and Arabs who followed Gawan to power) now hold sway at court. The Deccani nobles, born of this soil, seethe at their displacement. The Sultan must choose which faction's path to follow.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_bah.1.a: "Renforcer l'autorité centrale : les tarafs répondront devant le trône."
 nd_bah.1.a_tt: "Gawan's reforms turned inward. The cabinet works faster, the crown holds more of what the tarafs collect, and control spreads out from the throne."
 nd_bah.1.b: "Adoptez la vision cosmopolite de Gawan : laissez le monde venir à notre cour."
 nd_bah.1.b_tt: "The court opens. Heretics are tolerated, another culture can be carried in the realm, and our name travels further than our armies."
 nd_bah.2.t: "Les guerres contre Vijayanagara"
 nd_bah.2.d: "The struggle between the Sultanate and the great Hindu empire of Vijayanagara has defined a generation. The fertile Raichur Doab, the land between the Krishna and Tungabhadra rivers, is the perpetual prize, changing hands with the fortunes of war. Our topchi gunners have proven their worth against Vijayanagara's mighty cavalry, and the siege of Belgaum demonstrated that no fortress can long withstand the Bahmani's fire-workers.\n\nThe question now is how to consolidate our gains. Do we press the advantage with offensive power, or fortify the frontier against inevitable counterattack?"
 nd_bah.2.a: "Appuyez sur l'attaque : l'épée du Deccan ne se reposera pas."
 nd_bah.2.a_tt: "The field army. Better morale, heavier guns in the open, and siege craft proven against Vijayanagara's hill forts."
 nd_bah.2.b: "Fortifiez la frontière : aucun ennemi ne pénétrera dans nos bastions."
 nd_bah.2.b_tt: "The frontier line. Stronger defence, larger garrisons, and hostile armies bleeding in front of our walls."
 nd_bah.3.t: "La crise Afaqi-Deccani"
 nd_bah.3.d: "The tension that has simmered at the heart of the Sultanate for generations has reached a critical juncture. The Afaqis (foreign-born nobles from Persia, Turkey, and Arabia) control the court, the treasury, and the diplomatic service. They speak Persian, correspond with the courts of Isfahan and Constantinople, and maintain the commercial networks that bring horses, luxury goods, and recruits to the Sultanate.\n\nThe Deccanis (locally born Muslims, converts, and Habshi freedmen from Abyssinia) control the provinces, command the garrisons, and draw their strength from the land itself. They speak Dakhani, know the terrain, and command the loyalty of the common soldier.\n\nBoth factions have served the Sultanate, but both cannot rule it. The Sultan must decide which faction's vision will shape the Bahmani future."
 nd_bah.3.a: "Les Afaqis : leurs connexions persanes nous enrichissent tous."
 nd_bah.3.a_tt: "The foreign party wins. Merchant power, trade efficiency by land and sea, and a spy network built out of their Persian correspondence."
 nd_bah.3.b: "Les Deccanis : notre force réside dans le sol sur lequel nous nous trouvons."
 nd_bah.3.b_tt: "The local party wins. More manpower off the plateau, more food out of the black soil, and a throne that costs less to keep steady."
 nd_bah.4.t: "L'art du Bidri"
 nd_bah.4.d: "Under the patronage of the Sultanate, artisans in Bidar have perfected a metalworking technique of extraordinary beauty and skill. Vessels are cast from an alloy of zinc and copper, then engraved with intricate designs, arabesques, calligraphy, flowers, and geometric patterns. Pure silver wire is hammered into the grooves, and the surface is treated with a paste of soil and ammonium chloride unique to the soil of Bidar itself.\n\nThe result is striking: blackened metal adorned with gleaming silver, pieces that are both functional vessels and works of art. Already, Bidriware is prized by collectors and merchants from Persia to Southeast Asia. It is a craft that could only have been born here, on the Deccan, where Persian metalworking traditions met Indian artistry and Bidar's unique soil."
 nd_bah.4.a: "Un trésor du Deccan qui perdurera pendant des siècles."
 nd_bah.4.a_tt: "The craft is noted. No further effect."
 nd_bah.5.t: "Tonnerre sur le Deccan"
 nd_bah.5.d: "The fortress of Kalyana stands as proof of the Sultanate's military revolution. Gun ports have been built directly into its walls, the first such design anywhere on the Deccan Plateau. The sound of cannon fire, once alien to this land, now echoes across the plateau as our topchi gunners drill with their fearsome weapons.\n\nThe Bahmani Sultanate has become the first Indian state to systematically employ gunpowder artillery. Our fire-workers can breach any wall, our cannons can break any charge. The military balance of the Deccan has shifted forever. Where once the outcome of battle depended on the weight of cavalry, now it depends on the thunder of guns, and our guns speak loudest of all."
 nd_bah.5.a: "Que le tonnerre de nos armes proclame la suprématie bahmanie."
 nd_bah.5.a_tt: "The guns are noted. No further effect."
 nd_bah_formed_tt: "Le sultanat de Bahmani a été formé"
 nd_bah_path_a_tt: "Choisissez la centralisation de Gawan"
 nd_bah_path_b_tt: "Choisissez la vision cosmopolite de Gawan"
 # ===== BUREAUCRACIES =====
 bah_wakil_us_sultanat_bureaucracy: "Wakil-nous-Sultanat"
 bah_wakil_us_sultanat_bureaucracy_desc: "Le Wakil-us-Sultanat était le vice-gérant du sultan Bahmani, une grande fonction unique qui combinait la gestion de la maison, l'inspection des rôles de cavalerie et le commandement de l'armée centrale lorsque le sultan ne marchait pas en personne. Hasan Gangu l'a doté d'émigrés iraniens et irakiens plutôt que de restes de Tughluq ; Muhammad Shah I l'a utilisé pour mener les campagnes contre Vijayanagara et Telingana. La concentration des fonctions de guerre, de ménage et d'inspection dans un seul bureau a donné aux premiers Bahmanis leur cohésion - et a fait du bureau du Wakil le véritable prix de chaque combat de factions à Gulbarga."
 bah_madrasa_mahmud_gawan_bureaucracy: "Médersa Mahmud Gawan"
 bah_madrasa_mahmud_gawan_bureaucracy_desc: "Achevée à Bidar en 1472, la Madrasa Mahmud Gawan à trois étages était la plus grande dotation savante des sultanats indiens du XVe siècle. Son plan (une cour entourée de 100 cellules d'étudiants, deux minarets, une bibliothèque, une mosquée et des amphithéâtres) était calqué sur la madrasa Khargird du Khurasan; son corps professoral comprenait des érudits que Gawan avait recrutés personnellement à Samarkand, Shiraz et Herat. La bibliothèque, qui contiendrait trois mille manuscrits, était la plus grande du sud de l'Inde avant l'explosion de sa poudrière en 1696."
 bah_sufi_tariqa_patronage_bureaucracy: "Patronage soufi de la Tariqa"
 bah_sufi_tariqa_patronage_bureaucracy_desc: "Le maître Chishti Sayyid Muhammad al-Husayni Gesudaraz arriva à Gulbarga en 1397 à l'invitation de Firuz Shah Bahmani ; son dargah, construit autour de son lieu de mort en 1422, devint le centre de pèlerinage de l'établissement soufi du Deccan. Autour d'elle, les Bahmanis fréquentaient les sanctuaires Junaidi à Daulatabad, les Qadiri logeaient à Bidar après 1430 et l'ordre Shattari à Mandu. La dotation de waqfs à ces tariqas a ancré la légitimité du sultanat parmi les musulmans deccani ; Les sultans bahmanis ont été enterrés aux côtés de leurs cheikhs à Khuldabad et Gulbarga, et non dans les mausolées de la cour."
 bah_daulatabad_mint_bureaucracy: "Monnaie royale de Daulatabad"
 bah_daulatabad_mint_bureaucracy_desc: "Les tankas en or bahmani et les dirhams en argent étaient frappés principalement à Daulatabad, avec des monnaies subsidiaires à Gulbarga et (après 14 h 30) à Bidar. La production de monnaie a payé le commerce des chevaux arabes via Goa, Chaul et Dabhol (le pipeline indispensable pour la cavalerie que les Bahmanis ont déployée contre Vijayanagara et Khandesh) et a garanti les allocations de la cavalerie Pardesi qui liaient les nobles iraniens et irakiens au trône. Le tanka standardisé, dont le poids était contrôlé par rapport au dirham du califat, permettait à la monnaie bahmani d'être acceptée dans l'océan Indien."
 AUTO_MODIFIER_NAME_nd_bah_bureaucracy_authority: "Bureaucratie du sultanat de Bahmani"
 AUTO_MODIFIER_DESC_nd_bah_bureaucracy_authority: "The Bahmani Sultanate inherits the institutional repertoire of the Indo-Persian Deccan. The court has room for one more institution."
 # ===== FORMATION EVENT (nd_bah.10) =====
 nd_bah_e10_done_tt: "The sultanate has already been proclaimed once under this crown"
 nd_bah.10.t: "The Kingdom of the Deccan"
 nd_bah.10.d: "Two hundred years the plateau answered to Delhi, and answered late. The roads north climb the Vindhyas and then run a thousand miles through country the sultans had to reconquer every reign; Muhammad bin Tughluq moved his whole court to Daulatabad to hold it and then moved it back again, and the amirs he left behind learned what the distance was worth.\n\nNow the khutba is read in our name and the coin is struck in it. The green banner goes up over the double moat at Gulbarga, and the fifteen towers answer it. But a name is not a state, and the men who raised us are already asking what the raising was for. The amirs of the tarafs want the country they hold confirmed to them. The court wants Persians for the guns and the ledgers, and the sea at Dabhol is close enough to fetch them by the shipload.\n\nBoth are how a Deccan sultanate is built. Only one of them is how ours will be."
 nd_bah.10.a: "The tarafs are theirs"
 nd_bah.10.a_tt: "The amirs who made the sultan keep the countries they hold. Their levies and their Hindu chiefs' levies answer readily, and armies quarter on their own provinces. The court governs less for it. The realm decentralizes."
 nd_bah.10.b: "Send to Bidar for better men"
 nd_bah.10.b_tt: "Persians, Turks and Arabs come in by sea for the gunnery, the medicine and the ledgers, and the trade at Dabhol pays for them. The Deccani amirs watch the offices go to foreigners and remember it. The realm centralizes."
 STATIC_MODIFIER_NAME_nd_bah_taraf_amirs: "The Amirs of the Tarafs"
 STATIC_MODIFIER_DESC_nd_bah_taraf_amirs: "The sultanate is governed through the men who made it. Each taraf answers to its own amir, raises its own horse from its own villages, and feeds its own troops from its own harvest. Nothing reaches the throne that the provinces do not send."
 STATIC_MODIFIER_NAME_nd_bah_court_of_bidar: "The Court of Bidar"
 STATIC_MODIFIER_DESC_nd_bah_court_of_bidar: "The court buys what the plateau cannot raise. Gunners out of Anatolia, physicians and secretaries out of Iran, and the ships at Dabhol to bring them. The offices fill with men who were not born here, and the amirs who were are counting."
