l_french:
 STATIC_MODIFIER_NAME_nd_lords_of_the_calendar: "Seigneurs du calendrier"
 STATIC_MODIFIER_DESC_nd_lords_of_the_calendar: "Les Mayas sont les gardiens du temps lui-même. À travers des générations d’observations astronomiques et de précision mathématique, nos gardiens du jour ont cartographié les mouvements de Vénus, prédit les éclipses et intégré le calendrier sacré dans tous les aspects de la gouvernance et de la vie quotidienne. Cette maîtrise de la connaissance céleste guide notre peuple vers l’avant."
 STATIC_MODIFIER_NAME_nd_confederation_of_the_halach_uinic: "Confédération des Halach Uinic"
 STATIC_MODIFIER_DESC_nd_confederation_of_the_halach_uinic: "Les véritables seigneurs des terres mayas ont parlé d'une seule voix. Sous l’autorité du Halach Uinic, le Vrai Homme, les cités-États dispersées ont été liées ensemble en une confédération ayant un objectif commun. Nos guerriers Holcans sont prêts, nos chefs de guerre Nacom ont été choisis et les routes blanches portent la marche des armées unifiées."
 nd_may.1.t: "La réunification des Mayas"
 nd_may.1.d: "For generations, the Maya world has been a mosaic of rival city-states, the legacy of Mayapan's collapse, the wars between the K'iche' and Kaqchikel, the ambitions of a dozen petty lords. Now, through conquest and diplomacy, the scattered Maya polities have been drawn together under a single authority. The sacbe roads connect our cities, the observatories track the stars, and the codex-keepers record our laws. But what vision shall guide this reunited Maya realm? Shall we be remembered as the inheritors of our ancestors' celestial wisdom, a civilization whose calendar, writing, and astronomical knowledge made them the scholars of the Americas? Or shall we forge a military confederation in the tradition of the great Halach Uinic, binding our warriors into an army that can defend the Maya heartland against any who would challenge us?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_may.1.a: "Nous sommes les gardiens du temps et du savoir."
 nd_may.1.b: "Les Vrais Hommes gouverneront comme un seul homme."
 nd_may.2.t: "L'héritage du Popol Vuh"
 nd_may.2.d: "Le Popol Vuh, le Livre de la Communauté, a été conservé et enseigné à une nouvelle génération. Ce récit sacré des Mayas K'iche raconte la création du monde, les exploits des héros jumeaux Hunahpu et Xbalanque dans le monde souterrain de Xibalba et l'origine du peuple K'iche à partir du maïs blanc et jaune. Plus qu'une histoire, c'est le fondement de la cosmologie, de la moralité et de l'identité mayas. Les gardiens qui gardent cette sagesse se demandent maintenant comment elle devrait façonner notre nation. Le Popol Vuh servira-t-il de source de savoir, ses observations astronomiques, sa sagesse agricole et ses idées philosophiques faisant avancer nos érudits ? Ou doit-il servir de credo unificateur, son mythe de création et ses récits héroïques liant nos divers peuples en une seule identité ?"
 nd_may.2.a: "Que sa sagesse illumine nos érudits."
 nd_may.2.b: "Laissez ses histoires unir notre peuple."
 nd_may.3.t: "La refondation de la Ligue"
 nd_may.3.d: "La Ligue de Mayapan réunissait autrefois les grandes familles du Yucatan sous un conseil commun, les Cocom, les Xiu, les Chel et d'autres siégeant ensemble pour trancher les différends, coordonner le commerce et planifier la défense contre les étrangers. Lorsque Mayapan tomba à cause d'une trahison interne vers 1448, la Ligue se divisa en seize provinces rivales, et un siècle de guerre fratricide s'ensuivit. Maintenant que les cités mayas sont réunifiées, la question se pose : allons-nous restaurer l'autorité centralisée de la Ligue, avec une maison dirigeante unique dirigeant les affaires de toutes les provinces ? Ou devrions-nous adopter une fédération plus souple, où chaque province conserve son autonomie sous un conseil partagé d’égaux ?"
 nd_may.3.a: "Une maison dirigera toutes les autres."
 nd_may.3.b: "Le conseil des égaux perdurera."
 nd_may.4.t: "Les seigneurs du cacao"
 nd_may.4.d: "Le cacao est plus qu'une culture pour les Mayas : c'est une monnaie, une offrande rituelle, un cadeau diplomatique et la boisson des rois. Les grandes plantations de cacao de Tabasco et de la côte de Soconusco ont rendu leurs seigneurs fabuleusement riches, et les fèves de cacao circulent comme monnaie dans toute la Méso-Amérique. Les commerçants maritimes de la côte du Yucatan transportent le cacao sur leurs grandes pirogues depuis Xicalango jusqu'au Honduras et au-delà. Notre royaume réunifié doit maintenant décider comment exploiter cette richesse en cacao. Devrions-nous donner la priorité au commerce d’exportation, en envoyant notre cacao vers les marchés étrangers et en acheminant leurs marchandises vers nos côtes ? Ou devrions-nous formaliser les fèves de cacao comme monnaie officielle du royaume, stabilisant ainsi notre économie grâce à ce produit universellement apprécié ?"
 nd_may.4.a: "Laissez nos canots transporter le cacao vers le monde."
 nd_may.4.b: "Le cacao sera la monnaie du royaume."
 nd_may.5.t: "L'appel de l'Holcan"
 nd_may.5.d: "Les Holcan, la caste guerrière professionnelle des Mayas, font remonter leurs traditions à des siècles. Contrairement aux agriculteurs enrôlés qui combattent dans la plupart des armées, les Holcans sont des soldats à plein temps : formés dès leur jeunesse aux arts de la guerre, organisés sous le commandement de chefs de guerre Nacom élus et honorés d'un statut qui les place parmi l'élite de la société maya. Leur armure matelassée en coton, l'ichcahuipilli, s'est révélée efficace contre les lames d'obsidienne et les balles de mousquet européennes à courte portée. Leurs tactiques de guerre dans la jungle, les embuscades dans une forêt dense, les raids nocturnes coordonnés, l'utilisation dévastatrice du lance-lance atlatl, ont frustré les envahisseurs pendant des générations. Avec la formation de l’État maya, la tradition holcane a été officiellement consacrée comme l’épine dorsale de notre armée."
 nd_may.5.a: "Les Holcans défendront notre peuple."
 STATIC_MODIFIER_NAME_nd_may_popol_vuh_wisdom: "La sagesse des héros jumeaux"
 STATIC_MODIFIER_DESC_nd_may_popol_vuh_wisdom: "Les idées astronomiques et philosophiques du Popol Vuh guident nos chercheurs vers une compréhension plus profonde."
 STATIC_MODIFIER_NAME_nd_may_popol_vuh_unity: "Les enfants du maïs"
 STATIC_MODIFIER_DESC_nd_may_popol_vuh_unity: "L'histoire de la création des K'iche', selon laquelle l'humanité a été façonnée à partir de maïs blanc et jaune, lie nos divers peuples dans une identité commune."
 STATIC_MODIFIER_NAME_nd_may_league_centralize: "Autorité restaurée"
 STATIC_MODIFIER_DESC_nd_may_league_centralize: "L'autorité centralisée d'une maison dirigeante unique apporte l'ordre et la stabilité aux provinces mayas."
 STATIC_MODIFIER_NAME_nd_may_league_federate: "Conseil des égaux"
 STATIC_MODIFIER_DESC_nd_may_league_federate: "Une fédération de provinces autonomes, unies par un conseil commun, préserve la diversité et la loyauté des peuples mayas."
 STATIC_MODIFIER_NAME_nd_may_cacao_export: "Routes commerciales du cacao"
 STATIC_MODIFIER_DESC_nd_may_cacao_export: "Nos commerçants maritimes et terrestres transportent le cacao vers les marchés de la Méso-Amérique et au-delà."
 STATIC_MODIFIER_NAME_nd_may_cacao_currency: "La norme du haricot"
 STATIC_MODIFIER_DESC_nd_may_cacao_currency: "Les fèves de cacao servent de moyen d’échange universel, stabilisant le commerce dans tout notre royaume."
 nd_may_holcan_tradition: "Guerriers Holcans"
 nd_may_holcan_tradition_desc: "Les Holcans sont la caste de guerriers professionnels des Mayas, des soldats à plein temps formés dès leur jeunesse, armés d'armes en obsidienne et protégés par une armure de coton."
 nd_may_sacbe_trade_roads: "Routes commerciales de Sacbé"
 nd_may_sacbe_trade_roads_desc: "Les sacbe, des chaussées surélevées en calcaire, relient les villes mayas à travers la jungle, permettant aux caravanes commerciales de voyager même pendant la saison des pluies."
 nd_may_milpa_agriculture: "Milpa Agriculture"
 nd_may_milpa_agriculture_desc: "Le système milpa de cultures intercalaires de maïs, de haricots et de courges entretient des populations mayas denses dans les basses terres tropicales."
 nd_may_hieroglyphic_writing: "Écriture hiéroglyphique"
 nd_may_hieroglyphic_writing_desc: "L'écriture hiéroglyphique maya, le seul système d'écriture entièrement développé des Amériques précolombiennes, enregistre l'histoire, l'astronomie et la loi sur des monuments en pierre et des codex en papier d'écorce."
 nd_may_astronomical_tradition: "Tradition astronomique"
 nd_may_astronomical_tradition_desc: "Les astronomes mayas suivent les cycles de Vénus, prédisent les éclipses et calibrent le calendrier sacré avec une précision remarquable à partir d'observatoires de pierre dédiés."
 nd_may_halach_uinic_governance: "Gouvernance de Halach Uinic"
 nd_may_halach_uinic_governance_desc: "Le Halach Uinic, True Man, gouverne le système politique maya avec les conseils de la noblesse Ah Cuch Cab, équilibrant l'autorité des seigneurs de la cité-État."
 nd_may_ichcahuipilli_craft: "Artisanat Ichcahuipilli"
 nd_may_ichcahuipilli_craft_desc: "Les armuriers mayas produisent l'ichcahuipilli, un gilet pare-balles en coton matelassé imbibé de saumure, qui offre une protection efficace contre les armes en obsidienne et même les premières armes à feu."
 nd_may_obsidian_mastery: "Maîtrise de l'obsidienne"
 nd_may_obsidian_mastery_desc: "Les forgerons d'armes mayas maîtrisent la taille de l'obsidienne en lames tranchantes comme des rasoirs pour le macuahuitl, une épée dévastatrice incrustée de dents de verre volcanique."
 nd_may_mayapan_league: "Ligue Mayapan"
 nd_may_mayapan_league_desc: "La Ligue de Mayapan a unifié les grandes familles du Yucatan sous un conseil commun, assurant une gouvernance collective du commerce, de la défense et du droit."
 nd_may_maritime_canoes: "Canoës de guerre maritime"
 nd_may_maritime_canoes_desc: "Les grandes pirogues des Mayas, capables de transporter quarante hommes et de grandes quantités de marchandises commerciales, dominent les eaux côtières de Xicalango au Honduras."
 nd_may_popol_vuh: "Popol Vuh"
 nd_may_popol_vuh_desc: "Le Livre sacré de la Communauté préserve le récit de la création K'iche, les exploits des Héros Jumeaux et la généalogie des seigneurs Mayas."
 nd_may_cacao_economy: "Économie du cacao"
 nd_may_cacao_economy_desc: "Les fèves de cacao servent à la fois de monnaie, d’offrande rituelle et de produit de luxe, fondement de la vie commerciale maya."
 nd_may_pyramid_architecture: "Architecture pyramidale"
 nd_may_pyramid_architecture_desc: "Les grandes pyramides à gradins des Mayas servent de temples, d'observatoires astronomiques et de symboles de l'autorité divine alignés sur les événements célestes."
 nd_may_nacom_command: "Commande Nacom"
 nd_may_nacom_command_desc: "Les Nacom, chefs de guerre élus pour un mandat de trois ans, dirigent les campagnes militaires mayas et président les rites martiaux annuels au mois de Pax."
 nd_may_kiche_expansion: "Extension K'iche'"
 nd_may_kiche_expansion_desc: "L'État agressif K'iche' a conquis une grande partie des hauts plateaux du Guatemala grâce à des campagnes militaires rapides, créant un modèle de guerre impériale maya."
 nd_may_atlatl_warfare: "Guerre d'Atlatl"
 nd_may_atlatl_warfare_desc: "Le lance-lance atlatl permet aux tirailleurs mayas de lancer des fléchettes avec une force et une précision dévastatrices depuis leur dissimulation dans la jungle dense."
 nd_may_codex_tradition: "Tradition du Codex"
 nd_may_codex_tradition_desc: "Les scribes mayas enregistrent des tables astronomiques, des rituels religieux et des chroniques historiques sur des codex en papier d'écorce pliés comme des paravents en accordéon."
 nd_may_highland_diplomacy: "Diplomatie des Highlands"
 nd_may_highland_diplomacy_desc: "Le réseau complexe d'alliances, de mariages et de rivalités entre les royaumes mayas des hautes terres, K'iche', Kaqchikel, Tz'utujil, Mam, a affiné l'art de l'art politique maya."
 nd_may_coastal_trade_ports: "Ports de commerce côtiers"
 nd_may_coastal_trade_ports_desc: "Des ports comme Tulum, Xicalango et Naco servent d'entrepôts où convergent les routes commerciales maritimes et terrestres, acheminant l'obsidienne, le jade, le sel et le cacao."
 nd_may_fortified_acropolis: "Acropole fortifiée"
 nd_may_fortified_acropolis_desc: "Les villes mayas construisent des acropoles fortifiées, des citadelles surélevées avec des murs et des tours défensifs, pour protéger leurs familles dirigeantes et leurs complexes de temples."
 nd_may_holcan_veterans_tradition: "Tradition des vétérans d'Holcan"
 nd_may_holcan_veterans_tradition_desc: "Les guerriers Holcans les plus expérimentés forment un cadre d'élite, leurs connaissances du champ de bataille étant transmises grâce à un entraînement rigoureux au combat dans la jungle et à la défense de siège."
 nd_may_jungle_resistance: "Résistance de la jungle"
 nd_may_jungle_resistance_desc: "Les jungles denses du cœur des Mayas deviennent une arme contre les envahisseurs, les maladies, la chaleur et les embuscades consument les armées qui osent entrer sans invitation."
 nd_may_batab_administration: "Administration de Bataba"
 nd_may_batab_administration_desc: "Les Batab, gouverneurs locaux nommés par la Halach Uinic, administrent la justice, collectent les tributs et maintiennent l'ordre dans chaque province maya."
 nd_may_salt_trade_expansion: "Expansion du commerce du sel"
 nd_may_salt_trade_expansion_desc: "Les salines de la côte nord du Yucatan produisent une denrée essentielle à toute cuisine mésoaméricaine, faisant des commerçants de sel parmi les plus riches du monde maya."
 nd_may_defensive_confederacy: "Confédération défensive"
 nd_may_defensive_confederacy_desc: "Face aux menaces extérieures, les cités-États mayas formalisent des pactes de défense mutuelle, mettant en commun leurs levées sous commandement partagé lorsqu'un de leurs membres est attaqué."
 nd_may_calendar_keepers: "Gardiens de calendrier"
 nd_may_calendar_keepers_desc: "Les gardiens du jour maintiennent les calendriers sacrés Tzolk'in de 260 jours et Haab de 365 jours, en les synchronisant avec le cycle calendaire de 52 ans qui régit la vie rituelle et politique."
 nd_may_itza_independence: "Indépendance d'Itzá"
 nd_may_itza_independence_desc: "Les Itza Maya de Tayasal, sur le lac Peten Itza, ont maintenu leur indépendance jusqu'en 1697, devenant ainsi le dernier État maya invaincu, témoignage de la résilience de la civilisation maya."
 nd_may_lacustrine_warfare: "Guerre lacustre"
 nd_may_lacustrine_warfare_desc: "Les Mayas des lacs Petén maîtrisent la guerre sur l'eau, utilisant des flottes de canoës pour contrôler les rives des lacs et empêcher les envahisseurs d'utiliser les voies navigables."
 nd_may_tribute_system: "Système d'hommage"
 nd_may_tribute_system_desc: "Les communautés soumises livrent du cacao, du coton, du jade, des plumes et de la main d'œuvre à la ville au pouvoir, soutenant ainsi l'élite maya et finançant les travaux publics."
 nd_may_forest_fortifications: "Fortifications forestières"
 nd_may_forest_fortifications_desc: "Les palissades, les fossés et les ouvrages défensifs dissimulés se fondent dans le paysage forestier, créant des fortifications en couches qui exploitent le terrain de la jungle."
 nd_may_ch_orti_military: "Ch'orti' Militaire"
 nd_may_ch_orti_military_desc: "Les Ch'orti' Maya des hauts plateaux du sud-est maintiennent une tradition militaire féroce, leurs guerriers étant réputés pour leurs tactiques d'infanterie disciplinées et leur guerre en montagne."
 nd_may_syncretic_adaptation: "Adaptation syncrétique"
 nd_may_syncretic_adaptation_desc: "Les dirigeants mayas pragmatiques intègrent des idées et des pratiques étrangères dans leurs propres traditions, préservant ainsi leur identité fondamentale tout en s'adaptant à un monde en évolution."
 nd_may_cultural_endurance: "Endurance culturelle"
 nd_may_cultural_endurance_desc: "Malgré des siècles de pression extérieure, la langue maya, le calendrier, les traditions de tissage et la gouvernance communautaire perdurent comme une pratique vivante plutôt que comme un simple souvenir."
 nd_may_modern_confederation: "Confédération moderne"
 nd_may_modern_confederation_desc: "Le régime politique maya adopte des structures de gouvernance modernes tout en conservant le processus décisionnel basé sur le conseil qui a servi les Mayas pendant des millénaires."
 nd_may_agricultural_renewal: "Renouveau agricole"
 nd_may_agricultural_renewal_desc: "De nouvelles techniques agricoles complètent l'ancien système milpa, augmentant les rendements tout en préservant la sagesse des agriculteurs mayas en matière de cultures intercalaires."
 nd_may_maya_national_identity: "Identité nationale maya"
 nd_may_maya_national_identity_desc: "Un sentiment d’identité maya partagée transcende les vieilles rivalités entre cités-États, unissant diverses communautés linguistiques sous un héritage civilisationnel commun."
 nd_may_reforged_army: "Armée reforgée"
 nd_may_reforged_army_desc: "L'armée maya adopte des tactiques et des méthodes d'entraînement modernes tout en préservant les traditions de guerre dans la jungle qui définissent le combat maya depuis des siècles."
 nd_may_trade_revival: "Reprise du commerce"
 nd_may_trade_revival_desc: "Les anciens réseaux commerciaux des Mayas, qui transportaient autrefois de l'obsidienne, du jade et du cacao le long des routes sacbe et des routes côtières de canotage, sont restaurés et étendus."
 a_nd_may_holcan_warriors: "Guerriers Holcans"
 a_nd_may_holcan_warriors_desc: "Guerriers mayas professionnels armés de lances à pointe d'obsidienne et protégés par une armure en coton durci au sel. Maîtres des embuscades dans la jungle et des combats rapprochés."
 a_nd_may_obsidian_macemen: "Macémen d'obsidienne"
 a_nd_may_obsidian_macemen_desc: "Infanterie de choc brandissant le macuahuitl, une redoutable épée en bois constellée de lames d'obsidienne capable de décapiter un cheval. Ils frappent fort mais portent une armure légère."
 a_nd_may_kiche_eagles: "Aigles K'iche'"
 a_nd_may_kiche_eagles_desc: "Guerriers d'élite de la tradition militaire K'iche', connus pour leurs mouvements de flanc rapides sur des terrains difficiles et leurs raids éclair sur les positions ennemies."
 n_nd_may_war_canoe: "Canoë de guerre maya"
 n_nd_may_war_canoe_desc: "Grandes pirogues capables de transporter quarante guerriers et leurs provisions. Rapides et maniables dans les eaux côtières, ils dominent les routes commerciales de la côte caraïbe."
 a_nd_may_holcan_veterans: "Anciens combattants d'Holcan"
 a_nd_may_holcan_veterans_desc: "Guerriers holcans chevronnés qui ont survécu à plusieurs campagnes. Leur expérience de la guerre dans la jungle, de la défense de siège et des raids nocturnes coordonnés les rend redoutables."
 a_nd_may_atlatl_skirmishers: "Tirailleurs d'Atlatl"
 a_nd_may_atlatl_skirmishers_desc: "Des tirailleurs légers armés du lance-lance atlatl, capables de lancer des fléchettes avec une précision mortelle depuis leur dissimulation dans les sous-bois denses de la jungle."
 levy_nd_may_holcan_warriors: "Prélèvement des guerriers holcans"
 levy_nd_may_holcan_warriors_desc: "Guerriers Holcan professionnels issus des classes de soldats et de paysans, armés d'armes en obsidienne et d'armures en coton."
 levy_nd_may_atlatl_skirmishers: "Prélèvement des tirailleurs d'Atlatl"
 levy_nd_may_atlatl_skirmishers_desc: "Des tirailleurs légers issus de la paysannerie, entraînés à l'utilisation du lance-lance atlatl pour la guerre de harcèlement dans la jungle."
 levy_nd_may_holcan_veterans: "Prélèvement des vétérans d'Holcan"
 levy_nd_may_holcan_veterans_desc: "Des guerriers vétérans d'élite issus de la caste des soldats, leurs décennies d'expérience dans le combat dans la jungle en font de redoutables défenseurs."
 nd_may_sacbe_station: "Gare routière de Sacbe"
 nd_may_sacbe_station_desc: "Une étape le long des chaussées calcaires surélevées du sacbe qui relient les villes mayas, facilitant le commerce et la communication même pendant la saison des pluies."
 nd_may_observatory: "Observatoire Maya"
 nd_may_observatory_desc: "Une tour de pierre avec des fenêtres étroites alignées sur les positions extrêmes de Vénus à l'horizon, utilisée par les astronomes mayas pour calibrer le calendrier sacré."
 nd_may_cacao_house: "Maison de transformation du cacao"
 nd_may_cacao_house_desc: "Une installation où les fèves de cacao sont fermentées, séchées, torréfiées et moulues pour obtenir une pâte de chocolat amer prisée dans toute la Méso-Amérique comme boisson, monnaie et offrande rituelle."
 nd_may_temple_pyramid: "Temple-Pyramide"
 nd_may_temple_pyramid_desc: "Une pyramide à gradins massive couronnée par un temple sanctuaire, alignée sur des événements astronomiques et servant de cœur religieux et politique de la ville maya."
 nd_may_obsidian_workshop: "Atelier Obsidienne"
 nd_may_obsidian_workshop_desc: "Un atelier où des tailleurs qualifiés façonnent de l'obsidienne volcanique importée en lames tranchantes, en pointes de flèches et en dents de l'épée de guerre macuahuitl."
 nd_may_cenote_shrine: "Sanctuaire cénote"
 nd_may_cenote_shrine_desc: "Un sanctuaire sacré construit à côté d'un cénote, un gouffre naturel exposant la nappe phréatique, où des offrandes sont faites au dieu de la pluie Chaak et à ses ancêtres."
 nd_may_ballcourt: "Terrain de balle Maya"
 nd_may_ballcourt_desc: "Un terrain de pierre pour le jeu de balle sacré, où les équipes s'affrontent dans un concours rituel symbolisant la victoire des Héros Jumeaux sur les seigneurs de Xibalba. Les alliances et les conflits politiques se règlent par le sport sacré."
 nd_may_coastal_post: "Poste de traite côtier"
 nd_may_coastal_post_desc: "Une installation portuaire où de grands canoës sont chargés de cacao, de sel, d'obsidienne et de coton pour le commerce le long des côtes caribéennes et pacifiques de la Méso-Amérique."
 nd_may_defensive_wall: "Mur défensif maya"
 nd_may_defensive_wall_desc: "Murs de pierre et terrassements entourant l'acropole, renforcés par des tours et des portes pour protéger l'élite dirigeante et le complexe du temple du siège."
 nd_may_salt_works: "Salines"
 nd_may_salt_works_desc: "Étangs d'évaporation côtiers et installations de transformation qui extraient le sel de l'eau de mer, un produit essentiel à la conservation des aliments dans toute la Méso-Amérique."
 nd_may_milpa_terrace: "Terrasse Milpa"
 nd_may_milpa_terrace_desc: "Parcelles en terrasses à flanc de colline utilisant l'ancien système de cultures intercalaires milpa de maïs, de haricots et de courges, complété par des techniques d'irrigation modernes."
 nd_may_forest_palisade: "Palissade forestière"
 nd_may_forest_palisade_desc: "Un périmètre défensif dissimulé de pieux aiguisés et de fossés cachés dans la jungle, conçu pour canaliser et ralentir les armées d'invasion vers des zones de mise à mort préparées."
 nd_may_scribes_archive: "Archives des scribes"
 nd_may_scribes_archive_desc: "Une bibliothèque et une école où les scribes mayas sont formés à l'écriture hiéroglyphique et où sont conservés des codex en papier d'écorce enregistrant l'astronomie, l'histoire et les rituels."
 nd_may_sacbe_maintenance: "Entretien Sacbé"
 nd_may_sacbe_maintenance_desc: "L'entretien des chaussées calcaires surélevées nécessite un resurfaçage constant avec du sascab et du stuc pour empêcher l'empiétement de la jungle."
 nd_may_observatory_upkeep: "Entretien de l'Observatoire"
 nd_may_observatory_upkeep_desc: "L'observatoire nécessite un entretien en pierre, du papier d'écorce pour enregistrer les observations astronomiques et les calculs du calendrier, ainsi que du verre pour les instruments de visée de précision."
 nd_may_cacao_processing: "Transformation du cacao"
 nd_may_cacao_processing_desc: "Raw cacao pods are fermented, dried over slow fires, and ground into tradeable paste, stored and shipped in pottery vessels."
 nd_may_temple_offerings: "Offrandes au temple"
 nd_may_temple_offerings_desc: "Le temple-pyramide exige des offrandes régulières d'encens, de teintures et de récipients rituels pour maintenir la faveur des dieux."
 nd_may_obsidian_knapping: "Taille d'obsidienne"
 nd_may_obsidian_knapping_desc: "Des tailleurs qualifiés transforment l'obsidienne volcanique en flocons sous pression en lames tranchantes comme des rasoirs et en dents de macuahuitl, produisant ainsi des armes redoutables."
 nd_may_cenote_offerings: "Offres de cénotes"
 nd_may_cenote_offerings_desc: "Des offrandes rituelles de vases en poterie et d'encens sont jetées dans le cénote sacré pour apaiser le dieu de la pluie Chaak et garantir des récoltes abondantes."
 nd_may_ballcourt_upkeep: "Entretien du terrain de balle"
 nd_may_ballcourt_upkeep_desc: "Le terrain de balle en pierre nécessite un resurfaçage régulier et du bois pour les marqueurs sculptés, l'équipement de balle en caoutchouc et les accessoires rituels du jeu sacré."
 nd_may_canoe_harbor: "Port de canoë"
 nd_may_canoe_harbor_desc: "Les grandes pirogues nécessitent du bois pour la construction et la réparation, des outils pour les herminettes et les ciseaux qui façonnent les coques, et du goudron pour imperméabiliser les coques qui soutiennent la flotte qui relie les communautés mayas côtières."
 nd_may_wall_maintenance: "Entretien des murs"
 nd_may_wall_maintenance_desc: "Les murs défensifs nécessitent des réparations constantes avec de la pierre et du bois, et la garnison doit être équipée d'armes pour résister aux travaux de siège ennemis."
 nd_may_salt_processing: "Traitement du sel"
 nd_may_salt_processing_desc: "L'eau de mer est canalisée dans des bassins d'évaporation et bouillie sur des feux de bois pour produire du sel destiné au commerce dans toute la Méso-Amérique."
 nd_may_milpa_upkeep: "Entretien de Milpa"
 nd_may_milpa_upkeep_desc: "Les parcelles de milpa en terrasses produisent du maïs, des haricots et des courges grâce à l'ancien système de cultures intercalaires, complété par l'irrigation."
 nd_may_palisade_upkeep: "Entretien de la palissade"
 nd_may_palisade_upkeep_desc: "La palissade en bois nécessite le remplacement régulier des pieux pourris, des outils pour le périmètre défensif et du cuir pour l'armure et l'équipement de sa garnison de la jungle."
 nd_may_codex_production: "Production du Codex"
 nd_may_codex_production_desc: "La production de codex en papier d'écorce nécessite de l'écorce d'amate transformée en papier et en colorants minéraux pour les illustrations hiéroglyphiques."
 nd_may_formed_tt: "Maya a été formée"
 nd_may_path_a_tt: "Choisissez les seigneurs du calendrier"
 nd_may_path_b_tt: "A choisi la Confédération de la Halach Uinic"
 nd_may_destiny: "Destin des Mayas"
 nd_may_destiny_desc: "Les Mayas ont été réunis sous une seule bannière. La question est maintenant de savoir quelle direction prendra cette civilisation renaissante : poursuivra-t-elle la voie de la connaissance céleste ou de la confédération militaire ?"
 nd_may_dest_calendar_wisdom: "Sagesse du calendrier"
 nd_may_dest_calendar_wisdom_desc: "Saisissez les centres astronomiques de la Mésoamérique. En contrôlant le grand temple de Cholula et les pyramides de Teotihuacan, les gardiens du calendrier maya absorberont les connaissances de toutes les civilisations."
 nd_may_dest_venus_tables: "Tableaux Vénus"
 nd_may_dest_venus_tables_desc: "Maya astronomers have refined the Venus Tables to unprecedented accuracy, predicting the movements of the morning star centuries in advance. Chichen Itza, where the round tower of the Caracol is sighted on the extremes of Venus, is built up as the city of the observers. This knowledge drives agricultural planning, trade cycles, and statecraft."
 nd_may_dest_new_baktun: "Le nouveau Bak'tun"
 nd_may_dest_new_baktun_desc: "A new great cycle of the Long Count has dawned. Mutal and Lakamha, the cities raised when the last cycle turned, are built up again, and the Maya stand at the threshold of a civilizational renaissance, absorbing the knowledge of every people they have encountered and forging it into something greater."
 nd_may_dest_chichen_itza_developed_tt: "We own #bold Chichen Itza#! and its development is at least #bold 11#!"
 nd_may_dest_mutal_developed_tt: "We own #bold Mutal#! and its development is at least #bold 3#!"
 nd_may_dest_lakamha_developed_tt: "We own #bold Lakamha#! and its development is at least #bold 13#!"
 nd_may_dest_holcan_march: "La marche Holcan"
 nd_may_dest_holcan_march_desc: "The reach of the Halach Uinic's armies is extended into Honduras and El Salvador. Road stations are raised along the sacbe so that the Holcan can march, and the southern trade routes are brought under Maya military control."
 nd_may_dest_sacbe_stations_4_tt: "A #bold Sacbe Road Station#! stands in at least #bold 4#! of our locations"
 nd_may_dest_jade_throne: "Le trône de Jade"
 nd_may_dest_jade_throne_desc: "The Holcan are marched into the Valley of Mexico. Azcapotzalco, the seat of the Tepanecs, and Tenochtitlan itself are taken, and the greatest cities on the lake are claimed by the Maya as their own."
 nd_may_dest_fourth_creation: "La Quatrième Création"
 nd_may_dest_fourth_creation_desc: "The Popol Vuh speaks of three failed creations before the gods fashioned humanity from corn. Now a Fourth Creation is forged: an empire spanning from Cuba to the Tarascan highlands, held from walled cities."
 nd_may_dest_walls_4_tt: "A #bold Maya Defensive Wall#! stands in at least #bold 4#! of our locations"
 nd_may.6.t: "Le destin des Mayas réunis"
 nd_may.6.d: "For the first time in centuries, the Maya world speaks with one voice. The fractured city-states, the warring provinces of Yucatan, the highland kingdoms of Guatemala, all have been drawn together under a single authority. The sacbe roads carry traders and ambassadors between cities that once faced each other across barricades. The question now is not whether the Maya can endure, but what they will become."
 nd_may.6.a: "Une nouvelle ère s'ouvre pour les Mayas."
 nd_may.7.t: "Les bibliothèques des conquis"
 nd_may.7.d: "Nos gardiens de calendrier sont entrés dans les grands temples de la vallée de Mexico : l'imposante pyramide de Cholula, les anciens observatoires de Teotihuacan. Là où d'autres conquérants auraient brûlé ces lieux, nos érudits ont catalogué avec respect leurs archives astronomiques, leurs systèmes mathématiques, leurs histoires. La tradition maya du savoir a toujours été syncrétique, absorbant et affinant l’apprentissage des autres. Désormais, la sagesse accumulée de toute la Méso-Amérique afflue dans nos écoles de scribes."
 nd_may.7.a: "Leurs connaissances enrichissent les nôtres."
 nd_may.8.t: "Le raffinement des tables Vénus"
 nd_may.8.d: "Nos astronomes ont réalisé quelque chose de remarquable. En croisant les archives anciennes de Teotihuacan avec nos propres siècles d'observations de Vénus, ils ont affiné les tables du Codex de Dresde pour prédire le lever et le coucher de l'étoile du matin avec une marge d'erreur de moins de deux heures sur cinq siècles. Il ne s’agit pas simplement d’une réussite académique : le cycle de Vénus régit notre calendrier agricole, nos calendriers commerciaux et le calendrier des guerres et des paix. Devrions-nous orienter ces connaissances vers le progrès scientifique et les infrastructures, ou vers l’expansion de nos réseaux commerciaux ?"
 nd_may.8.a: "Laissons nos érudits bâtir sur cette fondation."
 nd_may.8.b: "Laissez nos commerçants profiter de ces connaissances."
 nd_may.9.t: "L'aube du nouveau B'ak'tun"
 nd_may.9.d: "Les gardiens du jour l'ont annoncé : le calendrier du Compte Long s'est transformé en un nouveau B'ak'tun : un grand cycle d'environ 394 ans. La dernière fois que cela s'est produit, la civilisation maya classique était à son apogée, construisant Tikal et Palenque. Aujourd’hui, les Mayas redeviennent une grande puissance, leurs connaissances englobant la sagesse de toutes les civilisations mésoaméricaines. Les prêtres débattent du sens de ce nouveau cycle. Certains y voient une période d’harmonie, où les divers peuples de notre royaume ne feront plus qu’un. D’autres y voient une période de renouveau, où nous devons reconstruire et étendre les fondations physiques de notre civilisation."
 nd_may.9.a: "C’est l’ère de l’harmonie entre les peuples."
 nd_may.9.b: "C’est l’ère de la construction et du renouveau."
 nd_may.10.t: "La marche du Holcan"
 nd_may.10.d: "Les guerriers holcans ont porté la bannière de la Halach Uinic au-delà du cœur traditionnel maya. Le Honduras et le Salvador (des terres où les commerçants mayas voyageaient autrefois avec la tolérance des dirigeants locaux) répondent désormais à la confédération. La grande plaque tournante du commerce de Naco, où le cacao, l'obsidienne et le jade ont changé de mains entre les marchands Maya, Lenca et Pipil, est désormais fermement sous notre contrôle. Les approches méridionales du monde maya sont sécurisées."
 nd_may.10.a: "Les Holcan ont prouvé leur valeur."
 nd_may.11.t: "La chute de Tenochtitlan aux mains des Mayas"
 nd_may.11.d: "L'impensable a été réalisé. Les Holcans ont marché dans la vallée de Mexico et pris Tenochtitlan : la plus grande ville des Amériques, construite sur une île au bord d'un lac, reliée par des chaussées au continent, abritant des marchés qui éblouissent l'imagination. Le trône de jade de la Halach Uinic commande désormais l'hommage de l'ancien cœur du monde aztèque. Comment allons-nous gouverner ce vaste nouveau domaine ? Nous pouvons exiger un tribut systématique des peuples conquis, en extrayant des richesses par l’administration plutôt que par la terreur. Ou nous pouvons gouverner par la peur, en veillant à ce qu’aucun sujet n’ose envisager la rébellion."
 nd_may.11.a: "Extrayez l’hommage via l’administration."
 nd_may.11.b: "Régnez à travers la peur des Holcans."
 nd_may.12.t: "La Quatrième Création"
 nd_may.12.d: "Le Popol Vuh raconte que les dieux ont tenté à trois reprises de créer l’humanité avant de réussir avec le maïs. Aujourd'hui, les Mayas ont accompli leur propre acte de création : un empire qui s'étend des îles des Caraïbes aux hauts plateaux tarasques, de la côte du Golfe aux pentes du Pacifique. Il s'agit de la Quatrième Création, un nouveau monde façonné par les mains mayas. La Halach Uinic est assise sur le trône de jade de Tenochtitlan et reçoit l'hommage d'une centaine de peuples. Cet empire sera-t-il maintenu grâce à une supériorité tactique et à des armes professionnelles, garantissant que nos forces puissent écraser toute rébellion ? Ou devrions-nous nous concentrer sur la machine politique de domination, en construisant les outils administratifs et diplomatiques nécessaires pour détenir ce que nous avons gagné ?"
 nd_may.12.a: "Nos guerriers maintiendront la paix."
 nd_may.12.b: "Nos administrateurs lieront l'empire."
 STATIC_MODIFIER_NAME_nd_may_dest_venus_scholars: "Les érudits de l'Étoile du Matin"
 STATIC_MODIFIER_DESC_nd_may_dest_venus_scholars: "Les astronomes mayas appliquent les prévisions du cycle de Vénus à la planification à long terme du commerce et de la collecte de renseignements, bien que l'orientation scientifique détourne les ressources de l'entretien militaire."
 STATIC_MODIFIER_NAME_nd_may_dest_venus_merchants: "Marchands de l'Étoile du Matin"
 STATIC_MODIFIER_DESC_nd_may_dest_venus_merchants: "Les commerçants mayas synchronisent leurs voyages avec le cycle de Vénus, obtenant ainsi des crédits favorables et une construction de navires plus rapide pendant que leurs communautés se remettent rapidement des revers."
 STATIC_MODIFIER_NAME_nd_may_dest_baktun_harmony: "B'ak'tun de l'Harmonie"
 STATIC_MODIFIER_DESC_nd_may_dest_baktun_harmony: "Le nouveau grand cycle apporte préparation et unité au peuple maya, aiguisant son initiative et son recrutement sur le champ de bataille, même si l'esprit d'harmonie rend les guerres d'agression plus difficiles à justifier."
 STATIC_MODIFIER_NAME_nd_may_dest_baktun_renewal: "B'ak'tun du renouveau"
 STATIC_MODIFIER_DESC_nd_may_dest_baktun_renewal: "The new great cycle is given to rebuilding. Storehouses are filled for the armies and the cities make room for more people, though in the comfort of renewal the word of the throne carries less weight."
 STATIC_MODIFIER_NAME_nd_may_dest_jade_tribute: "Hommage au Trône de Jade"
 STATIC_MODIFIER_DESC_nd_may_dest_jade_tribute: "Les peuples conquis du centre du Mexique rendent systématiquement hommage au trône de Jade, maintenu par de fortes garnisons et une armée disciplinée qui se remet rapidement des revers."
 STATIC_MODIFIER_NAME_nd_may_dest_jade_terror: "Terreur des Holcans"
 STATIC_MODIFIER_DESC_nd_may_dest_jade_terror: "The fearsome reputation of the Holcan ensures obedience through devastating assaults, the taking of captives and levies hardened by their example, though peoples who obey out of fear bear the throne no love."
 STATIC_MODIFIER_NAME_nd_may_dest_fourth_sun: "Guerriers du Quatrième Soleil"
 STATIC_MODIFIER_DESC_nd_may_dest_fourth_sun: "The professional army of the Fourth Creation refills its ranks quickly and hires mercenaries cheaply, though the vast military establishment demands a larger government."
 STATIC_MODIFIER_NAME_nd_may_dest_fourth_dominion: "Domination de la Quatrième Création"
 STATIC_MODIFIER_DESC_nd_may_dest_fourth_dominion: "La flotte maya projette sa puissance à travers les Caraïbes tout en construisant une tradition navale, même si la diversité religieuse de l'empire rend les guerres saintes plus difficiles à mener."
 nd_may_astronomical_academy: "Académie astronomique"
 nd_may_astronomical_academy_desc: "Une grande institution où les astronomes, mathématiciens et calendriers mayas synthétisent les connaissances astronomiques de toutes les civilisations mésoaméricaines dans un système unifié de prédiction céleste."
 nd_may_academy_maintenance: "Entretien de l'Académie"
 nd_may_academy_maintenance_desc: "L'académie a besoin d'un approvisionnement constant en papier pour les archives, en livres de référence et en verre pour ses instruments d'observation de précision."
 nd_may_jaguar_war_lodge: "Pavillon de guerre Jaguar"
 nd_may_jaguar_war_lodge_desc: "Une académie militaire d'élite où les meilleurs guerriers Holcans sont formés à la guerre de siège, aux tactiques interarmes et au commandement d'armées multiethniques venues de tout l'empire."
 nd_may_lodge_maintenance: "Entretien du pavillon"
 nd_may_lodge_maintenance_desc: "La loge de guerre nécessite des armes pour l'entraînement, du cuir pour l'armure et de la pierre pour les fortifications d'entraînement où les guerriers perfectionnent leurs techniques de siège."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_may_bureaucracy_authority: "Autorité de la Halach Uinik"
 AUTO_MODIFIER_DESC_nd_may_bureaucracy_authority: "L’État maya réunifié confirme son fondement institutionnel : le bureau de la Halach Uinik, les sacerdoces des Ah Kin et les maisons du conseil des Cuchcabales. La couronne peut désormais établir des bureaucraties et ajuster leur entretien depuis le trône."

 may_halach_uinik_bureaucracy: "Halach Uinik"
 may_halach_uinik_bureaucracy_desc: "The Halach Uinik (the True Man) holds judicial, military, and ritual authority over the Cuchcabal of Batab town-headmen. Diego de Landa's Relacion (1566) records the Halach Uinik appointing Batabs to subordinate towns and adjudicating disputes between them. The office is hereditary in a noble lineage; the Cocom of Mayapan traced it to Hunac Ceel. Centralizing the Cuchcabal under one Halach Uinik concentrates loyalty at the cost of the towns' autonomy, and a weak Halach Uinik invites the Batab to feud."

 may_holpop_council_bureaucracy: "Conseil Holpop"
 may_holpop_council_bureaucracy_desc: "The Holpop ('head of the mat') convenes the popolna council-house where Batabs and elder advisors deliberate. The Holpop holds the woven mat of office, the popol, and the council balances the Halach Uinik's authority through customary right of consultation. K'iche' Q'umarkaj preserved the same institution as the council of the four hereditary lineages (the Kaweq, Nijaib', Sakik, and Tamub') whose deliberations the Popol Vuh records. A working Holpop produces durable legislation; its decay produces faction."

 may_ah_kin_priesthood_bureaucracy: "Prêtrise Ah Kin"
 may_ah_kin_priesthood_bureaucracy_desc: "Les Ah Kin (« celui du soleil ») forment le sacerdoce hiérarchique des régimes politiques mayas. Sous les Ah Kin Mai de Mayapan, le sacerdoce englobe les devins oraculaires Chilam (dont les prophéties remplissent les livres Chilam Balam de Chumayel et Tizimin), les sacrificateurs Nakom, les prêtres de la pluie Chac et les prêtres forestiers Ah K'in K'ax des bosquets sauvages. Ils tiennent le décompte des 260 jours de Tzolkin et des 365 jours de Haab, sélectionnent les dates de plantation et président les cérémonies du Nouveau Feu de chaque cycle du calendrier."

 may_kaxan_codex_bureaucracy: "Réseau du Codex Kaxan'al"
 may_kaxan_codex_bureaucracy_desc: "Les Ah Tz'ib (« celui qui écrit ») sont la classe des scribes lettrés, travaillant avec des codex sérigraphiés en papier d'écorce. Quatre codex d'avant la Conquête survivent (Dresde, Madrid, Paris et le Codex Maya du Mexique, anciennement le Grolier) ; Diego de Landa brûla le reste à l'autodafé de Mani en 1562. Les codex enregistrent des tables astronomiques, des almanachs divinatoires, des horaires rituels et des histoires dynastiques. Le réseau des scribes est lié au sacerdoce Ah Kin mais distinct : une profession d'archiviste mathématique avec ses propres ateliers de lignée, fournissant au trône des administrateurs instruits."

 may_mayapan_league_bureaucracy: "Ligue de Mayapan"
 may_mayapan_league_bureaucracy_desc: "Entre 1200 et 1441 environ, la ville de Mayapan abritait le conseil conjoint des Cuchcabales - les Cocom (la lignée dirigeante), les Tutul-Xiu chassés d'Uxmal, les Itza chassés de Chichen, les Cupul, les Chel, les Pech, les Ah Canul et les Tutul-Xiu de Mani. La Halach Uinik de chaque maison devait résider à Mayapan, dans un système que les observateurs espagnols comparaient à une ligue d'otages. La révolte Xiu de 1441 mit fin à la ligue ; sa relance lie à nouveau les maisons nobles à la capitale, mais le gouvernement doit procéder par consensus entre pairs."

 may_itza_tribute_bureaucracy: "Flottille hommage à Itza"
 may_itza_tribute_bureaucracy_desc: "L'Itza de Tayasal à Noj Petn sur le lac Petn Itz gouvernait un réseau de tributs lacustres et fluviaux qui a survécu à tous les autres régimes politiques mayas, tombant seulement en 1697 aux mains de Martin de Ursua. La flottille de pirogues commerciales sillonnait le système Pasion-Usumacinta et les lacs centraux du Peten, collectant du cacao, du sel, du jade, de l'obsidienne et des plumes dans les villes subordonnées. Le Kowoj des lacs de l'Est exploitait un système parallèle. La flottille a un double objectif : les mêmes canoës qui rassemblent les tributs en paix rassemblent les guerriers dans le besoin."
