# ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_drr_bureaucracy_authority: "Appareil impérial Sadozai"
 AUTO_MODIFIER_DESC_nd_drr_bureaucracy_authority: "On formation at the Kandahar loya jirga, the Durrani Empire inherits the layered institutional traditions of its frontier: the Pashtun tribal council, the Persianate wazir's chancery, the Hindki banking houses of the Indus, and the Naqshbandi-Mujaddidi clerical hierarchy. Two bureaucracy slots are granted, enough for two of the four Durrani institutions."

 drr_loya_jirga_bureaucracy: "Loya Jirga"
 drr_loya_jirga_bureaucracy_desc: "The grand assembly of Pashtun chieftains. In October 1747, after the assassination of Nader Shah, nine days of debate at the shrine of Sher-i Surkh in Kandahar elected Ahmad Shah Abdali (later Durrani) as padshah-i durr-i-durran (pearl of pearls). Every Sadozai succession after his death was confirmed at a similar jirga, and the Abdali, Ghilji, Tajik and Hazara khans expected to be heard. The institution constrained the Shah but bound every tribe by oath to the imperial standard; manpower flowed from valleys whose chiefs could not be coerced but could be honoured."

 drr_diwan_ala_bureaucracy: "Diwan-i-A'la"
 drr_diwan_ala_bureaucracy_desc: "La chancellerie suprême du wazir, sur le modèle des hauts diwans safavides et moghols. Shah Wali Khan Bamizai, wazir d'Ahmad Shah à partir de 1761, dirigeait les finances impériales, rédigeait des firmans et supervisait les sous-adars provinciaux du Cachemire, du Pendjab, du Sind et du Khorasan. Le persan était sa langue, l'indo-persan munshis ses employés. Le diwan était un contrepoids aux sardars pachtounes dont la loyauté était avant tout tribale; lorsque la chancellerie fonctionnait, les revenus coulaient et les firmans étaient obéis. Lorsqu’il échoua (comme ce fut le cas lors des crises de succession d’après 1772 sous les fils de Timur Shah) l’empire se fragmenta selon les lignes que le diwan avait été construit pour supprimer."

 drr_hindki_sarrafs_bureaucracy: "Hindki Sarrafs"
 drr_hindki_sarrafs_bureaucracy_desc: "Les banques Multani, Shikarpuri et Khatri qui exploitaient des réseaux de crédit hundi d'Astrakhan à Hyderabad. Les sarrafs et arhatiyas hindous et sikhs détenaient les contrats de revenus impériaux du Pendjab, du Sind et des cols trans-Indus ; leurs hundis ont financé les huit invasions de l'Hindoustan par Ahmad Shah, y compris l'armée de campagne qui a gagné à Panipat en 1761. Les oulémas à l'esprit malékite étaient mécontents de la profondeur de la participation des dhimmi aux finances impériales et ont parfois fait pression pour l'application de la jizya. L'empire les ignora : les artilleurs zamburak et les chevaux qizilbash ne pouvaient pas être payés en fatwas."

 drr_naqshbandi_mashaikh_bureaucracy: "Naqshbandi-Mujaddidi Mashaikh"
 drr_naqshbandi_mashaikh_bureaucracy_desc: "The Sufi tariqa founded by Imam Rabbani Sirhindi (d. 1624) and continued by Shah Waliullah of Delhi (d. 1762). Naqshbandi pirs of the Mujaddidi line crossed the Pashtun belt, blessing Ahmad Shah's invasions of Hindustan as defence of the umma against the Marathas and Sikhs and binding the rural tribes to the throne through their khanaqahs at Peshawar, Kabul, and Kandahar. The mashaikh gave the Sadozai a religious legitimacy independent of Mughal Delhi, but a clergy that could anathemise a wayward shah as easily as it had crowned him."
