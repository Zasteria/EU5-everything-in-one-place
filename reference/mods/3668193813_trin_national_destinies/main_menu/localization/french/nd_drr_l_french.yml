l_french:

# ===== STATIC MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_drr_loya_jirga: "Loya Jirga de Kandahar"
 STATIC_MODIFIER_DESC_nd_drr_loya_jirga: "La grande assemblée des chefs pachtounes a lié les tribus par serment. La main-d'œuvre afflue de chaque vallée d'Abdali, Ghilji et tadjik, et l'étendard du nouveau Shah est honoré d'Herat jusqu'au Khyber."

 STATIC_MODIFIER_NAME_nd_drr_sword_of_khorasan: "Épée du Khorasan"
 STATIC_MODIFIER_DESC_nd_drr_sword_of_khorasan: "L'armée du Shah marche dans la tradition du Nadir, descendant des hauts plateaux afghans vers la Perse et l'Hindoustan. L'Empire se construit sabre par sabre, chaque campagne étant payée en pillage."

 STATIC_MODIFIER_NAME_nd_drr_panipat_press: "Après Panipat"
 STATIC_MODIFIER_DESC_nd_drr_panipat_press: "Les Marathes sont débordés sur le terrain de Panipat. Le Shah ordonne que la campagne se poursuive avant que les princes hindoustani puissent se rallier."

 STATIC_MODIFIER_NAME_nd_drr_panipat_consolidate: "Hommage de Panipat"
 STATIC_MODIFIER_DESC_nd_drr_panipat_consolidate: "L'armée revient à Kandahar avec le Koh-i-Noor et un an de pillage. L'Empire se tourne vers l'administration, intégrant les vaincus dans le royaume du Shah."

 STATIC_MODIFIER_NAME_nd_drr_pass_tribute: "Hommage à Rahdari"
 STATIC_MODIFIER_DESC_nd_drr_pass_tribute: "Chaque caravane empruntant le Khyber et le Bolan paie le péage en pièces. Le trésor royal s’accroît grâce au grand commerce entre la Perse, le Turan et l’Hindoustan."

 STATIC_MODIFIER_NAME_nd_drr_pass_free_passage: "Pass ouverts"
 STATIC_MODIFIER_DESC_nd_drr_pass_free_passage: "Les caravanes se déplacent librement sur les routes impériales, ne payant que des cotisations modestes. Les marchands boukhara et indiens affluent vers les marchés afghans, et les bazars de Kaboul et de Peshawar se multiplient."

 STATIC_MODIFIER_NAME_nd_drr_naqshbandi_unity: "Unité Naqshbandi"
 STATIC_MODIFIER_DESC_nd_drr_naqshbandi_unity: "Les cheikhs Mujaddidi prêchent une orthodoxie renouvelée à partir des khanaqahs de Kaboul et de Peshawar. La direction soufie lie les membres d’une tribu, les paysans et les citadins à une seule cause confessionnelle."

 STATIC_MODIFIER_NAME_nd_drr_naqshbandi_cosmopolitan: "Tariqa cosmopolite"
 STATIC_MODIFIER_DESC_nd_drr_naqshbandi_cosmopolitan: "Les ordres soufis enseignent une large tolérance, englobant les commerçants hindki, les voisins Qizilbash et les sujets sikhs. La mosquée, le temple et le gurdwara sont tous conservés sous la paix du Shah."

 STATIC_MODIFIER_NAME_nd_drr_sadozai_centralize: "Couronne Sadozaï"
 STATIC_MODIFIER_DESC_nd_drr_sadozai_centralize: "La succession se règle par la force des armes. La maison Sadozai centralise le royaume, brisant les sardars rebelles et affirmant l'ordre du Shah d'Herat à Lahore."

 STATIC_MODIFIER_NAME_nd_drr_sadozai_sardars: "Conseil des Sardars"
 STATIC_MODIFIER_DESC_nd_drr_sadozai_sardars: "La succession est réglée par consensus. Les chefs de tribus sont confirmés sur leurs terres et leurs prélèvements, et l'Empire perdure comme une fédération de seigneurs pachtounes fidèles à un premier parmi ses égaux."

# ===== FORMATION EVENT =====
 nd_drr.1.t: "La Loya Jirga à Kandahar"
 nd_drr.1.d: "October 1747. The shrine of Sher-e-Surkh outside Kandahar is crowded with the chieftains of every Pashtun tribe. The Abdali, the Ghilji, the Yusufzai, the Mohmand; the Qizilbash captains, the Tajik notables, the Hindki merchants. Nadir Shah is dead, his army scattered, and the treasury of Persia has come home to Afghanistan in the saddlebags of the Abdali horsemen who once served him.\n\nFor nine days the jirga has argued. Some would have a council of equals, others a Shah. The mystic Sabir Shah Kabuli has settled it: he places a sheaf of wheat in the turban of the young Abdali commander and proclaims him Padshah. The Abdali henceforth shall be called Durrani, the Pearl of Pearls.\n\nNow the choice falls to the new realm: shall it be the empire of the tribes, or the empire of the sword?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_drr.1.a: "Par consensus de la jirga, nous serons l’empire des tribus."
 nd_drr.1.b: "Selon les standards d’Ahmad Shah, nous vaincrons de Mashhad à Delhi."

# ===== ADVANCE EVENTS =====

 nd_drr.2.t: "La troisième bataille de Panipat"
 nd_drr.2.d: "14 janvier 1761. Dans la plaine poussiéreuse au nord de Delhi, la cavalerie postale du Shah, ses alliés Rohilla et deux mille canons à chameaux Shutarnal montés sur pivot font face à l'hôte de la Confédération Maratha. Au crépuscule, soixante mille ennemis sont morts. Sadashivrao Bhau est tué ; l'héritier des Peshwa est tué ; l'avancée des Maratha vers l'Indus est interrompue pendant une génération. Le Shah tient le terrain, mais ses soldats afghans, impayés depuis deux ans, se mutinent et aspirent à la fraîcheur de Kandahar."
 nd_drr.2.a: "Appuyez sur l'avantage ; faites savoir aux princes hindoustani qui dirige le nord."
 nd_drr.2.b: "Retournez à Kandahar avec le butin ; gouverner ce que nous avons déjà gagné."

 nd_drr.3.t: "Coutumes du Khyber"
 nd_drr.3.d: "Le grand commerce transasiatique passe par nos passes. Les caravanes de Boukhara amènent de beaux chevaux, des lapis et des esclaves ; Les caravanes indiennes apportent des épices, de la soie et de l'indigo ; Les marchands persans apportent des tapis et du safran. Les officiers rahdar stationnés aux portes de Khyber, de Bolan et de Kaboul signalent une augmentation du trafic. La question est de savoir dans quelle mesure il faut le taxer."
 nd_drr.3.a: "Taxez chaque chargement. Le trésor doit être rempli."
 nd_drr.3.b: "Gardez les cotisations légères. Le commerce lui-même enrichit l'empire."

 nd_drr.4.t: "Lumière des Moujaddidi"
 nd_drr.4.d: "La tariqa Naqshbandi-Mujaddidi, renouvelée par Shah Waliullah de Delhi et ses disciples afghans, s'est répandue dans les khanaqahs de Kaboul, Peshawar et Kandahar. Ses cheikhs prêchent une orthodoxie sunnite sobre et une discipline du cœur. Leurs écrits circulent de la Volga au Deccan. Comment l’empire les recevra-t-il ?"
 nd_drr.4.a: "Adoptez leur orthodoxie comme norme confessionnelle de l’empire."
 nd_drr.4.b: "Embrassez leur vaste humanisme ; de nombreuses confessions partagent le royaume."

 nd_drr.5.t: "Après le Shah"
 nd_drr.5.d: "Ahmad Shah est mort, et Timur Shah après lui. Les fils de la dynastie s'affrontent à Kaboul, Peshawar et Kandahar ; les sardars des Barakzai et des Popalzai déterminent quel prince soutenir. Les Sikhs s'agitent au Pendjab, les Perses se pressent à Mashhad et les frontières de l'Empire s'effilochent. Le choix est de gouverner par la couronne ou par le conseil."
 nd_drr.5.a: "Écrasez les sardars ; que le trône dicte aux tribus."
 nd_drr.5.b: "Gouverner à travers les sardars ; l'empire est leur fédération, pas celle du roi."

 nd_drr.6.t: "Les Pachtounwali"
 nd_drr.6.d: "Le code non écrit des Pachtounes est antérieur à l’Empire et survit à toutes les dynasties. Nanawatai, le droit de refuge ; melmastia, le devoir d'hospitalité ; badal, l'obligation de vengeance ; nang, la demande d'honneur. Aucun qazi n'applique ces lois, aucun Shah ne peut les abolir, mais chaque Pachtoune, du plus haut sardar au plus bas membre de la tribu, vit selon elles. La sagesse du Shah est de gouverner avec le code et non contre lui."
 nd_drr.6.a: "Il en sera de même parmi les Pachtounes."

 nd_drr.7.t: "Le Bala Hissar de Kaboul"
 nd_drr.7.d: "Sur son épaule rocheuse au-dessus de Kaboul, le Bala Hissar se dresse depuis l'époque des Shahis hindous. Babur l'a renforcé, les Moghols y ont mis une garnison et ses bastions sont maintenant reconstruits pour la cour de Durrani. Des citadelles sœurs s'élèvent au-dessus de Kandahar, Ghazni et Herat. De ces forteresses, le Shah commande les hauts cols ; un ennemi qui prend les basses terres n'a rien gagné si le Bala Hissar reste."
 nd_drr.7.a: "Les hautes citadelles constituent l’épine dorsale de l’empire."

# ===== ADVANCES =====
 nd_drr_pashtunwali: "Code pachtounwali"
 nd_drr_pashtunwali_desc: "Le code d'honneur non écrit des Pachtounes, liant chaque membre de la tribu aux nanawatai, melmastia, badal et nang. L’Empire gouverne avec le code, pas contre lui."

 nd_drr_bala_hissar: "Fortifications de Bala Hissar"
 nd_drr_bala_hissar_desc: "Les citadelles de montagne de Kaboul, Kandahar, Ghazni et Herat commandent les cols. Depuis ses bastions, le Shah tient le haut pays, même lorsque les basses terres sont perdues."

 nd_drr_mountain_raiders: "Pillards de montagne"
 nd_drr_mountain_raiders_desc: "Les membres de la tribu pachtoune connaissent tous les défilés de l'Hindu Kush. En tant qu'infanterie légère, ils harcèlent, tendent des embuscades et saignent tout envahisseur qui grimpe dans leurs collines."

 nd_drr_kandahari_horses: "Commerce de chevaux au Kandahari"
 nd_drr_kandahari_horses_desc: "Kandahar est le grand marché aux chevaux du carrefour, où les acheteurs turkmènes, persans et indiens se disputent les meilleurs stocks afghans."

 nd_drr_pass_tolls: "Douanes Rahdari"
 nd_drr_pass_tolls_desc: "Les officiers rahdar affichent des péages aux portes de Khyber, de Bolan et de Kaboul, taxant chaque caravane qui traverse l'Hindoustan, la Perse et le Touran."

 nd_drr_sufi_networks: "Réseaux de sanctuaires soufis"
 nd_drr_sufi_networks_desc: "Les ordres Naqshbandi et Qadiri lient tribu et couronne à travers les khanaqahs et dargahs qui parsèment les routes de l'empire."

 nd_drr_hindki_merchants: "Communautés marchandes hindki"
 nd_drr_hindki_merchants_desc: "Les familles commerçantes hindoues et sikhs de Kaboul, Peshawar et Multan sont placées sous la protection royale. Leurs réseaux s'étendent jusqu'à Boukhara, Lhassa et Bénarès."

 nd_drr_khorasan_revival: "La renaissance du Khorasan"
 nd_drr_khorasan_revival_desc: "La poésie persane, l'historiographie indo-persane et les lettres de la cour dari fleurissent dans le diwan Durrani. L'Empire est l'héritier du Khorasan ainsi que du Pashtunkhwa."

 nd_drr_jirga_councils: "Conseils de la Jirga"
 nd_drr_jirga_councils_desc: "Les assemblées tribales décident des questions locales par consensus. Le Shah gouverne par conseil et non par décret, et l’Empire tient la route parce que chaque chef se sent entendu."

 nd_drr_hotaki_revival: "La renaissance des Hotakis"
 nd_drr_hotaki_revival_desc: "Le souvenir de la révolte de Mirwais Hotak contre les Safavides renforce les armes afghanes. Les Pachtounes prirent autrefois Ispahan ; ils pourraient le faire à nouveau."

 nd_drr_sistan_qanats: "Qanats du Sistan"
 nd_drr_sistan_qanats_desc: "L'irrigation des Karez et des Qanat redonne vie au bassin du Helmand et aux déserts du Sistan. Les greniers de l'empire se remplissent là où, pendant des siècles, seuls les nomades paissaient."

 nd_drr_naqshbandi_tariqa: "Naqshbandi-Mujaddidi Tariqa"
 nd_drr_naqshbandi_tariqa_desc: "L’ordre soufi renouvelé du Sirhindi se répand dans tout l’empire. Ses cheikhs prêchent une orthodoxie sunnite disciplinée et lient les tribus à une seule cause confessionnelle."

 nd_drr_jezail_tradition: "Tradition du fusil Jezail"
 nd_drr_jezail_tradition_desc: "Les armuriers Khyber produisent des fusils à mèche à canon long, précis à des portées qu'aucun mousquet européen ne peut égaler. Les tireurs pachtounes dominent ce pays brisé."

 nd_drr_indo_persian_court: "Cour indo-persane"
 nd_drr_indo_persian_court_desc: "Le diwan Durrani associe l'administration persane aux formes judiciaires hindoustani. Les Munshis, les mirzas et les pandits servent tous le Shah."

 nd_drr_tribal_sardars: "Conseil des Sardars"
 nd_drr_tribal_sardars_desc: "Les chefs héréditaires des neuf grandes tribus Durrani forment le conseil permanent du Shah, lever des prélèvements et arbitrer entre les clans."

 nd_drr_abdali_heritage: "Patrimoine Abdali"
 nd_drr_abdali_heritage_desc: "La bénédiction de Sabir Shah a renommé Abdali le Durrani : la Perle des Perles. La dynastie porte le prestige de cette fondation."

 nd_drr_loya_jirga_advance: "Tradition de la Loya Jirga"
 nd_drr_loya_jirga_advance_desc: "La grande assemblée de toutes les tribus pachtounes constitue le fondement constitutionnel de l’Empire. Chaque nouveau Shah en est acclamé ; chaque grande guerre en est sanctionnée."

 nd_drr_ghulam_khana: "Ghulam Khana"
 nd_drr_ghulam_khana_desc: "La garde royale de la maison, composée d'anciens combattants pachtounes, tadjiks et qizilbash. Des lanciers envoyés par courrier fidèles uniquement au Shah."

 nd_drr_zamburak_corps: "Corps Zamburak"
 nd_drr_zamburak_corps_desc: "Canons pivotants montés sur chameaux, rapides à travers le désert et la steppe. A Panipat, deux mille zamburakis ont brisé la ligne Maratha."

 nd_drr_panipat_doctrine: "Doctrine Panipat"
 nd_drr_panipat_doctrine_desc: "La méthode de guerre Durrani : cavalerie lourde en maille sur les ailes, jezailchis en escarmouche, zamburaks en réserve mobile. Une doctrine forgée dans les grandes campagnes indiennes."

 nd_drr_kandahar_treasury: "Trésor de Kandahar"
 nd_drr_kandahar_treasury_desc: "La monnaie royale et le dépôt d'hommages de Kandahar reçoivent le butin de Delhi, les coutumes du Khyber et l'hommage du Sind."

 nd_drr_sadozai_succession: "Succession Sadozaï"
 nd_drr_sadozai_succession_desc: "La crise dynastique après Timur Shah, lorsque les princes Sadozai s'affrontent à Kaboul, Peshawar et Herat. La façon dont l’empire traverse cette crise façonne son siècle."

 nd_drr_frontier_defense: "Défense des frontières"
 nd_drr_frontier_defense_desc: "La longue retraite du Pendjab et du Sind apprend à l’empire à se battre sur la défensive. Chaque gorge de l’Hindu Kush devient une forteresse."

 nd_drr_modernization: "Modernisation de Durrani"
 nd_drr_modernization_desc: "Tentatives de réformes sous les shahs Sadozai et Barakzai : l'imprimerie à Kaboul, l'école d'artillerie, l'arpentage du royaume."

 nd_drr_lashkar_reform: "Réforme du Lashkar"
 nd_drr_lashkar_reform_desc: "Le prélèvement tribal est réorganisé pour la guerre moderne, avec des régiments permanents issus des vallées pachtounes et des armes standardisées."

# ===== UNITS =====
 a_nd_drr_pashtun_lashkar: "Lashkar pachtoune"
 a_nd_drr_pashtun_lashkar_desc: "Bande de guerre tribale levée par le biais de la loya jirga. Chaque homme apporte son propre jezail ou tulwar ; collectivement, ils constituent l'épine dorsale de l'armée de l'Empire et une terreur dans leurs montagnes natales."

 a_nd_drr_jezailchi: "Jezaïlchi"
 a_nd_drr_jezailchi_desc: "Long-barrel matchlock skirmisher from the Khyber gunsmith villages. Famous for picking off officers at ranges no European musket can reach, and for vanishing back into the rocks when charged."

 a_nd_drr_ghulam_khana: "Ghulam Khana"
 a_nd_drr_ghulam_khana_desc: "Cavalerie lourde de la maison royale. Des lanciers envoyés par courrier, issus d'anciens combattants pachtounes, tadjiks et qizilbash, ayant prêté serment personnellement au Shah."

 a_nd_drr_zamburak: "Zamburak"
 a_nd_drr_zamburak_desc: "Un pistolet pivotant monté sur un chameau agenouillé. Rapide à travers le désert et les sols pierreux, dévastateur à courte distance qui a brisé les Marathes à Panipat."

 a_nd_drr_zamburak_levy: "Prélèvement Zamburak"
 a_nd_drr_zamburak_levy_desc: "Canons pivotants tribaux élevés par les soldats et les membres des tribus de l'Empire. Moins cher que le corps zamburak régulier, mais se bat avec la même piqûre redoutable."

# ===== LEVIES =====
 levy_nd_drr_pashtun_lashkar: "Lashkar pachtoune"
 levy_nd_drr_pashtun_lashkar_desc: "Bande de guerre tribale mobilisée à l'appel de la loya jirga, composée de paysans, de membres de tribus et de soldats."

 levy_nd_drr_zamburak: "Prélèvement Zamburak"
 levy_nd_drr_zamburak_desc: "Artilleurs pivotants montés sur des chameaux, élevés par les soldats et les membres des tribus de l'Empire pour un service sur le terrain rapide et percutant."

# ===== BUILDINGS =====
 nd_drr_bala_hissar_fort: "Bala Hissar"
 nd_drr_bala_hissar_fort_desc: "Citadelle de montagne commandant une ville et ses cols. Le Bala Hissar de Kaboul, l’Arg de Kandahar et la Citadelle d’Herat suivent tous ce modèle."

 nd_drr_bala_hissar_upkeep: "Garnison de la Citadelle"
 nd_drr_bala_hissar_upkeep_desc: "Pierre, armes, bois et goudron pour maintenir les bastions et les sabords d'un Bala Hissar en état de combat."

 nd_drr_rahdari_post: "Poste de Rahdari"
 nd_drr_rahdari_post_desc: "Poste douanier sur les routes impériales des caravanes. Les officiers de Rahdar enregistrent les caravanes, prélèvent des péages et envoient des escortes à cheval."

 nd_drr_rahdari_upkeep: "Administration des péages"
 nd_drr_rahdari_upkeep_desc: "Chevaux pour les escortes rahdar, papier pour les registres, cuir et tissu pour les tentes et selles des cavaliers des douanes."

 nd_drr_jezail_workshop: "Atelier de Jezail"
 nd_drr_jezail_workshop_desc: "Maison d'armurier Khyber produisant la mèche à canon long. Les canons sont forgés en fer soudé et équipés de crosses délicatement incurvées."

 nd_drr_jezail_forging: "Forgeage à canon long"
 nd_drr_jezail_forging_desc: "Salpêtre, fer et outils combinés dans le célèbre fusil Khyber jezail, prisé dans toute l'Asie."

 nd_drr_jezail_maintenance: "Entretien d'atelier"
 nd_drr_jezail_maintenance_desc: "Du charbon, du fer, du bois et des outils pour faire fonctionner les forges et nourrir les maîtres armuriers."

 nd_drr_kandahar_treasury_bld: "Trésor Royal"
 nd_drr_kandahar_treasury_bld_desc: "La monnaie royale et le dépôt d'hommages à Kandahar. Construit pour abriter le Koh-i-Noor et le butin de Delhi, il est devenu l'épine dorsale financière de l'Empire."

 nd_drr_treasury_upkeep: "Administration du Trésor"
 nd_drr_treasury_upkeep_desc: "Du papier pour les registres, de l'argent et des pierres précieuses pour les essayeurs, des livres pour les comptables impériaux."

# ===== EVENT VARIABLE TOOLTIPS =====
 nd_drr_formed_tt: "L'Empire Durrani a été formé"
 nd_drr_path_a_tt: "Voie choisie pour la Loya Jirga"
 nd_drr_path_b_tt: "Voie de l'Épée du Khorasan choisie"
 nd_drr_dest_herat_developed_tt: "Owns #bold Herat#! and its development is at least #bold 34#!"
 nd_drr_dest_kandahar_developed_tt: "Owns #bold Kandahar#! and its development is at least #bold 19#!"
 nd_drr_dest_kabul_developed_tt: "Owns #bold Kabul#! and its development is at least #bold 40#!"

# ===== ADDITIONAL UNITS =====
 a_nd_drr_ghazi: "Ghazi"
 a_nd_drr_ghazi_desc: "Guerriers frontaliers pachtounes de la renaissance Hotaki, appelés au jihad contre les Safavides et les Marathes. Infanterie de choc lourde qui combat avec ferveur religieuse dans le pays brisé."

 a_nd_drr_kohistani: "Infanterie légère du Kohistan"
 a_nd_drr_kohistani_desc: "Infanterie de montagne modernisée de la fin de l'ère Sadozai et Barakzai. Foré à la manière européenne mais toujours à l’aise dans les gorges de l’Hindu Kush."

# ===== ADDITIONAL LEVY =====
 levy_nd_drr_ghazi: "Ghazi Lévy"
 levy_nd_drr_ghazi_desc: "Volontaires religieux élevés à travers les domaines des soldats et des tribus, mobilisés par la mémoire Hotaki et l'appel des cheikhs soufis."

# ===== ADDITIONAL BUILDINGS =====
 nd_drr_horse_market: "Marché aux chevaux de Kandahari"
 nd_drr_horse_market_desc: "La grande foire régionale du cheval où les acheteurs turkmènes, persans et indiens se disputent les meilleurs stocks afghans. Le Trésor prospère grâce à ses péages."

 nd_drr_horse_fair_upkeep: "Entretien de la foire aux chevaux"
 nd_drr_horse_fair_upkeep_desc: "Du bétail, des chevaux, du cuir et des céréales pour que la grande foire aux chevaux se déroule à chaque saison."

 nd_drr_khanaqah: "Khanaqah soufie"
 nd_drr_khanaqah_desc: "Naqshbandi ou Qadiri lodge combinant sanctuaire, séminaire et auberge pour les derviches itinérants. Les cheikhs lient les hommes des tribus et des citadins à la vie confessionnelle de l'Empire."

 nd_drr_khanaqah_upkeep: "Dotation Khanaqah"
 nd_drr_khanaqah_upkeep_desc: "Papier pour les manuscrits, livres pour le séminaire, encens et cire d'abeille pour les rituels du dargah."

 nd_drr_hindki_quarter: "Quartier Hindki"
 nd_drr_hindki_quarter_desc: "Enclave commerciale hindoue et sikh sous le firman royal. Leurs réseaux familiaux atteignent Boukhara, Lhassa et Banaras, canalisant le commerce via les bazars de l'Empire."

 nd_drr_hindki_upkeep: "Entretien du quartier Hindki"
 nd_drr_hindki_upkeep_desc: "Tissu, papier, poterie et encens pour la vie quotidienne et le commerce de la communauté hindki."

 nd_drr_kabul_press: "Presse lithographique de Kaboul"
 nd_drr_kabul_press_desc: "La première imprimerie afghane, établie sous le patronage de Barakzai à Kaboul. Les livres en dari et en pachtou diffusent l’alphabétisation et jettent les bases d’un public afghan moderne."

 nd_drr_press_upkeep: "Opérations de presse"
 nd_drr_press_upkeep_desc: "Du papier, des livres et des outils pour conserver les pierres lithographiques encrées et les coffrets à caractères stockés."

# ===== DESTINY ADVANCES =====
 nd_drr_destiny: "La longue route de l'Empire"
 nd_drr_destiny_desc: "La Loya Jirga a couronné un Shah ; maintenant l’empire doit choisir sa longue route. Soit vers l'intérieur vers le Khorasan, soit vers l'extérieur vers l'Hindoustan."

 nd_drr_dest_khorasan_restored: "Khorasan restauré"
 nd_drr_dest_khorasan_restored_desc: "Récupérez le cœur du Persan. Prenez Mashhad et Nishapur et stabilisez le royaume ; le centre de gravité de l'empire revient au point de rencontre du Khorasan, du Sistan et de l'Hindu Kush."

 nd_drr_dest_pearls_federation: "Perles de la Fédération"
 nd_drr_dest_pearls_federation_desc: "Develop the Khorasani heartland into the empire's economic core. Take Merv and Bukhara, raise Herat, the pearl of Khorasan, to half again its size, and fill the treasury. The qanat circuit is the empire's spine."

 nd_drr_dest_sunni_imamate: "Imamat sunnite du Khorasan"
 nd_drr_dest_sunni_imamate_desc: "Stand as the Sunni Imamate of Khorasan: heir to the Samanids, rival to the Safavid throne, and patron of the qanat-monastery network. Take Samarkand and Isfahan, build Kandahar, the city Ahmad Shah laid out anew, to twice its size, and unlock the Khorasani Qanat Network as your imperial irrigation work."

 nd_drr_dest_march_indus: "Marche sur l'Indus"
 nd_drr_dest_march_indus_desc: "Continue Ahmad Shah's invasions. Take Lahore and Multan, and hold the crossing of the Indus at Attock. The wealth and population of Hindustan are within the Shah's reach."

 nd_drr_dest_loot_delhi: "Le butin de Delhi"
 nd_drr_dest_loot_delhi_desc: "Sack Delhi et le Doab. Prenez Delhi, Agra et Sirhind ; ramener le butin de la capitale moghole. Le Trône du Paon vous appartient par droit de conquête."

 nd_drr_dest_pearl_of_pearls: "Perle de perles couronnée"
 nd_drr_dest_pearl_of_pearls_desc: "Make the Indus your river and Kabul your imperial seat. Hold Srinagar, Thatta, and Peshawar; build Kabul to twice its size; let the Bala Hissar of Kabul rise as the Imperial Diwan, the Mughal mantle taken in earnest."

# ===== DESTINY EVENT TEXT =====

 nd_drr.8.t: "La longue route de l'Empire"
 nd_drr.8.d: "Le Shah siège en conseil au Bala Hissar. La Loya Jirga a pris la parole ; le niveau est relevé ; le trésor est plein. Mais la question est de savoir de quel type d’empire il s’agira : un empire du Khorasan, tourné vers l’intérieur vers son plateau montagneux et le monde persan, ou un empire de l’Hindoustan, tourné vers l’extérieur vers les richesses de l’Indus et de la Yamuna. Les Sardars argumentent, citent les Qazis, les marchands Hindki pèsent leurs grands livres. La route doit être choisie."
 nd_drr.8.a: "La route sera à nous."

 nd_drr.9.t: "Khorasan revient à la Perle"
 nd_drr.9.d: "Mashhad et Nishapur sont à nous. Le sanctuaire de l'Imam Reza est à nouveau sous administration sunnite ; les bazars de Nishapur envoient leurs tapis, leur safran et leur turquoise à Kandahar. Les notables de langue persane du Khorasan se rendent au diwan du Shah, et la culture Khorasani, qui a toujours été la langue jumelle de l'empire, devient désormais son épine dorsale administrative. Les déchets du bassin du Helmand et les vergers d'Herat nous appartiennent de droit et de par l'histoire."
 nd_drr.9.a: "Le Khorasan est l'âme de l'empire."

 nd_drr.10.t: "Le circuit Qanat"
 nd_drr.10.d: "Merv et Boukhara sont pris. Les mirabs de l'empire surveillent les lignes de qanat du Sistan au Khwarezm ; les banquiers Hindki financent une centaine de nouveaux étages de caravanes ; les paysans Hazara creusent de nouveaux karez sous mandat royal. Il y a plus à faire qu’il n’y a de mains. Le diwan du Shah doit décider : le circuit des qanat sera-t-il élargi par la corvée, le travail du royaume étant concentré sur les travaux impériaux ? Ou bien le commerce lui-même financera-t-il les travaux, les caravanes apportant l'argent qui rémunère les creuseurs ?"
 nd_drr.10.a: "Appuyez sur la corvée. Le qanat est construit par le royaume lui-même."
 nd_drr.10.b: "Taxez les caravanes. Le commerce financera lui-même les travaux."

 nd_drr.11.t: "Imam de la Sunna"
 nd_drr.11.d: "Samarkand et Ispahan sont prises. L’empire s’étend de la steppe d’Aral au golfe Persique, et le Shah est désormais le patron inégalable du Khorasan sunnite, avec le sanctuaire de l’imam Reza, le tombeau de Tamerlan et la mosquée du vendredi d’Ispahan entre ses mains. Des cheikhs Naqshbandi aux banquiers hindki, toutes les voix de l'empire posent la même question : le Shah sera-t-il l'Imam de la Sunna, défenseur de la foi orthodoxe et rival du manteau chiite des Safavides ? Ou conservera-t-il l’Horizon Durrani, la large tolérance de l’écoumène persan ?"
 nd_drr.11.a: "Je suis l'Imam de la Sunna ; le credo orthodoxe est ma norme."
 nd_drr.11.b: "L'Horizon Durrani : de nombreuses confessions sous un même toit persan."

 nd_drr.12.t: "Marche sur l'Indus"
 nd_drr.12.d: "Lahore et Multan sont tombés. L'armée du Shah se tient sur l'Indus et regarde vers l'est, où le prétendant moghol ne tient Delhi que par tolérance, les Marathes attaquent le Doab, les Sikhs harcèlent le Pendjab et les Jats tiennent la Yamuna. Aucune de ces puissances ne peut répondre à ce que nous avons mis en œuvre. La plaine hindoustani est ouverte. La campagne continue."
 nd_drr.12.a: "Continuation vers Delhi."

 nd_drr.13.t: "Le butin de Delhi"
 nd_drr.13.d: "Delhi est tombée, Agra et Sirhind. L'empereur moghol est notre retraité ; le trône du paon est démoli et expédié à Kandahar ; le Koh-i-Noor est dans la sacoche du Shah. Quarante crores en hommage ont été promis. Pourtant, le Doab est agité et la confédération Maratha n'a pas encore été brisée. Deux voix s'affrontent dans le diwan : châtier les princes rebelles par l'épée, ou les gouverner par l'intermédiaire d'administrateurs hindoustani aux formes mogholes ?"
 nd_drr.13.a: "Châtiz-les. L'épée est la seule langue que connaissent les princes."
 nd_drr.13.b: "Règle à travers le diwan Yamuna ; laissez les munshis administrer."

 nd_drr.14.t: "Padshah-e Hind"
 nd_drr.14.d: "Srinagar of Kashmir, Thatta of Sindh, Peshawar of the Khyber, and Kabul grown to twice the town it was. The Shah is acclaimed Padshah-e Hind, master of all the lands from the Oxus to the Yamuna. The Bala Hissar of Kabul rises as a new imperial seat, modelled on the Red Fort, with diwans for the Pashtun nobles, the Hindustani munshis, the Hindki bankers, and the Persian poets. Now the question: rule as the Mughal mantle taken whole, or rule from Kabul as the imperial Durrani capital, distinct from the Mughal past?"
 nd_drr.14.a: "Je prends le manteau moghol. Je suis Padshah-e Hind."
 nd_drr.14.b: "Kaboul est le siège impérial. Le royaume Durrani lui appartient."

# ===== DESTINY BUILDINGS =====

 nd_drr_dest_qanat_network: "Réseau Khorasani Qanat"
 nd_drr_dest_qanat_network_desc: "Un ouvrage impérial d'irrigation unissant les lignes karez et qanat du Sistan au Khwarezm. Les mirabs du diwan explorent de nouveaux puits chaque saison ; les vergers d'Hérat, de Mashhad et de Boukhara nourrissent un empire."

 nd_drr_dest_qanat_upkeep: "Entretien des Qanat"
 nd_drr_dest_qanat_upkeep_desc: "Pierre, outils et bois pour les puits et les canaux du circuit de qanat. Du blé pour nourrir les creuseurs et les mirabs du royaume."

 nd_drr_dest_imperial_diwan: "Diwan impérial de Kaboul"
 nd_drr_dest_imperial_diwan_desc: "Le Bala Hissar de Kaboul reconstruit comme siège impérial, sur le modèle du Fort Rouge de Delhi. Des sardars pachtounes, des munshis hindoustani, des banquiers hindki et des poètes persans assistent tous au Shah dans sa salle d'audience."

 nd_drr_dest_diwan_upkeep: "Opérations Diwan"
 nd_drr_dest_diwan_upkeep_desc: "Papier pour les firmans, tissus fins pour le durbar, meubles pour le diwan-i-am, outils pour les ateliers impériaux."

# ===== DESTINY TIMED MODIFIERS =====

 STATIC_MODIFIER_NAME_nd_drr_dest_qanat_corvee: "Corvée Qanat"
 STATIC_MODIFIER_DESC_nd_drr_dest_qanat_corvee: "Le travail de l’empire est concentré dans les usines de qanat. De nouveaux puits vont du Sistan à Khwarezm ; les villages prospèrent aux têtes de nouvelles chaînes. Le royaume grandit grâce à l'eau et à la pierre."

 STATIC_MODIFIER_NAME_nd_drr_dest_caravan_circuit: "Circuit Caravane"
 STATIC_MODIFIER_DESC_nd_drr_dest_caravan_circuit: "Le commerce se rentabilise. Des caravanes boukhara, indiennes et perses circulent à travers le circuit du Khorasani ; Kaboul, Herat et Kandahar regorgent de nouveaux marchands et bazaris. Le diwan répartit largement ses diplomates."

 STATIC_MODIFIER_NAME_nd_drr_dest_imam_of_sunna: "Imam de la Sunna"
 STATIC_MODIFIER_DESC_nd_drr_dest_imam_of_sunna: "Le Shah est acclamé Imam de la Sunna. Les sanctuaires de l'Imam Reza, de Tamerlan, de Naqshband sont tous sous son patronage ; ses armées combattent sous l’étendard vert de l’orthodoxie et l’empire est le rival de tout trône chiite."

 STATIC_MODIFIER_NAME_nd_drr_dest_durrani_horizon: "L'Horizon Durrani"
 STATIC_MODIFIER_DESC_nd_drr_dest_durrani_horizon: "L’empire est le vaste œcumène persan tolérant des poètes, des mystiques, des commerçants et des érudits. Le banquier hindki, le cheikh Naqshbandi, le capitaine Qizilbash, le mirab Hazara marchent tous sous un même ciel impérial."

 STATIC_MODIFIER_NAME_nd_drr_dest_chastise_doab: "Châtiment le Doab"
 STATIC_MODIFIER_DESC_nd_drr_dest_chastise_doab: "Les princes du Doab sont instruits par l'épée. L'infanterie lourde de l'empire, les tirailleurs jezailchi et le corps zamburak s'entraînent pour la prochaine campagne ; les forts rebelles tombent plus vite qu’ils ne peuvent être relevés."

 STATIC_MODIFIER_NAME_nd_drr_dest_yamuna_diwan: "Le Diwan Yamuna"
 STATIC_MODIFIER_DESC_nd_drr_dest_yamuna_diwan: "Des munshis hindoustani et des administrateurs formés par Mughal occupent le nouveau diwan impérial sur la Yamuna. L'empire intègre ses conquêtes sur papier, registre et firman."

 STATIC_MODIFIER_NAME_nd_drr_dest_padshah_e_hind: "Padshah-e Hind"
 STATIC_MODIFIER_DESC_nd_drr_dest_padshah_e_hind: "Le Shah assume sérieusement le rôle de Mughal. De l'Oxus à la Yamuna, l'étendard de l'empire est le Padshah-e Hind, et la cavalerie lourde pachtoune chevauche sous un nouveau soleil impérial."

 STATIC_MODIFIER_NAME_nd_drr_dest_kabul_diwan: "Le Diwan de Kaboul"
 STATIC_MODIFIER_DESC_nd_drr_dest_kabul_diwan: "Kaboul est le siège de l’empire, pas Delhi. Le Bala Hissar s'élève comme le diwan impérial, avec une salle d'audience, un jardin d'audience et une bibliothèque ; les ambassadeurs de chaque pays assistent le Shah dans la haute citadelle."

