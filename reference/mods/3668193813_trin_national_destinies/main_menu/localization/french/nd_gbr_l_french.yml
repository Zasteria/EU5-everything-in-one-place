l_french:
 STATIC_MODIFIER_NAME_nd_rule_britannia: "Règle Britannia"
 STATIC_MODIFIER_DESC_nd_rule_britannia: "L’Acte d’Union a forgé une superpuissance maritime. Avec les flottes combinées de l'Angleterre et de l'Écosse et la richesse des océans du monde, la Grande-Bretagne dominera les mers, protégera ses routes commerciales et projettera sa puissance dans tous les coins du globe."
 STATIC_MODIFIER_NAME_nd_workshop_of_the_world: "Atelier du Monde"
 STATIC_MODIFIER_DESC_nd_workshop_of_the_world: "L’union de l’Angleterre et de l’Écosse crée non seulement une entité politique mais aussi un moteur économique. Avec des ressources naturelles abondantes, des institutions d’enseignement en pleine croissance et une culture de l’innovation pratique, la Grande-Bretagne deviendra l’atelier qui approvisionne le monde."
 nd_gbr.1.t: "L'Acte d'Union"
 nd_gbr.1.d: "The Acts of Union have joined the Kingdoms of England and Scotland into a single sovereign state, Great Britain. The Scottish Parliament and English Parliament are dissolved, replaced by the Parliament of Great Britain at Westminster. This is no mere conquest; it is a negotiated union, born of shared Protestant faith, economic necessity, and the hard lessons of a century of civil wars.\n\nThe question now is what manner of nation this united Britain shall become. The combined Royal Navy already rivals any fleet afloat, and the chartered trading companies reach from the Spice Islands to the Americas. But within these islands lie coal seams, iron deposits, and a population of inventors, artisans, and entrepreneurs whose energies, properly harnessed, could transform the very nature of production itself.\n\nWhat shall define this new Britain?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_gbr.1.a: "Britannia dominera les vagues."
 nd_gbr.1.b: "Nous serons la forge des nations."
 nd_gbr.2.t: "La Banque d'Angleterre"
 nd_gbr.2.d: "In 1694, William Paterson persuaded Parliament to charter a novel institution: a national bank that would lend money to the government at interest, funded by public subscription. The Bank of England has proven revolutionary. By providing the Crown with reliable credit at reasonable rates, it has freed Britain from dependence on foreign bankers and enabled the sustained funding of both war and commerce.\n\nThe Bank's notes circulate alongside coin, and its capacity to manage the national debt gives Britain a financial resilience its rivals can only envy. But how shall this institution best serve the nation? Sound monetary policy would stabilize prices and reward thrift. Alternatively, generous credit could fuel merchant ventures and construction projects across the realm."
 nd_gbr.2.a: "Une monnaie saine est le fondement d’une prospérité durable."
 nd_gbr.2.b: "Le crédit est l’élément vital du commerce."
 nd_gbr.3.t: "Les régiments des Highlands"
 nd_gbr.3.d: "The pacification of the Scottish Highlands after the Jacobite risings presented Britain with both a challenge and an opportunity. The fierce warrior tradition of the Highland clans (the devastating charge with broadsword and targe, the endurance bred by mountain life) could be turned from a source of rebellion into a pillar of imperial strength.\n\nThe formation of Independent Highland Companies, later merged into the Black Watch and other regiments, channels this martial spirit into service of the Crown. Highland soldiers have already proven themselves from Fontenoy to Fort Ticonderoga, their courage and ferocity earning respect even from their enemies.\n\nShall we focus on integrating these proud people fully into British society, or preserve their distinct martial tradition as a weapon of empire?"
 nd_gbr.3.a: "Accueillez-les comme des sujets égaux de la Couronne."
 nd_gbr.3.b: "Laissez la charge des Highlands terrifier nos ennemis."
 nd_gbr.4.t: "La Compagnie des Indes orientales"
 nd_gbr.4.d: "What began as a modest joint-stock venture to trade in Eastern spices has become the most powerful commercial enterprise the world has ever seen. The East India Company now maintains its own armies, governs vast territories, and conducts diplomacy with sovereign rulers from the Mughal Emperor to the Sultan of Sulu.\n\nFrom the warehouses of Surat to the counting houses of Calcutta, Company agents trade in cotton, silk, indigo, tea, and opium. The revenues flowing back to London fuel investment, feed the Treasury through customs duties, and make fortunes for shareholders. The East Indiaman, those great armed merchantmen that ply the route to India, have become the commercial backbone of the British Empire."
 nd_gbr.4.a: "Le commerce est le nerf de l’empire."
 nd_gbr.5.t: "Premiers tarifs de la ligne"
 nd_gbr.5.d: "The first-rate ship of the line represents the pinnacle of wooden warship construction. Mounting a hundred guns or more across three decks, these floating fortresses can deliver devastating broadsides that can reduce any opposition to splinters. The Victory, the Royal Sovereign, the Britannia, their very names speak of naval supremacy.\n\nBuilding and maintaining such vessels requires prodigious resources: thousands of oak trees for the hull, miles of rope and canvas, tons of iron for fittings and guns, and crews numbering eight hundred men or more. Only a nation with Britain's dockyards, its timber reserves, its trained seamen, and its financial institutions can sustain a fleet of such leviathans. They are as much a statement of industrial and organizational capacity as of naval ambition."
 nd_gbr.5.a: "Les murs en bois de l'Angleterre."
 STATIC_MODIFIER_NAME_nd_gbr_sound_money: "Argent sain"
 STATIC_MODIFIER_DESC_nd_gbr_sound_money: "La Banque d'Angleterre poursuit une politique de stabilité monétaire, en maintenant la valeur de la livre sterling et en accordant des crédits fiables à la Couronne à des taux favorables."
 STATIC_MODIFIER_NAME_nd_gbr_mercantile_credit: "Crédit marchand"
 STATIC_MODIFIER_DESC_nd_gbr_mercantile_credit: "La Banque d'Angleterre accorde des crédits généreux aux commerçants et aux constructeurs, alimentant ainsi un boom des entreprises commerciales et des projets de construction à travers le royaume."
 STATIC_MODIFIER_NAME_nd_gbr_highland_integration: "Intégration des Highlands"
 STATIC_MODIFIER_DESC_nd_gbr_highland_integration: "Les clans des Highlands sont accueillis comme sujets égaux de la Couronne, leur culture est respectée et leur peuple intégré dans le tissu plus large de la société britannique."
 STATIC_MODIFIER_NAME_nd_gbr_martial_tradition: "Tradition martiale des Highlands"
 STATIC_MODIFIER_DESC_nd_gbr_martial_tradition: "Les féroces traditions guerrières des Highlands écossaises sont préservées et célébrées, canalisées dans des régiments d'élite qui terrifient les ennemis de la Grande-Bretagne sur les champs de bataille du monde entier."
 nd_gbr_staple_ports: "Ports d'agrafes"
 nd_gbr_staple_ports_desc: "Le système de laine de base canalise le commerce anglais via des ports désignés, établissant des marchés réglementés qui concentrent l’activité commerciale et génèrent des recettes douanières fiables."
 nd_gbr_trinity_house_charter: "Trinity House"
 nd_gbr_trinity_house_charter_desc: "In 1514 Henry VIII granted a charter to the Guild of the Holy Trinity at Deptford Strond, a fraternity of shipmen who complained that unskilled young men were piloting ships on the Thames. The guild licenses every pilot on the river and will in time keep the buoys, beacons and lighthouses of the whole coast."
 nd_gbr_admiralty_courts: "Tribunaux d'amirauté"
 nd_gbr_admiralty_courts_desc: "Les tribunaux spécialisés relevant de la juridiction de l'amirauté règlent les différends maritimes, appliquent les lois sur les prises et fournissent le cadre juridique pour un établissement naval en expansion."
 nd_gbr_new_model_army: "Nouveau modèle d'armée"
 nd_gbr_new_model_army_desc: "L'innovation révolutionnaire d'Oliver Cromwell : une armée professionnelle permanente organisée selon le mérite plutôt que selon le rang social, entraînée à une discipline stricte et loyale à la cause plutôt qu'à des commandants individuels."
 nd_gbr_chartered_companies: "Entreprises à charte"
 nd_gbr_chartered_companies_desc: "Les chartes royales accordent à des sociétés par actions des droits commerciaux monopolistiques dans des régions éloignées, combinant capital privé et objectif public pour étendre la portée commerciale britannique à travers le monde."
 nd_gbr_race_built_galleon: "Gallions construits par la course"
 nd_gbr_race_built_galleon_desc: "La conception révolutionnaire du navire de Sir John Hawkins : plus bas dans l'eau, plus long proportionnellement à sa largeur et plus rapide que les imposants galions espagnols pour lesquels ils ont été construits."
 nd_gbr_english_dragoons: "Dragons anglais"
 nd_gbr_english_dragoons_desc: "Infanterie à cheval qui part au combat à cheval mais combat à pied, combinant la mobilité stratégique de la cavalerie avec la puissance de feu des mousquetaires."
 nd_gbr_royal_dockyards: "Chantiers navals royaux"
 nd_gbr_royal_dockyards_desc: "Les grands chantiers navals de Chatham, Portsmouth et Deptford constituent l'épine dorsale industrielle de la Royal Navy, capable de construire, d'équiper et de réparer des navires de guerre à une échelle sans précédent."
 nd_gbr_sloop_warfare: "Guerre en sloop"
 nd_gbr_sloop_warfare_desc: "De petits sloops de guerre rapides patrouillent les côtes et les routes commerciales, chassant les pirates, escortant les convois et maintenant la présence navale britannique dans les eaux trop peu profondes ou trop éloignées pour les navires de ligne."
 nd_gbr_bank_of_england: "Banque d'Angleterre"
 nd_gbr_bank_of_england_desc: "La création d’une banque nationale en 1694 révolutionne les finances publiques, en fournissant un crédit fiable, en stabilisant la monnaie et en donnant à la Grande-Bretagne un avantage financier que ses rivaux ne peuvent égaler."
 nd_gbr_highland_regiments: "Régiments des Highlands"
 nd_gbr_highland_regiments_desc: "Les féroces traditions guerrières des Highlands écossaises sont mises à profit pour le service impérial, alors que les guerriers des clans sont organisés en régiments disciplinés qui combinent la férocité des Highlands et l'exercice militaire britannique."
 nd_gbr_east_india_trade: "Commerce des Indes orientales"
 nd_gbr_east_india_trade_desc: "Les navires marchands armés de la Compagnie des Indes orientales, les East Indiamen, sillonnent la route vers l'Inde et au-delà, combinant une formidable capacité navale avec une vaste capacité de chargement."
 nd_gbr_royal_marines: "Marine royale"
 nd_gbr_royal_marines_desc: "Le régiment maritime d'infanterie du duc d'York et d'Albany, créé en 1664, crée un corps permanent de soldats entraînés au combat à bord, aux actions d'abordage et aux opérations amphibies."
 nd_gbr_turnpike_trusts: "Fiducies à péage"
 nd_gbr_turnpike_trusts_desc: "Les fiducies d'autoroutes privées imposent des péages pour entretenir et améliorer les routes, créant ainsi un réseau d'itinéraires fiables par tous les temps qui réduisent considérablement les temps de trajet et les coûts de transport à travers la Grande-Bretagne."
 nd_gbr_frigate_design: "Conception d'une frégate britannique"
 nd_gbr_frigate_design_desc: "La frégate de cinquième rang devient le navire de guerre le plus polyvalent de la Royal Navy : suffisamment rapide pour repérer la flotte de combat, suffisamment puissant pour affronter les navires marchands ennemis et suffisamment navigable pour opérer de manière indépendante sur de vastes océans."
 nd_gbr_first_rate_ships: "Navires de premier ordre"
 nd_gbr_first_rate_ships_desc: "Ce navire de ligne de premier ordre, doté d'une centaine de canons ou plus sur trois ponts, représente l'expression ultime de la construction de navires de guerre en bois et de la puissance industrielle navale."
 nd_gbr_horse_guards: "Gardes à cheval"
 nd_gbr_horse_guards_desc: "La Household Cavalry, les Life Guards et les Royal Horse Guards servent de garde du corps à cheval personnel du souverain et de cavalerie lourde d'élite sur le champ de bataille."
 nd_gbr_charity_schools: "Écoles caritatives"
 nd_gbr_charity_schools_desc: "La Society for Promoting Christian Knowledge crée des écoles caritatives dans toute la Grande-Bretagne, fournissant une éducation de base aux enfants des pauvres et jetant les bases d’une main-d’œuvre alphabétisée."
 nd_gbr_coal_and_iron: "Charbon et fer"
 nd_gbr_coal_and_iron_desc: "Les abondantes veines de charbon et les gisements de fer de la Grande-Bretagne, combinés aux innovations dans les domaines de la fusion et du travail des métaux, créent la base de matières premières pour une transformation industrielle qui remodèlera le monde."
 n_nd_gbr_race_built_ship: "Galion construit pour la course"
 n_nd_gbr_race_built_ship_desc: "Un navire de guerre anglais révolutionnaire avec un profil plus bas, une coque plus longue et des qualités de navigation supérieures à celles des imposants galions des marines rivales."
 n_nd_gbr_sloop: "Sloop de guerre"
 n_nd_gbr_sloop_desc: "Un petit navire de patrouille rapide conçu pour l'escorte de convois, les opérations anti-piraterie et les tâches de patrouille côtière."
 n_nd_gbr_east_indiaman: "Indien de l'Est"
 n_nd_gbr_east_indiaman_desc: "Un navire marchand lourdement armé de la Compagnie des Indes orientales, conçu pour le long et dangereux voyage vers l'Inde et l'Extrême-Orient."
 n_nd_gbr_frigate: "Frégate britannique"
 n_nd_gbr_frigate_desc: "Le navire de guerre polyvalent de cinquième ordre de la Royal Navy, suffisamment rapide pour effectuer des reconnaissances et suffisamment puissant pour combattre de manière indépendante sur les océans du monde."
 n_nd_gbr_first_rate: "Premier tarif"
 n_nd_gbr_first_rate_desc: "L'expression ultime du navire de guerre en bois : une forteresse flottante à trois ponts et dotée de cent canons, capable de dévaster les bordées."
 a_nd_gbr_pikemen_levy: "Nouveaux modèles de piquiers"
 a_nd_gbr_pikemen_levy_desc: "Soldats professionnels disciplinés de la tradition de la New Model Army, entraînés pour tenir bon sous le feu et pousser le brochet avec une précision mécanique."
 a_nd_gbr_dragoon_levy: "Dragons anglais"
 a_nd_gbr_dragoon_levy_desc: "Infanterie montée qui chevauche pour se battre mais descend de cheval pour se battre, combinant mobilité stratégique et puissance de feu."
 a_nd_gbr_marines: "Marine royale"
 a_nd_gbr_marines_desc: "Soldats professionnels formés au combat à bord, aux actions d'abordage et aux débarquements amphibies. Les soldats marins de la Couronne."
 a_nd_gbr_horse_guards: "Gardes à cheval"
 a_nd_gbr_horse_guards_desc: "La cavalerie d'élite du souverain britannique, combinant splendeur cérémonielle et capacité dévastatrice sur le champ de bataille."
 nd_gbr_royal_dockyard: "Chantier naval royal"
 nd_gbr_royal_dockyard_desc: "Une installation navale majeure de construction et de réparation navale, capable de construire des navires de guerre de tous niveaux et de maintenir la flotte en état de combat."
 nd_gbr_trading_factory: "Usine commerciale"
 nd_gbr_trading_factory_desc: "Un entrepôt commercial et un poste de traite exploité par des marchands agréés, concentrant l'activité commerciale et étendant les réseaux commerciaux britanniques."
 nd_gbr_turnpike_road: "Route à péage"
 nd_gbr_turnpike_road_desc: "Une route à péage entretenue par une fiducie privée, offrant un transport fiable par tous les temps qui relie les marchés et réduit les temps de trajet."
 nd_gbr_charity_school: "École de charité"
 nd_gbr_charity_school_desc: "Une école financée par une souscription caritative pour éduquer les enfants des pauvres, diffusant l'alphabétisation et des connaissances utiles parmi les classes laborieuses."
 nd_gbr_trinity_house: "Trinity House"
 nd_gbr_trinity_house_desc: "A house of the pilots' guild in a harbour town. Its brethren examine and license pilots, lay buoys on the shoals, and keep the beacons burning that bring ships in after dark."
 nd_gbr_admiralty_office: "Bureau de l'Amirauté"
 nd_gbr_admiralty_office_desc: "Un bureau régional de l'administration navale, coordonnant les opérations de la flotte, gérant le recrutement des marins et tenant à jour les registres maritimes."
 nd_gbr_dockyard_maintenance: "Opérations du chantier naval"
 nd_gbr_dockyard_maintenance_desc: "L'approvisionnement continu en bois, en provisions navales et en outils nécessaires à la construction et à l'entretien des navires de guerre dans un chantier naval royal."
 nd_gbr_factory_maintenance: "Opérations d'usine"
 nd_gbr_factory_maintenance_desc: "Les tissus, les teintures et les papiers sont échangés et consommés par l'usine, soutenant ainsi ses activités commerciales."
 nd_gbr_turnpike_maintenance: "Entretien des autoroutes à péage"
 nd_gbr_turnpike_maintenance_desc: "La pierre, le bois et les outils nécessaires pour entretenir la surface de la route, réparer les ponts et maintenir les barrières de péage en ordre."
 nd_gbr_school_maintenance: "Fournitures scolaires"
 nd_gbr_school_maintenance_desc: "Papier et livres nécessaires au fonctionnement de l'école caritative, dotant les élèves des outils d'alphabétisation."
 nd_gbr_seamark_upkeep: "Seamark Upkeep"
 nd_gbr_seamark_upkeep_desc: "Timber for buoys and beacon towers, tar to keep them sound in salt water, and coal for the open fires that serve as harbour lights."
 nd_gbr_admiralty_maintenance: "Opérations de l'Amirauté"
 nd_gbr_admiralty_maintenance_desc: "Papier pour la correspondance, provisions navales pour l'approvisionnement et tissus fins pour les uniformes des officiers et fonctionnaires soutenant les fonctions administratives de l'amirauté."
 nd_gbr_formed_tt: "La Grande-Bretagne a été formée"
 nd_gbr_path_a_tt: "Choisissez Rule Britannia"
 nd_gbr_path_b_tt: "A choisi l'Atelier du Monde"
 nd_gbr_dest_narrow_seas: "Commandez les mers étroites"
 nd_gbr_dest_narrow_seas_desc: "Britain's maritime destiny begins at home. Subdue Ulster and hold Derry, where the North Channel is narrowest, to unite the archipelago, seize Calais to dominate the English Channel, and build a force worthy of a naval power. Only then can the Royal Navy project strength beyond these waters."
 nd_gbr_dest_caribbean: "Gare des Caraïbes"
 nd_gbr_dest_caribbean_desc: "Les îles sucrières des Caraïbes et le bastion stratégique des Bermudes ancreront la puissance navale britannique dans le Nouveau Monde. Saisissez La Havane à l'Espagne et fortifiez l'Atlantique, sécurisant les routes commerciales qui enrichissent la couronne."
 nd_gbr_dest_pax_britannica: "Pax Britannica"
 nd_gbr_dest_pax_britannica_desc: "The ultimate expression of British naval supremacy: control the world's vital chokepoints. Gibraltar commands the Mediterranean, Aden guards the Red Sea, Bombay anchors power in India, and Singapore secures the passage to the East. The stations are kept by frigates that can cruise for years far from home."
 nd_gbr_dest_united_kingdom: "Le Royaume-Uni"
 nd_gbr_dest_united_kingdom_desc: "Before Britain can reshape the world, it must first consolidate the home islands. Bring Ireland into the union by ruling Dublin directly and building it into the second city of the kingdoms, foster internal stability, and ensure coal, the fuel of the coming age, flows through British markets."
 nd_gbr_dest_dublin_developed_tt: "#bold Dublin#! is owned directly and has at least #bold 36#! development"
 nd_gbr_dest_city_of_london: "La ville de Londres"
 nd_gbr_dest_city_of_london_desc: "The square mile of the City of London shall become the financial capital of the world. Amass the wealth of a great power, embrace modern banking institutions, and build London up to half again what it was."
 nd_gbr_dest_london_developed_tt: "#bold London#! is owned and has at least #bold 56#! development"
 nd_gbr_dest_industrial_revolution: "La révolution industrielle"
 nd_gbr_dest_industrial_revolution_desc: "From the cotton mills of Manchester to the forges of Birmingham, Britain shall pioneer the age of machines. Embrace industrialization and build both towns up to twice what they were, into manufacturing cities whose productive capacity dwarfs all rivals."
 nd_gbr_dest_manchester_developed_tt: "#bold Manchester#! is owned and has at least #bold 34#! development"
 nd_gbr_dest_birmingham_developed_tt: "#bold Birmingham#! is owned and has at least #bold 44#! development"
 nd_gbr_destiny: "Le destin britannique"
 nd_gbr_destiny_desc: "La Grande-Bretagne est unie. La question qui définit son avenir, à savoir si elle dominera les mers ou forgera un nouveau monde grâce à l’industrie, exige une réponse. Le destin de ces îles et du monde qu’elles façonneront commence ici."
 nd_gbr.6.t: "Le destin britannique"
 nd_gbr.6.d: "Great Britain is forged. England and Scotland are no longer rivals but partners in a union of extraordinary potential. The combined resources of these islands (the dockyards of the Thames, the coal seams of the Midlands, the hardy seamen of Cornwall and the Highlands) create a nation of unmatched versatility.\n\nBut potential alone does not make greatness. The path Britain chooses will determine whether it becomes the master of the world's oceans or the workshop that reshapes civilization itself. Both roads lead to supremacy, but they demand different sacrifices and different virtues."
 nd_gbr.6.a: "Notre destin nous attend."
 nd_gbr.7.t: "Commandement des mers étroites"
 nd_gbr.7.d: "The English Channel and the Irish Sea are now British waters in truth, not merely in aspiration. With Ulster subdued, Derry walled and Calais in British hands, no fleet can threaten these islands, and no merchant vessel can pass without British leave.\n\nThe Narrow Seas are the gateway to the wider world. From this position of unassailable home defense, Britain can now project its naval power outward, to the Caribbean, to the Mediterranean, to the distant waters of the Indian Ocean."
 nd_gbr.7.a: "La Manche est à nous."
 nd_gbr.8.t: "La Station des Caraïbes"
 nd_gbr.8.d: "British warships now patrol the turquoise waters of the Caribbean, and the Union Jack flies over Havana and Bermuda. The sugar islands produce fabulous wealth, the strategic harbors provide anchorage for squadrons that can strike anywhere in the Americas, and the trade routes home are secured against all comers.\n\nBut what shall this Caribbean dominion ultimately serve? The plantation wealth of sugar, rum, and tobacco can fuel Britain's merchant class to unprecedented prosperity. Alternatively, the Caribbean stations can become the forward operating bases of a fleet designed to control every ocean."
 nd_gbr.8.a: "Que le commerce du sucre se dirige vers Londres."
 nd_gbr.8.b: "Notre flotte dominera tous les horizons."
 nd_gbr.9.t: "Pax Britannica"
 nd_gbr.9.d: "Gibraltar. Aden. Bombay. Singapore. Four names that together spell global dominion. Britain now controls every vital chokepoint between Europe and the East, commanding the Mediterranean passage, the Red Sea route, the Indian Ocean, and the Straits of Malacca.\n\nNo fleet can move, no merchant can trade, no empire can project power without British permission. This is the Pax Britannica, peace enforced by the unmatched power of the Royal Navy. But how shall this unprecedented supremacy be wielded? Through the direct application of force, bending rivals to British will? Or through the patient construction of an imperial system, binding subject peoples into a federation that serves London?"
 nd_gbr.9.a: "Laissons les canonnières porter notre diplomatie."
 nd_gbr.9.b: "Nous allons lier l’empire ensemble."
 nd_gbr.10.t: "Le Royaume-Uni"
 nd_gbr.10.d: "The Act of Union with Ireland completes the consolidation of the British Isles into a single political entity, the United Kingdom of Great Britain and Ireland. Dublin is ruled from Westminster and has grown into the second city of the kingdoms. With internal stability secured and the coal that will power a revolution flowing freely through British markets, the foundations of economic supremacy are laid.\n\nThe home islands are no longer a collection of feuding kingdoms but a unified economic space of extraordinary productive potential. What was once a patchwork of regional economies is becoming a single, integrated market, the largest and most sophisticated in Europe."
 nd_gbr.10.a: "Un royaume, un marché, un destin."
 nd_gbr.11.t: "La ville de Londres"
 nd_gbr.11.d: "The City of London, that ancient square mile within the old Roman walls, has become the undisputed financial capital of the world. The Bank of England sets interest rates that ripple across continents, Lloyd's insures every ship afloat, and the Royal Exchange sets commodity prices for goods from every corner of the globe.\n\nThis concentration of financial power gives Britain leverage that armies alone cannot provide. But the City's influence can be directed in different ways. Shall it serve as a stock exchange, directing capital into productive ventures and reducing the cost of construction across the realm? Or shall it develop as an insurance and intelligence market, where the information flowing through Lloyd's and the counting houses gives Britain unmatched diplomatic advantage?"
 nd_gbr.11.a: "Le capital construira cette nation."
 nd_gbr.11.b: "L’information est la véritable monnaie du pouvoir."
 nd_gbr.12.t: "La révolution industrielle"
 nd_gbr.12.d: "The world will never be the same. In the cotton mills of Manchester and the iron foundries of Birmingham, a revolution is underway that will transform human civilization more profoundly than any conquest. Steam engines pump water from mines, drive looms that produce cloth a hundred times faster than hand weavers, and power bellows that smelt iron in quantities previously unimaginable.\n\nBritain stands at the epicenter of this transformation. But what shall the Industrial Revolution ultimately mean for British society? The raw productive power of steam can be channeled into military and logistical supremacy, enabling faster mobilization and movement of armies. Or the social upheaval of industrialization can be harnessed through parliamentary reform, extending the franchise, abolishing old injustices, and building a more stable society."
 nd_gbr.12.a: "La vapeur alimentera notre suprématie."
 nd_gbr.12.b: "La réforme renforcera notre société."
 STATIC_MODIFIER_NAME_nd_gbr_dest_sugar_trade: "Commerce du sucre"
 STATIC_MODIFIER_DESC_nd_gbr_dest_sugar_trade: "Les plantations sucrières des Caraïbes génèrent d'énormes richesses, enrichissant la classe marchande britannique et concentrant le pouvoir commercial dans les grandes maisons de commerce, même si les coûts liés au maintien de garnisons éloignées pèsent sur le budget de l'armée."
 STATIC_MODIFIER_NAME_nd_gbr_dest_colonial_fleet: "Flotte coloniale"
 STATIC_MODIFIER_DESC_nd_gbr_dest_colonial_fleet: "Des escadrons spécialement conçus de navires rapides et résistants aux intempéries patrouillent dans l'Atlantique et les Caraïbes, projetant la puissance navale britannique à travers l'océan et sécurisant toutes les routes commerciales de la Couronne."
 STATIC_MODIFIER_NAME_nd_gbr_dest_gunboat_diplomacy: "Diplomatie de la canonnière"
 STATIC_MODIFIER_DESC_nd_gbr_dest_gunboat_diplomacy: "Un navire de guerre britannique dans le port parle plus fort que n'importe quel ambassadeur. La Royal Navy applique les traités, ouvre les marchés et règle les différends avec la menace implicite d’une puissance de feu dévastatrice."
 STATIC_MODIFIER_NAME_nd_gbr_dest_imperial_federation: "Fédération Impériale"
 STATIC_MODIFIER_DESC_nd_gbr_dest_imperial_federation: "Les territoires les plus éloignés de l’Empire britannique sont liés entre eux par des institutions communes, la common law et les fils invisibles du commerce et de la gouvernance, même si une domination aussi vaste engendre une dangereuse complaisance."
 STATIC_MODIFIER_NAME_nd_gbr_dest_stock_exchange: "Bourse"
 STATIC_MODIFIER_DESC_nd_gbr_dest_stock_exchange: "La Bourse de Londres canalise les capitaux privés vers des investissements productifs, réduisant ainsi le coût de la construction et renforçant la situation financière de la Couronne grâce à une culture d'innovation et de spéculation."
 STATIC_MODIFIER_NAME_nd_gbr_dest_insurance_market: "Marché de l'assurance"
 STATIC_MODIFIER_DESC_nd_gbr_dest_insurance_market: "Les réseaux de renseignement du Lloyd's de Londres et de la City fournissent à la Grande-Bretagne une connaissance inégalée des affaires mondiales, améliorant les relations diplomatiques et permettant la libre circulation des échanges sur les marchés ouverts."
 STATIC_MODIFIER_NAME_nd_gbr_dest_steam_power: "Puissance de la vapeur"
 STATIC_MODIFIER_DESC_nd_gbr_dest_steam_power: "La machine à vapeur transforme non seulement l’industrie mais aussi la guerre. Un recrutement plus rapide, une logistique améliorée et la concentration de la capacité de production dans les grandes villes britanniques confèrent à la nation un avantage militaro-industriel décisif."
 STATIC_MODIFIER_NAME_nd_gbr_dest_reform_acts: "Les lois de réforme"
 STATIC_MODIFIER_DESC_nd_gbr_dest_reform_acts: "La réforme parlementaire étend le droit de vote, abolit les arrondissements pourris et s’attaque aux bouleversements sociaux de l’industrialisation. Un gouvernement plus représentatif impose une plus grande loyauté et réduit l’attrait du séparatisme et de la révolution."
 nd_gbr_royal_arsenal: "Arsenal Royal"
 nd_gbr_royal_arsenal_desc: "Un vaste complexe militaro-industriel combinant construction navale, production de munitions et installations de garnison, capable d'équiper et d'entretenir les forces navales et terrestres à une échelle qu'aucun rival ne peut égaler."
 nd_gbr_industrial_works: "Travaux Industriels"
 nd_gbr_industrial_works_desc: "Une usine de fabrication mécanisée alimentée à la vapeur et au charbon, produisant des biens à une vitesse et à une échelle qui transforment l'économie locale et attirent des travailleurs de toute la région."
 nd_gbr_arsenal_maintenance: "Opérations d'Arsenal"
 nd_gbr_arsenal_maintenance_desc: "Les magasins de fer et navals nécessaires au maintien en fonctionnement des fonderies et des cales de l'arsenal."
 nd_gbr_works_maintenance: "Opérations industrielles"
 nd_gbr_works_maintenance_desc: "Le charbon et le fer alimentent les fourneaux et les marteaux à vapeur des usines industrielles, produisant de l'acier pour une nation en transformation."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_gbr_bureaucracy_authority: "Appareil de Westminster"
 AUTO_MODIFIER_DESC_nd_gbr_bureaucracy_authority: "The institutional machinery of the British state (Privy Council, Treasury, the courts at Westminster Hall, and a permanent civil service) has matured into a coherent apparatus. Four institutions can be kept at a time."

 justices_of_the_peace_bureaucracy: "Juges de paix"
 justices_of_the_peace_bureaucracy_desc: "Formalisés par la Loi sur les juges de paix de 1361, les magistrats laïcs des comtés sont devenus le pilier du gouvernement local Tudor. Issus de la noblesse terrienne, les juges de paix jugeaient les crimes lors de sessions trimestrielles, administraient les lois sur les pauvres, rassemblaient la milice et gouvernaient efficacement les comtés anglais jusqu'aux conseils de comté réformés du XIXe siècle. Leur autorité appartient à la Couronne, mais leurs intérêts sont incontestablement ceux du squirearchy."

 star_chamber_bureaucracy: "Cour de la Chambre Étoile"
 star_chamber_bureaucracy_desc: "Siégeant dans la chambre peinte en étoiles du Palais de Westminster depuis le Star Chamber Act de 1487 d'Henri VII jusqu'à son abolition par le Long Parlement en 1641, cette cour de prérogative du Conseil du Roi a contourné les jurys de droit commun pour mettre au pas les sujets trop puissants. Sous la chancellerie du cardinal Wolsey, la Chambre Étoile devint formidable ; sous les premiers Stuarts, il devint synonyme d'absolutisme royal, et le prix que sa fermeture exigea de la Couronne fut payé en 1649."

 exchequer_bureaucracy: "L'Échiquier"
 exchequer_bureaucracy_desc: "Constitué par Henri Ier au début du XIIe siècle et nommé d'après le tissu à carreaux sur lequel étaient calculés les comptes des shérifs, l'Échiquier vérifiait chaque recette et décaissement de la Couronne deux fois par an. Les Pipe Rolls produits par ses barons ont ancré l'administration fiscale anglaise pendant sept siècles, jusqu'à ce que la fin officielle du département avec la Loi sur les départements de l'Échiquier et de l'Audit de 1833 ne laisse derrière elle que le compte de l'Échiquier de la Banque d'Angleterre."

 royal_mint_bureaucracy: "La Monnaie Royale"
 royal_mint_bureaucracy_desc: "La monnaie Tealby d'Henri II de 1158 a fixé la norme en argent sterling à 92,5 pour cent de finesse - une référence maintenue, avec des dégradations notoires, jusqu'en 1920. Installée dans la Tour de Londres sous la direction du King's Assay Master, la monnaie de la Monnaie était vérifiée chaque année par le Procès de la Custode, le plus ancien processus d'assurance qualité continue du royaume. Les pièces de monnaie saines garantissent à la fois la confiance du commerçant dans le commerce à longue distance et la réputation de la Couronne en matière d'honnêteté."

 navy_board_bureaucracy: "Conseil de la Marine"
 navy_board_bureaucracy_desc: "Créé par lettres patentes d'Henri VIII le 24 avril 1546 sous le nom de Conseil de la Marine, le Navy Board a fait de la Royal Navy une institution permanente plutôt qu'une flotte engagée campagne par campagne. Le trésorier, l'arpenteur, le contrôleur et le commis de la marine administraient les chantiers navals de Deptford, Woolwich et Portsmouth et géraient tous les contrats concernant le bois, les cordages et les canons. À partir de 1628, elle dépend du Conseil de l'Amirauté, mais son savoir-faire naval survit à toutes les réorganisations."

 bank_of_england_bureaucracy: "Banque d'Angleterre"
 bank_of_england_bureaucracy_desc: "Agréée le 27 juillet 1694 en vertu du Tonnage Act selon le plan de Charles Montagu, la Gouverneur et compagnie de la Banque d'Angleterre a prêté 1,2 million de livres sterling au gouvernement de guerre de Guillaume III en échange de privilèges d'émission de billets et de gestion de la dette consolidée. En convertissant les emprunts de guerre à court terme en rentes perpétuelles à des taux prévisibles, la Banque a accordé à la Grande-Bretagne le crédit durable sur lequel ont été construits l’État fiscal et militaire et les longues guerres du XVIIIe siècle avec la France."

 westminster_parliament_bureaucracy: "Parlement de Westminster"
 westminster_parliament_bureaucracy_desc: "Les Actes d'Union de 1707 ont dissous les parlements d'Édimbourg et d'Angleterre et ont convoqué un seul Parlement de Grande-Bretagne à Westminster, avec des pairs représentatifs écossais dans les Lords et 45 membres écossais dans les Communes. Sa suprématie législative après 1689 en fait le garant indispensable de l'État fiscalo-militaire : les impôts parlementaires garantissent le crédit public et donnent de la solidité à la charte de la Banque d'Angleterre. Le prix à payer était une dilution permanente de la prérogative royale."
