l_french:
 # === Variable Tooltips ===
 nd_alm_formed_tt: "Création du califat almohade"
 nd_alm_path_a_tt: "Voie du Mu'minun choisie"
 nd_alm_path_b_tt: "Voie choisie de la cour califale"
 nd_alm_dest_seville_developed_tt: "Owns #bold Seville#! and its development is at least #bold 75#!"
 nd_alm_dest_marrakesh_developed_tt: "Owns #bold Marrakesh#! and its development is at least #bold 48#!"

 # === Formation Modifiers ===
 STATIC_MODIFIER_NAME_nd_alm_mahdist_revolution: "Révolution mahdiste"
 STATIC_MODIFIER_DESC_nd_alm_mahdist_revolution: "La réforme puritaine d'Ibn Toumart brûle le califat. Les Mu'minun portent les armes avec la certitude d'être sauvés, et les hérétiques ne connaissent aucun quartier ; mais les inquisiteurs vigilants du credo almohade laissent peu de place aux écoles plus anciennes et à leurs minorités tolérées."
 STATIC_MODIFIER_NAME_nd_alm_caliphal_civilization: "Civilisation califale"
 STATIC_MODIFIER_DESC_nd_alm_caliphal_civilization: "Le Marrakech de Yaqub al-Mansur devient un phare de la falsafa : Ibn Rushd commentant Aristote, Maïmonide composant le Mishneh Torah à sa cour, les usines de papier bourdonnant et les érudits andalous remplissant les bibliothèques. Le Califat repose sur sa grandeur, peut-être trop facilement."

 # === Advance Event Modifiers ===
 STATIC_MODIFIER_NAME_nd_alm_tinmel_zeal: "Zèle de Tinmel"
 STATIC_MODIFIER_DESC_nd_alm_tinmel_zeal: "Les adeptes du Mahdi descendent de l'Atlas avec la ferveur de la révélation. De nouvelles recrues affluent vers la cause, entraînées par les Mu'minun à la dure discipline du credo almohade."
 STATIC_MODIFIER_NAME_nd_alm_tinmel_consolidation: "Consolidation du mouvement"
 STATIC_MODIFIER_DESC_nd_alm_tinmel_consolidation: "Plutôt que de presser le moment, le calife s’enracine : le conseil des cinquante est officialisé, les tribus berbères sont classées et la nouvelle orthodoxie tranquillement ancrée dans l’administration."
 STATIC_MODIFIER_NAME_nd_alm_andalusi_legions: "Légions andalouses"
 STATIC_MODIFIER_DESC_nd_alm_andalusi_legions: "Piqué par la défaite lors de la grande bataille, le calife appelle tous les hommes capables de traverser le détroit. L'infanterie andalouse fraîche et la junde berbère affluent une fois de plus sur le terrain ibérique, le moral du royaume se forgeant à nouveau dans la vengeance."
 STATIC_MODIFIER_NAME_nd_alm_african_retreat: "Bastion Africain"
 STATIC_MODIFIER_DESC_nd_alm_african_retreat: "Le calife se retire à Marrakech et refortifie le Maghreb. Si al-Andalus doit être perdu, alors au moins le cœur africain tiendra le coup ; les revenus remontent et les garnisons grossissent."

 STATIC_MODIFIER_NAME_nd_alm_aristotelian_court: "Cour du commentateur"
 STATIC_MODIFIER_DESC_nd_alm_aristotelian_court: "Les commentaires d'Ibn Rushd sont lus à la cour même du calife ; Les philosophes juifs, chrétiens et musulmans parlent sur un pied d’égalité en matière de métaphysique. Marrakech devient le phare de la falsafa, attirant des érudits de Tolède à Bagdad."
 STATIC_MODIFIER_NAME_nd_alm_orthodox_purge: "L'Orthodoxie triomphante"
 STATIC_MODIFIER_DESC_nd_alm_orthodox_purge: "Ibn Rushd est exilé, ses livres brûlés au souk de Cordoue. Les prédicateurs du Califat marchent derrière une doctrine purifiée ; la conversion des peuples assujettis s'accélère, l'unité de la oumma est réaffirmée."

 STATIC_MODIFIER_NAME_nd_alm_ribat_al_fath: "Ribat al-Fath"
 STATIC_MODIFIER_DESC_nd_alm_ribat_al_fath: "Yaqub al-Mansur fonde sa vaste nouvelle capitale à l'embouchure du Bou Regreg : une ville fortifiée de conquête, surmontée de la tour Hassan. Les équipes de construction travaillent à une vitesse impériale à travers le royaume."
 STATIC_MODIFIER_NAME_nd_alm_marrakesh_glory: "Gloire de Marrakech"
 STATIC_MODIFIER_DESC_nd_alm_marrakesh_glory: "Plutôt que de reconstruire, le calife orne la capitale existante. La Koutoubia est finie avec une élégance de joyau, les portes de la ville reconstruites et le nom almohade pèse de Séville au Caire."

 # === Formation Event ===
 nd_alm.1.t: "Les Mu'minun sont souverains"
 nd_alm.1.d: "From the cliff-walled madrasa at Tinmel, where Ibn Tumart preached that there is one God and one umma, your soldiers have descended to break the murabit veil and topple the Almoravids. Marrakesh has fallen; the green-and-white Almohad standards fly above the kasbahs of the Maghreb. From here, the question of what your Caliphate is to be can no longer be deferred.\n\nWill you remain the Mahdi's avenging army, the Mu'minun who unite the umma by sword and sermon and brook no compromise? Or will you become a civilization in your own right, drawing the philosophers and scholars of al-Andalus into a court where Aristotle is read and Maimonides writes?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_alm.1.a: "Nous sommes l'armée du Mahdi : la oumma sera une"
 nd_alm.1.b: "Marrakech sera la nouvelle Cordoue : une cour de philosophes"

 # === DHE Events ===
 nd_alm.2.t: "La mosquée de Tinmel"
 nd_alm.2.d: "Haut dans la vallée du Sus, sur la selle où Ibn Tumart rassembla pour la première fois les tribus Masmuda et proclama la Mahdiyya, Abd al-Mu'min a fait construire la grande mosquée de Tinmel. Ses murs abritent le tombeau du fondateur. Les pèlerins qui y viennent ne sont pas des fidèles ordinaires : ils sont les recrues d'un mouvement inachevé et ils se demandent si le moment révolutionnaire doit être soutenu ou apaisé. Le Conseil des Cinquante attend la parole du calife."
 nd_alm.2.a: "Soutenir la révolution : l’épée n’est pas encore finie"
 nd_alm.2.b: "Consolider le mouvement : il faut poser les bases"

 nd_alm.3.t: "Las Navas de Tolosa"
 nd_alm.3.d: "Sur la haute meseta de Tolosa, les armées combinées de Castille, d'Aragon et de Navarre ont vaincu l'armée califale. Le calife al-Nasir s'enfuit vers le sud à travers la Sierra Morena ; les tentes du camp et les étendards verts sont dispersés. Le noyau même de la défense andalouse est creusé. Depuis Marrakech, la question est aiguë : devons-nous traverser à nouveau le détroit avec tout ce que nous avons, ou devons-nous nous retrancher en Afrique et laisser al-Andalus se débrouiller seul ?"
 nd_alm.3.a: "Traversez à nouveau : tous les hommes et toutes les épées vers Iberia"
 nd_alm.3.b: "Retrait vers le sud : le cœur africain ne sera pas perdu"

 nd_alm.4.t: "Ibn Rushd de Cordoue"
 nd_alm.4.d: "Abu al-Walid Muhammad ibn Rushd, cadi de Cordoue et médecin du calife, a achevé son Long commentaire sur la métaphysique d'Aristote. Au Caire, à Tolède et à Paris, son nom est prononcé avec admiration. A votre cour, le philosophe juif Maïmonide vient de terminer le Guide des égarés. Les fuqaha de Marrakech ne sont pas contentes : elles parlent des philosophes comme d'infiltrés étrangers et réclament un retour au credo pur d'Ibn Tumart."
 nd_alm.4.a: "Défendre les philosophes : le Califat doit diriger en pensée"
 nd_alm.4.b: "Brûlez les livres : l’orthodoxie ne doit pas être diluée"

 nd_alm.5.t: "La Tour Hassan"
 nd_alm.5.d: "Sur la falaise au-dessus du Bou Regreg, où Abd al-Mu'min élevait autrefois une kasbah, le calife Yaqub al-Mansur commande une vaste nouvelle capitale : Ribat al-Fath, la forteresse de la victoire. Sa pièce maîtresse sera une mosquée plus grande que toutes celles des pays occidentaux, avec un minaret qui éclipserait la Koutoubia. Les maçons extraient le grès par milliers et le trésor impérial saigne. Certains courtisans appellent à la modération : mieux vaut achever la Koutoubia et embellir les villes que nous avons, que de construire une nouvelle métropole dont nous n'aurons peut-être pas besoin."
 nd_alm.5.a: "Construire Ribat al-Fath : le Califat mérite une capitale de conquête"
 nd_alm.5.b: "Orner les villes existantes : la gloire appartient à Marrakech"

 # === Advances ===
 nd_alm_tinmel_foundation: "La Fondation Tinmel"
 nd_alm_tinmel_foundation_desc: "La madrasa de montagne d'Ibn Tumart à Tinmel, dans la vallée du Sus du Haut Atlas, fut le berceau du mouvement almohade. Ici, il proclama le Mahdiyya, enseigna la doctrine de l'unité divine (tawhid) et rassembla les tribus Masmuda qui allaient devenir l'armée d'Abd al-Mu'min."
 nd_alm_masmuda_infantry: "Infanterie Masmuda"
 nd_alm_masmuda_infantry_desc: "Contrairement aux Almoravides qui s'appuyaient sur la cavalerie chamelière saharienne, l'armée almohade était construite autour des formations d'infanterie denses des Berbères semi-nomades Masmuda du Haut Atlas : lanciers et lanceurs de javelots organisés par hiérarchie tribale."
 nd_alm_zenata_horsemen: "Cavaliers Zenata"
 nd_alm_zenata_horsemen_desc: "Les Berbères Zenata des hauts plateaux fournissaient la cavalerie légère des armées maghrébines : tirailleurs et lanciers qui combattaient avec la tactique d'attaque et de feinte de retraite karr wa farr, montés sur le rapide cheval nord-africain."
 nd_alm_kasbah_tradition: "Tradition de la Kasbah"
 nd_alm_kasbah_tradition_desc: "Les gouverneurs almohades dirigeaient leurs villes depuis la kasbah, une citadelle fortifiée s'élevant au-dessus de la médina avec ses propres murs, portes, greniers et casernes. Marrakech, Fès, Séville et Rabat ont toutes reçu des kasbahs almohades."
 nd_alm_council_of_ten: "Conseil des Dix"
 nd_alm_council_of_ten_desc: "L'État almohade était gouverné par une hiérarchie de conseils descendant du calife : l'Ahl al-dar (Conseil des Dix) composé de proches parents et de cheikhs de confiance, puis le Conseil des Cinquante, et en dessous les assemblées des tribus Masmuda. Ce gouvernement de conseil stratifié liait étroitement le régime à sa base berbère."

 nd_alm_minaret_tradition: "Tradition du minaret almohade"
 nd_alm_minaret_tradition_desc: "Le minaret carré en grès de la Koutoubia à Marrakech, copié sur la tour Hassan à Rabat et la Giralda à Séville, est devenu la signature de l'architecture religieuse almohade : monumentale, austère et visible sur la moitié du royaume."
 nd_alm_falsafa: "Falsafa"
 nd_alm_falsafa_desc: "Les califes almohades, Abu Yaqub Yusuf et Yaqub al-Mansur notamment, rassemblèrent autour d'eux les philosophes d'al-Andalus : Ibn Tufayl, Ibn Rushd (Averroès) et le penseur juif Maïmonide. Leur cour de Marrakech est devenue le point culminant du commentaire aristotélicien médiéval."
 nd_alm_andalusi_crossbow: "Arbalétriers andalous"
 nd_alm_andalusi_crossbow_desc: "Les villes d'al-Andalus fournissaient au Califat son infanterie lance-missiles : des citadins entraînés à l'arbalète à pied, descendants de la tradition cordouane, qui complétaient la lance berbère par le carreau à pointe d'acier."
 nd_alm_caravan_economy: "Caravane Économie"
 nd_alm_caravan_economy_desc: "Sijilmasa et Wadan se trouvaient à l’extrémité désertique du commerce transsaharien. Les gouverneurs almohades construisirent des funduqs dans les villes, organisèrent des routes caravanières et taxèrent le trafic de l'or et du sel qui reliait le Sahel à la Méditerranée."
 nd_alm_maliki_revival: "La renaissance de Maliki"
 nd_alm_maliki_revival_desc: "Bien qu'Ibn Tumart et les premiers califes aient persécuté la fuqaha Maliki et brûlé des copies de la Muwatta, sous le règne d'al-Mansur, l'école plus ancienne s'était tranquillement réaffirmée. Le fiqh des cadis revient au précédent malékite, ancrant le régime dans la jurisprudence héritée du Maghreb."

 nd_alm_jihad_andalus: "Jihad en al-Andalus"
 nd_alm_jihad_andalus_desc: "Chaque calife traverse tour à tour le détroit à la tête d'une grande armée pour mener le jihad contre les royaumes chrétiens : à Alarcos en 1195, Yaqub al-Mansur fait voler en éclats la Castille, et les étendards verts et blancs s'étendent jusqu'à Tolède. Les campagnes almohades ont servi de modèle à la longue guerre ibérique."
 nd_alm_christian_mercenaries: "Brigades de mercenaires chrétiens"
 nd_alm_christian_mercenaries_desc: "À la fin du XIIe siècle, les Almohades, comme les rois taifas andalous avant eux, avaient commencé à recruter des mercenaires chrétiens ibériques par milliers : des chevaliers castillans servant dans la garde du calife, des fantassins normands en garnison dans les villes de province, payés en argent et dotés de maisons à Marrakech."
 nd_alm_ribat_tradition: "Tradition du Ribat"
 nd_alm_ribat_tradition_desc: "Le ribat était un monastère frontalier fortifié où des laïcs volontaires effectuaient leur service militaire parallèlement à leurs dévotions. Répartis le long de la côte, de Salé à Sus jusqu'à Sfax, les ribats formaient les murabitun : de pieux frontaliers qui répondaient à l'appel du calife."
 nd_alm_marrakeshi_metalwork: "Travail du métal à Marrakech"
 nd_alm_marrakeshi_metalwork_desc: "Les forges de la capitale almohade armaient à la fois le jund berbère et l'infanterie andalouse, avec de l'acier de style damascène en fer ibérique et des cimeterres en laiton copiés des terres orientales. Les armureries califales établissent la norme pour la Méditerranée occidentale."
 nd_alm_maghrebi_astronomy: "Astronomie maghrébine"
 nd_alm_maghrebi_astronomy_desc: "Les astronomes andalous Ibn Tufayl, al-Bitruji et Jabir ibn Aflah travaillèrent à la cour almohade, peaufinant le système ptolémaïque, construisant des observatoires et produisant les tables astronomiques qui alimenteraient plus tard Tolède et Paris."

 nd_alm_monumental_caliphate: "Le califat monumental"
 nd_alm_monumental_caliphate_desc: "Yaqub al-Mansur a fait de l’architecture monumentale un instrument de légitimité. Ribat al-Fath, la tour Hassan, la grande mosquée de Séville avec sa Giralda, la Koutoubia de Marrakech : à travers tout le califat, le nom almohade s'est élevé dans la pierre, austère et immense."
 nd_alm_andalusi_silk: "Tissage De Soie Andalouse"
 nd_alm_andalusi_silk_desc: "D'Almeria à Grenade, les ateliers de soierie d'al-Andalus, héritiers de la tradition cordouane, tissaient les plus beaux textiles de la Méditerranée occidentale. Les ateliers de tiraz du calife produisaient les robes brodées d'État portées de Marrakech au Caire."
 nd_alm_sufi_brotherhoods: "Confréries soufies"
 nd_alm_sufi_brotherhoods_desc: "Partant des zawiyas du Maghreb, les ordres soufis populaires, parmi lesquels les Shadhili et les Qadiri, ont pris racine aussi bien dans les villes que dans les villages. Leurs saints (awliya) et leurs généalogies spirituelles liaient les peuples périphériques à la culture islamique urbaine et assimilaient les nouveaux venus à l'orthodoxie califale."
 nd_alm_caliphal_arsenals: "Arsenaux califaux"
 nd_alm_caliphal_arsenals_desc: "Les arsenaux impériaux de Marrakech, Fès et Séville fournissaient les forces permanentes du calife : cavalerie jund, infanterie andalouse et garde du corps impériale. L’armement centralisé a permis de déployer les plus grandes armées du monde islamique occidental."
 nd_alm_saharan_gold: "L'or transsaharien"
 nd_alm_saharan_gold_desc: "L'or du Wadi Sus et le sel de Taghaza transitaient par les douanes almohades pour se rendre sur les marchés méditerranéens. Les recettes fiscales du califat ont augmenté proportionnellement au flux transsaharien."

 nd_alm_sharifian_legitimacy: "Légitimité chérifienne"
 nd_alm_sharifian_legitimacy_desc: "Les descendants des califes almohades et des dynasties maghrébines ultérieures revendiquaient une descendance chérifienne du Prophète, conférant à leur règne une légitimité indépendante du califat abbasside ou de toute autorité extérieure."
 nd_alm_maghrebi_corsairs: "Corsaires maghrébins"
 nd_alm_maghrebi_corsairs_desc: "De Salé à Tétouan en passant par Alger, les ports corsaires du Maghreb envoyaient des xébecs et des galions rapides dans la Méditerranée occidentale et dans l'Atlantique, attaquant les navires européens et ramenant des esclaves et de l'argent au califat."
 nd_alm_kharaj_reform: "Réforme Kharaj"
 nd_alm_kharaj_reform_desc: "La fiscalité foncière réformée distinguait le kharaj sur les domaines conquis des dîmes ushr sur les propriétés musulmanes, régularisant ainsi les bases fiscales du califat et stabilisant les revenus dans les zones rurales."
 nd_alm_mobile_court: "La Mahalla"
 nd_alm_mobile_court_desc: "Le calife gouvernait à partir d'un campement mobile, la mahalla, qui se déplaçait entre Marrakech, Fès et les provinces. Cette domination itinérante a tenu sous contrôle les tribus rebelles et a réaffirmé l'autorité centrale par sa présence directe."

 nd_alm_modernization: "Modernisation califale"
 nd_alm_modernization_desc: "Suivant l'exemple du nizam-i-cedid ottoman et des réformes égyptiennes de Muhammad Ali, les officiers du califat formèrent l'infanterie régulière à la manière européenne, important des instructeurs et des mousquets modernes pour faire face à la nouvelle ère de la guerre."
 nd_alm_anti_colonial_resistance: "Résistance anticoloniale"
 nd_alm_anti_colonial_resistance_desc: "Là où Alger est tombée et Tunis est devenue un protectorat, le califat s'est opposé à l'empiétement européen : jeux diplomatiques devant les tribunaux européens, fourniture de forces irrégulières dans l'arrière-pays et doctrine selon laquelle le Maghreb n'était pas à vendre."
 nd_alm_industrial_revival: "Reprise industrielle"
 nd_alm_industrial_revival_desc: "Les arsenaux modernes de Casablanca, les chantiers navals de Salé et les manuels scolaires imprimés de Fès témoignent de l'adoption tardive par le califat de la technique industrielle, une tentative de rencontrer les puissances européennes en tant que pairs plutôt qu'en tant que sujet."
 nd_alm_maghrebi_press: "Imprimerie maghrébine"
 nd_alm_maghrebi_press_desc: "Tardives mais déterminées, les imprimeries arabes de Fès et de Marrakech produisent des manuels scolaires, des gazettes et des ouvrages européens traduits. La culture de l’imprimé pénètre les classes urbaines alphabétisées et remodèle la sphère publique."

 # === Buildings ===
 nd_alm_kasbah_citadel: "Kasbah almohade"
 nd_alm_kasbah_citadel_desc: "Une citadelle fortifiée construite au sommet de la ville, avec ses propres murs, grenier, caserne et palais du gouverneur. La kasbah almohade projette l’autorité impériale dans chaque ville maghrébine."
 nd_alm_almohad_minaret: "Minaret almohade"
 nd_alm_almohad_minaret_desc: "Un vaste minaret carré de style almohade, en grès taillé avec panneaux de sebka et balcon cintré : modèle de la Koutoubia, de la tour Hassan et de la Giralda."
 nd_alm_house_of_wisdom: "Maison de la Sagesse"
 nd_alm_house_of_wisdom_desc: "Une institution savante combinant madrasa, bibliothèque et bureau de traduction. Les philosophes andalous, les médecins juifs et les astronomes maghrébins servent tous sous le patronage du calife."
 nd_alm_funduq_quarter: "Quartier Funduq"
 nd_alm_funduq_quarter_desc: "Un quartier urbain de caravansérails, d'entrepôts et de maisons de marchands où aboutissent les caravanes transsahariennes et où débarquent les navires méditerranéens. Le funduq est le moteur de la richesse urbaine maghrébine."
 nd_alm_coastal_ribat: "Ribat côtier"
 nd_alm_coastal_ribat_desc: "Un monastère frontalier fortifié sur la côte, où des laïcs volontaires effectuent leur service militaire parallèlement à leurs dévotions. Les ribats bordent les rivages atlantiques et méditerranéens de Salé à Sfax."
 nd_alm_caliphal_armoury: "Armurerie califale"
 nd_alm_caliphal_armoury_desc: "Atelier d'armement impérial produisant des armes pour le jund et l'infanterie andalouse, doté de forges, de fonderies et du corps d'armuriers rattaché aux forces permanentes du calife."
 nd_alm_andalusi_silk_workshop: "Atelier de Soie Andalouse"
 nd_alm_andalusi_silk_workshop_desc: "Un atelier de tiraz dans la tradition al-Andalus, tissant les plus beaux brocarts et robes brodées d'État, exportés d'Almeria et de Grenade vers toutes les cours de la Méditerranée."
 nd_alm_caliphal_academy: "Académie califale"
 nd_alm_caliphal_academy_desc: "Une académie militaire et scientifique moderne sur le modèle ottoman nizam-i-cedid, enseignant l'artillerie, la fortification, la géométrie et les langues modernes à une nouvelle génération d'officiers et de bureaucrates."
 nd_alm_diwan_al_jund: "Mustering Ribat"
 nd_alm_diwan_al_jund_desc: "A walled camp with barracks, a parade ground and a pay office, where the Caliph's standing army gathers and is counted and paid before it marches. Its model is Ribat al-Fath, the camp Abd al-Mu'min founded in 1150 at the mouth of the Bou Regreg for the armies crossing to al-Andalus. The city of Rabat grew out of it."
 nd_alm_diwan_upkeep: "Camp Upkeep"
 nd_alm_diwan_upkeep_desc: "Solde et provisions pour les soldats permanents, armes des armureries et rations des régiments."

 # === Production Methods ===
 nd_alm_kasbah_upkeep: "Entretien de la Kasbah"
 nd_alm_kasbah_upkeep_desc: "Murs de pierre, armes et provisions quotidiennes de la garnison califale."
 nd_alm_minaret_upkeep: "Entretien du minaret"
 nd_alm_minaret_upkeep_desc: "Maçonnerie, mortier de chaux et bougies de cire qui éclairent la salle de prière."
 nd_alm_house_of_wisdom_upkeep: "Entretien de la Maison de la Sagesse"
 nd_alm_house_of_wisdom_upkeep_desc: "Papier de Fès et Jativa, livres reliés en cuir repoussé et besoins modestes des érudits résidents."
 nd_alm_funduq_upkeep: "Entretien de Funduq"
 nd_alm_funduq_upkeep_desc: "Fourrage, nourriture et stockage pour les caravanes des marchands et leurs bêtes de somme."
 nd_alm_ribat_upkeep: "Entretien du Ribat"
 nd_alm_ribat_upkeep_desc: "Maçonnerie pour les murs, armes pour le murabitun et fournitures navales pour le belvédère côtier."
 nd_alm_armoury_upkeep: "Entretien de l'armurerie"
 nd_alm_armoury_upkeep_desc: "Le fer, le charbon de bois et l'équipement des outilleurs qui font fonctionner les forges."
 nd_alm_armoury_workshop: "Atelier d'armurerie califale"
 nd_alm_armoury_workshop_desc: "Le fer et le charbon entrent dans la composition des armes à pointe d'acier de la Jund et de l'infanterie andalouse."
 nd_alm_silk_workshop_upkeep: "Entretien de l'atelier de soie"
 nd_alm_silk_workshop_upkeep_desc: "Métiers à tisser, teintures et comptabilité du surveillant tiraz."
 nd_alm_andalusi_tiraz: "Andalousie Tiraz"
 nd_alm_andalusi_tiraz_desc: "Robes brodées de soie d'État et brocart tissées dans la tradition al-Andalus pour être exportées vers toutes les cours méditerranéennes."
 nd_alm_academy_upkeep: "Entretien de l'Académie"
 nd_alm_academy_upkeep_desc: "Livres importés, papier pour les cahiers des cadets et armes d'essai du chantier d'artillerie."

 # === Units ===
 a_nd_alm_masmuda_spearmen: "Lanciers Masmuda"
 a_nd_alm_masmuda_spearmen_desc: "Infanterie lourde levée auprès des Berbères semi-nomades du Haut Atlas, organisée par hiérarchie tribale et combattant en formations denses."
 a_nd_alm_zenata_lancers: "Lanciers Zenata"
 a_nd_alm_zenata_lancers_desc: "Cavalerie légère du plateau maghrébin, maître de la tactique karr wa farr de charge et de feinte de retraite."
 a_nd_alm_andalusi_crossbowmen: "Arbalétriers andalous"
 a_nd_alm_andalusi_crossbowmen_desc: "Milice urbaine d'Al-Andalus entraînée à l'arbalète à pied, fournissant l'infanterie lance-missiles du Califat aux côtés de la lance berbère."
 a_nd_alm_christian_militia: "Milice mercenaire chrétienne"
 a_nd_alm_christian_militia_desc: "Mercenaires chrétiens ibériques engagés en régiments par le défunt califat, payés en argent et cantonnés à Marrakech : chevaliers castillans, fantassins normands et aventuriers des Pyrénées."
 n_nd_alm_corsair_xebec: "Corsaire Xébec"
 n_nd_alm_corsair_xebec_desc: "Une galère maghrébine rapide avec une rame combinée à une voile latine, attaquant les navires européens de Salé à Alger et traversant le détroit de Gibraltar."

 # === Levies ===
 levy_nd_alm_masmuda_spearmen: "Prélèvement Masmuda"
 levy_nd_alm_masmuda_spearmen_desc: "Infanterie tribale berbère du Haut Atlas."
 levy_nd_alm_zenata_lancers: "Prélèvement de cavalerie Zenata"
 levy_nd_alm_zenata_lancers_desc: "Cavalerie légère de la noblesse berbère Zenata."
 levy_nd_alm_andalusi_crossbowmen: "Prélèvement sur l'arbalète andalouse"
 levy_nd_alm_andalusi_crossbowmen_desc: "Milice urbaine d'arbalètes des villes d'al-Andalus."

 # === Destiny Tree ===

 # --- Destiny advance names and descriptions ---
 nd_alm_destiny: "Destin du Califat"
 nd_alm_destiny_desc: "Le choix fait à Marrakech fixe le cap à long terme du royaume. Que ce soit par l’épée de Tinmel ou par les bibliothèques d’al-Andalus, le projet almohade doit désormais être mené à son terme."

 nd_alm_dest_strait: "Traverser le détroit"
 nd_alm_dest_strait_desc: "L’armée mahdiste traverse en force le détroit de Gibraltar. Les premiers prix sont le Levante et la Meseta centrale : Valence et Tolède. Chaque soldat envoyé à travers le détroit est une épée de plus pour la Oumma."

 nd_alm_dest_western_march: "La marche occidentale"
 nd_alm_dest_western_march_desc: "La côte atlantique vous attire. Poussez les étendards vert et blanc à travers Coimbra jusqu'à l'embouchure du Tage, prenant Lisbonne et la côte portugaise pour le Califat."

 nd_alm_dest_reconquista_reversed: "Reconquista inversée"
 nd_alm_dest_reconquista_reversed_desc: "From Pamplona to Barcelona by way of Zaragoza, the last Christian kingdoms of Iberia are broken or absorbed, and Seville, where the Almohads raised their great minaret, is rebuilt to twice its size as the Caliph's seat in al-Andalus. The umma is restored to Visigothic Spain. Ribat al-Fath rules from sea to sea."

 nd_alm_dest_salt_road: "La route du sel"
 nd_alm_dest_salt_road_desc: "Au sud du Sahara, les caravanes de sel et d'or attendent aux puits désertiques de Wadan et Walata. Plantez la bannière du calife sur les oasis de l'Adrar, et le commerce transsaharien rentrera dans les coffres de Marrakech."

 nd_alm_dest_bilad_al_sudan: "Bilad al-Soudan"
 nd_alm_dest_bilad_al_sudan_desc: "Au-delà du désert s'étend le Pays des Noirs : Tombouctou des bibliothèques, Djenné de la mosquée en briques crues. Avec un système bancaire adopté et un trésor que le monde envie, le califat relie les villes fluviales au Maghreb."

 nd_alm_dest_two_shores: "Les deux rives"
 nd_alm_dest_two_shores_desc: "Niani submits, gold flows up through the capital market, and the Caliphate stands as the great economic power between the Mediterranean and the Niger. Marrakesh, grown to twice its size, is the new Cordoba and the new Cairo at once."

 # --- Destiny event titles, descriptions, and option text ---
 nd_alm.6.t: "Le long parcours"
 nd_alm.6.d: "Le choix fait le jour de la formation s’est répercuté sur tout le royaume. Les courriers roulent vers le sud jusqu'au Sus, vers le nord jusqu'au détroit, vers l'est jusqu'à Tunis : le califat s'est installé sur sa route, et la prochaine génération de vizirs saura ce qu'on leur demande. Le destin du califat almohade se dessine."
 nd_alm.6.a: "Que notre cause prospère"

 nd_alm.7.t: "L'épée traverse le détroit"
 nd_alm.7.d: "L'armée mahdiste a traversé en force le détroit de Gibraltar, et le Levante et la Meseta centrale sont entre vos mains. Valence est prise ; les portes de Tolède s'ouvrent aux étendards vert et blanc. Les royaumes chrétiens sont sous le choc. Les prédicateurs du calife devancent l'armée, déclarant la restauration de l'islam sur les terres autrefois volées par les Wisigoths."
 nd_alm.7.a: "En avant : la Oumma est restaurée"

 nd_alm.8.t: "La côte atlantique"
 nd_alm.8.d: "Coimbra est tombée et Lisbonne s'agenouille sous les petits cousins ​​de la Tour Hassan. La côte atlantique est à vous, du Sus au Douro. Maintenant, la question est de savoir comment conserver ce qui a été gagné : par des raids en colonne et des campagnes continues, en durcissant l'armée pour la prochaine poussée ? Ou en colonisant les nouvelles terres avec des colons berbères et des cadis andalous, pour enraciner la conquête dans un gouvernement stable ?"
 nd_alm.8.a: "Marchez : la campagne ne doit pas se ralentir"
 nd_alm.8.b: "Régler la conquête : amener les cadis et les colons"

 nd_alm.9.t: "Le califat restauré"
 nd_alm.9.d: "De Pampelune à Barcelone, les dernières têtes chrétiennes couronnées se sont soumises, ont fui ou sont tombées. Le royaume wisigoth est défait ; le Califat s'étend des Pyrénées au Niger. Les courtisans débattent désormais du sens du moment : le calife est-il le marteau universel de l’incrédulité, qui s’enfoncera jusqu’aux Pyrénées et au-delà ? Ou bien la frontière naturelle a-t-elle été atteinte, et est-il temps de fortifier la ligne et de la consolider ?"
 nd_alm.9.a: "Nous sommes le califat universel de l’Occident"
 nd_alm.9.b: "Les Pyrénées sont la frontière ; nous tenons la ligne"

 nd_alm.10.t: "Puits de Wadan"
 nd_alm.10.d: "Les puits de Wadan et Walata sont désormais aux mains des Almohades. Les dalles de sel de Taghaza, la poussière d'or du Wadi Sus, les récoltes de dattes de l'Adrar : tout coule vers Marrakech. Les routes du désert ont un maître, et les douanes du calife saignent l'argent de chaque caravane qui passe."
 nd_alm.10.a: "Marrakech s'enrichit du désert"

 nd_alm.11.t: "La rivière de l'or noir"
 nd_alm.11.d: "Tombouctou et Djenné, les villes fluviales du Niger, sont entrées dans l'orbite du califat. Leurs érudits copient le fiqh Maliki à partir d'exemplaires andalous ; leur poussière d'or remonte la route du sel jusqu'à Sijilmasa. La question de savoir comment gouverner ce nouveau royaume divise le diwan : gouverner à la légère par l’intermédiaire d’émirs indigènes, en tirant parti du prestige local ? Ou bien ramener le commerce à Marrakech et laisser les banquiers de la capitale encaisser les bénéfices ?"
 nd_alm.11.a: "Gouverner par des émirs indigènes : le calife comme suzerain"
 nd_alm.11.b: "Centraliser le commerce : Marrakech est la banque du Sahel"

 nd_alm.12.t: "Le Califat des Deux Rives"
 nd_alm.12.d: "Niani s’est soumis, l’or circule sur le marché des capitaux et le Califat est un carrefour de richesses transsahariennes et méditerranéennes sans égal. Le diwan débat du prochain grand projet : le royaume doit-il se tourner vers la mer, en construisant des flottes pour projeter la puissance almohade à travers la Méditerranée ? Ou bien Marrakech deviendra-t-elle véritablement la nouvelle Cordoue, une cosmopole de la philosophie andalouse et de l’érudition soudanaise ?"
 nd_alm.12.a: "Construisez la flotte impériale : commandez la mer occidentale"
 nd_alm.12.b: "Faire de Marrakech la cosmopole de deux continents"

 # --- Destiny timed modifier names and descriptions ---
 STATIC_MODIFIER_NAME_nd_alm_dest_atlantic_jihad: "Jihad atlantique"
 STATIC_MODIFIER_DESC_nd_alm_dest_atlantic_jihad: "L'armée mène une campagne continue le long de la côte atlantique. Le butin est abondant, les trains de ravitaillement circulent en masse et les renforts se déplacent facilement ; mais les dépenses de guerre constantes alimentent l’inflation dans les villes."
 STATIC_MODIFIER_NAME_nd_alm_dest_levantine_settlement: "Règlement du Levante"
 STATIC_MODIFIER_DESC_nd_alm_dest_levantine_settlement: "Les colons berbères et les cadis andalous sont installés à travers les terres conquises. Les cultures s’intègrent, le séparatisme tombe et le royaume devient durablement pluriel."

 STATIC_MODIFIER_NAME_nd_alm_dest_caliphate_of_the_west: "Califat de l'Occident"
 STATIC_MODIFIER_DESC_nd_alm_dest_caliphate_of_the_west: "Le calife revendique une autorité universelle sur la Oumma occidentale. De nouveaux casus belli mûrissent rapidement, les résultats de la guerre penchent favorablement et les négociations de paix se plient à la volonté impériale. Mais les habitants du royaume se lassent des campagnes sans fin."
 STATIC_MODIFIER_NAME_nd_alm_dest_pyrenean_frontier: "La frontière pyrénéenne"
 STATIC_MODIFIER_DESC_nd_alm_dest_pyrenean_frontier: "Les Pyrénées deviennent le limes du Califat. Les auxiliaires tiennent les laissez-passer, les listes de rassemblement s'engraissent et l'état religieux se durcit ; le Calife ne choisit pas de combattre au-delà de la frontière naturelle."

 STATIC_MODIFIER_NAME_nd_alm_dest_sudani_emirates: "Émirats soudanais"
 STATIC_MODIFIER_DESC_nd_alm_dest_sudani_emirates: "Les émirs autochtones gouvernent le Sahel sous la suzeraineté califale. Les sujets sont fidèles, les relations diplomatiques se multiplient et la bonne volonté se propage du Niger à l'Atlas."
 STATIC_MODIFIER_NAME_nd_alm_dest_bankers_of_marrakesh: "Banquiers de Marrakech"
 STATIC_MODIFIER_DESC_nd_alm_dest_bankers_of_marrakesh: "La capitale devient le grand centre d'échange du commerce occidental. Les commerçants sont subventionnés, les coûts de construction allégés grâce à un crédit abondant et l’inflation maîtrisée ; mais le corps diplomatique est affamé car les marchands dirigent les ambassades."

 STATIC_MODIFIER_NAME_nd_alm_dest_imperial_marketplace: "Le marché impérial"
 STATIC_MODIFIER_DESC_nd_alm_dest_imperial_marketplace: "Les flottes almohades commandent la Méditerranée occidentale. Le commerce maritime est florissant, les marins affluent vers les ports corsaires et les traditions navales s'approfondissent au fil des saisons."
 STATIC_MODIFIER_NAME_nd_alm_dest_andalusi_intellect: "La cosmopole andalouse"
 STATIC_MODIFIER_DESC_nd_alm_dest_andalusi_intellect: "Marrakech devient la nouvelle Cordoue : des érudits de Tlemcen et de Tombouctou, des philosophes de Grenade et de Fès, récupèrent le royaume des marques de la guerre et tissent une discrète toile d'agents à travers la Méditerranée. Mais le califat regarde vers l’intérieur et non vers le large."

 # === Destiny Buildings ===
 nd_alm_caliphal_jihad_council: "Conseil du Jihad"
 nd_alm_caliphal_jihad_council_desc: "Un conseil de guerre impérial et un gardien, fortifié à l'intérieur de la kasbah, où sont rassemblées les légions permanentes, les garnisons frontalières payées et les campagnes interminables de l'umma occidentale dirigées."
 nd_alm_jihad_council_upkeep: "Entretien du Conseil"
 nd_alm_jihad_council_upkeep_desc: "Armes pour les légions debout, cuir pour tentes et harnais, outils pour les forgerons et remontées pour la cavalerie."

 nd_alm_caliphal_treasury: "Trésor califal"
 nd_alm_caliphal_treasury_desc: "La Monnaie impériale et le coffre-fort des lingots de Marrakech, où l'or soudanais est frappé en dinars, les soieries fines brodées du nom du calife partent pour les cours étrangères et les banquiers des deux continents rendent leurs comptes."
 nd_alm_treasury_upkeep: "Entretien de la trésorerie"
 nd_alm_treasury_upkeep_desc: "Du papier pour les livres de comptes, du tissu fin pour les robes de fonction, des meubles pour les salles de comptage des banquiers et les outils des essayeurs."

 # === Bureaucracies ===
 alm_talaba_bureaucracy: "Talaba"
 alm_talaba_bureaucracy_desc: "Le cadre almohade d'étudiants théologiques et administratifs, formés à la doctrine tawhid d'Ibn Tumart à la grande madrasa de la Kutubiyya et à la loge de Tinmel. Tirés d'abord des chefs Masmuda du Haut Atlas et plus tard de l'empire au sens large, les talaba fournissaient les cadis, les gouverneurs et les évaluateurs des impôts du premier califat. Ils ont remplacé les oulémas malékites hérités en tant que clergé institutionnel du royaume, formant une classe alphabétisée fidèle à la dynastie mu'minide plutôt qu'à la fuqaha andalouse-maghrébine de longue date dont les Almohades étaient venus réformer l'autorité."
 alm_ahl_al_jamaa_bureaucracy: "Ahl al-Jama'a"
 alm_ahl_al_jamaa_bureaucracy_desc: "Le conseil intérieur almohade, issu du Conseil original des Dix d'Ibn Tumart et du Conseil plus large des Cinquante. Il comprenait les chefs de la confédération Masmuda (Hintata, Tinmel, Ganfisa, Hargha) aux côtés de la famille dynastique Mu'minid. La Jama'a confirmait la succession, répartissait les commandements de campagne et détenait une préséance formelle sur les administrateurs civils. Cela fit de l'État almohade une confédération tribale-aristocratique en tenue califale, avec toute la vigueur et la fragilité que cela impliquait : les mêmes chefs dont les levées brisèrent les Castillans à Alarcos en 1195 abandonnèrent le royaume dans la guerre civile après Las Navas en 1212."
 alm_diwan_al_insha_bureaucracy: "Office of the 'Alama"
 alm_diwan_al_insha_bureaucracy_desc: "Every decree from Marrakesh carried the 'alama: a short phrase of praise to God set at its head in thick letters, in the Caliph's own hand or that of the one secretary trusted with it. A letter without it was only paper. The chancery wrote in rhymed prose and sent its letters to every province: the appointment of a governor, news of a victory, a ruling on doctrine. Some three hundred survive. Under secretaries like Abu Ja'far ibn 'Atiyya these letters bound the Maghreb and al-Andalus into one administration. The Hafsids, Marinids and Nasrids kept the 'alama after the Almohads were gone."
 alm_sikka_almohad_bureaucracy: "Sikka Almohade"
 alm_sikka_almohad_bureaucracy_desc: "La Monnaie impériale de Marrakech, dont le dinar d'or à flan carré - le dobla almohade - et le dirham d'argent sont devenus la monnaie la plus fiable de la Méditerranée occidentale. Les couronnes chrétiennes d'Ibérie frappaient des millares en imitation consciente, et l'or almohade circulait jusqu'aux foires de Champagne. Le prestige de la Monnaie reposait sur sa pureté, proche de 98 % d'or, et sur le contrôle strict de l'analyse par le calife ; desserrez cette emprise, et la pièce s'est dégradée dans l'inflation des derniers Mu'minides."

 AUTO_MODIFIER_NAME_nd_alm_bureaucracy_authority: "Diwans du Califat"
 AUTO_MODIFIER_DESC_nd_alm_bureaucracy_authority: "The administrative organs of the Mu'minid state (the chancery, the talaba schools, the mint, and the council of the Almohad chiefs) have matured into a permanent institutional apparatus. Marrakesh now governs the western umma not by the campaigning sword alone but through registers, decrees, and the assayed dinar. One institutional slot opens beside the one the sharia grants, so that two of the four may be kept."
