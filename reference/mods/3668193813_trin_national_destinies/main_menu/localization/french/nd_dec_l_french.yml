l_french:
 STATIC_MODIFIER_NAME_nd_dec_sword_of_the_deccan: "Épée du Deccan"
 STATIC_MODIFIER_DESC_nd_dec_sword_of_the_deccan: "Le sultanat du Deccan s'appuie sur ses diverses traditions militaires : les guerriers Habshi, les sipahi Deccani, les cavaliers turcs et les irréguliers Maratha servent ensemble sous la bannière verte. Cette armée multiethnique est la meilleure arme du sultanat."
 STATIC_MODIFIER_NAME_nd_dec_golconda_splendor: "Splendeur de Golconde"
 STATIC_MODIFIER_DESC_nd_dec_golconda_splendor: "La richesse du Deccan provient des légendaires mines de diamants de Golconde et des célèbres ateliers textiles de la région. Sous un patronage éclairé, la cour attire des érudits, des poètes et des artisans du monde islamique et au-delà."
 STATIC_MODIFIER_NAME_nd_dec_talikota_triumphant: "Triomphe à Talikota"
 STATIC_MODIFIER_DESC_nd_dec_talikota_triumphant: "Les sultanats alliés ont brisé le pouvoir de Vijayanagara sur le champ de bataille. La réputation martiale du Deccan est polie depuis une génération."
 STATIC_MODIFIER_NAME_nd_dec_vijayanagara_spoils: "Butin de Vijayanagara"
 STATIC_MODIFIER_DESC_nd_dec_vijayanagara_spoils: "Les territoires conquis par l'empire hindou déchu gonflent le trésor et étendent les domaines du sultanat. Une administration prudente transformera ces nouvelles terres en piliers de l’État."
 STATIC_MODIFIER_NAME_nd_dec_gawan_centralization: "La vision centralisatrice de Gawan"
 STATIC_MODIFIER_DESC_nd_dec_gawan_centralization: "Les réformes de Mahmud Gawan ont réduit le pouvoir des gouverneurs de province et placé les tarafs sous l'autorité centrale. L'administration du sultanat est plus efficace que jamais."
 STATIC_MODIFIER_NAME_nd_dec_gawan_commerce: "Les réseaux commerciaux de Gawan"
 STATIC_MODIFIER_DESC_nd_dec_gawan_commerce: "Les réseaux commerciaux établis par Mahmud Gawan relient le Deccan au golfe Persique, à la mer d'Oman et aux marchés d'Asie du Sud-Est. Les marchands affluent vers les ports prospères du sultanat."
 nd_dec.1.t: "Le Sultanat du Deccan"
 nd_dec.1.d: "The banner of the Deccan Sultanate rises over the plateau. From the Krishna River to the Vindhya Range, the lands of the Deccan have been unified under a single Islamic authority. The question that now faces the sultanate is one of identity: shall this be a realm forged in the traditions of the sword, drawing upon the diverse martial cultures that have long defined the Deccan (the Habshi bodyguards, the Turkic horsemen, the Deccani sipahi) or shall it be a realm that looks to the wealth beneath its soil and the brilliance of its courts, where the diamonds of Golconda and the poetry of Dakhani illuminate a new age of prosperity?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_dec.1.a: "L’épée unit ce que la diplomatie ne peut pas rassembler."
 nd_dec.1.b: "Que la lumière de Golconde brille sur le monde."
 nd_dec.2.t: "La bataille de Talikota"
 nd_dec.2.d: "Le 23 janvier 1565, les armées alliées des sultanats du Deccan (Bijapur, Ahmadnagar, Golconde et Bidar) rencontrèrent les forces de l'empire Vijayanagara au village de Rakkasa-Tangadi près de Talikota. La bataille s'avère décisive. Rama Raya, le régent vieillissant de Vijayanagara, a été capturé et décapité sur le terrain. Son armée s'est brisée et la capitale, Vijayanagara, a été saccagée et détruite au cours des mois suivants, pour ne jamais être réoccupée. La destruction de Vijayanagara a définitivement reconfiguré le paysage politique du sud de l’Inde. La question est maintenant de savoir ce que le Deccan fera de sa victoire."
 nd_dec.2.a: "Nos armes se sont révélées suprêmes. Que le monde en prenne note."
 nd_dec.2.b: "Nous absorberons ces territoires et deviendrons encore plus forts."
 nd_dec.3.t: "Les réformes de Mahmud Gawan"
 nd_dec.3.d: "Mahmud Gawan, le brillant premier ministre d'origine perse, a transformé l'administration du sultanat. Né à Gilan et attiré par le dynamisme intellectuel du Deccan, Gawan divisa le royaume en huit tarafs, standardisa le paiement des nobles, limita les gouverneurs de province à un seul fort chacun et mena des levés fonciers précis pour garantir une fiscalité équitable. Sa célèbre madrasa de Bidar (avec ses trois étages, ses carrelages élaborés et sa bibliothèque de trois mille manuscrits) constitue un monument du savoir. Mais la vision centralisatrice de Gawan menace la noblesse établie. La question est de savoir s’il doit poursuivre ses réformes ou plutôt concentrer son énergie sur l’expansion commerciale."
 nd_dec.3.a: "Pressez les réformes : l’État doit être primordial."
 nd_dec.3.b: "Développer les réseaux commerciaux : le commerce enrichit tout le monde."
 nd_dec.4.t: "Les diamants de Golconde"
 nd_dec.4.d: "Les mines autour de Golconde ont produit des diamants d'une taille et d'une qualité extraordinaires : des pierres qui seront un jour connues sous le nom de Koh-i-Noor, de Hope Diamond et de Regent Diamond trouvent toutes leur origine dans ces dépôts alluviaux le long de la rivière Krishna. Le voyageur français Jean-Baptiste Tavernier rapportera avoir vu soixante mille hommes, femmes et enfants travailler dans les seules mines de Kollur. Le commerce du diamant a fait de Golconde un synonyme de richesse, attirant des marchands de Perse, d'Arabie, de la République néerlandaise, de France et du Portugal. Les revenus de ces mines financent les armées du sultanat, son architecture et son mécénat culturel."
 nd_dec.4.a: "Les richesses de la terre sont à nous."
 nd_dec.5.t: "La floraison de Dakhani"
 nd_dec.5.d: "Un langage littéraire propre au Deccan a pris tout son sens. Dakhani (né de la fusion du persan, de l'arabe, du marathi, du kannada et du telugu) a produit des chefs-d'œuvre qui rivalisent avec les grands poètes persans. L'épopée Kadam Rao Padam Rao, composée à la cour Bahmani de Bidar, raconte son histoire dans une langue qui n'appartient pas à un seul peuple mais à tous ceux qui habitent le Deccan. Les saints soufis prêchent à Dakhani pour atteindre le peuple ; les sultans y composent des vers pour démontrer leur enracinement dans cette terre. Ibrahim Adil Shah II de Bijapur écrit son Kitab-e-Navras, le Livre des Neuf Rasas, mêlant la dévotion islamique à la théorie esthétique hindoue dans une synthèse qui ne pouvait émerger que du Deccan."
 nd_dec.5.a: "Cette langue est l'âme de notre civilisation."
 nd_dec_bahmani_foundations: "Fondations Bahmani"
 nd_dec_bahmani_foundations_desc: "Le sultanat Bahmani, créé en 1347 par Alauddin Bahman Shah, a jeté les bases de la gouvernance islamique sur le plateau du Deccan."
 nd_dec_persianate_court: "Traditions de la cour persane"
 nd_dec_persianate_court_desc: "La langue persane, ses coutumes et ses pratiques administratives façonnent la gouvernance du Deccan, attirant des universitaires et des fonctionnaires d'Iran et d'Asie centrale."
 nd_dec_habshi_warriors: "Guerriers Habshi"
 nd_dec_habshi_warriors_desc: "Les soldats d’origine africaine, les Habshis, servent de gardes d’élite et de commandants militaires de confiance, leur loyauté n’étant pas corrompue par la politique des factions locales."
 nd_dec_deccan_plateau_agriculture: "Agriculture du plateau du Deccan"
 nd_dec_deccan_plateau_agriculture_desc: "Les sols noirs de coton du Deccan soutiennent des pratiques agricoles distinctives adaptées au climat semi-aride du plateau."
 nd_dec_dakhani_origins: "Origines de Dakhani"
 nd_dec_dakhani_origins_desc: "Une nouvelle lingua franca émerge dans le Deccan : le dakhani mélange l'hindoustani avec le vocabulaire local marathi, kannada et telugu."
 nd_dec_plateau_fortification: "Fortifications du Plateau"
 nd_dec_plateau_fortification_desc: "Les collines aux sommets plats du Deccan offrent des positions défensives naturelles, fortifiées par des murs massifs et des systèmes d'eau sophistiqués."
 nd_dec_deccan_horse_trade: "Commerce de chevaux du Deccan"
 nd_dec_deccan_horse_trade_desc: "Les chevaux de guerre arabes et perses arrivent dans les ports du Deccan, soutenant les traditions de cavalerie du sultanat qui sont au cœur de sa puissance militaire."
 nd_dec_gawan_reforms: "Les réformes administratives de Gawan"
 nd_dec_gawan_reforms_desc: "Les réformes radicales de Mahmud Gawan restructurent l'État bahmani, le divisant en provinces standardisées et réduisant l'autonomie des nobles."
 nd_dec_deccani_cavalry_tradition: "Tradition de la cavalerie Deccani"
 nd_dec_deccani_cavalry_tradition_desc: "Les bargis, des raiders de cavalerie légère, frappent rapidement depuis le plateau, harcelant les lignes de ravitaillement et terrorisant les flancs des armées plus importantes."
 nd_dec_deccan_trade_web: "Réseaux commerciaux du Deccan"
 nd_dec_deccan_trade_web_desc: "Caravanserais link the inland plateau to the coastal ports, carrying cotton, diamonds, spices, and metalwork across the breadth of the Deccan."
 nd_dec_bidriware_craft: "Artisanat Bidriware"
 nd_dec_bidriware_craft_desc: "The city of Bidar gives its name to bidriware: exquisite metalwork of zinc alloy inlaid with silver wire, a craft tradition unique to the Deccan."
 nd_dec_cosmopolitan_court: "Cour cosmopolite"
 nd_dec_cosmopolitan_court_desc: "Les tribunaux du Deccan embrassent une diversité remarquable. Administrateurs hindous, érudits persans, commandants africains et guerriers turcs servent côte à côte."
 nd_dec_deccani_architecture: "Tradition architecturale Deccani"
 nd_dec_deccani_architecture_desc: "Un style architectural unique émerge dans le Deccan, mêlant dômes persans, arts décoratifs indiens et ingénierie hydraulique ingénieuse."
 nd_dec_sultanate_artillery: "Tradition de l'artillerie du Sultanat"
 nd_dec_sultanate_artillery_desc: "The Deccan sultanates invest heavily in gunpowder weapons, maintaining corps of skilled artillerists who cast their own cannons."
 nd_dec_sultanate_alliance: "Alliance du Sultanat"
 nd_dec_sultanate_alliance_desc: "Les sultanats rivaux du Deccan découvrent que leurs intérêts communs l'emportent sur leurs différences face à un ennemi commun."
 nd_dec_golconda_diamonds: "Mines de diamants de Golkonda"
 nd_dec_golconda_diamonds_desc: "Les gisements de diamants alluviaux près de Golconde sont la seule source connue de diamants au monde, produisant des pierres d'une qualité légendaire."
 nd_dec_topchi_gunners: "Artilleurs Topchi"
 nd_dec_topchi_gunners_desc: "Des unités d'artillerie spécialisées, les topchi, maîtrisent l'art de la guerre de siège avec des canons lourds importés de l'Empire ottoman et moulés localement."
 nd_dec_dakhani_literature: "L'épanouissement littéraire de Dakhani"
 nd_dec_dakhani_literature_desc: "Le dakhani ourdou devient une langue littéraire sophistiquée, produisant de la poésie, de la prose et des œuvres de dévotion qui relient les traditions islamiques et hindoues."
 nd_dec_textile_industry: "Industrie textile du Deccan"
 nd_dec_textile_industry_desc: "Cotton and silk textiles from the Deccan are prized across the Indian Ocean world, from East Africa to Southeast Asia."
 nd_dec_deccani_miniature_painting: "Peinture miniature Deccani"
 nd_dec_deccani_miniature_painting_desc: "The courts of Bijapur and Golconda develop a distinctive school of miniature painting, blending Persian, Turkish, and local Indian artistic traditions."
 nd_dec_western_coast_trade: "Commerce sur la côte ouest"
 nd_dec_western_coast_trade_desc: "Le contrôle exercé par Bijapur sur les ports côtiers occidentaux donne accès au commerce de la mer d'Oman, reliant le Deccan aux marchés du golfe Persique et au-delà."
 nd_dec_malik_ambar_legacy: "L'héritage de Malik Ambar"
 nd_dec_malik_ambar_legacy_desc: "Malik Ambar, le régent d'Ahmadnagar d'origine éthiopienne, a été le pionnier de la guérilla contre les Moghols avec une armée multiethnique de dix mille Habshis et quarante mille Deccanis."
 nd_dec_sipahi_cavalry: "Deccani Sipahi"
 nd_dec_sipahi_cavalry_desc: "La cavalerie lourde sipahi constitue le noyau blindé de la ligne de bataille du sultanat, chargeant avec sa lance et son épée pour briser les formations ennemies."
 nd_dec_adil_shahi_patronage: "Patronage d'Adil Shahi"
 nd_dec_adil_shahi_patronage_desc: "Ibrahim Adil Shah II de Bijapur a obtenu le titre de « Jagadguru », professeur du monde, pour son patronage de la musique, de la poésie et de l'harmonie religieuse entre les religions."
 nd_dec_qutb_shahi_governance: "Gouvernance de Qutb Shahi"
 nd_dec_qutb_shahi_governance_desc: "Les dirigeants Qutb Shahi de Golconde construisent un appareil administratif efficace pour gérer la richesse générée par le commerce des diamants."
 nd_dec_diamond_trade_boom: "Boom du commerce du diamant"
 nd_dec_diamond_trade_boom_desc: "La demande européenne en diamants de Golconde a grimpé en flèche, attirant les marchands néerlandais, français et portugais vers les marchés du sultanat."
 nd_dec_mughal_resistance: "Résistance aux Moghols"
 nd_dec_mughal_resistance_desc: "Les sultanats du Deccan mènent une lutte de plusieurs générations contre l'expansion moghole, utilisant le terrain, les tactiques de guérilla et la diplomatie pour préserver leur indépendance."
 nd_dec_nizam_shahi_revenue: "Système de revenus Nizam Shahi"
 nd_dec_nizam_shahi_revenue_desc: "Le règlement des revenus de Malik Ambar établit une mesure systématique des terres et une fiscalité équitable, constituant la base de l'administration du Deccan pour des générations."
 nd_dec_tofangchi_infantry: "Mousquetaires Tofangchi"
 nd_dec_tofangchi_infantry_desc: "Des mousquetaires à mèche entraînés, les tofangchi, fournissent une puissance de feu disciplinée sur le champ de bataille, complétant la cavalerie et l'artillerie du sultanat."
 nd_dec_hyderabad_administration: "Administration d'Hyderabad"
 nd_dec_hyderabad_administration_desc: "Le Nizam d’Hyderabad construit un appareil d’État sophistiqué, équilibrant la gouvernance Deccani traditionnelle avec les méthodes bureaucratiques modernes."
 nd_dec_european_military_techniques: "Techniques militaires européennes"
 nd_dec_european_military_techniques_desc: "Le contact avec les conseillers militaires européens introduit de nouvelles méthodes d'exercice, conception de fortifications et tactiques d'artillerie pour les armées du Deccan."
 nd_dec_deccani_water_engineering: "Ingénierie de l'eau Deccani"
 nd_dec_deccani_water_engineering_desc: "Les ingénieurs hydrauliques persans et locaux développent des systèmes sophistiqués d’approvisionnement en eau (aqueducs, réservoirs et canaux souterrains) qui alimentent les villes du plateau aride."
 nd_dec_nizam_diplomacy: "Le métier diplomatique de Nizam"
 nd_dec_nizam_diplomacy_desc: "Les Nizams d'Hyderabad naviguent entre les Moghols en déclin, les Marathes en plein essor et les puissances européennes envahissantes avec une habileté diplomatique consommée."
 nd_dec_deccani_trade_maturity: "Maturité commerciale Deccani"
 nd_dec_deccani_trade_maturity_desc: "Des siècles de développement commercial ont produit une infrastructure commerciale mature reliant le Deccan aux marchés mondiaux."
 nd_dec_nizam_modernization: "La modernisation de Nizam"
 nd_dec_nizam_modernization_desc: "Les derniers Nizams investissent dans l'éducation, l'imprimerie et la réforme institutionnelle, jetant les bases de l'émergence d'Hyderabad en tant que centre d'apprentissage moderne."
 nd_dec_deccani_industrial_dawn: "L'aube industrielle de Deccani"
 nd_dec_deccani_industrial_dawn_desc: "Early industrial enterprises emerge in the Deccan, processing cotton, metalwork, and armaments with increasing mechanization.\n\n#italic Available in: $nd_dec_chintz_karkhana$#!"
 nd_dec_hyderabad_state_reform: "Réforme de l'État d'Hyderabad"
 nd_dec_hyderabad_state_reform_desc: "Le gouvernement du Nizam subit une réforme systématique, créant des ministères, des tribunaux et des services fiscaux modernes."
 nd_dec_cultural_synthesis: "Ganga-Jamuni Tehzeeb"
 nd_dec_cultural_synthesis_desc: "Le Deccan réalise une synthèse culturelle remarquable, le Ganga-Jamuni Tehzeeb, où les traditions hindoues et musulmanes se mêlent dans l'art, l'architecture, la langue et la vie quotidienne."
 nd_dec_deccani_legacy: "L'héritage de Deccani"
 nd_dec_deccani_legacy_desc: "Les réalisations culturelles des sultanats du Deccan perdurent : dans l’architecture, dans la langue, dans la mémoire d’une civilisation qui a jeté un pont entre les mondes."
 nd_dec_modern_artillery_reform: "Réforme de l'artillerie moderne"
 nd_dec_modern_artillery_reform_desc: "L'armée du Nizam adopte des méthodes d'artillerie modernes, créant des fonderies et des écoles de formation pour les artilleurs."
 a_nd_dec_habshi_guard: "Garde Habshi"
 a_nd_dec_habshi_guard_desc: "Soldats d'élite d'origine africaine qui servent de garde personnelle du sultan et de commandants militaires les plus fiables. Leur loyauté ne fait aucun doute."
 a_nd_dec_bargi: "Deccani Bargi"
 a_nd_dec_bargi_desc: "Des raiders de cavalerie légère qui frappent rapidement depuis le plateau, harcelant les lignes de ravitaillement et exploitant les lacunes des formations ennemies."
 a_nd_dec_topchi: "Sultanat Topchi"
 a_nd_dec_topchi_desc: "Unités d'artillerie spécialisées formées au lancer et à l'emploi de canons de siège lourds, s'appuyant sur l'expertise ottomane et perse."
 a_nd_dec_sipahi: "Deccani Sipahi"
 a_nd_dec_sipahi_desc: "Cavalerie lourde blindée formant le noyau de choc de l'armée du sultanat, chargeant à la lance et à l'épée pour briser les lignes ennemies."
 a_nd_dec_ambar_guerrilla: "Les guérilleros d'Ambar"
 a_nd_dec_ambar_guerrilla_desc: "Des combattants irréguliers dans la tradition de Malik Ambar, maîtres des embuscades et du terrain qui harcèlent les grandes armées avec des tactiques de délit de fuite."
 a_nd_dec_tofangchi: "Deccani Tofangchi"
 a_nd_dec_tofangchi_desc: "Mousquetaires à mèche entraînés qui fournissent une puissance de feu à distance disciplinée, formant l'épine dorsale de l'infanterie de l'armée modernisée du sultanat."
 nd_dec_madrasa: "Médersa Bidar"
 nd_dec_madrasa_desc: "Un centre d'apprentissage islamique sur le modèle de la grande madrasa de Mahmud Gawan, avec sa bibliothèque à trois étages et son corps professoral renommé."
 nd_dec_madrasa_upkeep: "Matériel scientifique"
 nd_dec_madrasa_upkeep_desc: "Papier, encre et équipement nécessaires à l'entretien de la bibliothèque et des installations d'enseignement de la madrasa."
 nd_dec_darbar: "Deccani Darbar"
 nd_dec_darbar_desc: "Une grande salle d'audience où le sultan tient sa cour, recevant les nobles, les ambassadeurs étrangers et les pétitionnaires de toutes les communautés."
 nd_dec_darbar_upkeep: "Entretien des tribunaux"
 nd_dec_darbar_upkeep_desc: "Mobilier en soie, teintures et tissus fins nécessaires au maintien de la dignité de la cour royale."
 nd_dec_caravanserai: "Caravansérail Deccani"
 nd_dec_caravanserai_desc: "Une étape fortifiée sur les routes commerciales du Deccan, offrant un hébergement, un stockage et des installations de marché aux marchands et à leurs caravanes."
 nd_dec_caravanserai_upkeep: "Approvisionnement des caravanes"
 nd_dec_caravanserai_upkeep_desc: "Livestock and wheat to feed the animals and travelers passing through the caravanserai, and leather for harness and pack saddles."
 nd_dec_diamond_workshop: "Atelier de taille de diamant"
 nd_dec_diamond_workshop_desc: "Un atelier spécialisé où des maîtres lapidaires taillent et polissent les diamants bruts des mines de Golconde pour les vendre aux marchands internationaux."
 nd_dec_diamond_cutting: "Lapidaire Diamant"
 nd_dec_diamond_cutting_desc: "Des maîtres lapidaires taillent et polissent les diamants bruts des mines de Golconde pour en faire des pierres précieuses exquises destinées au commerce international de la joaillerie."
 nd_dec_qila: "Deccani Qila"
 nd_dec_qila_desc: "Une immense forteresse de plateau avec d'épais murs de pierre, des systèmes d'eau sophistiqués et une vue imprenable sur le terrain environnant."
 nd_dec_qila_upkeep: "Entretien de la forteresse"
 nd_dec_qila_upkeep_desc: "Pierre, armes et outils nécessaires à l'entretien des murs de la forteresse, des défenses et de l'équipement de la garnison."
 nd_dec_rauza: "Ibrahim Rauza"
 nd_dec_rauza_desc: "Un complexe tombeau-mosquée monumental dans le style architectural Deccani, avec des dômes élégants, une calligraphie complexe et des jardins à la française."
 nd_dec_rauza_upkeep: "Entretien des monuments"
 nd_dec_rauza_upkeep_desc: "Pierre, colorants et marbre nécessaires pour maintenir la splendeur des surfaces sculptées et des incrustations décoratives du monument."
 levy_nd_dec_ambar_guerrilla: "Prélèvement de guérilla d'Ambar"
 levy_nd_dec_ambar_guerrilla_desc: "Des combattants irréguliers issus des campagnes, dans la tradition des campagnes de guérilla de Malik Ambar."
 levy_nd_dec_bargi: "Prélèvement de cavalerie Bargi"
 levy_nd_dec_bargi_desc: "Des pillards de cavalerie légère recrutés parmi les maisons nobles Deccani musulmanes et hindoues."
 a_nd_dec_nizam_field_gun: "Canon de campagne Nizam"
 a_nd_dec_nizam_field_gun_desc: "Pièces d'artillerie modernes coulées dans les fonderies de Nizam, dirigées par des artilleurs entraînés employant des techniques de tir européennes."
 nd_dec_baoli: "Deccani Baoli"
 nd_dec_baoli_desc: "Un puits à gradins avec une architecture en pierre élaborée fournissant un approvisionnement en eau fiable aux colonies du plateau aride du Deccan."
 nd_dec_baoli_upkeep: "Entretien des puits"
 nd_dec_baoli_upkeep_desc: "Pierre, outils et bois nécessaires à l'entretien des marches, des canaux et des systèmes de distribution d'eau du baoli."
 nd_dec_revenue_office: "Bureau des recettes de Nizam"
 nd_dec_revenue_office_desc: "Un bureau gouvernemental chargé de l'arpentage, de l'évaluation des impôts et de la collecte des recettes, selon les méthodes établies par Malik Ambar."
 nd_dec_revenue_office_upkeep: "Fournitures administratives"
 nd_dec_revenue_office_upkeep_desc: "Papier, cire d'abeille pour les sceaux et matériel d'écriture pour les registres, les grands livres et la correspondance officielle de l'administration fiscale."
 nd_dec_cotton_milling_pm: "Mill-Finished Chintz"
 nd_dec_cotton_milling_pm_desc: "Cloth is calendered, printed and finished with machines and tools. Each workshop turns out far more painted cotton than the pen alone allowed."
 nd_dec_bidri_karkhana: "Bidri Karkhana"
 nd_dec_bidri_karkhana_desc: "A workshop of the craft named for Bidar. Vessels are cast in a dark alloy, inlaid with silver wire and blackened with the soil of Bidar fort. It can stand only in the country around Bidar, Gulbarga and Bijapur."
 nd_dec_bidri_inlay: "Bidri Inlay"
 nd_dec_bidri_inlay_desc: "Copper for the alloy and silver for the inlay are worked into hookah bases, ewers and boxes."
 nd_dec_topkhana: "Topkhana"
 nd_dec_topkhana_desc: "The gun foundry of the sultanate. Cannon are cast here in bell metal, as the great Malik-i-Maidan was cast at Ahmadnagar in 1549."
 nd_dec_bell_metal_casting: "Bell-Metal Casting"
 nd_dec_bell_metal_casting_desc: "Copper and tin are melted together and poured into cannon by master founders."
 nd_dec_chintz_karkhana: "Chintz Karkhana"
 nd_dec_chintz_karkhana_desc: "A workshop of kalamkari, the painted cottons of the Golconda coast, sold to Persia and to the European companies as chintz. It is built where cotton is grown."
 nd_dec_kalamkari_painting: "Kalamkari Painting"
 nd_dec_kalamkari_painting_desc: "Woven cloth is drawn with the pen, fixed with alum and dyed in madder and indigo."
 nd_dec_kitabkhana: "Kitabkhana"
 nd_dec_kitabkhana_desc: "The royal library and atelier of a Deccani court, where painters, calligraphers and binders work side by side. It is found only in cities."
 nd_dec_album_painting: "Album Painting"
 nd_dec_album_painting_desc: "Paper, pigments and leather bindings are made into illustrated manuscripts and albums of miniatures."
 nd_dec_dest_malwa_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in Malwa"
 nd_dec_formed_tt: "Deccan a été formé"
 nd_dec_path_a_tt: "Choisissez l'Épée du Deccan"
 nd_dec_path_b_tt: "Choisissez Golconda Splendor"
 nd_dec_destiny: "Ascendant Déccan"
 nd_dec_destiny_desc: "Le sultanat du Deccan a été proclamé. Consolidez le royaume et choisissez la voie qui définira le destin de la nation."
 nd_dec_dest_khandesh: "La campagne Khandesh"
 nd_dec_dest_khandesh_desc: "Saisissez les cols stratégiques de Khandesh et les riches terres de Vidarbha. Burhanpur et Amravati commandent les routes vers le centre de l'Inde."
 nd_dec_dest_malwa: "Conquête de Malwa"
 nd_dec_dest_malwa_desc: "Press north into the heart of India. Ujjain, ancient capital of Malwa, and Surat, jewel of the Gujarat coast, will anchor the sultanate's dominion over the subcontinent's interior. Half of Malwa must be held."
 nd_dec_dest_delhi: "La marche sur Delhi"
 nd_dec_dest_delhi_desc: "The ultimate prize: Delhi and Agra, the twin seats of Hindustani power. Only a truly mighty Deccan can claim the north and unite the subcontinent under the green banner, and its walls will not fall without the topchi and their siege guns."
 nd_dec_dest_trade_reach: "La route du diamant"
 nd_dec_dest_trade_reach_desc: "Étendre les réseaux commerciaux du sultanat au Gujarat. Champaner garde les routes commerciales du nord et les marchés des pierres précieuses doivent être fermement sous le contrôle de Deccani."
 nd_dec_dest_cambay: "L'Entrepôt de Cambay"
 nd_dec_dest_cambay_desc: "Khambat, Cambay pour les Européens, est la porte d'entrée de la mer d'Oman. Avec des institutions bancaires établies et un port sécurisé, le Deccan peut dominer le commerce de l’océan Indien."
 nd_dec_dest_indian_ocean: "Maître de l'Océan Indien"
 nd_dec_dest_indian_ocean_desc: "Prenez Ormuz, le point d’étranglement du commerce du golfe Persique. Avec l'adoption des institutions commerciales mondiales et le financement des diamants de Golconde, le Deccan dominera les voies maritimes les plus riches du monde."
 nd_dec.6.t: "L'Ascendant Deccan"
 nd_dec.6.d: "Le sultanat du Deccan constitue une puissance unifiée sur le grand plateau. Des Ghats occidentaux à la côte de Coromandel, le royaume s'étend sur certaines des terres les plus fertiles et les plus riches de toute l'Inde. La question de savoir quoi faire de ce pouvoir nous incombe désormais. Le chemin à parcourir est long, mais les fondations sont solides."
 nd_dec.6.a: "Le Deccan perdurera."
 nd_dec.7.t: "La campagne Khandesh"
 nd_dec.7.d: "Nos armées ont franchi les cols de Satpura et se sont emparées des villes fortifiées de Khandesh et Vidarbha. Burhanpur, avec son immense forteresse d'Asirgarh qui garde l'approche, est tombé aux mains de nos ingénieurs de siège. Amravati et les riches terres cotonnières de Berar sont à nous. La route vers l’Inde centrale est ouverte devant nous : les sultanats du Malwa et du Gujarat regardent désormais nos bannières avec appréhension."
 nd_dec.7.a: "Les laissez-passer sont à nous. L’Inde centrale attend."
 nd_dec.8.t: "La conquête de Malwa"
 nd_dec.8.d: "Ujjain, l'ancienne ville qui a servi de capitale aux empires depuis l'époque d'Ashoka, arbore notre bannière. Surate, le plus grand port de l’ouest de l’Inde, canalise les richesses du commerce de la mer d’Oman vers notre trésor. Le sultanat est passé d’un royaume de plateau à une puissance continentale. Comment consolider ces conquêtes ? Certains suggèrent que nous devons intégrer ces diverses terres dans une administration unifiée, tandis que d’autres nous exhortent à exploiter notre avantage militaire alors que nos armées sont à leur apogée."
 nd_dec.8.a: "Intégrer les terres conquises dans notre État."
 nd_dec.8.b: "Nos armées ont goûté à la victoire : allons de l’avant."
 nd_dec.9.t: "La marche sur Delhi"
 nd_dec.9.d: "Delhi est tombée. La ville qui fut le siège de tous les grands empires de l’Inde du Nord (le sultanat, les Moghols, l’idée même de la souveraineté hindoustanie) répond désormais au Deccan. Agra aussi, avec son immense fort rouge et la richesse du Doab, est à nous également. Aucun sultan Deccani n’a jamais réalisé ce que nous avons réalisé. La question est désormais profonde : revendiquons-nous la souveraineté de toute l’Inde, en nous faisant appeler Sultan de l’Hindoustan et en absorbant les traditions du Nord, ou allons-nous gouverner le Nord comme un empire typiquement Deccani, imposant nos propres traditions aux conquis ?"
 nd_dec.9.a: "Nous sommes désormais le sultan de l’Hindoustan."
 nd_dec.9.b: "Le Deccan gouverne le Nord selon ses propres conditions."
 nd_dec.10.t: "La route du diamant"
 nd_dec.10.d: "Les réseaux marchands du Deccani s’étendent désormais des mines de diamants de Golconda aux marchés du monde entier en passant par les corridors commerciaux du Gujarat. Champaner, commandant les routes menant au nord du Gujarat, a été sécurisé. Les pierres précieuses de nos mines circulent sur les marchés que nous contrôlons, et la richesse qu’elles génèrent remodèle notre économie. Les commerçants européens arrivent de plus en plus nombreux, désireux d'acheter les pierres qui orneront les couronnes des rois de Lisbonne à Moscou."
 nd_dec.10.a: "La route du diamant est à nous."
 nd_dec.11.t: "L'Entrepôt de Cambay"
 nd_dec.11.d: "Khambat, connu des Européens sous le nom de Cambay, est depuis des siècles le plus grand magasin de l'Inde occidentale. Maintenant, c'est le nôtre. Le port de la ville reçoit des navires d'Aden, d'Ormuz, de Malacca et de la côte swahili. Grâce à la création d’institutions bancaires modernes, nos commerçants peuvent financer des projets qui auraient été inimaginables il y a une génération. La question est de savoir comment exploiter cette manne : devons-nous resserrer notre emprise sur le commerce des diamants, en créant un monopole qui maximise nos revenus, ou allons-nous développer Cambay lui-même comme un entrepôt ouvert qui attire les commerçants de toutes les nations ?"
 nd_dec.11.a: "Contrôlez les diamants : le monopole, c’est le pouvoir."
 nd_dec.11.b: "Intégrez Cambay sur le marché mondial."
 nd_dec.12.t: "Maître de l'Océan Indien"
 nd_dec.12.d: "Ormuz est à nous. La petite île qui commande l’entrée du golfe Persique (à travers lequel coulent les richesses de la Perse, de la Mésopotamie et de la Route de la Soie) arbore désormais la bannière Deccani. Avec les diamants de Golconde, les marchands de Cambay et le point d'étranglement stratégique d'Ormuz, le Deccan contrôle un empire commercial s'étendant des mines du plateau aux marchés du golfe Persique. Aucune puissance indienne n’a jamais occupé une telle position. La question est de savoir s’il faut utiliser cette richesse pour élever le Deccan au sommet de la réussite culturelle, ou projeter sa puissance navale à travers l’océan lui-même."
 nd_dec.12.a: "Laissez la lumière de Golconde éclipser le monde."
 nd_dec.12.b: "L'océan lui-même sera notre domaine."
 STATIC_MODIFIER_NAME_nd_dec_dest_heartland_conqueror: "Conquérant du cœur du pays"
 STATIC_MODIFIER_DESC_nd_dec_dest_heartland_conqueror: "The administrative machinery of the Deccan absorbs the conquered heartlands of central India, suppressing separatism and integrating diverse populations, though the focus on consolidation makes new wars costlier to justify."
 STATIC_MODIFIER_NAME_nd_dec_dest_plateau_warlord: "Seigneur de guerre du Plateau"
 STATIC_MODIFIER_DESC_nd_dec_dest_plateau_warlord: "La victoire engendre la victoire. L'armée qui a conquis Malwa et le Gujarat marche avec la confiance d'anciens combattants confirmés, même si les terres ravagées derrière elles se rétablissent lentement."
 STATIC_MODIFIER_NAME_nd_dec_dest_sultan_of_hindustan: "Sultan de l'Hindoustan"
 STATIC_MODIFIER_DESC_nd_dec_dest_sultan_of_hindustan: "Le Deccan revendique la souveraineté de toute l’Inde, exigeant la soumission des seigneurs du Nord et liant les sujets à la bannière verte par la légitimité plutôt que par la force."
 STATIC_MODIFIER_NAME_nd_dec_dest_deccani_imperium: "Impérial Deccani"
 STATIC_MODIFIER_DESC_nd_dec_dest_deccani_imperium: "Le Deccan dirige le nord comme un empire militaire, renforçant ses garnisons, soutenant ses armées sur le terrain et veillant à ce que le moral ne faiblisse jamais dans le vaste domaine."
 STATIC_MODIFIER_NAME_nd_dec_dest_diamond_monopoly: "Monopole du diamant"
 STATIC_MODIFIER_DESC_nd_dec_dest_diamond_monopoly: "The sultanate's grip on the diamond trade is absolute. Every stone from Golconda passes through Deccani hands, and the revenues fund cultural conversion and trade expansion, though maintaining the monopoly strains the military budget."
 STATIC_MODIFIER_NAME_nd_dec_dest_cambay_entrepot: "Entrepôt de Cambay"
 STATIC_MODIFIER_DESC_nd_dec_dest_cambay_entrepot: "Cambay prospère en tant que marché ouvert, ses ports regorgeant de navires venus de tout l'océan Indien. Les entreprises maritimes prospèrent, attirant les marins et les constructeurs navals dans les ports du sultanat."
 STATIC_MODIFIER_NAME_nd_dec_dest_golconda_zenith: "Zénith de Golconde"
 STATIC_MODIFIER_DESC_nd_dec_dest_golconda_zenith: "Le Deccan a atteint le sommet de sa puissance. Les États vassaux sont rapidement absorbés, les routes commerciales s'étendent jusqu'à des rivages lointains et les flottes du sultanat protègent ses intérêts commerciaux contre les pirates et ses rivaux."
 STATIC_MODIFIER_NAME_nd_dec_dest_ocean_sovereign: "Souverain des océans"
 STATIC_MODIFIER_DESC_nd_dec_dest_ocean_sovereign: "Le Deccan projette sa puissance navale à travers l’océan Indien, ses navires de guerre infligeant des coups dévastateurs à ses rivaux, bloquant les ports ennemis, et ses escadrons légers commandant les voies maritimes d’Ormuz à la côte de Malabar."
 nd_dec_sultani_arsenal: "Arsenal du Sultanat"
 nd_dec_sultani_arsenal_desc: "Un immense complexe militaire abritant des fonderies, des armureries et des casernes, produisant les armes et entraînant les soldats qui soutiennent la machine de guerre Deccani."
 nd_dec_sultani_arsenal_upkeep: "Approvisionnement de l'Arsenal"
 nd_dec_sultani_arsenal_upkeep_desc: "Le fer, les armes et le salpêtre alimentent les fonderies et les magasins de magazines de l'arsenal."
 nd_dec_hira_mahal: "Hira Mahal"
 nd_dec_hira_mahal_desc: "Le Palais du Diamant : monument à la richesse de Golconde, ses murs sertis de pierres précieuses et ses jardins rivalisant avec ceux d'Ispahan et de Constantinople."
 nd_dec_hira_mahal_upkeep: "Entretien du palais"
 nd_dec_hira_mahal_upkeep_desc: "Les pierres précieuses, le marbre et le verre entretiennent la splendeur légendaire du Diamond Palace."
 dec_tarafdari_system_bureaucracy: "Système Tarafdari"
 dec_tarafdari_system_bureaucracy_desc: "Le fondateur de Bahmani, Hasan Gangu, a divisé le royaume en quatre atraf (Daulatabad, Berar, Bidar et Gulbarga) chacun dirigé par un tarafdar ayant des revenus, des troupes et des droits de citadelle. L'arrangement étendait l'autorité royale à travers le plateau mais transformait ses grands nobles en une aristocratie royale dont les différends finissaient par diviser les terres bahmani en cinq sultanats du Deccan."
 dec_gawan_centralization_bureaucracy: "La centralisation de Mahmud Gawan"
 dec_gawan_centralization_bureaucracy_desc: "Khwaja Mahmud Gawan, wazir d'origine iranienne de trois sultans bahmani, restructura le royaume entre 1463 et 1481. Il doubla les quatre atraf en huit, retira les citadelles provinciales des tarafdars et les plaça sous les officiers royaux, arpenta les terres productrices de kharaj et fonda la grande madrasa à Bidar. Les réformes ont brièvement stoppé le déclin de Bahmani ; Gawan fut exécuté sur la base d'une fausse accusation en 1481 et, en une décennie, le royaume se fragmenta."
 dec_deccani_pardesi_factions_bureaucracy: "Tribunal Deccani-Pardesi"
 dec_deccani_pardesi_factions_bureaucracy_desc: "Les tribunaux du Deccan étaient structurellement divisés entre le parti Deccani, composé de musulmans sunnites et d'esclaves militaires Habshi nés localement, et le parti Pardesi ou Afaqi, composé de nouveaux arrivants iraniens, turcs et irakiens, souvent chiites duodécimains. Les deux factions recevaient des allocations distinctes, équipaient des régiments de cavalerie différents et parrainaient des écoles théologiques rivales. Maintenue comme un équilibre, la rivalité a produit la culture de cour brillamment cosmopolite de Bahmani-Bijapur ; négligée, elle a produit des guerres civiles successives."
 dec_vijayanagara_nayakas_bureaucracy: "Vijayanagara Nayakas"
 dec_vijayanagara_nayakas_bureaucracy_desc: "Le système amara-nayankara, codifié sous Krishnadevaraya (r. 1509-1529), accordait aux commandants militaires des missions de revenus sur les villages et les forts en échange du déploiement de contingents spécifiés de cavalerie, d'infanterie et d'éléphants. Les nayakas de Madurai, Tanjavur, Gingee, Ikkeri et Mysore répondaient aux Rayas par un hommage annuel et l'obligation de marcher. Après Talikota en 1565, ils sont devenus les puissances souveraines de facto du pays tamoul et kannada."
 dec_persianate_diwan_bureaucracy: "Diwan persan"
 dec_persianate_diwan_bureaucracy_desc: "Les Qutb Shahis de Golkonda ont fait du persan leur langue judiciaire et administrative, important la pratique de la chancellerie de l'Iran safavide avec les oulémas chiites duodécimains ; Adil Shahi Bijapur a suivi sous la direction de son fondateur d'origine persane Yusuf Adil Shah. Les diwans rédigeaient des firmans en nasta'liq, auditaient les karkhanas et supervisaient les dotations waqf. Le persan est resté la langue de l'administration du Deccan jusqu'à l'ère Asaf Jahi, ne disparaissant que sous la résidence britannique."
 dec_deshmukh_watandari_bureaucracy: "Deshmukh Watandari"
 dec_deshmukh_watandari_bureaucracy_desc: "Le deshmukh et son homologue religieux, le deshpande, étaient des chefs de village marathi héréditaires dont le watan (patrimoine de fonction) donnait droit à une part fixe des revenus du village, à l'autorité judiciaire sur les conflits de caste et à une petite suite armée. Les Watandars ont précédé les Bahmanis, ont persisté sous les Adil Shahis et ont fourni à Shivaji à la fois ses premiers alliés et ses adversaires les plus tenaces. Leurs droits étaient si profondément ancrés que les États Mughal, Maratha et Asaf Jahi ont choisi de les coopter plutôt que de les déposséder."
 dec_asaf_jahi_subadari_bureaucracy: "Asaf Jahi Subadari"
 dec_asaf_jahi_subadari_bureaucracy_desc: "Mir Qamar-ud-din Khan, Mughal subadar of the Deccan and titled Nizam al-Mulk Asaf Jah I, broke with Delhi in 1724 to found the Asaf Jahi dynasty at Hyderabad. The Nizamate retained the Mughal subadari template but absorbed the Adil Shahi Persianate court culture, the Qutb Shahi revenue records of Golkonda, and Maratha watandar networks across the plateau. The state outlasted Mughal, Maratha and Mysore rivals, entering the British residency system in 1798 still administering more territory than any other Indian princely state. The Hindu samasthan rajas of Telangana kept their lands under the Nizam for a yearly tribute."
 AUTO_MODIFIER_NAME_nd_dec_bureaucracy_authority: "Autorité bureaucratique du Deccan"
 AUTO_MODIFIER_DESC_nd_dec_bureaucracy_authority: "The unified Deccan inherits the institutional repertoire of the Bahmani Sultanate, the five successor sultanates, Vijayanagara, and the Asaf Jahi Nizamate: enough governing tradition to staff four standing institutions."
