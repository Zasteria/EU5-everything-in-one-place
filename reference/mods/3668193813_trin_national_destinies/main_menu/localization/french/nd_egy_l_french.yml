l_french:
 STATIC_MODIFIER_NAME_nd_sword_of_the_sultan: "Épée du Sultan"
 STATIC_MODIFIER_DESC_nd_sword_of_the_sultan: "La tradition militaire mamelouke perdure. Nos charges de cavalerie secouent la terre et nos armées marchent avec la discipline des siècles. L’épée de l’Égypte est tirée, et personne ne pourra se tenir devant elle."
 STATIC_MODIFIER_NAME_nd_garden_of_the_nile: "Jardin du Nil"
 STATIC_MODIFIER_DESC_nd_garden_of_the_nile: "La générosité du Nil est le fondement de notre prospérité. Les riches récoltes nourrissent une nation en pleine croissance, le commerce circule à travers nos marchés et la richesse des siècles passés alimente les ambitions des siècles à venir."
 STATIC_MODIFIER_NAME_nd_egy_light_of_azhar: "Lumière d'Al-Azhar"
 STATIC_MODIFIER_DESC_nd_egy_light_of_azhar: "Les érudits d'Al-Azhar illuminent le monde islamique grâce à leur savoir, attirant des étudiants de tous les horizons religieux. L'Égypte constitue le cœur intellectuel de la civilisation."
 STATIC_MODIFIER_NAME_nd_egy_egyptian_renaissance: "Renaissance égyptienne"
 STATIC_MODIFIER_DESC_nd_egy_egyptian_renaissance: "Une nouvelle armée entraînée aux tactiques modernes, des usines s'élevant le long du Nil et une génération d'officiers formés aux arts de la guerre. L’Égypte prend conscience de son destin parmi les grandes puissances."
 nd_egy.1.t: "Le pays des pharaons renaît"
 nd_egy.1.d: "Egypt stands united once more under a single banner. For millennia this land has been the crossroads of empires, the granary that fed Rome, the fortress that turned back the Mongols, the market where East met West. The Nile still flows, the harvests still come, and now a new question confronts us: shall Egypt's destiny be written in the language of the sword, or in the ledgers of the counting house? Our Mamluk cavalry remain the finest horsemen in the world, their furusiyya tradition unbroken across centuries. Yet the riches of the Nile valley (cotton, grain, sugar, spices flowing through our ports) offer a different kind of power. The choice before us will define what Egypt becomes.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_egy.1.a: "Nous sommes les héritiers de Baybars. Que nos ennemis tremblent !"
 nd_egy.1.b: "Le Nil fournit. Que notre prospérité soit notre bouclier."
 nd_egy.2.t: "La renaissance d’Al-Azhar"
 nd_egy.2.d: "Depuis sa fondation par les Fatimides en 970, Al-Azhar est un phare du savoir islamique. Sous le patronage mamelouk, la mosquée-université est devenue le principal centre d’érudition sunnite au monde. Les dotations Waqf financent des salles d'études où les juristes débattent de questions de droit, les astronomes cartographient le ciel et les médecins font progresser l'art de la guérison. Les étudiants arrivent d'Andalousie, de Perse, des contrées lointaines du Sahel, attirés par la réputation d'Al-Azhar. Aujourd’hui, avec la souveraineté égyptienne restaurée, nous pouvons élever cette ancienne institution à des sommets encore plus élevés. Devons-nous investir dans sa mission scientifique ou canaliser son prestige vers la stabilité de l’État ?"
 nd_egy.2.a: "Al-Azhar sera la lampe du monde."
 nd_egy.2.b: "Laissez Al-Azhar guider les fidèles avec une autorité renouvelée."
 nd_egy.3.t: "Le nouvel ordre"
 nd_egy.3.d: "L’ancien système militaire mamelouk, malgré sa glorieuse histoire, ne peut pas rivaliser avec les armées disciplinées d’Europe. Les étudiants égyptiens envoyés à l’étranger sont revenus avec des connaissances sur les manuels d’exercices, les tactiques modernes et les méthodes d’organisation qui transforment les conscrits paysans bruts en soldats professionnels. Le Nizam-i Jedid, l’Ordre Nouvel, ne représente rien de moins qu’une révolution dans les affaires militaires égyptiennes. Les usines du Caire produisent désormais des mousquets et des canons conformes aux normes européennes. Une académie militaire forme des officiers à la science de la guerre. La transformation est douloureuse et coûteuse, mais l’alternative est l’assujettissement. L'Égypte aura une armée moderne, ou l'Égypte n'aura pas d'armée du tout."
 nd_egy.3.a: "L'Égypte figurera parmi les grandes puissances militaires."
 nd_egy.3.b: "Modernisez l’économie, pas seulement l’armée."
 nd_egy.4.t: "Passerelle entre les mers"
 nd_egy.4.d: "L’Égypte a toujours été la charnière entre deux mondes. Au nord, la Méditerranée nous relie à l’Europe et aux richesses de la chrétienté. À l’est, la mer Rouge ouvre la route vers l’Inde, les îles aux épices et les richesses de l’Orient. Des caravanes traversent l'isthme de Suez transportant du poivre et de la soie, du café et de l'encens, en quantités qui stupéfieraient l'imagination des nations inférieures. Nos entrepôts dans les ports de Suez et d'Alexandrie regorgent de marchandises provenant de trois continents. Les revenus de ce commerce de transit pourraient à eux seuls financer un royaume. Nous sommes à la croisée des chemins du monde et chaque commerçant qui traverse notre pays enrichit l'Égypte."
 nd_egy.4.a: "Tous les chemins traversent l’Egypte."
 nd_egy_furusiyya: "Tradition Furusiyya"
 nd_egy_furusiyya_desc: "L'art mamelouk de l'équitation, du tir à l'arc et du combat à cheval, transmis de génération en génération de soldats esclaves d'élite."
 nd_egy_nile_irrigation: "Systèmes d'irrigation du Nil"
 nd_egy_nile_irrigation_desc: "Les anciens systèmes d'irrigation des bassins du Nil, améliorés par des roues hydrauliques saqiya et des dispositifs de levage shaduf."
 nd_egy_wikala_network: "Réseau commercial Wikala"
 nd_egy_wikala_network_desc: "Un réseau de caravansérails urbains offrant hébergement, stockage et installations commerciales aux commerçants longue distance."
 nd_egy_mamluk_administration: "Administration mamelouke"
 nd_egy_mamluk_administration_desc: "Le système bureaucratique sophistiqué développé par les sultans mamelouks pour gouverner l'Égypte et ses provinces."
 nd_egy_ancient_legacy: "L'héritage des pharaons"
 nd_egy_ancient_legacy_desc: "Le poids de cinq mille ans de civilisation confère à l’Égypte une autorité culturelle et un prestige inégalés."
 nd_egy_slave_soldier_tradition: "Tradition du soldat esclave"
 nd_egy_slave_soldier_tradition_desc: "La pratique de la formation a permis d’acquérir des esclaves pour en faire des soldats d’élite, créant ainsi une caste militaire d’une loyauté et d’une discipline inégalées."
 nd_egy_nile_fleet: "Flotte du Nil"
 nd_egy_nile_fleet_desc: "Galères à faible tirant d'eau conçues pour la patrouille et le transport le long du Nil et dans les eaux côtières de la Méditerranée et de la mer Rouge."
 nd_egy_azhar_revival: "La renaissance d'Al-Azhar"
 nd_egy_azhar_revival_desc: "La restauration et l’expansion d’Al-Azhar en tant que centre le plus important de l’érudition islamique sunnite dans le monde."
 nd_egy_cairo_madrasas: "Madrasas du Caire"
 nd_egy_cairo_madrasas_desc: "Un réseau d'écoles religieuses fondées et dotées par l'élite mamelouke, diffusant l'alphabétisation et l'apprentissage islamique."
 nd_egy_cotton_cultivation: "Coton égyptien"
 nd_egy_cotton_cultivation_desc: "The cultivation and processing of Egypt's prized long-staple cotton, a crop that would become the foundation of the modern Egyptian economy. In the weaving towns of the Delta it is spun and woven fine for export."
 nd_egy_sultan_diplomacy: "Diplomatie sultanique"
 nd_egy_sultan_diplomacy_desc: "La tradition diplomatique sophistiquée du sultanat égyptien, équilibrant les relations entre la chrétienté, les khanats mongols et les puissances musulmanes rivales."
 nd_egy_granary_of_the_east: "Grenier de l'Est"
 nd_egy_granary_of_the_east_desc: "Le rôle de l'Égypte en tant que grenier de la Méditerranée orientale, exportant des céréales pour alimenter les villes de la région."
 nd_egy_suez_trade: "Commerce de transit de Suez"
 nd_egy_suez_trade_desc: "Contrôle du pont terrestre entre la Méditerranée et la mer Rouge, la route la plus courte entre l'Europe et les richesses de l'Asie."
 nd_egy_egyptian_sipahi: "Sipahi égyptien"
 nd_egy_egyptian_sipahi_desc: "Lanciers de cavalerie lourde dans la tradition des sipahi ottomans, adaptés aux conditions égyptiennes et à l'héritage mamelouk de la guerre à cheval."
 nd_egy_spice_entrepot: "Entrepôt d'épices"
 nd_egy_spice_entrepot_desc: "La position de l'Égypte en tant qu'entrepôt central du commerce des épices, où le poivre, la cannelle et les clous de girofle changent de mains entre les producteurs orientaux et les acheteurs occidentaux."
 nd_egy_citadel_tradition: "Tradition de la Citadelle"
 nd_egy_citadel_tradition_desc: "La tradition de construction de forteresses monumentales remontant à la citadelle du Caire de Saladin, confère à l'Égypte de formidables capacités défensives."
 nd_egy_sugar_processing: "Industrie sucrière du Nil"
 nd_egy_sugar_processing_desc: "The processing of sugar cane grown along the Nile, an industry that once made Egypt a major sugar exporter to the Mediterranean world. The cane is crushed in ox-turned presses and the juice boiled and set in clay cones."
 nd_egy_waqf_endowments: "Système de dotation Waqf"
 nd_egy_waqf_endowments_desc: "Le système de dotations religieuses caritatives qui finance les mosquées, les madrasas, les hôpitaux et les travaux publics dans toute l'Égypte."
 nd_egy_janissary_garrison: "Garnison des janissaires égyptiens"
 nd_egy_janissary_garrison_desc: "Des troupes de garnison d'infanterie disciplinées, calquées sur le système des janissaires ottomans, maintenaient l'ordre dans les villes et les forteresses égyptiennes."
 nd_egy_grand_bazaar: "Grand Bazar du Caire"
 nd_egy_grand_bazaar_desc: "L'expansion du Khan al-Khalili du Caire et des quartiers de bazar environnants en un complexe commercial tentaculaire rivalisant avec n'importe quel marché du monde."
 nd_egy_iltizam_system: "Agriculture fiscale d'Iltizam"
 nd_egy_iltizam_system_desc: "Le système de vente aux enchères des droits de perception des impôts au plus offrant, fournissant des revenus immédiats à l’État au détriment de l’autonomie provinciale."
 nd_egy_coffee_culture: "Culture égyptienne du café"
 nd_egy_coffee_culture_desc: "Les cafés du Caire deviennent des centres de vie sociale, de commerce et d’échange intellectuel, alimentés par les grains importés via le commerce de la mer Rouge."
 nd_egy_felucca_fleet: "Flotte de patrouille en felouque"
 nd_egy_felucca_fleet_desc: "Une flotte de felouques rapides à gréement latin pour la patrouille côtière, le transport fluvial et les opérations navales légères."
 nd_egy_sufi_orders: "Ordres soufis égyptiens"
 nd_egy_sufi_orders_desc: "Les puissantes confréries soufies d’Égypte, les Shadhiliyya, les Ahmadiyya et d’autres, dont les loges assurent l’orientation spirituelle et la cohésion sociale."
 nd_egy_nizam_jedid: "Nizam-i Jedid"
 nd_egy_nizam_jedid_desc: "Le Nouvel Ordre, une armée professionnelle moderne formée aux tactiques européennes, équipée d’armes fabriquées localement et dirigée par des officiers formés à l’académie."
 nd_egy_cairo_arsenal: "Arsenal du Caire"
 nd_egy_cairo_arsenal_desc: "Une manufacture d’armes d’État produisant des mousquets, des canons et des munitions pour équiper l’armée égyptienne modernisée."
 nd_egy_cotton_monopoly: "Monopole du coton"
 nd_egy_cotton_monopoly_desc: "Contrôle étatique du commerce lucratif du coton à fibres longues, le coton égyptien bénéficiant de prix élevés sur les marchés textiles européens."
 nd_egy_centralized_pashalik: "Pachalik centralisé"
 nd_egy_centralized_pashalik_desc: "La transformation de l’Égypte d’une province ottomane faiblement gouvernée en un État centralisé avec un contrôle direct sur ses provinces et ses ressources."
 nd_egy_corvee_system: "Système de travail Corvée"
 nd_egy_corvee_system_desc: "The mobilization of peasant labor for great public works, canals, dams, roads, and fortifications, the same system that once built the pyramids. Deep canals are dug to carry water at low Nile, and cleared of silt by the villages every year."
 nd_egy_bulaq_press: "Presse à imprimer Bulaq"
 nd_egy_bulaq_press_desc: "La première imprimerie du monde arabe, établie à Bulaq au Caire, produisant des livres arabes sur la science militaire, la médecine et l'ingénierie."
 nd_egy_modern_army: "Armée égyptienne moderne"
 nd_egy_modern_army_desc: "Une force d'infanterie entièrement modernisée, entraînée aux tactiques de ligne européennes, équipée de mousquets à percussion et organisée en brigades et divisions."
 nd_egy_industrial_works: "Industrialisation égyptienne"
 nd_egy_industrial_works_desc: "Des usines publiques produisant des textiles, des armes et des produits transformés, qui font partie de l’ambitieux programme visant à transformer l’Égypte en une puissance industrielle."
 nd_egy_modern_medicine: "École égyptienne de médecine"
 nd_egy_modern_medicine_desc: "Une école de médecine moderne au Caire, formant les médecins aux techniques chirurgicales européennes et aux pratiques de santé publique."
 nd_egy_suez_transit: "Revenus du transport en commun de Suez"
 nd_egy_suez_transit_desc: "Les immenses revenus générés par le contrôle de la route commerciale la plus courte entre l’Europe et l’Asie, alors que l’isthme devient le corridor commercial le plus fréquenté au monde."
 nd_egy_peasant_conscription: "Conscription paysanne"
 nd_egy_peasant_conscription_desc: "La conscription massive des paysans égyptiens dans l’armée nationale, transformant les fellahin en soldats de l’État."
 nd_egy_national_awakening: "Réveil national égyptien"
 nd_egy_national_awakening_desc: "L’émergence d’une conscience nationale égyptienne distincte de l’identité impériale ottomane, motivée par une langue, une histoire et une expérience de modernisation communes."
 a_nd_egy_ghulam: "Ghulam mamelouk"
 a_nd_egy_ghulam_desc: "Cavalerie d'élite de soldats esclaves formés dès la jeunesse aux arts furusiyya de l'équitation, du tir à l'arc et du combat à cheval. Leur loyauté va uniquement au sultan."
 n_nd_egy_nile_galley: "Cuisine du Nil"
 n_nd_egy_nile_galley_desc: "Une galère à faible tirant d'eau conçue pour la patrouille et le transport le long du Nil et dans les eaux côtières de la Méditerranée orientale."
 a_nd_egy_sipahi: "Sipahi égyptien"
 a_nd_egy_sipahi_desc: "Lanciers de cavalerie lourde combinant la tradition mamelouke furusiyya avec l'équipement sipahi ottoman, dévastateurs dans la charge."
 a_nd_egy_janissary: "Janissaire égyptien"
 a_nd_egy_janissary_desc: "L'infanterie de garnison disciplinée s'entraînait selon les méthodes ottomanes, formant l'épine dorsale de l'armée permanente égyptienne."
 n_nd_egy_felucca: "Felouque"
 n_nd_egy_felucca_desc: "Un navire rapide au gréement latin parfaitement adapté au Nil, à la mer Rouge et aux eaux côtières égyptiennes. Utilisé pour les patrouilles, le commerce et les combats légers."
 a_nd_egy_nizam: "Nizam-i Jedid"
 a_nd_egy_nizam_desc: "Soldats de l'Ordre Nouvel, infanterie égyptienne entraînée aux tactiques de ligne européennes, entraînée au tir par volée et aux manœuvres en formation."
 a_nd_egy_modern_infantry: "Infanterie de ligne égyptienne"
 a_nd_egy_modern_infantry_desc: "Infanterie professionnelle moderne équipée de mousquets à percussion et de baïonnettes, organisée en brigades de style européen."
 a_nd_egy_fellahin_conscript: "Conscrit Fellahin"
 a_nd_egy_fellahin_conscript_desc: "Des conscrits paysans égyptiens, nombreux mais moins expérimentés que les soldats de carrière. Ce qui leur manque en matière de formation, ils le compensent par leur nombre."
 nd_egy_irrigation_works: "Travaux d'irrigation du Nil"
 nd_egy_irrigation_works_desc: "Des systèmes d’irrigation par bassin, des roues hydrauliques saqiya et des réseaux de canaux qui transforment la plaine inondable du Nil en terres agricoles les plus productives de la région."
 nd_egy_wikala: "Wikala"
 nd_egy_wikala_desc: "Un caravansérail urbain offrant un hébergement sécurisé, un stockage et des installations commerciales aux marchands parcourant les routes commerciales à travers l'Égypte."
 nd_egy_weaving_hall: "Weaving Hall"
 nd_egy_weaving_hall_desc: "A hall of looms in a cotton town. The cotton is spun, woven and finished into fine cloth for export."
 nd_egy_sugar_press: "Sugar Press"
 nd_egy_sugar_press_desc: "A press and boiling house in the cane country. Oxen turn the stones, and the boiled juice sets in clay cones before it is shipped down the Nile."
 nd_egy_summer_canal: "Summer Canal"
 nd_egy_summer_canal_desc: "A canal cut deep enough to carry water when the Nile is low, so that cotton, cane and rice can be watered through the summer. The villages along it are called out each year to clear the silt."
 nd_egy_mamluk_barracks: "Caserne mamelouke"
 nd_egy_mamluk_barracks_desc: "Un complexe d'entraînement où les soldats esclaves sont formés aux arts de la guerre, devenant une cavalerie d'élite et des troupes de garnison loyales."
 nd_egy_madrasa: "Madrasa du Caire"
 nd_egy_madrasa_desc: "Une école de droit et de théologie islamique dotée par l’élite dirigeante, faisant partie du réseau d’apprentissage centré sur Al-Azhar."
 nd_egy_grain_granary: "Grenier du Nil"
 nd_egy_grain_granary_desc: "Un grenier d'État stockant les excédents de la récolte du Nil, assurant la sécurité alimentaire et permettant les exportations de céréales vers la Méditerranée."
 nd_egy_red_sea_warehouse: "Entrepôt de la Mer Rouge"
 nd_egy_red_sea_warehouse_desc: "Une installation de stockage côtier pour les marchandises en transit entre la mer Rouge et la Méditerranée, colonne vertébrale du rôle d'intermédiaire commercial de l'Égypte."
 nd_egy_bazaar: "Grand Bazar"
 nd_egy_bazaar_desc: "Un vaste marché complexe dans la tradition de Khan al-Khalili, où des marchands de trois continents achètent et vendent des marchandises sous un même toit."
 nd_egy_arsenal: "Arsenal du Caire"
 nd_egy_arsenal_desc: "Une manufacture d’armes d’État produisant des mousquets, des canons et de la poudre à canon pour l’armée égyptienne modernisée."
 nd_egy_state_factory: "Usine d'État"
 nd_egy_state_factory_desc: "Une usine de fabrication appartenant au gouvernement produisant des textiles, des produits transformés et des équipements militaires dans le cadre du programme d'industrialisation de l'Égypte."
 nd_egy_cotton_processing: "Transformation du coton égyptien"
 nd_egy_cotton_processing_desc: "Le tissage et la finition du coton égyptien à fibres longues, très prisé, en tissus fins destinés à l'exportation."
 nd_egy_sugar_refining: "Raffinage du sucre du Nil"
 nd_egy_sugar_refining_desc: "Cane is crushed and boiled into sugar, using firewood for the cauldrons, clay cones for the loaves, tools, and oxen for the press."
 levy_nd_egy_ghulam: "Prélèvement mamelouk Ghulam"
 levy_nd_egy_ghulam_desc: "Cavalerie d'élite de soldats esclaves élevée grâce au système traditionnel mamelouk de recrutement militaire."
 levy_nd_egy_felucca: "Prélèvement de patrouille en felouque"
 levy_nd_egy_felucca_desc: "Navires légers de patrouille fluviale et côtière dont l'équipage est composé de marins et de pêcheurs égyptiens."
 levy_nd_egy_fellahin: "Prélèvement sur les conscrits Fellahin"
 levy_nd_egy_fellahin_desc: "La conscription massive des paysans égyptiens dans le service d'infanterie, privilégiant la quantité plutôt que la qualité."
 nd_egy_irrigation_maintenance: "Entretien de l'irrigation"
 nd_egy_irrigation_maintenance_desc: "Entretenir les canaux, les digues et les roues hydrauliques saqiya qui canalisent les richesses du Nil vers les champs."
 nd_egy_summer_canal_dredging: "Canal Clearing"
 nd_egy_summer_canal_dredging_desc: "The yearly clearing of silt from the canal bed, with tools, timber for the banks and draught animals."
 nd_egy_wikala_maintenance: "Entretien de Wikala"
 nd_egy_wikala_maintenance_desc: "Exploitation d'un caravansérail urbain, fournissant du stockage et de l'hébergement aux commerçants longue distance."
 nd_egy_barracks_maintenance: "Entretien des casernes"
 nd_egy_barracks_maintenance_desc: "Approvisionnement d'une caserne mamelouke en chevaux, armes et matériel d'entraînement."
 nd_egy_madrasa_maintenance: "Entretien de la madrasa"
 nd_egy_madrasa_maintenance_desc: "Fournir à un centre d’apprentissage islamique des manuscrits, du papier et du matériel scientifique."
 nd_egy_granary_maintenance: "Entretien du grenier"
 nd_egy_granary_maintenance_desc: "Maintenir des installations de stockage de céréales qui préservent les excédents agricoles égyptiens."
 nd_egy_warehouse_maintenance: "Entretien de l'entrepôt"
 nd_egy_warehouse_maintenance_desc: "Exploitation d'un entrepôt commercial en mer Rouge, stockant des marchandises en transit entre l'océan Indien et la Méditerranée."
 nd_egy_bazaar_maintenance: "Entretien du bazar"
 nd_egy_bazaar_maintenance_desc: "Entretenir les étals, les entrepôts et les infrastructures commerciales d'un grand bazar."
 nd_egy_arsenal_maintenance: "Entretien de l'arsenal"
 nd_egy_arsenal_maintenance_desc: "Produire et stocker des armes, des munitions et du matériel militaire."
 nd_egy_factory_maintenance: "Production de textiles de coton"
 nd_egy_factory_maintenance_desc: "Transformation du coton égyptien en tissu fini à l'aide de machines alimentées au charbon dans des usines publiques."
 STATIC_MODIFIER_NAME_nd_egy_azhar_authority: "Autorité d'Al-Azhar"
 STATIC_MODIFIER_DESC_nd_egy_azhar_authority: "Le prestige renouvelé d'Al-Azhar attire des universitaires du monde islamique, conférant une légitimité religieuse à l'État et favorisant une culture d'apprentissage et de jurisprudence."
 STATIC_MODIFIER_NAME_nd_egy_economic_modernization: "Modernisation économique"
 STATIC_MODIFIER_DESC_nd_egy_economic_modernization: "L’Ordre Nouveau s’étend au-delà des casernes. Les usines, les ateliers modernes et les pratiques commerciales réformées transforment l'économie égyptienne aux côtés de son armée."
 nd_egy_formed_tt: "L'Egypte a été formée"
 nd_egy_path_a_tt: "Choisissez l'épée du sultan"
 nd_egy_path_b_tt: "Choisissez le Jardin du Nil"
 nd_egy_dest_alexandria_developed_tt: "We own #bold Alexandria#! and its development is at least #bold 59#!"
 nd_egy_dest_mahalla_developed_tt: "We own #bold Al-Mahalla#! and its development is at least #bold 50#!"
 nd_egy_dest_barracks_tt: "At least #bold 3#! of our locations have a #bold Mamluk Barracks#!"
 nd_egy_dest_garrisons_tt: "At least #bold 6#! of our locations have a #bold Mamluk Barracks#!"
 nd_egy_dest_looms_tt: "At least #bold 3#! of our locations have a #bold Weaving Hall#!"
 nd_egy_dest_presses_tt: "At least #bold 3#! of our locations have a #bold Sugar Press#!"
 nd_egy_destiny: "Destin égyptien"
 nd_egy_destiny_desc: "L’Égypte se trouve à la croisée des chemins. Les héritiers des pharaons poursuivront-ils l'épée ou la charrue ? Le destin du Nil l'attend."
 nd_egy_dest_levant: "Reconquête du Levant"
 nd_egy_dest_levant_desc: "Jerusalem and Damascus are secured and three garrison towns are given their barracks, restoring Egypt's dominion over the eastern Mediterranean lands that the Mamluks once held."
 nd_egy_dest_heart_islam: "Cœur de l'Islam"
 nd_egy_dest_heart_islam_desc: "Custody of the Holy Cities of Mecca and Medina is taken and Baghdad, seat of the ancient caliphate, is seized. The renown of it makes Egypt the undisputed center of the Islamic world."
 nd_egy_dest_sultan_domain: "Le Domaine du Sultan"
 nd_egy_dest_sultan_domain_desc: "Egyptian sovereignty is extended from Aleppo to Aden and six towns are garrisoned from their own barracks, so that every route between the Mediterranean and the Indian Ocean is commanded under the sultan's banner."
 nd_egy_dest_nile_bounty: "La générosité du Nil"
 nd_egy_dest_nile_bounty_desc: "Adoptez le système bancaire moderne, développez le commerce du coton et transformez la vallée du Nil en un moteur de prospérité sans précédent dans la région."
 nd_egy_dest_crossroads: "Carrefour du Commerce"
 nd_egy_dest_crossroads_desc: "Secure the Red Sea coast at Massawa and rebuild Alexandria, the Mediterranean end of the route, to make Egypt the indispensable trade link between Europe and Asia."
 nd_egy_dest_jewel_orient: "Joyau de l'Orient"
 nd_egy_dest_jewel_orient_desc: "Fill the cotton towns with looms and the cane country with presses, and raise Al-Mahalla into a great weaving city, making the Nile valley the most developed and prosperous land between Europe and India."
 nd_egy.5.t: "Le destin de l’Égypte nous attend"
 nd_egy.5.d: "La formation de l’Égypte est achevée, mais le travail ne fait que commencer. Devant nous s'étendent deux routes, l'une pavée des victoires de l'épée, l'autre bordée de l'or du commerce et du vert des récoltes du Nil. Nos ancêtres ont construit des monuments qui ont duré cinq mille ans. Quel que soit le chemin que nous choisissons, laissez nos actes résonner tout aussi longtemps."
 nd_egy.5.a: "Notre destin est écrit dans les étoiles au-dessus du Nil."
 nd_egy.6.t: "L'Aigle revient au Levant"
 nd_egy.6.d: "Les bannières égyptiennes flottent à nouveau sur la ville sainte de Jérusalem et sur les anciennes murailles de Damas. Les sultans mamelouks d’autrefois, Baybars, Qalawun, al-Nasir, reconnaîtraient l’ambition qui nous anime. La côte levantine, ce rivage contesté où les Croisés et les Mongols brisèrent autrefois la détermination égyptienne, est à nouveau la nôtre. Nos commandants de garnison rapportent que les villes sont sécurisées, les routes commerciales rouvertes et la population locale s'adaptant à l'administration égyptienne. Le mandat du sultan s'étend du delta du Nil à la steppe syrienne."
 nd_egy.6.a: "Le Levant s’incline une fois de plus devant le sultan."
 nd_egy.7.t: "La promesse du Nil tenue"
 nd_egy.7.d: "Le coton égyptien se vend désormais à des prix élevés sur les marchés du monde entier, et nos banques accordent des crédits à travers la Méditerranée. La transformation est remarquable : autrefois nous nous appuyions sur l'épée et le prélèvement, maintenant nous construisons avec le capital et le commerce. Les richesses du Nil, canalisées par le biais d'instruments financiers modernes, génèrent des richesses qu'aucune armée ne pourrait à elle seule s'emparer. Les marchands étrangers se disputent le privilège de commercer sur nos marchés, et les lettres de change égyptiennes circulent de Venise à Ispahan."
 nd_egy.7.a: "La prospérité coule aussi sûrement que le Nil."
 nd_egy.8.t: "Gardien des Deux Sanctuaires"
 nd_egy.8.d: "The conquest of Mecca, Medina and Baghdad places Egypt at the very heart of the Islamic world. The custodianship of the Holy Cities confers a religious authority that transcends mere temporal power, while control of Baghdad, once the seat of the Abbasid caliphate, stakes Egypt's claim to be the successor of that ancient institution. The question now is how to wield this extraordinary position. Shall we emphasize our role as military guardian, projecting force to protect the faithful? Or shall we claim the mantle of caliphal legitimacy, using diplomacy and prestige to build a network of loyal subjects?"
 nd_egy.8.a: "Nous garderons les fidèles avec nos armées."
 nd_egy.8.b: "Nous revendiquons l'héritage des califes abbassides."
 nd_egy.9.t: "La question de la mer Rouge"
 nd_egy.9.d: "Avec l'infrastructure commerciale florissante de l'Égypte et la côte de la mer Rouge sous notre contrôle, nous nous trouvons à un moment historique. Le commerce entre l’Europe et l’Asie doit passer entre nos mains, mais comment tirer profit de cette position ? Nous pourrions dominer directement les voies maritimes, en établissant une présence navale qui contrôlerait tous les navires, de Suez à l’océan Indien. Ou nous pourrions nous concentrer sur les bourses du coton et des matières premières, faisant de l'Égypte le centre d'échange indispensable au monde où les produits orientaux rencontrent les capitaux occidentaux. Chaque approche promet une richesse, mais d’un caractère différent."
 nd_egy.9.a: "Commandez les voies maritimes de Suez à Aden."
 nd_egy.9.b: "Faire de l'Égypte la bourse mondiale du coton."
 nd_egy.10.t: "Le triomphe du sultan"
 nd_egy.10.d: "D’Alep à Aden, le domaine du sultan s’étend sur les anciens cœurs de la civilisation. L'Égypte contrôle les routes commerciales, les villes saintes et le grand carrefour de trois continents. Aucune puissance dans la région ne peut égaler notre portée. Pourtant, l’empire implique des choix. Allons-nous faire de notre domination un instrument de fer de conquête, entretenant de vastes armées et imposant notre volonté par la pure suprématie militaire ? Ou devons-nous consolider nos acquis en établissant une Pax Aegyptia où les renseignements et les garnisons égyptiens maintiennent l’ordre pendant que nos armées se reposent ?"
 nd_egy.10.a: "Forgez la main de fer du sultan."
 nd_egy.10.b: "Établissez la paix en Égypte."
 nd_egy.11.t: "Le joyau de l'Orient"
 nd_egy.11.d: "Egypt has achieved what few nations dare to dream. Looms in every cotton town, presses along the whole cane country, and wealth that would make the pharaohs envious. The Nile valley hums with work, and new canals carry water to fields that once lay dry through the summer. Now we face the ultimate question: shall Egypt use its wealth and sophistication to project influence outward, reaching toward new horizons with the confidence of a revived civilization? Or shall we turn our gaze to the isthmus of Suez, that narrow strip of land that could, if pierced, transform Egypt into the indispensable link between the oceans of the world?"
 nd_egy.11.a: "L’Égypte s’ouvrira vers de nouveaux horizons."
 nd_egy.11.b: "Le canal unira les mers du monde."
 STATIC_MODIFIER_NAME_nd_egy_dest_guardian_holy: "Gardien des Villes Saintes"
 STATIC_MODIFIER_DESC_nd_egy_dest_guardian_holy: "Les armées égyptiennes veillent sur les sites sacrés de l’Islam, projetant leur puissance militaire pour défendre les fidèles et renforcer l’autorité du sultan à travers le Moyen-Orient."
 STATIC_MODIFIER_NAME_nd_egy_dest_abbasid_heir: "Héritier des Abbassides"
 STATIC_MODIFIER_DESC_nd_egy_dest_abbasid_heir: "L'Égypte revendique l'héritage diplomatique et spirituel du califat abbasside, exerçant son prestige religieux et son influence politique pour lier le monde islamique à la volonté du Caire."
 STATIC_MODIFIER_NAME_nd_egy_dest_iron_sultan: "Le Sultan de Fer"
 STATIC_MODIFIER_DESC_nd_egy_dest_iron_sultan: "La machine militaire égyptienne est la terreur de la région, de vastes armées, des forteresses imprenables et une volonté de fer qui écrase toute opposition, même si le coût met à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_egy_dest_pax_aegyptia: "Pax Aegyptia"
 STATIC_MODIFIER_DESC_nd_egy_dest_pax_aegyptia: "Les réseaux de renseignement égyptiens et les forces de garnison maintiennent l’ordre dans le vaste domaine du sultan, assurant la stabilité par la vigilance plutôt que par la conquête, même si la complaisance impériale pourrait encore s’enraciner."
 STATIC_MODIFIER_NAME_nd_egy_dest_red_sea_master: "Maître de la Mer Rouge"
 STATIC_MODIFIER_DESC_nd_egy_dest_red_sea_master: "La domination navale égyptienne sur la mer Rouge garantit qu'aucun navire ne passe entre la Méditerranée et l'océan Indien sans la permission égyptienne et sans profit égyptien."
 STATIC_MODIFIER_NAME_nd_egy_dest_cotton_exchange: "Bourse du coton"
 STATIC_MODIFIER_DESC_nd_egy_dest_cotton_exchange: "Le coton égyptien domine le marché mondial et les bourses de matières premières du Caire fixent les prix que les commerçants de Lisbonne à Calcutta doivent accepter."
 STATIC_MODIFIER_NAME_nd_egy_dest_pharaoh_reborn: "Pharaon renaît"
 STATIC_MODIFIER_DESC_nd_egy_dest_pharaoh_reborn: "L'Égypte s'étend vers l'extérieur avec la confiance d'une civilisation ravivée, projetant son influence bien au-delà de la vallée du Nil, même si le maintien d'une telle grandeur exige des dépenses de cour toujours plus importantes."
 STATIC_MODIFIER_NAME_nd_egy_dest_suez_vision: "Vision de Suez"
 STATIC_MODIFIER_DESC_nd_egy_dest_suez_vision: "L'Égypte se transforme en un corridor maritime indispensable au monde, accueillant les navires de toutes les nations dans ses eaux et s'enrichissant grâce au transit du commerce mondial."
 nd_egy_sultans_citadel: "Citadelle du Sultan"
 nd_egy_sultans_citadel_desc: "Un palais-forteresse monumental dans la tradition de la Citadelle de Saladin, servant de cœur militaire et administratif au domaine du sultan."
 nd_egy_suez_canal_office: "Bureau du Canal de Suez"
 nd_egy_suez_canal_office_desc: "Un grand complexe administratif gérant le flux du commerce international à travers le couloir de transit égyptien, le moteur économique de l'État égyptien moderne."
 nd_egy_citadel_maintenance: "Garnison de la Citadelle"
 nd_egy_citadel_maintenance_desc: "Entretenir une forteresse monumentale avec une garnison permanente, une armurerie et des provisions pour la défense du royaume."
 nd_egy_canal_maintenance: "Administration des canaux"
 nd_egy_canal_maintenance_desc: "Gérer la machine administrative du commerce de transit égyptien, gérer les calendriers d'expédition, les tarifs et les installations portuaires."

 # ===== BUREAUCRACIES =====
 egy_diwan_al_jaysh_bureaucracy: "Rawk al-Nasiri"
 egy_diwan_al_jaysh_bureaucracy_desc: "The great land survey of Sultan al-Nasir Muhammad, carried out by the Army Bureau in Egypt in 1315. Every village was measured and valued and every grant reassigned. The sultan's own share of the land rose from four parts in twenty-four to ten, and from it he paid his royal mamluks. The amirs' grants were cut and scattered across the country so that none held a province together. A crowd of petty taxes on markets and trades was abolished at the same stroke. The bureau's registers fixed what each amir held and what he owed for it."
 egy_iqta_system_bureaucracy: "Système Iqta'"
 egy_iqta_system_bureaucracy_desc: "Concession de terres militaires par laquelle les émirs mamelouks recevaient les revenus des provinces en lieu et place de leur solde en espèces, la principale institution fiscalo-militaire du sultanat. Contrairement à l'iqta héréditaire des dynasties antérieures, les subventions mameloukes étaient strictement non héréditaires et alternaient entre les détenteurs toutes les quelques années pour empêcher un retranchement local. Le système fournissait une cavalerie permanente sans le fardeau des salaires monétaires, mais à la fin de la période Burji, les grands émirs s'emparèrent de plus en plus de la base fiscale rurale, pressant toujours plus les fellahs et affamant le trésor sultanique du Caire."
 egy_amirate_hierarchy_bureaucracy: "Amirat mamelouk"
 egy_amirate_hierarchy_bureaucracy_desc: "La hiérarchie graduée des officiers mamelouks : émir de dix (amir ashara), amir de quarante (amir tablkhana, qui pouvait monter sa propre fanfare de timbales) et émir de cent et commandant de mille (muqaddam alf). Chaque rang portait un contingent fixe de mamelouks, une évaluation iqta fixe et une place fixe dans l'ordre de parade. Le système a donné au sultanat son armée et son corps d'officiers, mais les grands émirs d'une centaine étaient également les faiseurs de rois des factions qui ont déposé et élevé les sultans au cours des siècles Bahri et Burji - une aristocratie graduée dont la loyauté au trône était toujours conditionnelle."
 egy_al_azhar_bureaucracy: "Al-Azhar"
 egy_al_azhar_bureaucracy_desc: "La grande mosquée-université du Caire, fondée par le général fatimide Jawhar al-Siqilli en 970 en tant qu'institution chiite, puis refondée par Saladin en 1171 en tant qu'institution sunnite et élevée au rang du centre d'érudition sunnite le plus important au monde au cours des siècles mamelouks. Chacune des quatre écoles sunnites avait son propre cercle d'enseignement (riwaq) dirigé par son propre mufti en chef ; les oulémas formés à al-Azhar travaillaient dans les mosquées, les tribunaux et les madrasas égyptiens et, tout au long des siècles ottomans, l'institution resta la capitale intellectuelle du monde arabe."
 egy_qadi_al_qudat_bureaucracy: "Qadi al-Qudat"
 egy_qadi_al_qudat_bureaucracy_desc: "Le système de magistrature en chef formalisé par le sultan Baybars en 1265, selon lequel Le Caire abritait non pas un mais quatre cadis en chef : un pour chacune des écoles de droit sunnites : Hanafi, Shafi'i, Maliki et Hanbali. Chaque juge en chef nommait des adjoints dans son madhhab à travers le royaume et présidait aux conflits d'héritage, de contrat et de famille pour les adhérents de son école. Cet arrangement a fait du Caire la capitale judiciaire du monde sunnite et a donné à chaque madhhab un statut institutionnel, mais il a également cimenté l’autonomie des oulémas face à l’ingérence sultanique et a produit des rivalités juridictionnelles qui ont parfois paralysé les tribunaux."
 egy_diwan_al_aqbat_bureaucracy: "Diwan al-Aqbat"
 egy_diwan_al_aqbat_bureaucracy_desc: "L'emploi de longue date d'employés chrétiens coptes dans les bureaux fiscaux d'Égypte, une tradition remontant aux registres kharaj abbassides et qui a survécu à chaque changement de dynastie. Les dynasties de secrétaires coptes détenaient des connaissances pratiques en matière d'évaluation foncière, de comptabilité des revenus et d'arpentage que les régimes musulmans successifs ne pouvaient pas facilement remplacer; un certain Hibat Allah al-Sadid est même devenu mustawfi al-suhba (contrôleur en chef) sous Qalawun. Leur continuité a été ponctuée par au moins neuf purges documentées entre la fin du XIIIe et le milieu du XVe siècle (déclenchées par la pression populaire ou la faveur du sultan) mais les commis étaient toujours rétablis lorsque les registres tombaient dans le chaos."
 egy_muhtasib_bureaucracy: "Bread Price of Cairo"
 egy_muhtasib_bureaucracy_desc: "In Cairo the market inspector had one duty above all the others: the price of bread. He set what a loaf could cost in a city of half a million, watched the grain boats unload, and answered for it when the Nile failed. In 1394 the people of Cairo went to the vice-sultan to blame the inspector for dear grain. The historian al-Maqrizi took the office in 1399. The inspector's fixed prices set him against the amirs who hoarded grain and against the peasants whose crop he valued cheap."

 AUTO_MODIFIER_NAME_nd_egy_bureaucracy_authority: "Diwans du Sultanat"
 AUTO_MODIFIER_DESC_nd_egy_bureaucracy_authority: "The diwans of the Citadel of Cairo (the Army Bureau, the Chancery, the treasury, the bureau of the privy purse) have matured into a permanent institutional apparatus, registering iqta grants, drafting manashir, and accounting the revenues of the realm. From this foundation Egypt's distinctive institutions of state begin to take their durable form. Four bureaucracy slots are open for them."
