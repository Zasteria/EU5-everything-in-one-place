l_french:
 STATIC_MODIFIER_NAME_nd_wittenberg_legacy: "L'héritage de Wittenberg"
 STATIC_MODIFIER_DESC_nd_wittenberg_legacy: "Depuis les marches de l’église du château, une révolution des idées déferle sur la chrétienté. Les universités et l'imprimerie de Saxe seront les instruments d'une nouvelle ère d'apprentissage, de tolérance et de réforme."
 STATIC_MODIFIER_NAME_nd_augustan_splendor: "Splendeur augustéenne"
 STATIC_MODIFIER_DESC_nd_augustan_splendor: "L'argent de l'Erzgebirge, la porcelaine de Meissen, les palais de Dresde : la richesse et la magnificence de la Saxe feront l'envie de toutes les cours d'Europe."
 nd_sax.1.t: "L’ascendant électoral"
 nd_sax.1.d: "The Electorate of Saxony stands formed: second in the Empire only to the Emperor himself. The Wettin dynasty commands the richest mines in Christendom, the greatest trade fairs in Germany, and the constitutional power to shape the future of the Holy Roman Empire.\n\nBut what shall define Saxony's legacy? The Electorate gave birth to the Reformation, where Martin Luther's theses set the world ablaze. Wittenberg and Leipzig are centers of learning where new ideas flourish. Yet Saxony is equally renowned for its material splendor: the silver mountains, the porcelain works, the baroque magnificence of Augustus the Strong's Dresden.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_sax.1.a: "Nous sommes le pays des idées et de la réforme"
 nd_sax.1.b: "Nous sommes la Florence sur l'Elbe"
 STATIC_MODIFIER_NAME_nd_saxon_schmalkaldic_arms: "Armes schmalkaldiques"
 STATIC_MODIFIER_DESC_nd_saxon_schmalkaldic_arms: "Les soldats saxons défilent aux côtés de leurs frères protestants, déterminés à défendre la foi réformée par la force des armes."
 STATIC_MODIFIER_NAME_nd_saxon_schmalkaldic_diplomacy: "Diplomatie schmalkaldique"
 STATIC_MODIFIER_DESC_nd_saxon_schmalkaldic_diplomacy: "L'électeur de Saxe exerce son prestige constitutionnel et son influence diplomatique pour forger un consensus protestant, garantissant la foi réformée par la négociation plutôt que par la bataille."
 STATIC_MODIFIER_NAME_nd_saxon_golden_dresden: "Dresde dorée"
 STATIC_MODIFIER_DESC_nd_saxon_golden_dresden: "Sous le patronage d'Auguste le Fort, Dresde est devenue la « Florence sur l'Elbe » : une ville de palais baroques, de collections de classe mondiale et d'une magnificence culturelle rivalisant avec n'importe quelle cour d'Europe."
 STATIC_MODIFIER_NAME_nd_saxon_bergakademie_science: "Bergakademie Sciences"
 STATIC_MODIFIER_DESC_nd_saxon_bergakademie_science: "La première université minière au monde a lancé une révolution dans les sciences appliquées, en formant des ingénieurs et des géologues dont les méthodes transforment l'industrie à travers le continent."
 nd_sax.2.t: "La Ligue Schmalkaldique"
 nd_sax.2.d: "In February 1531, the Protestant princes of Germany gathered at Schmalkalden in Thuringia. Under the leadership of the Elector of Saxony and the Landgrave of Hesse, they forged a defensive alliance against Emperor Charles V, pledging 10,000 infantry and 2,000 cavalry for mutual protection.\n\nThe Schmalkaldic League represents the first organized Protestant military force in Europe. As the League's senior member, Saxony must decide how to wield this power."
 nd_sax.2.a: "Rassemblez les armées protestantes sous notre bannière"
 nd_sax.2.b: "Utiliser notre prestige électoral pour la défense diplomatique"
 nd_sax.3.t: "Florence sur l'Elbe"
 nd_sax.3.d: "Augustus the Strong dreams of transforming Dresden into a city to rival Versailles. The Zwinger Palace rises in baroque splendor, designed by Poppelmann and adorned with Permoser's sculptures. The Green Vault houses one of Europe's most dazzling treasure collections. Court painter Bernardo Bellotto captures the city's skyline in luminous detail.\n\nThe Frauenkirche's stone dome crowns the skyline. The Royal Opera cultivates a musical tradition that draws composers from across Europe. Dresden's golden age has begun."
 nd_sax.3.a: "Laissez le monde s'émerveiller devant la magnificence saxonne"
 nd_sax.4.t: "La Bergakademie"
 nd_sax.4.d: "On 21 November 1765, Prince Francis Xavier of Saxony establishes the Bergakademie Freiberg: the world's first university of mining and metallurgical sciences. Born from the urgent need to revive the Erzgebirge mines after the devastation of the Seven Years' War, the academy quickly becomes a beacon of practical scientific education.\n\nAbraham Gottlob Werner brings order to the world of minerals. Alexander von Humboldt studies here before his legendary expeditions. Scientists at the academy will go on to discover the chemical elements indium and germanium. The Bergakademie's model is copied from St. Petersburg to Mexico City."
 nd_sax.4.a: "La science doit renouveler ce que la nature a fourni"
 nd_sax_erzgebirge_silver: "Erzgebirge Argent"
 nd_sax_erzgebirge_silver_desc: "Les Monts Métallifères livrent leurs trésors : l'argent découvert près de Freiberg en 1168 a déclenché une ruée minière qui financera le pouvoir saxon pendant des siècles."
 nd_sax_freiberger_bergrecht: "Freiberger Bergrecht"
 nd_sax_freiberger_bergrecht_desc: "Le Code minier de Freiberg de 1296 a établi les droits du « mineur libre » et a créé l'un des premiers cadres juridiques systématiques d'Europe pour l'extraction des ressources."
 nd_sax_trade_crossroads: "Carrefour commercial"
 nd_sax_trade_crossroads_desc: "À l'intersection de la Via Regia et de la Via Imperii, les marchés de Leipzig attirent des marchands depuis 1165, vendant des tissus, du vin, des épices et de la ferronnerie."
 nd_sax_wettin_retainers: "Dispositifs de retenue Wettin"
 nd_sax_wettin_retainers_desc: "Les communautés minières de l'Erzgebirge fournissent à la cour de Wettin une solide milice : des hommes endurcis par les tunnels de montagne qui combattent avec l'endurance de la pierre qu'ils taillent."
 nd_sax_leipzig_messe: "Foire de Leipzig"
 nd_sax_leipzig_messe_desc: "Les privilèges impériaux garantissent aux foires commerciales de Leipzig un sauf-conduit pour tous les commerçants, même ceux dont les dirigeants sont en guerre contre la Saxe."
 nd_sax_cranach_werkstatt: "Usine de Cranach"
 nd_sax_cranach_werkstatt_desc: "L'atelier de Lucas Cranach l'Ancien à Wittenberg a produit des peintures, des gravures sur bois et des imprimés qui ont façonné le langage visuel de la Réforme."
 nd_sax_guldengroschen: "Guldengroschen"
 nd_sax_guldengroschen_desc: "The first German Guldengroschen, issued from Saxony in 1500, established the precedent for large silver coinage that would evolve into the Thaler, and eventually the Dollar."
 nd_sax_wittenberg_university: "Université de Wittenberg"
 nd_sax_wittenberg_university_desc: "Fondée en 1502 par Frédéric le Sage, l’Université de Wittenberg a attiré Martin Luther, Philipp Melanchthon et une génération de réformateurs qui allaient remodeler la chrétienté."
 nd_sax_schmalkaldic_league: "Ligue Schmalkaldique"
 nd_sax_schmalkaldic_league_desc: "L’alliance défensive des princes protestants, dirigée par la Saxe et la Hesse, constituait le bouclier militaire de la Réforme contre l’empereur Charles Quint."
 nd_sax_book_fair: "Foire du livre de Leipzig"
 nd_sax_book_fair_desc: "La foire annuelle du livre de Leipzig est devenue le centre de l'industrie de l'édition allemande, où imprimeurs, libraires et universitaires se réunissaient pour échanger le savoir lui-même."
 nd_sax_electoral_vicariate: "Vicariat électoral"
 nd_sax_electoral_vicariate_desc: "En tant que Vicaire Impérial, l'Électeur de Saxe gouverne en l'absence de l'Empereur : un privilège constitutionnel qui place la Saxe au cœur de la politique impériale."
 nd_sax_schneeberg_rush: "Ruée vers l'argent du Schneeberg"
 nd_sax_schneeberg_rush_desc: "Rich silver deposits discovered at Schneeberg in 1470 sparked a second mining boom across the Erzgebirge, funding new towns and deeper shafts.\n\n#italic Available in: $nd_sax_silberbergwerk$#!"
 nd_sax_furstenbund: "Fürstenbund"
 nd_sax_furstenbund_desc: "La Ligue des princes protestants a lié les États réformés de l'Empire en un bloc diplomatique, la voix électorale de la Saxe conférant un poids constitutionnel à la cause protestante."
 nd_sax_festung_konigstein: "Fête de Königstein"
 nd_sax_festung_konigstein_desc: "La forteresse de Königstein, perchée au sommet d'une mesa de grès au-dessus de l'Elbe, constitue le bastion le plus imprenable de l'électorat depuis la période médiévale."
 nd_sax_albertine_administration: "Administration Albertine"
 nd_sax_albertine_administration_desc: "Les Albertine Wettins ont consolidé leur contrôle sur l'électorat grâce à une réforme administrative systématique, créant une bureaucratie centralisée qui a amélioré à la fois la collecte des recettes et l'efficacité de l'État."
 nd_sax_gewandhaus_tradition: "Gewandhaus Tradition"
 nd_sax_gewandhaus_tradition_desc: "The Gewandhaus (originally the cloth merchants' hall of Leipzig) became a symbol of Saxon commercial culture where trade in textiles built fortunes and civic institutions.\n\n#italic Available in: $nd_sax_messehaus$#!"
 nd_sax_augustan_golden_age: "Âge d'or augustéen"
 nd_sax_augustan_golden_age_desc: "Sous Auguste le Fort, Dresde fut transformée en la « Florence de l'Elbe » avec le palais Zwinger, la Frauenkirche et des institutions culturelles de cour qui rivalisaient avec Versailles."
 nd_sax_porcelain_invention: "Invention de la porcelaine"
 nd_sax_porcelain_invention_desc: "En 1710, Johann Friedrich Bottger perfectionna la production de porcelaine dure européenne à Meissen, brisant ainsi le monopole séculaire de la Chine sur « l'or blanc »."
 nd_sax_kursachsische_garde: "Garde Kursachsische"
 nd_sax_kursachsische_garde_desc: "The Electoral Saxon Guard represents the professional standing army that replaced feudal levies, disciplined infantry in the latest European fashion."
 nd_sax_gruenes_gewoelbe: "Grunes Gewolbe"
 nd_sax_gruenes_gewoelbe_desc: "La Voûte verte de Dresde abrite l'une des collections de trésors les plus éblouissantes d'Europe : une démonstration de richesse et de savoir-faire qui renforce le prestige diplomatique saxon."
 nd_sax_bergakademie_advance: "Bergakademie Freiberg"
 nd_sax_bergakademie_advance_desc: "Fondée en 1765, la Bergakademie Freiberg fut la première université des sciences minières au monde, formant des ingénieurs qui transmettaient l'expertise minière saxonne à travers le monde."
 nd_sax_constitutional_reforms: "Réformes constitutionnelles"
 nd_sax_constitutional_reforms_desc: "La Constitution saxonne de 1831 a établi un gouvernement représentatif, transformant l'électorat d'un régime absolutiste en un État constitutionnel moderne."
 nd_sax_publishing_capital: "Capitale de l'édition"
 nd_sax_publishing_capital_desc: "Leipzig's Borsenverein der Deutschen Buchhandler, founded in 1825, formalized the city's role as the publishing capital of the German-speaking world.\n\n#italic Available in: $nd_sax_druckhaus$#!"
 nd_sax_industrial_revolution: "Industrialisation saxonne"
 nd_sax_industrial_revolution_desc: "Les usines textiles et les ateliers de machines saxons ont mené la révolution industrielle allemande, en s'appuyant sur des siècles d'expertise minière et de tradition commerciale."
 a_nd_sax_bergleute: "Erzgebirge Bergleute"
 a_nd_sax_bergleute_desc: "Milice minière des Monts Métallifères, aguerrie par son travail souterrain et combattant avec l'endurance des hommes qui creusent dans la pierre."
 a_nd_sax_kurgarde: "Garde Kursachsische"
 a_nd_sax_kurgarde_desc: "The Electoral Saxon Guard, disciplined professional infantry of the standing army, trained in the latest tactical doctrines."
 levy_nd_sax_bergleute: "Erzgebirge Bergleute"
 levy_nd_sax_bergleute_desc: "Les communautés minières des Monts Métallifères constituent une solide milice pour la défense de l'électorat."
 nd_sax_silberbergwerk: "Usine d'argenterie"
 nd_sax_silberbergwerk_desc: "Une mine d'argent saxonne dans l'Erzgebirge, extrayant le précieux minerai qui a financé la dynastie Wettin depuis le XIIe siècle."
 nd_sax_messehaus: "Messehaus"
 nd_sax_messehaus_desc: "Un hall d'exposition de Leipzig où les commerçants de toute l'Europe se réunissent sous couvert de sauf-conduit impériaux pour échanger des marchandises et nouer des liens commerciaux."
 nd_sax_werkstatt: "Usine de Cranach"
 nd_sax_werkstatt_desc: "Un atelier artistique dans la tradition de Lucas Cranach l'Ancien, produisant de fines gravures, gravures sur bois et matériaux enluminés qui diffusent la culture saxonne."
 nd_sax_druckhaus: "Druckhaus"
 nd_sax_druckhaus_desc: "Une imprimerie saxonne produisant des livres, des brochures et des ouvrages scientifiques, moteurs de la Réforme et des Lumières allemandes."
 nd_sax_hofkapelle: "Hofkapelle"
 nd_sax_hofkapelle_desc: "La chapelle de la cour et l'ensemble musical de Dresde, une institution culturelle qui a attiré des compositeurs et des musiciens de toute l'Europe pour se produire sous le patronage saxon."
 nd_sax_porzellanmanufaktur: "Manufacture de porcelaine"
 nd_sax_porzellanmanufaktur_desc: "A porcelain factory producing Meissen-style hard-paste porcelain, Europe's answer to Chinese 'white gold,' bearing the famous crossed swords mark."
 nd_sax_bergakademie: "Bergakademie"
 nd_sax_bergakademie_desc: "Une académie des mines suivant le modèle de Freiberg, formant des ingénieurs et des métallurgistes aux méthodes scientifiques qui ont transformé l'industrie minière."
 nd_sax_basic_mining: "Exploitation minière de base"
 nd_sax_basic_mining_desc: "Exploitation minière traditionnelle avec supports en bois et outils en fer, selon les méthodes établies par le Freiberger Bergrecht."
 nd_sax_deep_shaft_mining: "Exploitation minière en profondeur"
 nd_sax_deep_shaft_mining_desc: "Techniques avancées pour exploiter des veines d’argent plus profondes, utilisant des pompes améliorées, une ventilation et des supports de tunnel renforcés de fer."
 nd_sax_fair_trade: "Produits du commerce équitable"
 nd_sax_fair_trade_desc: "Les foires de Leipzig attirent des marchands de tissus, de bétail et de vin de tout le continent."
 nd_sax_saxon_weaving: "Tissage saxon"
 nd_sax_saxon_weaving_desc: "La tradition du Gewandhaus de production textile raffinée, transformant les tissus bruts et les teintures en tissus de luxe recherchés dans toute l'Europe."
 nd_sax_fine_printing: "Impression fine"
 nd_sax_fine_printing_desc: "Impression artistique dans la tradition de Cranach - gravures sur bois, gravures et ouvrages enluminés reliés en volumes savants et dévotionnels."
 nd_sax_book_printing: "Impression de livres"
 nd_sax_book_printing_desc: "Les imprimeries de Leipzig produisent des ouvrages scientifiques, des textes religieux et des volumes littéraires destinés au monde germanophone."
 nd_sax_industrial_printing: "Impression industrielle"
 nd_sax_industrial_printing_desc: "Les presses à vapeur et les usines de papier industrielles transforment Leipzig en centre d'édition de masse du siècle des Lumières allemand."
 nd_sax_court_music: "Musique de cour"
 nd_sax_court_music_desc: "La Hofkapelle dispose d'un effectif complet de musiciens, d'instruments et d'espaces de représentation sous le patronage royal."
 nd_sax_porcelain_production: "Porcelaine de Meissen"
 nd_sax_porcelain_production_desc: "L'art secret de la production européenne de porcelaine dure, combinant l'argile kaolin avec des techniques de cuisson précises perfectionnées à Meissen."
 nd_sax_mining_research: "Recherche minière"
 nd_sax_mining_research_desc: "Enquête scientifique sur la géologie, la métallurgie et l'ingénierie, disciplines académiques issues de la tradition minière saxonne."
 nd_sax_formed_tt: "La Saxe est formée"
 nd_sax_path_a_tt: "Choisissez la terre de la Réforme"
 nd_sax_path_b_tt: "J'ai choisi Florence sur l'Elbe"
 nd_sax_destiny: "Destin saxon"
 nd_sax_destiny_desc: "La Saxe est constituée : électorat et grande puissance. C'est à nous de choisir la voie à suivre : la vie de l'esprit ou la splendeur de la cour."
 nd_sax_dest_reformation_cradle: "Berceau de la Réforme"
 nd_sax_dest_reformation_cradle_desc: "Sécurisez Wittenberg, la ville où les thèses de Luther ont changé le monde, et construisez des institutions dignes d'une nation érudite."
 nd_sax_dest_printing_revolution: "La révolution de l’imprimerie"
 nd_sax_dest_printing_revolution_desc: "Saxon presses have reshaped the intellectual landscape of Europe. Hold Leipzig, whose book fair came to outsell Frankfurt's, raise it to 38 development, and embrace the transformative power of the printed word."
 nd_sax_dest_leipzig_developed_tt: "We own #bold Leipzig#! and its development is at least #bold 38#!"
 nd_sax_dest_enlightened_saxony: "La Saxe éclairée"
 nd_sax_dest_enlightened_saxony_desc: "De Wittenberg à Strasbourg, les idées saxonnes et les institutions saxonnes illuminent le continent. Embrassez la révolution scientifique et faites de la Saxe la capitale intellectuelle de l’Europe."
 nd_sax_dest_bohemian_claim: "La revendication bohème"
 nd_sax_dest_bohemian_claim_desc: "La dynastie Wettin lorgne sur la couronne de Bohême. Prenez Prague et démontrez que les armes saxonnes sont aussi redoutables que l'argent saxon."
 nd_sax_dest_northern_hegemony: "Hégémonie du Nord"
 nd_sax_dest_northern_hegemony_desc: "Depuis les ports hanséatiques de Lübeck jusqu'au siège des Hohenzollern à Berlin, la domination saxonne doit s'étendre à tout le nord de l'Allemagne."
 nd_sax_dest_european_splendor: "Splendeur européenne"
 nd_sax_dest_european_splendor_desc: "With Nuremberg secured and the treasury overflowing, Saxony can build a court to rival Versailles: a true Florence on the Elbe. Dresden must be held and raised to 44 development, and the Augustan Golden Age must have begun."
 nd_sax_dest_dresden_developed_tt: "We own #bold Dresden#! and its development is at least #bold 44#!"
 nd_sax.5.t: "Le destin électoral"
 nd_sax.5.d: "The Electorate of Saxony is formed, and with it comes a question that will define our nation for centuries. The silver mountains fund our ambitions, the trade fairs draw merchants from across the continent, and the constitutional authority of the electoral vote gives us a voice that resonates throughout the Empire.\n\nNow we must decide what kind of Saxony we shall build."
 nd_sax.5.a: "Notre destin attend"
 nd_sax.6.t: "La ville de Luther est à nous"
 nd_sax.6.d: "Wittenberg, where Martin Luther nailed his Ninety-Five Theses to the door of the Castle Church, now flies the Saxon banner. The university that educated Melanchthon and a generation of reformers is ours to nurture. The printing presses that spread Luther's words across Christendom are ours to direct.\n\nThis is more than a city. It is the birthplace of a revolution in human thought, and Saxony shall be its guardian."
 nd_sax.6.a: "La Réforme commence et se termine en Saxe"
 nd_sax.7.t: "Le pouvoir de la presse"
 nd_sax.7.d: "Saxon printing houses now dominate the German book trade. From Leipzig's fair halls to Wittenberg's university presses, the written word flows outward in an unstoppable current. Pamphlets, treatises, and scholarly works carry Saxon ideas to every corner of Europe.\n\nBut the press is a tool that can be wielded in different ways. Shall we use it to advance our diplomatic position, building networks of information and influence? Or shall we focus on building academic institutions that draw scholars from across the continent?"
 nd_sax.7.a: "Déployer la presse comme instrument d’État"
 nd_sax.7.b: "Construire un réseau d’académies et d’universitaires"
 nd_sax.8.t: "Les Lumières saxonnes"
 nd_sax.8.d: "From the Bergakademie in Freiberg to the university at Wittenberg, from Strasbourg's presses to Leipzig's book fairs, Saxon institutions have become the beating heart of European intellectual life. The Scientific Revolution has transformed how humanity understands the natural world, and Saxon scholars stand at its forefront.\n\nThis is the culmination of centuries of investment in ideas. How shall Saxony employ its intellectual supremacy?"
 nd_sax.8.a: "Appliquer la science à l’art de la gouvernance"
 nd_sax.8.b: "Favoriser une république des lettres au-delà des frontières"
 nd_sax.9.t: "La couronne de Bohême"
 nd_sax.9.d: "Prague, the golden city on the Vltava, has fallen to Saxon arms. The Bohemian crown (coveted by Habsburgs, Luxembourgs, and Jagellions alike) now adorns a Wettin brow. With Bohemia's wealth and manpower added to Saxon silver, we command resources that few in the Empire can match.\n\nThe road to German hegemony runs through conquered capitals. Prague is only the beginning."
 nd_sax.9.a: "La Bohême se plie à la volonté de Wettin"
 nd_sax.10.t: "Domination sur le Nord"
 nd_sax.10.d: "The Hanseatic jewel of Lubeck and the Hohenzollern stronghold of Berlin both answer to Saxon authority. From the Baltic coast to the heart of Brandenburg, northern Germany has been brought under our control. Trade routes that once enriched our rivals now fill Saxon coffers.\n\nHow shall we consolidate this vast new dominion?"
 nd_sax.10.a: "Faites marcher nos armées à travers les villes conquises"
 nd_sax.10.b: "Établir l'autorité administrative saxonne"
 nd_sax.11.t: "La Florence sur l'Elbe"
 nd_sax.11.d: "The dream of Augustus the Strong is realized. Dresden's baroque palaces rival Versailles, Meissen porcelain graces the tables of every European court, and the Green Vault's treasures dazzle foreign ambassadors. With Nuremberg's wealth secured and Saxon dominion stretching across Germany, we have built something that will endure for centuries.\n\nShall our legacy be remembered for its cultural magnificence or for the military power that made it possible?"
 nd_sax.11.a: "Laissons le monde s'émerveiller de notre magnificence"
 nd_sax.11.b: "Forgez un empire saxon en fer et en argent"
 STATIC_MODIFIER_NAME_nd_sax_dest_reformation_press: "Presse de la Réforme"
 STATIC_MODIFIER_DESC_nd_sax_dest_reformation_press: "Les imprimeries saxonnes servent d’instruments à la politique de l’État, diffusant des idées qui sapent leurs rivaux et construisant un levier diplomatique grâce au pouvoir de l’information."
 STATIC_MODIFIER_NAME_nd_sax_dest_academic_network: "Réseau académique"
 STATIC_MODIFIER_DESC_nd_sax_dest_academic_network: "Un réseau d’académies et d’échanges universitaires financés par la Saxe attire des intellectuels de toute l’Europe, renforçant le soft power grâce au prestige de l’apprentissage."
 STATIC_MODIFIER_NAME_nd_sax_dest_scientific_statecraft: "Politique scientifique"
 STATIC_MODIFIER_DESC_nd_sax_dest_scientific_statecraft: "Enlightenment principles applied to governance produce a rationalized state apparatus, efficient, systematic, and ruthlessly effective."
 STATIC_MODIFIER_NAME_nd_sax_dest_republic_of_letters: "République des Lettres"
 STATIC_MODIFIER_DESC_nd_sax_dest_republic_of_letters: "Les érudits saxons correspondent avec des intellectuels au-delà des frontières, construisant un réseau transnational de connaissances qui transcende les petites querelles des dynasties."
 STATIC_MODIFIER_NAME_nd_sax_dest_hanseatic_conquest: "Conquête hanséatique"
 STATIC_MODIFIER_DESC_nd_sax_dest_hanseatic_conquest: "Les armées saxonnes se sont emparées des grandes villes commerciales hanséatiques et les capitaines mercenaires se rassemblent pour servir un patron qui paie en argent d'Erzgebirge."
 STATIC_MODIFIER_NAME_nd_sax_dest_saxon_dominion: "Domination saxonne"
 STATIC_MODIFIER_DESC_nd_sax_dest_saxon_dominion: "De Prague à Berlin, l'autorité saxonne est renforcée par des garnisons disciplinées et des forces d'assaut rapides qui écrasent la résistance avant qu'elle ne puisse s'organiser."
 STATIC_MODIFIER_NAME_nd_sax_dest_baroque_magnificence: "splendeur baroque"
 STATIC_MODIFIER_DESC_nd_sax_dest_baroque_magnificence: "The baroque splendor of Saxon palaces, collections, and court life makes Dresden the cultural capital of the German-speaking world, though such magnificence does not come cheap."
 STATIC_MODIFIER_NAME_nd_sax_dest_saxon_imperium: "Impérial saxon"
 STATIC_MODIFIER_DESC_nd_sax_dest_saxon_imperium: "Un empire militaro-économique construit sur la cavalerie, les mercenaires et les vastes revenus des territoires allemands conquis."
 nd_sax_aufklarungsschule: "Aufklarungsschule"
 nd_sax_aufklarungsschule_desc: "Une académie saxonne des Lumières dédiée à l'avancement de la philosophie naturelle, des sciences appliquées et de la gouvernance rationnelle - l'incarnation institutionnelle de la tradition intellectuelle saxonne."
 nd_sax_enlightenment_curriculum: "Programme d'études des Lumières"
 nd_sax_enlightenment_curriculum_desc: "Un programme complet d'enseignement en philosophie naturelle, en mathématiques et en sciences appliquées, maintenu grâce à la production constante de matériel scientifique."
 nd_sax_dresdner_schloss: "Château de Dresde"
 nd_sax_dresdner_schloss_desc: "Le grand palais des électeurs saxons, reconstruit dans la splendeur baroque pour abriter la Voûte verte, les collections d'art royales et la cour la plus éblouissante d'Allemagne."
 nd_sax_palace_maintenance: "Entretien du palais"
 nd_sax_palace_maintenance_desc: "L'entretien du Dresdner Schloss nécessite un approvisionnement constant en textiles raffinés, en meubles, en porcelaine et en bougies pour conserver sa splendeur légendaire."
 AUTO_MODIFIER_NAME_nd_sax_bureaucracy_authority: "Verwaltung Kursachsische"
 AUTO_MODIFIER_DESC_nd_sax_bureaucracy_authority: "L’électorat de Wettin hérite d’un ensemble d’outils institutionnels inégalés dans l’Empire : la Bergordnung imprimée qui a codifié les droits des mineurs un siècle avant tout rival, l’Oberbergamt qui gérait le flux d’argent de l’Erzgebirge comme un monopole d’État, le premier consistoire luthérien de Wittenberg, la Foire impériale de Leipzig, un Landtag actif des domaines et : avec le temps : le Geheime Konsilium qui a porté la Saxe vers l’absolutisme. Choisissez les institutions à maintenir en vie."
 sax_bergordnung_bureaucracy: "Bergordnung"
 sax_bergordnung_bureaucracy_desc: "Le Schreckenberger Bergordnung de 1499/1500 - le plus ancien code minier imprimé en Europe - et l'ordonnance élargie d'Annaberg du duc Georges le Barbu de 1509 codifiaient les droits des mineurs libres (Bergfreiheit), les horaires fixes et les parts de minerai, et protégeaient les mineurs de la seigneurie féodale. Le code est devenu le modèle de droit minier dans toute l’Europe centrale et a soutenu la grande ruée vers l’argent dans l’Erzgebirge à Schneeberg, Annaberg et Marienberg."
 sax_oberbergamt_bureaucracy: "Oberbergamt à Freiberg"
 sax_oberbergamt_bureaucracy_desc: "Fondé le 1er juillet 1542 par le duc Maurice et dont le siège est à Freiberg, l'Office des mines de Saxe était la plus ancienne autorité minière officielle d'Allemagne. L'Oberbergamt plaçait l'ensemble du Bergstaat (Bergmeister, fonderies, fonderies et salaires des mineurs) sous contrôle électoral direct. Sa bureaucratie à plusieurs niveaux canalisait le flux d'argent de l'Erzgebirge vers le trésor de Wettin et faisait de la Saxe la plus riche des principautés allemandes."
 sax_konsistorium_bureaucracy: "Konsistoire Sachsisches"
 sax_konsistorium_bureaucracy_desc: "Créé à Wittenberg en 1539 sous l'électeur Johann Friedrich, le Consistoire luthérien saxon a repris la juridiction matrimoniale, la discipline ecclésiastique et les visites paroissiales après l'abolition des fonctions épiscopales. Avec l'électeur faisant office de summus episcopus, les juristes du Consistoire et les théologiens de Wittenberg ont standardisé la doctrine luthérienne, dirigé les écoles latines et fait de la Saxe le cœur institutionnel de la Réforme."
 sax_geheimes_konsilium_bureaucracy: "Geheimes Konsilium"
 sax_geheimes_konsilium_bureaucracy_desc: "Formalisé sous l'électeur Christian Ier dans les années 1580 et élaboré sous Auguste le Fort vers 1706, le Conseil privé était un petit corps de ministres de confiance qui travaillaient en secret sur les finances, la guerre et la politique étrangère. En contournant complètement le Landtag, le Konsilium est devenu l'épine dorsale institutionnelle de l'absolutisme saxon et a géré la double union saxonne-polonaise depuis le château de Dresdner."
 sax_landstande_bureaucracy: "Landstande Sachsische"
 sax_landstande_bureaucracy_desc: "Convoqué pour la première fois par l'électeur Frédéric II en 1438 et se réunissant régulièrement par la suite, le Landtag saxon rassembla des prélats, des comtes, des chevaliers et des députés des villes saxonnes pour négocier des subventions fiscales et, de plus en plus, une politique fiscale, militaire et religieuse. Contrairement à la plupart des Landtage allemands, les domaines saxons étaient exceptionnellement résistants : ils négociaient avec l'électeur plutôt que de se laisser dicter, et ont survécu comme un véritable contrôle du pouvoir princier jusqu'au XVIIIe siècle."
 sax_leipziger_reichsmesse_bureaucracy: "Leipziger Reichsmesse"
 sax_leipziger_reichsmesse_bureaucracy_desc: "Le roi Maximilien Ier confirma les trois foires annuelles de Leipzig en 1497 et les éleva en 1507 au rang de Reichsmessen - foires commerciales impériales - avec un sauf-conduit à l'échelle de l'empire pour les marchands et un Bannmeile de quinze milles à l'intérieur duquel aucune foire concurrente ne pouvait avoir lieu. Les privilèges attiraient des marchands de Venise, Cracovie, Francfort et Hambourg et faisaient de la capitale bourgeoise, et non de Dresde, le moteur de l'économie saxonne."
