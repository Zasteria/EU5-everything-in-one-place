l_french:
 KWS: "Kilwa"
 KWS_ADJ: "Kilwan"
 KWS_f: "Sultanat de Kilwa"
 KWS_f_desc: "Le sultanat de Kilwa était la plus riche et la plus puissante des cités-États de la côte swahilie, contrôlant le commerce de l'or depuis l'intérieur de l'Afrique du Sud-Est jusqu'à l'océan Indien du XIIe au XVIe siècle. En unissant les villes commerciales swahilies sous une seule bannière, un dirigeant peut restaurer l'empire commercial maritime de Kilwa et dominer à nouveau les routes commerciales de l'océan Indien."
