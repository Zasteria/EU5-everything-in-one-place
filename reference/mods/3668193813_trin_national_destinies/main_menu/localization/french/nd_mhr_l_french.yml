l_french:
 STATIC_MODIFIER_NAME_nd_ganimi_kava: "Ganimi Kava"
 STATIC_MODIFIER_DESC_nd_ganimi_kava: "L'art de la guérilla perfectionné par Shivaji Maharaj : frappes rapides depuis les forts des collines, embuscades dans les cols de montagne et harcèlement incessant de forces largement supérieures. La vitesse, le terrain et l'audace remplacent le nombre et l'armure lourde."
 STATIC_MODIFIER_NAME_nd_hindavi_swarajya: "Hindavi Swarajya"
 STATIC_MODIFIER_DESC_nd_hindavi_swarajya: "Le rêve d’autonomie hindoue que Shivaji a proclamé lors de son couronnement à Raigad : un État indépendant gouverné par son propre peuple, administré par le conseil d’Ashtapradhan et soutenu par la dévotion du cœur du pays de langue marathi."
 nd_mhr.1.t: "Le Maratha Swarajya"
 nd_mhr.1.d: "The Deccan trembles. What began as the defiance of a single Bhonsle chieftain has become something the Mughal padishahs and Bijapur sultans never imagined: a sovereign Maratha state, forged in the hill forts of the Western Ghats and baptized in the blood of a hundred ambushes. The coronation at Raigad has given this new nation a crown, but the harder question remains: what kind of nation shall this be? Will we remain the swift raiders of the hills, the masters of ganimi kava who can bleed any empire dry? Or will we build the institutions of governance that transform a warrior kingdom into a lasting civilization?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mhr.1.a: "Nous sommes l'ombre dans les montagnes."
 nd_mhr.1.b: "Nous construirons un royaume pour tous les Marathes."
 nd_mhr.2.t: "Les saints du chemin Warkari"
 nd_mhr.2.d: "Des rives de l'Indrayani jusqu'au temple de Vithoba à Pandharpur, coule chaque année une rivière de pèlerins : fermiers aux pieds nus, potiers et tisserands qui chantent les abhangs de Dnyaneshwar et Tukaram en marchant. Le mouvement Warkari a fait ce qu’aucune armée ne pouvait faire : il a donné au peuple marathi une identité spirituelle commune qui transcende les castes et les villages. Les vers de Tukaram déclarent que la dévotion ne connaît pas de naissance, et le Dnyaneshwari de Dnyaneshwar a rendu la sagesse de la Bhagavad Gita accessible dans la langue du peuple. Ce mouvement peut être considéré comme le fondement spirituel de notre État ou canalisé comme une force de réforme sociale et d’alphabétisation."
 nd_mhr.2.a: "Pandharpur sera notre cœur spirituel."
 nd_mhr.2.b: "Les saints nous enseignent que toutes les castes sont égales devant Dieu."
 nd_mhr.3.t: "L'art du Ganimi Kava"
 nd_mhr.3.d: "Tandis que les grandes armées de l’empire moghol marchent en colonnes lourdes à travers les plaines du Deccan, nos combattants disparaissent dans les replis des Ghâts occidentaux comme la brume de mousson. Shivaji Maharaj a perfectionné l'art du ganimi kava : une guérilla qui transforme chaque ravin en site d'embuscade, chaque fort de colline en refuge imprenable et chaque nuit sans lune en champ de bataille. À Pratapgad, une force Maratha anéantit l'armée d'Afzal Khan. À Sinhagad, les hommes de Tanaji Malusare escaladèrent des falaises abruptes dans l'obscurité pour s'emparer d'une forteresse que les Moghols croyaient inattaquable. Ce ne sont pas des victoires isolées ; il s'agit d'une doctrine militaire qui définira la guerre de Maratha pendant des générations."
 nd_mhr.3.a: "Les montagnes sont notre forteresse et la nuit est notre alliée."
 nd_mhr.4.t: "La Confédération Maratha"
 nd_mhr.4.d: "Sous les Peshwas, l’État Maratha a évolué vers quelque chose de sans précédent : une confédération de maisons puissantes, chacune commandant ses propres armées et territoires, mais liées entre elles par une loyauté partagée envers les Chhatrapati et le rêve de Hindavi Swarajya. Les Holkars détiennent Indore, les Scindias commandent Gwalior, les Gaekwads gouvernent Baroda et les Bhonsales gouvernent Nagpur. Ensemble, ils ont poussé le pouvoir Maratha du Deccan jusqu’aux portes de Delhi même. Les raids de cavalerie de Baji Rao ont humilié l'empereur moghol dans sa propre capitale. Mais ce succès même soulève une question : devrions-nous lier plus étroitement ces grandes maisons sous l’autorité des Peshwa, ou leur donner la liberté de s’étendre à leur guise ?"
 nd_mhr.4.a: "L'unité sous le Peshwa sera notre force."
 nd_mhr.4.b: "Laissez chaque sardar porter notre bannière vers de nouveaux horizons."
 nd_mhr.5.t: "Méthodes européennes et armes Maratha"
 nd_mhr.5.d: "L’arrivée des puissances européennes sur la côte indienne a apporté bien plus que des marchandises commerciales et des missionnaires : elle a apporté de nouvelles méthodes de guerre. L’infanterie, l’artillerie de campagne et les techniques de fortification entraînées par les Européens se sont révélées d’une efficacité dévastatrice contre les armées traditionnelles. Les Marathes, toujours pragmatiques, ont commencé à s'adapter. Des aventuriers français comme Benoît de Boigne ont formé l'infanterie Maratha aux exercices européens, tandis que les forgerons Maratha ont appris à lancer des canons de style européen dans les tophkhanas de Pune et Satara. La question est de savoir si nous adopterons ces méthodes étrangères en bloc ou si nous adopterons sélectivement ce qui nous sert tout en conservant nos traditions distinctives de cavalerie."
 nd_mhr.5.a: "Modernisez l’armée avec des armes et des exercices européens."
 nd_mhr.5.b: "Étudiez les Européens. Et ils utilisent leurs propres méthodes contre eux."
 STATIC_MODIFIER_NAME_nd_mhr_bhakti_devotion: "Lumière de Pandharpur"
 STATIC_MODIFIER_DESC_nd_mhr_bhakti_devotion: "La ferveur dévotionnelle du pèlerinage Warkari unit le peuple marathi dans une foi partagée et une fierté culturelle."
 STATIC_MODIFIER_NAME_nd_mhr_bhakti_reform: "Dévotion aveugle aux castes"
 STATIC_MODIFIER_DESC_nd_mhr_bhakti_reform: "L'égalitarisme radical des saints de la Bhakti brise les barrières sociales et diffuse l'alphabétisation à travers la poésie dévotionnelle vernaculaire."
 STATIC_MODIFIER_NAME_nd_mhr_confederacy_unity: "Ascendant Peshwa"
 STATIC_MODIFIER_DESC_nd_mhr_confederacy_unity: "Les grandes maisons Maratha sont regroupées sous l'autorité administrative des Peshwa, créant une confédération unifiée."
 STATIC_MODIFIER_NAME_nd_mhr_confederacy_expansion: "Cavaliers Maratha non liés"
 STATIC_MODIFIER_DESC_nd_mhr_confederacy_expansion: "Les sardars de la confédération avancent indépendamment, transportant le pouvoir Maratha aux quatre coins du sous-continent."
 STATIC_MODIFIER_NAME_nd_mhr_european_arms: "Modernisation du Tophkhana"
 STATIC_MODIFIER_DESC_nd_mhr_european_arms: "Les exercices d’artillerie et d’infanterie européens ont été adoptés en bloc, transformant l’armée de Maratha en une force de combat moderne."
 STATIC_MODIFIER_NAME_nd_mhr_european_diplomacy: "Jouer au grand jeu"
 STATIC_MODIFIER_DESC_nd_mhr_european_diplomacy: "Les diplomates marathes étudient les méthodes européennes de gouvernance, de renseignement et de constitution d'alliances pour retourner contre eux les outils des colonisateurs."
 nd_mhr_yadava_heritage: "Patrimoine Yadava"
 nd_mhr_yadava_heritage_desc: "Les Marathes font remonter leur lignée à la dynastie Yadava qui dirigeait le Deccan depuis Devagiri. Cet héritage ancien confère une légitimité et une tradition de guerre de cavalerie à travers le plateau."
 nd_mhr_warkari_devotion: "Dévotion Warkari"
 nd_mhr_warkari_devotion_desc: "La tradition Warkari du pèlerinage à Pandharpur, soutenue par les abhangs de saints comme Dnyaneshwar et Namdev, forge une identité spirituelle commune au sein du peuple marathi."
 nd_mhr_deccan_agriculture: "Agriculture du Deccan"
 nd_mhr_deccan_agriculture_desc: "Les sols noirs de coton du plateau du Deccan et les pluies saisonnières de mousson soutiennent un système agricole distinctif centré sur le mil, les légumineuses et le coton."
 nd_mhr_marathi_literary_tradition: "Tradition littéraire marathi"
 nd_mhr_marathi_literary_tradition_desc: "Le Dnyaneshwari et d'autres œuvres en langue marathi créent une culture alphabétisée qui transcende l'élite instruite sanskrit, apportant la philosophie et la gouvernance au peuple."
 nd_mhr_western_ghats_mastery: "Maîtrise des Ghâts occidentaux"
 nd_mhr_western_ghats_mastery_desc: "Le terrain accidenté des Ghâts occidentaux (ravins abrupts, forêts denses et cols étroits) constitue la forteresse naturelle du peuple marathi, et ils ont appris à s'y déplacer comme aucun étranger ne le peut."
 nd_mhr_gadkot_tradition: "Tradition Gadkot"
 nd_mhr_gadkot_tradition_desc: "La tradition de construire des fortifications au sommet des collines et des crêtes des Ghâts occidentaux crée un réseau de points forts imprenables, les gads, qui ancrent la puissance militaire de Maratha."
 nd_mhr_mavla_hillmen: "Les montagnards de Mavla"
 nd_mhr_mavla_hillmen_desc: "Les mavlas sont de robustes fantassins de la région de Maval des Ghâts occidentaux, experts dans les combats de colline, les embuscades et les raids nocturnes. Ils forment le noyau de l’armée de guérilla de Shivaji."
 nd_mhr_ganimi_kava_tactics: "Tactiques du Ganimi Kava"
 nd_mhr_ganimi_kava_tactics_desc: "Shivaji's perfection of guerrilla warfare, ganimi kava, transforms the Western Ghats into a deathtrap for conventional armies through ambushes, night raids, and feigned retreats. The Hetkari marksmen of the Konkan open the trap with their firelocks, and the Mavla swordsmen close it."
 nd_mhr_ashtapradhan_council: "Conseil d'Ashtapradhan"
 nd_mhr_ashtapradhan_council_desc: "Le conseil de huit ministres (Peshwa, Amatya, Sachiv, Mantri, Senapati, Sumant, Nyayadhish et Panditrao) fournit le cadre administratif de l'État de Maratha."
 nd_mhr_coronation_traditions: "Traditions du couronnement"
 nd_mhr_coronation_traditions_desc: "La cérémonie de couronnement à Raigad, menée selon les rites védiques, établit le Chhatrapati comme un roi hindou souverain : un défi direct à la suprématie moghole sur le Deccan."
 nd_mhr_deccan_trade_routes: "Routes commerciales du Deccan"
 nd_mhr_deccan_trade_routes_desc: "The great trade routes connecting the Konkan coast to the Deccan interior carry cotton, spices, and textiles, making the Maratha heartland a hub of commercial activity.\n\n#italic Available in: $nd_mhr_koshti_karkhana$#!"
 nd_mhr_fort_network: "Réseau Fort"
 nd_mhr_fort_network_desc: "La construction et l'entretien systématiques de forts de colline à travers les Ghâts occidentaux créent un réseau défensif imbriqué où chaque fort soutient ses voisins."
 nd_mhr_konkan_naval_power: "Puissance navale de Konkan"
 nd_mhr_konkan_naval_power_desc: "Sous la direction d'amiraux comme Kanhoji Angre, la marine Maratha domine la côte du Konkan, de Surat au sud de Mumbai, utilisant des gallivats et des grappins rapides pour défier même les puissances maritimes européennes."
 nd_mhr_shiledar_system: "Système Shiledar"
 nd_mhr_shiledar_system_desc: "Le système de cavalerie shiledar, dans lequel les cavaliers fournissent leurs propres montures et armes en échange d'un salaire mensuel, crée une force autonome de raiders de cavalerie légère."
 nd_mhr_chauth_system: "Système Chauth"
 nd_mhr_chauth_system_desc: "Le chauth, un prélèvement représentant un quart des revenus totaux perçus sur les territoires voisins, devient l'épine dorsale financière de l'État de Maratha et un puissant instrument de contrôle politique."
 nd_mhr_abhang_poetry: "Poésie Abhang"
 nd_mhr_abhang_poetry_desc: "Les vers de dévotion de Tukaram et d'autres saints poètes de la Bhakti, composés en marathi de tous les jours, créent un corpus littéraire qui donne au peuple l'accès aux idées spirituelles et philosophiques."
 nd_mhr_coastal_raiding: "Raids côtiers"
 nd_mhr_coastal_raiding_desc: "Maratha naval tactics emphasize fast, maneuverable vessels that close from astern to avoid cannon broadsides, then board enemy ships in fierce hand-to-hand combat."
 nd_mhr_peshwa_rise: "Montée de Peshwa"
 nd_mhr_peshwa_rise_desc: "Le bureau du Peshwa, à l'origine ministre en chef de l'Ashtapradhan, devient progressivement le véritable siège du pouvoir dans l'État de Maratha, produisant de brillants administrateurs et généraux."
 nd_mhr_bargir_cavalry: "Cavalerie Bargir"
 nd_mhr_bargir_cavalry_desc: "Contrairement aux shiledar auto-équipés, les cavaliers bargir reçoivent des chevaux et des armes de l'État, créant ainsi une force de cavalerie plus disciplinée et contrôlée de manière centralisée."
 nd_mhr_peshwa_bureaucracy: "Bureaucratie peshwa"
 nd_mhr_peshwa_bureaucracy_desc: "L'administration Peshwa de Pune développe un système bureaucratique sophistiqué avec une tenue de registres détaillée, une collecte des recettes standardisée et des administrateurs professionnels."
 nd_mhr_confederacy_structure: "Structure de la Confédération"
 nd_mhr_confederacy_structure_desc: "La Confédération Maratha évolue vers un système fédéral où de puissantes maisons (Holkar, Scindia, Gaekwad et Bhonsale) gouvernent de vastes territoires tout en reconnaissant la suprématie nominale des Chhatrapati."
 nd_mhr_grab_warships: "Prenez des navires de guerre"
 nd_mhr_grab_warships_desc: "Le grab, un navire plus grand et plus lourdement armé que le gallivat, constitue l'épine dorsale de la flotte Maratha : capable d'engager des navires européens sur un pied d'égalité."
 nd_mhr_sardeshmukhi_rights: "Droits des Sardeshmukhi"
 nd_mhr_sardeshmukhi_rights_desc: "Le sardeshmukhi, un prélèvement supplémentaire de dix pour cent au-delà du chauth, affirme la prétention du souverain Maratha en tant que chef héréditaire de tous les deshmukhs du Deccan."
 nd_mhr_deccan_cotton_trade: "Commerce du coton Deccan"
 nd_mhr_deccan_cotton_trade_desc: "The Deccan's black cotton soils produce some of India's finest raw cotton, feeding a thriving textile industry that exports cloth across the Indian Ocean trading world. The Peshwas settle weavers from Paithan at Yeola, where silk and gold thread go into the saris of the court.\n\n#italic Available in: $nd_mhr_koshti_karkhana$#!"
 nd_mhr_european_military_methods: "Méthodes militaires européennes"
 nd_mhr_european_military_methods_desc: "The pragmatic adoption of European military techniques (field artillery, infantry drill, and modern fortification) transforms the Maratha army without abandoning its cavalry traditions.\n\n#italic Available in: $nd_mhr_tophkhana$#!"
 nd_mhr_gardis_bodyguard: "Garde du corps Gardis"
 nd_mhr_gardis_bodyguard_desc: "Les Gardis sont un corps de gardes du corps d'élite formé aux méthodes européennes, servant de garde personnelle des Peshwa et de troupes de choc dans les batailles rangées."
 nd_mhr_territorial_administration: "Administration territoriale"
 nd_mhr_territorial_administration_desc: "À mesure que le territoire de Maratha s'étend à travers le sous-continent, le gouvernement Peshwa développe des systèmes pour administrer les provinces éloignées, nommer des députés et maintenir le contrôle sur les garnisons les plus éloignées."
 nd_mhr_maratha_resilience: "Résilience Maratha"
 nd_mhr_maratha_resilience_desc: "Même après la catastrophe de Panipat en 1761, les Marathes se regroupent et se rétablissent en une décennie, reprenant Delhi et réaffirmant leur contrôle sur une grande partie de l'Inde : un témoignage de la profondeur de la capacité militaire et administrative des Marathes."
 nd_mhr_konkan_trade_network: "Réseau commercial Konkan"
 nd_mhr_konkan_trade_network_desc: "Les ports de la côte de Konkan, contrôlés par Maratha, se développent en un réseau commercial florissant, reliant l'intérieur agricole aux routes commerciales maritimes de l'océan Indien."
 nd_mhr_maval_militia_reform: "Réforme de la milice Maval"
 nd_mhr_maval_militia_reform_desc: "S'appuyant sur la tradition des montagnards mavla, les réformes normalisent le recrutement des milices locales, garantissant ainsi un approvisionnement constant en soldats entraînés en provenance du cœur des Ghâts occidentaux."
 nd_mhr_modern_artillery: "Artillerie moderne"
 nd_mhr_modern_artillery_desc: "Les fonderies Maratha de Pune et de Satara produisent des canons de campagne modernes, tandis que des artilleurs qualifiés apprennent à les déployer à la manière européenne : bien loin des bombardements rudimentaires des siècles précédents."
 nd_mhr_last_peshwa_reforms: "Dernières réformes Peshwa"
 nd_mhr_last_peshwa_reforms_desc: "Au crépuscule de la Confédération Maratha, les dernières réformes administratives cherchent à centraliser l’autorité et à rationaliser la gouvernance, dans le but d’égaler l’efficacité institutionnelle des Britanniques."
 nd_mhr_maratha_identity: "Identité Maratha"
 nd_mhr_maratha_identity_desc: "L'héritage de Shivaji, la poésie des saints Bhakti et des siècles d'autonomie forgent une identité culturelle marathi distinctive qui perdure au-delà de la vie politique de l'empire."
 nd_mhr_fortress_modernization: "Modernisation de la forteresse"
 nd_mhr_fortress_modernization_desc: "Les anciens forts de Gad Hill sont modernisés avec des bastions modernes, des emplacements de canons et des ouvrages défensifs de style européen pour résister aux bombardements d'artillerie."
 nd_mhr_industrial_deccani: "Déccan industriel"
 nd_mhr_industrial_deccani_desc: "The Deccan's mineral wealth, cotton production, and skilled artisan traditions provide the foundation for early industrial development.\n\n#italic Available in: $nd_mhr_tophkhana$#!"
 nd_mhr_deccan_independence: "Indépendance du Deccan"
 nd_mhr_deccan_independence_desc: "Le point culminant de siècles de gouvernance Maratha : un État Deccan autosuffisant avec ses propres institutions, économie et identité culturelle, indépendant de toute domination extérieure."
 a_nd_mhr_mavla: "Les montagnards de Mavla"
 a_nd_mhr_mavla_desc: "Infanterie robuste de la région de Maval dans les Ghats occidentaux, experte en combat de colline, en raids nocturnes et en guérilla. Ils constituent l’épine dorsale de la doctrine du ganimi kava de Shivaji."
 a_nd_mhr_hetkari: "Hetkari Marksmen"
 a_nd_mhr_hetkari_desc: "Musketeers from the Konkan lowlands below the Ghats, the second arm of Shivaji's infantry. They climb like the Mavlas and shoot better than anyone in the Deccan, but they are not the men to send in sword in hand."
 a_nd_mhr_shiledar: "Cavalerie Shiledar"
 a_nd_mhr_shiledar_desc: "Cavalerie légère auto-équipée qui fournit ses propres chevaux et armes. Rapide, indépendant et habile à attaquer profondément derrière les lignes ennemies."
 a_nd_mhr_bargir: "Cavalerie Bargir"
 a_nd_mhr_bargir_desc: "Cavalerie équipée par l'État qui reçoit ses montures et ses armes du gouvernement. Plus disciplinés que les shiledar, ils constituent l'arme de frappe lourde de l'armée Maratha."
 a_nd_mhr_gardis: "Gardis"
 a_nd_mhr_gardis_desc: "Infanterie de gardes du corps d'élite formée aux méthodes militaires européennes. Soldats professionnels qui servent de garde personnelle des Peshwa et de troupes de choc lors de batailles rangées."
 n_nd_mhr_gallivat: "Gallivat"
 n_nd_mhr_gallivat_desc: "Un petit bateau de guerre côtier rapide avec des rames et un seul mât, avec un équipage de cinquante à soixante hommes. Utilisé pour les actions d'abordage, les raids côtiers et pour harceler les plus gros navires européens."
 n_nd_mhr_grab: "Saisir"
 n_nd_mhr_grab_desc: "Un plus grand navire de guerre Maratha pouvant atteindre quatre cents tonnes, armé de canons et transportant plus d'une centaine d'équipage. Capable d'engager des navires européens en combat rapproché."
 nd_mhr_gad: "Dieu"
 nd_mhr_gad_desc: "Une fortification au sommet d'une colline construite sur les crêtes abruptes des Ghâts occidentaux. Sa position dominante, ses approches abruptes et ses épais murs de pierre le rendent pratiquement imprenable à l'assaut."
 nd_mhr_chauth_kacheri: "Chauth Kacheri"
 nd_mhr_chauth_kacheri_desc: "Un bureau des recettes qui administre la perception du chauth, un quart des revenus du territoire, pour le compte du souverain Maratha."
 nd_mhr_warkari_math: "Mathématiques Warkari"
 nd_mhr_warkari_math_desc: "Un monastère associé à la tradition Warkari de pèlerinage dévotionnel. Centres d'apprentissage de la Bhakti, de poésie abhang et de culte communautaire de Vithoba."
 nd_mhr_tophkhana: "Tophkhana"
 nd_mhr_tophkhana_desc: "Une fonderie d'artillerie produisant des canons et des armes à feu de style européen. Equipé de métallurgistes qualifiés et souvent supervisé par des conseillers étrangers."
 nd_mhr_angre_shipyard: "Chantier naval d'Angre"
 nd_mhr_angre_shipyard_desc: "Un chantier naval sur la côte de Konkan, construit dans la tradition de l'amiral Kanhoji Angre, produisant les gallivats et les bennes qui dominent la côte ouest de l'Inde."
 nd_mhr_peshwa_daftar: "Peshwa Daftar"
 nd_mhr_peshwa_daftar_desc: "La chancellerie administrative du gouvernement Peshwa, qui tient des registres détaillés des revenus, des déploiements militaires et de la correspondance diplomatique."
 nd_mhr_gad_upkeep: "Garnison de Hill Fort"
 nd_mhr_gad_upkeep_desc: "De la pierre pour les murs, des armes pour les défenseurs et du cuir pour les harnais et l'équipement nécessaire à l'entretien de la fortification au sommet de la colline et de sa garnison."
 nd_mhr_kacheri_upkeep: "Administration des recettes"
 nd_mhr_kacheri_upkeep_desc: "Papier pour les registres fiscaux et la correspondance, tissu pour les sceaux et les vêtements officiels, et sel comme moyen standard d'échange administratif."
 nd_mhr_math_upkeep: "Entretien du monastère"
 nd_mhr_math_upkeep_desc: "Du papier pour les textes de dévotion et la poésie abhang, du tissu pour les robes de pèlerin et de la cire d'abeille pour les lampes qui brûlent devant l'image de Vithoba."
 nd_mhr_tophkhana_upkeep: "Opérations de fonderie"
 nd_mhr_tophkhana_upkeep_desc: "Le fer, le cuivre et les armes sont coulés en pièces d'artillerie dans la fonderie."
 nd_mhr_shipyard_upkeep: "Opérations du chantier naval"
 nd_mhr_shipyard_upkeep_desc: "Bois d'œuvre et fournitures navales pour la construction de la coque et le gréement, ainsi que des outils pour les artisans qui construisent et réparent les gallivats et les bennes de la flotte Konkan."
 nd_mhr_daftar_upkeep: "Opérations de la chancellerie"
 nd_mhr_daftar_upkeep_desc: "Du papier pour les volumineux dossiers de l'administration Peshwa, du tissu fin pour le mobilier officiel et l'usage cérémonial, et des livres comme ouvrages de référence pour les administrateurs qualifiés."
 nd_mhr_cotton_weaving_pm: "Tissage De Coton Deccani"
 nd_mhr_cotton_weaving_pm_desc: "Le tissu Deccan est teint et tissé pour fabriquer des textiles raffinés prisés dans le réseau commercial de l'océan Indien."
 nd_mhr_paithani_weaving_pm: "Paithani Weaving"
 nd_mhr_paithani_weaving_pm_desc: "Silk and zari, thread wrapped in gold, are woven on the looms of Paithan and Yeola into the saris of the Peshwa's court, with the flowering vine and the gold coin worked into the border."
 nd_mhr_arms_workshop_pm: "Atelier d'armes de Maratha"
 nd_mhr_arms_workshop_pm_desc: "Les forgerons de Maratha forgent le fer et transforment les armes capturées en armes à feu pour l'armée en expansion."
 a_nd_mhr_silahdar: "Silahdar"
 a_nd_mhr_silahdar_desc: "Infanterie de la milice réformée tirée des hauts plateaux de Maval, entraînée dans des formations améliorées et équipée d'armes standardisées par l'État."
 a_nd_mhr_field_gun: "Canon de campagne Maratha"
 a_nd_mhr_field_gun_desc: "Artillerie de campagne moderne coulée dans les fonderies de Maratha, composée d'artilleurs qualifiés et capable de bombardements soutenus à la manière européenne."
 nd_mhr_bastion_fort: "Bastion Fort"
 nd_mhr_bastion_fort_desc: "Une fortification modernisée combinant la position traditionnelle au sommet d'une colline du Maratha Gad avec des bastions en étoile de style européen et des emplacements de canons inclinés."
 nd_mhr_koshti_karkhana: "Koshti Karkhana"
 nd_mhr_koshti_karkhana_desc: "Un atelier de tisserand où la caste koshti produit de beaux textiles en coton Deccan. Le coton du cœur du Maratha était prisé dans tout le réseau commercial de l'océan Indien."
 nd_mhr_loom_upkeep: "Opérations de métier à tisser"
 nd_mhr_loom_upkeep_desc: "Bois pour les cadres des métiers à tisser et leurs réparations, fibres végétales comme fil brut pour la filature et outils pour l'entretien du matériel de tissage."
 nd_mhr_bastion_upkeep: "Entretien des bastions"
 nd_mhr_bastion_upkeep_desc: "Pierre pour les bastions angulaires, armes pour les emplacements de canons et outils pour réparer les ouvrages défensifs de style européen."
 nd_mhr_deccan_manufactory_pm: "Manufacture Deccan"
 nd_mhr_deccan_manufactory_pm_desc: "Les ateliers Deccan transforment le fer et le tissu en armes finies destinées à un usage domestique et à l'exportation."
 levy_nd_mhr_silahdar: "Prélèvement Silahdar"
 levy_nd_mhr_silahdar_desc: "Des miliciens réformés appelés du cœur des Ghâts occidentaux, équipés et entraînés par l’État."
 levy_nd_mhr_bargir: "Prélèvement de cavalerie de Bargir"
 levy_nd_mhr_bargir_desc: "Cavaliers équipés par l'État, issus des populations soldats et nobles, armés et montés aux frais du gouvernement."
 levy_nd_mhr_mavla: "Mavla Hillmen Prélèvement"
 levy_nd_mhr_mavla_desc: "Des montagnards robustes des Ghâts occidentaux appelés comme infanterie de levée, experts dans les tactiques d'embuscade et la guerre en terrain accidenté."
 nd_mhr_dest_raigad_developed_tt: "We hold #bold Raigarh#! and it has at least 18 development"
 nd_mhr_dest_pune_developed_tt: "We hold #bold Pune#! and it has at least 41 development"
 nd_mhr_formed_tt: "Les Marathes ont été formés"
 nd_mhr_path_a_tt: "Choisissez Ganimi Kava"
 nd_mhr_path_b_tt: "Choisissez Hindavi Swarajya"
 nd_mhr_destiny: "Destin Maratha"
 nd_mhr_destiny_desc: "Avec le Deccan uni sous la bannière Maratha, la voie à suivre diverge. Le Swarajya se situe à la croisée des chemins entre l’épée et la charrue, entre conquête et civilisation."
 nd_mhr_dest_deccan_lord: "Seigneur du Deccan"
 nd_mhr_dest_deccan_lord_desc: "Sécurisez les approches occidentales en vous emparant de Surat et poussez vers Malwa en prenant Gwalior. Avec ces points forts en main, aucune armée ne peut menacer le cœur de Maratha."
 nd_mhr_dest_northern_march: "La marche du Nord"
 nd_mhr_dest_northern_march_desc: "Baji Rao s'est rendu aux portes de Delhi et en est revenu en une seule campagne. Maintenant, rendez-le permanent : plantez le drapeau Maratha à Delhi et sécurisez le plateau de Malwa via Ujjain."
 nd_mhr_dest_hindu_pad_padshahi: "Pad Padshahi hindou"
 nd_mhr_dest_hindu_pad_padshahi_desc: "Le rêve d’un empire hindou s’étendant du Deccan au Pendjab. Prenez Agra et Lahore, commandez la plus grande armée du sous-continent et revendiquez le titre que détenaient autrefois les Moghols."
 nd_mhr_dest_swaraj_foundation: "Fondation de Swaraj"
 nd_mhr_dest_swaraj_foundation_desc: "Before the Marathas can build a lasting civilization, the kingdom needs a seat and a treasury. Raigad, the hill capital where Shivaji was crowned, must be built up, and banking adopted."
 nd_mhr_dest_deccani_prosperity: "La prospérité du Deccani"
 nd_mhr_dest_deccani_prosperity_desc: "Étendez le système chauth au Gujarat en prenant Baroda, remplissez le trésor et assurez-vous que le coton du Deccan circule sur les marchés de la capitale. La richesse est le nerf de l’autonomie."
 nd_mhr_dest_deccani_golden_age: "L'âge d'or du Deccani"
 nd_mhr_dest_deccani_golden_age_desc: "Build a civilization that rivals any on earth: a Deccan of literate citizens, thriving markets, and a cultural tradition that endures for centuries. Raise Pune from a market town into a great city, spread the printing press, and fill the coffers."
 nd_mhr.6.t: "Le destin des Marathes"
 nd_mhr.6.d: "L’État de Maratha a prouvé sa pérennité. Ce qui a commencé comme la rébellion d'un seul chef contre les sultans du Deccan est devenu un royaume établi avec des institutions, des traditions et des ambitions qui vont bien au-delà des Ghâts occidentaux. La question qui occupait la cour de Shivaji (savoir si les Marathes sont des pillards ou des dirigeants) exige désormais une réponse écrite non pas dans le langage du débat, mais dans le langage des actes."
 nd_mhr.6.a: "Notre destin nous attend."
 nd_mhr.7.t: "Seigneur du Deccan"
 nd_mhr.7.d: "Les entrepôts de Surat et la forteresse de Gwalior sont à nous. Les anciens sultanats qui partageaient autrefois ces terres sont brisés et l'étendard Maratha flotte sur les routes commerciales occidentales et sur la porte d'entrée de l'Hindoustan. Chaque commerçant qui passe par Surat rend hommage au Swarajya. Toute armée qui envisage une invasion doit compter avec la forteresse de Gwalior sur ses flancs. Le Deccan n'est plus une frontière contestée : c'est un domaine Maratha."
 nd_mhr.7.a: "Le Deccan s'incline devant le lion Maratha."
 nd_mhr.8.t: "La route vers Delhi"
 nd_mhr.8.d: "Delhi est tombée. La ville qui fut pendant des siècles le siège de la souveraineté musulmane sur l’Hindoustan reconnaît désormais la suprématie des Marathes. Ujjain, l'ancienne capitale du Malwa, sécurise notre flanc ouest. Mais un empire conquis par l’épée doit être détenu par plus que l’épée. Devons-nous rouler comme Baji Rao : rapide, implacable, écrasant nos ennemis avant qu'ils ne puissent réagir ? Ou devons-nous réduire méthodiquement chaque forteresse et point fort, en construisant une chaîne de contrôle incassable du Deccan à la Yamuna ?"
 nd_mhr.8.a: "Roulez comme Baji Rao : frappez avant qu'ils sachent que nous arrivons."
 nd_mhr.8.b: "Chaque fort pris est un fort qui ne peut pas nous menacer."
 nd_mhr.9.t: "Pad Padshahi hindou"
 nd_mhr.9.d: "De l'Indus au Narmada, du Thar au golfe du Bengale, l'empire Maratha contrôle un domaine qui dépasse même les plus grandes ambitions mogholes. Les palais de marbre d'Agra et les temples dorés de Lahore appartiennent désormais aux Marathes. Le Pad Padshahi hindou (la suprématie des rois hindous) n’est plus un rêve murmuré dans les cours de Raigad. C'est la réalité du sous-continent. Mais le pouvoir suprême amène des choix suprêmes. Allons-nous gouverner grâce à la force d’une vaste machine militaire, attirant des mercenaires et des aventuriers du monde entier ? Ou devons-nous construire l’infrastructure commerciale et navale pour soutenir notre empire par le commerce autant que par les armes ?"
 nd_mhr.9.a: "Nos armées seront le pilier de l'empire."
 nd_mhr.9.b: "L’Empire perdure grâce au commerce, et non seulement à la conquête."
 nd_mhr.10.t: "Le fondement de l’autonomie"
 nd_mhr.10.d: "The dream of Hindavi Swarajya was never merely about independence from foreign rule. It was about building a state worthy of its people: one where the revenue systems are fair, the administration is competent, and the wealth of the land serves all who work it. The adoption of modern banking has given the Maratha state financial instruments that rival those of any European power. The palaces, the market street and the reservoirs of Raigad speak louder than any proclamation: this is a civilization that can sustain itself."
 nd_mhr.10.a: "Swarajya repose sur la prospérité de son peuple."
 nd_mhr.11.t: "La prospérité du Deccani"
 nd_mhr.11.d: "Les bureaux Chauth de Baroda collectent des revenus sur les routes commerciales les plus riches du Gujarat. Le coton de la terre noire du Deccan circule à travers nos marchés vers le monde entier. Le trésor déborde. Pune est devenue non seulement une capitale militaire mais aussi un centre de vie intellectuelle : poètes, astronomes et administrateurs se réunissent dans ses cours. Mais la prospérité crée ses propres dilemmes. Devons-nous investir dans la vie de l’esprit, en soutenant les universitaires et en attirant l’expertise étrangère pour développer nos connaissances ? Ou allons-nous investir notre richesse dans le commerce du coton lui-même, en construisant les navires et les ports qui feront du Deccan l’atelier textile de l’océan Indien ?"
 nd_mhr.11.a: "Pune deviendra l'Athènes du Deccan."
 nd_mhr.11.b: "Le coton Deccan habillera le monde."
 nd_mhr.12.t: "L'âge d'or du Deccani"
 nd_mhr.12.d: "What Shivaji planted has grown into a civilization. The Deccan is no longer defined by the empires that conquered it. It is defined by what its own people have built. A literate population reads Marathi poetry and debates governance in coffee houses. The printing press spreads ideas from village to village. The treasury is the envy of kings. Foreign ambassadors come not to dictate terms but to seek alliance. This is the Deccani Golden Age. But how shall it be remembered? As an age of diplomatic mastery and harmonious governance? Or as an age of spiritual and cultural flowering that transcends political boundaries?"
 nd_mhr.12.a: "Nous serons les architectes d’un nouvel ordre."
 nd_mhr.12.b: "Que la lumière du Deccan illumine toutes les confessions."
 STATIC_MODIFIER_NAME_nd_mhr_dest_baji_rao_charge: "La charge de Baji Rao"
 STATIC_MODIFIER_DESC_nd_mhr_dest_baji_rao_charge: "La doctrine de campagne éclair de Baji Rao I : frapper vite, frapper fort et partir avant que l'ennemi puisse organiser une réponse. La vitesse est l’arme de ceux qui sont en infériorité numérique."
 STATIC_MODIFIER_NAME_nd_mhr_dest_strategic_patience: "Patience stratégique"
 STATIC_MODIFIER_DESC_nd_mhr_dest_strategic_patience: "La réduction méthodique des points forts ennemis par un siège prolongé, transformant chaque conquête en une possession inébranlable. La patience gagne ce que la vitesse ne peut pas contenir."
 STATIC_MODIFIER_NAME_nd_mhr_dest_hindu_padshahi: "Padshahi hindou"
 STATIC_MODIFIER_DESC_nd_mhr_dest_hindu_padshahi: "Une vaste machine militaire alimentée par des armées de mercenaires et des soldats professionnels, projetant la puissance Maratha à travers le sous-continent grâce à la simple force des armes."
 STATIC_MODIFIER_NAME_nd_mhr_dest_maratha_imperator: "Imperateur Maratha"
 STATIC_MODIFIER_DESC_nd_mhr_dest_maratha_imperator: "Un empire soutenu par le commerce et la puissance navale autant que par les armées, avec des marchands et des amiraux servant aux côtés des généraux dans l'expansion de la domination de Maratha."
 STATIC_MODIFIER_NAME_nd_mhr_dest_pune_intellectuals: "Intellectuels de Pune"
 STATIC_MODIFIER_DESC_nd_mhr_dest_pune_intellectuals: "Les érudits, astronomes et administrateurs de Pune transforment la capitale Maratha en un centre d'apprentissage qui attire les talents du monde entier de l'océan Indien."
 STATIC_MODIFIER_NAME_nd_mhr_dest_cotton_empire: "Empire du coton"
 STATIC_MODIFIER_DESC_nd_mhr_dest_cotton_empire: "Le coton Deccan, tissé dans les textiles les plus fins et expédié sur les navires Maratha, devient le fondement d'un empire économique qui rivalise avec toute conquête militaire."
 STATIC_MODIFIER_NAME_nd_mhr_dest_deccani_renaissance: "Renaissance Deccani"
 STATIC_MODIFIER_DESC_nd_mhr_dest_deccani_renaissance: "Un épanouissement de l’art de gouverner et de la gouvernance qui intègre divers peuples dans un système de prospérité partagée et d’excellence institutionnelle."
 STATIC_MODIFIER_NAME_nd_mhr_dest_marathi_enlightenment: "Lumières marathi"
 STATIC_MODIFIER_DESC_nd_mhr_dest_marathi_enlightenment: "Les traditions spirituelles et culturelles du mouvement Bhakti se transforment en une philosophie plus large de tolérance religieuse et de renouveau dévotionnel qui transcende les frontières sectaires."
 nd_mhr_maratha_darbar: "Maratha Darbar"
 nd_mhr_maratha_darbar_desc: "La cour impériale de l'empire Maratha, où les Chhatrapati reçoivent l'hommage des rois vassaux et des ambassadeurs étrangers. Un symbole du Pad Padshahi hindou rendu manifeste."
 nd_mhr_darbar_upkeep: "Opérations de la Cour Impériale"
 nd_mhr_darbar_upkeep_desc: "Des tissus fins pour les cérémonies de cour et les réceptions des ambassadeurs, du papier pour les édits impériaux et la correspondance, et des meubles pour la grandeur de la salle du darbar."
 nd_mhr_sharada_peeth: "Sharada Peeth"
 nd_mhr_sharada_peeth_desc: "Une grande académie d'apprentissage dans la tradition de l'ancienne Sharada Peetha, où les érudits étudient la philosophie, l'astronomie, les mathématiques et les arts de la gouvernance."
 nd_mhr_peeth_upkeep: "Entretien de l'Académie"
 nd_mhr_peeth_upkeep_desc: "Des livres pour la bibliothèque, du papier pour les étudiants et les érudits, et du tissu pour les robes et les meubles académiques."
 mhr_ashta_pradhan_bureaucracy: "Ashta Pradhan"
 mhr_ashta_pradhan_bureaucracy_desc: "Le Conseil des huit ministres a été créé par Shivaji Maharaj lors de son couronnement à Raigad le 6 juin 1674. Les Peshwa, Amatya, Mantri, Sachiv, Sumant, Senapati, Nyayadhish et Panditrao se sont vu attribuer chacun des portefeuilles définis : Premier ministre, finances, renseignements, secrétariat, affaires étrangères, militaire, justice et religion. Deux des huit (Nyayadhish et Panditrao) étaient réservés aux castes savantes brahmanes, ancrant la sanction religieuse dans l'institution et transformant l'État Maratha d'une bande de guerre personnelle en une structure constitutionnelle écrite."
 mhr_peshwa_daftar_bureaucracy: "Peshwa Daftar"
 mhr_peshwa_daftar_bureaucracy_desc: "La chancellerie de Pune du ministre héréditaire Peshwa. Originaire de l'Ashta Pradhan de Shivaji en tant que portefeuille unique, la fonction est devenue héréditaire dans la famille Bhat des brahmanes Chitpavan après Balaji Vishwanath (1713-1720) et consolidée en tant que siège de facto de la souveraineté de Maratha sous Bajirao I (1720-1740) et Balaji Bajirao Nanasaheb (1740-1761). Pune a remplacé Satara comme capitale opérationnelle. Les daftar publiaient des sanads, enregistraient les affectations de revenus et acheminaient la correspondance avec les grandes maisons sardar, devenant ainsi l'épine dorsale institutionnelle de la Confédération."
 mhr_saranjami_bureaucracy: "Système Saranjami"
 mhr_saranjami_bureaucracy_desc: "L'analogue marathe du mansabdari, dans lequel l'État attribuait des tranches de revenus (saranjam) aux sardars et aux officiers militaires en lieu et place d'une solde en espèces. Les subventions étaient à l'origine non héréditaires et subordonnées à la poursuite du service militaire, mais sous les derniers Peshwas, elles se sont transformées en propriétés héréditaires des grandes maisons - Holkar à Indore, Scindia à Gwalior, Gaekwad à Baroda. Le système nourrissait à moindre coût les vastes armées de cavalerie de la Confédération, mais affama progressivement le trésor central et limitait les revenus à la loyauté des sardars plutôt qu'au commandement de la couronne."
 mhr_watandari_bureaucracy: "Registre Watandari"
 mhr_watandari_bureaucracy_desc: "L'État de Maratha a hérité de ses prédécesseurs Yadava et Bahmani une couche dense de fonctionnaires villageois héréditaires. Le patil était le chef du village, le kulkarni le comptable du village, et au-dessous d'eux le bara balutedar de douze castes de service traditionnelles. Shivaji a délibérément confirmé ces watans pour lier la noblesse rurale de langue marathi au nouvel État. Les subventions étaient inaliénables et transmissibles, enfermant l'administration fiscale locale entre les mains des lignées Deshmukh et Deshpande existantes : une forme d'autonomie structurelle que les réformateurs de la Couronne ont trouvé presque impossible à déloger."
 mhr_chauth_sardeshmukhi_bureaucracy: "Chauth et Sardeshmukhi"
 mhr_chauth_sardeshmukhi_bureaucracy_desc: "Le double hommage revendique qui a défini l’expansion de Maratha. Le chauth était un prélèvement de 25 % sur les revenus perçus sur les territoires sur lesquels les Marathes revendiquaient une protection, tandis que le sardeshmukhi ajoutait 10 % supplémentaires en tant que droit du chef en chef. Les deux droits ont été extraits par traité de l'empire moghol mourant après la mort de Bahadur Shah et formalisés par Chhatrapati Shahu après 1719. Ils ont financé l'expansion de la Confédération au plus profond du nord de l'Inde, mais ont fait de chaque État tributaire une source de revenus temporaire plutôt qu'une province intégrée, et ont valu aux Marathes une réputation d'extraction prédatrice dans tout l'Hindoustan."
 mhr_huzur_daftar_bureaucracy: "Huzur Daftar"
 mhr_huzur_daftar_bureaucracy_desc: "Le bureau central des archives de Pune, la mémoire institutionnelle de la Confédération. Créé sous les premiers Peshwas et perfectionné sous Nana Phadnavis (1761-1800), le daftar auditait chaque subvention de saranjam, retraçait les revenus du village au trésor et tenait les registres de correspondance qui liaient les maisons sardar au sceau des Peshwa. Les douze années de régence de Nana pour Madhavrao II reposaient entièrement sur sa maîtrise des archives du daftar ; sa mort en 1800 révéla à quel point la Confédération était devenue dépendante de ses archives."
 mhr_pentarchy_bureaucracy: "Pentaarchie de la Confédération"
 mhr_pentarchy_bureaucracy_desc: "La pratique institutionnalisée par laquelle les Peshwa dirigeaient nécessitait la coopération des cinq grandes maisons sardar : Holkar à Indore, Scindia à Gwalior, Bhonsle à Nagpur, Gaekwad à Baroda et le Peshwa lui-même à Pune. Dans les années 1760, ces maisons disposaient de leurs propres armées, menaient leur propre diplomatie et traitaient Pune comme primus inter pares plutôt que souverain. Cet arrangement permettait à la Confédération de projeter son pouvoir sur un immense territoire, mais transformait chaque campagne en négociation de coalition : le désaccord entre les cinq à Panipat en 1761 contribua à la catastrophe."
 AUTO_MODIFIER_NAME_nd_mhr_bureaucracy_authority: "Daftars Maratha"
 AUTO_MODIFIER_DESC_nd_mhr_bureaucracy_authority: "Les daftars de la Confédération (l’Ashta Pradhan à Raigad, la chancellerie des Peshwa à Pune, les registres d’audit du Huzur Daftar) sont devenus un appareil institutionnel permanent. L'État de Maratha n'est plus la bande de guerre personnelle de Shivaji mais une archive écrite des revenus, des nominations et des traités, conservée en continu par les castes de scribes héréditaires."
