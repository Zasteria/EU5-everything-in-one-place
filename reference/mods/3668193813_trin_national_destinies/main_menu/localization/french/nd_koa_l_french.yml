l_french:
 STATIC_MODIFIER_NAME_nd_sword_of_the_cross: "Épée de la Croix"
 STATIC_MODIFIER_DESC_nd_sword_of_the_cross: "La bannière du Christ flotte sur l'Afrique. Nos chevaliers croisés sont les vétérans aguerris d’une guerre sainte, combattant avec la ferveur des hommes qui croient que Dieu marche à leurs côtés. Les forteresses que nous bâtirons seront les remparts de la chrétienté sur un rivage hostile."
 STATIC_MODIFIER_NAME_nd_african_emporium: "Magasin africain"
 STATIC_MODIFIER_DESC_nd_african_emporium: "Les ports de Tunis et Tripoli dominent le détroit de la Méditerranée. Sous la direction chrétienne, ces anciennes villes commerçantes prospèrent à nouveau. Les marchands génois, vénitiens et catalans remplissent nos fondaci de marchandises provenant de trois continents, et les richesses de l'Afrique transitent par nos douanes."
 STATIC_MODIFIER_NAME_nd_koa_bulwark_of_faith: "Rempart de la foi"
 STATIC_MODIFIER_DESC_nd_koa_bulwark_of_faith: "Un réseau de presidios fortifiés garde chaque accès à nos domaines africains. Derrière leurs murs, les colons chrétiens vivent en sécurité et aucun groupe d'attaquants ne passe sans être contesté."
 nd_koa.1.t: "La croix sur le rivage"
 nd_koa.1.d: "The ancient ports of North Africa (Carthage, Tunis, Tripoli) are ours. Where once the armies of Louis the Saint perished in the sands, where the knights of the Barbary Crusade raised their banners before Mahdia, a Christian kingdom now stands on African soil. The Mediterranean is no longer a frontier but a lake, its southern shore secured by the Cross. Yet the question of what this kingdom shall become weighs upon us. Our military orders possess hardened garrisons and mighty fortresses, while the merchant republics of Italy eye our ports with undisguised avarice. Shall we be the sword arm of Christendom in Africa, an unbreakable bulwark against the infidel? Or shall we be the bridge between continents, a trading emporium where the wealth of Africa, Europe, and the Orient mingles in our bazaars?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_koa.1.a: "Dieu Vult ! Nos forteresses ne tomberont jamais !"
 nd_koa.1.b: "Le commerce enrichit là où la conquête ne fait que détruire."
 nd_koa.2.t: "Le réseau Presidio"
 nd_koa.2.d: "Les fortifications côtières de l’Afrique croisée sont passées de palissades rudimentaires à un formidable système de forts étoilés et de présidios fortifiés. De La Goletta gardant les abords de Tunis, aux bastions de Tripoli surplombant le port, chaque forteresse domine son littoral avec des champs de tir imbriqués. Les commandants de garnison entraînent quotidiennement leurs mousquetaires et les murs sont suffisamment épais pour résister aux bombardements des canons de siège ottomans les plus lourds. Les convertis locaux servent aux côtés des soldats européens, liés par une foi commune et sachant que la reddition signifie la mort ou l'esclavage. Ce réseau de presidio est l’épine dorsale de l’Afrique chrétienne, aussi longtemps que ces murs subsisteront, le royaume perdurera."
 nd_koa.2.a: "Qu'ils se brisent sur nos murs comme les vagues sur le rivage."
 nd_koa.2.b: "Transformez nos forteresses en postes de traite."
 nd_koa.3.t: "Marines de l'Ordre"
 nd_koa.3.d: "Les ordres militaires de Crusader Africa reconnaissent depuis longtemps que la survie de leur royaume dépend de la maîtrise de la mer. Un nouveau corps de Marines de l'Ordre a été levé, des soldats d'élite entraînés à combattre du navire au rivage, à escalader les murs des forteresses à partir de chaloupes, à prendre d'assaut les défenses des plages et à mener des raids amphibies le long des côtes hostiles. Issus des postulants les plus jeunes et les plus aptes de l'ordre, ces marines combinent le courage fanatique des chevaliers croisés avec le sens marin pratique des marins méditerranéens. Ils sont le poing de l'Ordre, frappant là où l'ennemi s'y attend le moins."
 nd_koa.3.a: "De la mer au rivage, la Croix avance."
 nd_koa_order_commanderies: "Ribats of the Orders"
 nd_koa_order_commanderies_desc: "The ribats of the Ifriqiyan coast, fortress houses raised by the Aghlabid emirs for warriors under vows, are handed to the brother knights of the crusade. Their walls are kept, their prayer halls are consecrated as chapels, and new houses are built inland on the same plan."
 nd_koa_outremer_sergeants: "Sergents d'Outremer"
 nd_koa_outremer_sergeants_desc: "La tradition des sergents d'armes d'infanterie lourde qui constituent l'épine dorsale des armées de campagne et des forces de garnison des croisés."
 nd_koa_crusader_zeal: "Zèle des croisés"
 nd_koa_crusader_zeal_desc: "La ferveur religieuse qui anime l’État croisé, rendant les guerres contre les païens à la fois moins chères et plus populaires parmi les fidèles."
 nd_koa_pilgrim_routes: "Itinéraires de pèlerinage"
 nd_koa_pilgrim_routes_desc: "La création d'hospices pour pèlerins et de relais le long des routes menant aux lieux saints d'Afrique du Nord, y compris les ruines de l'ancienne Carthage."
 nd_koa_order_discipline: "Discipline de l'ordre"
 nd_koa_order_discipline_desc: "La stricte discipline monastique des ordres militaires, où la prière et l'exercice quotidiens produisent des soldats d'une fermeté exceptionnelle."
 nd_koa_turcopole_tradition: "Tradition Turcopole"
 nd_koa_turcopole_tradition_desc: "La pratique consistant à recruter des convertis locaux et des cavaliers d'héritage mixte comme cavalerie légère, poursuivant la tradition établie pour la première fois dans les États croisés levantins."
 nd_koa_fondaco_network: "The Royal Dogana"
 nd_koa_fondaco_network_desc: "The customs house the Hafsid emirs kept at Tunis, the diwan that the Italians called dogana, is taken over by the crown and copied in every port. All goods landed by foreign merchants pass through it, are taxed there, and are sold under its guarantee."
 nd_koa_african_diocese: "Cathedral Chapters"
 nd_koa_african_diocese_desc: "Cathedrals rise over the ruins of the Roman basilicas at Carthage and Hippo, where Augustine once preached. Their chapters anoint the kingdom's rulers and keep its charters."
 nd_koa_feudal_settlement: "Charters of Settlement"
 nd_koa_feudal_settlement_desc: "Settlers from Sicily, Provence and Catalonia are drawn across the sea by charters of franchise: a house plot and fields held for a fixed rent, and a court of their own burgesses. New villages rise around the old towns of Ifriqiya."
 nd_koa_coral_trade: "Commerce du corail africain"
 nd_koa_coral_trade_desc: "The harvesting and export of precious Mediterranean red coral from the waters off the Barbary Coast, a luxury good in demand across Europe and the East."
 nd_koa_presidio_system: "Système Presidio"
 nd_koa_presidio_system_desc: "Un réseau de points forts côtiers fortifiés, occupés par des soldats professionnels, contrôlant les ports et les abords des villes du royaume."
 nd_koa_corsair_fleet: "Flotte corsaire"
 nd_koa_corsair_fleet_desc: "Une flotte de galères rapides à rames opérant depuis les ports de Tunis et de Tripoli, patrouillant dans les détroits de la Méditerranée et attaquant les navires hostiles."
 nd_koa_mediterranean_trade: "Domination commerciale méditerranéenne"
 nd_koa_mediterranean_trade_desc: "Le contrôle du détroit central de la Méditerranée donne à l’Afrique croisée un levier sur le commerce entre les bassins maritimes est et ouest."
 nd_koa_olive_export: "Exportation d'huile d'olive"
 nd_koa_olive_export_desc: "The fertile lands of Ifriqiya produce abundant olive harvests, and the kingdom's oil presses supply lamp oil and cooking fat to markets across the Mediterranean."
 nd_koa_papal_patronage: "The Crusade Tithe"
 nd_koa_papal_patronage_desc: "As the last active crusader state, Crusader Africa is granted the crusade tithe, a share of church revenues from across Catholic Europe, and the legates of Rome plead its cause at every court."
 nd_koa_local_militia: "Milice locale"
 nd_koa_local_militia_desc: "L'organisation des convertis locaux et des colons de deuxième génération en compagnies de milice pour le service de garnison et la défense territoriale."
 nd_koa_confessional_state: "État confessionnel"
 nd_koa_confessional_state_desc: "Le royaume renforce son identité catholique à l’ère de la Réforme, se positionnant comme un bastion de l’orthodoxie au milieu des bouleversements religieux de l’Europe."
 nd_koa_trans_mediterranean: "Commerce transméditerranéen"
 nd_koa_trans_mediterranean_desc: "Les ports du royaume servent de points de transbordement pour les marchandises circulant entre les économies atlantiques et le commerce levantin, profitant de chaque échange."
 nd_koa_order_reform: "Assizes of the High Court"
 nd_koa_order_reform_desc: "The customs of the kingdom's High Court, where the king sits with his barons after the manner of the old court of Jerusalem, are set down in a written book of assizes. Pleas are heard by the book, and the officers of the crown are named and sworn before the court."
 nd_koa_star_fortification: "Fortification étoilée"
 nd_koa_star_fortification_desc: "Les ingénieurs militaires italiens ont repensé les défenses du royaume selon des principes modernes, en remplaçant les murs médiévaux par des bastions inclinés qui détournent les boulets de canon."
 nd_koa_order_marines: "Ordre des Marines"
 nd_koa_order_marines_desc: "Un corps d'élite de soldats amphibies entraînés aux assauts navals, aux raids côtiers et aux opérations de prise de forteresse."
 nd_koa_colonial_administration: "Administration coloniale"
 nd_koa_colonial_administration_desc: "La transition d’un gouvernement militaire frontalier à une administration coloniale mature avec des tribunaux civils, des collecteurs d’impôts et des gouverneurs de province."
 nd_koa_naval_supremacy: "Suprématie navale africaine"
 nd_koa_naval_supremacy_desc: "La flotte du royaume domine la Méditerranée centrale, ses navires de guerre patrouillant depuis la Sicile jusqu'aux côtes libyennes."
 nd_koa_latin_culture: "Studium of Tunis"
 nd_koa_latin_culture_desc: "The school of Arabic that the Dominicans kept at Tunis in the thirteenth century is refounded as a studium for the whole kingdom. The settlers' sons learn their letters there, and the friars read and translate the Arabic books of the country."
 nd_koa_modern_fortifications: "Fortifications modernes"
 nd_koa_modern_fortifications_desc: "Les ingénieurs du royaume adoptent les dernières avancées scientifiques militaires européennes, créant des ouvrages défensifs à plusieurs niveaux capables de résister à des bombardements soutenus et à des assauts massifs."
 nd_koa_african_granary: "Grenier Africain"
 nd_koa_african_granary_desc: "L’arrière-pays agricole de la Tunisie, autrefois le grenier de Rome, retrouve sa pleine productivité grâce aux méthodes agricoles européennes systématiques."
 nd_koa_enlightened_order: "Ordre éclairé"
 nd_koa_enlightened_order_desc: "Les ordres militaires adhèrent aux principes des Lumières de gouvernance rationnelle, de recherche scientifique et de réforme institutionnelle tout en conservant leurs fondements religieux."
 nd_koa_mediterranean_union: "Union Méditerranéenne"
 nd_koa_mediterranean_union_desc: "La position unique du royaume en tant que pont entre l’Europe et l’Afrique lui permet de négocier des accords diplomatiques et de favoriser la coopération à travers la Méditerranée."
 a_nd_koa_sergeant: "Sergeants of Ifriqiya"
 a_nd_koa_sergeant_desc: "Sergents d'armes blindés qui forment l'épine dorsale de la garnison des croisés. Équipés d'une cotte de mailles, d'un bouclier et d'une épée, ils sont des défenseurs disciplinés de l'avant-poste africain de la chrétienté."
 a_nd_koa_turcopole: "Turcopole africaine"
 a_nd_koa_turcopole_desc: "Des éclaireurs de cavalerie légère recrutés parmi les convertis locaux et les colons d'origine mixte. Rapides, familiers du terrain et mortels avec leur arc et leur javelot, ils sont les yeux et les oreilles du royaume."
 a_nd_koa_presidio_musketeer: "Mousquetaire du Presidio"
 a_nd_koa_presidio_musketeer_desc: "Infanterie de garnison professionnelle armée de mousquets à mèche, entraînée pour défendre les forteresses du Presidio contre les assauts et sortir pour briser les sièges."
 n_nd_koa_corsair_galley: "Galère des Corsaires"
 n_nd_koa_corsair_galley_desc: "Une galère rapide et lourdement armée conçue pour les raids et les patrouilles côtières. Plus rapides que les galères standards et équipés de chasseurs d'étrave supplémentaires, ces navires sont la terreur des navires hostiles."
 a_nd_koa_order_marine: "Commander Marine"
 a_nd_koa_order_marine_desc: "Infanterie amphibie d'élite des ordres militaires, entraînée pour combattre du navire au rivage. Ils prennent d'assaut les plages, escaladent les murs des forteresses depuis des bateaux et mènent des raids loin derrière les lignes ennemies."
 n_nd_koa_order_xebec: "Commander du Xébec"
 n_nd_koa_order_xebec_desc: "Un navire de guerre rapide au gréement latin combinant cuisine et voilier. Favorisé par les marines méditerranéennes pour sa vitesse et son agilité, il excelle en patrouille, en poursuite et en interdiction côtière."
 a_nd_koa_african_spearman: "Lancier de prélèvement africain"
 a_nd_koa_african_spearman_desc: "Des recrues locales armées de lances et de boucliers, issues de la population convertie et des communautés de colons. Ils ne disposent pas de l'équipement des habitués européens mais connaissent le terrain et se battent pour leurs maisons."
 nd_koa_commandery: "Knights' Ribat"
 nd_koa_commandery_desc: "A ribat held by brother knights: a square of walls with a watchtower, a chapel where the prayer hall stood, and cells for the garrison around the court. Men are mustered and drilled within, and the country around looks to it in a siege."
 nd_koa_fondaco: "Dogana"
 nd_koa_fondaco_desc: "The crown's customs house in a port town. Cargoes are weighed and taxed in its court, sold at auction through its sworn interpreters, and the price is guaranteed by its officers. The foreign merchants keep their own fondachi; the dogana is where they must deal."
 nd_koa_coral_fishery: "Coral Fishery"
 nd_koa_coral_fishery_desc: "A station of coral boats on a coast where the red coral grows. A weighted wooden cross hung with nets is dragged over the banks, and the branches it tears loose are sorted and sold to the bead makers of Italy."
 nd_koa_olive_press: "Olive Press"
 nd_koa_olive_press_desc: "A stone mill and press among the groves. The oil is drawn off into jars and carried down to the ports."
 nd_koa_crusader_cathedral: "Cathédrale des Croisés"
 nd_koa_crusader_cathedral_desc: "Grande église construite dans le style roman ou gothique, siège d'un évêque et centre de la mission catholique en Afrique. Ses écoles enseignent le latin, son scriptorium copie des manuscrits et ses cloches appellent les fidèles à la prière."
 nd_koa_presidio: "Forteresse du Presidio"
 nd_koa_presidio_desc: "Forteresse côtière en forme d'étoile, garnie de soldats professionnels, commandant un port ou une approche stratégique. Ses bastions inclinés et ses champs de tir imbriqués le rendent presque imprenable aux assauts conventionnels."
 nd_koa_pilgrim_hospice: "Hospice des pèlerins"
 nd_koa_pilgrim_hospice_desc: "Maison de repos entretenue par les ordres religieux pour les pèlerins, les voyageurs et les malades. Il fournit de la nourriture, un abri et des soins médicaux de base le long des routes de l’Afrique croisée."
 nd_koa_grain_warehouse: "Entrepôt de céréales"
 nd_koa_grain_warehouse_desc: "Un entrepôt fortifié pour la récolte de blé du royaume, facilitant l'exportation en vrac à travers la Méditerranée. Le commerce des céréales a enrichi l’Afrique romaine et les croisés l’ont fait revivre."
 nd_koa_african_academy: "Académie Africaine"
 nd_koa_african_academy_desc: "Une institution d'enseignement fondée par les ordres militaires réformés, combinant l'érudition européenne avec un enseignement pratique en navigation, en ingénierie et en philosophie naturelle."
 nd_koa_coral_harvesting: "Récolte du corail"
 nd_koa_coral_harvesting_desc: "Boats drag the coral banks with nets hung from a wooden cross, consuming timber, hemp and tools."
 nd_koa_olive_pressing: "Pressage de l'huile d'olive"
 nd_koa_olive_pressing_desc: "Stone presses crush the olive harvest of Ifriqiya into oil for export, consuming jars for the oil, tools for the press and the animals that turn the mill."
 levy_nd_koa_turcopole: "Prélèvement sur la Turcopole Africaine"
 levy_nd_koa_turcopole_desc: "Cavalerie légère issue de convertis locaux et de colons d'héritage mixte, servant d'éclaireurs et de tirailleurs pour les armées croisées."
 levy_nd_koa_african_spearman: "Prélèvement sur les lanciers africains"
 levy_nd_koa_african_spearman_desc: "Infanterie de milice issue de la population convertie sédentaire, armée de lances et de boucliers pour la garnison et la défense territoriale."
 nd_koa_commandery_maintenance: "Ribat Upkeep"
 nd_koa_commandery_maintenance_desc: "The walls and tower of the ribat are kept in stone, its armoury in weapons, and its garrison in leather harness."
 nd_koa_fondaco_operations: "Dogana Operations"
 nd_koa_fondaco_operations_desc: "The customs house is kept in paper for its ledgers and receipts, and in cloth and dyes for the sealed bales and marked samples of the auction hall."
 nd_koa_cathedral_maintenance: "Entretien de la cathédrale"
 nd_koa_cathedral_maintenance_desc: "Entretenir la maçonnerie, les besoins liturgiques et les activités savantes d'une cathédrale croisée, nécessitant de la pierre pour la construction, du papier pour le scriptorium et de la cire d'abeille pour les bougies qui brûlent sur chaque autel."
 nd_koa_presidio_upkeep: "Entretien du Présidio"
 nd_koa_presidio_upkeep_desc: "Entretenir les fortifications lourdes et l'armurerie de garnison d'un présidio de défense côtière."
 nd_koa_hospice_operations: "Opérations de soins palliatifs"
 nd_koa_hospice_operations_desc: "Fournir des couvertures en laine, du pain de blé et un abri éclairé aux chandelles aux pèlerins et aux malades dans un hospice en bordure de route le long des routes de l'Afrique croisée."
 nd_koa_warehouse_operations: "Opérations d'entrepôt"
 nd_koa_warehouse_operations_desc: "Stocker et distribuer des céréales pour le commerce méditerranéen, consommer du blé comme marchandise stockée, du bois pour les caisses et les douves de tonneaux, et du sel pour conserver les céréales lors des longs voyages en mer."
 nd_koa_academy_operations: "Opérations de l'Académie"
 nd_koa_academy_operations_desc: "Fournir des livres, du papier et des instruments en verre pour une académie des Lumières combinant l'érudition européenne avec un enseignement en navigation, en ingénierie et en philosophie naturelle."
 STATIC_MODIFIER_NAME_nd_koa_presidio_trade: "Commerce du Presidio"
 STATIC_MODIFIER_DESC_nd_koa_presidio_trade: "Les presidios côtiers remplissent un double objectif : leurs murs protègent non seulement les soldats mais aussi les marchands, et leurs ports deviennent des centres commerciaux prospères où les marchandises africaines et européennes changent de mains."
 nd_koa_formed_tt: "Crusader Africa a été formé"
 nd_koa_path_a_tt: "A choisi l'épée de la croix"
 nd_koa_path_b_tt: "Choisissez l'African Emporium"
 nd_koa_dest_tunis_developed_tt: "We own #bold Tunis#! and its development is at least #bold 47#!"
 nd_koa_dest_tripoli_developed_tt: "We own #bold Tripoli#! and its development is at least #bold 36#!"
 nd_koa_dest_three_ribats_tt: "A #bold Knights' Ribat#! stands in at least #bold 3#! of our locations"
 nd_koa_dest_six_ribats_tt: "A #bold Knights' Ribat#! stands in at least #bold 6#! of our locations"
 nd_koa_destiny: "Destin de l'Afrique croisée"
 nd_koa_destiny_desc: "Le royaume des croisés a été forgé dans le sang et la foi. Maintenant, son destin l'appelle, que ce soit par l'épée ou par le grand livre, l'Afrique croisée laissera sa marque sur le monde."
 nd_koa_dest_sicily: "La tête de pont sicilienne"
 nd_koa_dest_sicily_desc: "Sicily and Malta command the narrows of the Mediterranean. With Syracuse and Malta held, and three ribats garrisoned by the brother knights behind them, no fleet sails between east and west without our leave."
 nd_koa_dest_outremer: "Outremer renaît"
 nd_koa_dest_outremer_desc: "The crusader kingdom reaches beyond Africa. Cyprus, the last outpost of the old Lusignan dynasty, must fly our banner. With Famagusta and Nicosia taken and a chain of six ribats held by the orders, a new Outremer stretches from Africa toward the Levantine shore."
 nd_koa_dest_jerusalem: "Royaume de Jérusalem"
 nd_koa_dest_jerusalem_desc: "The ultimate prize of every crusade is the Holy City itself. With the Cross planted upon the walls of Jerusalem, Acre, Antioch and Tripoli of Syria, the seats of the old crusader states, the dream that began at Clermont is fulfilled."
 nd_koa_dest_narrows: "Maître des Narrows"
 nd_koa_dest_narrows_desc: "Les ports de Tunis et de Tripoli se situent au bord de la Méditerranée, là où toutes les routes commerciales doivent passer. Apportez de la soie sur vos marchés, remplissez votre trésor et prouvez que le commerce est plus puissant que l'épée."
 nd_koa_dest_banking: "La Bourse Africaine"
 nd_koa_dest_banking_desc: "Italian banking houses have established branches in our ports, and the wealth of three continents flows through our customs. Embrace the banking institution and build up Tunis, where the merchant nations keep their fondachi, into the Mediterranean's financial center."
 nd_koa_dest_emporium: "Emporium Mundi"
 nd_koa_dest_emporium_desc: "The ancient dream of a universal emporium, where the goods of Africa, Asia, and Europe change hands in a single marketplace. Seize Alexandria, attract the incense trade, amass a great fortune, and raise Tripoli, where the caravans of the Sahara reach the sea, into a great port."
 nd_koa.4.t: "Un royaume forgé"
 nd_koa.4.d: "L’Afrique croisée se tient debout. Là où les Vandales, les Byzantins et les Normands ont tous essayé et échoué, nous avons créé un royaume chrétien durable sur les rives de l’Ifriqiya. Nos bannières flottent sur les murs de Tunis, nos cloches sonnent sur les minarets que nous avons consacrés en églises et le Pape lui-même a béni notre entreprise. Il ne s’agit pas d’une tête de pont temporaire ; c'est un État, avec des lois, des terres et un destin qui lui est propre."
 nd_koa.4.a: "Notre destin ne fait que commencer."
 nd_koa.5.t: "La chute de la Sicile"
 nd_koa.5.d: "La grande forteresse insulaire de Sicile est tombée aux mains de nos armées. Syracuse, où Archimède a défié Rome, ouvre désormais ses portes à la Croix d'Afrique. Malte, ce rocher aride dans le détroit, est également à nous et, avec elle, la maîtrise de toutes les voies maritimes entre la Méditerranée orientale et occidentale. Nos capitaines de galère rapportent qu'aucune flotte ennemie ne peut franchir les passages siciliens à notre insu et sans notre consentement. La mer centrale est à nous."
 nd_koa.5.a: "Les passages appartiennent au Christ."
 nd_koa.6.t: "Les routes de la soie de la mer"
 nd_koa.6.d: "La soie d'Orient, transportée par les marchands génois et vénitiens, transite désormais par nos ports. Les douanes de Tunis et de Tripoli sont remplies de balles de tissus chatoyants destinées aux marchés de la chrétienté. Notre position au bord de la Méditerranée nous donne un levier sur toutes les routes commerciales, et notre trésor se gonfle des droits que nous collectons."
 nd_koa.6.a: "Laissons les richesses du monde circuler par nos ports."
 nd_koa.7.t: "Le nouvel Outremer"
 nd_koa.7.d: "Chypre est à nous. L'île où Richard Cœur de Lion planta autrefois sa bannière, où les rois Lusignan bâtirent leur royaume condamné, où les Vénitiens s'enrichirent grâce au sucre et au vin, tout cela appartient désormais à la croisade africaine. Notre chaîne de forteresses s’étend de Tripoli à Famagouste, une ligne ininterrompue d’acier chrétien à travers la Méditerranée. La question est maintenant de savoir comment utiliser ce pouvoir. Certains conseillent d’agir immédiatement, en maintenant l’élan de la guerre sainte. D’autres soutiennent que nous devrions creuser, fortifier ce que nous détenons et construire les garnisons qui tiendront ces îles pendant des siècles."
 nd_koa.7.a: "Faites avancer la croisade sans pause."
 nd_koa.7.b: "Fortifiez et mettez en garnison chaque approche."
 nd_koa.8.t: "La connexion lombarde"
 nd_koa.8.d: "Les banques italiennes (florentines, génoises, siennoises) ont ouvert des bureaux permanents dans nos ports, attirées par le volume des échanges commerciaux transitant par les passages africains. Leurs lettres de crédit et leurs lettres de change alimentent les rouages ​​de notre commerce, tandis que leurs capitaux financent de nouveaux entrepôts, quais et halles de marché. Nous sommes à la croisée des chemins quant à la manière de gérer cette richesse. Nous pourrions adopter pleinement le modèle bancaire italien, en adoptant ses instruments financiers sophistiqués et sa politique monétaire saine. Ou nous pourrions exploiter notre position navale de manière plus agressive, en utilisant notre flotte corsaire pour protéger et taxer les voies maritimes de la Méditerranée."
 nd_koa.8.a: "Adoptez le système bancaire italien et une finance saine."
 nd_koa.8.b: "Laissez notre flotte rentabiliser les voies maritimes."
 nd_koa.9.t: "La Croix sur la Ville Sainte"
 nd_koa.9.d: "Jérusalem. Le mot à lui seul vaut plus que mille arguments. La ville où le Christ a marché, où Salomon a bâti son temple, où Godefroy de Bouillon a pleuré des larmes de joie sur ses murs, elle est à nous. La croisade africaine, qui a débuté comme une tête de pont improbable sur les côtes de Tunis, a réalisé ce qu'aucune puissance chrétienne n'a réussi depuis la conquête de Saladin. Acre, Antioche, Jérusalem, tout l'Outremer renaît sous la bannière de l'Afrique croisée. La question se pose désormais : que signifiera cette réalisation ? Une guerre perpétuelle pour étendre le Royaume des Cieux sur Terre ? Ou une paix durable, une Pax Christiana où l'épée est au fourreau et où la Croix règne par la justice ?"
 nd_koa.9.a: "La croisade ne finit jamais. Dieu Vult !"
 nd_koa.9.b: "Bâtissons une paix durable en Terre Sainte."
 nd_koa.10.t: "Magasin du monde"
 nd_koa.10.d: "Le vieux rêve se réalise. Le port d'Alexandrie, autrefois porte d'entrée vers les richesses de l'Orient, bat désormais notre drapeau. L'encens d'Arabie, les épices d'Inde, la soie de Chine, tout cela passe par nos douanes pour se diriger vers les marchés affamés d'Europe. Nos ports sont les plus fréquentés de la Méditerranée, nos commerçants les plus riches, nos banques les plus fiables. La question est maintenant de savoir comment utiliser cette position. Nous pourrions déclarer nos ports libres, ouverts à toutes les nations, exemptés des petits tarifs douaniers et des guerres commerciales qui paralysent le commerce ailleurs. Ou bien nous pourrions exploiter notre position de monopole pour financer des entreprises coloniales au-delà de la Méditerranée, en direction des richesses de l’Atlantique et de l’océan Indien."
 nd_koa.10.a: "Déclarons nos ports ouverts au monde entier."
 nd_koa.10.b: "Financez des entreprises coloniales au-delà de la mer."
 STATIC_MODIFIER_NAME_nd_koa_dest_crusade_momentum: "L'élan de la croisade"
 STATIC_MODIFIER_DESC_nd_koa_dest_crusade_momentum: "La guerre sainte prend un élan imparable, les armées se renforcent rapidement, les fidèles supportent volontiers les coûts de la guerre et le royaume reste stable sous la pression d'une campagne constante."
 STATIC_MODIFIER_NAME_nd_koa_dest_garrison_doctrine: "Doctrine de garnison"
 STATIC_MODIFIER_DESC_nd_koa_dest_garrison_doctrine: "Chaque territoire conquis est immédiatement fortifié et mis en garnison, avec des lignes de ravitaillement étendues pour maintenir les nouvelles positions. La marine est délaissée au profit de cette approche terrestre."
 STATIC_MODIFIER_NAME_nd_koa_dest_kingdom_of_heaven: "Royaume des Cieux"
 STATIC_MODIFIER_DESC_nd_koa_dest_kingdom_of_heaven: "The crusader kingdom claims divine mandate to wage holy war wherever the infidel holds sway. Wars are cheaper to declare and causes for war easier to find, though the kingdom has little patience left for the unbeliever within its own walls."
 STATIC_MODIFIER_NAME_nd_koa_dest_pax_christiana: "Pax Christiana"
 STATIC_MODIFIER_DESC_nd_koa_dest_pax_christiana: "Le royaume croisé impose une paix chrétienne à travers le Levant, soutenue par un levier diplomatique et un vaste réseau de renseignements qui déséquilibre ses rivaux potentiels."
 STATIC_MODIFIER_NAME_nd_koa_dest_lombard_banking: "Banque lombarde"
 STATIC_MODIFIER_DESC_nd_koa_dest_lombard_banking: "L'expertise financière italienne stabilise l'économie du royaume, en offrant des conditions de prêt avantageuses et en maîtrisant l'inflation tout en liant les territoires soumis par une dépendance économique."
 STATIC_MODIFIER_NAME_nd_koa_dest_corsair_commerce: "Commerce corsaire"
 STATIC_MODIFIER_DESC_nd_koa_dest_corsair_commerce: "Les navires de guerre du royaume servent également d'escortes marchandes et d'agents des douanes, garantissant que les voies maritimes restent rentables et que les ravages causés par la piraterie soient rapidement réparés."
 STATIC_MODIFIER_NAME_nd_koa_dest_free_port: "Port franc d'Afrique"
 STATIC_MODIFIER_DESC_nd_koa_dest_free_port: "Les ports de l'Afrique croisée sont déclarés ouverts à toutes les nations, attirant des marchands de tous les coins de la Méditerranée avec des promesses de tarifs bas et de neutralité diplomatique."
 STATIC_MODIFIER_NAME_nd_koa_dest_colonial_enterprise: "Entreprise coloniale"
 STATIC_MODIFIER_DESC_nd_koa_dest_colonial_enterprise: "La richesse du commerce méditerranéen finance les entreprises coloniales au-delà de la mer familière, réduisant les coûts des avant-postes éloignés et étendant la portée commerciale du royaume vers de nouveaux marchés."
 nd_koa_holy_land_command: "Commandement de la Terre Sainte"
 nd_koa_holy_land_command_desc: "Quartier général militaire suprême des ordres croisés en Terre Sainte reconquise, coordonnant la défense des garnisons, le recrutement et la fortification du territoire conquis dans tout l'Outremer."
 nd_koa_command_maintenance: "Entretien des commandes"
 nd_koa_command_maintenance_desc: "Entretenir les fortifications, l'armurerie et l'état-major de commandement du quartier général suprême des croisés, nécessitant de la pierre pour les murs, des armes et des armes à feu pour l'arsenal, et du cuir pour l'équipement."
 nd_koa_mediterranean_exchange: "Bourse Méditerranéenne"
 nd_koa_mediterranean_exchange_desc: "Une grande bourse commerciale où les marchands de toute la Méditerranée font des affaires, échangent des devises et négocient des contrats. Ses halls de marbre et ses salles de comptage sont le cœur battant du commerce africain."
 nd_koa_exchange_operations: "Opérations d'échange"
 nd_koa_exchange_operations_desc: "Exploiter un grand échange commercial, nécessitant du papier pour les contrats et les registres, du tissu pour les étalages des marchands, du verre pour les salles de comptage et des meubles pour les salles de commerce."
