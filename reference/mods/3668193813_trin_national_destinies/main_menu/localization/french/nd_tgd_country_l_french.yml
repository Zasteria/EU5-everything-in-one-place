l_french:
 TGD: "Táng"
 TGD_ADJ: "Táng"
 TGD_f: "Grande saveur"
 TGD_f_desc: "La dynastie Tang a été l'âge d'or cosmopolite de la Chine, lorsque la Route de la Soie traversait Chang'an et que la puissance chinoise se projetait profondément en Asie centrale. Même si la dynastie tomba en 907, son souvenir perdura comme l’idéal ambitieux de l’empire chinois, un royaume défini non pas par des murs mais par des routes, où moines bouddhistes, marchands sogdiens et généraux turcs servaient tous sous la bannière du dragon. Restaurer les Grands Tang signifie réunir le cœur de la Chine avec le corridor occidental et reprendre la maîtrise de la Route de la Soie."
