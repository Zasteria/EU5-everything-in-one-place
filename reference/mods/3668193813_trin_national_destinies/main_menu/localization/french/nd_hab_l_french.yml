l_french:
 STATIC_MODIFIER_NAME_nd_hab_aeiou_dynasty: "AEIOU : à la manière des Habsbourg"
 STATIC_MODIFIER_DESC_nd_hab_aeiou_dynasty: "Alles Erdreich Ist Oesterreich Untertan. Grâce à des mariages stratégiques, des alliances prudentes et une accumulation dynastique, la maison des Habsbourg construit son empire non pas seulement par l'épée, mais par l'autel et la table des traités."
 STATIC_MODIFIER_NAME_nd_hab_antemurale: "Christianitatis antemurale"
 STATIC_MODIFIER_DESC_nd_hab_antemurale: "L’Autriche constitue le rempart de la chrétienté, ses armées étant endurcies par des générations de guerres de frontières contre l’expansion ottomane. La frontière militaire s'étend de l'Adriatique aux Carpates, défendue par une armée professionnelle forgée dans le creuset d'un conflit frontalier perpétuel."
 nd_hab.1.t: "L'essor de l'Autriche"
 nd_hab.1.d: "The disparate Alpine duchies have been forged into a single realm under our rule. From Vienna, we survey lands stretching from the Danube to the mountain passes, a domain built as much by marriage contracts as by martial prowess. The question now is what kind of state Austria shall become.\n\nShall we follow the path of the Habsburgs, patient accumulators of crowns through dynastic union, matchmakers who reshape the map of Europe from the bedchamber and the negotiating table? Or shall we embrace our role as Christendom's shield, pouring our strength into the military frontier that guards Europe's eastern flank against all who would threaten it?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_hab.1.a: "Laissons les autres faire la guerre : nous nous marierons."
 nd_hab.1.b: "Nous sommes le bouclier de la chrétienté."
 nd_hab.2.t: "La sanction pragmatique"
 nd_hab.2.d: "Emperor Charles VI, lacking a male heir, has labored for years to secure recognition that the Habsburg domains may pass undivided to a female successor. The Pragmatic Sanction of 1713 establishes the principle of indivisible succession, but its true test will come when the young Maria Theresa inherits the throne and half of Europe moves to dismember her inheritance.\n\nThe crisis ahead will demand a choice. Do we invest in the legal and diplomatic framework that binds our diverse domains together through dynastic right? Or do we take Maria Theresa's path, rebuilding the army from its foundations, establishing military academies, and forging a modern fighting force that no coalition can overcome?"
 nd_hab.2.a: "La succession doit être garantie par la loi."
 nd_hab.2.b: "La succession doit être assurée par la force."
 STATIC_MODIFIER_NAME_nd_hab_pragmatic_succession: "Succession pragmatique"
 STATIC_MODIFIER_DESC_nd_hab_pragmatic_succession: "La sanction pragmatique lie juridiquement les domaines des Habsbourg. Grâce à la reconnaissance diplomatique et au droit dynastique, l'indivisibilité de notre royaume est garantie."
 STATIC_MODIFIER_NAME_nd_hab_theresian_reform: "Réforme militaire thérésienne"
 STATIC_MODIFIER_DESC_nd_hab_theresian_reform: "Suite au choc provoqué par la perte de la Silésie, Marie-Thérèse a remanié l'armée des Habsbourg. Une formation professionnelle, un équipement standardisé et un corps d’officiers réformé transforment l’armée impériale en une force de combat moderne."
 nd_hab.3.t: "L’État caméraliste"
 nd_hab.3.d: "The science of Cameralism (the systematic study of state administration, fiscal policy, and economic management) has taken root in the universities of the Habsburg lands. Where once revenue collection was haphazard and provincial, a new generation of trained bureaucrats now applies rational principles to governance. The Cameralist chairs established in Vienna and Prague produce administrators who understand mining revenues, trade policy, and population management as interconnected systems.\n\nThis transformation of the Austrian state from feudal patrimony to rationalized administrative machine will define our capacity to compete with the great powers of Europe."
 nd_hab.3.a: "La raison guidera l’État."
 STATIC_MODIFIER_NAME_nd_hab_cameralist_state: "Administration de la liste des caméras"
 STATIC_MODIFIER_DESC_nd_hab_cameralist_state: "Une génération de bureaucrates caméralistes formés à l'université gère désormais les finances, les industries et la population de l'État avec une rationalité systématique."
 nd_hab.4.t: "Le Landsknechte de Maximilien"
 nd_hab.4.d: "Following the devastating Swiss victories at Morat and Nancy, Emperor Maximilian I has commissioned a new type of soldier. Modeled on the fearsome Swiss Reisläufer but loyal to the Habsburg crown, the Landsknechte are professional pike-and-shot infantry organized into Fähnlein of several hundred men. Their front ranks are formed by the Doppelsöldner, experienced soldiers armed with massive Zweihänder swords or arquebuses who earn double pay for standing in the deadliest position.\n\nMaximilian has abolished the crossbow in military use, replacing it entirely with firearms, a bold innovation that puts the Habsburg military at the forefront of the gunpowder revolution. These Landsknechte will become the backbone of Imperial armies across Europe."
 nd_hab.4.a: "Les propres soldats de l’Empereur sont prêts."
 nd_hab_privilegium_maius: "Privilège Maius"
 nd_hab_privilegium_maius_desc: "Les privilèges forgés de Rodolphe IV élèvent le statut de l'Autriche parmi les territoires impériaux, accordant à l'archiduché un statut juridique exceptionnel et une préséance cérémoniale."
 nd_hab_kammergut: "Kammergut"
 nd_hab_kammergut_desc: "The salt of Hallstatt and Aussee is chamber property: it belongs to the prince and to no one else. Queen Elisabeth set the Hallstatt works in order in 1311 and gave the town its pan house, and in time a salt official at Gmunden came to govern the whole district, its miners, its boatmen and its forests, for the sole purpose of filling the ducal pans."
 nd_hab_hofkammer_tradition: "Administration fiscale de la Hofkammer"
 nd_hab_hofkammer_tradition_desc: "La création de la Hofkammer par Ferdinand Ier en 1527 a centralisé la surveillance financière des Habsbourg, contrôlant la monnaie, les revenus miniers, les péages et la fiscalité directe par le biais d'une institution bureaucratique permanente."
 nd_hab_schwaz_silver: "Schwaz Silver et Idria Mercury"
 nd_hab_schwaz_silver_desc: "The great mines of Schwaz in Tyrol, once the largest silver mine in Europe, and the mercury deposits at Idria provide the Habsburgs with revenues that underwrite both armies and diplomacy. Below the mines stand the smelting works, where the silver is parted from the copper ore."
 nd_hab_landsknechte: "Tradition Landsknechte"
 nd_hab_landsknechte_desc: "Les Landsknechte de Maximilien Ier, une infanterie professionnelle de type lance-grenades calquée sur le modèle suisse, constituent l'épine dorsale de la puissance militaire des Habsbourg. Leurs premiers rangs Doppelsldner et l'accent mis sur les armes à feu plutôt que sur les arbalètes marquent une approche révolutionnaire de la guerre."
 nd_hab_festungsbau: "Art de la construction"
 nd_hab_festungsbau_desc: "Les ingénieurs militaires des Habsbourg développent des systèmes de fortification sophistiqués adaptés à la frontière montagneuse, intégrant les principes italiens de la trace italienne dans l'architecture défensive alpine."
 nd_hab_militargrenze_levy: "Grenaille militaire"
 nd_hab_militargrenze_levy_desc: "La frontière militaire, les Militrgrenze, installe des colons croates et serbes le long de la frontière ottomane, leur accordant des terres en échange d'un service militaire perpétuel en tant que milice Grenzer."
 nd_hab_baroque_patronage: "Patronage de la cour baroque"
 nd_hab_baroque_patronage_desc: "La cour de la Contre-Réforme à Vienne devient un centre de la splendeur baroque. Fischer von Erlach, Hildebrandt et leurs successeurs transforment la capitale avec des églises, des palais et des bibliothèques qui projettent la puissance des Habsbourg et la dévotion catholique."
 nd_hab_theresian_academy: "Académie militaire thérésienne"
 nd_hab_theresian_academy_desc: "L'académie militaire de Marie-Thérèse à Wiener Neustadt, le Theresianum, professionnalise le corps des officiers des Habsbourg, formant une nouvelle génération de commandants à la tactique, à la fortification et au leadership."
 nd_hab_kurassiere: "Krassière Impériale"
 nd_hab_kurassiere_desc: "Les régiments de cuirassiers lourds de l'armée des Habsbourg, des cavaliers blindés chargeant au pistolet et au sabre, restent une force de choc dévastatrice sur les champs de bataille européens jusqu'à l'ère de la poudre à canon."
 nd_hab_cameralism: "Institutionnalisation des caméralistes"
 nd_hab_cameralism_desc: "Le caméralisme, la science systématique de la gestion de l’État, est institutionnalisé dans les universités des Habsbourg, formant les bureaucrates à la politique fiscale, à l’administration minière et à la gouvernance économique."
 nd_hab_pragmatic_sanction: "Sanction pragmatique"
 nd_hab_pragmatic_sanction_desc: "La Sanction pragmatique de 1713 établit le fondement juridique de la succession indivisible des domaines des Habsbourg, liant les divers royaumes et duchés sous un seul souverain, quel que soit le sexe du dirigeant."
 a_nd_hab_kurassiere: "Krassière Impériale"
 a_nd_hab_kurassiere_desc: "Cavalerie blindée lourde de l'armée des Habsbourg, chargeant dans les lignes ennemies avec une force de choc dévastatrice. Équipé d'une demi-armure, de pistolets et de sabres lourds."
 a_nd_hab_grenzer_militia: "Milice Grenzer"
 a_nd_hab_grenzer_militia_desc: "Des colons frontaliers croates et serbes qui servent d'infanterie légère sur la frontière militaire, défendant la frontière des Habsbourg contre les raids ottomans en échange de concessions de terres."
 nd_hab_hofkammer: "Chambre Hof"
 nd_hab_hofkammer_desc: "La Chambre du Tribunal, bureau central de l'administration fiscale de l'État des Habsbourg, supervise les revenus miniers, la monnaie, les péages et la perception des impôts par l'intermédiaire d'un personnel bureaucratique permanent."
 nd_hab_hofkammer_administration: "Administration fiscale"
 nd_hab_hofkammer_administration_desc: "Le personnel permanent de commis et d'auditeurs de la Hofkammer tient les grands livres de l'État, produit des dossiers fiscaux détaillés et reçoit des dignitaires en tenue formelle."
 nd_hab_schmelzhuette: "Schmelzhütte"
 nd_hab_schmelzhuette_desc: "A smelting works in the valley below the mine, like the one recorded at Brixlegg from 1463. The ore of Schwaz holds copper and silver together, and here they are parted."
 nd_hab_silver_parting: "Silver Parting"
 nd_hab_silver_parting_desc: "The roasted copper is melted with lead brought over the passes from Bleiberg. The lead takes up the silver and is then burned away on the hearth, and the silver is left."
 nd_hab_pfannhaus: "Pfannhaus"
 nd_hab_pfannhaus_desc: "A ducal pan house. Brine led down from the salt mountain in wooden pipes is boiled dry in a great iron pan, and the salt is packed in conical moulds for the boats that carry it down the Traun."
 nd_hab_brine_boiling: "Brine Boiling"
 nd_hab_brine_boiling_desc: "A pan is fired day and night for weeks at a time and devours whole hillsides of timber, which is why every forest of the Kammergut is reserved for the works."
 nd_hab_festung: "Fête des Habsbourg"
 nd_hab_festung_desc: "Une fortification en étoile construite selon les principes d'ingénierie des Habsbourg, combinant la conception italienne trace italienne avec des adaptations pour la frontière alpine montagneuse."
 nd_hab_festung_upkeep: "Entretien des fortifications"
 nd_hab_festung_upkeep_desc: "La garnison et la maçonnerie de la Festung nécessitent des investissements constants, de la pierre pour les murs et les revêtements, du bois pour les palissades et les ouvrages intérieurs, et des armements pour les défenseurs."
 nd_hab_cameralist_institut: "Institut Caméraliste"
 nd_hab_cameralist_institut_desc: "Un centre d'éducation et de recherche caméraliste, formant des bureaucrates à la science systématique de la gestion de l'État, de la politique fiscale, de l'administration minière, de la réglementation commerciale et de la gouvernance de la population."
 nd_hab_cameralist_research: "Études caméralistes"
 nd_hab_cameralist_research_desc: "L’étude universitaire de la politique fiscale, de la gouvernance économique et des sciences administratives nécessite des textes imprimés, des ouvrages de référence scientifiques et des instruments optiques pour l’observation précise qu’exige la méthode caméraliste."
 nd_hab_theresianum: "Thérésianum"
 nd_hab_theresianum_desc: "Une académie militaire dans la tradition des réformes de Marie-Thérèse à Wiener Neustadt, formant des officiers aux tactiques modernes, à l'ingénierie de siège et au leadership militaire."
 nd_hab_academy_operations: "Opérations de l'Académie"
 nd_hab_academy_operations_desc: "La formation du corps des officiers nécessite des manuels et des cartes pour l'instruction, des armes et du matériel d'exercice pour les exercices sur le terrain, ainsi que du cuir pour les uniformes et l'équipement des chevaux."
 levy_nd_hab_grenzer_militia: "Milice Grenzer"
 levy_nd_hab_grenzer_militia_desc: "Milices frontalières issues des communautés militaires frontalières, endurcies par des générations de raids ottomans et entraînées à la guerre irrégulière sur des terrains montagneux."
 nd_hab_formed_tt: "L'Autriche est formée"
 nd_hab_path_a_tt: "Choisissez AEIOU : à la manière des Habsbourg"
 nd_hab_path_b_tt: "Choisissez Antemurale Christianitatis"
 nd_hab_destiny: "Destin des Habsbourg"
 nd_hab_destiny_desc: "L'Autriche est passée d'un ensemble de duchés alpins à une grande puissance. Le royaume doit maintenant être stabilisé avant que la dynastie puisse poursuivre son ambition ultime, que ce soit à travers l'autel ou l'épée."
 nd_hab_dest_corona: "La couronne de Bohême"
 nd_hab_dest_corona_desc: "Sécurisez la couronne de Bohême, le royaume le plus riche de l'Empire, grâce aux revendications dynastiques et à la diplomatie. Contrôlez Prague et développez un système fiscal sophistiqué via l’institution bancaire."
 nd_hab_dest_burgundia: "L'héritage bourguignon"
 nd_hab_dest_burgundia_desc: "Claim the Burgundian lands in the Low Countries, bringing the wealthy trading cities of Flanders under Habsburg rule. Ghent must be held, and Antwerp held and raised to 49 development: its great markets will finance the dynasty's universal ambitions."
 nd_hab_dest_antwerp_developed_tt: "We own #bold Antwerp#! and its development is at least #bold 49#!"
 nd_hab_dest_monarchia: "Universalis Monarchie"
 nd_hab_dest_monarchia_desc: "Le rêve des Habsbourg devenu réalité, une monarchie universelle s'étendant des Pays-Bas aux duchés italiens, liées entre elles par le droit dynastique, la maîtrise diplomatique et les grands réseaux commerciaux mondiaux."
 nd_hab_dest_ungarn: "La campagne hongroise"
 nd_hab_dest_ungarn_desc: "Buda, l'ancien siège des rois hongrois, doit être placée sous le contrôle des Habsbourg pour ancrer la frontière orientale. Levez une armée puissante et sécurisez le royaume avant de frapper à l’est."
 nd_hab_dest_feldzug: "La grande guerre turque"
 nd_hab_dest_feldzug_desc: "Repoussez la frontière vers le sud, dans les Balkans ottomans. Belgrade, la clé du Danube, doit tomber avant que l'Autriche puisse revendiquer la maîtrise de l'Europe du Sud-Est. Il faut des armées professionnelles."
 nd_hab_dest_bollwerk: "Bollwerk des Glaubens"
 nd_hab_dest_bollwerk_desc: "Austria stands as the unshakeable bulwark of Christendom, its Military Frontier stretching from the Adriatic to the Carpathians. Zagreb must be held, and Karlovac, the star fortress Archduke Charles raised from nothing in 1579 as the seat of the Croatian frontier, held and raised to 28 development."
 nd_hab_dest_karlovac_developed_tt: "We own #bold Karlovac#! and its development is at least #bold 28#!"
 nd_hab.5.t: "Le destin des Habsbourg"
 nd_hab.5.d: "La formation de l’Autriche ne marque pas une fin mais un début. Depuis Vienne, la maison des Habsbourg surveille un royaume qui s'étend au cœur des Alpes, mais le véritable destin de la dynastie se situe au-delà de ces montagnes. Que ce soit par des mariages soignés et une accumulation diplomatique ou par l'épée qui garde la porte orientale de la chrétienté, la voie de l'Autriche est tracée."
 nd_hab.5.a: "Notre destin nous attend."
 nd_hab.6.t: "La couronne de Saint-Venceslas"
 nd_hab.6.d: "The ancient Crown of Bohemia has passed into Habsburg hands. Prague (seat of the Holy Roman Emperor, center of learning and commerce, gateway to the silver mines of Kutna Hora) now answers to Vienna. This is no mere territorial addition but a dynastic revolution. The Bohemian Crown brings with it electoral dignity, vast mineral wealth, and a kingdom whose administrative sophistication rivals any in Europe.\n\nWith Bohemia secured, the dynasty's web of marriages and claims can extend further still, westward to the Burgundian inheritance, southward to the Italian crowns."
 nd_hab.6.a: "Prague et Vienne, unies sous une même couronne."
 nd_hab.7.t: "L'héritage bourguignon"
 nd_hab.7.d: "The great gamble of Habsburg marriage diplomacy has borne its richest fruit. Through the union with the House of Burgundy, the wealthy cities of the Low Countries (Antwerp, Bruges, Ghent) have fallen into Habsburg hands. These are the most commercially sophisticated cities in Europe, their markets handling more trade than entire kingdoms.\n\nThis windfall demands a choice. Do we invest in the diplomatic and institutional apparatus needed to govern such far-flung domains, training a generation of Habsburg administrators and negotiators? Or do we exploit the commercial wealth directly, channeling Flemish trade profits into the treasury and building Austria into a mercantile power?"
 nd_hab.7.a: "Formez les diplomates qui gouverneront un empire."
 nd_hab.7.b: "Canalisez la richesse de la Flandre dans nos coffres."
 STATIC_MODIFIER_NAME_nd_hab_dest_diplomatenakademie: "Académie diplomatique des Habsbourg"
 STATIC_MODIFIER_DESC_nd_hab_dest_diplomatenakademie: "Une génération de diplomates et d’administrateurs formés par les Habsbourg se répand à travers l’Europe, experts dans les arts de la négociation, de la rédaction de traités et de la gouvernance institutionnelle qui maintiennent la cohésion de la monarchie lointaine."
 STATIC_MODIFIER_NAME_nd_hab_dest_handelspolitik: "Handelspolitik des Habsbourg"
 STATIC_MODIFIER_DESC_nd_hab_dest_handelspolitik: "La richesse commerciale des Pays-Bas circule par les canaux des Habsbourg, enrichissant le trésor et transformant l'Autriche d'un État alpin enclavé en une puissance commerciale dont les intérêts s'étendent sur tout le continent."
 nd_hab.8.t: "Universalis Monarchie"
 nd_hab.8.d: "The Habsburg dream approaches its apex. From Brussels to Prague, from Vienna to Milan, the dynasty's possessions girdle Europe. No single family has ever held such an expanse of territory through such diverse means, marriage, inheritance, election, and treaty. The question now is how to govern this extraordinary assemblage of peoples, languages, and faiths.\n\nShall we embrace the principle of cuius regio, eius religio, imposing confessional order while granting enough autonomy to keep the diverse peoples of the monarchy at peace? Or shall we pursue the path of congress diplomacy, making Vienna the capital of European order through negotiation and integration?"
 nd_hab.8.a: "L’ordre par la gouvernance confessionnelle."
 nd_hab.8.b: "Commandez via la diplomatie du Congrès."
 STATIC_MODIFIER_NAME_nd_hab_dest_cuius_regio: "Cuius Regio, Eius Religio"
 STATIC_MODIFIER_DESC_nd_hab_dest_cuius_regio: "Le principe de la coexistence confessionnelle maintient l'ordre dans les domaines des Habsbourg. La tolérance religieuse, combinée à un contrôle administratif ferme, permet à la monarchie de gouverner ses divers peuples sans fracture."
 STATIC_MODIFIER_NAME_nd_hab_dest_kongressdiplomatie: "Congrèsdiplomatie"
 STATIC_MODIFIER_DESC_nd_hab_dest_kongressdiplomatie: "Vienne est devenue la capitale diplomatique de l'Europe. Grâce à des congrès, des traités et de patientes négociations, les Habsbourg maintiennent l'ordre dans leurs vastes domaines et façonnent l'équilibre des pouvoirs du continent."
 nd_hab.9.t: "La chute de Buda"
 nd_hab.9.d: "Habsburg armies have entered Buda, the ancient capital of the Hungarian kingdom. For generations this fortress city on the Danube served as the seat of the Arpad and Angevin kings before falling to Ottoman conquest. Now it flies the Habsburg banner once more.\n\nThe reconquest of Hungary transforms the strategic map. Austria is no longer a frontier state cowering behind the Leitha. It is the dominant power of the middle Danube, with the military capacity to project force deep into the Balkans."
 nd_hab.9.a: "La Hongrie est libérée. La frontière avance."
 nd_hab.10.t: "La grande guerre turque"
 nd_hab.10.d: "Belgrade has fallen. The 'White Fortress' (key to the Danube, gateway to the Ottoman Balkans) is in Habsburg hands. Prince Eugene's campaigns have shattered Ottoman power in Hungary and pushed the frontier deep into Serbia. This is the greatest victory Christendom has won against the Ottomans since Lepanto.\n\nThe question now is how to consolidate these vast conquests. Do we invest in logistics and supply infrastructure, building the road networks and depots that will sustain future campaigns and allow the devastated borderlands to recover? Or do we perfect the art of siege warfare that won Belgrade, ensuring our engineers and artillerists remain the finest in Europe?"
 nd_hab.10.a: "Construisez les routes qui soutiennent un empire."
 nd_hab.10.b: "Perfectionnez la science de la guerre de forteresse."
 STATIC_MODIFIER_NAME_nd_hab_dest_versorgungslinie: "Kaiserliche Versorgungslinien"
 STATIC_MODIFIER_DESC_nd_hab_dest_versorgungslinie: "Un réseau de routes militaires, de dépôts de ravitaillement et de voies de transport fluvial soutient les armées des Habsbourg sur le vaste théâtre danubien, permettant un renforcement et une récupération rapides des zones frontalières ravagées par la guerre."
 STATIC_MODIFIER_NAME_nd_hab_dest_belagerungskunst: "Belagerungskunst"
 STATIC_MODIFIER_DESC_nd_hab_dest_belagerungskunst: "Les ingénieurs militaires des Habsbourg ont perfectionné l’art de la guerre de siège scientifique. Leurs batteries d'artillerie et leur approche de la réduction des forteresses sont les meilleures d'Europe, même si le maintien d'une telle expertise met à rude épreuve la trésorerie."
 nd_hab.11.t: "Bollwerk des Glaubens"
 nd_hab.11.d: "Austria stands as the undisputed shield of Christendom. The Military Frontier stretches unbroken from the Adriatic to the Carpathians, manned by generations of Grenzer settlers who know no life but war. Behind this living wall, the Habsburg domains have grown into a great power whose armies have broken every threat from the east.\n\nThis achievement demands a final choice. Do we embrace the crusading spirit that drove us here, sanctifying our wars, cheapening our casus belli against the infidel, and steeling our people for perpetual struggle? Or do we turn inward, imposing imperial order on the conquered lands, building schools and courts that will civilize the frontier and make it truly ours?"
 nd_hab.11.a: "La croisade est éternelle."
 nd_hab.11.b: "La frontière doit être gouvernée et non simplement tenue."
 STATIC_MODIFIER_NAME_nd_hab_dest_kreuzzugsgeist: "Kreuzzugsgeist"
 STATIC_MODIFIER_DESC_nd_hab_dest_kreuzzugsgeist: "L’esprit de croisade brûle dans l’État des Habsbourg. Les guerres contre ceux qui ont des croyances différentes sont peu coûteuses, le moral reste élevé grâce à de longues campagnes et la cause de la chrétienté fournit une justification infinie pour de nouvelles conquêtes."
 STATIC_MODIFIER_NAME_nd_hab_dest_kaiserliche_ordnung: "Ordnung Kaiserliche"
 STATIC_MODIFIER_DESC_nd_hab_dest_kaiserliche_ordnung: "L'ordre impérial remplace la loi martiale sur la frontière conquise. Les écoles, les tribunaux et les bureaux administratifs transforment les frontières sauvages en provinces productives, même si le passage des raids au gouvernement réduit le butin de guerre."
 nd_hab_hofburg: "Chancellerie de la Hofburg"
 nd_hab_hofburg_desc: "Le grand palais-chancellerie de la monarchie universelle des Habsbourg, abritant le corps diplomatique, les archives d'État et l'appareil administratif qui gouverne des domaines couvrant la moitié de l'Europe."
 nd_hab_hofburg_chancellery: "Administration de la Chancellerie"
 nd_hab_hofburg_chancellery_desc: "Le vaste appareil diplomatique et administratif de la Hofburg nécessite un approvisionnement constant en papier pour les traités et la correspondance, en tissus fins pour la tenue officielle, en mobilier pour les chambres d'État et en verrerie pour les réceptions diplomatiques."
 nd_hab_grenzfestung: "Fête de Grenz"
 nd_hab_grenzfestung_desc: "Un complexe de forteresses majeur de la frontière militaire, ancrant la ligne défensive des Habsbourg avec de lourdes fortifications, une garnison permanente et des stocks d'armements contre toute incursion orientale."
 nd_hab_grenzfestung_garrison: "Garnison frontière"
 nd_hab_grenzfestung_garrison_desc: "Le maintien de la Grenzfestung nécessite des armes pour la garnison, de la pierre pour le renforcement constant des murs et des bastions, du bois pour les palissades et les travaux intérieurs, et du cuir pour l'équipement et les harnais."

 # === Bureaucracies ===
 AUTO_MODIFIER_NAME_nd_hab_bureaucracy_authority: "Monarchie composite des Habsbourg"
 AUTO_MODIFIER_DESC_nd_hab_bureaucracy_authority: "The proclamation of the Austrian monarchy fixes its institutional framework. From Vienna the quartermaster general's staff plans the campaigns, the Privy Conference decides on war and peace, the Hungarian Cancellaria mediates with the Magyar magnates, the Landlibell arms the valleys of Tyrol, and a generation of cameralist reformers prepares to remake the realm. The composite monarchy may now choose which of its administrative bodies to entrench."
 hab_hofkriegsrat_bureaucracy: "Generalquartiermeisterstab"
 hab_hofkriegsrat_bureaucracy_desc: "The quartermaster general's staff, created in the Seven Years' War after the defeat at Leuthen in 1757, with Franz Moritz von Lacy as chief of staff to Field Marshal Daun. Its officers chose the camps, laid out the marches and kept the maps, and after the war they surveyed the monarchy sheet by sheet. A campaign was no longer improvised by its commander: a trained staff planned it for him, and the generals of the next generation were schooled in its rooms."
 hab_geheime_konferenz_bureaucracy: "Conférence Geheime"
 hab_geheime_konferenz_bureaucracy_desc: "The Privy Conference, evolved from Ferdinand I's Geheimer Rat and given its classical form by Leopold I after 1665, when the old council had grown too large to keep a secret. A small inner council of five to seven hand-picked grandees (Auersperg, Lobkowitz, Schwarzenberg, later Kaunitz) deliberated on dynastic marriages, war and peace, and the Spanish succession. Its protocols, preserved in the Haus-, Hof- und Staatsarchiv, became the chief register of Habsburg high diplomacy and the school in which generations of imperial statesmen were trained."
 hab_hungarian_cancellaria_bureaucracy: "Cancellaria hongroise"
 hab_hungarian_cancellaria_bureaucracy_desc: "La Magyar Udvari Kancellaria, la chancellerie distincte de la cour hongroise établie à Pozsony et confirmée par la Diète de 1606. La noblesse hongroise refusa d'être administrée par la Hofkanzlei de langue allemande à Vienne ; la Cancellaria a conservé la doctrine constitutionnelle selon laquelle la Hongrie était un regnum independens, uni à l'Autriche uniquement en la personne du roi. La couronne a acheté la stabilité auprès des magnats magyars au prix d'une double administration permanente."
 hab_militaergrenze_bureaucracy: "Tiroler Landlibell"
 hab_militaergrenze_bureaucracy_desc: "The defence ordinance that Maximilian I gave the county of Tyrol on 23 June 1511. The estates of the land, its peasants and towns among them, were bound to field from 5,000 to 20,000 men according to the danger, and every able man could be called out behind them. In return they served only inside Tyrol, and no war that touched the land was to be begun without their consent. The valleys kept their own companies of marksmen under it for centuries."
 hab_directorium_bureaucracy: "Directoire dans Publicis et Cameralibus"
 hab_directorium_bureaucracy_desc: "L'administration centrale imposée par Friedrich Wilhelm Graf von Haugwitz le 2 mai 1749 après la perte de la Silésie révéla la faillite du financement successoral. Le Directoire subordonnait les Hofkanzleien et la Hofkammer de Bohême et d'Autriche en un seul collège, centralisant l'évaluation des impôts, l'attribution des quotas de recrutement et le cadastre thérésien. Le Landstnde provincial a perdu son veto constitutionnel sur la Contributionale ; Les Kreishauptleute salariés permanents remplaçaient les nobles collecteurs d'impôts à la campagne."
 hab_josephinismus_bureaucracy: "Joséphinisme"
 hab_josephinismus_bureaucracy_desc: "Le programme de réforme josephiniste de 1780 à 1790, centré sur le brevet de tolérance du 13 octobre 1781 (reconnaissant les confessions luthérienne, calviniste et gréco-orthodoxe) ainsi que l'édit de tolérance pour les juifs de 1782, l'abolition du servage personnel en 1781 et la dissolution des monastères contemplatifs avec leurs dotations redirigées vers une paroisse finançant le Religionsfond. prêtres et écoles primaires. Joseph II a gouverné par décret par l'intermédiaire des Hofstellen, déplaçant la prélature et les diètes successorales au profit du caméralist Beamte formé au Theresianum."
