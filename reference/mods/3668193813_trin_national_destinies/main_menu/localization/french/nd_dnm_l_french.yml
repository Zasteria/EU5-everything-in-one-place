 # ----- DESTINY ADVANCES -----
 nd_dnm_destiny: "Le destin danubien"
 nd_dnm_destiny_desc: "Trois couronnes sont forgées en un seul royaume ; ce que deviendra le royaume n’est pas encore décidé. Le choix fondateur (le rempart de la chrétienté ou la monarchie totale) ouvre un chemin sur lequel la dynastie passera ses siècles à parcourir."
 nd_dnm_dest_sava_line: "La longue guerre turque"
 nd_dnm_dest_sava_line_desc: "Press the Ottoman frontier back to the Sava-Danube confluence: build the Militaergrenze, hold Belgrade and rebuild it as a fortress town, and take Smederevo, the keys to the river line Eugene of Savoy would one day hold (Antemurale path)."
 nd_dnm_dest_balkan_drive: "La route vers les Balkans"
 nd_dnm_dest_balkan_drive_desc: "Carry the Grenzer spearhead past the rivers into the Ottoman interior: Niš on the Morava, Skopje on the Vardar, and Sofia behind the Balkan range, with the Kleinkrieg doctrine, the small war of the borderland, actually adopted. The bulwark turned offensive."
 nd_dnm_dest_eastern_crusade: "La croisade orientale"
 nd_dnm_dest_eastern_crusade_desc: "Le rempart devient le conquérant : prenez les principautés danubiennes de Bucarest et de Trgoviete et portez la guerre jusqu'à Constantinople même. Débloque le Bastion Antemurale."
 nd_dnm_dest_cameral_foundation: "La Fondation Caméral"
 nd_dnm_dest_cameral_foundation_desc: "Une centralisation mesurée en fonctions, pas en conquête : embrasser la banque et les armées professionnelles, et développer le royaume à l'échelle qu'une seule administration peut porter (voie Gesamtmonarchie)."
 nd_dnm_dest_united_treasury: "Le Trésor Uni"
 nd_dnm_dest_united_treasury_desc: "La Hofkammer a rendu absolu : un trésor de couronnes sur trois couronnes, un trésor de guerre plein, un royaume développé et l'argent des mines des Carpates coulant dans un seul fisc."
 nd_dnm_dest_total_monarchy: "La monarchie totale"
 nd_dnm_dest_total_monarchy_desc: "Le point culminant du projet centralisateur : un État danubien riche, stable, éclairé, à administration unique, avec les domaines liés à la machine. Débloque la Staatskanzlei. (Le compromis sur la double monarchie n’est pas atteint ici : ce calcul appartient à la question des nationalités.)"
 nd_dnm_dest_josephine_triumph: "The Josephine Triumph"
 nd_dnm_dest_josephine_triumph_desc: "One patent, one code, from the Vltava to the Tisza: the uniform administrative state completed where Joseph II's historical programme was fought to a draw, and what the United Chancellery only attempted, finished. Impossible for a crown that has already lost a constituent kingdom. Unlocks the Uniform Patent reform."
 nd_dnm_dest_estates_endure: "The Estates Endure"
 nd_dnm_dest_estates_endure_desc: "The other answer to the same question: the Golden Bull's right to be asked, formalized instead of abolished. The Landstaende, the estate assemblies' own apparatus, must be the one actually running. Unlocks the Diet in Council reform."

 # ----- DESTINY AMBITION LINES (allow custom_tooltips; the requirement is the advertisement) -----
 nd_dnm_amb_root_tt: "The union holds itself together (Stability at least 75)"
 nd_dnm_amb_sava_tt: "The Frontier is built, and Belgrade answers to Vienna, not Constantinople (the destiny root is taken)"
 nd_dnm_amb_balkan_tt: "The small war doctrine carries the Grenzer past the rivers, into the Morava and Vardar valleys (the Sava Line is held and the Kleinkrieg doctrine adopted)"
 nd_dnm_amb_crusade_tt: "The Sultan's throne stands empty or answers to Vienna: the Balkan drive is complete, and the Ottoman state no longer exists or is our [subject|e]"
 nd_dnm_amb_cameral_tt: "The Hofkammer's writ actually runs (the destiny root is taken and the Kameralhoheit bureaucracy is active)"
 nd_dnm_amb_treasury_tt: "Silver moves through a crown fisc, not three (the Cameral Foundation is laid and the Vienna Hofkammer advance taken)"
 nd_dnm_amb_total_tt: "The fisc and the confessional commission both answer to one hand (the United Treasury is complete; the Kameralhoheit and Reformationskommission bureaucracies are both active)"
 nd_dnm_amb_patent_tt: "One patent, one code, from the Vltava to the Tisza (the Directorium bureaucracy is active and no constituent kingdom has been lost)"
 nd_dnm_amb_diet_tt: "The Landtags keep their old right to be asked (the Landstaende bureaucracy is active)"

 # ----- THE DANUBIAN RECKONING (age-6 capstone government reforms) -----
 nd_dnm_uniform_patent_reform: "The Uniform Patent"
 nd_dnm_uniform_patent_reform_desc: "A single administrative code and a single chancery language across every crown land, imposed by patent from Vienna. What Joseph II decreed and the estates refused, this crown has made stick.\n\nGrants +10% legislative efficiency and +15% assimilation speed; the nobles' estates never forgive the override of their privilege."
 nd_dnm_diet_in_council_reform: "The Diet in Council"
 nd_dnm_diet_in_council_reform_desc: "The old right to be asked, the Golden Bull's ius resistendi, formalized as a permanent constitutional organ instead of the abolition Pressburg imposed in 1687. The diets sit in council, and the crown legislates with them, not past them.\n\nGrants -8% separatism and +10% subject loyalty; crown legislation slows because the diets must actually be consulted."

 # ----- DESTINY DHE EVENTS -----
 nd_dnm.6.t: "Le destin du Danube"
 nd_dnm.6.d: "Le royaume est forgé et le choix fondateur est fait. À partir de là, le chemin est long : la dynastie passera les siècles de son règne à concrétiser ce qui a été choisi lors de sa fondation. Le tribunal comprend le travail à accomplir et les objectifs par lesquels il sera mesuré."
 nd_dnm.6.d.hun: "The realm is forged, and it is the Crown of Saint Stephen that forged it. The oldest of the three crowns, the one whose Golden Bull taught its nobles the right to resist, has gathered Austria and Bohemia under its own institutions. The road ahead is long, and the diets of Hungary will expect to be asked at every step of it. The court understands the work ahead, and the goals by which it will be measured."
 nd_dnm.6.d.boh: "The realm is forged, and it is the Crown of Saint Wenceslas that forged it. Bohemia has carried its electoral dignity out of the Reich to build something greater on the Danube, and the college it left sits a vote short because of it. The road ahead is long. The court understands the work ahead, and the goals by which it will be measured."
 nd_dnm.6.a: "Que le travail commence"
 nd_dnm.7.t: "La frontière restaurée"
 nd_dnm.7.d: "Belgrade et Smederevo sont à nous, ainsi que le confluent Sava-Danube. La frontière est là où Eugène de Savoie la tracera un jour : non pas une ligne fortifiée sur une carte mais un pays récupéré, la porte d'où toute nouvelle guerre contre la Porte doit être lancée. L’armée qui a fait cela ne se retire pas."
 nd_dnm.7.a: "La ligne fluviale est tenue"
 nd_dnm.8.t: "À travers les rivières"
 nd_dnm.8.d: "The spearhead has carried past the rivers into the Ottoman interior. The Morava valley, Skopje on the Vardar, Sofia behind the Balkan range: the bulwark is no longer a shield but a blade pressed into the heart of Rumelia. How the war is now waged will decide how far the blade reaches."
 nd_dnm.8.a: "Prenez d'assaut la ceinture de forteresse : assiégez et réduisez les forteresses."
 nd_dnm.8.b: "La méthode Grenzer : une guerre de mouvement, de raid et de poursuite"
 nd_dnm.9.t: "L'épée de la chrétienté"
 nd_dnm.9.d: "Bucarest, Trgoviete et les murs de Constantinople lui-même. L’œuvre du rempart est achevée : la monarchie danubienne est l’épée qui a finalement renversé la marée ottomane, la première puissance catholique d’Orient. Que fait une victoire aussi totale ?"
 nd_dnm.9.a: "Le rempart couronné : qui traverse toute la chrétienté"
 nd_dnm.9.b: "L'armée conquérante : une armée qui vit de ses conquêtes"
 nd_dnm.10.t: "La Fondation Caméral"
 nd_dnm.10.d: "Aucune armée n’a gagné cela. Le nouveau savoir administratif de l’époque (la banque, l’armée professionnelle permanente, les terres arpentées et aménagées) a été attiré dans le royaume et les bureaux construits pour le porter. La Gesamtmonarchie a désormais une épine dorsale de papier et de registres plutôt que de garnisons."
 nd_dnm.10.a: "Les bureaux sont construits"
 nd_dnm.11.t: "Le Trésor Uni"
 nd_dnm.11.d: "La Hofkammer est rendue absolue : un trésor sur trois couronnes, un trésor de guerre plein, l'argent de Kremnica et le fer d'Erzberg coulant dans un seul fisc. La monarchie composite devient, pour la première fois, un corps économique unique. Comment la nouvelle richesse sera-t-elle détenue ?"
 nd_dnm.11.a: "Le fisc de la Couronne : des recettes directement attirées vers le centre"
 nd_dnm.11.b: "Le marché du Danube : le fleuve comme une économie intégrée"
 nd_dnm.12.t: "La monarchie totale"
 nd_dnm.12.d: "Le projet atteint son apogée : un royaume riche, stable, instruit et éclairé, administré d'une seule main, les domaines étant liés à la machine plutôt que opposés à elle. L’État du Danube est, pendant une génération, presque une monarchie moderne unique. Le compromis des nationalités est un règlement encore à venir ; c'est l'instrument centralisateur qui doit le précéder."
 nd_dnm.12.a: "La main du caméraliste - les domaines soudés à la machine"
 nd_dnm.12.b: "L’État éclairé : alphabétisé, étudié et gouverné de manière unique"

 # ----- CAPSTONE DHE EVENTS (nd_dnm.49 / .50) -----
 nd_dnm.49.t: "The Patent Enforced"
 nd_dnm.49.d: "The couriers carry the same document to every chancery from the Vltava to the Tisza, and for the first time in the realm's history, every chancery files it the same way. One code, one language of administration, one crown behind both. What Joseph's generation decreed and the estates refused has been made to hold. The House of Austria, which forged its own electoral dignity when the Reich denied it one, has now forged something the Reich never managed: a state that answers with one voice."
 nd_dnm.49.d.hun: "The couriers carry the same document to every chancery from the Vltava to the Tisza, and for the first time in the realm's history, every chancery files it the same way. One code, one language of administration, one crown behind both. That it is the Crown of Saint Stephen (the crown whose Golden Bull taught its nobles the right to resist) that has now written the resisters out of the procedure is an irony the diets of Hungary will chew on for a century. The patent is enforced all the same."
 nd_dnm.49.d.boh: "The couriers carry the same document to every chancery from the Vltava to the Tisza, and for the first time in the realm's history, every chancery files it the same way. One code, one language of administration, one crown behind both. The Crown of Saint Wenceslas once cast one of seven votes in another empire's elections; it has concluded that administering its own, uniformly, is the better use of a founding dignity. The patent is enforced."
 nd_dnm.49.a: "One patent, one code, one crown"
 nd_dnm.50.t: "The Old Rights Kept"
 nd_dnm.50.d: "The diets sit in council: not as supplicants received at the crown's pleasure, but as an organ of the constitution itself. The old right to be asked, which other courts spent the age abolishing, has been kept and formalized: the crown legislates with the Landtags, not past them. The House of Austria has concluded that a realm of many nations holds together longest when each of them is, on the record, consulted."
 nd_dnm.50.d.hun: "The diets sit in council: not as supplicants received at the crown's pleasure, but as an organ of the constitution itself. The old right to be asked has been kept and formalized, and no one is less surprised than the diets of Hungary: the Crown of Saint Stephen was arguing with its own Golden Bull five centuries before it forged this union, and it has simply written its oldest habit into the constitution of the whole Danube."
 nd_dnm.50.d.boh: "The diets sit in council: not as supplicants received at the crown's pleasure, but as an organ of the constitution itself. The old right to be asked has been kept and formalized. The Crown of Saint Wenceslas, whose estates were once broken in an afternoon on the White Mountain of another history, has chosen to be the crown that asks, and the Landtags of every crown land answer."
 nd_dnm.50.a: "The crown asks; the Landtags answer"

 # ----- DESTINY TIMED MODIFIERS -----
 STATIC_MODIFIER_NAME_nd_dnm_dest_breaker_of_walls: "Briseur de murs"
 STATIC_MODIFIER_DESC_nd_dnm_dest_breaker_of_walls: "L'armée d'assaut des forteresses de l'offensive des Balkans : prompte à prendre l'initiative, longue à sa portée et endurcie par la tradition gagnée à chaque brèche."
 STATIC_MODIFIER_NAME_nd_dnm_dest_grenzer_tide: "La marée Grenzer"
 STATIC_MODIFIER_DESC_nd_dnm_dest_grenzer_tide: "The war of movement and raid carried into the Ottoman interior, the borderers swift and pursuing, though a war fought on the move loosens the crown's grip on the countryside it crosses."
 STATIC_MODIFIER_NAME_nd_dnm_dest_sword_of_christendom: "L'épée de la chrétienté"
 STATIC_MODIFIER_DESC_nd_dnm_dest_sword_of_christendom: "Le rempart couronné : la portée diplomatique de la première puissance catholique d'Orient, la renommée durement gagnée de son armée perdure, son prestige lent à s'estomper."
 STATIC_MODIFIER_NAME_nd_dnm_dest_conquering_host: "L'hôte conquérant"
 STATIC_MODIFIER_DESC_nd_dnm_dest_conquering_host: "Une armée qui recrute et se reconstitue à partir des terres qu’elle conquiert et met en garnison ce qu’elle détient : ​​le moteur d’une guerre soutenue à l’Est."
 STATIC_MODIFIER_NAME_nd_dnm_dest_crown_fisc: "Le Fisc de la Couronne"
 STATIC_MODIFIER_DESC_nd_dnm_dest_crown_fisc: "Les revenus sont directement versés au trésor central : l'or des mines des Carpates et l'impôt sur les successions de trois couronnes - bien qu'une couronne axée sur le fisc lésine sur l'entretien de son train de canons."
 STATIC_MODIFIER_NAME_nd_dnm_dest_danube_market: "Le marché du Danube"
 STATIC_MODIFIER_DESC_nd_dnm_dest_danube_market: "Le fleuve s'est soudé en un seul corps commercial intégré : l'économie de base de trois couronnes, ses marchands et ses centres commerciaux portant un seul marché danubien."
 STATIC_MODIFIER_NAME_nd_dnm_dest_cameralist_hand: "La main du caméraliste"
 STATIC_MODIFIER_DESC_nd_dnm_dest_cameralist_hand: "Les classes sociales se sont liées à la machine plutôt que contre elle : l'emprise de la couronne sur le royaume ne glisse pas et l'appareil bureaucratique fonctionne à bas prix."
 STATIC_MODIFIER_NAME_nd_dnm_dest_enlightened_state: "L'État éclairé"
 STATIC_MODIFIER_DESC_nd_dnm_dest_enlightened_state: "Un royaume lettré, surveillé et administré par un seul : l'école Joséphine a mené à sa conclusion, le nouvel apprentissage de l'époque à moindre coût."

 # ----- DESTINY BUILDINGS -----
 nd_dnm_antemurale_bastion: "Bastion Antemural"
 nd_dnm_antemurale_bastion_desc: "La grande forteresse-arsenal frontière du rempart de la chrétienté - le fort étoilé des classes Peterwardein et Belgrade avec son magasin, la charnière sur laquelle tourne toute la guerre ottomane."
 nd_dnm_staatskanzlei: "Rue principale"
 nd_dnm_staatskanzlei_desc: "La Chancellerie d'État : l'organe central de la monarchie totale, l'appareil qui rédige, classe et administre tout le royaume d'une seule main. L’instrument de la centralisation : et non du compromis qui pourrait un jour la suivre."

 # ----- DESTINY BUILDING MAINTENANCE PMs -----
 nd_dnm_bastion_maintenance: "Garnison du Bastion"
 nd_dnm_bastion_maintenance_desc: "La garnison permanente, les équipes d'artillerie et les magasins de magazines qui maintiennent l'arsenal-forteresse frontière en état de combat."
 nd_dnm_staatskanzlei_maintenance: "Personnel de la chancellerie"
 nd_dnm_staatskanzlei_maintenance_desc: "Les greffiers, les registres et la papeterie de la Chancellerie centrale de l'État qui administre tout le royaume."

 # ===== BUREAUCRACIES =====

 nd_dnm_kameralhoheit_bureaucracy: "Chambre haute"
 nd_dnm_kameralhoheit_bureaucracy_desc: "Lorsque Ferdinand Ier rendit la Hofkammer de Vienne indépendante du Conseil aulique en 1527, il réunit les chambres foncières de Basse-Autriche, du Tyrol, de Bohême et de Hongrie sous un seul fisc ; Marie-Thérèse l'a élevé au rang d'autorité suprême en matière de finances, de mines et de commerce. Les revenus que les domaines de la couronne avaient autrefois votés et audités étaient désormais évalués à partir de Vienne - un fisc qui couvre l'exploitation minière et le commerce pour la couronne, mais qui se décompose en commis à la recherche de rentes et en une monnaie dégradée lorsque la chambre est affamée."
 nd_dnm_geheime_konferenz_bureaucracy: "Conférence Geheime"
 nd_dnm_geheime_konferenz_bureaucracy_desc: "Under Leopold I a handful of trusted magnates, the Conferenzminister, formed the inner cabinet that actually decided war, peace and dynastic policy, its secretaries drawn from the Austrian and Imperial chancelleries. Fast and secret, it bound the high aristocracy to the dynasty and bypassed the wider Privy Council entirely, but it was a closed door to the towns, and when neglected it curdles into a faction nest that stalls all cabinet work."
 nd_dnm_grenz_generalat_bureaucracy: "Grenz-Généralat"
 nd_dnm_grenz_generalat_bureaucracy_desc: "Depuis le congrès de Bruck de 1578, les terres de l'Autriche intérieure financèrent un cordon permanent ; les généralats de Karlovac et de Varazdin dirigeaient une société de soldats-colons serbes, croates et valaques sous régime héréditaire, exonérés d'impôt et tolérés, en échange d'un service frontalier à vie. Un mur auto-alimenté de miliciens libres responsables devant Vienne et non devant n'importe quel seigneur - mais une frontière non rémunérée et non gouvernée se transforme en pillage et en désertion. Nécessite la frontière militaire."
 nd_dnm_landstaende_bureaucracy: "Landstaende der Erblande"
 nd_dnm_landstaende_bureaucracy_desc: "Les chancelleries distinctes d'Autriche, de Bohême et de Hongrie à Vienne ont chacune préservé la loi, la langue et le Landtag de leur couronne ; les diètes continuèrent à voter les impôts et les recrues et à protéger les privilèges nobles contre la pression absolutiste, le comitatus hongrois le plus obstinément de tous. Le consentement circule lorsque les successions sont honorées et que la législation passe par les diètes ; négligés, les régimes alimentaires font obstacle, il faut leur arracher la guerre et le composite se désagrège."
 nd_dnm_directorium_bureaucracy: "Directoire in publicis et cameralibus"
 nd_dnm_directorium_bureaucracy_desc: "Après Aix-la-Chapelle, Friedrich Wilhelm von Haugwitz fusionna les chancelleries autrichiennes et bohèmes en un seul organisme chargé des affaires publiques et des finances en 1749, réduisit les régimes des terres de la couronne et imposa une réduction fiscale décennale uniforme sur les terres héréditaires. Le moteur institutionnel de la Gesamtmonarchie : une administration sur plusieurs couronnes, les populations assimilées en un seul État; mais un État uniforme à moitié construit n'est qu'un fardeau administratif plus lourd et une noblesse bouillonnante et dépossédée. Nécessite la Chancellerie de la Cour Unie."
 nd_dnm_reformationskommission_bureaucracy: "Commission de réforme"
 nd_dnm_reformationskommission_bureaucracy_desc: "Ferdinand II's patents of 1624-27 permitted only the Catholic faith in Bohemia and Inner Austria; the religious commissions expelled Protestant clergy while the Jesuits, with Peter Pazmany on the Hungarian side, monopolized higher education and re-Catholicized the recovered lands. Confessional unity schooled a loyal clerical elite and fed dynastic legitimacy, but a coercive apparatus without the colleges to back it merely breeds resentment in the towns and a hostile coalition abroad. Requires a Catholic ruler."

 # The auto-modifier governing the bureaucracy slot grant on formation
 AUTO_MODIFIER_NAME_nd_dnm_bureaucracy_authority: "Autorité bureaucratique"
 AUTO_MODIFIER_DESC_nd_dnm_bureaucracy_authority: "The Danubian Monarchy has the authority to host the historical institutions of the Habsburg composite state. Three of its six institutions can be kept standing at once."

