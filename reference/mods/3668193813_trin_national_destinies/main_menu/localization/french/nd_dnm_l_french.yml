 # NQ exit actions (crisis-lifecycle audit)
 nd_dnm_break_the_leagues: "Break the Nationalist Leagues"
 nd_dnm_break_the_leagues_desc: "Control has been clawed back across the home lands. The leagues that fed the crisis can be broken in detail, the moment the court has the will."
