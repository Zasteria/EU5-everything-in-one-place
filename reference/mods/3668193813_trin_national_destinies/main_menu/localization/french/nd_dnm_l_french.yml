 # ===== FORMATION EVENT =====
 nd_dnm.1.t: "Les couronnes du Danube"
 nd_dnm.1.d: "It is done. The hereditary lands, the Crown of Saint Wenceslas and the Crown of Saint Stephen have walked out of the Holy Roman Empire together, and the imperial dignity has been laid down. The electors meet without us; the Pope's legates ride for Vienna with grievances; in the German lands the Reich is left to the princes. We have what no Emperor bound to the Reichstag could ever hold: Austria, Bohemia and Hungary as one sovereign realm, answerable to no diet but our own court.\n\nBut a realm of Germans, Czechs, Magyars, Croats, Slovaks and a dozen more is not yet a monarchy. What binds it?\n\n#bold Antemurale Christianitatis#! makes the Danube the shield of Christendom: the Military Frontier, the Grenzer soldier-colonies, the endless Ottoman war that gives every crown a common enemy and a common cause.\n\n#bold Gesamtmonarchie#! makes the Danube one body: the Hofkammer, the Hofkriegsrat, the Pragmatic Sanction welding three chanceries into a single obedient administrative state.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_dnm.1.a: "Antemurale Christianitatis : soyez le rempart de la chrétienté"
 nd_dnm.1.b: "Gesamtmonarchie: weld three crowns into one body"

 # ===== HERITAGE DHE EVENTS =====
 nd_dnm.2.t: "La frontière militaire"
 nd_dnm.2.d: "Le long de la Sava, de la Drava et du Bas-Danube, un nouveau type de société prend forme. Les familles serbes, croates et valaques sont installées à la frontière selon un régime foncier héréditaire : libres de droits féodaux, libres dans leur foi, mais liés hommes et garçons à un service militaire perpétuel. La Militaergrenze n’est pas une ligne de forteresse mais un mur vivant de soldats-agriculteurs, la plus grande population militarisée d’Europe, surveillant la frontière ottomane du berceau à la tombe. La question est de savoir que faire d’une armée permanente qui ne se dissout jamais."
 nd_dnm.2.a: "Un fer de lance : enfoncer la ligne vers le sud, sur les terres ottomanes"
 nd_dnm.2.b: "Un bouclier - installez la ligne profondément et laissez-la se maintenir"
 nd_dnm.3.t: "La Montagne Blanche"
 nd_dnm.3.d: "Un matin de novembre, près de Prague, l'armée des États de Bohême est brisée en un seul après-midi. Le Roi de l'Hiver s'enfuit ; vingt-sept chefs de la révolte sont exécutés sur la place de la Vieille Ville ; la monarchie élective de Saint Venceslas est abolie par la Verneuerte Landesordnung et la couronne déclarée héréditaire, catholique et habsbourgeoise. Un tiers du territoire de Bohême change de mains. Aucun jour n’a fait autant pour forger la monarchie composite ni y laisser une blessure plus profonde."
 nd_dnm.3.a: "Re-catholiciser par brevet : une foi, imposée d’en haut"
 nd_dnm.3.b: "Liez une nouvelle noblesse - une fidélité achetée avec des terres confisquées"
 nd_dnm.4.t: "La sanction pragmatique"
 nd_dnm.4.d: "Charles VI has no son, and he will not let the work of two centuries be partitioned at his death. Crown by crown, diet by diet, the Pragmatic Sanction is ratified: the Habsburg lands shall descend #italic indivisibiliter ac inseparabiliter#! (indivisible and inseparable) as one body to a single heir, daughter or son. For the first time Austria, Bohemia and Hungary are not three crowns in one hand but one legal person. It is the constitutional spine of the Gesamtmonarchie. It is also the document the next war will be fought over."
 nd_dnm.4.a: "Un royaume, un héritier, indivisible et inséparable"
 nd_dnm.5.t: "Les réformes thérésiennes"
 nd_dnm.5.d: "La Silésie est perdue, et cette perte est un verdict : un royaume qui ne peut pas taxer ni forer ne peut pas se défendre. De Vienne, la réforme descend comme une marée : un trésor unifié, le Directoire, les cantons de conscription, le Theresianum pour former les hommes qui le dirigeront. Là où Marie-Thérèse construit la machine, Joseph II la pousse au-delà de ses limites : le Toleranzpatent, une langue de chancellerie unique, le serf affranchi par décret. Pour une génération, la monarchie composite est presque un État."
 nd_dnm.5.a: "La machine caméraliste : taxée, forée, gouvernée de manière centralisée"
 nd_dnm.5.b: "La portée de Joséphine : tolérance, alphabétisation, une seule bureaucratie"

 # ===== FORMATION TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_dnm_antemurale_christianitatis: "Christianitatis antemurale"
 STATIC_MODIFIER_DESC_nd_dnm_antemurale_christianitatis: "The shield of Christendom on the Danube. The Military Frontier and the Grenzer soldier-colonies make the realm a wall of men against the Ottomans, and standing as the bulwark of the faith wins prestige across Catholic Europe, at the cost of a court forever tied up provisioning the frontier."
 STATIC_MODIFIER_NAME_nd_dnm_gesamtmonarchie: "Monarchie générale"
 STATIC_MODIFIER_DESC_nd_dnm_gesamtmonarchie: "The total monarchy. The Hofkammer, the Hofkriegsrat and the Pragmatic Sanction weld three crowns into one obedient administrative body, taxed and integrated from Vienna, at the cost of the estates' and the imperial diet's resentment of the centralizing court."

 # ===== HERITAGE DHE TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_dnm_frontier_spearhead: "Fer de lance de la frontière"
 STATIC_MODIFIER_DESC_nd_dnm_frontier_spearhead: "La frontière militaire s'est tournée vers l'extérieur : le Grenzer comme lance de reconquête poussant la ligne ottomane vers le sud."
 STATIC_MODIFIER_NAME_nd_dnm_frontier_shield: "Bouclier de frontière"
 STATIC_MODIFIER_DESC_nd_dnm_frontier_shield: "La frontière militaire est profondément ancrée et autonome, un mur incassable qui se nourrit et s’auto-entretient."
 STATIC_MODIFIER_NAME_nd_dnm_verneuerte_ordnung: "Verneuerte Landesordnung"
 STATIC_MODIFIER_DESC_nd_dnm_verneuerte_ordnung: "L'Église et la constitution de Bohême refaites par brevet impérial, la Contre-Réforme imposée d'en haut."
 STATIC_MODIFIER_NAME_nd_dnm_loyal_aristocracy: "Aristocratie loyale"
 STATIC_MODIFIER_DESC_nd_dnm_loyal_aristocracy: "Une nouvelle noblesse de service liée à la couronne avec les domaines confisqués des rebelles de White Mountain."
 STATIC_MODIFIER_NAME_nd_dnm_indivisible_realm: "Royaume indivisible"
 STATIC_MODIFIER_DESC_nd_dnm_indivisible_realm: "La Sanction pragmatique ratifiée couronne par couronne : les Habsbourg possèdent un corps juridique, un héritage, une loyauté."
 STATIC_MODIFIER_NAME_nd_dnm_theresian_machine: "La machine thérésienne"
 STATIC_MODIFIER_DESC_nd_dnm_theresian_machine: "The cameralist reform of Maria Theresa: a unified treasury, the Directorium, the conscription cantons: the composite monarchy run as a single state."
 STATIC_MODIFIER_NAME_nd_dnm_josephine_reach: "Le Bief Joséphine"
 STATIC_MODIFIER_DESC_nd_dnm_josephine_reach: "La portée éclairée de Joseph II : le Toleranzpatent, une langue de chancellerie unique, une bureaucratie multiethnique instruite."

 # ===== ADVANCES =====
 nd_dnm_bella_gerant_alii: "Bella Gerant Alii"
 nd_dnm_bella_gerant_alii_desc: "\"Let others wage war; you, happy Austria, marry.\" Burgundy, Castile, Bohemia and Hungary all came to the House of Habsburg by inheritance and marriage, not conquest. Dynastic diplomacy is the founding instrument of the Danube state."
 nd_dnm_hofkammer: "La Hofkammer de Vienne"
 nd_dnm_hofkammer_desc: "La Chambre centrale du tribunal, fondée en 1527, a réuni à Vienne les trésors de Basse-Autriche, du Tyrol, de Bohême et de Hongrie : la première colonne vertébrale financière de la monarchie composite. Débloque la Hofkammer."
 nd_dnm_hofkriegsrat: "Le Hofkriegsrat"
 nd_dnm_hofkriegsrat_desc: "Le Conseil de Guerre de Cour de 1556, la première administration militaire centrale permanente en Europe : il planifia la guerre ottomane, construisit les forteresses et paya l'armée de trois couronnes à partir d'un seul bureau."
 nd_dnm_huszar: "Le Huszar Hongrois"
 nd_dnm_huszar_desc: "Le cheval léger de la couronne hongroise, élevé contre les pillards ottomans akinci et copié par toutes les armées d'Europe en 1700. Débloque la levée des Huszar hongrois."
 nd_dnm_danube_staple: "L'incontournable du Danube"
 nd_dnm_danube_staple_desc: "Le Stapelrecht médiéval de Vienne obligeait tous les bateaux sur le fleuve à arrêter leurs marchandises et leurs échanges commerciaux au siège impérial : l'institution qui a fait du Danube une artère commerciale unique. Débloque le Donau-Stapel."
 nd_dnm_militaergrenze: "Les Militaergrenze"
 nd_dnm_militaergrenze_desc: "La frontière militaire : les colons serbes, croates et valaques ont établi la ligne Sava-Drava sous un régime héréditaire pour un service frontalier perpétuel. Débloque le quartier Frontière et le prélèvement Grenzer."
 nd_dnm_kleinkrieg: "La doctrine Kleinkrieg"
 nd_dnm_kleinkrieg_desc: "La petite guerre des frontières - embuscades, raids et escarmouches à travers le terrain accidenté du Danube, les embarcations irrégulières qui fabriquaient les Grenzer, les hajduks et les pandurs redoutés de la Sava au Banat."
 nd_dnm_jesuit_colleges: "La frontière confessionnelle"
 nd_dnm_jesuit_colleges_desc: "La Contre-Réforme a poussé le Danube sur le dos des collèges jésuites de Vienne, Graz, Olomouc et Tyrnau, qui ont recatholicisé et éduqué les couronnes récupérées. Débloque le Collège des Jésuites."
 nd_dnm_donau_flottille: "La Donau-Flottille"
 nd_dnm_donau_flottille_desc: "La flottille de guerre impériale du Danube : les galères Tschaike qui combattirent la flotte fluviale ottomane de Komorn à Belgrade. Débloque le prélèvement Tschaike."
 nd_dnm_renewed_constitution: "La Constitution renouvelée"
 nd_dnm_renewed_constitution_desc: "La Verneuerte Landesordnung de 1627 : après la Montagne Blanche, la couronne de Bohême devint héréditaire des Habsbourg, catholique et administrée par l'Allemagne, et la monarchie élective abolie. L’acte fondateur de centralisation de la monarchie composite."
 nd_dnm_kuerassier: "Le Kuerassier des Habsbourg"
 nd_dnm_kuerassier_desc: "La cavalerie lourde à poitrine d'acier, l'arme de choc décisive de l'armée impériale de Lützen jusqu'au champ de bataille ottoman. Débloque le prélèvement Kuerassier."
 nd_dnm_kaiserliche_armee: "L'armée impériale permanente"
 nd_dnm_kaiserliche_armee_desc: "La Kaiserliche Armee : la première armée multinationale permanente du continent, payée par la Hofkammer et entraînée par le Hofkriegsrat. Débloque l'Arsenal Impérial."
 nd_dnm_erblande_mercantilism: "Erblande Mercantilisme"
 nd_dnm_erblande_mercantilism_desc: "Le développement caméraliste des terres héréditaires : la manufacture de laine de Linz, le mercure d'Idrija, le fer styrien de l'Erzberg expédié par le Danube vers les marchés du royaume."
 nd_dnm_pragmatic_sanction: "La sanction pragmatique"
 nd_dnm_pragmatic_sanction_desc: "Le décret de 1713, ratifié couronne par couronne : les terres des Habsbourg descendront indivisibiliter ac inseparabiliter comme un seul corps à un seul héritier. L'épine dorsale constitutionnelle de la Gesamtmonarchie."
 nd_dnm_theresian_reforms: "Les réformes thérésiennes"
 nd_dnm_theresian_reforms_desc: "La réforme qui suivit la perte de la Silésie : un trésor unifié, le Directoire et les cantons de conscription transformèrent la monarchie composite en une machine administrative."
 nd_dnm_theresianum: "Le Thérésianum"
 nd_dnm_theresianum_desc: "L'académie caméralle fondée à Vienne en 1746 pour former la bureaucratie multiethnique de la Gesamtmonarchie dans une seule main administrative et une seule langue de chancellerie. Débloque le Theresianum."
 nd_dnm_banat_colonization: "La colonisation du Banat"
 nd_dnm_banat_colonization_desc: "The Schwabenzuege: the great resettlement of the reconquered, depopulated Banat and Backa with Danube-Swabian colonists after the Treaty of Passarowitz, restoring a wasted frontier to cultivation."
 nd_dnm_liechtenstein_artillery: "L'artillerie liechtensteinoise"
 nd_dnm_liechtenstein_artillery_desc: "La réforme de l'artillerie du prince Joseph Wenzel du Liechtenstein : un système de canon mobile standardisé qui a fait du train impérial l'artillerie la mieux équipée d'Europe. Débloque le prélèvement du train d'artillerie."
 nd_dnm_grenzer_line: "La Konzivilisation"
 nd_dnm_grenzer_line_desc: "La conversion en ligne régulière des régiments Frontier : le Grenzer refait en tant qu'infanterie européenne entraînée, quelque chose entre la lumière et la ligne, appréciée sur tous les théâtres des guerres impériales."
 nd_dnm_united_chancellery: "La Chancellerie de la Cour Unie"
 nd_dnm_united_chancellery_desc: "La Vereinigte Hofkanzlei : la tentative de fusionner les chancelleries autrichiennes et tchèques en un seul organe administratif, point culminant du projet centralisateur."
 nd_dnm_danube_steam: "Navigation à vapeur sur le Danube"
 nd_dnm_danube_steam_desc: "L'Erste Donau-Dampfschiffahrts-Gesellschaft, la compagnie maritime qui a transformé le fleuve en l'épine dorsale d'une économie industrielle danubienne unique, de Ratisbonne aux Portes de Fer. Débloque le chantier à vapeur du Danube."

 # ===== UNITS =====
 a_nd_dnm_huszar_levy: "Hussar hongrois"
 a_nd_dnm_huszar_levy_desc: "Les chevaux légers de la couronne hongroise : des raiders rapides et à grande portée, nés de la guerre frontalière ottomane, pillant et dissimulant à un rythme qu'aucune cavalerie lourde ne pouvait égaler."
 a_nd_dnm_grenzer_levy: "Grenzer"
 a_nd_dnm_grenzer_levy_desc: "Soldats-colons militaires des frontières. Frontaliers serbes, croates et valaques, maîtres des embuscades et des escarmouches sur le terrain accidenté de la Sava-Drava, combattant léger et vivant de peu."
 n_nd_dnm_tschaike_levy: "Tschaïké"
 n_nd_dnm_tschaike_levy_desc: "La galère fluviale à faible tirant d'eau de la flottille de guerre du Danube, avec pour équipage le Tschaikisten, qui combattit la flotte ottomane de Komorn jusqu'à Belgrade."
 a_nd_dnm_kuerassier_levy: "Habsbourg Kuerassier"
 a_nd_dnm_kuerassier_levy_desc: "La cavalerie lourde à poitrine d'acier, l'arme de choc décisive de l'armée impériale - une charge de noblesse blindée lancée au point de rupture de la ligne."
 a_nd_dnm_artillery_train_levy: "Train d'artillerie du Liechtenstein"
 a_nd_dnm_artillery_train_levy_desc: "The standardized, mobile Imperial gun system of the Liechtenstein reform, the best-served artillery in Europe by the Napoleonic wars. Its light carriages keep pace with the infantry."

 # ===== BUILDINGS =====
 nd_dnm_hofkammer_building: "Chambre Hof"
 nd_dnm_hofkammer_building_desc: "The central Court Chamber, Vienna 1527: the treasury that pulled the chambers of every crown into one hand. The financial spine of the Gesamtmonarchie."
 nd_dnm_donau_stapel: "Donau-Stapel"
 nd_dnm_donau_stapel_desc: "La maison principale du Danube, où le Stapelrecht de Vienne a forcé tous les bateaux sur le fleuve à interrompre leurs marchandises et leurs échanges commerciaux, faisant du fleuve une artère commerciale."
 nd_dnm_militaergrenze_building: "Grenaille militaire"
 nd_dnm_militaergrenze_building_desc: "Un district de frontière militaire : des colonies de soldats et de colons sous régime foncier héréditaire pour un service frontalier perpétuel, la plus grande société militarisée du début de l'Europe moderne."
 nd_dnm_jesuit_college: "Collège des Jésuites"
 nd_dnm_jesuit_college_desc: "A college of the Society of Jesus (Vienna, Graz, Olomouc, Tyrnau), the engine of the Counter-Reformation and the school of the recovered crowns."
 nd_dnm_imperial_arsenal: "Arsenal Impérial"
 nd_dnm_imperial_arsenal_desc: "Le Kaiserliches Zeughaus - l'armurerie centrale et la fonderie de l'armée impériale permanente, fondant les canons et stockant les mousquets à trois couronnes."
 nd_dnm_theresianum_building: "Thérésianum"
 nd_dnm_theresianum_building_desc: "L'académie caméralle de Vienne, 1746, qui formait la bureaucratie multiethnique de la monarchie composite dans une seule main administrative."
 nd_dnm_danube_steam_yard: "Chantier à vapeur du Danube"
 nd_dnm_danube_steam_yard_desc: "Une œuvre de la Compagnie de navigation à vapeur du Danube, transformant le fleuve en l'épine dorsale d'une économie industrielle danubienne unique, de Ratisbonne aux Portes de Fer."

 # ==========================================================================
 # ===== DESTINY TREE =====
