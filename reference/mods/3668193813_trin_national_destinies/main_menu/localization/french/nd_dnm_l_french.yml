 # ===== CRISIS: disaster / situation display names =====
 nd_dnm_nationalities_question: "La question des nationalités"
 nd_dnm_nationalities_question_desc: "Our house rules a patchwork of peoples and no single nation. Magyars, Czechs, Poles, Croats and Romanians each look to their own tongue and their own past, and governing all of them from one chancery in Vienna has become more than the chancery can bear..."
 nd_dnm_pragmatic_sanction_crisis: "La guerre de succession"
 nd_dnm_pragmatic_sanction_crisis_desc: "The inheritance we declared indivisible is being contested by force. Powers that set their seal to the Pragmatic Sanction now press their claims with armies, a coalition gathers against the dynasty, and the crowns of our own realm wait to see whether we can hold what was left to us..."
 nd_dnm_reaction_of_the_reich: "La réaction du Reich"
 nd_dnm_reaction_of_the_reich_desc: "The House of Austria has taken its crowns out of the [GetUniqueInternationalOrganization('hre').GetName] and raised a monarchy of its own upon the Danube. The [GetUniqueInternationalOrganization('hre').GetLeaderTitle] has named the new state apostate, and the [ShowSpecialStatusName('curia')] withholds the blessing it granted that house for three centuries. Across the Empire the princes are watching to see whether the Reich can still punish one of its own who walks away..."
 nd_dnm_reaction_of_the_reich_tt: "The Reich shuns the Danubian monarchy for walking out of the Empire"

 # ===== CRISIS: modifier names / descriptions =====
 STATIC_MODIFIER_NAME_nd_dnm_reich_pariah: "Boudé par le Reich"
 STATIC_MODIFIER_DESC_nd_dnm_reich_pariah: "L'Empereur et la Curie traitent l'apostat danubien comme un paria."
 STATIC_MODIFIER_NAME_nd_dnm_austria_hungary: "Autriche-Hongrie"
 STATIC_MODIFIER_DESC_nd_dnm_austria_hungary: "Le compromis : deux royaumes coégaux, une dynastie. Les nationalités sont liées à l’empire par consentement plutôt que par la baïonnette."
 STATIC_MODIFIER_NAME_nd_dnm_centralized_reassertion: "L’État uniforme"
 STATIC_MODIFIER_DESC_nd_dnm_centralized_reassertion: "The diets are broken and rule is made uniform from Vienna, at the price of a lasting reservoir of resentment."
 STATIC_MODIFIER_NAME_nd_dnm_fractured_realm: "Le royaume fracturé"
 STATIC_MODIFIER_DESC_nd_dnm_fractured_realm: "Une couronne a échappé à la dynastie ; le corps composite saigne de légitimité et de cohésion."
 STATIC_MODIFIER_NAME_nd_dnm_sanction_vindicated: "Indivisibiliter ac Inseparabiliter"
 STATIC_MODIFIER_DESC_nd_dnm_sanction_vindicated: "La sanction pragmatique contre le monde en armes ; l'héritage indivisible est désormais incontestable."
 STATIC_MODIFIER_NAME_nd_dnm_sanction_broken: "La sanction brisée"
 STATIC_MODIFIER_DESC_nd_dnm_sanction_broken: "La guerre de succession a arraché le territoire et le prestige du royaume ; l’héritage indivisible s’est avéré divisible après tout."
 STATIC_MODIFIER_NAME_nd_dnm_sanction_ceded: "The Sanction Ceded"
 STATIC_MODIFIER_DESC_nd_dnm_sanction_ceded: "The crown negotiated while it still had something to bargain with. A humbler settlement than victory, but the diets remember that Vienna knew when to stop, and the realm is bent rather than broken."
 STATIC_MODIFIER_NAME_nd_dnm_danubian_recognition: "Danubian Recognition"
 STATIC_MODIFIER_DESC_nd_dnm_danubian_recognition: "The Emperor received the tribute and read the formulas of reconciliation aloud. The Danubian state is formally a power among powers again, and a crown that knows how to end a quarrel with an Emperor is a crown worth treating with."
 STATIC_MODIFIER_NAME_nd_dnm_danube_endures: "The Danube Endures"
 STATIC_MODIFIER_DESC_nd_dnm_danube_endures: "No treaty, no vindication: the world simply got used to a great power existing outside the old Imperial order. Half a reversal of the pariah years, earned by outlasting them."

 # ===== SUCCESSION CHAIN MODIFIERS (nd_dnm.30/.31/.32) =====
 # Five modifiers covering the 3-step chain (one perpetual at step 1, two
 # choice-driven at steps 2 and 3). All are removed in the disaster on_end
 # and the situation on_ended: they never outlive their narrative.
 STATIC_MODIFIER_NAME_nd_dnm_succession_anxiety: "La question ouverte"
 STATIC_MODIFIER_DESC_nd_dnm_succession_anxiety: "La continuité de la dynastie n'est pas résolue. A Pest et à Prague, les magnats demandent : quand ce monarque meurt, où va l'héritage ? Le coût est faible et constant."
 STATIC_MODIFIER_NAME_nd_dnm_rallying_the_diets: "Rassembler les régimes"
 STATIC_MODIFIER_DESC_nd_dnm_rallying_the_diets: "Le tribunal a choisi d'aborder la question de l'héritage ouvertement, par la performance et le mécénat. La légitimité augmente avec le travail, mais le ralliement lui-même est ressenti comme une pression dans certains milieux."
 STATIC_MODIFIER_NAME_nd_dnm_royal_silence: "Le silence royal"
 STATIC_MODIFIER_DESC_nd_dnm_royal_silence: "Le tribunal refuse de se précipiter pour se prononcer sur la succession. Le royaume interprète le silence comme une faiblesse."
 STATIC_MODIFIER_NAME_nd_dnm_drafting_the_decree: "Rédaction du décret"
 STATIC_MODIFIER_DESC_nd_dnm_drafting_the_decree: "Les chancelleries font pression pour une ratification formelle par brevet : le travail se reflète dans l'efficacité administrative, et la réponse publique à la question de l'héritage achète une goutte constante de légitimité."
 STATIC_MODIFIER_NAME_nd_dnm_postponed_decree: "Le décret reporté"
 STATIC_MODIFIER_DESC_nd_dnm_postponed_decree: "Le décret est rédigé mais réservé à un règne plus sage. Le royaume interprète ce report comme une incapacité à régler la question."

 # ===== REICH PRESSURE COOLDOWN =====
 STATIC_MODIFIER_NAME_nd_dnm_reich_pressure_recent: "Pression impériale"
 STATIC_MODIFIER_DESC_nd_dnm_reich_pressure_recent: "Les princes impériaux et la Curie travaillent contre l’État danubien : un bref resserrement des vis au-dessus du débuff constant des parias."

 # ===== CRISIS: events =====
 nd_dnm.13.t: "La question des nationalités"
 nd_dnm.13.d: "Magyar, Tchèque, Croate, Allemand, Polonais, Roumain, Italien : la dynastie les gouverne tous et n’en fait partie. De Pest à Prague, les régimes s'agitent, chacun réclamant sa propre langue, sa propre loi, sa propre nation. L’empire est un homme de la couronne et de rien d’autre, et cela ne suffit plus."
 nd_dnm.13.a: "La crise est à nos portes"
 nd_dnm.14.t: "Un régime défie Vienne"
 nd_dnm.14.d: "L'une des diètes des terres de la couronne refuse le prélèvement et l'impôt jusqu'à ce que ses anciennes libertés soient confirmées. La chancellerie attend la réponse du tribunal."
 nd_dnm.14.a: "Supprimez le régime : la couronne ne négocie pas"
 nd_dnm.14.b: "Concéder son autonomie : laisser le royaume se détendre"
 nd_dnm.15.t: "Le compromis proposé"
 nd_dnm.15.d: "Les modérés des deux côtés proposent un règlement : des royaumes égaux sous une seule dynastie, chaque nation ayant sa propre administration, liés par la personne du monarque et une armée commune. C’est l’Ausgleich, sauf le nom : et il ne peut être réalisé que si l’appareil centralisateur ou la bonne volonté des domaines sont là pour le porter."
 nd_dnm.15.a: "Acceptez le compromis : le double domaine"
 nd_dnm.15.b: "Refusez - la couronne ne sera pas divisée en deux"
 nd_dnm.16.t: "Briser les ligues nationalistes"
 nd_dnm.16.d: "Le contrôle a été repris sur l’ensemble des terres natales. Les ligues qui ont alimenté la crise peuvent désormais être démantelées en détail, si le tribunal en a la volonté."
 nd_dnm.16.a: "Écrasez-les - réaffirmez la couronne uniforme"
 nd_dnm.16.b: "Not yet: the grip is not firm enough"
 nd_dnm.17.t: "L'Ausgleich"
 nd_dnm.17.d: "C'est fait. Deux royaumes égaux, une tête couronnée, une armée, une politique étrangère : l’Autriche-Hongrie. Les nationalités sont liées dans l’empire par consentement, et le corps composé, contre toute prophétie, perdure."
 nd_dnm.17.a: "Indivisibiliter ac inseparabiliter, by consent"
 nd_dnm.18.t: "L’État uniforme"
 nd_dnm.18.d: "The diets are dissolved, the chancelleries merged, one law and one tongue imposed from Vienna. The realm is whole and obedient, and it will not forget what was taken from it."
 nd_dnm.18.a: "Une couronne, une règle"
 nd_dnm.19.t: "Les fractures du royaume"
 nd_dnm.19.d: "L’emprise de la dynastie a échoué. Une couronne a suivi son propre chemin et les autres regardent pour voir s'ils peuvent suivre. La monarchie composite est diminuée et ébranlée."
 nd_dnm.19.d.hun: "The dynasty's grip failed. Saint Stephen's crown forged this union and its institutions legitimized it: Hungary cannot secede from itself. It is Bohemia that goes its own way, and the rest watch to see if they may follow. The composite monarchy is diminished and shaken."
 nd_dnm.19.d.boh: "The dynasty's grip failed. Saint Wenceslas's crown forged this union and its institutions legitimized it: Bohemia cannot secede from itself. It is Hungary that goes its own way, and the rest watch to see if they may follow. The composite monarchy is diminished and shaken."
 nd_dnm.19.a: "Retiens ce qui reste"
 nd_dnm.20.t: "La guerre de succession"
 nd_dnm.20.d: "Le monarque est parti et le titre d'héritier est contesté. Les puissances qui ont signé la Sanction Pragmatique la lisent désormais comme une invitation. Les armées se déplacent sur l'héritage indivisible de chaque frontière."
 nd_dnm.20.a: "Le royaume sera défendu"
 nd_dnm.21.t: "La sanction justifiée"
 nd_dnm.21.d: "L'héritage a été conservé. Ce qui était garanti sur le papier l’a été dans le sang, et aucun pouvoir ne mettra à nouveau à la légère le royaume indivisible."
 nd_dnm.21.d.welded: "The inheritance held. What was guaranteed on paper has been guaranteed in blood, and the paper now becomes the realm. The constituent crowns that stood under the Danubian crown as juniors and vassals have ratified the Sanction with their own diets, and there is nothing left between them and Vienna but administration: their lands, their estates, and their quarrels are the realm's own from this day. Indivisibiliter ac inseparabiliter, no longer a motto but a map."
 nd_dnm.21.a: "Indivisibiliter ac inseparabiliter"
 nd_dnm.22.t: "La sanction brisée"
 nd_dnm.22.d: "L’héritage s’est finalement avéré divisible. Le territoire et le statut étaient le prix d’une couronne contestée ; le royaume perdure, plus petit et humilié."
 nd_dnm.22.d.ceded: "The inheritance proved divisible after all, but it was the crown's own hand that signed the division. Terms were negotiated while there was still something to negotiate with; the powers took their price and went home. The realm endures, humbled but not broken, and the diets remember that Vienna knew when to stop."
 nd_dnm.22.a: "Récupérer ce qui peut être récupéré"
 nd_dnm.22.b: "It was the crown's own signature, and the crown's own choice"
 nd_dnm.23.t: "Une revendication rivale appuyée"
 nd_dnm.23.d: "A foreign court advances a pretender's claim and gathers allies to enforce it. The succession is becoming a coalition war.\n\n#bold Crown Confidence:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.23.a: "Résister par les armes : la guerre s'éternise"
 nd_dnm.23.b: "Negotiate terms, and cede what must be ceded."

 # ===== PRAGMATIC SANCTION DISASTER EVENTS (nd_dnm.40-.47) =====
 # Counter-mechanic events fired from the disaster's on_monthly. Every
 # event's desc surfaces the current Crown Confidence so the player sees
 # progress in-event, not only on the disaster panel.

 nd_dnm.40.t: "Une pétition successorale pour la fidélité"
 nd_dnm.40.d: "A magnate of one of the recovered crowns sends an emissary to Vienna. For an honourable sum (delivered in coin, not by patent), his county will declare for the indivisible succession and bring three neighbouring lords with it. The dynasty's purse is the price of the public answer to the question of inheritance.\n\n#bold Crown Confidence:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.40.a: "N'épargnez aucune dépense : achetez toute la faction"
 nd_dnm.40.b: "Une somme modérée - le seigneur seul"
 nd_dnm.40.c: "Refusez : la dynastie n'achète pas la loyauté"

 nd_dnm.41.t: "Un tribunal étranger envisage la reconnaissance"
 nd_dnm.41.d: "An envoy from one of the European chanceries has come to Vienna with an offer: the Sanction will be recognised at his court if the diplomatic concessions are large enough. Recognition by even one major power will shift the coalition off its certainty.\n\n#bold Crown Confidence:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.41.a: "Concessions complètes : la reconnaissance s'achète directement"
 nd_dnm.41.b: "Des concessions légères : un échange mesuré"
 nd_dnm.41.c: "Refusez : la dynastie ne sera pas réduite à un suppliant"
 nd_dnm.42.t: "Une prétendue rébellion en province"
 nd_dnm.42.d: "The pretender's faction has gathered armed force in one of the home provinces. Magistrates have fled. The rising must be answered: by sword, by amnesty, or by the cost of ignoring it.\n\n#bold Crown Confidence:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.42.a: "Écraser le soulèvement par les armes"
 nd_dnm.42.b: "Négociez l’amnistie : achetez les dirigeants, épargnez les soldats"
 nd_dnm.42.c: "Ignorer : il y a des incendies plus importants à combattre"

 nd_dnm.43.t: "La tournée des sanctions"
 nd_dnm.43.d: "The monarch is urged to leave Vienna and tour the crown lands in person: Prague, Pressburg, Buda, presenting the dynasty's case to the diets and the magnates face to face. A travelling court is expensive, but the symbolism is unmatched.\n\n#bold Crown Confidence:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.43.a: "Un progrès somptueux : pleine pompe, cortège complet"
 nd_dnm.43.b: "A modest progress: the visit alone"
 nd_dnm.43.c: "Le tribunal ne sera pas déplacé de Vienne"

 nd_dnm.44.t: "Un défaut de la couronne"
 nd_dnm.44.d: "One of the constituent diets has voted to declare the Pragmatic Sanction void on its territory; foreign emissaries were present. This is a public failure of the indivisible inheritance, and the most expensive single event the disaster can produce.\n\n#bold Crown Confidence:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.44.a: "Envoyez l'armée - placez la diète sous les normes impériales"
 nd_dnm.44.b: "Payer le régime - racheter-le"
 nd_dnm.44.c: "Admettez le principe : la défection demeure"

 nd_dnm.45.t: "Un tribunal étranger parraine un prétendant"
 nd_dnm.45.d: "A rival power has formally funded a claimant against the dynasty. Subsidies, recognition, perhaps a treaty of mutual guarantee with the pretender's faction: the war has gained a foreign patron.\n\n#bold Crown Confidence:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.45.a: "Contre-pression : nos propres diplomates répondent de la même manière"
 nd_dnm.45.b: "Endurer : la diplomatie ne peut rien faire"

 nd_dnm.46.t: "La marée tourne"
 nd_dnm.46.d: "The dynasty's persistence is being read across Europe. Magnates who hesitated rally; foreign courts read the room and step back from the pretender's faction. The succession is no longer in doubt at every threshold.\n\n#bold Crown Confidence:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.46.a: "La dynastie tient"

 nd_dnm.47.t: "La coalition se resserre"
 nd_dnm.47.d: "A new power has joined the coalition against the inheritance. Diplomats from three additional courts have come to the pretender's banner; subsidies are being doubled. The dynasty's standing is bleeding.\n\n#bold Crown Confidence:#! [Country.MakeScope.GetVariable('nd_dnm_crown_confidence').GetValue] / [Country.MakeScope.GetVariable('nd_dnm_crown_confidence_target').GetValue]"
 nd_dnm.47.a: "Endurer : la tempête n'est pas encore à son paroxysme"

 # ===== THE PROVINCES MURMUR (nd_dnm.48): Nationalities Question forewarning =====
 nd_dnm.48.t: "The Provinces Murmur"
 nd_dnm.48.d: "The reports arriving at the court are individually small and collectively unmistakable. Petitions in languages the chancery must translate. Diets that answer slowly, or in the old formulas that concede nothing. Tax rolls where whole villages are recorded as gone to the woods. None of it is rebellion. All of it is the composite realm asking, quietly, whether Vienna still needs to be obeyed.\n\nThe grievances could be addressed now, at real expense, while they are still petitions. Or the court can judge this weather, not climate, and it may even be right."
 nd_dnm.48.a: "Address the grievances now: pay, while they still petition"
 nd_dnm.48.b: "Let it pass: the realm has always murmured"
 nd_dnm.25.t: "Hors du Reich"
 nd_dnm.25.d: "Les couronnes du Danube ont quitté le Saint-Empire romain germanique et la dignité impériale a été instaurée. Les électeurs sont en colère, la Curie marmonne d’apostasie et l’État danubien se retrouve seul dans le froid qu’il a lui-même créé."
 nd_dnm.25.a: "Laissez-les faire rage"
 nd_dnm.26.t: "L'apostasie danubienne"
 nd_dnm.26.d: "La nouvelle parvient aux cours impériales et papales : la Maison a arraché trois couronnes au Reich et s'est érigée en empire à part. Cela ne sera pas oublié."
 nd_dnm.26.d.boh: "Word reaches the imperial and papal courts: the Crown of Bohemia (one of the seven electoral votes fixed by the Golden Bull itself) has torn three crowns out of the Reich and set itself up as an empire apart. The college of electors now sits a founding member short. Of all the ways this could have happened, this is the one the Reich can least pretend away, and least forgive."
 nd_dnm.26.d.hun: "Word reaches the imperial and papal courts: the Crown of Saint Stephen (a crown that never sat in the Reich's electoral structure at all) has pulled Austria and Bohemia out of the Empire and built its own imperium on the Danube. An outsider has walked off with two of the Reich's own crowns. This will not be forgotten."
 nd_dnm.26.d.hab: "Word reaches the imperial and papal courts: the House of Austria (the dynasty whose only claim to electoral dignity was the forged Privilegium maius that Charles IV himself refused to confirm) has torn three crowns out of the Reich and set itself up as an empire apart. The forgers of privileges have now forged an empire. This will not be forgotten."
 nd_dnm.26.a: "Il ne sera pas oublié"
 nd_dnm.27.t: "Les Presses du Reich"
 nd_dnm.27.d: "Les princes impériaux et la Curie travaillent patiemment contre l'État danubien : isolement dans les diètes, froideur dans les chancelleries, revendications murmurées à ses ennemis. Il n’y a rien d’autre à faire pour le moment que de le supporter, et rappelez-vous que le fossé ne se refermera que lorsque le royaume aura répondu à la question de succession, brisé l’empereur sur le terrain ou simplement survécu à l’éloignement."
 nd_dnm.27.a: "Météo"
 nd_dnm.29.t: "Dans le froid"
 nd_dnm.29.d: "L'éloignement est terminé. Le Reich et la Curie traitent à contrecœur l’État danubien comme une puissance parmi les puissances plutôt que comme un apostat."
 nd_dnm.29.d.reich_gone: "There is no Empire left to be estranged from. The crown that named us apostate is gone, its diets dissolved, its ban a dead letter in the hands of no one. The quarrel outlived neither party by design; it simply lost the side that was keeping it. Our envoys stop rehearsing the arguments they were never allowed to make, and the Danube is left to be judged on what it holds rather than on what it walked away from."
 nd_dnm.29.d.reconciled: "The embassy returns from the imperial court with seals, not mockery. The tribute has been received, the formulas of reconciliation read aloud, and the Danubian state stands recognised: not forgiven, exactly, but received. The chanceries of Europe take note within the season: the Danube is a power one treats with, and the crown that knew how to end a quarrel with an Emperor is a crown worth having as a friend."
 nd_dnm.29.d.endured: "No treaty was signed and no battle won. The estrangement simply grew old, and then grew quaint. Fifty years of embassies received elsewhere, marriages contracted anyway, merchants who never asked, and one morning the chanceries of Europe notice that they have been treating the Danubian state as a power among powers for years without deciding to. What endures, is."
 nd_dnm.29.a: "Les comptes sont clos"

 # ===== SUCCESSION QUESTION CHAIN (nd_dnm.30 / .31 / .32) =====
 # The 3-event narrative arc that primes the Pragmatic Sanction disaster.
 # Fires at years 2 / 5 / 8 post-formation.
 nd_dnm.30.t: "La question de l'héritage"
 nd_dnm.30.d: "The realm is new and the dynasty's continuity is unresolved. From the Hungarian county diets to the Bohemian estates, the question travels: when this monarch dies, where does the indivisible inheritance go? The court has no answer yet, and the powers of Europe are beginning to listen.\n\nThe diets of three crowns will not be silent on this. The decision the dynasty makes, or refuses to make, will shape the succession war that is coming."
 nd_dnm.30.a: "La question est ouverte"
 nd_dnm.31.t: "Le murmure des régimes"
 nd_dnm.31.d: "The Magyar comitatus and the Bohemian Landtag have sent a joint embassy to Vienna. The Hungarians cite the Aurea Bulla; the Bohemians the Renewed Constitution; both ask what becomes of the indivisible realm when the crown changes hands. The court must answer them, or be answered for.\n\n#bold The path chosen here is read by the foreign chanceries, and seeds the dynasty's standing when the succession war begins.#!"
 nd_dnm.31.a: "Rallier les domaines autour de la dynastie"
 nd_dnm.31.b: "Le tribunal ne sera pas pressé"
 nd_dnm.32.t: "Le décret rédigé"
 nd_dnm.32.d: "Chancery clerks have drafted the decree: the Habsburg lands shall descend #italic indivisibiliter ac inseparabiliter#! (indivisible and inseparable) as one body to a single heir, daughter or son. The signature is the court's, alone. To ratify it now is to draw the inheritance line by the dynasty's own hand; to leave it for the next reign is to leave the question for the powers of Europe to answer with armies.\n\n#bold The decision here either gives the dynasty a strong opening when the succession war comes, or leaves it on the defensive.#!"
 nd_dnm.32.a: "Ratifier par brevet MAINTENANT"
 nd_dnm.32.b: "Le décret peut attendre un règne plus sage"

 # ===== STRENGTH PATH VICTORY (nd_dnm.33) =====
 # Fired by the situation's on_monthly when DNM hits >= 80% war score vs
 # the HRE leader. The flag has already been set; this event is the
 # player-facing flavor moment.
 nd_dnm.33.t: "Le Reich humilié"
 nd_dnm.33.d: "Sur le terrain, le verdict est inversé. Le[GetUniqueInternationalOrganization('hre').GetLeaderTitle]qui a prononcé l'interdiction impériale contre l'État danubien poursuit maintenant en justice pour obtenir des conditions ; les princes impériaux qui murmuraient contre nous dans les diètes trouvent que leurs paroles ont perdu de leur poids. Les années de paria sont révolues : les puissances qui nous qualifiaient d’apostats nous qualifieront de puissance."
 nd_dnm.33.a: "Le verdict est cassé"

 # ===== CRISIS: situation hint (drives the Hints lateral view) =====
 hint_nd_dnm_reaction_of_the_reich: "Astuces[GetSituationByKey('nd_dnm_reaction_of_the_reich').GetNameWithNoTooltip]"
 hint_nd_dnm_reaction_of_the_reich_hint_text: "$hint_nd_dnm_reaction_of_the_reich_hint_text_1$ \n \n $hint_nd_dnm_reaction_of_the_reich_hint_text_2$"
 hint_nd_dnm_reaction_of_the_reich_hint_text_1: "We took our crowns out of the [GetUniqueInternationalOrganization('hre').GetName] to raise a monarchy of our own, and the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] has not forgiven it. He holds the [ShowCasusBelliName('cb_imperial_ban')] [casus_belli|e] against us, and we carry $STATIC_MODIFIER_NAME_nd_dnm_reich_pariah$ until the breach is closed."
 hint_nd_dnm_reaction_of_the_reich_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Settle the inheritance. The [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')] will come, and ending it either way closes the breach. Uphold it and every crown we still hold as a [subject|e] or union junior is absorbed into the realm outright.\n@arrow_bonus_tier_2! If our armies are ready, beat the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] to #Y 80%#! war score and impose #Y Humble the Reich#!.\n@arrow_bonus_tier_2! Otherwise offer reconciliation. It costs #Y two years' income#!, and a weak or distracted Emperor is likelier to accept. A refusal costs [prestige|e] and we must wait #Y 10 years#! before asking again.\n@arrow_bonus_tier_1! Failing all else, endure. After #Y 50 years#! a realm with #Y 60#! [legitimacy|e] and #Y 50#! [prestige|e] is no longer treated as an apostate. Time alone will not do it."

 # ===== SITUATION PANEL =====
 # The panel is visible to ALL countries: the headers and Description /
