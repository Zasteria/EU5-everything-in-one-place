 # ----- Lay the Sanction before the Diet (country interaction) -----
 nd_dnm_seek_diet_ratification: "Lay the Sanction before the Diet"
 nd_dnm_seek_diet_ratification_desc: "Petition for the Imperial Diet's guarantee of the Pragmatic Sanction, with concessions worth two years' revenue. If it is granted, every constituent crown that still answers to us is welded into the realm and its lands stay imperial. A strong Emperor is less willing to let one member swallow three crowns; a friendly one, and one of our own faith, more. As Emperor, the petition goes to an elector and the price is paid in imperial authority."
 nd_dnm_ratification_success_tt: "The Diet guarantees the Sanction: the constituent crowns that answer to us are welded into the realm"
 nd_dnm_ratification_rejected_tt: "The petition is refused before the Diet; no new petition can be laid for #bold 10 years#!"
 ND_DNM_RATIFY_BASE: "The Diet does not dissolve crowns of the Reich lightly"
 ND_DNM_RATIFY_IMPERIAL_AUTHORITY: "A strong Emperor will not let one member swallow three crowns"
 ND_DNM_RATIFY_SAME_FAITH: "A crown of the same faith"
 ND_DNM_RATIFY_AT_WAR: "A crown at war is a poor guarantee"
