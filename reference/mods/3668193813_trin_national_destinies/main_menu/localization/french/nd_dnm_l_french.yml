 # ===== CROWN CONFIDENCE COUNCIL (generic actions, Pragmatic Sanction disaster) =====
 nd_dnm_petition_estate_loyalty: "Petition the Estates for Loyalty"
 nd_dnm_petition_estate_loyalty_desc: "A magnate of one of the recovered crowns can be brought into line for an honourable sum, and he will bring his neighbours with him. The dynasty's purse is the price of the public answer to the question of inheritance."
 action_nd_dnm_petition_estate_loyalty: "Petition the Estates for Loyalty"
 action_nd_dnm_petition_estate_loyalty_desc: "A magnate of one of the recovered crowns can be brought into line for an honourable sum, and he will bring his neighbours with him. The dynasty's purse is the price of the public answer to the question of inheritance."
 nd_dnm_undertake_sanction_tour: "Undertake the Sanction Tour"
 nd_dnm_undertake_sanction_tour_desc: "The monarch leaves Vienna and tours the crown lands in person: Prague, Pressburg, Buda, presenting the dynasty's case to the diets and the magnates face to face. A travelling court is expensive, but the symbolism is unmatched."
 action_nd_dnm_undertake_sanction_tour: "Undertake the Sanction Tour"
 action_nd_dnm_undertake_sanction_tour_desc: "The monarch leaves Vienna and tours the crown lands in person: Prague, Pressburg, Buda, presenting the dynasty's case to the diets and the magnates face to face. A travelling court is expensive, but the symbolism is unmatched."
 nd_dnm_seek_foreign_recognition: "Seek Foreign Recognition"
 nd_dnm_seek_foreign_recognition_desc: "The Sanction will be recognised abroad if the diplomatic concessions are large enough. Recognition by even one major power shifts the coalition off its certainty, but a dynasty that shops for legitimacy pays in standing."
 action_nd_dnm_seek_foreign_recognition: "Seek Foreign Recognition"
 action_nd_dnm_seek_foreign_recognition_desc: "The Sanction will be recognised abroad if the diplomatic concessions are large enough. Recognition by even one major power shifts the coalition off its certainty, but a dynasty that shops for legitimacy pays in standing."
 nd_dnm_press_the_succession_claim: "Press the Succession Claim"
 nd_dnm_press_the_succession_claim_desc: "The crown declares, publicly and irrevocably for this season, that it will fight the question to its end. The declaration steadies nothing and the war drags on, but no one at court may again speak of terms."
 action_nd_dnm_press_the_succession_claim: "Press the Succession Claim"
 action_nd_dnm_press_the_succession_claim_desc: "The crown declares, publicly and irrevocably for this season, that it will fight the question to its end. The declaration steadies nothing and the war drags on, but no one at court may again speak of terms."
 nd_dnm_sue_for_succession_terms: "Sue for Succession Terms"
 action_nd_dnm_sue_for_succession_terms: "Sue for Succession Terms"
 nd_dnm_sue_for_succession_terms_desc: "The war cannot be won, and the crown would rather negotiate now, while it still has something to bargain with, than be dictated to later. A humbler settlement than victory, and a far gentler one than collapse."
