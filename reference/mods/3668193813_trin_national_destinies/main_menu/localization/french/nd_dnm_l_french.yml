 action_nd_dnm_break_the_leagues_desc: "Control has been clawed back across the home lands. The leagues that fed the crisis can be broken in detail, the moment the court has the will."
 nd_dnm_offer_the_compromise: "Offer the Compromise"
 nd_dnm_offer_the_compromise_desc: "Two co-equal realms, one crowned head, one army, one foreign policy. The Ausgleich binds the nationalities into the empire by consent, and it can be offered the moment the crown is credible enough to be believed."
 action_nd_dnm_offer_the_compromise: "Offer the Compromise"
