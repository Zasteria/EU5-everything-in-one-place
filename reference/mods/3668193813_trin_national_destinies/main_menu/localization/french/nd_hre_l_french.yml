l_french:
 ## Advance Names and Descriptions ##
 nd_hre_reichshofkanzlei: "Rue du Reichshofkanzlei"
 nd_hre_reichshofkanzlei_desc: "La Reichshofkanzlei servait d'organe administratif central par lequel l'empereur gouvernait les territoires vastes et fragmentés du Saint Empire romain germanique. Composée de juristes et d'ecclésiastiques qualifiés, la chancellerie traitait la correspondance impériale, publiait des édits et maintenait le cadre juridique qui liait des centaines de territoires semi-autonomes en un seul régime politique."
 nd_hre_imperial_knights: "Chevalerie impériale"
 nd_hre_imperial_knights_desc: "Les Reichsritter, ou chevaliers impériaux, devaient allégeance directement à l'empereur plutôt qu'à un prince intermédiaire. Ces guerriers à cheval constituaient l'épine dorsale de la tradition militaire féodale de l'Empire, conservant les coutumes martiales de la cavalerie lourde qui définissaient la guerre en Europe centrale depuis l'époque de Charlemagne."
 nd_hre_feudal_hierarchy: "Hiérarchie féodale impériale"
 nd_hre_feudal_hierarchy_desc: "La hiérarchie élaborée d'électeurs, de princes, de comtes et de chevaliers qui constituait les domaines impériaux créait un réseau complexe de loyauté, d'obligations et de privilèges. Bien que souvent lourde, cette structure offrait à l’empereur un cadre de gouvernance qu’aucune autre monarchie européenne ne pouvait égaler dans sa diversité."
 nd_hre_reichstag_origins: "Origines du Reichstag"
 nd_hre_reichstag_origins_desc: "La Diète impériale, ou Reichstag, est passée d'assemblées informelles des princes de l'Empire à un corps législatif structuré. À la fin du XVe siècle, elle avait développé des conseils distincts d'électeurs, de princes et de villes impériales, chacun ayant le pouvoir de délibérer sur les questions de fiscalité, de guerre et de réforme impériale."
 nd_hre_bergregal: "Droits miniers impériaux"
 nd_hre_bergregal_desc: "Le Bergregal établit le droit souverain de l'Empereur sur les richesses minières dans tout l'Empire. Codifiées pour la première fois dans la Constitution Roncaglian de Barberousse de 1158, ces prérogatives minières ont permis l'exploitation systématique des riches gisements d'argent et de cuivre d'Europe centrale, notamment en Saxe, en Bohême et au Tyrol."
 nd_hre_landfrieden: "Tradition de la Landfriede"
 nd_hre_landfrieden_desc: "Les proclamations médiévales de Landfriede visaient à limiter la guerre privée et à maintenir l’ordre public sur les territoires fragmentés de l’Empire. Bien que souvent honorées davantage dans la violation que dans l'observance, ces déclarations de paix établissaient le principe selon lequel l'empereur était responsable du maintien de l'ordre dans tout le royaume."
 nd_hre_messeplatz: "Messeplatz"
 nd_hre_messeplatz_desc: "Les grandes foires commerciales de Francfort et de Leipzig ont attiré des commerçants de toute l’Europe et d’ailleurs. Ces marchés périodiques, sanctionnés par le privilège impérial, servaient de nœuds cruciaux dans le réseau commercial continental, où les marchandises, le crédit et l'information circulaient librement au-delà des frontières politiques."
 nd_hre_bergakademie: "Bergakademie"
 nd_hre_bergakademie_desc: "The Bergakademie represented the institutionalization of mining knowledge that had accumulated over centuries of Central European mineral extraction. These academies trained engineers and overseers in geology, metallurgy, and mine management, transforming artisanal mining into a systematic science."
 nd_hre_maximilian_court: "Cour Renaissance de Maximilien"
 nd_hre_maximilian_court_desc: "L'empereur Maximilien Ier transforma la cour impériale en un centre d'apprentissage et de mécénat artistique de la Renaissance. Sa cour à Innsbruck attirait des érudits, des artistes et des musiciens, tandis que sa passion pour les tournois, la généalogie et l'auto-promotion à travers l'art contribuait à définir l'idéal du prince de la Renaissance."
 nd_hre_reichspost: "Système postal impérial"
 nd_hre_reichspost_desc: "La Reichspost, confiée à la famille Thurn und Taxis à partir de 1490, créa le premier réseau postal systématique d'Europe couvrant le Saint-Empire romain germanique. Des coursiers réguliers reliaient les grandes villes sur des milliers de kilomètres, transformant ainsi les communications, le commerce et la gouvernance impériale."
 nd_hre_handelsmesse: "Réseau commercial Messe"
 nd_hre_handelsmesse_desc: "The formalized system of imperial trade fairs created a network of periodic markets that connected producers, merchants, and consumers across the Empire. From the cloth dealers of Leipzig to the booksellers of Frankfurt, these fairs facilitated the exchange of both goods and ideas.\n\n#italic Available in: $nd_hre_messeplatz$#!"
 nd_hre_reichsmatrikel: "Registre de l'armée impériale"
 nd_hre_reichsmatrikel_desc: "Le Reichsmatrikel établit les obligations militaires de chaque domaine impérial, précisant le nombre de troupes et les contributions financières que chaque territoire doit fournir pour la défense commune. Ce système de charge militaire partagée a transformé les prélèvements féodaux de l'Empire en une force militaire plus prévisible, quoique toujours décentralisée."
 nd_hre_reichskammergericht: "Reichskammergericht"
 nd_hre_reichskammergericht_desc: "Fondé à la Diète de Worms en 1495, le Reichskammergericht était l'institution judiciaire suprême de l'Empire. Composé d'avocats romains qualifiés, il réglait les différends entre les domaines impériaux, appliquait l'Ewiger Landfriede et offrait une alternative pacifique à la vendetta et à la guerre privée qui tourmentaient l'Empire depuis des siècles."
 nd_hre_ewiger_landfriede: "Paix publique perpétuelle"
 nd_hre_ewiger_landfriede_desc: "L'Ewiger Landfriede de 1495 constitue l'interdiction définitive et perpétuelle du droit médiéval de vendetta au sein du Saint Empire romain germanique. Proclamée à la Diète de Worms sous Maximilien Ier, elle établit que tous les différends doivent désormais être réglés par les tribunaux plutôt que par la force des armes."
 nd_hre_reichskreise: "Cercles impériaux"
 nd_hre_reichskreise_desc: "Les dix Reichskreise, créés entre 1500 et 1512, organisèrent les territoires de l'Empire en groupements administratifs régionaux. Chaque Cercle était chargé de collecter les impôts impériaux, de maintenir la paix publique, de faire respecter les décisions de justice et de mobiliser les contingents militaires, créant ainsi une structure fédérale unique dans la gouvernance européenne."
 nd_hre_druckkunst: "L'héritage de l'imprimerie"
 nd_hre_druckkunst_desc: "L'invention des caractères mobiles par Gutenberg à Mayence vers 1440 a transformé le Saint-Empire romain germanique en la forge intellectuelle de l'Europe. Les ateliers d'imprimerie allemands se sont rapidement répandus à Strasbourg, Nuremberg et Augsbourg, diffusant l'érudition humaniste, le débat religieux et les connaissances pratiques à un rythme que la culture manuscrite n'aurait jamais pu atteindre."
 nd_hre_imperial_pikeman: "Régiments impériaux de brochets"
 nd_hre_imperial_pikeman_desc: "L'infanterie réformée de l'ère post-Reichsreform combinait les formations de piques disciplinées qui s'étaient révélées dévastatrices dans la guerre suisse avec la structure organisationnelle exigée par le nouveau système militaire impérial. Ces piquiers formés professionnellement représentaient la réponse de l'Empire à la révolution militaire du XVIe siècle."
 nd_hre_universitaeten: "Tradition de l'Université impériale"
 nd_hre_universitaeten_desc: "Le Saint Empire romain germanique possédait le réseau d'universités le plus dense de la chrétienté, depuis les anciennes fondations de Prague, Vienne et Heidelberg jusqu'aux établissements plus récents répartis sur les terres allemandes. Ces institutions formaient les juristes, les théologiens et les administrateurs qui maintenaient l'appareil constitutionnel complexe de l'Empire."
 nd_hre_augsburger_religionsfriede: "Paix d'Augsbourg"
 nd_hre_augsburger_religionsfriede_desc: "La paix religieuse d'Augsbourg en 1555 établit le principe du cuius regio, eius religio, dont le royaume, sa religion. Ce règlement révolutionnaire accordait aux princes luthériens le droit légal de déterminer la confession de leurs territoires, mettant ainsi fin à des décennies de guerre de religion au sein de l'Empire et établissant un cadre pour la coexistence confessionnelle."
 nd_hre_reichsheer: "Contingents de l'armée impériale"
 nd_hre_reichsheer_desc: "Le Reichsheer a formalisé le système par lequel les cercles impériaux levaient et équipaient des contingents militaires selon le Reichsmatrikel. Bien qu’elles ne constituent jamais une armée permanente, ces forces régionales pourraient être mobilisées pour une défense commune, représentant la capacité militaire collective des centaines de territoires constitutifs de l’Empire."
 nd_hre_zeughaus: "Imperial Fortress"
 nd_hre_zeughaus_desc: "After the French wars of the seventeenth century the Empire kept fortresses of its own on the Rhine. Philippsburg and Kehl were held as Reichsfestungen, garrisoned by the contingents of the Circles and supplied from the Imperial war chest, with a gun park, powder magazines and workshops inside the walls."
 nd_hre_reichshandelsordnung: "Gouvernance commerciale impériale"
 nd_hre_reichshandelsordnung_desc: "Les réglementations commerciales impériales visaient à standardiser les poids, les mesures et les pratiques commerciales dans le paysage économique fragmenté de l'Empire. Même si leur application restait inégale, ces ordonnances fournissaient un cadre commun facilitant le commerce à longue distance entre les centaines de marchés et de foires de l'Empire."
 nd_hre_konfessionspolitik: "Diplomatie confessionnelle"
 nd_hre_konfessionspolitik_desc: "La division religieuse de l’Empire entre camps catholique et protestant a créé une forme distincte de politique confessionnelle. Les hommes d'État impériaux ont appris à naviguer entre les blocs religieux, en utilisant leurs compétences diplomatiques, leurs précédents juridiques et l'appareil constitutionnel de l'Empire pour maintenir un équilibre fragile entre les confessions."
 nd_hre_metallverarbeitung: "Métallurgie impériale"
 nd_hre_metallverarbeitung_desc: "The Empire's rich deposits of iron, copper, and silver supported a vast metalworking industry centered in Saxony, the Harz Mountains, and the Styrian Alps. Imperial metallurgists developed advanced smelting and forging techniques that made Central European ironwork and armaments renowned across the continent.\n\n#italic Available in: $nd_hre_zeughaus$#!"
 nd_hre_westfaelischer_friede: "Paix de Westphalie"
 nd_hre_westfaelischer_friede_desc: "La paix de Westphalie en 1648 mit fin à la catastrophique guerre de Trente Ans et remodela l'ordre constitutionnel de l'Empire. Le calvinisme a été reconnu aux côtés du catholicisme et du luthéranisme, les domaines impériaux ont acquis une plus grande souveraineté et le principe de tolérance religieuse a été inscrit dans la loi fondamentale de l'Empire."
 nd_hre_kaiserliche_kurassiere: "Cuirassiers impériaux"
 nd_hre_kaiserliche_kurassiere_desc: "La Kaiserliche Kurassiere représentait le sommet de la cavalerie lourde dans l'Empire post-westphalien. Équipés d'une cuirasse et d'un casque, armés d'une épée et d'un pistolet, ces cavaliers d'élite délivraient des charges dévastatrices capables de briser les formations d'infanterie. Les grandes académies de cavalerie de l’Empire formèrent des générations d’officiers à l’art de la guerre à cheval."
 nd_hre_reichsarmee: "Reichsarmee debout"
 nd_hre_reichsarmee_desc: "La formalisation de la Reichsarmee en une institution plus permanente a donné à l'Empire une force militaire capable de défendre ses frontières et de projeter sa puissance. Bien que toujours constituée de contingents d'États individuels, une meilleure coordination à travers les cercles impériaux a créé une force plus grande que la somme de ses parties."
 nd_hre_barockkultur: "Culture baroque impériale"
 nd_hre_barockkultur_desc: "L'époque baroque transforma les cours et les villes de l'Empire en vitrines de splendeur artistique. Des grands palais de Vienne et de Dresde aux églises de pèlerinage de Bavière, le style baroque exprimait à la fois la puissance de la tradition impériale et la vitalité culturelle des terres allemandes."
 nd_hre_rathaus: "Hôtel de ville"
 nd_hre_rathaus_desc: "Le grand Rathaeuser des villes impériales incarnait la fierté civique et l’autonomie urbaine dans le cadre constitutionnel de l’Empire. Ces structures imposantes servaient de centres d'administration municipale, de justice et de commerce, abritant les conseils qui gouvernaient certaines des villes les plus riches d'Europe."
 nd_hre_postwesen: "Réseau postal impérial"
 nd_hre_postwesen_desc: "L'expansion du système postal Thurn und Taxis en un réseau complet couvrant les territoires de l'Empire a créé l'infrastructure de communication la plus efficace du début de l'Europe moderne. Des routes postales régulières reliaient même les villes de province aux grands centres de commerce et de gouvernement."
 nd_hre_aufklaerung: "Lumières allemandes"
 nd_hre_aufklaerung_desc: "L'Aufklarung a apporté les idéaux de raison, de tolérance et de connaissance systématique aux institutions de l'Empire. Les philosophes allemands, de Leibniz à Kant, ont transformé la pensée européenne, tandis que les administrateurs éclairés de Prusse, d’Autriche et des petits États allemands ont modernisé la gouvernance, l’éducation et la justice."
 nd_hre_imperial_fusilier: "Fusiliers impériaux"
 nd_hre_imperial_fusilier_desc: "Les Fusiliers impériaux représentaient la professionnalisation de la guerre d'infanterie à la fin de l'Empire. Formés aux exercices et aux tactiques de l’époque des Lumières, équipés de mousquets et de baïonnettes standardisés, ces soldats incarnaient l’approche rationalisée de la guerre qui caractérisait la révolution militaire du XVIIIe siècle."
 nd_hre_manufaktur: "Manufactures Impériales"
 nd_hre_manufaktur_desc: "The spread of centralized manufacturing throughout the Empire transformed traditional craft production into proto-industrial enterprise. State-sponsored manufactories in porcelain, textiles, and metalwork combined German technical skill with Enlightenment principles of rational organization. Under the walls of the Imperial fortresses, gun manufactories turned out muskets to a single pattern.\n\n#italic Available in: $nd_hre_zeughaus$#!"
 nd_hre_polizeiwissenschaft: "Science de la gouvernance"
 nd_hre_polizeiwissenschaft_desc: "La Polizeiwissenschaft, la science allemande de la gouvernance et de l'administration publique, cherchait à systématiser tous les aspects de la gestion de l'État. S’appuyant sur des siècles d’expérience constitutionnelle impériale, les caméralistes allemands ont développé des théories globales sur la politique fiscale, la gestion de la population et le bien-être public qui ont influencé la pratique administrative dans toute l’Europe."
 nd_hre_reichsverfassung: "Tradition constitutionnelle impériale"
 nd_hre_reichsverfassung_desc: "L’accumulation du droit constitutionnel de l’Empire, depuis la Bulle d’Or jusqu’à la Paix de Westphalie et au-delà, a créé un ensemble de précédents et de principes uniques dans la gouvernance européenne. Cette tradition constitutionnelle équilibrait l’autorité impériale et la liberté princière, fournissant un cadre de gouvernance fédérale qui influença la pensée constitutionnelle ultérieure."
 nd_hre_kavallerieschule: "École Kavallerie"
 nd_hre_kavallerieschule_desc: "Académies de formation pour le corps des officiers de l'Empire, enseignant l'équitation, les tactiques de cavalerie et les sciences militaires. Des institutions comme l'École espagnole d'équitation de Vienne ont préservé et raffiné des siècles de tradition équestre, produisant les officiers de cavalerie qualifiés qui dirigeaient les forces montées de l'Empire."
 ## Unit Names and Descriptions ##
 a_nd_hre_imperial_reiter: "Reiter impérial"
 a_nd_hre_imperial_reiter_desc: "Chevaliers à cheval devant une allégeance directe à l'empereur, les Reiter impériaux maintenaient la tradition militaire féodale qui définissait la guerre en Europe centrale depuis des siècles. Equipés de lance, d'épée et d'armure lourde, ils représentaient l'élite martiale de l'Empire."
 a_nd_hre_imperial_pikeman: "Piquier impérial"
 a_nd_hre_imperial_pikeman_desc: "Infanterie de brochets disciplinée entraînée dans le système militaire impérial réformé. Organisés en formations denses dotées de piques de dix-huit pieds, ces soldats tenaient la ligne contre les charges de cavalerie et ancraient les formations de combat de l'Empire."
 a_nd_hre_reichsheer_infantry: "Infanterie Reichsheer"
 a_nd_hre_reichsheer_infantry_desc: "Contingents d'infanterie levés via le système militaire impérial, issus de tous les territoires de l'Empire. Même s'il manquait de la cohésion professionnelle des armées permanentes, le nombre et la diversité régionale du Reichsheer en faisaient une formidable force défensive."
 a_nd_hre_kreistruppen: "Kreistruppen"
 a_nd_hre_kreistruppen_desc: "The contingents of the Imperial Circles, each estate sending the quota the register sets and the Diet doubling or tripling it at need. They come in great numbers, under their own officers and their own drill."
 a_nd_hre_kaiserliche_kurassiere: "Kaiserliche Kurassiere"
 a_nd_hre_kaiserliche_kurassiere_desc: "La cavalerie lourde d'élite de l'Empire, équipée d'une cuirasse et armée d'une épée et d'un pistolet. Les Kaiserliche Kurassiere étaient entraînés à lancer des charges de choc dévastatrices capables de briser les formations ennemies, faisant ainsi progresser les traditions martiales de la chevalerie impériale à l'ère de la poudre à canon."
 a_nd_hre_imperial_fusilier: "Fusilier Impérial"
 a_nd_hre_imperial_fusilier_desc: "Infanterie de ligne professionnelle de la fin de l'Empire, entraînée aux exercices de l'époque des Lumières et équipée de mousquets à silex standardisés. Les Fusiliers Impériaux incarnaient les réformes militaires rationalisées qui cherchaient à créer une armée permanente moderne à partir des anciennes traditions militaires de l'Empire."
 ## Building Descriptions (unique buildings not sharing advance keys) ##
 nd_hre_universitas: "Université"
 nd_hre_universitas_desc: "Une université impériale attirant des universitaires de tout le territoire allemand, formant les juristes, théologiens, médecins et administrateurs dont dépendait la gouvernance de l'Empire."
 nd_hre_barockpalast: "Palais baroque"
 nd_hre_barockpalast_desc: "Un grand palais baroque construit dans le style magnifique qui définissait les cours de la fin de l'Empire, servant de centre de culture aristocratique, de mécénat artistique et d'exposition politique."
 nd_hre_posthalterei: "Posthalterei"
 nd_hre_posthalterei_desc: "A relay station of the Imperial post. A postmaster keeps fresh horses ready, and the sealed bag passes from rider to rider along the road without stopping."
 ## Production Method Names ##
 nd_hre_fair_trade: "Fair Stationers"
 nd_hre_fair_trade_desc: "Books were copied, coloured and bound for sale at the fair. Paper, dyes and leather were consumed and books were sold."
 nd_hre_metalworks: "Métallurgie impériale"
 nd_hre_metalworks_desc: "Arms were forged in the fortress's own shops. Iron, coal and timber were consumed and weapons were sold."
 nd_hre_manufaktur_pm: "Gun Manufactory"
 nd_hre_manufaktur_pm_desc: "Muskets were made to one pattern in a manufactory under the fortress walls. Iron, tools and timber were consumed and firearms were sold."
 ## Timed Modifier Names and Descriptions ##
 STATIC_MODIFIER_NAME_nd_hre_pax_imperii: "Pax Impérii"
 STATIC_MODIFIER_DESC_nd_hre_pax_imperii: "La paix publique perpétuelle a été proclamée dans tout l'Empire. Le droit médiéval de vendetta est aboli et tous les litiges doivent désormais être réglés par les tribunaux."
 STATIC_MODIFIER_NAME_nd_hre_imperial_justice: "Justice Impériale"
 STATIC_MODIFIER_DESC_nd_hre_imperial_justice: "La Cour de la Chambre Impériale a été créée, constituant une institution judiciaire suprême où les différends des princes et les griefs des sujets peuvent être jugés conformément au droit romain."
 STATIC_MODIFIER_NAME_nd_hre_cuius_regio: "Cuius Regio, Eius Religio"
 STATIC_MODIFIER_DESC_nd_hre_cuius_regio: "Le principe selon lequel chaque souverain peut déterminer la religion de son territoire a mis fin à la guerre de religion ouverte au sein de l'Empire, établissant un cadre pour la coexistence confessionnelle."
 STATIC_MODIFIER_NAME_nd_hre_westphalian_order: "Ordre westphalien"
 STATIC_MODIFIER_DESC_nd_hre_westphalian_order: "La Paix de Westphalie a remanié les fondements constitutionnels de l'Empire. La tolérance religieuse est inscrite dans la loi, les droits souverains sont clarifiés et une nouvelle ère d’ordre diplomatique commence."
 ## Levy Names ##
 levy_nd_hre_imperial_reiter: "Prélèvement impérial Reiter"
 levy_nd_hre_imperial_reiter_desc: "Chevaliers à cheval féodaux issus des domaines nobles de l'Empire."
 levy_nd_hre_reichsheer: "Prélèvement du Reichsheer"
 levy_nd_hre_reichsheer_desc: "Contingents d'infanterie levés grâce au système de contribution militaire impérial."
 levy_nd_hre_kreistruppen: "Kreistruppen Levy"
 levy_nd_hre_kreistruppen_desc: "Infantry quotas owed by the estates of every Imperial Circle under the defence ordinance."
 ## Event Localization ##
 nd_hre.2.t: "La paix publique perpétuelle"
 nd_hre.2.d: "At the Diet of Worms, the assembled estates of the Empire have proclaimed the Ewiger Landfriede, the Perpetual Public Peace. This solemn declaration abolishes forever the ancient right of vendetta that has plagued our realm for centuries. Henceforth, no prince, knight, or city may take up arms to settle private disputes. All grievances must be brought before the Imperial courts.\n\nThe Landfriede represents more than a mere prohibition of private warfare. It is a declaration that the Empire is a community of law, bound together not by the sword alone but by shared institutions and the pursuit of justice. The newly established Reichskammergericht stands ready to adjudicate the disputes that once would have been settled on the battlefield.\n\nShall we embrace this new order as the foundation of imperial governance, or accept it as a welcome respite from disorder?"
 nd_hre.2.a: "Cette paix sera le fondement de notre royaume."
 nd_hre.2.b: "La paix doit être défendue avec force."
 nd_hre.3.t: "La Cour de la Chambre Impériale"
 nd_hre.3.d: "The Reichskammergericht has been established as the supreme judicial institution of the Holy Roman Empire. Unlike the Emperor's personal Aulic Council, this court derives its authority from the Imperial Diet itself, staffed by learned jurists trained in Roman law and nominated by the Imperial estates.\n\nIts jurisdiction encompasses all disputes between the territories of the Empire, breaches of the public peace, violations of Imperial decrees, property conflicts between princes, and the grievances of subjects against their overlords. For the first time, the Empire possesses a permanent judicial institution capable of resolving the conflicts that have destabilized the realm for generations.\n\nThe establishment of this court marks a transformation in how the Empire governs itself. No longer must justice depend solely on the will and presence of the Emperor, it now resides in institutions of law."
 nd_hre.3.a: "Que la justice soit le pilier de l'autorité impériale."
 nd_hre.3.b: "Laissons la cour étendre notre influence à travers l’Empire."
 nd_hre.4.t: "La paix religieuse d'Augsbourg"
 nd_hre.4.d: "After decades of confessional strife that threatened to tear the Empire apart, the assembled estates have reached a settlement of extraordinary consequence. The Peace of Augsburg establishes the principle of cuius regio, eius religio, each ruler may determine whether Catholicism or Lutheranism shall be the official confession of their territory.\n\nThis is no declaration of individual religious freedom, but rather a pragmatic accommodation between sovereign princes. Subjects who cannot accept their ruler's chosen confession may sell their property and emigrate to a territory of their preferred faith. The ecclesiastical reservation protects Church properties, while the Declaratio Ferdinandei permits existing Lutheran practice in certain ecclesiastical territories.\n\nThe peace is imperfect, Calvinism remains unrecognized, and the competing claims of confessional truth have merely been managed, not resolved. Yet it offers the Empire what it needs most: an end to open religious warfare and a framework for coexistence."
 nd_hre.4.a: "Que chaque prince gouverne selon sa conscience."
 nd_hre.4.b: "Une foi, un empire. Il ne peut y avoir aucun compromis."
 nd_hre.5.t: "La paix de Westphalie"
 nd_hre.5.d: "After thirty years of war that killed eight million souls and devastated the heart of Europe, the great powers have concluded the Peace of Westphalia in the twin cities of Muenster and Osnabrueck. The settlement reshapes the constitutional order of the Holy Roman Empire itself.\n\nCalvinism is now recognized alongside Catholicism and Lutheranism. The sovereignty of the Imperial estates is confirmed and expanded: they may conduct their own foreign policy, so long as they do not act against the Emperor or the Empire. The Imperial Diet gains new powers, and the constitutional balance between Emperor and estates is codified in ways that will endure for generations.\n\nFor the wider world, Westphalia establishes principles that will define the emerging international order: the equality of sovereign states, the inviolability of territorial boundaries, and the obligation of non-interference in the internal affairs of other polities. The Empire emerges diminished in some respects but with a constitutional framework more sophisticated than any other in Europe."
 nd_hre.5.a: "Un nouvel ordre pour l'Empire et pour l'Europe."
 nd_hre.5.b: "Reconstruisons ce que la guerre a détruit."
 nd_hre.6.t: "Les Lumières allemandes"
 nd_hre.6.d: "The Aufklarung has swept through the universities, courts, and salons of the Empire. From Leibniz's rational philosophy to Wolff's systematic metaphysics, German thinkers are reshaping European intellectual life. The dense network of Imperial universities, free cities with their printing presses, and princely courts competing for cultural distinction has created a uniquely fertile environment for the spread of Enlightenment ideals.\n\nEnlightened administrators across the Empire are applying rational principles to governance, reforming legal codes, establishing public education, promoting religious toleration, and modernizing state administration. The cameralist tradition, born of centuries of Imperial constitutional practice, is evolving into a comprehensive science of governance that other European states study and emulate.\n\nThe German Enlightenment is not merely an intellectual movement. It is transforming the institutions, laws, and administration of the Empire from within."
 nd_hre.6.a: "La raison sera notre guide."
 nd_hre_chancellery_maintenance: "Entretien de la Chancellerie"
 nd_hre_chancellery_maintenance_desc: "Maintaining the administrative records, legal books, seals and correspondence of an Imperial chancellery."
 nd_hre_fair_maintenance: "Entretien du parc des expositions"
 nd_hre_fair_maintenance_desc: "Préparer et entretenir les terrains, les stands et les installations pour les foires commerciales impériales."
 nd_hre_post_relay_upkeep: "Relay Upkeep"
 nd_hre_post_relay_upkeep_desc: "Remounts for the couriers, harness and mail bags, and paper for the postmaster's way bills."
 nd_hre_mining_operations: "Opérations minières"
 nd_hre_mining_operations_desc: "Fourniture de supports en bois et d'outils en fer pour les opérations de l'académie minière."
 nd_hre_court_maintenance: "Entretien du tribunal"
 nd_hre_court_maintenance_desc: "Conserver les archives, les sceaux, les livres de droit et la correspondance juridique d'une cour de justice impériale."
 nd_hre_university_maintenance: "Entretien de l'université"
 nd_hre_university_maintenance_desc: "Fournir des livres, du papier et du matériel scientifique à une université impériale."
 nd_hre_arsenal_maintenance: "Fortress Upkeep"
 nd_hre_arsenal_maintenance_desc: "Keeping arms, iron and powder in store at an Imperial fortress."
 nd_hre_palace_maintenance: "Entretien du palais"
 nd_hre_palace_maintenance_desc: "Entretenir la maçonnerie et le verre d'un grand palais baroque."
 nd_hre_rathaus_maintenance: "Entretien de la Mairie"
 nd_hre_rathaus_maintenance_desc: "Maintaining the stonework, records and furnished council chambers of an Imperial town hall."
 nd_hre_academy_maintenance: "Entretien de l'Académie"
 nd_hre_academy_maintenance_desc: "Providing horses, saddlery, arms and instructors for a cavalry training academy."
 STATIC_MODIFIER_NAME_nd_hre_armed_peace: "Paix armée"
 STATIC_MODIFIER_DESC_nd_hre_armed_peace: "La paix publique perpétuelle est maintenue non seulement par la loi, mais par la préparation militaire des domaines impériaux. La paix est préservée parce que tous connaissent le prix à payer si elle est rompue."
 STATIC_MODIFIER_NAME_nd_hre_imperial_diplomacy: "Diplomatie Impériale"
 STATIC_MODIFIER_DESC_nd_hre_imperial_diplomacy: "La Cour de la Chambre Impériale étend l'influence diplomatique de l'Empire, car son autorité légale résout des différends qui auraient autrefois nécessité l'intervention d'ambassadeurs et d'armées."
 STATIC_MODIFIER_NAME_nd_hre_religious_conformity: "Conformité religieuse"
 STATIC_MODIFIER_DESC_nd_hre_religious_conformity: "Une foi, un empire. L’insistance sur l’uniformité religieuse renforce l’autorité de l’État et la cohésion sociale, même au prix de l’absence de dissidence."
 STATIC_MODIFIER_NAME_nd_hre_postwar_recovery: "Récupération d'après-guerre"
 STATIC_MODIFIER_DESC_nd_hre_postwar_recovery: "Les ravages de la guerre cèdent la place à la reconstruction. Le commerce reprend, les champs sont replantés et l’économie se remet lentement de la catastrophe."
