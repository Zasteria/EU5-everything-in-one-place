l_french:
 STATIC_MODIFIER_NAME_nd_bej_lords_of_the_red_sea: "Seigneurs de la Mer Rouge"
 STATIC_MODIFIER_DESC_nd_bej_lords_of_the_red_sea: "Les Beja ont revendiqué la domination sur la côte de la mer Rouge, canalisant la richesse de siècles de commerce maritime à travers Suakin et les entrepôts construits en corail qui parsèment le littoral. Des marchands d’Arabie, d’Inde et d’ailleurs affluent dans nos ports."
 STATIC_MODIFIER_NAME_nd_bej_sons_of_the_desert: "Fils du désert"
 STATIC_MODIFIER_DESC_nd_bej_sons_of_the_desert: "Les enfants du désert oriental chevauchent comme leurs ancêtres, rapides, implacables et invincibles. À dos de chameau et à pied, les guerriers Beja frappent sans avertissement et disparaissent dans les collines de la mer Rouge avant qu'un ennemi puisse réagir."
 STATIC_MODIFIER_NAME_nd_bej_suakin_ascendant: "Ascendant Suakin"
 STATIC_MODIFIER_DESC_nd_bej_suakin_ascendant: "Le port de Suakin, construit en corail, est devenu le premier centre commercial de l'ouest de la mer Rouge, attirant des marchands du Hedjaz et au-delà."
 STATIC_MODIFIER_NAME_nd_bej_law_of_the_silif: "Loi du Silif"
 STATIC_MODIFIER_DESC_nd_bej_law_of_the_silif: "L'ancien code non écrit des Beja, le silif, a été codifié et universellement accepté par tous les clans, apportant ordre et stabilité à la confédération."
 nd_bej.1.t: "Montée de la Beja"
 nd_bej.1.d: "The scattered clans of the Beja have at last united under a single banner. From the gold mines of Wadi Allaqi to the coral quays of Suakin, from the Red Sea Hills to the Eritrean lowlands, the Bedawiye-speaking peoples stand together as one nation.\n\nThe question now is what path this united Beja state shall pursue. The Red Sea coast offers fabulous wealth through trade with Arabia and the Indian Ocean world, Suakin already rivals Jeddah as a port of passage. But the desert itself is the Beja heartland, and camel-mounted warriors have raided and defended these lands since time immemorial.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_bej.1.a: "Commandez les voies commerciales de la mer Rouge !"
 nd_bej.1.b: "Le désert est notre forteresse et notre épée !"
 nd_bej.2.t: "Perle de la Mer Rouge"
 nd_bej.2.d: "Suakin has blossomed into the greatest port on the western Red Sea coast. Its distinctive coral-block houses, rising four stories above narrow winding streets, testify to the wealth flowing through its harbor. Ships from Jeddah, Aden, and the Swahili coast crowd the anchorage, and Beja caravaneers link the port to the gold fields of the interior.\n\nThe port's customs revenues now rival those of any city in the Horn of Africa. Pilgrims bound for Mecca, merchants trading in pearls and mother-of-pearl, and slave caravans heading north all pass through our toll gates."
 nd_bej.2.a: "Suakin sera le joyau de notre royaume !"
 nd_bej.2.b: "Suakin deviendra l'ancre de notre flotte."
 nd_bej.3.t: "Le Silif perdure"
 nd_bej.3.d: "For generations, the Beja have governed themselves through the silif, the body of unwritten customary law that regulates every aspect of life from grazing rights to blood feuds, from marriage contracts to trade disputes. Elders of each clan meet in assembly to mediate conflicts, and their judgments carry the weight of ancestral tradition.\n\nNow, as our confederation grows and encounters new challenges, the silif has been formalized and extended. Where once only oral memory preserved the law, now recognized assemblies of clan elders render consistent judgments across the entire Beja territory."
 nd_bej.3.a: "La sagesse de nos ancêtres nous guidera."
 nd_bej.3.b: "La loi doit être appliquée d’une main ferme."
 nd_bej.4.t: "L'ascension d'Hadendowa"
 nd_bej.4.d: "The Hadendowa, the most powerful of the Beja sub-confederations, have consolidated their dominance over the eastern lowlands. Their warriors, distinctive with their elaborate tiffa hairstyles and armed with straight-bladed swords and hide shields, are feared throughout the region.\n\nThe Hadendowa have demonstrated a capacity for organized military action that surpasses anything the Beja have achieved before, coordinating raids and defensive campaigns across hundreds of kilometers of desert."
 nd_bej.4.a: "Le Hadendowa sera notre bras d'épée."
 nd_bej_desert_riders: "Cavaliers du désert"
 nd_bej_desert_riders_desc: "L'ancienne tradition Beja de guerre à dos de chameau, perfectionnée au fil des millénaires de raids dans le désert et d'escorte de caravanes."
 nd_bej_wadi_allaqi_mines: "Mines de Wadi Allaqi"
 nd_bej_wadi_allaqi_mines_desc: "Les gisements d'or de Wadi Allaqi et du désert oriental, exploités par les clans Beja depuis l'Antiquité égyptienne."
 nd_bej_camel_breeding: "Élevage de chameaux"
 nd_bej_camel_breeding_desc: "Elevage sélectif de chameaux pour l'endurance et la vitesse, pierre angulaire de la richesse pastorale de Beja."
 nd_bej_caravan_guardians: "Gardiens de caravane"
 nd_bej_caravan_guardians_desc: "Tours de guet de Beja et escortes armées protégeant les routes commerciales vitales à travers les collines de la mer Rouge."
 nd_bej_tribal_custom: "Coutume tribale"
 nd_bej_tribal_custom_desc: "Forme la plus ancienne du silif, traditions orales régissant le comportement des clans, les droits de pâturage et la résolution des conflits."
 nd_bej_salt_routes: "Routes du Sel"
 nd_bej_salt_routes_desc: "Control of salt deposits and the caravan routes that distribute this vital commodity across the Eastern Desert."
 nd_bej_sword_and_shield: "Épée et Bouclier"
 nd_bej_sword_and_shield_desc: "Le redoutable style de combat Beja combine des épées à lame droite avec de petits boucliers ronds en cuir et en bois dans un combat rapproché dévastateur."
 nd_bej_suakin_entrepot: "Entrepôt Suakin"
 nd_bej_suakin_entrepot_desc: "Développement de Suakin en tant que premier port de commerce de la mer Rouge, avec son architecture distinctive en blocs de corail et sa communauté marchande florissante."
 nd_bej_red_sea_dhows: "Boutres de la Mer Rouge"
 nd_bej_red_sea_dhows_desc: "Des boutres avec équipage Beja sillonnent les routes commerciales de la mer Rouge entre l'Afrique, l'Arabie et l'océan Indien."
 nd_bej_islamic_integration: "Intégration islamique"
 nd_bej_islamic_integration_desc: "L'adoption progressive de l'Islam grâce aux mariages mixtes avec des commerçants arabes et à la participation au commerce de la mer Rouge."
 nd_bej_emerald_trade: "Commerce d'émeraude"
 nd_bej_emerald_trade_desc: "Exploitation of the Eastern Desert emerald deposits, known since Ptolemaic times as the fabled mines of Cleopatra."
 nd_bej_clan_alliances: "Alliances de clans"
 nd_bej_clan_alliances_desc: "Le système Beja d'alliances de mariage entre cousins ​​​​croisés qui lie les clans et empêche la fragmentation dans l'environnement désertique hostile."
 nd_bej_desert_scouts: "Éclaireurs du désert"
 nd_bej_desert_scouts_desc: "Des éclaireurs à cheval d'élite qui connaissent chaque oued, khor et source d'eau des collines de la mer Rouge, les yeux et les oreilles de la confédération Beja."
 nd_bej_silif_codification: "Codification Silif"
 nd_bej_silif_codification_desc: "Formalisation du silif, l'ancien droit coutumier Beja régissant les différends, les alliances et le partage des ressources entre toutes les sous-confédérations."
 nd_bej_sambuk_trade: "Navires commerciaux Sambuk"
 nd_bej_sambuk_trade_desc: "De plus grands sambuks à gréement latin construits pour le commerce à longue distance sur la mer Rouge, transportant des marchandises entre les ports africains et la péninsule arabique."
 nd_bej_hajj_facilitators: "Animateurs du Hajj"
 nd_bej_hajj_facilitators_desc: "Beja contrôle la route terrestre depuis la vallée du Nil jusqu'aux ports de la mer Rouge, facilitant le pèlerinage à La Mecque et profitant du trafic."
 nd_bej_desert_warfare: "Guerre du désert"
 nd_bej_desert_warfare_desc: "Maîtrise des tactiques de combat dans le désert (vitesse, surprise et choc) perfectionnées au fil de générations de raids et de guerres tribales."
 nd_bej_port_customs: "Douanes portuaires"
 nd_bej_port_customs_desc: "Taxation systématique des marchandises transitant par les ports de la mer Rouge contrôlés par Beja, notamment Suakin."
 nd_bej_hadendowa_confederation: "Confédération Hadendowa"
 nd_bej_hadendowa_confederation_desc: "La montée des Hadendowa en tant que sous-confédération Beja dominante, organisant la force guerrière la plus redoutable de l’est du Soudan."
 nd_bej_mountain_refuge: "Refuge de montagne"
 nd_bej_mountain_refuge_desc: "Les collines de la mer Rouge et leurs khors inaccessibles servent de refuge imprenable, frustrant les tentatives d'assujettissement des Ottomans et des Funj."
 nd_bej_tribal_commerce: "Commerce tribal"
 nd_bej_tribal_commerce_desc: "Réseaux commerciaux intertribales formalisés reliant l’intérieur du désert à la côte de la mer Rouge."
 nd_bej_khor_strongholds: "Forteresses de Khor"
 nd_bej_khor_strongholds_desc: "Des positions fortifiées dans les ravins étroits et les lits de rivières asséchés des collines de la mer Rouge, où de petites forces peuvent tenir tête à des armées beaucoup plus importantes."
 nd_bej_desert_smiths: "Forgerons du désert"
 nd_bej_desert_smiths_desc: "Tradition de travail des métaux de Beja produisant les épées à lame droite et les fers de lance caractéristiques utilisés par leurs guerriers."
 nd_bej_pastoral_wealth: "Richesse pastorale"
 nd_bej_pastoral_wealth_desc: "Diversification de l'élevage de Beja pour inclure des bovins aux côtés de chameaux, de moutons et de chèvres, développant ainsi l'économie pastorale."
 nd_bej_elite_desert_cavalry: "Cavalerie d'élite du désert"
 nd_bej_elite_desert_cavalry_desc: "La meilleure cavalerie de chameaux Beja, entraînée pour des campagnes soutenues dans le désert et capable de parcourir de vastes distances à grande vitesse."
 nd_bej_hijaz_gateway: "Passerelle du Hedjaz"
 nd_bej_hijaz_gateway_desc: "Suakin comme principal point de passage entre l'Afrique et le Hijaz, reliant la vallée du Nil à La Mecque et Médine."
 nd_bej_desert_logistics: "Logistique du désert"
 nd_bej_desert_logistics_desc: "Une expertise inégalée en matière de navigation dans le désert, de gestion des sources d'eau et de déplacements à longue distance à travers le désert oriental."
 nd_bej_confederal_diplomacy: "Diplomatie confédérale"
 nd_bej_confederal_diplomacy_desc: "Compétence diplomatique née de la gestion d'une confédération de clans farouchement indépendants, les Hadendowa, Bisharin, Amarar et Ababda."
 nd_bej_eastern_desert_resources: "Ressources du désert oriental"
 nd_bej_eastern_desert_resources_desc: "Expanded exploitation of copper, nickel, and other mineral resources found throughout the Eastern Desert, with charcoal smelting.\n\n#italic Available in: $nd_bej_smithy$#!"
 nd_bej_unbroken_warriors: "Guerriers ininterrompus"
 nd_bej_unbroken_warriors_desc: "L'héritage martial des Beja perdure jusqu'à l'ère moderne. Ce sont ces guerriers qui briseraient un jour un carré d’infanterie britannique à Tamai."
 nd_bej_red_sea_modernization: "Modernisation de la Mer Rouge"
 nd_bej_red_sea_modernization_desc: "Adaptation des pratiques commerciales de Beja aux modèles changeants du commerce de la mer Rouge à l'ère moderne."
 nd_bej_bedawiye_identity: "Identité Bedawiye"
 nd_bej_bedawiye_identity_desc: "L'identité culturelle durable des peuples de langue bedawiye, maintenue à travers des millénaires de pressions et de changements extérieurs."
 nd_bej_eastern_sudan: "Soudan oriental"
 nd_bej_eastern_sudan_desc: "Consolidation du contrôle des Beja sur l'est du Soudan, de la frontière égyptienne jusqu'aux basses terres érythréennes."
 nd_bej_pastoral_endurance: "Endurance pastorale"
 nd_bej_pastoral_endurance_desc: "La résilience remarquable de l’économie pastorale de Beja, s’adaptant à la sécheresse, à la guerre et à l’évolution des modèles commerciaux au fil des siècles."
 a_nd_bej_camel_raiders: "Béja Camel Raiders"
 a_nd_bej_camel_raiders_desc: "Rapides pillards du désert à dos de chameau, ces guerriers frappent sans avertissement et disparaissent dans les déserts sans piste avant qu'une réponse organisée puisse être organisée."
 a_nd_bej_swordsmen: "Épéistes de Beja"
 a_nd_bej_swordsmen_desc: "Guerriers féroces maniant des épées à lame droite et de petits boucliers ronds de peau et de bois, les épéistes Beja sont dévastateurs au corps à corps."
 a_nd_bej_mounted_scouts: "Scouts montés de Beja"
 a_nd_bej_mounted_scouts_desc: "Des cavaliers d'élite qui connaissent tous les oueds et sources d'eau du désert oriental, servant d'éclaireurs, de pillards et de première ligne de défense pour la confédération Beja."
 a_nd_bej_hadendowa_warriors: "Guerriers Hadendowa"
 a_nd_bej_hadendowa_warriors_desc: "Les Hadendowa sont les plus redoutées des sous-confédérations Beja, des guerriers aux coiffures tiffa élaborées dont les charges massives peuvent submerger même des formations disciplinées."
 n_nd_bej_dhow: "Boutre de Béja"
 n_nd_bej_dhow_desc: "Un navire au gréement latin avec équipage de marins Beja, construit pour la vitesse sur les routes commerciales de la mer Rouge. Léger et rapide, mais fragile en combat naval."
 n_nd_bej_sambuk: "Sambuk de la Mer Rouge"
 n_nd_bej_sambuk_desc: "Un plus grand navire à gréement latin conçu pour le commerce à longue distance sur la mer Rouge, transportant des marchandises entre la côte africaine et l'Arabie."
 a_nd_bej_desert_cavalry: "Cavalerie du désert de Beja"
 a_nd_bej_desert_cavalry_desc: "Guerriers d'élite à dos de chameau de l'ère de l'absolutisme, combinant l'expertise du désert de Beja avec des armes et des tactiques améliorées."
 nd_bej_gold_camp: "Camp de la mine d'or"
 nd_bej_gold_camp_desc: "Un site d'extraction d'or du désert oriental géré par les clans Beja, poursuivant une tradition minière remontant à l'époque pharaonique."
 nd_bej_camel_market: "Marché aux chameaux"
 nd_bej_camel_market_desc: "Un centre prospère pour l'élevage et le commerce des chameaux de Beja, où les meilleurs chameaux de monte et de bât du nord-est de l'Afrique changent de mains."
 nd_bej_emerald_workshop: "Emerald Workshop"
 nd_bej_emerald_workshop_desc: "A row of cutters' benches. The rough stones brought down from the desert mines are sorted, cut and polished here before the merchants see them."
 nd_bej_coral_house: "Maison en pierre de corail"
 nd_bej_coral_house_desc: "Une maison commerciale distinctive à plusieurs étages construite à partir de blocs de corail extraits du fond de la mer Rouge, dans le style du quartier marchand de Suakin."
 nd_bej_desert_watchtower: "Tour de guet du désert"
 nd_bej_desert_watchtower_desc: "Un poste d'observation fortifié gardant les routes des caravanes à travers les collines de la mer Rouge, tenu par des guerriers Beja."
 nd_bej_tribal_assembly: "Assemblée tribale"
 nd_bej_tribal_assembly_desc: "Un lieu de rassemblement où les anciens du clan Beja se réunissent pour régler les différends, attribuer les droits de pâturage et rendre un jugement selon le silif."
 nd_bej_hajj_hostel: "Auberge de jeunesse Hajj"
 nd_bej_hajj_hostel_desc: "Une étape sur la route de pèlerinage vers la Mecque, offrant hébergement et provisions aux voyageurs traversant la vallée du Nil jusqu'à la côte de la mer Rouge."
 nd_bej_khor_fortress: "Forteresse de Khor"
 nd_bej_khor_fortress_desc: "Une position fortifiée construite dans un ravin étroit des collines de la mer Rouge, où le terrain lui-même devient le mur le plus solide."
 nd_bej_smithy: "Forge de Béja"
 nd_bej_smithy_desc: "Un atelier de métallurgie dans le désert produisant les épées à lame droite et les fers de lance distinctifs qui arment les guerriers Beja."
 nd_bej_emerald_polishing: "Polissage émeraude"
 nd_bej_emerald_polishing_desc: "The green stones of the Eastern Desert mines are cut and polished. They are sold set and unset in the markets of Egypt and the Hijaz."
 nd_bej_charcoal_production: "Charcoal Smelting"
 nd_bej_charcoal_production_desc: "Acacia from the wadis is burned to charcoal. Copper ore from the desert mines is smelted over it and cast into tools."
 nd_bej_gold_camp_upkeep: "Opérations du camp d'or"
 nd_bej_gold_camp_upkeep_desc: "Supports en bois et outils en pierre nécessaires au maintien des opérations d'extraction de l'or."
 nd_bej_camel_market_upkeep: "Opérations du marché aux chameaux"
 nd_bej_camel_market_upkeep_desc: "Aliments pour le bétail et installations nécessaires au fonctionnement du centre de commerce des chameaux."
 nd_bej_coral_house_upkeep: "Entretien de la maison de corail"
 nd_bej_coral_house_upkeep_desc: "Pierre et bois nécessaires à l'entretien des maisons de commerce en blocs de corail."
 nd_bej_watchtower_upkeep: "Garnison de la Tour de Guet"
 nd_bej_watchtower_upkeep_desc: "Fortifications en pierre et armes pour la garnison qui occupe la tour de guet du désert."
 nd_bej_assembly_upkeep: "Dispositions d'assemblage"
 nd_bej_assembly_upkeep_desc: "Bétail pour l’hospitalité traditionnelle requise lors de l’accueil des assemblées d’anciens du clan."
 nd_bej_hajj_hostel_upkeep: "Dispositions de l'auberge"
 nd_bej_hajj_hostel_upkeep_desc: "Nourriture et bétail pour offrir l’hospitalité aux pèlerins de passage en route vers la Mecque."
 nd_bej_khor_fortress_upkeep: "Garnison de la forteresse"
 nd_bej_khor_fortress_upkeep_desc: "Pierre et armes pour entretenir la garnison de la forteresse de Khor."
 nd_bej_smithy_upkeep: "Forge d'armes dans le désert"
 nd_bej_smithy_upkeep_desc: "Les forgerons de Beja forgent du fer avec du charbon de bois pour fabriquer des épées à lame droite et des fers de lance qui arment les guerriers du désert."
 levy_nd_bej_camel_raiders: "Prélèvement sur les pilleurs de chameaux de Beja"
 levy_nd_bej_camel_raiders_desc: "Les membres de la tribu Beja ont été élevés comme pillards à dos de chameau dans le style traditionnel de la guerre dans le désert."
 levy_nd_bej_hadendowa_warriors: "Prélèvement du guerrier Hadendowa"
 levy_nd_bej_hadendowa_warriors_desc: "De redoutables fantassins Hadendowa élevés dans les basses terres de l'est, armés d'une épée et d'un bouclier."
 STATIC_MODIFIER_NAME_nd_bej_naval_power: "Puissance navale de Béja"
 STATIC_MODIFIER_DESC_nd_bej_naval_power: "La richesse de Suakin finance une flotte de boutres et de sambuks armés qui projettent la puissance Beja à travers la mer Rouge, protégeant les routes commerciales et établissant l'autorité maritime."
 STATIC_MODIFIER_NAME_nd_bej_silif_enforcement: "Application du Silif"
 STATIC_MODIFIER_DESC_nd_bej_silif_enforcement: "Le silif codifié est appliqué avec une autorité ferme dans tous les clans, apportant ordre et prévisibilité à la gouvernance dans l'ensemble de la confédération Beja."
 nd_bej_formed_tt: "Beja a été formé"
 nd_bej_path_a_tt: "Les seigneurs choisis de la mer Rouge"
 nd_bej_path_b_tt: "Les fils choisis du désert"
 nd_bej_destiny: "Béja Destin"
 nd_bej_destiny_desc: "Les Beja sont unis, une nation forgée à partir des clans du désert. La question est désormais de savoir s’il faut regarder vers l’extérieur, à travers la mer Rouge, ou vers l’intérieur, à travers les sables."
 nd_bej_dest_red_sea_ports: "Ports de la Mer Rouge"
 nd_bej_dest_red_sea_ports_desc: "Sécurisez les grands ports de la mer Rouge de Suakin et Aydhab, établissant ainsi le contrôle de Beja sur le commerce maritime de la côte ouest."
 nd_bej_dest_arabian_trade: "Commerce arabe"
 nd_bej_dest_arabian_trade_desc: "Étendre l'influence commerciale de Beja à travers la mer Rouge jusqu'à Djeddah, en exploitant le commerce des pèlerins et des perles qui relie l'Afrique à l'Arabie."
 nd_bej_dest_red_sea_hegemony: "Hégémonie de la mer Rouge"
 nd_bej_dest_red_sea_hegemony_desc: "Contrôlez toute la mer Rouge, d'Aden à Dahlak, devenant ainsi le maître incontesté de la voie navigable la plus stratégique au monde."
 nd_bej_dest_nubian_conquest: "Conquête nubienne"
 nd_bej_dest_nubian_conquest_desc: "Marchez vers le cœur de la Nubie et saisissez Dongola et Kassala, étendant ainsi le pouvoir des Beja sur le couloir du haut Nil."
 nd_bej_dest_nile_march: "Marche du Nil"
 nd_bej_dest_nile_march_desc: "Poussez vers le sud le long du Nil jusqu'à Sennar et vers l'ouest jusqu'aux hauts plateaux éthiopiens, forgeant un empire du désert des collines de la mer Rouge au Nil Bleu."
 nd_bej_dest_desert_empire: "Empire du désert"
 nd_bej_dest_desert_empire_desc: "Conquérir tout l'est du Soudan, de Berbère à Soba, en unifiant le corridor du Nil sous la domination Beja dans un empire s'étendant des cataractes jusqu'à la confluence."
 nd_bej.5.t: "Une nation forgée dans le sable"
 nd_bej.5.d: "The Beja confederation has proven its strength. From the Red Sea Hills to the coastal lowlands, the Bedawiye-speaking clans have found common purpose. Our elders have spoken, and the silif binds us as one people.\n\nThe path ahead is ours to choose, and the destiny we forge shall echo through the ages."
 nd_bej.5.a: "Notre destin nous attend."
 nd_bej.6.t: "Les ports de corail"
 nd_bej.6.d: "The great ports of the western Red Sea now fly the Beja banner. Suakin, with its coral-block houses rising from the turquoise waters, and ancient Aydhab, the old pilgrim port, are ours. Merchant dhows from Arabia and India crowd our harbors, and the customs revenues swell our treasury.\n\nThe Beja have transformed from desert raiders into masters of maritime commerce. The wealth of the Red Sea flows through our hands."
 nd_bej.6.a: "La mer est notre chemin vers la grandeur."
 nd_bej.7.t: "À travers la mer Rouge"
 nd_bej.7.d: "Beja merchants have crossed the Red Sea to establish themselves in Jeddah, the great port of the Hijaz. Our sambuks carry pearls, gold, and incense to Arabia and return laden with dates, textiles, and the wealth of the Islamic world.\n\nThis trade transforms us. We are no longer a coastal power but a node in a vast commercial network spanning two continents. The question is how to shape this new wealth, shall we invest in institutions and learning, or build a fleet to protect and expand our trade routes?"
 nd_bej.7.a: "Investissez dans des maisons d’apprentissage et de commerce."
 nd_bej.7.b: "Construire une flotte à la hauteur de nos ambitions."
 nd_bej.8.t: "Maîtres de la Mer Rouge"
 nd_bej.8.d: "From Aden at the mouth of the Red Sea to the Dahlak Archipelago, Beja power is unchallenged on these waters. No ship crosses from Africa to Arabia without our consent, and no caravan reaches the coast without paying our tolls.\n\nThe Red Sea, which the ancients called Mare Erythraeum, has become a Beja lake. Our coral ports gleam in the tropical sun, our sambuks rule the waves, and our merchants are welcomed from Cairo to Calicut. How shall we wield this unprecedented power?"
 nd_bej.8.a: "Favoriser les universitaires et les institutions d’apprentissage."
 nd_bej.8.b: "Projetez notre puissance à travers la mer."
 nd_bej.9.t: "Au cœur du pays nubien"
 nd_bej.9.d: "Beja warriors have swept out of the Red Sea Hills and into the Nile corridor. Dongola, the ancient capital of Makuria, and Kassala, guardian of the eastern approach, have fallen to our cavalry. The people of the Nile Valley, long accustomed to Nubian and Funj rule, now look upon Beja banners with a mixture of awe and apprehension.\n\nThe desert warriors have proven they can take cities as well as raid caravans."
 nd_bej.9.a: "Le désert engendre des conquérants."
 nd_bej.10.t: "La marche le long du Nil"
 nd_bej.10.d: "Our armies have pushed deep into the Sudan. Sennar, seat of the Funj sultanate, has been taken, and our scouts have reached the Ethiopian highlands at Axum. The Beja realm now stretches from the Red Sea coast to the Blue Nile, encompassing peoples and lands our ancestors knew only as distant trading partners.\n\nGoverning this sprawling domain requires new approaches. Shall we rule through fear and force of arms, or build the institutions of centralized command?"
 nd_bej.10.a: "Frappez vite, négociez en force."
 nd_bej.10.b: "Centraliser la commande de nos domaines."
 nd_bej.11.t: "Empire de sable et de pierre"
 nd_bej.11.d: "From the cataracts of the Nile to the confluence of the Blue and White Niles at Soba, the Beja flag flies over a vast desert empire. The ancient trading town of Berber, the fortress of Atbara, the ruins of Meroe: all are ours. No power in eastern Africa can challenge the warriors of the Eastern Desert.\n\nThis empire is unprecedented in Beja history. Our ancestors raided and traded; we have conquered and ruled. How shall we consolidate this achievement?"
 nd_bej.11.a: "Maintenir notre machine de guerre à tout prix."
 nd_bej.11.b: "Absorbez les vaincus dans notre nation."
 STATIC_MODIFIER_NAME_nd_bej_dest_suakin_gateway_a: "Passerelle Suakin"
 STATIC_MODIFIER_DESC_nd_bej_dest_suakin_gateway_a: "La richesse du commerce arabe alimente la croissance institutionnelle et l’expansion commerciale dans tout le royaume de Beja, même si le maintien de nos armées met à rude épreuve la trésorerie."
 STATIC_MODIFIER_NAME_nd_bej_dest_suakin_gateway_b: "Flotte de la mer Rouge"
 STATIC_MODIFIER_DESC_nd_bej_dest_suakin_gateway_b: "Une puissante flotte de boutres et de sambuks projette l'influence Beja à travers la mer Rouge, soutenue par la piété de l'érudition islamique."
 STATIC_MODIFIER_NAME_nd_bej_dest_red_sea_masters_a: "Savants de la mer"
 STATIC_MODIFIER_DESC_nd_bej_dest_red_sea_masters_a: "La richesse du commerce de la mer Rouge est investie dans l’alphabétisation et l’apprentissage, même si nos érudits considèrent la guerre avec dégoût."
 STATIC_MODIFIER_NAME_nd_bej_dest_red_sea_masters_b: "Domination maritime"
 STATIC_MODIFIER_DESC_nd_bej_dest_red_sea_masters_b: "La domination maritime de Beja attire des sujets fidèles et des colons sur la côte de la mer Rouge, élevant la confédération parmi les grandes puissances."
 STATIC_MODIFIER_NAME_nd_bej_dest_nile_conquerors_a: "Pillards du désert"
 STATIC_MODIFIER_DESC_nd_bej_dest_nile_conquerors_a: "Les raids rapides et les réseaux de renseignement donnent au Beja un levier dans les négociations, même si une expansion rapide met nos finances à rude épreuve."
 STATIC_MODIFIER_NAME_nd_bej_dest_nile_conquerors_b: "Commandement central"
 STATIC_MODIFIER_DESC_nd_bej_dest_nile_conquerors_b: "Une structure de commandement militaire centralisée coordonne les campagnes dans le désert et réduit le coût d’une déclaration de guerre."
 STATIC_MODIFIER_NAME_nd_bej_dest_desert_empire_a: "Légions ininterrompues"
 STATIC_MODIFIER_DESC_nd_bej_dest_desert_empire_a: "La machine de guerre Beja est soutenue par des renforts bon marché, des auxiliaires mercenaires et un vaste réseau diplomatique."
 STATIC_MODIFIER_NAME_nd_bej_dest_desert_empire_b: "Seigneurs des Conquis"
 STATIC_MODIFIER_DESC_nd_bej_dest_desert_empire_b: "Les Beja absorbent les peuples conquis par la tolérance et l'assimilation, même si l'empire devient complaisant face au succès."
 nd_bej_red_sea_trading_house: "Maison de commerce de la mer Rouge"
 nd_bej_red_sea_trading_house_desc: "Une grande maison de commerce de corail et de pierre commandant le commerce de la mer Rouge, le joyau du pouvoir marchand de Beja."
 nd_bej_trading_house_upkeep: "Opérations des maisons de commerce"
 nd_bej_trading_house_upkeep_desc: "Pierre, bois, tissu et papier nécessaires à l'entretien de la grande maison de commerce et de ses registres commerciaux."
 nd_bej_desert_war_camp: "Camp de guerre du désert"
 nd_bej_desert_war_camp_desc: "Une base avancée fortifiée pour les campagnes dans le désert, où les guerriers Beja se rassemblent, se réapprovisionnent et se préparent pour le prochain assaut."
 nd_bej_war_camp_upkeep: "Garnison du camp de guerre"
 nd_bej_war_camp_upkeep_desc: "Armes, cuir, bétail et pierre nécessaires au maintien du camp de guerre du désert et de sa garnison."

 # ===== BUREAUCRACY =====
 AUTO_MODIFIER_NAME_nd_bej_bureaucracy_authority: "Conseil Confédéral de Béja"
 AUTO_MODIFIER_DESC_nd_bej_bureaucracy_authority: "Avec l'unification, la confédération Beja abrite désormais un conseil permanent composé de nazirs de clan, de gardiens de port et de juristes silif qui se réunissent chaque fois que les chefs se réunissent. Leur assemblée est le squelette institutionnel durable sur lequel l'État de Beja accroche chaque bureau de travail, depuis les douanes des caravanes jusqu'à la concession de l'or jusqu'à la loi du dur."

 bej_silif_council_bureaucracy: "Conseil de Silif"
 bej_silif_council_bureaucracy_desc: "Corps codifié du droit coutumier Beja, le silif (également salif chez les Hadendowa), administré par des assemblées assises des anciens du clan. Le silif régit les droits de pâturage, les vendettas, les contrats de mariage et les conflits commerciaux, la responsabilité s'élevant vers le chef de famille, le cheikh du clan et le nazir tribal. Ses jugements mélangent le précédent islamique avec la tradition orale Beja et lient tous les niveaux de la confédération ; soutenue, elle est le fondement de l'ordre pastoral, négligée, elle se dissout dans les querelles de clans et l'impuissance centrale."

 bej_hadariba_wardenship_bureaucracy: "Surveillance d'Hadariba"
 bej_hadariba_wardenship_bureaucracy_desc: "Le pacte de partage des douanes par lequel les clans Hadariba gardaient les routes caravanières et les entrepôts de la mer Rouge en échange d'une part fixe des droits portuaires. Au moment où Ibn Battuta visita Suakin en 1332, un sultan Hadariba dirigeait la moitié continentale du port et partageait les douanes avec le suzerain du large ; plus tard, la Hadariba brisa le monopole du commerce de l'or et transforma la route vers l'est via Suakin en canal principal après que le sultan Barsbay détruisit Aydhab en 1426. Soutenue, elle génère des revenus et protège les caravanes à travers des centaines de kilomètres de désert ; négligées, les routes ne sont pas surveillées et les commerçants évitent les ports de Beja."

 bej_wadi_allaqi_concession_bureaucracy: "Concession de Wadi Allaqi"
 bej_wadi_allaqi_concession_bureaucracy_desc: "L'accord formel selon lequel les clans Beja exploitaient les gisements d'or de Wadi Allaqi et du désert oriental en tandem avec des concessionnaires extérieurs. Cet arrangement remonte à la ruée vers l'or de l'ère fatimide, au Xe siècle, et a persisté jusqu'à la fin de la période mamelouke, alors que le trésor du Caire exigeait sa part. Soutenue, elle rapporte de l’argent aux chefs comme à l’État ; négligées, les chantiers inondent, les ouvriers fellahs désertent et la production d'or s'effondre dans le profit local."

 bej_nazirate_of_dur_bureaucracy: "Nazirat du Dur"
 bej_nazirate_of_dur_bureaucracy_desc: "Le système des nazirs gouvernant les terres tribales (chacun étant appelé dar ; pluriel dur), adapté du modèle administratif que le sultanat de Funj Sennar a développé après 1504 pour gouverner ses divers sujets pastoraux. Chaque nazir détient l'autorité judiciaire coutumière au sein de son dar, paie tribut au trésor central et prélève des prélèvements auprès de sa tribu. Cette institution donne à l’État Beja un cadre viable pour gouverner les populations nomades sur d’énormes distances, au prix d’un transfert perpétuel du pouvoir réel aux grands tribaux qui survivent à tous les régimes centraux."
