l_french:
 # ===== Static Modifiers =====
 STATIC_MODIFIER_NAME_nd_mrl_tagalog_datu_court: "Cour Tagalog Datu"
 STATIC_MODIFIER_DESC_nd_mrl_tagalog_datu_court: "La cour de Tondo et Maynila est élevée à la dignité impériale. L'aristocratie maginoo administre l'archipel dans la tradition tagalog teintée de mahayana, et le mandat du rajah s'étend d'Aparri à Cotabato."
 STATIC_MODIFIER_NAME_nd_mrl_pan_filipino_federation: "Fédération pan-philippine"
 STATIC_MODIFIER_DESC_nd_mrl_pan_filipino_federation: "Tagalog, Visayan, Tausug, Maguindanao, Kapampangan, Iranun, Bicolano : treize peuples, un seul pacte constitutionnel. L’idéal maharlika les lie tous sans forcer l’un à s’incliner devant l’autre."
 STATIC_MODIFIER_NAME_nd_mrl_kris_and_bagani: "Épée de Maharlika"
 STATIC_MODIFIER_DESC_nd_mrl_kris_and_bagani: "Les bagani porteurs de kris de Mindanao et les maharlika de Tondo défilent sous la même bannière. L’empire s’est forgé dans les armes ; l'homme libre les porte, le datu les commande, et aucune flotte étrangère ne touchera ses rivages."
 STATIC_MODIFIER_NAME_nd_mrl_baybayin_chancellery: "Chancellerie de Baybayin"
 STATIC_MODIFIER_DESC_nd_mrl_baybayin_chancellery: "L’État s’écrit dans le syllabaire indigène. Edits, rôles d'impôts, archives judiciaires : le tout sur feuille de palmier et bambou, le tout en baybayin."
 STATIC_MODIFIER_NAME_nd_mrl_baybayin_vernacular: "Baybayin vernaculaire"
 STATIC_MODIFIER_DESC_nd_mrl_baybayin_vernacular: "L'alphabétisation en baybayin s'étend de la cour au village. Les enfants apprennent le syllabaire sur des lattes de bambou ; les femmes tiennent elles-mêmes les comptes du ménage."
 STATIC_MODIFIER_NAME_nd_mrl_anitist_continuity: "Continuité anitiste"
 STATIC_MODIFIER_DESC_nd_mrl_anitist_continuity: "Le babaylan garde sa place aux côtés du cadi et du bhikkhu. Les esprits ancestraux, les anito des îles, ne sont pas déplacés ; ils sont respectés de tous."
 STATIC_MODIFIER_NAME_nd_mrl_concord_of_faiths: "Concorde des croyances"
 STATIC_MODIFIER_DESC_nd_mrl_concord_of_faiths: "Trois traditions, un pacte : babaylan anitiste, bhikkhu bouddhiste, cadi musulman. Aucun ne remplace les autres ; l'empire est au-dessus d'eux tous."
 STATIC_MODIFIER_NAME_nd_mrl_archipelagic_admiralty: "Amirauté archipélagique"
 STATIC_MODIFIER_DESC_nd_mrl_archipelagic_admiralty: "Les navires de troupes Balangay, les éclaireurs Vinta Latin, les raiders Caracoa et les coques d'assaut Lanong coordonnés sous une seule amirauté. La mer de Sulu, la mer de Sibuyan et la mer de Visayan sont les eaux intérieures de l'empire."
 STATIC_MODIFIER_NAME_nd_mrl_freeman_estates: "Domaines Freeman"
 STATIC_MODIFIER_DESC_nd_mrl_freeman_estates: "Le code maharlika est codifié dans les lois du royaume. L'homme libre porte les armes, doit du service et est entendu dans l'assemblée de ses données. L’homme libre philippin est le fondement de l’empire."
 STATIC_MODIFIER_NAME_nd_mrl_warrior_aristocracy: "Aristocratie guerrière"
 STATIC_MODIFIER_DESC_nd_mrl_warrior_aristocracy: "Les maharlika sont formalisés comme le corps des officiers impériaux. Ils servent dans les régiments bagani, commandent les flottes caracoa et gouvernent les pueblos. L'honneur de la guerre les lie au trône."
 STATIC_MODIFIER_NAME_nd_mrl_galleon_killers: "Tueurs de galions"
 STATIC_MODIFIER_DESC_nd_mrl_galleon_killers: "Les escadrons de Lanong et de Caracoa chassent les galions espagnols dans le détroit de Visayan. Aucune flotte étrangère qui sillonne l’archipel n’en sort indemne."
 STATIC_MODIFIER_NAME_nd_mrl_archipelagic_fortress: "Forteresse archipélagique"
 STATIC_MODIFIER_DESC_nd_mrl_archipelagic_fortress: "Des forts en anneau dans chaque pueblo côtier. Les maladies tropicales, les tempêtes de mousson et les levées de guerriers attendent toute armée étrangère qui ose débarquer. L'archipel lui-même devient le mur."
 STATIC_MODIFIER_NAME_nd_mrl_silver_route: "Argent du Pacifique"
 STATIC_MODIFIER_DESC_nd_mrl_silver_route: "Le galion Manille-Acapulco n'est plus espagnol. Les charpentiers philippins de Cavite et les navigateurs philippins gèrent eux-mêmes la ligne d'argent ; La Nouvelle-Espagne paie à l’empire ce qui lui est dû."
 STATIC_MODIFIER_NAME_nd_mrl_council_of_datus: "Conseil des données"
 STATIC_MODIFIER_DESC_nd_mrl_council_of_datus: "Datus primordial, le sultan de Sulu, le rajah de Tondo : un organe constitutionnel qui tranche entre les grandes maisons. Le pacte maharlika a son parlement."
 STATIC_MODIFIER_NAME_nd_mrl_propagandist_circle: "Cercle propagandiste"
 STATIC_MODIFIER_DESC_nd_mrl_propagandist_circle: "Rizal, Plaridel, del Pilar, Lopez Jaena : des intellectuels soutenus par l'État codifient l'identité civique philippine. L’empire produit les livres qu’il importait autrefois."

 # ===== Formation Event =====
 nd_mrl.1.t: "Maharlika se lève"
 nd_mrl.1.d: "From Aparri to Maimbung, from Vigan to Zamboanga, the islands bow as one. The thirteen peoples answer to a single banner. The maharlika of Luzon, the timawa of the Visayas, the bagani of Mindanao: one warrior-noble class with three names, now one nation. No Spanish galleon will reach Cebu before us, no Bruneian sultanate will claim Manila as suzerain, no Dutch fleet will plant its flag on Tidore through us. The question that remains is what kind of empire Maharlika shall be.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mrl.1.a: "La cour du rajah tagalog à Tondo parle au nom de l'archipel"
 nd_mrl.1.b: "Une fédération de tous les peuples sous le pacte maharlika"
 nd_mrl.1.c: "Le kris et le bagani : un empire forgé dans les armes"

 # ===== Advance Events =====
 nd_mrl.2.t: "Baybayin devient la main de l'État"
 nd_mrl.2.d: "Trois écritures indigènes philippines ont survécu aux siècles : le baybayin des Tagalogs, la sourate Mangyan de Mindoro, le kulitan de Pampanga. La cour maharlika choisit d'élever le baybayin au statut de main impériale. Les édits voyagent désormais de Tondo à Maimbung dans des paquets de feuilles de palmier, écrits en caractères ronds et en boucle que les frères espagnols de notre monde considéraient comme des écritures diaboliques. Le tribunal se réunit pour débattre de la portée du scénario."
 nd_mrl.2.a: "Utilisez baybayin uniquement pour la chancellerie et le haut gouvernement"
 nd_mrl.2.b: "Diffusez le baybayin dans toutes les écoles paroissiales de l'archipel"

 nd_mrl.3.t: "La Concorde des Trois Foi"
 nd_mrl.3.d: "La prêtresse babaylan de Cebu, le bhikkhu bouddhiste de Butuan et le qadi Sulu sont assis à la même table impériale. Chacun représente une foi qui vit sur ces îles depuis des siècles : le substrat anitiste qui remonte aux voyages austronésiens, la trace hindou-bouddhiste des indianisés Srivijaya et Majapahit, l'islam sunnite rapporté de Brunei. Le tribunal maharlika doit décider s’il convient de considérer ces trois éléments comme tolérés par l’État ou de maintenir la tradition anitiste au premier rang parmi ses égaux."
 nd_mrl.3.a: "L'anitisme reste la première religion de l'empire"
 nd_mrl.3.b: "Les trois confessions sont égales selon la loi impériale"

 nd_mrl.4.t: "La flotte combinée navigue"
 nd_mrl.4.d: "From the harbour of Maynila, the great archipelagic fleet rows out for its first review. Tagalog balangay troopships rigged with abaca cordage, Mindanao vinta with their lateen sails, Visayan caracoa with two-hundred warriors at the oars, Iranun lanong fast-attack hulls bristling with brass lantaka. Four traditions, one navy.\n\nThe admiral debates doctrine with his captains. Some demand a unified four-tradition admiralty, every hull-type used in concert as a single combined fleet. Others demand specialization: the lanong fast-attack squadron as the empire's vanguard, hunting colonial galleons before they ever reach Cebu."
 nd_mrl.4.a: "Une amirauté unifiée composée de quatre traditions : une flotte combinée"
 nd_mrl.4.b: "Une avant-garde lanong : attaque rapide spécialisée contre les galions"

 nd_mrl.5.t: "Le Code Maharlika est devenu loi"
 nd_mrl.5.d: "Trois traditions guerrières philippines : le tagalog maharlika, le Visayan timawa, le Mindanao bagani. Trois noms, un idéal : l'homme libre qui porte les armes, jure de servir son datu et se tient aux côtés de son seigneur dans l'assemblée. La chancellerie impériale codifie désormais la classe noble et guerrière comme l’épine dorsale de l’État. La question est de savoir si les maharlika sont une large classe de citoyens composés d’hommes libres armés ou une aristocratie d’officiers restreinte composée de serviteurs impériaux."
 nd_mrl.5.a: "Une large classe d'hommes libres : chaque citoyen armé est maharlika"
 nd_mrl.5.b: "Une aristocratie d'officiers étroite et liée au trône"

 nd_mrl.6.t: "Aucun galion n’atteint Cebu"
 nd_mrl.6.d: "Une flotte étrangère entre dans l'archipel. Ils s'attendent à trouver des rajahnates et des datus payant un tribut à jouer les uns contre les autres. Ils trouvent à la place un empire unifié avec une flotte unifiée. Le conseil maharlika se réunit pour décider de la doctrine : les chassons-nous en mer avec les escadrons de Lanong, ou les laissons-nous débarquer et réduire en poussière contre les pueblos fortifiés et les levées de guerriers de l'intérieur ?"
 nd_mrl.6.a: "Chassez-les en mer - aucun galion n'atteint nos côtes"
 nd_mrl.6.b: "Laissez-les atterrir : les îles elles-mêmes sont notre mur"

 nd_mrl.7.t: "Le galion de Manille devient philippin"
 nd_mrl.7.d: "For two and a half centuries in our world, the Manila-Acapulco galleon line carried New World silver to Asia and Asian silk to New Spain. Spanish-built, Spanish-crewed, Spanish-profited. In the Maharlika timeline, the great trans-Pacific traders are built at Cavite by Filipino shipwrights and navigated by Filipino pilots.\n\nThe imperial diwan must decide who shall ride the silver line. Some demand an imperial monopoly: the throne owns every hull, prices every cargo, and pays the silver into a single treasury. Others demand a free-trade compact: any merchant under imperial license may sail, and the trade itself draws Cantonese, Tagalog and Mexican capital into Manila."
 nd_mrl.7.a: "Gérez la ligne des galions en tant que monopole de l'empire"
 nd_mrl.7.b: "Ouvrir la ligne à tous les commerçants sous licence impériale"

 nd_mrl.8.t: "Le Conseil Archipélagique se réunit"
 nd_mrl.8.d: "The paramount datus of every region, the Sultan of Sulu, the Rajah of Maynila, the Lakan of Tondo, the chiefs of the Cordillera highland peoples: all gather at the imperial council hall.\n\nThe deeper question of seating is now to settle. Shall the council be a chamber of paramount datus alone, with each great house holding one voice and the freemen represented through their lord? Or shall it be a unified parliament with seats also for elected freemen delegates from every region, the timawa and maharlika sitting beside the rajahs?"
 nd_mrl.8.a: "Un conseil aux données primordiales : seules les grandes maisons siègent"
 nd_mrl.8.b: "Un parlement unifié - des sièges pour les délégués libres à côté du datus"

 nd_mrl.9.t: "Les Lumières philippines"
 nd_mrl.9.d: "In our world, the Propaganda Movement of the 1880s, with Rizal, Marcelo del Pilar, Graciano Lopez Jaena, was a movement of expatriates writing for La Solidaridad in Spain, smuggling their work back to a colonized homeland. Under Maharlika, the propagandists work from Manila itself, with state patronage and unhindered presses.\n\nThe imperial chancellery must decide what enlightenment shall be. Patronize the ilustrado circle: a court-tied intelligentsia writing in Spanish for the educated peer of Madrid and Paris. Or patronize the vernacular: pamphlets and chronicles in baybayin, Tagalog and Cebuano for the people, the village priest, the barangay schoolmaster. The empire's voice will be one or the other."
 nd_mrl.9.a: "Patronner le cercle ilustrado : intelligentsia de la cour en espagnol"
 nd_mrl.9.b: "Patroniser la langue vernaculaire - brochures en baybayin et dans les langues régionales"

 # ===== Advances =====
 nd_mrl_maharlika_code: "Code Maharlika"
 nd_mrl_maharlika_code_desc: "La classe des guerriers-nobles libres de chaque peuple philippin : les maginoo de Tondo, les timawa de Cebu, les bagani de Mindanao. Un idéal, trois noms. L’État les codifie comme son épine dorsale civique et militaire."
 nd_mrl_datu_federation: "Fédération Datu"
 nd_mrl_datu_federation_desc: "Chefferies superposées sous un rajah suprême : le mode politique indigène philippin. Tondo, Maynila, Pangasinan, Cebu, Butuan et Maimbung en tant que seigneurs semi-autonomes et mutuellement loyaux."
 nd_mrl_balangay_craft: "Artisanat Balangay"
 nd_mrl_balangay_craft_desc: "Le navire à balancier en planches qui reliait Luçon, les Visayas et Mindanao pendant quinze siècles avant Magellan. Le balangay fouillé à Butuan date du XIe siècle."
 nd_mrl_anitist_syncretism: "Syncrétisme anitiste"
 nd_mrl_anitist_syncretism_desc: "Le substrat animiste indigène qui a absorbé et adouci chaque vague d’influence hindoue-bouddhiste et islamique sans jamais être effacé. Le babaylan garde sa place au foyer du village."
 nd_mrl_pearl_and_gold: "Économie de la perle et de l’or"
 nd_mrl_pearl_and_gold_desc: "Or de Surigao, perles de Sulu, orfèvres de Butuan produisant le kinnari et le tara doré. La richesse philippine qui existait ici bien avant l’arrivée des galions espagnols est venue la réorienter."
 nd_mrl_baybayin_literacy: "Alphabétisation Baybayin"
 nd_mrl_baybayin_literacy_desc: "Le syllabaire philippin, utilisé pour la correspondance civique et personnelle de Luzon aux Visayas. Le premier livre tagalog imprimé en 1593 utilisait le baybayin ; sous Maharlika, c’est la main de l’État."
 nd_mrl_timawa_freemen: "Hommes libres de Timawa"
 nd_mrl_timawa_freemen_desc: "Les guerriers hommes libres Visayan qui combattaient en tant qu'égaux à leurs données. Un antécédent de l’idéal moderne du citoyen-soldat, deux siècles avant que l’Europe ne redécouvre ce concept."
 nd_mrl_caracoa_fleet: "Flotte de raid de Caracoa"
 nd_mrl_caracoa_fleet_desc: "Le grand canoë de guerre Visayan, capable de transporter deux cents guerriers par coque. La terreur de la guerre entre les îles ; dans notre monde, utilisé pour attaquer les encomiendas espagnoles aussi loin au nord que Camarines."
 nd_mrl_manila_trade: "Réseau commercial de Manille"
 nd_mrl_manila_trade_desc: "Tondo et Maynila en tant que nœuds du réseau commercial Brunei-Chine-Ryukyu. Les trésors de porcelaine de Mindoro et les caches de pièces de monnaie chinoises de Kalatagan en sont la preuve archéologique."
 nd_mrl_datu_council: "Art politique du Conseil de Datu"
 nd_mrl_datu_council_desc: "Assemblées formalisées de statut primordial en tant qu’organes délibérants. Le germe de l’empire constitutionnel à venir."
 nd_mrl_three_faith_concord: "Concorde des Trois Foi"
 nd_mrl_three_faith_concord_desc: "Anitisme, bouddhisme syncrétique et islam sunnite coexistent sous la loi impériale. Babaylan, bhikkhu, qadi : chacun reconnu, aucun n'est privilégié au-dessus de l'empire lui-même."
 nd_mrl_combined_fleet_doctrine: "Doctrine de flotte combinée"
 nd_mrl_combined_fleet_doctrine_desc: "Des vaisseaux de troupes Balangay, des éclaireurs Vinta Latin, des raiders lourds Caracoa et des coques d'attaque rapide Lanong coordonnés en une seule marine archipélagique. Chaque tradition de construction navale des îles alimente une flotte."
 nd_mrl_bagani_code: "Code du guerrier Bagani"
 nd_mrl_bagani_code_desc: "La caste des guerriers de Mindanao qui a fait ses preuves lors du raid des pangayaw : un jeune homme n'obtient son titre de bagani que par le fait d'armes. Leur code devient la doctrine militaire d’élite de l’empire."
 nd_mrl_datu_congress: "Congrès de Datu"
 nd_mrl_datu_congress_desc: "Rassemblements périodiques de tous les dirigeants suprêmes, formalisés en un organe constitutionnel qui tranche les différends inter-datu et lie les grandes maisons."
 nd_mrl_surigao_goldsmithing: "Orfèvrerie Surigao"
 nd_mrl_surigao_goldsmithing_desc: "La redécouverte de la tradition du moulage à la cire perdue qui a donné naissance à l'image d'Agusan et à la tara dorée de Butuan. Une ferronnerie sacrée philippine datant du Xe siècle."
 nd_mrl_expulsion_doctrine: "Doctrine d'expulsion"
 nd_mrl_expulsion_doctrine_desc: "La doctrine de politique étrangère de Maharlika : chaque flotte européenne qui débarque se heurte aux armes combinées de tous les peuples de l'archipel. Pas de Cebu, pas de Manille, pas de chute de Sulu."
 nd_mrl_military_academy: "Académie militaire Maharlika"
 nd_mrl_military_academy_desc: "L’institution formelle qui transforme l’idéal de l’homme libre en un corps d’officiers qualifiés issus des trois régions. Maginoo, Timawa et Bagani dans le même chantier de forage."
 nd_mrl_archipelago_marketplace: "Marché pan-archipel"
 nd_mrl_archipelago_marketplace_desc: "Tondo, Cebu, Butuan et Maimbung en tant que nœuds commerciaux intégrés, avec des poids et mesures soutenus par l'État. L'empire devient un seul marché."
 nd_mrl_confluence_courts: "Tribunaux de Confluence"
 nd_mrl_confluence_courts_desc: "Organe judiciaire intégrant le code tagalog, la charia Sulu et le droit coutumier Visayan dans un cadre juridique unifié. Là où convergent les trois traditions juridiques, c’est le droit impérial qui décide."
 nd_mrl_cordillera_to_sulu: "De la Cordillère à Sulu"
 nd_mrl_cordillera_to_sulu_desc: "L'Igorot des hautes terres, le Tagalog des basses terres et le Tausug marin sont liés par une seule identité civique. Le maharlika compact s’étend des peuples des montagnes de la Cordillère aux pêcheurs de perles de Sulu."
 nd_mrl_manila_galleon: "Galion philippin de Manille"
 nd_mrl_manila_galleon_desc: "La capture historique de la route de l'argent Acapulco-Manille. Les marins philippins remplacent la Couronne espagnole en tant que courtiers en argent de la Nouvelle-Espagne, et le commerce transpacifique devient un monopole impérial."
 nd_mrl_archipelagic_council: "Conseil Archipélagique"
 nd_mrl_archipelagic_council_desc: "Un empire constitutionnel : le datus suprême, le sultan de Sulu, le rajah de Tondo, tous liés par le pacte du maharlika. Chaque peuple a un siège ; chaque siège est lié au trône."
 nd_mrl_abaca_indigo_export: "Exportations d’Abaca et d’Indigo"
 nd_mrl_abaca_indigo_export_desc: "Chanvre de Manille pour les cordages mondiaux, indigo Visayan pour les marchés internationaux des teintures. Les cultures industrielles de rente de l’empire, toutes sous le monopole des Maharlika."
 nd_mrl_fortified_pueblos: "Pueblos fortifiés"
 nd_mrl_fortified_pueblos_desc: "L'anneau de villes archipélagiques aux murs de pierre, prêtes à repousser toute incursion étrangère, de Vigan au nord à Zamboanga au sud. La réponse philippine au presidio espagnol."
 nd_mrl_unified_service: "Service d'armes unifié"
 nd_mrl_unified_service_desc: "La fusion formelle des hommes libres de Timawa, de Mindanao bagani et du Tagalog maharlika en une seule armée impériale, payée par un seul trésor, forée selon un seul standard."
 nd_mrl_filipino_enlightenment: "Lumières philippines"
 nd_mrl_filipino_enlightenment_desc: "Le mouvement de propagande de l’histoire alternative s’est réalisé comme une floraison intellectuelle soutenue par l’État. Rizal, Marcelo del Pilar et Graciano Lopez Jaena écrivent depuis Manille avec le patronage impérial au lieu de Madrid en exil."
 nd_mrl_katipunan_spirit: "Esprit civique de Katipunan"
 nd_mrl_katipunan_spirit_desc: "La confrérie de Bonifacio réalisée comme idéologie d'État. Tous les citoyens, toutes les confessions, toutes les îles, égaux sous le pacte maharlika, liés par des obligations mutuelles."
 nd_mrl_industrial_manila_bay: "Baie industrielle de Manille"
 nd_mrl_industrial_manila_bay_desc: "Stations charbonnières, chantiers navals modernes, usines de locomotives à Tondo et San Fernando : l'archipel devient l'axe industriel d'Asie du Sud-Est que les Philippines historiques n'ont jamais réussi à être."
 nd_mrl_pacific_naval_doctrine: "Doctrine navale du Pacifique"
 nd_mrl_pacific_naval_doctrine_desc: "La flotte philippine moderne s'étendant de Cebu à Guam : la puissance indigène du Pacifique que le Traité de Paris n'a jamais permis d'exister."
 nd_mrl_bayanihan_compact: "Compact de Bayanihan"
 nd_mrl_bayanihan_compact_desc: "Travail communal et entraide comme principe organisateur de l’État. La réponse civique philippine à l’État-nation européen : le bayanihan est le contrat social de l’empire."

 # ===== Variable tooltips =====
 nd_mrl_formed_tt: "Maharlika a été formée."
 nd_mrl_path_a_tt: "Le chemin Tagalog Datu Court a été choisi lors de la formation."
 nd_mrl_path_b_tt: "La voie de la Fédération pan-philippin a été choisie lors de la formation."
 nd_mrl_path_c_tt: "La voie de l’Épée de Maharlika a été choisie lors de la formation."
 nd_mrl_dest_tondo_developed_tt: "Tondo is ours and its development is at least #bold 21#!"
 nd_mrl_dest_singhapala_developed_tt: "Singhapala is ours and its development is at least #bold 12#!"
 nd_mrl_dest_luzon_share_tt: "At least #bold 75%#! of the locations of Luzon are ours"
 nd_mrl_dest_visayas_share_tt: "At least #bold 75%#! of the locations of the Visayas are ours"
 nd_mrl_dest_mindanao_share_tt: "At least #bold 75%#! of the locations of Mindanao are ours"

 # ===== Units =====
 a_nd_mrl_maharlika_levy: "Guerriers Maharlika"
 a_nd_mrl_maharlika_levy_desc: "La classe des guerriers-nobles libres tagalog, élevée comme un privilège de classe plutôt que comme un régiment rémunéré. Porte les armes à côté des données en conseil et en guerre."
 a_nd_mrl_timawa_levy: "Hommes libres de Timawa"
 a_nd_mrl_timawa_levy_desc: "Hommes libres visayans avec la lance bangkaw et le bouclier budiak. Infanterie légère mobile dont la liberté est liée à sa volonté de se battre."
 a_nd_mrl_bagani: "Bagani"
 a_nd_mrl_bagani_desc: "Élite guerrière de Mindanao, troupes de choc portant des kris qui ont gagné leur titre grâce au raid pangayaw. La branche d'élite de l'empire."
 a_nd_mrl_bagani_levy: "Prélèvement Bagani"
 a_nd_mrl_bagani_levy_desc: "La caste des guerriers bagani élevée grâce au système de prélèvement, recrutée parmi la classe de soldats de chaque pueblo de Mindanao."
 n_nd_mrl_balangay: "Balangay"
 n_nd_mrl_balangay_desc: "Le navire à balancier en planches qui a lié l'archipel philippin pendant quinze siècles. Rapide, à faible tirant d'eau et capable de traverser l'océan entre les îles."
 n_nd_mrl_balangay_levy: "Prélèvement Balangay"
 n_nd_mrl_balangay_levy_desc: "Le balangay communautaire, élevé par chaque pueblo côtier dans le cadre de son obligation impériale."
 n_nd_mrl_caracoa: "Caracoa"
 n_nd_mrl_caracoa_desc: "La grande pirogue de guerre Visayan, à double balancier, à gréement latin, capable de transporter deux cents guerriers par coque. La terreur de la guerre entre les îles."
 n_nd_mrl_caracoa_levy: "Prélèvement Caracoa"
 n_nd_mrl_caracoa_levy_desc: "Le caracoa communautaire, élevé par la classe bourgeoise des pueblos côtiers Visayan avec des équipages de paysans et d'ouvriers."
 n_nd_mrl_lanong: "Lanong"
 n_nd_mrl_lanong_desc: "La coque de raid Iranun-Tausug, rapide, à gréement latin, avec lantaka en laiton monté. Le bras léger d'attaque rapide de la flotte archipélagique combinée."
 n_nd_mrl_filipino_galleon: "Galion philippin"
 n_nd_mrl_filipino_galleon_desc: "The alt-history Manila galleon: built at Cavite by Filipino shipwrights, navigated by Filipino pilots, its hardwood hull thick enough to turn shot, carrying the empire's silver across the Pacific."

 # ===== Buildings =====
 nd_mrl_panday_workshop: "Atelier Panday"
 nd_mrl_panday_workshop_desc: "La tradition indigène des orfèvres et des métallurgistes. Producteurs du Surigao kinnari, du Butuan tara, du kris du sud et du lantaka en bronze de la flotte."
 nd_mrl_panday_goldsmithing: "Orfèvrerie Panday"
 nd_mrl_panday_goldsmithing_desc: "De l'or et des perles travaillés par moulage à la cire perdue dans des pendentifs kinnari, des icônes tara dorées et des raccords kris. Bijoux philippins pour la cour et le sacré."
 nd_mrl_baybayin_archive: "Archives Baybayin"
 nd_mrl_baybayin_archive_desc: "Dépôt de manuscrits sur feuilles de palmier dans le syllabaire indigène philippin. La chancellerie civique d'un empire qui s'écrit en baybayin."
 nd_mrl_baybayin_archive_maintenance: "Scriptorium Baybayin"
 nd_mrl_baybayin_archive_maintenance_desc: "Les scribes copient les édits, les archives judiciaires et les textes liturgiques sur des feuilles de palmier et des bambous, dans l'écriture ronde et en boucle des îles."
 nd_mrl_pantalan: "Pantalán"
 nd_mrl_pantalan_desc: "Le grand complexe portuaire tagalog, où les jonques de Brunei, les commerçants de Ryukyu et les porteurs de soie chinois se rencontraient au marché de l'embouchure du Pasig de Tondo."
 nd_mrl_pantalan_brokerage: "Courtage Pantalán"
 nd_mrl_pantalan_brokerage_desc: "Marchands côtiers faisant le négoce de poteries, de perles et de cordes d'abaca entre les commerçants de l'archipel et les commerçants étrangers."
 nd_mrl_ginto_foundry: "Fonderie Ginto"
 nd_mrl_ginto_foundry_desc: "L'installation de moulage à la cire perdue produit les grandes images en or : l'image Agusan, le tara Surigao, le kinnari Butuan. Une ferronnerie sacrée philippine à l'échelle impériale."
 nd_mrl_ginto_casting: "Casting de Ginto"
 nd_mrl_ginto_casting_desc: "Fonte d'or à la cire perdue à l'échelle impériale : l'Image Agusan, le Surigao tara, le Butuan kinnari. Produit des bijoux de la plus haute tradition sacrée philippine."
 nd_mrl_maharlika_academy: "Académie militaire Maharlika"
 nd_mrl_maharlika_academy_desc: "L'institution formelle transformant l'idéal de l'homme libre en un corps d'officiers qualifiés. Maginoo, Timawa et Bagani dans le même chantier de forage, sous un seul étendard impérial."
 nd_mrl_academy_drill: "Exercice de l'Académie"
 nd_mrl_academy_drill_desc: "L'exercice combiné des trois traditions guerrières philippines, enseigné à partir de manuels impériaux."
 nd_mrl_palengke_aguinaldo: "Palengke Aguinaldo"
 nd_mrl_palengke_aguinaldo_desc: "Le grand marché pan-archipélagique, avec des poids et mesures standardisés à Tondo, Cebu, Butuan et Maimbung. L'empire devient un seul marché."
 nd_mrl_palengke_brokerage: "Courtage Palengke"
 nd_mrl_palengke_brokerage_desc: "Courtiers du marché impérial en riz, fibre d'abaca et perles de Sulu, sous poids et mesures standardisés."
 nd_mrl_pueblo_kuta: "Village de Kuta"
 nd_mrl_pueblo_kuta_desc: "Le pueblo fortifié : un anneau de villes archipélagiques aux murs de pierre. La réponse domestique philippine au presidio espagnol, construit par des Philippins sur le sol philippin."
 nd_mrl_pueblo_garrison: "Garnison de Pueblo"
 nd_mrl_pueblo_garrison_desc: "Exercice de garnison du pueblo fortifié : hommes libres timawa et officiers maharlika prêts à repousser tout débarquement étranger."

 nd_mrl_babaylan_hall: "Salle Babaylan"
 nd_mrl_babaylan_hall_desc: "La salle reconnue par l'État pour les babaylan et les katalonan : prêtresses médiums spirituels de la tradition indigène philippine. La maison de l'anitisme dans l'empire."
 nd_mrl_babaylan_rites: "Rites Babaylan"
 nd_mrl_babaylan_rites_desc: "Offrandes cérémonielles, fumée et prières tissées dans la tradition spirituelle indigène philippine."
 # ===== Levies =====
 levy_nd_mrl_maharlika_warriors: "Prélèvement du guerrier Maharlika"
 levy_nd_mrl_maharlika_warriors_desc: "La classe noble des guerriers tagalog est élevée comme une obligation de prélèvement. Soldats et paysans de la tradition maharlika répondent à l'appel de leur datu."
 levy_nd_mrl_timawa_freemen: "Timawa Freeman Levy"
 levy_nd_mrl_timawa_freemen_desc: "Le prélèvement citoyen-soldat Visayan. Tout homme libre, soldat ou paysan, est tenu par serment de se rassembler à l'appel de ses données."
 levy_nd_mrl_bagani: "Prélèvement Bagani"
 levy_nd_mrl_bagani_levy_desc: "Le prélèvement sur la caste des guerriers de Mindanao. Tirés exclusivement de la classe des soldats, seuls ceux qui ont fait leurs preuves lors du raid pangayaw sont éligibles."
 levy_nd_mrl_caracoa: "Prélèvement Caracoa"
 levy_nd_mrl_caracoa_desc: "La taxe Visayan sur les canots de guerre. Les communautés bourgeoises côtières élèvent les coques de caracoa ; les paysans et les ouvriers du village servent de rameurs-guerriers."

 # ===== Destiny Advances =====
 nd_mrl_destiny: "Le Pacte Maharlika"
 nd_mrl_destiny_desc: "L’empire tient debout. D’Aparri à Maimbung, le pacte maharlika tient. Le trône décide maintenant quel genre d’empire il deviendra ; le choix fait lors de la formation s'épanouit désormais en un destin national. Une stabilité supérieure à 75 maintient le compact en vie."
 nd_mrl_dest_compact_endures: "Le Compact perdure"
 nd_mrl_dest_compact_endures_desc: "Institutionalize the Pan-Filipino Federation. Embrace Legalism, hold Tondo and raise its development to 21, and prove that thirteen peoples can govern themselves under a single legal compact."
 nd_mrl_dest_concord_codex: "Codex des Trois Foi"
 nd_mrl_dest_concord_codex_desc: "Codify the concord of babaylan, qadi, and bhikkhu under banking-era institutions. Embrace Banking, hold Singhapala and raise its development to 12, keep 2000 gold, and ensure pearls trade in our markets. The empire becomes a maritime cosmopolis."
 nd_mrl_dest_bayanihan_empire: "Empire Bayanihan"
 nd_mrl_dest_bayanihan_empire_desc: "The constitutional archipelago at its apex. Embrace the Printing Press, hold three quarters of Luzon, of the Visayas and of Mindanao, keep 3000 gold, hold stability at 75. The Bahay-Balangay council convenes; the empire becomes the southeast Asian civic standard. Unlocks the Bahay-Balangay capital council."
 nd_mrl_dest_kris_unsheathed: "Kris dégainé"
 nd_mrl_dest_kris_unsheathed_desc: "Take the war beyond the islands. Hold Berune (Brunei), Sandakan and Kudat (north Borneo). The maharlika sword crosses the sea."
 nd_mrl_dest_lanong_ascendancy: "Ascendance Lanong"
 nd_mrl_dest_lanong_ascendancy_desc: "Master the Sulu Sea and seize the Spice Arc. Hold Ternate, Tidore, and Manado; adopt the $nd_mrl_combined_fleet_doctrine$ and reach 50 prestige. No European fleet enters the inner waters of the empire."
 nd_mrl_dest_kalayaan_pacific: "Kalayaan dans le Pacifique"
 nd_mrl_dest_kalayaan_pacific_desc: "Project from the Sakishima to the Spice Islands. Hold Ketagalan on the Tamsui, Miyakojima, Jailolo, and Guahan in the Marianas; keep 3000 gold and stability above 75. The Filipino fleet becomes a Pacific power. Unlocks the Kuta Admiralty."

 # ===== Destiny Events =====
 nd_mrl.10.t: "Le pacte tient"
 nd_mrl.10.d: "La nouvelle parvient à chaque salle de données et à chaque pueblo de village : l’empire existe. La mère tagalog à Tondo, la pêcheuse de perles Tausug à Maimbung, le constructeur de rizières en terrasse Ifugao à Banaue : chacun entend la même proclamation impériale. De là, le chemin choisi lors de la formation s’épanouira en un destin national écrit à travers les siècles."
 nd_mrl.10.a: "En avant donc, sous la bannière du Maharlika."

 nd_mrl.11.t: "La Fédération rendue permanente"
 nd_mrl.11.d: "The Pan-Filipino Federation is no longer a bargain at formation: it is the framework of the realm.\n\nThe imperial chancellery now debates how to anchor it. Codify the compact in baybayin imperial law, with edicts read aloud at every council and every market: the federation made statute. Or anchor it in cultural identity, a federation of shared festivals, shared songs, shared ancestors invoked at every lakaran, the federation made tradition."
 nd_mrl.11.a: "Codifier le pacte dans la loi impériale baybayin"
 nd_mrl.11.b: "Ancrer le pacte dans une culture et une ascendance partagées"

 nd_mrl.12.t: "Le Codex des Trois Foi"
 nd_mrl.12.d: "Le babaylan, le qadi et le bhikkhu se réunissent dans une seule chambre et produisent un codex de concorde relié en feuille de palmier et en argent. Les banques de l’empire prêtent désormais au-delà des frontières confessionnelles. Le tribunal doit choisir comment publier : comme instrument de chancellerie, ou comme texte vernaculaire dans chaque village."
 nd_mrl.12.a: "Un codex de chancellerie, scellé par trois clercs religieux."
 nd_mrl.12.b: "Un codex vernaculaire, lu à haute voix dans chaque pueblo."

 nd_mrl.13.t: "L'Empire Bayanihan se réunit"
 nd_mrl.13.d: "La salle du conseil de Bahay-Balangay est érigée dans la capitale, bordée comme le grand navire de voyage qui a donné à l'empire sa première métaphore. Chaque peuple, chaque religion, chaque date, chaque bourgeois et délégué du clergé, est assis sous un même toit. Le Maharlika Compact est la norme civique d’Asie du Sud-Est. La cour choisit son caractère : une concorde constitutionnelle des grandes maisons, ou un État publiciste parlant au monde ?"
 nd_mrl.13.a: "Une concorde archipélagique des maisons."
 nd_mrl.13.b: "Un État solidaire, publiant pour le monde."

 nd_mrl.14.t: "Le Kris traverse la mer"
 nd_mrl.14.d: "The bagani of Cotabato and the Iranun of Lanao take the imperial banner across the Sulu Sea. Berune falls; Sandakan answers. The first foreign coasts kneel to the maharlika compact. The doctrine is proven: the empire's sword reaches across the water.\n\nThe imperial diwan must decide what comes next. Press the offensive across Sulawesi to the Moluccas, where Spanish, Dutch and Tidoran ships dispute the spice. Or hold the bagani as the empire's home guard, secure the archipelago first, and let the conquest of foreign coasts come later."
 nd_mrl.14.a: "Poursuivre l’offensive : en avant vers Sulawesi et les Moluques"
 nd_mrl.14.b: "Tenez le bagani comme garde à domicile - sécurisez d'abord l'archipel"

 nd_mrl.15.t: "L'ascendant Lanong"
 nd_mrl.15.d: "Ternate et Tidore, les légendaires îles aux clous de girofle, tombent sous la bannière de l'empire. Manado, à la pointe de Sulawesi, est prise. La mer de Sulu, la mer de Banda, les Célèbes : toutes sont des eaux intérieures. L'amirauté doit choisir : une doctrine sur l'honneur des raids pangayaw inscrite dans les régiments lourds, ou une doctrine d'escadrons de lantaka en laiton projetés depuis chaque kuta côtier ?"
 nd_mrl.15.a: "La doctrine pangayaw : l'honneur du raid comme idéal d'État."
 nd_mrl.15.b: "Les escadrons de Lantaka : des canons en laiton sur toutes les côtes."

 nd_mrl.16.t: "Kalayaan de Sakishima à Jailolo"
 nd_mrl.16.d: "Tamsui à Taiwan, Miyakojima dans la chaîne de Sakishima, Jailolo sur Halmahera : l'étendard de l'empire flotte désormais sur le Pacifique. L’épée maharlika va plus loin que n’importe quel régime politique indigène dans l’histoire de ces mers. La cour choisit sa doctrine finale : une guerre des îles, dans laquelle chaque flotte européenne est chassée jusqu'à l'extinction ; ou une amirauté Kalayaan, projetant la puissance philippine comme la norme du Pacifique."
 nd_mrl.16.a: "Une guerre des îles : aucune coque étrangère ne reste intacte."
 nd_mrl.16.b: "Amirauté Kalayaan, le Pacifique nous appartient de droit."

 # ===== Destiny Timed Modifiers =====
 STATIC_MODIFIER_NAME_nd_mrl_dest_three_chanceries: "Trois chancelleries"
 STATIC_MODIFIER_DESC_nd_mrl_dest_three_chanceries: "Les archives Babaylan, le bureau de la charia de Sulu et la chancellerie de la cour de Tondo fonctionnent comme trois organes égaux de l'État impérial. Les édits font référence aux trois ; des ambassades étrangères sont envoyées aux trois."
 STATIC_MODIFIER_NAME_nd_mrl_dest_baybayin_universal: "Baybayin universel"
 STATIC_MODIFIER_DESC_nd_mrl_dest_baybayin_universal: "Chaque école paroissiale enseigne le baybayin parallèlement à l'écriture locale. Les bourgeois tiennent des registres en rond, en boucle, d'Aparri à Maimbung ; l'assiette de l'impôt direct de la Couronne diminue à mesure que les comptables successoraux acquièrent une main privée."
 STATIC_MODIFIER_NAME_nd_mrl_dest_archipelagic_concord: "Concorde archipélagique"
 STATIC_MODIFIER_DESC_nd_mrl_dest_archipelagic_concord: "Le Datus suprême, le sultan de Sulu, le rajah de Tondo et les représentants élus de la bourgeoisie siègent au conseil de Bahay-Balangay. Chaque peuple a une voix constitutionnelle ; l'empire se construit à l'échelle impériale."
 STATIC_MODIFIER_NAME_nd_mrl_dest_solidaridad_state: "État Solidarité"
 STATIC_MODIFIER_DESC_nd_mrl_dest_solidaridad_state: "L'empire publie pour le monde entier : La Solidaridad à Manille, les Lumières philippines comme exportation impériale. L’empire mène ses guerres par écrit ; l’annexion étrangère devient de plus en plus coûteuse à mesure que les alliés impériaux se multiplient."
 STATIC_MODIFIER_NAME_nd_mrl_dest_pangayaw_doctrine: "Doctrine Pangayaw"
 STATIC_MODIFIER_DESC_nd_mrl_dest_pangayaw_doctrine: "La tradition des raids de Mindanao a été codifiée dans la doctrine impériale lourde. Les officiers Bagani obtiennent leur commandement par des faits d'armes ; les bureaucrates sont recrutés par démonstration martiale. La cour perd en finesse culturelle à mesure qu’elle aiguise son épée."
 STATIC_MODIFIER_NAME_nd_mrl_dest_lantaka_squadrons: "Escadrons de Lantaka"
 STATIC_MODIFIER_DESC_nd_mrl_dest_lantaka_squadrons: "Canon Lantaka en laiton à chaque kuta et à bord de chaque lanong, coulé dans les fonderies de l'archipel à partir de cuivre de Sulu. Les routes commerciales sont protégées ; la ligne portuaire de l'empire est constituée de dents."
 STATIC_MODIFIER_NAME_nd_mrl_dest_war_of_the_isles: "Guerre des îles"
 STATIC_MODIFIER_DESC_nd_mrl_dest_war_of_the_isles: "Chaque côte est une garnison ; chaque garnison est une base de flotte. L'empire verse ses trésors dans les navires et les marins ; les domaines nobles ressentent la tension d'une mobilisation perpétuelle."
 STATIC_MODIFIER_NAME_nd_mrl_dest_kalayaan_admiralty: "Amirauté de Kalayaan"
 STATIC_MODIFIER_DESC_nd_mrl_dest_kalayaan_admiralty: "Le réseau d'amirauté Cebu-Cavite-Sulu s'étend du Sakishima à Jailolo. La doctrine défensive rendue impériale ; la logistique et la capacité alimentaire rendent les flottes philippines durables dans le Pacifique."

 # ===== Destiny Buildings =====
 nd_mrl_dest_bahay_balangay: "Bahay-Balangay"
 nd_mrl_dest_bahay_balangay_desc: "La salle du conseil constitutionnel de l'empire Bayanihan, bordée comme le grand navire de voyage qui a donné à l'empire sa première métaphore. Tous les peuples, toutes les confessions, toutes les données, tous les bourgeois et les délégués du clergé sont assis sous un même toit."
 nd_mrl_dest_balangay_council: "Conseil de Balangay"
 nd_mrl_dest_balangay_council_desc: "Le conseil constitutionnel en session, avec des édits copiés en baybayin, espagnol et jawi pour distribution dans chaque salle de datu."
 nd_mrl_dest_kuta_admiralty: "Amirauté de Kuta"
 nd_mrl_dest_kuta_admiralty_desc: "Le quartier général fortifié de la marine du Pacifique, un kuta aux murs de pierre couronné de lantaka et de lanong en laiton. La réponse philippine à une amirauté coloniale : construite à Cavite, s'étendant de Cebu à Guam."
 nd_mrl_dest_admiralty_drill: "Exercice de l'Amirauté"
 nd_mrl_dest_admiralty_drill_desc: "Exercices combinés de la flotte, exercices de tir au canon Lanong et doctrine navale codifiée du Pacifique enseignée dans les manuels impériaux."

 # ===== BUREAUCRACIES =====
 mrl_datu_court_bureaucracy: "Cour Datu du Maharlika"
 mrl_datu_court_bureaucracy_desc: "Codification du code noble guerrier tagalog et visayan qui distinguait maginoo, maharlika et timawa du point commun alipin. Documenté par Plasencia et Loarca dans les années 1580, le maharlika portait des armes pour ses données en échange d'une exonération fiscale sur les terres héritées. En tant qu'institution impériale, la Cour du Maharlika ratifie les fiefs dans les treize cultures philippines et standardise le culte guerrier bagani-bayani en une seule noblesse de service héréditaire."
 mrl_ruma_bichara_bureaucracy: "Ruma Bichara"
 mrl_ruma_bichara_bureaucracy_desc: "Le conseil délibérant de quinze datus qui gouvernait historiquement le sultanat de Sulu aux côtés de son sultan, avec en parallèle Bichara Atas à Maguindanao. Composé du Raja Muda, de l'amiral Ladja Laut, du trésorier Bandahala et d'autres portefeuilles de données, le conseil élisait les héritiers présomptifs et délimitait le royaume par consensus. Adoptée comme chambre haute du Maharlika, la Ruma Bichara contrôle l'ambition de la couronne avec la voix fédérée des datus."
 mrl_three_faith_concord_bureaucracy: "Concorde des Trois Foi"
 mrl_three_faith_concord_bureaucracy_desc: "La colonie Pagsasanib : les prêtresses anitistes babaylan de Luzon et des Visayas, les panditas musulmanes des sultanats de Sulu et de Maguindanao et les bhikkhu bouddhistes hérités des régimes politiques de Butuan et de Tondo détiennent tous simultanément le rang officiel de la cour. Aucun royaume philippin précolonial n'avait encore codifié cette matrice, mais l'accommodement syncrétique était une pratique vécue du XIIIe au XVIe siècle avant que la christianisation coloniale ne la ferme. L’empire formalise ce que les barangays savaient déjà."
 mrl_baybayin_chancellery_bureaucracy: "Chancellerie de Baybayin"
 mrl_baybayin_chancellery_bureaucracy_desc: "Pedro Chirino s'émerveillait en 1604 que presque tous les Tagalog puissent lire et écrire dans leur écriture native. Les titres fonciers baybayin du XVIIe siècle survivants de l'Université de Santo Tomas attestent d'une utilisation administrative ; les scribes précoloniaux signaient des contrats, enregistraient des hommages et inscrivaient les rites du temple dans l'alphabet d'origine brahmique. La Chancellerie centralise les commis baybayin, jawi et kawi sous un seul bureau, remplaçant la tradition orale du conseiller privé atubang sa datu du datu par une trace écrite."
 mrl_lanong_admiralty_bureaucracy: "Amirauté de Lanong"
 mrl_lanong_admiralty_bureaucracy_desc: "Doctrine de flotte combinée fusionnant le navire de guerre Visayan karakoa, la coque de voyage Butuan-Tondo balangay, la galère de raid Sulu-Iranun lanong et la balancier Mindanao-Sulu vinta en un seul établissement naval impérial. Le karakoa était l'instrument politique de l'archipel du XVIe siècle : ceux qui en possédaient dominaient ceux qui n'en possédaient pas. L'Amirauté hérite de l'économie saisonnière des raids mangayaw et la transforme en projection du Pacifique."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_mrl_bureaucracy_authority: "Autorité bureaucratique du Maharlika"
 AUTO_MODIFIER_DESC_nd_mrl_bureaucracy_authority: "Lors de la proclamation du Maharlika, l’empire hérite du répertoire institutionnel de chaque barangay, sultanat et rajahnate qu’il englobe désormais. La couronne peut abriter des bureaucraties historiques."

# === POLISH PASS: NEW MODIFIER LOC ===
 STATIC_MODIFIER_NAME_nd_mrl_lanong_vanguard: "Avant-garde de Lanong"
 STATIC_MODIFIER_DESC_nd_mrl_lanong_vanguard: "L'escadron d'attaque rapide Lanong est la première réponse de l'empire à tout galion colonial qui traverse l'archipel. Gréé en latin, à la rame en eau calme, armé de lantaka, entraîné pour intercepter et aborder avant qu'une ligne de bataille ne puisse se former."
 STATIC_MODIFIER_NAME_nd_mrl_galleon_free_trade: "Pacte de libre-échange de Manille"
 STATIC_MODIFIER_DESC_nd_mrl_galleon_free_trade: "Tout marchand sous licence impériale peut naviguer sur la ligne transpacifique. Les maisons de soie cantonaises, les marchands d'or tagalog, les syndicats d'argent mexicains : tous convergent vers Manille sous un même ensemble de poids et mesures. L’empire taxe les flux plutôt que de posséder les marchandises."
 STATIC_MODIFIER_NAME_nd_mrl_unified_parliament: "Parlement Maharlika unifié"
 STATIC_MODIFIER_DESC_nd_mrl_unified_parliament: "Les délégués élus hommes libres (timawa, maharlika, bourgeois urbains) sont assis à côté du datus primordial. La voix de l’empire n’est plus seulement celle des grandes maisons; le pacte maharlika a sa chambre constitutionnelle."
 STATIC_MODIFIER_NAME_nd_mrl_vernacular_populist: "Lumières vernaculaires"
 STATIC_MODIFIER_DESC_nd_mrl_vernacular_populist: "Des brochures et des chroniques circulent en baybayin, tagalog, cebuano et hiligaynon. Le maître d'école du barangay les lit au poste de marché ; le curé du village prêche auprès d'eux ; les lumières de l'empire atteignent le peuple sans passer par Madrid."
 STATIC_MODIFIER_NAME_nd_mrl_dest_compact_codified: "Compact dans la loi Baybayin"
 STATIC_MODIFIER_DESC_nd_mrl_dest_compact_codified: "La Fédération pan-philippin est établie en baybayin et en espagnol, décret par décret, traité par traité, ratifiée par chaque conseil suprême. Le pacte est désormais une loi impériale, avec un statut, un précédent et une chancellerie pour faire respecter les deux."
 STATIC_MODIFIER_NAME_nd_mrl_dest_compact_cultural: "Compact dans la culture partagée"
 STATIC_MODIFIER_DESC_nd_mrl_dest_compact_cultural: "La Fédération pan-philippin n’est pas ancrée dans des statuts mais dans des festivals partagés, des chants partagés, des ancêtres partagés invoqués à chaque lakaran. Le pacte vit dans la coutume : plus difficile à codifier, plus difficile encore à rompre."
 STATIC_MODIFIER_NAME_nd_mrl_dest_kris_offensive: "Kris à travers la mer de Sulu"
 STATIC_MODIFIER_DESC_nd_mrl_dest_kris_offensive: "Les régiments bagani défilent sur l'eau. De Berune à Sandakan, de Manado à Ternate : chaque côte étrangère à portée de la vinta impériale devient un terrain contesté. L'empire choisit l'expansion."
 STATIC_MODIFIER_NAME_nd_mrl_dest_kris_homeguard: "Kris de la Home Guard"
 STATIC_MODIFIER_DESC_nd_mrl_dest_kris_homeguard: "Les bagani sont retenus dans leurs régiments d'origine, s'entraînant pour toute flotte coloniale qui pourrait oser l'archipel. L’expansion étrangère attend ; la sécurité archipélagique passe avant tout. L'empire choisit la défense."
