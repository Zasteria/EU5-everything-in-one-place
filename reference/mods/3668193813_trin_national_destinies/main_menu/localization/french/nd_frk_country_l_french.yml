l_french:
 FRK: "Francia"
 FRK_ADJ: "Frankish"
 FRK_f: "Francia"
 FRK_f_desc: "Francia is the realm of the Franks as Charlemagne left it, one crown over the lands between the North Sea, the Seine and the Po. For centuries the Holy Roman Empire held his eastern and Italian inheritance and claimed his mantle, while his western heirs looked on. Once the Empire has fallen, a French, Burgundian or Lotharingian ruler who holds Paris, Aachen, where Charlemagne kept his court and lies buried, and Frankfurt, the ford of the Franks where the kings of the Germans were chosen, may gather the old imperial lands and proclaim Francia restored."
 FRK_f_hre_gone_tt: "The Holy Roman Empire has ceased to exist"
