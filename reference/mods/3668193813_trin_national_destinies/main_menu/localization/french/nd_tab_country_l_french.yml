l_french:
 TAB_tabor: "Tabor"
 TAB_tabor_ADJ: "Taborite"
 TAB_f: "République de Thabor"
 TAB_f_desc: "Forgez une république hussite souveraine à partir de l'aile radicale des guerres hussites : la fraternité paysans-soldats, l'église vernaculaire du calice et les Quatre articles de Prague ont fait loi. Là où la Bohême a fait un compromis à Lipany, les Taborites institutionnalisent leur milice de guerre, leur prêtrise mariée et leur gouvernement communautaire électif dans un État permanent."
