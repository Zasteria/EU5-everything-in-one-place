l_french:
 nd_map_formed_tt: "Wallmapu a été forgé"
 nd_map_path_a_tt: "Chemin de l'endurance de Wallmapu"
 nd_map_path_b_tt: "Chemin de la lance de Pillan"
 nd_map_dest_pampa_share_tt: "We own at least a quarter of the locations of the #bold Pampa#!"
 # ===== Static Modifiers =====
 STATIC_MODIFIER_NAME_nd_map_wallmapu_endurance: "Wallmapu Endurance"
 STATIC_MODIFIER_DESC_nd_map_wallmapu_endurance: "La cordillère et les forêts valdiviennes sont nos murs. La huinca qui y entre n'en revient pas. Nous n'avons pas besoin de leurs villes, de leur or ou de leur dieu, nous avons seulement besoin de la terre qui nous a porté."
 STATIC_MODIFIER_NAME_nd_map_pillan_spear: "Lance de Pillan"
 STATIC_MODIFIER_DESC_nd_map_pillan_spear: "Ce que Lautaro a commencé à Tucapel, la fédération doit le terminer. Le Toki chevauche vers le nord, la boleadora se dirige vers l'est et l'Espagnol apprend qu'il n'y a aucune frontière que les Mapuche ne peuvent franchir lorsque la lance de Pillan est levée."
 STATIC_MODIFIER_NAME_nd_map_curalaba_legacy: "L'héritage de Curalaba"
 STATIC_MODIFIER_DESC_nd_map_curalaba_legacy: "L'embuscade de Pelantaru à Curalaba a brisé le gouverneur espagnol et effacé sept villes de la carte de conquête. La leçon perdure : Wallmapu n’est pas une province à administrer, mais un peuple à craindre."
 STATIC_MODIFIER_NAME_nd_map_quilin_compact: "Compact de Quiln"
 STATIC_MODIFIER_DESC_nd_map_quilin_compact: "Sur les rives de la rivière Quiln, la couronne espagnole a apposé son nom à côté du nôtre en tant que souverains égaux. Le Bo-Bo est une frontière reconnue, les Parlamentos sont une coutume reconnue et Wallmapu est une nation reconnue."
 STATIC_MODIFIER_NAME_nd_map_quilin_unbroken: "Le Bo-Bo ininterrompu"
 STATIC_MODIFIER_DESC_nd_map_quilin_unbroken: "La fédération refuse le traité comme un piège habillé d'amitié. Le fleuve n'est pas une frontière, c'est une trêve temporaire, et les Konas restent prêts pour le jour où le huinca brisera son propre journal."
 STATIC_MODIFIER_NAME_nd_map_lautaro_doctrine: "La doctrine de Lautaro"
 STATIC_MODIFIER_DESC_nd_map_lautaro_doctrine: "Le jeune Toki qui servait Valdivia comme garçon d'écurie revint avec le secret : le cheval n'est pas une arme espagnole c'est une arme. Le premier corps de cavalerie mapuche roule sous son nom."
 STATIC_MODIFIER_NAME_nd_map_steed_seizure: "Le troupeau capturé"
 STATIC_MODIFIER_DESC_nd_map_steed_seizure: "Volé, pillé et élevé à partir de bêtes espagnoles brisées, le troupeau mapuche grandit dans la pampa de Puelmapu. En une génération, le Reche chevauche aussi bien que n'importe quel conquistador, et sur un meilleur terrain."

 # ===== Formation Event =====
 nd_map.1.t: "Le Conseil de toutes les terres"
 nd_map.1.d: "From Pikun to Williche, from the Valdivian forest to the dry plains beyond the cordillera, the lonkos and tokis have ridden to a single ngillatun field. Four centuries of scattered Lof and federated Aillarewe end here. The drum of the kultrun calls the trompe-trompe of the federation, and a Toki Mapu (a war-leader of the whole land) must be acclaimed.\n\nThe debate is not over whether to fight. It is over what fight is ours. The elder lonkos counsel patience: Wallmapu has held the cordillera for two-and-seventy generations because it has refused to leave it. The young tokis (riders of the new horse, raiders of the Spanish settlements at Cuyo) counsel that the Mapuche have never been so strong, and that the spear of Pillan should now be raised over every land the huinca claims south of Lima.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_map.1.a: "Wallmapu Endurance la cordillère suffit"
 nd_map.1.b: "La lance de Pillan pousse la huinca dans la mer"

 # ===== DHE: Curalaba Uprising =====
 nd_map.2.t: "Le désastre de Curalaba"
 nd_map.2.d: "Dans la nuit du 23 décembre, au gué de Curalaba, le Toki Pelantaru a tendu une embuscade au gouverneur Martín Garca ez de Loyola. Le gouverneur mourut, ses cinquante cavaliers moururent et, en six ans, toutes les villes espagnoles au sud du Bo-Bo Valdivia, Imperial, Angol, Villarrica, Santa Cruz, San Bartolom, Osorno furent rasées par les guerriers insurgés. La destruction des sept villes constitue le plus grand renversement territorial jamais subi par l’empire espagnol dans les Amériques. A partir de ce moment, la route des conquistadores vers le sud se termine au bord de la rivière."
 nd_map.2.a: "Wallmapu ne se mesurera pas en lieues mais en gouverneurs morts."

 # ===== DHE: Treaty of Quilín =====
 nd_map.3.t: "Le Quiln Parlamento"
 nd_map.3.d: "Sur le terrain de Quiln en 1641, le marquis de Baides, gouverneur du Chili, représentant de la couronne espagnole, appose son nom sur un traité avec les lonkos assemblés de la fédération. Il s’agit du premier et du seul traité que l’empire espagnol signera avec une nation autochtone américaine sur un pied d’égalité juridique. Les termes reconnaissent la souveraineté de Wallmapu au sud du Bo-Bo, établissent un Parlamento annuel pour renouveler la paix et interdisent la colonisation espagnole au-delà du fleuve. Les lonkos doivent décider : devons-nous imposer à la fédération ce document comme un véritable pacte, ou le traitons-nous comme un souffle temporaire entre les guerres ?"
 nd_map.3.a: "Honorez le pacte que les Parlamentos doivent être observés"
 nd_map.3.b: "Le Bo-Bo est une ligne de trêve, pas une frontière"

 # ===== DHE: Lautaro's Doctrine =====
 nd_map.4.t: "Lautaro et la première cavalerie"
 nd_map.4.d: "Felipe Lautaro a servi Pedro de Valdivia comme garçon d'écurie et a appris toutes les faiblesses du cheval espagnol : comment il se fatigue, comment il est nourri, comment son cavalier mange et se repose. Il fit défection auprès de son propre peuple, prit le titre de Toki et revint à la tête d'une force qui détruisit Valdivia à Tucapel et tua le conquérant de ses propres mains. De sa campagne naît le premier corps de cavalerie mapuche et de ses méthodes naissent toutes les victoires mapuches des deux siècles suivants."
 nd_map.4.a: "Le cheval n'appartient plus seulement à la huinca."

 # ===== DHE: Captured Steed =====
 nd_map.5.t: "Le troupeau au-delà de la rivière"
 nd_map.5.d: "Ce qui a commencé comme des raids sur des avant-postes isolés est maintenant un transfert soutenu de chair de cheval : les Mapuche ont volé, brisé et élevé suffisamment de bétail pour monter leur propre infanterie, et au-delà de la cordillère de Puelmapu, les troupeaux de la fédération paissent sur l'herbe qu'aucun Espagnol n'a jamais monté. D'ici la prochaine génération, aucune cavalerie européenne n'aura un avantage de mobilité contre les Reche sur son propre territoire."
 nd_map.5.a: "La pampa est à nous."

 # ===== Advances =====
 nd_map_lof_confederation: "Confédération du Lof"
 nd_map_lof_confederation_desc: "Le lignage familial est le fondement de la vie politique mapuche. Du lof s'élève le rewe (conseil des neuf), et du rewe l'ailarewe (fédération des neuf conseils). Pas de roi, pas de cour mais chaque homme et chaque cheval comptait."
 nd_map_aillarewe_federation: "Fédération Aillarewe"
 nd_map_aillarewe_federation_desc: "Neuf rewe forment un aillarewe ; neuf aillarewe forment un butalmapu ; quatre butalmapu forment Wallmapu. La structure est fractale, volontaire et étonnamment résiliente : elle n’a pas de tête à couper."
 nd_map_ngillatun_ceremony: "Cérémonie de Ngillatun"
 nd_map_ngillatun_ceremony_desc: "Tous les quatre ans, la fédération se réunit sur un terrain sacré pour le ngillatun : un rituel de quatre jours de fertilité, de paix et de sommet politique. La danse, la chicha et les négociations inter-aillarewe sont indissociables."
 nd_map_valdivian_forest: "Maîtrise de la forêt valdivienne"
 nd_map_valdivian_forest_desc: "Les forêts pluviales tempérées des arbres Ngulumapu coihue, alerce et ulmo vieux de quatre mille ans sont cartographiées, nommées et connues par chaque guerrier mapuche d'une manière qu'aucun guide espagnol ne peut égaler."
 nd_map_toki_council: "Conseil Toki"
 nd_map_toki_council_desc: "Le Toki porteur de la hache de guerre toki-kura est élu pour la durée d'une campagne et obéit absolument pendant toute la durée de la campagne. Après cela, il retourne à son lof. Il n’y a pas de roi permanent à capturer, pas de capital à piller, pas de tribunal à corrompre."
 nd_map_inca_repulse: "La répulsion de Maule"
 nd_map_inca_repulse_desc: "Lorsque l'armée inca de Tupac Yupanqui traversa le Maule dans les années 1480, les Promaucae et les Mapuche les rencontrèrent lors de la bataille du Maule. Après trois jours d'impasse, l'Inca fit demi-tour. La frontière sud du Tawantinsuyu était fixée au Maule et Wallmapu restait invaincu."
 nd_map_machi_shamans: "Chamans Machi"
 nd_map_machi_shamans_desc: "Le machi le plus souvent une femme est le chaman, guérisseur, prophète et ritualiste mapuche. Elle sert d'intermédiaire entre les vivants et le Pillan, et sa voix peut l'emporter même sur un Toki sur des questions ayant des conséquences spirituelles."
 nd_map_ruka_settlement: "Colonie de Ruka"
 nd_map_ruka_settlement_desc: "La ruka, une habitation au toit de chaume en cannes de colige et en roseau totora, est construite en communauté en une seule journée, orientée vers l'aube. Un village mapuche est une constellation de ruka, pas une ville avec une place."
 nd_map_lautaro_doctrine: "La doctrine de Lautaro"
 nd_map_lautaro_doctrine_desc: "L'héritage tactique de Lautaro : relais de cavaliers frais, fausses retraites dans des embuscades préparées et épuisement délibéré des colonnes espagnoles avant le contact. Le premier corps de cavalerie mapuche est né de sa doctrine."
 nd_map_tucapel_triumph: "Le triomphe de Tucapel"
 nd_map_tucapel_triumph_desc: "Le jour de Noël 1553, les forces de Lautaro anéantirent Pedro de Valdivia et son armée à Tucapel. Selon certains récits, le conquérant du Chili a été tué, avec de l'or fondu versé dans la gorge. L'avancée sud espagnole mourut avec lui."
 nd_map_curalaba_uprising: "Le soulèvement de Curalaba"
 nd_map_curalaba_uprising_desc: "L'embuscade de Pelantaru à Curalaba en 1598 marqua le début de la destruction des Sept Villes qui dura six ans. Chaque colonie espagnole au sud du Bo-Bo a été incendiée. La route des conquistadores se termine au bord de la rivière."
 nd_map_captured_steed: "Le coursier capturé"
 nd_map_captured_steed_desc: "Au début du XVIIe siècle, les Mapuche avaient attaqué, élevé et entraîné suffisamment de chevaux pour que les deux tiers d'une ligne de bataille se battent. Ils ont fait ce qu'aucun autre peuple d'Amérique n'a réussi : égaler le conquistador en cavalerie."
 nd_map_cordilleran_ambush: "Embuscade de la Cordillère"
 nd_map_cordilleran_ambush_desc: "Des pièges à pointes de bois prépositionnés, des lanceurs de boleadora dissimulés dans la canopée et une connaissance approfondie des traces de la cordillère, les Mapuche transforment chaque gorge entre Bo-Bo et Toltn en un couloir d'embuscade."
 nd_map_bio_bio_frontier: "La frontière Bo-Bo"
 nd_map_bio_bio_frontier_desc: "Après la destruction des Sept Villes, le Bo-Bo devient une ligne fortifiée Mapuche pukara sur la rive sud, des forts espagnols au nord. Pendant deux siècles, aucun des deux camps n’avance."
 nd_map_pehuenche_alliance: "Alliance Pehuenche"
 nd_map_pehuenche_alliance_desc: "Les Pehuenche cueilleurs de pignons de pin pehun dans les hautes Andes rejoignent officiellement la fédération. Leurs cols d'altitude deviennent territoire mapuche, et la cordillère elle-même devient un atout de la fédération."
 nd_map_treaty_of_quilin: "Le traité de Quiln"
 nd_map_treaty_of_quilin_desc: "Le traité Quiln de 1641 : le seul traité que l'empire espagnol ait jamais signé avec une nation autochtone américaine comme étant son égal légal. Le Bo-Bo est reconnu comme frontière souveraine. L'institution du Parlamento est née."
 nd_map_malon_raids: "Raids Malns"
 nd_map_malon_raids_desc: "Le maln de Mapudungun maleu, « faire du mal » est un raid rapide pour le bétail, les chevaux, les armes et les captifs. Lientur le perfectionne en tant que stratégie soutenue ; au XVIIIe siècle, la frontière espagnole de Cuyo à Buenos Aires vit dans la peur du nuage de poussière."
 nd_map_parlamento_general: "Parlement général"
 nd_map_parlamento_general_desc: "Le Parlamento annuel à Tapihue ou Negrete : des centaines de lonkos et de gouverneurs espagnols se sont réunis pour la renégociation, l'échange de cadeaux et le renouvellement de Quiln. La fédération mène la diplomatie comme un pair d'un empire."
 nd_map_puelmapu_expansion: "L'extension Puelmapu"
 nd_map_puelmapu_expansion_desc: "Les locuteurs de Mapudungun traversent la cordillère jusqu'à la pampa argentine, absorbant ou déplaçant les bandes Tehuelche et Het. En un siècle, la steppe de Mendoza au Ro Negro devient territoire mapuche."
 nd_map_wenteche_horsemanship: "Équitation Wenteche"
 nd_map_wenteche_horsemanship_desc: "Les goneeche « peuple de la vallée centrale » développent la charge lourde à la lance contre les formations espagnoles. Les écrans d'éclaireurs lanceurs de boléadoras ; le lancier brise la ligne."
 nd_map_boqueador_raiders: "Raiders de Boqueador"
 nd_map_boqueador_raiders_desc: "L'éclaireur et éclaireur du boqueador guide les colonnes de la fédération à travers les boquetes (cols) de la cordillère. Chaque expédition punitive espagnole qui le suit dans les montagnes revient plus petite, voire pas du tout."
 nd_map_salinas_grandes: "Salinas Grandes"
 nd_map_salinas_grandes_desc: "Les vastes salines de la pampa argentine sont le poumon économique de la fédération : du sel pour conserver le bétail, du bétail pour nourrir le village et des routes commerciales qui mènent aussi bien à Buenos Aires qu'à Concepcin."
 nd_map_pillan_worship: "Culte du Pilan réformé"
 nd_map_pillan_worship_desc: "La fédération codifie le culte de Pillan et de Ngenechen, l'esprit créateur et le pouvoir ancêtre, comme un système confessionnel unique. Les missions jésuites sont poliment rejetées ; les machi restent les gardiens du sacré."
 nd_map_standing_warband: "La bande de guerre permanente"
 nd_map_standing_warband_desc: "La première caserne mapuche debout : une bande professionnelle permanente de konas, pas une levée saisonnière. La fédération commence à conserver une armée régulière pour la première fois de son histoire."
 nd_map_mapudungun_literacy: "Alphabétisation Mapudungun"
 nd_map_mapudungun_literacy_desc: "La grammaire mapudungun du père Luis de Valdivia, écrite par un jésuite, mais dans la langue du peuple, est récupérée par les érudits mapuche. Au XIXe siècle, le mapudungun est imprimé dans des brochures et des textes de traités."
 nd_map_pacification_resistance: "Résistance à la pacification"
 nd_map_pacification_resistance_desc: "Les campagnes de « pacification » chilienne et argentine des années 1860-1880 constituent la plus longue guerre de la fédération. Avec des fusils à chargement par la culasse saisis lors de raids, les lonkos mapuches font de chaque kilomètre de la cordillère un cimetière pour les régiments des nouvelles républiques."
 nd_map_wallmapu_sovereignty: "Souveraineté de Wallmapu"
 nd_map_wallmapu_sovereignty_desc: "Reconnu comme État par le système international : Wallmapu envoie des ambassades à Buenos Aires, Lima, Madrid et Londres. La fédération a fait ce qu’aucune autre nation autochtone américaine n’a accompli : elle a survécu en tant que souveraine."
 nd_map_trapil_orature: "Trapil Orature"
 nd_map_trapil_orature_desc: "Le trapil, l'histoire orale reliée conservée par les lonkos, s'engage à être imprimé. Les généalogies, les chants de campagne, les discours prononcés à chaque Parlement depuis Quiln sont désormais archivés."
 nd_map_industrial_reche: "La Recherche Industrielle"
 nd_map_industrial_reche_desc: "Moulins à vapeur, stations télégraphiques et ateliers de carabines à Temuco. La fédération s'industrialise selon ses propres conditions, le Lof persiste en tant qu'unité politique, mais les biens qu'elle consomme sont désormais fabriqués par ses propres machines."
 nd_map_pampa_horse_trade: "Le commerce des chevaux de la Pampa"
 nd_map_pampa_horse_trade_desc: "L'exportation de chevaux et de bovins de Patagonie devient le commerce phare de la fédération. De Salinas Grandes, les troupeaux se déplacent vers Buenos Aires, Valparaso et le marché de Lima. Le bétail mapuche nourrit trois capitales étrangères."

 # ===== Units =====
 a_nd_map_kona_warband_unit: "Bande de guerre de Kona"
 a_nd_map_kona_warband_unit_desc: "Prélèvement à la lance et au gourdin du Lof, chaque foyer de parenté apporte ses jeunes hommes. Sans formation mais enracinés localement, dévastateurs dans les forêts dans lesquelles ils ont grandi."
 a_nd_map_kona_spearmen_unit: "Lanciers de Kona"
 a_nd_map_kona_spearmen_unit_desc: "La fédération disciplinée dirige l'infanterie centrale de la ligne de bataille mapuche. Transporte le long brochet mapuche adapté des tercios espagnols observés."
 a_nd_map_malon_rider_unit: "Cavalier Maln"
 a_nd_map_malon_rider_unit_desc: "On recrutait des cavaliers nobles pour des raids de pillage rapides. Porte la lance, le bola et une ribambelle de remontées."
 a_nd_map_kona_lancer: "Kona Lancer"
 a_nd_map_kona_lancer_desc: "Les premiers lanciers légers du corps de cavalerie mapuche de Lautaro chevauchant du bétail espagnol capturé et élevé. Tactiques d'initiative et de fausse retraite apprises du service de Lautaro dans les écuries de Valdivia."
 a_nd_map_malon_lancer: "Maln Lancer"
 a_nd_map_malon_lancer_desc: "Pillard monté, rapide, légèrement blindé, équipé d'un bola. La terreur de la frontière espagnole de Mendoza à Concepcin."
 a_nd_map_wenteche_lancer: "Wenteche Lancer"
 a_nd_map_wenteche_lancer_desc: "Cavalerie de choc lourde de la vallée centrale, blindée de cuirasse récupérée des victimes espagnoles, chevauchant les plus gros chevaux que Wallmapu puisse élever. Le marteau de la fédération."
 a_nd_map_boqueador: "Boquéador"
 a_nd_map_boqueador_desc: "Pathfinder et passe-scout. Connaît chaque boquete de la cordillère et peut guider une colonne sur une piste dont aucun guide espagnol n'admettra l'existence."
 a_nd_map_winka_rifleman: "Winka Fusilier"
 a_nd_map_winka_rifleman_desc: "Fusilier mapuche de l'époque de la résistance, armé de fusils à chargement par la culasse saisis ou échangés auprès des huinca, combattant sur son territoire contre les armées de la pacification."

 # ===== Levies =====
 levy_nd_map_kona_warband: "Prélèvement de la bande de guerre de Kona"
 levy_nd_map_kona_spearmen: "Prélèvement des lanciers de Kona"
 levy_nd_map_malon_riders: "Prélèvement des cavaliers Maln"

 # ===== Buildings =====
 nd_map_ngillatun_field: "Champ de Ngillatun"
 nd_map_ngillatun_field_desc: "Le terrain de cérémonie sacré pour le nillatun quadriennal. A la fois temple et sommet politique, le terrain s'articule autour d'un poteau sacré."
 nd_map_lof_clanhouse: "Maison du clan Lof"
 nd_map_lof_clanhouse_desc: "Loge de parenté de la lignée mapuche, où le lonko reçoit les visiteurs, arbitre les différends et garde au piège l'histoire orale liée de sa lignée."
 nd_map_pillan_sanctuary: "Sanctuaire de Pillán"
 nd_map_pillan_sanctuary_desc: "Sanctuaire de Ngenechen et des ancêtres Pillan. Le machi garde ici le feu sacré et le tambour kultrun, et refuse l'entrée au prêtre huinca."
 nd_map_ruka_compound: "Composé de Ruka"
 nd_map_ruka_compound_desc: "Un établissement regroupé d'habitations mapuches traditionnelles, aux murs en canne de colige, au toit en roseau totora et au foyer central. Construit en commun en une seule journée."
 nd_map_cordilleran_path: "Chemin de la Cordillère"
 nd_map_cordilleran_path_desc: "Un sentier forêt-montagne caché avec des points d'embuscade pré-positionnés. La fédération entretient ces sentiers en tant qu'infrastructure défensive, chaque gorge devient un terrain de massacre."
 nd_map_konas_guardhouse: "Poste de garde de Konas"
 nd_map_konas_guardhouse_desc: "Caserne professionnelle permanente pour une bande permanente de konas, la première installation militaire régulière de la fédération, rompant avec la tradition des prélèvements saisonniers."

 # ===== PM keys =====
 nd_map_ngillatun_maintenance: "Entretien du terrain de Ngillatun"
 nd_map_ngillatun_maintenance_desc: "Du bétail pour la fête quadriennale, des cultures de fibres pour le tissu de cérémonie et de la cire d'abeille pour les bougies votives."
 nd_map_clanhouse_maintenance: "Entretien de la maison de clan"
 nd_map_clanhouse_maintenance_desc: "Du bois pour la salle à colombages, du bétail pour la table du lonko et de la laine pour les couvertures de parenté suspendues aux murs."
 nd_map_sanctuary_maintenance: "Entretien du sanctuaire"
 nd_map_sanctuary_maintenance_desc: "De la cire d'abeille pour le feu sacré, du bois pour le poteau de rewe, des fibres pour le tissu cérémoniel et du gibier sauvage pour les rites de guérison du machi."
 nd_map_ruka_maintenance: "Entretien de Ruka"
 nd_map_ruka_maintenance_desc: "Bois de construction et canne à sucre pour les murs, fibres végétales pour les cordages et poissons des rivières et de la côte."
 nd_map_path_maintenance: "Entretien du sentier de la Cordillère"
 nd_map_path_maintenance_desc: "Du bois pour les pièges à pointes, des armes pour les armes cachées et des chevaux pour les cavaliers de relais qui portent les avertissements sur le sentier."
 nd_map_guardhouse_maintenance: "Entretien du corps de garde"
 nd_map_guardhouse_maintenance_desc: "Armes, chevaux, bétail pour la table des konas et bois pour la caserne."
 nd_map_salinas_hide_camp: "Salinas Hide Camp"
 nd_map_salinas_hide_camp_desc: "A camp of herders and salt carriers on the steppe. Cattle driven over the pampa are slaughtered here and the hides cured with the salt of the Salinas Grandes, for the trade across the cordillera."
 nd_map_hide_curing: "Hide Curing"
 nd_map_hide_curing_desc: "Cattle, salt and knives go in; cured hides come out."
 nd_map_rifle_works: "Rifle Works"
 nd_map_rifle_works_desc: "Gunsmiths' shops where captured and traded rifles are repaired and copied. The lof is armed with weapons of its own making."
 nd_map_rifle_making: "Rifle Making"
 nd_map_rifle_making_desc: "Iron for locks and barrels, wood for stocks, and the tools of the smith."

 # ===== Destiny Tree =====
 nd_map_destiny: "Le grand projet d'une fédération"
 nd_map_destiny_desc: "Les quatre butalmapu se sont rendus sur un seul champ, le kultrun a été frappé et le Toki Mapu a été acclamé. La fédération a fait ce qu'aucune génération mapuche n'a réussi à faire avant d'avoir choisi, en tant que peuple unique, ce que sera son long siècle. Le travail commence maintenant."

 nd_map_dest_codified_parlamento: "Le Parlement codifié"
 nd_map_dest_codified_parlamento_desc: "Les Parlamentos annuels de Tapihue et Negrete sont codifiés en un cycle législatif permanent. Les Lonkos, machi et tokis sont convoqués selon un calendrier fixe ; les débats de la fédération deviennent loi. Nécessite l'institution du légalisme et un trésor de 1 000 ducats."
 nd_map_dest_free_republic: "La République Libre de Reche"
 nd_map_dest_free_republic_desc: "The federation reorganizes itself as a republic of the Reche, a polity of free men, governed by election and consent, with no king and no court. Requires the institution of professional armies, 50 prestige, and a Lof Clanhouse in five locations."
 nd_map_dest_recognized_nation: "Reconnu parmi les nations"
 nd_map_dest_recognized_nation_desc: "Wallmapu envoie des ambassades à Madrid, Londres, Paris et Buenos Aires. Les chancelleries du monde reconnaissent ce que les Bo-Bo connaissent depuis des siècles : une république amérindienne, souveraine et reconnue. Nécessite un commerce mondial, 75 prestige, 3 000 ducats et de la stabilité."

 nd_map_dest_march_toki_mapu: "Marche du Toki Mapu"
 nd_map_dest_march_toki_mapu_desc: "The Toki Mapu (war-leader of all Wallmapu) rides north out of the central valley, past the Pikumche frontier and the Aconcagua, into the valleys the Inca once held. Requires ownership of Limari and Elki."
 nd_map_dest_cordillera_crossed: "La Cordillère traversée"
 nd_map_dest_cordillera_crossed_desc: "The federation's columns climb the boquetes and descend into Cuyo and the Diaguita lands of the north pampa. The Andes is no longer a wall. It is a corridor. Requires ownership of Cuyo and Kilmes, the Captured Steed advance, and a treasury of 2,000 ducats."
 nd_map_dest_toki_apu: "Toki Apu de toutes les terres"
 nd_map_dest_toki_apu_desc: "From Salta to the Tandil hills, from the cordillera to the Atlantic, the Mapuche imperial confederation is realized. The Toki Apu (supreme war-leader of the continent) sits in permanent assembly. Requires ownership of Salta and Tandil, a quarter of the Pampa, the Malón Raids advance, and stability."

 nd_map_dest_imperial_toki: "Le Toki Impérial"
 nd_map_dest_pampa_dominion: "Domaine de la Pampa"

 # ===== Destiny Static Modifiers =====
 STATIC_MODIFIER_NAME_nd_map_dest_lonko_senate: "Le Sénat Lonko"
 STATIC_MODIFIER_DESC_nd_map_dest_lonko_senate: "The lonkos of the four butalmapu sit as a permanent legislative body. Authority that once flowed only through campaign-tokis now flows through a calendar of senate-sessions, and the standing of the lonkos rests on it."
 STATIC_MODIFIER_NAME_nd_map_dest_machi_judiciary: "Le pouvoir judiciaire de Machi"
 STATIC_MODIFIER_DESC_nd_map_dest_machi_judiciary: "Là où les lonkos légifèrent, les machi jugent. Les différends entre lof, entre aillarewe et entre citoyen et fédération sont entendus dans le sanctuaire du Pillan, et les décisions sont obéies sans recours."
 STATIC_MODIFIER_NAME_nd_map_dest_atlantic_embassies: "Ambassades sur l'Atlantique"
 STATIC_MODIFIER_DESC_nd_map_dest_atlantic_embassies: "Les ambassadeurs de Wallmapu sont reçus à Madrid, Londres et Paris. La fédération mène la diplomatie comme un pair des puissances atlantiques et le commerce suit la bannière des ambassades."
 STATIC_MODIFIER_NAME_nd_map_dest_continental_compact: "Pacte continental des peuples"
 STATIC_MODIFIER_DESC_nd_map_dest_continental_compact: "Wallmapu appelle un Parlement continental des nations indigènes Tehuelche, Diaguita, Pehuenche, héritiers de Tawantinsuyu et propose un pacte de reconnaissance mutuelle. La république libre devient l’étendard et le siècle des conquérants est réprimandé."
 STATIC_MODIFIER_NAME_nd_map_dest_huinca_road: "La route de Huinca inversée"
 STATIC_MODIFIER_DESC_nd_map_dest_huinca_road: "La route que le conquistador a construite depuis Lima, le Camino Real, est désormais parcourue dans la direction opposée. Le Toki Mapu se dirige vers le nord aussi vite que Valdivia le fait vers le sud."
 STATIC_MODIFIER_NAME_nd_map_dest_pehuenche_passes: "Gardiens du col Pehuenche"
 STATIC_MODIFIER_DESC_nd_map_dest_pehuenche_passes: "Chaque boquete de la Cordillère est détenu par des guides Pehuenche. Les colonnes de la fédération se déplacent à travers les Andes comme sur un terrain plat ; les colonnes de la huinca se lancent dans des embuscades."
 STATIC_MODIFIER_NAME_nd_map_dest_imperial_toki: "Le Toki Impérial"
 STATIC_MODIFIER_DESC_nd_map_dest_imperial_toki: "Le Toki Apu est élu en session permanente, non plus comme chef élu d'une seule campagne, mais comme chef de guerre permanent d'une fédération impériale. Les lof tendent leurs lances vers lui."
 STATIC_MODIFIER_NAME_nd_map_dest_pampa_dominion: "Domaine de la Pampa"
 STATIC_MODIFIER_DESC_nd_map_dest_pampa_dominion: "La steppe bovine de Salinas Grandes jusqu'à l'Atlantique est un pâturage mapuche. Les éleveurs, les éleveurs et les colons Reche se déplacent librement à travers la pampa, et la cordillère n'est plus la frontière de la fédération, mais sa colonne vertébrale."

 # ===== Destiny Events =====
 nd_map.6.t: "Le grand projet"
 nd_map.6.d: "Sur le terrain de Wallmapu, le kultrun a été frappé pour la longue route. La fédération a choisi son siècle. Les lonkos et les tokis rentrent du conseil avec le même mot à la bouche : le travail commence maintenant."
 nd_map.6.a: "La fédération a choisi sa voie."

 nd_map.7.t: "Un calendrier permanent"
 nd_map.7.d: "Les Parlamentos annuels de Tapihue et Negrete, autrefois rassemblements de renégociation entre le gouverneur espagnol et le Mapuche lonko, sont désormais des sessions d'une législature fédérale. Le calendrier est fixe. Les lonkos ne se réunissent pas lorsque la huinca appelle, mais lorsque la Reche appelle. Le Parlamento est devenu un Sénat."
 nd_map.7.a: "Laissez le Sénat siéger."

 nd_map.8.t: "La République libre déclarée"
 nd_map.8.d: "La fédération se déclare république de la Reche, un régime d'hommes libres. La question est de savoir quel genre de république ce sera : un Sénat Lonko composé de chefs législatifs, ou un pouvoir judiciaire Machi composé de juristes spirituels ? Tous deux sont mapuches. Ni l’un ni l’autre n’a de précédent sur le continent."
 nd_map.8.a: "Les lonkos légifèreront."
 nd_map.8.b: "Le machi jugera."

 nd_map.9.t: "La République reconnue"
 nd_map.9.d: "Wallmapu a fait ce qu’aucune nation autochtone américaine n’a accompli : elle se présente comme une république souveraine, reconnue par les puissances atlantiques. Reste maintenant la question de sa posture diplomatique : doit-elle se tourner vers l’extérieur, vers les capitales atlantiques, ou vers l’intérieur, vers un pacte continental de peuples libres ?"
 nd_map.9.a: "Ambassades à Madrid, Londres et Paris."
 nd_map.9.b: "Un pacte continental de peuples libres."

 nd_map.10.t: "Le Toki Mapu roule vers le nord"
 nd_map.10.d: "The horse-relays carry the call from the Pikumche frontier to the Aconcaguan ridges: the Toki Mapu has crossed the Maule. The boundary that held back Tupac Yupanqui in 1480 is now the federation's pivot, not its limit. The ridelines reach the valleys of Limari and Elki."
 nd_map.10.a: "Le Maule n'est plus une frontière."

 nd_map.11.t: "Au-delà de la Cordillère"
 nd_map.11.d: "Les colonnes de la fédération ont traversé les Andes par la route construite par les huincas ou par les boquetes que connaissent les Pehuenche. Cuyo s'incline, le pays Diaguita s'ouvre et les Mapuche ont fait ce qu'aucun peuple andin n'a réussi : ils combattent d'un seul tenant des deux côtés de la cordillère."
 nd_map.11.a: "Empruntez la route du conquistador vers le nord."
 nd_map.11.b: "Le Pehuenche tiendra chaque passe."

 nd_map.12.t: "Toki Apu du continent"
 nd_map.12.d: "Les quatre butalmapu sont devenus cinq, puis sept. De Salta aux collines du Tandil, de l'épine dorsale de la cordillère aux dunes de l'Atlantique, la bannière de la fédération flotte. Le Toki Apu doit maintenant choisir son style de chef de guerre impérial d'un dominion acclamé, ou de roi-berger d'un État-pampa continental ?"
 nd_map.12.a: "Acclamez l'impérial Toki Apu."
 nd_map.12.b: "Considérez la pampa comme le cœur de la fédération."

 # ===== Destiny Buildings =====
 nd_map_parlamento_permanente: "Parlement Permanent"
 nd_map_parlamento_permanente_desc: "L'assemblée républicaine perpétuelle de la Reche. Là où autrefois les Parlamentos étaient convoqués par les gouverneurs espagnols à Quiln ou Negrete, la fédération tient désormais un journal permanent, de l'encre et des lonkos élus en session continue."
 nd_map_parlamento_maintenance: "Entretien du Parlement"
 nd_map_parlamento_maintenance_desc: "Du papier pour les archives législatives, du tissu fin pour les robes sénatoriales des lonkos, des meubles pour la salle de réunion et des outils pour les presses des scribes."
 nd_map_toki_apu_hall: "Salle debout Toki Apu"
 nd_map_toki_apu_hall_desc: "Le siège permanent du Toki impérial n'est pas une tente de campagne érigée après la guerre, mais une salle debout du chef de guerre de tous les pays. Les Konas montent la garde, les Lonkos rendent hommage et les lances sont brandies le long des murs."
 nd_map_toki_apu_maintenance: "Entretien de la salle debout"
 nd_map_toki_apu_maintenance_desc: "Des armes pour l'arsenal des konas, des chevaux pour les écuries de relais, du bétail pour la table impériale et du bois pour la salle toujours agrandie."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_map_bureaucracy_authority: "Autorité fédérale de Wallmapu"
 AUTO_MODIFIER_DESC_nd_map_bureaucracy_authority: "The Aillarewe federations of Wallmapu have proclaimed the federation, and four institutional councils stand ready to be raised into permanent organs: the Toki Apu war-assembly, the Aillarewe regional federation, the Machi sisterhood of trance-judges, and (after Quilin) the Parlamento General. Two of the four can be entrenched at once, while the others remain emergency convocations in the federation's older custom."

 map_toki_apu_council_bureaucracy: "Conseil de Toki Apu"
 map_toki_apu_council_bureaucracy_desc: "The war-leader assembly. In ordinary times each lof answered to its lonko and each rewe to its council; only when the Aillarewe convened to wage a campaign did they elect a Toki (the axe-bearer), and only when several Aillarewe federated did they raise a Toki Apu of all war-bands. Lautaro held this rank against Valdivia at Tucapel; Pelantaru against Onez de Loyola at Curalaba. Institutionalizing the council gives the federation a single mobilizing fist at the cost of unsettling the great-house ulmen, who prefer their own rewe to the axe-bearer's writ."

 map_aillarewe_federation_bureaucracy: "Fédération Aillarewe"
 map_aillarewe_federation_bureaucracy_desc: "La confédération régionale de neuf rewes qui constitue l’épine dorsale institutionnelle de Wallmapu. Chaque Aillarewe (Pikunche, Wenteche, Nagche, Lafkenche, Pewenche, Wulluche) était une fédération permanente de neuf conseils qui mettaient en commun les conflits, organisaient les cérémonies hivernales des ngillatun et tenaient les listes de démarcation entre les lignées. Les affaires de la Confédération étaient dirigées par des ulmen assis à la pierre de rewe, jamais par un tribunal central. L'élévation de l'Aillarewe au rang d'institution permanente préserve l'autonomie locale du lof au prix de toute aspiration à un Toki Mapu centralisé."

 map_machi_sisterhood_bureaucracy: "Fraternité Machi"
 map_machi_sisterhood_bureaucracy_desc: "L'ordre des chamanes bispirituelles femmes et machi-weye qui servaient de guérisseuses, de juges et de chroniqueurs des lignées. Les machi présidaient les rites de fertilité nglatun-rewe, interrogeaient les sorciers présumés wekufu lors des procès kalku et conservaient les généalogies dont les lignées avaient besoin pour faire valoir leurs revendications territoriales. Leur autorité se situe en dehors de la hiérarchie guerrière : les ulmen craignent le procès kalku, les lonkos s'en remettent à la cérémonie de transe. Maintenu, l’ordre tisse la fédération dans un rituel partagé ; négligé, il devient prédateur, dénonçant ses rivaux sous l'accusation de transe."

 map_parlamento_general_bureaucracy: "Parlement général"
 map_parlamento_general_bureaucracy_desc: "Le conseil formel que les gouverneurs espagnols du Chili furent contraints de convoquer avec les lonkos des Aillarewe : à Quilin en 1641, puis à Negrete, Tapihue et ailleurs au cours des XVIIe et XVIIIe siècles. Après la défaite de Curalaba, la Couronne de Castille a reconnu la fédération comme contrepartie souveraine; les Parlamentos ont publié des textes de traités bilingues, fixé la frontière Bio-Bio, échangé des captifs et arbitré le commerce transfrontalier. C’est la seule institution amérindienne reconnue dans le système diplomatique atlantique avant le XVIIIe siècle : et la seule institution mapuche que les lignées anciennes considèrent avec méfiance, comme le siège où leur autonomie est négociée."
 STATIC_MODIFIER_NAME_nd_map_toki_federation: "Fédération du Conseil Toki"
 STATIC_MODIFIER_DESC_nd_map_toki_federation: "La gouvernance fédérale du Wallmapu : Aillarewes de neuf clans Lof, chacun représenté par un chef de paix Lonko ; un chef de guerre Toki élu uniquement lorsque la fédération prend les armes ; l'assemblée parlementaire du Coyaqtun liant la fédération en conseil. Il n'y a pas de roi héréditaire. Le Wallmapu est une fédération de tribus, pas un royaume en tenue de chef."
