l_french:
 STATIC_MODIFIER_NAME_nd_golden_liberty: "Liberté dorée"
 STATIC_MODIFIER_DESC_nd_golden_liberty: "Le Zlota Wolnosc consacre les droits de chaque noble. Aucun roi ne règne sans le consentement du Sejm, aucune guerre n'est déclarée sans l'approbation de la szlachta et chaque confession peut pratiquer librement son culte sous la protection du Commonwealth."
 STATIC_MODIFIER_NAME_nd_jagiellonian_union: "Union Jagellonne"
 STATIC_MODIFIER_DESC_nd_jagiellonian_union: "La dynastie qui a uni deux grandes nations a forgé un État qui s’étend de la Baltique à la mer Noire. Grâce à la force de la couronne et à la loyauté de ses sujets, le Commonwealth perdurera en tant que puissance continentale."
 STATIC_MODIFIER_NAME_nd_spirit_of_tolerance: "Esprit de tolérance"
 STATIC_MODIFIER_DESC_nd_spirit_of_tolerance: "À une époque où l’Europe brûle de guerres de religion, le Commonwealth se démarque, un refuge où catholiques, protestants, orthodoxes et juifs peuvent vivre côte à côte en paix."
 STATIC_MODIFIER_NAME_nd_confessional_discipline: "Discipline confessionnelle"
 STATIC_MODIFIER_DESC_nd_confessional_discipline: "La vraie foi est le fondement de l’État. En renforçant l’Église et en guidant les fidèles, le Commonwealth assure son unité spirituelle contre le chaos des divisions sectaires."
 STATIC_MODIFIER_NAME_nd_constitutional_republic: "République constitutionnelle"
 STATIC_MODIFIER_DESC_nd_constitutional_republic: "La loi gouvernementale établit la séparation des pouvoirs, abolit le liberum veto et étend la citoyenneté au-delà de la noblesse. Une nouvelle aube pour la République des Deux Nations."
 STATIC_MODIFIER_NAME_nd_royal_prerogative: "Prérogative royale"
 STATIC_MODIFIER_DESC_nd_royal_prerogative: "La couronne a récupéré son ancienne autorité. Avec l'abolition du liberum veto et la mise au pas des magnats, le roi peut enfin gouverner sans la paralysie de l'obstruction noble."
 nd_plc.1.t: "L'Union de deux nations"
 nd_plc.1.d: "On the first day of July, in the city of Lublin, the seals of two great nations were pressed into wax. The Kingdom of Poland and the Grand Duchy of Lithuania, bound by marriage, by war, and by shared necessity since the days of Jogaila and Jadwiga, are now forged into a single Commonwealth. The Rzeczpospolita Obojga Narodów, the Republic of Both Nations, stretches from the Baltic shores to the steppes of the east, encompassing Poles, Lithuanians, Ruthenians, Germans, Jews, Tatars, and Armenians within its borders.\n\nBut what manner of state shall this be? The szlachta dream of a noble republic where every gentleman is a king on his own estate, where the Sejm governs by consensus and the crown is merely first among equals. Others see the Union as an opportunity to build a centralized power under the Jagiellonian legacy, a dynasty state that can marshal the combined strength of both nations against Muscovy, the Ottomans, and the Teutonic remnants.\n\nThe path we choose now will shape the character of the Commonwealth for generations.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_plc.1.a: "Zlota Wolnosc, la liberté dorée de tout noble"
 nd_plc.1.b: "L'héritage jagellonien, la force par l'union dynastique"
 nd_plc.2.t: "La Confédération de Varsovie"
 nd_plc.2.d: "On the twenty-eighth of January, 1573, with the throne empty and the future uncertain, the assembled nobility of the Commonwealth made a declaration that would echo through the centuries. The Confederation of Warsaw, signed by Catholics, Lutherans, Calvinists, Orthodox believers, and others, pledged mutual tolerance and peace between all confessions.\n\n'We who differ in matters of religion will keep the peace among ourselves,' the document proclaims, 'and neither shed blood on account of differences of Faith, or kinds of church, nor punish one another by confiscation of goods, deprivation of honor, imprisonment, or exile.'\n\nIn an age when the St. Bartholomew's Day Massacre has just shocked all of Europe, and religious wars tear the continent apart, the Commonwealth has chosen a radical path. But not all are pleased, Cardinal Hosius has called Poland 'a place of shelter for heretics,' and many Catholic voices demand that the state defend the true faith with greater vigor."
 nd_plc.2.a: "Que la tolérance soit la loi de notre République"
 nd_plc.2.b: "Renforcer la vraie foi, l'unité par la conviction"
 nd_plc.3.t: "La loi gouvernementale du 3 mai"
 nd_plc.3.d: "After decades of political paralysis, foreign interference, and the slow disintegration of state authority, the Great Sejm has achieved what many thought impossible. On the third of May, 1791, the deputies have adopted the Government Act, the first written constitution in Europe and the second in the world, after the American document of 1787.\n\nThe Constitution abolishes the liberum veto that allowed any single deputy to destroy an entire session's legislation. It establishes a hereditary monarchy, extends political rights to the bourgeoisie, and places the peasantry under the state's protection. Hugo Kołłątaj, Ignacy Potocki, and King Stanisław August Poniatowski have together forged a document that could save the Commonwealth from the partitioning powers.\n\nBut Russia and Prussia will not tolerate a strengthened Poland. The Constitution's survival depends on whether we can defend it against those who profit from our weakness, both foreign powers and the magnates of the Targowica Confederation who invite Russian bayonets to protect their privileges."
 nd_plc.3.a: "La République renaît, la souveraineté par la Constitution"
 nd_plc.3.b: "La Couronne restaurée, une monarchie forte pour des temps désespérés"
 nd_plc.4.t: "Les Lisowczycy : les cavaliers peints du Commonwealth"
 nd_plc.4.d: "They ride without pay, without supply trains, without mercy. The Lisowczycy, named for their founder Aleksander Józef Lisowski, are irregular cavalry who serve the Commonwealth in exchange for the right to loot. Clad in distinctive costumes and mounted on fast horses, they strike deep behind enemy lines, burning supplies, scattering reinforcements, and spreading terror.\n\nTheir reputation precedes them across Europe. During the Thirty Years' War, Holy Roman Emperor Ferdinand II requested their services, and the 'painted riders' became feared from Muscovy to Transylvania. Their speed and ferocity are unmatched, but so is their reputation for plunder and violence against civilians.\n\nFor the Commonwealth, they represent a military paradox: devastating in battle, ungovernable in peace. But in a state that cannot afford a standing army of sufficient size, these self-financing irregulars fill a critical gap in the nation's defenses."
 nd_plc.4.a: "Que les cavaliers peints servent la République"
 nd_plc.5.t: "La route des céréales vers Gdansk"
 nd_plc.5.d: "From the great estates of the interior, from the folwarks of Mazovia, Lesser Poland, and Volhynia, the barges drift northward down the Vistula. They carry the rye and wheat that feeds Amsterdam, Antwerp, and the growing cities of the West. At Gdańsk, the river meets the sea, and Polish grain meets Dutch silver.\n\nThe city of Gdańsk controls eighty percent of this inland trade. Its burghers grow rich as middlemen between the szlachta landowners and the merchants of the Low Countries. The grain trade has made the Commonwealth the breadbasket of Europe, but it has also locked the economy into a pattern: the nobles expand their estates, bind the peasantry more tightly to the land, and resist any change that might threaten the flow of grain to market.\n\nStill, as long as the harvests flow and the Vistula runs, the wealth of the Commonwealth endures."
 nd_plc.5.a: "Le fleuve porte notre prospérité"
 nd_plc.6.t: "Sarmatisme : le noble idéal"
 nd_plc.6.d: "A new cultural movement has swept through the szlachta. Sarmatism, the belief that the Polish nobility descends from the ancient Sarmatian warriors of the steppes, has become more than mere genealogical myth. It is an entire way of life: the kontusz coat, the szabla saber, the ornate karabela, the lavish hospitality, the fierce independence, and the conviction that the Commonwealth's noble democracy is the finest form of government ever conceived by man.\n\nSarmatist culture celebrates martial valor, personal honor, and the equality of all noblemen regardless of wealth. It produces magnificent art, architecture, and literature; the manor houses and churches of the countryside bear witness to its aesthetic ambitions. But critics warn that Sarmatism also breeds xenophobia, resistance to reform, and a dangerous complacency about the Commonwealth's growing vulnerabilities.\n\nWhether golden age or gilded cage, Sarmatism has become the defining identity of the Polish-Lithuanian nobility."
 nd_plc.6.a: "C'est qui nous sommes"
 nd_plc_union_heritage: "Patrimoine syndical"
 nd_plc_union_heritage_desc: "La tradition de coopération polono-lituanienne remonte au mariage de Jogaila et Jadwiga, liant les deux peuples contre les menaces communes."
 nd_plc_amber_trade: "Route de l'Ambre"
 nd_plc_amber_trade_desc: "Les anciennes routes commerciales qui transportaient l'ambre de la Baltique vers le sud de l'Europe ont enrichi les marchands du Commonwealth pendant des siècles."
 nd_plc_szlachta_traditions: "Traditions Szlachta"
 nd_plc_szlachta_traditions_desc: "La noblesse à cheval du Commonwealth combat comme une cavalerie, chaque noble comme un guerrier, chaque domaine comme une source de cavaliers."
 nd_plc_multi_faith_roots: "Racines multiconfessionnelles"
 nd_plc_multi_faith_roots_desc: "Depuis le Statut de Kalisz, les terres polono-lituaniennes offrent une protection aux communautés de toutes confessions."
 nd_plc_jagiellonian_learning: "Apprentissage jagellonien"
 nd_plc_jagiellonian_learning_desc: "L'Université Jagellonne de Cracovie, fondée en 1364, a produit Copernic et est devenue l'un des plus grands centres d'érudition d'Europe."
 nd_plc_folwark_economy: "Économie populaire"
 nd_plc_folwark_economy_desc: "Le système folklorique, des domaines agricoles appartenant à des nobles et exploités par des paysans liés, est devenu le moteur de la production céréalière du Commonwealth."
 nd_plc_sejmik_tradition: "Tradition Sejmik"
 nd_plc_sejmik_tradition_desc: "Les parlements provinciaux élisent des députés au Sejm national, donnant ainsi à chaque voïvodie une voix dans la gouvernance."
 nd_plc_pospolite_reforms: "Des réformes positives en Ruszenie"
 nd_plc_pospolite_reforms_desc: "La levée générale de la szlachta, chaque noble obligé de partir à la guerre, constitue la réserve militaire ultime du Commonwealth."
 nd_plc_magnate_courts: "Culture de la Cour des Magnats"
 nd_plc_magnate_courts_desc: "Les grandes familles de magnats entretiennent des cours rivalisant avec celles des rois mineurs, et patronnent les artistes, les musiciens et les érudits."
 nd_plc_pancerni_tradition: "Cavalerie Pancerni"
 nd_plc_pancerni_tradition_desc: "Les pancerni, cavalerie cosaque blindée, constituent l'épine dorsale des forces montées du Commonwealth, polyvalentes et nombreuses."
 nd_plc_wybraniecka_infantry: "Piechota Wybraniecka"
 nd_plc_wybraniecka_infantry_desc: "Infanterie sélectionnée et enrôlée dans les domaines de la couronne, les wybraniecka représentent la tentative du Commonwealth de construire une infanterie paysanne professionnelle."
 nd_plc_lipka_tatars: "Service tatar de Lipka"
 nd_plc_lipka_tatars_desc: "Les colons tatars musulmans, descendants des réfugiés de la Horde d'Or, servent le Commonwealth en tant qu'éclaireurs et pillards de cavalerie légère."
 nd_plc_vistula_trade: "Commerce des céréales de la Vistule"
 nd_plc_vistula_trade_desc: "Les céréales de l'intérieur descendent la Vistule jusqu'à Gdansk, où elles alimentent les villes d'Europe occidentale en échange d'argent et de produits manufacturés."
 nd_plc_tabor_defense: "Chariots de guerre du Tabor"
 nd_plc_tabor_defense_desc: "Les fortifications de chariots mobiles créent des défenses de terrain instantanées, transformant les plaines ouvertes en positions défensives contre les pillards des steppes."
 nd_plc_warsaw_confederation: "Confédération de Varsovie"
 nd_plc_warsaw_confederation_desc: "La déclaration de tolérance religieuse mutuelle de 1573, l'un des premiers actes de ce type dans l'histoire européenne, définit le Commonwealth comme un refuge pour les persécutés."
 nd_plc_lisowczycy_tradition: "Tradition Lisowczycy"
 nd_plc_lisowczycy_tradition_desc: "Cavalerie de pillards irrégulière qui combat sans solde, subvenant à ses besoins grâce au pillage. Craint dans toute l'Europe pour sa vitesse et sa férocité."
 nd_plc_magnate_fortifications: "Fortifications des Magnats"
 nd_plc_magnate_fortifications_desc: "Les grandes familles de magnats construisent des manoirs et des châteaux fortifiés sur leurs domaines, créant ainsi un réseau de points forts à travers le Commonwealth."
 nd_plc_elective_monarchy: "Monarchie élective"
 nd_plc_elective_monarchy_desc: "L'élection libre permet à tous les nobles de participer au choix du roi, attirant ainsi des candidats étrangers et l'attention diplomatique de toute l'Europe."
 nd_plc_gdansk_trade: "Domination commerciale de Gdansk"
 nd_plc_gdansk_trade_desc: "La grande ville portuaire de la Baltique contrôle l’exportation des céréales du Commonwealth vers l’Europe occidentale, canalisant d’énormes richesses via ses entrepôts."
 nd_plc_noble_democracy: "Noble démocratie"
 nd_plc_noble_democracy_desc: "Le liberum veto donne à chaque député noble le pouvoir d'arrêter la législation, un principe d'unanimité sacrée qui à la fois protège la liberté et invite à la paralysie."
 nd_plc_sarmatism: "Sarmatisme"
 nd_plc_sarmatism_desc: "La croyance selon laquelle les nobles polonais descendent d'anciens guerriers sarmates a produit une culture distinctive de valeur martiale, de somptuosité et d'indépendance farouche."
 nd_plc_refuge_of_nations: "Refuge des Nations"
 nd_plc_refuge_of_nations_desc: "The Commonwealth welcomes the persecuted of all faiths and nations (Jews, Armenians, Scots, Germans, Tatars), enriching its culture through diversity. Mennonites from the Low Countries are given the flood lands of the Vistula to dike and drain, and hold them as free tenants."
 nd_plc_dual_legal_system: "Double système juridique"
 nd_plc_dual_legal_system_desc: "La Pologne et la Lituanie maintiennent des codes juridiques et des tribunaux distincts, préservant ainsi l'identité distincte du Grand-Duché au sein du Commonwealth."
 nd_plc_may_constitution: "Constitution du Troisième Mai"
 nd_plc_may_constitution_desc: "La première constitution moderne d'Europe abolit le liberum veto, établit la séparation des pouvoirs et étend la citoyenneté à la bourgeoisie."
 nd_plc_national_uprising: "Esprit de soulèvement national"
 nd_plc_national_uprising_desc: "The spirit of Kościuszko, a people willing to fight for liberty against overwhelming odds, defines the Commonwealth's final, defiant chapter. At Racławice in 1794 peasants armed with scythes ran at the Russian batteries and took them."
 nd_plc_economic_reform: "Modernisation économique"
 nd_plc_economic_reform_desc: "Les réformes tardives du Commonwealth introduisent des produits manufacturés, améliorent les infrastructures et amorcent la transition d'une économie d'exportation purement agricole."
 nd_plc_unity_in_diversity: "L'unité dans la diversité"
 nd_plc_unity_in_diversity_desc: "La plus grande force du Commonwealth a toujours été sa capacité à unir les Polonais, les Lituaniens, les Ruthènes, les Allemands, les Juifs, les Tatars et les Arméniens sous une même bannière."
 a_nd_plc_pancerni: "Pancernis"
 a_nd_plc_pancerni_desc: "Cavalerie blindée moyenne, l'épine dorsale des forces montées du Commonwealth. Plus nombreux et polyvalents que les hussards, les pancerni remplissent tous les rôles, de la reconnaissance à la poursuite."
 a_nd_plc_lisowczycy: "Lisowczycy"
 a_nd_plc_lisowczycy_desc: "Cavalerie de pillards irrégulière qui combat sans solde, subvenant à ses besoins grâce au pillage. Nommés en hommage à Aleksander Jzef Lisowski, ces « cavaliers peints » étaient redoutés dans toute l'Europe."
 a_nd_plc_lisowczycy_levy: "Prélèvement Lisowczycy"
 a_nd_plc_lisowczycy_levy_desc: "Cavalerie irrégulière élevée par des nobles dans la tradition Lisowczycy, rapide, agressive et autonome grâce au pillage."
 a_nd_plc_wybraniecka: "Piechota Wybraniecka"
 a_nd_plc_wybraniecka_desc: "Infanterie sélectionnée enrôlée dans chaque vingtième maison paysanne des domaines de la couronne. L'une des premières tentatives de création d'une infanterie professionnelle permanente dans le Commonwealth."
 a_nd_plc_wybraniecka_levy: "Piechota Wybraniecka Levy"
 a_nd_plc_wybraniecka_levy_desc: "Infanterie paysanne élevée selon le système de sélection des domaines de la couronne, équipée d'armes à feu et entraînée au combat en formation."
 a_nd_plc_pospolite: "Pospolite Ruszenie"
 a_nd_plc_pospolite_desc: "Le prélèvement général de la noblesse szlachta, chaque noble obligé de partir à la guerre pour défendre le Commonwealth. Nombreux mais mal coordonnés."
 a_nd_plc_lipka_tatar: "Cavalerie tatare Lipka"
 a_nd_plc_lipka_tatar_desc: "Des colons tatars musulmans qui ont servi le Commonwealth pendant des générations en tant qu'éclaireurs de cavalerie légère. Descendant des réfugiés de la Horde d'Or, ils ont obtenu des terres en Lituanie."
 a_nd_plc_tabor: "Chariot de guerre Tabor"
 a_nd_plc_tabor_desc: "Fortifications de wagons mobiles qui peuvent être enchaînées pour créer des défenses de champ instantanées. Inspiré des tabors hussites, adapté pour les plaines ouvertes du Commonwealth."
 a_nd_plc_kosynierzy: "Kosynierzy"
 a_nd_plc_kosynierzy_desc: "Peasant volunteers carrying scythes with the blade reset upright on the shaft. They have no muskets and little drill, and they close with the enemy at a run."
 nd_plc_oledry: "Olędry"
 nd_plc_oledry_desc: "A village settled under Hollander law. Its people are free tenants who pay a money rent, owe no labour on the lord's fields, and keep the dikes and ditches that turn river marsh into meadow."
 nd_plc_folwark: "Folklore"
 nd_plc_folwark_desc: "Un domaine agricole appartenant à des nobles produisant des céréales destinées à l'exportation. Le système traditionnel est le moteur de l'économie céréalière du Commonwealth mais lie les paysans à la terre."
 nd_plc_sejmik_hall: "Salle Sejmik"
 nd_plc_sejmik_hall_desc: "Siège du parlement provincial où la noblesse locale débat, élit les députés au Sejm national et exerce un véritable pouvoir politique."
 nd_plc_zamek: "Zamek Magnacki"
 nd_plc_zamek_desc: "Un manoir de magnat fortifié alliant grandeur résidentielle et fonction militaire. Ces points forts ancrent le réseau défensif du Commonwealth."
 nd_plc_akademia: "Académie"
 nd_plc_akademia_desc: "Une université ou une académie de tradition jagellonne, faisant progresser l'apprentissage dans les arts libéraux, le droit, la médecine et les sciences naturelles."
 nd_plc_amber_workshop: "Kontor Bursztynu"
 nd_plc_amber_workshop_desc: "Un atelier de transformation de l'ambre où l'ambre brut de la Baltique est sculpté, poli et préparé pour la vente le long des anciennes routes commerciales."
 nd_plc_spichrz: "Spichrz Gdanski"
 nd_plc_spichrz_desc: "Un entrepôt de céréales de la Baltique où le blé et le seigle du Commonwealth sont stockés, classés et chargés sur des navires à destination des marchés d'Europe occidentale."
 nd_plc_manufaktura: "Fabrication"
 nd_plc_manufaktura_desc: "Un atelier industriel produisant des produits manufacturés, représentant la transition tardive du Commonwealth de l'exportation agricole vers une économie diversifiée."
 nd_plc_oledry_upkeep: "Dike Keeping"
 nd_plc_oledry_upkeep_desc: "Clay for the dikes, timber for sluices and piling, and tools for the ditching that every household owes the village each spring."
 nd_plc_folwark_maintenance: "Culture des céréales"
 nd_plc_folwark_maintenance_desc: "Le bois pour les bâtiments du domaine et le bétail pour la main-d'œuvre donnent des récoltes de céréales destinées à l'exportation le long de la Vistule."
 nd_plc_sejmik_upkeep: "Administration de Sejmik"
 nd_plc_sejmik_upkeep_desc: "La tenue des archives, de la correspondance et des documents officiels de la gouvernance provinciale nécessite du papier, des tissus fins pour les cérémonies et des livres de droit."
 nd_plc_zamek_maintenance: "Garnison de Zamek"
 nd_plc_zamek_maintenance_desc: "La pierre pour les murs, le bois pour les réparations et les armes pour la garnison maintiennent l'état de préparation de la forteresse du magnat."
 nd_plc_akademia_upkeep: "Dotation académique"
 nd_plc_akademia_upkeep_desc: "Le papier pour les manuscrits, les livres pour la bibliothèque et le verre pour les lentilles et l'équipement soutiennent les activités scientifiques de l'académie."
 nd_plc_amber_processing: "Traitement de l'ambre"
 nd_plc_amber_processing_desc: "L'ambre de la Baltique est sculpté et poli pour fabriquer des bijoux et des objets décoratifs destinés à l'exportation le long des anciennes routes commerciales."
 nd_plc_spichrz_operations: "Opérations de stockage des céréales"
 nd_plc_spichrz_operations_desc: "Le blé et le bois circulent dans l'entrepôt pour être classés et stockés ; le sel préserve les céréales pendant le long voyage en mer vers les marchés occidentaux."
 nd_plc_manufaktura_operations: "Opérations de fabrication"
 nd_plc_manufaktura_operations_desc: "Le fer est forgé et le tissu est transformé en outils et en instruments destinés aux marchés intérieurs et d'exportation."
 levy_nd_plc_kosynierzy: "Kosynierzy"
 levy_nd_plc_kosynierzy_desc: "Peasants called out with their scythes for the national rising."
 levy_nd_plc_lipka_tatar: "Cavalerie tatare Lipka"
 levy_nd_plc_lipka_tatar_desc: "Cavalerie légère tatare musulmane issue des communautés de colons de Lituanie."
 levy_nd_plc_lisowczycy: "Lisowczycy"
 levy_nd_plc_lisowczycy_desc: "Cavalerie noble irrégulière dans la tradition des cavaliers peints."
 levy_nd_plc_wybraniecka: "Piechota Wybraniecka"
 levy_nd_plc_wybraniecka_desc: "Infanterie paysanne sélectionnée enrôlée dans les domaines de la couronne."
 levy_nd_plc_pospolite: "Pospolite Ruszenie"
 levy_nd_plc_pospolite_desc: "Le prélèvement général de la noblesse szlachta partant à la guerre."
 nd_plc_formed_tt: "La Pologne-Lituanie a été formée"
 nd_plc_path_a_tt: "Choisissez la Liberté Dorée"
 nd_plc_path_b_tt: "Choisissez l’Union Jagellonne"
 nd_plc_destiny: "Destin du Commonwealth"
 nd_plc_destiny_desc: "La Rzeczpospolita a été proclamée. Qu’il s’agisse de la liberté dorée ou de la puissance dynastique, la voie à suivre est désormais ouverte."
 nd_plc_dest_sejm_ascendant: "L'ascendant au Sejm"
 nd_plc_dest_sejm_ascendant_desc: "Sécurisez le grand port de Gdansk pour ancrer le commerce des céréales, établissez des institutions financières via le système bancaire et remplissez le trésor du Commonwealth. La noble république a besoin à la fois de commerce et de monnaie."
 nd_plc_dest_breadbasket: "Le grenier de l'Europe"
 nd_plc_dest_breadbasket_desc: "Develop the Commonwealth into the granary that feeds Western Europe. Gdansk, the port the grain leaves through, is to be built up into a great city, the treasury filled, and wheat kept flowing through the capital's markets."
 nd_plc_dest_gdansk_developed_tt: "We own #bold Gdansk#! and its development is at least #bold 39#!"
 nd_plc_dest_republic_of_nations: "République des Nations"
 nd_plc_dest_republic_of_nations_desc: "Bring the Commonwealth to its fullest expression: an enlightened republic of many peoples, rich in learning, prosperous in trade, and governed by the most advanced constitution in Europe. Warsaw, once a Mazovian river town, is to be built up into a capital worthy of the Sejm that sits there."
 nd_plc_dest_warsaw_developed_tt: "We own #bold Warsaw#! and its development is at least #bold 42#!"
 nd_plc_dest_eastern_march: "La marche de l'Est"
 nd_plc_dest_eastern_march_desc: "Seize the great cities of the Ruthenian and Russian borderlands. Smolensk, Chernihiv and Kyiv must fall under Commonwealth control to secure the dynasty's eastern frontier."
 nd_plc_dest_black_sea_reach: "Portée de la mer Noire"
 nd_plc_dest_black_sea_reach_desc: "Push south through Podolia to the shores of the Black Sea. Take the Crimean port of Kaffa and the fortress of Kamianets-Podilskyi, and let the magnates raise four strongholds, to command the steppe frontier."
 nd_plc_dest_zamek_4_tt: "A #bold Zamek Magnacki#! stands in at least #bold 4#! of our locations"
 nd_plc_dest_zamek_8_tt: "A #bold Zamek Magnacki#! stands in at least #bold 8#! of our locations"
 nd_plc_dest_bulwark_of_christendom: "Rempart de la chrétienté"
 nd_plc_dest_bulwark_of_christendom_desc: "The Commonwealth stands as Europe's shield against east and south alike. Take Moscow and Constantinople to prove that the Jagiellonian legacy has no equal on the continent. The szlachta must first hold themselves the rampart of the faith, as Sarmatism teaches, and eight magnate strongholds must stand behind the word."
 nd_plc.7.t: "Le destin du Commonwealth"
 nd_plc.7.d: "The Commonwealth stands at the crossroads of Europe. To the west, the markets of Amsterdam and London hunger for our grain. To the east, the endless steppe stretches toward Muscovy and the Ottoman domains. The choices we make now will determine whether the Rzeczpospolita becomes a beacon of liberty or a colossus of conquest.\n\nThe foundations are laid. The Commonwealth is stable and strong. What manner of nation shall we build upon them?"
 nd_plc.7.a: "Notre destin attend"
 nd_plc.8.t: "Le Sejm se lève"
 nd_plc.8.d: "The great port of Gdansk is ours, and with it the key to the Baltic grain trade. The revenues of commerce flow into the Republic's coffers, and the szlachta celebrate the wisdom of their golden liberty. With banking institutions established and the treasury secure, the noble republic proves that freedom and prosperity are not contradictions.\n\nThe deputies of the Sejm speak with newfound confidence: the Commonwealth needs no despot to thrive. The voice of the nobility, raised in deliberation and consensus, shall guide this nation to greatness."
 nd_plc.8.a: "Que le Sejm gouverne avec sagesse"
 nd_plc.9.t: "Le grenier de l'Ouest"
 nd_plc.9.d: "From the folwarks of the interior to the warehouses of the Baltic ports, the Commonwealth has become indispensable to Europe. Our wheat feeds the cities of the West; our amber adorns their courts; our timber builds their ships. The Vistula is liquid gold, and we control every bend.\n\nBut how shall we wield this wealth? Some argue for maritime dominance, controlling the sea lanes and port facilities that carry our grain to foreign markets. Others advocate for noble entrepreneurship, investing in estates, mills, and workshops to build a diversified economy that does not depend solely on the harvest."
 nd_plc.9.a: "Contrôlez les routes commerciales de la Baltique"
 nd_plc.9.b: "Investissez dans les domaines et les ateliers"
 nd_plc.10.t: "Une République sans égal"
 nd_plc.10.d: "What the philosophers of Paris and Edinburgh theorize, the Commonwealth has built. A republic of many nations, Poles, Lithuanians, Ruthenians, Germans, Jews, Tatars, Armenians, governed by law, enriched by trade, and illuminated by the light of reason. The Constitution has abolished the liberum veto; the Komisja Edukacji Narodowej has created Europe's first ministry of education; the universities flourish.\n\nThe Republic of Both Nations has become the Republic of All Nations. But what form shall this enlightened governance take? The civic radicals demand universal rights, open borders, and the sovereignty of reason. The constitutional conservatives prefer to anchor reform in the traditions of the szlachta, preserving noble privilege while modernizing the state."
 nd_plc.10.a: "Éveil civique pour tous les peuples"
 nd_plc.10.b: "La réforme dans la noble tradition"
 nd_plc.11.t: "La marche de l’Est sécurisée"
 nd_plc.11.d: "The banners of the Commonwealth fly over Smolensk and Kyiv. The eastern march, that vast, contested borderland where Latin and Orthodox Christendom meet, is now firmly in Jagiellonian hands. The fortresses of the Dnieper stand garrisoned with Commonwealth troops, and the trade routes of the Ruthenian lands flow toward Krakow and Warsaw rather than Moscow.\n\nThis is no mere conquest. It is the fulfillment of the Jagiellonian vision: a dynasty state that stretches from the Baltic to the heartland of the Rus, binding together peoples who share a frontier and a faith, or at least a willingness to coexist under one crown."
 nd_plc.11.a: "La portée de la dynastie s'étend toujours plus vers l'est"
 nd_plc.12.t: "La mer Noire s'ouvre"
 nd_plc.12.d: "The Commonwealth has broken through to the Black Sea. The fortress of Kamianets-Podilskyi, that legendary bastion on the Smotrych River, guards our southern frontier, while the port of Kaffa opens trade routes to the Orient. The Crimean Khanate's dominion over the steppe has been shattered.\n\nBut holding this frontier requires a strategy. Some advocate for a permanent military frontier, fortified lines, professional garrison troops, and scorched-earth tactics to deter raiders. Others argue for alliance with the Cossack hosts who know the steppe, offering them privileges and autonomy in exchange for service as the Commonwealth's shield."
 nd_plc.12.a: "Construire la frontière fortifiée"
 nd_plc.12.b: "Gagnez les Cosaques à notre cause"
 nd_plc.13.t: "Christianitatis antemurale"
 nd_plc.13.d: "Moscow has fallen. Constantinople is ours. The Commonwealth, the Antemurale Christianitatis, the Bulwark of Christendom, has achieved what crusaders, emperors, and tsars could only dream of. From the Baltic to the Bosporus, from the Oder to the Volga, the Jagiellonian eagle casts its shadow over half of Europe.\n\nThis is a moment that will echo through the centuries. The Commonwealth can become the eternal defender of European civilization, a military power so formidable that no eastern horde or southern empire will ever threaten Christendom again. Or it can use this unprecedented position to project the Jagiellonian dynasty as the first family of Europe, claiming a continental hegemony that no state has held since Rome."
 nd_plc.13.a: "Nous sommes le bouclier éternel de la chrétienté"
 nd_plc.13.b: "L'empire Jagellonne perdurera"
 STATIC_MODIFIER_NAME_nd_plc_dest_vistula_dominance: "Domination commerciale de la Vistule"
 STATIC_MODIFIER_DESC_nd_plc_dest_vistula_dominance: "Le Commonwealth contrôle le corridor céréalier de la Baltique, du champ au port, contrôlant ainsi le commerce qui alimente l’Europe occidentale."
 STATIC_MODIFIER_NAME_nd_plc_dest_noble_enterprise: "Entreprise noble"
 STATIC_MODIFIER_DESC_nd_plc_dest_noble_enterprise: "Les szlachta investissent leurs bénéfices céréaliers dans des domaines, des moulins et des ateliers, diversifiant ainsi l'économie du Commonwealth au-delà des exportations de matières premières."
 STATIC_MODIFIER_NAME_nd_plc_dest_civic_enlightenment: "Illumination civique"
 STATIC_MODIFIER_DESC_nd_plc_dest_civic_enlightenment: "Le Commonwealth adhère aux valeurs civiques universelles, à une gouvernance ouverte, à des citoyens instruits et à la souveraineté de la raison sur la tradition."
 STATIC_MODIFIER_NAME_nd_plc_dest_noble_constitution: "Noble Constitution"
 STATIC_MODIFIER_DESC_nd_plc_dest_noble_constitution: "Reform anchored in szlachta tradition: the noble republic modernizes its institutions while preserving the privileges that make it unique. The nobility is taxed by its own vote."
 STATIC_MODIFIER_NAME_nd_plc_dest_steppe_frontier: "Frontière des steppes"
 STATIC_MODIFIER_DESC_nd_plc_dest_steppe_frontier: "Une frontière militaire permanente composée de forts et de garnisons protège la côte de la mer Noire contre les pillards et les empires rivaux."
 STATIC_MODIFIER_NAME_nd_plc_dest_cossack_alliance: "Alliance cosaque"
 STATIC_MODIFIER_DESC_nd_plc_dest_cossack_alliance: "Les hôtes cosaques servent d'avant-garde de cavalerie du Commonwealth dans la steppe, échangeant leurs compétences martiales contre de l'autonomie et des privilèges."
 STATIC_MODIFIER_NAME_nd_plc_dest_antemurale: "Christianitatis antemurale"
 STATIC_MODIFIER_DESC_nd_plc_dest_antemurale: "Le Commonwealth constitue le bouclier éternel de la chrétienté, un bastion militaire si redoutable qu'aucune puissance de l'Est ou du Sud ne peut menacer l'Europe."
 STATIC_MODIFIER_NAME_nd_plc_dest_jagiellonian_imperium: "Impérial Jagellonien"
 STATIC_MODIFIER_DESC_nd_plc_dest_jagiellonian_imperium: "La dynastie Jagellonne revendique l'hégémonie continentale, projetant la puissance du Commonwealth de la Baltique jusqu'au Bosphore."
 nd_plc_sejm_walny: "Sejm Walny"
 nd_plc_sejm_walny_desc: "Le parlement souverain de la République des Deux Nations, où les députés de chaque voïvodie délibèrent sur les lois qui régissent le Commonwealth."
 nd_plc_hetman_arsenal: "Hetman-Arsenal"
 nd_plc_hetman_arsenal_desc: "Le dépôt militaire central de l'armée du Commonwealth, où les forces du Grand Hetman sont équipées, approvisionnées et entraînées pour la défense de la chrétienté."
 nd_plc_sejm_walny_upkeep: "Administration parlementaire"
 nd_plc_sejm_walny_upkeep_desc: "Le papier pour la législation, les tissus fins pour les cérémonies, les livres de droit pour référence et le mobilier pour les chambres de délibération soutiennent le travail du Sejm."
 nd_plc_hetman_arsenal_upkeep: "Opérations d'Arsenal"
 nd_plc_hetman_arsenal_upkeep_desc: "Les armes sont forgées, les murs entretenus avec de la pierre et du bois, et le fer transformé en armures et en instruments pour les armées du Commonwealth."

 # ===== BUREAUCRACY AUTHORITY (auto_modifier slot grant) =====
 AUTO_MODIFIER_NAME_nd_plc_bureaucracy_authority: "République des deux nations"
 AUTO_MODIFIER_DESC_nd_plc_bureaucracy_authority: "L’Union de Lublin a fusionné le tissu institutionnel de la Couronne et du Grand-Duché en une seule Rzeczpospolita : une république fédérale de la szlachta dont les chambres, tribunaux et bureaux gouvernent de la Baltique au Dniepr. Grâce à ces institutions, la noblesse du Commonwealth exerce le pouvoir autrefois détenu par les rois."

 # ===== BUREAUCRACIES =====
 plc_sejm_walny_bureaucracy: "Sejm Walny"
 plc_sejm_walny_bureaucracy_desc: "Créé par l'Union de Lublin en 1569, le Sejm général de la République des Deux Nations comptait 167 députés dans sa Chambre basse, élus par 70 sejmiks des voïvodies de la couronne de Pologne et du Grand-Duché de Lituanie. Siégeant habituellement une fois tous les deux ans pendant six semaines, le Sejm a adopté des lois contraignantes, ratifié des traités et approuvé des taxes de guerre. Sa forme bicamérale (des envoyés débattant au-dessous du Sénat) a donné aux szlachta des deux nations une voix législative unifiée."

 plc_senat_rzeczypospolitej_bureaucracy: "Sénat Rzeczypospolitej"
 plc_senat_rzeczypospolitej_bureaucracy_desc: "The upper chamber of the Sejm, comprising the realm's bishops, voivodes, castellans, and Crown ministers, some 140 lifetime seats drawn almost entirely from the magnate dynasties whose latifundia eclipsed royal estates. Resident senators sat permanently at the king's side between sejms, advising on every executive act. Through the Senate the Radziwill, Zamoyski, Ostrogski, and Sapieha houses translated their landed wealth into permanent constitutional authority."

 plc_pacta_conventa_bureaucracy: "Pacta Conventa"
 plc_pacta_conventa_bureaucracy_desc: "À partir de l'élection d'Henri de Valois en 1573, chaque monarque du Commonwealth a juré de signer un contrat d'obligations personnalisé - la pacta conventa - parallèlement aux articles constitutionnels henriciens permanents. Chaque roi élu promettait des actes précis (un mariage à l'étranger, le paiement des dettes royales, des frontières défendues) et reconnaissait le droit de résistance armée de la szlachta, le rokosz, en cas de rupture de son serment. L'institution a rendu la royauté polonaise contractuelle plutôt que dynastique."

 plc_hetmanate_bureaucracy: "Hetmanate"
 plc_hetmanate_bureaucracy_desc: "Quatre postes à vie (le Grand Crown Hetman, le Field Crown Hetman et leurs homologues lituaniens) assumaient le commandement suprême de l'armée permanente du Commonwealth. À partir de 1585, un hetman ne pouvait être démis de ses fonctions que sous l'accusation de trahison avérée; à partir de 1590, ses ordonnances militaires avaient le même poids juridique que la législation du Sejm. Les hetmans entretenaient leurs propres envoyés auprès de la Porte, des Tatars et de la Moscovie et allouaient leurs budgets militaires sans ingérence royale."

 plc_trybunal_koronny_bureaucracy: "Trybunal Koronny"
 plc_trybunal_koronny_bureaucracy_desc: "Le roi Stefan Batory a créé le Crown Tribunal en 1578 pour décharger la cour royale des appels judiciaires ; le Tribunal lituanien suivit à Wilno en 1581. Vingt-sept députés laïcs élus chaque année par les sejmiks, plus six députés ecclésiastiques choisis par les chapitres de la cathédrale, siégèrent à tour de rôle à Piotrkow et Lublin pour rendre le jugement final sur les affaires de szlachta. En dépouillant le roi de sa juridiction d'appel, les tribunaux plaçaient le droit de la noblesse entre les mains de la noblesse elle-même."

 plc_kozak_rejestrowy_bureaucracy: "Kozak Rejestrowy"
 plc_kozak_rejestrowy_bureaucracy_desc: "Sigismond II Auguste enrôla pour la première fois les Cosaques dans un registre d'État en 1572, et Stefan Batory étendit le système en un corps frontalier de cavalerie rémunérée tenant les Champs Sauvages contre les Tatars et les Moscovites. Les cosaques enregistrés étaient exonérés d'impôts, obtenaient un régime foncier et permettaient l'autonomie gouvernementale sous la direction d'une starhyna nommée. L'institution s'est effondrée en 1648 lorsque le refus de la Couronne d'élargir le registre au-delà de vingt mille a déclenché le soulèvement de Khmelnytsky et la perte de l'Ukraine de la rive gauche."

 plc_liberum_veto_bureaucracy: "Liberum de veto"
 plc_liberum_veto_bureaucracy_desc: "On 9 March 1652 the Trakai deputy Wladyslaw Sicinski cried Nie pozwalam! (I do not allow it) and walked out of the Sejm chamber, dissolving the session before its statutory term expired. From that precedent grew the doctrine that a single envoy's protest could nullify every act of an entire Sejm. Founded on the equality of every nobleman, the veto became by the eighteenth century the instrument by which Russian, Prussian, and French ambassadors bought the paralysis of every reform."
