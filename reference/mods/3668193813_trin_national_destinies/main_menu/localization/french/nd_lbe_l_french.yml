l_french:
 STATIC_MODIFIER_NAME_nd_divine_authority_of_the_mulopwe: "Autorité divine des Mulopwe"
 STATIC_MODIFIER_DESC_nd_divine_authority_of_the_mulopwe: "Le roi sacré règne comme une divinité vivante dont la parole fait loi. Grâce à un mandat divin et une volonté de fer, les Mulopwe exigent une loyauté absolue de la part des rois de leur clan Balopwe, extrayant un tribut et imposant l'obéissance à travers la savane."
 STATIC_MODIFIER_NAME_nd_wisdom_of_the_bambudye: "Sagesse des Bambudye"
 STATIC_MODIFIER_DESC_nd_wisdom_of_the_bambudye: "Le conseil de Bambudye guide l'État grâce aux connaissances accumulées encodées dans les cartes mémoire Lukasa. Aucun dirigeant ne peut agir sans leurs conseils, et aucun chef ne peut occuper un poste sans maîtriser au préalable les enseignements de la société. Cette résilience institutionnelle a permis aux Luba d’absorber des peuples étrangers et de survivre à des crises de succession qui auraient fait éclater des royaumes inférieurs."
 STATIC_MODIFIER_NAME_nd_lbe_copper_cross_economy: "Économie croisée du cuivre"
 STATIC_MODIFIER_DESC_nd_lbe_copper_cross_economy: "Les lingots de cuivre distinctifs en forme de croix des Luba sont devenus la monnaie du commerce d'Afrique centrale, acceptée depuis les forêts du Congo jusqu'aux rives de l'océan Indien."
 STATIC_MODIFIER_NAME_nd_lbe_tributary_hegemony: "Hégémonie tributaire"
 STATIC_MODIFIER_DESC_nd_lbe_tributary_hegemony: "Plutôt que de frapper de la monnaie, l’État Luba a canalisé sa richesse en cuivre vers la construction d’un vaste réseau d’affluents. Les peuples assujettis fournissent de la main-d'œuvre et des ressources en échange de la protection et du prestige de l'autorité des Mulopwe."
 nd_lbe.1.t: "La fondation de l'empire Luba"
 nd_lbe.1.d: "The marshy grasslands of the Upemba Depression have given rise to something extraordinary. From the lakeshores where our ancestors fished and smelted iron, from the copper-rich hills where our smiths forge the distinctive cross-shaped ingots that serve as currency across central Africa, a great kingdom has emerged. The descendants of Kalala Ilunga, the mythical hunter who overthrew the tyrant Kongolo Mwamba, now rule from Mwibele over a realm of diverse peoples bound by shared institutions.\n\nBut two visions compete for the soul of this new empire. The Mulopwe sits enthroned as a living deity, his authority absolute and sacred, yet beside him stands the Bambudye council, guardians of the lukasa memory boards, with the power to check, counsel, and even depose a king who abuses his mandate. Will the Luba Empire be forged through the divine fire of royal authority, or built upon the enduring wisdom of its institutions?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_lbe.1.a: "La parole des Mulopwe fait loi ; notre roi divin règnera sans contestation."
 nd_lbe.1.b: "Le Bambudye nous guidera. Aucun roi ne règne sans la sagesse du conseil."
 nd_lbe.2.t: "L'étalon de la Croix de Cuivre"
 nd_lbe.2.d: "Nos forgerons ont perfectionné l’art de couler les lingots de cuivre en forme de croix distinctifs connus sous le nom de handa. Pesant de quelques grammes à plus d'un kilogramme, ces croix sont devenues la monnaie standard non seulement de nos marchés mais aussi des réseaux commerciaux s'étendant des forêts équatoriales au Zambèze. Les marchands Songye troquent du tissu de raphia contre notre cuivre ; les commerçants de l’Est apportent des coquillages et des perles. La question qui se pose à nous est de savoir comment tirer parti de cette suprématie monétaire : allons-nous accroître notre production de cuivre pour dominer le commerce régional, ou utiliser notre puissance économique pour lier davantage de peuples à notre réseau affluent ?"
 nd_lbe.2.a: "Développer le commerce du cuivre. Laissez la main circuler sur tous les marchés."
 nd_lbe.2.b: "Lier plus d'affluents ; le cuivre achète de la fidélité, pas seulement des biens."
 nd_lbe.3.t: "Les gardiens du Lukasa"
 nd_lbe.3.d: "The Bambudye society has reached a new level of sophistication. Their memory boards, the lukasa, are masterworks of encoded knowledge. Court historians known as bana balute run their fingertips across surfaces studded with beads and shells, each cluster representing a king, a migration, a law, or a sacred site. Three types of lukasa now exist: the lukasa lwa nkunda recording mythical heroes and migration routes, the lukasa lwa kabemba organizing the Mbudye society itself, and secret boards created for individual rulers containing knowledge too dangerous for common ears.\n\nNo candidate for political office may receive their title without first becoming a member of the Bambudye. The society serves as living constitution, historical archive, and check on royal power, all encoded in boards small enough to hold in one hand."
 nd_lbe.3.a: "La mémoire des Luba perdurera à travers tous les âges."
 nd_lbe.4.t: "La diffusion du modèle Balopwe"
 nd_lbe.4.d: "The Luba system of sacred kingship has proven so effective that neighboring peoples have adopted it wholesale. The Lunda kingdom, our most powerful offshoot, has carried the balopwe model of governance across a vast swathe of central Africa, from northern Angola to northwestern Zambia. Foreign leaders and governments are incorporated through the flexible system of clan kingship, where loyalty to the Mulopwe and membership in the Bambudye creates bonds stronger than ethnicity or language.\n\nThis is the true genius of Luba statecraft: a government durable enough to withstand succession disputes, yet flexible enough to absorb entire foreign polities. The balopwe model is not merely a form of rule: it is an idea, spreading like fire across the savanna."
 nd_lbe.4.a: "Notre modèle de gouvernance sera la norme de l’Afrique centrale."
 nd_lbe.5.t: "Défenseurs du Heartland"
 nd_lbe.5.d: "Les puissances étrangères ont jeté leur dévolu sur les richesses de notre ceinture de cuivre et sur le travail de notre peuple. Mais les guerriers du cœur du pays Luba connaissent chaque chemin à travers les zones humides de l'Upemba, chaque gué traversant le Lualaba, chaque position défensive dans les collines de la savane. Ce que les étrangers considèrent comme une brousse impénétrable, nos soldats y vivent. Les Mulopwe ont appelé les sociétés guerrières à organiser une défense qui transforme le paysage lui-même en une arme, un terrain hostile, des lignes d'approvisionnement tendues et la résistance implacable d'un peuple luttant pour sa patrie sacrée."
 nd_lbe.5.a: "Le cœur du pays ne tombera pas."
 nd_lbe_upemba_ironworking: "Travail du fer à Upemba"
 nd_lbe_upemba_ironworking_desc: "Les traditions de travail du fer de la dépression d'Upemba, affinées au fil des siècles d'habitation continue, produisent des armes et des outils d'une qualité exceptionnelle."
 nd_lbe_kilolo_administration: "Administration de Kilolo"
 nd_lbe_kilolo_administration_desc: "Les chefs de village connus sous le nom de Kilolo gèrent les affaires locales, collectent les tributs et entretiennent des greniers qui soutiennent la population pendant les saisons creuses."
 nd_lbe_kisalian_lake_fishing: "Pêche au lac Kisalian"
 nd_lbe_kisalian_lake_fishing_desc: "Les communautés de pêcheurs organisées des lacs Upemba, héritières de l’ancienne tradition kisalienne, fournissent un excédent alimentaire fiable qui soutient la croissance urbaine."
 nd_lbe_palm_oil_trade: "Commerce de l'huile de palme"
 nd_lbe_palm_oil_trade_desc: "Every village keeps its grove of palms. They are pressed for oil, used for cooking, lighting, and trade across central Africa, tapped for wine, and stripped for raffia.\n\n#italic Available in: $nd_lbe_palm_grove$#!"
 nd_lbe_ancestral_spirit_tradition: "Tradition de l'esprit ancestral"
 nd_lbe_ancestral_spirit_tradition_desc: "La vénération des esprits ancestraux fournit un cadre religieux commun qui lie les diverses communautés Luba à travers la savane."
 nd_lbe_lineage_chiefs: "Chefs de lignée"
 nd_lbe_lineage_chiefs_desc: "Le système de gouvernance par les chefs de lignage crée une hiérarchie durable qui peut intégrer de nouveaux peuples tout en maintenant l'ordre."
 nd_lbe_savanna_oral_tradition: "Tradition orale de la savane"
 nd_lbe_savanna_oral_tradition_desc: "Les riches traditions orales de la savane Luba préservent les généalogies, les précédents juridiques et les connaissances culturelles à travers les générations."
 nd_lbe_balopwe_royal_institution: "Institution royale Balopwe"
 nd_lbe_balopwe_royal_institution_desc: "L'institution sacrée des Balopwe, rois de clan qui servent d'intermédiaires entre le divin Mulopwe et le peuple, constitue l'épine dorsale du pouvoir militaire et politique Luba."
 nd_lbe_bambudye_knowledge_tradition: "Tradition du savoir Bambudye"
 nd_lbe_bambudye_knowledge_tradition_desc: "La société secrète Bambudye, gardienne des cartes mémoires lukasa, préserve et transmet les connaissances accumulées sur l'État Luba."
 nd_lbe_copper_cross_currency: "Monnaie de la Croix de Cuivre"
 nd_lbe_copper_cross_currency_desc: "The distinctive cross-shaped copper ingots cast by Luba smiths serve as currency across central African trade networks.\n\n#italic Available in: $nd_lbe_copper_smithy$#!"
 nd_lbe_divine_kingship_shrines: "Sanctuaires de la royauté divine"
 nd_lbe_divine_kingship_shrines_desc: "Les Mulopwe décédés deviennent des divinités et leurs anciennes capitales se transforment en sanctuaires vivants qui sanctifient le paysage et légitiment l'autorité royale."
 nd_lbe_kalala_ilunga_legacy: "L'héritage de Kalala Ilunga"
 nd_lbe_kalala_ilunga_legacy_desc: "Tous les dirigeants des Luba font remonter leur ascendance à Kalala Ilunga, le chasseur mythique qui renversa Kongolo Mwamba et introduisit le forgeage du fer avancé et les pratiques politiques royales."
 nd_lbe_court_of_the_mulopwe: "Cour des Mulopwe"
 nd_lbe_court_of_the_mulopwe_desc: "La cour des Mulopwe à Mwibele constitue le cœur politique et culturel de l'empire, où divers peuples font cause commune sous la royauté sacrée."
 nd_lbe_tributary_expansion: "Expansion des affluents"
 nd_lbe_tributary_expansion_desc: "Les armées Luba ciblent les régions à forte densité de population pour extraire un tribut, élargissant ainsi la portée et les réserves militaires de l'empire."
 nd_lbe_twite_military_reform: "Réforme militaire Twite"
 nd_lbe_twite_military_reform_desc: "Le twite, le chef militaire des Mulopwe, réorganise les armées provinciales en une force plus professionnelle, capable de mener des campagnes soutenues."
 nd_lbe_copper_salt_routes: "Routes du cuivre et du sel"
 nd_lbe_copper_salt_routes_desc: "Control of the vital trade routes linking copper mines, salt sources, and agricultural regions consolidates Luba economic power."
 nd_lbe_katanga_salt_control: "Contrôle du sel du Katanga"
 nd_lbe_katanga_salt_control_desc: "The salt marshes of the southern territories become a critical state monopoly, driving both economic growth and political competition.\n\n#italic Available in: $nd_lbe_salt_works$#!"
 nd_lbe_raffia_textile_industry: "Industrie textile du raphia"
 nd_lbe_raffia_textile_industry_desc: "The weaving of raffia palm fibers into cloth creates a major export commodity, traded to the Songye and other neighboring peoples.\n\n#italic Available in: $nd_lbe_palm_grove$#!"
 nd_lbe_inabanza_regalia: "Inabanza Regalia"
 nd_lbe_inabanza_regalia_desc: "L'inabanza, gardienne des emblèmes royaux, entretient les insignes sacrés, notamment les doubles cloches de fer qui symbolisent la maîtrise de la métallurgie et de l'art politique des Mulopwe."
 nd_lbe_mbudye_council_expansion: "Expansion du Conseil de Mbudye"
 nd_lbe_mbudye_council_expansion_desc: "Le conseil de Mbudye étend sa surveillance à davantage d’aspects de la gouvernance, assurant ainsi une stabilité institutionnelle qui transcende les dirigeants individuels."
 nd_lbe_lualaba_river_network: "Réseau fluvial Lualaba"
 nd_lbe_lualaba_river_network_desc: "La rivière Lualaba et ses affluents servent d'autoroutes à l'empire, transportant des marchandises commerciales, des tributs et des informations entre le cœur du pays et les provinces lointaines."
 nd_lbe_tribute_army_reform: "Réforme de l'armée d'hommage"
 nd_lbe_tribute_army_reform_desc: "Le système de collecte des tributs est militarisé, avec des forces dédiées qui peuvent se déployer rapidement pour faire respecter les obligations sur les vastes domaines de l'empire."
 nd_lbe_lunda_model_spread: "Modèle Lunda"
 nd_lbe_lunda_model_spread_desc: "Le modèle Luba de royauté sacrée et de gouvernance institutionnelle s’étend aux peuples voisins, notamment aux Lunda, créant une vaste zone de gouvernance étatique influencée par les Luba."
 nd_lbe_copper_belt_consolidation: "Consolidation de la ceinture de cuivre"
 nd_lbe_copper_belt_consolidation_desc: "The rich copper deposits connecting Luba territory to the Zambian copperbelt are brought under tighter state control, fueling imperial expansion.\n\n#italic Available in: $nd_lbe_copper_diggings$#!"
 nd_lbe_bamfumu_nobility: "Noblesse Bamfumu"
 nd_lbe_bamfumu_nobility_desc: "Les nobles de la cour Bamfumu acquièrent des pouvoirs et des responsabilités formalisés, créant ainsi une classe aristocratique stable qui soutient le règne des Mulopwe."
 nd_lbe_regional_tribute_system: "Système d'hommage régional"
 nd_lbe_regional_tribute_system_desc: "Un système sophistiqué de collecte et de redistribution des tributs garantit que les ressources circulent des régions périphériques vers le centre et inversement, liant ainsi l'empire."
 nd_lbe_sacred_geography: "Géographie sacrée"
 nd_lbe_sacred_geography_desc: "Le paysage lui-même devient une carte de la spiritualité Luba, avec des sanctuaires, des bosquets sacrés et des sites ancestraux marquant la géographie de la royauté divine."
 nd_lbe_advanced_smelting_techniques: "Techniques de fusion avancées"
 nd_lbe_advanced_smelting_techniques_desc: "Luba metalworkers develop techniques for producing sheet iron and soldering metals, enabling the creation of the double iron bells that symbolize royal power.\n\n#italic Available in: $nd_lbe_copper_smithy$#!"
 nd_lbe_mulopwe_centralization: "Centralisation de Mulopwe"
 nd_lbe_mulopwe_centralization_desc: "Les Mulopwe consolident leur autorité directe sur les provinces autrefois autonomes, réduisant ainsi l'indépendance des chefs Kilolo locaux."
 nd_lbe_katanga_copper_hegemony: "Hégémonie du cuivre au Katanga"
 nd_lbe_katanga_copper_hegemony_desc: "Le contrôle total des sources de cuivre du Katanga fait de l’Empire Luba le maître incontesté de la métallurgie et du commerce centrafricains."
 nd_lbe_savanna_road_networks: "Réseaux routiers de savane"
 nd_lbe_savanna_road_networks_desc: "Des chemins organisés reliant les principales colonies améliorent la circulation des marchandises, des tributs et des armées à travers les vastes territoires de savane."
 nd_lbe_mbudye_judicial_reform: "Réforme judiciaire de Mbudye"
 nd_lbe_mbudye_judicial_reform_desc: "La société Bambudye officialise son rôle d'autorité judiciaire suprême, avec le pouvoir d'interpréter la loi et même de destituer les rois qui abusent de leur mandat."
 nd_lbe_cross_continental_trade: "Commerce transcontinental"
 nd_lbe_cross_continental_trade_desc: "Luba trade networks extend from the equatorial forests to the Indian Ocean coast, connecting central Africa to global commerce."
 nd_lbe_warrior_societies: "Sociétés de guerriers"
 nd_lbe_warrior_societies_desc: "Organized warrior societies provide the Luba with a disciplined military elite trained in the tactics of savanna warfare. The client kings who hold the Mulopwe's sacred fire send their warbands to his wars."
 nd_lbe_anti_colonial_resistance: "Résistance anticoloniale"
 nd_lbe_anti_colonial_resistance_desc: "The warriors of the Luba heartland leverage their knowledge of local terrain and guerrilla tactics to resist foreign encroachment. Ivory sold to the coast traders buys the muskets they do it with."
 nd_lbe_copper_industrial_revolution: "Révolution industrielle du cuivre"
 nd_lbe_copper_industrial_revolution_desc: "L'application de nouvelles techniques à l'extraction et à la fusion du cuivre Luba transforme l'ancienne industrie en un moteur économique moderne."
 nd_lbe_unified_luba_governance: "Gouvernance Luba unifiée"
 nd_lbe_unified_luba_governance_desc: "L'autorité des Mulopwe et la sagesse des Bambudye se fondent dans un système de gouvernance unifié capable d'administrer un État moderne."
 nd_lbe_modern_trade_networks: "Réseaux commerciaux modernes"
 nd_lbe_modern_trade_networks_desc: "Les routes commerciales traditionnelles des Luba sont élargies et modernisées, intégrant l'empire dans les systèmes commerciaux mondiaux."
 nd_lbe_luba_cultural_renaissance: "Renaissance culturelle Luba"
 nd_lbe_luba_cultural_renaissance_desc: "A flowering of Luba art, sculpture, and oral literature celebrates the empire's heritage and projects its cultural influence across central Africa. Court carvers cut the caryatid stools, bow stands and headrests that seat and arm a king."
 nd_lbe_sovereignty_of_the_heartland: "Souveraineté du Heartland"
 nd_lbe_sovereignty_of_the_heartland_desc: "L’Empire Luba affirme sa souveraineté en tant que puissance indépendante, exigeant la reconnaissance des grandes puissances du monde."
 a_nd_lbe_ironworker_warriors: "Guerriers ferronniers"
 a_nd_lbe_ironworker_warriors_desc: "Milice villageoise armée d'armes forgées en fer Upemba, de lances, de haches et d'épées courtes d'une qualité exceptionnelle. Ces soldats-agriculteurs portent au combat la tradition du travail du fer de leurs ancêtres."
 a_nd_lbe_balopwe_guard: "Garde royale Balopwe"
 a_nd_lbe_balopwe_guard_desc: "La suite personnelle du roi sacré, composée des guerriers les plus fidèles du clan Balopwe. Leur dévouement envers les Mulopwe transcende la loyauté militaire ordinaire ; ils se battent comme s'ils défendaient un dieu vivant."
 a_nd_lbe_twite_spearmen: "Lanciers de Twite"
 a_nd_lbe_twite_spearmen_desc: "Soldats provinciaux organisés sous le commandement du twite, le chef militaire des Mulopwe. Equipés de longues lances et de boucliers en bois, ils constituent l'épine dorsale disciplinée des armées de campagne Luba."
 a_nd_lbe_tribute_collectors: "Collectionneurs d'hommages"
 a_nd_lbe_tribute_collectors_desc: "Des détachements armés rapides chargés de faire respecter les obligations tributaires à travers l'empire. Légèrement équipés pour des marches rapides, ils peuvent projeter l'autorité Luba profondément dans les territoires soumis."
 a_nd_lbe_fire_king_warband: "Warbands of the Fire Kings"
 a_nd_lbe_fire_king_warband_desc: "The men a client king owes the Mulopwe. A chief who has taken the sacred fire from the royal hearth rules by that grant, and answers the call to war with his own spearmen."
 levy_nd_lbe_fire_king_warband: "Warbands of the Fire Kings"
 levy_nd_lbe_fire_king_warband_desc: "Contingents raised by the client kings who hold the Mulopwe's sacred fire."
 a_nd_lbe_ivory_musketeers: "Musketeers of the Ivory Trade"
 a_nd_lbe_ivory_musketeers_desc: "Warriors armed with trade muskets bought for ivory from the caravans of the east coast. The guns are worn and the powder is never enough, but these men know every path of the savanna and fight from cover on their own ground."
 nd_lbe_lukasa_archive: "Archives de Lucas"
 nd_lbe_lukasa_archive_desc: "Un centre d'apprentissage de Bambudye où des maîtres historiens gardent et interprètent les tableaux de mémoire lukasa, préservant les généalogies, les lois et les histoires de migration du peuple Luba."
 nd_lbe_copper_smithy: "Forge Royale du Cuivre"
 nd_lbe_copper_smithy_desc: "Un atelier de travail des métaux avancé où les forgerons Luba coulent les lingots de cuivre en forme de croix qui servent de monnaie dans les réseaux commerciaux d'Afrique centrale."
 nd_lbe_mulopwe_shrine: "Sanctuaire de Mulopwe"
 nd_lbe_mulopwe_shrine_desc: "Un sanctuaire vivant construit dans l'ancienne capitale d'un Mulopwe décédé, qui à sa mort est devenu une divinité. Ces sites sacrés sanctifient le paysage et renforcent la légitimité divine de l'autorité royale."
 nd_lbe_kilolo_granary: "Le grenier de Kilolo"
 nd_lbe_kilolo_granary_desc: "Un entrepôt administratif géré par le chef local Kilolo, collectant et redistribuant les tributs agricoles pour subvenir aux besoins de la population et financer l'État."
 nd_lbe_trade_post: "Poste commercial de Luba"
 nd_lbe_trade_post_desc: "Une station commerciale régionale positionnée sur les routes du cuivre et du sel, facilitant les échanges entre le cœur du pays Luba et les partenaires commerciaux lointains."
 nd_lbe_copper_cross_casting_pm: "Coulée croisée en cuivre"
 nd_lbe_copper_cross_casting_pm_desc: "Couler du cuivre dans des lingots de main en forme de croix distinctifs, prisés comme monnaie et biens de prestige dans toute l'Afrique centrale."
 nd_lbe_sheet_iron_pm: "Sheet Iron Forging"
 nd_lbe_sheet_iron_pm_desc: "Smiths beat bloom iron into sheet and solder it into the double bells of kingship, and forge the axes and spearheads that mark an office holder."
 nd_lbe_carvers_atelier: "Carvers' Atelier"
 nd_lbe_carvers_atelier_desc: "A court workshop where master carvers and their pupils work in one recognisable hand. The atelier of the Master of Buli, with its long, worn faces, is the best known of them."
 nd_lbe_royal_carving_pm: "Royal Carving"
 nd_lbe_royal_carving_pm_desc: "Carvers cut caryatid stools, bow stands and headrests from single blocks of wood. A king is seated on the stool and never touches the ground."
 nd_lbe_raffia_weaving_pm: "Tissage de tissu en raphia"
 nd_lbe_raffia_weaving_pm_desc: "Le tissage des fibres de raphia pour en faire du tissu, une exportation majeure des Luba commercialisée vers les Songye et d'autres peuples voisins."
 nd_lbe_lake_fishery_pm: "Opérations de pêche sur les lacs"
 nd_lbe_lake_fishery_pm_desc: "Pêche organisée sur les lacs de la dépression d'Upemba, transportant des captures qui soutiennent les colonies environnantes."
 nd_lbe_salt_mining_pm: "Salt Boiling"
 nd_lbe_salt_mining_pm_desc: "Brine from the marsh is boiled down in pots over wood fires. The salt is pressed into cakes, which pass as currency alongside copper."
 nd_lbe_lukasa_maintenance: "Préservation de Lucas"
 nd_lbe_lukasa_maintenance_desc: "La création et l'entretien continus des cartes mémoire Lukasa nécessitent des artisans qualifiés travaillant avec des perles, des coquillages et des matériaux fins."
 nd_lbe_smithy_maintenance: "Opérations de forge"
 nd_lbe_smithy_maintenance_desc: "Faire fondre le minerai de cuivre et le forger en outils et en instruments à la forge royale."
 nd_lbe_shrine_maintenance: "Entretien du sanctuaire"
 nd_lbe_shrine_maintenance_desc: "Entretenir le sanctuaire sacré avec des offrandes et des biens rituels pour honorer le défunt Mulopwe."
 nd_lbe_granary_maintenance: "Entretien du grenier"
 nd_lbe_granary_maintenance_desc: "Entretenir les structures d'entrepôt qui protègent les réserves de céréales des intempéries et des ravageurs."
 nd_lbe_trade_post_maintenance: "Opérations des postes commerciaux"
 nd_lbe_trade_post_maintenance_desc: "Coûts de fonctionnement de la station commerciale, y compris le stockage de marchandises commerciales à échanger."
 nd_lbe_lake_fishing_tradition: "Tradition de pêche en lac"
 nd_lbe_lake_fishing_tradition_desc: "The organized fishing communities of the Upemba lakes, continuing the ancient Kisalian tradition, form the economic backbone of early Luba settlement.\n\n#italic Available in: $nd_lbe_upemba_fishery$#!"
 nd_lbe_savanna_fortification: "Fortification de la savane"
 nd_lbe_savanna_fortification_desc: "Les palissades fortifiées des villages protègent les colonies Luba des pillards, en utilisant les avantages naturels du paysage de savane."
 nd_lbe_upemba_fishery: "Pêche Upemba"
 nd_lbe_upemba_fishery_desc: "Une opération de pêche organisée au bord des lacs de la dépression d'Upemba, fournissant un excédent alimentaire fiable qui fait vivre la population environnante."
 nd_lbe_palisade_fort: "Palissade Luba"
 nd_lbe_palisade_fort_desc: "Une défense de village fortifiée construite à partir de rondins de bois dur, conçue pour protéger les colonies des pillards et servir de point de ralliement aux milices locales."
 nd_lbe_ivory_carving_pm: "Sculpture en ivoire"
 nd_lbe_ivory_carving_pm_desc: "Ivory is cut into small pendants in the likeness of the dead, worn against the chest and rubbed with oil until they darken."
 nd_lbe_palm_beer_brewing_pm: "Palm Wine Tapping"
 nd_lbe_palm_beer_brewing_pm_desc: "The palms are tapped and the sap left to ferment in pots. Palm wine is poured at every court, funeral, and offering to the ancestors."
 nd_lbe_copper_belt_extraction_pm: "Extraction de ceinture de cuivre"
 nd_lbe_copper_belt_extraction_pm_desc: "Malachite is dug from open pits in the dry season and smelted on the spot with charcoal."
 nd_lbe_fishery_maintenance: "Entretien de la pêche"
 nd_lbe_fishery_maintenance_desc: "Entretenir les canots, les filets et les séchoirs pour les opérations de pêche au bord du lac."
 nd_lbe_palisade_maintenance: "Entretien de la palissade"
 nd_lbe_palisade_maintenance_desc: "Entretenir la palissade défensive avec du bois frais et des réparations."
 nd_lbe_formed_tt: "L'Empire Luba a été formé"
 nd_lbe_path_a_tt: "A choisi l'autorité divine des Mulopwe"
 nd_lbe_path_b_tt: "A choisi la sagesse du Bambudye"
 nd_lbe_destiny: "Destin de l'empire Luba"
 nd_lbe_destiny_desc: "L’Empire Luba se trouve à la croisée des chemins. La voie choisie lors de sa fondation appelle désormais la nation vers son destin ultime. La stabilité et la détermination sont nécessaires avant que le grand travail puisse commencer."
 nd_lbe_dest_tanganyika: "La marche vers le Tanganyika"
 nd_lbe_dest_tanganyika_desc: "The Mulopwe demands expansion eastward to the shores of Lake Tanganyika and northward into the Lomami basin. These conquests, made with warriors armed in Luba iron, will establish the military foundations of a continental empire."
 nd_lbe_dest_kongo: "La chute du Kongo"
 nd_lbe_dest_kongo_desc: "With the east secured, the Mulopwe turns his gaze westward. The great kingdom of Kongo must be brought under Luba suzerainty: its capital at Mbanza Kongo and half of its heartland are to be held, with the royal guard of the Balopwe at the head of the army."
 nd_lbe_dest_mulopwe_supreme: "Mulopwe Suprême"
 nd_lbe_dest_mulopwe_supreme_desc: "L'ambition finale du roi divin : dépasser l'intérieur et s'emparer des villes commerciales côtières de Kilwa et Sofala, reliant le cœur du Luba aux richesses de l'océan Indien. C’est le sommet de la conquête sacrée."
 nd_lbe_dest_knowledge: "Les gardiens du savoir"
 nd_lbe_dest_knowledge_desc: "Le conseil de Bambudye oriente la nation vers le développement institutionnel et la maîtrise économique. Adoptez des pratiques financières modernes et veillez à ce que le cuivre Luba domine les marchés."
 nd_lbe_dest_trade_routes: "Seigneurs des routes commerciales"
 nd_lbe_dest_trade_routes_desc: "Extend the Bambudye's commercial vision to the Atlantic coast. The port of Loango will serve as the western terminus of a Luba trade network stretching from copper mines to ocean harbors, with trade posts kept in three locations."
 nd_lbe_dest_bambudye_supreme: "Bambudye Suprême"
 nd_lbe_dest_bambudye_supreme_desc: "The ultimate expression of the Bambudye's institutional wisdom: a trade empire spanning the continent, where ivory flows through Luba markets and Lukasa Archives in three locations keep the memory of the realm. This is governance triumphant."
 nd_lbe.6.t: "Le destin nous appelle"
 nd_lbe.6.d: "Notre empire a atteint la stabilité nécessaire pour poursuivre son objectif suprême. La voie que nous avons choisie lors de notre fondation, qu’il s’agisse de l’autorité divine des Mulopwe ou de la sagesse institutionnelle des Bambudye, nous interpelle désormais. Les ancêtres regardent et les tableaux lukasa enregistrent nos actes pour la postérité. Que le grand travail commence."
 nd_lbe.6.a: "Le destin des Luba se déroule devant nous."
 nd_lbe.7.t: "La frontière orientale"
 nd_lbe.7.d: "Nos armées ont atteint les rives du lac Tanganyika et le bassin de la Lomami s'incline devant l'autorité des Mulopwe. Les peuples de l'Est, longtemps habitués à leur indépendance, reconnaissent désormais le roi divin dont les armes de fer et les croix de cuivre ont suivi les routes commerciales jusqu'à leurs terres. Les guerriers reviennent chargés d'hommages, d'ivoire, de cuivre et de la loyauté de nouveaux sujets."
 nd_lbe.7.a: "Le mandat des Mulopwe s'étend jusqu'au grand lac."
 nd_lbe.8.t: "Le Kongo est tombé"
 nd_lbe.8.d: "Mbanza Kongo, l'ancien siège du pouvoir à l'ouest, a été prise. La bannière des Mulopwe flotte sur une ville qui rivalisait autrefois avec la nôtre en termes de prestige et d'influence. Il ne s’agit pas d’une simple conquête : c’est l’assujettissement d’une civilisation. Comment consolider cet immense prix ? Nous pouvons lui retirer ses richesses pour alimenter de nouvelles campagnes, ou nous pouvons honorer ses guerriers en les intégrant dans la tradition militaire Luba."
 nd_lbe.8.a: "Dépouillez les terres conquises de leur tribut."
 nd_lbe.8.b: "Honorez les morts, intégrez leurs guerriers."
 nd_lbe.9.t: "L'ascendant Mulopwe"
 nd_lbe.9.d: "The sacred king has achieved what the ancestors could only dream. From the Upemba Depression to the Indian Ocean, from the Lomami to the Zambezi, the Luba Empire now controls the trade routes that connect the African interior to the wider world. Kilwa's dhows carry Luba copper to Arabia, and Sofala's gold flows through the Mulopwe's hands. This is the apex of divine kingship, an empire built on iron, copper, and the sacred mandate of the ancestors.\n\nShall the Mulopwe rule from an iron throne of military supremacy, or shall he forge an empire of copper, wealthy, stable, and enduring?"
 nd_lbe.9.a: "Le trône de fer commandera à toutes les nations."
 nd_lbe.9.b: "L'Empire du Cuivre perdure grâce à la richesse."
 nd_lbe.10.t: "L'économie du savoir"
 nd_lbe.10.d: "Le conseil de Bambudye a guidé la nation vers un nouveau modèle de pouvoir, fondé non pas sur la seule conquête, mais sur la connaissance institutionnelle et la sophistication économique. Notre adoption de pratiques bancaires a transformé la croix de cuivre d’un simple bien commercial en un outil de pouvoir financier. Les tableaux lukasa enregistrent désormais non seulement les généalogies et les histoires de migration, mais aussi les accords commerciaux, les prix du marché et les protocoles diplomatiques. La connaissance est la véritable forme de richesse."
 nd_lbe.10.a: "La sagesse des Bambudye nous enrichit tous."
 nd_lbe.11.t: "La connexion atlantique"
 nd_lbe.11.d: "Our merchants have reached Loango on the Atlantic coast, completing a trade route that stretches from the copper mines of Katanga to the harbors of the western ocean. Luba copper crosses, raffia cloth, and ivory now flow westward through a network of intermediaries, while foreign goods (salt, shells, and cloth from distant lands) flow back to enrich the heartland.\n\nShall we focus on building merchant houses along the copper routes, or shall we use salt and diplomacy to bind our trading partners into a durable alliance network?"
 nd_lbe.11.a: "Construisez les maisons des marchands ; le cuivre est roi."
 nd_lbe.11.b: "Le sel et la diplomatie forgent des liens plus forts."
 nd_lbe.12.t: "Le triomphant de Bambudye"
 nd_lbe.12.d: "The Bambudye society has achieved something unprecedented: a governance system so effective, so flexible, and so deeply rooted in institutional knowledge that it has become a model for peoples across the continent. Foreign leaders seek membership in the council, and the lukasa boards are studied as masterworks of encoded wisdom. The Luba Empire has proven that a state built on knowledge and trade can rival any built on conquest.\n\nShall we formalize the Bambudye as a constitutional body, or shall we project Luba culture outward, absorbing neighboring peoples into our institutional framework?"
 nd_lbe.12.a: "Le Bambudye est notre constitution vivante."
 nd_lbe.12.b: "Que tous les peuples apprennent la voie Luba."
 STATIC_MODIFIER_NAME_nd_lbe_dest_conquerors_tribute: "Hommage du conquérant"
 STATIC_MODIFIER_DESC_nd_lbe_dest_conquerors_tribute: "Le butin de la conquête du Kongo alimente une nouvelle expansion, même si les coûts d'administration de territoires aussi vastes mettent à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_lbe_dest_warrior_prestige: "Prestige du guerrier"
 STATIC_MODIFIER_DESC_nd_lbe_dest_warrior_prestige: "L'intégration des guerriers Kongo dans la tradition militaire Luba a produit une force aguerrie au combat, dotée d'un moral supérieur et d'une flexibilité tactique."
 STATIC_MODIFIER_NAME_nd_lbe_dest_iron_throne: "Le trône de fer"
 STATIC_MODIFIER_DESC_nd_lbe_dest_iron_throne: "Le Mulopwe règne sur un trône de fer, son autorité divine étant incontestée sur un vaste empire. La suprématie militaire est totale, même si les coûts d’une guerre perpétuelle font grimper l’inflation."
 STATIC_MODIFIER_NAME_nd_lbe_dest_empire_of_copper: "Empire du cuivre"
 STATIC_MODIFIER_DESC_nd_lbe_dest_empire_of_copper: "The wealth of the copper belt and the coastal trade cities sustains a vast army, and the subject kings of the Mulopwe pay their tribute in copper."
 STATIC_MODIFIER_NAME_nd_lbe_dest_copper_merchants: "Marchands de cuivre"
 STATIC_MODIFIER_DESC_nd_lbe_dest_copper_merchants: "Les maisons de marchands Luba dominent le commerce du cuivre du Katanga à l'Atlantique, convertissant les populations locales aux pratiques commerciales Luba. Le succès engendre cependant une certaine complaisance."
 STATIC_MODIFIER_NAME_nd_lbe_dest_salt_diplomacy: "Diplomatie du sel"
 STATIC_MODIFIER_DESC_nd_lbe_dest_salt_diplomacy: "L'échange de sel et de cuivre a forgé un réseau de relations diplomatiques qui étendent l'influence Luba sans les coûts de la conquête, même si le maintien de ces relations exige des démonstrations courtoises coûteuses."
 STATIC_MODIFIER_NAME_nd_lbe_dest_living_constitution: "Constitution vivante"
 STATIC_MODIFIER_DESC_nd_lbe_dest_living_constitution: "Le conseil de Bambudye fonctionne comme une constitution vivante, offrant une continuité institutionnelle, une expertise diplomatique et la capacité de se remettre de toute crise."
 STATIC_MODIFIER_NAME_nd_lbe_dest_cultural_hegemony: "Hégémonie culturelle"
 STATIC_MODIFIER_DESC_nd_lbe_dest_cultural_hegemony: "Le modèle de gouvernance Luba s’étend à tous les coins de l’Afrique centrale, absorbant les peuples étrangers dans un cadre institutionnel commun qui réduit les tensions et permet une élaboration politique flexible."
 nd_lbe_war_camp: "Camp de guerre de Mulopwe"
 nd_lbe_war_camp_desc: "Un campement militaire permanent établi par le twite du roi divin, à partir duquel les armées sont rassemblées, approvisionnées et envoyées pour imposer la volonté des Mulopwe au-delà des frontières lointaines."
 nd_lbe_war_camp_maintenance: "Opérations des camps de guerre"
 nd_lbe_war_camp_maintenance_desc: "Approvisionnement du camp militaire permanent en armes, nourriture et matériel pour les armées de Mulopwe."
 nd_lbe_grand_lukasa_council: "Conseil du Grand Lukasa"
 nd_lbe_grand_lukasa_council_desc: "La salle suprême de la société Bambudye, où sont étudiés les conseils lukasa les plus sacrés et où les conseillers les plus sages guident la gouvernance d'un empire commercial continental."
 nd_lbe_grand_council_maintenance: "Opérations du Conseil"
 nd_lbe_grand_council_maintenance_desc: "Entretenir la grande salle du conseil et fournir les matériaux nécessaires à la création de lukasa et au travail scientifique."
 lbe_bilumbu_council_bureaucracy: "Conseil Bilumbu Spirit-Medium"
 lbe_bilumbu_council_bureaucracy_desc: "Les bilumbu étaient des médiums spirituels qui devinaient le jugement ancestral à l'aide du bâton divinatoire kashekesheke, statuant sur les conflits de succession, les accusations de sorcellerie et les obligations tributaires que les Mulopwe ne pouvaient pas aborder directement. Documenté dans la savane d'Upemba depuis au moins le XVIe siècle, le bilumbu fonctionnait comme une branche ecclésiastique et judiciaire parallèle aux administrateurs laïcs kilolo, rendant des verdicts qu'aucun chef n'osait contester parce qu'ils provenaient des prédécesseurs décédés du trône. Lorsque l’institution s’est effondrée, la divination est devenue un outil des lignées bilumbu factionnelles plutôt que du roi sacré."
 lbe_mwadi_vessels_bureaucracy: "Navires royaux Mwadi"
 lbe_mwadi_vessels_bureaucracy_desc: "Les Mwadi étaient des femmes âgées qui, par un rituel de possession spirituelle, incarnaient des ancêtres royaux décédés et surclassaient les chefs vivants en canalisant les fondateurs Kalala Ilunga et Mbidi Kiluwe. Les dirigeants tributaires de Kanyok, Kalundwe et Hemba ont épousé Mwadi pour se lier à la lignée royale Luba, intégrant les périphéries par le biais d'une parenté rituelle plutôt que par la conquête. L'institution centralisait l'autorité à moindre coût, mais produisait des crises de succession chaque fois que son rival Mwadi revendiquait la même incarnation et que des nobles irrités étaient accusés de dévouement insuffisant."
 lbe_kioni_court_bureaucracy: "Musiciens de la cour de Kioni"
 lbe_kioni_court_bureaucracy_desc: "Les kioni n'étaient pas des artistes mais des archives vivantes : les musiciens de la cour chantaient des généalogies royales, transmettaient des édits sous forme de rythmes de tambours à travers la savane et étaient présents à chaque acte administratif rituel. Fonctionnant comme une chancellerie sans écriture, le kioni préservait le canon culturel de l'État Luba et projetait l'autorité royale vers l'extérieur à travers la performance. Lorsque le patronage royal des kioni a expiré, la mémoire de la cour a été contestée : les généalogies rivales ont proliféré, les édits sont devenus ambigus et le prestige des Mulopwe s'est effondré avec le silence des tambours."
 lbe_twite_tributary_bureaucracy: "Administration de l'affluent Twite"
 lbe_twite_tributary_bureaucracy_desc: "Les Twites étaient des seigneurs de guerre-administrateurs envoyés depuis la capitale pour gouverner les sous-royaumes tributaires de Kanyok, Kalundwe et des terres Hemba, collectant des croix de cuivre, de l'ivoire, du sel et du raphia pour les Mulopwe. Les chefs locaux conservèrent leurs fonctions mais acceptèrent des superviseurs Luba qui supervisaient les hommages, rassemblaient des forces auxiliaires et faisaient respecter les obligations rituelles. Efficace en termes de revenus et d'intégration rapide, le système Twite a progressivement produit une classe quasi-noble avec des cortèges privés dont la loyauté dérivait à mesure que la surveillance centrale se relâchait."
 lbe_kafuti_society_bureaucracy: "Société sacrée Kafuti"
 lbe_kafuti_society_bureaucracy_desc: "Les Kafuti étaient une congrégation politique et sacrée de notables initiés qui réglementaient la succession royale, portaient les panneaux de mémoire lukasa et d'autres insignes, et liaient les aristocrates régionaux aux Mulopwe par le biais de connaissances rituelles partagées auxquelles les roturiers non initiés ne pouvaient pas accéder. Étroitement liés aux sociétés Bambudye et Bukibwakulu, les Kafuti ont produit une classe dirigeante cohérente à travers les Luba et les terres affluentes, mais leurs rituels empêchaient toute personne de progresser en dehors de la loge - une barrière que les paysans non initiés et les lignées rivales considéraient comme un vol de voix."
 AUTO_MODIFIER_NAME_nd_lbe_bureaucracy_authority: "Bureaux de Bambudye"
 AUTO_MODIFIER_DESC_nd_lbe_bureaucracy_authority: "With the founding of the Luba Empire, the Mulopwe inherits the institutional apparatus of the bambudye memory-keepers and the kioni court musicians, granting the capacity to keep three sustained bureaucracies."
 nd_lbe_palm_grove: "Palm Grove"
 nd_lbe_palm_grove_desc: "The stand of raffia and oil palms kept by a village. The palms are tapped for wine, pressed for oil, and stripped for the fiber that is woven into cloth."
 nd_lbe_salt_works: "Salt Works"
 nd_lbe_salt_works_desc: "A boiling place at the edge of a salt marsh. The salt cakes made here are carried north along the Lualaba and traded for iron, fish, and cloth."
 nd_lbe_copper_diggings: "Copper Diggings"
 nd_lbe_copper_diggings_desc: "Open pits where the green ore of Katanga is dug. The smelters cast the metal into crosses before it leaves the site."
 nd_lbe_dest_kongo_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in Kongo"
 nd_lbe_dest_trade_posts_tt: "At least #bold 3#! owned locations have a #bold Luba Trade Post#!"
 nd_lbe_dest_lukasa_archives_tt: "At least #bold 3#! owned locations have a #bold Lukasa Archive#!"
