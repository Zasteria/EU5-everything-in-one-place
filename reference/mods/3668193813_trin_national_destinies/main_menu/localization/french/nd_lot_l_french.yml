l_french:
 STATIC_MODIFIER_NAME_nd_lot_crossroads_of_christendom: "Carrefour de la chrétienté"
 STATIC_MODIFIER_DESC_nd_lot_crossroads_of_christendom: "La Lotharingie retrouve son ancien rôle de lieu de rencontre de l'Europe, une terre où les marchands du Rhin, de la Meuse et de l'Escaut échangent non seulement des marchandises mais des idées, et où la tolérance des différences n'est pas une faiblesse mais un sens de l'État."
 STATIC_MODIFIER_NAME_nd_lot_iron_crown_of_lothar: "Couronne de fer de Lothar"
 STATIC_MODIFIER_DESC_nd_lot_iron_crown_of_lothar: "L’Empire du Milieu est ressuscité non pas comme un tampon passif mais comme un État martial dans la tradition bourguignonne, ses compagnies d’ordonnances et ses frontières bordées de forteresses proclamant que l’espace entre la France et l’Allemagne n’appartient à aucune des deux, il appartient à la Lotharingie."
 nd_lot.1.t: "L'Empire du Milieu renaît"
 nd_lot.1.d: "For centuries, the lands between the Rhine and the Meuse have been the cockpit of Europe, fought over by France and the Empire, carved into duchies and prince-bishoprics, their unity a memory preserved only in the name 'Lotharingia.' Now that memory becomes reality once more. The kingdom that Lothair I carved from the heart of Charlemagne's empire at the Treaty of Verdun in 843 rises again.\n\nBut what manner of kingdom shall this be? The old Lotharingia was destroyed precisely because it tried to be everything, a corridor between rival powers, rich in trade and culture but lacking the military spine to defend its wealth. The new Lotharingia must choose its founding principle. Will it embrace its nature as Europe's crossroads, the land of the Champagne Fairs and the Rhineland fords, where tolerance and commerce create prosperity that makes conquest unnecessary? Or will it forge the iron discipline of the Burgundian ordonnance, building a centralized military state that secures its borders with fortresses and professional armies, demanding that the great powers acknowledge a third force in Western Europe?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_lot.1.a: "Nous sommes le pont entre les mondes. Que le commerce et la diplomatie soient notre force."
 nd_lot.1.b: "La couronne de fer de Lothar sera défendue par des hommes de fer."
 nd_lot.2.t: "La réforme de l'ordonnance"
 nd_lot.2.d: "Following the example of Charles the Bold's revolutionary military ordinances of 1471, Lotharingia establishes its own compagnies d'ordonnance, permanent companies of professional soldiers organized into lances of men-at-arms, archers, and mounted infantry. This is no feudal host dependent on the seasonal availability of noble vassals. These are salaried professionals who drill year-round, maintain their equipment at state expense, and answer to appointed captains rather than hereditary lords.\n\nThe ordinance demands strict discipline: regular mustering, standardized weapons, prohibited gambling and looting without orders. It is the foundation of a modern army, and a statement that Lotharingia will not rely on mercenaries or feudal obligation to defend its frontiers."
 nd_lot.2.a: "L'ordonnance forgera à nouveau notre armée."
 nd_lot.3.t: "La Bourse d'Anvers"
 nd_lot.3.d: "The great exchange building on the Meir has become something the world has never seen before, a permanent marketplace not for goods, but for money itself. Here, bills of exchange from Venice and Augsburg are traded alongside Portuguese pepper futures and English wool bonds. The Antwerp Bourse has eclipsed the fading fairs of Champagne and Bruges, drawing merchants from across the known world to a single trading floor where fortunes are made and lost in a day.\n\nForeign factors, Portuguese, Spanish, English, German, Italian, have established permanent residences in the city. The population swells. The city's annual fairs, once held twice a year, now function continuously. Antwerp has become the commercial capital of the Western world, and its wealth flows into the coffers of the Lotharingian crown."
 nd_lot.3.a: "Laissons la bourse d'Anvers fixer le prix des biens mondiaux."
 nd_lot.4.t: "L'Ordre de la Toison d'Or"
 nd_lot.4.d: "In a ceremony of extraordinary splendor, the knights of the Order of the Golden Fleece gather in their chapter, the most prestigious chivalric order in Christendom, founded by Philip the Good of Burgundy in 1430. Its membership is limited to the greatest nobles of the realm, bound by oath to defend the Catholic faith and uphold the honor of their sovereign.\n\nThe Order's golden collar and pendant of a ram's fleece have become the supreme mark of aristocratic distinction in Western Europe. Kings and emperors covet membership. Its chapters, held in the great churches of Bruges, Brussels, and Mechelen, are occasions of matchless pageantry, processions of heralds, tournaments of arms, and solemn masses that proclaim the magnificence of the Lotharingian court to all of Europe."
 nd_lot.4.a: "La Toison d'Or lie le sang le plus noble d'Europe à notre cause."
 nd_lot.5.t: "La révolution de l’imprimerie"
 nd_lot.5.d: "When Johannes Gutenberg perfected his movable type press in Mainz around 1440, he could scarcely have imagined how quickly the technology would transform the Rhineland. Within decades, printing houses have sprouted in Cologne, Strasbourg, Basel, and Brussels. The great Rhine corridor, already Europe's busiest trade route, becomes the highway of ideas. Books that once took a monk years to copy can now be produced in hundreds of copies in weeks.\n\nThe impact on literacy, religious debate, and the dissemination of knowledge is revolutionary. University cities along the Rhine attract scholars from across Europe. Legal codes are standardized and distributed. Commercial correspondence accelerates. The very concept of information has changed, and Lotharingia sits at the center of this transformation."
 nd_lot.5.a: "La connaissance coulera aussi librement que le Rhin."
 STATIC_MODIFIER_NAME_nd_lot_ordonnance_reform: "Réforme des ordonnances"
 STATIC_MODIFIER_DESC_nd_lot_ordonnance_reform: "Les compagnies d'ordonnance professionnelles apportent une discipline militaire moderne aux armées de Lotharingie, avec un équipement standardisé, une solde régulière et des exercices militaires toute l'année."
 STATIC_MODIFIER_NAME_nd_lot_global_emporium: "Magasin mondial"
 STATIC_MODIFIER_DESC_nd_lot_global_emporium: "La Bourse d'Anvers est devenue le cœur commercial du monde occidental, où les prix des marchandises en provenance de quatre continents sont fixés quotidiennement."
 nd_lot_carolingian_legacy: "Tradition Palatine Carolingienne"
 nd_lot_carolingian_legacy_desc: "La tradition du Palatinat carolingien, des complexes de chapelles royales qui servaient de centres d'administration, de justice et d'apprentissage sacré dans tout l'Empire du Milieu."
 nd_lot_rhine_river_trade: "Commerce fluvial sur le Rhin"
 nd_lot_rhine_river_trade_desc: "La grande artère du Rhin transporte les marchandises des Alpes jusqu'à la mer du Nord, et ceux qui contrôlent ses passages contrôlent les richesses de l'Europe occidentale."
 nd_lot_scara_tradition: "Tradition de la cavalerie Scara"
 nd_lot_scara_tradition_desc: "La scara d'élite, corps de garde à cheval de Charlemagne organisé en cunei de cinquante cavaliers, a laissé une tradition durable d'excellence en cavalerie lourde sur les terres de l'Empire du Milieu."
 nd_lot_bishop_princes: "Administration prince-évêché"
 nd_lot_bishop_princes_desc: "Les grands princes-évêchés de Cologne, Liège, Trèves et Strasbourg exercent une autorité à la fois spirituelle et temporelle, leurs chapitres cathédraux servant de centres d'apprentissage et de gouvernance."
 nd_lot_flemish_cloth_trade: "Commerce de draps flamand"
 nd_lot_flemish_cloth_trade_desc: "Les villes textiles de Flandre et du Brabant (Gand, Bruges, Ypres, Bruxelles) produisent les draps de laine les plus fins d'Europe, leurs lakenhallen servant à la fois de marché et de contrôle qualité."
 nd_lot_brabant_fairs: "Système de foire brabançonne"
 nd_lot_brabant_fairs_desc: "The great fairs of Brabant (Antwerp, Bergen op Zoom, and their satellites) have succeeded the Champagne Fairs as the meeting point of Northern and Southern European commerce.\n\n#italic Available in: $nd_lot_lakenhalle$#!"
 nd_lot_walloon_ironworking: "Travail du fer wallon"
 nd_lot_walloon_ironworking_desc: "Les forges de la vallée de la Meuse, de Namur à Liège, fondent le minerai depuis l'époque romaine. Les forgerons wallons sont réputés dans toute l'Europe pour la qualité de leur travail du métal."
 nd_lot_meuse_valley_defense: "Défense de la Vallée de la Meuse"
 nd_lot_meuse_valley_defense_desc: "La vallée de la Meuse, l'épine dorsale centrale de la Lotharingie, est fortifiée depuis l'époque carolingienne, ses garnisons étant entraînées pour tenir les passages contre les envahisseurs venus de l'est et de l'ouest."
 nd_lot_urban_communes: "Communes urbaines"
 nd_lot_urban_communes_desc: "Les communes bourgeoises des Pays-Bas et de Rhénanie ont obtenu des droits d'autonomie extraordinaires, leurs conseils, leurs obligations de milice et leurs règlements de guilde créant des îlots de gouvernance proto-démocratique."
 nd_lot_early_netherlandish_art: "Art flamand primitif"
 nd_lot_early_netherlandish_art_desc: "La révolution de la peinture à l'huile initiée par Jan van Eyck et Rogier van der Weyden a fait des Pays-Bas bourguignons le centre artistique de l'Europe du Nord, leurs retables lumineux et leurs portraits étant prisés par les cours de toute la chrétienté."
 nd_lot_ordonnance_companies: "Entreprises d’ordonnancement"
 nd_lot_ordonnance_companies_desc: "Les compagnies d'ordonnance, compagnies militaires professionnelles permanentes créées par Charles le Téméraire en 1471, représentent la première armée permanente d'Europe occidentale depuis Rome."
 nd_lot_bourse_of_antwerp: "Bourse d'Anvers"
 nd_lot_bourse_of_antwerp_desc: "La Bourse d'Anvers, créée au début du XVIe siècle, est la première bourse au monde spécialement construite, un marché couvert où les marchands négocient non pas des marchandises mais des instruments financiers."
 nd_lot_staple_rights: "Droits de base"
 nd_lot_staple_rights_desc: "Les droits de base de Cologne et de Bruges obligent toutes les marchandises transitant par leurs marchés à être proposées à la vente localement, créant des goulots d'étranglement extrêmement rentables qui enrichissent les marchands lotharingiens."
 nd_lot_golden_fleece: "Ordre de la Toison d'Or"
 nd_lot_golden_fleece_desc: "Ordre chevaleresque le plus prestigieux de la chrétienté, fondé en 1430 par Philippe le Bon, dont le collier d'or et le pendentif en toison de bélier marquent la distinction suprême de la noblesse européenne."
 nd_lot_printing_heartland: "Presse à imprimer Heartland"
 nd_lot_printing_heartland_desc: "Le corridor rhénan de Mayence à Cologne et au-delà, lieu de naissance et adepte le plus rapide des caractères mobiles de Gutenberg, est devenu l'autoroute de l'information de l'Europe."
 nd_lot_tapestry_workshops: "Ateliers de Tapisserie"
 nd_lot_tapestry_workshops_desc: "The tapestry workshops of Arras, Tournai, and Brussels produce the most sought-after wall hangings in Europe, their monumental narrative scenes gracing the palaces of kings and popes.\n\n#italic Available in: $nd_lot_lakenhalle$#!"
 nd_lot_confessional_balance: "Équilibre confessionnel"
 nd_lot_confessional_balance_desc: "Dans un pays où vivent côte à côte les communautés catholique, réformée et luthérienne, la Lotharingie développe des traditions pragmatiques de coexistence religieuse que d'autres royaumes mettront des siècles à découvrir."
 nd_lot_walloon_guard_tradition: "Tradition de la Garde wallonne"
 nd_lot_walloon_guard_tradition_desc: "Les Gardes wallonnes, infanterie professionnelle recrutée dans les provinces francophones, constituent des formations d'élite dans les armées de toute l'Europe, réputées pour leur stabilité sous le feu."
 nd_lot_rhine_fortification: "Fortification du Rhin"
 nd_lot_rhine_fortification_desc: "La fortification systématique de la frontière du Rhin avec des forts bastionnés et des citadelles en forme d'étoile, transformant le fleuve d'une route commerciale en une barrière militaire imprenable."
 nd_lot_toll_system: "Système de péage du Rhin"
 nd_lot_toll_system_desc: "Le perfectionnement du système de péage du Rhin, depuis les chaînes fluviales rudimentaires et les points de péage des châteaux jusqu'à un service douanier rationalisé, transforme la géographie de la Lotharingie en un flux constant de revenus."
 nd_lot_university_tradition: "Tradition universitaire"
 nd_lot_university_tradition_desc: "Les universités de Louvain, de Cologne et de Strasbourg forment un corridor d'apprentissage qui attire des universitaires de toute l'Europe, leurs facultés de droit, de médecine et de théologie étant réputées dans toute la chrétienté."
 nd_lot_crossroads_diplomacy: "Diplomatie à la croisée des chemins"
 nd_lot_crossroads_diplomacy_desc: "La position de la Lotharingie entre la France, l'Empire et les États de la mer du Nord en fait un négociateur naturel des traités et un médiateur des différends, un rôle que ses diplomates exploitent avec habileté."
 nd_lot_centralized_customs: "Douane centralisée"
 nd_lot_centralized_customs_desc: "La consolidation de la mosaïque de péages locaux, de droits de base et de frais de transit de la Lotharingie dans un système douanier unifié, fondement d'un véritable marché intérieur."
 nd_lot_industrial_meuse: "Meuse Industrielle"
 nd_lot_industrial_meuse_desc: "La vallée de la Meuse, de Liège à Namur, riche en minerai de fer, en énergie hydraulique et en siècles de tradition métallurgique, devient l'un des premiers corridors industriels d'Europe."
 nd_lot_fortress_builders: "Constructeurs de forteresses"
 nd_lot_fortress_builders_desc: "Les ingénieurs militaires lotharingiens, héritiers des traditions de fortification bourguignonne et française, deviennent maîtres de la trace italienne bastionnée et de l'art de la guerre de siège."
 nd_lot_commercial_code: "Code de commerce"
 nd_lot_commercial_code_desc: "La codification du droit commercial, s'appuyant sur des siècles de réglementations équitables, de statuts de guilde et de pratiques d'échange, fournit un cadre juridique stable aux marchands de Lotharingie."
 nd_lot_standing_army_reform: "Réforme de l'armée permanente"
 nd_lot_standing_army_reform_desc: "La transformation de l'armée de Lotharingie d'un mélange de levées provinciales et de compagnies de mercenaires en une armée permanente centralisée, en uniforme et formée professionnellement."
 nd_lot_coal_and_steel: "Charbon et acier"
 nd_lot_coal_and_steel_desc: "Les gisements de charbon et de fer du bassin Meuse-Sambre alimentent une révolution industrielle qui transforme la Lotharingie, d'une terre d'ateliers artisanaux, en l'un des grands centres manufacturiers d'Europe."
 nd_lot_constitutional_assembly: "Assemblée constitutionnelle"
 nd_lot_constitutional_assembly_desc: "Une assemblée constitutionnelle, s'appuyant sur la profonde tradition lotharingienne de gouvernance communale et d'assemblées de successions, établit un cadre de droits codifiés et de gouvernement représentatif."
 nd_lot_modern_banking: "Banque moderne"
 nd_lot_modern_banking_desc: "S'appuyant sur des siècles de pratique de change, de la Bourse d'Anvers aux maisons de commerce de Cologne, les banques lotharingiennes sont les pionnières des instruments financiers et des systèmes de crédit modernes."
 nd_lot_national_identity: "Identité nationale lotharingienne"
 nd_lot_national_identity_desc: "De la mosaïque des Wallons, des Flamands, des Rhénans, des Alsaciens et des Lorrains émerge une conscience lotharingienne partagée, qui n’efface pas les identités locales mais les tisse dans un tissu commun."
 nd_lot_citizen_army: "Armée citoyenne"
 nd_lot_citizen_army_desc: "La levée en masse, le service militaire universel assuré à tous les citoyens, quelle que soit leur succession, transforme la défense de la Lotharingie d'une affaire professionnelle en une obligation nationale."
 a_nd_lot_scara_cavalry: "Cavalerie Scara"
 a_nd_lot_scara_cavalry_desc: "Cavalerie lourde d'élite héritière de la tradition du corps de garde à cheval de Charlemagne, la scara, organisée en cunei de cinquante cavaliers, entraînés aussi bien aux charges de choc qu'au combat à pied."
 a_nd_lot_meuse_garrison: "Garnison Frontalière de la Meuse"
 a_nd_lot_meuse_garrison_desc: "Robuste infanterie défensive recrutée dans les fortifications de la vallée de la Meuse, spécialisée dans la tenue des traversées fluviales et des positions fortifiées face à la supériorité numérique."
 a_nd_lot_ordonnance_lance: "Lance d'artillerie"
 a_nd_lot_ordonnance_lance_desc: "Cavalerie lourde professionnelle organisée en formation de lance bourguignonne, un homme d'armes accompagné d'un coutillier, d'un page et d'archers, entraînés à combattre en unité coordonnée."
 a_nd_lot_walloon_guards: "Gardes wallons"
 a_nd_lot_walloon_guards_desc: "Infanterie professionnelle recrutée dans les provinces francophones de Wallonie, servant de troupes de ligne d'élite réputées dans toute l'Europe pour leur discipline et leur constance sous le feu."
 a_nd_lot_line_infantry: "Infanterie de ligne lotharingienne"
 a_nd_lot_line_infantry_desc: "L'infanterie professionnelle en uniforme s'entraînait selon les tactiques linéaires de l'époque, représentant le point culminant de l'évolution séculaire de la Lotharingie, des levées féodales à une armée moderne."
 a_nd_lot_citizen_militia: "Milice citoyenne"
 a_nd_lot_citizen_militia_desc: "Des citoyens armés mobilisés par la conscription universelle, luttant avec la ferveur des hommes libres défendant leurs droits constitutionnels et la souveraineté nationale."
 nd_lot_pfalzkapelle: "Chapelle Palatine"
 nd_lot_pfalzkapelle_desc: "Un complexe de chapelles palatines carolingiennes calquées sur la grande chapelle de Charlemagne à Aix-la-Chapelle, en partie chapelle royale, en partie centre administratif, en partie trésor, incarnant l'autorité sacrée de la royauté lotharingienne."
 nd_lot_rheinzoll: "Rheinzoll"
 nd_lot_rheinzoll_desc: "Un poste de péage sur le Rhin situé à un passage stratégique du fleuve, où les douaniers inspectent les barges qui passent et collectent les droits qui financent la couronne lotharingienne."
 nd_lot_lakenhalle: "Lakenhalle"
 nd_lot_lakenhalle_desc: "Une halle aux draps monumentale où les textiles flamands sont inspectés, classés et commercialisés, à la fois un bâtiment de marché et une déclaration de richesse urbaine et de fierté de guilde."
 nd_lot_walloon_forge: "Forge wallonne"
 nd_lot_walloon_forge_desc: "Une forge de tradition wallonne, utilisant des techniques de charbon de bois affinées au fil des siècles dans la vallée de la Meuse pour produire un fer d'une qualité exceptionnelle."
 nd_lot_antwerp_bourse: "Bourse d'Anvers"
 nd_lot_antwerp_bourse_desc: "La première bourse de valeurs au monde spécialement conçue, une salle des marchés à colonnes où les lettres de change, les contrats à terme sur matières premières et les obligations d'État changent de mains dans le cadre d'un commerce continu."
 nd_lot_rhine_fortress: "Forteresse du Rhin"
 nd_lot_rhine_fortress_desc: "Une forteresse bastionnée commandant un passage sur le Rhin, sa conception trace italienne en forme d'étoile intégrant les dernières avancées en matière d'ingénierie militaire pour résister aux bombardements d'artillerie."
 nd_lot_meuse_ironworks: "Forges de la Meuse"
 nd_lot_meuse_ironworks_desc: "Une usine sidérurgique à grande échelle dans le corridor de la Meuse, utilisant des soufflets à eau et la technologie des premiers hauts fourneaux pour produire du fer à l'échelle industrielle."
 nd_lot_steel_works: "Usines de charbon et d'acier"
 nd_lot_steel_works_desc: "Une installation industrielle moderne combinant la fusion du coke au charbon avec des techniques avancées de production d'acier, transformant le minerai brut en matériau de structure de l'ère moderne."
 nd_lot_chapel_maintenance: "Entretien de la chapelle"
 nd_lot_chapel_maintenance_desc: "L'entretien du complexe de la chapelle palatine, de sa maçonnerie, de ses manuscrits et de ses vases sacrés, nécessite un approvisionnement constant en pierre de construction et en parchemin."
 nd_lot_toll_collection: "Perception des péages"
 nd_lot_toll_collection_desc: "L'appareil administratif du péage du Rhin, les employés, les registres, ainsi que les échantillons de tissus et les registres papier qui documentent la cargaison de chaque commerçant de passage."
 nd_lot_cloth_finishing: "Finition du tissu"
 nd_lot_cloth_finishing_desc: "Les dernières étapes de la production textile flamande, le foulage, la teinture et la tonte, transforment la laine brute tissée en les plus beaux textiles d'Europe."
 nd_lot_charcoal_smelting: "Fonderie de charbon de bois"
 nd_lot_charcoal_smelting_desc: "Le processus traditionnel de fusion du fer au charbon de bois des forges wallonnes, consommant de grandes quantités de bois pour produire de la fonte de haute qualité."
 nd_lot_bourse_operations: "Opérations boursières"
 nd_lot_bourse_operations_desc: "Les opérations quotidiennes de la bourse, l'impression des circulaires commerciales, la tenue des grands livres et la manipulation de la pièce d'argent qui garantit les transactions commerciales."
 nd_lot_fortress_garrison: "Garnison de la forteresse"
 nd_lot_fortress_garrison_desc: "Garnison permanente d'une forteresse rhénane, entretenue avec des armes, des munitions et des pierres de construction pour une réparation continue des fortifications."
 nd_lot_blast_furnace: "Opérations de haut fourneau"
 nd_lot_blast_furnace_desc: "Les hauts fourneaux alimentés à l'eau de la vallée de la Meuse fondaient du minerai de fer avec du charbon de bois à des températures sans précédent, produisant ainsi des outils et du matériel d'une qualité exceptionnelle."
 nd_lot_coke_smelting: "Fonderie de coke"
 nd_lot_coke_smelting_desc: "Le procédé révolutionnaire de fusion au coke remplace le charbon de bois par du charbon, transformant le minerai de fer en acier à une échelle industrielle auparavant inimaginable."
 nd_lot_brabant_fair_method: "Commerce équitable brabançon"
 nd_lot_brabant_fair_method_desc: "Les grandes foires brabançonnes tirent la laine d'Angleterre et les teintures de la Méditerranée, les tisserands flamands les transformant en tissus finis destinés à être vendus dans toute l'Europe."
 nd_lot_tapestry_production: "Production de tapisserie"
 nd_lot_tapestry_production_desc: "La réalisation de tapisseries monumentales dans les ateliers de Bruxelles et d'Arras, tissant laine, soie et teintures précieuses dans des scènes narratives d'une richesse extraordinaire."
 levy_nd_lot_scara_cavalry: "Prélèvement de cavalerie Scara"
 levy_nd_lot_scara_cavalry_desc: "Cavalerie noble élevée dans la tradition du corps d'élite de la garde scara de Charlemagne."
 levy_nd_lot_meuse_garrison: "Prélèvement de garnison de Meuse"
 levy_nd_lot_meuse_garrison_desc: "Levée d'infanterie défensive provenant des établissements fortifiés de la vallée de la Meuse."
 levy_nd_lot_citizen_militia: "Prélèvement de la milice citoyenne"
 levy_nd_lot_citizen_militia_desc: "Des citoyens armés mobilisés par la conscription universelle pour défendre la constitution lotharingienne."
 nd_lot_formed_tt: "La Lotharingie s'est formée"
 nd_lot_path_a_tt: "Nous avons choisi le carrefour de la chrétienté"
 nd_lot_path_b_tt: "A choisi la couronne de fer de Lothar"
 nd_lot_dest_antwerp_developed_tt: "We own #bold Antwerp#! and its development is at least #bold 66#!"
 nd_lot_dest_aachen_developed_tt: "We own #bold Aachen#! and its development is at least #bold 62#!"
 nd_lot_destiny: "Destin de l'Empire du Milieu"
 nd_lot_destiny_desc: "Une fois la stabilité rétablie dans l'Empire du Milieu reconstitué, la Lotharingie se trouve à la croisée des chemins : deviendra-t-elle le grand pont commercial de l'Europe ou forgera-t-elle un État militaire à la volonté de fer ?"
 nd_lot_dest_entrepot: "L'Entrepôt du Rhin"
 nd_lot_dest_entrepot_desc: "Sécurisez Amsterdam pour la Lotharingie et assurez la circulation du tissu sur les marchés des capitaux. Construire un trésor digne du carrefour de l'Europe. Nécessite 1000 pièces d'or."
 nd_lot_dest_banker: "Banquier en Europe"
 nd_lot_dest_banker_desc: "Adoptez l’institution bancaire et accumulez la richesse qui rend la Lotharingie indispensable à chaque cour de la chrétienté. Nécessite 2 000 pièces d'or et 50 points de prestige."
 nd_lot_dest_pax: "Pax Lotharingica"
 nd_lot_dest_pax_desc: "Bring the great textile cities of Bruges and Ghent under Lotharingian sovereignty, and let Antwerp grow into what Bruges once was: the staple of the north, where the spice, the cloth and the silver of every nation change hands. Requires Antwerp at 66 development and 75 prestige. Unlocks the Handelshof building."
 nd_lot_dest_march: "La marche bourguignonne"
 nd_lot_dest_march_desc: "Claim Dijon, the ancient Burgundian capital, and build an army worthy of Lothar's iron crown. Requires an army of 30 thousand men and 75 stability."
 nd_lot_dest_frontier: "L'Empire du Milieu restauré"
 nd_lot_dest_frontier_desc: "Extend Lotharingian sovereignty to Reims in the west and Hamburg in the north, establishing the frontier of a true middle European power. Requires an army of 50 thousand men."
 nd_lot_dest_hegemon: "Hégémon de l'Occident"
 nd_lot_dest_hegemon_desc: "Seize Paris, Frankfurt, and Mainz, the capitals of France and the Empire, proving that the Middle Kingdom is the greatest power in Western Europe. The crown that holds them is kept at Aachen, where Lothair's grandfather built his palace, and the palace town must be raised into a seat fit for it. Requires an army of 75 thousand men and Aachen at 62 development. Unlocks the Kaserne building."
 nd_lot.6.t: "La Fondation détient"
 nd_lot.6.d: "The fragile miracle of reunification endures. Where skeptics predicted swift dissolution, the fate of every previous attempt to revive the Middle Kingdom, Lotharingia instead consolidates. The diverse peoples of the Rhine, the Meuse, and the Scheldt have found, if not unity, then at least a working arrangement. Walloon ironmasters and Flemish weavers, Rhenish vintners and Frisian fishermen, all discover that the Lotharingian crown offers something no neighboring power can: the freedom to trade and worship without the heavy hand of Paris or Vienna.\n\nThe question now is not whether the Middle Kingdom will survive, but what it will become."
 nd_lot.6.a: "Les fondations sont posées. Maintenant, nous construisons."
 nd_lot.7.t: "Amsterdam sécurisé"
 nd_lot.7.d: "The great port of Amsterdam, where the Amstel meets the IJ and a hundred ships crowd the harbor on any given day, now flies the Lotharingian standard. With Amsterdam's matchless commercial infrastructure and the cloth trade flowing through our capital markets, Lotharingia commands the economic crossroads of Northern Europe. The warehouses of the Warmoesstraat overflow with Baltic grain, English wool, and Mediterranean spices. Money-changers and factors from a dozen nations crowd the exchanges.\n\nThis is what the Middle Kingdom was always meant to be: not a fortress, but a marketplace, the place where Europe does business."
 nd_lot.7.a: "Amsterdam est le joyau de notre couronne commerciale."
 nd_lot.8.t: "Les banques de l'Empire du Milieu"
 nd_lot.8.d: "Lotharingian banking houses have achieved what no mercantile republic or royal treasury could: they have become indispensable. Kings borrow from Antwerp to wage their wars. Popes rely on Cologne factors to move their revenues. The bills of exchange issued in Brussels are honored from Lisbon to Danzig. The Lotharingian guilder, backed by the immense productive wealth of the Rhine corridor, has become the most trusted currency in European commerce.\n\nBut financial dominance brings its own dilemmas. Shall we use this leverage to reshape trade itself, opening markets and breaking monopolies? Or shall we invest our influence in diplomatic networks, binding the courts of Europe to Lotharingia through debt and obligation?"
 nd_lot.8.a: "Ouvrez les marchés. Le libre-échange enrichit tout le monde."
 nd_lot.8.b: "Liez les tribunaux d’Europe à notre échange."
 nd_lot.9.t: "La paix lotharingienne"
 nd_lot.9.d: "There is a phrase heard increasingly in the chanceries of Europe: 'Pax Lotharingica.' It refers not to conquest but to the remarkable stability that Lotharingian commercial networks have brought to Western Europe. When wars threaten trade, Lotharingian diplomats broker peace. When famine strikes a province, Lotharingian merchants redirect grain. The great textile cities of Bruges and Ghent, now under the Lotharingian crown, anchor a commercial network that stretches from the Baltic to the Mediterranean.\n\nThe Middle Kingdom has achieved what its founders dreamed: not dominion through arms, but indispensability through commerce. No power in Europe can afford to make war on the nation that holds the purse strings. Shall this peace be expressed through universal free trade, or through the cultivation of a cosmopolitan capital that draws the best minds of every nation?"
 nd_lot.9.a: "Laissons les marchés parler d’eux-mêmes."
 nd_lot.9.b: "Faites de notre capitale l’envie de toutes les nations."
 nd_lot.10.t: "La marche sur Dijon"
 nd_lot.10.d: "The ancient capital of the Burgundian dukes falls to Lotharingian arms. In the great hall of the Ducal Palace, where Philip the Good once held his glittering court and Charles the Bold plotted his doomed ambitions, the Lotharingian standard now hangs beside the iron crown of Lothar. The message is unmistakable: Lotharingia claims not merely the Low Countries and the Rhineland, but the full inheritance of the Burgundian state, its military traditions, its chivalric prestige, and its territorial ambitions.\n\nThe Burgundian March has begun. The Middle Kingdom is no longer content to occupy the space between France and the Empire, it means to dominate it."
 nd_lot.10.a: "Dijon est à nous. Que les grandes puissances en prennent note."
 nd_lot.11.t: "Les frontières sécurisées"
 nd_lot.11.d: "With Reims, the coronation city of French kings, under Lotharingian control in the west, and Hamburg, the great Hanseatic port, secured in the north, the Middle Kingdom has established frontiers that would have astounded Lothair I himself. This is no longer a narrow corridor between rival powers. It is a true continental state, commanding the Rhine from source to sea, the Meuse from headwaters to delta, and the overland routes from the Channel to the Baltic.\n\nThe question now is how to hold what has been won. Shall we build an impregnable line of modern fortresses along the frontier, making invasion suicidal? Or shall we revive the ordonnance tradition, investing in the tactical excellence of our field armies to meet any threat in open battle?"
 nd_lot.11.a: "Construisez les forteresses. Rendre nos frontières imprenables."
 nd_lot.11.b: "Entraînez les armées. L'excellence tactique gagne les guerres."
 nd_lot.12.t: "Hégémon de l'Occident"
 nd_lot.12.d: "Paris has fallen. Frankfurt has fallen. Mainz has fallen. The three cities that anchor the power of France and the Holy Roman Empire, the political capital of the Capetians, the coronation city of the Emperors, and the seat of the premier Archbishop-Elector, all now answer to the iron crown of Lothar. The Middle Kingdom has not merely survived between the great powers; it has consumed them.\n\nThis is the Lotharingian century. From the Channel to the Alps, from the Atlantic to the Elbe, the territories of Charlemagne's empire are reunited under a single crown for the first time since the Treaty of Verdun. Shall this hegemony be expressed through an elite imperial guard that embodies centralized power? Or through the iron discipline of a professional army that fights for plunder as much as patriotism?"
 nd_lot.12.a: "Forgez une garde impériale digne de notre nouveau dominion."
 nd_lot.12.b: "Discipline de fer et butin de guerre."
 STATIC_MODIFIER_NAME_nd_lot_dest_exchange_mastery: "Maîtrise des échanges"
 STATIC_MODIFIER_DESC_nd_lot_dest_exchange_mastery: "Les bourses lotharingiennes fixent les termes du commerce européen, leurs lettres de change et les contrats à terme sur matières premières qui sous-tendent le commerce du continent."
 STATIC_MODIFIER_NAME_nd_lot_dest_diplomatic_network: "Réseau Diplomatique"
 STATIC_MODIFIER_DESC_nd_lot_dest_diplomatic_network: "Un réseau d’obligations financières et de relations diplomatiques lie les tribunaux européens aux intérêts lotharingiens, rendant notre neutralité trop précieuse pour être violée."
 STATIC_MODIFIER_NAME_nd_lot_dest_universal_market: "Marché universel"
 STATIC_MODIFIER_DESC_nd_lot_dest_universal_market: "Le réseau commercial lotharingien est devenu véritablement mondial, ses navires légers transportant le commerce vers tous les ports tandis que ses marchés se remettent rapidement de toute perturbation."
 STATIC_MODIFIER_NAME_nd_lot_dest_cosmopolitan_capital: "Capitale cosmopolite"
 STATIC_MODIFIER_DESC_nd_lot_dest_cosmopolitan_capital: "Les grandes villes de l’Empire du Milieu (Bruxelles, Anvers, Cologne) attirent des érudits, des artistes et des marchands de toutes les nations, créant une culture de tolérance et d’innovation."
 STATIC_MODIFIER_NAME_nd_lot_dest_fortress_line: "Ligne de forteresse"
 STATIC_MODIFIER_DESC_nd_lot_dest_fortress_line: "Une chaîne continue de fortifications modernes le long de la frontière lotharingienne, soutenue par une logistique avancée, fait de l’invasion une proposition suicidaire."
 STATIC_MODIFIER_NAME_nd_lot_dest_ordonnance_revival: "La renaissance de l'ordonnance"
 STATIC_MODIFIER_DESC_nd_lot_dest_ordonnance_revival: "La renaissance de la discipline d'ordonnance bourguignonne produit des armées de campagne d'une flexibilité tactique exceptionnelle, même si la concentration sur la guerre terrestre laisse la marine négligée."
 STATIC_MODIFIER_NAME_nd_lot_dest_imperial_guard: "Garde Impériale"
 STATIC_MODIFIER_DESC_nd_lot_dest_imperial_guard: "Un corps d'élite de la garde impériale, équipé de la meilleure artillerie et répondant directement à la couronne, incarne le pouvoir militaire centralisé de l'État lotharingien."
 STATIC_MODIFIER_NAME_nd_lot_dest_iron_discipline: "Discipline de fer"
 STATIC_MODIFIER_DESC_nd_lot_dest_iron_discipline: "Une armée professionnelle liée par une discipline de fer et motivée par la distribution systématique du butin de guerre, soutenue par des compagnies de mercenaires qui complètent les forces permanentes."
 nd_lot_handelshof: "Handelshof"
 nd_lot_handelshof_desc: "Un grand tribunal de commerce où les marchands de toute l'Europe se réunissent pour régler des différends, négocier des contrats et commercer sous la protection du droit commercial lotharingien, l'incarnation institutionnelle de la Pax Lotharingica."
 nd_lot_kaserne: "Kaserne"
 nd_lot_kaserne_desc: "Des casernes militaires professionnelles abritant l'armée permanente de Lotharingie, des quartiers permanents avec des armureries, des cours d'exercices et des dépôts de ravitaillement qui maintiennent les soldats prêts au combat toute l'année."
 nd_lot_handelshof_operations: "Opérations du Tribunal de Commerce"
 nd_lot_handelshof_operations_desc: "Les opérations quotidiennes du Handelshof, l'impression des circulaires commerciales, l'entretien du mobilier élégant pour les dignitaires en visite et la paperasse interminable de l'arbitrage commercial."
 nd_lot_kaserne_upkeep: "Entretien des casernes"
 nd_lot_kaserne_upkeep_desc: "L'entretien des casernes professionnelles, l'équipement des soldats en armes, la fourniture d'uniformes et de vêtements et la conservation des outils pour la réparation des fortifications."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_lot_bureaucracy_authority: "Héritage carolingien"
 AUTO_MODIFIER_DESC_nd_lot_bureaucracy_authority: "The revived Middle Kingdom inherits a uniquely layered administrative tradition, Carolingian envoys and capitularies, Ottonian imperial-church government, the lay-advocacies of the great Rhenish abbeys, the Truce-of-God movement that tamed private war, and the safe-conducts of the great fair circuits. Four of these seven institutions can be kept at once."

 lot_missi_dominici_bureaucracy: "Missi Dominici"
 lot_missi_dominici_bureaucracy_desc: "Des envoyés royaux, un clerc et un laïc, envoyés par paires sur des circuits appelés missatica pour inspecter les comtes, les évêques, les abbés et les propres agents du roi. L'institution fut élargie par le Capitulare missorum generale de Charlemagne de 802 et fut l'instrument central par lequel Aix-la-Chapelle pénétra dans les comtés éloignés. Missi entendit les appels, audita les domaines fiscaux, promulgua les capitulaires et fit rapport au palais."

 lot_palatine_chapel_bureaucracy: "Chapelle Palatine d'Aix-la-Chapelle"
 lot_palatine_chapel_bureaucracy_desc: "La chapelle octogonale construite par Odon de Metz sur ordre de Charlemagne et consacrée par le pape Léon III en 805, cœur architectural et liturgique du palais carolingien. La chapelle abritait le trône impérial, la collection de reliques royales et le clergé de la chapelle qui servait de notaire et de conseiller intime du roi. Chaque couronnement d'un roi allemand, depuis Otton Ier en 936 jusqu'à Ferdinand Ier en 1531, a eu lieu sous ses mosaïques."

 lot_reichskirche_bureaucracy: "Église du Reich"
 lot_reichskirche_bureaucracy_desc: "Le système ecclésial impérial codifié par Otto Ier après 962. La couronne dota les évêchés et les abbayes royales de droits comitaux, d'insignes de marché et d'immunités, et se réservait le droit d'investir chaque nouvel évêque d'un anneau et d'un bâton. Parce que les prélats célibataires ne pouvaient pas fonder de dynasties, leurs fonctions revinrent à la couronne à leur mort, un contrepoids structurel aux ducs territoriaux qui ancrèrent le gouvernement ottonien et salien jusqu'au Concordat de Worms en 1122."

 lot_kirchenvogtei_bureaucracy: "Kirchenvogtei"
 lot_kirchenvogtei_bureaucracy_desc: "Le bureau de défense laïque qui obligeait un magnat à défendre un chapitre d'armes d'un monastère ou d'une cathédrale, à tenir ses tribunaux de justice sanglante et à conduire ses hommes d'armes au Heerbann. À partir du Xe siècle, la fonction devint héréditaire dans les familles nobles, qui utilisèrent de plus en plus le Vogtei comme moyen d'exiger des cotisations, de destituer les abbés et de saisir les biens de l'église. La lutte pour les grandes abbayes lotharingiennes (Stavelot, Echternach, Prm, Sankt Maximin) définit la politique de l'Empire du Milieu."

 lot_imperial_chancery_bureaucracy: "Chancellerie Impériale"
 lot_imperial_chancery_bureaucracy_desc: "Bureau d'écriture rattaché au palais et dirigé (après environ 825) par un archichaplain qui contrôlait le sceau et supervisait les notaires qui rédigeaient les capitulaires, les diplômes et la correspondance royale. Sous Louis le Pieux et Lothaire Ier, la chancellerie d'Aix-la-Chapelle produisit les textes législatifs qui liaient le royaume en une seule communauté juridique. Au cours des siècles ottoniens, l'archichancellerie fut attribuée par coutume à l'archevêque de Mayence pour l'Allemagne et à l'archevêque de Cologne pour l'Italie."

 lot_treuga_dei_bureaucracy: "Treuga Dei"
 lot_treuga_dei_bureaucracy_desc: "La Trêve de Dieu, introduite en Allemagne lors du synode convoqué par l'évêque Henri de Lige en 1082 et étendue à tout l'empire par le synode de Mayence en 1085 en présence d'Henri IV. La Trêve interdisait la guerre privée du mercredi au coucher du soleil au lundi au lever du soleil, lors des fêtes religieuses et pendant le Carême et l'Avent ; la Pax Dei a ajouté l'immunité contre la violence pour le clergé non armé, les paysans à la charrue et les marchands sur la route. Les évêques l'ont appliqué avec des tribunaux diocésains et la menace d'excommunication."

 lot_sauf_conduit_bureaucracy: "Sauf-Conduit des Foires"
 lot_sauf_conduit_bureaucracy_desc: "Le sauf-conduit des foires. À partir du comte Thibaut II de Champagne et confirmé par Philippe Auguste en 1209, rois et seigneurs jurèrent de prendre sous leur protection personnelle tout marchand voyageant à destination ou en provenance du grand cycle des six foires de Lagny, Bar-sur-Aube, Provins et Troyes. Les princes lotharingiens ont hérité et étendu cette pratique à travers la Meuse, le couloir du Rhin et, finalement, le circuit des foires brabançons à Anvers et Bergen op Zoom, imposé par le tribunal des marchands de la Lex mercatoria."
