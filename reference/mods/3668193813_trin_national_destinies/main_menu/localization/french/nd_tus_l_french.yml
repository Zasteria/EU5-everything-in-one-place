l_french:
 STATIC_MODIFIER_NAME_nd_tus_palazzo_dei_medici: "Palais des Médicis"
 STATIC_MODIFIER_DESC_nd_tus_palazzo_dei_medici: "Les Médicis ont construit leur pouvoir non pas grâce aux armes mais grâce au grand livre et au ciseau. Des comptoirs de la Via de' Bardi aux ateliers de Brunelleschi, Florence a prouvé que la richesse orientée vers la beauté pouvait remodeler le monde."
 STATIC_MODIFIER_NAME_nd_tus_porto_franco_spirit: "L'esprit du Porto Franco"
 STATIC_MODIFIER_DESC_nd_tus_porto_franco_spirit: "Les portes de Livourne sont ouvertes à toutes les nations et à toutes les confessions. Juifs séfarades, marchands arméniens, commerçants anglais et armateurs grecs se mélangent sur les places de ce port cosmopolite, faisant de la Toscane un carrefour du commerce méditerranéen."
 STATIC_MODIFIER_NAME_nd_tus_santo_stefano_crusaders: "Zèle de croisade de Santo Stefano"
 STATIC_MODIFIER_DESC_nd_tus_santo_stefano_crusaders: "Les chevaliers de Santo Stefano portent la croix dans la bataille contre les corsaires barbaresques, leurs galères balayant les voies maritimes pour nettoyer les pirates infidèles."
 STATIC_MODIFIER_NAME_nd_tus_mediterranean_patrol: "Patrouille Méditerranéenne"
 STATIC_MODIFIER_DESC_nd_tus_mediterranean_patrol: "Plutôt que de poursuivre la guerre sainte, les Chevaliers de Santo Stefano servent de gardiens du commerce toscan, leurs patrouilles assurant le passage en toute sécurité des navires marchands dans les eaux infestées de pirates."
 nd_tus.1.t: "Le Grand-Duché de Toscane"
 nd_tus.1.d: "From the towers of San Gimignano to the marble facades of Florence, the lands of Tuscany are united under a single banner. But the question remains: what kind of state shall this be? The legacy of the Medici offers one path: a patronage state where banking wealth fuels artistic genius and political control flows through cultural supremacy. Florence's palazzi, its academies, its banks would be the instruments of power.\n\nYet the thriving port of Livorno suggests another destiny. Its free port charter, welcoming merchants of every faith and nation, has created a cosmopolitan trading hub unlike any other in Italy. Open doors and religious tolerance could make Tuscany the commercial heart of the Mediterranean.\n\nThe grand duke must choose the soul of the new state.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tus.1.a: "Florence est la plus grande mécène du monde. Laissons nos banques et nos artistes gouverner."
 nd_tus.1.b: "Livourne montre l'avenir. Ouvrez nos ports à tous ceux qui souhaitent faire du commerce."
 nd_tus.2.t: "Les chevaliers de Santo Stefano"
 nd_tus.2.d: "In 1561, Grand Duke Cosimo I founded the Order of Saint Stephen, a military-religious order headquartered in Pisa's magnificent Palazzo dei Cavalieri. Commanded by the grand duke himself, the knights operate a dedicated galley fleet from Portoferraio on Elba and the growing port of Livorno. Their galleys have already struck against Barbary pirates at the siege of Malta and the Battle of Lepanto.\n\nThe order's purpose is clear: to combat Ottoman and Barbary threats in the Mediterranean. But the grand duke must decide the order's emphasis. Should the knights pursue aggressive crusading warfare, raiding the coast of North Africa in the name of Christendom? Or should they focus on disciplined patrol and escort duties, protecting Tuscan merchant shipping from corsair attacks?"
 nd_tus.2.a: "La croix exige une offense. Que les chevaliers attaquent la côte de Barbarie !"
 nd_tus.2.b: "Nos commerçants ont besoin d’eaux sûres. Patrouillez les voies commerciales."
 nd_tus.3.t: "Le Code Léopoldine"
 nd_tus.3.d: "On November 30, 1786, Grand Duke Peter Leopold promulgated what the world will come to know as the Leopoldine Code: a revolutionary reform of criminal law inspired by Cesare Beccaria's writings on crimes and punishments. Tuscany has become the first sovereign state in the modern world to abolish the death penalty and the use of torture.\n\nThe code does not stop at abolition. It reorganizes the entire system of criminal justice: standardizing procedures, requiring public trials, establishing proportional sentencing, and ending the practice of confiscation of criminals' property. The new code reflects an Enlightenment conviction that punishment should reform, not destroy.\n\nAcross Europe, philosophers and reformers celebrate Tuscany as a beacon of enlightened governance."
 nd_tus.3.a: "La justice tempérée par la raison sera notre héritage."
 nd_tus.4.t: "Les Médicis et la Renaissance"
 nd_tus.4.d: "Under the patronage of Cosimo de' Medici and his grandson Lorenzo il Magnifico, Florence has become the undisputed cultural capital of Europe. Brunelleschi's dome crowns the cathedral, Botticelli's paintings adorn the churches, and Marsilio Ficino translates Plato in the gardens of the Villa Careggi.\n\nThis is no mere love of beauty. The Medici understand that artistic patronage is political power made visible. Every fresco, every sculpture, every commissioned manuscript proclaims Florence's supremacy to visiting ambassadors and rival courts alike. The Platonic Academy, the workshops of Verrocchio, the libraries of San Marco: these are the instruments through which Tuscany reshapes how the world thinks."
 nd_tus.4.a: "La beauté est le pouvoir et Florence est son trône."
 nd_tus_commune_tradition: "Tradition communale"
 nd_tus_commune_tradition_desc: "Les cités-États toscanes se gouvernaient elles-mêmes par des conseils élus et des chartes communales bien avant l'ère des princes, établissant une tradition de participation civique et de gouvernance républicaine."
 nd_tus_arte_della_seta: "Art de la Seta"
 nd_tus_arte_della_seta_desc: "La guilde de la soie de Florence, héritière des traditions artisanales de Lucques après son sac en 1314, a transformé la Toscane en le premier producteur européen de soieries de luxe."
 nd_tus_tower_defense: "Maisons-tours toscanes"
 nd_tus_tower_defense_desc: "Les maisons-tours en pierre de San Gimignano, Volterra et Florence servaient à la fois de résidences aristocratiques et de points forts fortifiés lors des guerres de factions de la Toscane médiévale."
 nd_tus_pisan_maritime: "Patrimoine maritime pisan"
 nd_tus_pisan_maritime_desc: "Avant que Venise et Gênes ne l'éclipsent, Pise était l'une des principales républiques maritimes d'Italie, ses galères dominant la Méditerranée occidentale et ses marchands faisant du commerce de Barcelone à Tunis."
 nd_tus_medici_banking: "Banque Médicis"
 nd_tus_medici_banking_desc: "La Banque Médicis, fondée en 1397 par Giovanni di Bicci de' Medici, a été la pionnière de la comptabilité en partie double, de la lettre d'échange et de la société holding, des innovations qui ont fait de Florence la capitale financière de l'Europe."
 nd_tus_renaissance_patronage: "Mécénat de la Renaissance"
 nd_tus_renaissance_patronage_desc: "Les Médicis ont transformé la richesse politique en suprématie culturelle, chargeant Brunelleschi, Donatello, Botticelli et Michel-Ange de créer des œuvres qui ont défini la Renaissance."
 nd_tus_condottiere_tradition: "Condotière Tradition"
 nd_tus_condottiere_tradition_desc: "De la Compagnie Blanche de John Hawkwood à l'infanterie à bandes noires de Giovanni dalle Bande Nere, la Toscane était au centre de la tradition de la guerre mercenaire italienne."
 nd_tus_florentine_diplomacy: "Diplomatie florentine"
 nd_tus_florentine_diplomacy_desc: "La diplomatie de l'équilibre des pouvoirs de Lorenzo de Médicis a maintenu la paix entre les États italiens pendant des décennies, ce qui lui a valu le titre de « il Magnifico » et a établi Florence comme arbitre diplomatique de l'Italie."
 nd_tus_santo_stefano_order: "Chevaliers de Santo Stefano"
 nd_tus_santo_stefano_order_desc: "Fondé par Cosme Ier en 1561, cet ordre naval de croisade opérait depuis Pise et Portoferraio, ses galères combattant les menaces ottomanes et barbaresques à travers la Méditerranée."
 nd_tus_livorno_free_port: "Port franc de Livourne"
 nd_tus_livorno_free_port_desc: "Ferdinand Ier a déclaré Livourne port franc dans les années 1590, accueillant des Juifs séfarades persécutés, des marchands arméniens et des commerçants de toutes confessions, créant ainsi la ville la plus cosmopolite d'Italie."
 nd_tus_trace_italienne: "Trace Italienne"
 nd_tus_trace_italienne_desc: "Les architectes militaires toscans ont été les pionniers du fort en étoile, la Fortezza da Basso à Florence et les bastions de Portoferraio sur l'île d'Elbe représentant l'avant-garde de la fortification de la Renaissance."
 nd_tus_tuscan_printing: "Impression toscane"
 nd_tus_tuscan_printing_desc: "Les imprimeurs florentins ont diffusé la littérature humaniste et vernaculaire à travers l’Europe, faisant de l’italien toscan la langue prestigieuse de l’érudition et des lettres."
 nd_tus_grand_ducal_state: "État grand-ducal"
 nd_tus_grand_ducal_state_desc: "La consolidation du pouvoir par Cosme Ier (absorption de Sienne, centralisation de l'administration, création de tribunaux ducaux) a transformé la mosaïque de communes toscanes en un État territorial moderne."
 nd_tus_elba_naval_base: "Base navale de l'Elbe"
 nd_tus_elba_naval_base_desc: "Cosme Ier acheta l'île d'Elbe à Gênes en 1548 et développa Portoferraio en une base navale fortifiée, projetant la puissance toscane à travers la mer Tyrrhénienne."
 nd_tus_carrara_marble: "Marbre de Carrare"
 nd_tus_carrara_marble_desc: "Le marbre blanc de Carrare, exploité depuis l'époque romaine, a fourni le David de Michel-Ange, les chefs-d'œuvre du Bernin et d'innombrables bâtiments de la Renaissance, faisant de la Toscane l'atelier de l'architecture européenne."
 nd_tus_crusca_academy: "Académie de la Crusca"
 nd_tus_crusca_academy_desc: "Fondée en 1583, l'Accademia della Crusca a créé le premier dictionnaire vernaculaire, faisant du toscan la forme standard de la langue italienne et un modèle pour les académies linguistiques à travers l'Europe."
 nd_tus_leopoldine_code: "Code Léopoldine"
 nd_tus_leopoldine_code_desc: "Le code pénal du grand-duc Pierre Léopold de 1786 fut le premier dans le monde moderne à abolir la peine de mort et la torture, faisant de la Toscane un phare de la jurisprudence des Lumières."
 nd_tus_maremma_drainage: "Drainage de la Maremme"
 nd_tus_maremma_drainage_desc: "Le drainage systématique des marais paludéens de la Maremme, commencé sous les Médicis et étendu par la Maison de Lorraine, a transformé de vastes étendues de marécages en terres agricoles productives."
 nd_tus_tuscan_viticulture: "Viticulture toscane"
 nd_tus_tuscan_viticulture_desc: "Les domaines viticoles toscans, les fattorie, ont perfectionné la production du Chianti, de la Vernaccia et du Vino Nobile, faisant des vins toscans célébrés dans toutes les cours d'Europe."
 nd_tus_risorgimento_spirit: "Risorgimento toscan"
 nd_tus_risorgimento_spirit_desc: "La tradition de réforme éclairée et d'expérimentation constitutionnelle du Grand-Duché a fait de la Toscane un terrain fertile pour les idées d'éveil national italien."
 nd_tus_straw_hat_industry: "Industrie du chapeau de paille"
 nd_tus_straw_hat_industry_desc: "Les chapeaux de paille florentins sont devenus une industrie d'exportation majeure aux XVIIIe et XIXe siècles, les paysannes toscanes tissant des tresses de paille de blé pour fabriquer des couvre-chefs à la mode vendus dans toute l'Europe."
 nd_tus_scientific_legacy: "L'héritage scientifique toscan"
 nd_tus_scientific_legacy_desc: "Des observations télescopiques de Galilée au baromètre de Torricelli en passant par la méthode expérimentale de l'Académie du Ciment, la Toscane était à l'avant-garde de la révolution scientifique."
 a_nd_tus_bande_nere: "Bande Nère"
 a_nd_tus_bande_nere_desc: "Infanterie de choc d'élite issue des célèbres compagnies à bandes noires de Giovanni dalle Bande Nere, connues pour leur agressivité et leur rapidité de combat."
 n_nd_tus_santo_stefano_galley: "Cuisine Santo Stefano"
 n_nd_tus_santo_stefano_galley_desc: "Galères rapides et bien armées des chevaliers de Santo Stefano, conçues pour attaquer les corsaires barbaresques et patrouiller la mer Tyrrhénienne."
 nd_tus_silk_workshop: "Atelier de la Soie"
 nd_tus_silk_workshop_desc: "Un setificio dans la tradition florentine, tissant de la soie grège et des teintures pour obtenir le tissu le plus fin d'Europe."
 nd_tus_silk_weaving: "Tissage de la soie toscane"
 nd_tus_silk_weaving_desc: "L'art du tissage de la soie, hérité des maîtres luccains et perfectionné par la guilde florentine Arte della Seta."
 nd_tus_casa_torre: "Maison Torre"
 nd_tus_casa_torre_desc: "Une maison-tour fortifiée en pierre de style toscan, servant à la fois de résidence noble et de point fort défensif."
 nd_tus_tower_upkeep: "Garnison de la tour"
 nd_tus_tower_upkeep_desc: "Une petite garnison maintient les défenses de la tour, armée d'épées, d'arbalètes et d'armes à feu."
 nd_tus_banco_medici: "Banque Médicis"
 nd_tus_banco_medici_desc: "Une succursale de la grande banque florentine, offrant des dépôts, des lettres de change et des prêts aux marchands et aux princes."
 nd_tus_banking_operations: "Opérations bancaires"
 nd_tus_banking_operations_desc: "Les commis tiennent les grands livres, traitent les lettres de change et reçoivent les clients en tenue élégante, gérant ainsi les flux de capitaux à travers le réseau de la banque."
 nd_tus_porto_franco: "Porto-Franco"
 nd_tus_porto_franco_desc: "Un port franc dans la tradition livournaise, où les marchands de toutes nations et confessions commercent sans barrières douanières."
 nd_tus_free_port_operations: "Opérations du port franc"
 nd_tus_free_port_operations_desc: "Les entrepôts et les comptoirs desservent les diverses communautés marchandes, stockant du tissu, des documents papier et du sel pour la conservation des cargaisons."
 nd_tus_fortezza: "Fortezza"
 nd_tus_fortezza_desc: "Un fort étoilé trace italienne moderne dans le style toscan, avec des bastions inclinés conçus pour dévier les boulets de canon."
 nd_tus_fortezza_upkeep: "Garnison de la forteresse"
 nd_tus_fortezza_upkeep_desc: "La garnison professionnelle occupe les bastions, entretenant l'artillerie, les armes blanches et les mousquets pour défendre la trace italienne."
 nd_tus_naval_arsenal: "Arsenal naval toscan"
 nd_tus_naval_arsenal_desc: "Un chantier naval fortifié dans la tradition de Portoferraio, où est construite et entretenue la flotte grand-ducale."
 nd_tus_arsenal_upkeep: "Opérations d'Arsenal"
 nd_tus_arsenal_upkeep_desc: "Les charpentiers maintiennent l'arsenal opérationnel avec du bois, des provisions navales et des outils en fer, construisant et réparant les galères de la flotte toscane."
 nd_tus_marble_quarry: "Carrière de Carrare"
 nd_tus_marble_quarry_desc: "Site d'extraction du légendaire marbre blanc de Carrare, prisé des sculpteurs et des architectes depuis l'Antiquité."
 nd_tus_marble_extraction: "Extraction de marbre"
 nd_tus_marble_extraction_desc: "Des équipes de carriers extraient des blocs de marbre des Alpes Apuanes, les taillent et les façonnent pour les transporter vers les ateliers et les chantiers de construction."
 nd_tus_fattoria: "Fattoria"
 nd_tus_fattoria_desc: "Un domaine agricole toscan centré sur la viticulture, produisant les célèbres vins du Chianti et des collines environnantes."
 nd_tus_wine_production: "Production de vin"
 nd_tus_wine_production_desc: "Les raisins sont récoltés, pressés et fermentés selon des générations de tradition viticole toscane."
 nd_tus_cappelleria: "Cappelleria"
 nd_tus_cappelleria_desc: "Un atelier produisant les célèbres chapeaux de paille florentins, tissés à partir de paille de blé cultivée localement et teints dans des couleurs à la mode."
 nd_tus_hat_making: "Fabrication de chapeaux"
 nd_tus_hat_making_desc: "Les artisans tressent la paille, façonnent le corps des chapeaux et appliquent des teintures de finition pour produire les chapeaux légers appréciés sur les marchés européens."
 levy_nd_tus_bande_nere: "Bande Nère Lévy"
 levy_nd_tus_bande_nere_desc: "Infanterie de levée dans la tradition des compagnies à bandes noires de Giovanni dalle Bande Nere."
 nd_tus_osservatorio: "Osservatoire"
 nd_tus_osservatorio_desc: "Observatoire astronomique et académie scientifique dans la tradition de Galilée, équipé de télescopes et d'instruments de philosophie naturelle."
 nd_tus_observatory_upkeep: "Opérations de l'Observatoire"
 nd_tus_observatory_upkeep_desc: "Les lentilles, le papier et l'encre soutiennent le programme d'observation céleste et de publication scientifique de l'observatoire."
 nd_tus_formed_tt: "La Toscane s'est formée"
 nd_tus_path_a_tt: "Choisissez le Palais des Médicis"
 nd_tus_path_b_tt: "Choisissez l'esprit du Porto Franco"
 nd_tus_destiny: "Destin toscan"
 nd_tus_destiny_desc: "Le Grand-Duché est forgé, mais que va-t-il devenir ? La stabilité et la détermination doivent guider le nouvel État avant qu’il puisse poursuivre ses ambitions."
 nd_tus_dest_dominio_1: "La conquête de Sienne"
 nd_tus_dest_dominio_1_desc: "Cosimo I's absorption of the Republic of Siena in 1559 marked the true unification of Tuscany. Extend Medici dominion over Perugia and Urbino, and raise a Fortezza to hold what is taken, as Cosimo did at Siena."
 nd_tus_dest_dominio_2: "Les Clés de Saint Pierre"
 nd_tus_dest_dominio_2_desc: "Deux Médicis étaient assis sur le trône de Saint-Pierre. Maintenant, placez Rome elle-même sous la domination toscane, réalisant ainsi l'ambition ultime de la dynastie de contrôler à la fois le pouvoir temporel et spirituel en Italie."
 nd_tus_dest_dominio_3: "Rex Italie"
 nd_tus_dest_dominio_3_desc: "De la baie de Naples au port de Gênes, des tours de Bologne aux collines de Florence, unissez la péninsule italienne sous la couronne toscane et revendiquez l'ancien titre de roi d'Italie."
 nd_tus_dest_commercio_1: "Le miracle livournais"
 nd_tus_dest_commercio_1_desc: "La charte du port franc de Ferdinand Ier a transformé un village de pêcheurs en la ville la plus cosmopolite d'Italie. Adoptez le système bancaire moderne et assurez la circulation de la soie sur les marchés toscans pour reproduire ce miracle dans tout le royaume."
 nd_tus_dest_commercio_2: "Emporium des nations"
 nd_tus_dest_commercio_2_desc: "Livorno's warehouses groan with cloth from Flanders, spices from the Levant, and coral from Sardinia. Build Livorno up from its marsh into a great port and ensure cloth reaches every market to establish the grand duchy as a trade crossroads."
 nd_tus_dest_livorno_developed_tt: "We own #bold Livorno#! and its development is at least #bold 38#!"
 nd_tus_dest_commercio_3: "Entrepôt de la Méditerranée"
 nd_tus_dest_commercio_3_desc: "Contrôlez les voies maritimes de la Corse aux côtes italiennes, maîtrisez les institutions du commerce mondial et remplissez le trésor jusqu'à l'éclatement. La Toscane sera le cœur commercial de toute la Méditerranée."
 nd_tus.5.t: "Un nouveau chapitre pour la Toscane"
 nd_tus.5.d: "Les communes et seigneuries dispersées de Toscane ont été soudées en un seul État. La bannière du grand-duc flotte sur chaque campanile, et les trésors de Florence, de Pise et de Sienne sont enfin réunis. Mais l’unification n’est que le fondement ; c’est ce que nous bâtissons sur cette base qui définira notre héritage. Le Grand-Duché se trouve à un carrefour de l’histoire et les choix à venir façonneront le destin de notre peuple pour les siècles à venir."
 nd_tus.5.a: "Notre destin nous attend."
 nd_tus.6.t: "Italie centrale sécurisée"
 nd_tus.6.d: "Les bannières du grand-duché flottent désormais sur Pérouse et Urbino. Là où autrefois les États pontificaux et les petits seigneurs dominaient les vertes collines de l'Ombrie et des Marches, l'autorité toscane règne désormais en maître. La route vers Rome est ouverte et le vieux rêve d’unification italienne sous une couronne unique se rapproche chaque année de la réalité."
 nd_tus.6.a: "Le cœur de l'Italie bat à Florence."
 nd_tus.7.t: "Rome tombe aux mains du Grand-Duc"
 nd_tus.7.d: "La Ville éternelle, siège des papes et des césars, répond désormais au Grand-Duc de Toscane. Deux papes Médicis dirigeaient autrefois la chrétienté depuis ces salles ; maintenant, la dynastie revendique Rome par le droit des armes plutôt que par le conclave. Mais gouverner Rome exige un choix. Le grand-duc imposera-t-il l'autorité toscane par le biais d'une occupation militaire et d'un contrôle direct, écrasant tout vestige de l'indépendance papale ? Ou doit-il gouverner avec subtilité, en utilisant le prestige ancien de la ville pour légitimer la puissance toscane par la finesse diplomatique ?"
 nd_tus.7.a: "Rome connaîtra une poigne de fer toscane."
 nd_tus.7.b: "Un gant de velours cache la véritable main du pouvoir."
 nd_tus.8.t: "Roi d'Italie"
 nd_tus.8.d: "Des pentes fumantes du Vésuve aux ports de la côte ligure, des riches plaines d'Émilie aux carrières de marbre de chez nous, l'Italie est unie sous la couronne toscane. Aucun État italien n’y est parvenu depuis l’époque de la République romaine. Le grand-duc doit désormais décider du caractère de ce nouveau royaume italien. Sera-t-elle forgée dans le fer, une puissance militaire qui impose le respect par la force de ses armées ? Ou doit-elle englober les divers peuples de la péninsule, gouvernant par l’intégration et la prospérité partagée dans une véritable Pax Italica ?"
 nd_tus.8.a: "L'Italie sera unie par l'épée et gardée par elle."
 nd_tus.8.b: "Une paix durable nécessite le consentement, pas seulement la conquête."
 nd_tus.9.t: "Le miracle de Livourne"
 nd_tus.9.d: "Les marchés toscans bourdonnent du bruissement de la soie et du tintement des florins. Les banques de Florence ont adopté les instruments financiers modernes, et les métiers à tisser de Lucques et de Prato filent l'or à partir de fils. Les marchands de toute la Méditerranée affluent vers les ports toscans, attirés par la promesse d’un commerce équitable et ouvert. Ce que Ferdinando Ier a commencé avec la Leggi Livornine s'est transformé en une révolution commerciale."
 nd_tus.9.a: "Notre richesse est notre pouvoir."
 nd_tus.10.t: "Carrefour du Commerce"
 nd_tus.10.d: "Le grand-duché est devenu un véritable empire des nations. Les tissus toscans s'échangent de Londres à Constantinople, et les entrepôts de Livourne regorgent de marchandises provenant de tous les coins du monde connu. Le grand-duc doit maintenant décider du caractère de cet empire commercial. La Toscane doit-elle investir dans des entrepôts, des ateliers et des infrastructures physiques pour faire face au flot du commerce ? Ou doit-elle développer des instruments financiers sophistiqués (banque, assurance et crédit) pour gérer la complexité croissante du commerce méditerranéen ?"
 nd_tus.10.a: "Construisez les entrepôts. Laissez les marchandises circuler à travers la Toscane."
 nd_tus.10.b: "Affiner le comptoir. Laissons l’or travailler pour nous."
 nd_tus.11.t: "Coeur de la Méditerranée"
 nd_tus.11.d: "Des quais de Livourne aux comptoirs de Florence, des détroits de Corse aux ports de marbre de Home, la Toscane domine les artères commerciales de la Méditerranée. Les navires de toutes les nations recherchent les ports toscans et les douaniers du grand-duc perçoivent des droits sur la moitié du commerce entre l'Est et l'Ouest. Le grand-duché doit désormais décider de sa philosophie commerciale. Doit-il défendre le libre-échange, en ouvrant tous les marchés et en réduisant les barrières pour créer le plus grand volume de commerce possible ? Ou doit-elle adopter une vision cosmopolite, en investissant dans les diverses communautés qui rendent les ports toscans uniques et en transformant l'ouverture culturelle en avantage concurrentiel ?"
 nd_tus.11.a: "Le libre-échange enrichit tout le monde. Abaissez toutes les barrières."
 nd_tus.11.b: "Notre diversité est notre force. Nourrissez chaque communauté."
 STATIC_MODIFIER_NAME_nd_tus_dest_iron_fist: "Poing de fer des Médicis"
 STATIC_MODIFIER_DESC_nd_tus_dest_iron_fist: "Tuscan authority is imposed by force of arms. The grand duke's soldiers garrison every town, and resistance to Medici rule is met with swift retribution. The clergy of the occupied city are not reconciled."
 STATIC_MODIFIER_NAME_nd_tus_dest_velvet_glove: "Gant de velours"
 STATIC_MODIFIER_DESC_nd_tus_dest_velvet_glove: "Le grand-duc règne par l'intelligence et l'intrigue. Les espions florentins surveillent chaque cour d'Italie et les diplomates toscans obtiennent des traités favorables grâce à leur charme et leur ruse."
 STATIC_MODIFIER_NAME_nd_tus_dest_imperial_crown: "Couronne impériale d'Italie"
 STATIC_MODIFIER_DESC_nd_tus_dest_imperial_crown: "L'armée toscane est l'instrument de l'unité italienne. Endurcis par des décennies de campagnes à travers la péninsule, ses vétérans forment l’épine dorsale d’une puissance militaire qui rivalise avec les grands royaumes d’Europe."
 STATIC_MODIFIER_NAME_nd_tus_dest_pax_italica: "Pax Italica"
 STATIC_MODIFIER_DESC_nd_tus_dest_pax_italica: "Le grand-duc dirige une Italie unie non pas par la peur mais par une prospérité partagée. Les peuples soumis trouvent leurs coutumes respectées et leurs communautés intégrées dans le tissu de l'État toscan."
 STATIC_MODIFIER_NAME_nd_tus_dest_warehouse: "Entrepôt des Nations"
 STATIC_MODIFIER_DESC_nd_tus_dest_warehouse: "Les ports toscans regorgent des biens physiques de la moitié du monde. Les entrepôts, ateliers et manufactures transforment des matières premières provenant de tous les coins de la Méditerranée en produits finis destinés aux marchés européens."
 STATIC_MODIFIER_NAME_nd_tus_dest_counting_house: "Maison de comptage florentine"
 STATIC_MODIFIER_DESC_nd_tus_dest_counting_house: "Les banques de Florence ont perfectionné l’art de faire fructifier l’argent. Les lettres de change, les assurances maritimes et les instruments de crédit sophistiqués assurent le bon déroulement du commerce toscan."
 STATIC_MODIFIER_NAME_nd_tus_dest_free_trade: "Champions du libre-échange"
 STATIC_MODIFIER_DESC_nd_tus_dest_free_trade: "La Toscane a ouvert ses ports à toutes les nations. L'engagement du grand-duc en faveur d'un commerce sans restriction attire des marchands des quatre coins du monde et les navires toscans naviguent librement sur toutes les voies maritimes."
 STATIC_MODIFIER_NAME_nd_tus_dest_cosmopolitan: "Vision cosmopolite"
 STATIC_MODIFIER_DESC_nd_tus_dest_cosmopolitan: "Le grand-duché prospère grâce aux talents de sa population diversifiée. Les financiers séfarades, les marchands arméniens, les marins grecs et les facteurs anglais contribuent tous à la dynamique de la vie commerciale toscane."
 nd_tus_palazzo_ducale: "Palais Ducal"
 nd_tus_palazzo_ducale_desc: "Le palais grand-ducal, siège du pouvoir des Médicis, où le destin de l'Italie se décide dans des salles de marbre ornées des plus beaux arts de la Renaissance."
 nd_tus_ducal_court: "Cour Ducale"
 nd_tus_ducal_court_desc: "Les scribes, les courtisans et les ministres assistent le grand-duc dans des chambres meublées des plus belles soieries et des meubles sculptés, assurant l'administration du royaume."
 nd_tus_fondaco: "Fondaco"
 nd_tus_fondaco_desc: "Un entrepôt de commerce international et d'échange dans la tradition vénitienne, où les marchands de toutes les nations stockent des marchandises, négocient des contrats et règlent leurs comptes."
 nd_tus_fondaco_operations: "Opérations Fondaco"
 nd_tus_fondaco_operations_desc: "Les magasiniers gèrent les stocks de tissus et de sel, les commis enregistrent les transactions sur papier et les outilleurs entretiennent l'équipement mécanique de l'échange."

 # ===== BUREAUCRACIES =====
 tus_signoria_bureaucracy: "Signoria delle Arti"
 tus_signoria_bureaucracy_desc: "Les prieurs exécutifs de la commune florentine, tirés au sort parmi les corporations majeures et mineures pour des mandats de deux mois. Les Ordinamenti di Giustizia de Giano della Bella de 1293 ont officialisé la Signoria des neuf et ont interdit aux clans magnati d'exercer leurs fonctions. Sous les régimes des Albizzi et des Médicis, l'institution a survécu jusqu'à ce qu'Alexandre de Médicis soit nommé duc héréditaire en 1532, définissant l'identité républicaine florentine pendant deux siècles et demi."
 tus_otto_di_guardia_bureaucracy: "Otto de Guardia et Balia"
 tus_otto_di_guardia_bureaucracy_desc: "Magistrature permanente de la sécurité publique de Florence, fondée le 2 septembre 1378 après la révolte de Ciompi et rendue permanente le 21 janvier 1380. Huit citoyens issus des guildes ont poursuivi les crimes politiques, le vol et le désordre dans toute Florence et son contado depuis le Palazzo del Podesta. Après 1537, Cosimo Ier la transforma en tribunal pénal central du Grand-Duché et en principal instrument du contrôle des Médicis sur la Toscane."
 tus_pupilli_bureaucracy: "Magistrat des élèves"
 tus_pupilli_bureaucracy_desc: "Les Officiers de Quartiers et Adultes, créés le 30 juillet 1393 pour prendre le relais des Officiers du Monte, dans la protection des orphelins dont le père était mort intestat, des veuves et des adultes handicapés mentaux ou physiques. La magistrature administrait les successions, exécutait les testaments et jugeait les affaires civiles et pénales impliquant ses pupilles. Continue depuis la République en passant par le Principato et jusqu'aux réformes lorraines, c'était une institution civique florentine distincte."
 tus_monte_comune_bureaucracy: "Monte Comune"
 tus_monte_comune_bureaucracy_desc: "La dette publique florentine a été consolidée, fondée en 1343 en fusionnant les prestanze (prêts forcés) en un fonds unique payant cinq pour cent en luoghi transférables. Ce fut la première véritable dette publique de l'Europe chrétienne et le moteur financier des guerres de la République. Le Monte delle Doti, ajouté en 1425, permettait aux pères de déposer des dots pour leurs filles à naître à intérêts composés, remboursables lors du mariage. Ensemble, les Monti liaient la fortune des familles florentines à la solvabilité de la commune."
 tus_banco_mediceo_bureaucracy: "Banque Médicale"
 tus_banco_mediceo_bureaucracy_desc: "La Banque Médicis, fondée par Giovanni di Bicci le 1er octobre 1397 et portée à son apogée par Cosimo il Vecchio entre 1429 et 1464. À son apogée, elle exploitait des succursales à Rome, Venise, Genève, Lyon, Bruges, Londres, Avignon, Pise et Milan, était le principal banquier de la papauté et garantissait les industries de la laine et de la soie. Son effondrement sous la mauvaise gestion de Lorenzo en 1494 affaiblit la dynastie, mais le réseau financier toscan qu'elle avait construit persista comme modèle pour l'appareil bancaire grand-ducal."
 tus_mercanzia_bureaucracy: "Tribunal de Mercanzia"
 tus_mercanzia_bureaucracy_desc: "Le tribunal de commerce de Florence, créé en 1308 pour arbitrer les différends entre les membres des cinq grandes corporations et entre les Florentins et les marchands étrangers. Ses juges, issus de l'Arti, appliquaient la coutume marchande (lex mercatoria) au droit civil en matière d'assurance, de société, de faillite et de lettres de change. L'Universita de la Mercanzia a donné au commerce florentin la prévisibilité juridique qui a rendu possible le commerce du Banco Mediceo et du textile toscan dans toute la chrétienté latine."
 tus_studio_pisano_bureaucracy: "Studio de Pise"
 tus_studio_pisano_bureaucracy_desc: "L'université toscane. La bulle de Boniface VIII du 3 septembre 1343 affrète le Studium Generale de Pise, et Laurent de Médicis le refonde le 1er novembre 1473 en transférant la plupart des facultés du Studio Fiorentino, consolidant délibérément l'enseignement supérieur toscan dans un seul siège. Galilée occupa la chaire de mathématiques de 1589 à 1592 et Cosme II le nomma philosophe de la cour en 1610 ; les facultés de droit et de médecine du Studio ont façonné une génération de juristes et de médecins italiens."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_tus_bureaucracy_authority: "Autorité bureaucratique toscane"
 AUTO_MODIFIER_DESC_nd_tus_bureaucracy_authority: "The magistracies, monti and councils inherited from the Florentine commune and the other communes of Tuscany are kept as offices of the state. Tuscany can sustain four more standing institutions."
