l_french:
 # ============================================================
 # Country name overrides (set via change_country_name)
 # ============================================================
 TDR_REGNUM: "Bosporus"
 TDR_REGNUM_ADJ: "Bosporan"
 TDR_CIMMERIAN: "Cimmerian Bosporus"
 TDR_CIMMERIAN_ADJ: "Cimmérien"
 # ============================================================
 # Variable tooltips (referenced by hidden_effect set_variable lines)
 # ============================================================
 nd_tdr_formed_tt: "Le royaume du Bosphore a été formé"
 nd_tdr_path_a_tt: "Choisissez Regnum Bospori"
 nd_tdr_path_b_tt: "Choisissez le Bosphore Cimmérien"

 # ============================================================
 # Formation event nd_tdr.1
 # ============================================================
 nd_tdr.1.t: "Héritier de la rive pontique"
 nd_tdr.1.d: "After generations of holding the cliff fortress of Mangup against Genoese, Tatar, and Ottoman alike, our princes summon the council. Their domain has the bones of two states sleeping beneath it: the ancient Bosporan Kingdom of the Spartocids, the Greek polis founded on the Cimmerian Strait twenty centuries past, and the Crimean Gothic principality of Theodoro that has shielded Pontic Orthodoxy since the days of Justinian I.\n\nWhich heritage shall the new realm honour as its founding fiction? The court is split. The Greek archons argue for a Roman Regnum Bospori, an heir of Eupator and Mithridates that can speak with Constantinople and Venice as a peer. The Gothic primates and the cliff-village dynasts argue for the Cimmerian Bosporus of John of Gothia, a mountain kingdom of mixed peoples bound by Orthodox faith and the iron of Mangup.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tdr.1.a: "Regnum Bospori - héritiers de Mithridate et de Rome"
 nd_tdr.1.b: "Bosphore Cimmérien - royaume des peuples montagnards"

 # ============================================================
 # Formation timed modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_tdr_regnum_bospori: "Regnum du Bosphore"
 STATIC_MODIFIER_DESC_nd_tdr_regnum_bospori: "La cour se présente comme héritière des anciens rois du Bosphore et du protectorat romain tardif sur la côte cimmérienne. Diplomates méditerranéens et marchands orthodoxes se réunissent à Mangup."

 STATIC_MODIFIER_NAME_nd_tdr_cimmerian_bosporus: "Bosphore cimmérien"
 STATIC_MODIFIER_DESC_nd_tdr_cimmerian_bosporus: "Goth, Greek, Alan et Cuman jurent ensemble sur la falaise de Mangup. Les garnisons de montagne abritent un royaume frontalier ouvert à tous ceux qui professent l'orthodoxie pontique."

 # ============================================================
 # DHE event nd_tdr.2: The Cliff of Mangup
 # ============================================================
 nd_tdr.2.t: "La falaise de Mangup"
 nd_tdr.2.d: "Our masons climb the goat paths to the plateau above Choros and Tabana-Dere, marking the line of the great Justinianic curtain wall. The cyclopean stones are still in place where the engineers of the basileus Justinian I laid them in the 540s; whole generations of refugees have sheltered here since. The new fortifications double the curtain, raise the bastions of Tabana-Dere, and seat a permanent garrison in the Octagonal Citadel above the Karaim quarter.\n\nIn the cisterns and rock-cut barracks the question is asked: shall the cliff be a gate, holding the line where Goth and Greek meet steppe, or a hearth, a refuge whose gates open to anyone the raids drive uphill?"
 nd_tdr.2.a: "Tenez la ligne : fortifications des falaises et garnison permanente"
 nd_tdr.2.b: "Ouvrez les portes - refuge pour les réfugiés de la steppe et de la mer"

 STATIC_MODIFIER_NAME_nd_tdr_cliff_garrison: "Garnison des falaises de Mangup"
 STATIC_MODIFIER_DESC_nd_tdr_cliff_garrison: "Les garnisons debout dans les forteresses des falaises font des hautes terres un piège mortel pour tout envahisseur qui tente de grimper."

 STATIC_MODIFIER_NAME_nd_tdr_refugee_haven: "Refuge de falaise"
 STATIC_MODIFIER_DESC_nd_tdr_refugee_haven: "Le plateau rassemble les réfugiés des razzias et de la famine, mélangeant les peuples et réensemençant les villages de plaine."

 # ============================================================
 # DHE event nd_tdr.3: The Komnenoid Inheritance
 # ============================================================
 nd_tdr.3.t: "L'héritage comnénoïde"
 nd_tdr.3.d: "The Gabras court at Mangup commissions a genealogy traced through the Komnenodoukai: from Demetrios Palaiologos-Gabras the founder, back through the Pontic Komnenoi of Trebizond, back at last to Alexios I and the imperial house of Constantinople itself. Whether by blood or by adoption, the line stands written.\n\nThe court must decide how to wield it. Some argue for sealing the claim with imperial ceremonial, dressing the Mangup princes in purple as small-scale basileis, projecting prestige inward. Others argue the claim is currency, to be spent on cousinly marriages with the Trapezuntine Komnenoi, the Tocchi of Epirus, the Crimean Tatar nobility, and the Italian houses of the Pontic shore."
 nd_tdr.3.a: "Habillez les princes de pourpre impérial"
 nd_tdr.3.b: "Épousez la lignée dans chaque cour de la rive pontique"

 STATIC_MODIFIER_NAME_nd_tdr_purple_lineage: "Lignée violette"
 STATIC_MODIFIER_DESC_nd_tdr_purple_lineage: "La cour de Mangup ritualise sa descendance des Komnenoi comme une petite basileia romaine."

 STATIC_MODIFIER_NAME_nd_tdr_dynastic_marriages: "Mariages dynastiques"
 STATIC_MODIFIER_DESC_nd_tdr_dynastic_marriages: "Les princesses théodorites se marient dans les cours tatares, italiennes et grecques pontiques, tissant ainsi le royaume en un réseau de cousins."

 # ============================================================
 # DHE event nd_tdr.4: The Tauric Emporion
 # ============================================================
 nd_tdr.4.t: "L'Emporion taurique"
 nd_tdr.4.d: "Cherson, Caffa, Soldaia, Avlita: the harbour towns of the Tauric coast hum again. Genoese galleys take on grain, Venetian carracks on caviar and beeswax, Tatar caravans on Russian furs and slaves bound for the markets of Cairo. The Bosporan king's customs officers sit in the funduq at Caffa with their Greek scribes and their Genoese counterparts, and the toll-books of Mangup grow fatter every season.\n\nWhich vein shall the kingdom plough deepest? The grain fleet to Constantinople and the Aegean, sustaining Pontic Orthodoxy with bread? Or the caravan road to the steppe and beyond, drawing Russian, Volga, and Persian goods through the Tauric markets?"
 nd_tdr.4.a: "Flotte céréalière vers la mer Égée"
 nd_tdr.4.b: "Caravanes dans la steppe"

 STATIC_MODIFIER_NAME_nd_tdr_grain_fleet: "Flotte céréalière taurique"
 STATIC_MODIFIER_DESC_nd_tdr_grain_fleet: "Le blé de Crimée nourrit en volume le monde grec égéen ; Les navires du Bosphore naviguent avec du grain et reviennent avec de l'argent."

 STATIC_MODIFIER_NAME_nd_tdr_steppe_caravans: "Caravanes des steppes"
 STATIC_MODIFIER_DESC_nd_tdr_steppe_caravans: "La route de Caffa à Saray et au-delà amène les marchandises russes et perses via les douanes du Bosphore."

 # ============================================================
 # DHE event nd_tdr.5: The Crimean Gothic Tongue
 # ============================================================
 nd_tdr.5.t: "La langue gothique de Crimée"
 nd_tdr.5.d: "An ambassador from the Habsburg court, the Flemish humanist Ogier Ghiselin de Busbecq, will one day record at the Sublime Porte a list of words gathered from two Crimean men. Reidi for father, mine for moon, baar for child: a late, half-strangled echo of Wulfila's Gothic Bible in the mouths of upland villagers eight centuries after Theodoric the Great rode west.\n\nFor now the Crimean Gothic speech persists in the cliff villages around Mangup, and the court must take its measure. Shall it be lifted up as a warrior heritage (the Goths of John of Gothia, the foederati of Justinian) or folded into a wider ecumenical court of Greek, Goth, Tatar, Alan, and Italian under the Pontic patriarch?"
 nd_tdr.5.a: "Soulevez la bande de guerre gothique"
 nd_tdr.5.b: "Pliez tous les peuples dans une seule cour pontique"

 STATIC_MODIFIER_NAME_nd_tdr_gothic_warband: "Bande de guerre gothique"
 STATIC_MODIFIER_DESC_nd_tdr_gothic_warband: "Les serviteurs du village des falaises forment une lourde bande de guerre sous leurs anciennes bannières."

 STATIC_MODIFIER_NAME_nd_tdr_ecumenical_court: "Tribunal œcuménique"
 STATIC_MODIFIER_DESC_nd_tdr_ecumenical_court: "La cour de Mangup accueille les Grecs, les Goths, les Alans, les Tatars et les Italiens sous un même toit orthodoxe pontique."

 # ============================================================
 # DHE event nd_tdr.6: The Cave Monasteries
 # ============================================================
 nd_tdr.6.t: "Le Synode des Grottes"
 nd_tdr.6.d: "The hegumens of Inkerman, Eski-Kermen, and Chufut-Kale meet in the rock-cut church of the Holy Cliff at Mangup. They have inherited centuries of monastic life carved straight into the limestone: chapels, cells, refectories all hewn by chisel from the bones of the plateau. Now, with the kingdom restored, the synod recognises a single Pontic Crimean metropolitanate, with the rock-cut see of Mangup at its head, in concord with the patriarch of Constantinople.\n\nIcons painted in the cave chapels are circulated as far as Trebizond and Moscow. The monks copy psalters in beeswax candlelight."
 nd_tdr.6.a: "Convoquer le synode sous la direction du patriarche"

 STATIC_MODIFIER_NAME_nd_tdr_pontic_synod: "Synode pontique de Crimée"
 STATIC_MODIFIER_DESC_nd_tdr_pontic_synod: "Les monastères troglodytes prêchent une vigoureuse orthodoxie pontique qui attire les convertis et stabilise les fidèles du royaume."

 # ============================================================
 # Advances
 # ============================================================
 nd_tdr_mangup_citadel: "Forteresse rocheuse de Mangup"
 nd_tdr_mangup_citadel_desc: "Reconstruire et remettre en garnison les murs Justinianiques du plateau de Mangup. Débloque le bâtiment de la citadelle de Mangup Cliff."

 nd_tdr_drungaroi_levy: "Drungaroi des villages des falaises"
 nd_tdr_drungaroi_levy_desc: "Les villages des hautes terres de Theodoro doivent le service de garnison aux forteresses des falaises. Débloque le prélèvement Mangup Drungaroi."

 nd_tdr_bosporan_liburnae: "Liburnae du Bosphore"
 nd_tdr_bosporan_liburnae_desc: "Héritez des petites galères d'escorte rapides du défunt Pont Euxinus romain. Débloque le vaisseau léger Liburnian du Bosporan."

 nd_tdr_pontic_icons: "Ecole Iconographique Pontique"
 nd_tdr_pontic_icons_desc: "Les chapelles rupestres et les ermitages des falaises préservent une tradition iconographique distinctive de Crimée issue des maîtres cappadociens et trapézuntins."

 nd_tdr_cherson_trade: "Emporion taurique"
 nd_tdr_cherson_trade_desc: "Rouvrez les grands ports de commerce grecs de la côte taurique. Débloque le bâtiment Tauric Emporion et améliore le commerce maritime."

 nd_tdr_cave_monasteries: "Tradition monastique des grottes"
 nd_tdr_cave_monasteries_desc: "Les églises et cellules taillées dans la roche d'Inkerman, Eski-Kermen et Chufut-Kale deviennent des centres d'alphabétisation orthodoxe pontique. Débloque le bâtiment du monastère de la grotte."

 nd_tdr_gabras_inheritance: "L'héritage des Gabras"
 nd_tdr_gabras_inheritance_desc: "Les princes Gabras affirment descendre des Comnènes de Trébizonde et de Constantinople, élevant ainsi le prestige et la portée culturelle du trône Mangup."

 nd_tdr_caffa_factor: "Facteur Caffa"
 nd_tdr_caffa_factor_desc: "Hides from the steppe herds are salted and tanned at Caffa and shipped with the sturgeon and the wax to Constantinople, Genoa, and Cairo. Unlocks the Pontic Curing Works and its hide curing production method."

 nd_tdr_tauric_stratiotes: "Stratiotes tauriques"
 nd_tdr_tauric_stratiotes_desc: "Les Grecs côtiers et les cavaliers Goths se rassemblent en cavalerie légère, derniers descendants des stratiotais comnéniens. Débloque l'unité Tauric Stratiotes."

 nd_tdr_gothic_heritage: "Patrimoine gothique de Crimée"
 nd_tdr_gothic_heritage_desc: "La persistance de la langue gothique de Crimée est célébrée et le royaume embrasse formellement une identité multiethnique de grec, goth, alan, couman et italien."

 nd_tdr_komnenoid_court: "Culture de la Cour Komnénoïde"
 nd_tdr_komnenoid_court_desc: "Mangup patronne les peintres d'icônes, les hymnographes et les poètes grecs vernaculaires à l'imitation de la cour trapézuntine comnénienne."

 nd_tdr_steppe_truces: "Trêves des steppes"
 nd_tdr_steppe_truces_desc: "Les Tatars de Crimée, Nogai et les successeurs de la Volga de la Horde d'Or se rendent tous à Mangup dans le cadre d'une trêve, et les princes du Bosporan agissent comme d'honnêtes courtiers."

 nd_tdr_phanariot_links: "Liens Phanariotes"
 nd_tdr_phanariot_links_desc: "Les diplomates du Bosphore rejoignent les maisons marchandes grecques orthodoxes de Constantinople, Smyrne et Venise."

 nd_tdr_mountain_warfare: "Doctrine de guerre en montagne"
 nd_tdr_mountain_warfare_desc: "Les cols fortifiés, les chaînes de blockhaus et la logistique des dépôts transforment chaque campagne dans les hautes terres de Crimée en une épreuve d'usure pour l'envahisseur."

 nd_tdr_taurican_admiralty: "Amirauté taurican"
 nd_tdr_taurican_admiralty_desc: "Les descendants des équipages pontiques des liburnes maintiennent une flotte d'escorte petite mais rapide construite autour de tactiques de galères héritées de la flotte romaine de la fin de la mer Noire."

 nd_tdr_pontic_iconography: "Iconographie pontique"
 nd_tdr_pontic_iconography_desc: "The Pontic icon-painting tradition reaches its mature form, with workshops at Inkerman and Mangup producing books and panels for the Orthodox world. Unlocks the Pontic Icon Workshop building."

 nd_tdr_pontic_revival: "La renaissance des grains pontiques"
 nd_tdr_pontic_revival_desc: "Les moissonneuses-batteuses de Crimée alimentent le commerce des spiritueux grossiers à travers le littoral de la mer Noire et les routes des steppes. Débloque la méthode de production d'esprit de grain dans les usines de curage Pontic."

 nd_tdr_neo_byzantine_theology: "Théologie néo-byzantine"
 nd_tdr_neo_byzantine_theology_desc: "Le patriarcat de Constantinople et les métropolitains de Crimée réaffirment la centralité spirituelle de la péninsule taurique."

 nd_tdr_komnenoid_absolutism: "Absolutisme komnénoïde"
 nd_tdr_komnenoid_absolutism_desc: "La dynastie des Komnénoïdes centralise les impôts dans la chancellerie de Mangup et organise une bureaucratie de palais salariée sur le modèle romain."

 nd_tdr_grain_combine: "Moissonneuse-batteuse taurique"
 nd_tdr_grain_combine_desc: "Les réformes douanières et le stockage centralisé à Caffa et Cherson permettent au blé du Bosphore de dominer les marchés céréaliers de la mer Noire."

 # ============================================================
 # Custom units
 # ============================================================
 a_nd_tdr_mangup_drungaroi: "Mangup Drungaroi"
 a_nd_tdr_mangup_drungaroi_desc: "Infanterie lourde des garnisons de la falaise Théodorite. Lent, attritionnel et difficile à déloger d’un sol rocheux."

 a_nd_tdr_tauric_stratiotes: "Stratiotes tauriques"
 a_nd_tdr_tauric_stratiotes_desc: "Cavalerie légère d'escarmouche recrutée parmi les Grecs côtiers et les cavaliers gothiques des hautes terres de Crimée."

 n_nd_tdr_bosporan_liburnian: "Liburnien du Bosphore"
 n_nd_tdr_bosporan_liburnian_desc: "Une petite galère d'escorte rapide inspirée des liburnes romaines tardives de la mer Noire, idéale pour l'escorte de convois de céréales et la patrouille côtière."

 n_nd_tdr_pontic_galley: "Cuisine Pontique"
 n_nd_tdr_pontic_galley_desc: "Une lourde galère de guerre de la mer Noire, descendante tardive des équipages pontiques liburnes. Plus rapide que les galères vanille et avec une coque plus lourde adaptée aux conditions de la mer Noire."

 # ============================================================
 # Custom levies
 # ============================================================
 levy_nd_tdr_mangup_drungaroi: "Prélèvement de Mangup Drungaroi"
 levy_nd_tdr_mangup_drungaroi_desc: "Prélèvement d'infanterie lourde provenant des villages des hautes terres de Theodoro."

 # ============================================================
 # Custom buildings
 # ============================================================
 nd_tdr_cliff_citadel: "Citadelle de la falaise de Mangup"
 nd_tdr_cliff_citadel_desc: "Les courtines cyclopéennes et la Citadelle octogonale du plateau de Mangup, reconstruites sur des fondations justiniennes."

 nd_tdr_cave_monastery: "Monastère de la grotte"
 nd_tdr_cave_monastery_desc: "Chapelles, cellules et réfectoires creusés dans la roche dans les falaises calcaires d'Inkerman et d'Eski-Kermen, centre d'apprentissage monastique pontique."

 nd_tdr_tauric_emporion: "Emporion taurique"
 nd_tdr_tauric_emporion_desc: "Un quartier marchand fortifié sur la côte taurique où convergent les commerçants grecs, italiens, pontiques et tatars selon la coutume du Bosphore."

 # ============================================================
 # Production methods (named so they don't show as auto-generated)
 # ============================================================
 nd_tdr_citadel_maintenance: "Entretien de la garnison des falaises"
 nd_tdr_citadel_maintenance_desc: "Pierre, bois et armes pour maintenir les courtines et la garnison permanente en état de combat."

 nd_tdr_cave_monastery_maintenance: "Bureau monastique troglodyte"
 nd_tdr_cave_monastery_maintenance_desc: "Bougies en cire d'abeille, papier et livres pour les bureaux quotidiens et le scriptorium."
 nd_tdr_icon_workshop: "Pontic Icon Workshop"
 nd_tdr_icon_workshop_desc: "A workshop of the Crimean school of painters. Panels of lime and cypress are primed, gilded and painted, and service books are illuminated for churches from Trebizond to Moscow."
 nd_tdr_icon_painting: "Icon Painting"
 nd_tdr_icon_painting_desc: "Paper, panel wood and pigments are made into icons and illuminated books."


 nd_tdr_emporion_cooperage: "Tonnellerie taurique"
 nd_tdr_emporion_cooperage_desc: "Le quartier de la tonnellerie de l'emporion prépare les tonneaux et les coques calfeutrées pour la flotte céréalière, consommant du poisson salé et des réserves de céréales."

 nd_tdr_pontic_workshop: "Travaux de cure pontique"
 nd_tdr_pontic_workshop_desc: "Coastal hide yards and grain distilleries on the Tauric shore. The Genoese factor at Caffa wired the Pontic peninsula into the Mediterranean leather and victualling trades; this is the production-side complement to the trade-side Tauric Emporion."

 nd_tdr_caviar_works: "Caffa Hide Yards"
 nd_tdr_caviar_works_desc: "Hides bought from the steppe herds are salted and tanned in the yards at Caffa for the leather trade of Constantinople, Genoa, and Cairo."

 nd_tdr_grain_spirits: "Spiritueux de céréales pontiques"
 nd_tdr_grain_spirits_desc: "Un alcool de céréales secondaires est distillé à partir du blé de Crimée et expédié le long du littoral de la mer Noire et vers le commerce des steppes."

 # ============================================================
 # DESTINY TREE
 # ============================================================

 # ===== Destiny advances =====
 nd_tdr_destiny: "Destin du rivage cimmérien"
 nd_tdr_destiny_desc: "Le conseil de Mangup s'engage dans le long projet de l'État ressuscité. Deux routes s'ouvrent devant le basileus : un hégémon pontique parcourant l'anneau de la mer Noire, ou un imperium taurique s'enfonçant profondément dans la steppe."

 nd_tdr_dest_pontic_reach: "Le Bief Pontique"
 nd_tdr_dest_pontic_reach_desc: "Prenez les entrepôts du sud de la mer Noire, Sinope et Amasra, pour ouvrir l'anneau mithridatique autour du Pont Euxinus."

 nd_tdr_dest_black_sea_mastery: "Maîtrise de la mer Noire"
 nd_tdr_dest_black_sea_mastery_desc: "Placer Trébizonde et Varna sous les douanes du Bosphore, en tenant les flancs est et ouest du littoral pontique."

 nd_tdr_dest_mithridates_heir: "Héritier de Mithridate"
 nd_tdr_dest_mithridates_heir_desc: "Asseyez-vous à Constantinople et fermez l'ancien anneau de Mithridate Eupator. Débloque le bâtiment de l'Amirauté mithridatique."

 nd_tdr_dest_steppe_frontier: "La frontière des steppes"
 nd_tdr_dest_steppe_frontier_desc: "Empruntez les portes du Don et de la Volga à Tana et Sarai al-Jadid, ouvrant la route des caravanes de la Crimée vers les terres de la Horde."

 nd_tdr_dest_ruthenian_outreach: "Sensibilisation ruthène"
 nd_tdr_dest_ruthenian_outreach_desc: "Atteignez Kiev et la route du Dniepr, attirant le réseau céréalier ruthène jusqu'à la chancellerie de Mangup."

 nd_tdr_dest_ecumenical_throne: "Le trône œcuménique"
 nd_tdr_dest_ecumenical_throne_desc: "Parcourez les routes de la Volga et du Dniepr en tant que royaume multiethnique grec, goth, tatar, alan et ruthène. Débloque la chancellerie impériale de Mangup."

 # ===== Destiny event nd_tdr.7: root =====
 nd_tdr.7.t: "La longue route depuis Mangup"
 nd_tdr.7.d: "The work of forming a kingdom is finished. The work of growing one begins. In the rock-cut hall of the basilica at Mangup the council of the realm meets in full: the cliff-village dynasts, the strategoi of Theodoro, the metropolitan and his hegumens, the Karaim and Italian merchants of the Tauric coast.\n\nTwo destinies are debated. The first, voiced by the Greek archons, is the Pontic Hegemon: a thalassocracy on the Mithridatic model, gathering the harbours of Sinope, Trebizond, Varna, and at last Constantinople itself, into a single Bosporan ring. The second, voiced by the Goth and Alan dynasts and the Phanariot grain-houses, is the Tauric Imperium: a multiethnic land kingdom striding from Mangup to Tana, Sarai, and Kyiv, weaving every people of the Pontic steppe into one realm under the patriarch.\n\nBoth roads are long. The kingdom commits to a destiny."
 nd_tdr.7.a: "Le travail des générations commence"

 # ===== Destiny event nd_tdr.8: A1 Pontic Reach =====
 nd_tdr.8.t: "L'anneau mithridatique"
 nd_tdr.8.d: "The grain-flag of the Bosporan king flies above the kastron of Sinope and the harbour of Amasra. The southern shore of the Pontus Euxinus, which the emperors of the Romans lost to the Turkish emirs long ago, is once more a customs frontier of a Hellenic king. The fishermen of Sinope kiss the hand of the new strategos and pay their toll in silver and dried bonito.\n\nIn the council the strategoi mark the next reach: Trebizond in the east, Varna in the west, and after them Constantinople itself, where the ring closes."
 nd_tdr.8.a: "Marquez les prochains ports sur la carte du stratège"

 # ===== Destiny event nd_tdr.9: A2 Black Sea Mastery =====
 nd_tdr.9.t: "Trébizonde et Varna"
 nd_tdr.9.d: "The two flanks of the Mithridatic ring are taken. Trebizond, last redoubt of the Komnenian basileia, opens its gates to the Bosporan basileus as a kinsman by descent and not as a conqueror. The Megas Komnenos's nephew rides at the king's stirrup. At Varna the western harbour acknowledges the same crown and the customs-house of Caffa moves a clerk to oversee the new toll-books.\n\nNow the question is whether to pour the new revenue into the grain fleet that sails to the Aegean, or into the customs houses that tax the merchants who pass through. The merchants of Genoa lean toward both at once."
 nd_tdr.9.a: "Versez l'argent dans la flotte céréalière"
 nd_tdr.9.b: "Construisez les douanes en épaisseur"

 STATIC_MODIFIER_NAME_nd_tdr_dest_grain_convoy: "Convoi de céréales pontique"
 STATIC_MODIFIER_DESC_nd_tdr_dest_grain_convoy: "Le transport des céréales du Bosphore vers la mer Égée est escorté par des escadrons légers qui font également office de flotte de blocus côtier. La milice se plaint que les conscrits montent aux rames."

 STATIC_MODIFIER_NAME_nd_tdr_dest_pontic_customs: "Coutumes pontiques"
 STATIC_MODIFIER_DESC_nd_tdr_dest_pontic_customs: "Les bureaux de douane du Bosphore se trouvent dans chaque grand port de la mer Noire. Les employés s'enrichissent et les domaines des guerriers s'inquiètent et s'ennuient."

 # ===== Destiny event nd_tdr.10: A3 Heir of Mithridates =====
 nd_tdr.10.t: "Héritier de Mithridate Eupator"
 nd_tdr.10.d: "The basileus of the Cimmerian Shore enters the Augustaion of Constantinople. Two thousand years after Mithridates VI Eupator, last king of Pontus and master of the Black Sea, walked these stones, a basileus of his old country sits beneath the dome of Justinian's church. Hagia Sophia is sung in Greek again. The patriarch crowns the new emperor as basileus of the Romans and as king of the Bosporus together.\n\nWhat shape shall the new Pontic order take? A great war fleet to make the inner sea a Bosporan lake, by the model of the Mithridatic admirals; or a soft hegemony of treaties and peace congresses, knitting Trebizond, Athens, Smyrna, and Caffa into one trading commonwealth?"
 nd_tdr.10.a: "Une flotte de guerre pour verrouiller la mer intérieure"
 nd_tdr.10.b: "Une paix parmi les ports pontiques"

 STATIC_MODIFIER_NAME_nd_tdr_dest_mithridatic_fleet: "Flotte de guerre mithridatique"
 STATIC_MODIFIER_DESC_nd_tdr_dest_mithridatic_fleet: "De lourdes galères patrouillent l'anneau pontique sous les couleurs de la nouvelle basilée du Bosphore, les derniers descendants des amiraux mithridatiques."

 STATIC_MODIFIER_NAME_nd_tdr_dest_pontic_basileia: "Basilie pontique"
 STATIC_MODIFIER_DESC_nd_tdr_dest_pontic_basileia: "Les traités et les congrès de paix lient les ports pontiques à une douce hégémonie. Le prix à payer est une guerre plus lente mais légitime, et les domaines des guerriers s'épuisent."

 # ===== Destiny event nd_tdr.11: B1 Steppe Frontier =====
 nd_tdr.11.t: "Tana et Saraï"
 nd_tdr.11.d: "The basileus of Mangup rides north and east, and the steppe roads bow to him. At Tana the Genoese factor pays his old toll into a new treasury. At Sarai al-Jadid, the new capital of the Volga ulus, a Bosporan resident sits in the bazaar with his Greek and Tatar scribes. The grain caravans from Caffa to the Volga move freely under one customs.\n\nFrom these gateways the road runs further: to Kyiv on the Dnieper, to Beljamen on the Don bend, and at last to a court that holds Greek and Goth and Tatar and Ruthenian under one crown."
 nd_tdr.11.a: "Marquez la route vers le nord en direction de Kyiv"

 # ===== Destiny event nd_tdr.12: B2 Ruthenian Outreach =====
 nd_tdr.12.t: "La route du Dniepr"
 nd_tdr.12.d: "Kyiv on the Dnieper acknowledges the basileus of Mangup. The grain caravans that fed Constantinople in the days of Cherson and Tmutarakan run again. The Phanariot grain-houses of the Tauric coast send factors to the wharves of Kyiv, and the metropolitan of Kyiv sends a delegation to the patriarch of Constantinople through Mangup, restoring the old Pontic-Ruthenian church road.\n\nWhich vein shall the kingdom plough? Open contracts to steppe captains and Ruthenian Cossacks, drawing them into Bosporan service for the long campaigns ahead? Or a Phanariot chancery in Mangup, binding the grain-houses and the clergy of Kyiv into the kingdom's standing administration?"
 nd_tdr.12.a: "Ouvrir des contrats aux capitaines des steppes et des cosaques"
 nd_tdr.12.b: "Construire la chancellerie Phanariot"

 STATIC_MODIFIER_NAME_nd_tdr_dest_dnieper_road: "Capitaines de la route du Dniepr"
 STATIC_MODIFIER_DESC_nd_tdr_dest_dnieper_road: "Les capitaines des steppes et les cosaques ruthènes chevauchent pour le basileus avec des contrats à long terme. La cour de Mangup semble lointaine et provinciale lorsque les guerres se déroulent loin au nord."

 STATIC_MODIFIER_NAME_nd_tdr_dest_phanariot_chancery: "Chancellerie des Phanariotes"
 STATIC_MODIFIER_DESC_nd_tdr_dest_phanariot_chancery: "Les maisons de marchands grecs et le clergé de Kiev servent la chancellerie de Mangup. Le prix à payer est une ambiance d’ambition agitée dans les provinces les plus riches."

 # ===== Destiny event nd_tdr.13: B3 Ecumenical Throne =====
 nd_tdr.13.t: "Le trône œcuménique"
 nd_tdr.13.d: "Greek, Goth, Tatar, Alan, Cuman, Ruthenian, Italian: each people of the long Pontic steppe acknowledges the basileus of Mangup. In the cliff hall of the Octagonal Citadel the rite of acclamation is read in seven tongues, and the metropolitan blesses the throne in the old Pontic Greek of the cave monasteries.\n\nWhat character shall the imperium take? A Komnenoid chancery, a salaried palace bureaucracy on Roman lines, marshalling drilled foot regiments under the cliff banner of Theodoro? Or a steppe basileia, raising horse companies of Tatar and Cuman warriors under the old khans' banners and the new king's seal, and ruling as the heir of Mithridates and Genghis at once?"
 nd_tdr.13.a: "Une chancellerie comnénoïde et des régiments d'infanterie entraînés"
 nd_tdr.13.b: "Une basilée steppique de compagnies équestres"

 STATIC_MODIFIER_NAME_nd_tdr_dest_komnenoid_chancery: "Chancellerie comnénoïde"
 STATIC_MODIFIER_DESC_nd_tdr_dest_komnenoid_chancery: "Une bureaucratie de palais salariée sur la falaise de Mangup entraîne des régiments à pied et dirige des opérations de siège sur les lignes romaines."

 STATIC_MODIFIER_NAME_nd_tdr_dest_steppe_basileia: "Steppe Basilie"
 STATIC_MODIFIER_DESC_nd_tdr_dest_steppe_basileia: "Des compagnies de chevaux de guerriers tatars et coumans chevauchent sous le sceau du basileus, et les bannières des khans sont cousues dans l'étendard de la falaise."

 # ===== Destiny capstone buildings =====
 nd_tdr_mithridatic_admiralty: "Amirauté mithridatique"
 nd_tdr_mithridatic_admiralty_desc: "Un chantier naval fortifié, une voilerie et un système de téléphérique sur le modèle pontique romain tardif. Le siège de la flotte de guerre du Bosphore qui ferme l'anneau mithridatique."

 nd_tdr_imperial_chancery: "Chancellerie impériale de Mangup"
 nd_tdr_imperial_chancery_desc: "Une bureaucratie de palais salariée assise sur la falaise de Mangup. Les élites grecques, goths, tatares, alaniennes et ruthènes sont regroupées en une seule chancellerie sur les lignes komnénoïdes."

 nd_tdr_admiralty_maintenance: "Entretien de la flotte pontique"
 nd_tdr_admiralty_maintenance_desc: "Du bois, des fournitures navales, du goudron et des outils pour maintenir la flotte de guerre de l'Amirauté mithridatique en ordre."

 nd_tdr_chancery_maintenance: "Bureau de la Chancellerie"
 nd_tdr_chancery_maintenance_desc: "Papier, tissus fins, meubles, livres et outils pour les employés salariés de la chancellerie de Mangup."

 # ============================================================
 # Bureaucracies
 # ============================================================
 AUTO_MODIFIER_NAME_nd_tdr_bureaucracy_authority: "Autorité bureaucratique du Bosphore"
 AUTO_MODIFIER_DESC_nd_tdr_bureaucracy_authority: "The reconstituted Bosporan Kingdom, heir to Theodoro and the late Komnenoi, exercises full administrative authority over its Crimean dominion and may host the historical institutions of the Tauric coast. Two bureaucracy slots are granted, enough for two of its four institutions."

 tdr_komnenoid_chancery_bureaucracy: "Chancellerie comnénoïde"
 tdr_komnenoid_chancery_bureaucracy_desc: "À partir de la fin du XIVe siècle, les seigneurs de Mangup se faisaient appeler Komnenodoukai, et leur chancellerie distribuait la titulature byzantine - sébaste, protostrator, éparche, mégas doux - aux vassaux, aux intermédiaires des steppes et aux facteurs génois. Rédigeant des chartes grecques dans les mains de la chancellerie de la fin de l'empire Paléologue, la maison mena la diplomatie matrimoniale qui liait la cour de Crimée à Trébizonde, à la Valachie, à Moscou et aux lignes comnéniennes survivantes. La dignité gonfla plus vite que le régime politique grandit, mais elle limita le royaume en une seule pyramide cérémonielle descendant du trône de Mangup."

 tdr_cliff_monastery_synod_bureaucracy: "Synode du monastère de Cliff"
 tdr_cliff_monastery_synod_bureaucracy_desc: "L'établissement spirituel pontique orthodoxe de Crimée était organisé autour des monastères creusés dans des grottes d'Inkerman, d'Eski-Kermen, de Chufut-Kale et des chapelles rupestres de Mangup, descendant des fondations justiniennes du VIe siècle. Le synode a arbitré la discipline paroissiale, a autorisé l'école de peinture d'icônes de Crimée d'origine cappadocienne et trapézuntine et a hébergé les écoles grecques qui enseignaient à lire aux villageois des hautes terres. Les communautés karaïtes, arméniennes et génoises catholiques de la côte vivaient dans le cadre d’une tolérance religieuse de facto, même lorsque le patriarcat constantinopolitain l’interdisait."

 tdr_tauric_customs_house_bureaucracy: "Douane Taurique"
 tdr_tauric_customs_house_bureaucracy_desc: "L'appareil portuaire-douanier régule les emporia cosmopolites de la côte taurique : Cherson sous les Byzantins, Caffa sous les Génois, Soldaia sous Venise puis Gênes, Vosporo à cheval sur le détroit cimmérien. La renaissance du Bosphore hérite en parallèle de la commerciaria génoise et du kommerkion byzantin, prélevant des droits ad valorem sur les céréales, le poisson salé, le caviar, les esclaves, la cire et la soie en transit. La couronne et les grandes maisons marchandes grecques et italiennes prospèrent ensemble ; les paysans des hautes terres qui nourrissent les ports paient en nourriture qu'ils ne mangent pas."

 tdr_gothic_upland_council_bureaucracy: "Conseil gothique des hautes terres"
 tdr_gothic_upland_council_bureaucracy_desc: "L'assemblée consultative des villages gothiques de Crimée des hautes terres, les derniers descendants des Goths de Wulfila dont Ogier de Busbecq enregistrait encore la langue à la cour ottomane en 1562. Les anciens du village se réunissaient de façon saisonnière sur le plateau de Mangup et à Eski-Kermen pour répartir le service de garnison dans les forteresses des falaises, allouer les pâturages de transhumance le long des montagnes de Crimée et présenter leurs griefs au tribunal de langue grecque en contrebas. La reconnaissance du conseil gothique a lié les locataires des hautes terres et leurs petits seigneurs dans le royaume en tant qu'alliés armés plutôt que sujets, mais elle a lié les mains de la couronne en matière d'impôts, de conscription et de régime foncier dans la moitié de son arrière-pays."
