l_french:
 STATIC_MODIFIER_NAME_nd_northern_dominion: "La domination du Nord"
 STATIC_MODIFIER_DESC_nd_northern_dominion: "D’un océan à l’autre, il nous appartient d’apprivoiser les vastes étendues sauvages du Nord. Nos colons avancent toujours vers l’ouest, sculptant la civilisation dans les forêts boréales et les prairies, soutenus par la volonté de fer d’un peuple frontalier qui a appris à endurer ce qu’aucune autre nation ne pourrait supporter."
 STATIC_MODIFIER_NAME_nd_great_trading_nation: "La grande nation commerçante"
 STATIC_MODIFIER_DESC_nd_great_trading_nation: "Les rivières et les routes de portage qui sillonnent ce continent sont des artères commerciales et nous les contrôlons toutes. Depuis les postes de fourrures de l'intérieur jusqu'aux flottes de pêche des Grands Bancs, nos marchands ont bâti un empire commercial qui relie deux cultures et s'étend sur un continent."
 nd_can.1.t: "La naissance du Canada"
 nd_can.1.d: "A new nation stirs in the northern reaches of the Americas. Where once stood scattered colonies of rival European powers, a unified Canadian identity has begun to take shape, forged in the shared experience of harsh winters, vast distances, and the endless bounty of a wilderness that demands both cooperation and resilience. The question that now confronts us is fundamental: what manner of nation shall Canada become? Shall we be a dominion of settlers and soldiers, pushing our borders ever outward across the prairies and mountains? Or shall we follow the rivers and trade routes that first brought Europeans to these shores, building a commercial empire rooted in the tolerance and pragmatism that has always defined life on the frontier?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_can.1.a: "Nous maîtriserons cette terre du nord."
 nd_can.1.b: "Notre richesse coule à travers les voies navigables."
 STATIC_MODIFIER_NAME_nd_can_chartered_monopoly: "Monopole agréé"
 STATIC_MODIFIER_DESC_nd_can_chartered_monopoly: "Les grandes compagnies à charte, au premier rang desquelles la Compagnie de la Baie d'Hudson, se sont vu accorder des droits exclusifs sur de vastes territoires. Leurs postes de traite et leurs facteurs contrôlent le commerce de systèmes fluviaux entiers, extrayant les fourrures de l'intérieur avec une efficacité impitoyable."
 STATIC_MODIFIER_NAME_nd_can_free_enterprise: "Entreprise libre"
 STATIC_MODIFIER_DESC_nd_can_free_enterprise: "L’ère du monopole a cédé la place à la libre concurrence. Les commerçants indépendants, les libres-marchands et les entreprises rivales se disputent désormais les richesses de l'intérieur du Canada, et l'énergie qui en résulte a déclenché une vague d'innovation commerciale dans toute la colonie."
 nd_can.2.t: "La Compagnie de la Baie d'Hudson"
 nd_can.2.d: "En 1670, le roi Charles II accorda une charte royale au gouverneur et à la compagnie des aventuriers d'Angleterre faisant du commerce dans la baie d'Hudson, un document qui transférait effectivement la souveraineté sur la Terre de Rupert, l'ensemble du bassin versant de la baie d'Hudson, à une société privée. Les postes de traite de la Compagnie, depuis York Factory sur les rives gelées de la baie jusqu'à l'intérieur lointain, forment un réseau de commerce et de gouvernance qui ne ressemble à rien d'autre dans le monde colonial. Les facteurs et les serviteurs de la Compagnie sont à la fois juge, marchand et gouverneur, administrant des territoires qui éclipsent la plupart des royaumes européens. Maintenant, la question se pose : allons-nous adopter ce modèle monopolistique, canalisant le commerce via des sociétés à charte pour un contrôle maximum ? Ou allons-nous ouvrir la frontière à la libre entreprise, en permettant à l’énergie des commerçants indépendants de stimuler la croissance ?"
 nd_can.2.a: "Accordez-leur leur monopole."
 nd_can.2.b: "Laissons la libre entreprise prévaloir."
 STATIC_MODIFIER_NAME_nd_can_light_infantry_legacy: "L'héritage de l'infanterie légère"
 STATIC_MODIFIER_DESC_nd_can_light_infantry_legacy: "La tradition des Voltigeurs canadiens et de leurs successeurs a inculqué à nos armées la maîtrise de la guerre irrégulière. Notre infanterie légère excelle dans les escarmouches, les embuscades et les combats en terrain difficile, compétences nées des forêts infinies et des hivers rigoureux de la frontière canadienne."
 STATIC_MODIFIER_NAME_nd_can_garrison_defense: "Tradition de défense de garnison"
 STATIC_MODIFIER_DESC_nd_can_garrison_defense: "Les leçons de la défense d’une vaste frontière contre un voisin numériquement supérieur ont été intégrées dans notre doctrine militaire. Nos garnisons sont construites pour durer, nos fortifications pour résister, et notre terrain lui-même est notre meilleur allié."
 nd_can.3.t: "Les Voltigeurs Canadiens"
 nd_can.3.d: "En avril 1812, le lieutenant-colonel Charles-Michel de Salaberry lève un corps d'infanterie légère au Bas-Canada, les Voltigeurs Canadiens. Recrutés dans la milice, entraînés selon les normes régulières et experts dans la guerre de frontière qui a défini l'expérience militaire canadienne depuis l'époque de la Nouvelle-France, les Voltigeurs représentent quelque chose sans précédent : une tradition militaire distinctement canadienne. Lors de la bataille de Châteauguay en octobre 1813, Salaberry et ses Voltigeurs, aux côtés de leurs alliés mohawks et abénakis, repoussent une force américaine de quatre mille personnes avec moins de cinq cents défenseurs. Ce ne sont pas les chiffres, mais la connaissance du terrain, la discipline hivernale et le courage né de la défense de son propre sol qui l'ont emporté. Comment cette tradition façonnera-t-elle notre armée à l’avenir ?"
 nd_can.3.a: "Entraînez davantage d’infanterie légère."
 nd_can.3.b: "Renforcez les défenses de notre garnison."
 STATIC_MODIFIER_NAME_nd_can_dominion_unity: "Unité nationale"
 STATIC_MODIFIER_DESC_nd_can_dominion_unity: "Le grand projet de Confédération a uni des provinces et des peuples autrefois séparés. Grâce au compromis fédéral et à l’ingéniosité constitutionnelle, un cadre a été créé qui prend en compte la diversité linguistique, religieuse et régionale au sein d’un seul État transcontinental."
 STATIC_MODIFIER_NAME_nd_can_sovereign_destiny: "Destin souverain"
 STATIC_MODIFIER_DESC_nd_can_sovereign_destiny: "Le Canada est entré sur la scène mondiale en tant que nation souveraine à part entière. Ce n'est plus simplement un ensemble de dépendances coloniales, le Dominion inspire le respect international et les institutions qui lui permettent de tracer sa propre voie parmi les nations du monde."
 nd_can.4.t: "Confédération"
 nd_can.4.d: "Le 1er juillet 1867, l’Acte de l’Amérique du Nord britannique donne naissance au Dominion du Canada, une fédération de provinces s’étendant de la côte atlantique jusqu’aux Grands Lacs, avec la promesse d’une expansion jusqu’au Pacifique et au-delà. La Confédération n’était pas un acte révolutionnaire romantique mais un accord politique tenace, motivé par la peur de l’expansion américaine, l’effondrement du commerce réciproque avec les États-Unis et le coût faramineux de la défense de milliers de kilomètres de frontière. Pourtant, dans ce pragmatisme se cache quelque chose de remarquable : une nation construite non pas sur le sang et la terre, mais sur la négociation, le compromis et la conviction partagée que des peuples divers peuvent être gouvernés ensemble dans un cadre constitutionnel unique. La question est maintenant de savoir si nous consoliderons cette union par des liens internes de loyauté et de gouvernance, ou si nous affirmerons avec audace notre nouvelle souveraineté sur la scène internationale."
 nd_can.4.a: "L'unité par le compromis."
 nd_can.4.b: "Un destin souverain l’attend."
 nd_can_fur_trade_foundations: "Fondations du commerce des fourrures"
 nd_can_fur_trade_foundations_desc: "La peau de castor est la monnaie de la nature sauvage canadienne. Le réseau de traite des fourrures, reliant les trappeurs autochtones, les coureurs des bois français et les marchands métropolitains, a créé l’infrastructure économique dont dépend tout le Canada colonial."
 nd_can_coureurs_tradition: "Coureurs des Bois"
 nd_can_coureurs_tradition_desc: "Ces commerçants sauvages sans permis s'aventurent au plus profond de l'intérieur, vivant parmi les peuples autochtones, apprenant leurs langues et leurs techniques de survie, et revenant avec des canoës chargés de fourrures de première qualité. They are the scouts, translators, and advance agents of Canadian expansion."
 nd_can_grand_banks: "Pêches sur les Grands Bancs"
 nd_can_grand_banks_desc: "The shallow waters of the Grand Banks teem with cod in quantities that seem inexhaustible. European fishermen have crossed the Atlantic for these fishing grounds since the late 15th century, and the dried and salted cod they produce feeds half of Catholic Europe."
 nd_can_canot_du_maitre: "Canot du Maître"
 nd_can_canot_du_maitre_desc: "Les grands canots de Montréal, longs de trente-six pieds, construits en écorce de bouleau sur des membrures de cèdre, peuvent transporter quatre tonnes de marchandises de commerce du Saint-Laurent jusqu'aux postes intérieurs. Ils sont l'élément vital de la traite des fourrures, et les voyageurs qui les pagayent sont les riverains les plus célèbres des Amériques."
 nd_can_seigneurial_system: "Système seigneurial"
 nd_can_seigneurial_system_desc: "Le système seigneurial divise la vallée du Saint-Laurent en longues et étroites bandes de terres agricoles perpendiculaires au fleuve. Chaque seigneur a des obligations féodales envers la Couronne ; chaque habitant doit au seigneur un loyer, du travail et du blé. Ce n’est pas efficace, mais cela colonise la terre."
 nd_can_fortress_new_france: "Forteresse Nouvelle-France"
 nd_can_fortress_new_france_desc: "Une chaîne de fortifications allant de Louisbourg sur l'Atlantique jusqu'au Fort Frontenac sur le lac Ontario protège les abords du cœur du Saint-Laurent. Ces défenses en pierre et en terre constituent l'épine dorsale militaire de la Nouvelle-France."
 nd_can_hudsons_bay: "Compagnie de la Baie d'Hudson"
 nd_can_hudsons_bay_desc: "The oldest incorporated joint-stock merchandising company in the English-speaking world. Granted a royal charter in 1670, the Company's writ runs over Rupert's Land, an area of 1.5 million square miles drained by rivers flowing into Hudson Bay. From 1749 its Orkney boatwrights built the York boat, which carried the yearly outfit inland from York Factory and the fur back out."
 nd_can_compagnies_franches: "Compagnies Franches de la Marine"
 nd_can_compagnies_franches_desc: "Des réguliers coloniaux recrutés en Nouvelle-France et formés à la fois aux exercices militaires européens et à la guerre autochtone dans les forêts. Les Compagnies Franches allient la discipline des soldats professionnels aux compétences frontalières des hommes nés dans la nature canadienne."
 nd_can_milice_tradition: "Milice Canadienne"
 nd_can_milice_tradition_desc: "Tout habitant masculin de la Nouvelle-France entre seize et soixante ans est soumis au service de la milice. Ces citoyens-soldats défendent les seigneuries, patrouillent les frontières et forment la masse de la force militaire coloniale lorsque les réguliers ne peuvent être partout à la fois."
 nd_can_jesuit_missions: "Missions jésuites"
 nd_can_jesuit_missions_desc: "La Compagnie de Jésus a envoyé ses membres les plus zélés dans la nature canadienne pour convertir les peuples autochtones. Les Relations Jésuites, leurs lettres publiées, sont devenues la principale source de connaissances sur l'intérieur de l'Amérique du Nord."
 nd_can_timber_beginnings: "Les débuts du commerce du bois"
 nd_can_timber_beginnings_desc: "Les vastes forêts du Canada produisent des provisions navales, des mâts, des espars, du goudron et de la potasse, dont la Marine royale et les chantiers navals européens ont désespérément besoin. Ce qui était autrefois un sous-produit du défrichement est devenu une industrie à part entière."
 nd_can_treaty_of_utrecht: "L'héritage du Traité d'Utrecht"
 nd_can_treaty_of_utrecht_desc: "Le Traité d'Utrecht de 1713 redessine la carte de l'Amérique du Nord, cédant l'Acadie, Terre-Neuve et le territoire de la Baie d'Hudson à la Grande-Bretagne. Ce règlement établit le cadre de coexistence franco-britannique qui définira la politique canadienne pendant des siècles."
 nd_can_battle_of_quebec: "L'héritage de la bataille de Québec"
 nd_can_battle_of_quebec_desc: "La chute du Québec en 1759 a mis fin à la domination française sur le Canada, mais n'a pas mis fin au peuple canadien-français. L'Acte de Québec de 1774 garantissait leur langue, leur religion et leur droit civil, un précédent pour l'accommodement des différences culturelles qui deviendrait la caractéristique déterminante du Canada."
 nd_can_voltigeur_tradition: "Tradition canadienne des Voltigeurs"
 nd_can_voltigeur_tradition_desc: "Les Voltigeurs Canadiens, fondés par Charles-Michel de Salaberry en 1812, ont prouvé que les soldats canadiens pouvaient rivaliser avec n'importe quelle armée du monde lorsqu'ils combattaient sur leur propre sol. Leur victoire à Châteauguay avec une force largement supérieure en nombre est entrée dans la légende nationale."
 nd_can_war_of_1812: "Guerre de 1812"
 nd_can_war_of_1812_desc: "L'invasion américaine du Canada en 1812-1814 a été repoussée par une coalition de soldats réguliers britanniques, de milices canadiennes et d'alliés autochtones. La guerre a forgé une identité canadienne distincte, distincte de celle de la Grande-Bretagne et des États-Unis, et a prouvé que les colonies du Nord pouvaient se défendre."
 nd_can_timber_barons: "Barons du bois"
 nd_can_timber_barons_desc: "Napoleon's Continental Blockade cut Britain off from Baltic timber, and Canada filled the gap. By the 1830s, lumber was Canada's leading export. The timber barons who controlled the great river drives, floating millions of board feet of lumber down the Ottawa and St. Lawrence, became the colony's wealthiest men.\n\n#italic Available in: $nd_can_timber_slide$#!"
 nd_can_provincial_marine: "Marine provinciale"
 nd_can_provincial_marine_desc: "La Marine provinciale est la force navale des Grands Lacs, une flotte de sloops, de goélettes et de navires armés qui patrouille dans les mers intérieures séparant les territoires britannique et américain. Le contrôle des lacs signifie le contrôle des frontières."
 nd_can_rideau_canals: "Canaux Rideau"
 nd_can_rideau_canals_desc: "Le canal Rideau, achevé en 1832, relie Ottawa à Kingston sur le lac Ontario via une chaîne d'écluses, de barrages et de canaux. Construite comme une voie d'approvisionnement militaire sécurisée contournant la frontière vulnérable du Saint-Laurent, elle est devenue une artère commerciale reliant l'intérieur à la mer."
 nd_can_constitutional_act: "Acte constitutionnel"
 nd_can_constitutional_act_desc: "L'Acte constitutionnel de 1791 divisait le Canada en provinces du Haut et du Bas, chacune ayant sa propre assemblée élue. Il était imparfait, les assemblées manquaient de véritable pouvoir, mais il a semé la graine d’un gouvernement représentatif qui finirait par se transformer en une autonomie responsable."
 nd_can_confederation: "Confédération"
 nd_can_confederation_desc: "L'Acte de l'Amérique du Nord britannique de 1867 a uni les provinces du Canada, de la Nouvelle-Écosse et du Nouveau-Brunswick dans le Dominion du Canada. Un système fédéral a été conçu pour équilibrer les intérêts des Anglais et des Français, des protestants et des catholiques, des Maritimes et du continent."
 nd_can_responsible_government: "Gouvernement responsable"
 nd_can_responsible_government_desc: "L’instauration d’un gouvernement responsable, dans lequel l’exécutif répond à l’assemblée élue plutôt qu’à une lointaine autorité impériale, n’a pas été obtenue par la révolution mais par une agitation politique persistante. Le rapport de Lord Durham de 1839 et les réformes qui suivirent établirent le principe selon lequel les Canadiens se gouverneraient eux-mêmes."
 nd_can_national_policy: "Politique nationale"
 nd_can_national_policy_desc: "Sir John A. Macdonald's National Policy of 1879 imposed protective tariffs to nurture Canadian manufacturing, built the transcontinental railway to bind the provinces together, and promoted immigration to settle the western prairies. It was nation-building by economic design."
 nd_can_pacific_railway: "Chemin de fer Canadien Pacifique"
 nd_can_pacific_railway_desc: "Le 7 novembre 1885, Donald Smith planta le dernier crampon à Craigellachie, achevant ainsi le chemin de fer Canadien Pacifique, un ruban d'acier s'étendant de Montréal à la côte du Pacifique. Le chemin de fer a tenu la promesse faite à la Colombie-Britannique lors de la Confédération et a transformé les prairies de l'Ouest d'un état sauvage en terres agricoles colonisées."
 nd_can_mounted_police_tradition: "Police à cheval du Nord-Ouest"
 nd_can_mounted_police_tradition_desc: "La Police à cheval du Nord-Ouest, créée en 1873, a rétabli l'ordre public dans les vastes territoires de l'Ouest. Montés à cheval, vêtus de leurs tuniques écarlates distinctives, les membres de la GRC sont devenus le symbole de la souveraineté canadienne à la frontière, une force policière unique au monde."
 nd_can_wheat_boom: "Boom du blé des Prairies"
 nd_can_wheat_boom_desc: "L'achèvement du chemin de fer et l'arrivée de centaines de milliers d'immigrants ont transformé les Prairies canadiennes en l'un des plus grands greniers du monde. Le blé Marquis, cultivé pour mûrir pendant la courte saison de croissance du Nord, a rendu viable l'agriculture à grande échelle des Prairies."
 nd_can_bicultural_compromise: "Compromis biculturel"
 nd_can_bicultural_compromise_desc: "La réussite politique déterminante du Canada réside dans l'intégration de ses deux cultures fondatrices, la française et l'anglaise, dans un cadre constitutionnel unique. Cela n’a jamais été facile, toujours contesté, mais l’engagement en faveur de la coexistence biculturelle a produit une société plus tolérante à l’égard de la diversité que la plupart des autres."
 a_nd_can_coureurs_des_bois: "Coureurs des Bois"
 a_nd_can_coureurs_des_bois_desc: "Des bûcherons canadiens-français sans permis qui s'aventurent au plus profond de la nature pour faire du commerce avec les peuples autochtones. Des éclaireurs, canoéistes et survivants experts qui connaissent les rivières et les portages de l'intérieur mieux que n'importe quelle carte."
 a_nd_can_compagnies_franches: "Compagnies Franches"
 a_nd_can_compagnies_franches_desc: "Infanterie régulière coloniale élevée en Nouvelle-France, entraînée à la fois aux tactiques de ligne européennes et à la guerre autochtone dans les forêts. Ils combattent comme des professionnels dans la forêt, une combinaison qu'aucune armée européenne ne peut égaler sur ce continent."
 a_nd_can_milice: "Milice Canadienne"
 a_nd_can_milice_desc: "Milice seigneuriale tirée des habitants de la Nouvelle-France. Tout homme entre seize et soixante ans doit du service. Ils connaissent intimement leur territoire et se battent avec le courage désespéré des hommes qui défendent leurs propres fermes et familles."
 a_nd_can_voltigeurs: "Voltigeurs canadiens"
 a_nd_can_voltigeurs_desc: "Infanterie légère d'élite entraînée par Charles-Michel de Salaberry dans la tradition de la guerre de frontière. Des tirailleurs, des tireurs d'élite et des éclaireurs experts qui ont prouvé à Châteauguay que les soldats canadiens pouvaient vaincre une armée dix fois plus nombreuse."
 a_nd_can_mounted_police: "Police à cheval du Nord-Ouest"
 a_nd_can_mounted_police_desc: "Les cavaliers vêtus d'écarlate de la Police à cheval du Nord-Ouest patrouillent dans les vastes territoires de l'Ouest, appliquant la loi, arbitrent les différends et représentent la souveraineté canadienne sur des terres qu'aucune autre institution ne peut atteindre."
 n_nd_can_canot_du_maitre: "Canot du Maître"
 n_nd_can_canot_du_maitre_desc: "Le grand canot de Montréal, trente-six pieds d'écorce de bouleau et de cèdre, pagayé par un équipage de voyageurs. Ces navires transportent quatre tonnes de marchandises commerciales sur des milliers de kilomètres de rivières et de portages, reliant les colonies du Saint-Laurent aux postes de fourrures de l'intérieur."
 n_nd_can_york_boat: "York Boat"
 n_nd_can_york_boat_desc: "The inland freight boat of the Hudson's Bay Company, clinker-built of spruce on the lines of an Orkney yole. It carries twice the load of the great canoe with a smaller crew and can set a square sail on the lakes, but it is an open boat without a gun, and at every portage its tripmen must drag it over log rollers."
 a_nd_can_embodied_militia: "Select Embodied Militia"
 a_nd_can_embodied_militia_desc: "Men between eighteen and thirty drawn by ballot from the parish militia rolls of Lower Canada in 1812 and embodied in line battalions for a term of service. Drilled beside the regulars, they held the frontier at Lacolle and Chateauguay."
 n_nd_can_provincial_sloop: "Sloop maritime provincial"
 n_nd_can_provincial_sloop_desc: "Un sloop rapide à faible tirant d'eau conçu pour les patrouilles sur les Grands Lacs. Armés de canons légers et pilotés par des marins lacustres, ces navires assurent le contrôle canadien sur les mers intérieures qui forment la frontière."
 nd_can_trading_post: "Poste de traite des fourrures"
 nd_can_trading_post_desc: "Un avant-poste frontalier où les produits européens sont échangés contre des fourrures autochtones. Le poste de traite est à la fois un entrepôt, un marché et un lieu de rencontre diplomatique, l'institution fondamentale du commerce des fourrures au Canada."
 nd_can_timber_slide: "Toboggan en bois"
 nd_can_timber_slide_desc: "Un canal technique qui permet au bois équarri de contourner les rapides et les cascades lors des grands passages fluviaux. Ces structures sont essentielles à l'industrie du bois, car elles permettent le transport de millions de pieds-planche depuis les forêts intérieures jusqu'aux scieries et aux quais d'exportation en aval."
 nd_can_canal_lock: "Écluse du canal"
 nd_can_canal_lock_desc: "Un sas d'écluse qui élève ou abaisse les navires entre différents niveaux d'eau, permettant la navigation à l'intérieur du Canada. Le réseau de canaux relie les Grands Lacs au Saint-Laurent, créant ainsi une voie navigable commerciale ininterrompue allant du cœur du pays à la mer."
 nd_can_pelt_processing: "Traitement des peaux"
 nd_can_pelt_processing_desc: "The preparation, grading, and baling of beaver and other furs for export to European markets, paid for in tools and blanket cloth. Quality pelt processing commands premium prices in the fashion houses of London and Paris."
 nd_can_log_driving: "Conduite de grumes"
 nd_can_log_driving_desc: "L'art dangereux de faire flotter le bois équarri sur les rivières canadiennes jusqu'aux scieries et aux quais d'exportation. Les conducteurs de rivières, les draveurs et les coureurs de rondins de l'Outaouais et du Saint-Laurent, risquent leur vie en guidant des millions de pieds-planche à travers les rapides et les embâcles."
 nd_can_canal_tolls: "Péages sur les canaux"
 nd_can_canal_tolls_desc: "Revenus perçus sur les navires commerciaux passant par le système d’écluses du canal. Les péages financent l'entretien des voies navigables tandis que le canal lui-même stimule le commerce en reliant les marchés intérieurs aux ports côtiers."
 nd_can_fishing_stage: "Fishing Stage"
 nd_can_fishing_stage_desc: "A wharf on stilts with its sheds and drying flakes, where the catch is landed, split, salted and laid out in the sun. Every cove of the cod coast has one."
 nd_can_implement_works: "Implement Works"
 nd_can_implement_works_desc: "A works where ploughs, reapers and mowers are cast, forged and framed for the farms of the interior. Behind the tariff it sells against the makers to the south."
 nd_can_implement_making: "Implement Making"
 nd_can_implement_making_desc: "Iron is cast and forged with coal and fitted to wooden frames. The ploughs and reapers are sold as tools."
 nd_can_cod_curing: "Salaison de morue"
 nd_can_cod_curing_desc: "Le salage et le séchage de la morue franche provenant des pêcheries des Grands Bancs. La morue salée est un aliment de base durable et riche en protéines qui nourrit l'Europe catholique pendant le Carême et soutient les populations coloniales pendant les longs hivers."
 levy_nd_can_milice: "Milice Canadienne"
 levy_nd_can_milice_desc: "Prélèvement de la milice seigneuriale prélevé sur les habitants agricoles des établissements du Saint-Laurent. Ces défenseurs des frontières connaissent leur patrie et combattent avec ténacité lorsqu'ils sont appelés au service."
 levy_nd_can_embodied_militia: "Select Embodied Militia"
 levy_nd_can_embodied_militia_desc: "A levy of balloted militiamen embodied in drilled battalions for a term of service, the successor of the parish militia in the wars of the nineteenth century."
 nd_can_formed_tt: "Le Canada a été formé"
 nd_can_path_a_tt: "Choisissez le Dominion du Nord"
 nd_can_path_b_tt: "Choisissez la grande nation commerçante"
 nd_can_destiny: "Le destin canadien"
 nd_can_destiny_desc: "Le Canada a été formé et un nouveau destin l'attend. Les vastes étendues sauvages du Nord s’étendent de l’Atlantique au Pacifique, une terre aux possibilités infinies. Stabilisez la jeune nation et préparez-vous à la grande entreprise qui nous attend."
 nd_can_dest_pacific: "Portée du Pacifique"
 nd_can_dest_pacific_desc: "La côte Pacifique nous appelle. Étendez la souveraineté canadienne jusqu'à la côte ouest en sécurisant la baie Nootka sur l'île de Vancouver, prouvant ainsi que la domination du Nord s'étend sur le continent d'un océan à l'autre."
 nd_can_dest_klondike: "Le Klondike"
 nd_can_dest_klondike_desc: "The northern frontier holds untold riches. Push into the Yukon, stake Canada's claim to the gold fields of the Klondike and bring their gold to Canadian markets."
 nd_can_dest_dominion: "Domination continentale"
 nd_can_dest_dominion_desc: "La destinée manifeste du Canada est la suprématie continentale. Contrôlez le continent, de l'Hudson au Golfe, en sécurisant New York et le delta du Mississippi, faisant ainsi de la domination du Nord la puissance suprême des Amériques."
 nd_can_dest_atlantic: "Commerce de l'Atlantique Nord"
 nd_can_dest_atlantic_desc: "L'Atlantique Nord est le domaine commercial naturel du Canada. Étendez le réseau commercial vers le sud en sécurisant les zones baleinières de Nantucket, établissant ainsi la domination canadienne sur les pêcheries les plus riches du monde."
 nd_can_dest_caribbean: "Commerce des Caraïbes"
 nd_can_dest_caribbean_desc: "Les îles sucrières et les entrepôts commerciaux des Caraïbes offrent une richesse au-delà de ce que le commerce des fourrures du Nord peut offrir. Sécurisez La Havane pour ancrer un réseau commercial du Sud et adopter des institutions financières modernes."
 nd_can_dest_emporium: "Empire commercial mondial"
 nd_can_dest_emporium_desc: "The rivers of Canada once carried only furs. Now they must carry the goods of the world. Raise Montreal into a city or the center of a market, and build a commercial empire so vast that even silk from the Orient flows through Canadian markets."
 nd_can_dest_montreal_grown_tt: "We own #bold Hochelaga#! (Montreal) and it is a city or the center of a market"
 nd_can.5.t: "Le destin canadien"
 nd_can.5.d: "Une nation est née dans le désert du nord. Des villages de pêcheurs de la côte atlantique aux postes de fourrures de l’intérieur, le Canada a atteint la stabilité nécessaire pour poursuivre une plus grande ambition. La question n’est plus de savoir si ce pays peut survivre, mais ce qu’il va devenir. La voie à suivre exige du courage, une vision et la volonté de construire quelque chose qui n’a jamais existé auparavant, une nation transcontinentale taillée dans la deuxième plus grande masse continentale du monde."
 nd_can.5.a: "Notre destin nous attend."
 nd_can.6.t: "La côte du Pacifique"
 nd_can.6.d: "La souveraineté canadienne s'étend désormais au Pacifique. Dans la baie Nootka, où les navigateurs espagnols et britanniques se disputaient autrefois la côte, le drapeau canadien flotte sur une terre qui complète la vision d'une nation transcontinentale. Les forêts de l'île de Vancouver produisent du bois d'une qualité inégalée, et les ports abrités du nord-ouest du Pacifique ouvrent les routes vers les marchés d'Asie. D’un océan à l’autre, la domination du Nord est une réalité."
 nd_can.6.a: "De la mer à la mer brillante."
 nd_can.7.t: "Maîtres de l'Atlantique Nord"
 nd_can.7.d: "Les zones de pêche à la baleine et à la morue de l'Atlantique Nord font désormais partie intégrante de la sphère commerciale canadienne. Des Grands Bancs à Nantucket, les navires et marchands canadiens possèdent les ressources maritimes les plus riches au monde. La richesse de la mer a toujours soutenu cette nation du Nord, et désormais cette domination est absolue."
 nd_can.7.a: "L'océan fournit."
 nd_can.8.t: "L'or au Klondike"
 nd_can.8.d: "La découverte d'or au Yukon a déclenché une ruée de prospecteurs, d'aventuriers et de chercheurs de fortune vers le Nord canadien. Les champs aurifères du Klondike constituent les gisements de placers les plus riches jamais découverts, et la question est maintenant de savoir comment le Canada va gérer cette manne. Une approche consiste à laisser la ruée suivre son cours, la frénésie de l’extraction remplira le trésor même si elle entraîne l’inflation et le chaos. L’autre consiste à imposer de l’ordre à la frontière, en intégrant méthodiquement les nouveaux territoires dans l’État canadien, en construisant des institutions qui dureront longtemps après l’épuisement de l’or."
 nd_can.8.a: "Laissez la ruée vers l’or se déchaîner."
 nd_can.8.b: "Imposer l'ordre à la frontière."
 nd_can.9.t: "Connexions caribéennes"
 nd_can.9.d: "La Havane étant sous influence canadienne, les réseaux commerciaux des Caraïbes sont ouverts à l'exploitation. Le sucre, le tabac et les produits tropicaux circulent vers le nord tandis que le bois d'œuvre, le poisson et les produits manufacturés canadiens se dirigent vers le sud. Il s’agit d’un nouveau type de commerce canadien, non pas le commerce des fourrures dans les régions sauvages, mais le commerce triangulaire des empires. Le Canada peut construire une flotte navale commerciale pour dominer ces routes par la force, ou il peut établir des ports francs et des accords diplomatiques qui attirent le commerce par l’ouverture plutôt que par la coercition."
 nd_can.9.a: "Construisez le commerce triangulaire."
 nd_can.9.b: "Établir des ports francs."
 nd_can.10.t: "Suprématie continentale"
 nd_can.10.d: "De l’Arctique au golfe du Mexique, de l’Atlantique au Pacifique, la puissance canadienne projette son ombre sur tout le continent. Les grandes villes de la côte est et les terres de plantation du delta du Mississippi reconnaissent la suprématie canadienne. Il s’agit du sommet de la domination du Nord, un empire continental bâti par une nation qui n’était au départ qu’une poignée de postes de traite des fourrures le long du Saint-Laurent. La question est maintenant de savoir s’il faut maintenir cet empire par la puissance militaire, en déployant des armées capables de projeter sa puissance n’importe où sur le continent, ou s’il faut le consolider par la gouvernance et la diplomatie, en construisant une paix continentale."
 nd_can.10.a: "L'armée du dominion marche."
 nd_can.10.b: "Une paix canadienne pour le continent."
 nd_can.11.t: "Le magasin du monde"
 nd_can.11.d: "La soie sur les marchés canadiens. L'idée même aurait semblé absurde aux coureurs des bois qui parcouraient la nature sauvage avec leurs canots d'écorce de bouleau à la recherche de peaux de castor. Pourtant, nous sommes ici, une nation commerçante si vaste et si connectée que les produits de luxe de l’Orient circulent à travers nos réseaux commerciaux aux côtés des fourrures, du poisson et du bois qui ont construit ce pays. Le Canada est devenu ce que la géographie a toujours promis : un pont entre les mondes de l'Atlantique et du Pacifique, un carrefour commercial où chaque marchandise trouve son acheteur et chaque commerçant trouve une opportunité."
 nd_can.11.a: "Commandez les marchés."
 nd_can.11.b: "La diplomatie ouvre toutes les portes."
 STATIC_MODIFIER_NAME_nd_can_dest_gold_rush: "Frénésie de la ruée vers l’or"
 STATIC_MODIFIER_DESC_nd_can_dest_gold_rush: "La ruée vers l’or du Klondike a déclenché un torrent de richesse et d’ambition. Les prospecteurs affluent au Yukon par dizaines de milliers et la poussière d'or coule vers le sud pour remplir les coffres nationaux, mais la frénésie entraîne l'inflation à mesure que l'or déprécie la monnaie."
 STATIC_MODIFIER_NAME_nd_can_dest_orderly_frontier: "Frontière ordonnée"
 STATIC_MODIFIER_DESC_nd_can_dest_orderly_frontier: "L’approche canadienne à l’égard de la frontière nord est méthodique et institutionnelle. Là où d'autres pays pourraient laisser les prospecteurs se déchaîner, le Canada envoie d'abord la police montée, puis les arpenteurs, puis les colons. La commande précède le profit."
 STATIC_MODIFIER_NAME_nd_can_dest_army_dominion: "Armée du Dominion"
 STATIC_MODIFIER_DESC_nd_can_dest_army_dominion: "L'armée canadienne est devenue une force continentale, capable de projeter sa puissance sur les vastes distances de l'Amérique du Nord. Les divisions d'assaut, la mobilisation rapide et la doctrine stratégique agressive en font une puissance militaire de premier ordre, même si le coût du maintien d'une telle armée met à rude épreuve les finances de la nation."
 STATIC_MODIFIER_NAME_nd_can_dest_pax_canadiana: "Pax Canadienne"
 STATIC_MODIFIER_DESC_nd_can_dest_pax_canadiana: "Le Canada a acquis sa domination continentale non pas grâce à des conquêtes sans fin, mais grâce à la construction d’une paix durable. Des institutions fortes, des successions satisfaites et une structure de gouvernance qui s’adapte à la diversité garantissent que ce qui a été gagné par l’épée sera conservé par la plume."
 STATIC_MODIFIER_NAME_nd_can_dest_sugar_triangle: "Triangle du sucre"
 STATIC_MODIFIER_DESC_nd_can_dest_sugar_triangle: "Les marchands canadiens ont bâti un commerce triangulaire reliant les îles sucrières des Caraïbes, les pêcheries du Nord et les marchés européens. La Marine royale canadienne protège ces voies maritimes avec une confiance et une compétence croissantes."
 STATIC_MODIFIER_NAME_nd_can_dest_free_port: "Diplomatie des ports francs"
 STATIC_MODIFIER_DESC_nd_can_dest_free_port: "Plutôt que de dominer le commerce des Caraïbes grâce à sa force navale, le Canada a établi des ports francs et cultivé des relations diplomatiques qui attirent le commerce grâce à l'ouverture. L’approche coûte moins cher et construit des partenariats commerciaux plus durables."
 STATIC_MODIFIER_NAME_nd_can_dest_commercial_hegemony: "Hégémonie commerciale"
 STATIC_MODIFIER_DESC_nd_can_dest_commercial_hegemony: "The Canadian commercial empire commands global markets. Heavy merchant vessels flying the Canadian flag trade in every ocean, and the prestige of the northern trading nation has never been greater, though success breeds complacency, and the government's word carries less."
 STATIC_MODIFIER_NAME_nd_can_dest_diplomatic_ascendancy: "Ascendant diplomatique"
 STATIC_MODIFIER_DESC_nd_can_dest_diplomatic_ascendancy: "Le succès commercial du Canada a été égalé par sa maîtrise diplomatique. Les envoyés de la nation commerçante sont les bienvenus devant tous les tribunaux, ses bons offices sont recherchés dans chaque différend, et ses conditions d'annexion sont suffisamment généreuses pour gagner une soumission volontaire."
 nd_can_frontier_garrison: "Garnison frontière"
 nd_can_frontier_garrison_desc: "Un poste militaire fortifié conçu pour projeter la souveraineté canadienne à travers la vaste frontière. Ces garnisons assurent le contrôle territorial du dominion du Nord, abritant des soldats formés à la fois à la défense conventionnelle et à la guerre de frontière."
 nd_can_garrison_supply: "Ravitaillement de la garnison"
 nd_can_garrison_supply_desc: "La chaîne d'approvisionnement qui maintient les garnisons frontalières opérationnelles, les armes pour les soldats, la pierre pour les réparations des fortifications et les outils pour le travail sans fin d'entretien d'un avant-poste militaire dans la nature."
 nd_can_commercial_exchange: "Échange commercial"
 nd_can_commercial_exchange_desc: "Une salle des marchés spécialement conçue à cet effet où des commerçants du monde entier exercent leurs activités conformément à la loi canadienne. La bourse concentre l'activité commerciale, normalise les contrats et fait du marché canadien le plus efficace et le plus fiable de l'hémisphère."
 nd_can_exchange_operations: "Opérations d'échange"
 nd_can_exchange_operations_desc: "Les opérations quotidiennes des échanges commerciaux, le papier pour les contrats et les grands livres, le tissu pour les échantillons commerciaux et les outils pour peser et mesurer les marchandises selon les normes rigoureuses du commerce canadien."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_can_bureaucracy_authority: "Autorité bureaucratique fédérale"
 AUTO_MODIFIER_DESC_nd_can_bureaucracy_authority: "The Anglo-French dominion, having declared its institutional foundation, may now charter formal institutions to administer the realm. It has room for three more of them."

 can_quebec_act_settlement_bureaucracy: "Règlement en vertu de la Loi sur le Québec"
 can_quebec_act_settlement_bureaucracy_desc: "Le 22 juin 1774, le Parlement de Westminster a adopté l'Acte de Québec, l'accommodement impérial qui a défini le Canada pendant deux générations. Rédigée sur les conseils du gouverneur sir Guy Carleton, la loi garantissait le libre exercice de la religion catholique romaine, rétablissait le droit du clergé de percevoir la dîme, reconnaissait la tenure seigneuriale et la Coutume de Paris en matière de propriété et en matière civile et remplaçait l'assemblée élue de style anglais promise par un conseil législatif nommé. Les colons américains l'ont dénoncé comme l'un des actes intolérables ; les Canadiens, en revanche, restèrent fidèles en 1775-1776 et de nouveau en 1812. La colonie troqua ses institutions représentatives contre la préservation institutionnelle de la Nouvelle-France."

 can_hbc_charter_bureaucracy: "Charte de la Compagnie de la Baie d'Hudson"
 can_hbc_charter_bureaucracy_desc: "Chartered by Charles II on 2 May 1670 as the Governor and Company of Adventurers of England trading into Hudson's Bay, the HBC governed Rupert's Land (a territory larger than continental Europe) from York Factory, Moose Factory, Fort Albany, and Churchill until 1869. After Sir George Simpson's 1821 reorganisation absorbing the Montreal Northwest Company, the Company ran a private state with its own courts, magistrates, and the legendary Made Beaver currency, supported by Orkneymen boatmen, Iroquois canoemen out of Caughnawaga, and Metis carters of Red River. The dividend ledger in London was the empire's measure of governance in the North American interior."

 can_family_compact_bureaucracy: "Compact familial et Clique du Château"
 can_family_compact_bureaucracy_desc: "Entre 1791 et 1841, le Haut et le Bas-Canada étaient gouvernés en pratique par deux oligarchies nommées et imbriquées. Dans le Haut-Canada, le Family Compact s'est réuni autour de l'évêque John Strachan de Toronto, des familles Robinson et Boulton, de la Banque du Haut-Canada et de l'establishment anglican conservateur qui administrait les réserves du clergé. Au Bas-Canada, la Clique du Château - du nom de la résidence du gouverneur du Château Saint-Louis à Québec - se rassemblait autour des familles seigneuriales, de l'évêque anglican et des marchands écossais montréalais de John Molson et de la Banque de Montréal. Les deux cliques dominaient les conseils législatifs nommés qui opposaient leur veto à la législation sur les assemblées élues et furent la cible de l'agitation réformiste qui culmina avec les rébellions de 1837."

 can_seigneurial_tenure_bureaucracy: "Tenure seigneuriale"
 can_seigneurial_tenure_bureaucracy_desc: "Brought to New France by the Compagnie des Cent-Associes in 1627 and confirmed by Cardinal Richelieu's land policy, the seigneurial system granted strips of St. Lawrence frontage to seigneurs who in turn conceded farm-lots to habitants in exchange for the cens, the rentes, the corvee, and the banalites of mill, oven, and press. After the 1760 capitulation the British preserved the system in Article 4 of the surrender and in the Quebec Act, and the seigneurs (the Lotbinieres, Tachereaus, de Salaberrys, de Lerys) formed the French-Canadian half of the Chateau Clique until the 1854 Seigneurial Tenure Abolition Act finally redeemed the droits."

 can_captain_of_militia_bureaucracy: "Capitaine de milice"
 can_captain_of_militia_bureaucracy_desc: "Institué en Nouvelle-France par l'intendant Jean Talon en 1669 et retenu par les gouverneurs militaires britanniques après 1760, le capitaine de milice était l'officier du roi dans chaque paroisse : choisi parmi les habitants importants, confirmé par le gouverneur et chargé de lire les proclamations royales sur le porche de l'église le dimanche, de réquisitionner les travaux de corvée pour les chemins du roi, d'enregistrer le recensement paroissial et de diriger sa compagnie paroissiale au sein de la Milice Canadienne. Les Britanniques trouvèrent cette fonction si utile qu'ils la conservèrent tout au long de la division de 1791, de la mobilisation de 1812 et des rébellions de 1837-1838 ; elle n’a disparu qu’avec la professionnalisation de l’administration municipale dans les années 1850. La victoire de Charles de Salaberry à Châteauguay en 1813 fut remportée en grande partie par les compagnies paroissiales dirigées par leurs capitaines."

 can_constitutional_assemblies_bureaucracy: "Assemblées constitutionnelles"
 can_constitutional_assemblies_bureaucracy_desc: "Par 31 Géo. IIIe s. En 1791, le Parlement de Westminster divisa l'ancienne province de Québec le long de la rivière des Outaouais, accordant à chaque nouvelle colonie un Conseil législatif nommé et une Assemblée législative élue. Ce furent les premiers parlements élus par le peuple au nord des Florides. Le droit de vote de quarante shillings ne nécessitait aucun critère religieux, de sorte que les catholiques du Bas-Canada et les méthodistes du Haut-Canada votèrent et siégèrent dès la première élection générale. Les assemblées se réunissaient à Québec et à Newark (plus tard York) et contenaient la carrière politique de tous les notables de l'époque : Louis-Joseph Papineau à Québec, Robert Baldwin à Toronto, William Lyon Mackenzie à la barre de la Chambre. Ils furent le creuset d’une politique de gouvernement responsable jusqu’à l’Union de 1841."
