 # ===== STATIC MODIFIERS: FORMATION CHOICES =====
 STATIC_MODIFIER_NAME_nd_svb_cakkavatti: "Cakkavatti, le monarque qui fait tourner la roue"
 STATIC_MODIFIER_DESC_nd_svb_cakkavatti: "Le roi est bodhisattva et dhamma-raja, le monarque universel qui fait tourner la roue de la loi. La royauté sacrée centralisée, à la manière des armées d'Angkor Jayavarman VII et Toungoo Bayinnaung, avance sous la bannière safran, et le prestige du trône rayonne à travers le mandala."
 STATIC_MODIFIER_NAME_nd_svb_sangha_federation: "La Fédération Sangha"
 STATIC_MODIFIER_DESC_nd_svb_sangha_federation: "Ce qui lie Suvarnabhumi n’est pas le trône mais l’ordre monastique bouddhiste transcontinental. Chaque roi khmer, thaïlandais, birman, môn et lao gouverne son propre peuple, mais chaque moine en robe safran traverse toutes les frontières et la sangha est l'empire. Une suzeraineté lâche, une large tolérance et le dharma comme seule loi universelle."
 STATIC_MODIFIER_NAME_nd_svb_three_worlds: "L'Empire des Trois Mondes"
 STATIC_MODIFIER_DESC_nd_svb_three_worlds: "Le Trai Phum Phra Ruang du roi Lithai a fait de l'empire un reflet du royaume mortel du cosmos bouddhiste. Les cérémonies de cour, les lois somptuaires et la hiérarchie du mérite karmique sont toutes des représentations théâtrales d'ordre cosmologique, le roi étant le mont Meru au centre, les royaumes des dieux, des hommes et des enfers rayonnant vers l'extérieur dans un apparat rituel élaboré."

 # ===== STATIC MODIFIERS: ADVANCE EVENTS =====
 STATIC_MODIFIER_NAME_nd_svb_assimilation: "Synthèse indochinoise"
 STATIC_MODIFIER_DESC_nd_svb_assimilation: "Les Mon, les Khmers et les Laotiens conquis ne sont pas des sujets mais Suvarnabhumin en devenir. Le bouddhisme Theravada est le solvant universel."
 STATIC_MODIFIER_NAME_nd_svb_tributary_mandala: "Mandala des affluents"
 STATIC_MODIFIER_DESC_nd_svb_tributary_mandala: "Les sous-rois modèles de Bayinnaung conservent leurs trônes et fournissent à leur tour des prélèvements de corps d'éléphants pour l'hommage, le prestige et la protection."
 STATIC_MODIFIER_NAME_nd_svb_state_sangha: "Sangha alignée sur l’État"
 STATIC_MODIFIER_DESC_nd_svb_state_sangha: "La hiérarchie réformée du sangha-raja rend compte directement au trône. Les conseils d'ordination royale appliquent l'orthodoxie et la pureté rituelle dans tout l'empire."
 STATIC_MODIFIER_NAME_nd_svb_forest_sangha: "Tradition de la Sangha forestière"
 STATIC_MODIFIER_DESC_nd_svb_forest_sangha: "Les moines méditants vivant dans la forêt restent l’élite spirituelle, attirant la dévotion laïque au-delà des frontières culturelles et favorisant la piété bouddhiste populaire."
 STATIC_MODIFIER_NAME_nd_svb_open_court: "La Cour cosmopolite"
 STATIC_MODIFIER_DESC_nd_svb_open_court: "Comme Ayutthaya du roi Narai, la capitale abrite des quartiers persans, japonais, français, hollandais, chinois et indiens, l'empire devient une plaque tournante du commerce eurasien."
 STATIC_MODIFIER_NAME_nd_svb_chosen_advisors: "Conseillers étrangers choisis"
 STATIC_MODIFIER_DESC_nd_svb_chosen_advisors: "Comme Cheikh Ahmad et Constantine Phaulkon, certains étrangers sont élevés à de hautes fonctions tandis que le commerce du royaume reste sous le monopole royal."
 STATIC_MODIFIER_NAME_nd_svb_french_drill: "Manuel de forage en français"
 STATIC_MODIFIER_DESC_nd_svb_french_drill: "L'exercice d'infanterie Konbaung sur le modèle européen disciplinait les formations à mèche, les tirs de volée et les mousquetaires équipés de baïonnettes servant de corps d'élite."
 STATIC_MODIFIER_NAME_nd_svb_burmese_arsenal: "L'Arsenal Royal Birman"
 STATIC_MODIFIER_DESC_nd_svb_burmese_arsenal: "Les fonderies d’armes gérées par l’État fabriquaient des armes à feu localement plutôt que de les importer, fournissant ainsi les prélèvements en expansion rapide du dernier empire."

 # ===== FORMATION EVENT =====
 nd_svb.1.t: "Suvarnabhumi, le pays de l'or"
 nd_svb.1.d: "What the Pali sutras called Suvarnabhumi (the Golden Land) has come at last under one banner. The wat-temples of Angkor and the chedis of Ayutthaya, the stupa-strewn plain of Bagan and the That Luang of Vientiane, all four civilizational anchors of mainland Southeast Asia answer to a single Buddhist universal monarch. Bayinnaung held this scope briefly before fragmentation; the Khmer Empire dreamed of it before Thai expansion eroded its frontiers; King Lithai imagined it as the mortal-realm Mount Meru of the Trai Phum cosmology. Now the saffron-and-gold dharma-wheel banner flies over every mainland kingdom from Pagan to the Mekong delta. But what is Suvarnabhumi to be: a single sacral throne, a federation under one sangha, or the Three Worlds made flesh?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_svb.1.a: "Cakkavatti : le monarque universel fait tourner la roue"
 nd_svb.1.b: "Fédération Sangha : rois divisés, dharma uni"
 nd_svb.1.c: "Les Trois Mondes : l’empire comme ordre cosmique"

 # ===== ADVANCE EVENTS =====
 nd_svb.2.t: "La vision de Bayinnaung réalisée"
 nd_svb.2.d: "En 1580, le roi Toungoo Bayinnaung, que les Portugais appelaient le monarque le plus puissant d'Asie après l'empereur de Chine, avait réuni le plus grand système politique contigu de l'histoire de l'Asie du Sud-Est : la Birmanie proprement dite, les États Shan, Lan Na, Lan Xang, Manipur et Ayutthaya elle-même, tous vassaux assermentés de Pegu. Il a tenu le tout grâce à son allégeance personnelle au Cakkavatti, dirigeant depuis une seule capitale sans successeur institutionnel. Moins d’une génération après sa mort, l’empire s’est fragmenté. Nous avons fait ce qu'il ne pouvait pas réaliser : la doctrine de la conquête pancontinentale. Mais comment allons-nous conserver ce qu’il a perdu ?"
 nd_svb.2.a: "Faites de chaque conquérant un Suvarnabhumin"
 nd_svb.2.b: "Règle à travers le mandala des sous-rois"
 nd_svb.3.t: "L'ordination cingalaise"
 nd_svb.3.d: "Des moines seniors sont arrivés du Sri Lanka, héritiers de l'orthodoxie Mahavihara, portant le canon Pali complet et la lignée ininterrompue Theravada remontant jusqu'au Troisième Concile bouddhiste. Comme le roi Anawrahta l'a fait à Bagan, comme Ramkhamhaeng l'a fait à Sukhothai, nous les invitons maintenant à réordonner notre propre sangha et à établir une lignée cinghalaise « pure ». La sangha réformée liera tous les monastères de l'Irrawaddy au Mékong sous une seule ordination mais qui la commandera : le trône ou l'ermitage forestier ?"
 nd_svb.3.a: "Le sangha-raja répond au trône"
 nd_svb.3.b: "Honorez les maîtres forestiers"
 nd_svb.4.t: "La Cour cosmopolite"
 nd_svb.4.d: "Les ambassades arrivent : des jésuites français, des chiites persans accompagnés du seigneur marchand Cheikh Ahmad, des serviteurs japonais ronin, des facteurs hollandais de VOC, des commerçants de thé chinois, des envoyés de la Compagnie anglaise des Indes orientales et des fonctionnaires portuaires indiens musulmans, tous se bousculent pour obtenir un poste dans la capitale. Des quartiers persans et des colonies japonaises bordent le fleuve, aux côtés d'églises portugaises et de pagodes chinoises. L’empire est devenu, comme Ayutthaya l’était sous Narai, une plaque tournante du commerce eurasien. Devons-nous ouvrir grand les portes ou sélectionner soigneusement nos partenaires ?"
 nd_svb.4.a: "Tous les quartiers, tous les drapeaux sont les bienvenus"
 nd_svb.4.b: "Élever les étrangers choisis ; contrôler le reste"
 nd_svb.5.t: "La réforme de la poudre à canon de Konbaung"
 nd_svb.5.d: "Alaungpaya, fondateur de la ligne Konbaung, a décrété un entraînement à mèche standardisé et des formations de tir à la volée disciplinées. Les bateaux de guerre en teck transportent désormais jusqu'à trente mousquetaires et un canon pivotant de 6 livres ; l'artillerie de siège est montée sur des plates-formes en bois pour dégager les murs. Les artilleurs français ont dérivé vers l'est après les troubles de Pondichéry et ont entraîné notre infanterie à la manière européenne. Devons-nous suivre leur modèle en bloc ou construire notre propre arsenal ?"
 nd_svb.5.a: "Adopter le manuel de forage européen"
 nd_svb.5.b: "Arsenaux royaux, modèle birman"
 nd_svb.6.t: "Les trois mondes codifiés"
 nd_svb.6.d: "Le Trai Phum Phra Ruang du roi Lithai, les Trois Mondes Selon le roi Ruang, est devenu l'idéologie canonique de l'art de gouverner. Composé en 1345 comme l'œuvre la plus ancienne connue de la littérature thaïlandaise, il cartographie les trente et un royaumes de la cosmologie bouddhiste : onze niveaux du royaume du désir Kamadhatu, seize du royaume de la forme Rupadhatu, quatre de l'Arupadhatu sans forme. Chaque scène d'enfer peinte à chaque endroit rappelle désormais aux laïcs que le bon karma mène au paradis et le mal au tourment. L’empire est recadré comme le miroir mortel du mont Meru, et le roi règne au centre cosmique."
 nd_svb.6.a: "Laisse chaque chose peindre à nouveau les royaumes"
 nd_svb.7.t: "La ville hydraulique"
 nd_svb.7.d: "Sur mille kilomètres carrés de la plaine d'Angkor, nos ingénieurs ont réalisé le réseau de barays, canaux, douves et remblais qui ont donné à l'Empire khmer ses fondations agricoles. Le Baray occidental détient à lui seul suffisamment d’eau pour recharger la nappe phréatique de saison sèche de toute la région ; le Jayatataka approvisionne la ville elle-même. Les inondations jumelles de la mousson sont maîtrisées, le riz est récolté deux fois et ce qui était un génie technique soutenu sous Suryavarman sert désormais un Suvarnabhumi rénové. Les sécheresses du XIVe siècle qui ont détruit la vieille ville hydraulique d'Angkor ne briseront pas la nôtre, nous l'avons appris de l'histoire."
 nd_svb.7.a: "Le Pays de l'Or boit profondément"

 # ===== ADVANCES =====
 nd_svb_baray_engineering: "Ingénierie Baray"
 nd_svb_baray_engineering_desc: "La tradition khmère des villes hydrauliques consiste à gérer les eaux de mousson avec de vastes réservoirs, des réseaux de canaux et des digues qui captaient les inondations de la saison humide pour recharger les rizières de la saison sèche."
 nd_svb_pali_sangha: "La Sangha Pali"
 nd_svb_pali_sangha_desc: "L'adoption du pali comme langue liturgique canonique unit l'ordre monastique transcontinental Theravada, les moines khmers, môns, birmans, thaïlandais et laotiens chantent tous les mêmes suttas, traversent toutes les frontières et forment un tissu spirituel continu."
 nd_svb_wat_architecture: "Architecture du temple Wat"
 nd_svb_wat_architecture_desc: "La tradition indianisée des temples de pierre qui a produit Angkor Wat, le Bayon et le grès et la latérite parsemés de stupas de Bagan, assemblés en complexes de temples de montagne qui ancrent la géographie spirituelle du royaume."
 nd_svb_riverine_warfare: "Guerre fluviale"
 nd_svb_riverine_warfare_desc: "De longues pirogues de guerre en teck pilotées par des équipages à rames à tambour, combattant sur le Mékong, le Chao Phraya et l'Irrawaddy, les grands systèmes fluviaux qui sont les véritables autoroutes de l'Asie du Sud-Est continentale."
 nd_svb_monsoon_paddy: "Intensification des rizières de mousson"
 nd_svb_monsoon_paddy_desc: "Double culture de riz humide le long des grands fleuves, soutenue par la mobilisation du travail communautaire et la gestion traditionnelle de l'eau, fondement agricole qui a permis à Angkor et Pagan de nourrir leurs populations impériales."
 nd_svb_bronze_buddha: "Fonderie de Bouddha en bronze"
 nd_svb_bronze_buddha_desc: "Le moulage à la cire perdue d'images de Bouddha en bronze, une industrie artistique et religieuse majeure, depuis les bouddhas ambulants de Sukhothai jusqu'aux victoires Mara assises de Mandalay. Les fonderies d'État approvisionnent les temples ; le mécénat des donateurs finance le casting ; le mérite revient au roi comme au dévot."
 nd_svb_royal_chedi: "Construction Royal Chedi-Stupa"
 nd_svb_royal_chedi_desc: "Construction monumentale de reliques comme théâtre de légitimité, chaque roi doit couronner un chedi, et les grandes flèches dorées de Pegu, Ayutthaya et Vientiane marquent la généalogie dynastique de l'empire."
 nd_svb_sinhalese_ordination: "Réforme de l'ordination cinghalaise"
 nd_svb_sinhalese_ordination_desc: "Importer des moines seniors du Sri Lanka pour réordonner la sangha locale et établir une lignée Mahavihara « pure », le modèle de réforme qui s'étendait de Bagan d'Anawrahta et de Sukhothai de Ramkhamhaeng jusqu'aux réordinations du Theravada continental au XVIIIe siècle."
 nd_svb_elephant_doctrine: "Doctrine du Kraal de l'éléphant royal"
 nd_svb_elephant_doctrine_desc: "La capture massive et l'entraînement des éléphants de guerre. Les rois khmers, thaïlandais et birmans entretenaient tous des kraals royaux où les troupeaux sauvages étaient rassemblés, harnachés et entraînés pour le combat, le défilé et les chasses royales. La doctrine institutionnelle qui a donné naissance au corps des éléphants de l’empire."
 nd_svb_mandala_statecraft: "Art de la politique du Mandala"
 nd_svb_mandala_statecraft_desc: "Le modèle de royauté indianisée à tributaires concentriques : un roi divin au centre cosmique entouré de sous-rois devant une allégeance personnelle, un système qui s'étend d'une seule capitale de vallée fluviale à un empire pancontinental."
 nd_svb_toungoo_elephants: "Doctrine de l'éléphant de Toungoo"
 nd_svb_toungoo_elephants_desc: "Les colonnes emblématiques de Bayinnaung regroupaient des éléphants de guerre en formations disciplinées de choc intense, soutenues par l'infanterie et la cavalerie. Les Portugais ont décrit son corps d'éléphants comme le plus redoutable d'Asie, éclipsant même la masse moghole."
 nd_svb_great_river_port: "Les grands ports fluviaux"
 nd_svb_great_river_port_desc: "Établir des ports d'entrepôt aux embouchures et aux confluents du Mékong, du Chao Phraya et de l'Irrawaddy, les villes commerciales à l'embouchure du fleuve qui relient le riz et les pierres précieuses de l'intérieur du pays aux routes maritimes des épices."
 nd_svb_gemstone_trade: "Monopoles du commerce des pierres précieuses"
 nd_svb_gemstone_trade_desc: "Les rubis birmans de la vallée de Mogok, les saphirs cambodgiens de Pailin et les spinelles et perles des monopoles royaux du commerce intérieur sur les champs de pierres précieuses du continent, vendus au monde via Ayutthaya et Pegu."
 nd_svb_bayinnaung_doctrine: "Doctrine Bayinnaung"
 nd_svb_bayinnaung_doctrine_desc: "Le plan stratégique de la conquête pan-continentale : mobilisation rapide de levées multiculturelles, colonnes d’assaut massives d’éléphants et suppression des rebelles Shan et de la résistance laotienne grâce à une concentration écrasante des forces."
 nd_svb_lacquerware: "Tradition de la laque"
 nd_svb_lacquerware_desc: "La cour birmane du Yun et la cour thaïlandaise de lai-rod-nam fabriquent de la laque à base de sève de l'arbre dethitsi appliquée en plusieurs couches sur le bambou et le bois, puis incisée, dorée ou incrustée de nacre. Une exportation signature des tribunaux du continent."
 nd_svb_cakkavatti_guard: "La Garde royale de Cakkavatti"
 nd_svb_cakkavatti_guard_desc: "L'infanterie d'élite des gardes du palais monarque universel, issue des castes de soldats, entraînée dans l'enceinte du roi et responsable directement devant le trône. La suite personnelle du dhamma-raja."
 nd_svb_cosmopolitan_court: "Cour cosmopolite"
 nd_svb_cosmopolitan_court_desc: "La capitale devient le carrefour diplomatique des ministres chiites persans d'Eurasie, des capitaines mercenaires japonais, des émissaires jésuites français, des facteurs VOC néerlandais et des marchands de thé chinois, tous inscrits à la cour, chacun dans son quartier qui lui est assigné."
 nd_svb_trai_phum: "Cosmologie de Trai Phum"
 nd_svb_trai_phum_desc: "Les trois mondes du roi Lithai Selon le roi Ruang, la cosmologie bouddhiste canonique de l'art politique de l'Asie du Sud-Est continentale, cartographiant trente et un royaumes depuis les enfers Avici en passant par l'existence humaine jusqu'aux cieux sans forme des Brahmas."
 nd_svb_sumptuary_law: "Loi somptuaire royale"
 nd_svb_sumptuary_law_desc: "Gradations élaborées de tenues vestimentaires, niveaux de parasols, types de palanquins et registres de discours cérémoniaux, tous codant la hiérarchie du mérite karmique sous une forme visible. La cour devient un théâtre vivant d’ordre cosmologique."
 nd_svb_early_gunpowder: "Adoption précoce de Matchlock"
 nd_svb_early_gunpowder_desc: "Les mercenaires et commerçants portugais apportent des mousquets à mèche et des canons en bronze sur les tribunaux du continent. Diogo Soares de Mello a servi à Ayutthaya, Filipe de Brito a dirigé la Syrie et la révolution ibérique de la poudre arrive tôt dans le golfe du Bengale."
 nd_svb_monk_soldiers: "Sangha réformiste"
 nd_svb_monk_soldiers_desc: "Les moines réformistes en robe safran façonnent activement la politique de l’État, arbitrent les différends et dirigent les mouvements de piété laïque. L’alliance sangha-État devient l’os spirituel de l’empire."
 nd_svb_burmese_musketeer: "Corps des mousquetaires birmans"
 nd_svb_burmese_musketeer_desc: "Infanterie à mèche debout, recrutée dans l'arrière-pays rural et entraînée dans les cantonnements royaux, la force emblématique de Konbaung, déployée en volées disciplinées et entraînée au combat dans la jungle et les zones humides."
 nd_svb_konbaung_reform: "Réforme militaire de Konbaung"
 nd_svb_konbaung_reform_desc: "Les réformes organisationnelles d'Alaungpaya ont standardisé le recrutement de prélèvements dans les districts ruraux, intégré la formation aux armes à feu et les décrets royaux sur le maniement des mousquets transformant les prélèvements de masse traditionnels d'éléphants en une armée de poudre hybride."
 nd_svb_theravada_state: "Religion d'État Theravada"
 nd_svb_theravada_state_desc: "La codification formelle du bouddhisme Theravada en tant qu'idéologie impériale de l'État, titulature royale du dhamma-raja, conseils d'ordination de l'État et construction du chedi liée à la légitimité dynastique."
 nd_svb_imperial_roads: "Routes impériales de pèlerinage"
 nd_svb_imperial_roads_desc: "Les grandes routes nationales reliant les sites des temples wat des routes de pèlerinage de l'empire qui servent également de routes de marche des troupes et de collecteurs d'impôts, unissant les capitales des vallées fluviales en un seul tissu administratif."
 nd_svb_dharma_protector: "Protecteur du Dharma"
 nd_svb_dharma_protector_desc: "Le titre royal sasana-bhirakkhita protecteur de la dispensation bouddhiste. Le roi entretient la sangha, parraine les conseils canoniques et dore les grands chedis en tant que mérite karmique revenant au trône et à la dynastie."
 nd_svb_jingal_artillery: "Artillerie Konbaung Jingal"
 nd_svb_jingal_artillery_desc: "Des canons pivotants montés sur pivot, des zumbooruks, des pièces murales de gros calibre et des petits canons montés sur des chameaux qui comblaient le fossé entre le mousquet et l'artillerie de campagne dans les dernières armées birmanes."
 nd_svb_pan_mainland_identity: "Identité pancontinentale"
 nd_svb_pan_mainland_identity_desc: "La conscience civilisationnelle Theravada partagée devient une identité impériale consciente d’elle-même. Suvarnabhumin, et non khmère, thaïlandaise ou birmane, est ce que les sujets instruits s’appellent de plus en plus."
 nd_svb_anti_colonial_stance: "Résistez à la pénétration coloniale"
 nd_svb_anti_colonial_stance_desc: "Là où le continent historiquement fragmenté est tombé par morceaux aux mains de la Birmanie britannique, de l’Indochine française et des traités inégaux imposés au Siam, un Suvarnabhumi unifié affronte l’expansion européenne en tant que grande puissance unique et peut encore tenir le cap."
 nd_svb_rice_industrial_export: "Exportation de riz industriel"
 nd_svb_rice_industrial_export_desc: "Les deltas du Chao Phraya et de l’Irrawaddy, drainés et exploités en double à l’échelle industrielle, deviennent le grenier à riz de l’Asie de mousson, alimentant Singapour, Hong Kong, Calcutta et les lignes de main-d’œuvre de la mer de Chine méridionale."

 # ===== UNITS =====
 n_nd_svb_war_canoe: "Canoë de guerre"
 n_nd_svb_war_canoe_desc: "Long teak fighting canoe rowed by drummed crews, mounting bow chasers and packed with javelin-and-firearm marines. Fast and thin-hulled. The signature riverine warship of mainland Southeast Asia."
 a_nd_svb_toungoo_elephant: "Éléphant de guerre Toungoo"
 a_nd_svb_toungoo_elephant_desc: "La cavalerie de choc lourde d'éléphants de masse à la manière de Toungoo blindée d'éléphants de guerre en colonnes massives, chacune transportant des cornacs, des archers et des hommes à mèche dans le howdah, déployés en lignes d'assaut disciplinées."
 a_nd_svb_cakkavatti_guard: "Garde royale de Cakkavatti"
 a_nd_svb_cakkavatti_guard_desc: "Infanterie lourde d'élite des gardes blindés du palais du dhamma-raja, issus de familles de castes de soldats, assermentés personnellement au monarque universel."
 a_nd_svb_cakkavatti_guard_levy: "Garde royale de Cakkavatti"
 a_nd_svb_cakkavatti_guard_levy_desc: "Forme de prélèvement de la Garde royale de Cakkavatti."
 a_nd_svb_burmese_musketeer: "Mousquetaire birman"
 a_nd_svb_burmese_musketeer_desc: "Infanterie légère à mèche de l'ère Konbaung, entraînée au combat dans la jungle et les zones humides. Le pilier de l'ancienne armée de poudre à canon du continent, aussi à l'aise dans la défense de palissade que dans l'assaut amphibie."
 a_nd_svb_burmese_musketeer_levy: "Mousquetaire birman"
 a_nd_svb_burmese_musketeer_levy_desc: "Forme de prélèvement du mousquetaire birman."
 a_nd_svb_jingal_artillery: "Artillerie Jingal"
 a_nd_svb_jingal_artillery_desc: "Le canon pivotant Konbaung et le zumborouk à dos de chameau équipent la dernière réponse birmane à l'artillerie de campagne européenne, mobile et bien adaptée au terrain des vallées fluviales de l'empire."

 # ===== BUILDINGS =====
 nd_svb_baray: "Baray royal"
 nd_svb_baray_desc: "Le vaste réservoir de mousson en terre de la ville hydraulique khmère capte les inondations de la saison des pluies pour alimenter le paddy de saison sèche et recharger la nappe phréatique régionale pour une intensification agricole durable."
 nd_svb_baray_maintenance: "Entretien du Baray"
 nd_svb_baray_maintenance_desc: "Entretenir les remblais, les écluses et les canaux d'alimentation contre l'érosion de la mousson."
 nd_svb_pali_college: "Collège monastique de Pali"
 nd_svb_pali_college_desc: "Un monastère d'enseignement résidentiel où la grammaire pali, le canon Tipitaka et la philosophie Abhidhamma sont enseignés aux moines ordonnés, l'épine dorsale spirituelle et éducative de la sangha transcontinentale."
 nd_svb_pali_college_maintenance: "Entretien du Collège Pali"
 nd_svb_pali_college_maintenance_desc: "Copie de manuscrits sur feuilles de palmier, robes monastiques et offrandes quotidiennes d'encens et de dana du temple."
 nd_svb_wat_temple: "Temple Royal Wat"
 nd_svb_wat_temple_desc: "Un complexe de temples en pierre de style Angkor ou Bagan, des galeries concentriques, un prang central ou une flèche de stupa, des bibliothèques, une salle d'ordination et les quartiers des moines environnants. L'ancre spirituelle de la région environnante."
 nd_svb_wat_temple_maintenance: "Entretien du temple Wat"
 nd_svb_wat_temple_maintenance_desc: "Réparation du grès, renouvellement de la dorure, tissu de cérémonie et brûlage constant de l'encens devant les images centrales."
 nd_svb_bronze_buddha_foundry: "Fonderie de Bouddha en bronze"
 nd_svb_bronze_buddha_foundry_desc: "L'atelier de moulage à la cire perdue où des images de Bouddha en bronze, des cloches de cérémonie et des récipients rituels dorés sont produits pour les temples de tout l'empire et pour l'exportation d'une importante industrie de biens de consommation liée à la dévotion religieuse."
 nd_svb_bronze_buddha_foundry_operation: "Coulée de bronze à la cire perdue"
 nd_svb_bronze_buddha_foundry_operation_desc: "Sculpture de modèles en cire d'abeille, investissement en argile, fonte d'alliage cuivre-étain, et long polissage et dorure d'images de Bouddha en bronze finies et de récipients sacrés, ferronnerie religieuse de luxe pour les temples de tout l'empire."
 nd_svb_chedi_stupa: "Royal Chedi-Stupa"
 nd_svb_chedi_stupa_desc: "Une relique monumentale dorée représente le monument du mérite dynastique de la royauté Theravada du continent, marquant l'axe central de la capitale et rassemblant la dévotion des pèlerins à travers le royaume."
 nd_svb_chedi_stupa_maintenance: "Entretien du Chedi"
 nd_svb_chedi_stupa_maintenance_desc: "Renouvellement des feuilles d'or, réparation de la maçonnerie et offrandes perpétuelles de dévotion des pèlerins."
 nd_svb_elephant_kraal: "Kraal des éléphants royaux"
 nd_svb_elephant_kraal_desc: "Une immense palissade de bois où les éléphants sauvages sont rassemblés, triés, dressés pour être harnachés et formés comme terrain de reproduction et d'entraînement du corps des éléphants de guerre de l'empire."
 nd_svb_elephant_kraal_maintenance: "Entretien du Kraal"
 nd_svb_elephant_kraal_maintenance_desc: "Fourrage quotidien, harnais en cuir et en corde, et reconstruction constante des bois de palissade et des stalles d'alimentation."
 nd_svb_river_port: "Port d'entrepôt fluvial"
 nd_svb_river_port_desc: "Un port fortifié à l'embouchure fluviale de Bago, Ayutthaya, Phnom Penh, Vientiane, Yangon, des entrepôts fortifiés, des quartiers étrangers et des quais en pierre qui relient le commerce fluvial de l'empire aux routes maritimes des épices."
 nd_svb_river_port_maintenance: "Entretien du port fluvial"
 nd_svb_river_port_maintenance_desc: "Dragage des canaux sujets au limon, carénage des coques, dépôts de magasins navals et réparation constante des quais en pierre et des jetées en bois."

 # ===== EVENT TOOLTIP VARIABLES =====
 nd_svb_formed_tt: "Suvarnabhumi a été créée."
 nd_svb_path_a_tt: "Voie : Monarque bouddhiste universel Cakkavatti."
 nd_svb_path_b_tt: "Chemin : les rois de la Fédération Sangha divisés, le dharma uni."
 nd_svb_path_c_tt: "Voie : La gouvernance cosmologique de l’Empire des Trois Mondes."
 nd_svb_dest_red_river_share_tt: "At least #bold 50%#! of the locations of the Red River Delta are ours"
 nd_svb_dest_kraals_tt: "At least 4 of our locations have an #bold Elephant Kraal#!"
 nd_svb_dest_sukhothai_developed_tt: "Sukhothai is ours and its development is at least #bold 42#!"
 nd_svb_dest_pagan_developed_tt: "Pagan is ours and its development is at least #bold 59#!"

 # ===== ADDITIONAL BUILDINGS =====
 nd_svb_lacquerware_atelier: "Atelier de Laque"
 nd_svb_lacquerware_atelier_desc: "Un atelier de guilde produisant des laques birmanes yun et thaïlandaises lai-rod-nam à base de sève de l'arbre-thitsi appliquée en plusieurs couches sur du bambou et du bois, puis incisée, dorée ou incrustée de nacre. L'exportation de luxe emblématique des tribunaux du continent."
 nd_svb_lacquerware_atelier_operation: "Production de laque"
 nd_svb_lacquerware_atelier_operation_desc: "Couper des noyaux de bambou, superposer la sève de Thitsi, polir et décorer les pièces finies dans les styles de la cour."
 nd_svb_gem_workshop: "Atelier des gemmes royales"
 nd_svb_gem_workshop_desc: "Un atelier de guilde où les rubis Mogok, les saphirs Pailin, ainsi que les spinelles et les perles du commerce intérieur sont taillés, polis et sertis en or pour la cour royale et le marché d'exportation."
 nd_svb_gem_workshop_operation: "Sertissage Royal"
 nd_svb_gem_workshop_operation_desc: "Facettage et polissage des pierres brutes, sertissage de l'or et de l'argent, et évaluation des bijoux finis destinés à l'usage de la cour et à l'exportation."
 nd_svb_royal_arsenal: "Arsenal Royal"
 nd_svb_royal_arsenal_desc: "Une fonderie d'armes et un moulin à poudre gérés par l'État. Le salpêtre provenant des gisements de l'intérieur, le fer des collines et le bois des forêts de teck sont combinés pour fabriquer des mousquets à mèche, des fusils pivotants et des canons en bronze sous le monopole royal."
 nd_svb_royal_arsenal_operation: "Production royale d'armes à feu"
 nd_svb_royal_arsenal_operation_desc: "Forage, ajustement de crosse, broyage de poudre, ainsi que tests et mise en service d'armes à feu finies de qualité royale."

 # ===== DESTINY ADVANCES =====
 nd_svb_destiny: "Suvarnabhumi destiné"
 nd_svb_destiny_desc: "Le Pays d'Or s'éveille à sa vocation impériale. Des flèches de Wat de Pagan aux chedis de Vientiane, la roue de Cakkavatti commence à tourner. Atteignez la stabilité 75 pour consolider le nouvel ordre et débloquer un chemin de destinée."
 nd_svb_dest_champa_conquest: "La conquête du Champa"
 nd_svb_dest_champa_conquest_desc: "The Cham coastal cities (Simhapura, Vijaya, Panduranga) must fall to the saffron banner before the eastern frontier can be secured. Push elephant columns across the Annamite range and break the last Hindu kingdom of mainland Southeast Asia. Required: own Simhapura, Vijaya and Panduranga."
 nd_svb_dest_red_river: "La rivière Rouge soumet"
 nd_svb_dest_red_river_desc: "Đại Việt held the Red River against southern empires for a millennium. To complete the Cakkavatti's circuit, even Thăng Long must answer to the throne of the wheel. Required: own Thăng Long, hold half of the Red River delta, keep Elephant Kraals in four locations."
 nd_svb_dest_universal_monarch: "Royaume du monarque universel"
 nd_svb_dest_universal_monarch_desc: "Yunnan in the north, Malacca and Temasek in the south: the four cardinal anchors of the Cakkavatti's wheel, and a ring of subject kings around its hub. What Bayinnaung lost in a generation, we hold by destiny. Unlocks the Cakkavatti's Throne. Required: own Kunming, Malacca, and Temasek, four subjects, prestige 75."
 nd_svb_dest_sinhalese_axis: "L’Axe Cingalais"
 nd_svb_dest_sinhalese_axis_desc: "The trans-mainland sangha is born from the Mahavihara at Anuradhapura. Re-establish the Sinhalese ordination axis with mainland endowments and one written monastic law to bind every monastery in one orthodoxy. Required: own Anuradhapura, gold 1000, embraced Legalism."
 nd_svb_dest_three_worlds_flesh: "Trois mondes faits chair"
 nd_svb_dest_three_worlds_flesh_desc: "Trai Phum cosmology demands that the empire be a mortal-realm mirror of Mount Meru: gilded chedis, lacquered halls, gem-encrusted Buddha images. The luxury-export economy underwrites the cosmological state. Sukhothai, where the Trai Phum was written, is to be built up as its seat. Required: own Sukhothai with development 42, gems and lacquerware in your markets, prestige 50."
 nd_svb_dest_civilization_suvarnabhumi: "La civilisation de Suvarnabhumi"
 nd_svb_dest_civilization_suvarnabhumi_desc: "From Pagan's manuscript libraries to Ayutthaya's Persian quarters, the empire becomes the Eurasian crossroads of letters and learning. A unified Theravada civilization, prosperous and literate, takes its place among the great empires of the world. Unlocks the Pali University. Required: embraced Printing Press, gold 3000, own Pagan with development 59."

 # ===== DESTINY EVENTS =====
 nd_svb.8.t: "La roue tourne"
 nd_svb.8.d: "Ce qui a été prophétisé dans le Sutta Pitaka est enfin arrivé : Cakkavatti est apparu au Pays de l'Or et la roue du dharma tourne à nouveau. De l’ouest de l’Irrawaddy à l’est du Mékong, les monastères arborent la bannière du safran ; de la côte Cham aux détroits du Sri Lanka, les ambassades sont à la recherche du monarque universel. Les astrologues de la cour établissaient des horoscopes ; les ministres débattent de doctrine. La route à venir bifurque : la Roue sera-t-elle tournée par l'épée de la conquête, ou par le virage plus doux de la loi du dharma ?"
 nd_svb.8.a: "Laissez la roue tourner."
 nd_svb.9.t: "Les chutes de la côte Cham"
 nd_svb.9.d: "Les tours en briques rouges de Simhapura, les murs du port de Vijaya, les derniers bastions Cham se sont rendus à notre corps d'éléphants. Le royaume hindou qui a combattu les Khmers et les ?i Vi?t pendant mille ans s'incline enfin devant un monarque bouddhiste universel. La frontière orientale est sécurisée ; la mer de Chine méridionale s'ouvre à notre navigation. La chaîne annamite, cette ancienne barrière entre le continent et la côte, n'est plus une frontière mais une route intérieure."
 nd_svb.9.a: "Continuation vers la rivière Rouge."
 nd_svb.10.t: "Thang Long Soumet"
 nd_svb.10.d: "Là où la dynastie L ?i Vi?t a repoussé les khans mongols et les empereurs Ming, nos forces ont fait ce qu'aucune puissance du sud n'a réalisé à Thang Long lui-même. Le delta du fleuve Rouge, avec sa dense population de riz et ses citadelles fortifiées, répond désormais au Cakkavatti. La question est de savoir comment gouverner ce plus ancien et le plus obstiné des royaumes du continent : comme Suvarnabhumin comme tous les autres, ou comme une marche vers le nord avec une garnison perpétuelle ?"
 nd_svb.10.a: "Faites du ?i Vi?t une province de Suvarnabhumi."
 nd_svb.10.b: "Mettez en garnison la rivière Rouge pour une marche vers le nord."
 nd_svb.11.t: "Le royaume du monarque universel"
 nd_svb.11.d: "Kunming au nord, Malacca et Temasek au sud, les quatre ancres cardinales sont les nôtres. Des mines de sel Tai-Yi du Yunnan aux quais aux épices du détroit, de la côte Cham à l’axe d’ordination cinghalais, tout le mandala de l’Asie du Sud-Est continentale répond à un seul Cakkavatti. Le dhamma-raja se trouve au centre cosmique et la roue de safran tourne sur un domaine que Bayinnaung ne pouvait que rêver de détenir. Nous devons maintenant décider de quel genre d'empire il s'agit : un dharma-imperium centralisé administré à partir d'un trône unique, ou le sommet d'un mandala tributaire dans lequel des sous-rois gouvernent sous la protection du monarque universel ?"
 nd_svb.11.a: "Un dharma-imperium unifié."
 nd_svb.11.b: "Le mandala des sous-rois atteint son apogée."
 nd_svb.12.t: "La lignée Mahavihara"
 nd_svb.12.d: "Senior monks have arrived from the Mahavihara at Anuradhapura, bearing the unbroken Sinhalese ordination back to its mainland disciples. Where Anawrahta and Ramkhamhaeng received it piecemeal, we hold the entire axis: Anuradhapura, Pagan, Ayutthaya, Vientiane, the scriptoria already at work copying the Tipitaka in Pali, Khmer, Burmese, Mon, and Lao scripts. The sangha is now a single fabric stretching from the Sri Lankan dagobas to the Mekong delta."
 nd_svb.12.a: "L'orthodoxie est établie."
 nd_svb.13.t: "Les trois mondes codifiés"
 nd_svb.13.d: "Le Trai Phum du roi Lithai est devenu la cosmologie impériale, chaque salle d'eau peinte avec les trente et un royaumes, chaque chedi doré comme un mont Meru mortel, chaque image de Bouddha coulée en bronze et laquée par les ateliers de la cour. Les rubis Mogok, les saphirs Pailin et l'orfèvrerie d'Ayutthaya constituent la richesse visible de l'empire. L'idéologie civilisationnelle exige un noyau organisationnel pour la soutenir. Les ateliers de la cour concentreront-ils l'artisanat dans la capitale, ou l'économie du mérite des routes de pèlerinage répandra-t-elle la prospérité dans les temples d'eau du royaume ?"
 nd_svb.13.a: "Concentrez-vous sur l'artisanat à la cour."
 nd_svb.13.b: "Cultivez l'économie de pèlerinage des wats."
 nd_svb.14.t: "La civilisation de Suvarnabhumi"
 nd_svb.14.d: "Des bibliothèques de feuilles de palmier de Pagan au quartier perse d'Ayutthaya, des moines Mahavihara aux astronomes Konbaung, Suvarnabhumi est devenue une civilisation consciente d'elle-même, comparable à la cour Ming, au durbar moghol, à la Porte ottomane et aux chancelleries européennes. Des commentaires pali, des chroniques judiciaires et des traités d'astronomie sortent des presses à imprimer. L’État sangha a produit sa propre renaissance. Aujourd'hui, les anciens débattent de l'établissement intellectuel de l'empire : un épanouissement de l'érudition textuelle dans toutes les écoles, ou un conseil canonique unique pour fixer l'orthodoxie pour les siècles à venir ?"
 nd_svb.14.a: "Une floraison de lettres Pali."
 nd_svb.14.b: "Convoquer le conseil canonique."

 # ===== DESTINY TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_svb_dest_dai_viet_subjugation: "?i Vi?t subjugué"
 STATIC_MODIFIER_DESC_nd_svb_dest_dai_viet_subjugation: "Le delta du fleuve Rouge s'étend jusqu'à Suvarnabhumi proprement dit. Les armées vétérans poussent vers l’extérieur, les casus belli sont faciles à trouver et les longues lignes de ravitaillement de l’empire s’étendent au-delà des pluies de mousson."
 STATIC_MODIFIER_NAME_nd_svb_dest_red_river_garrison: "La garnison de la rivière Rouge"
 STATIC_MODIFIER_DESC_nd_svb_dest_red_river_garrison: "La frontière du ?i Vi?t est constituée de garnisons lourdes fortifiées de marche du nord, de longs murs défensifs le long de la rivière H?ng et de régiments de levée recrutés localement qui peuvent être mobilisés en saison."
 STATIC_MODIFIER_NAME_nd_svb_dest_dharma_imperium: "L'Empire du Dharma"
 STATIC_MODIFIER_DESC_nd_svb_dest_dharma_imperium: "Un seul trône sacré règne sur le continent, de Pagan au Tonkin. Les cultures conquises s'intègrent rapidement, les greniers à riz des grands deltas nourrissent la population impériale et les ressources des interdictions de prélèvement peuvent être mobilisées rapidement."
 STATIC_MODIFIER_NAME_nd_svb_dest_mandala_apex: "Le Mandala à Apex"
 STATIC_MODIFIER_DESC_nd_svb_dest_mandala_apex: "Le système affluent atteint son apogée. Les sous-rois à Pegu, Ayutthaya, Lan Xang et ?i Vi?t fournissent des prélèvements de corps d'éléphants et un soutien de marche rapide, mais la sangha doit se nourrir sur de vastes distances."
 STATIC_MODIFIER_NAME_nd_svb_dest_court_atelier: "Système d'atelier judiciaire"
 STATIC_MODIFIER_DESC_nd_svb_dest_court_atelier: "Les ateliers royaux de Pegu, Ayutthaya et Vientiane concentrent les maîtres artisans de l'empire en verrerie dorée, laque sertie, et les guildes bourgeoises prospèrent sous la protection royale."
 STATIC_MODIFIER_NAME_nd_svb_dest_pilgrim_economy: "L’économie du pèlerinage"
 STATIC_MODIFIER_DESC_nd_svb_dest_pilgrim_economy: "Le grand réseau de temples wat attire la dévotion laïque à travers tout l'empire, les quartiers de pèlerinage remplissent les villes, les dispensaires monastiques diffusent les connaissances médicales et l'économie du mérite lubrifie le commerce ordinaire."
 STATIC_MODIFIER_NAME_nd_svb_dest_pali_renaissance: "La Renaissance Pali"
 STATIC_MODIFIER_DESC_nd_svb_dest_pali_renaissance: "Les presses à imprimer diffusent des commentaires en pali, des chroniques khmères et des traités d'astronomie birmans. L'alphabétisation se propage des monastères à la population laïque, et l'empire se remet rapidement des guerres de conquête."
 STATIC_MODIFIER_NAME_nd_svb_dest_canonical_council: "Le Conseil canonique"
 STATIC_MODIFIER_DESC_nd_svb_dest_canonical_council: "Un seul grand conseil fixe le Tipitaka orthodoxe pour tout Suvarnabhumi. Le pouvoir du clergé et l’alphabétisation de la noblesse s’élèvent ensemble, mais les écoles hétérodoxes sont supprimées et le règlement politique est difficile."

 # ===== DESTINY BUILDINGS =====
 nd_svb_cakkavatti_throne: "Le trône de Cakkavatti"
 nd_svb_cakkavatti_throne_desc: "La salle d'audience du monarque universel est une vaste salle à piliers située au centre cosmique du royaume, où les ambassadeurs des quatre directions cardinales s'agenouillent devant le dhamma-raja. Capitale uniquement."
 nd_svb_cakkavatti_throne_maintenance: "Entretien de la salle du trône"
 nd_svb_cakkavatti_throne_maintenance_desc: "Soies de cour, insignes de cérémonie et approvisionnement quotidien de la suite du monarque universel."
 nd_svb_pali_university: "Université Pali"
 nd_svb_pali_university_desc: "Un grand monastère scolaire transcontinental, des presses à imprimer produisant le Tipitaka, des salles de conférence débattant de la philosophie Abhidhamma et de la grammaire pali enseignaient aux côtés des sciences sanscrites, persanes et astronomiques. La capitale intellectuelle de la civilisation Theravada."
 nd_svb_pali_university_maintenance: "Entretien de l'Université de Pali"
 nd_svb_pali_university_maintenance_desc: "Copie de manuscrits, éditions de livres imprimés du Tipitaka, offrandes quotidiennes d'encens et de dana et robes de la sangha résidente."

 # ===== DESTINY VARIABLE TOOLTIP STUBS (already exist above, no change) =====

 # ===== BUREAUCRACIES =====
 svb_royal_sangha_council_bureaucracy: "Conseil royal de la Sangha"
 svb_royal_sangha_council_bureaucracy_desc: "Un Sangharaja nommé par l'État et un conseil des anciens theras (le modèle Sudhamma formalisé par les réformes de purification sasana de Bayinnaung dans les années 1560 et le Thathanabaing birman de 1784) certifient les ordinations, la discipline monastique policière et arbitrent les différends doctrinaux à travers la sangha transcontinentale. La cohésion Theravada devient une institution contraignante au-dessus de tout royaume, mais les abbés provinciaux s'opposent à la surveillance centrale."
 svb_sakdina_hierarchy_bureaucracy: "Hiérarchie Sakdina"
 svb_sakdina_hierarchy_bureaucracy_desc: "Codification du rang de dignité par le roi Borommatrailokkanat en 1454 : chaque sujet se voit attribuer une sakdina numérique correspondant au rai de terre, à la préséance du tribunal, au droit aux allocations de service et même à la procédure judiciaire (poids du témoignage adapté au rang). L'innovation administrative déterminante d'Ayutthaya, copiée dans le monde Tai-Khmer-Mon."
 svb_mandala_tributary_ring_bureaucracy: "Anneau Tributaire Mandala"
 svb_mandala_tributary_ring_bureaucracy_desc: "Le cercle des rois indianisés : un cakkavatti primordial au centre cosmique, entouré de rois tributaires payant le bunga mas, s'agenouillant lors du couronnement et assurant les prélèvements en temps de guerre. La réduction par Bayinnaung en 1564 de Maha Chakkraphat au rang de vassal-roi de Pegu est un cas d'école. La souveraineté rayonne de prestige et non de frontières fixes."
 svb_court_brahmin_college_bureaucracy: "Collège brahmane de la Cour"
 svb_court_brahmin_college_bureaucracy_desc: "Le Phra Maha Rajaguru et le Devasathan : les brahmanes de la cour retenus de l'indianisation pré-Theravada pour accomplir les rites de couronnement (cérémonie de Borommatrailokkanat dans les années 1460), les rituels swing saisonniers de Triyampawai et les consultations astrologique-cosmologiques. Une caste de spécialistes d'origine étrangère servant directement le trône, contournant à la fois la sangha et la hiérarchie noble."
 svb_royal_elephant_corps_bureaucracy: "Corps royal des éléphants"
 svb_royal_elephant_corps_bureaucracy_desc: "L'écurie des éléphants du roi : élevage d'éléphants de guerre, caste de cornacs héréditaires et « trésor d'éléphants » cosmologique qui marque les sept insignes d'un monarque universel. La guerre des éléphants blancs menée par Bayinnaung en 1563 contre Ayutthaya a transformé un albinos capturé en casus belli. Le corps est à la fois choc militaire, prestige royal et iconographie bouddhiste."
 svb_phrai_corvee_registry_bureaucracy: "Registre de Phrai Corve"
 svb_phrai_corvee_registry_bureaucracy_desc: "Le projet de travail d'Ayutthaya. Les roturiers libres (phrai luang) sont enregistrés auprès des maîtres-fonctionnaires nai et doivent six mois de service royal par an, travaux publics, réparation des digues de mousson, grenier royal, mobilisation militaire. Codifié à côté de la sakdina mais mécaniquement distinct : telle est la base de mobilisation du royaume. Les nobles se battent plus âprement pour les comptes de phrai que pour les terres."

 # ===== BUREAUCRACY AUTHORITY (auto-modifier on formation) =====
 AUTO_MODIFIER_NAME_nd_svb_bureaucracy_authority: "Le Mandala de Cakkavatti"
 AUTO_MODIFIER_DESC_nd_svb_bureaucracy_authority: "On formation, Suvarnabhumi gains the institutional reach of a universal-monarch realm: the capacity to host historical mainland-Theravada bureaucracies. The cakkavatti's prerogative grants three slots."
