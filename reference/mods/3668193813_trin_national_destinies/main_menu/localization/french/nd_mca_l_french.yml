l_french:
 STATIC_MODIFIER_NAME_nd_path_of_the_golden_zipa: "Chemin de la Zipa Dorée"
 STATIC_MODIFIER_DESC_nd_path_of_the_golden_zipa: "Dans les brumes du lac Guatavita, une nouvelle Zipa était ointe de poussière d'or et jetait de précieuses offrandes dans les eaux sacrées. Cette cérémonie, qui allait inspirer la légende de l'El Dorado, incarnait la croyance Muisca selon laquelle la richesse existait pour honorer les dieux et lier le peuple. La confédération canalise désormais cet héritage doré vers le commerce, l'art et la splendeur culturelle."
 STATIC_MODIFIER_NAME_nd_tundama_defiance: "Le défi de Tundama"
 STATIC_MODIFIER_DESC_nd_tundama_defiance: "Lorsque le cacique Tundama apprit que les seigneurs voisins s'étaient soumis aux envahisseurs étrangers, il coupa les oreilles et la main d'un guerrier qui lui proposait de se rendre. Ses combattants guecha ont tenu les hauts plateaux contre toute attente, choisissant la mort plutôt que la soumission. La confédération incarne désormais cet esprit de résistance inébranlable, transformant les montagnes elles-mêmes en forteresse."
 nd_mca.1.t: "La Confédération Muisca"
 nd_mca.1.d: "The scattered domains of the Altiplano Cundiboyacense stand united at last. The Zipa of Bacata and the Zaque of Hunza, whose rivalry once divided the highland people, now speak with one voice. From the salt mines of Zipaquira to the emerald veins of Somondoco, from the golden workshops of the lowland artisans to the terraced fields of the high plateau, the Muisca are one.\n\nBut unity demands a vision. Shall we build upon the golden splendor that has made our people the envy of the Americas: the trade networks that stretch across mountains and valleys, the artisans whose tunjos gleam with sacred meaning? Or shall we honor the warrior spirit of Tundama, who chose defiance over submission, and forge the highlands into an impregnable bastion?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mca.1.a: "Laissez couler l’or. Nous sommes le peuple d'El Dorado"
 nd_mca.1.b: "Nous sommes les guecha : les montagnes ne seront jamais conquises"
 STATIC_MODIFIER_NAME_nd_mca_gilded_sovereign: "Le souverain doré"
 STATIC_MODIFIER_DESC_nd_mca_gilded_sovereign: "Comme le Zipa recouvert de poussière d'or sur le lac Guatavita, notre souverain a adopté l'ancienne cérémonie qui élève l'autorité mortelle au rang de mandat divin."
 STATIC_MODIFIER_NAME_nd_mca_sacred_offerings: "Offrandes sacrées de Guatavita"
 STATIC_MODIFIER_DESC_nd_mca_sacred_offerings: "Les trésors jetés dans le lac sacré honorent Chie, la déesse de la lune, et Sua, le dieu du soleil. Grâce à ces offrandes, les gens trouvent l'unité spirituelle et l'harmonie cosmique."
 nd_mca.2.t: "La cérémonie de l'Eldorado"
 nd_mca.2.d: "At the heart of Lake Guatavita, three thousand meters above the sea, the ancient ceremony begins. The new ruler is stripped bare and coated in a sticky resin, upon which attendants blow fine gold dust until the figure gleams like a living idol. Accompanied by four lesser chiefs adorned with gold crowns, bracelets, and pendants, the ruler boards a balsa raft laden with golden tunjos, emeralds, and precious offerings.\n\nAs the raft reaches the center of the sacred lake, the drums fall silent. The golden figure dives into the dark waters, washing away the gold as an offering to the goddess who dwells beneath the surface. The chiefs cast their treasures after, and the crowd on shore erupts in song and celebration.\n\nThis ritual, which would one day drive Spanish conquistadors to madness in their search for 'El Dorado,' is for the Muisca something far more profound: it is the moment when earthly power is consecrated by divine acceptance."
 nd_mca.2.a: "Nous brillerons comme le soleil lui-même. Que notre souveraineté soit dorée"
 nd_mca.2.b: "Les dieux sont honorés. Que leurs bénédictions soutiennent notre peuple"
 nd_mca.3.t: "Le défi de Tundama"
 nd_mca.3.d: "Word reaches the highlands that Tundama, cacique of the northern borderlands, has sworn an oath that no Muisca warrior will ever bend the knee to foreign invaders. When one of his guecha warriors dared suggest that accommodation might be the wiser course, Tundama seized the man and cut off his ears and left hand before the assembled army, declaring that those who would counsel surrender had no need of ears to hear commands nor hands to hold weapons.\n\nAt the Battle of Vargas Swamp, Tundama's four thousand guecha warriors faced armored cavalry, steel weapons, and gunpowder: technologies they had never encountered. They fought with spears, clubs, slings, and the fierce conviction that their homeland was worth more than their lives. Though the battle was lost, Tundama's defiance became the immortal spirit of the Muisca people, a refusal to accept conquest as destiny."
 nd_mca.3.a: "Son courage résonne dans toutes les montagnes. Nous ne nous abandonnerons jamais"
 nd_mca.4.t: "Le temple de Sua à Sugamuxi"
 nd_mca.4.d: "In the sacred city of Sugamuxi (known to us as Sogamoso, the City of the Sun) stands the great temple dedicated to Sua, the sun god. Within its walls, the iraca, the supreme religious authority of the Muisca, presides over ceremonies that mark the passage of seasons and the cycles of the Muisca calendar.\n\nThe temple is filled with gold offerings, emeralds, painted cotton cloths, and the mummified remains of revered ancestors. Pilgrims travel from across the confederation to seek the iraca's blessing, bringing offerings of salt, cloth, and precious stones. The temple's astronomical observations guide the planting seasons and festival days, binding the practical rhythms of agriculture to the cosmic order.\n\nThe Temple of Sua is more than a place of worship: it is the spiritual heart that holds the confederation together, the place where the Muisca understand their position between earth and sky."
 nd_mca.4.a: "Le soleil veille sur la Muisca. Nous honorons sa lumière éternelle"
 nd_mca_guecha_border_system: "Système frontalier Guecha"
 nd_mca_guecha_border_system_desc: "Les guerriers guecha étaient une classe militaire d'élite sélectionnée parmi les hommes les plus courageux, quelle que soit leur lignée noble. Entraînés pendant des années au combat, ils défendaient les frontières de la confédération depuis leurs postes fortifiés des vallées de la Tenza et de l'Ubaque."
 nd_mca_salt_trade_mastery: "Maîtrise du commerce du sel"
 nd_mca_salt_trade_mastery_desc: "Les Muisca contrôlaient les gisements de sel les plus riches des hauts plateaux colombiens à Zipaquira, Nemocon et Tausa. Le sel était leur principale monnaie et leur bien commercial le plus précieux, ce qui leur a valu le surnom de « le peuple du sel »."
 nd_mca_terraced_agriculture: "Agriculture en terrasses"
 nd_mca_terraced_agriculture_desc: "Sur le haut plateau de l'Altiplano Cundiboyacense, les Muisca ont construit des champs en terrasses pour le maïs, la pomme de terre et le quinoa. Selon leur mythologie, le héros culturel Bochica leur a appris à construire des terrasses et des canaux d'irrigation."
 nd_mca_sugamuxi_tradition: "Tradition Sugamuxi"
 nd_mca_sugamuxi_tradition_desc: "La ville sacrée de Sugamuxi abritait le grand Temple du Soleil, présidé par l'iraca, l'autorité religieuse suprême. Les pèlerins de toute la confédération apportaient des offrandes d'or, d'émeraudes et de tissus peints."
 nd_mca_muisca_calendar: "Calendrier musical"
 nd_mca_muisca_calendar_desc: "Les Muisca ont développé un calendrier luni-solaire sophistiqué basé sur le dieu solaire Sua et la déesse lunaire Chia, avec des divisions pour les mois synodiques et sidéraux, les années rurales de 12 à 13 mois, les années communes de 20 mois et les années saintes de 37 mois."
 nd_mca_cotton_manta_weaving: "Tissage de Manta en coton"
 nd_mca_cotton_manta_weaving_desc: "Les femmes Muisca étaient des maîtres tisserands qui produisaient des mantas peintes à partir de coton provenant des basses terres plus chaudes. À l’aide de broches en bois et de rouleaux d’argile, ils ont créé des textiles complexes teints avec de l’indigo, du safran et des pigments naturels."
 nd_mca_tunjo_craft: "Artisanat Tunjo"
 nd_mca_tunjo_craft_desc: "Les orfèvres de Muisca créaient des tunjos (petites figurines votives moulées à partir de tumbaga, un alliage d'or et de cuivre) en utilisant la technique de la cire perdue. Ces offrandes n'étaient pas portées comme bijoux mais placées sur des sites sacrés pour honorer les dieux."
 nd_mca_el_dorado_ceremony: "Cérémonie El Dorado"
 nd_mca_el_dorado_ceremony_desc: "L'investiture d'un nouveau Zipa impliquait de recouvrir le souverain de poussière d'or et de naviguer jusqu'au centre du lac Guatavita, où de l'or et des émeraudes étaient jetés dans les eaux en guise d'offrandes. Ce rituel a inspiré la légende de l'El Dorado."
 nd_mca_tundama_valor: "La valeur de Tundama"
 nd_mca_tundama_valor_desc: "Le cacique Tundama incarnait l'esprit martial de la Muisca, refusant la soumission aux envahisseurs étrangers et menant ses guerriers guecha dans une résistance provocante lors de la bataille du marais de Vargas en 1539."
 nd_mca_emerald_trade: "Commerce d'émeraude"
 nd_mca_emerald_trade_desc: "Les Muisca contrôlaient l'accès aux gisements d'émeraude les plus riches des Amériques, principalement à Somondoco. Les émeraudes étaient commercialisées sur de vastes distances et servaient de biens de prestige offerts sur les sites sacrés."
 nd_mca_cacique_councils: "Conseils des caciques"
 nd_mca_cacique_councils_desc: "La confédération Muisca était gouvernée par un système de caciques régionaux qui maintenaient l'autonomie locale tout en reconnaissant l'autorité des Zipa et des Zaque. Leurs cercados fortifiés servaient de centres administratifs."
 nd_mca_guecha_training: "Formation Guécha"
 nd_mca_guecha_training_desc: "Les recrues de la classe des guerriers guecha suivaient des années d’entraînement rigoureux avant d’être affectées aux postes frontières. Ils coupaient leurs cheveux courts pour plus d'efficacité au combat et portaient des manteaux d'armure en coton multicouches distinctifs."
 nd_mca_highland_skirmishers: "Tirailleurs des Highlands"
 nd_mca_highland_skirmishers_desc: "Les guerriers Muisca complétaient leur guecha d'élite par des troupes plus légères armées de frondes et de sarbacanes, utilisant le terrain montagneux de l'Altiplano à leur avantage dans des embuscades et des escarmouches."
 nd_mca_confederation_diplomacy: "Diplomatie de la Confédération"
 nd_mca_confederation_diplomacy_desc: "Les Muisca maintenaient un système diplomatique sophistiqué entre les domaines des Zipa, Zaque, Iraca et Tundama, gérant les alliances et les rivalités à travers des échanges cérémoniels et des liens matrimoniaux."
 nd_mca_bochica_legacy: "L'héritage de Bochica"
 nd_mca_bochica_legacy_desc: "Bochica, le dieu messager barbu de la Muisca, aurait enseigné au peuple l'agriculture, le tissage, la métallurgie et la bonne gouvernance. Ses enseignements constituent le fondement moral et pratique de la civilisation Muisca."
 nd_mca_salt_currency_system: "Système de monnaie de sel"
 nd_mca_salt_currency_system_desc: "Salt served as the primary medium of exchange in Muisca trade, its value universally recognized across the Colombian highlands and beyond. The salt mines of Zipaquira functioned as the confederation's treasury.\n\n#italic Available in: $nd_mca_salt_works$#!"
 nd_mca_plateau_fortifications: "Fortifications du Plateau"
 nd_mca_plateau_fortifications_desc: "La géographie naturelle de l'Altiplano Cundiboyacense, entourée de montagnes et accessible uniquement par des passages étroits, a été complétée par des postes frontières guecha et des cercados fortifiés pour créer un formidable réseau défensif."
 nd_mca_plateau_defense_doctrine: "Doctrine de défense du plateau"
 nd_mca_plateau_defense_doctrine_desc: "S'appuyant sur des générations d'expérience dans la guerre dans les hautes terres, les commandants de Muisca ont développé des tactiques exploitant le terrain montagneux, l'avantage de l'altitude et la connaissance intime des défenseurs de chaque vallée et de chaque col."
 nd_mca_highland_resistance: "Résistance des Hautes Terres"
 nd_mca_highland_resistance_desc: "L'esprit de Tundama s'est perpétué dans la tradition Muisca de résistance des hautes terres : utiliser les montagnes comme fortifications naturelles, harceler les envahisseurs avec des tactiques de guérilla et rendre la conquête trop coûteuse à maintenir."
 nd_mca_depletion_gilding: "Dorure à épuisement"
 nd_mca_depletion_gilding_desc: "Muisca metallurgists perfected the technique of depletion gilding, treating tumbaga alloys with acid to dissolve surface copper, leaving a thin but brilliant layer of pure gold on the surface of their ceremonial objects.\n\n#italic Available in: $nd_mca_goldsmith_workshop$#!"
 nd_mca_zipa_centralization: "Centralisation Zipa"
 nd_mca_zipa_centralization_desc: "Le Zipa de Bacata a progressivement élargi l'autorité centrale sur la confédération du sud, normalisant la collecte des tributs, l'autorité judiciaire et le commandement militaire dans les domaines caciques auparavant autonomes."
 nd_mca_defensive_confederacy: "Confédération défensive"
 nd_mca_defensive_confederacy_desc: "Lorsque les menaces extérieures l’exigeaient, les domaines normalement autonomes de la confédération unissaient leurs guerriers guecha sous un commandement commun, regroupant les effectifs de dizaines de territoires caciques en une seule force défensive."
 nd_mca_muisca_endurance: "Musique Endurance"
 nd_mca_muisca_endurance_desc: "À travers des siècles de pressions extérieures et de changements internes, le peuple Muisca a conservé son identité, ses traditions et son esprit combatif : s’adapter sans abandonner l’essence de qui il est."
 nd_mca_altiplano_governance: "Gouvernance de l'Altiplano"
 nd_mca_altiplano_governance_desc: "L'État mature de Muisca équilibrait l'autorité centrale et l'autonomie régionale, permettant au gouvernement de Zipa de maintenir l'ordre et de percevoir les tributs tandis que les caciques conservaient l'autorité judiciaire et cérémoniale locale."
 nd_mca_mineral_wealth: "Richesse minérale"
 nd_mca_mineral_wealth_desc: "Les hauts plateaux colombiens produisent en abondance des émeraudes, de l’or, du cuivre et du sel. L'exploitation systématique de ces ressources minérales transforme les richesses naturelles de la Confédération en prospérité durable."
 nd_mca_manta_export_mastery: "Maîtrise de l'exportation de Manta"
 nd_mca_manta_export_mastery_desc: "Muisca painted cotton mantas, renowned for their vivid colors and intricate designs, become a major export commodity. The confederation's textile artisans refine their dyeing techniques to meet growing demand.\n\n#italic Available in: $nd_mca_cotton_weaving_house$#!"
 nd_mca_muisca_national_identity: "Identité nationale Muisca"
 nd_mca_muisca_national_identity_desc: "Le peuple Muisca se forge une conscience nationale moderne enracinée dans son héritage ancien : les cérémonies dorées de Guatavita, le défi de Tundama, la sagesse de Bochica et l'unité de la confédération."
 nd_mca_modern_confederation: "Confédération moderne"
 nd_mca_modern_confederation_desc: "L'ancien système des conseils des caciques évolue vers un gouvernement confédéral moderne, préservant l'équilibre entre l'autorité centrale et l'autonomie régionale qui a soutenu la Muisca pendant des siècles."
 nd_mca_andean_solidarity: "Solidarité andine"
 nd_mca_andean_solidarity_desc: "Les Muisca s'adressent aux peuples apparentés des hautes terres des Andes, construisant des alliances basées sur le patrimoine commun, la défense mutuelle et le lien commun des civilisations montagnardes."
 nd_mca_modern_army: "Armée moderne"
 nd_mca_modern_army_desc: "La tradition des guerriers guecha fusionne avec la science militaire moderne, produisant des troupes disciplinées des hautes terres qui combinent des connaissances anciennes de la guerre en montagne avec des tactiques et un entraînement contemporains."
 a_nd_mca_guecha_warriors: "Guerriers Guécha"
 a_nd_mca_guecha_warriors_desc: "Défenseurs frontaliers d'élite de la Muisca, sélectionnés pour leur bravoure, quelle que soit leur naissance. Armé de lances, de massues, de frondes et de sarbacanes, protégé par d'épais manteaux de coton multicouches."
 a_nd_mca_guecha_levy: "Guécha Prélèvement"
 a_nd_mca_guecha_levy_desc: "Guerriers élevés dans un village selon la tradition guecha, entraînés pour défendre les frontières des hautes terres de la confédération."
 a_nd_mca_tundama_vanguard: "Avant-garde de Tundama"
 a_nd_mca_tundama_vanguard_desc: "Les guerriers guecha les plus féroces, du nom du cacique qui refusait de se soumettre aux envahisseurs étrangers. Ils se battent avec la fureur d’hommes qui croient que la reddition est pire que la mort."
 a_nd_mca_highland_slingers: "Frondeurs des hautes terres"
 a_nd_mca_highland_slingers_desc: "Des tirailleurs armés de frondes et de sarbacanes, utilisant le terrain montagneux de l'Altiplano pour harceler les ennemis depuis des positions avantageuses."
 a_nd_mca_plateau_defenders: "Défenseurs du plateau"
 a_nd_mca_plateau_defenders_desc: "Des troupes disciplinées des hautes terres qui combinent la tradition des guerriers guecha avec une expertise défensive raffinée au fil des générations de guerre en montagne."
 nd_mca_salt_works: "Salines de Zipaquira"
 nd_mca_salt_works_desc: "Les installations d'extraction et de traitement du sel qui ont fait de Muisca « le peuple du sel ». Le sel était le principal produit commercial de la confédération et servait de monnaie."
 nd_mca_goldsmith_workshop: "Atelier d'orfèvrerie"
 nd_mca_goldsmith_workshop_desc: "Où les artisans de Muisca fabriquent des tunjos, des figurines votives sacrées, en utilisant la technique de la cire perdue avec du tumbaga, un alliage d'or et de cuivre qui capte la lumière du dieu solaire Sua."
 nd_mca_temple_of_sue: "Temple de Sua"
 nd_mca_temple_of_sue_desc: "Un temple du soleil calqué sur le grand temple de Sua à Sugamuxi, où l'iraca présidait aux observations astronomiques, aux cérémonies du calendrier et à la vie spirituelle de la confédération."
 nd_mca_highland_terrace: "Terrasse des Highlands"
 nd_mca_highland_terrace_desc: "Champs en terrasses creusés dans les pentes de l'Altiplano Cundiboyacense, cultivant du maïs, des pommes de terre et du quinoa à des altitudes où les terres agricoles plates sont rares."
 nd_mca_emerald_depot: "Dépôt d'émeraude"
 nd_mca_emerald_depot_desc: "Un centre de commerce des émeraudes de Somondoco et de Muzo : les gisements les plus riches des Amériques. Ici, les pierres vertes précieuses sont taillées, triées et préparées pour le commerce."
 nd_mca_cercado_palace: "Palais Cercado"
 nd_mca_cercado_palace_desc: "La résidence fortifiée d'un souverain Muisca, entourée d'une palissade en bois. À l’intérieur, le cacique tient la cour, reçoit les hommages, stocke l’or cérémonial et administre la justice."
 nd_mca_cotton_weaving_house: "Maison de tissage de coton"
 nd_mca_cotton_weaving_house_desc: "Un atelier où les femmes Muisca produisent les mantas en coton peint qui font la renommée des habitants des montagnes. À l’aide de broches en bois et de rouleaux d’argile, ils créent des textiles teints avec des pigments naturels."
 nd_mca_guecha_barracks: "Caserne Guécha"
 nd_mca_guecha_barracks_desc: "Terrains d'entraînement où les recrues de toutes classes sociales subissent des années de préparation au combat avant d'obtenir le titre de guerrier guecha et d'être affectées à un poste frontière."
 nd_mca_salt_processing: "Traitement du sel"
 nd_mca_salt_processing_desc: "Extraction et raffinage du sel des gisements rocheux des hautes terres de Zipaquira, à l'aide d'outils en pierre et de bois de chauffage."
 nd_mca_lost_wax_casting: "Moulage à la cire perdue"
 nd_mca_lost_wax_casting_desc: "Moulage de figurines sacrées de tunjo à partir d'un alliage de tumbaga en utilisant la technique de la cire perdue, produisant ainsi des bijoux de cérémonie d'un grand savoir-faire."
 nd_mca_temple_offerings: "Offrandes au temple"
 nd_mca_temple_offerings_desc: "Offrandes cérémonielles de poterie, de teintures et de cire d'abeille, pour les feux rituels et les lampes sacrées, pour soutenir le temple de Sua."
 nd_mca_terrace_maintenance: "Entretien de la terrasse"
 nd_mca_terrace_maintenance_desc: "Entretien continu des terrasses en pierre qui permettent l'agriculture d'altitude."
 nd_mca_emerald_cutting: "Coupe d'émeraude"
 nd_mca_emerald_cutting_desc: "La taille et le polissage qualifiés des émeraudes brutes des gisements Somondoco et Muzo, à l'aide de pierres abrasives et d'outils métalliques."
 nd_mca_palace_upkeep: "Entretien du palais"
 nd_mca_palace_upkeep_desc: "Entretien du palais cercado, y compris sa palissade en bois, ses salles de cérémonie, ses archives administratives et ses magasins d'hommages."
 nd_mca_cotton_processing: "Teinture du coton"
 nd_mca_cotton_processing_desc: "Transformation de la fibre de coton commercialisée dans les hautes terres et teinture avec des pigments naturels pour produire des textiles éclatants qui distinguent les tisserands de Muisca."
 nd_mca_barracks_upkeep: "Entretien des casernes"
 nd_mca_barracks_upkeep_desc: "Entretenir les armes, l'équipement en cuir, les installations d'entraînement et les armures en coton des guerriers guecha."
 nd_mca_salt_loaf_boiling: "Salt Loaf Boiling"
 nd_mca_salt_loaf_boiling_desc: "Brine from the springs of Nemocon and Tausa is boiled down in clay pots over wood fires. Each pot is broken to free a hard loaf of salt, the form in which salt is carried and traded across the highlands."
 nd_mca_gold_plating: "Dorure à épuisement"
 nd_mca_gold_plating_desc: "Traiter l'alliage de tumbaga avec de l'acide pour dissoudre le cuivre en surface, produisant ainsi des objets de cérémonie brillamment dorés."
 nd_mca_manta_dyeing: "Teinture Manta"
 nd_mca_manta_dyeing_desc: "Tissage et teinture de mantas en coton à l'aide de fibres commercialisées dans les hautes terres et de pigments naturels pour produire les textiles Muisca distinctifs."
 nd_mca_formed_tt: "La Confédération Muisca a été créée"
 nd_mca_path_a_tt: "Choisissez le chemin du Zipa doré"
 nd_mca_path_b_tt: "Choisissez le défi de Tundama"
 # ===== DESTINY LOCALIZATION =====
 # Destiny advance names and descriptions
 nd_mca_destiny: "Destin de la Muisca"
 nd_mca_destiny_desc: "La confédération est forgée. Les peuples des hautes terres parlent d’une seule voix. Désormais, la question n’est plus de savoir si les Muisca perdureront, mais ce qu’elles deviendront."
 nd_mca_dest_emerald_roads: "Les routes d'Émeraude"
 nd_mca_dest_emerald_roads_desc: "Contrôlez les grandes artères commerciales de Colombie, la vallée du Cauca et la rivière Magdalena, pour canaliser les richesses en émeraudes, en or et en sel via les marchés de Muisca. Possédez Cali et Mompos tout en accumulant 1 000 pièces d’or."
 nd_mca_dest_markets_of_gold: "Marchés de l'or"
 nd_mca_dest_markets_of_gold_desc: "Étendez le réseau commercial vers le sud jusqu'au carrefour andin de Quito, adoptez des institutions bancaires modernes et amassez 2 000 pièces d'or pour prouver que les Muisca sont le peuple le plus riche des Amériques."
 nd_mca_dest_golden_kingdom: "Le Royaume d'Or"
 nd_mca_dest_golden_kingdom_desc: "Seize the Isthmus of Panama to command the gateway between two oceans, build up Funza, the seat of the Zipa, to 6 development, and achieve 75 prestige. The legend of El Dorado was always true: it was the Muisca all along."
 nd_mca_dest_tairona_war: "La guerre de Tairona"
 nd_mca_dest_tairona_war_desc: "Conquer the Tairona cities of Teyuna and Chayrama in the Sierra Nevada and subjugate the Zenu people of the lowlands. The guecha warriors will prove that the highlands breed the fiercest soldiers in the Americas."
 nd_mca_dest_mountain_dominion: "Domination de la montagne"
 nd_mca_dest_mountain_dominion_desc: "Push beyond the Colombian highlands to seize Caracas, Coro and the shore of Lake Maracaibo. The Muisca will control every mountain pass from the Caribbean to the llanos."
 nd_mca_dest_funza_developed_tt: "We own #bold Funza#! and its development is at least #bold 6#!"
 nd_mca_dest_acamama_share_tt: "We or our non-sovereign subjects hold at least 50% of the locations in Acamama"
 nd_mca_dest_andean_hegemony: "Hégémonie andine"
 nd_mca_dest_andean_hegemony_desc: "March south along the Andes to claim Cusco, the navel of the Inca world, and hold half of the lands around it. With 75 prestige, the Muisca will rule the greatest mountain empire since the Inca themselves."
 # Destiny DHE event text
 nd_mca.5.t: "La Confédération Unie"
 nd_mca.5.d: "La Confédération Muisca constitue un seul peuple, uni sous un seul objectif. L'or du Zipa et la sagesse du Zaque sont réunis. Les lacs sacrés abritent nos offrandes, les mines de sel remplissent nos coffres et les guecha veillent à chaque passage. Que nous construisions un empire d’or ou une forteresse de montagnes, le monde connaîtra le nom Muisca."
 nd_mca.5.a: "Les hauts plateaux sont à nous. Maintenant, nous forgeons notre destin"
 nd_mca.6.t: "Caravanes sur les routes d'Émeraude"
 nd_mca.6.d: "Les grandes routes commerciales des hauts plateaux colombiens passent désormais par les mains des Muisca. Des mines d'émeraude de Somondoco aux salines de Zipaquira, des ateliers d'or des basses terres aux marchés de coton de la vallée du Cauca, un réseau commercial relie les peuples dispersés des Andes. Les marchands de Muisca transportent des gâteaux de sel, des émeraudes et des mantas peintes le long des sentiers de montagne que parcouraient leurs ancêtres il y a mille ans. Mais aujourd’hui, l’ampleur du commerce dépasse tout ce que l’ancienne confédération aurait pu imaginer."
 nd_mca.6.a: "Que la richesse des montagnes afflue vers tous ceux qui font du commerce avec nous"
 nd_mca.7.t: "Les marchés d'or"
 nd_mca.7.d: "The Muisca trade network has grown beyond anything the old caciques could have envisioned. Gold from the highland workshops, emeralds from the eastern slopes, salt from the great mines, and cotton mantas from a hundred weaving houses: all flow through markets that stretch from the equatorial coast to the Venezuelan plains.\n\nBut this wealth demands direction. Shall we invest in the infrastructure of commerce itself, building warehouses, improving roads, and attracting settlers to our growing cities? Or shall we use our prosperity to absorb the diverse peoples of the conquered lands, turning former enemies into fellow citizens of a golden confederation?"
 nd_mca.7.a: "Construisez les marchés et les gens viendront"
 nd_mca.7.b: "Notre richesse unira tous les peuples des hauts plateaux"
 nd_mca.8.t: "Le Royaume d'Or révélé"
 nd_mca.8.d: "When the Spanish conquistadors searched desperately for El Dorado, they never understood that the treasure was not a city of gold but a people who understood gold's true purpose: as sacred offering, as art, as the medium through which mortals honor the divine. Now the Muisca have built what the conquistadors could only dream of: a kingdom where wealth flows from every mine, every market, every workshop.\n\nThe Isthmus of Panama opens two oceans to our trade. The markets of Quito, Cali, and Mompos hum with activity. The legend is fulfilled. But how shall we use this golden destiny?"
 nd_mca.8.a: "Nous serons le carrefour du monde"
 nd_mca.8.b: "Laissons la classe marchande nous conduire vers un âge d'or"
 nd_mca.9.t: "La chute de Teyuna"
 nd_mca.9.d: "The Tairona, builders of the great stone city of Teyuna hidden in the jungle-clad slopes of the Sierra Nevada de Santa Marta, have fallen before the guecha advance. Their terraced city, with its network of stone paths and circular platforms, now acknowledges Muisca sovereignty. To the south, the Zenu goldworkers, whose filigree artistry rivals our own tunjo makers, have likewise submitted.\n\nTundama's spirit lives in every guecha warrior who scaled those jungle slopes. The highlands are no longer merely defended: they are expanding."
 nd_mca.9.a: "Les guecha portent l'esprit de Tundama partout où ils marchent"
 nd_mca.10.t: "Domination des montagnes"
 nd_mca.10.d: "From the Caribbean coast to the Venezuelan highlands, the mountain passes now answer to Muisca authority. Caracas and Coro, once beyond the reach of highland power, fly the banner of the confederation. The guecha warriors have proven that the mountains breed soldiers without equal in the Americas.\n\nBut how shall we hold this expanded dominion? The mountains themselves are our greatest fortress. Shall we fortify every pass and valley, turning the entire Andes into an impregnable defensive network? Or shall we bind the conquered peoples into a true federation, winning loyalty through fair governance rather than force alone?"
 nd_mca.10.a: "Fortifiez chaque col : les montagnes sont nos murs"
 nd_mca.10.b: "Proposer des conditions équitables : un sujet consentant vaut dix forts"
 nd_mca.11.t: "Hégémonie des Andes"
 nd_mca.11.d: "Cusco has fallen. The navel of the Inca world, the city at the center of Tawantinsuyu, now acknowledges the supremacy of the Muisca Confederation. From the Caribbean Sea to the heart of the Andes, from the Venezuelan coast to the sacred valleys of Peru, the mountains obey one people.\n\nTundama once fought four thousand guecha warriors against armored cavalry and gunpowder. He lost the battle but won immortality. Now his spiritual heirs have built what he could only dream of: a highland empire that no force on earth can conquer. How shall we seal this legacy?"
 nd_mca.11.a: "Nous sommes les invaincus. Que tout le monde sache le prix du défi"
 nd_mca.11.b: "Les hauts plateaux sont éternels. Et ainsi sera notre domination"
 # Timed modifier names and descriptions
 STATIC_MODIFIER_NAME_nd_mca_dest_gilded_markets: "Les marchés dorés"
 STATIC_MODIFIER_DESC_nd_mca_dest_gilded_markets: "Un réseau de postes commerciaux et d'entrepôts canalise la richesse des mines et des ateliers vers les marchés de Muisca, attirant des colons et des artisans de toute l'Amérique : même si l'armée souffre d'un financement réduit."
 STATIC_MODIFIER_NAME_nd_mca_dest_sacred_waters: "Eaux sacrées de Guatavita"
 STATIC_MODIFIER_DESC_nd_mca_dest_sacred_waters: "Les offrandes jetées dans le lac Guatavita ont été remboursées au centuple. Les divers peuples des hauts plateaux trouvent un but commun dans la prospérité de Muisca, leurs cultures se fondant dans un tout plus riche."
 STATIC_MODIFIER_NAME_nd_mca_dest_new_dorado: "Le nouvel eldorado"
 STATIC_MODIFIER_DESC_nd_mca_dest_new_dorado: "La légende est réelle. Le Royaume d'Or de Muisca se trouve à la croisée des chemins du monde, ses diplomates sont accueillis dans toutes les cours, ses marchés font l'envie des nations."
 STATIC_MODIFIER_NAME_nd_mca_dest_golden_age: "L'âge d'or de la Muisca"
 STATIC_MODIFIER_DESC_nd_mca_dest_golden_age: "La classe marchande mène une ère de prospérité sans précédent, même si l'esprit martial de la confédération diminue à mesure que la richesse remplace la guerre comme mesure de grandeur."
 STATIC_MODIFIER_NAME_nd_mca_dest_mountain_bulwark: "Le rempart de la montagne"
 STATIC_MODIFIER_DESC_nd_mca_dest_mountain_bulwark: "Chaque col de montagne est fortifié, chaque vallée est une zone de destruction. Les hautes terres recrutent rapidement et se rétablissent rapidement, présentant un mur impénétrable de pierre et d'acier à tout envahisseur."
 STATIC_MODIFIER_NAME_nd_mca_dest_highland_federation: "La Fédération des Highlands"
 STATIC_MODIFIER_DESC_nd_mca_dest_highland_federation: "Les peuples conquis se voient offrir une place dans la confédération, liés par des conditions équitables et une gouvernance partagée : même si cette générosité engendre une certaine complaisance."
 STATIC_MODIFIER_NAME_nd_mca_dest_unconquered_peaks: "Les sommets invaincus"
 STATIC_MODIFIER_DESC_nd_mca_dest_unconquered_peaks: "Le projet Muisca s'étend sur toute la chaîne andine, recrutant des mercenaires parmi les peuples conquis et faisant valoir ses revendications contre tous ceux qui osent défier la suprématie des hauts plateaux."
 STATIC_MODIFIER_NAME_nd_mca_dest_eternal_highlands: "Les hautes terres éternelles"
 STATIC_MODIFIER_DESC_nd_mca_dest_eternal_highlands: "La guerre dans les Highlands s'est perfectionnée au fil des générations. La cavalerie Muisca domine les vallées montagneuses, ses commandants tirent des conditions favorables de chaque engagement et les territoires conquis cèdent leurs richesses à la confédération."
 # Destiny building names and descriptions
 nd_mca_guatavita_treasury: "Trésor de Guatavita"
 nd_mca_guatavita_treasury_desc: "Un grand trésor construit sur les rives du lac sacré, où les richesses dorées de la confédération sont stockées, comptées et réinvesties. Ce que les dieux recevaient en offrande, la nation le reçoit désormais en guise de commerce."
 nd_mca_tundama_citadel: "Citadelle de Tundama"
 nd_mca_tundama_citadel_desc: "Une forteresse de montagne nommée en l'honneur du cacique qui refusa de se rendre. Construit dans le rocher vivant des Andes, il sert à la fois de garnison et de symbole de l'esprit invincible des habitants des montagnes."
 # Destiny building PM names and descriptions
 nd_mca_treasury_maintenance: "Entretien de la trésorerie"
 nd_mca_treasury_maintenance_desc: "La tenue des registres du trésor, des coffres-forts et des opérations commerciales nécessite des commis qualifiés, du papier de qualité et une ferronnerie raffinée."
 nd_mca_citadel_upkeep: "Entretien de la Citadelle"
 nd_mca_citadel_upkeep_desc: "L'entretien des fortifications, des armureries et des terrains d'entraînement de la citadelle de montagne nécessite de la pierre, des armes et des provisions."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_mca_bureaucracy_authority: "Autorité confédérée de Muisca"
 AUTO_MODIFIER_DESC_nd_mca_bureaucracy_authority: "The institutions of the Muisca highland federation (the bipolar Zipa-Zaque diarchy, the sun-priesthood of Iraca at Sugamuxi, the salt and emerald monopoly anchored on Zipaquira and Muzo, and the Guecha warrior caste) have crystallized into a coherent administrative apparatus. From this foundation the Muisca Confederation gives its institutions their durable form. Two of them may be kept at a time."

 mca_zipa_zaque_diarchy_bureaucracy: "Diarchie Zipa-Zaque"
 mca_zipa_zaque_diarchy_bureaucracy_desc: "Les Muisca n'étaient pas un royaume unique mais une confédération bipolaire dont les deux chefs suprêmes, le Zipa de Bacata au sud et le Zaque de Hunza au nord, se partageaient les clans zybyns des hautes terres, Iraca et Tundama détenant des zones souveraines plus petites au sein de la même fédération. Bacata et Hunza se sont coordonnés contre les ennemis extérieurs des basses terres - les Panche de la vallée de la Magdalena et les Muzo des pentes occidentales - mais se sont livrés des guerres de succession intermittentes chaque fois qu'un chef suprême mourait sans héritier incontesté du fils de sa sœur. La diarchie était un équilibre permanent et instable que les entradas espagnoles de 1537-1539 ont trouvé et exploité, jouant Bacata et Hunza l'un contre l'autre jusqu'à ce que les deux soient engloutis par la conquête."

 mca_iraca_priesthood_bureaucracy: "Cacique de Sugamuxi"
 mca_iraca_priesthood_bureaucracy_desc: "Le sacerdoce Iraca du temple de Sugamuxi, dans la ville Boyaca moderne de Sogamoso, était le cœur religieux de la sphère culturelle Muisca, reconnu comme légitime même par Bacata et Hunza lorsqu'ils étaient en guerre l'un contre l'autre. Le cacique Iraca était le prêtre en chef de Sue le soleil et de Chia la lune, dirigeait les jeûnes de rotation des aspirants caciques dans des grottes sombres avant leur investiture et supervisait le grand rite d'offrande du lac d'or de Guatavita qui a donné à l'Europe sa légende d'El Dorado. Les Espagnols brûlèrent le temple en bois de Sugamuxi jusqu'à ses fondations lors de la conquête de 1537, un accident que les chroniques attribuèrent à une bougie négligée dans la réserve d'or et de manteau ; le sacerdoce n'a pas survécu à l'incendie."

 mca_salt_emerald_monopoly_bureaucracy: "Monopole du sel et de l'émeraude"
 mca_salt_emerald_monopoly_bureaucracy_desc: "La Muisca était située sur les seuls gisements de sel majeurs du nord des Andes, extraite à ciel ouvert à Zipaquira et bouillie à partir de saumure concentrée à Nemocon et Tausa. Ils contrôlaient également les veines d'émeraude de Muzo, Somondoco et Chivor : la seule source commerciale de belles émeraudes dans le monde précolombien. Les mineurs affectés par l'État exploitaient les salines selon une rotation saisonnière; l'extraction d'émeraude était réservée aux clans titulaires d'une licence de la couronne qui payaient un tribut en pierres brutes aux Zipa. Les pains de sel et les lingots d'or et de cuivre tumbaga constituaient l'unité du commerce Muisca sur de longues distances, échangés avec les habitants des plaines des Caraïbes contre du coton, du poisson séché, des peaux de jaguar et des plumes d'ara."

 mca_guecha_warriors_bureaucracy: "Caste des Guerriers Guecha"
 mca_guecha_warriors_bureaucracy_desc: "Les Guechas étaient la classe de guerriers semi-professionnels Muisca, recrutés parmi les jeunes hommes les plus forts des clans zybyns, tatoués une fois sur la lèvre pour chaque ennemi tué et récompensés par le Zipa avec des concessions de terres, des épouses secondaires et la licence de porter l'ornement de nez en or autrement réservé aux caciques. Leur rôle principal était la défense de la frontière contre le Panche de la vallée de la Magdalena et le Muzo du versant occidental, et le renforcement dynastique chaque fois qu'un cacique élu refusait le jeûne prescrit à Iraca. Les Guechas criaient en chœur en marche pour terrifier l'ennemi et combattaient avec des lances, des frondes et des massues macana en bois de palmier - mais contre les chevaux et l'acier espagnols, ils furent anéantis à Funza en 1538."
 STATIC_MODIFIER_NAME_nd_mca_zipa_zaque_compact: "Zipa-Zaque Compact"
 STATIC_MODIFIER_DESC_nd_mca_zipa_zaque_compact: "La double direction de la Confédération : les Zipa de Bacat au sud et les Zaque de Hunza au nord gouvernent en tant que monarques co-égaux, le roi-prêtre Iraca à Sugamuxi assurant l'unité rituelle au-dessus de la royauté laïque. Les caciques constituants conservent une réelle autonomie. La Confédération est décentralisée par une charte fondatrice et non par un royaume unitaire."
