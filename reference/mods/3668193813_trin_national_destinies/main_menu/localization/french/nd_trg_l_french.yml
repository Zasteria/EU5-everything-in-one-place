l_french:
 STATIC_MODIFIER_NAME_nd_trg_drum_of_the_free_tents: "Drum of the Free Tents"
 STATIC_MODIFIER_DESC_nd_trg_drum_of_the_free_tents: "The confederation is what the Tuareg have always been: tents that gather when the drum is beaten and scatter when the war is done. No herder is made to settle, the host is large and quick to raise, and the amenokal's treasury stays thin."
 STATIC_MODIFIER_NAME_nd_trg_seat_in_the_oases: "A Seat in the Oases"
 STATIC_MODIFIER_DESC_nd_trg_seat_in_the_oases: "The amenokal keeps a fixed court among the gardens and the caravan markets. Herders are settled as cultivators and townsmen, tolls are counted, walls are raised, and the camel tribes mutter that their chief has become a merchant."
 STATIC_MODIFIER_NAME_nd_trg_rods_for_the_sudan: "Rods for the Sudan"
 STATIC_MODIFIER_DESC_nd_trg_rods_for_the_sudan: "The copper rods of Takedda pass as money from Gobir to Bornu, and every one of them left the mine through our hands."
 STATIC_MODIFIER_NAME_nd_trg_rule_from_the_tents: "Rule from the Tents"
 STATIC_MODIFIER_DESC_nd_trg_rule_from_the_tents: "The city keeps its governor, its judges and its markets, and two parts in three of its taxes ride out to the amenokal's camp."
 STATIC_MODIFIER_NAME_nd_trg_amenokal_in_the_city: "The Amenokal in the City"
 STATIC_MODIFIER_DESC_nd_trg_amenokal_in_the_city: "Our chief sits among the scholars of Sankore and learns what a city knows. The tribes say he has forgotten the smell of the herds."
 STATIC_MODIFIER_NAME_nd_trg_sharifian_sultans: "The Sharifian House"
 STATIC_MODIFIER_DESC_nd_trg_sharifian_sultans: "The drum stays with a house that claims the blood of the Prophet. The clerics are content and the pilgrims speak well of us. The warrior tribes obey with bad grace."
 STATIC_MODIFIER_NAME_nd_trg_drum_of_the_uraghen: "Drum of the Uraghen"
 STATIC_MODIFIER_DESC_nd_trg_drum_of_the_uraghen: "The drum has passed to the men who carry the lances. More riders answer it than ever answered a sultan, and the clerics who blessed the old house keep their distance."
 STATIC_MODIFIER_NAME_nd_trg_reform_of_al_jilani: "The Reform of al-Jilani"
 STATIC_MODIFIER_DESC_nd_trg_reform_of_al_jilani: "The preacher's rule is the rule of the confederation: herders are settled beside wells and mosques, tribute to the nobles is called unlawful, and the warrior tribes count what they have lost."
 STATIC_MODIFIER_NAME_nd_trg_drum_against_the_preacher: "The Drum Against the Preacher"
 STATIC_MODIFIER_DESC_nd_trg_drum_against_the_preacher: "The nobles have ridden against the reformer and kept the old order. The tribes are proud of it. The clerical tribes will remember who broke their camps."
 nd_trg.1.t: "The Drum Above the Drums"
 nd_trg.1.d: "For as long as anyone remembers, each confederation of the veiled people has answered to its own #italic ettebel#!, the great drum whose keeper is amenokal over every tribe within its sound. The Kel Ahaggar keep theirs in the mountains of the Hoggar, the Kel Ajjer theirs above Ghat and Djanet, the Kel Adagh theirs in the valleys of the Ifoghas, and the tribes of the Aïr and the Azawagh theirs. Now the chiefs of all of them sit in one circle, and one drum has been set above the rest.\n\nWhat that drum is to mean has not been settled. The nobles of the camel tribes say the confederation must stay what the Tuareg have always been: free tents that gather when the drum is beaten and scatter when the war is over, giving an amenokal respect and little else. Others point to the oasis towns on the caravan roads, to Ghat, Tadmekka and Takedda, and say that a ruler who means to hold the desert for longer than one lifetime needs walls, gardens, a treasury, and subjects who stay where they are put.\n\nThe first road keeps the tribes as they are, quick to raise and hard to tax. The second turns herders into gardeners and townsmen, and the tribes will not thank us for it.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_trg.1.a: "Let the tents stay free. The drum will call them when it must."
 nd_trg.1.a_tt: "Tribesmen stay tribesmen for twenty years, more of them answer the levy, their numbers grow and armies cross roadless country faster. The tribes are satisfied. Taxes suffer."
 nd_trg.1.b: "An amenokal needs a seat. Settle the tribes around the oases."
 nd_trg.1.b_tt: "Tribesmen settle as peasants faster for twenty years, the crown is stronger, building is cheaper and tariffs may be set higher. The tribes are slighted."
 nd_trg.2.t: "The Copper Rods of Takedda"
 nd_trg.2.d: "In 1353 the traveller Ibn Battuta, on his way home from Mali, rested at Takedda and wrote down what he saw. Copper was dug from a mine outside the town and smelted in the houses, then cast into rods a span and a half long, some thin and some thick. Four hundred of the thick rods bought a mithqal of gold, and six or seven hundred of the thin. With the thin ones the people of Takedda bought meat and firewood. With the thick ones they bought slaves, millet, butter and wheat.\n\nThe rods did not stay in the desert. Caravans carried them south to Gobir and to Bornu, where no copper is found and a rod of Takedda passed from hand to hand as money. The sultan of the town, a Berber, rode out to greet his guest on a horse without a saddle, and sent him on his way with a guide.\n\nThe mine is ours now, and so is the road south."
 nd_trg.2.a: "Copper is our coin, and the south is hungry for it."
 nd_trg.2.a_tt: "Minting income and merchant power for ten years."
 nd_trg.3.t: "Masters of Timbuktu"
 nd_trg.3.d: "In 1433, as the power of Mali drained away from the Niger bend, the Tuareg chief Akil ag Malwal took Timbuktu. What he did next surprised the townsmen. He did not move in. He left the city in the hands of its governor, Muhammad Naddi, kept to his herds and his tents in the desert outside, and had two parts in three of the taxes carried out to his camp. Under that arrangement the scholars of Sankore taught undisturbed for a generation.\n\nIt ended when a later chief reached for the governor's third as well. The governor's son wrote to Sonni Ali of Songhai, and in 1468 Songhai took the city.\n\nNow Timbuktu, or a city like it, answers to us. We can rule it the way Akil did, from a camp beyond its walls, and stay what we are. Or we can ride in, sit among its merchants and its books, and learn what a city has to teach."
 nd_trg.3.a: "A city is best ruled from a camp outside its walls."
 nd_trg.3.a_tt: "Taxes, income from subjects and satisfied tribes for fifteen years."
 nd_trg.3.b: "Ride in and hold the mosques and the markets ourselves."
 nd_trg.3.b_tt: "Research and the spread of institutions for fifteen years. The tribes are slighted."
 nd_trg.4.t: "The Fall of the Imenan"
 nd_trg.4.d: "For generations the tribes of the Ajjer and the Ahaggar obeyed the Imenan, a house that called itself sharifian, of the blood of the Prophet, and whose chiefs were styled sultans at Ghat and Djanet. Their blessing was honoured from the Tassili to the Hoggar. Their demands grew heavier with every reign.\n\nAround 1660 the Uraghen, warrior nobles of the Ajjer, rose against the sultan Goma and killed him. The drum passed to the men who carried the lances, and it has never gone back. In time the Kel Rela of the Ahaggar took a drum of their own, and the two confederations have chosen separate amenokals ever since.\n\nThe same quarrel has come to our own council. The sharifian house still has its partisans among the clerics and the oasis folk. The camel tribes have had enough of it."
 nd_trg.4.a: "The blood of the Prophet is not to be set aside."
 nd_trg.4.a_tt: "Prestige, tolerance of the true faith and a satisfied clergy for fifteen years. The tribes are slighted."
 nd_trg.4.b: "The drum belongs to those who can defend it."
 nd_trg.4.b_tt: "A larger tribal levy, morale and army tradition for fifteen years. The clergy are slighted."
 nd_trg.5.t: "The Day of Toya"
 nd_trg.5.d: "In 1591 Moroccan musketeers crossed the desert and broke the empire of Songhai in a single morning. Their descendants, the Arma, ruled Timbuktu and the river for a century and a half, and no one who fought with spear and sword had found an answer to their guns.\n\nIn 1737 the Pasha of Timbuktu led the Arma out against the Tuareg of the Tademekkat and their chief Oghmor. They met at Toya on the Niger. The riders came on too fast and from too many sides for the volleys to count. The Pasha was killed with the best of his men, and the army that had held the river since Tondibi was never raised again. From that day the pashas paid the tribes for leave to live in their own city.\n\nThe singers already have the verses."
 nd_trg.5.a: "The river belongs to the camel riders now."
 nd_trg.5.a_tt: "Prestige and army tradition."
 nd_trg.6.t: "The Preaching of al-Jilani"
 nd_trg.6.d: "In the first years of the nineteenth century a scholar of the clerical tribes of the Azawagh, Muhammad al-Jilani, began to preach that the Tuareg lived wrongly. The nobles, he said, took tribute they had no right to. The wandering life kept men from the mosque. The faithful should settle beside their wells, sow, pray together, and obey the law and nothing else.\n\nThe #italic ineslemen#!, the tribes of religion, had never carried weapons. They took them up for him. He found a friend in Muhammad Bello of Sokoto, whose own father had made a caliphate out of such preaching. The warrior nobles of the Kel Dinnik, whose whole order al-Jilani meant to end, called on their allies among the Kel Gress, and after years of fighting they drove him out. He fled to the protection of Sokoto.\n\nHis followers are armed and in the field, and our council must choose whose side the drum is on."
 nd_trg.6.a: "He speaks the truth. Let the tribes settle and pray."
 nd_trg.6.a_tt: "Tribesmen settle as peasants faster, conversion quickens and the clergy are satisfied for fifteen years. The tribes are slighted."
 nd_trg.6.b: "No preacher takes the drum from its keepers."
 nd_trg.6.b_tt: "Levies fight better, morale rises and the tribes are satisfied for fifteen years. The clergy are slighted."
 nd_trg_formed_tt: "The Tuareg confederation has been formed"
 nd_trg_path_a_tt: "Chose the Drum of the Free Tents"
 nd_trg_path_b_tt: "Chose a Seat in the Oases"
 nd_trg_voice_of_the_drum: "Voice of the Drum"
 nd_trg_voice_of_the_drum_desc: "The #italic ettebel#! is a drum and it is also a people: every tribe that rides when it is beaten forms one drum group, and whoever keeps the drum is their amenokal. He is chosen by the nobles and the chiefs of the vassal tribes together, and they can take the drum from him again. Setting one drum above the others gives the whole confederation a single voice to answer."
 nd_trg_riders_of_the_ettebel: "Riders of the Ettebel"
 nd_trg_riders_of_the_ettebel_desc: "When the drum sounds, the men of every camp within its reach saddle their camels and ride to the amenokal's tent. No one is paid and no one is counted. A tribe that stayed away would lose its name."
 nd_trg_shield_and_iron_lance: "Shield and Iron Lance"
 nd_trg_shield_and_iron_lance_desc: "A Tuareg noble rides to battle and fights it on foot. He carries the #italic agher#!, a shield of white oryx hide as tall as his shoulder, and the #italic allagh#!, a lance forged of iron from point to butt. A line of such men is short, and it does not give way."
 nd_trg_letters_in_the_sand: "Letters in the Sand"
 nd_trg_letters_in_the_sand_desc: "The Tuareg have a script of their own, the Tifinagh, older than the coming of Islam and cut into the rocks of every massif from the Adagh to the Tassili. It is the women who keep it. A mother draws the letters in the sand for her children, and messages, verses and the names of lovers are written in it on bracelets, shields and stones."
 nd_trg_wells_of_the_deep_desert: "Wells of the Deep Desert"
 nd_trg_wells_of_the_deep_desert_desc: "A road across the Sahara is a line of wells and nothing more. Each well belongs to the tribe that dug it and keeps it clear of sand, and a caravan or an army that does not know where the next one lies, or who holds it, does not arrive."
 nd_trg_bald_dinars_of_tadmekka: "Bald Dinars of Tadmekka"
 nd_trg_bald_dinars_of_tadmekka_desc: "Long before our time the geographer al-Bakri wrote that Tadmekka, of all the towns of the world, most resembled Mecca, and that its people struck dinars of pure gold with no stamp on them, called bald. The moulds they were cast in still lie in the ruins. The gold of the Sudan was refined and given its weight here, in a Tuareg town, before it crossed the desert."
 nd_trg_copper_rods_of_takedda: "Copper Rods of Takedda"
 nd_trg_copper_rods_of_takedda_desc: "West of the Aïr the red copper of Takedda is dug, smelted and cast into rods of a fixed length, thick and thin. In the lands to the south, which have gold and no copper, the rods are money. The kings of Mali fought to hold this mine and the Tuareg sultans of the town grew rich on it."
 nd_trg_cure_of_the_salt_pastures: "Cure of the Salt Pastures"
 nd_trg_cure_of_the_salt_pastures_desc: "When the rains end, the tribes drive their herds north to the salt flats and briny pools around In Gall, the #italic tenekert#!. The animals lick the earth and drink the bitter water and come away strong enough for the dry season. For a few weeks the whole confederation is camped in one plain. Marriages are made there, quarrels judged, and camels bought and sold by the thousand."
 nd_trg_tiwse_of_the_vassals: "Tiwse of the Vassals"
 nd_trg_tiwse_of_the_vassals_desc: "Every vassal tribe owes its noble protectors the #italic tiwse#!, paid each year in goats, butter, hides and cloth, and every caravan it guides owes a share besides. It is tribute and it is also a contract: the noble who takes it must ride out when the vassal's herds are raided."
 nd_trg_masters_of_timbuktu: "Masters of Timbuktu"
 nd_trg_masters_of_timbuktu_desc: "In 1433 the chief Akil ag Malwal took Timbuktu from Mali and ruled it for a generation without ever living in it. A governor kept the city, and two thirds of its revenue went out to the Tuareg camp. The desert has known since then how to draw an income from towns it does not care to live in."
 nd_trg_saddle_of_three_horns: "Saddle of Three Horns"
 nd_trg_saddle_of_three_horns_desc: "The Tuareg riding saddle sits before the camel's hump and ends in a tall pommel of three horns, covered in red and green leather. It lets a rider steer with his bare feet on the animal's neck and keeps both hands free for lance and sword. The same camp workshops cut tent skins, water bags and the great leather sacks of the caravans."
 nd_trg_arming_of_the_kel_ulli: "Arming of the Kel Ulli"
 nd_trg_arming_of_the_kel_ulli_desc: "The vassal tribes are called the #italic Kel Ulli#!, the people of the goats, and once they were forbidden the camel and the sword. As the wars grew longer the nobles could not fight them alone. The vassals were given riding camels and iron lances and a share of the plunder, and the host of the confederation grew to several times its old size."
 nd_trg_people_of_the_market: "People of the Market"
 nd_trg_people_of_the_market_desc: "When Tadmekka was abandoned, its scholars did not vanish. They became the #italic Kel Es-Suq#!, the people of the market, a tribe of teachers, judges and copyists who move from camp to camp across the whole Tuareg world. A chief who wants a letter written, a marriage contracted or a dispute judged by the law sends for one of them."
 nd_trg_caravans_of_the_host: "Caravans of the Host"
 nd_trg_caravans_of_the_host_desc: "The men who load salt bars for the long road know to the handful how much a camel can carry and how many days it can go without water. A host that marches with such men behind it, and their animals, eats and drinks where another army would turn back."
 nd_trg_fattening_of_the_herds: "Fattening of the Herds"
 nd_trg_fattening_of_the_herds_desc: "Goats, sheep and the humped cattle of the south are brought to the salt pastures alongside the camels. A herd that has taken the cure gives more milk and bears more young, and a tribe with full herds raises more sons."
 nd_trg_veiled_riders_for_hire: "Veiled Riders for Hire"
 nd_trg_veiled_riders_for_hire_desc: "The kings of the river have never trusted the Tuareg and have never gone to war without them. Sonni Ali and the Askias after him paid camel riders of the desert to scout, to raid and to guard their flanks. The young men come home with cloth and horses, and some do not come home."
 nd_trg_ahal_and_imzad: "Ahal and Imzad"
 nd_trg_ahal_and_imzad_desc: "In the evening the young people of a camp gather for the #italic ahal#!. A woman plays the #italic imzad#!, a fiddle of one string that only women may touch, and the men answer with verses of their own making, on war, on love, and on the faults of their rivals. A man who has run from a fight is told that no imzad will be played for him again."
 nd_trg_red_and_green_leather: "Red and Green Leather"
 nd_trg_red_and_green_leather_desc: "The women of the artisan caste dye goatskin red, green and yellow and cut it into fringed bags, cushions, sheaths and saddle covers worked with patterns as fine as embroidery. The caravans carry them to every market from Kano to Tripoli."
 nd_trg_slabs_of_taoudenni: "Slabs of Taoudenni"
 nd_trg_slabs_of_taoudenni_desc: "In 1585 the Sultan of Morocco seized the old salt mine of Taghaza, and the miners walked away from it and opened a new one at Taoudenni, twenty days north of Timbuktu. The rock salt there is cut from the pit in slabs as long as a man, four to a camel. Whoever guards the road from the mine to the river takes a slab in every load."
 nd_trg_people_of_the_tents: "People of the Tents"
 nd_trg_people_of_the_tents_desc: "After the Moroccans broke Songhai in 1591 there was no king on the Niger strong enough to keep the desert out. The tribes moved south with their herds into the pastures of the river bend. A tent, its poles and all a family owns go onto two camels in a morning, and a people that lives so needs little and is hard to find."
 nd_trg_fair_of_ghat: "Fair of Ghat"
 nd_trg_fair_of_ghat_desc: "Ghat lies where the road from Tripoli and Ghadames meets the roads to the Aïr and the Sudan. At its yearly fair the merchants of Ghadames buy slaves, ivory, senna and ostrich feathers and sell cloth, paper and blades, and none of them travels a day beyond the town without a Tuareg guide and a payment to the Kel Ajjer."
 nd_trg_horsemen_of_the_azawagh: "Horsemen of the Azawagh"
 nd_trg_horsemen_of_the_azawagh_desc: "Under the amenokal Karidenna the Iwellemmedan left the Adagh and took the plains of the Azawagh and the river bend. In that country there is grass, and a noble rides a horse to war and keeps his camels for the road. Their cavalry made them the strongest of all the confederations."
 nd_trg_host_of_the_tademekkat: "Host of the Tademekkat"
 nd_trg_host_of_the_tademekkat_desc: "The tribes that take their name from old Tadmekka settled around Timbuktu and learned how the Pashalik's musketeers fought: slowly, in a block, facing one way. The answer was more riders than the guns could count, coming from every side at once."
 nd_trg_drum_to_the_warriors: "The Drum to the Warriors"
 nd_trg_drum_to_the_warriors_desc: "Around 1660 the warrior Uraghen overthrew the sharifian Imenan who had been sultans over the Ajjer and the Ahaggar. Since then no drum has been held by right of holy descent. It is held by the tribe that can muster the most lances, for as long as it can."
 nd_trg_caravan_of_the_amadror: "Caravan of the Amadror"
 nd_trg_caravan_of_the_amadror_desc: "North of the Hoggar lies the plain of Amadror, where salt can be lifted from the ground in bars. Each year the Kel Ahaggar load it onto hundreds of camels and go south for months, as far as the millet country of the Sudan, where a load of salt is changed for a load of grain."
 nd_trg_gardens_of_the_fifth: "Gardens of the Fifth"
 nd_trg_gardens_of_the_fifth_desc: "No noble will touch a hoe. The date palms and wheat plots of Djanet, Ghat and the valleys of the massifs are worked by the #italic izeggaghen#!, cultivators who keep one part in five of what they grow and give the rest to the tribe that owns the water."
 nd_trg_day_of_toya: "The Day of Toya"
 nd_trg_day_of_toya_desc: "In 1737 the Tademekkat destroyed the army of the Pasha of Timbuktu at Toya. It was the end of the power the Moroccan musketeers had founded in 1591, and proof that a host of riders, well led, could beat a state with guns."
 nd_trg_three_drums_of_the_ahaggar: "Three Drums of the Ahaggar"
 nd_trg_three_drums_of_the_ahaggar_desc: "About 1750 the Kel Rela of the Hoggar chose an amenokal of their own, Salah, and were no longer answerable to the Ajjer. In the reigns that followed the drum was shared out: the Kel Rela, the Taitoq and the Tegehe Mellet each received an ettebel, with the Kel Rela chief as amenokal over all three. Each massif now has a chief close enough to be obeyed."
 nd_trg_ineslemen_in_arms: "Ineslemen in Arms"
 nd_trg_ineslemen_in_arms_desc: "The clerical tribes pay no tribute in blood. They teach, judge and pray, and by old custom they go unarmed. The preaching of Muhammad al-Jilani in the Azawagh ended that custom: for the first time the men of religion formed a host of their own."
 nd_trg_baraka_of_the_kunta: "Baraka of the Kunta"
 nd_trg_baraka_of_the_kunta_desc: "Sidi al-Mukhtar al-Kunti, shaykh of the Qadiriyya in the Azawad until his death in 1811, was neither Tuareg nor a warrior, and the amenokals of the Iwellemmedan and the Kel Ahaggar alike sent to him to settle their feuds. A peace sworn before the Kunta was a peace kept, for no chief cared to lose the blessing of that house."
 a_nd_trg_ettebel_riders: "Ettebel Riders"
 a_nd_trg_ettebel_riders_desc: "The tribesmen of a drum group, mounted on their own camels and armed with javelins, sword and shield. They are raised from Tuareg tribesmen only, and they answer faster and strike harder than any ordinary tribal levy."
 a_nd_trg_agher_shieldmen: "Agher Shieldmen"
 a_nd_trg_agher_shieldmen_desc: "Tuareg nobles fighting on foot behind tall shields of white oryx hide, with iron lances and the long sword. There are never many of them. Their shields turn blades and arrows, and their charge unnerves better armed men."
 a_nd_trg_kel_ulli_lancers: "Kel Ulli Lancers"
 a_nd_trg_kel_ulli_lancers_desc: "Men of the vassal tribes, given riding camels and iron lances and a place in the host beside their nobles. They are slower to the charge than the old drum riders and they hit harder when they arrive."
 a_nd_trg_salt_caravan_train: "Salt Caravan Train"
 a_nd_trg_salt_caravan_train_desc: "Pack camels and their drivers, the same who carry salt bars across the desert, following the army with grain, dates and water skins. They carry more than a cart column and cross sand that would stop one, and the animals must be fed."
 a_nd_trg_tademekkat_host: "Tademekkat Host"
 a_nd_trg_tademekkat_host_desc: "The massed camel riders of the river confederations, the host that broke the Pashalik of Timbuktu. They win by numbers and by coming from every side at once. They wear no armour against the guns they ride around."
 a_nd_trg_iwellemmedan_horsemen: "Iwellemmedan Horsemen"
 a_nd_trg_iwellemmedan_horsemen_desc: "Nobles of the Azawagh mounted on Sahel horses, lance in hand. On open grass and thorn scrub they turn a flank faster than any camel. They wear cloth, not iron, and a volley costs them dearly."
 a_nd_trg_ineslemen_mujahidin: "Ineslemen Mujahidin"
 a_nd_trg_ineslemen_mujahidin_desc: "Men of the clerical tribes who took up arms at the call of a reformer. They have little training and poor weapons, and they do not run."
 levy_nd_trg_ettebel_riders: "Ettebel Rider Levy"
 levy_nd_trg_ettebel_riders_desc: "Tuareg tribesmen summoned by the drum of their confederation, riding their own camels."
 levy_nd_trg_kel_ulli_lancers: "Kel Ulli Lancer Levy"
 levy_nd_trg_kel_ulli_lancers_desc: "Tuareg tribesmen of the vassal tribes, armed with iron lances and mounted on camels given by their nobles."
 levy_nd_trg_tademekkat_host: "Tademekkat Host Levy"
 levy_nd_trg_tademekkat_host_desc: "Tuareg tribesmen of the river confederations, raised in great numbers on camelback."
 levy_nd_trg_ineslemen_mujahidin: "Ineslemen Mujahidin Levy"
 levy_nd_trg_ineslemen_mujahidin_desc: "Tuareg clergy of the tribes of religion, armed for a holy war."
 nd_trg_drum_court: "Court of the Drum"
 nd_trg_drum_court_desc: "The amenokal's own camp, where the great drum is kept and is beaten only for war or for the choosing of a chief. Chiefs come here to be judged and to judge him, and here the host gathers before a war, so the tribes are asked for men at less cost. It stands in the capital, and there is only one."
 nd_trg_guarded_well: "Guarded Well"
 nd_trg_guarded_well_desc: "A deep well lined with stone and kept clear of sand by the tribe that owns it, with a few tents always pitched beside it. Travellers and armies who come this way find water, and someone who knows where the next well lies."
 nd_trg_copper_works: "Takedda Copper Works"
 nd_trg_copper_works_desc: "Furnaces beside a copper mine, where the ore is smelted and the metal cast into rods, bars and implements for the markets of the south. It can stand only where copper is dug."
 nd_trg_salt_cure_grounds: "Salt Cure Grounds"
 nd_trg_salt_cure_grounds_desc: "A plain of salt earth and briny pools where the herds are brought after the rains. Camels raised on the cure are sold to every caravan that passes, and a market that has camels can mount men on them."
 nd_trg_saddlery: "Tent Saddlery"
 nd_trg_saddlery_desc: "A camp workshop where hides are tanned with salt and acacia pods and cut into saddles, tent skins, water bags and caravan sacks. It is the craft of the Tuareg's own artisans and is found only where the Tuareg are the people of the land."
 nd_trg_scholar_camp: "Scholar Camp of the Kel Es-Suq"
 nd_trg_scholar_camp_desc: "A few tents of the people of the market: a teacher, his books in leather cases, and the boys sent to him to learn their letters and the law. It moves with the tribe it serves."
 nd_trg_ahal_tent: "Ahal Tent"
 nd_trg_ahal_tent_desc: "The tent where the young of the camp gather at evening for music and verse, with the imzad at its centre. Reputations are made and unmade here, and the songs travel further than the caravans."
 nd_trg_salt_quarry: "Salt Slab Quarry"
 nd_trg_salt_quarry_desc: "Open pits where rock salt is cut into slabs and stacked for the caravans. Everything the cutters eat has to be carried in. It can stand only where there is salt in the ground."
 nd_trg_drum_court_upkeep: "Hospitality of the Court"
 nd_trg_drum_court_upkeep_desc: "Meat, millet, leather and cloth for the amenokal's guests: no chief who comes to the drum may leave unfed or without a gift."
 nd_trg_well_upkeep: "Well Keeping"
 nd_trg_well_upkeep_desc: "Hide buckets, ropes, tools and stone to keep the shaft clear of sand and its lining whole."
 nd_trg_copper_rod_casting: "Copper Rod Casting"
 nd_trg_copper_rod_casting_desc: "Copper is smelted over charcoal and cast into rods and implements for sale to the south."
 nd_trg_camel_herding: "Camel Market of the Cure"
 nd_trg_camel_herding_desc: "The pack herds of the plain are brought to the salt earth after the rains, and the animals that come away strong are sold to the salt caravans at the gathering."
 nd_trg_herd_fattening: "Herd Fattening"
 nd_trg_herd_fattening_desc: "Goats, sheep and cattle take the salt cure in place of camels and are sold for meat, milk and hides."
 nd_trg_saddle_and_tent_leather: "Saddle and Tent Leather"
 nd_trg_saddle_and_tent_leather_desc: "Hides are cured with salt and worked into saddles, tent skins and water bags."
 nd_trg_dyed_leatherwork: "Dyed Leatherwork"
 nd_trg_dyed_leatherwork_desc: "Goatskin is dyed red, green and yellow and cut into the fringed bags and saddle covers that sell in every market of the Sudan and the Maghreb."
 nd_trg_scholar_camp_upkeep: "Books and Board"
 nd_trg_scholar_camp_upkeep_desc: "Paper, leather book cases and the animals a tribe gives its teachers for their keep."
 nd_trg_ahal_upkeep: "Evening Gathering"
 nd_trg_ahal_upkeep_desc: "Milk and meat for the guests, and leather and cloth for the tent."
 nd_trg_salt_slab_cutting: "Salt Slab Cutting"
 nd_trg_salt_slab_cutting_desc: "Cutters work the pit with iron tools and live on millet brought in by caravan."
 nd_trg_great_salt_caravan: "Great Salt Caravan"
 nd_trg_great_salt_caravan_desc: "The pit is worked for a caravan of thousands of camels that comes twice a year. Far more salt leaves the mine, and many camels do not survive the road."
 nd_trg_dest_tribesmen_120_tt: "At least #bold 120,000#! tribesmen live in our country"
 nd_trg_dest_tribesmen_170_tt: "At least #bold 170,000#! tribesmen live in our country. The tents of the #bold Kel Gress#! stand at Olléléwa, Guidimouni and Aderbissinat."
 nd_trg_dest_tribesmen_250_tt: "At least #bold 250,000#! tribesmen live in our country. The lands of the #bold Iwellemmedan#! are meant, in the Ader and south and west of it."
 nd_trg_dest_tadmekka_town_tt: "We own #bold Tadmekka#! and it has become a town or a city"
 nd_trg_dest_takedda_town_tt: "We own #bold Takedda#! and it has become a town or a city"
 nd_trg_dest_ghat_developed_tt: "We own #bold Ghat#! and its development is at least #bold 10#!"
 nd_trg_destiny: "One Drum for the Veiled People"
 nd_trg_destiny_desc: "The chiefs have set one drum above the others. What it is for was settled when the confederation was founded: either the tents stay free and the drum calls them to war, or the amenokal takes a seat among the oasis towns and the tribes are made to stay beside it. Neither road can be walked by a people at odds with itself.\n\nKeep our stability high and the first step of the chosen road lies open."
 nd_trg_dest_azawagh: "Pastures of the Azawagh"
 nd_trg_dest_azawagh_desc: "South of the Adagh and west of the Aïr lies the Azawagh, a plain of thorn and grass that takes the rain the desert never sees. Under their amenokal Karidenna the Iwellemmedan left the mountains for it, and with room for their herds they became the largest of all the confederations.\n\nBring Tahoua and Abalak under the drum and let the tents grow until 120,000 tribesmen live in our country. See also that camels are bred or sold in the market of our capital: a host that means to stay free must be able to mount itself."
 nd_trg_dest_river_bend: "The River Bend"
 nd_trg_dest_river_bend_desc: "Where the Niger turns south it runs for many days with desert on both banks. The towns along it were garrisons of the pashas of Timbuktu, Gao and Bamba among them, and around 1770 the Tuareg took Gao. The river has grain and flood pasture. The tribes have neither. South of the Aïr the Kel Gress still answer to a drum of their own.\n\nTake Gao and Bamba, by our own hand or through a vassal, bring the Kel Gress pastures of Olléléwa, Guidimouni and Aderbissinat under the drum, and let the tents grow until 170,000 tribesmen live in our country."
 nd_trg_dest_tribute_of_the_pashas: "Tribute of the Pashas"
 nd_trg_dest_tribute_of_the_pashas_desc: "Timbuktu lives on two things it does not own: the salt cut at Taoudenni and carried south past the wells of Araouane, and the boats that land at Kabara, its port on the river. In 1787 the Tuareg entered the city and made its pashas their tributaries, and they did not need to stay. Whoever holds the mine, the wells and the landing holds the city. The tents of the Iwellemmedan, the largest of the confederations, are not yet all under our drum.\n\nTake Taoudenni, Araouane and Kabara, bring the chief Iwellemmedan pastures of Birni Ader, Kalfou and Tondikandia under the drum, and win great prestige. Let the tents grow until 250,000 tribesmen live in our country: the tents meant are those of the rest of the Iwellemmedan, whose lands lie in the Ader and south and west of it. The #bold Camp Beyond the Walls#! may then be raised outside the towns of other peoples."
 nd_trg_dest_walls_of_tadmekka: "The Walls of Tadmekka"
 nd_trg_dest_walls_of_tadmekka_desc: "Tadmekka was a town before it was a camp. Merchants came to it from Ouargla and from Ghadames, gold was weighed and cast there, and the geographers wrote that no town in the world looked more like Mecca. A ruler who wants a seat can do no better than raise it again, and take under his own hand the merchants of Ghadames, who work the whole road from Tripoli to the Sudan and pay the tribes for every day of it.\n\nMake Tadmekka a town, take Ghadames, and lay by a treasury of 1,000 ducats."
 nd_trg_dest_fezzan_road: "The Fezzan Road"
 nd_trg_dest_fezzan_road_desc: "From Ghat the road to the sea runs through the Fezzan, and whoever sits at Murzuk decides what a caravan pays between the Sudan and Tripoli. At the other end of our country lies Takedda, where copper is cast into rods that pass as money in the south. A seat needs both: the junction in the north, and a second town in the south to answer to the first.\n\nTake Murzuk, make Takedda a town, and lay by a treasury of 2,000 ducats."
 nd_trg_dest_amenokal_of_the_oases: "Amenokal of the Oases"
 nd_trg_dest_amenokal_of_the_oases_desc: "The Kel Ahaggar have always gone north to In Salah to change their herds and the goods of the Sudan for dates and cloth, and Ghat, where the roads of Tripoli, the Aïr and the Sudan meet, grows with every fair. A ruler who holds both, and whose tribes now work the gardens where they once rode to the drum, cannot count on the old host. He must keep men who are paid.\n\nTake In Salah, bring Ghat to a development of 10, embrace #bold Professional Armies#! and lay by a treasury of 3,000 ducats. The #bold House of the Amghar#! may then be built in our own towns."
 nd_trg.7.t: "The Circle of the Chiefs"
 nd_trg.7.d: "The drum above the drums has been beaten for the first time, and they came: the Kel Ahaggar down from the Hoggar, the Kel Ajjer from Ghat and Djanet, the Kel Adagh from the valleys of the Ifoghas, the tribes of the Aïr and of the Azawagh. No one alive has seen all of them camped on one plain.\n\nThey did not come to be ruled. Each chief sat down in the circle with his own quarrels and his own count of what the others owe him, and each will ride home when the meat runs out. What has been founded is a promise that the next time the great drum sounds they will come again.\n\nThe road chosen at the founding will decide what that promise is worth."
 nd_trg.7.a: "Let the drum be heard from the Hoggar to the river."
 nd_trg.7.a_tt: "The first step of the road chosen at the founding lies open."
 nd_trg.8.t: "The Tents Come Down to the Azawagh"
 nd_trg.8.d: "The mountains of the Adagh and the Aïr have water in their valleys and little else. Between them and the river lies the Azawagh, flat to the horizon, where a summer of good rain puts grass under every thorn tree. When the Iwellemmedan moved into it under Karidenna, they found that a family there could keep many times the animals it had kept among the rocks.\n\nThe pastures around Tahoua and Abalak are ours now, and the herds have followed. So have the people. Tents that held one household hold two, young men have camels of their own before their beards have grown, and when the drum is beaten more riders answer it than the old chiefs thought the whole nation could mount.\n\nNothing has been built here and nothing will be. That is the point of it."
 nd_trg.8.a: "There is grass here for every herd we own."
 nd_trg.8.a_tt: "Nothing is granted beyond what the advance itself gives."
 nd_trg.9.t: "The River Bend"
 nd_trg.9.d: "Around 1770 the Iwellemmedan took Gao, once the seat of the Songhai kings and after them a garrison town of the pashas of Timbuktu. Bamba, another of the pashas' forts, lay upstream of it. With the two towns went the long reach of the Niger where it runs through the desert.\n\nThe villages of the bend grow rice and millet on the flooded banks. And each year, when the flood draws back, the same banks stand deep in #italic bourgou#!, the river grass that will fatten any animal driven into it. The chiefs cannot have both in full. One party wants the villagers left to their fields, and a fixed share of every harvest carried up to the camps. The other wants the banks for the herds, and says that a rider is worth what his mount is worth.\n\nThe Kel Gress have brought their tents under the drum, and that reach of the river is ours now. The council must decide what it is for."
 nd_trg.9.a: "Leave the villages their fields. They will feed the host."
 nd_trg.9.a_tt: "For fifteen years our lands can feed larger armies and the army costs less to keep. Conquered land is integrated more slowly."
 nd_trg.9.b: "Bring the herds down to the flood pastures."
 nd_trg.9.b_tt: "For fifteen years herds yield more, light cavalry fights better and armies move faster."
 nd_trg.10.t: "The Pasha Asks for Terms"
 nd_trg.10.d: "In 1787 the Tuareg entered Timbuktu and made its pashas their tributaries. They had no need to stay. The city lived on salt cut at Taoudenni and carried south past the wells of Araouane, and on the boats that unloaded at Kabara, its landing on the river, and whoever held those held the city. The heirs of the army that had crossed the desert with guns kept their office from then on at the pleasure of the tribes.\n\nThe mine, the wells and the landing are in our hands now, the Iwellemmedan ride under our drum, and the master of Timbuktu has sent to ask our terms. His messengers were kept waiting three days outside the amenokal's tent.\n\nSome of the chiefs would grant what he asks: his title, his judges and his gates, for a tribute paid every year without fail. Others say that a host which stops to count tribute has stopped being a host, and that there are richer towns beyond this one."
 nd_trg.10.a: "Let the pasha keep his carpet, and pay for it every year."
 nd_trg.10.a_tt: "For twenty years we can keep more subjects and allies, separatism falls and our deeds anger our neighbours less."
 nd_trg.10.b: "No terms. The drum does not rest."
 nd_trg.10.b_tt: "For twenty years causes for war are found faster and our tactics improve. Stability costs more to restore."
 nd_trg.11.t: "Tadmekka Rebuilt"
 nd_trg.11.d: "Tadmekka had been shrinking for generations. Its merchants had gone to Gao and Timbuktu, its mosques were losing their roofs, and the people of the Adagh pitched their tents among houses that nobody repaired. In the graveyards the goats grazed between stones cut with the names of men dead for centuries.\n\nThe walls are standing again. The amenokal holds his court inside them in a house of stone, there is a market every week, and herders who came in from the valleys to see it have stayed to work the gardens below the town. From the north the merchants of Ghadames, who now answer to us, are sending their agents to take houses in it.\n\nThe old men say it is no life for a Tuareg, and they come to the market all the same."
 nd_trg.11.a: "It was a market once. It is ours this time."
 nd_trg.11.a_tt: "Nothing is granted beyond what the advance itself gives."
 nd_trg.12.t: "The Junction at Murzuk"
 nd_trg.12.d: "The roads from the central Sudan to the sea pass through the Fezzan, and most of them through Murzuk. With that town in our hands, and Takedda grown into a town on the southern road, a load of cloth can travel from the coast to the copper country and never leave our protection.\n\nWhat that protection should cost is now disputed. The treasurer wants every load counted at the gate and charged for what it is. The merchants themselves have sent a deputation, led by men of Ghadames, and with them Ibadis of Ouargla and the Mzab whose forebears traded at Tadmekka when it was first a town. They offer one fixed due, paid each year by every trading house, and ask that the road be left open to all who pay it.\n\nThe first will fill the treasury sooner. The second will fill the road."
 nd_trg.12.a: "Every load is counted, and every load pays."
 nd_trg.12.a_tt: "For fifteen years trade pays more and the court costs less. Relations with others improve more slowly."
 nd_trg.12.b: "One fixed due, and the road stays open."
 nd_trg.12.b_tt: "For fifteen years our trade reaches farther over land, merchants cost less and heretics are tolerated."
 nd_trg.13.t: "A Seat That Outlasts Its Builder"
 nd_trg.13.d: "In Salah answers to us, and with it the market where the mountain tribes have always bought their dates. Ghat has outgrown its old wall. Wherever there is a town of ours there may now be a house for the chief the amenokal sets over it.\n\nThe old order has paid for this. The tribes that settled send gardeners to the fields and few riders to the drum, and the nobles who kept their camels say openly that the amenokal has made himself a townsman. He can no longer hold what he has built with men who come when they please.\n\nTwo things would bind the seat to something more lasting than one chief's name. A guard that is paid, and so obeys whoever pays it. Or the pens of the Kel Es-Suq, who would set down every toll, judgment and promise, so that a new chief inherits the whole of it written."
 nd_trg.13.a: "Pay a guard. The seat cannot wait on the drum."
 nd_trg.13.a_tt: "For twenty years garrisons are larger and mercenaries cost less to keep. Fewer men answer the levy."
 nd_trg.13.b: "Give the Kel Es-Suq the books and the seal."
 nd_trg.13.b_tt: "For twenty years the cabinet works better, laws pass faster and literacy spreads."
 STATIC_MODIFIER_NAME_nd_trg_dest_grain_of_the_river: "Grain of the River"
 STATIC_MODIFIER_DESC_nd_trg_dest_grain_of_the_river: "The villages of the bend keep their fields and send a fixed share of every harvest up to the camps. The host eats well and costs little. The villages remain another people's country."
 STATIC_MODIFIER_NAME_nd_trg_dest_herds_on_the_bourgou: "Herds on the Bourgou"
 STATIC_MODIFIER_DESC_nd_trg_dest_herds_on_the_bourgou: "When the flood draws back the herds are driven down to the river grass. The animals fatten, the riders are well mounted, and the host moves with its pasture."
 STATIC_MODIFIER_NAME_nd_trg_dest_pasha_on_his_carpet: "The Pasha on His Carpet"
 STATIC_MODIFIER_DESC_nd_trg_dest_pasha_on_his_carpet: "The masters of the city keep their title, their judges and their gates, and pay for all three. A city that still has a master of its own has less to say against ours, and so have its neighbours."
 STATIC_MODIFIER_NAME_nd_trg_dest_drum_does_not_rest: "The Drum Does Not Rest"
 STATIC_MODIFIER_DESC_nd_trg_dest_drum_does_not_rest: "No terms were given. The host stays in the saddle and looks for its next quarrel, and the amenokal finds that tribes kept at war are hard to keep in order."
 STATIC_MODIFIER_NAME_nd_trg_dest_tolls_at_the_gates: "Tolls at the Gates"
 STATIC_MODIFIER_DESC_nd_trg_dest_tolls_at_the_gates: "Every load that enters our towns is counted and pays. The court lives well on it. The cities whose merchants pay have begun to speak of us as they speak of robbers."
 STATIC_MODIFIER_NAME_nd_trg_dest_free_passage: "The Open Road"
 STATIC_MODIFIER_DESC_nd_trg_dest_free_passage: "A trading house pays one fixed due for the year and travels as it pleases. More merchants come, from farther off, among them the Ibadis of Ouargla and the Mzab, whose prayers differ from ours and whose credit is good."
 STATIC_MODIFIER_NAME_nd_trg_dest_guard_paid_in_coin: "A Guard Paid in Coin"
 STATIC_MODIFIER_DESC_nd_trg_dest_guard_paid_in_coin: "The amenokal's towns are held by men who draw wages and answer to him alone. The walls are better kept. Fewer riders come when the drum is beaten, for nobody has asked them in years."
 STATIC_MODIFIER_NAME_nd_trg_dest_judges_of_the_market: "Judges of the Market"
 STATIC_MODIFIER_DESC_nd_trg_dest_judges_of_the_market: "Scholars of the Kel Es-Suq keep the amenokal's accounts, write his letters and judge in his name. What is decided is written down, and the next chief can read what the last one promised."
 nd_trg_dest_camp_beyond_the_walls: "Camp Beyond the Walls"
 nd_trg_dest_camp_beyond_the_walls_desc: "The amenokal's tents, pitched within sight of a town that belongs to another people. The town keeps its governor, its judges and its markets, and it answers to the camp. It can be raised only at towns and cities where the Tuareg are not the people of the place, and it needs tribesmen living there to man it."
 nd_trg_dest_camp_upkeep: "Keep of the Camp"
 nd_trg_dest_camp_upkeep_desc: "Meat, cloth, leather and arms for the riders who watch the town."
 nd_trg_dest_amghars_house: "House of the Amghar"
 nd_trg_dest_amghars_house_desc: "An #italic amghar#! is a chief. This is the house of the one the amenokal sets over an oasis town, to count its tolls, judge its quarrels and settle the herders who come in from the desert. It can be built only in our own Tuareg towns and cities, and it is staffed by people who have settled."
 nd_trg_dest_amghars_house_upkeep: "Household of the Amghar"
 nd_trg_dest_amghars_house_upkeep_desc: "Paper, cloth and tools for the chief's household, and animals for his table."

 # ===== BUREAUCRACIES =====
 trg_imgharen_assembly_bureaucracy: "Assembly of the Imgharen"
 trg_imgharen_assembly_bureaucracy_desc: "The drum is given, and it can be taken back. An amenokal is chosen by an assembly of all the men of the noble tribes together with the #italic imgharen#!, the chiefs each vassal tribe elects for itself, and the same assembly can depose him. When Ahitaghel of the Kel Ahaggar died in 1900 the circle could not agree, the men of religion called in to arbitrate could do no better than name both candidates, and for some years the Hoggar had two amenokals. A chief who keeps the assembly fed and heard acts with its weight behind him. One who lets it meet without him may learn that it has named another."
 trg_temazlayt_bureaucracy: "Temazlayt"
 trg_temazlayt_bureaucracy_desc: "Within a drum group a vassal lineage may ask one noble house for #italic temazlayt#!, protection against being plundered by the other nobles. The herders burn their protector's brand on their animals and keep him in milk animals and meat, and he must ride after any raider who drives off their stock. The contract is inherited in the mother's line on both sides, and it took its settled form in the Ahaggar of the seventeenth and eighteenth centuries. The tribes of religion would have none of it and held no tributaries. Where it is kept the riders are fed from their clients' herds and no noble preys on another's people. Where it is neglected the protectors turn plunderers, and the older the contract the worse the betrayal."
 trg_akh_huderan_bureaucracy: "Akh Huderan"
 trg_akh_huderan_bureaucracy_desc: "Among the Tuareg the child follows the blood of its mother. The drum goes to a son of the chief's eldest sister, and the Kel Ajjer say that an amenokal is a man whose mother was a #italic tamenokalt#!. Herds follow the same road: the #italic akh huderan#!, the living milk, is set aside for sisters, daughters and nieces, out of reach of the Koranic rule that gives a son twice a daughter's share. The men of religion have never approved. Where the custom is upheld every tent keeps its milk herd and few can lay claim to the drum. Where it lapses the judges of the book divide the animals, and the mothers' lineages do not forgive it."
 trg_inadan_go_betweens_bureaucracy: "Go-Betweens of the Inadan"
 trg_inadan_go_betweens_bureaucracy_desc: "The #italic inadan#!, the smiths, are born to their craft and stand outside the nobles' contest for honor, and that is their use. A noble cannot carry an offer of peace to a rival without loss of face. A smith can. Smiths bear messages between the drum groups, arbitrate in the assembly, negotiate alliances and marriages, and keep the praises and the genealogy of the house they serve. Nothing is said in a camp that its smith does not hear. A chief who is generous to them is well spoken of in every tent, and one who is mean to them soon hears the verses made about him."
 nd_trg_bur_tribesmen_50_tt: "At least #bold 50,000#! tribesmen live in our country"
 AUTO_MODIFIER_NAME_nd_trg_bureaucracy_authority: "Customs of the Drum"
 AUTO_MODIFIER_DESC_nd_trg_bureaucracy_authority: "With one drum set above the others, the customs the drum groups kept among themselves can be upheld by the confederation as a whole. One more institution may be kept at a time."
