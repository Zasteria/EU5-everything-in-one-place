l_french:
 LBE: "Luba"
 LBE_ADJ: "Louba"
 LBE_f: "Empire Louba"
 LBE_f_desc: "L'Empire Luba était un puissant État d'Afrique centrale centré sur la dépression de l'Upemba et le cours supérieur du fleuve Lualaba. Réputé pour son système Balopwe de royauté divine, un modèle de gouvernance si efficace que les peuples voisins de la savane l'ont adopté, l'État Luba a uni diverses communautés par le biais de l'autorité sacrée, du commerce du cuivre et du mécénat artistique."
