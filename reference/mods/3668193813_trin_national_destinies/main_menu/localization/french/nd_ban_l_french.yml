l_french:
 STATIC_MODIFIER_NAME_nd_pepper_emporium: "Magasin de poivre de l'Est"
 STATIC_MODIFIER_DESC_nd_pepper_emporium: "Les entrepôts de Banten regorgent du meilleur poivre de l'archipel. Les marchands de Chine, d’Inde, de Perse et d’Europe se bousculent pour accéder à nos marchés, et le détroit de la Sonde achemine leurs richesses via nos ports."
 STATIC_MODIFIER_NAME_nd_sunda_strait_guardians: "Gardiens du détroit de la Sonde"
 STATIC_MODIFIER_DESC_nd_sunda_strait_guardians: "Le détroit de la Sonde est la porte entre deux océans et Banten en détient la clé. Nos flottes de patrouille contrôlent ces eaux, veillant à ce qu'aucun navire ne passe à notre insu et sans notre consentement."
 STATIC_MODIFIER_NAME_nd_ban_golden_age_tirtayasa: "L'âge d'or de Tirtayasa"
 STATIC_MODIFIER_DESC_nd_ban_golden_age_tirtayasa: "Sous le sultan Ageng Tirtayasa, Banten atteint l'apogée de sa puissance. Le mépris du sultan envers les monopoles étrangers et sa vision d'un État maritime indépendant inspirent toute une génération de guerriers et d'hommes d'État."
 STATIC_MODIFIER_NAME_nd_ban_pepper_diplomacy: "Diplomatie du poivre"
 STATIC_MODIFIER_DESC_nd_ban_pepper_diplomacy: "Banten utilise son poivre comme une arme diplomatique, cultivant des relations commerciales à travers le monde connu. Là où d’autres comptent sur les armées, le sultan envoie des navires chargés d’or noir."
 nd_ban.1.t: "Le Sultanat de Banten"
 nd_ban.1.d: "The banner of Islam flies over the ports of western Java. Where the Hindu Kingdom of Sunda once traded pepper with the Portuguese, the Sultanate of Banten now commands the Sunda Strait: that narrow passage between Java and Sumatra through which all trade between the Indian Ocean and the Java Sea must flow.\n\nOur warehouses groan with pepper from Lampung, our harbor teems with Chinese junks and Indian dhows, and the call to prayer echoes from the minarets of the Masjid Agung. The question before us is how to wield this inheritance. Shall we become the greatest trading emporium of the eastern seas, drawing all merchants to our shores? Or shall we build a fleet to patrol our waters, ensuring that the strait remains our domain and our destiny?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ban.1.a: "Laissez couler le poivre : faites de Banten le marché du monde."
 nd_ban.1.b: "Le détroit est à nous : nul ne le passera sans notre permission."
 nd_ban.2.t: "Le défi du sultan Ageng"
 nd_ban.2.d: "Sultan Ageng Tirtayasa ascends to the throne of Banten at a time when the Dutch East India Company tightens its grip on the archipelago. Where other rulers bend to the VOC's demands for exclusive trading rights, Ageng refuses. He builds a fleet on European models, opens Banten's ports to English, Danish, and Chinese merchants, and dispatches traders to Persia, India, Siam, and Japan.\n\nIn 1656, the fragile peace shatters. Bantenese forces raid Batavian districts, ambush Dutch patrols, and kill their commanders. The VOC blockades the port, but Ageng fights on. His reign marks the golden age of Banten: a sultanate that dared to defy a European monopoly and, for a time, prevailed.\n\nBut Ageng's defiance comes at a price. The court divides between those who would resist and those who seek accommodation with the Dutch. How shall we honor his legacy?"
 nd_ban.2.a: "Défiez les monopoles : Banten ne s’inclinera jamais."
 nd_ban.2.b: "Commercez avec toutes les nations. Que le poivre soit notre bouclier."
 nd_ban.3.t: "La mosquée Agung de Banten"
 nd_ban.3.d: "The Great Mosque of Banten rises above the port city, its five-tiered roof a fusion of Javanese, Chinese, and Islamic architectural traditions. Built by Sultan Maulana Hasanuddin, the mosque's stepped roofline echoes both the sacred mountains of Hindu Java and the pagodas of Chinese trading partners, while its four saka guru pillars anchor the prayer hall in the geometric precision of Islamic design.\n\nThe Masjid Agung becomes more than a place of worship: it is the spiritual heart of the sultanate, where the ulama advise the sultan, where treaties are blessed, and where the faithful gather on Fridays to pray for the prosperity of the pepper trade. Later, the Dutch convert Hendrik Lucaasz Cardeel will design the tiyamah addition, a two-story Dutch-style building that stands as testament to Banten's cosmopolitan character."
 nd_ban.3.a: "Un monument à la foi et au commerce."
 nd_ban.4.t: "Les jardins de poivre de Lampung"
 nd_ban.4.d: "Across the Sunda Strait on the southern tip of Sumatra, the province of Lampung becomes the engine of Banten's wealth. By sultanic decree, every subject over sixteen years of age must plant and maintain five hundred pepper stems. The vine-covered hillsides of Tulang Bawang, Seputih, and Sekampung become the largest pepper-producing region in the archipelago.\n\nChinese intermediaries collect the harvest and funnel it to Banten's warehouses, where it enters the global market. The black peppercorns of Lampung, prized for their pungency and quality, command premium prices from Lisbon to Canton. This systematic cultivation transforms Banten from a trading port into a production powerhouse."
 nd_ban.4.a: "Cinq cents tiges par sujet : la volonté du Sultan sera faite."
 nd_ban_sunda_pepper_heritage: "Héritage du poivre sunda"
 nd_ban_sunda_pepper_heritage_desc: "L’ancien royaume de la Sonde cultivait le poivre dans l’ouest de Java pendant des siècles avant l’avènement de l’Islam. Banten hérite de ces réseaux commerciaux et techniques de culture établis."
 nd_ban_islamic_conversion: "Islamisation de Banten"
 nd_ban_islamic_conversion_desc: "Sous la direction de Sunan Gunung Jati et du sultanat de Demak, le port hindou de Sunda se transforme en sultanat islamique de Banten, apportant une nouvelle unité religieuse et des liens avec le monde commercial musulman au sens large."
 nd_ban_strait_raiders: "Pillards du détroit"
 nd_ban_strait_raiders_desc: "Les marins bantenais à bord de leurs jongs navires de commerce patrouillent dans le détroit de la Sonde, contrôlant le passage entre l'océan Indien et la mer de Java."
 nd_ban_port_foundations: "Fondations de la ville portuaire"
 nd_ban_port_foundations_desc: "L'établissement de Banten en tant que port majeur doté d'une infrastructure d'entrepôt permanente pour le stockage et le commerce du poivre."
 nd_ban_debus_tradition: "Tradition martiale de Debus"
 nd_ban_debus_tradition_desc: "Les pratiquants Debus de Banten combinent le mysticisme soufi avec les arts martiaux, accomplissant des exploits qui démontrent leur invulnérabilité spirituelle. Ces guerriers servent de troupes de choc dont la ferveur au combat perturbe leurs ennemis."
 nd_ban_coastal_subsistence: "Subsistance côtière"
 nd_ban_coastal_subsistence_desc: "Les villages côtiers de l'ouest de Java subviennent à leurs besoins grâce à la culture du riz et à la pêche, fournissant ainsi la base alimentaire nécessaire à la population urbaine de Banten."
 nd_ban_surosowan_tradition: "Tradition du palais Surosowan"
 nd_ban_surosowan_tradition_desc: "La construction du complexe du palais Surosowan, couvrant plus de trente mille mètres carrés avec des bassins de baignade, des fontaines en pavillon et un impressionnant système d'aqueduc, établit la grandeur architecturale de la cour bantenaise."
 nd_ban_sultanate_founding: "Fondation du sultanat"
 nd_ban_sultanate_founding_desc: "Maulana Hasanuddin établit le sultanat de Banten en 1527, combinant conquête militaire et propagation de l'islam pour créer un nouveau régime islamique sur les ruines du royaume hindou de la Sonde."
 nd_ban_chinese_quarter: "Quartier Pécinan"
 nd_ban_chinese_quarter_desc: "Les marchands chinois établissent un quartier permanent à Banten, servant d'intermédiaires cruciaux pour collecter le poivre auprès des producteurs de Lampung et le vendre sur les marchés étrangers."
 nd_ban_masjid_agung: "Mosquée Agung"
 nd_ban_masjid_agung_desc: "La Grande Mosquée de Banten, avec son toit distinctif à cinq niveaux mêlant les traditions architecturales javanaise, chinoise et islamique, devient le centre spirituel du sultanat."
 nd_ban_pepper_entrepot: "Entrepot de Poivre"
 nd_ban_pepper_entrepot_desc: "Banten's markets develop sophisticated systems for processing, sorting, and grading pepper for export, adding value to the raw product from Lampung's gardens."
 nd_ban_european_contacts: "Contacts européens"
 nd_ban_european_contacts_desc: "L'arrivée de commerçants portugais, néerlandais, anglais et danois ouvre de nouveaux marchés pour le poivre de Banten et introduit le sultanat dans la diplomatie et la technologie européennes."
 nd_ban_patrol_fleet: "Flotte de patrouille du détroit"
 nd_ban_patrol_fleet_desc: "Des navires légers spécialement conçus patrouillent dans le détroit de la Sonde, assurant le contrôle de Banten sur ce point d'étranglement vital et interceptant les contrebandiers et les rivaux."
 nd_ban_lampung_plantations: "Plantation de Lampung"
 nd_ban_lampung_plantations_desc: "The systematic organization of pepper cultivation in Lampung, requiring every subject to plant five hundred pepper stems, transforms the province into the largest pepper producer in the archipelago."
 nd_ban_strait_tolls: "Péages du détroit de la Sonde"
 nd_ban_strait_tolls_desc: "Banten établit une perception formelle de péages sur les navires traversant le détroit de la Sonde, convertissant ainsi son avantage géographique en un flux constant de revenus."
 nd_ban_cosmopolitan_port: "Port cosmopolite"
 nd_ban_cosmopolitan_port_desc: "Le port de Banten accueille des marchands de toute l'Asie et de l'Europe : musulmans, hindous, bouddhistes et chrétiens font du commerce côte à côte sur les marchés du sultanat, protégés par la tolérance du sultan."
 nd_ban_naval_expansion: "Expansion navale"
 nd_ban_naval_expansion_desc: "La construction des praus de guerre, des galères de combat plus lourdes conçues pour la guerre navale plutôt que pour le commerce, marque la transition de Banten d'un port de commerce à une puissance maritime."
 nd_ban_manuscript_tradition: "Tradition manuscrite"
 nd_ban_manuscript_tradition_desc: "Bantenese scholars produce manuscripts on Islamic law, Sundanese literature, and maritime navigation, creating a literary tradition that preserves the sultanate's knowledge for future generations. Many are written on daluang, the beaten bark paper of western Java."
 nd_ban_pepper_diplomacy_advance: "Diplomatie du poivre"
 nd_ban_pepper_diplomacy_advance_desc: "Banten tire parti de sa position de premier fournisseur mondial de poivre pour forger des relations diplomatiques à travers le monde, offrant des conditions commerciales favorables en échange d'un soutien politique."
 nd_ban_port_fortification: "Fortification portuaire"
 nd_ban_port_fortification_desc: "Des bastions de pierre et des batteries côtières défendent le port de Banten contre les attaques navales, protégeant ainsi la bouée de sauvetage commerciale du sultanat."
 nd_ban_ageng_tirtayasa: "Sultan Ageng Tirtayasa"
 nd_ban_ageng_tirtayasa_desc: "Sultan Ageng Tirtayasa leads Banten through its golden age, building a European-style fleet, expanding trade to Persia and Japan, and defying the Dutch East India Company's bid for monopoly. Canals are dug across the coastal plain at his order, and new rice land is opened along them."
 nd_ban_fleet_modernization: "Modernisation de la flotte"
 nd_ban_fleet_modernization_desc: "Sous le sultan Ageng, Banten construit des galères sur le modèle des modèles européens, incorporant un armement plus lourd et des techniques de construction plus durables apprises des alliés anglais et danois."
 nd_ban_anti_monopoly: "Résistance anti-monopole"
 nd_ban_anti_monopoly_desc: "Banten's policy of trading with all nations (English, Danish, Chinese, Persian) directly challenges the VOC's ambition to monopolize the spice trade in the archipelago. Guns are bought from the English and the Danes, and more are cast in the smiths' quarter of the city."
 nd_ban_kaibon_court: "Culture de la cour de Kaibon"
 nd_ban_kaibon_court_desc: "Le palais Kaibon, résidence de la reine mère, devient un centre de culture de cour raffinée où les traditions artistiques sundanaises se mêlent aux influences islamiques et cosmopolites."
 nd_ban_debus_elite: "Garde Debus d'élite"
 nd_ban_debus_elite_desc: "La garde personnelle du sultan composée de maîtres Debus, dont les démonstrations d'invulnérabilité spirituelle et d'habileté martiale les font craindre sur le champ de bataille et vénérés à la cour."
 nd_ban_international_network: "Réseau de commerce international"
 nd_ban_international_network_desc: "Les marchands de Banten commercent avec la Perse, l'Inde, le Siam, le Vietnam, la Chine, les Philippines et le Japon, créant ainsi un réseau commercial qui s'étend sur tout l'océan Indien et la ceinture du Pacifique."
 nd_ban_pepper_refinement: "Raffinage du poivre"
 nd_ban_pepper_refinement_desc: "Advanced techniques for sorting, grading, and packaging pepper ensure that Banten's exports command the highest prices in world markets."
 nd_ban_centralized_sultanate: "Sultanat centralisé"
 nd_ban_centralized_sultanate_desc: "La consolidation de l'autorité sultanique sur les provinces, les tribunaux et les marchés de Banten, créant un appareil administratif efficace pour gérer le commerce du poivre et les forces navales."
 nd_ban_coastal_defense: "Réseau de défense côtière"
 nd_ban_coastal_defense_desc: "Un système complet de batteries, de tours de guet et de patrouilles navales protège le littoral de Banten et le détroit de la Sonde des agressions étrangères."
 nd_ban_maritime_projection: "Projection maritime"
 nd_ban_maritime_projection_desc: "La flotte de Banten étend sa portée au-delà du détroit de la Sonde, projetant sa puissance maritime à travers la mer de Java et dans l'océan Indien."
 nd_ban_pepper_monopoly: "Monopole du poivre"
 nd_ban_pepper_monopoly_desc: "Grâce au contrôle de la production à Lampung et à la distribution via les entrepôts de Banten, le sultanat consolide un quasi-monopole sur le meilleur poivre d'Asie du Sud-Est."
 nd_ban_islamic_scholarship: "Bourse islamique"
 nd_ban_islamic_scholarship_desc: "Les écoles pesantren et les bibliothèques des mosquées de Banten deviennent des centres d'apprentissage islamique, attirant des érudits du monde malais et produisant des commentaires sur le droit, la théologie et le mysticisme."
 nd_ban_modern_patrol_fleet: "Flotte de patrouille moderne"
 nd_ban_modern_patrol_fleet_desc: "Des frégates rapides remplacent la flotte vieillissante des Prau, donnant à la marine de Banten la vitesse et la puissance de feu nécessaires pour patrouiller dans le détroit de la Sonde contre les menaces modernes."
 nd_ban_governance_reform: "Réforme de la gouvernance"
 nd_ban_governance_reform_desc: "Les réformes administratives modernisent la bureaucratie du sultanat, en introduisant une tenue systématique des registres, une fiscalité codifiée et des fonctionnaires professionnels."
 nd_ban_industrial_pepper: "Transformation industrielle du poivre"
 nd_ban_industrial_pepper_desc: "Mechanized processing facilities transform Banten's pepper industry, increasing output quality and consistency while reducing labor requirements."
 nd_ban_modern_port: "Infrastructure portuaire moderne"
 nd_ban_modern_port_desc: "Des quais, des grues et des entrepôts modernes remplacent le front de mer traditionnel, permettant à Banten de gérer les plus gros navires et les plus gros volumes de l'ère industrielle."
 nd_ban_national_awakening: "Réveil national"
 nd_ban_national_awakening_desc: "Une renaissance de l'identité culturelle sundanaise s'exprime dans la littérature, les arts et la pensée politique, alors que les habitants de Banten définissent leur place dans un monde en évolution."
 nd_ban_modern_navy: "Marine moderne"
 nd_ban_modern_navy_desc: "Les corvettes à vapeur et la doctrine navale moderne donnent à Banten la capacité de défendre ses eaux contre les grandes puissances de l'ère industrielle."
 nd_ban_sundanese_heritage: "Patrimoine sundanais"
 nd_ban_sundanese_heritage_desc: "La préservation et la célébration de la langue, des coutumes et de l’identité sundanaises, garantissant que les traditions culturelles de l’ouest de Java perdurent malgré les bouleversements de l’ère moderne."
 n_nd_ban_jong: "Jong"
 n_nd_ban_jong_desc: "Le jong est un navire commercial traditionnel sundanais adapté à la guerre. Rapides et manœuvrables dans les eaux étroites du détroit de la Sonde, ces navires constituent l'épine dorsale des premières forces navales de Banten."
 a_nd_ban_debus_warriors: "Guerriers Debus"
 a_nd_ban_debus_warriors_desc: "Pratiquants de l'art martial mystique Debus, ces guerriers démontrent leur pouvoir spirituel à travers des exploits d'une apparente invulnérabilité avant de se lancer dans la bataille avec un moral redoutable."
 a_nd_ban_debus_elite: "Garde Debus du sultan"
 a_nd_ban_debus_elite_desc: "Garde personnelle d'élite du sultan, ces maîtres praticiens Debus combinent discipline spirituelle et formation militaire professionnelle pour servir d'infanterie de choc."
 n_nd_ban_strait_patrol: "Navire de patrouille du détroit"
 n_nd_ban_strait_patrol_desc: "Navires légers spécialement conçus pour la vitesse et l'interception dans le détroit de la Sonde. Leur faible tirant d'eau et leurs voiles latines leur permettent de traquer les contrebandiers et les pirates dans les eaux étroites de l'archipel."
 n_nd_ban_war_prau: "Guerre Prau"
 n_nd_ban_war_prau_desc: "Galère plus lourde construite pour le combat naval, le prau de guerre transporte plus de canons et un équipage plus important que les navires de commerce, conçu pour renforcer le contrôle de Banten sur le détroit de la Sonde par la force des armes."
 n_nd_ban_modern_galley: "Cuisine bantenaise"
 n_nd_ban_modern_galley_desc: "Construites sur des modèles européens avec l'aide de constructeurs navals anglais et danois, ces galères modernisées combinent le matelotage local avec l'architecture navale occidentale, donnant à la flotte du sultan Ageng la puissance de feu nécessaire pour défier le VOC."
 n_nd_ban_frigate_patrol: "Frégate du détroit"
 n_nd_ban_frigate_patrol_desc: "Une frégate de patrouille rapide optimisée pour les opérations d'interdiction et de blocus dans le détroit de la Sonde. Plus rapides que les navires de guerre standards, ces navires peuvent renverser les navires marchands et devancer les navires de ligne les plus lourds."
 n_nd_ban_modern_corvette: "Corvette bantenaise"
 n_nd_ban_modern_corvette_desc: "Un navire de guerre moderne et agile construit pour la défense côtière et la patrouille du détroit. La corvette sacrifie un armement lourd au profit de la vitesse et de la maniabilité, parfaites pour les eaux confinées entre Java et Sumatra."
 nd_ban_pepper_gudang: "Poivre Gudang"
 nd_ban_pepper_gudang_desc: "Un complexe d'entrepôts pour le stockage, le tri et le commerce du poivre. Le gudang est le cœur commercial du port de Banten, où les grains de poivre noir de Lampung sont préparés pour être exportés vers le monde."
 nd_ban_surosowan_palace: "Palais Surosowan"
 nd_ban_surosowan_palace_desc: "Le magnifique complexe palatial des sultans de Banten, comprenant des bassins de baignade, des fontaines en pavillon, un système d'aqueduc et des salles d'audience où le sultan reçoit les ambassadeurs étrangers."
 nd_ban_pecinan_quarter: "Quartier Pécinan"
 nd_ban_pecinan_quarter_desc: "Le quartier commerçant chinois de Banten, où les commerçants du Fujian et du Guangdong possèdent des résidences permanentes et des entrepôts, servant d'intermédiaires essentiels dans le commerce du poivre."
 nd_ban_grand_mosque: "Mosquée Agung"
 nd_ban_grand_mosque_desc: "La Grande Mosquée de Banten, avec son toit distinctif à cinq niveaux symbolisant les cinq piliers de l'Islam, constitue le centre spirituel du sultanat et un chef-d'œuvre de l'architecture javanaise-islamique."
 nd_ban_strait_tollhouse: "Péage du détroit"
 nd_ban_strait_tollhouse_desc: "Un avant-poste administratif où les fonctionnaires de Banten perçoivent les péages des navires transitant par le détroit de la Sonde, convertissant ainsi leur avantage géographique en revenus."
 nd_ban_coastal_bastion: "Bastion côtier"
 nd_ban_coastal_bastion_desc: "Fortifications en pierre protégeant le port de Banten, conçues pour repousser les attaques navales et sécuriser la bouée de sauvetage commerciale du sultanat."
 nd_ban_coastal_battery: "Batterie côtière"
 nd_ban_coastal_battery_desc: "Un emplacement d'artillerie moderne défendant le littoral avec des canons lourds, capable d'engager les navires de guerre ennemis à distance et de dissuader les débarquements amphibies."
 nd_ban_modern_harbor: "Port moderne"
 nd_ban_modern_harbor_desc: "Une installation portuaire modernisée avec des postes d'amarrage en eau profonde, des grues mécaniques et une vaste capacité d'entrepôt, capable de gérer les volumes commerciaux de l'ère industrielle."
 nd_ban_gudang_upkeep: "Entretien de Gudang"
 nd_ban_gudang_upkeep_desc: "Le coût d'entretien des entrepôts de poivre de Banten : bois pour les réparations, papier pour les registres commerciaux et poterie pour les poids et mesures."
 nd_ban_palace_upkeep: "Entretien du palais"
 nd_ban_palace_upkeep_desc: "L'entretien du complexe du palais Surosowan : pierre et bois pour l'aqueduc, les bassins et les salles, avec des tissus fins pour les audiences et le mobilier de la cour."
 nd_ban_pecinan_upkeep: "Entretien du trimestre"
 nd_ban_pecinan_upkeep_desc: "Le coût de l'entretien des infrastructures et des installations commerciales du quartier marchand chinois."
 nd_ban_mosque_upkeep: "Entretien de la mosquée"
 nd_ban_mosque_upkeep_desc: "Les frais de fonctionnement de la Grande Mosquée : encens pour le culte, tissus pour tapis de prière et papier pour les manuscrits du Coran et les textes savants."
 nd_ban_toll_collection: "Perception des péages"
 nd_ban_toll_collection_desc: "Le coût administratif du fonctionnement du système de péage du détroit de la Sonde : bois pour le péage, papier pour les registres d'expédition et jetons de poterie utilisés comme reçus de péage."
 nd_ban_bastion_upkeep: "Entretien des bastions"
 nd_ban_bastion_upkeep_desc: "Le coût de l'entretien des fortifications côtières en pierre et de leur garnison."
 nd_ban_battery_upkeep: "Entretien de la batterie"
 nd_ban_battery_upkeep_desc: "Le coût de l'entretien des emplacements d'artillerie côtière et de leur approvisionnement en munitions."
 nd_ban_harbor_upkeep: "Entretien du port"
 nd_ban_harbor_upkeep_desc: "Le coût de maintenance des infrastructures portuaires modernes : quais, grues et entrepôts."
 nd_ban_lampung_cultivation: "Culture du Lampung"
 nd_ban_lampung_cultivation_desc: "Pepper vines are trained up living dadap trees and the ground between them is kept clear with iron tools. The berries are picked, dried in the sun, and carried down to the coast."
 nd_ban_pepper_garden: "Pepper Garden"
 nd_ban_pepper_garden_desc: "A kebun lada. Under the sultan's charters every household of the pepper districts keeps five hundred vines and delivers the crop to his agents."
 nd_ban_daluang_house: "Daluang House"
 nd_ban_daluang_house_desc: "Daluang, the bark paper of western Java, is made here. The inner bark of the saeh tree is soaked and beaten out into sheets."
 nd_ban_daluang_beating: "Bark Beating"
 nd_ban_daluang_beating_desc: "Strips of saeh bark are soaked, laid on a board, and beaten thin with a grooved bronze mallet, then dried and polished with a shell."
 nd_ban_tirtayasa_canal: "Tirtayasa Canal"
 nd_ban_tirtayasa_canal_desc: "One of the canals dug across the coastal plain under Sultan Ageng. New rice fields and coconut groves are laid out along it and settlers are brought to work them."
 nd_ban_canal_upkeep: "Canal Upkeep"
 nd_ban_canal_upkeep_desc: "Timber for the sluices, stone for the banks, and tools for the yearly clearing of silt."
 nd_ban_kepandean: "Kepandean"
 nd_ban_kepandean_desc: "The smiths' quarter of the city. Bronze guns are cast here for the walls and the fleet, to stand beside pieces such as the great gun Ki Amuk."
 nd_ban_gun_founding: "Gun Founding"
 nd_ban_gun_founding_desc: "Copper and tin brought in by sea are melted over charcoal and cast into bronze guns."
 levy_nd_ban_debus_elite: "Garde Debus du sultan"
 levy_nd_ban_debus: "Guerriers Debus"
 levy_nd_ban_jong: "Flotte Jong"
 levy_nd_ban_debus_elite_desc: "La garde du corps personnelle du sultan composée de pratiquants Debus : des guerriers spirituels invulnérables qui servent de garde d'élite à la cour de Banten."
 levy_nd_ban_debus_desc: "Artistes martiaux volontaires Debus des villages de Banten : guerriers spirituels brandissant des couteaux et des chaînes de fer."
 levy_nd_ban_jong_desc: "Une flotte de navires de commerce jong traditionnels mis au service naval : avec un équipage composé de marins des communautés côtières de Banten."
 nd_ban_formed_tt: "Banten a été formé"
 nd_ban_path_a_tt: "Choisissez Pepper Emporium of the East"
 nd_ban_path_b_tt: "A choisi les gardiens du détroit de la Sonde"
 nd_ban_destiny: "Le destin de Banten"
 nd_ban_destiny_desc: "Le sultanat de Banten est né des cendres du royaume hindou de la Sonde. Le sultan doit désormais choisir la voie qui définira l'avenir de la nation : la richesse du poivre ou la puissance de la flotte."
 nd_ban_dest_pepper_empire: "Empire du poivre"
 nd_ban_dest_pepper_empire_desc: "Prenez le contrôle de Palembang, le centre rival de production de poivre du sud de Sumatra. Ce n'est qu'en dominant les deux rives du détroit de la Sonde que les marchands de poivre de Banten pourront dominer le marché mondial."
 nd_ban_dest_spice_crossroads: "Carrefour du commerce des épices"
 nd_ban_dest_spice_crossroads_desc: "Étendre la portée commerciale de Banten à Malacca et Temasek. Le contrôle du détroit de Malacca, le long du détroit de la Sonde, ferait de Banten le maître incontesté du commerce maritime d’Asie du Sud-Est."
 nd_ban_dest_world_market: "Marché mondial du poivre"
 nd_ban_dest_world_market_desc: "Absorbez le sultanat de poivre d’Aceh et le port commercial de Kedah, en veillant à ce que chaque région productrice de poivre, de Lampung au nord de Sumatra, réponde à Banten. Grâce à l'afflux de poivre sur notre marché financier, Banten devient la première bourse d'épices au monde."
 nd_ban_dest_strait_command: "Commandement du détroit"
 nd_ban_dest_strait_command_desc: "Conquer Demak and its port of Jepara to secure Banten's position on Java. Control of the northern Javanese coast prevents rivals from challenging our domination of the Sunda Strait."
 nd_ban_dest_eastern_seas: "Maîtrise des mers orientales"
 nd_ban_dest_eastern_seas_desc: "Projetez la puissance navale bantenaise dans le détroit de Makassar et à travers la mer de Java jusqu’à Bali. Les royaumes maritimes de l'est de l'Indonésie doivent reconnaître la suprématie de Banten."
 nd_ban_dest_archipelago_hegemon: "Hégémon de l'archipel"
 nd_ban_dest_archipelago_hegemon_desc: "Étendez la domination de Banten aux îles aux épices de Ternate et aux ports de Brunei. Du détroit de la Sonde aux Moluques, aucune flotte ne navigue dans ces eaux sans le consentement des Bantenais."
 nd_ban.5.t: "Un sultanat renaît"
 nd_ban.5.d: "The formation of the Sultanate of Banten marks a turning point in the history of western Java. The old Hindu trading networks have been absorbed into a new Islamic polity that commands the Sunda Strait: the narrow passage through which all commerce between the Indian Ocean and the Java Sea must pass.\n\nThe Sultan gazes from the walls of Surosowan across a harbor crowded with foreign vessels. Chinese junks sit alongside Indian dhows and, increasingly, the strange square-rigged ships of the Europeans. Each brings silver; each leaves laden with pepper. The question is not whether Banten will grow rich, but how best to channel that wealth into lasting power."
 nd_ban.5.a: "L'avenir appartient à ceux qui s'en emparent."
 nd_ban.6.t: "Les guerres du poivre de Palembang"
 nd_ban.6.d: "Palembang has long been Banten's chief rival for control of the pepper trade in southern Sumatra. Where Banten dominates the western coast and Lampung, Palembang controls the Musi River basin and its access to the pepper gardens of the interior. With Palembang now under our authority, the southern Sumatran pepper trade flows through a single channel: our warehouses in Banten.\n\nMerchants who once played Banten and Palembang against each other now have no alternative. The price of pepper is set in our gudangs, and it is set to our advantage."
 nd_ban.6.a: "Toutes les routes du poivre mènent à Banten."
 nd_ban.7.t: "Banten à la croisée des chemins"
 nd_ban.7.d: "The conquest of Malacca and Temasek transforms Banten from a regional pepper power into a global commercial hub. Where once merchants could bypass our ports through the Strait of Malacca, now both great passages between the Indian Ocean and the Pacific are under Bantenese control.\n\nForeign merchants present themselves at our harbors with new deference. The English, the Danes, the Persians: all seek favorable terms from the sultanate that holds the keys to two oceans. The question is how to leverage this unprecedented position."
 nd_ban.7.a: "Construisez des réseaux commerciaux à travers le monde connu."
 nd_ban.7.b: "Renforcez notre emprise sur les passages du détroit."
 nd_ban.8.t: "Le marché mondial du poivre"
 nd_ban.8.d: "From Lampung to Aceh, every major pepper-producing region in the archipelago now answers to the Sultan of Banten. The black peppercorns that Europe craves, that China seasons its cuisine with, that Indian merchants trade across the Arabian Sea: all of it passes through our warehouses and our markets.\n\nBanten has achieved what no previous sultanate managed: a near-monopoly on the world's most valuable spice. The question now is whether to wield this monopoly as an instrument of royal enrichment or to declare Banten a free port, drawing all the world's trade to our shores through the promise of fair dealing."
 nd_ban.8.a: "Le Sultan sera le Roi du Poivre."
 nd_ban.8.b: "Déclarez Banten un port franc pour toutes les nations."
 nd_ban.9.t: "La campagne javanaise"
 nd_ban.9.d: "The fall of Demak and Jepara secures Banten's eastern flank on Java. The northern Javanese coast (its ports, its shipyards, its rice-rich hinterland) now supports the Sultan's ambitions rather than threatening them.\n\nBantenese patrol ships range freely along the coast, and the war praus that once guarded only the Sunda Strait now project power across the Java Sea. The admirals speak of distant conquests: Makassar, Bali, even the fabled Spice Islands."
 nd_ban.9.a: "La mer de Java sera notre domaine."
 nd_ban.10.t: "Conquêtes orientales"
 nd_ban.10.d: "Bantenese war fleets have achieved what seemed impossible: the conquest of Makassar and the subjugation of the Balinese kingdoms. The eastern seas that were once the domain of Buginese pirates and independent rajas now fall under the Sultan's authority.\n\nThe spice routes from the Moluccas to Java now pass through waters patrolled by Bantenese galleys. Our merchants establish factors in conquered ports, and our administrators impose the Sultan's law on peoples who have never known Sundanese rule. The question is how to consolidate these far-flung conquests."
 nd_ban.10.a: "Règle grâce à la suprématie navale."
 nd_ban.10.b: "Unissez les peuples javanais sous une même bannière."
 nd_ban.11.t: "Hégémon de l'archipel"
 nd_ban.11.d: "From the Sunda Strait to the Moluccas, from Brunei to Bali, the Sultanate of Banten has imposed its will across the archipelago. The fabled Spice Islands of Ternate, source of the cloves that Europeans prize above gold, now fly the Sultan's banner. The ports of Brunei, gateway to the South China Sea, submit to Bantenese authority.\n\nNo European company, no rival sultanate, no coalition of rajas can challenge Banten's dominion over these waters. The Sultan's fleet is the largest in Southeast Asia, and his armies garrison ports from Sumatra to the Moluccas. This is the empire that Sultan Ageng Tirtayasa dreamed of: a maritime state that bows to no foreign power."
 nd_ban.11.a: "Commandez les mers avec une flotte de fer."
 nd_ban.11.b: "Règle en tant qu'empereur des îles."
 STATIC_MODIFIER_NAME_nd_ban_dest_malacca_network: "Réseau commercial de Malaccan"
 STATIC_MODIFIER_DESC_nd_ban_dest_malacca_network: "Les marchands de Banten ont établi des réseaux commerciaux rayonnant à partir du port conquis de Malacca, reliant les marchés du poivre de l'archipel au reste du monde."
 STATIC_MODIFIER_NAME_nd_ban_dest_strait_monopoly: "Monopole des détroits jumeaux"
 STATIC_MODIFIER_DESC_nd_ban_dest_strait_monopoly: "Le contrôle du détroit de la Sonde et du détroit de Malacca donne à Banten un monopole effectif sur le commerce maritime entre l'océan Indien et le Pacifique."
 STATIC_MODIFIER_NAME_nd_ban_dest_pepper_king: "Roi du poivre"
 STATIC_MODIFIER_DESC_nd_ban_dest_pepper_king: "Le sultan de Banten détient un monopole quasi total sur l'approvisionnement mondial en poivre, fixant les prix de Lisbonne à Canton et enrichissant le sultanat au-delà de toute mesure."
 STATIC_MODIFIER_NAME_nd_ban_dest_free_port: "Port Franc de l'Est"
 STATIC_MODIFIER_DESC_nd_ban_dest_free_port: "Banten s'est déclaré port franc ouvert à toutes les nations, attirant des marchands des quatre coins du monde avec des promesses de transactions équitables et de tarifs bas."
 STATIC_MODIFIER_NAME_nd_ban_dest_makassar_conquest: "Conquérant de Makassar"
 STATIC_MODIFIER_DESC_nd_ban_dest_makassar_conquest: "La conquête de Makassar ouvre les mers orientales à la puissance navale bantenaise, sécurisant les routes des épices et projetant l'autorité du sultan au cœur de l'archipel."
 STATIC_MODIFIER_NAME_nd_ban_dest_java_unifier: "Unificateur de Java"
 STATIC_MODIFIER_DESC_nd_ban_dest_java_unifier: "Les royaumes javanais ont été regroupés sous une seule bannière. De Banten à Surabaya, l’île autrefois divisée entre sultanats rivaux est désormais au service d’un seul maître."
 STATIC_MODIFIER_NAME_nd_ban_dest_spice_admiral: "Amiral des épices"
 STATIC_MODIFIER_DESC_nd_ban_dest_spice_admiral: "Les amiraux de Banten commandent la flotte la plus puissante de l'archipel, leurs galères et navires de guerre patrouillant les voies maritimes depuis le détroit de la Sonde jusqu'aux Moluques."
 STATIC_MODIFIER_NAME_nd_ban_dest_island_emperor: "Empereur des îles"
 STATIC_MODIFIER_DESC_nd_ban_dest_island_emperor: "Le sultan de Banten règne en tant qu'empereur sur un vaste domaine maritime, ses sujets s'étendant sur des dizaines d'îles et ses vassaux gouvernant de Brunei à Ternate."
 nd_ban_global_pepper_exchange: "Bourse mondiale du poivre"
 nd_ban_global_pepper_exchange_desc: "Un vaste complexe commercial où le poivre de tout l'archipel est vendu aux enchères aux marchands de toutes les nations commerçantes de la planète. La Bourse fixe le prix mondial du poivre noir."
 nd_ban_exchange_upkeep: "Maintenance des échanges"
 nd_ban_exchange_upkeep_desc: "Le coût de l'entretien du Global Pepper Exchange : papier pour les registres commerciaux, tissu fin pour les salles de vente aux enchères et outils pour l'équipement de pesée."
 nd_ban_admiralty_citadel: "Citadelle de l'Amirauté"
 nd_ban_admiralty_citadel_desc: "Un quartier général naval fortifié depuis lequel les amiraux du sultan coordonnent les opérations de la flotte à travers l'archipel. La citadelle abrite des cartes de navigation, des stations de signalisation et un arsenal pour la flotte."
 nd_ban_citadel_upkeep: "Entretien de la Citadelle"
 nd_ban_citadel_upkeep_desc: "Le coût d'entretien de la Citadelle de l'Amirauté : pierre pour les fortifications, fournitures navales pour l'arsenal et armes pour la garnison."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_ban_bureaucracy_authority: "Autorité bureaucratique du Sultanat"
 AUTO_MODIFIER_DESC_nd_ban_bureaucracy_authority: "The Sultan of Banten, secure on his throne at the Surasoan Karaton, may now charter formal institutions to administer the realm. Three of them may be kept at a time."

 ban_surasoan_karaton_bureaucracy: "Karaton Surasoan"
 ban_surasoan_karaton_bureaucracy_desc: "Le complexe du palais fortifié du sultan à Banten Lama, commencé par Maulana Hasanuddin en 1552 et élaboré par tous les dirigeants ultérieurs jusqu'aux rénovations du sultan Ageng sous le renégat italien Cardeel dans les années 1670. Le karaton renferme le dalem privé du sultan, la salle d'audience pendopo, la salle du conseil de Pancagati et la place de parade alun-alun - le théâtre institutionnel dans lequel le cadi en chef, les syahbandars, les Tumenggungs et les envoyés en visite dirigent tous les affaires du sultanat. L'isolement du sultan derrière sept cours confère la dignité qui distingue le souverain de Banten de tout seigneur provincial javanais."

 ban_syahbandariate_bureaucracy: "Syahbandariat de Banten"
 ban_syahbandariate_bureaucracy_desc: "Le système de capitainerie multiethnique qui a géré le port de Banten de la fin du XVIe siècle jusqu'à l'occupation de 1682 par VOC. Le sultan nomma un syahbandar distinct pour chaque communauté étrangère : les Chinois pour le Pecinan, les Gujarati pour le quartier Keling, les Malais pour les expéditeurs de l'archipel et (après 1596 et 1602) les facteurs européens dont les usines hollandaises et anglaises payaient des redevances au trône. Chaque syahbandar collectait les mouillages et les douanes dans sa propre juridiction et répondait conjointement au ministre en chef du sultan, faisant de Banten un port franc du modèle Banten-Aceh-Makassar - non exempt de droits de douane, mais libre du monopole d'une seule communauté."

 ban_tumenggung_tributary_bureaucracy: "Système affluent de Tumenggung"
 ban_tumenggung_tributary_bureaucracy_desc: "The chain of hereditary military governors (Tumenggungs in the Mataram-Demak Javanese pattern) who held the inland pepper-producing districts of Lampung across the Sunda Strait and the Banten interior on behalf of the Sultan. Each Tumenggung commanded a small priyayi cavalry contingent, supervised the pepper plantations through pasirah village headmen, and forwarded the tribute pepper to Banten port for the syahbandars to sell. The system gave Banten its near-monopoly on archipelago pepper from c. 1620 to the 1682 VOC contract, and bequeathed the centrifugal tendencies common to every Javanese coastal sultanate."

 ban_pesantren_hierarchy_bureaucracy: "Hiérarchie du Sultan-Calife et des Pesantren"
 ban_pesantren_hierarchy_bureaucracy_desc: "La forme institutionnelle de l'islam bantenais après que le sultan Abulmafakhir Mahmud Abdulkadir a obtenu un firman de 1638 du chérif de La Mecque reconnaissant le souverain Banten comme sultan - la première reconnaissance mecquoise pour un souverain javanais. La subvention a aligné le trône sur le réseau pesantren dérivé de Cirebon de la lignée wali sanga et a élevé un cadi en chef au tribunal de Surasoan qui supervisait la loi sur le mariage, les fondations caritatives et la khutbah du vendredi à la Grande Mosquée Banten Lama. Sous le sultan Ageng (r. 1651-1683), la hiérarchie acquit un caractère nettement oppositionnel, soutenant la longue résistance anti-hollandaise jusqu'au XVIIIe siècle."

 ban_polyglot_corps_bureaucracy: "Corps de mercenaires polyglottes"
 ban_polyglot_corps_bureaucracy_desc: "Les troupes buginoises, macassaraises, balinaises, malgaches et (en moins nombreux) européennes que le sultan Ageng Tirtayasa a embauchées pendant sa période d'armée réformée pour briser le monopole de la cavalerie priyayi. À la suite du traité Bongaya de 1667 qui dispersa les vétérans Bugis-Macassar de Makassar à travers l'archipel, Banten devint le principal employeur de ces combattants déplacés : régiments de piquiers Bugis, arquebusiers Macassar, porteurs de kris balinais et mousquetaires malgaches cantonnés à Karangantu et Pakauman, entraînés dans des formations européennes sous Cardeel et ses successeurs. Le corps a combattu le siège de Banten Lama en 1682, jusqu'à une quasi-impasse : mais il dépendait d'un paiement continu en espèces provenant des revenus du poivre."
