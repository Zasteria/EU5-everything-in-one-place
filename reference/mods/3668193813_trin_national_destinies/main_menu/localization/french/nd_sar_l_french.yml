l_french:
 STATIC_MODIFIER_NAME_nd_sar_carta_de_logu: "Carte du Logu"
 STATIC_MODIFIER_DESC_nd_sar_carta_de_logu: "L'ancien code juridique des Giudicati demeure le fondement de la gouvernance sarde, accordant des droits et des protections que peu d'Européens peuvent égaler."
 STATIC_MODIFIER_NAME_nd_sar_savoy_ambition: "Ambition savoyarde"
 STATIC_MODIFIER_DESC_nd_sar_savoy_ambition: "La Maison de Savoie transforme la Sardaigne d’une île isolée en un tremplin pour l’ambition continentale, en modernisant l’armée et la bureaucratie."
 STATIC_MODIFIER_NAME_nd_sar_arborean_triumph: "Triomphe arboréen"
 STATIC_MODIFIER_DESC_nd_sar_arborean_triumph: "Le souvenir du défi d'Arborea inspire à nos soldats un esprit combatif inébranlable."
 STATIC_MODIFIER_NAME_nd_sar_sanluri_remembrance: "Souvenir de Sanluri"
 STATIC_MODIFIER_DESC_nd_sar_sanluri_remembrance: "Les leçons amères de Sanluri durcissent nos défenses. Plus jamais un envahisseur ne s’emparera de notre île à moindre coût."
 STATIC_MODIFIER_NAME_nd_sar_risorgimento_arms: "Kingdom in Arms"
 STATIC_MODIFIER_DESC_nd_sar_risorgimento_arms: "The regiments of the kingdom are drilled and kept ready to march, so that no power takes the island cheaply."
 STATIC_MODIFIER_NAME_nd_sar_risorgimento_diplomacy: "Royal Diplomacy"
 STATIC_MODIFIER_DESC_nd_sar_risorgimento_diplomacy: "The king's envoys sit as equals at the courts of Europe, and old enemies are turned into friends."
 nd_sar.1.t: "Le Royaume de Sardaigne"
 nd_sar.1.d: "The crown of Sardinia sits upon our brow. This island, home to one of Europe's oldest civilizations, now rises as a kingdom in its own right. The ancient Giudicati governed themselves with laws more progressive than any on the continent: the Carta de Logu granted rights to women, enshrined equality before the law, and was written in the people's own tongue. Yet the tides of history have also brought Aragonese ambition, Genoese commerce, and now the calculating vision of the House of Savoy.\n\nTwo paths lie before us. We may draw upon the island's deep traditions of self-governance and legal excellence, building a kingdom rooted in the ancient Sardinian way. Or we may embrace the continental vision of the Savoy dynasty, forging Sardinia into a modern military state capable of reshaping the Italian peninsula.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_sar.1.a: "Honorez la Carta de Logu"
 nd_sar.1.b: "Adoptez la vision savoyarde"
 nd_sar.2.t: "La Charte de Logu"
 nd_sar.2.d: "In 1392, Eleonora d'Arborea promulgated the Carta de Logu: a legal code of 198 chapters written not in Latin but in Sardinian, the language of the people it governed. It established principles that would not appear elsewhere in Europe for centuries: women could inherit property and refuse marriage, equality before the law was enshrined regardless of birth, and environmental protections governed the use of forests and waterways.\n\nThe code proved so effective that when the Crown of Aragon finally conquered the island, they adopted it wholesale. It remained the law of Sardinia until 1827: over four centuries of continuous use, a testament to the wisdom of a woman whom Sardinians still call 'sa mama de su populu,' the mother of the people."
 nd_sar.2.a: "Un héritage qui transcende la conquête."
 nd_sar.3.t: "La bataille de Sanluri"
 nd_sar.3.d: "On June 30, 1409, the armies of the Giudicato of Arborea met the forces of the Crown of Aragon at Sanluri, in what would become the last great battle for Sardinian independence. The Arborean army, reinforced by Genoese allies and Sardinian volunteers from across the island, fought with desperate courage against the professional Catalan-Aragonese forces.\n\nThe battle was a bloodbath. Thousands fell on both sides, and by day's end, Arborea's military power was broken. The Giudicato lingered for another eleven years (its territories sold to Aragon in 1420), but Sanluri marked the end of independent Sardinia. The memory burns differently depending on who tells the tale: some speak of the fierce Sardinian charge that nearly broke the Aragonese line, others of the stubborn defense that made conquest unbearably costly."
 nd_sar.3.a: "Souvenez-vous de l'accusation à Sanluri !"
 nd_sar.3.b: "N'oubliez pas le coût de l'invasion."
 nd_sar.4.t: "A Crown Among the Powers"
 nd_sar.4.d: "For a generation the powers of Europe have passed the island from hand to hand. An English and Dutch fleet took Cagliari for the Habsburg claimant in 1708, Spain seized it back in 1717, and the Treaty of London gave it to the House of Savoy, which took possession in 1720. Whoever wears this crown is a king, and kings are watched.\n\nThe island's place among the powers can be kept in two ways: by an army that makes it costly to take, or by envoys who make its holder worth having as a friend."
 nd_sar.4.a: "Let the army answer for the crown."
 nd_sar.4.b: "Let the envoys answer for the crown."
 nd_sar_giudicati_tradition: "Corona de Logu"
 nd_sar_giudicati_tradition_desc: "The corona de logu is the assembly of a judgedom: its prelates, its great men and the curators of its districts. It confirms each new judge, gives its assent to war and treaty, and sits as the highest court of the land. Below it a corona meets in every district to hear the suits of the villages."
 nd_sar_nuragic_heritage: "Patrimoine nuragique"
 nd_sar_nuragic_heritage_desc: "Plus de sept mille tours en pierre datant de l'âge du bronze parsèment le paysage sarde, témoignage de l'ancienne culture de fortification et de défense territoriale de l'île."
 nd_sar_pastoral_heartland: "Cœur pastoral"
 nd_sar_pastoral_heartland_desc: "Depuis des millénaires, l'intérieur de la Sardaigne est le domaine des bergers. La laine, le fromage et le bétail de l'île constituent le fondement de son économie."
 nd_sar_arborean_resistance: "Résistance arboricole"
 nd_sar_arborean_resistance_desc: "Le Giudicato d'Arborea était le dernier bastion de la domination sarde indépendante, menant une guerre de plusieurs décennies contre la conquête aragonaise avec une détermination farouche."
 nd_sar_coral_riviera: "Riviera Corail"
 nd_sar_coral_riviera_desc: "The waters off Alghero yield some of the finest red coral in the Mediterranean, prized from Genoa to Constantinople for its beauty and rarity.\n\n#italic Available in: $nd_sar_gremio_argentieri$#!"
 nd_sar_spanish_watchtowers: "Royal Sea Fortresses"
 nd_sar_spanish_watchtowers_desc: "The crown of Aragon holds the island from its walled towns on the coast. Alghero, the Castle of Cagliari and Castellaragonese are given new curtain walls and bastions toward the sea, and are garrisoned by the king's own men."
 nd_sar_sanluri_legacy: "L'héritage de Sanluri"
 nd_sar_sanluri_legacy_desc: "La bataille de Sanluri en 1409, où l'indépendance de la Sardaigne fut perdue dans un terrible bain de sang, reste un moment déterminant dans la mémoire collective de l'île."
 nd_sar_silver_mountains: "Montagnes d'argent"
 nd_sar_silver_mountains_desc: "The mines of the Iglesiente around Villa di Chiesa have yielded silver since antiquity. The masters of the royal towns work it into the filigree buttons, chains and reliquaries of the island.\n\n#italic Available in: $nd_sar_gremio_argentieri$#!"
 nd_sar_catalan_legacy: "L'héritage catalan"
 nd_sar_catalan_legacy_desc: "Centuries of Catalan-Aragonese rule left a lasting cultural imprint on Sardinia, particularly in Alghero where Catalan is still spoken, bringing Mediterranean trade connections and architectural splendor. The coral boats of Alghero put to sea under the escort of the town's own galleys."
 nd_sar_barbagia_refuge: "Refuge de Barbagia"
 nd_sar_barbagia_refuge_desc: "La région intérieure montagneuse de la Barbagia a résisté à tous les envahisseurs, de Rome à l'Aragon. Son relief accidenté et ses habitants féroces en font un cœur invincible."
 nd_sar_tuna_mattanza: "Thon Mattanza"
 nd_sar_tuna_mattanza_desc: "The ancient practice of mattanza (the great communal tuna harvest) sustains coastal communities and trains skilled sailors in seamanship and coordinated maritime action. Where the tuna run close inshore a tonnara is set: a maze of nets ending in the chamber of death, with a station on the beach to salt the catch."
 nd_sar_sardinian_companies: "Entreprises Sardes"
 nd_sar_sardinian_companies_desc: "Les soldats sardes servent dans des compagnies à travers la Méditerranée, acquérant une réputation de ténacité et d'endurance qui dément la taille modeste de leur île."
 nd_sar_feudal_reform: "Réforme féodale"
 nd_sar_feudal_reform_desc: "Les tentatives de réforme du système féodal désuet imposé par Aragon se heurtent à une résistance farouche de la part des barons bien établis, mais renforcent progressivement l'autorité de la couronne."
 nd_sar_island_fortress: "Forteresse de l'île"
 nd_sar_island_fortress_desc: "Every village of the island keeps horsemen on the militia rolls. When the towers of the coast light their fires, the mounted militia rides for the threatened shore."
 nd_sar_pastoral_export: "Exportation pastorale"
 nd_sar_pastoral_export_desc: "Sardinian pecorino cheese, fine wool, salted hides and cured meats find eager markets across the Mediterranean, establishing the island as a specialist in pastoral goods.\n\n#italic Available in: $nd_sar_pinnetta$#!"
 nd_sar_stamenti_parliament: "Royal Pragmatics"
 nd_sar_stamenti_parliament_desc: "In 1640 the jurist Francisco de Vico publishes the laws and royal pragmatics of the kingdom in one collection. The scattered orders of two centuries of kings become a single body of law that every court of the island can cite."
 nd_sar_savoy_integration: "Supreme Council of Sardinia"
 nd_sar_savoy_integration_desc: "From 1721 a Supreme Council of Sardinia sits at the court of the island's new Savoyard king. Its regent and councillors review the acts of the viceroy and carry the petitions of the island to the sovereign."
 nd_sar_carabinieri_reali: "Dragoons of Sardinia"
 nd_sar_carabinieri_reali_desc: "Raised in 1726 for the service of the island, the Dragoons of Sardinia ride against the bandits of the interior, escort the king's judges, and fight on foot when war comes."
 nd_sar_railway_modernization: "New Colonies"
 nd_sar_railway_modernization_desc: "In 1738 Ligurian coral fishers from Tabarka are settled on the island of San Pietro, where they build the town of Carloforte. Other planted settlements follow on empty coasts, and waste land is brought under the plough."
 nd_sar_bersaglieri: "Barracelli Companies"
 nd_sar_bersaglieri_desc: "Each village swears in a company of barracelli, armed men who guard fields and flocks and answer with their own goods for what is stolen. They know every track of their district and can be called out in a day."
 nd_sar_risorgimento_spirit: "The Royal Crown"
 nd_sar_risorgimento_spirit_desc: "By the Treaty of London the island passes in 1720 to the House of Savoy, which takes from it the title of king. A crown that dukes fought a generation to win ranks its holder among the sovereigns of Europe."
 nd_sar_statuto_albertino: "Code of Charles Felix"
 nd_sar_statuto_albertino_desc: "In 1827 King Charles Felix gives the island a single body of civil and criminal law. It replaces the Carta de Logu after more than four centuries and puts every court of the kingdom under one text."
 nd_sar_piedmontese_industry: "The Carlo Felice Road"
 nd_sar_piedmontese_industry_desc: "Between 1822 and 1829 a royal road is built the length of the island, from Cagliari through Oristano and Sassari to Porto Torres. Carts replace pack horses, and the grain, cheese and wine of the interior reach the ports."
 nd_sar_cavour_strategy: "The Court at Cagliari"
 nd_sar_cavour_strategy_desc: "From 1799 to 1814, with the mainland in French hands, the king and his ministers sit at Cagliari and the envoys of the powers come to them there. In 1804 the Royal Agrarian and Economic Society is founded in the city to study the improvement of the island."
 nd_sar_modern_coastal_defense: "Défense côtière moderne"
 nd_sar_modern_coastal_defense_desc: "The ancient torre network receives modern artillery batteries and trained gun crews, and half-galleys are kept in commission to patrol between the towers against the last Barbary corsairs."
 a_nd_sar_arborean_militia: "Milice arboréenne"
 a_nd_sar_arborean_militia_desc: "De robustes soldats paysans du Giudicato d'Arborea, experts dans les combats défensifs à travers les collines et les montagnes de Sardaigne."
 n_nd_sar_coral_galley: "Cuisine de Corail"
 n_nd_sar_coral_galley_desc: "Des galères rapides et maniables qui patrouillent la côte sarde, protégeant les pêcheurs de corail et les navires marchands des raids de pirates."
 a_nd_sar_carabinieri: "Dragoons of Sardinia"
 a_nd_sar_carabinieri_desc: "Soldiers who ride to the trouble and fight on foot. Steady under fire and quick to act, they keep the king's peace between wars."
 a_nd_sar_bersaglieri: "Barracelli"
 a_nd_sar_bersaglieri_desc: "Sworn watchmen of the villages with long guns. They move fast over country they know and shoot well, and they are not trained to stand a long fight."
 levy_nd_sar_bersaglieri: "Barracelli Levy"
 levy_nd_sar_bersaglieri_desc: "The watch companies of the villages, called out by the kingdom to serve as light troops."
 a_nd_sar_cavalleria_miliziana: "Mounted Militia"
 a_nd_sar_cavalleria_miliziana_desc: "Village horsemen on small island horses, called out by the fires of the coastal towers. They are many and quick to gather, and were never drilled to stand in a line."
 levy_nd_sar_cavalleria_miliziana: "Mounted Militia Levy"
 levy_nd_sar_cavalleria_miliziana_desc: "The horsemen of the villages, mustered by the kingdom to ride for any shore where a tower has lit its fire. In 1793 some six thousand of them were raised against the French landing."
 n_nd_sar_mezza_galera: "Half-Galley"
 n_nd_sar_mezza_galera_desc: "A light oared warship of the Sardinian coast guard, quick in a calm and cheap to man. It carries fewer guns than a galley and was among the last of its kind kept by any navy."
 levy_nd_sar_arborean_militia: "Prélèvement de la milice arboricole"
 levy_nd_sar_arborean_militia_desc: "Prélèvements paysans prélevés sur les collines et les montagnes de la Sardaigne selon la tradition du Giudicato d'Arborea."
 nd_sar_curia_regni: "Curie Regni"
 nd_sar_curia_regni_desc: "The court of a judgedom, where the corona de logu sits in judgement and the law of the island is administered with a care rare in medieval Europe."
 nd_sar_pinnetta: "Pinnette"
 nd_sar_pinnetta_desc: "Abris pastoraux traditionnels sardes en pierre et en chaume, qui constituent le noyau de l'économie florissante du mouton et de la laine de l'île."
 nd_sar_torre_costiera: "Sea Bastion"
 nd_sar_torre_costiera_desc: "A bastion and curtain wall on the seaward side of a coastal town, with a guard of soldiers and a watch over the harbour."
 nd_sar_tonnara: "Tonnara"
 nd_sar_tonnara_desc: "A fixed tuna trap and its station on the beach. The nets are set each spring where the tuna pass, and the catch is salted and barrelled on the shore."
 nd_sar_gremio_argentieri: "Silversmiths' Gremio"
 nd_sar_gremio_argentieri_desc: "The sworn guild of the silversmiths in a royal town, founded on the Catalan model with its own statutes, patron saint and chapel. Its masters work silver and coral."
 nd_sar_mattanza: "Mattanza"
 nd_sar_mattanza_desc: "The tuna are driven from chamber to chamber of the nets and taken in the last. Salt, timber and cordage are consumed, and the catch is put up in barrels."
 nd_sar_hide_salting: "Hide Salting"
 nd_sar_hide_salting_desc: "The hides of the flocks and herds are salted with the island's own salt and baled for the merchants of the mainland."
 nd_sar_curia_maintenance: "Administration des tribunaux"
 nd_sar_curia_maintenance_desc: "Le fonctionnement quotidien du tribunal de la Giudicati nécessite des scribes, des parchemins et des pierres pour l'entretien de ce siège de justice."
 nd_sar_silver_minting: "Silver Filigree"
 nd_sar_silver_minting_desc: "The silver of the Iglesiente is drawn into wire and worked into the filigree buttons, chains and reliquaries of island dress."
 nd_sar_wool_processing: "Traitement de la laine"
 nd_sar_wool_processing_desc: "Les bergers sardes apportent leurs toisons aux ateliers de pinnetta, où des mains expertes cardent, filent et tissent la célèbre laine de l'île pour en faire du tissu."
 nd_sar_coral_craft: "Artisanat de corail"
 nd_sar_coral_craft_desc: "Le corail rouge de la Riviera del Corallo est transformé en bijoux exquis par des artisans sardes, atteignant des prix élevés dans toute la Méditerranée."
 nd_sar_torre_maintenance: "Bastion Watch"
 nd_sar_torre_maintenance_desc: "Keeping the bastion requires stone for repairs, weapons for the guard, and timber for the gun platforms and gates."
 nd_sar_formed_tt: "Formé le Royaume#bold de Sardaigne#!"
 nd_sar_path_a_tt: "Choisissez le destin#bold Giudicati Sovereignty#!"
 nd_sar_path_b_tt: "Choisissez le destin#bold Conquête Savoyarde#!"
 nd_sar_destiny: "Destin sarde"
 nd_sar_destiny_desc: "Le Royaume de Sardaigne est proclamé. Que nous honorions les anciennes traditions d'autonomie gouvernementale de l'île ou que nous embrassions l'ambition continentale, notre chemin vers l'avant commence par un royaume stable."
 nd_sar_dest_giudicati_crown: "Couronne des Giudicati"
 nd_sar_dest_giudicati_crown_desc: "Étendez la souveraineté sarde sur la Corse, notre île sœur de l’autre côté du détroit de Bonifacio, et construisez un commerce de laine florissant pour financer notre royaume insulaire."
 nd_sar_dest_laws_sea: "Lois de la mer"
 nd_sar_dest_laws_sea_desc: "Faire de la Sardaigne une puissance commerciale méditerranéenne en adoptant un système bancaire moderne, en renforçant notre trésorerie et en garantissant la circulation du sel sur nos marchés de capitaux."
 nd_sar_dest_parliament: "Parlement des îles"
 nd_sar_dest_parliament_desc: "Créez un Commonwealth insulaire s'étendant sur la Méditerranée occidentale en prenant les Baléares, en obtenant un grand prestige et en diffusant la presse écrite à travers notre royaume."
 nd_sar_dest_piedmont_bridge: "Le pont piémontais"
 nd_sar_dest_piedmont_bridge_desc: "Traversez le continent en vous emparant de Turin et de Nice, le cœur savoyard qui transforme notre royaume insulaire en puissance continentale."
 nd_sar_dest_two_crowns: "Royaume des Deux Couronnes"
 nd_sar_dest_two_crowns_desc: "Unissez le nord de l'Italie sous notre bannière en conquérant Milan et Gênes, les joyaux jumeaux de la Lombardie et de la Ligurie."
 nd_sar_dest_march_rome: "Marche sur Rome"
 nd_sar_dest_march_rome_desc: "Achever l'unification de l'Italie en prenant Rome et Naples, forgeant ainsi un grand royaume péninsulaire des Alpes au Mezzogiorno."
 nd_sar.5.t: "Un royaume proclamé"
 nd_sar.5.d: "The crown of Sardinia rests upon our sovereign's brow, and with it comes the weight of centuries. This island has endured Phoenician traders, Roman legions, Vandal raiders, Byzantine governors, and Aragonese overlords, yet through it all, something distinctly Sardinian has survived. Now, for the first time in generations, we stand as masters of our own fate.\n\nThe realm is stable. The question is what we shall build upon this foundation."
 nd_sar.5.a: "Notre destin nous attend."
 nd_sar.6.t: "Les Giudicati restaurés"
 nd_sar.6.d: "Across the Strait of Bonifacio, the harbors of Corsica now fly our banner. The two great islands of the Tyrrhenian Sea are united under one crown for the first time since antiquity. Corsican and Sardinian, bound by shared language roots and Mediterranean kinship, together form a formidable island realm.\n\nWith Corsican timber supplementing our flocks and the wool trade filling our coffers, the ancient dream of the Giudicati (a Sardinian kingdom governed by its own laws and sustained by its own wealth) begins to take tangible shape."
 nd_sar.6.a: "Deux îles, une couronne."
 nd_sar.7.t: "Les routes du sel fleurissent"
 nd_sar.7.d: "Our harbors bustle with commerce. Sardinian salt, drawn from the great pans of Cagliari and Sassari, travels to every corner of the Mediterranean. Banking houses have opened their doors in our ports, and foreign merchants compete for access to our markets.\n\nThis prosperity brings choices. We might invest directly in trade infrastructure (warehouses, quays, and merchant fleets) to maximize the flow of goods. Or we might channel our wealth into institutional reform, building the schools and courts that will make our island a model of enlightened governance."
 nd_sar.7.a: "Remplissez les entrepôts et les caisses."
 nd_sar.7.b: "Investissez dans l’apprentissage et la bonne gouvernance."
 nd_sar.8.t: "Le Parlement des Îles"
 nd_sar.8.d: "From the mountains of Sardinia to the shores of Mallorca, our island commonwealth stretches across the western Mediterranean. The Stamenti of Sardinia, the assemblies of Corsica, and the councils of the Balearics all look to our crown, yet each retains the ancient rights and customs of its people.\n\nWe stand at the apex of a new kind of Mediterranean power: not a continental empire built on conquest, but a commonwealth of free peoples bound by law, trade, and mutual respect. How shall we govern this achievement?"
 nd_sar.8.a: "Une communauté de peuples libres."
 nd_sar.8.b: "Un phare de droit et d’apprentissage."
 nd_sar.9.t: "Le pont vers le continent"
 nd_sar.9.d: "Turin has fallen. The ancient capital of the House of Savoy, with its grand piazzas and Alpine backdrop, is ours. And with Nice secured on the Riviera, we command both slopes of the Maritime Alps.\n\nNo longer merely an island kingdom, Sardinia-Piedmont now straddles the sea and the continent. The road to Italy lies open before us: through the Po Valley, past the spires of Milan, to whatever destiny our arms can seize."
 nd_sar.9.a: "De l'île au continent."
 nd_sar.10.t: "La couronne lombarde"
 nd_sar.10.d: "Milan and Genoa have bent the knee. The richest city in Italy and the greatest port of the Ligurian coast now swell our treasury and our armies. The Iron Crown of Lombardy (that ancient symbol of Italian kingship) is within our grasp.\n\nWith northern Italy secured, our generals debate the next phase. Some advocate seizing the spoils of Lombardy to rebuild and reequip our armies for the final push south. Others counsel patience: consolidate our new crown, build cavalry from Lombard stock, and let our supply lines catch up with our ambitions."
 nd_sar.10.a: "Appuyez sur l’avantage pendant qu’ils tournent."
 nd_sar.10.b: "Consolider la couronne lombarde."
 nd_sar.11.t: "The Eternal City"
 nd_sar.11.d: "Rome. The Eternal City. For a thousand years, every power that has claimed Italy has reached for this prize, and now our banners fly above the Tiber. Naples too has fallen, and with it the Mezzogiorno (the sun-baked south that completes our dominion over the peninsula).\n\nFrom the Alpine passes to the Strait of Messina, from the Adriatic coast to the Tyrrhenian shore, Italy is one. The question now is how this achievement will be remembered: as the work of volunteers in arms and revolutionary fire, or as the work of ministers, secret treaties and the careful management of the great powers."
 nd_sar.11.a: "By the sword of the volunteers!"
 nd_sar.11.b: "By the pen of the ministers."
 STATIC_MODIFIER_NAME_nd_sar_dest_salt_silver: "Commerce du sel et de l'argent"
 STATIC_MODIFIER_DESC_nd_sar_dest_salt_silver: "Le sel et l'argent sardes circulent à travers nos réseaux commerciaux étendus, enrichissant le royaume mais tirant des ressources de l'entretien militaire."
 STATIC_MODIFIER_NAME_nd_sar_dest_institutional_reform: "Réforme institutionnelle"
 STATIC_MODIFIER_DESC_nd_sar_dest_institutional_reform: "Des réformes institutionnelles progressives modernisent notre royaume insulaire, même si le fardeau bureaucratique pèse sur l’efficacité en temps de guerre."
 STATIC_MODIFIER_NAME_nd_sar_dest_free_peoples: "Commonwealth des peuples libres"
 STATIC_MODIFIER_DESC_nd_sar_dest_free_peoples: "Notre Commonwealth insulaire gouverne par le consentement et le droit partagé, réduisant ainsi le séparatisme et accueillant divers peuples sous une seule couronne tolérante."
 STATIC_MODIFIER_NAME_nd_sar_dest_beacon_learning: "Phare d'apprentissage"
 STATIC_MODIFIER_DESC_nd_sar_dest_beacon_learning: "Notre royaume insulaire devient un centre d’érudition méditerranéenne, ses bibliothèques et ses tribunaux attirant des érudits de tous les rivages."
 STATIC_MODIFIER_NAME_nd_sar_dest_lombardy_spoils: "Butin de Lombardie"
 STATIC_MODIFIER_DESC_nd_sar_dest_lombardy_spoils: "La richesse de la Lombardie alimente notre machine de guerre, avec de nouvelles recrues et des renforts moins chers pour soutenir la marche vers le sud."
 STATIC_MODIFIER_NAME_nd_sar_dest_lombard_crown: "Poids de la couronne de fer"
 STATIC_MODIFIER_DESC_nd_sar_dest_lombard_crown: "La Couronne de Fer de Lombardie confère une légitimité mais exige une consolidation, alors que les nouvelles levées de cavalerie et les lignes de ravitaillement mettent à rude épreuve le trésor."
 STATIC_MODIFIER_NAME_nd_sar_dest_garibaldi_sword: "The Volunteers' Sword"
 STATIC_MODIFIER_DESC_nd_sar_dest_garibaldi_sword: "Revolutionary fervor and volunteers in arms forge national unity through direct action, integrating conquered peoples by the force of shared ideals."
 STATIC_MODIFIER_NAME_nd_sar_dest_cavour_pen: "The Ministers' Pen"
 STATIC_MODIFIER_DESC_nd_sar_dest_cavour_pen: "Diplomatic mastery and loyal subjects sustain the new Italian state, as statecraft and naval investment project power across the Mediterranean."
 nd_sar_palazzo_stamenti: "Palais des Stamenti"
 nd_sar_palazzo_stamenti_desc: "Le grand palais parlementaire du Commonwealth insulaire, où les élus de Sardaigne, de Corse et des Baléares délibèrent sur les lois qui régissent un peuple méditerranéen libre."
 nd_sar_palazzo_stamenti_maintenance: "Entretien parlementaire"
 nd_sar_palazzo_stamenti_maintenance_desc: "Les opérations quotidiennes du parlement insulaire nécessitent du papier pour la législation, du tissu fin pour les cérémonies et des livres pour la bibliothèque parlementaire."
 nd_sar_palazzo_madama: "Palais Madame"
 nd_sar_palazzo_madama_desc: "The seat of the kingdom's senate in Turin. This Roman gate turned baroque palace stands for the change of an island kingdom into the government of a united Italy."
 nd_sar_palazzo_madama_maintenance: "Administration du Sénat"
 nd_sar_palazzo_madama_maintenance_desc: "Le fonctionnement du Sénat nécessite du papier pour la législation, des outils pour entretenir le grand bâtiment et un mobilier digne de la dignité de l'État italien."
 sar_carta_de_logu_bureaucracy: "Carte du Logu"
 sar_carta_de_logu_bureaucracy_desc: "Eleonora d'Arborea a promulgué la Carta de Logu en 1392, un code de 198 chapitres en langue vernaculaire sarde - afin que ceux qu'elle gouvernait puissent le lire. Les femmes pouvaient hériter et refuser le mariage ; les forêts et les cours d'eau étaient protégés de la surexploitation ; l'accusé pouvait citer dix témoins ; la torture était interdite contre ceux dont la réputation était irréprochable. Les conquérants aragonais ont adopté le code en bloc, et il est resté la loi de la Sardaigne jusqu'à ce que la codification de Charles Félix en 1827 le remplace finalement."
 sar_stamenti_bureaucracy: "Prime Voci"
 sar_stamenti_bureaucracy_desc: "Each of the three estates of the kingdom has a first voice. The archbishop of Cagliari speaks for the clergy, the marquis of Laconi for the barons, and the first juror of Cagliari for the royal towns. The king calls a parliament about once in ten years. Between the sessions the first voices summon their estates, carry grievances to the viceroy and see that the grant voted to the crown is levied as it was agreed."
 sar_curatoria_bureaucracy: "Système de conservation"
 sar_curatoria_bureaucracy_desc: "Héritées par les Giudicati de la structure thématique byzantine tardive, les curatoria divisaient chaque judicate en districts autosuffisants - treize rien que pour Cagliari - chacun supervisé par un conservateur qui répondait au iudike plutôt qu'aux seigneurs féodaux. L'attribution des terres, les prélèvements militaires et la justice locale ont été confiés à ces personnes nommées par la couronne. Même après que les Aragonais aient imposé les tenures féodales, la curatorie a persisté comme encontradas, gardant la juridiction royale parallèle aux tribunaux baronnials."
 sar_viceregal_court_bureaucracy: "Tribunal vice-royal de Cagliari"
 sar_viceregal_court_bureaucracy_desc: "À partir de 1325, les Aragonais gouvernèrent la Sardaigne par l'intermédiaire d'un vice-roi siégeant à Cagliari, détenant l'audiencia, le patrimoine royal et la haute magistrature au nom d'un roi absent. Les vice-rois tridentins comme Cardona et Moncada centralisèrent les fermes fiscales et pressèrent les fueros castillans contre la coutume locale. L'institution survécut à l'Aragon, à l'Espagne et à l'intermède autrichien, et entre de bonnes mains, elle dirigea le royaume ; entre des mains vénielles, il est devenu proverbial pour la vente de fonctions et la corruption."
 sar_carruba_salt_monopoly_bureaucracy: "Monopole Royal du Sel"
 sar_carruba_salt_monopoly_bureaucracy_desc: "Les salines de Molentargius à l'extérieur de Cagliari et les salines de Sassari alimentent les marchés méditerranéens depuis l'Antiquité, mais c'est la couronne espagnole qui a codifié les regalia salis en tant que monopole royal au XVIe siècle. Les entrepreneurs de la Couronne expédiaient le sel sous la gabella, les carruba payaient en nature : lorsqu'ils étaient honnêtement cultivés, ils construisaient des galères ; lorsqu'elle fut cédée à des courtisans, elle entraîna la contrebande, les troubles paysans et les grandes révoltes du sel qui ébranlèrent la Sardaigne au XVIIIe siècle."
 AUTO_MODIFIER_NAME_nd_sar_bureaucracy_authority: "Autorité bureaucratique sarde"
 AUTO_MODIFIER_DESC_nd_sar_bureaucracy_authority: "The kingdom keeps the offices its rulers left it: the Carta de Logu, the first voices of the estates, the curatorie, the viceregal court of Cagliari and the royal salt monopoly. Sardinia can sustain three more standing institutions."
