l_french:
 STATIC_MODIFIER_NAME_nd_adu_ornament_of_the_world: "Ornement du monde"
 STATIC_MODIFIER_DESC_nd_adu_ornament_of_the_world: "Al-Andalus brille comme un phare d'apprentissage où les érudits musulmans, chrétiens et juifs échangent librement leurs connaissances, et les bibliothèques de Cordoue rivalisent avec n'importe qui dans le monde."
 STATIC_MODIFIER_NAME_nd_adu_sword_of_the_maghreb: "Épée du Maghreb"
 STATIC_MODIFIER_DESC_nd_adu_sword_of_the_maghreb: "Forgés dans les feux du djihad, les guerriers d'Al-Andalus marchent sous la bannière d'une foi purifiée, leur cavalerie berbère et leurs ghazis frontaliers sèment la peur à travers la péninsule."
 nd_adu.1.t: "La restauration d'Al-Andalus"
 nd_adu.1.d: "The crescent banner flies once more over all of Iberia. Where Christian kingdoms once carved up the peninsula, a united Islamic state has risen from the ashes of the taifas. The memory of the Caliphate of Cordoba, when this land was the most learned and prosperous in all of Europe, burns bright in every scholar and soldier.\n\nBut Al-Andalus faces a choice that has defined it since the days of the Umayyads. Will we revive the tradition of the convivencia, where mosques stood beside synagogues and churches, where Ibn Rushd debated Aristotle and Maimonides found refuge under Muslim rule? Or will we follow the path of the Almohads and Almoravids, who crossed the strait with armies of disciplined Berber cavalry and built an empire through military piety and religious orthodoxy?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_adu.1.a: "Laissez Cordoue resplendir à nouveau comme l'ornement du monde."
 nd_adu.1.b: "L'épée du Maghreb unira les fidèles."
 STATIC_MODIFIER_NAME_nd_adu_house_of_wisdom_west: "Scholars of Every Nation"
 STATIC_MODIFIER_DESC_nd_adu_house_of_wisdom_west: "Berber, Slav, convert and Arab are judged by what they know. The courts of Al-Andalus fill with scholars of every origin."
 nd_adu.2.t: "The Letter from Denia"
 nd_adu.2.d: "A letter is passing from hand to hand among the secretaries. Its author is Ibn Gharsiya, born a Basque Christian, taken as a child and raised a Muslim, now a poet at the court of Denia. He writes that the Arabs are masters at describing camels, and that philosophy, astronomy and the measuring of the earth belong to the peoples they conquered. Seven scholars have written replies. Nobody has asked for his head.\n\nThe quarrel is an old one in Al-Andalus. Berbers carried the conquest, Slavs commanded the palace guard and the sons of converted natives fill the chanceries, yet the old Arab families still count a man's descent before they count his learning. A realm that means to hold the whole peninsula cannot afford the habit."
 nd_adu.2.a: "A man is what he knows."
 STATIC_MODIFIER_NAME_nd_adu_arabic_scholarship: "Tradition savante arabe"
 STATIC_MODIFIER_DESC_nd_adu_arabic_scholarship: "Al-Andalus préserve et étend la tradition intellectuelle arabe, produisant des œuvres originales qui côtoient les plus grandes réalisations de Bagdad et du Caire."
 STATIC_MODIFIER_NAME_nd_adu_universal_knowledge: "Échange universel de connaissances"
 STATIC_MODIFIER_DESC_nd_adu_universal_knowledge: "Les maisons de traduction d'Al-Andalus servent de pont entre les civilisations, transmettant la sagesse des anciens à tous ceux qui voudraient apprendre."
 nd_adu.3.t: "Mouvement de traduction"
 nd_adu.3.d: "The translation houses of Al-Andalus have become the intellectual crossroads of the world. In Toledo, Cordoba, and Seville, Arabic texts on medicine, astronomy, mathematics, and philosophy are being rendered into Latin, Hebrew, and Romance languages. The works of al-Zahrawi on surgery, al-Zarqali on astronomical instruments, and Ibn Rushd on Aristotelian philosophy are reshaping the intellectual landscape far beyond the borders of the Islamic world.\n\nBut a question divides our scholars. Should we preserve our intellectual tradition in its Arabic purity, continuing to produce original works that advance human knowledge? Or should we embrace the role of universal translator, making all knowledge accessible across linguistic and religious boundaries, even at the cost of diluting our distinctive scholarly identity?"
 nd_adu.3.a: "Notre tradition parle d'elle- : même construireons-la."
 nd_adu.3.b: "La connaissance appartient à toute l’humanité."
 STATIC_MODIFIER_NAME_nd_adu_alhambra_splendor: "Splendeur de l'Alhambra"
 STATIC_MODIFIER_DESC_nd_adu_alhambra_splendor: "Le complexe de palais de l'Alhambra témoigne du génie artistique de la civilisation islamique, ses délicates muqarnas et arabesques géométriques inspirant l'émerveillement à travers le monde."
 nd_adu.4.t: "La splendeur de l'Alhambra"
 nd_adu.4.d: "High above the city of Granada, against the backdrop of the Sierra Nevada, the Alhambra rises like a vision from paradise. Its walls of rammed earth conceal gardens of impossible beauty, the Court of the Lions with its twelve marble beasts guarding a fountain of crystal water, the Hall of the Ambassadors where muqarnas ceilings represent the seven heavens, and the Generalife where terraced gardens cascade down the hillside in a symphony of water and stone.\n\nThis is not merely a palace. It is the physical embodiment of the Andalusi ideal, that art, architecture, and engineering can transform raw earth into something that makes the heart ache with beauty. Every surface is covered in geometric arabesques, every fountain is an exercise in hydraulic engineering, every garden a masterwork of irrigation science. The Alhambra proves that Al-Andalus can create wonders to rival any civilization on earth."
 nd_adu.4.a: "Que cette splendeur inspire notre peuple depuis des générations."
 nd_adu_jinete_tradition: "Zanata Horsemanship"
 nd_adu_jinete_tradition_desc: "The riders of Al-Andalus learned their craft from the Zanata Berbers who crossed the Strait to serve its rulers: short stirrups, a light saddle, and javelins hurled from the saddle at full gallop."
 nd_adu_ribat_frontier: "Défense de la frontière du Ribat"
 nd_adu_ribat_frontier_desc: "Les ribats gardent les frontières des fidèles, combinant les murs de la forteresse avec la discipline monastique."
 nd_adu_acequia_irrigation: "Irrigation Acequia"
 nd_adu_acequia_irrigation_desc: "Les systèmes de canaux acétiques d'Al-Andalus transforment les terres arides en jardins, appliquent des siècles de connaissances hydrauliques islamiques."
 nd_adu_islamic_jurisprudence: "Maliki Jurists of Cordoba"
 nd_adu_islamic_jurisprudence_desc: "Les juristes d'Al-Andalus ont développé une tradition sophistiquée de fiqh, s'appuyant sur l'école Maliki pour créer une gouvernance ordonnée."
 nd_adu_urban_civilization: "Civilisation urbaine"
 nd_adu_urban_civilization_desc: "Les villes d'Al-Andalus ont établi la norme pour la vie urbaine, avec des bains publics, des rues pavées et de l'eau courante."
 nd_adu_mosque_network: "Réseau de mosquées"
 nd_adu_mosque_network_desc: "Un réseau de mosquées en congrégation ancre la vie religieuse à travers Al-Andalus, de la grande mosquée de Cordoue aux humbles maisons de prière du village."
 nd_adu_zenata_warriors: "Garde à cheval Zenata"
 nd_adu_zenata_warriors_desc: "La cavalerie berbère d'élite des tribus Zenata forme le noyau du cheval lourd andalou, discipliné et redoutable dans la charge."
 nd_adu_madrasa_tradition: "Schools of al-Hakam"
 nd_adu_madrasa_tradition_desc: "The caliph al-Hakam II opened twenty-seven schools in Cordoba where the children of the poor were taught without fee by masters on his payroll. Andalusi masters begin with Arabic, verse and a fair hand before the Qur'an, as Ibn Khaldun noted of them."
 nd_adu_mediterranean_trade: "Qirad Partnerships"
 nd_adu_mediterranean_trade_desc: "An investor entrusts money or goods to a merchant, who sails with them and brings back a share of the profit. The contract is drawn up by the notaries of the town from the formularies of Cordoba, and it lets Andalusi capital travel farther than its owners."
 nd_adu_convivencia: "Equals of the Arabs"
 nd_adu_convivencia_desc: "Ibn Gharsiya, a Basque convert at the court of Denia, wrote in the 1050s that the peoples the Arabs had conquered were their equals, and their betters in learning. Berbers, Slavs and the converted natives of the peninsula hold office beside the old Arab families."
 nd_adu_naval_arsenal: "Arsenal naval"
 nd_adu_naval_arsenal_desc: "Les dar al-sina'a d'Almeria et d'Algésiras produisent des galères de guerre qui commandent la Méditerranée occidentale."
 nd_adu_caliphal_administration: "Governors of the Kuras"
 nd_adu_caliphal_administration_desc: "The Umayyads divided Al-Andalus into kuras, each under a governor named and recalled by Cordoba, and into three marches under commanders on the frontier. Tax registers and judges answer to the capital, not to the governor."
 nd_adu_ghazi_warriors: "Guerriers Ghazis"
 nd_adu_ghazi_warriors_desc: "Les ghazis d'Al-Andalus sont des guerriers frontaliers qui allient zèle religieux et prouesse sur le champ de bataille, défendant le Dar al-Islam."
 nd_adu_alcazar_fortification: "Fortification d'Alcazar"
 nd_adu_alcazar_fortification_desc: "Les alcazars d'Al-Andalus sont des complexes de palais fortifiés qui servent de sièges du pouvoir et de bastions de défense."
 nd_adu_translation_movement: "Mouvement de traduction"
 nd_adu_translation_movement_desc: "La traduction systématique des œuvres savantes arabes en latin et en hébreu transforme Al-Andalus en pont intellectuel entre les civilisations islamiques et chrétiennes, tandis que les céramiques lustres mettent en valeur la culture matérielle née de cet échange."
 nd_adu_silk_industry: "industrie soyère"
 nd_adu_silk_industry_desc: "Les ateliers de soie de Grenade et d'Almeria produisent les meilleurs textiles d'Europe, leurs damas et leurs taffetas pris à travers la Méditerranée."
 nd_adu_diplomatic_survival: "Maîtrise diplomatique"
 nd_adu_diplomatic_survival_desc: "Des siècles de navigation entre de puissants voisins ont permis aux diplomates andalous de maîtriser l'art de la survie par la négociation."
 nd_adu_port_cities: "Keys of the Strait"
 nd_adu_port_cities_desc: "Algeciras, Gibraltar, Tarifa and Ceuta are the keys of the Strait. Whoever garrisons them decides which ships pass between the two seas and what they pay for it."
 nd_adu_alhambra_legacy: "Héritage de l'Alhambra"
 nd_adu_alhambra_legacy_desc: "La tradition architecturale de l'Alhambra inspire une floraison de l'art et de l'architecture islamique à travers Al-Andalus."
 nd_adu_corsair_tradition: "Corsaire traditionnel"
 nd_adu_corsair_tradition_desc: "Des corsaires nasrides rapides patrouillent le détroit de Gibraltar et la Méditerranée occidentale, protégeant les routes commerciales et attaquant les navires ennemis."
 nd_adu_fiscal_innovation: "Innovation fiscale"
 nd_adu_fiscal_innovation_desc: "Al-Andalus développe des instruments fiscaux retenus et des marchés réglementés, avec le souk au cœur de la vie commerciale de chaque ville."
 nd_adu_waqf_system: "Fonds de dotation Waqf"
 nd_adu_waqf_system_desc: "L'institution islamique du waqf, les dotations caritatives pour les travaux publics, financent la construction d'hôpitaux, d'écoles et d'infrastructures."
 nd_adu_military_reform: "Fusion militaire berbéro-andalouse"
 nd_adu_military_reform_desc: "Les traditions militaires des dynasties berbères d'Afrique du Nord fusionnent avec les techniques ibériques pour créer un art de la guerre andalou distinctif, produisant des épéistes et des armuriers célèbres."
 nd_adu_taifa_governance: "Gouvernance de Taifa"
 nd_adu_taifa_governance_desc: "Tirant les leçons de la fragmentation des royaumes de la taifa, Al-Andalus développe des institutions pour prévenir le séparatisme provincial."
 nd_adu_centralized_sultanate: "Sultanat centralisé"
 nd_adu_centralized_sultanate_desc: "Le sultan consolide le contrôle direct sur les provinces, remplaçant les gouverneurs semi-autonomes par des administrateurs royaux."
 nd_adu_infrastructure_renewal: "Renouvellement des infrastructures"
 nd_adu_infrastructure_renewal_desc: "Un programme de travaux publics renouvelle l'appareil administratif d'Al-Andalus, en établissant des chancelleries provinciales pour coordonner la gouvernance dans tout le royaume."
 nd_adu_maritime_expansion: "The Adventurers of Lisbon"
 nd_adu_maritime_expansion_desc: "Al-Idrisi tells of a company of Lisbon men, the Adventurers, who fitted out a ship for the Sea of Darkness and came home with word of islands. Andalusi yards now build for the ocean, and their ships stay out longer and are refitted faster."
 nd_adu_standing_army: "armée permanente"
 nd_adu_standing_army_desc: "Al-Andalus remplace le recours aux prélèvements tribaux et aux volontaires ghazis par une armée professionnelle permanente d'infanterie disciplinée sous commandement royal direct."
 nd_adu_majlis_council: "Conseil du Majlis"
 nd_adu_majlis_council_desc: "Un conseil consultatif de notables conseille le souverain sur les questions de droit et de gouvernance, en équilibrant l'autorité royale avec le consensus communal."
 nd_adu_islamic_enlightenment: "Paper of Shatiba"
 nd_adu_islamic_enlightenment_desc: "Shatiba made the first paper in the west of Europe, and al-Idrisi wrote that it was sent east and west. The mills on the Albaida turn again, and where paper is cheap, books and the men who read them multiply."
 nd_adu_industrial_modernization: "Modernisation industrielle"
 nd_adu_industrial_modernization_desc: "Al-Andalus adapts modern manufacturing techniques while building on its centuries-old tradition of skilled artisanship.\n\n#italic Available in: $nd_adu_dar_al_tiraz$#!"
 nd_adu_modern_army: "Armée moderne"
 nd_adu_modern_army_desc: "L'armée andalouse adopte la technologie moderne des exercices, des formations et des armes à feu pour correspondre aux armées de l'époque."
 nd_adu_andalusi_renaissance: "The Nawba Written Down"
 nd_adu_andalusi_renaissance_desc: "The nawba is the suite of songs that tradition traces to Ziryab's school in Cordoba. Around 1789 Muhammad al-Ha'ik of Tetuan wrote down the words of the eleven still sung, and the music of Al-Andalus is taught from his book in every city of the realm."
 nd_adu_urban_renewal: "Reconstruction urbaine"
 nd_adu_urban_renewal_desc: "Les grandes villes d'Al-Andalus connaissent une expansion et une modernisation, attirant des migrants et des marchands du monde musulman."
 nd_adu_global_trade_mastery: "Maîtrise du commerce mondial"
 nd_adu_global_trade_mastery_desc: "Al-Andalus tire partie de sa position à la jonction de l'Atlantique et de la Méditerranée pour dominer les réseaux commerciaux mondiaux."
 a_nd_adu_jinete: "Zanata Light Horse"
 a_nd_adu_jinete_desc: "Berber riders of the Zanata tribes and the Andalusis who ride as they do, with javelins and the leather adarga shield. They wheel, throw and turn away before a mailed line can close."
 a_nd_adu_zenata_guard: "Garde à cheval Zenata"
 a_nd_adu_zenata_guard_desc: "Cavalerie lourde d'élite issue des tribus berbères Zenata, troupes de choc blindées et disciplinées qui forment le noyau du bras monté andalou."
 a_nd_adu_ghazi: "Ghazi"
 a_nd_adu_ghazi_desc: "Les guerriers saints frontaliers d'Al-Andalus qui se battent pour la foi, combinant zèle religieux et habileté meurtrière aux armes sur un terrain accidenté."
 a_nd_adu_nizam_infantry: "Nizam al-Jadid"
 a_nd_adu_nizam_infantry_desc: "L'infanterie professionnelle modernisée s'est entraînée aux techniques européennes, formant l'épine dorsale de l'armée permanente andalouse réformée."
 n_nd_adu_war_galley: "Cuisine de guerre andalouse"
 n_nd_adu_war_galley_desc: "Galère de guerre méditerranéenne construite dans le dar al-sina'a d'Almeria, plus grande et plus rapide que les galères standards, conçues pour le contrôle de la Méditerranée occidentale."
 n_nd_adu_nasrid_corsair: "Corsaire nasride"
 n_nd_adu_nasrid_corsair_desc: "Navire de raid léger rapide de tradition navale nasride, conçu pour chasser la marine marchande et protéger le détroit de Gibraltar."
 nd_adu_madrasa: "Kuttab"
 nd_adu_madrasa_desc: "A school beside the mosque where a salaried master teaches the children of the quarter to read, write and recite, without fee for the poor."
 nd_adu_acequia: "Acéquia"
 nd_adu_acequia_desc: "Un système sophistiqué de canaux d'irrigation acheminant l'eau des ruisseaux de montagne vers les champs et les jardins, permettant une agriculture intensive."
 nd_adu_alcazar: "Alcazar"
 nd_adu_alcazar_desc: "Un complexe de palais fortifié servant à la fois de centre administratif et de forteresse défensive, construit dans le style andalou distinctif."
 nd_adu_dar_al_tiraz: "Dar al-Tiraz"
 nd_adu_dar_al_tiraz_desc: "Un atelier textile royal produisant les meilleurs tissus de soie d'Europe, des taffetas, des damas et des brocarts pris à travers la Méditerranée."
 nd_adu_funduq: "Notaries' Row"
 nd_adu_funduq_desc: "The shops beside the great mosque where sworn notaries draw up partnerships, sales and freight contracts in the forms set down by Ibn al-Attar of Cordoba."
 nd_adu_ribat: "Ribat"
 nd_adu_ribat_desc: "Un monastère-forteresse frontale combinant défense militaire et dévotion religieuse, abritant des guerriers engagés à défendre les frontières de l'islam."
 nd_adu_hammam: "Hammam"
 nd_adu_hammam_desc: "Un bain public offrant hygiène, socialisation et purification rituelle, pierre angulaire de la culture urbaine andalouse."
 nd_adu_dar_al_sinaa: "Dar al-Sina'a"
 nd_adu_dar_al_sinaa_desc: "Un arsenal naval d'État produisant des galères de guerre et des navires marchands, épine dorsale de la puissance maritime andalouse."
 nd_adu_waqf: "Fondation Waqf"
 nd_adu_waqf_desc: "Une dotation caritative islamique qui finance à perpétuité des hôpitaux, des écoles et des travaux publics au profit de la communauté."
 nd_adu_lusterware_kiln: "Quatre à lustre"
 nd_adu_lusterware_kiln_desc: "Un atelier de céramique produisant le célèbre lustre andalou, poterie émaillée chatoyante à l'iridescence d'or et de cuivre, prise de Séville au Caire."
 nd_adu_forge: "Forge d'Andalousie"
 nd_adu_forge_desc: "Une forge d'armes dans la tradition de l'acier de Tolède, où les maîtres épéistes produisent des lames réputées à travers la Méditerranée pour leur force et leur flexibilité."
 nd_adu_suq: "Souks"
 nd_adu_suq_desc: "Un marché central et un bazar couvert où marchands, artisans et collecteurs d'impôts convergent dans le cœur commercial de chaque ville andalouse."
 nd_adu_diwan: "Diwan"
 nd_adu_diwan_desc: "Une chancellerie administrative où les scribes et les bureaucrates gèrent les dossiers, la correspondance et les comptes fiscaux du royaume."
 nd_adu_madrasa_upkeep: "Masters' Stipends"
 nd_adu_madrasa_upkeep_desc: "Paper, books, and candles for the school, bought from the endowment that pays its master."
 nd_adu_acequia_maintenance: "Entretien du canal"
 nd_adu_acequia_maintenance_desc: "La pierre, le bois et les outils permettent aux canaux d'acequia de circuler proprement."
 nd_adu_alcazar_garrison: "Garde du palais"
 nd_adu_alcazar_garrison_desc: "Les armes, la pierre et l'armure de cuir maintiennent l'état de préparation défensive de l'alcazar."
 nd_adu_silk_weaving: "Tissage de la soie"
 nd_adu_silk_weaving_desc: "La soie brute et les colorants sont transformés en le meilleur tissu d'Europe."
 nd_adu_mechanized_weaving: "Tissage mécanisé"
 nd_adu_mechanized_weaving_desc: "Les machines modernes augmentent la production de soie tout en incorporant des mélanges de coton pour les marchés plus grands."
 nd_adu_funduq_operations: "Drawing of Contracts"
 nd_adu_funduq_operations_desc: "Paper for the deeds, wax for the seals and cloth for the awnings keep the notaries at their benches."
 nd_adu_ribat_upkeep: "Garnison frontière"
 nd_adu_ribat_upkeep_desc: "Les armes, les provisions, les harnais de cuir et les outils soutiennent les moines guerriers du ribat."
 nd_adu_hammam_operations: "Opérations de la salle de bain"
 nd_adu_hammam_operations_desc: "Le bois, les carreaux d'argile et le charbon maintiennent le hammam chauffé et entretenu."
 nd_adu_shipyard_maintenance: "Maintenance navale"
 nd_adu_shipyard_maintenance_desc: "Le bois, le fer et le goudron soutiennent les opérations de construction navale de l'arsenal."
 nd_adu_waqf_endowment: "Œuvres caritatives"
 nd_adu_waqf_endowment_desc: "Le grain, le tissu et le papier soutiennent la mission caritative et éducative du waqf."
 nd_adu_lusterware_production: "Production de Lustreware"
 nd_adu_lusterware_production_desc: "L'argile et les colorants métalliques sont cuits dans des céramiques émaillées irisées prises dans toute la Méditerranée."
 nd_adu_sword_forging: "Forge d'épée"
 nd_adu_sword_forging_desc: "Le fer et le charbon alimentent les forges qui produisent des lames andalouses dans la célèbre tradition de Tolède."
 nd_adu_suq_operations: "Opérations de marché"
 nd_adu_suq_operations_desc: "Le tissu, le sel et le papier soutiennent les opérations commerciales du marché central."
 nd_adu_diwan_administration: "Opérations de la Chancellerie"
 nd_adu_diwan_administration_desc: "Le papier, les livres, le tissu fin pour les fonctionnaires et le mobilier soutiennent les dossiers et la correspondance de la chancellerie."
 levy_nd_adu_jinete: "Zanata Horse Levy"
 levy_nd_adu_jinete_desc: "Zanata light horse raised from the military households and noble estates of Al-Andalus."
 levy_nd_adu_ghazi: "Bénévoles Ghazi"
 levy_nd_adu_ghazi_desc: "Des guerriers saints frontaliers appelés à défendre les frontières de la foi."
 nd_adu_formed_tt: "Al-Andalus a été formé"
 nd_adu_path_a_tt: "Choisissez l'ornement du monde"
 nd_adu_path_b_tt: "Choisissez l'épée du Maghreb"
 nd_adu_dest_toledo_developed_tt: "We own #bold Toledo#! and its development is at least #bold 39#!"
 nd_adu_dest_cordoba_developed_tt: "We own #bold Cordoba#! and its development is at least #bold 64#!"
 nd_adu_destiny: "Destin d'Al-Andalus"
 nd_adu_destiny_desc: "Avec l'Ibérie unie sous le croissant, Al-Andalus se trouve à la croisée des chemins entre l'érudition et la conquête."
 nd_adu_dest_knowledge: "Les connaissances restaurées"
 nd_adu_dest_knowledge_desc: "Reconstruisez les bibliothèques légendaires de Cordoue et attirez les chercheurs du monde entier. Nécessite l'institution bancaire, la soie sur le marché des capitaux et 1 000 pièces d'or."
 nd_adu_dest_translators: "Pont des civilisations"
 nd_adu_dest_translators_desc: "Extend Andalusi intellectual influence into Occitania, and build up Toledo, where Arabic learning was once put into Latin, as the city of the translators. Requires ownership of Toulouse, the printing press institution, Toledo at 39 development, and 2,000 gold."
 nd_adu_dest_golden_age: "Le deuxième âge d'or"
 nd_adu_dest_golden_age_desc: "Surpass even the Caliphate of Cordoba by building a universal civilization spanning the Mediterranean. Cordoba was the greatest city of the west under the caliphs, and is made so again, with as many schools across the realm as al-Hakam opened in his capital. Requires ownership of Palermo, a Kuttab in 27 places, prestige of 75, 3,000 gold, and Cordoba at 64 development."
 nd_adu_dest_reconquest: "Le Maghreb récupéré"
 nd_adu_dest_reconquest_desc: "Traversez le détroit et récupérez le Maghreb pour Al-Andalus. Nécessite la propriété de Fès et Tlemcen, et une armée de 30 000 hommes."
 nd_adu_dest_caliphate: "Le Califat restauré"
 nd_adu_dest_caliphate_desc: "Unissez le monde islamique occidental sous la bannière d’Al-Andalus. Nécessite la propriété de Tunis et de Marrakech, une armée de 50 000 hommes et un prestige de 50."
 nd_adu_dest_empire: "Empire du Croissant"
 nd_adu_dest_empire_desc: "Construisez un empire qui s'étend de l'Atlantique au Nil. Nécessite la propriété de Tripoli et du Caire, une armée de 75 000 hommes, un prestige de 75 et 3 000 pièces d'or."
 nd_adu.5.t: "Le destin d'Al-Andalus"
 nd_adu.5.d: "Avec la péninsule sécurisée et notre royaume consolidé, les érudits de Cordoue et les guerriers de la frontière se tournent tous deux vers nous pour se diriger. Le chemin que nous avons choisi lors de notre fondation commence maintenant à porter ses fruits. Que ce soit par la diffusion du savoir ou la marche des armées, Al-Andalus marquera le monde."
 nd_adu.5.a: "Notre destin nous attend."
 nd_adu.6.t: "Les connaissances restaurées"
 nd_adu.6.d: "Les grandes bibliothèques de Cordoue sont en cours de reconstruction. Les érudits de Bagdad à Byzance se rendent dans nos tribunaux, attirés par la promesse de mécénat et la liberté de rechercher la vérité où qu'elle mène. Les maisons bancaires d'Al-Andalus financent des expéditions pour récupérer les manuscrits perdus, tandis que les marchands de soie transportent non seulement du tissu mais aussi des idées le long des routes commerciales. La tradition intellectuelle qui faisait autrefois de cette terre la merveille du monde renaît."
 nd_adu.6.a: "Que les lampes de l’apprentissage brûlent à nouveau."
 nd_adu.7.t: "Le pont des civilisations"
 nd_adu.7.d: "Our scholars have established a presence in Toulouse and the cities of Occitania, creating a corridor of intellectual exchange between the Islamic and Christian worlds. Arabic texts on astronomy, medicine, and philosophy flow northward, while European innovations in engineering and navigation flow south. Al-Andalus stands as the indispensable bridge between civilizations.\n\nBut this bridge can be used in different ways. Some argue we should leverage our position as translators and mediators to extend our diplomatic influence, absorbing the peoples we encounter into our cosmopolitan civilization. Others say we should use this moment to invest in the arts and beautification of our realm, making Al-Andalus a paradise that the world envies."
 nd_adu.7.a: "Nous serons le pont qui relève tous les peuples."
 nd_adu.7.b: "Construisons un paradis digne de notre savoir."
 nd_adu.8.t: "Le deuxième âge d'or"
 nd_adu.8.d: "It is done. From the pillars of Cordoba to the mosaics of Palermo, from the vineyards of Toulouse to the libraries of Valencia, Al-Andalus has built a civilization that rivals the greatest the world has ever known. Our scholars have not merely preserved ancient knowledge. They have surpassed it, making discoveries in optics, chemistry, and medicine that the ancients never dreamed of.\n\nThe question now is how to crown this achievement. Shall we formalize our academies into a universal institution of learning, open to all faiths and nations, that will shape the intellectual future of humanity? Or shall we turn inward, perfecting the gardens and palaces of our realm until Al-Andalus itself becomes a work of art, a paradise on earth that inspires wonder for a thousand years?"
 nd_adu.8.a: "Fondé l'Académie Universelle des Sciences."
 nd_adu.8.b: "Construisez le jardin du paradis terrestre."
 nd_adu.9.t: "Le Maghreb récupéré"
 nd_adu.9.d: "Les armées d'Al-Andalus ont traversé le détroit et planté la bannière à Fès et Tlemcen. La même route que les Almoravides et les Almohades ont empruntée vers le nord pour sauver l'Ibérie musulmane a maintenant été inversée, les Andalous sont venus au sud pour unir le Maghreb sous leur domination. Les tribus berbères qui fournissaient autrefois la cavalerie de choc de l'islam ibérique prêtent maintenant allégeance au sultan de Cordoue. La Méditerranée occidentale commence à prendre le caractère d'un lac andalou."
 nd_adu.9.a: "Le détroit est à nous. Allons de l'avant."
 nd_adu.10.t: "Le Califat restauré"
 nd_adu.10.d: "From Marrakesh to Tunis, from the Atlas Mountains to the shores of Iberia, the western Islamic world is united under the banner of Al-Andalus. What the Umayyads began in Cordoba, what the Almohads attempted from Marrakesh, has finally been achieved, a single caliphate ruling over all the lands of the Muslim West.\n\nBut the character of this caliphate remains to be determined. Some urge us to channel the fervor of our ghazi warriors, maintaining the martial spirit that won us this empire and preparing for further conquests. Others counsel consolidation, extracting tribute from our vast domains and building the administrative apparatus needed to govern an empire of this size."
 nd_adu.10.a: "L'épée de la foi n'est jamais gagnée."
 nd_adu.10.b: "Laissez la richesse de l’empire couler dans notre trésorerie."
 nd_adu.11.t: "Empire du Croissant"
 nd_adu.11.d: "The banner of Al-Andalus flies over Cairo. The pyramids and the Alhambra, the libraries of Cordoba and the mosques of Kairouan, the straits of Gibraltar and the mouth of the Nile: all are united under a single sultan. Not since the early Umayyads has any Muslim ruler commanded such a vast and diverse empire in the west.\n\nHow shall we rule this empire? As the Sultan of Sultans, a military hegemon whose armies can march from the Atlantic to the Red Sea? Or as the Western Caliph, a maritime power whose fleets command the Mediterranean and whose diplomatic reach extends to every port from Lisbon to Alexandria?"
 nd_adu.11.a: "Nous sommes le sultan des sultans."
 nd_adu.11.b: "Nous sommes le Califat occidental."
 STATIC_MODIFIER_NAME_nd_adu_dest_intellectual_bridge: "Pont intellectuel"
 STATIC_MODIFIER_DESC_nd_adu_dest_intellectual_bridge: "Al-Andalus sert de pont intellectuel entre les civilisations, ses érudits traduisant et transmettant des connaissances qui remodèlent le monde."
 STATIC_MODIFIER_NAME_nd_adu_dest_patron_of_arts: "Patronne des Arts"
 STATIC_MODIFIER_DESC_nd_adu_dest_patron_of_arts: "Le mécénat royal transforme Al-Andalus en un paradis d'architecture, de poésie et de musique, bien qu'un tel raffinement se fasse au prix de la vigueur martiale."
 STATIC_MODIFIER_NAME_nd_adu_dest_universal_academy: "Académie universelle"
 STATIC_MODIFIER_DESC_nd_adu_dest_universal_academy: "L'Académie universelle d'Al-Andalus attire des érudits et des diplomates du monde entier, étendant l'influence du royaume par la connaissance."
 STATIC_MODIFIER_NAME_nd_adu_dest_garden_of_paradise: "Le concours de saut"
 STATIC_MODIFIER_DESC_nd_adu_dest_garden_of_paradise: "Les jardins, palais et bibliothèques d’Al-Andalus sont devenus un paradis sur terre, attirant richesse et talent tout en générant la complaisance dans les rangs."
 STATIC_MODIFIER_NAME_nd_adu_dest_ghazi_fervor: "Ferveur Ghazi"
 STATIC_MODIFIER_DESC_nd_adu_dest_ghazi_fervor: "L’esprit martial des guerriers ghazi brûle dans tout le califat, inspirant les soldats et les marins à des actes de bravoure."
 STATIC_MODIFIER_NAME_nd_adu_dest_imperial_tribute: "Hommage Impérial"
 STATIC_MODIFIER_DESC_nd_adu_dest_imperial_tribute: "Les vastes domaines du califat rapportent un tribut en or et en soldats, finançant une expansion ultérieure et sécurisant les frontières."
 STATIC_MODIFIER_NAME_nd_adu_dest_sultan_of_sultans: "Sultan des Sultans"
 STATIC_MODIFIER_DESC_nd_adu_dest_sultan_of_sultans: "Le sultan d’Al-Andalus commande l’armée la plus puissante du monde occidental, projetant sa puissance sur de vastes distances grâce à une initiative disciplinée."
 STATIC_MODIFIER_NAME_nd_adu_dest_western_caliphate: "Califat occidental"
 STATIC_MODIFIER_DESC_nd_adu_dest_western_caliphate: "Le califat occidental contrôle la Méditerranée grâce à sa suprématie navale et à une absorption efficace des territoires conquis."
 nd_adu_bayt_al_hikma: "Bayt al-Hikma"
 nd_adu_bayt_al_hikma_desc: "Une Maison de la Sagesse dans la tradition de la légendaire académie de Bagdad, où des érudits de toutes confessions et nations se réunissent pour traduire, débattre et faire progresser les connaissances humaines."
 nd_adu_hikma_endowment: "Dotation scientifique"
 nd_adu_hikma_endowment_desc: "Le papier, les livres, les bougies et les instruments en verre soutiennent la recherche et l'enseignement de l'académie."
 nd_adu_dar_al_jihad: "Dar al-Jihad"
 nd_adu_dar_al_jihad_desc: "Un centre de commandement fortifié et une armurerie où les campagnes militaires du califat sont planifiées, les soldats sont rassemblés et les chevaux sont hébergés pour les armées de la foi."
 nd_adu_jihad_provisioning: "Approvisionnement militaire"
 nd_adu_jihad_provisioning_desc: "Les armes, les chevaux de guerre, les harnais en cuir et les céréales soutiennent la garnison et approvisionnent les forces expéditionnaires du califat."

 # ===== BUREAUCRACIES =====

 AUTO_MODIFIER_NAME_nd_adu_bureaucracy_authority: "Diwan calife"
 AUTO_MODIFIER_DESC_nd_adu_bureaucracy_authority: "The restored realm inherits the offices of the Umayyad caliphate of Cordoba and its successors: the hijaba and chancery, the registries of Madinat al-Zahra, the Maliki judiciary, the masters of the market and the watchtowers of the marches. Three of them can be kept beside the one office that sharia law already allows."

 adu_hijaba_bureaucracy: "hijab"
 adu_hijaba_bureaucracy_desc: "The chamberlainship of the Cordoban court, established under the Umayyad emirate and elevated by the caliphate of 929. The hajib stood at the head of his own majlis, received petitioners and embassies, and drafted decrees in the caliph's name. Under Almanzor (978-1002) the office became de facto regal authority. The hijaba centralized administration through the qasr, but at the price of a nobility shut out of the caliph's intimate counsel."

 adu_diwan_al_jund_bureaucracy: "Syrian Junds"
 adu_diwan_al_jund_bureaucracy_desc: "In 743 the governor Abu al-Khattar settled the regiments of Syria across the south: the men of Damascus in Elvira, of Jordan in Rayyu (Malaga), of Palestine in Sidonia, of Hims in Seville, of Qinnasrin in Jaen, of Egypt in Beja and Tudmir. The armies of the east were paid from a register. These regiments were given districts to live from instead, and owed horsemen whenever Cordoba summoned them. They served well while the caliph held them, and the same junds backed the taifa fragmentation of 1031 when his grip slipped."

 adu_qadi_al_jamaa_bureaucracy: "Qadi al-Jama'a"
 adu_qadi_al_jamaa_bureaucracy_desc: "Le juge en chef de la communauté, magistrat suprême malékite de Cordoue. Sous Hisham I et al-Hakam I, le madhhab Maliki est devenu le cadre juridique dominant d'al-Andalus, codifié par Yahya ibn Yahya al-Laythi. Ibn Rushd al-Jadd, Qadi Iyad et Ibn al-Hajj al-Qurtubi occupaient tous ces fonctions. La rigueur malékite a uni le royaume au prix d’une pression sur les communautés dhimmi vers un statut plus strict."

 adu_hisba_muhtasib_bureaucracy: "Sahib al-Suq"
 adu_hisba_muhtasib_bureaucracy_desc: "The master of the market. Al-Andalus kept this older title after the east had renamed the office, and it wrote the market's rules down trade by trade: Ibn Abdun for Seville around 1100, al-Saqati for the saddlers and perfumers of Malaga around 1200. Weights, prices and the standard of every craft were set in those books. The office outlived the conquest. Castile kept it as the zabazoque and the almotacen."

 adu_madinat_al_zahra_bureaucracy: "Tribunal de Madinat al-Zahra"
 adu_madinat_al_zahra_bureaucracy_desc: "La cité palatiale construite par Abd al-Rahman III à partir de 936, avec son Salon Rico pour la réception des ambassades et ses protocoles cérémoniaux stricts classant toute l'administration par proximité du trône. Les califes recevaient des envoyés byzantins, des moines francs et des tributs sahariens sous des dais de soie. Le cérémonial de la cour comme instrument de gouvernement : ​​ruineux lorsqu'il est négligé, comme l'ont clairement démontré les pillages et les incendies de 1010-1013. Nécessite le siège à Cordoue."

 adu_barid_bureaucracy: "Atalayas of the Marches"
 adu_barid_bureaucracy_desc: "Round stone watchtowers stand in chains along the three marches, each in sight of the next. The emirs and caliphs of Cordoba built them from the ninth century onward, and Spanish still calls such a tower an atalaya, from the Arabic word for a lookout. Smoke by day and fire by night passed a warning down the line: word from Soria could reach Cordoba in about five hours. Villages shut their gates and the levies gathered before the raiders arrived. An unmanned tower was the first sign that a frontier was slipping."

 adu_dhimma_pact_bureaucracy: "Count of the Christians"
 adu_dhimma_pact_bureaucracy_desc: "The Christians of Cordoba answered to the emir through one of their own: the qumis, from the Latin comes, who stood for the community and was held to account for its taxes. A Christian judge beside him heard their cases by the old Visigothic law, and the Jews had a head of their own, a place Hasdai ibn Shaprut held under Abd al-Rahman III. The treasury found the arrangement cheap and sure. Maliki jurists found a Christian or a Jew set over revenue hard to bear."
