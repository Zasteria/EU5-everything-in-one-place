l_french:
 nd_hos_formed_tt: "L'Ordre de Saint-Jean a été refondé"
 nd_hos_path_a_tt: "Chose the #bold Crusading Order#! destiny"
 nd_hos_path_b_tt: "Chose the #bold Hospitalier Realm#! destiny"
 STATIC_MODIFIER_NAME_nd_hos_crusading_order: "Ordre de Croisade"
 STATIC_MODIFIER_DESC_nd_hos_crusading_order: "L'Ordre reste une confrérie militante. Chaque frère chevalier porte la croix à huit pointes pour la guerre. Les galères patrouillent sur les voies maritimes contre les corsaires d'Alger et de Tripoli, et la discipline du Couvent est la discipline de la guerre sainte."
 STATIC_MODIFIER_NAME_nd_hos_hospitalier_realm: "Royaume Hospitalier"
 STATIC_MODIFIER_DESC_nd_hos_hospitalier_realm: "L’Ordre gouverne un État méditerranéen souverain. Les ports maltais bourdonnent de corso et de bateaux de pèlerinage. La Sacra Infermeria attire les malades de la moitié d'un continent. Les huit langues se réunissent en conseil, et les ordres du couvent s'étendent aussi loin que peuvent naviguer ses galères."
 nd_hos.1.t: "Le Couvent de la Croix à Huit Pointes"
 nd_hos.1.d: "The Sovereign Order of the Hospital of Saint John of Jerusalem has refounded itself. The brothers who lost Acre, who were driven from Rhodes, who saw the langues scattered across Catholic Europe: they have raised the white cross above the harbor walls once more.\n\nThe question is what the Order shall be. Some among the langues argue that nothing has changed: the brothers took monastic vows to fight the infidel, and the galleys must sail until the Mediterranean is Christian. Others see a different Order: sovereign in its own right, lord of a Mediterranean island state, hospitalier to all of Christendom, drawing wealth from the corso and care from the Sacra Infermeria. The Convent must choose its character.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_hos.1.a: "Nous sommes l'épée de la chrétienté. Les galères ne se reposent jamais"
 nd_hos.1.b: "Nous sommes un royaume insulaire. L'hôpital, le port et la municipalité nous guident"
 STATIC_MODIFIER_NAME_nd_hos_galley_squadron: "Escadron de galères de l'Ordre"
 STATIC_MODIFIER_DESC_nd_hos_galley_squadron: "Les galères du couvent naviguent en escadrons disciplinés sous les ordres du capitaine général. Les officiers chevaliers et les équipages maltais formés aux tactiques d'abordage ; chaque proue porte la croix à huit pointes."
 nd_hos.2.t: "Escadron de l'Ordre"
 nd_hos.2.d: "Three galleys: the slim Hospitaller war-galley with its overhanging spur, the long oar-banks driven by free Maltese rowers, and the carved stern bearing the white cross of Saint John. From the Bay of Birgu the Convent's squadron sails out under the Captain-General, past Saint Elmo, past Gozo, into the open sea where Ottoman and Algerian shipping plies.\n\nFrom the Rhodes period through the era of Romegas, the Order's galleys earned a reputation no other Mediterranean fleet could match. They did not need numbers; they needed boldness. Hospitaller captains hunted prizes along the Barbary Coast, raided the Aegean, and carried the war into the Ottoman lake. The squadron was small. Its reputation was vast."
 nd_hos.2.a: "Capitaine-général, l'escadron est à vous"
 STATIC_MODIFIER_NAME_nd_hos_council_of_langues: "Conseil des Langues"
 STATIC_MODIFIER_DESC_nd_hos_council_of_langues: "Les huit langues se concertent au Conseil Sacré. Provence, Auvergne, France, Italie, Aragon, Castille, Allemagne, Angleterre chaque langue envoie son Pilier, et l'Ordre est gouverné par une confédération multinationale."
 STATIC_MODIFIER_NAME_nd_hos_grand_master_supremacy: "Suprématie du Grand Maître"
 STATIC_MODIFIER_DESC_nd_hos_grand_master_supremacy: "Le Grand Maître règne en prince souverain. Le Conseil Sacré conseille, mais le Palais Magistral décide. Les langues servent au gré du Maître et l'ordre de l'Ordre est unifié."
 nd_hos.3.t: "Les huit langues"
 nd_hos.3.d: "Each langue has its auberge: a long stone hostel where its brothers lodge, dine, and conduct administrative business under their Pilier. From the Auberge de Castille on the heights of Valletta to the Auberge d'Auvergne by the Forni quarters, the eight tongues divide the work of the Convent.\n\nProvence holds the office of Grand Commander. France holds the Hospitaller of the Sick. Italy holds the Admiral. Castile holds the Chancellor. Aragon, Auvergne, Germany, and England each fill their roles in turn. It is a system without precedent in Catholic Europe: a multinational federal religious-military order. But the system has its strain. Should the Master rule absolutely, or should the langues balance him?"
 nd_hos.3.a: "Laissons le Conseil Sacré gouverner. Les langues sont l'Ordre"
 nd_hos.3.b: "Le Grand Maître est souverain. Une tête, une commande"
 STATIC_MODIFIER_NAME_nd_hos_silver_plate_medicine: "Médecine en plaque d'argent"
 STATIC_MODIFIER_DESC_nd_hos_silver_plate_medicine: "Les patients de la Sacra Infermeria sont servis sur une assiette d'argent pour empêcher la propagation de la contagion. Les blessures sont pansées avec du miel. Les services sont séparés par maladie. L'hygiène de l'Ordre est en avance sur son temps."
 STATIC_MODIFIER_NAME_nd_hos_school_of_anatomy: "École d'anatomie"
 STATIC_MODIFIER_DESC_nd_hos_school_of_anatomy: "La Sacra Infermeria a ouvert une école d'anatomie, de chirurgie et de pharmacie. Des médecins viennent de toute l’Europe catholique pour apprendre l’art moderne de guérir dans les paroisses de l’Ordre."
 nd_hos.4.t: "La Sacra Infermeria"
 nd_hos.4.d: "Built in 1574 along the harbor walls of Valletta, the Sacra Infermeria is the largest hospital in Christendom. Its great ward (over 150 paces long) accommodates 900 patients in beds that line both walls under a vast open vault. The Order's brothers attend the sick personally; this is the Order's founding mission, older than the war against the infidel.\n\nThe innovations astonish visitors. Patients eat from silver plate, because silver inhibits whatever invisible miasma carries disease. Wounds are dressed with honey. Each ward is reserved for one type of illness, separating contagion. By the seventeenth century the Infermeria has become the most advanced hospital in Europe, and physicians come from Paris, Bologna, Salamanca, and Vienna to study its practices.\n\nThe Order must decide where to invest. Should the wards expand the modern hygienic practice, or should the Infermeria become a school where physicians are trained?"
 nd_hos.4.a: "Assiettes en argent et sauces au miel. Les protections sont sacrées"
 nd_hos.4.b: "J'ai fondé une école d'anatomie. Former les médecins de la chrétienté"
 STATIC_MODIFIER_NAME_nd_hos_licensed_corso: "Cours licencié"
 STATIC_MODIFIER_DESC_nd_hos_licensed_corso: "Le Tribunale degli Armamenti délivre des commissions aux capitaines corsaires sous le drapeau de l'Ordre. Les revenus des gains sont réglementés, le Grand Maître prend sa part et les ports maltais se remplissent de marchandises capturées."
 STATIC_MODIFIER_NAME_nd_hos_unlicensed_corso: "Cours sans permis"
 STATIC_MODIFIER_DESC_nd_hos_unlicensed_corso: "L'ordonnance du Tribunale est ignorée. Les ports maltais se remplissent plus rapidement de marchandises capturées et la trésorerie du couvent gonfle, mais les maisons de marchands grecques et vénitiennes protestent farouchement devant tous les tribunaux catholiques. Le nom de l'Ordre est souillé dans toute la chrétienté."
 nd_hos.5.t: "Tribunale degli Armamenti"
 nd_hos.5.d: "In 1605 the Grand Master establishes a tribunal of five commissioners (the Tribunale degli Armamenti) to bring order to the corso. Privateers operating from Maltese harbors must now be licensed by the tribunal, fly the Order's flag, attack only Muslim shipping, and respect safe-conduct passes issued by Christian princes.\n\nThe corso transforms from informal raiding into a regulated commerce of war. Prize cargoes are condemned by the tribunal, captives are ransomed, and the Order's treasury takes a defined share. Captains from Provence, Sicily, Catalonia, and Malta itself sail under Hospitaller commission.\n\nBut the Sacred Council is divided. The wealthier captains argue against the tribunal's restrictions: a Greek hull carrying Ottoman cargo, a Venetian galleass running the blockade with Aleppine silk, a Ragusan trader supplying the Sublime Porte, all should be fair prize, regardless of the safe-conduct in their lockers. Let the patents go out unrestricted, they say, and watch the Convent's vaults fill twice as fast. The Latin chancellors warn what such a policy will cost in the harbours of Christendom."
 nd_hos.5.a: "Délivrez les brevets. Le corso est réglementé"
 nd_hos.5.b: "Lâchez les brevets. Chaque cargaison touchant les infidèles est une récompense équitable"
 STATIC_MODIFIER_NAME_nd_hos_bulwark_of_christendom: "Rempart de la chrétienté"
 STATIC_MODIFIER_DESC_nd_hos_bulwark_of_christendom: "Les bastions de l'Ordre constituent le mur sud de la chrétienté. La garnison s'entraîne quotidiennement, les redoutes sont approvisionnées, et le Couvent a réaffirmé devant toute l'Europe catholique que la croix hospitalière ne cédera pas."
 STATIC_MODIFIER_NAME_nd_hos_engineers_of_the_trace: "Ingénieurs de la Trace"
 STATIC_MODIFIER_DESC_nd_hos_engineers_of_the_trace: "L'Ordre a institutionnalisé le génie militaire. Des spécialistes italiens des traces, des maçons maltais et des officiers chevaliers s'entraînent ensemble. Les bastions de La Valette deviennent une école de fortification dans toute l’Europe catholique."
 nd_hos.6.t: "Le Fort des Bastions"
 nd_hos.6.d: "The Great Siege of 1565 lasted four months. Six hundred knights and six thousand men-at-arms held against forty thousand Ottoman troops under Mustapha Pasha and Piali. Fort Saint Elmo fell after thirty-one days of bombardment. Fort Saint Angelo did not fall. Senglea did not fall. La Valette refused every parley and fought from the walls beside his brothers.\n\nThe siege was lifted in September. The Ottoman army withdrew, broken. The Order survived, and so did Catholic Mediterranean Europe. In the years that followed, the Maltese fortifications were redoubled: Italian engineer Francesco Laparelli laid out the city of Valletta as a fortified peninsula. The trace italienne, perfected on Maltese rock, became a school of military engineering studied across Catholic Europe.\n\nThe Order must decide how to use this reputation: as a bulwark to defend, or as a school to teach."
 nd_hos.6.a: "Nous sommes le mur de la chrétienté. Aucun ne passera"
 nd_hos.6.b: "Former les ingénieurs. Le bastion est une école"
 STATIC_MODIFIER_NAME_nd_hos_constitution_of_the_order: "Constitution de l'Ordre"
 STATIC_MODIFIER_DESC_nd_hos_constitution_of_the_order: "Le Codice del Ordine est promulgué. Les droits et devoirs de chaque frère sont écrits. Le Conseil Sacré, l'autorité du Maître, les privilèges des langues sont tous codifiés dans une constitution qui assure la cohésion du Couvent."
 nd_hos.7.t: "Code de l'Ordine"
 nd_hos.7.d: "Under Grand Master Hugues Loubenx de Verdalle, the Order codifies its accumulated statutes, customs, and council decrees into a single Codice: the constitution of the Sovereign Military Hospitaller Order. Every right of every brother, every privilege of every langue, every duty of every officer, is now written in a single book.\n\nThe codification settles disputes that had simmered for generations. The Master's authority is defined; so are its limits. The langues' rights are secured; so are their obligations. The Convent's revenues (responsions, prize money, hospital funds, commandery rents) are accounted for. From this moment, the Order has a written constitution, and the multinational confederation governs itself by law rather than by improvisation."
 nd_hos.7.a: "Le Codex fait loi. Que l'Ordre soit gouverné ainsi"
 nd_hos_hospitalier_tradition: "Tradition Hospitalière"
 nd_hos_hospitalier_tradition_desc: "La mission fondatrice de l'Ordre : soigner les malades avant tout. L’hôpital a précédé l’épée."
 nd_hos_knights_hospitaller: "Chevaliers Hospitaliers"
 nd_hos_knights_hospitaller_desc: "Frères chevaliers assermentés du couvent, liés par les vœux de pauvreté, de chasteté et d'obéissance. Infanterie lourde disciplinée de l'Ordre."
 nd_hos_squadron_of_the_order: "Escadron de l'Ordre"
 nd_hos_squadron_of_the_order_desc: "La fine galère de guerre Hospitalière, l'arme emblématique de l'Ordre en mer. Conçu pour l'éperonnage et l'abordage, avec pour équipage des officiers chevaliers et des marins méditerranéens."
 nd_hos_order_commandery: "Commanderie de l'Ordre"
 nd_hos_order_commandery_desc: "La commanderie fortifiée : caserne, trésor et chapelle de la langue. Le siège local de l'Ordre dans toute l'Europe catholique."
 nd_hos_langues_system: "Système de langues"
 nd_hos_langues_system_desc: "L'Ordre est divisé en huit langues : Provence, Auvergne, France, Italie, Aragon, Castille, Allemagne, Angleterre, chacune avec sa propre auberge, Pilier et bureau d'État."
 nd_hos_statutes_of_rhodes: "Statuts de Rhodes"
 nd_hos_statutes_of_rhodes_desc: "Première codification écrite des coutumes et des règles de l'Ordre sous le Grand Maître Roger de Pins. L’épine dorsale constitutionnelle d’un ordre religieux souverain."
 nd_hos_mediterranean_galley_tactics: "Tactiques de galère méditerranéennes"
 nd_hos_mediterranean_galley_tactics_desc: "Tactiques à la rame et à la voile perfectionnées contre les flottes ottomanes. La mince galère hospitalière était spécialisée dans l'abordage et l'éperonnage, avec une discipline qu'aucune flotte marchande ne pouvait égaler."
 nd_hos_apothecary_of_the_order: "Apothicaire de l'Ordre"
 nd_hos_apothecary_of_the_order_desc: "Les ateliers médicinaux de l'Ordre, distillant de la thériaque et des baumes à partir d'herbes cultivées. Les médicaments hospitaliers sont exportés dans toute l’Europe catholique."
 nd_hos_maltese_bastions: "Bastions maltais"
 nd_hos_maltese_bastions_desc: "La trace italienne bastionnée adaptée à la roche méditerranéenne. Les forts Saint-Ange et Saint-Elme gardent le port et La Valette elle-même est une péninsule fortifiée."
 nd_hos_sacra_infermeria: "Sacra Inferméria"
 nd_hos_sacra_infermeria_desc: "Le grand hôpital de La Valette. Pionnier de l'hygiène moderne avec des plaques d'argent, des pansements au miel et des salles séparées pour les maladies. L'hôpital le plus avancé de la chrétienté."
 nd_hos_corso_privateering: "Corso Corsaire"
 nd_hos_corso_privateering_desc: "Guerre corsaire sous licence d'État contre la navigation ottomane et barbare. Les capitaines maltais naviguent sous le pavillon de l'Ordre et partagent les récompenses avec le Trésor."
 nd_hos_tongues_treasury: "Trésor des langues"
 nd_hos_tongues_treasury_desc: "Chaque langue reverse une part des revenus des commanderies européennes aux répons au couvent. Les richesses de l'Ordre proviennent d'un continent catholique."
 nd_hos_great_siege_veterans: "Vétérans du Grand Siège"
 nd_hos_great_siege_veterans_desc: "L'esprit de 1565 s'est institutionnalisé : les troupes de garnison s'entraînaient à la défense d'assaut de la forteresse, mêlant la discipline tercio espagnole à l'expérience de siège de l'Ordre."
 nd_hos_tribunale_armamenti: "Tribunale degli Armamenti"
 nd_hos_tribunale_armamenti_desc: "La cour des prises du corso. Cinq commissaires délivrent des licences aux capitaines de corsaires, fixent les règles d'engagement et répartissent les revenus des récompenses au trésor de l'Ordre."
 nd_hos_capitana_galley: "Escadron maltais Capitana"
 nd_hos_capitana_galley_desc: "La Sacra Capitana, la cuisine de l'amiral. Des poupes sculptées, des proues dorées et l'équipage de chevaliers le plus expérimenté de l'Ordre."
 nd_hos_valletta_arsenal: "Arsenal de La Valette"
 nd_hos_valletta_arsenal_desc: "Les chantiers navals de l'Ordre sur le Grand Port. Galères, caraques de ravitaillement, puis frégates à voile, construites et réaménagées en rotation continue."
 nd_hos_codice_del_ordine: "Code de l'Ordine"
 nd_hos_codice_del_ordine_desc: "Le code juridique complet de l'Ordre. Le droit de chaque frère, le privilège de chaque langue, le devoir de chaque officier, inscrits dans une seule constitution."
 nd_hos_frigate_squadron: "Escadron de frégates de l'Ordre"
 nd_hos_frigate_squadron_desc: "Alors que les galères disparaissaient, l'Ordre construisit des frégates à voile pour conserver son rôle de police méditerranéenne. Plus rapide et plus léger que les navires de ligne, conçu pour la chasse aux corsaires."
 nd_hos_school_of_anatomy_advance: "École d'anatomie et de chirurgie"
 nd_hos_school_of_anatomy_advance_desc: "Créé à la Sacra Infermeria en 1676, il forme des médecins de toute l'Europe catholique à la pratique chirurgicale et pharmaceutique la plus moderne de l'époque."
 nd_hos_hospitaller_customs: "Douanes Hospitalières"
 nd_hos_hospitaller_customs_desc: "Malte comme station de quarantaine méditerranéenne. Le Lazaret et la Douane tirent des revenus fiables du commerce de passage tout en empêchant les maladies d'entrer dans les ports."
 nd_hos_mediterranean_quarantine: "Quarantaine méditerranéenne"
 nd_hos_mediterranean_quarantine_desc: "Malte fixe les normes de quarantaine maritime européenne. Le système Lazaretto à son apogée, régulant le mouvement des navires, des équipages et des cargaisons à travers la mer intérieure."
 nd_hos_order_reformed: "L'Ordre Réformé"
 nd_hos_order_reformed_desc: "Les réformes constitutionnelles des Grands Maîtres Pinto et Rohan modernisent les langues, régularisent l'administration centrale et préparent l'Ordre à un âge éclairé."
 nd_hos_late_corso: "Cours tardif"
 nd_hos_late_corso_desc: "La mission anti-piraterie de l'Ordre s'est préservée jusqu'à l'ère révolutionnaire. Des frégates maltaises patrouillent sur les voies commerciales méditerranéennes, chassant les corsaires algériens et tripolitains."
 nd_hos_maltese_free_port: "Port franc maltais"
 nd_hos_maltese_free_port_desc: "Malte s'ouvre au commerce international. Le port devient un entrepôt méditerranéen pour le commerce britannique, français, levantin et italien à la fin du XVIIIe siècle."
 nd_hos_magistral_library: "Bibliothèque Magistrale"
 nd_hos_magistral_library_desc: "Archives et bibliothèque scientifique de l'Ordre à La Valette. Les archivistes chevaliers cataloguent les archives linguistiques, les tableaux et les traités médicaux dans une institution scientifique qui rivalise avec les bibliothèques universitaires italiennes."
 nd_hos_magistral_library_building: "Bibliothèque Magistrale"
 nd_hos_magistral_library_building_desc: "Les archives et la bibliothèque scientifique de l'Ordre : la correspondance des chevaliers-archivistes, les archives linguistiques, les tableaux et les traités médicaux."
 nd_hos_magistral_library_maintenance: "Archives et Scriptorium"
 nd_hos_magistral_library_maintenance_desc: "Papier, livres, meubles et cire d'abeille à portée de main. Les archivistes conservent la mémoire documentaire de l'Ordre en huit langues."
 a_nd_hos_knights: "Chevaliers Hospitaliers"
 a_nd_hos_knights_desc: "Frères chevaliers assermentés du Couvent chevaliers-moines d'infanterie lourde, frères combattants de l'Ordre. Lié par les vœux monastiques ; disciplinée là où les prélèvements communs s'interrompent."
 a_nd_hos_tercio: "Tercio de l'Ordre"
 a_nd_hos_tercio_desc: "Infanterie lourde vétéran combinant l'exercice tercio espagnol avec la discipline de l'Ordre. Tiré des soldats qui tenaient les bastions de 1565 et de leurs successeurs."
 n_nd_hos_galley: "Gallerie de l'Ordre"
 n_nd_hos_galley_desc: "La mince galère de guerre hospitalière avec son éperon en surplomb. Conçu pour éperonner et embarquer les navires ottomans et barbaresques lors d'engagements rapprochés."
 n_nd_hos_capitana: "Sacra Capitaine"
 n_nd_hos_capitana_desc: "La cuisine phare du Grand Maître. Poupe sculptée, proue dorée, croix de Saint-Jean à huit pointes sur chaque bannière. La galère la plus lourdement armée de la Méditerranée."
 n_nd_hos_frigate: "Frégate maltaise"
 n_nd_hos_frigate_desc: "Le voilier de guerre hospitalier de la fin de la période. Construit à l'arsenal de La Valette pour la chasse aux corsaires en Méditerranée : plus rapide qu'un navire de ligne, avec une fraction du poids."
 nd_hos_commandery: "Commanderie de l'Ordre"
 nd_hos_commandery_desc: "La commanderie fortifiée d'une langue : caserne, trésor et chapelle réunis sous l'autorité d'un chevalier-commandant."
 nd_hos_commandery_maintenance: "Exercice de l'ordre"
 nd_hos_commandery_maintenance_desc: "Les frères s'entraînent quotidiennement ; la chapelle est entretenue ; les magasins de la commanderie sont pleins."
 nd_hos_auberge: "Auberge des Langues"
 nd_hos_auberge_desc: "Le bâtiment administratif-résidentiel d'une langue. Chaque langue possède sa propre auberge pour les frères en visite, son bureau des langues et son centre administratif régional."
 nd_hos_auberge_maintenance: "Conseil de l'Auberge"
 nd_hos_auberge_maintenance_desc: "Les frères se rassemblent sous le Pilier de la langue ; la correspondance est distribuée à travers le pays d'origine de la langue ; les enregistrements de la langue sont conservés."
 nd_hos_apothecary: "Apothicaire de l'Ordre"
 nd_hos_apothecary_desc: "L'atelier médicinal de l'Ordre. Cultive des herbes, distille de la thériaque et des baumes et exporte des médicaments hospitaliers dans toute l'Europe catholique."
 nd_hos_apothecary_production: "Composition thériaque"
 nd_hos_apothecary_production_desc: "Composé médicinal emblématique de l'Ordre, préparé à partir d'un mélange de cire d'abeille, de cultures de fibres et de vin exporté sous le sceau de la croix à huit pointes."
 nd_hos_infermeria: "Sacra Inferméria"
 nd_hos_infermeria_desc: "Le grand hôpital de La Valette. Des assiettes en argent, des pansements au miel, des salles séparées pour les maladies et une école d'anatomie. L'hôpital le plus avancé de la chrétienté."
 nd_hos_infermeria_maintenance: "Hôpital de Saint-Jean"
 nd_hos_infermeria_maintenance_desc: "Les frères soignent les malades. Les salles sont tenues hygiéniques selon les normes de l'Ordre : assiettes d'argent, pansements au miel, salles séparées. La pharmacie et la laverie fonctionnent en permanence."
 nd_hos_star_fortifications: "Fortifications étoilées de l'Ordre"
 nd_hos_star_fortifications_desc: "Défenses portuaires bastionnées adaptées de la trace italienne. Les forts Saint-Ange et Saint-Elme, les bastions de Senglea et les courtines de la péninsule de La Valette."
 nd_hos_fortifications_maintenance: "Garnison et magasins"
 nd_hos_fortifications_maintenance_desc: "Poudre, plombs et rations pour la garnison du bastion. Des murs réparés après chaque tempête ; les fossés restent dégagés ; des canons gardés huilés."
 nd_hos_arsenal: "Arsenal de La Valette"
 nd_hos_arsenal_desc: "Les chantiers navals de l'Ordre sur le Grand Port. Des quais de cuisine, des chantiers de ravitaillement et plus tard des cales de frégates bordent les criques entre Birgu et Senglea."
 nd_hos_arsenal_maintenance: "Chantiers de l'Arsenal"
 nd_hos_arsenal_maintenance_desc: "Bois stocké, goudron bouilli, magasins navals entretenus, capitaines de chevaliers et charpentiers navals maltais tenus en service."
 nd_hos_lazaretto: "Lazaret et douanes"
 nd_hos_lazaretto_desc: "La station de quarantaine maritime et la douane. Les navires et équipages en visite attendent dans le Lazaret avant de débarquer, fournissant ainsi des recettes douanières et un contrôle des maladies."
 nd_hos_lazaretto_maintenance: "Liste de quarantaine"
 nd_hos_lazaretto_maintenance_desc: "Registres, bons et certificats de quarantaine tenus ; les médicaments et le linge propre circulaient dans les salles ; le directeur des douanes enregistre chaque cargaison."
 nd_hos_destiny: "Le projet du couvent"
 nd_hos_destiny_desc: "L'Ordre s'est refondé. Maintenant, le Couvent doit décider quel type d’État il doit devenir, un imperium méditerranéen militant projetant sa force d’un océan à l’autre, ou un royaume insulaire souverain dont les ports sont le pivot juridique, commercial et médical de la Méditerranée catholique."
 nd_hos_dest_levant_reclaimed: "Récupérer la côte levantine"
 nd_hos_dest_levant_reclaimed_desc: "Plant the eight-pointed cross again at Acre and Tripoli, the Order's lost homes from the days of the Crusader Kingdoms. An army of thirty thousand men is kept in the field to project force from the Holy Land coast."
 nd_hos_dest_ottoman_lake_broken: "Briser le lac ottoman"
 nd_hos_dest_ottoman_lake_broken_desc: "Take Smyrna and Alexandria, the great Ottoman naval and supply ports of the eastern Mediterranean. Prestige is built and fifty thousand men are kept under arms. The Mediterranean must cease to be a Turkish lake."
 nd_hos_dest_mare_nostrum: "Mare Nostrum"
 nd_hos_dest_mare_nostrum_desc: "La pierre angulaire du projet militant : Constantinople, Tunis, Beyrouth rive nord, rive sud, rive est. La Méditerranée est le lac de l'Ordre et le Grand Magistère s'élève au-dessus du port du Couvent."
 nd_hos_dest_lazaretto_network: "Le réseau Lazaret"
 nd_hos_dest_lazaretto_network_desc: "Adoptez la banque et accumulez mille ducats. Faites passer le commerce de la soie levantine par les ports maltais. Malte devient un centre d’échange pour le commerce et la quarantaine dans la Méditerranée catholique."
 nd_hos_dest_continental_authority: "Autorité continentale de la santé"
 nd_hos_dest_continental_authority_desc: "Adoptez l'imprimerie, augmentez votre prestige, accumulez deux mille ducats et faites passer le commerce des draps fins par les douanes maltaises. Diffuser la pratique médicale hospitalière et les normes de quarantaine dans toute l’Europe catholique."
 nd_hos_dest_sacra_maxima: "Sacra Infermería Maxima"
 nd_hos_dest_sacra_maxima_desc: "The capstone of the mercantile-medical project: raise the Sacred Infirmary in three of the Order's towns, accumulate three thousand ducats, win prestige, and bring the silver trade through the Convent's harbor. The Lazaretto Imperial rises along the Grand Harbour as the legal and sanitary pivot of the inland sea."
 nd_hos.8.t: "La longue route du couvent"
 nd_hos.8.d: "The Sacred Council has chosen the Order's project. Whether the eight-pointed cross sails out at the prow of an imperial galley or rises above the Lazaretto's quarantine wards, the Convent's road is set. The brothers know what they must build, and the langues turn their commanderies to the work.\n\nA destiny path has opened in the Traditions tab. The Convent will know whether it has fulfilled its project."
 nd_hos.8.a: "Que le travail commence"
 nd_hos.9.t: "Acre et Tripoli restaurés"
 nd_hos.9.d: "Galleys spill knights and tercio onto the Levantine sands once again. Acre's old harbor (where the Order made its last stand in 1291) is held by Hospitaller troops, and the eight-pointed cross flies above its walls for the first time in over a hundred years. Tripoli falls in the season after, its citadel reduced by Maltese cannon and held by knights in white surcoat.\n\nThe Convent has done what no Catholic prince since Saint Louis has done. The Holy Land coast is partly reclaimed, and the Order has its old strategic depth back: a Levantine bridgehead from which to project force into the Ottoman heart."
 nd_hos.9.a: "Les frères se retrouvent sur le sol levantin"
 nd_hos.10.t: "Le lac ottoman est brisé"
 nd_hos.10.d: "Smyrna's harbor (long the chief Ottoman naval base on the Aegean) is taken by Hospitaller squadrons. Alexandria, the great Egyptian port, falls in a combined-arms operation: galleys closing the harbor entrance while tercio land east of Pharos. Two of the Sultan's most important Mediterranean ports now answer to the Convent.\n\nThe Convent must decide how to use this victory. Some captains want the squadron driven into Ottoman waters in decisive engagement, hunting their fleets to destruction in the Romegas tradition. Others argue for a sustained Mediterranean patrol: galley squadrons rotating endlessly along every coast, choking trade and asserting Hospitaller presence as a permanent fact of the inland sea."
 nd_hos.10.a: "Conduisez l'escadron dans la flotte ottomane. S'engager et détruire"
 nd_hos.10.b: "Patrouillez sans fin sur les voies maritimes. Soyez partout à la fois"
 nd_hos.11.t: "Mare Nostrum"
 nd_hos.11.d: "Constantinople under Hospitaller cannon. Tunis taken from the Barbary corsairs. Beirut and the Levantine ports flying the eight-pointed cross. The Mediterranean (the inland sea of antique empires, the Ottoman lake of the past century) has become the Order's domain in fact as well as name. Brother knights lord over harbors from the Hellespont to the Pillars of Hercules.\n\nThe Grand Magistery rises in the harbor of Valletta, a Magistral Palace fit for a Mediterranean imperium: chambers of state, naval council, langue chancery, throne hall for envoys of half a world. The Convent must decide its character at this height: an Imperial Bulwark guarding every reclaimed shore with fortress and garrison, or a Pax Hospitalleria of patrol fleets keeping the inland sea pacified by attrition rather than walls."
 nd_hos.11.a: "Garnison sur chaque rivage. Nous sommes le rempart"
 nd_hos.11.b: "Patrouillez toutes les voies maritimes. Nous sommes la paix elle-même"
 nd_hos.12.t: "La banque et le Lazaret"
 nd_hos.12.d: "Maltese banking houses settle the accounts of Levantine silk merchants whose ships put in at the Grand Harbour. Brother-bankers count Genoese florins, Venetian ducats, Aleppine sequins, French ecus. The Convent's vaults swell with Mediterranean silver, and the Lazaretto roster fills with quarantined captains waiting for clean papers.\n\nThe banking institution and the silk trade have made Malta a Mediterranean clearing-house. Visiting merchants pay customs on entry, settle their cross-account at the Maltese bank, take their quarantine certificate, and sail with the Order's seal endorsing them in every Catholic harbor."
 nd_hos.12.a: "Le Couvent a son état commercial"
 nd_hos.13.t: "La quarantaine devient impériale"
 nd_hos.13.d: "Hospitaller quarantine certificates are honored in Genoa, Marseille, Barcelona, Naples, Ragusa. The Order's printers run continuous editions of the Maltese Sanitary Manual, distributed to every Catholic port. Fine-cloth merchants from Florence and Lyon route through Malta because of the discount on insurance offered by an Order-sealed cargo.\n\nThe Convent must decide how to extend this authority. The Lazaretto wing argues for a continental Quarantine Network: fortified, capital-intensive Lazaretto stations at every harbor, with Maltese commissioners sitting in each. The Customs wing argues for an Imperial Customs House: Maltese officers stationed in every Catholic harbor collecting fees on every cargo, the Order as the Mediterranean's commercial chancery."
 nd_hos.13.a: "Construisez le réseau Lazaret. Les ports se mettent en quarantaine ensemble"
 nd_hos.13.b: "Construisez les bureaux de douane. Les chanceliers de l'Ordre font tous du commerce"
 nd_hos.14.t: "Sacra Infermería Maxima"
 nd_hos.14.d: "Manufactories along the Grand Harbour. Silver from across the Catholic world settling in Maltese bank-vaults. The Lazaretto Imperial (three storeys of quarantine wards, customs offices, and Apothecary chambers) open above the harbor walls. Pilgrims from Spain, merchants from Hamburg, physicians from Padua, all passing through the Convent's halls.\n\nThe Order is no longer merely a sovereign island state. It is the legal, sanitary, and commercial pivot of the Mediterranean. Now the Convent must give the project its final character: a Universal Pharmacopeia making Maltese medicaments and naval-supply standards continental, or a Council of Lazarettos chairing a federation of quarantine stations across half a world."
 nd_hos.14.a: "La Pharmacopée est le cadeau de l'Ordre à la chrétienté"
 nd_hos.14.b: "Le Conseil des Lazarets. Fédérer les ports du monde"
 STATIC_MODIFIER_NAME_nd_hos_dest_decisive_engagement: "Engagement décisif"
 STATIC_MODIFIER_DESC_nd_hos_dest_decisive_engagement: "L'escadron navigue dans la flotte ottomane. Les galères de l'Ordre enfoncent, embarquent et capturent dans la tradition de Romegas ; le drapeau hospitalier revient au port avec des prix en remorque."
 STATIC_MODIFIER_NAME_nd_hos_dest_mediterranean_patrol: "Patrouille Méditerranéenne"
 STATIC_MODIFIER_DESC_nd_hos_dest_mediterranean_patrol: "Les galères de l'Ordre tournent sans fin le long de toutes les côtes méditerranéennes. Le déploiement continu est glorieux ; le coût de la rémunération des équipages et des bases de ravitaillement entraîne une légère inflation monétaire."
 STATIC_MODIFIER_NAME_nd_hos_dest_imperial_bulwark: "Rempart impérial"
 STATIC_MODIFIER_DESC_nd_hos_dest_imperial_bulwark: "Des forteresses hospitalières s'élèvent à chaque port reconquis. Garnisons approvisionnées, murs réparés, bastions agrandis. La Méditerranée est une chaîne de forts sous la croix à huit pointes."
 STATIC_MODIFIER_NAME_nd_hos_dest_pax_hospitalleria: "Pax Hospitalleria"
 STATIC_MODIFIER_DESC_nd_hos_dest_pax_hospitalleria: "La mer intérieure est pacifiée par des patrouilles plutôt que par des murs. Des chantiers de réparation s'ouvrent dans chaque port récupéré ; les navires reprennent la mer rapidement ; l'attrition le long des côtes est minimisée grâce à la logistique continue de l'Ordre."
 STATIC_MODIFIER_NAME_nd_hos_dest_quarantine_network: "Réseau Méditerranéen de Quarantaine"
 STATIC_MODIFIER_DESC_nd_hos_dest_quarantine_network: "Des stations de lazaret dans chaque port catholique, avec des commissaires maltais assis dans chacun. La protection de l'Ordre s'étend au travers des bons de permis de commerce ; le réseau de gares fortifiées coûte cher à entretenir."
 STATIC_MODIFIER_NAME_nd_hos_dest_customs_imperial: "Douanes Impériales"
 STATIC_MODIFIER_DESC_nd_hos_dest_customs_imperial: "Des douaniers maltais dans chaque port catholique ; les frais de fret revenant à La Valette ; galères de transport dont le coût est réduit par le volume des échanges. Le renforcement des armées terrestres lointaines souffre cependant de l’accent mis sur le commerce."
 STATIC_MODIFIER_NAME_nd_hos_dest_universal_pharmacopeia: "Pharmacopée universelle"
 STATIC_MODIFIER_DESC_nd_hos_dest_universal_pharmacopeia: "Les médicaments maltais, les fournitures navales et les pièces de commerce bourgeoises affluent vers la moitié d'un continent. L'Ordre est l'épine dorsale médicale et logistique de l'Europe catholique."
 STATIC_MODIFIER_NAME_nd_hos_dest_council_of_lazarettos: "Conseil des Lazarets"
 STATIC_MODIFIER_DESC_nd_hos_dest_council_of_lazarettos: "The Order chairs a federation of Lazaretto stations across half a world. Population capacity rises from improved sanitation; goods cleared by the Order's certificates sell dearer abroad; sailors trained at every member port enter Maltese service."
 nd_hos_grand_magistery: "Grand Magistère"
 nd_hos_grand_magistery_desc: "Le Palais Magistral à sa hauteur impériale : chambres du Grand Maître, conseil naval, chancellerie de langue et salle de réception des envoyés de la domination méditerranéenne."
 nd_hos_grand_magistery_maintenance: "Tribunal Magistral"
 nd_hos_grand_magistery_maintenance_desc: "Papier pour la chancellerie, drap fin pour la maison magistrale, meubles pour les salles d'audience, armes pour la garde magistrale."
 nd_hos_lazaretto_imperial: "Lazaret Impérial"
 nd_hos_lazaretto_imperial_desc: "La Sacra Infermeria Maxima : autorité sanitaire continentale, bureau de douane et chancellerie des permis de commerce. Trois étages de salles, de bureaux et de chambres d'apothicaire au-dessus du Grand Port."
 nd_hos_lazaretto_imperial_maintenance: "Protections impériales"
 nd_hos_lazaretto_imperial_maintenance_desc: "Les médicaments circulaient dans les services ; papier pour la chancellerie des permis de commerce ; cire d'abeille pour les apothicaires; tissu pour la liste de quarantaine."
 hos_council_of_tongues_bureaucracy: "Sacro Consiglio Compito"
 hos_council_of_tongues_bureaucracy_desc: "Le Conseil des Langues Conseil suprême fédéral de l'Ordre, constitué sous les Statuts de Margat (1206) et de Roger de Pins (1357). Chacune des huit langues siège sous son pilier (bailli conventuel) : le Maréchal de Provence, le Grand Commandeur d'Auvergne, l'Hospitalier de France, l'Amiral d'Italie, le Drapier d'Aragon, le Grand Chancelier de Castille, le Grand Bailli d'Allemagne et le Turcopolier d'Angleterre. Aucun pilier ne peut être déposé par le Grand Maître seul, et le consentement du Conseil est requis pour la guerre, l'alliance et la levée de réponses auprès des prieurés."
 hos_tribunale_armamenti_bureaucracy: "Tribunale degli Armamenti"
 hos_tribunale_armamenti_bureaucracy_desc: "Le Tribunal Maritime, créé à La Valette en 1605 pour autoriser, réglementer et juger la campagne de corsaire méditerranéenne de l'Ordre, autorisée par l'État, contre la navigation musulmane. Le Tribunal délivre les patenti del corso sous le sceau magistral, entend les affaires de prix et prend la décima (un dixième) pour le Trésor commun et un autre dixième pour le Grand Maître. Ses juges sont issus des langues italienne et espagnole ; Les investisseurs sont des bourgeois maltais, des chevaliers aux commandes et des partenaires silencieux de toute la Méditerranée catholique. Détenus librement, les brevets sont vendus pour des prix grecs et vénitiens, et le nom de l'Ordre est taché dans toute la chrétienté."
 hos_sacra_infermeria_bureaucracy: "Sacra Inferméria"
 hos_sacra_infermeria_bureaucracy_desc: "La Sainte Infirmerie, l'institution religieuse déterminante de l'Ordre. La Sacra Infermeria maltaise a ouvert ses portes à La Valette en 1574 avec une grande salle de 155 mètres de long, agrandie jusqu'au XVIIe siècle pour devenir l'un des plus grands hôpitaux d'Europe. Les Statuts obligent chaque frère chevalier à servir son tour au chevet des malades dans la servitio dei poveri ; les patients sont appelés Nos Seigneurs les Malades et dînent dans une assiette d'argent. L'Infirmerie est pionnière en matière de recueils de dossiers médicaux standardisés, de chirurgie anatomique grâce à son théâtre d'anatomie et de préparation systématique de médicaments par l'intermédiaire de l'apothicaire. Les patients de toutes confessions sont admis sans distinction."
 hos_comun_tesoro_bureaucracy: "Tribunale del Comun Trésor"
 hos_comun_tesoro_bureaucracy_desc: "La Chambre Commune du Trésor, institution financière centrale de l'Ordre. Chaque commanderie de chaque prieuré européen reverse un tiers de ses revenus annuels au Trésor, à titre de réponse. Le Comun Tesoro contrôle ces déclarations, collecte les morgues (successions des chevaliers décédés) et gère les relations bancaires de l'Ordre avec les Génois et la Curie papale. Ses receveurs et procureurs généraux sont nommés par le Grand Maître et forment le contrepoids magistral au Conseil basé sur la langue, liant les prieurés à l'autorité fiscale magistrale par le biais de la centralisation de Lascaris (1636-1657) et du Codice del Ordine de Rohan (1782)."
 AUTO_MODIFIER_NAME_nd_hos_bureaucracy_authority: "Autorité Magistrale"
 AUTO_MODIFIER_DESC_nd_hos_bureaucracy_authority: "The Sacred and Sovereign Council of the Order may keep two permanent offices standing at once, drawn from the Council of the Tongues, the Tribunale degli Armamenti, the Sacra Infermeria, and the Common Treasury: the four pillars of the Order's mature constitutional state."
 STATIC_MODIFIER_NAME_nd_hos_militant_brotherhood: "Ordre souverain de Saint-Jean"
 STATIC_MODIFIER_DESC_nd_hos_militant_brotherhood: "Le noyau institutionnel du Couvent : les frères-chevaliers liés par des vœux monastiques, les huit langues confédérées sous le Grand Maître, le bras militaire du Pape dans la souveraineté temporelle. Le clergé dirige les hôtes de l'Ordre en personne ; les murs de la forteresse sont plus hauts que n'importe quel royaume laïc ; le caractère du couvent dérive vers la guerre sainte selon une ancienne coutume. L’Ordre ne peut pas être détourné de la foi catholique. Vanilla army_order_reform peut être activé officiellement via l'onglet Gouvernement pour verrouiller le titre."
