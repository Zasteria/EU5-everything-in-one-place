l_french:
 STATIC_MODIFIER_NAME_nd_sia_warrior_kings: "L'héritage des rois guerriers"
 STATIC_MODIFIER_DESC_nd_sia_warrior_kings: "Depuis les conquêtes de Ramkhamhaeng jusqu'à la libération de Naresuan, les rois du Siam ont toujours pris les devants. La fondation de ce royaume perpétue une tradition martiale forgée au cours de siècles de guerre contre la Birmanie, le Cambodge et les États malais."
 STATIC_MODIFIER_NAME_nd_sia_venice_of_the_east: "Venise de l'Est"
 STATIC_MODIFIER_DESC_nd_sia_venice_of_the_east: "Les marchés flottants, les quartiers étrangers et les maisons de commerce royales d'Ayutthaya attiraient des marchands de Chine, du Japon, de Perse et d'Europe. La richesse du royaume coulait à travers ses rivières et sa tolérance envers les croyances et coutumes étrangères en faisait le carrefour commercial de l'Asie du Sud-Est."
 nd_sia.1.t: "L'unification du Siam"
 nd_sia.1.d: "The Thai lands are united under one crown. From the rice paddies of the Chao Phraya to the highland valleys of the north, the Siamese kingdom commands a realm of immense strategic importance, astride the trade routes linking China to India, blessed with fertile river plains, and defended by mountain passes and monsoon-fed rivers.\n\nBut what manner of kingdom shall this be? The warrior traditions of Sukhothai and the martial glory of Naresuan's elephant-back duel against Burma beckon toward military supremacy. Yet the cosmopolitan legacy of Ayutthaya, where Japanese samurai served alongside Persian merchants and Portuguese traders, points toward a different destiny: Siam as the great entrepot of the East.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_sia.1.a: "Nous serons des rois de guerre, comme Naresuan."
 nd_sia.1.b: "Nous serons les rois du commerce, comme l’était Ayutthaya."
 STATIC_MODIFIER_NAME_nd_sia_naresuan_military: "Les réformes militaires de Naresuan"
 STATIC_MODIFIER_DESC_nd_sia_naresuan_military: "À l'instar du roi Naresuan, l'armée est réorganisée autour de soldats professionnels et de forces permanentes plutôt que de levées de corvées saisonnières."
 STATIC_MODIFIER_NAME_nd_sia_naresuan_commerce: "L'héritage commercial de Naresuan"
 STATIC_MODIFIER_DESC_nd_sia_naresuan_commerce: "La paix gagnée par les victoires de Naresuan ouvre le royaume à un commerce accru, Ayutthaya devenant l'un des plus grands centres commerciaux d'Asie."
 nd_sia.2.t: "Le duel d'éléphants de Nong Sarai"
 nd_sia.2.d: "In the sweltering heat of the battlefield at Nong Sarai, a moment has arrived that will define Siam for centuries. The Burmese crown prince Mingyi Swa, mounted atop his war elephant, has challenged the Siamese king to single combat, a duel of honor between sovereigns in the ancient tradition.\n\nThe Siamese champion accepts. In a thundering clash of war elephants, the Burmese prince falls. With his death, Burma's hold over Siam shatters. The kingdom is liberated, and the name of Naresuan becomes immortal. But how shall this victory be used? Naresuan himself turned to military reform, creating standing forces that could strike deep into enemy territory. Others would use the breathing space to expand Ayutthaya's trading networks across Asia."
 nd_sia.2.a: "Réformez les armées : le Siam ne sera plus jamais conquis."
 nd_sia.2.b: "Agrandissez les maisons de commerce. Que la victoire apporte la prospérité."
 STATIC_MODIFIER_NAME_nd_sia_chakri_centralization: "Centralisation des chakras"
 STATIC_MODIFIER_DESC_nd_sia_chakri_centralization: "Les rois Chakri consolident l'autorité royale, plaçant les seigneurs provinciaux et les affluents lointains sous le contrôle de Bangkok."
 STATIC_MODIFIER_NAME_nd_sia_chakri_openness: "Ouverture des chakras"
 STATIC_MODIFIER_DESC_nd_sia_chakri_openness: "La cour Chakri s’engage dans la science, la technologie et la diplomatie européennes, positionnant le Siam comme un État moderne capable de tenir tête aux puissances coloniales."
 nd_sia.3.t: "La fondation de la dynastie Chakri"
 nd_sia.3.d: "The ashes of Ayutthaya have settled, but from them rises a new order. General Chakri, the brilliant commander who helped reunify the kingdom, has established a new dynasty and moved the capital across the river to Rattanakosin, the site that will become Bangkok.\n\nRama I, as the new king styles himself, faces the task of rebuilding not just a city but a civilization. The Burmese destruction of Ayutthaya obliterated centuries of legal codes, religious texts, and administrative records. The new king commissions a complete revision of the Tripitaka, codifies the laws anew, and constructs the magnificent Temple of the Emerald Buddha.\n\nShall the Chakri dynasty centralize power in the new capital, creating a stronger and more unified state? Or shall it open Siam to the world, embracing the foreign knowledge and trade that will be needed to survive in an age of European expansion?"
 nd_sia.3.a: "Centralisez le royaume sous le trône Chakri."
 nd_sia.3.b: "Ouvrez les portes : le Siam doit apprendre du monde."
 nd_sia_sangha_tradition: "Tradition de la Sangha"
 nd_sia_sangha_tradition_desc: "La Sangha bouddhiste constitue l’épine dorsale spirituelle de la société siamoise. Le patronage royal des monastères et l'ordination des moines maintiennent l'harmonie sociale et la dévotion religieuse dans tout le royaume."
 nd_sia_phrai_corvee: "Système Phrai Corvée"
 nd_sia_phrai_corvee_desc: "Le système Phrai enrôle des hommes ordinaires pour six mois de service annuel auprès de la couronne, en tant que soldats, ouvriers ou artisans. Chaque homme porte un tatouage marquant son département et ses obligations."
 nd_sia_rice_granary_system: "Greniers à riz royaux"
 nd_sia_rice_granary_system_desc: "Des greniers centralisés collectent et redistribuent les récoltes de riz du royaume, assurant la sécurité alimentaire et permettant la mobilisation des armées sans affamer les provinces."
 nd_sia_sakdina_hierarchy: "Hiérarchie Sakdina"
 nd_sia_sakdina_hierarchy_desc: "Le système Sakdina attribue à chaque personne un rang numérique mesuré en unités de rizière, du roi au plus petit roturier. Cette hiérarchie détermine les obligations de corvée, le statut juridique et l'accès aux faveurs royales."
 nd_sia_khlong_engineering: "Ingénierie du canal de Khlong"
 nd_sia_khlong_engineering_desc: "Des réseaux de canaux, de khlongs, sillonnent le delta de Chao Phraya, irriguant les rizières, transportant les marchandises et reliant les communautés. Ces voies navigables sont les artères de la civilisation siamoise."
 nd_sia_thai_silk_tradition: "Tradition de la soie thaïlandaise"
 nd_sia_thai_silk_tradition_desc: "Le tissage de la soie siamoise produit des tissus d'une qualité et d'un motif distinctifs, prisés dans toute l'Asie. La combinaison de la culture locale du mûrier et des artisans qualifiés crée une exportation de luxe d’une valeur durable."
 nd_sia_royal_fleet: "Barges de guerre royales"
 nd_sia_royal_fleet_desc: "La flotte royale siamoise de barges de guerre patrouille dans la Chao Phraya et le golfe de Siam, projetant l'autorité royale le long des voies navigables et des routes commerciales côtières du royaume."
 nd_sia_phraklang_system: "Maisons de commerce de Phraklang"
 nd_sia_phraklang_system_desc: "The Phraklang, Minister of the Royal Treasury, oversees all foreign trade through specialized bureaus: one for Western merchants, another for Eastern. This royal monopoly channels enormous wealth into the crown's coffers."
 nd_sia_cosmopolitan_court: "Cour cosmopolite"
 nd_sia_cosmopolitan_court_desc: "La cour siamoise accueille des marchands, des aventuriers et des érudits du monde connu. Les samouraïs japonais servent de gardes royaux, les marchands chinois dominent le commerce fluvial, les diplomates perses dirigent les affaires de l'État et les missionnaires européens prêchent librement."
 nd_sia_devaraja_tradition: "La royauté divine Devaraja"
 nd_sia_devaraja_tradition_desc: "Drawing from Khmer traditions, the Siamese king is consecrated as a divine being on earth through the Hindu Rajabhisekha ceremony, performed by the Brahmins of the court. The Devaraja concept elevates the monarch above all earthly authority."
 nd_sia_artisan_guilds: "Guildes royales d'artisans"
 nd_sia_artisan_guilds_desc: "The royal court patronizes guilds of skilled craftsmen producing lacquerware, gold leaf, and ornamental metalwork. These luxury goods serve both as diplomatic gifts and trade commodities. The craftsmen are gathered in the Chang Sip Mu, the royal department of the ten crafts."
 nd_sia_palatine_law: "Codification du droit palatin"
 nd_sia_palatine_law_desc: "Le Code des Trois Sceaux établit un cadre juridique complet régissant l'héritage, la propriété, la justice pénale et les obligations du système Phrai. Écrit sur des manuscrits en feuilles de palmier et estampillé des sceaux royaux, il met de l'ordre dans le royaume."
 nd_sia_krom_asa_guards: "Gardes royaux de Krom Asa"
 nd_sia_krom_asa_guards_desc: "Les Krom Asa sont les soldats professionnels du roi, non pas des corvées saisonnières, mais des guerriers à plein temps entretenus aux frais du roi. Ils forment le noyau d’élite de l’armée siamoise, entraînés au combat rapproché et à la loyauté personnelle envers le trône."
 nd_sia_junk_fleet: "Flotte de jonques siamoises"
 nd_sia_junk_fleet_desc: "Des jonques de style chinois, construites dans des chantiers navals siamois sous supervision chinoise, transportent des marchandises commerciales siamoises à travers la mer de Chine méridionale. Rapides, maniables et bien armés pour leur taille, ils sont aussi efficaces comme marchands que comme pillards."
 nd_sia_liberation_wars: "Guerres de libération"
 nd_sia_liberation_wars_desc: "Des siècles de domination birmane se terminent avec les rois siamois qui refusent de se soumettre. Les guerres de libération, du duel d'éléphants de Naresuan à la défense d'Ayutthaya, forgent une identité nationale définie par la résistance et la souveraineté."
 nd_sia_pom_fortification: "Fortifications frontalières de Pom"
 nd_sia_pom_fortification_desc: "Les forteresses siamoises, pom, gardent les cols occidentaux contre l'invasion birmane et les approches sud contre les raids malais. Construits en brique et en terre, ils ancrent les lignes défensives le long des rivières et des trouées des montagnes."
 nd_sia_foreign_quarters: "Administration des quartiers étrangers"
 nd_sia_foreign_quarters_desc: "Des quartiers désignés pour les communautés japonaises, chinoises, portugaises, néerlandaises et autres communautés étrangères permettent à Ayutthaya de gérer sa population cosmopolite. Chaque communauté est gouvernée par son propre chef mais soumise à l'autorité royale siamoise."
 nd_sia_royal_monopoly: "Monopole commercial royal"
 nd_sia_royal_monopoly_desc: "La couronne siamoise revendique le droit exclusif du commerce des produits clés, de l'étain, du teck, des peaux de cerf et des bois aromatiques. Les marchands étrangers doivent traiter par l'intermédiaire d'agents royaux, garantissant ainsi que le roi reste le marchand le plus riche du royaume."
 nd_sia_golden_age: "L'âge d'or d'Ayutthaya"
 nd_sia_golden_age_desc: "À son apogée, Ayutthaya rivalise avec n’importe quelle ville du monde en termes de richesse et de splendeur. Les flèches de ses temples percent le ciel, ses canaux regorgent de commerces et sa cour éblouit les ambassadeurs étrangers avec des cérémonies élaborées et une sophistication diplomatique."
 nd_sia_rice_export: "Économie d’exportation de riz"
 nd_sia_rice_export_desc: "Le delta fertile du Chao Phraya produit des excédents de riz qui nourrissent non seulement le Siam mais aussi les royaumes et partenaires commerciaux voisins. Le riz devient le fondement de l’économie d’exportation siamoise, échangé contre des produits de luxe provenant de toute l’Asie."
 nd_sia_thahan_suea_tradition: "Tradition Thahan Suea"
 nd_sia_thahan_suea_tradition_desc: "Les Soldats Tigres, Thahan Suea, représentent la modernisation de l'armée siamoise. Au-delà de la guerre des éléphants et des corvées, ces professionnels réguliers s'entraînent avec des armes à feu et une discipline de style européen."
 nd_sia_taksin_reconquest: "La reconquête de Taksin"
 nd_sia_taksin_reconquest_desc: "Après la chute catastrophique d'Ayutthaya face à la Birmanie en 1767, le général Taksin rallie les forces thaïlandaises dispersées et reconquiert en une seule décennie tous les territoires perdus, réunifiant le royaume depuis sa nouvelle capitale à Thonburi."
 nd_sia_chakri_founding: "Fondation de la dynastie Chakri"
 nd_sia_chakri_founding_desc: "Le général Chakri fonde une nouvelle dynastie et déplace la capitale à Rattanakosin, Bangkok, la plaçant pour la défense derrière les barrières fluviales et canalisées. Le grand palais et le temple du Bouddha d'émeraude deviennent les symboles d'une civilisation thaïlandaise renouvelée."
 nd_sia_tripitaka_revision: "Renouveau biblique du Tripitaka"
 nd_sia_tripitaka_revision_desc: "Rama I commande une révision complète et une recopie du Tripitaka bouddhiste, rassemblant des moines de tout le royaume pour reconstruire les textes sacrés détruits lors de la chute d'Ayutthaya. Cet effort scientifique monumental préserve l’apprentissage Theravada pour les générations futures."
 nd_sia_bowring_treaty: "Traité Bowring"
 nd_sia_bowring_treaty_desc: "Le traité de 1855 avec la Grande-Bretagne abolit le monopole commercial royal et ouvre le Siam au libre-échange. Tout en limitant la souveraineté siamoise sur les tarifs douaniers, cela modernise également l’économie, transformant le Siam d’un royaume semi-fermé en un acteur du marché mondial."
 nd_sia_diplomatic_balance: "Équilibre diplomatique"
 nd_sia_diplomatic_balance_desc: "La survie du Siam à l’ère du colonialisme dépend de sa capacité à opposer les Britanniques aux Français, et les Néerlandais aux Américains. Des diplomates talentueux naviguent dans ces eaux dangereuses, cédant des territoires périphériques pour préserver l'indépendance du royaume."
 nd_sia_modernization_reforms: "Réformes de modernisation"
 nd_sia_modernization_reforms_desc: "Les rois Chakri entreprennent des réformes radicales : une bureaucratie moderne remplace les fonctions féodales, des fonctionnaires salariés remplacent les administrateurs de corvée et des codes juridiques occidentaux sont adoptés parallèlement au droit traditionnel. Le Siam se transforme de l'intérieur pour éviter d'être transformé par des étrangers."
 nd_sia_uncolonized_sovereignty: "Une souveraineté invaincue"
 nd_sia_uncolonized_sovereignty_desc: "Seul parmi les États d’Asie du Sud-Est, le Siam n’a jamais été colonisé. Grâce à la ruse diplomatique, à la dissuasion militaire et à une modernisation opportune, le royaume siamois préserve sa souveraineté tandis que tous ses voisins tombent aux mains des empires européens."
 a_nd_sia_phrai_luang: "Phrai Luang"
 a_nd_sia_phrai_luang_desc: "Conscrits de corvée issus de la population commune sous le système Phrai. Chacun porte un tatouage marquant son département assigné et son service obligatoire envers la couronne."
 n_nd_sia_royal_war_barge: "Barge de guerre royale"
 n_nd_sia_royal_war_barge_desc: "Barges de guerre ornées mais mortelles de la flotte royale siamoise, conçues pour les combats fluviaux et les patrouilles côtières le long de la Chao Phraya et du golfe de Siam."
 a_nd_sia_krom_asa: "Krom Asa"
 a_nd_sia_krom_asa_desc: "Gardes royaux professionnels entretenus aux frais personnels du roi. Contrairement aux corvées, les Krom Asa servent toute l'année, formant le noyau d'élite de l'armée siamoise."
 n_nd_sia_trade_junk: "Jonque commerciale siamoise"
 n_nd_sia_trade_junk_desc: "Des jonques commerciales de style chinois construites dans des chantiers navals siamois, aussi performantes que des navires marchands et des navires de guerre légers. Rapides et résistants aux intempéries, ils transportent des marchandises siamoises à travers la mer de Chine méridionale."
 a_nd_sia_thahan_suea: "Thahan Suéa"
 a_nd_sia_thahan_suea_desc: "Soldats Tigres, soldats réguliers siamois modernisés entraînés avec des armes à feu et des formations disciplinées, représentant la transition de la guerre traditionnelle à la guerre moderne."
 nd_sia_wat: "Wat"
 nd_sia_wat_desc: "Un complexe de temples bouddhistes Theravada servant de centre spirituel, éducatif et social des communautés siamoises. Le patronage royal de la Sangha maintient le système Wat dans tout le royaume."
 nd_sia_khlong: "Canal Khlong"
 nd_sia_khlong_desc: "Un canal artificiel reliant les voies navigables du delta du Chao Phraya, servant de canal d'irrigation, de voie de transport et d'infrastructure de contrôle des inondations."
 nd_sia_phraklang: "Maison de commerce de Phraklang"
 nd_sia_phraklang_desc: "Un bureau royal d'administration commerciale où les marchands étrangers doivent s'enregistrer, payer des droits et négocier par l'intermédiaire des agents du ministre de Phraklang pour accéder aux marchés siamois."
 nd_sia_pom: "Forteresse de Pom"
 nd_sia_pom_desc: "Une fortification frontalière siamoise en brique, terre et bois, protégeant les passages de rivières et les cols de montagne contre l'invasion."
 nd_sia_rong_si: "Rong Si"
 nd_sia_rong_si_desc: "Un grenier à riz royal où les récoltes du royaume sont collectées, stockées et redistribuées, assurant la sécurité alimentaire et permettant la mobilisation militaire."
 nd_sia_thewasathan: "Thewasathan"
 nd_sia_thewasathan_desc: "The shrine of the court Brahmins, where the king is consecrated in the Rajabhisek, the great swing is ridden for Shiva at the Triyampawai, and the first furrow of the year is blessed."
 nd_sia_foreign_quarter: "Foreign Quarter"
 nd_sia_foreign_quarter_desc: "A settlement outside the city walls granted to a foreign community: the Japanese of Ban Yipun, the Portuguese, the Chinese, the Persians or the Dutch, each under a headman answerable to the Phraklang."
 nd_sia_khlang_sinkha: "Khlang Sinkha"
 nd_sia_khlang_sinkha_desc: "A royal warehouse where the suai, the tribute in kind of the provinces, is gathered: tin, teak, sappanwood, ivory and hides taken at the king's price and held for the king's ships."
 nd_sia_ho_trai: "Ho Trai"
 nd_sia_ho_trai_desc: "A monastery library raised on posts over a pond, where the palm-leaf books of the Tripitaka are kept in gilt cabinets out of reach of ants and damp."
 nd_sia_thewasathan_maintenance: "Shrine Rites"
 nd_sia_thewasathan_maintenance_desc: "Incense and lamps for the altars of Shiva and Vishnu, and white cloth for the Brahmins who serve them."
 nd_sia_foreign_quarter_maintenance: "Quarter Upkeep"
 nd_sia_foreign_quarter_maintenance_desc: "Timber for the houses on the river bank, brick for the churches and godowns, and tools for the craftsmen of each community."
 nd_sia_khlang_sinkha_maintenance: "Warehouse Operations"
 nd_sia_khlang_sinkha_maintenance_desc: "Timber for the sheds and crates, tools for the porters, and paper for the tally of what each province owes."
 nd_sia_ho_trai_maintenance: "Library Upkeep"
 nd_sia_ho_trai_maintenance_desc: "Writing materials for the copyists, timber for the posts and walkway, and lacquer for the manuscript cabinets."
 nd_sia_wat_maintenance: "Entretien de l'eau"
 nd_sia_wat_maintenance_desc: "L'entretien des bâtiments des temples, des statues bouddhistes et des terrains de cérémonie en utilisant du bois local, de la poterie, de la cire d'abeille pour les lampes sacrées et de l'encens pour les offrandes rituelles."
 nd_sia_khlong_maintenance: "Entretien de Khlong"
 nd_sia_khlong_maintenance_desc: "Le dragage, la réparation et l'expansion en cours des réseaux de canaux pour maintenir le débit de l'eau et la navigabilité, consomment du bois pour les écluses, de la pierre pour les remblais et des outils pour les ouvriers."
 nd_sia_phraklang_maintenance: "Administration de Phraklang"
 nd_sia_phraklang_maintenance_desc: "Les frais administratifs liés au fonctionnement des maisons de commerce royales, y compris la tenue des registres sur papier, la teinture des documents officiels, l'inspection des droits sur le sel et les tissus fins comme cadeaux de cérémonie pour les marchands étrangers."
 nd_sia_pom_maintenance: "Garnison de Pom"
 nd_sia_pom_maintenance_desc: "L'entretien des murs de la forteresse et le ravitaillement de la garnison : pierres pour les réparations, armes et armes à feu pour les soldats, outils pour l'entretien continu des défenses."
 nd_sia_rong_si_maintenance: "Opérations de grenier"
 nd_sia_rong_si_maintenance_desc: "Les coûts de collecte, de stockage et de distribution du riz des greniers royaux, nécessitant du bois pour l'entretien structurel, des outils pour les ouvriers et des pots de poterie pour le stockage des céréales."
 nd_sia_silk_weaving: "Tissage de soie thaïlandaise"
 nd_sia_silk_weaving_desc: "Silk thread is tied and dyed before it is woven, so that the pattern appears in the cloth as it comes off the loom."
 nd_sia_silk_looms: "Village Silk Looms"
 nd_sia_silk_looms_desc: "Silk is reeled from worms fed on village mulberry and woven on the loom kept under the house. The finished lengths are sold to the court and to foreign merchants."
 nd_sia_chang_sip_mu: "Chang Sip Mu"
 nd_sia_chang_sip_mu_desc: "The royal department of the ten crafts. The king's draughtsmen, carvers, gilders, and lacquerers work here for the palace and the royal monasteries."
 nd_sia_lacquerware: "Laque thaïlandaise"
 nd_sia_lacquerware_desc: "Black lacquer is laid in many coats over wood and the design is washed out in gold leaf. Manuscript cabinets and door panels of this work are made for palaces and monasteries."
 levy_nd_sia_phrai_luang: "Phrai Luang Lévy"
 levy_nd_sia_phrai_luang_desc: "Les conscrits de Corvée accomplissent leur service obligatoire auprès de la couronne sous le système Phrai."
 nd_sia_formed_tt: "Le Siam a été formé"
 nd_sia_path_a_tt: "Choisissez l'héritage des rois guerriers"
 nd_sia_path_b_tt: "J'ai choisi la Venise de l'Est"
 nd_sia_destiny: "Destin du Siam"
 nd_sia_destiny_desc: "Le royaume est fondé et stable. La couronne siamoise doit maintenant décider de la voie qui définira son héritage parmi les nations d’Asie."
 nd_sia_dest_khorat: "Conquête du plateau de Khorat"
 nd_sia_dest_khorat_desc: "Le vaste plateau de Khorat, au-delà des montagnes de Dong Phaya Yen, est la porte d'entrée vers l'Indochine. Prenez Phimai et Champassak pour établir votre domination sur les terres du Mékong et bâtir une armée digne de conquête."
 nd_sia_dest_angkor: "Chute de l'empire khmer"
 nd_sia_dest_angkor_desc: "Les anciens temples d’Angkor représentent la dernière grande civilisation rivale d’Asie du Sud-Est continentale. Prenez Angkor et Battambang pour mettre fin à l’indépendance khmère et absorber leur empire au Siam."
 nd_sia_dest_pegu: "Conquête de Pégu"
 nd_sia_dest_pegu_desc: "The final test of Siamese arms: conquer Pegu, Martaban, and Toungoo, the seat of the kings who took Ayutthaya. Only by breaking Burmese power at its heartland can Siam claim supremacy over all of Indochina."
 nd_sia_dest_banking: "L'essor du royaume commercial"
 nd_sia_dest_banking_desc: "Les fleuves et les ports du Siam sont des artères commerciales. Adoptez les nouvelles institutions financières, assurez la circulation de la soie sur les marchés des capitaux et accumulez la richesse nécessaire à la construction d’un grand État commercial."
 nd_sia_dest_thammarat: "La route commerciale du Sud"
 nd_sia_dest_thammarat_desc: "Nakhon Si Thammarat has been the gateway between the Gulf of Siam and the Indian Ocean for centuries. Control this vital southern port and build up Ayodhya, the river town its trade feeds, into the entrepot of the kingdom."
 nd_sia_dest_ayodhya_developed_tt: "Ayodhya is held and its development is at least #bold 38#!"
 nd_sia_dest_entrepot: "Entrepôt de l'Est"
 nd_sia_dest_entrepot_desc: "Saisissez Malacca, clé de voûte du commerce maritime asiatique. Avec des pierres précieuses qui circulent sur les marchés siamois et un trésor débordant d'or, Siam devient la capitale commerciale du monde oriental."
 nd_sia.4.t: "Le destin du royaume"
 nd_sia.4.d: "The Siamese kingdom stands upon solid foundations. Our temples bring harmony, our fields bring plenty, and our borders hold firm. Now the question turns from survival to greatness.\n\nWhat manner of kingdom shall we build? The path ahead is ours to choose, and the consequences will echo through the ages."
 nd_sia.4.a: "Notre destin nous attend."
 nd_sia.5.t: "Le plateau de Khorat sécurisé"
 nd_sia.5.d: "The Siamese army has crossed the Dong Phaya Yen mountains and planted the royal standard over the Khorat Plateau. Phimai, with its ancient Khmer temple ruins, and the Mekong river town of Champasak now answer to the Siamese crown.\n\nThe road to empire lies open. To the east, the crumbling remnants of the Khmer realm. To the north, the fractious Lao muangs along the Mekong. Siam's warrior kings have proven that the old martial traditions endure."
 nd_sia.5.a: "Que la conquête continue."
 nd_sia.6.t: "La couronne marchande"
 nd_sia.6.d: "The kingdom's coffers overflow. Siamese silk commands premium prices across Asian markets, and the adoption of modern banking has transformed the royal treasury into a commercial engine.\n\nForeign merchants who once passed through on their way to China now linger in Siamese ports, drawn by favorable terms and profitable opportunities. The Venice of the East is no mere title. It is becoming reality."
 nd_sia.6.a: "Que le commerce soit notre force."
 nd_sia.7.t: "Les temples d'Angkor"
 nd_sia.7.d: "Siamese soldiers stand among the towers of Angkor Wat, the greatest temple complex ever built by human hands. The Khmer empire, which once ruled all of mainland Southeast Asia, has fallen to Siamese arms.\n\nBattambang's rice fields and Angkor's ancient prestige are now ours. But governing these conquered peoples requires a choice. Shall we absorb them into the Siamese nation, teaching them our language and customs? Or shall we rule as overlords, collecting tribute while leaving local rulers in place?"
 nd_sia.7.a: "Ils deviendront Siamois de langue et de coutume."
 nd_sia.7.b: "Laissons les seigneurs locaux gouverner en notre nom."
 nd_sia.8.t: "Porte d'accès à l'Océan Indien"
 nd_sia.8.d: "Nakhon Si Thammarat, the ancient port city that straddles the land bridge between the Gulf of Siam and the Andaman Sea, is ours. From here, Siamese merchants can tap the riches of both the South China Sea and the Indian Ocean trade routes.\n\nAyodhya has grown rich on the southern trade, and the question now is how to channel this wealth. Shall the crown build great warehouses and infrastructure to direct trade? Or shall we open our ports freely, inviting the world's merchants to come and enriching ourselves through sheer volume?"
 nd_sia.8.a: "Construisez des entrepôts royaux pour contrôler le flux."
 nd_sia.8.b: "Ouvrez les ports et laissez le commerce circuler librement."
 nd_sia.9.t: "La chute de Pegu"
 nd_sia.9.d: "The ancient Burmese capital of Pegu has fallen. Martaban, the great Mon trading port, flies the Siamese flag. Toungoo, from which the Burmese kings once marched on Ayutthaya, is taken. For the first time in history, a single Tai kingdom commands the entire span of mainland Southeast Asia from the Mekong to the Irrawaddy.\n\nThis is the culmination of centuries of warfare between Siam and Burma. The warrior kings' dream is fulfilled. But how shall this vast empire be governed? Through military garrisons and direct control? Or through a network of river-linked provinces bound by commerce and shared administration?"
 nd_sia.9.a: "Régnez grâce à la force de nos garnisons."
 nd_sia.9.b: "Liez l’empire à travers ses grands fleuves."
 nd_sia.10.t: "Le détroit de Malacca"
 nd_sia.10.d: "Malacca, the great entrepot through which half the world's trade must pass, answers to the Siamese crown. Gems and spices, silk and porcelain flow through markets that now fly our flag. The treasury is vast beyond imagining.\n\nSiam has achieved what Ayutthaya's merchants could only dream of: not just a prosperous trading kingdom, but command of the maritime chokepoint that connects East and West. The question now is how to wield this power. Shall we dominate the strait through naval supremacy, controlling who may pass? Or shall we use our position to project diplomatic influence and commercial reach across the known world?"
 nd_sia.10.a: "Commandez le détroit avec nos navires de guerre."
 nd_sia.10.b: "Que notre commerce atteigne tous les rivages."
 STATIC_MODIFIER_NAME_nd_sia_dest_khmer_assimilation: "Assimilation khmère"
 STATIC_MODIFIER_DESC_nd_sia_dest_khmer_assimilation: "Les populations khmères conquises sont absorbées par l'État siamois, apprenant la langue et les coutumes thaïlandaises sous la direction de gouverneurs nommés par la couronne."
 STATIC_MODIFIER_NAME_nd_sia_dest_khmer_tributaries: "Système affluent khmer"
 STATIC_MODIFIER_DESC_nd_sia_dest_khmer_tributaries: "Les seigneurs khmers locaux gouvernent leurs provinces en tant qu'affluents siamois, maintenant l'ordre pendant que leurs terres se remettent de la conquête."
 STATIC_MODIFIER_NAME_nd_sia_dest_royal_warehouses: "Entrepôts royaux"
 STATIC_MODIFIER_DESC_nd_sia_dest_royal_warehouses: "Les entrepôts et les projets de construction contrôlés par la Couronne canalisent le commerce et le développement via les institutions royales, construisant ainsi l'infrastructure commerciale du royaume."
 STATIC_MODIFIER_NAME_nd_sia_dest_free_trade_ports: "Ports de libre-échange"
 STATIC_MODIFIER_DESC_nd_sia_dest_free_trade_ports: "Les ports ouverts attirent les marchands et les marins étrangers, augmentant ainsi la capacité maritime du royaume, même s'ils rendent les guerres offensives plus coûteuses à justifier."
 STATIC_MODIFIER_NAME_nd_sia_dest_siamese_hegemony: "Hégémonie siamoise"
 STATIC_MODIFIER_DESC_nd_sia_dest_siamese_hegemony: "Les garnisons militaires à travers l'empire projettent la puissance siamoise, avec des arsenaux produisant des armes à grande vitesse, bien que la marine soit négligée au profit des forces terrestres."
 STATIC_MODIFIER_NAME_nd_sia_dest_five_rivers: "Empire des Cinq Rivières"
 STATIC_MODIFIER_DESC_nd_sia_dest_five_rivers: "Les grands fleuves (Chao Phraya, Mékong, Salween, Irrawaddy et leurs affluents) unissent l’empire, permettant un renforcement rapide et une réduction de l’attrition sur de vastes distances."
 STATIC_MODIFIER_NAME_nd_sia_dest_strait_masters: "Maîtres du détroit"
 STATIC_MODIFIER_DESC_nd_sia_dest_strait_masters: "Les navires de guerre siamois patrouillent dans le détroit de Malacca, projetant leur puissance navale sur les routes commerciales. Un réseau de renseignement sophistiqué protège contre les rivaux cherchant à saper la domination siamoise."
 STATIC_MODIFIER_NAME_nd_sia_dest_siam_enthroned: "Le Siam intronise"
 STATIC_MODIFIER_DESC_nd_sia_dest_siam_enthroned: "Le prestige diplomatique et les réseaux commerciaux du Siam s'étendent à travers le monde connu, des îles aux épices jusqu'aux cours de royaumes lointains. Les marchands et envoyés siamois sont les bienvenus partout."
 nd_sia_khlang_supha: "Khlang Supha"
 nd_sia_khlang_supha_desc: "Un arsenal royal et une manufacture de munitions où sont produits et stockés des armes, des armes à feu et du matériel militaire pour l'armée impériale siamoise."
 nd_sia_khlang_supha_maintenance: "Opérations d'Arsenal"
 nd_sia_khlang_supha_maintenance_desc: "La production et l’entretien continus d’armes et d’équipements militaires, consommant du fer pour les armes, de la poudre à canon pour les armes à feu, de la pierre pour les fortifications et des outils pour les artisans."
 nd_sia_talat_yai: "Talat Yai"
 nd_sia_talat_yai_desc: "Un grand bazar et un lieu d'échange commercial où les marchands de toute l'Asie se rassemblent pour échanger des produits de luxe, négocier des contrats et régler leurs comptes sous l'œil vigilant du Phraklang."
 nd_sia_talat_yai_maintenance: "Opérations de bazar"
 nd_sia_talat_yai_maintenance_desc: "Les frais administratifs liés au fonctionnement du grand bazar, y compris les tissus fins pour les étalages des marchands, le papier pour les contrats commerciaux, l'inspection des droits sur le sel et le poivre importé comme échantillon de marchandises."

 # ===== BUREAUCRACIES =====
 sia_chatusadom_bureaucracy: "Chatusadom"
 sia_chatusadom_bureaucracy_desc: "La loi palatine du roi Trailokanat de 1454 a réorganisé Ayutthaya autour de quatre ministères centraux : Wiang (ville), Wang (palais), Khlang (trésor et commerce) et Na (agriculture et irrigation). Le Chatusadom a remplacé les anciens seigneurs muang par des départements répondant directement au trône, devenant ainsi l'épine dorsale structurelle de chaque gouvernement thaïlandais, de Trailok à la Réforme Chakri de 1892."
 sia_phra_khlang_sinkha_bureaucracy: "Phra Khlang Sinkha"
 sia_phra_khlang_sinkha_bureaucracy_desc: "Le Département des Entrepôts Royaux gérait le commerce extérieur d'Ayutthaya comme un monopole d'État. Les jonques chinoises accostaient aux quais du Khlang, les agents du roi fixaient les prix de l'étain, du bois de sappan et du poivre, et les sociétés à charte européennes négociaient par l'intermédiaire du bureau du Phra Khlang plutôt qu'avec des marchands privés. L'ascension de Constantin Phaulkon à la tête du bureau sous le roi Narai (r. 1656-1688) en fit brièvement le poste le plus puissant du royaume."
 sia_sakdina_bureaucracy: "Registre Sakdina"
 sia_sakdina_bureaucracy_desc: "Codified by Trailokanat in 1454, the Sakdina or rice-field-power system assigned every subject a numerical rank measured in rai of rice-land, from a slave's 5 sakdina to the Maha Uparat's 100,000. The Krom registers tracked every man's rank and corvee obligation; the number set court precedence, robe colour, house size, and the punishments inflicted under the Three Seal Law. The ranks were not formally abolished until 1932."
 sia_phrai_suay_bureaucracy: "Rouleaux d'hommage à Phrai Suay"
 sia_phrai_suay_bureaucracy_desc: "Les peuples des collines et les minorités frontalières payaient le Suay (un tribut en nature composé de produits forestiers tels que le bois de sappan, l'ivoire, le bois d'aigle, la cardamome, l'étain et la poussière d'or) à la place de la corvée. Les rouleaux Krom attribuaient à chaque communauté des hautes terres un quota et un officier patron thaïlandais pour l'extraire. Le système a enrichi généreusement le trône et ses nobles, mais a gardé les peuples non thaïlandais comme sujets sans les intégrer, engendrant des rébellions chroniques à Lan Na, sur le plateau de Khorat et dans le sud malais."
 sia_maha_sangharaja_bureaucracy: "Hiérarchie Maha Sangharaja"
 sia_maha_sangharaja_bureaucracy_desc: "The Maha Sangharaja (Supreme Patriarch) heads the Thai Sangha and is appointed by the king. Beneath him, royally-chartered monasteries graded their monks through nine Pali Pariyatti examinations on the Tipitaka, the same examinations that produced the literate civil-religious class staffing the lower bureaucracy. Rama I's purification council of 1788 redefined orthodox practice across the kingdom for the next two centuries."
 sia_three_seal_law_bureaucracy: "Loi des trois sceaux"
 sia_three_seal_law_bureaucracy_desc: "Le Kotmai Tra Sam Duang, connu sous le nom de Loi des Trois Sceaux, est l'épine dorsale bureaucratique de la justice thaïlandaise. Rédigé sous Trailokanat sous le nom de Phra Aiyakan, dévasté lorsque les Birmans ont mis à sac Ayutthaya en 1767, et reconstitué en 1805 par Rama I à partir de fragments survivants estampillés des sceaux du Khlang, du Mahatthai et du Kalahom, il définit la procédure pénale, le droit de la propriété et les punitions graduées sous Sakdina, réduisant considérablement la juridiction noble sur les roturiers."

 # ===== BUREAUCRACY AUTHORITY (slot grant on formation) =====
 AUTO_MODIFIER_NAME_nd_sia_bureaucracy_authority: "Autorité bureaucratique"
 AUTO_MODIFIER_DESC_nd_sia_bureaucracy_authority: "On the unification of Siam, the throne gains the administrative reach to host the historical institutions of Ayutthaya and Rattanakosin. Three of them may be kept at a time."
