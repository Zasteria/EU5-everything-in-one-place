l_french:
 STATIC_MODIFIER_NAME_nd_usa_revolutionary_republic: "Esprit de 76"
 STATIC_MODIFIER_DESC_nd_usa_revolutionary_republic: "La ferveur révolutionnaire qui a donné naissance à la République coule dans les veines de la nation. L’esprit de liberté, d’autonomie gouvernementale et de résistance à la tyrannie inspire chaque citoyen-soldat à défendre le nouvel ordre."
 STATIC_MODIFIER_NAME_nd_usa_manifest_destiny: "Destin manifeste"
 STATIC_MODIFIER_DESC_nd_usa_manifest_destiny: "La conviction que la Providence a ordonné l’expansion américaine d’une mer à l’autre pousse les colons vers l’ouest, transformant chaque année la nature sauvage en civilisation."
 STATIC_MODIFIER_NAME_nd_usa_city_on_a_hill: "Ville sur une colline"
 STATIC_MODIFIER_DESC_nd_usa_city_on_a_hill: "L’expérience américaine en matière de gouvernement républicain constitue un phare pour le monde. Des institutions fortes, une gouvernance démocratique et un État de droit font de cette nouvelle nation un modèle à suivre."
 STATIC_MODIFIER_NAME_nd_usa_federalist_vision: "Vision fédéraliste"
 STATIC_MODIFIER_DESC_nd_usa_federalist_vision: "Un gouvernement central fort, doté de pouvoirs énumérés, lie les États en une union plus parfaite. Le système financier de Hamilton et les précédents de Washington confèrent à la république une force institutionnelle."
 STATIC_MODIFIER_NAME_nd_usa_states_rights: "L'esprit des antifédéralistes"
 STATIC_MODIFIER_DESC_nd_usa_states_rights: "La souveraineté des États et les droits des peuples constituent un rempart contre la tyrannie. La gouvernance locale et la liberté religieuse prospèrent sous une autorité décentralisée."
 STATIC_MODIFIER_NAME_nd_usa_second_war_independence: "Seconde Guerre d'Indépendance"
 STATIC_MODIFIER_DESC_nd_usa_second_war_independence: "La victoire sur l’ancienne mère patrie a prouvé que la puissance navale américaine peut défier la plus grande flotte du monde. Les Old Ironsides et ses frégates sœurs ont acquis une gloire éternelle."
 STATIC_MODIFIER_NAME_nd_usa_era_national_unity: "L'ère de l'unité nationale"
 STATIC_MODIFIER_DESC_nd_usa_era_national_unity: "La défense réussie de la république contre l’agression étrangère a forgé un nouveau sentiment d’identité nationale. Les Américains ne sont plus d’abord des Virginiens ou des New-Yorkais, ils sont des Américains."
 STATIC_MODIFIER_NAME_nd_usa_hemispheric_shield: "Bouclier hémisphérique"
 STATIC_MODIFIER_DESC_nd_usa_hemispheric_shield: "Les Amériques sont fermées à une nouvelle colonisation européenne. En tant que gardiens de l’hémisphère occidental, les États-Unis revendiquent le droit de s’opposer à toute ingérence de l’Ancien Monde dans les affaires du Nouveau Monde."
 STATIC_MODIFIER_NAME_nd_usa_splendid_isolation: "Splendide isolement"
 STATIC_MODIFIER_DESC_nd_usa_splendid_isolation: "Libérée des alliances enchevêtrées de l’Europe, la république se tourne vers elle-même pour développer ses vastes ressources. La paix à l’étranger et la prospérité intérieure sont les deux piliers de la politique américaine."
 nd_usa.1.t: "Naissance de la République"
 nd_usa.1.d: "The impossible has been achieved. From thirteen quarrelsome colonies clinging to the Atlantic seaboard, a new nation has been forged, the United States of America. The old monarchies of Europe look on with a mixture of contempt and unease, for this republic was born not of dynastic inheritance but of revolutionary principle. The Constitution, drafted in the sweltering heat of a Philadelphia summer, establishes a government unlike any the world has seen: power divided, rights enumerated, and sovereignty vested in the people themselves.\n\nBut the work of nation-building has only begun. The frontier stretches endlessly westward. The treasury is empty and debts from the war remain unpaid. Former allies and enemies alike test the resolve of this infant republic. The question now is not whether America can win its independence, that battle is won, but what kind of nation it will become.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_usa.1.a: "L'arbre de la liberté doit être arrosé."
 nd_usa.1.b: "De la mer à la mer brillante."
 nd_usa.1.c: "Un gouvernement de lois, pas d'hommes."
 nd_usa.2.t: "La Convention constitutionnelle"
 nd_usa.2.d: "In the summer of 1787, fifty-five delegates gathered in Philadelphia to address the fatal weaknesses of the Articles of Confederation. What emerged after four months of fierce debate was not a revision but a revolution, an entirely new framework of government. The great compromise between large and small states, the separation of powers between three co-equal branches, and the delicate balance between federal authority and state sovereignty produced a document that would prove remarkably enduring.\n\nBut the Constitution was not universally welcomed. The Federalists, led by Hamilton, Madison, and Jay, argued passionately for ratification in a series of brilliant essays. The Anti-Federalists, suspicious of centralized power, demanded a Bill of Rights to protect individual liberties. The fundamental question of how much power should reside in the national government versus the states will define American politics for generations."
 nd_usa.2.a: "Un syndicat fort nécessite un gouvernement fort."
 nd_usa.2.b: "Le gouvernement le plus proche du peuple gouverne le mieux."
 nd_usa.3.t: "La guerre de 1812"
 nd_usa.3.d: "When the young republic went to war with Britain in 1812, many expected a swift humiliation. The Royal Navy ruled the waves unchallenged, and the British army had just defeated Napoleon's marshals in Spain. Yet the war produced unexpected triumphs. The USS Constitution, her live oak hull shrugging off British cannonballs, earned the immortal nickname 'Old Ironsides' and proved that American frigates could stand toe-to-toe with the finest warships afloat.\n\nAndrew Jackson's decisive victory at New Orleans, fought, ironically, after peace had already been signed at Ghent, transformed national morale. The burning of Washington was avenged, and the republic emerged with a new confidence. Whether this war should inspire a great naval tradition or a renewed spirit of national unity is the question before the nation."
 nd_usa.3.a: "Old Ironsides a montré la voie. Construisez une flotte digne de la république."
 nd_usa.3.b: "La république est justifiée. Laissons la fierté nationale forger l’unité."
 nd_usa.4.t: "La doctrine Monroe"
 nd_usa.4.d: "In his 1823 annual message to Congress, President James Monroe articulated a principle that would reshape the geopolitics of the Western Hemisphere. The Americas, he declared, were no longer open to European colonization. Any attempt by Old World powers to extend their system to any portion of this hemisphere would be viewed as dangerous to American peace and safety.\n\nBacked initially more by British naval power than American strength, the Monroe Doctrine nonetheless established a bold claim: the United States would serve as the guardian of the entire Western Hemisphere. Critics saw overreach; supporters saw the natural extension of republican principles. The doctrine could serve as a shield for hemispheric defense, or as a justification for turning inward and developing the vast American interior in peace."
 nd_usa.4.a: "Les Amériques doivent être libres de toute ingérence européenne."
 nd_usa.4.b: "Laissons le Vieux Monde rester entre lui et nous, le nôtre."
 nd_usa.5.t: "Le Corps de la Découverte"
 nd_usa.5.d: "In May 1804, Meriwether Lewis and William Clark departed St. Louis with a party of thirty-three men, ascending the Missouri River into the unknown interior of the continent. Over the next two years, the Corps of Discovery would travel over eight thousand miles, cross the Rocky Mountains, and reach the Pacific Ocean. Along the way they documented hundreds of plant and animal species unknown to Western science, established contact with dozens of Native American nations, and produced the first accurate maps of the American interior.\n\nThe expedition opened the floodgates of westward expansion. The detailed journals of Lewis and Clark made the vast territory between the Mississippi and the Pacific tangible in the American imagination, no longer a blank space on the map, but a land of rivers, mountains, and limitless possibility."
 nd_usa.5.a: "L'Occident est ouvert."
 nd_usa.6.t: "Le système américain des manufactures"
 nd_usa.6.d: "At the Springfield Armory in Massachusetts, a quiet revolution transformed the nature of production itself. Rather than relying on skilled craftsmen to hand-fit each component, American manufacturers pioneered the use of interchangeable parts, standardized components machined to such precise tolerances that any part could replace any other of the same type. What began with musket production spread rapidly to clocks, sewing machines, and eventually to every corner of American industry.\n\nEuropean visitors marveled at this 'American System of Manufactures,' which sacrificed the artisan's individual skill for something more powerful: the ability to produce enormous quantities of reliable, repairable goods. Combined with Eli Whitney's cotton gin and the rapid expansion of canal and road networks, American manufacturing was poised to transform the economy of a continent."
 nd_usa.6.a: "L’ère des machines commence."
 nd_usa_atlantic_commerce: "Commerce atlantique"
 nd_usa_atlantic_commerce_desc: "Le réseau de routes commerciales coloniales reliant les ports américains aux marchés d’Europe et des Caraïbes, transportant du tabac, du bois, du poisson et du rhum à travers l’océan."
 nd_usa_town_meeting_tradition: "Tradition des réunions municipales"
 nd_usa_town_meeting_tradition_desc: "La pratique de la Nouvelle-Angleterre de gouvernance démocratique directe au niveau local, où des citoyens libres se réunissaient pour débattre et décider de questions d'importance communautaire."
 nd_usa_colonial_militia_tradition: "Tradition de la milice coloniale"
 nd_usa_colonial_militia_tradition_desc: "The colonial practice of every able-bodied man keeping arms and training with the local militia, establishing the citizen-soldier tradition that would define American military culture."
 nd_usa_triangular_trade: "Commerce triangulaire"
 nd_usa_triangular_trade_desc: "Le réseau commercial à trois volets relie les distilleries de la Nouvelle-Angleterre, les marchés aux esclaves africains et les plantations sucrières des Caraïbes, un moteur rentable mais moralement lourd de la richesse coloniale."
 nd_usa_frontier_defense: "Défense des frontières"
 nd_usa_frontier_defense_desc: "La chaîne de palissades et de colonies fortifiées le long de la frontière ouest, protégeant les colons des raids et marquant la frontière avancée de la civilisation américaine."
 nd_usa_minuteman_tradition: "Tradition des Minutemans"
 nd_usa_minuteman_tradition_desc: "La tradition des milices d'élite originaire du Massachusetts, où des hommes sélectionnés s'entraînaient régulièrement et s'engageaient à être prêts à se battre à la minute près pour défendre la liberté."
 nd_usa_colonial_shipbuilding: "Construction navale coloniale"
 nd_usa_colonial_shipbuilding_desc: "Les chantiers navals de la Nouvelle-Angleterre, dotés de bois en abondance et d'artisans qualifiés, produisirent des navires qui rivalisaient avec tous ceux du monde et jetèrent les bases de la puissance navale américaine."
 nd_usa_no_taxation: "Pas de taxation sans représentation"
 nd_usa_no_taxation_desc: "Le principe fondateur de la Révolution américaine : aucun gouvernement ne peut lever des impôts sur un peuple qui n’a pas voix au chapitre dans ses délibérations."
 nd_usa_plantation_economy: "Économie des plantations"
 nd_usa_plantation_economy_desc: "Le système agricole à grande échelle des colonies du Sud, produisant du tabac, du riz, de l'indigo et plus tard du coton destiné à l'exportation vers les marchés européens."
 nd_usa_continental_congress: "Congrès continental"
 nd_usa_continental_congress_desc: "Le premier organe directeur unifié des colonies américaines, où les délégués de treize colonies distinctes se sont réunis pour forger une réponse commune à la tyrannie britannique."
 nd_usa_constitutional_convention: "Convention constitutionnelle"
 nd_usa_constitutional_convention_desc: "Le rassemblement des plus grands esprits politiques américains à Philadelphie, où la Constitution, la loi suprême du pays, a été débattue, rédigée et signée."
 nd_usa_continental_army: "Armée continentale"
 nd_usa_continental_army_desc: "La force militaire professionnelle levée par le Congrès continental, entraînée par le baron von Steuben à Valley Forge, qui a combattu l'Empire britannique jusqu'à l'impasse et a obtenu l'indépendance américaine."
 nd_usa_continental_dragoons: "Dragons continentaux"
 nd_usa_continental_dragoons_desc: "Les troupes à cheval de l'armée continentale, dirigées par des officiers comme « Light-Horse Harry » Lee, qui ont servi comme éclaireurs, raiders et cavalerie de choc pendant la Révolution."
 nd_usa_six_frigates: "Six frégates originales"
 nd_usa_six_frigates_desc: "Les six frégates lourdes autorisées par le Naval Act de 1794, la Constitution, les États-Unis, la Constellation, le Président, le Congrès et la Chesapeake, qui ont fondé la marine américaine."
 nd_usa_privateer_tradition: "Tradition corsaire"
 nd_usa_privateer_tradition_desc: "La tradition américaine consistant à commander des navires privés pour mener une guerre commerciale contre les navires ennemis, qui complétait la petite marine continentale avec des centaines de raiders armés."
 nd_usa_springfield_armory: "Armurerie de Springfield"
 nd_usa_springfield_armory_desc: "La première armurerie nationale, créée en 1777 à Springfield, dans le Massachusetts, est devenue le centre de la fabrication d'armes américaine et le berceau des pièces interchangeables."
 nd_usa_navy_yard_tradition: "Tradition du chantier naval"
 nd_usa_navy_yard_tradition_desc: "Le réseau des chantiers navals fédéraux (Boston, Philadelphie, Norfolk, Portsmouth) où les navires de guerre américains étaient construits, réparés et équipés pour le service."
 nd_usa_customs_revenue_system: "Customs and Revenue Cutters"
 nd_usa_customs_revenue_system_desc: "The system of tariffs and customs duties that Alexander Hamilton designed to fund the federal government and protect nascent American industries from foreign competition, and the fleet of fast cutters he had built to enforce it. Each cutter answers to the collector of customs of its home port: the forerunner of the United States Coast Guard."
 nd_usa_lewis_clark_expedition: "Expédition Lewis et Clark"
 nd_usa_lewis_clark_expedition_desc: "Le voyage épique du Corps of Discovery de Saint-Louis à l'océan Pacifique, cartographiant l'intérieur du continent et ouvrant la voie à une expansion vers l'ouest."
 nd_usa_war_of_1812_tradition: "Tradition de la guerre de 1812"
 nd_usa_war_of_1812_tradition_desc: "Les traditions militaires forgées au cours de la deuxième guerre américaine contre la Grande-Bretagne, depuis les duels navals de frégates jusqu'à la victoire d'Andrew Jackson à la Nouvelle-Orléans."
 nd_usa_monroe_doctrine: "Doctrine Monroe"
 nd_usa_monroe_doctrine_desc: "La déclaration du président Monroe selon laquelle l'hémisphère occidental était fermé à toute colonisation européenne, une affirmation audacieuse de l'influence américaine sur l'ensemble du Nouveau Monde."
 nd_usa_frontiersman_tradition: "Tradition des pionniers"
 nd_usa_frontiersman_tradition_desc: "La tradition des pionniers américains Daniel Boone, Davy Crockett et d'innombrables colons anonymes, tireurs d'élite et bûcherons experts qui ont apprivoisé la nature sauvage avec un fusil et une hache."
 nd_usa_american_shipbuilding: "Construction navale américaine"
 nd_usa_american_shipbuilding_desc: "La maturation de la construction navale américaine, la construction de navires de guerre en chêne naturel et en pin blanc qui étaient à la hauteur des meilleurs navires de la marine européenne."
 nd_usa_american_system_manufactures: "Système américain de fabrication"
 nd_usa_american_system_manufactures_desc: "The revolutionary production method using interchangeable parts and machine tools, pioneered at the Springfield Armory, which would transform American industry.\n\n#italic Available in: $nd_usa_federal_armory$#!"
 nd_usa_judicial_review: "Contrôle judiciaire"
 nd_usa_judicial_review_desc: "Le principe établi par le juge en chef John Marshall dans Marbury c. Madison selon lequel la Cour suprême a le pouvoir d'annuler les lois qui violent la Constitution."
 nd_usa_internal_improvements: "Améliorations internes"
 nd_usa_internal_improvements_desc: "Le vaste programme de construction de canaux, de routes et d’investissements dans les infrastructures qui relie les régions les plus reculées de la république en expansion."
 a_nd_usa_minuteman: "Minuteman"
 a_nd_usa_minuteman_desc: "Sélectionnés parmi les meilleurs hommes de la milice coloniale, les minutemen s'entraînent régulièrement et s'engagent à se rassembler à la minute près. Leur rapidité de réponse et leur connaissance du terrain local en font de redoutables défenseurs de la liberté américaine."
 a_nd_usa_continental_line: "Infanterie de ligne continentale"
 a_nd_usa_continental_line_desc: "Les réguliers disciplinés de l'armée continentale, formés aux tactiques linéaires européennes par le baron von Steuben à Valley Forge. Ils constituent l’épine dorsale de l’armée professionnelle américaine."
 a_nd_usa_continental_dragoon: "Dragon continental"
 a_nd_usa_continental_dragoon_desc: "Troupes montées polyvalentes qui peuvent combattre à cheval ou descendre de cheval pour servir d'infanterie. Menés par de fringants cavaliers comme « Light-Horse Harry » Lee, ils excellent dans les manœuvres de reconnaissance et de flanc."
 n_nd_usa_frigate: "Frégate américaine"
 n_nd_usa_frigate_desc: "Construites avec des charpentes en chêne naturel et des coques gainées de cuivre, les frégates américaines sont plus rapides, plus robustes et plus lourdement armées que leurs homologues européennes. L'USS Constitution, « Old Ironsides », est le navire le plus célèbre de cette classe."
 n_nd_usa_privateer_schooner: "Goélette corsaire"
 n_nd_usa_privateer_schooner_desc: "Des goélettes rapides et agiles commandées comme corsaires pour s'attaquer au commerce ennemi. Ces navires comptent sur la vitesse plutôt que sur la puissance de feu, se précipitant pour s'emparer des prises avant que les navires de guerre plus lourds ne puissent réagir."
 a_nd_usa_frontiersman: "Fusilier Frontierman"
 a_nd_usa_frontiersman_desc: "Des tireurs d'élite experts de la frontière américaine, armés de longs fusils d'une précision remarquable. Ces forestiers robustes connaissent chaque sentier et chaque gué, et leurs tirs ciblés dévastateurs peuvent briser le moral de n'importe quelle force ennemie."
 n_nd_usa_ship_of_the_line: "Navire de ligne américain"
 n_nd_usa_ship_of_the_line_desc: "Un navire de guerre de premier ordre construit dans les chantiers navals américains à partir du meilleur bois de chêne naturel, équipé de plus d'une centaine de canons. Ces navires représentent la maturation de la puissance navale américaine."
 n_nd_usa_revenue_cutter: "Coupeur de revenus"
 n_nd_usa_revenue_cutter_desc: "Des cotres rapides et agiles exploités par la Revenue Marine pour faire respecter les lois douanières, réprimer la piraterie et patrouiller le littoral américain. Le précurseur de la Garde côtière américaine."
 nd_usa_town_meeting_hall: "Salle de réunion municipale"
 nd_usa_town_meeting_hall_desc: "Une salle publique où les citoyens libres se rassemblent pour gouverner leur communauté par le biais de la démocratie directe, en débattant des impôts, en élisant des fonctionnaires et en adoptant des ordonnances locales."
 nd_usa_colonial_warehouse: "Entrepôt colonial"
 nd_usa_colonial_warehouse_desc: "Un entrepôt robuste au bord de l'eau, stockant des marchandises destinées au commerce atlantique, des barils de tabac, des bottes de fourrure, des fûts de rhum, prêts à être chargés sur les navires marchands."
 nd_usa_frontier_stockade: "Palissade de frontière"
 nd_usa_frontier_stockade_desc: "Enceinte fortifiée en bois située à la frontière ouest, offrant un abri aux colons lors des raids et servant de base aux opérations des milices."
 nd_usa_federal_armory: "Armurerie fédérale"
 nd_usa_federal_armory_desc: "Manufacture nationale d'armes produisant des mousquets, des fusils et des munitions à partir de pièces standardisées, l'arsenal de la république."
 nd_usa_navy_yard: "Chantier naval fédéral"
 nd_usa_navy_yard_desc: "Chantier naval géré par le gouvernement pour la construction, la réparation et l'équipement des navires de guerre de la marine américaine."
 nd_usa_customs_house: "Douane fédérale"
 nd_usa_customs_house_desc: "Un imposant bâtiment fédéral où les douaniers évaluent les droits sur les marchandises importées, première source de revenus de la jeune république."
 nd_usa_cotton_gin_workshop: "Atelier d'égrenage de coton"
 nd_usa_cotton_gin_workshop_desc: "Un atelier mécanisé abritant l'égreneuse de coton d'Eli Whitney, qui sépare les fibres de coton de leurs graines à une vitesse révolutionnaire, transformant ainsi l'agriculture du Sud."
 nd_usa_federal_courthouse: "Palais de justice fédéral"
 nd_usa_federal_courthouse_desc: "Un siège du pouvoir judiciaire fédéral où la Constitution est interprétée et l'État de droit respecté, l'incarnation physique du contrôle judiciaire."
 nd_usa_town_hall_upkeep: "Gouvernance des assemblées municipales"
 nd_usa_town_hall_upkeep_desc: "Du papier pour les procès-verbaux et les avis, du bois pour l'entretien de la salle et des livres pour les archives municipales et les références juridiques."
 nd_usa_warehouse_upkeep: "Opérations d'entrepôt"
 nd_usa_warehouse_upkeep_desc: "Lumber for crates and structural maintenance, paper for manifests and trade ledgers, and tools for the hoists and scales."
 nd_usa_stockade_upkeep: "Garnison de palissade"
 nd_usa_stockade_upkeep_desc: "Du bois pour la réparation des palissades, des armes pour la garnison et des outils pour l'entretien constant des fortifications frontalières."
 nd_usa_armory_production: "Fabrication d'armurerie"
 nd_usa_armory_production_desc: "Fer, bois et outils forgés pour fabriquer des mousquets et des fusils standardisés à l'armurerie nationale."
 nd_usa_navy_yard_upkeep: "Opérations du chantier naval"
 nd_usa_navy_yard_upkeep_desc: "Bois, provisions navales et fer consommés pour la construction et la réparation des navires de guerre."
 nd_usa_customs_upkeep: "Administration des douanes"
 nd_usa_customs_upkeep_desc: "Du papier pour les registres et les formulaires, du tissu fin pour les uniformes des douaniers et des outils pour peser et mesurer les marchandises importées."
 nd_usa_cotton_gin_inputs: "Transformation du coton"
 nd_usa_cotton_gin_inputs_desc: "Les fibres brutes sont alimentées par des mécanismes d'égrenage en fer, produisant du coton nettoyé pour l'industrie textile."
 nd_usa_courthouse_upkeep: "Administration des tribunaux"
 nd_usa_courthouse_upkeep_desc: "Papier pour les documents juridiques et les brefs, livres pour les bibliothèques de droit essentielles aux tribunaux fédéraux et mobilier pour les salles d'audience et les chambres."
 nd_usa_rum_distilling: "Distillation du rhum"
 nd_usa_rum_distilling_desc: "Les distilleries de la Nouvelle-Angleterre convertissent le sucre et la mélasse des Caraïbes en rhum, carburant du commerce triangulaire."
 nd_usa_interchangeable_parts: "Pièces interchangeables"
 nd_usa_interchangeable_parts_desc: "Le fer et le charbon alimentent la technique de fabrication révolutionnaire consistant à produire des armes à feu standardisées avec des composants interchangeables, permettant une production de masse et une réparation facile."
 nd_usa_formed_tt: "Les États-Unis ont été formés"
 nd_usa_path_a_tt: "Choisissez l'Esprit de 76"
 nd_usa_path_b_tt: "Choisissez le destin manifeste"
 nd_usa_path_c_tt: "J'ai choisi la ville sur une colline"
 nd_usa_destiny: "Destin américain"
 nd_usa_destiny_desc: "Les États-Unis sont sortis de la révolution pour devenir une nation. La question est maintenant de savoir quel destin cette république poursuivra : un empire continental d’un océan à l’autre, ou un phare de liberté et de force institutionnelle qui transformera le monde par l’exemple."
 nd_usa_dest_frontier: "La frontière nous fait signe"
 nd_usa_dest_frontier_desc: "Push beyond the Appalachians into the vast interior. Claim the Black Hills and the Texas frontier, the first steps in a continental destiny that will not stop until the American flag flies over every horizon."
 nd_usa_dest_pacific: "Destin Pacifique"
 nd_usa_dest_pacific_desc: "The golden shores of California are within reach. Secure San Francisco Bay, build a war chest to fund the westward push, raise an army worthy of a continental power, and take up the trade of the wider world: the Pacific is the road to Canton."
 nd_usa_dest_hemisphere: "Hégémon hémisphérique"
 nd_usa_dest_hemisphere_desc: "L'expression ultime du destin manifeste : la domination américaine des Caraïbes au nord-ouest du Pacifique. Cuba, Panama et la baie de Nootka doivent tous reconnaître la suprématie américaine."
 nd_usa_dest_republic: "L'expérience républicaine"
 nd_usa_dest_republic_desc: "Construire une nation non pas par la conquête mais par les institutions. Adoptez le système bancaire moderne, remplissez le trésor et prouvez qu'une république gouvernée par des lois peut prospérer sans l'épée."
 nd_usa_dest_industry: "La révolution industrielle américaine"
 nd_usa_dest_industry_desc: "From cotton mills to iron foundries, American industry will rival any nation on earth. Embrace the printing press and build up Philadelphia, the first workshop city of the republic."
 nd_usa_dest_philadelphia_developed_tt: "We own #bold Philadelphia#! (Shackamaxon) and its development is at least #bold 3#!"
 nd_usa_dest_beacon: "Phare de la Liberté"
 nd_usa_dest_beacon_desc: "The American experiment reaches its apex: a wealthy, innovative, scientifically advanced republic whose cotton flows through global markets and whose institutions are the envy of the world. New York, at the mouth of the canal, is built into its first city."
 nd_usa_dest_new_york_developed_tt: "We own #bold New York#! (Mannahatta) and its development is at least #bold 9#!"
 nd_usa.7.t: "La République perdure"
 nd_usa.7.d: "Against all odds, the American experiment has survived its infancy. The Constitution holds, the states remain united, and the machinery of republican government turns with increasing confidence. Foreign powers that once dismissed this upstart nation now reckon with its growing strength.\n\nThe republic endures, and now it must decide what manner of nation it will become."
 nd_usa.7.a: "E Pluribus Unum."
 nd_usa.8.t: "La frontière sécurisée"
 nd_usa.8.d: "American settlers and soldiers have pushed deep into the continental interior. The Black Hills, sacred to the Lakota and rich in silver, now lie within the republic's grasp. In East Texas, the old Caddo settlement of Nacogdoches marks the furthest reach of American authority in the Southwest.\n\nThe frontier that once seemed impossibly distant is now the republic's backyard. But the Pacific remains a continent away, and the road westward passes through hostile territory, trackless deserts, and mountain ranges that would give pause to any army."
 nd_usa.8.a: "C’est vers l’ouest que s’étend le cours de l’empire."
 nd_usa.9.t: "Le sentier de l'Oregon"
 nd_usa.9.d: "The American flag flies over San Francisco Bay, the golden gate to the Pacific. Wagon trains, gold seekers, and settlers have carved trails across the continent, and what was once a journey of impossible distance is now a well-trodden path.\n\nThe discovery of gold in California has ignited a frenzy that could reshape the nation's economy overnight, but at the cost of inflation and speculative excess. Alternatively, the Pacific ports could become the foundation of a great maritime trading network, connecting American commerce to the vast markets of Asia."
 nd_usa.9.a: "Or! Il y a de l'or dans ces collines !"
 nd_usa.9.b: "Le Pacifique est la nouvelle frontière commerciale de l’Amérique."
 nd_usa.10.t: "Colosse du Nouveau Monde"
 nd_usa.10.d: "From Cuba to Nootka Sound, from the Panama isthmus to the Great Plains, the American republic has established unquestioned dominance over the Western Hemisphere. No European power dares challenge American supremacy in these waters or on this continent.\n\nThis hemispheric hegemony can serve different purposes. The republic can become the arsenal of democracy: a nation of citizen-soldiers ready to mobilize at a moment's notice, its garrisons and factories the shield of freedom. Or it can project power through gunboat diplomacy, its warships and intelligence networks compelling compliance from any who would defy American interests."
 nd_usa.10.a: "La république s'arme pour tout défi."
 nd_usa.10.b: "Les navires de guerre américains feront respecter notre volonté."
 nd_usa.11.t: "L'expérience républicaine"
 nd_usa.11.d: "The American experiment in self-governance has passed its first great test. Sound financial institutions, a growing treasury, and the embrace of modern banking have given the young republic an economic foundation that commands respect abroad.\n\nLiteracy spreads through the common schools, and the rule of law extends to every corner of the nation. This is no fragile revolutionary state but a functioning republic that proves, year by year, that government of the people need not be government of the mob."
 nd_usa.11.a: "L'expérience réussit."
 nd_usa.12.t: "La révolution industrielle américaine"
 nd_usa.12.d: "American factories and workshops have transformed the economic landscape of the republic. From the textile mills of New England to the iron foundries and machine shops of Philadelphia, a new industrial civilization is being forged in the heat of the furnace and the rhythm of the machine.\n\nThis industrial revolution can take different forms. The factory system emphasizes innovation, education, and cultural development, building a civilization of unprecedented sophistication. Or the nation can invest in internal improvements (canals, turnpikes, and later railroads), knitting together a vast territory and integrating diverse peoples into a single national market."
 nd_usa.12.a: "L'ingéniosité américaine transformera le monde."
 nd_usa.12.b: "Construisez les canaux et les routes qui relient la nation."
 nd_usa.13.t: "Phare de la Liberté"
 nd_usa.13.d: "The American republic has achieved something no nation in history has managed: a wealthy, innovative, scientifically advanced democracy that leads the world not through conquest but through the power of its example. Cotton flows through the port of New York to global markets, institutions of learning produce discoveries that reshape human understanding, and the world's oppressed look to America as proof that freedom works.\n\nThis beacon can illuminate the world in different ways. An arsenal of knowledge: universities, research institutions, and military academies that produce the finest minds and most capable officers in the world. Or a diplomatic paragon: a nation whose moral authority and tolerance draw the admiration of peoples everywhere, whose diplomats are welcomed in every court."
 nd_usa.13.a: "La connaissance est la véritable forme de pouvoir."
 nd_usa.13.b: "Laissez l’exemple de l’Amérique inspirer le monde."
 STATIC_MODIFIER_NAME_nd_usa_dest_gold_rush: "La fièvre de la ruée vers l'or"
 STATIC_MODIFIER_DESC_nd_usa_dest_gold_rush: "La découverte de l’or a attiré des chercheurs de fortune du monde entier. Les villes en plein essor surgissent du jour au lendemain, et la ruée vers la richesse (même spéculative) alimente une expansion rapide vers de nouveaux territoires."
 STATIC_MODIFIER_NAME_nd_usa_dest_pacific_trade: "Commerce du Pacifique"
 STATIC_MODIFIER_DESC_nd_usa_dest_pacific_trade: "Les clippers et les navires marchands américains sillonnent le Pacifique, ouvrant des routes commerciales vers l'Asie et faisant de la république une puissance maritime de premier ordre."
 STATIC_MODIFIER_NAME_nd_usa_dest_arsenal_democracy: "Arsenal de la démocratie"
 STATIC_MODIFIER_DESC_nd_usa_dest_arsenal_democracy: "La république mobilise ses vastes ressources industrielles et démographiques, construisant des garnisons dans tout l’hémisphère et maintenant un établissement militaire capable de se déployer n’importe où à tout moment."
 STATIC_MODIFIER_NAME_nd_usa_dest_gunboat_diplomacy: "Diplomatie de la canonnière"
 STATIC_MODIFIER_DESC_nd_usa_dest_gunboat_diplomacy: "Les navires de guerre américains patrouillent sur toutes les voies maritimes de l’hémisphère occidental. Les réseaux de renseignement et la puissance de feu navale de la république obligent toute puissance qui menace les intérêts américains à se conformer."
 STATIC_MODIFIER_NAME_nd_usa_dest_factory_system: "Système d'usine"
 STATIC_MODIFIER_DESC_nd_usa_dest_factory_system: "L’application systématique des machines et la division du travail ont fait de l’industrie manufacturière américaine la merveille de l’ère industrielle. Le raffinement culturel suit le progrès économique à mesure que la république construit une civilisation digne de ses idéaux."
 STATIC_MODIFIER_NAME_nd_usa_dest_internal_canals: "Améliorations internes"
 STATIC_MODIFIER_DESC_nd_usa_dest_internal_canals: "Un vaste réseau de canaux, d'autoroutes et de routes améliorées relie les régions les plus reculées de la république. L'intégration et la diplomatie priment sur les aventures militaires."
 STATIC_MODIFIER_NAME_nd_usa_dest_arsenal_knowledge: "Arsenal de connaissances"
 STATIC_MODIFIER_DESC_nd_usa_dest_arsenal_knowledge: "American universities and military academies produce officers, engineers, and scientists of the highest caliber. Schools and colleges raise the learning of the whole people, and the army's tactics reflect the finest professional education."
 STATIC_MODIFIER_NAME_nd_usa_dest_diplomatic_paragon: "Parangon diplomatique"
 STATIC_MODIFIER_DESC_nd_usa_dest_diplomatic_paragon: "La république américaine donne l’exemple moral. Sa tolérance, ses diplomates et l'entretien efficace de sa flotte démontrent qu'un peuple libre peut se gouverner avec sagesse et force."
 nd_usa_west_point_academy: "Académie de West Point"
 nd_usa_west_point_academy_desc: "L'Académie militaire des États-Unis à West Point, forme le corps des officiers de la république aux arts de la guerre, de la fortification et du génie militaire."
 nd_usa_land_grant_college: "Collège de concession de terres"
 nd_usa_land_grant_college_desc: "Un établissement public d'enseignement supérieur doté de concessions de terres fédérales, enseignant l'agriculture, l'ingénierie et les arts mécaniques aux citoyens de la république en expansion."
 nd_usa_west_point_upkeep: "Opérations de l'Académie"
 nd_usa_west_point_upkeep_desc: "Des livres pour la bibliothèque, des documents pour les cours et les examens, des armes pour les exercices de formation et des outils pour l'enseignement de l'ingénierie."
 nd_usa_land_grant_upkeep: "Opérations du Collège"
 nd_usa_land_grant_upkeep_desc: "Papier pour publications académiques, livres pour la bibliothèque universitaire et outils pour l'enseignement pratique des étudiants en agriculture et en ingénierie."

 AUTO_MODIFIER_NAME_nd_usa_bureaucracy_authority: "Appareil fédéral"
 AUTO_MODIFIER_DESC_nd_usa_bureaucracy_authority: "The federal government of the United States (the Cabinet at Washington, the Capitol, the Supreme Court, and the executive departments born under Hamilton, Jefferson, Knox, and Randolph) has matured into a coherent national apparatus. It has room for four more institutions."

 usa_continental_congress_bureaucracy: "Congrès continental"
 usa_continental_congress_bureaucracy_desc: "L'assemblée monocamérale des délégués des États qui a mené la guerre d'indépendance a déclaré son indépendance en 1776 et a ratifié les articles de la Confédération en 1781. En vertu de ces articles, le Congrès pouvait légiférer mais ne pouvait pas taxer, lever des armées directement ou réglementer le commerce - les États-Unis étaient une ligue d'États souverains dont la politique dépendait du consentement de treize législatures jalouses."

 usa_federal_constitution_bureaucracy: "Constitution fédérale"
 usa_federal_constitution_bureaucracy_desc: "Rédigée à Philadelphie en 1787 et ratifiée l'année suivante, la Constitution remplaça les articles par un gouvernement fédéral énuméré : un exécutif unitaire, une législature bicamérale et une Cour suprême. La Déclaration des droits de 1791 a consolidé les libertés individuelles exécutoires. Les marchands fédéralistes défendirent le nouveau cadre ; La noblesse anti-fédéraliste des droits de l’État était mécontente de sa poussée centralisatrice."

 usa_hamiltonian_treasury_bureaucracy: "Trésor hamiltonien"
 usa_hamiltonian_treasury_bureaucracy_desc: "Le Département du Trésor d'Alexander Hamilton, organisé en 1789, assuma les dettes des États pendant la guerre d'indépendance et les finança au pair, construisit le service des douanes qui fournissait la plupart des revenus fédéraux avant la guerre civile et affrétait l'infrastructure manufacturière et commerciale d'une république capitaliste. Les jeffersoniens l'ont décrié comme une aristocratie riche s'attaquant aux fermiers."

 usa_marshall_supreme_court_bureaucracy: "Cour suprême Marshall"
 usa_marshall_supreme_court_bureaucracy_desc: "John Marshall a été juge en chef de 1801 à 1835, transformant une troisième branche faible en arbitre du sens constitutionnel. Marbury contre Madison (1803) a établi le contrôle judiciaire des lois fédérales ; McCulloch c.Maryland (1819) a consolidé la suprématie fédérale sur les États ; Gibbons contre Ogden (1824) a placé le commerce interétatique fermement sous l'autorité fédérale. Le prestige de la Cour a été acheté au prix de l'autonomie législative de l'État."

 usa_land_ordinance_bureaucracy: "Système d'ordonnances foncières"
 usa_land_ordinance_bureaucracy_desc: "The Land Ordinance of 1785 imposed a rectangular six-by-six-mile township grid on every acre of federal territory; the Northwest Ordinance of 1787 defined how those territories ascended to co-equal statehood. Together they produced the orderly, surveyed expansion of the settler republic across the continent, and the legal mechanism by which Native nations were dispossessed."

 usa_bank_of_united_states_bureaucracy: "Banque des États-Unis"
 usa_bank_of_united_states_bureaucracy_desc: "La Première Banque (1791-1811) et la Deuxième Banque (1816-1836) servaient d'agent budgétaire fédéral, détenant les dépôts du gouvernement, réglementant la prolifération des banques à charte d'État et émettant un papier-monnaie national stable. Hamilton a conçu le Premier ; Andrew Jackson a détruit la Seconde grâce à son veto en 1832 et à la suppression des dépôts en 1833, dénonçant la banque comme un monstre monétaire contournant le contrôle démocratique."

 usa_west_point_corps_bureaucracy: "Corps des officiers de West Point"
 usa_west_point_corps_bureaucracy_desc: "Fondée par Thomas Jefferson en 1802 et réformée sous Sylvanus Thayer en 1817, l'Académie militaire des États-Unis à West Point a produit le corps des officiers professionnels de l'armée régulière : des ingénieurs, des artilleurs et les meilleurs cadres militaires scientifiquement formés des Amériques. Une classe d'officiers fédéraux permanents a construit sa loyauté envers la structure de commandement nationale plutôt qu'envers les milices d'État et leurs commandants gentlemen-colonels."
