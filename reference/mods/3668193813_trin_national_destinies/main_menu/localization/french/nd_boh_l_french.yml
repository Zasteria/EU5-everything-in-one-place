l_french:
 STATIC_MODIFIER_NAME_nd_boh_hussite_heritage: "Patrimoine hussite"
 STATIC_MODIFIER_DESC_nd_boh_hussite_heritage: "Le calice de Hus brûle dans le cœur du peuple bohème. La dissidence religieuse, l'innovation militaire et le pouvoir des domaines définissent ce royaume."
 STATIC_MODIFIER_NAME_nd_boh_crown_wenceslas: "Couronne de Saint Venceslas"
 STATIC_MODIFIER_DESC_nd_boh_crown_wenceslas: "La couronne sacrée de Bohême confère à celui qui la porte un prestige impérial et un patronage culturel. Prague brille comme un joyau de la chrétienté."
 STATIC_MODIFIER_NAME_nd_boh_compactata_spirit: "Esprit de la Compactata"
 STATIC_MODIFIER_DESC_nd_boh_compactata_spirit: "Les pactes de Bâle garantissaient le droit de la Bohême à la communion sous les deux formes. La coexistence religieuse, même si elle est difficile, prévaut dans les pays tchèques."
 STATIC_MODIFIER_NAME_nd_boh_counter_reformation: "Contre-Réforme"
 STATIC_MODIFIER_DESC_nd_boh_counter_reformation: "L'ordonnance foncière renouvelée a imposé le conformisme catholique à la Bohême. Les anciennes libertés hussites sont éteintes, mais l'ordre est rétabli."
 STATIC_MODIFIER_NAME_nd_boh_exile_legacy: "L'héritage des exilés"
 STATIC_MODIFIER_DESC_nd_boh_exile_legacy: "Les frères bohémiens transportent leur savoir en exil et diffusent l'érudition tchèque à travers l'Europe. Ce qui a été perdu dans la foi perdure dans la pensée."
 nd_boh.1.t: "La couronne de Bohême"
 nd_boh.1.d: "The lands of Bohemia and Moravia are united under a single crown. For generations, this kingdom has stood at the crossroads of European civilization, seat of emperors, cradle of religious revolt, and home to one of the oldest universities north of the Alps.\n\nBut Bohemia's identity remains contested. The memory of Jan Hus and the Hussite wars lingers in every parish and estate chamber. The chalice and the crown pull in opposite directions: shall Bohemia be defined by the radical legacy of its religious dissenters, with their democratic assemblies and military innovations? Or by the ancient prestige of Saint Wenceslas's crown, with its imperial connections, cultural patronage, and place among the great Catholic kingdoms of Europe?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_boh.1.a: "Le Calice ne doit pas être réduit au silence."
 nd_boh.1.b: "Nous portons la couronne de Saint Venceslas."
 nd_boh.2.t: "La Compactata de Bâle"
 nd_boh.2.d: "After decades of devastating religious warfare, an extraordinary agreement has been reached. The Council of Basel has recognized the rights of the Utraquist Church in Bohemia, the first time in Christian history that a dissident religious movement has wrested formal concessions from the Roman Church.\n\nThe Compacts of Basel guarantee communion in both kinds, allow lay preaching, and acknowledge the expropriation of Church lands. Bohemia stands as a unique experiment in religious coexistence, a century before the Reformation will convulse the rest of Europe. The moderate Hussites have secured what the radicals fought and died for at Lipany, not through victory in battle, but through the exhaustion of their enemies and the pragmatism of their diplomats."
 nd_boh.2.a: "Espèce sub utraque, sous les deux espèces."
 nd_boh.3.t: "L'ordonnance foncière renouvelée"
 nd_boh.3.d: "The catastrophe at White Mountain has transformed Bohemia. The Protestant estates who dared to elect Frederick of the Palatinate as their king have been crushed, their leaders executed on the Old Town Square, their properties confiscated. Ferdinand II's Renewed Land Ordinance of 1627 has swept away the old Bohemian constitution, the Estates Diet that once elected kings is now a rubber stamp, the Czech language is demoted to equality with German, and only the Catholic faith is permitted.\n\nBut this devastation also presents a choice. The old Bohemia of competing confessions is dead. What rises from these ashes will be shaped by how its rulers wield this absolute power."
 nd_boh.3.a: "Appliquez la vraie foi sans compromis."
 nd_boh.3.b: "Laissons les exilés transmettre notre savoir au monde."
 nd_boh.4.t: "Le réveil national tchèque"
 nd_boh.4.d: "Something stirs in the libraries and lecture halls of Prague. Scholars like Josef Dobrovsky and Josef Jungmann are reconstructing the Czech language from the fragments left after two centuries of Germanization. They rediscover the Hussite legacy not as heresy but as national heritage, proof that the Czech people once defied all of Europe and won.\n\nThe National Awakening is more than a linguistic movement. It is a reassertion of Bohemian identity, connecting the medieval kingdom of Charles IV through the Hussite revolution to the modern demand for national self-determination. Czech culture, long suppressed, now demands its place in the sun."
 nd_boh.4.a: "La nation tchèque vit encore."
 nd_boh_silver_legacy: "L'héritage d'argent de Kutna Hora"
 nd_boh_silver_legacy_desc: "Les riches gisements d'argent de Kutna Hora ont fait de la Bohême l'un des royaumes les plus riches de l'Europe médiévale, produisant un tiers de tout l'argent européen."
 nd_boh_premyslid_crown: "Gouvernance de la couronne prémyslide"
 nd_boh_premyslid_crown_desc: "La dynastie des Prémyslides a établi les bases administratives de la couronne de Bohême, centralisant l'autorité royale sur les terres tchèques."
 nd_boh_hop_brewing: "Culture du houblon bohème"
 nd_boh_hop_brewing_desc: "Le houblon Saaz de Bohême était si prisé que l'exportation de pousses de houblon était passible de la peine de mort. La tradition brassicole remonte aux premiers monastères."
 nd_boh_charles_university: "Université Charles"
 nd_boh_charles_university_desc: "Fondée en 1348 par Charles IV, l'Université de Prague fut la première université d'Europe centrale et attira des universitaires de tout le continent."
 nd_boh_prague_golden_age: "L'âge d'or de Prague"
 nd_boh_prague_golden_age_desc: "Sous Charles IV, Prague devint un centre d’art et d’architecture gothique. Le Pont Charles, la Cathédrale Saint-Guy et la Nouvelle Ville ont transformé la ville."
 nd_boh_houfnice_innovation: "Canons de campagne de Houfnice"
 nd_boh_houfnice_innovation_desc: "Le houfnice tchèque, canon de campagne mobile, a donné à la langue anglaise le mot « obusier ». Les artilleurs hussites ont été les premiers à utiliser l'artillerie en bataille ouverte."
 nd_boh_tabor_warfare: "Guerre du Thabor"
 nd_boh_tabor_warfare_desc: "Les Hussites radicaux ont construit la ville fortifiée de Tabor comme communauté modèle et base militaire. Leurs tactiques défensives combinaient le wagenburg, les armes à feu et la foi."
 nd_boh_compactata: "Compactata de Bâle"
 nd_boh_compactata_desc: "L'accord de 1436 entre le Concile de Bâle et les Hussites fut le premier règlement religieux négocié dans l'histoire européenne."
 nd_boh_hussite_levy: "Prélèvements paysans hussites"
 nd_boh_hussite_levy_desc: "Les guerres hussites mobilisèrent les paysans de Bohême comme jamais auparavant. Armés de fléaux de guerre, de hallebardes et d'une juste fureur, ils vainquirent les chevaliers en croisade."
 nd_boh_bohemian_brethren: "Unité des frères"
 nd_boh_bohemian_brethren_desc: "Les frères bohémiens, héritiers de la tradition hussite, mettaient l'accent sur l'éducation, l'alphabétisation et la discipline morale. Jan Amos Comenius est devenu le père de la pédagogie moderne."
 nd_boh_professional_infantry: "Infanterie professionnelle de Bohême"
 nd_boh_professional_infantry_desc: "S'appuyant sur la tradition militaire hussite, la Bohême a développé une infanterie professionnelle disciplinée et compétente dans la guerre au brochet et au tir."
 nd_boh_estate_diets: "Régimes du domaine bohème"
 nd_boh_estate_diets_desc: "La Diète de Bohême était l'une des assemblées représentatives les plus puissantes d'Europe, avec le droit d'élire les rois et d'approuver les impôts."
 nd_boh_verneuerte_landesordnung: "Verneuerte Landesordnung"
 nd_boh_verneuerte_landesordnung_desc: "L'ordonnance foncière renouvelée de Ferdinand II de 1627 a balayé l'ancienne constitution de Bohême, imposant le règne absolu des Habsbourg après la bataille de la Montagne Blanche."
 nd_boh_recatholicization: "Recatholisation"
 nd_boh_recatholicization_desc: "La re-catholicisation forcée de la Bohême après 1620 a expulsé le clergé protestant, confisqué les domaines et imposé le conformisme religieux dans tout le royaume."
 nd_boh_baroque_prague: "Prague baroque"
 nd_boh_baroque_prague_desc: "La contre-réforme a transformé le paysage de Prague avec des églises baroques spectaculaires, des palais et des jardins construits par des architectes italiens et autrichiens."
 nd_boh_bohemian_glass_trade: "Commerce du verre de Bohême"
 nd_boh_bohemian_glass_trade_desc: "Le verre de cristal de Bohême est devenu un produit de luxe exporté dans toute l'Europe aux XVIIe et XVIIIe siècles, rivalisant avec le murano vénitien en tant que meilleur du continent."
 nd_boh_national_awakening: "Réveil national tchèque"
 nd_boh_national_awakening_desc: "Des érudits et des écrivains ont redécouvert la langue tchèque et l'héritage hussite, forgeant une identité nationale moderne à partir des fragments d'une culture supprimée."
 nd_boh_industrial_bohemia: "Bohême industrielle"
 nd_boh_industrial_bohemia_desc: "La Bohême est devenue l'une des régions les plus industrialisées d'Europe centrale, avec des fonderies de fer, des usines textiles et un réseau ferroviaire dense."
 nd_boh_pilsner_revolution: "La révolution Pilsner"
 nd_boh_pilsner_revolution_desc: "In 1842, the Pilsen Burgher Brewery produced the first golden lager using Saaz hops and soft Pilsen water, creating a beer style that conquered the world.\n\n#italic Available in: $nd_boh_brewhouse$#!"
 nd_boh_constitutional_struggle: "Lutte constitutionnelle"
 nd_boh_constitutional_struggle_desc: "La revendication d'une autonomie bohème au sein de la monarchie des Habsbourg a conduit aux débats constitutionnels et à l'émergence de la vie politique tchèque moderne."
 a_nd_boh_houfnice: "Houfnice"
 a_nd_boh_houfnice_desc: "Canons de campagne hussites mobiles, précurseurs de l'obusier moderne. Assez léger pour suivre le rythme du wagenburg, suffisamment dévastateur pour briser les charges de cavalerie."
 a_nd_boh_cepnik: "Čepnik"
 a_nd_boh_cepnik_desc: "Guerriers paysans hussites armés de fléaux de guerre, le cep. Fanatiques en défense, ils brisèrent la fleur de la chevalerie européenne à Vitkov et Kutna Hora."
 a_nd_boh_landsknecht: "Landsknecht bohémien"
 a_nd_boh_landsknecht_desc: "Piquiers et hallebardiers professionnels de Bohême, héritiers de la tradition de l'infanterie hussite. Formations disciplinées entraînées à tenir tête à la cavalerie."
 nd_boh_kutna_hora_mint: "Menthe Kutna Hora"
 nd_boh_kutna_hora_mint_desc: "La cour italienne de Kutna Hora a frappé le Groschen de Prague et plus tard le Thaler pendant plus de quatre siècles, faisant de la monnaie de Bohême l'étalon de l'Europe centrale."
 nd_boh_silver_minting: "Frappe d'argent"
 nd_boh_silver_minting_desc: "L'argent raffiné de Bohême est frappé dans les usines Groschen et Thalers de Prague, où l'on produit des bijoux de luxe et des objets en ferronnerie de luxe destinés à l'exportation."
 nd_boh_brewhouse: "Brasserie bohème"
 nd_boh_brewhouse_desc: "Une brasserie agréée utilisant le précieux houblon Saaz de Bohême. Les privilèges royaux en matière de brassage garantissent la qualité et restreignent la concurrence."
 nd_boh_saaz_hop_brewing: "Brasserie de houblon Saaz"
 nd_boh_saaz_hop_brewing_desc: "Brassage bohème avec la variété aromatique de houblon Saaz, produisant une bière d'une clarté et d'une saveur inégalées."
 nd_boh_pilsner_method: "Méthode Pilsner Lager"
 nd_boh_pilsner_method_desc: "La technique révolutionnaire de fermentation basse utilisant du malt pâle et de l'eau douce, produisant une bière dorée et cristalline."
 nd_boh_hussite_tabor: "Thabor hussite"
 nd_boh_hussite_tabor_desc: "Une colonie fortifiée dans la tradition hussite, en partie garnison, en partie communauté, conçue pour une défense durable avec des armes à feu et des chariots."
 nd_boh_tabor_garrison: "Entretien de la garnison de Tabor"
 nd_boh_tabor_garrison_desc: "Entretenir la garnison, les fortifications et les magasins d'armes d'une communauté tabor hussite."
 nd_boh_karolinum: "Karolinum"
 nd_boh_karolinum_desc: "Une université dans la tradition de la fondation de Charles IV à Prague, la première université d'Europe centrale, centre de théologie, de droit et d'arts libéraux."
 nd_boh_university_maintenance: "Entretien universitaire"
 nd_boh_university_maintenance_desc: "Fournir aux universitaires et aux étudiants des livres, du papier et du matériel d'apprentissage."
 nd_boh_baroque_church: "Église baroque"
 nd_boh_baroque_church_desc: "Une magnifique église de contre-réforme construite dans le style baroque orné, un monument de la résurgence catholique et du mécénat culturel des Habsbourg en Bohême."
 nd_boh_baroque_patronage: "Patronage baroque"
 nd_boh_baroque_patronage_desc: "Entretenir et embellir l'architecture des églises baroques, les cierges allumés devant les autels dorés, les livres pour le clergé, la pierre à perpétuelle rénovation."
 nd_boh_ironworks: "Forges de Bohême"
 nd_boh_ironworks_desc: "Une fonderie de fer moderne utilise les riches gisements de fer et de charbon de Bohême pour produire de l'acier de haute qualité destiné à l'industrie et à l'exportation."
 nd_boh_iron_smelting: "Fonderie de fer"
 nd_boh_iron_smelting_desc: "Traitement du minerai de fer de Bohême avec du charbon pour produire de l'acier de qualité industrielle."
 levy_nd_boh_cepnik: "Cepnik Levy"
 levy_nd_boh_cepnik_desc: "Paysans guerriers hussites brandissant des fléaux de guerre, issus de la campagne dévote de Bohême."
 nd_boh_formed_tt: "La Bohême s'est formée"
 nd_boh_path_a_tt: "Choisissez le patrimoine hussite"
 nd_boh_path_b_tt: "A choisi la couronne de Saint Venceslas"
 nd_boh_destiny: "Destin de la Bohême"
 nd_boh_destiny_desc: "Les terres de la couronne sont unies. La Bohême doit désormais choisir sa voie, le calice de Hus ou la couronne de Venceslas, et poursuivre son destin jusqu'à son accomplissement."
 nd_boh_dest_spanile_jizdy: "Les belles balades"
 nd_boh_dest_spanile_jizdy_desc: "The Hussite war bands launched devastating raids, the spanile jizdy, deep into Saxony, Brandenburg, and Silesia, spreading terror and the word of God. Seize Wroclaw and Zittau to secure Bohemia's eastern and northern flanks."
 nd_boh_dest_bohemian_hegemony: "Hégémonie bohème"
 nd_boh_dest_bohemian_hegemony_desc: "With Silesia and Lusatia secured, the Hussite armies can push into the heart of Saxony. Dresden and Meissen are to be taken, and half of Upper Saxony held, as far as the rides once reached."
 nd_boh_dest_upper_saxony_share_tt: "At least #bold 50%#! of the locations of #bold Upper Saxony#! are ours"
 nd_boh_dest_franconia_share_tt: "At least #bold 50%#! of the locations of #bold Franconia#! are ours"
 nd_boh_dest_warriors_of_god: "Guerriers de Dieu"
 nd_boh_dest_warriors_of_god_desc: "The Hussite revolution reaches its apex. Nuremberg, Berlin, and Krakow must fall, and half of Franconia be held, to prove that no crusade can break the warriors of God. This is the capstone of Bohemian military supremacy."
 nd_boh_dest_carolinum: "Le Carolinum"
 nd_boh_dest_carolinum_desc: "Charles IV fonda la première université au nord des Alpes et fit de Prague un centre d'apprentissage européen. Adoptez les institutions de l’époque et constituez le trésor nécessaire pour financer les ambitions culturelles de la Bohême."
 nd_boh_dest_imperial_capital: "Capitale Impériale"
 nd_boh_dest_imperial_capital_desc: "Prague was once the seat of the Holy Roman Emperor. Secure Vienna, build up Kutna Hora, whose silver pays for the court, and restore Bohemia's position as the premier kingdom of Central Europe."
 nd_boh_dest_kutna_hora_developed_tt: "We own #bold Kutna Hora#! and its development is at least #bold 32#!"
 nd_boh_dest_praga_caput: "Prague Caput Regni"
 nd_boh_dest_praga_caput_desc: "Prague, Head of the Kingdom, and perhaps of all Europe. Control Augsburg, embrace the printing press, and build Prague up into a capital without equal in culture and learning."
 nd_boh_dest_prague_developed_tt: "We own #bold Prague#! and its development is at least #bold 72#!"
 nd_boh.5.t: "Le destin de la Bohême"
 nd_boh.5.d: "Les terres de la couronne de Bohême sont regroupées sous un seul dirigeant. Le royaume se trouve à la croisée des chemins. L'héritage de Hus guidera-t-il ses armées vers l'extérieur dans la guerre sainte, ou le souvenir de Charles IV attirera-t-il les érudits et les artisans à Prague, en faisant le joyau d'un empire ? La voie choisie aujourd’hui façonnera le destin du peuple tchèque pour les siècles à venir."
 nd_boh.5.a: "Notre destin nous attend."
 nd_boh.6.t: "Les belles balades commencent"
 nd_boh.6.d: "The Hussite field armies have broken through the mountain passes and seized the great cities beyond. Wroclaw, capital of Silesia, and Zittau, the richest town of the Lusatian League, now fly the chalice banner. The spanile jizdy, the Beautiful Rides that once terrorized half of Europe, have become permanent conquests. The crusaders who once marched against Bohemia now cower behind their walls as the warriors of God ride forth."
 nd_boh.6.a: "Dieu le veut, sous les deux formes."
 nd_boh.7.t: "L'hégémonie du calice"
 nd_boh.7.d: "La résistance saxonne s’est effondrée. Dresde et Meissen, cœur de la dynastie Wettin, sont désormais soumises aux armes de Bohême. La machine militaire hussite, forgée au cours de décennies de guerre défensive, est devenue la force dominante en Europe centrale. Mais l’hégémonie exige des choix. La force de la Bohême reposera-t-elle sur le fléau de fer de ses guerriers, ou sur les sermons enflammés de ses prédicateurs de campagne qui soutiennent le moral fanatique de l'armée ?"
 nd_boh.7.a: "Laissez le fléau faire la prédication."
 nd_boh.7.b: "La parole de Dieu soutient nos armées."
 nd_boh.8.t: "Guerriers de Dieu"
 nd_boh.8.d: "Nuremberg, Berlin, Krakow, the great cities of Central Europe have fallen to Bohemian arms. No crusade, no coalition, no emperor could stop the advance of the warriors of God. What the Hussites began as a desperate defense of their communion chalice has become the most remarkable military expansion in European history. Jan Zizka's blind genius has found its ultimate expression.\n\nBut every empire must decide how to govern its conquests. Shall Bohemia rule through military discipline alone, or attempt the radical experiment of extending its proto-democratic assemblies to the conquered lands?"
 nd_boh.8.a: "La discipline et l'épée gouverneront."
 nd_boh.8.b: "Que chaque pays ait son assemblée."
 nd_boh.9.t: "Le nouveau Carolinum"
 nd_boh.9.d: "La tradition scientifique de Prague, fondée par Charles IV lui-même, a donné naissance à une nouvelle génération de penseurs et d'administrateurs. L’adoption d’une réforme bancaire et institutionnelle moderne a rempli le trésor royal et attiré des marchands de toute l’Europe. Le Carolinum, autrefois une simple université, est devenu le moteur intellectuel d'un royaume qui dirige par la connaissance plutôt que par la conquête."
 nd_boh.9.a: "Prague sera l'Athènes du Nord."
 nd_boh.10.t: "La capitale impériale restaurée"
 nd_boh.10.d: "Vienna is secured and the realm thrives. Bohemia has reclaimed the imperial stature it held under Charles IV, when Prague was the undisputed capital of the Holy Roman Empire. The kingdom's institutional sophistication and cultural prestige draw ambassadors and scholars from across the continent.\n\nBut imperial ambition comes in different forms. Shall Bohemia invoke the Golden Bull of 1356, Charles IV's constitutional masterwork, to cement its diplomatic supremacy? Or invest in Prague's workshops and artisans to build an economic foundation that no rival can match?"
 nd_boh.10.a: "Invoquez le Taureau d'Or."
 nd_boh.10.b: "Investissez dans les artisans de Prague."
 nd_boh.11.t: "Prague Caput Regni"
 nd_boh.11.d: "Prague, Head of the Kingdom. The ancient motto has never been more true. With Augsburg secured and the printing press spreading Bohemian learning across Europe, Prague stands as the cultural and institutional capital of Central Europe, a role it has not held since the golden days of Charles IV. The dream of a Bohemian-led empire, built on scholarship rather than conquest, is now reality.\n\nShall Bohemia claim the ultimate prize, the title Rex Romanorum, King of the Romans, and rule Europe through prestige and precedence? Or turn inward, fostering a Bohemian enlightenment that will illuminate the world through knowledge?"
 nd_boh.11.a: "Nous serons Rex Romanorum."
 nd_boh.11.b: "Laissez Prague illuminer le monde."
 STATIC_MODIFIER_NAME_nd_boh_dest_iron_flail: "Fléau de fer"
 STATIC_MODIFIER_DESC_nd_boh_dest_iron_flail: "The Hussite war flail crushes all resistance. Walls are stormed and every victory hardens the field armies, though the devastation of war stunts the growth of the common folk."
 STATIC_MODIFIER_NAME_nd_boh_dest_field_preachers: "Prédicateurs de terrain"
 STATIC_MODIFIER_DESC_nd_boh_dest_field_preachers: "Hussite preachers march with the armies, restoring their spirit after every fight and drawing volunteers from every village. The cost of this zealous mobilization weighs on the treasury."
 STATIC_MODIFIER_NAME_nd_boh_dest_gods_warriors: "Guerriers de Dieu"
 STATIC_MODIFIER_DESC_nd_boh_dest_gods_warriors: "Les armées disciplinées de l’État hussite marchent avec un dessein divin, leurs lignes de ravitaillement sont efficaces et leurs ennemis dépérissent sur le territoire hostile de Bohême."
 STATIC_MODIFIER_NAME_nd_boh_dest_hussite_commonwealth: "Commonwealth hussite"
 STATIC_MODIFIER_DESC_nd_boh_dest_hussite_commonwealth: "The radical Hussite vision of community governance extends across conquered lands, binding them to the kingdom and raising popular armies quickly, though the decentralized treasury increases borrowing costs."
 STATIC_MODIFIER_NAME_nd_boh_dest_golden_bull: "Esprit du Taureau d'Or"
 STATIC_MODIFIER_DESC_nd_boh_dest_golden_bull: "The constitutional framework of the Golden Bull elevates Bohemia's diplomatic standing among the princes of Europe, though maintaining this prestige demands a costlier court."
 STATIC_MODIFIER_NAME_nd_boh_dest_prague_workshop: "Ateliers de Prague"
 STATIC_MODIFIER_DESC_nd_boh_dest_prague_workshop: "Prague's artisans and builders produce works of exceptional quality at lower cost, though the kingdom's focus on crafts leaves fewer men to refill the ranks."
 STATIC_MODIFIER_NAME_nd_boh_dest_rex_romanorum: "Rex Romanorum"
 STATIC_MODIFIER_DESC_nd_boh_dest_rex_romanorum: "Le roi de Bohême revendique l'ancien titre de roi des Romains. Le prestige impérial est inattaquable, même si le fardeau du maintien de ce statut fatigue le royaume en temps de guerre."
 STATIC_MODIFIER_NAME_nd_boh_dest_bohemian_enlightenment: "Lumières bohèmes"
 STATIC_MODIFIER_DESC_nd_boh_dest_bohemian_enlightenment: "Prague leads a scholarly revolution that reaches the villages: schools are opened in every parish, and the learned trades of the towns are opened to their pupils."
 nd_boh_hussite_arsenal: "Arsenal hussite"
 nd_boh_hussite_arsenal_desc: "Un grand complexe d'armureries et d'ateliers dans la tradition hussite, produisant des chariots de guerre, des canons de campagne et les redoutables armes à fléaux de l'infanterie bohème."
 nd_boh_arsenal_maintenance: "Entretien de l'Arsenal"
 nd_boh_arsenal_maintenance_desc: "Entretenir les forges, les magasins de bois et les ateliers d'armes d'un arsenal hussite."
 nd_boh_imperial_academy: "Académie Impériale"
 nd_boh_imperial_academy_desc: "Une institution d'enseignement suprême dans la tradition de Charles IV, rivalisant avec Bologne et Paris en tant que centre européen d'érudition et d'innovation institutionnelle."
 nd_boh_academy_maintenance: "Entretien de l'Académie"
 nd_boh_academy_maintenance_desc: "Fournir les érudits, entretenir la bibliothèque et financer les cours d'une académie impériale."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_boh_bureaucracy_authority: "Autorité de la Couronne de Bohême"
 AUTO_MODIFIER_DESC_nd_boh_bureaucracy_authority: "The reconstituted Czech kingdom inherits the institutional weight of Přemyslid, Luxembourg, and Jagiellonian governance. The Land Tables, the Land Court, and the Diet of three estates grant four bureaucracy slots in which the Crown of Saint Wenceslas may formalize its standing organs of state."

 boh_zemsky_snem_bureaucracy: "Snem de Zemsk"
 boh_zemsky_snem_bureaucracy_desc: "La Diète du Land de Bohême convoqua trois domaines - les panstvo (seigneurs, y compris les évêques), les rytrstvo (chevaliers) et les députés des villes royales - à Prague ou Kutn Hora pour voter les impôts, élire les rois et contrôler les affaires de la Couronne. Les paysans n'étaient pas représentés. L'ordonnance foncière Vladislav de 1500 a codifié les pouvoirs de la Diète et est considérée comme la plus ancienne constitution tchèque écrite ; la Confédération de Bohême de 1619 poussa ces puissances jusqu'à leur point de rupture. Le président de la Diète était le Burgrave suprême, qui présidait depuis son siège au château de Prague."

 boh_desky_zemske_bureaucracy: "Bureau Zemsk"
 boh_desky_zemske_bureaucracy_desc: "Les Tables foncières, établies sous Premysl Otakar II au XIIIe siècle, étaient le registre des domaines allodiaux, des résolutions de la Diète et des décisions du tribunal foncier de la couronne de Bohême. Les transferts de propriété entre nobles n'étaient valables que s'ils étaient inscrits dans les livres, ce qui donnait à la szlachta de Bohême une garantie écrite contre les saisies arbitraires deux siècles avant que de telles garanties ne deviennent courantes ailleurs. Les Tables restèrent le cadastre opérationnel du royaume jusqu'en 1848, avec des registres parallèles pour la Moravie et la Silésie."

 boh_zemsky_soud_bureaucracy: "Soud de Zemsk"
 boh_zemsky_soud_bureaucracy_desc: "Le Tribunal foncier de Bohême, organe judiciaire suprême pour les domaines nobles, siégeait au château de Prague sous la présidence du Burgrave suprême et avec les grands barons du royaume comme évaluateurs. Ses jugements furent inscrits aux Tables Foncières et considérés comme définitifs ; le tribunal des petites terres (Men zemsk soud) traitait des affaires inférieures au seuil noble. La volonté royale était tempérée par une cour que le roi ne contrôlait pas entièrement, et la mémoire collective de la noblesse de ses jugements façonnait ce qu'elle accepterait et n'accepterait pas d'un nouveau roi lors de son serment de couronnement."

 boh_burgrabstvi_prazske_bureaucracy: "Nejvy purkrabstv prask"
 boh_burgrabstvi_prazske_bureaucracy_desc: "Le burgrave suprême du château de Prague était le plus haut officier foncier du royaume et l'adjoint du roi en son absence, détenant l'autorité judiciaire, militaire et administrative sur le royaume. À partir du XIVe siècle, le Burgrave présidait le tribunal foncier et signait pour la Couronne lorsque le monarque était à l'étranger - le canal naturel pour un souverain luxembourgeois itinérant ou absent des Habsbourg. La maison des Burgrave, d'origine gothique et reconstruite à plusieurs reprises, se dresse toujours dans l'enceinte du château de Prague. Le bureau ne fut supprimé qu'en 1848."

 boh_compactata_bureaucracy: "Kompaktta"
 boh_compactata_bureaucracy_desc: "Les pactes de Bâle, négociés avec le concile de Bâle et ratifiés par les domaines bohémiens de Jihlava le 5 juillet 1436, mirent fin aux guerres hussites en accordant aux utraquistes leurs quatre revendications : la communion sous les deux espèces (espèce sub utraque - pain et vin pour les laïcs), la libre prédication de la parole de Dieu, le châtiment des péchés publics par l'autorité compétente et l'expropriation des terres de l'Église romaine saisies pendant les guerres. Une église catholique de Bohême indépendante dirigée par un archevêque élu était tolérée. Le pape Eugène IV a refusé de ratifier le document, mais pendant près d'un siècle, il a été la loi en vigueur sur la coexistence religieuse dans les terres de la couronne tchèque : un patchwork confessionnel promulgué cent ans avant la paix d'Augsbourg."

 boh_kutnohorsky_dekret_bureaucracy: "Dekret de Kutnohorsk"
 boh_kutnohorsky_dekret_bureaucracy_desc: "Le 18 janvier 1409, Venceslas IV signe le décret de Kutn Hora, repondérant les voix des quatre nations enseignantes de l'Université Charles de Prague : trois voix pour la nation bohème, une pour les nations bavaroise, saxonne et polonaise réunies. Environ quatre-vingts pour cent des maîtres allemands et de leurs étudiants se sont retirés, fondant ce qui est devenu l'Université de Leipzig. Le cercle Hus a obtenu les chaises dont il avait besoin ; Le tchèque est devenu une langue académique de travail ; et le studio cosmopolite de Prague est devenu un studio national. Certains historiens considèrent ce décret comme le premier document nationaliste tchèque."

 boh_obnovene_zrizeni_bureaucracy: "Obnoven zrzen zemsk"
 boh_obnovene_zrizeni_bureaucracy_desc: "L'ordonnance foncière renouvelée, promulguée par Ferdinand II le 10 mai 1627 à la suite de la Montagne Blanche, démantèle les acquis constitutionnels de trois siècles. La couronne de Bohême fut déclarée possession héréditaire des Habsbourg, la monarchie élective abolie, le catholicisme seul autorisé et l'allemand placé sur un pied d'égalité avec le tchèque dans l'administration. La Diète n'a survécu que comme registre des décrets royaux ; les Compactata furent déchirées ; la grande noblesse protestante avait été exécutée sur la place de la Vieille Ville en 1621, exilée ou expropriée. Le royaume tchèque est devenu, sauf le nom, une province de l'État des Habsbourg."
