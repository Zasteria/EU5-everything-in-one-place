l_turkish:
 STATIC_MODIFIER_NAME_nd_cas_justicia_del_rey: "The King's Justice"
 STATIC_MODIFIER_DESC_nd_cas_justicia_del_rey: "The Crown governs through men it can dismiss: judges trained in the law, accountants who answer for every coin, and a royal officer at the head of each town council. The rents come in and the roads are safe. The great houses, shut out of the offices their grandfathers held, keep the score."
 STATIC_MODIFIER_NAME_nd_cas_hueste_de_los_ricoshombres: "The Host of the Ricoshombres"
 STATIC_MODIFIER_DESC_nd_cas_hueste_de_los_ricoshombres: "The king rides with the great lineages around him and pays them as they expect to be paid, in rents, towns and jurisdictions. No host in the peninsula is better mounted. What has been granted away to raise it is entered in no book as a loan."
 STATIC_MODIFIER_NAME_nd_cas_alcabala_otorgada: "A Tax Freely Granted"
 STATIC_MODIFIER_DESC_nd_cas_alcabala_otorgada: "The sales tax runs for the term the Cortes voted and for the purpose they were told. The procurators go home to their cities and report that the king kept his word."
 STATIC_MODIFIER_NAME_nd_cas_alcabala_perpetua: "The Tax That Stayed"
 STATIC_MODIFIER_DESC_nd_cas_alcabala_perpetua: "The term has run out and the collectors have not gone home. Every sale in every market still pays its share to the king, and the towns have learned what a temporary grant is worth."
 STATIC_MODIFIER_NAME_nd_cas_corrales_abiertos: "The Yards Stay Open"
 STATIC_MODIFIER_DESC_nd_cas_corrales_abiertos: "A new play every few days, written overnight and forgotten in a week, and the hospitals fed from the price of a place in the yard. The preachers call it a school of vice and are not listened to."
 STATIC_MODIFIER_NAME_nd_cas_corrales_cerrados: "The Yards Are Shut"
 STATIC_MODIFIER_DESC_nd_cas_corrales_cerrados: "The stages are bare and the companies have scattered to the villages. The pulpits give thanks. Foreigners who came for the theatre of Castile find sermons."
 STATIC_MODIFIER_NAME_nd_cas_fuero_de_poblacion: "The Charter of Settlement"
 STATIC_MODIFIER_DESC_nd_cas_fuero_de_poblacion: "The Crown stands by the charter and by its author. Families keep arriving on the royal road, each to fifty fanegas that no convent and no entail may ever swallow. The friars who were told to stay out remember who told them."
 STATIC_MODIFIER_NAME_nd_cas_olavide_condenado: "Olavide Condemned"
 STATIC_MODIFIER_DESC_nd_cas_olavide_condenado: "The superintendent of the colonies has heard his sentence on his knees with a green candle in his hand. The Church is satisfied and the kingdom is quiet. Men who own the new books have moved them to the back of the shelf."
 nd_cas.1.t: "The Crown of Castile"
 nd_cas.1.d: "The king of Castile is also king of León, Toledo, Galicia, Seville, Córdoba, Murcia and Jaén, and each of those titles was won with a sword. The kingdom runs from the Cantabrian ports to the Strait, and almost none of it is governed the same way twice: councils of free householders on the old frontier, great lordships in the south, the orders in La Mancha, a customs house in Seville that still keeps its accounts under an Arabic name.\n\nEvery reign begins with the same question, and the last minority answered it badly. The king can rule through men he appoints and can dismiss: judges from the schools, accountants, and the councils of the towns, who will pay for a strong Crown if it keeps the roads safe and the great men off their commons. Or he can rule as the head of the nobility, ride to war with the great lineages beside him, and pay them in the only coin they take, which is the Crown's own rents and towns.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cas.1.d.restored: "There is a king in Castile again. The land between the Cantabrian mountains and the Tagus, with Burgos and Valladolid, the councils of the old frontier and the roads the pilgrims and the flocks have always used, answers once more to one crown that bears the kingdom's own name. The castle is back on the banner.\n\nA restored Crown must decide at once what kind of Crown it is. It can rule through men it appoints and can dismiss: judges from the schools, accountants, and the councils of the towns, who will pay for a strong king if he keeps the roads safe and the great men off their commons. Or it can rule as the head of the nobility, ride to war with the great lineages at its side, and pay them in the only coin they take, which is the Crown's own rents and towns.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cas.1.a: "Let the law be the king's, and the judges his own men."
 nd_cas.1.a_tt: "Crown power, taxes and control rise and the towns approve. The nobles resent it."
 nd_cas.1.b: "A king of Castile rides with his ricoshombres."
 nd_cas.1.b_tt: "Stronger heavy cavalry and noble levies, and contented nobles. The Crown loses power."
 nd_cas_formed_tt: "Castile holds its crown"
 nd_cas_path_a_tt: "Chose the #bold King's Justice#! destiny"
 nd_cas_path_b_tt: "Chose the #bold Host of the Ricoshombres#! destiny"
 nd_cas.2.t: "The Alcabala"
 nd_cas.2.d: "Burgos, 1342. The king has been in front of Algeciras with every man he could raise, and the siege has no end in sight: the town is supplied by sea, the camp is eaten by fever, and the treasury is empty. He asks the cities for something new. Not a subsidy counted by households, but a share of every sale made in the kingdom, one coin in twenty, on bread and cloth and horses alike, paid by lord and commoner without exception.\n\nThe procurators grant it for three years and for this war only. Algeciras falls in 1344. The tax is asked for again, and again, and each time the term is a little easier to extend. Whether it remains a gift of the kingdom or becomes a right of the king is decided by what is done when the first term runs out."
 nd_cas.2.a: "It was granted for the siege. Let it end with the siege."
 nd_cas.2.a_tt: "The estates are content and stability is cheaper to restore."
 nd_cas.2.b: "What the kingdom has paid once it can pay always."
 nd_cas.2.b_tt: "More tax and a stronger Crown. The burghers who pay it are displeased."
 nd_cas.3.t: "La Rochelle"
 nd_cas.3.d: "June 1372. An English fleet under the Earl of Pembroke stands in to relieve La Rochelle with soldiers, horses and the pay chest for an army in Aquitaine. Waiting for it are the galleys of Castile under the admiral Ambrosio Boccanegra, sent north to honour the king's alliance with France.\n\nThe first day decides nothing. Overnight the tide goes out, and the deep English ships settle on the mud while the galleys, which draw little water, are still afloat. At dawn the Castilians row in among them, throw oil across the decks and shoot fire arrows after it. By evening Pembroke is a prisoner, his fleet is burned or taken, and the chest is on its way to Santander. In the years that follow the admiral Fernán Sánchez de Tovar takes the same galleys along the English coast, and in 1380 up the Thames as far as Gravesend."
 nd_cas.3.a: "The sea north of Finisterre is ours too."
 nd_cas.3.a_tt: "The victory is remembered."
 nd_cas.4.t: "The Embassy to Timur"
 nd_cas.4.d: "In May 1403 Ruy González de Clavijo, chamberlain to King Henry, sails from the bay of Cádiz with a friar, a guardsman, a gift of falcons and a letter for the lord of Samarkand. Timur has just broken the Turkish sultan at Ankara, and a king at the far end of the Mediterranean wishes to know what kind of man now rules the East.\n\nThe embassy winters in Constantinople, crosses to Trebizond, and rides for months across Armenia and Persia, changing horses at the conqueror's own posting stations. In September 1404 it is received in a garden outside Samarkand, where Clavijo is seated above the envoy of the emperor of China. He sees the city's bazaars and unfinished mosques and writes all of it down. Timur dies that winter. The ambassadors reach Alcalá de Henares in March 1406 with no treaty and the best account of Central Asia in any European language."
 nd_cas.4.a: "Let it be copied, and read to the king."
 nd_cas.4.a_tt: "The embassy's report is kept."
 nd_cas.5.t: "The Lombards Speak"
 nd_cas.5.d: "The kingdom of Granada is a country of walled towns on rocks, and for two hundred years that was enough to keep it. It is not enough any longer. The Crown has brought founders from Brittany and Burgundy to cast guns at Écija, more than two hundred of them; the gunners on the royal roll, four men in 1479, are ninety one six years later. Thousands of pioneers cut a road ahead of the army so that oxen can drag the great lombards over the sierra.\n\nRonda, which had never been taken, surrenders after its water is cut and its walls are opened by stone shot. Málaga and Baza follow. Each siege is an undertaking of supply as much as of arms: tens of thousands of mules, a camp hospital the queen pays for, a town of stone built at Santa Fe when the tents burn. On the second of January 1492 the keys of the Alhambra are handed over without a shot."
 nd_cas.5.a: "No wall in the peninsula will stop us now."
 nd_cas.5.a_tt: "The siege train has proved itself."
 nd_cas.6.t: "The Playhouse and the Pulpit"
 nd_cas.6.d: "Two courtyards in Madrid, the Cruz and the Príncipe, fill every afternoon that it does not rain. Tradesmen stand in the yard and are called musketeers for the noise they make; women sit apart in a gallery known as the stewpot; gentlemen rent the windows of the houses around. The brotherhoods that hold the leases keep the hospitals of the town on what is taken at the door.\n\nThe theologians have never liked it. Women on the stage, friars mocked in the interludes, a whole city idle for three hours a day: each time the court goes into mourning they petition to have the yards closed for good. In 1598 they succeed, and the hospitals are begging within the year. The Council must decide whose argument weighs more, the confessor's or the hospital steward's."
 nd_cas.6.a: "The sick are fed by the comedy. Open the doors."
 nd_cas.6.a_tt: "Cultural tradition and prestige grow. The clergy are displeased."
 nd_cas.6.b: "A Christian commonwealth can live without players."
 nd_cas.6.b_tt: "The clergy are content and the faith is firmer. Our cultural influence suffers."
 nd_cas.7.t: "The Colonies of the Sierra Morena"
 nd_cas.7.d: "The royal road from Madrid to Cádiz crosses forty leagues of scrub where there is no village and no inn that is not a robbers' den. In 1767 the Crown undertakes to people it. A Bavarian contractor delivers six thousand German and Flemish Catholics; each family receives fifty fanegas, a house, tools, stock and ten years without tax. The charter written for them is a list of everything the reformers would like to be rid of in the rest of Castile: no entails, no convents, no offices for sale, and no passage for the flocks of the Mesta.\n\nPablo de Olavide, a Peruvian who reads the French philosophers, governs the colonies from La Carolina. A Capuchin sent to preach to the Germans denounces him to the Inquisition. In 1776 he is arrested, and two years later he hears himself declared a heretic before an invited audience of the men who had been his friends. The colonies are the Crown's work, and the Crown must say whether it stands by them."
 nd_cas.7.a: "The charter is the king's law. It stands, and so does its author."
 nd_cas.7.a_tt: "More settlers and cheaper farmland. The clergy are displeased."
 nd_cas.7.b: "The Holy Office has spoken. Find the colonies another governor."
 nd_cas.7.b_tt: "The clergy are content and stability is cheaper. New ideas spread more slowly."
 nd_cas.8.t: "The Banco de San Carlos"
 nd_cas.8.d: "The war with England has closed the Atlantic, and the silver that pays for everything is sitting in Havana. To get through it the treasury has issued notes that bear interest and pass as money, and they are already changing hands below their face. Francisco Cabarrús, a merchant of Bayonne settled in Madrid, offers a remedy: a bank owned by its shareholders and protected by the king, which will pay coin for the notes on demand, discount bills at four percent, supply the army and the fleet under contract and make the Crown's payments abroad.\n\nThe charter is signed on the second of June 1782. Shares are slow to sell, and towns and grain banks are leaned on to buy them. The bank opens all the same, and the next year it puts into circulation the first bank notes the kingdom has seen."
 nd_cas.8.a: "Paper that can be turned into silver is as good as silver."
 nd_cas.8.a_tt: "The bank opens its doors."
 nd_cas_concejos_de_villa_y_tierra: "Concejos de Villa y Tierra"
 nd_cas_concejos_de_villa_y_tierra_desc: "Between the Duero and the Tagus the land belongs to councils: a walled town and the villages of its district under one charter, governed by their householders and bound to march behind the town's banner. Whoever settles under the charter owes the muster, whatever tongue he speaks."
 nd_cas_tierras_y_acostamientos: "Tierras y Acostamientos"
 nd_cas_tierras_y_acostamientos_desc: "The king pays knights of his own. A tierra is a yearly sum charged on a named royal rent, and the man who holds it keeps a fixed number of lances ready to ride; an acostamiento retains a great lord's whole following. The royal books list them by name and by lance."
 nd_cas_estanco_de_la_sal: "Estanco de la Sal"
 nd_cas_estanco_de_la_sal_desc: "Every saltworks in the kingdom belongs to the Crown, and every household must buy its measure of salt from the king's store. Brine springs in the hills and pans in the tidal marshes become a revenue that does not wait on the Cortes."
 nd_cas_almojarifazgo: "Almojarifazgo"
 nd_cas_almojarifazgo_desc: "The customs of the Andalusian ports were taken over with Seville, together with their Arabic name and their officer, the almojarife. Whatever crosses the quay is weighed, valued and taxed, as it was under the emirs."
 nd_cas_castellano_drecho: "Castellano Drecho"
 nd_cas_castellano_drecho_desc: "The chancery writes in Castilian and not in Latin. King Alfonso the Wise corrected the wording of his law books and histories with his own hand so that the language should be straight, and a charter that a merchant and a knight can both read needs no clerk to explain it."
 nd_cas_alcabala: "Alcabala"
 nd_cas_alcabala_desc: "A tax on every sale in the kingdom, first granted by the Cortes of Burgos in 1342 to pay for the siege of Algeciras, renewed, and in 1393 granted for ever. It became the largest single revenue of the Crown."
 nd_cas_galeras_de_castilla: "Galeras de Castilla"
 nd_cas_galeras_de_castilla_desc: "The king's galleys are built in Seville and fight in the Channel. They destroyed an English fleet at La Rochelle in 1372 and burned Gravesend in 1380."
 nd_cas_ballesteros_de_nomina: "Ballesteros de Nómina"
 nd_cas_ballesteros_de_nomina_desc: "Each council keeps a roll of crossbowmen. A man on the roll is excused from the common taxes for as long as he owns the weapon, keeps a store of bolts and brings both to the muster."
 nd_cas_colegios_mayores: "Colegios Mayores"
 nd_cas_colegios_mayores_desc: "Diego de Anaya founded the college of San Bartolomé at Salamanca in 1401 to keep poor graduates at their books. Others followed at Valladolid and Alcalá. Their fellows went on to fill the benches of the royal courts and the chairs of the councils."
 nd_cas_embajada_a_tamorlan: "Embajada a Tamorlán"
 nd_cas_embajada_a_tamorlan_desc: "King Henry III sent Ruy González de Clavijo to the court of Timur at Samarkand. He was gone three years and brought back an account of every city, road and custom between Cádiz and Central Asia."
 nd_cas_juros_y_contadores: "Juros y Contadores"
 nd_cas_juros_y_contadores_desc: "A juro is an annuity sold by the Crown and charged on a named rent, paid before anything else that rent owes. The chief accountants keep the books that make one worth buying, and audit everyone who has handled the king's money."
 nd_cas_espingarderos: "Espingarderos"
 nd_cas_espingarderos_desc: "The towns send handgunners to the war of Granada by contract, so many men for so many months, each with his espingarda, his match and his bag of shot."
 nd_cas_tren_de_lombardas: "Tren de Lombardas"
 nd_cas_tren_de_lombardas_desc: "Founders from Brittany and Burgundy cast the Crown's guns at Écija, and pioneers cut roads across the sierra to bring them up. The war of Granada is won one breached wall at a time."
 nd_cas_ordenanza_de_1496: "Ordenanza de 1496"
 nd_cas_ordenanza_de_1496_desc: "One man in twelve is kept on the roll with his arms, and a later ordinance sorts the foot into pikes, shields and shot. The councils keep the lists, and the Crown pays only when it calls."
 nd_cas_espaderos_de_toledo: "Espaderos de Toledo"
 nd_cas_espaderos_de_toledo_desc: "The sword makers of Toledo are a guild of examined masters, and each strikes a registered mark on the tang of his blades. The mark is worth so much that it is forged from Solingen to Milan."
 nd_cas_corregidores: "Corregidores"
 nd_cas_corregidores_desc: "A corregidor is a royal judge sent to preside over a city council. He is a stranger to the town, serves a short term and is audited when he leaves it. The Cortes of Toledo of 1480 placed one in every city of the kingdom."
 nd_cas_positos: "Pósitos"
 nd_cas_positos_desc: "The village grain bank keeps wheat under three keys, lends seed at sowing and takes it back at harvest with a small increase. A royal pragmatic of 1584 gave every one of them the same rule and the same yearly account."
 nd_cas_corrales_de_comedias: "Corrales de Comedias"
 nd_cas_corrales_de_comedias_desc: "The Corral de la Cruz opened in Madrid in 1579 and the Corral del Príncipe in 1583. Both were courtyards leased by charitable brotherhoods, which kept the town's hospitals on what was taken at the door."
 nd_cas_plazas_mayores: "Plazas Mayores"
 nd_cas_plazas_mayores_desc: "Valladolid burned in 1561 and was rebuilt to a plan, around one closed square of uniform arcaded fronts. Madrid built its own in 1617. A market on working days, and on the great days the stage on which the Crown is seen."
 nd_cas_milicia_general: "Milicia General"
 nd_cas_milicia_general_desc: "With the tercios in Flanders and Italy, the kingdom itself stood unguarded. The general militia ordered in 1598 and again in 1609 enrolled householders under local captains to hold the coasts."
 nd_cas_loza_de_talavera: "Loza de Talavera"
 nd_cas_loza_de_talavera_desc: "The potters of Talavera de la Reina dip their earthenware in a white tin glaze and paint it blue and yellow. It is on every table in Castile and on the walls of the Escorial."
 nd_cas_relaciones_topograficas: "Relaciones Topográficas"
 nd_cas_relaciones_topograficas_desc: "Printed questionnaires go out to the towns of New Castile, asking each its lord, its jurisdiction, its fields and rivers, its trades and its saints. Some seven hundred places answer. The king reads his kingdom before he governs it."
 nd_cas_cinco_gremios_mayores: "Cinco Gremios Mayores"
 nd_cas_cinco_gremios_mayores_desc: "In 1667 the jewellers, mercers, silk merchants, clothiers and druggists of Madrid joined in one company. They supply the court, farm its rents, take deposits at interest and lend to the treasury."
 nd_cas_milicias_provinciales: "Milicias Provinciales"
 nd_cas_milicias_provinciales_desc: "The ordinance of January 1734 raised thirty three regiments of militia by lot in the provinces of the Crown of Castile, and in those provinces only. Each province clothes and arms its own."
 nd_cas_guardias_de_infanteria: "Guardias de Infantería"
 nd_cas_guardias_de_infanteria_desc: "A regiment of foot guards was raised in 1704 for the new dynasty: picked men, noble officers, better pay, and the post of honour on the right of the line."
 nd_cas_novatores: "Novatores"
 nd_cas_novatores_desc: "The innovators are physicians and mathematicians who argue, against the faculties, that the kingdom has fallen behind in the sciences and must read the moderns. Seville has had a royal society of medicine since 1700, and Father Feijoo began his Teatro Crítico in 1726."
 nd_cas_nuevas_poblaciones: "Nuevas Poblaciones"
 nd_cas_nuevas_poblaciones_desc: "The charter of July 1767 planted colonies of free farmers along the empty road to Andalusia. Each family holds fifty fanegas that can be neither divided nor entailed, and neither convent nor Mesta may enter."
 nd_cas_banco_nacional: "Banco Nacional"
 nd_cas_banco_nacional_desc: "The bank chartered in June 1782 pays coin for the Crown's notes, discounts bills, provisions the army and the fleet under contract and makes the king's payments abroad."
 nd_cas_granaderos_provinciales: "Granaderos Provinciales"
 nd_cas_granaderos_provinciales_desc: "The reform of 1766 enlarged the provincial militia and drew its grenadier companies together into divisions that serve beside the line."
 nd_cas_real_fabrica_de_espadas: "Real Fábrica de Espadas"
 nd_cas_real_fabrica_de_espadas_desc: "In 1761 King Charles III gathered the last sword makers of Toledo into a royal factory, working bought steel to one pattern for the whole army."
 nd_cas_libre_comercio_de_granos: "Libre Comercio de Granos"
 nd_cas_libre_comercio_de_granos_desc: "The pragmatic of July 1765 abolished the fixed price of grain and let wheat move and sell freely inside the kingdom. Landowners sowed more. The next bad harvest brought the riots of 1766."
 a_nd_cas_milicia_concejil: "Milicia Concejil"
 a_nd_cas_milicia_concejil_desc: "The host of a council and its villages, mustered by parish behind the town's banner with lance, shield and iron cap. Steady in defence of its own charter and slow to form up."
 levy_nd_cas_milicia_concejil: "Milicia Concejil Levy"
 levy_nd_cas_milicia_concejil_desc: "Householders of the town and its district, peasant and tradesman alike, called out under the council's banner."
 a_nd_cas_vasallos_del_rey: "Vasallos del Rey"
 a_nd_cas_vasallos_del_rey_desc: "Knights and squires who draw a yearly stipend from the royal rents and owe a fixed number of lances for it, each lance a man in harness on a covered horse."
 levy_nd_cas_vasallos_del_rey: "Vasallos del Rey Levy"
 levy_nd_cas_vasallos_del_rey_desc: "Nobles who hold a stipend from the Crown, summoned with the lances their grant obliges them to keep."
 a_nd_cas_ballesteros_de_nomina: "Ballesteros de Nómina"
 a_nd_cas_ballesteros_de_nomina_desc: "Crossbowmen on the town's roll, each with his weapon, his quiver and his store of bolts. They shoot hard and reload slowly."
 levy_nd_cas_ballesteros_de_nomina: "Ballesteros de Nómina Levy"
 levy_nd_cas_ballesteros_de_nomina_desc: "The enrolled crossbowmen of the councils, called out from the towns and villages alike."
 n_nd_cas_galera_de_castilla: "Galera de Castilla"
 n_nd_cas_galera_de_castilla_desc: "A royal galley from the yards of Seville, built to cross open water with crossbowmen and fire pots aboard. Less handy than a Mediterranean galley at closing a harbour."
 a_nd_cas_espingarderos: "Espingarderos"
 a_nd_cas_espingarderos_desc: "Handgunners hired from the towns for the war of Granada. The espingarda kills through a shield and frightens horses. It is slow to load."
 a_nd_cas_lombardas: "Lombardas"
 a_nd_cas_lombardas_desc: "Wrought iron bombards throwing stone balls, hauled over the sierra on roads cut for them. Nothing stands long in front of them and nothing moves more slowly."
 a_nd_cas_peones_de_la_ordenanza: "Peones de la Ordenanza"
 a_nd_cas_peones_de_la_ordenanza_desc: "The enrolled foot of the ordinances of 1496 and 1503: a third with the long pike, a third with sword and shield, and a third with crossbow or espingarda."
 levy_nd_cas_peones_de_la_ordenanza: "Peones de la Ordenanza Levy"
 levy_nd_cas_peones_de_la_ordenanza_desc: "One man in twelve, kept on the council's roll with his arms and paid when the Crown calls."
 a_nd_cas_milicia_general: "Milicia General"
 a_nd_cas_milicia_general_desc: "Householders enrolled under local captains with pike and arquebus, to guard the coasts while the tercios serve abroad."
 levy_nd_cas_milicia_general: "Milicia General Levy"
 levy_nd_cas_milicia_general_desc: "The general militia of the kingdom, raised from town and country in return for exemptions."
 a_nd_cas_milicias_provinciales: "Milicias Provinciales"
 a_nd_cas_milicias_provinciales_desc: "A provincial regiment of the ordinance of 1734, drawn by lot, clothed and armed by its own province and drilled a few days a year."
 levy_nd_cas_milicias_provinciales: "Milicias Provinciales Levy"
 levy_nd_cas_milicias_provinciales_desc: "Men drawn by lot in each province to fill its regiment of militia."
 a_nd_cas_guardias_de_infanteria: "Guardias de Infantería"
 a_nd_cas_guardias_de_infanteria_desc: "The foot guards of 1704: picked men under noble officers. They do not give ground, and they cost what a household regiment costs to feed and clothe."
 a_nd_cas_granaderos_provinciales: "Granaderos Provinciales"
 a_nd_cas_granaderos_provinciales_desc: "The grenadier companies of the provincial militia, formed into divisions and kept under arms long enough to be soldiers."
 levy_nd_cas_granaderos_provinciales: "Granaderos Provinciales Levy"
 levy_nd_cas_granaderos_provinciales_desc: "The tallest men of each province's militia, called to serve beside the line."
 nd_cas_salinas_reales: "Salinas Reales"
 nd_cas_salinas_reales_desc: "A royal saltworks. Brine is led from the spring over terraces of clay and timber and left to the sun, or sea water is let into the pans of a tidal marsh. It can stand only where the location itself yields salt."
 nd_cas_salinas_reales_sal_de_granjas: "Salt of the Pans"
 nd_cas_salinas_reales_sal_de_granjas_desc: "Salt raked from the evaporating pans and carried to the king's store."
 nd_cas_aduana: "Aduana del Almojarifazgo"
 nd_cas_aduana_desc: "The customs house of a Castilian port. The king's officers weigh and tax whatever crosses the quay. Merchants gain a fixed tariff and a royal judge, and lose the habit of landing goods unseen."
 nd_cas_aduana_maintenance: "Customs House Upkeep"
 nd_cas_aduana_maintenance_desc: "Registers, seals and the customs boat."
 nd_cas_colegio_mayor: "Colegio Mayor"
 nd_cas_colegio_mayor_desc: "A residential college inside a university, where an endowment keeps a few dozen graduates in law and theology under a rule of their own. Its fellows become the Crown's judges and councillors."
 nd_cas_colegio_mayor_maintenance: "College Upkeep"
 nd_cas_colegio_mayor_maintenance_desc: "Books, paper, candles for the library and wine for the fellows' table."
 nd_cas_colegio_needs_university_tt: "A University stands in this location"
 nd_cas_contaduria_mayor: "Contaduría Mayor"
 nd_cas_contaduria_mayor_desc: "The chief accounting office of the Crown. One bench farms out the royal rents and records what each is pledged for, and the other audits everyone who has handled the king's money. Its books are what make a juro worth buying."
 nd_cas_contaduria_mayor_maintenance: "Accounting Office Upkeep"
 nd_cas_contaduria_mayor_maintenance_desc: "Ledgers, counting tables and the strongbox."
 nd_cas_espaderia: "Espadería"
 nd_cas_espaderia_desc: "A sword maker's shop of the Toledo kind. The blade is forged around a core of soft iron, quenched, and proved by bending it point to hilt. It needs bar iron within reach of the local market."
 nd_cas_espaderia_hojas_de_marca: "Marked Blades"
 nd_cas_espaderia_hojas_de_marca_desc: "Blades forged by an examined master and struck with his registered mark."
 nd_cas_espaderia_real_fabrica: "Royal Factory Pattern"
 nd_cas_espaderia_real_fabrica_desc: "The masters work bought steel to a single pattern under one roof, and turn out more blades from the same hands."
 nd_cas_posito: "Pósito"
 nd_cas_posito_desc: "The grain bank of a Castilian village: a stone barn with three keys. It buys wheat after a good harvest, lends seed at sowing and sells bread grain at a fixed price when the market fails. It stands only in grain country."
 nd_cas_posito_maintenance: "Grain Bank Upkeep"
 nd_cas_posito_maintenance_desc: "The barn's walls and roof, and the steward's yearly account."
 nd_cas_corral_de_comedias: "Corral de Comedias"
 nd_cas_corral_de_comedias_desc: "A playhouse made of a courtyard between houses, with a stage at one end and the crowd standing in the yard. A charitable brotherhood holds the lease and keeps the town's hospital on the takings."
 nd_cas_corral_de_comedias_maintenance: "Playhouse Upkeep"
 nd_cas_corral_de_comedias_maintenance_desc: "Costumes, timber for the staging, playbills and wine for the company."
 nd_cas_plaza_mayor: "Plaza Mayor"
 nd_cas_plaza_mayor_desc: "One closed rectangle of uniform arcaded houses with the council's balcony on one side. A market on working days, and on the great days the place where the Crown shows itself."
 nd_cas_plaza_mayor_maintenance: "Square Upkeep"
 nd_cas_plaza_mayor_maintenance_desc: "Paving and arcades, awnings and hangings for the balconies, and the market's weights and measures."
 nd_cas_alfar: "Alfar de Talavera"
 nd_cas_alfar_desc: "A pottery of the Talavera kind. Earthenware is dipped in a white glaze of tin and painted before the second firing. It needs clay within reach of the local market."
 nd_cas_alfar_loza_estannifera: "Tin Glazed Ware"
 nd_cas_alfar_loza_estannifera_desc: "Plates, jars and tiles in white, blue and yellow."
 nd_cas_casa_de_los_cinco_gremios: "Casa de los Cinco Gremios"
 nd_cas_casa_de_los_cinco_gremios_desc: "The house of the five great guilds of the capital: jewellers, mercers, silk merchants, clothiers and druggists in one company. They supply the court, farm its rents and lend to the treasury."
 nd_cas_casa_de_los_cinco_gremios_maintenance: "Guild House Upkeep"
 nd_cas_casa_de_los_cinco_gremios_maintenance_desc: "The stock in trade of the five guilds, and the company's books."
 nd_cas_nueva_poblacion: "Nueva Población"
 nd_cas_nueva_poblacion_desc: "A colony of free farmers under the charter of 1767, planted on empty land beside a road to the capital. No entail, no convent and no passage for the flocks of the Mesta. Once the land has filled, the colony becomes an ordinary village."
 nd_cas_nueva_poblacion_maintenance: "Colony Upkeep"
 nd_cas_nueva_poblacion_maintenance_desc: "Houses, tools and stock supplied to each family by the Crown."
 nd_cas_banco_de_san_carlos: "Banco de San Carlos"
 nd_cas_banco_de_san_carlos_desc: "A bank owned by its shareholders and protected by the king. It pays coin for the Crown's notes, discounts bills and holds the contract to provision the army and the fleet. It cannot stand beside a Central Bank."
 nd_cas_banco_de_san_carlos_maintenance: "Bank Upkeep"
 nd_cas_banco_de_san_carlos_maintenance_desc: "Coin in the vault, ledgers and the paper for its notes."
 nd_cas_banco_no_central_bank_tt: "No Central Bank stands in this location"

 # ===== DESTINY =====
 nd_cas_dest_colegios_tt: "At least 2 of our locations have a Colegio Mayor"
 nd_cas_dest_valladolid_42_tt: "We own Valladolid and it has at least 42 development"
 nd_cas_dest_valladolid_56_tt: "We own Valladolid and it has at least 56 development"
 nd_cas_dest_granada_share_tt: "We or our non-sovereign subjects hold at least 75% of the locations in the Granada area"
 nd_cas_destiny: "La Mayoría del Rey"
 nd_cas_destiny_desc: "Alfonso XI was declared of age at fourteen, at Valladolid in 1325. For thirteen years his regents had fought each other over him, and every town had hired its own protector. Keep the kingdom steady, and it can turn to what it chose at its founding: a Crown that rules through the towns' money and its own judges, or a Crown that rides at the head of its great houses."
 nd_cas_dest_cerco_de_algeciras: "El Cerco de Algeciras"
 nd_cas_dest_cerco_de_algeciras_desc: "In 1342 the towns in Cortes at Burgos voted the king a tax on every sale, and he spent it on a siege that lasted twenty months. A hired Genoese fleet shut the harbour; the defenders answered with the first guns fired in Spain. Hold Algeciras and Gibraltar, the two doors of the Strait, and have a thousand in gold in the chest. A king whom the towns will pay does not need to ask his nobles."
 nd_cas_dest_los_letrados: "Los Letrados"
 nd_cas_dest_los_letrados_desc: "A graduate in law owes his place to the king and to nothing else. The colleges keep poor scholars at their books until the Crown has a bench for them. Have a Colegio Mayor open in two places, as San Bartolomé stood at Salamanca and Santa Cruz at Valladolid, raise Valladolid to 42 development as the town where the Audiencia sits, and hold two thousand in gold."
 nd_cas_dest_cortes_de_toledo: "Las Cortes de Toledo"
 nd_cas_dest_cortes_de_toledo_desc: "At Toledo in 1480 the Crown took back half the rents it had granted away in twenty years of civil war, gave the graduates the majority of the Royal Council and sent a royal judge to preside in every city. Adopt the Corregidores, raise Valladolid to 56 development, stand at 75 prestige and hold three thousand in gold. The great houses will keep their titles and lose the kingdom."
 nd_cas_dest_la_frontera: "La Frontera"
 nd_cas_dest_la_frontera_desc: "Between the king's campaigns the war with Granada belongs to the houses that hold the march: a castle scaled at night, a cavalcade home with cattle and captives. Hold Antequera, which fell in 1410 to the infante Fernando and the lords who rode with him, and Huéscar at the far end of the line, which Rodrigo Manrique took in 1434. Stand at 50 prestige: a host follows a name."
 nd_cas_dest_guerra_de_granada: "La Guerra de Granada"
 nd_cas_dest_guerra_de_granada_desc: "The last war began as a lord's feat, when the Marquis of Cádiz took Alhama by surprise in 1482, and for ten years the great houses led its hosts. Hold Granada and Málaga and three quarters of the Granada area, in our own hands or a vassal's, and have two thousand in gold: sieges are won by whoever can still pay in the tenth month."
 nd_cas_dest_islas_de_senorio: "Islas de Señorío"
 nd_cas_dest_islas_de_senorio_desc: "Beyond the water Castile was carried by its lords. Henry III gave Jean de Béthencourt the right to conquer the Canaries in 1402, and Lanzarote, Fuerteventura and La Gomera remained islands of lordship. In 1497 the Duke of Medina Sidonia's men occupied Melilla. Hold Melilla, Teguise on Lanzarote, Maxorata on Fuerteventura and Hipalán on La Gomera, and stand at 75 prestige."
 nd_cas.9.t: "The King Comes of Age"
 nd_cas.9.d: "The regencies are over. For a generation the kingdom was a prize that uncles, grandmothers and cousins tore at while the child who owned it learned to ride. Now there is one hand on the seal, and the men who governed in the king's name are waiting to learn what he remembers.\n\nThe kingdom is quiet enough to look past next year. What it builds now follows from what it chose at its founding."
 nd_cas.9.a: "Let it be known that the king rules in person."
 nd_cas.9.a_tt: "The destiny of Castile lies open."
 nd_cas.10.t: "The Doors of the Strait"
 nd_cas.10.d: "Algeciras has opened its gates and the banner of Castile flies on the Rock. No army from Africa will land in Spain again without asking leave of the king's galleys.\n\nThe siege was paid for by a tax the towns voted in Cortes, by florins borrowed from the Pope and the king of France, and at the worst by the king's own crown, left in pawn. The Genoese admiral was paid in the end. The towns have noticed what their money can do."
 nd_cas.10.a: "The towns paid for this, and they shall be told so."
 nd_cas.10.a_tt: "The Strait is ours."
 nd_cas.11.t: "Gown or Sword"
 nd_cas.11.d: "The colleges are full and their fellows are ready for office. The Crown now sends a judge of its own to preside over the councils of the cities, and it must decide what kind of man he is.\n\nA corregidor of the gown is a graduate: he knows the Partidas by heart, owes his career to the king and has no cousins in the province. A corregidor of cloak and sword is a knight: he can muster a garrison, face down a marquis at the gate and receive a foreign envoy without embarrassment, and he hires a lawyer to sit beside him."
 nd_cas.11.a: "Send graduates. A judge should know the law."
 nd_cas.11.a_tt: "New ideas cost less to embrace and roads are built faster. Army morale drops."
 nd_cas.11.b: "Send knights. A city obeys a man who can ride."
 nd_cas.11.b_tt: "Better reputation abroad, garrisons fill faster, and spies find us harder."
 nd_cas.12.t: "The Declarations of Toledo"
 nd_cas.12.d: "The Cortes have sat at Toledo and the great houses have come out of them poorer. Every grant of the last twenty years has been read aloud, and those that were extorted in the wars have been cut or cancelled. The Royal Council has a majority of men of law. There is a royal judge in every city.\n\nWhat the Crown has recovered can go two ways. It can fill the treasury, with the mints and the rents back in the king's hand. Or it can arm the brotherhood of the towns, whose archers already keep the roads and will make the country hard going for any army that enters it uninvited."
 nd_cas.12.a: "The rents return to the treasury."
 nd_cas.12.a_tt: "Cheaper loans and more income from minting. The clergy lose annuities too."
 nd_cas.12.b: "Arm the Hermandad of the towns."
 nd_cas.12.b_tt: "Fewer join rebels, trade reaches further by land, and invaders waste away."
 nd_cas.13.t: "The Men of the March"
 nd_cas.13.d: "Antequera and Huéscar are ours, one at each end of the frontier. Neither was taken by a tax or a decree. They were taken by the men who live on the march: lords who keep a hundred lances at their own cost, who know every pass and every watchtower, and who learned the business from their fathers.\n\nThe ballads already name them. The king's part was to be there and to confirm what they won."
 nd_cas.13.a: "Their swords won it. Let them hold it."
 nd_cas.13.a_tt: "The frontier is in the hands of the great houses."
 nd_cas.14.t: "The Keys of the Alhambra"
 nd_cas.14.d: "Granada has surrendered and the keys of the Alhambra have been handed over at the gate. A kingdom of silk farmers, terraced hillsides and walled ports is ours, on terms sworn in the king's name: its people keep their faith, their judges and their property.\n\nThe houses that fought for ten years expect to be paid in land, and there is no other land to pay them with. The archbishop argues that the terms are an oath, and that a silk weaver left in peace is worth more than a vacant estate."
 nd_cas.14.a: "Share out the land among those who won it."
 nd_cas.14.a_tt: "Larger levies and steadier morale. The peasants who now have a lord resent it."
 nd_cas.14.b: "The terms were sworn. They will be kept."
 nd_cas.14.b_tt: "More tolerance of other faiths, more silk, and room for one more culture."
 nd_cas.15.t: "Lords of the Islands"
 nd_cas.15.d: "The banner of Castile flies at Melilla and on three islands in the Ocean Sea, and in each place it was raised by a lord and his household at their own cost and for their own profit. The Crown's share is the fifth and the homage.\n\nAn island is a small estate with a harbour. Its lord can use the harbour to raid the coast of Barbary, as the lords of Lanzarote have always done, and come home with captives and cattle. Or he can bring cane from Madeira and a Genoese to pay for the mill, and ship sugar to Flanders."
 nd_cas.15.a: "Fit out the cavalcades."
 nd_cas.15.a_tt: "Ships are built faster, light infantry fights better, and armies waste less."
 nd_cas.15.b: "Plant cane and build the mills."
 nd_cas.15.b_tt: "More sugar, trade reaches further by sea, and our merchants gain power."
 STATIC_MODIFIER_NAME_nd_cas_dest_toga: "Corregidores of the Gown"
 STATIC_MODIFIER_DESC_nd_cas_dest_toga: "Graduates preside in the councils of the cities. New learning finds readers, and the roads and bridges a corregidor must inspect are kept in repair. The men who lead the host think little of a kingdom run by clerks."
 STATIC_MODIFIER_NAME_nd_cas_dest_capa_y_espada: "Corregidores of Cloak and Sword"
 STATIC_MODIFIER_DESC_nd_cas_dest_capa_y_espada: "Knights preside in the councils of the cities. They keep the garrisons mustered, watch who comes and goes at the ports, and receive an envoy as a gentleman should."
 STATIC_MODIFIER_NAME_nd_cas_dest_reduccion_de_juros: "The Reduction of the Juros"
 STATIC_MODIFIER_DESC_nd_cas_dest_reduccion_de_juros: "The annuities granted away in the civil wars have been cut by half and the mints answer to the king alone. Chapters and convents held such paper too, and have not forgiven the loss."
 STATIC_MODIFIER_NAME_nd_cas_dest_hermandad_general: "The Hermandad General"
 STATIC_MODIFIER_DESC_nd_cas_dest_hermandad_general: "The brotherhood of the towns keeps archers on every road and tries a highwayman where it catches him. An invader finds every village warned and every ford watched."
 STATIC_MODIFIER_NAME_nd_cas_dest_repartimiento: "The Repartimiento"
 STATIC_MODIFIER_DESC_nd_cas_dest_repartimiento: "The conquered kingdom has been measured and shared out among the houses that took it. Their hosts are larger for it. The farmers who stayed have a lord they did not have before."
 STATIC_MODIFIER_NAME_nd_cas_dest_capitulaciones: "The Capitulations Kept"
 STATIC_MODIFIER_DESC_nd_cas_dest_capitulaciones: "The terms sworn at the surrender hold. The people of Granada keep their faith, their judges and their looms, and the silk of the Alpujarras goes to market as it always did."
 STATIC_MODIFIER_NAME_nd_cas_dest_cabalgadas: "Cavalcades to Barbary"
 STATIC_MODIFIER_DESC_nd_cas_dest_cabalgadas: "The lords of the islands and of the Andalusian coast fit out raids on the shore opposite. Their men land light, move fast and are back aboard before the country is roused."
 STATIC_MODIFIER_NAME_nd_cas_dest_ingenios: "The Sugar Mills"
 STATIC_MODIFIER_DESC_nd_cas_dest_ingenios: "Cane grows wherever a stream can be led to it. Genoese money builds the mills, and the sugar goes north to Flanders in the lords' own ships."
 nd_cas_dest_chancilleria: "Real Chancillería"
 nd_cas_dest_chancilleria_desc: "The high court of the Crown, which hears appeals in the king's name and keeps his seal. It sits at Valladolid for the lands north of the Tagus and at Granada for those south of it, and nowhere else. One chamber decides who is noble and so who pays tax. A city with a chancillería lives off its suitors: proctors, notaries, innkeepers and the students who hope to plead there."
 nd_cas_dest_chancilleria_maintenance: "Oidores and Escribanos"
 nd_cas_dest_chancilleria_maintenance_desc: "Paper for the pleadings, the books of the law, wax for the royal seal and the judges' robes."

 # ===== BUREAUCRACIES =====
 cas_alcaldes_de_corte_bureaucracy: "Alcaldes de Casa y Corte"
 cas_alcaldes_de_corte_bureaucracy_desc: "The king's own judges travel with his household and hold the Rastro, the ground five leagues around wherever the court has halted. Within it they try crimes without appeal, keep the peace, and fix the prices at which the country around must feed the court. Suits reserved to the king are heard before them whatever lord or town holds the place."
 cas_alfaqueques_bureaucracy: "Alfaqueques"
 cas_alfaqueques_bureaucracy_desc: "The Siete Partidas ask six things of the man who ransoms captives from the Moors: that he be truthful, without greed, a speaker of Arabic, kind, brave, and rich enough to answer for the money he carries. Twelve good men of a town were to choose him. In 1439 John II set an alfaqueque mayor of Castile over them all in the person of Juan Arias de Saavedra, a lord of the Granadan frontier, and the office passed to his son."
 cas_consulado_de_burgos_bureaucracy: "Consulado de Burgos"
 cas_consulado_de_burgos_bureaucracy_desc: "The merchants of Burgos buy the clip of the Mesta's flocks and send it to Laredo and Bilbao for the looms of Flanders, and the Flemish cloth that enters Castile comes back through their hands. Long joined in a guild of their own, they were given a consulate by Queen Isabella in 1494, after the pattern of the Consulate of the Sea."
 cas_guardas_de_castilla_bureaucracy: "Guardas de Castilla"
 cas_guardas_de_castilla_bureaucracy_desc: "Standing companies of horse in the king's pay, founded in May 1493 as twenty-five companies of a hundred: three men-at-arms for every jinete riding in the Moorish style. They were quartered across the kingdom, mustered and paid by royal officers, cut down after Pavia in 1525, and kept until 1704."

 # The auto modifier that grants the country's slots on formation
 AUTO_MODIFIER_NAME_nd_cas_bureaucracy_authority: "Offices of the Court of Castile"
 AUTO_MODIFIER_DESC_nd_cas_bureaucracy_authority: "The court of Castile has room for two institutions of its own: the Alcaldes de Casa y Corte, the Alfaqueques, the Consulado de Burgos or the Guardas de Castilla."
