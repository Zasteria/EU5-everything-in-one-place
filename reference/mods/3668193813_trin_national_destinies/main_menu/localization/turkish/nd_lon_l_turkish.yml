l_turkish:
 STATIC_MODIFIER_NAME_nd_lon_imperium_totius_hispaniae: "Imperator Totius Hispaniae"
 STATIC_MODIFIER_DESC_nd_lon_imperium_totius_hispaniae: "The king in León styles himself emperor over all Hispania, as Alfonso VII did in 1135. Claims are found quickly and vassals are kept; the estates at home pay for the pageant."
 STATIC_MODIFIER_NAME_nd_lon_reino_de_los_decreta: "Kingdom of the Decreta"
 STATIC_MODIFIER_DESC_nd_lon_reino_de_los_decreta: "The king has sworn the oath of 1188: no war, no peace and no treaty without bishops, nobles and the good men of the towns. He is obeyed in the villages and rules with less of his own hand."
 STATIC_MODIFIER_NAME_nd_lon_mayorazgos: "The Entail Is Law"
 STATIC_MODIFIER_DESC_nd_lon_mayorazgos: "Great houses pass whole to the eldest son and stand behind the crown that guaranteed it. Land that cannot be sold raises nobody who was not born to it."
 STATIC_MODIFIER_NAME_nd_lon_herencia_partida: "Divided Inheritance"
 STATIC_MODIFIER_DESC_nd_lon_herencia_partida: "The courts know which law prevails, and estates go on being divided among heirs. The towns buy the pieces, and the great houses do not forgive it."
 STATIC_MODIFIER_NAME_nd_lon_ley_perpetua: "The Perpetual Law"
 STATIC_MODIFIER_DESC_nd_lon_ley_perpetua: "The crown has sworn the articles of the Santa Junta: proctors paid by their towns, no office for foreigners, and Cortes every three years whether called or not."
 STATIC_MODIFIER_NAME_nd_lon_villalar: "Villalar"
 STATIC_MODIFIER_DESC_nd_lon_villalar: "The army of the towns was broken in the rain and its captains beheaded in the square the next morning. The crown has no rival left inside the kingdom, and the towns remember."
 STATIC_MODIFIER_NAME_nd_lon_precio_justo: "The Just Price"
 STATIC_MODIFIER_DESC_nd_lon_precio_justo: "The courts hold that a fair price is the one freely agreed. Exchange dealers and fair merchants are left to their bargains, and the pulpits that called them usurers are told to be quiet."
 STATIC_MODIFIER_NAME_nd_lon_manual_de_confesores: "The Confessor's Manual"
 STATIC_MODIFIER_DESC_nd_lon_manual_de_confesores: "The crown backs the confessional against the counting house. A merchant's conscience is examined by the book, and what was gained unjustly is given back."
 STATIC_MODIFIER_NAME_nd_lon_junta_soberana: "The Sovereign Junta"
 STATIC_MODIFIER_DESC_nd_lon_junta_soberana: "The Junta takes the revenues, names the generals and calls every parish to arms. Men fight well for a government they can walk to. What the Junta takes, the crown does not get back whole."
 STATIC_MODIFIER_NAME_nd_lon_socorro_de_inglaterra: "Help from England"
 STATIC_MODIFIER_DESC_nd_lon_socorro_de_inglaterra: "Muskets, powder, cloth and coin arrive by sea, and a great power's recognition with them. The army is cheaper to keep and the kingdom is heard abroad."
 nd_lon.1.t: "A King in León"
 nd_lon.1.d: "There is a king in León again, and a court in the city on the plain between the Bernesga and the Torío. Behind it lie the mountains where the kingdom began and the vault of San Isidoro where its kings are buried; before it lie the wheat lands, the Duero and every question the old kingdom left open when its crown was joined to a neighbour's.\n\nThe oldest of those questions is what a king of León is. One answer is the title Alfonso VII took in the cathedral in 1135: the heir of Toledo, emperor over all Hispania, to whom the other Christian princes of the peninsula owe homage whether they pay it or not. The other was sworn in the cloister of San Isidoro in 1188, when Alfonso IX promised to make neither war nor peace without the bishops, the nobles and the chosen men of the towns: a king who is first in his kingdom because the kingdom agreed to it.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_lon.1.a: "León is the head of Hispania. Let the others remember it."
 nd_lon.1.a_tt: "Faster claims, more room for vassals and loyal ones. The estates are less content."
 nd_lon.1.b: "We will rule as Alfonso swore: with the land, not over it."
 nd_lon.1.b_tt: "Cheaper stability, better control and content estates. The crown holds less power."
 nd_lon_formed_tt: "León has been formed"
 nd_lon_path_a_tt: "Chose the #bold Crown of the Emperors#! destiny"
 nd_lon_path_b_tt: "Chose the #bold Kingdom of the Decreta#! destiny"
 nd_lon.2.t: "The Laws of Toro"
 nd_lon.2.d: "The jurists have finished. Eighty-three laws lie on the table of the Cortes gathered at Toro, and most of them settle things the courts have quarrelled over for two centuries: which code a judge must open first, what a widow keeps, when a son may be disinherited.\n\nOne group of them does something new. It lets a man bind his lands into a mayorazgo, to pass undivided and unsold to his eldest son and to that son's eldest son for ever. The great houses have asked for nothing else for a generation. The towns point out that land locked up in this way never comes to market again, and that a kingdom of forty families is not the kingdom their charters describe."
 nd_lon.2.a: "Promulgate them whole, entail and all."
 nd_lon.2.a_tt: "Unlocks the Leyes de Toro policy. The nobles are content and fewer people rise in rank."
 nd_lon.2.b: "The order of the laws, yes. The entail, no."
 nd_lon.2.b_tt: "Quicker lawmaking and more people rising in rank. The nobles are less content."
 nd_lon.3.t: "The Comunidades"
 nd_lon.3.d: "Zamora has thrown out its corregidor. Toro, Salamanca and León have sent proctors to the Santa Junta, and the bishop of Zamora, Antonio de Acuña, is on the road through the Tierra de Campos at the head of a company of his own priests with arquebuses on their shoulders. The towns say they are not rebels. They say the kingdom is a body, the king its head, and that a head which taxes the body to pay for foreign crowns has forgotten what it is for.\n\nThe Junta has put its demands in writing: proctors paid by their towns, offices for natives only, and Cortes that meet every three years without waiting to be called. The great lords have not yet chosen a side, and they will choose the one that looks like winning."
 nd_lon.3.a: "The towns are the kingdom. Swear their articles."
 nd_lon.3.a_tt: "Content towns and a willing parliament. The crown holds less power."
 nd_lon.3.b: "Call out the lords and scatter them."
 nd_lon.3.b_tt: "A stronger crown and a more centralised kingdom. The towns are less content."
 nd_lon.4.t: "The Doctors of Money"
 nd_lon.4.d: "The merchants of the fairs have a question of conscience and have brought it to Salamanca. A bill bought in Flanders is paid in León for more coin than was given for it. Is the difference usury?\n\nThe masters have answered at length. Money, writes Doctor Azpilcueta, is worth more where it is scarce and less where it is plentiful, like any other merchandise, and a man who is paid for carrying it from one place to the other has sold a service and not time. The just price of a thing, his colleagues add, is what buyers and sellers commonly agree upon in an open market, and no prince or preacher can know it better than they do.\n\nThe same masters have also written the manuals from which every confessor in the kingdom examines a merchant's sins. The crown can take either half of their teaching to heart."
 nd_lon.4.a: "The price freely agreed is the just price."
 nd_lon.4.a_tt: "More merchant capacity and content burghers. The clergy are less content."
 nd_lon.4.b: "Let every merchant answer to his confessor."
 nd_lon.4.b_tt: "A more devout kingdom and content clergy. Less merchant capacity."
 nd_lon.5.t: "The Junta Declares War"
 nd_lon.5.d: "The bells of Oviedo rang through the night. In the morning the Junta General met in the chapter house of the cathedral, as it has met every three years since 1444, and did three things it has never done before: it declared itself the sovereign authority of the land, it declared war on the Emperor of the French, and it put two of its members on a Jersey privateer bound for Falmouth with a letter for the King of England.\n\nNow it must find an army. The Principality has men in every parish who will turn out at the bell with whatever hangs over the hearth. It has almost no muskets, no trained officers, and no money that was not the king's a week ago."
 nd_lon.5.a: "The Junta is the kingdom now. Arm every parish."
 nd_lon.5.a_tt: "Higher morale and levies that recover faster. The crown holds less power."
 nd_lon.5.b: "Everything depends on what London sends."
 nd_lon.5.b_tt: "A cheaper army and warmer relations abroad."
 nd_lon_fuero_de_leon: "Fuero of León"
 nd_lon_fuero_de_leon_desc: "On 30 July 1017 Alfonso V and his court, gathered in the cathedral, gave the kingdom forty-eight precepts: twenty for every land the king ruled and twenty-eight for the city and its district. The market is held in peace each Wednesday, no officer may force the door of a house, and the craftsman who comes to settle pays lighter dues."
 nd_lon_reyes_en_san_isidoro: "Kings in San Isidoro"
 nd_lon_reyes_en_san_isidoro_desc: "Eleven kings and a dozen queens lie in the narthex of San Isidoro, under a vault painted with the labours of the months. A king who governs beside them governs with their weight behind him. Unlocks the Panteón de los Reyes in the city of León."
 nd_lon_camino_frances: "The French Way"
 nd_lon_camino_frances_desc: "The road to Santiago crosses the kingdom from Sahagún to the pass above Villafranca, and the kings have lined it with boroughs of foreign settlers under their own law. Unlocks the Burgo de Francos."
 nd_lon_gente_de_la_montana: "People of the Mountain"
 nd_lon_gente_de_la_montana_desc: "The concejos of the Cantabrian valleys send foot with spears, throwing darts and hide shields, called out by their own valley and led by their own neighbours. An army that enters their passes is bled by them. Unlocks the Peones de la Montaña levy."
 nd_lon_estudio_salmantino: "Estudio of Salamanca"
 nd_lon_estudio_salmantino_desc: "Alfonso IX of León founded the schools of Salamanca in 1218, and in 1255 the Pope gave their masters the right to teach anywhere in Christendom. They train canonists for the Church and jurists for the crown."
 nd_lon_concejo_abierto: "Concejo Abierto"
 nd_lon_concejo_abierto_desc: "Every householder of the village, called by the bell to the church porch, votes on the pasture, the water, the wood and the days of common labour each house owes. Unlocks the Casa de Concejo."
 nd_lon_branas_y_puertos: "Brañas and High Pastures"
 nd_lon_branas_y_puertos_desc: "At the end of spring the vaqueiros and the mountain concejos drive the cattle up to grass that is under snow half the year, and bring them down again before it returns. Unlocks the Braña."
 nd_lon_principado_de_asturias: "Principality of Asturias"
 nd_lon_principado_de_asturias_desc: "Since 1388 the land where the kingdom began belongs to the heir of the crown, with the title of prince, so that no great house can hold it against the king again. A succession with a place to stand is cheaper to keep steady."
 nd_lon_caballeros_de_alcantara: "Knights of Alcántara"
 nd_lon_caballeros_de_alcantara_desc: "The brethren of San Julián del Pereiro took arms on the Côa under Fernando II of León and took the name of Alcántara when Alfonso IX gave them the bridge town in 1218. Unlocks the Freires de Alcántara."
 nd_lon_junta_general: "Junta General of the Principality"
 nd_lon_junta_general_desc: "From 16 November 1444 the proctors of the Asturian concejos meet in the chapter house of Oviedo cathedral. They vote what the land will pay and leave a standing deputation to see it spent as voted."
 nd_lon_leyes_de_toro: "Leyes de Toro"
 nd_lon_leyes_de_toro_desc: "The eighty-three laws given at Toro on 7 March 1505 tell a judge which law prevails when two disagree, and give the great houses the mayorazgo, the entail that keeps an estate whole under its eldest son."
 nd_lon_prensas_de_salamanca: "Presses of Salamanca"
 nd_lon_prensas_de_salamanca_desc: "Salamanca had a press by about 1480. In August 1492 an unnamed printer there set Nebrija's grammar of Castilian, the first printed grammar of any modern tongue. A university town prints for its own lecture halls."
 nd_lon_comunidades: "Comunidades"
 nd_lon_comunidades_desc: "In 1520 Zamora, Toro, Salamanca and León send proctors to the Santa Junta, and the bishop of Zamora takes the field with a company of armed priests. Unlocks the Milicia Comunera levy."
 nd_lon_doctores_de_la_moneda: "Doctors of Money"
 nd_lon_doctores_de_la_moneda_desc: "Martín de Azpilcueta's commentary on exchange (1556) says that coin is worth less where coin is plentiful, and his colleagues reason out the just price from what buyers will freely give. The kingdom's coin is steadier for being understood."
 nd_lon_galeones_agalerados: "Galleons of Menéndez de Avilés"
 nd_lon_galeones_agalerados_desc: "Pedro Menéndez de Avilés, nine times captain general of the Indies fleet, designed in 1561 a class of twelve galleons of 230 tons, long, low and fitted for oars. They were called the Twelve Apostles. Unlocks the Galeoncete."
 nd_lon_maiz_y_horreos: "Maize and Hórreos"
 nd_lon_maiz_y_horreos_desc: "In 1605 Gonzalo Méndez de Cancio came home to Asturias from the governorship of Florida with two chests of maize. Within two generations it was the bread of the wet north, and the raised granary grew a gallery to dry the cobs. Unlocks the Hórreo."
 nd_lon_puertos_secos: "Dry Ports"
 nd_lon_puertos_secos_desc: "The customs houses on the land border with Portugal stand at Ciudad Rodrigo, Zamora, Alcañices and Puebla de Sanabria, along a frontier drawn at Alcañices in 1297 and hardly moved since."
 nd_lon_plazas_de_la_raya: "Strongholds of the Raya"
 nd_lon_plazas_de_la_raya_desc: "The Portuguese war of 1640 to 1668 turns a quiet border into a front. Ciudad Rodrigo is refortified, the Fuerte de la Concepción rises facing Almeida, and the Principality raises a tercio of its own. Unlocks the Tercio del Principado."
 nd_lon_lienzos_del_reino: "Linen of the Kingdom"
 nd_lon_lienzos_del_reino_desc: "Flax from the watered plain of the Órbigo is retted in the river and spun in every kitchen through the winter, and from the middle of the eighteenth century it is woven for the crown's account as well. Unlocks the Fábrica de Lienzos."
 nd_lon_teatro_critico: "Teatro Crítico Universal"
 nd_lon_teatro_critico_desc: "Benito Jerónimo Feijoo, Benedictine and professor at Oviedo from 1709, wrote eight volumes against vulgar errors from his cell in San Vicente between 1726 and 1740. They were read from Lima to Naples."
 nd_lon_ferrerias_y_mazos: "Forges and Tilt Hammers"
 nd_lon_ferrerias_y_mazos_desc: "In El Bierzo and the Asturian valleys ore comes from the hill, charcoal from the chestnut and the oak, and a leat drives the hammer. Bar iron, ploughshares, nails and scythes go down to the plain."
 nd_lon_real_instituto: "Real Instituto Asturiano"
 nd_lon_real_instituto_desc: "Jovellanos opened the Royal Asturian Institute of Navigation and Mineralogy on 7 January 1794: mathematics, drawing, navigation, chemistry and the working of mines, for a province that has coal and a coast. Unlocks the Instituto Asturiano."
 nd_lon_municiones_de_trubia: "Munitions of Trubia"
 nd_lon_municiones_de_trubia_desc: "In 1794, with the foundries of Navarre overrun, the crown moved its shot casting to the meeting of the Trubia and the Nalón, and its gunsmiths from the Basque valleys to Oviedo. Unlocks the Real Fábrica de Trubia."
 nd_lon_junta_suprema: "Junta Suprema"
 nd_lon_junta_suprema_desc: "On 25 May 1808 the Junta General, sitting by its old rules in Oviedo, declared itself sovereign, declared war on Napoleon and sent two envoys to London. Unlocks the Alarma levy."
 nd_lon_lanceros_de_don_julian: "Lancers of Don Julián"
 nd_lon_lanceros_de_don_julian_desc: "Julián Sánchez, called El Charro, of Muñoz near Salamanca, had twelve lancers in 1808, two hundred a year later, and a brigade riding with Wellington by 1811. Unlocks the Lanceros Charros."
 nd_lon_ley_agraria: "Report on the Agrarian Law"
 nd_lon_ley_agraria_desc: "Jovellanos's report of 1795 argues that land should be free to be bought, sold and enclosed, and that the plough will then find it without any law telling it where to go."
 a_nd_lon_peones_montaneses: "Peones de la Montaña"
 a_nd_lon_peones_montaneses_desc: "Mountain foot with a spear, throwing darts and a hide shield. They close fast and unsettle a line with a volley from the slope, and they are cut down quickly when caught in the open without armour."
 levy_nd_lon_peones_montaneses: "Mountain Foot Levy"
 levy_nd_lon_peones_montaneses_desc: "Leonese peasants and laborers of the mountain concejos, called out by their own valley."
 a_nd_lon_freires_de_alcantara: "Freires de Alcántara"
 a_nd_lon_freires_de_alcantara_desc: "Knight brethren under the Cistercian rule and the green cross. They do not ransom themselves and do not leave the field before the master's banner does. There were never many of them."
 a_nd_lon_milicia_comunera: "Milicia Comunera"
 a_nd_lon_milicia_comunera_desc: "The companies of the Comunidades: guildsmen and day labourers under their town's captains, with pikes, a few handguns and a cause. They fight angrily and not for long."
 levy_nd_lon_milicia_comunera: "Comunero Militia Levy"
 levy_nd_lon_milicia_comunera_desc: "Burghers and laborers mustered by their town for the Santa Junta."
 n_nd_lon_galeoncete: "Galeoncete"
 n_nd_lon_galeoncete_desc: "A galleon cut down and drawn out, with a low forecastle, a long keel and sweeps for a calm. She carries silver faster than anything that can catch her and outguns anything that can keep up. She needs rowers as well as sailors and has no hold to spare for a long blockade."
 a_nd_lon_tercio_del_principado: "Tercio del Principado"
 a_nd_lon_tercio_del_principado_desc: "Mountain men in the king's coat, raised and paid by the Junta General for the Portuguese border. They are steady behind a wall or on a ridge, and armed with whatever the Principality could buy."
 a_nd_lon_alarma: "Alarma"
 a_nd_lon_alarma_desc: "The alarm companies of 1808: every parish at the bell, with fowling pieces and scythes set on poles. They know every path and shoot from behind every wall. They do not stand a charge."
 levy_nd_lon_alarma: "Alarma Levy"
 levy_nd_lon_alarma_desc: "Leonese peasants and laborers mustered parish by parish when the bell is rung."
 a_nd_lon_lanceros_charros: "Lanceros Charros"
 a_nd_lon_lanceros_charros_desc: "Herdsmen of the Salamanca oak pasture on their own horses, with the cattle goad turned into a lance. They take couriers, convoys and outposts and are gone before the dragoons saddle. Against formed cavalry their leather jackets stop nothing."
 nd_lon_panteon_real: "Panteón de los Reyes"
 nd_lon_panteon_real_desc: "The narthex of San Isidoro in León, where the kings of the old kingdom lie under a painted vault. It stands only in the city of León, and it adds to the prestige of a king who rules from there."
 nd_lon_panteon_real_maintenance: "Canons of San Isidoro"
 nd_lon_panteon_real_maintenance_desc: "Candles, hangings, books for the choir, glass and a little gold leaf, so that the kings are prayed for every day."
 nd_lon_burgo_de_francos: "Burgo de Francos"
 nd_lon_burgo_de_francos_desc: "A borough of settlers from beyond the Pyrenees beside a town on the pilgrim road, with its own charter and its own judge: money changers, innkeepers, cobblers and furriers. It can stand only in the lands the French Way crosses. The newcomers answer to the king and to nobody local, and the neighbours resent it."
 nd_lon_burgo_de_francos_maintenance: "Pilgrim Trade"
 nd_lon_burgo_de_francos_maintenance_desc: "Cloth, wine, salt and paper for the inns, the exchange tables and the notaries of the road."
 nd_lon_casa_de_concejo: "Casa de Concejo"
 nd_lon_casa_de_concejo_desc: "The room where the village meets when it rains: a bench round the wall, the chest with the ordinances, and the jug of wine that closes every sitting. The neighbours govern their own pasture, water and common labour. Where they rule, the king's officer does not."
 nd_lon_casa_de_concejo_maintenance: "Ordinances and Concejo Wine"
 nd_lon_casa_de_concejo_maintenance_desc: "Paper for the ordinances, timber and tools for the common works, and wine for the end of the sitting."
 nd_lon_brana: "Braña"
 nd_lon_brana_desc: "A summer station on the high grass: round stone huts thatched with broom and a walled fold. It can stand only on high ground whose own yield is livestock or wool, and the herd that summers there thrives."
 nd_lon_brana_alzada: "Summer Grazing"
 nd_lon_brana_alzada_desc: "The herd is driven up in May and down in October. The station is kept in timber for the huts and folds, in tools, and in salt for the licks."
 nd_lon_horreo: "Hórreo"
 nd_lon_horreo_desc: "A granary of chestnut planks raised on four stone legs, each capped with a slab no rat can pass. It holds less than a village granary and keeps it far better. It is built only where the climate is oceanic."
 nd_lon_horreo_maintenance: "Chestnut, Stone and Tools"
 nd_lon_horreo_maintenance_desc: "Planks replaced, slabs reset and the roof kept tight against the rain."
 nd_lon_fabrica_de_lienzos: "Fábrica de Lienzos"
 nd_lon_fabrica_de_lienzos_desc: "A weaving shed for linen: yarn bought in from the villages that spin it through the winter, looms under one roof and a bleaching field by the river."
 nd_lon_lienzo_casero: "Household Linen"
 nd_lon_lienzo_casero_desc: "Plain linen for sheets, shirts and sacking, bleached on the grass with lye from wood ash."
 nd_lon_manteleria: "Figured Table Linen"
 nd_lon_manteleria_desc: "Diaper and damask weaves for tablecloths and napkins, with dyed thread for the borders."
 nd_lon_instituto_asturiano: "Instituto Asturiano"
 nd_lon_instituto_asturiano_desc: "A school of navigation and mineralogy with a lecture hall, a cabinet of minerals, a drawing room and a library open to the town. Nothing is taught there in Latin. It can stand only in a port or where the local market mines coal."
 nd_lon_instituto_asturiano_maintenance: "Books and Instruments"
 nd_lon_instituto_asturiano_maintenance_desc: "Paper, printed books, glassware and instruments for the classes in drawing, navigation and chemistry."
 nd_lon_fabrica_de_trubia: "Real Fábrica de Trubia"
 nd_lon_fabrica_de_trubia_desc: "The crown's works where ore, timber and coal lie within a day's haul: blast furnaces casting shot and shell, and gunsmiths filing musket locks in the villages around. It can stand only where the local market produces both iron and coal."
 nd_lon_trubia_municiones: "Shot and Shell"
 nd_lon_trubia_municiones_desc: "Round shot, shells and gun barrels cast from local iron with local coal."
 nd_lon_oviedo_fusiles: "Muskets of Oviedo"
 nd_lon_oviedo_fusiles_desc: "Barrels, locks and stocks made by gunsmiths brought from Placencia and Éibar and assembled into muskets."

 # ===== DESTINY TREE =====
 nd_lon_dest_dos_principes_tt: "At least #bold 2#! countries are subjects of León"
 nd_lon_dest_tres_burgos_tt: "A #bold Burgo de Francos#! stands in at least #bold 3#! of our locations"
 nd_lon_dest_leon_26_tt: "We own #bold León#! and its development is at least #bold 26#!"
 nd_lon_dest_cinco_concejos_tt: "A #bold Casa de Concejo#! stands in at least #bold 5#! of our locations"
 nd_lon_dest_estudio_tt: "We own #bold Salamanca#!, it is a city, and it has a #bold University#!"
 nd_lon_dest_salamanca_33_tt: "We own #bold Salamanca#! and its development is at least #bold 33#!"
 nd_lon_dest_leon_42_tt: "We own #bold León#! and its development is at least #bold 42#!"

 nd_lon_destiny: "The Question of the Crown"
 nd_lon_destiny_desc: "A king of León has two inheritances and cannot spend both. One is the title his forebears took as heirs of Toledo, emperor over every Christian prince of the peninsula. The other is the oath sworn in San Isidoro in 1188, to rule with the bishops, the nobles and the chosen men of the towns. The kingdom must be steady before either is taken up.\n\n#bold Objective:#! hold stability at 75 or more."

 nd_lon_dest_extremadura_leonesa: "The Leonese Extremadura"
 nd_lon_dest_extremadura_leonesa_desc: "Alfonso IX spent the last years of his reign on the road south of Coria. Cáceres opened the way and in 1230 Mérida and Badajoz fell, which carried León to the Guadiana and gave the knights of Alcántara and Santiago a country to hold. An emperor needs a frontier of his own before he asks anyone to kneel.\n\n#bold Objective:#! hold Cáceres, Mérida and Badajoz, directly or through a subject, with prestige of 50 or more."

 nd_lon_dest_heredero_de_toledo: "Heir of Toledo"
 nd_lon_dest_heredero_de_toledo_desc: "The kings in Oviedo and León held that the Gothic kingdom had not ended, only moved north, and that its capital on the Tagus was theirs by right. Alfonso VI entered Toledo on 25 May 1085. Burgos is the other half of the claim: the county that became a kingdom at León's expense and then took León's crown for itself.\n\n#bold Objective:#! hold Toledo and Burgos, directly or through a subject, with 2,000 gold in the treasury and prestige of 50 or more."

 nd_lon_dest_imperator: "Imperator Totius Hispaniae"
 nd_lon_dest_imperator_desc: "On 26 May 1135 Alfonso VII was crowned emperor in the cathedral of León, and other princes of Hispania and beyond the Pyrenees acknowledged him as their lord. In the years after he led hosts deep into the south, to Córdoba and to Baeza. The title is worth what it was worth then: the princes who kneel and the cities taken.\n\n#bold Objective:#! hold Córdoba and Baeza, directly or through a subject, have at least two subject countries, 3,000 gold in the treasury and prestige of 75 or more."

 nd_lon_dest_buenos_fueros: "Good Fueros and Good Customs"
 nd_lon_dest_buenos_fueros_desc: "The king who swore the Decreta promised to keep the good customs his forebears had granted, and those customs lived in the chartered towns: the royal city and the boroughs of settlers along the pilgrim road. A kingdom that means to be ruled by consent needs towns able to give it.\n\n#bold Objective:#! have a Burgo de Francos in three locations, own León and raise its development to 26 (from 21 in 1337), and keep 1,000 gold in the treasury."

 nd_lon_dest_hermandad_de_concejos: "Brotherhood of the Councils"
 nd_lon_dest_hermandad_de_concejos_desc: "When the crown was weak the councils of the kingdom swore brotherhoods to defend their charters against all comers, the king's officers included, and they sent to Salamanca for men who knew the law. Alfonso IX had founded the Estudio there in 1218. The village meeting and the lecture hall are the two schools of the kingdom of the Decreta.\n\n#bold Objective:#! have a Casa de Concejo in five locations, own Salamanca as a city with a University and development of 33 (from 22 in 1337), and keep 2,000 gold in the treasury."

 nd_lon_dest_ferias_del_reino: "Fairs of the Kingdom"
 nd_lon_dest_ferias_del_reino_desc: "Where property is safe and judgment is by law, merchants come. In the sixteenth century the fairs of Medina del Campo, Villalón and Medina de Rioseco drew Flemings, Genoese, Florentines and Portuguese to the edge of the Tierra de Campos to deal in wool, cloth and books. A León that holds those towns settles the accounts of the peninsula.\n\n#bold Objective:#! hold Medina de Rioseco and Medina del Campo, directly or through a subject, embrace the Printing Press, have fine cloth in the capital's market, own León with development of 42, 3,000 gold in the treasury and prestige of 75 or more."

 nd_lon.6.t: "The Question of the Crown"
 nd_lon.6.d: "The kingdom is quiet and the court has leisure to argue. The old men of the chapter of San Isidoro can recite both inheritances: the emperors' title, read from the charters, and the oath of 1188, read from the Decreta. The king has already said which he means to follow. What remains is to do it."
 nd_lon.6.a: "We know which road is ours."
 nd_lon.6.a_tt: "The destiny path chosen at the formation of León is open."

 nd_lon.7.t: "The Leonese Extremadura"
 nd_lon.7.d: "The banner of León flies at Cáceres, at Mérida on its Roman bridge and at Badajoz above the Guadiana. Alfonso IX took this country in the last year of his life and did not live to settle it. The knights of the orders have their commanderies, the councils their boundaries, and the road by which the flocks come south in autumn is the king's from end to end."
 nd_lon.7.a: "León reaches the Guadiana again."
 nd_lon.7.a_tt: "The emperors' road goes on to Toledo and Burgos."

 nd_lon.8.t: "Heir of Toledo"
 nd_lon.8.d: "The king has ridden into the city of the Gothic councils, and Burgos has opened its gates behind him. Toledo holds Mozarabs who kept the old rite through four centuries, Castilians, Franks, Jews and Muslims, each with a law of their own. Alfonso VI promised the Muslims their great mosque and was called emperor of the two religions; in his absence the new archbishop, Bernard of Sédirac, took the mosque for a cathedral, and the Roman rite replaced the Toledan one. The court must say which Toledo it has inherited."
 nd_lon.8.a: "To each people its own law, under one emperor."
 nd_lon.8.a_tt: "More tolerance of heretics and faster construction. Conversion is slower."
 nd_lon.8.b: "One rite, and learned clerks from beyond the mountains."
 nd_lon.8.b_tt: "Cheaper advisors, stronger cultural tradition and a more spiritual realm."

 nd_lon.9.t: "Emperor of All Hispania"
 nd_lon.9.d: "The crown has been set on the king's head in the cathedral of León as it was on Alfonso VII's in 1135, with princes standing by who have sworn themselves his men. Córdoba and Baeza answer to him. The chancery has begun to date its charters by the year of the empire. What an emperor does next is the question that undid the first one, whose title was not used again after his death in 1157."
 nd_lon.9.a: "An emperor is known by the princes at his court."
 nd_lon.9.a_tt: "Larger noble levies and less war exhaustion. The court costs more."
 nd_lon.9.b: "An emperor is known by the road he takes south."
 nd_lon.9.b_tt: "Better supply, cheaper demands on other faiths and faster morale recovery."

 nd_lon.10.t: "Good Fueros and Good Customs"
 nd_lon.10.d: "The Frankish boroughs along the road are full, their judges sit, and the royal city has outgrown the Roman wall it was born inside. Proctors from the towns arrive at court knowing what their charters say and expecting the king to know it too. He does. It is what he swore."
 nd_lon.10.a: "The towns have their voice."
 nd_lon.10.a_tt: "The road of the Decreta goes on to the councils and Salamanca."

 nd_lon.11.t: "Brotherhood of the Councils"
 nd_lon.11.d: "In village after village the bell calls the neighbours to the council house, and in Salamanca the schools are crowded. The councils have sworn to stand together, as they did in the bad years when no king could protect them. A brotherhood of towns is a power in the realm. It can be an armed one, keeping roads and walls, or a lettered one, with a graduate of the Estudio in every council to draft its pleas."
 nd_lon.11.a: "Let them swear to keep the roads and each other's walls."
 nd_lon.11.a_tt: "Fewer rebels, cheaper paved roads and stronger defences."
 nd_lon.11.b: "Let each council keep a man of the Estudio."
 nd_lon.11.b_tt: "Higher literacy, more paper and a more innovative realm."

 nd_lon.12.t: "Fairs of the Kingdom"
 nd_lon.12.d: "In May and in October the plain around the two Medinas fills with mules. Wool is sold a year ahead, bales of cloth from Flanders are opened under the arcades, booksellers set out their stock, and in the last days the merchants sit down to cancel one another's debts until little coin needs to change hands. The crown granted the fairs their peace. It may leave them to the merchants, or put its own collectors at the gates."
 nd_lon.12.a: "Leave the merchants to their paper."
 nd_lon.12.a_tt: "Better export prices and stronger markets. Forts cost more to keep."
 nd_lon.12.b: "The king's collectors will sit at the gates."
 nd_lon.12.b_tt: "Higher tariffs and weaker burgher power. Less merchant capacity."

 STATIC_MODIFIER_NAME_nd_lon_dest_dos_religiones: "Emperor of the Two Religions"
 STATIC_MODIFIER_DESC_nd_lon_dest_dos_religiones: "Each people of Toledo keeps its own law and its own judges. People come and build, and nobody is pressed to change faith."
 STATIC_MODIFIER_NAME_nd_lon_dest_rito_romano: "The Roman Rite"
 STATIC_MODIFIER_DESC_nd_lon_dest_rito_romano: "One liturgy for the whole realm, and learned clerks from beyond the Pyrenees to say it and to staff the chancery."
 STATIC_MODIFIER_NAME_nd_lon_dest_homenaje_de_principes: "Homage of the Princes"
 STATIC_MODIFIER_DESC_nd_lon_dest_homenaje_de_principes: "The princes who knelt bring their knights when called. A court fit to receive them is dear to keep."
 STATIC_MODIFIER_NAME_nd_lon_dest_camino_del_sur: "The Road South"
 STATIC_MODIFIER_DESC_nd_lon_dest_camino_del_sur: "The emperor rides at the head of the host, and the kingdom's stores follow him."
 STATIC_MODIFIER_NAME_nd_lon_dest_hermandad_jurada: "Sworn Brotherhood"
 STATIC_MODIFIER_DESC_nd_lon_dest_hermandad_jurada: "The councils have sworn to keep the roads and to come to one another's walls."
 STATIC_MODIFIER_NAME_nd_lon_dest_letrados_del_estudio: "Letrados of the Estudio"
 STATIC_MODIFIER_DESC_nd_lon_dest_letrados_del_estudio: "Every council keeps a graduate of Salamanca to plead its suits and keep its books."
 STATIC_MODIFIER_NAME_nd_lon_dest_letras_de_cambio: "Bills of Exchange"
 STATIC_MODIFIER_DESC_nd_lon_dest_letras_de_cambio: "The fairs are left to the merchants and their paper. Coin that goes to the counting houses does not mend walls."
 STATIC_MODIFIER_NAME_nd_lon_dest_alcabala_real: "The King's Alcabala"
 STATIC_MODIFIER_DESC_nd_lon_dest_alcabala_real: "The crown's collectors sit at the gates of the fairs. The great men of the towns lose their grip on the trade, and some traders go elsewhere."

 nd_lon_dest_feria_general: "Feria General"
 nd_lon_dest_feria_general_desc: "A chartered fair held twice a year under the king's peace, where wool is sold ahead, cloth and books are bought and merchants settle their accounts. It can stand only in Medina del Campo, Medina de Rioseco, Benavente and León."
 nd_lon_dest_feria_general_maintenance: "Fair Stalls and Ledgers"
 nd_lon_dest_feria_general_maintenance_desc: "Cloth for the stalls, paper for the ledgers, salt and tools for the weeks of the fair."

 # ===== BUREAUCRACIES =====
 lon_notaria_mayor_bureaucracy: "Notaría Mayor de León"
 lon_notaria_mayor_bureaucracy_desc: "When Alfonso X ordered his chancery in 1252 he gave each of his kingdoms a chief notary of its own, and León kept one beside Castile's though the two crowns had been joined since 1230. Charters for the kingdom are drawn, checked and registered in his office. Under John II in 1431 a chief notary was paid 98,400 maravedís a year, as much as the chancellor."
 lon_moneda_forera_bureaucracy: "Moneda Forera"
 lon_moneda_forera_bureaucracy_desc: "At Benavente in 1202 the kingdom bought its coinage from Alfonso IX: one maravedí a year from every free householder for seven years, and in return the king would not mint the coin lighter. Canons and knights were exempt. The payment hardened into a tax taken every seventh year, and for it each council draws up a roll of its householders, house by house, entering every one as a payer or as an hidalgo."
 lon_audiencia_escolastica_bureaucracy: "Audiencia Escolástica"
 lon_audiencia_escolastica_bureaucracy_desc: "The scholastic of the cathedral of Salamanca, on record since 1174, is chancellor of the Estudio that Alfonso IX founded in 1218 and the judge of all who belong to it. Students, masters and their servants answer in his court and not before the city's justice. The university keeps its own rules and its own punishments, apart from town and chapter alike."
 lon_torres_de_leon_bureaucracy: "Tenencia de las Torres de León"
 lon_torres_de_leon_bureaucracy_desc: "The towers of León, the keep of the royal city, are held for the king by a warden he names and may recall. Gutier Suárez de Meneses held the city and its towers from 1261, and Pedro Núñez de Guzmán held the towers in 1337 together with the governorship of the kingdom. The warden keeps the garrison and the walls in repair, and gives up the keys when the king asks for them."

 # The auto modifier that grants the country's slots on formation
 AUTO_MODIFIER_NAME_nd_lon_bureaucracy_authority: "Offices of the Kingdom of León"
 AUTO_MODIFIER_DESC_nd_lon_bureaucracy_authority: "The court of León has room for two institutions of its own: the Notaría Mayor de León, the Moneda Forera, the Audiencia Escolástica or the Tenencia de las Torres de León."
