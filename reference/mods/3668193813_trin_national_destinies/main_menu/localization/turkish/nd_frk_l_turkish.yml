l_turkish:

# === Static Modifiers: formation choices ===
 STATIC_MODIFIER_NAME_nd_frk_one_law_over_all: "One Law Over All"
 STATIC_MODIFIER_DESC_nd_frk_one_law_over_all: "The capitularies bind every subject of the realm whatever his people, and the envoys of the crown carry them into every county. The realm is knitting together faster than any conquest has ever been absorbed, and the Frisian, the Rhinelander and the Lombard all notice that the law being carried in is not theirs."
 STATIC_MODIFIER_NAME_nd_frk_law_of_the_peoples: "The Law of the Peoples"
 STATIC_MODIFIER_DESC_nd_frk_law_of_the_peoples: "As at Aachen in 802, each people of the realm is judged by its own law: the Frisian by the Frisian custom, the Lombard by the edict of Rothari, the Rhinelander by the Ripuarian law. The peoples have never been so content to belong to the realm, and the crown has never had so little say in their courts."

# === Static Modifiers: advance events ===
 STATIC_MODIFIER_NAME_nd_frk_relics_shown: "The Relics Shown"
 STATIC_MODIFIER_DESC_nd_frk_relics_shown: "Every seventh summer the gallery of the palatine church opens and the relics are held up over a square packed with pilgrims from Hungary to Brabant. The inns fill, the roads fill, and the city lives on it for years."
 STATIC_MODIFIER_NAME_nd_frk_coronation_church: "The Church of the Realm"
 STATIC_MODIFIER_DESC_nd_frk_coronation_church: "The shrine is kept for the realm's own ceremonies: the oath before the shrine, the stone seat, the solemn assemblies. Foreign envoys who witness one do not forget where they stood."
 STATIC_MODIFIER_NAME_nd_frk_karl_of_the_rhine: "Karl of the Rhine"
 STATIC_MODIFIER_DESC_nd_frk_karl_of_the_rhine: "Wimpfeling's side has the court's ear. Strasbourg, Mainz and Cologne, their presses and their schools, set the tone of the realm, and the Rhine towns take the favour as their due."
 STATIC_MODIFIER_NAME_nd_frk_charles_of_the_franks: "Charles of the Franks"
 STATIC_MODIFIER_DESC_nd_frk_charles_of_the_franks: "Murner's side has the court's ear. The realm speaks to the world in the language of its western court, and the old nobility of the west is pleased to hear it."
 STATIC_MODIFIER_NAME_nd_frk_learned_law: "The Learned Law"
 STATIC_MODIFIER_DESC_nd_frk_learned_law: "Doctors of law replace the lay assessors, and one procedure runs from Holland to Lombardy. The crown's writ has never gone further, and the villages have lost the courts that remembered their custom."
 STATIC_MODIFIER_NAME_nd_frk_custom_of_the_land: "The Custom of the Land"
 STATIC_MODIFIER_DESC_nd_frk_custom_of_the_land: "Every land keeps its customs and its assessors, confirmed by the realm's highest court. Nobody is aggrieved, and every statute the realm wishes to pass must first be squared with forty customs."
 STATIC_MODIFIER_NAME_nd_frk_free_rhine: "The Free Rhine"
 STATIC_MODIFIER_DESC_nd_frk_free_rhine: "The toll chains come down from Basel to the sea. Barges run from Strasbourg to the delta without stopping, and the treasury learns what the tolls used to pay for."
 STATIC_MODIFIER_NAME_nd_frk_rhine_octroi: "The Rhine Octroi"
 STATIC_MODIFIER_DESC_nd_frk_rhine_octroi: "One duty, one tariff, one office at each end of the river, and its revenue spent on the towpaths, the dredging and the harbours. The barges still stop, but only twice."

# === Event variable tooltips ===
 nd_frk_formed_tt: "Francia is proclaimed."
 nd_frk_path_a_tt: "Founding principle: one law over all."
 nd_frk_path_b_tt: "Founding principle: the law of the peoples."
 nd_frk_e1_done_tt: "Francia has been proclaimed and its founding principle chosen."

# === Formation Event ===
 nd_frk.1.t: "Francia Restored"
 nd_frk.1.d: "The Treaty of Verdun cut Charlemagne's realm into three kingdoms in 843. The western kingdom became France. The middle kingdom broke apart into Lotharingia, Burgundy and Italy. The eastern kingdom became the Empire that claimed his crown for eight centuries, and that Empire is gone. One ruler now holds Paris, where Clovis made his capital, Aachen, where Charlemagne kept his court and lies buried, and Frankfurt, the ford of the Franks, where the kings of the Germans were chosen.\n\nThe realm is whole again, and it speaks five languages: French and Walloon in the west, the German of the Rhine and Hesse, the Dutch of Brabant and Holland, Frisian on the northern coast and Lombard beyond the Alps. Charlemagne governed such a realm in two ways at once. His capitularies bound every subject alike and his envoys carried them into every county; and at Aachen in 802 he had the laws of the Frisians, the Saxons and the Thuringians written down so that each people would be judged by its own custom. The new realm must decide which of the two it will be first.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_frk.1.d_republic: "The Treaty of Verdun cut Charlemagne's realm into three kingdoms in 843. The western kingdom became France. The middle kingdom broke apart into Lotharingia, Burgundy and Italy. The eastern kingdom became the Empire that claimed his crown for eight centuries, and that Empire is gone. One commonwealth now holds Paris, Aachen, where Charlemagne kept his court and lies buried, and Frankfurt, the ford of the Franks.\n\nNo one has been crowned. Francia is proclaimed by an assembly, as the free Franks once met in the Marchfield and the Mayfield to hear the law and give their consent, and the assembly governs a realm that speaks five languages: French and Walloon, the German of the Rhine and Hesse, the Dutch of Brabant and Holland, Frisian and Lombard. The first question on its roll is the oldest one in the Frankish world. Charlemagne's capitularies bound every subject alike; at Aachen in 802 he also had the laws of the Frisians, the Saxons and the Thuringians written down so that each people would be judged by its own custom. The assembly must decide which of the two the commonwealth will be first.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_frk.1.a: "One law over every people of the realm"
 nd_frk.1.b: "Each people judged by its own law, as at Aachen in 802"

# === DHE: The Shrine at Aachen ===
 nd_frk.2.t: "The Shrine at Aachen"
 nd_frk.2.d: "Charlemagne was buried in his palatine church at Aachen in 814. He was canonized at Frederick Barbarossa's request in 1165, his bones were laid in a golden shrine in 1215, and around 1349 Charles IV gave the church a silver bust of the emperor to hold his skull. From that same year the four great relics of Aachen were shown to the faithful every seventh summer, and the pilgrims came in such numbers that the city could not house them.\n\nThe same church saw the German kings enthroned on Charlemagne's stone seat from 936 to 1531. A shrine can belong to the crowd or to the realm's own ceremonies, and the keepers ask which."
 nd_frk.2.a: "Show the relics to all Christendom"
 nd_frk.2.b: "Keep the shrine for the realm's own great ceremonies"

# === DHE: Karl or Charles ===
 nd_frk.3.t: "Karl or Charles"
 nd_frk.3.d: "In 1501 the Alsatian humanist Jakob Wimpfeling published a short book called Germania. Germans, he argued, had held the left bank of the Rhine since time out of mind, no French king had ever ruled Strasbourg, and Charlemagne himself had been a German. In 1502 the Franciscan Thomas Murner answered him from the same city in a Nova Germania: Charlemagne had been a Frenchman, and so had the left bank.\n\nIn any other realm the quarrel belonged to the scholars. In this one both men are subjects, both are right about half the realm, and the answer the court favours will tell every town from Metz to Mainz which half it thinks is the heart."
 nd_frk.3.a: "He was a Frank of the Rhine"
 nd_frk.3.b: "He was the first king of the western Franks"

# === DHE: Which Law the Court Keeps ===
 nd_frk.4.t: "Which Law the Court Keeps"
 nd_frk.4.d: "The Chamber Court's ordinance of 1495 required half its judges to be doctors of law, and told them to judge by the common law of the universities wherever a local custom could not be proved. Over the next century that one clause changed the Rhineland more than any war. The lay assessors of the village courts, who had found the law by remembering it, gave way to jurists who found it in Justinian.\n\nThe court now sits under Frankish authority, and its presiding judge asks which rule it is to follow: the learned law, one procedure for every land, or the customs of each land as its own assessors keep them."
 nd_frk.4.a: "Judge by the learned law, one procedure for every land"
 nd_frk.4.b: "Confirm the customs of each land and its assessors"

# === DHE: The Tolls of the Rhine ===
 nd_frk.5.t: "The Tolls of the Rhine"
 nd_frk.5.d: "Between Basel and the sea some thirty toll stations once stood on the Rhine, each the property of a prince, a bishop or a city, each stopping every barge to weigh and tax its cargo. The octroi convention of 1804 replaced them with one uniform duty. The Congress of Vienna declared the river free in 1815 and set a commission at Mainz to make it so, and the Mainz Convention of 1831 finally did.\n\nEach of those treaties had to be bargained out among the river's many owners. Francia holds most of the river between the Alsatian hills and Holland, and can settle the question by its own decree."
 nd_frk.5.a: "Abolish the tolls: the river is free to every flag"
 nd_frk.5.b: "Keep one uniform octroi to pay for the river works"

# === Advances: Age 1 ===
 nd_frk_missi_dominici: "Missi Dominici"
 nd_frk_missi_dominici_desc: "From 802 the realm was divided into circuits, and every year a bishop and a count rode each one together, sent from outside it so that neither owed anything to the counts they judged. They carried the capitularies in writing, heard every complaint and could overturn any judgment. Francia sends its envoys out again."
 nd_frk_capitulare_de_villis: "Capitulare de Villis"
 nd_frk_capitulare_de_villis_desc: "The ordinance on the royal estates told every steward what to plant, from lilies and roses to seventy named herbs, how to brew and press and weave, how to keep the carts, and how to account for all of it at Christmas. It is the most detailed estate manual to survive from early medieval Europe, and Francia's estates are run by it again."
 nd_frk_admonitio_generalis: "Admonitio Generalis"
 nd_frk_admonitio_generalis_desc: "In 789 Charlemagne ordered that every monastery and every bishop's house keep a school to teach boys the psalms, notation, chant, reckoning and grammar, and that the books they learned from be corrected. The cathedral schools of the realm trace themselves to that one sentence."
 nd_frk_novi_denarii: "The New Pennies"
 nd_frk_novi_denarii_desc: "In 793 and 794 the mints began striking a heavier silver penny bearing Charlemagne's monogram, 240 of them to the pound and twelve to the shilling. The pound, shilling and penny outlived the Carolingians by nearly a thousand years. Francia's mints strike to the old standard and hold it."
 nd_frk_sanctus_karolus: "Sanctus Karolus"
 nd_frk_sanctus_karolus_desc: "Charlemagne was canonized in 1165, laid in a golden shrine in 1215 and given a silver bust reliquary by Charles IV in the middle of the fourteenth century. His cult at Aachen outlived the dynasty that began it, and Francia is its natural keeper. The shrine pays its full honour only to a realm governed from Aachen."

# === Advances: Age 2 ===
 nd_frk_littera_antiqua: "Littera Antiqua"
 nd_frk_littera_antiqua_desc: "When Poggio and his friends went hunting for lost Latin authors, the manuscripts they found were Carolingian copies, and the clear round hand they took for ancient Roman writing was Carolingian minuscule. They imitated it, the printers cut type from it, and the realm's own script became the roman letter of Europe."
 nd_frk_marches_of_the_realm: "The Marches of the Realm"
 nd_frk_marches_of_the_realm_desc: "Charlemagne did not annex every frontier people. He set marches against the Moors, the Bretons, the Avars and the Danes, each under a margrave who defended the border with his own men and answered to the emperor. The fall of the Empire has left a fringe of small princes around Francia, and the march is the old answer to them."
 nd_frk_leges_nationum: "The Laws of the Peoples"
 nd_frk_leges_nationum_desc: "At the great assembly of Aachen in 802 the laws of the Frisians, the Saxons, the Thuringians and the Chamavian Franks were written down, so that each people of the realm could be judged by its own custom. A realm of many peoples holds them best by letting each keep its law."
 nd_frk_crane_rights: "Crane Rights"
 nd_frk_crane_rights_desc: "The treadwheel cranes on the Rhine quays, at Trier from 1413, Bingen from 1487 and Andernach from 1554, turned every river town into a port. The right to work one was a privilege granted to the town, and the town guarded it jealously."
 nd_frk_hopped_beer: "Hopped Beer"
 nd_frk_hopped_beer_desc: "The brewers of Holland and Brabant gave up gruit for hops in the fourteenth and fifteenth centuries, and hopped beer kept well enough to ship. Gouda alone had well over a hundred breweries by 1500. The brewhouses of the royal villas learn the new way."

# === Advances: Age 3 ===
 nd_frk_germania_debate: "The Germania Quarrel"
 nd_frk_germania_debate_desc: "In Strasbourg in 1501 and 1502 two subjects of the same bishop quarrelled in print over whether Charlemagne had been a German or a Frenchman. The quarrel never ended, because each of them was half right. In Francia both halves are one realm."
 nd_frk_court_ordinance: "The Chamber Court Ordinance"
 nd_frk_court_ordinance_desc: "The Chamber Court was founded at Worms in 1495 and sat at Frankfurt, then Speyer, then from 1689 at Wetzlar. It was the highest court of the Empire, and it sat in the lands Francia now holds. When the Empire ended, its judges and its archive of cases were still there."
 nd_frk_imperial_circles: "The Imperial Circles"
 nd_frk_imperial_circles_desc: "From 1500 the Empire was divided into circles, each with a diet that apportioned taxes, raised troops and kept the peace of its region. The Upper Rhenish, Electoral Rhenish, Lower Rhenish and Burgundian circles all lay in lands that are now Francia's, and their diets still know how to govern them."
 nd_frk_vita_karoli: "Vita Karoli"
 nd_frk_vita_karoli_desc: "Einhard's life of Charlemagne, written by a man who had known him, was first printed at Cologne in 1521, and Dürer painted the emperor in his coronation robes for Nuremberg in 1512. Every schoolboy in the realm now knows what its founder looked like and how he lived."
 nd_frk_second_charlemagne: "The Second Charlemagne"
 nd_frk_second_charlemagne_desc: "A prophecy of the later middle ages promised a Charles, son of Charles, who would reform the Church and unite Christendom. It was read onto one king after another, and onto Charles VIII's march into Italy in 1494. Francia's soldiers believe they serve the realm it foretold."

# === Advances: Age 4 ===
 nd_frk_paladins: "The Paladins"
 nd_frk_paladins_desc: "The paladins of the chansons de geste were the counts of the palace, Roland and Oliver and the rest of the twelve peers who died at Roncevaux. Francia raises a household cavalry in their name from the sons of its greatest families."
 nd_frk_basternae: "Basternae"
 nd_frk_basternae_desc: "Chapter 64 of the Capitulare de villis orders that the carts that go to war be covered in leather sewn so tight that, if a river must be crossed, they can swim it without a drop of water reaching the flour. The quartermasters of the realm have read their capitulary."
 nd_frk_fair_catalogue: "The Fair Catalogue"
 nd_frk_fair_catalogue_desc: "From 1564 the Augsburg bookseller Georg Willer printed a catalogue of every new book offered at the Frankfurt fair, spring and autumn, and the fair became the market of the European book trade."
 nd_frk_francogallia: "Francogallia"
 nd_frk_francogallia_desc: "In 1573 François Hotman argued that the Franks had been free men who chose their rulers and consented to their laws in the Marchfield and the Mayfield, and that the realm's true constitution was the one they brought across the Rhine. Francia takes the argument at its word."
 nd_frk_rex_langobardorum: "Rex Langobardorum"
 nd_frk_rex_langobardorum_desc: "In 774 Charlemagne took Pavia and the crown of the Lombards and styled himself king of the Franks and of the Lombards. He did not abolish the kingdom he had conquered. He gave it a king of its own, his son, and left it its own law."

# === Advances: Age 5 ===
 nd_frk_heerbann: "The Heerbann"
 nd_frk_heerbann_desc: "The capitulary of 808 required every free man holding four mansi of land to arm himself and march, and poorer men to club together and equip one of their number; a man with twelve mansi had to bring a mail coat. Francia calls out the ban again."
 nd_frk_waters_of_aachen: "The Waters of Aachen"
 nd_frk_waters_of_aachen_desc: "Einhard says that Charlemagne loved the hot springs of Aachen so much that he built his palace beside them and swam there with a hundred of his court. By the eighteenth century the same springs had made Aachen one of the great spas of Europe."
 nd_frk_rhenish_cellars: "The Rhenish Cellars"
 nd_frk_rhenish_cellars_desc: "The monks of Eberbach set their best casks apart in a Cabinet cellar in 1730, and at Johannisberg in 1775 a late messenger let the grapes hang until they shrivelled, and the wine was the best anyone had tasted. What the vintage cannot sell, the villa cellars distil."
 nd_frk_diplomatics: "Diplomatics"
 nd_frk_diplomatics_desc: "In 1681 Jean Mabillon published De re diplomatica, which taught for the first time how to prove a charter genuine, working from the Merovingian and Carolingian originals in the abbey archives. At Antwerp the Bollandists edited the lives of the saints with the same rigour. The realm's archives become the best kept in Europe."
 nd_frk_normal_year: "The Normal Year"
 nd_frk_normal_year_desc: "The Peace of Westphalia settled every territory's church as it had stood on the first of January 1624. Francia inherits a patchwork of Catholic, Lutheran and Reformed lands and a date that tells it which is which."

# === Advances: Age 6 ===
 nd_frk_free_navigation: "Free Navigation"
 nd_frk_free_navigation_desc: "In 1815 the Congress of Vienna declared the Rhine free to every flag and set up a commission at Mainz to make it so, the first standing international body in Europe. Francia holds most of the river and gives the commission its house."
 nd_frk_rhine_rectification: "The Rectification of the Rhine"
 nd_frk_rhine_rectification_desc: "From 1817 Johann Gottfried Tulla cut the braided Upper Rhine into a single channel, drained its floodplain into farmland and ended the marsh fever that had haunted the river villages for as long as anyone remembered."
 nd_frk_monumenta: "Monumenta"
 nd_frk_monumenta_desc: "In 1819 a society founded at Frankfurt set out to edit every source of the medieval realm, beginning with the capitularies. Francia's scholars edit the laws of their own founder."
 nd_frk_cathedral_completion: "The Cathedral Completed"
 nd_frk_cathedral_completion_desc: "Work on Cologne cathedral stopped in 1473 with the builders' crane left standing on the south tower, where it stayed for centuries. From 1814 Sulpiz Boisserée's drawings and the rediscovered medieval plans revived the dream of finishing it."
 nd_frk_two_tongues: "Two Tongues"
 nd_frk_two_tongues_desc: "At Strasbourg in 842 Louis the German swore his oath in the Romance tongue so that his brother's army would understand him, and Charles the Bald swore in German for the same reason. The oaths are the oldest surviving text in French. Francia governs in both languages, and in Dutch and Lombard besides."

# === Buildings ===
 nd_frk_missaticum: "Seat of the Missi"
 nd_frk_missaticum_desc: "The house where the crown's envoys hold court for their circuit: a hall for the pleas, a chest for the capitularies, and stabling for the horses that will carry both envoys to the next county."
 nd_frk_fiscal_villa: "Royal Villa"
 nd_frk_fiscal_villa_desc: "A fiscal estate run by a steward on the rules of the Capitulare de villis, with its weaving house, its brewhouse and its cellar."
 nd_frk_cathedral_school: "Cathedral School"
 nd_frk_cathedral_school_desc: "A school in the precinct of a cathedral or a monastery, teaching the psalms, chant, reckoning and grammar as the Admonitio generalis commanded."
 nd_frk_shrine_of_charlemagne: "Shrine of Charlemagne"
 nd_frk_shrine_of_charlemagne_desc: "The golden shrine and the silver bust in the palatine church at Aachen. Its full honour is paid only while the realm is governed from Aachen itself."
 nd_frk_palace_school: "Palace School"
 nd_frk_palace_school_desc: "The school of the court, where the ruler's children learn beside the sons of the great families and the future abbots of the realm, as they did under Alcuin."
 nd_frk_river_crane: "River Crane"
 nd_frk_river_crane_desc: "A treadwheel crane on the quay, worked by men walking inside its wheel, lifting casks and bales between barge and wharf."
 nd_frk_chamber_court: "Chamber Court"
 nd_frk_chamber_court_desc: "The highest court of the old Empire at Wetzlar, its judges and its archive of cases now under Frankish authority."
 nd_frk_circle_diet: "Circle Diet"
 nd_frk_circle_diet_desc: "The hall where the estates of a circle meet to apportion taxes and troops and keep the peace of their region: a second centre of government far from the capital."
 nd_frk_frankfurt_fair: "The Frankfurt Fair"
 nd_frk_frankfurt_fair_desc: "The spring and autumn fairs on the Main, with their exchange, their warehouses, and the book fair with its printed catalogue."
 nd_frk_kaiserbad: "The Imperial Baths"
 nd_frk_kaiserbad_desc: "The bathhouses over Charlemagne's hot springs at Aachen, rebuilt for the gentry who come from every court in Europe to take the waters."
 nd_frk_rhine_commission: "Rhine Commission"
 nd_frk_rhine_commission_desc: "The commission for the navigation of the Rhine in its house at Mainz, keeping the river's rules and settling its disputes."
 nd_frk_cathedral_works: "Cathedral Works of Cologne"
 nd_frk_cathedral_works_desc: "The masons' lodge of Cologne cathedral, working again from the medieval plans to finish what was begun in 1248."

# === Production Methods ===
 nd_frk_missaticum_maintenance: "Envoys' Circuit"
 nd_frk_missaticum_maintenance_desc: "Parchment for the capitularies, horses for the road and wine for the hospitality of the counties."
 nd_frk_villa_genitium: "Genitium"
 nd_frk_villa_genitium_desc: "The women's weaving house of the estate, turning the demesne's wool into cloth."
 nd_frk_villa_brewhouse: "Estate Brewhouse"
 nd_frk_villa_brewhouse_desc: "Brewing the estate's grain into hopped beer that keeps well enough to sell."
 nd_frk_villa_cellar: "Estate Cellar"
 nd_frk_villa_cellar_desc: "Distilling the wine the vintage cannot sell into brandy."
 nd_frk_cathedral_school_maintenance: "Schoolroom"
 nd_frk_cathedral_school_maintenance_desc: "Parchment, books and candles for the masters and their pupils."
 nd_frk_shrine_maintenance: "Keeping of the Shrine"
 nd_frk_shrine_maintenance_desc: "Candles, incense, gold leaf and vestments for the shrine and its clergy."
 nd_frk_palace_school_maintenance: "Palace Library"
 nd_frk_palace_school_maintenance_desc: "Books, parchment and candles for the court's scholars."
 nd_frk_river_crane_maintenance: "Crane Upkeep"
 nd_frk_river_crane_maintenance_desc: "Timber for the wheel, tools for the carpenters and rope for the jib."
 nd_frk_chamber_court_maintenance: "Court Chancery"
 nd_frk_chamber_court_maintenance_desc: "Paper and books for the pleadings and furniture for the judges' benches."
 nd_frk_circle_diet_maintenance: "Diet Sessions"
 nd_frk_circle_diet_maintenance_desc: "Paper for the rolls, wine for the delegates and benches for the estates."
 nd_frk_frankfurt_fair_maintenance: "Fair Season"
 nd_frk_frankfurt_fair_maintenance_desc: "Cloth, paper and wine for the booths, the catalogues and the merchants' tables."
 nd_frk_kaiserbad_maintenance: "Bathhouse Upkeep"
 nd_frk_kaiserbad_maintenance_desc: "Masonry for the basins, linen for the guests and wine for their tables."
 nd_frk_rhine_commission_maintenance: "Commission Offices"
 nd_frk_rhine_commission_maintenance_desc: "Paper for the registers, rope and pitch for the inspection boats and tools for the river works."
 nd_frk_cathedral_works_maintenance: "Masons' Lodge"
 nd_frk_cathedral_works_maintenance_desc: "Stone, dressed masonry, tools and glass for the lodge that is finishing the cathedral."

# === Units ===
 a_nd_frk_paladins: "Paladins"
 a_nd_frk_paladins_desc: "The household cavalry of the restored palace, raised from the realm's greatest families in the name of Charlemagne's twelve peers. Terrifying in the charge and ruinous to keep in the field."
 a_nd_frk_basternae: "Basternae"
 a_nd_frk_basternae_desc: "Supply carts covered in sewn leather so that they can be floated across a river with their load still dry. They cross water that stops every other train, and they are useless in a fight."
 a_nd_frk_heerbann: "Heerbann"
 a_nd_frk_heerbann_desc: "The ban of the free landholders, each man equipped at his own cost by the old rule of the four mansi. Well armoured and steady in the line, and slow on the march."

# === Levies ===
 levy_nd_frk_heerbann: "The Ban"
 levy_nd_frk_heerbann_desc: "The free landholders of countryside and town, called out under the capitulary of 808."

# === Destiny Tree: objective tooltips ===
 nd_frk_dest_centralized_tt: "The realm's societal values lean at least 25 toward #bold Centralization#!"
 nd_frk_dest_subject_kingdom_tt: "At least one subject holds the rank of #bold Kingdom#!"
 nd_frk_dest_westphalia_share_tt: "Directly own at least half of the locations in #bold Westphalia#!"
 nd_frk_dest_bavaria_share_tt: "Directly own at least 60% of the locations in #bold Bavaria#!"
 nd_frk_dest_lower_saxony_share_tt: "Directly own at least half of the locations in #bold Lower Saxony#!"
 nd_frk_dest_upper_saxony_share_tt: "Directly own at least half of the locations in #bold Upper Saxony#!"

# === Destiny Tree: advances ===
 nd_frk_destiny: "Renovatio Regni Francorum"
 nd_frk_destiny_desc: "Charlemagne's seal promised the renewal of the Roman empire. His son's, from 814, promised the renewal of the kingdom of the Franks. Francia has been proclaimed, but the realm of 814 reached far beyond the lands that proclaimed it: over Saxony and Bavaria, across the Pyrenees to Barcelona, into Pannonia and down Italy to Benevento. Holding those peoples is the work that begins now. Requires a stability of 75."
 nd_frk_dest_saxon_capitulary: "The Saxon Capitulary"
 nd_frk_dest_saxon_capitulary_desc: "In 777 the general assembly of the realm met at Paderborn, on Saxon soil, and a capitulary soon put the Saxon lands under counts, gave every district a church and forbade the Saxons to meet in assembly unless the king's envoy summoned them. Own Paderborn and Bremen directly, and at least half of Westphalia. Land held by marches or vassals does not count: this path rules its lands itself."
 nd_frk_dest_counts_of_bavaria: "The Counts of Bavaria"
 nd_frk_dest_counts_of_bavaria_desc: "In 788 the assembly at Ingelheim condemned Tassilo III, the last Agilolfing duke of Bavaria, and he ended his days as a monk. Bavaria kept its law and lost its duke: a prefect and counts of the king's choosing governed it from then on. Own Regensburg and Freising directly, and at least 60% of Bavaria, and keep the realm's societal values at least 25 toward centralization."
 nd_frk_dest_thionville: "The Capitulary of Thionville"
 nd_frk_dest_thionville_desc: "In 805 a capitulary issued at Thionville named the posts on the eastern frontier where merchants bound for the Slavs and the Avars had to stop, Magdeburg and Erfurt among them, and forbade them to sell weapons or mail beyond. The next year castles went up on the Elbe facing Magdeburg and on the Saale at Halle. Own Magdeburg, Halle and Erfurt directly, with at least half of Lower Saxony and half of Upper Saxony, and field an army of 75,000 men. Unlocks the Royal Castellum."
 nd_frk_dest_spanish_march: "The Spanish March"
 nd_frk_dest_spanish_march_desc: "Girona opened its gates to the Franks in 785, and in 801 Louis, king of Aquitaine, took Barcelona after a siege of many months. The land south of the Pyrenees became a march under counts who held the frontier with their own men. Hold Barcelona and Girona yourself or through a subject, keep at least two march subjects, and have 1,000 gold in the treasury."
 nd_frk_dest_avar_march: "The Avar March"
 nd_frk_dest_avar_march_desc: "In 795 men sent by Eric, duke of Friuli, broke into the Ring, the fortified camp of the Avar khagans, and in 796 Pepin, king of Italy, destroyed it. The land beyond the eastern Alps became a march reaching into Pannonia, where Savaria had been a Roman city. Hold Cividale, the seat of the Friulian dukes, and Szombathely yourself or through subjects, keep at least four subjects, and reach 50 prestige and 2,000 gold."
 nd_frk_dest_divisio_regnorum: "The Division of the Kingdoms"
 nd_frk_dest_divisio_regnorum_desc: "In 806 Charlemagne set down how his realm would pass to his three sons: to each a kingdom of his own, and each bound to defend the others. Beyond the kingdoms stood the tributaries and the allies: Benevento, which paid tribute from 787, and the Obodrites, who were given the land north of the Elbe as far as the Eider in 804. Hold Benevento and Rendsburg on the Eider yourself or through subjects, keep at least three march subjects and one subject of kingdom rank, and reach 3,000 gold and 75 prestige. Unlocks the Mayfield."

# === Destiny Tree: events ===
 nd_frk.6.t: "Renovatio Regni Francorum"
 nd_frk.6.d: "Charlemagne's lead seal bore the words Renovatio Romani imperii, the renewal of the empire of the Romans. In 814 his son Louis changed them to Renovatio regni Francorum, the renewal of the kingdom of the Franks, and it is the son's motto that the realm has now made its own. Francia stands again, and every court outside its borders is taking its measure.\n\nThe realm of 814 was more than the lands that have proclaimed it. It held Saxony and Bavaria, a march beyond the Pyrenees, the Avar frontier on the Danube and Italy as far as Benevento. Whether those peoples are to be governed by the realm's own counts or bound to it as marches and client princes, the founding principle has already answered. What remains is the work."
 nd_frk.6.a: "Renew the kingdom of the Franks"
 nd_frk.7.t: "The Saxon Capitulary"
 nd_frk.7.d: "The Saxon wars lasted more than thirty years. They began in 772 with the felling of the Irminsul and ended only in 804, and in their course Charlemagne held the realm's general assembly at Paderborn, on Saxon soil, and issued a capitulary that put Saxony under the king's law: a count in every district, a church in every district paid for by tithe, and no Saxon assembly unless the king's envoy called it.\n\nPaderborn and Bremen answer to Francia's own counts now, and to no duke or margrave. The Westphalian towns bring their pleas to the realm's courts, and the realm's law is read to them in the same words as at Aachen."
 nd_frk.7.a: "One law from the Rhine to the Weser"
 nd_frk.8.t: "Tassilo at Ingelheim"
 nd_frk.8.d: "Tassilo III, the last Agilolfing duke of Bavaria, came to the assembly at Ingelheim in 788 and found himself on trial. He was charged with deserting the royal host twenty five years earlier and with plotting with the Avars, and he was sentenced to death. Charlemagne spared his life; Tassilo was tonsured and sent to a monastery. Bavaria passed to a prefect, Gerold, the brother of Queen Hildegard, and to counts of the king's choosing.\n\nRegensburg and Freising are Francia's now, and the question of Ingelheim returns. The land can be held as a frontier command against the east, or divided into counties that answer to the crown and to nothing else."
 nd_frk.8.a: "A prefect and the realm's garrisons to hold the frontier"
 nd_frk.8.b: "Divide the duchy into counties that answer to the crown"
 nd_frk.9.t: "The Posts of Thionville"
 nd_frk.9.d: "At the end of 805 a capitulary issued at Thionville named the places on the eastern frontier where merchants going to the Slavs and the Avars had to stop, from Bardowick in the north through Magdeburg, Erfurt and Forchheim to Regensburg and Lorch on the Danube, and set a royal officer over each. No merchant was to carry weapons or mail coats beyond them. The next year the king's son Charles built castles on the Elbe facing Magdeburg and on the Saale at Halle.\n\nThe realm holds the posts again. Their officers ask whether the old ban still stands, or whether the posts are to become markets where the realm's law and its tolls meet the east."
 nd_frk.9.a: "Keep the ban: no sword and no mail coat past the posts"
 nd_frk.9.b: "Make the posts markets under the realm's officers"
 nd_frk.10.t: "The Spanish March"
 nd_frk.10.d: "Girona gave itself up to the Franks in 785. Barcelona held out longer: Louis, king of Aquitaine, besieged it through the winter of 800 and took it in 801, and it became the seat of a count who kept the frontier with his own men. Refugees from the south came north to settle the empty valleys, and royal letters of 812 and 815 protected their holdings against the counts who coveted them.\n\nA march stands beyond the Pyrenees again. Its lords judge by their own law and fight under the realm's banner, and the realm has learned again how a frontier can be held by the people who live on it."
 nd_frk.10.a: "Let the margraves keep the frontier"
 nd_frk.11.t: "The Treasure of the Ring"
 nd_frk.11.d: "For two centuries the Avar khagans had heaped up the tribute of Constantinople and the plunder of the Balkans inside the Ring, their great fortified camp on the Pannonian plain. In 795 men sent by Eric, duke of Friuli, broke into it, and in 796 Pepin, king of Italy, destroyed it. Einhard wrote that no war in memory had made the Franks so rich. Charlemagne sent much of the treasure to the pope, gave more to his churches and his magnates, and sent an Avar sword and belt to Offa of Mercia.\n\nThe Avar march belongs to Francia's ring again, and so do its spoils. The treasurers at Aachen ask what is to be done with them."
 nd_frk.11.a: "Share the spoils among the churches, the princes and friendly kings"
 nd_frk.11.b: "Keep the treasure in the vaults at Aachen"
 nd_frk.12.t: "The Division of the Kingdoms"
 nd_frk.12.d: "At Thionville in 806 Charlemagne set down how his realm would pass: to Charles the Frankish heartland, to Pepin Italy and most of Bavaria, to Louis Aquitaine, Provence and the Spanish March. Each son would be king in his own kingdom, and each was bound to defend the others. Eleven years later Louis, the only son left, chose otherwise in the Ordinatio imperii: his eldest would be emperor, and his brothers kings under him.\n\nFrancia's ring of marches and kingdoms now runs from the Eider to Benevento. Its princes gather at the assembly to hear which of the two orders the realm will keep."
 nd_frk.12.a: "A kingdom for each prince, each with its own court and law"
 nd_frk.12.b: "One crown over the kings, and every host at one summons"

# === Destiny Tree: timed modifiers ===
 STATIC_MODIFIER_NAME_nd_frk_dest_prefect_of_bavaria: "The Prefect of Bavaria"
 STATIC_MODIFIER_DESC_nd_frk_dest_prefect_of_bavaria: "Bavaria is held as a frontier command under a prefect, with the realm's own garrisons in its forts, as Gerold held it until he fell against the Avars in 799."
 STATIC_MODIFIER_NAME_nd_frk_dest_counts_of_the_crown: "The Counts of the Crown"
 STATIC_MODIFIER_DESC_nd_frk_dest_counts_of_the_crown: "The duchy is gone. Its counties answer to counts whom the crown appoints and removes, and the crown's household governs them for less than a duke's court ever cost."
 STATIC_MODIFIER_NAME_nd_frk_dest_no_mail_beyond_the_posts: "No Mail Beyond the Posts"
 STATIC_MODIFIER_DESC_nd_frk_dest_no_mail_beyond_the_posts: "The ban of 805 is kept to the letter. The realm's armouries keep what they forge and its hosts are well equipped, and the frontier merchants who lived on the arms trade take their business elsewhere."
 STATIC_MODIFIER_NAME_nd_frk_dest_markets_of_the_posts: "The Markets of the Posts"
 STATIC_MODIFIER_DESC_nd_frk_dest_markets_of_the_posts: "Each post is a chartered market under a royal officer. Towns grow up around the tollhouses, and settlers come to live in them."
 STATIC_MODIFIER_NAME_nd_frk_dest_gifts_of_the_ring: "The Gifts of the Ring"
 STATIC_MODIFIER_DESC_nd_frk_dest_gifts_of_the_ring: "The Avar gold goes out to the churches, the princes and the realm's friends abroad. Every altar has new plate, and every estate remembers who paid for it."
 STATIC_MODIFIER_NAME_nd_frk_dest_hoard_of_aachen: "The Hoard of Aachen"
 STATIC_MODIFIER_DESC_nd_frk_dest_hoard_of_aachen: "The treasure stays in the vaults at Aachen, and every lender knows it is there. The host that won it has gone home rich and is in no hurry to march again."
 STATIC_MODIFIER_NAME_nd_frk_dest_kingdoms_of_the_princes: "A Kingdom for Each Prince"
 STATIC_MODIFIER_DESC_nd_frk_dest_kingdoms_of_the_princes: "Each prince of the realm is king in his own kingdom, keeps his own court and judges by his own law. The kingdoms are content, and the countryside answers to its own king before it answers to the realm."
 STATIC_MODIFIER_NAME_nd_frk_dest_one_crown_over_the_kings: "One Crown Over the Kings"
 STATIC_MODIFIER_DESC_nd_frk_dest_one_crown_over_the_kings: "The kings rule their kingdoms under one crown, and when it summons them to war every host of the realm marches at once."

# === Destiny Tree: buildings ===
 nd_frk_castellum: "Royal Castellum"
 nd_frk_castellum_desc: "A royal castle on the old eastern frontier, garrisoned by the realm and seat of its officers, where the law of the capitularies is enforced far from the capital."
 nd_frk_castellum_maintenance: "Castle Garrison"
 nd_frk_castellum_maintenance_desc: "Stone for the walls, weapons for the garrison, and tools and paper for the officers who keep its records."
 nd_frk_mayfield: "The Mayfield"
 nd_frk_mayfield_desc: "The field and hall of the realm's general assembly, where every May the princes of all its peoples come to hear the capitularies, give counsel and bring their gifts."
 nd_frk_mayfield_maintenance: "Assembly Season"
 nd_frk_mayfield_maintenance_desc: "Wine and fine cloth for the princes, paper for the capitularies and horses for the envoys who carry them home."

# === Bureaucracies ===
 AUTO_MODIFIER_NAME_nd_frk_bureaucracy_authority: "The Order of the Realm"
 AUTO_MODIFIER_DESC_nd_frk_bureaucracy_authority: "Restored Francia may revive the institutions of the Carolingian realm: the sworn judges of the courts, the tenures held at the king's word, the tithe, the public measure, the general oath and the post horses of the crown's envoys."
 frk_scabini_bureaucracy: "The Scabini"
 frk_scabini_bureaucracy_desc: "From about 780 Charlemagne replaced the occasional assessors of the county court with scabini: sworn judges chosen by the count and the missi, seven to a court, who were expected to know the law of every people so that each man was judged by his own. The office outlived the empire as the échevins and Schöffen of the towns. At Metz the maître-échevin headed the city from 1234 to 1552, and the benches of Aachen and Cologne became the ruling colleges of their patricians."
 frk_precaria_bureaucracy: "Precaria Verbo Regis"
 frk_precaria_bureaucracy_desc: "At Estinnes in Hainaut in 743 Carloman let the vassals keep the church lands his father Charles Martel had given them, as tenures held by the king's word. Each holding owed its church a yearly census of one solidus, later the ninth and tenth of its produce, and in law it returned to the church when the vassal died. It mounted the host at the church's expense. By the time Charles the Bald promised at Quierzy in 877 that a dead count's honours would pass to his son, the loan had become a lordship."
 frk_decima_bureaucracy: "The Tithe of Herstal"
 frk_decima_bureaucracy_desc: "The capitulary issued at Herstal in March 779 made the tithe a duty of every subject by royal law, not only by the church's teaching, with the bishops to enforce it and a share set aside for the poor. It was laid on the conquered Saxons soon after, against Alcuin's warning that a tithe would drive them from the faith. For a thousand years it kept a priest in every parish, until the National Assembly abolished it in France in August 1789. Where lords took it into their own hands, the peasants who paid it asked in the Twelve Articles of 1525 that it go back to the pastor and the poor."
 frk_modius_publicus_bureaucracy: "The Public Measure"
 frk_modius_publicus_bureaucracy_desc: "After the famine of 792 and 793, the assembly at Frankfurt in 794 fixed the price of grain across the realm: a penny for a modius of oats, two for barley, three for rye, four for wheat, and twelve two-pound wheat loaves for a penny. Grain from the royal estates sold for less still, and a new public modius was set so that no dealer could shrink the measure. The tariff holds only as long as the crown's granaries can undersell the dealers."
 frk_general_oath_bureaucracy: "The General Oath"
 frk_general_oath_bureaucracy_desc: "When the conspirators of 786 claimed they had never sworn to Charlemagne, he had his missi take an oath of fidelity from the free men of every county, and took it again after the plot of Pepin the Hunchback in 792. In 802 every free man over the age of twelve swore anew to him as emperor, and the oath bound him to respect the church, the widow and the orphan, to leave the royal estates alone and to answer the summons to the host. At Meerssen in 847 his grandsons told every free man to choose a lord, and fidelity began to run through the lords instead."
 frk_paraveredi_bureaucracy: "Paraveredi and Tractoria"
 frk_paraveredi_bureaucracy_desc: "An envoy of the crown carried a tractoria, a sealed letter listing what each place on his road must give him: lodging, bread, wine, fodder and fresh horses. The horses were the paraveredi, owed by the free men of the district, and the word lives on as the German Pferd and the English palfrey. Louis the Pious revived the letters to move his magnates and their followers, and the missi were warned not to linger with great retinues, since every day they stayed was paid for by the district."
