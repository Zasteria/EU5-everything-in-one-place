l_spanish:
 # Calidad de vida EU5 - avisos de tareas de gabinete al máximo.
 # Contrato de alertas CMF: flags qol_cab_ready_stabilize / qol_cab_ready_strengthen.
 # _color (palabra de color) y _icon (text-icon); _name/_tooltip avisan de que la tarea
 # llegó al máximo y sigue activa para reducir el coste de mantenimiento al máximo.

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "Estabilidad al máximo"
 qol_cab_ready_stabilize_tooltip: "La estabilidad ha llegado a su máximo mientras está activa la tarea [ShowCabinetActionName('stabilize_country')]. La tarea sigue activa a propósito para reducir el coste de mantenimiento al máximo: cancélala manualmente si quieres liberar la plaza."

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "Poder gubernamental al máximo"
 qol_cab_ready_strengthen_tooltip: "El poder gubernamental ha llegado a su máximo mientras está activa la tarea [ShowCabinetActionName('strengthen_government')]. La tarea sigue activa a propósito para reducir el coste de mantenimiento al máximo: cancélala manualmente si quieres liberar la plaza."