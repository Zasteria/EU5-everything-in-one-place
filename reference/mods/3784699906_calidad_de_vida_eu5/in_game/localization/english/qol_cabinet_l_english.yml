l_english:
 # Calidad de vida EU5 - cabinet action "at max" alerts.
 # CMF alert display contract: flags qol_cab_ready_stabilize / qol_cab_ready_strengthen.
 # _color (color word) and _icon (text-icon) are set; _name/_tooltip tell the player
 # the action reached its maximum and stays active to reduce upkeep at max.

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "Stability at maximum"
 qol_cab_ready_stabilize_tooltip: "Stability has reached its maximum while [ShowCabinetActionName('stabilize_country')] is active. The action is kept running on purpose to reduce the upkeep cost of staying at max - cancel it manually to free the slot."

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "Government power at maximum"
 qol_cab_ready_strengthen_tooltip: "Government power has reached its maximum while [ShowCabinetActionName('strengthen_government')] is active. The action is kept running on purpose to reduce the upkeep cost of staying at max - cancel it manually to free the slot."