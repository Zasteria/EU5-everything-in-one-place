l_japanese:
 # Calidad de vida EU5 - 内閣行動の最大値アラート。
 # CMFアラート表示規約: qol_cab_ready_stabilize / qol_cab_ready_strengthen フラグ。
 # _color（色名）と_icon（テキストアイコン）; _name/_tooltip は最大値到達と、
 # 最大値維持コストを下げるため行動が継続していることを伝えます。

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "安定度が最大値"
 qol_cab_ready_stabilize_tooltip: "[ShowCabinetActionName('stabilize_country')] が実行中に安定度が最大値に達しました。最大値での維持コストを下げるために行動は意図的に継続されます - 枠を空けたい場合は手動で取り消してください。"

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "統治力が最大値"
 qol_cab_ready_strengthen_tooltip: "[ShowCabinetActionName('strengthen_government')] が実行中に統治力が最大値に達しました。最大値での維持コストを下げるために行動は意図的に継続されます - 枠を空けたい場合は手動で取り消してください。"