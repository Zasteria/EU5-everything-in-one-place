l_french:
 # Calidad de vida EU5 - alertes de rechargement.
 # Contrat d'affichage des alertes CMF : par type de rechargement surveillé, avec la clé qol_cd_ready_<type>.
 # _color (mot de couleur) et _icon (text-icon) sont uniformes ; _name/_tooltip diffèrent selon l'action.
 # L'icône est le text-icon vanilla « time » (aucune texture personnalisée requise).

 qol_cd_ready_request_divorce_color: "green"
 qol_cd_ready_request_divorce_icon: "@time!"
 qol_cd_ready_request_divorce_name: "Demander le divorce disponible"
 qol_cd_ready_request_divorce_tooltip: "L'interaction Demander le divorce n'est plus en rechargement et peut être utilisée à nouveau."

