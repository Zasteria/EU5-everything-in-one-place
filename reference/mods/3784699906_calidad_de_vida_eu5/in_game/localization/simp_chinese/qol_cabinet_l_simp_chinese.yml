l_simp_chinese:
 # Calidad de vida EU5 - 内阁行动达到上限提醒。
 # CMF 提醒显示约定: qol_cab_ready_stabilize / qol_cab_ready_strengthen 标志。
 # _color(颜色词)和_icon(文本图标); _name/_tooltip 告知行动已达到上限，
 # 并继续运行以降低满上线时的维护成本。

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "稳定度已达上限"
 qol_cab_ready_stabilize_tooltip: "在 [ShowCabinetActionName('stabilize_country')] 行动进行期间，稳定度已达到上限。该行动会继续运行，以降低满值时的维护成本 - 如果希望空出槽位，请手动取消。"

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "政府权力已达上限"
 qol_cab_ready_strengthen_tooltip: "在 [ShowCabinetActionName('strengthen_government')] 行动进行期间，政府权力已达到上限。该行动会继续运行，以降低满值时的维护成本 - 如果希望空出槽位，请手动取消。"