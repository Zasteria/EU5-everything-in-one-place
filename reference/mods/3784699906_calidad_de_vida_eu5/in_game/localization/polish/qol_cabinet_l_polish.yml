l_polish:
 # Calidad de vida EU5 - alerty zadań rządu przy maksimum.
 # Kontrakt wyświetlania alertów CMF: flagi qol_cab_ready_stabilize / qol_cab_ready_strengthen.
 # _color (słowo koloru) i _icon (ikona tekstowa); _name/_tooltip informują, że zadanie
 # osiągnęło maksimum i pozostaje aktywne, by obniżyć koszt utrzymania przy maksimum.

 qol_cab_ready_stabilize_color: "green"
 qol_cab_ready_stabilize_icon: "@stability!"
 qol_cab_ready_stabilize_name: "Stabilność na maksimum"
 qol_cab_ready_stabilize_tooltip: "Stabilność osiągnęła maksimum, podczas gdy zadanie [ShowCabinetActionName('stabilize_country')] jest aktywne. Zadanie celowo pozostaje aktywne, aby obniżyć koszt utrzymania przy maksimum - anuluj je ręcznie, aby zwolnić miejsce."

 qol_cab_ready_strengthen_color: "green"
 qol_cab_ready_strengthen_icon: "@government_power!"
 qol_cab_ready_strengthen_name: "Władza rządowa na maksimum"
 qol_cab_ready_strengthen_tooltip: "Władza rządowa osiągnęła maksimum, podczas gdy zadanie [ShowCabinetActionName('strengthen_government')] jest aktywne. Zadanie celowo pozostaje aktywne, aby obniżyć koszt utrzymania przy maksimum - anuluj je ręcznie, aby zwolnić miejsce."