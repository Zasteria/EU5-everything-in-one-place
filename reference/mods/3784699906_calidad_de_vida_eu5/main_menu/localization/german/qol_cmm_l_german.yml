 qol__qol__fort_cleanup_buildings_desc: "Welche Befestigungstypen die Abriss-Schaltfläche entfernt."
 qol__fort_cleanup_scope_name: "@country! Betroffene Länder"
 qol__fort_cleanup_scope_desc: "Welche Länder von der Befestigungsbereinigung betroffen sind: nur dein Land, dein Land und seine Untertanen (Vasallen und Juniorpartner), nur die Untertanen oder die ganze Welt."
