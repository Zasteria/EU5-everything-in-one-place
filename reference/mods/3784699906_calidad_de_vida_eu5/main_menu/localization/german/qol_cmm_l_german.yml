l_german:
 qol_name: "@hint! Lebensqualität QoL"
 qol_desc: "Verbesserungen der Lebensqualität: Sie entscheiden, in welchen Ortstypen die Automatisierung Befestigungen bauen darf, unerwünschte Befestigungen können bei Bedarf abgerissen werden, Fortschrittskreise bleiben beim Herauszoomen sichtbar und die Kartengrenzen sind dicker und deutlicher sichtbar. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" blockiert ein verbotener Ortstyp auch die manuelle Errichtung."
 qol__qol_name: "@fortress! Befestigungen"
