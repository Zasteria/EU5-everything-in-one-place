 qol__fort_cleanup_buildings_naval_battery_name: "@naval_battery! Marinebatterie"
 qol__qol__fort_build_forbidden_name: "@trigger_fail! Verbot von Befestigungen"
 qol__qol__fort_build_forbidden_desc: "Wähle, in welchen Ortstypen die Automatisierung keine Befestigungen bauen darf. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" blockiert ein verbotener Ortstyp auch manuelle Bauvorhaben; bei deaktivierten beiden kannst du überall frei bauen."
 qol__qol__fort_cleanup_name: "@arrow_down! Abriss von Befestigungen"
 qol__qol__fort_cleanup_desc: "Welche Befestigungen abgerissen werden sollen, in welchen Ortstypen und für welche Länder."
 qol__fort_build_forbidden_name: "@warning_icon! Befestigungen verbieten"
 qol__fort_build_forbidden_desc: "In welchen Ortstypen die Automatisierung keine Befestigungen bauen darf: ländliche Siedlungen, Kleinstädte, Städte, Megalopolen, Ihre Hauptstadt, Küsten, Provinzhauptstädte oder alle. Lassen Sie alles abgewählt für normales Verhalten. Hinweis: Wenn du Community Mod Framework (CMF) installiert hast, hat diese Einstellung Vorrang vor der entsprechenden Spielregel."
 qol__fort_build_forbidden_item_column_name: "Ortstyp"
 qol__fort_build_forbidden__enabled_name: "Verboten"
 qol__fort_build_forbidden_i1_name: "@rural_settlement! Ländliche Siedlung"
 qol__fort_build_forbidden_i1_desc: "Orte ländlicher Siedlungen. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__fort_build_forbidden_i2_name: "@town! Kleinstadt"
 qol__fort_build_forbidden_i2_desc: "Orte von Kleinstädten. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__fort_build_forbidden_i3_name: "@city! Stadt"
 qol__fort_build_forbidden_i3_desc: "Orte von Städten. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__fort_build_forbidden_i4_name: "@megalopolis! Megalopole"
 qol__fort_build_forbidden_i4_desc: "Orte von Megalopolen. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__fort_build_forbidden_i5_name: "@city_capital! Ihre Hauptstadt"
 qol__fort_build_forbidden_i5_desc: "Die Hauptstadt Ihres Landes. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__fort_build_forbidden_i6_name: "@ship! Küsten"
 qol__fort_build_forbidden_i6_desc: "Küstenorte. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__fort_build_forbidden_i7_name: "@province! Provinzhauptstädte"
 qol__fort_build_forbidden_i7_desc: "Provinzhauptstädte. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__fort_build_forbidden_i8_name: "@mapmode! Alle Orte"
 qol__fort_build_forbidden_i8_desc: "Jeder Ort: Die Automatisierung wird keine Befestigung bauen. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__fort_build_forbidden_i9_name: "@location! Keine Provinzhauptstädte"
 qol__fort_build_forbidden_i9_desc: "Orte, die keine Provinzhauptstädte sind. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__fort_build_forbidden_i10_name: "@inland! Binnenland"
 qol__fort_build_forbidden_i10_desc: "Binnenlandorte, die nicht an der Küste liegen. Bei aktiver Automatisierung für Gebäude oder „Gebäude auto-erweitern" ist auch manuelles Bauen blockiert."
 qol__papal_bulls_name: "@rite_power! Päpstliche Bullen"
 qol__papal_bulls__auto_vote_name: "@catholic_church! Auto-Abstimmung"
 qol__papal_bulls__auto_vote_desc: "Über welche päpstlichen Bullen dein Land automatisch abstimmt und auf welche Weise."
 qol__papal_bulls__auto_vote_schism_name: "@religious_influence_catholic! Abendländisches Schisma"
 qol__papal_bulls__auto_vote_schism_desc: "Für welche Seite dein Land in der Resolution zum Abendländischen Schisma automatisch abstimmt: für Rom, gegen Rom oder deaktiviert."
 qol__auto_vote_name: "@religion! Auto-Abstimmung bei päpstlichen Bullen"
 qol__auto_vote_desc: "Lege für jede päpstliche Bulle fest, ob automatisch abgestimmt wird: dafür, dagegen oder deaktiviert. Die Stimmen werden beim Monatswechsel abgegeben. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, hat diese Einstellung Vorrang vor der entsprechenden Spielregel."
 qol__auto_vote_item_column_name: "Bulle"
 qol__auto_vote_benedictus_deus_desc: "$MODIFIER_TYPE_NAME_global_pop_conversion_speed_modifier$ +33% für 10 Jahre."
 qol__auto_vote_christiana_pietas_desc: "+2 $MODIFIER_TYPE_NAME_tolerance_heathen$ für 10 Jahre."
 qol__auto_vote_in_coena_domini_desc: "$MODIFIER_TYPE_NAME_global_maritime_presence_modifier$ +25% für 10 Jahre."
 qol__auto_vote_apostolicae_servitutis_desc: "$MODIFIER_TYPE_NAME_clergy_estate_target_satisfaction$ +0.1 für 10 Jahre."
 qol__auto_vote_immensa_aeterni_dei_desc: "$MODIFIER_TYPE_NAME_global_institution_growth_modifier$ +0.1 für 10 Jahre."
 qol__auto_vote_inter_gravissimas_desc: "$MODIFIER_TYPE_NAME_legislative_efficiency$ +0.2 für 10 Jahre."
 qol__auto_vote_libertas_ecclesiae_desc: "$MODIFIER_TYPE_NAME_imperial_authority_modifier$ +0.2 für 10 Jahre."
 qol__auto_vote_dei_gratia_rex_desc: "$MODIFIER_TYPE_NAME_global_estate_target_satisfaction$ +0.05 für 10 Jahre."
 qol__auto_vote_illius_qui_se_pro_divini_desc: "$MODIFIER_TYPE_NAME_antagonism_received_modifier$ -0.2 für 10 Jahre."
 qol__auto_vote_excommunicate_resolution_desc: "Exkommuniziert den Herrscher des Ziellandes. Dauert an, bis die Exkommunikation aufgehoben wird."
 qol__auto_vote_call_crusade_desc: "Ruft einen Kreuzzug gegen ein Zielland aus. Dauert an, bis der Krieg mit dem Ziel endet; er kann alle 10 Jahre erneut ausgerufen werden."
 qol__auto_vote_western_schism_resolution_desc: "Stimmt für die Beilegung des Abendländischen Schismas zwischen Papst und Gegenpapst. Dauert an, bis das Schisma beigelegt ist."
 qol__auto_vote_schism_western_schism_resolution_name: "Automatische Unterstützung"
 qol__auto_vote__vote_name: "Auto-Abstimmung"
 qol__auto_vote__vote_option_1_name: "@trigger_fail! Deaktiviert"
 qol__auto_vote__vote_option_2_name: "@trigger_yes! Dafür stimmen"
 qol__auto_vote__vote_option_3_name: "@trigger_no! Dagegen stimmen"
 qol__auto_vote_schism_name: "@religious_influence_catholic! Abstimmung zum Abendländischen Schisma"
 qol__auto_vote_schism_desc: "Auto-Abstimmung über die Resolution zum Abendländischen Schisma: deaktiviert, für Rom oder gegen Rom. Die Stimme wird beim Monatswechsel abgegeben."
 qol__auto_vote_schism_item_column_name: "Bulle"
 qol__auto_vote_schism__vote_name: "Abstimmung"
 qol__auto_vote_schism__vote_option_1_name: "@trigger_fail! Deaktiviert"
 qol__auto_vote_schism__vote_option_2_name: "@rite_power! Für Rom"
 qol__auto_vote_schism__vote_option_3_name: "@trigger_no! Gegen Rom"
 qol__parliament_name: "@parliament! Parlament"
 qol__parliament__auto_pause_name: "@time! Das Parlament endet bald"
 qol__parliament__reminder_name: "@hint! Parlament verfügbar"
 qol__parliament_auto_pause_name: "@time! Automatische Pause"
 qol__parliament_auto_pause_desc: "Wann das Spiel gegen Ende einer Parlamentssitzung pausieren soll: nie, immer oder nur, wenn die Angelegenheit scheitern wird. Hinweis: Wenn du Community Mod Framework (CMF) installiert hast, hat diese Einstellung Vorrang vor der entsprechenden Spielregel."
 qol__parliament_auto_pause_option_1_name: "@trigger_fail! Deaktiviert"
 qol__parliament_auto_pause_option_2_name: "@time! Immer"
 qol__parliament_auto_pause_option_3_name: "@warning_icon! Nur bei Scheitern"
 qol__parliament_availability_reminder_name: "@hint! Einberufungserinnerung"
 qol__parliament_availability_reminder_desc: "Zeigt ein Ereignis-Popup (und pausiert das Spiel), wenn eine neue Sitzung des Parlaments einberufen werden kann. Hinweis: Wenn du Community Mod Framework (CMF) installiert hast, hat diese Einstellung Vorrang vor der entsprechenden Spielregel."
 qol__parliament_availability_reminder_option_1_name: "@trigger_yes! Aktiviert"
 qol__parliament_availability_reminder_option_2_name: "@trigger_fail! Deaktiviert"
 qol__education_name: "@literacy! Bildung"
 qol__education__auto_ce_name: "@heir! Automatische Ausbildung"
 qol__education__auto_ce_desc: "Jeden Monat wird jedem förderfähigen Kind automatisch die Ausbildung zugewiesen, die am besten zu seinen Fähigkeiten passt. Hinweis: Wenn Sie Community Mod Framework (CMF) installiert haben, haben diese Einstellungen Vorrang vor der entsprechenden Spielregel."
 qol__auto_ce_educate_heirs_name: "@heir! Erben ausbilden"
 qol__auto_ce_educate_heirs_desc: "Weist Erben jeden Monat automatisch eine Ausbildung zu. Deaktivieren, um ihre Ausbildung selbst zu wählen."
 qol__auto_ce_educate_crown_name: "@crown_estate! Kinder der Krone ausbilden"
 qol__auto_ce_educate_crown_desc: "Weist Kindern des Kronengutes jeden Monat automatisch eine Ausbildung zu."
 qol__auto_ce_educate_prodigy_name: "@characters! Wunderkinder und Hochbegabte ausbilden"
 qol__auto_ce_educate_prodigy_desc: "Weist Wunderkindern und hochbegabten Kindern jeden Monat automatisch eine Ausbildung zu. Sie erreichen mit jeder Ausbildung hohe Werte."
 qol__auto_ce_expensive_scope_name: "@gold! Teure Ausbildung"
 qol__auto_ce_expensive_scope_desc: "Weist Erben und/oder Kindern des Kronengutes automatisch die teure, intensive Ausbildung zu."
 qol__auto_ce_expensive_scope_option_1_name: "@trigger_fail! Deaktiviert"
 qol__auto_ce_expensive_scope_option_2_name: "@heir! Nur Erben"
 qol__auto_ce_expensive_scope_option_3_name: "@crown_estate! Erben und Krone"
 qol__auto_ce_expensive_scope_option_4_name: "@characters! Alle Kinder"
 qol__auto_ce_run_now_name: "@literacy! Jetzt neu bewerten"
 qol__auto_ce_run_now_desc: "Verarbeitet sofort alle förderfähigen Kinder, auch bereits verarbeitete. Ändert niemals eine bereits zugewiesene teure Ausbildung."
 qol__auto_ce_run_now_text: "@literacy! Neu bewerten"
 qol__cooldowns_name: "@time! Abklingzeiten"
 qol__cooldowns__alerts_name: "@warning_icon! Benachrichtigungen"
 qol__cooldowns__alerts_desc: "Wie dich Calidad de vida EU5 informiert, dass eine überwachte Abklingzeit vorbei ist. In der oberen Leiste wird eine Benachrichtigung angezeigt, sobald eine überwachte Aktion mit Abklingzeit wieder verfügbar wird."
 qol__cd_enable_alerts_name: "@warning_icon! Abklingzeit-Benachrichtigungen aktivieren"
 qol__cd_enable_alerts_desc: "Zeigt eine CMF-Benachrichtigung an, sobald eine überwachte Abklingzeit wieder verfügbar wird. Deaktivieren, um alle Abklingzeit-Benachrichtigungen stummzuschalten."
 qol__cab_enable_alerts_name: "@cabinet_action! Kabinettsaktions-Benachrichtigungen aktivieren"
 qol__cab_enable_alerts_desc: "Zeigt eine CMF-Benachrichtigung an, wenn die Aktion Land stabilisieren oder Regierung stärken ihren Maximalwert erreicht. Die Aktion bleibt bewusst aktiv, um die Unterhaltskosten am Maximum zu senken - die Benachrichtigung erinnert nur daran, dass sie manuell abgebrochen werden kann. Deaktivieren, um diese Benachrichtigungen stummzuschalten."
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! Abklingzeit des Ritterordens überwachen"
 qol__cd_watch_order_of_chivalry_desc: "Benachrichtigt, wenn die 10-jährige Abklingzeit des Ritterordens deines Lands vorbei ist - sie wird von Fremdländischem Ritterorden beitreten und In Ritterorden einladen geteilt, also startet die Nutzung einer der beiden sie. Standardmäßig aktiviert."
 qol__cooldowns__cd_watchlist_general_name: "@country! Allgemeine"
 qol__cooldowns__cd_watchlist_general_desc: "Aktionen mit Abklingzeit, die jedes Land nutzen kann (außer bei Anforderungen an Religion oder Beziehung). Markiere eine, um benachrichtigt zu werden, wenn ihre Abklingzeit endet."
 qol__cd_watchlist_general_name: "@country! Allgemeine"
 qol__cd_watchlist_general_desc: "Welche allgemeinen Aktionen mit Abklingzeit eine Benachrichtigung anzeigen, wenn sie wieder verfügbar werden."
 qol__cd_watchlist_general_item_column_name: "Aktion"
 qol__cd_watchlist_general__enabled_name: "Überwachen"
 qol__cd_watchlist_general_i1_name: "Scheidung fordern"
 qol__cd_watchlist_general_i1_desc: "Abklingzeit von 10 Jahren. Nur für katholische Länder verfügbar; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_general_i2_name: "Kultur durchsetzen"
 qol__cd_watchlist_general_i2_desc: "Abklingzeit von 10 Jahren. Für alle Länder verfügbar."
 qol__cd_watchlist_general_i3_name: "Religion durchsetzen"
 qol__cd_watchlist_general_i3_desc: "Abklingzeit von 10 Jahren. Für alle Länder verfügbar."
 qol__cd_watchlist_general_i4_name: "Siedler einladen"
 qol__cd_watchlist_general_i4_desc: "Abklingzeit von 2 Jahren. Für alle Länder verfügbar."
 qol__cd_watchlist_general_i5_name: "Wechsel der Hofsprache erzwingen"
 qol__cd_watchlist_general_i5_desc: "Abklingzeit von 10 Jahren. Für alle Länder verfügbar."
 qol__cd_watchlist_general_i6_name: "Finanzierung anfordern"
 qol__cd_watchlist_general_i6_desc: "Abklingzeit von 1 Jahr. Nur im Krieg verfügbar, während ein Militärorden dein Land fördert; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_general_i7_name: "Vorherrschaft übernehmen"
 qol__cd_watchlist_general_i7_desc: "Abklingzeit von 25 Jahren. Nur in einer Personalunion mit festgestellter Vorherrschaft verfügbar, in der du nicht der ältere Partner bist; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cooldowns__cd_watchlist_hre_name: "@hre! Heiliges Römisches Reich"
 qol__cooldowns__cd_watchlist_hre_desc: "Aktionen mit Abklingzeit des Heiligen Römischen Reichs (Reichskreise und Wahlunterstützung). Markiere eine, um benachrichtigt zu werden, wenn ihre Abklingzeit endet."
 qol__cd_watchlist_hre_name: "@hre! Heiliges Römisches Reich"
 qol__cd_watchlist_hre_desc: "Welche Aktionen des Heiligen Römischen Reichs mit Abklingzeit eine Benachrichtigung anzeigen, wenn sie wieder verfügbar werden."
 qol__cd_watchlist_hre_item_column_name: "Aktion"
 qol__cd_watchlist_hre__enabled_name: "Überwachen"
 qol__cd_watchlist_hre_i1_name: "Um Unterstützung bei der Wahl bitten"
 qol__cd_watchlist_hre_i1_desc: "Abklingzeit von 2 Jahren. Deckt auch Kürfürst bitten, für Kandidaten zu stimmen ab - beide teilen sich eine einzige Abklingzeit. Nur für Mitglieder des Heiligen Römischen Reichs verfügbar; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_hre_i2_name: "Reichstags-Petition"
 qol__cd_watchlist_hre_i2_desc: "Abklingzeit von 10 Jahren. Nur für Reichskreisvorsteher verfügbar; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_hre_i3_name: "Kreisprivilegien erbitten"
 qol__cd_watchlist_hre_i3_desc: "Abklingzeit von 5 Jahren. Nur für Reichskreisvorsteher verfügbar; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_hre_i4_name: "Kreisausschreiber herausfordern"
 qol__cd_watchlist_hre_i4_desc: "Abklingzeit von 5 Jahren. Nur für Mitglieder des Heiligen Römischen Reichs verfügbar, die weder Kaiser noch Kreisvorsteher sind; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_hre_i5_name: "Finanzhilfen vom Reichstag erbitten"
 qol__cd_watchlist_hre_i5_desc: "Abklingzeit von 10 Jahren. Nur für Mitglieder des Heiligen Römischen Reichs verfügbar, die weder Kaiser noch Kreisvorsteher sind; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_hre_i6_name: "Um Ausbau der Militärinfrastruktur bitten"
 qol__cd_watchlist_hre_i6_desc: "Abklingzeit von 10 Jahren. Nur für Mitglieder des Heiligen Römischen Reichs verfügbar, die weder Kaiser noch Kreisvorsteher sind; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_hre_i7_name: "Stellung eines Lands im Kreis anheben"
 qol__cd_watchlist_hre_i7_desc: "Abklingzeit von 10 Jahren. Nur für Mitglieder des Heiligen Römischen Reichs verfügbar, die weder Kaiser noch Kreisvorsteher sind; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cooldowns__cd_watchlist_situational_name: "@mapmode! Situationen"
 qol__cooldowns__cd_watchlist_situational_desc: "Aktionen mit Abklingzeit, die es nur gibt, während eine Situation läuft (derzeit die Italienischen Kriege). Markiere eine, um benachrichtigt zu werden, wenn ihre Abklingzeit endet."
 qol__cd_watchlist_situational_name: "@mapmode! Situationen"
 qol__cd_watchlist_situational_desc: "Welche situativen Aktionen mit Abklingzeit eine Benachrichtigung anzeigen, wenn sie wieder verfügbar werden."
 qol__cd_watchlist_situational_item_column_name: "Aktion"
 qol__cd_watchlist_situational__enabled_name: "Überwachen"
 qol__cd_watchlist_situational_i1_name: "Italienische Souveränität verletzen"
 qol__cd_watchlist_situational_i1_desc: "Abklingzeit von 1 Jahr. Nur während der Italienischen Kriege für einen im Krieg befindlichen Liga-Vorsteher verfügbar; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_situational_i2_name: "Zu Ligabeitritt bestechen"
 qol__cd_watchlist_situational_i2_desc: "Abklingzeit von 5 Jahren. Nur während der Italienischen Kriege für einen nicht im Krieg befindlichen Liga-Vorsteher verfügbar; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cooldowns__cd_watchlist_country_name: "@region! Länderspezifische"
 qol__cooldowns__cd_watchlist_country_desc: "Aktionen mit Abklingzeit für ein bestimmtes Land oder eine bestimmte Region (derzeit Japan während der Sengoku-Zeit und China während der Roten-Turban-Aufstände). Markiere eine, um benachrichtigt zu werden, wenn ihre Abklingzeit endet."
 qol__cd_watchlist_country_name: "@region! Länderspezifische"
 qol__cd_watchlist_country_desc: "Welche länderspezifischen Aktionen mit Abklingzeit eine Benachrichtigung anzeigen, wenn sie wieder verfügbar werden."
 qol__cd_watchlist_country_item_column_name: "Aktion"
 qol__cd_watchlist_country__enabled_name: "Überwachen"
 qol__cd_watchlist_country_i1_name: "Feindliche Besitztümer ausspionieren"
 qol__cd_watchlist_country_i1_desc: "Abklingzeit von 1 Jahr. Nur für Länder mit japanischer Kultur verfügbar; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cd_watchlist_country_i2_name: "Annektierung fordern"
 qol__cd_watchlist_country_i2_desc: "Abklingzeit von 3 Jahren. Nur für China, die Roten-Turban-Rebellen oder ein Land verfügbar, das den Roten-Turban-CB erstellen kann, während die Situation läuft; andernfalls ist der Schalter Überwachen deaktiviert."
 qol__cooldowns__cd_watchlist_estate_name: "@crown_estate! Ständeeinflüsse"
 qol__cooldowns__cd_watchlist_estate_desc: "Aktionen mit Abklingzeit, die mit Ständen verbunden sind (Lehne, Steuern, Klerus, Adel, Bürgerliche, Bauern, Stämme und Notparlament). Markiere eine, um benachrichtigt zu werden, wenn ihre Abklingzeit endet."
 qol__cd_watchlist_estate_name: "@crown_estate! Ständeeinflüsse"
 qol__cd_watchlist_estate_desc: "Welche Ständeinteraktionen mit Abklingzeit eine Benachrichtigung anzeigen, wenn sie wieder verfügbar werden."
 qol__cd_watchlist_estate_item_column_name: "Aktion"
 qol__cd_watchlist_estate__enabled_name: "Beobachten"
 qol__cd_watchlist_estate_i1_name: "Zusätzliche Levien anfordern"
 qol__cd_watchlist_estate_i1_desc: "5 Jahre Cooldown. Gewährt Arbeitskräfte auf Kosten der Standeszufriedenheit."
 qol__cd_watchlist_estate_i2_name: "Außerordentliche Steuern erheben"
 qol__cd_watchlist_estate_i2_desc: "5 Jahre Cooldown. Gewährt standesspezifische Steuereinnahmen auf Kosten der Standeszufriedenheit."
 qol__cd_watchlist_estate_i3_name: "Um geistliche Unterstützung bitten"
 qol__cd_watchlist_estate_i3_desc: "5 Jahre Cooldown. Gewährt Legitimität auf Kosten der Zufriedenheit des Klerus. Erfordert den Stand des Klerus."
 qol__cd_watchlist_estate_i4_name: "Adlige Gesandte anfordern"
 qol__cd_watchlist_estate_i4_desc: "5 Jahre Cooldown. Gewährt 5 Diplomaten auf Kosten der Zufriedenheit des Adels. Erfordert den Adelsstand."
 qol__cd_watchlist_estate_i5_name: "Um Notfallhilfe bitten"
 qol__cd_watchlist_estate_i5_desc: "5 Jahre Cooldown. Überträgt Gold von den Bürgerlichen auf Kosten ihrer Zufriedenheit. Erfordert den Bürgerlichenstand."
 qol__cd_watchlist_estate_i6_name: "Die Bauern besänftigen"
 qol__cd_watchlist_estate_i6_desc: "5 Jahre Cooldown. Gewährt Stabilität auf Kosten der Zufriedenheit der Bauern oder Dhimmis."
 qol__cd_watchlist_estate_i7_name: "Die Stämme zu den Waffen rufen"
 qol__cd_watchlist_estate_i7_desc: "5 Jahre Cooldown. Gewährt Arbeitskräfte auf Kosten der Zufriedenheit der Stämme oder Kosaken."
 qol__cd_watchlist_estate_i8_name: "Ein Notparlament einberufen"
 qol__cd_watchlist_estate_i8_desc: "5 Jahre Cooldown. Beruft eine Notparlamentssitzung ein auf Kosten der Legitimität. Erfordert ein Parlament und Kriegszustand."
