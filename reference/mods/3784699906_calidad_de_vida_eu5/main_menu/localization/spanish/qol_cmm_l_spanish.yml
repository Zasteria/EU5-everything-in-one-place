 qol__fort_cleanup_rank_option_5_name: "@megalopolis! Megalópolis"
 qol__fort_cleanup_rank_option_6_name: "@location! No capitales de provincia"
 qol__fort_cleanup_now_name: "@building! Demoler fortificaciones ahora"
 qol__fort_cleanup_now_desc: "Destruye al instante los tipos de fortificación seleccionados abajo en todas las ubicaciones excepto las capitales."
 qol__fort_cleanup_now_text: "@death! Demoler"
 qol__fort_cleanup_buildings_name: "@castle! Edificios a demoler"
 qol__fort_cleanup_buildings_desc: "Qué tipos de fortificación elimina el botón de demolición."
