l_spanish:
 qol_name: "@hint! Calidad de vida QoL"
 qol_desc: "Mejoras de calidad de vida: elige en qué tipos de ubicación puede la automatización construir fortificaciones, puedes demoler fortificaciones no deseadas bajo demanda, los círculos de progreso siguen visibles al alejar el zoom y las fronteras del mapa son más gruesas y visibles. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, un tipo de ubicación prohibido también bloquea la construcción manual."
 qol__qol_name: "@fortress! Fortificaciones"
 qol__qol__forts_name: "@fortress! Fortificaciones"
 qol__qol__fort_cleanup_buildings_name: "@castle! Edificios a demoler"
 qol__qol__fort_cleanup_buildings_desc: "Qué tipos de fortificación elimina el botón de demolición."
 qol__fort_cleanup_scope_name: "@country! Países afectados"
 qol__fort_cleanup_scope_desc: "Qué países se ven afectados por la limpieza de fortificaciones: solo tu país, tu país y sus súbditos (vasallos y socios menores), solo los súbditos, o todo el mundo."
 qol__fort_cleanup_scope_option_1_name: "@country! Solo mi país"
 qol__fort_cleanup_scope_option_2_name: "@subject! Mi país y súbditos"
 qol__fort_cleanup_scope_option_3_name: "@subject! Solo súbditos"
 qol__fort_cleanup_scope_option_4_name: "@mapmode! Todos los países"
 qol__fort_cleanup_rank_name: "@location! Tipo de ubicación"
 qol__fort_cleanup_rank_desc: "Qué tipo de ubicación se limpia: asentamientos rurales, pueblos, ciudades, megalópolis o todas."
 qol__fort_cleanup_rank_option_1_name: "@location! Todas las ubicaciones"
