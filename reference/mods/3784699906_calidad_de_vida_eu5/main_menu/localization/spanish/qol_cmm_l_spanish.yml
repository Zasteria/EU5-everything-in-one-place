 qol__fort_cleanup_buildings__enabled_name: "Demoler"
 qol__fort_cleanup_buildings_stockade_name: "@stockade! Empalizada"
 qol__fort_cleanup_buildings_castle_name: "@castle! Castillo"
 qol__fort_cleanup_buildings_bastion_name: "@bastion! Traza italiana"
 qol__fort_cleanup_buildings_star_fort_name: "@star_fort! Bastión"
 qol__fort_cleanup_buildings_fortress_name: "@fortress! Fortaleza"
 qol__fort_cleanup_buildings_city_walls_name: "@city_walls! Murallas de la ciudad"
 qol__fort_cleanup_buildings_coastal_fort_name: "@coastal_fort! Fortaleza costera"
 qol__fort_cleanup_buildings_naval_battery_name: "@naval_battery! Batería naval"
 qol__qol__fort_build_forbidden_name: "@trigger_fail! Prohibición de Fortificaciones"
 qol__qol__fort_build_forbidden_desc: "Elige en qué tipos de ubicación la automatización no puede construir fortificaciones. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, un tipo de ubicación prohibido también bloquea la construcción manual; con ambas desactivadas, puedes construir libremente en cualquier lugar."
 qol__qol__fort_cleanup_name: "@arrow_down! Demolición de Fortificaciones"
 qol__qol__fort_cleanup_desc: "Qué fortificaciones demoler, en qué tipos de ubicación y para qué países."
 qol__fort_build_forbidden_name: "@warning_icon! Prohibir fortalezas"
 qol__fort_build_forbidden_desc: "En qué tipos de ubicación la automatización no debe construir fortificaciones: asentamientos rurales, pueblos, ciudades, megalópolis, tu capital, costas, capitales de provincia o todas. Deja todo desmarcado para el comportamiento normal. Nota: si tienes instalado Community Mod Framework (CMF), este ajuste tiene prioridad sobre la regla de partida correspondiente."
 qol__fort_build_forbidden_item_column_name: "Tipo de ubicación"
 qol__fort_build_forbidden__enabled_name: "Prohibir"
 qol__fort_build_forbidden_i1_name: "@rural_settlement! Asentamiento rural"
 qol__fort_build_forbidden_i1_desc: "Ubicaciones de asentamiento rural. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__fort_build_forbidden_i2_name: "@town! Pueblo"
 qol__fort_build_forbidden_i2_desc: "Ubicaciones de pueblo. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__fort_build_forbidden_i3_name: "@city! Ciudad"
 qol__fort_build_forbidden_i3_desc: "Ubicaciones de ciudad. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__fort_build_forbidden_i4_name: "@megalopolis! Megalópolis"
 qol__fort_build_forbidden_i4_desc: "Ubicaciones de megalópolis. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__fort_build_forbidden_i5_name: "@city_capital! Tu capital"
 qol__fort_build_forbidden_i5_desc: "La capital de tu país. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__fort_build_forbidden_i6_name: "@ship! Costas"
 qol__fort_build_forbidden_i6_desc: "Ubicaciones costeras. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__fort_build_forbidden_i7_name: "@province! Capitales de provincia"
 qol__fort_build_forbidden_i7_desc: "Capitales de provincia. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__fort_build_forbidden_i8_name: "@mapmode! Todas las ubicaciones"
 qol__fort_build_forbidden_i8_desc: "Cualquier ubicación: la automatización no construirá ninguna fortificación. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__fort_build_forbidden_i9_name: "@location! No capitales de provincia"
 qol__fort_build_forbidden_i9_desc: "Ubicaciones que no son capitales de provincia. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__fort_build_forbidden_i10_name: "@inland! Interior"
 qol__fort_build_forbidden_i10_desc: "Ubicaciones de interior que no son costeras. Con la automatización de Edificios o de Ampliar edificios automáticamente activa, la construcción manual también se bloquea."
 qol__papal_bulls_name: "@rite_power! Bulas papales"
 qol__papal_bulls__auto_vote_name: "@catholic_church! Voto automático"
 qol__papal_bulls__auto_vote_desc: "Sobre qué bulas papales vota tu país automáticamente y de qué manera."
 qol__papal_bulls__auto_vote_schism_name: "@religious_influence_catholic! Cisma de Occidente"
 qol__papal_bulls__auto_vote_schism_desc: "Sobre qué lado se vota automáticamente en la resolución del Cisma de Occidente: a favor de Roma, en contra de Roma o desactivado."
 qol__auto_vote_name: "@religion! Voto automático en bulas papales"
 qol__auto_vote_desc: "Elige para cada bula papal si se vota automáticamente: a favor, en contra o desactivado. Los votos se emiten al cambiar el mes. Nota: si tienes instalado Community Mod Framework (CMF), este ajuste tiene prioridad sobre la regla de partida correspondiente."
 qol__auto_vote_item_column_name: "Bula"
 qol__auto_vote_benedictus_deus_desc: "$MODIFIER_TYPE_NAME_global_pop_conversion_speed_modifier$ +33% durante 10 años."
 qol__auto_vote_christiana_pietas_desc: "+2 $MODIFIER_TYPE_NAME_tolerance_heathen$ durante 10 años."
 qol__auto_vote_in_coena_domini_desc: "$MODIFIER_TYPE_NAME_global_maritime_presence_modifier$ +25% durante 10 años."
 qol__auto_vote_apostolicae_servitutis_desc: "$MODIFIER_TYPE_NAME_clergy_estate_target_satisfaction$ +0.1 durante 10 años."
 qol__auto_vote_immensa_aeterni_dei_desc: "$MODIFIER_TYPE_NAME_global_institution_growth_modifier$ +0.1 durante 10 años."
 qol__auto_vote_inter_gravissimas_desc: "$MODIFIER_TYPE_NAME_legislative_efficiency$ +0.2 durante 10 años."
 qol__auto_vote_libertas_ecclesiae_desc: "$MODIFIER_TYPE_NAME_imperial_authority_modifier$ +0.2 durante 10 años."
 qol__auto_vote_dei_gratia_rex_desc: "$MODIFIER_TYPE_NAME_global_estate_target_satisfaction$ +0.05 durante 10 años."
 qol__auto_vote_illius_qui_se_pro_divini_desc: "$MODIFIER_TYPE_NAME_antagonism_received_modifier$ -0.2 durante 10 años."
 qol__auto_vote_excommunicate_resolution_desc: "Excomulga al gobernante del país objetivo. Dura hasta que se levante la excomunión."
 qol__auto_vote_call_crusade_desc: "Convoca una cruzada contra un país objetivo. Dura hasta que termine la guerra con el objetivo; puede volver a convocarse cada 10 años."
 qol__auto_vote_western_schism_resolution_desc: "Vota para resolver el Cisma de Occidente entre el Papa y el antipapa. Dura hasta que se resuelva el cisma."
 qol__auto_vote_schism_western_schism_resolution_name: "Apoyo automático"
 qol__auto_vote__vote_name: "Voto automático"
 qol__auto_vote__vote_option_1_name: "@trigger_fail! Desactivado"
 qol__auto_vote__vote_option_2_name: "@trigger_yes! Votar a favor"
 qol__auto_vote__vote_option_3_name: "@trigger_no! Votar en contra"
 qol__auto_vote_schism_name: "@religious_influence_catholic! Voto del Cisma de Occidente"
 qol__auto_vote_schism_desc: "Voto automático en la resolución del Cisma de Occidente: desactivado, a favor de Roma o en contra de Roma. El voto se emite al cambiar el mes."
 qol__auto_vote_schism_item_column_name: "Bula"
 qol__auto_vote_schism__vote_name: "Voto"
 qol__auto_vote_schism__vote_option_1_name: "@trigger_fail! Desactivado"
 qol__auto_vote_schism__vote_option_2_name: "@rite_power! A favor de Roma"
 qol__auto_vote_schism__vote_option_3_name: "@trigger_no! En contra de Roma"
 qol__parliament_name: "@parliament! Parlamento"
 qol__parliament__auto_pause_name: "@time! El Parlamento va a finalizar"
 qol__parliament__reminder_name: "@hint! Parlamento disponible"
 qol__parliament_auto_pause_name: "@time! Pausa automática"
 qol__parliament_auto_pause_desc: "Cuándo pausar el juego cerca del final de una sesión parlamentaria: nunca, siempre, o solo si la cuestión está a punto de fracasar. Nota: si tienes instalado Community Mod Framework (CMF), este ajuste tiene prioridad sobre la regla de partida correspondiente."
 qol__parliament_auto_pause_option_1_name: "@trigger_fail! Desactivado"
 qol__parliament_auto_pause_option_2_name: "@time! Pausar siempre"
 qol__parliament_auto_pause_option_3_name: "@warning_icon! Solo si va a fracasar"
 qol__parliament_availability_reminder_name: "@hint! Aviso de convocatoria"
 qol__parliament_availability_reminder_desc: "Muestra un evento emergente (y pausa el juego) cuando se puede convocar una nueva sesión del Parlamento. Nota: si tienes instalado Community Mod Framework (CMF), este ajuste tiene prioridad sobre la regla de partida correspondiente."
 qol__parliament_availability_reminder_option_1_name: "@trigger_yes! Activado"
 qol__parliament_availability_reminder_option_2_name: "@trigger_fail! Desactivado"
 qol__education_name: "@literacy! Educación"
 qol__education__auto_ce_name: "@heir! Educación automática"
 qol__education__auto_ce_desc: "Cada mes, a cada hijo elegible se le asigna automáticamente la educación que mejor se adapta a sus aptitudes. Nota: si tienes instalado Community Mod Framework (CMF), esta configuración tiene prioridad sobre la regla de juego correspondiente."
 qol__auto_ce_educate_heirs_name: "@heir! Educar a los herederos"
 qol__auto_ce_educate_heirs_desc: "Asigna una educación a los herederos automáticamente cada mes. Desactívalo para elegir su educación manualmente."
 qol__auto_ce_educate_crown_name: "@crown_estate! Educar a los hijos de la Corona"
 qol__auto_ce_educate_crown_desc: "Asigna una educación a los hijos con el estamento de la Corona automáticamente cada mes."
 qol__auto_ce_educate_prodigy_name: "@characters! Educar a prodigios y superdotados"
 qol__auto_ce_educate_prodigy_desc: "Asigna una educación a los hijos prodigio o superdotados automáticamente cada mes. Alcanzan valores altos con cualquier educación."
 qol__auto_ce_expensive_scope_name: "@gold! Educación cara"
 qol__auto_ce_expensive_scope_desc: "Asigna automáticamente la educación profunda y cara a herederos y/o hijos del estamento de la Corona."
 qol__auto_ce_expensive_scope_option_1_name: "@trigger_fail! Desactivada"
 qol__auto_ce_expensive_scope_option_2_name: "@heir! Solo herederos"
 qol__auto_ce_expensive_scope_option_3_name: "@crown_estate! Herederos y Corona"
 qol__auto_ce_expensive_scope_option_4_name: "@characters! Todos los hijos"
 qol__auto_ce_run_now_name: "@literacy! Reevaluar ahora"
 qol__auto_ce_run_now_desc: "Reevalúa al instante a todos los hijos elegibles, incluidos los ya procesados. Nunca cambia una educación cara ya asignada."
 qol__auto_ce_run_now_text: "@literacy! Reevaluar"
 qol__cooldowns_name: "@time! Cooldowns"
 qol__cooldowns__alerts_name: "@warning_icon! Avisos"
 qol__cooldowns__alerts_desc: "Cómo te avisa Calidad de vida EU5 de que un cooldown vigilado ha terminado. Se muestra un aviso en la barra superior cuando una acción con cooldown vigilado vuelve a estar disponible."
 qol__cd_enable_alerts_name: "@warning_icon! Activar avisos de cooldown"
 qol__cd_enable_alerts_desc: "Muestra un aviso CMF cuando un cooldown vigilado vuelve a estar disponible. Desactívalo para silenciar todos los avisos de cooldown."
 qol__cab_enable_alerts_name: "@cabinet_action! Activar avisos de tareas de gabinete"
 qol__cab_enable_alerts_desc: "Muestra un aviso CMF cuando la tarea Estabilizar país o Reforzar Gobierno llega a su máximo. La tarea sigue activa a propósito para reducir el coste de mantenimiento al máximo: el aviso solo recuerda que puede cancelarse manualmente. Desactívalo para silenciar estos avisos."
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! Vigilar cooldown de la Orden de Caballería"
 qol__cd_watch_order_of_chivalry_desc: "Avisa cuando termina el cooldown de 10 años de la Orden de Caballería de tu país: lo comparten Unirse a una orden de caballería extranjera e Invitar a orden de caballería, así que usar cualquiera de las dos lo inicia. Activado por defecto."
 qol__cooldowns__cd_watchlist_general_name: "@country! Generales"
 qol__cooldowns__cd_watchlist_general_desc: "Acciones con cooldown que puede usar cualquier país (salvo requisitos de religión o relación). Marca una para recibir un aviso cuando termine su cooldown."
 qol__cd_watchlist_general_name: "@country! Generales"
 qol__cd_watchlist_general_desc: "Qué acciones generales con cooldown muestran un aviso cuando vuelven a estar disponibles."
 qol__cd_watchlist_general_item_column_name: "Acción"
 qol__cd_watchlist_general__enabled_name: "Vigilar"
 qol__cd_watchlist_general_i1_name: "Solicitar divorcio"
 qol__cd_watchlist_general_i1_desc: "Cooldown de 10 años. Solo disponible para países católicos; si no lo eres, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_general_i2_name: "Imponer cultura"
 qol__cd_watchlist_general_i2_desc: "Cooldown de 10 años. Disponible para todos los países."
 qol__cd_watchlist_general_i3_name: "Imponer religión"
 qol__cd_watchlist_general_i3_desc: "Cooldown de 10 años. Disponible para todos los países."
 qol__cd_watchlist_general_i4_name: "Invitar colonos"
 qol__cd_watchlist_general_i4_desc: "Cooldown de 2 años. Disponible para todos los países."
 qol__cd_watchlist_general_i5_name: "Forzar cambio de idioma cortesano"
 qol__cd_watchlist_general_i5_desc: "Cooldown de 10 años. Disponible para todos los países."
 qol__cd_watchlist_general_i6_name: "Pedir fondos"
 qol__cd_watchlist_general_i6_desc: "Cooldown de 1 año. Solo disponible en guerra mientras una orden militar patrocina a tu país; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_general_i7_name: "Asumir antigüedad"
 qol__cd_watchlist_general_i7_desc: "Cooldown de 25 años. Solo disponible en una unión personal con antigüedad establecida en la que no eres el socio mayor; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cooldowns__cd_watchlist_hre_name: "@hre! Sacro Imperio"
 qol__cooldowns__cd_watchlist_hre_desc: "Acciones con cooldown del Sacro Imperio Romano Germánico (círculos imperiales y apoyo electoral). Marca una para recibir un aviso cuando termine su cooldown."
 qol__cd_watchlist_hre_name: "@hre! Sacro Imperio"
 qol__cd_watchlist_hre_desc: "Qué acciones del Sacro Imperio con cooldown muestran un aviso cuando vuelven a estar disponibles."
 qol__cd_watchlist_hre_item_column_name: "Acción"
 qol__cd_watchlist_hre__enabled_name: "Vigilar"
 qol__cd_watchlist_hre_i1_name: "Pedir apoyo electoral"
 qol__cd_watchlist_hre_i1_desc: "Cooldown de 2 años. Cubre también Pedir al elector que vote por un candidato: ambas comparten un único cooldown. Solo disponible para miembros del Sacro Imperio Romano Germánico; si no lo eres, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_hre_i2_name: "Presentar una petición ante la Dieta Imperial"
 qol__cd_watchlist_hre_i2_desc: "Cooldown de 10 años. Solo disponible para líderes de círculo imperial; si no lo eres, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_hre_i3_name: "Solicitar un privilegio de círculo"
 qol__cd_watchlist_hre_i3_desc: "Cooldown de 5 años. Solo disponible para líderes de círculo imperial; si no lo eres, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_hre_i4_name: "Desafiar al liderazgo del círculo"
 qol__cd_watchlist_hre_i4_desc: "Cooldown de 5 años. Solo disponible para miembros del Sacro Imperio que no son ni emperador ni líder de círculo; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_hre_i5_name: "Solicitar ayuda económica a la dieta del círculo"
 qol__cd_watchlist_hre_i5_desc: "Cooldown de 10 años. Solo disponible para miembros del Sacro Imperio que no son ni emperador ni líder de círculo; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_hre_i6_name: "Solicitar ampliación de la infraestructura militar"
 qol__cd_watchlist_hre_i6_desc: "Cooldown de 10 años. Solo disponible para miembros del Sacro Imperio que no son ni emperador ni líder de círculo; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_hre_i7_name: "Elevar la posición del país dentro del círculo"
 qol__cd_watchlist_hre_i7_desc: "Cooldown de 10 años. Solo disponible para miembros del Sacro Imperio que no son ni emperador ni líder de círculo; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cooldowns__cd_watchlist_situational_name: "@mapmode! Situaciones"
 qol__cooldowns__cd_watchlist_situational_desc: "Acciones con cooldown que solo existen mientras una situación está activa (actualmente las Guerras Italianas). Marca una para recibir un aviso cuando termine su cooldown."
 qol__cd_watchlist_situational_name: "@mapmode! Situaciones"
 qol__cd_watchlist_situational_desc: "Qué acciones situacionales con cooldown muestran un aviso cuando vuelven a estar disponibles."
 qol__cd_watchlist_situational_item_column_name: "Acción"
 qol__cd_watchlist_situational__enabled_name: "Vigilar"
 qol__cd_watchlist_situational_i1_name: "Infracción de la soberanía italiana"
 qol__cd_watchlist_situational_i1_desc: "Cooldown de 1 año. Solo disponible durante las Guerras Italianas para un líder de liga en guerra; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_situational_i2_name: "Sobornar para unirse a la liga"
 qol__cd_watchlist_situational_i2_desc: "Cooldown de 5 años. Solo disponible durante las Guerras Italianas para un líder de liga que no está en guerra; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cooldowns__cd_watchlist_country_name: "@region! Específicas de país"
 qol__cooldowns__cd_watchlist_country_desc: "Acciones con cooldown para un país o región concretos (actualmente Japón durante el periodo Sengoku y China durante la Rebelión del Turbante Rojo). Marca una para recibir un aviso cuando termine su cooldown."
 qol__cd_watchlist_country_name: "@region! Específicas de país"
 qol__cd_watchlist_country_desc: "Qué acciones específicas de país con cooldown muestran un aviso cuando vuelven a estar disponibles."
 qol__cd_watchlist_country_item_column_name: "Acción"
 qol__cd_watchlist_country__enabled_name: "Vigilar"
 qol__cd_watchlist_country_i1_name: "Explorar posesiones enemigas"
 qol__cd_watchlist_country_i1_desc: "Cooldown de 1 año. Solo disponible para países con cultura japonesa; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cd_watchlist_country_i2_name: "Exigir anexión"
 qol__cd_watchlist_country_i2_desc: "Cooldown de 3 años. Solo disponible para China, los rebeldes del Turbante Rojo o un país capaz de crear el CB del Turbante Rojo mientras la situación está activa; si no es el caso, el interruptor Vigilar está deshabilitado."
 qol__cooldowns__cd_watchlist_estate_name: "@crown_estate! Interacciones con Estamentos"
 qol__cooldowns__cd_watchlist_estate_desc: "Tiempos de recarga de las interacciones de emergencia de estamentos (5 años cada una). Estas acciones otorgan recursos, legitimidad, estabilidad o mano de obra a cambio de la satisfacción del estamento. Marca una para recibir un aviso cuando termine su tiempo de recarga."
 qol__cd_watchlist_estate_name: "@crown_estate! Interacciones con Estamentos"
 qol__cd_watchlist_estate_desc: "Qué tiempos de recarga de interacciones de emergencia de estamentos generan un aviso cuando vuelven a estar disponibles."
 qol__cd_watchlist_estate_item_column_name: "Acción"
 qol__cd_watchlist_estate__enabled_name: "Vigilar"
 qol__cd_watchlist_estate_i1_name: "Solicitar más levas"
 qol__cd_watchlist_estate_i1_desc: "Cooldown de 5 años. Otorga mano de obra a cambio de la satisfacción del estamento."
 qol__cd_watchlist_estate_i2_name: "Recaudar impuestos extraordinarios"
 qol__cd_watchlist_estate_i2_desc: "Cooldown de 5 años. Otorga ingresos fiscales específicos del estamento a cambio de su satisfacción."
 qol__cd_watchlist_estate_i3_name: "Solicitar respaldo del clero"
 qol__cd_watchlist_estate_i3_desc: "Cooldown de 5 años. Otorga legitimidad a cambio de la satisfacción del clero. Requiere el estamento del clero."
 qol__cd_watchlist_estate_i4_name: "Solicitar enviados nobles"
