l_russian:
 qol_name: "@hint! Качество жизни QoL"
 qol_desc: "Улучшения качества жизни: вы решаете, в каких типах локаций автоматизация может строить укрепления, можете сносить ненужные укрепления по требованию, круги прогресса остаются видимыми при отдалении камеры, а границы на карте стали толще и заметнее. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» запрещённый тип локации блокирует и ручное строительство."
 qol__qol_name: "@fortress! Укрепления"
 qol__qol__forts_name: "@fortress! Укрепления"
 qol__qol__fort_cleanup_buildings_name: "@castle! Здания на снос"
 qol__qol__fort_cleanup_buildings_desc: "Какие типы укреплений удаляет кнопка сноса."
 qol__fort_cleanup_scope_name: "@country! Затронутые страны"
 qol__fort_cleanup_scope_desc: "Какие страны затрагивает очистка укреплений: только ваша страна, ваша страна и её зависимые государства (вассалы и младшие партнёры), только зависимые государства или весь мир."
 qol__fort_cleanup_scope_option_1_name: "@country! Только моя страна"
 qol__fort_cleanup_scope_option_2_name: "@subject! Моя страна и зависимые государства"
 qol__fort_cleanup_scope_option_3_name: "@subject! Только зависимые государства"
 qol__fort_cleanup_scope_option_4_name: "@mapmode! Все страны"
 qol__fort_cleanup_rank_name: "@location! Тип поселения"
 qol__fort_cleanup_rank_desc: "Какие типы поселений очищаются: сельские поселения, деревни, города, мегаполисы или все."
 qol__fort_cleanup_rank_option_1_name: "@location! Все поселения"
 qol__fort_cleanup_rank_option_2_name: "@rural_settlement! Сельское поселение"
 qol__fort_cleanup_rank_option_3_name: "@town! Деревня"
 qol__fort_cleanup_rank_option_4_name: "@city! Город"
 qol__fort_cleanup_rank_option_5_name: "@megalopolis! Мегаполис"
 qol__fort_cleanup_rank_option_6_name: "@location! Не столицы провинций"
 qol__fort_cleanup_now_name: "@building! Снести укрепления сейчас"
 qol__fort_cleanup_now_desc: "Мгновенно уничтожает выбранные ниже типы укреплений во всех поселениях, кроме столиц."
 qol__fort_cleanup_now_text: "@death! Снести"
 qol__fort_cleanup_buildings_name: "@castle! Здания на снос"
 qol__fort_cleanup_buildings_desc: "Какие типы укреплений удаляет кнопка сноса."
 qol__fort_cleanup_buildings_item_column_name: "Здание"
 qol__fort_cleanup_buildings__enabled_name: "Снести"
 qol__fort_cleanup_buildings_stockade_name: "@stockade! Частокол"
 qol__fort_cleanup_buildings_castle_name: "@castle! Замок"
 qol__fort_cleanup_buildings_bastion_name: "@bastion! Итальянское укрепление"
 qol__fort_cleanup_buildings_star_fort_name: "@star_fort! Звёздная крепость"
 qol__fort_cleanup_buildings_fortress_name: "@fortress! Крепость"
 qol__fort_cleanup_buildings_city_walls_name: "@city_walls! Городские стены"
 qol__fort_cleanup_buildings_coastal_fort_name: "@coastal_fort! Береговая крепость"
 qol__fort_cleanup_buildings_naval_battery_name: "@naval_battery! Береговая батарея"
 qol__qol__fort_build_forbidden_name: "@trigger_fail! Запрет строительства укреплений"
 qol__qol__fort_build_forbidden_desc: "Выберите, в каких типах локаций автоматизация не может строить укрепления. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» запрещённый тип локации блокирует и ручное строительство; при выключенных обеих вы можете свободно строить где угодно."
 qol__qol__fort_cleanup_name: "@arrow_down! Снос укреплений"
 qol__qol__fort_cleanup_desc: "Какие укрепления сносить, в каких типах локаций и для каких стран."
 qol__fort_build_forbidden_name: "@warning_icon! Запретить укрепления"
 qol__fort_build_forbidden_desc: "В каких типах локаций автоматизация не может строить укрепления: сельские поселения, местечки, города, мегаполисы, ваша столица, побережья, столицы провинций или все. Снимите все галочки для обычного поведения. Примечание: если установлен Community Mod Framework (CMF), эта настройка имеет приоритет над соответствующим правилом игры."
 qol__fort_build_forbidden_item_column_name: "Тип локации"
 qol__fort_build_forbidden__enabled_name: "Запрещено"
 qol__fort_build_forbidden_i1_name: "@rural_settlement! Сельское поселение"
 qol__fort_build_forbidden_i1_desc: "Локации сельских поселений. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__fort_build_forbidden_i2_name: "@town! Местечко"
 qol__fort_build_forbidden_i2_desc: "Локации местечек. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__fort_build_forbidden_i3_name: "@city! Город"
 qol__fort_build_forbidden_i3_desc: "Локации городов. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__fort_build_forbidden_i4_name: "@megalopolis! Мегаполис"
 qol__fort_build_forbidden_i4_desc: "Локации мегаполисов. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__fort_build_forbidden_i5_name: "@city_capital! Ваша столица"
 qol__fort_build_forbidden_i5_desc: "Столица вашей страны. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__fort_build_forbidden_i6_name: "@ship! Побережья"
 qol__fort_build_forbidden_i6_desc: "Прибрежные локации. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__fort_build_forbidden_i7_name: "@province! Столицы провинций"
 qol__fort_build_forbidden_i7_desc: "Столицы провинций. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__fort_build_forbidden_i8_name: "@mapmode! Все локации"
 qol__fort_build_forbidden_i8_desc: "Любая локация: автоматизация не построит ни одного укрепления. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__fort_build_forbidden_i9_name: "@location! Не столицы провинций"
 qol__fort_build_forbidden_i9_desc: "Локации, которые не являются столицами провинций. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__fort_build_forbidden_i10_name: "@inland! Внутренние"
 qol__fort_build_forbidden_i10_desc: "Внутренние локации, которые не являются прибрежными. При включённой автоматизации «Сооружения» или «Авторасширение сооружений» ручное строительство также блокируется."
 qol__papal_bulls_name: "@rite_power! Папские буллы"
 qol__papal_bulls__auto_vote_name: "@catholic_church! Автоголосование"
 qol__papal_bulls__auto_vote_desc: "По каким папским буллам ваша страна голосует автоматически и каким образом."
 qol__papal_bulls__auto_vote_schism_name: "@religious_influence_catholic! Западная схизма"
 qol__papal_bulls__auto_vote_schism_desc: "За какую сторону ваша страна голосует автоматически в резолюции Западной схизмы: за Рим, против Рима или выключено."
 qol__auto_vote_name: "@religion! Автоголосование по папским буллам"
 qol__auto_vote_desc: "Выберите для каждой папской буллы, голосовать ли автоматически: за, против или выключено. Голоса отдаются при смене месяца. Примечание: если установлен Community Mod Framework (CMF), этот параметр имеет приоритет над соответствующей игровой правилой."
 qol__auto_vote_item_column_name: "Булла"
 qol__auto_vote_benedictus_deus_desc: "$MODIFIER_TYPE_NAME_global_pop_conversion_speed_modifier$ +33% на 10 лет."
 qol__auto_vote_christiana_pietas_desc: "+2 $MODIFIER_TYPE_NAME_tolerance_heathen$ на 10 лет."
 qol__auto_vote_in_coena_domini_desc: "$MODIFIER_TYPE_NAME_global_maritime_presence_modifier$ +25% на 10 лет."
 qol__auto_vote_apostolicae_servitutis_desc: "$MODIFIER_TYPE_NAME_clergy_estate_target_satisfaction$ +0.1 на 10 лет."
 qol__auto_vote_immensa_aeterni_dei_desc: "$MODIFIER_TYPE_NAME_global_institution_growth_modifier$ +0.1 на 10 лет."
 qol__auto_vote_inter_gravissimas_desc: "$MODIFIER_TYPE_NAME_legislative_efficiency$ +0.2 на 10 лет."
 qol__auto_vote_libertas_ecclesiae_desc: "$MODIFIER_TYPE_NAME_imperial_authority_modifier$ +0.2 на 10 лет."
 qol__auto_vote_dei_gratia_rex_desc: "$MODIFIER_TYPE_NAME_global_estate_target_satisfaction$ +0.05 на 10 лет."
 qol__auto_vote_illius_qui_se_pro_divini_desc: "$MODIFIER_TYPE_NAME_antagonism_received_modifier$ -0.2 на 10 лет."
 qol__auto_vote_excommunicate_resolution_desc: "Отлучает правителя целевой страны от церкви. Действует до снятия отлучения."
 qol__auto_vote_call_crusade_desc: "Объявляет крестовый поход против целевой страны. Длится до окончания войны с целью; может быть объявлен вновь каждые 10 лет."
 qol__auto_vote_western_schism_resolution_desc: "Голосует за разрешение Западной схизмы между Папой и антипапой. Длится до разрешения схизмы."
 qol__auto_vote_schism_western_schism_resolution_name: "Автоматическая поддержка"
 qol__auto_vote__vote_name: "Автоголосование"
 qol__auto_vote__vote_option_1_name: "@trigger_fail! Выключено"
 qol__auto_vote__vote_option_2_name: "@trigger_yes! Голосовать за"
 qol__auto_vote__vote_option_3_name: "@trigger_no! Голосовать против"
 qol__auto_vote_schism_name: "@religious_influence_catholic! Голосование по Западной схизме"
 qol__auto_vote_schism_desc: "Автоголосование по резолюции Западной схизмы: выключено, за Рим или против Рима. Голос отдаётся при смене месяца."
 qol__auto_vote_schism_item_column_name: "Булла"
 qol__auto_vote_schism__vote_name: "Голосование"
 qol__auto_vote_schism__vote_option_1_name: "@trigger_fail! Выключено"
 qol__auto_vote_schism__vote_option_2_name: "@rite_power! За Рим"
 qol__auto_vote_schism__vote_option_3_name: "@trigger_no! Против Рима"
 qol__parliament_name: "@parliament! Парламент"
 qol__parliament__auto_pause_name: "@time! Парламент скоро завершится"
 qol__parliament__reminder_name: "@hint! Парламент доступен"
 qol__parliament_auto_pause_name: "@time! Автопауза"
 qol__parliament_auto_pause_desc: "Когда ставить игру на паузу ближе к концу заседания парламента: никогда, всегда или только если вопрос провалится. Примечание: если установлен Community Mod Framework (CMF), эта настройка имеет приоритет над соответствующим правилом игры."
 qol__parliament_auto_pause_option_1_name: "@trigger_fail! Выключено"
 qol__parliament_auto_pause_option_2_name: "@time! Всегда"
 qol__parliament_auto_pause_option_3_name: "@warning_icon! Только при провале"
 qol__parliament_availability_reminder_name: "@hint! Напоминание о созыве"
 qol__parliament_availability_reminder_desc: "Показывает событие (и ставит игру на паузу), когда можно созвать новую сессию парламента. Примечание: если установлен Community Mod Framework (CMF), эта настройка имеет приоритет над соответствующим правилом игры."
 qol__parliament_availability_reminder_option_1_name: "@trigger_yes! Включено"
 qol__parliament_availability_reminder_option_2_name: "@trigger_fail! Выключено"
 qol__education_name: "@literacy! Образование"
 qol__education__auto_ce_name: "@heir! Автообучение"
 qol__education__auto_ce_desc: "Каждый месяц всем подходящим детям автоматически назначается образование, соответствующее их способностям. Примечание: если установлен Community Mod Framework (CMF), эти настройки имеют приоритет над соответствующей игровой опцией."
 qol__auto_ce_educate_heirs_name: "@heir! Обучать наследников"
 qol__auto_ce_educate_heirs_desc: "Каждый месяц наследникам автоматически назначается образование. Отключите, чтобы выбирать его вручную."
 qol__auto_ce_educate_crown_name: "@crown_estate! Обучать детей короны"
 qol__auto_ce_educate_crown_desc: "Каждый месяц детям из домена короны автоматически назначается образование."
 qol__auto_ce_educate_prodigy_name: "@characters! Обучать вундеркиндов"
 qol__auto_ce_educate_prodigy_desc: "Каждый месяц детям-вундеркиндам и одарённым автоматически назначается образование. Они достигают высоких значений при любом образовании."
 qol__auto_ce_expensive_scope_name: "@gold! Дорогое образование"
 qol__auto_ce_expensive_scope_desc: "Автоматически назначает дорогое углублённое образование наследникам и/или детям короны."
 qol__auto_ce_expensive_scope_option_1_name: "@trigger_fail! Выключено"
 qol__auto_ce_expensive_scope_option_2_name: "@heir! Только наследники"
 qol__auto_ce_expensive_scope_option_3_name: "@crown_estate! Наследники и корона"
 qol__auto_ce_expensive_scope_option_4_name: "@characters! Все дети"
 qol__auto_ce_run_now_name: "@literacy! Пересчитать сейчас"
 qol__auto_ce_run_now_desc: "Немедленно обрабатывает всех подходящих детей, включая уже обработанных. Никогда не меняет уже назначенное дорогое образование."
 qol__auto_ce_run_now_text: "@literacy! Пересчитать"
 qol__cooldowns_name: "@time! Перезарядки"
 qol__cooldowns__alerts_name: "@warning_icon! Уведомления"
 qol__cooldowns__alerts_desc: "Как Calidad de vida EU5 сообщает, что отслеживаемая перезарядка завершилась. Уведомление на верхней панели появляется, когда отслеживаемое действие с перезарядкой снова становится доступным."
 qol__cd_enable_alerts_name: "@warning_icon! Включить уведомления о перезарядке"
 qol__cd_enable_alerts_desc: "Показывает уведомление CMF, когда отслеживаемая перезарядка снова становится доступной. Отключите, чтобы заставить все уведомления о перезарядке замолчать."
 qol__cab_enable_alerts_name: "@cabinet_action! Включить уведомления о действиях кабинета"
 qol__cab_enable_alerts_desc: "Показывает уведомление CMF, когда действие «Повышение стабильности в державе» или «Укрепление правительства» достигает максимального значения. Действие намеренно остаётся активным, чтобы снизить стоимость содержания на максимуме - уведомление лишь напоминает, что его можно отменить вручную. Отключите, чтобы скрыть эти уведомления."
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! Отслеживать перезарядку рыцарского ордена"
 qol__cd_watch_order_of_chivalry_desc: "Уведомляет, когда 10-летняя перезарядка рыцарского ордена вашей державы завершается - она общая для «Вступления в иноземный рыцарский орден» и «Приглашения в рыцарский орден», поэтому использование любого из них её запускает. По умолчанию включено."
 qol__cooldowns__cd_watchlist_general_name: "@country! Общие"
 qol__cooldowns__cd_watchlist_general_desc: "Действия с перезарядкой, которые может использовать любая держава (если не действует требование по религии или отношениям). Отметьте одно, чтобы получить уведомление, когда его перезарядка завершится."
 qol__cd_watchlist_general_name: "@country! Общие"
 qol__cd_watchlist_general_desc: "Какие общие действия с перезарядкой показывают уведомление, когда снова становятся доступными."
 qol__cd_watchlist_general_item_column_name: "Действие"
 qol__cd_watchlist_general__enabled_name: "Отслеживать"
 qol__cd_watchlist_general_i1_name: "Просьба о разводе"
 qol__cd_watchlist_general_i1_desc: "Перезарядка 10 лет. Доступно только католическим державам; в противном случае переключатель «Отслеживать» отключён."
 qol__cd_watchlist_general_i2_name: "Культурное принуждение"
 qol__cd_watchlist_general_i2_desc: "Перезарядка 10 лет. Доступно всем державам."
 qol__cd_watchlist_general_i3_name: "Установление религии"
 qol__cd_watchlist_general_i3_desc: "Перезарядка 10 лет. Доступно всем державам."
 qol__cd_watchlist_general_i4_name: "Приглашение поселенцев"
 qol__cd_watchlist_general_i4_desc: "Перезарядка 2 года. Доступно всем державам."
 qol__cd_watchlist_general_i5_name: "Принуждение к смене придворного языка"
 qol__cd_watchlist_general_i5_desc: "Перезарядка 10 лет. Доступно всем державам."
 qol__cd_watchlist_general_i6_name: "Запрос финансовой поддержки"
 qol__cd_watchlist_general_i6_desc: "Перезарядка 1 год. Доступно только во время войны, пока военный орден спонсирует вашу державу; в противном случае переключатель «Отслеживать» отключён."
 qol__cd_watchlist_general_i7_name: "Захватить старшинство"
 qol__cd_watchlist_general_i7_desc: "Перезарядка 25 лет. Доступно только в личной унии с установленным старшинством, где вы не являетесь старшим партнёром; в противном случае переключатель «Отслеживать» отключён."
 qol__cooldowns__cd_watchlist_hre_name: "@hre! Священная Римская империя"
 qol__cooldowns__cd_watchlist_hre_desc: "Действия с перезарядкой Священной Римской империи (имперские округа и поддержка на выборах). Отметьте одно, чтобы получить уведомление, когда его перезарядка завершится."
 qol__cd_watchlist_hre_name: "@hre! Священная Римская империя"
 qol__cd_watchlist_hre_desc: "Какие действия Священной Римской империи с перезарядкой показывают уведомление, когда снова становятся доступными."
 qol__cd_watchlist_hre_item_column_name: "Действие"
 qol__cd_watchlist_hre__enabled_name: "Отслеживать"
 qol__cd_watchlist_hre_i1_name: "Просьба о поддержке на выборах"
 qol__cd_watchlist_hre_i1_desc: "Перезарядка 2 года. Также покрывает «Просьбу к выборщику проголосовать за кандидата» - обе разделяют одну перезарядку. Доступно только членам Священной Римской империи; в противном случае переключатель «Отслеживать» отключён."
 qol__cd_watchlist_hre_i2_name: "Подать прошение рейхстагу"
 qol__cd_watchlist_hre_i2_desc: "Перезарядка 10 лет. Доступно только главам имперских округов; в противном случае переключатель «Отслеживать» отключён."
 qol__cd_watchlist_hre_i3_name: "Запросить привилегии для округа"
