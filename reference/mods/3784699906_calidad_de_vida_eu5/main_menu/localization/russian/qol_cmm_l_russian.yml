 qol__cooldowns__cd_watchlist_situational_name: "@mapmode! Ситуации"
 qol__cooldowns__cd_watchlist_situational_desc: "Действия с перезарядкой, которые существуют только во время активной ситуации (сейчас - Итальянские войны). Отметьте одно, чтобы получить уведомление, когда его перезарядка завершится."
 qol__cd_watchlist_situational_name: "@mapmode! Ситуации"
 qol__cd_watchlist_situational_desc: "Какие ситуационные действия с перезарядкой показывают уведомление, когда снова становятся доступными."
 qol__cd_watchlist_situational_item_column_name: "Действие"
 qol__cd_watchlist_situational__enabled_name: "Отслеживать"
 qol__cd_watchlist_situational_i1_name: "Нарушение итальянского суверенитета"
 qol__cd_watchlist_situational_i1_desc: "Перезарядка 1 год. Доступно только во время Итальянских войн лидеру лиги, находящемуся в состоянии войны; в противном случае переключатель «Отслеживать» отключён."
 qol__cd_watchlist_situational_i2_name: "Подкуп для вступления в лигу"
 qol__cd_watchlist_situational_i2_desc: "Перезарядка 5 лет. Доступно только во время Итальянских войн лидеру лиги, не находящемуся в состоянии войны; в противном случае переключатель «Отслеживать» отключён."
 qol__cooldowns__cd_watchlist_country_name: "@region! Специфические для державы"
 qol__cooldowns__cd_watchlist_country_desc: "Действия с перезарядкой для конкретной державы или региона (сейчас - Япония в период Сэнгоку и Китай во время Восстания красных повязок). Отметьте одно, чтобы получить уведомление, когда его перезарядка завершится."
 qol__cd_watchlist_country_name: "@region! Специфические для державы"
 qol__cd_watchlist_country_desc: "Какие специфические для державы действия с перезарядкой показывают уведомление, когда снова становятся доступными."
 qol__cd_watchlist_country_item_column_name: "Действие"
 qol__cd_watchlist_country__enabled_name: "Отслеживать"
 qol__cd_watchlist_country_i1_name: "Разведка вражеских владений"
 qol__cd_watchlist_country_i1_desc: "Перезарядка 1 год. Доступно только державам с японской культурой; в противном случае переключатель «Отслеживать» отключён."
 qol__cd_watchlist_country_i2_name: "Требование присоединения"
 qol__cd_watchlist_country_i2_desc: "Перезарядка 3 года. Доступно только Китаю, красным повязкам или державе, способной создать CB красных повязок во время активной ситуации; в противном случае переключатель «Отслеживать» отключён."
 qol__cooldowns__cd_watchlist_estate_name: "@crown_estate! Взаимодействие с сословиями"
 qol__cooldowns__cd_watchlist_estate_desc: "Действия с перезарядкой, доступные через взаимодействие с сословиями. Отметьте одно, чтобы получить уведомление, когда его перезарядка завершится."
 qol__cd_watchlist_estate_name: "@crown_estate! Взаимодействие с сословиями"
 qol__cd_watchlist_estate_desc: "Какие действия сословий с перезарядкой показывают уведомление, когда снова становятся доступными."
 qol__cd_watchlist_estate_item_column_name: "Действие"
 qol__cd_watchlist_estate__enabled_name: "Наблюдать"
 qol__cd_watchlist_estate_i1_name: "Запросить дополнительные отряды"
 qol__cd_watchlist_estate_i1_desc: "Перезарядка 5 лет. Предоставляет людские ресурсы за счет удовлетворения сословия."
 qol__cd_watchlist_estate_i2_name: "Взять чрезвычайные налоги"
 qol__cd_watchlist_estate_i2_desc: "Перезарядка 5 лет. Предоставляет специфические для сословия налоговые доходы за счет его удовлетворения."
 qol__cd_watchlist_estate_i3_name: "Запросить поддержку духовенства"
 qol__cd_watchlist_estate_i3_desc: "Перезарядка 5 лет. Предоставляет легитимность за счет удовлетворения духовенства. Требуется духовное сословие."
 qol__cd_watchlist_estate_i4_name: "Запросить дворянских послов"
 qol__cd_watchlist_estate_i4_desc: "Перезарядка 5 лет. Предоставляет 5 дипломатов за счет удовлетворения дворянства. Требуется дворянское сословие."
 qol__cd_watchlist_estate_i5_name: "Запросить экстренный грант"
 qol__cd_watchlist_estate_i5_desc: "Перезарядка 5 лет. Переводит золото от буржуазии за счет ее удовлетворения. Требуется буржуазное сословие."
 qol__cd_watchlist_estate_i6_name: "Умиротворить крестьян"
 qol__cd_watchlist_estate_i6_desc: "Перезарядка 5 лет. Предоставляет стабильность за счет удовлетворения крестьян или димми."
 qol__cd_watchlist_estate_i7_name: "Созвать племена под знамена"
 qol__cd_watchlist_estate_i7_desc: "Перезарядка 5 лет. Предоставляет людские ресурсы за счет удовлетворения племен или казаков."
 qol__cd_watchlist_estate_i8_name: "Созвать экстренный парламент"
 qol__cd_watchlist_estate_i8_desc: "Перезарядка 5 лет. Созывает чрезвычайное заседание парламента за счет легитимности. Требуется парламент и состояние войны."
