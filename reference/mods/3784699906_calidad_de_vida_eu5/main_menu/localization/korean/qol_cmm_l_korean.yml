 qol__cooldowns__cd_watchlist_country_name: "@region! 국가별"
 qol__cooldowns__cd_watchlist_country_desc: "특정 국가나 지역을 위한 재사용 대기 시간 행동(현재는 센고쿠 시대의 일본과 홍건적 난의 중국). 체크하면 해당 재사용 대기 시간이 끝날 때 알림을 받습니다."
 qol__cd_watchlist_country_name: "@region! 국가별"
 qol__cd_watchlist_country_desc: "다시 사용 가능해졌을 때 알림을 표시할 국가별 재사용 대기 시간 행동."
 qol__cd_watchlist_country_item_column_name: "행동"
 qol__cd_watchlist_country__enabled_name: "감시"
 qol__cd_watchlist_country_i1_name: "적대 영토 염탐"
 qol__cd_watchlist_country_i1_desc: "1년 재사용 대기 시간. 일본 문화 국가만 사용 가능하며, 그렇지 않으면 감시 토글이 비활성화됩니다."
 qol__cd_watchlist_country_i2_name: "합병 요구"
 qol__cd_watchlist_country_i2_desc: "3년 재사용 대기 시간. 상황이 진행되는 동안 중국, 홍건적 반군 또는 홍건적 CB를 만들 수 있는 국가만 사용 가능하며, 그렇지 않으면 감시 토글이 비활성화됩니다."
 qol__cooldowns__cd_watchlist_estate_name: "@crown_estate! 신분 상호작용"
 qol__cooldowns__cd_watchlist_estate_desc: "5년 재사용 대기 시간이 있는 신분 상호작용. 체크하면 해당 재사용 대기 시간이 끝날 때 알림을 받습니다."
 qol__cd_watchlist_estate_name: "@crown_estate! 신분 상호작용"
