 qol__fort_cleanup_buildings_castle_name: "@castle! 성"
 qol__fort_cleanup_buildings_bastion_name: "@bastion! 이탈리아식 성곽"
 qol__fort_cleanup_buildings_star_fort_name: "@star_fort! 바스티온"
 qol__fort_cleanup_buildings_fortress_name: "@fortress! 요새"
 qol__fort_cleanup_buildings_city_walls_name: "@city_walls! 도시 성벽"
 qol__fort_cleanup_buildings_coastal_fort_name: "@coastal_fort! 해안 요새"
 qol__fort_cleanup_buildings_naval_battery_name: "@naval_battery! 해군 포대"
 qol__qol__fort_build_forbidden_name: "@trigger_fail! 요새 건설 금지"
 qol__qol__fort_build_forbidden_desc: "자동화가 요새를 지을 수 없는 지역 유형을 선택하세요. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 금지된 지역 유형에서는 수동 건설도 차단됩니다. 둘 다 끄면 어디든 자유롭게 건설할 수 있습니다."
 qol__qol__fort_cleanup_name: "@arrow_down! 요새 철거"
 qol__qol__fort_cleanup_desc: "철거할 요새 유형, 위치 유형, 대상 국가를 선택하세요."
 qol__fort_build_forbidden_name: "@warning_icon! 요새 건설 금지"
 qol__fort_build_forbidden_desc: "자동화가 요새를 지을 수 없는 지역 유형: 농촌 정착지, 소읍, 도시, 거대 도시, 자국의 수도, 해안, 도(道)의 수도 또는 모든 지역. 정상 동작으로 되돌리려면 모두 해제하세요. 참고: Community Mod Framework (CMF)가 설치되어 있으면 이 설정은 해당 게임 규칙보다 우선합니다."
 qol__fort_build_forbidden_item_column_name: "지역 유형"
 qol__fort_build_forbidden__enabled_name: "금지"
 qol__fort_build_forbidden_i1_name: "@rural_settlement! 농촌 정착지"
 qol__fort_build_forbidden_i1_desc: "농촌 정착지 지역. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__fort_build_forbidden_i2_name: "@town! 소읍"
 qol__fort_build_forbidden_i2_desc: "소읍 지역. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__fort_build_forbidden_i3_name: "@city! 도시"
 qol__fort_build_forbidden_i3_desc: "도시 지역. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__fort_build_forbidden_i4_name: "@megalopolis! 거대 도시"
 qol__fort_build_forbidden_i4_desc: "거대 도시 지역. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__fort_build_forbidden_i5_name: "@city_capital! 자국의 수도"
 qol__fort_build_forbidden_i5_desc: "자국의 수도. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__fort_build_forbidden_i6_name: "@ship! 해안"
 qol__fort_build_forbidden_i6_desc: "해안 지역. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__fort_build_forbidden_i7_name: "@province! 도(道)의 수도"
 qol__fort_build_forbidden_i7_desc: "도(道)의 수도 지역. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__fort_build_forbidden_i8_name: "@mapmode! 모든 지역"
 qol__fort_build_forbidden_i8_desc: "모든 지역: 자동화는 어떤 요새도 짓지 않습니다. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__fort_build_forbidden_i9_name: "@location! 도의 수도가 아님"
 qol__fort_build_forbidden_i9_desc: "도의 수도가 아닌 지역. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__fort_build_forbidden_i10_name: "@inland! 내륙"
 qol__fort_build_forbidden_i10_desc: "해안이 아닌 내륙 지역. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 수동 건설도 차단됩니다."
 qol__papal_bulls_name: "@rite_power! 교황 칙서"
 qol__papal_bulls__auto_vote_name: "@catholic_church! 자동 투표"
 qol__papal_bulls__auto_vote_desc: "내 국가가 어떤 교황 칙서에 자동으로 투표할지와 그 방법을 설정합니다."
 qol__papal_bulls__auto_vote_schism_name: "@religious_influence_catholic! 서방 교회 대분열"
 qol__papal_bulls__auto_vote_schism_desc: "서방 교회 대분열 결의에서 내 국가가 자동으로 투표할 쪽: 로마 지지, 로마 반대 또는 비활성화."
 qol__auto_vote_name: "@religion! 교황 칙서 자동 투표"
 qol__auto_vote_desc: "각 교황 칙서에 대해 자동 투표 여부를 선택합니다: 찬성, 반대 또는 비활성화. 투표는 달이 바뀔 때 이루어집니다. 참고: Community Mod Framework (CMF)가 설치되어 있으면 이 설정은 해당 게임 규칙보다 우선합니다."
 qol__auto_vote_item_column_name: "칙서"
 qol__auto_vote_benedictus_deus_desc: "$MODIFIER_TYPE_NAME_global_pop_conversion_speed_modifier$ +33% 10년 동안 지속됩니다."
 qol__auto_vote_christiana_pietas_desc: "+2 $MODIFIER_TYPE_NAME_tolerance_heathen$ 10년 동안 지속됩니다."
 qol__auto_vote_in_coena_domini_desc: "$MODIFIER_TYPE_NAME_global_maritime_presence_modifier$ +25% 10년 동안 지속됩니다."
 qol__auto_vote_apostolicae_servitutis_desc: "$MODIFIER_TYPE_NAME_clergy_estate_target_satisfaction$ +0.1 10년 동안 지속됩니다."
 qol__auto_vote_immensa_aeterni_dei_desc: "$MODIFIER_TYPE_NAME_global_institution_growth_modifier$ +0.1 10년 동안 지속됩니다."
 qol__auto_vote_inter_gravissimas_desc: "$MODIFIER_TYPE_NAME_legislative_efficiency$ +0.2 10년 동안 지속됩니다."
 qol__auto_vote_libertas_ecclesiae_desc: "$MODIFIER_TYPE_NAME_imperial_authority_modifier$ +0.2 10년 동안 지속됩니다."
 qol__auto_vote_dei_gratia_rex_desc: "$MODIFIER_TYPE_NAME_global_estate_target_satisfaction$ +0.05 10년 동안 지속됩니다."
 qol__auto_vote_illius_qui_se_pro_divini_desc: "$MODIFIER_TYPE_NAME_antagonism_received_modifier$ -0.2 10년 동안 지속됩니다."
 qol__auto_vote_excommunicate_resolution_desc: "대상국의 군주를 파문합니다. 파문이 해제될 때까지 지속됩니다."
 qol__auto_vote_call_crusade_desc: "대상국에 대한 십자군을 소집합니다. 대상과의 전쟁이 끝날 때까지 지속됩니다. 10년마다 다시 소집할 수 있습니다."
 qol__auto_vote_western_schism_resolution_desc: "교황과 대립교황 사이의 서방 교회 대분열을 해결하기 위해 투표합니다. 분열이 해결될 때까지 지속됩니다."
 qol__auto_vote_schism_western_schism_resolution_name: "자동 지지"
 qol__auto_vote__vote_name: "자동 투표"
 qol__auto_vote__vote_option_1_name: "@trigger_fail! 비활성화"
