 qol__cd_watchlist_general_i6_desc: "1년 재사용 대기 시간. 군사 기사단이 우리나라를 후원하는 동안 전쟁 중에만 사용 가능하며, 그렇지 않으면 감시 토글이 비활성화됩니다."
 qol__cd_watchlist_general_i7_name: "주도권 차지"
 qol__cd_watchlist_general_i7_desc: "25년 재사용 대기 시간. 선배 지위가 확립되고 자신이 선배 파트너가 아닌 동군 연합에서만 사용 가능하며, 그렇지 않으면 감시 토글이 비활성화됩니다."
 qol__cooldowns__cd_watchlist_hre_name: "@hre! 신성 로마 제국"
 qol__cooldowns__cd_watchlist_hre_desc: "신성 로마 제국의 재사용 대기 시간 행동(제국 관구와 선거 지원). 체크하면 해당 재사용 대기 시간이 끝날 때 알림을 받습니다."
 qol__cd_watchlist_hre_name: "@hre! 신성 로마 제국"
 qol__cd_watchlist_hre_desc: "다시 사용 가능해졌을 때 알림을 표시할 신성 로마 제국의 재사용 대기 시간 행동."
