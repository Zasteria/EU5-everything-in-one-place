 qol__fort_cleanup_rank_option_6_name: "@location! 도의 수도가 아님"
 qol__fort_cleanup_now_name: "@building! 지금 요새 철거"
 qol__fort_cleanup_now_desc: "아래에서 선택한 요새 유형을 수도가 아닌 모든 지역에서 즉시 철거합니다."
 qol__fort_cleanup_now_text: "@death! 철거"
