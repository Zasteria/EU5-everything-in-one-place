 qol__auto_vote_schism__vote_option_1_name: "@trigger_fail! 비활성화"
 qol__auto_vote_schism__vote_option_2_name: "@rite_power! 로마 지지"
 qol__auto_vote_schism__vote_option_3_name: "@trigger_no! 로마 반대"
 qol__parliament_name: "@parliament! 의회"
 qol__parliament__auto_pause_name: "@time! 의회가 곧 종료됩니다"
 qol__parliament__reminder_name: "@hint! 의회 소집 가능"
 qol__parliament_auto_pause_name: "@time! 자동 일시정지"
 qol__parliament_auto_pause_desc: "의회 회기가 끝나갈 때 게임을 일시정지할 시점: 없음, 항상, 또는 안건이 부결될 예정일 때만. 참고: Community Mod Framework (CMF)가 설치되어 있으면 이 설정은 해당 게임 규칙보다 우선합니다."
 qol__parliament_auto_pause_option_1_name: "@trigger_fail! 비활성화"
 qol__parliament_auto_pause_option_2_name: "@time! 항상"
 qol__parliament_auto_pause_option_3_name: "@warning_icon! 부결 예정일 때만"
 qol__parliament_availability_reminder_name: "@hint! 소집 알림"
 qol__parliament_availability_reminder_desc: "새 의회 회기를 소집할 수 있을 때 이벤트를 표시하고 게임을 일시정지합니다. 참고: Community Mod Framework (CMF)가 설치되어 있으면 이 설정은 해당 게임 규칙보다 우선합니다."
 qol__parliament_availability_reminder_option_1_name: "@trigger_yes! 활성화"
 qol__parliament_availability_reminder_option_2_name: "@trigger_fail! 비활성화"
 qol__education_name: "@literacy! 교육"
 qol__education__auto_ce_name: "@heir! 자동 교육"
 qol__education__auto_ce_desc: "매월 적격한 모든 자녀에게 가장 높은 적성에 맞는 교육이 자동으로 지정됩니다. 참고: Community Mod Framework (CMF)가 설치되어 있으면 이 설정이 해당 게임 규칙보다 우선합니다."
 qol__auto_ce_educate_heirs_name: "@heir! 후계자 교육"
 qol__auto_ce_educate_heirs_desc: "매월 후계자에게 교육이 자동으로 지정됩니다. 끄면 후계자의 교육을 직접 선택할 수 있습니다."
 qol__auto_ce_educate_crown_name: "@crown_estate! 왕실 영지 자녀 교육"
 qol__auto_ce_educate_crown_desc: "매월 왕실 영지에 속한 자녀에게 교육이 자동으로 지정됩니다."
 qol__auto_ce_educate_prodigy_name: "@characters! 신동 및 영재 교육"
 qol__auto_ce_educate_prodigy_desc: "매월 신동 및 영재 자녀에게 교육이 자동으로 지정됩니다. 어떤 교육으로도 높은 수치에 도달합니다."
 qol__auto_ce_expensive_scope_name: "@gold! 비싼 교육"
 qol__auto_ce_expensive_scope_desc: "후계자 및/또는 왕실 영지 자녀에게 비싼 심화 교육을 자동으로 지정합니다."
 qol__auto_ce_expensive_scope_option_1_name: "@trigger_fail! 비활성화"
 qol__auto_ce_expensive_scope_option_2_name: "@heir! 후계자만"
 qol__auto_ce_expensive_scope_option_3_name: "@crown_estate! 후계자 및 왕실"
 qol__auto_ce_expensive_scope_option_4_name: "@characters! 모든 자녀"
 qol__auto_ce_run_now_name: "@literacy! 지금 다시 평가"
 qol__auto_ce_run_now_desc: "이미 처리된 자녀를 포함해 적격한 모든 자녀를 즉시 다시 처리합니다. 지정된 비싼 교육은 절대 변경하지 않습니다."
 qol__auto_ce_run_now_text: "@literacy! 다시 평가"
 qol__cooldowns_name: "@time! 재사용 대기 시간"
 qol__cooldowns__alerts_name: "@warning_icon! 알림"
 qol__cooldowns__alerts_desc: "감시 중인 재사용 대기 시간이 끝났음을 Calidad de vida EU5가 알려주는 방식. 감시 중인 재사용 대기 시간 행동이 다시 사용 가능해지면 상단 바에 알림이 표시됩니다."
 qol__cd_enable_alerts_name: "@warning_icon! 재사용 대기 시간 알림 활성화"
 qol__cd_enable_alerts_desc: "감시 중인 재사용 대기 시간이 다시 사용 가능해지면 CMF 알림을 표시합니다. 모든 재사용 대기 시간 알림을 끄려면 비활성화하세요."
 qol__cab_enable_alerts_name: "@cabinet_action! 내각 행동 알림 활성화"
 qol__cab_enable_alerts_desc: "국가 안정화 또는 정부 강화 내각 행동이 최대치에 도달하면 CMF 알림을 표시합니다. 행동은 최대치 유지 비용을 낮추기 위해 의도적으로 계속 실행됩니다 - 알림은 직접 취소할 수 있음을 알려줄 뿐입니다. 이 알림을 끄려면 비활성화하세요."
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! 기사단 재사용 대기 시간 감시"
 qol__cd_watch_order_of_chivalry_desc: "우리나라의 10년 기사단 재사용 대기 시간이 끝나면 알립니다. 외국 기사단 입단과 기사단 초빙이 이를 공유하므로 둘 중 하나를 사용하면 시작됩니다. 기본값은 켜짐."
 qol__cooldowns__cd_watchlist_general_name: "@country! 일반"
 qol__cooldowns__cd_watchlist_general_desc: "모든 국가가 사용할 수 있는 재사용 대기 시간 행동(종교나 관계 요구 사항이 적용되는 경우 제외). 체크하면 해당 재사용 대기 시간이 끝날 때 알림을 받습니다."
 qol__cd_watchlist_general_name: "@country! 일반"
 qol__cd_watchlist_general_desc: "다시 사용 가능해졌을 때 알림을 표시할 일반 재사용 대기 시간 행동."
 qol__cd_watchlist_general_item_column_name: "행동"
 qol__cd_watchlist_general__enabled_name: "감시"
