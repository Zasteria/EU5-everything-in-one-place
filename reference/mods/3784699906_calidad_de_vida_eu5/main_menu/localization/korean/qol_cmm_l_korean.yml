 qol__auto_vote__vote_option_3_name: "@trigger_no! 반대 투표"
 qol__auto_vote_schism_name: "@religious_influence_catholic! 서방 교회 대분열 투표"
 qol__auto_vote_schism_desc: "서방 교회 대분열 결의안에 대한 자동 투표: 비활성화, 로마 지지 또는 로마 반대. 투표는 달이 바뀔 때 이루어집니다."
