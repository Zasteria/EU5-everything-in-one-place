l_korean:
 qol_name: "@hint! 삶의 질 개선"
 qol_desc: "삶의 질 개선 모드: 자동화가 요새를 지을 수 있는 지역 유형을 선택하고, 원치 않는 요새를 즉시 철거할 수 있으며, 줌을 축소해도 진행 원이 계속 표시되고, 지도 국경선이 더 굵고 선명하게 표시됩니다. "건물" 또는 "건물 자동 확장" 자동화가 켜져 있으면 금지된 지역 유형에서는 수동 건설도 차단됩니다."
 qol__qol_name: "@fortress! 요새"
 qol__qol__forts_name: "@fortress! 요새"
 qol__qol__fort_cleanup_buildings_name: "@castle! 철거할 건물"
 qol__qol__fort_cleanup_buildings_desc: "철거 버튼이 제거할 요새의 유형입니다."
 qol__fort_cleanup_scope_name: "@country! 영향을 받는 국가"
 qol__fort_cleanup_scope_desc: "요새 정리가 영향을 미치는 국가: 내 국가만, 내 국가와 그 종속국(속국 및 파트너), 종속국만, 또는 전 세계."
 qol__fort_cleanup_scope_option_1_name: "@country! 내 국가만"
 qol__fort_cleanup_scope_option_2_name: "@subject! 내 국가와 종속국"
 qol__fort_cleanup_scope_option_3_name: "@subject! 종속국만"
 qol__fort_cleanup_scope_option_4_name: "@mapmode! 모든 국가"
 qol__fort_cleanup_rank_name: "@location! 지역 유형"
 qol__fort_cleanup_rank_desc: "정리할 지역의 유형: 농촌 정착지, 소읍, 도시, 거대 도시 또는 전체."
 qol__fort_cleanup_rank_option_1_name: "@location! 모든 지역"
