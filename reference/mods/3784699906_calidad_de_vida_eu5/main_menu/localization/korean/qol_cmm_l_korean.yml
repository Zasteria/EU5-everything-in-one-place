 qol__cd_watchlist_estate_item_column_name: "행동"
 qol__cd_watchlist_estate__enabled_name: "감시"
 qol__cd_watchlist_estate_i1_name: "추가 징집 요청"
 qol__cd_watchlist_estate_i1_desc: "5년 대기 시간. 신분 만족도를 희생하여 인력을 얻습니다."
 qol__cd_watchlist_estate_i2_name: "특별세 징수"
 qol__cd_watchlist_estate_i2_desc: "5년 대기 시간. 신분 만족도를 희생하여 신분별 세수를 얻습니다."
 qol__cd_watchlist_estate_i3_name: "성직자 지지 요청"
 qol__cd_watchlist_estate_i3_desc: "5년 대기 시간. 성직자 만족도를 희생하여 정통성을 얻습니다. 성직자 신분이 필요합니다."
 qol__cd_watchlist_estate_i4_name: "귀족 사절 요청"
 qol__cd_watchlist_estate_i4_desc: "5년 대기 시간. 귀족 만족도를 희생하여 외교관 5명을 얻습니다. 귀족 신분이 필요합니다."
 qol__cd_watchlist_estate_i5_name: "긴급 보조금 요청"
 qol__cd_watchlist_estate_i5_desc: "5년 대기 시간. 상인 만족도를 희생하여 상인 금고에서 자금을 이전합니다. 상인 신분이 필요합니다."
 qol__cd_watchlist_estate_i6_name: "농민 진정"
 qol__cd_watchlist_estate_i6_desc: "5년 대기 시간. 농민 또는 딤미 만족도를 희생하여 안정을 얻습니다."
 qol__cd_watchlist_estate_i7_name: "부족 무장 소집"
 qol__cd_watchlist_estate_i7_desc: "5년 대기 시간. 부족 또는 코사크 만족도를 희생하여 인력을 얻습니다."
 qol__cd_watchlist_estate_i8_name: "긴급 의회 소집"
 qol__cd_watchlist_estate_i8_desc: "5년 대기 시간. 정통성을 희생하여 긴급 의회를 소집합니다. 의회와 전쟁 상태가 필요합니다."
