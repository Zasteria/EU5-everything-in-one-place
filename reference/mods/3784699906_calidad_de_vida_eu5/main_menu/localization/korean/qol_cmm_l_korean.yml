 qol__cd_watchlist_situational_i1_desc: "1년 재사용 대기 시간. 이탈리아 전쟁 중 전쟁 상태인 연맹 지도자만 사용 가능하며, 그렇지 않으면 감시 토글이 비활성화됩니다."
 qol__cd_watchlist_situational_i2_name: "연맹 가입 매수"
