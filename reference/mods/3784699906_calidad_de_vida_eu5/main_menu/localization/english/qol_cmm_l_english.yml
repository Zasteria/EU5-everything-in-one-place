l_english:
 qol_name: "@hint! Calidad de vida QoL"
 qol_desc: "Quality of life improvements: you decide in which location types the automation may build fortifications, you can demolish unwanted fortifications on demand, progress circles stay visible when zoomed out, and map borders are thicker and more visible. With the Buildings or Auto-Expand Buildings automation on, a forbidden location type also blocks manual construction."
 qol__qol_name: "@fortress! Fortifications"
 qol__qol__forts_name: "@fortress! Fortifications"
 qol__qol__fort_cleanup_buildings_name: "@castle! Buildings to demolish"
 qol__qol__fort_cleanup_buildings_desc: "Which fortification types the demolish button removes."
 qol__fort_cleanup_scope_name: "@country! Countries affected"
 qol__fort_cleanup_scope_desc: "Which countries are affected by the fort cleanup: only your country, your country and its dependencies (subjects and junior partners), only the dependencies, or the whole world."
 qol__fort_cleanup_scope_option_1_name: "@country! My country only"
 qol__fort_cleanup_scope_option_2_name: "@subject! My country and dependencies"
 qol__fort_cleanup_scope_option_3_name: "@subject! Dependencies only"
 qol__fort_cleanup_scope_option_4_name: "@mapmode! All countries"
 qol__fort_cleanup_rank_name: "@location! Location type"
 qol__fort_cleanup_rank_desc: "Which location types are cleaned: rural settlements, towns, cities, metropolises or all."
 qol__fort_cleanup_rank_option_1_name: "@location! All locations"
 qol__fort_cleanup_rank_option_2_name: "@rural_settlement! Rural settlement"
 qol__fort_cleanup_rank_option_3_name: "@town! Town"
 qol__fort_cleanup_rank_option_4_name: "@city! City"
 qol__fort_cleanup_rank_option_5_name: "@megalopolis! Metropolis"
 qol__fort_cleanup_rank_option_6_name: "@location! Non province capitals"
 qol__fort_cleanup_now_name: "@building! Demolish forts now"
 qol__fort_cleanup_now_desc: "Instantly demolishes the fortification types selected below in every location except capitals."
 qol__fort_cleanup_now_text: "@death! Demolish"
 qol__fort_cleanup_buildings_name: "@castle! Buildings to demolish"
 qol__fort_cleanup_buildings_desc: "Which fortification types the demolish button removes."
 qol__fort_cleanup_buildings_item_column_name: "Building"
 qol__fort_cleanup_buildings__enabled_name: "Demolish"
 qol__fort_cleanup_buildings_stockade_name: "@stockade! Stockade"
 qol__fort_cleanup_buildings_castle_name: "@castle! Castle"
 qol__fort_cleanup_buildings_bastion_name: "@bastion! Bastion"
 qol__fort_cleanup_buildings_star_fort_name: "@star_fort! Star Fort"
 qol__fort_cleanup_buildings_fortress_name: "@fortress! Fortress"
 qol__fort_cleanup_buildings_city_walls_name: "@city_walls! City Walls"
 qol__fort_cleanup_buildings_coastal_fort_name: "@coastal_fort! Coastal Fort"
 qol__fort_cleanup_buildings_naval_battery_name: "@naval_battery! Naval Battery"
 qol__qol__fort_build_forbidden_name: "@trigger_fail! Prohibition of Fortifications"
 qol__qol__fort_build_forbidden_desc: "Choose in which location types the automation may not build fortifications. While the player has the Buildings or Auto-Expand Buildings automation on, a forbidden location type also blocks manual builds; with both off, you are free to build anywhere."
 qol__qol__fort_cleanup_name: "@arrow_down! Fortification Demolition"
 qol__qol__fort_cleanup_desc: "Which fortifications to demolish, in which location types, and for which countries."
 qol__fort_build_forbidden_name: "@warning_icon! Forbidden fort locations"
 qol__fort_build_forbidden_desc: "In which location types the automation may not build fortifications: rural settlements, towns, cities, metropolises, your capital, coasts, province capitals or every location. Leave everything unchecked for normal behavior. Note: if you have Community Mod Framework (CMF) installed, this setting takes precedence over the corresponding game rule."
 qol__fort_build_forbidden_item_column_name: "Location type"
 qol__fort_build_forbidden__enabled_name: "Forbidden"
 qol__fort_build_forbidden_i1_name: "@rural_settlement! Rural settlements"
 qol__fort_build_forbidden_i1_desc: "Rural settlement locations. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__fort_build_forbidden_i2_name: "@town! Towns"
 qol__fort_build_forbidden_i2_desc: "Town locations. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__fort_build_forbidden_i3_name: "@city! Cities"
 qol__fort_build_forbidden_i3_desc: "City locations. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__fort_build_forbidden_i4_name: "@megalopolis! Metropolises"
 qol__fort_build_forbidden_i4_desc: "Metropolis locations. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__fort_build_forbidden_i5_name: "@city_capital! Your capital"
 qol__fort_build_forbidden_i5_desc: "The capital of your country. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__fort_build_forbidden_i6_name: "@ship! Coasts"
 qol__fort_build_forbidden_i6_desc: "Coastal locations. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__fort_build_forbidden_i7_name: "@province! Province capitals"
 qol__fort_build_forbidden_i7_desc: "Province capital locations. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__fort_build_forbidden_i8_name: "@mapmode! Every location"
 qol__fort_build_forbidden_i8_desc: "Every location: the automation will not build any fortification. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__fort_build_forbidden_i9_name: "@location! Non province capitals"
 qol__fort_build_forbidden_i9_desc: "Locations that are not province capitals. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__fort_build_forbidden_i10_name: "@inland! Inland"
 qol__fort_build_forbidden_i10_desc: "Inland locations that are not on the coast. With the Buildings or Auto-Expand Buildings automation on, manual builds are blocked too."
 qol__papal_bulls_name: "@rite_power! Papal Bulls"
 qol__papal_bulls__auto_vote_name: "@catholic_church! Auto-vote"
 qol__papal_bulls__auto_vote_desc: "Which papal resolutions your country votes on automatically, and how."
 qol__papal_bulls__auto_vote_schism_name: "@religious_influence_catholic! Western Schism"
 qol__papal_bulls__auto_vote_schism_desc: "Which side your country votes for automatically in the Western Schism resolution: for Rome, against Rome, or disabled."
 qol__auto_vote_name: "@religion! Papal bull auto-vote"
 qol__auto_vote_desc: "Choose for each papal resolution whether to vote automatically: yes, no, or disabled. Votes are cast when the month changes. Note: if you have Community Mod Framework (CMF) installed, this setting takes precedence over the corresponding game rule."
 qol__auto_vote_item_column_name: "Bull"
 qol__auto_vote_benedictus_deus_desc: "$MODIFIER_TYPE_NAME_global_pop_conversion_speed_modifier$ +33% for 10 years."
 qol__auto_vote_christiana_pietas_desc: "+2 $MODIFIER_TYPE_NAME_tolerance_heathen$ for 10 years."
 qol__auto_vote_in_coena_domini_desc: "$MODIFIER_TYPE_NAME_global_maritime_presence_modifier$ +25% for 10 years."
 qol__auto_vote_apostolicae_servitutis_desc: "$MODIFIER_TYPE_NAME_clergy_estate_target_satisfaction$ +0.1 for 10 years."
 qol__auto_vote_immensa_aeterni_dei_desc: "$MODIFIER_TYPE_NAME_global_institution_growth_modifier$ +0.1 for 10 years."
 qol__auto_vote_inter_gravissimas_desc: "$MODIFIER_TYPE_NAME_legislative_efficiency$ +0.2 for 10 years."
 qol__auto_vote_libertas_ecclesiae_desc: "$MODIFIER_TYPE_NAME_imperial_authority_modifier$ +0.2 for 10 years."
 qol__auto_vote_dei_gratia_rex_desc: "$MODIFIER_TYPE_NAME_global_estate_target_satisfaction$ +0.05 for 10 years."
 qol__auto_vote_illius_qui_se_pro_divini_desc: "$MODIFIER_TYPE_NAME_antagonism_received_modifier$ -0.2 for 10 years."
 qol__auto_vote_excommunicate_resolution_desc: "Excommunicates the ruler of the target country. Lasts until the excommunication is lifted."
 qol__auto_vote_call_crusade_desc: "Calls a crusade against a target country. Lasts until the war with the target ends; it can be called again every 10 years."
 qol__auto_vote_western_schism_resolution_desc: "Votes to resolve the Western Schism between the Pope and the antipope. Lasts until the schism is resolved."
 qol__auto_vote_schism_western_schism_resolution_name: "Automatic support"
 qol__auto_vote__vote_name: "Auto-vote"
 qol__auto_vote__vote_option_1_name: "@trigger_fail! Disabled"
 qol__auto_vote__vote_option_2_name: "@trigger_yes! Vote yes"
 qol__auto_vote__vote_option_3_name: "@trigger_no! Vote no"
 qol__auto_vote_schism_name: "@religious_influence_catholic! Western Schism vote"
 qol__auto_vote_schism_desc: "Auto-vote on the Western Schism resolution: disabled, for Rome, or against Rome. The vote is cast when the month changes."
 qol__auto_vote_schism_item_column_name: "Bull"
 qol__auto_vote_schism__vote_name: "Vote"
 qol__auto_vote_schism__vote_option_1_name: "@trigger_fail! Disabled"
 qol__auto_vote_schism__vote_option_2_name: "@rite_power! For Rome"
 qol__auto_vote_schism__vote_option_3_name: "@trigger_no! Against Rome"
 qol__parliament_name: "@parliament! Parliament"
 qol__parliament__auto_pause_name: "@time! Parliament is about to end"
 qol__parliament__reminder_name: "@hint! Parliament available"
 qol__parliament_auto_pause_name: "@time! Auto-pause"
 qol__parliament_auto_pause_desc: "When to pause the game near the end of a Parliament session: never, always, or only if the issue is about to fail. Note: if you have Community Mod Framework (CMF) installed, this setting takes precedence over the corresponding game rule."
 qol__parliament_auto_pause_option_1_name: "@trigger_fail! Disabled"
 qol__parliament_auto_pause_option_2_name: "@time! Pause always"
 qol__parliament_auto_pause_option_3_name: "@warning_icon! Only if it will fail"
 qol__parliament_availability_reminder_name: "@hint! Availability reminder"
 qol__parliament_availability_reminder_desc: "Shows a popup (and pauses the game) when a new Parliament session can be called. Note: if you have Community Mod Framework (CMF) installed, this setting takes precedence over the corresponding game rule."
 qol__parliament_availability_reminder_option_1_name: "@trigger_yes! Enabled"
 qol__parliament_availability_reminder_option_2_name: "@trigger_fail! Disabled"
 qol__education_name: "@literacy! Education"
 qol__education__auto_ce_name: "@heir! Automatic education"
 qol__education__auto_ce_desc: "Every month each eligible child is automatically assigned the education matching its highest aptitude. Note: if you have Community Mod Framework (CMF) installed, these settings take precedence over the corresponding game rule."
 qol__auto_ce_educate_heirs_name: "@heir! Educate heirs"
 qol__auto_ce_educate_heirs_desc: "Assigns an education to heirs automatically each month. Disable to choose their education manually."
 qol__auto_ce_educate_crown_name: "@crown_estate! Educate crown estate children"
 qol__auto_ce_educate_crown_desc: "Assigns an education to children in the crown estate automatically each month."
 qol__auto_ce_educate_prodigy_name: "@characters! Educate prodigies and gifted"
 qol__auto_ce_educate_prodigy_desc: "Assigns an education to prodigy and gifted children automatically each month. They reach high values with any education."
 qol__auto_ce_expensive_scope_name: "@gold! Expensive education"
 qol__auto_ce_expensive_scope_desc: "Automatically assigns expensive in-depth education to heirs and/or crown estate children."
 qol__auto_ce_expensive_scope_option_1_name: "@trigger_fail! Disabled"
 qol__auto_ce_expensive_scope_option_2_name: "@heir! Heirs only"
 qol__auto_ce_expensive_scope_option_3_name: "@crown_estate! Heirs and crown"
 qol__auto_ce_expensive_scope_option_4_name: "@characters! All children"
 qol__auto_ce_run_now_name: "@literacy! Re-evaluate now"
 qol__auto_ce_run_now_desc: "Immediately re-processes all eligible children, including already processed ones. Never changes an expensive education that was already assigned."
 qol__auto_ce_run_now_text: "@literacy! Re-evaluate"
 qol__cooldowns_name: "@time! Cooldowns"
 qol__cooldowns__alerts_name: "@warning_icon! Alerts"
 qol__cooldowns__alerts_desc: "How Calidad de vida EU5 tells you a watched cooldown is over. A top-bar alert is raised when a watched cooldown-gated action becomes available again."
 qol__cd_enable_alerts_name: "@warning_icon! Enable Cooldown Alerts"
 qol__cd_enable_alerts_desc: "Raise a CMF alert when a watched cooldown becomes available again. Turn off to silence all cooldown alerts."
 qol__cab_enable_alerts_name: "@cabinet_action! Enable Cabinet Action Alerts"
 qol__cab_enable_alerts_desc: "Raise a CMF alert when the Stabilize Country or Strengthen Government cabinet action reaches its maximum value. The action stays active on purpose to reduce the upkeep cost at max - the alert just reminds you it can be cancelled manually. Turn off to silence these alerts."
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! Watch Order of Chivalry cooldown"
 qol__cd_watch_order_of_chivalry_desc: "Alert when your country's 10-year Order of Chivalry cooldown clears - it is shared by Join Foreign Order of Chivalry and Invite to Order of Chivalry, so using either starts it. On by default."
 qol__cooldowns__cd_watchlist_general_name: "@country! General"
 qol__cooldowns__cd_watchlist_general_desc: "Cooldown-gated actions every country can use (unless a religion or relation requirement applies). Tick one to be alerted when its cooldown ends."
 qol__cd_watchlist_general_name: "@country! General"
 qol__cd_watchlist_general_desc: "Which general cooldown-gated actions raise an alert when they become available again."
 qol__cd_watchlist_general_item_column_name: "Action"
 qol__cd_watchlist_general__enabled_name: "Watch"
 qol__cd_watchlist_general_i1_name: "Request Divorce"
 qol__cd_watchlist_general_i1_desc: "10-year cooldown. Only available to Catholic countries - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_general_i2_name: "Enforce Culture"
 qol__cd_watchlist_general_i2_desc: "10-year cooldown. Available to all countries."
 qol__cd_watchlist_general_i3_name: "Enforce Religion"
 qol__cd_watchlist_general_i3_desc: "10-year cooldown. Available to all countries."
 qol__cd_watchlist_general_i4_name: "Invite Settlers"
 qol__cd_watchlist_general_i4_desc: "2-year cooldown. Available to all countries."
 qol__cd_watchlist_general_i5_name: "Force to Change Court Language"
 qol__cd_watchlist_general_i5_desc: "10-year cooldown. Available to all countries."
 qol__cd_watchlist_general_i6_name: "Request Funds"
 qol__cd_watchlist_general_i6_desc: "1-year cooldown. Only available at war while a military order sponsors your country - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_general_i7_name: "Take over Seniority"
 qol__cd_watchlist_general_i7_desc: "25-year cooldown. Only available in a personal union that has established seniority and where you are not the senior partner - otherwise the Watch toggle is disabled."
 qol__cooldowns__cd_watchlist_hre_name: "@hre! Holy Roman Empire"
 qol__cooldowns__cd_watchlist_hre_desc: "Holy Roman Empire cooldown-gated actions (imperial circles and election support). Tick one to be alerted when its cooldown ends."
 qol__cd_watchlist_hre_name: "@hre! Holy Roman Empire"
 qol__cd_watchlist_hre_desc: "Which Holy Roman Empire cooldown-gated actions raise an alert when they become available again."
 qol__cd_watchlist_hre_item_column_name: "Action"
 qol__cd_watchlist_hre__enabled_name: "Watch"
 qol__cd_watchlist_hre_i1_name: "Ask for Election Support"
 qol__cd_watchlist_hre_i1_desc: "2-year cooldown. Also covers Ask Elector to Vote for Candidate - both share a single cooldown. Only available to members of the Holy Roman Empire - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_hre_i2_name: "Petition the Imperial Diet"
 qol__cd_watchlist_hre_i2_desc: "10-year cooldown. Only available to imperial circle leaders - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_hre_i3_name: "Request Circle Privilege"
 qol__cd_watchlist_hre_i3_desc: "5-year cooldown. Only available to imperial circle leaders - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_hre_i4_name: "Challenge Circle Leadership"
 qol__cd_watchlist_hre_i4_desc: "5-year cooldown. Only available to Holy Roman Empire members that are neither emperor nor a circle leader - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_hre_i5_name: "Request Financial Grant from Circle Diet"
 qol__cd_watchlist_hre_i5_desc: "10-year cooldown. Only available to Holy Roman Empire members that are neither emperor nor a circle leader - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_hre_i6_name: "Request Military Infrastructure Expansion"
 qol__cd_watchlist_hre_i6_desc: "10-year cooldown. Only available to Holy Roman Empire members that are neither emperor nor a circle leader - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_hre_i7_name: "Elevate Country in Circle"
 qol__cd_watchlist_hre_i7_desc: "10-year cooldown. Only available to Holy Roman Empire members that are neither emperor nor a circle leader - otherwise the Watch toggle is disabled."
 qol__cooldowns__cd_watchlist_situational_name: "@mapmode! Situations"
 qol__cooldowns__cd_watchlist_situational_desc: "Cooldown-gated actions that only exist while a situation runs (currently the Italian Wars). Tick one to be alerted when its cooldown ends."
 qol__cd_watchlist_situational_name: "@mapmode! Situations"
 qol__cd_watchlist_situational_desc: "Which situational cooldown-gated actions raise an alert when they become available again."
 qol__cd_watchlist_situational_item_column_name: "Action"
 qol__cd_watchlist_situational__enabled_name: "Watch"
 qol__cd_watchlist_situational_i1_name: "Violate Italian Sovereignty"
 qol__cd_watchlist_situational_i1_desc: "1-year cooldown. Only available during the Italian Wars to a league leader at war - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_situational_i2_name: "Bribe into League"
 qol__cd_watchlist_situational_i2_desc: "5-year cooldown. Only available during the Italian Wars to a league leader not at war - otherwise the Watch toggle is disabled."
 qol__cooldowns__cd_watchlist_country_name: "@region! Country-specific"
 qol__cooldowns__cd_watchlist_country_desc: "Cooldown-gated actions for a specific country or region (currently Japan during the Sengoku period and China during the Red Turban Rebellions). Tick one to be alerted when its cooldown ends."
 qol__cd_watchlist_country_name: "@region! Country-specific"
 qol__cd_watchlist_country_desc: "Which country-specific cooldown-gated actions raise an alert when they become available again."
 qol__cd_watchlist_country_item_column_name: "Action"
 qol__cd_watchlist_country__enabled_name: "Watch"
 qol__cd_watchlist_country_i1_name: "Scout Enemy Holdings"
 qol__cd_watchlist_country_i1_desc: "1-year cooldown. Only available to countries with Japanese culture - otherwise the Watch toggle is disabled."
 qol__cd_watchlist_country_i2_name: "Demand Annexation"
 qol__cd_watchlist_country_i2_desc: "3-year cooldown. Only available to China, the Red Turban rebels, or a country able to create the Red Turban CB while the situation runs - otherwise the Watch toggle is disabled."
 qol__cooldowns__cd_watchlist_estate_name: "@crown_estate! Estate Interactions"
 qol__cooldowns__cd_watchlist_estate_desc: "Estate emergency interaction cooldowns (5-year cooldown each). These actions grant resources, legitimacy, stability or manpower at the cost of estate satisfaction. Tick one to be alerted when its cooldown ends."
 qol__cd_watchlist_estate_name: "@crown_estate! Estate Interactions"
 qol__cd_watchlist_estate_desc: "Which estate emergency interaction cooldowns raise an alert when they become available again."
 qol__cd_watchlist_estate_item_column_name: "Action"
 qol__cd_watchlist_estate__enabled_name: "Watch"
 qol__cd_watchlist_estate_i1_name: "Ask for Extra Levies"
 qol__cd_watchlist_estate_i1_desc: "5-year cooldown. Grants manpower at the cost of estate satisfaction."
 qol__cd_watchlist_estate_i2_name: "Levy Extraordinary Taxes"
 qol__cd_watchlist_estate_i2_desc: "5-year cooldown. Grants estate-specific tax income at the cost of estate satisfaction."
 qol__cd_watchlist_estate_i3_name: "Request Clerical Endorsement"
 qol__cd_watchlist_estate_i3_desc: "5-year cooldown. Grants legitimacy at the cost of clergy satisfaction. Requires the clergy estate."
 qol__cd_watchlist_estate_i4_name: "Request Noble Envoys"
 qol__cd_watchlist_estate_i4_desc: "5-year cooldown. Grants 5 diplomats at the cost of noble satisfaction. Requires the nobles estate."
 qol__cd_watchlist_estate_i5_name: "Request Emergency Grant"
 qol__cd_watchlist_estate_i5_desc: "5-year cooldown. Transfers gold from the burghers at the cost of burgher satisfaction. Requires the burghers estate."
 qol__cd_watchlist_estate_i6_name: "Appeal to the Commoners"
 qol__cd_watchlist_estate_i6_desc: "5-year cooldown. Grants stability at the cost of peasant or dhimmi satisfaction."
 qol__cd_watchlist_estate_i7_name: "Call the Tribes to Arms"
 qol__cd_watchlist_estate_i7_desc: "5-year cooldown. Grants manpower at the cost of tribal or cossack satisfaction."
 qol__cd_watchlist_estate_i8_name: "Call Emergency Parliament"
 qol__cd_watchlist_estate_i8_desc: "5-year cooldown. Calls a snap parliament session at the cost of legitimacy. Requires parliament and being at war."
