l_french:
 qol_name: "@hint! Qualité de vie QoL"
 qol_desc: "Améliorations de qualité de vie : choisissez dans quels types de localités l'automatisation peut construire des fortifications, vous pouvez démolir les fortifications indésirables à la demande, les cercles de progression restent visibles lorsqu'on dézoome et les frontières de la carte sont plus épaisses et plus visibles. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, un type de localité interdit bloque aussi la construction manuelle."
 qol__qol_name: "@fortress! Fortifications"
 qol__qol__forts_name: "@fortress! Fortifications"
 qol__qol__fort_cleanup_buildings_name: "@castle! Bâtiments à démolir"
 qol__qol__fort_cleanup_buildings_desc: "Les types de fortification que le bouton de démolition supprime."
 qol__fort_cleanup_scope_name: "@country! Pays concernés"
 qol__fort_cleanup_scope_desc: "Quels pays sont affectés par le nettoyage des fortifications : uniquement votre pays, votre pays et ses dépendances (sujets et partenaires juniors), uniquement les dépendances, ou le monde entier."
 qol__fort_cleanup_scope_option_1_name: "@country! Mon pays uniquement"
 qol__fort_cleanup_scope_option_2_name: "@subject! Mon pays et ses dépendances"
 qol__fort_cleanup_scope_option_3_name: "@subject! Dépendances uniquement"
 qol__fort_cleanup_scope_option_4_name: "@mapmode! Tous les pays"
 qol__fort_cleanup_rank_name: "@location! Type de lieu"
 qol__fort_cleanup_rank_desc: "Quels types de lieux sont nettoyés : établissements ruraux, bourgs, villes, mégalopoles ou tous."
 qol__fort_cleanup_rank_option_1_name: "@location! Tous les lieux"
 qol__fort_cleanup_rank_option_2_name: "@rural_settlement! Établissement rural"
 qol__fort_cleanup_rank_option_3_name: "@town! Bourg"
 qol__fort_cleanup_rank_option_4_name: "@city! Ville"
 qol__fort_cleanup_rank_option_5_name: "@megalopolis! Mégalopole"
 qol__fort_cleanup_rank_option_6_name: "@location! Hors capitales de province"
 qol__fort_cleanup_now_name: "@building! Démolir les forts maintenant"
 qol__fort_cleanup_now_desc: "Détruit instantanément les types de fortification sélectionnés ci-dessous dans tous les lieux, sauf les capitales."
 qol__fort_cleanup_now_text: "@death! Démolir"
 qol__fort_cleanup_buildings_name: "@castle! Bâtiments à démolir"
 qol__fort_cleanup_buildings_desc: "Les types de fortification que le bouton de démolition supprime."
 qol__fort_cleanup_buildings_item_column_name: "Bâtiment"
 qol__fort_cleanup_buildings__enabled_name: "Démolir"
 qol__fort_cleanup_buildings_stockade_name: "@stockade! Palissade"
 qol__fort_cleanup_buildings_castle_name: "@castle! Château"
 qol__fort_cleanup_buildings_bastion_name: "@bastion! Trace italienne"
 qol__fort_cleanup_buildings_star_fort_name: "@star_fort! Bastion"
 qol__fort_cleanup_buildings_fortress_name: "@fortress! Forteresse"
 qol__fort_cleanup_buildings_city_walls_name: "@city_walls! Remparts de la ville"
 qol__fort_cleanup_buildings_coastal_fort_name: "@coastal_fort! Fort côtier"
 qol__fort_cleanup_buildings_naval_battery_name: "@naval_battery! Batterie navale"
 qol__qol__fort_build_forbidden_name: "@trigger_fail! Interdiction de construire des fortifications"
 qol__qol__fort_build_forbidden_desc: "Choisissez dans quels types de localités l'automatisation ne peut pas construire de fortifications. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, un type de localité interdit bloque aussi la construction manuelle ; avec les deux désactivées, vous êtes libre de construire où vous voulez."
 qol__qol__fort_cleanup_name: "@arrow_down! Démolition des fortifications"
 qol__qol__fort_cleanup_desc: "Quelles fortifications démolir, dans quels types de localités et pour quels pays."
 qol__fort_build_forbidden_name: "@warning_icon! Interdire les fortifications"
 qol__fort_build_forbidden_desc: "Dans quels types de localités l'automatisation ne doit pas construire de fortifications : établissements ruraux, bourgs, villes, mégapoles, votre capitale, les côtes, les capitales de province ou toutes. Laissez tout décoché pour un comportement normal. Remarque : si vous avez installé Community Mod Framework (CMF), ce réglage a priorité sur la règle de partie correspondante."
 qol__fort_build_forbidden_item_column_name: "Type de localité"
 qol__fort_build_forbidden__enabled_name: "Interdit"
 qol__fort_build_forbidden_i1_name: "@rural_settlement! Établissement rural"
 qol__fort_build_forbidden_i1_desc: "Localités d'établissement rural. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__fort_build_forbidden_i2_name: "@town! Bourg"
 qol__fort_build_forbidden_i2_desc: "Localités de bourg. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__fort_build_forbidden_i3_name: "@city! Ville"
 qol__fort_build_forbidden_i3_desc: "Localités de ville. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__fort_build_forbidden_i4_name: "@megalopolis! Mégapole"
 qol__fort_build_forbidden_i4_desc: "Localités de mégapole. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__fort_build_forbidden_i5_name: "@city_capital! Votre capitale"
 qol__fort_build_forbidden_i5_desc: "La capitale de votre pays. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__fort_build_forbidden_i6_name: "@ship! Côtes"
 qol__fort_build_forbidden_i6_desc: "Localités côtières. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__fort_build_forbidden_i7_name: "@province! Capitales de province"
 qol__fort_build_forbidden_i7_desc: "Capitales de province. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__fort_build_forbidden_i8_name: "@mapmode! Toutes les localités"
 qol__fort_build_forbidden_i8_desc: "Toute localité : l'automatisation ne construira aucune fortification. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__fort_build_forbidden_i9_name: "@location! Hors capitales de province"
 qol__fort_build_forbidden_i9_desc: "Localités qui ne sont pas des capitales de province. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__fort_build_forbidden_i10_name: "@inland! Intérieur"
 qol__fort_build_forbidden_i10_desc: "Localités intérieures qui ne sont pas côtières. Avec l'automatisation des Bâtiments ou de « Développer automatiquement les bâtiments » activée, la construction manuelle est aussi bloquée."
 qol__papal_bulls_name: "@rite_power! Bulles pontificales"
 qol__papal_bulls__auto_vote_name: "@catholic_church! Vote automatique"
 qol__papal_bulls__auto_vote_desc: "Sur quelles bulles pontificales votre pays vote automatiquement, et de quelle manière."
 qol__papal_bulls__auto_vote_schism_name: "@religious_influence_catholic! Grand schisme d'Occident"
 qol__papal_bulls__auto_vote_schism_desc: "Pour quel camp votre pays vote automatiquement dans la résolution du Grand schisme d'Occident : pour Rome, contre Rome ou désactivé."
 qol__auto_vote_name: "@religion! Vote automatique des bulles pontificales"
 qol__auto_vote_desc: "Choisissez pour chaque bulle pontificale si le vote est automatique : pour, contre ou désactivé. Les votes sont émis au changement de mois. Remarque : si vous avez installé Community Mod Framework (CMF), ce réglage a priorité sur la règle de jeu correspondante."
 qol__auto_vote_item_column_name: "Bulle"
 qol__auto_vote_benedictus_deus_desc: "$MODIFIER_TYPE_NAME_global_pop_conversion_speed_modifier$ +33% pendant 10 ans."
 qol__auto_vote_christiana_pietas_desc: "+2 $MODIFIER_TYPE_NAME_tolerance_heathen$ pendant 10 ans."
 qol__auto_vote_in_coena_domini_desc: "$MODIFIER_TYPE_NAME_global_maritime_presence_modifier$ +25% pendant 10 ans."
 qol__auto_vote_apostolicae_servitutis_desc: "$MODIFIER_TYPE_NAME_clergy_estate_target_satisfaction$ +0.1 pendant 10 ans."
 qol__auto_vote_immensa_aeterni_dei_desc: "$MODIFIER_TYPE_NAME_global_institution_growth_modifier$ +0.1 pendant 10 ans."
 qol__auto_vote_inter_gravissimas_desc: "$MODIFIER_TYPE_NAME_legislative_efficiency$ +0.2 pendant 10 ans."
 qol__auto_vote_libertas_ecclesiae_desc: "$MODIFIER_TYPE_NAME_imperial_authority_modifier$ +0.2 pendant 10 ans."
 qol__auto_vote_dei_gratia_rex_desc: "$MODIFIER_TYPE_NAME_global_estate_target_satisfaction$ +0.05 pendant 10 ans."
 qol__auto_vote_illius_qui_se_pro_divini_desc: "$MODIFIER_TYPE_NAME_antagonism_received_modifier$ -0.2 pendant 10 ans."
 qol__auto_vote_excommunicate_resolution_desc: "Excommunie le souverain du pays cible. Dure jusqu'à la levée de l'excommunication."
 qol__auto_vote_call_crusade_desc: "Lance une croisade contre un pays cible. Dure jusqu'à la fin de la guerre avec la cible ; elle peut être relancée tous les 10 ans."
 qol__auto_vote_western_schism_resolution_desc: "Vote pour résoudre le Grand schisme entre le Pape et l'antipape. Dure jusqu'à la résolution du schisme."
 qol__auto_vote_schism_western_schism_resolution_name: "Soutien automatique"
 qol__auto_vote__vote_name: "Vote automatique"
 qol__auto_vote__vote_option_1_name: "@trigger_fail! Désactivé"
 qol__auto_vote__vote_option_2_name: "@trigger_yes! Voter pour"
 qol__auto_vote__vote_option_3_name: "@trigger_no! Voter contre"
 qol__auto_vote_schism_name: "@religious_influence_catholic! Vote du Grand schisme"
 qol__auto_vote_schism_desc: "Vote automatique sur la résolution du Grand schisme : désactivé, pour Rome ou contre Rome. Le vote est émis au changement de mois."
 qol__auto_vote_schism_item_column_name: "Bulle"
 qol__auto_vote_schism__vote_name: "Vote"
 qol__auto_vote_schism__vote_option_1_name: "@trigger_fail! Désactivé"
 qol__auto_vote_schism__vote_option_2_name: "@rite_power! Pour Rome"
 qol__auto_vote_schism__vote_option_3_name: "@trigger_no! Contre Rome"
 qol__parliament_name: "@parliament! Parlement"
 qol__parliament__auto_pause_name: "@time! Le Parlement va se terminer"
 qol__parliament__reminder_name: "@hint! Parlement disponible"
 qol__parliament_auto_pause_name: "@time! Pause automatique"
 qol__parliament_auto_pause_desc: "Quand mettre le jeu en pause vers la fin d'une session parlementaire : jamais, toujours, ou seulement si la question est sur le point d'échouer. Remarque : si vous avez installé Community Mod Framework (CMF), ce réglage a priorité sur la règle de partie correspondante."
 qol__parliament_auto_pause_option_1_name: "@trigger_fail! Désactivé"
 qol__parliament_auto_pause_option_2_name: "@time! Toujours"
 qol__parliament_auto_pause_option_3_name: "@warning_icon! Seulement en cas d'échec"
 qol__parliament_availability_reminder_name: "@hint! Rappel de convocation"
 qol__parliament_availability_reminder_desc: "Affiche un événement (et met le jeu en pause) lorsqu'une nouvelle session du Parlement peut être convoquée. Remarque : si vous avez installé Community Mod Framework (CMF), ce réglage a priorité sur la règle de partie correspondante."
 qol__parliament_availability_reminder_option_1_name: "@trigger_yes! Activé"
 qol__parliament_availability_reminder_option_2_name: "@trigger_fail! Désactivé"
 qol__education_name: "@literacy! Éducation"
 qol__education__auto_ce_name: "@heir! Éducation automatique"
 qol__education__auto_ce_desc: "Chaque mois, chaque enfant éligible reçoit automatiquement l'éducation correspondant le mieux à ses aptitudes. Remarque : si vous avez installé Community Mod Framework (CMF), ces paramètres priment sur la règle de jeu correspondante."
 qol__auto_ce_educate_heirs_name: "@heir! Éduquer les héritiers"
 qol__auto_ce_educate_heirs_desc: "Attribue chaque mois automatiquement une éducation aux héritiers. Désactivez pour choisir leur éducation manuellement."
 qol__auto_ce_educate_crown_name: "@crown_estate! Éduquer les enfants de la Couronne"
 qol__auto_ce_educate_crown_desc: "Attribue chaque mois automatiquement une éducation aux enfants du domaine de la Couronne."
 qol__auto_ce_educate_prodigy_name: "@characters! Éduquer les prodiges et surdoués"
 qol__auto_ce_educate_prodigy_desc: "Attribue chaque mois automatiquement une éducation aux enfants prodiges et surdoués. Ils atteignent de bons niveaux avec n'importe quelle éducation."
 qol__auto_ce_expensive_scope_name: "@gold! Éducation coûteuse"
 qol__auto_ce_expensive_scope_desc: "Attribue automatiquement l'éducation approfondie coûteuse aux héritiers et/ou aux enfants de la Couronne."
 qol__auto_ce_expensive_scope_option_1_name: "@trigger_fail! Désactivé"
 qol__auto_ce_expensive_scope_option_2_name: "@heir! Héritiers uniquement"
 qol__auto_ce_expensive_scope_option_3_name: "@crown_estate! Héritiers et Couronne"
 qol__auto_ce_expensive_scope_option_4_name: "@characters! Tous les enfants"
 qol__auto_ce_run_now_name: "@literacy! Réévaluer maintenant"
 qol__auto_ce_run_now_desc: "Retraite immédiatement tous les enfants éligibles, y compris ceux déjà traités. Ne modifie jamais une éducation coûteuse déjà attribuée."
 qol__auto_ce_run_now_text: "@literacy! Réévaluer"
 qol__cooldowns_name: "@time! Rechargements"
 qol__cooldowns__alerts_name: "@warning_icon! Alertes"
 qol__cooldowns__alerts_desc: "Comment Calidad de vida EU5 vous informe qu'un rechargement surveillé est terminé. Une alerte dans la barre supérieure est affichée lorsqu'une action soumise à un rechargement surveillé redevient disponible."
 qol__cd_enable_alerts_name: "@warning_icon! Activer les alertes de rechargement"
 qol__cd_enable_alerts_desc: "Affiche une alerte CMF lorsqu'un rechargement surveillé redevient disponible. Désactivez pour silencer toutes les alertes de rechargement."
 qol__cab_enable_alerts_name: "@cabinet_action! Activer les alertes de tâche de cabinet"
 qol__cab_enable_alerts_desc: "Affiche une alerte CMF lorsque la tâche Stabiliser le Pays ou Renforcer le Gouvernement atteint sa valeur maximale. La tâche reste volontairement active pour réduire le coût d'entretien au maximum - l'alerte rappelle juste qu'elle peut être annulée manuellement. Désactivez pour silencer ces alertes."
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! Surveiller le rechargement de l'Ordre de chevalerie"
 qol__cd_watch_order_of_chivalry_desc: "Alerte lorsque le rechargement de 10 ans de l'Ordre de chevalerie de votre pays se termine - il est partagé par Rejoindre un Ordre de chevalerie étranger et Inviter à rejoindre l'Ordre de chevalerie, donc utiliser l'un des deux le lance. Activé par défaut."
 qol__cooldowns__cd_watchlist_general_name: "@country! Générales"
 qol__cooldowns__cd_watchlist_general_desc: "Actions soumises à un rechargement que tout pays peut utiliser (sauf exigence de religion ou de relation). Cochez-en une pour être alerté lorsque son rechargement se termine."
 qol__cd_watchlist_general_name: "@country! Générales"
 qol__cd_watchlist_general_desc: "Quelles actions générales soumises à un rechargement affichent une alerte lorsqu'elles redeviennent disponibles."
 qol__cd_watchlist_general_item_column_name: "Action"
 qol__cd_watchlist_general__enabled_name: "Surveiller"
 qol__cd_watchlist_general_i1_name: "Demander le divorce"
 qol__cd_watchlist_general_i1_desc: "Rechargement de 10 ans. Disponible uniquement pour les pays catholiques ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_general_i2_name: "Imposer la Culture"
 qol__cd_watchlist_general_i2_desc: "Rechargement de 10 ans. Disponible pour tous les pays."
 qol__cd_watchlist_general_i3_name: "Imposer la religion"
 qol__cd_watchlist_general_i3_desc: "Rechargement de 10 ans. Disponible pour tous les pays."
 qol__cd_watchlist_general_i4_name: "Inviter des colons"
 qol__cd_watchlist_general_i4_desc: "Rechargement de 2 ans. Disponible pour tous les pays."
 qol__cd_watchlist_general_i5_name: "Forcer à changer la langue de la cour"
 qol__cd_watchlist_general_i5_desc: "Rechargement de 10 ans. Disponible pour tous les pays."
 qol__cd_watchlist_general_i6_name: "Demander des fonds"
 qol__cd_watchlist_general_i6_desc: "Rechargement de 1 an. Disponible uniquement en guerre pendant qu'un ordre militaire parraine votre pays ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_general_i7_name: "Reprendre l'Ancienneté"
 qol__cd_watchlist_general_i7_desc: "Rechargement de 25 ans. Disponible uniquement dans une union personnelle ayant établi l'ancienneté et dans laquelle vous n'êtes pas le partenaire senior ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cooldowns__cd_watchlist_hre_name: "@hre! Saint Empire"
 qol__cooldowns__cd_watchlist_hre_desc: "Actions soumises à un rechargement du Saint Empire romain germanique (cercles impériaux et soutien électoral). Cochez-en une pour être alerté lorsque son rechargement se termine."
 qol__cd_watchlist_hre_name: "@hre! Saint Empire"
 qol__cd_watchlist_hre_desc: "Quelles actions du Saint Empire soumises à un rechargement affichent une alerte lorsqu'elles redeviennent disponibles."
 qol__cd_watchlist_hre_item_column_name: "Action"
 qol__cd_watchlist_hre__enabled_name: "Surveiller"
 qol__cd_watchlist_hre_i1_name: "Demander un soutien électoral"
 qol__cd_watchlist_hre_i1_desc: "Rechargement de 2 ans. Couvre également Demander à un électeur de voter pour un candidat - les deux partagent un seul rechargement. Disponible uniquement pour les membres du Saint Empire romain germanique ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_hre_i2_name: "Présenter une pétition à la Diète impériale"
 qol__cd_watchlist_hre_i2_desc: "Rechargement de 10 ans. Disponible uniquement pour les chefs de cercle impérial ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_hre_i3_name: "Demander un privilège de cercle"
 qol__cd_watchlist_hre_i3_desc: "Rechargement de 5 ans. Disponible uniquement pour les chefs de cercle impérial ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_hre_i4_name: "Défier le chef du cercle"
 qol__cd_watchlist_hre_i4_desc: "Rechargement de 5 ans. Disponible uniquement pour les membres du Saint Empire qui ne sont ni empereur ni chef de cercle ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_hre_i5_name: "Demander une subvention financière à la Diète du cercle"
 qol__cd_watchlist_hre_i5_desc: "Rechargement de 10 ans. Disponible uniquement pour les membres du Saint Empire qui ne sont ni empereur ni chef de cercle ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_hre_i6_name: "Demander l'extension des infrastructures militaires"
 qol__cd_watchlist_hre_i6_desc: "Rechargement de 10 ans. Disponible uniquement pour les membres du Saint Empire qui ne sont ni empereur ni chef de cercle ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_hre_i7_name: "Promouvoir le pays au sein du cercle"
 qol__cd_watchlist_hre_i7_desc: "Rechargement de 10 ans. Disponible uniquement pour les membres du Saint Empire qui ne sont ni empereur ni chef de cercle ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cooldowns__cd_watchlist_situational_name: "@mapmode! Conjonctures"
 qol__cooldowns__cd_watchlist_situational_desc: "Actions soumises à un rechargement qui n'existent que pendant le déroulement d'une situation (actuellement les Guerres d'Italie). Cochez-en une pour être alerté lorsque son rechargement se termine."
 qol__cd_watchlist_situational_name: "@mapmode! Conjonctures"
 qol__cd_watchlist_situational_desc: "Quelles actions situationnelles soumises à un rechargement affichent une alerte lorsqu'elles redeviennent disponibles."
 qol__cd_watchlist_situational_item_column_name: "Action"
 qol__cd_watchlist_situational__enabled_name: "Surveiller"
 qol__cd_watchlist_situational_i1_name: "Porter atteinte à la souveraineté italienne"
 qol__cd_watchlist_situational_i1_desc: "Rechargement de 1 an. Disponible uniquement pendant les Guerres d'Italie pour un chef de ligue en guerre ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_situational_i2_name: "Soudoyer pour rejoindre la Ligue"
 qol__cd_watchlist_situational_i2_desc: "Rechargement de 5 ans. Disponible uniquement pendant les Guerres d'Italie pour un chef de ligue qui n'est pas en guerre ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cooldowns__cd_watchlist_country_name: "@region! Spécifiques au pays"
 qol__cooldowns__cd_watchlist_country_desc: "Actions soumises à un rechargement pour un pays ou une région spécifique (actuellement le Japon pendant la période Sengoku et la Chine pendant les Rébellions du Turban rouge). Cochez-en une pour être alerté lorsque son rechargement se termine."
 qol__cd_watchlist_country_name: "@region! Spécifiques au pays"
 qol__cd_watchlist_country_desc: "Quelles actions spécifiques au pays soumises à un rechargement affichent une alerte lorsqu'elles redeviennent disponibles."
 qol__cd_watchlist_country_item_column_name: "Action"
 qol__cd_watchlist_country__enabled_name: "Surveiller"
 qol__cd_watchlist_country_i1_name: "Envoyer des éclaireurs en territoire ennemi"
 qol__cd_watchlist_country_i1_desc: "Rechargement de 1 an. Disponible uniquement pour les pays de culture japonaise ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cd_watchlist_country_i2_name: "Demande d'annexion"
 qol__cd_watchlist_country_i2_desc: "Rechargement de 3 ans. Disponible uniquement pour la Chine, les rebelles du Turban rouge ou un pays capable de créer le CB du Turban rouge pendant le déroulement de la situation ; sinon, l'interrupteur Surveiller est désactivé."
 qol__cooldowns__cd_watchlist_estate_name: "@crown_estate! Interactions avec les estates"
 qol__cooldowns__cd_watchlist_estate_desc: "Actions soumises à un rechargement liées aux estates (levées, impôts, clergé, noblesse, bourgeois, paysans, tribus et parlement d'urgence). Cochez-en une pour être alerté lorsque son rechargement se termine."
 qol__cd_watchlist_estate_name: "@crown_estate! Interactions avec les estates"
 qol__cd_watchlist_estate_desc: "Quelles interactions avec les estates soumises à un rechargement affichent une alerte lorsqu'elles redeviennent disponibles."
 qol__cd_watchlist_estate_item_column_name: "Action"
 qol__cd_watchlist_estate__enabled_name: "Vigilance"
 qol__cd_watchlist_estate_i1_name: "Demander des levées supplémentaires"
 qol__cd_watchlist_estate_i1_desc: "Cooldown de 5 ans. Octroie de la main-d'œuvre au prix de la satisfaction de l'estate."
 qol__cd_watchlist_estate_i2_name: "Lever des impôts extraordinaires"
 qol__cd_watchlist_estate_i2_desc: "Cooldown de 5 ans. Octroie des revenus fiscaux spécifiques à l'estate au prix de sa satisfaction."
 qol__cd_watchlist_estate_i3_name: "Solliciter l'approbation du clergé"
 qol__cd_watchlist_estate_i3_desc: "Cooldown de 5 ans. Octroie de la légitimité au prix de la satisfaction du clergé. Nécessite l'estate du clergé."
 qol__cd_watchlist_estate_i4_name: "Demander des émissaires nobles"
 qol__cd_watchlist_estate_i4_desc: "Cooldown de 5 ans. Octroie 5 diplomates au prix de la satisfaction de la noblesse. Nécessite l'estate de la noblesse."
 qol__cd_watchlist_estate_i5_name: "Demander une subvention d'urgence"
 qol__cd_watchlist_estate_i5_desc: "Cooldown de 5 ans. Transfère de l'or des bourgeois au prix de leur satisfaction. Nécessite l'estate des bourgeois."
 qol__cd_watchlist_estate_i6_name: "Apaiser les paysans"
 qol__cd_watchlist_estate_i6_desc: "Cooldown de 5 ans. Octroie de la stabilité au prix de la satisfaction des paysans ou dhimmis."
 qol__cd_watchlist_estate_i7_name: "Appeler les tribus sous les drapeaux"
 qol__cd_watchlist_estate_i7_desc: "Cooldown de 5 ans. Octroie de la main-d'œuvre au prix de la satisfaction des tribus ou cosaques."
 qol__cd_watchlist_estate_i8_name: "Convoquer un parlement d'urgence"
 qol__cd_watchlist_estate_i8_desc: "Cooldown de 5 ans. Convoque une session parlementaire d'urgence au prix de la légitimité. Nécessite un parlement et d'être en guerre."
