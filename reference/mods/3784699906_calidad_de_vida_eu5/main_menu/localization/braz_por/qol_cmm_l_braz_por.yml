l_braz_por:
 qol_name: "@hint! Qualidade de vida QoL"
 qol_desc: "Melhorias de qualidade de vida: você decide em quais tipos de localização a automação pode construir fortificações, pode demolir fortificações indesejadas sob demanda, os círculos de progresso permanecem visíveis ao afastar o zoom e as fronteiras do mapa ficam mais espessas e visíveis. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, um tipo de localização proibido também bloqueia a construção manual."
