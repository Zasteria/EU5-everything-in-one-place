 qol__fort_cleanup_buildings_naval_battery_name: "@naval_battery! Bateria naval"
 qol__qol__fort_build_forbidden_name: "@trigger_fail! Proibição de fortificações"
 qol__qol__fort_build_forbidden_desc: "Escolha em quais tipos de localização a automação não pode construir fortificações. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, um tipo de localização proibido também bloqueia a construção manual; com ambas desativadas, você pode construir livremente em qualquer lugar."
 qol__qol__fort_cleanup_name: "@arrow_down! Demolição de fortificações"
 qol__qol__fort_cleanup_desc: "Quais fortificações demolir, em quais tipos de localização e para quais países."
 qol__fort_build_forbidden_name: "@warning_icon! Proibir fortalezas"
 qol__fort_build_forbidden_desc: "Em quais tipos de localização a automação não pode construir fortificações: assentamentos rurais, vilas, cidades, megalópoles, sua capital, costas, capitais de província ou todas. Deixe tudo desmarcado para o comportamento normal. Nota: se você tiver o Community Mod Framework (CMF) instalado, esta opção tem prioridade sobre a regra de jogo correspondente."
 qol__fort_build_forbidden_item_column_name: "Tipo de localização"
 qol__fort_build_forbidden__enabled_name: "Proibir"
 qol__fort_build_forbidden_i1_name: "@rural_settlement! Assentamento rural"
 qol__fort_build_forbidden_i1_desc: "Localizações de assentamento rural. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__fort_build_forbidden_i2_name: "@town! Vila"
 qol__fort_build_forbidden_i2_desc: "Localizações de vila. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__fort_build_forbidden_i3_name: "@city! Cidade"
 qol__fort_build_forbidden_i3_desc: "Localizações de cidade. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__fort_build_forbidden_i4_name: "@megalopolis! Megalópole"
 qol__fort_build_forbidden_i4_desc: "Localizações de megalópole. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__fort_build_forbidden_i5_name: "@city_capital! Sua capital"
 qol__fort_build_forbidden_i5_desc: "A capital do seu país. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__fort_build_forbidden_i6_name: "@ship! Costas"
 qol__fort_build_forbidden_i6_desc: "Localizações costeiras. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__fort_build_forbidden_i7_name: "@province! Capitais de província"
 qol__fort_build_forbidden_i7_desc: "Capitais de província. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__fort_build_forbidden_i8_name: "@mapmode! Todas as localizações"
 qol__fort_build_forbidden_i8_desc: "Qualquer localização: a automação não construirá nenhuma fortificação. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__fort_build_forbidden_i9_name: "@location! Não capitais de província"
 qol__fort_build_forbidden_i9_desc: "Localizações que não são capitais de província. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__fort_build_forbidden_i10_name: "@inland! Interior"
 qol__fort_build_forbidden_i10_desc: "Localizações do interior que não são costeiras. Com a automação de Edificações ou de Expansão Automática de Edificações ativa, a construção manual também é bloqueada."
 qol__papal_bulls_name: "@rite_power! Bulas papais"
 qol__papal_bulls__auto_vote_name: "@catholic_church! Voto automático"
 qol__papal_bulls__auto_vote_desc: "Em quais bulas papais seu país vota automaticamente e de que forma."
 qol__papal_bulls__auto_vote_schism_name: "@religious_influence_catholic! Cisma do Ocidente"
 qol__papal_bulls__auto_vote_schism_desc: "De que lado seu país vota automaticamente na resolução do Cisma do Ocidente: a favor de Roma, contra Roma ou desativado."
 qol__auto_vote_name: "@religion! Voto automático em bulas papais"
 qol__auto_vote_desc: "Escolha para cada bula papal se o voto é automático: a favor, contra ou desativado. Os votos são emitidos quando o mês muda. Nota: se você tiver Community Mod Framework (CMF) instalado, este ajuste tem prioridade sobre a regra de jogo correspondente."
 qol__auto_vote_item_column_name: "Bula"
 qol__auto_vote_benedictus_deus_desc: "$MODIFIER_TYPE_NAME_global_pop_conversion_speed_modifier$ +33% por 10 anos."
 qol__auto_vote_christiana_pietas_desc: "+2 $MODIFIER_TYPE_NAME_tolerance_heathen$ por 10 anos."
 qol__auto_vote_in_coena_domini_desc: "$MODIFIER_TYPE_NAME_global_maritime_presence_modifier$ +25% por 10 anos."
 qol__auto_vote_apostolicae_servitutis_desc: "$MODIFIER_TYPE_NAME_clergy_estate_target_satisfaction$ +0.1 por 10 anos."
 qol__auto_vote_immensa_aeterni_dei_desc: "$MODIFIER_TYPE_NAME_global_institution_growth_modifier$ +0.1 por 10 anos."
 qol__auto_vote_inter_gravissimas_desc: "$MODIFIER_TYPE_NAME_legislative_efficiency$ +0.2 por 10 anos."
 qol__auto_vote_libertas_ecclesiae_desc: "$MODIFIER_TYPE_NAME_imperial_authority_modifier$ +0.2 por 10 anos."
 qol__auto_vote_dei_gratia_rex_desc: "$MODIFIER_TYPE_NAME_global_estate_target_satisfaction$ +0.05 por 10 anos."
 qol__auto_vote_illius_qui_se_pro_divini_desc: "$MODIFIER_TYPE_NAME_antagonism_received_modifier$ -0.2 por 10 anos."
 qol__auto_vote_excommunicate_resolution_desc: "Excomunga o governante do país alvo. Dura até que a excomunhão seja suspensa."
 qol__auto_vote_call_crusade_desc: "Convoca uma cruzada contra um país alvo. Dura até o fim da guerra com o alvo; pode ser convocada novamente a cada 10 anos."
 qol__auto_vote_western_schism_resolution_desc: "Vota para resolver o Cisma do Ocidente entre o Papa e o antipapa. Dura até o cisma ser resolvido."
 qol__auto_vote_schism_western_schism_resolution_name: "Apoio automático"
 qol__auto_vote__vote_name: "Voto automático"
 qol__auto_vote__vote_option_1_name: "@trigger_fail! Desativado"
 qol__auto_vote__vote_option_2_name: "@trigger_yes! Votar a favor"
 qol__auto_vote__vote_option_3_name: "@trigger_no! Votar contra"
 qol__auto_vote_schism_name: "@religious_influence_catholic! Voto do Cisma do Ocidente"
 qol__auto_vote_schism_desc: "Voto automático na resolução do Cisma do Ocidente: desativado, a favor de Roma ou contra Roma. O voto é emitido quando o mês muda."
 qol__auto_vote_schism_item_column_name: "Bula"
 qol__auto_vote_schism__vote_name: "Voto"
 qol__auto_vote_schism__vote_option_1_name: "@trigger_fail! Desativado"
 qol__auto_vote_schism__vote_option_2_name: "@rite_power! A favor de Roma"
 qol__auto_vote_schism__vote_option_3_name: "@trigger_no! Contra Roma"
 qol__parliament_name: "@parliament! Parlamento"
 qol__parliament__auto_pause_name: "@time! O Parlamento vai terminar"
 qol__parliament__reminder_name: "@hint! Parlamento disponível"
 qol__parliament_auto_pause_name: "@time! Pausa automática"
 qol__parliament_auto_pause_desc: "Quando pausar o jogo perto do fim de uma sessão do Parlamento: nunca, sempre ou somente se a questão estiver prestes a falhar. Nota: se você tiver o Community Mod Framework (CMF) instalado, esta opção tem prioridade sobre a regra de jogo correspondente."
 qol__parliament_auto_pause_option_1_name: "@trigger_fail! Desativado"
 qol__parliament_auto_pause_option_2_name: "@time! Pausar sempre"
 qol__parliament_auto_pause_option_3_name: "@warning_icon! Somente se for falhar"
 qol__parliament_availability_reminder_name: "@hint! Lembrete de convocação"
 qol__parliament_availability_reminder_desc: "Mostra um evento (e pausa o jogo) quando uma nova sessão do Parlamento puder ser convocada. Nota: se você tiver o Community Mod Framework (CMF) instalado, esta opção tem prioridade sobre a regra de jogo correspondente."
 qol__parliament_availability_reminder_option_1_name: "@trigger_yes! Ativado"
 qol__parliament_availability_reminder_option_2_name: "@trigger_fail! Desativado"
 qol__education_name: "@literacy! Educação"
 qol__education__auto_ce_name: "@heir! Educação automática"
 qol__education__auto_ce_desc: "Todo mês, cada criança elegível recebe automaticamente a educação correspondente à sua maior aptidão. Nota: se o Community Mod Framework (CMF) estiver instalado, estas configurações têm precedência sobre a regra de jogo correspondente."
 qol__auto_ce_educate_heirs_name: "@heir! Educar herdeiros"
 qol__auto_ce_educate_heirs_desc: "Todo mês os herdeiros recebem automaticamente uma educação. Desative para escolher a educação deles manualmente."
 qol__auto_ce_educate_crown_name: "@crown_estate! Educar filhos da Coroa"
 qol__auto_ce_educate_crown_desc: "Todo mês os filhos do domínio da Coroa recebem automaticamente uma educação."
 qol__auto_ce_educate_prodigy_name: "@characters! Educar prodígios e superdotados"
 qol__auto_ce_educate_prodigy_desc: "Todo mês os filhos prodígio e superdotados recebem automaticamente uma educação. Alcançam valores altos com qualquer educação."
 qol__auto_ce_expensive_scope_name: "@gold! Educação cara"
 qol__auto_ce_expensive_scope_desc: "Atribui automaticamente a educação aprofundada cara a herdeiros e/ou filhos da Coroa."
 qol__auto_ce_expensive_scope_option_1_name: "@trigger_fail! Desativada"
 qol__auto_ce_expensive_scope_option_2_name: "@heir! Somente herdeiros"
 qol__auto_ce_expensive_scope_option_3_name: "@crown_estate! Herdeiros e Coroa"
 qol__auto_ce_expensive_scope_option_4_name: "@characters! Todas as crianças"
 qol__auto_ce_run_now_name: "@literacy! Reavaliar agora"
 qol__auto_ce_run_now_desc: "Reprocessa imediatamente todas as crianças elegíveis, incluindo as já processadas. Nunca altera uma educação cara já atribuída."
 qol__auto_ce_run_now_text: "@literacy! Reavaliar"
 qol__cooldowns_name: "@time! Cooldowns"
 qol__cooldowns__alerts_name: "@warning_icon! Alertas"
 qol__cooldowns__alerts_desc: "Como a Calidad de vida EU5 informa quando um cooldown vigiado terminou. Um alerta na barra superior é mostrado quando uma ação com cooldown vigiado fica disponível novamente."
 qol__cd_enable_alerts_name: "@warning_icon! Ativar alertas de cooldown"
 qol__cd_enable_alerts_desc: "Mostra um alerta CMF quando um cooldown vigiado fica disponível novamente. Desative para silenciar todos os alertas de cooldown."
 qol__cab_enable_alerts_name: "@cabinet_action! Ativar alertas de ações de gabinete"
 qol__cab_enable_alerts_desc: "Mostra um alerta CMF quando a ação Estabilizar País ou Fortalecer Governo atinge o valor máximo. A ação permanece ativa de propósito para reduzir o custo de manutenção no máximo - o alerta só lembra que ela pode ser cancelada manualmente. Desative para silenciar esses alertas."
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! Vigiar cooldown da Ordem de Cavalaria"
 qol__cd_watch_order_of_chivalry_desc: "Alerta quando o cooldown de 10 anos da Ordem de Cavalaria do seu país terminar - ele é compartilhado por Juntar-se à Ordem de Cavalaria Estrangeira e Convidar para Ordem de Cavalaria, então usar qualquer um dos dois o inicia. Ativado por padrão."
 qol__cooldowns__cd_watchlist_general_name: "@country! Gerais"
 qol__cooldowns__cd_watchlist_general_desc: "Ações com cooldown que qualquer país pode usar (exceto requisitos de religião ou relação). Marque uma para ser avisado quando seu cooldown terminar."
 qol__cd_watchlist_general_name: "@country! Gerais"
 qol__cd_watchlist_general_desc: "Quais ações gerais com cooldown mostram um alerta quando ficam disponíveis novamente."
 qol__cd_watchlist_general_item_column_name: "Ação"
 qol__cd_watchlist_general__enabled_name: "Vigiar"
 qol__cd_watchlist_general_i1_name: "Solicitar Divórcio"
 qol__cd_watchlist_general_i1_desc: "Cooldown de 10 anos. Disponível apenas para países católicos; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_general_i2_name: "Impor Cultura"
 qol__cd_watchlist_general_i2_desc: "Cooldown de 10 anos. Disponível para todos os países."
 qol__cd_watchlist_general_i3_name: "Forçar Religião"
 qol__cd_watchlist_general_i3_desc: "Cooldown de 10 anos. Disponível para todos os países."
 qol__cd_watchlist_general_i4_name: "Convidar Colonos"
 qol__cd_watchlist_general_i4_desc: "Cooldown de 2 anos. Disponível para todos os países."
 qol__cd_watchlist_general_i5_name: "Obrigar Alteração do Idioma da Corte"
 qol__cd_watchlist_general_i5_desc: "Cooldown de 10 anos. Disponível para todos os países."
 qol__cd_watchlist_general_i6_name: "Solicitar Fundos"
 qol__cd_watchlist_general_i6_desc: "Cooldown de 1 ano. Disponível apenas em guerra enquanto uma ordem militar patrocina seu país; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_general_i7_name: "Assumir o Controle"
 qol__cd_watchlist_general_i7_desc: "Cooldown de 25 anos. Disponível apenas em uma união pessoal com antiguidade estabelecida na qual você não é o sócio sênior; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cooldowns__cd_watchlist_hre_name: "@hre! Sacro Império"
 qol__cooldowns__cd_watchlist_hre_desc: "Ações com cooldown do Sacro Império Romano-Germânico (círculos imperiais e apoio eleitoral). Marque uma para ser avisado quando seu cooldown terminar."
 qol__cd_watchlist_hre_name: "@hre! Sacro Império"
 qol__cd_watchlist_hre_desc: "Quais ações do Sacro Império com cooldown mostram um alerta quando ficam disponíveis novamente."
 qol__cd_watchlist_hre_item_column_name: "Ação"
 qol__cd_watchlist_hre__enabled_name: "Vigiar"
 qol__cd_watchlist_hre_i1_name: "Pedir Apoio Eleitoral"
 qol__cd_watchlist_hre_i1_desc: "Cooldown de 2 anos. Também cobre Pedir que o Eleitor Vote em um Candidato - ambos compartilham um único cooldown. Disponível apenas para membros do Sacro Império Romano-Germânico; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_hre_i2_name: "Petição à Dieta Imperial"
 qol__cd_watchlist_hre_i2_desc: "Cooldown de 10 anos. Disponível apenas para líderes de círculo imperial; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_hre_i3_name: "Pedir Privilégio de Círculo"
 qol__cd_watchlist_hre_i3_desc: "Cooldown de 5 anos. Disponível apenas para líderes de círculo imperial; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_hre_i4_name: "Desafiar Liderança do Círculo"
 qol__cd_watchlist_hre_i4_desc: "Cooldown de 5 anos. Disponível apenas para membros do Sacro Império que não são nem imperador nem líder de círculo; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_hre_i5_name: "Pedir uma Concessão Financeira à Dieta do Círculo"
 qol__cd_watchlist_hre_i5_desc: "Cooldown de 10 anos. Disponível apenas para membros do Sacro Império que não são nem imperador nem líder de círculo; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_hre_i6_name: "Pedir Expansão de Infraestrutura Militar"
 qol__cd_watchlist_hre_i6_desc: "Cooldown de 10 anos. Disponível apenas para membros do Sacro Império que não são nem imperador nem líder de círculo; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_hre_i7_name: "Elevar País no Círculo"
 qol__cd_watchlist_hre_i7_desc: "Cooldown de 10 anos. Disponível apenas para membros do Sacro Império que não são nem imperador nem líder de círculo; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cooldowns__cd_watchlist_situational_name: "@mapmode! Situações"
 qol__cooldowns__cd_watchlist_situational_desc: "Ações com cooldown que só existem enquanto uma situação está ativa (atualmente as Guerras Italianas). Marque uma para ser avisado quando seu cooldown terminar."
 qol__cd_watchlist_situational_name: "@mapmode! Situações"
 qol__cd_watchlist_situational_desc: "Quais ações situacionais com cooldown mostram um alerta quando ficam disponíveis novamente."
 qol__cd_watchlist_situational_item_column_name: "Ação"
 qol__cd_watchlist_situational__enabled_name: "Vigiar"
 qol__cd_watchlist_situational_i1_name: "Violar Soberania Italiana"
 qol__cd_watchlist_situational_i1_desc: "Cooldown de 1 ano. Disponível apenas durante as Guerras Italianas para um líder de liga em guerra; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_situational_i2_name: "Subornar para Entrar na Liga"
 qol__cd_watchlist_situational_i2_desc: "Cooldown de 5 anos. Disponível apenas durante as Guerras Italianas para um líder de liga que não está em guerra; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cooldowns__cd_watchlist_country_name: "@region! Específicas de país"
 qol__cooldowns__cd_watchlist_country_desc: "Ações com cooldown para um país ou região específicos (atualmente o Japão durante o período Sengoku e a China durante as Rebeliões do Turbante Vermelho). Marque uma para ser avisado quando seu cooldown terminar."
 qol__cd_watchlist_country_name: "@region! Específicas de país"
 qol__cd_watchlist_country_desc: "Quais ações específicas de país com cooldown mostram um alerta quando ficam disponíveis novamente."
 qol__cd_watchlist_country_item_column_name: "Ação"
 qol__cd_watchlist_country__enabled_name: "Vigiar"
 qol__cd_watchlist_country_i1_name: "Investigar Posses Inimigas"
 qol__cd_watchlist_country_i1_desc: "Cooldown de 1 ano. Disponível apenas para países com cultura japonesa; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cd_watchlist_country_i2_name: "Exigir Anexação"
 qol__cd_watchlist_country_i2_desc: "Cooldown de 3 anos. Disponível apenas para a China, os rebeldes do Turbante Vermelho ou um país capaz de criar o CB do Turbante Vermelho enquanto a situação está ativa; caso contrário, o interruptor Vigiar fica desabilitado."
 qol__cooldowns__cd_watchlist_estate_name: "@crown_estate! Interações com Estamentos"
 qol__cooldowns__cd_watchlist_estate_desc: "Ações com cooldown relacionadas a estamentos (levantes, impostos, clero, nobreza, burgueses, camponeses, tribos e parlamento de emergência). Marque uma para ser avisado quando seu cooldown terminar."
 qol__cd_watchlist_estate_name: "@crown_estate! Interações com Estamentos"
 qol__cd_watchlist_estate_desc: "Quais interações com estamentos com cooldown mostram um alerta quando ficam disponíveis novamente."
 qol__cd_watchlist_estate_item_column_name: "Ação"
 qol__cd_watchlist_estate__enabled_name: "Vigiar"
 qol__cd_watchlist_estate_i1_name: "Solicitar levantes extras"
 qol__cd_watchlist_estate_i1_desc: "Tempo de recarga de 5 anos. Concede mão de obra ao custo da satisfação do estamento."
 qol__cd_watchlist_estate_i2_name: "Cobrar impostos extraordinários"
 qol__cd_watchlist_estate_i2_desc: "Tempo de recarga de 5 anos. Concede receitas fiscais específicas do estamento ao custo de sua satisfação."
 qol__cd_watchlist_estate_i3_name: "Solicitar apoio clerical"
 qol__cd_watchlist_estate_i3_desc: "Tempo de recarga de 5 anos. Concede legitimidade ao custo da satisfação do clero. Requer o estamento do clero."
 qol__cd_watchlist_estate_i4_name: "Solicitar enviados nobres"
