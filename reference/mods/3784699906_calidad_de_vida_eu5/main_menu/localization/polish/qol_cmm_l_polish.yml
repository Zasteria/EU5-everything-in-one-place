 qol__fort_cleanup_rank_name: "@location! Typ lokalizacji"
 qol__fort_cleanup_rank_desc: "Które typy lokalizacji są czyszczone: osady wiejskie, miasteczka, miasta, metropolie lub wszystkie."
 qol__fort_cleanup_rank_option_1_name: "@location! Wszystkie lokalizacje"
