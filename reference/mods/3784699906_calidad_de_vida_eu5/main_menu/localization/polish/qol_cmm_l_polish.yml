 qol__fort_cleanup_buildings_castle_name: "@castle! Zamek"
 qol__fort_cleanup_buildings_bastion_name: "@bastion! Twierdza bastionowa"
 qol__fort_cleanup_buildings_star_fort_name: "@star_fort! Bastion"
 qol__fort_cleanup_buildings_fortress_name: "@fortress! Twierdza"
 qol__fort_cleanup_buildings_city_walls_name: "@city_walls! Mury miejskie"
 qol__fort_cleanup_buildings_coastal_fort_name: "@coastal_fort! Twierdza nadbrzeżna"
 qol__fort_cleanup_buildings_naval_battery_name: "@naval_battery! Bateria artyleryjska"
 qol__qol__fort_build_forbidden_name: "@trigger_fail! Zakaz budowy fortyfikacji"
 qol__qol__fort_build_forbidden_desc: "Wybierz, w jakich typach lokalizacji automatyzacja nie może budować fortyfikacji. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, zakazany typ lokalizacji blokuje również budowę ręczną; przy obu wyłączonych możesz budować swobodnie w dowolnym miejscu."
 qol__qol__fort_cleanup_name: "@arrow_down! Wyburzanie fortyfikacji"
 qol__qol__fort_cleanup_desc: "Które fortyfikacje wyburzyć, w jakich typach lokalizacji i dla których krajów."
 qol__fort_build_forbidden_name: "@warning_icon! Zakaz fortyfikacji"
 qol__fort_build_forbidden_desc: "W jakich typach lokalizacji automatyzacja nie może budować fortyfikacji: osady wiejskie, miasteczka, miasta, metropolie, twoja stolica, wybrzeża, stolice prowincji lub wszystkie. Odznacz wszystko, aby przywrócić normalne zachowanie. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), ta opcja ma pierwszeństwo nad odpowiadającą jej regułą gry."
 qol__fort_build_forbidden_item_column_name: "Typ lokalizacji"
 qol__fort_build_forbidden__enabled_name: "Zakaz"
 qol__fort_build_forbidden_i1_name: "@rural_settlement! Osada wiejska"
 qol__fort_build_forbidden_i1_desc: "Lokalizacje osad wiejskich. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__fort_build_forbidden_i2_name: "@town! Miasteczko"
 qol__fort_build_forbidden_i2_desc: "Lokalizacje miasteczek. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__fort_build_forbidden_i3_name: "@city! Miasto"
 qol__fort_build_forbidden_i3_desc: "Lokalizacje miast. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__fort_build_forbidden_i4_name: "@megalopolis! Metropolia"
 qol__fort_build_forbidden_i4_desc: "Lokalizacje metropolii. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__fort_build_forbidden_i5_name: "@city_capital! Twoja stolica"
 qol__fort_build_forbidden_i5_desc: "Stolica twojego kraju. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__fort_build_forbidden_i6_name: "@ship! Wybrzeża"
 qol__fort_build_forbidden_i6_desc: "Lokalizacje przybrzeżne. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__fort_build_forbidden_i7_name: "@province! Stolice prowincji"
 qol__fort_build_forbidden_i7_desc: "Stolice prowincji. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__fort_build_forbidden_i8_name: "@mapmode! Wszystkie lokalizacje"
 qol__fort_build_forbidden_i8_desc: "Dowolna lokalizacja: automatyzacja nie zbuduje żadnej fortyfikacji. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__fort_build_forbidden_i9_name: "@location! Nie stolice prowincji"
 qol__fort_build_forbidden_i9_desc: "Lokalizacje, które nie są stolicami prowincji. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__fort_build_forbidden_i10_name: "@inland! W głębi lądu"
 qol__fort_build_forbidden_i10_desc: "Lokalizacje śródlądowe, które nie są nadbrzeżne. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, budowa ręczna również jest blokowana."
 qol__papal_bulls_name: "@rite_power! Bulle papieskie"
 qol__papal_bulls__auto_vote_name: "@catholic_church! Automatyczne głosowanie"
 qol__papal_bulls__auto_vote_desc: "W których kwestiach papieskich bull twoje państwo głosuje automatycznie i w jaki sposób."
 qol__papal_bulls__auto_vote_schism_name: "@religious_influence_catholic! Wielka schizma zachodnia"
 qol__papal_bulls__auto_vote_schism_desc: "Po której stronie twoje państwo głosuje automatycznie w rezolucji o wielkiej schizmie zachodniej: za Rzymem, przeciw Rzymowi lub wyłączone."
 qol__auto_vote_name: "@religion! Automatyczne głosowanie w sprawie bull papieskich"
 qol__auto_vote_desc: "Wybierz dla każdej bulli papieskiej, czy głosować automatycznie: za, przeciw lub wyłączone. Głosy są oddawane przy zmianie miesiąca. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), to ustawienie ma pierwszeństwo przed odpowiednią regułą gry."
 qol__auto_vote_item_column_name: "Bulla"
 qol__auto_vote_benedictus_deus_desc: "$MODIFIER_TYPE_NAME_global_pop_conversion_speed_modifier$ +33% przez 10 lat."
 qol__auto_vote_christiana_pietas_desc: "+2 $MODIFIER_TYPE_NAME_tolerance_heathen$ przez 10 lat."
 qol__auto_vote_in_coena_domini_desc: "$MODIFIER_TYPE_NAME_global_maritime_presence_modifier$ +25% przez 10 lat."
 qol__auto_vote_apostolicae_servitutis_desc: "$MODIFIER_TYPE_NAME_clergy_estate_target_satisfaction$ +0.1 przez 10 lat."
 qol__auto_vote_immensa_aeterni_dei_desc: "$MODIFIER_TYPE_NAME_global_institution_growth_modifier$ +0.1 przez 10 lat."
 qol__auto_vote_inter_gravissimas_desc: "$MODIFIER_TYPE_NAME_legislative_efficiency$ +0.2 przez 10 lat."
 qol__auto_vote_libertas_ecclesiae_desc: "$MODIFIER_TYPE_NAME_imperial_authority_modifier$ +0.2 przez 10 lat."
 qol__auto_vote_dei_gratia_rex_desc: "$MODIFIER_TYPE_NAME_global_estate_target_satisfaction$ +0.05 przez 10 lat."
 qol__auto_vote_illius_qui_se_pro_divini_desc: "$MODIFIER_TYPE_NAME_antagonism_received_modifier$ -0.2 przez 10 lat."
 qol__auto_vote_excommunicate_resolution_desc: "Ekskomunikuje władcę kraju docelowego. Trwa do zniesienia ekskomuniki."
 qol__auto_vote_call_crusade_desc: "Ogłasza krucjatę przeciwko krajowi docelowemu. Trwa do końca wojny z celem; można ją ponownie ogłosić co 10 lat."
 qol__auto_vote_western_schism_resolution_desc: "Głosuje w sprawie zakończenia schizmy zachodniej między papieżem a antypapieżem. Trwa do rozwiązania schizmy."
