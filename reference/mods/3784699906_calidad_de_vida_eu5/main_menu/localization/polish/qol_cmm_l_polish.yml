 qol__auto_vote__vote_option_2_name: "@trigger_yes! Głosuj za"
 qol__auto_vote__vote_option_3_name: "@trigger_no! Głosuj przeciw"
 qol__auto_vote_schism_name: "@religious_influence_catholic! Głosowanie w sprawie schizmy zachodniej"
 qol__auto_vote_schism_desc: "Automatyczne głosowanie w sprawie rezolucji o schizmie zachodniej: wyłączone, za Rzymem lub przeciw Rzymowi. Głos jest oddawany przy zmianie miesiąca."
 qol__auto_vote_schism_item_column_name: "Bulla"
 qol__auto_vote_schism__vote_name: "Głosowanie"
 qol__auto_vote_schism__vote_option_1_name: "@trigger_fail! Wyłączone"
 qol__auto_vote_schism__vote_option_2_name: "@rite_power! Za Rzymem"
 qol__auto_vote_schism__vote_option_3_name: "@trigger_no! Przeciw Rzymowi"
 qol__parliament_name: "@parliament! Parlament"
 qol__parliament__auto_pause_name: "@time! Parlament wkrótce się zakończy"
 qol__parliament__reminder_name: "@hint! Parlament dostępny"
 qol__parliament_auto_pause_name: "@time! Automatyczna pauza"
 qol__parliament_auto_pause_desc: "Kiedy pauzować grę pod koniec sesji parlamentu: nigdy, zawsze albo tylko wtedy, gdy kwestia ma szansę przepaść. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), ta opcja ma pierwszeństwo nad odpowiadającą jej regułą gry."
 qol__parliament_auto_pause_option_1_name: "@trigger_fail! Wyłączone"
 qol__parliament_auto_pause_option_2_name: "@time! Zawsze"
 qol__parliament_auto_pause_option_3_name: "@warning_icon! Tylko przy porażce"
 qol__parliament_availability_reminder_name: "@hint! Przypomnienie o zwołaniu"
 qol__parliament_availability_reminder_desc: "Pokazuje wyskakujące wydarzenie (i pauzuje grę), gdy można zwołać nową sesję parlamentu. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), ta opcja ma pierwszeństwo nad odpowiadającą jej regułą gry."
 qol__parliament_availability_reminder_option_1_name: "@trigger_yes! Włączone"
 qol__parliament_availability_reminder_option_2_name: "@trigger_fail! Wyłączone"
 qol__education_name: "@literacy! Edukacja"
 qol__education__auto_ce_name: "@heir! Automatyczna edukacja"
 qol__education__auto_ce_desc: "Co miesiąc każdemu kwalifikującemu się dziecku automatycznie przypisywana jest edukacja odpowiadająca jego najwyższym zdolnościom. Uwaga: jeśli masz zainstalowany Community Mod Framework (CMF), te ustawienia mają pierwszeństwo przed odpowiednią regułą gry."
 qol__auto_ce_educate_heirs_name: "@heir! Kształć dziedziców"
 qol__auto_ce_educate_heirs_desc: "Co miesiąc dziedzicom automatycznie przypisywana jest edukacja. Wyłącz, aby wybierać ich edukację ręcznie."
 qol__auto_ce_educate_crown_name: "@crown_estate! Kształć dzieci korony"
 qol__auto_ce_educate_crown_desc: "Co miesiąc dzieciom z domeny korony automatycznie przypisywana jest edukacja."
 qol__auto_ce_educate_prodigy_name: "@characters! Kształć cudowne dzieci"
 qol__auto_ce_educate_prodigy_desc: "Co miesiąc cudownym i uzdolnionym dzieciom automatycznie przypisywana jest edukacja. Osiągają wysokie wartości przy każdej edukacji."
 qol__auto_ce_expensive_scope_name: "@gold! Drogie kształcenie"
 qol__auto_ce_expensive_scope_desc: "Automatycznie przypisuje drogie pogłębione kształcenie dziedzicom i/lub dzieciom korony."
 qol__auto_ce_expensive_scope_option_1_name: "@trigger_fail! Wyłączone"
 qol__auto_ce_expensive_scope_option_2_name: "@heir! Tylko dziedzice"
 qol__auto_ce_expensive_scope_option_3_name: "@crown_estate! Dziedzice i korona"
 qol__auto_ce_expensive_scope_option_4_name: "@characters! Wszystkie dzieci"
 qol__auto_ce_run_now_name: "@literacy! Przelicz teraz"
 qol__auto_ce_run_now_desc: "Natychmiast ponownie przetwarza wszystkie kwalifikujące się dzieci, w tym już przetworzone. Nigdy nie zmienia już przypisanej drogiej edukacji."
 qol__auto_ce_run_now_text: "@literacy! Przelicz"
 qol__cooldowns_name: "@time! Czasy odnowienia"
 qol__cooldowns__alerts_name: "@warning_icon! Alerty"
 qol__cooldowns__alerts_desc: "Jak Calidad de vida EU5 informuje cię, że monitorowany czas odnowienia dobiegł końca. Alert na pasku górnym jest wyświetlany, gdy monitorowana akcja z czasem odnowienia ponownie staje się dostępna."
 qol__cd_enable_alerts_name: "@warning_icon! Włącz alerty o czasach odnowienia"
 qol__cd_enable_alerts_desc: "Wyświetla alert CMF, gdy monitorowany czas odnowienia ponownie staje się dostępny. Wyłącz, aby wyciszyć wszystkie alerty o czasach odnowienia."
 qol__cab_enable_alerts_name: "@cabinet_action! Włącz alerty zadań rządu"
 qol__cab_enable_alerts_desc: "Wyświetla alert CMF, gdy zadanie Stabilizacja kraju lub Wzmocnienie rządu osiągnie wartość maksymalną. Zadanie celowo pozostaje aktywne, aby obniżyć koszt utrzymania przy maksimum - alert tylko przypomina, że można je ręcznie anulować. Wyłącz, aby wyciszyć te alerty."
 qol__cd_watch_order_of_chivalry_name: "@crown_estate! Monitoruj czas odnowienia zakonu rycerskiego"
 qol__cd_watch_order_of_chivalry_desc: "Alarmuje, gdy 10-letni czas odnowienia zakonu rycerskiego twojego kraju dobiegnie końca - jest wspólny dla Dołączenia do obcego zakonu rycerskiego i Zaproszenia do zakonu rycerskiego, więc użycie któregoś z nich go uruchamia. Włączone domyślnie."
 qol__cooldowns__cd_watchlist_general_name: "@country! Ogólne"
 qol__cooldowns__cd_watchlist_general_desc: "Akcje z czasem odnowienia, z których może korzystać każde państwo (chyba że obowiązuje wymóg religii lub relacji). Zaznacz jedną, aby otrzymać alert, gdy jej czas odnowienia dobiegnie końca."
 qol__cd_watchlist_general_name: "@country! Ogólne"
 qol__cd_watchlist_general_desc: "Które ogólne akcje z czasem odnowienia wyświetlają alert, gdy ponownie stają się dostępne."
 qol__cd_watchlist_general_item_column_name: "Akcja"
 qol__cd_watchlist_general__enabled_name: "Monitoruj"
 qol__cd_watchlist_general_i1_name: "Prośba o rozwód"
 qol__cd_watchlist_general_i1_desc: "Czas odnowienia: 10 lat. Dostępne tylko dla państw katolickich; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_general_i2_name: "Narzucenie kultury"
 qol__cd_watchlist_general_i2_desc: "Czas odnowienia: 10 lat. Dostępne dla wszystkich państw."
 qol__cd_watchlist_general_i3_name: "Narzucenie religii"
 qol__cd_watchlist_general_i3_desc: "Czas odnowienia: 10 lat. Dostępne dla wszystkich państw."
 qol__cd_watchlist_general_i4_name: "Zaproszenie osadników"
 qol__cd_watchlist_general_i4_desc: "Czas odnowienia: 2 lata. Dostępne dla wszystkich państw."
 qol__cd_watchlist_general_i5_name: "Zmuszenie do zmiany języka dworu"
 qol__cd_watchlist_general_i5_desc: "Czas odnowienia: 10 lat. Dostępne dla wszystkich państw."
 qol__cd_watchlist_general_i6_name: "Prośba o fundusze"
 qol__cd_watchlist_general_i6_desc: "Czas odnowienia: 1 rok. Dostępne tylko podczas wojny, gdy zakon wojskowy sponsoruje twoje państwo; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_general_i7_name: "Przejmij zwierzchnictwo"
 qol__cd_watchlist_general_i7_desc: "Czas odnowienia: 25 lat. Dostępne tylko w unii personalnej z ustalonym zwierzchnictwem, w której nie jesteś partnerem nadrzędnym; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cooldowns__cd_watchlist_hre_name: "@hre! Święte Cesarstwo Rzymskie"
 qol__cooldowns__cd_watchlist_hre_desc: "Akcje z czasem odnowienia Świętego Cesarstwa Rzymskiego (okręgi cesarskie i wsparcie wyborcze). Zaznacz jedną, aby otrzymać alert, gdy jej czas odnowienia dobiegnie końca."
 qol__cd_watchlist_hre_name: "@hre! Święte Cesarstwo Rzymskie"
 qol__cd_watchlist_hre_desc: "Które akcje z czasem odnowienia Świętego Cesarstwa Rzymskiego wyświetlają alert, gdy ponownie stają się dostępne."
 qol__cd_watchlist_hre_item_column_name: "Akcja"
 qol__cd_watchlist_hre__enabled_name: "Monitoruj"
 qol__cd_watchlist_hre_i1_name: "Prośba o wsparcie wyborcze"
 qol__cd_watchlist_hre_i1_desc: "Czas odnowienia: 2 lata. Obejmuje też Poproś elektora o głosowanie na kandydata - obie dzielą jeden czas odnowienia. Dostępne tylko dla członków Świętego Cesarstwa Rzymskiego; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_hre_i2_name: "Zgłoś petycję do Sejmu Rzeszy"
 qol__cd_watchlist_hre_i2_desc: "Czas odnowienia: 10 lat. Dostępne tylko dla przewodzących okręgowi cesarskiemu; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_hre_i3_name: "Zażądaj przywileju dla okręgu"
 qol__cd_watchlist_hre_i3_desc: "Czas odnowienia: 5 lat. Dostępne tylko dla przewodzących okręgowi cesarskiemu; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_hre_i4_name: "Zakwestionuj przywództwo w okręgu"
 qol__cd_watchlist_hre_i4_desc: "Czas odnowienia: 5 lat. Dostępne tylko dla członków Świętego Cesarstwa Rzymskiego, którzy nie są ani cesarzem, ani przewodzącym okręgowi; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_hre_i5_name: "Poproś sejm okręgu o dotację finansową"
 qol__cd_watchlist_hre_i5_desc: "Czas odnowienia: 10 lat. Dostępne tylko dla członków Świętego Cesarstwa Rzymskiego, którzy nie są ani cesarzem, ani przewodzącym okręgowi; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_hre_i6_name: "Poproś o rozbudowę infrastruktury wojskowej"
 qol__cd_watchlist_hre_i6_desc: "Czas odnowienia: 10 lat. Dostępne tylko dla członków Świętego Cesarstwa Rzymskiego, którzy nie są ani cesarzem, ani przewodzącym okręgowi; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_hre_i7_name: "Podnieś rangę kraju w okręgu"
 qol__cd_watchlist_hre_i7_desc: "Czas odnowienia: 10 lat. Dostępne tylko dla członków Świętego Cesarstwa Rzymskiego, którzy nie są ani cesarzem, ani przewodzącym okręgowi; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cooldowns__cd_watchlist_situational_name: "@mapmode! Sytuacje"
 qol__cooldowns__cd_watchlist_situational_desc: "Akcje z czasem odnowienia, które istnieją tylko podczas trwania sytuacji (obecnie Wojny włoskie). Zaznacz jedną, aby otrzymać alert, gdy jej czas odnowienia dobiegnie końca."
 qol__cd_watchlist_situational_name: "@mapmode! Sytuacje"
 qol__cd_watchlist_situational_desc: "Które sytuacyjne akcje z czasem odnowienia wyświetlają alert, gdy ponownie stają się dostępne."
 qol__cd_watchlist_situational_item_column_name: "Akcja"
 qol__cd_watchlist_situational__enabled_name: "Monitoruj"
 qol__cd_watchlist_situational_i1_name: "Naruszenie suwerenności Włoch"
 qol__cd_watchlist_situational_i1_desc: "Czas odnowienia: 1 rok. Dostępne tylko podczas Wojen włoskich dla przywódcy ligi będącego w stanie wojny; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_situational_i2_name: "Przekupstwo jako zachęta dołączenia do ligi"
 qol__cd_watchlist_situational_i2_desc: "Czas odnowienia: 5 lat. Dostępne tylko podczas Wojen włoskich dla przywódcy ligi niebędącego w stanie wojny; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cooldowns__cd_watchlist_country_name: "@region! Specyficzne dla kraju"
 qol__cooldowns__cd_watchlist_country_desc: "Akcje z czasem odnowienia dla konkretnego kraju lub regionu (obecnie Japonia w okresie Sengoku i Chiny podczas Powstania Czerwonych Turbanów). Zaznacz jedną, aby otrzymać alert, gdy jej czas odnowienia dobiegnie końca."
 qol__cd_watchlist_country_name: "@region! Specyficzne dla kraju"
 qol__cd_watchlist_country_desc: "Które specyficzne dla kraju akcje z czasem odnowienia wyświetlają alert, gdy ponownie stają się dostępne."
 qol__cd_watchlist_country_item_column_name: "Akcja"
 qol__cd_watchlist_country__enabled_name: "Monitoruj"
 qol__cd_watchlist_country_i1_name: "Zwiad we wrogich włościach"
 qol__cd_watchlist_country_i1_desc: "Czas odnowienia: 1 rok. Dostępne tylko dla państw z kulturą japońską; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cd_watchlist_country_i2_name: "Żądanie aneksji"
 qol__cd_watchlist_country_i2_desc: "Czas odnowienia: 3 lata. Dostępne tylko dla Chin, buntowników Czerwonych Turbanów lub państwa zdolnego do utworzenia CB Czerwonych Turbanów podczas trwania sytuacji; w przeciwnym razie przełącznik Monitoruj jest wyłączony."
 qol__cooldowns__cd_watchlist_estate_name: "@crown_estate! Interakcje ze stanami"
 qol__cooldowns__cd_watchlist_estate_desc: "Akcje z czasem odnowienia dostępne poprzez interakcje ze stanami. Zaznacz jedną, aby otrzymać alert, gdy jej czas odnowienia dobiegnie końca."
 qol__cd_watchlist_estate_name: "@crown_estate! Interakcje ze stanami"
 qol__cd_watchlist_estate_desc: "Które akcje z czasem odnowienia stanów wyświetlają alert, gdy ponownie stają się dostępne."
 qol__cd_watchlist_estate_item_column_name: "Akcja"
 qol__cd_watchlist_estate__enabled_name: "Obserwuj"
 qol__cd_watchlist_estate_i1_name: "Poprosić o dodatkowe zaciągi"
 qol__cd_watchlist_estate_i1_desc: "Cooldown 5 lat. Zapewnia siłę roboczą kosztem zadowolenia stanu."
 qol__cd_watchlist_estate_i2_name: "Nałożyć podatki nadzwyczajne"
 qol__cd_watchlist_estate_i2_desc: "Cooldown 5 lat. Zapewnia dochody podatkowe specyficzne dla stanu kosztem jego zadowolenia."
 qol__cd_watchlist_estate_i3_name: "Poprosić o poparcie duchowieństwa"
 qol__cd_watchlist_estate_i3_desc: "Cooldown 5 lat. Zapewnia legitymację kosztem zadowolenia duchowieństwa. Wymaga stanu duchowieństwa."
 qol__cd_watchlist_estate_i4_name: "Poprosić o szlacheckich wysłanników"
 qol__cd_watchlist_estate_i4_desc: "Cooldown 5 lat. Zapewnia 5 dyplomatów kosztem zadowolenia szlachty. Wymaga stanu szlacheckiego."
 qol__cd_watchlist_estate_i5_name: "Poprosić o grant awaryjny"
 qol__cd_watchlist_estate_i5_desc: "Cooldown 5 lat. Przenosi złoto z mieszczan kosztem ich zadowolenia. Wymaga stanu mieszczańskiego."
 qol__cd_watchlist_estate_i6_name: "Ułagodzić chłopstwo"
 qol__cd_watchlist_estate_i6_desc: "Cooldown 5 lat. Zapewnia stabilność kosztem zadowolenia chłopstwa lub dhimmi."
 qol__cd_watchlist_estate_i7_name: "Wezwać plemiona do broni"
 qol__cd_watchlist_estate_i7_desc: "Cooldown 5 lat. Zapewnia siłę roboczą kosztem zadowolenia plemion lub Kozaków."
 qol__cd_watchlist_estate_i8_name: "Zwołać parlament nadzwyczajny"
 qol__cd_watchlist_estate_i8_desc: "Cooldown 5 lat. Zwołuje nadzwyczajną sesję parlamentarną kosztem legitymacji. Wymaga parlamentu i bycia na wojnie."
