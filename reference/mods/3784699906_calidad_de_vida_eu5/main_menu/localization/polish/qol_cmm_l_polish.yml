l_polish:
 qol_name: "@hint! Calidad de vida QoL"
 qol_desc: "Ulepszenia jakości życia: decydujesz, w jakich typach lokalizacji automatyzacja może budować fortyfikacje, możesz wyburzać niechciane fortyfikacje na żądanie, okręgi postępu pozostają widoczne po oddaleniu widoku, a granice państw na mapie są grubsze i bardziej widoczne. Gdy automatyzacja „Budowle" lub „Automatyczny rozwój budowli" jest włączona, zakazany typ lokalizacji blokuje również budowę ręczną."
 qol__qol_name: "@fortress! Fortyfikacje"
 qol__qol__forts_name: "@fortress! Fortyfikacje"
 qol__qol__fort_cleanup_buildings_name: "@castle! Budynki do wyburzenia"
 qol__qol__fort_cleanup_buildings_desc: "Które typy fortyfikacji usuwa przycisk wyburzenia."
 qol__fort_cleanup_scope_name: "@country! Kraje, których to dotyczy"
 qol__fort_cleanup_scope_desc: "Które kraje są objęte czyszczeniem fortyfikacji: tylko twój kraj, twój kraj i jego zależności (poddani i młodsi partnerzy), tylko zależności albo cały świat."
