l_german:
 eth_mobile_court_reform_tooltip: "Jedes Mal, wenn die Hauptstadt verlegt wird, erhält der neue Hauptstadtort einen vorübergehenden Vorteil"
 eth_mobile_court_reform: "Das Wanderlager (Ketema)"
 eth_mobile_court_reform_desc: "Ohne feste Hauptstadt – eine eigentümliche Herrschaftsweise, in der der Kaiser samt Heer, Hof und Kirche unablässig das Reich durchzieht. Das erleichtert die Verlegung der Hauptstadt und bringt jedem Land, das der Kaiser besucht, Segen."
 STATIC_MODIFIER_NAME_eth_mobile_court_mod: "Segen des kaiserlichen Lagers (Ketema)"
 STATIC_MODIFIER_DESC_eth_mobile_court_mod: "Der Hof des Kaisers hat hier geweilt und einen Zustrom von Menschen und Wohlstand in dieses Land gebracht (klingt mit der Zeit ab)."
