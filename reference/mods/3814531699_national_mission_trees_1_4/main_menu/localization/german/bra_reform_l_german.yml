l_german:
 bra_quality_doctrine_reform: "Doktrin der Eliteverbände"
 bra_quality_doctrine_reform_desc: "Eine Militärdoktrin, die auf eine kleine, erlesene Streitmacht setzt – überlegene Soldaten und ein geschickter Umgang mit dem Aufgebot lassen ein kleineres Heer gegen ein größeres bestehen. Teuer im Unterhalt, doch unerreicht an Kampfkraft."
 bra_quantity_doctrine_reform: "Doktrin der Totalen Mobilmachung"
 bra_quantity_doctrine_reform_desc: "„Preußen ist kein Staat, der eine Armee hat, sondern eine Armee, die einen Staat hat“ – eine Doktrin, die Masse über Klasse stellt und den Feind allein durch ihr Gewicht erdrückt. Günstig im Unterhalt, wenn auch Disziplin und Moral etwas leiden."
 bra_advanced_quality_doctrine_reform: "Auftragstaktik"
 bra_advanced_quality_doctrine_reform_desc: "Eine Doktrin, die den Befehlshabern auf dem Schlachtfeld eigenständiges Urteil zutraut und so rasches, der Lage angemessenes Handeln ermöglicht. Ein Heer von unerreichter Fertigkeit in jeder Waffengattung, ob Infanterie oder Artillerie, verschafft sich durch Qualität eine erdrückende Überlegenheit. Kostspielig in Unterhalt und Mannschaftsstärke, doch kein Heer kommt ihr an Kampfkraft gleich."
 bra_advanced_quantity_doctrine_reform: "Die Nation in Waffen"
 bra_advanced_quantity_doctrine_reform_desc: "Eine Doktrin der vollständigen nationalen Mobilmachung, die das gesamte Volk bewaffnet – günstiger Unterhalt, reichlich Mannschaften und enorme Frontbreite erdrücken den Feind durch schiere Zahl. Disziplin und Moral bleiben eine anhaltende Schwäche."
 bra_german_empire_reform: "Die Verfassung des Deutschen Kaiserreichs"
 bra_german_empire_reform_desc: "Eine eigentümlich deutsche Regierungsform – ein Bund von Staaten, gekrönt von einem Kaiser, der zentrale Autorität mit bundesstaatlicher Eigenständigkeit verbindet. Sie mehrt Legitimität und Ansehen der Krone und verleiht sowohl Vorherrschaft im Handel als auch Spielraum in der inneren Verwaltung."
