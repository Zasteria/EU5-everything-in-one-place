l_german:
 teu_teutonic_mission_pack: "Deutscher Orden – Schwert und Kreuz"
 teu_teutonic_mission_pack_DESCRIPTION:0 "Der Deutsche Orden, der im Namen Gottes das Baltikum eroberte. Erhebe das Kreuzfahrerbanner und vernichte die Heiden und Orthodoxen des Ostens, um den Nordischen Kreuzzug zu vollenden – oder säkularisiere und lege als Königreich Preußen die Grundlagen des modernen Deutschlands. Die Zeit der Entscheidung ist gekommen."
 teu_teutonic_mission_pack_CRITERIA_DESCRIPTION:0 "Vollende auf dem Kreuzzugsweg den Nordischen Kreuzzug oder errichte auf dem Weg der Säkularisierung das Königreich Preußen."
 teu_teutonic_mission_pack_BUTTON_TOOLTIP:0 "Erobere das Baltikum und Osteuropa mit Schwert und Kreuz."
 teu_teutonic_mission_pack_BUTTON_DETAILS:0 "„Hilfe allen, die bitten, keine Gnade dem Feind“ – herrsche im Namen des Hochmeisters über das Baltikum!"
 teu_crusaders_legacy: "Das Erbe des Kreuzritterordens"
 teu_crusaders_legacy_desc: "Im Jahr 1190 während des Dritten Kreuzzugs vor Akkon gegründet, begann der Deutsche Orden als Hospitalorden im Heiligen Land. 1226 verlieh ihm Friedrichs II. Goldbulle von Rimini das Recht, gegen das heidnische Preußen zu Felde zu ziehen, und seither hat er mit dem Schwert des Kreuzfahrers das südliche Ostseeufer erobert. Dieser „Mönchsritterstaat“ mit der Hauptstadt Marienburg ist Europas letzter Kreuzfahrerstaat und führt seine Kriege der Bekehrung und Besiedlung fort. Nun, umgeben von den mächtigen Rivalen des gediminidischen Litauens und des jagiellonischen Polens, wird sich der wahre Wert des Ordens erweisen."
 teu_secure_prussia: "Preußen sichern"
 teu_secure_prussia_desc: "Preußen – einst Heimat der baltischen Prußen – wurde in mehr als fünfzig Jahren der Eroberung durch den Deutschen Orden ab den 1230er Jahren gewonnen. Nach der Niederschlagung des „Großen Aufstands“ von 1283 war die einheimische Bevölkerung faktisch ausgelöscht und das Land als Kolonie deutscher Siedler neu aufgebaut. Doch in den Bergen und Wäldern glimmt noch die Glut des Widerstands. Vollende das Netz der Festungen in ganz Preußen und mache die Herrschaft des Ordens unerschütterlich – denn ohne Preußen gibt es keinen Deutschen Orden."
 teu_christianize_prussia: "Preußen christianisieren"
 teu_christianize_prussia_desc: "Der erklärte Daseinszweck des Deutschen Ordens ist „die Bekehrung der Heiden“. In Wahrheit wurden die meisten unterworfenen Prußen zwangsbekehrt, und wer sich widersetzte, wurde niedergemacht. Der Vertrag von Christburg 1249 gewährte den prußischen Adligen Rechte im Austausch für die Taufe, doch spätere Aufstände ließen dieses Versprechen brechen. Strebe nun eine wahre Katholisierung an und errichte ein Netz von Kirchen, um die religiöse Legitimität des Ordens zu begründen – nur mit dem Rückhalt des Papstes kann dieser Staat wahrhaft rechtmäßig werden."
 teu_subdue_lithuania: "Litauen unterwerfen"
 teu_subdue_lithuania_desc: "Das Großfürstentum Litauen – ein gewaltiger heidnischer Staat, der sich unter der Gediminiden-Dynastie von der Ostsee bis zur Ukraine erstreckte – war zugleich die größte Bedrohung und das größte Kreuzzugsziel des Deutschen Ordens. Niederlage in der Schlacht an der Durbe 1260, Katastrophe bei Tannenberg 1410 – Litauen hat den Orden immer wieder geschlagen. Doch mit Jogailas Übertritt zum Katholizismus 1387 war Litauen dem Namen nach kein „heidnischer Staat“ mehr, was die Rechtfertigung des Kreuzzugs trübte. Dennoch kann der Orden das Baltikum nur beherrschen, wenn er den Kampf um die Vorherrschaft gegen Litauen gewinnt."
 teu_subdue_poland: "Polen unterwerfen"
 teu_subdue_poland_desc: "Am 15. Juli 1410 die Schlacht bei Tannenberg (Grunwald) – die größte Niederlage in der Geschichte des Deutschen Ordens. Hochmeister Ulrich von Jungingen und die Blüte der Ordensritterschaft fielen, und Marienburg selbst wurde belagert. Der Zweite Thorner Friede von 1466 trat Westpreußen an Polen ab und machte den Orden kaum mehr als zu einem Vasallen. Räche diese Demütigung – besiege Polen, gewinne die verlorenen Lande zurück und wasche die Schmach von Tannenberg ab."
 teu_order_or_prussia: "Die Entscheidung – Kreuzzug oder Säkularisierung"
 teu_order_or_prussia_desc: "Als 1511 Albrecht von Hohenzollern Hochmeister wurde, stand der Orden am Scheideweg des Überlebens. Als Luthers Reformation von 1517 Europa erschütterte, traf Albrecht Luther selbst und entschied sich, den Orden zu säkularisieren und das Herzogtum Preußen zu gründen – 1525. Doch was, wenn der Orden stattdessen seine Kreuzzugsmission fortgesetzt hätte? Vollende den „Nordischen Kreuzzug“, indem du die Orthodoxen, Heiden und Muslime des Ostens unterwirfst, oder lege als weltliches Fürstentum die Grundlagen des modernen Preußens – die Wahl liegt bei dir."
 teu_crusade_path: "Der Weg des Nordischen Kreuzzugs"
 teu_crusade_path_desc: "Der Weg des Kreuzzugs – ergreife im Namen Gottes das Schwert. Die wahre Berufung des Deutschen Ordens ist die Bekehrung und Eroberung der Heiden. Im Osten warten die orthodoxen Lande der Rus; am Ostseeufer winkt ein Bündnis mit dem Livländischen Orden. Wie schon bei der Eroberung Preußens pflanze das Kreuzfahrerbanner vom östlichen Ostseeufer bis nach Nordrussland auf. Der von Gregor IX. gewährte Kreuzzugsablass bleibt ewig gültig – vollende im Namen Gottes den Nordischen Kreuzzug und meißle den Namen des Hochmeisters in die Geschichte."
 teu_path_crusade_chosen_tt: "Weg des Kreuzzugs gewählt"
 teu_path_secular_chosen_tt: "Weg der Säkularisierung gewählt"
 teu_livonian_alliance: "Bündnis mit dem Livländischen Orden"
 teu_livonian_alliance_desc: "Der Livländische Orden – Nachfolger der Schwertbrüder, 1237 in den Deutschen Orden aufgenommen. Mit Sitz in Riga beherrscht dieser Orden das östliche Ostseeufer, steht aber unter ständigem Druck von Litauen und der Rus. Er erlitt 1242 in der Schlacht auf dem Peipussee eine Niederlage gegen Alexander Newski und 1260 an der Durbe einen verheerenden Schlag durch Litauen. Schmiede nun ein Bündnis mit dem Livländischen Orden und errichte ein gemeinsames System, um das östliche Baltikum gemeinsam zu beherrschen – leihe dir die Stärke des Bruderordens, um die Feinde des Ostens zu besiegen."
 teu_crusade_east: "Kreuzzug nach Osten"
 teu_crusade_east_desc: "Richte das Kreuzfahrerschwert nach Osten – gegen die orthodoxen „Schismatiker“, die „Heiden“ der Romuva, die muslimischen „Ungläubigen“. All diese sind Feinde des katholischen Glaubens und Ziele des Kreuzzugs. Seit den 1230er Jahren führt der Deutsche Orden den „Nordischen Kreuzzug“ durch die Lande der Balten. Weite nun den Horizont noch weiter nach Osten und führe den Heiligen Krieg gegen das Herz der Ostkirche und die letzten Bollwerke der Balten. Litauens Übertritt zum Katholizismus 1386 verringerte die Zahl der „rechtmäßigen“ Kreuzzugsziele, doch die orthodoxen Staaten Russlands bleiben."
 teu_riga_crusade: "Riga, Bollwerk der Kreuzfahrer"
 teu_riga_crusade_desc: "Riga – 1201 von Bischof Albert von Buxthoeven gegründet, ist diese Stadt das wichtigste Bollwerk am östlichen Ostseeufer. Zwischen dem Livländischen Orden und dem Erzbischof von Riga tobt ein langer Machtkampf, doch wenn der Deutsche Orden die Stadt einen und als Vorposten für den Ostkreuzzug ausbauen kann, wird sie zum Stützpunkt gegenüber der Rus. An der Mündung der Düna gelegen, ist Riga für Handel wie Krieg unentbehrlich – ihre Sicherung begründet die Nachschublinie für den Vormarsch nach Osten."
 teu_march_to_orthodox: "Marsch gegen die Orthodoxie"
 teu_march_to_orthodox_desc: "Die „ketzerische“ orthodoxe Kirche – in den Augen der römischen Katholiken halten die byzantinische und die russische Kirche seit dem Großen Schisma von 1054 den „falschen Glauben“. Die Republik Nowgorod, Pskow, die russischen Fürstentümer – diese orthodoxen Staaten sind das eigentliche Ziel des Nordischen Kreuzzugs. 1242 besiegte Alexander Newski den Livländischen Orden auf dem Eis des Peipussees und wird bis heute als „der Held, der die Kreuzritter schlug“ gefeiert. Räche diese Niederlage und pflanze das katholische Banner auf orthodoxen Boden – dies ist die höchste Sendung des Deutschen Ordens."
 teu_northern_crusade_final: "Der Nordische Kreuzzug vollendet"
 teu_northern_crusade_final_desc: "Der Nordische Kreuzzug – beginnend mit der Eroberung Preußens und sich über das östliche Ostseeufer bis tief in die Rus erstreckend – nähert sich endlich seiner Vollendung. Wie zuvor die Prußen müssen nun die Orthodoxen bekehrt oder erobert werden. Die Ostsee wird zum Binnenmeer des Deutschen Ordens, und das Banner des Hochmeisters weht bis an den östlichen Rand der Welt. Der Traum vom „Nordischen Kreuzzug“, weitergetragen seit den Schwertbrüdern des 13. Jahrhunderts – die Lande der Balten, Slawen und Finnen zu einem heiligen Reich zu einen –, ist nun verwirklicht."
 teu_secularize_path: "Der Weg der Säkularisierung"
 teu_secularize_path_desc: "Am 10. April 1525 verkündete Albrecht von Hohenzollern in Krakau die Gründung des Herzogtums Preußen als Vasall König Sigismunds I. von Polen – die Säkularisierung des Deutschen Ordens. Im Austausch für den Übertritt zum Luthertum sollten die Lande des Ordens als weltliches Herzogtum fortbestehen. Die katholischen Staaten tobten über diesen „Verrat“, doch die steigende Flut des Protestantismus eröffnete dem Orden einen neuen Weg. Reite auf der Woge der Reformation und lege als weltlicher Fürst die Grundlagen des modernen Preußens – dies ist die neue Daseinsweise des Ordens in einer neuen Zeit."
 teu_prussian_duchy: "Herzogtum Preußen"
 teu_prussian_duchy_desc: "Das Herzogtum Preußen – 1525 aus der Säkularisierung geboren – entwickelte sich unter der Herrschaft der Hohenzollern rasch. Mit Königsberg als Hauptstadt förderte es aktiv die lutherische Reformation und gab sich durch die Universität Königsberg (gegründet 1544) das Gepräge des „Preußens der Gelehrsamkeit“. Ein ehemaliger Kreuzfahrerstaat wandelt sich nun zu einem modernen Herzogtum. Baue die Verwaltung auf, schmiede die Zusammenarbeit mit den adligen Junkern und lege die Grundlagen eines Militärstaates – der erste Schritt zum künftigen Königreich Preußen und später zum Deutschen Kaiserreich."
 teu_control_pomerania: "Pommern beherrschen"
 teu_control_pomerania_desc: "Pommern – das sich am südlichen Ostseeufer westlich der Weichsel erstreckt – wurde lange zwischen den deutschen Fürsten, Dänemark und Polen umkämpft. Das Herzogtum Pommern der Greifen-Dynastie ist ein kleiner, zwischen Preußen und Brandenburg eingeklemmter Staat, doch sein Zugang zur Ostsee macht es strategisch unentbehrlich. Wer Pommern einnimmt, wird Preußen zum wahren Herrn der Ostsee. Beherrsche den Hafen Stettin und die Wasserwege der Oder und schmiede die „norddeutsche Achse“, die Brandenburg und Pommern verbindet."
 teu_protestant_reformation: "Protestantische Reformation"
 teu_protestant_reformation_desc: "Im Jahr 1517 schlug Martin Luther seine Fünfundneunzig Thesen an die Kirchentür zu Wittenberg – und die Woge der Reformation traf Preußen unmittelbar. Hochmeister Albrecht traf Luther selbst und entschied sich, den Orden zu säkularisieren. Preußens Hinwendung zum Luthertum wurde zum Fundament eines „protestantischen Bundes“ gegen die katholischen Habsburger. Treibe die Reformation tatkräftig voran und modernisiere Bildung und Verwaltung – die Gelehrsamkeit der Universität Königsberg und Preußens disziplinierte Bürokratie werden für Generationen zum Fundament der preußischen Kultur."
 teu_dominate_hre: "Aufstieg im Heiligen Römischen Reich"
 teu_dominate_hre_desc: "Das Heilige Römische Reich – verspottet als „weder heilig, noch römisch, noch ein Reich“ – ist eine verwickelte politische Ordnung. Wie wird Preußen sich darin behaupten? Die Macht der habsburgischen Kaiser, die Rivalitäten der Kurfürsten, die durch die Reformation entstandenen Risse – all dies schafft Gelegenheiten für Preußens Aufstieg. Die Vereinigung von Brandenburg und Preußen 1618 unter hohenzollerscher Erbschaft würde zum Fundament eines späteren geeinten Deutschlands. Begründe deinen Rang als Kurfürst, weite deinen Einfluss im Reich aus und erhebe Preußen zum Rivalen der Habsburger und Führer Norddeutschlands."
 teu_north_german_empire: "Norddeutscher Bund"
 teu_north_german_empire_desc: "Das Norddeutsche Reich – Bismarcks Traum, der Ehrgeiz des Hauses Hohenzollern. Im 18. Jahrhundert bewies Friedrich der Große Preußens Macht im Siebenjährigen Krieg gegen Österreich; im 19. einte Bismarck Deutschland durch „Blut und Eisen“. Doch lange zuvor hatte Preußens Traum, als Nachfolgestaat des Deutschen Ordens ganz Norddeutschland zu einen, schon eine lange Geschichte. Brandenburg, Pommern, Mecklenburg, Hannover – schare die Fürsten Norddeutschlands um dich und verwirkliche hier und jetzt den Norddeutschen Bund, der zum Vorläufer des modernen deutschen Staates wird."
 teu_malbork_citadel: "Die Marienburg stärken"
 teu_malbork_citadel_desc: "Die Marienburg (Malbork) – diese gewaltige Backsteinfestung im Weichseldelta ist der Sitz des Deutschen Ordens. 1309 von Venedig hierher verlegt, ist sie die größte mittelalterliche Backsteinburg Europas. Nach der Niederlage bei Tannenberg 1410 von polnischen Truppen belagert, hielt sie unter dem Befehl des stellvertretenden Hochmeisters Heinrich von Plauen stand. Die Mauern der Marienburg sind das Sinnbild des Ordensstaates – sie zu einer uneinnehmbaren Festung auszubauen, ist das Fundament jeder Verteidigungsstrategie."
 teu_konigsberg_dev: "Königsberg entwickeln"
 teu_konigsberg_dev_desc: "Königsberg (das heutige Kaliningrad) – 1255 mit Unterstützung König Ottokars II. von Böhmen gegründet, wuchs diese Stadt zum Mittelpunkt der preußischen Kolonie heran. 1544 wurde hier eine Universität gegründet, später die Geburtsstätte des Philosophen Immanuel Kant. An der Mündung des Pregels gelegen, ist diese Stadt ein wichtiger Handelsplatz der Ostsee und diente als eigentliche Hauptstadt des Ordensstaates. Entwickle ihre städtische Infrastruktur, erweitere Dom und Märkte und lass sie als Umschlagplatz des nordischen und osteuropäischen Handels erblühen – das Herz Preußens zu stärken, ist die Quelle nationaler Macht."
 teu_danzig_port: "Den Hafen Danzig entwickeln"
 teu_danzig_port_desc: "Danzig (Gdańsk) – an der Weichselmündung gelegen, ist dies die größte Hafenstadt der Ostsee. 1308 „nahm“ der Deutsche Orden Danzig seinen polnischen Verbündeten ab und ließ es seither als Drehscheibe des Ostseehandels erblühen. Doch der Zweite Thorner Friede von 1466 trat die Stadt an Polen ab, das sie als Herz des „Königlichen Preußens“ hochhält. Gewinne Danzig zurück, gliedere es in das Handelsnetz der Hanse ein und maximiere die Gewinne des baltischen Getreidehandels – diese als „Königin der Ostsee“ bekannte Stadt ist die finanzielle Lebensader des Ordens."
 teu_teutonic_law: "Das Recht des Deutschen Ordens"
 teu_teutonic_law_desc: "Das Kulmer Recht der 1230er Jahre (Kulmer Handfeste) – das erste Gesetzeswerk, das der Deutsche Orden seinen Kolonialstädten verlieh. Darauf aufbauend entwickelte sich das preußische Rechtswesen und wurde zur rechtlichen Grundlage der deutschen Ostsiedlung. Der erzbischöfliche Erlass von 1489, das preußische Gesetzbuch von 1529 – rechtliche Entwicklung ist das Mittel, mit dem der Ordensstaat sich vom „barbarischen Eroberer“ zum „Träger der Zivilisation“ wandelt. Straffe die Verwaltung, schütze die Rechte der Bauern und entwickle das Handelsrecht – begründe Preußen als Rechtsstaat."
 teu_amber_trade: "Den Bernsteinhandel an sich reißen"
 teu_amber_trade_desc: "Das Gold der Ostsee – der Bernstein. Seit der Antike „das Gold des Nordens“ genannt, wird dieser Edelstein nur an der Ostseeküste gefunden und wurde einst bis in die Mittelmeerwelt getragen. Nach der Eroberung Preußens beanspruchte der Deutsche Orden ein Bernsteinmonopol und bestrafte Schmuggler mit dem Tod. Dieses „Bernsteinmonopol“ ist eine der wichtigsten Einnahmequellen des Ordens. Übernimm die volle Kontrolle über die bernsteinerzeugenden Gebiete der Ostsee und beherrsche die Handelswege nach Mitteleuropa – denn neben dem Schwert ist der Reichtum des Bernsteins eine weitere Quelle der Macht des Ordens."
 teu_hanseatic_ties: "Bande zur Hanse"
 teu_hanseatic_ties_desc: "Die Hanse – dieser von Lübeck angeführte Bund deutscher Kaufmannsstädte beherrscht den Handel über Ost- und Nordsee. Danzig, Riga, Reval (Tallinn) – all diese Städte sind bedeutende Hansestützpunkte, und ihre Gebiete überschneiden sich mit dem Herrschaftsbereich des Deutschen Ordens. Hansekaufleute trugen preußisches Getreide, Holz und Bernstein nach Westeuropa und brachten dafür Tuch, Wein und Salz zurück. Knüpfe enge Bande zur Hanse und werde zum eigentlichen Herrn des Ostseehandelsnetzes – sichere den Wohlstand des Ordens durch Schwert und Handel zugleich."
 teu_colonize_prussia: "Preußen besiedeln"
 teu_colonize_prussia_desc: "Die Ostsiedlung – die große historische Wanderung der Deutschen, die sich vom 11. bis zum 14. Jahrhundert östlich der Elbe niederließen. Der Deutsche Orden stand an der Spitze dieser Bewegung und zog deutsche Bauern, Handwerker und Kaufleute in das eroberte Preußen. Im Austausch für das Verschwinden der einheimischen prußischen Völker wurde dieses Land als „deutsche Ostmark“ kolonisiert. Planmäßiger Städtebau, landwirtschaftliche Erschließung, Straßenbau – dies sind die Mittel, mit denen ein „barbarisches Land“ in die europäische Sphäre der Zivilisation gezogen wird. Vollende die Besiedlung Preußens und verankere es fest als deutschen Boden."
 teu_torun_city: "Thorn (Toruń) entwickeln"
 teu_torun_city_desc: "Thorn (Toruń) – an der Weichsel erbaut, war diese Stadt der allererste Stützpunkt des Deutschen Ordens, gegründet 1231. Die „Thorner Frieden“ von 1454 und 1466 bestimmten ihr Verhältnis zu Polen: der erste brachte Frieden, der zweite die demütigende Gebietsabtretung des Ordens. 1473 wurde hier Kopernikus geboren – der Astronom, der das heliozentrische Weltbild vorschlug. Entwickle Thorn, die Geburtsstätte der Ordensgeschichte, und baue es als Zentrum des Handels auf der Weichsel wieder auf."
 teu_memel_fortress: "Memel befestigen"
 teu_memel_fortress_desc: "Memel (Klaipėda) – an der Mündung der Memel (Neman) an der litauisch-preußischen Grenze wurde diese Festungsstadt vom Deutschen Orden als Frontlinie der Verteidigung gegen Litauen erbaut. Die 1252 gegründete Burg Memel hat unzählige Kämpfe mit Litauen überstanden. Fällt diese Festung, liegen die Tore nach Preußen offen – umgekehrt ist das feste Halten Memels der Schlüssel, litauische Einfälle abzuwehren. Befestige dieses Tor zur Ostsee und lass es als Binnenumschlagplatz des Bernsteinhandels dienen."
 teu_grand_master: "Die Vorherrschaft des Hochmeisters"
 teu_grand_master_desc: "Der Hochmeister – oberster Führer des Deutschen Ordens. Als Stellvertreter Christi führt er die Mönchsritter bei der Herrschaft über ein Kreuzfahrerreich, das sich von der Ostsee über ganz Osteuropa erstreckt. Hermann von Salza (1209–1239) legte durch Diplomatie mit Friedrich II. die politischen Grundlagen des Ordens, und die Herrschaft Winrichs von Kniprode (1351–1382) markierte das goldene Zeitalter des Ordens. Nun sind alle Feinde bezwungen und der Nordische Kreuzzug vollendet – die Autorität des Hochmeisters reicht von der Ostsee bis in die Lande der Orthodoxen. Als Hochmeister, dessen Name in die Geschichte gemeißelt sein wird, bringe den Willen Gottes bis an die Enden des Ostens."
 teu_prussian_king: "Ausrufung des Königs von Preußen"
 teu_prussian_king_desc: "König von Preußen – am 18. Januar 1701 krönte sich Friedrich III. in Königsberg selbst zum König Friedrich I. von Preußen. Indem er sich in Preußen krönte (dem ehemaligen Land des Deutschen Ordens), das außerhalb der Zuständigkeit des Kaisers des Heiligen Römischen Reiches lag, fand er einen klugen Weg, einen Königstitel ohne habsburgische Zustimmung zu beanspruchen. „Friedrich der Große“, Friedrich II., riss Schlesien an sich und gewann den Siebenjährigen Krieg, womit er Preußen zu einer europäischen Großmacht erhob. „Preußen ist kein Land mit einer Armee, sondern eine Armee mit einem Land“ – unter dieser Staatsphilosophie lege hier und jetzt die Grundlagen des modernen Deutschlands."
 teu_events.10.t: "Die Zukunft des Ordens – Kreuzzug oder Säkularisierung"
 teu_events.10.d: "Mit der Unterwerfung Litauens und Polens steht der Deutsche Orden vor einer historischen Entscheidung. Weiter unter dem Kreuzfahrerbanner die Heiden und Orthodoxen des Ostens niederzuschlagen – oder zu einem modernen Fürstentum säkularisieren und sich in das Königreich Preußen verwandeln."
 teu_events.10.a: "Der Weg des Kreuzzugs – die Heiden und Orthodoxen des Ostens besiegen und den Nordischen Kreuzzug vollenden"
 teu_events.10.b: "Der Weg der Säkularisierung – das Herzogtum Preußen errichten und die Grundlagen des modernen Deutschlands legen"
 teu_events.50.t: "Der Nordische Kreuzzug vollendet"
 teu_events.50.d: "„Es ist Gottes Wille“ – von der Ostsee bis in die fernen Weiten der Rus ist der Kreuzzug des Deutschen Ordens vollendet. Das Kreuz strahlt hell über den nördlichen Landen."
 teu_events.50.a: "Es lebe der Kreuzzug! Die Vorherrschaft des Hochmeisters ist begründet!"
 teu_constantinople_fall: "Der Fall Konstantinopels"
 teu_constantinople_fall_desc: "Nach dem vollendeten Nordischen Kreuzzug richtet der Deutsche Orden den Blick nach Süden. Konstantinopel, einst das östliche Bollwerk der Christenheit, ist längst in die Hände von Ketzern und Ungläubigen gefallen. Gewinne diese uralte Kaiserstadt zurück und erhebe das Banner des wahren Glaubens noch einmal über dem Goldenen Horn. Der Weg zum Heiligen Land Jerusalem beginnt mit der Befreiung dieser Stadt."
 teu_jerusalem_reclaimed: "Die Rückgewinnung Jerusalems"
 teu_jerusalem_reclaimed_desc: "Nach der Rückgewinnung Konstantinopels ist das letzte Ziel des Kreuzzugs nur noch eines – das Heilige Land Jerusalem selbst. Unzählige Kreuzfahrer haben es versucht, und unzählige Kreuzfahrer sind auf diesem Boden gefallen; nun ist die Zeit gekommen, dass das schwarze Kreuz des Deutschen Ordens hier weht. Sprich Gebete in der Grabeskirche und erfülle den uralten Traum der Christenheit."
 teu_events.55.t: "Konstantinopel, endlich unser"
 teu_events.55.d: "Nach der Vollendung des Nordischen Kreuzzugs wandte der Deutsche Orden seinen Speer nach Süden. Konstantinopel, einst das Sinnbild byzantinischer Herrlichkeit, war zu kaum mehr als einer Ruine geworden, zertrampelt von Ketzern und Ungläubigen. Doch die Heere des Ordens befreiten die Stadt und erhoben das Kreuz noch einmal über der Hagia Sophia. Das nächste Ziel ist klar – das Heilige Land Jerusalem zurückzugewinnen."
 teu_events.55.a: "Der Weg ins Heilige Land liegt offen – auf nach Jerusalem!"
 teu_events.56.t: "Jerusalem, befreit"
 teu_events.56.d: "Ein Traum, dem Kreuzfahrer durch die Jahrhunderte nachjagten, und eine Hoffnung, die immer wieder zerschlagen wurde – die Rückgewinnung des Heiligen Landes Jerusalem ist endlich gelungen. Während das Banner des Deutschen Ordens über der Grabeskirche weht, jubelt die ganze Christenheit über diesen Sieg. Der Name des Hochmeisters wird für immer neben denen der großen Kreuzfahrerführer der Vorzeit genannt werden. Durch diesen heiligen Triumph sind Tapferkeit und Ruhm des Herrschers unsterblich geworden."
 teu_events.56.a: "Gott ist mit uns! Das Heilige Land ist befreit!"
 teu_events.60.t: "Der Norddeutsche Bund ausgerufen"
 teu_events.60.d: "Von Preußen über Pommern bis Brandenburg – ganz Norddeutschland ist unter dem preußischen Banner vereint. Die Morgenröte des modernen deutschen Staates."
 teu_events.60.a: "Es lebe Preußen! Es lebe der Norddeutsche Bund!"
 teu_events.99.t: "Das letzte Ziel des Ordens"
 teu_events.99.d: "Die Sendung des Deutschen Ordens ist erfüllt – sein Name ist in die Geschichte gemeißelt als der eines großen Reiches, das die Ostsee beherrschte."
 teu_events.99.a: "Es lebe der Deutsche Orden!"
 STATIC_MODIFIER_NAME_teu_amber_mod: "Bernsteinhandelsmonopol"
 STATIC_MODIFIER_DESC_teu_amber_mod: "Das Gold der Ostsee, der Bernstein – sein monopolisierter Handel füllt die Kassen des Deutschen Ordens."
 STATIC_MODIFIER_NAME_teu_christian_mod: "Christianisierung Preußens"
 STATIC_MODIFIER_DESC_teu_christian_mod: "Der katholische Glaube hat in ganz Preußen Wurzeln geschlagen und die geistliche Autorität begründet."
 STATIC_MODIFIER_NAME_teu_colonize_mod: "Besiedlung Preußens"
 STATIC_MODIFIER_DESC_teu_colonize_mod: "Siedler, die in Wagenzügen von jenseits der Elbe eintreffen, gründen neue Dörfer in der Wildnis Preußens."
 STATIC_MODIFIER_NAME_teu_danzig_mod: "Blüte des Hafens Danzig"
 STATIC_MODIFIER_DESC_teu_danzig_mod: "Die „Königin der Ostsee“, Danzig, ist zur Drehscheibe des Seehandels des Ordens ausgebaut."
 STATIC_MODIFIER_NAME_teu_duchy_mod: "Gründung des Herzogtums Preußen"
 STATIC_MODIFIER_DESC_teu_duchy_mod: "Das säkularisierte Herzogtum Preußen ist als moderner Verwaltungsstaat aufgebaut."
 STATIC_MODIFIER_NAME_teu_east_crusade_mod: "Kreuzzug nach Osten"
 STATIC_MODIFIER_DESC_teu_east_crusade_mod: "Bei jedem Zug in heidnische Lande nähen die Ordensbrüder das schwarze Kreuz auf ihre weißen Mäntel und erneuern ihre Gelübde des Heiligen Krieges."
 STATIC_MODIFIER_NAME_teu_hanseatic_mod: "Bande zur Hanse"
 STATIC_MODIFIER_DESC_teu_hanseatic_mod: "Hansekoggen werfen unablässig in den Häfen Danzigs und Thorns Anker, auf der Suche nach Bernstein und Getreide."
 STATIC_MODIFIER_NAME_teu_hre_mod: "Aufstieg im Reich"
 STATIC_MODIFIER_DESC_teu_hre_mod: "Preußen ist zu einer zentralen Macht im Heiligen Römischen Reich aufgestiegen."
 STATIC_MODIFIER_NAME_teu_konigsberg_mod: "Blüte Königsbergs"
 STATIC_MODIFIER_DESC_teu_konigsberg_mod: "Königsberg, das Herz Preußens, blüht als Stadt des Handels und der Gelehrsamkeit."
 STATIC_MODIFIER_NAME_teu_law_mod: "Das Recht des Deutschen Ordens"
 STATIC_MODIFIER_DESC_teu_law_mod: "Das auf dem Kulmer Recht ruhende Gesetzbuch des Ordens hat sich den Ruf erworben, Stadt und Land mit demselben Maß zu richten."
 STATIC_MODIFIER_NAME_teu_legacy_mod: "Erbe des Deutschen Ordens"
 STATIC_MODIFIER_DESC_teu_legacy_mod: "Die Bildnisse der Hochmeister im großen Saal der Marienburg tragen die Überlieferung des Ordens in jeden Winkel seiner neu gewonnenen Gebiete."
 STATIC_MODIFIER_NAME_teu_lithuania_mod: "Unterwerfung Litauens"
 STATIC_MODIFIER_DESC_teu_lithuania_mod: "Eine Reihe von Festungen in den Wäldern Samogitiens steht als Schutzwall gegen die Heere des Großfürsten von Litauen."
 STATIC_MODIFIER_NAME_teu_livonia_mod: "Herrschaft über Livland"
 STATIC_MODIFIER_DESC_teu_livonia_mod: "Das Bündnis mit dem Livländischen Orden hat die Herrschaft über das östliche Ostseeufer gesichert."
 STATIC_MODIFIER_NAME_teu_malbork_mod: "Befestigung der Marienburg"
 STATIC_MODIFIER_DESC_teu_malbork_mod: "Die Marienburg ist zu einer uneinnehmbaren Festung ausgebaut, dem Eckpfeiler der Verteidigung des Ordens."
 STATIC_MODIFIER_NAME_teu_memel_mod: "Befestigung Memels"
 STATIC_MODIFIER_DESC_teu_memel_mod: "Memel ist zu einer befestigten Hafenstadt ausgebaut und sichert die Grenze gegen Litauen."
 STATIC_MODIFIER_NAME_teu_orthodox_march_mod: "Marsch gegen die Orthodoxie"
 STATIC_MODIFIER_DESC_teu_orthodox_march_mod: "Nach vielen Kriegen mit den orthodoxen Fürsten kennen die Soldaten des Ordens die Weise des östlichen Grenzkrieges gut."
 STATIC_MODIFIER_NAME_teu_poland_mod: "Unterwerfung Polens"
 STATIC_MODIFIER_DESC_teu_poland_mod: "Der bei Tannenberg verlorene Stolz ist durch den Sieg der Vergeltung endlich zurückgewonnen."
 STATIC_MODIFIER_NAME_teu_pomerania_mod: "Herrschaft über Pommern"
 STATIC_MODIFIER_DESC_teu_pomerania_mod: "Da die Häfen Pommerns in unserer Hand sind, kann keine Stadt an der Ostseeküste dem Banner des Ordens die Achtung verweigern."
 STATIC_MODIFIER_NAME_teu_protestant_mod: "Protestantische Reformation"
 STATIC_MODIFIER_DESC_teu_protestant_mod: "Im Preußen, das Luthers Lehre angenommen hat, versammeln sich Gelehrte von nah und fern an den Kollegien Königsbergs."
 STATIC_MODIFIER_NAME_teu_prussia_mod: "Ordenseroberung Preußens"
 STATIC_MODIFIER_DESC_teu_prussia_mod: "Die vollständige Unterwerfung Preußens hat die Saat des Aufstands erstickt."
 STATIC_MODIFIER_NAME_teu_prussian_kingdom_mod: "Königreich Preußen"
 STATIC_MODIFIER_DESC_teu_prussian_kingdom_mod: "Das moderne Königreich Preußen ist als Herr Norddeutschlands begründet."
 STATIC_MODIFIER_NAME_teu_constantinople_reclaimed_mod: "Rückgewinnung Konstantinopels"
 STATIC_MODIFIER_DESC_teu_constantinople_reclaimed_mod: "Das Kreuz ist noch einmal über der großen Kirche Konstantinopels erhoben, und sein Licht erreicht den ganzen Osten."
 STATIC_MODIFIER_NAME_teu_jerusalem_ruler_mod: "Bezwinger Jerusalems"
 STATIC_MODIFIER_DESC_teu_jerusalem_ruler_mod: "Der Hochmeister, der vor dem Heiligen Grab kniete, wird vom Volk wie ein lebender Heiliger verehrt, und sein Name ist zu einem Feldzeichen geworden, das Heere führt."
 STATIC_MODIFIER_NAME_teu_riga_mod: "Riga, Bollwerk der Kreuzfahrer"
 STATIC_MODIFIER_DESC_teu_riga_mod: "Riga ist als Handels-, Militär- und Kreuzzugszentrum des östlichen Ostseeufers ausgebaut."
 STATIC_MODIFIER_NAME_teu_secular_start_mod: "Der erste Schritt der Säkularisierung"
 STATIC_MODIFIER_DESC_teu_secular_start_mod: "Seit dem Tag, an dem der Hochmeister den Herzogshut aufsetzte, weht in den Versammlungen Preußens ein neuer Hauch des modernen Staates."
 STATIC_MODIFIER_NAME_teu_torun_mod: "Blüte Thorns"
 STATIC_MODIFIER_DESC_teu_torun_mod: "Thorn, Geburtsstadt des Kopernikus, blüht als Zentrum des Weichselhandels."
 teu_mazovia_subjugation: "Masowien unterwerfen"
 teu_mazovia_subjugation_desc: "Masowien – das polnische Kernland, das sich an der mittleren Weichsel ausbreitet. Dieses Land, in dem später Warschau erbaut werden sollte, ist Polens Tor nach Osten und ein wichtiger Einfallsweg nach Preußen. Das Herzogtum Masowien wurde von einer Nebenlinie der polnischen Piasten-Dynastie regiert, bis es 1526 nach dem Erlöschen des Herrschergeschlechts in das Königreich Polen aufgenommen wurde. Die Beherrschung dieses Landes beseitigt die Bedrohung aus dem Süden und sichert Preußens Sicherheit. Mache das reiche Ackerland des Weichselbeckens zur Kornkammer des Deutschen Ordens."
 teu_narva_fortress: "Festung Narwa"
 teu_narva_fortress_desc: "Narwa – diese Festungsstadt am Fluss Narwa an der Nordküste Estlands markiert die strategische Grenze zwischen Livland und Russland. Jenseits des Flusses steht Russlands Festung Iwangorod, ein wahrer Punkt des Zusammenpralls der Zivilisationen. 1346 zusammen mit der Nordspitze Estlands von Dänemark an den Deutschen Orden verkauft, dient Narwa als Vorposten für den Ostkreuzzug. 1558 ist ihr bestimmt, kurzzeitig den Truppen Iwans des Schrecklichen zu fallen – doch ändere dieses Schicksal hier und jetzt. Befestige Narwa zu einem uneinnehmbaren Bollwerk und halte den Druck auf das orthodoxe Russland aufrecht."
 teu_berlin_dev: "Entwicklung Berlins"
 teu_berlin_dev_desc: "Berlin – diese kleine Stadt am Zusammenfluss von Spree und Havel wurde im 13. Jahrhundert vom Markgrafen von Brandenburg als Doppelstadt (Berlin und Cölln) gegründet. Vorerst ist sie nur ein unbedeutender Sitz der hohenzollernschen Kurfürsten von Brandenburg, doch sobald sich Preußen mit Brandenburg vereint, ist dieser Ort dazu bestimmt, eine Kaiserstadt zu werden. Mit der Personalunion Brandenburg-Preußens 1618 und der Gründung des Königreichs Preußen 1701 wurde Berlin zum Herzen Norddeutschlands. Lege dieses Fundament jetzt – die Entwicklung Berlins wird die Stadt hervorbringen, die die Einigung Norddeutschlands verkörpert."
 teu_junker_system: "Errichtung des Junkersystems"
 teu_junker_system_desc: "Junker – deutsch für „junger Herr“, so heißt Preußens militarisierter Landadel. Als Besitzer riesiger Güter (Gutsherrschaft) östlich der Elbe ließen die Junker Leibeigene Getreide für den Export über die Ostsee nach Westeuropa erzeugen. Ihre wahre Rolle aber war eine militärische – Junker stellten die Mehrzahl der Offiziersposten der preußischen Armee und bildeten den eigentlichen Kern des „Preußens als Militärstaat“. Friedrich Wilhelm I. (der „Soldatenkönig“) schickte Junker zwangsweise in die Kadettenanstalten und machte ihre Wehrpflicht zur Einrichtung. Errichte jetzt das Junkersystem und lege das Fundament der „preußischen Militärkultur“, die Generationen überdauert."
 teu_silesia_claim: "Schlesien beherrschen"
 teu_silesia_claim_desc: "Schlesien – an der oberen Oder ausgebreitet, birgt diese Region das Potenzial, Mitteleuropas größte Industriezone zu werden, reich an Kohle, Eisenerz und Zink. Einst Teil der polnischen Piastenlande, fiel es nach 1335 an das Königreich Böhmen und kam 1526 durch die habsburgische Nachfolge in Böhmen zu Österreich. Doch 1740 begann Friedrich der Große gleich zu Beginn des Österreichischen Erbfolgekriegs mit einem Blitzeinfall in Schlesien und nahm dieses reiche Land „mit Gewalt“. Nimm nun Schlesien für Preußen – seine Industriekraft wird zum wirtschaftlichen Fundament des preußischen Reiches."
 teu_cathedral_network: "Netz der Kathedralen"
 teu_cathedral_network_desc: "Ein Netz von Kathedralen über ganz Preußen – der Deutsche Orden baute auf eroberten Landen stets Kirchen. Der Königsberger Dom, die Schlosskirche der Marienburg, die Johanniskirche in Thorn – alle waren Werkzeuge, den katholischen Glauben in heidnischen Boden zu pflanzen. Die Ordnung des Pfarrsystems, die Errichtung von Bistümern, der Bau von Klöstern – dies sind die institutionellen Mittel, mit denen „barbarische Lande“ in die christliche Zivilisation gezogen werden. Eine Kathedrale ist zugleich ein Dienst an Gott und ein Sinnbild kolonialer Herrschaft. Errichte in ganz Preußen ein Netz von Kathedralen und stärke die religiöse Autorität und die Rechtmäßigkeit der Herrschaft des Deutschen Ordens."
 teu_elbing_dev: "Entwicklung Elbings"
 teu_elbing_dev_desc: "Elbing (Elbląg) – 1237 am östlichen Rand des Weichseldeltas gegründet, ist diese Stadt neben Danzig einer der wichtigsten Häfen Preußens und ein bedeutendes Mitglied der Hanse. Durch Binnenwasserwege mit Königsberg verbunden, blühte sie als Ausfuhrhafen für Getreide, Holz und Bernstein. Wie Danzig kam sie nach dem Zweiten Thorner Frieden (1466) unter polnische Kontrolle, doch für Preußen ist die volle Kontrolle über das Weichseldelta als Zugang zum Meer unerlässlich. Entwickle Elbing und errichte gemeinsam mit Danzig ein Zwillingssystem großer Ostseehäfen."
 STATIC_MODIFIER_NAME_teu_mazovia_mod: "Masowien unterworfen"
 STATIC_MODIFIER_DESC_teu_mazovia_mod: "Masowien ist unterworfen und sichert die Südgrenze."
 STATIC_MODIFIER_NAME_teu_narva_mod: "Festung Narwa"
 STATIC_MODIFIER_DESC_teu_narva_mod: "Narwa ist zu einem uneinnehmbaren Bollwerk im Osten ausgebaut."
 STATIC_MODIFIER_NAME_teu_berlin_mod: "Entwicklung Berlins"
 STATIC_MODIFIER_DESC_teu_berlin_mod: "Berlin ist als Hauptstadt Preußens ausgebaut."
 STATIC_MODIFIER_NAME_teu_junker_mod: "Das Junkersystem"
 STATIC_MODIFIER_DESC_teu_junker_mod: "Die Junker, verwurzelt auf ihren Gütern östlich der Elbe, tragen das Königreich als Offiziere wie als Beamte."
 STATIC_MODIFIER_NAME_teu_silesia_mod: "Schlesien erobert"
 STATIC_MODIFIER_DESC_teu_silesia_mod: "Die Webstühle und Bergwerke Schlesiens verleihen den Finanzen Preußens einen neuen Pulsschlag."
 STATIC_MODIFIER_NAME_teu_cathedral_mod: "Netz der Kathedralen"
 STATIC_MODIFIER_DESC_teu_cathedral_mod: "In ganz Preußen sind Kathedralen erbaut, und der katholische Glaube hat Wurzeln geschlagen."
 STATIC_MODIFIER_NAME_teu_elbing_mod: "Blüte des Hafens Elbing"
 STATIC_MODIFIER_DESC_teu_elbing_mod: "Elbing ist zu einer bedeutenden Ostseehafenstadt ausgebaut."
 teu_mongol_empire: "Das Bollwerk der Mongolen fällt"
 teu_mongol_empire_desc: "Sarai, Kasan, Samarkand, Kaffa, Dadu, Karakorum – eine nach der anderen sind die großen Hauptstädte des Mongolenreiches, das einst die Welt erschütterte, unter dem Banner des schwarzen Kreuzes gefallen. Die „Große Mongolische Nation“, 1206 von Dschingis Khan gegründet, zerfiel bis zum Ende des 13. Jahrhunderts, und ihr einstiger Glanz ist längst dahin. In das, was von ihrem Reich bleibt, marschieren die eisernen Heere des Deutschen Ordens von Ost und West zugleich und unterwerfen die Herren der Steppe. Vom Pazifik im Osten bis zur Ostsee im Westen – das gesamte mongolische Erbe wird vom Reich des Kreuzes ergriffen."
 teu_sacred_nomads: "Der Thron des Großkhans, an sich gerissen"
 teu_sacred_nomads_desc: "Da das gesamte Mongolenreich erobert ist, beansprucht der Hochmeister nun als Kriegsbeute den Titel, den die Steppenvölker über alles fürchten – „Khan“. Dies ist weder Verschmelzung noch Koexistenz; es ist schlicht der Eroberer, der sich auf den Thron des Besiegten setzt. Schwere Reiter mit dem Kreuz sind zu den Herren dessen geworden, was einst die gefürchtetste Horde der Erde war. Einige die Reiche des Ostens und des Westens in Gottes Willen – dies ist der höchste Sieg des Deutschen Ordens."
 teu_events.70.t: "Die mongolischen Hauptstädte, unser"
 teu_events.70.d: "Sarai, Kasan, Samarkand, Kaffa, Dadu, Karakorum – jede Hauptstadt des Mongolenreiches ist gefallen. Von diesem Tag an nennt sich der Hochmeister „Deutscher Großkhan“, doch nicht als Erbe mongolischen Blutes oder mongolischer Kultur. Es ist nichts weiter als ein Eroberer, der den Titel des Besiegten als Zeichen seiner eigenen Autorität an sich reißt. Pax Deus – der Friede Gottes – verdrängt nun, was einst die Herrschaft der Steppe war."
 teu_events.70.a: "Die mongolischen Lande sind endlich unser!"
 teu_events.80.t: "Das Eiserne Kreuz beherrscht die Welt"
 teu_events.80.d: "Als letzten Akt der Eroberung des Mongolenreiches hat der Deutsche Orden das östliche wie das westliche Reich vollständig unter seine eigene Herrschaft gebracht. Die Völker der Steppe fügen sich, und unter der Autorität des Kreuzes wird eine neue Ordnung errichtet. Dies ist keine Verschmelzung, sondern die reine Vollendung der Eroberung – der Orden bleibt der Orden und ist zum Herrn des größten Reiches der Erde geworden."
 teu_events.80.a: "Nach Gottes Willen gehört die Welt uns!"
 STATIC_MODIFIER_NAME_teu_mongol_empire_mod: "Eroberung der Mongolen"
 STATIC_MODIFIER_DESC_teu_mongol_empire_mod: "Die Kriegsmaschinerie des Mongolenreiches ist erbeutet – die Reiter der Steppe dienen nun unter dem Kommando des Ordens."
 STATIC_MODIFIER_NAME_teu_sacred_nomads_mod: "Der Thron des Großkhans"
 STATIC_MODIFIER_DESC_teu_sacred_nomads_mod: "Als Herr dessen, was einst ein Weltreich war, herrschend – die Mongolen sind vom Deutschen Orden vollständig unterworfen."
 teu_great_khan_name: "Deutsches Großkhanat"
 teu_events.11.t: "Das Gelübde des Nordischen Kreuzzugs"
 teu_events.11.d: "Die Tore zum Osten stehen offen – mit der Unterwerfung Litauens und Polens ist für den Deutschen Orden die Zeit einer historischen Entscheidung gekommen. Jeder Ritter schwört vor der Autorität des Hochmeisters: „Nach Gottes Willen werden wir die Heiden und Orthodoxen des Ostens vernichten und den Nordischen Kreuzzug vollenden.“ Dieses Gelübde wird zum Leitprinzip des Ordensstaates, und je höher seine Legitimität, desto größer Disziplin und Ordnung."
 teu_events.11.a: "Wir schwören es – nach Gottes Willen den Nordischen Kreuzzug vollenden!"
 teu_steppe_crusade: "Kreuzzug der Steppe"
 teu_steppe_crusade_desc: "Die pontische Steppe – einst das Herz des Mongolenreiches, ein endloses Grasland unter der Herrschaft der Tataren. Nun erobere diese Steppe mit der schweren Reiterei des Deutschen Ordens, verschmolzen mit leichten Reitern nach mongolischer Art, und errichte die Vorherrschaft über ganz Osteuropa. Wer die Steppe beherrscht, beherrscht Osteuropa – beweise diese Wahrheit mit der Stärke des Deutschen Ordens."
 STATIC_MODIFIER_NAME_teu_steppe_crusade_mod: "Kreuzzug der Steppe"
 STATIC_MODIFIER_DESC_teu_steppe_crusade_mod: "Die berittenen Ordensbrüder, die durch die Winde der Steppe reiten, haben sich selbst die Kriegsweisen der Nomaden zu eigen gemacht."
 STATIC_MODIFIER_NAME_teu_crusade_loot_mod: "Kreuzfahrerplünderung"
 STATIC_MODIFIER_DESC_teu_crusade_loot_mod: "Die Plünderung des Kreuzzugs hat das Land ausgezehrt: Felder liegen brach, Dörfer stehen leer, und die Menschen warten auf bessere Tage."
