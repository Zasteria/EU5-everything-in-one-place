l_german:
 sic_restoration_mission_pack: "Der Weg des Königreichs Sizilien"
 sic_restoration_mission_pack_DESCRIPTION:0 "Durch den Aufstand von 1282 von Neapel getrennt, steht das Königreich Sizilien nun bereit, die Kraft dieser Insel im Herzen des Mittelmeers zu sammeln und seinen Namen noch einmal in die Geschichte zu schreiben. Wirst du die Meerenge überqueren und dich noch einmal mit Neapel vereinen, oder die Insel selbst zu einem Land des Goldes schmieden? Die Wahl liegt bei dir, o König."
 sic_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Schließe Missionen als Königreich Sizilien ab, arbeite auf die Wiederherstellung der beiden Sizilien oder ein goldenes Zeitalter für die Insel Sizilien hin."
 sic_restoration_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um den Weg des Königreichs Sizilien zu beschreiten."
 sic_restoration_mission_pack_BUTTON_DETAILS:0 "Erobere Neapel jenseits der Meerenge und schmiede das Königreich beider Sizilien, oder poliere die Insel Sizilien selbst zu einem Juwel des Mittelmeers. Auf beiden Wegen liegt der Wohlstand eines neuen Königreichs!"
 sic_divided_kingdom: "Jenseits der Meerenge"
 sic_divided_kingdom_desc: "1282 erhoben wir uns im als Sizilianische Vesper bekannten Aufstand gegen die Herrschaft des Hauses Anjou. Nicht länger fähig, die Tyrannei der französischen Beamten zu ertragen, erhob sich das Volk der Insel als eines zum Klang der Abendglocken und vertrieb die Franzosen von unseren Ufern. Wir hießen Peter III. von Aragón als unseren neuen König willkommen, und das Königreich Sizilien wurde so in zwei geteilt. Jenseits der Meerenge, auf dem Festland um Neapel, nennt sich ein König des Hauses Anjou noch immer „König von Sizilien“. Wir allein sind die rechtmäßigen Könige dieser Insel. Die Rivalität zwischen unseren zwei Reichen dauert bis heute an."
 sic_ambitions_on_naples: "Ambitionen auf Neapel"
 sic_ambitions_on_naples_desc: "Der angiovinische König jenseits der Meerenge steht von Rechts wegen als rivalisierender Anwärter auf den Titel König von Sizilien selbst da. Die Zeit ist gekommen, unser stehendes Heer aufzubauen und die gerechte Sache zu erheben, eines Tages die Krone Neapels für uns selbst zu beanspruchen."
 sic_army_of_the_island: "Die Flotte der Insel"
 sic_army_of_the_island_desc: "Die Insel Sizilien ist eine Festung, von allen Seiten vom Meer umgeben. Um unsere Heere über die Meerenge nach Neapel zu senden, müssen wir zunächst eine mächtige Flotte aufbauen, die sowohl die Verteidigung der Insel als auch die sichere Überfahrt unserer Truppen sichert."
 sic_conquest_of_naples: "Die Eroberung Neapels"
 sic_conquest_of_naples_desc: "Endlich haben unsere Streitkräfte die Meerenge überquert und an den Ufern Neapels gelandet. Wenn wir das angiovinische Heer brechen und die Krone Neapels einnehmen können, wird das 1282 entzweite Königreich noch einmal ganz gemacht werden, unter unserer Herrschaft."
 sic_two_sicilies: "Die beiden Sizilien"
 sic_two_sicilies_desc: "Neapel und Palermo, zwei Kronen, ruhen nun in unseren Händen. Die Zeit ist gekommen, die Gründung eines neuen Königreichs zu verkünden, das beide Ufer der Meerenge umspannt – das Königreich beider Sizilien. Dies ist die historische Tat, die die Teilung von 1282 zu ihrem Ende bringt."
 sic_golden_wheat_fields: "Goldene Weizenfelder"
 sic_golden_wheat_fields_desc: "Seit der Antike wird die Insel Sizilien die Kornkammer des Mittelmeers genannt. Durch die Entwicklung der fruchtbaren Ebenen um Palermo wird ihre reiche Ernte das ganze Königreich nähren, wobei das überschüssige Getreide als wertvolle Handelsware ins Ausland getragen wird."
 sic_palermo_resurgent: "Palermo, wiedererstarkt"
 sic_palermo_resurgent_desc: "In den Tagen des normannischen Königreichs war Palermo eine Stadt unvergleichlichen Glanzes im Mittelmeer. Neue Bauten hier zu errichten und etwas von jenem alten Glanz zurückzugewinnen, wird der erste Schritt zur Entwicklung der ganzen Insel sein."
 sic_mediterranean_crossroads: "Kreuzungspunkt des Mittelmeerhandels"
 sic_mediterranean_crossroads_desc: "Die Insel Sizilien liegt am eigentlichen Kreuzungspunkt des Mittelmeers, wo sich die Handelswege von Ost und West treffen. Durch die Errichtung von Märkten in den Häfen der Insel werden sich Kaufleute aus jedem Land hier versammeln und das Handelseinkommen des Königreichs erheblich steigern."
 sic_sicilian_renaissance: "Die sizilianische Renaissance"
 sic_sicilian_renaissance_desc: "Der sizilianische Hof, wo normannische, arabische, byzantinische und lateinische Kultur zusammentreffen, ist seit langem ein Zentrum von Kunst und Gelehrsamkeit. Die vielen in Palermo versammelten Kunstwerke deuten auf die Morgenröte einer neuen kulturellen Blüte hin."
 sic_kingdom_resurgent: "Das wiedererstarkte Königreich"
 sic_kingdom_resurgent_desc: "Ob als Königreich, das beide Ufer der Meerenge umspannt, oder als Insel, die von Kultur und Handel im Herzen des Mittelmeers erstrahlt, Sizilien hat seinen Namen noch einmal in die Geschichte geschrieben. Von hier aus wird der Weg dieses Königreichs die Morgenröte eines neuen Zeitalters markieren."
 STATIC_MODIFIER_NAME_sic_army_of_the_island_mod: "Die Flotte der Insel"
 STATIC_MODIFIER_DESC_sic_army_of_the_island_mod: "Die neu geordnete Flotte der Insel rühmt sich hoher Moral und reichlicher Manneskraftreserven."
 STATIC_MODIFIER_NAME_sic_conquest_of_naples_mod: "Die Eroberung Neapels"
 STATIC_MODIFIER_DESC_sic_conquest_of_naples_mod: "Nachdem es sich durch den Feldzug in Neapel gekämpft hat, ist die Disziplin des königlichen Heeres gewachsen, und unsere Hand in den Verhandlungen des Krieges ist stärker."
 STATIC_MODIFIER_NAME_sic_two_sicilies_mod: "Die beiden Sizilien"
 STATIC_MODIFIER_DESC_sic_two_sicilies_mod: "Das Ansehen und die Legitimität des neuen Königreichs, das beide Ufer der Meerenge umspannt, waren nie höher."
 STATIC_MODIFIER_NAME_sic_golden_wheat_fields_mod: "Goldene Weizenfelder"
 STATIC_MODIFIER_DESC_sic_golden_wheat_fields_mod: "Das antike Rom nannte Sizilien die „Kornkammer des Reiches“ (Granarium Imperii). Die weiten Weizenfelder des Inselinneren ernährten fortwährend die Mittelmeerwelt. Siziliens landwirtschaftliche Rolle als „Insel des Weizens“ blieb von der Antike bis ins 19. Jahrhundert unverändert und war eine Säule der Ernährungssicherheit des Mittelmeers."
 STATIC_MODIFIER_NAME_sic_palermo_resurgent_mod: "Palermo, wiedererstarkt"
 STATIC_MODIFIER_DESC_sic_palermo_resurgent_mod: "Palermo (im Phönizischen Panormos – „alle Häfen“) ist die größte Stadt Siziliens, wo normannische, arabische und byzantinische Kultur verschmolzen. Der Hof Rogers II. war als einer der verfeinertsten Höfe Europas bekannt und ein multikulturelles Zentrum, in dem Arabisch, Griechisch und Latein nebeneinander verwendet wurden."
 STATIC_MODIFIER_NAME_sic_mediterranean_crossroads_mod: "Kreuzungspunkt des Mittelmeerhandels"
 STATIC_MODIFIER_DESC_sic_mediterranean_crossroads_mod: "Sizilien liegt fast im Mittelpunkt des Mittelmeers und war seit dem Zeitalter, in dem die antiken Phönizier Karthago gründeten, ein Umschlagpunkt des Ost-West-Handels. Syrakus, Geburtsort des griechischen Philosophen Archimedes, und Palermo, von arabischer Kultur durchduftet – diese Insel ist ein wahrer Inbegriff mediterraner Zivilisation."
 STATIC_MODIFIER_NAME_sic_sicilian_renaissance_mod: "Die sizilianische Renaissance"
 STATIC_MODIFIER_DESC_sic_sicilian_renaissance_mod: "Die in Palermo erblühte Kultur hat die Fertigkeit neuer Künstler, die in den Dienst des Königreichs treten, erhöht."
 STATIC_MODIFIER_NAME_sic_kingdom_resurgent_mod: "Das wiedererstarkte Königreich"
 STATIC_MODIFIER_DESC_sic_kingdom_resurgent_mod: "Der Glanz des wiedererstarkten Königreichs hat sein Ansehen und seine Legitimität erhöht und seine Hand in den Verhandlungen des Krieges gestärkt wie nie zuvor."
 sic_events.1.t: "Ein in zwei Teile gespaltenes Königreich"
 sic_events.1.d: "1282 erhoben wir uns gegen die Herrschaft des Hauses Anjou. Nicht länger fähig, die Tyrannei der aus Frankreich entsandten Beamten zu ertragen, erhob sich das Volk der Insel als eines zum Klang der Abendglocken und vertrieb die Franzosen von unseren Ufern. Wir hießen Peter III. von Aragón als unseren neuen König willkommen, und das Königreich Sizilien wurde so in zwei geteilt. Jenseits der Meerenge, auf dem Festland um Neapel, nennt sich ein König des Hauses Anjou noch immer „König von Sizilien“. Wir allein sind die wahren Könige dieser Insel. Die Rivalität zwischen unseren zwei Reichen dauert bis heute an."
 sic_events.1.a: "Verstanden"
