l_german:
 sav_house_of_savoy_mission_pack: "Die Ambitionen des Hauses Savoyen"
 sav_house_of_savoy_mission_pack_DESCRIPTION:0 "Das Haus Savoyen, das die Alpenpässe beherrscht, ist dazu bestimmt, von einem kleinen piemontesischen Herzogtum aufzusteigen, um ganz Italien und Südfrankreich zu beherrschen und das Königreich Italien zu errichten. Manövriere geschickt zwischen Papst, Kaiser und Frankreich; erobere Genua, um Seemacht zu begründen; zerschmettere Lombardei, Toskana und Venedig, um Rom zu beanspruchen. Erhebe dich als Sardinien-Piemont und werde schließlich zum Bannerträger der italienischen Einigung."
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION:0 "Eine als Savoyen Piemont, erobere Italien und Frankreich und errichte das Königreich Italien."
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um die Ambitionen des Hauses Savoyen zu erfüllen."
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS:0 "Überquere die Alpen und eine Italien!"
 sav_the_savoy_ambition: "Die Ambitionen Savoyens"
 sav_the_savoy_ambition_desc: "Das Haus Savoyen nimmt eine einzigartige Stellung am Kreuzungspunkt der Alpen ein, mit Einfluss sowohl auf Italien als auch auf Frankreich. Durch die Beherrschung der fruchtbaren Lande Piemonts und der Alpenhandelswege beginnt dieses kleine Herzogtum seinen Weg zur Größe."
 sav_unify_piedmont: "Piemont einen"
 sav_unify_piedmont_desc: "Die Eingliederung unabhängiger Mächte wie Saluzzo und Montferrat und die Einigung ganz Piemonts ist der erste Schritt zu Savoyens großen Ambitionen."
 sav_glory_of_turin: "Der Ruhm Turins"
 sav_glory_of_turin_desc: "Entwickle Turin, die zentrale Stadt Piemonts, zu einer blühenden Metropole, die der Hauptstadt des Hauses Savoyen würdig ist."
 sav_shroud_of_turin: "Das Turiner Grabtuch"
 sav_shroud_of_turin_desc: "Das Leinentuch, das als Grabtuch Christi gilt, ruht im Turiner Dom. Der Glaube an diese Reliquie bringt dem Reich Wohlstand und Ansehen."
 sav_alpine_roads: "Alpenstraßen"
 sav_alpine_roads_desc: "Die Entwicklung der Straßeninfrastruktur entlang der Alpenhandelswege steigert die Gewinne, die Savoyen zufließen, während Kaufleute zwischen Frankreich und Italien hindurchziehen."
 sav_crossroads_of_europe: "Der Kreuzungspunkt Europas"
 sav_crossroads_of_europe_desc: "Piemont, das Genua, Venedig und Frankreich verbindet, wird zu einer von Europas führenden Handelsdrehscheiben."
 sav_order_of_saints_maurice: "Der Orden der Heiligen Mauritius und Lazarus"
 sav_order_of_saints_maurice_desc: "Der vom Haus Savoyen gegründete Orden der Heiligen Mauritius und Lazarus wird zum Sinnbild religiöser Autorität und Legitimität in der katholischen Welt."
 sav_savoy_academy: "Die Akademie Savoyens"
 sav_savoy_academy_desc: "Die Annahme des Renaissancegeistes und die Entwicklung akademischer Einrichtungen um Turin begründet Savoyen als festes Mitglied des italienischen Kulturkreises."
 sav_alpine_powerhouse: "Alpine Großmacht"
 sav_alpine_powerhouse_desc: "Durch die Einigung Piemonts, kulturelle Entwicklung und wachsende Wirtschaftskraft ist Savoyen als bedeutende Macht um die Alpen anerkannt worden."
 sav_alpine_fortifications: "Alpenbefestigungen"
 sav_alpine_fortifications_desc: "Die volle Nutzung der natürlichen Zerklüftung der Alpen und der Bau gewaltiger Festungen an strategischen Punkten machen Savoyen zu einem uneinnehmbaren Bergstaat."
 sav_diplomatic_balance: "Diplomatisches Gleichgewicht"
 sav_diplomatic_balance_desc: "Für Savoyen, gefangen zwischen Großmächten, ist diplomatisches Geschick unentbehrlich zum Überleben. Die Wahrung eines hohen diplomatischen Ansehens lenkt den Druck mächtiger Nachbarn geschickt ab."
 sav_savoyard_army: "Das savoyische Heer"
 sav_savoyard_army_desc: "Savoyische Soldaten, gehärtet im zerklüfteten Gelände der Alpen, gelten als einige der besten Bergkrieger Europas. Der Aufbau eines stehenden Heeres stützt die militärische Unabhängigkeit des Reiches."
 sav_conquer_genoa: "Genua erobern"
 sav_conquer_genoa_desc: "Die Eroberung Genuas, einer der führenden Seestädte des Mittelmeers, erlaubt Savoyen, seine landumschlossene Lage zu überwinden und den ersten Schritt zu einer Seemacht mit unmittelbarem Mittelmeerzugang zu tun."
 sav_nice_naval_base: "Der Marinestützpunkt Nizza"
 sav_nice_naval_base_desc: "Die Errichtung eines Marinestützpunkts in Nizza an der Mittelmeerküste gibt Savoyen einen Stützpunkt zur Beherrschung des Tyrrhenischen Meeres."
 sav_sardinia_union: "Union mit Sardinien"
 sav_sardinia_union_desc: "Die Einnahme des größten Teils Sardiniens und die Erhebung des Titels „Königreich Sardinien“ erwerben dem Haus Savoyen Anerkennung als eines von Italiens bedeutenden Königshäusern."
 sav_seize_lombardy: "Die Lombardei einnehmen"
 sav_seize_lombardy_desc: "Die Lombardei um Mailand unter savoyische Kontrolle zu bringen, macht Savoyen zum Herrn Norditaliens."
 sav_push_tuscany: "Vorstoß in die Toskana"
 sav_push_tuscany_desc: "Die Unterwerfung der reichen Stadtstaaten der Toskana unter Florenz’ Führung fügt savoyischem Gebiet das Kernland der Renaissancekultur hinzu."
 sav_capture_venice: "Venedig einnehmen"
 sav_capture_venice_desc: "Die Eroberung Venedigs, der Königin der Adria, begründet Savoyens Seehegemonie in Norditalien."
 sav_emilia_and_beyond: "Emilia und darüber hinaus"
 sav_emilia_and_beyond_desc: "Die Einnahme der Region Emilia und die Beherrschung der verbliebenen Gebiete Norditaliens machen die savoyische Hegemonie absolut."
 sav_march_on_naples: "Marsch auf Neapel"
 sav_march_on_naples_desc: "Die Eroberung Neapels, der Schlüsselstadt Süditaliens, bringt die Vollendung der Beherrschung der Halbinsel in Reichweite."
 sav_eternal_rome: "Die Ewige Stadt"
 sav_eternal_rome_desc: "Rom zu beherrschen heißt, Italien zu beherrschen. Nachdem es die Ewige Stadt eingenommen hat, zeigt Savoyen der Welt seine Autorität als rechtmäßiger Herrscher Italiens."
 sav_integrate_geneva: "Genf eingliedern"
 sav_integrate_geneva_desc: "Genf, mit seinen starken Banden zur Schweizerischen Eidgenossenschaft, fest unter savoyische Kontrolle zu bringen, begründet einen Stützpunkt für die Ausdehnung nach Norden."
 sav_control_provence: "Die Provence beherrschen"
 sav_control_provence_desc: "Die Einnahme der Provence entlang der Mittelmeerküste begründet Savoyens Hegemonie in Südfrankreich und öffnet den Weg zu größeren Ambitionen."
 sav_against_the_swiss: "Gegen die Schweizer"
 sav_against_the_swiss_desc: "Die Unterdrückung der trotzig unabhängigen Schweizerischen Eidgenossenschaft und die Einnahme der Westschweiz machen Savoyen zum Herrn westlich des Rheins."
 sav_conquer_burgundy: "Burgund erobern"
 sav_conquer_burgundy_desc: "Die Unterwerfung der reichen Lande, die einst das Herzogtum Burgund beherrschte, öffnet den Weg zum Einfall in Frankreich."
 sav_savoyard_occitania: "Savoyisches Okzitanien"
 sav_savoyard_occitania_desc: "Die Einnahme der okzitanischsprachigen Lande und die Einbeziehung ganz Südfrankreichs in den savoyischen Kulturkreis."
 sav_claim_france: "Frankreich beanspruchen"
 sav_claim_france_desc: "Die Zeit ist gekommen, Paris, die Hauptstadt des Königreichs Frankreich, einzunehmen und die einstige Großmacht, die Savoyen bedrohte, unter unsere Herrschaft zu bringen."
 sav_kingdom_of_italy: "Königreich Italien"
 sav_kingdom_of_italy_desc: "Das Haus Savoyen hat die Alpen überquert, um ganz Italien zu einen, und als Erbe des Römischen Reiches das Königreich Italien gegründet. Der Traum des Risorgimento ist hier verwirklicht."
 STATIC_MODIFIER_NAME_sav_unified_piedmont_mod: "Einigung Piemonts"
 STATIC_MODIFIER_DESC_sav_unified_piedmont_mod: "Piemont – „der Fuß der Berge“ – ist eine fruchtbare Ebene, umringt von Alpen und Apennin, wo die Herren von Savoyen, Montferrat, Saluzzo und andere herrschten. Nur durch ihre Einigung kann Savoyen den Kreuzungspunkt vollständig beherrschen, der die Alpen mit dem Po verbindet."
 STATIC_MODIFIER_NAME_sav_shroud_of_turin_mod: "Der Segen des Grabtuchs"
 STATIC_MODIFIER_DESC_sav_shroud_of_turin_mod: "Das Turiner Grabtuch ist ein Leinentuch, das Christus nach der Kreuzigung eingehüllt haben soll und den schattenhaften Abdruck eines menschlichen Körpers trägt. Seit das Haus Savoyen es 1353 erwarb, wird es als eine der größten Reliquien der katholischen Welt verehrt. Die Debatte über seine Echtheit dauert an, doch sein religiöser und politischer Einfluss steht außer Zweifel."
 STATIC_MODIFIER_NAME_sav_alpine_roads_mod: "Alpenstraßen"
 STATIC_MODIFIER_DESC_sav_alpine_roads_mod: "Der Große Sankt Bernhard, der Mont Cenis und der Sankt Gotthard – die Wege über die Alpen waren von römischer Zeit bis zum Mittelalter die wichtigsten Adern Europas. Savoyen, Herr dieser Pässe, wurde durch Zölle und Handel ungeheuer reich. Seine Rolle als „Torwächter der Alpen“ war die Wurzel seines Wohlstands."
 STATIC_MODIFIER_NAME_sav_crossroads_mod: "Der Kreuzungspunkt Europas"
 STATIC_MODIFIER_DESC_sav_crossroads_mod: "Piemont liegt am Kreuzungspunkt von Frankreich, der Schweiz, Genua und Mailand. Italienische Kaufleute auf dem Weg zu den Champagne-Messen, französische Pilger auf dem Weg nach Rom, Söldner auf dem Weg in die Schweiz – Menschen und Güter aller Art zogen durch Piemont, und indem es den Weg überwachte, monopolisierte Savoyen die Gewinne des Zwischenhandels."
 STATIC_MODIFIER_NAME_sav_order_of_saints_mod: "Der Orden der Heiligen Mauritius und Lazarus"
 STATIC_MODIFIER_DESC_sav_order_of_saints_mod: "Der Orden der Heiligen Mauritius und Lazarus vereinte zwei vom Haus Savoyen gegründete Orden, 1434 beziehungsweise 1572. Der Heilige Mauritius war ein christlicher Märtyrer der römischen Zeit; der Heilige Lazarus wurde als Schutzpatron der Leprakranken verehrt. Der Orden wurde zum Sinnbild der religiösen Autorität des Hauses Savoyen in der katholischen Welt."
 STATIC_MODIFIER_NAME_sav_savoy_academy_mod: "Der Einfluss der Akademie Savoyens"
 STATIC_MODIFIER_DESC_sav_savoy_academy_mod: "In der Renaissance war das Herzogtum Savoyen als Förderer von Gelehrsamkeit und Kunst bekannt. Die 1404 gegründete Universität Turin wurde zum geistigen Zentrum Piemonts und lehrte Recht, Medizin und Theologie. Die Tradition künstlerischer Förderung, die später unter Karl Emanuel I. zur Accademia delle Belle Arti führen sollte, wurzelte auch in diesem Zeitalter."
 STATIC_MODIFIER_NAME_sav_alpine_powerhouse_mod: "Alpine Großmacht"
 STATIC_MODIFIER_DESC_sav_alpine_powerhouse_mod: "„Klein, aber stark“ – Savoyens Stärke lag in der klugen Nutzung seiner Geografie. Umringt von den Großmächten Frankreich, Österreich und Spanien, überlebte es durch gewandte Diplomatie und militärische Strategie, die die Beschaffenheit des Landes nutzte, und wurde schließlich zur „Dynastie der Bestimmung“, die die Einigung Italiens anführte."
 STATIC_MODIFIER_NAME_sav_alpine_fortifications_mod: "Alpenbefestigungen"
 STATIC_MODIFIER_DESC_sav_alpine_fortifications_mod: "Durch die Stationierung von Festungsgruppen wie Briançon, Fenestrelle und Exilles in den natürlichen Bollwerken der Alpen schmiedete Savoyen einen „Schild der Alpen“. Im 17. und 18. Jahrhundert kamen Bastionsfestungen im Stil Vaubans, um diese Pässe zu bewachen, und machten Savoyen zu einem der uneinnehmbarsten Staaten Europas."
 STATIC_MODIFIER_NAME_sav_diplomatic_balance_mod: "Diplomatisches Gleichgewicht"
 STATIC_MODIFIER_DESC_sav_diplomatic_balance_mod: "Das Wesen savoyischer Diplomatie war „immer auf der Seite des Stärkeren stehen“. Auf dem Seil zwischen Frankreich und Österreich balancierend, gewann Savoyen Sardinien im Frieden von Utrecht (1713) und stieg zum Rang eines Königreichs auf. Viktor Amadeus II. verkörperte den Gipfel dieser „ausgleichenden“ Diplomatie."
 STATIC_MODIFIER_NAME_sav_savoyard_army_mod: "Die savoyische Elite"
 STATIC_MODIFIER_DESC_sav_savoyard_army_mod: "Savoyische Soldaten waren Meister des Bergkriegs, geschmiedet im rauen Gelände der Alpen. Die piemontesischen Heeresreformen des 14. und 15. Jahrhunderts begründeten die „Ordinanza Piemontese“, und disziplinierte Fußvolktaktik wurde zur Stärke des savoyischen Heeres. Auch im späteren Risorgimento waren sie die Stütze der Befreiung Norditaliens."
 STATIC_MODIFIER_NAME_sav_conquer_genoa_mod: "Die Einnahme Genuas"
 STATIC_MODIFIER_DESC_sav_conquer_genoa_mod: "Genua, Rivale Venedigs, war einer der größten mittelalterlichen Seestadtstaaten des Mittelmeers und spann ein gewaltiges Handelsnetz über das Schwarze Meer, Nordafrika und Iberien. Es ist auch die Geburtsstätte des Bankwesens (die Bank von San Giorgio gehört zu den ältesten der Welt) und der Versicherung. Die Eroberung dieser „stolzen Republik“ öffnet Savoyen die Tür des Mittelmeers."
 STATIC_MODIFIER_NAME_sav_nice_naval_base_mod: "Der Marinestützpunkt Nizza"
 STATIC_MODIFIER_DESC_sav_nice_naval_base_mod: "Nizza (Nizza Marittima) ist ein antiker Mittelmeerhafen, gegründet als Kolonie des griechischen Massalia (Marseille). Seit das Haus Savoyen es 1388 erwarb, diente dieser Hafen an der Grenze zwischen Frankreich und Italien als Savoyens einziger Marinestützpunkt (er blieb bis 1860 savoyisch)."
 STATIC_MODIFIER_NAME_sav_sardinia_union_mod: "Union mit Sardinien"
 STATIC_MODIFIER_DESC_sav_sardinia_union_mod: "1720, bei den Anpassungen nach dem Frieden von Utrecht, tauschte das Haus Savoyen Sizilien gegen Sardinien ein und erhob sich als „Königreich Sardinien“. Die Union dieser Insel mit dem kontinentalen Piemont wurde zum Fundament, von dem aus Camillo Cavour und Garibaldi die Einigung Italiens (1861) erreichen sollten."
 STATIC_MODIFIER_NAME_sav_seize_lombardy_mod: "Die Einnahme der Lombardei"
 STATIC_MODIFIER_DESC_sav_seize_lombardy_mod: "Die lombardische Ebene gehört zu Europas fruchtbarstem Ackerland, und Mailand ist ihr Zentrum von Industrie und Handel. Die Rückgewinnung dieses reichen, lange von Österreich gehaltenen Landes war das Kernziel des Risorgimento – die konkrete Gestalt von Savoyens Traum."
 STATIC_MODIFIER_NAME_sav_push_tuscany_mod: "Vorstoß in die Toskana"
 STATIC_MODIFIER_DESC_sav_push_tuscany_mod: "Die Toskana, um Florenz gelegen, ist die Geburtsstätte der Renaissancekultur und birgt das größte künstlerische Erbe der Menschheitsgeschichte. Die Uffizien, der Dom, Dantes Verse – alle von den Medici gefördert. Diesen kulturellen Schatz seinem Gebiet hinzuzufügen, würde dem Königreich Savoyen geistliche Autorität verleihen."
 STATIC_MODIFIER_NAME_sav_capture_venice_mod: "Die Einnahme Venedigs"
 STATIC_MODIFIER_DESC_sav_capture_venice_mod: "Venedig, „Königin der Adria“, ist ein wundersamer Stadtstaat, der über tausend Jahre lang seine Unabhängigkeit bewahrte. Eine Stadt der Kanäle, erbaut auf den Inseln einer Lagune, herrschte es durch sein Monopol auf den Osthandel und seine überragende Schiffbaukunst, das Arsenale, als Herr des Mittelmeers. Diese unbezwungene Stadt zu erobern, wäre eine Großtat der Geschichte."
 STATIC_MODIFIER_NAME_sav_emilia_and_beyond_mod: "Emilia und darüber hinaus"
 STATIC_MODIFIER_DESC_sav_emilia_and_beyond_mod: "Bologna, Parma, Modena und Ferrara, entlang der Via Emilia aufgereiht, waren seit dem Mittelalter als Zentren von Speise, Kultur und Gelehrsamkeit bekannt. Bologna beherbergt die älteste Universität Europas (gegründet 1088), und ihre geistige Tradition würde die kulturelle Tiefe des Königreichs Savoyen vertiefen."
 STATIC_MODIFIER_NAME_sav_march_on_naples_mod: "Marsch auf Neapel"
 STATIC_MODIFIER_DESC_sav_march_on_naples_mod: "So schön, dass es zu dem Spruch „Neapel sehen und sterben“ Anlass gab, blühte diese Stadt seit der Antike als eine der größten Städte des Mittelmeers. Neapel, das eine bewegte Geschichte unter angiovinischer, aragonesischer, spanischer und bourbonischer Herrschaft durchlief, war das letzte große Hindernis der italienischen Einigung."
 STATIC_MODIFIER_NAME_sav_eternal_rome_mod: "Die Ewige Stadt"
 STATIC_MODIFIER_DESC_sav_eternal_rome_mod: "„Alle Wege führen nach Rom“ – Hauptstadt des antiken Römischen Reiches, Sitz der katholischen Kirche, Zentrum der Renaissancekultur, Rom ist das Sinnbild der westlichen Zivilisation. Das Kolosseum, das Pantheon, der Petersdom – eine Stadt von solchem geschichtlichen Gewicht zur eigenen Hauptstadt zu machen, bedeutet die Vollendung der italienischen Einigung."
 STATIC_MODIFIER_NAME_sav_integrate_geneva_mod: "Die Eingliederung Genfs"
 STATIC_MODIFIER_DESC_sav_integrate_geneva_mod: "Genf stand einst unter dem Einfluss der Grafen von Savoyen, doch 1536 machte Johannes Calvin es zur Basis der Reformation, und es wurde zum „protestantischen Rom“. Diese Seenstadt wieder einzugliedern, wäre ein wichtiger Stützpunkt für Savoyens Ausdehnung Richtung Schweiz."
 STATIC_MODIFIER_NAME_sav_control_provence_mod: "Die Beherrschung der Provence"
 STATIC_MODIFIER_DESC_sav_control_provence_mod: "Die Provence war einst Domäne des Hauses Anjou und wurde nach dem Tod König Renés (1480) der französischen Krone einverleibt. Die Lavendelfelder, Olivenhaine und Weinberge der Mittelmeerküste – dieses reiche Land Südfrankreichs wäre der Schlüssel, um Savoyens Gebiet erheblich zu erweitern."
 STATIC_MODIFIER_NAME_sav_against_the_swiss_mod: "Gegen die Schweizer"
 STATIC_MODIFIER_DESC_sav_against_the_swiss_mod: "Die Schweizerische Eidgenossenschaft ist ein Land unbezwingbarer Bergkrieger, die Karl den Kühnen, Herzog von Burgund, 1476–1477 bei Grandson und Murten besiegten. Diesen mächtigen Nachbarn zu unterwerfen, ist keine leichte Aufgabe, doch für Savoyen, das Schweizer Söldner (Landsknechte) als Hofgarde nutzte, wäre die Beherrschung ihrer Heimat der größte militärische Sieg."
 STATIC_MODIFIER_NAME_sav_conquer_burgundy_mod: "Die Eroberung Burgunds"
 STATIC_MODIFIER_DESC_sav_conquer_burgundy_mod: "Burgund, eine Nebenlinie der Valois, beherrschte auf seinem Höhepunkt ein gewaltiges „Zwischenreich“, das sich von den Niederlanden bis Burgund erstreckte. Mit dem Tod Karls des Kühnen (1477) wieder von Frankreich einverleibt, würde diese reiche, für Wein und Küche berühmte Provinz zu einem wichtigen Stützpunkt für den Einfall in Frankreich werden."
 STATIC_MODIFIER_NAME_sav_savoyard_occitania_mod: "Savoyisches Okzitanien"
 STATIC_MODIFIER_DESC_sav_savoyard_occitania_mod: "Die okzitanischsprachigen Völker Südfrankreichs brachten die Kultur der Troubadoure hervor, wurden aber durch den Albigenserkreuzzug des 13. Jahrhunderts verwüstet. Begraben unter der Verfolgung der Katharer und der Herrschaft der französischen Krone, belebt sich die Tradition okzitanischer Selbstverwaltung unter dem Banner Savoyens neu."
 STATIC_MODIFIER_NAME_sav_claim_france_mod: "Der Anspruch auf Frankreich"
 STATIC_MODIFIER_DESC_sav_claim_france_mod: "Frankreich war für Savoyen stets zugleich Bedrohung und Verlockung. Im Zeitalter Napoleons (geboren als Korse, doch Nachbar von Nizza) wurde Savoyen von Frankreich verschluckt. Nun das Gegenteil – eine große Umkehr, in der Savoyen den Thron des französischen Königs an sich reißt."
 STATIC_MODIFIER_NAME_sav_kingdom_of_italy_mod: "Königreich Italien"
 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "Am 17. März 1861 bestieg Viktor Emanuel II. (König von Sardinien) als erster König des Königreichs Italien den Thron – so geschah es in der wirklichen Geschichte. Das größte politische Wunder des 19. Jahrhunderts, das Cavours Diplomatie, Garibaldis Waffen und Mazzinis Ideale verschmolz, wird hier vierhundert Jahre früher erreicht."
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "Der Ruhm Turins"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "Der Freiluftmarkt des „Balôn“, die Langhe-Hügel, die Barolo und Barbaresco hervorbringen, der prächtige Piazza San Carlo – Turin ist die Hauptstadt, die das Haus Savoyen zu Italiens führender Planstadt formte. Als Erbe des Rastermusters des römischen Augusta Taurinorum weist diese Stadt das feinste Erscheinungsbild südlich der Alpen auf."
 sav_events.1.t: "Die Ambitionen des Hauses Savoyen"
 sav_events.1.d: "Das Herzogtum Savoyen beherrscht die strategischen Pässe der Alpen, die Nord- und Südeuropa verbinden. Mit Frankreich und Italien zu beiden Seiten erwacht dieses kleine Fürstentum zu großen Ambitionen. Das savoyische Wappen – ein weißes Kreuz auf rotem Schild – wird eines Tages über ganz Italien wehen. Eine Piemont, erobere Genua, nimm Rom ein und gründe das Königreich Italien – der tausendjährige Traum des Hauses Savoyen steht kurz vor seinem Beginn."
 sav_events.1.a: "Erhebe den Ruhm des Hauses Savoyen!"
 sav_events.2.t: "Der Ruhm Turins"
 sav_events.2.d: "Unter der Herrschaft des Hauses Savoyen entwickelt sich Turin rasch. Mit Palästen und Kirchen, die überall in der Stadt emporsteigen, und Gelehrten und Künstlern, die sich hier versammeln, tritt diese Stadt als kulturelles und politisches Zentrum Norditaliens hervor. Die Blüte Turins als Hauptstadt, die des Hauses Savoyen würdig ist, wird zum Fundament für den Wohlstand des gesamten Reiches."
 sav_events.2.a: "Turin ist die strahlende Hauptstadt des Hauses Savoyen"
 sav_woolens_of_piedmont: "Die Wollindustrie Piemonts"
 sav_woolens_of_piedmont_desc: "Piemont ist als einer von Italiens führenden Erzeugern von Wolle und Tuch bekannt. Hochwertige Wollerzeugung und Tuchverarbeitung bilden das kaufmännische Fundament savoyischen Reichtums."
 sav_nebbiolo_vineyards: "Die Nebbiolo-Weinberge"
 sav_nebbiolo_vineyards_desc: "Die Nebbiolo-Traube, angebaut in den Langhe-Hügeln Piemonts, ist der Ursprung so berühmter Weine wie Barolo und Barbaresco. Piemontesische Weine werden in ganz Europa ausgeführt und bringen großen Gewinn."
 sav_casa_savoia: "Die Autorität des Hauses Savoyen"
 sav_casa_savoia_desc: "Die Herrschaft des Hauses Savoyen hat sich gefestigt, und seine Autorität ist nun weithin im In- und Ausland anerkannt. Rechtmäßige, stabile Regierung ist das Fundament, das Savoyen zu einer bedeutenden italienischen Macht erhebt."
 sav_ordinanza_piedmontese: "Die Ordinanza Piemontese"
 sav_ordinanza_piedmontese_desc: "Im 15. Jahrhundert begründete Savoyen eine eigenständige Fußvolktaktik – die Ordinanza Piemontese –, geschmiedet im alpinen Hochland. Disziplinierte Pikenformationen sind das Rückgrat savoyischer Militärstärke."
 sav_university_of_turin: "Die Universität Turin"
 sav_university_of_turin_desc: "1404 gegründet, dient die Universität Turin als geistiges Herz Piemonts und lehrt Recht, Medizin und Theologie. Savoyens geistiges Erbe stützt die Blüte der Renaissancekultur."
 sav_corsica_seized: "Korsika eingenommen"
 sav_corsica_seized_desc: "Die Einnahme Korsikas, lange von Genua beherrscht, bringt Savoyens Herrschaft über das westliche Tyrrhenische Meer erheblich voran."
 sav_towers_of_sardinia: "Die Türme Sardiniens"
 sav_towers_of_sardinia_desc: "Seit dem Mittelalter säumen unzählige Wachtürme (Torre Costiera) die sardische Küste. Die Entwicklung und Stärkung dieser Verteidigungsanlagen schützt Sardinien vor Piratenüberfällen."
 sav_cagliari_development: "Die Entwicklung Cagliaris"
 sav_cagliari_development_desc: "Cagliari, die Hauptstadt Sardiniens, zu einer bedeutenden Hafenstadt und Handelsdrehscheibe im westlichen Mittelmeer zu entwickeln."
 sav_tyrrhenian_sea: "Herr des Tyrrhenischen Meeres"
 sav_tyrrhenian_sea_desc: "Nachdem es sowohl Korsika als auch Sardinien eingenommen und eine mächtige Flotte aufgebaut hat, hat Savoyen die vollständige Beherrschung des Tyrrhenischen Meeres begründet. Der Handel im westlichen Mittelmeer fällt unter savoyischen Schutz."
 sav_languedoc: "Die Beherrschung Languedocs"
 sav_languedoc_desc: "Die Einnahme Languedocs, eines Schlüsselpunkts Südfrankreichs. Die Einnahme der zwei großen Städte Montpellier und Toulouse wird zu einem Stützpunkt für die Beherrschung ganz Südfrankreichs."
 sav_gascony: "Gascogne eingenommen"
 sav_gascony_desc: "Die Gascogne, um Bordeaux gelegen, ist ein reiches, dem Atlantik zugewandtes Weinbauland. Trenne seine lange historische Bindung an England und füge dieses Land savoyischem Gebiet hinzu."
 sav_lyon_gateway: "Das Tor von Lyon"
 sav_lyon_gateway_desc: "Am Zusammenfluss von Rhône und Saône gelegen, ist Lyon die Handelsdrehscheibe, die Süd- und Nordfrankreich verbindet. Die Einnahme dieser Stadt öffnet den Weg in das französische Landesinnere."
 sav_loire_valley: "Das Loiretal"
 sav_loire_valley_desc: "Das Loiretal – der „Garten Frankreichs“ – wo einst die Schlösser der französischen Königsfamilie standen. Die Einnahme Nantes’ und Tours’ bedeutet die Eroberung West-Zentralfrankreichs."
 sav_normandy_coast: "Die normannische Küste"
 sav_normandy_coast_desc: "Die Einnahme der Normandie, der historischen Küste, an der einst die Normannen landeten. Rouen, im Herzen dieses reichen Landes, ist ein Schlüsselpunkt Nordfrankreichs und die letzte Schranke vor Paris."
 STATIC_MODIFIER_NAME_sav_woolens_of_piedmont_mod: "Die piemontesische Wollindustrie"
 STATIC_MODIFIER_DESC_sav_woolens_of_piedmont_mod: "Piemont war eine hervorragende Wollregion, deren Schafe auf den hohen Alpweiden gehalten wurden. Der Bezirk Biella insbesondere war vom Mittelalter bis heute als eine von Europas feinsten Quellen für Wolle und feinen Stoff bekannt, und „piemontesische Wolle“ stand neben englischer Wolle als Zeichen höchster Qualität."
 STATIC_MODIFIER_NAME_sav_nebbiolo_vineyards_mod: "Die Nebbiolo-Weinberge"
 STATIC_MODIFIER_DESC_sav_nebbiolo_vineyards_mod: "Aus der Nebbiolo-Traube, angebaut auf den Langhe-Hügeln Piemonts, entstehen Barolo, „der König der Weine“, und Barbaresco, „der Wein der Königin“. Die Aufzeichnungen über ihren Anbau reichen bis ins 13. Jahrhundert zurück, und sie wurde selbst am savoyischen Hof geschätzt – der Stolz Piemonts, weltweit noch immer geliebt als Gipfel des italienischen Weins."
 STATIC_MODIFIER_NAME_sav_casa_savoia_mod: "Die Autorität des Hauses Savoyen"
 STATIC_MODIFIER_DESC_sav_casa_savoia_mod: "Das Haus Savoyen ist eine der langlebigsten Dynastien Europas und führt seinen Ursprung auf Humbert Weißhand im 11. Jahrhundert zurück. Sein über siebenhundertjähriges Überleben als „älteste Dynastie“, das schließlich zum Königshaus des Königreichs Italien wurde, zeigt eine in der Geschichte europäischer Königshäuser seltene Ausdauer."
 STATIC_MODIFIER_NAME_sav_ordinanza_piedmontese_mod: "Die Ordinanza Piemontese"
 STATIC_MODIFIER_DESC_sav_ordinanza_piedmontese_mod: "Die „Ordinanza Piemontese“, im 15. Jahrhundert vom Herzogtum Savoyen organisiert, war ein diszipliniertes stehendes Heeressystem, zentriert auf Pikenfußvolk. Auf den Taktiken Schweizer Söldner aufbauend, dabei eigene Verfeinerungen hinzufügend, wurde sie zum Fundament des späteren sardinischen Heeres und zum Vorläufer der Heere, die die Einigungskriege des Risorgimento führten."
 STATIC_MODIFIER_NAME_sav_university_of_turin_mod: "Der Einfluss der Universität Turin"
 STATIC_MODIFIER_DESC_sav_university_of_turin_mod: "1404 gegründet, ist die Universität Turin eine der ältesten Universitäten Norditaliens. Beginnend mit drei Fakultäten – Recht, Medizin und Theologie – brachte sie später bedeutende Geister wie Cesare Beccaria (den Strafrechtsreformer) und Lagrange (den Mathematiker) hervor und wurde zum geistigen Herz des aufgeklärten Piemont."
 STATIC_MODIFIER_NAME_sav_corsica_seized_mod: "Korsika eingenommen"
 STATIC_MODIFIER_DESC_sav_corsica_seized_mod: "Korsika ist ein Schlüssel zum westlichen Mittelmeer, das Genua seit 1284 beherrscht hatte. Als Genua es 1768 an Frankreich verkaufte, wurde Napoleon Bonaparte im folgenden Jahr als „Franzose“ geboren – eine Ironie der Geschichte. Diese Insel einzunehmen würde die Beherrschung des westlichen Tyrrhenischen Meeres sichern."
 STATIC_MODIFIER_NAME_sav_towers_of_sardinia_mod: "Die Türme Sardiniens"
 STATIC_MODIFIER_DESC_sav_towers_of_sardinia_mod: "Entlang der Küsten Sardiniens stehen verstreut die „torri costiere“ (Küstentürme), erbaut vom Mittelalter bis in die frühe Neuzeit. Dieses Verteidigungssystem, errichtet zur Beobachtung von Barbareskenüberfällen, zählte auf seinem Höhepunkt mehr als hundert Türme und diente als Alarmnetz, das die Inselbewohner vor Gefahr warnte."
 STATIC_MODIFIER_NAME_sav_cagliari_development_mod: "Der Wohlstand Cagliaris"
 STATIC_MODIFIER_DESC_sav_cagliari_development_mod: "Cagliari (Karalis) ist eine von den Phöniziern gegründete Hafenstadt und ein wichtiges Verwaltungszentrum römischer Zeit. Als Hauptstadt Sardiniens, in der Mitte des Mittelmeers, wurde es zu einer Handelsdrehscheibe mit Tunesien, Spanien und Italien und blieb unter aragonesischer Herrschaft ein Schlüsselpunkt des westlichen Mittelmeerhandels."
 STATIC_MODIFIER_NAME_sav_tyrrhenian_sea_mod: "Herr des Tyrrhenischen Meeres"
 STATIC_MODIFIER_DESC_sav_tyrrhenian_sea_mod: "Das Tyrrhenische Meer ist ein Binnenmeer des Mittelmeers, umringt von der italienischen Halbinsel, Sizilien, Korsika und Sardinien – ein Meer der Geschichte, auf dem die antiken Phönizier, Griechen und Römer Handel trieben. Durch die Beherrschung Korsikas und Sardiniens kann man dieses gesamte Binnenmeer beherrschen und einen Stützpunkt für den Vorstoß ins östliche Mittelmeer gewinnen."
 STATIC_MODIFIER_NAME_sav_languedoc_mod: "Die Beherrschung Languedocs"
 STATIC_MODIFIER_DESC_sav_languedoc_mod: "Languedoc („das Land der Oc-Sprache“) bezeichnet die okzitanischsprachige Region Südfrankreichs. Diese Region, mit Toulouse als Hauptstadt, rühmte sich einer eigenen Kultur, Politik und Religion (Katharismus), bis sie im Albigenserkreuzzug des 13. Jahrhunderts von der französischen Krone erobert wurde. Ihre Glut glimmt, zusammen mit der Provence, noch immer als eine dem Süden Frankreichs eigene Zivilisation."
 STATIC_MODIFIER_NAME_sav_gascony_mod: "Gascogne eingenommen"
 STATIC_MODIFIER_DESC_sav_gascony_mod: "Die Gascogne ist eine Region Südwestfrankreichs baskischen Ursprungs, bekannt für den atlantischen Weinhandel Bordeaux’, den Hafen Bayonne und den Armagnac. Seit der Heirat Eleonores von Aquitanien eng an England gebunden, war sie auch das letzte Hauptschlachtfeld des Hundertjährigen Krieges."
 STATIC_MODIFIER_NAME_sav_lyon_gateway_mod: "Das Tor von Lyon"
 STATIC_MODIFIER_DESC_sav_lyon_gateway_mod: "Lyon (Lugdunum) wurde als Hauptstadt der römischen Provinz Gallien gegründet und ist ein Kreuzungspunkt der Kommunikation. Im Mittelalter hielt es die größten regelmäßigen Messen Frankreichs nach denen der Champagne ab, wo sich Kaufleute aus Italien, Flandern und Deutschland versammelten. Seine Lage am Zusammenfluss von Rhône und Saône sicherte seinen Rang als Handelsstadt durch geografische Notwendigkeit."
 STATIC_MODIFIER_NAME_sav_loire_valley_mod: "Das Loiretal"
 STATIC_MODIFIER_DESC_sav_loire_valley_mod: "Im Loiretal, dem „Garten Frankreichs“, stehen Renaissanceschlösser wie Chambord, Chenonceau und Amboise. Die französischen Könige des 15. und 16. Jahrhunderts liebten die Region wegen ihres milderen Klimas als Paris, ihrer reichen Vorräte und ihrer Sicherheit zur Verteidigung. Dieses schöne Land zu beherrschen bedeutet, das Zentrum der französischen Kultur zu halten."
 STATIC_MODIFIER_NAME_sav_normandy_coast_mod: "Die normannische Küste"
 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "Die Normandie ist das Land, das die Wikinger (Nordmänner, die Normannen) 911 vom französischen König erhielten. Wilhelm des Eroberers Invasion Englands 1066, das größte Schlachtfeld des Hundertjährigen Krieges, die Landung in der Normandie 1944 – dieses Land war stets ein Wendepunkt der Geschichte. In Rouen wurde auch Jeanne d’Arc hingerichtet."
 sav_events.3.t: "Die Bildung Sardinien-Piemonts"
 sav_events.3.d: "Nachdem es fast ganz Sardinien eingenommen hat, hat das Haus Savoyen beschlossen, förmlich den Titel „König von Sardinien“ anzunehmen. In der Geschichte (1720) erwarb Savoyen Sardinien infolge des Spanischen Erbfolgekriegs und errichtete das „Königreich Sardinien“. Dieses Doppelkönigreich Sardinien-Piemont wird zur Wiege der italienischen Einigung werden. Durch die Vereinigung des kontinentalen Piemont mit der Insel Sardinien wird dieses Königreich als bedeutende Macht in Norditalien hervortreten."
 sav_events.3.a: "Werde als König von Sardinien zum Bannerträger der italienischen Einigung!"
 sav_franchises: "Savoyische Franchisen"
 sav_franchises_desc: "Im mittelalterlichen Piemont verlieh das Haus Savoyen verschiedenen Städten Stadtrechte, bekannt als „Franchisen“. Durch die Gewährleistung von Zugfreiheit, bäuerlicher Freistellung und erweiterten Handelsrechten für Kaufleute belebt dieses System den städtischen Wettbewerb und Piemonts Aufschwung. Die Vollendung dieser Mission erlaubt die Verleihung des Stadtrechts „Savoyische Franchisen“ an Orte."
 sav_franchises_unlock_tt: "Das Stadtprivileg „Franchisen“ wird verfügbar."
 sav_patria_legis: "Savoyen-Aostatal"
 sav_patria_legis_desc: "Die „Patria Legis“ verschmilzt die überlieferten Selbstverwaltungspraktiken des Aostatals mit den Regierungsidealen des Hauses Savoyen zu einem rationalen Rechtsrahmen, der den Renaissancegeist widerspiegelt. Die Vollendung dieser Mission erlaubt die Verleihung des Stadtrechts „Savoyen-Aostatal“ an Orte."
 sav_patria_legis_unlock_tt: "Das Stadtprivileg „Patria Legis“ wird verfügbar."
 franchises: "Franchisen"
 franchises_desc: "Vom Haus Savoyen begründete Stadtrechte, die Zugfreiheit der Bevölkerung, bäuerliche Freistellung und erweiterte Handelsrechte für Kaufleute gewährleisten."
 patria_legis: "Patria Legis"
 patria_legis_desc: "Stadtrechte, die die Traditionen des Aostatals mit savoyischen Rechtsgrundsätzen verschmelzen und städtischen Wohlstand, soziale Mobilität und Produktionseffizienz bringen."
