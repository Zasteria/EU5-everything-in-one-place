l_german:
 geo_georgia_mission_pack: "Das Goldene Vlies – Königreich des Kaukasus"
 geo_georgia_mission_pack_DESCRIPTION:0 "Unter der Bagrationi-Dynastie steht das Königreich Georgien am Kreuzungspunkt des Kaukasus. Eine das Reich, beanspruche die Hegemonie über den Kaukasus und die Steppe, oder marschiere als Kreuzfahrer nach Anatolien und ins Heilige Land – und lass das Licht der Orthodoxie über den Osten scheinen."
 geo_georgia_mission_pack_CRITERIA_DESCRIPTION:0 "Eine Georgien wieder, beherrsche den Kaukasus und ziehe nach Süden in den Kreuzzug, um ein neues goldenes Zeitalter zu verwirklichen."
 geo_georgia_mission_pack_BUTTON_TOOLTIP:0 "Werde vom Land des Goldenen Vlieses aus zum Hegemon des Kaukasus."
 geo_georgia_mission_pack_BUTTON_DETAILS:0 "Stelle den Ruhm Königin Tamars wieder her – von einem Bergkönigreich zum Beschützer der orthodoxen Welt!"
 geo_bagrationi_legacy: "Das Erbe der Bagrationi"
 geo_bagrationi_legacy_desc: "Die Blutlinie des Hauses Bagrationi beherrscht den Kaukasus. Erbe dieses Vermächtnis und beginne ein neues Zeitalter der Regierung."
 geo_royal_succession: "Die Thronfolge sichern"
 geo_royal_succession_desc: "Unterdrücke die Ambitionen des Adels und die Streitigkeiten um den Thron und begründe eine rechtmäßige Herrschaft."
 geo_reunite_georgia: "Georgien wiedervereinen"
 geo_reunite_georgia_desc: "Tiflis, Kutaissi, Achalziche, Batumi – vereine die zersplitterten Provinzen Georgiens unter einer Krone."
 geo_fortify_caucasia: "Den Kaukasus befestigen"
 geo_fortify_caucasia_desc: "Härte die zerklüfteten Berge mit einem Festungsnetz und schlage die Einfälle von Heiden und Eroberern gleichermaßen zurück."
 geo_church_of_georgia: "Die georgische Kirche"
 geo_church_of_georgia_desc: "Mache die autokephale georgisch-orthodoxe Kirche zu einer Säule des Staates und schmiede Einheit durch den Glauben."
 geo_royal_court: "Der königliche Hof"
 geo_royal_court_desc: "Schmücke den königlichen Hof von Tiflis und mache ihn zum Zentrum von Kultur und Autorität, dem der ganze Kaukasus nicht gleichkommt."
 geo_georgian_army: "Das georgische Heer"
 geo_georgian_army_desc: "Schmiede ein mächtiges Heer aus den Bergvölkern und mache es zum Schwert des Königreichs."
 geo_recover_strength: "Kraft zurückgewinnen"
 geo_recover_strength_desc: "Stelle die durch wiederholte Not geschwundene Kraft wieder her und öffne durch Bündnis und Wiederbewaffnung eine neue Zukunft."
 geo_queen_tamar_ambition: "Königin Tamars Ambition"
 geo_queen_tamar_ambition_desc: "Die Lande Armeniens, einst Teil von Königin Tamars Herrschaftsgebiet – befreie unsere christlichen Brüder von heidnischer Herrschaft und stelle Tiflis’ Autorität wieder her."
 geo_reclaim_shirvan: "Schirwan zurückgewinnen"
 geo_reclaim_shirvan_desc: "Gewinne Schirwan zurück, einst unter georgischer Oberhoheit, und gewinne einen Stützpunkt am Kaspischen Meer."
 geo_heirs_of_seljuks: "Erben der Seldschuken"
 geo_heirs_of_seljuks_desc: "Gewinne die östlichen Lande von den Mächten zurück, die das seldschukische Erbe geerbt haben, und stelle die Autorität des Kreuzes in dieser Region wieder her."
 geo_gates_of_alexander: "Die Tore Alexanders"
 geo_gates_of_alexander_desc: "Überquere die sogenannten „Tore Alexanders“ durch den Kaukasus und unterwirf die Stämme des Nordens."
 geo_bane_of_khagan: "Der Fluch des Khagans"
 geo_bane_of_khagan_desc: "Die Nachkommen der Mongolen bedrohen weiterhin die orthodoxe Welt. Setze ihrer Herrschaft ein Ende und beseitige diesen Fluch für immer."
 geo_seize_crimea: "Die Krim einnehmen"
 geo_seize_crimea_desc: "Unterwirf die Halbinsel Krim, der Tataren letztes Refugium, und sichere unsere Herrschaft über das Schwarze Meer."
 geo_control_black_sea: "Das Schwarze Meer beherrschen"
 geo_control_black_sea_desc: "Nachdem wir den größten Teil der Schwarzmeerküste eingenommen haben, gliedere dieses Binnenmeer vollständig in Georgiens Handelssphäre ein."
 geo_envoy_to_tsar: "Ein Gesandter zum Zaren"
 geo_envoy_to_tsar_desc: "Sende einen Gesandten zum Zaren, der als beherrschende Macht der Rus aufgestiegen ist, und suche den Weg des Bündnisses."
 geo_caucasus_hegemony: "Die Hegemonie des Kaukasus"
 geo_caucasus_hegemony_desc: "Berge, Steppe und das Schwarze Meer – vollende eine unerschütterliche Hegemonie über den gesamten Kaukasus."
 geo_deal_with_trebizond: "Der Umgang mit Trapezunt"
 geo_deal_with_trebizond_desc: "Das Reich von Trapezunt, mit Königin Tamars Hilfe gegründet – erneuere das Band mit diesem alten Freund und wähle gemeinsam einen Weg voran."
 geo_conquer_jalayirids: "Das Sultanat der Dschalairiden unterwerfen"
 geo_conquer_jalayirids_desc: "Inmitten des Chaos nach dem Zusammenbruch des Ilkhanats ist das Sultanat der Dschalairiden in diesem Land aufgestiegen – unterwirf diesen Erben des mongolischen Erbes und öffne den Weg nach Osten."
 geo_encroach_mamluks: "In die Mamluken eindringen"
 geo_encroach_mamluks_desc: "Das Heilige Land, von den Kreuzfahrern von einst verloren – dringe in den mamlukisch beherrschten Osten vor und bereite dich vor, das Licht des Glaubens zurückzugewinnen."
 geo_conquer_cyprus: "Zypern erobern"
 geo_conquer_cyprus_desc: "Nimm Zypern ein, ein Bollwerk des östlichen Mittelmeers, und begründe Hegemonie über die Region gemeinsam mit den örtlichen Kreuzfahrermächten."
 geo_cradle_of_civilization: "Wiege der Zivilisation"
 geo_cradle_of_civilization_desc: "Befreie Mesopotamien, Wiege der menschlichen Zivilisation, von muslimischer Herrschaft und beanspruche seinen Reichtum für Georgien."
 geo_claim_holy_city: "Die Heilige Stadt beanspruchen"
 geo_claim_holy_city_desc: "Solange Jerusalem unter sarazenischer Herrschaft liegt, schwebt eine dunkle Wolke über der Christenheit. Gewinne die Heilige Stadt zurück und beweise den Triumph des Glaubens."
 geo_light_of_east: "Licht des Ostens"
 geo_light_of_east_desc: "Alexandria, Jerusalem, Antiochia – befreie die alten östlichen Patriarchate und zeige der Welt, dass das Licht des Ostens nicht erloschen ist."
 geo_anatolian_incursion: "Der anatolische Einfall"
 geo_anatolian_incursion_desc: "Seit der Niederlage bei Manzikert ist Anatolien an türkische Mächte gefallen – räche diese Niederlage und werde der neue Hegemon dieses Landes."
 geo_empires_downfall: "Der Untergang des Reiches"
 geo_empires_downfall_desc: "Das Osmanische Reich, beherrschend über Balkan und Naher Osten – verweise diese Bedrohung der ganzen Christenheit in die Seiten der Geschichte."
 geo_throne_of_romans: "Der Thron der Römer"
 geo_throne_of_romans_desc: "Die große Stadt Konstantinopel liegt lange in heidnischer Hand. Befreie dieses Juwel und nimm den römischen Thron als georgischer Kaiser ein."
 geo_beacon_of_christendom: "Leuchtfeuer der Christenheit"
 geo_beacon_of_christendom_desc: "Nachdem wir die Macht der Orthodoxie wiederhergestellt haben, ist die Zeit gekommen, der Welt unsere Frömmigkeit und gottgegebene Rechtschaffenheit zu beweisen – mache unser Reich zu einem geeinten Paradies der Christenheit."
 geo_georgian_crusader_realm: "Das georgische Kreuzfahrerreich"
 geo_georgian_crusader_realm_desc: "Vom Kaukasus bis zum Mittelmeer – dieses große, unter dem Kreuz errichtete Reich ist die Erfüllung von Königin Tamars Traum."
 geo_rebuild_tbilisi: "Tiflis wiederaufbauen"
 geo_rebuild_tbilisi_desc: "Unsere Hauptstadt Tiflis, abgenutzt durch wiederholte fremde Invasionen – mache dich daran, ihren einstigen Glanz wiederherzustellen."
 geo_georgian_vineyards: "Georgische Weinberge"
 geo_georgian_vineyards_desc: "Georgiens über tausend Jahre alte Weinbautradition – lass diese stolze Industrie der Welt bekannt werden."
 geo_revive_literature: "Die einheimische Literatur wiederbeleben"
 geo_revive_literature_desc: "Assomtawruli, Nuschuri, Mchedruli – drei Schriften, die georgisches Erbe tragen. Belebe diese Kultur wieder und verbreite ihre Sprache und Schrift über den ganzen Kaukasus."
 geo_legacy_of_builder: "Das Erbe des Erbauers"
 geo_legacy_of_builder_desc: "Der Herrschaft Davids des Erbauers folgend, bringe Ruhm, Reichtum und Bedeutung in unsere Städte."
 geo_svetitskhoveli_cathedral: "Die Kathedrale von Swetizchoweli"
 geo_svetitskhoveli_cathedral_desc: "Die Kathedrale der Lebenden Säule, Herz der georgisch-apostolischen Kirche – baue sie zu einem Glanz wieder auf, größer als je zuvor."
 geo_patriarchate_of_georgia: "Patriarchat von ganz Georgien"
 geo_patriarchate_of_georgia_desc: "Während der Einfluss des Staates wächst, wächst auch der Ruf, die autokephale georgische Kirche zum Rang eines Patriarchats zu erheben."
 geo_silk_road_trade: "Der Handel auf der Seidenstraße"
 geo_silk_road_trade_desc: "Als Knotenpunkt, der Ost und West entlang der Seidenstraße verbindet, fülle Georgiens Städte mit dem Reichtum des Handels."
 geo_mountain_fortresses: "Bergfestungen"
 geo_mountain_fortresses_desc: "Nutze das zerklüftete Gelände des Kaukasus und vollende ein Festungsnetz, das jedes Heer aufhalten kann."
 geo_golden_age: "Das goldene Zeitalter vollendet"
 geo_golden_age_desc: "Das von Königin Tamar und David dem Erbauer errichtete goldene Zeitalter – erhebe seinen Ruhm zu beispiellosen Höhen."
 geo_events.1.t: "Der Fall von Sarai"
 geo_events.1.d: "Sarai, Hauptstadt des mongolischen Nachfolgestaates, ist in unsere Hände gefallen. Die Autorität des Khagans, die einst die orthodoxe Welt erschütterte, gehört nun der Vergangenheit an."
 geo_events.1.a: "Der Fluch des Khagans hat ein Ende gefunden!"
 geo_events.2.t: "Der Fall Konstantinopels"
 geo_events.2.d: "Die große Kaiserstadt Konstantinopel ist endlich in unsere Hände gefallen. Das georgische Banner weht nun über dieser Stadt, einst vom Ungläubigen gehalten – der König des Kaukasus beansprucht den Titel des Erben Roms."
 geo_events.2.a: "Es lebe das Römische Reich! Es lebe der georgische Kaiser!"
 geo_events.99.t: "Die Verkündung des goldenen Zeitalters"
 geo_events.99.d: "Vom Kaukasus bis zum Mittelmeer – das goldene Zeitalter, von dem Königin Tamar einst träumte, ist nun vollendet. Ein kleines Bergkönigreich ist als großes Reich wiedergeboren, das die orthodoxe Welt erleuchtet."
 geo_events.99.a: "Ruhm sei Georgien! Es lebe das goldene Zeitalter!"
 STATIC_MODIFIER_NAME_geo_bagrationi_mod: "Der Glanz der Bagrationi"
 STATIC_MODIFIER_DESC_geo_bagrationi_mod: "Die königliche Blutlinie verleiht dem Staat Ansehen und Legitimität."
 STATIC_MODIFIER_NAME_geo_succession_mod: "Stabile Thronfolge"
 STATIC_MODIFIER_DESC_geo_succession_mod: "Die königliche Thronfolge ist stabil, und innere Unruhe hat sich gelegt."
 STATIC_MODIFIER_NAME_geo_reunite_mod: "Georgien wiedervereint"
 STATIC_MODIFIER_DESC_geo_reunite_mod: "Die zersplitterten Provinzen sind noch einmal unter einer Krone vereint."
 STATIC_MODIFIER_NAME_geo_fortify_mod: "Das kaukasische Festungsnetz"
 STATIC_MODIFIER_DESC_geo_fortify_mod: "Steinerne Festungen, auf den Gipfeln der Kaukasuspässe errichtet, halten aus der Ferne Wache nach dem Schatten des Eindringlings."
 STATIC_MODIFIER_NAME_geo_church_mod: "Die georgische Kirche"
 STATIC_MODIFIER_DESC_geo_church_mod: "Die orthodoxe Kirche wirkt nun als Säule des Staates und schmiedet Einheit durch den Glauben."
 STATIC_MODIFIER_NAME_geo_court_mod: "Der Glanz des königlichen Hofes"
 STATIC_MODIFIER_DESC_geo_court_mod: "Der königliche Hof von Tiflis erstrahlt als Zentrum von Kultur und Autorität im Kaukasus."
 STATIC_MODIFIER_NAME_geo_army_mod: "Das georgische Heer"
 STATIC_MODIFIER_DESC_geo_army_mod: "Ein mächtiges Heer aus den Bergvölkern ist vollendet und dient als Schwert des Königreichs."
 STATIC_MODIFIER_NAME_geo_recover_mod: "Kraft zurückgewonnen"
 STATIC_MODIFIER_DESC_geo_recover_mod: "Durch Bündnis und Wiederbewaffnung ist das Königreich einer neuen Zukunft entgegengetreten."
 STATIC_MODIFIER_NAME_geo_tamar_mod: "Königin Tamars Ambition"
 STATIC_MODIFIER_DESC_geo_tamar_mod: "Unsere armenischen Brüder sind befreit, und Tiflis’ Autorität reicht nun nach Osten."
 STATIC_MODIFIER_NAME_geo_shirvan_mod: "Schirwan zurückgewonnen"
 STATIC_MODIFIER_DESC_geo_shirvan_mod: "Ein Stützpunkt am Kaspischen Meer ist gesichert, und der Reichtum des östlichen Handels fließt herein."
 STATIC_MODIFIER_NAME_geo_seljuk_mod: "Erben der Seldschuken"
 STATIC_MODIFIER_DESC_geo_seljuk_mod: "Die Mächte, die das seldschukische Erbe geerbt haben, sind zurückgedrängt, und die Autorität des Kreuzes ist in den Osten zurückgekehrt."
 STATIC_MODIFIER_NAME_geo_gates_mod: "Die Tore Alexanders"
 STATIC_MODIFIER_DESC_geo_gates_mod: "Nachdem sie die nördlichen Pässe überquert haben, sind die Stämme nördlich des Kaukasus unterworfen."
 STATIC_MODIFIER_NAME_geo_crimea_mod: "Die Krim eingenommen"
 STATIC_MODIFIER_DESC_geo_crimea_mod: "Der Tataren letztes Refugium ist unterworfen und öffnet Handelswege über das Schwarze Meer."
 STATIC_MODIFIER_NAME_geo_black_sea_mod: "Beherrschung des Schwarzen Meeres"
 STATIC_MODIFIER_DESC_geo_black_sea_mod: "Der größte Teil der Schwarzmeerküste ist nun in Georgiens Handelssphäre eingegliedert."
 STATIC_MODIFIER_NAME_geo_tsar_mod: "Bündnis mit dem Zaren"
 STATIC_MODIFIER_DESC_geo_tsar_mod: "Beziehungen zur beherrschenden Macht der Rus sind begründet und erweitern unser diplomatisches Netz."
 STATIC_MODIFIER_NAME_geo_hegemony_mod: "Die Hegemonie des Kaukasus"
 STATIC_MODIFIER_DESC_geo_hegemony_mod: "Berge, Steppe und das Schwarze Meer – die Hegemonie über den gesamten Kaukasus ist vollendet."
 STATIC_MODIFIER_NAME_geo_trebizond_mod: "Der Umgang mit Trapezunt"
 STATIC_MODIFIER_DESC_geo_trebizond_mod: "Das Band mit unserem alten Freund ist erneuert, und der Handel zwischen den beiden Reichen blüht."
 STATIC_MODIFIER_NAME_geo_jalayirid_mod: "Das Sultanat der Dschalairiden unterworfen"
 STATIC_MODIFIER_DESC_geo_jalayirid_mod: "Die dschalairidische Bedrohung ist beseitigt und beweist die Stärke unseres Heeres."
 STATIC_MODIFIER_NAME_geo_mamluk_mod: "Vordringen in die Mamluken"
 STATIC_MODIFIER_DESC_geo_mamluk_mod: "Das Banner des Kreuzes, nach Osten vorgetragen, weht selbst am Horizont der Wüste, und die Könige anderer Glaubensrichtungen haben seinen Namen gehört."
 STATIC_MODIFIER_NAME_geo_cyprus_mod: "Zypern erobert"
 STATIC_MODIFIER_DESC_geo_cyprus_mod: "Georgische Handelsschiffe, in den Häfen Zyperns vor Anker, laden die Gewürze des östlichen Mittelmeers."
 STATIC_MODIFIER_NAME_geo_mesopotamia_mod: "Wiege der Zivilisation"
 STATIC_MODIFIER_DESC_geo_mesopotamia_mod: "Wolle und Farbstoffe von den fruchtbaren Ufern von Tigris und Euphrat werden zu den Werkstätten Georgiens getragen."
 STATIC_MODIFIER_NAME_geo_holy_city_mod: "Die Heilige Stadt beansprucht"
 STATIC_MODIFIER_DESC_geo_holy_city_mod: "Die Rückgewinnung Jerusalems hat die Autorität der Kirche und die Hingabe des Volkes erhöht."
 STATIC_MODIFIER_NAME_geo_light_east_mod: "Licht des Ostens"
 STATIC_MODIFIER_DESC_geo_light_east_mod: "Die Befreiung der östlichen Patriarchate hat die Moral und Ehre des Heeres erhöht."
 STATIC_MODIFIER_NAME_geo_anatolia_mod: "Der anatolische Einfall"
 STATIC_MODIFIER_DESC_geo_anatolia_mod: "Die georgischen Soldaten, die noch einmal auf dem Feld von Manzikert standen, marschieren in Reihen, stolz darauf, die alte Demütigung gerächt zu haben."
 STATIC_MODIFIER_NAME_geo_downfall_mod: "Der Untergang des Reiches"
 STATIC_MODIFIER_DESC_geo_downfall_mod: "Am Hof zu Tiflis, befreit von der osmanischen Bedrohung, verneigen sich Gesandte vieler Nationen vor dem König von Georgien."
 STATIC_MODIFIER_NAME_geo_beacon_mod: "Leuchtfeuer der Christenheit"
 STATIC_MODIFIER_DESC_geo_beacon_mod: "Der Name des Königs von Georgien, Beschützer des Glaubens genannt, wird mit Respekt in den Höfen der Nationen ausgesprochen, die dasselbe Kreuz tragen."
 STATIC_MODIFIER_NAME_geo_tbilisi_mod: "Tiflis wiederaufgebaut"
 STATIC_MODIFIER_DESC_geo_tbilisi_mod: "Die königliche Hauptstadt Tiflis gewinnt ihren einstigen Glanz zurück."
 STATIC_MODIFIER_NAME_geo_vineyards_mod: "Georgische Weinberge"
 STATIC_MODIFIER_DESC_geo_vineyards_mod: "Der Duft von tausend Jahre lang in tönernen Qwewri gereiftem Wein erfüllt die Täler Kachetiens."
 STATIC_MODIFIER_NAME_geo_literature_mod: "Einheimische Literatur wiederbelebt"
 STATIC_MODIFIER_DESC_geo_literature_mod: "Die Verbreitung der Mchedruli-Schrift hat Gelehrsamkeit und Regierung vorangebracht."
 STATIC_MODIFIER_NAME_geo_builder_mod: "Das Erbe des Erbauers"
 STATIC_MODIFIER_DESC_geo_builder_mod: "Dem Willen Davids des Erbauers folgend, beschreiten unsere Städte den Weg zum Wohlstand."
 STATIC_MODIFIER_NAME_geo_cathedral_mod: "Die Kathedrale von Swetizchoweli"
 STATIC_MODIFIER_DESC_geo_cathedral_mod: "Die Kathedrale der Lebenden Säule ist wiederaufgebaut und stellt ihren Glanz als Zentrum des Glaubens wieder her."
 STATIC_MODIFIER_NAME_geo_patriarchate_mod: "Patriarchat von ganz Georgien"
 STATIC_MODIFIER_DESC_geo_patriarchate_mod: "Die georgische Kirche ist zum Rang eines Patriarchats erhoben, und ihre Autorität ist weithin anerkannt."
 STATIC_MODIFIER_NAME_geo_silk_road_mod: "Der Handel auf der Seidenstraße"
 STATIC_MODIFIER_DESC_geo_silk_road_mod: "Als Knotenpunkt des Ost-West-Handels quellen Georgiens Städte über von Reichtum."
 STATIC_MODIFIER_NAME_geo_mountain_fort_mod: "Das Bergfestungsnetz"
 STATIC_MODIFIER_DESC_geo_mountain_fort_mod: "Ein auf dem Gelände des Kaukasus errichtetes Festungsnetz kann jedes große Heer aufhalten."
 STATIC_MODIFIER_NAME_geo_golden_age_mod: "Das goldene Zeitalter vollendet"
 STATIC_MODIFIER_DESC_geo_golden_age_mod: "Das von Königin Tamar und David dem Erbauer errichtete goldene Zeitalter hat neue Höhen erreicht."
 STATIC_MODIFIER_NAME_geo_constantinople_fall_mod: "Erbe des kaiserlichen Byzanz"
 STATIC_MODIFIER_DESC_geo_constantinople_fall_mod: "Die diplomatische und administrative Maschinerie der tausendjährigen Stadt ist übernommen. Als Erben von Roms Bürokratie und diplomatischem Zeremoniell werden unsere Untertanen loyaler, und der Prozess der Annexion verläuft reibungsloser."
 STATIC_MODIFIER_NAME_geo_golden_age_declaration_mod: "Das Verwaltungsnetz des goldenen Zeitalters"
 STATIC_MODIFIER_DESC_geo_golden_age_declaration_mod: "Ein großes Reich, das sich vom Kaukasus bis zum Mittelmeer erstreckt, ist durch Königsstraßen und ein Netz örtlicher Statthalter verbunden. Der von Königin Tamar und David dem Erbauer errichtete Wohlstand trägt das Licht der Krone bis in die fernsten Provinzen und macht die Legitimität und das Ansehen der Dynastie unerschütterlich."
