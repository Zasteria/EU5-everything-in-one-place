l_german:
 hol_holland_mission_pack: "Wahre Freiheit – von der Grafschaft Holland zu den Vereinigten Provinzen"
 hol_holland_mission_pack_DESCRIPTION:0 "Die Grafschaft Holland, vom Haus Avesnes regiert – besiege die Hanse, verleibe dir Hennegau und Brabant ein, erkämpfe die Unabhängigkeit von spanischer Tyrannei und errichte als wahre Republik ohne Monarchen ein goldenes Zeitalter."
 hol_holland_mission_pack_CRITERIA_DESCRIPTION:0 "Vereine die Grafschaft, erringe die Unabhängigkeit und erreiche als Republik unter der Souveränität der Staaten ein goldenes Zeitalter."
 hol_holland_mission_pack_BUTTON_TOOLTIP:0 "Von einer kleinen Grafschaft zu einer vereinten Republik des Handels und der Freiheit."
 hol_holland_mission_pack_BUTTON_DETAILS:0 "„Eintracht macht stark“ – errichte in den Niederlanden eine wahre Republik ohne Monarchen!"
 hol_county_of_holland: "Die Grafschaft Holland"
 hol_county_of_holland_desc: "Die Grafschaft Holland im Herzen der Niederlande, gesegnet mit Wasserwegen und Handel – der alternde Graf Wilhelm III. aus dem Haus Avesnes nähert sich dem Ende seiner Herrschaft."
 hol_secure_dordrecht: "Dordrecht entwickeln"
 hol_secure_dordrecht_desc: "Dordrecht, die uralte Handelsstadt am Zusammenfluss von Rhein und Maas – baue auf ihrem verliehenen Stapelrecht auf und bringe weitere Entwicklung."
 hol_hoekse_kabeljauwse: "Die Haken und die Kabeljaue"
 hol_hoekse_kabeljauwse_desc: "Die adlige Partei der Haken und die städtische Partei der Kabeljaue – ersticke diesen inneren Zwist, der die Grafschaft über die gräfliche Nachfolge spaltet, und errichte eine stabile Herrschaft."
 hol_zeeland_unification: "Seeland einen"
 hol_zeeland_unification_desc: "Seeland, ein Land von Inseln, verstreut über die Nordsee – bringe diese Region in den Herrschaftsbereich der Grafschaft."
 hol_frisian_freedom: "Westfriesische Freiheit"
 hol_frisian_freedom_desc: "Die Menschen Westfrieslands, die ihre Selbstbestimmung hochhalten – gewähre ihnen Freiheit unter dem Banner der Grafschaft."
 hol_utrecht_relations: "Beziehungen zu Utrecht"
 hol_utrecht_relations_desc: "Das Bistum Utrecht, das gewaltige weltliche Macht ausübt – knüpfe unter unserem Einfluss Beziehungen zu diesem Nachbarn."
 hol_wittelsbach_inheritance: "Union mit dem Hennegau"
 hol_wittelsbach_inheritance_desc: "Über Prinzessin Margarete, vermählt mit Kaiser Ludwig IV., vertiefe das Band zur benachbarten Grafschaft Hennegau – durch Heirat, Unterwerfung oder ihr Erlöschen vereine Holland, Seeland und den Hennegau unter einem Banner."
 hol_herring_industry: "Die Heringsfischerei entwickeln"
 hol_herring_industry_desc: "Die als „Große Fischerei“ (grote visserij) bekannte Heringsfischerei – entwickle diesen bedeutenden Gewerbezweig weiter, zusammen mit der Kunst des Einsalzens."
 hol_hansa_rivalry: "Rivalität mit der Hanse"
 hol_hansa_rivalry_desc: "Die Hanse, die den Ostseehandel beherrscht – bezwinge, mit billiger Fracht und leistungsfähigen Handelsschiffen gerüstet, diesen altehrwürdigen Bund."
 hol_amsterdam_rise: "Der Aufstieg Amsterdams"
 hol_amsterdam_rise_desc: "Amsterdam, ein kleines Fischerdorf am IJ – entwickle diesen Ort zu einem großen Umschlagplatz des Nordseehandels."
 hol_moedernegotie: "Der Mutterhandel (Moedernegotie)"
 hol_moedernegotie_desc: "Der baltische Getreidehandel – beherrsche diesen Handel, den man „die Mutter allen Handels“ nennt, und mache ihn zum Fundament des Wohlstands."
 hol_contest_brabant: "Ambitionen auf Brabant"
 hol_contest_brabant_desc: "Das Herzogtum Brabant, die andere große Macht der Niederlande – richte den Blick des Ehrgeizes auf dieses Land."
 hol_absorb_brabant: "Die Einverleibung Brabants"
 hol_absorb_brabant_desc: "Annektiere oder unterwirf das Herzogtum Brabant – beweise, dass Holland, nicht Brabant, Herr der Niederlande ist."
 hol_reformation_choice: "Die Wahl der Reformation"
 hol_reformation_choice_desc: "Die Lehren Luthers und Calvins erschüttern die Niederlande – an diesem Scheideweg des Glaubens, welchen Weg sollen wir wählen?"
 hol_calvinist_merchants: "Calvinistische Kaufleute"
 hol_calvinist_merchants_desc: "Der Calvinismus, der einen genügsamen und disziplinierten Glauben predigt – nimm dieses Bekenntnis, das die Herzen der Kaufmannsbürger gewonnen hat, als Staatsreligion an."
 hol_union_of_utrecht: "Die Utrechter Union"
 hol_union_of_utrecht_desc: "Die Utrechter Union, geschlossen von den nördlichen Provinzen der Niederlande – stehe als ihr Kern und stelle dich dem gemeinsamen Feind."
 hol_watergeuzen: "Die Wassergeusen (Watergeuzen)"
 hol_watergeuzen_desc: "Freibeuter, die sich „Wassergeusen“ nennen – ihre Taten schlagen Löcher in Spaniens Herrschaft über die Meere."
 hol_dutch_republic_proper: "Die wahre Republik errichten"
 hol_dutch_republic_proper_desc: "Ein Bund von sieben Provinzen, die einander ebenbürtig gegenüberstehen – errichte hier eine wahre Republik der Kaufleute und Bürger, ohne Monarchen."
 hol_east_india_company: "Die Ostindien-Kompanie gründen"
 hol_east_india_company_desc: "Gründe die Vereinigte Ostindische Kompanie (VOC) mit dem Ziel eines Monopols auf den Asienhandel."
 hol_amsterdam_bank: "Die Bank von Amsterdam"
 hol_amsterdam_bank_desc: "Um Ordnung in das Chaos konkurrierender Währungen zu bringen, gründe die Wechselbank (Wisselbank) und errichte ein stabiles Kreditsystem."
 hol_stock_exchange: "Die Amsterdamer Börse"
 hol_stock_exchange_desc: "Die erste Börse der Welt, an der Aktien gekauft und verkauft werden – mache diesen Ort zum Mittelpunkt der europäischen Finanzwelt."
 hol_dutch_golden_age: "Das Goldene Zeitalter der Niederlande"
 hol_dutch_golden_age_desc: "Rembrandt, Vermeer und blühender Handel – erreiche den Gipfel des „Niederländischen Goldenen Zeitalters“."
 hol_estates_of_holland: "Die Staaten von Holland"
 hol_estates_of_holland_desc: "Die Staaten von Holland, zusammengesetzt aus Vertretern der Städte – mache diese Versammlung zum Kern der republikanischen Regierung."
 hol_regent_oligarchy: "Die Regentenoligarchie"
 hol_regent_oligarchy_desc: "Die „Regenten“, wohlhabende Kaufmannspatrizierfamilien – festige ihre oligarchische Herrschaft als die wahre Regierungsstruktur der Republik."
 hol_stadtholderless_era: "Die Statthalterlose Zeit (Wahre Freiheit)"
 hol_stadtholderless_era_desc: "Ein Zeitalter ohne Statthalter, in dem die Staaten die Souveränität halten – verkörpere die „Wahre Freiheit“, die Johan de Witt verkündete."
 hol_states_sovereignty: "Die Souveränität der Staaten festigen"
 hol_states_sovereignty_desc: "Eine Republik ohne Monarchen – festige das Wesen ihrer Souveränität als dauerhafte Einrichtung."
 hol_anglo_dutch_rivalry: "Die englisch-niederländische Rivalität"
 hol_anglo_dutch_rivalry_desc: "Die Rivalität mit England um die Vorherrschaft im Seehandel – stelle dich diesem Wettstreit, für den die Navigationsakte das Sinnbild sind."
 hol_navigation_act_response: "Antwort auf die Navigationsakte"
 hol_navigation_act_response_desc: "Die englische Navigationsakte – begegne diesem protektionistischen Gesetz und verteidige unsere Handelsflotte."
 hol_channel_trade_dominance: "Beherrschung des Kanalhandels"
 hol_channel_trade_dominance_desc: "Die Meerenge, die Nordsee und Atlantik verbindet – errichte die See- und Handelsüberlegenheit über diese lebenswichtige Wasserstraße."
 hol_french_relations: "Beziehungen zu Frankreich"
 hol_french_relations_desc: "Der Ehrgeiz des Sonnenkönigs Ludwig XIV. – widme den Beziehungen zu diesem mächtigen Nachbarn größte Aufmerksamkeit."
 hol_rampjaar_survival: "Das Katastrophenjahr (Rampjaar) überstehen"
 hol_rampjaar_survival_desc: "Im Jahr 1672, gleichzeitig von England und Frankreich überfallen – überstehe dieses „Katastrophenjahr“, das die Existenz der Nation selbst bedroht."
 hol_glorious_revolution: "Sieg über den Sonnenkönig"
 hol_glorious_revolution_desc: "Nachdem die Republik das Katastrophenjahr überstanden hat, geht sie nun zum Angriff über – führe unsere Heere tief in französischen Boden und lass den Sonnenkönig Ludwig XIV. für seinen Ehrgeiz bezahlen."
 hol_united_provinces: "Die Vereinigten Provinzen der Niederlande"
 hol_united_provinces_desc: "Von den Grundfesten der Grafschaft über den Unabhängigkeitskrieg und ein goldenes Zeitalter hinweg ist hier eine wahre Republik vollendet."
 hol_events.2.t: "Ausrufung der Vereinigten Provinzen"
 hol_events.2.d: "Ein Bund von sieben Provinzen, die einander ebenbürtig gegenüberstehen – eine wahre Republik der Kaufleute und Bürger, ohne Monarchen, tut ihren ersten Atemzug."
 hol_events.2.a: "Ruhm der Republik!"
 hol_events.3.t: "Das Katastrophenjahr (Rampjaar)"
 hol_events.3.d: "1672 – zeitgleicher Einfall Frankreichs, Englands, Münsters und Kölns. Als „das Volk unvernünftig, die Regierung hilflos, das Land verzweifelt“ beschrieben, haben wir diese Krise überstanden."
 hol_events.3.a: "Die Republik überlebt!"
 hol_events.4.t: "Sieg über den Sonnenkönig"
 hol_events.4.d: "Tief in französisches Gebiet vorgestoßen, haben unsere Heere schließlich den Ehrgeiz Ludwigs XIV. gebrochen. Der Name der Republik wird nun weithin als der einer Großmacht Europas bekannt sein."
 hol_events.4.a: "Ruhm der Republik!"
 hol_events.5.t: "Ein Scheideweg für die Staaten von Holland"
 hol_events.5.d: "Die Staaten stehen vor einer schicksalhaften Wahl über die Regierungsform der Republik – sich einer monarchischen Ordnung unter einem Statthalter zuneigen oder an einer wahren Republik der Bürger und Kaufleute festhalten."
 hol_events.5.a: "Die Autorität im Haus Oranien bündeln"
 hol_events.5.b: "Die Republik unter der Souveränität der Staaten aufrechterhalten"
 hol_events.99.t: "Die Vereinigten Provinzen vollendet"
 hol_events.99.d: "Der lange Weg, der in der Grafschaft Holland begann, ist über einen Unabhängigkeitskrieg und ein goldenes Zeitalter hinweg hier als wahre Republik vollendet."
 hol_events.99.a: "Es leben die Vereinigten Provinzen!"
 STATIC_MODIFIER_NAME_hol_county_mod: "Die Grafschaft Holland"
 STATIC_MODIFIER_DESC_hol_county_mod: "Die Erinnerung an eine von Wasserwegen und Handel genährte Grafschaft lebt noch immer als Stolz des Volkes fort."
 STATIC_MODIFIER_NAME_hol_dordrecht_mod: "Dordrecht entwickelt"
 STATIC_MODIFIER_DESC_hol_dordrecht_mod: "Am Zusammenfluss von Rhein und Maas hören die Handelsschiffe Dordrechts nie auf, ihre Fracht zu laden und zu löschen."
 STATIC_MODIFIER_NAME_hol_hoekse_mod: "Die Haken und die Kabeljaue"
 STATIC_MODIFIER_DESC_hol_hoekse_mod: "Jene, die einst unter den Bannern der Haken und der Kabeljaue zogen, marschieren nun gemeinsam in den Reihen des Grafen."
 STATIC_MODIFIER_NAME_hol_zeeland_mod: "Seeland geeint"
 STATIC_MODIFIER_DESC_hol_zeeland_mod: "Auf den Helgen von Middelburg nimmt das von den Inseln zusammengetragene Holz Rumpf um Rumpf Gestalt an."
 STATIC_MODIFIER_NAME_hol_frisian_mod: "Westfriesische Freiheit"
 STATIC_MODIFIER_DESC_hol_frisian_mod: "„Die Friesen haben keinen Herrn“ – dieser stolze Geist der Selbstbestimmung ruft, wenn die Stunde es verlangt, viele in die Reihen."
 STATIC_MODIFIER_NAME_hol_utrecht_mod: "Beziehungen zu Utrecht"
 STATIC_MODIFIER_DESC_hol_utrecht_mod: "Die Glocken der Utrechter Türme läuten eine stille, herzliche Nachbarschaft zwischen Grafschaft und Bistum aus."
 STATIC_MODIFIER_NAME_hol_wittelsbach_mod: "Union mit dem Hennegau"
 STATIC_MODIFIER_DESC_hol_wittelsbach_mod: "Ein neues Herrschergeschlecht aus Bayern bringt Ordnung in die Lande Holland, Seeland und Hennegau."
 STATIC_MODIFIER_NAME_hol_absorb_brabant_mod: "Brabant einverleibt"
 STATIC_MODIFIER_DESC_hol_absorb_brabant_mod: "Hollands Wappen hängt nun im Hof zu Brüssel, und der Reichtum des Südens strömt stetig nach Amsterdam."
 STATIC_MODIFIER_NAME_hol_herring_mod: "Die Heringsfischerei entwickelt"
 STATIC_MODIFIER_DESC_hol_herring_mod: "Flotten, beladen mit gesalzenem Hering, winden sich einer nach der andern durch die Dünung der Nordsee heimwärts."
 STATIC_MODIFIER_NAME_hol_hansa_rivalry_mod: "Rivalität mit der Hanse"
 STATIC_MODIFIER_DESC_hol_hansa_rivalry_mod: "Während die Kaufleute Lübecks die Stirn runzeln, gewinnen unsere billigen Frachtraten die Verlader im ganzen Ostseeraum."
 STATIC_MODIFIER_NAME_hol_amsterdam_rise_mod: "Der Aufstieg Amsterdams"
 STATIC_MODIFIER_DESC_hol_amsterdam_rise_mod: "Einst ein kleines Fischerdorf am IJ, zieht Amsterdam nun Segelschiffe aus allen Winkeln der Welt an."
 STATIC_MODIFIER_NAME_hol_moedernegotie_mod: "Der Mutterhandel"
 STATIC_MODIFIER_DESC_hol_moedernegotie_mod: "Aus der Ostsee herbeigeschafftes Getreide hält unsere Tische und unsere Kasse selbst in Hungerjahren gefüllt."
 STATIC_MODIFIER_NAME_hol_reformation_mod: "Die Wahl der Reformation"
 STATIC_MODIFIER_DESC_hol_reformation_mod: "Zwischen dem Läuten der Kirchenglocken verstummen auf den Marktplätzen die leisen Debatten über alten und neuen Glauben nie."
 STATIC_MODIFIER_NAME_hol_calvinist_mod: "Calvinistische Kaufleute"
 STATIC_MODIFIER_DESC_hol_calvinist_mod: "In den Kaufmannshäusern, in denen die Bibel selbst gelesen und ergründet wird, brennen die Lampen bis tief in die Nacht."
 STATIC_MODIFIER_NAME_hol_union_utrecht_mod: "Die Utrechter Union"
 STATIC_MODIFIER_DESC_hol_union_utrecht_mod: "Der in Utrecht unterzeichnete Pakt ist zur Hoffnung geworden, an die sich jede nördliche Provinz klammert."
 STATIC_MODIFIER_NAME_hol_watergeuzen_mod: "Die Wassergeusen"
 STATIC_MODIFIER_DESC_hol_watergeuzen_mod: "„Lieber Bettler als des Königs Männer“ – mit diesem Ruf im Sinn jagen unsere Seeleute noch heute die spanische Flagge."
 STATIC_MODIFIER_NAME_hol_voc_mod: "Die Ostindien-Kompanie"
 STATIC_MODIFIER_DESC_hol_voc_mod: "Der Duft von Gewürzen aus Batavia erfüllt das Lagerhausviertel von Amsterdam."
 STATIC_MODIFIER_NAME_hol_wisselbank_mod: "Die Bank von Amsterdam"
 STATIC_MODIFIER_DESC_hol_wisselbank_mod: "Das in den Tresoren der Wechselbank verwahrte Vertrauen ist die wahrhaftigste Sicherheit, die die Kaufleute dieser Stadt besitzen."
 STATIC_MODIFIER_NAME_hol_wisselbank_capital_mod: "Hauptstadt der Wechselbank"
 STATIC_MODIFIER_DESC_hol_wisselbank_capital_mod: "Da die Bücher der Staatskasse und die Tresore der Wechselbank unter einem Dach liegen, laufen die Staatsgeschäfte umso reibungsloser."
 STATIC_MODIFIER_NAME_hol_exchange_mod: "Die Amsterdamer Börse"
 STATIC_MODIFIER_DESC_hol_exchange_mod: "Auf dem Börsenparkett verstummen die Rufe der Makler, die ihre Aktienbriefe schwenken, niemals."
 STATIC_MODIFIER_NAME_hol_golden_age_mod: "Das Goldene Zeitalter der Niederlande"
 STATIC_MODIFIER_DESC_hol_golden_age_mod: "Das Licht und der Schatten, die Rembrandts Pinsel einfängt, werden noch auf Generationen von diesem Zeitalter des Wohlstands künden."
 STATIC_MODIFIER_NAME_hol_regent_mod: "Die Regentenoligarchie"
 STATIC_MODIFIER_DESC_hol_regent_mod: "In den stillen Zusammenkünften wohlhabender Patrizierfamilien fallen die wahren Entscheidungen der Republik."
 STATIC_MODIFIER_NAME_hol_stadtholderless_mod: "Die Statthalterlose Zeit"
 STATIC_MODIFIER_DESC_hol_stadtholderless_mod: "Der Sitz des Statthalters bleibt leer – und doch laufen die Staatsgeschäfte reibungsloser denn je."
 STATIC_MODIFIER_NAME_hol_anglo_rivalry_mod: "Die englisch-niederländische Rivalität"
 STATIC_MODIFIER_DESC_hol_anglo_rivalry_mod: "Wiederholte Kanonenduelle mit unserem Rivalen jenseits des Kanals haben unsere Seeleute zu erfahrenen Veteranen geschmiedet."
 STATIC_MODIFIER_NAME_hol_navigation_act_mod: "Antwort auf die Navigationsakte"
 STATIC_MODIFIER_DESC_hol_navigation_act_mod: "Unbeirrt von Englands Verordnungen finden unsere Handelsflotten stets die Schlupflöcher, die die Handelswege offen halten."
 STATIC_MODIFIER_NAME_hol_channel_dominance_mod: "Beherrschung des Kanalhandels"
 STATIC_MODIFIER_DESC_hol_channel_dominance_mod: "Es ist selten geworden, in jener engen Meerenge zwischen Nordsee und Atlantik ein Schiff zu sehen, das nicht unsere Farben führt."
 STATIC_MODIFIER_NAME_hol_french_relations_mod: "Beziehungen zu Frankreich"
 STATIC_MODIFIER_DESC_hol_french_relations_mod: "Beunruhigende Gerüchte vom Hof des Sonnenkönigs halten unsere Grenzgarnisonen stets wachsam."
 STATIC_MODIFIER_NAME_hol_united_provinces_mod: "Die Vereinigten Provinzen der Niederlande"
 STATIC_MODIFIER_DESC_hol_united_provinces_mod: "Die Einheit von sieben Provinzen ohne Monarchen hat unseren Namen auf jedem Meer und jedem Markt der Welt bekannt gemacht."
 STATIC_MODIFIER_NAME_hol_rampjaar_mod: "Das Katastrophenjahr überstanden"
 STATIC_MODIFIER_DESC_hol_rampjaar_mod: "„Das Volk unvernünftig, die Regierung hilflos, das Land verzweifelt“ – dieses Urteil abgeschüttelt, tragen unsere Soldaten die Erinnerung mit Stolz."
 STATIC_MODIFIER_NAME_hol_glorious_revolution_mod: "Sieg über den Sonnenkönig"
 STATIC_MODIFIER_DESC_hol_glorious_revolution_mod: "Geschichten vom Marsch unseres Heeres tief in französischen Boden werden nun mit Stolz an jedem Hof Europas erzählt."
 STATIC_MODIFIER_NAME_hol_republic_declared_mod: "Die Republik ausgerufen"
 STATIC_MODIFIER_DESC_hol_republic_declared_mod: "Abgesandte der Bürger und Kaufleute versammeln sich nun voller Stolz in einer Kammer, die keinem Monarchen Rechenschaft schuldet."
