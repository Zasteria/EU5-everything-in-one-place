l_german:
 ple_english_pale_mission_pack: "The Pale – vom Brückenkopf der Krone zum Königreich Irland"
 ple_english_pale_mission_pack_DESCRIPTION:0 "Das schmale English Pale um Dublin – reiche den anglo-normannischen Herren die Hand, erobere die gälischen Lande und gründe ein Königreich, das ganz Irland beherrscht."
 ple_english_pale_mission_pack_CRITERIA_DESCRIPTION:0 "Festige das Pale, erobere ganz Irland und gründe ein Königreich."
 ple_english_pale_mission_pack_BUTTON_TOOLTIP:0 "Von einem kleinen Brückenkopf zu einem Königreich, das die ganze Grüne Insel beherrscht."
 ple_english_pale_mission_pack_BUTTON_DETAILS:0 "„Irischer als der König selbst“ – pflanze das Banner des Pale über ganz Irland!"
 ple_english_pale: "Das English Pale"
 ple_english_pale_desc: "Ein schmaler Küstenstreifen um Dublin – dies ist der letzte Brückenkopf der englischen Königsmacht inmitten eines weiten gälischen Meeres."
 ple_dublin_castle: "Dublin Castle entwickeln"
 ple_dublin_castle_desc: "Dublin Castle, 1204 erbaut – stärke dieses Zentrum englischer Herrschaft in Irland weiter."
 ple_pale_defense: "Das Pale befestigen"
 ple_pale_defense_desc: "Die Erdwälle und Gräben, die das Pale vor gälischen Überfällen schützen – stärke diese als „The Ditch“ bekannte Verteidigungslinie."
 ple_lord_deputy: "Der Lord Deputy von Irland"
 ple_lord_deputy_desc: "Der Lord Deputy, der Irland als Stellvertreter des englischen Königs regiert – mache dieses Amt unerschütterlich."
 ple_anglo_irish_parliament: "Das anglo-irische Parlament"
 ple_anglo_irish_parliament_desc: "Das irische Parlament, in Drogheda oder Dublin einberufen – bringe diese Versammlung anglo-irischer Herren und städtischer Vertreter zum Funktionieren."
 ple_pale_consolidated: "Das Pale gefestigt"
 ple_pale_consolidated_desc: "Befestigungen, der Lord Deputy, das Gesetz und das Parlament – baue auf all diesen auf und mache die Regierung des Pale unerschütterlich."
 ple_hiberno_norman_lords: "Die anglo-normannischen Herren"
 ple_hiberno_norman_lords_desc: "Die anglo-normannischen Herren, von denen gesagt wird, sie seien „englischer als die Engländer selbst“ – baue Beziehungen zu ihnen auf."
 ple_fitzgerald_kildare: "Die FitzGeralds von Kildare"
 ple_fitzgerald_kildare_desc: "„Ganz Irland kann den Earl von Kildare nicht beherrschen“ – so sagte man. Baue Beziehungen zu diesem gewaltigen Haus auf."
 ple_butler_ormond: "Die Butlers von Ormond"
 ple_butler_ormond_desc: "Die Butlers von Ormond, Rivalen der Kildares – baue Beziehungen zu diesem der Krone treu ergebenen Haus auf."
 ple_statutes_of_kilkenny: "Die Statuten von Kilkenny"
 ple_statutes_of_kilkenny_desc: "1367 erlassen, die Statuten von Kilkenny – setze dieses Gesetz durch, das englischen Siedlern verbietet, sich zu „gälisieren“."
 ple_gaelic_frontier_wars: "Die gälischen Grenzkriege"
 ple_gaelic_frontier_wars_desc: "Die gälischen Herren, die das Pale umgeben – stelle dich dem unaufhörlichen Krieg dieser Grenze."
 ple_conquer_leinster: "Leinster erobern"
 ple_conquer_leinster_desc: "Leinster, südlich des Pale gelegen – bringe diese Region in unser Herrschaftsgebiet."
 ple_conquer_munster: "Munster erobern"
 ple_conquer_munster_desc: "Munster, die Sphäre des Earl von Desmond – erobere diese reiche Region."
 ple_conquer_connacht: "Connacht erobern"
 ple_conquer_connacht_desc: "Connacht, sich in den westlichen Weiten erstreckend – bringe dieses Grenzland unter unsere Kontrolle."
 ple_conquer_ulster: "Ulster erobern"
 ple_conquer_ulster_desc: "Ulster, das nördliche Land des hartnäckigsten gälischen Widerstands – erobere diese Region."
 ple_master_of_ireland: "Herr Irlands"
 ple_master_of_ireland_desc: "Leinster, Munster, Connacht und Ulster – herrsche über all diese und stehe als wahrer Herr Irlands da."
 ple_reformation_choice: "Die Wahl der Reformation"
 ple_reformation_choice_desc: "Die Lehren Luthers und Calvins überqueren das Meer – an diesem Scheideweg des Glaubens stehend, welchen Pfad werden wir wählen?"
 ple_church_of_ireland: "Die Church of Ireland"
 ple_church_of_ireland_desc: "Die Church of Ireland, mit der Church of England verbunden – errichte diesen neuen Glauben als Werkzeug der Regierung."
 ple_recusant_catholics: "Rekusante Katholiken"
 ple_recusant_catholics_desc: "Die „Rekusanten“, die sich weigern, ihre Treue zu Rom aufzugeben – nimm ihren Glauben als Säule der Regierung an."
 ple_dublin_university: "Die Universität Dublin"
 ple_dublin_university_desc: "Dublins Sitz der Gelehrsamkeit, verkörpert durch Trinity College – entwickle diesen Ort zum Zentrum der Gelehrsamkeit."
 ple_english_crown_relations: "Beziehungen zur englischen Krone"
 ple_english_crown_relations_desc: "Die englische Krone jenseits des Meeres – wäge unsere Beziehungen zu diesem Lehnsherrn ab, denn sie werden unsere Zukunft entscheiden."
 ple_kingdom_of_ireland: "Das Königreich Irland verkündet"
 ple_kingdom_of_ireland_desc: "Der Weg, der am kleinen Brückenkopf des Pale begann, trägt hier Frucht, als ein Königreich, das ganz Irland beherrscht – doch welchen Pfad dieses neue Königreich beschreiten wird, bleibt unentschieden."
 ple_events.99.t: "Die Verkündung des Königreichs Irland"
 ple_events.99.d: "Die lange Geschichte, die am kleinen Brückenkopf Dublins begann, tritt hier in ein neues Zeitalter ein, als ein Königreich, das ganz Irland beherrscht."
 ple_events.99.a: "Ruhm sei Irland!"
 ple_defy_the_crown: "Trotz gegen die Krone"
 ple_defy_the_crown_desc: "Das Königreich Irland ist nicht mehr bloß ein Diener Englands – mache diesen Riss zum ersten Schritt zu wahrer Souveränität."
 ple_war_of_irish_independence: "Der irische Unabhängigkeitskrieg"
 ple_war_of_irish_independence_desc: "Ein unvermeidlicher Krieg mit der Krone jenseits des Meeres – gewinne diesen Unabhängigkeitskrieg und sprenge die Ketten."
 ple_sovereign_kingdom_of_ireland: "Ein souveränes Irland"
 ple_sovereign_kingdom_of_ireland_desc: "Ein wahrhaft unabhängiges Königreich Irland, keiner Krone unterworfen – die Grüne Insel wird endlich Herrin ihres eigenen Schicksals."
 ple_loyal_crown_partnership: "Partnerschaft mit der Krone"
 ple_loyal_crown_partnership_desc: "Partnerschaft, nicht Rivalität – das Königreich Irland wählt ein Bündnis Gleicher mit der englischen Krone."
 ple_anglo_irish_union: "Die anglo-irische Union"
 ple_anglo_irish_union_desc: "Durch enge politische Bande tun die beiden Königreiche einen Schritt zu tieferer Union."
 ple_united_kingdoms: "Ein Partner in der Union"
 ple_united_kingdoms_desc: "Nachdem es Partnerschaft statt Rivalität gewählt hat, steht das Königreich Irland als Partner in der Union neben England und errichtet ein Zeitalter gemeinsamen Wohlstands."
 STATIC_MODIFIER_NAME_ple_pale_mod: "Das English Pale"
 STATIC_MODIFIER_DESC_ple_pale_mod: "Seit Heinrichs II. Zeiten ist dieses Land der englischen Krone einziger Stützpunkt jenseits des Festlandes geblieben."
 STATIC_MODIFIER_NAME_ple_dublin_mod: "Dublin Castle entwickelt"
 STATIC_MODIFIER_DESC_ple_dublin_mod: "Der alte Wikingerhafen ist nun als Sitz der Regierung und des Handels in Irland geschäftig."
 STATIC_MODIFIER_NAME_ple_defense_mod: "Das Pale befestigt"
 STATIC_MODIFIER_DESC_ple_defense_mod: "Innerhalb der Erdwälle und Gräben des „Pale“ bestellen Bauern ihre Felder, ohne plötzliche gälische Überfälle zu fürchten."
 STATIC_MODIFIER_NAME_ple_lord_deputy_mod: "Der Lord Deputy"
 STATIC_MODIFIER_DESC_ple_lord_deputy_mod: "Der Deputy, der in Dublin Castle an Stelle des Königs jenseits des Meeres sitzt, gebietet Respekt selbst unter den großen Herren."
 STATIC_MODIFIER_NAME_ple_parliament_mod: "Das anglo-irische Parlament"
 STATIC_MODIFIER_DESC_ple_parliament_mod: "Die Stimmen der Bürger, innerhalb der Burgmauern versammelt, tragen nun weiter in Staatsangelegenheiten."
 STATIC_MODIFIER_NAME_ple_consolidated_mod: "Das Pale gefestigt"
 STATIC_MODIFIER_DESC_ple_consolidated_mod: "Dublin ist nicht mehr eine fremde Enklave, sondern ein wahres Kerngebiet, in den eigenen Büchern der Krone verzeichnet."
 STATIC_MODIFIER_NAME_ple_norman_lords_mod: "Die anglo-normannischen Herren"
 STATIC_MODIFIER_DESC_ple_norman_lords_mod: "Die normannischen Herren in ihren Burgen sind so tief in diesem Boden verwurzelt, dass man sagt, sie seien „irischer als die Iren selbst“."
 STATIC_MODIFIER_NAME_ple_kilkenny_mod: "Die Statuten von Kilkenny"
 STATIC_MODIFIER_DESC_ple_kilkenny_mod: "1367 erlassen, verbietet dieses Gesetz Siedlern, die irische Sprache oder die Sitten der Gälen anzunehmen."
 STATIC_MODIFIER_NAME_ple_frontier_wars_mod: "Die gälischen Grenzkriege"
 STATIC_MODIFIER_DESC_ple_frontier_wars_mod: "Unzählige Gefechte jenseits des Grabens des Pale haben die Soldaten für die Kriege der Grenze gehärtet."
 STATIC_MODIFIER_NAME_ple_leinster_mod: "Leinster erobert"
 STATIC_MODIFIER_DESC_ple_leinster_mod: "Die Kornkammern Leinsters, dem Pale benachbart, sind nun in die eigenen Steuerbücher der Krone eingetragen."
 STATIC_MODIFIER_NAME_ple_munster_mod: "Munster erobert"
 STATIC_MODIFIER_DESC_ple_munster_mod: "Aus den Häfen Munsters, einst Domäne des Earl von Desmond, segeln Schiffe, beladen mit Wolle und Häuten, ohne Ende hinaus."
 STATIC_MODIFIER_NAME_ple_connacht_mod: "Connacht erobert"
 STATIC_MODIFIER_DESC_ple_connacht_mod: "Selbst die Clans des wilden Connacht folgen nun dem Ruf der Krone zu den Waffen."
 STATIC_MODIFIER_NAME_ple_ulster_mod: "Ulster erobert"
 STATIC_MODIFIER_DESC_ple_ulster_mod: "Der hartnäckige Norden, lange von den O’Neills und O’Donnells gehalten, hat sich endlich dem königlichen Banner unterworfen."
 STATIC_MODIFIER_NAME_ple_master_ireland_mod: "Herr Irlands"
 STATIC_MODIFIER_DESC_ple_master_ireland_mod: "Von Leinster bis Ulster liegt nun die ganze Grüne Insel unter einem einzigen Banner."
 STATIC_MODIFIER_NAME_ple_reformation_mod: "Die Wahl der Reformation"
 STATIC_MODIFIER_DESC_ple_reformation_mod: "Die Lehren Luthers und Calvins, über das Meer getragen, senden stille Wellen durch die Kirchen dieser Insel."
 STATIC_MODIFIER_NAME_ple_church_ireland_mod: "Die Church of Ireland"
 STATIC_MODIFIER_DESC_ple_church_ireland_mod: "In den Kapellen der neuen, mit Canterbury verbundenen Kirche wird nun die englische Bibel laut vorgelesen."
 STATIC_MODIFIER_NAME_ple_recusant_mod: "Rekusante Katholiken"
 STATIC_MODIFIER_DESC_ple_recusant_mod: "Mit Bußgeldern belegt, doch ungebeugt, setzen die „Rekusanten“ ihre stillen Gebete gen Rom fort."
 STATIC_MODIFIER_NAME_ple_university_mod: "Die Universität Dublin"
 STATIC_MODIFIER_DESC_ple_university_mod: "Entlang der Kreuzgänge des Trinity College hallen nun die Schritte einer neuen Gelehrtengeneration."
 STATIC_MODIFIER_NAME_ple_crown_relations_mod: "Beziehungen zur englischen Krone"
 STATIC_MODIFIER_DESC_ple_crown_relations_mod: "Jeder Brief, der vom Hof jenseits des Meeres eintrifft, formt still das Schicksal dieses Königreichs."
 STATIC_MODIFIER_NAME_ple_kingdom_ireland_mod: "Das Königreich Irland"
 STATIC_MODIFIER_DESC_ple_kingdom_ireland_mod: "Ein neu gekrönter König von Irland sitzt nun auf dem Thron innerhalb Dublin Castles."
 STATIC_MODIFIER_NAME_ple_defy_crown_mod: "Trotz gegen die Krone"
 STATIC_MODIFIER_DESC_ple_defy_crown_mod: "Unter jenen, die die Treue zur Krone jenseits des Meeres abgeworfen haben, breitet sich unbezähmbarer Eifer aus."
 STATIC_MODIFIER_NAME_ple_irish_independence_war_mod: "Der irische Unabhängigkeitskrieg"
 STATIC_MODIFIER_DESC_ple_irish_independence_war_mod: "Unzählige Zusammenstöße mit dem über das Meer entsandten Heer haben die Soldaten dieser Insel zu erfahrenen Taktikern geschmiedet."
 STATIC_MODIFIER_NAME_ple_sovereign_ireland_mod: "Ein souveränes Irland"
 STATIC_MODIFIER_DESC_ple_sovereign_ireland_mod: "Ein Banner eines wahrhaft freien Irlands, keiner Krone verpflichtet, weht nun von den Türmen Dublin Castles. Statthalter, in jeden Winkel des Landes entsandt, errichten die Verwaltungssehnen eines souveränen Staates."
 STATIC_MODIFIER_NAME_ple_loyal_partnership_mod: "Partnerschaft mit der Krone"
 STATIC_MODIFIER_DESC_ple_loyal_partnership_mod: "Nachdem sie Vertrauen statt Rivalität gewählt haben, überqueren Gesandte der beiden Kronen nun öfter denn je das Meer."
 STATIC_MODIFIER_NAME_ple_anglo_irish_union_mod: "Die anglo-irische Union"
 STATIC_MODIFIER_DESC_ple_anglo_irish_union_mod: "Durch die unermüdliche Arbeit von Gesandten, die dem Hof jenseits des Meeres dienen, sind die beiden Kronen enger verbunden als je zuvor."
