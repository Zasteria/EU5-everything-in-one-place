l_german:
 den_kalmar_union_mission_pack: "Der Glanz der Kalmarer Union"
 den_kalmar_union_mission_pack_DESCRIPTION:0 "Im Jahr 1337 steht das Königreich Dänemark am Rand des finanziellen Ruins und der territorialen Zersplitterung. Waldemar IV. Atterdag strebt danach, den Thron zurückzugewinnen und die Nation wieder aufzubauen. Gewinne Gotland zurück, tritt der Hanse entgegen, bilde die Kalmarer Union mit Norwegen und Schweden, beherrsche die Ostsee, erobere England – und wähle deinen Glauben: katholische Standhaftigkeit, lutherische Reformation oder die Wiedererweckung der nordischen Götter. Errichte das Skandinavische Reich."
 den_kalmar_union_mission_pack_CRITERIA_DESCRIPTION:0 "Dehne dich als Dänemark in alle Richtungen aus – Norden, Osten, Glauben – und gründe das Skandinavische Reich."
 den_kalmar_union_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das Skandinavische Reich zu errichten."
 den_kalmar_union_mission_pack_BUTTON_DETAILS:0 "Von Waldemars Wiederherstellung zum goldenen Zeitalter der Kalmarer Union – eine Skandinavien!"
 den_restoration_of_denmark: "Waldemars Wiederherstellung"
 den_restoration_of_denmark_desc: "1340 gewann Waldemar IV. Atterdag den Thron eines zerschlagenen, stückweise verkauften Dänemarks zurück – selbst Jütland war an Preußen verpfändet gewesen. Stück für Stück gewann er es zurück. „Atterdag“ – „wieder ist es Tag“ – schon sein Beiname verkörperte seine historische Sendung. Sichere Kopenhagen und erhöhe die Legitimität der Krone."
 den_secure_denmark: "Dänemark stabilisieren"
 den_secure_denmark_desc: "Die Einnahme Roskildes, Aarhus’ und Malmös vereint das dänische Kernland. Roskilde ist die traditionelle Grabstätte der dänischen Könige und ihre geistliche Hauptstadt; Malmö ist das Schlüsseltor zur Ostsee. Sind diese gesichert, kann Dänemark den Blick nach außen richten."
 den_norway_union: "Personalunion mit Norwegen"
 den_norway_union_desc: "Dänemark und Norwegen traten 1380 beim Tod Håkons VI. in Personalunion. Seine Tochter Margarethe I. wurde Regentin Norwegens und legte den Grundstein der Kalmarer Union. Bringe Norwegen unter das dänische Banner und tue den ersten Schritt zur skandinavischen Einheit."
 den_sweden_union: "Personalunion mit Schweden"
 den_sweden_union_desc: "Schweden war über Generationen von Konflikten Dänemarks großer nördlicher Rivale. Manche schwedischen Adligen suchen dänischen Schutz. Ob durch Diplomatie oder Eroberung, bringe Schweden unter dänische Kontrolle – und Skandinavien rückt in Reichweite."
 den_integrate_holstein: "Holstein eingliedern"
 den_integrate_holstein_desc: "Holstein ist ein deutschsprachiges Herzogtum, dessen Herzog der dänische König ist. Die Beherrschung Hamburgs und Holsteins sichert die Südgrenze und übt Druck auf die Hanse aus. „Dänisch in Holstein, Holstein in Dänemark“ – löse diese Zweideutigkeit ein für alle Mal."
 den_kalmar_union: "Die Kalmarer Union"
 den_kalmar_union_desc: "Die 1397 von Margarethe I. eingefädelte Kalmarer Union vereinte die drei Kronen Dänemarks, Norwegens und Schwedens unter einem König. Jedes Land behielt seine eigenen Gesetze und Traditionen, koordinierte aber Außen- und Militärpolitik. Die Geburt des Nordischen Reiches."
 den_unite_scandinavia: "Skandinavien einen"
 den_unite_scandinavia_desc: "Mit unterworfenem Schweden und eingegliedertem Holstein eint sich ganz Skandinavien unter dem dänischen Banner. Von der Ostsee bis zur Norwegischen See herrscht eine Dynastie über alles. Dies ist die größte politische Leistung in der Geschichte des Nordens."
 den_integrate_norway: "Norwegen eingliedern"
 den_integrate_norway_desc: "Nimm Oslo und Bergen ein und gliedere Norwegen vollständig als Teil des dänischen Reiches ein. Bergen war einst die führende nördliche Drehscheibe der Hanse – nun wird es zu Dänemarks Tor zum Nordatlantik."
 den_integrate_sweden: "Schweden eingliedern"
 den_integrate_sweden_desc: "Gliedere Schweden vollständig als Teil des dänischen Reiches ein. Der Besitz Stockholms und die Beherrschung Svealands machen Schweden zu einem unteilbaren Teil des Reiches."
 den_develop_trondheim: "Nordnorwegen entwickeln"
 den_develop_trondheim_desc: "Trondheim ist Norwegens historische Hauptstadt und Sitz seines Erzbischofs. Die Entwicklung der norwegischen Nordküste begründet die Kontrolle über den Nordatlantik und die Norwegische See."
 den_scandinavian_golden_age: "Das skandinavische goldene Zeitalter"
 den_scandinavian_golden_age_desc: "Mit eingegliedertem Norwegen und Schweden und errichtetem Absolutismus tritt Skandinavien als Nordeuropas größtes Reich in sein goldenes Zeitalter ein. Kopenhagen blüht als kulturelles und wirtschaftliches Zentrum, das Ostsee und Nordsee verbindet."
 den_retake_gotland: "Gotland zurückgewinnen"
 den_retake_gotland_desc: "Visby auf Gotland war einst eine der größten Handelsstädte der Hanse – ein Preis, um den Schweden, Livland und der Deutsche Orden stritten. 1361 nahm Waldemar IV. Gotland mit Gewalt. Die Einnahme dieser Insel sichert eine entscheidende Drehscheibe des Ostseehandels."
 den_sound_toll: "Der Öresundzoll"
 den_sound_toll_desc: "Dänemark liegt an der schmalen Passage zwischen Ostsee und Nordsee; jedes Schiff muss die Öresund-Meerenge durchqueren und den Zoll entrichten. Um 1429 förmlich eingeführt, wurde dieser Zoll zum Rückgrat der dänischen Kronfinanzen. Baue die Flotte auf und beherrsche die Meerenge vollständig."
 den_humiliate_hansa: "Die Hanse demütigen"
 den_humiliate_hansa_desc: "Die Hanse hat den Ostseehandel monopolisiert und Dänemark über Generationen bedroht. Seit dem demütigenden Frieden von Stralsund 1370 hat Dänemark auf Rache gewartet. Beherrsche Lübeck oder übertriff die Hanse wirtschaftlich – und zerschlage ihre Hegemonie."
 den_reconquer_estonia: "Estland zurückerobern"
 den_reconquer_estonia_desc: "Reval (Tallinn) wurde 1219 von Waldemar II. als dänische Festung gegründet – „Taani linn“ (dänische Burg) soll der Ursprung ihres Namens sein. 1346 an den Deutschen Orden verkauft, stellt die Rückgewinnung dieses Landes den dänischen Einfluss am östlichen Ostseeufer wieder her."
 den_control_livonia: "Livland beherrschen"
 den_control_livonia_desc: "Livland (das heutige Lettland und Estland) ist der strategische Preis, um den Deutscher Orden, Polen, Schweden und Russland streiten. Die Einnahme Rigas und Dorpats legt die gesamte östliche Ostseeküste in dänische Hände."
 den_stralsund_treaty: "Stralsund einnehmen"
 den_stralsund_treaty_desc: "Stralsund und Stettin sind die Hauptstädte Pommerns an der südlichen Ostseeküste. 1370 wurde Dänemark hier zu einem demütigenden Vertrag gezwungen. Nun ergreift Dänemark die Initiative – die Beherrschung dieser Städte begründet die Vorherrschaft über die pommersche Küste."
 den_expand_the_toll: "Den Zoll ausweiten"
 den_expand_the_toll_desc: "Weite den Öresundzoll aus, um das gesamte Ostseehandelsnetz zu erfassen. Nach der Unterwerfung Pommerns und dem Bruch der Hanse wird Dänemark zum Herrn des nordeuropäischen Handels."
 den_master_of_the_baltic: "Herr der Ostsee"
 den_master_of_the_baltic_desc: "Die Hanse besiegt und Livland beherrscht – Dänemark ist der unbestrittene Herr der Ostsee. Die Einnahme Königsbergs und Danzigs vollendet die Umzingelung: Kein Handelsschiff darf ohne dänische Erlaubnis ein- oder auslaufen."
 den_eliminate_novgorod: "Nowgorod ausschalten"
 den_eliminate_novgorod_desc: "Die Republik Nowgorod ist der große Handelsstaat am östlichen Ende der Ostsee-Barents-Handelswege. Die Beherrschung Nowgorods und Pskows bringt den gesamten Handelsweg für russische Pelze, Bernstein und Honig unter dänische Verwaltung."
 den_rival_england: "England zum Rivalen erklären"
 den_rival_england_desc: "Der dänische König Waldemar der Siegreiche eroberte einst England (1016). Knuts des Großen Nordseereich war Dänemarks größter historischer Ruhm. Die Zeit ist gekommen, diesen Traum erneut zu verfolgen. Erkläre England zum Rivalen und wetteifere um die Vorherrschaft in der Nordsee."
 den_north_sea_fleet: "Nordseeflotte"
 den_north_sea_fleet_desc: "Um die Nordsee zu beherrschen, bedarf es einer mächtigen Flotte. Erweitere Kopenhagens Werften und baue die größte Flotte der skandinavischen Geschichte. Der Tag ist gekommen, an dem dänische Schiffe von Island bis zur Themse segeln."
 den_danish_scotland: "Dänemark in Schottland"
 den_danish_scotland_desc: "Schottland ist Englands ewiger Feind und Dänemarks möglicher Verbündeter. Die Einnahme Edinburghs schafft eine Zange um England von Norden und Süden – und stellt das Zeitalter nach, in dem Wikinger Schottlands Küsten beherrschten."
 den_invade_england: "In England einfallen"
 den_invade_england_desc: "Dänische und norwegische Streitkräfte sind in Nordengland gelandet. York war einst die Hauptstadt des wikingischen Königreichs Jórvík – Herz des Danelag. Die Einnahme Yorks belebt den Ruhm des Danelag, jener weiten nordenglischen Gebiete, die im 9. Jahrhundert von dänischen und nordischen Siedlern beherrscht wurden."
 den_conquer_england: "England erobern"
 den_conquer_england_desc: "London und Edinburgh unter dänischer Kontrolle – zum ersten Mal seit tausend Jahren seit Knut dem Großen herrscht eine skandinavische Dynastie über die Britischen Inseln. Das Nordseereich aus Dänemark, Norwegen, Schweden und England ist wiedergeboren."
 den_religious_question: "Die Frage des Glaubens"
 den_religious_question_desc: "Was soll der Glaube Dänemarks sein? Die überlieferte Treue zum Papst in Rom bewahren – Martin Luthers neue Lehre annehmen – oder zu den alten Göttern der Vorfahren zurückkehren? Diese Wahl trifft die Grundfesten des dänischen Staates."
 den_catholic_denmark: "Katholisches Dänemark"
 den_catholic_denmark_desc: "Das Königreich Dänemark bewahrt seine Treue zur römisch-katholischen Kirche. Durch die Wahrung guter Beziehungen zum Papst steht Dänemark mit diplomatischem Vorteil als Beschützer der nördlichen katholischen Zivilisation."
 den_crusade_north: "Kreuzzug des Nordens"
 den_crusade_north_desc: "Dänemark steht als nördlicher Schild der Christenheit und nimmt am Heiligen Krieg gegen ungläubige Nationen teil. Die Führung von Kreuzzügen gegen die verbliebenen heidnischen Gebiete an der östlichen Ostseeküste festigt Dänemarks religiöse Autorität."
 den_kingdom_of_god: "Das Reich Gottes"
 den_kingdom_of_god_desc: "Tiefes Vertrauen zum Papsttum und die Beherrschung Hamburgs – Dänemark hat eine unerschütterliche Stellung als Beschützer der nördlichen katholischen Zivilisation begründet. Von Rom anerkannt, wird der dänische König als „Kreuzfahrer des Nordens“ in die Geschichte eingeschrieben."
 den_reformation: "Die Reformation"
 den_reformation_desc: "1517 veröffentlichte Martin Luther seine fünfundneunzig Thesen, und die Woge der religiösen Reform fegte über Europa. 1536 erklärte König Christian III. das Luthertum zur Staatsreligion Dänemarks. Nimm diesen historischen Wandel vorweg und errichte ein lutherisches Dänemark."
 den_protestant_church: "Die protestantische Kirche"
 den_protestant_church_desc: "Nach dem Übertritt zum Luthertum ging der Kirchenbesitz an die dänische Krone über und stärkte die Staatsfinanzen erheblich. Errichte Universitäten, um lutherische Theologen auszubilden, und verankere den protestantischen Glauben in ganz Dänemark."
 den_protestant_league: "Protestantischer Bund"
 den_protestant_league_desc: "Lutherische Nationen einen sich in einem um Dänemark zentrierten Bund. Wie der Schmalkaldische Bund führt Dänemark die protestantische Welt Nordeuropas als Vorkämpfer der Reformation an."
 den_norse_revival: "Wiedererweckung des Nordischen Glaubens"
 den_norse_revival_desc: "Die Götter des Wikingerzeitalters – Odin, Thor, Freyr – haben das Land nie wirklich verlassen. Manche nordische Adlige widerstanden der Christianisierung und träumen von einer Rückkehr zu den alten Göttern. Königliche Förderung dieser Bewegung entfacht eine beispiellose religiöse Revolution in Skandinavien."
 den_viking_tradition: "Wikingertradition"
 den_viking_tradition_desc: "Das Blut der alten Skandinavier erwacht heiß von neuem. Der Kriegergeist der Vorfahren – Meere durchqueren, in Feindesland eindringen, überfallen und erobern – wohnt dem dänischen Heer inne. Baue ein mächtiges Landheer und eine Flotte auf; belebe den Ruhm des Wikingerzeitalters neu."
 den_asgard_kingdom: "Das Reich Asgards"
 den_asgard_kingdom_desc: "Unter Odins Segen wird Skandinavien als Reich der alten Götter wiedergeboren. Der Glaube, dass tapfere, im Kampf gefallene Krieger in Walhalla willkommen geheißen werden, wird zur geistlichen Säule der Nation. Eine ganz Skandinavien und errichte das Reich der Götter."
 den_strengthen_crown: "Die Krone stärken"
 den_strengthen_crown_desc: "Das Königreich Dänemark hatte historisch seine Königsmacht durch mächtige Adlige beschränkt. Die „Handfeste“ zwang jeden König, bei seinem Antritt Adelsprivilegien zu gewähren. Sprenge diese Fesseln langsam und stärke die dänische Monarchie."
 den_copenhagen_university: "Die Universität Kopenhagen"
 den_copenhagen_university_desc: "Die 1479 gegründete Universität Kopenhagen ist die älteste Universität Skandinaviens. Ihre Fakultäten für Theologie, Recht, Medizin und Philosophie machen sie zum Zentrum dänischer Kultur. Errichte die Universität in Kopenhagen und verwirkliche die akademische Hauptstadt des Nordens."
 den_develop_copenhagen: "Kopenhagen entwickeln"
 den_develop_copenhagen_desc: "Kopenhagen – „der Kaufmannshafen“ – ist als wichtige Drehscheibe des Ostseehandels gewachsen. Erhebe es zum Stadtrang, um es in die große königliche Hauptstadt zu verwandeln, die Dänemark verdient."
 den_revoke_privileges: "Privilegien widerrufen"
 den_revoke_privileges_desc: "Schaffe die Adelsprivilegien ab, die die dänische Königsmacht beschränkt haben. Die Erhöhung der königlichen Autorität und die Durchführung von Regierungsreformen setzt Dänemark auf den Weg zum zentralisierten Absolutismus."
 den_danish_navy: "Die königlich-dänische Marine"
 den_danish_navy_desc: "Entwickle Kopenhagens Werften und gründe die königlich-dänische Marine. Diese dauerhafte militärische Einrichtung, die die dänische Vorherrschaft über Ostsee und Nordsee stützt, wird zur Säule dänischer Macht."
 den_amber_trade: "Bernsteinhandel"
 den_amber_trade_desc: "Baltischer Bernstein – das „Gold des Nordens“ – wird seit der Antike geschätzt. Weite den Export von Bernstein und Edelsteinen über Dänemarks Ostseehandelswege aus und sichere reichen Handelsertrag."
 den_develop_aarhus: "Aarhus entwickeln"
 den_develop_aarhus_desc: "Aarhus ist die größte Stadt Jütlands und das Handelszentrum Westdänemarks. Sie zum Stadtrang zu erheben, macht sie zu Dänemarks zweiter Stadt nach Kopenhagen."
 den_develop_malmo: "Malmö entwickeln"
 den_develop_malmo_desc: "Malmö in Südschweden (Schonen) liegt Kopenhagen jenseits der Öresund-Meerenge gegenüber. Die Entwicklung dieser Stadt schafft ein wichtiges Gegenstück zu Kopenhagen als Drehscheibe dänischer Ostseeherrschaft."
 den_absolutism: "Absolutismus"
 den_absolutism_desc: "1660 berief König Friedrich III. die drei Stände – Adel, Klerus und Bürger – ein und ließ sie die erbliche absolute Monarchie ausrufen. Einer der dramatischsten politischen Wandel in der Geschichte des Nordens. Erhöhe königliche Autorität und Legitimität, um diesen historischen Umbruch vorwegzunehmen."
 den_economic_powerhouse: "Nordische Handelsmacht"
 den_economic_powerhouse_desc: "Öresundzoll, Nordseehandel, skandinavische Landwirtschaft – Dänemark mit seinen vielfältigen Einkommensquellen ist zu Nordeuropas größter Wirtschaftsmacht geworden. Halte ein Einkommen von 300+ und mehrere Marktzentren, um die wirtschaftliche Vorherrschaft zu sichern."
 den_north_sea_dominion: "Herrschaft über die Nordsee"
 den_north_sea_dominion_desc: "Skandinavien geeint, die Ostsee beherrscht, das skandinavische goldene Zeitalter erreicht – Dänemark herrscht als Nordeuropas größtes Reich. Mit 80+ Schiffen, 600+ monatlichem Einkommen und 600+ Orten beanspruche diesen ruhmreichen Titel."
 den_scandinavian_empire: "Das Skandinavische Reich"
 den_scandinavian_empire_desc: "Von der Ostsee bis England, von Gotland bis Nowgorod – das Skandinavische Reich ist vollendet. Das von Waldemar IV. wiederaufgebaute Dänemark ist zu einem großen Reich herangewachsen, das ganz Nordeuropa beherrscht. 1000+ Orte, Ansehen 80+, Einkommen 1000+ – ergreife diesen Ruhm."
 den_events.10.t: "Die norwegische Personalunion"
 den_events.10.d: "Der König von Dänemark hat den Thron Norwegens geerbt. Seit dem Wikingerzeitalter sind Dänemark und Norwegen unter einem Königshaus gebunden. Norwegens reiche Fischgründe, sein Holz und das Tor zum Nordatlantik erweitern die dänische Macht erheblich. Der König, der den Titel „König zweier Reiche“ trägt, hat den historischen ersten Schritt zur skandinavischen Einheit getan."
 den_events.10.a: "Norwegen und Dänemark sind für immer eins!"
 den_events.20.t: "Die schwedische Personalunion"
 den_events.20.d: "Der König von Dänemark hat auch den schwedischen Thron gesichert. Manche schwedischen Adligen widerstehen, doch diese Personalunion ist der entscheidende Schritt zur skandinavischen Einheit. Königin Margarethes diplomatisches Genie hat dieses Wunder vollbracht – der Traum vom „Kaiser Skandinaviens“ rückt der Wirklichkeit näher."
 den_events.20.a: "Zur Einheit dreier Königreiche – vorwärts!"
 den_events.30.t: "Die Kalmarer Union"
 den_events.30.d: "In Kalmar in Schweden versammelten sich Vertreter Dänemarks, Norwegens und Schwedens und verkündeten die Union unter König Erik von Pommern. Jedes Land behält seine eigenen Gesetze und Traditionen, koordiniert aber Außen- und Militärpolitik. „Waldemar träumte davon; Margarethe machte es Wirklichkeit“ – so werden Historiker später schreiben."
 den_events.30.a: "Es lebe die Kalmarer Union! Skandinavien ist eins!"
 den_events.40.t: "Der Scheideweg des Glaubens"
 den_events.40.d: "Am dänischen Hof ist eine heftige religiöse Debatte entbrannt. Die überlieferte Treue zum Papst in Rom fortsetzen – Martin Luthers neue Lehre annehmen – oder zu den alten Göttern der Vorfahren zurückkehren? Diese Wahl trifft die Grundfesten des dänischen Staates selbst."
 den_events.40.a: "Die Treue zu Rom bewahren – der Katholizismus ist Dänemarks Glaube"
 den_events.40.a.tt: "Schreite auf dem katholischen Weg voran. Erleichtert die Erfüllung der Bedingungen der Mission den_catholic_denmark."
 den_events.40.b: "Luthers Lehre annehmen – das Zeitalter der Reform ist gekommen"
 den_events.40.b.tt: "Schreite auf dem lutherischen Weg voran. Erleichtert die Erfüllung der Bedingungen der Mission den_reformation."
 den_events.40.c: "Zu den alten Göttern zurückkehren – Odins Segen suchen"
 den_events.40.c.tt: "Schreite auf dem nordischen Weg voran. Erleichtert die Erfüllung der Bedingungen der Mission den_norse_revival."
 den_events.99.t: "Die Geburt des Skandinavischen Reiches"
 den_events.99.d: "Jahrhunderte sind vergangen, seit Waldemar IV. ein zerstörtes Dänemark erbte – nun ist Dänemark zu einem großen Reich herangewachsen, das ganz Nordeuropa beherrscht. Von der Ostsee bis zur Nordsee, von den nowgorodischen Steppen bis zu den Britischen Inseln, alles fällt in das Reich des dänischen Kaisers. Historiker werden später schreiben: „Atterdag – wieder ist es Tag – war eine wahre Prophezeiung.“"
 den_events.99.a: "Es lebe der Kaiser des Skandinavischen Reiches!"
 STATIC_MODIFIER_NAME_den_valdemar_legacy_mod: "Das Erbe Waldemars"
 STATIC_MODIFIER_DESC_den_valdemar_legacy_mod: "„Atterdag – wieder ist es Tag.“ Waldemars IV. Wiederherstellung legte den Grundstein für Dänemarks Wiederaufbau."
 STATIC_MODIFIER_NAME_den_holstein_integration_mod: "Holstein eingegliedert"
 STATIC_MODIFIER_DESC_den_holstein_integration_mod: "Das Herzogtum Holstein ist vollständig in das Dänische Reich eingegliedert. Die Südgrenze ist stabilisiert und die südlichen Handelswege gesichert."
 STATIC_MODIFIER_NAME_den_scandinavia_united_mod: "Skandinavien geeint"
 STATIC_MODIFIER_DESC_den_scandinavia_united_mod: "Die drei Königreiche unter einem Banner vereint. Die Geburt des größten Staates Nordeuropas."
 STATIC_MODIFIER_NAME_den_norway_integration_mod: "Norwegen eingegliedert"
 STATIC_MODIFIER_DESC_den_norway_integration_mod: "Norwegen ist als Teil des Dänischen Reiches eingegliedert. Das Tor zum Nordatlantik ist geöffnet."
 STATIC_MODIFIER_NAME_den_sweden_integration_mod: "Schweden eingegliedert"
 STATIC_MODIFIER_DESC_den_sweden_integration_mod: "Der Name des dänischen Königs wird in den Kammern Stockholms verlesen, und auch die schwedischen Fürsten nehmen als Mitglieder des Reiches am selben Tisch Platz."
 STATIC_MODIFIER_NAME_den_visby_trade_mod: "Handelsdrehscheibe Visby"
 STATIC_MODIFIER_DESC_den_visby_trade_mod: "Visby auf Gotland ist als dänische Handelsdrehscheibe wiederbelebt. Die ehemalige Hansestadt blüht von neuem."
 STATIC_MODIFIER_NAME_den_sound_toll_mod: "Der Öresundzoll"
 STATIC_MODIFIER_DESC_den_sound_toll_mod: "Das Zollsystem ist errichtet. Jedes Handelsschiff, das die Ostsee betritt oder verlässt, zahlt an Dänemark."
 STATIC_MODIFIER_NAME_den_hansa_dominance_mod: "Hanse besiegt"
 STATIC_MODIFIER_DESC_den_hansa_dominance_mod: "Dänemark hat die Hegemonie der Hanse zerschlagen und die Kontrolle über den Ostseehandel ergriffen."
 STATIC_MODIFIER_NAME_den_estonia_mod: "Estland zurückerobert"
 STATIC_MODIFIER_DESC_den_estonia_mod: "Reval (dänische Burg) ist zu Dänemark zurückgekehrt. Der dänische Einfluss am östlichen Ostseeufer ist wiederhergestellt."
 STATIC_MODIFIER_NAME_den_livonia_mod: "Livland beherrscht"
 STATIC_MODIFIER_DESC_den_livonia_mod: "Mit gesichertem Riga und Dorpat steht die gesamte östliche Ostseeküste unter dänischer Verwaltung."
 STATIC_MODIFIER_NAME_den_pomeranian_coast_mod: "Die pommersche Küste"
 STATIC_MODIFIER_DESC_den_pomeranian_coast_mod: "Die Einnahme Stralsunds und Stettins bringt die gesamte pommersche Küste unter dänische Kontrolle."
 STATIC_MODIFIER_NAME_den_sound_toll_extended_mod: "Erweiterter Zoll"
 STATIC_MODIFIER_DESC_den_sound_toll_extended_mod: "Jedes Schiff, das den Öresund durchquert, gleich welchen Ostseehafen es ansteuert, senkt die Segel vor der Kette des dänischen Zollhauses."
 STATIC_MODIFIER_NAME_den_baltic_master_mod: "Herr der Ostsee"
 STATIC_MODIFIER_DESC_den_baltic_master_mod: "Die dänische Flotte beherrscht die gesamte Ostsee. Jeder Hafen von Königsberg bis Danzig antwortet Dänemark."
 STATIC_MODIFIER_NAME_den_eastern_routes_mod: "Östliche Handelswege"
 STATIC_MODIFIER_DESC_den_eastern_routes_mod: "Nowgorod erobert – der gesamte Handelsweg für russische Waren steht nun unter dänischer Verwaltung."
 STATIC_MODIFIER_NAME_den_north_sea_fleet_mod: "Nordseeflotte"
 STATIC_MODIFIER_DESC_den_north_sea_fleet_mod: "Die königlich-dänische Marine beherrscht die Nordsee. Von Island bis zur Themse weht das dänische Banner."
 STATIC_MODIFIER_NAME_den_scotland_mod: "Dänemark in Schottland"
 STATIC_MODIFIER_DESC_den_scotland_mod: "Edinburgh eingenommen – England kann nun von Norden und Süden in die Zange genommen werden."
 STATIC_MODIFIER_NAME_den_england_invasion_mod: "Der Einfall in England"
 STATIC_MODIFIER_DESC_den_england_invasion_mod: "Dänische Streitkräfte, die York besetzten, belebten die Erinnerung an das Danelag."
 STATIC_MODIFIER_NAME_den_north_sea_empire_mod: "Das Nordseereich"
 STATIC_MODIFIER_DESC_den_north_sea_empire_mod: "Zum ersten Mal seit tausend Jahren seit Knut dem Großen herrscht eine skandinavische Dynastie über die Britischen Inseln. Das Nordseereich ist wiedergeboren."
 STATIC_MODIFIER_NAME_den_catholic_devotion_mod: "Katholische Hingabe"
 STATIC_MODIFIER_DESC_den_catholic_devotion_mod: "Dänemark bewahrt die Treue zur römischen Kirche. Die Zusammenarbeit mit dem Papst verschafft Dänemark einen diplomatischen Vorteil."
 STATIC_MODIFIER_NAME_den_northern_crusader_mod: "Nordischer Kreuzfahrer"
 STATIC_MODIFIER_DESC_den_northern_crusader_mod: "Dänemarks Teilnahme am Heiligen Krieg bringt ihm den Ruf eines Beschützers der Christenheit ein."
 STATIC_MODIFIER_NAME_den_papal_champion_mod: "Vorkämpfer des Papstes"
 STATIC_MODIFIER_DESC_den_papal_champion_mod: "Dänemark hat eine unerschütterliche Stellung als Beschützer der nördlichen katholischen Zivilisation begründet."
 STATIC_MODIFIER_NAME_den_lutheran_reform_mod: "Lutherische Reform"
 STATIC_MODIFIER_DESC_den_lutheran_reform_mod: "Die goldenen Kelche und silbernen Leuchter der beschlagnahmten Klöster werden in der königlichen Münze zu Kopenhagen eingeschmolzen und zu neuer Münze geprägt."
 STATIC_MODIFIER_NAME_den_protestant_church_mod: "Protestantische Kirche"
 STATIC_MODIFIER_DESC_den_protestant_church_mod: "Der Ausbau der Universitäten und die Ausbildung lutherischer Theologen verankern den protestantischen Glauben in ganz Dänemark."
 STATIC_MODIFIER_NAME_den_protestant_league_mod: "Protestantischer Bund"
 STATIC_MODIFIER_DESC_den_protestant_league_mod: "Ein von Dänemark geführtes lutherisches Bündnis eint die protestantische Welt Nordeuropas."
 STATIC_MODIFIER_NAME_den_norse_revival_mod: "Wiedererweckung des Nordischen Glaubens"
 STATIC_MODIFIER_DESC_den_norse_revival_mod: "Die Verehrung Odins, Thors und Freyrs ist wiederhergestellt. Der Kriegergeist der Vorfahren wohnt Dänemarks Heeren inne."
 STATIC_MODIFIER_NAME_den_viking_warriors_mod: "Wikingerkrieger"
 STATIC_MODIFIER_DESC_den_viking_warriors_mod: "Der Kriegergeist des Wikingerzeitalters ist wiedergeboren. Dänemarks Heere sind unübertroffen im Überqueren der Meere und der Eroberung von Feindesland."
 STATIC_MODIFIER_NAME_den_asgard_kingdom_mod: "Das Reich Asgards"
 STATIC_MODIFIER_DESC_den_asgard_kingdom_mod: "Unter Odins Segen ist Skandinavien als Reich der alten Götter wiedergeboren."
 STATIC_MODIFIER_NAME_den_royal_authority_mod: "Königliche Autorität"
 STATIC_MODIFIER_DESC_den_royal_authority_mod: "Nicht länger steht der Adelsrat dem Willen des Königs im Weg, und seine Befehle erreichen unmittelbar die Dörfer jedes Winkels des Landes."
 STATIC_MODIFIER_NAME_den_copenhagen_learning_mod: "Die Universität Kopenhagen"
 STATIC_MODIFIER_DESC_den_copenhagen_learning_mod: "Skandinaviens älteste Universität ist in Kopenhagen eröffnet. Sie blüht als Zentrum nordischer Gelehrsamkeit und Kultur."
 STATIC_MODIFIER_NAME_den_copenhagen_capital_mod: "Hauptstadt Kopenhagen entwickelt"
 STATIC_MODIFIER_DESC_den_copenhagen_capital_mod: "Neue steinerne Herrenhäuser erheben sich einer nach dem anderen entlang der Straßen Kopenhagens, das geschäftig ist, wie es einer königlichen Hauptstadt gebührt."
 STATIC_MODIFIER_NAME_den_absolutism_mod: "Absolutismus"
 STATIC_MODIFIER_DESC_den_absolutism_mod: "Die absolute Monarchie ist in Dänemark errichtet – den historischen Wandel von 1660 vorwegnehmend, ist die Königsmacht vollständig gefestigt."
 STATIC_MODIFIER_NAME_den_danish_economy_mod: "Dänische Wirtschaftsmacht"
 STATIC_MODIFIER_DESC_den_danish_economy_mod: "Dänemarks Wirtschaft – aufgebaut auf Öresundzoll, Nordseehandel und skandinavischer Landwirtschaft – ist die größte Nordeuropas."
 STATIC_MODIFIER_NAME_den_crown_privileges_mod: "Kronprivilegien"
 STATIC_MODIFIER_DESC_den_crown_privileges_mod: "Die von den Adligen über Generationen bewahrten Privilegienurkunden sind aufgehoben, und die Schreiber des Königs verwalten nun die Verwaltung des gesamten Reiches."
 STATIC_MODIFIER_NAME_den_royal_navy_mod: "Die königlich-dänische Marine"
 STATIC_MODIFIER_DESC_den_royal_navy_mod: "Die königlich-dänische Marine mit Sitz in Kopenhagen ist gegründet – die dauerhafte militärische Einrichtung, die die Vorherrschaft über Ostsee und Nordsee stützt."
 STATIC_MODIFIER_NAME_den_amber_trade_mod: "Bernsteinhandel"
 STATIC_MODIFIER_DESC_den_amber_trade_mod: "Der Export baltischen Bernsteins ist ausgeweitet. Das „Gold des Nordens“ zirkuliert in ganz Europa und bereichert Dänemark."
 STATIC_MODIFIER_NAME_den_aarhus_mod: "Aarhus entwickelt"
 STATIC_MODIFIER_DESC_den_aarhus_mod: "Jütlands größte Stadt Aarhus ist als Handelsdrehscheibe Westdänemarks ausgebaut."
 STATIC_MODIFIER_NAME_den_malmo_mod: "Malmö entwickelt"
 STATIC_MODIFIER_DESC_den_malmo_mod: "Malmö am westlichen Ufer der Öresund-Meerenge ist als Ostseehandelsdrehscheibe neben Kopenhagen gewachsen."
 STATIC_MODIFIER_NAME_den_norway_north_mod: "Nordnorwegen entwickelt"
 STATIC_MODIFIER_DESC_den_norway_north_mod: "Die Entwicklung der norwegischen Nordküste begründet die Kontrolle über den Nordatlantik und die Norwegische See."
 STATIC_MODIFIER_NAME_den_golden_age_mod: "Das skandinavische goldene Zeitalter"
 STATIC_MODIFIER_DESC_den_golden_age_mod: "Mit eingegliedertem Norwegen und Schweden und errichtetem Absolutismus tritt Skandinavien als Nordeuropas größtes Reich in sein goldenes Zeitalter ein."
 STATIC_MODIFIER_NAME_den_north_sea_dominion_mod: "Herrschaft über die Nordsee"
 STATIC_MODIFIER_DESC_den_north_sea_dominion_mod: "Dänemark, das sowohl Ostsee als auch Nordsee beherrscht, dominiert den gesamten nordeuropäischen Handel."
 STATIC_MODIFIER_NAME_den_scandinavian_empire_final_mod: "Skandinavisches Reich"
 STATIC_MODIFIER_DESC_den_scandinavian_empire_final_mod: "Das Skandinavische Reich, das sich von der Ostsee bis zur Nordsee erstreckt, ist vollendet. Dänemarks Wiederaufbau seit Waldemars Wiederherstellung hat seinen Gipfel erreicht."
 STATIC_MODIFIER_NAME_den_norway_union_bonus_mod: "Bonus der norwegischen Union"
 STATIC_MODIFIER_DESC_den_norway_union_bonus_mod: "Die norwegische Personalunion hat den Weg zur skandinavischen Einheit eröffnet."
 STATIC_MODIFIER_NAME_den_sweden_union_bonus_mod: "Bonus der schwedischen Union"
 STATIC_MODIFIER_DESC_den_sweden_union_bonus_mod: "Die schwedische Personalunion bringt die Bildung der Kalmarer Union in Sicht."
 STATIC_MODIFIER_NAME_den_kalmar_union_mod: "Die Kalmarer Union"
 STATIC_MODIFIER_DESC_den_kalmar_union_mod: "Dänemark, Norwegen und Schweden unter einem König vereint – die größte politische Einigung in der Geschichte des Nordens."
 STATIC_MODIFIER_NAME_den_faith_steadfast_mod: "Standhaft im Glauben"
 STATIC_MODIFIER_DESC_den_faith_steadfast_mod: "Unerschütterlicher katholischer Glaube verkündet dem Volk die Autorität des Königs mit dem Läuten der Glocken des Doms zu Roskilde."
 STATIC_MODIFIER_NAME_den_reform_winds_mod: "Winde der Reform"
 STATIC_MODIFIER_DESC_den_reform_winds_mod: "Luthers Lehre verbreitet sich in ganz Dänemark. Die Woge der Reform verändert die dänische Gesellschaft."
 STATIC_MODIFIER_NAME_den_old_gods_calling_mod: "Ruf der alten Götter"
 STATIC_MODIFIER_DESC_den_old_gods_calling_mod: "Der Glaube an Odin und Thor erwacht heimlich neu. Der Segen der Ahnengötter beflügelt die dänischen Heere."
 den_finland_integration: "Finnland eingliedern"
 den_finland_integration_desc: "Finnland ist das weite waldreiche östliche Reich des schwedischen Königreichs. Åbo (Turku) ist Finnlands Verwaltungs- und Glaubenszentrum; Wyborg wacht über die karelische Grenze; Uleåborg (Oulu) ist die nördlichste Stadt. Die vollständige Beherrschung Finnlands begründet die Ostgrenze des dänischen Reiches von der nördlichen Ostsee bis zum Polarkreis und ermöglicht eine Kolonialpolitik in der Wildnis."
 STATIC_MODIFIER_NAME_den_finland_mod: "Finnische Grenze"
 STATIC_MODIFIER_DESC_den_finland_mod: "Finnlands weite Wälder und Wasserwege ziehen Siedler an. Auswanderer aus Dänemark und Schweden erschließen dieses Grenzland und schieben die Ostgrenzen des Reiches immer weiter vor."
