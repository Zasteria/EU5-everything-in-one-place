l_german:
 mlo_biscione_mission_pack: "Das Erbe des Biscione"
 mlo_biscione_mission_pack_DESCRIPTION:0 "Der Biscione, eine Schlange, die einen Menschen verschlingt, prangt auf dem Wappen der Visconti. Einst nur einer von vielen Stadtstaaten der Lombardei, schmiedet das Herzogtum Mailand nun seinen eigenen Weg inmitten des verwickelten Kampfes um die Vorherrschaft über Norditalien. Ob durch die Entwicklung von Regierung und Kultur, durch den Aufstieg zur führenden Macht des Nordens, oder durch die Behauptung zwischen den Großmächten Papst, Kaiser und Frankreich – die Wahl, welches Erbe zu errichten sei, liegt beim Herzog."
 mlo_biscione_mission_pack_CRITERIA_DESCRIPTION:0 "Schließe Missionen als Herzogtum Mailand ab und begründe eine beherrschende Stellung in Norditalien."
 mlo_biscione_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das Erbe des Biscione zu erben."
 mlo_biscione_mission_pack_BUTTON_DETAILS:0 "Von einem Stadtstaat der Lombardei zum Herzen Italiens!"
 mlo_expanded_domain: "Ein erweitertes Herrschaftsgebiet"
 mlo_expanded_domain_desc: "Das Herzogtum Mailand hat die Städte der Lombardei aufgenommen und sein Gebiet erheblich erweitert."
 mlo_curb_della_scala: "Die della Scala eindämmen"
 mlo_curb_della_scala_desc: "Die wachsende Hegemonie der della Scala, Herren von Verona, über Norditalien muss eingedämmt werden."
 mlo_imperial_vicariate: "Reichsvikariat"
 mlo_imperial_vicariate_desc: "Mit dem Titel des Reichsvikars vom Kaiser des Heiligen Römischen Reiches ausgezeichnet, trägt Mailands Herrschaft nun die Legitimität des Reiches."
 mlo_serpent_that_devours_men: "Die Schlange, die Menschen verschlingt"
 mlo_serpent_that_devours_men_desc: "Der Biscione, eine Schlange, die einen Menschen verschlingt, prangt auf dem Wappen der Visconti. Die Legende verkörpert die Macht der Familie und verkündet ein neues Zeitalter für Mailand."
 mlo_state_led_enterprises: "Staatlich geführte Unternehmungen"
 mlo_state_led_enterprises_desc: "Das Herzogtum Mailand treibt unter staatlicher Leitung die Entwicklung seiner Einrichtungen und seiner Kultur voran."
 mlo_rigorous_plague_policy: "Eine strenge Pestpolitik"
 mlo_rigorous_plague_policy_desc: "Angesichts der Pest muss ein gründliches System der Quarantäne und Isolation errichtet werden, um das Volk des Herzogtums zu schützen."
 mlo_duomo_di_milano: "Der Mailänder Dom"
 mlo_duomo_di_milano_desc: "Treibe den Bau des Mailänder Doms voran und lass die Pracht des Herzogtums bis zum Himmel reichen."
 mlo_road_network_of_the_realm: "Ein Straßennetz für das Reich"
 mlo_road_network_of_the_realm_desc: "Entwickle ein Straßennetz, das das gesamte Herzogtum verbindet, und belebe den Verkehr von Menschen und Gütern."
 mlo_expand_administrative_buildings: "Verwaltungsgebäude erweitern"
 mlo_expand_administrative_buildings_desc: "Aus den Lehren der Pestpolitik schöpfend, erweitere die Verwaltungseinrichtungen des Herzogtums weiter."
 mlo_embrace_the_renaissance: "Die Renaissance annehmen"
 mlo_embrace_the_renaissance_desc: "Neben dem Bau des Doms nimmt der mailändische Hof den neuen Geist der Renaissance an."
 mlo_the_last_supper: "Das Letzte Abendmahl"
 mlo_the_last_supper_desc: "Beauftrage Leonardo da Vinci, das Letzte Abendmahl zu malen, und mache Mailand zu einer Stadt der Künste."
 mlo_naviglio_grande_renovation: "Die Erneuerung des Naviglio Grande"
 mlo_naviglio_grande_renovation_desc: "Erneuere den Naviglio Grande, den Kanal, der Mailand mit der umliegenden Region verbindet, und belebe Handel und Landwirtschaft."
 mlo_castello_sforzesco: "Das Castello Sforzesco"
 mlo_castello_sforzesco_desc: "Erweitere das Castello Sforzesco, ein Sinnbild herzoglicher Pracht, als Sitz der mailändischen Regierung."
 mlo_biblioteca_ambrosiana: "Die Biblioteca Ambrosiana"
 mlo_biblioteca_ambrosiana_desc: "Errichte die Biblioteca Ambrosiana, um das angesammelte Wissen der Zeitalter zu beherbergen und die Gelehrsamkeit zu fördern."
 mlo_heart_of_italy: "Eine Stadt, die würdig ist, das Herz Italiens zu sein"
 mlo_heart_of_italy_desc: "Mit Regierung, Gewerbe, Kunst und Gelehrsamkeit allesamt in Blüte, ist Mailand zu einer Stadt geworden, die würdig ist, als Herz Italiens zu stehen."
 mlo_north_italian_ambitions: "Norditalienische Ambitionen"
 mlo_north_italian_ambitions_desc: "Das Herzogtum Mailand setzt seine Heere in Bewegung, um die Vorherrschaft über ganz Norditalien zu sichern."
 mlo_subjugate_lombardy: "Die Lombardei unterwerfen"
 mlo_subjugate_lombardy_desc: "Bringe die Städte der Lombardei unter vollständige Kontrolle und sichere das Fundament des Herzogtums."
 mlo_advance_into_piedmont: "Vorstoß nach Piemont"
 mlo_advance_into_piedmont_desc: "Weite den Einfluss westwärts nach Piemont aus und wirke der Macht des Hauses Savoyen entgegen."
 mlo_strife_over_veneto: "Streit um Venetien"
 mlo_strife_over_veneto_desc: "Konflikt mit Venedig und anderen Mächten um die Kontrolle Venetiens ist unvermeidlich."
 mlo_through_emilia_and_beyond: "Durch Emilia und darüber hinaus"
 mlo_through_emilia_and_beyond_desc: "Durchquere Emilia und öffne einen Weg für weitere Ausdehnung nach Süden."
 mlo_secure_liguria: "Ligurien sichern"
 mlo_secure_liguria_desc: "Sichere Ligurien, einschließlich Genuas, und gewinne einen Stützpunkt am Mittelmeer."
 mlo_reach_the_coveted_sea: "Das ersehnte Meer erreichen"
 mlo_reach_the_coveted_sea_desc: "Mailand, einst ein landumschlossener Staat, sichert sich endlich unmittelbaren Zugang zum Mittelmeer."
 mlo_topple_the_old_rival_florence: "Den alten Rivalen Florenz stürzen"
 mlo_topple_the_old_rival_florence_desc: "Besiege den langjährigen Rivalen Florenz und begründe Einfluss auf die Toskana."
 mlo_between_two_authorities: "Zwischen zwei Autoritäten"
 mlo_between_two_authorities_desc: "Mailand sucht seinen eigenen Weg, gefangen zwischen den drei Großmächten Papst, Kaiser und König von Frankreich."
 mlo_reconcile_with_the_papacy: "Sich mit dem Papsttum versöhnen"
 mlo_reconcile_with_the_papacy_desc: "Verbessere die Beziehungen zur römischen Kurie und gewinne ihre Autorität als Rückhalt."
 mlo_trust_of_the_emperor: "Das Vertrauen des Kaisers"
 mlo_trust_of_the_emperor_desc: "Gewinne das Vertrauen des Kaisers des Heiligen Römischen Reiches und erhöhe das Ansehen des Herzogtums im Reich."
 mlo_overture_to_france: "Annäherung an Frankreich"
 mlo_overture_to_france_desc: "Baue diplomatische Bande zum Königreich Frankreich auf und sichere neue Optionen."
 mlo_the_italian_wars: "Die Italienischen Kriege"
 mlo_the_italian_wars_desc: "Mailand wird in die Italienischen Kriege hineingezogen, wo die Interessen von Papst, Kaiser und Frankreich zusammenprallen."
 mlo_isolate_papal_authority: "Die päpstliche Autorität isolieren"
 mlo_isolate_papal_authority_desc: "Nachdem die Italienischen Kriege überstanden sind, trenne die weltliche Autorität des Papstes von der mailändischen Politik."
 mlo_deny_imperial_authority: "Die kaiserliche Autorität verweigern"
 mlo_deny_imperial_authority_desc: "Nachdem die Italienischen Kriege überstanden sind, wähle einen Weg, das Herzogtum ohne Rückgriff auf kaiserliche Autorität zu regieren."
 mlo_repel_french_authority: "Die französische Autorität zurückweisen"
 mlo_repel_french_authority_desc: "Nachdem die Italienischen Kriege überstanden sind, weise französische Einmischung zurück und bewahre die Unabhängigkeit des Herzogtums."
 mlo_italian_independence: "Italienische Unabhängigkeit"
 mlo_italian_independence_desc: "Mailand hat seinen Rang als starke, eigenständige Macht in Italien gesichert, unabhängig von Papst, Kaiser oder Frankreich."
 mlo_who_achieves_all_things: "Der, der alles vollbringt"
 mlo_who_achieves_all_things_desc: "Nachdem er in Regierung, Kultur, Gebiet und Diplomatie gleichermaßen den Gipfel erreicht hat, ist der Herzog von Mailand nun würdig, „der, der alles vollbringt“ genannt zu werden."
 STATIC_MODIFIER_NAME_mlo_expanded_domain_mod: "Ein wachsendes Herzogtum"
 STATIC_MODIFIER_DESC_mlo_expanded_domain_mod: "Das rasche Wachstum des Herzogtumsgebiets hat die Verbreitung der Verwaltung beflügelt und die Eingliederung neu erworbener Lande beschleunigt."
 STATIC_MODIFIER_NAME_mlo_curb_della_scala_mod: "Vorherrschaft über die della Scala"
 STATIC_MODIFIER_DESC_mlo_curb_della_scala_mod: "Nachdem der Einfluss der della Scala in Norditalien eingedämmt ist, ist das diplomatische Ansehen des Herzogtums gestiegen."
 STATIC_MODIFIER_NAME_mlo_state_led_enterprises_mod: "Ein verfeinerter Staatsapparat"
 STATIC_MODIFIER_DESC_mlo_state_led_enterprises_mod: "Die Visconti und Sforza zeichneten sich durch großangelegte staatliche öffentliche Bauten aus. Die Certosa di Pavia, das Castello Sforzesco in Mailand, das Kanalnetz des Naviglio Grande – alle waren große, von öffentlicher Autorität getriebene Bauprojekte."
 STATIC_MODIFIER_NAME_mlo_rigorous_plague_policy_mod: "Ein errichtetes Quarantänesystem"
 STATIC_MODIFIER_DESC_mlo_rigorous_plague_policy_mod: "Im ganzen Herzogtum errichtete Krankenhäuser haben den landesweiten Widerstand gegen Krankheit gestärkt."
 STATIC_MODIFIER_NAME_mlo_duomo_di_milano_mod: "Die Pracht des Doms"
 STATIC_MODIFIER_DESC_mlo_duomo_di_milano_mod: "Der vollendete Mailänder Dom hat die kulturelle Tradition und den Einfluss des Herzogtums gestärkt."
 STATIC_MODIFIER_NAME_mlo_road_network_of_the_realm_mod: "Ein blühendes Straßennetz"
 STATIC_MODIFIER_DESC_mlo_road_network_of_the_realm_mod: "Das entwickelte Straßennetz hat den Handel im ganzen Herzogtum belebt."
 STATIC_MODIFIER_NAME_mlo_expand_administrative_buildings_mod: "Eine erweiterte Verwaltung"
 STATIC_MODIFIER_DESC_mlo_expand_administrative_buildings_mod: "Die Sforza bauten ein mächtiges Beamtensystem auf. In Mailands zentraler Kanzlei (der Cancelleria) versammelten sich fähige Juristen und Schreiber, und sie war als der verfeinertste Verwaltungsapparat Norditaliens bekannt."
 STATIC_MODIFIER_NAME_mlo_embrace_the_renaissance_mod: "Ein Renaissancehof"
 STATIC_MODIFIER_DESC_mlo_embrace_the_renaissance_mod: "Der Hof Francesco Sforzas und seines Sohnes Ludovico Sforza (il Moro) wurde zu einem großen Zentrum der Renaissance. Ludovico empfing Leonardo da Vinci fast zwanzig Jahre lang am Hof und versammelte Künstler und Architekten wie Bramante."
 STATIC_MODIFIER_NAME_mlo_the_last_supper_mod: "Ein unsterbliches Meisterwerk"
 STATIC_MODIFIER_DESC_mlo_the_last_supper_mod: "1495–1498 von Leonardo da Vinci an der Refektoriumswand des Klosters Santa Maria delle Grazie gemalt, gilt „Das Letzte Abendmahl“ als Meisterwerk westlicher Malerei wegen seiner vollkommenen Nutzung der Perspektive und seiner psychologischen Darstellung jeder Figur. Von Ludovico Sforza in Auftrag gegeben, ist es ein Erbe des mailändischen Hofes auf seinem Höhepunkt."
 STATIC_MODIFIER_NAME_mlo_naviglio_grande_renovation_mod: "Die Vorteile des Kanalnetzes"
 STATIC_MODIFIER_DESC_mlo_naviglio_grande_renovation_mod: "Der erneuerte Naviglio Grande hat die Verbreitung der Regierung von der Hauptstadt aus dauerhaft beschleunigt."
 STATIC_MODIFIER_NAME_mlo_biblioteca_ambrosiana_mod: "Eine blühende Gelehrsamkeit"
 STATIC_MODIFIER_DESC_mlo_biblioteca_ambrosiana_mod: "Die Gründung der Biblioteca Ambrosiana hat die Fertigkeit neu heranwachsender Künstler erhöht."
 STATIC_MODIFIER_NAME_mlo_heart_of_italy_mod: "Das Herz Italiens"
 STATIC_MODIFIER_DESC_mlo_heart_of_italy_mod: "Als Herz Italiens zieht Mailand Menschen aus jedem Winkel an, sein Wohlstand nun dauerhaft."
 STATIC_MODIFIER_NAME_mlo_north_italian_ambitions_mod: "Ambitionen in Norditalien"
 STATIC_MODIFIER_DESC_mlo_north_italian_ambitions_mod: "Ambitionen auf ganz Norditalien haben den Aufbau von Spionagenetzen beschleunigt."
 STATIC_MODIFIER_NAME_mlo_subjugate_lombardy_mod: "Oberherr der Lombardei"
 STATIC_MODIFIER_DESC_mlo_subjugate_lombardy_mod: "Die vollständige Kontrolle der Lombardei hat das diplomatische Ansehen des Herzogtums erhöht."
 STATIC_MODIFIER_NAME_mlo_advance_into_piedmont_mod: "Ein Stützpunkt in Piemont"
 STATIC_MODIFIER_DESC_mlo_advance_into_piedmont_mod: "Piemont war die Sphäre des Hauses Savoyen und ein langjähriger Rivale Mailands. Diesen strategischen Korridor über die Alpen nach Frankreich zu halten, wäre ein Schild gegen die Invasion aus dem Westen. Sowohl die Visconti als auch die Sforza versuchten wiederholt, in die Region vorzudringen."
 STATIC_MODIFIER_NAME_mlo_strife_over_veneto_mod: "Kriegsehren aus Venetien"
 STATIC_MODIFIER_DESC_mlo_strife_over_veneto_mod: "Kriegsehren aus dem Streit um Venetien haben das Ansehen des Heeres erhöht."
 STATIC_MODIFIER_NAME_mlo_through_emilia_and_beyond_mod: "Ein Weg nach Süden"
 STATIC_MODIFIER_DESC_mlo_through_emilia_and_beyond_mod: "Der jenseits Emilias geöffnete Weg stützt die Moral des Heeres."
 STATIC_MODIFIER_NAME_mlo_secure_liguria_mod: "Der Handel Liguriens"
 STATIC_MODIFIER_DESC_mlo_secure_liguria_mod: "Die Sicherung Liguriens, einschließlich Genuas, hat die Tätigkeit der Kaufleute beflügelt."
 STATIC_MODIFIER_NAME_mlo_reach_the_coveted_sea_mod: "Ein Tor zum Mittelmeer"
 STATIC_MODIFIER_DESC_mlo_reach_the_coveted_sea_mod: "Nachdem es das ersehnte Meer erreicht hat, ist die Versorgungsfähigkeit der Marine verbessert."
 STATIC_MODIFIER_NAME_mlo_topple_the_old_rival_florence_mod: "Sonnenuntergang am Arno"
 STATIC_MODIFIER_DESC_mlo_topple_the_old_rival_florence_mod: "Der Ruhm, den langjährigen Rivalen Florenz besiegt zu haben, hat die Pracht des Herzogtums erhöht."
 STATIC_MODIFIER_NAME_mlo_between_two_authorities_mod: "Diplomatie zwischen den Mächten"
 STATIC_MODIFIER_DESC_mlo_between_two_authorities_mod: "Mailand lenkte seine Diplomatie und wahrte dabei eine gewisse Distanz zu allen drei Autoritäten: dem Kaiser des Heiligen Römischen Reiches, dem Papst und dem König von Frankreich. Die Diplomaten der Sforza übten das Konzept des „Gleichgewichts der Kräfte“ aus und brachten Norditalien lange relative Ruhe."
 STATIC_MODIFIER_NAME_mlo_reconcile_with_the_papacy_mod: "Frieden mit dem Papsttum"
 STATIC_MODIFIER_DESC_mlo_reconcile_with_the_papacy_mod: "Die Versöhnung mit dem Papsttum hat Stabilität des Glaubens im Herzogtum gebracht."
 STATIC_MODIFIER_NAME_mlo_trust_of_the_emperor_mod: "Das Vertrauen des Kaisers"
 STATIC_MODIFIER_DESC_mlo_trust_of_the_emperor_mod: "Das Vertrauen des Kaisers hat das Ansehen des Herzogtums im Reich erhöht."
 STATIC_MODIFIER_NAME_mlo_overture_to_france_mod: "Freundschaft mit Frankreich"
 STATIC_MODIFIER_DESC_mlo_overture_to_france_mod: "Diplomatische Bande zum Königreich Frankreich haben die Freundschaft zwischen den beiden Staaten vertieft."
 STATIC_MODIFIER_NAME_mlo_the_italian_wars_mod: "Erfahrung der Italienischen Kriege"
 STATIC_MODIFIER_DESC_mlo_the_italian_wars_mod: "Das Überleben der Italienischen Kriege hat die Tradition des Heeres gefördert."
 STATIC_MODIFIER_NAME_mlo_isolate_papal_authority_mod: "Unabhängigkeit vom Papst"
 STATIC_MODIFIER_DESC_mlo_isolate_papal_authority_mod: "Die Distanz zur weltlichen Autorität des Papstes hat die Toleranz gegenüber Häretikern erhöht."
 STATIC_MODIFIER_NAME_mlo_deny_imperial_authority_mod: "Unabhängigkeit vom Kaiser"
 STATIC_MODIFIER_DESC_mlo_deny_imperial_authority_mod: "Regierung frei vom Rückgriff auf kaiserliche Autorität hat Stabilität im Herzogtum gebracht."
 STATIC_MODIFIER_NAME_mlo_repel_french_authority_mod: "Unabhängigkeit von Frankreich"
 STATIC_MODIFIER_DESC_mlo_repel_french_authority_mod: "Die Zurückweisung französischer Einmischung hat die Moral des Heeres erhöht."
 STATIC_MODIFIER_NAME_mlo_italian_independence_mod: "Eine eigenständige italienische Macht"
 STATIC_MODIFIER_DESC_mlo_italian_independence_mod: "Unabhängig von jeder Großmacht zu stehen hat sowohl die Pracht als auch die Legitimität des Herzogs erhöht."
 STATIC_MODIFIER_NAME_mlo_who_achieves_all_things_mod: "Der Herzog, der alles vollbringt"
 STATIC_MODIFIER_DESC_mlo_who_achieves_all_things_mod: "„Er, der alles vollbringt“ (Chi tutte cose fa) – der Wahlspruch der Sforza war keine bloße Prahlerei, sondern der politische Ausdruck des Renaissance-Ideals des „Universalmenschen“. Militärischer Eroberer und großer Förderer der Künste, Gesetzgeber und Pfleger des Handels – der Gipfel des Herzogtums Mailand verkörpert den politischen Höhepunkt der italienischen Renaissance."
 mlo_events.1.t: "Die Legende des Biscione"
 mlo_events.1.d: "Das Wappen der Visconti trägt eine einzige Schlange, die einen Menschen verschlingt – den Biscione. Manche sagen, sie erinnere an eine Heldentat in den Kreuzzügen; andere behaupten, sie versinnbildliche einen besiegten Ungläubigen. Was auch die Wahrheit sein mag, das Sinnbild verkündet in ganz Norditalien, dass die Macht der Familie und der Stadtstaat Mailand selbst nicht mehr die Angelegenheiten eines bloßen örtlichen Herren sind. Vor dem Herzog liegen nun viele Wege: der Weg des Staatsmanns, der Weg des Eroberers und der Weg des Diplomaten, der zwischen den Großmächten wandelt."
 mlo_events.1.a: "Ein neues Zeitalter ist über Mailand gekommen"
 mlo_events.2.t: "Mailand im Jahr 1337"
 mlo_events.2.d: "Im Jahr 1337 steht Mailand unter der gemeinsamen Herrschaft Luchino Viscontis und seines Bruders, Erzbischof Giovanni Visconti. Zur Zeit ihres Vorgängers Azzone wurde der Titel des Reichsvikars von Kaiser Ludwig IV. verliehen und lieh so Mailands Herrschaft die Autorität des Reiches. In ganz Norditalien halten mächtige Herren die Herrschaft und wetteifern miteinander – die della Scala von Verona, die Gonzaga von Mantua, die Este von Ferrara und mehr. Da der Papst in Avignon sitzt und die Kraft des Kaisers nördlich der Alpen konzentriert ist, wird es derjenige sein, der die Vorherrschaft über die Lombardei ergreift, der über das Schicksal Norditaliens entscheidet."
 mlo_events.2.a: "Die Grundlagen Mailands sind verstanden"
 mlo_events.3.t: "Die Geschichte des Castello Sforzesco"
 mlo_events.3.d: "Mailands Burg begann als eine von den Visconti erbaute Festung, bekannt als Corte dell’Arengo. Als die herzogliche Linie mit dem Tod Filippo Maria Viscontis 1447 endete, riefen die Bürger die Ambrosianische Republik aus und rissen einen Großteil der Burg, Sinnbild der alten Herrscher, die sie abgeworfen hatten, nieder. Doch 1450 ließ Francesco Sforza, der das Chaos der Republik beendete und den herzoglichen Titel übernahm, die Festung neu und prächtiger als zuvor wiederaufbauen, um seine eigene Autorität zu verkünden. Seither steht das Castello Sforzesco als Sitz herzoglicher Macht in Mailand, sein Glanz ungetrübt."
 mlo_events.3.a: "Das Gewicht dieser Geschichte ist verstanden"
 mlo_castello_sforzesco_building: "Castello Sforzesco"
 mlo_castello_sforzesco_building_desc: "Eine von Francesco Sforza wiedererbaute Festung, die als Sinnbild herzoglicher Macht in Mailand steht. Wenn in der Hauptstadt vorhanden, stärkt sie kulturelle Tradition, kulturellen Einfluss und die Kronmacht."
 STATIC_MODIFIER_NAME_mlo_serpent_reward_mod: "Herrschaft des Biscione"
 STATIC_MODIFIER_DESC_mlo_serpent_reward_mod: "Das Schlangenwappen der Visconti (der Biscione) – eine Schlange, die einen Menschen verschlingt – ist das Sinnbild von Mailands Macht und Ehrgeiz. Der Legende nach gewann es ein Vorfahre der Visconti in einem Duell mit einem sarazenischen Ritter. Die Vollendung der italienischen Einigung bedeutet, dass die Schlange endlich das ganze Land verschlungen hat."
