l_german:
 swe_stormaktstiden_mission_pack: "Stormaktstiden – Schwedens Zeitalter der Großmacht"
 swe_stormaktstiden_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist Schweden ein unabhängiges Königreich in Personalunion mit Norwegen unter König Magnus Eriksson. Im Norden liegt das mächtige Dänemark, und der kommende Kampf um die Vorherrschaft in Skandinavien – wie ihn die Kalmarer Union (1397) vorwegnimmt – ist unausweichlich. Verwirkliche durch Faluns Kupferbergwerk, die Herrschaft über die Ostsee und die warägischen Wege nach Osten die Stormaktstiden (das Zeitalter der Großmacht) und errichte das Schwedische Reich."
 swe_stormaktstiden_mission_pack_CRITERIA_DESCRIPTION:0 "Erringe als Schweden die Vorherrschaft über Skandinavien, die Einigung, die Ausdehnung nach Osten und industrielle Entwicklung, um das Skandinavische Reich zu gründen."
 swe_stormaktstiden_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das Schwedische Reich zu errichten."
 swe_stormaktstiden_mission_pack_BUTTON_DETAILS:0 "Vom Engelbrekt-Aufstand zur Stormaktstiden – schmiede Schweden zu einem Reich!"
 swe_kingdom_of_sweden: "Das Königreich Schweden"
 swe_kingdom_of_sweden_desc: "Im Jahr 1337 ist Schweden ein unabhängiges Königreich in Personalunion mit Norwegen unter König Magnus Eriksson. Umgeben vom mächtigen Dänemark im Norden, russischen Fürstentümern im Osten und der Hanse im Süden, muss Schweden seine Legitimität stärken und sein Reich stabilisieren, um sich auf den kommenden Kampf um die Vorherrschaft in Skandinavien vorzubereiten."
 swe_norway_union: "Personalunion mit Norwegen"
 swe_norway_union_desc: "Schweden und Norwegen stehen seit 1319 unter König Magnus in Personalunion. Die Stärkung dieses Bündnisses vereint die militärische und wirtschaftliche Macht der beiden nordischen Königreiche gegen Dänemark."
 swe_break_from_denmark: "Dänemark entgegentreten"
 swe_break_from_denmark_desc: "Die kommende Kalmarer Union (1397) droht, Dänemark die Vorherrschaft über Skandinavien zu geben – eine Zukunft, die Schweden vermeiden muss. Behaupte jetzt tatkräftig schwedische Macht gegen Dänemark und sichere das Fundament für den Anspruch auf die Vorherrschaft in Skandinavien. Nimm den Geist des Engelbrekt-Aufstands (1434) vorweg und begründe die schwedische Königsautorität, ehe dieser Tag kommt."
 swe_control_skaane: "Schonen beherrschen"
 swe_control_skaane_desc: "Schonen (Skåne) ist Schwedens südlichste Region, seit langem mit Dänemark umstritten. Die Einnahme Malmös und Schonens sichert die Öresund-Meerenge und verschafft Schweden einen freien Ausgang zur Ostsee."
 swe_defeat_denmark: "Dänemark besiegen"
 swe_defeat_denmark_desc: "Dänemark ist Schwedens größter Feind. Die Besetzung Kopenhagens oder die Unterwerfung Dänemarks als schwedischer Untertan bedeutet, dass die Herrschaft über den Norden an Schweden übergeht. „Schweden ist der wahre Führer Skandinaviens“ – die Stellung, von der Gustav Wasa träumte, wird hier verwirklicht."
 swe_integrate_norway: "Norwegen eingliedern"
 swe_integrate_norway_desc: "Der unmittelbare Besitz von Oslo, Bergen und Nidaros gliedert Norwegen vollständig als Teil des Schwedischen Reiches ein. Norwegens reiche Fischgründe und das Tor zum Nordatlantik erweitern die schwedische Macht erheblich."
 swe_unite_scandinavia: "Skandinavien einen"
 swe_unite_scandinavia_desc: "Dänemark zerschlagen, Norwegen eingegliedert – ganz Skandinavien unter dem schwedischen Banner vereint. Diese Leistung – die Einigung ganz Skandinaviens, die seit dem Wikingerzeitalter niemandem gelungen ist – ist nun verwirklicht."
 swe_danish_navy_seizure: "Die dänische Flotte erbeuten"
 swe_danish_navy_seizure_desc: "Nach der Niederlage Dänemarks geht seine mächtige Flotte an Schweden über. Die stärkste Seemacht der Ostsee liegt nun in schwedischer Hand und öffnet den Weg zur Herrschaft über die Nordsee."
 swe_danish_navy_seizure_unlock_tt: "Die Entscheidung „Die dänische Flotte eingliedern“ ist nun verfügbar."
 swe_danish_fleet_decision.title: "Die dänische Flotte eingliedern"
 swe_danish_fleet_decision.desc: "Die erbeuteten dänischen Schiffe liegen untätig in den Häfen des besiegten Königreichs. Sie zu bemannen und umzurüsten wird die Schatzkammer teuer zu stehen kommen und das Reich in Unruhe versetzen, doch sechs große Karacken unter schwedischer Flagge würden das Gleichgewicht der Ostsee verschieben."
 swe_danish_fleet_decision.a: "Die sechs Karacken in Dienst stellen."
 swe_sound_toll: "Der Öresundzoll"
 swe_sound_toll_desc: "Mit gesichertem Schonen beherrscht Schweden nun die Öresund-Meerenge auf schwedischer Seite. Den Öresundzoll an Dänemarks Stelle einzuziehen, schafft gewaltige Einnahmen."
 swe_control_gotland: "Gotland beherrschen"
 swe_control_gotland_desc: "Visby auf Gotland ist eine der größten Handelsstädte der Ostsee. Die Einnahme dieses von Dänemark, der Hanse und dem Livländischen Orden umkämpften Preises begründet Schwedens Stützpunkt im Ostseehandel."
 swe_baltic_trade: "Ostseehandel"
 swe_baltic_trade_desc: "Mit Gotland als Basis tritt Schweden ernsthaft in den Ostseehandel ein. Einst trugen die Waräger Waren von Schweden bis nach Byzanz. Belebe diese Tradition neu und schaffe das Zeitalter schwedischer Kaufleute, die die Ostsee beherrschen."
 swe_conquer_estonia: "Estland erobern"
 swe_conquer_estonia_desc: "Reval (Tallinn) wurde ursprünglich von Dänen erbaut, doch Schweden gewann Estland im Livländischen Krieg (1558–83). Nimm diese historische Eroberung vorweg und begründe Schwedens Brückenkopf am östlichen Ostseeufer."
 swe_control_livonia: "Livland beherrschen"
 swe_control_livonia_desc: "Die Einnahme Rigas und Dorpats bringt die gesamte östliche Ostseeküste unter schwedische Kontrolle. Im Wettstreit mit Polen, Russland und Dänemark wird Schweden zum endgültigen Herrn Livlands."
 swe_varangian_legacy: "Warägisches Erbe"
 swe_varangian_legacy_desc: "Im 8. bis 10. Jahrhundert bauten Waräger (Wikinger) Nowgorod auf und eröffneten Handelswege über den Dnepr bis nach Konstantinopel. Die Einnahme Nowgorods und Pskows belebt dieses uralte Erbe in der Neuzeit."
 swe_city_of_rus: "Stadt der Rus"
 swe_city_of_rus_desc: "Moskau ist die Hauptstadt des Großfürstentums Moskau und das Zentrum der Welt der Rus. Als Erbe der Waräger vollendet Schweden mit der Beherrschung Moskaus das Schwedische Reich, das sich von der Ostsee bis zur gesamten ostslawischen Zivilisation erstreckt."
 swe_bane_of_hansa: "Verderben der Hanse"
 swe_bane_of_hansa_desc: "Die Hanse hat den Ostseehandel monopolisiert, doch mit Schwedens Aufstieg zeigen sich Risse. Beherrsche Lübeck (das Haupt der Hanse) oder zerschlage die Hanse vollständig, um die Hauptrolle im Ostseehandel an Schweden zu übertragen."
 swe_pomeranian_coast: "Die pommersche Küste"
 swe_pomeranian_coast_desc: "Die Einnahme Stralsunds und Stettins bringt die pommersche Küste an der südlichen Ostsee unter schwedische Kontrolle. Nimm vorweg, was Schweden im Dreißigjährigen Krieg (1618–48) tatsächlich gewann, und sichere diese Region."
 swe_prussian_ambition: "Preußische Ambitionen"
 swe_prussian_ambition_desc: "Preußen, einst vom Deutschen Orden beherrscht, ist die südöstliche Ostseedrehscheibe. Die Sicherung Königsbergs und der Region Preußen verschafft Schweden die vollständige Beherrschung der Ostsee."
 swe_dominium_maris_baltici: "Dominium Maris Baltici"
 swe_dominium_maris_baltici_desc: "„Dominium Maris Baltici“ (Herrschaft über die Ostsee) – Schwedens höchstes strategisches Ziel des 17. Jahrhunderts. Die Beherrschung der gesamten Ostseeküste macht dieses Binnenmeer zu Schwedens „See“."
 swe_secure_stockholm: "Stockholm sichern"
 swe_secure_stockholm_desc: "Stockholm – „Insel zwischen den Wassern“ – ist eine natürliche Festungsstadt zwischen dem Mälarsee und der Ostsee. Es zum Stadtrang mit Entwicklung 30+ zu erheben, begründet es als Zentrum der schwedischen Königsmacht."
 swe_falun_mine: "Das Bergwerk Falun"
 swe_falun_mine_desc: "Stora Kopparberget (der Große Kupferberg) – Faluns Kupferbergwerk ist seit dem 9. Jahrhundert in Betrieb, das Herz von Schwedens Wirtschaft. Als Magnus IV. der Bergbaugesellschaft 1347 weitere Privilegien gewährte, deckte es zwei Drittel des europäischen Kupferbedarfs. Bringe dieses Bergwerk zur vollen Leistung."
 swe_iron_industry: "Die schwedische Eisenindustrie"
 swe_iron_industry_desc: "Svealands Eisenbergwerke sind das Fundament von Schwedens Rüstungsindustrie. Hochwertiges schwedisches Eisen war bei Heeren in ganz Europa begehrt – die Kanonen des Dreißigjährigen Krieges verwendeten schwedisches Eisen. Baue diesen industriellen Vorteil weiter aus."
 swe_swedish_steel: "Schwedischer Stahl"
 swe_swedish_steel_desc: "Schwedischer Stahl – berühmt als Europas feinste Qualität. Die von reichlicher Kupfer- und Eisenerzeugung getragene Stahlindustrie versinnbildlicht die wirtschaftliche Stärke des Schwedischen Reiches sowohl bei der Ausrüstung schwedischer Heere als auch beim Exporteinkommen."
 swe_riksdag: "Der Reichstag"
 swe_riksdag_desc: "Der Reichstag (Riksdag) wurde 1435 erstmals in Schweden einberufen. Diese Ständeversammlung aus Adligen, Rittern, Klerus und Bauern (einzigartig: die schwedischen Bauern hatten ihre eigene Standesvertretung) sollte gestärkt werden, um Schwedens eigenständige politische Tradition zu begründen."
 swe_absolutism: "Absolutismus"
 swe_absolutism_desc: "1680 gewann Karl XI. durch die „Reduktion“ Adelsländereien zurück und errichtete in Schweden die absolute Monarchie. Nimm diesen historischen Wandel vorweg und festige die königliche Macht vollständig."
 swe_great_power: "Schweden als Großmacht"
 swe_great_power_desc: "Die Stormaktstiden des 17. Jahrhunderts sah Schweden unter Gustav Adolf, Karl X. Gustav und Karl XII. als bedeutende europäische Macht hervortreten. Nimm dieses Zeitalter mit weitem Gebiet, reichem Einkommen und hohem Ansehen vorweg."
 swe_stormakt_economy: "Wirtschaft einer Großmacht"
 swe_stormakt_economy_desc: "Schwedischer Stahl, die Verwaltungseffizienz der absoluten Monarchie, Ostseehandel – das wirtschaftliche Fundament der Stormaktstiden ist vollendet. Beweise die schwedische Reichsstärke mit monatlichem Einkommen 400+ und mehreren Marktzentren."
 swe_religious_crossroads: "Scheideweg des Glaubens"
 swe_religious_crossroads_desc: "Der Sturm der Reformation fegt über Skandinavien. Der schwedische Hof streitet heftig: die Treue zum römischen Papst bewahren – Martin Luthers revolutionäre Lehre annehmen – oder zu den alten Göttern der Vorfahren zurückkehren? Die Entscheidung des schwedischen Königs wird die Zukunft dieses nordischen Königreichs bestimmen."
 swe_catholic_sweden: "Katholisches Schweden"
 swe_catholic_sweden_desc: "Das Königreich Schweden bewahrt seine Treue zur römischen Kirche. Enge Beziehungen zum Papst verschaffen Schweden diplomatische Vorteile und Anerkennung als Beschützer der nördlichen katholischen Zivilisation."
 swe_northern_crusade: "Nordischer Kreuzzug"
 swe_northern_crusade_desc: "Schweden nimmt als nördlicher Schild der Christenheit am Heiligen Krieg teil. Die Führung nordischer Kreuzzüge gegen nichtchristliche Völker erhöht Schwedens religiöse Autorität und Ansehen."
 swe_church_reform: "Vorkämpfer des Papstes"
 swe_church_reform_desc: "Tiefes Vertrauen zum Papsttum und die Beherrschung Lübecks – Schweden hat eine unerschütterliche Stellung als Beschützer der nördlichen katholischen Zivilisation begründet."
 swe_reformation: "Die Reformation"
 swe_reformation_desc: "1527 erklärte der schwedische König Gustav Wasa auf dem Reichstag zu Västerås das Luthertum zur faktischen Staatsreligion. Die Übertragung des Kirchenbesitzes an die Krone stärkte die Staatsfinanzen erheblich. Nimm diesen entscheidenden Akt jetzt vorweg."
 swe_protestant_reform: "Protestantische Kirche"
 swe_protestant_reform_desc: "Errichte Universitäten, um lutherische Theologen auszubilden, und verankere den protestantischen Glauben in ganz Schweden. Die Eigenständigkeit der schwedischen Kirche wird zum Fundament schwedischer Kultur und Identität."
 swe_protestant_empire: "Protestantisches Reich"
 swe_protestant_empire_desc: "Das Luthertum durchdringt ganz Skandinavien. Der schwedische König herrscht als nördlicher Vorkämpfer der protestantischen Welt, fähig, sich wie im Dreißigjährigen Krieg den katholischen Mächten des Südens entgegenzustellen."
 swe_norse_revival: "Wiedererweckung des Nordischen Glaubens"
 swe_norse_revival_desc: "Die Götter der Vorfahren – Odin, Thor, Freyr – werden wiedergeboren. Die Gestalt Skandinaviens vor der Christianisierung wird in der Neuzeit nachgebildet. Der schwedische König, der als Vertreter der nordischen Götter herrscht – diese revolutionäre Wahl wird ganz Europa erschüttern."
 swe_berserker_army: "Heer der Berserker"
 swe_berserker_army_desc: "Der Geist der Bärenkrieger des Wikingerzeitalters wird wiederbelebt. Krieger, die den nordischen Göttern geweiht sind, werden zur Freibeuterei entfesselt, frei, die Küsten der Ungläubigen zu überfallen."
 swe_yggdrasil_throne: "Thron von Yggdrasil"
 swe_yggdrasil_throne_desc: "Wie Odin, thronend an den Wurzeln des Weltenbaums, herrscht der schwedische Kaiser im Mittelpunkt der nordischen Welt. Mit Kaiserrang und 500+ Orten ist das von den nordischen Göttern gesegnete nördliche Reich vollendet."
 swe_finland_integration: "Finnland eingliedern"
 swe_finland_integration_desc: "Finnland ist seit dem 12. Jahrhundert fester Bestandteil Schwedens. Der unmittelbare Besitz von Åbo, Wyborg und Uleåborg begründet Schwedens Brückenkopf zum Nordatlantik und zur Barentssee."
 swe_lapland_expansion: "Ausdehnung nach Lappland"
 swe_lapland_expansion_desc: "Die weiten Wälder Norrlands (Nordschweden) sind Heimat des samischen Volkes. Ihre Lande in das Königreich einzugliedern und die reichen Vorkommen an Holz, Pelzen und Eisenerz zu sichern, beginnt die ernsthafte Erschließung von Schwedens nördlicher Grenze."
 swe_arctic_empire: "Arktisches Reich"
 swe_arctic_empire_desc: "Der Vorstoß zur Norwegischen See und zur Barentssee um Uleåborg – Schweden wird zu einem nördlichen Reich, das sich bis zum Polarkreis erstreckt. Marinegouverneure werden eingesetzt und die maritime Präsenz erweitert, um die nördliche Grenze des Schwedischen Reiches zu vollenden."
 swe_develop_stockholm: "Groß-Stockholm"
 swe_develop_stockholm_desc: "Stockholm hat sich zu einer großen Stadt mit Universität entwickelt. Diese Stadt, die Ostsee und Nordsee verbindet, wächst als kulturelles, kaufmännisches und politisches Zentrum des Schwedischen Reiches zur größten Stadt Nordeuropas heran."
 swe_develop_goteborg: "Göteborg entwickeln"
 swe_develop_goteborg_desc: "Göteborg wurde 1621 von Gustav Adolf als Schwedens Hafen an der Westküste erbaut. Es zum Stadtrang zu erheben, öffnet eine direkte Handelsroute nach Dänemark, in die Niederlande und nach England."
 swe_peasant_support: "Unterstützung der Bauern"
 swe_peasant_support_desc: "Schwedens Bauernstand hält im Reichstag eine eigene Vertretung – eine Besonderheit. Die Zufriedenheit der Bauern zu heben und die Getreideproduktion auszuweiten begründet gesellschaftliche Stabilität und Schwedens eigenständige demokratische Tradition."
 swe_engelbrekt: "Der Geist Engelbrekts"
 swe_engelbrekt_desc: "1434–36 führte Engelbrekt Engelbrektsson Bergleute und Bauern im Aufstand gegen die dänische Herrschaft an. Er wurde ermordet, doch sein Geist wurde zum ewigen Sinnbild der schwedischen Unabhängigkeitsbewegung. Verkörpere diesen Geist nun förmlich."
 swe_colonization: "Das schwedische Kolonialreich"
 swe_colonization_desc: "Schweden errichtete im 17. Jahrhundert auch Kolonien, darunter Neuschweden (am Delaware-Fluss). Baue auf Finnlands Entwicklung auf, beginne überseeische Kolonialunternehmungen und dehne die Reichweite des Schwedischen Reiches über die Welt aus."
 swe_develop_uppsala: "Die Universität Uppsala erblüht"
 swe_develop_uppsala_desc: "Die Universität Uppsala (gegründet 1477), die älteste Schwedens, brachte Carl von Linné (Taxonomie) und Anders Celsius (Thermometer) hervor – Nordeuropas beste Akademie. Entwickle diese Universität und festige die Grundlagen schwedischer Gelehrsamkeit."
 swe_karoliner: "Die Karoliner"
 swe_karoliner_desc: "Die Karoliner (Soldaten König Karls) waren das Elitefußvolk des Schwedischen Reiches unter Karl XII. im frühen 18. Jahrhundert, bekannt als das stärkste Fußvolk ihrer Zeit. Entwickle hohe Heerestradition und ein großes Heer, um dieses Elitekorps vorwegzunehmen."
 swe_amber_trade: "Bernsteinhandel"
 swe_amber_trade_desc: "Baltischer Bernstein, aus schwedisch beherrschten Gebieten in ganz Europa ausgeführt, ist das „Gold des Nordens“. Baue auf dem wirtschaftlichen Fundament der Großmacht auf und weite den Bernsteinhandel weiter aus, um das Handelseinkommen des Schwedischen Reiches zu steigern."
 swe_stormaktstiden: "Stormaktstiden"
 swe_stormaktstiden_desc: "Skandinavien geeint, die Ostsee beherrscht, die Wirtschaft einer Großmacht erreicht – die drei Säulen fügen sich, und Schweden erreicht den Gipfel der Stormaktstiden (des Zeitalters der Großmacht). Mit 600+ Orten, Einkommen 600+, Ansehen 80+ ergreife diesen Ruhm."
 swe_swedish_empire: "Das Schwedische Reich"
 swe_swedish_empire_desc: "Von der Ostsee bis Moskau, von Skandinavien bis Preußen – das Schwedische Reich ist vollendet. Schwedens Weg, der 1337 mit einer Personalunion mit Norwegen begann, endet hier mit der Ankunft eines großen Reiches, das ganz Nordeuropa beherrscht. „Schweden lacht zuletzt“ – Karls XII. Worte werden hier verwirklicht."
 swe_events.30.t: "Skandinavische Einheit – die Morgenröte der Stormaktstiden"
 swe_events.30.d: "Dänemark zerschlagen, Norwegen eingegliedert – ganz Skandinavien unter dem schwedischen Banner vereint. Diese seit dem Wikingerzeitalter unerreichte Leistung ist endlich verwirklicht. Der schwedische König verkündet hiermit den Titel „König von Skandinavien“, und der Aufbau des größten Staates Nordeuropas beginnt. „Engelbrekts Traum wurde heute hier verwirklicht“ – so werden künftige Historiker schreiben."
 swe_events.30.a: "Es lebe Skandinavien! Die Einheit des Nordens für immer!"
 swe_events.40.t: "Scheideweg des Glaubens – Schwedens religiöse Wahl"
 swe_events.40.d: "Der Sturm der Reformation fegt über Skandinavien. Der schwedische Hof streitet heftig. Die Treue zum Papst in Rom bewahren – Luthers revolutionäre Lehre annehmen – oder zu den alten Göttern der Vorfahren zurückkehren? Die Entscheidung des schwedischen Königs wird die Zukunft dieses nordischen Königreichs bestimmen."
 swe_events.40.a: "Die Treue zu Rom bewahren – der Katholizismus ist Schwedens Seele"
 swe_events.40.b: "Luthers Lehre annehmen – das Zeitalter der Reform ist gekommen"
 swe_events.40.c: "Zu den alten Göttern zurückkehren – Odins Segen suchen"
 swe_events.99.t: "Die Geburt des Schwedischen Reiches"
 swe_events.99.d: "Von der Ostsee bis Moskau, von Skandinavien bis Preußen – das Schwedische Reich ist endlich vollendet. Von Schwedens Weg, der 1337 mit einer norwegischen Personalunion begann, hat sich Schweden von einer nordischen Randnation zu einem großen Reich gewandelt, das ganz Nordeuropa beherrscht. Die Stormaktstiden (das Zeitalter der Großmacht) – das war die Ära, in der Schweden zu einem führenden Akteur der Weltgeschichte wurde. „Wieder ist es Tag – doch diesmal ist es Schwedens Tag.“"
 swe_events.99.a: "Es lebe der Kaiser des Schwedischen Reiches! Möge das Nordische Reich ewig bestehen!"
 STATIC_MODIFIER_NAME_swe_kingdom_mod: "Königreich Schweden"
 STATIC_MODIFIER_DESC_swe_kingdom_mod: "Der Grundstein für Schwedens Wiederaufbau unter der Herrschaft König Magnus Erikssons ist gelegt."
 STATIC_MODIFIER_NAME_swe_norway_union_mod: "Bonus der norwegischen Union"
 STATIC_MODIFIER_DESC_swe_norway_union_mod: "Die Personalunion mit Norwegen vereint die militärische Macht des nordwestlichen Skandinaviens."
 STATIC_MODIFIER_NAME_swe_skaane_mod: "Schonen gesichert"
 STATIC_MODIFIER_DESC_swe_skaane_mod: "Die schwedische Seite der Öresund-Meerenge ist durch die Beherrschung Schonens gesichert."
 STATIC_MODIFIER_NAME_swe_norway_integrated_mod: "Norwegen eingegliedert – Geschenk der Fischgründe"
 STATIC_MODIFIER_DESC_swe_norway_integrated_mod: "Norwegens reiche Fischgründe sind in das Schwedische Reich eingegliedert."
 STATIC_MODIFIER_NAME_swe_scandinavia_united_mod: "Skandinavien geeint"
 STATIC_MODIFIER_DESC_swe_scandinavia_united_mod: "Die Banner dreier Königreiche stehen Seite an Seite unter einer Krone, und Befehle aus Stockholm erreichen die nördlichen Meere."
 STATIC_MODIFIER_NAME_swe_baltic_trade_mod: "Ostseehandel"
 STATIC_MODIFIER_DESC_swe_baltic_trade_mod: "Schweden tritt ernsthaft in den Ostseehandel ein. Die alten warägischen Handelswege leben wieder auf."
 STATIC_MODIFIER_NAME_swe_estonia_mod: "Estland erobert"
 STATIC_MODIFIER_DESC_swe_estonia_mod: "Estland um Reval ist unter schwedische Kontrolle gekommen."
 STATIC_MODIFIER_NAME_swe_livonia_mod: "Livland beherrscht"
 STATIC_MODIFIER_DESC_swe_livonia_mod: "Mit der Einnahme Rigas und Dorpats steht die gesamte östliche Ostseeküste unter schwedischer Verwaltung."
 STATIC_MODIFIER_NAME_swe_varangian_mod: "Warägisches Erbe"
 STATIC_MODIFIER_DESC_swe_varangian_mod: "Die Einnahme Nowgorods belebt die uralten warägischen Handelswege neu."
 STATIC_MODIFIER_NAME_swe_eastern_empire_mod: "Herrschaft über die Rus"
 STATIC_MODIFIER_DESC_swe_eastern_empire_mod: "Die Einnahme Moskaus macht Schweden zum Herrn der ostslawischen Welt."
 STATIC_MODIFIER_NAME_swe_dominium_baltici_mod: "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_swe_dominium_baltici_mod: "Die Ostsee wird zu Schwedens „See“. Jedes Handelsschiff, das dieses Meer überquert, antwortet Schweden."
 STATIC_MODIFIER_NAME_swe_hansa_victory_mod: "Hanse besiegt"
 STATIC_MODIFIER_DESC_swe_hansa_victory_mod: "Schweden besiegt die Hanse und wird zum Star des Ostseehandels."
 STATIC_MODIFIER_NAME_swe_pomerania_mod: "Die pommersche Küste"
 STATIC_MODIFIER_DESC_swe_pomerania_mod: "Was Schweden im Dreißigjährigen Krieg gewann, vorwegnehmend, steht die südliche Ostseeküste unter schwedischer Kontrolle."
 STATIC_MODIFIER_NAME_swe_prussia_mod: "Preußische Ambitionen"
 STATIC_MODIFIER_DESC_swe_prussia_mod: "Preußen einschließlich Königsberg ist unter schwedische Kontrolle gekommen."
 STATIC_MODIFIER_NAME_swe_stockholm_mod: "Stockholm gesichert"
 STATIC_MODIFIER_DESC_swe_stockholm_mod: "Die schwedische Königshauptstadt Stockholm ist als Verwaltungszentrum ausgebaut."
 STATIC_MODIFIER_NAME_swe_falun_copper_mod: "Das Kupferbergwerk Falun"
 STATIC_MODIFIER_DESC_swe_falun_copper_mod: "Das Kupferbergwerk Falun, das Europas Kupferbedarf trägt, ist in voller Leistung."
 STATIC_MODIFIER_NAME_swe_iron_industry_mod: "Die Eisenindustrie"
 STATIC_MODIFIER_DESC_swe_iron_industry_mod: "Svealands Eisenbergwerke sind voll in Betrieb und begründen das Fundament von Schwedens Rüstungsindustrie."
 STATIC_MODIFIER_NAME_swe_steel_mod: "Schwedischer Stahl"
 STATIC_MODIFIER_DESC_swe_steel_mod: "Schwedischer Stahl höchster europäischer Qualität wird an Heere im In- und Ausland geliefert."
 STATIC_MODIFIER_NAME_swe_riksdag_mod: "Der Reichstag"
 STATIC_MODIFIER_DESC_swe_riksdag_mod: "Schwedens Parlament ist als funktionsfähiges Gesetzgebungsorgan errichtet. Schwedens eigenständige politische Tradition, an der auch Bauern teilhaben, nimmt Gestalt an."
 STATIC_MODIFIER_NAME_swe_absolutism_mod: "Absolutismus"
 STATIC_MODIFIER_DESC_swe_absolutism_mod: "Karls XI. Reduktion vorwegnehmend, ist in Schweden die absolute Monarchie errichtet."
 STATIC_MODIFIER_NAME_swe_great_power_mod: "Schweden als Großmacht"
 STATIC_MODIFIER_DESC_swe_great_power_mod: "Mit dem Anbruch der Stormaktstiden tritt Schweden als bedeutende europäische Macht hervor."
 STATIC_MODIFIER_NAME_swe_stormakt_economy_mod: "Wirtschaft der Großmacht"
 STATIC_MODIFIER_DESC_swe_stormakt_economy_mod: "Schwedens Wirtschaft als Großmacht – gestützt auf schwedischen Stahl, absolute Monarchie und Ostseehandel – ist vollendet."
 STATIC_MODIFIER_NAME_swe_catholic_mod: "Katholisches Schweden"
 STATIC_MODIFIER_DESC_swe_catholic_mod: "Der Treue zur römischen Kirche folgend, wird Schweden als Beschützer der nördlichen katholischen Zivilisation anerkannt."
 STATIC_MODIFIER_NAME_swe_crusader_glory_mod: "Ruhm des Nordischen Kreuzfahrers"
 STATIC_MODIFIER_DESC_swe_crusader_glory_mod: "Schweden nimmt am Heiligen Krieg teil und begründet seinen Ruf als Beschützer der Christenheit."
 STATIC_MODIFIER_NAME_swe_lutheran_mod: "Lutherische Reform"
 STATIC_MODIFIER_DESC_swe_lutheran_mod: "Gustav Wasas lutherische Erklärung vorwegnehmend, geht der Kirchenbesitz an die Krone über."
 STATIC_MODIFIER_NAME_swe_protestant_reform_mod: "Protestantische Kirche"
 STATIC_MODIFIER_DESC_swe_protestant_reform_mod: "Die Ausbildung lutherischer Theologen verankert den protestantischen Glauben in ganz Schweden."
 STATIC_MODIFIER_NAME_swe_norse_conversion_mod: "Wiedererweckung des Nordischen Glaubens"
 STATIC_MODIFIER_DESC_swe_norse_conversion_mod: "Der Glaube an Odin, Thor und Freyr ist wiederbelebt. Der Kriegergeist des Wikingerzeitalters wohnt Schwedens Heeren inne."
 STATIC_MODIFIER_NAME_swe_berserker_mod: "Heer der Berserker"
 STATIC_MODIFIER_DESC_swe_berserker_mod: "Der Geist der Bärenkrieger des Wikingerzeitalters ist wiederbelebt. Kaperfahrten sind entfesselt, um die Küsten der Ungläubigen zu überfallen."
 STATIC_MODIFIER_NAME_swe_yggdrasil_mod: "Thron von Yggdrasil"
 STATIC_MODIFIER_DESC_swe_yggdrasil_mod: "Wie Odin an den Wurzeln des Weltenbaums herrscht der schwedische Kaiser im Mittelpunkt der nordischen Welt."
 STATIC_MODIFIER_NAME_swe_finland_mod: "Finnland eingegliedert"
 STATIC_MODIFIER_DESC_swe_finland_mod: "Finnland ist als Teil des Schwedischen Reiches eingegliedert. Die Kolonialpolitik öffnet die nördliche Grenze."
 STATIC_MODIFIER_NAME_swe_lapland_mod: "Ausdehnung nach Lappland"
 STATIC_MODIFIER_DESC_swe_lapland_mod: "Die weiten Wälder Norrlands sind in Schweden eingegliedert."
 STATIC_MODIFIER_NAME_swe_arctic_mod: "Arktisches Reich"
 STATIC_MODIFIER_DESC_swe_arctic_mod: "Schwedische Leuchtfeuer an der Arktisküste weisen den Seeleuten den Weg über den Nordatlantik."
 STATIC_MODIFIER_NAME_swe_stormaktstiden_mod: "Stormaktstiden"
 STATIC_MODIFIER_DESC_swe_stormaktstiden_mod: "Schwedens Zeitalter der Großmacht – den Gipfel des nördlichen Reiches erreicht, das Skandinavien, die Ostsee und Osteuropa beherrscht."
 STATIC_MODIFIER_NAME_swe_sound_toll_mod: "Öresundzoll"
 STATIC_MODIFIER_DESC_swe_sound_toll_mod: "Der Einzug des Öresundzolls bereichert die schwedische Schatzkammer."
 STATIC_MODIFIER_NAME_swe_stockholm_great_mod: "Stockholm – Stadt des Nordens"
 STATIC_MODIFIER_DESC_swe_stockholm_great_mod: "Stockholm, zu einer großen Stadt mit Universität entwickelt, ist Nordeuropas größte kulturelle und akademische Hauptstadt geworden."
 STATIC_MODIFIER_NAME_swe_peasant_mod: "Unterstützung der Bauern"
 STATIC_MODIFIER_DESC_swe_peasant_mod: "Die Unterstützung des schwedischen Bauernstandes schafft eine für Schweden eigentümliche gesellschaftliche Stabilität."
 STATIC_MODIFIER_NAME_swe_engelbrekt_mod: "Der Geist Engelbrekts"
 STATIC_MODIFIER_DESC_swe_engelbrekt_mod: "Der Geist des Aufstands von 1434 beseelt die schwedischen Heere. Der Kampf für die Freiheit ist Schwedens Stolz."
 STATIC_MODIFIER_NAME_swe_colonial_mod: "Das schwedische Kolonialreich"
 STATIC_MODIFIER_DESC_swe_colonial_mod: "Schweden beginnt überseeische Kolonialunternehmungen und wird zu einem Reich jenseits Nordeuropas."
 STATIC_MODIFIER_NAME_swe_papal_champion_mod: "Vorkämpfer des Papstes"
 STATIC_MODIFIER_DESC_swe_papal_champion_mod: "Schweden begründet eine unerschütterliche Stellung als stärkster Beschützer der nördlichen katholischen Zivilisation."
 STATIC_MODIFIER_NAME_swe_protestant_empire_mod: "Protestantisches Reich"
 STATIC_MODIFIER_DESC_swe_protestant_empire_mod: "Schweden, mit ganz Skandinavien im Luthertum, herrscht als nördlicher Vorkämpfer der protestantischen Welt."
 STATIC_MODIFIER_NAME_swe_amber_mod: "Bernsteinhandel"
 STATIC_MODIFIER_DESC_swe_amber_mod: "An den Ufern der Ostsee gesammelter Bernstein glänzt golden in den Schaufenstern der Stockholmer Juweliere."
 STATIC_MODIFIER_NAME_swe_uppsala_mod: "Die Universität Uppsala"
 STATIC_MODIFIER_DESC_swe_uppsala_mod: "Schwedens älteste Universität gedeiht als Nordeuropas beste akademische Einrichtung."
 STATIC_MODIFIER_NAME_swe_karoliner_mod: "Die Karoliner"
 STATIC_MODIFIER_DESC_swe_karoliner_mod: "Karls Elitefußvolk vorwegnehmend, ist ein hochtrainiertes schwedisches Heer vollendet."
 STATIC_MODIFIER_NAME_swe_scandinavian_empire_final_mod: "Schwedisches Reich"
 STATIC_MODIFIER_DESC_swe_scandinavian_empire_final_mod: "Das Schwedische Reich, das sich von der Ostsee bis Osteuropa erstreckt, ist vollendet. Die Stormaktstiden bestehen für immer."
 STATIC_MODIFIER_NAME_swe_faith_steadfast_mod: "Standhaft im Glauben"
 STATIC_MODIFIER_DESC_swe_faith_steadfast_mod: "Unerschütterlicher katholischer Glaube verkündet dem Volk die Autorität des Königs mit dem Läuten der Glocken des Doms zu Uppsala."
 STATIC_MODIFIER_NAME_swe_reform_winds_mod: "Winde der Reform"
 STATIC_MODIFIER_DESC_swe_reform_winds_mod: "Luthers Lehre verbreitet sich in ganz Schweden."
 STATIC_MODIFIER_NAME_swe_old_gods_calling_mod: "Ruf der alten Götter"
 STATIC_MODIFIER_DESC_swe_old_gods_calling_mod: "Der Glaube an Odin und Thor erwacht heimlich neu."
 swe_norrkoping_textiles: "Norrköpings Textilindustrie"
 swe_norrkoping_textiles_desc: "Norrköping wurde zu einer Industriestadt an Schwedens Ostküste, einem Zentrum der Textil- und Tuchherstellung. Mit der reichlichen Wasserkraft des Motala-Flusses wird die Tuchherstellung zu einer wichtigen Säule der schwedischen Exporte."
 STATIC_MODIFIER_NAME_swe_norrkoping_textile_mod: "Norrköpings Textilindustrie"
 STATIC_MODIFIER_DESC_swe_norrkoping_textile_mod: "Die wasserkraftbetriebene Tuchherstellung in Norrköping arbeitet mit voller Leistung. Schwedische Tuchexporte gehen auf die europäischen Märkte."
 STATIC_MODIFIER_NAME_swe_goteborg_mod: "Hafen Varberg entwickelt"
 STATIC_MODIFIER_DESC_swe_goteborg_mod: "Am Hafen von Varberg am Kattegat lichten Segelschiffe, die zur Nordsee bestimmt sind, einer nach dem anderen den Anker."
 STATIC_MODIFIER_NAME_swe_visby_mod: "Handel in Visby"
 STATIC_MODIFIER_DESC_swe_visby_mod: "Das Lagerhausviertel von Visby auf Gotland ist wieder belebt von Kaufleuten aus der ganzen Ostsee."
 STATIC_MODIFIER_NAME_swe_denmark_crushed_mod: "Dänemark zerschlagen"
 STATIC_MODIFIER_DESC_swe_denmark_crushed_mod: "Als die Flagge Dänemarks, unseres alten Feindes, gesenkt wurde, sprachen die Fürsten Skandinaviens leise den Namen ihres neuen Oberherrn."
