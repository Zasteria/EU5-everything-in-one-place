l_german:
 cas_castile_dev_hub: "Entwicklung der Kronstädte"
 cas_castile_dev_hub_desc: "Beaufsichtige die Entwicklung der Städte der kastilischen Kronlande und sichere das wirtschaftliche Fundament des Königreichs."
 cas_granada_dev_hub: "Der Wiederaufbau Granadas"
 cas_granada_dev_hub_desc: "Bringe den Städten des gefallenen Königreichs Granada – Granada selbst und Málaga – neuen Wohlstand."
 STATIC_MODIFIER_NAME_cas_crown_domains_mod: "Entwicklung der Kronstädte"
 STATIC_MODIFIER_DESC_cas_crown_domains_mod: "Die Steuereintreiber des Königs gehen stolz durch die neuen Märkte und Mauern, die in den Kronstädten errichtet wurden."
 STATIC_MODIFIER_NAME_cas_granada_dev_mod: "Granada wiederbelebt"
 STATIC_MODIFIER_DESC_cas_granada_dev_mod: "Von den Fenstern der Alhambra trägt das Läuten neuer Kirchenglocken über das Tal."
 cas_castile_mission_pack: "Der Ruhm des Königreichs Kastilien"
 cas_castile_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist Kastilien ein mächtiges Königreich unter Alfons XI. Die Reconquista ist beinahe vollendet – nur Granada bleibt. Der Fall Granadas, die Vereinigung mit Aragón, Kolumbus’ Reise, die Konquistadoren Cortés und Pizarro und Philipps II. Reich, in dem die Sonne nie untergeht. Durchlebe Kastiliens Geschichte."
 cas_castile_mission_pack_CRITERIA_DESCRIPTION:0 "Vollende die Reconquista, bilde Spanien, errichte ein Kolonialreich und begründe das Reich, in dem die Sonne nie untergeht."
 cas_castile_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das Reich zu begründen, in dem die Sonne nie untergeht."
 cas_castile_mission_pack_BUTTON_DETAILS:0 "Vom Fall Granadas zum Weltreich Philipps II.!"
 cas_sword_of_castile: "Das Schwert Kastiliens"
 cas_sword_of_castile_desc: "1337 – Alfons XI. regiert Kastilien tatkräftig. In der Schlacht am Río Salado 1340 vernichtete er die vereinten Streitkräfte der Meriniden und Granadas und legte das Fundament dafür, die letzte muslimische Macht von der Iberischen Halbinsel zu vertreiben. Erhebe die Kronen von Kastilien und León und schwinge das Schwert der Reconquista noch einmal."
 cas_secure_castile: "Der Ausbau von Valladolid"
 cas_secure_castile_desc: "Durch die vollständige Beherrschung Kastiliens und Leóns ist die zentrale Basis der Reconquista begründet."
 cas_fall_of_granada: "Der Fall Granadas"
 cas_fall_of_granada_desc: "Am 2. Januar 1492 übergibt der letzte Sultan von Granada, Boabdil, am „Hügel der Tränen“ Isabella von Kastilien die Schlüssel. Die 780 Jahre währende Reconquista ist endlich vollendet."
 cas_conquer_navarre: "Navarra erobern"
 cas_conquer_navarre_desc: "Die Einnahme des Königreichs Navarra am Kreuzungspunkt der Pyrenäen begründet die Grenze zu Frankreich und vollendet die Herrschaft über das nördliche Iberien."
 cas_subdue_aragon: "Die Vereinigung mit Aragón"
 cas_subdue_aragon_desc: "Die Heirat von Isabella und Ferdinand (1469) schuf die Personalunion von Kastilien und Aragón. Unter den „Katholischen Königen“ nimmt Spanien Gestalt an."
 cas_form_spain: "Die Bildung Spaniens"
 cas_form_spain_desc: "Kastilien, das den größten Teil der Iberischen Halbinsel geeint hat, erklärt förmlich das „Königreich Spanien“. Die Geburt der größten Macht Europas."
 cas_conquer_portugal: "Die Eingliederung Portugals"
 cas_conquer_portugal_desc: "1580 erbte Philipp II. den portugiesischen Thron – die „Iberische Union“. Damit erhielt Spanien auch die Kontrolle über Portugals Kolonialreich."
 cas_iberian_union: "Die Iberische Union"
 cas_iberian_union_desc: "Die gesamte Iberische Halbinsel fällt unter spanische Herrschaft. Vom Atlantik bis zum Indischen Ozean bedecken spanische und portugiesische Kolonien die Welt."
 cas_holy_brotherhood: "Santa Hermandad"
 cas_holy_brotherhood_desc: "Die von Königin Isabella gegründete Santa Hermandad (Heilige Bruderschaft) unterdrückt als Ordnungsorganisation die Adelsmacht und stärkt die königliche Autorität."
 cas_inquisition: "Die Spanische Inquisition"
 cas_inquisition_desc: "Im Jahr 1478 gewährte Papst Sixtus IV. Isabella und Ferdinand die Vollmacht, die Inquisition einzurichten. Die von Torquemada geführten Inquisitoren wirken für die Wahrung der Reinheit des Glaubens."
 cas_expulsion_of_jews: "Das Vertreibungsedikt"
 cas_expulsion_of_jews_desc: "Das Alhambra-Edikt von 1492 – die Vertreibung der Juden, die die Bekehrung verweigern, aus Spanien wird verkündet. Diese Entscheidung wahrt die katholische Reinheit, verliert aber viele fähige Kaufleute und Gelehrte."
 cas_catholic_monarchs: "Die Katholischen Könige"
 cas_catholic_monarchs_desc: "Papst Alexander VI. verleiht Isabella und Ferdinand den Titel „Katholische Könige (Reyes Católicos)“. Spanien wird als Beschützer der katholischen Welt anerkannt."
 cas_absolute_crown: "Absolute Monarchie"
 cas_absolute_crown_desc: "Die Beschränkung der Adelsprivilegien und die Verabsolutierung der königlichen Macht – Spanien geht als einer der ersten modernen absolutistischen Staaten Europas hervor."
 cas_cortes: "Die kastilischen Cortes"
 cas_cortes_desc: "Die Cortes (das Parlament) sind Kastiliens überlieferte Ständeversammlung. Der Ausgleich zwischen königlicher Autorität und Parlament begründet ein stabiles Regierungssystem."
 cas_leyes_de_indias: "Die Gesetze der Indien"
 cas_leyes_de_indias_desc: "Die Gesetze der Indien, die die Behandlung der indigenen Völker in den Kolonien regeln – eingeführt als Antwort auf die humanitären Argumente des Bartolomé de las Casas."
 cas_canary_islands: "Die Kanarischen Inseln"
 cas_canary_islands_desc: "Die Kanarischen Inseln im Atlantik sind ein strategischer Punkt im Wettstreit mit Portugal. Ihre Beherrschung beginnt Spaniens atlantische Ausdehnung."
 cas_atlantic_exploration: "Atlantische Erkundung"
 cas_atlantic_exploration_desc: "Während Portugal an der afrikanischen Küste nach Süden zieht, wendet sich Spanien westwärts über den Atlantik. Der Traum vom „westlichen Weg nach Indien“ steht kurz vor der Verwirklichung."
 cas_columbus_voyage: "Kolumbus’ Reise"
 cas_columbus_voyage_desc: "Am 3. August 1492 bricht Christoph Kolumbus von Palos auf. Drei Schiffe – Santa María, Pinta und Niña – überqueren den Atlantik und öffnen die Tür zu einer neuen Welt."
 cas_conquer_caribbean: "Die Karibik erobern"
 cas_conquer_caribbean_desc: "Mit Hispaniola (Santo Domingo) als Basis ist die spanische Vorherrschaft in der Karibik begründet. Zucker, Tabak und Edelmetalle schaffen einen Strom des Reichtums nach Spanien."
 cas_conquer_mexico: "Mexiko erobern"
 cas_conquer_mexico_desc: "1519–1521 – Hernán Cortés eroberte mit 500 Soldaten die aztekische Hauptstadt Tenochtitlán. Das „Vizekönigreich Neuspanien“ ist geboren."
 cas_conquer_peru: "Peru erobern"
 cas_conquer_peru_desc: "Francisco Pizarro stürzte mit 168 Mann das Inkareich – eine der erstaunlichsten Eroberungen der Geschichte. Gold und Silber der Anden fließen nach Spanien."
 cas_silver_of_potosi: "Das Silber von Potosí"
 cas_silver_of_potosi_desc: "Potosís Silberbergwerke (entdeckt 1545, auf 4.000 m Höhe) sind die größten der europäischen Geschichte. Das Silber des „Cerro Rico (Reicher Berg)“ trägt die Finanzen des spanischen Reiches."
 cas_colonial_empire: "Das Kolonialreich"
 cas_colonial_empire_desc: "Von Mexiko bis Peru, von der Karibik bis zur nordamerikanischen Südküste – spanische Kolonialstaaten bedecken die Welt. Die Leistungen der Konquistadoren legen das Fundament des Reiches."
 cas_manila_galleon: "Die Manila-Galeone"
 cas_manila_galleon_desc: "Nach der Gründung Manilas 1571 monopolisierte die Manila-Galeone den transpazifischen Handel zwischen Acapulco und Manila – der erste wahrhaft globale Handelsweg der Welt, der asiatische Seide und Porzellan mit amerikanischem Silber verband."
 cas_conquer_naples: "Das Königreich Neapel erobern"
 cas_conquer_naples_desc: "„El Gran Capitán“ Gonzalo de Córdoba besiegte Frankreich und nahm Neapel ein. Spaniens Einfluss auf Italien ist begründet."
 cas_conquer_sicily: "Sizilien sichern"
 cas_conquer_sicily_desc: "Sizilien, die Kornkammer des Mittelmeers, bereits unter der aragonesischen Krone, wird in das spanische Reich eingegliedert, um die Herrschaft über die Mittelmeerinseln zu vollenden."
 cas_conquer_milan: "Mailand unterwerfen"
 cas_conquer_milan_desc: "Als letztes Ergebnis der Italienischen Kriege fällt das Herzogtum Mailand unter spanische Herrschaft. Die gesamte italienische Halbinsel wird zu Spaniens Einflusssphäre."
 cas_mediterranean_mastery: "Herrschaft über das Mittelmeer"
 cas_mediterranean_mastery_desc: "Neapel, Sizilien, Sardinien, Mailand – Spaniens Mittelmeerreich ist begründet. Zum ersten Mal seit dem antiken Rom wird das Mittelmeer von einer einzigen Macht beherrscht."
 cas_battle_of_lepanto: "Die Schlacht von Lepanto"
 cas_battle_of_lepanto_desc: "Am 7. Oktober 1571 vernichtet die Flotte der Christlichen Liga aus Spanien, Venedig und dem Papst die osmanische Marine. Der „Sieg der Heiligen Liga“. Die christliche Überlegenheit im Mittelmeer ist begründet."
 cas_secure_ceuta: "Ceuta sichern"
 cas_secure_ceuta_desc: "Ceuta, das der Iberischen Halbinsel jenseits der Straße von Gibraltar gegenüberliegt, ist das Tor nach Afrika. Seine Beherrschung sichert den westlichen Eingang zum Mittelmeer."
 cas_conquer_oran: "Oran erobern"
 cas_conquer_oran_desc: "1509 eroberte Kardinal Cisneros Oran – der erste Schritt der „afrikanischen Reconquista“. Der Gegenangriff auf die muslimischen Kräfte in Nordafrika beginnt."
 cas_conquer_tunis: "Tunis erobern"
 cas_conquer_tunis_desc: "1535 eroberten die spanischen Truppen Karls V. Tunis. Spaniens Militärmacht, die mit dem Osmanischen Reich um die Vorherrschaft in Nordafrika wetteifert, wird der Welt vor Augen geführt."
 cas_north_africa_dominion: "Herrschaft über Nordafrika"
 cas_north_africa_dominion_desc: "Von Ceuta bis Oran fällt die nordafrikanische Mittelmeerküste unter spanische Herrschaft. Die muslimische Piraterie ist beseitigt, und der Mittelmeerhandel stabilisiert sich."
 cas_dev_sevilla: "Das Tor zu den Indien"
 cas_dev_sevilla_desc: "Sevilla am Guadalquivir – die uralte Stadt blüht als ausschließliches Tor des Handels mit der Neuen Welt. Die „Casa de Contratación“ macht sie zur größten Handelsstadt der Welt."
 cas_casa_de_contratacion: "Casa de Contratación"
 cas_casa_de_contratacion_desc: "1503 in Sevilla gegründet, verwaltet die Casa de Contratación (das Handelshaus) ausschließlich den spanischen Kolonialhandel. Aller Handel mit der Neuen Welt läuft hier durch."
 cas_dev_toledo: "Die Klingenindustrie von Toledo"
 cas_dev_toledo_desc: "Toledo ist Kastiliens historische Hauptstadt und eine für Schwerter, Goldschmiedekunst und Seide berühmte Gewerbestadt. Der Ruhm des „Toledaner Stahls“ verbreitet sich in der ganzen Welt."
 cas_dev_madrid: "Madrid als Hauptstadt"
 cas_dev_madrid_desc: "1561 erklärte Philipp II. Madrid zur ständigen Hauptstadt – ein revolutionärer Wandel für Spanien, dessen Hof zuvor von Stadt zu Stadt gezogen war. Madrids Bevölkerung explodiert."
 cas_dev_burgos: "Die Stadt des El Cid"
 cas_dev_burgos_desc: "Burgos, die „Stadt des El Cid“ – die historische Hauptstadt Kastiliens, die durch den Wollhandelsexport nach Nordeuropa blüht."
 cas_trade_network: "Das imperiale Handelsnetz"
 cas_trade_network_desc: "Von Sevilla bis Manila, von Antwerpen bis zur Neuen Welt – Spaniens imperiales Handelsnetz umspannt den Globus."
 cas_tercio: "Der Tercio (spanisches Karree)"
 cas_tercio_desc: "Die größte Taktik des 16. Jahrhunderts – der Tercio verbindet Pikeniere, Musketiere und Schwertkämpfer in einer Fußvolkformation. „Das spanische Fußvolk ist das stärkste der Welt“ wird auf dem Schlachtfeld bewiesen."
 cas_military_orders: "Die Militärorden"
 cas_military_orders_desc: "Die drei Militärorden von Santiago, Calatrava und Alcántara – in der Zeit der Katholischen Könige werden ihr Besitz und ihre Autorität unter königliche Kontrolle gebracht, um die Militärmacht zu stützen."
 cas_grande_armada: "Die Spanische Armada"
 cas_grande_armada_desc: "1588 entsandte Philipp II. zur Eroberung Englands die große Flotte „La Armada“ von 130 Schiffen – ein Sinnbild des Höhepunkts der spanischen Seemacht."
 cas_conquistadors: "Die Konquistadoren"
 cas_conquistadors_desc: "Cortés, Pizarro, Balboa, de Soto – die Namen der Eroberer sind in die Geschichte gegraben. Mit kleinen Soldatenzahlen eroberten sie gewaltige Reiche und bewiesen der Welt die Überlegenheit der spanischen Militärtechnik."
 cas_salamanca_university: "Die Universität Salamanca"
 cas_salamanca_university_desc: "1218 gegründet, ist die Universität Salamanca eine der ältesten Europas. Als beste Stätte der Theologie, des Rechts und der Medizin bildet sie die Beamten, Geistlichen und Gelehrten des spanischen Reiches aus."
 cas_siglo_de_oro: "Das Goldene Zeitalter (Siglo de Oro)"
 cas_siglo_de_oro_desc: "Cervantes, Lope de Vega, Velázquez, El Greco – das spanische kulturelle goldene Zeitalter des 16. und 17. Jahrhunderts erblüht. Spanien führt Europa in Literatur, Theater und Malerei an."
 cas_escorial: "Der Escorial"
 cas_escorial_desc: "Das Kloster-Schloss El Escorial, dessen Bau Philipp II. 1563 anordnete – Palast, Kloster und Mausoleum in einem, dieser gewaltige Bau versinnbildlicht den Höhepunkt des spanischen Reiches."
 cas_dev_granada_city: "Das Juwel Spaniens"
 cas_dev_granada_city_desc: "Granada, Heimat des Alhambra-Palastes, ist eine Stadt, in der das muslimische Kulturerbe atmet. Entwickle dieses „Juwel Spaniens“ zum kulturellen und wirtschaftlichen Zentrum des Südens."
 cas_dev_cordoba: "Der Ruhm des Cordobans"
 cas_dev_cordoba_desc: "Córdoba, berühmt für die Mezquita, war einst Hauptstadt des Kalifats der Umayyaden und die größte Stadt der Welt. Nutze dieses Erbe, um es zu einem Zentrum von Kultur und Gelehrsamkeit zu entwickeln."
 cas_inherit_flanders: "Flandern erben"
 cas_inherit_flanders_desc: "Flandern wurde als Teil des burgundischen Erbes in Spanien eingegliedert. Die reichen Tuchstädte Antwerpen, Brügge und Gent tragen die Finanzen des spanischen Reiches."
 cas_revolt_of_flanders: "Flandern befrieden"
 cas_revolt_of_flanders_desc: "Unterdrücke den flämischen Widerstand und gliedere diese blühende Region als stabilen Teil in das spanische Reich ein."
 cas_greatest_power: "Das Fundament des unsterblichen Reiches"
 cas_greatest_power_desc: "Kolonialreich, Tercios und Armada – die drei Säulen sind vollendet, und Spanien hat eine beispiellose Höhe des Wohlstands erreicht. Nun ist der Augenblick gekommen, den letzten Schritt zum Reich zu tun, in dem die Sonne nie untergeht."
 cas_empire_of_the_sun: "Das Reich, in dem die Sonne nie untergeht"
 cas_empire_of_the_sun_desc: "„In meinem Reich geht die Sonne nie unter“ – die Worte Karls V. werden Wirklichkeit. Von Spanien bis Neapel, von Flandern bis zur Neuen Welt, von Manila bis zur Karibik – das spanische Banner weht überall auf Erden."
 cas_battle_rio_salado: "Der Sieg am Río Salado"
 cas_battle_rio_salado_desc: "In der Schlacht am Río Salado 1340 besiegte Alfons XI. die vereinten Streitkräfte der Meriniden und Granadas – der Vorhang hebt sich für den Schlussakt der Reconquista."
 cas_dev_leon_city: "Der Ruhm des alten Königreichs León"
 cas_dev_leon_city_desc: "León, die ehemalige Hauptstadt des Königreichs León, das einst die Reconquista anführte – entwickle es unter Nutzung seiner Geschichte und Tradition."
 cas_church_reform: "Die Kirchenreform"
 cas_church_reform_desc: "Die von Kardinal Cisneros geführte Kirchenreform – die Wiederherstellung der Klosterdisziplin, die Verbesserung der Priesterausbildung und die Beseitigung der Korruption machen Spaniens katholische Kirche zur stärksten geistlichen Autorität Europas."
 cas_counter_reformation: "Die Gegenreformation"
 cas_counter_reformation_desc: "Die von Ignatius von Loyola gegründete Gesellschaft Jesu – die von Spanien angeführte Gegenreformation begegnet der protestantischen Bedrohung. Das Konzil von Trient bekräftigt die katholische Lehre."
 cas_conquer_cuba: "Kuba erobern"
 cas_conquer_cuba_desc: "1511 eroberte Diego Velázquez Kuba. Havanna wird als Handelsdrehscheibe der Karibik ausgebaut und zum Schlüsselhafen der Wege zur Neuen Welt."
 cas_conquer_florida: "Florida erkunden"
 cas_conquer_florida_desc: "Juan Ponce de León entdeckte 1513 „La Florida (Land der Blumen)“ – auf der Jagd nach der Legende vom „Jungbrunnen“ beginnt die Erkundung Nordamerikas."
 cas_conquer_philippines: "Die Philippinen erobern"
 cas_conquer_philippines_desc: "1565 eroberte Miguel López de Legazpi die Philippinischen Inseln und gründete Manila. Spaniens Ausdehnung nach Asien ist verwirklicht, und der transpazifische Handel der Manila-Galeone ist geboren."
 cas_gold_fleets: "Gold- und Silberflotten"
 cas_gold_fleets_desc: "Potosí-Silber und Inkagold – die „Indienflotte (Flota de Indias)“, die jedes Jahr nach Spanien segelt, schafft den größten Strom des Reichtums der Welt."
 cas_sardinia: "Sardinien sichern"
 cas_sardinia_desc: "Sardinien, bereits unter der aragonesischen Krone, wird in das spanische Reich eingegliedert, um die Herrschaft über die westlichen Mittelmeerinseln zu vollenden."
 cas_conquer_tunis_italy: "Die Herrschaft über Italien begründen"
 cas_conquer_tunis_italy_desc: "Neapel, Sizilien, Sardinien, Mailand – die wichtigsten Regionen der Italienischen Halbinsel fallen unter spanische Herrschaft und fügen dem Wohlstand des spanischen Reiches den Reichtum der Renaissance hinzu."
 cas_garrison_system: "Das Festungsverteidigungsnetz"
 cas_garrison_system_desc: "Ein Festungsverteidigungsnetz, das das riesige spanische Reich schützt – Tercios in Flandern, Festungen in Neapel und Presidios in Nordafrika bewachen die Grenzen des Reiches."
 cas_dev_cadiz: "Der antike phönizische Hafen"
 cas_dev_cadiz_desc: "Die antike phönizische Stadt Cádiz liegt an einem natürlichen Hafen auf einer atlantischen Halbinsel. Sie ist dazu bestimmt, Sevilla als Tor des Indienhandels abzulösen."
 cas_dev_malaga: "Málaga entwickeln"
 cas_dev_malaga_desc: "Málaga an der Mittelmeerküste ist eine für Seide, Wein und Trockentrauben bekannte Handelsstadt. Nach der Eroberung Granadas entwickelt sie sich rasch."
 cas_dev_valencia: "Die Stadt der Sonne"
 cas_dev_valencia_desc: "Valencia, die „Stadt der Sonne“, ist eine Mittelmeerhandelsdrehscheibe, die Seide, Zucker und Reis erzeugt. Die Entwicklung der großen Stadt der aragonesischen Krone bringt Spaniens Ostküste Wohlstand."
 cas_dev_zaragoza: "Die aragonesische Hauptstadt"
 cas_dev_zaragoza_desc: "Saragossa, die Hauptstadt des Königreichs Aragón, ist ein wichtiger Verkehrsknoten am Ebro. Ihre Entwicklung belebt den iberischen Binnenhandel."
 cas_dev_barcelona: "Königin des Mittelmeers"
 cas_dev_barcelona_desc: "Barcelona, das Zentrum des Mittelmeerhandels – entwickle die katalanische Hauptstadt, Aragóns größte Handelsstadt, zur Mittelmeerdrehscheibe des spanischen Reiches."
 cas_dev_segovia: "Der Aquädukt von Segovia"
 cas_dev_segovia_desc: "Segovia, berühmt für seinen Aquädukt und sein königliches Schloss, entwickelt sich als Sinnbild kastilischer Königsmacht."
 cas_west_africa_trade: "Westafrikanischer Handel"
 cas_west_africa_trade_desc: "Mit den Kanarischen Inseln als Stützpunkt tritt Spanien in den westafrikanischen Handel ein und wetteifert mit Portugal um Elfenbein, Gold und schließlich Sklavenhandelswege."
 cas_council_of_trent: "Das Konzil von Trient"
 cas_council_of_trent_desc: "Das Konzil von Trient (1545–1563) – von Spanien angeführt, bekräftigt es die katholische Lehre und legt Richtlinien der Gegenreformation fest. Die Jesuiten stehen an der Spitze des Gegenangriffs auf den Protestantismus."
 cas_events.20.t: "Der Fall Granadas – Vollendung der Reconquista"
 cas_events.20.d: "Am 2. Januar 1492 öffnen sich die Tore der Alhambra, und der letzte Sultan von Granada, Muhammad XII. (Boabdil), übergibt am „Hügel der Tränen“ Isabella und Ferdinand die Schlüssel. Die 780 Jahre währende Reconquista ist endlich vollendet. „Weine nun, denn du konntest nicht wie ein Mann kämpfen“ – die Worte von Boabdils Mutter bleiben in der Geschichte."
 cas_events.20.a: "Es lebe Spanien! Die Reconquista ist vollendet! Ehre Gott und der Jungfrau Maria!"
 cas_events.30.t: "Die Katholischen Könige – Vereinigung mit Aragón"
 cas_events.30.d: "Jahrzehnte nach der Heirat von Isabella und Ferdinand ist die Zeit für die Vereinigung von Kastilien und Aragón gekommen. Papst Alexander VI. verleiht ihnen den Titel „Katholische Könige (Reyes Católicos)“, und die Bildung Spaniens als Nation wird Wirklichkeit."
 cas_events.30.a: "Es leben die Katholischen Könige! Spanien ist eins unter einem Glauben!"
 cas_events.50.t: "Kolumbus’ Reise – Entdeckung der Neuen Welt"
 cas_events.50.d: "Am 12. Oktober 1492 landet Christoph Kolumbus auf der Insel Guanahani auf den Bahamas. Die Existenz einer den Europäern unbekannten Neuen Welt wird enthüllt. Kolumbus’ Entdeckung, im Glauben, „Indien (Asien)“ erreicht zu haben, wird Spanien unermesslichen Reichtum bringen."
 cas_events.50.a: "Gottes Segen der Neuen Welt! Spaniens Banner bis an die andere Seite des Atlantiks!"
 cas_events.99.t: "Das Reich, in dem die Sonne nie untergeht"
 cas_events.99.d: "„In meinem Reich geht die Sonne nie unter (En mi Imperio nunca se pone el sol)“ – die Worte Karls V. werden Wirklichkeit. Von Spanien bis Neapel, von Flandern bis zur Neuen Welt, von den Philippinen bis zur Karibik – die spanische Flagge weht in jedem Winkel der Welt. In der Herrschaft Philipps II. ist das spanische Reich als das erste „Weltreich“ der Menschheit vollendet."
 cas_events.99.a: "Es lebe das Reich, in dem die Sonne nie untergeht! Spanien auf ewig!"
 STATIC_MODIFIER_NAME_cas_reconquista_spirit_mod: "Der Geist der Reconquista"
 STATIC_MODIFIER_DESC_cas_reconquista_spirit_mod: "Das Schwert Kastiliens beflügelt den Heiligen Krieg gegen die Muslime Iberiens."
 STATIC_MODIFIER_NAME_cas_rio_salado_mod: "Der Sieg am Río Salado"
 STATIC_MODIFIER_DESC_cas_rio_salado_mod: "Die Zerschlagung der Koalition aus Meriniden und Granada am Río Salado eröffnet den Schlussakt der Reconquista."
 STATIC_MODIFIER_NAME_cas_leon_city_mod: "Der Ruhm des alten Königreichs León"
 STATIC_MODIFIER_DESC_cas_leon_city_mod: "Die uralte Hauptstadt León ist als Sinnbild des Vermächtnisses der Reconquista entwickelt."
 STATIC_MODIFIER_NAME_cas_church_reform_mod: "Die Kirchenreform"
 STATIC_MODIFIER_DESC_cas_church_reform_mod: "Cisneros’ Reform macht Spaniens katholische Kirche zur disziplinierteren und mächtigsten Europas."
 STATIC_MODIFIER_NAME_cas_counter_ref_mod: "Die Gegenreformation"
 STATIC_MODIFIER_DESC_cas_counter_ref_mod: "Spanien führt den katholischen Gegenangriff gegen die protestantische Reformation an."
 STATIC_MODIFIER_NAME_cas_havana_mod: "Havanna – Drehscheibe der Karibik"
 STATIC_MODIFIER_DESC_cas_havana_mod: "Havanna ist als größte Handels- und Marinedrehscheibe der Karibik ausgebaut."
 STATIC_MODIFIER_NAME_cas_florida_mod: "La Florida"
 STATIC_MODIFIER_DESC_cas_florida_mod: "Spanische Erkundung Nordamerikas begründet eine Präsenz im Südosten des Kontinents."
 STATIC_MODIFIER_NAME_cas_philippines_mod: "Die Philippinischen Inseln"
 STATIC_MODIFIER_DESC_cas_philippines_mod: "Spaniens Ausdehnung nach Asien ist verwirklicht – Manila wird zur Drehscheibe des transpazifischen Handels."
 STATIC_MODIFIER_NAME_cas_sardinia_mod: "Das Königreich Sardinien"
 STATIC_MODIFIER_DESC_cas_sardinia_mod: "Die Kornkammer des Mittelmeers, Sardinien, unter spanischer Kontrolle."
 STATIC_MODIFIER_NAME_cas_italy_dominion_mod: "Herrschaft über Italien"
 STATIC_MODIFIER_DESC_cas_italy_dominion_mod: "Die Italienische Halbinsel fällt unter spanische Herrschaft – der Reichtum der Renaissance wird dem Reich hinzugefügt."
 STATIC_MODIFIER_NAME_cas_garrison_mod: "Das Festungsnetz"
 STATIC_MODIFIER_DESC_cas_garrison_mod: "Ein strategisches Festungsnetz bewacht die weiten Grenzen des spanischen Reiches."
 STATIC_MODIFIER_NAME_cas_cadiz_mod: "Der antike phönizische Hafen"
 STATIC_MODIFIER_DESC_cas_cadiz_mod: "Cádiz’ natürlicher Hafen wird zu einem bedeutenden Tor des atlantischen Handels."
 STATIC_MODIFIER_NAME_cas_malaga_mod: "Die Seide von Málaga"
 STATIC_MODIFIER_DESC_cas_malaga_mod: "Nach der Eroberung Granadas wird Málagas mildes Klima und fruchtbares Land als Seidenanbaugebiet erschlossen. Die Handwerker der Alhambra tragen Málagas Seidenindustrie, die im ganzen Mittelmeer zu hohen Preisen gehandelt wird."
 STATIC_MODIFIER_NAME_cas_valencia_mod: "Die Stadt der Sonne"
 STATIC_MODIFIER_DESC_cas_valencia_mod: "Valencias Seide und Mittelmeerhandel machen es zu Spaniens östlichem Wirtschaftszentrum."
 STATIC_MODIFIER_NAME_cas_zaragoza_mod: "Die aragonesische Hauptstadt"
 STATIC_MODIFIER_DESC_cas_zaragoza_mod: "Saragossa am Ebro belebt die iberischen Binnenhandelsnetze."
 STATIC_MODIFIER_NAME_cas_barcelona_mod: "Barcelona – Mittelmeerdrehscheibe"
 STATIC_MODIFIER_DESC_cas_barcelona_mod: "Barcelona als Spaniens größte Mittelmeerhandelsstadt."
 STATIC_MODIFIER_NAME_cas_reconquista_done_mod: "Reconquista vollendet"
 STATIC_MODIFIER_DESC_cas_reconquista_done_mod: "780 Jahre Heiliger Krieg sind vollendet – Spanien unter dem katholischen Glauben geeint. Der Begriff „Spanien“ ist gebildet."
 STATIC_MODIFIER_NAME_cas_hermandad_mod: "Die Heilige Bruderschaft"
 STATIC_MODIFIER_DESC_cas_hermandad_mod: "Die Bogenschützen der Hermandad ziehen über die Straßen, und selbst die Tore der Adelsburgen öffnen sich vor der Gerechtigkeit des Königs."
 STATIC_MODIFIER_NAME_cas_inquisition_mod: "Die Spanische Inquisition"
 STATIC_MODIFIER_DESC_cas_inquisition_mod: "Schwarz gekleidete Inquisitoren des Heiligen Offiziums ziehen von Stadt zu Stadt, und die Menschen legen mit gedämpfter Stimme Zeugnis ihres Glaubens ab."
 STATIC_MODIFIER_NAME_cas_pure_faith_mod: "Reinheit des Glaubens"
 STATIC_MODIFIER_DESC_cas_pure_faith_mod: "Die Vertreibung der Juden begründet Spaniens katholische Reinheit."
 STATIC_MODIFIER_NAME_cas_catholic_monarchs_mod: "Das Erbe der Katholischen Könige"
 STATIC_MODIFIER_DESC_cas_catholic_monarchs_mod: "Der vom Papst verliehene Titel „Katholische Könige“ begründet Spaniens Autorität."
 STATIC_MODIFIER_NAME_cas_absolutism_mod: "Absolutismus"
 STATIC_MODIFIER_DESC_cas_absolutism_mod: "Die königliche Macht wird absolut, und Spanien geht als moderner Zentralstaat hervor."
 STATIC_MODIFIER_NAME_cas_cortes_mod: "Die Cortes"
 STATIC_MODIFIER_DESC_cas_cortes_mod: "In der Kammer der Cortes von Kastilien sitzen der König und die Abgesandten der Städte an einem Tisch, während die Bedingungen der Regierung niedergelegt werden."
 STATIC_MODIFIER_NAME_cas_colonial_law_mod: "Die Gesetze der Indien"
 STATIC_MODIFIER_DESC_cas_colonial_law_mod: "Das koloniale Verwaltungsrecht ist kodifiziert und stabilisiert die Verwaltung der gewaltigen überseeischen Gebiete."
 STATIC_MODIFIER_NAME_cas_canary_mod: "Ein Stützpunkt auf den Kanaren"
 STATIC_MODIFIER_DESC_cas_canary_mod: "Ein Stützpunkt für die atlantische Ausdehnung ist begründet."
 STATIC_MODIFIER_NAME_cas_atlantic_mod: "Der Geist der atlantischen Erkundung"
 STATIC_MODIFIER_DESC_cas_atlantic_mod: "Der Drang, unbekannte Meere zu erkunden, macht Spaniens atlantische Vorherrschaft möglich."
 STATIC_MODIFIER_NAME_cas_caribbean_mod: "Herrschaft über die Karibik"
 STATIC_MODIFIER_DESC_cas_caribbean_mod: "Die Karibik wird zum „Binnenmeer“ des spanischen Reiches."
 STATIC_MODIFIER_NAME_cas_mexico_mod: "Das Vizekönigreich Neuspanien"
 STATIC_MODIFIER_DESC_cas_mexico_mod: "Die Eroberung des Aztekenreiches bringt das Vizekönigreich Neuspanien hervor."
 STATIC_MODIFIER_NAME_cas_peru_mod: "Das Vizekönigreich Peru"
 STATIC_MODIFIER_DESC_cas_peru_mod: "Die Eroberung des Inkareiches bringt das Vizekönigreich Peru hervor. Der Reichtum der Anden fließt nach Spanien."
 STATIC_MODIFIER_NAME_cas_potosi_mod: "Die Silberbergwerke von Potosí"
 STATIC_MODIFIER_DESC_cas_potosi_mod: "Das größte Silberbergwerk der Welt trägt die Finanzen des spanischen Reiches; Silber wird zu Spaniens Währung."
 STATIC_MODIFIER_NAME_cas_colonial_empire_mod: "Ein Kolonialreich"
 STATIC_MODIFIER_DESC_cas_colonial_empire_mod: "Ein globales spanisches Kolonialreich ist vollendet; der Traum der Konquistadoren wird Wirklichkeit."
 STATIC_MODIFIER_NAME_cas_manila_galleon_mod: "Der Handel der Manila-Galeone"
 STATIC_MODIFIER_DESC_cas_manila_galleon_mod: "Die den Pazifik überquerenden Manila-Galeonen begründen den ersten globalen Handelsweg, der Asien und Amerika verbindet."
 STATIC_MODIFIER_NAME_cas_naples_mod: "Das Königreich Neapel"
 STATIC_MODIFIER_DESC_cas_naples_mod: "Das Königreich Neapel kommt unter die spanische Krone und begründet Einfluss in Italien."
 STATIC_MODIFIER_NAME_cas_sicily_mod: "Das Königreich Sizilien"
 STATIC_MODIFIER_DESC_cas_sicily_mod: "Sizilien, Kornkammer des Mittelmeers, ist unter spanischer Herrschaft stabilisiert."
 STATIC_MODIFIER_NAME_cas_milan_mod: "Das Herzogtum Mailand"
 STATIC_MODIFIER_DESC_cas_milan_mod: "Als Ergebnis der Italienischen Kriege fällt Mailand in Spaniens Einflusssphäre."
 STATIC_MODIFIER_NAME_cas_mediterranean_mod: "Hegemon des Mittelmeers"
 STATIC_MODIFIER_DESC_cas_mediterranean_mod: "Spanien ergreift das Kommando über das Mittelmeer – zum ersten Mal seit dem antiken Rom wird das Meer von einer einzigen Macht beherrscht."
 STATIC_MODIFIER_NAME_cas_lepanto_mod: "Held von Lepanto"
 STATIC_MODIFIER_DESC_cas_lepanto_mod: "Die Schlacht von Lepanto zerschmettert die osmanische Marine und begründet die christliche Überlegenheit im Mittelmeer."
 STATIC_MODIFIER_NAME_cas_ceuta_mod: "Die Festung Ceuta"
 STATIC_MODIFIER_DESC_cas_ceuta_mod: "Ceuta, das Tor zur Straße von Gibraltar, ist gesichert – die Tür nach Afrika öffnet sich."
 STATIC_MODIFIER_NAME_cas_oran_mod: "Die Eroberung Orans"
 STATIC_MODIFIER_DESC_cas_oran_mod: "Die Reconquista dehnt sich nach Nordafrika aus – Oran wird zu Spaniens nordafrikanischem Bollwerk."
 STATIC_MODIFIER_NAME_cas_tunis_mod: "Die Unterwerfung von Tunis"
 STATIC_MODIFIER_DESC_cas_tunis_mod: "Mit der Eroberung von Tunis streitet Spanien dem Osmanischen Reich die Vorherrschaft in Nordafrika streitig."
 STATIC_MODIFIER_NAME_cas_north_africa_mod: "Herrschaft über Nordafrika"
 STATIC_MODIFIER_DESC_cas_north_africa_mod: "Die Mittelmeerküste Nordafrikas fällt unter spanische Herrschaft und stabilisiert den Mittelmeerhandel."
 STATIC_MODIFIER_NAME_cas_casa_contratacion_mod: "Die Casa de Contratación"
 STATIC_MODIFIER_DESC_cas_casa_contratacion_mod: "Sevillas Casa de Contratación monopolisiert den Handel mit der Neuen Welt – die größte Handelseinrichtung der Welt ist geboren."
 STATIC_MODIFIER_NAME_cas_tercio_mod: "Der Tercio"
 STATIC_MODIFIER_DESC_cas_tercio_mod: "Der Tercio, die beste Fußvolkformation der Welt, wird zum Fundament des spanischen Heeres."
 STATIC_MODIFIER_NAME_cas_military_orders_mod: "Die Militärorden"
 STATIC_MODIFIER_DESC_cas_military_orders_mod: "Die Militärorden von Santiago, Calatrava und Alcántara schließen sich dem spanischen Heer an."
 STATIC_MODIFIER_NAME_cas_armada_mod: "Die Unbesiegbare Armada"
 STATIC_MODIFIER_DESC_cas_armada_mod: "Mit 130 Schiffen verkörpert die „Unbesiegbare Armada“ den Höhepunkt der spanischen Seemacht."
 STATIC_MODIFIER_NAME_cas_conquistadors_mod: "Die Konquistadoren"
 STATIC_MODIFIER_DESC_cas_conquistadors_mod: "Die Legende von Cortés und Pizarro lebt fort – spanische Konquistadoren fegen über die Welt."
 STATIC_MODIFIER_NAME_cas_siglo_de_oro_mod: "Das Goldene Zeitalter"
 STATIC_MODIFIER_DESC_cas_siglo_de_oro_mod: "Das Zeitalter von Cervantes, Velázquez und El Greco – die spanische Kultur steht an der Spitze der Welt."
 STATIC_MODIFIER_NAME_cas_escorial_mod: "Der Escorial"
 STATIC_MODIFIER_DESC_cas_escorial_mod: "Philipps II. Palast, Kloster und Mausoleum verkörpert den Höhepunkt des spanischen Reiches."
 STATIC_MODIFIER_NAME_cas_segovia_mod: "Der Aquädukt von Segovia"
 STATIC_MODIFIER_DESC_cas_segovia_mod: "Der große Aquädukt aus römischer Zeit ist restauriert und verbessert und steigert Segovias städtische Wasserversorgung erheblich. Dieser Aquädukt wird zum Vorbild für die Wasserbauten in ganz Kastilien."
 STATIC_MODIFIER_NAME_cas_west_africa_mod: "Westafrikanischer Handel"
 STATIC_MODIFIER_DESC_cas_west_africa_mod: "Spanien tritt mit den Kanarischen Inseln als Stützpunkt in den westafrikanischen Handel ein."
 STATIC_MODIFIER_NAME_cas_trent_mod: "Das Konzil von Trient"
 STATIC_MODIFIER_DESC_cas_trent_mod: "Das von Spanien angeführte Konzil von Trient bekräftigt die katholische Lehre und legt die Richtlinien der Gegenreformation fest."
 STATIC_MODIFIER_NAME_cas_navarre_mod: "Navarra erobert"
 STATIC_MODIFIER_DESC_cas_navarre_mod: "Der Pyrenäenknotenpunkt Navarra ist gesichert – das nördliche Iberien ist beherrscht."
 STATIC_MODIFIER_NAME_cas_salamanca_mod: "Die Universität Salamanca"
 STATIC_MODIFIER_DESC_cas_salamanca_mod: "Eine der ältesten Universitäten Europas bringt Spaniens gelehrte Elite und seine Beamten hervor."
 STATIC_MODIFIER_NAME_cas_toledo_dev_mod: "Toledaner Stahl"
 STATIC_MODIFIER_DESC_cas_toledo_dev_mod: "Toledaner Stahl und Goldschmiedekunst blühen – die historische Hauptstadt ist voll entwickelt."
 STATIC_MODIFIER_NAME_cas_madrid_mod: "Madrid – kaiserliche Hauptstadt"
 STATIC_MODIFIER_DESC_cas_madrid_mod: "Philipps II. ständige Hauptstadt Madrid wird zum Herzen des Weltreiches."
 STATIC_MODIFIER_NAME_cas_burgos_mod: "Burgos – internationale Stadt des Pilgerwegs"
 STATIC_MODIFIER_DESC_cas_burgos_mod: "Burgos entwickelt sich als Kastiliens historische Hauptstadt und Wollhandelszentrum."
 STATIC_MODIFIER_NAME_cas_granada_city_mod: "Das Juwel Spaniens"
 STATIC_MODIFIER_DESC_cas_granada_city_mod: "Die Stadt der Alhambra wird zu Spaniens südlichem kulturellem und wirtschaftlichem Zentrum."
 STATIC_MODIFIER_NAME_cas_cordoba_mod: "Cordoban-Lederherstellung"
 STATIC_MODIFIER_DESC_cas_cordoba_mod: "Cordoban, das von den Handwerkern Córdobas gegerbte Ziegenleder, wird an den Höfen Europas geschätzt, und aus den Werkstätten der Stadt gehen unablässig Ladungen ab."
 STATIC_MODIFIER_NAME_cas_flanders_pacified_mod: "Flandern befriedet"
 STATIC_MODIFIER_DESC_cas_flanders_pacified_mod: "Der flämische Widerstand ist unterdrückt – diese blühende Region ist stabil in das Reich eingegliedert."
 STATIC_MODIFIER_NAME_cas_greatest_power_mod: "Die Grundlagen des Reiches, in dem die Sonne nie untergeht"
 STATIC_MODIFIER_DESC_cas_greatest_power_mod: "Da alle drei Säulen stehen, steht Spanien kurz vor der Vollendung des „Reiches, in dem die Sonne nie untergeht“."
 STATIC_MODIFIER_NAME_cas_empire_of_sun_final_mod: "Das Reich, in dem die Sonne nie untergeht"
 STATIC_MODIFIER_DESC_cas_empire_of_sun_final_mod: "Spanien ist als das erste globale Reich der Geschichte vollendet – der Name „das Reich, in dem die Sonne nie untergeht“ ist für immer in die Geschichte gemeißelt."
 STATIC_MODIFIER_NAME_cas_gold_fleet_mod: "Die Schatzflotten"
 STATIC_MODIFIER_DESC_cas_gold_fleet_mod: "Die jedes Jahr nach Spanien segelnden Schatzflotten verwandeln die europäische Wirtschaft."
 STATIC_MODIFIER_NAME_cas_portugal_mod: "Die Union mit Portugal"
 STATIC_MODIFIER_DESC_cas_portugal_mod: "Durch die Iberische Union schließt sich auch Portugals Kolonialreich Spanien an."
 STATIC_MODIFIER_NAME_cas_iberian_union_mod: "Die Iberische Union"
 STATIC_MODIFIER_DESC_cas_iberian_union_mod: "Die gesamte Iberische Halbinsel ist vereint und vollendet das Fundament des größten Reiches der Welt."
 STATIC_MODIFIER_NAME_cas_sevilla_mod: "Sevilla erblüht"
 STATIC_MODIFIER_DESC_cas_sevilla_mod: "Sevilla, das Tor des Handels mit der Neuen Welt, ist als größte Handelsstadt der Welt ausgebaut."
 STATIC_MODIFIER_NAME_cas_trade_network_mod: "Das imperiale Handelsnetz"
 STATIC_MODIFIER_DESC_cas_trade_network_mod: "Von Sevilla bis Manila umspannt Spaniens imperiales Handelsnetz den Globus."
 STATIC_MODIFIER_NAME_cas_valladolid_dev_mod: "Der Ausbau von Valladolid"
 STATIC_MODIFIER_DESC_cas_valladolid_dev_mod: "Valladolid, die königliche Burgstadt Kastiliens, ist als Sitz des Hofes ausgebaut, und ihre Märkte und Werkstätten gedeihen."
 STATIC_MODIFIER_NAME_cas_form_spain_mod: "Die Geburt des Königreichs Spanien"
 STATIC_MODIFIER_DESC_cas_form_spain_mod: "Die Schreiber des Hofes zu Madrid schreiben im Namen eines einzigen Königreichs Erlasse an jede Provinz nieder."
