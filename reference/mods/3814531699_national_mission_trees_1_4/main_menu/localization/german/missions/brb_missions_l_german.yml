l_german:
 brb_brabant_mission_pack: "Das Erbe Niederlothringens – die Niederlande einen und Burgund einverleiben"
 brb_brabant_mission_pack_DESCRIPTION:0 "Das Herzogtum Brabant, von einem unabhängigen Herzogshaus regiert – einige die Niederlande, verleibe dir das emporgekommene Herzogtum Burgund der Geschichte zuvorkommend ein und errichte ein wahres Goldenes Zeitalter."
 brb_brabant_mission_pack_CRITERIA_DESCRIPTION:0 "Einige die Niederlande, verleibe dir Burgund ein und gründe eine Republik, um ein Goldenes Zeitalter zu erreichen."
 brb_brabant_mission_pack_BUTTON_TOOLTIP:0 "Von einem kleinen Herzogtum zu einem Großherzogtum, das die Niederlande und Burgund beherrscht."
 brb_brabant_mission_pack_BUTTON_DETAILS:0 "„Je Maintiendrai“ – kehre die Geschichte um und pflanze das Banner Brabants über den Niederlanden auf!"
 brb_ducal_authority: "Herzogliche Autorität festigen"
 brb_ducal_authority_desc: "Als Herzog aus der Linie Löwen lass deine Autorität jeden Winkel des Herzogtums erreichen."
 brb_joyous_entry: "Die Blijde Inkomst (Joyeuse Entrée)"
 brb_joyous_entry_desc: "Die „Blijde Inkomst“ – die Zeremonie, in der ein neuer Herzog durch die Stadttore zieht und die Privilegien der Städte bestätigt – begründe diese Tradition und gewähre den Städten ihre eigenen Rechte."
 brb_joyous_entry_unlock_tt: "Das Stadtprivileg „Stadt der Blijde Inkomst“ wird verfügbar."
 brb_develop_antwerp: "Antwerpen entwickeln"
 brb_develop_antwerp_desc: "Antwerpen, die Handelsstadt an der Scheldemündung – entwickle sie weiter und festige ihren Rang als Drehscheibe des Nordseehandels."
 brb_unify_brabant: "Brabant einen"
 brb_unify_brabant_desc: "Das Herzogtum Brabant, zwischen Norden und Süden geteilt – vereine es unter einem Banner."
 brb_flemish_rivalry: "Rivalität mit Flandern"
 brb_flemish_rivalry_desc: "Die Grafschaft Flandern, bekannt für ihr reiches Tuchgewerbe – begründe unseren Einfluss auf diesen alten Rivalen."
 brb_hainaut_marriage: "Eine Heirat mit Hennegau-Holland"
 brb_hainaut_marriage_desc: "Hennegau, Holland und Seeland, vom Haus Wittelsbach regiert – sichere dir durch Heirat, Bündnis oder ebenso durch Rivalität einen Anspruch auf diesen Thron."
 brb_liege_relations: "Beziehungen zu Lüttich"
 brb_liege_relations_desc: "Das Fürstbistum Lüttich, das gewaltige weltliche Macht ausübt – sichere dir durch Rivalität oder ebenso durch Heiratsbande einen Anspruch auf dieses Land."
 brb_utrecht_bishopric: "Das Bistum Utrecht"
 brb_utrecht_bishopric_desc: "Das Bistum Utrecht, das gewaltige weltliche Macht ausübt – bringe es unter unseren Einfluss als Grundlage für die Einigung der Niederlande."
 brb_burgundian_ambition: "Ambitionen auf Burgund"
 brb_burgundian_ambition_desc: "Nachdem du die Kernlande der Niederlande beherrschst, richte den Blick des Ehrgeizes auf das neu aufgestiegene Herzogtum Burgund, das von einer Seitenlinie des französischen Königshauses gehalten wird."
 brb_contest_flanders_inheritance: "Das flandrische Erbe anfechten"
 brb_contest_flanders_inheritance_desc: "Die Vermählung Margaretes, der Erbin Flanderns – gewinne diese umkämpfte Partie und sichere dir Flandern selbst, bevor das Haus Burgund es kann."
 brb_absorb_burgundy: "Burgund einverleiben"
 brb_absorb_burgundy_desc: "Annektiere oder unterwirf das emporgekommene Herzogtum Burgund – kehre den Lauf der Geschichte um und beweise, dass Brabant, nicht Burgund, Herr der Niederlande ist."
 brb_valois_brabant: "Das Großherzogtum Brabant"
 brb_valois_brabant_desc: "Nachdem es das burgundische Erbe einverleibt hat, ist Brabant kein bloßes Herzogtum mehr – erhebe dich als die große Macht, die den Niederlanden vorsteht."
 brb_je_maintiendrai: "Je Maintiendrai"
 brb_je_maintiendrai_desc: "Brabant, Flandern, Holland und das einverleibte burgundische Erbe – als Herr der Kernlande der Niederlande bewahre diese Herrschaft."
 brb_hansa_relations: "Beziehungen zur Hanse"
 brb_hansa_relations_desc: "Die Hanse, die den Ostseehandel beherrscht – baue die Beziehungen zu ihr aus einer Position der Gleichrangigkeit neu auf."
 brb_bulk_trade: "Den Massengüterhandel fördern"
 brb_bulk_trade_desc: "Der Massengüterhandel mit Getreide und Holz – mehre die Präsenz unserer Handelsflotte in der Ostsee."
 brb_baltic_supremacy: "Vorherrschaft im Ostseehandel"
 brb_baltic_supremacy_desc: "Der Herr der nördlichen Handelswege ist eine wahre Handelsmacht – errichte die Vorherrschaft im Ostseehandel."
 brb_land_commercial_empire: "Ein Handelsreich zu Lande"
 brb_land_commercial_empire_desc: "Nicht das Meer allein – beherrsche die großen Binnenmarktzentren und beanspruche auch die Vorherrschaft im Überlandhandel."
 brb_secure_grain: "Baltisches Getreide sichern"
 brb_secure_grain_desc: "Die Niederlande haben sich lange auf baltisches Getreide verlassen – nimm diese Versorgung in unsere eigenen Hände."
 brb_reformation_choice: "Die Wahl der Reformation"
 brb_reformation_choice_desc: "Luthers Lehren erschüttern die Niederlande – an diesem Scheideweg des Glaubens, welchen Weg sollen wir wählen?"
 brb_religious_settlement: "Ein religiöser Ausgleich"
 brb_religious_settlement_desc: "Mehr als ein Jahrhundert nach der Reformation – nun, da der Staatsglaube über die weit überwiegende Mehrheit der Bevölkerung herrscht, bringe einen stabilen Ausgleich zwischen den widerstreitenden Bekenntnissen zustande."
 brb_spanish_fury: "Die Spanische Furie"
 brb_spanish_fury_desc: "Habsburgische Unterdrückung und drückende Steuern – die Wut des Volkes gegen die „Spanische Furie“ lässt sich nicht länger bändigen."
 brb_sea_beggars: "Die Wassergeusen"
 brb_sea_beggars_desc: "Freibeuter, die sich „Wassergeusen“ nennen – ihre Taten schlagen Löcher in Spaniens Herrschaft über die Meere."
 brb_eighty_years_war: "Der Achtzigjährige Krieg"
 brb_eighty_years_war_desc: "Ein langer Kampf um die Unabhängigkeit – überstehe diesen Achtzigjährigen Krieg und erringe unsere Freiheit."
 brb_united_netherlands: "Die Vereinigten Niederlande"
 brb_united_netherlands_desc: "Ein Bund von sieben Provinzen – errichte hier eine fürstliche Konföderation unter dem Großherzog von Brabant, die die Traditionen von Adel und Städten gleichermaßen fortführt."
 brb_east_india_charter: "Der Ostindien-Freibrief"
 brb_east_india_charter_desc: "Erteile den Freibrief zur Gründung einer Ostindien-Kompanie mit dem Ziel eines Monopols auf den Asienhandel."
 brb_voc_trade_empire: "Das Handelsreich der VOC"
 brb_voc_trade_empire_desc: "Die „Vereinigte Ostindische Kompanie“ (VOC) – die erste Aktiengesellschaft der Welt spannt ihr Handelsnetz von den Gewürzinseln über ganz Asien."
 brb_west_india_company: "Die Westindien-Kompanie"
 brb_west_india_company_desc: "Handel, der die Neue Welt und Afrika verbindet – gründe die Westindien-Kompanie und habe teil am Reichtum des Atlantiks."
 brb_golden_age: "Das Goldene Zeitalter"
 brb_golden_age_desc: "Rembrandt, Vermeer und blühender Handel – erreiche den Gipfel des „Niederländischen Goldenen Zeitalters“."
 brb_amsterdam_exchange: "Die Amsterdamer Börse"
 brb_amsterdam_exchange_desc: "Die erste Börse der Welt – mache Amsterdam zum Mittelpunkt der europäischen Finanzwelt."
 brb_form_netherlands: "Das Großherzogtum der Niederlande vollendet"
 brb_form_netherlands_desc: "Der lange Weg, der mit dem Erbe Niederlothringens und der Einverleibung Burgunds begann, findet über Unabhängigkeit und ein Goldenes Zeitalter hinweg hier seine Vollendung als Großherzogtum, das die tiefen Traditionen von Adel und Städten bewahrt."
 brb_wool_staple_calais: "Der Wollstapel von Calais"
 brb_wool_staple_calais_desc: "Englische Wolle, der Lebensnerv des flämischen Tuchgewerbes – belebe den Handel durch den Wollstapel von Calais."
 brb_anglo_dutch_alliance: "Das englisch-niederländische Bündnis"
 brb_anglo_dutch_alliance_desc: "England, unser Nachbar jenseits des Kanals – festige inmitten des Chaos des Hundertjährigen Krieges ein festes Verhältnis zu dieser Nation, sei es durch Bündnis oder durch Rivalität."
 brb_english_channel_trade: "Beherrschung des Kanalhandels"
 brb_english_channel_trade_desc: "Der Kanal, der Nordsee und Atlantik verbindet – errichte die Vorherrschaft im Handel über diese lebenswichtige Meerenge."
 brb_valois_suzerainty_dispute: "Die Lehnshoheit der Valois anfechten"
 brb_valois_suzerainty_dispute_desc: "Dem Namen nach ein Vasall der französischen Krone – fechte diese Lehnshoheit an und verlange eine Stellung der Gleichrangigkeit."
 brb_hundred_years_war_intervention: "Eingreifen in den Hundertjährigen Krieg"
 brb_hundred_years_war_intervention_desc: "Der lange Krieg, der England und Frankreich zerreißt – nutze diese Gelegenheit, zum eigenen Vorteil einzugreifen."
 brb_somme_towns: "Die Städte an der Somme"
 brb_somme_towns_desc: "Die reichen Städte der Picardie – bringe die Lande entlang der Somme in unseren Herrschaftsbereich."
 brb_end_french_vassalage: "Das französische Vasallentum beenden"
 brb_end_french_vassalage_desc: "Durchtrenne dieses nominelle Vasallentum vollständig und begründe unseren Rang als wahrhaft unabhängiges Großherzogtum."
 brb_events.1.t: "Der Achtzigjährige Krieg beginnt"
 brb_events.1.d: "Durch die Utrechter Union und die Taten der Wassergeusen hat der lange Krieg mit Spanien begonnen. Dieser Kampf wird über unsere Unabhängigkeit entscheiden."
 brb_events.1.a: "Freiheit oder Tod!"
 brb_events.2.t: "Ambitionen auf Burgund"
 brb_events.2.d: "Das emporgekommene Herzogtum Burgund – welchen Weg sollen wir hinsichtlich seines Schicksals wählen?"
 brb_events.2.a: "Gold zahlen und es als Vasallen willkommen heißen"
 brb_events.2.b: "Einen Anspruch auf Dijon erheben und uns darauf vorbereiten, es mit Gewalt zu nehmen"
 brb_events.2.c: "Vorerst beobachten und abwarten"
 brb_events.3.t: "Das flandrische Erbe anfechten"
 brb_events.3.d: "Der Erbstreit um Margarete, die Erbin Flanderns – wie sichern wir uns dieses reiche Land?"
 brb_events.3.a: "Gold zahlen und es als Vasallen willkommen heißen"
 brb_events.3.b: "Einen Anspruch auf Brügge erheben und uns darauf vorbereiten, es mit Gewalt zu nehmen"
 brb_events.3.c: "Vorerst beobachten und abwarten"
 brb_events.99.t: "Ausrufung des Großherzogtums der Niederlande"
 brb_events.99.d: "Das kleine Herzogtum, das Niederlothringen erbte und Burgund einverleibte, ist über Unabhängigkeit und ein Goldenes Zeitalter hinweg als Großherzogtum unter dem Haus Brabant wiedergeboren und bewahrt die tiefen Traditionen von Adel und Städten."
 brb_events.99.a: "Ruhm dem Großherzogtum!"
 STATIC_MODIFIER_NAME_brb_ducal_mod: "Herzogliche Autorität gefestigt"
 STATIC_MODIFIER_DESC_brb_ducal_mod: "Das über Löwen wehende herzogliche Banner verkündet in jeder Burgstadt des Herzogtums dieselbe Autorität."
 STATIC_MODIFIER_NAME_brb_antwerp_mod: "Antwerpen gesichert"
 STATIC_MODIFIER_DESC_brb_antwerp_mod: "Die Handelsstadt Antwerpen blüht."
 STATIC_MODIFIER_NAME_brb_unify_brabant_mod: "Brabant geeint"
 STATIC_MODIFIER_DESC_brb_unify_brabant_mod: "Die einst zwischen Norden und Süden geteilten Gutsherren beugen nun vor demselben herzoglichen Hof das Knie."
 STATIC_MODIFIER_NAME_brb_flemish_mod: "Rivalität mit Flandern"
 STATIC_MODIFIER_DESC_brb_flemish_mod: "Selbst die Weber von Gent und Brügge treiben ihre Geschäfte nun mit Blick auf die Wünsche des Herzogs von Brabant."
 STATIC_MODIFIER_NAME_brb_utrecht_mod: "Das Bistum Utrecht"
 STATIC_MODIFIER_DESC_brb_utrecht_mod: "Die Glocken der Utrechter Kathedrale läuten nun mit Gebeten, die die Herrschaft des Herzogs von Brabant segnen."
 STATIC_MODIFIER_NAME_brb_absorb_burgundy_mod: "Burgund einverleibt"
 STATIC_MODIFIER_DESC_brb_absorb_burgundy_mod: "Die Schlüssel zur Schatzkammer von Dijon hängen nun im Hof zu Brüssel."
 STATIC_MODIFIER_NAME_brb_maintiendrai_mod: "Je Maintiendrai"
 STATIC_MODIFIER_DESC_brb_maintiendrai_mod: "„Ich werde bewahren“ – Herren und Bürger der Niederlande versammeln sich unter diesem Wahlspruch an einem Hof."
 STATIC_MODIFIER_NAME_brb_hansa_mod: "Beziehungen zur Hanse"
 STATIC_MODIFIER_DESC_brb_hansa_mod: "Hansekaufleute aus Lübeck nehmen nun in den Kontoren Antwerpens gleichberechtigt Platz."
 STATIC_MODIFIER_NAME_brb_bulk_trade_mod: "Massengüterhandel gefördert"
 STATIC_MODIFIER_DESC_brb_bulk_trade_mod: "Schiffe, hochbeladen mit Getreide und Holz, bescheren den Werften an der Scheldemündung unablässig neue Aufträge."
 STATIC_MODIFIER_NAME_brb_baltic_supremacy_mod: "Vorherrschaft im Ostseehandel"
 STATIC_MODIFIER_DESC_brb_baltic_supremacy_mod: "Über die Ostsee hinweg tragen die Segel unzähliger Handelsschiffe das Löwenbanner Brabants."
 STATIC_MODIFIER_NAME_brb_land_commercial_empire_mod: "Ein Handelsreich zu Lande"
 STATIC_MODIFIER_DESC_brb_land_commercial_empire_mod: "Wagen aus Köln und Paris stehen in langen Reihen auf den Märkten von Brüssel und Löwen."
 STATIC_MODIFIER_NAME_brb_grain_mod: "Baltisches Getreide gesichert"
 STATIC_MODIFIER_DESC_brb_grain_mod: "Da baltisches Getreide die Speicher unablässig füllt, folgen die Soldaten dem Ruf zu den Waffen ohne Furcht vor dem Hunger."
 STATIC_MODIFIER_NAME_brb_reformation_mod: "Die Wahl der Reformation"
 STATIC_MODIFIER_DESC_brb_reformation_mod: "Unter den Kanzeln und in den Winkeln des Marktes sprechen die Leute mit gesenkter Stimme vom neuen Glauben."
 STATIC_MODIFIER_NAME_brb_settlement_mod: "Ein religiöser Ausgleich"
 STATIC_MODIFIER_DESC_brb_settlement_mod: "Nachbarn, die einst um den Glauben stritten, stehen nun Schulter an Schulter an denselben Marktständen."
 STATIC_MODIFIER_NAME_brb_spanish_fury_mod: "Die Spanische Furie"
 STATIC_MODIFIER_DESC_brb_spanish_fury_mod: "Der Zorn derer, die die Asche Antwerpens sahen, verleiht den Händen, die das Schwert packen, noch immer Kraft."
 STATIC_MODIFIER_NAME_brb_sea_beggars_mod: "Die Wassergeusen"
 STATIC_MODIFIER_DESC_brb_sea_beggars_mod: "„Lieber Bettler als des Königs Männer“ – die Flagge der Wassergeusen ist zum Albtraum im Schlaf spanischer Seeleute geworden."
 STATIC_MODIFIER_NAME_brb_united_netherlands_mod: "Die Vereinigten Niederlande"
 STATIC_MODIFIER_DESC_brb_united_netherlands_mod: "Die Banner von sieben Provinzen stehen Seite an Seite in einem Versammlungssaal, und ein neuer Staat tut als fürstliche Konföderation seinen ersten Atemzug."
 STATIC_MODIFIER_NAME_brb_east_india_mod: "Der Ostindien-Freibrief"
 STATIC_MODIFIER_DESC_brb_east_india_mod: "Noch ehe das Wachssiegel auf dem Freibrief getrocknet war, stachen die Flotten gen Osten in See."
 STATIC_MODIFIER_NAME_brb_voc_mod: "Das Handelsreich der VOC"
 STATIC_MODIFIER_DESC_brb_voc_mod: "Pfeffer und Nelken, die aus den Handelsniederlassungen Batavias eintreffen, binden selbst ferne Kolonialgouverneure an die Heimat."
 STATIC_MODIFIER_NAME_brb_wic_mod: "Die Westindien-Kompanie"
 STATIC_MODIFIER_DESC_brb_wic_mod: "Gerüchte von Zucker und Silber jenseits des Atlantiks treiben Auswanderer, die von einer Neuen Welt träumen, zu den Häfen."
 STATIC_MODIFIER_NAME_brb_golden_age_mod: "Das Goldene Zeitalter"
 STATIC_MODIFIER_DESC_brb_golden_age_mod: "In den Grachtenpalästen der großen Kaufleute hängen Gemälde lichtdurchfluteter Stuben im Licht Vermeers."
 STATIC_MODIFIER_NAME_brb_amsterdam_mod: "Die Amsterdamer Börse"
 STATIC_MODIFIER_DESC_brb_amsterdam_mod: "Amsterdam, der Mittelpunkt des Finanzwesens, blüht."
 STATIC_MODIFIER_NAME_brb_wool_staple_mod: "Der Wollstapel von Calais"
 STATIC_MODIFIER_DESC_brb_wool_staple_mod: "Am Wollstapel von Calais türmen sich Ballen englischer Wolle, die für die Weber Flanderns bestimmt sind."
 STATIC_MODIFIER_NAME_brb_anglo_treaty_mod: "Das englisch-niederländische Bündnis"
 STATIC_MODIFIER_DESC_brb_anglo_treaty_mod: "Gesandte mit Bündniszusagen ziehen immer wieder zwischen den Höfen an beiden Ufern des Kanals hin und her."
 STATIC_MODIFIER_NAME_brb_channel_trade_mod: "Beherrschung des Kanalhandels"
 STATIC_MODIFIER_DESC_brb_channel_trade_mod: "In der engen Meerenge von der Nordsee zum Atlantik wehen nun in Reihen die Handelsflaggen Brabants."
 STATIC_MODIFIER_NAME_brb_suzerainty_dispute_mod: "Die Lehnshoheit der Valois angefochten"
 STATIC_MODIFIER_DESC_brb_suzerainty_dispute_mod: "Die Tore Brüssels wiesen die aus Paris entsandten Herolde, die ihren Vasallen einberufen sollten, ungeniert ab."
 STATIC_MODIFIER_NAME_brb_intervention_mod: "Eingreifen in den Hundertjährigen Krieg"
 STATIC_MODIFIER_DESC_brb_intervention_mod: "Soldaten, die im Morast des Hundertjährigen Krieges kämpften, kehrten heim und kannten nun die Kriegsweise Frankreichs wie Englands."
 STATIC_MODIFIER_NAME_brb_somme_mod: "Die Städte an der Somme"
 STATIC_MODIFIER_DESC_brb_somme_mod: "Mit den Mauern entlang der Somme hat das herzogliche Heer auf den Ebenen Nordfrankreichs festen Fuß gefasst."
 STATIC_MODIFIER_NAME_brb_end_vassalage_mod: "Ende des französischen Vasallentums"
 STATIC_MODIFIER_DESC_brb_end_vassalage_mod: "Über den Toren, von denen die Wappen des französischen Königs abgenommen wurden, weht nun allein das Banner des Herzogs von Brabant."
 STATIC_MODIFIER_NAME_brb_form_netherlands_mod: "Das Großherzogtum der Niederlande vollendet"
 STATIC_MODIFIER_DESC_brb_form_netherlands_mod: "Im Hof des Großherzogtums, wo Adelsbanner und Stadtfahnen Seite an Seite wehen, feiern Herren und Bürger der Niederlande gleichermaßen den Anbruch einer neuen Zeit."
