l_german:
 pol_jagiellonian_dynasty_mission_pack: "Der Glanz der Jagiellonen-Dynastie"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION:0 "Im Jahr 1337 wird das Königreich Polen von Kasimir III. dem Großen regiert. Sein Erbe wird Ludwig I. von Ungarn (aus dem Haus Anjou) sein, und Ludwigs Tochter Hedwig wird den litauischen Großfürsten Jogaila heiraten und die polnisch-litauische Personalunion schaffen. Konflikt mit dem Deutschen Orden im Norden, Union mit Ungarn im Süden, Ausdehnung nach Osten über Litauen und Ambitionen auf Böhmen – erfülle all dies und errichte die größte Adelsrepublik Mittelosteuropas."
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION:0 "Dehne dich als Polen in alle Richtungen aus – innere Reform, Osten, Norden, Süden und Westen – und verwirkliche das polnische Goldene Zeitalter."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das polnische Goldene Zeitalter zu verwirklichen."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS:0 "Von Kasimir dem Großen zum Goldenen Zeitalter der Jagiellonen – errichte die Adelsrepublik!"
 pol_kingdom_of_poland: "Das Königreich Polen"
 pol_kingdom_of_poland_desc: "Kasimir III. – „der Große“ – bestieg 1333 den Thron und einte das zersplitterte Polen. „Er empfing ein Polen aus Holz und hinterließ eines aus Stein“, wie spätere Generationen sagten. Er förderte Rechtsreform, Städtebau und den Schutz der Juden, und seine Herrschaft gilt als Höhepunkt mittelalterlichen polnischen Wohlstands. Erhöhe Legitimität und Stabilität und festige die Grundlagen des Reiches."
 pol_integrate_mazovia: "Masowien eingliedern"
 pol_integrate_mazovia_desc: "Das Herzogtum Masowien wird von einer Nebenlinie der Piasten-Dynastie regiert, gelegen im fruchtbaren Tiefland im Herzen Polens. Die Sicherung Warschaus und Lublins und die vollständige Eingliederung dieser reichen Ebene in das Königreich Polen begründet das politische Zentrum Zentralpolens. Ergreife früh, was die Geschichte erst 1526 gewähren wird."
 pol_great_sejm: "Der Große Sejm"
 pol_great_sejm_desc: "Der polnische Sejm – das Parlament – hat sich seit dem 13. Jahrhundert entwickelt. Diese Ständeversammlung aus Magnaten, Szlachta (Adel) und Klerus begründete im 15. und 16. Jahrhundert den Begriff der „Goldenen Freiheit“ (Złota Wolność) und wandelte Polen allmählich in eine Adelsrepublik. Stärke den Sejm und wahre das Gleichgewicht zwischen königlicher Macht und Adelsrechten."
 pol_krakow_renaissance: "Die Renaissance Krakaus"
 pol_krakow_renaissance_desc: "Krakau ist die Hauptstadt des Königreichs Polen, und die Jagiellonen-Universität – Alma Mater des Kopernikus – ist die beste Akademie Mittelosteuropas. Die italienische Renaissance erreicht Krakau, und der Wawel wird im Renaissancestil umgebaut. Entwickle die Universität und pflege Krakau als geistiges Zentrum Mittelosteuropas."
 pol_jagiellonian_university: "Die Blüte der Jagiellonen-Universität"
 pol_jagiellonian_university_desc: "Die 1364 von Kasimir III. gegründete und 1400 von Königin Hedwig wiederbelebte Jagiellonen-Universität brachte Nikolaus Kopernikus (1473–1543) und viele andere große Geister hervor. Die Erweiterung der Universitäten in ganz Polen verbreitet das Licht der Gelehrsamkeit im gesamten Reich."
 pol_polish_golden_age: "Das polnische Goldene Zeitalter"
 pol_polish_golden_age_desc: "Unter der Jagiellonen-Dynastie erlebte Polen im 15. und 16. Jahrhundert ein „Goldenes Zeitalter“ (Złoty Wiek). Kopernikus’ Heliozentrismus, Kochanowskis Dichtung, Krakaus Kunst – Polen war nicht nur eine Großmacht, sondern eine kulturelle Vorhut. Beweise dieses goldene Zeitalter durch weites Gebiet, reiches Einkommen und hohes Ansehen."
 pol_jadwiga_union: "Die Vermählung von Hedwig und Jogaila"
 pol_jadwiga_union_desc: "Die Union von Krewo 1385 vereinbarte die Heirat der polnischen Königin Hedwig mit dem litauischen Großfürsten Jogaila (Władysław II. Jagiełło). Jogaila trat zum Christentum über und beanspruchte den Titel König von Polen im Austausch für die Katholisierung Litauens. Diese Heirat war der Beginn des polnisch-litauischen Unionsstaates – und die Morgenröte der Jagiellonen-Dynastie, die über zwei Jahrhunderte dauern sollte."
 pol_develop_ruthenia: "Ruthenien entwickeln"
 pol_control_kyiv: "Beherrschung Kiews"
 pol_control_kyiv_desc: "Kiew war die Hauptstadt der Kiewer Rus, der Geburtsstätte slawischer Zivilisation. Nach der mongolischen Zerstörung von 1240 fiel die Stadt unter litauische Herrschaft. Die Einnahme Kiews begründet die Kontrolle über das gesamte Dnjepr-Becken und öffnet den Weg zum Schwarzen Meer."
 pol_push_east: "Vorstoß nach Osten"
 pol_push_east_desc: "Minsk ist das Herz Litauens; Smolensk ist ein wichtiger Knoten der ostslawischen Welt. Mit dem Aufstieg des Großfürstentums Moskau würde die Sicherung dieser Städte die polnisch-litauische Union zur beherrschenden Macht der ostslawischen Welt machen. Der historische Streit um Smolensk, den Iwan III. führte – diesmal entfaltet er sich zu Polens Gunsten."
 pol_eastern_empire: "Östliches Reich"
 pol_eastern_empire_desc: "Die Polnisch-Litauische Adelsrepublik wurde auf ihrem Höhepunkt (um 1618) zum größten Staat Europas. Von der Ostsee bis zur pontischen Steppe (Schwarzes Meer) vereinte sich die gesamte ostslawische Welt unter polnischer Flagge. Errichte das große östliche Reich, das Russland, die Osmanen und die Habsburger gleichermaßen fürchten."
 pol_prussian_confederation: "Der Preußische Bund und der Deutsche Orden"
 pol_prussian_confederation_desc: "Der Deutsche Orden, der im 13. Jahrhundert die baltischen Heiden eroberte, ist zu Polens Erbfeind geworden. Bei Tannenberg 1410 zerschlug das polnisch-litauische Heer ihn völlig. Mit der Unterstützung des Preußischen Bundes – preußische Städter, die polnischen Schutz suchten – besiege den Deutschen Orden und sichere Polens Zugang zur Ostsee."
 pol_gdansk_port: "Der Hafen Danzig"
 pol_gdansk_port_desc: "Danzig (Gdańsk) wird „das Tor Polens“ genannt – der wichtigste Hafen der Ostsee. An der Weichselmündung gelegen, war diese Stadt die führende Drehscheibe der Hanse und der Schlüssel zu polnischen Getreideexporten. Von Polen im Frieden von Thorn (1466) gesichert, diente Danzig zwei Jahrhunderte lang als Herz der polnischen Wirtschaft."
 pol_livonian_expansion: "Ausdehnung nach Livland"
 pol_livonian_expansion_desc: "Livland (das heutige Lettland und Estland), einst vom Livländischen Orden beherrscht, wurde im 16. Jahrhundert zum Schauplatz des Streits zwischen Russland, Schweden, Dänemark und Polen. Die Einnahme Rigas und Revals (Tallinn) bringt die gesamte Ostsee unter polnische Kontrolle."
 pol_master_of_the_north: "Herr des Nordens"
 pol_master_of_the_north_desc: "Königsberg (heute Kaliningrad), einst Bollwerk des Deutschen Ordens, trägt nun das polnische Banner. Mit einer mächtigen Flotte, die die gesamte Ostsee beherrscht, hält Polen Skandinavien, die Hanse und die Niederländer in der Hand – der höchste Herr des Nordens."
 pol_hungarian_union: "Personalunion mit Ungarn"
 pol_hungarian_union_desc: "Als Kasimir III. 1370 ohne Erben starb, erbte sein Neffe Ludwig I. von Ungarn (aus dem Haus Anjou) den polnischen Thron. Dies war der Beginn der polnisch-ungarischen Personalunion. Zwei große Königreiche unter einem König vereint – das Kräftegleichgewicht in Mittelosteuropa ändert sich grundlegend."
 pol_moldavia_vassal: "Die Moldau unterwerfen"
 pol_moldavia_vassal_desc: "Das Fürstentum Moldau (Moldova) ist ein von Polen, Ungarn und den Osmanen umkämpfter Pufferstaat. Stephan der Große (reg. 1457–1504) bewahrte die nominelle polnische Oberhoheit, während er die faktische Unabhängigkeit erhielt. Bringe dieses strategische Fürstentum fest unter polnischen Schutz und ergreife das Tor zum Schwarzen Meer."
 pol_wallachia_control: "Beherrschung der Walachei"
 pol_wallachia_control_desc: "Die Walachei, das Fürstentum nördlich der Donau, ist die Frontlinie gegen das Osmanische Reich. Vlad II. (Vater Vlads des Pfählers) diente Ungarn als Mitglied des Drachenordens. Die Walachei unter den Schutz der polnisch-ungarischen Union zu bringen, begründet Einfluss auf die Balkanhalbinsel."
 pol_battle_of_grunwald: "Der Geist von Tannenberg"
 pol_battle_of_grunwald_desc: "Am 15. Juli 1410 zerschmetterte das polnisch-litauische Heer auf den Feldern von Tannenberg (Grunwald) den Deutschen Orden völlig. Hochmeister Ulrich von Jungingen fiel auf dem Feld, und Polen festigte seinen Ruf als „Beschützer der Christenheit“. Beweise diesen Geist nun erneut im Krieg gegen die Kräfte des Islam."
 pol_shield_of_christendom: "Schild der Christenheit"
 pol_shield_of_christendom_desc: "Seit Hedwigs Christianisierungspolitik steht Polen an der Frontlinie des osteuropäischen Katholizismus. Nach der endgültigen Vertreibung des Osmanischen Reiches erkennen Papst, Venedig und die Habsburger allesamt an, dass Polen die wahre Antemurale Christianitatis – das Bollwerk der Christenheit – ist."
 pol_silesia_integration: "Eingliederung Schlesiens"
 pol_silesia_integration_desc: "Schlesien (Śląsk) ist die Geburtsstätte der Piasten-Dynastie, geriet aber im 14. Jahrhundert unter böhmische und habsburgische Kontrolle. Die Rückgewinnung dieser reichen Industrie- und Handelsregion um Breslau (Wrocław) ist eines der wichtigsten nationalen und wirtschaftlichen Gebote Polens."
 pol_bohemian_claim: "Die böhmische Krone"
 pol_bohemian_claim_desc: "Die Jagiellonen-Dynastie hält Erbrechte auf die böhmischen und ungarischen Throne. Vladislav II. (Jagiellone) wurde 1471 König von Böhmen, dann 1490 auch König von Ungarn. Die Einnahme der böhmischen Krone in Prag schafft die polnisch-böhmisch-ungarische Dreifachmonarchie."
 pol_hre_influence: "Einfluss auf das Heilige Römische Reich"
 pol_hre_influence_desc: "Der König von Polen, der auch die böhmische Krone hält, kann Kurfürst des Heiligen Römischen Reiches werden. Durch das Gleichgewicht der Diplomatie mit den Habsburgern und die Ausweitung des Einflusses auf deutsche Fürsten wird Polen zum politischen Zentrum Mitteleuropas."
 pol_central_european_power: "Mitteleuropäische Großmacht"
 pol_central_european_power_desc: "Ein weites Reich, das Polen, Litauen, Böhmen und Ungarn umfasst, mit reichem Einkommen – Polen ist zur größten Macht Mittelosteuropas hervorgetreten. Umgeben von den drei Großmächten Heiliges Römisches Reich, Osmanisches Reich und Großfürstentum Moskau, erstrahlt Polen mit eigenem Glanz."
 pol_grand_commonwealth: "Die Große Adelsrepublik"
 pol_grand_commonwealth_desc: "Die Adelsrepublik, die Polen, Litauen, Böhmen und Ungarn vereint – dieser Staat mit seinem einzigartigen politischen System, das Adelsfreiheit und königliche Autorität in Einklang bringt, war im 16. und 17. Jahrhundert als „Republik vieler Völker“ (Rzeczpospolita) bekannt. Dieses bemerkenswerte politische Experiment, das mehrere Völker, Glaubensrichtungen und Sprachen umfasst, hat seinen Gipfel erreicht."
 pol_events.10.t: "Die Vermählung von Hedwig und Jogaila"
 pol_events.10.d: "Die Union von Krewo hat Früchte getragen: Die polnische Königin Hedwig und der litauische Großfürst Jogaila haben sich vermählt. Jogaila empfing die christliche Taufe und nahm als König von Polen den Namen „Władysław II.“ an. Litauen tritt mit Polen in Personalunion, und die größte politische Einigung Osteuropas hat begonnen. Diese Heirat ist mehr als politisches Kalkül – sie ist der historische Augenblick, da zwei Völker, zwei Kulturen, zwei Sprachen sich unter einer Dynastie vereinen. „Polen und Litauen sind für immer eins“, verkündete die Union von Krewo."
 pol_events.10.a: "Es lebe die neue Jagiellonen-Dynastie!"
 pol_events.20.t: "Die polnisch-ungarische Personalunion"
 pol_events.20.d: "Polen und Ungarn haben eine Personalunion gebildet. Zwei große Königreiche unter einem König vereint – dies ist der diplomatische Triumph des Hauses Anjou und ein Ereignis, das die Geschichte Mittelosteuropas neu gestaltet. Polnische und ungarische Ritter stehen nun Schulter an Schulter. Von der Ostsee im Norden bis zur Adria im Süden nimmt ein gewaltiges Reich unter einer Dynastie Gestalt an. Für das Osmanische Reich ist diese Union die größte Bedrohung, der es sich gegenübersieht."
 pol_events.20.a: "Polen und Ungarn sind eins!"
 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "Erbe der Piasten-Dynastie"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "Das tausendjährige Erbe der Piasten-Dynastie – Polens erstem Königshaus – untermauert die Legitimität der polnischen Krone."
 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "Eingliederung Masowiens"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "Masowien um Warschau ist vollständig in Polen eingegliedert. Diese fruchtbare Tiefebene wirkt als Herz des Königreichs."
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "Der Große Sejm errichtet"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "Polens Sejm ist als Einrichtung der Goldenen Freiheit errichtet. Ein einzigartiges politisches System, das Adelsautonomie und Königsmacht in Einklang bringt, entsteht."
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "Krakaus kulturelle Blüte"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "Krakau, um den Wawel gelegen, badet im Licht der Renaissance. Als größte akademische Stadt Mittelosteuropas versammeln sich hier Gelehrte und Künstler aus ganz Europa."
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "Die Jagiellonen-Universität blüht"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "Die Jagiellonen-Universität – Alma Mater des Kopernikus – gedeiht als beste Akademie Mittelosteuropas. Wissen und Kunst verbreiten sich in ganz Polen."
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "Polnisches Goldenes Zeitalter"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "Kopernikus’ Heliozentrismus, Kochanowskis Dichtung, Krakaus Baukunst – in jeder Hinsicht genießt Polen sein goldenes Zeitalter."
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "Band der Union von Hedwig und Jogaila"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "Die polnisch-litauische Personalunion ist begründet. Ein gewaltiger Staat, der sich von der Ostsee bis zum Schwarzen Meer erstreckt, nimmt Gestalt an."
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "Stärke des polnisch-ungarischen Bündnisses"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "Die Banner der königlichen Heere, versammelt von den Ufern der Weichsel und der Donau, stehen Seite an Seite auf den Hügeln über der osmanischen Grenze."
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "Entwicklung Rutheniens"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "Die Ackerlande Rotrutheniens sind vollständig entwickelt. Der Schwarzmeerhandelsweg über Lemberg ist belebt."
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "Das Tor Kiews"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "Kiew, Geburtsstätte slawischer Zivilisation, ist unter polnische Kontrolle gekommen. Einfluss auf das gesamte Dnjepr-Becken ist begründet."
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "Vorstoß nach Osten"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "Mit gesichertem Minsk und Smolensk fällt die gesamte ostslawische Welt in Polens Einflusssphäre."
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "Östliches Reich"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "Das polnische Reich, das sich von der Ostsee bis zum Schwarzen Meer erstreckt, ist vollendet. In die Geschichte als der größte Staat Osteuropas eingeschrieben."
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "Sieg über den Deutschen Orden"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "Der Geist von Tannenberg beflügelt das polnische Heer. Die Erinnerung an den Sieg über die Kreuzritter der Christenheit wird zum Stolz des Militärs."
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "Handelsstadt Danzig"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "Danzig hat sich zum größten Getreideausfuhrhafen der Ostsee entwickelt. Polnisches Getreide, das über die Weichsel fließt, ernährt ganz Europa."
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "Ruhm von Tannenberg"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "Der Geist von Tannenberg beflügelt das polnische Heer. Im Kampf gegen die Ungläubigen erringt Polen immer größeren Ruhm."
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "Schild der Christenheit"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "Polen ist als Antemurale Christianitatis – das Bollwerk der Christenheit – in die Geschichte eingeschrieben."
 STATIC_MODIFIER_NAME_pol_silesia_mod: "Eingliederung Schlesiens"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "Das Adlerbanner ist zu den Burgen Schlesiens, der Heimat der Piasten, zurückgekehrt, und der Rauch seiner Bergwerke und Werkstätten steigt wieder in polnische Himmel auf."
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "Böhmische Krone"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "Die Jagiellonen-Dynastie hat die böhmische Krone ergriffen. Prags böhmischer Königshof wird zur Bühne polnischer Diplomatie."
 STATIC_MODIFIER_NAME_pol_central_power_mod: "Mitteleuropäische Großmacht"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "Polen ist zur größten Macht Mittelosteuropas hervorgetreten. Selbst unter den drei Großmächten erstrahlt es mit eigenem Glanz."
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "Die Große Adelsrepublik"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "Die Rzeczpospolita ist vollendet – Europas größtes politisches Experiment, das mehrere Völker, Glaubensrichtungen und Sprachen umfasst."
 pol_support_merchants: "Unterstützung des Kaufmannsstandes"
 pol_support_merchants_desc: "Polens städtische Bürger sind eine wichtige Säule der königlichen Finanzen. Durch die Unterstützung des Handelsnetzes um die Tuchhallen (Sukiennice) in Krakau verbessern sich sowohl die Loyalität der Bürger als auch die Steuereinnahmen. Zufriedene den Kaufmannsstand und lege die Grundlagen Polens als Handelsnation."
 pol_black_sea_access: "Zugang zum Schwarzen Meer"
 pol_black_sea_access_desc: "Indem man den Dnjepr hinabfährt, kann Polen das Schwarze Meer erreichen. Die Kontrolle der Halbinsel Krim und der Nordküste des Pontus Euxinus (Schwarzes Meer) bedeutet, einen Handelsweg zum Osten zu sichern, der das osmanisch beherrschte Konstantinopel umgeht. Baue eine Schwarzmeerflotte auf und weite die Seeherrschaft aus."
 pol_breadbasket_of_europe: "Kornkammer Europas"
 pol_breadbasket_of_europe_desc: "Bis zum Ende des 16. Jahrhunderts lieferte Polen den größten Teil des in Europa verzehrten Getreides. Kaufleute in Amsterdam, Lissabon und Sevilla konnten ohne polnischen Weizen und Roggen keine Geschäfte machen. Polen ist als „Kornkammer Europas“ in die Geschichte eingeschrieben."
 pol_nieszawa_privileges: "Die Nieszawaer Privilegien"
 pol_nieszawa_privileges_desc: "1454 brauchte Kasimir IV. Jagiełło Adelsaufgebote für den Krieg gegen den Deutschen Orden – und bezahlte dafür mit dem Statut von Nieszawa, das der Szlachta weitreichende Privilegien gewährte. Fortan konnte der König weder neue Steuern erheben noch neue Gesetze erlassen ohne Zustimmung des Adels. Dies wurde zum Eckstein von Polens „Goldener Freiheit“."
 pol_develop_krakow: "Krakau entwickeln"
 pol_develop_krakow_desc: "Die polnische Hauptstadt Krakau ist um den Wawel herum gewachsen. Diese Stadt vollständig zu entwickeln – sie zum Stadtrang zu erheben – begründet ihren Rang als größte Handelsstadt Mittelosteuropas."
 pol_baltic_fleet: "Die Ostseeflotte"
 pol_baltic_fleet_desc: "Mit Danzig in der Hand hat Polen seinen Zugang zur Ostsee gesichert. Die Zeit ist gekommen, eine Flotte zu bauen und um die Vorherrschaft in der Ostsee zu wetteifern. Da Schweden, Dänemark und der Livländische Orden alle um diese Gewässer wetteifern, wird die polnische Flotte zur neuesten – und größten – Macht der Ostsee."
 pol_sea_to_sea: "Von Meer zu Meer"
 pol_sea_to_sea_desc: "Die Beherrschung Livlands zur See und die Einnahme Kiews und Smolensks – die polnisch-litauische Union erstreckt sich nun von der Ostsee bis zum Schwarzen Meer. Von Reval im Norden bis Kiew im Süden ist das größte zusammenhängende Reich Osteuropas vollendet. Großhetman Jan Zamoyski sollte später sagen: „Dieses Polen ist eine Nation, die Gott selbst erbaut hat.“"
 pol_challenge_habsburg: "Die Habsburger herausfordern"
 pol_challenge_habsburg_desc: "Im 16. Jahrhundert beherrschten die Habsburger das Heilige Römische Reich, Spanien, Böhmen und Ungarn – die größte Dynastie Europas. Doch als König von Böhmen und Polen kann der Jagiellonen-Monarch diese Hegemonie herausfordern. Nimm Wien ein oder bringe die Habsburger unter die polnische Flagge."
 pol_codify_law: "Das Recht kodifizieren"
 pol_codify_law_desc: "Kasimirs des Großen Statut von Wiślica von 1346/47 war die erste systematische Kodifizierung polnischen Rechts. Aufbauend auf einer um Kontore zentrierten Buchführung und Verwaltungsinfrastruktur verbessert eine umfassendere Kodifizierung polnischen Rechts die Verwaltungseffizienz erheblich."
 pol_develop_warsaw: "Warschau entwickeln"
 pol_develop_warsaw_desc: "Warschau ist als Zentrum des Herzogtums Masowien gewachsen. Zentral in Polen gelegen, wird es nach der Union von Lublin 1569 zur Hauptstadt der Polnisch-Litauischen Adelsrepublik werden. Es zum Stadtrang zu erheben, begründet das Verwaltungsfundament des Zentrums des Königreichs."
 pol_amber_road: "Die Bernsteinstraße"
 pol_amber_road_desc: "Baltischer Bernstein – das „Gold des Nordens“ – wird seit der Antike geschätzt. Danzig war der Haupthafen für den Export baltischen Bernsteins, und Exporte nach Italien und ins Mittelmeer brachten gewaltigen Reichtum. Belebe diesen uralten Handelsweg und hebe Polens wirtschaftlichen Rang."
 pol_poznan_commerce: "Der Handel Posens"
 pol_poznan_commerce_desc: "Posen ist die Handelsstadt Westpolens, die Drehscheibe des Handels mit Brandenburg und Schlesien. Diese Stadt, die Polens ersten Bischofssitz beherbergte, war seit dem Mittelalter beständig das Handelszentrum Westpolens. Erhebe sie zum Stadtrang und schöpfe ihr Handelspotenzial voll aus."
 pol_vilnius_capital: "Wilna entwickeln"
 pol_vilnius_capital_desc: "Wilna wuchs im 14. Jahrhundert rasch als Hauptstadt des Großfürstentums Litauen. Von Großfürst Gediminas erbaut, wurde diese Stadt zur Heimat vieler Juden, Katholiken und orthodoxer Christen, die Seite an Seite lebten – später als „Jerusalem des Nordens“ bekannt. Erhebe sie zum Stadtrang und entwickle sie als Zentrum der litauischen Verwaltung."
 pol_russia_rivalry: "Rivalität mit Moskau"
 pol_russia_rivalry_desc: "Iwan III. der Große stritt heftig mit Polen-Litauen um Smolensk. Die Smolensker Kriege zwischen Moskau und Polen-Litauen dauerten das gesamte 16. Jahrhundert an – ein schicksalhafter Streit. Erkläre Moskau zum Rivalen und begründe die östliche Hegemonie. Gegen Moskaus Anspruch, „Hüter der Heiligen Rus“ zu sein, steht Polen als „Hüter der Freiheit“."
 pol_malbork_castle: "Die Marienburg"
 pol_malbork_castle_desc: "Die Marienburg (Malbork) wurde als Hauptsitz des Deutschen Ordens erbaut – die größte mittelalterliche Burg Europas. Im Frieden von Thorn (1457) an Polen übergeben, wird diese gewaltige Festung zum vollkommenen Verteidigungspunkt."
 pol_gniezno_church: "Erzbistum Gnesen"
 pol_gniezno_church_desc: "Gnesen ist die historische Hauptstadt Polens und Sitz seines ersten Erzbistums. Der um 987 erbaute Dom zu Gnesen beherbergt die Reliquien des Heiligen Adalbert und dient seither als Herz des polnischen katholischen Glaubens. Stärke die polnische Kirche und erfülle die Sendung als Beschützer des osteuropäischen Katholizismus."
 pol_hanseatic_ties: "Bande zur Hanse"
 pol_hanseatic_ties_desc: "Die Hanse beherrschte den Handel in Ost- und Nordsee. Polnische Städte wie Danzig, Thorn und Elbing hatten enge hanseatische Bande. Baue ein weites Handelsnetz um diese Städte auf, und Polen tritt als führende Handelsmacht der Ostsee hervor."
 pol_transylvania_influence: "Einfluss auf Siebenbürgen"
 pol_transylvania_influence_desc: "Siebenbürgen ist eine reiche Region an der Grenze zwischen dem Königreich Ungarn und der polnischen Personalunion. Einfluss auf Siebenbürgen zu begründen – über die ungarische Union oder unmittelbar – stabilisiert Polens südöstliche Grenze."
 pol_subjugate_serbia: "Serbien unterwerfen"
 pol_subjugate_serbia_desc: "Das Königreich Serbien wurde nach dem Amselfeld (1389) osmanischer Vasall. Als Teil der südlichen Ausdehnung der polnisch-ungarischen Union begründet die Sicherung Belgrads oder die Vasallisierung Serbiens einen festen Stützpunkt auf dem nördlichen Balkan."
 pol_varna_revenge: "Rache für Warna"
 pol_varna_revenge_desc: "In der Schlacht bei Warna 1444 wurde das polnisch-ungarische Kreuzfahrerheer von den Osmanen zerschmettert, und der polnische König Władysław III. fiel auf dem Feld. Die Zeit ist endlich gekommen, diese Demütigung zu rächen. Besetze Warna, während du mit einer muslimischen Nation im Krieg stehst, und diese Tragödie wird in einen Sieg umgeschrieben."
 pol_upper_silesia_mines: "Die oberschlesischen Bergwerke"
 pol_upper_silesia_mines_desc: "Oberschlesien ist für seine reichen Silber-, Zink- und Bleiminen bekannt. Die vollständige Entwicklung der Bergbaubezirke um Teschen und Gleiwitz begründet Polens industrielles Fundament. Ergreife früh die Bodenschätze dieser Region – die später zu einem Zentrum der Industriellen Revolution wurde."
 pol_upper_silesia_mines_unlock_tt: "Die Entscheidung „Die Bergwerke Oberschlesiens erschließen“ ist nun verfügbar."
 pol_silesia_mining_decision.title: "Die Bergwerke Oberschlesiens erschließen"
 pol_silesia_mining_decision.desc: "Die Bergbaureviere Schlesiens sind weitläufig, und die Krone kann nicht alle auf einmal erschließen. Jede Investition in Schächte, Hütten und Straßen bringt ein weiteres Revier zur vollen Förderung, und das Werk lässt sich jedes Jahrzehnt erneuern."
 pol_silesia_mining_decision.a: "In ein neues Bergbaurevier investieren."
 pol_pomeranian_coast: "Die pommersche Küste"
 pol_pomeranian_coast_desc: "Pommern (Pomorze) ist die Ostseeküstenregion um Stettin (Szczecin). Die Rückgewinnung dieser historisch zum polnischen Reich gehörenden Region gibt Polen die vollständige Kontrolle über die Ostseeküste."
 pol_prague_university: "Die Universität Prag"
 pol_prague_university_desc: "Die Karls-Universität in Prag (gegründet 1348) ist die älteste Universität Mittelosteuropas. Einst Brutstätte der hussitischen Reformation, kann diese Akademie nun unter polnischer Herrschaft wiederaufgebaut und entwickelt werden – und Prag wird wieder zum Zentrum katholischer Gelehrsamkeit."
 pol_catholicism_of_lithuania: "Katholisierung Litauens"
 pol_catholicism_of_lithuania_desc: "Als Jogaila König von Polen wurde, gelobte er, Litauen zum Katholizismus zu bekehren. Errichte in ganz Litauen um Wilna Kirchen und Klöster und wandle dieses einst heidnische Land in einen vollständig katholischen Staat. Ohne diese Bekehrung kann es keine wahre Einigung der polnisch-litauischen Union geben. „Litauen im Glauben wiedergeboren.“"
 pol_royal_road: "Die Königsstraße"
 pol_royal_road_desc: "Die „Königsstraße“ (Droga Królewska), die von Krakau über Gnesen und Posen nach Danzig führt, ist die große Ader des Königreichs Polen. Mit eingegliedertem Masowien und erobertem Preußen verbessert die Entwicklung dieser Straße Kommunikation, Handel und Verwaltung im ganzen Reich erheblich."
 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "Nieszawaer Privilegien"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "Die Szlachta gewann ein Vetorecht über die königliche Gesetzgebung. Der Beginn von Polens „Goldener Freiheit“."
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "Polnisches Gesetzbuch"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "Neue Artikel, die vom Gesetzbuch Kasimirs des Großen abstammen, bringen den Tag näher, an dem Adlige und Bürger gleichermaßen vor demselben Gericht gerichtet werden."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Politik der Kaufmannsförderung"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "Die Politik zur Förderung von Polens Kaufmannsbürgertum treibt das Handelseinkommen in die Höhe."
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "Bernsteinstraße"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "Karren, beladen mit baltischem Bernstein, ziehen die alte Straße entlang zu Kaufleuten, die das „Gold des Nordens“ suchen."
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "Handelsdrehscheibe Posen"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "Die Handelsstadt Westpolens, Posen, ist als bedeutende Handelsdrehscheibe ausgebaut."
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "Wilna erblüht"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "Die Hauptstadt des Großfürstentums Litauen, Wilna, gedeiht als multikulturelle Stadt."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Zugang zum Schwarzen Meer"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "Polen hat sich Zugang zur nördlichen Schwarzmeerküste gesichert und tritt in die Mittelmeerhandelswege ein."
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "Festung Marienburg"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "Europas größte mittelalterliche Burg ist mit Bastionen ausgebaut – ein uneinnehmbares Bollwerk."
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "Erzbistum Gnesen"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "Der Dom zu Gnesen, Heimstatt der Reliquien des Heiligen Adalbert, wirkt als geistliches Zentrum der polnischen katholischen Zivilisation."
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "Rache für Warna"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "Die demütigende Niederlage von 1444 ist gerächt. Polen erringt immer größeren Ruhm im Kampf gegen die islamische Welt."
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "Die pommersche Küste"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "Die pommersche Küste um Stettin ist als Stützpunkt der polnischen Flotte ausgebaut."
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "Die Universität Prag blüht"
 STATIC_MODIFIER_DESC_pol_prague_learning_mod: "Mittelosteuropas älteste Universität, die Karls-Universität, blüht unter polnischer Herrschaft wieder auf."
 STATIC_MODIFIER_NAME_pol_habsburg_victory_mod: "Sieg über die Habsburger"
 STATIC_MODIFIER_DESC_pol_habsburg_victory_mod: "Wien besetzt oder habsburgische Personalunion – Polen ist zum Herrn Mitteleuropas geworden."
 STATIC_MODIFIER_NAME_pol_sea_to_sea_mod: "Von Meer zu Meer"
 STATIC_MODIFIER_DESC_pol_sea_to_sea_mod: "Polen, das sich von der Ostsee bis zum Schwarzen Meer erstreckt, beherrscht den gesamten osteuropäischen Handel."
 STATIC_MODIFIER_NAME_pol_lithuanian_church_mod: "Litauische Kirche"
 STATIC_MODIFIER_DESC_pol_lithuanian_church_mod: "Die Katholisierung Litauens hat die geistliche Einigung der polnisch-litauischen Union erreicht."
 STATIC_MODIFIER_NAME_pol_royal_road_mod: "Die Königsstraße"
 STATIC_MODIFIER_DESC_pol_royal_road_mod: "Beamte, Kaufleute und Soldaten reisen in langer Reihe auf der Königsstraße von Krakau nach Danzig."
 pol_lithuanian_relations: "Beziehungen zu Litauen"
 pol_lithuanian_relations_desc: "Das Großfürstentum Litauen ist Polens wichtigster Nachbar – ein möglicher Verbündeter oder die größte Bedrohung. Im 14. Jahrhundert war Litauen die letzte heidnische Nation Europas und dennoch ein gewaltiger Staat, der sich von der Ostsee bis zum Schwarzen Meer erstreckte. Um die Personalunion mit Litauen durch Königin Hedwigs Heiratspolitik zu sichern, muss zunächst der diplomatische Grund gelegt werden. Ob durch freundschaftliche Beziehungen oder militärischen Druck – Polen kann seinen Anspruch auf den litauischen Thron geltend machen."
 pol_develop_ruthenia_desc: "Galizien (Halytsch) und Wolhynien sind die zwei großen Fürstentümer Rotrutheniens. Lemberg (Lwów), Zentrum des Fürstentums Galizien, und das Fürstentum Wolhynien wurden 1349–66 von Polen erobert. Bełz ist ebenfalls ein wichtiges ruthenisches Bollwerk. Sowohl Galizien als auch Wolhynien in Personalunion unter Polen zu bringen – oder Lemberg und Bełz unmittelbar zu besitzen – begründet die Kontrolle über ganz Rotruthenien. Dieses Land ist eine von Europas größten Agrarzonen, und sein reicher Boden trägt Polens Bevölkerung und Wirtschaft."
 STATIC_MODIFIER_NAME_pol_silesia_mines_mod: "Die oberschlesischen Bergwerke"
 STATIC_MODIFIER_DESC_pol_silesia_mines_mod: "In den Schächten Oberschlesiens erklingt Tag und Nacht das Geräusch der Spitzhacken, die Silber, Zink und Blei brechen."
 STATIC_MODIFIER_NAME_pol_baltic_fleet_mod: "Die polnische Ostseeflotte"
 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "Die in Danzig stationierte polnische Flotte beherrscht die Ostsee. Von der Weichselmündung bis zur Nordsee weht das polnische Banner auf den Wellen."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Herrschaft über Livland"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "Unter der polnischen Flagge, die über den Häfen von Riga und Reval weht, zahlen Völker vieler Sprachen ihre Steuern an dieselben Eintreiber."
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "Bande zur Hanse"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "In den Kontoren Danzigs treiben jene, die mit den Hansekaufleuten den Becher teilen, ihren Handel, einander im Vertrauen auf die Fracht des anderen."
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "Einfluss auf Siebenbürgen"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Durch die Personalunion mit Ungarn werden polnische Gesandte selbst an den Höfen in den Bergtälern Siebenbürgens empfangen."
 pol_breadbasket_town_right_tt: "Das Stadtrecht „Polnische Königliche Kornkammer“ ist nun verfügbar. Es kann Orten mit Stadtrang oder höher verliehen werden, die einen Kornspeicher der Stufe 5 oder höher besitzen."
 STATIC_MODIFIER_NAME_pol_warsaw_location_mod: "Königliche Hauptstadt Warschau entwickelt"
 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "Die Straßen Warschaus, an den Ufern der Weichsel erbaut, weiten sich Tag für Tag, und die Kutschen der Beamten aus dem ganzen Königreich versammeln sich hier."
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "Krakau erblüht"
 STATIC_MODIFIER_DESC_pol_krakow_location_mod: "Krakau, um den Wawel gelegen, ist vollständig entwickelt. Die Erweiterung der maximalen Rohstoffgröße und des monatlichen Wohlstandswachstums verwandelt es in eine Stadt, die der polnischen Königshauptstadt würdig ist."
