 STATIC_MODIFIER_DESC_nor_papal_champion_mod: "Eine unerschütterliche Stellung als stärkster Beschützer der nördlichen katholischen Zivilisation ist begründet."
 STATIC_MODIFIER_NAME_nor_colonial_empire_mod: "Das norwegische Kolonialreich"
 STATIC_MODIFIER_DESC_nor_colonial_empire_mod: "Norwegen wird zu Europas erstem wahren Kolonialreich mit 10+ Kolonien einschließlich Vinlands."
 STATIC_MODIFIER_NAME_nor_stormakt_mod: "Stormakt"
 STATIC_MODIFIER_DESC_nor_stormakt_mod: "Norwegens Zeitalter der Großmacht ist gekommen – es herrscht als größte Macht Nordeuropas."
 STATIC_MODIFIER_NAME_nor_sound_toll_mod: "Öresundzoll"
 STATIC_MODIFIER_DESC_nor_sound_toll_mod: "Der Einzug des Öresundzolls bereichert die norwegische Schatzkammer."
 STATIC_MODIFIER_NAME_nor_stockholm_mod: "Stockholm entwickelt"
 STATIC_MODIFIER_DESC_nor_stockholm_mod: "Stockholm ist über die schwedische Union als östliche Verwaltungsdrehscheibe des Norwegischen Reiches ausgebaut."
 STATIC_MODIFIER_NAME_nor_hanseatic_expulsion_mod: "Hansekaufleute vertrieben"
 STATIC_MODIFIER_DESC_nor_hanseatic_expulsion_mod: "Bergen ist von deutscher Kaufmannsherrschaft befreit – norwegische Kaufleute beherrschen ihren eigenen Hafen."
 STATIC_MODIFIER_NAME_nor_north_sea_empire_mod: "Das Nordseereich"
 STATIC_MODIFIER_DESC_nor_north_sea_empire_mod: "Knuts des Großen Nordseereich ist in der Neuzeit wiedergeboren. Die gesamte Nordseeküste unter norwegischer Kontrolle."
 STATIC_MODIFIER_NAME_nor_norwegian_empire_final_mod: "Norwegisches Reich"
 STATIC_MODIFIER_DESC_nor_norwegian_empire_final_mod: "Das Norwegische Reich, das sich von Island bis Vinland erstreckt, ist vollendet. Die Wikingererben übertreffen ihre Vorfahren."
 STATIC_MODIFIER_NAME_nor_faith_steadfast_mod: "Standhaft im Glauben"
 STATIC_MODIFIER_DESC_nor_faith_steadfast_mod: "Unerschütterlicher katholischer Glaube verkündet dem Volk die Autorität des Königs mit dem Läuten der Glocken des Doms zu Nidaros."
 STATIC_MODIFIER_NAME_nor_reform_winds_mod: "Winde der Reform"
 STATIC_MODIFIER_DESC_nor_reform_winds_mod: "Luthers Lehre verbreitet sich in ganz Norwegen."
 STATIC_MODIFIER_NAME_nor_old_gods_calling_mod: "Ruf der alten Götter"
 STATIC_MODIFIER_DESC_nor_old_gods_calling_mod: "Der Glaube an Odin und Thor erwacht heimlich neu."
 nor_expel_danish_nobility: "Dänemark entgegentreten"
 nor_expel_danish_nobility_desc: "Im Jahr 1337 ist Norwegen ein unabhängiges Königreich in Personalunion mit Schweden unter König Magnus Eriksson – kein dänischer Untertan. Dänemark ist ein vielschichtiger Nachbar, und die kommende Kalmarer Union (1397) droht, Dänemark die Vorherrschaft über Skandinavien zu geben. Begründe jetzt Norwegens Stellung in Skandinavien durch ein klares Verhältnis zu Dänemark – sei es durch Rivalität, Bündnis oder Freundschaft."
 nor_secure_bergen_desc: "Die Bryggen – jene bunten Holzlagerhäuser am Kai von Bergen – sind das Sinnbild hanseatischen Kaufmannswohlstands. Doch Bergen muss eine norwegische Stadt sein. Wenn die Autorität des Königs sich auf diesen Hafen erstreckt, fließt der Reichtum des Nordatlantikhandels in norwegische Hände."
 nor_develop_stavanger_desc: "Stavanger ist eine uralte Bischofsstadt an Norwegens Südwestküste. Als Herz Rogalands, wo Klippen und Fjorde sich verflechten, wird dieser Hafen zur Drehscheibe des Heringsfangs und des Nordseehandels. Entwickle ihn zu Norwegens zweitgrößter Hafenstadt nach Bergen."
 nor_develop_oslo_desc: "Oslo, geschützt hinter den Mauern der Festung Akershus, ist das südliche Tor zwischen Dänemark und Schweden. Im Osten liegt Schweden, im Süden Dänemark. Durch die Entwicklung Oslos zu einer blühenden Stadt wird Norwegens Südgrenze gesichert, und Landwirtschaft und Handel beginnen zu gedeihen."
 nor_secure_nidaros_desc: "Nidaros – diese Stadt, erbaut am Ort des Märtyrertods des Heiligen Olav, steht unter Skandinaviens größtem gotischen Dom und trägt tausend Jahre Geschichte als geistliches Zentrum der nordischen christlichen Welt. Nidaros zu entwickeln bedeutet, die Autorität des norwegischen Königs von Himmel und Erde zugleich bestätigt zu sehen."
 nor_vinland_desc: "Vor tausend Jahren setzte Leif, Sohn Eriks des Roten, den Fuß auf einen fernen Kontinent jenseits des Nebels – Vinland. Nun trägt eine Kolonialnation unter norwegischem Banner diesen Traum weiter. Norwegen wird als erste europäische Nation in die Geschichte eingeschrieben, die in der Neuen Welt Wurzeln schlug."
 nor_colonization_desc: "Von Vinland bis Grönland, von Island bis zu den arktischen Küsten – norwegische Kolonialnationen verteilen sich über den Nordatlantik. Der Geist wikingischer Erkundung lebt in der Neuzeit fort, und Norwegen steht als wahres Seereich, das die Welt jenseits der Meere beherrscht."
 nor_kingdom_of_britain_desc: "London, York, Edinburgh – die drei großen Städte der Britischen Inseln unter dem norwegischen Banner vereint. Der Traum Knuts des Großen wird noch einmal verwirklicht. Die Erinnerung an das Danelag erwacht in der Neuzeit, und die Nordsee wird zu Norwegens See."
 nor_arctic_trade_desc: "Die Kola-Halbinsel – eine gefrorene Wildnis am Rand der Arktis – ist eine Schatzkammer aus Pelzen, Wild und Walrosselfenbein. Die von samischen Jägern eingebrachten arktischen Erzeugnisse erzielen als feinste, vom europäischen Adel gesuchte Pelze gewaltigen Reichtum. Mit der Einnahme der Kola-Halbinsel wird Norwegen zum absoluten Herrn des arktischen Handels."
 nor_timber_industry_desc: "Norwegens Wälder sind ein Geschenk an Schiffbauer und Baumeister gleichermaßen. Fichte, Kiefer und Birke, tief aus dem Wald geschlagen – gepaart mit den eisernen Werkzeugen, die sie bearbeiten – bilden das industrielle Rückgrat der norwegischen Wirtschaft. Wenn der Rauch der Sägewerke aufsteigt, wird Norwegen zu Nordeuropas größtem Holzexporteur."
 STATIC_MODIFIER_NAME_nor_timber_mod: "Holzindustrie"
 STATIC_MODIFIER_DESC_nor_timber_mod: "Holz und Werkzeuge aus Norwegens reichen Wäldern tragen das industrielle Fundament."
 STATIC_MODIFIER_NAME_nor_arctic_trade_mod: "Arktischer Handel"
 STATIC_MODIFIER_DESC_nor_arctic_trade_mod: "Pelze und Wild von der Kola-Halbinsel fließen über norwegische Kaufleute nach ganz Europa."
 STATIC_MODIFIER_NAME_nor_northern_economy_mod: "Nordische Wirtschaft"
 STATIC_MODIFIER_DESC_nor_northern_economy_mod: "Der auf Fischerei, Holz, Pelzen und arktischem Handel aufgebaute norwegische Handel erreicht das höchste Niveau Nordeuropas. Die Unterhaltskosten der Kaufleute sind gesenkt, und mehr Handelsposten können errichtet werden."
