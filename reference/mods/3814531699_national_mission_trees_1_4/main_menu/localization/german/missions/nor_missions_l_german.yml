l_german:
 nor_kongedommen_mission_pack: "Kongeriket Norge – Norwegens Ruhm"
 nor_kongedommen_mission_pack_DESCRIPTION:0 "Im Jahr 1337 steht Norwegen mit Schweden unter König Magnus Eriksson in Personalunion, während es weiterhin unter dänischem Einfluss steht. Als Erben der Wikinger befreie dich von Dänemark und eine Skandinavien. Durch Bergens Fischgründe, die Herrschaft über die Nordsee, Kolonien in Island und Grönland und die große Fahrt nach Vinland – und mit der Wahl des Glaubens (katholisch, lutherisch oder nordisch) – errichte das Norwegische Reich."
 nor_kongedommen_mission_pack_CRITERIA_DESCRIPTION:0 "Erringe als Norwegen Unabhängigkeit, Einheit, die Herrschaft über den Nordatlantik und ein Kolonialreich, um das Norwegische Reich zu gründen."
 nor_kongedommen_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das Norwegische Reich zu errichten."
 nor_kongedommen_mission_pack_BUTTON_DETAILS:0 "Mit dem Stolz der Wikingererben schmiede Norwegen zu einem Reich!"
 nor_kingdom_of_norway: "Das Königreich Norwegen"
 nor_kingdom_of_norway_desc: "Im Jahr 1337 steht Norwegen mit Schweden unter König Magnus Eriksson in Personalunion, während dänischer Einfluss den Norden ständig bedroht. Als Erben der Wikinger stärke die königliche Legitimität und festige die Grundlagen eines unabhängigen norwegischen Königreichs."
 nor_control_denmark: "Dänemark beherrschen"
 nor_control_denmark_desc: "Dänemark ist Norwegens größte Bedrohung und historischer Rivale. Die Besetzung Kopenhagens oder die Unterwerfung Dänemarks als norwegischer Untertan überträgt die Führung der Kalmarer Union an Norwegen."
 nor_sweden_union: "Personalunion mit Schweden"
 nor_sweden_union_desc: "Stärke und bewahre die Personalunion mit Schweden, damit sich die ganze Macht Nordskandinaviens unter Norwegen sammelt. Führe König Magnus’ Herrschaft fort und mache dieses Bündnis zum Fundament skandinavischer Einheit."
 nor_unite_scandinavia: "Skandinavien einen"
 nor_unite_scandinavia_desc: "Dänemark beherrscht, Schweden in Personalunion – ganz Skandinavien unter dem norwegischen Banner vereint. Seit dem Wikingerzeitalter ist hier der historische Augenblick gekommen, da die nordische Welt unter einem König regiert wird."
 nor_sound_toll: "Der Öresundzoll"
 nor_sound_toll_desc: "Mit besiegtem Dänemark fällt die Öresund-Meerenge unter norwegische Kontrolle. Den Öresundzoll einzuziehen, schafft gewaltige Einnahmen."
 nor_develop_stockholm: "Stockholm entwickeln"
 nor_develop_stockholm_desc: "Entwickle über die schwedische Personalunion Stockholm als östliche Verwaltungsdrehscheibe des Norwegischen Reiches."
 nor_secure_bergen: "Bergen sichern"
 nor_fleet_of_norway: "Die Flotte Norwegens"
 nor_fleet_of_norway_desc: "Die Norweger – Nachfahren der Wikinger – sind ein Volk des Meeres. Der Bau einer mächtigen, auf Bergen gestützten Flotte begründet die Fähigkeit zur Entsendung über Nordsee, Nordatlantik und Ostsee."
 nor_north_sea_markets: "Nordseemärkte"
 nor_north_sea_markets_desc: "Norwegen nutzt seinen geografischen Vorteil an der Nordsee, um den Handel zu entwickeln. Begründe Norwegen als bedeutenden Akteur im Nordseehandel mit monatlichem Einkommen 100+ und mehreren Marktzentren."
 nor_iceland_colony: "Island beherrschen"
 nor_iceland_colony_desc: "Island wurde 874 von Norwegern besiedelt – ein überseeischer Stützpunkt norwegischer Kultur. Der Besitz mehrerer Orte Islands vollendet den nordatlantischen Brückenkopf und bringt Grönland und Vinland in Reichweite."
 nor_greenland_expedition: "Die Grönland-Expedition"
 nor_greenland_expedition_desc: "985 gründete Erik der Rote (Eiríkr rauði) eine Kolonie in Grönland. Tue diesen ersten Schritt zum westlichen Kontinent und öffne den Pfad zum sagenhaften Vinland."
 nor_vinland: "Vinland"
 nor_orkney_shetland: "Orkney und Shetland"
 nor_orkney_shetland_desc: "Die Orkney- und Shetlandinseln stehen seit dem Wikingerzeitalter unter norwegischem Einfluss. Die Sicherung dieser strategischen Inseln verbessert die Entsendefähigkeit in die Nordsee und zu den Britischen Inseln erheblich."
 nor_conquer_scotland: "Schottland erobern"
 nor_conquer_scotland_desc: "Schottlands Westküste und die Hebriden wurden einst von Wikingern beherrscht. Die Einnahme Edinburghs und der Hebriden öffnet den Pfad nach York – der Hauptstadt des Danelag."
 nor_invade_england: "In England einfallen"
 nor_invade_england_desc: "York war einst die Hauptstadt des wikingischen Königreichs Jórvík. Norwegische Streitkräfte, die York besetzen, beleben die Erinnerung an das Danelag in der Neuzeit."
 nor_kingdom_of_britain: "Königreich Britannien"
 nor_master_of_north_sea: "Herr der Nordsee"
 nor_master_of_north_sea_desc: "Die Nordseemärkte gesichert, Orkney und Shetland eingenommen – Norwegen ist der unbestrittene Herr der Nordsee. Mit Flotte 50+ und Einkommen 200+ weht das norwegische Banner über der gesamten Nordsee."
 nor_secure_nidaros: "Nidaros sichern"
 nor_fisheries: "Die Fischerei entwickeln"
 nor_fisheries_desc: "Norwegen ist Europas größte Fischereination. Kabeljau, Hering und Lachs füllen den Nordatlantik in Fülle. Entwickle die Fischerei dieser Nation vollständig und errichte ein System für den Massenexport in die Nordsee und die Ostsee."
 nor_timber_industry: "Die Holzindustrie"
 nor_arctic_trade: "Arktischer Handel"
 nor_develop_oslo: "Oslo entwickeln"
 nor_absolutism: "Absolutismus"
 nor_absolutism_desc: "Errichte in Norwegen die absolute Monarchie. Die Erhöhung der königlichen Autorität und die Stärkung der Legitimität bereiten das Fundament für eine zentralisierte Reichsverwaltung."
 nor_northern_economy: "Nordische Wirtschaft"
 nor_northern_economy_desc: "Arktischer Handel und die Wirtschaftsreformen der absoluten Monarchie – Norwegens Wirtschaft erreicht das höchste Niveau Nordeuropas. Beweise dies mit monatlichem Einkommen 300+ und mehreren Marktzentren."
 nor_religious_question: "Die Frage des Glaubens"
 nor_religious_question_desc: "Der Sturm der Reformation hat Norwegen erfasst. Der Klerus des Doms zu Nidaros ruft nach Treue zu Rom. Doch immer mehr fühlen sich zu Luthers neuer Lehre hingezogen. Und – manche träumen von der Rückkehr zu den alten Göttern. Die Wahl des norwegischen Königs wird die Seele dieses nordischen Königreichs bestimmen."
 nor_catholic_norway: "Katholisches Norwegen"
 nor_catholic_norway_desc: "Das Königreich Norwegen bewahrt die Treue zur römischen Kirche. Indem es die durch den Dom zu Nidaros versinnbildlichte Tradition des nördlichen Katholizismus hütet, macht es Norwegen durch enge Bande zum Papst zum Beschützer der nördlichen katholischen Zivilisation."
 nor_northern_crusade: "Nordischer Kreuzzug"
 nor_northern_crusade_desc: "Norwegen nimmt als nördlicher Schild der Christenheit am Heiligen Krieg teil. Durch den Kampf gegen die Ungläubigen wachsen Norwegens religiöse Autorität und Ansehen."
 nor_papal_champion: "Vorkämpfer des Papstes"
 nor_papal_champion_desc: "Tiefes Vertrauen zum Papsttum und die Beherrschung Lübecks – Norwegen hat eine unerschütterliche Stellung als stärkster Beschützer der nördlichen katholischen Zivilisation begründet."
 nor_reformation: "Die Reformation"
 nor_reformation_desc: "Norwegen nimmt das Luthertum (oder den Calvinismus) an. Der Kirchenbesitz geht an die Krone über und stärkt die Staatsfinanzen."
 nor_protestant_church: "Protestantische Kirche"
 nor_protestant_church_desc: "Errichte Universitäten, um lutherische Theologen auszubilden, und verankere den protestantischen Glauben in ganz Norwegen."
 nor_protestant_empire: "Protestantisches Reich"
 nor_protestant_empire_desc: "Das Luthertum durchdringt Skandinavien. Der norwegische König herrscht als nördlicher Vorkämpfer der protestantischen Welt."
 nor_norse_revival: "Wiedererweckung des Nordischen Glaubens"
 nor_norse_revival_desc: "Die Götter der Vorfahren – Odin, Thor, Freyr – werden wiedergeboren. Die Gestalt Skandinaviens vor der Christianisierung wird in der Neuzeit nachgebildet. Der norwegische König herrscht als Vertreter der nordischen Götter."
 nor_berserker_fleet: "Berserkerflotte"
 nor_berserker_fleet_desc: "Der Berserkergeist des Wikingerzeitalters wohnt der Flotte inne. Seekrieger, die den nordischen Göttern geweiht sind, werden als Kaperfahrer entfesselt, um die Küsten der Ungläubigen zu überfallen."
 nor_ragnarok_empire: "Reich des Ragnarök"
 nor_ragnarok_empire_desc: "Wie die neue Welt, die nach Ragnarök kommt, wird Norwegen unter dem Segen der alten Götter als nördliches Reich wiedergeboren. Mit Kaiserrang und 500+ unmittelbar besessenen Orten ergreife diesen Ruhm."
 nor_bane_of_hansa: "Verderben der Hanse"
 nor_bane_of_hansa_desc: "Die Hanse hat den norwegischen Handel über die Bryggen (den Deutschen Kai) in Bergen beherrscht. Beherrsche Lübeck oder löse die Hanse auf, damit norwegische Kaufleute ihre eigenen Handelswege zurückgewinnen."
 nor_baltic_access: "Zugang zur Ostsee"
 nor_baltic_access_desc: "Die Einnahme Stralsunds verschafft Norwegen unmittelbaren Zugang zur Ostsee. Norwegen wird damit zur größten Seemacht Nordeuropas und beherrscht sowohl Nordsee als auch Ostsee."
 nor_hanseatic_expulsion: "Die Hansekaufleute vertreiben"
 nor_hanseatic_expulsion_desc: "Mit aufgelöster Hanse und entwickeltem Bergen hat Norwegen Bergen vollständig von deutscher Kaufmannsherrschaft befreit. Norwegische Kaufleute sind die Herren ihres eigenen Hafens."
 nor_control_north_sea_trade: "Den Nordseehandel beherrschen"
 nor_control_north_sea_trade_desc: "Die Nordseemärkte gesichert und die Hanse zerschlagen – Norwegen ergreift die Führung über den gesamten Nordseehandel. Begründe die Vorherrschaft mit Einkommen 300+ und Flotte 40+."
 nor_north_sea_empire: "Das Nordseereich"
 nor_north_sea_empire_desc: "Norwegen, das die gesamte Nordseeküste einschließlich Lübecks beherrscht, hat das Nordseereich errichtet. Das Nordseereich Knuts des Großen wird in der Neuzeit wiedergeboren."
 nor_develop_stavanger: "Stavanger entwickeln"
 nor_amber_trade: "Bernsteinhandel"
 nor_amber_trade_desc: "Baltischer Bernstein wird über Norwegens Nordseehandelsnetz in ganz Europa ausgeführt. Das „Gold des Nordens“ weitet Norwegens Einkommen weiter aus."
 nor_integrate_finland: "Finnland eingliedern"
 nor_integrate_finland_desc: "Gliedere über die schwedische Personalunion Finnland als Teil des Norwegischen Reiches ein. Der unmittelbare Besitz von Åbo und Uleåborg erstreckt das Reich vom Nordatlantik bis zur Barentssee."
 nor_engelbrekt: "Der Geist Engelbrekts"
 nor_engelbrekt_desc: "Der Geist von Engelbrekts Aufstand hat sich nach Norwegen ausgebreitet. Mit der Unterstützung der Bauernschaft und festem Entschluss zur Unabhängigkeit verkörpere die Tradition der nordischen Freibauern."
 nor_develop_hammerfest: "Hammerfest entwickeln"
 nor_develop_hammerfest_desc: "Hammerfest ist eine der nördlichsten Städte der Welt. Die Entwicklung dieses arktischen Handelspostens zu einer Stadt begründet ein dauerhaftes Zentrum des arktischen Handels."
 nor_karoliner: "Norwegisches Elitheer"
 nor_karoliner_desc: "Ein norwegisches Elitheer, gestützt auf hohe Heerestradition, ist vollendet. Die Stärke des Heeres des Norwegischen Reiches – das Bergland zur Verteidigung nutzend und mächtig im Angriff – wird bewiesen."
 nor_great_power: "Großmacht des Nordens"
 nor_great_power_desc: "Absolute Monarchie sowie entwickelte Fischerei und Industrie – Norwegen tritt als Großmacht Nordeuropas hervor. Begründe diese Stellung mit 200+ Orten, Einkommen 250+, Ansehen 60+."
 nor_colonization: "Das norwegische Kolonialreich"
 nor_stormakt: "Stormakt – Großmacht des Nordens"
 nor_stormakt_desc: "Skandinavien geeint, das Nordseereich errichtet, die nordische Wirtschaft erreicht – die drei Säulen fügen sich, und Norwegen herrscht als Stormakt (Großmacht) Nordeuropas. Mit 600+ Orten, Einkommen 600+, Ansehen 80+ ergreife diesen Ruhm."
 nor_norwegian_empire: "Das Norwegische Reich"
 nor_norwegian_empire_desc: "Von Island bis Vinland, von Nidaros bis Britannien – das Norwegische Reich ist vollendet. Die Nachfahren der Wikinger haben selbst die Träume ihrer Vorfahren übertroffen. Ein Reich von einem Ausmaß, von dem selbst Knut der Große nie träumte, wird hier geboren. „Die Nordsee ist wieder einmal Norwegens See“ – so werden Historiker schreiben."
 nor_events.30.t: "Skandinavische Einheit – die Morgenröte norwegischer Macht"
 nor_events.30.d: "Dänemark beherrscht, Schweden geeint – ganz Skandinavien unter dem norwegischen Banner vereint. Seit dem Wikingerzeitalter ist diese Leistung, die niemandem gelungen ist, endlich verwirklicht. Die Glocken des Doms zu Nidaros läuten, und der König von Norwegen verkündet hiermit den Titel „König von Skandinavien“."
 nor_events.30.a: "Es lebe Skandinavien! Norwegen für immer!"
 nor_events.40.t: "Scheideweg des Glaubens – Norwegens religiöse Wahl"
 nor_events.40.d: "Der Sturm der Reformation hat Norwegen erfasst. Der Klerus des Doms zu Nidaros ruft nach Treue zu Rom. Doch immer mehr fühlen sich zu Luthers neuer Lehre hingezogen. Und – manche träumen von der Rückkehr zu den alten Göttern. Die Wahl des norwegischen Königs wird die Zukunft dieses nordischen Königreichs bestimmen."
 nor_events.40.a: "Die Treue zu Rom bewahren – der Katholizismus ist Norwegens Seele"
 nor_events.40.b: "Luthers Lehre annehmen – das Zeitalter der Reform ist gekommen"
 nor_events.40.c: "Zu den alten Göttern zurückkehren – Odins Segen suchen"
 nor_events.99.t: "Die Geburt des Norwegischen Reiches"
 nor_events.99.d: "Von Island bis Vinland, von Nidaros bis Britannien – das Norwegische Reich ist endlich vollendet. Die Nachfahren der Wikinger haben ihre Vorfahren übertroffen. Ein Reich von einem Ausmaß, von dem selbst Knut der Große nie träumte, wird hier geboren. „Die Nordsee ist wieder einmal Norwegens Binnenmeer“ – Historiker werden dies festhalten."
 nor_events.99.a: "Es lebe der Kaiser des Norwegischen Reiches! Erben der Wikinger, für immer!"
 STATIC_MODIFIER_NAME_nor_kingdom_mod: "Königreich Norwegen"
 STATIC_MODIFIER_DESC_nor_kingdom_mod: "Der Grundstein für Norwegens Wiederaufbau unter der Herrschaft König Magnus Erikssons ist gelegt."
 STATIC_MODIFIER_NAME_nor_denmark_crushed_mod: "Dänemark zerschlagen"
 STATIC_MODIFIER_DESC_nor_denmark_crushed_mod: "Norwegens größter Rivale ist zerschlagen. Die Führung Skandinaviens geht an Norwegen über."
 STATIC_MODIFIER_NAME_nor_sweden_union_mod: "Schwedische Personalunion"
 STATIC_MODIFIER_DESC_nor_sweden_union_mod: "Die Personalunion mit Schweden legt das Fundament skandinavischer Einheit."
 STATIC_MODIFIER_NAME_nor_scandinavia_united_mod: "Skandinavien geeint"
 STATIC_MODIFIER_DESC_nor_scandinavia_united_mod: "Die Banner dreier Königreiche stehen Seite an Seite unter einer Krone, und Befehle aus Oslo erreichen die nördlichen Meere."
 STATIC_MODIFIER_NAME_nor_bergen_mod: "Bergen – Handelsdrehscheibe"
 STATIC_MODIFIER_DESC_nor_bergen_mod: "Bergen ist als Norwegens nordatlantisches Handelszentrum ausgebaut."
 STATIC_MODIFIER_NAME_nor_fleet_mod: "Die Flotte Norwegens"
 STATIC_MODIFIER_DESC_nor_fleet_mod: "Eine norwegische Flotte mit wikingischem Blut entsendet sich über Nordsee und Nordatlantik."
 STATIC_MODIFIER_NAME_nor_north_sea_mod: "Nordseemärkte"
 STATIC_MODIFIER_DESC_nor_north_sea_mod: "Norwegen ist als bedeutender Akteur im Nordseehandel begründet."
 STATIC_MODIFIER_NAME_nor_iceland_mod: "Island beherrscht"
 STATIC_MODIFIER_DESC_nor_iceland_mod: "Island ist als Norwegens nordatlantischer Brückenkopf gesichert."
 STATIC_MODIFIER_NAME_nor_greenland_mod: "Die Grönland-Expedition"
 STATIC_MODIFIER_DESC_nor_greenland_mod: "Norwegische Seeleute, die zu den eisigen Meeren Grönlands segeln, ziehen neue Linien auf den Karten des hohen Nordens."
 STATIC_MODIFIER_NAME_nor_vinland_mod: "Vinland"
 STATIC_MODIFIER_DESC_nor_vinland_mod: "Norwegen wird zu Europas erster Kolonialnation der Neuen Welt mit Siedlungen in Nordamerika."
 STATIC_MODIFIER_NAME_nor_orkney_mod: "Orkney und Shetland"
 STATIC_MODIFIER_DESC_nor_orkney_mod: "Über die Wellen der Nordsee, gesehen von den Häfen Orkneys, ziehen die Silhouetten norwegischer Schiffe ohne Unterlass."
 STATIC_MODIFIER_NAME_nor_scotland_mod: "Schottland erobert"
 STATIC_MODIFIER_DESC_nor_scotland_mod: "Die Einnahme Edinburghs öffnet den Pfad nach Britannien."
 STATIC_MODIFIER_NAME_nor_england_invasion_mod: "Der Einfall in England"
 STATIC_MODIFIER_DESC_nor_england_invasion_mod: "Die Erinnerung an das Danelag ist wiederbelebt. Norwegische Streitkräfte fegen durch Nordengland."
 STATIC_MODIFIER_NAME_nor_britain_mod: "Königreich Britannien"
 STATIC_MODIFIER_DESC_nor_britain_mod: "Knuts des Großen Nordseereich ist wiedergeboren. Die gesamten Britischen Inseln unter norwegischer Kontrolle."
 STATIC_MODIFIER_NAME_nor_north_sea_master_mod: "Herr der Nordsee"
 STATIC_MODIFIER_DESC_nor_north_sea_master_mod: "Norwegen wird zum unbestrittenen Herrn der Nordsee. Die gesamte Nordsee steht unter norwegischer Kontrolle."
 STATIC_MODIFIER_NAME_nor_nidaros_mod: "Nidaros entwickelt"
 STATIC_MODIFIER_DESC_nor_nidaros_mod: "Norwegens historische Hauptstadt ist als geistliches und kulturelles Zentrum des Nordens ausgebaut."
 STATIC_MODIFIER_NAME_nor_fisheries_mod: "Fischerei entwickelt"
 STATIC_MODIFIER_DESC_nor_fisheries_mod: "Die reichen Fischgründe des Nordatlantiks sind voll erschlossen und begründen Norwegens wirtschaftliches Fundament."
 STATIC_MODIFIER_NAME_nor_oslo_mod: "Oslo entwickelt"
 STATIC_MODIFIER_DESC_nor_oslo_mod: "Die Schreiber der Burg Akershus verfassen die Erlasse des Königs von Tal zu Tal in ganz Südnorwegen."
 STATIC_MODIFIER_NAME_nor_absolutism_mod: "Absolutismus"
 STATIC_MODIFIER_DESC_nor_absolutism_mod: "Die absolute Monarchie ist in Norwegen errichtet. Das Fundament für eine zentralisierte Reichsverwaltung ist gelegt."
 STATIC_MODIFIER_NAME_nor_catholic_mod: "Katholisches Norwegen"
 STATIC_MODIFIER_DESC_nor_catholic_mod: "Der Treue zur römischen Kirche folgend, wird Norwegen als Beschützer der nördlichen katholischen Zivilisation anerkannt."
 STATIC_MODIFIER_NAME_nor_crusader_mod: "Ruhm des Nordischen Kreuzfahrers"
 STATIC_MODIFIER_DESC_nor_crusader_mod: "Norwegen erwirbt sich durch den Heiligen Krieg den Ruf eines Beschützers der Christenheit."
 STATIC_MODIFIER_NAME_nor_lutheran_mod: "Lutherische Reform"
 STATIC_MODIFIER_DESC_nor_lutheran_mod: "Aus den Klöstern getragene heilige Gefäße werden in die königlichen Kassen gelegt, und Norwegens Schatzkammer ist voller als je zuvor."
 STATIC_MODIFIER_NAME_nor_protestant_church_mod: "Protestantische Kirche"
 STATIC_MODIFIER_DESC_nor_protestant_church_mod: "Die Ausbildung lutherischer Theologen verankert den protestantischen Glauben in ganz Norwegen."
 STATIC_MODIFIER_NAME_nor_norse_conversion_mod: "Wiedererweckung des Nordischen Glaubens"
 STATIC_MODIFIER_DESC_nor_norse_conversion_mod: "Der Glaube an Odin, Thor und Freyr ist wiederbelebt. Der Kriegergeist des Wikingerzeitalters wohnt den norwegischen Heeren inne."
 STATIC_MODIFIER_NAME_nor_berserker_fleet_mod: "Berserkerflotte"
 STATIC_MODIFIER_DESC_nor_berserker_fleet_mod: "Der wikingische Berserkergeist wohnt der Flotte inne. Kaperfahrer überfallen frei die Küsten der Ungläubigen."
 STATIC_MODIFIER_NAME_nor_ragnarok_mod: "Reich des Ragnarök"
 STATIC_MODIFIER_DESC_nor_ragnarok_mod: "Unter dem Segen der alten Götter ist Norwegen als nördliches Reich wiedergeboren."
 STATIC_MODIFIER_NAME_nor_hansa_victory_mod: "Hanse besiegt"
 STATIC_MODIFIER_DESC_nor_hansa_victory_mod: "Die deutsche Kaufmannsherrschaft über Bergen ist zerschlagen."
 STATIC_MODIFIER_NAME_nor_baltic_mod: "Zugang zur Ostsee"
 STATIC_MODIFIER_DESC_nor_baltic_mod: "Norwegen sichert sich über Stralsund unmittelbaren Zugang zur Ostsee."
 STATIC_MODIFIER_NAME_nor_trade_supremacy_mod: "Vorherrschaft im Nordseehandel"
 STATIC_MODIFIER_DESC_nor_trade_supremacy_mod: "Norwegen ergreift die Führung über den gesamten Nordseehandel."
 STATIC_MODIFIER_NAME_nor_stavanger_mod: "Hafen Stavanger"
 STATIC_MODIFIER_DESC_nor_stavanger_mod: "Stavanger ist als Fischerei- und Handelsdrehscheibe Südwestnorwegens ausgebaut."
 STATIC_MODIFIER_NAME_nor_amber_mod: "Bernsteinhandel"
 STATIC_MODIFIER_DESC_nor_amber_mod: "Baltischer Bernstein wird über Norwegens Handelsnetz ausgeführt."
 STATIC_MODIFIER_NAME_nor_finland_mod: "Finnland eingegliedert"
 STATIC_MODIFIER_DESC_nor_finland_mod: "Finnland ist als Teil des Norwegischen Reiches eingegliedert."
 STATIC_MODIFIER_NAME_nor_engelbrekt_mod: "Der Geist Engelbrekts"
 STATIC_MODIFIER_DESC_nor_engelbrekt_mod: "Die Tradition der nordischen Freibauern ist als Norwegens Stolz verkörpert."
 STATIC_MODIFIER_NAME_nor_hammerfest_mod: "Hammerfest entwickelt"
 STATIC_MODIFIER_DESC_nor_hammerfest_mod: "Der nördlichste Handelsposten der Welt ist als dauerhaftes Zentrum des arktischen Handels begründet."
 STATIC_MODIFIER_NAME_nor_military_tradition_mod: "Norwegisches Elitheer"
 STATIC_MODIFIER_DESC_nor_military_tradition_mod: "Ein hochtrainiertes norwegisches Elitheer, gestützt auf starke Heerestradition, ist vollendet."
 STATIC_MODIFIER_NAME_nor_great_power_mod: "Großmacht des Nordens"
 STATIC_MODIFIER_DESC_nor_great_power_mod: "Norwegen tritt als Großmacht Nordeuropas hervor."
 STATIC_MODIFIER_NAME_nor_protestant_empire_mod: "Protestantisches Reich"
 STATIC_MODIFIER_DESC_nor_protestant_empire_mod: "Norwegen, mit ganz Skandinavien im Luthertum, herrscht als nördlicher Vorkämpfer der protestantischen Welt."
