l_german:
 kie_kyiv_mission_pack: "Die Wiedervereinigung der Rus und der Herrscher der Kosaken"
 kie_kyiv_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist das Fürstentum Kiew ein kleiner Staat, gefangen zwischen Litauen und den Tataren. Doch Kiew erstrahlte einst als Herz der Kiewer Rus – die Sophienkathedrale, das Höhlenkloster und das Goldene Tor zeugen noch von seinem Glanz. Eine das linke und rechte Ufer der Ukraine, erobere Halytsch und Wolhynien, besiege die Tataren mit kosakischer Militärmacht, bilde Ruthenien und herrsche als Großfürstentum."
 kie_kyiv_mission_pack_CRITERIA_DESCRIPTION:0 "Vereine die Rus, errichte das Kosaken-Hetmanat, werde Hüter des orthodoxen Glaubens, bilde Ruthenien und herrsche als Großfürstentum Kiew."
 kie_kyiv_mission_pack_BUTTON_TOOLTIP:0 "Herrsche als Großfürstentum Kiew über die gesamte Rus."
 kie_kyiv_mission_pack_BUTTON_DETAILS:0 "Eine die zersplitterte Rus unter Kiew – ergreife die Steppe mit dem Kosakenschwert!"
 kie_restore_kyiv: "Kiew wiederherstellen"
 kie_restore_kyiv_desc: "Im Jahr 1337 ist Kiew – einst die goldene Stadt der Kiewer Rus – von der mongolischen Invasion 1240 verwüstet. Die Sophienkathedrale und das Höhlenkloster zeugen noch von vergangenem Glanz. Stelle die „Mutter der Städte der Rus“ wieder als große Stadt her."
 kie_dev_kyiv: "Kiew entwickeln"
 kie_dev_kyiv_desc: "Der Schlüsselkreuzungspunkt, der die Handelswege von Wolchow und Dnjepr verbindet – entwickle Kiew zu einem Zentrum von Handel, Kultur und Politik."
 kie_secure_left_bank: "Die Kontrolle über das linke Ufer der Ukraine stärken"
 kie_secure_left_bank_desc: "Stärke die Kontrolle über das linke Ufer der Ukraine – bewahre die kulturellen Traditionen der Rus und mache mit fähiger Bürokratie dieses reiche Ackerland zu Kiews Fundament."
 kie_secure_right_bank: "Die Kontrolle über das rechte Ufer der Ukraine stärken"
 kie_secure_right_bank_desc: "Stärke die Kontrolle über das rechte Ufer der Ukraine – durch die Verbreitung ukrainischer Kultur und die Stärkung der Kronmacht mache das rechte Ufer der Ukraine zu Kiews Kerngebiet."
 kie_conquer_chernihiv: "Der Feldzug von Tschernihiw"
 kie_conquer_chernihiv_desc: "Erobere Tschernihiw, uralte Stadt eines Fürstentums der Rus, und festige die Kontrolle über das linke Ufer der Ukraine."
 kie_conquer_poltava: "Marsch auf Poltawa"
 kie_conquer_poltava_desc: "Unterwirf das Kosakenbollwerk Poltawa und öffne die Tür zur Sloboda-Ukraine."
 kie_kyiv_metropolitan: "Der Metropolitansitz Kiew"
 kie_kyiv_metropolitan_desc: "Errichte die von Konstantinopel unabhängige Metropolie Kiew als Zentrum der orthodoxen Kirche der Rus."
 kie_unite_rus: "Die Wiedervereinigung der Rus"
 kie_unite_rus_desc: "Vereine die durch die mongolische Invasion zersplitterten Fürstentümer der Rus unter Kiew wieder. Die „Mutter der Städte der Rus“ erstrahlt noch einmal als Mittelpunkt der ganzen Ukraine."
 kie_secure_volhynia: "Wolhynien sichern"
 kie_secure_volhynia_desc: "Sichere Wolhynien an der Grenze von Rus und Polen, um westlichen Einfluss zu begründen."
 kie_conquer_lutsk: "Der Feldzug von Luzk"
 kie_conquer_lutsk_desc: "Nimm die wolhynische Schlüsselstadt Luzk ein und mache sie zu einem Brückenkopf nach Westen."
 kie_conquer_galicia: "Einfall in Halytsch"
 kie_conquer_galicia_desc: "Falle in Halytsch ein – die Eroberung dieser Region begründet die vollständige Kontrolle über die Westukraine."
 kie_red_ruthenia: "Rotrutenien unterwerfen"
 kie_red_ruthenia_desc: "Unterwirf Rotrutenien – die Unterwerfung dieser Region um Lemberg vollendet die vollständige Kontrolle über die Westukraine."
 kie_conquer_lviv: "Lemberg einnehmen"
 kie_conquer_lviv_desc: "Die „Stadt des Löwen“, Lemberg – erobere diese von Fürst Danylo erbaute Handelsstadt und ergreife die Kontrolle über den westlichen Handel."
 kie_conquer_podolia: "Vorstoß nach Podolien"
 kie_conquer_podolia_desc: "Dringe nach Podolien vor – erobere diese landwirtschaftliche Region am rechten Ufer und sichere den Weg zur Schwarzmeerküste."
 kie_conquer_vinnytsia: "Die Besetzung Winnyzjas"
 kie_conquer_vinnytsia_desc: "Nimm Winnyzja ein und begründe den landwirtschaftlichen Stützpunkt des rechten Ufers der Ukraine."
 kie_conquer_polesia: "Der Feldzug von Polissja"
 kie_conquer_polesia_desc: "Erobere das Feuchtgebiet Polissja – errichte eine nördliche Verteidigungslinie."
 kie_conquer_minsk: "Minsk einnehmen"
 kie_conquer_minsk_desc: "Nimm Minsk, das Zentrum Weißrutheniens, ein, um den nördlichen Einfluss auszuweiten."
 kie_cossack_host: "Das Kosakenheer errichten"
 kie_cossack_host_desc: "Kosaken versammeln sich unter Kiews Banner – gliedere die saporoger Kosakentradition ins reguläre Heer ein und baue die beste Reiterei der Rus auf."
 kie_zaporizhzhia: "Die Saporoger Sitsch"
 kie_zaporizhzhia_desc: "Errichte die Festung der Saporoger Sitsch jenseits der Dnjepr-Stromschnellen als Stützpunkt zur Verteidigung der Steppe."
 kie_tatar_wars: "Kriege gegen die Tataren"
 kie_tatar_wars_desc: "Führe eine entscheidende Schlacht gegen die Krimtataren, die den nördlichen Schwarzmeerraum beherrschen. Nutze kosakische Reiterei, um ihnen entgegenzutreten und die ukrainische Steppe zurückzugewinnen."
 kie_black_sea_steppe: "Die Schwarzmeersteppe erobern"
 kie_black_sea_steppe_desc: "Nimm die pontische Steppe ein – das weite Grasland macht Kiew zum Herrn des nördlichen Schwarzen Meeres."
 kie_conquer_crimea: "Die Eroberung der Krim"
 kie_conquer_crimea_desc: "Erobere die Halbinsel des Krimkhanats, um die Vorherrschaft am Schwarzen Meer zu begründen. Nimm den genuesischen Handelsposten Kaffa ein."
 kie_black_sea_coast: "Eine Schwarzmeerflotte errichten"
 kie_black_sea_coast_desc: "Nutze kosakische Tschaikas (Schnellboote), die den Dnjepr zum Schwarzen Meer hinabfahren – fordere die Osmanen heraus und ergreife den Schwarzmeerhandelsweg."
 kie_kyiv_pechersk: "Das Kiewer Höhlenkloster"
 kie_kyiv_pechersk_desc: "Das Kiewer Höhlenkloster (Petschersk Lawra), 1051 gegründet – das geistliche Herz der orthodoxen Kirche der Rus. Entwickle dieses Kloster und erkläre Kiew zum orthodoxen Zentrum."
 kie_orthodox_revival: "Orthodoxe Wiedererweckung"
 kie_orthodox_revival_desc: "Baue die von der mongolischen Invasion zerstörte orthodoxe Kirche der Rus wieder auf – errichte im ganzen Land Kathedralen und belebe „Heiliges Russland“ neu."
 kie_grain_breadbasket: "Die Ukraine – Kornkammer Europas"
 kie_grain_breadbasket_desc: "Die fruchtbare Schwarzerde – die Ukraine, das reiche Ackerland, genannt „Kornkammer Europas“. Maximiere diese Produktivität und festige das Ernährungsfundament des Reiches."
 kie_trade_routes: "Kiews Handelswege"
 kie_trade_routes_desc: "Der „Weg von den Warägern zu den Griechen“, der die Ostsee mit dem Schwarzen Meer verbindet – belebe diesen uralten Handelsweg neu, der Kiews Wohlstand trug."
 kie_hetmanate: "Das Kosaken-Hetmanat"
 kie_hetmanate_desc: "Der Hetman – die Errichtung des Kosaken-Hetmanats erlaubt Kiew, als Staat mit eigenem militärisch-politischem System hervorzutreten. Nimm Bohdan Chmelnyzkyjs große Leistung von 1648 vorweg."
 kie_literacy_culture: "Bildung und Kultur fördern"
 kie_literacy_culture_desc: "Kiews geistige Tradition – als Vorreiter der Klosterschriftkultur und der Domschulen fördere die Bildungskultur."
 kie_conquer_zhytomyr: "Schytomyr entwickeln"
 kie_conquer_zhytomyr_desc: "Entwickle Schytomyr, den Schlüsselpunkt des rechten Ufers der Ukraine, mit geeigneten Bauten zu einer wichtigen Stützpunktstadt."
 kie_salt_of_galicia: "Das Salz Halytschs"
 kie_salt_of_galicia_desc: "Halytschs Steinsalzbergwerke – nimm diese Region, die „weißes Gold“ erzeugt, ein und sichere die stabile Lieferung dieses wichtigen Handelsguts."
 kie_dev_poltava: "Poltawa entwickeln"
 kie_dev_poltava_desc: "Entwickle Poltawa, Schlüsselstadt der kosakischen Ukraine am linken Ufer, zu einem östlichen Vorposten."
 kie_beyond_donets: "Jenseits des Donez"
 kie_beyond_donets_desc: "Die Sloboda-Ukraine – siedle kosakische Bauern entlang des Donez an und entwickle die östliche Steppe."
 kie_conquer_moldavia: "Einfall in die Moldau"
 kie_conquer_moldavia_desc: "Erobere die Moldau an der Schwarzmeerküste und erreiche den vollen Eintritt in den Schwarzmeerhandel."
 kie_amber_route: "Die Bernsteinstraße"
 kie_amber_route_desc: "Der uralte Bernsteinhandelsweg von der Ostsee über Luzk und Lemberg nach Süden bildet das Rückgrat des ruthenischen Handelsnetzes."
 kie_fortress_line: "Die Festungslinie"
 kie_fortress_line_desc: "Eine Festungslinie gegen Bedrohungen aus der Steppe – ein Verteidigungssystem von Saporischschja bis Podolien schützt ukrainische Bauern und Städte."
 kie_great_kyiv: "Groß-Kiew"
 kie_great_kyiv_desc: "Stelle Kiew zu der Größe wieder her, die es vor der mongolischen Invasion hatte – baue es als prachtvolle Stadt wieder auf, deren goldene Kuppeln ihren ursprünglichen Glanz zurückgewinnen."
 kie_ruthenian_culture: "Ruthenische kulturelle Identität"
 kie_ruthenian_culture_desc: "Begründe eine eigenständige ukrainisch-ruthenische Kultur – eine einzigartige Identität, in der ukrainische Sprache, Kosakenkultur und orthodoxer Glaube verschmelzen."
 kie_dev_chernihiv: "Tschernihiw entwickeln"
 kie_dev_chernihiv_desc: "Entwickle Tschernihiw zu einem Zentrum von Kultur und Handel im linken Ufer der Ukraine."
 kie_conquer_wallachia: "Vorstoß in die Walachei"
 kie_conquer_wallachia_desc: "Die Walachei entlang der Donau – erobere diese Region als Stützpunkt zum Balkan und vollende die Kontrolle über die Schwarzmeerküste."
 kie_cossack_cavalry: "Kosakenreiterei-Elite"
 kie_cossack_cavalry_desc: "Kosakenreiterei – leichte und schwere Reiterei, zu Elitetruppen erhoben. Überwältige die Tataren mit ihrer Beweglichkeit und Kampfkraft."
 kie_kyiv_academy: "Die Kiewer-Mohyla-Akademie"
 kie_kyiv_academy_desc: "Errichte die Kiewer-Mohyla-Akademie vor ihrer Gründung von 1632 – eine der ältesten Universitäten Osteuropas. Verwirkliche die geistige und kulturelle Renaissance der Rus."
 kie_conquer_krakow: "Krakau einnehmen"
 kie_conquer_krakow_desc: "Krakau, historische Hauptstadt des polnischen Königreichs – die Eroberung dieser Stadt mit dem Wawel weitet den Einfluss auf Mitteleuropa erheblich aus."
 kie_navy_dnipro: "Die Dnjepr-Flotte"
 kie_navy_dnipro_desc: "Nutze kosakische Tschaika-Segelboote vom Dnjepr zum Schwarzen Meer – die Dnjepr-Flotte bewacht den Schwarzmeerhandel."
 kie_protect_orthodoxy: "Beschützer der Orthodoxie"
 kie_protect_orthodoxy_desc: "Nach dem Fall Konstantinopels tritt Kiew als Hüter der orthodoxen Welt hervor – begründe die höchste Autorität der orthodoxen Kirche der Rus."
 kie_conquer_vilnius: "Die Besetzung Wilnas"
 kie_conquer_vilnius_desc: "Wilna, Hauptstadt des Großfürstentums Litauen – die Besetzung dieser Stadt beendet die litauische Vorherrschaft über die Rus."
 kie_western_alliance: "Bündnis mit dem Westen"
 kie_western_alliance_desc: "Baue diplomatische Beziehungen zu Polen, Ungarn und dem Heiligen Römischen Reich auf, um ein westliches Bündnis gegen Bedrohungen aus dem Osten zu begründen."
 kie_silver_route: "Der Silberweg"
 kie_silver_route_desc: "Östliches Silber fließt über Kiew entlang des Dnjepr nach Westen – begründe Kiews Stellung im internationalen Handel."
 kie_ruthenian_army: "Reform des ruthenischen Heeres"
 kie_ruthenian_army_desc: "Verbinde kosakische Tradition mit westlicher Militärtechnik – das ruthenische Heer herrscht als die beste Streitmacht Osteuropas."
 kie_conquer_warsaw: "Warschau einnehmen"
 kie_conquer_warsaw_desc: "Warschau, Polens Hauptstadt – beende den langen Kampf mit der Polnisch-Litauischen Adelsrepublik."
 kie_beeswax_honey: "Bienenwachs- und Honighandel"
 kie_beeswax_honey_desc: "Ukrainisches Bienenwachs – eine Schlüsselware, die an orthodoxe Kirchen und westeuropäische Märkte geliefert wird."
 kie_form_ruthenia: "Ruthenien bilden"
 kie_form_ruthenia_desc: "Verkünde die Bildung des Staates „Ruthenien“ – der die Ukraine, Weißrussland und Westrussland umfasst. Der Traum der Einheit der Rus seit der mongolischen Invasion wird endlich verwirklicht."
 kie_grand_principality: "Das Großfürstentum Kiew"
 kie_grand_principality_desc: "Das „Großfürstentum Kiew“ – dieser Titel bezeugt den Glanz der alten Kiewer Rus. Kiew, wo kosakische Militärmacht, orthodoxe Autorität und ruthenische Kultur verschmelzen, herrscht als Großmacht Osteuropas."
 kie_events.1.t: "Kiew erwacht – die Wiederherstellung der Mutter der Städte der Rus"
 kie_events.1.d: "Über den Hügeln entlang des Dnjepr – die goldenen Kuppeln der Sophienkathedrale glänzen am Kiewer Himmel.\n\nIm Jahr 1337 ist das Fürstentum Kiew klein, trägt aber das Gewicht der Geschichte als Herz der Kiewer Rus. „Mutter aller Städte der Rus“ – dieser Titel bestimmt Kiews Sendung.\n\nLitauen, Polen und die Tataren drängen von allen Seiten, doch die Gaben des Dnjepr, die fruchtbare Schwarzerde und der kosakische Geist stützen Kiew.\n\nDie Mönche des Höhlenklosters beten – „Erhebe dich wieder, o Rus.“ Erhöre dieses Gebet."
 kie_events.1.a: "Gewinne Kiews Ruhm zurück!"
 kie_events.20.t: "Die Verkündung des Kosaken-Hetmanats"
 kie_events.20.d: "Die saporoger Kosaken stehen in Formation unter dem Banner des Hetmans – der Großfürst von Kiew gliedert die Kosakenmacht förmlich in das Staatssystem ein und verkündet das „Kosaken-Hetmanat“. Dieses einzigartige militärisch-staatliche System wird die Zukunft Rutheniens bestimmen."
 kie_events.20.a: "Es lebe das Kosaken-Hetmanat! Es lebe die freie Ukraine!"
 kie_events.60.t: "Die Bildung Rutheniens – eine neue Macht Osteuropas"
 kie_events.60.d: "Ukraine, Weißrussland und Halytsch unter einem Banner – der geeinte ostslawische Staat „Ruthenien“ tritt als neue Großmacht Osteuropas hervor. Alle Völker der Rus versammeln sich unter Kiews goldenen Kuppeln."
 kie_events.60.a: "Es lebe Ruthenien! Es lebe Kiew!"
 kie_events.99.t: "Großfürstentum Kiew – die Wiedergeburt des Ruhms der Rus"
 kie_events.99.d: "„Großfürstentum Kiew“ – dieser Titel hallt entlang der Ufer des Dnjepr wider. Ein Reich, in dem kosakische Militärmacht, orthodoxe Autorität und ruthenische Kultur verschmelzen, herrscht als Herr Osteuropas. Die Kiewer Rus, von den Mongolen zerstört, ist in neuer Gestalt wiedergeboren – die Mutter der Städte der Rus, Kiew, erstrahlt noch einmal."
 kie_events.99.a: "Es lebe das Großfürstentum Kiew! Es lebe der Ruhm der Rus für immer!"
 STATIC_MODIFIER_NAME_kie_kyiv_dev_mod: "Goldene Stadt am Dnjepr"
 STATIC_MODIFIER_DESC_kie_kyiv_dev_mod: "Kiew ist zu einer großen Stadt entwickelt, die des Titels „Mutter der Städte der Rus“ würdig ist."
 STATIC_MODIFIER_NAME_kie_left_bank_mod: "Das linke Ufer der Ukraine gesichert"
 STATIC_MODIFIER_DESC_kie_left_bank_mod: "Das linke Ufer der Ukraine ist gesichert – der östliche Dnjepr unter kiewischer Herrschaft."
 STATIC_MODIFIER_NAME_kie_right_bank_mod: "Das rechte Ufer der Ukraine gesichert"
 STATIC_MODIFIER_DESC_kie_right_bank_mod: "Das rechte Ufer der Ukraine ist gesichert – der westliche Dnjepr mit dem Osten vereint."
 STATIC_MODIFIER_NAME_kie_poltava_mod: "Kosakenbollwerk gesichert"
 STATIC_MODIFIER_DESC_kie_poltava_mod: "Das Kosakenbollwerk Poltawa ist gesichert – die Steppengrenze ist stabilisiert."
 STATIC_MODIFIER_NAME_kie_metropolitan_mod: "Herz der Orthodoxie der Rus"
 STATIC_MODIFIER_DESC_kie_metropolitan_mod: "Kiews Metropolitansitz ist als Herz der Orthodoxie der Rus wiederhergestellt."
 STATIC_MODIFIER_NAME_kie_volhynia_mod: "Kornkammer Wolhyniens"
 STATIC_MODIFIER_DESC_kie_volhynia_mod: "Wolhyniens fruchtbare Ebenen werden zur Kornkammer des kiewischen Staates."
 STATIC_MODIFIER_NAME_kie_lutsk_mod: "Schlüssel des westlichen Rus"
 STATIC_MODIFIER_DESC_kie_lutsk_mod: "Luzk – der Schlüssel des westlichen Rus – ist gesichert und öffnet den Pfad nach Halytsch."
 STATIC_MODIFIER_NAME_kie_galicia_mod: "Einfall in Halytsch"
 STATIC_MODIFIER_DESC_kie_galicia_mod: "Halytsch ist überfallen, und das Erbe von Halytsch-Wolhynien ist wiederbelebt."
 STATIC_MODIFIER_NAME_kie_red_ruthenia_mod: "Rotrutenien unterworfen"
 STATIC_MODIFIER_DESC_kie_red_ruthenia_mod: "Rotrutenien ist unterworfen und mit der Ukraine vereint."
 STATIC_MODIFIER_NAME_kie_lviv_mod: "Der Wohlstand der Löwenstadt"
 STATIC_MODIFIER_DESC_kie_lviv_mod: "Lemberg – die Löwenstadt – blüht als Tor des westlichen Handels."
 STATIC_MODIFIER_NAME_kie_podolia_mod: "Schwarzerde-Ackerland"
 STATIC_MODIFIER_DESC_kie_podolia_mod: "Podoliens Schwarzerde-Ackerland ist gesichert – landwirtschaftlicher Reichtum fließt nach Kiew."
 STATIC_MODIFIER_NAME_kie_vinnytsia_mod: "Bollwerk des rechten Ufers"
 STATIC_MODIFIER_DESC_kie_vinnytsia_mod: "Winnyzja dient als Bollwerk des rechten Ufers der Ukraine."
 STATIC_MODIFIER_NAME_kie_polesia_mod: "Sumpfland-Verteidigungswall"
 STATIC_MODIFIER_DESC_kie_polesia_mod: "Die Sümpfe Polissjas bilden einen natürlichen Verteidigungswall gegen Eindringlinge aus dem Norden."
 STATIC_MODIFIER_NAME_kie_minsk_mod: "Herz Weißrutheniens"
 STATIC_MODIFIER_DESC_kie_minsk_mod: "Minsk – Herz Weißrutheniens – fällt unter kiewische Kontrolle."
 STATIC_MODIFIER_NAME_kie_cossack_mod: "Das Kosakenschwert"
 STATIC_MODIFIER_DESC_kie_cossack_mod: "Das Kosakenschwert schmiedet Kiews Streitmacht zu einem elitären Steppenheer."
 STATIC_MODIFIER_NAME_kie_zaporizhzhia_mod: "Freiheit jenseits der Stromschnellen"
 STATIC_MODIFIER_DESC_kie_zaporizhzhia_mod: "Jenseits der Dnjepr-Stromschnellen weihen die saporoger Kosaken ihre Schwerter Kiew."
 STATIC_MODIFIER_NAME_kie_tatar_wars_mod: "Der Kampf gegen die Tataren"
 STATIC_MODIFIER_DESC_kie_tatar_wars_mod: "Feldzüge gegen die Tataren härten Kiews Reiterei zu furchtlosen Steppenkriegern."
 STATIC_MODIFIER_NAME_kie_steppe_mod: "Eroberer der Steppe"
 STATIC_MODIFIER_DESC_kie_steppe_mod: "Die Steppe ist erobert – Kiew herrscht als Herr der pontischen Graslande."
 STATIC_MODIFIER_NAME_kie_crimea_mod: "Vorherrschaft über das Schwarze Meer"
 STATIC_MODIFIER_DESC_kie_crimea_mod: "Die Vorherrschaft über das Schwarze Meer ist erreicht – die Krim unter kiewischer Herrschaft."
 STATIC_MODIFIER_NAME_kie_black_sea_mod: "Der Weg zum Schwarzen Meer"
 STATIC_MODIFIER_DESC_kie_black_sea_mod: "Der Weg zum Schwarzen Meer ist geöffnet – Kiew gewinnt Zugang zum Mittelmeerhandel."
 STATIC_MODIFIER_NAME_kie_lavra_mod: "Das Höhlenkloster"
 STATIC_MODIFIER_DESC_kie_lavra_mod: "Das Kiewer Höhlenkloster ist als Seele der Orthodoxie der Rus wiederhergestellt."
 STATIC_MODIFIER_NAME_kie_orthodox_mod: "Ruthenische orthodoxe Wiedererweckung"
 STATIC_MODIFIER_DESC_kie_orthodox_mod: "Die ruthenische Orthodoxie ist wiederbelebt – Kiew nimmt erneut seine Rolle als Hüter des Glaubens wahr."
 STATIC_MODIFIER_NAME_kie_grain_mod: "Kornkammer Europas"
 STATIC_MODIFIER_DESC_kie_grain_mod: "Die fruchtbare Schwarzerde der Ukraine macht Kiew zur Kornkammer Europas."
 STATIC_MODIFIER_NAME_kie_trade_mod: "Dnjepr-Handelsweg"
 STATIC_MODIFIER_DESC_kie_trade_mod: "Der Dnjepr-Handelsweg von der Ostsee zum Schwarzen Meer fließt durch kiewische Hände."
 STATIC_MODIFIER_NAME_kie_salt_mod: "Weißes Gold Halytschs"
 STATIC_MODIFIER_DESC_kie_salt_mod: "Das weiße Gold Halytschs – Salz – ist zum Vorteil des Reiches monopolisiert."
 STATIC_MODIFIER_NAME_kie_poltava_city_mod: "Poltawa entwickelt"
 STATIC_MODIFIER_DESC_kie_poltava_city_mod: "Poltawa ist zu einer blühenden Stadt der ukrainischen Steppe entwickelt."
 STATIC_MODIFIER_NAME_kie_sloboda_mod: "Die freie Ukraine erschlossen"
 STATIC_MODIFIER_DESC_kie_sloboda_mod: "Freie ukrainische Siedlungen erschließen die Ostgrenze unter kiewischem Schutz."
 STATIC_MODIFIER_NAME_kie_moldavia_mod: "Die Moldau erobert"
 STATIC_MODIFIER_DESC_kie_moldavia_mod: "Der Wind des Schwarzen Meeres weht über die Festungen der Moldau, und die Häfen der Küste stehen nun unter Kiews Banner."
 STATIC_MODIFIER_NAME_kie_amber_mod: "Die Bernsteinstraße"
 STATIC_MODIFIER_DESC_kie_amber_mod: "Die Bernsteinstraße von der Ostsee zum Schwarzen Meer fließt durch Kiew."
 STATIC_MODIFIER_NAME_kie_fortress_mod: "Steppenverteidigungslinie"
 STATIC_MODIFIER_DESC_kie_fortress_mod: "Eine Kette von Steppenfestungen verteidigt die Südgrenze gegen Tatareneinfälle."
 STATIC_MODIFIER_NAME_kie_great_kyiv_mod: "Mutter der Städte der Rus"
 STATIC_MODIFIER_DESC_kie_great_kyiv_mod: "Kiew gewinnt seinen Titel als Mutter der Städte der Rus zurück – die ewige Hauptstadt der Ukraine."
 STATIC_MODIFIER_NAME_kie_culture_mod: "Ruthenische kulturelle Blüte"
 STATIC_MODIFIER_DESC_kie_culture_mod: "Die ruthenische Kultur blüht – Kiew wird zu einem Leuchtfeuer der Gelehrsamkeit und Kunst."
 STATIC_MODIFIER_NAME_kie_chernihiv_city_mod: "Tschernihiw blüht"
 STATIC_MODIFIER_DESC_kie_chernihiv_city_mod: "Tschernihiw blüht als führende Stadt der Nordostukraine."
 STATIC_MODIFIER_NAME_kie_wallachia_mod: "Die Walachei erobert"
 STATIC_MODIFIER_DESC_kie_wallachia_mod: "Die Walachei ist erobert und unter kiewische Oberhoheit gebracht."
 STATIC_MODIFIER_NAME_kie_cavalry_mod: "Kosakenreiterei-Elite"
 STATIC_MODIFIER_DESC_kie_cavalry_mod: "Kosakenreiterei ist zu einer Elitestreitmacht geschmiedet – der Stolz kiewischer Waffen."
 STATIC_MODIFIER_NAME_kie_academy_mod: "Hallen der Gelehrsamkeit der Rus"
 STATIC_MODIFIER_DESC_kie_academy_mod: "Die Kiewer-Mohyla-Akademie öffnet – die Hallen der Gelehrsamkeit der Rus erstrahlen über Osteuropa."
 STATIC_MODIFIER_NAME_kie_krakow_mod: "Stadt der Jagiellonen"
 STATIC_MODIFIER_DESC_kie_krakow_mod: "Das Banner Kiews weht vom Turm des Wawel, und die Stadt der Jagiellonen hört den Namen ihres neuen Herrn."
 STATIC_MODIFIER_NAME_kie_navy_mod: "Die Dnjepr-Flotte"
 STATIC_MODIFIER_DESC_kie_navy_mod: "Die Dnjepr-Flotte ist erbaut – kiewische Seemacht tritt auf dem Schwarzen Meer hervor."
 STATIC_MODIFIER_NAME_kie_protector_mod: "Beschützer der Orthodoxie"
 STATIC_MODIFIER_DESC_kie_protector_mod: "Kiew wird als Beschützer der orthodoxen Christen ganz Osteuropas anerkannt."
 STATIC_MODIFIER_NAME_kie_vilnius_mod: "Das Ende der litauischen Vorherrschaft"
 STATIC_MODIFIER_DESC_kie_vilnius_mod: "Die litauische Vorherrschaft über die ruthenischen Lande ist beendet – Kiew gewinnt den Osten zurück."
 STATIC_MODIFIER_NAME_kie_diplomacy_mod: "Bande zum Westen"
 STATIC_MODIFIER_DESC_kie_diplomacy_mod: "Die Gesandten des Großfürsten von Kiew stehen in den Hallen westlicher Höfe, und sein Name ist nun in die Bücher fremder Schreiber eingetragen."
 STATIC_MODIFIER_NAME_kie_silver_route_mod: "Der Silberweg"
 STATIC_MODIFIER_DESC_kie_silver_route_mod: "Der Silberweg aus dem Westen fließt in die Kassen Kiews."
 STATIC_MODIFIER_NAME_kie_ruthenian_army_mod: "Die Geburt des ruthenischen Heeres"
 STATIC_MODIFIER_DESC_kie_ruthenian_army_mod: "Das ruthenische Heer ist geboren – eine disziplinierte Streitmacht, die kosakische und adlige Reiterei verbindet."
 STATIC_MODIFIER_NAME_kie_warsaw_mod: "Befriedung Polens"
 STATIC_MODIFIER_DESC_kie_warsaw_mod: "Polen ist befriedet – Warschau erkennt Kiews Vorherrschaft an."
 STATIC_MODIFIER_NAME_kie_beeswax_mod: "Bienenwachs und Honig"
 STATIC_MODIFIER_DESC_kie_beeswax_mod: "Bienenwachs und Honig aus ukrainischen Wäldern bereichern den kiewischen Handel."
 STATIC_MODIFIER_NAME_kie_zhytomyr_mod: "Handelsdrehscheibe Schytomyr"
 STATIC_MODIFIER_DESC_kie_zhytomyr_mod: "Schytomyr entwickelt sich zu einer blühenden Handelsdrehscheibe des rechten Ufers der Ukraine."
 STATIC_MODIFIER_NAME_kie_grand_principality_mod: "Großfürstentum Kiew"
 STATIC_MODIFIER_DESC_kie_grand_principality_mod: "Das Großfürstentum Kiew ist ausgerufen – das mächtigste Reich Osteuropas."
 STATIC_MODIFIER_NAME_kie_literacy_mod: "Gelehrsamkeit in Kiew"
 STATIC_MODIFIER_DESC_kie_literacy_mod: "Handschriften werden aus dem Skriptorium der Petschersk Lawra zu den Schulen getragen, und die Kinder Kiews lernen ihre Buchstaben."
 kie_conquer_smolensk: "Der Feldzug von Smolensk"
 kie_conquer_smolensk_desc: "Nimm Smolensk ein, den „Schlüssel Russlands“ und Kreuzungspunkt des Ost-West-Verkehrs – begründe Einfluss auf Moskau und Polen. Nutze Tschernihiw als Stützpunkt, um die gesamte Region Smolensk zu beherrschen."
 STATIC_MODIFIER_NAME_kie_smolensk_mod: "Smolensk – Kreuzungspunkt des Ost-West-Handels"
 STATIC_MODIFIER_DESC_kie_smolensk_mod: "Smolensk ist als wichtiger Ost-West-Knotenpunkt gesichert."
 STATIC_MODIFIER_NAME_kie_chernihiv_mod: "Tschernihiw – Bollwerk des linken Ufers"
 STATIC_MODIFIER_DESC_kie_chernihiv_mod: "Der Steuereintreiber Kiews, auf dem Markt von Tschernihiw stehend, öffnet die Bücher des Getreides vom linken Ufer des Dnjepr."
 kie_build_sevastopol: "Der Bau des Marinestützpunkts Sewastopol"
 kie_build_sevastopol_desc: "Baue einen ruthenischen Marinestützpunkt im natürlichen Hafen von Theodoro – dieses Marinebollwerk, das das Schwarze Meer beherrscht, wird zum Heimathafen der Kosakenflotte."
 kie_build_odesa: "Der Bau des Hafens Odessa"
 kie_build_odesa_desc: "Baue Rutheniens größten Handelshafen an der Küste von Chadschibei – dieser Hafen, der den Schwarzmeerhandel mit dem Mittelmeer verbindet, wird zur Lebensader des ruthenischen Handels."
 STATIC_MODIFIER_NAME_kie_sevastopol_mod: "Marinestützpunkt Sewastopol"
 STATIC_MODIFIER_DESC_kie_sevastopol_mod: "Der Marinestützpunkt Sewastopol, der das Schwarze Meer beherrscht, ist als Marinebollwerk Rutheniens errichtet."
 STATIC_MODIFIER_NAME_kie_odesa_mod: "Handelshafen Odessa"
 STATIC_MODIFIER_DESC_kie_odesa_mod: "Odessa, Zentrum des Schwarzmeerhandels, ist erbaut – Rutheniens Seehandel blüht."
 STATIC_MODIFIER_NAME_kie_unite_rus_mod: "Das Erbe der Wiedervereinigung"
 STATIC_MODIFIER_DESC_kie_unite_rus_mod: "Die Fürsten der Rus versammeln sich am Hof eines einzigen Großfürsten, und die Beamten Kiews senden Befehle in derselben Form an die Schreiber jedes Landes."
