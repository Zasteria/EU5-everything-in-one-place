l_german:
 boh_crown_of_bohemia_mission_pack: "Der Glanz der böhmischen Krone"
 boh_crown_of_bohemia_mission_pack_DESCRIPTION:0 "Im Jahr 1337 ist Böhmen ein mächtiges mitteleuropäisches Königreich unter Johann I. (dem Blinden König) aus dem Haus Luxemburg. Durchlebe die bewegte Geschichte Böhmens – Kaiser Karl IV., die Gründung der Karls-Universität, die Goldene Bulle – und von der Hinrichtung des Jan Hus bis zur Wagenburgtaktik der Hussitenkriege. Einige Mähren, Schlesien und die Slowakei, fordere die Habsburger um die Vorherrschaft im Heiligen Römischen Reich heraus und gründe das Böhmische Commonwealth."
 boh_crown_of_bohemia_mission_pack_CRITERIA_DESCRIPTION:0 "Erringe als Böhmen die Vorherrschaft im Reich, kulturelle Blüte und Eroberungen im Süden, um das Böhmische Commonwealth zu gründen."
 boh_crown_of_bohemia_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um das Böhmische Commonwealth zu gründen."
 boh_crown_of_bohemia_mission_pack_BUTTON_DETAILS:0 "Trage den Willen des Blinden Königs weiter – vom Goldenen Prag zu einem mitteleuropäischen Reich!"
 boh_crown_of_jan: "Die Krone des Blinden Königs"
 boh_crown_of_jan_desc: "1337 – Johann I., der Blinde König, herrscht über Böhmen als einer der mächtigsten Herrscher Mitteleuropas. „Ich kann nicht sehen, aber ich kann noch kämpfen“ – der Geist des Blinden Königs ist Böhmens Stolz. Vor seinem Heldentod in der Schlacht bei Crécy 1346 erhob er das Haus Luxemburg zu einer der größten Dynastien Europas. Errichte Prag als königliche Hauptstadt und festige die Grundlagen des Königreichs."
 boh_lion_of_empire: "Löwe des Reiches"
 boh_lion_of_empire_desc: "Der König von Böhmen ist der mächtigste Kurfürst des Heiligen Römischen Reiches. Jeder Fürst im Reich sollte sich vor Böhmens Schwert beugen. Begründe durch militärische Stärke und Ansehen die Stellung des „Löwen des Reiches“."
 boh_challenge_habsburg: "Die Habsburger herausfordern"
 boh_challenge_habsburg_desc: "Das Haus Habsburg – Böhmens größter Rivale um die Herrschaft über Mitteleuropa – plant von seiner österreichischen Basis aus die Vorherrschaft im Reich. Böhmen muss seinen Widerstand deutlich machen."
 boh_saxony_ambitions: "Ambitionen auf Sachsen"
 boh_saxony_ambitions_desc: "Sachsen mit Dresden im Herzen ist ein wichtiges Zentrum von Handel und Kultur an der Elbe. Bringe das sächsische Kurfürstentum unter Kontrolle und weite Böhmens Einfluss im Reich weiter aus."
 boh_conquer_austria: "Österreich erobern"
 boh_conquer_austria_desc: "Wien fällt, und das österreichische Kernland der Habsburger ist zerschmettert. Der Hochmut der „Habsburger, in deren Reich die Sonne nie untergeht“, ist endlich gebrochen. Böhmen ist der wahre Herr Mitteleuropas."
 boh_dominate_hre: "Das Heilige Römische Reich beherrschen"
 boh_dominate_hre_desc: "Böhmen beherrscht das Heilige Römische Reich. Über die 1355 von Karl IV. verwirklichte Kaiserwürde hinaus herrscht Böhmen nun als unbestrittener Führer des gesamten Reiches."
 boh_develop_prague: "Prag entwickeln"
 boh_develop_prague_desc: "Prag, die „Stadt der hundert Türme“ – an beiden Ufern der Moldau ausgebreitet, trat diese Stadt im 14. Jahrhundert als größte Stadt Mitteleuropas in ihr goldenes Zeitalter ein. Prager Burg, Karlsbrücke und Altstädter Ring verkünden der Welt den Glanz des böhmischen Königreichs."
 boh_charles_university: "Die Karls-Universität"
 boh_charles_university_desc: "1348 gründete Karl IV. in Prag die Karls-Universität – die erste Universität Mitteleuropas. Diese Stätte der Theologie, des Rechts, der Medizin und der Philosophie brachte große Reformer wie Jan Hus hervor. Errichte nach 1348 in Prag eine Universität, um diesen historischen Meilenstein zu erreichen."
 boh_golden_bull: "Die Goldene Bulle"
 boh_golden_bull_desc: "Die von Karl IV. verkündete Goldene Bulle von 1356 kodifizierte das Kurfürstensystem des Heiligen Römischen Reiches und begründete den König von Böhmen als wichtigsten Kurfürsten des Reiches. Mache Böhmens rechtliche und politische Stellung unantastbar."
 boh_bohemian_glass: "Böhmisches Glas"
 boh_bohemian_glass_desc: "Geboren aus Böhmens kristallklarem Wasser und reichem Quarzsand, ist böhmisches Glas an den Höfen ganz Europas wegen seiner erlesenen Schönheit begehrt. Entwickle das Gewerbe, sodass „böhmisches Kristall“ zum Inbegriff feinster europäischer Qualität wird."
 boh_silver_mines: "Die Silberbergwerke von Kuttenberg"
 boh_silver_mines_desc: "Die Silberbergwerke von Kuttenberg (Kutná Hora) waren im 14. Jahrhundert die ergiebigsten Europas. Dieses Silber, als Prager Groschen ausgeprägt, umlief in ganz Mitteleuropa und trug Böhmens wirtschaftliches goldenes Zeitalter."
 boh_develop_moravia: "Mähren entwickeln"
 boh_develop_moravia_desc: "Mähren mit Brünn und Olmütz im Mittelpunkt ist ein wichtiger Teil der böhmischen Kronländer. Entwickle diese fruchtbare Agrarregion zum zweiten kulturellen und administrativen Zentrum des böhmischen Reiches."
 boh_internal_prosperity: "Innerer Wohlstand"
 boh_internal_prosperity_desc: "Böhmisches Glas, Kuttenberger Silber, Prager Handelsmärkte – zusammen machen sie Böhmen zur größten Wirtschaftsmacht Mitteleuropas."
 boh_jan_hus_question: "Die Frage des Jan Hus"
 boh_suppress_heresy: "Die Ketzerei unterdrücken"
 boh_suppress_heresy_desc: "Böhmen bewahrt seine Treue zur römischen Kirche. Indem es die Hussiten als Ketzer unterdrückt und den katholischen Glauben zum Eckpfeiler des Staates macht, wird ein festes Bündnis mit dem Papst geschmiedet."
 boh_crusade_against_hussites: "Kreuzzug gegen die Hussiten"
 boh_crusade_against_hussites_desc: "Der Papst hat einen Kreuzzug gegen die Hussiten ausgerufen. Indem es den Angriff auf die Ketzerei anführt, begründet Böhmen seinen Ruf als Beschützer des katholischen Mitteleuropas."
 boh_papal_champion: "Vorkämpfer des Papstes"
 boh_papal_champion_desc: "Tiefes Vertrauen zum Papsttum und standhafter katholischer Glaube – Böhmen wird als stärkster Hüter des katholischen Mitteleuropas anerkannt."
 boh_hussite_reformation: "Hussitische Reformation"
 boh_hussite_reformation_desc: "„Obwohl verbrannt, leuchtet die Wahrheit aus den Flammen“ – der Geist des Jan Hus schlägt in Böhmen Wurzeln. Die Utraquisten (Hussiten), versinnbildlicht durch den Kelch (kalich), werden zum Glauben der Nation und erringen religiöse Unabhängigkeit von Rom."
 boh_wagenburg: "Boží Bojovníci (Gottes Krieger)"
 boh_wagenburg_desc: "Die von Jan Žižka ersonnene Wagenburgtaktik – befestigte Wagen zu einer Verteidigungsformation zu verbinden – schlug wiederholt schwere Kreuzfahrerreiterei. Böhmens militärisches Genie erblüht."
 boh_king_of_heretics: "König der Ketzer"
 boh_king_of_heretics_desc: "Georg von Podiebrad regierte als „Böhmens Ketzerkönig“ trotz der Exkommunikation durch den Papst. Bewahre das Ansehen inmitten europäischer diplomatischer Isolation und zeige der Welt die Rechtmäßigkeit des hussitischen Staates."
 boh_hungarian_succession: "Die ungarische Erbfolge"
 boh_hungarian_succession_desc: "Böhmen und Ungarn bildeten durch die Luxemburger und die Jagiellonen mehrfach Personalunionen. Bringe das wohlhabende Donaukönigreich um Buda unter böhmische Oberherrschaft und festige die mitteleuropäische Vorherrschaft."
 boh_control_slovakia: "Die Slowakei beherrschen"
 boh_control_slovakia_desc: "Die Slowakei ist die Urheimat des Großmährischen Reiches, in der die tschechischen und slowakischen Brudervölker leben. Die Sicherung dieses Landes stärkt Böhmens slawisches Fundament."
 boh_conquer_transylvania: "Siebenbürgen erobern"
 boh_conquer_transylvania_desc: "Siebenbürgen – „das Land jenseits des Waldes“ –, wo Rumänen, Ungarn und Deutsche einander durchdringen, dient als vorgeschobenes Bollwerk der Christenheit gegen das Osmanische Reich. Seine Beherrschung öffnet den Weg auf den Balkan."
 boh_nicopolis_revenge: "Rache für Nikopolis"
 boh_nicopolis_revenge_desc: "In der Schlacht bei Nikopolis 1396 erlitt das unter Sigismund von Böhmen geführte Kreuzfahrerheer eine verheerende Niederlage gegen das Osmanische Reich. Die Zeit ist gekommen, diese Demütigung zu rächen – erobere Nikopolis zurück und vertreibe die Osmanen vom Balkan."
 boh_defend_against_turks: "Bollwerk gegen die Türken"
 boh_defend_against_turks_desc: "Das Osmanische Reich fegt über den Balkan und nähert sich den Toren Mitteleuropas. Verstärke Siebenbürgens Befestigungen und werde mit einem mächtigen Heer zum Schild der Christenheit. Böhmen ist das „Antemurale Christianitatis“ – das Bollwerk der christlichen Zivilisation."
 boh_push_into_balkans: "Vorstoß auf den Balkan"
 boh_push_into_balkans_desc: "Räche Nikopolis und rücke als Befreier der Christenheit nach Süden vor. Slawen, Griechen und Bulgaren des Balkans werden unter dem böhmischen Banner befreit."
 boh_secure_silesia: "Schlesien sichern"
 boh_secure_silesia_desc: "Ganz Schlesien fällt unter böhmische Direktherrschaft. Reich an Eisen und Kohle, wird dieses Land zum Kern des böhmischen Industriereiches."
 boh_polish_ambitions: "Polnische Ambitionen"
 boh_polish_ambitions_desc: "Nimm Krakau ein und begründe Böhmens Verhältnis zum polnischen Königreich. Das Erbe der Přemysliden-Dynastie gehört Böhmen – Polen soll ein Nachbar unter böhmischer Oberherrschaft werden."
 boh_conquer_poland: "Polen erobern"
 boh_conquer_poland_desc: "Die weiten Ebenen des polnischen Gebiets fallen unter böhmische Kontrolle. Von der Weichsel bis zur Oder sind die slawischen Lande unter dem Banner des böhmischen Königs vereint."
 boh_baltic_access: "Zugang zur Ostsee"
 boh_baltic_access_desc: "Mit der Einnahme Danzigs gewinnt Böhmen unmittelbaren Zugang zur Ostsee. Als einst landumschlossene Nation nimmt Böhmen nun auch am nördlichen Handel teil."
 boh_bohemian_diet: "Der Böhmische Landtag"
 boh_bohemian_diet_desc: "Die böhmische Ständeversammlung (Zemský Sněm) – in der Adlige, Geistliche und Bürger mitwirken – ist eine politische Einrichtung. Ihre Stärkung legt den Grundstein zu einer zentralisierten Reichsverwaltung."
 boh_absolute_monarchy: "Absolute Monarchie"
 boh_absolute_monarchy_desc: "In Böhmen ist die absolute Monarchie errichtet. Durch die Beschränkung der Adelsprivilegien und die volle Festigung der Königsmacht wandelt sich Böhmen zu einem modernen Zentralstaat."
 boh_great_power_army: "Das Heer einer Großmacht"
 boh_great_power_army_desc: "Wagenburgtaktik, das Schwarze Heer, Elitefußvolk – Böhmens militärische Neuerungen bringen Mitteleuropas stärkstes Heer hervor. Begründe Böhmens militärische Überlegenheit durch hohe Heerestradition und ein großes stehendes Heer."
 boh_dev_brno: "Brünn entwickeln"
 boh_dev_brno_desc: "Brünn, die Hauptstadt Mährens, blüht als Industrie- und Handelsstadt am Kreuzungspunkt der Handelswege."
 boh_dev_wroclaw: "Breslau entwickeln"
 boh_dev_wroclaw_desc: "Breslau (Wrocław) an der Oder ist das Herz Schlesiens. Seine multikulturelle Handelstradition mehrt den Reichtum des böhmischen Reiches."
 boh_amber_road: "Die Bernsteinstraße"
 boh_amber_road_desc: "Die uralte Bernsteinstraße, die sich von der Ostsee bis zum Mittelmeer erstreckt, durchquert Böhmen. Durch die Kontrolle dieses Handelswegs wird Böhmen zur Drehscheibe des Nord-Süd-Handels."
 boh_dev_pest: "Pest entwickeln"
 boh_dev_pest_desc: "Pest, das Buda gegenüber an der Donau liegt, ist Ungarns größte Handelsstadt. Entwickle es zum wirtschaftlichen Zentrum des südlichen böhmischen Reiches."
 boh_renaissance_court: "Der Renaissancehof"
 boh_renaissance_court_desc: "Karls IV. Prag war das Zentrum der mitteleuropäischen Renaissance, in dem italienische, französische und römisch-deutsche Kulturen zusammenkamen. Künstler, Gelehrte und Baumeister versammeln sich am Prager Hof, während ein goldenes Zeitalter der Kultur erblüht."
 boh_great_moravia_restored: "Großmähren wiederhergestellt"
 boh_great_moravia_restored_desc: "Zum ersten Mal seit dem Großmährischen Reich des 9. Jahrhunderts sind ganz Böhmen, Mähren und Schlesien vereint. Der Traum Svatopluks und Rastislavs ist in der Neuzeit wiedergeboren, und Böhmen erstrahlt als Mittelpunkt der slawischen Zivilisation."
 boh_central_european_power: "Mitteleuropäische Großmacht"
 boh_central_european_power_desc: "Die drei Säulen – das wiederhergestellte Großmähren, innerer Wohlstand und absolute Monarchie – fügen sich, und Böhmen herrscht als Mitteleuropas größte Macht. Mit über 500 Orten, einem Einkommen von über 500 und einem Ansehen von über 80 – ergreife diesen Ruhm."
 boh_bohemian_commonwealth: "Das Böhmische Commonwealth"
 boh_bohemian_commonwealth_desc: "Prag, Wien, Berlin, Krakau, Buda – die fünf großen Städte Mitteleuropas unter dem böhmischen Banner vereint. Die Krone, die Johann der Blinde 1337 säte, erstrahlt nun als Kaiserkrone. „Bohemia non perit“ – Böhmen geht nicht unter – diese Worte sind für immer in die Geschichte eingeschrieben."
 boh_krecy_legacy: "Das Erbe von Crécy"
 boh_krecy_legacy_desc: "In der Schlacht bei Crécy 1346 stand der Blinde König Johann I. trotz seiner Blindheit auf dem Schlachtfeld und starb einen Heldentod. „Ich kann nicht sehen, aber ich kann noch kämpfen“ – dieser Geist ist in Böhmens Kriegerseele eingegraben."
 boh_styria_carinthia: "Steiermark und Kärnten"
 boh_styria_carinthia_desc: "Die Unterwerfung der Steiermark und Kärntens am Fuß der Alpen begründet die Südgrenzen des böhmischen Reiches. Diese rohstoffreichen und fruchtbaren Lande tragen den Wohlstand des Reiches."
 boh_kutna_hora_mint: "Die Münze von Kuttenberg"
 boh_kutna_hora_mint_desc: "Der Prager Groschen – aus Kuttenberger Silber geprägt – war im 14. Jahrhundert die vertrauenswürdigste Währung Mitteleuropas. Begründe Böhmens Währungsherrschaft durch großangelegten Silberbergbau."
 boh_gothic_architecture: "Stadt der gotischen Baukunst"
 boh_gothic_architecture_desc: "Veitsdom, Karlsbrücke, Altstädter Ring – die prachtvolle Gotik, die Karl IV. erbaute, verwandelte Prag in die „Goldene Stadt“. Fördere Prags Entwicklung und nimm diesen Glanz der Baukunst vorweg."
 boh_bohemian_trade_network: "Das böhmische Handelsnetz"
 boh_bohemian_trade_network_desc: "Ein auf Prag zentriertes Handelsnetz, das Wien, Breslau, Krakau und Nürnberg verbindet, trägt Böhmens Vorherrschaft im Handel."
 boh_compactata: "Die Prager Kompaktaten"
 boh_compactata_desc: "Die Kompaktaten von 1436 ließen die katholische Kirche als Zugeständnis die utraquistische Kelchkommunion anerkennen. Der gemäßigte utraquistische Weg bringt Böhmen religiöse Stabilität."
 boh_utraquist_church: "Die utraquistische Kirche"
 boh_utraquist_church_desc: "„Sub utraque specie“ (unter beiderlei Gestalt) – die utraquistische Kirche, die den Kommunikanten Brot und Wein reicht, ist als Böhmens Staatsreligion begründet."
 boh_protestant_alliance: "Das protestantische Bündnis"
 boh_protestant_alliance_desc: "Böhmens hussitische Tradition wird zum Vorläufer der protestantischen Reform. Durch das Bündnis mit Lutheranern und Calvinisten wird Böhmen als Säule der protestantischen Welt anerkannt."
 boh_black_army: "Das Schwarze Heer"
 boh_black_army_desc: "Das von König Matthias Corvinus aufgestellte Schwarze Heer – eines der ersten stehenden Berufsheere des mittelalterlichen Europas. Kämpft diese Elitetruppe unter dem böhmischen Banner, kann ihr nichts in Mitteleuropa standhalten."
 boh_dev_berlin: "Berlin entwickeln"
 boh_dev_berlin_desc: "Die kleine brandenburgische Stadt Berlin wächst als nördlicher Verwaltungsmittelpunkt des böhmischen Reiches."
 boh_dev_konigsberg: "Königsberg entwickeln"
 boh_dev_konigsberg_desc: "Königsberg (die Burg des Königs), von Ottokar II. erbaut, kehrt zu Böhmen zurück und wird zum Drehkreuz des Ostseehandels."
 boh_great_king: "Der Große König"
 boh_great_king_desc: "Hohes Ansehen, große Legitimität, reiches Einkommen – der Name des Königs von Böhmen als einer der größten Herrscher der mitteleuropäischen Geschichte hallt durch ganz Europa und übertrifft selbst den Ruhm Karls IV."
 boh_dev_olomouc: "Olmütz erblüht"
 boh_dev_olomouc_desc: "Olmütz, Mährens uralte Stadt der Gelehrsamkeit und Bischofssitz, strahlt als Zentrum der nördlichen Renaissancekultur."
 boh_upper_austria: "Oberösterreich"
 boh_upper_austria_desc: "Oberösterreich an der oberen Donau ist in das böhmische Reich eingegliedert und begründet ein Fundament für weiteres Vordringen nach Süden."
 boh_carpathian_defense: "Karpatenverteidigung"
 boh_carpathian_defense_desc: "Ein Festungsnetz entlang der Karpaten begründet eine feste östliche Verteidigungslinie für das böhmische Reich – ein Schild gegen das Osmanische Reich, die Tataren und andere Bedrohungen aus dem Osten."
 boh_events.20.t: "Die Habsburger zerschlagen – böhmische Vorherrschaft"
 boh_events.20.d: "Wien fällt, und der Stolz der Habsburger ist zerschmettert. „Die seit Rudolf andauernde habsburgische Vorherrschaft über Mitteleuropa ist beendet“ – diese Worte hallen durch den Prager Hof. Der König von Böhmen ist nun der wahre Herr Mitteleuropas. Historiker werden später schreiben: „Das Haus Luxemburg war der wahre Erbe des Reiches.“"
 boh_events.20.a: "Es lebe Böhmen! Das Zeitalter der Habsburger ist vorüber!"
 boh_events.50.t: "Großmähren wiederhergestellt"
 boh_events.50.d: "Böhmen, Mähren und Schlesien sind vereint. Vierhundert Jahre nach dem Zusammenbruch des von Svatopluk erbauten Großmährischen Reiches ist dieses Erbe in der Neuzeit wiedergeboren. Am Prager Hof verkündet der König von Böhmen den Titel „Rex Slavorum“ – König der Slawen."
 boh_events.50.a: "Es lebe Großmähren! Ruhm der slawischen Einheit!"
 boh_events.99.t: "Die Geburt des Böhmischen Commonwealth"
 boh_events.99.d: "Prag, Wien, Berlin, Krakau, Buda – die fünf großen Städte Mitteleuropas unter dem böhmischen Banner vereint. Die Krone, die Johann der Blinde 1337 säte, erstrahlt nun als Kaiserkrone. Während die Türme gotischer Kathedralen über dem Prager Himmel aufragen, sind die Worte „Bohemia non perit“ – Böhmen geht nicht unter – für immer in die Geschichte eingeschrieben."
 boh_events.99.a: "Es lebe das Böhmische Commonwealth! Möge der Herr Mitteleuropas ewig bestehen!"
 STATIC_MODIFIER_NAME_boh_blind_king_mod: "Erbe des Blinden Königs"
 STATIC_MODIFIER_DESC_boh_blind_king_mod: "„Ich kann nicht sehen, aber ich kann noch kämpfen“ – der Geist Johanns I., des Blinden Königs, legte den Grundstein des böhmischen Königreichs."
 STATIC_MODIFIER_NAME_boh_imperial_power_mod: "Löwe des Reiches"
 STATIC_MODIFIER_DESC_boh_imperial_power_mod: "Böhmen tritt als mächtigster Kurfürst des Reiches hervor."
 STATIC_MODIFIER_NAME_boh_habsburg_rival_mod: "Herausforderung der Habsburger"
 STATIC_MODIFIER_DESC_boh_habsburg_rival_mod: "Die Rivalität zwischen dem Haus Luxemburg und den Habsburgern um die Vorherrschaft im Reich verschärft sich."
 STATIC_MODIFIER_NAME_boh_silesia_mod: "Das Eisen Schlesiens"
 STATIC_MODIFIER_DESC_boh_silesia_mod: "Schlesiens reiche Eisenerzvorkommen tragen das Fundament der böhmischen Rüstungsindustrie."
 STATIC_MODIFIER_NAME_boh_hre_master_mod: "Herr des Heiligen Römischen Reiches"
 STATIC_MODIFIER_DESC_boh_hre_master_mod: "Böhmen herrscht als unbestrittener Führer des Heiligen Römischen Reiches, und kein Fürst wagt es, nach Prag zu schreiben, es sei denn mit gesenktem Haupt."
 STATIC_MODIFIER_NAME_boh_prague_capital_mod: "Prag, Stadt der hundert Türme"
 STATIC_MODIFIER_DESC_boh_prague_capital_mod: "Prag an der Moldau ist als Mitteleuropas größte Stadt ausgebaut."
 STATIC_MODIFIER_NAME_boh_charles_university_mod: "Die Karls-Universität"
 STATIC_MODIFIER_DESC_boh_charles_university_mod: "Mitteleuropas erste Universität öffnet in Prag – sie strahlt als Zentrum von Gelehrsamkeit und Reform."
 STATIC_MODIFIER_NAME_boh_golden_bull_mod: "Die Goldene Bulle"
 STATIC_MODIFIER_DESC_boh_golden_bull_mod: "Die Kurwürde des Königs von Böhmen ist durch die Goldene Bulle begründet."
 STATIC_MODIFIER_NAME_boh_glass_industry_mod: "Böhmisches Glas"
 STATIC_MODIFIER_DESC_boh_glass_industry_mod: "Böhmisches Kristall begründet seinen Ruf als Europas feinste Handwerkskunst."
 STATIC_MODIFIER_NAME_boh_kutna_hora_mod: "Das Silber von Kuttenberg"
 STATIC_MODIFIER_DESC_boh_kutna_hora_mod: "Mitteleuropas größtes Silberbergwerk trägt Böhmens wirtschaftliches goldenes Zeitalter. Der Prager Groschen umläuft weithin."
 STATIC_MODIFIER_NAME_boh_moravia_mod: "Eingliederung Mährens"
 STATIC_MODIFIER_DESC_boh_moravia_mod: "Mähren mit Brünn und Olmütz ist in das böhmische Reich eingegliedert."
 STATIC_MODIFIER_NAME_boh_prosperity_mod: "Innerer Wohlstand"
 STATIC_MODIFIER_DESC_boh_prosperity_mod: "Böhmisches Glas, Silber und Handelsmärkte vereinen sich zu Mitteleuropas größter Wirtschaftsmacht."
 STATIC_MODIFIER_NAME_boh_catholic_reform_mod: "Standhafter katholischer Glaube"
 STATIC_MODIFIER_DESC_boh_catholic_reform_mod: "Böhmen, das der römischen Kirche die Treue hält, wird als Beschützer der mitteleuropäischen katholischen Zivilisation anerkannt."
 STATIC_MODIFIER_NAME_boh_crusader_glory_mod: "Kreuzfahrerruhm"
 STATIC_MODIFIER_DESC_boh_crusader_glory_mod: "Indem es den antihussitischen Kreuzzug anführt, erwirbt sich Böhmen den Ruf eines Verteidigers der Christenheit."
 STATIC_MODIFIER_NAME_boh_papal_ally_mod: "Schild des Papstes"
 STATIC_MODIFIER_DESC_boh_papal_ally_mod: "Tiefes Vertrauen zum Papsttum macht Böhmen zum Führer des katholischen Mitteleuropas."
 STATIC_MODIFIER_NAME_boh_hussite_church_mod: "Hussitische Kirche"
 STATIC_MODIFIER_DESC_boh_hussite_church_mod: "Der Geist des Jan Hus schlägt in Böhmen Wurzeln – ein eigenständiger Weg religiöser Reform ist begründet."
 STATIC_MODIFIER_NAME_boh_wagenburg_mod: "Wagenburgtaktik"
 STATIC_MODIFIER_DESC_boh_wagenburg_mod: "Jan Žižkas revolutionäre Taktik lebt im böhmischen Heer. Wagenburgen zerschmettern Kreuzfahrerreiterei."
 STATIC_MODIFIER_NAME_boh_king_heretic_mod: "Ansehen des Ketzerkönigs"
 STATIC_MODIFIER_DESC_boh_king_heretic_mod: "Trotz päpstlicher Exkommunikation wahrt der böhmische König sein Ansehen und überwindet die diplomatische Isolation."
 STATIC_MODIFIER_NAME_boh_slovakia_mod: "Eingliederung der Slowakei"
 STATIC_MODIFIER_DESC_boh_slovakia_mod: "Das Löwenbanner Böhmens weht nun über den Hügeln der Slowakei, der Urheimat des Großmährischen Reiches."
 STATIC_MODIFIER_NAME_boh_transylvania_mod: "Siebenbürgen"
 STATIC_MODIFIER_DESC_boh_transylvania_mod: "Das Land jenseits des Waldes fällt unter böhmische Herrschaft – ein Stützpunkt für die Ausdehnung auf den Balkan ist begründet."
 STATIC_MODIFIER_NAME_boh_nicopolis_glory_mod: "Rache für Nikopolis"
 STATIC_MODIFIER_DESC_boh_nicopolis_glory_mod: "Die Schmach von 1396 ist gerächt. Böhmen wird zur Vorhut der Gegenoffensive gegen das Osmanische Reich."
 STATIC_MODIFIER_NAME_boh_antemurale_mod: "Schild der Christenheit"
 STATIC_MODIFIER_DESC_boh_antemurale_mod: "Siebenbürgens Festungen werden zum Schild, der den osmanischen Vormarsch aufhält."
 STATIC_MODIFIER_NAME_boh_balkan_conqueror_mod: "Befreier des Balkans"
 STATIC_MODIFIER_DESC_boh_balkan_conqueror_mod: "Böhmen rückt als Befreier der Slawen und Christen des Balkans nach Süden vor."
 STATIC_MODIFIER_NAME_boh_silesia_secured_mod: "Schlesien vollständig eingegliedert"
 STATIC_MODIFIER_DESC_boh_silesia_secured_mod: "Ganz Schlesien unter böhmischer Direktherrschaft – die industriellen Grundlagen aus Eisen und Kohle sind begründet."
 STATIC_MODIFIER_NAME_boh_poland_subjugated_mod: "Polen unterworfen"
 STATIC_MODIFIER_DESC_boh_poland_subjugated_mod: "Die polnischen Ebenen fallen unter böhmische Kontrolle – die Grundlage für die Ausdehnung nach Osten ist gelegt."
 STATIC_MODIFIER_NAME_boh_baltic_access_mod: "Zugang zur Ostsee"
 STATIC_MODIFIER_DESC_boh_baltic_access_mod: "Mit der Einnahme Danzigs kann Böhmen unmittelbar am Ostseehandel teilnehmen."
 STATIC_MODIFIER_NAME_boh_diet_mod: "Der Böhmische Landtag"
 STATIC_MODIFIER_DESC_boh_diet_mod: "In der Kammer des Zemský Sněm lauschen die Abgesandten der Stände nun den Absichten des Kaisers."
 STATIC_MODIFIER_NAME_boh_absolutism_mod: "Absolute Monarchie"
 STATIC_MODIFIER_DESC_boh_absolutism_mod: "In Böhmen ist die absolute Monarchie errichtet – zu einem modernen Zentralstaat gewandelt."
 STATIC_MODIFIER_NAME_boh_military_power_mod: "Das Heer einer Großmacht"
 STATIC_MODIFIER_DESC_boh_military_power_mod: "Böhmens Eliteheer, Erbe der Traditionen von Wagenburg und Schwarzem Heer, rühmt sich der größten Militärmacht Mitteleuropas."
 STATIC_MODIFIER_NAME_boh_brno_mod: "Brünn erblüht"
 STATIC_MODIFIER_DESC_boh_brno_mod: "Mährens Hauptstadt Brünn entwickelt sich zu einem Zentrum von Handel und Gewerbe."
 STATIC_MODIFIER_NAME_boh_wroclaw_mod: "Breslau erblüht"
 STATIC_MODIFIER_DESC_boh_wroclaw_mod: "Breslau an der Oder wirkt als Herz der schlesischen Wirtschaft."
 STATIC_MODIFIER_NAME_boh_amber_road_mod: "Die Bernsteinstraße"
 STATIC_MODIFIER_DESC_boh_amber_road_mod: "Böhmen, das die uralte Bernsteinstraße von der Ostsee zum Mittelmeer kontrolliert, wird zur Drehscheibe des Nord-Süd-Handels."
 STATIC_MODIFIER_NAME_boh_pest_mod: "Pest erblüht"
 STATIC_MODIFIER_DESC_boh_pest_mod: "Pest an der Donau ist als Handelszentrum des südlichen böhmischen Reiches ausgebaut."
 STATIC_MODIFIER_NAME_boh_renaissance_mod: "Der Renaissancehof"
 STATIC_MODIFIER_DESC_boh_renaissance_mod: "Prag wird zum Mittelpunkt der mitteleuropäischen Renaissance, in dem sich italienische, französische und mitteleuropäische Kulturen begegnen."
 STATIC_MODIFIER_NAME_boh_great_moravia_mod: "Großmähren wiederhergestellt"
 STATIC_MODIFIER_DESC_boh_great_moravia_mod: "Zum ersten Mal seit Svatopluk sind Böhmen, Mähren und Schlesien vereint – der Mittelpunkt der slawischen Zivilisation ist wiedergeboren."
 STATIC_MODIFIER_NAME_boh_central_power_mod: "Mitteleuropäische Großmacht"
 STATIC_MODIFIER_DESC_boh_central_power_mod: "Böhmen herrscht als Mitteleuropas größte Macht und hat seine Vorherrschaft in Reich, Kultur und Heerwesen begründet."
 STATIC_MODIFIER_NAME_boh_krecy_glory_mod: "Das Erbe von Crécy"
 STATIC_MODIFIER_DESC_boh_krecy_glory_mod: "Der Heldentod des Blinden Königs wird als Böhmens Kriegerstolz überliefert."
 STATIC_MODIFIER_NAME_boh_alpine_lands_mod: "Alpenlande"
 STATIC_MODIFIER_DESC_boh_alpine_lands_mod: "Garnisonen unter böhmischem Banner besetzen nun die Gebirgspässe der Steiermark und Kärntens."
 STATIC_MODIFIER_NAME_boh_silver_currency_mod: "Der Prager Groschen"
 STATIC_MODIFIER_DESC_boh_silver_currency_mod: "Der aus Kuttenberger Silber geprägte Prager Groschen wird zu Mitteleuropas größter internationaler Währung."
 STATIC_MODIFIER_NAME_boh_golden_prague_mod: "Das Goldene Prag"
 STATIC_MODIFIER_DESC_boh_golden_prague_mod: "Veitsdom, Karlsbrücke, die hundert Türme – Prag wird als „Goldene Stadt“ zu Mitteleuropas größtem Kulturzentrum."
 STATIC_MODIFIER_NAME_boh_trade_network_mod: "Das böhmische Handelsnetz"
 STATIC_MODIFIER_DESC_boh_trade_network_mod: "Ein auf Prag zentriertes mitteleuropäisches Handelsnetz trägt Böhmens Vorherrschaft im Handel."
 STATIC_MODIFIER_NAME_boh_compactata_mod: "Die Prager Kompaktaten"
 STATIC_MODIFIER_DESC_boh_compactata_mod: "Die Aussöhnung von Katholiken und Utraquisten ist erreicht – Böhmen ist religiöse Stabilität zurückgegeben."
 STATIC_MODIFIER_NAME_boh_utraquist_mod: "Die utraquistische Kirche"
 STATIC_MODIFIER_DESC_boh_utraquist_mod: "Die utraquistische Kirche der Kommunion unter beiderlei Gestalt ist als Böhmens Staatsreligion begründet."
 STATIC_MODIFIER_NAME_boh_protestant_alliance_mod: "Das protestantische Bündnis"
 STATIC_MODIFIER_DESC_boh_protestant_alliance_mod: "Böhmen mit seiner hussitischen Tradition wird als Säule der protestantischen Welt anerkannt."
 STATIC_MODIFIER_NAME_boh_black_army_mod: "Das Schwarze Heer"
 STATIC_MODIFIER_DESC_boh_black_army_mod: "Der Geist des Schwarzen Heeres lebt in Böhmen – Mitteleuropas stärkstes Berufsheer ist vollendet."
 STATIC_MODIFIER_NAME_boh_berlin_mod: "Berlin entwickelt"
 STATIC_MODIFIER_DESC_boh_berlin_mod: "Die kleine nördliche Stadt Berlin wächst als nördlicher Verwaltungsmittelpunkt des böhmischen Reiches."
 STATIC_MODIFIER_NAME_boh_konigsberg_mod: "Königsberg kehrt zurück"
 STATIC_MODIFIER_DESC_boh_konigsberg_mod: "Das von Ottokar II. erbaute Königsberg kehrt zu Böhmen zurück und wird zum Drehkreuz des Ostseehandels."
 STATIC_MODIFIER_NAME_boh_great_king_mod: "Der Große König"
 STATIC_MODIFIER_DESC_boh_great_king_mod: "Der Name des böhmischen Königs ist als der größte Herrscher in die mitteleuropäische Geschichte eingeschrieben und übertrifft selbst Karl IV."
 STATIC_MODIFIER_NAME_boh_fortress_europe_mod: "Festung Europas"
 STATIC_MODIFIER_DESC_boh_fortress_europe_mod: "Ein Festungsnetz von den Alpen bis zu den Karpaten hält den osmanischen Vormarsch auf."
 STATIC_MODIFIER_NAME_boh_olomouc_mod: "Olmütz erblüht"
 STATIC_MODIFIER_DESC_boh_olomouc_mod: "Olmütz, Mährens Zentrum von Gelehrsamkeit und Religion, strahlt als Drehscheibe der nördlichen Renaissancekultur."
 STATIC_MODIFIER_NAME_boh_upper_austria_mod: "Oberösterreich"
 STATIC_MODIFIER_DESC_boh_upper_austria_mod: "Über den Mauern Oberösterreichs, donauaufwärts, weht das Banner des böhmischen Reiches, und die Straßen nach Süden liegen offen."
 STATIC_MODIFIER_NAME_boh_carpathian_mod: "Karpatenverteidigung"
 STATIC_MODIFIER_DESC_boh_carpathian_mod: "Ein Festungsnetz entlang der Karpaten wird zum Schild, das die Ostgrenze des böhmischen Reiches schützt."
 STATIC_MODIFIER_NAME_boh_bohemian_commonwealth_final_mod: "Ruhm des Böhmischen Commonwealth"
 STATIC_MODIFIER_DESC_boh_bohemian_commonwealth_final_mod: "Das Böhmische Commonwealth, das Mitteleuropas fünf große Städte beherrscht, ist vollendet. „Bohemia non perit“ – diese Worte sind für immer in die Geschichte eingemeißelt."
 STATIC_MODIFIER_NAME_boh_habsburg_crushed_mod: "Habsburg zerschlagen"
 STATIC_MODIFIER_DESC_boh_habsburg_crushed_mod: "Wien fällt, und die habsburgische Vorherrschaft über Mitteleuropa endet. Böhmen steht als der wahre Herr da."
 boh_fortress_of_europe: "Festung Europas"
 boh_fortress_of_europe_desc: "Ein Festungsnetz, das sich von den Alpen bis zu den Karpaten erstreckt, hält den osmanischen Vormarsch auf. Böhmen wirkt als „Schild Europas“."
 boh_dev_plzen: "Pilsen entwickeln"
 boh_dev_plzen_desc: "Pilsen – eine Schlüsselstadt Westböhmens und künftige Geburtsstätte des weltberühmten Pilsner Bieres. Am Zusammenfluss von Eger und Mies gelegen, fördert die Entwicklung dieser Stadt Handel und Gewerbe in ganz Westböhmen."
 boh_dev_cheb: "Eger entwickeln"
 boh_dev_cheb_desc: "Eger (Cheb), die uralte Stadt an der Eger, ist das kaiserliche Tor, an dem sich deutsche und böhmische Kultur kreuzen. Entwickle diese Stadt, die die Handelswege mit dem Heiligen Römischen Reich beherrscht, als Brückenkopf der westlichen Diplomatie."
 boh_dev_kutna_hora_city: "Kuttenberg entwickeln"
 boh_dev_kutna_hora_city_desc: "Im Glanz des Silberreichtums entwickelte sich Kuttenberg zur zweiten Stadt Böhmens nach Prag. Da der Dom der heiligen Barbara im Bau ist, entwickle diese Stadt zu einer wahren Metropole und begründe sie als wirtschaftliches Herz Böhmens."
 boh_bohemian_agriculture: "Böhmische Landwirtschaft"
 boh_bohemian_agriculture_desc: "Das böhmische Tiefland an der Elbe ist eine reiche Agrarzone. Weizen, Gerste und Roggen reifen in Fülle, und die landwirtschaftliche Erschließung steigert die Erträge erheblich. Eine stabile Nahrungsversorgung trägt das Bevölkerungswachstum im ganzen böhmischen Reich."
 boh_moravian_wine: "Mährischer Wein"
 boh_moravian_wine_desc: "Südmähren um Znaim ist Böhmens größte Weinbauregion. Das warme Klima und der Kalksteinboden nähren mährische Weine, die selbst an den Höfen Österreichs und Wiens geschätzt werden. Ihr reicher Geschmack versinnbildlicht die kulturelle Verfeinerung des böhmischen Reiches."
 boh_jihlava_silver: "Die Silberbergwerke von Iglau"
 boh_jihlava_silver_desc: "Iglau (Jihlava) auf der Böhmisch-Mährischen Höhe ist eine Silberbergbaustadt, die mit Kuttenberg wetteifert. Diese Silberbergwerke zur vollen Leistung zu bringen, erweitert Böhmens Silberproduktion weiter und mehrt die Ausprägung des Prager Groschens."
 boh_opava_iron: "Die Eisenindustrie von Troppau"
 boh_opava_iron_desc: "Troppau (Opava), Hauptstadt des Herzogtums Schlesien, ist für seine Eisenerzvorkommen bekannt. Die Entwicklung der Stahlindustrie dieser Stadt stärkt Schlesiens industrielles Fundament weiter und verbessert die böhmische Militärausrüstung erheblich."
 boh_dev_litomerice: "Leitmeritz entwickeln"
 boh_dev_litomerice_desc: "Leitmeritz (Litoměřice) an der Elbe ist eine wichtige Handelsstadt Nordböhmens. Ihre Entwicklung als Drehscheibe des über die Elbe bis Hamburg reichenden Handelswegs belebt den Handel mit Norddeutschland."
 boh_silesian_mines: "Die schlesischen Bergwerke"
 boh_silesian_mines_desc: "Unter Schlesiens Boden liegen das Eisen und die Kokskohle, die künftige industrielle Revolutionen tragen werden. Errichte ein Bergbausystem im großen Maßstab und steigere die industrielle Produktionskraft des böhmischen Reiches erheblich."
 boh_silesian_mines_unlock_tt: "Die Entscheidung „Die Bergwerke Schlesiens erschließen“ ist nun verfügbar."
 boh_silesian_mining_decision.title: "Die Bergwerke Schlesiens erschließen"
 boh_silesian_mining_decision.desc: "Die Bergbaureviere Schlesiens sind weitläufig, und die Krone kann nicht alle auf einmal erschließen. Jede Investition in Schächte, Hütten und Straßen bringt ein weiteres Revier zur vollen Förderung, und das Werk lässt sich jedes Jahrzehnt erneuern."
 boh_silesian_mining_decision.a: "In ein neues Bergbaurevier investieren."
 boh_bohemian_cloth: "Böhmische Tuchindustrie"
 boh_bohemian_cloth_desc: "Neben dem böhmischen Glas begründet Böhmens Textil- und Tuchindustrie ihren europäischen Ruf. Nordböhmisches Tuch, verbunden mit den Handelswegen von Leitmeritz, macht Böhmen zu einem Zentrum der Textilindustrie."
 STATIC_MODIFIER_NAME_boh_plzen_mod: "Pilsen entwickelt"
 STATIC_MODIFIER_DESC_boh_plzen_mod: "Pilsen, Schlüsselstadt Westböhmens, ist als Zentrum von Handel und Gewerbe ausgebaut."
 STATIC_MODIFIER_NAME_boh_cheb_mod: "Eger entwickelt"
 STATIC_MODIFIER_DESC_boh_cheb_mod: "Eger, das westliche Tor, wirkt als Handelsdrehscheibe mit dem Reich."
 STATIC_MODIFIER_NAME_boh_kutna_hora_city_mod: "Die Stadt Kuttenberg"
 STATIC_MODIFIER_DESC_boh_kutna_hora_city_mod: "Böhmens silberreiche zweite Stadt hat sich zu einer vollen Metropole entwickelt."
 STATIC_MODIFIER_NAME_boh_agriculture_mod: "Böhmische Landwirtschaft"
 STATIC_MODIFIER_DESC_boh_agriculture_mod: "Das fruchtbare Ackerland an der Elbe ist erschlossen – eine stabile Nahrungsversorgung ist gesichert."
 STATIC_MODIFIER_NAME_boh_znojmo_mod: "Die Weinberge von Znaim"
 STATIC_MODIFIER_DESC_boh_znojmo_mod: "Der südmährische Weinbau reift heran und bringt Wein von hoher Güte hervor."
 STATIC_MODIFIER_NAME_boh_moravian_wine_mod: "Mährischer Wein"
 STATIC_MODIFIER_DESC_boh_moravian_wine_mod: "Mährischer Wein wird selbst am österreichischen Hof in Wien zu einem geschätzten Erzeugnis."
 STATIC_MODIFIER_NAME_boh_jihlava_mod: "Das Silberbergwerk von Iglau"
 STATIC_MODIFIER_DESC_boh_jihlava_mod: "Iglaus Silberbergwerke arbeiten mit voller Kraft – ein Silberproduzent, der es mit Kuttenberg aufnimmt."
 STATIC_MODIFIER_NAME_boh_opava_mod: "Die Stahlindustrie von Troppau"
 STATIC_MODIFIER_DESC_boh_opava_mod: "In Troppau, der Hauptstadt des Herzogtums Schlesien, ist die Stahlindustrie entwickelt."
 STATIC_MODIFIER_NAME_boh_litomerice_mod: "Der Handelsplatz Leitmeritz"
 STATIC_MODIFIER_DESC_boh_litomerice_mod: "Leitmeritz an der Elbe entwickelt sich zur Drehscheibe der Handelswege Norddeutschlands."
 STATIC_MODIFIER_NAME_boh_silesian_mines_mod: "Die schlesischen Bergwerke"
 STATIC_MODIFIER_DESC_boh_silesian_mines_mod: "Schlesiens reiche Eisen- und Kohlebergwerke arbeiten mit voller Kraft – Böhmens Industriekraft ist erheblich gestiegen."
 STATIC_MODIFIER_NAME_boh_cloth_industry_mod: "Böhmische Tuchindustrie"
 STATIC_MODIFIER_DESC_boh_cloth_industry_mod: "Böhmens Textil- und Tuchindustrie hat sich neben dem Glas als bedeutender Exportzweig etabliert."
 boh_sugar_beet: "Zuckerrübenanbau"
 boh_sugar_beet_desc: "Das Zeitalter der Revolutionen – wissenschaftliche und industrielle Neuerungen wandeln die böhmische Landwirtschaft. Die Zuckerrübe ist die ideale Feldfrucht für Böhmens kühles Klima. Die Zuckerherstellung, einst ein Monopol des Zuckerrohrs, kommt nun aus böhmischen Feldern. Die neuen Anbauverfahren der Industriellen Revolution modernisieren die böhmische Landwirtschaft."
 boh_porcelain_industry: "Böhmische Porzellanindustrie"
 boh_porcelain_industry_desc: "Das Zeitalter der Revolutionen – der Kaolin (Porzellanerde) Westböhmens ist Europas feinster Porzellanrohstoff. Das aus der weißen Tonerde um Karlsbad (Karlovy Vary) geborene böhmische Porzellan wetteifert mit der erlesenen Handwerkskunst des Meißner Porzellans aus Dresden und schmückt die Höfe Europas."
 STATIC_MODIFIER_NAME_boh_porcelain_mod: "Böhmisches Porzellan"
 STATIC_MODIFIER_DESC_boh_porcelain_mod: "Porzellan aus westböhmischem Kaolin wird zu einem Luxusgut, das die Höfe Europas schmückt."
 boh_jan_hus_question_desc: "Der reformerische Geist des Jan Hus breitet sich über ganz Böhmen aus. Die Erinnerung an seine Verbrennung auf dem Konzil von Konstanz (1415) ist tief in die Herzen der Böhmen eingegraben, und der Zorn auf die römische Kirche hat den Siedepunkt erreicht. Wenn sich die Frage des Glaubens nicht länger umgehen lässt, muss Böhmen seinen eigenen Weg bestimmen."
 boh_events.60.t: "Zuckerrübenanbau – Morgenröte eines neuen Gewerbes"
 boh_events.60.d: "1737 – die Technik, Zucker aus der Zuckerrübe (Beta vulgaris) zu gewinnen, ist in ganz Europa entwickelt. Böhmens fruchtbare Felder sind ideal für den Anbau dieser neuen Feldfrucht. Wo soll die erste Zuckerrübenfarm entstehen – in Podiebrad oder in Königgrätz?"
 boh_events.60.a: "Zuckerrüben auf den Feldern von Podiebrad anpflanzen (Geburtsort des „Ketzerkönigs“ Georg)"
 boh_events.60.b: "Zuckerrüben auf den Feldern von Königgrätz anpflanzen (fruchtbare Lande an der Elbe)"
 STATIC_MODIFIER_NAME_boh_jan_hus_mod: "Die Wahrheit des Hus"
 STATIC_MODIFIER_DESC_boh_jan_hus_mod: "Abschriften der Predigten des Jan Hus gehen selbst in den Bauernhäusern Böhmens von Hand zu Hand."
 STATIC_MODIFIER_NAME_boh_sugar_beet_choice_mod: "Zuckerrübenfarm"
 STATIC_MODIFIER_DESC_boh_sugar_beet_choice_mod: "Der Zuckerrübenanbau reift heran – in Böhmen erzeugter Zucker wird auf europäische Märkte ausgeführt."
 boh_conquer_silesia: "Schlesien eingliedern"
 boh_conquer_silesia_desc: "Schlesien gehört zu den böhmischen Kronländern. Die Eingliederung dieser an Eisenerz und Silber reichen Region stärkt Böhmens industrielles und militärisches Fundament erheblich."
 boh_events.50.b: "Nein, Böhmens traditionelle Farben bewahren – es besteht kein Bedarf zur Änderung"
 boh_urban_privileges: "Böhmische Stadtprivilegien"
 boh_urban_privileges_desc: "Mit dem entwickelten Brünn und Olmütz hat Böhmen ein System zur Verleihung eigener Privilegien an seine Städte errichtet. Feudalstädte stärken die Adelskontrolle und unterdrücken die Befreiung der Bauern; geistliche Städte fördern die religiöse Bekehrung."
 STATIC_MODIFIER_NAME_boh_ecclesiastical_city_rights: "Geistliche Stadt"
 STATIC_MODIFIER_DESC_boh_ecclesiastical_city_rights: "In dieser Stadt, in der die Glocken der Kathedrale jede Stunde des Tages schlagen, sind selbst die Marktregeln auf die Zeiten des Gebets abgestimmt."
 boh_urban_privileges_unlock_tt: "Schaltet die Stadtprivilegien Feudalstadt (Poddanská nebo vrchnostenská města) und Geistliche Stadt (Biskupská nebo klášterní města) frei."
