l_german:
 lbv_niederbayern_mission_pack: "Das Landshuter Erbe – der Weg zur bayerischen Wiedervereinigung"
 lbv_niederbayern_mission_pack_DESCRIPTION:0 "Als Haus Landshut, Erbe der bis in die Niederlande reichenden Hinterlassenschaft Albrechts I., führe die zersplitterten Lande Bayerns wieder zu einem Ganzen zusammen."
 lbv_niederbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Entwickle Landshut und vereine Bayern wieder."
 lbv_niederbayern_mission_pack_BUTTON_TOOLTIP:0 "Entwickle Landshut und vereine Bayern wieder."
 lbv_niederbayern_mission_pack_BUTTON_DETAILS:0 "Erhebe dich als Herzog von ganz Bayern!"
 lbv_straubing_holland_legacy: "Das Erbe von Straubing-Holland"
 lbv_straubing_holland_legacy_desc: "Das Erbe Albrechts I., dessen Machtbereich bis in die Niederlande reichte – als Haus Landshut tritt die Erinnerung an diese gewaltige Hinterlassenschaft an."
 lbv_secure_landshut: "Landshut entwickeln"
 lbv_secure_landshut_desc: "Landshut, isaraufwärts gelegen – entwickle diese Stadt prachtvoller gotischer Baukunst zum Mittelpunkt des Herzogtums."
 lbv_danube_trade: "Der Donauhandel"
 lbv_danube_trade_desc: "Handelsschiffe, die die Donau befahren – nutze diese lebenswichtige Wasserstraße und sichere dir den Reichtum des Handels."
 lbv_low_countries_ties: "Bande zu den Niederlanden"
 lbv_low_countries_ties_desc: "Das Erbe Albrechts I., der einst über Holland, Seeland und Hennegau gebot – pflege unsere Bande zu den Niederlanden auch jetzt noch."
 lbv_bavarian_ambition: "Streben nach einem geeinten Bayern"
 lbv_bavarian_ambition_desc: "Landshuts Entwicklung, der Donauhandel und die Bande zu den Niederlanden – baue darauf auf und hege Ambitionen auf ganz Bayern."
 lbv_reunite_bavaria: "Bayern wiedervereinen"
 lbv_reunite_bavaria_desc: "Das zersplitterte Herzogtum – gewinne die Lande Oberbayerns zurück und füge Bayern wieder zu einem Ganzen zusammen."
 lbv_duke_of_all_bavaria: "Herzog von ganz Bayern"
 lbv_duke_of_all_bavaria_desc: "Unter der Blutlinie des Hauses Landshut ist ganz Bayern endlich unter einem einzigen Banner vereint."
 lbv_events.1.t: "Verkündung der bayerischen Einheit"
 lbv_events.1.d: "Unter der Blutlinie des Hauses Landshut ist Bayern endlich wieder eins. Das Zeitalter der Teilung geht zu Ende."
 lbv_events.1.a: "Ruhm für Bayern!"
 STATIC_MODIFIER_NAME_lbv_legacy_mod: "Das Erbe von Straubing-Holland"
 STATIC_MODIFIER_DESC_lbv_legacy_mod: "Der Ruhm Albrechts I., dessen Reich einst Holland und den Hennegau umfasste, wird am Hof zu Landshut noch immer voller Stolz erzählt."
 STATIC_MODIFIER_NAME_lbv_landshut_mod: "Landshut entwickelt"
 STATIC_MODIFIER_DESC_lbv_landshut_mod: "Die Stadt gotischer Baukunst blüht als Mittelpunkt des Herzogtums."
 STATIC_MODIFIER_NAME_lbv_danube_mod: "Der Donauhandel"
 STATIC_MODIFIER_DESC_lbv_danube_mod: "Lastkähne, die das Donautal befahren, löschen unablässig Salz und Getreide an den Ufern Niederbayerns."
 STATIC_MODIFIER_NAME_lbv_low_countries_mod: "Bande zu den Niederlanden"
 STATIC_MODIFIER_DESC_lbv_low_countries_mod: "Gesandte und Tuchhändler aus den Niederlanden jenseits des Nordmeeres sind selbst am Hof zu Landshut willkommen."
 STATIC_MODIFIER_NAME_lbv_reunite_mod: "Bayern wiedervereint"
 STATIC_MODIFIER_DESC_lbv_reunite_mod: "Die Vasallen der beiden einst getrennten Linien schwören ihren Eid nun unter einem einzigen Banner."
 STATIC_MODIFIER_NAME_lbv_unify_bavaria_mod: "Herzog von ganz Bayern"
 STATIC_MODIFIER_DESC_lbv_unify_bavaria_mod: "Die Glocken der bayerischen Türme läuten das Ende der Teilung ein."
 lbv_unified_duchy: "Das geeinte Herzogtum Bayern"
 lbv_unified_duchy_desc: "Das Zeitalter der Teilung ist vorüber – als geeintes Herzogtum Bayern brich in eine neue Ära auf."
 lbv_bavaria_unified_tt: "Bayern geeint"
 lbv_landrecht: "Das Bayerische Landrecht"
 lbv_landrecht_desc: "Ein Recht für ein geeintes Herzogtum – erlasse das bayerische Gesetzbuch (Landrecht) und festige das Fundament der Herrschaft."
 lbv_tyrol_ambition: "Ambitionen auf Tirol"
 lbv_tyrol_ambition_desc: "Die Grafschaft Tirol, von den Alpen umfangen – hege Ambitionen auf dieses Land."
 lbv_swabian_expansion: "Ausgreifen nach Schwaben"
 lbv_swabian_expansion_desc: "Schwaben, das sich nach Südwesten erstreckt – stärke unseren Einfluss auf diese Region."
 lbv_greater_bavaria: "Ein Größeres Bayern verwirklichen"
 lbv_greater_bavaria_desc: "Das Gesetzbuch, Tirol und Schwaben – baue darauf auf und verwirkliche ein größeres Bayern."
 lbv_counter_reformation_leader: "Wortführer der Gegenreformation"
 lbv_counter_reformation_leader_desc: "Verkörpere den Geist des Konzils von Trient und stelle dich an die Spitze der Gegenreformation."
 lbv_electoral_dignity: "Kurwürde"
 lbv_electoral_dignity_desc: "Im Jahr 1623 erringt Maximilian I. endlich den Rang eines Kurfürsten – mache diese Ehre zum ewigen Stolz Bayerns."
 lbv_austrian_rivalry: "Rivalität mit Österreich"
 lbv_austrian_rivalry_desc: "Die Rivalität mit dem Haus Habsburg um die Vorherrschaft im Reich – stelle dich diesem Wettstreit mit unserem großen Widersacher."
 lbv_war_of_austrian_succession: "Der Österreichische Erbfolgekrieg"
 lbv_war_of_austrian_succession_desc: "Der Krieg um Karls VII. Anspruch auf den Kaiserthron – nutze diesen Erbfolgekrieg, um Bayerns Ansehen zu mehren."
 lbv_imperial_crown: "Die Kaiserkrone"
 lbv_imperial_crown_desc: "Im Jahr 1742 wird Karl VII., Herzog von Bayern, zum Kaiser des Heiligen Römischen Reiches gekrönt – der erste Nicht-Habsburger seit Jahrhunderten, der die Krone trägt."
 lbv_enlightened_absolutism: "Aufgeklärter Absolutismus"
 lbv_enlightened_absolutism_desc: "Ein Zeitalter der Aufklärung, das Vernunft und Bildung schätzt – trage dieses neue Gedankengut in die Regierung Bayerns."
 lbv_napoleonic_alliance: "Trotz gegenüber Frankreich"
 lbv_napoleonic_alliance_desc: "Europa, erschüttert von Revolution und Napoleons Ehrgeiz – Bayern sichert sich einen Anspruch auf den Thron dieses mächtigen Nachbarn und geht seinen eigenen Weg."
 lbv_kingdom_of_bavaria: "Die Ausrufung des Königreichs Bayern"
 lbv_kingdom_of_bavaria_desc: "Im Jahr 1806 erklärt Kurfürst Maximilian IV. Joseph sich zum König von Bayern – die lange Geschichte des Hauses Wittelsbach erreicht hier einen neuen Gipfel."
 lbv_events.3.t: "Die Kaiserkrone"
 lbv_events.3.d: "Im Jahr 1742 wurde Karl VII., Herzog von Bayern, im Frankfurter Dom zum Kaiser des Heiligen Römischen Reiches gekrönt. Es ist Jahrhunderte her, dass jemand außer einem Habsburger die Kaiserkrone trug."
 lbv_events.3.a: "Ruhm Seiner Kaiserlichen Majestät!"
 lbv_events.99.t: "Ausrufung des Königreichs Bayern"
 lbv_events.99.d: "Im Jahr 1806 erklärte sich Kurfürst Maximilian IV. Joseph unter dem Rheinbund zum König von Bayern. Die lange Geschichte des Hauses Wittelsbach erreicht hier einen neuen Gipfel."
 lbv_events.99.a: "Es lebe das Königreich Bayern!"
 STATIC_MODIFIER_NAME_lbv_unified_mod: "Das geeinte Herzogtum Bayern"
 STATIC_MODIFIER_DESC_lbv_unified_mod: "Das Herzogtum muss Höfe, Einkünfte und Soldaten nicht länger zwischen rivalisierenden Linien aufteilen."
 STATIC_MODIFIER_NAME_lbv_greater_mod: "Ein Größeres Bayern verwirklicht"
 STATIC_MODIFIER_DESC_lbv_greater_mod: "Von den Alpenausläufern bis zu den Hügeln Schwabens weitet sich das Land unter dem herzoglichen Banner mit jeder Jahreszeit."
 STATIC_MODIFIER_NAME_lbv_counter_reformation_mod: "Wortführer der Gegenreformation"
 STATIC_MODIFIER_DESC_lbv_counter_reformation_mod: "Im Geiste des Konzils von Trient öffnen in den Städten des Herzogtums Jesuitenkollegien eines nach dem anderen ihre Tore."
 STATIC_MODIFIER_NAME_lbv_succession_war_mod: "Der Österreichische Erbfolgekrieg"
 STATIC_MODIFIER_DESC_lbv_succession_war_mod: "Offiziere und Mannschaften, gestählt auf den Schlachtfeldern des Österreichischen Erbfolgekriegs, bilden nun den Kern des herzoglichen Heeres."
 STATIC_MODIFIER_NAME_lbv_imperial_crown_mod: "Die Kaiserkrone"
 STATIC_MODIFIER_DESC_lbv_imperial_crown_mod: "Die Erinnerung an den Tag, an dem der Herzog von Bayern im Frankfurter Dom gekrönt wurde, ist jedem am Hof stolz ins Herz geprägt."
 STATIC_MODIFIER_NAME_lbv_enlightenment_mod: "Aufgeklärter Absolutismus"
 STATIC_MODIFIER_DESC_lbv_enlightenment_mod: "Bei Hofe verbreiten neue Bücher aus Frankreich die Ideale der Aufklärung, und die Zahl der Schulen wächst von Jahr zu Jahr."
 STATIC_MODIFIER_NAME_lbv_electoral_dignity_mod: "Kurwürde"
 STATIC_MODIFIER_DESC_lbv_electoral_dignity_mod: "Wenn der Herzog im Gewand eines Kurfürsten seinen Platz bei der Kaiserwahl einnimmt, lauschen die Fürsten seinen Worten mit Respekt."
 STATIC_MODIFIER_NAME_lbv_kingdom_mod: "Das Königreich Bayern"
 STATIC_MODIFIER_DESC_lbv_kingdom_mod: "Im Münchner Palast donnern Salutschüsse zur Krönung des ersten Königs von Bayern aus dem Haus Wittelsbach."
