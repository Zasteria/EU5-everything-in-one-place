l_german:
 ara_crown_mission_pack: "Der Weg der Krone von Aragón"
 ara_crown_mission_pack_DESCRIPTION:0 "Die Krone von Aragón – die Katalonien, Aragón und Valencia vereint – steht im Mittelpunkt der Geschichte und wetteifert um die iberische Einheit und die Vorherrschaft im Mittelmeer. Reiche die Hand mit Kastilien und schmiede Spanien, oder gehe allein deinen Weg, gliedere Neapel ein und marschiere nach Konstantinopel. Der Pfad liegt bei dir."
 ara_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Schließe Missionen als Krone von Aragón ab, um iberische Einheit und mediterrane Hegemonie zu begründen."
 ara_crown_mission_pack_BUTTON_TOOLTIP:0 "Schließe Missionen ab, um den Weg der Krone von Aragón zu beschreiten."
 ara_crown_mission_pack_BUTTON_DETAILS:0 "Lege das Fundament Spaniens, werde Herr des westlichen Mittelmeers und nimm Konstantinopel ein!"
 ara_accession_of_pedro_iv: "Der Thronantritt Peters IV."
 ara_accession_of_pedro_iv_desc: "1336 bestieg mit dem Tod Alfons’ IV. sein Sohn Peter IV. (Pere III. der Zeremoniöse) den Thron der Krone von Aragón. Gelehrt und dem höfischen Zeremoniell tief verbunden, hegt dieser junge König den festen Entschluss, die königliche Autorität zu stärken und das Reich zu einen. Mit der Morgenröte einer neuen Herrschaft beginnen Aragóns Ambitionen im Mittelmeer noch einmal zu brennen."
 ara_kingdom_of_majorca: "Das Königreich Mallorca"
 ara_kingdom_of_majorca_desc: "Das Königreich Mallorca, einst von einer Nebenlinie des aragonesischen Königshauses regiert, besteht als eigenständige politische Kraft auf den Balearen fort. Dieses Gebiet vollständig einzugliedern, wird der erste Schritt zu größeren Ambitionen im westlichen Mittelmeer sein."
 ara_reconquest_of_granada: "Die Reconquista Granadas"
 ara_reconquest_of_granada_desc: "Das Königreich Granada, das letzte Bollwerk des Islam auf der Iberischen Halbinsel, hat die christlichen Könige lange mit seinen fruchtbaren Landen und prächtigen Palästen gequält. Die Eroberung dieses Reiches markiert die Vollendung der Reconquista – das Ende eines jahrhundertelangen Kampfes."
 ara_vassalize_navarre: "Navarra vasallisieren"
 ara_vassalize_navarre_desc: "Das kleine Königreich Navarra, eingekeilt zwischen Frankreich und Kastilien, ist eine strategisch wichtige Pufferzone für Aragón. Ehe Frankreich es aufsaugen kann, müssen wir Navarra in Aragóns Einflusssphäre bringen."
 ara_intervene_in_castile: "In Kastilien intervenieren"
 ara_intervene_in_castile_desc: "Der Hof Kastiliens, der das Trastámara-Blut unseres eigenen Königshauses teilt, ist lange von Fraktionsstreit zerrissen worden. Wie einst die Infanten von Aragón um Einfluss auf dieses große Königreich stritten, so ist nun die Zeit gekommen, in sein Schicksal einzugreifen."
 ara_union_of_the_crowns: "Die Union der Kronen"
 ara_union_of_the_crowns_desc: "Die Kronen von Aragón und Kastilien sind unter einem Königshaus vereint. Dies ist die Morgenröte eines neuen Königreichs – Spanien. Lasst uns die historische Union, geschmiedet im Zeitalter Ferdinands und Isabellas, mit unseren eigenen Händen Wirklichkeit werden lassen."
 ara_catalan_nobility: "Der katalanische Adel"
 ara_catalan_nobility_desc: "Nach dem Aufstand müssen wir über das Schicksal des katalanischen Adels entscheiden. Ihre Macht beschneiden und die königliche Autorität stärken, oder Koexistenz in einer reformierten Ordnung suchen? Diese Entscheidung wird die Stabilität Kataloniens und die Zukunft der Regierung im ganzen Reich bestimmen."
 ara_crowns_of_iberia: "Die Kronen Iberiens"
 ara_crowns_of_iberia_desc: "Aragón, Kastilien, Navarra, Granada – alle Kronen der Iberischen Halbinsel haben sich unter einem Königshaus versammelt. Hier ist das Fundament des Spanischen Reiches gelegt. Die Zeit ist gekommen, der Welt die Geburt eines neuen Reiches zu verkünden."
 ara_pacify_sardinia: "Sardinien befrieden"
 ara_pacify_sardinia_desc: "Aragón hat lange die Herrschaft über Sardinien beansprucht, doch innere Aufstände und rivalisierende Mächte haben die Insel geplagt. Dieses reiche Mittelmeerbollwerk vollständig zu befrieden, ist ein unentbehrlicher Schritt für die weitere Ausdehnung nach Osten."
 ara_consulate_of_the_sea: "Das Konsulat des Meeres"
 ara_consulate_of_the_sea_desc: "Das um Barcelona und Valencia entwickelte Seehandelsrecht – der Consolat de Mar – regelt den Mittelmeerhandel. Nutze das Ansehen dieser Einrichtung, um den Handel im westlichen Mittelmeer unter unsere Rechtsprechung zu bringen."
 ara_dominate_genoa: "Genua beherrschen"
 ara_dominate_genoa_desc: "Genua hat lange mit Aragón um die Vorherrschaft im Mittelmeerhandel gewetteifert. Wenn wir Ligurien und Genua selbst einnehmen können, wird der Handel im gesamten westlichen Mittelmeer vollständig in unsere Hände fallen."
 ara_rule_italy: "Italien beherrschen"
 ara_rule_italy_desc: "Ganz Italien zu beherrschen – einschließlich des Herrschaftsgebiets des Papstes – trägt historische Bedeutung, die über bloße Eroberung hinausgeht. Indem es das Land regiert, in dem Roms Erbe fortlebt, begründet Aragón sich als Hegemon Europas."
 ara_invade_occitania: "In Okzitanien einfallen"
 ara_invade_occitania_desc: "Provence, Languedoc, Gascogne – die Lande Südfrankreichs fielen einst in die aragonesische Einflusssphäre. Die Ausdehnung unserer Nordgrenze gegen das Königreich Frankreich ist eine wesentliche strategische Aufgabe für die Sicherheit der Iberischen Halbinsel."
 ara_humiliate_provence: "Die Provence demütigen"
 ara_humiliate_provence_desc: "Der Graf der Provence hat lange rechtmäßige Erbansprüche sowohl auf Aragón als auch auf Neapel beansprucht. Wir müssen diesen anmaßenden Vorwänden ein Ende setzen und die Provence unter unsere Kontrolle bringen, um unsere Hegemonie im westlichen Mittelmeer unangreifbar zu machen."
 ara_aragonese_navy: "Die aragonesische Marine"
 ara_aragonese_navy_desc: "Die Gebiete der Krone von Aragón sind über das Mittelmeer verstreut. Sie alle zu schützen und die Seeherrschaft zu wahren, erfordert eine mächtige Flotte. Baue die aragonesische Armada auf und begründe die Führung über dieses Binnenmeer."
 ara_seize_sicily: "Sizilien einnehmen"
 ara_seize_sicily_desc: "Mit der aufgebauten aragonesischen Flotte ist eine Invasion der Insel Sizilien zu einer echten Aussicht geworden. Sizilien, einst durch die „Sizilianische Vesper“ von den Franzosen befreit, betrachtet Aragón als seinen eigenen Beschützer. Sichere Palermo und mache dieses wichtige Mittelmeerbollwerk für immer zu Aragóns Eigentum."
 ara_integrate_naples: "Neapel eingliedern"
 ara_integrate_naples_desc: "Das Königreich Neapel, von König Alfons V. erobert, bleibt eines der Juwelen der aragonesischen Krone. Durch die vollständige Eingliederung Süditaliens und der Hafenstadt Neapel gewinnt unser Königreich einen Brückenkopf für die Ausdehnung ins östliche Mittelmeer."
 ara_mediterranean_ambitions: "Mittelmeerambitionen"
 ara_mediterranean_ambitions_desc: "Damit unser Name bis ins östliche Mittelmeer erklingt, sind eine größere Flotte und stärkere Seemacht erforderlich. Baue eine große Galeerenflotte auf und erhebe unsere Flagge über das gesamte Mittelmeer. Ein Stützpunkt auf dem Balkan ist nun in Reichweite."
 ara_combat_barbary_piracy: "Gegen die Barbareskenpiraterie kämpfen"
 ara_combat_barbary_piracy_desc: "Die muslimischen Korsaren, die an der nordafrikanischen Küste stationiert sind, sind eine ständige Bedrohung für die aragonesische Schifffahrt. Ihre Stützpunkte anzugreifen und unschuldige Christen aus der Sklaverei zu befreien, ist sowohl für den Glauben als auch das nationale Interesse dringend."
 ara_conquer_tunis: "Tunis erobern"
 ara_conquer_tunis_desc: "Tunis ist kein bloßer Piratenhafen. Wenn wir diese mit den Osmanen verbundene Seemacht ungebändigt lassen, wird unsere mediterrane Hegemonie ständig gefährdet sein. Erobere Tunis und begründe die vollständige Beherrschung Nordafrikas."
 ara_occupy_alexandria: "Alexandria besetzen"
 ara_occupy_alexandria_desc: "Alexandria, Schlüssel zum östlichen Mittelmeer, war einst das Zentrum antiken Weltwissens und bleibt eine Drehscheibe ägyptischen und asiatischen Handels. Wenn wir diese Stadt einnehmen und den östlichen Handel monopolisieren können, wird Aragón zu einem wahren mediterranen Hegemon."
 ara_claims_on_athens: "Ansprüche auf Athen"
 ara_claims_on_athens_desc: "Da die aragonesischen Söldner – die Katalanische Kompanie – einst das Herzogtum Athen begründeten, hält Aragón historische Rechte in griechischen Landen. Nimm die Morea und Nordgriechenland ein und sichere den letzten Stützpunkt auf dem Weg nach Konstantinopel."
 ara_mare_nostrum: "Mare Nostrum"
 ara_mare_nostrum_desc: "Von Gibraltar bis zum Marmarameer ist das Mittelmeer unser Binnensee. Niemand darf diese Gewässer ohne die Erlaubnis der aragonesischen Flotte befahren. Die Hegemonie über das westliche Mittelmeer ist begründet – das nächste Ziel ist jene goldene Stadt hinter ihren uralten Mauern."
 ara_taula_de_canvi: "Die Taula de Canvi"
 ara_taula_de_canvi_desc: "Die Taula de Canvi (Wechseltisch), 1401 in Barcelona errichtet, ist eine von Europas ältesten öffentlichen Banken. Durch die Nutzung dieser mit der Ausweitung des Handels immer ausgefeilteren Finanzeinrichtung können wir die Finanzen des Königreichs auf ein unerschütterliches Fundament stellen."
 ara_valencian_silk: "Valencianische Seide"
 ara_valencian_silk_desc: "Valencia wird als Erzeuger feiner Seide bekannt. Durch den Ausbau der Seidenbörse (Llotja de la Seda) und die Entwicklung von Valencias Seidenindustrie können wir selbst gegen östliche Konkurrenz die Oberhand gewinnen."
 ara_guilds_of_barcelona: "Die Zünfte Barcelonas"
 ara_guilds_of_barcelona_desc: "Die Handwerker- und Kaufmannszünfte Barcelonas sind seit langem das Rückgrat der städtischen Wirtschaft. Durch die Sicherung ihrer Loyalität und die Organisation ähnlicher Zünfte im ganzen Reich wird das Fundament von Gewerbe und Handel weiter gefestigt."
 ara_industrial_districts: "Industrieviertel"
 ara_industrial_districts_desc: "Glas, Wein, Papier und Seide – Aragón ist Heimat einer vielfältigen Palette hochwertiger Güter. Durch die Organisation dieser Industrien und den Ausbau der Fertigung wird die Wirtschaftskraft des Königreichs sprunghaft wachsen."
 ara_aragonese_renaissance: "Die aragonesische Renaissance"
 ara_aragonese_renaissance_desc: "Der Hof Alfons’ V. wurde zu einem Zentrum der Renaissancekultur in Neapel und zog italienische Humanisten aus der ganzen Halbinsel an. Durch die Verbreitung dieser kulturellen Blüte im ganzen Königreich wird Aragón sich als geistiges und künstlerisches Herz Europas begründen."
 ara_golden_century: "Das Goldene Jahrhundert"
 ara_golden_century_desc: "Nachdem es Iberien geeint, das Mittelmeer beherrscht und Wirtschaft und Kultur erblühen sah, tritt unser Königreich wahrhaft in sein Siglo de Oro ein – das Goldene Jahrhundert. Sein Glanz wird über Generationen besprochen werden."
 ara_city_of_the_worlds_desire: "Die Stadt der Sehnsucht der Welt"
 ara_city_of_the_worlds_desire_desc: "Konstantinopel – die Stadt der Sehnsucht der Welt. Ihre goldenen Mauern haben über die Jahrhunderte viele Eroberer zurückgehalten. Doch nun stehen unsere Flotte – Herrin des Mittelmeers – und unsere Heere – über Iberien geeint – bereit, diese Stadt endlich zu belagern. Nimm beide Ufer des Bosporus ein und mach den uralten Traum Wirklichkeit."
 ara_plus_ultra: "Plus Ultra"
 ara_plus_ultra_desc: "„Plus Ultra“ – weiter darüber hinaus. Einst hieß es, westlich der Säulen des Herkules sei nichts. Doch unsere Entdecker wissen nun, dass jenseits davon ein weites unbekanntes Meer liegt. Die Zeit ist gekommen, an den Säulen vorbeizusegeln und zu den Enden der Welt aufzubrechen."
 ara_african_outposts: "Afrikanische Stützpunkte"
 ara_african_outposts_desc: "Durch das Vordringen nach Süden entlang der westafrikanischen Küste öffnen sich neue Wege, die muslimische Zwischenhändler umgehen, um Gold und Handelswaren unmittelbar zu erreichen. Errichte zunächst Stützpunkte auf den Kanarischen Inseln und entlang der marokkanischen Küste."
 ara_gold_coast_trade: "Der Handel an der Goldküste"
 ara_gold_coast_trade_desc: "Die Region der westafrikanischen Küste, bekannt als Goldküste, ist, ihrem Namen getreu, eine reiche Goldquelle. Durch die Errichtung eines Handelspostens hier können wir den Reichtum Afrikas unmittelbar ins Königreich bringen, ohne auf die überlandische Saharoute angewiesen zu sein."
 ara_discover_the_new_world: "Die Neue Welt entdecken"
 ara_discover_the_new_world_desc: "Was liegt westlich des großen Ozeans? Unsere Entdecker, die an eine kugelförmige Erde glauben, sind überzeugt, dass ein westlicher Weg nach Asien existiert. Rüste eine Erkundungsflotte aus und stich in das unbekannte Meer. Was du dort findest, mag eine neue Welt jenseits aller Vorstellung sein."
 ara_caribbean_foothold: "Stützpunkt in der Karibik"
 ara_caribbean_foothold_desc: "Wir haben unseren ersten Brückenkopf in der Neuen Welt begründet. Besiedle Hispaniola und die umliegenden Inseln und mache sie zum Ausgangspunkt weiterer Erkundung des Kontinents. Von hier aus öffnen sich Wege nach Süden, Norden und tief ins Landesinnere."
 ara_conquest_of_the_incas: "Die Eroberung der Inka"
 ara_conquest_of_the_incas_desc: "Tief im südamerikanischen Kontinent liegt ein großes Reich, von dem gesagt wird, es sei voller Gold und Silber – das Inkareich (Tawantinsuyu). Führe Konquistadoren in das andine Hochland und mache den Reichtum dieses Reiches zu unserem eigenen."
 ara_new_kingdom_of_aragon: "Das Neue Königreich Aragón"
 ara_new_kingdom_of_aragon_desc: "Die Kolonien, die wir in der Neuen Welt errichtet haben, sind nicht mehr bloße Außenposten. Organisiere sie als unmittelbare Domäne der aragonesischen Krone – ein Neues Königreich Aragón – mit Einrichtungen, die denen des Mutterlandes entsprechen. Als Souverän der Amerikas wird unser König als Herr zweier Welten verzeichnet werden."
 ara_route_to_the_indies: "Der Weg nach Indien"
 ara_route_to_the_indies_desc: "Portugal hat bereits den Seeweg nach Indien um die Südspitze Afrikas erschlossen. Doch wir können nicht einfach vom Rand aus zusehen. Öffne eine Route um die Welt wie Magellan, oder erreiche die Häfen Indiens vor Portugal."
 ara_spice_trade_outposts: "Gewürzhandelsposten"
 ara_spice_trade_outposts_desc: "Nelken, Muskatnuss und Pfeffer von den Gewürzinseln (den Molukken) erzielen in Europa gewaltige Preise. Wenn wir dort einen Stützpunkt errichten und den Gewürzhandel monopolisieren können, wird die Schatzkammer des Königreichs auf ewig bereichert."
 ara_las_filipinas: "Las Filipinas"
 ara_las_filipinas_desc: "Der Archipel, den Magellan erreichte – die Philippinen (Filipinas). Durch die Eroberung und Kolonisierung dieser strategisch gelegenen Inseln entsteht eine neue Drehscheibe im Mittelpunkt des Pazifikhandels. Als Mittelpunkt des Silberhandelswegs, der China und die Amerikas verbindet, birgt dieses Gebiet unschätzbaren Wert."
 ara_empire_of_the_three_oceans: "Das Reich der drei Ozeane"
 ara_empire_of_the_three_oceans_desc: "Der Atlantik, der Indische Ozean, der Pazifik – ein Reich, das seine Flagge über drei große Ozeane erhebt, ist entstanden. Das Zepter Aragóns reicht nun nicht nur in die Höfe Europas, sondern in die Dschungel Afrikas, das Hochland der Neuen Welt und die Gewürzinseln Asiens. Wir haben eine Leistung vollbracht, die keine Nation der Geschichte je erreicht hat."
 STATIC_MODIFIER_NAME_ara_kingdom_of_majorca_mod: "Die Flotte der Balearen"
 STATIC_MODIFIER_DESC_ara_kingdom_of_majorca_mod: "Nachdem wir unseren Stützpunkt im westlichen Mittelmeer gesichert haben, sind die Reichweite unserer Schiffe und der Wirkungskreis unserer Kaufleute gewachsen."
 STATIC_MODIFIER_NAME_ara_reconquest_of_granada_mod: "Ruhm des Kreuzzugs"
 STATIC_MODIFIER_DESC_ara_reconquest_of_granada_mod: "Die Vollendung der Reconquista hat unsere Toleranz gegenüber Häretikern und die Legitimität der Krone erhöht."
 STATIC_MODIFIER_NAME_ara_vassalize_navarre_mod: "Das Gleichgewicht der Pyrenäen"
 STATIC_MODIFIER_DESC_ara_vassalize_navarre_mod: "Die Einbeziehung Navarras in unsere Sphäre hat das diplomatische Ansehen des Königreichs erhöht."
 STATIC_MODIFIER_NAME_ara_intervene_in_castile_mod: "Das kastilische Expeditionsheer"
 STATIC_MODIFIER_DESC_ara_intervene_in_castile_mod: "Nachdem wir in Kastilien interveniert haben, rühmt sich das königliche Heer hoher Landmoral."
 STATIC_MODIFIER_NAME_ara_union_of_the_crowns_mod: "Der Ruhm der Katholischen Könige"
 STATIC_MODIFIER_DESC_ara_union_of_the_crowns_mod: "Die Heirat von Ferdinand II. und Isabella I. im Jahr 1469 band die zwei großen Königreiche Aragón und Kastilien in einer dynastischen Union. Die Herrschaft der beiden, „Katholische Könige“ genannt, wurde zum Fundament eines geeinten spanischen Staates und wurde bald von der Eroberung Granadas und den Reisen Kolumbus’ gefolgt."
 STATIC_MODIFIER_NAME_ara_catalan_nobility_mod: "Das Urteil der Justicia"
 STATIC_MODIFIER_DESC_ara_catalan_nobility_mod: "Die Errichtung der Justicia de Aragón erlaubt der Unzufriedenheit des Adelsstandes, rascher abzuklingen."
 STATIC_MODIFIER_NAME_ara_crowns_of_iberia_mod: "Spaniens Kriegsbereitschaft"
 STATIC_MODIFIER_DESC_ara_crowns_of_iberia_mod: "Durch die Vereinigung der Krone von Aragón mit Kastilien und Portugal kommt die gesamte Iberische Halbinsel unter einen einzigen Monarchen. Die Verwirklichung des seit dem Römischen Reich gehegten Traums einer geeinten „Hispania“ ist ein Unterfangen von welthistorischem Ausmaß."
 STATIC_MODIFIER_NAME_ara_pacify_sardinia_mod: "Die sardische Garnison"
 STATIC_MODIFIER_DESC_ara_pacify_sardinia_mod: "Die befriedete Insel Sardinien hat die Manneskraft des Königreichs vermehrt und die Last des Krieges erleichtert."
 STATIC_MODIFIER_NAME_ara_consulate_of_the_sea_mod: "Das Ansehen des Seerechts"
 STATIC_MODIFIER_DESC_ara_consulate_of_the_sea_mod: "Das Ansehen unseres Seerechts hat das Handelseinkommen des Königreichs und den Wirkungskreis seiner Kaufleute erhöht."
 STATIC_MODIFIER_NAME_ara_dominate_genoa_mod: "Das ligurische Handelshaus"
 STATIC_MODIFIER_DESC_ara_dominate_genoa_mod: "Das Handelshaus Genuas hat den Wirkungskreis unserer Kaufleute in diesem Land erhöht."
 STATIC_MODIFIER_NAME_ara_rule_italy_mod: "Hegemon der Halbinsel"
 STATIC_MODIFIER_DESC_ara_rule_italy_mod: "Die Krone von Aragón wurde mit der Eroberung Neapels durch Alfons V. den Großmütigen (1442) tief in Italien verwickelt. Alfons machte Neapel zu seinem Sitz und regierte als großer Förderer der Renaissance. Die Herrschaft über ganz Italien wäre die letzte Erfüllung von Alfons’ Ehrgeiz."
 STATIC_MODIFIER_NAME_ara_invade_occitania_mod: "Das okzitanische Expeditionsheer"
 STATIC_MODIFIER_DESC_ara_invade_occitania_mod: "Nachdem es sich durch Südfrankreich gekämpft hat, marschiert das königliche Heer schneller und belagert mit größerem Geschick."
 STATIC_MODIFIER_NAME_ara_humiliate_provence_mod: "Die Unterwerfung der Provence"
 STATIC_MODIFIER_DESC_ara_humiliate_provence_mod: "Nachdem wir die Werften der Provence eingenommen haben, ist die Erzeugung von Marinegütern im Königreich gewachsen."
 STATIC_MODIFIER_NAME_ara_aragonese_navy_mod: "Die Armada de Aragón"
 STATIC_MODIFIER_DESC_ara_aragonese_navy_mod: "Die neu geordnete aragonesische Flotte rühmt sich hoher Moral und ausgezeichneter Reparaturfähigkeit."
 STATIC_MODIFIER_NAME_ara_integrate_naples_mod: "Die Schatzkammer der beiden Sizilien"
 STATIC_MODIFIER_DESC_ara_integrate_naples_mod: "Der Handel mit Neapel blüht, und die Manneskraft des königlichen Heeres ist gewachsen."
 STATIC_MODIFIER_NAME_ara_mediterranean_ambitions_mod: "Die Macht der Galeerenflotte"
 STATIC_MODIFIER_DESC_ara_mediterranean_ambitions_mod: "Die erweiterte Flotte rühmt sich hoher Moral und unübertroffener Reichweite."
 STATIC_MODIFIER_NAME_ara_combat_barbary_piracy_mod: "Das Anti-Piraten-Geschwader"
 STATIC_MODIFIER_DESC_ara_combat_barbary_piracy_mod: "Nachdem wir die Korsaren unterdrückt haben, segeln die Handelsschiffe des Königreichs weiter in Sicherheit, und die Disziplin des Heeres ist gewachsen."
 STATIC_MODIFIER_NAME_ara_conquer_tunis_mod: "Die nordafrikanische Garnison"
 STATIC_MODIFIER_DESC_ara_conquer_tunis_mod: "Nachdem wir die Führung über Nordafrika gesichert haben, ist unsere Hand in den Verhandlungen des Krieges stärker, und die Manneskraft des Heeres ist gewachsen."
 STATIC_MODIFIER_NAME_ara_occupy_alexandria_mod: "Das Monopol auf den östlichen Handel"
 STATIC_MODIFIER_DESC_ara_occupy_alexandria_mod: "Nachdem wir eine Drehscheibe des östlichen Handels gesichert haben, sind das Handelseinkommen des Königreichs und der Wirkungskreis seiner Kaufleute größer denn je gewachsen."
 STATIC_MODIFIER_NAME_ara_claims_on_athens_mod: "Das Erbe der Katalanischen Kompanie"
 STATIC_MODIFIER_DESC_ara_claims_on_athens_mod: "Nachdem es in Griechenland Feldzüge geführt hat, marschiert das königliche Heer schneller, und die Last des Krieges wiegt weniger schwer auf dem Reich."
 STATIC_MODIFIER_NAME_ara_mare_nostrum_mod: "Das Oberkommando der Mittelmeerflotte"
 STATIC_MODIFIER_DESC_ara_mare_nostrum_mod: "Nachdem wir das gesamte Mittelmeer beherrscht haben, rühmt sich unsere Flotte hoher Moral und unvergleichlicher Betriebs- und Handelsreichweite."
 STATIC_MODIFIER_NAME_ara_taula_de_canvi_mod: "Der Kredit des Wechseltisches"
 STATIC_MODIFIER_DESC_ara_taula_de_canvi_mod: "Die „Taula de Canvi“ (Wechseltisch), 1401 in Barcelona gegründet, zählt zu den ersten öffentlichen Banken der Welt. Von den Kaufmannsgilden Barcelonas geführt, wickelte diese Finanzeinrichtung Kredite, Wechsel und Einlagen ab und wurde zu einer Säule, die den katalanischen Handel stützte."
 STATIC_MODIFIER_NAME_ara_valencian_silk_mod: "Die Llotja de la Seda"
 STATIC_MODIFIER_DESC_ara_valencian_silk_mod: "Valencia war eines der führenden Seidenerzeugungszentren des mittelalterlichen Mittelmeers. Die von den Mauren gebrachten Seidenzuchttechniken gingen an christliche Handwerker über, und valencianische Seide rühmte sich eines Rufes, der mit den feinen Stoffen Italiens gleichzog. Die Llotja de la Seda (Seidenbörse) ist das Sinnbild ihres Wohlstands."
 STATIC_MODIFIER_NAME_ara_guilds_of_barcelona_mod: "Die Loyalität der Zünfte"
 STATIC_MODIFIER_DESC_ara_guilds_of_barcelona_mod: "Gestärkte Bande zu den Zünften Barcelonas haben die Produktionseffizienz dieses Landes leicht erhöht."
 STATIC_MODIFIER_NAME_ara_industrial_districts_mod: "Der Aufstieg der Manufaktur"
 STATIC_MODIFIER_DESC_ara_industrial_districts_mod: "In Barcelona, Valencia und Saragossa entwickelten sich Industrieviertel, in denen sich Werkstätten für Wolle, Tuch, Leder und Metallarbeit konzentrierten. Der Handelswohlstand der Krone von Aragón wurde von der Produktivkraft dieser städtischen Industrien gestützt, und ihre Waren wurden selbst auf den Märkten Italiens hoch geschätzt."
 STATIC_MODIFIER_NAME_ara_aragonese_renaissance_mod: "Der Hof der Humanisten"
 STATIC_MODIFIER_DESC_ara_aragonese_renaissance_mod: "Diese kulturelle Blüte hat die Fertigkeit neuer Künstler und das Tempo der Innovation erhöht."
 STATIC_MODIFIER_NAME_ara_golden_century_mod: "Der Wohlstand des Siglo de Oro"
 STATIC_MODIFIER_DESC_ara_golden_century_mod: "Das Siglo de Oro (Goldene Jahrhundert) bezeichnet das 16. und 17. Jahrhundert, als Spanien den Gipfel politischer, militärischer und kultureller Errungenschaften erreichte. Cervantes’ „Don Quijote“, die Hofmalerei Velázquez’, die Theaterstücke Lope de Vegas – die vereinten Kronen von Aragón und Kastilien herrschten auf dem Höhepunkt europäischer Kultur."
 STATIC_MODIFIER_NAME_ara_city_of_the_worlds_desire_mod: "Herr des Bosporus"
 STATIC_MODIFIER_DESC_ara_city_of_the_worlds_desire_mod: "Der Glanz eines Reiches, das Konstantinopel hält, hat sein Ansehen und seine Legitimität erhöht und seine Hand in den Verhandlungen des Krieges gestärkt wie nie zuvor."
 STATIC_MODIFIER_NAME_ara_plus_ultra_mod: "Das Fieber für Fahrten darüber hinaus"
 STATIC_MODIFIER_DESC_ara_plus_ultra_mod: "Der Geist der Erkundung darüber hinaus hat die Reichweite unserer Kolonialflotten und unserer Marine erweitert."
 STATIC_MODIFIER_NAME_ara_african_outposts_mod: "Die kanarischen Stützpunkte"
 STATIC_MODIFIER_DESC_ara_african_outposts_mod: "Unsere Stützpunkte entlang der afrikanischen Küste haben die Reichweite der Handelsschiffe des Königreichs erweitert."
 STATIC_MODIFIER_NAME_ara_gold_coast_trade_mod: "Das Netz des Goldhandels"
 STATIC_MODIFIER_DESC_ara_gold_coast_trade_mod: "Der Handel mit der Goldküste hat das Handelseinkommen des Königreichs und den Wirkungskreis seiner Kaufleute erhöht."
 STATIC_MODIFIER_NAME_ara_discover_the_new_world_mod: "Der Geist der Ozeanflotte"
 STATIC_MODIFIER_DESC_ara_discover_the_new_world_mod: "Die Öffnung des Tores zur Neuen Welt hat den Strom der Auswanderer im Königreich beschleunigt."
 STATIC_MODIFIER_NAME_ara_caribbean_foothold_mod: "Die Siedlungen von Hispaniola"
 STATIC_MODIFIER_DESC_ara_caribbean_foothold_mod: "Unser Stützpunkt in der Neuen Welt hat seine Anziehungskraft für Siedler erhöht."
 STATIC_MODIFIER_NAME_ara_conquest_of_the_incas_mod: "Das Erbe der Konquistadoren"
 STATIC_MODIFIER_DESC_ara_conquest_of_the_incas_mod: "1532 fing Francisco Pizarro den Inka-Kaiser Atahualpa und eroberte das Inkareich. Die Plünderung der größten goldenen Zivilisation der Welt brachte Spanien beispiellosen Reichtum, und mit der Entdeckung der Silberminen von Potosí flossen gewaltige Mengen Edelmetall aus der Neuen Welt nach Europa."
 STATIC_MODIFIER_NAME_ara_new_kingdom_of_aragon_mod: "Die Krone der Amerikas"
 STATIC_MODIFIER_DESC_ara_new_kingdom_of_aragon_mod: "Der Aufbau des Neuen Königreichs Aragón ist ein großes koloniales Unterfangen, um Aragóns Erbe in die Neue Welt zu verpflanzen. Unter dem Encomienda-System, das indigene Arbeitskraft einbezieht, werden weiterhin Silber, Gold, Zucker und Farbstoffe ins Mutterland gesandt."
 STATIC_MODIFIER_NAME_ara_route_to_the_indies_mod: "Der Kompass der Seefahrer"
 STATIC_MODIFIER_DESC_ara_route_to_the_indies_mod: "Die Öffnung des Weges nach Indien hat die Betriebsreichweite unserer Flotte erweitert."
 STATIC_MODIFIER_NAME_ara_spice_trade_outposts_mod: "Das molukkische Handelshaus"
 STATIC_MODIFIER_DESC_ara_spice_trade_outposts_mod: "Gewürze wie Pfeffer, Muskatnuss und Nelken waren im mittelalterlichen Europa so viel wert wie Gold. Diesen von muslimischen Kaufleuten und Venedig monopolisierten Handelsweg abzuschneiden und Stützpunkte unmittelbar an der Quelle zu gründen, ist eine Quelle kaiserlichen Reichtums."
 STATIC_MODIFIER_NAME_ara_las_filipinas_mod: "Die pazifische Zwischenstation"
 STATIC_MODIFIER_DESC_ara_las_filipinas_mod: "Der philippinische Archipel wurde von Magellan erreicht (1521) und wurde später, mit Manila auf Luzon als Basis, zum Zentrum des „Galeonenhandels“. Auf diesem Weg, der Acapulco in Mexiko und Manila verband, wurde das Silber der Neuen Welt fortwährend gegen chinesische Seide und Porzellan getauscht."
 STATIC_MODIFIER_NAME_ara_empire_of_the_three_oceans_mod: "Das Reich, in dem die Sonne nie untergeht"
 STATIC_MODIFIER_DESC_ara_empire_of_the_three_oceans_mod: "Der Glanz eines Reiches, das drei Ozeane umspannt, hat das Handelseinkommen des Königreichs und den Wirkungskreis seiner Kaufleute erhöht wie nie zuvor."
 ara_events.1.t: "Der Thronantritt Peters IV."
 ara_events.1.d: "1336 starb Alfons IV., und sein Sohn Peter IV. bestieg den Thron der Krone von Aragón. Im Jahr 1337 ist das Reich eine lose Union der Lande Katalonien, Aragón, Valencia und der Balearen. Die Kontrolle über Sardinien bleibt instabil, und die Beziehungen zum benachbarten Kastilien tragen eine ständige Unterströmung von Spannung. Die Handelsmächte, die die Handelswege des Mittelmeers beherrschen, halten großen Einfluss, und die Krone muss in Absprache mit den Privilegien dieser verschiedenen Reiche regieren. Vor dem jungen König Peter IV. erstreckt sich ein langer Weg zu einem geeinten Iberien und der Vorherrschaft im Mittelmeer."
 ara_events.1.a: "Eine neue Herrschaft beginnt"
 ara_events.2.t: "Die Eingliederung des Königreichs Mallorca"
 ara_events.2.d: "Das Königreich Mallorca, einst von Jakob II. als Nebenlinie des aragonesischen Königshauses gegründet, ist trotz seiner Besitzungen auf den Balearen, in Roussillon und Montpellier lange in Aragóns Einflusssphäre geblieben. Die Zeit ist gekommen für seine vollständige Eingliederung. Ob es ganz annektiert und zu einem Teil Aragóns gemacht wird, oder als freundlicher Vasall erhalten bleibt – in jedem Fall wird Mallorca unter die aragonesische Krone fallen."
 ara_events.2.a: "Mallorca ganz annektieren"
 ara_events.2.b: "Mallorca als freundlichen Vasall erhalten"
 STATIC_MODIFIER_NAME_ara_seize_sicily_mod: "Ruhm der Einnahme Siziliens"
 STATIC_MODIFIER_DESC_ara_seize_sicily_mod: "Die Sizilianer, die das Haus Anjou in der „Sizilianischen Vesper“ von 1282 vertrieben, hießen Peter III. von Aragón als ihren neuen König willkommen. Von da an war Sizilien eine wichtige Domäne des aragonesischen Königshauses und diente weiterhin als strategischer Schlüssel, der das zentrale Mittelmeer beherrschte."
