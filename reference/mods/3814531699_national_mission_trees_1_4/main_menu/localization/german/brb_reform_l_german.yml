l_german:
 brb_estates_balance_reform: "Das Gleichgewicht von Adel und Bürgern"
 brb_estates_balance_reform_desc: "Lehnsadel oder Handelsbürger – wessen Stimme lauter erklingt, prägt den Charakter der Herrschaft im Großherzogtum. Je größer der Einfluss des Adels, desto stärker die feudale Ordnung und die Steuerkraft; je größer der Einfluss der Bürger, desto stärker der Wohlstand des Handels."
