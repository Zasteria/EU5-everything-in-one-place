l_spanish:
 hol_republican_reform: "República bajo la soberanía de los Estados"
 hol_republican_reform_desc: "Una forma peculiar de gobierno sin estatúder, en la que la soberanía reside en las asambleas de las siete provincias: favorece el comercio y los intereses del estamento burgués, aunque mantener un ejército permanente se vuelve algo más difícil."
