l_spanish:
 eth_mobile_court_reform_tooltip: "Cada vez que se cambia de capital, la nueva sede de la capital recibe una bonificación temporal"
 eth_mobile_court_reform: "Campamento itinerante (Ketema)"
 eth_mobile_court_reform_desc: "Sin capital fija: un estilo de gobierno peculiar en el que el emperador, su ejército, su corte y su iglesia recorren el país sin cesar; alivia el peso de trasladar la capital y trae la bendición a cada tierra que el emperador visita."
 STATIC_MODIFIER_NAME_eth_mobile_court_mod: "Bendición del Campamento Imperial (Ketema)"
 STATIC_MODIFIER_DESC_eth_mobile_court_mod: "La corte del emperador ha estado aquí, trayendo a esta tierra una afluencia de gente y prosperidad (disminuye con el tiempo)."
