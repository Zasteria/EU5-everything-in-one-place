l_spanish:
 wiener_stadtrecht_town_rights: "Derecho urbano de Viena"
 wiener_stadtrecht_town_rights_desc: "Un derecho urbano especial, concedido solo a Viena: mejora el acceso al mercado, la fuerza del centro comercial y la capacidad de los mercaderes. Solo puede concederse a Viena."
 landstadt_town_rights: "Landstadt"
 landstadt_town_rights_desc: "Derecho urbano concedido a las ciudades imperiales: refuerza la autoridad de la corona y del estamento noble, mejorando el alcance administrativo desde la capital."
