l_spanish:
 brb_estates_balance_reform: "Equilibrio entre nobleza y burguesía"
 brb_estates_balance_reform_desc: "Nobleza feudal o burguesía mercantil: quien habla más alto define el carácter del gobierno del gran ducado. Cuanto más fuerte es la influencia de la nobleza, más firme es el orden feudal y el poder tributario; cuanto más fuerte es la de la burguesía, mayor es la prosperidad comercial."
