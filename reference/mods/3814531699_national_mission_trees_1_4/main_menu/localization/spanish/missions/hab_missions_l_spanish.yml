l_spanish:
 hab_habsburg_mission_pack: "La hegemonía de los Habsburgo y el Imperio universal"
 hab_habsburg_mission_pack_DESCRIPTION:0 "Desde las orillas del Danubio, las ambiciones de la casa de Habsburgo alcanzan toda Europa. Conquista el trono de emperador del Sacro Imperio Romano, toma Hungría al este, Francia y España al oeste, Italia al sur. Después, haz de Viena la mayor ciudad del mundo y realiza el Imperio universal."
 hab_habsburg_mission_pack_CRITERIA_DESCRIPTION:0 "Domina el Sacro Imperio, conquista Occidente, Oriente e Italia y realiza el Imperio universal."
 hab_habsburg_mission_pack_BUTTON_TOOLTIP:0 "Une Europa bajo la hegemonía de los Habsburgo."
 hab_habsburg_mission_pack_BUTTON_DETAILS:0 "“Que otros hagan la guerra; tú, feliz Austria, cásate”: ¡conviértete en señora de Europa tanto por la diplomacia como por la conquista!"
 hab_habsburg_ascendancy: "El ascenso de la casa de Habsburgo"
 hab_habsburg_ascendancy_desc: "La sangre de Rodolfo de Habsburgo late a lo largo del Danubio: ha comenzado la era de la diplomacia y la conquista."
 hab_secure_electors: "Asegura a los electores"
 hab_secure_electors_desc: "El trono del emperador del Sacro Imperio Romano se decide por el voto de los electores. Por alianza o por fuerza abrumadora, asegura que la corona imperial permanezca ininterrumpidamente en manos de la casa de Habsburgo."
 hab_imperial_authority: "Establece la autoridad imperial"
 hab_imperial_authority_desc: "La autoridad del Sacro Imperio Romano converge en la voluntad de la casa de Habsburgo: ha llegado la hora de que todo el Imperio se someta a la orden de Viena."
 hab_counter_reformation: "La Contrarreforma"
 hab_counter_reformation_desc: "La herejía de Martín Lutero sacude Alemania: realiza los decretos del Concilio de Trento y defiende la fe católica."
 hab_charlemagne_legacy: "El legado de Carlomagno"
 hab_charlemagne_legacy_desc: "Trae de vuelta al estandarte habsburgo la Alemania meridional que Carlomagno unificó hace mil años: base de la reforma imperial asentada."
 hab_imperial_reform: "Reforma imperial"
 hab_imperial_reform_desc: "La reforma imperial: perpetúa el gobierno de los Habsburgo mediante la reorganización de las instituciones de gobierno del Imperio."
 hab_emperors_of_rome: "Heredera de los emperadores romanos"
 hab_emperors_of_rome_desc: "El sueño desde Carlomagno: con el dominio sobre la Ciudad Eterna, Roma, y sobre el Sacro Imperio, la casa de Habsburgo se proclama “heredera de los emperadores romanos”."
 hab_reclaim_burgundy: "Recupera Borgoña"
 hab_reclaim_burgundy_desc: "Lotaringia y Borgoña: recupera estas tierras occidentales que antaño pertenecieron a la casa de Habsburgo."
 hab_austrian_netherlands: "Países Bajos austríacos"
 hab_austrian_netherlands_desc: "Las ricas ciudades comerciales de Flandes y Brabante: la riqueza de los Países Bajos sustenta las finanzas del Imperio habsburgo."
 hab_weaken_france: "Debilita a Francia"
 hab_weaken_france_desc: "La vieja rival Francia es el mayor obstáculo a la hegemonía europea. Debilítala y corta su poder de intervenir en Alemania e Italia."
 hab_defeat_france: "La derrota de Francia"
 hab_defeat_france_desc: "“La Galia ha caído”: la vieja rival Francia derrotada por la casa de Habsburgo. La hegemonía sobre Europa occidental pertenece a los Habsburgo."
 hab_iberian_marriage: "Diplomacia matrimonial con Iberia"
 hab_iberian_marriage_desc: "“Que otros hagan la guerra; tú, feliz Austria, cásate”: los matrimonios con España y Portugal abren la puerta al imperio en el que el sol nunca se pone."
 hab_crown_of_spain: "La Corona de España"
 hab_crown_of_spain_desc: "Toda la Península Ibérica: con la proclamación de la casa de Habsburgo como “Rey de España”, el imperio en el que el sol nunca se pone comienza a tomar forma."
 hab_italian_ambition: "Ambiciones en Italia"
 hab_italian_ambition_desc: "Las ricas ciudades-Estado del norte de Italia: trae Milán, Venecia y Nápoles al control habsburgo."
 hab_duchy_of_milan: "Conquista el Ducado de Milán"
 hab_duchy_of_milan_desc: "Milán es el corazón del norte de Italia. Toma este baluarte económico y militar y establece la base para la conquista de Italia."
 hab_papal_alliance: "Relaciones con el papa"
 hab_papal_alliance_desc: "El papa: establece relaciones con esta autoridad espiritual del mundo católico y eleva la legitimidad de la casa de Habsburgo."
 hab_venetian_ports: "Los puertos de Venecia"
 hab_venetian_ports_desc: "Venecia, la “Reina del Adriático”: toma sus puertos y su flota y asegura la entrada en el comercio mediterráneo."
 hab_king_of_naples: "Rey de Nápoles"
 hab_king_of_naples_desc: "El Reino de Nápoles: llave del sur de Italia. Esta corona es el primer paso hacia el dominio habsburgo sobre toda Italia."
 hab_king_of_italy: "Rey de Italia"
 hab_king_of_italy_desc: "La “Corona de Hierro” brilla en la frente del emperador habsburgo: toda Italia, de Lombardía a Sicilia, unida."
 hab_eastern_ambitions: "Ambiciones en el Este"
 hab_eastern_ambitions_desc: "Bohemia y Hungría: establece reivindicaciones sobre estas dos grandes potencias de Europa oriental e inicia el avance habsburgo hacia el este."
 hab_crown_of_bohemia: "La Corona de Bohemia"
 hab_crown_of_bohemia_desc: "La corona de Wenceslao en Praga: esta corona se convierte en la base de la expansión habsburga hacia el este."
 hab_royal_hungary: "La Hungría real"
 hab_royal_hungary_desc: "Buda liberada de los otomanos: la corona de Hungría vuelve a la frente del emperador habsburgo, y nace la “Hungría real”."
 hab_bohemian_union: "Incorporación de la unión bohemia"
 hab_bohemian_union_desc: "La unión personal con Bohemia se ha profundizado: ahora elige entre gobernarla directamente como tierra de la corona incorporada o mantener el statu quo."
 hab_secure_croatia: "Asegura Croacia"
 hab_secure_croatia_desc: "Establece la frontera militar en Croacia para detener las invasiones otomanas y úsala como cabeza de puente para la conquista de los Balcanes."
 hab_ottoman_menace: "La amenaza otomana"
 hab_ottoman_menace_desc: "El Imperio otomano es el mayor enemigo de Europa oriental, que derribó Constantinopla. Que la casa de Habsburgo se convierta en baluarte, defendiendo la cristiandad."
 hab_liberate_balkans: "Libera los Balcanes"
 hab_liberate_balkans_desc: "Libera a los cristianos de la Península Balcánica del dominio otomano: la voz de los fieles ortodoxos clama el nombre de los Habsburgo."
 hab_emperors_of_east: "Emperador de Oriente"
 hab_emperors_of_east_desc: "Constantinopla —capital tanto del Imperio romano de Oriente como de Occidente— cae ahora en manos habsburgas. Tanto la corona imperial oriental como la occidental unidas."
 hab_austrian_heartland: "Establece el corazón austríaco"
 hab_austrian_heartland_desc: "El corazón austríaco a lo largo del Danubio: asegura el corazón de la expansión imperial y establece la base de su economía y ejército."
 hab_tyrol_styria: "Tirol y Estiria"
 hab_tyrol_styria_desc: "La plata de Schwaz y el hierro de Leoben: las minas del Tirol y de Estiria sustentan las finanzas y los ejércitos del Imperio habsburgo."
 hab_dev_vienna: "Desarrollo de Viena"
 hab_dev_vienna_desc: "“Ciudad de la música”, “Viena Blanca de los Habsburgo”: llena Viena de un esplendor digno de capital imperial."
 hab_graz_fortress: "Fortifica Graz"
 hab_graz_fortress_desc: "Graz: desarrolla la capital de Estiria en una ciudad-fortaleza inexpugnable, lista para la invasión otomana."
 hab_baroque_vienna: "Viena barroca"
 hab_baroque_vienna_desc: "La música, la arquitectura y la pintura barrocas florecen en la corte vienesa: universidades y academias de artes anuncian la edad de oro de la cultura habsburga."
 hab_great_vienna: "La Gran Ciudad de Viena"
 hab_great_vienna_desc: "El Palacio de Schönbrunn, la Catedral de San Esteban: Viena concluida como la mayor y más bella ciudad de Europa."
 hab_swiss_lands: "Recupera las tierras suizas"
 hab_swiss_lands_desc: "Lava la humillación simbolizada por Guillermo Tell: recupera la tierra de los campesinos alpinos para la casa de Habsburgo."
 hab_south_german_cities: "Ciudades comerciales de la Alemania del sur"
 hab_south_german_cities_desc: "Augsburgo y Fráncfort: toma estas ricas ciudades, patria de las familias Fugger y Rothschild."
 hab_unify_germany: "Unificación de Alemania"
 hab_unify_germany_desc: "Los principados alemanes fragmentados: ahora por fin unidos bajo el estandarte habsburgo."
 hab_north_sea_trade: "Comercio del Mar del Norte"
 hab_north_sea_trade_desc: "Hamburgo y Ámsterdam: toma el control del comercio del Mar del Norte y construye un nuevo imperio comercial para sustituir a la Liga Hanseática."
 hab_hegemon_of_west: "Hegemón de Occidente"
 hab_hegemon_of_west_desc: "Francia, España: toda gran potencia de Occidente que antaño desafió a la casa de Habsburgo, ahora subyugada."
 hab_tuscany: "Conquista de la Toscana"
 hab_tuscany_desc: "La cultura renacentista de Florencia: toma esta tierra de las artes, que floreció bajo el mecenazgo de los Médici, bajo las alas del Imperio habsburgo."
 hab_surpass_poland: "Supera a Polonia"
 hab_surpass_poland_desc: "El Reino de Polonia: establece la superioridad militar habsburga frente a esta gran potencia de Europa oriental."
 hab_wallachia_moldavia: "Valaquia y Moldavia"
 hab_wallachia_moldavia_desc: "Subyuga los principados rumanos al norte del Danubio y completa el dominio habsburgo sobre los Balcanes."
 hab_austrian_army: "Reorganiza el ejército austríaco"
 hab_austrian_army_desc: "El ejército habsburgo: cultiva el más fuerte ejército de Europa, forjado en una alianza de regimientos multinacionales."
 hab_spanish_tercios: "Los tercios españoles"
 hab_spanish_tercios_desc: "El tercio: introduce esta revolucionaria táctica militar española en todo el ejército habsburgo y perfecciona la mejor infantería de Europa."
 hab_multicultural: "Imperio multinacional"
 hab_multicultural_desc: "Alemanes, checos, húngaros, croatas, italianos: el experimento del Imperio habsburgo de unir muchas naciones bajo un solo estandarte concluido."
 hab_alsace_lorraine: "Alsacia-Lorena"
 hab_alsace_lorraine_desc: "Alsacia y Lorena, a lo largo del Rin: asegura esta tierra como frontera occidental del Imperio habsburgo."
 hab_renaissance_court: "La corte renacentista"
 hab_renaissance_court_desc: "La luz del Renacimiento brilla en la corte vienesa: el arte italiano y el saber bizantino se funden, llevando la cultura habsburga al pleno florecimiento."
 hab_carinthia: "Carintia"
 hab_carinthia_desc: "Carintia: incorpora este ducado alpino a las posesiones habsburgas y asegura el corredor hacia Italia y los Balcanes."
 hab_colonialism: "El Imperio colonial"
 hab_colonialism_desc: "Por medio de España, hasta las Américas: construye un imperio colonial bajo cuya bandera habsburga el sol nunca se pone."
 hab_universal_empire: "El Imperio universal"
 hab_universal_empire_desc: "“El Imperio universal: de Lisboa, al oeste, a Constantinopla, al este, de Hamburgo, al norte, a Palermo, al sur”: el sueño desde Carlomagno realizado."
 hab_events.1.t: "La casa de Habsburgo, rumbo al trono del Sacro Imperio"
 hab_events.1.d: "Los electores han declarado su apoyo a la casa de Habsburgo: el trono imperial pertenece a los Habsburgo."
 hab_events.1.a: "¡Viva el Emperador Habsburgo! ¡Viva el Imperio!"
 hab_events.10.t: "Proclamación como heredera de los emperadores romanos"
 hab_events.10.d: "La reforma imperial concluida y la Ciudad Eterna, Roma, unida al Sacro Imperio: la casa de Habsburgo se proclama “heredera de los emperadores romanos”."
 hab_events.10.a: "¡Viva la reforma imperial! ¡Viva la heredera de Roma!"
 hab_events.15.t: "Proclamación de la unificación de Alemania"
 hab_events.15.d: "Del norte al sur: Alemania, antaño fragmentada en incontables principados, unida bajo el estandarte habsburgo."
 hab_events.15.a: "¡Viva la unificación de Alemania!"
 hab_events.20.t: "La caída de Francia: el camino al trono"
 hab_events.20.d: "Francia se ha inclinado por fin ante la casa de Habsburgo. Ha llegado la hora de establecer la reivindicación formal al trono francés: proclama la reivindicación de sesenta años y vuelve la mirada hacia la sucesión del Reino de Francia."
 hab_events.20.a: "Proclamar la reivindicación al trono francés (60 años)"
 hab_events.25.t: "La Corona de España"
 hab_events.25.d: "“Rey de España y archiduque de Austria”: la Península Ibérica está ahora en posesión del Imperio habsburgo."
 hab_events.25.a: "¡Viva España! ¡Viva el Imperio habsburgo!"
 hab_events.30.t: "Rey de Italia"
 hab_events.30.d: "La “Corona de Hierro” brilla en la frente del emperador habsburgo: toda Italia, de Lombardía a Sicilia, unida."
 hab_events.40.t: "Fundación de la Hungría real"
 hab_events.40.d: "Buda liberada: la “Hungría real” se convierte en el pilar oriental del Imperio habsburgo."
 hab_events.40.a: "¡Hungría liberada! ¡Viva Buda!"
 hab_events.50.t: "Emperador de Oriente"
 hab_events.50.d: "Constantinopla ha caído en manos habsburgas: las capitales tanto del Imperio romano de Oriente como de Occidente son ahora detentadas como una sola."
 hab_events.50.a: "¡Viva Constantinopla! ¡Viva el Emperador de Oriente!"
 hab_events.55.t: "La Gran Ciudad de Viena"
 hab_events.55.d: "El Palacio de Schönbrunn, la Catedral de San Esteban: Viena concluida como la mayor y más bella ciudad de Europa."
 hab_events.55.a: "¡Viva la Gran Ciudad de Viena!"
 hab_events.65.t: "Bohemia: incorporación como tierra de la corona"
 hab_events.65.d: "La unión personal con Bohemia se ha profundizado, y ha llegado la hora de la plena incorporación. Gobiérnala directamente como tierra de la corona incorporada o mantén la actual unión personal: decide."
 hab_events.65.a: "Incorporar Bohemia como tierra de la corona incorporada"
 hab_events.99.t: "Proclamación del Imperio universal"
 hab_events.99.d: "“El Imperio universal: el emperador habsburgo gobierna de Lisboa, al oeste, a Constantinopla, al este”: esta proclamación resuena por toda Europa."
 hab_events.99.a: "¡Viva el Imperio universal! ¡El Imperio habsburgo para siempre!"
 hab_events.65.b: "Mantener la actual unión personal"
 STATIC_MODIFIER_NAME_hab_army_mod: "Ejército de élite habsburgo"
 STATIC_MODIFIER_DESC_hab_army_mod: "El ejército habsburgo, que combina diversos regimientos nacionales, concluido como la más fuerte fuerza terrestre de Europa."
 STATIC_MODIFIER_NAME_hab_balkans_mod: "Liberación de los Balcanes"
 STATIC_MODIFIER_DESC_hab_balkans_mod: "Los cristianos de los Balcanes liberados del dominio otomano."
 STATIC_MODIFIER_NAME_hab_baroque_mod: "Viena barroca"
 STATIC_MODIFIER_DESC_hab_baroque_mod: "El arte barroco florece en la corte vienesa, haciendo de ella el centro de la cultura europea."
 STATIC_MODIFIER_NAME_hab_boh_loyalty_mod: "Resistencia a la incorporación bohemia"
 STATIC_MODIFIER_DESC_hab_boh_loyalty_mod: "En los salones de Praga, nobles checos murmuran contra la pérdida de sus antiguas libertades."
 STATIC_MODIFIER_NAME_hab_bohemia_mod: "La Corona de Bohemia"
 STATIC_MODIFIER_DESC_hab_bohemia_mod: "La ciudad dorada de Praga se une al Imperio como segunda capital de la casa de Habsburgo."
 STATIC_MODIFIER_NAME_hab_carinthia_mod: "Conquista de Carintia"
 STATIC_MODIFIER_DESC_hab_carinthia_mod: "Carintia se ha convertido en un corredor alpino vital, uniendo norte y sur para el Imperio habsburgo."
 STATIC_MODIFIER_NAME_hab_catholic_mod: "Triunfo de la Contrarreforma"
 STATIC_MODIFIER_DESC_hab_catholic_mod: "Fe católica defendida en todo el Imperio."
 STATIC_MODIFIER_NAME_hab_charlemagne_mod: "El legado de Carlomagno"
 STATIC_MODIFIER_DESC_hab_charlemagne_mod: "El legado imperial de Carlomagno da al Imperio habsburgo nueva legitimidad."
 STATIC_MODIFIER_NAME_hab_croatia_mod: "La frontera militar croata"
 STATIC_MODIFIER_DESC_hab_croatia_mod: "Frontera militar establecida en Croacia, deteniendo la invasión otomana."
 STATIC_MODIFIER_NAME_hab_danubian_mod: "Expansión del Imperio danubiano"
 STATIC_MODIFIER_DESC_hab_danubian_mod: "Bajo Danubio subyugado, completando el dominio habsburgo sobre todos los Balcanes."
 STATIC_MODIFIER_NAME_hab_dynasty_mod: "El despertar de la casa de Habsburgo"
 STATIC_MODIFIER_DESC_hab_dynasty_mod: "La ambición de la casa de Habsburgo avivada: comienza la era de la diplomacia y la conquista."
 STATIC_MODIFIER_NAME_hab_france_mod: "Guerra con Francia"
 STATIC_MODIFIER_DESC_hab_france_mod: "La vieja rival Francia debilitada, abriendo camino a la hegemonía habsburga sobre Europa."
 STATIC_MODIFIER_NAME_hab_graz_mod: "Fortificación de Graz"
 STATIC_MODIFIER_DESC_hab_graz_mod: "Graz desarrollada como ciudad-fortaleza inexpugnable, defendiendo contra la invasión otomana."
 STATIC_MODIFIER_NAME_hab_great_vienna_loc_mod: "La Gran Ciudad de Viena concluida"
 STATIC_MODIFIER_DESC_hab_great_vienna_loc_mod: "Viena concluida como la mayor ciudad de Europa, brillando como capital eterna del Imperio."
 STATIC_MODIFIER_NAME_hab_heartland_mod: "Estabilidad del corazón austríaco"
 STATIC_MODIFIER_DESC_hab_heartland_mod: "El corazón austríaco estable, estableciendo la base de la expansión imperial."
 STATIC_MODIFIER_NAME_hab_hegemon_mod: "Hegemón de Occidente"
 STATIC_MODIFIER_DESC_hab_hegemon_mod: "Ninguna potencia de Europa occidental queda para desafiar la hegemonía habsburga."
 STATIC_MODIFIER_NAME_hab_imperial_mod: "Establecimiento de la autoridad imperial"
 STATIC_MODIFIER_DESC_hab_imperial_mod: "Todo el Sacro Imperio Romano se somete ahora a la orden de la casa de Habsburgo."
 STATIC_MODIFIER_NAME_hab_italian_mod: "Frutos de las guerras de Italia"
 STATIC_MODIFIER_DESC_hab_italian_mod: "Las campañas italianas forjaron el ejército habsburgo en una fuerza de élite."
 STATIC_MODIFIER_NAME_hab_multiethnic_mod: "Establecimiento del Imperio multinacional"
 STATIC_MODIFIER_DESC_hab_multiethnic_mod: "El milagro de la coexistencia de muchas naciones bajo el estandarte habsburgo realizado."
 STATIC_MODIFIER_NAME_hab_north_sea_mod: "Hegemonía en el comercio del Mar del Norte"
 STATIC_MODIFIER_DESC_hab_north_sea_mod: "El comercio del Mar del Norte ha caído bajo control del Imperio habsburgo."
 STATIC_MODIFIER_NAME_hab_ottoman_mod: "Guerra con el Imperio otomano"
 STATIC_MODIFIER_DESC_hab_ottoman_mod: "La victoria sobre el Imperio otomano estableció el reconocimiento del Imperio habsburgo como baluarte de la cristiandad."
 STATIC_MODIFIER_NAME_hab_papal_mod: "Reconciliación con el papa"
 STATIC_MODIFIER_DESC_hab_papal_mod: "Relaciones con el papa establecidas, y la casa de Habsburgo reconocida como guardiana del mundo católico."
 STATIC_MODIFIER_NAME_hab_reform_mod: "Conclusión de la reforma imperial"
 STATIC_MODIFIER_DESC_hab_reform_mod: "La reorganización de las instituciones de gobierno perpetúa el gobierno habsburgo."
 STATIC_MODIFIER_NAME_hab_renaissance_mod: "El Renacimiento de Viena"
 STATIC_MODIFIER_DESC_hab_renaissance_mod: "La luz del Renacimiento brilla en la corte vienesa, haciendo del Imperio el centro de la cultura europea."
 STATIC_MODIFIER_NAME_hab_south_german_mod: "Ciudades comerciales de la Alemania del sur"
 STATIC_MODIFIER_DESC_hab_south_german_mod: "Las ricas ciudades libres de la Alemania meridional se han convertido en el núcleo de la economía imperial."
 STATIC_MODIFIER_NAME_hab_styria_iron_mod: "Las minas de hierro de Leoben"
 STATIC_MODIFIER_DESC_hab_styria_iron_mod: "El hierro de Estiria sustenta el poderío militar del Imperio habsburgo."
 STATIC_MODIFIER_NAME_hab_swiss_mod: "Conquista de Suiza"
 STATIC_MODIFIER_DESC_hab_swiss_mod: "El Estado campesino alpino conquistado, estableciendo la hegemonía habsburga."
 STATIC_MODIFIER_NAME_hab_tercios_mod: "Los tercios españoles"
 STATIC_MODIFIER_DESC_hab_tercios_mod: "La táctica del tercio introducida en todo el ejército habsburgo, dando origen a la mejor infantería de Europa."
 STATIC_MODIFIER_NAME_hab_tuscany_mod: "Prosperidad de la Toscana"
 STATIC_MODIFIER_DESC_hab_tuscany_mod: "La cultura renacentista de Florencia florece bajo la protección del Imperio habsburgo."
 STATIC_MODIFIER_NAME_hab_tyrol_silver_mod: "Las minas de plata de Schwaz"
 STATIC_MODIFIER_DESC_hab_tyrol_silver_mod: "Las minas de plata del Tirol sustentan las finanzas del Imperio habsburgo."
 STATIC_MODIFIER_NAME_hab_universal_empire_mod: "Proclamación del Imperio universal"
 STATIC_MODIFIER_DESC_hab_universal_empire_mod: "“Imperio universal”: toda Europa unida bajo el estandarte habsburgo."
 STATIC_MODIFIER_NAME_hab_venetia_mod: "La conquista de Venecia"
 STATIC_MODIFIER_DESC_hab_venetia_mod: "La “Reina del Adriático” sustenta ahora el poderío naval del Imperio habsburgo."
 STATIC_MODIFIER_NAME_hab_vienna_mod: "Viena, corazón del Imperio"
 STATIC_MODIFIER_DESC_hab_vienna_mod: "Viena brilla como centro cultural y administrativo del Imperio."
 hab_events.40.b: "Mantener las relaciones actuales"
 STATIC_MODIFIER_NAME_hab_hun_loyalty_mod: "Resistencia a la incorporación húngara"
 STATIC_MODIFIER_DESC_hab_hun_loyalty_mod: "En los palacios de Buda, magnates húngaros murmuran contra la pérdida de sus antiguas libertades."
 hab_integrated_crown_desc: "Una tierra de la corona integrada es un tipo especial de vasallo que comparte su gobernante con el emperador habsburgo, tiene diplomacia limitada y permite al soberano construir y desarrollar recursos directamente. No puede ser anexionada durante 100 años."
 STATIC_MODIFIER_NAME_hab_spain_crown_mod: "La conquista de la Corona española"
 STATIC_MODIFIER_DESC_hab_spain_crown_mod: "La Península Ibérica se ha convertido en parte de las posesiones del Imperio habsburgo, abriendo la puerta al imperio en el que el sol nunca se pone."
 STATIC_MODIFIER_NAME_hab_alsace_mod: "La conquista de Alsacia-Lorena"
 STATIC_MODIFIER_DESC_hab_alsace_mod: "El águila bicéfala de los Habsburgo ondea en las fortalezas de frontera a lo largo del Rin, y la defensa occidental está inquebrantable."
 hab_events.30.b: "Seguir gobernando Italia como está"
 hab_events.15.b: "¡Viva el Imperio alemán!"
 hab_events.30.a: "Reorganizar el Reino de Italia como tierra de la corona integrada"
 STATIC_MODIFIER_NAME_hab_hre_unity_mod: "Unificación del Sacro Imperio Romano"
 STATIC_MODIFIER_DESC_hab_hre_unity_mod: "El Sacro Imperio Romano unificado, y los caminos y ejércitos del Imperio ligados en uno."
 STATIC_MODIFIER_NAME_hab_ger_empire_mod: "Nacimiento del Imperio alemán"
 STATIC_MODIFIER_DESC_hab_ger_empire_mod: "El Imperio alemán proclamado, y el ejército disciplinado y poderoso anuncia su nacimiento."
 STATIC_MODIFIER_NAME_hab_rome_legacy_mod: "El legado de los emperadores romanos"
 STATIC_MODIFIER_DESC_hab_rome_legacy_mod: "Aclamada heredera de los emperadores romanos, la casa de Habsburgo ve su corte llena de clérigos y eruditos de todo el mundo cristiano."
 hab_stadtrechtsbriefe: "Emite las Stadtrechtsbriefe"
 hab_stadtrechtsbriefe_desc: "Stadtrechtsbriefe: “cartas de derecho urbano”. Bajo la fuerte autoridad real del emperador habsburgo, concede privilegios a las ciudades de todo el reino: el derecho urbano de Viena para Viena y los derechos landstadt a las ciudades imperiales en otros lugares."
 hab_stadtrechtsbriefe_unlock_tt: "Desbloquea los privilegios urbanos Derecho urbano de Viena y Landstadt."
 hab_innsbruck_court: "La corte de Innsbruck"
 hab_innsbruck_court_desc: "Innsbruck: ahora que esta ciudad central del Tirol se ha convertido en una verdadera ciudad, establece aquí una corte como nudo de la cultura alpina de los Habsburgo."
 hab_swarovski_crystal: "El cristal Swarovski"
 hab_swarovski_crystal_desc: "Desde 1737, los vidrieros de Innsbruck perfeccionaban el arte del corte fino del cristal: mucho antes del nacimiento del propio Swarovski, el cristal tirolés ya adornaba las cortes de Europa."
 STATIC_MODIFIER_NAME_hab_innsbruck_loc_mod: "Desarrollo de la corte de Innsbruck"
 STATIC_MODIFIER_DESC_hab_innsbruck_loc_mod: "Innsbruck ha empezado a brillar como nudo de la cultura alpina de los Habsburgo."
 STATIC_MODIFIER_NAME_hab_swarovski_mod: "Industria del cristal del Tirol"
 STATIC_MODIFIER_DESC_hab_swarovski_mod: "Los vidrieros de Innsbruck han perfeccionado el arte del corte fino del cristal."
 STATIC_MODIFIER_NAME_wiener_stadtrecht_town_rights: "Derecho urbano de Viena"
 STATIC_MODIFIER_DESC_wiener_stadtrecht_town_rights: "Derecho urbano especial, concedido solo a Viena: los beneficios en el comercio y los mercados sustentan la prosperidad de Viena."
 STATIC_MODIFIER_NAME_landstadt_town_rights: "Landstadt"
 STATIC_MODIFIER_DESC_landstadt_town_rights: "Derecho urbano concedido a las ciudades imperiales: mejora la red viaria, equilibrando el poder de la corona y la influencia noble."
