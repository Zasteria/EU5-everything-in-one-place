l_spanish:
 hun_crown_of_saint_stephen_mission_pack: "La Corona de San Esteban"
 hun_crown_of_saint_stephen_mission_pack_DESCRIPTION:0 "En 1337, el Reino de Hungría está gobernado por el rey Carlos I (Carlos Roberto) de la dinastía angevina. Su sucesor, el magnífico Luis —más tarde conocido como Luis el Grande— espera su hora, con la unión personal con Polonia llegando en la próxima generación. Este reino, centrado en la Cuenca de los Cárpatos, alberga ambiciones en todas direcciones: al norte, por Polonia y Bohemia; al sur, hacia los Balcanes; al este, contra los otomanos; y al oeste, hacia el Adriático. Construye el Ejército Negro, trae el Renacimiento a Buda y conviértete en el Baluarte de la cristiandad."
 hun_crown_of_saint_stephen_mission_pack_CRITERIA_DESCRIPTION:0 "Como Hungría, expándete al norte por Polonia y Bohemia, asegura los Balcanes, derrota a los otomanos, alcanza el Adriático y completa las reformas internas."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para reconstruir la gloria de la Corona de San Esteban."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_DETAILS:0 "De la dinastía angevina a la era de Matías Corvino: ¡los mayores días de Hungría aguardan!"
 hun_crown_of_st_stephen: "La Corona de San Esteban"
 hun_crown_of_st_stephen_desc: "San Esteban I fundó el Reino de Hungría en el año 1000 d. C., conduciendo la conversión al cristianismo. La Corona de San Esteban —la Santa Corona— permanece hasta hoy como símbolo sagrado de la dignidad real húngara. En 1337, la dinastía angevina porta esta corona y gobierna el mayor reino de Europa central. Asegura Buda y Esztergom y refuerza los cimientos del reino."
 hun_angevin_diplomacy: "Diplomacia angevina"
 hun_angevin_diplomacy_desc: "La dinastía angevina de Hungría tiene complejos lazos dinásticos con Nápoles, Polonia y Bohemia. La madre de Luis I, Isabel, era hermana del rey polaco Casimiro III, abriendo la perspectiva de heredar la corona polaca. Construye una red de alianzas y eleva la influencia diplomática angevina en toda Europa central."
 hun_polish_union: "Unión personal con Polonia"
 hun_polish_union_desc: "Cuando Casimiro III el Grande murió sin heredero varón en 1370, su sobrino Luis I de Hungría (de la casa de Anjou) heredó el trono polaco. Fue el comienzo de la unión personal húngaro-polaca. Dos grandes reinos, unidos bajo un solo rey: el equilibrio de poder en Europa central cambia por completo."
 hun_bohemian_ambitions: "Ambiciones sobre Bohemia"
 hun_bohemian_ambitions_desc: "El Reino de Bohemia, sede de la herejía husita, está dividido por convulsiones religiosas. Mientras angevinos, luxemburgueses y Habsburgo disputan la corona bohemia, Hungría también tiene una reivindicación legítima. Tomar Praga crea una monarquía dual húngaro-bohemia en el corazón de Europa central."
 hun_lord_of_the_north: "Señor del Norte"
 hun_lord_of_the_north_desc: "Tomar Cracovia y Gdansk extiende el dominio húngaro hasta el Mar Báltico, creando un vasto imperio de Europa central, del Adriático al Báltico. La gloria de las dinastías piasta y angevina de Polonia renace bajo la corona húngara."
 hun_conquer_serbia: "Conquista Serbia"
 hun_conquer_serbia_desc: "El Reino de Serbia se convirtió en vasallo otomano tras la batalla de Kosovo (1389). Pero, para Hungría, Belgrado (Nándorfehérvár) es la llave insustituible de la defensa del Danubio. En 1440, la legendaria defensa de Belgrado por Skanderbeg y Hunyadi János contra los otomanos: que esa batalla se dé aquí."
 hun_subjugate_wallachia: "Subyuga Valaquia"
 hun_subjugate_wallachia_desc: "Valaquia (Havasalföld) ha reconocido históricamente la suzeranía húngara. Vlad II —padre de Vlad el Empalador— recibió la Orden del Dragón del rey húngaro Segismundo. Establece con firmeza este Estado tapón bajo influencia húngara."
 hun_subjugate_moldavia: "Subyuga Moldavia"
 hun_subjugate_moldavia_desc: "Moldavia se halla entre el delta del Danubio y Polonia, disputada entre Hungría, Polonia y los otomanos. Traer este principado con firmeza a la suzeranía húngara asegura la frontera oriental."
 hun_danube_fortress_line: "La línea de fortalezas del Danubio"
 hun_danube_fortress_line_desc: "El sistema végvár —la red de fortalezas fronterizas de Hungría— fue la más sofisticada estructura defensiva antiotomana de la Europa del siglo XV. Decenas de fortalezas a lo largo del Danubio se comunicaban entre sí, formando una línea de alerta temprana y defensa que detenía las ofensivas otomanas hasta la muerte. El sistema hizo de Hungría el verdadero primer escudo de la cristiandad."
 hun_order_of_the_dragon: "La Orden del Dragón"
 hun_order_of_the_dragon_desc: "La Orden del Dragón fue una orden de caballería fundada por el rey Segismundo de Hungría en 1408. Vlad II, Skanderbeg y Hunyadi János estaban entre sus miembros. Esta orden unió a la nobleza húngara bajo la bandera de la cruzada antiotomana, encarnando la misión de guardiana de la cristiandad."
 hun_crusade_preparations: "Preparativos para la cruzada"
 hun_crusade_preparations_desc: "Hunyadi János fue el mayor cruzado antiotomano del siglo XV. Su Larga Campaña de 1442-43 repelió a los otomanos, dando esperanza a la cristiandad. Pero la batalla de Varna, en 1444, destruyó al ejército cruzado polaco-húngaro. Esta vez, entra preparado."
 hun_battle_of_nicopolis: "La batalla de Nicópolis"
 hun_battle_of_nicopolis_desc: "En 1396, el ejército cruzado bajo el rey Segismundo de Hungría fue aplastado en la batalla de Nicópolis: derrota que consolidó el dominio otomano sobre los Balcanes. Pero esta vez es diferente: una Hungría plenamente preparada toma Nicópolis y abre la puerta a la recuperación de los Balcanes. El nombre de Hunyadi resuena por toda Europa."
 hun_black_army: "El Ejército Negro"
 hun_black_army_desc: "El Ejército Negro (Fekete Sereg), creado por el rey Matías Corvino hacia 1458, fue la más avanzada fuerza militar profesional de la Europa contemporánea: una combinación de mercenarios y tropas permanentes en armaduras negras, que adoptó con audacia las armas de fuego. A pesar del enorme coste de mantenimiento, este ejército era temido tanto por otomanos como por Habsburgo. Es la clave de la hegemonía húngara."
 hun_bulwark_of_christendom: "Baluarte de la cristiandad"
 hun_bulwark_of_christendom_desc: "Durante siglos Hungría luchó en la línea de frente de la cristiandad contra el Imperio otomano. Ahora, habiendo sido los otomanos totalmente expulsados de Europa, el papa, el emperador y los príncipes de Europa colman al rey de Hungría de la más alta honra: Antemurale Christianitatis, Baluarte de la cristiandad."
 hun_croatian_union: "Unión con Croacia"
 hun_croatian_union_desc: "Desde el Pacta Conventa de 1102, Croacia está en unión personal con Hungría: los nobles croatas aceptaron al rey húngaro como suyo a cambio de amplia autonomía. Refuerza esta histórica unión y asegura la puerta de Hungría al Adriático."
 hun_reclaim_dalmatia: "Recupera Dalmacia"
 hun_reclaim_dalmatia_desc: "El litoral dálmata formó parte del reino húngaro-croata hasta que Venecia lo compró en 1409. Recuperar Split y Ragusa (Dubrovnik) restaura el acceso garantizado al Adriático y abre el camino a Italia."
 hun_adriatic_supremacy: "Supremacía en el Adriático"
 hun_adriatic_supremacy_desc: "Ha llegado la hora de poner fin al antiguo monopolio de Venecia sobre el Adriático, la “Novia del Adriático”. La flota húngaro-croata alzará su bandera sobre el Mar Adriático."
 hun_angevin_naples: "La reivindicación angevina a Nápoles"
 hun_angevin_naples_desc: "La dinastía angevina de Hungría reclama el trono napolitano. Luis I ocupó Nápoles dos veces, en 1347 y 1350. Ha llegado la hora de concretar para siempre la reivindicación angevina: que el rey de Hungría gobierne Nápoles para siempre."
 hun_strengthen_estates: "Fortalece los estamentos"
 hun_strengthen_estates_desc: "La nobleza y el clero húngaros conquistaron amplios privilegios en la Bula de Oro (Aranybulla) de 1222. Apoyándote en esta tradición de política estamental, obtener el apoyo de la nobleza y el clero refuerza la legitimidad real. Pero cuidado: las concesiones excesivas traerán problemas después. Mantén el equilibrio adecuado."
 hun_tripartitum: "El Tripartitum"
 hun_tripartitum_desc: "El Tripartitum, redactado por István Werbőczy en 1514, fue una codificación sistemática del derecho consuetudinario húngaro. Definía los privilegios nobles, las obligaciones campesinas y el poder real. Este código se convirtió en la base del derecho húngaro, aunque su codificación de la servidumbre también contribuyó a la revuelta campesina de György Dózsa en 1514."
 hun_matthias_reforms: "Las reformas del rey Matías"
 hun_matthias_reforms_desc: "El rey Matías Corvino (reinó 1458-90), llamado “el Justo”, fue el mayor de los reyes húngaros. La tributación centralizada, el Ejército Negro profesional y la adopción agresiva de la cultura renacentista transformaron Hungría en el Estado más fuerte de Europa central."
 hun_buda_renaissance: "El Renacimiento en Buda"
 hun_buda_renaissance_desc: "La corte del rey Matías trajo el Renacimiento italiano a Hungría. La Bibliotheca Corviniana, en el palacio de Buda, albergaba miles de manuscritos latinos y griegos, atrayendo eruditos y artistas de toda Europa. Este florecimiento cultural hace de Hungría el centro cultural de Europa central."
 hun_great_hungary: "La Gran Hungría"
 hun_great_hungary_desc: "Balcanes, Polonia, Bohemia, Dalmacia: el Reino de Hungría ha crecido como gran imperio mucho más allá de la Cuenca de los Cárpatos. El Ejército Negro, la corte renacentista de Buda, la línea de fortalezas del Danubio: todo esto junto ha creado una Hungría más poderosa que nunca."
 hun_glory_of_st_stephen: "La gloria de la Corona de San Esteban"
 hun_glory_of_st_stephen_desc: "El Reino de San Esteban, fundado hace mil años, se ha convertido en un gran imperio, que domina Europa central y los Balcanes. Del Báltico, al norte, al Adriático y al Mediterráneo, al sur, de los Cárpatos al este: la Corona de San Esteban brilla con un esplendor inaudito. Aclamado como Baluarte de la cristiandad, la gloria de Hungría ha alcanzado su absoluto apogeo."
 hun_events.99.t: "La gloria de la Corona de San Esteban"
 hun_events.99.d: "El reino de San Esteban —antaño confinado a la Cuenca de los Cárpatos— se extiende ahora del Báltico al Adriático y al Mediterráneo. Polonia, Bohemia y Croacia unidas bajo la corona húngara; los otomanos expulsados de los Balcanes; la reivindicación angevina a Nápoles realizada. La corte renacentista de Buda es celebrada en toda Europa; el Ejército Negro es temido por todo enemigo. La Corona de San Esteban brilla con el mayor esplendor de toda su historia milenaria."
 hun_events.99.a: "¡San Esteban, hemos cumplido tu sueño!"
 STATIC_MODIFIER_NAME_hun_angevin_prestige_mod: "Prestigio angevino"
 STATIC_MODIFIER_DESC_hun_angevin_prestige_mod: "En 1308, el príncipe angevino Carlos (Carlos Roberto) heredó el trono húngaro. Los lazos dinásticos de esta dinastía ligaron a Hungría con Nápoles, Sicilia, Provenza y Polonia, lanzando a Hungría al centro de la diplomacia europea. La corte papal en Aviñón y los Habsburgo en Viena no podían permitirse ignorar esta corte angevina."
 STATIC_MODIFIER_NAME_hun_angevin_diplomacy_mod: "Red diplomática angevina"
 STATIC_MODIFIER_DESC_hun_angevin_diplomacy_mod: "Cartas de las princesas angevinas, casadas de Nápoles a Polonia, llegan sin cesar a la corte de Visegrád."
 STATIC_MODIFIER_NAME_hun_bohemian_crown_mod: "La Corona de Bohemia"
 STATIC_MODIFIER_DESC_hun_bohemian_crown_mod: "Con la corona bohemia asegurada, se forma la trimonarquía húngaro-polaco-bohemia."
 STATIC_MODIFIER_NAME_hun_northern_lord_mod: "Señor del Norte"
 STATIC_MODIFIER_DESC_hun_northern_lord_mod: "Con acceso al Báltico, Hungría se ha convertido en una gran potencia que controla el importante comercio del norte y de Europa oriental."
 STATIC_MODIFIER_NAME_hun_wallachian_buffer_mod: "Estado tapón valaco"
 STATIC_MODIFIER_DESC_hun_wallachian_buffer_mod: "Valaquia actúa como Estado tapón húngaro, asegurando la frontera oriental."
 STATIC_MODIFIER_NAME_hun_moldavian_buffer_mod: "Estado tapón moldavo"
 STATIC_MODIFIER_DESC_hun_moldavian_buffer_mod: "Moldavia bajo influencia húngara da una doble capa de seguridad a la frontera oriental."
 STATIC_MODIFIER_NAME_hun_vegvar_system_mod: "El sistema de fortalezas végvár"
 STATIC_MODIFIER_DESC_hun_vegvar_system_mod: "Una red organizada de fortalezas a lo largo del Danubio bloquea sistemáticamente los avances otomanos. Hungría se convierte en el escudo delantero de la cristiandad."
 STATIC_MODIFIER_NAME_hun_dragon_order_mod: "La Orden del Dragón"
 STATIC_MODIFIER_DESC_hun_dragon_order_mod: "La Orden del Dragón del rey Segismundo une a la nobleza y al ejército en una sola causa. Se convierte en la columna vertebral espiritual de la cruzada antiotomana."
 STATIC_MODIFIER_NAME_hun_crusade_zeal_mod: "Celo de cruzada"
 STATIC_MODIFIER_DESC_hun_crusade_zeal_mod: "El celo de cruzada, reunido bajo las banderas de Hunyadi János, aún arde en los corazones de los soldados."
 STATIC_MODIFIER_NAME_hun_black_army_mod: "El Ejército Negro"
 STATIC_MODIFIER_DESC_hun_black_army_mod: "El Fekete Sereg —el Ejército Negro— creado por Matías Corvino, fue la más moderna fuerza militar de la Europa contemporánea: decenas de miles de mercenarios y tropas permanentes, en armaduras negras. Construido en torno a un núcleo de caballeros husitas de Bohemia, adoptaba con audacia las armas de fuego e infundía miedo tanto en los otomanos como en los Habsburgo. El coste mortal pesaba sobre el tesoro real, pero sin este ejército Hungría no habría sobrevivido entre tales gigantes."
 STATIC_MODIFIER_NAME_hun_christendom_bulwark_mod: "Baluarte de la cristiandad"
 STATIC_MODIFIER_DESC_hun_christendom_bulwark_mod: "Habiendo expulsado a los otomanos de Europa, Hungría porta la honra de Antemurale Christianitatis."
 STATIC_MODIFIER_NAME_hun_adriatic_coast_mod: "Litoral adriático asegurado"
 STATIC_MODIFIER_DESC_hun_adriatic_coast_mod: "La recuperación de Dalmacia da a Hungría acceso directo al Mar Adriático."
 STATIC_MODIFIER_NAME_hun_angevin_italy_mod: "La Italia angevina"
 STATIC_MODIFIER_DESC_hun_angevin_italy_mod: "Los angevinos húngaros gobiernan el sur de Italia por medio de Nápoles."
 STATIC_MODIFIER_NAME_hun_golden_bull_mod: "La tradición de la Bula de Oro"
 STATIC_MODIFIER_DESC_hun_golden_bull_mod: "El sistema estamental, heredero del espíritu de la Bula de Oro de 1222, sustenta la estabilidad del reino."
 STATIC_MODIFIER_NAME_hun_tripartitum_mod: "El Tripartitum"
 STATIC_MODIFIER_DESC_hun_tripartitum_mod: "El Tripartitum, redactado por István Werbőczy en 1514, fue la cumbre del derecho consuetudinario húngaro: tres partes, que abarcan la “misma y única libertad” de la nobleza, la servidumbre del campesinado y el poder real. La sangrienta revuelta campesina de Dózsa fue su precio. Y, sin embargo, este código siguió siendo la base de la sociedad húngara durante siglos."
 STATIC_MODIFIER_NAME_hun_matthias_admin_mod: "Las reformas del rey Matías"
 STATIC_MODIFIER_DESC_hun_matthias_admin_mod: "Matías era llamado “el Justo” (Igazságos Mátyás), pues juzgaba sin distinción de estamento y protegía a los campesinos de la opresión de los barones. Construyó una burocracia centralizada, domó el poder de los magnates y extendió la autoridad real directamente a las tierras rurales. Su reinado es recordado como la más perfecta expresión de la realeza húngara en la historia."
 STATIC_MODIFIER_NAME_hun_buda_renaissance_mod: "El Renacimiento en Buda"
 STATIC_MODIFIER_DESC_hun_buda_renaissance_mod: "La corte de Matías atrajo humanistas, arquitectos, escultores y músicos de toda Italia. El palacio de Buda fue reconstruido en estilo renacentista —más espléndido que Viena— y la Bibliotheca Corviniana albergaba más de cinco mil manuscritos de textos clásicos griegos y romanos. Cuando Matías murió, un humanista escribió: “Matías ha muerto. La justicia ha muerto”."
 STATIC_MODIFIER_NAME_hun_great_hungary_mod: "La Gran Hungría"
 STATIC_MODIFIER_DESC_hun_great_hungary_mod: "El gran imperio húngaro, que abarca Europa central, los Balcanes y el Adriático, concluido."
 hun_baltic_trade: "Comercio báltico"
 hun_baltic_trade_desc: "Gdansk —nudo clave de la Liga Hanseática— es la puerta entre el Mar del Norte y el Báltico. El control húngaro de este puerto abre acceso al comercio báltico de ámbar, pieles y madera, asegurando una ruta directa a Europa occidental. Es el punto de inflexión en que Hungría se transforma de Estado agrario interior en potencia comercial marítima."
 hun_hre_influence: "Influencia sobre el Sacro Imperio Romano"
 hun_hre_influence_desc: "Con Polonia y Bohemia aseguradas, Hungría se ha convertido en la más poderosa vecina del Sacro Imperio Romano. Amplía la influencia húngara sobre los príncipes alemanes mediante reputación diplomática y múltiples alianzas, contrarrestando la hegemonía habsburga."
 hun_challenge_habsburgs: "Desafía a los Habsburgo"
 hun_challenge_habsburgs_desc: "La dinastía Habsburgo de Austria fue la rival perenne de Hungría. Tomar Viena transfiere la hegemonía del Danubio a Hungría. La mayor ambición húngara —derrocar a los Habsburgo y convertirse en emperador del Sacro Imperio— se realiza aquí."
 hun_conquer_bulgaria: "Conquista Bulgaria"
 hun_conquer_bulgaria_desc: "El Segundo Imperio búlgaro fue destruido por los otomanos en 1396. Pero con Hungría dominando ahora los Balcanes, Sofía y Tarnovo pueden recuperarse, resucitando el legado búlgaro bajo la corona húngara."
 hun_conquer_greece: "Conquista Grecia"
 hun_conquer_greece_desc: "Atenas y Salónica —dos grandes ciudades de la antigua civilización griega— caen ante Hungría. Une los principados griegos divididos tras la caída de Bizancio y extiende el estandarte húngaro hasta el extremo meridional de los Balcanes."
 hun_balkan_empire: "El Imperio balcánico"
 hun_balkan_empire_desc: "Serbia, Bulgaria, Grecia, Valaquia, Moldavia: toda la Península Balcánica bajo dominio húngaro. La hegemonía que Bizancio y, después, los otomanos ejercieron sobre los Balcanes pertenece ahora plenamente a Hungría."
 hun_push_into_anatolia: "Avanza sobre Anatolia"
 hun_push_into_anatolia_desc: "Con Constantinopla asegurada, Hungría abarca ahora dos continentes. Inicia una cruzada para recuperar las tierras anatolias que Bizancio perdió y golpea el corazón del Imperio otomano."
 hun_hungarian_crusade: "La Cruzada húngara"
 hun_hungarian_crusade_desc: "El rey húngaro que liberó Jerusalén se convierte en héroe de toda la cristiandad. El sueño desde San Esteban —el retorno de Tierra Santa a manos cristianas— se realiza por fin. La victoria cruzada con que soñó Segismundo, fundador de la Orden del Dragón, está aquí inscrita."
 hun_mediterranean_fleet: "La flota mediterránea"
 hun_mediterranean_fleet_desc: "Con Nápoles y Sicilia aseguradas, Hungría se ha convertido en gran potencia naval mediterránea. Una flota de treinta o más navíos disputa el control del Mediterráneo. El mar, antaño monopolizado por Venecia, pertenece ahora a Hungría."
 hun_conquer_north_africa: "Conquista el norte de África"
 hun_conquer_north_africa_desc: "La toma de Túnez extiende el territorio húngaro a la orilla sur del Mediterráneo. Aplasta las bases de los piratas berberiscos y retira obstáculos al comercio mediterráneo. El estandarte húngaro ondea en el extremo sur del Mediterráneo."
 hun_latin_empire: "Restauración del Imperio latino"
 hun_latin_empire_desc: "Con Constantinopla, Roma y Nápoles aseguradas, el rey de Hungría puede proclamarse heredero del Imperio latino. El sueño de la Cuarta Cruzada de 1204 se realiza ahora mediante conquista legítima. Nace el mayor imperio cristiano de la historia."
 hun_corvinus_library: "Bibliotheca Corviniana"
 hun_corvinus_library_desc: "La Bibliotheca Corviniana del rey Matías fue la mayor colección de manuscritos latinos y griegos de la Europa contemporánea: más de cinco mil códices, guardados en el palacio de Buda, que atraían a eruditos y artistas de Italia, Francia y Alemania. Esta inversión cultural transforma a Hungría en el centro cultural de Europa central."
 hun_hungarian_church: "La Iglesia húngara"
 hun_hungarian_church_desc: "Centrada en la archidiócesis de Esztergom, refuerza la Iglesia católica húngara y asegura el apoyo espiritual. Antes de que lleguen las olas de la Reforma, establece con firmeza las relaciones entre la Iglesia católica y la autoridad real de Hungría."
 hun_economic_powerhouse: "El Danubio Dorado"
 hun_economic_powerhouse_desc: "Hungría, que abarca los Balcanes, el norte y el Adriático, está en la encrucijada de varias grandes rutas comerciales: un gigante económico. La producción agrícola del Danubio, las minas de plata de Transilvania y los ingresos del comercio mediterráneo se juntan para generar enorme riqueza."
 hun_danube_empire: "El Imperio danubiano"
 hun_danube_empire_desc: "Polonia, Bohemia, Balcanes, Adriático, Mediterráneo: todo bajo dominio húngaro, con sofisticadas instituciones administrativas y una floreciente base económica. Hungría se ha convertido en el “Imperio danubiano”, con centro en el gran río. El Estado compuesto multinacional con que antaño soñaron los austrohúngaros, ahora realizado bajo liderazgo húngaro."
 STATIC_MODIFIER_NAME_hun_baltic_trade_mod: "Comercio báltico"
 STATIC_MODIFIER_DESC_hun_baltic_trade_mod: "Navíos mercantes húngaros, anclados en el puerto de Gdansk, vuelven cargados de ámbar y pieles."
 STATIC_MODIFIER_NAME_hun_habsburg_rival_mod: "Hungría-Austria"
 STATIC_MODIFIER_DESC_hun_habsburg_rival_mod: "La caída de Viena aplasta el poder de los Habsburgo, haciendo de Hungría señora del Danubio."
 STATIC_MODIFIER_NAME_hun_bulgaria_mod: "Dominio búlgaro"
 STATIC_MODIFIER_DESC_hun_bulgaria_mod: "Nuevos gobernadores en la colina de Tarnovo difunden la lengua y el derecho húngaros por las aldeas de los Balcanes meridionales."
 STATIC_MODIFIER_NAME_hun_greece_mod: "La luz de Grecia"
 STATIC_MODIFIER_DESC_hun_greece_mod: "El rey de Hungría, contemplando la Acrópolis de Atenas, adopta la gloria de la antigua Grecia como orgullo de su propia corte."
 STATIC_MODIFIER_NAME_hun_balkan_empire_mod: "El Imperio balcánico"
 STATIC_MODIFIER_DESC_hun_balkan_empire_mod: "Del Danubio al Peloponeso, el estandarte de la Corona de San Esteban ondea desde cada muralla de los Balcanes."
 STATIC_MODIFIER_NAME_hun_new_crusade_mod: "La nueva cruzada"
 STATIC_MODIFIER_DESC_hun_new_crusade_mod: "Los soldados que han cruzado las puertas de Constantinopla juran llevar de nuevo la cruz aún más al este."
 STATIC_MODIFIER_NAME_hun_crusade_victory_mod: "Cruzada concluida"
 STATIC_MODIFIER_DESC_hun_crusade_victory_mod: "La gloria de la liberación de Jerusalén trae a Hungría prestigio, legitimidad y poder diplomático inéditos."
 STATIC_MODIFIER_NAME_hun_med_fleet_mod: "La flota mediterránea"
 STATIC_MODIFIER_DESC_hun_med_fleet_mod: "Desde los puertos del Adriático, galeras bajo el estandarte del rey húngaro salen una tras otra rumbo al Mediterráneo."
 STATIC_MODIFIER_NAME_hun_north_africa_mod: "Base norteafricana"
 STATIC_MODIFIER_DESC_hun_north_africa_mod: "A lo largo de la costa del norte de África, mercaderes húngaros y escuadras cazadoras de corsarios pasan sin cesar de puerto en puerto."
 STATIC_MODIFIER_NAME_hun_latin_empire_mod: "Restauración del Imperio latino"
 STATIC_MODIFIER_DESC_hun_latin_empire_mod: "El nombre del rey que posee Constantinopla, Roma y Nápoles se pronuncia con temor en todas las cortes."
 STATIC_MODIFIER_NAME_hun_corvinus_library_mod: "Bibliotheca Corviniana"
 STATIC_MODIFIER_DESC_hun_corvinus_library_mod: "En el scriptorium de la Biblioteca Corviniana, los escribas copian manuscritos a la luz de las lámparas, día y noche."
 STATIC_MODIFIER_NAME_hun_church_mod: "La Iglesia húngara"
 STATIC_MODIFIER_DESC_hun_church_mod: "Una fuerte Iglesia húngara trae legitimidad, eficiencia legislativa y estabilidad religiosa."
 STATIC_MODIFIER_NAME_hun_economy_mod: "El Danubio Dorado"
 STATIC_MODIFIER_DESC_hun_economy_mod: "Las barcazas que remontan el Danubio y las carretas de las minas mantienen siempre animados los mercados del reino."
 STATIC_MODIFIER_NAME_hun_danube_empire_mod: "El Imperio danubiano"
 STATIC_MODIFIER_DESC_hun_danube_empire_mod: "El Imperio danubiano multinacional, centrado en el gran río, concluido. Impuestos, población, administración y eficiencia legislativa alcanzan su cenit."
 hun_transylvanian_mines: "Las ciudades mineras de la Alta Hungría"
 hun_transylvanian_mines_desc: "Kremnica (Körmöcbánya) contiene la mayor casa de la moneda de oro de Hungría. Banská Bystrica (Besztercebánya) es famosa por las mayores minas de cobre de Europa central. Asegurar estas dos ciudades hace de Hungría el primer Estado minero de Europa central. Matías Corvino reorganizó esta región con posesión imperial en 1467-68, usando los ingresos mineros para financiar el Ejército Negro."
 hun_silver_mines: "Las minas de plata de Banská Štiavnica"
 hun_silver_mines_desc: "La región de Hont (que incluye Banská Štiavnica) es el mayor distrito de minería de plata de la Alta Hungría. La plata de esta tierra se acuñaba en táleros en la casa de la moneda real, sustentando el comercio por toda Europa central. Las “ciudades mineras de la Alta Hungría” son el corazón económico del reino."
 hun_salt_mines: "Las minas de sal de Transilvania"
 hun_salt_mines_desc: "Sighet (Máramarossziget) y Turda extraen sal gema desde la Antigüedad. La sal fue llamada “oro blanco”: mercancía tan vital que el monopolio real de la sal de Hungría era un pilar crítico de las finanzas de la corona. Asegura estas minas de sal y establece el monopolio del comercio de sal."
 hun_tokaj_wine: "Los vinos de Tokaj"
 hun_tokaj_wine_desc: "La región de Tokaj, en torno a Sátoraljaújhely, produce el Tokaji Aszú: “Vino de reyes, rey de vinos”. Tan celebrado que el papa Benedicto XIV lo regaló a Luis XV de Francia, este vino de podredumbre noble de las colinas húngaras es el más famoso de Europa. Desarrolla los viñedos y exporta el mejor vino de Europa."
 hun_mining_empire: "El Imperio minero"
 hun_mining_empire_desc: "El oro de Kremnica, la plata de Hont, el cobre de Banská Bystrica y la sal de Sighet y Turda: toda la riqueza mineral de Hungría está ahora asegurada. Como primer Estado minero de Europa central, Hungría obtiene enormes ingresos de la exportación de metales. Esta riqueza financió el Ejército Negro de Matías y la gloria de su corte renacentista."
 hun_buda_capital: "Desarrolla Buda y Pest"
 hun_buda_capital_desc: "Buda y Pest, que se enfrentan por el Danubio, son el corazón del Reino de Hungría. El palacio real y el gran mercado de Buda, el puerto comercial de Pest: cuando esta ciudad doble prospera, toda Hungría florece. La corte de Matías era la mayor de Europa y celebrada como centro del Renacimiento de Europa central."
 hun_upper_hungary_cities: "Las ciudades de la Alta Hungría"
 hun_upper_hungary_cities_desc: "Bratislava (Pozsony) guarda las puertas occidentales contra los Habsburgo; Košice (Kassa) es la mayor ciudad comercial de la Alta Hungría; Trnava (Nagyszombat) es sede episcopal. El desarrollo de estas tres ciudades hace de la Alta Hungría (la actual Eslovaquia) el eje económico y político del norte."
 hun_pannonian_cities: "Las ciudades de Panonia"
 hun_pannonian_cities_desc: "Győr (Rába) guarda la frontera austríaca; Sopron (Ödenburg) es una rica ciudad comercial de la Hungría occidental; Pécs (Fünfkirchen) alberga una de las más antiguas universidades de Europa central, fundada por Luis I en 1367. Desarrolla estas ciudades panonias para que la Hungría occidental prospere."
 hun_great_plain_cities: "Las ciudades de la Gran Llanura"
 hun_great_plain_cities_desc: "Debrecen (centro del calvinismo húngaro), Szeged (llave del río Tisza), Kecskemét (ciudad pastoril de la Gran Llanura): desarrolla las principales ciudades de la púszta húngara y abre el potencial agrícola de esta vasta estepa. El ganado, las ovejas y los cereales de la Gran Llanura se convertirán en la principal exportación de Hungría."
 hun_transylvania_cities: "Las ciudades de Transilvania"
 hun_transylvania_cities_desc: "Cluj (Kolozsvár) es el corazón político y cultural de Transilvania; Oradea (Nagyvárad) es gran ciudad de peregrinación, que guarda las reliquias de San Ladislao; Miskolc es centro industrial del noreste de Hungría. Integra la región multiétnica de Transilvania mediante el desarrollo urbano."
 hun_kingdom_of_cities: "El Reino de las ciudades"
 hun_kingdom_of_cities_desc: "El oro de Kremnica, la plata de Hont, el vino de Tokaj, la corte de Buda, el comercio de Košice, la universidad de Pécs, la agricultura de Debrecen, la cultura de Cluj: cada ciudad del Reino de Hungría opera en armonía orgánica. La mayor zona económica de Europa central concluida. La prosperidad urbana es la verdadera fuente del poder imperial húngaro."
 STATIC_MODIFIER_NAME_hun_kremnica_mint_mod: "La Casa de la Moneda real de Kremnica"
 STATIC_MODIFIER_DESC_hun_kremnica_mint_mod: "La casa de la moneda de Kremnica fue fundada por Carlos I de Hungría en 1328, en Körmöcbánya. El “florín” de oro (forint) acuñado aquí era considerado de calidad igual al florín florentino, y circulaba del Báltico a Constantinopla. Los cuidadosos estándares de la casa de la moneda hicieron de ella la columna vertebral monetaria del comercio de Europa central."
 STATIC_MODIFIER_NAME_hun_banska_copper_mod: "Las minas de cobre de Banská Bystrica"
 STATIC_MODIFIER_DESC_hun_banska_copper_mod: "En los pozos de Banská Bystrica, el sonido de los martillos que cortan el cobre no cesa."
 STATIC_MODIFIER_NAME_hun_hont_silver_mod: "Las minas de plata de Banská Štiavnica"
 STATIC_MODIFIER_DESC_hun_hont_silver_mod: "La plata extraída de las minas de Hont es llevada a la casa de la moneda real."
 STATIC_MODIFIER_NAME_hun_salt_mine_mod: "La mina de sal gema"
 STATIC_MODIFIER_DESC_hun_salt_mine_mod: "Las galerías de sal gema, excavadas desde tiempos romanos, aún abastecen las mesas del reino."
 STATIC_MODIFIER_NAME_hun_tokaj_wine_mod: "Los viñedos del Tokaji Aszú"
 STATIC_MODIFIER_DESC_hun_tokaj_wine_mod: "Las uvas de podredumbre noble, maduras en las colinas de Tokaj, viajan a las cortes de muchas tierras como “vino de reyes”."
 STATIC_MODIFIER_NAME_hun_buda_capital_mod: "Capital real Buda"
 STATIC_MODIFIER_DESC_hun_buda_capital_mod: "Desde las ventanas del palacio real de Buda, que contempla el Danubio, las velas de los mercantes que pasan son siempre visibles."
 STATIC_MODIFIER_NAME_hun_pest_trade_mod: "Puerto comercial de Pest"
 STATIC_MODIFIER_DESC_hun_pest_trade_mod: "En los muelles de Pest, los gritos de los cargadores resuenan de la mañana a la noche."
 STATIC_MODIFIER_NAME_hun_bratislava_gateway_mod: "Pozsony, ciudad puerta"
 STATIC_MODIFIER_DESC_hun_bratislava_gateway_mod: "Las puertas de Pozsony se han convertido en la encrucijada donde carretas rumbo a Austria y mensajeros reales se cruzan."
 STATIC_MODIFIER_NAME_hun_kosice_commerce_mod: "Kassa, centro comercial"
 STATIC_MODIFIER_DESC_hun_kosice_commerce_mod: "En el mercado de Kassa, mercaderes de Polonia y Silesia se disputan las mercancías de la Alta Hungría."
 STATIC_MODIFIER_NAME_hun_pecs_university_mod: "La Universidad de Pécs"
 STATIC_MODIFIER_DESC_hun_pecs_university_mod: "En las celdas de la universidad de Pécs, los estudiantes, que continúan el legado de Luis I, escuchan lecciones en latín."
 STATIC_MODIFIER_NAME_hun_gyor_fortress_mod: "La fortaleza de Győr"
 STATIC_MODIFIER_DESC_hun_gyor_fortress_mod: "En las murallas de Győr, los centinelas, que vigilan la frontera austríaca, mantienen las antorchas en alto toda la noche."
 STATIC_MODIFIER_NAME_hun_debrecen_agri_mod: "Ciudad agrícola de Debrecen"
 STATIC_MODIFIER_DESC_hun_debrecen_agri_mod: "Rebaños de ganado y cargamentos de trigo, criados en la Gran Llanura, fluyen sin cesar al mercado de Debrecen."
 STATIC_MODIFIER_NAME_hun_szeged_trade_mod: "Puerto comercial de Szeged"
 STATIC_MODIFIER_DESC_hun_szeged_trade_mod: "Szeged, en la confluencia del Tisza y el Danubio, desarrollada como nudo del comercio interno."
 STATIC_MODIFIER_NAME_hun_cluj_center_mod: "Cluj, corazón de Transilvania"
 STATIC_MODIFIER_DESC_hun_cluj_center_mod: "En los mercados y escuelas de Cluj, las voces de alemanes, húngaros y rumanos se mezclan."
 STATIC_MODIFIER_NAME_hun_oradea_pilgrimage_mod: "Nagyvárad, ciudad de peregrinación"
 STATIC_MODIFIER_DESC_hun_oradea_pilgrimage_mod: "Multitudes de peregrinos de todo el reino se dirigen a la catedral de Nagyvárad, hogar de las reliquias del rey San Ladislao."
 STATIC_MODIFIER_NAME_hun_mining_empire_mod: "El Imperio minero"
 STATIC_MODIFIER_DESC_hun_mining_empire_mod: "Oro, plata, cobre, sal: la riqueza extraída de las minas del reino supera ahora a cualquier otra tierra de Europa central."
 STATIC_MODIFIER_NAME_hun_kingdom_of_cities_mod: "El Reino de las ciudades"
 STATIC_MODIFIER_DESC_hun_kingdom_of_cities_mod: "De Buda a Cluj, los mercados de las ciudades del reino intercambian mercancías unos con otros y respiran como una sola gran esfera económica."
 hun_secure_transylvania: "Dominio de Transilvania"
 hun_secure_transylvania_desc: "Transilvania —desde hace mucho territorio núcleo húngaro— está centrada en dos grandes ciudades: Cluj y Brașov. Húngaros, sajones y valacos (rumanos) conviven en esta tierra. Con recursos suficientes en el tesoro, invierte en el desarrollo serio de Transilvania y eleva una de sus dos grandes ciudades al pleno estatus urbano."
 hun_events.20.t: "Dominio de Transilvania"
 hun_events.20.d: "Con Cluj y Brașov aseguradas y más de 1000 ducados invertidos, comienza un serio programa de desarrollo de Transilvania. Cluj (en latín Claudiopolis; en rumano Cluj) es la mayor ciudad de Transilvania; Brașov (en latín Corona; en alemán Kronstadt), construida por colonos sajones, es la puerta comercial hacia Valaquia. ¿Qué ciudad tendrá prioridad de desarrollo? Esta decisión moldea el rumbo futuro de Transilvania."
 hun_events.30.t: "El Pacta Conventa: tratado histórico con Croacia"
 hun_events.30.d: "En 1102, el rey Colomán de Hungría celebró el Pacta Conventa con representantes de doce familias nobles croatas. La nobleza croata aceptó al rey húngaro como su soberano; a cambio, Croacia mantuvo su autonomía y sus tradiciones jurídicas. Más de dos siglos después de este tratado histórico, ha llegado la hora de esclarecer las relaciones entre Hungría y Croacia. ¿Debe Croacia ser formalmente incorporada como feudo, para esclarecer su estatus jurídico? ¿O debe mantenerse el flexible arreglo actual? La elección corresponde al rey de Hungría."
 hun_events.30.a: "Incorporar formalmente Croacia como feudo"
 hun_events.30.b: "Mantener las relaciones actuales (+10 de prestigio)"
 hun_events.20.a: "Elevar Cluj a ciudad (cuesta 1000 ducados)"
 hun_events.20.b: "Elevar Brașov a ciudad (cuesta 1000 ducados)"
 STATIC_MODIFIER_NAME_hun_eternal_crown_mod: "La eterna Corona de San Esteban"
 STATIC_MODIFIER_DESC_hun_eternal_crown_mod: "En la Navidad del año 1000, el papa Silvestre II envió una corona a István, príncipe de los húngaros, haciéndole Esteban I: primer rey de Hungría. Esa corona —la Santa Corona de San Esteban— pasó a ser vista como la esencia misma del Estado húngaro: un rey sin ella no era en absoluto rey de Hungría. Ahora, pasados los siglos, diplomáticos de todos los rincones del mundo hacen peregrinación a la corte de Hungría para reconocer su suzeranía."
