l_spanish:
 ple_english_pale_mission_pack: "El Pale: de cabeza de puente de la Corona al Reino de Irlanda"
 ple_english_pale_mission_pack_DESCRIPTION:0 "El estrecho Pale inglés en torno a Dublín: tiende la mano a los señores hiberno-normandos, conquista las tierras gaélicas y funda un reino que gobierne toda Irlanda."
 ple_english_pale_mission_pack_CRITERIA_DESCRIPTION:0 "Consolida el Pale, conquista toda Irlanda y funda un reino."
 ple_english_pale_mission_pack_BUTTON_TOOLTIP:0 "De pequeña cabeza de puente a reino que gobierna toda la Isla Esmeralda."
 ple_english_pale_mission_pack_BUTTON_DETAILS:0 "“Más irlandeses que el propio rey”: ¡planta el estandarte del Pale por toda Irlanda!"
 ple_english_pale: "El Pale inglés"
 ple_english_pale_desc: "Una estrecha franja costera en torno a Dublín: es la última cabeza de puente de la autoridad real inglesa en medio de un vasto mar gaélico."
 ple_dublin_castle: "Desarrolla el Castillo de Dublín"
 ple_dublin_castle_desc: "El Castillo de Dublín, construido en 1204: fortalece aún más este centro del gobierno inglés en Irlanda."
 ple_pale_defense: "Fortifica el Pale"
 ple_pale_defense_desc: "Los terraplenes y fosos que protegen el Pale de las incursiones gaélicas: fortalece esta línea defensiva conocida como “la Zanja”."
 ple_lord_deputy: "El Lord Diputado de Irlanda"
 ple_lord_deputy_desc: "El Lord Diputado, que gobierna Irlanda como representante del rey inglés: haz inquebrantable este cargo."
 ple_anglo_irish_parliament: "El Parlamento anglo-irlandés"
 ple_anglo_irish_parliament_desc: "El Parlamento irlandés, convocado en Drogheda o Dublín: haz funcionar esta asamblea de señores anglo-irlandeses y representantes urbanos."
 ple_pale_consolidated: "El Pale consolidado"
 ple_pale_consolidated_desc: "Fortificaciones, Lord Diputado, derecho y parlamento: construye sobre todo ello y haz inquebrantable el gobierno del Pale."
 ple_hiberno_norman_lords: "Los señores hiberno-normandos"
 ple_hiberno_norman_lords_desc: "Los señores anglonormandos, de quienes se dice que son “más ingleses que los propios ingleses”: construye relaciones con ellos."
 ple_fitzgerald_kildare: "Los FitzGerald de Kildare"
 ple_fitzgerald_kildare_desc: "“Toda Irlanda no puede gobernar al conde de Kildare”, se decía. Construye relaciones con esta formidable casa."
 ple_butler_ormond: "Los Butler de Ormond"
 ple_butler_ormond_desc: "Los Butler de Ormond, rivales de los Kildare: construye relaciones con esta casa, firmemente leal a la corona."
 ple_statutes_of_kilkenny: "Los Estatutos de Kilkenny"
 ple_statutes_of_kilkenny_desc: "Promulgados en 1367, los Estatutos de Kilkenny: haz cumplir esta ley que prohíbe a los colonos ingleses “gaelizarse”."
 ple_gaelic_frontier_wars: "Las guerras de frontera gaélicas"
 ple_gaelic_frontier_wars_desc: "Los señores gaélicos que rodean el Pale: afronta la guerra incesante de esta frontera."
 ple_conquer_leinster: "Conquista Leinster"
 ple_conquer_leinster_desc: "Leinster, que se extiende al sur del Pale: trae esta región a nuestro dominio."
 ple_conquer_munster: "Conquista Munster"
 ple_conquer_munster_desc: "Munster, esfera del conde de Desmond: conquista esta rica región."
 ple_conquer_connacht: "Conquista Connacht"
 ple_conquer_connacht_desc: "Connacht, que se extiende hacia los confines occidentales: trae esta frontera a nuestro control."
 ple_conquer_ulster: "Conquista Ulster"
 ple_conquer_ulster_desc: "Ulster, la tierra septentrional de la más obstinada resistencia gaélica: conquista esta región."
 ple_master_of_ireland: "Señor de Irlanda"
 ple_master_of_ireland_desc: "Leinster, Munster, Connacht y Ulster: gobierna todas ellas y álzate como el verdadero señor de Irlanda."
 ple_reformation_choice: "La elección de la Reforma"
 ple_reformation_choice_desc: "Las enseñanzas de Lutero y Calvino cruzan el mar: de pie en esta encrucijada de la fe, ¿qué camino elegiremos?"
 ple_church_of_ireland: "La Iglesia de Irlanda"
 ple_church_of_ireland_desc: "La Iglesia de Irlanda, alineada con la Iglesia de Inglaterra: establece esta nueva fe como instrumento de gobierno."
 ple_recusant_catholics: "Los católicos recusantes"
 ple_recusant_catholics_desc: "Los “recusantes”, que se niegan a abandonar su lealtad a Roma: acoge su fe como pilar del gobierno."
 ple_dublin_university: "La Universidad de Dublín"
 ple_dublin_university_desc: "La sede del saber de Dublín, encarnada por el Trinity College: desarrolla este lugar como centro de erudición."
 ple_english_crown_relations: "Relaciones con la Corona inglesa"
 ple_english_crown_relations_desc: "La Corona inglesa, al otro lado del mar: pondera nuestras relaciones con este suzerano, pues decidirán nuestro futuro."
 ple_kingdom_of_ireland: "El Reino de Irlanda proclamado"
 ple_kingdom_of_ireland_desc: "El camino, iniciado en la pequeña cabeza de puente del Pale, da aquí fruto en un reino que gobierna toda Irlanda, pero el rumbo que seguirá este nuevo reino permanece indeciso."
 ple_events.99.t: "Proclamación del Reino de Irlanda"
 ple_events.99.d: "La larga historia, iniciada en la pequeña cabeza de puente de Dublín, entra aquí en una nueva era con un reino que gobierna toda Irlanda."
 ple_events.99.a: "¡Gloria a Irlanda!"
 ple_defy_the_crown: "Desafío a la Corona"
 ple_defy_the_crown_desc: "El Reino de Irlanda ya no es un mero siervo de Inglaterra: haz de esta ruptura el primer paso hacia la verdadera soberanía."
 ple_war_of_irish_independence: "La Guerra de la Independencia irlandesa"
 ple_war_of_irish_independence_desc: "Una guerra inevitable con la corona del otro lado del mar: gana esta guerra de independencia y rompe las cadenas."
 ple_sovereign_kingdom_of_ireland: "Una Irlanda soberana"
 ple_sovereign_kingdom_of_ireland_desc: "Un Reino de Irlanda verdaderamente independiente, que no se debe a corona alguna: la Isla Esmeralda se convierte por fin en dueña de su propio destino."
 ple_loyal_crown_partnership: "Asociación con la Corona"
 ple_loyal_crown_partnership_desc: "Asociación, no rivalidad: el Reino de Irlanda elige una alianza de iguales con la corona inglesa."
 ple_anglo_irish_union: "La Unión anglo-irlandesa"
 ple_anglo_irish_union_desc: "Por medio de estrechos lazos políticos, los dos reinos dan un paso hacia una unión más profunda."
 ple_united_kingdoms: "Socio en la unión"
 ple_united_kingdoms_desc: "Habiendo elegido la asociación en lugar de la rivalidad, el Reino de Irlanda se sitúa junto a Inglaterra como socio en la unión y construye una era de prosperidad compartida."
 STATIC_MODIFIER_NAME_ple_pale_mod: "El Pale inglés"
 STATIC_MODIFIER_DESC_ple_pale_mod: "Desde los días de Enrique II, esta tierra ha permanecido como el único punto de apoyo de la corona inglesa más allá de la tierra firme."
 STATIC_MODIFIER_NAME_ple_dublin_mod: "Castillo de Dublín desarrollado"
 STATIC_MODIFIER_DESC_ple_dublin_mod: "El antiguo puerto vikingo bulle ahora como sede del gobierno y del comercio en Irlanda."
 STATIC_MODIFIER_NAME_ple_defense_mod: "El Pale fortificado"
 STATIC_MODIFIER_DESC_ple_defense_mod: "Dentro de los terraplenes y fosos del “Pale”, los campesinos labran sus campos sin temor a súbitas incursiones gaélicas."
 STATIC_MODIFIER_NAME_ple_lord_deputy_mod: "El Lord Diputado"
 STATIC_MODIFIER_DESC_ple_lord_deputy_mod: "El Diputado, sentado en el Castillo de Dublín en lugar del rey al otro lado del mar, impone respeto incluso entre los grandes señores."
 STATIC_MODIFIER_NAME_ple_parliament_mod: "El Parlamento anglo-irlandés"
 STATIC_MODIFIER_DESC_ple_parliament_mod: "Las voces de los burgueses, reunidos dentro de las murallas del castillo, tienen ahora más peso en los asuntos de Estado."
 STATIC_MODIFIER_NAME_ple_consolidated_mod: "El Pale consolidado"
 STATIC_MODIFIER_DESC_ple_consolidated_mod: "Dublín ya no es un enclave extranjero, sino un verdadero territorio núcleo inscrito en los propios libros de la corona."
 STATIC_MODIFIER_NAME_ple_norman_lords_mod: "Los señores hiberno-normandos"
 STATIC_MODIFIER_DESC_ple_norman_lords_mod: "Los señores normandos en sus castillos están tan hondamente enraizados en este suelo que se dice que son “más irlandeses que los propios irlandeses”."
 STATIC_MODIFIER_NAME_ple_kilkenny_mod: "Los Estatutos de Kilkenny"
 STATIC_MODIFIER_DESC_ple_kilkenny_mod: "Promulgada en 1367, esta ley prohíbe a los colonos adoptar la lengua irlandesa o las costumbres gaélicas."
 STATIC_MODIFIER_NAME_ple_frontier_wars_mod: "Las guerras de frontera gaélicas"
 STATIC_MODIFIER_DESC_ple_frontier_wars_mod: "Incontables escaramuzas más allá del foso del Pale han templado a los soldados para las guerras de frontera."
 STATIC_MODIFIER_NAME_ple_leinster_mod: "Leinster conquistada"
 STATIC_MODIFIER_DESC_ple_leinster_mod: "Los graneros de Leinster, vecinos del Pale, figuran ahora en los propios libros de impuestos de la corona."
 STATIC_MODIFIER_NAME_ple_munster_mod: "Munster conquistada"
 STATIC_MODIFIER_DESC_ple_munster_mod: "De los puertos de Munster, antaño dominio del conde de Desmond, zarpan sin fin barcos cargados de lana y cuero."
 STATIC_MODIFIER_NAME_ple_connacht_mod: "Connacht conquistada"
 STATIC_MODIFIER_DESC_ple_connacht_mod: "Hasta los clanes del salvaje Connacht responden ahora a la llamada de la corona a las armas."
 STATIC_MODIFIER_NAME_ple_ulster_mod: "Ulster conquistada"
 STATIC_MODIFIER_DESC_ple_ulster_mod: "El obstinado norte, largo tiempo en poder de los O’Neill y los O’Donnell, se ha sometido por fin al estandarte real."
 STATIC_MODIFIER_NAME_ple_master_ireland_mod: "Señor de Irlanda"
 STATIC_MODIFIER_DESC_ple_master_ireland_mod: "De Leinster a Ulster, toda la Isla Esmeralda yace ahora bajo un solo estandarte."
 STATIC_MODIFIER_NAME_ple_reformation_mod: "La elección de la Reforma"
 STATIC_MODIFIER_DESC_ple_reformation_mod: "Las enseñanzas de Lutero y Calvino, traídas por el mar, envían silenciosas ondas por las iglesias de esta isla."
 STATIC_MODIFIER_NAME_ple_church_ireland_mod: "La Iglesia de Irlanda"
 STATIC_MODIFIER_DESC_ple_church_ireland_mod: "En las capillas de la nueva iglesia, alineada con Canterbury, la Biblia inglesa se lee ahora en voz alta."
 STATIC_MODIFIER_NAME_ple_recusant_mod: "Los católicos recusantes"
 STATIC_MODIFIER_DESC_ple_recusant_mod: "Multados, pero indómitos, los “recusantes” continúan sus silenciosas oraciones hacia Roma."
 STATIC_MODIFIER_NAME_ple_university_mod: "La Universidad de Dublín"
 STATIC_MODIFIER_DESC_ple_university_mod: "Por los claustros del Trinity College resuenan ahora los pasos de una nueva generación de eruditos."
 STATIC_MODIFIER_NAME_ple_crown_relations_mod: "Relaciones con la Corona inglesa"
 STATIC_MODIFIER_DESC_ple_crown_relations_mod: "Cada carta que llega de la corte al otro lado del mar moldea en silencio el destino de este reino."
 STATIC_MODIFIER_NAME_ple_kingdom_ireland_mod: "El Reino de Irlanda"
 STATIC_MODIFIER_DESC_ple_kingdom_ireland_mod: "Un recién coronado rey de Irlanda ocupa ahora el trono dentro del Castillo de Dublín."
 STATIC_MODIFIER_NAME_ple_defy_crown_mod: "Desafío a la Corona"
 STATIC_MODIFIER_DESC_ple_defy_crown_mod: "Entre quienes han sacudido la lealtad a la corona del otro lado del mar, se extiende un fervor irreprimible."
 STATIC_MODIFIER_NAME_ple_irish_independence_war_mod: "La Guerra de la Independencia irlandesa"
 STATIC_MODIFIER_DESC_ple_irish_independence_war_mod: "Incontables choques con el ejército enviado por el mar han forjado a los soldados de esta isla en tácticos curtidos."
 STATIC_MODIFIER_NAME_ple_sovereign_ireland_mod: "Una Irlanda soberana"
 STATIC_MODIFIER_DESC_ple_sovereign_ireland_mod: "El estandarte de una Irlanda verdaderamente libre, que no se debe a corona alguna, ondea ahora desde las torres del Castillo de Dublín. Gobernadores, enviados a todos los rincones del país, levantan los nervios administrativos del Estado soberano."
 STATIC_MODIFIER_NAME_ple_loyal_partnership_mod: "Asociación con la Corona"
 STATIC_MODIFIER_DESC_ple_loyal_partnership_mod: "Habiendo elegido la confianza en lugar de la rivalidad, los enviados de las dos coronas cruzan ahora el mar con más frecuencia que nunca."
 STATIC_MODIFIER_NAME_ple_anglo_irish_union_mod: "La Unión anglo-irlandesa"
 STATIC_MODIFIER_DESC_ple_anglo_irish_union_mod: "Por el incansable trabajo de los enviados que sirven a la corte del otro lado del mar, las dos coronas están ligadas más estrechamente que nunca."
