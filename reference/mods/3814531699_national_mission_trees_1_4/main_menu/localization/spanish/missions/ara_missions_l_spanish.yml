l_spanish:
 ara_crown_mission_pack: "El camino de la Corona de Aragón"
 ara_crown_mission_pack_DESCRIPTION:0 "La Corona de Aragón —que une Cataluña, Aragón y Valencia— está en el centro de la historia, disputando la unidad ibérica y la supremacía en el Mediterráneo. Tiende la mano a Castilla y forja España, o sigue solo tu propio camino, incorpora Nápoles y marcha sobre Constantinopla. El camino es tuyo."
 ara_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Completa las misiones como Corona de Aragón para establecer la unidad ibérica y la hegemonía mediterránea."
 ara_crown_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para seguir el camino de la Corona de Aragón."
 ara_crown_mission_pack_BUTTON_DETAILS:0 "¡Sienta las bases de España, conviértete en señor del Mediterráneo occidental y toma Constantinopla!"
 ara_accession_of_pedro_iv: "La ascensión de Pedro IV"
 ara_accession_of_pedro_iv_desc: "En 1336, con la muerte de Alfonso IV, su hijo Pedro IV (Pere III, el Ceremonioso) subió al trono de la Corona de Aragón. Erudito y profundamente devoto del ceremonial de la corte, este joven rey nutre firme determinación de fortalecer el poder real y unificar el reino. Con el amanecer de un nuevo gobierno, las ambiciones de Aragón en el Mediterráneo vuelven a encenderse."
 ara_kingdom_of_majorca: "El Reino de Mallorca"
 ara_kingdom_of_majorca_desc: "El Reino de Mallorca, antaño gobernado por una rama más joven de la casa real aragonesa, continúa existiendo como fuerza política autónoma en las Baleares. Integrar por completo este territorio será el primer paso hacia ambiciones mayores en el Mediterráneo occidental."
 ara_reconquest_of_granada: "La Reconquista de Granada"
 ara_reconquest_of_granada_desc: "El Reino de Granada, último baluarte del islam en la Península Ibérica, ha atormentado desde hace mucho a los reyes cristianos con sus tierras fértiles y sus magníficos palacios. Conquistar este reino significa el fin de la Reconquista: el fin de un enfrentamiento de siglos."
 ara_vassalize_navarre: "Subyuga Navarra"
 ara_vassalize_navarre_desc: "El pequeño Reino de Navarra, encajado entre Francia y Castilla, es una zona tapón estratégicamente importante para Aragón. Antes de que Francia consiga absorberlo, debemos traer Navarra a la esfera de influencia de Aragón."
 ara_intervene_in_castile: "Interviene en Castilla"
 ara_intervene_in_castile_desc: "La corte de Castilla, que comparte la sangre Trastámara con nuestra propia casa real, fue desde hace mucho desgarrada por disputas de facciones. Como los infantes de Aragón antaño disputaron influencia sobre este gran reino, ahora ha llegado la hora de intervenir en su destino."
 ara_union_of_the_crowns: "La Unión de las Coronas"
 ara_union_of_the_crowns_desc: "Las coronas de Aragón y Castilla unidas bajo una sola casa real. Es el amanecer de un nuevo reino: España. Realiza con tus propias manos la unión histórica, forjada en la era de Fernando e Isabel."
 ara_catalan_nobility: "La nobleza catalana"
 ara_catalan_nobility_desc: "Tras la revuelta, debemos decidir el destino de la nobleza catalana. ¿Restringir su poder y fortalecer la autoridad real, o buscar la coexistencia en un orden reformado? Esta decisión definirá la estabilidad de Cataluña y el futuro del gobierno en todo el reino."
 ara_crowns_of_iberia: "Las coronas de Iberia"
 ara_crowns_of_iberia_desc: "Aragón, Castilla, Navarra, Granada: todas las coronas de la Península Ibérica reunidas bajo una sola casa real. Aquí se asienta la base del Imperio español. Ha llegado la hora de proclamar al mundo el nacimiento del nuevo imperio."
 ara_pacify_sardinia: "Pacifica Cerdeña"
 ara_pacify_sardinia_desc: "Aragón reivindica desde hace mucho el dominio sobre Cerdeña, pero revueltas internas y potencias rivales han atormentado la isla. Pacificar por completo este rico baluarte mediterráneo es paso indispensable para la expansión hacia el este."
 ara_consulate_of_the_sea: "El Consulado del Mar"
 ara_consulate_of_the_sea_desc: "El derecho marítimo comercial, desarrollado en torno a Barcelona y Valencia —el Consolat de Mar— regula el comercio mediterráneo. Usa el prestigio de esta institución para traer el comercio del Mediterráneo occidental a nuestra jurisdicción."
 ara_dominate_genoa: "Domina Génova"
 ara_dominate_genoa_desc: "Génova ha rivalizado desde hace mucho con Aragón por la supremacía en el comercio mediterráneo. Si conseguimos tomar Liguria y la propia Génova, el comercio en todo el Mediterráneo occidental caerá por completo en nuestras manos."
 ara_rule_italy: "Gobierna Italia"
 ara_rule_italy_desc: "Gobernar toda Italia —incluidas las posesiones del papa— tiene significado histórico, que va más allá de la mera conquista. Administrando la tierra en que vive la herencia de Roma, Aragón se establece como hegemón de Europa."
 ara_invade_occitania: "Invade Occitania"
 ara_invade_occitania_desc: "Provenza, Languedoc, Gascuña: las tierras del sur de Francia caían antaño en la esfera de influencia aragonesa. Ampliar nuestra frontera norte frente al Reino de Francia es tarea estratégica esencial para la seguridad de la Península Ibérica."
 ara_humiliate_provence: "Humilla a Provenza"
 ara_humiliate_provence_desc: "El conde de Provenza presenta desde hace mucho legítimas reivindicaciones hereditarias tanto a Aragón como a Nápoles. Debemos poner fin a estas pretensiones audaces y traer Provenza a nuestro control, para hacer incontestada nuestra hegemonía en el Mediterráneo occidental."
 ara_aragonese_navy: "La Armada de Aragón"
 ara_aragonese_navy_desc: "Las posesiones de la Corona de Aragón están esparcidas por el Mediterráneo. Defenderlas todas y mantener el dominio naval exige una poderosa flota. Construye la armada aragonesa y establece el liderazgo sobre este mar interior."
 ara_seize_sicily: "Toma Sicilia"
 ara_seize_sicily_desc: "Con la flota aragonesa construida, la invasión de la isla de Sicilia se convierte en perspectiva realista. Sicilia, antaño liberada de los franceses por las “Vísperas Sicilianas”, ve en Aragón a su propio protector. Asegura Palermo y haz de este importante baluarte mediterráneo, para siempre, propiedad de Aragón."
 ara_integrate_naples: "Integra Nápoles"
 ara_integrate_naples_desc: "El Reino de Nápoles, conquistado por el rey Alfonso V, permanece como una de las perlas de la corona aragonesa. Habiendo integrado por completo el sur de Italia y la ciudad portuaria de Nápoles, nuestro reino gana una cabeza de puente para la expansión hacia el Mediterráneo oriental."
 ara_mediterranean_ambitions: "Ambiciones mediterráneas"
 ara_mediterranean_ambitions_desc: "Para que nuestro nombre resuene hasta el Mediterráneo oriental, es precisa una flota mayor y una fuerza naval más poderosa. Construye una gran flotilla de galeras y alza nuestra bandera sobre todo el Mediterráneo. Una cabeza de puente en los Balcanes está ahora al alcance."
 ara_combat_barbary_piracy: "Combate la piratería berberisca"
 ara_combat_barbary_piracy_desc: "Los corsarios musulmanes, que se apostan en el litoral norteafricano, son amenaza constante para la navegación aragonesa. Atacar sus bases y liberar a cristianos inocentes del cautiverio es urgente tanto para la fe como para el interés del Estado."
 ara_conquer_tunis: "Conquista Túnez"
 ara_conquer_tunis_desc: "Túnez no es solo un puerto pirata. Si dejamos indomada esta fuerza naval, ligada a los otomanos, nuestra hegemonía mediterránea estará constantemente amenazada. Conquista Túnez y establece el pleno dominio del norte de África."
 ara_occupy_alexandria: "Ocupa Alejandría"
 ara_occupy_alexandria_desc: "Alejandría, llave del Mediterráneo oriental, fue antaño centro del saber antiguo del mundo y permanece nudo del comercio egipcio y asiático. Si conseguimos tomar esta ciudad y monopolizar el comercio oriental, Aragón se convertirá en el verdadero hegemón mediterráneo."
 ara_claims_on_athens: "Reivindicaciones sobre Atenas"
 ara_claims_on_athens_desc: "Como los mercenarios aragoneses —la Compañía Catalana— fundaron antaño el Ducado de Atenas, Aragón tiene derechos históricos sobre las tierras griegas. Toma Morea y el norte de Grecia y asegura la última cabeza de puente en el camino a Constantinopla."
 ara_mare_nostrum: "Mare Nostrum"
 ara_mare_nostrum_desc: "De Gibraltar al Mar de Mármara, el Mediterráneo es nuestro mar interior. Nadie osa navegar en estas aguas sin el permiso de la flota aragonesa. Hegemonía sobre el Mediterráneo occidental establecida: el próximo objetivo es aquella ciudad dorada tras sus antiguas murallas."
 ara_taula_de_canvi: "La Taula de Canvi"
 ara_taula_de_canvi_desc: "La Taula de Canvi (Mesa de Cambio), establecida en Barcelona en 1401, es uno de los más antiguos bancos públicos de Europa. Usando esta institución, cada vez más sofisticada a medida que el comercio se expande, podemos poner las finanzas del reino sobre una base inquebrantable."
 ara_valencian_silk: "La seda valenciana"
 ara_valencian_silk_desc: "Valencia pasa a ser conocida como productora de seda fina. Ampliando la Lonja de la Seda (Llotja de la Seda) y desarrollando la industria de la seda de Valencia, podemos incluso superar la competencia oriental."
 ara_guilds_of_barcelona: "Los gremios de Barcelona"
 ara_guilds_of_barcelona_desc: "Los gremios de artesanos y mercaderes de Barcelona son desde hace mucho la columna vertebral de la economía urbana. Garantizando su lealtad y organizando gremios semejantes por todo el reino, la base del oficio y del comercio se reforzará aún más."
 ara_industrial_districts: "Distritos industriales"
 ara_industrial_districts_desc: "Vidrio, vino, papel y seda: Aragón es hogar de una paleta diversificada de mercancías de alta calidad. Organizando estas industrias y ampliando la producción, el poder económico del reino crecerá con rapidez."
 ara_aragonese_renaissance: "El Renacimiento aragonés"
 ara_aragonese_renaissance_desc: "La corte de Alfonso V se convirtió en centro de la cultura renacentista en Nápoles, atrayendo humanistas italianos de toda la península. Difundiendo este florecimiento cultural por todo el reino, Aragón se establecerá como corazón espiritual y artístico de Europa."
 ara_golden_century: "El Siglo de Oro"
 ara_golden_century_desc: "Habiendo unificado Iberia, dominado el Mediterráneo y visto florecer la economía y la cultura, nuestro reino ingresa de hecho en su Siglo de Oro. Su brillo será discutido por generaciones."
 ara_city_of_the_worlds_desire: "La ciudad deseada por el mundo"
 ara_city_of_the_worlds_desire_desc: "Constantinopla: la ciudad deseada por el mundo. Sus murallas doradas han detenido a muchos conquistadores durante siglos. Pero ahora nuestra flota —señora del Mediterráneo— y nuestros ejércitos —unidos sobre Iberia— están listos para por fin cercar esta ciudad. Ocupa ambas orillas del Bósforo y realiza el antiguo sueño."
 ara_plus_ultra: "Plus Ultra"
 ara_plus_ultra_desc: "“Plus Ultra”: más allá. Se decía antaño que al oeste de las Columnas de Hércules no había nada. Pero nuestros exploradores saben ahora que, más allá, yace un vasto mar desconocido. Ha llegado la hora de navegar más allá de las columnas y partir hacia los confines del mundo."
 ara_african_outposts: "Puestos africanos"
 ara_african_outposts_desc: "Avanzar hacia el sur a lo largo de la costa del África occidental abre nuevos caminos, que sortean a los intermediarios musulmanes para llegar al oro y las mercancías directamente. Primero, erige puestos en las Islas Canarias y a lo largo de la costa marroquí."
 ara_gold_coast_trade: "Comercio de la Costa de Oro"
 ara_gold_coast_trade_desc: "La región del litoral del África occidental, conocida como Costa de Oro, es fiel al nombre, rica fuente de oro. Estableciendo aquí un puesto comercial, podemos traer la riqueza de África directamente al reino, sin depender de la ruta transahariana."
 ara_discover_the_new_world: "Descubre el Nuevo Mundo"
 ara_discover_the_new_world_desc: "¿Qué hay al oeste del gran océano? Nuestros exploradores, creyendo en la esfericidad de la Tierra, están convencidos de que existe una ruta occidental a Asia. Equipa una flota de exploración y navega hacia el mar desconocido. Lo que allí encuentres puede ser un nuevo mundo, que supere toda imaginación."
 ara_caribbean_foothold: "Cabeza de puente en el Caribe"
 ara_caribbean_foothold_desc: "Hemos establecido nuestra primera cabeza de puente en el Nuevo Mundo. Puebla La Española y las islas circundantes y haz de ella punto de partida para la exploración del continente. Desde aquí se abren caminos hacia el sur, el norte y el interior."
 ara_conquest_of_the_incas: "La conquista de los incas"
 ara_conquest_of_the_incas_desc: "En lo profundo del continente sudamericano yace un gran imperio, dicen, lleno de oro y plata: el Imperio inca (Tawantinsuyu). Conduce a los conquistadores a las tierras altas andinas y haz de la riqueza de este imperio la tuya propia."
 ara_new_kingdom_of_aragon: "El Nuevo Reino de Aragón"
 ara_new_kingdom_of_aragon_desc: "Las colonias que hemos construido en el Nuevo Mundo ya no son meros puestos. Organízalas como posesiones directas de la corona de Aragón —el Nuevo Reino de Aragón— con instituciones apropiadas a la metrópoli. Como soberano de las Américas, nuestro rey será inscrito como señor de dos mundos."
 ara_route_to_the_indies: "La ruta a las Indias"
 ara_route_to_the_indies_desc: "Portugal ya ha abierto la ruta marítima a las Indias alrededor del extremo sur de África. Pero no podemos solo mirar de lado. Abre una ruta alrededor del mundo, como Magallanes, o alcanza los puertos de la India antes que Portugal."
 ara_spice_trade_outposts: "Puestos del comercio de especias"
 ara_spice_trade_outposts_desc: "Clavo, nuez moscada y pimienta de las Islas de las Especias (Molucas) alcanzan precios enormes en Europa. Si erigimos allí una cabeza de puente y monopolizamos el comercio de especias, el tesoro del reino será enriquecido para siempre."
 ara_las_filipinas: "Las Filipinas"
 ara_las_filipinas_desc: "El archipiélago al que llegó Magallanes: las Filipinas. Mediante la conquista y colonización de estas islas estratégicamente situadas, nace un nuevo nudo en el centro del comercio del Pacífico. Como centro de la ruta comercial de la plata, que une China y las Américas, este territorio tiene valor inestimable."
 ara_empire_of_the_three_oceans: "El Imperio de los tres océanos"
 ara_empire_of_the_three_oceans_desc: "Atlántico, Océano Índico, Pacífico: se ha alzado el imperio que levanta su estandarte sobre los tres grandes océanos. El cetro de Aragón se extiende ahora no solo a las cortes de Europa, sino también a las selvas de África, a las tierras altas del Nuevo Mundo y a las Islas de las Especias de Asia. Hemos alcanzado una hazaña que ninguna nación en la historia alcanzó."
 STATIC_MODIFIER_NAME_ara_kingdom_of_majorca_mod: "La flota de las Baleares"
 STATIC_MODIFIER_DESC_ara_kingdom_of_majorca_mod: "Asegurada nuestra cabeza de puente en el Mediterráneo occidental, el alcance de nuestros barcos y el de nuestros mercaderes han aumentado."
 STATIC_MODIFIER_NAME_ara_reconquest_of_granada_mod: "Gloria de la cruzada"
 STATIC_MODIFIER_DESC_ara_reconquest_of_granada_mod: "La conclusión de la Reconquista ha elevado nuestra tolerancia a herejes y la legitimidad de la corona."
 STATIC_MODIFIER_NAME_ara_vassalize_navarre_mod: "Equilibrio de los Pirineos"
 STATIC_MODIFIER_DESC_ara_vassalize_navarre_mod: "La incorporación de Navarra a nuestra esfera ha elevado el peso diplomático del reino."
 STATIC_MODIFIER_NAME_ara_intervene_in_castile_mod: "Cuerpo expedicionario castellano"
 STATIC_MODIFIER_DESC_ara_intervene_in_castile_mod: "Tras la intervención en Castilla, el ejército real ostenta alta moral terrestre."
 STATIC_MODIFIER_NAME_ara_union_of_the_crowns_mod: "La gloria de los Reyes Católicos"
 STATIC_MODIFIER_DESC_ara_union_of_the_crowns_mod: "El matrimonio de Fernando II e Isabel I en 1469 ligó dos grandes reinos, Aragón y Castilla, en una unión dinástica. El gobierno de estos dos, llamados “Reyes Católicos”, se convirtió en la base del Estado español unificado, y pronto siguieron la conquista de Granada y los viajes de Colón."
 STATIC_MODIFIER_NAME_ara_catalan_nobility_mod: "El veredicto de la Justicia"
 STATIC_MODIFIER_DESC_ara_catalan_nobility_mod: "El establecimiento de la Justicia de Aragón permite que el descontento del estamento noble disminuya más deprisa."
 STATIC_MODIFIER_NAME_ara_crowns_of_iberia_mod: "Disposición militar de España"
 STATIC_MODIFIER_DESC_ara_crowns_of_iberia_mod: "Por la unión de la Corona de Aragón con Castilla y Portugal, toda la Península Ibérica pasa a un solo monarca. Realizar el sueño de una única “España”, acariciado desde el Imperio romano, es una empresa de escala histórica mundial."
 STATIC_MODIFIER_NAME_ara_pacify_sardinia_mod: "Guarnición sarda"
 STATIC_MODIFIER_DESC_ara_pacify_sardinia_mod: "La pacificada isla de Cerdeña ha multiplicado los efectivos del reino y ha aliviado el peso de la guerra."
 STATIC_MODIFIER_NAME_ara_consulate_of_the_sea_mod: "Prestigio del derecho marítimo"
 STATIC_MODIFIER_DESC_ara_consulate_of_the_sea_mod: "El prestigio de nuestro derecho marítimo ha elevado los ingresos comerciales del reino y el alcance de sus mercaderes."
 STATIC_MODIFIER_NAME_ara_dominate_genoa_mod: "Casa comercial de Liguria"
 STATIC_MODIFIER_DESC_ara_dominate_genoa_mod: "La casa comercial de Génova ha elevado el alcance de nuestros mercaderes en esta tierra."
 STATIC_MODIFIER_NAME_ara_rule_italy_mod: "Hegemón de la península"
 STATIC_MODIFIER_DESC_ara_rule_italy_mod: "La Corona de Aragón estuvo profundamente implicada con Italia desde la conquista de Nápoles por Alfonso V el Magnánimo (1442). Alfonso hizo de Nápoles su residencia y gobernó como gran mecenas del Renacimiento. Gobernar toda Italia sería el cumplimiento supremo de la ambición de Alfonso."
 STATIC_MODIFIER_NAME_ara_invade_occitania_mod: "Cuerpo expedicionario occitano"
 STATIC_MODIFIER_DESC_ara_invade_occitania_mod: "Tras abrirse camino por el sur de Francia, el ejército real marcha más deprisa y sitia con mayor maestría."
 STATIC_MODIFIER_NAME_ara_humiliate_provence_mod: "Subyugación de Provenza"
 STATIC_MODIFIER_DESC_ara_humiliate_provence_mod: "Tras tomar los astilleros de Provenza, la producción de bienes navales del reino ha aumentado."
 STATIC_MODIFIER_NAME_ara_aragonese_navy_mod: "Armada de Aragón"
 STATIC_MODIFIER_DESC_ara_aragonese_navy_mod: "La flota aragonesa reorganizada ostenta alta moral y excelente capacidad de reparación."
 STATIC_MODIFIER_NAME_ara_integrate_naples_mod: "Tesoro de las Dos Sicilias"
 STATIC_MODIFIER_DESC_ara_integrate_naples_mod: "El comercio con Nápoles prospera, y los efectivos del ejército real han aumentado."
 STATIC_MODIFIER_NAME_ara_mediterranean_ambitions_mod: "Poder de la flotilla de galeras"
 STATIC_MODIFIER_DESC_ara_mediterranean_ambitions_mod: "La flota ampliada ostenta alta moral y alcance incomparable."
 STATIC_MODIFIER_NAME_ara_combat_barbary_piracy_mod: "Escuadra antipiratería"
 STATIC_MODIFIER_DESC_ara_combat_barbary_piracy_mod: "Reprimidos los corsarios, los barcos mercantes del reino navegan con mayor seguridad, y la disciplina del ejército ha aumentado."
 STATIC_MODIFIER_NAME_ara_conquer_tunis_mod: "Guarnición norteafricana"
 STATIC_MODIFIER_DESC_ara_conquer_tunis_mod: "Asegurado el liderazgo sobre el norte de África, nuestra mano en las negociaciones de guerra es más fuerte, y los efectivos del ejército han aumentado."
 STATIC_MODIFIER_NAME_ara_occupy_alexandria_mod: "Monopolio del comercio oriental"
 STATIC_MODIFIER_DESC_ara_occupy_alexandria_mod: "Asegurado el nudo del comercio oriental, los ingresos comerciales del reino y el alcance de sus mercaderes han aumentado como nunca."
 STATIC_MODIFIER_NAME_ara_claims_on_athens_mod: "El legado de la Compañía Catalana"
 STATIC_MODIFIER_DESC_ara_claims_on_athens_mod: "Realizadas las expediciones en Grecia, el ejército real marcha más deprisa, y el peso de la guerra recae más ligero sobre el reino."
 STATIC_MODIFIER_NAME_ara_mare_nostrum_mod: "Mando supremo de la flota mediterránea"
 STATIC_MODIFIER_DESC_ara_mare_nostrum_mod: "Asegurado todo el Mediterráneo, nuestra flota ostenta alta moral y alcance operacional y comercial incomparable."
 STATIC_MODIFIER_NAME_ara_taula_de_canvi_mod: "Crédito de la Mesa de Cambio"
 STATIC_MODIFIER_DESC_ara_taula_de_canvi_mod: "La “Taula de Canvi” (Mesa de Cambio), fundada en Barcelona en 1401, es considerada uno de los primeros bancos públicos del mundo. Gestionada por los gremios mercantiles de Barcelona, esta institución financiera administraba créditos, letras de cambio y depósitos y se convirtió en pilar que sostenía el comercio catalán."
 STATIC_MODIFIER_NAME_ara_valencian_silk_mod: "La Lonja de la Seda"
 STATIC_MODIFIER_DESC_ara_valencian_silk_mod: "Valencia fue uno de los principales centros de producción de seda del Mediterráneo medieval. Las tecnologías de sericultura, traídas por los moros, pasaron a los artesanos cristianos, y la seda valenciana ostentaba reputación que rivalizaba con la de los paños finos de Italia. La Llotja de la Seda (Lonja de la Seda) es símbolo de su prosperidad."
 STATIC_MODIFIER_NAME_ara_guilds_of_barcelona_mod: "Lealtad de los gremios"
 STATIC_MODIFIER_DESC_ara_guilds_of_barcelona_mod: "Los lazos fortalecidos con los gremios de Barcelona han elevado algo la eficiencia productiva de esta tierra."
 STATIC_MODIFIER_NAME_ara_industrial_districts_mod: "Crecimiento de la manufactura"
 STATIC_MODIFIER_DESC_ara_industrial_districts_mod: "En Barcelona, Valencia y Zaragoza se desarrollaron distritos industriales, donde se concentraron talleres de lana, paños, cuero y artículos de metal. La prosperidad comercial de la Corona de Aragón era sostenida por la productividad de estas industrias urbanas, y sus mercancías eran muy estimadas incluso en los mercados de Italia."
 STATIC_MODIFIER_NAME_ara_aragonese_renaissance_mod: "Corte de los humanistas"
 STATIC_MODIFIER_DESC_ara_aragonese_renaissance_mod: "Este florecimiento cultural ha elevado la habilidad de los nuevos artistas y el ritmo de innovación."
 STATIC_MODIFIER_NAME_ara_golden_century_mod: "Prosperidad del Siglo de Oro"
 STATIC_MODIFIER_DESC_ara_golden_century_mod: "El Siglo de Oro designa los siglos XVI y XVII, cuando España alcanzó el apogeo de sus logros políticos, militares y culturales. El “Don Quijote” de Cervantes, la pintura de corte de Velázquez, las obras de Lope de Vega: las coronas unidas de Aragón y Castilla gobernaron en el cenit de la cultura europea."
 STATIC_MODIFIER_NAME_ara_city_of_the_worlds_desire_mod: "Señor del Bósforo"
 STATIC_MODIFIER_DESC_ara_city_of_the_worlds_desire_mod: "El brillo del imperio que detenta Constantinopla ha elevado su prestigio y legitimidad y ha fortalecido su mano en las negociaciones de guerra como nunca antes."
 STATIC_MODIFIER_NAME_ara_plus_ultra_mod: "Celo de las expediciones ultramarinas"
 STATIC_MODIFIER_DESC_ara_plus_ultra_mod: "El espíritu de exploración más allá de los límites ha ampliado el alcance de nuestras flotas coloniales y navales."
 STATIC_MODIFIER_NAME_ara_african_outposts_mod: "Cabezas de puente en las Canarias"
 STATIC_MODIFIER_DESC_ara_african_outposts_mod: "Nuestras cabezas de puente a lo largo de la costa africana han ampliado el alcance de los barcos mercantes del reino."
 STATIC_MODIFIER_NAME_ara_gold_coast_trade_mod: "Red del comercio de oro"
 STATIC_MODIFIER_DESC_ara_gold_coast_trade_mod: "El comercio con la Costa de Oro ha elevado los ingresos comerciales del reino y el alcance de sus mercaderes."
 STATIC_MODIFIER_NAME_ara_discover_the_new_world_mod: "Espíritu de la flota oceánica"
 STATIC_MODIFIER_DESC_ara_discover_the_new_world_mod: "La apertura de la puerta al Nuevo Mundo ha acelerado el flujo de emigrantes en el reino."
 STATIC_MODIFIER_NAME_ara_caribbean_foothold_mod: "Asentamientos de La Española"
 STATIC_MODIFIER_DESC_ara_caribbean_foothold_mod: "Nuestra cabeza de puente en el Nuevo Mundo ha elevado su atractivo para colonos."
 STATIC_MODIFIER_NAME_ara_conquest_of_the_incas_mod: "El legado de los conquistadores"
 STATIC_MODIFIER_DESC_ara_conquest_of_the_incas_mod: "En 1532, Francisco Pizarro capturó al emperador inca Atahualpa y conquistó el Imperio inca. El saqueo de la mayor civilización del oro del mundo trajo a España riqueza sin precedentes, y, con el descubrimiento de las minas de plata de Potosí, enormes cantidades del metal precioso fluyeron del Nuevo Mundo a Europa."
 STATIC_MODIFIER_NAME_ara_new_kingdom_of_aragon_mod: "La corona de las Américas"
 STATIC_MODIFIER_DESC_ara_new_kingdom_of_aragon_mod: "La construcción del Nuevo Reino de Aragón es una gran empresa colonial para trasplantar el legado de Aragón al Nuevo Mundo. En el sistema de la encomienda, que implicaba el trabajo nativo, plata, oro, azúcar y tintes continúan siendo enviados a la metrópoli."
 STATIC_MODIFIER_NAME_ara_route_to_the_indies_mod: "Brújula de los navegantes"
 STATIC_MODIFIER_DESC_ara_route_to_the_indies_mod: "La apertura de la ruta a las Indias ha ampliado el alcance operativo de nuestra flota."
 STATIC_MODIFIER_NAME_ara_spice_trade_outposts_mod: "Casa comercial de las Molucas"
 STATIC_MODIFIER_DESC_ara_spice_trade_outposts_mod: "Especias como pimienta, nuez moscada y clavo costaban, en la Europa medieval, tanto como el oro. Romper esta ruta comercial, monopolizada por mercaderes musulmanes y Venecia, y establecer cabezas de puente directamente en la fuente: esta es la fuente de la riqueza imperial."
 STATIC_MODIFIER_NAME_ara_las_filipinas_mod: "Estación intermedia del Pacífico"
 STATIC_MODIFIER_DESC_ara_las_filipinas_mod: "El archipiélago de las Filipinas correspondió a Magallanes (1521) y, después, con Manila, en Luzón, como base, se convirtió en el centro del “comercio de galeones”. Por esta ruta, que une Acapulco, en México, y Manila, la plata del Nuevo Mundo era intercambiada sin cesar por seda y porcelana chinas."
 STATIC_MODIFIER_NAME_ara_empire_of_the_three_oceans_mod: "El Imperio en el que el sol nunca se pone"
 STATIC_MODIFIER_DESC_ara_empire_of_the_three_oceans_mod: "El brillo del imperio que abarca tres océanos ha elevado los ingresos comerciales del reino y el alcance de sus mercaderes como nunca antes."
 ara_events.1.t: "La ascensión de Pedro IV"
 ara_events.1.d: "En 1336, Alfonso IV murió, y su hijo Pedro IV subió al trono de la Corona de Aragón. En 1337, el reino es una laxa unión de tierras de Cataluña, Aragón, Valencia y las Baleares. El control sobre Cerdeña permanece inestable, y las relaciones con la vecina Castilla cargan constante tensión. Las potencias comerciales, que gobiernan las rutas comerciales del Mediterráneo, detentan gran influencia, y la corona debe gobernar en armonía con los privilegios de estos diversos reinos. Ante el joven rey Pedro IV se extiende un largo camino hacia una Iberia unida y la supremacía en el Mediterráneo."
 ara_events.1.a: "Comienza un nuevo gobierno"
 ara_events.2.t: "Incorporación del Reino de Mallorca"
 ara_events.2.d: "El Reino de Mallorca, antaño fundado por Jaime II como rama más joven de la casa real aragonesa, permanece desde hace mucho en la esfera de influencia aragonesa, pese a sus posesiones en las Baleares, el Rosellón y Montpellier. Ha llegado la hora de su plena incorporación. Sea totalmente anexionada y convertida en parte de Aragón, sea mantenida como vasallo amistoso: en cualquier caso, Mallorca caerá bajo la corona aragonesa."
 ara_events.2.a: "Anexionar por completo Mallorca"
 ara_events.2.b: "Mantener Mallorca como vasallo amistoso"
 STATIC_MODIFIER_NAME_ara_seize_sicily_mod: "Gloria de la toma de Sicilia"
 STATIC_MODIFIER_DESC_ara_seize_sicily_mod: "Los sicilianos, que expulsaron a la casa de Anjou en las “Vísperas Sicilianas” de 1282, saludaron a Pedro III de Aragón como su nuevo rey. Desde entonces, Sicilia fue importante posesión de la casa real aragonesa y continuó sirviendo de llave estratégica que domina el Mediterráneo central."
