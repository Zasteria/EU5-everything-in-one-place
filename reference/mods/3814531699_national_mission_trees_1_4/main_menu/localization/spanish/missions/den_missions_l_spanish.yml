l_spanish:
 den_kalmar_union_mission_pack: "La gloria de la Unión de Kalmar"
 den_kalmar_union_mission_pack_DESCRIPTION:0 "En 1337, el Reino de Dinamarca está al borde del colapso financiero y de la fragmentación territorial. Valdemar IV Atterdag busca recuperar el trono y reconstruir la nación. Recupera Gotland, desafía a la Liga Hanseática, forma la Unión de Kalmar con Noruega y Suecia, domina el Báltico, conquista Inglaterra y elige tu fe: la firmeza católica, la Reforma luterana o el renacimiento de los dioses nórdicos. Construye el Imperio escandinavo."
 den_kalmar_union_mission_pack_CRITERIA_DESCRIPTION:0 "Como Dinamarca, expándete en todas las direcciones —al norte, al este, religiosamente— y establece el Imperio escandinavo."
 den_kalmar_union_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para construir el Imperio escandinavo."
 den_kalmar_union_mission_pack_BUTTON_DETAILS:0 "De la reconstrucción de Valdemar a la edad de oro de la Unión de Kalmar: ¡une Escandinavia!"
 den_restoration_of_denmark: "La reconstrucción de Valdemar"
 den_restoration_of_denmark_desc: "En 1340, Valdemar IV Atterdag recuperó el trono de una Dinamarca fragmentada y vendida a pedazos: hasta Jutlandia estaba empeñada a Prusia. Poco a poco, la recuperó. “Atterdag” —“de nuevo amaneció”—: su propio apodo encarnaba su misión histórica. Asegura Copenhague y eleva la legitimidad de la corona."
 den_secure_denmark: "Estabiliza Dinamarca"
 den_secure_denmark_desc: "Tomar Roskilde, Aarhus y Malmö une el corazón danés. Roskilde es el lugar tradicional de sepultura de los reyes daneses y su capital espiritual; Malmö es la puerta clave al Báltico. Con ellas aseguradas, Dinamarca puede mirar hacia fuera."
 den_norway_union: "Unión personal con Noruega"
 den_norway_union_desc: "Dinamarca y Noruega entraron en unión personal en 1380, con la muerte de Haakon VI. Su hija, Margarita I, se convirtió en regente de Noruega y sentó las bases de la Unión de Kalmar. Trae Noruega bajo la bandera danesa y da el primer paso hacia la unidad escandinava."
 den_sweden_union: "Unión personal con Suecia"
 den_sweden_union_desc: "Suecia fue la gran rival septentrional de Dinamarca durante generaciones de conflicto. Algunos nobles suecos buscan la protección danesa. Ya sea por diplomacia o por conquista, trae Suecia al control danés: y Escandinavia estará al alcance."
 den_integrate_holstein: "Integra Holstein"
 den_integrate_holstein_desc: "Holstein es un ducado de lengua alemana cuyo duque es el rey danés. Controlar Hamburgo y Holstein asegura la frontera sur y presiona a la Liga Hanseática. “Danés en Holstein, Holstein en Dinamarca”: resuelve esta ambigüedad de una vez por todas."
 den_kalmar_union: "La Unión de Kalmar"
 den_kalmar_union_desc: "La Unión de Kalmar de 1397, planeada por Margarita I, unió las tres coronas de Dinamarca, Noruega y Suecia bajo un solo rey. Cada país mantenía sus derechos y tradiciones, pero coordinaba la política exterior y militar. Nace el Imperio del Norte."
 den_unite_scandinavia: "Une Escandinavia"
 den_unite_scandinavia_desc: "Con Suecia conquistada y Holstein integrada, toda Escandinavia se une bajo el estandarte danés. Del Báltico al Mar de Noruega, una sola dinastía gobierna todo. Es la mayor hazaña política de la historia del Norte."
 den_integrate_norway: "Integra Noruega"
 den_integrate_norway_desc: "Toma Oslo y Bergen e integra por completo Noruega como parte del imperio danés. Bergen fue antaño el primer nudo septentrional de la Liga Hanseática: ahora se convierte en la puerta de Dinamarca al Atlántico Norte."
 den_integrate_sweden: "Integra Suecia"
 den_integrate_sweden_desc: "Integra por completo Suecia como parte del imperio danés. Poseer Estocolmo y mantener Svealand hace de Suecia parte inseparable del reino."
 den_develop_trondheim: "Desarrolla la Noruega del norte"
 den_develop_trondheim_desc: "Trondheim es la capital histórica de Noruega y sede de su arzobispo. El desarrollo de la costa norte noruega establece control sobre el Atlántico Norte y el Mar de Noruega."
 den_scandinavian_golden_age: "La edad de oro escandinava"
 den_scandinavian_golden_age_desc: "Con Noruega y Suecia integradas y el absolutismo establecido, Escandinavia entra en su edad de oro como el mayor imperio de Europa septentrional. Copenhague prospera como centro cultural y económico, uniendo el Báltico y el Mar del Norte."
 den_retake_gotland: "Recupera Gotland"
 den_retake_gotland_desc: "Visby, en Gotland, fue antaño una de las mayores ciudades comerciales de la Liga Hanseática: premio disputado por Suecia, Livonia y la Orden Teutónica. En 1361, Valdemar IV conquistó Gotland por la fuerza. Tomar esta isla asegura un nudo crucial del comercio báltico."
 den_sound_toll: "El peaje del Øresund"
 den_sound_toll_desc: "Dinamarca se sitúa en el estrecho paso entre el Báltico y el Mar del Norte; todo barco debe atravesar el estrecho del Øresund y pagar el peaje. Formalizado hacia 1429, este peaje se convirtió en la columna vertebral de las finanzas reales danesas. Construye una flota y controla plenamente el estrecho."
 den_humiliate_hansa: "Humilla a la Hansa"
 den_humiliate_hansa_desc: "La Liga Hanseática monopolizó el comercio báltico y amenazó a Dinamarca durante generaciones. Desde la humillante Paz de Stralsund, de 1370, Dinamarca aguarda venganza. Controla Lübeck o supera a la Liga económicamente, y quiebra la hegemonía hanseática."
 den_reconquer_estonia: "Reconquista Estonia"
 den_reconquer_estonia_desc: "Tallin (Reval) fue fundada como fortaleza danesa en 1219 por Valdemar II: “Taani linn” (castillo danés), dicen, el origen de su nombre. Vendida a la Orden Teutónica en 1346, recuperar esta tierra restaura la influencia danesa en la costa este del Báltico."
 den_control_livonia: "Controla Livonia"
 den_control_livonia_desc: "Livonia (actuales Letonia y Estonia) es un premio estratégico, disputado por la Orden Teutónica, Polonia, Suecia y la Rus. Tomar Riga y Tartu pone toda la costa este del Báltico en manos danesas."
 den_stralsund_treaty: "Toma Stralsund"
 den_stralsund_treaty_desc: "Stralsund y Stettin son las principales ciudades de Pomerania, en la orilla sur del Báltico. En 1370, Dinamarca fue forzada a un tratado humillante aquí. Ahora Dinamarca toma la iniciativa: controlar estas ciudades establece el dominio sobre la costa pomerana."
 den_expand_the_toll: "Amplía el peaje"
 den_expand_the_toll_desc: "Amplía el peaje del Øresund para abarcar toda la red comercial báltica. Habiendo conquistado Pomerania y quebrado la Liga Hanseática, Dinamarca se convierte en señora del comercio del norte de Europa."
 den_master_of_the_baltic: "Señor del Báltico"
 den_master_of_the_baltic_desc: "La derrota de la Hansa y el control de Livonia: Dinamarca es la incontestada señora del Báltico. Tomar Königsberg y Gdansk completa el cerco: ningún barco mercante puede entrar ni salir sin permiso danés."
 den_eliminate_novgorod: "Elimina Nóvgorod"
 den_eliminate_novgorod_desc: "La República de Nóvgorod es un gran Estado comercial en el extremo oriental de las rutas comerciales báltico-barentsianas. Controlar Nóvgorod y Pskov trae toda la ruta de comercio ruso de pieles, ámbar y miel bajo administración danesa."
 den_rival_england: "Rivaliza con Inglaterra"
 den_rival_england_desc: "El rey danés Canuto el Grande conquistó antaño Inglaterra (1016). El Imperio del Mar del Norte de Canuto fue la mayor gloria histórica de Dinamarca. Ha llegado la hora de perseguir de nuevo ese sueño. Declara a Inglaterra rival y disputa el dominio del Mar del Norte."
 den_north_sea_fleet: "La flota del Mar del Norte"
 den_north_sea_fleet_desc: "Para gobernar el Mar del Norte, se necesita una poderosa flota. Amplía los astilleros de Copenhague y construye la mayor flota de la historia escandinava. Ha llegado el día en que los barcos daneses navegan de Islandia al Támesis."
 den_danish_scotland: "Dinamarca en Escocia"
 den_danish_scotland_desc: "Escocia es la eterna enemiga de Inglaterra y potencial aliada de Dinamarca. Tomar Edimburgo crea una tenaza en torno a Inglaterra, por el norte y por el sur, recreando la era en que los vikingos gobernaban las costas de Escocia."
 den_invade_england: "Invade Inglaterra"
 den_invade_england_desc: "Fuerzas danesas y noruegas han desembarcado en el norte de Inglaterra. York fue antaño capital del reino noruego de Jórvík: corazón del Danelaw. Tomar York resucita la gloria del Danelaw, los vastos territorios del norte de Inglaterra gobernados por colonos daneses y nórdicos en el siglo IX."
 den_conquer_england: "Conquista Inglaterra"
 den_conquer_england_desc: "Londres y Edimburgo bajo control danés: por primera vez en mil años, desde los tiempos de Canuto el Grande, una dinastía escandinava gobierna las Islas Británicas. El Imperio del Mar del Norte de Dinamarca, Noruega, Suecia e Inglaterra renace."
 den_religious_question: "La cuestión de la fe"
 den_religious_question_desc: "¿Cuál debe ser la fe de Dinamarca? ¿Mantener la fidelidad al papa en Roma, adoptar la doctrina reformadora de Lutero o volver a los antiguos dioses de los ancestros? Esta elección decidirá el futuro de Dinamarca."
 den_catholic_denmark: "La Dinamarca católica"
 den_catholic_denmark_desc: "El Reino de Dinamarca mantiene fidelidad a la Iglesia católica romana. Manteniendo buenas relaciones con el papa, Dinamarca se alza como guardiana de la civilización católica del norte, con ventaja diplomática."
 den_crusade_north: "La Cruzada del Norte"
 den_crusade_north_desc: "Dinamarca se alza como escudo septentrional de la cristiandad, participando en la guerra santa contra naciones infieles. Liderar cruzadas contra los territorios paganos remanentes del Báltico oriental consolida la autoridad religiosa de Dinamarca."
 den_kingdom_of_god: "El Reino de Dios"
 den_kingdom_of_god_desc: "Profunda confianza con el papado y control de Hamburgo: Dinamarca ha establecido la posición inquebrantable de guardiana de la civilización católica del norte. Reconocido por Roma, el rey danés se inscribe en la historia como “Cruzado del Norte”."
 den_reformation: "La Reforma"
 den_reformation_desc: "En 1517, Martín Lutero publicó sus noventa y cinco tesis, y una ola de reforma religiosa barrió Europa. En 1536, el rey Cristián III declaró el luteranismo religión de Estado de Dinamarca. Adelántate a esta transformación histórica y construye una Dinamarca luterana."
 den_protestant_church: "La Iglesia protestante"
 den_protestant_church_desc: "Tras la conversión al luteranismo, los bienes de la iglesia fueron transferidos a la corona danesa, fortaleciendo enormemente las finanzas del Estado. Desarrolla universidades para formar teólogos luteranos y arraigar la fe protestante en toda Dinamarca."
 den_protestant_league: "La Liga Protestante"
 den_protestant_league_desc: "Las naciones luteranas se unen en una liga centrada en Dinamarca. Como la Liga de Esmalcalda, Dinamarca lidera el mundo protestante de Europa septentrional como defensora de la Reforma."
 den_norse_revival: "El renacimiento de la fe nórdica"
 den_norse_revival_desc: "Los dioses de la era vikinga —Odín, Thor, Freyr— nunca se fueron de verdad. Algunos nobles nórdicos resistieron la cristianización y sueñan con un retorno a los antiguos dioses. El mecenazgo real de este movimiento enciende una revolución religiosa inédita en Escandinavia."
 den_viking_tradition: "La tradición vikinga"
 den_viking_tradition_desc: "La sangre de los antiguos escandinavos hierve de nuevo. El espíritu guerrero de los ancestros —cruzar los mares, entrar en tierras hostiles, devastar y conquistar— habita el ejército danés. Construye un poderoso ejército terrestre y una flota; recrea la gloria de la era vikinga."
 den_asgard_kingdom: "El Reino de Asgard"
 den_asgard_kingdom_desc: "Bajo la bendición de Odín, Escandinavia renace como el reino de los antiguos dioses. La creencia de que los bravos guerreros caídos en batalla son recibidos en Valhalla se convierte en el pilar espiritual de la nación. Une toda Escandinavia y construye el reino de los dioses."
 den_strengthen_crown: "Fortalece la corona"
 den_strengthen_crown_desc: "El Reino de Dinamarca ha tenido históricamente su poder real limitado por una poderosa nobleza. La “Håndfæstning” obligaba a cada rey a conceder privilegios nobles al subir al trono. Rompe poco a poco estas cadenas y fortalece la monarquía danesa."
 den_copenhagen_university: "La Universidad de Copenhague"
 den_copenhagen_university_desc: "La Universidad de Copenhague, fundada en 1479, es la más antigua de Escandinavia. Sus facultades de teología, derecho, medicina y filosofía la hacen centro de la cultura danesa. Construye una universidad en Copenhague y realiza la capital erudita del Norte."
 den_develop_copenhagen: "Desarrolla Copenhague"
 den_develop_copenhagen_desc: "Copenhague —“puerto de los mercaderes”— ha crecido como nudo clave del comercio báltico. Elévala al rango de ciudad, convirtiéndola en la gran capital real que Dinamarca merece."
 den_revoke_privileges: "Revoca los privilegios"
 den_revoke_privileges_desc: "Abolir los privilegios nobles que limitaron el poder real danés. Elevar el poder real y realizar reformas gubernamentales pone a Dinamarca en el camino del absolutismo centralizado."
 den_danish_navy: "La Real Armada danesa"
 den_danish_navy_desc: "Desarrolla los astilleros de Copenhague y establece la flota real danesa. Esta institución militar permanente, que sustenta la hegemonía danesa sobre el Báltico y el Mar del Norte, se convierte en pilar del poder danés."
 den_amber_trade: "Comercio de ámbar"
 den_amber_trade_desc: "El ámbar del Báltico —“Oro del Norte”— es valorado desde la Antigüedad. Amplía la exportación de ámbar y joyas por las rutas comerciales bálticas de Dinamarca y asegura ricos ingresos comerciales."
 den_develop_aarhus: "Desarrolla Aarhus"
 den_develop_aarhus_desc: "Aarhus es la mayor ciudad de Jutlandia y centro comercial de la Dinamarca occidental. Elevarla al rango de ciudad la hace la segunda ciudad de Dinamarca después de Copenhague."
 den_develop_malmo: "Desarrolla Malmö"
 den_develop_malmo_desc: "Malmö, en el sur de Suecia (Escania), está al otro lado del estrecho del Øresund respecto a Copenhague. El desarrollo de esta ciudad crea un par vital con Copenhague como nudo del control danés del Báltico."
 den_absolutism: "Absolutismo"
 den_absolutism_desc: "En 1660, el rey Federico III convocó a los tres estamentos —nobleza, clero y plebeyos— y los obligó a proclamar la monarquía absoluta hereditaria. Una de las transformaciones políticas más dramáticas de la historia escandinava. Eleva el poder real y la legitimidad para adelantarte a este giro histórico."
 den_economic_powerhouse: "Potencia comercial del Norte"
 den_economic_powerhouse_desc: "El peaje del Øresund, el comercio del Mar del Norte, la agricultura escandinava: Dinamarca, con sus diversas fuentes de ingresos, se ha convertido en la mayor potencia económica de Europa septentrional. Mantén ingresos 300+ y varios centros comerciales para asegurar el dominio económico."
 den_north_sea_dominion: "Dominio del Mar del Norte"
 den_north_sea_dominion_desc: "Escandinavia unida, Báltico conquistado, edad de oro escandinava alcanzada: Dinamarca gobierna el mayor imperio de Europa septentrional. Con 80+ navíos, ingresos mensuales 600+ y 600+ provincias, reivindica este glorioso título."
 den_scandinavian_empire: "El Imperio escandinavo"
 den_scandinavian_empire_desc: "Del Báltico a Inglaterra, de Gotland a Nóvgorod: el Imperio escandinavo está concluido. Dinamarca, reconstruida por Valdemar IV, ha crecido hasta convertirse en un gran imperio que domina toda Europa septentrional. 1000+ provincias, prestigio 80+, ingresos 1000+: conquista esta gloria."
 den_events.10.t: "Unión personal noruega"
 den_events.10.d: "El rey de Dinamarca ha heredado el trono de Noruega. Desde los tiempos vikingos, Dinamarca y Noruega estuvieron ligadas bajo una misma casa real. Las ricas pesquerías, la madera y la puerta del Atlántico Norte de Noruega amplían enormemente el poder danés. El rey, que porta el título de “Rey de los Dos Reinos”, ha dado el primer paso histórico hacia la unidad escandinava."
 den_events.10.a: "¡Noruega y Dinamarca, unidas para siempre!"
 den_events.20.t: "Unión personal sueca"
 den_events.20.d: "El rey de Dinamarca ha asegurado también el trono sueco. Algunos nobles suecos resisten, pero esta unión personal es un paso decisivo hacia la unidad escandinava. El genio diplomático de la reina Margarita ha realizado este milagro: el sueño de un “Emperador de Escandinavia” se acerca a la realidad."
 den_events.20.a: "Hacia la unidad de los tres reinos: ¡adelante!"
 den_events.30.t: "La Unión de Kalmar"
 den_events.30.d: "En Kalmar, en Suecia, representantes de Dinamarca, Noruega y Suecia se reunieron y proclamaron la unión bajo el rey Érico de Pomerania. Cada país mantiene sus derechos y tradiciones, pero coordina la política exterior y militar. “Valdemar soñó con esto; Margarita lo hizo realidad”, escribirán luego los historiadores."
 den_events.30.a: "¡Viva la Unión de Kalmar! ¡Escandinavia es una!"
 den_events.40.t: "La encrucijada de la fe"
 den_events.40.d: "Una acalorada disputa religiosa ha estallado en la corte danesa. ¿Continuar la tradicional fidelidad al papa en Roma, adoptar la nueva doctrina de Martín Lutero o volver a los antiguos dioses de los ancestros? Esta elección toca las propias bases del Estado danés."
 den_events.40.a: "Mantener la fidelidad a Roma: el catolicismo es la fe de Dinamarca"
 den_events.40.a.tt: "Avanzar por el camino católico. Facilita cumplir las condiciones de la misión den_catholic_denmark."
 den_events.40.b: "Adoptar la doctrina de Lutero: ha llegado la era de la reforma"
 den_events.40.b.tt: "Avanzar por el camino luterano. Facilita cumplir las condiciones de la misión den_reformation."
 den_events.40.c: "Volver a los antiguos dioses: buscar la bendición de Odín"
 den_events.40.c.tt: "Avanzar por el camino nórdico. Facilita cumplir las condiciones de la misión den_norse_revival."
 den_events.99.t: "Nace el Imperio escandinavo"
 den_events.99.d: "Siglos después de que Valdemar IV heredara una Dinamarca devastada, Dinamarca ha crecido hasta ser un gran imperio que domina toda Europa septentrional. Del Báltico al Mar del Norte, de las estepas de Nóvgorod a las Islas Británicas, todo reposa en los límites del reino del emperador danés. Los historiadores escribirán después: “Atterdag —de nuevo amaneció— era una verdadera profecía”."
 den_events.99.a: "¡Viva el Emperador del Imperio escandinavo!"
 STATIC_MODIFIER_NAME_den_valdemar_legacy_mod: "El legado de Valdemar"
 STATIC_MODIFIER_DESC_den_valdemar_legacy_mod: "“Atterdag, de nuevo amaneció”. La reconstrucción de Valdemar IV sentó la piedra angular del renacimiento de Dinamarca."
 STATIC_MODIFIER_NAME_den_holstein_integration_mod: "Holstein integrada"
 STATIC_MODIFIER_DESC_den_holstein_integration_mod: "El ducado de Holstein plenamente integrado al imperio danés. Frontera sur estabilizada y rutas comerciales meridionales aseguradas."
 STATIC_MODIFIER_NAME_den_scandinavia_united_mod: "Escandinavia unida"
 STATIC_MODIFIER_DESC_den_scandinavia_united_mod: "Tres reinos unidos bajo un solo estandarte. Nace el mayor Estado de Europa septentrional."
 STATIC_MODIFIER_NAME_den_norway_integration_mod: "Noruega integrada"
 STATIC_MODIFIER_DESC_den_norway_integration_mod: "Noruega integrada como parte del imperio danés. La puerta del Atlántico Norte abierta."
 STATIC_MODIFIER_NAME_den_sweden_integration_mod: "Suecia integrada"
 STATIC_MODIFIER_DESC_den_sweden_integration_mod: "El nombre del rey danés se lee en los salones de Estocolmo, y los señores suecos se sientan también a la misma mesa como miembros del imperio."
 STATIC_MODIFIER_NAME_den_visby_trade_mod: "Nudo comercial de Visby"
 STATIC_MODIFIER_DESC_den_visby_trade_mod: "Visby, en Gotland, revive como nudo comercial danés. La antigua ciudad hanseática prospera de nuevo."
 STATIC_MODIFIER_NAME_den_sound_toll_mod: "El peaje del Øresund"
 STATIC_MODIFIER_DESC_den_sound_toll_mod: "Sistema de cobro establecido. Todo barco mercante que entra o sale del Báltico paga a Dinamarca."
 STATIC_MODIFIER_NAME_den_hansa_dominance_mod: "Derrota de la Hansa"
 STATIC_MODIFIER_DESC_den_hansa_dominance_mod: "Dinamarca ha quebrado la hegemonía hanseática y ha conquistado el control del comercio báltico."
 STATIC_MODIFIER_NAME_den_estonia_mod: "Estonia recuperada"
 STATIC_MODIFIER_DESC_den_estonia_mod: "Tallin (castillo danés) ha vuelto a Dinamarca. Influencia danesa en la costa este del Báltico restaurada."
 STATIC_MODIFIER_NAME_den_livonia_mod: "Livonia subyugada"
 STATIC_MODIFIER_DESC_den_livonia_mod: "Con Riga y Tartu aseguradas, toda la costa este del Báltico bajo administración danesa."
 STATIC_MODIFIER_NAME_den_pomeranian_coast_mod: "La costa de Pomerania"
 STATIC_MODIFIER_DESC_den_pomeranian_coast_mod: "La toma de Stralsund y Stettin pone toda la costa pomerana bajo control danés."
 STATIC_MODIFIER_NAME_den_sound_toll_extended_mod: "El peaje ampliado"
 STATIC_MODIFIER_DESC_den_sound_toll_extended_mod: "Todo barco que pasa por el Øresund, rumbo a cualquier puerto báltico, arría las velas ante la cadena del servicio aduanero danés."
 STATIC_MODIFIER_NAME_den_baltic_master_mod: "Señor del Báltico"
 STATIC_MODIFIER_DESC_den_baltic_master_mod: "La flota danesa domina todo el Báltico. Cada puerto, de Königsberg a Gdansk, responde a Dinamarca."
 STATIC_MODIFIER_NAME_den_eastern_routes_mod: "Rutas comerciales del Este"
 STATIC_MODIFIER_DESC_den_eastern_routes_mod: "Nóvgorod conquistada: toda la ruta comercial de mercancías rusas bajo administración danesa."
 STATIC_MODIFIER_NAME_den_north_sea_fleet_mod: "La flota del Mar del Norte"
 STATIC_MODIFIER_DESC_den_north_sea_fleet_mod: "La flota real danesa controla el Mar del Norte. De Islandia al Támesis, la bandera danesa ondea."
 STATIC_MODIFIER_NAME_den_scotland_mod: "Dinamarca en Escocia"
 STATIC_MODIFIER_DESC_den_scotland_mod: "Edimburgo tomada: Inglaterra puede ahora ser apretada por el norte y por el sur."
 STATIC_MODIFIER_NAME_den_england_invasion_mod: "Invasión de Inglaterra"
 STATIC_MODIFIER_DESC_den_england_invasion_mod: "Las fuerzas danesas que ocupan York han resucitado la memoria del Danelaw."
 STATIC_MODIFIER_NAME_den_north_sea_empire_mod: "El Imperio del Mar del Norte"
 STATIC_MODIFIER_DESC_den_north_sea_empire_mod: "Por primera vez en mil años, desde los tiempos de Canuto el Grande, una dinastía escandinava gobierna las Islas Británicas. El Imperio del Mar del Norte renace."
 STATIC_MODIFIER_NAME_den_catholic_devotion_mod: "Devoción católica"
 STATIC_MODIFIER_DESC_den_catholic_devotion_mod: "Dinamarca mantiene fidelidad a la Iglesia de Roma. La cooperación con el papa da a Dinamarca ventaja diplomática."
 STATIC_MODIFIER_NAME_den_northern_crusader_mod: "Cruzado del Norte"
 STATIC_MODIFIER_DESC_den_northern_crusader_mod: "La participación de Dinamarca en la guerra santa gana fama de guardiana de la cristiandad."
 STATIC_MODIFIER_NAME_den_papal_champion_mod: "Campeona del papa"
 STATIC_MODIFIER_DESC_den_papal_champion_mod: "Dinamarca ha establecido la posición inquebrantable de guardiana de la civilización católica del norte."
 STATIC_MODIFIER_NAME_den_lutheran_reform_mod: "Reforma luterana"
 STATIC_MODIFIER_DESC_den_lutheran_reform_mod: "Cálices de oro y candelabros de plata de los monasterios confiscados fundidos en la casa de la moneda real en Copenhague y acuñados en nueva moneda."
 STATIC_MODIFIER_NAME_den_protestant_church_mod: "La Iglesia protestante"
 STATIC_MODIFIER_DESC_den_protestant_church_mod: "El desarrollo de las universidades y la formación de teología luterana arraigan la fe protestante en toda Dinamarca."
 STATIC_MODIFIER_NAME_den_protestant_league_mod: "La Liga Protestante"
 STATIC_MODIFIER_DESC_den_protestant_league_mod: "La alianza luterana, liderada por Dinamarca, une el mundo protestante de Europa septentrional."
 STATIC_MODIFIER_NAME_den_norse_revival_mod: "Renacimiento de la fe nórdica"
 STATIC_MODIFIER_DESC_den_norse_revival_mod: "El culto a Odín, Thor y Freyr restaurado. El espíritu guerrero de los ancestros habita los ejércitos daneses."
 STATIC_MODIFIER_NAME_den_viking_warriors_mod: "Guerreros vikingos"
 STATIC_MODIFIER_DESC_den_viking_warriors_mod: "El espíritu guerrero de la era vikinga renace. Los ejércitos de Dinamarca son insuperables cruzando mares y conquistando tierras hostiles."
 STATIC_MODIFIER_NAME_den_asgard_kingdom_mod: "El Reino de Asgard"
 STATIC_MODIFIER_DESC_den_asgard_kingdom_mod: "Bajo la bendición de Odín, Escandinavia renace como el reino de los antiguos dioses."
 STATIC_MODIFIER_NAME_den_royal_authority_mod: "Autoridad real"
 STATIC_MODIFIER_DESC_den_royal_authority_mod: "El consejo de la nobleza ya no se interpone a la voluntad del rey, y sus órdenes llegan directamente a las aldeas de todos los rincones de la tierra."
 STATIC_MODIFIER_NAME_den_copenhagen_learning_mod: "La Universidad de Copenhague"
 STATIC_MODIFIER_DESC_den_copenhagen_learning_mod: "La más antigua universidad de Escandinavia abierta en Copenhague. Prospera como centro de saber y cultura del norte."
 STATIC_MODIFIER_NAME_den_copenhagen_capital_mod: "Capital Copenhague desarrollada"
 STATIC_MODIFIER_DESC_den_copenhagen_capital_mod: "Nuevas residencias de piedra se alzan una tras otra a lo largo de las calles de Copenhague, que bulle de vida como corresponde a una capital real."
 STATIC_MODIFIER_NAME_den_absolutism_mod: "Absolutismo"
 STATIC_MODIFIER_DESC_den_absolutism_mod: "Monarquía absoluta establecida en Dinamarca: adelantándose a la transformación histórica de 1660, el poder real plenamente consolidado."
 STATIC_MODIFIER_NAME_den_danish_economy_mod: "Potencia económica danesa"
 STATIC_MODIFIER_DESC_den_danish_economy_mod: "La economía de Dinamarca —construida sobre el peaje del Øresund, el comercio del Mar del Norte y la agricultura escandinava— es la mayor de Europa septentrional."
 STATIC_MODIFIER_NAME_den_crown_privileges_mod: "Privilegios de la corona"
 STATIC_MODIFIER_DESC_den_crown_privileges_mod: "Las cartas de privilegio que los nobles guardaron por generaciones derribadas, y los escribas reales administran ahora todo el reino."
 STATIC_MODIFIER_NAME_den_royal_navy_mod: "La Real Armada danesa"
 STATIC_MODIFIER_DESC_den_royal_navy_mod: "La flota real danesa, con base en Copenhague, fundada: institución militar permanente que sustenta la supremacía sobre el Báltico y el Mar del Norte."
 STATIC_MODIFIER_NAME_den_amber_trade_mod: "Comercio de ámbar"
 STATIC_MODIFIER_DESC_den_amber_trade_mod: "Exportación de ámbar del Báltico ampliada. El “Oro del Norte” circula por toda Europa, enriqueciendo a Dinamarca."
 STATIC_MODIFIER_NAME_den_aarhus_mod: "Aarhus desarrollada"
 STATIC_MODIFIER_DESC_den_aarhus_mod: "La mayor ciudad de Jutlandia, Aarhus, desarrollada como nudo comercial de la Dinamarca occidental."
 STATIC_MODIFIER_NAME_den_malmo_mod: "Malmö desarrollada"
 STATIC_MODIFIER_DESC_den_malmo_mod: "Malmö, en la orilla oeste del estrecho del Øresund, ha crecido como nudo comercial báltico, emparejada con Copenhague."
 STATIC_MODIFIER_NAME_den_norway_north_mod: "Noruega del norte desarrollada"
 STATIC_MODIFIER_DESC_den_norway_north_mod: "El desarrollo de la costa norte noruega establece control sobre el Atlántico Norte y el Mar de Noruega."
 STATIC_MODIFIER_NAME_den_golden_age_mod: "La edad de oro escandinava"
 STATIC_MODIFIER_DESC_den_golden_age_mod: "Con Noruega y Suecia integradas y el absolutismo establecido, Escandinavia entra en su edad de oro como el mayor imperio de Europa septentrional."
 STATIC_MODIFIER_NAME_den_north_sea_dominion_mod: "Dominio del Mar del Norte"
 STATIC_MODIFIER_DESC_den_north_sea_dominion_mod: "Dinamarca, que controla tanto el Báltico como el Mar del Norte, domina todo el comercio del norte de Europa."
 STATIC_MODIFIER_NAME_den_scandinavian_empire_final_mod: "El Imperio escandinavo"
 STATIC_MODIFIER_DESC_den_scandinavian_empire_final_mod: "El Imperio escandinavo, que se extiende del Báltico al Mar del Norte, concluido. El renacimiento de Dinamarca desde la reconstrucción de Valdemar ha alcanzado su cenit."
 STATIC_MODIFIER_NAME_den_norway_union_bonus_mod: "Bonificación de la unión noruega"
 STATIC_MODIFIER_DESC_den_norway_union_bonus_mod: "La unión personal noruega abrió el camino hacia la unidad escandinava."
 STATIC_MODIFIER_NAME_den_sweden_union_bonus_mod: "Bonificación de la unión sueca"
 STATIC_MODIFIER_DESC_den_sweden_union_bonus_mod: "La unión personal sueca trae la formación de la Unión de Kalmar al campo de visión."
 STATIC_MODIFIER_NAME_den_kalmar_union_mod: "La Unión de Kalmar"
 STATIC_MODIFIER_DESC_den_kalmar_union_mod: "Dinamarca, Noruega y Suecia unidas bajo un solo rey: la mayor integración política de la historia del Norte."
 STATIC_MODIFIER_NAME_den_faith_steadfast_mod: "Firme en la fe"
 STATIC_MODIFIER_DESC_den_faith_steadfast_mod: "La inquebrantable fe católica proclama la autoridad del rey al pueblo con las campanas de la catedral de Roskilde."
 STATIC_MODIFIER_NAME_den_reform_winds_mod: "Vientos de reforma"
 STATIC_MODIFIER_DESC_den_reform_winds_mod: "La enseñanza de Lutero se extiende por Dinamarca. La ola de reforma transforma la sociedad danesa."
 STATIC_MODIFIER_NAME_den_old_gods_calling_mod: "La llamada de los antiguos dioses"
 STATIC_MODIFIER_DESC_den_old_gods_calling_mod: "La fe en Odín y Thor renace en secreto. La bendición de los dioses ancestrales inspira los ejércitos daneses."
 den_finland_integration: "Integra Finlandia"
 den_finland_integration_desc: "Finlandia es el vasto reino forestal oriental del reino sueco. Turku (Åbo) es el centro administrativo y religioso de Finlandia; Víborg guarda la frontera carelia; Uleåborg (Oulu) es la ciudad más septentrional. El control pleno de Finlandia establece la frontera oriental del imperio danés del norte del Báltico al Círculo Polar Ártico, permitiendo la política colonial en las áreas salvajes."
 STATIC_MODIFIER_NAME_den_finland_mod: "La frontera finlandesa"
 STATIC_MODIFIER_DESC_den_finland_mod: "Los vastos bosques y vías fluviales de Finlandia atraen colonos. Pobladores de Dinamarca y Suecia desbrozan esta frontera, empujando las fronteras orientales del imperio cada vez más lejos."
