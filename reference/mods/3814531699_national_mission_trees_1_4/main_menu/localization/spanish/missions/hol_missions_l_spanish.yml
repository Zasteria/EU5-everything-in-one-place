l_spanish:
 hol_holland_mission_pack: "Verdadera Libertad: del Condado de Holanda a las Provincias Unidas"
 hol_holland_mission_pack_DESCRIPTION:0 "El Condado de Holanda, gobernado por la casa de Avesnes: triunfa sobre la Liga Hanseática, absorbe Henao y Brabante, gana la independencia de la tiranía española y construye una edad de oro como verdadera república sin monarca."
 hol_holland_mission_pack_CRITERIA_DESCRIPTION:0 "Une el condado, gana la independencia y alcanza una edad de oro como república bajo la soberanía de los Estados."
 hol_holland_mission_pack_BUTTON_TOOLTIP:0 "De pequeño condado a república unida de comercio y libertad."
 hol_holland_mission_pack_BUTTON_DETAILS:0 "“La unión hace la fuerza”: ¡construye una verdadera república sin monarca por todos los Países Bajos!"
 hol_county_of_holland: "El Condado de Holanda"
 hol_county_of_holland_desc: "El Condado de Holanda, en el corazón de los Países Bajos, bendecido con vías fluviales y comercio: el anciano conde Guillermo III de la casa de Avesnes se acerca al final de su reinado."
 hol_secure_dordrecht: "Desarrolla Dordrecht"
 hol_secure_dordrecht_desc: "Dordrecht, la antigua ciudad comercial en la confluencia del Rin y el Mosa: apóyate en el derecho de staple que se le concedió y llévala a un mayor desarrollo."
 hol_hoekse_kabeljauwse: "Los Hoeken y los Kabeljauwen"
 hol_hoekse_kabeljauwse_desc: "La facción noble de los Hoeken (Anzuelos) y la facción urbana de los Kabeljauwen (Bacalaos): sofoca esta lucha interna que divide el condado por la sucesión condal y establece un gobierno estable."
 hol_zeeland_unification: "Une Zelanda"
 hol_zeeland_unification_desc: "Zelanda, tierra de islas esparcidas por el Mar del Norte: trae esta región al dominio del condado."
 hol_frisian_freedom: "La libertad de la Frisia occidental"
 hol_frisian_freedom_desc: "El pueblo de la Frisia occidental, que aprecia su autonomía: concédeles libertad bajo el estandarte del condado."
 hol_utrecht_relations: "Relaciones con Utrecht"
 hol_utrecht_relations_desc: "El Obispado de Utrecht, que ostenta vasto poder secular: construye relaciones con este vecino bajo nuestra influencia."
 hol_wittelsbach_inheritance: "Unión con Henao"
 hol_wittelsbach_inheritance_desc: "Por medio de la princesa Margarita, casada con el emperador Luis IV, profundiza el vínculo con el vecino Condado de Henao: por matrimonio, por subyugación o por su extinción, une Holanda, Zelanda y Henao bajo un solo estandarte."
 hol_herring_industry: "Desarrolla la industria del arenque"
 hol_herring_industry_desc: "La pesquería de arenque conocida como la “Gran Pesquería” (grote visserij): desarrolla esta gran industria más aún, junto con el arte del salado."
 hol_hansa_rivalry: "Rivalidad con la Hansa"
 hol_hansa_rivalry_desc: "La Liga Hanseática, que domina el comercio del Báltico: armado con fletes baratos y eficientes naves mercantes, triunfa sobre esta venerable liga."
 hol_amsterdam_rise: "El ascenso de Ámsterdam"
 hol_amsterdam_rise_desc: "Ámsterdam, una pequeña aldea de pescadores en el IJ: desarrolla este lugar hasta convertirlo en un gran nudo del comercio del Mar del Norte."
 hol_moedernegotie: "El Comercio Madre (Moedernegotie)"
 hol_moedernegotie_desc: "El comercio de grano del Báltico: domina este comercio, llamado “la madre de todo comercio”, y hazlo la base de la prosperidad."
 hol_contest_brabant: "Ambiciones hacia Brabante"
 hol_contest_brabant_desc: "El Ducado de Brabante, la otra gran potencia de los Países Bajos: vuelve la mirada de la ambición hacia esta tierra."
 hol_absorb_brabant: "La absorción de Brabante"
 hol_absorb_brabant_desc: "Anexiona o subyuga el Ducado de Brabante: prueba que Holanda, y no Brabante, es el señor de los Países Bajos."
 hol_reformation_choice: "La elección de la Reforma"
 hol_reformation_choice_desc: "Las enseñanzas de Lutero y Calvino sacuden los Países Bajos: de pie en esta encrucijada de la fe, ¿qué camino elegiremos?"
 hol_calvinist_merchants: "Mercaderes calvinistas"
 hol_calvinist_merchants_desc: "El calvinismo, que predica una fe frugal y disciplinada: acepta como religión de Estado este credo que ha conquistado los corazones de los ciudadanos mercaderes."
 hol_union_of_utrecht: "La Unión de Utrecht"
 hol_union_of_utrecht_desc: "La Unión de Utrecht, formada por las provincias septentrionales de los Países Bajos: álzate como su núcleo y enfréntate al enemigo común."
 hol_watergeuzen: "Los Mendigos del Mar (Watergeuzen)"
 hol_watergeuzen_desc: "Corsarios que se llaman a sí mismos “Mendigos del Mar”: sus hazañas abren brechas en el dominio español de los mares."
 hol_dutch_republic_proper: "Establece la verdadera república"
 hol_dutch_republic_proper_desc: "Una federación de siete provincias en pie de igualdad: establece aquí una verdadera república de mercaderes y ciudadanos, sin monarca."
 hol_east_india_company: "Funda la Compañía de las Indias Orientales"
 hol_east_india_company_desc: "Funda la Compañía Unida de las Indias Orientales (VOC), con la mira puesta en el monopolio del comercio asiático."
 hol_amsterdam_bank: "El Banco de Ámsterdam"
 hol_amsterdam_bank_desc: "Para poner orden en el caos de monedas rivales, funda el Banco de Cambio (Wisselbank) y construye un sistema estable de crédito."
 hol_stock_exchange: "La Bolsa de Ámsterdam"
 hol_stock_exchange_desc: "La primera bolsa de valores del mundo, donde se compran y venden acciones: haz de este lugar el centro de las finanzas europeas."
 hol_dutch_golden_age: "La Edad de Oro neerlandesa"
 hol_dutch_golden_age_desc: "Rembrandt, Vermeer y un comercio floreciente: alcanza el cenit de la “Edad de Oro neerlandesa”."
 hol_estates_of_holland: "Los Estados de Holanda"
 hol_estates_of_holland_desc: "Los Estados de Holanda, compuestos por representantes urbanos: haz de esta asamblea el núcleo del gobierno republicano."
 hol_regent_oligarchy: "La oligarquía de los regentes"
 hol_regent_oligarchy_desc: "Los “Regenten”, ricas familias patricias de mercaderes: establece su dominio oligárquico como la verdadera estructura de gobierno de la república."
 hol_stadtholderless_era: "La era sin estatúder (la Verdadera Libertad)"
 hol_stadtholderless_era_desc: "Una era sin estatúder, en que los Estados ostentan la soberanía: encarna la “Verdadera Libertad” proclamada por Johan de Witt."
 hol_states_sovereignty: "Establece la soberanía de los Estados"
 hol_states_sovereignty_desc: "Una república sin monarca: establece la naturaleza de su soberanía como institución duradera."
 hol_anglo_dutch_rivalry: "La rivalidad anglo-neerlandesa"
 hol_anglo_dutch_rivalry_desc: "Rivalidad con Inglaterra por el dominio del comercio marítimo: afronta esta contienda simbolizada por las Actas de Navegación."
 hol_navigation_act_response: "Responde al Acta de Navegación"
 hol_navigation_act_response_desc: "El Acta de Navegación inglesa: contrarresta esta ley proteccionista y defiende nuestra flota mercante."
 hol_channel_trade_dominance: "Dominio del comercio del Canal"
 hol_channel_trade_dominance_desc: "El estrecho que une el Mar del Norte y el Atlántico: establece la supremacía naval y comercial sobre esta vital vía de agua."
 hol_french_relations: "Relaciones con Francia"
 hol_french_relations_desc: "Las ambiciones del Rey Sol, Luis XIV: presta cuidadosa atención a las relaciones con este poderoso vecino."
 hol_rampjaar_survival: "Sobrevive al Año del Desastre (Rampjaar)"
 hol_rampjaar_survival_desc: "En 1672, golpeada por la invasión simultánea de Inglaterra y Francia: soporta este “Año del Desastre” que amenaza la propia existencia de la nación."
 hol_glorious_revolution: "Victoria sobre el Rey Sol"
 hol_glorious_revolution_desc: "Habiendo soportado el Año del Desastre, la República pasa ahora a la ofensiva: empuja nuestros ejércitos hondo en suelo francés y haz que el Rey Sol, Luis XIV, pague por sus ambiciones."
 hol_united_provinces: "Las Provincias Unidas de los Países Bajos"
 hol_united_provinces_desc: "Desde los cimientos del condado, a través de la guerra de independencia y de una edad de oro, una verdadera república queda aquí concluida."
 hol_events.2.t: "Proclamación de las Provincias Unidas"
 hol_events.2.d: "Una federación de siete provincias en pie de igualdad: una verdadera república de mercaderes y ciudadanos, sin monarca, toma su primer aliento."
 hol_events.2.a: "¡Gloria a la República!"
 hol_events.3.t: "El Año del Desastre (Rampjaar)"
 hol_events.3.d: "1672: invasión simultánea de Francia, Inglaterra, Münster y Colonia. Descrito como “el pueblo irracional, el gobierno impotente, el país desesperado”, hemos soportado esta crisis."
 hol_events.3.a: "¡La República sobrevive!"
 hol_events.4.t: "Victoria sobre el Rey Sol"
 hol_events.4.d: "Habiendo penetrado hondo en territorio francés, nuestros ejércitos han quebrado por fin las ambiciones de Luis XIV. El nombre de la República será conocido ahora ampliamente como gran potencia de Europa."
 hol_events.4.a: "¡Gloria a la República!"
 hol_events.5.t: "Una encrucijada para los Estados de Holanda"
 hol_events.5.d: "Los Estados afrontan una elección fatídica sobre la forma de gobierno de la república: inclinarse hacia un orden monárquico bajo un estatúder, o mantenerse firmes en una verdadera república de ciudadanos y mercaderes."
 hol_events.5.a: "Concentrar la autoridad en la casa de Orange"
 hol_events.5.b: "Defender la república bajo la soberanía de los Estados"
 hol_events.99.t: "Las Provincias Unidas concluidas"
 hol_events.99.d: "El largo camino, iniciado en el Condado de Holanda, a través de una guerra de independencia y de una edad de oro, queda aquí concluido como una verdadera república."
 hol_events.99.a: "¡Vivan las Provincias Unidas!"
 STATIC_MODIFIER_NAME_hol_county_mod: "El Condado de Holanda"
 STATIC_MODIFIER_DESC_hol_county_mod: "El recuerdo de un condado criado por vías fluviales y comercio aún vive como orgullo del pueblo."
 STATIC_MODIFIER_NAME_hol_dordrecht_mod: "Dordrecht desarrollada"
 STATIC_MODIFIER_DESC_hol_dordrecht_mod: "En el encuentro del Rin y el Mosa, los barcos mercantes de Dordrecht no cesan de cargar y descargar sus mercancías."
 STATIC_MODIFIER_NAME_hol_hoekse_mod: "Los Hoeken y los Kabeljauwen"
 STATIC_MODIFIER_DESC_hol_hoekse_mod: "Quienes antaño alzaron los estandartes de los Hoeken y los Kabeljauwen marchan ahora juntos en las filas del conde."
 STATIC_MODIFIER_NAME_hol_zeeland_mod: "Zelanda unificada"
 STATIC_MODIFIER_DESC_hol_zeeland_mod: "En las gradas de Middelburg, la madera reunida de las islas toma forma como casco tras casco."
 STATIC_MODIFIER_NAME_hol_frisian_mod: "La libertad de la Frisia occidental"
 STATIC_MODIFIER_DESC_hol_frisian_mod: "“Los frisones no tienen señor”: ese orgulloso espíritu de autonomía reúne a muchos en las filas cuando la hora lo exige."
 STATIC_MODIFIER_NAME_hol_utrecht_mod: "Relaciones con Utrecht"
 STATIC_MODIFIER_DESC_hol_utrecht_mod: "Las campanas de las torres de Utrecht doblan una callada y cordial vecindad entre condado y obispado."
 STATIC_MODIFIER_NAME_hol_wittelsbach_mod: "Unión con Henao"
 STATIC_MODIFIER_DESC_hol_wittelsbach_mod: "Una nueva línea de gobernantes de Baviera trae orden a las tierras de Holanda, Zelanda y Henao."
 STATIC_MODIFIER_NAME_hol_absorb_brabant_mod: "Brabante absorbida"
 STATIC_MODIFIER_DESC_hol_absorb_brabant_mod: "Las armas de Holanda cuelgan ahora en la corte de Bruselas, y la riqueza del sur fluye constante hacia Ámsterdam."
 STATIC_MODIFIER_NAME_hol_herring_mod: "Industria del arenque desarrollada"
 STATIC_MODIFIER_DESC_hol_herring_mod: "Flotas cargadas de arenque salado serpentean de regreso a casa por las olas del Mar del Norte, una tras otra."
 STATIC_MODIFIER_NAME_hol_hansa_rivalry_mod: "Rivalidad con la Hansa"
 STATIC_MODIFIER_DESC_hol_hansa_rivalry_mod: "Mientras los mercaderes de Lübeck fruncen el ceño, nuestras baratas tarifas de flete se ganan a los cargadores de todo el Báltico."
 STATIC_MODIFIER_NAME_hol_amsterdam_rise_mod: "El ascenso de Ámsterdam"
 STATIC_MODIFIER_DESC_hol_amsterdam_rise_mod: "Antaño pequeña aldea de pescadores en el IJ, Ámsterdam atrae ahora veleros de todos los rincones del mundo."
 STATIC_MODIFIER_NAME_hol_moedernegotie_mod: "El Comercio Madre"
 STATIC_MODIFIER_DESC_hol_moedernegotie_mod: "El grano traído del Báltico mantiene llenas nuestras mesas y nuestro tesoro incluso en años de hambruna."
 STATIC_MODIFIER_NAME_hol_reformation_mod: "La elección de la Reforma"
 STATIC_MODIFIER_DESC_hol_reformation_mod: "Entre las campanas de las iglesias, los callados debates sobre la fe vieja y la nueva no cesan en las plazas de los mercados."
 STATIC_MODIFIER_NAME_hol_calvinist_mod: "Mercaderes calvinistas"
 STATIC_MODIFIER_DESC_hol_calvinist_mod: "Las lámparas arden hasta tarde en la noche en las casas de mercaderes donde se lee la Biblia y se la medita de primera mano."
 STATIC_MODIFIER_NAME_hol_union_utrecht_mod: "La Unión de Utrecht"
 STATIC_MODIFIER_DESC_hol_union_utrecht_mod: "El pacto firmado en Utrecht se ha convertido en la esperanza a la que se aferra cada provincia del norte."
 STATIC_MODIFIER_NAME_hol_watergeuzen_mod: "Los Mendigos del Mar"
 STATIC_MODIFIER_DESC_hol_watergeuzen_mod: "“Mejor mendigos que hombres del rey”: con ese grito en mente, nuestros marineros aún cazan hoy la bandera española."
 STATIC_MODIFIER_NAME_hol_voc_mod: "La Compañía de las Indias Orientales"
 STATIC_MODIFIER_DESC_hol_voc_mod: "El aroma de las especias de Batavia llena el barrio de almacenes de Ámsterdam."
 STATIC_MODIFIER_NAME_hol_wisselbank_mod: "El Banco de Ámsterdam"
 STATIC_MODIFIER_DESC_hol_wisselbank_mod: "La confianza encerrada en las bóvedas del Banco de Cambio es la más cierta garantía que poseen los mercaderes de esta ciudad."
 STATIC_MODIFIER_NAME_hol_wisselbank_capital_mod: "Capital del Banco de Cambio"
 STATIC_MODIFIER_DESC_hol_wisselbank_capital_mod: "Con los libros del tesoro y las bóvedas del Banco de Cambio bajo un mismo techo, los asuntos de Estado discurren aún con mayor fluidez."
 STATIC_MODIFIER_NAME_hol_exchange_mod: "La Bolsa de Ámsterdam"
 STATIC_MODIFIER_DESC_hol_exchange_mod: "En el piso de la bolsa, los gritos de los corredores que agitan sus certificados de acciones nunca cesan."
 STATIC_MODIFIER_NAME_hol_golden_age_mod: "La Edad de Oro neerlandesa"
 STATIC_MODIFIER_DESC_hol_golden_age_mod: "La luz y la sombra captadas por el pincel de Rembrandt contarán esta era de prosperidad a las generaciones venideras."
 STATIC_MODIFIER_NAME_hol_regent_mod: "La oligarquía de los regentes"
 STATIC_MODIFIER_DESC_hol_regent_mod: "Las calladas reuniones de ricas familias patricias son donde se toman las verdaderas decisiones de la república."
 STATIC_MODIFIER_NAME_hol_stadtholderless_mod: "La era sin estatúder"
 STATIC_MODIFIER_DESC_hol_stadtholderless_mod: "El asiento del estatúder está vacío, y sin embargo los asuntos de Estado discurren con más fluidez que nunca."
 STATIC_MODIFIER_NAME_hol_anglo_rivalry_mod: "La rivalidad anglo-neerlandesa"
 STATIC_MODIFIER_DESC_hol_anglo_rivalry_mod: "Los repetidos intercambios de cañonazos con nuestro rival al otro lado del Canal han forjado a nuestros marineros en veteranos curtidos."
 STATIC_MODIFIER_NAME_hol_navigation_act_mod: "Respuesta al Acta de Navegación"
 STATIC_MODIFIER_DESC_hol_navigation_act_mod: "Sin amilanarse ante las ordenanzas de Inglaterra, nuestras flotas mercantes aún encuentran los resquicios que mantienen abiertas las rutas comerciales."
 STATIC_MODIFIER_NAME_hol_channel_dominance_mod: "Dominio del comercio del Canal"
 STATIC_MODIFIER_DESC_hol_channel_dominance_mod: "Se ha vuelto raro ver en aquel estrecho entre el Mar del Norte y el Atlántico un barco que no ondee nuestros colores."
 STATIC_MODIFIER_NAME_hol_french_relations_mod: "Relaciones con Francia"
 STATIC_MODIFIER_DESC_hol_french_relations_mod: "Inquietantes rumores de la corte del Rey Sol mantienen siempre alerta a nuestras guarniciones fronterizas."
 STATIC_MODIFIER_NAME_hol_united_provinces_mod: "Las Provincias Unidas de los Países Bajos"
 STATIC_MODIFIER_DESC_hol_united_provinces_mod: "La unidad de siete provincias sin monarca ha hecho conocido nuestro nombre en todos los mares y mercados del mundo."
 STATIC_MODIFIER_NAME_hol_rampjaar_mod: "Supervivencia al Año del Desastre"
 STATIC_MODIFIER_DESC_hol_rampjaar_mod: "“El pueblo irracional, el gobierno impotente, el país desesperado”: habiéndose sacudido ese veredicto, nuestros soldados llevan el recuerdo con orgullo."
 STATIC_MODIFIER_NAME_hol_glorious_revolution_mod: "Victoria sobre el Rey Sol"
 STATIC_MODIFIER_DESC_hol_glorious_revolution_mod: "Los relatos de la marcha de nuestro ejército hondo en suelo francés se cuentan ahora con orgullo en todas las cortes de Europa."
 STATIC_MODIFIER_NAME_hol_republic_declared_mod: "La República proclamada"
 STATIC_MODIFIER_DESC_hol_republic_declared_mod: "Delegados de ciudadanos y mercaderes se reúnen ahora con orgullo en una cámara que no responde a monarca alguno."
