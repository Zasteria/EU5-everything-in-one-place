l_spanish:
 teo_theodoro_mission_pack: "El Principado de Teodoro: la Gotia renacida y el señor del Mar Negro"
 teo_theodoro_mission_pack_DESCRIPTION:0 "En 1337, el principado de Teodoro se aferra a la fortaleza montañosa de Mangup, en la Península de Crimea. Antaño parte del Imperio bizantino, este principado griego está cercado por tártaros, genoveses y los ascendentes otomanos. Usa el genio mercantil y el valor militar de la familia Gabras para conquistar el comercio del Mar Negro, revivir el nombre de la Gotia, recuperar Constantinopla y gobernar el Imperio godo sobre el Mediterráneo oriental."
 teo_theodoro_mission_pack_CRITERIA_DESCRIPTION:0 "Domina el Mar Negro, expulsa a los genoveses, recupera Constantinopla y gobierna el Imperio godo sobre el Mediterráneo oriental, el Mar Negro y las estepas."
 teo_theodoro_mission_pack_BUTTON_TOOLTIP:0 "Gobierna el Imperio godo sobre el Mediterráneo oriental."
 teo_theodoro_mission_pack_BUTTON_DETAILS:0 "¡Erige desde la fortaleza montañosa de Mangup el Imperio godo, mediante el comercio del Mar Negro, la herencia bizantina y la conquista de la estepa!"
 teo_rise_of_theodoro: "El ascenso de Teodoro"
 teo_rise_of_theodoro_desc: "Desde la fortaleza montañosa de Mangup comienza el ascenso del principado de Teodoro. Cercado por tártaros, genoveses y otomanos, el genio de la familia Gabras transformará la crisis en oportunidad."
 teo_black_sea_fleet: "La flota del Mar Negro"
 teo_black_sea_fleet_desc: "El Mar Negro es disputado por Génova, Venecia, tártaros y otomanos. Construye una flota para establecer el poder teodórico en estas vitales aguas."
 teo_build_theodoro_harbor: "El puerto de Teodoro"
 teo_build_theodoro_harbor_desc: "Desarrolla el puerto de Teodoro, al pie de Mangup, para establecerlo como potencia marítima del Mar Negro."
 teo_genoese_question: "La cuestión genovesa"
 teo_genoese_question_desc: "La colonia genovesa de Gazaria, que gobierna desde Caffa, domina el comercio del Mar Negro. Compra Gazaria como vasalla, o preserva el tesoro."
 teo_expel_genoese: "Expulsa a los genoveses"
 teo_expel_genoese_desc: "Expulsa a los genoveses de Crimea y toma sus colonias para establecer la supremacía teodórica."
 teo_dominate_crimea: "Domina Crimea"
 teo_dominate_crimea_desc: "Expulsa a todos los rivales de Crimea y gobierna como su único señor."
 teo_tana_trade: "El comercio de Tana"
 teo_tana_trade_desc: "Toma el nudo comercial de Tana, en la desembocadura del Don, para dominar las rutas comerciales del este."
 teo_black_sea_domination: "Dominio del Mar Negro"
 teo_black_sea_domination_desc: "Establece pleno dominio sobre el Mar Negro, sin dejar rival alguno que desafíe la autoridad teodórica."
 teo_greek_heritage: "La herencia griega"
 teo_greek_heritage_desc: "Refuerza la fe ortodoxa y la herencia cultural bizantina, que sustentan la legitimidad de Teodoro."
 teo_trebizond_relations: "Relaciones con Trebisonda"
 teo_trebizond_relations_desc: "Determina las relaciones con el Imperio de los Comnenos de Trebisonda: ofrece vasallaje o mantén la alianza."
 teo_restore_pontus: "Restaura el Ponto"
 teo_restore_pontus_desc: "Conquista el litoral póntico y restaura el antiguo Reino del Ponto."
 teo_constantinople: "Recupera Constantinopla"
 teo_constantinople_desc: "Recupera la Segunda Roma de los otomanos y restaura la cruz ortodoxa sobre Santa Sofía."
 teo_gothia_ascendant: "La Gotia asciende"
 teo_gothia_ascendant_desc: "Proclama el renacimiento de la Gotia y sé reconocido como legítimo heredero de Bizancio."
 teo_aegean_supremacy: "Supremacía en el Mar Egeo"
 teo_aegean_supremacy_desc: "Toma las islas egeas y el litoral, para extender el poder naval teodórico al Mediterráneo."
 teo_balkans: "Conquista los Balcanes"
 teo_balkans_desc: "Conquista los Balcanes —corazón del antiguo Imperio bizantino— para consolidar el Imperio godo."
 teo_azov_gateway: "La puerta del Mar de Azov"
 teo_azov_gateway_desc: "Domina el Mar de Azov para abrir las rutas comerciales interiores por el Don y el Volga."
 teo_pryazovia: "El Azov septentrional"
 teo_pryazovia_desc: "Asegura la región del Azov septentrional, al norte del Mar de Azov, y abre el camino a las estepas."
 teo_tatar_wars: "Guerras contra los tártaros"
 teo_tatar_wars_desc: "Lucha contra los tártaros de Crimea para forjar la caballería teodórica en guerreros de élite de la estepa."
 teo_into_steppes: "Rumbo a las estepas"
 teo_into_steppes_desc: "Conquista la vasta estepa póntica y transforma Teodoro en un imperio continental."
 teo_caucasus_gateway: "La puerta del Cáucaso"
 teo_caucasus_gateway_desc: "Avanza sobre las tierras montañosas del Cáucaso: Georgia, Armenia y Azerbaiyán."
 teo_caspian_reach: "Alcanza el Mar Caspio"
 teo_caspian_reach_desc: "Alcanza el Mar Caspio para obtener acceso a las rutas comerciales persas y centroasiáticas."
 teo_russian_question: "La cuestión rusa"
 teo_russian_question_desc: "Determina las relaciones con Moscú y Nóvgorod: forja alianza o busca la conquista."
 teo_russian_claim: "Reivindicación a la Rus"
 teo_russian_claim_desc: "Amplía la influencia teodórica sobre los principados rusos."
 teo_ruthenia_conquest: "Conquista de Rutenia"
 teo_ruthenia_conquest_desc: "Conquista Rutenia, incluida Kiev, y reivindica el manto tanto de Bizancio como de la Rus."
 teo_dev_theodoro: "Desarrolla Teodoro"
 teo_dev_theodoro_desc: "Desarrolla la ciudad-fortaleza de Teodoro en una capital digna del Imperio godo."
 teo_trade_empire: "El imperio comercial"
 teo_trade_empire_desc: "Erige un imperio comercial en la encrucijada del Mar Negro, del Mediterráneo y de la Ruta de la Seda."
 teo_silk_road: "El comercio de la Ruta de la Seda"
 teo_silk_road_desc: "Domina la Ruta de la Seda y monopoliza el flujo de seda de Asia central a los mercados occidentales."
 teo_gothic_culture: "La cultura goda"
 teo_gothic_culture_desc: "Desarrolla una cultura goda singular, que combina las herencias griega, goda y tártara."
 teo_orthodox_fortress: "Baluarte ortodoxo"
 teo_orthodox_fortress_desc: "Construye una red de monasterios ortodoxos y fortalezas militares para proteger la fe."
 teo_great_theodoro: "La Gran Teodoro"
 teo_great_theodoro_desc: "Transforma Mangup en la eterna capital del Imperio godo, faro de la civilización."
 teo_crimean_wine: "El vino de Crimea"
 teo_crimean_wine_desc: "Resucita la antigua tradición vinícola griega en Crimea y suministra vino a los mercados mediterráneos."
 teo_fortress_mangup: "La fortaleza de Mangup"
 teo_fortress_mangup_desc: "Fortifica Mangup: fortaleza natural en meseta, que incluso los otomanos tuvieron dificultad en tomar."
 teo_anatolian_coast: "El litoral anatolio"
 teo_anatolian_coast_desc: "Conquista el litoral sur del Mar Negro de Anatolia, para hacer del Mar Negro el mar interior teodórico."
 teo_orthodox_patriarch: "El patriarcado ortodoxo"
 teo_orthodox_patriarch_desc: "Establece el patriarcado en Constantinopla, que hará de Teodoro protectora de todos los cristianos ortodoxos."
 teo_merchant_republic: "La república mercantil"
 teo_merchant_republic_desc: "Erige, por comercio y conquista, el mayor imperio comercial del Mediterráneo."
 teo_dev_trebizond_city: "Desarrolla Trebisonda"
 teo_dev_trebizond_city_desc: "Desarrolla Trebisonda como importante nudo comercial en el litoral sur del Mar Negro."
 teo_gavras_triumphant: "El triunfo de los Gabras"
 teo_gavras_triumphant_desc: "El genio mercantil y la valentía militar de la familia Gabras han creado un gran imperio a partir de una fortaleza montañosa."
 teo_gothia_empire: "El Imperio godo"
 teo_gothia_empire_desc: "Gobierna como emperador de la Gotia: señor del Mar Negro, del Mediterráneo y de las estepas."
 teo_events.1.t: "Teodoro asciende: ¿tradición griega u orgullo godo?"
 teo_events.1.d: "En 1337, desde la fortaleza en meseta de Mangup comienza el ascenso del principado de Teodoro. Cercados por tártaros, genoveses y otomanos, el genio mercantil y el valor militar de la familia Gabras transformarán esta crisis en oportunidad. Conquista el comercio del Mar Negro, revive la Gotia y recupera Constantinopla."
 teo_events.1.a: "Preservar la tradición póntico-griega: somos herederos de Bizancio"
 teo_events.10.t: "Unión con Trebisonda: los lazos de los Comnenos"
 teo_events.10.d: "El Imperio de Trebisonda de la dinastía de los Comnenos se desvanece bajo la presión otomana. ¿Ayudaremos a Trebisonda como hermanos griegos, o la incorporaremos a la Gotia?"
 teo_events.10.a: "Hacer de Trebisonda vasalla: proteger la herencia póntica bajo la Gotia"
 teo_events.20.t: "Constantinopla recuperada: coronación del rey godo"
 teo_events.20.d: "¡Constantinopla en manos de la Gotia! La recuperación de la ciudad santa ortodoxa de los otomanos significa que Rusia, como “Tercera Roma”, se convierte en líder espiritual del mundo ortodoxo. La cruz cristiana ondea de nuevo sobre Santa Sofía."
 teo_events.20.a: "¡Gloria al Rey Godo! ¡Gloria a Constantinopla!"
 teo_events.30.t: "La cuestión rusa: ¿alianza o conquista?"
 teo_events.30.d: "La familia Gabras tiene lazos profundos con las casas nobles rusas. ¿Cómo determinaremos nuestras relaciones con Moscú y Nóvgorod? ¿Forjaremos una alianza, que proteja los intereses comunes, o traeremos la Rus al gobierno de la Gotia?"
 teo_events.30.a: "Firmar alianza con Rusia: trabajar juntos como hermanos ortodoxos"
 teo_events.30.b: "Buscar la conquista de la Rus: la Gotia debe ser la verdadera señora de la Rus"
 teo_events.60.t: "El triunfo de los Gabras: el nacimiento del Imperio godo"
 teo_events.60.d: "Dominio del Mar Negro, Constantinopla recuperada, estepas conquistadas: la familia Gabras gobierna ahora como “Emperador del Imperio godo” sobre el Mediterráneo oriental. El viaje desde la fortaleza montañosa de Mangup termina con la fundación de un imperio mundial."
 teo_events.60.a: "¡Gloria al Imperio godo! ¡Gloria a la familia Gabras!"
 teo_events.99.t: "El Imperio godo: gloria eterna"
 teo_events.99.d: "“Emperador de la Gotia, señor del Mar Negro, del Mediterráneo y de la estepa”: este imperio, en la encrucijada de las civilizaciones oriental y occidental, gobierna supremo. La asombrosa historia, iniciada en 1337 con la pequeña fortaleza de Mangup, encuentra aquí su cumplimiento."
 teo_events.99.a: "¡Gloria al Imperio godo! ¡Gloria a la gloria eterna!"
 STATIC_MODIFIER_NAME_teo_black_sea_fleet_mod: "La flota del Mar Negro"
 STATIC_MODIFIER_DESC_teo_black_sea_fleet_mod: "La flota del Mar Negro de Teodoro defiende la supremacía sobre las vitales aguas comerciales."
 STATIC_MODIFIER_NAME_teo_theodoro_harbor_mod: "El puerto de Teodoro"
 STATIC_MODIFIER_DESC_teo_theodoro_harbor_mod: "El puerto al pie de Mangup sirve de puerta del poder marítimo teodórico."
 STATIC_MODIFIER_NAME_teo_crimea_trade_mod: "Comercio de Crimea"
 STATIC_MODIFIER_DESC_teo_crimea_trade_mod: "Las rutas comerciales crimeo-tártaras aseguradas bajo control teodórico."
 STATIC_MODIFIER_NAME_teo_crimea_domination_mod: "Crimea subyugada"
 STATIC_MODIFIER_DESC_teo_crimea_domination_mod: "Todos los rivales expulsados de Crimea: Teodoro gobierna como su único señor."
 STATIC_MODIFIER_NAME_teo_tana_mod: "Nudo comercial de Tana"
 STATIC_MODIFIER_DESC_teo_tana_mod: "El nudo comercial de Tana, en la desembocadura del Don, subyugado, abriendo el comercio oriental."
 STATIC_MODIFIER_NAME_teo_black_sea_dom_mod: "Señor del Mar Negro"
 STATIC_MODIFIER_DESC_teo_black_sea_dom_mod: "Pleno dominio sobre el Mar Negro: ningún rival osa desafiar la supremacía teodórica."
 STATIC_MODIFIER_NAME_teo_greek_heritage_mod: "La herencia griega"
 STATIC_MODIFIER_DESC_teo_greek_heritage_mod: "Los iconos y la liturgia de Bizancio aún se guardan en las capillas de Teodoro, sustentando en silencio la legitimidad de esta tierra."
 STATIC_MODIFIER_NAME_teo_pontus_mod: "Ponto restaurado"
 STATIC_MODIFIER_DESC_teo_pontus_mod: "El litoral póntico asegurado, abriendo el camino a la supremacía en el Mar Negro."
 STATIC_MODIFIER_NAME_teo_gothia_mod: "La Gotia asciende"
 STATIC_MODIFIER_DESC_teo_gothia_mod: "El Imperio godo proclamado: el renacimiento de la Gotia reconocido por el mundo."
 STATIC_MODIFIER_NAME_teo_aegean_mod: "Supremacía en el Mar Egeo"
 STATIC_MODIFIER_DESC_teo_aegean_mod: "En los puertos de las islas egeas, navíos bajo la bandera de la Gotia están anclados en filas, y las cargas del comercio mediterráneo se descargan una tras otra."
 STATIC_MODIFIER_NAME_teo_balkans_mod: "Balcanes conquistados"
 STATIC_MODIFIER_DESC_teo_balkans_mod: "Los Balcanes conquistados: el Imperio godo se extiende sobre el corazón bizantino."
 STATIC_MODIFIER_NAME_teo_azov_mod: "La puerta del Mar de Azov"
 STATIC_MODIFIER_DESC_teo_azov_mod: "La puerta del Mar de Azov abre las rutas comerciales interiores por el Don y el Volga."
 STATIC_MODIFIER_NAME_teo_pryazovia_mod: "Azov septentrional asegurado"
 STATIC_MODIFIER_DESC_teo_pryazovia_mod: "La orilla norte del Mar de Azov asegurada, abriendo el camino a las estepas."
 STATIC_MODIFIER_NAME_teo_tatar_wars_mod: "Lucha contra los tártaros"
 STATIC_MODIFIER_DESC_teo_tatar_wars_mod: "Las guerras contra los tártaros de Crimea han forjado la caballería teodórica en guerreros de élite de la estepa."
 STATIC_MODIFIER_NAME_teo_steppes_mod: "Señor de las estepas"
 STATIC_MODIFIER_DESC_teo_steppes_mod: "La vasta estepa póntica pasa al gobierno teodórico: ha nacido el imperio continental."
 STATIC_MODIFIER_NAME_teo_caucasus_mod: "Expedición al Cáucaso"
 STATIC_MODIFIER_DESC_teo_caucasus_mod: "La puerta del Cáucaso abre acceso al comercio persa y centroasiático."
 STATIC_MODIFIER_NAME_teo_caspian_mod: "Mar Caspio alcanzado"
 STATIC_MODIFIER_DESC_teo_caspian_mod: "El Mar Caspio alcanzado: las rutas comerciales persas y centroasiáticas están ahora disponibles."
 STATIC_MODIFIER_NAME_teo_russian_claim_mod: "Reivindicación a la Rus"
 STATIC_MODIFIER_DESC_teo_russian_claim_mod: "Enviados de príncipes rusos visitan la corte de la Gotia, y la nobleza rusa, uno a uno, se pone bajo su estandarte."
 STATIC_MODIFIER_NAME_teo_ruthenia_mod: "Rutenia conquistada"
 STATIC_MODIFIER_DESC_teo_ruthenia_mod: "Rutenia, incluida Kiev, conquistada: el manto de Bizancio y de la Rus reivindicado."
 STATIC_MODIFIER_NAME_teo_theodoro_dev_mod: "Teodoro desarrollada"
 STATIC_MODIFIER_DESC_teo_theodoro_dev_mod: "La ciudad-fortaleza de Teodoro desarrollada en una capital digna del Imperio godo."
 STATIC_MODIFIER_NAME_teo_trade_empire_mod: "El imperio comercial"
 STATIC_MODIFIER_DESC_teo_trade_empire_mod: "El gran imperio comercial erigido en la encrucijada de las civilizaciones."
 STATIC_MODIFIER_NAME_teo_silk_mod: "Comercio de la Ruta de la Seda"
 STATIC_MODIFIER_DESC_teo_silk_mod: "La Ruta de la Seda subyugada: la seda fluye por manos teodóricas a los mercados occidentales."
 STATIC_MODIFIER_NAME_teo_gothic_culture_mod: "La cultura goda"
 STATIC_MODIFIER_DESC_teo_gothic_culture_mod: "Surge una cultura goda singular, que combina las herencias griega, goda y tártara."
 STATIC_MODIFIER_NAME_teo_orthodox_fortress_mod: "Baluarte ortodoxo"
 STATIC_MODIFIER_DESC_teo_orthodox_fortress_mod: "Monasterios ortodoxos y fortalezas militares protegen tanto la fe como la frontera."
 STATIC_MODIFIER_NAME_teo_great_theodoro_mod: "La Gran Teodoro"
 STATIC_MODIFIER_DESC_teo_great_theodoro_mod: "Mangup transformada en la eterna capital del Imperio godo."
 STATIC_MODIFIER_NAME_teo_wine_mod: "El vino de Crimea"
 STATIC_MODIFIER_DESC_teo_wine_mod: "Los viñedos de Crimea renacidos: vinos finos fluyen a los mercados mediterráneos."
 STATIC_MODIFIER_NAME_teo_mangup_fortress_mod: "La fortaleza de Mangup"
 STATIC_MODIFIER_DESC_teo_mangup_fortress_mod: "La fortaleza de Mangup fortificada más allá de todo ataque: eterna sede del Imperio godo."
 STATIC_MODIFIER_NAME_teo_anatolia_mod: "Litoral anatolio asegurado"
 STATIC_MODIFIER_DESC_teo_anatolia_mod: "El litoral sur del Mar Negro de Anatolia conquistado: el mar se convierte en el mar interior teodórico."
 STATIC_MODIFIER_NAME_teo_patriarch_mod: "El patriarcado ortodoxo"
 STATIC_MODIFIER_DESC_teo_patriarch_mod: "El patriarcado de Constantinopla hace de Teodoro protectora de todos los cristianos ortodoxos."
 STATIC_MODIFIER_NAME_teo_merchant_republic_mod: "La república mercantil"
 STATIC_MODIFIER_DESC_teo_merchant_republic_mod: "Una vasta red comercial se extiende sobre el Mediterráneo, el Mar Negro y la Ruta de la Seda."
 STATIC_MODIFIER_NAME_teo_trebizond_city_mod: "La ciudad de Trebisonda"
 STATIC_MODIFIER_DESC_teo_trebizond_city_mod: "Trebisonda desarrollada como importante nudo comercial en el litoral sur del Mar Negro."
 STATIC_MODIFIER_NAME_teo_gavras_final_mod: "Hegemonía del Imperio godo"
 STATIC_MODIFIER_DESC_teo_gavras_final_mod: "La visión de la dinastía Gabras concluida: el Imperio godo gobierna mar y estepa."
 teo_events.1.b: "Resucitar el orgullo godo: somos los verdaderos herederos de la Gotia"
 teo_events.5.t: "Gazaria: ¿comprar o rechazar?"
 teo_events.5.d: "La República de Génova administra su colonia comercial crimeo-tártara “Gazaria (GAZ)”. Por un precio de 300 ducados, Génova ofrece transferir Gazaria como vasalla de Teodoro.\n\nEs una oportunidad de establecer pacíficamente el control de Crimea, pero 300 ducados es un precio alto. ¿La comprarás?"
 teo_events.5.a: "Pagar 300 ducados para comprar Gazaria: Crimea será nuestra"
 teo_events.5.b: "Rechazar: preservar el tesoro por ahora"
 STATIC_MODIFIER_NAME_teo_gothic_penalty_mod: "El dolor de la conversión goda"
 STATIC_MODIFIER_DESC_teo_gothic_penalty_mod: "Los griegos pónticos, incapaces de acostumbrarse a la lengua y a las costumbres godas, nutren resentimiento que arde en las aldeas; pero todos saben que mayor recompensa los aguarda cuando el Imperio godo esté concluido."
 STATIC_MODIFIER_NAME_teo_gothic_bonus_mod: "El verdadero heredero de la Gotia"
 STATIC_MODIFIER_DESC_teo_gothic_bonus_mod: "El Imperio godo, concluido con la preservación de la cultura goda: el espíritu de los antiguos godos renacido, trayendo al Imperio godo gloria eterna."
 teo_events.10.b: "Mantener la alianza: honrar el orgullo de los Comnenos"
 STATIC_MODIFIER_NAME_teo_russian_alliance_mod: "Alianza con Rusia"
 STATIC_MODIFIER_DESC_teo_russian_alliance_mod: "La alianza amistosa con los principados rusos ha elevado la influencia diplomática de la Gotia."
 STATIC_MODIFIER_NAME_teo_russian_conquest_mod: "La voluntad de conquistar la Rus"
 STATIC_MODIFIER_DESC_teo_russian_conquest_mod: "La voluntad de la Gotia de conquistar la Rus suprime la hostilidad recibida."
 teo_events.99.b: "Completar el imperio con orgullo godo: abrir el derecho de invadir Alemania"
 cb_gothic_invasion: "Invasión goda"
 cb_gothic_invasion_desc: "Casus belli singular contra naciones del grupo cultural germánico: costes de conquista y hostilidad reducidos en un 80%. Desbloqueado solo para la cultura primaria goda tras la conclusión de la misión final del Imperio godo."
