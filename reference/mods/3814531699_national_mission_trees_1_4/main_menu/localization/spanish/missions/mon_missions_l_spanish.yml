l_spanish:
 mon_montferrat_mission_pack: "Las ambiciones de los Paleólogos y el señor de Italia"
 mon_montferrat_mission_pack_DESCRIPTION:0 "En 1337, el Marquesado de Monferrato está gobernado por un señor en cuyas venas corre la sangre de la dinastía bizantina de los Paleólogos. Reivindica Salónica y marcha hacia el este, a Constantinopla, o forja un imperio en el norte de Italia con la diplomacia y la espada del condotiero: dos ambiciones arden en un solo soberano."
 mon_montferrat_mission_pack_CRITERIA_DESCRIPTION:0 "El sueño oriental o el dominio occidental: la sangre de los Paleólogos abre ambos caminos."
 mon_montferrat_mission_pack_BUTTON_TOOLTIP:0 "Usa la sangre de los Paleólogos para conquistar Italia y Grecia."
 mon_montferrat_mission_pack_BUTTON_DETAILS:0 "¡De Salónica a Atenas bajo el nombre de los Paleólogos, de Casale a Génova con acero y moneda: conquista Oriente y Occidente!"
 mon_palaiologos_ambition: "La ambición de los Paleólogos"
 mon_palaiologos_ambition_desc: "El gobernante de Monferrato lleva sangre paleóloga. Dos ambiciones arden: hacia el este, rumbo a Salónica, o hacia el oeste, rumbo al dominio italiano."
 mon_claim_thessaloniki: "Reivindica Salónica"
 mon_claim_thessaloniki_desc: "Reivindica Salónica, antaño la segunda ciudad de Bizancio, como punto de apoyo de las ambiciones orientales."
 mon_seize_thessaloniki: "Toma Salónica"
 mon_seize_thessaloniki_desc: "Toma Salónica y planta el estandarte de los Paleólogos en la Torre Blanca."
 mon_conquer_macedonia: "Conquista de Macedonia"
 mon_conquer_macedonia_desc: "Conquista Macedonia, puerta de Grecia y patria de Alejandro Magno."
 mon_northern_greece: "Norte de Grecia"
 mon_northern_greece_desc: "Asegura el norte de Grecia como base para nueva expansión."
 mon_conquer_morea: "Conquista de la Moreia"
 mon_conquer_morea_desc: "Conquista la Moreia y Atenas, el corazón de la antigua civilización griega."
 mon_aegean_control: "Controla el Egeo"
 mon_aegean_control_desc: "Toma las islas egeas para ampliar el alcance marítimo de Monferrato."
 mon_new_byzantium: "El Nuevo Bizancio"
 mon_new_byzantium_desc: "Reivindica el legado bizantino y sé reconocido como sucesor de la Roma de Oriente."
 mon_secure_piedmont: "Asegura el Piamonte"
 mon_secure_piedmont_desc: "Asegura el Piamonte como base del dominio del norte de Italia."
 mon_casale_capital: "Casale Monferrato"
 mon_casale_capital_desc: "Desarrolla Casale Monferrato hasta una capital digna del Marquesado."
 mon_rival_savoy: "La rival Saboya"
 mon_rival_savoy_desc: "Contrarresta a Saboya, rival por el dominio del Piamonte, y establece la supremacía."
 mon_control_lombardy: "Controla Lombardía"
 mon_control_lombardy_desc: "Conquista Lombardía, el corazón del norte de Italia."
 mon_seize_genoa: "Toma Génova"
 mon_seize_genoa_desc: "Toma Génova, La Superba, y obtén acceso al comercio mediterráneo."
 mon_north_italy_trade: "Imperio comercial del norte de Italia"
 mon_north_italy_trade_desc: "Construye un imperio comercial que abarque Lombardía, Liguria y el Véneto."
 mon_emilia: "Conquista de Emilia"
 mon_emilia_desc: "Conquista la fértil orilla sur del valle del Po: Bolonia, Parma y Módena."
 mon_king_of_italy: "Rey de Italia"
 mon_king_of_italy_desc: "Proclama al Rey de Italia tras unificar Lombardía, Liguria y Emilia."
 mon_hre_relations: "Relaciones con el Sacro Imperio"
 mon_hre_relations_desc: "Define la relación con el Sacro Imperio Romano: aliado, rival o líder."
 mon_dev_casale: "Casale, ciudad del saber y la riqueza"
 mon_dev_casale_desc: "Transforma Casale en una ciudad del saber y la riqueza donde se unen el Renacimiento y la herencia bizantina."
 mon_renaissance_court: "La corte renacentista"
 mon_renaissance_court_desc: "Crea una corte renacentista donde se funden el saber clásico bizantino y la innovación artística italiana."
 mon_mercenary_tradition: "La tradición de los condotieros"
 mon_mercenary_tradition_desc: "Construye la tradición de los condotieros: la herencia militar mercenaria de Monferrato."
 mon_papal_alliance: "Alianza papal"
 mon_papal_alliance_desc: "Alíate con el papa para legitimar las ambiciones de Monferrato por toda Italia."
 mon_tuscany: "Conquista de la Toscana"
 mon_tuscany_desc: "Conquista la Toscana, patria de la cultura renacentista de los Médici, y avanza hacia Roma."
 mon_veneto: "Conquista del Véneto"
 mon_veneto_desc: "Conquista el Véneto, incluida Venecia, para completar el dominio del norte de Italia."
 mon_byzantine_heritage: "La herencia bizantina"
 mon_byzantine_heritage_desc: "Reivindica el pleno legado bizantino: en la cultura griega y en la ortodoxia, obtén mayores recompensas."
 mon_navy_adriatic: "La flota adriática"
 mon_navy_adriatic_desc: "Construye una poderosa flota adriática que combine el poder naval genovés y veneciano."
 mon_southern_italy: "Sur de Italia"
 mon_southern_italy_desc: "Avanza sobre el sur de Italia y toma Nápoles para unir la Península Itálica."
 mon_marquis_of_italy: "Gran Marqués de Italia"
 mon_marquis_of_italy_desc: "Reina como Gran Marqués de Italia: uniendo Oriente y Occidente, Norte y Sur."
 mon_new_roman_empire: "El Nuevo Imperio romano"
 mon_new_roman_empire_desc: "Proclama el Nuevo Imperio romano, sucesor tanto de la Roma de Oriente como de la de Occidente."
 mon_events.10.t: "La toma de Salónica: el estandarte de los Paleólogos sobre la Torre Blanca"
 mon_events.10.d: "Salónica, antaño la segunda ciudad del Imperio bizantino, cae ahora ante Monferrato. El gobernante de sangre paleóloga comienza a hacer realidad las ambiciones orientales. Las campanas de la Torre Blanca doblan: una nueva era ha comenzado."
 mon_events.10.a: "¡Viva Salónica! ¡Bajo el estandarte de los Paleólogos!"
 mon_events.20.t: "Rey de Italia: triunfo de Casale a la Ciudad Santa"
 mon_events.20.d: "“Rey de Italia”: Monferrato, habiendo unificado Lombardía, Liguria y Emilia, es proclamado nuevo señor de la Península Itálica. Los vítores resuenan en la corte de Casale."
 mon_events.20.a: "¡Viva el Rey de Italia!"
 mon_events.50.t: "Nacimiento del Nuevo Bizancio: el sueño de los Paleólogos realizado"
 mon_events.50.d: "“Emperador Paleólogo, sucesor de Roma y Constantinopla”: Monferrato hereda el nombre bizantino. El viaje, desde un pequeño marquesado del norte de Italia, ha iniciado su camino hacia el dominio del Mediterráneo oriental."
 mon_events.50.a: "¡Viva el Emperador Paleólogo! ¡Viva el Nuevo Bizancio!"
 mon_events.60.t: "Gran Marqués de Italia: reinando en la encrucijada de Oriente y Occidente"
 mon_events.60.d: "De Casale Monferrato a Génova, Florencia, Nápoles: el Imperio de Monferrato ha nacido. Arte renacentista, espíritu bizantino, espada de condotiero: tres poderes fundidos para crear al señor de Italia."
 mon_events.60.a: "¡Viva el Gran Marqués de Italia!"
 mon_events.99.t: "El Nuevo Imperio romano: unificador de Oriente y Occidente"
 mon_events.99.d: "“Emperador Paleólogo, sucesor de la Roma de Oriente y de Occidente, Rey de Italia, Señor de Grecia”: este título resuena por todo el mundo mediterráneo. La ambición brotada en la pequeña corte de Casale en 1337 culmina ahora en la construcción de un imperio mundial. El nombre de Roma, restaurado."
 mon_events.99.a: "¡Viva el Nuevo Imperio romano! ¡Viva la gloria eterna!"
 STATIC_MODIFIER_NAME_mon_palaiologos_mod: "Los Paleólogos"
 STATIC_MODIFIER_DESC_mon_palaiologos_mod: "El linaje de los Paleólogos despierta las ambiciones de Monferrato sobre Oriente y Occidente."
 STATIC_MODIFIER_NAME_mon_thessaloniki_claim_mod: "Reivindicación a Salónica"
 STATIC_MODIFIER_DESC_mon_thessaloniki_claim_mod: "Salónica seduce: el estandarte de los Paleólogos pronto ondeará sobre el Egeo."
 STATIC_MODIFIER_NAME_mon_macedonia_mod: "Macedonia"
 STATIC_MODIFIER_DESC_mon_macedonia_mod: "Macedonia conquistada: puerta de Grecia y patria de Alejandro Magno."
 STATIC_MODIFIER_NAME_mon_northern_greece_mod: "Norte de Grecia"
 STATIC_MODIFIER_DESC_mon_northern_greece_mod: "El norte de Grecia asegurado como base para nueva expansión hacia el sur."
 STATIC_MODIFIER_NAME_mon_morea_mod: "Moreia"
 STATIC_MODIFIER_DESC_mon_morea_mod: "La Moreia y Atenas conquistadas: el corazón de la antigua civilización griega restaurado."
 STATIC_MODIFIER_NAME_mon_aegean_mod: "Egeo"
 STATIC_MODIFIER_DESC_mon_aegean_mod: "Islas egeas tomadas, ampliando el alcance marítimo de Monferrato hacia el Mediterráneo."
 STATIC_MODIFIER_NAME_mon_piedmont_mod: "Piamonte"
 STATIC_MODIFIER_DESC_mon_piedmont_mod: "Piamonte asegurado: las levas del norte de Italia marchan ahora bajo el estandarte de Monferrato."
 STATIC_MODIFIER_NAME_mon_casale_mod: "Casale"
 STATIC_MODIFIER_DESC_mon_casale_mod: "Casale Monferrato late como corazón comercial del Marquesado."
 STATIC_MODIFIER_NAME_mon_savoy_mod: "Saboya"
 STATIC_MODIFIER_DESC_mon_savoy_mod: "Saboya, rival por el dominio del Piamonte, contrarrestada y suprimida."
 STATIC_MODIFIER_NAME_mon_lombardy_mod: "Lombardía"
 STATIC_MODIFIER_DESC_mon_lombardy_mod: "Lombardía, el corazón del norte de Italia, cae bajo el control de Monferrato."
 STATIC_MODIFIER_NAME_mon_genoa_mod: "Génova"
 STATIC_MODIFIER_DESC_mon_genoa_mod: "La Superba Génova es tomada: la puerta del comercio mediterráneo se abre de par en par."
 STATIC_MODIFIER_NAME_mon_trade_mod: "Comercio"
 STATIC_MODIFIER_DESC_mon_trade_mod: "Un imperio comercial que abarca Lombardía, Liguria y el Véneto, construido."
 STATIC_MODIFIER_NAME_mon_emilia_mod: "Emilia"
 STATIC_MODIFIER_DESC_mon_emilia_mod: "La fértil orilla sur del valle del Po (Bolonia, Parma, Módena) conquistada."
 STATIC_MODIFIER_NAME_mon_hre_mod: "Sacro Imperio"
 STATIC_MODIFIER_DESC_mon_hre_mod: "La relación con el Sacro Imperio Romano definida: Monferrato gana posición diplomática."
 STATIC_MODIFIER_NAME_mon_casale_dev_mod: "Desarrollo de Casale"
 STATIC_MODIFIER_DESC_mon_casale_dev_mod: "Casale entra en su edad de oro del saber y la riqueza: faro cultural del norte de Italia."
 STATIC_MODIFIER_NAME_mon_renaissance_mod: "Renacimiento"
 STATIC_MODIFIER_DESC_mon_renaissance_mod: "Una corte renacentista creada: el saber clásico bizantino se funde con la innovación artística italiana."
 STATIC_MODIFIER_NAME_mon_condottieri_mod: "Condotieros"
 STATIC_MODIFIER_DESC_mon_condottieri_mod: "Los condotieros de Monferrato se han vuelto leyenda: soldados de élite se reúnen bajo sus estandartes y han dominado los campos de batalla de Italia."
 STATIC_MODIFIER_NAME_mon_papal_mod: "Papal"
 STATIC_MODIFIER_DESC_mon_papal_mod: "La bendición del papa legitima las ambiciones de Monferrato por toda la Península Itálica."
 STATIC_MODIFIER_NAME_mon_tuscany_mod: "Toscana"
 STATIC_MODIFIER_DESC_mon_tuscany_mod: "La Toscana, patria de la cultura renacentista de los Médici, conquistada y asegurada."
 STATIC_MODIFIER_NAME_mon_veneto_mod: "Véneto"
 STATIC_MODIFIER_DESC_mon_veneto_mod: "El Véneto, incluida Venecia, conquistado: el dominio del norte de Italia, completo."
 STATIC_MODIFIER_NAME_mon_heritage_mod: "Herencia"
 STATIC_MODIFIER_DESC_mon_heritage_mod: "El pleno legado bizantino reivindicado: burocracia, acueductos y legitimidad fluyen de la Roma antigua."
 STATIC_MODIFIER_NAME_mon_navy_mod: "Flota"
 STATIC_MODIFIER_DESC_mon_navy_mod: "Una poderosa flota adriática que combina el poder naval genovés y veneciano, construida."
 STATIC_MODIFIER_NAME_mon_southern_italy_mod: "Sur de Italia"
 STATIC_MODIFIER_DESC_mon_southern_italy_mod: "El sur de Italia y Nápoles tomados: la Península Itálica unida bajo un solo estandarte."
 STATIC_MODIFIER_NAME_mon_marquis_final_mod: "Final del Marqués"
 STATIC_MODIFIER_DESC_mon_marquis_final_mod: "El Gran Marqués de Italia reina: uniendo Oriente y Occidente, Norte y Sur."
 STATIC_MODIFIER_NAME_mon_new_roman_mod: "Nueva Roma"
 STATIC_MODIFIER_DESC_mon_new_roman_mod: "El Nuevo Imperio romano proclamado: sucesor tanto de la Roma de Oriente como de la de Occidente."
 mon_carta_di_franchigia: "Carta di Franchigia"
 mon_carta_di_franchigia_desc: "La Carta di Franchigia: “Carta de Libertad”. El marqués de Monferrato concede autonomía y privilegios a cada ciudad, creando terreno fértil para que mercaderes, campesinos y ciudadanos prosperen. Así como Casale floreció antaño bajo una carta semejante, todo el marquesado se beneficiará de sus bendiciones."
 mon_carta_di_franchigia_unlock_tt: "El privilegio urbano “Carta di Franchigia” pasa a estar disponible."
 mon_acqui_terme: "Desarrollo de Acqui Terme"
 mon_acqui_terme_desc: "Acqui Terme, célebre como “ciudad de las aguas termales” desde los tiempos de la Roma antigua. Restaura sus famosas aguas. Los manantiales curativos, antaño visitados por emperadores romanos, se convertirán en el nuevo orgullo de Monferrato, renacidos como ciudad de la salud que atrae visitantes de lejos."
 STATIC_MODIFIER_NAME_mon_acqui_terme_mod: "Acqui Terme restaurada"
 STATIC_MODIFIER_DESC_mon_acqui_terme_mod: "Las antiguas termas romanas restauradas: Acqui renacida como ciudad de salud y prosperidad."
 STATIC_MODIFIER_NAME_mon_heritage_basic_mod: "La luz que se apaga de Bizancio"
 STATIC_MODIFIER_DESC_mon_heritage_basic_mod: "El legado bizantino ilumina Monferrato: su legitimidad comienza en silencio a crecer."
 STATIC_MODIFIER_NAME_mon_new_byzantium_mod: "La majestad del Nuevo Bizancio"
 STATIC_MODIFIER_DESC_mon_new_byzantium_mod: "El sueño de los Paleólogos realizado: administración imperial, poder naval y redes viarias cristalizados como fuerza de Monferrato."
