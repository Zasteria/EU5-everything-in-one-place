l_spanish:
 bul_bulgaria_mission_pack: "El Nuevo Bizancio: el legado del Segundo Imperio y la hegemonía balcánica"
 bul_bulgaria_mission_pack_DESCRIPTION:0 "Como heredero del legado del Segundo Imperio búlgaro, establece la independencia, reivindica la hegemonía sobre la península balcánica, repele la amenaza otomana y alza un nuevo Bizancio en Constantinopla."
 bul_bulgaria_mission_pack_CRITERIA_DESCRIPTION:0 "Establece la independencia, revive el imperio balcánico, repele a los otomanos y funda el Nuevo Bizancio."
 bul_bulgaria_mission_pack_BUTTON_TOOLTIP:0 "De la antigua ciudad de Tarnovo a un nuevo imperio que brilla sobre los Balcanes."
 bul_bulgaria_mission_pack_BUTTON_DETAILS:0 "“Señor de Tsarigrad”: ¡hereda la gloria del Segundo Imperio y funda el Tercer Imperio búlgaro!"
 bul_second_bulgarian_legacy: "Un imperio que se fractura"
 bul_second_bulgarian_legacy_desc: "El glorioso imperio construido por Iván Asen I e Iván Asen II se astilla ahora bajo la ambición de los nobles en Tarnovo, Vidin y Dobrudja: detén este declive."
 bul_assert_independence: "La autoridad de Tsarigrad"
 bul_assert_independence_desc: "Un imperio al borde de la fractura: como zar de Tarnovo, establece una autoridad que no se incline ante ninguna potencia rival."
 bul_tarnovo_capital: "Desarrolla Tarnovo"
 bul_tarnovo_capital_desc: "Tarnovo, antaño llamada la “Segunda Tsarigrad”: revive de nuevo en esta tierra la gloria de la antigua capital imperial."
 bul_bulgarian_patriarchate: "El Patriarcado búlgaro"
 bul_bulgarian_patriarchate_desc: "Una iglesia autocéfala, independiente de Constantinopla: haz inquebrantable la autoridad de la Iglesia ortodoxa búlgara."
 bul_boyar_council: "El Consejo de los Boyardos"
 bul_boyar_council_desc: "Los boyardos, nobleza que ha sostenido largo tiempo a Bulgaria: usa su consejo como pilar del gobierno."
 bul_reunite_bulgaria: "Reunifica Bulgaria"
 bul_reunite_bulgaria_desc: "Bulgaria y Silistra: reúne estas históricas tierras núcleo bajo un solo estandarte."
 bul_bulgarian_independence: "Reunificación del Imperio"
 bul_bulgarian_independence_desc: "El imperio se ha fracturado en Vidin y Dobrudja: trae estas tierras de vuelta bajo una sola corona y reunifica el imperio con centro en Tarnovo."
 bul_sofia: "La Ciudad de la Santa Sabiduría"
 bul_sofia_desc: "Serdica, Sredets, Triaditsa: esta ciudad ha llevado muchos nombres a lo largo de los siglos. Dale un título digno de una nueva era."
 bul_conquer_macedonia: "Conquista Macedonia"
 bul_conquer_macedonia_desc: "Macedonia, largo tiempo centro de la cultura búlgara desde tiempos antiguos: recupera esta tierra a nuestro dominio."
 bul_conquer_serbia: "Conquista Serbia"
 bul_conquer_serbia_desc: "Las tierras vecinas de Serbia: subyuga a esta rival en la contienda por la hegemonía balcánica."
 bul_bulgarian_empire: "El Imperio búlgaro"
 bul_bulgarian_empire_desc: "Bulgaria gobernó antaño un gran Imperio que abarcaba buena parte de los Balcanes. ¡Devolveremos estas tierras a nuestro dominio!"
 bul_conquer_wallachia: "Conquista Valaquia"
 bul_conquer_wallachia_desc: "Valaquia, en la orilla norte del Danubio: establece nuestra influencia sobre esta tierra."
 bul_conquer_moldavia: "Conquista Moldavia"
 bul_conquer_moldavia_desc: "Moldavia, al este de los Montes Cárpatos: trae esta rica tierra a nuestro dominio."
 bul_conquer_transylvania: "Conquista Transilvania"
 bul_conquer_transylvania_desc: "Transilvania, rodeada de montañas: haz de esta región parte de nuestro imperio."
 bul_conquer_thrace_greece: "Conquista Tracia y el norte de Grecia"
 bul_conquer_thrace_greece_desc: "La tierra de los antiguos tracios y el norte de Grecia: incorpora esta región a nuestro imperio."
 bul_extend_the_empire: "Amplía el Imperio"
 bul_extend_the_empire_desc: "Las fronteras del Imperio deben empujarse aún más lejos. Continuemos nuestra campaña en Grecia y en los Cárpatos."
 bul_chitalishte_movement: "El movimiento del chitalishte"
 bul_chitalishte_movement_desc: "Las “salas de lectura” conocidas como chitalishte, centros comunitarios de cultura: deja que echen raíces por toda la tierra, cultivando la alfabetización y la conciencia nacional entre los habitantes de las ciudades. Aquí comienza el Renacimiento Nacional búlgaro."
 bul_chitalishte_unlock_tt: "El privilegio urbano “Ciudad del chitalishte” pasa a estar disponible."
 bul_ottoman_wars: "Las guerras otomanas"
 bul_ottoman_wars_desc: "El creciente Imperio otomano: afronta la lucha contra esta nueva amenaza."
 bul_varna_crusade: "La Cruzada de Varna"
 bul_varna_crusade_desc: "Álzate junto a Hungría y lidera una cruzada contra los otomanos. En 1444, la historia gira en Varna."
 bul_end_ottoman_threat: "Pon fin a la amenaza otomana"
 bul_end_ottoman_threat_desc: "La antaño temida amenaza otomana: ponle fin y asegura nuestra posición en los Balcanes."
 bul_constantinople_ambition: "Ambición sobre Constantinopla"
 bul_constantinople_ambition_desc: "La ciudad que fue antaño el centro del mundo ortodoxo: alberga ambición sobre esta ciudad."
 bul_new_byzantium: "Posesión de Constantinopla y Roma"
 bul_new_byzantium_desc: "Constantinopla, centro del mundo ortodoxo, y Roma, sede de la Iglesia occidental: toma ambas ciudades juntas y deja que Bulgaria se alce como un nuevo imperio que preside ambas mitades de la cristiandad."
 bul_black_sea_trade: "Comercio del Mar Negro"
 bul_black_sea_trade_desc: "Varna, la ciudad portuaria del Mar Negro: desarróllala como cabeza de puente del comercio del Mar Negro."
 bul_black_sea_dominion: "Dominio del Mar Negro"
 bul_black_sea_dominion_desc: "La vasta línea costera del Mar Negro: establece la supremacía en el comercio de estas aguas."
 bul_third_bulgarian_empire: "El Tercer Imperio búlgaro"
 bul_third_bulgarian_empire_desc: "Independencia, unificación de los Balcanes, derrota de los otomanos y fundación del Nuevo Bizancio: aquí queda completo el Tercer Imperio búlgaro."
 bul_events.1.t: "Proclamación de la reunificación imperial"
 bul_events.1.d: "Tarnovo, Vidin y Dobrudja, antaño fracturadas, están unidas de nuevo como un solo imperio. El Segundo Imperio búlgaro encuentra nueva fuerza."
 bul_events.1.a: "¡Gloria a Bulgaria!"
 bul_events.4.t: "La historia de Sofía"
 bul_events.4.d: "Esta antigua ciudad, llamada Serdica por los romanos y más tarde Sredets por los eslavos, tomará ahora un nuevo nombre en honor a la Iglesia de la Santa Sabiduría (Sofía). Tracios, romanos, bizantinos y búlgaros: que el peso de las muchas civilizaciones que han pasado por esta cuenca quede grabado en la memoria."
 bul_events.4.a: "Llamarla Sofía"
 bul_events.4.b: "Llamarla Sofía y hacer de ella la nueva capital imperial"
 bul_events.2.t: "Proclamación del Imperio búlgaro"
 bul_events.2.d: "Como gobernante de Macedonia y de Serbia, Bulgaria se proclama aquí imperio."
 bul_events.2.a: "¡Viva el Emperador!"
 bul_events.3.t: "El sueño de un Nuevo Bizancio"
 bul_events.3.d: "Tras las murallas de Constantinopla y en las colinas de la eterna Roma por igual, ondea ahora el estandarte de Bulgaria. Como nuevo centro del mundo ortodoxo y sede de la Iglesia occidental, estas dos ciudades renacen aquí como pilares gemelos de un nuevo imperio."
 bul_events.3.a: "¡Dios está con nosotros!"
 bul_events.99.t: "Proclamación del Tercer Imperio búlgaro"
 bul_events.99.d: "El largo camino, iniciado en la antigua ciudad de Tarnovo, a través de la unificación de los Balcanes, la derrota de los otomanos y la fundación del Nuevo Bizancio, ha alcanzado aquí su verdadera conclusión."
 bul_events.99.a: "¡Viva el Tercer Imperio búlgaro!"
 bul_hagia_sophia_sofia: "La Iglesia de Santa Sofía"
 bul_hagia_sophia_sofia_desc: "Una basílica erigida en el siglo VI bajo el reinado del emperador Justiniano: su nombre, que significa “Santa Sabiduría”, se prestaría con el tiempo a la ciudad que creció en torno a ella. Habiendo resistido incontables siglos, esta iglesia da testimonio en silencio de su historia como alma de una nueva capital asentada en el corazón de Bulgaria."
 STATIC_MODIFIER_NAME_bul_legacy_mod: "El legado del Segundo Imperio búlgaro"
 STATIC_MODIFIER_DESC_bul_legacy_mod: "Incluso en medio de la tormenta de las luchas internas, la maquinaria de la ley y el oficio de los escribas de la corte apenas se sostienen."
 STATIC_MODIFIER_NAME_bul_independence_mod: "Independencia establecida"
 STATIC_MODIFIER_DESC_bul_independence_mod: "Nadie osa ya cuestionar la autoridad de quien se sienta en el trono de Tarnovo."
 STATIC_MODIFIER_NAME_bul_tarnovo_mod: "Veliko Tarnovo"
 STATIC_MODIFIER_DESC_bul_tarnovo_mod: "Los palacios e iglesias erigidos en la colina de Tsarevets recuperan la grandeza de capital imperial."
 STATIC_MODIFIER_NAME_bul_patriarchate_mod: "El Patriarcado búlgaro"
 STATIC_MODIFIER_DESC_bul_patriarchate_mod: "La bendición del patriarca trae paz al corazón de los fieles, dondequiera que vivan."
 STATIC_MODIFIER_NAME_bul_boyar_mod: "El Consejo de los Boyardos"
 STATIC_MODIFIER_DESC_bul_boyar_mod: "Los boyardos han renovado su juramento de lealtad al trono."
 STATIC_MODIFIER_NAME_bul_reunite_mod: "Bulgaria reunificada"
 STATIC_MODIFIER_DESC_bul_reunite_mod: "Sobre las tierras antaño desgarradas, un solo estandarte ondea de nuevo."
 STATIC_MODIFIER_NAME_bul_macedonia_mod: "Macedonia conquistada"
 STATIC_MODIFIER_DESC_bul_macedonia_mod: "Las montañas que antaño presenciaron la gloria de Samuel han vuelto al dominio del zar."
 STATIC_MODIFIER_NAME_bul_extend_empire_mod: "El Imperio ampliado"
 STATIC_MODIFIER_DESC_bul_extend_empire_mod: "Nuestras crecientes fronteras dan a conocer nuestra fuerza a todo reino vecino."
 STATIC_MODIFIER_NAME_bul_ottoman_wars_mod: "Las guerras otomanas"
 STATIC_MODIFIER_DESC_bul_ottoman_wars_mod: "Incontables choques con la amenaza turca han templado a nuestros soldados."
 STATIC_MODIFIER_NAME_bul_varna_mod: "La Cruzada de Varna"
 STATIC_MODIFIER_DESC_bul_varna_mod: "El recuerdo de quienes cayeron en las colinas de Varna se cuenta aún hoy."
 STATIC_MODIFIER_NAME_bul_end_ottoman_mod: "Amenaza otomana terminada"
 STATIC_MODIFIER_DESC_bul_end_ottoman_mod: "Un suspiro de alivio recorre los Balcanes cuando la largo tiempo temida amenaza se aleja."
 STATIC_MODIFIER_NAME_bul_constantinople_ambition_mod: "Ambición sobre Constantinopla"
 STATIC_MODIFIER_DESC_bul_constantinople_ambition_mod: "La sombra de nuestros buques de guerra cae ahora sobre la ruta marítima que une el Mar Negro con el Mediterráneo."
 STATIC_MODIFIER_NAME_bul_varna_port_mod: "Comercio del Mar Negro"
 STATIC_MODIFIER_DESC_bul_varna_port_mod: "Barcos mercantes extranjeros llegan y parten sin cesar del puerto de Varna."
 STATIC_MODIFIER_NAME_bul_black_sea_dominion_mod: "Dominio del Mar Negro"
 STATIC_MODIFIER_DESC_bul_black_sea_dominion_mod: "Los barcos mercantes búlgaros surcan ahora las olas del Mar Negro como si fuera su propio mar."
 STATIC_MODIFIER_NAME_bul_third_bulgarian_empire_mod: "El Tercer Imperio búlgaro"
 STATIC_MODIFIER_DESC_bul_third_bulgarian_empire_mod: "La luz que antaño brilló desde Tarnovo ilumina ahora todos los Balcanes."
 STATIC_MODIFIER_NAME_bul_bulgarian_independence_mod: "Independencia de Bulgaria proclamada"
 STATIC_MODIFIER_DESC_bul_bulgarian_independence_mod: "Las tierras fracturadas son de nuevo una sola, y toda nación debe contar con este renacimiento."
 STATIC_MODIFIER_NAME_bul_new_byzantium_mod: "El Nuevo Bizancio"
 STATIC_MODIFIER_DESC_bul_new_byzantium_mod: "Nuevas voces de oración resuenan ahora por las iglesias de Constantinopla."
