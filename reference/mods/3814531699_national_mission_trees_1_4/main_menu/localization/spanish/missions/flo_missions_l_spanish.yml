l_spanish:
 flo_magnifico_mission_pack: "El legado del Il Magnifico"
 flo_magnifico_mission_pack_DESCRIPTION:0 "La República de Florencia, bajo la extraordinaria casa de los Médici, lidera toda Europa en comercio, arte y saber. ¿Construirás sobre la enorme riqueza generada por el comercio de la lana y el banco de los Médici y florecerás como cuna del Renacimiento? ¿O unificarás la Toscana, marcharás sobre Roma y te convertirás en señora de Italia: Il Magnifico? En Florencia se encuentran la sabiduría del mercader y la ambición del gobernante."
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION:0 "Completa las misiones como Florencia y alcanza tanto el comercio y la cultura prósperos como la conquista de Italia."
 flo_magnifico_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para seguir el camino del Il Magnifico."
 flo_magnifico_mission_pack_BUTTON_DETAILS:0 "¡Deja que el Renacimiento florezca, domina la Toscana y conviértete en señora de Italia!"
 flo_rise_of_the_commune: "El ascenso de la comuna"
 flo_rise_of_the_commune_desc: "En 1337, Florencia, en medio de la lucha entre güelfos (partido papal) y gibelinos (partido imperial), surgió como “Comune”: ciudad-Estado autogobernada de mercaderes y artesanos. Los grandes bancos de las familias Bardi y Peruzzi gobiernan las finanzas europeas, y el comercio de lana a lo largo del Arno enriquece la ciudad. Pero la disputa de facciones interna no cesa. Supera esta era de turbulencia y conduce a Florencia a la verdadera grandeza."
 flo_the_prince: "El Príncipe"
 flo_the_prince_desc: "En el tiempo de las guerras de Italia, cuando potencias extranjeras devastaban Italia, el diplomático florentino Nicolás Maquiavelo escribió “El Príncipe”. Una obra revolucionaria, que miraba la realidad política con mirada fría, expresó el profundo deseo de un nuevo gobernante, capaz de unificar Italia."
 flo_arte_della_lana: "La industria de la lana"
 flo_arte_della_lana_desc: "La Arte della Lana —gremio de los comerciantes de lana— es el corazón de la economía florentina. Importando lana inglesa y exportando paño acabado por toda Europa, genera la riqueza que hace grande la ciudad."
 flo_medici_bank: "Fundación del Banco de los Médici"
 flo_medici_bank_desc: "El banco, fundado por la familia Médici, funciona como banco oficial del papado romano, con sucursales esparcidas por toda Europa. Este poder financiero es la base sobre la que Florencia ejerce influencia tanto en la cultura como en la política."
 flo_arno_renewal: "Renovación del Arno"
 flo_arno_renewal_desc: "A medida que la ciudad se desarrolla, las obras a lo largo del Arno avanzan, y Florencia se ha convertido en una de las ciudades prósperas de Italia. El alto nivel de desarrollo trae a la ciudad un aumento constante en el crecimiento mensual."
 flo_arno_corridor: "El Corredor del Arno"
 flo_arno_corridor_desc: "El Ponte Vecchio y los canales, que cortan el Arno, son las arterias comerciales y administrativas de Florencia. La construcción de puentes y del transporte fluvial acelerará el desarrollo de la ciudad."
 flo_arno_trade_network: "La red comercial del Arno"
 flo_arno_trade_network_desc: "La red comercial, que se extiende a lo largo del Arno por toda la Toscana, es la fuente del poder comercial de Florencia. Dominando esta red, podemos traer todo el comercio del norte de Italia a nuestro control."
 flo_dominate_italian_trade: "Domina el comercio italiano"
 flo_dominate_italian_trade_desc: "La red comercial de Florencia abarca ahora toda Italia. Del norte al sur, la economía italiana no puede funcionar sin los mercaderes florentinos."
 flo_duomo_di_firenze: "Santa Maria del Fiore"
 flo_duomo_di_firenze_desc: "La conclusión de la cúpula de Brunelleschi: hazaña que superó los límites de la arquitectura de su tiempo. Su gran cúpula llena a los ciudadanos de Florencia de profundo orgullo y se ha convertido en símbolo eterno de la ciudad."
 flo_birthplace_of_renaissance: "Cuna del Renacimiento"
 flo_birthplace_of_renaissance_desc: "Florencia lidera, como cuna del Renacimiento, la renovación espiritual de toda Europa. El espíritu de retorno a la Antigüedad clásica y al humanismo ha echado aquí raíces profundas."
 flo_florentine_school_of_painting: "La escuela florentina de pintura"
 flo_florentine_school_of_painting_desc: "El estilo florentino de pintura, fundado por Botticelli y otros, se adelanta a toda Europa en perspectiva y realismo."
 flo_the_mona_lisa: "La Mona Lisa"
 flo_the_mona_lisa_desc: "La obra maestra de Leonardo da Vinci cambió el propio concepto de pintura. El suelo artístico de Florencia, que continúa generando tales genios, es incomparable."
 flo_uffizi: "Los Uffizi"
 flo_uffizi_desc: "Mediante la unión de la colección de arte reunida por la familia Médici, los Uffizi pueden convertirse en el mayor museo del mundo. Su prestigio cultural elevará para siempre el nombre de Florencia."
 flo_the_rise_of_medici: "El ascenso de los Médici"
 flo_the_rise_of_medici_desc: "Tras la caída de las familias Bardi y Peruzzi, se alzó una nueva dinastía bancaria: los Médici. El banco de los Médici, fundado por Giovanni di Bicci de’ Medici en 1397, creció rápidamente gracias a las relaciones con el papado romano y amplió las sucursales por toda Europa. Esta familia llevará adelante el futuro de Florencia."
 flo_pazzi_conspiracy: "La conjura de los Pazzi"
 flo_pazzi_conspiracy_desc: "El atentado contra Lorenzo de Médici, apoyado por el papa Sixto IV y la familia Pazzi, fracasó y, paradójicamente, solo fortaleció la autoridad de los Médici."
 flo_machiavelli: "Las obras de Maquiavelo"
 flo_machiavelli_desc: "En “El Príncipe”, Nicolás Maquiavelo analizó fríamente la realidad del poder. Su pensamiento influyó profundamente en la filosofía política florentina."
 flo_republic_of_virtue: "La república de la virtud"
 flo_republic_of_virtue_desc: "Florencia busca ser no solo un Estado comercial, sino también basado en la virtud y los ideales republicanos. La legitimidad y la estabilidad son las piedras angulares de la república."
 flo_camerata_fiorentina_nmt: "La Camerata Fiorentina"
 flo_camerata_fiorentina_nmt_desc: "La Camerata, donde se reúnen eruditos y músicos florentinos, se convierte en vivero de innovación musical, que llevará al nacimiento de la ópera. Ciudad en que arte y ciencia florecen como una sola."
 flo_subjugate_pisa: "Subyuga Pisa"
 flo_subjugate_pisa_desc: "Pisa, ciudad portuaria, desde hace mucho codiciada por Florencia como puerta al mar, debe ser asegurada. Tomar este puerto en el Arno ampliará enormemente el alcance comercial de Florencia."
 flo_siena_submitted: "Subyugación de Siena"
 flo_siena_submitted_desc: "Nuestra antigua rival Siena ha sido por fin subyugada. Habiendo vengado la humillación de Montaperti, Florencia acoge a sus talabarteros y banqueros y asegura pleno control de la Toscana meridional."
 flo_lucca_absorbed: "Absorción de Lucca"
 flo_lucca_absorbed_desc: "Lucca, que desde hace mucho preservó la independencia, es uno de los últimos obstáculos a la unificación de la Toscana por Florencia. Trae su industria de la seda al gobierno florentino."
 flo_unify_tuscany: "Une la Toscana"
 flo_unify_tuscany_desc: "Ahora que casi toda la Toscana está bajo control florentino, la elevación al rango de reino es consecuencia natural. Florencia ya no es una simple ciudad-Estado."
 flo_push_into_lombardy: "Avance sobre Lombardía"
 flo_push_into_lombardy_desc: "Más allá de la Toscana, ha llegado la hora de extender nuestro dominio al corazón del norte de Italia. El conflicto con Milán, Génova y Venecia es inevitable."
 flo_march_on_rome: "Marcha sobre Roma"
 flo_march_on_rome_desc: "Quien gobierna Roma gobierna Italia. Habiendo traído la antigua capital del Imperio romano a su dominio, Florencia reivindica una legitimidad que nadie iguala."
 flo_the_new_rome: "La Nueva Roma"
 flo_the_new_rome_desc: "Florencia, que ha conquistado Roma, gobierna ahora la mayor parte de la península itálica y se ha convertido en un imperio. Ha llegado la hora de erigir una nueva Roma."
 flo_il_magnifico_of_italy: "El Il Magnifico de Italia"
 flo_il_magnifico_of_italy_desc: "Como Lorenzo de Médici fue llamado “Il Magnifico”, así toda Florencia se ha convertido en la “Magnífica” de Italia."
 flo_medici_oriental_press: "La imprenta de los Médici de manuscritos orientales"
 flo_medici_oriental_press_desc: "La imprenta, erigida por la familia Médici, reúne e imprime manuscritos griegos que afluyeron tras la caída del Imperio bizantino. El saber antiguo respira de nuevo en Europa."
 flo_clock_tower: "La torre del reloj de la Piazza della Signoria"
 flo_clock_tower_desc: "La precisa torre del reloj, erigida en el Palazzo della Signoria, se ha convertido en símbolo de la pericia técnica florentina. La gestión del tiempo mejora la eficiencia del comercio y del gobierno."
 flo_first_modern_engineer: "El primer ingeniero moderno"
 flo_first_modern_engineer_desc: "Filippo Brunelleschi desarrolló métodos constructivos revolucionarios, que superaron a la Roma antigua en la construcción de la cúpula. Su legado técnico se aplica a las fortificaciones de toda Italia."
 flo_humiliate_venice: "Humilla a Venecia"
 flo_humiliate_venice_desc: "Ha llegado la hora de superar a nuestra antigua rival marítima, la República de Venecia. Poniendo a la Reina del Adriático en su lugar, probaremos que Florencia es la nación líder de Italia."
 flo_papal_relations: "Relaciones con el papado"
 flo_papal_relations_desc: "Ahora que Roma está asegurada, las relaciones con el papado deben ponerse sobre base sólida. Ya sea por alianza, ya sea por supremacía, Florencia se convertirá en el mayor mecenas de la iglesia romana."
 flo_vasari_corridor: "Los Uffizi y el Corredor Vasariano"
 flo_vasari_corridor_desc: "El Corredor Vasariano, que une el palacio de los Uffizi y el Ponte Vecchio, fue proyectado por Giorgio Vasari por encargo de Cosme I de Médici. Este pasaje elevado secreto simboliza el poder y la superioridad artística de los Médici."
 flo_academy_of_florence: "La Academia de Florencia"
 flo_academy_of_florence_desc: "La Academia, erigida en Florencia, se convirtió en lugar de investigación amplia de arte, ciencia y filosofía. El saber del Renacimiento se extiende de aquí al mundo."
 flo_italian_cultural_hegemon: "Hegemón cultural de Italia"
 flo_italian_cultural_hegemon_desc: "Florencia, donde el comercio, el arte y el saber florecieron como uno solo, se ha convertido en el centro cultural de toda Italia. Su influencia alcanza incluso más allá de los Alpes."
 flo_magnifico: "Il Magnifico"
 flo_magnifico_desc: "De ciudad comercial, Florencia se ha elevado a la cumbre de la cultura, ha conquistado toda Italia y se ha establecido como heredera del Imperio romano. “Il Magnifico”: el nombre del Magnífico grabado para siempre en la historia."
 STATIC_MODIFIER_NAME_flo_arte_della_lana_mod: "Industria de la lana próspera"
 STATIC_MODIFIER_DESC_flo_arte_della_lana_mod: "La Arte della Lana (gremio de la lana) era el mayor gremio de Florencia y la base de la prosperidad urbana. El paño finamente trabajado, hecho de lana bruta comprada en Inglaterra y España, era estimado en toda Europa y se convirtió en la fuente de la enorme fortuna de los Médici."
 STATIC_MODIFIER_NAME_flo_medici_bank_mod: "Supremacía del Banco de los Médici"
 STATIC_MODIFIER_DESC_flo_medici_bank_mod: "Fundado por Giovanni di Bicci de’ Medici en 1397, el banco de los Médici tenía, en su apogeo, sucursales en dieciséis ciudades, incluidas Roma, Venecia, Londres y Brujas. Como banco oficial de la corte papal, cosechaba enormes beneficios, sorteando la prohibición eclesiástica de la usura bajo la forma de “beneficio de cambio”."
 STATIC_MODIFIER_NAME_flo_arno_trade_network_mod: "La red comercial del Arno"
 STATIC_MODIFIER_DESC_flo_arno_trade_network_mod: "El Arno era la gran vía fluvial que unía Florencia con el puerto de Pisa. Mediante el dominio de las rutas comerciales a lo largo de su curso, Florencia, ciudad del interior, participaba directamente en el comercio mediterráneo, creando una esfera económica singular, que combinaba paño, banca y comercio."
 STATIC_MODIFIER_NAME_flo_dominate_italian_trade_mod: "Supremacía en el comercio italiano"
 STATIC_MODIFIER_DESC_flo_dominate_italian_trade_mod: "La Italia de finales de la Edad Media era la mayor zona comercial de Europa, con mercaderes de Florencia, Venecia y Génova en la cima. Los mercaderes florentinos tejían una red financiera por toda Europa septentrional, con influencia suficiente para prestar a ambos lados de la Guerra de los Cien Años entre Inglaterra y Francia."
 STATIC_MODIFIER_NAME_flo_duomo_di_firenze_mod: "Conclusión de la catedral"
 STATIC_MODIFIER_DESC_flo_duomo_di_firenze_mod: "La cúpula de la catedral de Florencia (Santa Maria del Fiore) fue concluida por Brunelleschi en 1436. Revolucionario logro técnico —una gigantesca cúpula, erigida sin andamios de madera ni soportes constructivos, algo que nadie lograba desde hacía más de mil años desde el Panteón de Roma— simboliza el espíritu del Renacimiento."
 STATIC_MODIFIER_NAME_flo_birthplace_of_renaissance_mod: "Cuna del Renacimiento"
 STATIC_MODIFIER_DESC_flo_birthplace_of_renaissance_mod: "El “Renacimiento” —renacimiento— nació en Florencia. En la Academia Platónica, fundada por Cosme de Médici, Marsilio Ficino y otros resucitaron el pensamiento de la Grecia y la Roma antiguas y, combinado con la tradición literaria de Dante, Petrarca y Boccaccio, transformó la civilización occidental hasta sus cimientos."
 STATIC_MODIFIER_NAME_flo_florentine_school_of_painting_mod: "Escuela florentina de pintura"
 STATIC_MODIFIER_DESC_flo_florentine_school_of_painting_mod: "La tradición de la pintura realista, fundada por Giotto di Bondone a finales del siglo XIII, pasó a la perspectiva de Masaccio, a la gracia de Botticelli y a la versatilidad de Leonardo. La pintura florentina encarnó la transición de las imágenes sagradas medievales al arte moderno y definió el rumbo de la pintura europea."
 STATIC_MODIFIER_NAME_flo_the_mona_lisa_mod: "La influencia de la Mona Lisa"
 STATIC_MODIFIER_DESC_flo_the_mona_lisa_mod: "Pintada hacia 1503-1519 por Leonardo da Vinci, la “Mona Lisa”, con su sonrisa enigmática y su innovadora perspectiva y técnica sfumato, se convirtió en la obra más famosa de la historia del arte occidental. Leonardo fue genio universal, abarcando no solo la pintura, sino también la anatomía, la ingeniería, la arquitectura y la música."
 STATIC_MODIFIER_NAME_flo_uffizi_mod: "La gloria de los Uffizi"
 STATIC_MODIFIER_DESC_flo_uffizi_mod: "El palacio de los Uffizi, proyectado por Vasari por encargo de Cosme I de Médici en 1560, era inicialmente una oficina administrativa (Uffizi significa “oficinas”), pero después albergó las colecciones de los Médici y se convirtió en uno de los primeros museos del mundo: templo del arte, donde se reúnen las obras de Botticelli, Leonardo y Miguel Ángel."
 STATIC_MODIFIER_NAME_flo_machiavelli_mod: "Las enseñanzas del Príncipe"
 STATIC_MODIFIER_DESC_flo_machiavelli_mod: "Nicolás Maquiavelo sirvió a la República Florentina como diplomático y administrador de 1498 a 1512. “El Príncipe”, escrito tras el exilio de los Médici, fue una obra de pensamiento político realista, que afirmaba que “el fin justifica los medios”, y se convirtió en la base de la teoría política moderna."
 STATIC_MODIFIER_NAME_flo_republic_of_virtue_mod: "La república de la virtud"
 STATIC_MODIFIER_DESC_flo_republic_of_virtue_mod: "Florencia tenía un sistema peculiar, que preservaba la fachada republicana mientras los Médici gobernaban de hecho. Instituciones como la Signoria (gobierno de la ciudad), los Priori (magistrados) y el Gran Consejo combinaban hábilmente los ideales del republicanismo y la realidad de la oligarquía."
 STATIC_MODIFIER_NAME_flo_camerata_fiorentina_mod: "La Camerata Fiorentina"
 STATIC_MODIFIER_DESC_flo_camerata_fiorentina_mod: "La “Camerata”, círculo de músicos, poetas y eruditos que se reunía en las décadas de 1570 y 1580 en la residencia del conde Giovanni de’ Bardi, en Florencia, buscaba resucitar el antiguo drama griego. Sus experimentos dieron a luz una forma de arte enteramente nueva, la ópera, y cambiaron para siempre la historia de la música occidental."
 STATIC_MODIFIER_NAME_flo_subjugate_pisa_mod: "El puerto de Pisa"
 STATIC_MODIFIER_DESC_flo_subjugate_pisa_mod: "Pisa gobernó antaño una república marítima junto a Venecia y Génova sobre el Mediterráneo, pero decayó tras la aplastante derrota ante Génova en la batalla de la Meloria, en 1284. Con la conquista de Pisa por Florencia en 1406, la antaño terrestre Florencia obtuvo por fin acceso al mar."
 STATIC_MODIFIER_NAME_flo_siena_submitted_mod: "Subyugación de Siena"
 STATIC_MODIFIER_DESC_flo_siena_submitted_mod: "Siena fue la rival hereditaria de Florencia, que desde hace mucho disputaba la supremacía sobre la Toscana. Siena mantuvo la independencia con apoyo español, pero acabó cayendo en 1555. Traer al gobierno florentino a los orgullosos sieneses, conocidos por las carreras del Palio, es símbolo de la unificación de la Toscana."
 STATIC_MODIFIER_NAME_flo_lucca_absorbed_mod: "Seda y paño de Lucca"
 STATIC_MODIFIER_DESC_flo_lucca_absorbed_mod: "Lucca era la ciudad de industria de la seda más fina de la Toscana. En los siglos XIII y XIV, la seda luquesa era estimada en toda Europa, adornando las vestiduras de príncipes y nobles. También merece atención la riqueza de los banqueros de Lucca, rivales de los Médici."
 STATIC_MODIFIER_NAME_flo_unify_tuscany_mod: "Señor de la Toscana"
 STATIC_MODIFIER_DESC_flo_unify_tuscany_mod: "Arezzo, antigua ciudad de los etruscos; Siena, ciudad de la poesía; Lucca, ciudad de los oficios; Pisa, el puerto: mediante su unificación, Florencia se convierte en el centro de la Toscana como todo histórico, cultural y geográfico. Esta hazaña une la romana “Tuscia” bajo el estandarte de los Médici."
 STATIC_MODIFIER_NAME_flo_push_into_lombardy_mod: "Avance sobre Lombardía"
 STATIC_MODIFIER_DESC_flo_push_into_lombardy_mod: "Florencia y Milán fueron las dos grandes potencias de la política italiana del siglo XV, siempre en tensión. Contra la política expansionista de los duques Visconti y Sforza de Milán, Florencia resistió con diplomacia y condotieros, comandantes mercenarios. Este equilibrio de poder generó la sofisticación de la diplomacia renacentista."
 STATIC_MODIFIER_NAME_flo_the_new_rome_mod: "La Nueva Roma"
 STATIC_MODIFIER_DESC_flo_the_new_rome_mod: "Florencia era frecuentemente llamada “Nueva Roma”. Cosme y Lorenzo de Médici imitaron conscientemente la cultura de mecenazgo de Roma, buscando recrear las virtudes de la Roma antigua en el espíritu del Renacimiento. Dominar la propia Roma es la conclusión simbólica de este objetivo."
 STATIC_MODIFIER_NAME_flo_il_magnifico_of_italy_mod: "El Il Magnifico de Italia"
 STATIC_MODIFIER_DESC_flo_il_magnifico_of_italy_mod: "Lorenzo de Médici (Lorenzo el Magnífico, 1449-1492) estaba en la cumbre de su época como artista, poeta, diplomático y estadista. La política de equilibrio, que llamó “equilibrio de Italia”, preservó la paz en el umbral de las guerras de Italia, y su corte irradiaba el más refinado brillo de la cultura renacentista."
 STATIC_MODIFIER_NAME_flo_medici_oriental_press_mod: "El legado del saber oriental"
 STATIC_MODIFIER_DESC_flo_medici_oriental_press_mod: "En el Concilio de Ferrara-Florencia de 1438-1439, Cosme de Médici compró gran número de manuscritos griegos de eruditos que vinieron de Bizancio. Esta colección llevó a la traducción latina de Platón y al renacimiento del neoplatonismo, cambiando la historia del pensamiento occidental. Combinado con la revolución de la imprenta de Gutenberg, el saber se extendió con rapidez."
 STATIC_MODIFIER_NAME_flo_clock_tower_mod: "Precisión de la torre del reloj"
 STATIC_MODIFIER_DESC_flo_clock_tower_mod: "Los relojes mecánicos empezaron a aparecer en las plazas de las ciudades del norte de Italia en el siglo XIV. El campanario (Campanile) de la catedral de Florencia, proyectado por Giotto, es ejemplo típico. La medición común del tiempo unificó el comercio y el gobierno de la ciudad y se convirtió en infraestructura que sustentó la transición de la Edad Media a la modernidad."
 STATIC_MODIFIER_NAME_flo_the_rise_of_medici_mod: "El ascenso de los Médici"
 STATIC_MODIFIER_DESC_flo_the_rise_of_medici_mod: "Cosme de Médici (llamado Pater Patriae, 1389-1464), apoyándose en los beneficios bancarios, desterró a sus enemigos políticos y se convirtió en gobernante de hecho de Florencia. Como tesorero de la corte papal, mecenas de las artes y mediador en la diplomacia, sentó la base de la gloria de la casa de Médici."
 STATIC_MODIFIER_NAME_flo_first_modern_engineer_mod: "Pionero de la ingeniería moderna"
 STATIC_MODIFIER_DESC_flo_first_modern_engineer_mod: "Filippo Brunelleschi trajo revolución a la arquitectura, la escultura y la ingeniería. Teorizó la perspectiva lineal y realizó la gran cúpula de la catedral de Florencia mediante innovadoras técnicas de doble casco y armazón. Es el arquetipo del “hombre universal” (uomo universale) renacentista."
 STATIC_MODIFIER_NAME_flo_humiliate_venice_mod: "La humillación de Venecia"
 STATIC_MODIFIER_DESC_flo_humiliate_venice_mod: "Florencia y Venecia, dos grandes potencias comerciales de la Italia medieval, rivalizaron en prosperidad y entraron en conflicto desde hace mucho tanto diplomática como militarmente. El conflicto sobre la expansión en Milán, en el siglo XV, fue particularmente feroz, y Florencia siempre vio la expansión terrestre de Venecia (la política de Terraferma) como amenaza."
 STATIC_MODIFIER_NAME_flo_papal_relations_mod: "Lazos con el papado"
 STATIC_MODIFIER_DESC_flo_papal_relations_mod: "Las relaciones entre los Médici y la corte papal eran complejas. Tras la conjura de los Pazzi de 1478 (intento de asesinato, en el que estuvo implicado el arzobispo Francesco Salviati), que mató al hermano de Lorenzo, Giuliano, Lorenzo entró por algún tiempo en conflicto con Sixto IV, pero después se reconcilió y restauró sólidas relaciones."
 STATIC_MODIFIER_NAME_flo_academy_of_florence_mod: "La Academia de Florencia"
 STATIC_MODIFIER_DESC_flo_academy_of_florence_mod: "La Academia Platónica, apoyada por Cosme de Médici, emprendió, bajo el liderazgo de Marsilio Ficino, el renacimiento de la filosofía antigua. La traducción latina de las obras completas de Platón, la traducción del Corpus Hermeticum, la sistematización del neoplatonismo: estas empresas espirituales renovaron las propias bases de la filosofía, la teología y la ciencia occidentales."
 STATIC_MODIFIER_NAME_flo_italian_cultural_hegemon_mod: "Mecenas del arte italiano"
 STATIC_MODIFIER_DESC_flo_italian_cultural_hegemon_mod: "La Florencia del Renacimiento era el centro cultural de toda Europa. Príncipes y nobles de Francia, los Países Bajos, Alemania e Inglaterra invitaban a artistas, arquitectos y eruditos florentinos, compitiendo en la imitación de la cultura de corte “italiana”."
 STATIC_MODIFIER_NAME_flo_magnifico_mod: "La gloria del Il Magnifico"
 STATIC_MODIFIER_DESC_flo_magnifico_mod: "“Il Magnifico”: expresión que refleja no solo el brillo de un hombre, sino el de toda la ciudad de Florencia. La gloria de Florencia, en la cima de Europa tanto en arte, filosofía, diplomacia como en finanzas, encarna la esencia misma de la era que las generaciones posteriores llamarán “Renacimiento”."
 flo_events.1.t: "El ascenso de la comuna florentina"
 flo_events.1.d: "En 1337, Florencia está dominada por una larga lucha entre las facciones de los güelfos y los gibelinos. Los grandes bancos de las familias Bardi y Peruzzi, sobrecargados por enormes préstamos al rey de Inglaterra, empiezan a vacilar. La sombra de la Peste Negra se aproxima sigilosa desde el este, y algunos traman invitar al tirano Gualterio de Brienne. Y, sin embargo, el espíritu de la comuna florentina —la ciudad mercantil autogobernada— está vivo. Con base en el comercio de lana y los gremios mercantiles, sobrevive a esta era de tormentas."
 flo_events.1.a: "El futuro de Florencia está en nuestras manos"
 flo_events.3.t: "Consecuencias de la conjura de los Pazzi"
 flo_events.3.d: "El atentado contra Lorenzo de Médici, apoyado por el papa Sixto IV y la familia Pazzi, fracasó y, paradójicamente, solo fortaleció la autoridad de los Médici. Los conspiradores ejecutados, y los ciudadanos de Florencia reforzaron aún más su apoyo a los Médici. Habiendo sobrevivido a esta prueba, la estructura política de la república está lista para renacer en algo más refinado."
 flo_events.3.a: "La prueba nos ha hecho más fuertes"
 flo_events.4.t: "Marcha sobre Roma"
 flo_events.4.d: "La antigua capital del Imperio romano está ahora bajo el estandarte de Florencia. La Donación de Constantino ya probada falsificación: si es así, la legítima autoridad de gobernar Italia pertenece a Florencia, conquistada por la fuerza y la sabiduría. Esta pequeña república, nacida de una ciudad comercial, recorre ahora el camino hacia el imperio, cuyo nombre será grabado en la historia."
 flo_events.4.a: "Roma brilla con la gloria de Florencia"
 STATIC_MODIFIER_NAME_flo_arno_renewal_mod: "La Grande Opera"
 STATIC_MODIFIER_DESC_flo_arno_renewal_mod: "Las crecidas del Arno afligieron Florencia durante años (la inundación de 1966 se discute hasta hoy). Pero, mejorando las orillas, construyendo puentes y reforzando los diques, el río se convirtió antes en una ventaja de la ciudad. Los talleres, tintorerías y lavaderos de lana a lo largo del río operaban como corazón de la economía florentina."
 STATIC_MODIFIER_NAME_flo_arno_corridor_mod: "Prosperidad del Ponte Vecchio"
 STATIC_MODIFIER_DESC_flo_arno_corridor_mod: "El Ponte Vecchio (Puente Viejo) es el más antiguo puente sobre el Arno y, desde el siglo XIV, símbolo del comercio florentino, flanqueado por tiendas de orfebres y joyeros. Renovado como parte del Corredor Vasariano, que Cosme I ordenó erigir para unir los Uffizi con el Palacio Pitti, se convirtió en pasaje simbólico, que une al gobernante y la ciudad."
 STATIC_MODIFIER_NAME_flo_vasari_corridor_mod: "El Corredor Vasariano"
 STATIC_MODIFIER_DESC_flo_vasari_corridor_mod: "Concluido por Giorgio Vasari en solo cinco meses en 1565, el Corredor Vasariano es un pasaje elevado, que une el palacio de los Uffizi, pasando por el Ponte Vecchio, con el Palacio Pitti. Proyectado para que Cosme I pudiera moverse sin mezclarse con la multitud, es la cristalización técnica de la seguridad del gobernante y de su dominio sobre la ciudad."
 flo_events.5.t: "Los Uffizi y el Corredor Vasariano"
 flo_events.5.d: "Cosme I de Médici ordenó al arquitecto Giorgio Vasari que uniera el palacio de los Uffizi (sede de la administración) con el Palacio Pitti por un pasaje elevado secreto. Este “Corredor Vasariano”, que corre sobre el Ponte Vecchio, es un pasaje oculto, que permitía al gobernante moverse sin ser visto por el público: símbolo del poder de los Médici y de su dominio sobre la ciudad. Esta arquitectura genial, que cruza el Arno, muestra claramente que la política y el arte, en Florencia, son una y la misma cosa."
 flo_events.5.a: "La conclusión del corredor ha elevado el gobierno de Florencia a un nuevo nivel"
 STATIC_MODIFIER_NAME_flo_the_prince_mod: "El nuevo príncipe"
 STATIC_MODIFIER_DESC_flo_the_prince_mod: "En “El Príncipe” (1513), Maquiavelo proclamaba que es preciso tener “la fuerza del león y la astucia de la zorra”. El realismo de que es más seguro ser temido respetuosamente que amado y de que, en caso de necesidad, debe ponerse la conservación del poder por encima de la moralidad se convirtió en el punto de partida de la ciencia política contemporánea."
 flo_events.6.t: "El Príncipe"
 flo_events.6.d: "Las guerras de Italia han dado a Florencia una dura lección. El diplomático Nicolás Maquiavelo escribió “El Príncipe”, obra que revela la esencia misma del poder. Para unificar la Italia fragmentada, es necesario un nuevo gobernante, que ponga el poder real por encima de la moralidad. “Solo un príncipe, que posea tanto virtù como fortuna, puede salvar Italia en el caos”: y, tal vez, esa respuesta esté en la propia Florencia."
 flo_events.6.a: "¡Que se alce un nuevo príncipe, para salvar Italia!"
