l_spanish:
 lit_lithuania_mission_pack: "Del Báltico al Mar Negro"
 lit_lithuania_mission_pack_DESCRIPTION:0 "En 1337, el Gran Ducado de Lituania, bajo el gran duque Gediminas, es la más dinámica potencia de Europa oriental. Derrota a la Orden Teutónica, conquista la Rus, alcanza el Mar Negro, forma con Polonia una república nobiliaria y elige tu fe, para definir el alma de Lituania."
 lit_lithuania_mission_pack_CRITERIA_DESCRIPTION:0 "Conquista del Báltico al Mar Negro y forma con Polonia una república nobiliaria, para erigir el gran imperio lituano."
 lit_lithuania_mission_pack_BUTTON_TOOLTIP:0 "Gobierna, como Lituania, Europa oriental del Báltico al Mar Negro."
 lit_lithuania_mission_pack_BUTTON_DETAILS:0 "“Tierra de Lituania, para siempre”: ¡de Gediminas a Vytautas, restaura el brillo del Gran Ducado!"
 lit_gediminas_legacy: "El legado de los Gediminaitis"
 lit_gediminas_legacy_desc: "Hereda las bases dinásticas sentadas por el gran duque Gediminas y recorre el camino hacia el gran imperio, que se extiende del Báltico al Mar Negro."
 lit_teutonic_threat: "La amenaza de la Orden Teutónica"
 lit_teutonic_threat_desc: "La Orden Teutónica, que marcha hacia el este bajo la bandera de la cruzada —este Estado militar religioso— es la mayor enemiga de Lituania. Detenla y asegura la frontera occidental."
 lit_black_ruthenia_integration: "Integra la Rutenia Negra"
 lit_black_ruthenia_integration_desc: "La Rutenia Negra —situada en torno a Grodno y Brest—: trae esta tierra a la esfera de gobierno de Lituania como base para la expansión oriental."
 lit_volhynia_podolia: "Volinia y Podolia"
 lit_volhynia_podolia_desc: "Volinia y Podolia: trae las ricas llanuras de la Ucrania occidental al control lituano y abre el camino hacia el Mar Negro."
 lit_smolensk: "La conquista de Smolensk"
 lit_smolensk_desc: "Smolensk: estratégica puerta a la Rus oriental. Toma esta fortaleza y aumenta la presión sobre Moscú."
 lit_kyiv: "La conquista de Kiev"
 lit_kyiv_desc: "Kiev: madre de todas las ciudades rusas. Si Lituania toma Kiev, se abre el camino para convertirse en “señora de toda la Rus”."
 lit_steppe_frontier: "La frontera de la estepa"
 lit_steppe_frontier_desc: "La gran estepa, donde vagan tártaros y cumanos: erige una línea de defensa en esta peligrosa frontera y abre el camino hacia Crimea."
 lit_crimea: "Subyugación de Crimea"
 lit_crimea_desc: "La península de Crimea: llave del Mar Negro. Subyuga el Kanato de Crimea y asegura la puerta al Mar Negro."
 lit_black_sea: "Señor del Mar Negro"
 lit_black_sea_desc: "El Mar Negro: el mar de Lituania. De Crimea a Odesa, cubre toda la costa del Mar Negro con el estandarte lituano."
 lit_dominant_in_rus: "Supremacía sobre la Rus"
 lit_dominant_in_rus_desc: "Moscú o Lituania: en la lucha por la supremacía sobre Europa oriental, Lituania triunfa y gobierna como “señora de toda la Rus”."
 lit_teutonic_defeat: "La caída de la Orden Teutónica"
 lit_teutonic_defeat_desc: "El viejo enemigo desde los tiempos de Grunwald, la Orden Teutónica, ha caído por fin: el dominio del Báltico pertenece a Lituania."
 lit_samogitia: "Samogitia"
 lit_samogitia_desc: "Samogitia: tierra disputada desde hace mucho con la Orden Teutónica. Restituye a Lituania la patria de este terco pueblo báltico."
 lit_livonia: "Dominio de Livonia"
 lit_livonia_desc: "Riga y Livonia: trae el corazón del comercio báltico al control lituano y establece influencia sobre la Hansa."
 lit_jogaila_union: "La Unión de Jogaila"
 lit_jogaila_union_desc: "La unión del gran duque Jogaila con el Reino de Polonia: por la conversión al catolicismo y por el matrimonio, Lituania y Polonia están ligadas."
 lit_jagiellonian_dynasty: "La dinastía Jagellón"
 lit_jagiellonian_dynasty_desc: "La dinastía jagellónica: gobernando tanto Lituania como Polonia, esta casa surge como la mayor potencia de Europa central."
 lit_lublin_union: "La Unión de Lublin"
 lit_lublin_union_desc: "La Unión de Lublin de 1569: momento histórico en que Lituania y Polonia se unen en la “República de las Dos Naciones”."
 lit_polish_sejm: "El Sejm polaco"
 lit_polish_sejm_desc: "El Sejm: esta institución, por la que la nobleza participa en las decisiones del Estado, se convierte en corazón de la república nobiliaria."
 lit_commonwealth: "Conclusión de la república nobiliaria"
 lit_commonwealth_desc: "La república nobiliaria polaco-lituana: el mayor Estado de Europa central, que se extiende del Báltico al Mar Negro, concluida. “Por nuestra libertad”: el estandarte de esta república nobiliaria brilla sobre Europa."
 lit_faith_choice: "La elección de la fe"
 lit_faith_choice_desc: "Catolicismo, ortodoxia o Romuva: ¿qué fe elegirá Lituania? Esta decisión definirá el futuro de la nación."
 lit_catholic_baptism: "Bautismo en la fe católica"
 lit_catholic_baptism_desc: "El bautismo de Vilna de 1387: Lituania acepta el catolicismo y se convierte en parte de la cristiandad europea."
 lit_faith_romuva_chosen_tt: "Se eligió la Romuva"
 lit_faith_orthodox_chosen_tt: "Se eligió la ortodoxia"
 lit_faith_catholic_chosen_tt: "Se eligió el catolicismo"
 lit_catholic_crusade: "La cruzada católica"
 lit_catholic_crusade_desc: "Bajo el estandarte católico —mediante el contraataque al Estado cruzado pagano de la Orden Teutónica—, Lituania es reconocida como defensora del mundo católico."
 lit_catholic_bishoprics: "Establecimiento de obispados"
 lit_catholic_bishoprics_desc: "El obispado de Vilna: organiza la estructura de la Iglesia católica en Lituania y deja que la fe eche raíces profundas."
 lit_catholic_king: "Coronación del rey católico"
 lit_catholic_king_desc: "El rey católico de Polonia-Lituania: la legítima corona, reconocida por el papa, brilla ahora sobre la dinastía jagellónica."
 lit_orthodox_metropolis: "La metrópoli ortodoxa"
 lit_orthodox_metropolis_desc: "La Metrópoli de Kiev: Lituania toma bajo su protección el centro de la ortodoxia de la Rus. Gobierna Europa oriental como protectora de los fieles ortodoxos."
 lit_orthodox_third_rome: "La Tercera Roma"
 lit_orthodox_third_rome_desc: "Ahora que Constantinopla ha caído, Kiev se convierte en el nuevo centro de la ortodoxia, la “Tercera Roma”."
 lit_orthodox_unity: "Unidad de la Iglesia ortodoxa"
 lit_orthodox_unity_desc: "La unidad de los fieles ortodoxos: las iglesias ortodoxas de toda la Rus se reúnen bajo la protección de Lituania."
 lit_orthodox_tsar: "El zar ortodoxo"
 lit_orthodox_tsar_desc: "“Zar de toda la Rus”: el monarca lituano, que une la autoridad ortodoxa al gobierno sobre la Rus, supera incluso a Moscú."
 lit_romuva_maintained: "Preserva la Romuva"
 lit_romuva_maintained_desc: "La Romuva, antigua fe báltica: la llama eterna del sacerdote-žynys arde de nuevo, y Lituania está bajo la bandera pagana."
 lit_romuva_sanctuary: "Erige el santuario"
 lit_romuva_sanctuary_desc: "Los bosques sagrados de Lituania: protege los santuarios de la Romuva y establece el centro espiritual de la fe báltica."
 lit_romuva_expansion: "Expansión pagana"
 lit_romuva_expansion_desc: "Difunde la Romuva por la espada: convierte a los ortodoxos, católicos y musulmanes circundantes a la Romuva y erige el “gran Estado pagano”."
 lit_romuva_pagan_king: "El rey pagano"
 lit_romuva_pagan_king_desc: "“El Gran Rey Pagano”: ha nacido el monarca lituano pagano, que ha alzado la llama de la Romuva y gobierna del Báltico a la estepa."
 lit_vilnius_capital: "Desarrolla Vilna"
 lit_vilnius_capital_desc: "Vilna: la ciudad dorada de Lituania. Desarrolla sus palacios, su catedral y sus mercados y dale un esplendor digno de capital imperial."
 lit_amber_road: "La Ruta del Ámbar"
 lit_amber_road_desc: "La Ruta del Ámbar: toma esta ruta comercial, por donde el ámbar del Báltico es llevado al Mediterráneo, y haz de Lituania un nudo del comercio europeo."
 lit_grand_duchy_law: "El Estatuto lituano"
 lit_grand_duchy_law_desc: "El Estatuto lituano: emitido en 1529 como el más avanzado código de leyes de Europa central, moderniza el gobierno de Lituania."
 lit_krakow: "Desarrolla Cracovia"
 lit_krakow_desc: "Cracovia: desarrolla esta ciudad del brillo jagellónico y déjala brillar como segunda capital de la república nobiliaria polaco-lituana."
 lit_red_ruthenia: "Conquista de la Rutenia Roja"
 lit_red_ruthenia_desc: "La Rutenia Roja y Halych: disputadas por Polonia y Hungría, toma esta tierra para Lituania y amplía tu territorio hasta los Cárpatos."
 lit_moldavia: "Subyugación de Moldavia"
 lit_moldavia_desc: "Moldavia: principado rumano junto al Danubio. Subyuga este Estado y establece una cabeza de puente en los Balcanes."
 lit_grand_empire: "El Gran Imperio lituano"
 lit_grand_empire_desc: "“Del Báltico al Mar Negro”: el sueño del gran duque Vytautas realizado. El Gran Ducado de Lituania gobierna el mayor imperio de Europa."
 lit_events.5.t: "La elección de la fe"
 lit_events.5.d: "Lituania está en una encrucijada. ¿Convertirse al catolicismo y profundizar la unión con Polonia? ¿Defender la ortodoxia y convertirse en protectora de la Rus? ¿O preservar la fe heredada de la Romuva y convertirse en gran rey pagano?"
 lit_events.5.a: "Convertirse al catolicismo: unirse a la cristiandad y profundizar la alianza polaca"
 lit_events.5.b: "Elegir la ortodoxia: convertirse en protectora de la Rus y de la cristiandad oriental"
 lit_events.5.c: "Preservar la Romuva: nunca dejar apagar la llama sagrada del žynys"
 lit_events.10.t: "La conquista de Kiev"
 lit_events.10.d: "Kiev —madre de todas las ciudades rusas— ha caído ante Lituania. No Moscú, sino Lituania lleva ahora el legado de la Rus de Kiev."
 lit_events.10.a: "¡Gloria a Kiev! ¡Gloria a la protectora de toda la Rus!"
 lit_events.15.t: "El rey católico"
 lit_events.15.d: "Bajo el reconocimiento papal, ha sido coronado el rey católico de Lituania y Polonia: Lituania es ahora formalmente parte del mundo católico."
 lit_events.15.a: "¡Gloria al rey católico! ¡Que el reino dure para siempre!"
 lit_events.16.t: "El zar de Lituania"
 lit_events.16.d: "El gobernante de Lituania se proclama “Zar de toda la Rus”, protector de la fe ortodoxa. No Moscú, sino Vilna debe ser la Tercera Roma."
 lit_events.16.a: "¡Gloria al zar! ¡Gloria a la Tercera Roma!"
 lit_events.17.t: "El rey pagano"
 lit_events.17.d: "La llama eterna del žynys arde clara: “el Gran Rey Pagano” ha ascendido bajo el estandarte de la Romuva y gobierna del Báltico a la estepa."
 lit_events.17.a: "¡Gloria al rey pagano! ¡Que la llama de la Romuva arda para siempre!"
 lit_events.20.t: "La caída de la Orden Teutónica"
 lit_events.20.d: "De Grunwald al ajuste de cuentas final: la Orden Teutónica ha caído por fin. El Báltico pertenece a Lituania."
 lit_events.20.a: "¡Orden Teutónica derrotada! ¡El Báltico es nuestro!"
 lit_events.99.t: "El Gran Imperio lituano"
 lit_events.99.d: "Del Báltico al Mar Negro: el sueño de Vytautas realizado. Lituania gobierna el mayor imperio de Europa oriental, superando incluso a la antigua Rus."
 lit_events.99.a: "¡Gloria al gran imperio lituano! ¡Gloria eterna!"
 STATIC_MODIFIER_NAME_lit_amber_mod: "Dominio de la Ruta del Ámbar"
 STATIC_MODIFIER_DESC_lit_amber_mod: "El comercio del ámbar del Báltico duplica la riqueza de Lituania."
 STATIC_MODIFIER_NAME_lit_bishopric_mod: "Organización de los obispados"
 STATIC_MODIFIER_DESC_lit_bishopric_mod: "Estructura de la Iglesia católica en Lituania establecida, y la fe ha echado raíces profundas."
 STATIC_MODIFIER_NAME_lit_black_sea_mod: "Dominio del Mar Negro"
 STATIC_MODIFIER_DESC_lit_black_sea_mod: "El Mar Negro se ha convertido en el mar interior de Lituania, trayendo enorme flujo de ingresos comerciales."
 STATIC_MODIFIER_NAME_lit_catholic_king_mod: "Autoridad del rey católico"
 STATIC_MODIFIER_DESC_lit_catholic_king_mod: "Reconocida en toda Europa como rey católico, la autoridad diplomática de Lituania establecida."
 STATIC_MODIFIER_NAME_lit_catholic_mod: "Bautismo en el catolicismo"
 STATIC_MODIFIER_DESC_lit_catholic_mod: "Lituania se ha convertido al catolicismo y se ha hecho parte de la cristiandad europea."
 STATIC_MODIFIER_NAME_lit_crimea_mod: "Subyugación de Crimea"
 STATIC_MODIFIER_DESC_lit_crimea_mod: "La península de Crimea ha pasado al control lituano, abriendo la puerta al Mar Negro."
 STATIC_MODIFIER_NAME_lit_crusade_mod: "Espíritu de cruzada"
 STATIC_MODIFIER_DESC_lit_crusade_mod: "El espíritu de la cruzada católica ha forjado el ejército lituano."
 STATIC_MODIFIER_NAME_lit_dynasty_mod: "El despertar de la dinastía de los Gediminaitis"
 STATIC_MODIFIER_DESC_lit_dynasty_mod: "La sangre de los Gediminaitis aviva la ambición de conquistar Europa oriental."
 STATIC_MODIFIER_NAME_lit_grand_empire_mod: "Conclusión del Gran Imperio lituano"
 STATIC_MODIFIER_DESC_lit_grand_empire_mod: "Del Báltico al Mar Negro: el sueño del gran duque Vytautas realizado."
 STATIC_MODIFIER_NAME_lit_jagiellonian_mod: "Gobierno de la dinastía jagellónica"
 STATIC_MODIFIER_DESC_lit_jagiellonian_mod: "La dinastía jagellónica se alza como la mayor casa real de Europa central."
 STATIC_MODIFIER_NAME_lit_jogaila_mod: "La Unión de Jogaila"
 STATIC_MODIFIER_DESC_lit_jogaila_mod: "El sello de cera en la Unión de Krewo cambió por completo el respeto dado a los enviados lituanos en la corte polaca."
 STATIC_MODIFIER_NAME_lit_krakow_mod: "Prosperidad de Cracovia"
 STATIC_MODIFIER_DESC_lit_krakow_mod: "Cracovia brilla como ciudad del esplendor jagellónico."
 STATIC_MODIFIER_NAME_lit_livonia_mod: "Dominio de Livonia"
 STATIC_MODIFIER_DESC_lit_livonia_mod: "Livonia, corazón del comercio báltico, está ahora bajo el estandarte lituano."
 STATIC_MODIFIER_NAME_lit_moldavia_mod: "Subyugación de Moldavia"
 STATIC_MODIFIER_DESC_lit_moldavia_mod: "Moldavia, siendo vasalla lituana, se convierte en cabeza de puente hacia los Balcanes."
 STATIC_MODIFIER_NAME_lit_orthodox_mod: "Protección de la Iglesia ortodoxa"
 STATIC_MODIFIER_DESC_lit_orthodox_mod: "Lituania ha tomado la iglesia ortodoxa bajo su protección y es reconocida como protectora de la Rus."
 STATIC_MODIFIER_NAME_lit_orthodox_tsar_mod: "El zar ortodoxo"
 STATIC_MODIFIER_DESC_lit_orthodox_tsar_mod: "Como zar de toda la Rus, Lituania gobierna como líder del mundo ortodoxo."
 STATIC_MODIFIER_NAME_lit_orthodox_unity_mod: "Unidad de la Iglesia ortodoxa"
 STATIC_MODIFIER_DESC_lit_orthodox_unity_mod: "Las iglesias ortodoxas de toda la Rus se han reunido bajo el estandarte lituano."
 STATIC_MODIFIER_NAME_lit_pagan_empire_mod: "Hegemonía del Gran Rey Pagano"
 STATIC_MODIFIER_DESC_lit_pagan_empire_mod: "Bajo el estandarte de la Romuva, el rey pagano gobierna del Báltico a la estepa."
 STATIC_MODIFIER_NAME_lit_pagan_expansion_mod: "Expansión pagana"
 STATIC_MODIFIER_DESC_lit_pagan_expansion_mod: "Bajo el estandarte pagano, el ejército lituano arrasa los Estados vecinos."
 STATIC_MODIFIER_NAME_lit_red_ruthenia_mod: "Conquista de la Rutenia Roja"
 STATIC_MODIFIER_DESC_lit_red_ruthenia_mod: "La Rutenia Roja y Halych se han sumado al gobierno de Lituania."
 STATIC_MODIFIER_NAME_lit_romuva_mod: "Renacimiento de la Romuva"
 STATIC_MODIFIER_DESC_lit_romuva_mod: "La Romuva, antigua fe báltica, renacida, y Lituania es un Estado pagano."
 STATIC_MODIFIER_NAME_lit_rus_mod: "Señora de la Rus"
 STATIC_MODIFIER_DESC_lit_rus_mod: "Lituania se ha convertido en señora de toda la Rus y líder de Europa oriental."
 STATIC_MODIFIER_NAME_lit_ruthenia_mod: "Subyugación de la Rutenia Negra"
 STATIC_MODIFIER_DESC_lit_ruthenia_mod: "La Rutenia Negra se ha sumado al gobierno de Lituania, estableciendo la base para la expansión oriental."
 STATIC_MODIFIER_NAME_lit_sanctuary_mod: "Establecimiento del santuario de la Romuva"
 STATIC_MODIFIER_DESC_lit_sanctuary_mod: "Los bosques sagrados de Lituania establecidos, y la llama pagana arde clara."
 STATIC_MODIFIER_NAME_lit_sejm_mod: "Establecimiento del Sejm"
 STATIC_MODIFIER_DESC_lit_sejm_mod: "El Sejm establecido y moderniza el gobierno de Lituania."
 STATIC_MODIFIER_NAME_lit_smolensk_mod: "Dominio de Smolensk"
 STATIC_MODIFIER_DESC_lit_smolensk_mod: "Smolensk funciona como puerta oriental de Lituania."
 STATIC_MODIFIER_NAME_lit_steppe_mod: "Establecimiento de la frontera de la estepa"
 STATIC_MODIFIER_DESC_lit_steppe_mod: "La frontera de la estepa establecida y detiene las incursiones tártaras."
 STATIC_MODIFIER_NAME_lit_teutonic_mod: "Resistencia a la Orden Teutónica"
 STATIC_MODIFIER_DESC_lit_teutonic_mod: "La amenaza de la Orden Teutónica ha forjado el ejército lituano."
 STATIC_MODIFIER_NAME_lit_third_rome_mod: "La Tercera Roma"
 STATIC_MODIFIER_DESC_lit_third_rome_mod: "Kiev se ha convertido en la “Tercera Roma”, centro de la iglesia ortodoxa."
 STATIC_MODIFIER_NAME_lit_volhynia_mod: "Conquista de Volinia y Podolia"
 STATIC_MODIFIER_DESC_lit_volhynia_mod: "Las llanuras de la Ucrania occidental teñidas con el estandarte lituano."
 lit_vilnius_jerusalem: "La Jerusalén del Norte"
 lit_vilnius_jerusalem_desc: "Vilna: la “Jerusalén del Norte”. El arte y la población fluyen a esta ciudad, donde coexisten diversas religiones y culturas, y brilla como centro cultural de Lituania en Europa."
 STATIC_MODIFIER_NAME_lit_vilnius_jerusalem_mod: "La Jerusalén del Norte"
 STATIC_MODIFIER_DESC_lit_vilnius_jerusalem_mod: "Vilna se convierte en la “Jerusalén del Norte”: centro de diversas naciones, religiones y culturas."
 STATIC_MODIFIER_NAME_lit_teutonic_victory_mod: "Derrota de la Orden Teutónica"
 STATIC_MODIFIER_DESC_lit_teutonic_victory_mod: "El estandarte negro y cruzado de Malbork arriado, y soldados lituanos marchan hacia el oeste con canciones de victoria."
 STATIC_MODIFIER_NAME_lit_vilnius_capital_mod: "Vilna desarrollada"
 STATIC_MODIFIER_DESC_lit_vilnius_capital_mod: "Desde la Torre de Gediminas, en Vilna, los tejados y murallas de la capital imperial se extienden a perderse de vista."
 lit_memel: "Klaipėda: puerta del Báltico"
 lit_memel_desc: "Klaipėda (Memel): ciudad portuaria en la costa del Báltico. Recuperada de la Orden Teutónica, desarrolla esta ciudad como puerta de Lituania al mar y centro del comercio de ámbar."
 STATIC_MODIFIER_NAME_lit_memel_mod: "Puerto de Klaipėda desarrollado"
 STATIC_MODIFIER_DESC_lit_memel_mod: "El puerto de Klaipėda desarrollado como puerta del comercio báltico."
 STATIC_MODIFIER_NAME_lit_lublin_union_mod: "Beneficios de la Unión de Lublin"
 STATIC_MODIFIER_DESC_lit_lublin_union_mod: "Sistema parlamentario y gobierno de la república nobiliaria establecidos."
 lit_lublin_dev: "Desarrolla Lublin"
 lit_lublin_dev_desc: "Lublin: futuro lugar de la Unión de Lublin. Desarrolla esta ciudad como centro administrativo y comercial del sur de Lituania."
 lit_lviv_dev: "Desarrolla Leópolis"
 lit_lviv_dev_desc: "Leópolis: encrucijada del comercio oriental. Desarrolla el centro de Halych y sustenta la prosperidad del sudeste del reino."
 lit_kaunas_dev: "Kaunas: guardiana del derecho lituano"
 lit_kaunas_dev_desc: "Kaunas —situada en la confluencia del Nemunas y el Neris—, esta ciudad sirvió de sede del Tribunal Principal del Gran Ducado de Lituania (Lietuvos Vyriausiasis Tribunolas) y funcionó como instancia suprema de apelación para el lado lituano de la república nobiliaria. Como la corte real de Cracovia, en Polonia, o el Parlamento de Aix, en Provenza, Kaunas sirvió de guardiana del derecho regional, uniendo la legislación central con la costumbre local. Desarrolla Kaunas como centro de la administración jurídica lituana."
 lit_hrodna_dev: "Desarrolla Grodno"
 lit_hrodna_dev_desc: "Grodno (Hrodna): centro de la Rutenia Negra. Desarrolla esta importante ciudad occidental del Gran Ducado."
 lit_minsk_dev: "Desarrolla Minsk"
 lit_minsk_dev_desc: "Minsk: centro de Bielorrusia. Desarróllala como nudo administrativo oriental del imperio lituano."
 STATIC_MODIFIER_NAME_lit_commonwealth_final_mod: "República nobiliaria concluida"
 STATIC_MODIFIER_DESC_lit_commonwealth_final_mod: "La república nobiliaria polaco-lituana concluida: gobierno y ejército organizados en todas las provincias."
 STATIC_MODIFIER_NAME_lit_lublin_mod: "Lublin prospera"
 STATIC_MODIFIER_DESC_lit_lublin_mod: "Lublin desarrollada como centro administrativo y comercial del sur de Lituania."
 STATIC_MODIFIER_NAME_lit_lviv_mod: "Leópolis prospera"
 STATIC_MODIFIER_DESC_lit_lviv_mod: "Leópolis prospera como encrucijada del comercio oriental."
 STATIC_MODIFIER_NAME_lit_kaunas_mod: "Tribunal Principal del Gran Ducado de Lituania"
 STATIC_MODIFIER_DESC_lit_kaunas_mod: "Kaunas desarrollada como nudo interno del comercio báltico."
 STATIC_MODIFIER_NAME_lit_hrodna_mod: "Refuerzo administrativo de Grodno"
 STATIC_MODIFIER_DESC_lit_hrodna_mod: "De las puertas de Grodno, los caballos de los mensajeros galopan de la mañana a la noche rumbo a la capital, Vilna."
 STATIC_MODIFIER_NAME_lit_minsk_mod: "Minsk prospera"
 STATIC_MODIFIER_DESC_lit_minsk_mod: "Minsk desarrollada como nudo administrativo oriental del imperio lituano."
