 nov_events.1.t: "Nóvgorod la Grande: la gran república"
 nov_events.1.d: "En 1337, la República de Nóvgorod la Grande es la mayor ciudad-Estado comercial de la Rus.\n\nEsta ciudad, que se extiende por ambas orillas del Vóljov, se divide en el “Lado de Santa Sofía”, en la orilla occidental, y el “Lado Comercial”, en la orilla oriental. En su centro se alza el símbolo de Nóvgorod, la Catedral de Santa Sofía.\n\nEl veche (asamblea popular) funciona como órgano decisorio supremo, mientras el posadnik (alcalde), el tysiatsky (comandante de la milicia) y el arzobispo se ocupan de la administración.\n\n“Nóvgorod pertenece solo a Nóvgorod”: ni un príncipe ni un emperador, sino la voluntad de los ciudadanos dirige esta república.\n\nAquí se fundó el kontor hanseático, y el comercio prospera con Lübeck, Brujas, Londres y Bergen. Pieles, cera, lino y pescado son suministrados por Nóvgorod a Europa occidental.\n\nPero Moscú crece sin cesar en fuerza, Lituania presiona desde el oeste, y los tártaros acechan desde el este. Nóvgorod ha sobrevivido aprovechando este equilibrio multicapa de fuerzas. Ahora, usa esta sabiduría y esta fuerza mercantil para buscar el dominio de la Rus."
 nov_events.1.a: "¡Defender la libertad y la prosperidad de Nóvgorod!"
