l_spanish:
 nov_novgorod_mission_pack: "La gloria de Nóvgorod: de república mercantil a señora de la Rus"
 nov_novgorod_mission_pack_DESCRIPTION:0 "En 1337, la República de Nóvgorod la Grande es la mayor potencia comercial de la Rus. El veche (asamblea popular) dirige la política, y el comercio con la Hansa trae riqueza. Pero Moscú crece sin cesar en fuerza, y la amenaza tártara pesa desde el este. Comercio de pieles, dominio del Báltico, derrota de Moscú: gobierna como Gran Príncipe de toda la Rus."
 nov_novgorod_mission_pack_CRITERIA_DESCRIPTION:0 "Construye un imperio comercial, derrota a Moscú para unir la Rus, domina el Báltico y Siberia y gobierna como Gran Príncipe de la Rus."
 nov_novgorod_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para convertirte en Gran Príncipe de la Rus."
 nov_novgorod_mission_pack_BUTTON_DETAILS:0 "¡De la república mercantil de Nóvgorod a la fundación del Imperio ruso!"
 nov_veche_republic: "La República del Veche"
 nov_veche_republic_desc: "El veche de Nóvgorod: singular institución democrática, de la que participan por igual burgueses, nobles y mercaderes. “Nóvgorod pertenece solo a Nóvgorod”: es la voluntad de los ciudadanos, y no la del príncipe, la que dirige este Estado y lo distingue de todos los demás principados rusos. Refuerza la tradición del veche y firma los cimientos de la república mercantil."
 nov_dev_novgorod: "Desarrolla Nóvgorod la Grande"
 nov_dev_novgorod_desc: "“Señor Nóvgorod la Grande”, a orillas del Vóljov, es la mayor ciudad comercial de la Rus medieval. Mercaderes hanseáticos, bizantinos y musulmanes orientales acuden aquí, comerciando pieles, cera, lino y pescado. El “Patio” (puesto comercial) de Nóvgorod tiene sucursales en Lübeck, Brujas, Londres y Bergen."
 nov_birch_bark: "Las cartas de corteza de abedul"
 nov_birch_bark_desc: "Los novgorodianos tenían la costumbre de escribir en corteza de abedul: prueba de la más letrada ciudad medieval del mundo. Usa esta tradición de alfabetización para desarrollar el saber, el gobierno y los registros comerciales."
 nov_hanseatic_league: "Comercio hanseático"
 nov_hanseatic_league_desc: "Nóvgorod, una de las mayores ciudades comerciales de Europa septentrional, está profundamente entrelazada en la red de la Hansa. Refuerza las rutas comerciales que llevan a Lübeck, Hamburgo y Brujas."
 nov_fur_trade: "Comercio de pieles"
 nov_fur_trade_desc: "La mayor mercancía comercial de Nóvgorod son las pieles: pieles de ardilla, cebellina, castor y visón, obtenidas en los bosques siberianos y vendidas a la nobleza de Europa occidental. El comercio de pieles, llamado “oro del Norte”, es la fuente de la riqueza de Nóvgorod."
 nov_dev_pskov: "Desarrolla Pskov"
 nov_dev_pskov_desc: "La tercamente independiente Pskov —“hermana menor” de Nóvgorod— se convierte en la segunda capital mercantil y cultural. Desarrolla esta ciudad, con las murallas del Kremlin de Pskov y la Catedral de la Santísima Trinidad."
 nov_trade_empire: "El imperio comercial"
 nov_trade_empire_desc: "Pieles, cera, sal, pescado: la red comercial de Nóvgorod abarca Europa septentrional. Los gremios mercantiles gobiernan el Estado, y se erigen puestos comerciales por doquier. La fama de “Venecia del Norte” se extiende por todo el mundo."
 nov_dev_staraya_russa: "Desarrolla Staraya Rusa"
 nov_dev_staraya_russa_desc: "Staraya Rusa, cuyo nombre significa “Vieja Rusa”, es famosa por la extracción de sal. Desarrolla la salinería de esta antigua ciudad para sustentar el abastecimiento de alimentos y el comercio de Nóvgorod."
 nov_secure_novgorod_region: "Asegura la tierra de Nóvgorod"
 nov_secure_novgorod_region_desc: "La patria de Nóvgorod: el pleno dominio de las regiones de Nóvgorod occidental y oriental establece la base para la expansión."
 nov_conquer_tver: "Conquista Tver"
 nov_conquer_tver_desc: "El Principado de Tver, antaño rival de Moscú por la supremacía: su poder se ha extinguido ahora. Conquista esta importante ciudad a orillas del Volga y abre el camino hacia el sur."
 nov_conquer_yaroslavl: "Conquista Yaroslavl"
 nov_conquer_yaroslavl_desc: "Yaroslavl, ciudad del “Anillo de Oro” a orillas del Volga: conquista esta ciudad mercantil y toma la ruta comercial del norte."
 nov_conquer_moscow: "Conquista Moscú"
 nov_conquer_moscow_desc: "Desde Iván I (Kalitá), Moscú se ha expandido sin cesar con apoyo tártaro. “Moscú o guerra”: derrota a la mayor amenaza de Nóvgorod y conquista el liderazgo de la Rus."
 nov_conquer_suzdal: "Conquista Súzdal y Vladímir"
 nov_conquer_suzdal_desc: "Súzdal y Vladímir son ciudades antiguas, antaño florecientes como herederas de la Rus de Kiev. Conquista estas ciudades, con muchas iglesias de cúpulas doradas, y hereda la legitimidad de la antigua Rus."
 nov_defeat_muscovy: "Destruye Moscú"
 nov_defeat_muscovy_desc: "El Gran Principado de Moscú destruido, y el liderazgo de la Rus pasa a Nóvgorod. Las ambiciones de la dinastía Rúrik aplastadas: la república del veche decidirá el destino del futuro de la Rus."
 nov_conquer_smolensk: "Conquista Smolensk"
 nov_conquer_smolensk_desc: "Smolensk, llamada “llave de la Rus”: dominar este nudo de comunicación este-oeste establece influencia occidental."
 nov_conquer_ryazan: "Conquista Riazán"
 nov_conquer_ryazan_desc: "El Principado de Riazán, el primero devastado por el ejército mongol en 1237: conquista sus tierras meridionales de estepa y erige una línea de defensa contra los tártaros."
 nov_form_russia: "Forma la Rus"
 nov_form_russia_desc: "El Estado unificado de la Rus, con centro en Nóvgorod, cobra forma: no Moscú, sino Nóvgorod ha unificado la Rus. ¿Qué forma tomará esta nueva Rusia, nacida de este giro histórico?"
 nov_vologda_trade: "Comercio de Vólogda"
 nov_vologda_trade_desc: "Dominar Vólogda y Beloozero —puntos clave de la ruta comercial del norte— establece acceso al Mar Blanco y a la ruta del comercio de pieles."
 nov_found_arkhangelsk: "Funda Arcángel"
 nov_found_arkhangelsk_desc: "Erige la ciudad portuaria de Arcángel en las orillas del Mar Blanco: aunque se hiela en invierno, este puerto posibilita el comercio directo con Europa septentrional y Gran Bretaña. En las eras venideras, mercaderes ingleses vendrán a la Rus por aquí."
 nov_white_sea_trade: "Domina el comercio del Mar Blanco"
 nov_white_sea_trade_desc: "Domina la ruta comercial del Mar Blanco y establece el comercio directo con Europa septentrional. Arcángel se desarrolla como centro del comercio del norte."
 nov_conquer_perm: "Conquista Perm"
 nov_conquer_perm_desc: "La región de Perm, en el alto Kama, es productora de las “pieles de Kama”, las más finas. La conquista de este lugar establece el monopolio de las pieles."
 nov_kola_fortress: "La fortaleza de Kola"
 nov_kola_fortress_desc: "El extremo norte de la Península de Kola: toma el puerto libre de hielo de la Bahía de Múrmansk y establece una cabeza de puente para la ruta marítima del norte."
 nov_siberian_frontier: "La frontera siberiana"
 nov_siberian_frontier_desc: "Cruza los Montes Urales hacia Siberia: el camino “más allá de la tierra”, de recursos de pieles sin límites, abierto. Avanza sobre Siberia antes de la conquista de Yermak."
 nov_fur_monopoly: "Monopolio del comercio de pieles"
 nov_fur_monopoly_desc: "De Perm a Siberia: todas las rutas del comercio de pieles pasan al control de Nóvgorod. Monopoliza el suministro de las pieles de lujo deseadas por reyes y nobles europeos y obtén enorme riqueza."
 nov_secure_karelia: "Asegura Carelia"
 nov_secure_karelia_desc: "Toma la región de Carelia, en la orilla norte del Golfo de Finlandia, para asegurar acceso al Báltico: importante punto estratégico que establece la frontera con Suecia."
 nov_conquer_viborg: "Conquista Víborg"
 nov_conquer_viborg_desc: "La fortaleza de Víborg, construida por los suecos: asaltar este punto clave del Golfo de Finlandia abre la puerta al Báltico."
 nov_baltic_fleet: "La flota báltica"
 nov_baltic_fleet_desc: "Construye la Flota Báltica de Nóvgorod: el poder naval es indispensable para dominar el comercio del norte de Europa."
 nov_conquer_riga: "Conquista Riga"
 nov_conquer_riga_desc: "Riga, en la desembocadura del Dvina: la conquista de esta importante ciudad hanseática conquista el liderazgo en el comercio báltico. Con el espíritu de “Gdansk o guerra”, toma también Riga."
 nov_livonia: "Subyuga Livonia"
 nov_livonia_desc: "La costa este del Báltico, gobernada por la Orden de los Hermanos de la Espada: subyugar esta región establece acceso a las tierras bálticas."
 nov_neva_ports: "Puertos del Neva"
 nov_neva_ports_desc: "Desarrolla una ciudad portuaria en el Neva: este lugar, donde Pedro el Grande construirá más tarde “Petersburgo”, se convierte en la puerta al Báltico."
 nov_orthodox_archbishop: "El arzobispado ortodoxo"
 nov_orthodox_archbishop_desc: "El arzobispo de Nóvgorod detenta autoridad independiente de Moscú y Constantinopla: la autonomía religiosa sustenta la autosuficiencia de Nóvgorod. Refuerza la tradición ortodoxa de Nóvgorod con su Catedral de Santa Sofía."
 nov_cathedral_cities: "Ciudades de catedrales"
 nov_cathedral_cities_desc: "Erige catedrales en todas las ciudades de Nóvgorod: realiza el ideal de la “Santa Rusia” y cubre toda la tierra con el brillo de la fe ortodoxa."
 nov_guardian_of_orthodoxy: "Guardiana de la ortodoxia"
 nov_guardian_of_orthodoxy_desc: "Con la caída de Constantinopla ante los otomanos, la misión de guardiana de la ortodoxia pasa a Nóvgorod. Conquista el título de “Tercera Roma”: que no Moscú, sino Nóvgorod lo ostente."
 nov_novgorod_chronicle: "La Crónica de Nóvgorod"
 nov_novgorod_chronicle_desc: "La Crónica de Nóvgorod (Novgorodskaya Letopis): esta obra histórica, que registra meticulosamente los acontecimientos de cada año, lleva el legado espiritual de Nóvgorod a las generaciones venideras."
 nov_dev_torzhok: "Desarrolla Torzhok"
 nov_dev_torzhok_desc: "Torzhok, situada entre Nóvgorod y Moscú: desarróllala como nudo comercial y domina la ruta comercial del sur."
 nov_kazan_subjugation: "Subyuga Kazán"
 nov_kazan_subjugation_desc: "El Kanato de Kazán: subyugar este Estado sucesor tártaro, que domina el Volga medio, abre el camino hacia el este."
 nov_ushkuiniks: "Los ushkuiniks"
 nov_ushkuiniks_desc: "Los ushkuiniks: grupo mixto de piratas fluviales, pioneros y soldados de Nóvgorod. Incorpora a estos hombres rudos, que descienden el Volga y atacan barcos mercantes tártaros, al ejército regular de Nóvgorod y entrénalos como tropas de élite."
 nov_dev_suzdal: "Desarrolla Súzdal"
 nov_dev_suzdal_desc: "Súzdal, del “Anillo de Oro”: desarrolla esta antigua ciudad, con muchas iglesias y monasterios medievales, como centro cultural y religioso."
 nov_conquer_beloozero: "Conquista Beloozero"
 nov_conquer_beloozero_desc: "La región de Beloozero (Lago Blanco), rica en pieles y pescado: toma esta tierra y asegura la ruta comercial del norte."
 nov_dev_kholmogory: "Desarrolla Kholmogori"
 nov_dev_kholmogory_desc: "Kholmogori, en el Dvina: desarrolla esta ciudad portuaria como puerta del Mar Blanco y sienta la base de la futura prosperidad de Arcángel."
 nov_conquer_vladimir: "Conquista Vladímir"
 nov_conquer_vladimir_desc: "Antaño capital del Gran Principado de Vladímir: esta antigua ciudad, con muchas construcciones religiosas, incluida la Catedral de San Demetrio, cae ante Nóvgorod."
 nov_tatar_wars: "Guerras contra los tártaros"
 nov_tatar_wars_desc: "Nóvgorod fue la única gran ciudad de la Rus que no se sometió al yugo tártaro: lleva ahora este orgullo con la espada en la lucha contra los tártaros. Con el espíritu de las orillas del Neva, derrota a los jinetes de la estepa."
 nov_golden_horde: "Contraataque a la Horda de Oro"
 nov_golden_horde_desc: "Alza el estandarte de Nóvgorod en tierra de la Horda de Oro (Kanato Kipchak): quien libere la Rus del dominio mongol es el verdadero señor de la Rus."
 nov_nizhny_novgorod: "Conquista Nizhni Nóvgorod"
 nov_nizhny_novgorod_desc: "“Nizhni Nóvgorod”: subyuga esta ciudad comercial en la confluencia del Volga y el Oká y conquista el comercio del Volga medio."
 nov_orthodox_mission: "La misión ortodoxa"
 nov_orthodox_mission_desc: "Difunde la fe ortodoxa entre los paganos del norte y del este: la actividad misionera entre los pueblos fineses, los pueblos nativos siberianos y los tártaros multiplica la legitimidad de Nóvgorod."
 nov_hanseatic_kontors: "Kontors hanseáticos"
 nov_hanseatic_kontors_desc: "Erige los puestos comerciales de Nóvgorod (kontors) en las más importantes ciudades hanseáticas —Nóvgorod, Riga, Lübeck— y domina directamente la red comercial del norte de Europa."
 nov_ostrog_system: "El sistema de ostrogs"
 nov_ostrog_system_desc: "Construye una red de fortalezas (ostrogs) para sustentar el avance sobre Siberia: cabezas de puente para la conquista de Siberia, que llevan a Tiumén, Tobolsk e Irkutsk."
 nov_dev_ryazan: "Desarrolla Riazán"
 nov_dev_ryazan_desc: "Riazán, destruida por los mongoles: la nueva ciudad de Riazán fue erigida sobre sus ruinas. Desarrolla esta importante ciudad meridional como cabeza de puente hacia la estepa."
 nov_estonian_coast: "La costa estonia"
 nov_estonian_coast_desc: "Subyugar la costa estonia completa el control de la orilla sur del Báltico. Toma la ciudad comercial hanseática de Reval (Tallin)."
 nov_conquer_teutonic: "Aplasta a la Orden Teutónica"
 nov_conquer_teutonic_desc: "El legado de las cruzadas bálticas llega a su fin: la derrota de la Orden Teutónica pone la costa sudeste del Báltico por completo bajo control de Nóvgorod."
 nov_moscow_capital: "Desarrolla Moscú"
 nov_moscow_capital_desc: "Desarrolla la conquistada Moscú como importante ciudad bajo el gobierno de Nóvgorod: transforma el antiguo palacio del gran príncipe moscovita en residencia del gobernador de Nóvgorod, símbolo del poder."
 nov_iron_ring: "El Anillo de Hierro"
 nov_iron_ring_desc: "Un anillo de fortalezas que protege Nóvgorod: una red defensiva que une Pskov, Nóvgorod, Ládoga y Tver, concluida. Un sistema defensivo de hierro, capaz de repeler invasiones desde cualquier dirección."
 nov_kholmogory_trade: "Comercio de Kholmogori"
 nov_kholmogory_trade_desc: "Del nudo comercial de Kholmogori, en el Dvina, al Mar Blanco: toma esta ruta comercial del norte antes de la Compañía de Moscovia inglesa."
 nov_eastern_orthodoxy: "La Iglesia de Oriente establecida"
 nov_eastern_orthodoxy_desc: "Tras la caída de Constantinopla, Nóvgorod se alza como centro de la Iglesia de Oriente. La Catedral de Santa Sofía brilla como heredera de Santa Sofía de Constantinopla."
 nov_amber_road: "La Ruta del Ámbar"
 nov_amber_road_desc: "La ruta comercial del ámbar, que sigue del Báltico hacia el sur: el ámbar del Báltico, las pieles de Nóvgorod y la seda oriental se cruzan en esta ruta, ahora controlada por Nóvgorod."
 nov_great_novgorod: "Nóvgorod la Grande concluida"
 nov_great_novgorod_desc: "Imperio comercial, poder militar, autoridad ortodoxa: tres pilares concluidos, y Nóvgorod se convierte en un Estado digno del título de “Grande”. Da el último paso hacia “Gran Príncipe de la Rus”."
 nov_ruler_of_rus: "Gran Príncipe de la Rus"
 nov_ruler_of_rus_desc: "“Gran Príncipe de Nóvgorod y de toda la Rus”: este título resonó sobre la plaza del veche de Nóvgorod. Del Báltico a Siberia, del Mar Blanco a las estepas del sur, el estandarte de Nóvgorod ondea sobre toda la Rus. La república mercantil ha erigido uno de los mayores imperios del mundo. Historia reescrita: Nóvgorod decide el futuro de la Rus."
 nov_events.10.t: "Moscú ha caído: el liderazgo de la Rus pasa a Nóvgorod"
 nov_events.10.d: "El Kremlin de Moscú ha caído en manos novgorodianas. Las ambiciones de la despreciada como “perros tártaros” familia gran-principesca de Moscú, aplastadas. Como el futuro de la Rus es ahora decidido por la república del veche de Nóvgorod, esta victoria no es una mera conquista territorial: es un punto de inflexión que cambia radicalmente la historia rusa."
 nov_events.10.a: "¡Moscú ha caído! ¡Comienza la era de Nóvgorod!"
 nov_events.20.t: "Formación de la Rus: un nuevo Estado en torno a Nóvgorod"
 nov_events.20.d: "El Estado unificado de la Rus, con centro en Nóvgorod, ha nacido. ¿Cómo se llamará? ¿Proclamar el “Gran Principado de la Rus”, para anunciar un nuevo comienzo, o conservar con orgullo el nombre “Nóvgorod”?"
 nov_events.20.a: "Proclamar el “Gran Principado de la Rus”: nace la nueva Rusia"
 nov_events.20.b: "Conservar con orgullo el nombre “Nóvgorod”"
 nov_events.99.t: "Gran Príncipe de la Rus: Nóvgorod gobierna Rusia"
 nov_events.99.d: "“Gran Príncipe de Nóvgorod y de toda la Rus”: este título resonó sobre la plaza del veche de Nóvgorod. Del Báltico a Siberia, del Mar Blanco a la estepa, el estandarte de Nóvgorod ondea sobre toda la Rus. La república mercantil ha erigido uno de los mayores imperios de la historia. Historia reescrita."
 nov_events.99.a: "¡Viva el Gran Príncipe de la Rus! ¡Nóvgorod para siempre!"
 STATIC_MODIFIER_NAME_nov_novgorod_city_mod: "Prosperidad de Nóvgorod la Grande"
 STATIC_MODIFIER_DESC_nov_novgorod_city_mod: "Como nudo hanseático, Nóvgorod la Grande desarrollada, y el comercio prospera."
 STATIC_MODIFIER_NAME_nov_literacy_mod: "La tradición del abedul"
 STATIC_MODIFIER_DESC_nov_literacy_mod: "La tradición de alfabetización sustenta la ventaja espiritual y mercantil de Nóvgorod."
 STATIC_MODIFIER_NAME_nov_hansa_mod: "Comercio hanseático"
 STATIC_MODIFIER_DESC_nov_hansa_mod: "Asociación establecida con la mayor red comercial de Europa septentrional."
 STATIC_MODIFIER_NAME_nov_fur_mod: "Comercio de pieles"
 STATIC_MODIFIER_DESC_nov_fur_mod: "Las pieles del norte suministradas por Nóvgorod a Europa occidental."
 STATIC_MODIFIER_NAME_nov_pskov_mod: "El ascenso de Pskov"
 STATIC_MODIFIER_DESC_nov_pskov_mod: "Pskov se desarrolla como segunda capital mercantil de Nóvgorod."
 STATIC_MODIFIER_NAME_nov_trade_empire_mod: "El imperio comercial"
 STATIC_MODIFIER_DESC_nov_trade_empire_mod: "La red comercial de Nóvgorod abarca Europa septentrional."
 STATIC_MODIFIER_NAME_nov_russa_mod: "La sal de Staraya Rusa"
 STATIC_MODIFIER_DESC_nov_russa_mod: "El centro de salinería Staraya Rusa desarrollado."
 STATIC_MODIFIER_NAME_nov_novgorod_secured_mod: "Tierra de Nóvgorod asegurada"
 STATIC_MODIFIER_DESC_nov_novgorod_secured_mod: "La patria de Nóvgorod totalmente subyugada: base de la expansión establecida."
 STATIC_MODIFIER_NAME_nov_tver_mod: "Tver conquistada"
 STATIC_MODIFIER_DESC_nov_tver_mod: "Tver, en el alto Volga, conquistada: ruta meridional abierta."
 STATIC_MODIFIER_NAME_nov_yaroslavl_mod: "Yaroslavl prospera"
 STATIC_MODIFIER_DESC_nov_yaroslavl_mod: "La ciudad mercantil del Volga, Yaroslavl, cae ante Nóvgorod."
 STATIC_MODIFIER_NAME_nov_suzdal_mod: "Súzdal-Vladímir"
 STATIC_MODIFIER_DESC_nov_suzdal_mod: "El antiguo corazón de la Rus, Súzdal y Vladímir, incorporado."
 STATIC_MODIFIER_NAME_nov_defeat_muscovy_mod: "Moscú derrotada"
 STATIC_MODIFIER_DESC_nov_defeat_muscovy_mod: "Los clientes tártaros de Moscú destruidos: el liderazgo de la Rus pasa a Nóvgorod."
 STATIC_MODIFIER_NAME_nov_smolensk_mod: "Smolensk subyugada"
 STATIC_MODIFIER_DESC_nov_smolensk_mod: "La llave de la Rus, Smolensk, tomada: influencia occidental establecida."
 STATIC_MODIFIER_NAME_nov_ryazan_mod: "Riazán conquistada"
 STATIC_MODIFIER_DESC_nov_ryazan_mod: "La puerta de la estepa Riazán pasa al control de Nóvgorod."
 STATIC_MODIFIER_NAME_nov_vologda_mod: "Comercio de Vólogda"
 STATIC_MODIFIER_DESC_nov_vologda_mod: "El nudo comercial del norte, Vólogda, tomado: camino al Mar Blanco abierto."
 STATIC_MODIFIER_NAME_nov_arkhangelsk_mod: "Arcángel"
 STATIC_MODIFIER_DESC_nov_arkhangelsk_mod: "El puerto del Mar Blanco, Arcángel, posibilita el comercio directo con Europa septentrional."
 STATIC_MODIFIER_NAME_nov_white_sea_mod: "Comercio del Mar Blanco"
 STATIC_MODIFIER_DESC_nov_white_sea_mod: "La ruta comercial del Mar Blanco subyugada: comercio del norte de Nóvgorod concluido."
 STATIC_MODIFIER_NAME_nov_perm_mod: "Perm conquistada"
 STATIC_MODIFIER_DESC_nov_perm_mod: "El centro de pieles del Kama, Perm, conquistado: base del monopolio de pieles establecida."
 STATIC_MODIFIER_NAME_nov_kola_mod: "La fortaleza de Kola"
 STATIC_MODIFIER_DESC_nov_kola_mod: "La Península ártica de Kola ocupada: cabeza de puente para la ruta marítima del norte establecida."
 STATIC_MODIFIER_NAME_nov_siberia_mod: "La frontera siberiana"
 STATIC_MODIFIER_DESC_nov_siberia_mod: "El camino a través de los Urales hacia Siberia abierto."
 STATIC_MODIFIER_NAME_nov_fur_monopoly_mod: "Monopolio del comercio de pieles"
 STATIC_MODIFIER_DESC_nov_fur_monopoly_mod: "Todas las rutas del comercio de pieles del norte pasan al control exclusivo de Nóvgorod."
 STATIC_MODIFIER_NAME_nov_karelia_mod: "Carelia asegurada"
 STATIC_MODIFIER_DESC_nov_karelia_mod: "Acceso al Báltico asegurado mediante el dominio de Carelia."
 STATIC_MODIFIER_NAME_nov_viborg_mod: "Víborg conquistada"
 STATIC_MODIFIER_DESC_nov_viborg_mod: "La puerta báltica Víborg tomada por asalto."
 STATIC_MODIFIER_NAME_nov_baltic_fleet_mod: "La flota báltica"
 STATIC_MODIFIER_DESC_nov_baltic_fleet_mod: "La flota báltica de Nóvgorod protege el comercio marítimo del norte."
 STATIC_MODIFIER_NAME_nov_riga_mod: "Riga conquistada"
 STATIC_MODIFIER_DESC_nov_riga_mod: "El nudo hanseático Riga pasa al control de Nóvgorod."
 STATIC_MODIFIER_NAME_nov_livonia_mod: "Livonia subyugada"
 STATIC_MODIFIER_DESC_nov_livonia_mod: "La costa este del Báltico de Livonia subyugada: tierras bálticas al alcance."
