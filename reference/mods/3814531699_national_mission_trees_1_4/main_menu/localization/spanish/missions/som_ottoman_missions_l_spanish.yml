l_spanish:
 som_ottoman_mission_pack_desc: "De beylicato de frontera al más poderoso sultanato del mundo. Une Anatolia, avanza hasta Rumelia y reivindica Constantinopla: la ciudad eterna que será tu trono."
 som_tur_secure_bursa: "Asegura Bursa"
 som_tur_secure_bursa_desc: "Bursa, la primera gran ciudad de los otomanos, debe estar firmemente bajo el control de la dinastía. Establece el orden y construye la base de un Estado duradero."
 som_tur_frontier_warriors: "Forja a los guerreros de la frontera"
 som_tur_frontier_warriors_desc: "Los guerreros gazis que forjaron nuestro beylicato deben ser ligados a la dinastía. Su espíritu de lucha es nuestra mayor arma."
 som_tur_cross_the_straits: "Cruza los estrechos"
 som_tur_cross_the_straits_desc: "Asegura Çanakkale y abre el camino hacia Europa. Como recompensa, se concederá un casus belli para conquistar la provincia de Galípoli."
 som_tur_anatolian_heartland: "Une Anatolia"
 som_tur_anatolian_heartland_desc: "Asegura Ankara y define la dirección de su desarrollo como corazón de Anatolia. Lo que esta tierra produzca decidirá el futuro del Imperio."
 som_ottoman_events.18.t: "El corazón de Anatolia: el futuro de Ankara"
 som_ottoman_events.18.d: "Ankara, la ciudad central de Anatolia, ha caído bajo control del Imperio. La corte debate qué rama de la industria debe definir el futuro de la región: perfeccionar su larga tradición de tejeduría, plantar moreras para la sericultura o fomentar el cultivo de plantas tintóreas de colores vivos."
 som_ottoman_events.18.a: "Continuar el desarrollo de la industria de la tejeduría"
 som_ottoman_events.18.b: "Plantar moreras e iniciar la producción de seda"
 som_ottoman_events.18.c: "Fomentar el cultivo de plantas tintóreas"
 som_tur_vassalize_beyliks: "Subyugación de los beylicatos"
 som_tur_vassalize_beyliks_desc: "Los demás beylicatos anatolios deben rendir tributo o ser aplastados. Solo una Anatolia unida puede desafiar a las potencias del este y del oeste."
 som_tur_siege_constantinople: "La caída de Constantinopla"
 som_tur_siege_constantinople_desc: "La ciudad eterna, sede del Imperio romano de Oriente, debe caer ante el cañón y el acero otomanos. Su conquista anunciará nuestro imperio al mundo. La población de la ciudad será transformada bajo el gobierno otomano."
 STATIC_MODIFIER_NAME_som_tur_ghazi_warriors: "Guerreros gazis"
 STATIC_MODIFIER_DESC_som_tur_ghazi_warriors: "“Gazi”: título de quien lucha contra los infieles en nombre del islam. Desde Osmán Gazi, fundador de la dinastía, los guerreros de frontera avanzaron sin cesar por las fronteras debilitadas de Bizancio con este sagrado sentido de misión. Este celo religioso fue el motor espiritual de la expansión otomana."
 som_ottoman_events.1.t: "Bursa, cuna de los otomanos"
 som_ottoman_events.1.d: "Bursa, Iznik y Nicomedia han caído en manos otomanas. En Bursa, comunidades griegas ortodoxas, armenias, judías y turcas musulmanas viven codo con codo bajo la nueva dinastía. La corte del sultán se enfrenta ahora a la cuestión: ¿cómo incorporar a estos diversos pueblos al Estado otomano?"
 som_ottoman_events.1.a: "Unirlos bajo la bandera del islam y de la tradición turca"
 som_ottoman_events.1.a.tt: "Muchos habitantes de Bursa se convertirán al sunismo y adoptarán la cultura turca."
 som_ottoman_events.4.t: "La caída de Constantinopla"
 som_ottoman_events.4.d: "Constantinopla ha caído. El último emperador de Bizancio, Constantino XI, cayó luchando en las murallas, y las tropas de Mehmed II entraron en la ciudad. Donde antes doblaban las campanas de Santa Sofía, resuena ahora la llamada a la oración. El sultán rebautiza la ciudad como Kostantiniyye y la proclama nueva capital imperial."
 som_ottoman_events.4.a: "Transformar la ciudad en la capital otomana"
 som_ottoman_events.4.a.tt: "La mayoría de los habitantes de Constantinopla se convertirá al sunismo y adoptará la cultura turca."
 som_tur_conquer_bulgaria: "Conquista Bulgaria"
 som_tur_conquer_bulgaria_desc: "Tarnovo fue la gloriosa capital del Segundo Imperio búlgaro. Toma esta ciudad y abre el camino hacia el norte."
 som_tur_conquer_serbia: "Conquista Serbia"
 som_tur_conquer_serbia_desc: "Novo Brdo contiene las mayores minas de plata de los Balcanes, mientras que Escopia es la puerta de Macedonia. Asegura ambas ciudades para traer la Serbia meridional al control otomano."
 som_tur_conquer_hungary: "Invade Hungría"
 som_tur_conquer_hungary_desc: "Derrota al ejército de campaña húngaro en Mohács y toma Buda. El Danubio se convertirá en la frontera norte del Imperio otomano."
 som_tur_siege_vienna: "El asedio de Viena"
 som_tur_siege_vienna_desc: "Alza el estandarte otomano ante las murallas de Viena. El mundo será testigo del poder del Imperio otomano."
 som_tur_anatolia_unified: "Unidad de Anatolia"
 som_tur_anatolia_unified_desc: "Conquista Trebisonda y Erzurum para traer toda Anatolia al dominio otomano. Los Montes Pónticos marcarán la frontera oriental del imperio."
 som_tur_conquer_syria: "A Siria"
 som_tur_conquer_syria_desc: "Conquista Alepo y Damasco. Siria es el corazón del saber y del comercio islámicos; su toma eleva el prestigio del imperio."
 som_tur_defeat_mamluks: "Derrota a los mamelucos"
 som_tur_defeat_mamluks_desc: "Durante la guerra contra los mamelucos, toma El Cairo para imponer una paz favorable. Con El Cairo ocupado, los mamelucos pueden ser forzados a aceptar el vasallaje."
 som_tur_holy_cities: "Las ciudades santas"
 som_tur_holy_cities_desc: "Asegura Jerusalén y proclama al sultán califa. Como guardián de las dos ciudades santas, los otomanos están en lo más alto del mundo islámico."
 som_tur_red_sea_dominance: "Dominio del Mar Rojo"
 som_tur_red_sea_dominance_desc: "Asegura Alejandría y domina las rutas comerciales del Mar Rojo. La riqueza del comercio del Océano Índico llena el tesoro otomano."
 som_tur_age_of_suleiman: "Pax Otomana"
 STATIC_MODIFIER_NAME_som_tur_danube_frontier: "La frontera del Danubio"
 STATIC_MODIFIER_DESC_som_tur_danube_frontier: "El Danubio establecido como frontera norte, y las lecciones del ejército otomano ante las puertas de Viena inscritas en la doctrina imperial."
 STATIC_MODIFIER_NAME_som_tur_anatolia_unified_mod: "Anatolia unificada"
 STATIC_MODIFIER_DESC_som_tur_anatolia_unified_mod: "De Trebisonda a Erzurum, toda Anatolia bajo control otomano. La base oriental del imperio asegurada, mejorando la recaudación fiscal y la legitimidad."
 STATIC_MODIFIER_NAME_som_tur_red_sea_trade: "Red viaria imperial"
 STATIC_MODIFIER_DESC_som_tur_red_sea_trade: "El Mar Rojo fue la ruta dorada por la que las especias, sedas y tintes de la India y del Sudeste Asiático llegaban a Europa. Aun después de que Portugal abriera una nueva ruta alrededor del extremo sur de África, la ruta del Mar Rojo por El Cairo y Alejandría conservó su valor, y el Imperio otomano se convirtió en el mayor beneficiario de esta ruta comercial."
 som_tur_fate_of_crimea: "El destino de Crimea"
 som_tur_fate_of_crimea_desc: "La península de Crimea, con el enclave comercial genovés de Caffa en su corazón, controla el comercio a lo largo del norte del Mar Negro. Asegura esta región y trae el comercio del Mar Negro al control otomano."
 som_tur_black_sea_dominance: "Dominio del Mar Negro"
 som_tur_black_sea_dominance_desc: "Con Crimea asegurada, Edirne fortificada y Anatolia unificada, el Mar Negro se ha convertido en un lago otomano. Desarrolla el recurso de Constantinopla y establece la plena hegemonía sobre el Mar Negro."
 som_tur_italy_south: "Sur de Italia"
 som_tur_italy_south_desc: "Conquista Nápoles y Sicilia para obtener el centro del Mediterráneo. Estas antiguas ciudades comerciales llenarán el tesoro imperial."
 som_tur_italy_north: "Italia conquistada"
 som_tur_italy_north_desc: "Conquista Roma, Florencia y Milán para completar la conquista de la península itálica. La ciudad del papa, la ciudad de los Médici, la ciudad de los Visconti: todas se vuelven del sultán."
 som_tur_arabia_conquest: "Domina Arabia"
 som_tur_arabia_conquest_desc: "Asegura La Meca, Medina y Suez para controlar las ciudades santas del mundo islámico y la puerta del Océano Índico."
 som_tur_persian_gulf: "El Golfo Pérsico"
 som_tur_persian_gulf_desc: "Toma Ormuz y domina las rutas comerciales del Golfo Pérsico. La riqueza del comercio del Océano Índico fluye al tesoro otomano."
 som_tur_north_africa: "El Magreb"
 som_tur_north_africa_desc: "Conquista Túnez, Argel y Trípoli para traer el litoral mediterráneo meridional al dominio otomano. Los corsarios berberiscos se inclinan ante el estandarte del sultán."
 som_tur_morocco: "Marruecos"
 som_tur_morocco_desc: "Conquista Fez y Marrakech para sumar todo el norte de África al Imperio otomano. Las costas del Atlántico se convierten en la frontera occidental del imperio."
 som_tur_age_of_suleiman_desc: "Desde Viena, al norte, hasta Arabia y Marruecos, al sur: concluido un imperio mundial que abarca tres continentes. Exige completar el Asedio de Viena, el Golfo Pérsico y Marruecos."
 STATIC_MODIFIER_NAME_som_tur_black_sea_master: "Señor del Mar Negro"
 STATIC_MODIFIER_DESC_som_tur_black_sea_master: "El Mar Negro es ahora un lago otomano. A la luz de esta conquista, la corte debate introducir nuevas instituciones de gobierno, abriendo espacio para una nueva reforma."
 STATIC_MODIFIER_NAME_som_tur_italy_south_mod: "Dominio del sur de Italia"
 STATIC_MODIFIER_DESC_som_tur_italy_south_mod: "Controlando Nápoles y Sicilia, el Mediterráneo central ha pasado a manos otomanas. Ingresos comerciales y reputación diplomática mejorados."
 STATIC_MODIFIER_NAME_som_tur_arabia_mod: "Guardián de Arabia"
 STATIC_MODIFIER_DESC_som_tur_arabia_mod: "“Servidor de los Dos Santos Haram”: La Meca y Medina son los dos lugares más sagrados del islam. En 1517, Selim I conquistó Egipto y el Hiyaz y tomó estos lugares en sus manos, y el sultán otomano se convirtió en el protector religioso de todo el mundo musulmán sunita. El deber y el honor de proteger la peregrinación anual del hach recayeron sobre el sultán."
 STATIC_MODIFIER_NAME_som_tur_gulf_trade: "Dominio comercial en el Golfo Pérsico"
 STATIC_MODIFIER_DESC_som_tur_gulf_trade: "El Estrecho de Ormuz es la única puerta por la que las especias y sedas de la India y del Sudeste Asiático entran en el Golfo Pérsico. Poseer este “cuello del mundo” sería una ventaja decisiva frente a la ruta comercial india que Portugal buscaba establecer alrededor de África."
 STATIC_MODIFIER_NAME_som_tur_africa_final_mod: "Hegemonía africana"
 STATIC_MODIFIER_DESC_som_tur_africa_final_mod: "Norte de África conquistado. La caballería de élite de los desiertos y las estepas se une al ejército otomano, mejorando la fuerza de la caballería ligera y pesada."
 STATIC_MODIFIER_NAME_som_tur_ankara_fine_cloth: "Comercio de paños finos de Ankara"
 STATIC_MODIFIER_DESC_som_tur_ankara_fine_cloth: "En los talleres de Ankara, las técnicas tradicionales de tejeduría se perfeccionan, aumentando la producción de paño fino."
 STATIC_MODIFIER_NAME_som_tur_ankara_silk: "Comercio de seda de Ankara"
 STATIC_MODIFIER_DESC_som_tur_ankara_silk: "Moreras plantadas en todos los campos de Ankara, aumentando la producción de seda."
 STATIC_MODIFIER_NAME_som_tur_ankara_dyes: "Comercio de tintes de Ankara"
 STATIC_MODIFIER_DESC_som_tur_ankara_dyes: "El cultivo de plantas tintóreas de colores vivos se extiende en torno a Ankara, aumentando la producción de tintes."
 eyalet: "Eyalet"
 eyalet_desc: "Estado vasallo provincial del Imperio otomano. Sujeto a control más estricto que un vasallo, paga tributo doble y es anexionado diplomáticamente dos veces más rápido."
 eyalet_plural: "Eyalets"
 som_ottoman_events.20.t: "Dominio del Mar Negro"
 som_ottoman_events.20.d: "El Mar Negro fue antaño un lago genovés. Pero con la caída de Caffa en 1475 y el control otomano del Bósforo, desapareció el último baluarte genovés. El Mar Negro es ahora un lago otomano. Tres siglos de dominio comercial veneciano y genovés sobre el Mediterráneo oriental llegan a su fin."
 som_ottoman_events.20.a: "El Mar Negro: lago otomano"
 som_ottoman_events.30.t: "A las puertas de Viena"
 som_ottoman_events.30.d: "El ejército de Solimán el Magnífico ha llegado a Viena. Trescientos mil soldados otomanos han sacudido a todo el mundo cristiano. En 1529, la ciudad sobrevivió gracias a un invierno temprano y a líneas de suministro sobrecargadas, pero esta vez es diferente. “Si Viena cae, Europa será nuestra”, declara el sultán."
 som_ottoman_events.30.a: "Tomar Viena y convertirse en señor de Europa"
 som_ottoman_events.99.t: "La era de Solimán"
 som_ottoman_events.99.d: "El Imperio otomano ha alcanzado su apogeo: la era de Solimán el Magnífico. De los Balcanes a Arabia, de Crimea al norte de África, el dominio, que supera incluso a Roma, se inclina ante la voluntad de un único sultán. Llamado “Legislador” (Kanuni) por codificar el derecho otomano, Solimán preside el mayor florecimiento de arte, arquitectura y poder militar de la historia del imperio. Las mezquitas, los palacios y los bazares de Estambul proclaman la gloria de la mayor ciudad del mundo. El Imperio otomano se ha convertido en una de las supremas potencias de la historia."
 som_ottoman_events.99.a: "Comienza la edad de oro del gran Imperio otomano"
 som_tur_edirne_capital: "La fortaleza de Edirne"
 som_tur_edirne_capital_desc: "La antigua Adrianópolis se convirtió en Edirne cuando Murad I la hizo capital otomana en 1363: base desde la que se conquistaron los Balcanes. Permaneció como capital imperial durante casi noventa años, hasta la caída de Constantinopla en 1453, y fue donde nació Mehmed II. Fortifica esta ciudad como ancla de Rumelia y trampolín para la conquista de los Balcanes."
 som_tur_aegean_dominance: "Domina el Mar Egeo"
 som_tur_aegean_dominance_desc: "El Mar Egeo fue el campo de batalla de la rivalidad comercial entre Venecia y Génova. Tomar Esmirna como piedra angular del litoral oriental egeo y construir poder naval da a los otomanos una cabeza de puente para toda la expansión mediterránea. La flota otomana inicial debe construirse desde cero, pero crecerá hasta ser una fuerza temible."
 som_tur_janissary_corps: "El Cuerpo de Jenízaros"
 som_tur_janissary_corps_desc: "A mediados del siglo XIV, el hijo de Orhan I, Murad I, creó a los jenízaros —“nuevos soldados”, formados con muchachos cristianos llevados por el sistema devshirme, convertidos al islam y entrenados como fiel infantería permanente del sultán—. Pagados con regularidad y rigurosamente disciplinados, los jenízaros se convirtieron en la columna vertebral del ejército otomano y tuvieron un papel decisivo en la caída de Constantinopla y en incontables otras batallas."
 som_tur_devshirme_system: "El sistema devshirme"
 som_tur_devshirme_system_desc: "El devshirme (“recogida de muchachos”) llevaba a jóvenes cristianos de los Balcanes, los convertía al islam y los entrenaba como jenízaros y funcionarios del palacio. El sistema creó una clase de funcionarios leales solo al sultán, sin vínculos de linaje o familia. De esta clase salieron muchos de los mayores grandes visires del imperio: hombres que ascendieron de la esclavitud al más alto cargo del país."
 som_tur_elite_guard: "La guardia de élite"
 som_tur_elite_guard_desc: "La guardia personal del sultán, seleccionada entre los mejores jenízaros, era la tropa más disciplinada del imperio. Servían de centinelas del palacio y llevaban el estandarte imperial en campaña. Invertir en entrenamiento riguroso y altos estándares crea el núcleo de una fuerza de combate profesional que llevará al imperio a la gloria."
 som_tur_kanun_i_osmani: "El Kanun-i Osmani"
 som_tur_kanun_i_osmani_desc: "El Kanun-i Osmani (“Código otomano”) era un sistema jurídico secular desarrollado junto a la sharía. El sultán “Kanuni” (Legislador) Solimán I completó su codificación, pero las bases se sentaron en los siglos XIV y XV. Abarcando derecho fiscal, procedimiento penal y administración, el kanun dio al Estado otomano una estructura jurídica racionalizada, que operaba junto al derecho sagrado islámico y lo complementaba."
 som_tur_imperial_army: "El ejército imperial"
 som_tur_imperial_army_desc: "Jenízaros, caballería sipahi, azabs, caballería ligera akıncı: el ejército otomano era un sistema de armas combinadas, que unía varios tipos de tropa bajo mando centralizado. Disciplinado, pagado y cada vez más armado con armas de fuego, el ejército otomano del siglo XVI era una de las máquinas de guerra más formidables que el mundo haya visto. Llévalo a su pleno potencial."
 som_tur_timar_system: "El sistema timar"
 som_tur_timar_system_desc: "El timar era la institución fundamental de posesión de tierras del Estado otomano. El sultán concedía la tierra conquistada a los caballeros sipahi como timares a cambio de servicio militar, de modo semejante al feudalismo europeo, pero sin derechos hereditarios. El sistema timar financiaba una gran fuerza militar sin agotar el tesoro imperial, haciendo autofinanciada la expansión otomana inicial."
 som_tur_sipahi_cavalry: "La caballería sipahi"
 som_tur_sipahi_cavalry_desc: "Los sipahi —jinetes acorazados financiados por concesiones de timar— formaron la principal fuerza de choque del ejército otomano en los siglos XV y XVI. Sus cargas atronadoras eran temidas en los Balcanes y en Anatolia. A medida que el imperio se expandía, la clase sipahi se convirtió en una poderosa aristocracia provincial, cuyos intereses el sultán debía considerar con cuidado."
 som_tur_eyalet_system: "El sistema de eyalets"
 som_tur_eyalet_system_desc: "El eyalet (“provincia”) era la mayor unidad administrativa del Imperio otomano, administrada por un beylerbey nombrado directamente por el sultán. Rumelia, Anatolia, Egipto, Siria: cada eyalet era un imperio en miniatura, con su contingente militar y aparato administrativo. El sistema extendía la autoridad imperial a los más lejanos rincones del reino sin exigir la presencia personal del sultán."
 som_tur_grand_vizier: "El gran visir"
 som_tur_grand_vizier_desc: "El gran visir (Sadrazam) era el principal administrador del imperio, solo por debajo del sultán. Su residencia —la “Sublime Puerta” (Bab-ı Ali)— se convirtió en sinónimo del propio gobierno otomano y en la dirección donde los diplomáticos europeos presentaban sus credenciales. Un gran visir capaz podía gobernar el imperio con eficacia, dejando al sultán concentrarse en la legitimidad y el mando militar."
 som_tur_imperial_bureaucracy: "La burocracia imperial"
 som_tur_imperial_bureaucracy_desc: "La burocracia otomana —combinación de funcionarios devshirme y administradores turco-islámicos tradicionales— era uno de los más sofisticados sistemas de gobierno de su época. La cultura de documentos, la contabilidad centralizada y los departamentos especializados (diwanes) hicieron sorprendentemente manejable el enorme imperio. La simple cantidad de registros mantenidos por los escribas otomanos sigue siendo un tesoro para los historiadores."
 som_tur_new_capital: "Desarrolla Kostantiniyye"
 som_tur_new_capital_desc: "Mehmed II rebautizó la ciudad conquistada como “Kostantiniyye” e inició de inmediato un ambicioso programa de reconstrucción. El reasentamiento forzado de artesanos y mercaderes, la reconstrucción de la infraestructura y el renacimiento de los mercados transformaron la ciudad de ruinas en una metrópoli floreciente. El sultán exigió que Kostantiniyye superara la gloria de la capital bizantina a la que sustituía, y dirigió todos los recursos del imperio a conseguirlo."
 som_tur_new_capital_unlock_tt: "La decisión «La reconstrucción de Kostantiniyye» ya está disponible."
 som_develop_kostantiniyye_decision.title: "La reconstrucción de Kostantiniyye"
 som_develop_kostantiniyye_decision.desc: "La capital conquistada ha crecido, pero sus barrios aún conservan las cicatrices del asedio. El tesoro del sultán puede costear el reasentamiento, nuevos mercados y calles reconstruidas, para que Kostantiniyye vuelva a prosperar."
 som_develop_kostantiniyye_decision.a: "Invertir en la reconstrucción de la capital."
 som_expand_kostantiniyye_decision.title: "Conducir Kostantiniyye al esplendor"
 som_expand_kostantiniyye_decision.desc: "La reconstrucción ha dado fruto: colonos y artesanos llenan los nuevos barrios. Con mayores inversiones en talleres, caravasares y las tierras que rodean la ciudad, Kostantiniyye puede superar incluso la gloria de la capital bizantina."
 som_expand_kostantiniyye_decision.a: "Invertir en la grandeza de la ciudad."
 som_tur_grand_bazaar: "El Gran Bazar"
 som_tur_grand_bazaar_desc: "Construido por orden de Mehmed II entre 1455 y 1461, el Gran Bazar (Kapalıçarşı) fue uno de los primeros mercados cubiertos del mundo y pronto se convirtió en el mayor. Cuatro mil tiendas, que vendían seda, especias, joyas, cerámica y armas, atraían a decenas de miles de compradores al día. En su centro, el salón de los comerciantes de oro y plata —el Bedesten— servía de corazón comercial del imperio."
 som_tur_grand_bazaar_condition_tt: "Se ha usado la decisión «Conducir Kostantiniyye al esplendor»"
 som_tur_suleiman_mosque: "La Mezquita de Solimán"
 som_tur_suleiman_mosque_desc: "Proyectada por el maestro arquitecto Sinan y concluida en 1557, la mezquita de Solimán es una obra maestra de la arquitectura otomana. Cuatro minaretes perforan el horizonte de Estambul; la vasta cúpula domina la silueta de la ciudad vista desde el Bósforo. El complejo circundante (külliye) incluía colegios, un hospital, tiendas y un caravasar: una ciudad dentro de la ciudad, que encarnaba el ideal otomano de mecenazgo imperial."
 som_tur_topkapi_palace: "El Palacio de Topkapı"
 som_tur_topkapi_palace_desc: "El Palacio de Topkapı —erigido en un promontorio que domina el Bósforo, el Cuerno de Oro y el Mar de Mármara— sirvió de corte otomana durante cuatro siglos. Los aposentos del sultán, el harén imperial, el tesoro y la sala del consejo (Divan-ı Hümayun) estaban todos en sus cuatro patios. Todo gran visir fue allí nombrado y destituido; toda campaña comenzaba a su sombra."
 som_tur_city_of_worlds_desire: "La ciudad deseada por el mundo"
 som_tur_ulema_authority: "La autoridad de los ulemas"
 som_tur_ulema_authority_desc: "Los ulemas —eruditos islámicos que servían de jueces, consultores jurídicos y profesores— daban al Estado otomano su legitimidad religiosa. Como cadíes (jueces), muftíes (consultores jurídicos) y profesores de madrasas, administraban justicia y educación por todo el imperio. Su aprobación era indispensable para que cualquier política importante —incluidas las declaraciones de guerra— fuera vista por la población musulmana como legítima."
 som_tur_millet_system: "El sistema millet"
 som_tur_millet_system_desc: "El sistema millet (“nación” o “comunidad”) organizaba a los súbditos no musulmanes del Imperio otomano en comunidades religiosas semiautónomas. El millet ortodoxo griego Rum, el millet armenio y el millet judío: cada uno tenía sus tribunales, escuelas e instituciones de caridad bajo la dirección de sus líderes religiosos. Este extraordinario sistema de pluralismo administrado permitió al imperio gobernar una inmensa diversidad sin exigir conversiones forzadas."
 som_tur_kadi_courts: "Los tribunales de los cadíes"
 som_tur_kadi_courts_desc: "Los cadíes —jueces nombrados directamente por el sultán— administraban el derecho islámico por todo el imperio, de las grandes ciudades a las aldeas remotas. Sus registros judiciales (sijillat) documentaban no solo disputas jurídicas, sino también contratos, escrituras de tierras y relaciones sociales, creando un retrato extraordinariamente detallado de la sociedad otomana. El sistema de los cadíes llevaba el Estado de derecho —el derecho otomano— a cada rincón del reino."
 som_tur_sufi_culture: "La cultura sufí"
 som_tur_sufi_culture_desc: "Las órdenes sufíes (tarikats) estaban entretejidas en la trama de la sociedad otomana. La orden Mevlevi —conocida por los derviches giróvagos— era protegida por la corte. La orden Bektashi, columna vertebral espiritual de los jenízaros. La orden Naqshbandi, influyente en la política del palacio. El misticismo sufí moldeó la poesía, la música y el arte otomanos y sirvió de contrapeso espiritual a una interpretación legalista del islam."
 som_tur_cultural_synthesis: "Síntesis cultural"
 som_tur_cultural_synthesis_desc: "El Imperio otomano absorbió, en lugar de destruir, las culturas que conquistó. Los sistemas administrativos bizantinos, el saber árabe, la cultura de corte persa y la tradición militar turca se fundieron en una “civilización otomana” singular. Esta síntesis cultural no era mero ornamento: era la filosofía que regía el imperio, permitiéndole absorber y aprovechar las energías de decenas de pueblos conquistados."
 som_tur_bursa_silk_industry: "La industria de la seda de Bursa"
 som_tur_bursa_silk_industry_desc: "Bursa, la primera capital otomana, se desarrolló como capital de la seda del imperio desde el siglo XIV. Los artesanos, que antes trabajaban bajo mecenazgo bizantino, encontraron nuevos señores en la corte otomana, produciendo sedas de lujo para exportar a toda Europa y a Oriente Medio. “Ciudad de la seda” se convirtió en la autodefinición de Bursa: un éxito comercial que ayudó a financiar la expansión otomana."
 som_tur_silk_road: "La Ruta de la Seda"
 som_tur_silk_road_desc: "Trebisonda era el punto terminal occidental de la ruta caspia: el canal por el que seda, especias y artículos de lujo de Asia central entraban en Anatolia. Controlar este puerto dio a los otomanos un cerco mortal sobre el comercio terrestre entre Asia y Europa. Los propios ingresos del comercio que pasaba por Trebisonda ayudaron a financiar las ambiciones imperiales durante generaciones."
 som_tur_ankara_prosperity: "Prosperidad de Ankara"
 som_tur_ankara_prosperity_desc: "Ankara era un nudo del comercio terrestre de Anatolia central: ciudad que sirvió a mercaderes durante milenios. Su lana de cabra angora dio origen a una fibra de lujo cuyo nombre (angora, luego ankara) se hizo sinónimo de suavidad. Las plantas tintóreas, el procesamiento de la lana y su posición en la ruta que une Bursa con Trebisonda la convirtieron en un nudo insustituible de la red comercial otomana."
 som_tur_trade_routes: "Las rutas comerciales imperiales"
 som_tur_trade_routes_desc: "A medida que el imperio se expandía, los otomanos invertían en caravasares (posadas de camino), carreteras pavimentadas, puentes y patrullas navales contra piratas. El resultado fue una infraestructura comercial que hizo el comercio terrestre y marítimo más seguro y lucrativo que desde el apogeo del Imperio romano. Constantinopla, en el centro de una red comercial en expansión, se convirtió en el corazón económico palpitante de tres continentes."
 som_tur_commercial_empire: "El imperio comercial"
 som_tur_commercial_empire_desc: "Alepo, Alejandría, Constantinopla: las tres mayores ciudades comerciales del mundo, ahora todas otomanas. Las especias de la India, las sedas de China, la plata de Europa: todo pasaba por manos otomanas camino del productor al consumidor. El imperio cobraba una parte de cada transacción. Incluso cuando los portugueses abrieron la ruta marítima alrededor de África, los intermediarios otomanos conservaron enorme ventaja comercial durante un siglo más."
 STATIC_MODIFIER_NAME_som_tur_janissary_mod: "El Cuerpo de Jenízaros"
 STATIC_MODIFIER_DESC_som_tur_janissary_mod: "Los jenízaros —infantería permanente de élite, formada con muchachos cristianos convertidos— se convirtieron en la columna vertebral de la fuerza militar otomana. Sus característicos sombreros blancos y uniformes azules eran la visión más aterradora de los campos de batalla del siglo XV. Su papel en la caída de Constantinopla fue decisivo."
 STATIC_MODIFIER_NAME_som_tur_devshirme_mod: "El sistema devshirme"
 STATIC_MODIFIER_DESC_som_tur_devshirme_mod: "El devshirme creó una clase de funcionarios leales solo al sultán, sin vínculos familiares o de linaje. Este sistema meritocrático (según los estándares otomanos) permitía que hombres de origen cristiano humilde ascendieran a los más altos cargos del imperio, al tiempo que daba al sultán siempre un pilar de poder alternativo frente a la consolidada nobleza turca."
 STATIC_MODIFIER_NAME_som_tur_elite_guard_mod: "La guardia de élite"
 STATIC_MODIFIER_DESC_som_tur_elite_guard_mod: "Seleccionada entre los mejores jenízaros, la guardia personal del sultán era la tropa más disciplinada del imperio. Encarnaba no solo el poderío militar, sino también la autoridad simbólica del sultanato: su presencia en campaña era la declaración de que la persona del sultán estaba presente, incluso cuando él mismo no lo estaba."
 STATIC_MODIFIER_NAME_som_tur_kanun_mod: "El código Kanun"
 STATIC_MODIFIER_DESC_som_tur_kanun_mod: "El kanun —derecho secular otomano— operaba junto a la sharía, creando un sistema jurídico doble que abarcaba impuestos, procedimiento penal y administración. La autoridad legislativa del sultán para crear derecho secular era una innovación teológica, que daba al Estado otomano una flexibilidad de la que carecían los Estados puramente shariáticos."
 STATIC_MODIFIER_NAME_som_tur_imperial_army_mod: "El ejército imperial"
 STATIC_MODIFIER_DESC_som_tur_imperial_army_mod: "El ejército otomano plenamente desarrollado —que combinaba la infantería jenízara, la caballería sipahi y el más sofisticado tren de artillería del mundo— era una maravilla militar del siglo XVI. Su combinación de disciplina, potencia de fuego y organización logística lo hacía capaz de campañas a una escala que ninguna potencia europea podía igualar."
 STATIC_MODIFIER_NAME_som_tur_timar_mod: "El sistema timar"
 STATIC_MODIFIER_DESC_som_tur_timar_mod: "Concediendo la tierra conquistada como timares no hereditarios a los caballeros sipahi a cambio de servicio militar, los otomanos financiaban su ejército sin agotar el tesoro. El sultán mantenía la propiedad última de toda la tierra de timar, dándole una ventaja sobre el estamento militar que los monarcas europeos solo podían envidiar."
 STATIC_MODIFIER_NAME_som_tur_sipahi_mod: "La caballería sipahi"
 STATIC_MODIFIER_DESC_som_tur_sipahi_mod: "Los jinetes acorazados sipahi, financiados por concesiones de timar, eran la principal fuerza de choque del ejército otomano en los siglos XV y XVI. Sus cargas atronadoras aplastaron ejércitos de los Balcanes a la frontera persa. A medida que el imperio maduraba, la clase sipahi se convirtió en una poderosa aristocracia provincial con intereses políticos propios."
 STATIC_MODIFIER_NAME_som_tur_eyalet_mod: "El sistema de eyalets"
 STATIC_MODIFIER_DESC_som_tur_eyalet_mod: "El sistema de eyalets —con un beylerbey nombrado por el sultán administrando cada provincia importante— extendió el alcance administrativo otomano por una inmensa extensión geográfica. Cada eyalet era, en la práctica, un imperio en miniatura, con su contingente militar, tesoro y corte, alimentando al centro de recursos y tropas."
 STATIC_MODIFIER_NAME_som_tur_vizier_mod: "El gran visir"
 STATIC_MODIFIER_DESC_som_tur_vizier_mod: "La residencia del gran visir —la Sublime Puerta— se convirtió en la dirección a través de la cual los enviados europeos conducían la diplomacia otomana. El Diwan que presidía era el órgano de formulación de políticas del imperio. Un gran visir capaz podía gobernar el imperio durante décadas; uno incapaz podía llevarlo al borde del colapso."
 STATIC_MODIFIER_NAME_som_tur_bureaucracy_mod: "La burocracia imperial"
 STATIC_MODIFIER_DESC_som_tur_bureaucracy_mod: "La cultura escribal otomana produjo un registro en papel de asombrosa cantidad y detalle. Catastros de tierras, estudios fiscales, actas judiciales y edictos imperiales crearon una infraestructura administrativa que hizo del Imperio otomano uno de los Estados mejor documentados del período premoderno."
 STATIC_MODIFIER_NAME_som_tur_mosque_mod: "La Mezquita de Solimán"
 STATIC_MODIFIER_DESC_som_tur_mosque_mod: "La obra maestra de Sinan anunció al mundo que los otomanos eran herederos de Roma, de Bizancio y de la suprema civilización islámica a la vez. Su cúpula rivalizaba con Santa Sofía en el horizonte de Estambul: un diálogo arquitectónico deliberado entre el viejo imperio cristiano y el nuevo musulmán."
 STATIC_MODIFIER_NAME_som_tur_topkapi_mod: "El Palacio de Topkapı"
 STATIC_MODIFIER_DESC_som_tur_topkapi_mod: "El Topkapı era el centro nervioso de un imperio de tres continentes. Todo sultán fue allí coronado; toda campaña partía de sus puertas; todo gran visir servía por su gracia. El harén entre sus muros moldeó la política de sucesión durante siglos."
 STATIC_MODIFIER_NAME_som_tur_ulema_mod: "La autoridad de los ulemas"
 STATIC_MODIFIER_DESC_som_tur_ulema_mod: "Los ulemas daban al Estado otomano su legitimidad religiosa. Su aprobación de las guerras del sultán como yihad, su administración del sistema de tribunales shariáticos y su dotación de la red educativa de las madrasas los hacían socios indispensables del gobierno otomano."
 STATIC_MODIFIER_NAME_som_tur_millet_mod: "El sistema millet"
 STATIC_MODIFIER_DESC_som_tur_millet_mod: "El pluralismo religioso organizado —cristianos, judíos y musulmanes viviendo bajo un único paraguas imperial, cada uno gestionando sus propios asuntos comunitarios— fue la solución otomana al problema de gobernar un imperio diverso. No era igualdad, sino una forma de convivencia que sostuvo al imperio durante siglos."
 STATIC_MODIFIER_NAME_som_tur_kadi_mod: "Los tribunales de los cadíes"
 STATIC_MODIFIER_DESC_som_tur_kadi_mod: "Los tribunales de los cadíes llevaron el Estado de derecho otomano a todos los rincones del imperio, de Estambul a las remotas aldeas anatolias. Los registros sijillat que produjeron son un tesoro para el historiador: decenas de miles de volúmenes que documentan disputas de propiedad, matrimonios, contratos comerciales y casos criminales a lo largo de los siglos."
 STATIC_MODIFIER_NAME_som_tur_sufi_mod: "La cultura sufí"
 STATIC_MODIFIER_DESC_som_tur_sufi_mod: "Las órdenes sufíes daban a la vida religiosa otomana una profundidad espiritual que la comprensión formal y legalista del islam no podía ofrecer. Los Mevlevi giróvagos, los belicosos Bektashi, los políticamente ligados Naqshbandi: cada orden ocupaba un nicho propio en la sociedad otomana, y juntas tejieron una red de comunidad espiritual por todo el imperio."
 STATIC_MODIFIER_NAME_som_tur_synthesis_mod: "Síntesis cultural"
 STATIC_MODIFIER_DESC_som_tur_synthesis_mod: "El talento otomano para absorber en lugar de destruir hizo del imperio una esponja cultural. La pericia administrativa bizantina, la cultura literaria persa, la tradición académica árabe y la energía militar turca se fundieron en algo singular, y magníficamente, otomano."
 STATIC_MODIFIER_NAME_som_tur_bursa_silk_trade: "La industria de la seda de Bursa"
 STATIC_MODIFIER_DESC_som_tur_bursa_silk_trade: "Bursa se convirtió en la capital de la seda del imperio: papel que mantuvo durante siglos. Los artesanos de la ciudad producían sedas de lujo que adornaban por igual las cortes de Europa y de Oriente Medio, y sus ingresos ayudaban a financiar las campañas que construyeron el imperio."
 STATIC_MODIFIER_NAME_som_tur_trade_empire_mod: "Las rutas comerciales imperiales"
 STATIC_MODIFIER_DESC_som_tur_trade_empire_mod: "Caravasares, caminos y la represión de la piratería reanimaron el comercio dentro del imperio. Una red comercial radial centrada en Constantinopla trajo integración económica."
 STATIC_MODIFIER_NAME_som_tur_istanbul_glory_mod: "La ciudad deseada por el mundo"
 STATIC_MODIFIER_DESC_som_tur_istanbul_glory_mod: "Estambul —que se extiende por dos continentes y domina el único paso entre el Mar Negro y el Mediterráneo— era la ciudad que el mundo entero deseaba. Su población, su comercio, su arquitectura y su importancia política la hicieron la capital incontestada del mundo conocido."
 som_ottoman_events.50.t: "La ciudad deseada por el mundo"
 som_ottoman_events.50.d: "Constantinopla —Estambul— se ha convertido de hecho y plenamente en la ciudad que el mundo entero desea. Su población de medio millón la hace la mayor ciudad de Europa y de Oriente Medio juntos. Se extiende por dos continentes. Controla el único paso marítimo entre el Mar Negro y el Mediterráneo. La silueta refinada de la mezquita de Solimán y la altura dominante del palacio de Topkapı se reflejan en las aguas del Bósforo. En sus cortes, los poetas rivalizan con los filósofos, y los arquitectos compiten con los eruditos. La civilización otomana ha alcanzado su cenit. Esta ciudad brillará mil años."
 som_ottoman_events.50.a: "¡Que Estambul brille mil años!"
 som_ottoman_events.50.breadbasket_tt: "El derecho urbano «Panera imperial otomana» está ahora disponible. Puede concederse a ubicaciones de rango ciudad o superior que tengan un granero de nivel 5 o superior."
 STATIC_MODIFIER_NAME_som_tur_constantinople_dev_mod: "Desarrollo de Kostantiniyye"
 STATIC_MODIFIER_DESC_som_tur_constantinople_dev_mod: "Bajo Mehmed II, el reasentamiento y la reconstrucción prosiguen; las voces de los nuevos habitantes llenan los mercados, y la mampostería restaurada devuelve nuevo brillo a la antigua capital imperial."
 STATIC_MODIFIER_NAME_som_tur_constantinople_splendor_mod: "El esplendor de Kostantiniyye"
 STATIC_MODIFIER_DESC_som_tur_constantinople_splendor_mod: "Alrededor del Cuerno de Oro se alzan nuevos talleres, caravasares y barrios; colonos y artesanos acuden a la ciudad, y las tierras que la rodean rinden más que nunca. La capital del sultán vuelve a eclipsar a todas las ciudades del mundo conocido."
 STATIC_MODIFIER_NAME_som_tur_trebizond_trade_mod: "Trebisonda, puerta de la Ruta de la Seda"
 STATIC_MODIFIER_DESC_som_tur_trebizond_trade_mod: "En el puerto de Trebisonda, en la costa sur del Mar Negro, las cargas de las caravanas que descendieron de la Ruta de la Seda de Asia central y del Caspio se apilan en alto, a la espera de barcos rumbo al Mediterráneo."
 STATIC_MODIFIER_NAME_som_tur_commercial_empire_mod: "El imperio comercial"
 STATIC_MODIFIER_DESC_som_tur_commercial_empire_mod: "Alepo, Alejandría, Constantinopla: la riqueza de tres continentes fluye ahora por los mercados del sultán."
 STATIC_MODIFIER_NAME_som_tur_grand_bazaar_loc_mod: "El Gran Bazar"
 STATIC_MODIFIER_DESC_som_tur_grand_bazaar_loc_mod: "A lo largo de las calles cubiertas del Kapalıçarşı, los pregones de orfebres y mercaderes de especias no cesan, y las mercancías de todo el mundo se reúnen aquí."
 som_ottoman_events.19.t: "El destino comercial de Esmirna"
 som_ottoman_events.19.d: "Esmirna (Izmir) es la mayor ciudad portuaria de la costa este del Egeo, puerta que une el interior anatolio con el mundo mediterráneo. Colonos griegos la fundaron en la Antigüedad; ahora pertenece a los otomanos. El sultán debe decidir el rumbo futuro de la ciudad: desarrollarla como próspero nudo comercial, atrayendo mercaderes de todo el mundo conocido, o invertir en construcción naval para proyectar el poder otomano por todo el Egeo."
 som_ottoman_events.19.a: "Desarrollar el distrito mercantil de Esmirna y hacer de ella un centro comercial"
 som_ottoman_events.19.b: "Construir un astillero en Esmirna y usarlo como base naval para la expansión egea"
 STATIC_MODIFIER_NAME_som_tur_anatolian_heartland_mod: "Dominio de Anatolia"
 STATIC_MODIFIER_DESC_som_tur_anatolian_heartland_mod: "De Konya a Trebisonda, recaudadores y funcionarios del sultán llegan a las aldeas de Anatolia, y el gobierno imperial se extiende a cada rincón de la meseta."
 STATIC_MODIFIER_NAME_som_tur_crimea_dominance: "Dominio de Crimea"
 STATIC_MODIFIER_DESC_som_tur_crimea_dominance: "Mirando por encima del Mar Negro desde el puerto de Caffa, solo naves con bandera otomana cortan las olas. El Mar Negro se convierte en “lago otomano”."
 STATIC_MODIFIER_NAME_som_tur_aleppo_learning_mod: "El saber de Alepo"
 STATIC_MODIFIER_DESC_som_tur_aleppo_learning_mod: "Alepo fue uno de los grandes centros intelectuales del mundo islámico. Las famosas madrasas, bibliotecas y eruditos reunidos aquí traen un aflujo de la tradición académica árabe al Imperio otomano."
 STATIC_MODIFIER_NAME_som_tur_damascus_learning_mod: "El saber de Damasco"
 STATIC_MODIFIER_DESC_som_tur_damascus_learning_mod: "Damasco lleva el legado intelectual acumulado de los períodos omeya, abasí y mameluco. Bajo el dominio otomano, esta rica herencia sigue creciendo."
 STATIC_MODIFIER_NAME_som_tur_caliph_successor: "Sucesor del califato"
 STATIC_MODIFIER_DESC_som_tur_caliph_successor: "El nombre del sultán, ahora guardián de los lugares santos, se pronuncia desde los púlpitos como el nombre del califa."
 STATIC_MODIFIER_NAME_som_tur_aegean_shipbuilding_mod: "Técnicas navales egeas"
 STATIC_MODIFIER_DESC_som_tur_aegean_shipbuilding_mod: "Maestros constructores de las islas egeas llevan oficios transmitidos por generaciones a los astilleros de Estambul, y quilla tras quilla se asienta."
 som_ottoman_events.61.t: "La batalla de Marj Dabiq"
 som_ottoman_events.61.d: "En 1516, el sultán Selim I destruyó al ejército mameluco del sultán Qansuh al-Ghuri en las llanuras de Marj Dabiq. El propio Qansuh cayó en el campo; toda Siria pasó a manos otomanas. Con El Cairo ocupado, el destino del Sultanato mameluco reposa en manos otomanas."
 som_ottoman_events.61.a: "Absorber el Sultanato mameluco como eyalet mediante paz negociada"
 som_ottoman_events.61.b: "Firmar la paz y permitirles mantener la independencia"
 STATIC_MODIFIER_NAME_som_tur_edirne_trade_mod: "Edirne, nudo comercial"
 STATIC_MODIFIER_DESC_som_tur_edirne_trade_mod: "Edirne (Adrianópolis) es el centro comercial de Rumelia. Esta ciudad, que une los Balcanes y Anatolia, desarrollada como nudo de producción de tintes, seda y paño fino, sostiene la base fiscal inicial de los otomanos."
 STATIC_MODIFIER_NAME_som_tur_novo_brdo_silver_mod: "Minas de plata de Novo Brdo"
 STATIC_MODIFIER_DESC_som_tur_novo_brdo_silver_mod: "Novo Brdo (“Nueva Colina”) posee las mayores minas de plata de los Balcanes. Incluso después de la conquista otomana en los años 1450, sus ricas minas siguieron enriqueciendo el tesoro imperial. La prosperidad mensual y el crecimiento poblacional también se refuerzan."
 STATIC_MODIFIER_NAME_som_tur_hungarian_march_mod: "La marcha húngara"
 STATIC_MODIFIER_DESC_som_tur_hungarian_march_mod: "Con Buda caída, los soldados otomanos, avanzando por el Danubio rumbo a Viena, sienten, incluso en medio del brillo de la victoria, el comienzo de una larga guerra con los Habsburgo."
 STATIC_MODIFIER_NAME_som_tur_italy_north_mod: "Dominio de la península itálica"
 STATIC_MODIFIER_DESC_som_tur_italy_north_mod: "El estandarte de la media luna ondea sobre las plazas de Roma, Florencia y Milán, y los habitantes de las ciudades del Renacimiento empiezan a aprender la lengua de sus nuevos señores."
 STATIC_MODIFIER_NAME_som_tur_maghreb_mod: "Dominio del Magreb"
 STATIC_MODIFIER_DESC_som_tur_maghreb_mod: "Los barcos de los corsarios berberiscos, reunidos en los puertos de Túnez y Argel, miran ahora el Mediterráneo occidental como ala de la flota del sultán."
 som_tur_silk_road_revival: "Renacimiento de la Ruta de la Seda"
 som_tur_silk_road_revival_desc: "Tabriz era el nudo más occidental de la Ruta de la Seda: capital del Ilkanato, que antaño unía Persia y Asia central con el mundo mediterráneo. Tomar esta ciudad da al Imperio otomano control directo sobre el flujo de seda, especias y joyas de Asia. La vasta red comercial que une el Mar Negro con Asia central renace, reforzando enormemente el poder comercial imperial."
 STATIC_MODIFIER_NAME_som_tur_silk_road_revival_mod: "Renacimiento de la Ruta de la Seda"
 STATIC_MODIFIER_DESC_som_tur_silk_road_revival_mod: "Desde los mercados de Tabriz, caravanas cargadas de seda china siguen de nuevo el camino rumbo a Estambul, y la Ruta de la Seda ha recuperado su animación."
 som_tur_city_of_worlds_desire_desc: "Estambul es verdaderamente la ciudad deseada por el mundo. Con una población superior a medio millón, es el eje incontestado del comercio mundial. A medida que esta gran ciudad alcanza su plena gloria, la antigua ley bizantina del Granero Imperial se vuelve disponible también para el Imperio otomano."
 som_tur_true_rome: "El verdadero Imperio romano"
 som_tur_true_rome_desc: "Balcanes, Anatolia, mundo árabe, Egipto, norte de África, Italia: prácticamente todas las tierras antaño gobernadas por Roma llevan ahora el estandarte otomano. Mehmed II asumió el título de Kayser-i Rum (emperador) tras la caída de Constantinopla. Ahora el Imperio otomano se alza como verdadero heredero de Roma, heredando sus caminos, sus leyes, su civilización. Resucita el Código de Justiniano, amplía el sistema de acueductos y une el vasto imperio bajo una sola ley y una sola cultura."
 STATIC_MODIFIER_NAME_som_tur_true_rome_mod: "El verdadero Imperio romano"
 STATIC_MODIFIER_DESC_som_tur_true_rome_mod: "Bajo un imperio que reivindica el manto de Roma, los caminos se reparan, los acueductos se amplían y el código de Justiniano se resucita como derecho de una nueva era."
 som_ottoman_mission_pack: "El ascenso del Imperio otomano"
 som_ottoman_mission_pack_DESCRIPTION:0 "En 1337, el Estado otomano es un pequeño beylicato anatolio con capital en Bursa, Iznik e Izmit. En pocas generaciones se transformará en un imperio que se extiende de los Balcanes a Arabia, de Crimea al norte de África y a Italia. Lleva el espíritu de los gazis a los Balcanes, pon de rodillas a Constantinopla, realiza la era de oro de Solimán el Magnífico y reivindica el manto de la verdadera Roma."
 som_ottoman_mission_pack_CRITERIA_DESCRIPTION:0 "Como otomanos, conquista los Balcanes, Anatolia, el mundo árabe y el Mediterráneo; construye instituciones internas duraderas; y alcanza la era de Solimán."
 som_ottoman_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para realizar el Ascenso del Imperio otomano."
 som_ottoman_mission_pack_BUTTON_DETAILS:0 "¡De un pequeño beylicato en 1337 al mayor imperio del mundo!"
