l_spanish:
 ayy_ayyubid_mission_pack: "El nuevo Saladino y el señor de Oriente Próximo"
 ayy_ayyubid_mission_pack_DESCRIPTION:0 "En 1337, la dinastía ayubí sobrevive como un pequeño Estado en el norte de Siria. Restaura la gloria de Saladino (1138-1193), que unificó Egipto, Siria y Mesopotamia y expulsó a los cruzados de Jerusalén. Conquista Egipto, libera Jerusalén, toma Bagdad y conviértete en guardián de La Meca y Medina, para gobernar como Nuevo Saladino."
 ayy_ayyubid_mission_pack_CRITERIA_DESCRIPTION:0 "Conquista Egipto, el Levante, Mesopotamia y Arabia y gobierna como señor de Oriente Próximo y guardián del islam suní."
 ayy_ayyubid_mission_pack_BUTTON_TOOLTIP:0 "Gobierna como Nuevo Saladino sobre Oriente Próximo."
 ayy_ayyubid_mission_pack_BUTTON_DETAILS:0 "¡De un pequeño Estado en el norte de Siria, derrota a los cruzados, recupera Jerusalén y erige un gran imperio de Oriente Próximo!"
 ayy_rise_of_ayyubids: "El ascenso de los ayubíes"
 ayy_rise_of_ayyubids_desc: "La dinastía ayubí, heredera de Saladino, inicia su reconstrucción desde un pequeño Estado en el norte de Siria."
 ayy_secure_sinai: "Asegura el Sinaí"
 ayy_secure_sinai_desc: "Asegura la Península del Sinaí como puerta entre Egipto y el Levante."
 ayy_conquer_lower_egypt: "Conquista el Bajo Egipto"
 ayy_conquer_lower_egypt_desc: "Conquista el delta del Nilo y Alejandría para tomar el rico corazón de Egipto."
 ayy_seize_cairo: "Toma El Cairo"
 ayy_seize_cairo_desc: "Toma El Cairo —ciudad de los mil minaretes— como capital ayubí."
 ayy_upper_egypt: "Conquista el Alto Egipto"
 ayy_upper_egypt_desc: "Conquista el Alto Egipto hasta las cataratas de Asuán y completa el dominio sobre el Nilo."
 ayy_nile_breadbasket: "El granero del Nilo"
 ayy_nile_breadbasket_desc: "Aprovecha las fértiles llanuras aluviales del Nilo para alimentar el imperio."
 ayy_dev_cairo: "Construye la capital imperial, El Cairo"
 ayy_dev_cairo_desc: "Reconstruye El Cairo como la mayor ciudad del mundo islámico: la capital imperial del Imperio ayubí."
 ayy_secure_levant: "Asegura el Levante"
 ayy_secure_levant_desc: "Asegura el Levante en torno a Damasco y expulsa a los cruzados."
 ayy_seize_aleppo: "Toma Alepo"
 ayy_seize_aleppo_desc: "Toma Alepo: corona del norte de Siria."
 ayy_reclaim_jerusalem: "Recupera Jerusalén"
 ayy_reclaim_jerusalem_desc: "Recupera Jerusalén de los cruzados, como antaño hizo Saladino en 1187."
 ayy_coastal_levant: "El Levante costero"
 ayy_coastal_levant_desc: "Toma las ciudades costeras mediterráneas del Levante para dominar el comercio marítimo."
 ayy_antioch: "Subyuga Antioquía"
 ayy_antioch_desc: "Subyuga la antigua gran ciudad de Antioquía para ampliar la influencia septentrional."
 ayy_jazira: "Independencia del Ilkanato"
 ayy_jazira_desc: "La región de Yazira, entre el Tigris y el Éufrates, cayó bajo influencia mongola del Ilkanato. Trae esta rica tierra al control ayubí o de vasallos y libérate del yugo mongol. La elevación al rango de principado elevará la legitimidad ayubí."
 ayy_kurdish_highlands: "Las tierras altas kurdas"
 ayy_kurdish_highlands_desc: "Incorpora las tribus montañesas kurdas —el propio pueblo de Saladino— al ejército ayubí."
 ayy_iraq_arabi: "Conquista del Irak árabe"
 ayy_iraq_arabi_desc: "Conquista el Irak árabe para dominar el corazón mesopotámico."
 ayy_seize_baghdad: "Toma Bagdad"
 ayy_seize_baghdad_desc: "Toma Bagdad —ciudad de la paz— y proclama la supremacía ayubí."
 ayy_mesopotamia_trade: "Comercio mesopotámico"
 ayy_mesopotamia_trade_desc: "Domina la red comercial mesopotámica en torno a Bagdad."
 ayy_hejaz: "Avance sobre el Hiyaz"
 ayy_hejaz_desc: "Avanza sobre el Hiyaz y acércate a las ciudades santas de La Meca y Medina."
 ayy_holy_cities: "Guardián de las ciudades santas"
 ayy_holy_cities_desc: "Conviértete en guardián de las dos Ciudades Santas: La Meca y Medina."
 ayy_north_yemen: "El Yemen septentrional"
 ayy_north_yemen_desc: "Conquista el Yemen septentrional y obtén acceso al comercio del Mar Rojo."
 ayy_south_yemen: "Toma el puerto de Adén"
 ayy_south_yemen_desc: "Toma el puerto de Adén: puerta al Mar Arábigo."
 ayy_arabian_trade: "Comercio marítimo árabe"
 ayy_arabian_trade_desc: "Monopoliza las rutas comerciales árabes, que unen el Océano Índico con el Mediterráneo."
 ayy_madrasa: "Erige la madrasa"
 ayy_madrasa_desc: "Erige madrasas por todo el imperio para reavivar el saber islámico."
 ayy_crusader_wars: "Guerra santa contra los cruzados"
 ayy_crusader_wars_desc: "Conduce la guerra santa contra los cruzados para forjar el ejército ayubí en guerreros de élite."
 ayy_dev_damascus: "Prosperidad de Damasco"
 ayy_dev_damascus_desc: "Desarrolla Damasco —paraíso terrenal— como capital cultural ayubí."
 ayy_spice_trade: "Comercio de especias"
 ayy_spice_trade_desc: "Monopoliza el comercio de especias del Océano Índico, por Adén, a los mercados europeos."
 ayy_silk_road_control: "Domina la Ruta de la Seda"
 ayy_silk_road_control_desc: "Domina la Ruta de la Seda por Bagdad para dominar el comercio terrestre Este-Oeste."
 ayy_kurdish_cavalry: "Élite de la caballería kurda"
 ayy_kurdish_cavalry_desc: "Forja la caballería kurda en la mejor fuerza de combate ayubí."
 ayy_nile_fleet: "La flota del Nilo"
 ayy_nile_fleet_desc: "Construye una flota en el Nilo y en el Mediterráneo para cortar las líneas de suministro de los cruzados."
 ayy_defeat_crusaders: "Derrota a los cruzados"
 ayy_defeat_crusaders_desc: "Repite la destrucción del ejército cruzado por Saladino en Hattin."
 ayy_egypt_navy: "Poder naval egipcio"
 ayy_egypt_navy_desc: "Construye un poderoso poder naval egipcio para dominar el Mediterráneo y el Mar Rojo."
 ayy_sugar_egypt: "El azúcar de Egipto"
 ayy_sugar_egypt_desc: "Monopoliza la producción de azúcar de Egipto: el oro dulce del comercio medieval."
 ayy_iraq_ajam: "Avance sobre el Irak persa"
 ayy_iraq_ajam_desc: "Avanza sobre el Irak persa (Iraq-i Ayam) para ampliar la influencia ayubí en Persia."
 ayy_build_mosques: "Erige mezquitas por doquier"
 ayy_build_mosques_desc: "Erige mezquitas por todo el imperio para unir a todos los súbditos bajo el islam suní."
 ayy_sultan_of_egypt_syria: "Sultán de Egipto y Siria"
 ayy_sultan_of_egypt_syria_desc: "Proclámate sultán de Egipto, Siria, Irak y el Hiyaz: señor de Oriente Próximo."
 ayy_new_saladin: "El Nuevo Saladino"
 ayy_new_saladin_desc: "Gobierna como Nuevo Saladino: señor de Oriente Próximo, heredero del legado de Saladino."
 ayy_events.1.t: "El ascenso de los ayubíes: el juramento de Saladino"
 ayy_events.1.d: "En nombre de Dios: en 1337, la dinastía ayubí sobrevive como un pequeño Estado, pero el espíritu de Saladino corre por sus venas. La memoria de la batalla de Hattin (1187) y de la liberación de Jerusalén mueve al sultán ayubí. Conquista Egipto, libera la ciudad santa, defiende La Meca: conviértete en el Nuevo Saladino, señor de Oriente Próximo."
 ayy_events.1.a: "En el camino de Dios: ¡alzaos, ayubíes!"
 ayy_events.10.t: "Liberación de Jerusalén: la Ciudad Santa vuelve al islam"
 ayy_events.10.d: "¡Allahu akbar! La gran hazaña de Saladino de 1187 se ha repetido. Jerusalén ha vuelto a manos musulmanas. La Cúpula de la Roca y la Mezquita Santa resuenan de nuevo con la oración islámica. El mundo islámico se regocija."
 ayy_events.10.a: "¡Gloria a Jerusalén! ¡En nombre de Dios!"
 ayy_events.20.t: "Entrada en Bagdad: rumbo al corazón del mundo islámico"
 ayy_events.20.d: "La ciudad de la paz, Bagdad: las fuerzas ayubíes han entrado en la ciudad donde antaño gobernaron los califas abasíes. El pueblo clama: “¡Ha llegado el heredero de Saladino!” La cultura y el saber de Bagdad prosperan bajo el mecenazgo ayubí."
 ayy_events.20.a: "¡Gloria a Bagdad! ¡Gloria a la gloria del islam!"
 ayy_events.30.t: "Guardián de las dos Ciudades Santas: defiende La Meca y Medina"
 ayy_events.30.d: "La Meca y Medina —lugares santos del profeta Mahoma— han pasado a la protección ayubí. “Khadim al-Haramain ash-Sharifain”: este título se concede al sultán ayubí y es reconocido por todo el mundo islámico."
 ayy_events.30.a: "Como guardián de las dos Ciudades Santas: ¡en nombre de Dios!"
 ayy_events.60.t: "Sultán de Egipto y Siria: señor de Oriente Próximo"
 ayy_events.60.d: "Proclamado en la corte de El Cairo: “Sultán de Egipto, Siria, Irak y el Hiyaz, señor de la dinastía ayubí”. Jerusalén, Bagdad, La Meca y El Cairo, todas unidas bajo el estandarte ayubí. El sueño desde los tiempos de Saladino realizado."
 ayy_events.60.a: "¡Gloria al sultán! ¡Gloria a los ayubíes!"
 ayy_events.99.t: "El Nuevo Saladino: eterno señor de Oriente Próximo"
 ayy_events.99.d: "“Salah ad-Din Ayyubi: rectitud de la fe, señor de Oriente Próximo”: este título inscrito en la historia. Del Nilo, en Egipto, al Tigris, en Mesopotamia, del desierto árabe a las montañas anatolias: todas las tierras unidas bajo el estandarte ayubí."
 ayy_events.99.a: "¡Gloria al Nuevo Saladino! ¡Gloria al Imperio ayubí!"
 STATIC_MODIFIER_NAME_ayy_sinai_mod: "Sinaí"
 STATIC_MODIFIER_DESC_ayy_sinai_mod: "Península del Sinaí asegurada, abriendo la puerta entre Egipto y el Levante."
 STATIC_MODIFIER_NAME_ayy_lower_egypt_mod: "Bajo Egipto"
 STATIC_MODIFIER_DESC_ayy_lower_egypt_mod: "Delta del Nilo y Alejandría conquistados: el rico corazón de Egipto asegurado."
 STATIC_MODIFIER_NAME_ayy_cairo_mod: "El Cairo"
 STATIC_MODIFIER_DESC_ayy_cairo_mod: "El Cairo —ciudad de los mil minaretes— tomado como capital ayubí."
 STATIC_MODIFIER_NAME_ayy_upper_egypt_mod: "Alto Egipto"
 STATIC_MODIFIER_DESC_ayy_upper_egypt_mod: "Alto Egipto hasta Asuán conquistado, completando el dominio sobre el Nilo."
 STATIC_MODIFIER_NAME_ayy_nile_mod: "Nilo"
 STATIC_MODIFIER_DESC_ayy_nile_mod: "Sobre el limo negro, traído por la crecida del Nilo, los campesinos aguardan la estación en que las espigas de trigo ondularán al viento."
 STATIC_MODIFIER_NAME_ayy_cairo_great_mod: "El Gran Cairo"
 STATIC_MODIFIER_DESC_ayy_cairo_great_mod: "El Cairo se convierte en la mayor ciudad del mundo islámico: la capital imperial."
 STATIC_MODIFIER_NAME_ayy_aleppo_mod: "Alepo"
 STATIC_MODIFIER_DESC_ayy_aleppo_mod: "Alepo —corona del norte de Siria— tomada para dominar la región."
 STATIC_MODIFIER_NAME_ayy_coastal_mod: "Región costera"
 STATIC_MODIFIER_DESC_ayy_coastal_mod: "Ciudades costeras mediterráneas del Levante tomadas, dominando el comercio marítimo."
 STATIC_MODIFIER_NAME_ayy_antioch_mod: "Antioquía"
 STATIC_MODIFIER_DESC_ayy_antioch_mod: "La antigua ciudad de Antioquía subyugada, ampliando la influencia septentrional."
 STATIC_MODIFIER_NAME_ayy_jazira_mod: "Independencia del Ilkanato"
 STATIC_MODIFIER_DESC_ayy_jazira_mod: "Influencia del Ilkanato expulsada: principado ayubí reconocido por la comunidad internacional."
 STATIC_MODIFIER_NAME_ayy_kurdish_mod: "Kurdos"
 STATIC_MODIFIER_DESC_ayy_kurdish_mod: "Tribus montañesas kurdas —el propio pueblo de Saladino— incorporadas al ejército ayubí."
 STATIC_MODIFIER_NAME_ayy_iraq_mod: "Irak"
 STATIC_MODIFIER_DESC_ayy_iraq_mod: "Irak árabe conquistado, dominando el corazón mesopotámico."
 STATIC_MODIFIER_NAME_ayy_mesopotamia_trade_mod: "Comercio mesopotámico"
 STATIC_MODIFIER_DESC_ayy_mesopotamia_trade_mod: "Red comercial mesopotámica en torno a Bagdad dominada."
 STATIC_MODIFIER_NAME_ayy_hejaz_mod: "Hiyaz"
 STATIC_MODIFIER_DESC_ayy_hejaz_mod: "Por los senderos arenosos del Hiyaz, caravanas de peregrinos van a La Meca y Medina bajo los atentos estandartes ayubíes."
 STATIC_MODIFIER_NAME_ayy_yemen_mod: "Yemen"
 STATIC_MODIFIER_DESC_ayy_yemen_mod: "Yemen septentrional conquistado, obteniendo acceso al comercio del Mar Rojo."
 STATIC_MODIFIER_NAME_ayy_aden_mod: "Adén"
 STATIC_MODIFIER_DESC_ayy_aden_mod: "El puerto de Adén —puerta al Mar Arábigo— cae bajo control ayubí."
 STATIC_MODIFIER_NAME_ayy_arabian_trade_mod: "Comercio árabe"
 STATIC_MODIFIER_DESC_ayy_arabian_trade_mod: "Rutas comerciales árabes, que unen el Océano Índico con el Mediterráneo, monopolizadas."
 STATIC_MODIFIER_NAME_ayy_madrasa_mod: "Madrasa"
 STATIC_MODIFIER_DESC_ayy_madrasa_mod: "Madrasas por todo el imperio reavivan el saber y la jurisprudencia islámicos."
 STATIC_MODIFIER_NAME_ayy_jihad_mod: "Yihad"
 STATIC_MODIFIER_DESC_ayy_jihad_mod: "La guerra santa contra los cruzados forja el ejército ayubí en guerreros de élite."
 STATIC_MODIFIER_NAME_ayy_damascus_dev_mod: "Damasco desarrollada"
 STATIC_MODIFIER_DESC_ayy_damascus_dev_mod: "Damasco desarrollada como importante nudo comercial y cultural."
 STATIC_MODIFIER_NAME_ayy_spice_mod: "Especias"
 STATIC_MODIFIER_DESC_ayy_spice_mod: "Comercio de especias del Océano Índico, por Adén, a Europa monopolizado."
 STATIC_MODIFIER_NAME_ayy_silk_mod: "Seda"
 STATIC_MODIFIER_DESC_ayy_silk_mod: "Ruta de la Seda por Bagdad dominada, controlando el comercio terrestre Este-Oeste."
 STATIC_MODIFIER_NAME_ayy_cavalry_mod: "Caballería"
 STATIC_MODIFIER_DESC_ayy_cavalry_mod: "Caballería kurda —la élite de Saladino— forjada en la mejor fuerza ayubí."
 STATIC_MODIFIER_NAME_ayy_fleet_mod: "Flota"
 STATIC_MODIFIER_DESC_ayy_fleet_mod: "La flota en el Nilo y en el Mediterráneo corta las líneas de suministro de los cruzados."
 STATIC_MODIFIER_NAME_ayy_crusader_mod: "Cruzados"
 STATIC_MODIFIER_DESC_ayy_crusader_mod: "La destrucción del ejército cruzado por Saladino en Hattin repetida: el prestigio sube de modo vertiginoso."
 STATIC_MODIFIER_NAME_ayy_navy_mod: "Poder naval"
 STATIC_MODIFIER_DESC_ayy_navy_mod: "El poderoso poder naval egipcio domina el Mediterráneo y el Mar Rojo."
 STATIC_MODIFIER_NAME_ayy_sugar_mod: "Azúcar"
 STATIC_MODIFIER_DESC_ayy_sugar_mod: "La producción de azúcar de Egipto —el oro dulce del comercio medieval— monopolizada."
 STATIC_MODIFIER_NAME_ayy_iraq_ajam_mod: "Irak persa"
 STATIC_MODIFIER_DESC_ayy_iraq_ajam_mod: "Los caballos de los enviados ayubíes se ven ahora repetidamente en las ciudades montañosas de la Persia occidental."
 STATIC_MODIFIER_NAME_ayy_mosque_mod: "Mezquita"
 STATIC_MODIFIER_DESC_ayy_mosque_mod: "Mezquitas por todo el imperio unen a todos los súbditos bajo el islam suní."
 STATIC_MODIFIER_NAME_ayy_sultan_mod: "Sultán"
 STATIC_MODIFIER_DESC_ayy_sultan_mod: "Sultán de Egipto, Siria, Irak y el Hiyaz: señor de Oriente Próximo."
 STATIC_MODIFIER_NAME_ayy_saladin_mod: "Saladino"
 STATIC_MODIFIER_DESC_ayy_saladin_mod: "El Nuevo Saladino gobierna: señor de Oriente Próximo, heredero del legado de Saladino."
 STATIC_MODIFIER_NAME_ayy_rise_mod: "Ascenso de los ayubíes"
 STATIC_MODIFIER_DESC_ayy_rise_mod: "Con el nombre de Saladino en los labios, los guerreros de las tribus se reúnen uno a uno bajo los estandartes."
 ayy_mamluk_rivalry: "Enfrentamiento con los mamelucos"
 ayy_mamluk_rivalry_desc: "El Sultanato mameluco —originalmente esclavos-soldados turcos, elevados por los ayubíes, que derrocaron a la dinastía en 1250— es nuestro enemigo jurado. Contén a los mamelucos y establece la reivindicación a Alepo como cabeza de puente para recuperar Siria."
 STATIC_MODIFIER_NAME_ayy_baghdad_city_mod: "Ciudad del califa"
 STATIC_MODIFIER_DESC_ayy_baghdad_city_mod: "Bagdad renacida como centro del comercio y la cultura de la civilización islámica."
 STATIC_MODIFIER_NAME_ayy_levant_control_mod: "Control del Levante establecido"
 STATIC_MODIFIER_DESC_ayy_levant_control_mod: "Estructura administrativa en el Levante establecida, mejorando la eficiencia de la incorporación y la anexión."
 STATIC_MODIFIER_NAME_ayy_holy_cities_mod: "Guardián de las dos Ciudades Santas"
 STATIC_MODIFIER_DESC_ayy_holy_cities_mod: "Aclamada guardiana de La Meca y Medina, la corte ayubí atrae eruditos, juristas y conversos de todo el mundo."
 STATIC_MODIFIER_NAME_ayy_jerusalem_mod: "Guerra santa por la liberación de Jerusalén"
 STATIC_MODIFIER_DESC_ayy_jerusalem_mod: "La gloria de la liberación de Jerusalén da a las fuerzas ayubíes una ventaja constante en la lucha contra otras fes."
