l_spanish:
 aac_carolingian_legacy_mission_pack: "Legado carolingio: la restauración del Reino franco"
 aac_carolingian_legacy_mission_pack_DESCRIPTION:0 "En 1337, Aquisgrán es una ciudad libre dentro del Sacro Imperio Romano, cuyo alcalde es descendiente de la dinastía carolingia. Desde esta ciudad, antaño sede de la corte de Carlomagno (742-814), recupera la gloria del Reino franco. Une el Rin, la Galia y Flandes y reina como “Emperador de Occidente” con coronación papal."
 aac_carolingian_legacy_mission_pack_CRITERIA_DESCRIPTION:0 "Como Aquisgrán, unifica el Rin, la Galia e Italia para restaurar el Imperio romano de Occidente."
 aac_carolingian_legacy_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para restaurar el Reino franco."
 aac_carolingian_legacy_mission_pack_BUTTON_DETAILS:0 "¡Del trono de Carlomagno al Imperio romano de Occidente!"
 aac_throne_of_charlemagne: "El trono de Carlomagno"
 aac_throne_of_charlemagne_desc: "La catedral de Aquisgrán, construida por orden de Carlomagno y escenario de su coronación como emperador romano de Occidente en 800, ha vuelto a manos carolingias. Gobierna Aquisgrán, antaño centro de la civilización occidental, y da el primer paso hacia la restauración del Reino franco."
 aac_control_rhineland: "Controla el Rin"
 aac_control_rhineland_desc: "Colonia, Tréveris, Maguncia: las tres grandes ciudades arzobispales a lo largo del Rin fueron el centro económico, religioso y político del Reino franco. Tomarlas devuelve todo el Rin a manos carolingias."
 aac_integrate_lorraine: "Integra Lorena"
 aac_integrate_lorraine_desc: "Lorena (Lotaringia) nació como zona media cuando el Tratado de Verdún (843) dividió el Imperio franco entre los nietos de Carlomagno. Recuperar Metz y Verdún reintegra el núcleo del Imperio franco tal como era antes de la división."
 aac_conquer_hre: "Señor del Sacro Imperio Romano"
 aac_conquer_hre_desc: "Aquisgrán fue antaño escenario de las coronaciones de los emperadores del Sacro Imperio. Alzándote como señor del Imperio, reivindicas del modo más legítimo el legado imperial de Carlomagno."
 aac_control_flanders: "Controla Flandes"
 aac_control_flanders_desc: "Flandes es el centro de la mayor industria textil de la lana de Europa. Toma Bruselas y Lieja y usa el rico poder comercial e industrial de Flandes para restaurar el Reino franco."
 aac_brabant_trade: "El comercio de Brabante"
 aac_brabant_trade_desc: "La mayor red comercial de los Países Bajos se extiende desde la ciudad comercial de Bruselas, en el Ducado de Brabante. Controlar esta red comercial refuerza drásticamente los cimientos financieros del Reino franco."
 aac_push_into_france: "Marcha sobre París"
 aac_push_into_france_desc: "Carlomagno gobernó toda la Galia, incluida París, como rey de los francos. Reconquistar París venga a la dinastía de los Valois y revive el dominio carolingio de la Galia."
 aac_conquer_northern_france: "Conquista el norte de Francia"
 aac_conquer_northern_france_desc: "Reims es el lugar de coronación del Reino franco: continuando la tradición de Clodoveo I, bautizado aquí, subyuga Normandía y Picardía para establecer el dominio completo del norte de la Galia."
 aac_conquer_burgundy: "Conquista Borgoña"
 aac_conquer_burgundy_desc: "Borgoña desempeñó un papel importante en el Imperio franco como tierra rica en vino y agricultura. Subyugarla abre el camino hacia el sur de Francia."
 aac_conquer_southern_france: "Conquista el sur de Francia"
 aac_conquer_southern_france_desc: "Subyuga el Languedoc y Gascuña, y el sur de la Galia vuelve a manos carolingias. Extender el reino hasta los Pirineos realiza el dominio completo de la Galia al que aspiraba Carlomagno."
 aac_reunite_gaul: "Reunifica la Galia"
 aac_reunite_gaul_desc: "Toda la Galia, las tierras que antaño gobernó Carlomagno, unificada bajo el estandarte del Reino franco. El Imperio dividido en tres por el Tratado de Verdún se reúne por primera vez en 500 años."
 aac_develop_aachen: "Desarrolla Aquisgrán"
 aac_develop_aachen_desc: "Desarrolla esta antigua ciudad, centrada en la catedral de Aquisgrán, y haz que funcione como la nueva capital del Imperio franco. Desde este lugar donde reside el legado de Carlomagno, la luz irradia para la reconstrucción de la Europa occidental."
 aac_frankish_law: "Código de leyes franco"
 aac_frankish_law_desc: "Carlomagno desarrolló el sistema jurídico del Imperio franco por medio de los Capitulares (colección de decretos). Continuar esa tradición y establecer un nuevo código de leyes franco sienta los cimientos jurídicos del Imperio."
 aac_missi_dominici: "Missi Dominici"
 aac_missi_dominici_desc: "El sistema de los Missi Dominici (mensajeros del señor), establecido por Carlomagno: representantes reales enviados por todo el Imperio para supervisar el gobierno local. Revivir este sistema permite el gobierno centralizado del vasto imperio."
 aac_carolingian_renaissance: "Renacimiento carolingio"
 aac_carolingian_renaissance_desc: "Carlomagno promovió el “Renacimiento carolingio” invitando a eruditos como Alcuino y Eginardo. Revive la corte de Aquisgrán como centro de cultura y saber y lidera la restauración de la civilización occidental."
 aac_trade_empire: "Imperio comercial"
 aac_trade_empire_desc: "El Imperio franco, que domina las rutas comerciales del Rin, el Mosa y el Escalda, se convierte en la mayor nación comercial de la Europa occidental. Establece la supremacía comercial con múltiples centros de mercado y ricos ingresos."
 aac_frankish_levy: "Sistema de levas franco"
 aac_frankish_levy_desc: "El ejército franco de Carlomagno era el más fuerte de Europa. Revive el sistema de levas (sistema de hueste) y reconstruye el poderío militar del Imperio franco con una amplia organización militar, desde soldados campesinos hasta caballeros."
 aac_palatine_guard: "Guardia palatina"
 aac_palatine_guard_desc: "La Guardia Palatina, que protege el flanco del emperador: una fuerza de élite que continúa la tradición de la guardia del palacio de Carlomagno, encarna la gloria militar del Imperio franco."
 aac_carolingian_cavalry: "Caballería carolingia"
 aac_carolingian_cavalry_desc: "El corazón del éxito militar de Carlomagno era una poderosa caballería. Reconstruye la legendaria fuerza montada con que los caballeros de pesada armadura (chevaliers) dominaban el campo de batalla y derrotaron a sajones, ávaros y musulmanes."
 aac_kingdom_of_franks: "Reino de los francos restaurado"
 aac_kingdom_of_franks_desc: "Galia reunificada, Lorena integrada, Missi Dominici establecidos: los tres pilares se alinean, y el Reino franco queda por fin restaurado. Por primera vez desde 800, el estandarte carolingio ondea del Rin a los Pirineos."
 aac_papal_alliance: "Alianza papal"
 aac_papal_alliance_desc: "En la Navidad del año 800, en la basílica de San Pedro, en Roma, el papa León III colocó sobre Carlomagno la corona de emperador romano de Occidente. Continúa esa tradición, construye una firme alianza con el papa y establece la legitimidad como “representante de Dios”."
 aac_conquer_italy: "Conquista Italia"
 aac_conquer_italy_desc: "Carlomagno conquistó el Reino lombardo en 774 y adquirió el título de rey de Italia. Tomar Roma completa el camino hacia el renacimiento del “emperador romano de Occidente” con la aprobación papal."
 aac_western_roman_empire: "Restauración del Imperio romano de Occidente"
 aac_western_roman_empire_desc: "Aquisgrán, París, Roma: las tres ciudades del Imperio romano de Occidente reunificadas bajo el estandarte carolingio. El Imperio que Carlomagno construyó en 800 renace en la era moderna, y la “Renovatio Imperii Romani (Restauración del Imperio romano)” queda cumplida."
 aac_alsace_swabia: "Alsacia y Suabia"
 aac_alsace_swabia_desc: "Alsacia y Suabia, en la orilla oriental del Rin, son una parte importante del Imperio franco. Tomar esta tierra, que se extiende de los Vosgos a los Alpes, completa el dominio del Rin."
 aac_champagne_fairs: "Las ferias de Champaña"
 aac_champagne_fairs_desc: "Las ferias periódicas (foires) de la región de Champaña fueron las mayores reuniones comerciales de Europa. Controlar este lugar de encuentro de mercaderes italianos, flamencos y alemanes establece la supremacía comercial franca."
 aac_conquer_brittany: "Conquista Bretaña"
 aac_conquer_brittany_desc: "Bretaña es la tierra de los celtas bretones: ni siquiera Carlomagno pudo subyugar del todo esta tenaz región. Conquistar este extremo occidental pone el oeste de la Galia por completo bajo control franco y asegura una salida al Atlántico."
 aac_holy_crown: "La Santa Corona"
 aac_holy_crown_desc: "Profunda confianza con el papado y alta legitimidad: como “vicario de Cristo”, el papa aprueba la autoridad del rey de los francos. Queda establecido un gobierno reconocido por Dios y por los hombres."
 aac_dev_reims: "Desarrolla Reims"
 aac_dev_reims_desc: "Reims es el lugar del bautismo del pueblo franco: Clodoveo I recibió aquí el bautismo cristiano, y desde entonces se han celebrado aquí las coronaciones francesas. Desarrollar más esta ciudad sagrada refuerza la legitimidad carolingia."
 aac_dev_paris: "Desarrolla París"
 aac_dev_paris_desc: "París, centrada en la isla del Sena (Île de la Cité), es la mayor ciudad de la Galia. Desarrollarla como capital occidental del Imperio franco crea un sistema de dos capitales, Aquisgrán y París, que sostiene el Imperio franco."
 aac_bretagne_fleet: "La flota bretona"
 aac_bretagne_fleet_desc: "Las tradiciones navales de Bretaña y Flandes se combinan, de modo que el Imperio franco cuenta ahora con una poderosa armada que controla tanto el Atlántico como el Mar del Norte."
 aac_events.20.t: "Cae París: el regreso de los carolingios"
 aac_events.20.d: "El estandarte de los Valois es arrancado de las murallas de París y sustituido por el águila del Reino franco. Mientras suenan las campanas de Notre-Dame, el descendiente del alcalde carolingio entra en París. “Ha regresado el heredero de Carlomagno”: así lo escribirán los historiadores."
 aac_events.20.a: "¡Viva París! ¡Alcemos bien alto el estandarte carolingio!"
 aac_events.40.t: "Galia reunificada: el regreso del rey franco"
 aac_events.40.d: "Del Rin a los Pirineos, de Flandes a Provenza: toda la Galia unificada bajo el estandarte del Reino franco. El Imperio dividido en tres por el Tratado de Verdún, en 843, se reúne tras 500 años. “Dieu le veut (Dios lo quiere)”: clama el pueblo reunido en la catedral."
 aac_events.40.a: "¡Viva la Galia! ¡El Reino franco es eterno!"
 aac_events.50.t: "Proclamación de la restauración del Reino franco"
 aac_events.50.d: "Galia reunificada, Lorena integrada, Missi Dominici establecidos: los tres pilares del Reino franco están completos. Se celebra una coronación de rey franco en la catedral de Aquisgrán, y, por primera vez desde Carlomagno, nace un emperador franco. “En nombre de Carolus Magnus Rex Francorum (Carlomagno, rey de los francos), proclamamos el Imperio.”"
 aac_events.50.a: "¡Viva el Reino franco! La gloria carolingia renace: ¡teñid nuestros colores con el azul de Francia!"
 aac_events.99.t: "Restauración del Imperio romano de Occidente"
 aac_events.99.d: "Aquisgrán, París, Roma: tres ciudades reunificadas bajo el estandarte carolingio. El legendario momento en que el papa León III colocó la corona sobre Carlomagno, en la Navidad de 800, se recrea en la era moderna. “Renovatio Imperii Romani”: estas palabras quedan grabadas en la historia para siempre. ¿Cambiarás el color del Imperio al carmesí carolingio?"
 STATIC_MODIFIER_NAME_aac_rhineland_mod: "Control del Rin"
 STATIC_MODIFIER_DESC_aac_rhineland_mod: "Las tres grandes ciudades arzobispales a lo largo del Rin son tomadas: el centro económico y religioso del Imperio franco revive."
 STATIC_MODIFIER_NAME_aac_lorraine_mod: "Lorena integrada"
 STATIC_MODIFIER_DESC_aac_lorraine_mod: "Lorena, dividida por el Tratado de Verdún, es reintegrada. El símbolo de la división del Imperio franco queda resuelto."
 STATIC_MODIFIER_NAME_aac_hre_master_mod: "Señor del Sacro Imperio"
 STATIC_MODIFIER_DESC_aac_hre_master_mod: "Como señor del Imperio, el legado imperial de Carlomagno es reivindicado legítimamente."
 STATIC_MODIFIER_NAME_aac_flanders_mod: "Control de Flandes"
 STATIC_MODIFIER_DESC_aac_flanders_mod: "Flandes, el mayor centro europeo de la industria textil de la lana, cae en manos francas."
 STATIC_MODIFIER_NAME_aac_brabant_mod: "El comercio de Brabante"
 STATIC_MODIFIER_DESC_aac_brabant_mod: "La red comercial de los Países Bajos enriquece las finanzas del Reino franco."
 STATIC_MODIFIER_NAME_aac_northern_france_mod: "Norte de Francia conquistado"
 STATIC_MODIFIER_DESC_aac_northern_france_mod: "Normandía y Picardía subyugadas: dominio completo del norte de la Galia establecido."
 STATIC_MODIFIER_NAME_aac_burgundy_mod: "Borgoña conquistada"
 STATIC_MODIFIER_DESC_aac_burgundy_mod: "La Borgoña rica en vino, integrada en el Reino franco."
 STATIC_MODIFIER_NAME_aac_southern_france_mod: "Sur de Francia conquistado"
 STATIC_MODIFIER_DESC_aac_southern_france_mod: "Languedoc y Gascuña subyugadas: el sur de la Galia vuelve a manos carolingias."
 STATIC_MODIFIER_NAME_aac_gaul_unified_mod: "Galia reunificada"
 STATIC_MODIFIER_DESC_aac_gaul_unified_mod: "Por primera vez desde 843, toda la Galia unificada bajo el estandarte del Reino franco."
 STATIC_MODIFIER_NAME_aac_aachen_capital_mod: "Aquisgrán, capital imperial"
 STATIC_MODIFIER_DESC_aac_aachen_capital_mod: "La ciudad de la corte de Carlomagno, Aquisgrán, desarrollada como capital del Imperio franco."
 STATIC_MODIFIER_NAME_aac_frankish_law_mod: "Código de leyes franco"
 STATIC_MODIFIER_DESC_aac_frankish_law_mod: "Un código de leyes franco, que continúa la tradición de los Capitulares, establece los cimientos jurídicos del Imperio."
 STATIC_MODIFIER_NAME_aac_missi_dominici_mod: "Missi Dominici"
 STATIC_MODIFIER_DESC_aac_missi_dominici_mod: "Mensajeros reales, enviados por todo el Imperio, supervisan el gobierno local: gobierno centralizado realizado."
 STATIC_MODIFIER_NAME_aac_renaissance_mod: "Renacimiento carolingio"
 STATIC_MODIFIER_DESC_aac_renaissance_mod: "La corte de Aquisgrán revive como centro del saber y la cultura de la civilización occidental."
 STATIC_MODIFIER_NAME_aac_trade_empire_mod: "Imperio comercial"
 STATIC_MODIFIER_DESC_aac_trade_empire_mod: "El Imperio franco, que controla las rutas comerciales del Rin, el Mosa y el Escalda, se convierte en la mayor nación comercial de la Europa occidental."
 STATIC_MODIFIER_NAME_aac_frankish_levy_mod: "Sistema de levas franco"
 STATIC_MODIFIER_DESC_aac_frankish_levy_mod: "El sistema de hueste de Carlomagno revive: el poderío militar del Imperio franco, reconstruido."
 STATIC_MODIFIER_NAME_aac_palatine_mod: "Guardia palatina"
 STATIC_MODIFIER_DESC_aac_palatine_mod: "La guardia de élite del emperador encarna la gloria militar del Imperio franco."
 STATIC_MODIFIER_NAME_aac_cavalry_mod: "Caballería carolingia"
 STATIC_MODIFIER_DESC_aac_cavalry_mod: "Caballeros de pesada armadura dominan el campo de batalla franco. La legendaria fuerza montada de Carlomagno renace."
 STATIC_MODIFIER_NAME_aac_kingdom_of_franks_mod: "Reino franco restaurado"
 STATIC_MODIFIER_DESC_aac_kingdom_of_franks_mod: "La gloria del año 800 renace en la era moderna. El Reino franco carolingio queda oficialmente restaurado."
 STATIC_MODIFIER_NAME_aac_papal_mod: "Alianza papal"
 STATIC_MODIFIER_DESC_aac_papal_mod: "El papa aprueba la autoridad del rey de los francos. Queda establecido un gobierno reconocido por Dios y por los hombres."
 STATIC_MODIFIER_NAME_aac_italy_mod: "Italia conquistada"
 STATIC_MODIFIER_DESC_aac_italy_mod: "La conquista lombarda de Carlomagno se recrea. Italia, incluida Roma, cae bajo dominio franco."
 STATIC_MODIFIER_NAME_aac_western_roman_empire_final_mod: "Imperio romano de Occidente restaurado"
 STATIC_MODIFIER_DESC_aac_western_roman_empire_final_mod: "Renovatio Imperii Romani cumplida. Aquisgrán, París y Roma reunificadas bajo el estandarte carolingio."
 STATIC_MODIFIER_NAME_aac_alsace_mod: "Alsacia y Suabia"
 STATIC_MODIFIER_DESC_aac_alsace_mod: "Alsacia y Suabia, en el Rin oriental, integradas en el Imperio franco."
 STATIC_MODIFIER_NAME_aac_champagne_mod: "Las ferias de Champaña"
 STATIC_MODIFIER_DESC_aac_champagne_mod: "La mayor feria periódica de Europa sustenta la supremacía comercial del Imperio franco."
 STATIC_MODIFIER_NAME_aac_brittany_mod: "Bretaña conquistada"
 STATIC_MODIFIER_DESC_aac_brittany_mod: "La tenaz tierra de los celtas bretones conquistada: salida al Atlántico asegurada."
 STATIC_MODIFIER_NAME_aac_holy_crown_mod: "La Santa Corona"
 STATIC_MODIFIER_DESC_aac_holy_crown_mod: "La “Santa Corona”, aprobada por el papa y por Dios, brilla sobre el rey de los francos."
 STATIC_MODIFIER_NAME_aac_reims_mod: "Reims desarrollada"
 STATIC_MODIFIER_DESC_aac_reims_mod: "Reims, lugar del bautismo franco, desarrollada como capital religiosa."
 STATIC_MODIFIER_NAME_aac_paris_mod: "París desarrollada"
 STATIC_MODIFIER_DESC_aac_paris_mod: "París, la mayor ciudad de la Galia, desarrollada como capital occidental del Imperio franco."
 STATIC_MODIFIER_NAME_aac_fleet_mod: "La flota bretona"
 STATIC_MODIFIER_DESC_aac_fleet_mod: "Las tradiciones navales de Bretaña y Flandes se combinan: el Imperio franco controla tanto el Atlántico como el Mar del Norte."
 aac_aachen_megalopolis: "Aquisgrán, la mayor ciudad de la Europa central"
 aac_aachen_megalopolis_desc: "La ciudad de la corte de Carlomagno, Aquisgrán, queda por fin completa como la mayor metrópoli de la Europa central. Con una población de 200 000 habitantes, un avanzado desarrollo urbano y una arquitectura magnífica, Aquisgrán se establece como centro de la civilización europea."
 aac_events.10.t: "El trono de Carlomagno: el despertar carolingio"
 aac_events.10.d: "Aquisgrán, esta ciudad donde Carlomagno (742-814) mantuvo antaño su corte y fue coronado emperador romano de Occidente en 800, ha vuelto a manos carolingias. Bajo la solemne cúpula de la catedral de Aquisgrán, el trono de mármol aguarda el regreso de su señor.\n\nEl sueño de Carlomagno, llamado “Padre de Europa (Pater Europae)”: un imperio cristiano unificado del Rin a los Pirineos, de Roma al Báltico. Ha llegado la hora de realizarlo. Proclama la restauración carolingia y da el primer paso hacia la reconstrucción del Reino franco."
 aac_events.10.a: "Reinar como rey de la dinastía carolingia: proclamar la monarquía"
 aac_events.10.b: "Aún no ha llegado el momento: acumular fuerzas bajo el sistema de gobierno actual"
 STATIC_MODIFIER_NAME_aac_aachen_megalopolis_mod: "Megalópolis de Aquisgrán"
 STATIC_MODIFIER_DESC_aac_aachen_megalopolis_mod: "Hasta donde llegan las campanas de la catedral, las calles están repletas de las casas de artesanos, eruditos y mercaderes: Aquisgrán se ha convertido en la primera ciudad de Occidente."
 aac_events.50.b: "¡Viva el Reino franco! La gloria carolingia renace: ¡conservemos nuestros colores tradicionales!"
 aac_events.99.a: "Adoptar el nombre y los colores del Imperio romano de Occidente (map_ROM): proclamar al mundo el renacimiento de Roma"
 aac_events.99.b: "Proclamar el nombre de Imperio romano de Occidente, pero conservar nuestros colores actuales"
