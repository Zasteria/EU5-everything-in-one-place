 nap_mediterranean_greatest_city: "La mayor ciudad del Mediterráneo"
 nap_control_of_transumanza: "Control de la trashumancia"
 nap_university_of_frederick_ii: "El ascenso de la Universidad de Federico II"
 nap_magnificent_royal_palace: "El magnífico palacio real"
 nap_expansion_of_naples_port: "Ampliación del puerto de Nápoles"
 nap_patronage_of_diverse_arts: "Mecenazgo de las artes diversas"
 nap_dynastic_stability: "Estabilidad dinástica"
 nap_subjugation_of_epirus: "Subyugación del Epiro"
 nap_southern_renaissance: "El Renacimiento del Sur"
 nap_caserta_palace: "El Palacio de Caserta"
 nap_charles_dream: "El sueño de Carlos I"
 nap_never_die_without_seeing_naples: "Ver Nápoles y después morir"
 nap_latin_empire: "El Imperio latino"
 nap_new_capital_of_sicily_desc: "Habiendo perdido Sicilia, hemos elegido Nápoles como nuestra nueva capital, en lugar de Palermo. Esta ciudad debe ser desarrollada en una sede digna de un reino."
 nap_apulian_granary_desc: "Las fértiles llanuras de Apulia son desde hace mucho famosas como fuente de grano. Sus cosechas alimentan a nuestro pueblo y crean importante mercancía de exportación del reino. Apulia está también frente a Grecia, a través del Estrecho de Otranto, lo que la hace vital cabeza de puente."
 nap_control_of_transumanza_desc: "La trashumancia, pastoreo itinerante heredado, practicado en los Abruzos y Molise, crea la columna vertebral económica de estas regiones. Cuando el Estado administra los tratturi y protege a los pastores, la producción de lana, queso y otras mercancías prosperará."
 nap_patronage_of_diverse_arts_desc: "Sicilia fue recorrida por griegos, cartagineses, romanos, germanos, árabes, normandos y franceses, y sus culturas se mezclaron aquí. El arte arraigado en esta diversidad cultural es el verdadero arte de Sicilia."
 nap_dynastic_stability_desc: "Nunca una dinastía duradera echó raíces en Sicilia, lo que repetidamente invitó a la invasión extranjera. Estabilizar la dinastía es el camino más seguro hacia la estabilidad de la propia Sicilia."
 nap_southern_renaissance_desc: "Artistas y eruditos de todo el país, atraídos por una corte estable y digna, han traído también a Nápoles el Renacimiento: una cultura administrada por la corte, diferente de la del norte de Italia, florece ahora aquí."
 STATIC_MODIFIER_NAME_nap_new_capital_mod: "Nueva capital"
 STATIC_MODIFIER_DESC_nap_new_capital_mod: "Nápoles desarrollada en una sede digna de un reino, sustentando el crecimiento y la productividad de la ciudad."
 STATIC_MODIFIER_NAME_nap_apulian_granary_mod: "El granero de Apulia"
 STATIC_MODIFIER_DESC_nap_apulian_granary_mod: "Las fértiles tierras de Apulia sustentan de forma constante la producción de recursos aquí."
 STATIC_MODIFIER_NAME_nap_control_of_transumanza_mod: "Control de la trashumancia"
 STATIC_MODIFIER_DESC_nap_control_of_transumanza_mod: "La protección de los pastores y la gestión de los tratturi han elevado de forma constante la producción de recursos aquí."
 STATIC_MODIFIER_NAME_nap_patronage_of_diverse_arts_mod: "Mecenazgo de las artes diversas"
 STATIC_MODIFIER_DESC_nap_patronage_of_diverse_arts_mod: "Artistas arraigados en muchas culturas se han reunido en la corte, elevando el prestigio del reino y la tolerancia a otras fes."
 STATIC_MODIFIER_NAME_nap_dynastic_stability_mod: "Estabilidad dinástica"
 STATIC_MODIFIER_DESC_nap_dynastic_stability_mod: "Bajo una dinastía duradera, la legitimidad de la corona crece, y los disturbios internos se debilitan."
 STATIC_MODIFIER_NAME_nap_southern_renaissance_mod: "El Renacimiento del Sur"
 STATIC_MODIFIER_DESC_nap_southern_renaissance_mod: "Los artistas, reunidos en Nápoles, han perfeccionado su arte, y la habilidad de los nuevos artistas, que ingresan al servicio del reino, ha aumentado."
 nap_divided_kingdom_desc: "En 1282, el pueblo de Sicilia se alzó contra el gobierno de nuestra casa de Anjou y saludó a la casa de Aragón como nuevo rey. Desde entonces, el Reino de Sicilia está dividido en dos. Gobernamos el continente en torno a Nápoles, pero la recuperación de la isla de Sicilia permanece como misión histórica confiada a nuestra dinastía."
 nap_papal_blessing_desc: "Desde que Carlos I conquistó el Reino de Sicilia por invitación del papa, nuestra dinastía mantiene estrechos lazos con el papado. Preservar la confianza del papa es esencial para mantener la legitimidad de nuestro gobierno."
 nap_army_buildup_desc: "Refuerza el ejército permanente del reino en la preparación de la lucha por la recuperación de Sicilia. Un ejército fuerte será necesario también para cualquier intervención en el norte de Italia o para reprimir revueltas en el continente."
 nap_match_aragon_navy_desc: "Para oponerse a la flota aragonesa, que domina el Estrecho de Sicilia, nuestro reino debe también poseer una poderosa fuerza naval. Quien domina el mar, con el tiempo dominará Sicilia."
 nap_sword_of_the_guelphs_desc: "La lucha entre güelfos (partido papal) y gibelinos (partido imperial) sacude todo el norte de Italia. Como aliado del papa, nuestro reino puede unirse a esta lucha con la espada de los güelfos y aprovechar la oportunidad para ampliar nuestra influencia hacia el norte."
 nap_sicilian_reunification_war_desc: "Ha llegado por fin la hora de enviar nuestras tropas a la isla de Sicilia. Si conseguimos quebrar la guarnición aragonesa y tomar Palermo, el camino hacia la unificación del reino dividido se abrirá."
 nap_invest_in_provence_desc: "El Condado de Provenza, patria de la casa de Anjou, aún mantiene profundos lazos con nuestra dinastía. Invertir aquí creará una cabeza de puente en el oeste, al tiempo que refuerza nuestros lazos con la patria de los antepasados."
 STATIC_MODIFIER_NAME_nap_papal_blessing_mod: "Apoyo papal"
 STATIC_MODIFIER_DESC_nap_papal_blessing_mod: "Por medio de nuestros estrechos lazos con el papado, nuestra influencia religiosa crece continuamente."
 STATIC_MODIFIER_NAME_nap_army_buildup_mod: "Ejército real reorganizado"
 STATIC_MODIFIER_DESC_nap_army_buildup_mod: "El ejército real reorganizado ostenta alta moral y abundantes reservas de efectivos."
 STATIC_MODIFIER_NAME_nap_match_aragon_navy_mod: "Flota antiaragonesa"
 STATIC_MODIFIER_DESC_nap_match_aragon_navy_mod: "La flota real, construida para oponerse a Aragón, ostenta alta moral y rápido movimiento."
 STATIC_MODIFIER_NAME_nap_sword_of_the_guelphs_mod: "La espada de los güelfos"
 STATIC_MODIFIER_DESC_nap_sword_of_the_guelphs_mod: "Habiéndose implicado en la disputa del norte de Italia con la espada del papado, nuestro ejército ha ganado pericia en asedios y disciplina."
 STATIC_MODIFIER_NAME_nap_sicilian_reunification_war_mod: "La guerra de unificación de Sicilia"
 STATIC_MODIFIER_DESC_nap_sicilian_reunification_war_mod: "Habiendo pasado por la feroz guerra por Sicilia, el ejército real puede levantar más efectivos, y el peso de la guerra recae más ligero sobre el reino."
 STATIC_MODIFIER_NAME_nap_invest_in_provence_mod: "Inversión en Provenza"
 STATIC_MODIFIER_DESC_nap_invest_in_provence_mod: "Para la casa de Anjou, Provenza era “hogar”. Habiendo perdido Nápoles, el rey René pasó el resto de su vida en Provenza, y Aix-en-Provence se convirtió en centro cultural. Los lazos entre Nápoles y Provenza son profundos, forjados por la sangre y la historia de la casa de Anjou."
 nap_events.1.t: "Un reino dividido en dos"
 nap_events.1.d: "En 1282, en la revuelta conocida como las Vísperas Sicilianas, el pueblo de Sicilia derrocó el gobierno de la casa de Anjou. Incapaz de soportar por más tiempo la tiranía de los funcionarios enviados desde Francia, el pueblo de la isla se alzó como un solo hombre al son de las campanas del atardecer y expulsó a los franceses de nuestras costas. Saludamos al rey Pedro III de Aragón como nuevo gobernante, y el Reino de Sicilia quedó así dividido en dos. Más allá del estrecho, en el continente con centro en Nápoles, el rey de la casa de Anjou aún se titula “rey de Sicilia”. Solo nosotros somos los legítimos reyes de esta isla. La rivalidad entre nuestros dos reinos continúa hasta hoy."
 nap_events.1.a: "Entendido"
 nap_cross_the_strait_of_otranto_desc: "El Estrecho de Otranto, de solo 70 kilómetros de ancho, es la puerta marítima entre la península itálica y la balcánica. Si lo cruzamos y establecemos una cabeza de puente en Albania, nuestras flotas y barcos mercantes ganarán camino más al este."
 nap_influence_over_the_papacy_desc: "Si profundizamos nuestros lazos con el papado, manteniendo la estabilidad interna, nuestra dinastía ganará sobre la Santa Sede una influencia imposible de no notar."
 nap_the_bells_fall_silent_desc: "La isla de Sicilia es de nuevo nuestra, y el reino dividido, unificado. Debemos consolidar nuestro gobierno con cuidado, para que las “campanas” que antaño rompieron el reino jamás vuelvan a sonar."
 nap_defeat_of_aragon_desc: "Privada de su posesión siciliana, la casa de Aragón ya no es la amenaza a nuestro reino que fue antaño. Si la propia Aragón cae o su corona es traída a nuestra suzeranía, la antigua rivalidad a través del Mediterráneo podrá por fin ser terminada."
 nap_expand_influence_in_southern_france_desc: "Desde nuestra cabeza de puente en Provenza, nuestra influencia se extiende ahora río Ródano arriba hasta Lyon. Nuestra presencia en todo el sur de Francia continúa creciendo."
 nap_western_mediterranean_hegemony_desc: "Si conseguimos tomar Cerdeña y las Baleares, dos grandes baluartes del Mediterráneo occidental, nuestras flotas dominarán las aguas de Génova a Iberia, haciéndonos incontestados señores del mar occidental."
 STATIC_MODIFIER_NAME_nap_cross_the_strait_of_otranto_mod: "Cabeza de puente más allá de Otranto"
 STATIC_MODIFIER_DESC_nap_cross_the_strait_of_otranto_mod: "Nuestra cabeza de puente en Albania permite que nuestras flotas y barcos mercantes naveguen más lejos."
 STATIC_MODIFIER_NAME_nap_influence_over_the_papacy_mod: "Influencia sobre el papado"
 STATIC_MODIFIER_DESC_nap_influence_over_the_papacy_mod: "Nuestros lazos con el papado se han profundizado, reforzando la legitimidad de nuestro gobierno y nuestra tolerancia a herejes."
 STATIC_MODIFIER_NAME_nap_the_bells_fall_silent_mod: "Campanas silenciosas"
 STATIC_MODIFIER_DESC_nap_the_bells_fall_silent_mod: "El gobierno del reino unificado se ha estabilizado; el descontento del pueblo ha amainado, y la legitimidad de la corona ha aumentado."
 STATIC_MODIFIER_NAME_nap_defeat_of_aragon_mod: "La derrota de Aragón"
 STATIC_MODIFIER_DESC_nap_defeat_of_aragon_mod: "El conflicto entre Aragón y la casa de Anjou comenzó con las Vísperas Sicilianas de 1282 y duró más de 160 años, hasta la conquista de Nápoles por Alfonso V en 1442. Derrotar por fin a este viejo enemigo significaría completar la mayor venganza de la historia del Reino de Nápoles."
 STATIC_MODIFIER_NAME_nap_expand_influence_in_southern_france_mod: "Influencia en el sur de Francia"
 STATIC_MODIFIER_DESC_nap_expand_influence_in_southern_france_mod: "La presencia comercial y diplomática del reino por todo el sur de Francia continúa creciendo."
 STATIC_MODIFIER_NAME_nap_western_mediterranean_hegemony_mod: "Hegemonía en el Mediterráneo occidental"
 STATIC_MODIFIER_DESC_nap_western_mediterranean_hegemony_mod: "Habiendo conquistado Cerdeña y las Baleares, nuestra flota domina todo el Mediterráneo occidental, y su moral es alta."
 nap_anjou_hungary_desc: "Nuestra casa de Anjou tiene ramas más jóvenes no solo en Nápoles, sino también en Hungría. Si los lazos entre nuestros dos reinos de sangre común se profundizan, podremos encontrar también fundamento justo para reivindicar la corona húngara."
 nap_foothold_in_northern_italy_desc: "Si conseguimos asegurar una cabeza de puente en la Toscana, podremos profundizar nuestros lazos con las ricas ciudades-Estado del norte de Italia, como Florencia y Pisa, y ganar ventaja en cualquier campaña por toda la península."
 nap_crossroads_of_civilizations_desc: "El Reino de Sicilia está desde hace mucho en la encrucijada de las civilizaciones griega, romana, árabe y normanda. La enorme colección de arte, reunida en nuestra corte, es prueba de que nuestro reino es verdaderamente una encrucijada de las civilizaciones."
 nap_anjou_homeland_desc: "Ahora que Angers está asegurada, nuestra influencia alcanza hasta la patria de nuestra casa de Anjou. Este vínculo con las tierras de nuestros antepasados puede aún traernos reivindicación al propio trono francés."
 nap_french_throne_claim_desc: "La casa de Anjou nació como rama más joven de la línea real francesa. Si conseguimos asegurar la propia París o formar una unión personal con la corona francesa, nuestro rey portará tanto la corona de Francia como la de Nápoles."
 STATIC_MODIFIER_NAME_nap_foothold_in_northern_italy_mod: "Cabeza de puente en el norte de Italia"
 STATIC_MODIFIER_DESC_nap_foothold_in_northern_italy_mod: "Nuestros lazos con las ciudades de la Toscana nos permiten convertir con más eficacia ganancias militares en puntos de guerra por toda la península."
 STATIC_MODIFIER_NAME_nap_crossroads_of_civilizations_mod: "Encrucijada de las civilizaciones"
 STATIC_MODIFIER_DESC_nap_crossroads_of_civilizations_mod: "La enorme colección de arte, reunida en nuestra corte, continúa extendiendo la influencia cultural del reino en las tierras vecinas."
 STATIC_MODIFIER_NAME_nap_anjou_homeland_mod: "Las tierras natales de los Anjou"
 STATIC_MODIFIER_DESC_nap_anjou_homeland_mod: "El nombre de la casa de Anjou viene de Angers, en Francia, ciudad a orillas del Loira. Enrique II, que fundó la Inglaterra de los Plantagenet, era también conde de Anjou. Reconstruir los lazos con la patria Angers reavivaría la red angevina por toda Europa."
 STATIC_MODIFIER_NAME_nap_king_of_france_mod: "Rey de Francia"
 STATIC_MODIFIER_DESC_nap_king_of_france_mod: "La casa de Anjou, descendientes de los Capetos, asume la corona de su suzerano capeto: un giro de la historia. El título de “Rey Cristianísimo” de Francia es uno de los más honrosos de Europa, y su obtención eleva a la dinastía del sur de Italia a la cumbre política de toda la cristiandad."
 nap_mediterranean_greatest_city_desc: "La población de Nápoles ha alcanzado ahora una escala rara incluso en el Mediterráneo. Desde la Roma antigua, ninguna ciudad en este mar ha conocido tal prosperidad."
 nap_university_of_frederick_ii_desc: "La Universidad de Nápoles, fundada por Federico II, es el centro del saber del reino. Proveyéndola de salas de arte y ciencia, su fama se extenderá por toda Europa."
 nap_magnificent_royal_palace_desc: "La fundación de jardines en el palacio real es esencial para mostrar la magnificencia de la corona tanto a los súbditos como a los extranjeros. Los magníficos jardines anunciarán a todos los visitantes la prosperidad del reino."
 nap_expansion_of_naples_port_desc: "Mediante la construcción de un muelle en el puerto de Nápoles, los barcos pueden ser reparados y construidos con más eficiencia, ayudando mucho al mantenimiento y crecimiento de la flota real."
 nap_subjugation_of_epirus_desc: "Habiendo cruzado el Estrecho de Otranto y erigido una cabeza de puente, nuestras fuerzas han subyugado por fin todo el Epiro. El litoral de Albania está ahora bajo gobierno del reino."
 nap_caserta_palace_desc: "La construcción de un nuevo palacio en Caserta mostrará la magnificencia de la corona y, al mismo tiempo, dará a la familia real una sede tranquila de gobierno, lejos de la corte napolitana."
 nap_charles_dream_desc: "Carlos I soñó antaño con erigir un gran imperio en el Mediterráneo oriental, extendiendo el espíritu cruzado. Ahora, con una cabeza de puente en Morea, este sueño comienza a tomar forma de nuevo."
 nap_never_die_without_seeing_naples_desc: "Como dice el viejo proverbio, “ver Nápoles y después morir”: Nápoles se ha convertido en la ciudad que viajeros de todo el mundo desean. Su belleza y prosperidad serán discutidas por generaciones."
 nap_latin_empire_desc: "El Reino de Sicilia ya no es una mera potencia regional. En el oeste, domina el Mediterráneo; en el este, el camino de Morea a Constantinopla está abierto ante él. Ha llegado ahora la hora de proclamarse al mundo heredero del antiguo Imperio latino."
 STATIC_MODIFIER_NAME_nap_mediterranean_greatest_city_mod: "La mayor ciudad del Mediterráneo"
 STATIC_MODIFIER_DESC_nap_mediterranean_greatest_city_mod: "Nápoles se ha convertido en una de las grandes ciudades del Mediterráneo, y su productividad y crecimiento superan en mucho los de sus vecinos."
 STATIC_MODIFIER_NAME_nap_university_of_frederick_ii_mod: "La Universidad de Federico II"
 STATIC_MODIFIER_DESC_nap_university_of_frederick_ii_mod: "Los eruditos, reunidos en la universidad de Nápoles, traen al reino nuevo saber e innovación."
 STATIC_MODIFIER_NAME_nap_magnificent_royal_palace_mod: "El magnífico palacio real"
 STATIC_MODIFIER_DESC_nap_magnificent_royal_palace_mod: "Los magníficos jardines del palacio real muestran a todos el prestigio del reino y la legitimidad de la corona."
 STATIC_MODIFIER_NAME_nap_expansion_of_naples_port_mod: "Ampliación del puerto de Nápoles"
 STATIC_MODIFIER_DESC_nap_expansion_of_naples_port_mod: "La Bahía de Nápoles, con el Vesubio al fondo, funciona como puerto natural desde la Antigüedad. Las instalaciones portuarias, erigidas en la era angevina y aragonesa, se convirtieron en gran nudo del comercio mediterráneo, por donde pasaban especias orientales, grano norteafricano y lana ibérica."
 STATIC_MODIFIER_NAME_nap_subjugation_of_epirus_mod: "Subyugación del Epiro"
 STATIC_MODIFIER_DESC_nap_subjugation_of_epirus_mod: "Habiendo pasado por la campaña en el Epiro, el ejército real puede levantar más efectivos, y el peso de la guerra recae más ligero sobre el reino."
 STATIC_MODIFIER_NAME_nap_caserta_palace_mod: "El Palacio de Caserta"
 STATIC_MODIFIER_DESC_nap_caserta_palace_mod: "El Palacio de Caserta, proyectado por Vanvitelli (iniciado en 1752), ostentaba una escala que rivalizaba con Versalles y simbolizaba el prestigio del Reino de Nápoles borbónico. Más de 1200 salas, jardines de tres kilómetros, fuentes alimentadas por un acueducto: asentar la base antes de la creación de este magnífico palacio es el objetivo de esta misión."
 STATIC_MODIFIER_NAME_nap_charles_dream_mod: "El sueño de Carlos I"
 STATIC_MODIFIER_DESC_nap_charles_dream_mod: "La vieja ambición hacia el este arde de nuevo, elevando el prestigio del reino y la moral de sus tropas."
 STATIC_MODIFIER_NAME_nap_never_die_without_seeing_naples_mod: "Ver Nápoles y después morir"
 STATIC_MODIFIER_DESC_nap_never_die_without_seeing_naples_mod: "“Ver Nápoles y después morir” (Vedi Napoli e poi muori): así transmitían en palabras los viajeros europeos del siglo XVIII, pues Nápoles deslumbraba a todo visitante con el Vesubio, la magnífica vista de la bahía, las antiguas ruinas y sus animadas calles."
 STATIC_MODIFIER_NAME_nap_latin_empire_mod: "El Imperio latino"
 STATIC_MODIFIER_DESC_nap_latin_empire_mod: "La magnificencia del Imperio latino restaurado se extiende sobre el Mediterráneo, elevando el prestigio y la legitimidad del reino y fortaleciendo su mano en las negociaciones de guerra."
