l_spanish:
 nap_restoration_mission_pack: "El camino del Reino de Nápoles"
 nap_restoration_mission_pack_DESCRIPTION:0 "Habiendo perdido Sicilia, el reino busca la unificación y la reconstrucción de su poder en el Mediterráneo. Bajo la sangre y el brillo de la casa de Anjou, erige una nueva edad de oro en torno a Nápoles."
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Completa las misiones como Reino de Nápoles, trabajando por la unificación de Sicilia y por la restauración del Imperio latino."
 nap_restoration_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para seguir el camino del Reino de Nápoles."
 nap_restoration_mission_pack_BUTTON_DETAILS:0 "¡Une el Reino de Sicilia dividido e inscribe tu nombre en la historia como señor del Mediterráneo occidental y heredero del antiguo Imperio latino!"
