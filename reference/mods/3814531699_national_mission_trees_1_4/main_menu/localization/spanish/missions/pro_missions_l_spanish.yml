l_spanish:
 pro_jewel_of_occitania_mission_pack: "La Joya de Occitania"
 pro_jewel_of_occitania_mission_pack_DESCRIPTION:0 "Como descendientes de la casa capetíngia de Anjou, los condes de Provenza detentan reivindicaciones a Nápoles, Sicilia, Aragón, Hungría y Jerusalén. Desarrolla Marsella como la mayor ciudad portuaria del Mediterráneo, une Occitania y muestra al mundo los legítimos derechos hereditarios de la dinastía angevina. La gloria de “Rey de Reyes” aguarda."
 pro_jewel_of_occitania_mission_pack_CRITERIA_DESCRIPTION:0 "Como conde de Provenza, realiza los derechos hereditarios de la casa de Anjou, une Occitania y conquista Francia."
 pro_jewel_of_occitania_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para convertirte en el Rey de Reyes."
 pro_jewel_of_occitania_mission_pack_BUTTON_DETAILS:0 "¡Gobierna el mundo desde Marsella!"
 pro_house_of_anjou: "Las ambiciones de la casa de Anjou"
 pro_house_of_anjou_desc: "La casa capetíngia de Anjou floreció antaño como casa real de Sicilia, Nápoles y Hungría, pero ahora conserva solo el Condado de Provenza en el sur de Francia. Y, sin embargo, el corazón del rey René alberga sueños de muchas reivindicaciones reales. Ha llegado la hora de recuperar la gloria desde el suelo de Provenza."
 pro_statutes_of_aix: "Los Estatutos de Aix"
 pro_statutes_of_aix_desc: "Aix-en-Provence, como capital del Condado de Provenza, ha desarrollado su propio sistema jurídico, conocido como los “Estatutos de Aix”. El establecimiento del control y de la codificación jurídica desbloquea dos instituciones singulares: los Etats de Provence (Estados Generales) y el Puerto Libre de Marsella."
 pro_statutes_of_aix_unlock_tt: "Desbloquea los privilegios urbanos Estados Generales de Provenza y Puerto Libre de Marsella."
 pro_sponsor_the_arts: "Patrocina las artes"
 pro_sponsor_the_arts_desc: "El rey René es célebre como uno de los mayores mecenas del Renacimiento italiano. Invita artistas y eruditos y haz de Provenza el centro occidental de la cultura renacentista."
 pro_develop_marseille: "Desarrolla Marsella"
 pro_develop_marseille_desc: "Marsella, ciudad portuaria fundada por los antiguos griegos, es un nudo clave del comercio mediterráneo. El desarrollo de esta ciudad marca el primer paso de Provenza hacia convertirse en potencia comercial y marítima."
 pro_toulon_dockyard: "El astillero de Toulon"
 pro_toulon_dockyard_desc: "Toulon, magnífico puerto natural, es una de las mejores posiciones navales del Mediterráneo. Construye aquí un gran astillero y arsenal para hacer de ella el puerto de origen de la flota provenzal."
 pro_lords_of_the_rhone: "Señores del corredor del Ródano"
 pro_lords_of_the_rhone_desc: "El río Ródano es una vital ruta de transporte y comercio que une los Alpes con Provenza. Dominar plenamente este corredor establece a Provenza como incontestada señora del sur de Francia."
 pro_avignon_question: "La cuestión de Aviñón"
 pro_avignon_question_desc: "Aviñón, sede del papado de 1309 a 1377, aún existe como enclave papal. Trae esta ciudad a Provenza por diplomacia o por conquista."
 pro_piqure_de_marseilles: "El piqué de Marsella"
 pro_piqure_de_marseilles_desc: "El “piqué de Marsella”, un intrincado tejido acolchado, representa el refinado oficio textil de Provenza. Ampliar la producción de paño y de paño fino trae gran riqueza a Provenza."
 pro_la_marseillaise: "La Marsellesa"
 pro_la_marseillaise_desc: "La marcha cantada por los voluntarios que parten de Marsella. El ejército provenzal es ahora la más fuerte fuerza militar del sur de Francia."
 pro_claims_of_king_rene: "Las reivindicaciones del rey René"
 pro_claims_of_king_rene_desc: "El Buen Rey René fue trágicamente expulsado del trono napolitano y privado de la corona de Aragón. Pero los legítimos derechos hereditarios de la casa de Anjou no están perdidos. Ha llegado la hora de mostrar estos derechos al mundo."
 pro_king_of_naples: "Rey de Nápoles"
 pro_king_of_naples_desc: "El trono napolitano es la legítima herencia de la casa de Anjou. Recupera esta sede, arrebatada por la dinastía Trastámara de Aragón, y reconstruye el gobierno angevino en el sur de Italia."
 pro_king_of_sicily: "Rey de Sicilia"
 pro_king_of_sicily_desc: "El gran Reino de Sicilia, antaño construido por los normandos, fue también heredado por la casa de Anjou. Trae Sicilia de nuevo bajo el estandarte de Provenza."
 pro_king_of_aragon: "Rey de Aragón"
 pro_king_of_aragon_desc: "El trono aragonés está en manos del mayor rival de la casa de Anjou. Véngate de la dinastía Trastámara, que robó Nápoles, y toma el dominio de la Península Ibérica."
 pro_king_of_hungary: "Rey de Hungría"
 pro_king_of_hungary_desc: "La casa de Anjou gobernó antaño como casa real de Hungría. Recupera este trono, perdido a finales del siglo XIV, y establece influencia sobre Europa oriental."
 pro_king_of_jerusalem: "Rey de Jerusalén"
 pro_king_of_jerusalem_desc: "El título de “Rey de Jerusalén” ha sido largamente reivindicado por la casa de Anjou. Pon fin a este título vacío conquistando de hecho la Ciudad Santa y convirtiéndote en guardián del mundo cristiano."
 pro_integrate_lorraine: "Integra Lorena"
 pro_integrate_lorraine_desc: "El Ducado de Lorena es uno de los pocos títulos que la casa de Anjou logró conservar. Integra las diversas facciones y trae Lorena al pleno control provenzal."
 pro_join_the_empire: "Únete al Imperio"
 pro_join_the_empire_desc: "Unirse al Sacro Imperio Romano es una sabia elección diplomática para resguardar a Provenza de las amenazas de las grandes potencias. Alternativamente, liderar el Imperio como su archiduque es también una opción."
 pro_unite_occitania: "Une Occitania"
 pro_unite_occitania_desc: "El pueblo de lengua occitana del sur de Francia está exhausto de la Cruzada Albigense y de la Guerra de los Cien Años. Une Occitania bajo el estandarte de los condes de Provenza y libéralos del dominio francés."
 pro_gascony: "Gascuña"
 pro_gascony_desc: "Gascuña, centrada en Burdeos, es una tierra rica con lazos históricos con Inglaterra. Controlar Toulouse y Burdeos toma todo el sur de Francia."
 pro_king_of_france: "Rey de Francia"
 pro_king_of_france_desc: "El Reino de Francia ha sido largo tiempo rival de Provenza, pero ha llegado la hora de tomar su trono. Conquista París y alza el estandarte angevino sobre toda Francia."
 pro_king_of_kings: "Rey de Reyes"
 pro_king_of_kings_desc: "La casa de Anjou ha conquistado Nápoles, Sicilia, Aragón, Hungría, Jerusalén y Francia. Este imperio, que porta muchas coronas, está gobernado por el Rey de Reyes: un sueño medieval hecho realidad."
 STATIC_MODIFIER_NAME_pro_statutes_of_aix_mod: "Los Estatutos de Aix"
 STATIC_MODIFIER_DESC_pro_statutes_of_aix_mod: "Los condes de Provenza, con sede en Aix-en-Provence, desarrollaron su propio código jurídico basado en la tradición del derecho romano. Esta ley escrita codificó los derechos y deberes de la nobleza, el clero y los burgueses, haciendo de Provenza una de las regiones jurídicamente más avanzadas de la Francia medieval."
 STATIC_MODIFIER_NAME_pro_sponsor_the_arts_mod: "Mecenazgo de las artes"
 STATIC_MODIFIER_DESC_pro_sponsor_the_arts_mod: "El propio rey René empuñaba el pincel y componía poesía: un raro gobernante-artista. Su corte heredó la tradición de los trovadores de Provenza, atrayendo al mismo tiempo artistas de Flandes y de Italia. Gran parte de su reputación de “Buen Rey René” se basa en este extraordinario mecenazgo cultural."
 STATIC_MODIFIER_NAME_pro_marseille_mod: "Prosperidad de Marsella"
 STATIC_MODIFIER_DESC_pro_marseille_mod: "Fundada como Massalia por colonos griegos de Focea hacia el 600 a. C., Marsella es desde la Antigüedad un nudo del comercio mediterráneo. En tiempos de las cruzadas, sirvió de principal punto de reunión de hombres y materiales rumbo a Tierra Santa. Esta antigua ciudad portuaria es el corazón económico de Provenza."
 STATIC_MODIFIER_NAME_pro_toulon_dockyard_mod: "El astillero de Toulon"
 STATIC_MODIFIER_DESC_pro_toulon_dockyard_mod: "La bahía de Toulon, magnífico puerto natural abrigado por colinas, ofrece refugio a los navegantes desde la Antigüedad. Los condes de Provenza desarrollaron esta fortaleza natural como base naval en el siglo XV. Luis XIV construiría más tarde aquí uno de los mayores arsenales navales de Europa: un legado que ya echa raíces."
 STATIC_MODIFIER_NAME_pro_lords_of_the_rhone_mod: "Señores del corredor del Ródano"
 STATIC_MODIFIER_DESC_pro_lords_of_the_rhone_mod: "El río Ródano es, desde los tiempos romanos, la gran arteria que une el Mediterráneo con el interior de Francia. A lo largo de esta vía de agua se alzan Arlés, Aviñón e incontables ciudades comerciales, por las que han fluido durante siglos mercancías, ejércitos y peregrinos. Controlar este corredor es tener el corazón estratégico de Provenza."
 STATIC_MODIFIER_NAME_pro_avignon_question_mod: "Aviñón integrada"
 STATIC_MODIFIER_DESC_pro_avignon_question_mod: "De 1309 a 1377, siete papas residieron en Aviñón en lugar de Roma, en lo que se conoció como el “Papado de Aviñón”. Este peculiar episodio transformó Aviñón en una de las mayores ciudades diplomáticas de Europa. El recuerdo de la corte papal aún persiste en esta ciudad: su toma tiene un profundo peso simbólico para el mundo católico."
 STATIC_MODIFIER_NAME_pro_piqure_de_marseilles_mod: "El piqué de Marsella"
 STATIC_MODIFIER_DESC_pro_piqure_de_marseilles_mod: "El “piqué de Marsella”, un tejido acolchado de intrincada costura en ambas caras, conquistó Europa en los siglos XVII y XVIII. Sus raíces están en los hábiles tejedores medievales de Provenza. El paño fino exportado por el puerto de Marsella ha constituido desde hace mucho una piedra angular de la reputación comercial de Provenza."
 STATIC_MODIFIER_NAME_pro_la_marseillaise_mod: "La Marsellesa"
 STATIC_MODIFIER_DESC_pro_la_marseillaise_mod: "La canción, entonada por los voluntarios marselleses que marchaban a París durante la Revolución, será algún día el himno nacional de Francia. Pero el espíritu guerrero de Provenza es aún más antiguo: templado en las arenas de torneo de Arlés, en las cruzadas y en incontables campañas bajo el estandarte angevino por todo el Mediterráneo."
 STATIC_MODIFIER_NAME_pro_claims_of_king_rene_mod: "Las reivindicaciones del rey René"
 STATIC_MODIFIER_DESC_pro_claims_of_king_rene_mod: "El “Buen Rey René” detentaba reivindicaciones a Nápoles, Sicilia, Aragón, Hungría y Jerusalén y, sin embargo, perdió casi todas sus guerras. Aun así, su tenaz afirmación de esos títulos, mantenida durante décadas de diplomacia y mecenazgo artístico, mantuvo viva la legitimidad de la dinastía angevina en las cortes de Europa."
 STATIC_MODIFIER_NAME_pro_king_of_naples_mod: "Título de Rey de Nápoles"
 STATIC_MODIFIER_DESC_pro_king_of_naples_mod: "El Reino angevino de Nápoles, fundado por Carlos I de Anjou en 1266, fue antaño la potencia dominante del sur de Italia. Aunque Sicilia se perdió en las Vísperas Sicilianas, Nápoles permaneció como joya de la corona de las ambiciones francesas en Italia y el más tangible símbolo del poder angevino en la península."
 STATIC_MODIFIER_NAME_pro_king_of_sicily_mod: "Título de Rey de Sicilia"
 STATIC_MODIFIER_DESC_pro_king_of_sicily_mod: "Las Vísperas Sicilianas de 1282, cuando los isleños se alzaron y masacraron a sus gobernantes franceses al son de las campanas de las iglesias, expulsaron a los angevinos de Sicilia para siempre y trajeron a los aragoneses. Pero esta isla, donde antaño florecieron juntas las culturas normanda, árabe y bizantina, sigue siendo el mayor sueño inacabado de los angevinos."
 STATIC_MODIFIER_NAME_pro_king_of_aragon_mod: "Título de Rey de Aragón"
 STATIC_MODIFIER_DESC_pro_king_of_aragon_mod: "La Corona de Aragón construyó un imperio mediterráneo que abarcaba Sicilia, Cerdeña y Nápoles, y lo hizo en gran parte a expensas de los angevinos. Más de un siglo de rivalidad entre estas dos dinastías moldeó la política del Mediterráneo occidental. Arrebatar la corona de Aragón de las manos de los Trastámara es la venganza suprema."
 STATIC_MODIFIER_NAME_pro_king_of_hungary_mod: "Título de Rey de Hungría"
 STATIC_MODIFIER_DESC_pro_king_of_hungary_mod: "Cuando Carlos Roberto (Carobert) de Anjou se convirtió en rey de Hungría en 1310, una rama de la familia se estableció en Europa central como gran potencia. Bajo la dinastía angevina, Hungría vivió una de sus épocas más prósperas, antes de que los Habsburgo y los otomanos transformaran la región."
 STATIC_MODIFIER_NAME_pro_king_of_jerusalem_mod: "Título de Rey de Jerusalén"
 STATIC_MODIFIER_DESC_pro_king_of_jerusalem_mod: "Cuando Godofredo de Bouillon condujo la Primera Cruzada a la victoria en 1099, nació el Reino de Jerusalén. Perdido ante Saladino en 1187 y nunca plenamente recuperado, el título de “Rey de Jerusalén” se convirtió en reivindicación vacía, transmitida entre dinastías europeas. La casa de Anjou ha detentado largo tiempo este título: ahora se vuelve real."
 STATIC_MODIFIER_NAME_pro_integrate_lorraine_mod: "Lorena integrada"
 STATIC_MODIFIER_DESC_pro_integrate_lorraine_mod: "Lorena (Lothringen) es una frontera disputada desde que el Tratado de Verdún dividió el imperio de Carlomagno. El padre de René I, Luis II, ostentaba el Ducado de Lorena, y el propio René fue duque de Lorena antes de heredar Provenza. Este antiguo ducado une el mundo francés y el alemán."
 STATIC_MODIFIER_NAME_pro_join_the_empire_mod: "Diplomacia imperial"
 STATIC_MODIFIER_DESC_pro_join_the_empire_mod: "El Sacro Imperio Romano linda con Provenza desde hace mucho, y, a través de Lorena, la casa de Anjou ya tiene lazos con el mundo imperial. Ya sea uniéndose como miembro, ya sea liderando como archiduque, insertar a Provenza en la compleja red de alianzas del Imperio amplía enormemente su alcance diplomático."
 STATIC_MODIFIER_NAME_pro_unite_occitania_mod: "Unión de Occitania"
 STATIC_MODIFIER_DESC_pro_unite_occitania_mod: "El sur de lengua occitana fue antaño hogar de los trovadores, poetas que inventaron el arte del amor cortés y cuyas canciones se extendieron por Europa. La Cruzada Albigense del siglo XIII y la Guerra de los Cien Años destrozaron este mundo. Unir Occitania bajo Provenza es reavivar una civilización perdida."
 STATIC_MODIFIER_NAME_pro_gascony_mod: "Gascuña tomada"
 STATIC_MODIFIER_DESC_pro_gascony_mod: "Gascuña, centrada en el gran puerto vinícola de Burdeos, fue la última posesión continental significativa de Inglaterra: retenida durante tres siglos, antes de perderse en 1453. Rica en vino, lana y comercio atlántico, esta región ha sido siempre un premio. Arrancarla de la influencia inglesa completa el arco meridional de una Francia provenzal."
 STATIC_MODIFIER_NAME_pro_king_of_france_mod: "Título de Rey de Francia"
 STATIC_MODIFIER_DESC_pro_king_of_france_mod: "La dinastía capetíngia de Francia y su rama menor angevina comparten sangre común, y, sin embargo, sus caminos divergieron cuando Carlos de Anjou zarpó hacia el sur para conquistar Sicilia. Ahora la rama menor toma el trono de la línea principal. El “Rey Cristianísimo” de Francia, hijo primogénito de la Iglesia, porta la corona más prestigiosa de la cristiandad católica."
 STATIC_MODIFIER_NAME_pro_king_of_kings_mod: "Rey de Reyes"
 STATIC_MODIFIER_DESC_pro_king_of_kings_mod: "Nápoles, Sicilia, Aragón, Hungría, Jerusalén, Francia: ninguna dinastía medieval portó jamás simultáneamente tantas coronas. La casa de Anjou se ha elevado de un minúsculo condado provenzal a un imperio que se extiende del Mediterráneo al Danubio. El sueño del “Buen Rey René”, descartado como fantasía imposible, queda cumplido."
 pro_events.2.t: "Las reivindicaciones del rey René"
 pro_events.2.d: "Ha llegado la hora de proclamar los legítimos derechos hereditarios de la casa de Anjou. El Reino de Nápoles fue antaño angevino, pero se perdió en la derrota ante las fuerzas aragonesas de Alfonso V. Ahora, en nombre del rey René, disputamos esta injusta ocupación. Obtén casus belli contra Nápoles y prueba la legitimidad de la casa de Anjou por la fuerza de las armas."
 pro_events.2.a: "¡Nápoles pertenece a la casa de Anjou!"
 pro_lorraine_marriage: "Matrimonio con Lorena"
 pro_lorraine_marriage_desc: "El Ducado de Lorena es uno de los títulos que la casa de Anjou ostentó antaño. Profundiza los lazos con la casa de Lorena por medio de matrimonio diplomático y alianza, abriendo el camino a su concesión en feudo. Establece relaciones con Lorena por linaje, matrimonio o alianza."
 pro_events.3.t: "El reinado de Roberto el Sabio"
 pro_events.3.d: "En 1337, Provenza está gobernada por Roberto de Anjou (Roberto d’Angiò, h. 1277-1343), celebrado como “el Sabio”. Como rey de Nápoles, rey titular de Jerusalén y conde de Provenza, se alza como figura central de la política italiana. Campeón del partido güelfo (prosapal), que repelió invasiones imperiales, en 1336 expulsó a Juan de Bohemia de Italia. Profundo amante de las artes y del saber, respetado tanto por Petrarca como por Boccaccio, Roberto trajo una edad de oro de la cultura a Nápoles y a Provenza. Pero sus últimos años están turbados por el fracaso en recuperar Sicilia y por la crisis sucesoria. La heredera de Roberto, Juana, es joven, y el futuro de la casa de Anjou, incierto. Ha llegado la hora de continuar la voluntad de este gran rey y reconstruir la gloria de la casa de Anjou."
 pro_events.3.a: "¡Continuar la voluntad del rey Roberto y reconstruir la gloria de los Anjou!"
 pro_events.4.t: "Matrimonio con Lorena"
 pro_events.4.d: "Por medio de maniobras diplomáticas y de política matrimonial, nuestra relación con el Ducado de Lorena se ha vuelto más fuerte que nunca. Con sangre angevina y lorenesa entrelazadas, los intereses de ambas casas están profundamente ligados. Ha llegado la hora de acoger al duque de Lorena como vasallo de Provenza y poner sus recursos y su poder militar al servicio de la causa angevina."
 pro_events.4.a: "Acoger al duque de Lorena como vasallo"
 pro_events.4.b: "Preservar la independencia manteniendo la alianza"
 pro_events.5.t: "Formación del Reino de Jerusalén"
 pro_events.5.d: "La Ciudad Santa, Jerusalén, ha caído por fin bajo el estandarte de Provenza. La casa de Anjou ostenta ahora el título de “Rey de Jerusalén” tanto de nombre como de hecho, continuando la tradición cruzada. Restablece el Reino de Jerusalén (KOJ) en las posiciones clave del Levante y deja que sea gobernado como vasallo de Provenza. Este reino sagrado, fundado por primera vez por la Primera Cruzada en 1099, renace por mano de la casa de Anjou. Como guardián de la fe católica, defiende Tierra Santa contra las fuerzas islámicas."
 pro_events.5.a: "¡Restablecer el Reino de Jerusalén y dejar que sea gobernado como vasallo angevino!"
 pro_etats_de_provence_town_rights: "Etats de Provence"
 pro_etats_de_provence_town_rights_desc: "Los Estados Generales de Provenza, en los que participan nobles, clero y burgueses. Fortalecen a los tres estamentos y garantizan la autonomía regional y el gobierno consultivo. También mejoran la eficiencia del gabinete."
 pro_marseille_free_port_town_rights: "Puerto Libre de Marsella"
 pro_marseille_free_port_town_rights_desc: "Declara Marsella puerto libre. Amplía enormemente los derechos comerciales de los mercaderes y eleva el crecimiento de la población, la prosperidad y el poder de la burguesía. Solo puede concederse a Marsella."
 pro_events.6.t: "Resolución de la cuestión de Aviñón"
 pro_events.6.d: "Aviñón se ha alzado como enclave papal en territorio provenzal desde que el papado residió allí en 1309. Cuando el papa Gregorio XI regresó a Roma en 1377, la ciudad permaneció como reducto papal, clavando una cuña en las tierras provenzales que el conde de Provenza ha resentido largo tiempo. Ahora, con las relaciones con el papado en orden, ha surgido la oportunidad de resolver pacíficamente la cuestión de Aviñón. El papa acepta ceder Aviñón a Provenza a cambio de una compensación adecuada."
 pro_events.6.a: "Aviñón pertenece a Provenza"
