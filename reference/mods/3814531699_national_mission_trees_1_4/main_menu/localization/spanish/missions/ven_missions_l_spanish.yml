l_spanish:
 VEN_DOGES_PALACE_EVENT_OCCURRED: "El evento “Ampliación del Palacio Ducal” ha ocurrido"
 ven_mainland_food_crisis: "Crisis alimentaria del continente"
 ven_mainland_food_crisis_desc: "Venecia, ciudad construida sobre la laguna, depende del suministro de grano del continente. Construye una red estable de abastecimiento de alimentos."
 ven_scaliger_war: "Guerra contra los della Scala"
 ven_scaliger_war_desc: "Derrota a la casa della Scala, que gobierna Verona, y asegura Treviso y Vicenza."
 ven_mainland_consolidation: "Consolidación del continente"
 ven_mainland_consolidation_desc: "Incorpora administrativamente las tierras continentales recién conquistadas y estabiliza las relaciones con la nobleza y las instituciones de gobierno."
 ven_terraferma_expansion: "Expansión de la Terraferma"
 ven_terraferma_expansion_desc: "Conquista Verona y Bérgamo y amplía aún más las posesiones continentales de la Terraferma."
 ven_warehouse_expansion: "Ampliación de los almacenes"
 ven_warehouse_expansion_desc: "Amplía las instalaciones de almacenamiento de Venecia para dar cuenta del volumen creciente del comercio."
 ven_piazza_san_marco: "Desarrollo de la Plaza de San Marcos"
 ven_piazza_san_marco_desc: "Desarrolla la Plaza de San Marcos, símbolo de la República, para multiplicar el prestigio de la nobleza."
 ven_canal_administration: "Administración de los canales"
 ven_canal_administration_desc: "Mejora la red de canales que atraviesa Venecia para aumentar la eficiencia de las operaciones marítimas."
 ven_fondaco: "El Fondaco"
 ven_fondaco_desc: "Erige una red de casas comerciales (Fondaci) para mercaderes extranjeros y amplía los puestos comerciales."
 ven_bridge_of_wealth: "El Puente de la Riqueza"
 ven_bridge_of_wealth_desc: "Un flujo ininterrumpido de mercaderes cruza el puente hasta el Fondaco. Desarrolla el distrito comercial en torno a este puente y deja que la corriente de riqueza siga creciendo."
 ven_doges_palace: "Renovación del Palacio Ducal"
 ven_doges_palace_desc: "Desarrolla el Palacio Ducal, símbolo de la autoridad del dux, para reforzar la estructura de gobierno de la República."
 ven_doges_palace_event_occurred_tt: "Se ha usado la decisión «Ampliar el Palacio Ducal»"
 ven_arsenal: "El Arsenale di Venezia"
 ven_arsenal_desc: "Amplía el astillero estatal, el Arsenale, y eleva la capacidad de construcción naval de la República a nivel mundial."
 ven_marciana_library: "La Biblioteca Marciana"
 ven_marciana_library_desc: "Erige una biblioteca nacional, con biblioteca y universidad, y multiplica el prestigio académico de la República."
 ven_lombardy_hegemony: "Hegemonía sobre Lombardía"
 ven_lombardy_hegemony_desc: "Con el estandarte de la República sobre los mercados de Milán, los mercaderes de toda Lombardía reconocen al nuevo señor."
 ven_settling_with_genoa: "Ajuste de cuentas con Génova"
 ven_settling_with_genoa_desc: "Lleva la antigua rivalidad comercial con Génova a un desenlace definitivo. Toma su puerto de origen o borra Génova del mapa por completo."
 ven_city_of_water: "La ciudad del agua"
 ven_city_of_water_desc: "Concluye la ciudad de la laguna, Venecia, como ciudad de riqueza inigualable, entretejida de vías de agua y comercio."
 ven_secure_ferrara: "Asegura Ferrara"
 ven_secure_ferrara_desc: "Toma Ferrara, gobernada por la casa d’Este, y obtén una cabeza de puente en la llanura padana."
 ven_northern_expansion: "Expansión hacia el norte"
 ven_northern_expansion_desc: "Asegura Trento y Údine e impulsa la expansión hacia el norte, con la mirada puesta en los pasos alpinos."
 ven_papal_conflict: "Conflicto con los Estados Pontificios"
 ven_papal_conflict_desc: "Crece la tensión con los Estados Pontificios por el estatus de Ferrara. Supera este conflicto."
 ven_alpine_trade: "Comercio transalpino"
 ven_alpine_trade_desc: "Las caravanas que cruzan los pasos alpinos ya no están ligadas a un solo mercado, pues se ha alzado una vasta red comercial de múltiples centros."
 ven_render_unto_caesar: "Dad al César lo que es del César"
 ven_render_unto_caesar_desc: "Habiendo conquistado la confianza tanto del clero como de los burgueses, la autoridad de la República permanece incontestada hasta en la Ciudad Eterna, Roma."
 ven_league_of_cambrai: "Quiebra la Liga de Cambrai"
 ven_league_of_cambrai_desc: "Rompe el cerco de la Liga de Cambrai, formada por las potencias de Europa, y defiende la independencia de la República."
 ven_terraferma_completed: "Conclusión de la Terraferma"
 ven_terraferma_completed_desc: "Completa la estructura administrativa de las posesiones continentales de la Terraferma y establece la autoridad de la República sobre el norte de Italia."
 ven_italian_unity_route: "La Serenísima"
 ven_italian_unity_route_desc: "Conviértete en la principal potencia entre los Estados italianos y el centro de un nuevo orden en la península."
 ven_fleet_unification: "Preparación de las flotas"
 ven_fleet_unification_desc: "Unifica el mando de las diversas flotas de la República y mejora la eficiencia del mantenimiento de la flota."
 ven_black_sea_insurance: "Asegura el comercio del Mar Negro"
 ven_black_sea_insurance_desc: "Erige, con Negroponte como base, un sistema de escolta de las rutas comerciales hacia el Mar Negro."
 ven_secure_adriatic: "Asegura el Adriático"
 ven_secure_adriatic_desc: "Asegura Zara y Pula y trae el dominio del Adriático a manos de la República."
 ven_expel_genoa_black_sea: "Expulsa a Génova del Mar Negro"
 ven_expel_genoa_black_sea_desc: "Asegura Caffa y Tana, puestos clave del comercio del Mar Negro, y toma los intereses de Génova, la mayor rival de la República."
 ven_aegean_expansion: "Expansión en el Mar Egeo"
 ven_aegean_expansion_desc: "Asegura Creta y Naxos y amplía la cabeza de puente de la República en el Mar Egeo."
 ven_dalmatian_subjugation: "Subyugación de Dalmacia"
 ven_dalmatian_subjugation_desc: "Asegura todo el litoral croata y trae la región de Dalmacia al dominio de la República."
 ven_dominate_eastern_trade: "Domina el comercio oriental"
 ven_dominate_eastern_trade_desc: "Trae las rutas comerciales del Mar Negro y del Mediterráneo oriental al control de la República y conquista la supremacía en el comercio oriental."
 ven_greek_bridgehead: "Cabeza de puente en Grecia"
 ven_greek_bridgehead_desc: "Asegura Creta y Modón y establece una cabeza de puente en el corazón griego y en el Mar Egeo."
 ven_pearl_of_adriatic: "Reconstruye la perla del Adriático"
 ven_pearl_of_adriatic_desc: "Restaura la prosperidad de la ciudad comercial de Ragusa y trae a la República la riqueza conocida como “perla del Adriático”."
 ven_protect_corfu: "Protege Corfú"
 ven_protect_corfu_desc: "Posiciona una guarnición en Corfú, que domina la entrada del Adriático, y asegura su defensa."
 ven_occupy_cyprus: "Ocupación de Chipre"
 ven_occupy_cyprus_desc: "Asegura Lárnaca y haz de la estratégicamente importante isla de Chipre una provincia de la República."
 ven_second_conquest_of_constantinople: "La segunda conquista de Constantinopla"
 ven_second_conquest_of_constantinople_desc: "Trae, como antaño la Cuarta Cruzada, Constantinopla de nuevo al control de la República."
 ven_queen_of_the_adriatic: "La Reina del Adriático"
 ven_queen_of_the_adriatic_desc: "Completa la red comercial y defensiva sobre todo el Adriático y eleva la República al rango de “Reina del Adriático”."
 ven_pen_not_sword: "Vuélvete a la pluma, no a la espada"
 ven_pen_not_sword_desc: "Asegura los intereses de la República en el Mediterráneo oriental por diplomacia y tratados, y no por fuerza militar, y garantiza prosperidad duradera."
 ven_latin_empire: "El Imperio latino"
 ven_latin_empire_desc: "Erige el nuevo Imperio latino con centro en Constantinopla e inscribe la República en la historia como señora del Mediterráneo."
 ven_grand_strategy_mission_pack: "La gran estrategia de la república marítima"
 ven_grand_strategy_mission_pack_desc: "Una pequeña república, construida sobre la laguna, sigue dos caminos a la vez: la expansión hacia el continente y la construcción de un imperio marítimo. Completa la Terraferma, conviértete en Reina del Adriático y, por último, inscribe tu nombre en la historia como centro de Italia o heredera del Imperio latino."
 ven_grand_strategy_mission_pack_BUTTON_TOOLTIP:0 "Establece la supremacía de la República en tierra y mar."
 ven_grand_strategy_mission_pack_DESCRIPTION:0 "Una pequeña república, construida sobre la laguna, sigue dos caminos a la vez: la expansión hacia el continente y la construcción de un imperio marítimo. Inscribe tu nombre en la historia del Mediterráneo como Reina del Adriático."
 ven_grand_strategy_mission_pack_BUTTON_DETAILS:0 "Completa la Terraferma, conviértete en Reina del Adriático y heredera del Imperio latino: ¡inscribe el nombre de la República en la historia!"
 ven_grand_strategy_mission_pack_CRITERIA_DESCRIPTION:0 "Completa, como Venecia, la Terraferma y conviértete en Reina del Adriático."
 ven_events.1.t: "La caída de los della Scala"
 ven_events.1.d: "La guerra contra los tiranos della Scala, de Verona, termina con la victoria veneciana. Los ciudadanos de Treviso y Vicenza saludan a sus nuevos señores. El primer paso al continente se ha dado."
 ven_events.1.a: "Saludar a las nuevas provincias"
 ven_events.2.t: "El ascenso de la Terraferma"
 ven_events.2.d: "Verona y Bérgamo pasan al estandarte de la República. Los fértiles campos y las ciudades comerciales de la llanura lombarda refuerzan aún más el poder económico de Venecia."
 ven_events.2.a: "Apoyar el desarrollo económico de las nuevas provincias"
 ven_events.3.t: "La magnificencia del Palacio Ducal"
 ven_events.3.d: "El reconstruido Palacio Ducal está concluido, encarnando la autoridad del dux y el prestigio de la República. En sus salones, la nobleza se reúne para deliberar sobre el futuro de la República."
 ven_events.3.a: "Celebrar la conclusión del palacio"
 ven_events.4.t: "Ampliación del Arsenale"
 ven_events.4.d: "El astillero estatal, el Arsenale, ampliado, produce ahora galeras y barcos mercantes a una escala sin precedentes. El poder naval de la República alcanza nuevas alturas."
 ven_events.4.a: "Visitar el Arsenale ampliado"
 ven_events.5.t: "Conclusión de la ciudad del agua"
 ven_events.5.d: "Canales, casas comerciales, bibliotecas, astilleros: la ciudad construida sobre la laguna ha alcanzado una prosperidad sin igual en el mundo. La “ciudad del agua” se ha hecho digna de su nombre."
 ven_events.5.a: "Proclamar la conclusión de la ciudad del agua"
 ven_events.6.t: "La guerra por Ferrara"
 ven_events.6.d: "Las relaciones con los Estados Pontificios se tensan por el estatus de Ferrara. El clero condena las ambiciones de la República, pero los burgueses acogen con satisfacción la adquisición territorial."
 ven_events.6.a: "Resolver la tensión con los Estados Pontificios"
 ven_events.7.t: "Dad al César lo que es del César"
 ven_events.7.d: "La República ha esclarecido la frontera entre la prerrogativa eclesiástica y la actividad comercial secular. La autoridad de la iglesia es respetada, pero el comercio y el oficio permanecen firmemente bajo control de la República."
 ven_events.7.a: "Proclamar la confirmación de la autoridad secular"
 ven_events.8.t: "La caída de la Liga de Cambrai"
 ven_events.8.d: "La Liga de Cambrai, formada por el papa, el emperador del Sacro Imperio Romano, Francia y España, buscaba dividir la República. Pero las disputas internas llevaron al colapso de la liga, y Venecia preservó su independencia."
 ven_events.8.a: "Ver caer la liga"
 ven_events.9.t: "Terraferma concluida"
 ven_events.9.d: "Las vastas provincias del norte de Italia han sido por fin incorporadas al sistema administrativo de la República. La Terraferma se alza ahora como base inquebrantable del poder económico y militar de Venecia."
 ven_events.9.a: "Celebrar la conclusión de la Terraferma"
 ven_events.10.t: "El centro de Italia"
 ven_events.10.d: "Habiendo reunido fuerza en tierra y mar, la República ya no es una mera potencia regional de la península itálica. Los demás Estados siguen cada paso de Venecia, y el nuevo orden de la península comienza a tomar forma."
 ven_events.10.a: "Establecer la posición de liderazgo en Italia"
 ven_events.11.t: "Las puertas del Adriático"
 ven_events.11.d: "Con Zara y Pula bajo control de la República, las posiciones clave que dominan la entrada del Adriático están aseguradas. Las flotas de la República pueden ahora navegar con más confianza."
 ven_events.11.a: "Reforzar la defensa de las nuevas cabezas de puente"
 ven_events.12.t: "La retirada de Génova del Mar Negro"
 ven_events.12.d: "Génova, antigua rival de la República, ha perdido sus más importantes cabezas de puente del comercio del Mar Negro. Mercaderes venecianos comienzan a penetrar en los mercados recién abiertos."
 ven_events.12.a: "Apoyar la expansión a los nuevos mercados"
 ven_events.13.t: "Cabeza de puente en el Egeo"
 ven_events.13.d: "Con Creta y Modón aseguradas, se establece una cabeza de puente en el Mar Egeo y en el corazón griego. Los barcos mercantes de la República continúan ampliando sus rutas orientales, usando estos puertos como estaciones intermedias."
 ven_events.13.a: "Desarrollar los nuevos puertos intermedios"
 ven_events.14.t: "La perla de Chipre"
 ven_events.14.d: "Famagusta y Nicosia se han sumado a las posesiones de la República. La estratégicamente importante isla de Chipre trae a la República más riqueza con el comercio de especias, azúcar y algodón."
 ven_events.14.a: "Desarrollar la economía de Chipre"
 ven_events.15.t: "A Constantinopla, de nuevo"
 ven_events.15.d: "Por primera vez desde la Cuarta Cruzada, Venecia ha alcanzado la ocupación de Constantinopla. La memoria de la antigua división reaviva las ambiciones de la República."
 ven_events.15.a: "Construir una nueva estructura administrativa"
 ven_events.16.t: "La Reina del Adriático"
 ven_events.16.d: "La prosperidad de Ragusa, llamada “perla del Adriático”, y la firme defensa de Corfú están ahora concluidas. La República ya no es una mera potencia del Adriático: es la propia señora del mar."
 ven_events.16.a: "Asumir el título de “Reina del Adriático”"
 ven_events.17.t: "El triunfo de la pluma"
 ven_events.17.d: "La República ha asegurado sus intereses en Chipre y la región circundante no por fuerza militar, sino por diplomacia y tratados. “Vuélvete a la pluma, no a la espada”: este se convierte en el nuevo credo de la República."
 ven_events.17.a: "Celebrar el triunfo diplomático"
 ven_events.18.t: "El Imperio latino, renacido"
 ven_events.18.d: "El nuevo Imperio latino erigido con centro en Constantinopla. Las rutas comerciales del Mediterráneo, los graneros del continente, la riqueza de Oriente: todo esto está ahora en manos de Venecia. La República ha alzado un nuevo soberano vasallo, el “Imperio latino”, con capital en Constantinopla, para gobernar Tracia, Macedonia, el corazón griego, Morea y las Islas Egeas; y la pequeña república del Adriático se alza ahora ella misma como imperio. El Senado proclama al mundo el nuevo rango imperial de la República."
 ven_events.18.a: "Proclamar el establecimiento del Imperio latino"
 STATIC_MODIFIER_NAME_ven_grain_reserves: "Reservas de grano"
 STATIC_MODIFIER_DESC_ven_grain_reserves: "Grano traído del continente llena la ciudad de la laguna y trae alivio a su pueblo."
 STATIC_MODIFIER_NAME_ven_scaliger_victory: "Victoria en la guerra contra los della Scala"
 STATIC_MODIFIER_DESC_ven_scaliger_victory: "Habiendo aplastado a los tiranos de Verona, los soldados llevan nueva confianza a las campañas continentales que vendrán."
 STATIC_MODIFIER_NAME_ven_mainland_order: "Orden en el continente"
 STATIC_MODIFIER_DESC_ven_mainland_order: "Incluso en las provincias recién conquistadas, el derecho y la administración de la República funcionan ahora con suavidad."
 STATIC_MODIFIER_NAME_ven_terraferma_growth: "Crecimiento de la Terraferma"
 STATIC_MODIFIER_DESC_ven_terraferma_growth: "Las fértiles tierras de la Terraferma traen nueva riqueza a la República."
 STATIC_MODIFIER_NAME_ven_fondaco_supply: "Red de abastecimiento del Fondaco"
 STATIC_MODIFIER_DESC_ven_fondaco_supply: "Los almacenes ampliados se llenan sin cesar con las mercancías que llegan de todos los rincones de la red comercial."
 STATIC_MODIFIER_NAME_ven_san_marco_square: "La Plaza de San Marcos"
 STATIC_MODIFIER_DESC_ven_san_marco_square: "La Plaza de San Marcos renovada muestra a cada visitante el prestigio de la República."
 STATIC_MODIFIER_NAME_ven_canal_efficiency: "Eficiencia de los canales"
 STATIC_MODIFIER_DESC_ven_canal_efficiency: "Las embarcaciones se deslizan ahora con más fluidez por los canales mejorados que nunca."
 STATIC_MODIFIER_NAME_ven_fondaco_network: "El Fondaco"
 STATIC_MODIFIER_DESC_ven_fondaco_network: "Mercaderes extranjeros, reunidos en las casas comerciales, traen nueva vida a los mercados de la República."
 STATIC_MODIFIER_NAME_ven_bridge_of_wealth_bonus: "El Puente de la Riqueza"
 STATIC_MODIFIER_DESC_ven_bridge_of_wealth_bonus: "Las caravanas que cruzan el puente por la laguna llevan sus mercancías casi sin parar en las aduanas del camino."
 STATIC_MODIFIER_NAME_ven_doges_authority: "Autoridad del dux"
 STATIC_MODIFIER_DESC_ven_doges_authority: "La magnificencia del Palacio Ducal da peso a cada palabra del dux."
 STATIC_MODIFIER_NAME_ven_arsenal_production: "Producción del Arsenale"
 STATIC_MODIFIER_DESC_ven_arsenal_production: "En el Arsenale ampliado, los artesanos trabajan día y noche, montando galeras."
 STATIC_MODIFIER_NAME_ven_marciana_biblioteca: "La Biblioteca Marciana"
 STATIC_MODIFIER_DESC_ven_marciana_biblioteca: "La Biblioteca Marciana, proyectada por Sansovino (iniciada en 1537), es un tesoro de manuscritos antiguos, con base en el acervo de Petrarca. Manuscritos griegos traídos por eruditos que huyeron tras la caída de Constantinopla, en 1453, se reunieron en Venecia y contribuyeron mucho a difundir el Renacimiento a Occidente."
 STATIC_MODIFIER_NAME_ven_lombardy_dominance: "Hegemonía sobre Lombardía"
 STATIC_MODIFIER_DESC_ven_lombardy_dominance: "Los talleres y artesanos de Milán producen más bajo el liderazgo de la República."
 STATIC_MODIFIER_NAME_ven_genoese_settlement: "Ajuste de cuentas con Génova"
 STATIC_MODIFIER_DESC_ven_genoese_settlement: "Con la rivalidad con Génova terminada, los mercaderes de la República ganan cada vez más experiencia en negociación y comercio."
 STATIC_MODIFIER_NAME_ven_queen_of_canals: "Reina de los canales"
 STATIC_MODIFIER_DESC_ven_queen_of_canals: "Los barcos que llenan los canales y los palacios que sombrean sus orillas encantan a viajeros de todo el mundo."
 STATIC_MODIFIER_NAME_ven_ferrara_secured: "Ferrara asegurada"
 STATIC_MODIFIER_DESC_ven_ferrara_secured: "Con Ferrara asegurada, la tensión con los Estados Pontificios ya no sacude a la República como antes."
 STATIC_MODIFIER_NAME_ven_alpine_frontier: "Frontera alpina"
 STATIC_MODIFIER_DESC_ven_alpine_frontier: "Las caravanas que cruzan los pasos alpinos ya no temen los peligros del camino."
 STATIC_MODIFIER_NAME_ven_papal_tension: "Tensión con los Estados Pontificios"
 STATIC_MODIFIER_DESC_ven_papal_tension: "La tensión con el papado persiste, pero los mercaderes de la República continúan su comercio sin inmutarse."
 STATIC_MODIFIER_NAME_ven_alpine_trade_routes: "Rutas comerciales transalpinas"
 STATIC_MODIFIER_DESC_ven_alpine_trade_routes: "Las caravanas que cruzan los pasos alpinos ya no temen los empinados caminos montañosos, llevando sus mercancías."
 STATIC_MODIFIER_NAME_ven_secular_authority: "Autoridad secular"
 STATIC_MODIFIER_DESC_ven_secular_authority: "Aunque Estado católico, Venecia no dudó en someter la autoridad eclesiástica al control del Estado. La República llegó a interferir en el nombramiento del clero, la gestión de los bienes de la iglesia y la disciplina de los monasterios, negociando con el papa sin temor a la excomunión. Este secularismo, casi una “blasfemia sagrada”, daba a Venecia una flexibilidad singular."
 STATIC_MODIFIER_NAME_ven_cambrai_survived: "Liga de Cambrai superada"
 STATIC_MODIFIER_DESC_ven_cambrai_survived: "Habiendo sobrevivido al cerco, los soldados y diplomáticos de la República muestran una confianza renovada."
 STATIC_MODIFIER_NAME_ven_terraferma_zenith: "El apogeo de la Terraferma"
 STATIC_MODIFIER_DESC_ven_terraferma_zenith: "Las vastas provincias del norte de Italia siguen ahora la voluntad de la República."
 STATIC_MODIFIER_NAME_ven_italian_unity_unlock: "Rango de centro de Italia"
 STATIC_MODIFIER_DESC_ven_italian_unity_unlock: "Ningún Estado de la península itálica osa actuar sin antes considerar la posición de Venecia."
 STATIC_MODIFIER_NAME_ven_unified_fleet: "Flota unificada"
 STATIC_MODIFIER_DESC_ven_unified_fleet: "La flota unificada está lista para zarpar en cualquier momento."
 STATIC_MODIFIER_NAME_ven_black_sea_protection: "Protección del comercio del Mar Negro"
 STATIC_MODIFIER_DESC_ven_black_sea_protection: "Convoyes escoltados navegan con confianza desde el puerto de Negroponte al Mar Negro."
 STATIC_MODIFIER_NAME_ven_adriatic_secured: "Adriático asegurado"
 STATIC_MODIFIER_DESC_ven_adriatic_secured: "Los puertos de Zara y Pula sirven ahora de abrigos seguros a los barcos de la República."
 STATIC_MODIFIER_NAME_ven_zadar_trade_hub: "Puesto comercial de Zadar"
 STATIC_MODIFIER_DESC_ven_zadar_trade_hub: "En el puerto reconstruido de Zadar, los barcos mercantes que cruzan el Adriático descargan su carga uno tras otro."
 STATIC_MODIFIER_NAME_ven_genoese_rivalry_won: "Victoria sobre la rivalidad genovesa"
 STATIC_MODIFIER_DESC_ven_genoese_rivalry_won: "El estandarte genovés ya no ondea sobre los puestos del comercio del Mar Negro."
 STATIC_MODIFIER_NAME_ven_aegean_dominance: "Supremacía en el Egeo"
 STATIC_MODIFIER_DESC_ven_aegean_dominance: "Barcos bajo la bandera de la República pasan sin cesar por los puertos de Creta y Naxos."
 STATIC_MODIFIER_NAME_ven_dalmatia_subdued: "Dalmacia subyugada"
 STATIC_MODIFIER_DESC_ven_dalmatia_subdued: "El litoral dálmata figura ahora en todos los mapas como posesión de la República."
 STATIC_MODIFIER_NAME_ven_eastern_trade_dominance: "Supremacía en el comercio oriental"
 STATIC_MODIFIER_DESC_ven_eastern_trade_dominance: "Las especias y sedas de Oriente pasan ahora sin esfuerzo por los mercados de Venecia."
 STATIC_MODIFIER_NAME_ven_greek_bridgehead_secured: "Cabeza de puente griega asegurada"
 STATIC_MODIFIER_DESC_ven_greek_bridgehead_secured: "Desde Creta y Modón, los barcos de la República avanzan más al este, hacia los mares griegos."
 STATIC_MODIFIER_NAME_ven_pearl_prosperity: "Prosperidad de la perla"
 STATIC_MODIFIER_DESC_ven_pearl_prosperity: "Los mercados de Ragusa vuelven a resonar con las voces de mercaderes, habiendo recuperado la antigua vitalidad."
 STATIC_MODIFIER_NAME_ven_corfu_garrison: "Guarnición de Corfú"
 STATIC_MODIFIER_DESC_ven_corfu_garrison: "La guarnición en las murallas de Corfú guarda en silencio las puertas del Adriático."
 STATIC_MODIFIER_NAME_ven_cyprus_secured: "Chipre asegurado"
 STATIC_MODIFIER_DESC_ven_cyprus_secured: "El azúcar y el algodón de los puertos de Chipre llenan los almacenes de la República."
 STATIC_MODIFIER_NAME_ven_latin_empire_foundation: "Fundación del Imperio latino"
 STATIC_MODIFIER_DESC_ven_latin_empire_foundation: "De nuevo el estandarte de los latinos ondea sobre los palacios de Constantinopla. Bajo el dominio de la República, gentes de muchas fes viven en paz silenciosa."
 STATIC_MODIFIER_NAME_ven_adriatic_queen: "Reina del Adriático"
 STATIC_MODIFIER_DESC_ven_adriatic_queen: "Como señora del Adriático, la República gana el derecho a nombrar otro almirante para comandar sus flotas."
 STATIC_MODIFIER_NAME_ven_diplomatic_mastery: "Maestría diplomática"
 STATIC_MODIFIER_DESC_ven_diplomatic_mastery: "Los enviados de la República consiguen condiciones favorables sin desenvainar jamás la espada. La hostilidad contra la República en el extranjero disminuye, y sus negociadores aprovechan su ventaja en la guerra con gran maestría."
 STATIC_MODIFIER_NAME_ven_latin_empire_unlock: "El Imperio latino"
 STATIC_MODIFIER_DESC_ven_latin_empire_unlock: "Las rutas comerciales del Mediterráneo, los graneros del continente, la riqueza de Oriente: todo esto está ahora en manos de Venecia."
 ven_italian_unity_unlock_tt: "Venecia ha completado la fundación de la unidad italiana. La Serenísima une la península itálica del Adriático a los Alpes: por primera vez desde la Roma antigua, toda Italia es gobernada bajo un solo estandarte."
 ven_latin_empire_unlock_tt: "El Imperio latino (LAT), con capital en Constantinopla, fundado como Estado vasallo bajo protección veneciana."
