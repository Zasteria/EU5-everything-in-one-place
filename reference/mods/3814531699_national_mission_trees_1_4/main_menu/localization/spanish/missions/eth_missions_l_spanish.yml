l_spanish:
 eth_ethiopia_mission_pack: "El Nuevo Imperio Salomónico: una cruz que brilla en el Cuerno de África"
 eth_ethiopia_mission_pack_DESCRIPTION:0 "Bajo una dinastía que, según se dice, desciende de la reina de Saba y del rey Salomón, disputa con los mamelucos como protector de los coptos, vence en la lucha a muerte con Adal y revive la gloria de Axum para construir un nuevo imperio."
 eth_ethiopia_mission_pack_CRITERIA_DESCRIPTION:0 "Establece el imperio, reivindica la hegemonía sobre el Cuerno de África, protege a los coptos y revive la gloria de Axum."
 eth_ethiopia_mission_pack_BUTTON_TOOLTIP:0 "De fortaleza de las tierras altas a imperio que brilla sobre el Mar Rojo."
 eth_ethiopia_mission_pack_BUTTON_DETAILS:0 "“Rey de Reyes, León de Judá”: ¡como heredero de la reina de Saba, construye un nuevo Imperio Salomónico!"
 eth_negus_authority: "Establece la autoridad del Negus Negast"
 eth_negus_authority_desc: "“Rey de Reyes”: el título del Negus Negast. Que esta autoridad alcance todos los rincones del reino."
 eth_amba_geshen: "La prisión de Amba Geshen"
 eth_amba_geshen_desc: "Para evitar disputas sucesorias, los príncipes reales son confinados en la fortaleza natural de Amba Geshen: establece esta costumbre como institución."
 eth_mobile_court: "La corte itinerante de Etiopía"
 eth_mobile_court_desc: "Sin capital fija, el emperador y su ejército recorren el reino en un campamento móvil (ketema): establece este singular estilo de gobierno como institución del Estado."
 eth_coptic_church: "Protege la Iglesia ortodoxa etíope"
 eth_coptic_church_desc: "La Iglesia ortodoxa etíope, bajo la autoridad de Alejandría: haz de su fe un pilar del Estado y conviértete en protector de los coptos."
 eth_gondar_founding: "Desarrolla Gondar"
 eth_gondar_founding_desc: "Gondar, llamada “el Camelot de África”: desarróllala hasta convertirla en una gran ciudad amurallada de piedra."
 eth_royal_chronicle: "Compila las Crónicas Reales"
 eth_royal_chronicle_desc: "Hereda el espíritu del “Kebra Nagast”, la crónica que registra las hazañas de los emperadores pasados, y cultiva una tradición de erudición y de registro."
 eth_feudal_levies: "El sistema de levas feudales"
 eth_feudal_levies_desc: "Establece el singular sistema militar feudal de Etiopía, en que los señores regionales conducen tropas a la convocatoria del emperador."
 eth_negus_dynasty: "La dinastía salomónica asegurada"
 eth_negus_dynasty_desc: "Con la iglesia, las crónicas, el sistema militar y la capital en su lugar, haz inquebrantable el gobierno de la dinastía salomónica."
 eth_oromo_migration: "Las migraciones oromo"
 eth_oromo_migration_desc: "En el siglo XVI, los pueblos oromo inician una gran migración: responde a este histórico movimiento de pueblos."
 eth_agaw_people: "Gobierna a los agaw"
 eth_agaw_people_desc: "Los agaw, antiguos habitantes de las tierras altas etíopes: gobiérnalos como súbditos del imperio respetando su cultura."
 eth_beta_israel: "Coexistencia con Beta Israel"
 eth_beta_israel_desc: "Beta Israel, los judíos etíopes, también conocidos como “falasha”: construye un camino de coexistencia con ellos."
 eth_horn_hegemony: "Hegemonía sobre el Cuerno de África"
 eth_horn_hegemony_desc: "Como imperio que une a los sidama, oromo, agaw y Beta Israel, reivindica la hegemonía sobre el Cuerno de África."
 eth_nubian_alliance: "Alianza con Nubia"
 eth_nubian_alliance_desc: "Makuria y Alodia, los Estados coptos del norte: forja alianzas con estos hermanos de la misma fe."
 eth_conquer_makuria: "Anexiona Makuria"
 eth_conquer_makuria_desc: "Makuria, el reino copto que antaño floreció a lo largo del Nilo: protege o anexiona este Estado ahora en declive."
 eth_conquer_alodia: "Anexiona Alodia"
 eth_conquer_alodia_desc: "Alodia, el reino copto de la Nubia meridional: trae esta tierra al dominio de Etiopía."
 eth_sudan_dominion: "Establece el dominio sobre Sudán"
 eth_sudan_dominion_desc: "Del valle del Nilo al desierto de Nubia: establece el dominio etíope sobre esta vasta tierra."
 eth_mamluk_rivalry: "Rivalidad con los mamelucos"
 eth_mamluk_rivalry_desc: "El Sultanato mameluco, que gobierna Egipto: como protector de los coptos, zanja la rivalidad con ellos."
 eth_liberate_jerusalem: "Libera Jerusalén"
 eth_liberate_jerusalem_desc: "La Ciudad Santa de Jerusalén: libera esta tierra para proteger los derechos de culto de los coptos."
 eth_coptic_patriarchate: "Somete el patriarcado copto"
 eth_coptic_patriarchate_desc: "El Patriarcado copto de Alejandría: trae su autoridad bajo control etíope."
 eth_protector_of_copts: "Protector de los coptos"
 eth_protector_of_copts_desc: "Para los coptos dispersos por el mundo, el emperador etíope es su último protector: cumple este papel."
 eth_adal_wars: "Las guerras de Adal"
 eth_adal_wars_desc: "El Sultanato de Adal, el Estado islámico de la costa del Mar Rojo: afronta la guerra con este rival de siempre."
 eth_conquer_zeila: "Conquista Zeila"
 eth_conquer_zeila_desc: "Zeila, vital ciudad portuaria de Adal: conquístala y obtén un punto de apoyo en el comercio del Mar Rojo."
 eth_conquer_harar: "Conquista Harar"
 eth_conquer_harar_desc: "Harar, centro del saber islámico: conquista esta ciudad santa."
 eth_conquer_adal: "Conquista Adal"
 eth_conquer_adal_desc: "Pon fin a la amenaza de “Ahmad el Zurdo” (Gragn) y conquista al rival de siempre, el Sultanato de Adal."
 eth_somali_coast: "Asegura la costa somalí"
 eth_somali_coast_desc: "El litoral somalí: barre los restos de Adal y asegura esta tierra."
 eth_red_sea_access: "Acceso al Mar Rojo"
 eth_red_sea_access_desc: "Asegura el puerto de Massawa y abre el camino al mar, largamente esperado, para la Etiopía sin litoral."
 eth_portuguese_contact: "Contacto con los portugueses"
 eth_portuguese_contact_desc: "Los portugueses, en busca de la legendaria tierra del “Preste Juan”: el contacto con ellos trae a Etiopía una nueva era."
 eth_massawa_port: "Desarrolla el puerto de Massawa"
 eth_massawa_port_desc: "Massawa, la ciudad portuaria del Mar Rojo: desarróllala como puerta del comercio exterior."
 eth_firearms_adoption: "Adopta las armas de fuego"
 eth_firearms_adoption_desc: "Con apoyo portugués, introduce mosquetes y cañones en el ejército etíope."
 eth_european_trade: "Comercio con Europa"
 eth_european_trade_desc: "Por medio de Massawa, reanima el comercio con las naciones de Europa."
 eth_modernize_army: "Moderniza el ejército"
 eth_modernize_army_desc: "Apoyándote en las armas de fuego y en el comercio europeo, transforma el ejército etíope en una fuerza militar moderna."
 eth_aksum_heritage: "El legado de Axum"
 eth_aksum_heritage_desc: "El Imperio axumita, que antaño floreció por el comercio del Mar Rojo: asegura su ciudad santa y hereda la memoria de su gloria."
 eth_reclaim_aksum: "Revive Tigray"
 eth_reclaim_aksum_desc: "Tigray, cuna del Imperio axumita: revive esta región como territorio núcleo del imperio."
 eth_red_sea_empire: "Reconstruye el imperio del Mar Rojo"
 eth_red_sea_empire_desc: "El imperio comercial del Mar Rojo que antaño construyó Axum: revívelo en la era presente."
 eth_horn_unification: "Unifica el Cuerno de África"
 eth_horn_unification_desc: "Mediante la integración de los pueblos cusitas y el renacimiento del imperio del Mar Rojo, une todo el Cuerno de África bajo el estandarte de Etiopía."
 eth_new_solomonic_empire: "El Nuevo Imperio Salomónico"
 eth_new_solomonic_empire_desc: "Protector de los coptos, un ejército modernizado y un Cuerno de África unificado: el linaje de la reina de Saba y del rey Salomón queda aquí concluido como un nuevo imperio."
 eth_events.1.t: "Jerusalén liberada"
 eth_events.1.d: "La Ciudad Santa de Jerusalén ha vuelto a manos coptas. Para los hermanos dispersos por el mundo, este día será recordado para siempre."
 eth_events.1.a: "¡Gloria a Dios!"
 eth_events.99.t: "Proclamación del Nuevo Imperio Salomónico"
 eth_events.99.d: "Un pequeño reino de las tierras altas ha renacido como un gran imperio: protector de los coptos, señor del Mar Rojo, gobernante del Cuerno de África. El linaje de la reina de Saba y del rey Salomón queda aquí concluido."
 eth_events.99.a: "¡Gloria a Etiopía! ¡Viva el Nuevo Imperio Salomónico!"
 STATIC_MODIFIER_NAME_eth_negus_mod: "Autoridad del Negus establecida"
 STATIC_MODIFIER_DESC_eth_negus_mod: "La autoridad del emperador alcanza el reino, elevando la legitimidad del gobierno."
 STATIC_MODIFIER_NAME_eth_amba_geshen_mod: "La prisión de Amba Geshen"
 STATIC_MODIFIER_DESC_eth_amba_geshen_mod: "En lo alto de los acantilados de Amba Geshen, los jóvenes príncipes de sangre envejecen en silencio, sin que se les permita jamás codiciar el trono."
 STATIC_MODIFIER_NAME_eth_coptic_church_mod: "Iglesia ortodoxa protegida"
 STATIC_MODIFIER_DESC_eth_coptic_church_mod: "Las campanas de la Iglesia Tewahedo suenan de valle en valle por las tierras altas, y hasta pueblos de otras fes se detienen a oírlas."
 STATIC_MODIFIER_NAME_eth_gondar_mod: "Gondar desarrollada"
 STATIC_MODIFIER_DESC_eth_gondar_mod: "La ciudad de murallas de piedra se ha convertido en símbolo de la prosperidad del reino."
 STATIC_MODIFIER_NAME_eth_chronicle_mod: "Crónicas Reales compiladas"
 STATIC_MODIFIER_DESC_eth_chronicle_mod: "En los tenues scriptoria de los monasterios, las plumas de los escribas que copian las crónicas en ge’ez no descansan jamás."
 STATIC_MODIFIER_NAME_eth_levies_mod: "El sistema de levas feudales"
 STATIC_MODIFIER_DESC_eth_levies_mod: "Al sonido de los tambores, los señores de las tierras altas se reúnen, cada uno al frente de sus hombres bajo su propio estandarte."
 STATIC_MODIFIER_NAME_eth_dynasty_mod: "Dinastía asegurada"
 STATIC_MODIFIER_DESC_eth_dynasty_mod: "El orgullo de descender del rey Salomón y de la reina de Saba hace venerado el nombre de la dinastía entre todos los pueblos."
 STATIC_MODIFIER_NAME_eth_horn_hegemony_mod: "Hegemonía sobre el Cuerno"
 STATIC_MODIFIER_DESC_eth_horn_hegemony_mod: "De las tierras altas abisinias a las tierras bajas del Cuerno, pueblos que hablan incontables lenguas pagan tributo en nombre de un solo rey."
 STATIC_MODIFIER_NAME_eth_nubian_mod: "Alianza con Nubia"
 STATIC_MODIFIER_DESC_eth_nubian_mod: "Los enviados que llegan de nuestros hermanos del norte de Nubia son calurosamente recibidos como quienes comparten la misma fe de la cruz."
 STATIC_MODIFIER_NAME_eth_makuria_mod: "Makuria anexionada"
 STATIC_MODIFIER_DESC_eth_makuria_mod: "La integración de la Makuria anexionada avanza."
 STATIC_MODIFIER_NAME_eth_alodia_mod: "Alodia anexionada"
 STATIC_MODIFIER_DESC_eth_alodia_mod: "La integración de la Alodia anexionada avanza."
 STATIC_MODIFIER_NAME_eth_sudan_mod: "Dominio sobre Sudán"
 STATIC_MODIFIER_DESC_eth_sudan_mod: "Caravanas cargadas de grano y oro suben sin pausa desde las llanuras de Sudán a lo largo del Nilo."
 STATIC_MODIFIER_NAME_eth_mamluk_rivalry_mod: "Rivalidad con los mamelucos"
 STATIC_MODIFIER_DESC_eth_mamluk_rivalry_mod: "Tras cruzar espadas con la caballería mameluca, los soldados de las tierras altas se han templado en guerreros veteranos."
 STATIC_MODIFIER_NAME_eth_patriarchate_mod: "El patriarcado copto"
 STATIC_MODIFIER_DESC_eth_patriarchate_mod: "Los sacerdotes de las tierras altas habían esperado largo tiempo el día en que un patriarca propio impartiera la bendición."
 STATIC_MODIFIER_NAME_eth_protector_mod: "Protector de los coptos"
 STATIC_MODIFIER_DESC_eth_protector_mod: "La reputación de protector ayuda a mejorar las relaciones diplomáticas."
 STATIC_MODIFIER_NAME_eth_adal_wars_mod: "Las guerras de Adal"
 STATIC_MODIFIER_DESC_eth_adal_wars_mod: "Los soldados que sobrevivieron a las interminables guerras con Adal llevan sus cicatrices como medallas de honor."
 STATIC_MODIFIER_NAME_eth_zeila_mod: "Zeila conquistada"
 STATIC_MODIFIER_DESC_eth_zeila_mod: "De los almacenes del puerto de Zeila, las especias y perlas del Mar Rojo son llevadas hasta la corte de las tierras altas."
 STATIC_MODIFIER_NAME_eth_harar_mod: "Harar conquistada"
 STATIC_MODIFIER_DESC_eth_harar_mod: "Cuando el estandarte del rey se alzó sobre las murallas de Harar, los soldados de las tierras altas hablaron a una sola voz de la victoria que había ganado una ciudad santa."
 STATIC_MODIFIER_NAME_eth_conquer_adal_mod: "Adal conquistada"
 STATIC_MODIFIER_DESC_eth_conquer_adal_mod: "Incluso en las aldeas de Adal, nuestro viejo rival, los funcionarios del rey han empezado a abrir sus libros de impuestos."
 STATIC_MODIFIER_NAME_eth_somali_coast_mod: "Costa somalí asegurada"
 STATIC_MODIFIER_DESC_eth_somali_coast_mod: "En los puertos de la costa somalí, los barcos cargados de incienso y marfil echan anclas sin cesar."
 STATIC_MODIFIER_NAME_eth_red_sea_access_mod: "Acceso al Mar Rojo"
 STATIC_MODIFIER_DESC_eth_red_sea_access_mod: "Con el camino al Mar Rojo, largamente cerrado, ahora abierto, los ojos de los mercaderes de las tierras altas se vuelven hacia el horizonte."
 STATIC_MODIFIER_NAME_eth_portuguese_mod: "Contacto con los portugueses"
 STATIC_MODIFIER_DESC_eth_portuguese_mod: "Enviados portugueses de Goa son recibidos con honor en la corte de las tierras altas, portando raros regalos."
 STATIC_MODIFIER_NAME_eth_massawa_mod: "Massawa desarrollada"
 STATIC_MODIFIER_DESC_eth_massawa_mod: "El puerto de Massawa florece como puerta del comercio."
 STATIC_MODIFIER_NAME_eth_firearms_mod: "Armas de fuego adoptadas"
 STATIC_MODIFIER_DESC_eth_firearms_mod: "El trueno de mosquetes y cañones en los valles proclama que la era de la lanza y el escudo ha terminado."
 STATIC_MODIFIER_NAME_eth_european_trade_mod: "Comercio con Europa"
 STATIC_MODIFIER_DESC_eth_european_trade_mod: "Los mercaderes europeos que desembarcan en el puerto de Massawa compran el oro y el almizcle de las tierras altas a cambio de moneda de plata."
 STATIC_MODIFIER_NAME_eth_modernize_mod: "Ejército modernizado"
 STATIC_MODIFIER_DESC_eth_modernize_mod: "Soldados con uniformes de nuevo estilo marchan cantando las viejas canciones de guerra."
 STATIC_MODIFIER_NAME_eth_aksum_heritage_mod: "El legado de Axum"
 STATIC_MODIFIER_DESC_eth_aksum_heritage_mod: "Quienes se plantan ante las estelas de Axum recuerdan que los nombres de mil años de reyes aún corren por su propia sangre."
 STATIC_MODIFIER_NAME_eth_reclaim_aksum_mod: "Tigray revivida"
 STATIC_MODIFIER_DESC_eth_reclaim_aksum_mod: "Los viejos campos y mercados de Axum han respirado de nuevo, y los funcionarios del rey vuelven a contar la cosecha."
 STATIC_MODIFIER_NAME_eth_red_sea_empire_mod: "Imperio del Mar Rojo reconstruido"
 STATIC_MODIFIER_DESC_eth_red_sea_empire_mod: "Con la reconstrucción del imperio comercial que une los puertos del Mar Rojo, las flotas del rey despliegan sus velas a lo largo de toda la costa."
 STATIC_MODIFIER_NAME_eth_horn_unification_mod: "Cuerno de África unido"
 STATIC_MODIFIER_DESC_eth_horn_unification_mod: "Cada príncipe del Cuerno de África se arrodilla ahora según el ceremonial de una sola corte."
 STATIC_MODIFIER_NAME_eth_new_solomonic_empire_mod: "El Nuevo Imperio Salomónico"
 STATIC_MODIFIER_DESC_eth_new_solomonic_empire_mod: "La conclusión del nuevo imperio ha llevado el poder nacional a su cenit."
 STATIC_MODIFIER_NAME_eth_jerusalem_mod: "Jerusalén liberada"
 STATIC_MODIFIER_DESC_eth_jerusalem_mod: "Ante el Santo Sepulcro de Jerusalén, los sacerdotes etíopes lloran al final de su larga peregrinación."
