l_spanish:
 lbv_niederbayern_mission_pack: "Legado de Landshut: el camino de la unificación de Baviera"
 lbv_niederbayern_mission_pack_DESCRIPTION:0 "Como casa de Landshut, heredera de las posesiones de Alberto I que llegaban hasta los Países Bajos, reunifica las tierras divididas de Baviera en un solo todo."
 lbv_niederbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Desarrolla Landshut y une Baviera."
 lbv_niederbayern_mission_pack_BUTTON_TOOLTIP:0 "Desarrolla Landshut y une Baviera."
 lbv_niederbayern_mission_pack_BUTTON_DETAILS:0 "¡Álzate como duque de toda Baviera!"
 lbv_straubing_holland_legacy: "Legado de Straubing-Holanda"
 lbv_straubing_holland_legacy_desc: "El legado de Alberto I, cuyas posesiones llegaban hasta los Países Bajos: como casa de Landshut, hereda la memoria de esa vasta herencia."
 lbv_secure_landshut: "Desarrolla Landshut"
 lbv_secure_landshut_desc: "Landshut, río arriba en el Isar: desarrolla esta ciudad de magnífica arquitectura gótica como centro del ducado."
 lbv_danube_trade: "Comercio del Danubio"
 lbv_danube_trade_desc: "Barcos mercantes que surcan el Danubio: aprovecha esta vía fluvial vital y asegura la riqueza del comercio."
 lbv_low_countries_ties: "Lazos con los Países Bajos"
 lbv_low_countries_ties_desc: "El legado de Alberto I, que un día gobernó Holanda, Zelanda y Henao: cultiva nuestros lazos con los Países Bajos hasta hoy."
 lbv_bavarian_ambition: "Reivindicación de una sola Baviera"
 lbv_bavarian_ambition_desc: "Desarrollo de Landshut, comercio del Danubio y lazos con los Países Bajos: construye sobre ello y cultiva la reivindicación a toda Baviera."
 lbv_reunite_bavaria: "Reunifica Baviera"
 lbv_reunite_bavaria_desc: "El ducado dividido: recupera las tierras de la Alta Baviera y reunifica Baviera en un solo todo."
 lbv_duke_of_all_bavaria: "Duque de toda Baviera"
 lbv_duke_of_all_bavaria_desc: "Bajo la casa de Landshut, toda Baviera está por fin unida bajo un solo estandarte."
 lbv_events.1.t: "Proclamación de la unidad de Baviera"
 lbv_events.1.d: "Bajo la casa de Landshut, Baviera está por fin unida en un solo todo. La era de las divisiones llega a su fin."
 lbv_events.1.a: "¡Gloria a Baviera!"
 STATIC_MODIFIER_NAME_lbv_legacy_mod: "Legado de Straubing-Holanda"
 STATIC_MODIFIER_DESC_lbv_legacy_mod: "La gloria de Alberto I, cuyas posesiones abarcaron Holanda y Henao, aún se recuerda con orgullo en la corte de Landshut."
 STATIC_MODIFIER_NAME_lbv_landshut_mod: "Landshut desarrollada"
 STATIC_MODIFIER_DESC_lbv_landshut_mod: "La ciudad de arquitectura gótica florece como centro del ducado."
 STATIC_MODIFIER_NAME_lbv_danube_mod: "Comercio del Danubio"
 STATIC_MODIFIER_DESC_lbv_danube_mod: "Las barcazas que suben y bajan el valle del Danubio descargan sin cesar sal y grano a lo largo de las orillas de la Baja Baviera."
 STATIC_MODIFIER_NAME_lbv_low_countries_mod: "Lazos con los Países Bajos"
 STATIC_MODIFIER_DESC_lbv_low_countries_mod: "Enviados y mercaderes de paños de los Países Bajos, al otro lado del Mar del Norte, son calurosamente recibidos incluso en la corte de Landshut."
 STATIC_MODIFIER_NAME_lbv_reunite_mod: "Baviera reunificada"
 STATIC_MODIFIER_DESC_lbv_reunite_mod: "Los vasallos de las dos ramas antes divididas prestan ahora juramento bajo un único estandarte."
 STATIC_MODIFIER_NAME_lbv_unify_bavaria_mod: "Duque de toda Baviera"
 STATIC_MODIFIER_DESC_lbv_unify_bavaria_mod: "Las campanas de las torres bávaras repican, proclamando el fin de las divisiones."
 lbv_unified_duchy: "Ducado unificado de Baviera"
 lbv_unified_duchy_desc: "La era de las divisiones ha terminado: como ducado unificado de Baviera, abre una nueva era."
 lbv_bavaria_unified_tt: "Se ha unificado Baviera"
 lbv_landrecht: "Derecho territorial de Baviera"
 lbv_landrecht_desc: "Una ley uniforme para el ducado unificado: introduce el código de leyes bávaro (Landrecht) y fortalece el cimiento del gobierno."
 lbv_tyrol_ambition: "Ambiciones sobre el Tirol"
 lbv_tyrol_ambition_desc: "El condado del Tirol, escondido en el abrazo de los Alpes: alimenta ambiciones sobre esa tierra."
 lbv_swabian_expansion: "Expansión en Suabia"
 lbv_swabian_expansion_desc: "Suabia, que se extiende hacia el suroeste: refuerza nuestra influencia sobre esa región."
 lbv_greater_bavaria: "Realiza la Gran Baviera"
 lbv_greater_bavaria_desc: "Código de leyes, Tirol y Suabia: construye sobre ello y realiza la Gran Baviera."
 lbv_counter_reformation_leader: "Líder de la Contrarreforma"
 lbv_counter_reformation_leader_desc: "Encarna el espíritu del Concilio de Trento y asume el liderazgo de la Contrarreforma."
 lbv_electoral_dignity: "Dignidad electoral"
 lbv_electoral_dignity_desc: "En 1623 Maximiliano I consigue por fin el puesto de elector: haz de este honor el orgullo eterno de Baviera."
 lbv_austrian_rivalry: "Rivalidad con Austria"
 lbv_austrian_rivalry_desc: "La rivalidad con la casa de Habsburgo por la hegemonía en el Imperio: acepta este desafío de nuestro gran rival."
 lbv_war_of_austrian_succession: "Guerra de Sucesión Austríaca"
 lbv_war_of_austrian_succession_desc: "La guerra por la reivindicación de Carlos VII al trono imperial: aprovecha esta guerra de sucesión para elevar el prestigio de Baviera."
 lbv_imperial_crown: "Corona imperial"
 lbv_imperial_crown_desc: "En 1742 Carlos VII, duque de Baviera, es coronado emperador del Sacro Imperio Romano: el primero que no es Habsburgo en portar la corona en siglos."
 lbv_enlightened_absolutism: "Absolutismo ilustrado"
 lbv_enlightened_absolutism_desc: "La era de la Ilustración, que venera la razón y la ciencia: introduce esta nueva corriente de pensamiento en el gobierno de Baviera."
 lbv_napoleonic_alliance: "Desafío a Francia"
 lbv_napoleonic_alliance_desc: "Europa, sacudida por la revolución y la ambición de Napoleón: Baviera refuerza su reivindicación al trono de este poderoso vecino y abre su propio camino."
 lbv_kingdom_of_bavaria: "Proclamación del Reino de Baviera"
 lbv_kingdom_of_bavaria_desc: "En 1806 el elector Maximiliano IV José se proclama rey de Baviera: la larga historia de la casa de Wittelsbach alcanza aquí un nuevo apogeo."
 lbv_events.3.t: "Corona imperial"
 lbv_events.3.d: "En 1742 Carlos VII, duque de Baviera, fue coronado emperador del Sacro Imperio Romano en la catedral de Fráncfort. Habían pasado siglos desde que alguien que no fuera Habsburgo portara la corona imperial."
 lbv_events.3.a: "¡Gloria a Su Majestad Imperial!"
 lbv_events.99.t: "Proclamación del Reino de Baviera"
 lbv_events.99.d: "En 1806 el elector Maximiliano IV José, al amparo de la Confederación del Rin, se proclamó rey de Baviera. La larga historia de la casa de Wittelsbach alcanza aquí un nuevo apogeo."
 lbv_events.99.a: "¡Viva el Reino de Baviera!"
 STATIC_MODIFIER_NAME_lbv_unified_mod: "Ducado unificado de Baviera"
 STATIC_MODIFIER_DESC_lbv_unified_mod: "El ducado ya no necesita repartir sus cortes, rentas y guerreros entre ramas rivales."
 STATIC_MODIFIER_NAME_lbv_greater_mod: "La Gran Baviera realizada"
 STATIC_MODIFIER_DESC_lbv_greater_mod: "Desde las estribaciones de los Alpes hasta las colinas de Suabia, las tierras bajo el estandarte ducal se amplían cada estación."
 STATIC_MODIFIER_NAME_lbv_counter_reformation_mod: "Líder de la Contrarreforma"
 STATIC_MODIFIER_DESC_lbv_counter_reformation_mod: "En el espíritu del Concilio de Trento, los colegios jesuitas se abren uno tras otro en las ciudades del ducado."
 STATIC_MODIFIER_NAME_lbv_succession_war_mod: "Guerra de Sucesión Austríaca"
 STATIC_MODIFIER_DESC_lbv_succession_war_mod: "Oficiales y soldados templados en los campos de batalla de la Guerra de Sucesión Austríaca forman ahora el núcleo del ejército ducal."
 STATIC_MODIFIER_NAME_lbv_imperial_crown_mod: "Corona imperial"
 STATIC_MODIFIER_DESC_lbv_imperial_crown_mod: "El recuerdo del día en que el duque de Baviera fue coronado en la catedral de Fráncfort se guarda con orgullo en el corazón de cada cortesano."
 STATIC_MODIFIER_NAME_lbv_enlightenment_mod: "Absolutismo ilustrado"
 STATIC_MODIFIER_DESC_lbv_enlightenment_mod: "En la corte, los nuevos libros que llegan de Francia difunden los ideales de la Ilustración, y el número de escuelas crece cada año."
 STATIC_MODIFIER_NAME_lbv_electoral_dignity_mod: "Dignidad electoral"
 STATIC_MODIFIER_DESC_lbv_electoral_dignity_mod: "Cuando el duque, vestido con el manto de elector, toma asiento en las elecciones imperiales, los príncipes escuchan con atención sus palabras."
 STATIC_MODIFIER_NAME_lbv_kingdom_mod: "Reino de Baviera"
 STATIC_MODIFIER_DESC_lbv_kingdom_mod: "En el palacio de Múnich retumban las salvas que celebran la coronación del primer rey de Baviera de la casa de Wittelsbach."
