l_spanish:
 mlo_biscione_mission_pack: "El legado del Biscione"
 mlo_biscione_mission_pack_DESCRIPTION:0 "El Biscione, la serpiente que devora a un hombre, adorna el escudo de los Visconti. Antaño solo una de las muchas ciudades-Estado de Lombardía, el Ducado de Milán forja ahora su propio camino en la intrincada lucha por la supremacía en el norte de Italia. Mediante el desarrollo del gobierno y de la cultura, mediante la elevación al rango de potencia líder del Norte, o mediante el mantenimiento de la posición entre las grandes potencias del papa, el emperador y Francia: la elección de qué legado erigir corresponde al duque."
 mlo_biscione_mission_pack_CRITERIA_DESCRIPTION:0 "Completa las misiones como Ducado de Milán y establece una posición dominante en el norte de Italia."
 mlo_biscione_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para heredar el legado del Biscione."
 mlo_biscione_mission_pack_BUTTON_DETAILS:0 "¡De ciudad-Estado de Lombardía al corazón de Italia!"
 mlo_expanded_domain: "Dominio ampliado"
 mlo_expanded_domain_desc: "El Ducado de Milán ha incorporado las ciudades de Lombardía y ha ampliado enormemente su territorio."
 mlo_curb_della_scala: "Contén a los della Scala"
 mlo_curb_della_scala_desc: "La creciente hegemonía de los della Scala, señores de Verona, sobre el norte de Italia debe ser contenida."
 mlo_imperial_vicariate: "El Vicariato imperial"
 mlo_imperial_vicariate_desc: "Honrado con el título de vicario imperial por el emperador del Sacro Imperio Romano, el gobierno de Milán lleva ahora la legitimidad del Imperio."
 mlo_serpent_that_devours_men: "La serpiente que devora hombres"
 mlo_serpent_that_devours_men_desc: "El Biscione, la serpiente que devora a un hombre, adorna el escudo de los Visconti. La leyenda personifica el poder de la familia y proclama una nueva era para Milán."
 mlo_state_led_enterprises: "Empresas estatales"
 mlo_state_led_enterprises_desc: "El Ducado de Milán promueve, bajo dirección estatal, el desarrollo de sus instituciones y de su cultura."
 mlo_rigorous_plague_policy: "Rigurosa política contra la peste"
 mlo_rigorous_plague_policy_desc: "Ante la peste, debe erigirse un cuidadoso sistema de cuarentena y aislamiento, para proteger al pueblo del ducado."
 mlo_duomo_di_milano: "La Catedral de Milán"
 mlo_duomo_di_milano_desc: "Avanza la construcción de la Catedral de Milán y deja que la magnificencia del ducado alcance el cielo."
 mlo_road_network_of_the_realm: "La red viaria del reino"
 mlo_road_network_of_the_realm_desc: "Desarrolla la red viaria que une todo el ducado y reanima el movimiento de personas y mercancías."
 mlo_expand_administrative_buildings: "Amplía los edificios administrativos"
 mlo_expand_administrative_buildings_desc: "Aprendiendo de las lecciones de la política contra la peste, amplía aún más las instituciones administrativas del ducado."
 mlo_embrace_the_renaissance: "Abraza el Renacimiento"
 mlo_embrace_the_renaissance_desc: "Junto a la construcción de la catedral, la corte milanesa abraza el nuevo espíritu del Renacimiento."
 mlo_the_last_supper: "La Última Cena"
 mlo_the_last_supper_desc: "Encarga a Leonardo da Vinci la pintura de la Última Cena y haz de Milán una ciudad de las artes."
 mlo_naviglio_grande_renovation: "Renovación del Naviglio Grande"
 mlo_naviglio_grande_renovation_desc: "Renueva el Naviglio Grande, canal que une Milán con la región circundante, y reanima el comercio y la agricultura."
 mlo_castello_sforzesco: "El Castello Sforzesco"
 mlo_castello_sforzesco_desc: "Amplía el Castello Sforzesco, símbolo de la magnificencia ducal, como sede del gobierno milanés."
 mlo_biblioteca_ambrosiana: "La Biblioteca Ambrosiana"
 mlo_biblioteca_ambrosiana_desc: "Erige la Biblioteca Ambrosiana para albergar el saber acumulado de los siglos y sustentar el aprendizaje."
 mlo_heart_of_italy: "Ciudad digna de ser el corazón de Italia"
 mlo_heart_of_italy_desc: "Con gobierno, oficios, arte y saber, todos floreciendo por igual, Milán se ha convertido en ciudad digna de ser el corazón de Italia."
 mlo_north_italian_ambitions: "Ambiciones en el norte de Italia"
 mlo_north_italian_ambitions_desc: "El Ducado de Milán pone sus ejércitos en movimiento para asegurar la supremacía sobre todo el norte de Italia."
 mlo_subjugate_lombardy: "Subyuga Lombardía"
 mlo_subjugate_lombardy_desc: "Trae las ciudades de Lombardía al pleno control y asegura la base del ducado."
 mlo_advance_into_piedmont: "Avanza sobre el Piamonte"
 mlo_advance_into_piedmont_desc: "Amplía la influencia hacia el oeste, rumbo al Piamonte, y opónte al poder de la casa de Saboya."
 mlo_strife_over_veneto: "Disputa por el Véneto"
 mlo_strife_over_veneto_desc: "El conflicto con Venecia y otras potencias por el control del Véneto es inevitable."
 mlo_through_emilia_and_beyond: "Por Emilia y más allá"
 mlo_through_emilia_and_beyond_desc: "Pasa por Emilia y abre el camino para la expansión hacia el sur."
 mlo_secure_liguria: "Asegura Liguria"
 mlo_secure_liguria_desc: "Asegura Liguria, incluida Génova, y obtén una cabeza de puente en el Mediterráneo."
 mlo_reach_the_coveted_sea: "Alcanza el mar codiciado"
 mlo_reach_the_coveted_sea_desc: "Milán, antaño Estado terrestre, asegura por fin acceso directo al Mediterráneo."
 mlo_topple_the_old_rival_florence: "Derriba a la antigua rival Florencia"
 mlo_topple_the_old_rival_florence_desc: "Derrota a la antigua rival Florencia y establece influencia sobre la Toscana."
 mlo_between_two_authorities: "Entre dos autoridades"
 mlo_between_two_authorities_desc: "Milán busca su propio camino, encajada entre las tres grandes potencias del papa, el emperador y el rey de Francia."
 mlo_reconcile_with_the_papacy: "Reconcíliate con el papado"
 mlo_reconcile_with_the_papacy_desc: "Mejora las relaciones con la curia romana y obtén su autoridad como apoyo."
 mlo_trust_of_the_emperor: "Conquista la confianza del emperador"
 mlo_trust_of_the_emperor_desc: "Conquista la confianza del emperador del Sacro Imperio Romano y eleva el prestigio del ducado dentro del Imperio."
 mlo_overture_to_france: "Aproximación a Francia"
 mlo_overture_to_france_desc: "Construye lazos diplomáticos con el Reino de Francia y asegura nuevas oportunidades."
 mlo_the_italian_wars: "Las guerras de Italia"
 mlo_the_italian_wars_desc: "Milán arrastrada a las guerras de Italia, donde chocan los intereses del papa, el emperador y Francia."
 mlo_isolate_papal_authority: "Aísla la autoridad papal"
 mlo_isolate_papal_authority_desc: "Habiendo sobrevivido a las guerras de Italia, separa la autoridad secular del papa de la política milanesa."
 mlo_deny_imperial_authority: "Niega la autoridad imperial"
 mlo_deny_imperial_authority_desc: "Habiendo sobrevivido a las guerras de Italia, elige el camino de gobernar el ducado sin recurrir a la autoridad imperial."
 mlo_repel_french_authority: "Repele la autoridad francesa"
 mlo_repel_french_authority_desc: "Habiendo sobrevivido a las guerras de Italia, repele la intervención francesa y preserva la independencia del ducado."
 mlo_italian_independence: "Independencia italiana"
 mlo_italian_independence_desc: "Milán ha asegurado su rango de potencia fuerte y autónoma en Italia, independiente del papa, del emperador o de Francia."
 mlo_who_achieves_all_things: "Aquel que todo lo realiza"
 mlo_who_achieves_all_things_desc: "Habiendo alcanzado la cumbre tanto en gobierno, cultura, territorio como en diplomacia, el duque de Milán es ahora digno de llamarse “aquel que todo lo realiza”."
 STATIC_MODIFIER_NAME_mlo_expanded_domain_mod: "Ducado en crecimiento"
 STATIC_MODIFIER_DESC_mlo_expanded_domain_mod: "El rápido crecimiento del territorio del ducado ha acelerado la difusión del gobierno y ha apresurado la incorporación de las tierras recién conquistadas."
 STATIC_MODIFIER_NAME_mlo_curb_della_scala_mod: "Supremacía sobre los della Scala"
 STATIC_MODIFIER_DESC_mlo_curb_della_scala_mod: "Ahora que la influencia de los della Scala en el norte de Italia está contenida, el prestigio diplomático del ducado ha aumentado."
 STATIC_MODIFIER_NAME_mlo_state_led_enterprises_mod: "Aparato estatal refinado"
 STATIC_MODIFIER_DESC_mlo_state_led_enterprises_mod: "Los Visconti y los Sforza se distinguieron por extensas obras públicas estatales. La Certosa di Pavia, el Castello Sforzesco de Milán, la red de canales Naviglio Grande: todo esto fueron grandes proyectos de construcción, impulsados por el poder público."
 STATIC_MODIFIER_NAME_mlo_rigorous_plague_policy_mod: "Sistema de cuarentena establecido"
 STATIC_MODIFIER_DESC_mlo_rigorous_plague_policy_mod: "Hospitales, erigidos por todo el ducado, han reforzado la resistencia nacional a la enfermedad."
 STATIC_MODIFIER_NAME_mlo_duomo_di_milano_mod: "La grandeza de la catedral"
 STATIC_MODIFIER_DESC_mlo_duomo_di_milano_mod: "La Catedral de Milán concluida ha reforzado la tradición cultural y la influencia del ducado."
 STATIC_MODIFIER_NAME_mlo_road_network_of_the_realm_mod: "Red viaria próspera"
 STATIC_MODIFIER_DESC_mlo_road_network_of_the_realm_mod: "La red viaria desarrollada ha reanimado el comercio por todo el ducado."
 STATIC_MODIFIER_NAME_mlo_expand_administrative_buildings_mod: "Gobierno ampliado"
 STATIC_MODIFIER_DESC_mlo_expand_administrative_buildings_mod: "Los Sforza construyeron un poderoso sistema de funcionarios. En la cancillería central de Milán (Cancelleria), se reunían hábiles juristas y escribas, y era conocida por el más sofisticado aparato administrativo del norte de Italia."
 STATIC_MODIFIER_NAME_mlo_embrace_the_renaissance_mod: "Corte renacentista"
 STATIC_MODIFIER_DESC_mlo_embrace_the_renaissance_mod: "La corte de Francesco Sforza y de su hijo Ludovico Sforza (il Moro) se convirtió en un gran centro del Renacimiento. Ludovico hospedó a Leonardo da Vinci por casi veinte años en la corte y reunió a artistas y arquitectos como Bramante."
 STATIC_MODIFIER_NAME_mlo_the_last_supper_mod: "Obra maestra inmortal"
 STATIC_MODIFIER_DESC_mlo_the_last_supper_mod: "Pintada en 1495-1498 por Leonardo da Vinci en la pared del refectorio del convento de Santa Maria delle Grazie, “La Última Cena” es considerada obra maestra de la pintura occidental por el uso perfecto de la perspectiva y por la representación psicológica de cada figura. Encargada por Ludovico Sforza, es el legado de la corte milanesa en su apogeo."
 STATIC_MODIFIER_NAME_mlo_naviglio_grande_renovation_mod: "Beneficios de la red de canales"
 STATIC_MODIFIER_DESC_mlo_naviglio_grande_renovation_mod: "El Naviglio Grande renovado ha acelerado de forma constante la difusión del gobierno desde la capital."
 STATIC_MODIFIER_NAME_mlo_biblioteca_ambrosiana_mod: "Saber próspero"
 STATIC_MODIFIER_DESC_mlo_biblioteca_ambrosiana_mod: "La fundación de la Biblioteca Ambrosiana ha elevado la habilidad de los nuevos artistas."
 STATIC_MODIFIER_NAME_mlo_heart_of_italy_mod: "Corazón de Italia"
 STATIC_MODIFIER_DESC_mlo_heart_of_italy_mod: "Como corazón de Italia, Milán atrae gente de todos los rincones, y su prosperidad es ahora constante."
 STATIC_MODIFIER_NAME_mlo_north_italian_ambitions_mod: "Ambiciones en el norte de Italia"
 STATIC_MODIFIER_DESC_mlo_north_italian_ambitions_mod: "Las ambiciones sobre todo el norte de Italia han acelerado la construcción de redes de espionaje."
 STATIC_MODIFIER_NAME_mlo_subjugate_lombardy_mod: "Soberano de Lombardía"
 STATIC_MODIFIER_DESC_mlo_subjugate_lombardy_mod: "El pleno control sobre Lombardía ha elevado el prestigio diplomático del ducado."
 STATIC_MODIFIER_NAME_mlo_advance_into_piedmont_mod: "Cabeza de puente en el Piamonte"
 STATIC_MODIFIER_DESC_mlo_advance_into_piedmont_mod: "El Piamonte era la esfera de la casa de Saboya y antigua rival de Milán. Mantener este corredor estratégico a través de los Alpes hasta Francia sería un escudo contra la invasión del oeste. Tanto los Visconti como los Sforza intentaron repetidamente avanzar sobre la región."
 STATIC_MODIFIER_NAME_mlo_strife_over_veneto_mod: "Honores militares del Véneto"
 STATIC_MODIFIER_DESC_mlo_strife_over_veneto_mod: "Los honores militares de la disputa por el Véneto han elevado el prestigio del ejército."
 STATIC_MODIFIER_NAME_mlo_through_emilia_and_beyond_mod: "Camino al sur"
 STATIC_MODIFIER_DESC_mlo_through_emilia_and_beyond_mod: "El camino, abierto más allá de Emilia, sustenta la moral del ejército."
 STATIC_MODIFIER_NAME_mlo_secure_liguria_mod: "Comercio de Liguria"
 STATIC_MODIFIER_DESC_mlo_secure_liguria_mod: "La seguridad de Liguria, incluida Génova, ha reanimado la actividad de los mercaderes."
 STATIC_MODIFIER_NAME_mlo_reach_the_coveted_sea_mod: "Puerta del Mediterráneo"
 STATIC_MODIFIER_DESC_mlo_reach_the_coveted_sea_mod: "Ahora que el mar codiciado ha sido alcanzado, la capacidad de abastecimiento de la flota ha mejorado."
 STATIC_MODIFIER_NAME_mlo_topple_the_old_rival_florence_mod: "Oeste sobre el Arno"
 STATIC_MODIFIER_DESC_mlo_topple_the_old_rival_florence_mod: "La gloria de derribar a la antigua rival Florencia ha elevado la magnificencia del ducado."
 STATIC_MODIFIER_NAME_mlo_between_two_authorities_mod: "Diplomacia entre las potencias"
 STATIC_MODIFIER_DESC_mlo_between_two_authorities_mod: "Milán orientó su diplomacia, manteniendo cierta distancia igual de las tres autoridades: el emperador del Sacro Imperio Romano, el papa y el rey de Francia. Los diplomáticos de los Sforza practicaban el concepto de “equilibrio de poder” y trajeron al norte de Italia una larga paz relativa."
 STATIC_MODIFIER_NAME_mlo_reconcile_with_the_papacy_mod: "Paz con el papado"
 STATIC_MODIFIER_DESC_mlo_reconcile_with_the_papacy_mod: "La reconciliación con el papado ha traído estabilidad de la fe al ducado."
 STATIC_MODIFIER_NAME_mlo_trust_of_the_emperor_mod: "Confianza del emperador"
 STATIC_MODIFIER_DESC_mlo_trust_of_the_emperor_mod: "La confianza del emperador ha elevado el prestigio del ducado dentro del Imperio."
 STATIC_MODIFIER_NAME_mlo_overture_to_france_mod: "Amistad con Francia"
 STATIC_MODIFIER_DESC_mlo_overture_to_france_mod: "Los lazos diplomáticos con el Reino de Francia han profundizado la amistad entre los dos Estados."
 STATIC_MODIFIER_NAME_mlo_the_italian_wars_mod: "Experiencia de las guerras de Italia"
 STATIC_MODIFIER_DESC_mlo_the_italian_wars_mod: "La supervivencia a las guerras de Italia ha sustentado la tradición del ejército."
 STATIC_MODIFIER_NAME_mlo_isolate_papal_authority_mod: "Independencia del papa"
 STATIC_MODIFIER_DESC_mlo_isolate_papal_authority_mod: "La distancia de la autoridad secular del papa ha elevado la tolerancia a herejes."
 STATIC_MODIFIER_NAME_mlo_deny_imperial_authority_mod: "Independencia del emperador"
 STATIC_MODIFIER_DESC_mlo_deny_imperial_authority_mod: "Un gobierno, libre de recurrir a la autoridad imperial, ha traído estabilidad al ducado."
 STATIC_MODIFIER_NAME_mlo_repel_french_authority_mod: "Independencia de Francia"
 STATIC_MODIFIER_DESC_mlo_repel_french_authority_mod: "El repudio a la intervención francesa ha elevado la moral del ejército."
 STATIC_MODIFIER_NAME_mlo_italian_independence_mod: "Potencia italiana autónoma"
 STATIC_MODIFIER_DESC_mlo_italian_independence_mod: "El hecho de ser independiente de cualquier gran potencia ha elevado tanto la magnificencia como la legitimidad del duque."
 STATIC_MODIFIER_NAME_mlo_who_achieves_all_things_mod: "El príncipe que todo lo realiza"
 STATIC_MODIFIER_DESC_mlo_who_achieves_all_things_mod: "“Aquel que todo lo realiza” (Chi tutte cose fa): el lema de los Sforza no era vana ostentación, sino expresión política del ideal renacentista del “hombre universal”. Conquistador militar y gran mecenas de las artes, legislador y protector del comercio: el apogeo del ducado de Milán encarna el apogeo político del Renacimiento italiano."
 mlo_events.1.t: "La leyenda del Biscione"
 mlo_events.1.d: "El escudo de los Visconti lleva una única serpiente, que devora a un hombre: el Biscione. Algunos dicen que recuerda una hazaña en las cruzadas; otros, que simboliza al infiel derrotado. Sea cual sea la verdad, el símbolo proclama por todo el norte de Italia que el poder de la familia y la propia ciudad-Estado de Milán ya no son asunto de un mero gobernante local. Ante el duque se extienden ahora muchos caminos: el del estadista, el del conquistador y el del diplomático, que camina entre las grandes potencias."
 mlo_events.1.a: "Una nueva era ha llegado a Milán"
 mlo_events.2.t: "Milán en 1337"
 mlo_events.2.d: "En 1337, Milán está gobernada conjuntamente por Luchino Visconti y su hermano, el arzobispo Giovanni Visconti. En tiempos de su antecesor Azzone, el título de vicario imperial fue concedido por el emperador Luis IV, prestando así al gobierno de Milán la autoridad del Imperio. Por todo el norte de Italia, poderosos señores detentan el poder, rivalizando entre sí: los della Scala de Verona, los Gonzaga de Mantua, los d’Este de Ferrara y otros. Con el papa sentado en Aviñón y la fuerza del emperador concentrada al norte de los Alpes, quien conquiste la supremacía sobre Lombardía decidirá el destino del norte de Italia."
 mlo_events.2.a: "Fundamentos de Milán comprendidos"
 mlo_events.3.t: "La historia del Castello Sforzesco"
 mlo_events.3.d: "El castillo de Milán comenzó como fortaleza construida por los Visconti, conocida como Corte dell’Arengo. Cuando la línea ducal terminó con la muerte de Filippo Maria Visconti en 1447, los ciudadanos proclamaron la República Ambrosiana y demolieron la mayor parte del castillo, símbolo de los antiguos gobernantes a quienes habían derrocado. Pero en 1450 Francesco Sforza, que puso fin al caos de la república y asumió el título ducal, ordenó reconstruir la fortaleza de nuevo, aún más magnífica que la anterior, para proclamar su propio poder. Desde entonces el Castello Sforzesco permanece como sede del poder ducal en Milán, y su brillo es inalterado."
 mlo_events.3.a: "El peso de esta historia comprendido"
 mlo_castello_sforzesco_building: "El Castello Sforzesco"
 mlo_castello_sforzesco_building_desc: "Fortaleza reconstruida por Francesco Sforza, que se alza como símbolo del poder ducal en Milán. Cuando está en la capital, refuerza la tradición cultural, la influencia cultural y el poder de la corona."
 STATIC_MODIFIER_NAME_mlo_serpent_reward_mod: "El gobierno del Biscione"
 STATIC_MODIFIER_DESC_mlo_serpent_reward_mod: "El escudo serpentino de los Visconti (Biscione) —serpiente que devora a un hombre— es símbolo del poder y la ambición de Milán. Según la leyenda, fue obtenido por un antepasado de los Visconti en duelo con un caballero sarraceno. La conclusión de la unificación de Italia significa que la serpiente ha devorado por fin toda la tierra."
