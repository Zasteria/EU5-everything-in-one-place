l_spanish:
 bur_crown_of_lothair_mission_pack: "La Corona de Lotario"
 bur_crown_of_lothair_mission_pack_DESCRIPTION:0 "1337: comienza la Guerra de los Cien Años. El Ducado de Borgoña, encajado entre Francia e Inglaterra, posee la astucia y los recursos para jugar a ambos lados y, por último, resucitar Lotaringia, el antiguo Reino Medio de los herederos de Carlomagno. Asegura la corte de Dijon, construye la Orden del Toisón de Oro y domina el comercio de paños flamenco; después, navega la guerra entre Inglaterra y Francia para extraer las máximas concesiones antes de unir Flandes, el Franco Condado y Lorena en un nuevo “Reino de Lotaringia”."
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION:0 "Como Borgoña, navega la Guerra de los Cien Años, consolídate internamente y restaura Lotaringia."
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para reclamar la Corona de Lotario."
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS:0 "¡Sobrevive entre Inglaterra y Francia, y después supera a ambas!"
 bur_duchy_of_burgundy: "Las ambiciones del Ducado"
 bur_duchy_of_burgundy_desc: "1337: la casa de Valois-Borgoña se alza como rama menor de la casa real francesa. Enfrentando a Inglaterra y Francia entre sí, el ducado aspira a expandirse hacia Flandes, el Franco Condado y Lorena. La Guerra de los Cien Años es una oportunidad que solo se da una vez por generación para que este pequeño ducado se convierta en gran potencia."
 bur_court_of_dijon: "La corte de Dijon"
 bur_court_of_dijon_desc: "La corte borgoñona de Dijon fue una de las más espléndidas de la Europa del siglo XV. Jan van Eyck y Rogier van der Weyden trabajaron bajo el mecenazgo borgoñón, y la biblioteca ducal rivalizaba con cualquiera de Francia. Este “Renacimiento del Norte” avant la lettre se construyó sobre los ingresos del paño flamenco y la extravagante ambición del duque."
 bur_flemish_cloth: "La industria textil flamenca"
 bur_flemish_cloth_desc: "El triángulo de Brujas, Gante e Ypres era la mayor región industrial de la Europa medieval. La lana inglesa se enviaba a Flandes, se transformaba en finos paños por hábiles artesanos y se vendía por toda Europa en las ferias de Champaña. Esta cadena de suministro era la columna vertebral económica de Borgoña."
 bur_golden_fleece: "La Orden del Toisón de Oro"
 bur_golden_fleece_desc: "Fundada en Brujas en 1430 por Felipe el Bueno, la Orden del Toisón de Oro era la más prestigiosa orden de caballería de la cristiandad católica: la pertenencia estaba reservada a monarcas y grandes príncipes. Basada en la leyenda de Jasón y los Argonautas, la insignia de la orden (un colgante de toisón de oro) siguió siendo un honor supremo hasta el siglo XIX."
 bur_estates_general: "Los Estados Generales"
 bur_estates_general_desc: "Como Estado compuesto que gobierna Flandes, Brabante y el Franco Condado, cada uno con sus propias tradiciones jurídicas, Borgoña necesitaba instituciones representativas para gobernar con eficacia. Los Estados Generales reunieron a los tres estamentos de diversas regiones bajo un único marco deliberativo."
 bur_feast_of_pheasants: "El Banquete del Faisán"
 bur_feast_of_pheasants_desc: "En 1454, conmocionado por la caída de Constantinopla, Felipe el Bueno celebró el “Banquete del Faisán” en Lille, el banquete más suntuoso de la Edad Media. Los caballeros hicieron votos de cruzada sobre un faisán vivo; el propio Felipe se comprometió a seguir a su rey a Tierra Santa. La cruzada nunca zarpó, pero el banquete consolidó la reputación de Borgoña como guardiana de la caballería cristiana."
 bur_balance_of_power: "Entre dos reinos"
 bur_balance_of_power_desc: "El genio diplomático de Borgoña estaba en su posición de fiel de la balanza. Vasalla de Francia por derecho feudal, ligada al Imperio por sus territorios orientales y potencial aliada de Inglaterra, Borgoña podía inclinar la balanza de la Guerra de los Cien Años en cualquier dirección. Esta palanca era la base del poder borgoñón."
 bur_ally_england: "Alianza con Inglaterra"
 bur_ally_england_desc: "Tras el asesinato de Juan Sin Miedo en el puente de Montereau en 1419, Borgoña lanzó su peso del lado de Inglaterra. El resultante Tratado de Troyes (1420) declaró a Enrique V heredero de la corona francesa: un resultado inconcebible sin el apoyo borgoñón. La alianza borgoñona-inglesa fue una de las asociaciones militares decisivas de la Guerra de los Cien Años."
 bur_treaty_of_troyes: "El Tratado de Troyes"
 bur_treaty_of_troyes_desc: "El Tratado de Troyes, apoyado por Borgoña, hizo de Enrique V regente y heredero de Francia. Asegurar Reims (donde se coronaban los reyes franceses) y París (la capital) hace de Borgoña la gobernante de facto de Francia: la justificación última de la alianza inglesa."
 bur_ally_france: "Reconciliación con Francia"
 bur_ally_france_desc: "En el Congreso de Arras de 1435, Felipe el Bueno cambió de bando: abandonó a Inglaterra y se reconcilió con Carlos VII. A cambio, Borgoña recibió formal exención de homenaje y la cesión de ciudades estratégicas. Esta pirueta diplomática hizo de Borgoña la ganadora final de la Guerra de los Cien Años."
 bur_treaty_of_arras: "El espíritu de Arras"
 bur_treaty_of_arras_desc: "El Tratado de Arras (1435) fue el mayor triunfo diplomático de Borgoña: Carlos VII fue humillado hasta una disculpa pública, mientras Felipe salía con ganancias territoriales y el homenaje dispensado. Usando esta holgura, Borgoña pudo concentrarse en consolidar Lorena y completar el Reino Medio."
 bur_flanders_in_the_war: "Flandes en la Guerra de los Cien Años"
 bur_flanders_in_the_war_desc: "El Condado de Flandes fue uno de los territorios más ferozmente disputados de la Guerra de los Cien Años. Inglaterra suministraba lana a las ciudades textiles flamencas y tenía allí fuerte influencia económica; las ciudades flamencas se alineaban a menudo con Inglaterra contra Francia. Sin embargo, Francia reivindicaba al conde de Flandes como vasallo. Borgoña, dependiente de los ingresos del paño flamenco, necesitaba atraer esta región clave a su órbita."
 bur_integrate_brabant: "El camino a Bruselas"
 bur_integrate_brabant_desc: "Amberes, capital comercial de Brabante, se convertiría a finales del siglo XV en la mayor ciudad comercial del norte de Europa. La imprenta de Plantin, el comercio de diamantes y los intercambios de plata española: todo centrado aquí. Asegurar Brabante completa el dominio borgoñón de los Países Bajos."
 bur_integrate_franche_comte: "Toma Dole"
 bur_integrate_franche_comte_desc: "Dole, capital del Franco Condado, albergaba la Universidad de Dole (fundada en 1422), apoyada por la casa ducal de Borgoña. Asegurar esta ciudad significa control efectivo de todo el Franco Condado y abre la ruta hacia Lorena."
 bur_expand_into_lorraine: "Expándete hacia Lorena"
 bur_expand_into_lorraine_desc: "Nancy era la capital del Ducado de Lorena. Carlos el Temerario murió en la batalla de Nancy en 1477, obsesionado con esta ciudad: aquí el jugador escribe un final distinto. Tomar Nancy abre el camino a Luxemburgo y asegura el corredor borgoñón entre los Países Bajos y el núcleo."
 bur_crown_of_lothair: "La Corona de Lotario"
 bur_crown_of_lothair_desc: "En 843, el Tratado de Verdún creó Lotaringia: el Reino Medio que se extendía de Flandes a Italia a lo largo del Rin. Engullido por Francia y Alemania en el Tratado de Meerssen en 870, este reino desapareció de la historia durante mil años. Ahora la casa de Borgoña lo restaura: no como Francia, no como Alemania, sino como algo nuevo: la resurrección del centro carolingio."
 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "La corte de Dijon"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "La corte borgoñona de Dijon atrajo a Jan van Eyck, Rogier van der Weyden y a los mejores músicos y poetas de la época, convirtiéndola en capital cultural del norte de Europa y pionera de la tradición pictórica flamenca que transformaría el arte occidental."
 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "La industria textil flamenca"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "El triángulo textil de Brujas, Gante e Ypres era el motor de la mayor economía industrial de la Europa medieval. Los paños flamencos eran el estándar de calidad en toda Europa, y el control de esta industria daba a Borgoña recursos financieros que rivalizaban con los de cualquier reino."
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "Orden del Toisón de Oro"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "Fundada en 1430, la Orden del Toisón de Oro era el más exclusivo honor de la cristiandad: su lista de miembros sonaba como pase de lista de la realeza europea. Conceder el toisón daba a Borgoña palanca diplomática sobre reyes y emperadores por igual."
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "Los Estados Generales"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "Los Estados Generales de Borgoña unieron los tres estamentos de Flandes, Brabante y la propia Borgoña en una única asamblea deliberativa: un modelo temprano de gobierno representativo que influyó en la posterior República Neerlandesa y en los cuerpos revolucionarios franceses."
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "El Voto del Faisán"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "En el mayor banquete de la Edad Media, Felipe el Bueno juró sobre un faisán vivo conducir una cruzada contra los otomanos. El voto nunca se cumplió, pero el espectáculo anunció a Borgoña como la principal potencia caballeresca de la cristiandad y profundizó sus lazos con el papado."
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "Entre dos reinos"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "Jugando de fiel de la balanza entre Inglaterra y Francia, Borgoña rechaza someterse por completo a cualquiera de los dos soberanos y explota la ambigüedad de sus obligaciones feudales. El caos de la Guerra de los Cien Años crea la oportunidad perfecta para construir poder militar independiente manteniendo a ambos bandos a distancia."
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "La alianza inglesa"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "Tras Montereau, Borgoña e Inglaterra formaron la alianza militar de mayores consecuencias de la Guerra de los Cien Años. Juntas ocuparon París y casi extinguieron la línea de los Valois: solo la intervención de Juana de Arco invirtió la marea."
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "Tratado de Troyes"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "El Tratado de Troyes, respaldado por Borgoña, hizo de Enrique V heredero de Francia: el punto álgido del poder anglo-borgoñón. Apoyándose en este triunfo, Borgoña se posiciona como verdadera gobernante del reino francés."
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "La alianza francesa"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "El Congreso de Arras (1435) fue la obra maestra diplomática de Borgoña: abandonar a Inglaterra en el momento de máxima palanca y arrancar humillantes concesiones a un desesperado Carlos VII. Borgoña emergió como socia indispensable del eventual vencedor francés."
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "Tratado de Arras"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "En Arras, Felipe el Bueno arrancó una disculpa formal de Carlos VII y ganó territorio, dispensado del requisito de homenaje personal. Esto hizo a Borgoña efectivamente independiente, permaneciendo nominalmente dentro del orden feudal francés: el resultado diplomático perfecto."
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "La Corona de Lotario"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "Perdido en 870, el Reino de Lotaringia renace tras mil años. De Flandes al Franco Condado, de Lorena a la propia Borgoña, la casa de Borgoña ha reunido el Reino Medio que los nietos de Carlomagno no pudieron conservar. Europa tiene un nuevo centro de gravedad."
 bur_events.1.t: "Las ambiciones del Ducado de Borgoña"
 bur_events.1.d: "1337: los primeros disparos de la Guerra de los Cien Años están a punto de sonar. Eduardo III de Inglaterra defiende su reivindicación al trono francés, pero Borgoña observa desde su singular punto de vista entre los dos gigantes. Rama menor de la casa de Valois de Francia y, sin embargo, dueña de una poderosa Flandes, de una elitista tradición caballeresca y de ingresos que igualan a los de cualquier reino, Borgoña es el punto de apoyo sobre el que girará esta guerra. De la espléndida corte de Dijon a los animados salones de paños de Brujas y Gante, el ducado alberga las mayores ambiciones de todas las potencias de Europa. La cuestión es a qué bando apoyar, o si apoyar a alguno."
 bur_events.1.a: "¡Borgoña elegirá su propio camino entre Inglaterra y Francia!"
 bur_events.2.t: "El Banquete del Faisán"
 bur_events.2.d: "En Lille, en 1454, el duque Felipe celebró el más extraordinario banquete de la Edad Media. Un faisán vivo fue llevado al salón adornado con un collar de oro; ante él, los caballeros reunidos de Borgoña hicieron votos de cruzada por Dios, la Virgen y el propio faisán. Felipe se comprometió a seguir a su rey a Tierra Santa. La maquinaria escénica produjo una capilla, un barco y un castillo sobre las mesas del banquete. Malabaristas, poetas y músicos compitieron por la atención. La cruzada nunca zarpó, pero nadie en Europa dudaba de que Borgoña era el mayor guardián de las virtudes caballerescas de la cristiandad."
 bur_events.2.a: "¡Juramos ante Dios y el Faisán defender la cristiandad!"
 bur_events.3.t: "La Corona de Lotario"
 bur_events.3.d: "En 843, el Tratado de Verdún dividió el imperio de Carlomagno entre sus tres nietos. La parte central, que se extendía de Flandes a Italia a lo largo del Rin, correspondió a Lotario I y se convirtió en “Lotaringia”. En 870, el Tratado de Meerssen la borró, dividiéndola entre Francia y Alemania. Durante mil años, el Reino Medio fue solo un recuerdo: un fantasma que rondaba las fronteras de Francia y del Imperio. Ahora la casa de Borgoña, con astucia y armas, ha reconstruido lo que los carolingios no pudieron conservar. Que la Corona de Lotario pase a su legítimo heredero."
 bur_council_of_mechelen: "El Gran Consejo de Mechelen"
 bur_council_of_mechelen_desc: "Los consejeros de Felipe el Bueno establecieron en Mechelen un “Gran Consejo” con jurisdicción sobre todos los territorios borgoñones: un tribunal supremo situado por encima de las distintas tradiciones jurídicas de Flandes, Brabante y el Franco Condado. Fue la piedra angular institucional de la verdadera centralización."
 bur_siege_of_calais: "Calais tomada"
 bur_siege_of_calais_desc: "Calais fue el último punto de apoyo de Inglaterra en el continente francés, retenido de 1347 a 1558. Los célebres “Burgueses de Calais”, de Rodin, conmemoran su heroica capitulación. Tomar este puerto estratégico da a Borgoña el control de la travesía del Canal y maximiza el valor de la alianza inglesa."
 bur_hainaut_namur: "Hereda Henao y Namur"
 bur_hainaut_namur_desc: "Felipe el Bueno compró Namur en 1421 y heredó Henao en 1433, completando el puente terrestre entre Flandes y Brabante. Estos condados, con sus ciudades textiles y estratégicos pasos fluviales, formaron el tejido conectivo de los Países Bajos borgoñones."
 bur_holland_zeeland: "Holanda y Zelanda"
 bur_holland_zeeland_desc: "Los condados de Holanda y Zelanda, con sus pesquerías de arenque, nuevas ciudades comerciales como Ámsterdam y excelentes puertos, fueron adquiridos por Felipe el Bueno en 1428. Estos territorios se convertirían en el corazón de la República Neerlandesa; bajo Borgoña, son el motor de un imperio comercial del Mar del Norte."
 bur_luxemburg: "Luxemburgo"
 bur_luxemburg_desc: "Felipe el Bueno conquistó el Ducado de Luxemburgo en 1443 tras una campaña contra Segismundo de la línea habsburga. Una de las más fuertes fortalezas del Imperio, Luxemburgo era el ancla oriental de los Países Bajos borgoñones y la puerta a Lorena y Alsacia."
 bur_dominate_rhine: "El Rin"
 bur_dominate_rhine_desc: "El Rin ha sido la columna vertebral de la civilización europea desde Roma hasta hoy. Dominar el río de los Países Bajos a Alsacia es dominar el corazón de Carlomagno: la Renania donde se administraba el imperio carolingio, donde se alzaban las ciudades-catedral, donde convergían las mayores rutas comerciales medievales."
 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "Gran Consejo de Mechelen"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "El Gran Consejo de Mechelen fue la respuesta de Borgoña al problema de gobernar un Estado compuesto de tradiciones jurídicas divergentes. Creando un tribunal supremo por encima del derecho flamenco, brabantino y borgoñón por igual, los consejeros de Felipe construyeron la base institucional de la verdadera centralización."
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "El Puerto Libre de Calais"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "Calais, en el punto más estrecho del Canal de la Mancha, es desde la Antigüedad un nudo clave de tránsito que une el comercio del Mar del Norte, del Báltico y del Mediterráneo. Inglaterra lo retuvo más de dos siglos precisamente por este valor comercial. Borgoña desarrolla ahora Calais como principal entrepôt del comercio de paños del norte de Europa."
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "Luxemburgo"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "El ducado-fortaleza de Luxemburgo, una de las posiciones más fuertes del Imperio, dio a Borgoña su ancla oriental. Su adquisición en 1443 completó el cerco del valle del Mosa y abrió el camino a Lorena y Alsacia."
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "El Rin"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "Del delta a los viñedos, el Rin es ahora borgoñón. El mayor río del corazón carolingio, ruta comercial de la Europa medieval, frontera entre la civilización y el bosque: todo bajo una sola bandera."
 bur_join_hre: "Únete al Sacro Imperio Romano"
 bur_join_hre_desc: "Borgoña tiene la oportunidad de ser formalmente reconocida como príncipe del Sacro Imperio Romano. Un doble estatus, vasallo de Francia y príncipe imperial, daría a Borgoña una posición diplomática singularmente poderosa. En 1473, Carlos el Temerario negoció con Federico III en Tréveris la elevación a un “Reino de Borgoña” dentro del Imperio, pero el emperador se retiró en el último momento. Ahora la oportunidad vuelve."
 bur_franchecomte_fiefdom: "Matrimonio con el Franco Condado"
 bur_franchecomte_fiefdom_desc: "En el siglo XIII, la casa de Borgoña forjó profundos lazos con los condes del Franco Condado por matrimonio. El duque Otón IV de Borgoña casó con la condesa Mahaut de Artois y aseguró la lealtad del Franco Condado a Borgoña. Las minas de sal, el mineral de hierro y la Universidad de Dole de este “Condado Libre” lo hacen una puerta vital para la expansión oriental de Borgoña hacia Suiza y Lorena."
 bur_events.4.t: "El Sacro Imperio Romano"
 bur_events.4.d: "Borgoña ha ocupado siempre una posición fronteriza: vasalla de Francia por derecho feudal, pero ligada al Imperio por sus territorios orientales. El favor del emperador abre el camino a la pertenencia formal. En 1473, Carlos el Temerario se reunió con Federico III en Tréveris y negoció el estatus de “Reino de Borgoña” dentro del Imperio, pero el emperador embarcó al amanecer en su barcaza y se marchó sin firmar. Ahora, con las relaciones suficientemente cálidas, la puerta está de nuevo abierta."
 bur_events.4.a: "Unirse al Imperio y convertirse en príncipe imperial"
 bur_events.4.b: "Preservar nuestra independencia por ahora"
 bur_events.5.t: "Matrimonio con el Franco Condado"
 bur_events.5.d: "En el siglo XIII, el duque borgoñón Otón IV casó con la casa condal del Franco Condado, ligando este rico “Condado Libre” a Borgoña por la sangre. Las minas de sal del Jura, las forjas de hierro, la Universidad de Dole y los pasos de montaña que controlan las rutas hacia Suiza y Lorena: todo ello ha sido, por generaciones, parte del mundo borgoñón. Ha llegado la hora de formalizar lo que el matrimonio ya ha creado."
 bur_events.5.a: "Usar el vínculo matrimonial para recibir el Franco Condado como súbdito enfeudado"
 bur_events.5.b: "Mantener el vínculo matrimonial respetando su autonomía"
 bur_events.6.t: "Flandes en la Guerra de los Cien Años"
 bur_events.6.d: "El Condado de Flandes ocupa una posición singular en la Guerra de los Cien Años. La producción flamenca de paño no puede funcionar sin lana inglesa, y los ricos ciudadanos de Brujas, Gante e Ypres estiman su relación comercial inglesa por encima de todo. Francia reivindica al conde como vasallo, pero los burgueses flamencos resisten el dominio francés y han tomado repetidamente el partido de Inglaterra. Atrayendo Flandes a la órbita borgoñona, el duque puede aprovechar la riqueza de estas ciudades textiles. La elección: dar Flandes en feudo como súbdita borgoñona, o profundizar los lazos respetando su independencia."
 bur_events.6.a: "Recibir Flandes como vasalla borgoñona"
 bur_events.6.b: "Respetar la independencia flamenca profundizando la alianza"
 bur_nevers_union: "Unión con Nevers"
 bur_nevers_union_desc: "El Condado de Nevers se halla al sur de Flandes y tiene lazos históricos con la casa ducal de Borgoña. Con Flandes firmemente en mano, establecer una reivindicación sobre Nevers amplía hacia el sur la esfera de influencia de Borgoña. Las tierras entre Flandes y Nevers forman un corredor para la futura expansión sobre Francia."
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "Los Países Bajos unificados"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "La red comercial de los Países Bajos, que une Holanda, Zelanda, Brabante y Flandes, ha sido unificada. El poder comercial de Amberes y Ámsterdam, que forma la base de la posterior Edad de Oro neerlandesa."
 bur_events.3.a: "Alzarse como el restaurado Reino de Lotaringia"
 bur_events.3.b: "Permanecer como Borgoña y reivindicar el título imperial (statu quo)"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "Lotaringia renacida"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "El Reino de Lotaringia, sucesor de la Francia Media, ha revivido seis siglos después de su caída en 869. Heredero del imperio de Carlomagno, este reino es reconocido como tercera potencia imperial, que se interpone entre el Sacro Imperio Romano y el Reino de Francia."
