l_spanish:
 kie_kyiv_mission_pack: "La unificación de la Rus y el señor de los cosacos"
 kie_kyiv_mission_pack_DESCRIPTION:0 "En 1337, el Principado de Kiev es un pequeño Estado, apretado entre Lituania y los tártaros. Pero Kiev brilló antaño como corazón de la Rus de Kiev: la Catedral de Santa Sofía, el Monasterio de las Cuevas y la Puerta Dorada aún dan testimonio de su esplendor. Une la Ucrania de la margen izquierda y de la derecha, conquista Halych y Volinia, derrota a los tártaros con la fuerza militar cosaca, forma Rutenia y gobierna el Gran Principado."
 kie_kyiv_mission_pack_CRITERIA_DESCRIPTION:0 "Une la Rus, establece el Hetmanato Cosaco, conviértete en guardiana de la fe ortodoxa, forma Rutenia y gobierna el Gran Principado de Kiev."
 kie_kyiv_mission_pack_BUTTON_TOOLTIP:0 "Gobierna el Gran Principado de Kiev sobre toda la Rus."
 kie_kyiv_mission_pack_BUTTON_DETAILS:0 "¡Une la Rus fragmentada bajo Kiev: domina la estepa con la espada cosaca!"
 kie_restore_kyiv: "Reconstruye Kiev"
 kie_restore_kyiv_desc: "En 1337, Kiev —antaño la ciudad dorada de la Rus de Kiev— está devastada por la invasión mongola de 1240. La Catedral de Santa Sofía y el Monasterio de las Cuevas aún atestiguan su antiguo esplendor. Reconstruye la “madre de las ciudades rusas” como una gran ciudad."
 kie_dev_kyiv: "Desarrolla Kiev"
 kie_dev_kyiv_desc: "Encrucijada clave, que une las rutas comerciales del Vóljov y del Dniéper: desarrolla Kiev como centro de comercio, cultura y política."
 kie_secure_left_bank: "Consolida el control de la Ucrania de la margen izquierda"
 kie_secure_left_bank_desc: "Consolida el control de la Ucrania de la margen izquierda: preserva las tradiciones culturales de la Rus y, con una burocracia hábil, haz de esta rica tierra agrícola la base de Kiev."
 kie_secure_right_bank: "Consolida el control de la Ucrania de la margen derecha"
 kie_secure_right_bank_desc: "Consolida el control de la Ucrania de la margen derecha: difundiendo la cultura ucraniana y reforzando la autoridad de la corona, haz de la Ucrania de la margen derecha tierra núcleo de Kiev."
 kie_conquer_chernihiv: "Expedición a Chernígov"
 kie_conquer_chernihiv_desc: "Conquista Chernígov, antigua ciudad del principado ruso, y consolida el control de la Ucrania de la margen izquierda."
 kie_conquer_poltava: "Marcha sobre Poltava"
 kie_conquer_poltava_desc: "Subyuga el baluarte cosaco Poltava y abre la puerta a la Sloboda Ucrania."
 kie_kyiv_metropolitan: "La metrópoli de Kiev"
 kie_kyiv_metropolitan_desc: "Erige la Metrópoli de Kiev, independiente de Constantinopla, como centro de la iglesia ortodoxa de la Rus."
 kie_unite_rus: "La unificación de la Rus"
 kie_unite_rus_desc: "Une de nuevo, bajo Kiev, los principados rusos fragmentados por la invasión mongola. La “madre de las ciudades rusas” brilla de nuevo como centro de toda Ucrania."
 kie_secure_volhynia: "Asegura Volinia"
 kie_secure_volhynia_desc: "Asegura Volinia, en la frontera de la Rus y Polonia, para establecer influencia occidental."
 kie_conquer_lutsk: "Expedición a Lutsk"
 kie_conquer_lutsk_desc: "Toma la ciudad clave de Volinia, Lutsk, y hazla cabeza de puente hacia el oeste."
 kie_conquer_galicia: "Invasión de Halych"
 kie_conquer_galicia_desc: "Invade Halych: la conquista de esta región establece el control pleno de la Ucrania occidental."
 kie_red_ruthenia: "Subyuga la Rutenia Roja"
 kie_red_ruthenia_desc: "Subyuga la Rutenia Roja: la subyugación de esta región en torno a Leópolis completa el control pleno de la Ucrania occidental."
 kie_conquer_lviv: "Toma Leópolis"
 kie_conquer_lviv_desc: "La “ciudad del león”, Leópolis: conquista esta ciudad comercial, construida por el príncipe Daniel, y obtén el control del comercio occidental."
 kie_conquer_podolia: "Avanza sobre Podolia"
 kie_conquer_podolia_desc: "Avanza sobre Podolia: conquista esta región agrícola de la margen derecha y asegura el camino a la costa del Mar Negro."
 kie_conquer_vinnytsia: "Toma Vínnitsa"
 kie_conquer_vinnytsia_desc: "Toma Vínnitsa y establece una cabeza de puente agrícola en la Ucrania de la margen derecha."
 kie_conquer_polesia: "Expedición al Polesia"
 kie_conquer_polesia_desc: "Conquista el pantanoso Polesia: erige la línea de defensa del norte."
 kie_conquer_minsk: "Toma Minsk"
 kie_conquer_minsk_desc: "Toma Minsk, centro de Rutenia Blanca, para ampliar la influencia septentrional."
 kie_cossack_host: "Erige el ejército cosaco"
 kie_cossack_host_desc: "Los cosacos se reúnen bajo las banderas de Kiev: incorpora la tradición cosaca de Zaporiyia al ejército regular y construye la mejor caballería de la Rus."
 kie_zaporizhzhia: "La Sich de Zaporiyia"
 kie_zaporizhzhia_desc: "Erige la fortaleza de la Sich de Zaporiyia, más allá de los rápidos del Dniéper, como cabeza de puente para la defensa de la estepa."
 kie_tatar_wars: "Guerras contra los tártaros"
 kie_tatar_wars_desc: "Conduce la batalla decisiva contra los tártaros de Crimea, que dominan el norte del Mar Negro. Usa la caballería cosaca para oponerte a ellos y recuperar la estepa ucraniana."
 kie_black_sea_steppe: "Conquista la estepa del Mar Negro"
 kie_black_sea_steppe_desc: "Toma la estepa póntica: el vasto pasto hace de Kiev señora del norte del Mar Negro."
 kie_conquer_crimea: "Conquista de Crimea"
 kie_conquer_crimea_desc: "Conquista la península del Kanato de Crimea para establecer la supremacía en el Mar Negro. Toma el puesto comercial genovés de Caffa."
 kie_black_sea_coast: "Erige la flota del Mar Negro"
 kie_black_sea_coast_desc: "Usa los chaikas cosacos (barcos rápidos), que descienden el Dniéper hacia el Mar Negro: desafía a los otomanos y toma la ruta comercial del Mar Negro."
 kie_kyiv_pechersk: "El Monasterio de las Cuevas de Kiev"
 kie_kyiv_pechersk_desc: "El Monasterio de las Cuevas de Kiev, fundado en 1051: corazón espiritual de la iglesia ortodoxa de la Rus. Desarrolla este monasterio y proclama Kiev centro ortodoxo."
 kie_orthodox_revival: "El renacimiento ortodoxo"
 kie_orthodox_revival_desc: "Reconstruye la iglesia ortodoxa de la Rus, devastada por la invasión mongola: erige catedrales por toda la tierra y resucita la “Santa Rusia”."
 kie_grain_breadbasket: "Ucrania: el granero de Europa"
 kie_grain_breadbasket_desc: "El fértil chernozem: Ucrania, rica tierra agrícola, llamada “granero de Europa”. Maximiza esta productividad y refuerza la base alimentaria del reino."
 kie_trade_routes: "Las rutas comerciales de Kiev"
 kie_trade_routes_desc: "El “Camino de los Varegos a los Griegos”, que une el Báltico con el Mar Negro: reanima esta antigua ruta comercial, que trajo prosperidad a Kiev."
 kie_hetmanate: "El Hetmanato Cosaco"
 kie_hetmanate_desc: "El hetman: el establecimiento del Hetmanato Cosaco permite a Kiev erigirse como Estado con su propio sistema político-militar. Adelántate a la gran realización de Bohdán Jmelnitski de 1648."
 kie_literacy_culture: "Apoya la educación y la cultura"
 kie_literacy_culture_desc: "La tradición espiritual de Kiev, como pionera de la cultura de escritura monástica y de las escuelas catedralicias: apoya la cultura de la educación."
 kie_conquer_zhytomyr: "Desarrolla Zhitómir"
 kie_conquer_zhytomyr_desc: "Desarrolla Zhitómir, punto clave de la Ucrania de la margen derecha, con construcciones adecuadas, como importante ciudad-baluarte."
 kie_salt_of_galicia: "La sal de Halych"
 kie_salt_of_galicia_desc: "Las minas de sal de Halych: toma esta región, que produce “oro blanco”, y asegura el suministro estable de esta importante mercancía."
 kie_dev_poltava: "Desarrolla Poltava"
 kie_dev_poltava_desc: "Desarrolla Poltava, ciudad clave de la Ucrania cosaca de la margen izquierda, como cabeza de puente oriental."
 kie_beyond_donets: "Más allá del Donets"
 kie_beyond_donets_desc: "La Sloboda Ucrania: asienta campesinos cosacos a lo largo del Donets y desarrolla la estepa oriental."
 kie_conquer_moldavia: "Invasión de Moldavia"
 kie_conquer_moldavia_desc: "Conquista Moldavia, en la costa del Mar Negro, y alcanza la plena inserción en el comercio del Mar Negro."
 kie_amber_route: "La Ruta del Ámbar"
 kie_amber_route_desc: "La antigua ruta comercial del ámbar, del Báltico, pasando por Lutsk y Leópolis hacia el sur, forma la columna vertebral de la red comercial rutena."
 kie_fortress_line: "La línea de fortalezas"
 kie_fortress_line_desc: "Una línea de fortalezas contra las amenazas de la estepa: el sistema defensivo de Zaporiyia a Podolia protege a los campesinos y ciudades ucranianos."
 kie_great_kyiv: "La Gran Kiev"
 kie_great_kyiv_desc: "Restaura en Kiev la grandeza que tenía antes de la invasión mongola: reconstrúyela como magnífica ciudad, cuyas cúpulas doradas recuperarán su brillo original."
 kie_ruthenian_culture: "Identidad cultural rutena"
 kie_ruthenian_culture_desc: "Establece una identidad ucraniano-rutena singular: una identidad en que se unen la lengua ucraniana, la cultura cosaca y la fe ortodoxa."
 kie_dev_chernihiv: "Desarrolla Chernígov"
 kie_dev_chernihiv_desc: "Desarrolla Chernígov como centro de cultura y comercio en la Ucrania de la margen izquierda."
 kie_conquer_wallachia: "Avanza sobre Valaquia"
 kie_conquer_wallachia_desc: "Valaquia, a lo largo del Danubio: conquista esta región como cabeza de puente hacia los Balcanes y completa el control de la costa del Mar Negro."
 kie_cossack_cavalry: "Élite de la caballería cosaca"
 kie_cossack_cavalry_desc: "La caballería cosaca, tanto ligera como pesada, elevada a tropa de élite. Derrota a los tártaros con su movilidad y poder de combate."
 kie_kyiv_academy: "La Academia Kiev-Mohyla"
 kie_kyiv_academy_desc: "Erige la Academia Kiev-Mohyla antes de su fundación, en 1632: una de las más antiguas universidades de Europa oriental. Realiza el renacimiento espiritual y cultural de la Rus."
 kie_conquer_krakow: "Toma Cracovia"
 kie_conquer_krakow_desc: "Cracovia, capital histórica del Reino de Polonia: la conquista de esta ciudad con Wawel amplía enormemente la influencia sobre Europa central."
 kie_navy_dnipro: "La flota del Dniéper"
 kie_navy_dnipro_desc: "Usa los chaikas cosacos a vela, del Dniéper al Mar Negro: la flota del Dniéper guarda el comercio del Mar Negro."
 kie_protect_orthodoxy: "Protectora de la ortodoxia"
 kie_protect_orthodoxy_desc: "Tras la caída de Constantinopla, Kiev emerge como guardiana del mundo ortodoxo: establece la suprema autoridad de la iglesia ortodoxa de la Rus."
 kie_conquer_vilnius: "La toma de Vilna"
 kie_conquer_vilnius_desc: "Vilna, capital del Gran Ducado de Lituania: la toma de esta ciudad pone fin a la suzeranía lituana sobre la Rus."
 kie_western_alliance: "Alianza con Occidente"
 kie_western_alliance_desc: "Construye relaciones diplomáticas con Polonia, Hungría y el Sacro Imperio Romano para establecer una alianza occidental contra las amenazas del este."
 kie_silver_route: "La Ruta de la Plata"
 kie_silver_route_desc: "La plata del este fluye por Kiev, a lo largo del Dniéper, hacia el oeste: establece la posición de Kiev en el comercio internacional."
 kie_ruthenian_army: "Reforma del ejército rutenio"
 kie_ruthenian_army_desc: "Combina la tradición cosaca con la tecnología militar occidental: el ejército rutenio gobierna como la mejor fuerza de Europa oriental."
 kie_conquer_warsaw: "La toma de Varsovia"
 kie_conquer_warsaw_desc: "Varsovia, capital de Polonia: completa la larga lucha contra la Mancomunidad Polaco-Lituana."
 kie_beeswax_honey: "Comercio de cera y miel"
 kie_beeswax_honey_desc: "La cera ucraniana: mercancía clave, suministrada a las iglesias ortodoxas y a los mercados de Europa occidental."
 kie_form_ruthenia: "Forma Rutenia"
 kie_form_ruthenia_desc: "Declara la formación del Estado de “Rutenia”, que abarca Ucrania, Bielorrusia y la Rus occidental. El sueño de la unidad de la Rus desde la invasión mongola finalmente realizado."
 kie_grand_principality: "El Gran Principado de Kiev"
 kie_grand_principality_desc: "“Gran Principado de Kiev”: este título da testimonio del esplendor de la antigua Rus de Kiev. Kiev, donde se unen la fuerza militar cosaca, la autoridad ortodoxa y la cultura rutena, gobierna como gran potencia de Europa oriental."
 kie_events.1.t: "Kiev despierta: la reconstrucción de la madre de las ciudades rusas"
 kie_events.1.d: "Sobre las colinas a lo largo del Dniéper, las cúpulas doradas de la Catedral de Santa Sofía brillan en el cielo de Kiev.\n\nEn 1337, el Principado de Kiev es pequeño, pero carga con el peso de la historia como corazón de la Rus de Kiev. “Madre de todas las ciudades rusas”: este título define la misión de Kiev.\n\nLituania, Polonia y los tártaros presionan desde todos lados, pero los dones del Dniéper, el fértil chernozem y el espíritu cosaco sustentan a Kiev.\n\nLos monjes del Monasterio de las Cuevas rezan: “Álzate de nuevo, oh Rus”. Responde a esta oración."
 kie_events.1.a: "¡Restaurar la gloria de Kiev!"
 kie_events.20.t: "Proclamación del Hetmanato Cosaco"
 kie_events.20.d: "Los cosacos de Zaporiyia están en línea bajo la bandera del hetman: el Gran Príncipe de Kiev incorpora formalmente la fuerza cosaca al sistema del Estado y proclama el “Hetmanato Cosaco”. Este singular sistema militar-estatal definirá el futuro de la Rus."
 kie_events.20.a: "¡Viva el Hetmanato Cosaco! ¡Viva la Ucrania libre!"
 kie_events.60.t: "Formación de Rutenia: una nueva potencia de Europa oriental"
 kie_events.60.d: "Ucrania, Bielorrusia y Halych bajo una sola bandera: el Estado eslavo oriental unificado de “Rutenia” surge como nueva gran potencia de Europa oriental. Todos los pueblos de la Rus se reúnen bajo las cúpulas doradas de Kiev."
 kie_events.60.a: "¡Viva Rutenia! ¡Viva Kiev!"
 kie_events.99.t: "El Gran Principado de Kiev: el renacimiento de la gloria de la Rus"
 kie_events.99.d: "“Gran Principado de Kiev”: este título resuena a lo largo de las orillas del Dniéper. Un reino, donde se unen la fuerza militar cosaca, la autoridad ortodoxa y la cultura rutena, gobierna como señor de Europa oriental. La Rus de Kiev, destruida por los mongoles, renace en nueva forma: la madre de las ciudades rusas, Kiev, brilla de nuevo."
 kie_events.99.a: "¡Viva el Gran Principado de Kiev! ¡Viva la gloria de la Rus para siempre!"
 STATIC_MODIFIER_NAME_kie_kyiv_dev_mod: "Ciudad dorada sobre el Dniéper"
 STATIC_MODIFIER_DESC_kie_kyiv_dev_mod: "Kiev desarrollada como gran ciudad, digna del título de “madre de las ciudades rusas”."
 STATIC_MODIFIER_NAME_kie_left_bank_mod: "Ucrania de la margen izquierda asegurada"
 STATIC_MODIFIER_DESC_kie_left_bank_mod: "Ucrania de la margen izquierda asegurada: el Dniéper oriental bajo el gobierno de Kiev."
 STATIC_MODIFIER_NAME_kie_right_bank_mod: "Ucrania de la margen derecha asegurada"
 STATIC_MODIFIER_DESC_kie_right_bank_mod: "Ucrania de la margen derecha asegurada: el Dniéper occidental unido al este."
 STATIC_MODIFIER_NAME_kie_poltava_mod: "Baluarte cosaco asegurado"
 STATIC_MODIFIER_DESC_kie_poltava_mod: "El baluarte cosaco Poltava asegurado: frontera de la estepa estabilizada."
 STATIC_MODIFIER_NAME_kie_metropolitan_mod: "Corazón de la ortodoxia de la Rus"
 STATIC_MODIFIER_DESC_kie_metropolitan_mod: "La Metrópoli de Kiev restaurada como corazón de la ortodoxia de la Rus."
 STATIC_MODIFIER_NAME_kie_volhynia_mod: "Granero de Volinia"
 STATIC_MODIFIER_DESC_kie_volhynia_mod: "Las fértiles llanuras de Volinia se convierten en granero del Estado de Kiev."
 STATIC_MODIFIER_NAME_kie_lutsk_mod: "Llave de la Rus occidental"
 STATIC_MODIFIER_DESC_kie_lutsk_mod: "Lutsk, llave de la Rus occidental, asegurada y abre el camino a Halych."
 STATIC_MODIFIER_NAME_kie_galicia_mod: "Invasión de Halych"
 STATIC_MODIFIER_DESC_kie_galicia_mod: "Halych tomada, y el legado del Principado de Halych-Volinia renace."
 STATIC_MODIFIER_NAME_kie_red_ruthenia_mod: "Rutenia Roja subyugada"
 STATIC_MODIFIER_DESC_kie_red_ruthenia_mod: "Rutenia Roja subyugada y unida a Ucrania."
 STATIC_MODIFIER_NAME_kie_lviv_mod: "Prosperidad de la ciudad del león"
 STATIC_MODIFIER_DESC_kie_lviv_mod: "Leópolis, la ciudad del león, prospera como puerta del comercio occidental."
 STATIC_MODIFIER_NAME_kie_podolia_mod: "Campos cultivados de chernozem"
 STATIC_MODIFIER_DESC_kie_podolia_mod: "Los campos cultivados de chernozem de Podolia asegurados: la riqueza agrícola fluye a Kiev."
 STATIC_MODIFIER_NAME_kie_vinnytsia_mod: "Baluarte de la margen derecha"
 STATIC_MODIFIER_DESC_kie_vinnytsia_mod: "Vínnitsa sirve de baluarte de la Ucrania de la margen derecha."
 STATIC_MODIFIER_NAME_kie_polesia_mod: "Muralla de pantanos"
 STATIC_MODIFIER_DESC_kie_polesia_mod: "Los pantanos del Polesia forman una muralla defensiva natural contra invasiones del norte."
 STATIC_MODIFIER_NAME_kie_minsk_mod: "Corazón de Rutenia Blanca"
 STATIC_MODIFIER_DESC_kie_minsk_mod: "Minsk, corazón de Rutenia Blanca, pasa al control de Kiev."
 STATIC_MODIFIER_NAME_kie_cossack_mod: "La espada cosaca"
 STATIC_MODIFIER_DESC_kie_cossack_mod: "La espada cosaca forja la fuerza de Kiev en un ejército de élite de la estepa."
 STATIC_MODIFIER_NAME_kie_zaporizhzhia_mod: "Libertad más allá de los rápidos"
 STATIC_MODIFIER_DESC_kie_zaporizhzhia_mod: "Más allá de los rápidos del Dniéper, los cosacos de Zaporiyia dedican sus espadas a Kiev."
 STATIC_MODIFIER_NAME_kie_tatar_wars_mod: "Lucha contra los tártaros"
 STATIC_MODIFIER_DESC_kie_tatar_wars_mod: "Las expediciones contra los tártaros templan la caballería de Kiev en intrépidos guerreros de la estepa."
 STATIC_MODIFIER_NAME_kie_steppe_mod: "Conquistador de la estepa"
 STATIC_MODIFIER_DESC_kie_steppe_mod: "Estepa conquistada: Kiev gobierna como señora de los pastos pónticos."
 STATIC_MODIFIER_NAME_kie_crimea_mod: "Supremacía en el Mar Negro"
 STATIC_MODIFIER_DESC_kie_crimea_mod: "Supremacía en el Mar Negro alcanzada: Crimea bajo el gobierno de Kiev."
 STATIC_MODIFIER_NAME_kie_black_sea_mod: "El camino al Mar Negro"
 STATIC_MODIFIER_DESC_kie_black_sea_mod: "El camino al Mar Negro abierto: Kiev obtiene acceso al comercio del Mediterráneo."
 STATIC_MODIFIER_NAME_kie_lavra_mod: "La Lavra de las Cuevas"
 STATIC_MODIFIER_DESC_kie_lavra_mod: "El Monasterio de las Cuevas de Kiev restaurado como alma de la ortodoxia de la Rus."
 STATIC_MODIFIER_NAME_kie_orthodox_mod: "Renacimiento ortodoxo rutenio"
 STATIC_MODIFIER_DESC_kie_orthodox_mod: "La ortodoxia rutena renace: Kiev retoma su papel de guardiana de la fe."
 STATIC_MODIFIER_NAME_kie_grain_mod: "Granero de Europa"
 STATIC_MODIFIER_DESC_kie_grain_mod: "El fértil chernozem de Ucrania hace de Kiev el granero de Europa."
 STATIC_MODIFIER_NAME_kie_trade_mod: "Ruta comercial del Dniéper"
 STATIC_MODIFIER_DESC_kie_trade_mod: "La ruta comercial del Dniéper, del Báltico al Mar Negro, fluye por manos de Kiev."
 STATIC_MODIFIER_NAME_kie_salt_mod: "Oro blanco de Halych"
 STATIC_MODIFIER_DESC_kie_salt_mod: "El oro blanco de Halych —la sal— monopolizado en favor del reino."
 STATIC_MODIFIER_NAME_kie_poltava_city_mod: "Poltava desarrollada"
 STATIC_MODIFIER_DESC_kie_poltava_city_mod: "Poltava desarrollada como próspera ciudad de la estepa ucraniana."
 STATIC_MODIFIER_NAME_kie_sloboda_mod: "Ucrania libre poblada"
 STATIC_MODIFIER_DESC_kie_sloboda_mod: "Los asentamientos libres ucranianos pueblan la frontera oriental bajo protección de Kiev."
 STATIC_MODIFIER_NAME_kie_moldavia_mod: "Moldavia conquistada"
 STATIC_MODIFIER_DESC_kie_moldavia_mod: "El viento del Mar Negro sopla sobre las fortalezas de Moldavia, y los puertos del litoral están ahora bajo el estandarte de Kiev."
 STATIC_MODIFIER_NAME_kie_amber_mod: "La Ruta del Ámbar"
 STATIC_MODIFIER_DESC_kie_amber_mod: "La ruta del ámbar, del Báltico al Mar Negro, fluye por Kiev."
 STATIC_MODIFIER_NAME_kie_fortress_mod: "Línea de defensa de la estepa"
 STATIC_MODIFIER_DESC_kie_fortress_mod: "La cadena de fortalezas de la estepa protege la frontera sur contra las incursiones tártaras."
 STATIC_MODIFIER_NAME_kie_great_kyiv_mod: "Madre de las ciudades rusas"
 STATIC_MODIFIER_DESC_kie_great_kyiv_mod: "Kiev ha recuperado su título de madre de las ciudades rusas: capital eterna de Ucrania."
 STATIC_MODIFIER_NAME_kie_culture_mod: "Florecimiento cultural rutenio"
 STATIC_MODIFIER_DESC_kie_culture_mod: "La cultura rutena florece: Kiev se convierte en faro de saber y arte."
 STATIC_MODIFIER_NAME_kie_chernihiv_city_mod: "Chernígov prospera"
 STATIC_MODIFIER_DESC_kie_chernihiv_city_mod: "Chernígov prospera como principal ciudad del noreste de Ucrania."
 STATIC_MODIFIER_NAME_kie_wallachia_mod: "Valaquia conquistada"
 STATIC_MODIFIER_DESC_kie_wallachia_mod: "Valaquia conquistada y traída a la suzeranía de Kiev."
 STATIC_MODIFIER_NAME_kie_cavalry_mod: "Élite de la caballería cosaca"
 STATIC_MODIFIER_DESC_kie_cavalry_mod: "La caballería cosaca forjada en fuerza de élite: orgullo de las armas de Kiev."
 STATIC_MODIFIER_NAME_kie_academy_mod: "Aulas del saber de la Rus"
 STATIC_MODIFIER_DESC_kie_academy_mod: "La Academia Kiev-Mohyla se abre: las aulas del saber de la Rus brillan sobre Europa oriental."
 STATIC_MODIFIER_NAME_kie_krakow_mod: "Ciudad de los Jagellones"
 STATIC_MODIFIER_DESC_kie_krakow_mod: "El estandarte de Kiev ondea desde la torre de Wawel, y la ciudad de los Jagellones oye el nombre de su nuevo señor."
 STATIC_MODIFIER_NAME_kie_navy_mod: "Flota del Dniéper"
 STATIC_MODIFIER_DESC_kie_navy_mod: "Flota del Dniéper construida: el poder naval de Kiev surge en el Mar Negro."
 STATIC_MODIFIER_NAME_kie_protector_mod: "Protectora de la ortodoxia"
 STATIC_MODIFIER_DESC_kie_protector_mod: "Kiev reconocida como protectora de los cristianos ortodoxos de toda Europa oriental."
 STATIC_MODIFIER_NAME_kie_vilnius_mod: "Fin de la suzeranía lituana"
 STATIC_MODIFIER_DESC_kie_vilnius_mod: "La suzeranía lituana sobre las tierras rutenas termina: Kiev recupera el este."
 STATIC_MODIFIER_NAME_kie_diplomacy_mod: "Lazos con Occidente"
 STATIC_MODIFIER_DESC_kie_diplomacy_mod: "Los enviados del Gran Príncipe de Kiev están en los salones de las cortes occidentales, y su nombre está ahora inscrito en los libros de los escribas extranjeros."
 STATIC_MODIFIER_NAME_kie_silver_route_mod: "La Ruta de la Plata"
 STATIC_MODIFIER_DESC_kie_silver_route_mod: "La ruta de la plata del occidente fluye al tesoro de Kiev."
 STATIC_MODIFIER_NAME_kie_ruthenian_army_mod: "Nacimiento del ejército rutenio"
 STATIC_MODIFIER_DESC_kie_ruthenian_army_mod: "Ejército rutenio nacido: fuerza disciplinada, que combina la caballería cosaca y la noble."
 STATIC_MODIFIER_NAME_kie_warsaw_mod: "Pacificación de Polonia"
 STATIC_MODIFIER_DESC_kie_warsaw_mod: "Polonia pacificada: Varsovia reconoce la suzeranía de Kiev."
 STATIC_MODIFIER_NAME_kie_beeswax_mod: "Cera y miel"
 STATIC_MODIFIER_DESC_kie_beeswax_mod: "La cera y la miel de los bosques ucranianos enriquecen el comercio de Kiev."
 STATIC_MODIFIER_NAME_kie_zhytomyr_mod: "Nudo comercial de Zhitómir"
 STATIC_MODIFIER_DESC_kie_zhytomyr_mod: "Zhitómir se desarrolla como próspero nudo comercial de la Ucrania de la margen derecha."
 STATIC_MODIFIER_NAME_kie_grand_principality_mod: "El Gran Principado de Kiev"
 STATIC_MODIFIER_DESC_kie_grand_principality_mod: "Gran Principado de Kiev proclamado: la más poderosa fuerza de Europa oriental."
 STATIC_MODIFIER_NAME_kie_literacy_mod: "Alfabetización en Kiev"
 STATIC_MODIFIER_DESC_kie_literacy_mod: "Manuscritos del scriptorium del Monasterio de las Cuevas son llevados a las escuelas, y los niños de Kiev aprenden sus letras."
 kie_conquer_smolensk: "Expedición a Smolensk"
 kie_conquer_smolensk_desc: "Toma Smolensk, la “llave de la Rus” y encrucijada de las comunicaciones este-oeste: establece influencia sobre Moscú y Polonia. Usa Chernígov como cabeza de puente para dominar toda la región de Smolensk."
 STATIC_MODIFIER_NAME_kie_smolensk_mod: "Smolensk, encrucijada del comercio este-oeste"
 STATIC_MODIFIER_DESC_kie_smolensk_mod: "Smolensk asegurada como importante nudo este-oeste."
 STATIC_MODIFIER_NAME_kie_chernihiv_mod: "Chernígov, baluarte de la margen izquierda"
 STATIC_MODIFIER_DESC_kie_chernihiv_mod: "El recaudador de impuestos de Kiev, de pie en el mercado de Chernígov, abre los libros de grano de la margen izquierda del Dniéper."
 kie_build_sevastopol: "Construcción de la base naval de Sebastopol"
 kie_build_sevastopol_desc: "Construye una base naval rutena en el puerto natural de Teodoro: este baluarte marítimo, que domina el Mar Negro, se convertirá en el puerto de origen de la flota cosaca."
 kie_build_odesa: "Construcción del puerto de Odesa"
 kie_build_odesa_desc: "Construye el mayor puerto comercial de la Rus en el litoral de Hadjibey: este puerto, que une el comercio del Mar Negro con el del Mediterráneo, se convertirá en arteria vital del comercio rutenio."
 STATIC_MODIFIER_NAME_kie_sevastopol_mod: "Base naval de Sebastopol"
 STATIC_MODIFIER_DESC_kie_sevastopol_mod: "La base naval de Sebastopol, que domina el Mar Negro, erigida como baluarte marítimo de la Rus."
 STATIC_MODIFIER_NAME_kie_odesa_mod: "Puerto comercial de Odesa"
 STATIC_MODIFIER_DESC_kie_odesa_mod: "Odesa, centro del comercio del Mar Negro, construida: el comercio marítimo de la Rus prospera."
 STATIC_MODIFIER_NAME_kie_unite_rus_mod: "Legado de la unificación"
 STATIC_MODIFIER_DESC_kie_unite_rus_mod: "Los príncipes de la Rus se reúnen en la corte de un solo Gran Príncipe, y los funcionarios de Kiev envían órdenes en el mismo formato a los escribas de todas las tierras."
