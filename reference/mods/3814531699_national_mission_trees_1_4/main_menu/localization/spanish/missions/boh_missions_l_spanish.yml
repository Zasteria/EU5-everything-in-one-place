l_spanish:
 boh_crown_of_bohemia_mission_pack: "La gloria de la Corona de Bohemia"
 boh_crown_of_bohemia_mission_pack_DESCRIPTION:0 "En 1337, Bohemia es un poderoso reino de Europa central bajo Juan I (el Rey Ciego) de la casa de Luxemburgo. Recorre la turbulenta historia de Bohemia —el emperador Carlos IV, la fundación de la Universidad Carolina, la Bula de Oro— y, desde la ejecución de Jan Hus hasta la táctica de los carros de guerra de las guerras husitas. Une Moravia, Silesia y Eslovaquia, desafía a los Habsburgo por el dominio del Sacro Imperio Romano y establece la Mancomunidad de Bohemia."
 boh_crown_of_bohemia_mission_pack_CRITERIA_DESCRIPTION:0 "Como Bohemia, alcanza el dominio imperial, el florecimiento cultural y la conquista del sur, para establecer la Mancomunidad de Bohemia."
 boh_crown_of_bohemia_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para establecer la Mancomunidad de Bohemia."
 boh_crown_of_bohemia_mission_pack_BUTTON_DETAILS:0 "Lleva adelante la voluntad del Rey Ciego: ¡de la Praga dorada al Imperio de Europa central!"
 boh_crown_of_jan: "La Corona del Rey Ciego"
 boh_crown_of_jan_desc: "Año 1337: Juan I, el Rey Ciego, gobierna Bohemia como uno de los más poderosos soberanos de Europa central. “No veo, pero aún puedo luchar”: el espíritu del Rey Ciego es el orgullo de Bohemia. Antes de su muerte heroica en la batalla de Crécy, en 1346, elevó la casa de Luxemburgo al puesto de una de las mayores dinastías de Europa. Establece Praga como capital real y fortalece los cimientos del reino."
 boh_lion_of_empire: "El León del Imperio"
 boh_lion_of_empire_desc: "El rey de Bohemia es el más poderoso elector del Sacro Imperio Romano. Todo príncipe del Imperio debe inclinarse ante la espada de Bohemia. Establece la posición de “León del Imperio” por medio de la fuerza militar y del prestigio."
 boh_challenge_habsburg: "Desafía a los Habsburgo"
 boh_challenge_habsburg_desc: "La casa de Habsburgo, la mayor rival de Bohemia por el dominio de Europa central, planea la hegemonía imperial desde su base austríaca. Bohemia debe dejar clara su oposición."
 boh_saxony_ambitions: "Ambiciones sobre Sajonia"
 boh_saxony_ambitions_desc: "Sajonia, con Dresde en su corazón, es un importante centro de comercio y cultura en el Elba. Pon bajo control el electorado de Sajonia y amplía la influencia imperial de Bohemia."
 boh_conquer_austria: "Conquista Austria"
 boh_conquer_austria_desc: "Viena ha caído, y el corazón austríaco de los Habsburgo ha sido aplastado. El orgullo de los “Habsburgo, cuyos dominios nunca veían ponerse el sol”, por fin quebrado. Bohemia es la verdadera señora de Europa central."
 boh_dominate_hre: "Domina el Sacro Imperio Romano"
 boh_dominate_hre_desc: "Bohemia domina el Sacro Imperio Romano. Más allá del título imperial concretado por Carlos IV en 1355, Bohemia gobierna ahora como líder incontestada de todo el Imperio."
 boh_develop_prague: "Desarrolla Praga"
 boh_develop_prague_desc: "Praga, la “ciudad de las cien torres”: extendida por ambas orillas del Moldava, entró en su era de oro en el siglo XIV como la mayor ciudad de Europa central. El Castillo de Praga, el Puente de Carlos y la Plaza de la Ciudad Vieja proclaman al mundo la gloria del Reino de Bohemia."
 boh_charles_university: "Universidad Carolina"
 boh_charles_university_desc: "En 1348, Carlos IV fundó la Universidad Carolina en Praga: la primera universidad de Europa central. Esta institución de teología, derecho, medicina y filosofía produjo grandes reformadores como Jan Hus. Construye una universidad en Praga después de 1348 para alcanzar este hito histórico."
 boh_golden_bull: "La Bula de Oro"
 boh_golden_bull_desc: "La Bula de Oro de 1356, promulgada por Carlos IV, codificó el sistema electoral del Sacro Imperio Romano y estableció al rey de Bohemia como el más importante elector del Imperio. Haz inviolable la posición jurídica y política de Bohemia."
 boh_bohemian_glass: "El vidrio de Bohemia"
 boh_bohemian_glass_desc: "Nacido de las aguas cristalinas y la abundante arena de cuarzo de Bohemia, el vidrio bohemio es estimado en las cortes de toda Europa por su belleza refinada. Desarrolla esta industria para que el “cristal de Bohemia” se convierta en sinónimo de excelencia europea."
 boh_silver_mines: "Las minas de plata de Kutná Hora"
 boh_silver_mines_desc: "Las minas de plata de Kutná Hora fueron las más productivas de Europa en el siglo XIV. Esta plata, acuñada como groschen de Praga, circuló por toda Europa central y sostuvo la edad de oro económica de Bohemia."
 boh_develop_moravia: "Desarrolla Moravia"
 boh_develop_moravia_desc: "Moravia, centrada en Brno y Olomouc, es parte importante de las Tierras de la Corona de Bohemia. Desarrolla esta fértil región agrícola como segundo centro cultural y administrativo del Imperio bohemio."
 boh_internal_prosperity: "Prosperidad interna"
 boh_internal_prosperity_desc: "El vidrio de Bohemia, la plata de Kutná Hora, los mercados de Praga: juntos hacen de Bohemia la mayor potencia económica de Europa central."
 boh_jan_hus_question: "La cuestión de Jan Hus"
 boh_suppress_heresy: "Suprime la herejía"
 boh_suppress_heresy_desc: "Bohemia mantiene su lealtad a la Iglesia de Roma. Reprimiendo a los husitas como herejes y haciendo de la fe católica la piedra angular del Estado, se construye una fuerte alianza con el papa."
 boh_crusade_against_hussites: "Cruzada contra los husitas"
 boh_crusade_against_hussites_desc: "El papa ha proclamado una cruzada contra los husitas. Liderando el ataque a la herejía, Bohemia establece su reputación de guardiana de la Europa central católica."
 boh_papal_champion: "Campeona del papa"
 boh_papal_champion_desc: "Profunda confianza con el papado y fe católica inquebrantable: Bohemia, reconocida como la más fuerte guardiana de la Europa central católica."
 boh_hussite_reformation: "La Reforma husita"
 boh_hussite_reformation_desc: "“Aunque quemada, la verdad brilla desde las llamas”: el espíritu de Jan Hus echa raíces en Bohemia. Los utraquistas (husitas), simbolizados por el cáliz (kalich), se convierten en la fe de la nación, conquistando la independencia religiosa de Roma."
 boh_wagenburg: "Los guerreros de Dios"
 boh_wagenburg_desc: "La táctica de los carros de guerra (wagenburg), inventada por Jan Žižka —unir carros fortificados en una formación defensiva— aplastó repetidas veces a la caballería pesada de los cruzados. El genio militar de Bohemia florece."
 boh_king_of_heretics: "El Rey de los herejes"
 boh_king_of_heretics_desc: "Jorge de Poděbrady gobernó como “rey hereje de Bohemia” pese a la excomunión papal. Mantén el prestigio en medio del aislamiento diplomático europeo y prueba al mundo la legitimidad del Estado husita."
 boh_hungarian_succession: "Sucesión húngara"
 boh_hungarian_succession_desc: "Bohemia y Hungría formaron repetidas uniones personales por medio de los Luxemburgo y los Jagellones. Lleva el rico reino danubiano, con capital en Buda, a la suzeranía bohemia y refuerza el dominio de Europa central."
 boh_control_slovakia: "Controla Eslovaquia"
 boh_control_slovakia_desc: "Eslovaquia: patria de la Gran Moravia, donde viven los pueblos hermanos checo y eslovaco. Asegurar esta tierra fortalece las bases eslavas de Bohemia."
 boh_conquer_transylvania: "Conquista Transilvania"
 boh_conquer_transylvania_desc: "Transilvania, la “tierra más allá del bosque”, donde se mezclan rumanos, húngaros y alemanes, sirve de línea de frente del baluarte cristiano contra el Imperio otomano. Controlarla abre el camino hacia los Balcanes."
 boh_nicopolis_revenge: "La venganza de Nicópolis"
 boh_nicopolis_revenge_desc: "En la batalla de Nicópolis, en 1396, el ejército cruzado bajo el mando de Segismundo de Bohemia sufrió una derrota catastrófica ante el Imperio otomano. Ha llegado la hora de vengar esa humillación: recupera Nicópolis y expulsa a los otomanos de los Balcanes."
 boh_defend_against_turks: "Baluarte contra los turcos"
 boh_defend_against_turks_desc: "El Imperio otomano barre los Balcanes y se acerca a las puertas de Europa central. Refuerza las defensas de Transilvania y conviértete en escudo de la cristiandad con un poderoso ejército. Bohemia es el “Antemurale Christianitatis”: el baluarte de la civilización cristiana."
 boh_push_into_balkans: "Avanza sobre los Balcanes"
 boh_push_into_balkans_desc: "Venga Nicópolis y avanza hacia el sur como libertador de la cristiandad. Los eslavos, griegos y búlgaros de los Balcanes son liberados bajo el estandarte bohemio."
 boh_secure_silesia: "Asegura Silesia"
 boh_secure_silesia_desc: "Toda Silesia pasa al gobierno directo bohemio. Rica en hierro y carbón, esta tierra se convierte en el núcleo del imperio industrial bohemio."
 boh_polish_ambitions: "Ambiciones sobre Polonia"
 boh_polish_ambitions_desc: "Toma Cracovia y establece las relaciones de Bohemia con el Reino de Polonia. La herencia de la dinastía Premislida pertenece a Bohemia: Polonia debe convertirse en vecina bajo suzeranía bohemia."
 boh_conquer_poland: "Conquista Polonia"
 boh_conquer_poland_desc: "Las vastas llanuras de las tierras polacas pasan al control bohemio. Del Vístula al Óder, las tierras eslavas unidas bajo el estandarte del rey de Bohemia."
 boh_baltic_access: "Acceso al Báltico"
 boh_baltic_access_desc: "Con Gdansk tomada, Bohemia obtiene acceso directo al Mar Báltico. Transformada de Estado interior, Bohemia participa ahora también en el comercio del norte."
 boh_bohemian_diet: "La Dieta de Bohemia"
 boh_bohemian_diet_desc: "La asamblea de estamentos bohemia (dieta territorial), en la que participan nobleza, clero y burguesía, es una institución política. Fortalecerla sienta la base del gobierno imperial centralizado."
 boh_absolute_monarchy: "Monarquía absoluta"
 boh_absolute_monarchy_desc: "Monarquía absoluta establecida en Bohemia. Restringiendo los privilegios de la nobleza y consolidando por completo el poder real, Bohemia se transforma en un Estado centralizado moderno."
 boh_great_power_army: "El ejército de la gran potencia"
 boh_great_power_army_desc: "La táctica wagenburg, el Ejército Negro, la infantería de élite: las innovaciones militares de Bohemia crean el más fuerte ejército de Europa central. Establece la superioridad militar de Bohemia con alta tradición militar y gran ejército permanente."
 boh_dev_brno: "Desarrolla Brno"
 boh_dev_brno_desc: "Brno, capital de Moravia, prospera como ciudad industrial y comercial en la encrucijada de las rutas comerciales."
 boh_dev_wroclaw: "Desarrolla Breslavia"
 boh_dev_wroclaw_desc: "Breslavia, en el Óder: corazón de Silesia. Su tradición comercial multicultural amplía la riqueza del Imperio bohemio."
 boh_amber_road: "La Ruta del Ámbar"
 boh_amber_road_desc: "La antigua Ruta del Ámbar, que se extiende del Báltico al Mediterráneo, atraviesa Bohemia. Controlando esta ruta comercial, Bohemia se convierte en nudo del comercio norte-sur."
 boh_dev_pest: "Desarrolla Pest"
 boh_dev_pest_desc: "Pest, al otro lado del Danubio respecto a Buda: la mayor ciudad comercial de Hungría. Desarróllala como centro económico del sur del Imperio bohemio."
 boh_renaissance_court: "La corte renacentista"
 boh_renaissance_court_desc: "La Praga de Carlos IV fue centro del renacimiento de Europa central, donde se encontraban las culturas italiana, francesa e imperial. Artistas, eruditos y arquitectos se reúnen en la corte de Praga mientras florece una edad de oro de la cultura."
 boh_great_moravia_restored: "Gran Moravia restaurada"
 boh_great_moravia_restored_desc: "Por primera vez desde la Gran Moravia del siglo IX, toda Bohemia, Moravia y Silesia están unidas. El sueño de Svatopluk y Rostislav renace en nuestros días, y Bohemia brilla como centro de la civilización eslava."
 boh_central_european_power: "Potencia de Europa central"
 boh_central_european_power_desc: "Tres pilares —la Gran Moravia restaurada, la prosperidad interna y la monarquía absoluta— se juntan, y Bohemia reina como la mayor potencia de Europa central. Con 500+ provincias, ingresos de 500+ y prestigio de 80+, conquista esta gloria."
 boh_bohemian_commonwealth: "La Mancomunidad de Bohemia"
 boh_bohemian_commonwealth_desc: "Praga, Viena, Berlín, Cracovia, Buda: cinco grandes ciudades de Europa central unidas bajo el estandarte bohemio. La corona sembrada por Juan el Ciego en 1337 brilla ahora como corona imperial. “Bohemia non perit”: Bohemia no perece. Estas palabras grabadas para siempre en la historia."
 boh_krecy_legacy: "El legado de Crécy"
 boh_krecy_legacy_desc: "En la batalla de Crécy, en 1346, el Rey Ciego Juan I permaneció en el campo pese a su ceguera y murió heroicamente. “No veo, pero aún puedo luchar”: este espíritu está inscrito en el alma militar de Bohemia."
 boh_styria_carinthia: "Estiria y Carintia"
 boh_styria_carinthia_desc: "La conquista de Estiria y Carintia, en las estribaciones de los Alpes, establece las fronteras meridionales del Imperio bohemio. Estas tierras ricas en minerales y agricultura sustentan la prosperidad del imperio."
 boh_kutna_hora_mint: "La Casa de la Moneda de Kutná Hora"
 boh_kutna_hora_mint_desc: "El groschen de Praga, acuñado con la plata de Kutná Hora, fue la moneda más fiable de Europa central en el siglo XIV. Establece la supremacía monetaria de Bohemia mediante la minería masiva de plata."
 boh_gothic_architecture: "Ciudad de la arquitectura gótica"
 boh_gothic_architecture_desc: "La Catedral de San Vito, el Puente de Carlos, la Plaza de la Ciudad Vieja: la magnífica arquitectura gótica construida por Carlos IV transformó Praga en la “Ciudad Dorada”. Eleva el desarrollo de Praga y adelántate a esta gloria arquitectónica."
 boh_bohemian_trade_network: "La red comercial bohemia"
 boh_bohemian_trade_network_desc: "Una red comercial centrada en Praga, que une Viena, Breslavia, Cracovia y Núremberg, sustenta la ventaja comercial de Bohemia."
 boh_compactata: "Los Compactata de Praga"
 boh_compactata_desc: "Los Compactata de 1436 obligaron a la Iglesia católica a reconocer, como concesión, la comunión utraquista bajo las dos especies. El camino moderado utraquista aporta estabilidad religiosa a Bohemia."
 boh_utraquist_church: "La Iglesia utraquista"
 boh_utraquist_church_desc: "“Sub utraque specie” (bajo las dos especies): la iglesia utraquista, que da a los comulgantes tanto el pan como el vino, establecida como religión de Estado de Bohemia."
 boh_protestant_alliance: "La Alianza protestante"
 boh_protestant_alliance_desc: "La tradición husita de Bohemia se convierte en precursora de la Reforma protestante. Mediante alianzas con luteranos y calvinistas, Bohemia es reconocida como pilar del mundo protestante."
 boh_black_army: "El Ejército Negro"
 boh_black_army_desc: "El Ejército Negro, organizado por el rey Matías Corvino: uno de los primeros ejércitos profesionales permanentes de la Europa medieval. Cuando esta fuerza de élite lucha bajo el estandarte bohemio, nada en Europa central puede oponérsele."
 boh_dev_berlin: "Desarrolla Berlín"
 boh_dev_berlin_desc: "La pequeña ciudad de Berlín, en Brandeburgo, crece como nudo administrativo del norte del Imperio bohemio."
 boh_dev_konigsberg: "Desarrolla Königsberg"
 boh_dev_konigsberg_desc: "Königsberg (Castillo Real), construida por Premysl Otakar II, vuelve a Bohemia y se convierte en nudo del comercio báltico."
 boh_great_king: "El Gran Rey"
 boh_great_king_desc: "Alto prestigio, gran legitimidad, rica renta: el nombre del rey de Bohemia, uno de los mayores gobernantes de la historia de Europa central, resuena por toda Europa, superando incluso la gloria de Carlos IV."
 boh_dev_olomouc: "Olomouc florece"
 boh_dev_olomouc_desc: "Olomouc, antigua ciudad del saber y sede episcopal de Moravia, brilla como nudo de la cultura renacentista del norte."
 boh_upper_austria: "Alta Austria"
 boh_upper_austria_desc: "La Alta Austria, a lo largo del alto Danubio, incorporada al Imperio bohemio, establece la base para un nuevo avance hacia el sur."
 boh_carpathian_defense: "Defensa de los Cárpatos"
 boh_carpathian_defense_desc: "Una red de fortalezas a lo largo de los Montes Cárpatos establece una sólida línea defensiva de la frontera oriental del Imperio bohemio: escudo contra el Imperio otomano, los tártaros y otras amenazas del este."
 boh_events.20.t: "Los Habsburgo aplastados: dominio bohemio"
 boh_events.20.d: "Viena ha caído, y el orgullo de los Habsburgo está quebrado. “El dominio de los Habsburgo sobre Europa central, que duraba desde los tiempos de Rodolfo, ha terminado”: estas palabras resuenan en la corte de Praga. El rey de Bohemia es ahora el verdadero señor de Europa central. Los historiadores escribirán después: “La casa de Luxemburgo era la verdadera heredera del Imperio”."
 boh_events.20.a: "¡Gloria a Bohemia! ¡La era de los Habsburgo ha terminado!"
 boh_events.50.t: "Gran Moravia restaurada"
 boh_events.50.d: "Bohemia, Moravia y Silesia unidas. Cuatrocientos años después del colapso de la Gran Moravia, construida por Svatopluk, este legado renace en nuestros días. En la corte de Praga, el rey de Bohemia proclama el título de “Rex Slavorum”: Rey de los Eslavos."
 boh_events.50.a: "¡Gloria a la Gran Moravia! ¡Gloria a la unidad eslava!"
 boh_events.99.t: "Nace la Mancomunidad de Bohemia"
 boh_events.99.d: "Praga, Viena, Berlín, Cracovia, Buda: cinco grandes ciudades de Europa central, unidas bajo el estandarte bohemio. La corona sembrada por Juan el Ciego en 1337 brilla ahora como corona imperial. Mientras las agujas de las catedrales góticas se alzan sobre el cielo de Praga, las palabras “Bohemia non perit”, Bohemia no perece, están grabadas para siempre en la historia."
 boh_events.99.a: "¡Gloria a la Mancomunidad de Bohemia! ¡Que el señor de Europa central dure para siempre!"
 STATIC_MODIFIER_NAME_boh_blind_king_mod: "El legado del Rey Ciego"
 STATIC_MODIFIER_DESC_boh_blind_king_mod: "“No veo, pero aún puedo luchar”: el espíritu de Juan I, el Rey Ciego, asentó la piedra angular del Reino de Bohemia."
 STATIC_MODIFIER_NAME_boh_imperial_power_mod: "El León del Imperio"
 STATIC_MODIFIER_DESC_boh_imperial_power_mod: "Bohemia está al frente como el más fuerte elector del Imperio."
 STATIC_MODIFIER_NAME_boh_habsburg_rival_mod: "Desafío a los Habsburgo"
 STATIC_MODIFIER_DESC_boh_habsburg_rival_mod: "La rivalidad entre la casa de Luxemburgo y los Habsburgo por el dominio imperial se intensifica."
 STATIC_MODIFIER_NAME_boh_silesia_mod: "El hierro de Silesia"
 STATIC_MODIFIER_DESC_boh_silesia_mod: "El abundante mineral de hierro de Silesia sustenta la base de la industria de defensa de Bohemia."
 STATIC_MODIFIER_NAME_boh_hre_master_mod: "Dominio del Sacro Imperio Romano"
 STATIC_MODIFIER_DESC_boh_hre_master_mod: "Bohemia gobierna como líder incontestada del Sacro Imperio Romano, y ningún príncipe osa escribir a Praga sino con la cabeza inclinada."
 STATIC_MODIFIER_NAME_boh_prague_capital_mod: "Praga, la ciudad de las cien torres"
 STATIC_MODIFIER_DESC_boh_prague_capital_mod: "Praga, en el Moldava, desarrollada como la mayor ciudad de Europa central."
 STATIC_MODIFIER_NAME_boh_charles_university_mod: "Universidad Carolina"
 STATIC_MODIFIER_DESC_boh_charles_university_mod: "La primera universidad de Europa central se abre en Praga: brillando como centro de saber y reforma."
 STATIC_MODIFIER_NAME_boh_golden_bull_mod: "La Bula de Oro"
 STATIC_MODIFIER_DESC_boh_golden_bull_mod: "El estatus electoral del rey de Bohemia establecido por la Bula de Oro."
 STATIC_MODIFIER_NAME_boh_glass_industry_mod: "El vidrio de Bohemia"
 STATIC_MODIFIER_DESC_boh_glass_industry_mod: "El cristal bohemio establece su fama como la mejor maestría de Europa."
 STATIC_MODIFIER_NAME_boh_kutna_hora_mod: "La plata de Kutná Hora"
 STATIC_MODIFIER_DESC_boh_kutna_hora_mod: "La mayor mina de plata de Europa central sostiene la edad de oro económica de Bohemia. El groschen de Praga circula ampliamente."
 STATIC_MODIFIER_NAME_boh_moravia_mod: "Integración de Moravia"
 STATIC_MODIFIER_DESC_boh_moravia_mod: "Moravia, centrada en Brno y Olomouc, incorporada al Imperio bohemio."
 STATIC_MODIFIER_NAME_boh_prosperity_mod: "Prosperidad interna"
 STATIC_MODIFIER_DESC_boh_prosperity_mod: "El vidrio de Bohemia, la plata y los mercados se juntan para crear la mayor potencia económica de Europa central."
 STATIC_MODIFIER_NAME_boh_catholic_reform_mod: "Fe católica inquebrantable"
 STATIC_MODIFIER_DESC_boh_catholic_reform_mod: "Bohemia, manteniendo la lealtad a la Iglesia de Roma, es reconocida como líder de la civilización católica de Europa central."
 STATIC_MODIFIER_NAME_boh_crusader_glory_mod: "Gloria del cruzado"
 STATIC_MODIFIER_DESC_boh_crusader_glory_mod: "Liderando la cruzada antihusita, Bohemia conquista la reputación de defensora de la cristiandad."
 STATIC_MODIFIER_NAME_boh_papal_ally_mod: "Escudo del papa"
 STATIC_MODIFIER_DESC_boh_papal_ally_mod: "La profunda confianza con el papado hace de Bohemia la líder de la Europa central católica."
 STATIC_MODIFIER_NAME_boh_hussite_church_mod: "La Iglesia husita"
 STATIC_MODIFIER_DESC_boh_hussite_church_mod: "El espíritu de Jan Hus echa raíces en Bohemia: establecido un camino independiente de reforma religiosa."
 STATIC_MODIFIER_NAME_boh_wagenburg_mod: "Táctica wagenburg"
 STATIC_MODIFIER_DESC_boh_wagenburg_mod: "La táctica revolucionaria de Jan Žižka se instala en el ejército bohemio. Los carros de guerra aplastan a la caballería de los cruzados."
 STATIC_MODIFIER_NAME_boh_king_heretic_mod: "Prestigio del Rey de los herejes"
 STATIC_MODIFIER_DESC_boh_king_heretic_mod: "Manteniendo el prestigio pese a la excomunión papal, el rey bohemio supera el aislamiento diplomático."
 STATIC_MODIFIER_NAME_boh_slovakia_mod: "Integración de Eslovaquia"
 STATIC_MODIFIER_DESC_boh_slovakia_mod: "El estandarte del león de Bohemia ondea ahora sobre las colinas de Eslovaquia, patria de la Gran Moravia."
 STATIC_MODIFIER_NAME_boh_transylvania_mod: "Transilvania"
 STATIC_MODIFIER_DESC_boh_transylvania_mod: "La tierra más allá del bosque pasa al gobierno bohemio: establecida la cabeza de puente para la expansión balcánica."
 STATIC_MODIFIER_NAME_boh_nicopolis_glory_mod: "La venganza de Nicópolis"
 STATIC_MODIFIER_DESC_boh_nicopolis_glory_mod: "La humillación de 1396 vengada. Bohemia se convierte en vanguardia del contraataque al Imperio otomano."
 STATIC_MODIFIER_NAME_boh_antemurale_mod: "Escudo de la cristiandad"
 STATIC_MODIFIER_DESC_boh_antemurale_mod: "Las fortalezas de Transilvania se convierten en el escudo que detiene el avance otomano."
 STATIC_MODIFIER_NAME_boh_balkan_conqueror_mod: "Libertador de los Balcanes"
 STATIC_MODIFIER_DESC_boh_balkan_conqueror_mod: "Bohemia avanza hacia el sur como libertadora de los eslavos y cristianos de los Balcanes."
 STATIC_MODIFIER_NAME_boh_silesia_secured_mod: "Silesia plenamente incorporada"
 STATIC_MODIFIER_DESC_boh_silesia_secured_mod: "Toda Silesia bajo dominio bohemio directo: establecida la base de la industria del hierro y del carbón."
 STATIC_MODIFIER_NAME_boh_poland_subjugated_mod: "Polonia subyugada"
 STATIC_MODIFIER_DESC_boh_poland_subjugated_mod: "Las llanuras polacas pasan al control bohemio: establecida la base para la expansión oriental."
 STATIC_MODIFIER_NAME_boh_baltic_access_mod: "Acceso al Báltico"
 STATIC_MODIFIER_DESC_boh_baltic_access_mod: "Con Gdansk tomada, Bohemia puede participar directamente en el comercio báltico."
 STATIC_MODIFIER_NAME_boh_diet_mod: "La Dieta de Bohemia"
 STATIC_MODIFIER_DESC_boh_diet_mod: "En la cámara de la dieta territorial, los delegados de los estamentos escuchan ahora con atención la política del emperador."
 STATIC_MODIFIER_NAME_boh_absolutism_mod: "Monarquía absoluta"
 STATIC_MODIFIER_DESC_boh_absolutism_mod: "Monarquía absoluta establecida en Bohemia: transformación en un Estado centralizado moderno."
 STATIC_MODIFIER_NAME_boh_military_power_mod: "Ejército de la gran potencia"
 STATIC_MODIFIER_DESC_boh_military_power_mod: "El ejército de élite de Bohemia, heredero de la tradición wagenburg y del Ejército Negro, posee el mayor poderío militar de Europa central."
 STATIC_MODIFIER_NAME_boh_brno_mod: "Brno prospera"
 STATIC_MODIFIER_DESC_boh_brno_mod: "La capital de Moravia, Brno, se desarrolla como centro de comercio e industria."
 STATIC_MODIFIER_NAME_boh_wroclaw_mod: "Breslavia prospera"
 STATIC_MODIFIER_DESC_boh_wroclaw_mod: "Breslavia, en el Óder, funciona como corazón de la economía silesia."
 STATIC_MODIFIER_NAME_boh_amber_road_mod: "La Ruta del Ámbar"
 STATIC_MODIFIER_DESC_boh_amber_road_mod: "Bohemia, controlando la antigua Ruta del Ámbar del Báltico al Mediterráneo, se convierte en nudo del comercio norte-sur."
 STATIC_MODIFIER_NAME_boh_pest_mod: "Pest prospera"
 STATIC_MODIFIER_DESC_boh_pest_mod: "Pest, en el Danubio, desarrollada como centro comercial del sur del Imperio bohemio."
 STATIC_MODIFIER_NAME_boh_renaissance_mod: "La corte renacentista"
 STATIC_MODIFIER_DESC_boh_renaissance_mod: "Praga se convierte en centro del renacimiento de Europa central, donde se encuentran las culturas italiana, francesa y centroeuropea."
 STATIC_MODIFIER_NAME_boh_great_moravia_mod: "Gran Moravia restaurada"
 STATIC_MODIFIER_DESC_boh_great_moravia_mod: "Por primera vez desde Svatopluk, Bohemia, Moravia y Silesia unidas: el centro de la civilización eslava renace."
 STATIC_MODIFIER_NAME_boh_central_power_mod: "Potencia de Europa central"
 STATIC_MODIFIER_DESC_boh_central_power_mod: "Bohemia gobierna como la mayor potencia de Europa central, estableciendo superioridad en imperio, cultura y fuerza militar."
 STATIC_MODIFIER_NAME_boh_krecy_glory_mod: "El legado de Crécy"
 STATIC_MODIFIER_DESC_boh_krecy_glory_mod: "La muerte heroica del Rey Ciego se transmite como orgullo militar de Bohemia."
 STATIC_MODIFIER_NAME_boh_alpine_lands_mod: "Tierras alpinas"
 STATIC_MODIFIER_DESC_boh_alpine_lands_mod: "Guarniciones con la bandera bohemia guardan ahora los pasos montañosos de Estiria y Carintia."
 STATIC_MODIFIER_NAME_boh_silver_currency_mod: "El groschen de Praga"
 STATIC_MODIFIER_DESC_boh_silver_currency_mod: "El groschen de Praga, acuñado con la plata de Kutná Hora, se convierte en la mayor moneda internacional de Europa central."
 STATIC_MODIFIER_NAME_boh_golden_prague_mod: "La Praga dorada"
 STATIC_MODIFIER_DESC_boh_golden_prague_mod: "La Catedral de San Vito, el Puente de Carlos, las Cien Torres: Praga se convierte en el mayor centro cultural de Europa central como “Ciudad Dorada”."
 STATIC_MODIFIER_NAME_boh_trade_network_mod: "La red comercial bohemia"
 STATIC_MODIFIER_DESC_boh_trade_network_mod: "La red comercial de Europa central, centrada en Praga, sustenta la ventaja comercial de Bohemia."
 STATIC_MODIFIER_NAME_boh_compactata_mod: "Los Compactata de Praga"
 STATIC_MODIFIER_DESC_boh_compactata_mod: "Reconciliación entre católicos y utraquistas alcanzada: estabilidad religiosa restaurada a Bohemia."
 STATIC_MODIFIER_NAME_boh_utraquist_mod: "La Iglesia utraquista"
 STATIC_MODIFIER_DESC_boh_utraquist_mod: "La iglesia de la comunión bajo las dos especies establecida como religión de Estado de Bohemia."
 STATIC_MODIFIER_NAME_boh_protestant_alliance_mod: "La Alianza protestante"
 STATIC_MODIFIER_DESC_boh_protestant_alliance_mod: "Bohemia, con su tradición husita, es reconocida como pilar del mundo protestante."
 STATIC_MODIFIER_NAME_boh_black_army_mod: "El Ejército Negro"
 STATIC_MODIFIER_DESC_boh_black_army_mod: "El espíritu del Ejército Negro se instala en Bohemia: el más fuerte ejército profesional de Europa central concluido."
 STATIC_MODIFIER_NAME_boh_berlin_mod: "Berlín desarrollada"
 STATIC_MODIFIER_DESC_boh_berlin_mod: "La pequeña ciudad norteña de Berlín crece como nudo administrativo del norte del Imperio bohemio."
 STATIC_MODIFIER_NAME_boh_konigsberg_mod: "Königsberg recuperada"
 STATIC_MODIFIER_DESC_boh_konigsberg_mod: "Königsberg, construida por Premysl Otakar II, vuelve a Bohemia y se convierte en nudo del comercio báltico."
 STATIC_MODIFIER_NAME_boh_great_king_mod: "El Gran Rey"
 STATIC_MODIFIER_DESC_boh_great_king_mod: "El nombre del rey de Bohemia está grabado en la historia de Europa central como el de su mayor gobernante, superando incluso a Carlos IV."
 STATIC_MODIFIER_NAME_boh_fortress_europe_mod: "Fortaleza de Europa"
 STATIC_MODIFIER_DESC_boh_fortress_europe_mod: "Una red de fortalezas de los Alpes a los Cárpatos detiene el avance otomano."
 STATIC_MODIFIER_NAME_boh_olomouc_mod: "Olomouc florece"
 STATIC_MODIFIER_DESC_boh_olomouc_mod: "Olomouc, centro del saber y la religión de Moravia, brilla como nudo de la cultura renacentista del norte."
 STATIC_MODIFIER_NAME_boh_upper_austria_mod: "Alta Austria"
 STATIC_MODIFIER_DESC_boh_upper_austria_mod: "Sobre las murallas de la Alta Austria, río arriba en el Danubio, ondea el estandarte del Imperio bohemio, y los caminos hacia el sur están abiertos."
 STATIC_MODIFIER_NAME_boh_carpathian_mod: "Defensa de los Cárpatos"
 STATIC_MODIFIER_DESC_boh_carpathian_mod: "Una red de fortalezas a lo largo de los Cárpatos se convierte en el escudo que protege la frontera oriental del Imperio bohemio."
 STATIC_MODIFIER_NAME_boh_bohemian_commonwealth_final_mod: "Gloria de la Mancomunidad de Bohemia"
 STATIC_MODIFIER_DESC_boh_bohemian_commonwealth_final_mod: "La Mancomunidad de Bohemia, que controla las cinco grandes ciudades de Europa central, concluida. “Bohemia non perit”: estas palabras grabadas para siempre en la historia."
 STATIC_MODIFIER_NAME_boh_habsburg_crushed_mod: "Los Habsburgo aplastados"
 STATIC_MODIFIER_DESC_boh_habsburg_crushed_mod: "Viena ha caído, y el dominio de los Habsburgo sobre Europa central ha terminado. Bohemia se alza como verdadera señora."
 boh_fortress_of_europe: "Fortaleza de Europa"
 boh_fortress_of_europe_desc: "Una red de fortalezas que se extiende de los Alpes a los Cárpatos detiene el avance otomano. Bohemia actúa como “Escudo de Europa”."
 boh_dev_plzen: "Desarrolla Pilsen"
 boh_dev_plzen_desc: "Pilsen: ciudad clave de la Bohemia occidental y futura patria de la cerveza Pilsner, famosa en todo el mundo. Situada en la confluencia del Radbuza y el Mže, el desarrollo de esta ciudad sustenta el comercio y la industria en toda la Bohemia occidental."
 boh_dev_cheb: "Desarrolla Cheb"
 boh_dev_cheb_desc: "Cheb, antigua ciudad a orillas del Ohře, es la puerta imperial donde se encuentran las culturas alemana y checa. Desarrolla esta ciudad, que domina las rutas comerciales con el Sacro Imperio Romano, como cabeza de puente de la diplomacia occidental."
 boh_dev_kutna_hora_city: "Desarrolla Kutná Hora"
 boh_dev_kutna_hora_city_desc: "Brillando con la riqueza de la plata, Kutná Hora se convirtió en la segunda ciudad de Bohemia después de Praga. Con la Catedral de Santa Bárbara en construcción, desarrolla esta ciudad en una verdadera metrópoli y establécela como corazón económico de Bohemia."
 boh_bohemian_agriculture: "La agricultura bohemia"
 boh_bohemian_agriculture_desc: "Las llanuras bohemias a lo largo del Elba forman una rica zona agrícola. Trigo, cebada y centeno maduran con abundancia, y el desarrollo de las granjas eleva enormemente la productividad. El suministro estable de alimentos sostiene el crecimiento poblacional en todo el Imperio bohemio."
 boh_moravian_wine: "El vino de Moravia"
 boh_moravian_wine_desc: "La Moravia meridional, en torno a Znojmo, es la mayor región vinícola de Bohemia. El clima cálido y el suelo calcáreo producen vinos moravos, apreciados incluso en la corte austríaca de Viena. Su sabor rico simboliza el refinamiento cultural del Imperio bohemio."
 boh_jihlava_silver: "Las minas de plata de Jihlava"
 boh_jihlava_silver_desc: "Jihlava, en las tierras altas bohemio-moravas, es una ciudad minera que rivaliza con Kutná Hora. Poner estas minas de plata en plena actividad amplía aún más la minería de plata de Bohemia y aumenta la acuñación de groschen de Praga."
 boh_opava_iron: "La industria del hierro de Opava"
 boh_opava_iron_desc: "Opava, capital del ducado silesio, es conocida por sus depósitos de mineral de hierro. Desarrollar la industria del acero de esta ciudad refuerza aún más la base industrial de Silesia y mejora mucho el equipamiento militar bohemio."
 boh_dev_litomerice: "Desarrolla Litoměřice"
 boh_dev_litomerice_desc: "Litoměřice, en el Elba, es una importante ciudad comercial de la Bohemia septentrional. Desarróllala como nudo de rutas comerciales, que llegan hasta Hamburgo por el Elba, y anima el comercio con el norte de Alemania."
 boh_silesian_mines: "Las minas de Silesia"
 boh_silesian_mines_desc: "Bajo el suelo de Silesia yacen hierro y carbón coquizable que sustentarán las futuras revoluciones industriales. Establece un sistema de minería a plena escala y eleva enormemente la productividad industrial del Imperio bohemio."
 boh_silesian_mines_unlock_tt: "La decisión «Desarrollar las minas de Silesia» ya está disponible."
 boh_silesian_mining_decision.title: "Desarrollar las minas de Silesia"
 boh_silesian_mining_decision.desc: "Los distritos mineros de Silesia son vastos y la Corona no puede abrirlos todos a la vez. Cada inversión en pozos, fundiciones y caminos lleva un distrito más a la producción plena, y la obra puede renovarse cada década."
 boh_silesian_mining_decision.a: "Invertir en un nuevo distrito minero."
 boh_bohemian_cloth: "La industria textil bohemia"
 boh_bohemian_cloth_desc: "Junto al vidrio bohemio, la industria textil y de paños de Bohemia establece su reputación europea. El paño de la Bohemia septentrional, junto a las rutas comerciales de Litoměřice, hace de Bohemia un centro de la industria textil."
 STATIC_MODIFIER_NAME_boh_plzen_mod: "Pilsen desarrollada"
 STATIC_MODIFIER_DESC_boh_plzen_mod: "Pilsen, ciudad clave de la Bohemia occidental, desarrollada como centro de comercio e industria."
 STATIC_MODIFIER_NAME_boh_cheb_mod: "Cheb desarrollada"
 STATIC_MODIFIER_DESC_boh_cheb_mod: "Cheb, la puerta occidental, funciona como nudo comercial con el Imperio."
 STATIC_MODIFIER_NAME_boh_kutna_hora_city_mod: "Ciudad de Kutná Hora"
 STATIC_MODIFIER_DESC_boh_kutna_hora_city_mod: "La segunda ciudad de Bohemia, rica en plata, se ha desarrollado en una verdadera metrópoli."
 STATIC_MODIFIER_NAME_boh_agriculture_mod: "Agricultura bohemia"
 STATIC_MODIFIER_DESC_boh_agriculture_mod: "Zona agrícola fértil a lo largo del Elba desarrollada: suministro estable de alimentos asegurado."
 STATIC_MODIFIER_NAME_boh_znojmo_mod: "Viñedos de Znojmo"
 STATIC_MODIFIER_DESC_boh_znojmo_mod: "La viticultura de la Moravia meridional madura, produciendo vino de alta calidad."
 STATIC_MODIFIER_NAME_boh_moravian_wine_mod: "Vino de Moravia"
 STATIC_MODIFIER_DESC_boh_moravian_wine_mod: "El vino moravo se convierte en mercancía apreciada incluso en la corte austríaca de Viena."
 STATIC_MODIFIER_NAME_boh_jihlava_mod: "Minas de plata de Jihlava"
 STATIC_MODIFIER_DESC_boh_jihlava_mod: "Las minas de plata de Jihlava operan a plena capacidad: productora de plata que rivaliza con Kutná Hora."
 STATIC_MODIFIER_NAME_boh_opava_mod: "Industria del acero de Opava"
 STATIC_MODIFIER_DESC_boh_opava_mod: "Industria del acero desarrollada en Opava, capital del ducado silesio."
 STATIC_MODIFIER_NAME_boh_litomerice_mod: "Nudo comercial de Litoměřice"
 STATIC_MODIFIER_DESC_boh_litomerice_mod: "Litoměřice, en el Elba, se desarrolla como nudo de rutas comerciales con el norte de Alemania."
 STATIC_MODIFIER_NAME_boh_silesian_mines_mod: "Minas de Silesia"
 STATIC_MODIFIER_DESC_boh_silesian_mines_mod: "Las ricas minas de hierro y carbón de Silesia operan a plena capacidad: el poder industrial de Bohemia ha aumentado enormemente."
 STATIC_MODIFIER_NAME_boh_cloth_industry_mod: "Industria textil bohemia"
 STATIC_MODIFIER_DESC_boh_cloth_industry_mod: "La industria textil y de paños de Bohemia, junto con el vidrio, establecida como principal mercancía de exportación."
 boh_sugar_beet: "Cultivo de la remolacha azucarera"
 boh_sugar_beet_desc: "La era de las revoluciones: las innovaciones científicas e industriales transforman la agricultura bohemia. La remolacha azucarera es un cultivo ideal para el clima frío de Bohemia. La producción de azúcar, antaño monopolio de la caña, pasa también a venir de los campos bohemios. Las nuevas tecnologías agrícolas de la Revolución Industrial modernizan la agricultura bohemia."
 boh_porcelain_industry: "La industria de la porcelana bohemia"
 boh_porcelain_industry_desc: "La era de las revoluciones: el caolín (arcilla de porcelana) de la Bohemia occidental es el mejor material de porcelana de Europa. La porcelana bohemia, nacida de la arcilla blanca en torno a Karlovy Vary (Carlsbad), rivaliza con la refinada maestría de la porcelana de Meissen, en Dresde, adornando cortes de toda Europa."
 STATIC_MODIFIER_NAME_boh_porcelain_mod: "Porcelana bohemia"
 STATIC_MODIFIER_DESC_boh_porcelain_mod: "La porcelana del caolín de la Bohemia occidental se convierte en artículo de lujo, adornando las cortes europeas."
 boh_jan_hus_question_desc: "El espíritu reformador de Jan Hus se extiende por toda Bohemia. El recuerdo de su quema en el concilio de Constanza (1415) está grabado hondo en los corazones de los checos, y la ira contra la Iglesia de Roma alcanza su cenit. Cuando la cuestión de la fe ya no puede evitarse, Bohemia debe definir su propio camino."
 boh_events.60.t: "Cultivo de la remolacha azucarera: amanecer de una nueva industria"
 boh_events.60.d: "Año 1737: la tecnología de producción de azúcar a partir de la remolacha (Beta vulgaris) se ha desarrollado en toda Europa. Los campos fértiles de Bohemia son ideales para el cultivo de esta nueva planta. ¿Qué lugar recibirá la primera granja de remolacha azucarera: Poděbrady o Hradec Králové?"
 boh_events.60.a: "Plantar remolacha azucarera en los campos de Poděbrady (patria del “rey hereje” Jorge)"
 boh_events.60.b: "Plantar remolacha azucarera en los campos de Hradec Králové (las fértiles tierras del Elba)"
 STATIC_MODIFIER_NAME_boh_jan_hus_mod: "La verdad de Hus"
 STATIC_MODIFIER_DESC_boh_jan_hus_mod: "Copias de los sermones de Jan Hus pasan de mano en mano incluso en las casas de campesinos de Bohemia."
 STATIC_MODIFIER_NAME_boh_sugar_beet_choice_mod: "Granja de remolacha azucarera"
 STATIC_MODIFIER_DESC_boh_sugar_beet_choice_mod: "El cultivo de la remolacha madura: el azúcar bohemio se exporta a los mercados europeos."
 boh_conquer_silesia: "Incorpora Silesia"
 boh_conquer_silesia_desc: "Silesia es parte de las Tierras de la Corona de Bohemia. Incorporar esta región, rica en mineral de hierro y plata, refuerza enormemente la base industrial y militar de Bohemia."
 boh_events.50.b: "No, mantener los colores tradicionales de Bohemia: no hay necesidad de cambio"
 boh_urban_privileges: "Privilegios urbanos bohemios"
 boh_urban_privileges_desc: "Con Brno y Olomouc desarrolladas, Bohemia ha establecido un sistema de conceder privilegios especiales a sus ciudades. Las ciudades feudales refuerzan el control de la nobleza, suprimiendo la liberación de los campesinos; las ciudades eclesiásticas promueven la conversión religiosa."
 STATIC_MODIFIER_NAME_boh_ecclesiastical_city_rights: "Derechos de ciudad eclesiástica"
 STATIC_MODIFIER_DESC_boh_ecclesiastical_city_rights: "En esta ciudad, donde las campanas de la catedral marcan cada hora del día, hasta las reglas del mercado se someten a las horas de oración."
 boh_urban_privileges_unlock_tt: "Desbloquea los privilegios urbanos Ciudad feudal (Poddanská nebo vrchnostenská města) y Ciudad eclesiástica (Biskupská nebo klášterní města)."
