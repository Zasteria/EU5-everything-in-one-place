l_spanish:
 hab_integrated_crown: "Tierra de la corona integrada"
 hab_integrated_crown_plural: "Tierras de la corona integradas"
 eng_welsh_principality: "Principado aliado"
 eng_welsh_principality_plural: "Principados aliados"
 eng_welsh_principality_desc: "Un estatus especial concedido a un reino que ha elegido la asociación en lugar de la rivalidad: el soberano no puede obligarlo a participar en guerras ofensivas, e incluso este principado tiene derecho a declarar la guerra por su cuenta. A cambio, la anexión resulta prácticamente imposible, y ambos Estados prosperan juntos gracias a este vínculo especial."
