l_spanish:
 bra_quality_doctrine_reform: "Doctrina del arma de élite"
 bra_quality_doctrine_reform_desc: "Una doctrina militar que prioriza un ejército pequeño y de élite: soldados excelentes y el uso hábil de las milicias permiten que una fuerza menor se enfrente a otra mayor. Cara de mantener, pero inigualable en poder de combate."
 bra_quantity_doctrine_reform: "Doctrina de la movilización general"
 bra_quantity_doctrine_reform_desc: "“Prusia no es un Estado con un ejército, sino un ejército con un Estado”: una doctrina de cantidad, no de calidad, que aplasta al enemigo por el número. Barata de mantener, aunque la disciplina y la moral se resienten un poco."
 bra_advanced_quality_doctrine_reform: "Auftragstaktik"
 bra_advanced_quality_doctrine_reform_desc: "La “táctica de misión”: una doctrina que confía las decisiones independientes a los comandantes sobre el terreno, permitiendo una acción rápida y adecuada a la situación. Un ejército de maestría incomparable en todas las armas, infantería y artillería por igual, que establece una ventaja abrumadora por calidad. Caro de mantener y en efectivos, pero ningún ejército iguala su poder de combate."
 bra_advanced_quantity_doctrine_reform: "Nación en armas"
 bra_advanced_quantity_doctrine_reform_desc: "Una doctrina de movilización nacional total que arma a toda la población: barata de mantener, con efectivos abundantes y un enorme frente que aplastan al enemigo por el número. La disciplina y la moral siguen siendo el punto débil."
 bra_german_empire_reform: "Constitución imperial alemana"
 bra_german_empire_reform_desc: "Una estructura de gobierno típicamente alemana: una federación de Estados coronada por un emperador, que combina la autoridad central con la autonomía federal. Eleva la legitimidad y el prestigio de la corona y ofrece tanto dominio comercial como flexibilidad en la administración interna."
