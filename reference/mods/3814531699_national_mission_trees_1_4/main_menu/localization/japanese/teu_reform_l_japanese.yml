l_japanese:
 teu_crusade_path_reform: "十字軍騎士団の規律"
 teu_crusade_path_reform_desc: "東方十字軍への出発に際し、大団長が全騎士修道士に課した規律の誓い。略奪を秩序ある遠征の手段とし、聖戦の大義のもとに軍を統率する。"
 teu_northern_crusade_reform: "鉄十字の収奪体制"
 teu_northern_crusade_reform_desc: "十字架の下に築かれた恐怖の支配。占領した土地からは容赦なく富が吸い上げられ、抵抗する民は奴隷として市場に送られる。かつての聖戦の理想は薄れ、団はもはや十字軍というより、征服と搾取を制度とした軍事国家と化しつつある。"
 teu_northern_crusade_reform_loot_tt: "占領したロケーションに略奪の被害を与える（時間経過で減衰）"
