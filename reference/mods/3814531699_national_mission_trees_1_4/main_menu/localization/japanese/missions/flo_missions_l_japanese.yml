l_japanese:
 flo_magnifico_mission_pack: "イル・マニフィコの遺産"
 flo_magnifico_mission_pack_DESCRIPTION:0 "フィレンツェ共和国は、メディチ家という卓越した家門の下、商業と芸術と学問において最先端を走っている。ウール工業とメディチ銀行が生み出す莫大な富を基盤に、ルネサンスの揺籃として栄えるか、それともトスカーナを統一しローマまで制してイタリアの覇者「イル・マニフィコ」となるか。商人の知恵と君主の野心が交差する都、フィレンツェの選択が問われる。"
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION:0 "フィレンツェとしてミッションを達成し、商業と文化の繁栄とイタリア征服を実現せよ。"
 flo_magnifico_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してイル・マニフィコの遺産を歩め。"
 flo_magnifico_mission_pack_BUTTON_DETAILS:0 "ルネサンスを花開かせ、トスカーナを制覇し、イタリアの覇者となれ！"

 flo_rise_of_the_commune: "フィレンツェ・コムーネの台頭"
 flo_rise_of_the_commune_desc: "1337年、フィレンツェはゲルフ（教皇派）とギベリン（皇帝派）の争いの中、商人と職人の自治都市国家「コムーネ」として発展してきた。バルディ家・ペルッツィ家の銀行がヨーロッパを席巻し、アルノ川沿いの羊毛工業が都市を豊かにしている。しかし国内では派閥抗争が絶えない。この混乱の時代を乗り越え、フィレンツェを真の強国へと導け。"

 flo_the_prince: "君主論"
 flo_the_prince_desc: "イタリア各地を外国勢力が蹂躙するイタリア戦争の時代、フィレンツェの外交官ニッコロ・マキャヴェリは「君主論」を著した。イタリアを統一できる新たな君主の到来を切望したこの書は、政治の現実を冷徹に見据えた革命的な著作である。"

 flo_arte_della_lana: "羊毛工業の振興"
 flo_arte_della_lana_desc: "「アルテ・デッラ・ラーナ」(羊毛商人組合)はフィレンツェ経済の中核を担う。英国産羊毛を輸入し、染色・加工してヨーロッパ全土に輸出する体制を整え、都市の富を生み出している。"

 flo_medici_bank: "メディチ銀行の確立"
 flo_medici_bank_desc: "メディチ家が設立した銀行は、ローマ教皇庁の公式銀行として機能し、ヨーロッパ各地に支店を展開している。その金融力こそが、フィレンツェが文化と政治の両面で影響力を持つ根幹となる。"

 flo_arno_renewal: "アルノ川の刷新"
 flo_arno_renewal_desc: "都市の発展とともにアルノ川沿いの整備が進み、フィレンツェはイタリア有数の繁栄した都市となった。高い開発度が都市の月次発展に持続的な恵みをもたらしている。"

 flo_arno_corridor: "アルノ川の橋廊"
 flo_arno_corridor_desc: "アルノ川にかかるポンテ・ヴェッキオの橋と運河が、フィレンツェの商業と統治の要となっている。橋の整備と水上交通の確立は、都市の発展を加速させる。"

 flo_arno_trade_network: "アルノ川の交易網"
 flo_arno_trade_network_desc: "アルノ川を軸にトスカーナ全域に張り巡らされた交易網は、フィレンツェの商業力の源泉となっている。この網を掌握することで、北イタリア全体の貿易を支配下に置くことができる。"

 flo_dominate_italian_trade: "イタリア交易の制覇"
 flo_dominate_italian_trade_desc: "フィレンツェの商業網は今やイタリア全土を覆っている。北から南まで、フィレンツェの商人なくしてイタリアの経済は動かない。"

 flo_duomo_di_firenze: "サンタ・マリア・デル・フィオーレ"
 flo_duomo_di_firenze_desc: "ブルネレスキが設計したドームの完成は、当時の建築技術の限界を超えた偉業である。その巨大なクーポラはフィレンツェ市民に深い誇りをもたらし、都市の永遠の象徴となった。"

 flo_birthplace_of_renaissance: "ルネサンスの発祥地"
 flo_birthplace_of_renaissance_desc: "フィレンツェはルネサンスの発祥地として、ヨーロッパ全体の知的刷新を先導している。古典古代への回帰と人文主義の精神がこの都市に根付いた。"

 flo_florentine_school_of_painting: "フィレンツェ絵画の学派"
 flo_florentine_school_of_painting_desc: "ボッティチェッリらが確立したフィレンツェ絵画の様式は、透視図法と写実性において全ヨーロッパの先を行っている。"

 flo_the_mona_lisa: "モナ・リザ"
 flo_the_mona_lisa_desc: "レオナルド・ダ・ヴィンチの傑作は、絵画の概念そのものを変えた。このような天才を輩出し続けるフィレンツェの芸術的土壌は他に並ぶものがない。"

 flo_uffizi: "ウフィツィ美術館"
 flo_uffizi_desc: "メディチ家が収集した芸術作品の数々を一堂に会するウフィツィは、世界最大の美術館となりうる。その文化的威光はフィレンツェの名声を永遠に高める。"

 flo_the_rise_of_medici: "メディチ家の台頭"
 flo_the_rise_of_medici_desc: "バルディ家・ペルッツィ家の崩壊後、台頭してきた新たな銀行家一族がいた。メディチ家だ。1397年にジョヴァンニ・ディ・ビッチ・デ・メディチが設立したメディチ銀行は、ローマ教皇庁との関係を基盤に急成長し、ヨーロッパ各地に支店を展開している。この一族こそが、フィレンツェの未来を担う。"

 flo_pazzi_conspiracy: "パッツィ家の陰謀"
 flo_pazzi_conspiracy_desc: "教皇シクストゥス4世とパッツィ家が企てたロレンツォへの暗殺は失敗に終わり、かえってメディチ家の権威を強固なものとした。"

 flo_machiavelli: "マキャヴェリの著述"
 flo_machiavelli_desc: "ニッコロ・マキャヴェリは「君主論」において、権力の現実を冷静に分析した。その思想はフィレンツェの政治哲学に深い影響を与えた。"

 flo_republic_of_virtue: "徳の共和国"
 flo_republic_of_virtue_desc: "フィレンツェは単なる商業国家ではなく、徳と共和主義の理念に基づく国家を目指している。正統性と安定こそが共和国の礎となる。"

 flo_camerata_fiorentina_nmt: "フィレンツェ・カメラータ"
 flo_camerata_fiorentina_nmt_desc: "フィレンツェの知識人と音楽家が集うカメラータは、オペラの誕生へと繋がる音楽革新の場となっている。芸術と科学が一体となって開花する都市の姿だ。"

 flo_subjugate_pisa: "ピサの征服"
 flo_subjugate_pisa_desc: "海港都市ピサはフィレンツェが長年求めてきた出口である。アルノ川を下り、地中海へと繋がるこの港を掌握することで、フィレンツェの商業圏は大きく広がる。"

 flo_siena_submitted: "シエナの屈服"
 flo_siena_submitted_desc: "長年の宿敵シエナがついに屈服した。モンタペルティの敗北の雪辱を果たし、その絹商人と銀行を取り込んだフィレンツェは今やトスカーナ南部を完全に掌握する。"

 flo_lucca_absorbed: "ルッカの吸収"
 flo_lucca_absorbed_desc: "独立を守り続けてきたルッカは、フィレンツェのトスカーナ統一の最後の障壁の一つである。その絹工業と金融力をフィレンツェの管轄下に置く。"

 flo_unify_tuscany: "トスカーナの統一"
 flo_unify_tuscany_desc: "トスカーナのほぼ全域をフィレンツェの支配下に収めた今、王国への格上げは自然な帰結である。フィレンツェはもはや小都市国家ではない。"

 flo_push_into_lombardy: "ロンバルディアへの進出"
 flo_push_into_lombardy_desc: "トスカーナを超え、北イタリアの心臓部ロンバルディアへと版図を広げる時が来た。ミラノ、ジェノヴァ、ヴェネツィアとの衝突は避けられない。"

 flo_march_on_rome: "ローマへの進軍"
 flo_march_on_rome_desc: "ローマを制する者がイタリアを制する。永遠の都を我が版図に収めることで、フィレンツェはかつてのローマ帝国の正統な後継者たる地位を主張できる。"

 flo_the_new_rome: "新たなるローマ"
 flo_the_new_rome_desc: "ローマを征服したフィレンツェは、今やイタリア半島の大半を支配する帝国となった。新しいローマを築くべき時が来た。"

 flo_il_magnifico_of_italy: "イタリアのイル・マニフィコ"
 flo_il_magnifico_of_italy_desc: "ロレンツォ・デ・メディチが「イル・マニフィコ（偉大なる者）」と呼ばれたように、今やフィレンツェ全体がイタリアの「偉大なる者」となった。"

 flo_medici_oriental_press: "メディチ家東洋印刷所"
 flo_medici_oriental_press_desc: "メディチ家が設立した印刷所は、ビザンツ帝国崩壊後に流れ込んだギリシャ語写本を収集・印刷している。古代の知識が再びヨーロッパに息づこうとしている。"

 flo_clock_tower: "シニョーリア広場の時計塔"
 flo_clock_tower_desc: "パラッツォ・デッラ・シニョーリアに設置された精密な時計塔は、フィレンツェの技術力の象徴となった。時間の管理が商業と統治の効率を高める。"


 flo_first_modern_engineer: "最初の近代技師"
 flo_first_modern_engineer_desc: "フィリッポ・ブルネレスキはドームの建設において、古代ローマ以来の建築技術を超えた革新的な工法を生み出した。その技術的遺産はイタリア全土の城塞建築にも活かされる。"

 flo_humiliate_venice: "ヴェネツィアの屈辱"
 flo_humiliate_venice_desc: "長年の海洋ライバルであるヴェネツィア共和国を追い越す時が来た。地中海の女王の鼻をへし折り、フィレンツェこそがイタリア第一の国家であることを証明する。"

 flo_papal_relations: "教皇との関係"
 flo_papal_relations_desc: "ローマを制した今、教皇庁との関係を確固たるものにする必要がある。同盟か支配か、いずれにせよフィレンツェがローマ教会の最大の後援者となることは疑いない。"

 flo_vasari_corridor: "ウフィツィとヴァザーリの回廊"
 flo_vasari_corridor_desc: "ウフィツィ宮殿とポンテ・ヴェッキオを繋ぐヴァザーリの回廊は、コジモ1世の命を受けてジョルジョ・ヴァザーリが設計した。この密かな通廊はメディチ家の権威と芸術的卓越を象徴している。"

 flo_academy_of_florence: "フィレンツェ・アカデミー"
 flo_academy_of_florence_desc: "フィレンツェに設立された学術機関は、芸術・科学・哲学の総合的な研究の場となっている。ルネサンスの知識がここから世界へと広がっていく。"

 flo_italian_cultural_hegemon: "イタリア文化の覇者"
 flo_italian_cultural_hegemon_desc: "商業と芸術と学問が一体となって花開いたフィレンツェは、今やイタリア全体の文化的中心地となった。その影響力はアルプス以北にまで及ぶ。"

 flo_magnifico: "イル・マニフィコ"
 flo_magnifico_desc: "商人の都から始まったフィレンツェは、文化の頂点に立ち、イタリア全土を制覇し、かつてのローマ帝国の後継者としての地位を確立した。「イル・マニフィコ」——偉大なる者の名が永遠に歴史に刻まれる。"
 STATIC_MODIFIER_NAME_flo_arte_della_lana_mod: "羊毛工業の繁栄"
 STATIC_MODIFIER_DESC_flo_arte_della_lana_mod: "アルテ・デッラ・ラーナ（羊毛ギルド）はフィレンツェ最大の産業組合であり、都市の経済的繁栄の根幹だった。イングランドやスペインから輸入した原毛を精巧に加工したフィレンツェの布地はヨーロッパ中で珍重され、メディチ家の巨富の源泉となった。"

 STATIC_MODIFIER_NAME_flo_medici_bank_mod: "メディチ銀行の覇権"
 STATIC_MODIFIER_DESC_flo_medici_bank_mod: "1397年にジョヴァンニ・ディ・ビッチ・デ・メディチが設立したメディチ銀行は最盛期にローマ・ヴェネツィア・ロンドン・ブルージュなど16都市に支店を持った。ローマ教皇庁の公式銀行として法外な利益を得た一方、教会法の利息禁止を「為替差益」という名目で回避した。"
 STATIC_MODIFIER_NAME_flo_arno_trade_network_mod: "アルノ川の交易網"
 STATIC_MODIFIER_DESC_flo_arno_trade_network_mod: "アルノ川はフィレンツェをピサの海港と結ぶ水上交通の大動脈だった。この川沿いの交易路を掌握することでフィレンツェは内陸都市でありながら地中海交易に直接参加でき、布地・銀行業・商業を組み合わせた独特の経済圏を形成した。"
 STATIC_MODIFIER_NAME_flo_dominate_italian_trade_mod: "イタリア交易の制覇"
 STATIC_MODIFIER_DESC_flo_dominate_italian_trade_mod: "中世末期のイタリアはヨーロッパ最大の商業地帯であり、フィレンツェ・ヴェネツィア・ジェノヴァの商人がその頂点に君臨した。フィレンツェ商人は北ヨーロッパ全体に金融ネットワークを張り巡らせ、英仏百年戦争の両陣営に融資するほどの影響力を持った。"
 STATIC_MODIFIER_NAME_flo_duomo_di_firenze_mod: "フィオーレ大聖堂の完成"
 STATIC_MODIFIER_DESC_flo_duomo_di_firenze_mod: "フィレンツェ大聖堂（サンタ・マリア・デル・フィオーレ）のクーポラはブルネレスキが1436年に完成させた。ローマのパンテオン以来、1000年以上誰も実現できなかった大規模ドームを木製の骨組みも足場も使わずに建設した革命的な工学的業績は、ルネサンスの精神を象徴する。"
 STATIC_MODIFIER_NAME_flo_birthplace_of_renaissance_mod: "ルネサンスの発祥地"
 STATIC_MODIFIER_DESC_flo_birthplace_of_renaissance_mod: "「ルネサンス（再生）」はフィレンツェで生まれた。コジモ・デ・メディチが設立したプラトン・アカデミーでマルシリオ・フィチーノらが古代ギリシャ・ローマの思想を復興させ、ダンテ・ペトラルカ・ボッカッチョの文学的伝統と合わさって西洋文明を根底から変えた。"
 STATIC_MODIFIER_NAME_flo_florentine_school_of_painting_mod: "フィレンツェ絵画の学派"
 STATIC_MODIFIER_DESC_flo_florentine_school_of_painting_mod: "ジョット・ディ・ボンドーネが13世紀末に確立した写実的絵画の伝統は、マサッチョの遠近法・ボッティチェリの優雅さ・ダ・ヴィンチの多才さへと受け継がれた。フィレンツェ絵画は中世の聖画から近代芸術への移行を体現し、ヨーロッパ絵画の方向性を決定づけた。"
 STATIC_MODIFIER_NAME_flo_the_mona_lisa_mod: "モナ・リザの衝撃"
 STATIC_MODIFIER_DESC_flo_the_mona_lisa_mod: "レオナルド・ダ・ヴィンチが1503〜1519年頃に描いた「モナ・リザ」は謎めいた微笑みと革新的な遠近法・スフマート技法で西洋美術史上最も著名な作品となった。ダ・ヴィンチは絵画のみならず解剖学・工学・建築・音楽にわたる万能の天才だった。"
 STATIC_MODIFIER_NAME_flo_uffizi_mod: "ウフィツィの栄光"
 STATIC_MODIFIER_DESC_flo_uffizi_mod: "コジモ1世・デ・メディチが1560年にヴァザーリに設計させたウフィツィ宮殿は当初行政機関（ウフィツィ＝事務所）だったが、メディチ家のコレクションを収蔵して世界最初の美術館の一つとなった。ボッティチェリ・レオナルド・ミケランジェロの作品が集う芸術の殿堂だ。"
 STATIC_MODIFIER_NAME_flo_machiavelli_mod: "君主論の教え"
 STATIC_MODIFIER_DESC_flo_machiavelli_mod: "ニッコロ・マキャヴェリは1498〜1512年にフィレンツェ共和国の外交官・行政官として活躍した。メディチ家追放後に書いた『君主論』は「目的は手段を正当化する」という現実主義的政治論で、近代政治思想の基礎となった。"
 STATIC_MODIFIER_NAME_flo_republic_of_virtue_mod: "徳の共和国"
 STATIC_MODIFIER_DESC_flo_republic_of_virtue_mod: "フィレンツェは表向きは共和制を維持しながら実質的にはメディチ家が支配する独特の政体を持った。シニョリーア（市政府）・プリオリ（行政官）・グランコンシリオ（大評議会）などの制度は共和主義の理念と寡頭政治の現実を巧みに融合させた。"
 STATIC_MODIFIER_NAME_flo_camerata_fiorentina_mod: "フィレンツェ・カメラータ"
 STATIC_MODIFIER_DESC_flo_camerata_fiorentina_mod: "1570年代から1580年代にフィレンツェのジョヴァンニ・デ・バルディ伯爵の邸宅に集まった音楽家・詩人・知識人の集団「カメラータ」は、古代ギリシャ演劇の復興を目指した。その実験がオペラという全く新しい芸術形式を生み出し、西洋音楽の歴史を永遠に変えた。"
 STATIC_MODIFIER_NAME_flo_subjugate_pisa_mod: "ピサの港"
 STATIC_MODIFIER_DESC_flo_subjugate_pisa_mod: "ピサはかつてヴェネツィア・ジェノヴァと並ぶ海洋共和国として地中海に君臨したが、1284年のメローリアの海戦でジェノヴァに大敗して衰退した。フィレンツェが1406年にピサを征服したことで内陸国だったフィレンツェはついに海への出口を手に入れた。"
 STATIC_MODIFIER_NAME_flo_siena_submitted_mod: "シエナの屈服"
 STATIC_MODIFIER_DESC_flo_siena_submitted_mod: "シエナはフィレンツェの伝統的な競争相手で、トスカーナ覇権を巡って長年対立した。スパッニョーリ（スペイン）の支援を得て独立を保ったシエナだったが1555年に最終的に陥落した。パリオ（競馬祭）で知られる誇り高いシエナ人をフィレンツェの支配下に置くことはトスカーナ統一の象徴だ。"
 STATIC_MODIFIER_NAME_flo_lucca_absorbed_mod: "ルッカの絹と生地"
 STATIC_MODIFIER_DESC_flo_lucca_absorbed_mod: "ルッカはトスカーナで最も洗練された絹産業を持つ都市だった。13〜14世紀のルッカの絹は「ルッケーゼ」としてヨーロッパ中で珍重され、王侯貴族の衣装を彩った。メディチ家のライバルでもあったルッカの銀行家たちの財力もまた特筆すべきものがある。"
 STATIC_MODIFIER_NAME_flo_unify_tuscany_mod: "トスカーナの主"
 STATIC_MODIFIER_DESC_flo_unify_tuscany_mod: "エトルリア人の古都アレッツォ、詩の都シエナ、工芸の街ルッカ、港湾都市ピサ——これらを統合することでフィレンツェはトスカーナという歴史的・文化的・地理的な統一体の中心となる。ローマ時代の「トゥスキア」をメディチ家の旗の下に再統合する事業だ。"
 STATIC_MODIFIER_NAME_flo_push_into_lombardy_mod: "ロンバルディアへの進出"
 STATIC_MODIFIER_DESC_flo_push_into_lombardy_mod: "フィレンツェとミラノは15世紀イタリア政治の二大勢力として常に緊張関係にあった。ヴィスコンティ公とスフォルツァ公のミラノ拡張政策に対してフィレンツェは外交と傭兵隊長（コンドッティエーレ）を駆使して抵抗し続けた。この拮抗がルネサンス外交の洗練を生んだ。"
 STATIC_MODIFIER_NAME_flo_the_new_rome_mod: "新たなるローマ"
 STATIC_MODIFIER_DESC_flo_the_new_rome_mod: "フィレンツェはしばしば「新ローマ」と称された。メディチ家のコジモとロレンツォはローマのパトロン文化を意識的に模倣し、古代ローマの美徳をルネサンスの精神で再現しようとした。ローマそのものを支配することはその象徴的完成だ。"
 STATIC_MODIFIER_NAME_flo_il_magnifico_of_italy_mod: "イタリアのイル・マニフィコ"
 STATIC_MODIFIER_DESC_flo_il_magnifico_of_italy_mod: "ロレンツォ・デ・メディチ（偉大なるロレンツォ、1449〜1492年）は芸術家・詩人・外交家・政治家として時代の頂点に立った。彼が「イタリアのバランス」と呼んだ勢力均衡政策はイタリア戦争前夜の平和を支え、彼の宮廷はルネサンス文化の最高の輝きを発した。"
 STATIC_MODIFIER_NAME_flo_medici_oriental_press_mod: "東洋学芸の継承"
 STATIC_MODIFIER_DESC_flo_medici_oriental_press_mod: "コジモ・デ・メディチは1438〜1439年のフィレンツェ公会議でビザンツから来た学者たちからギリシャ語写本を大量に購入した。この収集がプラトンのラテン語訳や新プラトン主義の復興につながり、西洋思想史を変えた。グーテンベルクの印刷革命との組み合わせで知識は急速に広まった。"
 STATIC_MODIFIER_NAME_flo_clock_tower_mod: "時計塔の精密技術"
 STATIC_MODIFIER_DESC_flo_clock_tower_mod: "機械時計は14世紀から北イタリアの都市広場に登場し始めた。ジョット設計のフィレンツェ大聖堂の鐘楼（カンパニーレ）はその典型だ。共通の時間管理は都市の商業活動と行政を統合し、中世から近代への移行を支えるインフラとなった。"
 STATIC_MODIFIER_NAME_flo_the_rise_of_medici_mod: "メディチ家の台頭"
 STATIC_MODIFIER_DESC_flo_the_rise_of_medici_mod: "コジモ・デ・メディチ（父祖と呼ばれたコジモ、1389〜1464年）は銀行業の利益を基盤に政敵を追放してフィレンツェの実質的支配者となった。ローマ教皇庁の資金管理者・芸術の後援者・外交の仲裁者として彼はメディチ家の栄光の礎を築いた。"
 STATIC_MODIFIER_NAME_flo_first_modern_engineer_mod: "近代工学の先駆け"
 STATIC_MODIFIER_DESC_flo_first_modern_engineer_mod: "フィリッポ・ブルネレスキ（1377〜1446年）は建築・彫刻・工学の分野で革命をもたらした。線遠近法（透視図法）を理論化し、フィレンツェ大聖堂の大ドームを革新的な二重殻構造と骨組み技術で実現した。彼はルネサンス的「万能人（ウオモ・ウニヴェルサーレ）」の原型だ。"
 STATIC_MODIFIER_NAME_flo_humiliate_venice_mod: "ヴェネツィアの屈辱"
 STATIC_MODIFIER_DESC_flo_humiliate_venice_mod: "フィレンツェとヴェネツィアは中世イタリアの二大商業勢力として繁栄を競い、外交的にも軍事的にも長年対立した。特に15世紀のミラノへの勢力拡大を巡る対立は激しく、フィレンツェはヴェネツィアの陸地支配（テラフェルマ政策）を常に脅威として感じていた。"
 STATIC_MODIFIER_NAME_flo_papal_relations_mod: "教皇との絆"
 STATIC_MODIFIER_DESC_flo_papal_relations_mod: "メディチ家とローマ教皇庁の関係は複雑だった。1478年のパッツィ家の陰謀（フランチェスコ・サルヴィアーティ大司教が関与した暗殺計画）でロレンツォの弟ジュリアーノが殺害された後、ロレンツォはシクストゥス4世と一時対立したが、その後和解して強固な関係を再構築した。"
 STATIC_MODIFIER_NAME_flo_academy_of_florence_mod: "フィレンツェ・アカデミー"
 STATIC_MODIFIER_DESC_flo_academy_of_florence_mod: "コジモ・デ・メディチが支援したプラトン・アカデミーはマルシリオ・フィチーノを中心に古代哲学の復興を担った。プラトン全著作のラテン語訳、ヘルメス文書の翻訳、新プラトン主義の体系化——これらの知的事業が西洋哲学・神学・科学の基礎を更新した。"
 STATIC_MODIFIER_NAME_flo_italian_cultural_hegemon_mod: "イタリア芸術の後援"
 STATIC_MODIFIER_DESC_flo_italian_cultural_hegemon_mod: "ルネサンス期のフィレンツェはヨーロッパ全体の文化的重力の中心だった。フランス・ネーデルラント・ドイツ・イングランドの王侯貴族はフィレンツェの芸術家・建築家・学者を招聘し、「イタリア風」の宮廷文化を競って模倣した。"
 STATIC_MODIFIER_NAME_flo_magnifico_mod: "イル・マニフィコの栄光"
 STATIC_MODIFIER_DESC_flo_magnifico_mod: "「イル・マニフィコ（偉大なるロレンツォ）」はその人物のみならずフィレンツェという都市全体の輝きを表す言葉だ。芸術・哲学・外交・金融——あらゆる分野でヨーロッパの頂点に立ったフィレンツェの栄光は、後世の人々が「ルネサンス」と呼ぶ時代の真髄を体現している。"

 flo_events.1.t: "フィレンツェ・コムーネの台頭"
 flo_events.1.d: "1337年、フィレンツェはゲルフ（教皇派）とギベリン（皇帝派）の長年の争いによって揺れ動いている。ヨーロッパ最大の銀行家バルディ家とペルッツィ家が、イングランド王への多額の融資によって財政難に苦しみ始めている。黒死病の影が東方から迫り、僭主ウォルター・ド・ブリエンヌへの招待も画策されつつある。しかしフィレンツェのコムーネ（自治都市）の精神は生き続けている。羊毛工業と商人組合の力を礎として、この嵐の時代を乗り越えよ。"
 flo_events.1.a: "フィレンツェの未来は我らの手中にある"


 flo_events.3.t: "パッツィ家の陰謀の顛末"
 flo_events.3.d: "教皇シクストゥス4世とパッツィ家が企てたロレンツォ・デ・メディチへの暗殺は失敗に終わり、かえってメディチ家の権威を強固なものとした。陰謀の首謀者たちは処刑され、フィレンツェ市民はメディチへの支持をより一層強めた。この試練を乗り越えたことで、共和国の政治体制はより洗練されたものへと生まれ変わろうとしている。"
 flo_events.3.a: "試練が我らをより強くした"

 flo_events.4.t: "ローマへの進軍"
 flo_events.4.d: "かつてのローマ帝国の都が、今やフィレンツェの旗の下に入った。コンスタンティヌス帝の寄進状が偽物であることはすでに証明されている——ならば、イタリアを支配する正当な権利は力と知恵によって勝ち取ったフィレンツェにこそある。商人の都から始まったこの小さな共和国は、今や歴史に名を刻む帝国への道を歩んでいる。"
 flo_events.4.a: "ローマはフィレンツェの栄光に輝く"

 STATIC_MODIFIER_NAME_flo_arno_renewal_mod: "La Grande Opera（大いなる事業）"
 STATIC_MODIFIER_DESC_flo_arno_renewal_mod: "アルノ川の洪水は長年フィレンツェを悩ませてきた（1966年の洪水は現代でも語り継がれる）。しかし川岸の整備・橋の建設・堤防の強化によって川はむしろ都市の財産となった。川沿いの工房・染色場・羊毛洗い場がフィレンツェ経済の心臓部として機能した。"
 STATIC_MODIFIER_NAME_flo_arno_corridor_mod: "ポンテ・ヴェッキオの繁栄"
 STATIC_MODIFIER_DESC_flo_arno_corridor_mod: "ポンテ・ヴェッキオ（古い橋）はアルノ川に架かる最古の橋で、14世紀から金細工師・宝石商の店が並ぶフィレンツェの商業の象徴だ。コジモ1世がウフィツィとピッティ宮殿を結ぶために作らせたヴァザーリ回廊の一部として改修され、支配者と都市を繋ぐ象徴的な通路となった。"
 STATIC_MODIFIER_NAME_flo_vasari_corridor_mod: "ヴァザーリの回廊"
 STATIC_MODIFIER_DESC_flo_vasari_corridor_mod: "ジョルジョ・ヴァザーリが1565年にわずか5ヶ月で完成させたヴァザーリの回廊は、ウフィツィ宮殿からポンテ・ヴェッキオを経てピッティ宮殿まで繋ぐ空中回廊だ。コジモ1世が群衆に紛れずに移動するために設計されたこの回廊は権力者の安全と都市支配の技術的結晶だ。"

 flo_events.5.t: "ウフィツィとヴァザーリの回廊"
 flo_events.5.d: "コジモ1世・デ・メディチはウフィツィ宮殿（行政府）とピッティ宮殿を秘密の通廊で繋ぐよう、建築家ジョルジョ・ヴァザーリに命じた。ポンテ・ヴェッキオの上を通るこの「ヴァザーリの回廊」は、君主が公衆の目に触れることなく移動できる秘密の通路であり、メディチ家の権威と都市支配の象徴でもある。アルノ川を渡るこの精巧な建築は、フィレンツェの政治と芸術が一体であることを如実に示している。"
 flo_events.5.a: "回廊の完成がフィレンツェの統治を新たな次元へと高めた"

 STATIC_MODIFIER_NAME_flo_the_prince_mod: "新たなる君主"
 STATIC_MODIFIER_DESC_flo_the_prince_mod: "『君主論』（1513年）でマキャヴェリは「ライオンの力とキツネの狡知を兼ね備えよ」と説いた。愛されるより恐れられる方が安全であり、必要なら道徳より権力維持を優先せよという現実主義は、近代政治学の出発点となった。"

 flo_events.6.t: "君主論"
 flo_events.6.d: "イタリア戦争はフィレンツェに深刻な教訓を与えた。外交官ニッコロ・マキャヴェリは、権力の本質を赤裸々に分析した「君主論」を著した。分裂したイタリアを一つにまとめるには、道徳よりも現実の権力を重んじる新たな君主が必要だ。「能力と幸運の両方を持ち合わせた君主のみが、混乱したイタリアを救うことができる」——その答えは、もしかしたらフィレンツェの中にあるのかもしれない。"
 flo_events.6.a: "イタリアを救う新たな君主よ、来たれ"
