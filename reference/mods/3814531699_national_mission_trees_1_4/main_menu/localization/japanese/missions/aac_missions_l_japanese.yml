 aac_aachen_megalopolis: "アーヘン——中欧最大の大都市"
 aac_aachen_megalopolis_desc: "カール大帝の宮廷都市アーヘンがついに中欧最大の大都市として完成した。人口20万人・高度な都市開発・壮麗な建築群がアーヘンをヨーロッパ文明の中心地として確立する。"
 aac_events.10.t: "シャルルマーニュの玉座——カロリング朝の覚醒"
 aac_events.10.d: "アーヘン——かつてカール大帝（シャルルマーニュ、742〜814年）が宮廷を置き、800年に西ローマ皇帝として戴冠したこの都市が、カロリング朝の末裔の手に戻った。アーヘン大聖堂の荘厳な円蓋の下、大理石の玉座がその主の帰還を待っている。\n\n「ヨーロッパの父（Pater Europae）」と呼ばれたカール大帝の夢——ライン川からピレネーまで、ローマからバルト海まで統一されたキリスト教の帝国——を今こそ実現する時が来た。カロリング朝の復興を宣言し、フランク王国再建の第一歩を踏み出せ。"
 aac_events.10.a: "カロリング王朝の王として君臨する——君主制を宣言せよ"
 aac_events.10.b: "今は時期尚早——現在の統治体制のまま力を蓄えよ"
 STATIC_MODIFIER_NAME_aac_aachen_megalopolis_mod: "アーヘン大都市"
 STATIC_MODIFIER_DESC_aac_aachen_megalopolis_mod: "大聖堂の鐘の音が届く限りの街並みに、職人と学者と商人の家々がひしめき、アーヘンは西欧随一の都となった。"

 aac_events.50.b: "フランク王国万歳！カロリング朝の栄光が復活した——色は伝統のままでよい"
 aac_events.99.a: "西ローマ帝国の名と色（map_ROM）を採用する——ローマの復活を世界に示せ"
 aac_events.99.b: "西ローマ帝国の名を宣言する——ただし国旗の色は変えない"
