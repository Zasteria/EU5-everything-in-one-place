l_japanese:
 aac_carolingian_legacy_mission_pack: "カロリング朝の遺産——フランク王国の再興"
 aac_carolingian_legacy_mission_pack_DESCRIPTION:0 "1337年、アーヘンはカロリング朝の末裔が市長を務める神聖ローマ帝国内の自由都市だ。かつてカール大帝（シャルルマーニュ、742〜814年）の宮廷があったこの都市から、フランク王国の栄光を取り戻せ。ライン川・ガリア・フランドルを統合し、教皇の戴冠のもと「西ローマ皇帝」として君臨せよ。"
 aac_carolingian_legacy_mission_pack_CRITERIA_DESCRIPTION:0 "アーヘンとしてライン川・ガリア・イタリアを統一し、西ローマ帝国を再興せよ。"
 aac_carolingian_legacy_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してフランク王国を再興せよ。"
 aac_carolingian_legacy_mission_pack_BUTTON_DETAILS:0 "カール大帝の玉座から、西ローマ帝国へ！"

 aac_throne_of_charlemagne: "シャルルマーニュの玉座"
 aac_throne_of_charlemagne_desc: "アーヘン大聖堂——カール大帝が建設を命じ、800年の西ローマ皇帝戴冠の舞台となったこの場所が、カロリング朝の末裔の手に戻った。かつて西欧文明の中心であったアーヘンを支配し、フランク王国復興の第一歩を踏み出せ。"

 aac_control_rhineland: "ライン川の支配"
 aac_control_rhineland_desc: "ケルン・トリア・マインツ——ライン川沿いの三大司教都市はフランク王国の経済・宗教・政治の中枢だった。これらを掌握することで、ライン川全域がカロリング朝の手に戻る。"

 aac_integrate_lorraine: "ロレーヌの統合"
 aac_integrate_lorraine_desc: "ロレーヌ（ロタリンギア）はカール大帝の死後、孫世代のヴェルダン条約（843年）でフランク王国が三分割された際に生まれた中間地帯だ。メスとヴェルダンを取り戻すことで、分裂以前のフランク王国の核心部が再統合される。"

 aac_conquer_hre: "神聖ローマ帝国の盟主"
 aac_conquer_hre_desc: "アーヘンはかつて神聖ローマ皇帝戴冠の地だった。帝国の盟主として立つことでカール大帝の帝国的遺産を最も正統に引き継ぐ。"

 aac_control_flanders: "フランドルの支配"
 aac_control_flanders_desc: "フランドルはヨーロッパ最大の毛織物産業の中心地だ。ブリュッセルとリエージュを掌握し、フランドルの豊かな商業・工業力をフランク王国の復興に活かせ。"

 aac_brabant_trade: "ブラバントの交易"
 aac_brabant_trade_desc: "ブラバント公国の商業都市ブリュッセルを中心に、低地地方最大の交易ネットワークが広がっている。この交易網を支配することで、フランク王国の財政基盤が大幅に強化される。"

 aac_push_into_france: "パリへの進軍"
 aac_push_into_france_desc: "カール大帝はフランク族の王としてパリを含むガリア全土を支配した。パリを再び征服することでヴァロワ朝への復讐が果たされ、カロリング朝のガリア支配が復活する。"

 aac_conquer_northern_france: "北フランスの征服"
 aac_conquer_northern_france_desc: "ランスはフランク王国の戴冠の地——ここで洗礼を受けたクローヴィス1世の伝統を引き継ぎ、ノルマンディーとピカルディーを制圧してガリア北部の完全支配を確立せよ。"

 aac_conquer_burgundy: "ブルゴーニュの征服"
 aac_conquer_burgundy_desc: "ブルゴーニュはフランク王国の重要な一角を担ったワインと農業の豊かな地だ。この地を制圧することで南フランスへの進出路が開かれる。"

 aac_conquer_southern_france: "南フランスの征服"
 aac_conquer_southern_france_desc: "ラングドックとガスコーニュを制圧し、ガリア南部がカロリング朝の手に戻る。ピレネー山脈まで版図を広げることで、カール大帝が目指したガリア全土の支配が実現する。"

 aac_reunite_gaul: "ガリアの再統一"
 aac_reunite_gaul_desc: "ガリア全土——かつてカール大帝が支配した土地がすべてフランク王国の旗の下に統一された。ヴェルダン条約で三分割された帝国が800年以来初めて再統合される。"

 aac_develop_aachen: "アーヘンの整備"
 aac_develop_aachen_desc: "アーヘン大聖堂を中心とするこの古都を整備し、フランク王国の新首都として機能させよ。カール大帝の遺産が宿るこの地から、西欧再建の光が放たれる。"

 aac_frankish_law: "フランク法典の制定"
 aac_frankish_law_desc: "カール大帝は「カピトゥラリア（勅令集）」でフランク王国の法制度を整備した。その伝統を引き継ぎ、新たなフランク法典を制定することで帝国の法的基盤を確立せよ。"

 aac_missi_dominici: "ミッシ・ドミニチ（君主の使者）"
 aac_missi_dominici_desc: "カール大帝が設置したミッシ・ドミニチ（君主の使者）制度——帝国各地に派遣された王の代理人が地方統治を監督する。この制度を復活させることで、広大な帝国の中央集権的統治が可能となる。"

 aac_carolingian_renaissance: "カロリング・ルネサンス"
 aac_carolingian_renaissance_desc: "カール大帝はアルクィン・エーギンハルトらの学者を招いて「カロリング・ルネサンス」を推進した。アーヘン宮廷を文化・学術の中心地として復活させ、西欧文明の再興を牽引せよ。"

 aac_trade_empire: "交易帝国"
 aac_trade_empire_desc: "ライン川・ムーズ川・スヘルデ川の交易路を支配するフランク王国は、ヨーロッパ最大の交易国家となった。複数の市場中心地と豊かな収入でその経済的覇権を確立せよ。"

 aac_frankish_levy: "フランク軍役制"
 aac_frankish_levy_desc: "カール大帝のフランク軍はヨーロッパ最強の陸軍だった。その軍役制（ホスト制）を復活させ、農民兵士から騎士まで広範な軍事組織でフランク王国の軍事力を再建せよ。"

 aac_palatine_guard: "王宮近衛隊"
 aac_palatine_guard_desc: "皇帝の側近を守る王宮近衛隊——カール大帝の宮殿警備兵の伝統を受け継ぐ精鋭部隊がフランク王国の軍事的栄光を体現する。"

 aac_carolingian_cavalry: "カロリング騎馬隊"
 aac_carolingian_cavalry_desc: "カール大帝の軍事的成功の核心は強力な騎馬隊だった。重装甲騎兵（シュヴァリエ）がフランク王国の戦場を支配し、ザクセン・アヴァール・ムスリムを打ち破った伝説的な騎馬戦力を再建せよ。"

 aac_kingdom_of_franks: "フランク王国の復興"
 aac_kingdom_of_franks_desc: "ガリア統一・ロレーヌ統合・ミッシ・ドミニチ——三つの柱が揃い、フランク王国がついに復興した。800年以来初めて、カロリング朝の旗がライン川からピレネーまで翻る。"

 aac_papal_alliance: "教皇との同盟"
 aac_papal_alliance_desc: "800年のクリスマス、ローマのサン・ピエトロ大聖堂でカール大帝は教皇レオ3世から西ローマ皇帝の冠を授けられた。その伝統を受け継ぎ、教皇との強固な同盟を築いて「神の代理人」としての正統性を確立せよ。"

 aac_conquer_italy: "イタリアの征服"
 aac_conquer_italy_desc: "カール大帝は774年にランゴバルド王国を征服してイタリア王の称号を獲得した。ローマを掌握することで、教皇の承認を受けた「西ローマ皇帝」の復活への道が完成する。"

 aac_western_roman_empire: "西ローマ帝国の再興"
 aac_western_roman_empire_desc: "アーヘン・パリ・ローマ——西ローマ帝国の三都市が再びカロリング朝の旗の下に統一された。800年にカール大帝が建設した帝国が現代に復活し、「Renovatio Imperii Romani（ローマ帝国の再建）」が成就した。"

 aac_alsace_swabia: "アルザス・シュヴァーベンの掌握"
 aac_alsace_swabia_desc: "ライン川東岸のアルザスとシュヴァーベンはフランク王国の重要な一角だ。ヴォージュ山脈からアルプスまで広がるこの地を掌握し、ライン川支配を完全なものとせよ。"

 aac_champagne_fairs: "シャンパーニュの大市"
 aac_champagne_fairs_desc: "シャンパーニュ地方の定期大市（フォワール）はヨーロッパ最大の交易集会だった。イタリア商人・フランドル商人・ドイツ商人が集まるこの交易の場を掌握することでフランク王国の商業覇権が確立される。"

 aac_conquer_brittany: "ブルターニュの征服"
 aac_conquer_brittany_desc: "ブルターニュはケルト系ブレトン人の地でカール大帝も完全制圧できなかった頑強な地域だ。この西端の地を征服することでガリア西部が完全にフランク王国の管制下に入り、大西洋への出口が確保される。"

 aac_holy_crown: "聖なる冠"
 aac_holy_crown_desc: "教皇との深い信頼関係と高い正統性——「キリストの代理人」としての教皇がフランク王の権威を承認した。神と人の両方から認められた支配権が確立される。"

 aac_dev_reims: "ランスの整備"
 aac_dev_reims_desc: "ランスはフランク族の洗礼の地——クローヴィス1世がここでキリスト教の洗礼を受け、以来フランス王の戴冠式が行われる聖なる都市だ。この宗教的首都を整備することでカロリング朝の正統性がさらに強化される。"

 aac_dev_paris: "パリの整備"
 aac_dev_paris_desc: "セーヌ川の中州（シテ島）を中心とするパリはガリア最大の都市だ。フランク王国の西方首都として整備することで、アーヘンとパリの二都体制がフランク王国を支える。"

 aac_bretagne_fleet: "ブルターニュ艦隊"
 aac_bretagne_fleet_desc: "ブルターニュとフランドルの海軍伝統が組み合わさり、フランク王国が大西洋と北海両方を制する強力な海軍を持つようになった。"

 aac_events.20.t: "パリ陥落——カロリング朝の帰還"
 aac_events.20.d: "ヴァロワ朝の旗がパリの城壁から引き下ろされ、代わりにフランク王国の鷲の旗が翻った。ノートルダム大聖堂の鐘が鳴り響く中、アーヘンの市長の末裔がパリに入城する。「シャルルマーニュの後継者が帰ってきた」——歴史家たちはそう記すだろう。"
 aac_events.20.a: "パリよ永遠なれ！カロリング朝の旗を高く掲げよ！"

 aac_events.40.t: "ガリアの再統一——フランク王の復活"
 aac_events.40.d: "ライン川からピレネーまで、フランドルからプロヴァンスまで——ガリア全土がフランク王国の旗の下に統一された。843年のヴェルダン条約で三分割された帝国が、500年の時を経て再び一つとなった。「Dieu le veut（神がそれを望む）」——大聖堂に集まった民衆がそう叫ぶ。"
 aac_events.40.a: "ガリア万歳！フランク王国は永遠に！"

 aac_events.50.t: "フランク王国の復興宣言"
 aac_events.50.d: "ガリア統一・ロレーヌ統合・ミッシ・ドミニチ制度の確立——フランク王国の三本柱が揃った。アーヘン大聖堂でフランク王の戴冠式が行われ、カール大帝以来初めてフランク王国が正式に復興する。「Carolus Magnus rex Francorum（フランク人の王、カール大帝）の名において、フランク王国の再興を宣言する」"
 aac_events.50.a: "フランク王国万歳！カロリング朝の栄光が復活した——色もフランスの青で染めよ！"

 aac_events.99.t: "西ローマ帝国の再興"
 aac_events.99.d: "アーヘン・パリ・ローマ——三都市が再びカロリング朝の旗の下に統一された。800年のクリスマス、教皇レオ3世がカール大帝に冠を授けた伝説的な瞬間が現代に再現される。「Renovatio Imperii Romani（ローマ帝国の再建）」——この言葉が歴史に永遠に刻まれる。帝国の色をカロリング朝の深紅に変えるか？"

