l_japanese:
 boh_crown_of_bohemia_mission_pack: "ボヘミア王冠の栄光"
 boh_crown_of_bohemia_mission_pack_DESCRIPTION:0 "1337年、ボヘミアはルクセンブルク家の盲目王ヤン1世が統治する中欧の強国だ。カレル4世の神聖ローマ皇帝即位・プラハ大学創設・黄金勅書——そしてヤン・フス処刑からフス戦争のワゴンブルク戦術まで、波乱に満ちたボヘミアの歴史を駆け抜けろ。モラヴィア・シレジア・スロヴァキアを統合し、ハプスブルクに対抗して神聖ローマ帝国の盟主となり、「ボヘミア・コモンウェルス」を建国せよ。"
 boh_crown_of_bohemia_mission_pack_CRITERIA_DESCRIPTION:0 "ボヘミアとして帝国支配・文化的繁栄・南方征服を実現し、ボヘミア・コモンウェルスを建国せよ。"
 boh_crown_of_bohemia_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してボヘミア・コモンウェルスを建国せよ。"
 boh_crown_of_bohemia_mission_pack_BUTTON_DETAILS:0 "盲目王の意志を継ぎ、黄金のプラハから中欧帝国へ！"

 boh_crown_of_jan: "盲目王の王冠"
 boh_crown_of_jan_desc: "1337年——ヤン1世（盲目王）はボヘミア王として中欧に君臨する。「見えないが、それでも戦う」という盲目王の精神がボヘミアの誇りだ。1346年のクレシーの戦いで壮烈な戦死を遂げる前に、彼はルクセンブルク家をヨーロッパ最強の家門の一つへと押し上げた。プラハを王都として確立し、王国の基盤を固めよ。"

 boh_lion_of_empire: "帝国の獅子"
 boh_lion_of_empire_desc: "ボヘミア王は神聖ローマ帝国最有力の選帝侯だ。帝国内のいかなる諸侯も、ボヘミアの剣の前には頭を垂れるべき存在だ。強力な軍と威信でもって「帝国の獅子」としての地位を確立せよ。"

 boh_challenge_habsburg: "ハプスブルクへの挑戦"
 boh_challenge_habsburg_desc: "ハプスブルク家はルクセンブルク家——ボヘミア王家——の最大の競合相手だ。オーストリアを拠点に帝国支配を目論む彼らに対して、ボヘミアは明確に対抗姿勢を示さなければならない。"


 boh_saxony_ambitions: "ザクセンへの野望"
 boh_saxony_ambitions_desc: "ドレスデンを擁するザクセンはエルベ川流域の重要な交易・文化の中心地だ。ザクセン選帝侯の地位を手中に収め、帝国内の影響力をさらに拡大せよ。"

 boh_conquer_austria: "オーストリア征服"
 boh_conquer_austria_desc: "ウィーンを陥落させ、ハプスブルクの本拠地オーストリアを制圧した。「太陽の沈まないハプスブルク」の傲慢がついに粉砕される。ボヘミアこそ中欧の真の覇者だ。"

 boh_dominate_hre: "神聖ローマ帝国の支配"
 boh_dominate_hre_desc: "ボヘミアが神聖ローマ帝国を支配する。カール4世が1355年に実現した皇帝位を超え、ボヘミアは帝国全体の盟主として君臨する。"

 boh_develop_prague: "プラハの整備"
 boh_develop_prague_desc: "「百塔の都市」プラハ——ヴルタヴァ川の両岸に広がるこの都市は、中欧最大の都市として14世紀に黄金時代を迎えた。プラハ城・カレル橋・旧市街広場がボヘミア王国の威光を世界に示す。"

 boh_charles_university: "カレル大学の創設"
 boh_charles_university_desc: "1348年、カレル4世がプラハに創設したカレル大学は、中欧最初の大学だ。神学・法学・医学・哲学を教えるこの学府から、ヤン・フスのような偉大な改革者が生まれた。1348年以降、プラハに大学を建設することでこの歴史的偉業を達成できる。"

 boh_golden_bull: "黄金勅書"
 boh_golden_bull_desc: "1356年、カレル4世が発布した「黄金勅書」は神聖ローマ帝国の選帝侯制度を明文化し、ボヘミア王を帝国最重要の選帝侯として確立した。ボヘミアの法的・政治的地位を不動のものとせよ。"

 boh_bohemian_glass: "ボヘミアングラス"
 boh_bohemian_glass_desc: "ボヘミアの透き通った水と豊富な石英砂から生まれたボヘミアングラス——その精巧な美しさはヨーロッパ中の宮廷で珍重される。「ボヘミアクリスタル」の名がヨーロッパ最高品質の代名詞となるよう、工業を発展させよ。"

 boh_silver_mines: "クトナー・ホラ銀山"
 boh_silver_mines_desc: "クトナー・ホラの銀山は14世紀のヨーロッパで最も豊富な銀の産出地だった。この銀がプラハ・グロシェン（ボヘミアの銀貨）として中欧全土に流通し、ボヘミア経済の黄金時代を支えた。"

 boh_develop_moravia: "モラヴィアの整備"
 boh_develop_moravia_desc: "ブルノとオロモウツを中心とするモラヴィアは、ボヘミア王冠領の重要な一角だ。ヴィシェフラトからモラヴィア門まで、この豊かな農業地帯をボヘミア帝国の行政・文化の第二の中心地として整備せよ。"

 boh_internal_prosperity: "国内の繁栄"
 boh_internal_prosperity_desc: "ボヘミアングラス・クトナー・ホラの銀・プラハの交易市場——これらが組み合わさることで、ボヘミアは中欧最大の経済国家となった。"

 boh_jan_hus_question: "ヤン・フスの問い"

 boh_suppress_heresy: "異端の鎮圧"
 boh_suppress_heresy_desc: "ボヘミアはローマ教会への忠誠を守り続ける。フス派を異端として弾圧し、カトリック信仰を国家の礎として確立することで、教皇との強固な同盟関係が築かれる。"

 boh_crusade_against_hussites: "フス派への十字軍"
 boh_crusade_against_hussites_desc: "ローマ教皇がフス派征討のための十字軍を布告した。ボヘミアがその先鋒として異端を剣で討伐することで、中欧カトリック世界の守護者としての名声を確立する。"

 boh_papal_champion: "教皇の盾"
 boh_papal_champion_desc: "教皇との深い信頼とカトリック信仰の堅持——ボヘミアは中欧カトリック世界の最強の守護者として認められた。"

 boh_hussite_reformation: "フス派の改革"
 boh_hussite_reformation_desc: "「燃やされても炎の中から真実は輝く」——ヤン・フスの精神がボヘミアに根付いた。カリッハ（聖杯）を象徴とするウトラキスト（フス派）が国民の信仰となり、ローマからの宗教的自立が実現する。"

 boh_wagenburg: "ボジー・ボヨヴニツィ（神の戦士）"
 boh_wagenburg_desc: "ヤン・ジシュカが考案したワゴンブルク（荷馬車陣）戦術——要塞化した荷馬車を連結して防御陣を構築するこの革命的な戦術が、十字軍の重装騎兵を幾度も打ち破った。ボヘミア軍の軍事的天才が花開く。"

 boh_king_of_heretics: "異端の王"
 boh_king_of_heretics_desc: "ポジェブラト家のイジーは教皇から破門されながらも「ボヘミアの異端の王」として君臨した。欧州の外交的孤立の中でも威信を保ち、フス派国家の正当性を世界に示せ。"

 boh_hungarian_succession: "ハンガリー継承"
 boh_hungarian_succession_desc: "ボヘミアとハンガリーはルクセンブルク家・ヤギェウォ家を通じて幾度も同君連合を形成してきた。ブダを中心とするドナウ川流域の豊かな王国をボヘミアの傘下に置き、中欧支配を盤石にせよ。"

 boh_control_slovakia: "スロヴァキアの掌握"
 boh_control_slovakia_desc: "スロヴァキアは大モラヴィア帝国の故地であり、チェコ・スロヴァキアの兄弟民族が暮らす地だ。この地を確保することでボヘミアのスラヴ的基盤が強化される。"

 boh_conquer_transylvania: "トランシルヴァニアの征服"
 boh_conquer_transylvania_desc: "「彼方の森の地」トランシルヴァニア——ルーマニア人・ハンガリー人・ドイツ人が混在するこの地は、オスマン帝国に対するキリスト教世界の前哨基地だ。ここを制することでバルカン進出への道が開ける。"

 boh_nicopolis_revenge: "ニコポリスの雪辱"
 boh_nicopolis_revenge_desc: "1396年のニコポリスの戦いでボヘミア・ジギスムント王率いる十字軍がオスマン帝国に大敗した。その屈辱を百年後に晴らす時が来た。ニコポリスを奪還し、オスマン帝国をバルカンから追い出せ。"

 boh_defend_against_turks: "トルコへの防壁"
 boh_defend_against_turks_desc: "オスマン帝国がバルカンを席巻し、中欧の扉に迫っている。トランシルヴァニアの要塞を強化し、強力な陸軍でキリスト教世界の盾となれ。ボヘミアは「キリスト教ヨーロッパの盾（アンテムラーレ・キリスティアニタティス）」だ。"

 boh_push_into_balkans: "バルカンへの進出"
 boh_push_into_balkans_desc: "ニコポリスの雪辱を果たし、キリスト教世界の解放者として南方に進出せよ。バルカン半島のスラヴ人・ギリシャ人・ブルガリア人がボヘミアの旗の下に解放される。"

 boh_secure_silesia: "シレジアの完全掌握"
 boh_secure_silesia_desc: "シレジア全域がボヘミアの直接支配下に入った。鉄と石炭に恵まれたこの地が、ボヘミア工業帝国の中核となる。"

 boh_polish_ambitions: "ポーランドへの野望"
 boh_polish_ambitions_desc: "クラクフを掌握し、ポーランド王国との関係を確立する。プシェミスル朝の遺産はボヘミアにあり——ポーランドはボヘミアの傘下に入るべき隣国だ。"

 boh_conquer_poland: "ポーランドの制圧"
 boh_conquer_poland_desc: "ポーランド地方の広大な平原がボヘミアの管制下に入った。ヴィスワ川からオーデル川まで、スラヴ人の大地がボヘミア王の旗の下に統一される。"

 boh_baltic_access: "バルト海へのアクセス"
 boh_baltic_access_desc: "グダニスクを掌握したボヘミアがバルト海に直接アクセスできるようになった。内陸国家から変貌した海洋国家として、ボヘミアは北方交易にも参加する。"

 boh_bohemian_diet: "ボヘミア議会"
 boh_bohemian_diet_desc: "ボヘミアの身分制議会（ゼムスキー・スネム）は貴族・聖職者・市民が参加する政治機構だ。これを強化することで、中央集権的な帝国統治の基盤が整う。"

 boh_absolute_monarchy: "絶対王政"
 boh_absolute_monarchy_desc: "ボヘミアに絶対王政が確立した。貴族の特権を制限し、王権を完全に確立することで、ボヘミアは近代的な中央集権国家へと変貌する。"

 boh_great_power_army: "大国の軍隊"
 boh_great_power_army_desc: "ワゴンブルク戦術・黒軍・精鋭步兵——ボヘミアの軍事革新が中欧最強の軍隊を生み出した。高い軍事伝統と大規模な陸軍でボヘミアの軍事的覇権を確立せよ。"

 boh_dev_brno: "ブルノの整備"
 boh_dev_brno_desc: "モラヴィアの首府ブルノは、交易路の交差点として繁栄する工業・商業都市だ。"

 boh_dev_wroclaw: "ヴロツワフの整備"
 boh_dev_wroclaw_desc: "オーデル川沿いのヴロツワフはシレジアの心臓部だ。その多文化的な商業の伝統がボヘミア帝国の富を拡大する。"

 boh_amber_road: "琥珀街道"
 boh_amber_road_desc: "バルト海から地中海まで続く古代の琥珀街道がボヘミアを横断している。この交易路を支配することでボヘミアは南北交易の中心地となる。"

 boh_dev_pest: "ペストの整備"
 boh_dev_pest_desc: "ドナウ川を挟んでブダと向き合うペストは、ハンガリー王国最大の商業都市だ。ボヘミア帝国南部の経済中心地として整備せよ。"

 boh_renaissance_court: "ルネサンスの宮廷"
 boh_renaissance_court_desc: "カレル4世のプラハはイタリア・フランス・神聖ローマ帝国の文化が融合する、中欧ルネサンスの中心地だった。芸術家・学者・建築家がプラハの宮廷に集まり、文化的黄金時代が花開く。"

 boh_great_moravia_restored: "大モラヴィアの復興"
 boh_great_moravia_restored_desc: "9世紀のモラヴィア大国帝国以来、初めてボヘミア・モラヴィア・シレジア全域が統一された。スヴァトプルクとロスチスラフの夢が現代に甦り、スラヴ文明の中心としてボヘミアが輝く。"

 boh_central_european_power: "中欧の大国"
 boh_central_european_power_desc: "大モラヴィア復興・国内繁栄・絶対王政の三本柱が揃い、ボヘミアは中欧最大の大国として君臨する。500ロケーション・月収500・威信80でその栄光を掴め。"

 boh_bohemian_commonwealth: "ボヘミア・コモンウェルス"
 boh_bohemian_commonwealth_desc: "プラハ・ウィーン・ベルリン・クラクフ・ブダ——中欧の五大都市を支配するボヘミア・コモンウェルスが完成した。盲目王ヤンが1337年に種を蒔いた王冠が、今や帝国の冠へと輝く。「ボヘミアは不滅なり（Bohemia non perit）」——この言葉が歴史に刻まれる。"

 boh_krecy_legacy: "クレシーの遺産"
 boh_krecy_legacy_desc: "1346年のクレシーの戦いで盲目王ヤン1世は目が見えないにもかかわらず戦場に立ち、英雄的な戦死を遂げた。「見えないが、それでも戦う」——この精神がボヘミアの軍事的魂に刻まれている。"


 boh_styria_carinthia: "シュタイアーマルク・ケルンテン"
 boh_styria_carinthia_desc: "アルプス山麓のシュタイアーマルクとケルンテンを制圧することで、ボヘミア帝国の南方国境が確立された。鉱山と農業が豊かなこれらの地が帝国の繁栄を支える。"

 boh_kutna_hora_mint: "クトナー・ホラの造幣局"
 boh_kutna_hora_mint_desc: "プラハ・グロシェン——クトナー・ホラで鋳造されるこの銀貨は14世紀の中欧で最も信頼される通貨だ。大規模な銀採掘でボヘミアの通貨覇権を確立せよ。"

 boh_gothic_architecture: "ゴシック建築の都"
 boh_gothic_architecture_desc: "聖ヴィート大聖堂・カレル橋・プラハ旧市街広場——カレル4世が建設した壮麗なゴシック建築がプラハを「黄金の都市」へと変えた。プラハの発展度を高め、この建築的栄光を先取りせよ。"

 boh_bohemian_trade_network: "ボヘミア交易ネットワーク"
 boh_bohemian_trade_network_desc: "プラハを中心に、ウィーン・ブレスラウ・クラクフ・ニュルンベルクを結ぶ交易ネットワークがボヘミアの繁栄を支えている。"

 boh_compactata: "プラハ合約"
 boh_compactata_desc: "1436年のプラハ合約でフス派はカトリック教会から「コンパクタータ（合意）」として聖杯での聖体拝領を認められた。穏健なウトラキスト路線がボヘミアの宗教的安定をもたらす。"

 boh_utraquist_church: "ウトラキスト教会"
 boh_utraquist_church_desc: "「両形式による聖体拝領（Sub utraque specie）」——パンと葡萄酒の両方を信徒に与えるウトラキスト教会がボヘミアの国教として確立された。"

 boh_protestant_alliance: "プロテスタント同盟"
 boh_protestant_alliance_desc: "フス派の伝統がプロテスタント改革の先駆けとなった。ルター派・カルヴァン派との同盟でボヘミアはプロテスタント世界の重鎮として認められる。"

 boh_black_army: "黒軍"
 boh_black_army_desc: "マーチャーシュ（マティアス・コルヴィヌス）王が組織した職業傭兵軍「黒軍」——中世ヨーロッパ最初の常備軍の一つとして歴史に名を残す。この精鋭部隊をボヘミアが指揮するとき、中欧に敵なし。"


 boh_dev_berlin: "ベルリンの整備"
 boh_dev_berlin_desc: "ブランデンブルクの小さな町ベルリンがボヘミア帝国の北方行政拠点として整備される。"

 boh_dev_konigsberg: "ケーニヒスベルクの整備"
 boh_dev_konigsberg_desc: "オタカル2世によって建設されたケーニヒスベルク（王の城）が、バルト海交易の拠点としてボヘミア帝国に復帰する。"

 boh_great_king: "偉大な王"
 boh_great_king_desc: "高い威信・正統性・豊かな収入——ボヘミア王は中欧史上最も偉大な君主の一人として後世に名を残す。カレル4世の栄光を超えるその名がヨーロッパ全土に轟く。"


 boh_dev_olomouc: "オロモウツの隆盛"
 boh_dev_olomouc_desc: "モラヴィアの古都オロモウツには歴史ある大学と大司教座が置かれ、北方ルネサンスの中心地として輝く。"

 boh_upper_austria: "上オーストリアの制圧"
 boh_upper_austria_desc: "ドナウ川上流の上オーストリアを制圧し、南方へのさらなる進出の足がかりとする。"

 boh_carpathian_defense: "カルパティアの防衛"
 boh_carpathian_defense_desc: "カルパティア山脈に沿って要塞を建設し、東方からの侵略に対する堅固な防衛線を確立する。オスマン帝国・タタール人・その他の脅威からボヘミア帝国を守れ。"

 boh_events.20.t: "ハプスブルクの打倒——ボヘミアの覇権"
 boh_events.20.d: "ウィーンが陥落し、ハプスブルクの誇りが打ち砕かれた。「ルドルフ以来続いてきたハプスブルクの中欧支配が終わった」——プラハの宮廷でそう叫ぶ声が響く。ボヘミア王は今や中欧の真の覇者だ。歴史家たちは後にこう記すだろう——「ルクセンブルク家こそ帝国の真の後継者だった」と。"
 boh_events.20.a: "ボヘミアよ永遠なれ！ハプスブルクの時代は終わった！"


 boh_events.50.t: "大モラヴィアの復興"
 boh_events.50.d: "ボヘミア・モラヴィア・シレジアが統一された。スヴァトプルク大王が建設した大モラヴィア帝国が滅亡して400年——今こそその遺産が現代に甦る。プラハの宮廷でボヘミア王は「スラヴ人の王（Rex Slavorum）」の称号を宣言する。"
 boh_events.50.a: "大モラヴィアよ、永遠に！スラヴ人の統一万歳！"

 boh_events.99.t: "ボヘミア・コモンウェルスの誕生"
 boh_events.99.d: "プラハ・ウィーン・ベルリン・クラクフ・ブダ——中欧の五大都市がボヘミアの旗の下に統一された。1337年にヤン盲目王が種を蒔いた王冠が、今や中欧帝国の冠へと輝く。ゴシック大聖堂の尖塔がプラハの空に高くそびえるとき、「ボヘミアは不滅なり（Bohemia non perit）」という言葉が歴史に刻まれる。"
 boh_events.99.a: "ボヘミア・コモンウェルス万歳！中欧の覇者よ永遠に！"
 STATIC_MODIFIER_NAME_boh_blind_king_mod: "盲目王の遺産"
 STATIC_MODIFIER_DESC_boh_blind_king_mod: "「見えないが、それでも戦う」——盲目王ヤン1世の精神がボヘミア王国の礎を築いた。"

 STATIC_MODIFIER_NAME_boh_imperial_power_mod: "帝国の獅子"
 STATIC_MODIFIER_DESC_boh_imperial_power_mod: "ボヘミアが帝国最強の選帝侯として名乗りを上げた。"
 STATIC_MODIFIER_NAME_boh_habsburg_rival_mod: "ハプスブルクへの挑戦"
 STATIC_MODIFIER_DESC_boh_habsburg_rival_mod: "ルクセンブルク家とハプスブルク家の帝国支配をめぐる対立が激化した。"
 STATIC_MODIFIER_NAME_boh_silesia_mod: "シレジアの鉄"
 STATIC_MODIFIER_DESC_boh_silesia_mod: "シレジアの豊富な鉄鉱石がボヘミア軍需産業の基盤を支える。"
 STATIC_MODIFIER_NAME_boh_hre_master_mod: "神聖ローマ帝国の支配"
 STATIC_MODIFIER_DESC_boh_hre_master_mod: "ボヘミアは神聖ローマ帝国の疑いなき盟主として君臨し、プラハへ書簡を送る諸侯は誰もが頭を垂れている。"
 STATIC_MODIFIER_NAME_boh_prague_capital_mod: "百塔の都プラハ"
 STATIC_MODIFIER_DESC_boh_prague_capital_mod: "ヴルタヴァ川沿いのプラハが中欧最大の都市として整備された。"
 STATIC_MODIFIER_NAME_boh_charles_university_mod: "カレル大学"
 STATIC_MODIFIER_DESC_boh_charles_university_mod: "中欧最初の大学がプラハに開設された。学問と改革の中心地として輝く。"
 STATIC_MODIFIER_NAME_boh_golden_bull_mod: "黄金勅書"
 STATIC_MODIFIER_DESC_boh_golden_bull_mod: "ボヘミア王の選帝侯としての地位が黄金勅書によって確立された。"
 STATIC_MODIFIER_NAME_boh_glass_industry_mod: "ボヘミアングラス"
 STATIC_MODIFIER_DESC_boh_glass_industry_mod: "ボヘミアクリスタルがヨーロッパ最高品質の工芸品として名声を確立した。"
 STATIC_MODIFIER_NAME_boh_kutna_hora_mod: "クトナー・ホラの銀"
 STATIC_MODIFIER_DESC_boh_kutna_hora_mod: "中欧最大の銀山がボヘミア経済の黄金時代を支える。プラハ・グロシェンが流通する。"
 STATIC_MODIFIER_NAME_boh_moravia_mod: "モラヴィアの統合"
 STATIC_MODIFIER_DESC_boh_moravia_mod: "ブルノとオロモウツを中心とするモラヴィアがボヘミア帝国に統合された。"
 STATIC_MODIFIER_NAME_boh_prosperity_mod: "国内の繁栄"
 STATIC_MODIFIER_DESC_boh_prosperity_mod: "ボヘミアングラス・銀・交易市場が組み合わさり、中欧最大の経済国家が誕生した。"
 STATIC_MODIFIER_NAME_boh_catholic_reform_mod: "カトリック信仰の堅持"
 STATIC_MODIFIER_DESC_boh_catholic_reform_mod: "ローマ教会への忠誠を守るボヘミアが北欧カトリック世界の守護者として認められた。"
 STATIC_MODIFIER_NAME_boh_crusader_glory_mod: "十字軍の栄光"
 STATIC_MODIFIER_DESC_boh_crusader_glory_mod: "フス派征討十字軍の先鋒として、ボヘミアがキリスト教世界の守護者の名声を得た。"
 STATIC_MODIFIER_NAME_boh_papal_ally_mod: "教皇の盾"
 STATIC_MODIFIER_DESC_boh_papal_ally_mod: "教皇との深い信頼関係でボヘミアが中欧カトリック世界の盟主となった。"
 STATIC_MODIFIER_NAME_boh_hussite_church_mod: "フス派教会"
 STATIC_MODIFIER_DESC_boh_hussite_church_mod: "ヤン・フスの精神がボヘミアに根付き、独自の宗教改革路線が確立された。"
 STATIC_MODIFIER_NAME_boh_wagenburg_mod: "ワゴンブルク戦術"
 STATIC_MODIFIER_DESC_boh_wagenburg_mod: "ヤン・ジシュカの革命的戦術がボヘミア軍に宿った。荷馬車要塞が十字軍騎兵を粉砕する。"
 STATIC_MODIFIER_NAME_boh_king_heretic_mod: "異端の王の威光"
 STATIC_MODIFIER_DESC_boh_king_heretic_mod: "教皇から破門されながらも威信を保つボヘミア王が外交的孤立を跳ね返した。"
 STATIC_MODIFIER_NAME_boh_slovakia_mod: "スロヴァキアの統合"
 STATIC_MODIFIER_DESC_boh_slovakia_mod: "大モラヴィア帝国の故地スロヴァキアの丘陵に、ボヘミアの獅子の旗が翻っている。"
 STATIC_MODIFIER_NAME_boh_transylvania_mod: "トランシルヴァニア"
 STATIC_MODIFIER_DESC_boh_transylvania_mod: "彼方の森の地がボヘミアの支配下に入り、バルカン進出への足がかりが確立された。"
 STATIC_MODIFIER_NAME_boh_nicopolis_glory_mod: "ニコポリスの雪辱"
 STATIC_MODIFIER_DESC_boh_nicopolis_glory_mod: "1396年の屈辱が晴れた。ボヘミアがオスマン帝国に対する反撃の旗手となる。"
 STATIC_MODIFIER_NAME_boh_antemurale_mod: "キリスト教の盾"
 STATIC_MODIFIER_DESC_boh_antemurale_mod: "トランシルヴァニアの要塞がオスマン帝国の進撃を食い止める盾となった。"
 STATIC_MODIFIER_NAME_boh_balkan_conqueror_mod: "バルカンの解放者"
 STATIC_MODIFIER_DESC_boh_balkan_conqueror_mod: "ボヘミアがバルカン半島のスラヴ人・キリスト教徒を解放する旗手として南方に進出した。"
 STATIC_MODIFIER_NAME_boh_silesia_secured_mod: "シレジア完全統合"
 STATIC_MODIFIER_DESC_boh_silesia_secured_mod: "シレジア全域がボヘミアの直接統治下に入り、鉄と石炭の産業基盤が確立された。"
 STATIC_MODIFIER_NAME_boh_poland_subjugated_mod: "ポーランドの制圧"
 STATIC_MODIFIER_DESC_boh_poland_subjugated_mod: "ポーランド平原がボヘミアの管制下に入り、東方への拡大基盤が確立された。"
 STATIC_MODIFIER_NAME_boh_baltic_access_mod: "バルト海アクセス"
 STATIC_MODIFIER_DESC_boh_baltic_access_mod: "グダニスク掌握でボヘミアがバルト海交易に直接参加できるようになった。"
 STATIC_MODIFIER_NAME_boh_diet_mod: "ボヘミア議会"
 STATIC_MODIFIER_DESC_boh_diet_mod: "ゼムスキー・スネム（領邦議会）の議場で、諸身分の代表が皇帝の政策に耳を傾けるようになった。"
 STATIC_MODIFIER_NAME_boh_absolutism_mod: "絶対王政"
 STATIC_MODIFIER_DESC_boh_absolutism_mod: "ボヘミアに絶対王政が確立し、近代的な中央集権国家へと変貌した。"
 STATIC_MODIFIER_NAME_boh_military_power_mod: "大国の軍隊"
 STATIC_MODIFIER_DESC_boh_military_power_mod: "ワゴンブルク・黒軍の伝統を継ぐボヘミア精鋭軍が中欧最強の軍事力を誇る。"
 STATIC_MODIFIER_NAME_boh_brno_mod: "ブルノの繁栄"
 STATIC_MODIFIER_DESC_boh_brno_mod: "モラヴィアの首府ブルノが交易と工業の中心地として発展した。"
 STATIC_MODIFIER_NAME_boh_wroclaw_mod: "ヴロツワフの繁栄"
 STATIC_MODIFIER_DESC_boh_wroclaw_mod: "オーデル川沿いのヴロツワフがシレジア経済の心臓部として機能する。"
 STATIC_MODIFIER_NAME_boh_amber_road_mod: "琥珀街道"
 STATIC_MODIFIER_DESC_boh_amber_road_mod: "バルト海から地中海まで続く琥珀街道をボヘミアが支配し、南北交易の要衝となった。"
 STATIC_MODIFIER_NAME_boh_pest_mod: "ペストの繁栄"
 STATIC_MODIFIER_DESC_boh_pest_mod: "ドナウ川沿いのペストがボヘミア帝国南部の商業中心地として整備された。"
 STATIC_MODIFIER_NAME_boh_renaissance_mod: "ルネサンスの宮廷"
 STATIC_MODIFIER_DESC_boh_renaissance_mod: "プラハがイタリア・フランス・中欧の文化が融合する中欧ルネサンスの中心地となった。"
 STATIC_MODIFIER_NAME_boh_great_moravia_mod: "大モラヴィアの復興"
 STATIC_MODIFIER_DESC_boh_great_moravia_mod: "スヴァトプルク以来初めて、ボヘミア・モラヴィア・シレジアが統一された。スラヴ文明の中心が甦る。"
 STATIC_MODIFIER_NAME_boh_central_power_mod: "中欧の大国"
 STATIC_MODIFIER_DESC_boh_central_power_mod: "ボヘミアが中欧最大の大国として君臨し、帝国・文化・軍事の全方面で覇権を確立した。"
 STATIC_MODIFIER_NAME_boh_krecy_glory_mod: "クレシーの遺産"
 STATIC_MODIFIER_DESC_boh_krecy_glory_mod: "盲目王が見せた英雄的な戦死の精神がボヘミア軍の誇りとして受け継がれた。"
 STATIC_MODIFIER_NAME_boh_alpine_lands_mod: "アルプスの領土"
 STATIC_MODIFIER_DESC_boh_alpine_lands_mod: "シュタイアーマルクとケルンテンの峠道には、ボヘミアの旗を掲げた守備隊が詰めている。"
 STATIC_MODIFIER_NAME_boh_silver_currency_mod: "プラハ・グロシェン"
 STATIC_MODIFIER_DESC_boh_silver_currency_mod: "クトナー・ホラの銀から鋳造されるプラハ・グロシェンが中欧最大の国際通貨となった。"
 STATIC_MODIFIER_NAME_boh_golden_prague_mod: "黄金のプラハ"
 STATIC_MODIFIER_DESC_boh_golden_prague_mod: "聖ヴィート大聖堂・カレル橋・百塔——プラハが「黄金の都市」として中欧最大の文化的中心地となった。"
 STATIC_MODIFIER_NAME_boh_trade_network_mod: "ボヘミア交易ネットワーク"
 STATIC_MODIFIER_DESC_boh_trade_network_mod: "プラハを中心とする中欧交易網がボヘミアの商業覇権を支える。"
 STATIC_MODIFIER_NAME_boh_compactata_mod: "プラハ合約"
 STATIC_MODIFIER_DESC_boh_compactata_mod: "カトリックとウトラキストの和解が成立し、ボヘミアに宗教的安定がもたらされた。"
 STATIC_MODIFIER_NAME_boh_utraquist_mod: "ウトラキスト教会"
 STATIC_MODIFIER_DESC_boh_utraquist_mod: "両形式聖体拝領のウトラキスト教会がボヘミアの国教として確立された。"
 STATIC_MODIFIER_NAME_boh_protestant_alliance_mod: "プロテスタント同盟"
 STATIC_MODIFIER_DESC_boh_protestant_alliance_mod: "フス派の伝統を継ぐボヘミアがプロテスタント世界の重鎮として認められた。"
 STATIC_MODIFIER_NAME_boh_black_army_mod: "黒軍"
 STATIC_MODIFIER_DESC_boh_black_army_mod: "マーチャーシュ王の黒軍の精神がボヘミアに宿った。中欧最強の職業軍が完成した。"
 STATIC_MODIFIER_NAME_boh_berlin_mod: "ベルリンの整備"
 STATIC_MODIFIER_DESC_boh_berlin_mod: "北方の小都市ベルリンがボヘミア帝国の北方行政拠点として成長した。"
 STATIC_MODIFIER_NAME_boh_konigsberg_mod: "ケーニヒスベルクの復帰"
 STATIC_MODIFIER_DESC_boh_konigsberg_mod: "オタカル2世が建設したケーニヒスベルクがボヘミアに復帰し、バルト海交易の拠点となった。"
 STATIC_MODIFIER_NAME_boh_great_king_mod: "偉大な王"
 STATIC_MODIFIER_DESC_boh_great_king_mod: "カレル4世をも超える偉大な君主としてボヘミア王がヨーロッパ史に名を刻む。"
 STATIC_MODIFIER_NAME_boh_fortress_europe_mod: "ヨーロッパの要塞"
 STATIC_MODIFIER_DESC_boh_fortress_europe_mod: "アルプスからカルパティアまで続く要塞網がオスマン帝国の進撃を食い止める。"
 STATIC_MODIFIER_NAME_boh_olomouc_mod: "オロモウツの隆盛"
 STATIC_MODIFIER_DESC_boh_olomouc_mod: "モラヴィアの学術・宗教の中心地オロモウツが北方ルネサンスの拠点として輝く。"
 STATIC_MODIFIER_NAME_boh_upper_austria_mod: "上オーストリアの制圧"
 STATIC_MODIFIER_DESC_boh_upper_austria_mod: "ドナウ川上流の上オーストリアの城壁にボヘミア帝国の旗が翻り、南へ向かう街道が開かれた。"
 STATIC_MODIFIER_NAME_boh_carpathian_mod: "カルパティアの防衛"
 STATIC_MODIFIER_DESC_boh_carpathian_mod: "カルパティア山脈に沿った要塞網がボヘミア帝国の東方国境を守る盾となった。"
 STATIC_MODIFIER_NAME_boh_bohemian_commonwealth_final_mod: "ボヘミア・コモンウェルスの栄光"
 STATIC_MODIFIER_DESC_boh_bohemian_commonwealth_final_mod: "中欧の五大都市を支配するボヘミア・コモンウェルスが完成した。「ボヘミアは不滅なり」——その名が歴史に永遠に刻まれる。"
 STATIC_MODIFIER_NAME_boh_habsburg_crushed_mod: "ハプスブルクの打倒"
 STATIC_MODIFIER_DESC_boh_habsburg_crushed_mod: "ウィーンが陥落し、ハプスブルクの中欧支配が終焉を迎えた。ボヘミアが真の覇者として立つ。"

 boh_fortress_of_europe: "ヨーロッパの要塞"
 boh_fortress_of_europe_desc: "オスマン帝国の猛攻を食い止めるアルプスからカルパティア山脈まで続く要塞網——ボヘミアが「ヨーロッパの盾」として機能する。"

 boh_dev_plzen: "プルゼニの整備"
 boh_dev_plzen_desc: "プルゼニ——ボヘミア西部の要衝にして、のちに世界に名を轟かせるピルスナービールの故郷だ。エーゲル川とムルゼ川の合流点に位置するこの都市を整備することで、ボヘミア西部の商業と工業が発展する。"
 boh_dev_cheb: "チェブの整備"
 boh_dev_cheb_desc: "オフジェ川沿いの古都チェブはドイツとボヘミアの文化が交差する帝国の玄関口だ。神聖ローマ帝国との交易路を押さえるこの都市を整備し、西方外交の橋頭堡とせよ。"
 boh_dev_kutna_hora_city: "クトナー・ホラ市街の整備"
 boh_dev_kutna_hora_city_desc: "銀山の富で輝くクトナー・ホラは、プラハに次ぐボヘミア第二の都市として発展した。聖バルバラ大聖堂の建設が進むこの街を大都市として整備し、ボヘミアの経済的心臓部として確立せよ。"
 boh_bohemian_agriculture: "ボヘミアの農業"
 boh_bohemian_agriculture_desc: "エルベ川流域のボヘミア低地は豊かな農業地帯だ。小麦・大麦・ライ麦が豊かに実り、農場整備によって生産性が大きく向上する。食料の安定供給がボヘミア帝国の人口増加を支える。"
 boh_moravian_wine: "モラヴィアのワイン"
 boh_moravian_wine_desc: "ズノイモ周辺のモラヴィア南部はボヘミア最大のブドウ栽培地帯だ。温暖な気候と石灰岩質の土壌が育むモラヴィアワインはオーストリア・ウィーンの宮廷でも珍重される。その芳醇な味わいがボヘミア帝国の文化的洗練を象徴する。"
 boh_jihlava_silver: "ジフラヴァの銀山"
 boh_jihlava_silver_desc: "ボヘミア・モラヴィア高地に位置するジフラヴァは、クトナー・ホラと並ぶボヘミアの銀山都市だ。この銀鉱山を本格稼働させることでボヘミアの銀生産量がさらに拡大し、プラハ・グロシェンの鋳造量が増える。"
 boh_opava_iron: "オパヴァの鉄鋼"
 boh_opava_iron_desc: "シレジア公国の首都オパヴァは鉄鉱石の産地として知られる。この都市の鉄鋼産業を整備することでシレジアの工業基盤がさらに強化され、ボヘミア軍の装備が大幅に向上する。"
 boh_dev_litomerice: "リトムニェジツェの整備"
 boh_dev_litomerice_desc: "エルベ川沿いのリトムニェジツェはボヘミア北部の重要な交易都市だ。エルベ川を通じてハンブルクまで続く交易路の要衝として整備することで、北ドイツとの交易が活発化する。"
 boh_silesian_mines: "シレジアの鉱山"
 boh_silesian_mines_desc: "鉄とコークス炭が豊富に埋蔵されるシレジアの地下には、後の産業革命を支える資源が眠っている。本格的な採掘体制を整備し、ボヘミア帝国の工業生産力を飛躍的に高めよ。"
 boh_silesian_mines_unlock_tt: "決断「シレジアの鉱山の開発」が解放された。"
 boh_silesian_mining_decision.title: "シレジアの鉱山の開発"
 boh_silesian_mining_decision.desc: "シレジアの鉱山地帯は広大で、王権がそのすべてを一度に開発することはできない。坑道・精錬所・道路への投資のたびに、また一つの鉱区が本格稼働に入る。この事業は十年ごとに繰り返すことができる。"
 boh_silesian_mining_decision.a: "新たな鉱区に投資する。"
 boh_bohemian_cloth: "ボヘミア織物業"
 boh_bohemian_cloth_desc: "ボヘミアングラスと並んで、ボヘミアの織物・布地産業がヨーロッパで名声を確立しつつある。北ボヘミアの布地とリトムニェジツェの交易路が組み合わさることで、ボヘミアは繊維産業の中心地となる。"
 STATIC_MODIFIER_NAME_boh_plzen_mod: "プルゼニの発展"
 STATIC_MODIFIER_DESC_boh_plzen_mod: "ボヘミア西部の要衝プルゼニが商業・工業都市として整備された。"
 STATIC_MODIFIER_NAME_boh_cheb_mod: "チェブの整備"
 STATIC_MODIFIER_DESC_boh_cheb_mod: "西方への玄関口チェブが帝国との交易拠点として機能する。"
 STATIC_MODIFIER_NAME_boh_kutna_hora_city_mod: "クトナー・ホラ市街"
 STATIC_MODIFIER_DESC_boh_kutna_hora_city_mod: "銀山の富で輝くボヘミア第二の都市が本格的な大都市として発展した。"
 STATIC_MODIFIER_NAME_boh_agriculture_mod: "ボヘミアの農業"
 STATIC_MODIFIER_DESC_boh_agriculture_mod: "エルベ川流域の豊かな農業地帯が整備され、安定した食料供給が確保された。"
 STATIC_MODIFIER_NAME_boh_znojmo_mod: "ズノイモのブドウ園"
 STATIC_MODIFIER_DESC_boh_znojmo_mod: "モラヴィア南部のブドウ栽培が本格化し、高品質ワインが生産される。"
 STATIC_MODIFIER_NAME_boh_moravian_wine_mod: "モラヴィアワイン"
 STATIC_MODIFIER_DESC_boh_moravian_wine_mod: "モラヴィアワインがオーストリア・ウィーン宮廷でも珍重される高品質産品となった。"
 STATIC_MODIFIER_NAME_boh_jihlava_mod: "ジフラヴァ銀山"
 STATIC_MODIFIER_DESC_boh_jihlava_mod: "ジフラヴァの銀鉱山が本格稼働し、クトナー・ホラと並ぶ銀産地となった。"
 STATIC_MODIFIER_NAME_boh_opava_mod: "オパヴァの鉄鋼"
 STATIC_MODIFIER_DESC_boh_opava_mod: "シレジア公国の首都オパヴァで鉄鋼産業が整備された。"
 STATIC_MODIFIER_NAME_boh_litomerice_mod: "リトムニェジツェの交易"
 STATIC_MODIFIER_DESC_boh_litomerice_mod: "エルベ川沿いのリトムニェジツェが北ドイツへの交易路の要衝として発展した。"
 STATIC_MODIFIER_NAME_boh_silesian_mines_mod: "シレジアの鉱山"
 STATIC_MODIFIER_DESC_boh_silesian_mines_mod: "鉄とコークス炭の豊富なシレジア鉱山が本格稼働し、ボヘミア工業生産力が飛躍的に向上した。"
 STATIC_MODIFIER_NAME_boh_cloth_industry_mod: "ボヘミア織物業"
 STATIC_MODIFIER_DESC_boh_cloth_industry_mod: "ボヘミアの織物・布地産業が確立され、ガラスと並ぶ重要な輸出品となった。"

 boh_sugar_beet: "砂糖大根の栽培"
 boh_sugar_beet_desc: "革命の時代——科学と産業の革新がボヘミアの農業を変える。砂糖大根（テンサイ）はボヘミアの冷涼な気候に最適な作物だ。かつてサトウキビの独占だった砂糖生産が、ボヘミアの農地から生まれる。産業革命がもたらした新農業技術でボヘミアの農業が近代化する。"
 boh_porcelain_industry: "ボヘミア磁器産業"
 boh_porcelain_industry_desc: "革命の時代——西ボヘミアのカオリン（陶土）はヨーロッパ最良の磁器原料だ。カルルスバート（カルロヴィ・ヴァリ）周辺の白い陶土から生まれるボヘミア磁器は、ドレスデンのマイセン磁器に匹敵する精巧さを誇り、ヨーロッパ中の宮廷を飾る。"
 STATIC_MODIFIER_NAME_boh_porcelain_mod: "ボヘミア磁器"
 STATIC_MODIFIER_DESC_boh_porcelain_mod: "西ボヘミアのカオリンから生まれる磁器がヨーロッパ宮廷を飾る高級品となった。"

 boh_jan_hus_question_desc: "ヤン・フスの改革精神がボヘミア全土に広まっている。コンスタンツ公会議での火刑（1415年）の記憶がボヘミア人の心に深く刻まれ、ローマ教会への怒りが爆発寸前だ。信仰の問いが避けられない時、ボヘミアは自らの道を定めなければならない。"
 boh_events.60.t: "砂糖大根の栽培地——新産業の幕開け"
 boh_events.60.d: "1737年——ヨーロッパ各地で砂糖大根（テンサイ）から砂糖を製造する技術が開発された。ボヘミアの肥沃な農地はこの新作物の栽培に理想的だ。ポジェブラディとフラデツ・クラーロヴェーのどちらに最初の砂糖大根農場を建設するか？"
 boh_events.60.a: "ポジェブラディの農地に砂糖大根を植えよ（フス派の王イジーの故郷）"
 boh_events.60.b: "フラデツ・クラーロヴェーの農地に砂糖大根を植えよ（エルベ川沿いの肥沃な土地）"
 STATIC_MODIFIER_NAME_boh_jan_hus_mod: "フスの真理"
 STATIC_MODIFIER_DESC_boh_jan_hus_mod: "ヤン・フスの説教を記した写本が、ボヘミアの農村の家々にも回し読みされている。"
 STATIC_MODIFIER_NAME_boh_sugar_beet_choice_mod: "砂糖大根農場"
 STATIC_MODIFIER_DESC_boh_sugar_beet_choice_mod: "テンサイ栽培が本格化し、ボヘミア産の砂糖がヨーロッパ市場へ輸出される。"

 boh_conquer_silesia: "シレジアの統合"
 boh_conquer_silesia_desc: "シレジアはボヘミア王冠領の一部だ。豊富な鉄鉱石と銀を産出するこの地域を統合することで、ボヘミアの工業・軍事基盤が大幅に強化される。"

 boh_events.50.b: "いや、ボヘミアの伝統的な色を守れ——変える必要はない"


 boh_urban_privileges: "ボヘミアの都市特権"
 boh_urban_privileges_desc: "ブルノ・オロモウツを整備したボヘミアは、各都市に固有の特権を付与する体制を整えた。貴族が支配する封建都市では農民の束縛が強まり、聖職者が管轄する聖界都市では宗教的改宗が促進される。"
 STATIC_MODIFIER_NAME_boh_ecclesiastical_city_rights: "聖界都市"
 STATIC_MODIFIER_DESC_boh_ecclesiastical_city_rights: "司教座聖堂の鐘が一日の刻を告げるこの町では、市の掟も祈りの時刻に合わせて定められている。"

 boh_urban_privileges_unlock_tt: "封建都市（Poddanská nebo vrchnostenská města）と聖界都市（Biskupská nebo klášterní města）の都市特権が使用可能になる。"
