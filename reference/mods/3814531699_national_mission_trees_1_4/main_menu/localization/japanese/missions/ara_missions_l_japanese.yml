l_japanese:
 ara_crown_mission_pack: "アラゴン連合王国の道"
 ara_crown_mission_pack_DESCRIPTION:0 "カタルーニャ、アラゴン、バレンシアの三王冠を擁するアラゴン連合王国は、イベリア半島の統一と地中海の制海権をめぐり、歴史の舞台の中心に立っている。カスティーリャと手を結びスペインを築くか、あるいは単独でナポリを統合しコンスタンティノープルまで進撃するか。道は、王の手中にある。"
 ara_crown_mission_pack_CRITERIA_DESCRIPTION:0 "アラゴン連合王国としてミッションを達成し、イベリア統一と地中海覇権を確立せよ。"
 ara_crown_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してアラゴン連合王国の道を歩め。"
 ara_crown_mission_pack_BUTTON_DETAILS:0 "スペインの礎を築き、西地中海の覇者となり、コンスタンティノープルを手に入れよ！"


 ara_accession_of_pedro_iv: "ペドロ4世の即位"
 ara_accession_of_pedro_iv_desc: "1336年、アルフォンソ4世の崩御により、その子ペドロ4世（ペレ3世セレモニオス）がアラゴン連合王国の王位を継いだ。学識深く、儀礼を重んじるこの若き王は、王権の強化と王国の統一に強い意志を抱いている。新たな治世の幕開けとともに、アラゴンは地中海への野心を再び燃やし始める。"

 ara_kingdom_of_majorca: "マヨルカ王国の統合"
 ara_kingdom_of_majorca_desc: "かつてアラゴン王家の分家が治めたマヨルカ王国は、今もバレアレス諸島に残る独自の政治勢力である。この地を完全に統合し、西地中海における我が国の足場を固めることが、より大きな野望への第一歩となるだろう。"

 ara_reconquest_of_granada: "グラナダの再征服"
 ara_reconquest_of_granada_desc: "イベリア半島にまだ残るイスラム勢力の最後の砦、グラナダ王国。その豊かな土地と美しい宮殿は、長年にわたりキリスト教徒の王たちを悩ませてきた。この地を征服することは、レコンキスタ完遂という、何世紀にもわたる戦いの終わりを意味する。"

 ara_vassalize_navarre: "ナバラ王国の従属"
 ara_vassalize_navarre_desc: "フランスとカスティーリャの狭間に挟まれた小国ナバラは、アラゴンにとって戦略上重要な緩衝地帯である。フランスに取り込まれる前に、この地をアラゴンの影響圏に収めておかねばならない。"

 ara_intervene_in_castile: "カスティーリャへの介入"
 ara_intervene_in_castile_desc: "同じトラスタマラ家の血を引くカスティーリャの宮廷は、長年にわたり派閥争いに揺れてきた。「アラゴンの王子たち（インファンテス・デ・アラゴン）」がかつてカスティーリャへの影響力を争ったように、今こそ我らもこの大国の行く末に介入する時だ。"

 ara_union_of_the_crowns: "両王冠の連合"
 ara_union_of_the_crowns_desc: "アラゴンとカスティーリャ、二つの王冠が一つの王家のもとに結ばれた。これはスペインという新たな王国の夜明けである。フェルナンドとイサベルの時代に刻まれたこの歴史的な連合を、我らの手で現実のものとせよ。"


 ara_catalan_nobility: "カタルーニャ貴族の処遇"
 ara_catalan_nobility_desc: "反乱の後、カタルーニャ貴族の処遇を決めねばならない。彼らの権限を削ぎ王権を強化するか、あるいは改革された秩序の中で共存の道を探るか。この決断がカタルーニャの安定と、王国全体の統治の未来を決める。"

 ara_crowns_of_iberia: "イベリアの諸王冠"
 ara_crowns_of_iberia_desc: "アラゴン、カスティーリャ、ナバラ、グラナダの地——イベリア半島のすべての王冠が今、一つの王家のもとに集まった。ここに、スペイン帝国の礎が築かれた。世界に向けて、新たな帝国の誕生を告げる時が来た。"

 ara_pacify_sardinia: "サルデーニャの平定"
 ara_pacify_sardinia_desc: "アラゴンは長年にわたりサルデーニャ島の支配を主張してきたが、島内の反乱と競合勢力に悩まされ続けてきた。この豊かな地中海の要地を完全に平定することは、さらに東へと進むための不可欠な足掛かりとなる。"

 ara_consulate_of_the_sea: "海の領事館"
 ara_consulate_of_the_sea_desc: "バルセロナとバレンシアを中心に発達したアラゴンの海商法——「海の領事館（コンスラット・デ・マル）」——は、地中海貿易を規律する法典として広く知られている。この制度の威光を活かして、西地中海の交易を我が国の管轄のもとに収めよ。"

 ara_dominate_genoa: "ジェノヴァの支配"
 ara_dominate_genoa_desc: "地中海の海商勢力としてアラゴンと長年競ってきたジェノヴァ。リグリア地方を支配し、ジェノヴァそのものを我が手に収めることができれば、地中海西部の交易は完全に我が国の手中に落ちるだろう。"

 ara_rule_italy: "イタリアの統治"
 ara_rule_italy_desc: "ローマ教皇すらも含むイタリア全土を支配することは、単なる征服を超えた歴史的意義を持つ。古代ローマの遺産が息づくこの地を治めることで、アラゴンはヨーロッパの覇者としての地位を確立するだろう。"

 ara_invade_occitania: "オクシタニア侵攻"
 ara_invade_occitania_desc: "プロヴァンス、ラングドック、ガスコーニュ——フランス南部のこれらの地は、かつてアラゴン王家の影響圏に属していた。フランス王国との北の国境を押し上げることは、イベリア半島の安全保障にとっても欠かせない戦略的課題である。"

 ara_humiliate_provence: "プロヴァンスの凌辱"
 ara_humiliate_provence_desc: "プロヴァンス伯はアラゴンとナポリの両国に対して正統な継承権を主張してきた。この傲慢な要求に終止符を打ち、プロヴァンスを我が国の支配下に置くことで、西地中海における我が国の覇権を磐石のものとする。"

 ara_aragonese_navy: "アラゴンの艦隊"
 ara_aragonese_navy_desc: "アラゴン連合王国の領土は地中海の各所に分散している。その全てを守り、海上の優位を維持するには、強力な艦隊が不可欠である。アラゴン艦隊（アルマダ・デ・アラゴン）を整備し、この内海の制海権を確立せよ。"

 ara_seize_sicily: "シチリアの制圧"
 ara_seize_sicily_desc: "アラゴン艦隊の整備によって、シチリア島への侵攻が現実のものとなった。かつて「シチリアの晩鐘」によってフランス人から解放されたシチリアは、アラゴンこそを自らの守護者と見なしている。パレルモを確保し、この地中海の要衝を永遠にアラゴンのものとせよ。"

 ara_integrate_naples: "ナポリの統合"
 ara_integrate_naples_desc: "アラゴン王アルフォンソ5世が征服したナポリ王国は、今なおアラゴン王家の宝冠の一つである。南イタリアの肥沃な地と港湾都市ナポリを完全に統合することで、我が国は地中海東部への橋頭堡を得る。"

 ara_mediterranean_ambitions: "地中海の野望"
 ara_mediterranean_ambitions_desc: "東地中海にまでその名を轟かせるためには、より大きな艦隊と強固な海軍力が必要である。ガレー船の大艦隊を整備し、地中海全域に我が国の旗をなびかせよ。バルカン半島への足掛かりも、今や我が手の届く距離にある。"

 ara_combat_barbary_piracy: "バルバリア海賊の討伐"
 ara_combat_barbary_piracy_desc: "北アフリカ沿岸を根城とするイスラムの海賊（コルサール）は、アラゴンの商船に絶えない脅威を与えている。彼らの拠点を叩き、無辜のキリスト教徒を奴隷から解放することは、信仰と国益の両方において急務である。"

 ara_conquer_tunis: "チュニスの征服"
 ara_conquer_tunis_desc: "チュニスは単なる海賊の港ではない。オスマン帝国と結びついたこの海軍大国を放置すれば、地中海の覇権は常に脅かされ続ける。チュニスを征服し、北アフリカの制海権を完全に確立せよ。"

 ara_occupy_alexandria: "アレクサンドリアの占領"
 ara_occupy_alexandria_desc: "東地中海の要衝アレクサンドリア。かつては古代世界の知の中心であり、今もエジプトとアジアの交易が集まる拠点である。この地を手中に収め、東方貿易の富を独占することができれば、アラゴンは真の地中海覇権国となるだろう。"

 ara_claims_on_athens: "アテネへの請求権"
 ara_claims_on_athens_desc: "かつてアラゴンの傭兵部隊（カタルーニャ会社）がアテネ公国を打ち立てたように、アラゴンはギリシャの地に歴史的な権利を持つ。モレアとギリシャ北部を掌握し、コンスタンティノープルへの最後の足掛かりを確保せよ。"

 ara_mare_nostrum: "我らの海"
 ara_mare_nostrum_desc: "ジブラルタルからマルマラ海まで、地中海はもはや我らの湖である。アラゴンの艦隊なき許可なく、この海で帆を張れる者はいない。西地中海の覇権は確立された——次なる目標は、あの城壁に守られた黄金の都市だ。"

 ara_taula_de_canvi: "両替商——タウラ・デ・カンビ"
 ara_taula_de_canvi_desc: "1401年にバルセロナで設立された「タウラ・デ・カンビ（両替台）」は、ヨーロッパ最古の公立銀行の一つである。交易の発展とともに洗練されてきたこの金融制度を活用し、王国の財政基盤を盤石なものとせよ。"

 ara_valencian_silk: "バレンシアの絹"
 ara_valencian_silk_desc: "バレンシアは高品質の絹の産地として知られ始めている。「絹の交易所（ロッジャ・デ・ラ・セダ）」を整備し、バレンシアの絹産業を発展させることで、東方との競争においても優位に立てるだろう。"

 ara_guilds_of_barcelona: "バルセロナの組合"
 ara_guilds_of_barcelona_desc: "バルセロナの職人・商人組合（ギルド）は、この都市の経済の根幹を支えてきた。彼らの忠誠を確保し、王国内の同様の組合との関係を整備することで、工業と交易の基盤がさらに強化されるだろう。"

 ara_industrial_districts: "工業地区の整備"
 ara_industrial_districts_desc: "ガラス、ワイン、紙、そして絹——アラゴンは多様な高付加価値品の生産地である。これらの産業を組織化し製造業を発展させることで、王国の経済力はさらに飛躍的に高まるだろう。"

 ara_aragonese_renaissance: "アラゴンのルネサンス"
 ara_aragonese_renaissance_desc: "アルフォンソ5世の宮廷はナポリにおいてルネサンス文化の中心地となり、イタリアの人文主義者たちがこぞって参集した。この文化的な開花を王国全土に広げることで、アラゴンはヨーロッパの知的・芸術的な中心地としての地位を確立するだろう。"

 ara_golden_century: "黄金の世紀"
 ara_golden_century_desc: "イベリア半島を統一し、地中海を制し、経済と文化を花開かせた今、我が国は真に「黄金の世紀（シグロ・デ・オロ）」を迎えつつある。その輝きは、何世代にもわたって語り継がれるだろう。"

 ara_city_of_the_worlds_desire: "世界の願望の都"
 ara_city_of_the_worlds_desire_desc: "「世界の願望の都」——コンスタンティノープル。その黄金の城壁は長年にわたり多くの征服者を阻んできた。しかし今、地中海を制した我が艦隊と、イベリア半島を統一した我が軍が、ついにこの都市を包囲する時が来た。ボスポラスの両岸を手中に収め、古代の夢を現実とせよ。"

 ara_plus_ultra: "プルス・ウルトラ"
 ara_plus_ultra_desc: "「さらに彼方へ（プルス・ウルトラ）」——かつてヘラクレスの柱（ジブラルタル）の西には何もないと言われていた。しかし今、我らの探検家たちはその先に広大な未知の海があることを知っている。柱を越え、世界の果てへと帆を張る時が来た。"

 ara_african_outposts: "アフリカ沿岸の拠点"
 ara_african_outposts_desc: "アフリカ西岸に沿って南へ進むことで、イスラム商人に依存することなく黄金と交易品に直接アクセスする新たなルートが開ける。まずはカナリア諸島やモロッコ沿岸に拠点を築くことが先決だ。"

 ara_gold_coast_trade: "黄金海岸の交易"
 ara_gold_coast_trade_desc: "西アフリカ沿岸の「黄金海岸」と呼ばれる地域は、その名の通り豊富な黄金の産地である。この地に交易拠点を確立することで、サハラ砂漠を越える陸路に頼ることなく、アフリカの富を直接王国へ持ち込むことができる。"

 ara_discover_the_new_world: "新大陸の発見"
 ara_discover_the_new_world_desc: "大洋の西に何があるのか。球体の地球を信じる我らの探検家たちは、西回りでアジアへ到達できると確信している。探検船を仕立て、未知の大洋へ乗り出せ。そこで発見するものは、誰も想像しなかった新たな世界かもしれない。"

 ara_caribbean_foothold: "カリブの足掛かり"
 ara_caribbean_foothold_desc: "新大陸に最初の橋頭堡を築くことに成功した。ヒスパニョーラ島や周辺の島々に植民地を設立し、さらに広大な大陸への探索の起点とせよ。ここから南へ、北へ、大陸の奥深くへと進む道が開ける。"

 ara_conquest_of_the_incas: "インカ帝国の征服"
 ara_conquest_of_the_incas_desc: "南米大陸の奥地に、黄金と銀に満ちた巨大な帝国があると伝えられている——インカ帝国（タワンティン・スユ）。征服者たちを率い、アンデスの高地に分け入り、この帝国の富を王国のものとせよ。"

 ara_new_kingdom_of_aragon: "新アラゴン王国"
 ara_new_kingdom_of_aragon_desc: "新大陸に築いた植民地は、もはや単なる出先機関ではない。本国と同様の制度を持つ、アラゴン王の直轄領たる「新アラゴン王国」として組織化せよ。二つの世界の覇者として、その名を歴史に刻むだろう。"

 ara_route_to_the_indies: "インドへの航路"
 ara_route_to_the_indies_desc: "アフリカ南端を回り込んでインドへ至る海路は、ポルトガルが先鞭をつけた。しかし我らも黙って見ているわけにはいかない。マゼランのように世界を一周する航路を切り開くか、インドの港に到達せよ。"

 ara_spice_trade_outposts: "香料貿易の拠点"
 ara_spice_trade_outposts_desc: "香料諸島（マルク諸島）で産するクローブ、ナツメグ、コショウは、ヨーロッパで莫大な価値を持つ。この地に拠点を築き香料貿易を独占することができれば、王国の財政は永続的に潤い続けるだろう。"

 ara_las_filipinas: "フィリピナス"
 ara_las_filipinas_desc: "マゼランが辿り着いた群島——フィリピン（フィリピナス）。この戦略的な島々を征服・植民することで、太平洋交易の要として機能する新たな拠点が生まれる。中国とアメリカを結ぶ銀の交易路の中間点として、この地は計り知れない価値を持つ。"

 ara_empire_of_the_three_oceans: "三つの海の帝国"
 ara_empire_of_the_three_oceans_desc: "大西洋、インド洋、太平洋——三つの大洋にその旗をなびかせる帝国が、今ここに誕生した。アラゴンの王笏は今や、ヨーロッパの宮廷だけでなく、アフリカの密林、新大陸の高原、そしてアジアの香料諸島にまで届いている。歴史上、いかなる国家もなし得なかった偉業を、我らは成し遂げた。"
 STATIC_MODIFIER_NAME_ara_kingdom_of_majorca_mod: "バレアレスの船団"
 STATIC_MODIFIER_DESC_ara_kingdom_of_majorca_mod: "バレアレス諸島は古代フェニキア人の時代から地中海交易の要衝だった。13世紀にアラゴンが征服して以来、マジョルカ島は西地中海における中継港として機能し、北アフリカ・イベリア・イタリアを結ぶ商業ネットワークの要となっている。"

 # === 補正 ===

 STATIC_MODIFIER_NAME_ara_reconquest_of_granada_mod: "十字軍の威光"
 STATIC_MODIFIER_DESC_ara_reconquest_of_granada_mod: "722年のコバドンガの戦いに始まったレコンキスタは、800年近くにわたるイベリア半島のキリスト教徒とイスラム教徒の抗争だ。グラナダ陥落（1492年）はその終点であり、アラゴン・カスティーリャ連合王国の誕生を象徴する出来事となった。"

 STATIC_MODIFIER_NAME_ara_vassalize_navarre_mod: "ピレネーの均衡"
 STATIC_MODIFIER_DESC_ara_vassalize_navarre_mod: "ナバラ王国はピレネー山脈を挟んでアラゴンとフランスの間に位置し、歴史的に両国の係争地だった。サンチョ3世の時代に最盛期を迎えたが、その後アラゴン・カスティーリャ・フランスに次々と圧力をかけられ続けた小王国だ。"

 STATIC_MODIFIER_NAME_ara_intervene_in_castile_mod: "カスティーリャ遠征軍"
 STATIC_MODIFIER_DESC_ara_intervene_in_castile_mod: "カスティーリャとアラゴンの関係は婚姻と対立を繰り返してきた。フアン2世の継承争いにアラゴンが軍事介入したことは、両国を最終的に統合へと向かわせる歴史的転換点の一つとなった。"

 STATIC_MODIFIER_NAME_ara_union_of_the_crowns_mod: "カトリック両王の威光"
 STATIC_MODIFIER_DESC_ara_union_of_the_crowns_mod: "1469年のフェルナンド2世とイサベル1世の婚姻は、アラゴンとカスティーリャという二つの大王国を同君連合として結びつけた。「カトリック両王」と呼ばれた二人の統治はスペイン統一国家の礎となり、直後のグラナダ征服・コロンブスの航海へと続く。"


 STATIC_MODIFIER_NAME_ara_catalan_nobility_mod: "フスティシアの裁き"
 STATIC_MODIFIER_DESC_ara_catalan_nobility_mod: "フスティシア・デ・アラゴンは中世アラゴンの独特な制度で、国王の権力に対して貴族・騎士・市民の権利を守る役割を担った。「我ら、汝と同等の者は、汝よりも権力がない者ではあるが……」という宣誓文は、国王権力の限界を明文化した中世ヨーロッパでも稀な制度だ。"

 STATIC_MODIFIER_NAME_ara_crowns_of_iberia_mod: "スペインの戦時体制"
 STATIC_MODIFIER_DESC_ara_crowns_of_iberia_mod: "アラゴン連合王国とカスティーリャ、そしてポルトガルを統合することでイベリア半島全体が一つの君主のもとに収まる。ローマ帝国以来の「ヒスパニア統一」という夢の実現は、世界史的な大事業だ。"

 STATIC_MODIFIER_NAME_ara_pacify_sardinia_mod: "サルデーニャ駐屯軍"
 STATIC_MODIFIER_DESC_ara_pacify_sardinia_mod: "サルデーニャ島はアラゴンが1323年に征服して以来、100年以上にわたる断続的な反乱に悩まされた。ジュディカーティ（在地勢力）やジェノヴァの支援を受けた反乱者たちとの長い戦いの末、島はようやくアラゴンの真の一部となった。"

 STATIC_MODIFIER_NAME_ara_consulate_of_the_sea_mod: "海商法の威光"
 STATIC_MODIFIER_DESC_ara_consulate_of_the_sea_mod: "バルセロナの「コンスラート・デ・マル（海の領事館）」は14世紀に編纂された『海商法（リブレ・デル・コンソラット・デ・マル）』で知られる。この海事法典は地中海全体で標準的な商業慣行として採用され、中世ヨーロッパ最大の海商法の成果となった。"

 STATIC_MODIFIER_NAME_ara_dominate_genoa_mod: "リグリアの商館"
 STATIC_MODIFIER_DESC_ara_dominate_genoa_mod: "ジェノヴァはヴェネツィアと並ぶ中世地中海交易の二大勢力だった。アラゴンとジェノヴァは長年にわたって覇権を争い、14〜15世紀にはサルデーニャやコルシカを巡って激しく衝突した。ジェノヴァの豊富な商業ネットワークをアラゴンの支配下に置くことは地中海制覇の要となる。"

 STATIC_MODIFIER_NAME_ara_rule_italy_mod: "半島の盟主"
 STATIC_MODIFIER_DESC_ara_rule_italy_mod: "アラゴン連合王国はアルフォンソ5世（寛大王）のナポリ征服（1442年）を機にイタリアに深く関与した。アルフォンソはナポリを本拠地とし、ルネサンスの大後援者として君臨した。イタリア全土支配はこのアルフォンソの野望の究極的完成だ。"

 STATIC_MODIFIER_NAME_ara_invade_occitania_mod: "オック語圏遠征軍"
 STATIC_MODIFIER_DESC_ara_invade_occitania_mod: "南フランスのオクシタニアはかつてアラゴン王家の影響圏だった。12世紀のアラゴン王ラモン・ベレンゲール4世はプロヴァンスを獲得し、ピレネー以北への拡張を目指した。アルビジョワ十字軍でフランスに押し出されたが、その権利主張は消えていない。"

 STATIC_MODIFIER_NAME_ara_humiliate_provence_mod: "プロヴァンス伯領の従属"
 STATIC_MODIFIER_DESC_ara_humiliate_provence_mod: "プロヴァンスのアンジュー家はナポリ王位を巡るアラゴンの宿敵だ。ルネ王との争いは数十年に及んだ。プロヴァンスの海軍施設——マルセイユやトゥーロンの造船所——を接収することは屈辱を与えると同時に地中海制覇に不可欠な戦略だ。"

 STATIC_MODIFIER_NAME_ara_aragonese_navy_mod: "アルマダ・デ・アラゴン"
 STATIC_MODIFIER_DESC_ara_aragonese_navy_mod: "アラゴンの海軍力はバルセロナとバレンシアの造船技術に根ざしている。13〜15世紀、アラゴン艦隊はシチリア・サルデーニャ・ナポリ征服を支えた地中海屈指の戦闘力を誇った。カタルーニャの水兵たちはヴェネツィアやジェノヴァに比肩する練度を持つ。"

 STATIC_MODIFIER_NAME_ara_integrate_naples_mod: "両シチリアの財源"
 STATIC_MODIFIER_DESC_ara_integrate_naples_mod: "アルフォンソ5世がナポリを征服した後、アラゴンとナポリの経済的統合が進んだ。バルセロナとナポリの間の交易路は地中海で最も繁盛するルートの一つとなり、カタルーニャ商人たちはナポリ王国全土に支店を展開した。"

 STATIC_MODIFIER_NAME_ara_mediterranean_ambitions_mod: "ガレー船団の威容"
 STATIC_MODIFIER_DESC_ara_mediterranean_ambitions_mod: "アラゴン連合王国の地中海帝国はシチリア・サルデーニャ・ナポリ・マジョルカ・ルシヨンに及んだ。「地中海はアラゴンの湖」と称されたこの海洋帝国の拡大は、カタルーニャの商業的・海軍的力に支えられていた。"

 STATIC_MODIFIER_NAME_ara_combat_barbary_piracy_mod: "海賊討伐艦隊"
 STATIC_MODIFIER_DESC_ara_combat_barbary_piracy_mod: "バルバリア海賊は北アフリカのベルベル人・アラブ人の海賊集団で、地中海の商船を長年にわたって脅かした。アラゴンの商船はその被害を特に受けやすく、バレアレス諸島への攻撃も度々あった。海賊討伐は地中海交易を守るアラゴンの死活問題だ。"

 STATIC_MODIFIER_NAME_ara_conquer_tunis_mod: "北アフリカ駐屯軍"
 STATIC_MODIFIER_DESC_ara_conquer_tunis_mod: "チュニスはハフス朝の首都として北アフリカ最大の交易都市の一つだった。1270年にルイ9世（聖王）が十字軍遠征中に没した地でもある。地中海南岸を掌握することでアラゴンはシチリアとの間の海峡を完全に支配下に置く。"

 STATIC_MODIFIER_NAME_ara_occupy_alexandria_mod: "東方貿易の独占"
 STATIC_MODIFIER_DESC_ara_occupy_alexandria_mod: "アレクサンドリアはインド・東南アジアからの香辛料交易がヨーロッパへ入る最大の玄関口だった。ヴェネツィアとジェノヴァが長年独占してきたこの東方交易の要衝を手中に収めることはアラゴン商業帝国の究極的勝利を意味する。"

 STATIC_MODIFIER_NAME_ara_claims_on_athens_mod: "カタルーニャ会社の遺産"
 STATIC_MODIFIER_DESC_ara_claims_on_athens_mod: "カタルーニャ傭兵団（Almogàvers）は1303年からビザンツ帝国に雇われ、のちに独立してアテネ公国（1311〜1388年）を建国した。この知られざる歴史がアラゴン王家のアテネへの継承権主張の根拠となっている。"

 STATIC_MODIFIER_NAME_ara_mare_nostrum_mod: "地中海艦隊総司令部"
 STATIC_MODIFIER_DESC_ara_mare_nostrum_mod: "「マーレ・ノストルム（我らの海）」とはローマ人が地中海を呼んだ名だ。アラゴンがその夢を引き継ぎ、東はギリシャから西はアフリカまで、北はイタリアから南はエジプトまで、かつてのローマ帝国の海洋領域を再び一つの王冠のもとに収めた。"

 STATIC_MODIFIER_NAME_ara_taula_de_canvi_mod: "両替台の信用"
 STATIC_MODIFIER_DESC_ara_taula_de_canvi_mod: "1401年にバルセロナに設立された「タウラ・デ・カンビ（両替台）」は世界初の公的銀行の一つとされる。バルセロナの商人ギルドが運営するこの金融機関は融資・為替・預金業務を行い、カタルーニャの商業活動を支える重要な柱となった。"

 STATIC_MODIFIER_NAME_ara_valencian_silk_mod: "ロッジャ・デ・ラ・セダ"
 STATIC_MODIFIER_DESC_ara_valencian_silk_mod: "バレンシアは中世地中海世界有数の絹産地だった。ムーア人が持ち込んだ養蚕技術がキリスト教徒の職人に引き継がれ、バレンシアの絹はイタリアの高級生地と並ぶ名声を誇った。ロンハ・デ・ラ・セダ（絹商品取引所）はその繁栄の象徴だ。"

 STATIC_MODIFIER_NAME_ara_guilds_of_barcelona_mod: "ギルドの忠誠"
 STATIC_MODIFIER_DESC_ara_guilds_of_barcelona_mod: "バルセロナの職人ギルドは中世ヨーロッパでも特に組織化されており、王家との交渉力も強かった。羊毛・皮革・金属加工・造船など多岐にわたるギルドが都市経済を支え、カタルーニャの工業的基盤となっていた。"

 STATIC_MODIFIER_NAME_ara_industrial_districts_mod: "製造業の興隆"
 STATIC_MODIFIER_DESC_ara_industrial_districts_mod: "バルセロナ・バレンシア・サラゴサには羊毛・生地・皮革・金属加工の工房が集中する工業地区が発達した。アラゴン連合王国の商業的繁栄はこれらの都市工業の生産力に支えられており、その製品はイタリア市場でも高く評価された。"

 STATIC_MODIFIER_NAME_ara_aragonese_renaissance_mod: "人文主義者の宮廷"
 STATIC_MODIFIER_DESC_ara_aragonese_renaissance_mod: "ナポリ王アルフォンソ5世はイタリア・ルネサンスの最大の後援者の一人として名を馳せた。彼の宮廷にはポジオ・ブラッチョリーニ・ロレンツォ・ヴァッラといった人文主義者が集い、ナポリはフィレンツェと並ぶルネサンス文化の中心地となった。"

 STATIC_MODIFIER_NAME_ara_golden_century_mod: "シグロ・デ・オロの繁栄"
 STATIC_MODIFIER_DESC_ara_golden_century_mod: "シグロ・デ・オロ（黄金の世紀）とはスペインが政治・軍事・文化の頂点を極めた16〜17世紀を指す。セルバンテスの『ドン・キホーテ』、ベラスケスの宮廷画、ロペ・デ・ベガの演劇——アラゴン・カスティーリャ連合王国はヨーロッパ文化の最高峰に君臨した。"

 STATIC_MODIFIER_NAME_ara_city_of_the_worlds_desire_mod: "ボスポラスの覇者"
 STATIC_MODIFIER_DESC_ara_city_of_the_worlds_desire_mod: "コンスタンティノープルは1000年にわたって東西文明の接点として君臨した都市だ。古代ローマの後継者たるビザンツ帝国の首都として、また東地中海交易の中心として、この都市を手中にすることは地中海全体の覇権を象徴する。"

 STATIC_MODIFIER_NAME_ara_plus_ultra_mod: "彼方への航海熱"
 STATIC_MODIFIER_DESC_ara_plus_ultra_mod: "「プルス・ウルトラ（さらに彼方へ）」はカルロス1世（神聖ローマ皇帝カール5世）が採用したモットーだ。ヘラクレスの柱（ジブラルタル海峡）を越えた先に新世界が広がるという意味を持ち、スペインの大航海時代への精神を象徴する言葉となった。"

 STATIC_MODIFIER_NAME_ara_african_outposts_mod: "カナリアの拠点"
 STATIC_MODIFIER_DESC_ara_african_outposts_mod: "北アフリカの沿岸都市——セウタ・オランなど——はサハラ以南とヨーロッパを繋ぐ黄金・象牙・奴隷交易の終着点だった。これらの港を押さえることはサハラ交易の富をヨーロッパへ引き込む鍵となる。"

 STATIC_MODIFIER_NAME_ara_gold_coast_trade_mod: "黄金の交易網"
 STATIC_MODIFIER_DESC_ara_gold_coast_trade_mod: "西アフリカの黄金海岸（現在のガーナ周辺）はサハラを越えてマリ帝国・ソンガイ帝国から運ばれる黄金の産地として知られた。この地との直接交易はヴェネツィアやジェノヴァを経由せずに東方の富を得る革命的な経路となった。"

 STATIC_MODIFIER_NAME_ara_discover_the_new_world_mod: "大洋艦隊の士気"
 STATIC_MODIFIER_DESC_ara_discover_the_new_world_mod: "1492年10月12日、クリストファー・コロンブスはイサベル女王の資金援助でアメリカ大陸に到達した。この「新世界の発見」はヨーロッパ・アメリカ・アフリカ・アジアを結ぶ世界経済の誕生を告げ、人類史を根底から変えた。"

 STATIC_MODIFIER_NAME_ara_caribbean_foothold_mod: "ヒスパニョーラの定住地"
 STATIC_MODIFIER_DESC_ara_caribbean_foothold_mod: "エスパニョーラ島（現在のハイチ・ドミニカ共和国）にコロンブスが建設したナビダード砦はスペイン植民地帝国の最初の拠点となった。カリブ海の島々はやがてサトウキビと鉱業の中心地となり、植民地経済の基盤となっていく。"

 STATIC_MODIFIER_NAME_ara_conquest_of_the_incas_mod: "コンキスタドールの遺産"
 STATIC_MODIFIER_DESC_ara_conquest_of_the_incas_mod: "1532年にフランシスコ・ピサロがインカ皇帝アタワルパを捕らえてインカ帝国を征服した。世界最大の黄金文明の略奪はスペインに空前の富をもたらし、ポトシ銀山の発見とともに新大陸から大量の貴金属がヨーロッパへと流入した。"

 STATIC_MODIFIER_NAME_ara_new_kingdom_of_aragon_mod: "アメリカの王冠"
 STATIC_MODIFIER_DESC_ara_new_kingdom_of_aragon_mod: "新アラゴン王国の建設は、本国アラゴンの遺産を新世界に移植する壮大な植民事業だ。先住民の労働力を組み込んだエンコミエンダ制度のもと、銀・金・砂糖・染料が本国へと送られ続ける。"

 STATIC_MODIFIER_NAME_ara_route_to_the_indies_mod: "航海者たちの羅針盤"
 STATIC_MODIFIER_DESC_ara_route_to_the_indies_mod: "ポルトガルがアフリカ回りの航路でインドに到達したのと同様、アラゴンは太平洋経由でアジアへの直接航路を模索した。マゼランの世界一周航海（1519〜1522年）はこの野望の延長線上にある歴史的偉業だ。"

 STATIC_MODIFIER_NAME_ara_spice_trade_outposts_mod: "マルク諸島の商館"
 STATIC_MODIFIER_DESC_ara_spice_trade_outposts_mod: "コショウ・ナツメグ・丁子（クローブ）などの香辛料は中世ヨーロッパで黄金と同等の価値を持った。イスラム商人とヴェネツィアが独占していたこの交易路を断ち切り、産地に直接拠点を築くことは帝国的富の源泉となる。"

 STATIC_MODIFIER_NAME_ara_las_filipinas_mod: "太平洋の中継地"
 STATIC_MODIFIER_DESC_ara_las_filipinas_mod: "フィリピン諸島はマゼランが到達し（1521年）、後にルソン島のマニラを拠点に「ガレオン貿易」の中心地となった。メキシコのアカプルコとマニラを繋ぐこの航路で、新大陸の銀と中国の絹・陶磁器が交換され続けた。"

 STATIC_MODIFIER_NAME_ara_empire_of_the_three_oceans_mod: "不滅の太陽の帝国"
 STATIC_MODIFIER_DESC_ara_empire_of_the_three_oceans_mod: "地中海・大西洋・太平洋の三大洋に覇権を確立したアラゴン帝国は、古代以来のいかなる帝国も成し遂げなかった海洋支配を実現した。カルロス5世が夢見た「太陽の沈まない帝国」がここに完成する。"

 # === イベント ===
 ara_events.1.t: "ペドロ4世の即位"
 ara_events.1.d: "1336年、アルフォンソ4世が世を去り、その子ペドロ4世が新たにアラゴン連合王国の王位を継いだ。1337年現在、王国はカタルーニャ、アラゴン、バレンシア、そしてバレアレス諸島の各邦が緩やかに結びついた連合体である。サルデーニャ島の支配は不安定で、隣国カスティーリャとの関係は常に緊張を孕んでいる。地中海の交易路を支配する海商たちの力は強く、王権はこれら諸邦の特権と協議しながら国政を進めねばならない。若き王ペドロ4世の前には、統一されたイベリアと地中海の覇権という、遥かなる道が広がっている。"
 ara_events.1.a: "新たな治世の始まりだ"

 ara_events.2.t: "マヨルカ王国の統合"
 ara_events.2.d: "マヨルカ王国はかつてアラゴン王家の分家ジャウマ2世によって建国された兄弟国家であったが、バレアレス諸島、ルシヨン、モンペリエを領するこの小国は長らくアラゴンの影響圏にあった。今やその独自性も保てぬ状況となり、統合の時が来た。完全に併合してアラゴンの一部とするか、友好的な属国として残すか——どちらの形であれ、マヨルカはアラゴンの下に入る。"
 ara_events.2.a: "マヨルカを完全に併合する"
 ara_events.2.b: "マヨルカを友好的な属国として残す"
 STATIC_MODIFIER_NAME_ara_seize_sicily_mod: "シチリア制圧の栄光"
 STATIC_MODIFIER_DESC_ara_seize_sicily_mod: "1282年の「シチリアの晩鐘」でアンジュー家を追い出したシチリア人はアラゴンのピエトロ3世を新王に迎えた。以来シチリアはアラゴン王家の重要な領土となり、地中海中央部を制する戦略的要衝として機能し続けた。"
