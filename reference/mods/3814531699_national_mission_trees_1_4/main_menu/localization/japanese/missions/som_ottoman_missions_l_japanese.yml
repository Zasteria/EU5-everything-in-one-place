 # ============================================================

 # PHASE 1

 # PHASE 2

 # PHASE 3

 # PHASE 4

 # PHASE 5

 # PHASE 6

 # PHASE 7

 # FINAL

 # === イベント ===

 # === モディファイア ===

 # ビザンツ追加ミッション

 # === シスマ分岐ミッション ===

 # イベント11〜18

 # モディファイア

 # === 信仰の選択 ===

 # === Event 22 ===

 som_ottoman_events.20.t: "黒海制覇"
 som_ottoman_events.20.d: "黒海はかつてジェノヴァが商業を独占する「ジェノヴァの湖」だった。しかしオスマン艦隊がクリミアとカッファを制圧し、ボスポラス海峡を掌握した今、黒海は「オスマンの内海」となった。1475年のカッファ陥落により、最後のジェノヴァ拠点も消え、黒海沿岸の全交易はオスマンの管理下に入った。ヴェネツィアとジェノヴァが300年間支配した東地中海の交易覇権は、ここに終焉を告げた。"
 som_ottoman_events.20.a: "黒海はオスマンの内海となった"
 som_ottoman_events.30.t: "ウィーンの門前"
 som_ottoman_events.30.d: "1529年、スレイマン大帝の軍はついにウィーンに到達した。神聖ローマ帝国の心臓部に迫る30万のオスマン軍はキリスト教世界全体に衝撃を与えた。城壁は激しく砲撃されたが、早期の冬と補給線の限界が攻略を妨げた——しかし今回は違う。「ウィーンを落とせば欧州は我らのもの」——スルタンの言葉が軍全体に響き渡る。"
 som_ottoman_events.30.a: "ウィーンを制し、欧州の覇者となれ"
 som_ottoman_events.99.t: "スレイマン大帝の時代"
 som_ottoman_events.99.d: "オスマン帝国はついに「スレイマン大帝の時代」に到達した。バルカンからアラビア、クリミアから北アフリカまで——かつてのローマ帝国さえ超える広大な版図が一人のスルタンの命令で動く。「立法者（カーヌーニー）」と呼ばれたスレイマンの時代、帝国は法典の整備・芸術の繁栄・軍事的絶頂を同時に達成した。イスタンブールのモスク・宮殿・バザールは世界最大の都市の栄光を示す。オスマン帝国は世界史上最も偉大な帝国の一つとなった。"
 som_ottoman_events.99.a: "偉大なるオスマン帝国の黄金時代が始まる"

 som_tur_edirne_capital: "エディルネの城塞化"
 som_tur_edirne_capital_desc: "古代のハドリアノポリスを引き継いだエディルネは、1363年にムラト1世がバルカン征服の拠点として首都に定めた。コンスタンティノープル征服（1453年）まで約90年間オスマン帝国の首都として機能し、スルタン・メフメト2世が産声を上げた地でもある。この都市を強化された要塞として整備し、ルメリア征服の足がかりとせよ。"
 som_tur_aegean_dominance: "エーゲ海の掌握"
 som_tur_aegean_dominance_desc: "エーゲ海はヴェネツィアとジェノヴァが覇権を競う交易の十字路だ。スミルナ（イズミル）を核とするエーゲ海東岸を掌握し、海軍力を増強することで、地中海全体への進出の足がかりとなる。オスマン海軍の黎明期に艦隊を整備し、この重要な海峡を支配せよ。"

 som_tur_janissary_corps: "イェニチェリ軍団の創設"
 som_tur_janissary_corps_desc: "14世紀中頃、オルハン1世の子ムラト1世がイェニチェリを創設した。「新しい兵（イェニ・チェリ）」と呼ばれたこの部隊は、征服した地域のキリスト教徒の少年を強制徴用して育成した常備歩兵軍だ。俸給を受け取り、厳しく訓練されたイェニチェリはオスマン軍の精鋭として、コンスタンティノープル陥落をはじめ数々の歴史的戦闘で決定的な役割を果たした。"
 som_tur_devshirme_system: "デヴシルメ制度"
 som_tur_devshirme_system_desc: "「デヴシルメ（少年徴用）」はバルカン半島のキリスト教徒の少年を強制的に集め、オスマン式に改宗・教育してイェニチェリや宮廷官僚として育てる制度だ。この制度により血縁や部族に縛られない皇帝直属の官僚・軍人層が生まれ、オスマン帝国の中央集権化を支えた。スルタンへの絶対忠誠が求められたが、その代わり最高位の大宰相にまで昇進できる道が開かれていた。"
 som_tur_elite_guard: "親衛隊の強化"
 som_tur_elite_guard_desc: "スルタンの親衛隊はイェニチェリの中でも特に優れた者から選ばれ、宮殿の守衛と戦場での旗手を務めた。彼らの存在はオスマン宮廷における秩序と規律の象徴だ。軍規を厳格に維持し、訓練を積み重ねることで帝国軍の中核となる親衛隊を育成せよ。"
 som_tur_kanun_i_osmani: "カーヌーン・イ・オスマーニー"
 som_tur_kanun_i_osmani_desc: "「スレイマン大帝の法典（カーヌーン・イ・オスマーニー）」はオスマン帝国が独自に発展させた世俗法体系だ。「カーヌーニー（立法者）」と呼ばれたスレイマン1世がその整備を完成させたが、その基礎は14〜15世紀に既に形成されていた。シャリーア（イスラム法）を補完するこの法典は、税制・刑法・行政を網羅し、帝国統治の法的基盤となった。"
 som_tur_imperial_army: "帝国軍の完成"
 som_tur_imperial_army_desc: "イェニチェリ・シパーヒー・アゼップ（歩兵）・アクンジュ（軽騎兵）——オスマン帝国は複数の異なる軍種を組み合わせた複合軍事システムを発展させた。規律ある常備軍と火器の積極的採用が、16世紀のオスマン軍を当時世界最強の軍事力の一つに仕立て上げた。スルタンは陸軍の近代化と規模拡大を完成させ、真の帝国軍を手中に収める。"
 som_tur_timar_system: "ティマール封土制の整備"
 som_tur_timar_system_desc: "ティマール制はオスマン帝国の根幹をなす土地制度だ。スルタンが征服地の土地をシパーヒー騎兵に「ティマール（封土）」として与え、その代わりに騎兵は軍役を義務付けられる。中世ヨーロッパの封建制に似ているが、オスマンのティマールは世襲ではなく皇帝の管理下に置かれた。この制度が大規模な常備軍を維持するための財政基盤となった。"
 som_tur_sipahi_cavalry: "シパーヒー騎兵団"
 som_tur_sipahi_cavalry_desc: "シパーヒー（「騎兵」の意）はティマール制に基づくオスマン帝国の主力騎兵部隊だ。封土を与えられた地方貴族が武装騎兵として軍役を果たすこの制度は、15〜16世紀のオスマン軍の主力を形成した。鎧を纏い槍と剣で武装したシパーヒーの突撃は、ヨーロッパの騎兵部隊に匹敵する戦力だった。"
 som_tur_eyalet_system: "エヤレット制度"
 som_tur_eyalet_system_desc: "エヤレット（州）はオスマン帝国の最大の行政単位だ。総督（ベイレルベイ）が派遣されて統治するこの制度は、広大な帝国を中央から統治する仕組みの核心をなした。ルメリア・アナドル・エジプト・シリアなど各エヤレットは独自の軍事力と行政機構を持ち、スルタンの代理として機能した。"
 som_tur_grand_vizier: "大宰相制度"
 som_tur_grand_vizier_desc: "大宰相（サドラザム）はオスマン帝国でスルタンに次ぐ最高の行政長官だ。「高い門（バーブ・アーリー）」とも呼ばれるその府邸がオスマン帝国の行政の中心となり、ヨーロッパでは「オスマン政府」を指す「崇高な門（スブリーム・ポルト）」の語源となった。優れた大宰相はスルタンを補佐し、広大な帝国を実質的に統治した。"
 som_tur_imperial_bureaucracy: "帝国官僚制の完成"
 som_tur_imperial_bureaucracy_desc: "オスマン帝国の官僚制はデヴシルメ出身者と伝統的なトルコ・イスラム系官人が混在する複合的なシステムだった。各省庁（ディヴァーン）が専門的な行政機能を担い、文書による記録と中央集権的な情報管理が帝国統治を支えた。15〜16世紀のオスマン官僚制はその時代で最も洗練された行政システムの一つだった。"
 som_tur_new_capital: "コンスタンティニエの開発"
 som_tur_new_capital_desc: "コンスタンティノープルを征服したメフメト2世は都市を「コンスタンティニエ」と改名し、積極的な再開発を推進した。廃墟と化していた地区への人口移住の強制・市場の整備・インフラ再建——スルタンの意志のもとで都市は急速に発展した。かつてビザンツ帝国が誇った「世界最大の都市」の栄光を、今度はオスマン帝国の手で取り戻す。"
 som_tur_new_capital_unlock_tt: "決断「コンスタンティニエの再開発」が解放された。"
 som_develop_kostantiniyye_decision.title: "コンスタンティニエの再開発"
 som_develop_kostantiniyye_decision.desc: "征服した帝都は大きく育ったが、市街にはいまだ包囲戦の傷跡が残っている。スルタンの財庫から移住・市場・街路の再建に資金を投じれば、コンスタンティニエは再び繁栄の道を歩み始めるだろう。"
 som_develop_kostantiniyye_decision.a: "帝都の再建に資金を投じる。"
 som_expand_kostantiniyye_decision.title: "コンスタンティニエを栄華へ導く"
 som_expand_kostantiniyye_decision.desc: "再建は実を結び、新しい市街には移住者と職人があふれている。工房・隊商宿・都の周辺の土地へさらなる投資を行えば、コンスタンティニエはビザンツの首都の栄光をも凌ぐだろう。"
 som_expand_kostantiniyye_decision.a: "都の偉大さに投資する。"
 som_tur_grand_bazaar: "グランドバザールの整備"
 som_tur_grand_bazaar_desc: "コンスタンティノープルのグランドバザール（カパルチャルシュ）はメフメト2世の命令で1455〜61年に建設された世界最古の屋根付き市場の一つだ。4,000の店舗を擁するこの迷宮のような市場は、絹・香辛料・宝石・陶磁器・武器があふれる地中海世界最大の商業拠点となった。毎日数万人の商人と客が行き交うこの市場がイスタンブールの商業的心臓部となった。"
 som_tur_grand_bazaar_condition_tt: "決断「コンスタンティニエを栄華へ導く」を使用した"
 som_tur_suleiman_mosque: "スレイマニエ・モスクの建設"
 som_tur_suleiman_mosque_desc: "スレイマン大帝が建築家スィナンに命じて1557年に完成させたスレイマニエ・モスクは、オスマン建築の最高傑作と称される。4本の宣礼塔（ミナレット）が聳えるこの壮麗なモスクはコンスタンティノープルの丘の上に建ち、市内のどこからも見える帝国の象徴だ。附属施設（クッリイェ）にはマドラサ（神学校）・病院・商業施設・霊廟が含まれ、都市生活の中心となった。"
 som_tur_topkapi_palace: "トプカプ宮殿"
 som_tur_topkapi_palace_desc: "トプカプ宮殿はメフメト2世がコンスタンティノープル征服後に建設した帝国の中枢だ。ボスポラス海峡と金角湾と、マルマラ海を一望する岬の上に建つこの宮殿は、スルタンの居所・政府の中枢・ハレム・国家宝物庫のすべてを兼ねた。400年間にわたってオスマン帝国の権力の中心として機能したトプカプ宮殿は、帝国の栄光の象徴となった。"
 som_tur_city_of_worlds_desire: "世界の欲する都市"
 som_tur_ulema_authority: "ウラマーの権威"
 som_tur_ulema_authority_desc: "ウラマー（イスラム学者）はオスマン帝国における宗教・司法・教育の中枢を担う知識人階層だ。カーディー（裁判官）・ムフティー（法律顧問）・マドラサ（神学校）教師として帝国のあらゆる場所で活動するウラマーは、スルタンの権威に宗教的正当性を与えると同時に、シャリーア（イスラム法）の番人として機能した。"
 som_tur_millet_system: "ミッレト制度"
 som_tur_millet_system_desc: "「ミッレト（民族・宗教共同体）」制度はオスマン帝国の非イスラム教徒の臣民（ジンミー）を各自の宗教的コミュニティとして自治的に統治する仕組みだ。ギリシャ正教のルーム・ミッレト、アルメニア使徒教会ミッレト、ユダヤ教ミッレトなど、各宗教共同体は独自の裁判所・学校・慈善施設を持ち、宗教的指導者が共同体を代表した。この寛容的な統治が多様な民族・宗教を含む帝国の安定を可能にした。"
 som_tur_kadi_courts: "カーディー裁判制度"
 som_tur_kadi_courts_desc: "カーディー（イスラム法裁判官）はオスマン帝国の司法制度の基盤だ。スルタンから直接任命されるカーディーは、相続・婚姻・財産紛争・刑事案件を担当し、都市から農村まで帝国全土で法の支配を実現した。カーディーが記録した「シジル（裁判台帳）」は後世に残る膨大な歴史的記録となり、当時の社会の様子を伝えている。"
 som_tur_sufi_culture: "スーフィー文化"
 som_tur_sufi_culture_desc: "スーフィー教団（タリーカ）はオスマン帝国の宗教文化に深く根付いていた。メヴレヴィー教団（旋回舞踊で有名）・ベクタシー教団（イェニチェリの精神的支柱）・ナクシュバンディー教団など、各教団はそれぞれの霊性と伝統を持ちながらも帝国社会の一翼を担った。スーフィーの神秘主義は芸術・詩・音楽に多大な影響を与え、オスマン文化の豊かさを形作った。"
 som_tur_cultural_synthesis: "文化的融合"
 som_tur_cultural_synthesis_desc: "オスマン帝国は征服した文化を破壊するのではなく吸収・融合させた。ビザンツの行政システム・アラブの学術・ペルシャの宮廷文化・トルコの軍事伝統が融合して独自の「オスマン文化」が生まれた。この文化的包容性が帝国の統治を豊かにし、多様な民族・宗教・言語を持つ臣民を「オスマン人」として統合する基盤となった。"
 som_tur_bursa_silk_industry: "ブルサ絹産業"
 som_tur_bursa_silk_industry_desc: "ブルサはオスマン帝国の最初の首都として1326年に設定され、14世紀から絹の国際交易の中心地として発展した。ビザンツ帝国が独占していた絹産業の技術と職人がブルサに集まり、高品質の絹织物が生産されてヨーロッパ・中東に輸出された。「絹の都市」として知られるブルサの繁栄はオスマン帝国初期の経済的基盤となった。"
 som_tur_silk_road: "絹街道の掌握"
 som_tur_silk_road_desc: "中国からイスタンブールまで延びる絹街道は、オスマン帝国にとって最重要の交易路だ。トレビゾンドはカスピ海・中央アジアからの商品がアナトリアに流入する玄関口であり、この港市を掌握することで絹街道東部の交易を制御できる。タブリーズ・サマルカンドからの絹・香辛料・染料がオスマンの市場を潤す。"
 som_tur_ankara_prosperity: "アンカラの繁栄"
 som_tur_ankara_prosperity_desc: "アンカラはアナトリア高原の交通の要衝であり、古来から商業都市として栄えてきた。アンゴラヤギの毛から作られる高品質の繊維産業、染料植物の栽培、そして東西を結ぶ交易路——これらがアンカラを帝国内陸部の重要な経済拠点にした。「アンゴラ」という名称はこの都市名に由来している。"
 som_tur_trade_routes: "帝国交易路の整備"
 som_tur_trade_routes_desc: "オスマン帝国の版図が広がるにつれ、帝国内の交易路の整備が急務となった。キャラバンサライ（隊商宿）の整備・街道の舗装・橋の建設・海賊取り締まりによる海上交易の安全確保——これらがオスマン帝国内の商業活動を活発化させた。コンスタンティノープルを中心とする放射状の交易網が形成され、帝国全体の経済統合が進んだ。"
 som_tur_commercial_empire: "商業帝国の確立"
 som_tur_commercial_empire_desc: "アレッポ・アレクサンドリア・コンスタンティノープル——オスマン帝国はアジア・アフリカ・ヨーロッパを結ぶ世界交易の三大拠点を掌握した。インドの香辛料・中国の絹・ヨーロッパの金銀がオスマン領を通過し、帝国は世界交易の仲介者として莫大な富を蓄積した。ポルトガルのアフリカ周航路開拓はこの地位を脅かしたが、オスマンは長くアジア・ヨーロッパ間の交易の要衝であり続けた。"
 STATIC_MODIFIER_NAME_som_tur_janissary_mod: "イェニチェリ軍団"
 STATIC_MODIFIER_DESC_som_tur_janissary_mod: "14世紀に創設されたイェニチェリはオスマン帝国最精鋭の常備歩兵だ。デヴシルメ制度で徴用されたキリスト教徒の少年が改宗・訓練されてスルタン直属の戦士となり、コンスタンティノープル陥落をはじめ数々の歴史的勝利の立役者となった。"
 STATIC_MODIFIER_NAME_som_tur_devshirme_mod: "デヴシルメ制度"
 STATIC_MODIFIER_DESC_som_tur_devshirme_mod: "バルカン半島のキリスト教徒の少年を強制徴用し、オスマン式に育て上げるデヴシルメ制度は、血縁・部族に縛られないスルタン直属の官僚・軍人層を生み出した。最高位の大宰相さえもデヴシルメ出身者が占める事例が多く、能力主義的な人材登用を可能にした。"
 STATIC_MODIFIER_NAME_som_tur_elite_guard_mod: "親衛隊の精鋭化"
 STATIC_MODIFIER_DESC_som_tur_elite_guard_mod: "イェニチェリの中から選ばれたスルタン親衛隊は帝国で最も訓練を積んだ戦士たちだ。彼らの存在はオスマン軍の核心として戦場での決定的な役割を果たし続けた。"
 STATIC_MODIFIER_NAME_som_tur_kanun_mod: "カーヌーン法典"
 STATIC_MODIFIER_DESC_som_tur_kanun_mod: "シャリーア（イスラム法）を補完するカーヌーン（世俗法）の整備によって、オスマン帝国は宗教法と世俗法を組み合わせた独自の法体系を確立した。この二元的法体系が多様な宗教・文化背景を持つ臣民を統治する法的枠組みとなった。"
 STATIC_MODIFIER_NAME_som_tur_imperial_army_mod: "帝国軍の完成"
 STATIC_MODIFIER_DESC_som_tur_imperial_army_mod: "イェニチェリ・シパーヒー・火砲を組み合わせたオスマン帝国の複合軍事システムは16世紀に絶頂に達した。規律・火力・機動力を兼ね備えたこの軍隊は当時世界最強の軍事力の一つとして「オスマンの脅威」としてヨーロッパ全体を震撼させた。"
 STATIC_MODIFIER_NAME_som_tur_timar_mod: "ティマール制"
 STATIC_MODIFIER_DESC_som_tur_timar_mod: "征服地の土地をシパーヒー騎兵への封土（ティマール）として分配することで、オスマン帝国は大規模な常備軍を財政的に維持することを可能にした。世襲でない点がヨーロッパ封建制と異なり、皇帝の管理下に置かれた土地は功績に応じて再分配された。"
 STATIC_MODIFIER_NAME_som_tur_sipahi_mod: "シパーヒー騎兵"
 STATIC_MODIFIER_DESC_som_tur_sipahi_mod: "ティマールを与えられた地方騎士・シパーヒーはオスマン軍の主力騎兵部隊を形成した。鎧と槍で武装した彼らの突撃は戦場での決定的な打撃力となり、バルカン半島からアナトリアまでの征服を支えた。"
 STATIC_MODIFIER_NAME_som_tur_eyalet_mod: "エヤレット制度"
 STATIC_MODIFIER_DESC_som_tur_eyalet_mod: "総督（ベイレルベイ）が治めるエヤレット（州）制度はオスマン帝国の広大な版図を効率的に統治する仕組みだ。各エヤレットは帝国の縮図として独自の軍事力・行政機構を持ち、スルタンの意志を地方に伝達する役割を担った。"
 STATIC_MODIFIER_NAME_som_tur_vizier_mod: "大宰相制度"
 STATIC_MODIFIER_DESC_som_tur_vizier_mod: "スルタンに次ぐ最高行政長官・大宰相が主宰する「ディヴァーン（帝国評議会）」が帝国の政策決定の中枢となった。崇高な門とも呼ばれるその府邸がヨーロッパでは「オスマン政府」の代名詞となり、外交交渉の相手方として認識された。"
 STATIC_MODIFIER_NAME_som_tur_bureaucracy_mod: "帝国官僚制"
 STATIC_MODIFIER_DESC_som_tur_bureaucracy_mod: "デヴシルメ出身者とトルコ・イスラム系官人が混在するオスマン帝国の複合官僚制は、当時世界で最も洗練された行政システムの一つだった。文書主義と中央集権的情報管理が広大な帝国の効率的な統治を支えた。"
 STATIC_MODIFIER_NAME_som_tur_mosque_mod: "スレイマニエ・モスク"
 STATIC_MODIFIER_DESC_som_tur_mosque_mod: "建築家スィナンが設計したスレイマニエ・モスクはオスマン建築の最高傑作だ。4本のミナレットと巨大なドームを持つこの壮麗な建築は、コンスタンティノープルの丘の上から帝国の栄光を全世界に示した。"
 STATIC_MODIFIER_NAME_som_tur_topkapi_mod: "トプカプ宮殿"
 STATIC_MODIFIER_DESC_som_tur_topkapi_mod: "ボスポラス・金角湾・マルマラ海を一望する岬に建つトプカプ宮殿は、400年間オスマン帝国の権力の中心として機能した。スルタンの居所・政府・ハレム・宝物庫を兼ねるこの複合施設が帝国統治の象徴となった。"
 STATIC_MODIFIER_NAME_som_tur_ulema_mod: "ウラマーの権威"
 STATIC_MODIFIER_DESC_som_tur_ulema_mod: "カーディー・ムフティー・マドラサ教師として帝国全土で活動するウラマーがスルタンの権威に宗教的正当性を与えた。シャリーアの解釈権を持つウラマーは帝国の道徳的・法的秩序の守護者として機能した。"
 STATIC_MODIFIER_NAME_som_tur_millet_mod: "ミッレト制度"
 STATIC_MODIFIER_DESC_som_tur_millet_mod: "ギリシャ正教・アルメニア・ユダヤの各宗教共同体が独自の自治機構を持つミッレト制度は、オスマン帝国が多様な非イスラム教徒の臣民を安定的に統治することを可能にした。各ミッレトの宗教的指導者がコミュニティを代表してスルタンと交渉した。"
 STATIC_MODIFIER_NAME_som_tur_kadi_mod: "カーディー裁判制度"
 STATIC_MODIFIER_DESC_som_tur_kadi_mod: "スルタンから直接任命されるカーディー（イスラム法裁判官）が帝国全土で法の支配を実現した。シジル（裁判台帳）に記録された無数の判決が後世に残る歴史的記録となり、当時のオスマン社会の実態を生き生きと伝えている。"
 STATIC_MODIFIER_NAME_som_tur_sufi_mod: "スーフィー文化"
 STATIC_MODIFIER_DESC_som_tur_sufi_mod: "メヴレヴィー・ベクタシー・ナクシュバンディーなどのスーフィー教団が帝国の宗教文化に深く根付いた。神秘主義的な霊性と芸術・詩・音楽の融合がオスマン文化の豊かさを形作り、異なる宗教・文化間の橋渡し役ともなった。"
 STATIC_MODIFIER_NAME_som_tur_synthesis_mod: "文化的融合"
 STATIC_MODIFIER_DESC_som_tur_synthesis_mod: "ビザンツ行政・アラブ学術・ペルシャ宮廷文化・トルコ軍事伝統の融合から生まれたオスマン文化は、多様な起源を持ちながらも独自の統一性を持つ文明を形成した。この文化的包容性が帝国の長期的安定と栄光の基盤となった。"
 STATIC_MODIFIER_NAME_som_tur_bursa_silk_trade: "ブルサ絹産業"
 STATIC_MODIFIER_DESC_som_tur_bursa_silk_trade: "オスマン帝国の最初の首都ブルサは14世紀から「絹の都市」として知られた。高品質の絹织物がヨーロッパ・中東に輸出され、ブルサの繁栄は帝国初期の経済的基盤となった。"
 STATIC_MODIFIER_NAME_som_tur_trade_empire_mod: "帝国交易路"
 STATIC_MODIFIER_DESC_som_tur_trade_empire_mod: "キャラバンサライの整備・街道の整備・海賊取り締まりによって帝国内の交易活動が活発化した。コンスタンティノープルを中心とする放射状の交易網が経済的統合をもたらした。"
 STATIC_MODIFIER_NAME_som_tur_istanbul_glory_mod: "世界の欲する都市"
 STATIC_MODIFIER_DESC_som_tur_istanbul_glory_mod: "イスタンブールは「世界の欲する都市」として古来から称えられてきた。オスマン征服後も世界最大かつ最も輝かしい都市の一つとして、アジアとヨーロッパをつなぐ唯一の橋として機能し続けた。"
 som_ottoman_events.50.t: "世界の欲する都市"
 som_ottoman_events.50.d: "コンスタンティノープル——いやイスタンブールはいまや真に「世界の欲する都市」となった。人口50万を超えるこの大都市は、ヨーロッパとアジアを結ぶ唯一の橋として機能し、全世界の商品が集まる地球上で最も重要な交易拠点だ。スレイマニエ・モスクの優美なシルエットとトプカプ宮殿の壮麗な姿がボスポラス海峡に映える。スルタンの宮廷では詩人・哲学者・建築家・科学者が競い合い、オスマン文明は絶頂を迎えた。この偉大な都市は百年後も千年後も、人類の遺産として輝き続けるだろう。"
 som_ottoman_events.50.a: "イスタンブールよ、永遠に輝け！"
 som_ottoman_events.50.breadbasket_tt: "都市特権「オスマン帝国のパン籠」が使用可能になった。穀倉がレベル5以上の都市ランク以上のロケーションに付与できる。"
 STATIC_MODIFIER_NAME_som_tur_constantinople_dev_mod: "コンスタンティニエの再開発"
 STATIC_MODIFIER_DESC_som_tur_constantinople_dev_mod: "メフメト2世の命による移住と再建が進み、新住民の声が市場に満ち、修復された石造りの建物が、かつての帝都に新たな輝きを取り戻させている。"
 STATIC_MODIFIER_NAME_som_tur_constantinople_splendor_mod: "コンスタンティニエの栄華"
 STATIC_MODIFIER_DESC_som_tur_constantinople_splendor_mod: "金角湾のまわりに新しい工房・隊商宿・市街が立ち並び、移住者と職人が都へ押し寄せ、背後の土地はかつてない実りをもたらしている。スルタンの都は、再び世に知られたあらゆる都市を凌ぐ輝きを放つ。"

 STATIC_MODIFIER_NAME_som_tur_trebizond_trade_mod: "トレビゾンドの交易拠点"
 STATIC_MODIFIER_DESC_som_tur_trebizond_trade_mod: "黒海南岸のトレビゾンドの港には、中央アジアやカスピ海から絹街道を下ってきた隊商の荷が積み上げられ、地中海へ向かう船を待っている。"
 STATIC_MODIFIER_NAME_som_tur_commercial_empire_mod: "商業帝国"
 STATIC_MODIFIER_DESC_som_tur_commercial_empire_mod: "アレッポ、アレクサンドリア、コンスタンティノープル——三つの大陸の富が、いまやスルタンの市場を通って流れている。"
 STATIC_MODIFIER_NAME_som_tur_grand_bazaar_loc_mod: "グランドバザールの整備"
 STATIC_MODIFIER_DESC_som_tur_grand_bazaar_loc_mod: "カパルチャルシュの屋根付きの通りには、金銀細工師や香辛料商人の声が絶えず響き、世界中の商品がここに集まっている。"

 som_ottoman_events.19.t: "スミルナの商業的運命"
 som_ottoman_events.19.d: "スミルナ（イズミル）はエーゲ海東岸最大の港市だ。古来よりギリシャ人植民者が開いたこの都市は、アナトリア内陸部と地中海を結ぶ交易の玄関口として繁栄してきた。オスマン帝国がこの都市を掌握した今、スミルナの将来をいかなる方向に導くか——活発な商業都市として商人を誘致するか、あるいは海軍力の増強に活用するか——スルタンの決断が問われる。"
 som_ottoman_events.19.a: "スミルナに商人街区を整備し、交易の中心地として発展させる"
 som_ottoman_events.19.b: "スミルナに造船所を建設し、エーゲ海における海軍力の足がかりとする"
 STATIC_MODIFIER_NAME_som_tur_anatolian_heartland_mod: "アナトリアの掌握"
 STATIC_MODIFIER_DESC_som_tur_anatolian_heartland_mod: "コニャからトレビゾンドまで、アナトリアの村々にスルタンの徴税官と役人が至り、帝国の支配が高原の隅々に及んでいる。"
 STATIC_MODIFIER_NAME_som_tur_crimea_dominance: "クリミアの制海権"
 STATIC_MODIFIER_DESC_som_tur_crimea_dominance: "カッファの港から黒海を見渡せば、オスマンの旗を掲げた船だけが波を切っている。黒海は「オスマンの湖」となりつつある。"

 STATIC_MODIFIER_NAME_som_tur_aleppo_learning_mod: "アレッポの学問"
 STATIC_MODIFIER_DESC_som_tur_aleppo_learning_mod: "アレッポはシリア最大の知的・文化的中心地だ。著名なマドラサ・図書館・学者がここに集まり、オスマン帝国がこの都市を掌握したことでアラブ世界の学術がオスマンに流入する。"
 STATIC_MODIFIER_NAME_som_tur_damascus_learning_mod: "ダマスカスの学問"
 STATIC_MODIFIER_DESC_som_tur_damascus_learning_mod: "ダマスカスは世界最古の継続する居住都市の一つだ。ウマイヤ朝以来のイスラム学術の蓄積を誇るこの都市の知的遺産がオスマン帝国に流入する。"
 STATIC_MODIFIER_NAME_som_tur_caliph_successor: "カリフの継承"
 STATIC_MODIFIER_DESC_som_tur_caliph_successor: "聖地の守護者となったスルタンの名は、いまや説教壇の上でカリフとして唱えられている。"
 STATIC_MODIFIER_NAME_som_tur_aegean_shipbuilding_mod: "エーゲ海の造船技術"
 STATIC_MODIFIER_DESC_som_tur_aegean_shipbuilding_mod: "エーゲ海の島々の船大工たちが、代々受け継いだ技をイスタンブールの造船所に持ち込み、艦船の竜骨が次々と据えられている。"

 som_ottoman_events.61.t: "マルジュ・ダービクの戦い"
 som_ottoman_events.61.d: "1516年、スルタン・セリム1世はアレッポ北方のマルジュ・ダービク平野でマムルーク朝スルタン・カーンスーフ・アル＝ガウリーの軍を壊滅させた。カーンスーフ自身が戦場で倒れ、シリア全土がオスマンの支配下に入った。カイロを占領した今、マムルーク朝の運命はオスマンの手の中にある。"
 som_ottoman_events.61.a: "マムルーク朝を和平によりエヤレットとして取り込む"
 som_ottoman_events.61.b: "和平を結び独立を認める"

 STATIC_MODIFIER_NAME_som_tur_edirne_trade_mod: "エディルネの交易拠点"
 STATIC_MODIFIER_DESC_som_tur_edirne_trade_mod: "エディルネ（ハドリアノポリス）はルメリアの交易の中心都市だ。バルカン半島と小アジアを結ぶこの都市が染料・絹・高級生地の生産拠点として整備され、オスマン帝国の初期財政を支える。"
 STATIC_MODIFIER_NAME_som_tur_novo_brdo_silver_mod: "ノヴォ・ブルドの銀山"
 STATIC_MODIFIER_DESC_som_tur_novo_brdo_silver_mod: "ノヴォ・ブルド（「新しい丘」）はバルカン半島最大の銀山を擁する都市だ。1450年代のオスマン征服後もその豊かな鉱山は帝国の財政に貢献し続けた。月次繁栄と人口増加も促進される。"

 STATIC_MODIFIER_NAME_som_tur_hungarian_march_mod: "ハンガリーの進軍"
 STATIC_MODIFIER_DESC_som_tur_hungarian_march_mod: "ブダが陥落し、ドナウを越えてウィーンに迫るオスマンの兵たちは、勝利の余韻のなかにも、ハプスブルクとの長い戦いの幕開けを感じ取っている。"
 STATIC_MODIFIER_NAME_som_tur_italy_north_mod: "イタリア半島の支配"
 STATIC_MODIFIER_DESC_som_tur_italy_north_mod: "ローマ、フィレンツェ、ミラノの広場に三日月の旗が翻り、ルネサンスの都の住民たちは新たな支配者の言葉を学び始めている。"
 STATIC_MODIFIER_NAME_som_tur_maghreb_mod: "マグレブの制海権"
 STATIC_MODIFIER_DESC_som_tur_maghreb_mod: "チュニスとアルジェの港に集うバルバリアの海賊船は、いまやスルタンの艦隊の一翼として西地中海を睥睨している。"


 som_tur_silk_road_revival: "シルクロードの復興"
 som_tur_silk_road_revival_desc: "タブリーズはペルシャと中央アジアを結ぶシルクロードの西端の要衝だ。イル・ハン国の首都として栄えたこの都市を掌握することで、オスマン帝国は絹・香辛料・宝石を運ぶシルクロードの交易を直接支配できる。黒海から中央アジアまでを結ぶ広大な交易網が復興し、帝国の商業力が飛躍的に高まる。"
 STATIC_MODIFIER_NAME_som_tur_silk_road_revival_mod: "シルクロードの復興"
 STATIC_MODIFIER_DESC_som_tur_silk_road_revival_mod: "タブリーズの市場から、中国の絹を積んだ隊商がイスタンブールへと続く道を再び行き交い、シルクロードは賑わいを取り戻している。"
 som_tur_city_of_worlds_desire_desc: "コンスタンティノープル——いやイスタンブールはいまや真に「世界の欲する都市」となった。人口50万を超えるこの大都市は、ヨーロッパとアジアを結ぶ唯一の橋として機能し、全世界の商品が集まる地球上で最も重要な交易拠点だ。この偉大な都市がオスマン帝国の中心として機能する今、かつてビザンツ帝国が誇った帝国のパン籠の権利がオスマン帝国でも利用可能となった。"

 som_tur_true_rome: "真のローマ帝国"
 som_tur_true_rome_desc: "バルカン・アナトリア・アラブ・エジプト・北アフリカ・イタリア——かつてローマ帝国が支配したほぼ全ての地がオスマンの旗の下に統一された。メフメト2世はコンスタンティノープル征服後に「カイセル（皇帝）」の称号を自ら名乗った。その遺志を受け継ぎ、今こそオスマン帝国が真のローマの後継者として歴史に刻まれる時だ。ユスティニアヌスのコルプス・ユリスを復活させ、水道システムを拡充し、広大な帝国を一つの法と文明で結べ。"
 STATIC_MODIFIER_NAME_som_tur_true_rome_mod: "真のローマ帝国"
 STATIC_MODIFIER_DESC_som_tur_true_rome_mod: "ローマの後継者を名乗る帝国のもとで、街道は整い、水道は拡充され、ユスティニアヌスの法典が新たな時代の法として蘇っている。"

 som_ottoman_mission_pack: "オスマン帝国の台頭"
 som_ottoman_mission_pack_DESCRIPTION:0 "1337年、アナトリア北西部の小さなトルコ系君候国として始まったオスマン朝。ブルサ・イズニク・イズミットという三都市を掌握したこの小国は、わずか数世代のうちにバルカン・アナトリア・アラブ世界・エジプト・北アフリカ・イタリアにまたがる大帝国へと変貌する。ガーズィー（聖戦士）の精神で国境を押し広げ、コンスタンティノープルを陥落させ、スレイマン大帝の黄金時代を実現せよ。そして——真のローマ帝国として歴史に君臨せよ。"
 som_ottoman_mission_pack_CRITERIA_DESCRIPTION:0 "オスマン帝国として、バルカン・アナトリア・アラブ・地中海を征服し、国内統治を整備し、スレイマン大帝の時代を実現せよ。"
 som_ottoman_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してオスマン帝国の台頭を完成させよ。"
 som_ottoman_mission_pack_BUTTON_DETAILS:0 "1337年の小君候国から世界帝国へ！"
