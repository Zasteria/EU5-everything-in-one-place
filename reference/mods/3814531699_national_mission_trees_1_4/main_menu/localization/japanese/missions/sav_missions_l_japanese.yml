l_japanese:
 sav_house_of_savoy_mission_pack: "サヴォイア家の野望"
 sav_house_of_savoy_mission_pack_DESCRIPTION:0 "アルプスの峠を支配するサヴォイア家は、ピエモンテの小公国からイタリア全土とフランス南部を制覇し、イタリア王国を築く運命を持つ。教皇派・皇帝派・フランスの狭間で巧みな外交を繰り広げながら、ジェノヴァを征服して海軍力を確立し、ロンバルディア・トスカーナ・ヴェネツィアを制圧してローマを手に入れよ。サルデーニャ・ピエモンテとして台頭し、最終的にはイタリア統一の旗手となれ。"
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION:0 "サヴォイアとしてピエモンテを統一し、イタリアとフランスを制覇してイタリア王国を樹立せよ。"
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してサヴォイア家の野望を実現せよ。"
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS:0 "アルプスを越え、イタリアを統一せよ！"

 sav_the_savoy_ambition: "サヴォイア家の野望"
 sav_the_savoy_ambition_desc: "サヴォイア家はアルプス山脈の要衝に位置するその領地から、イタリアとフランスの双方に影響力を持つ稀有な立場にある。ピエモンテの肥沃な土地とアルプス越えの交易路を掌握することで、この小さな公国が大国への道を歩み始める。"

 sav_unify_piedmont: "ピエモンテの統一"
 sav_unify_piedmont_desc: "サルッツォやモンフェラートといった独立的な勢力を取り込み、ピエモンテ全域を統一することが、サヴォイアの大きな野望の第一歩となる。"

 sav_glory_of_turin: "トリノの栄光"
 sav_glory_of_turin_desc: "ピエモンテの中心都市トリノを繁栄させ、サヴォイア家の首都に相応しい偉容を持つ都市へと発展させよ。"

 sav_shroud_of_turin: "トリノの聖骸布"
 sav_shroud_of_turin_desc: "キリストの聖骸布とされるリネンの布はトリノの大聖堂に安置されている。この聖遺物への信仰が王国の財政と威信をもたらしている。"

 sav_alpine_roads: "アルプスの街道"
 sav_alpine_roads_desc: "アルプスを越える交易路に道路インフラを整備することで、フランス・イタリア間の商人がサヴォイアを通過する際の利益が増大する。"

 sav_crossroads_of_europe: "ヨーロッパの十字路"
 sav_crossroads_of_europe_desc: "ピエモンテはジェノヴァ、ヴェネツィア、フランスを繋ぐ交易路の中継点として、ヨーロッパ随一の商業的な要衝となりつつある。"

 sav_order_of_saints_maurice: "聖マウリティウスと聖ラザロの騎士団"
 sav_order_of_saints_maurice_desc: "サヴォイア家が創設した「聖マウリティウスと聖ラザロの騎士団」は、カトリック世界における宗教的権威と正統性の象徴となる。"

 sav_savoy_academy: "サヴォイア・アカデミー"
 sav_savoy_academy_desc: "ルネサンスの精神を受け入れ、トリノを中心に学術機関を整備することで、サヴォイアはイタリア文化圏の一員として確固たる地位を築く。"

 sav_alpine_powerhouse: "アルプスの強国"
 sav_alpine_powerhouse_desc: "ピエモンテの統一と文化的発展、経済力の充実によって、サヴォイアはアルプスを中心とする強国として認められるに至った。"

 sav_alpine_fortifications: "アルプスの要塞"
 sav_alpine_fortifications_desc: "アルプス山脈の自然の険しさを最大限に活かし、戦略的な要所に堅固な要塞を構築することで、サヴォイアは難攻不落の山岳国家となる。"

 sav_diplomatic_balance: "外交的均衡"
 sav_diplomatic_balance_desc: "大国の間に挟まれたサヴォイアが生き残るには、外交の才が不可欠だ。高い外交的評価を維持することで、強大な隣国からの圧力を巧みにかわす。"

 sav_savoyard_army: "サヴォイアの精鋭軍"
 sav_savoyard_army_desc: "アルプスの険しい地形で鍛えられたサヴォイアの兵は、ヨーロッパ随一の山岳戦士として名を馳せている。常備軍の整備が王国の軍事的自立を支える。"

 sav_conquer_genoa: "ジェノヴァの征服"
 sav_conquer_genoa_desc: "地中海屈指の海洋都市ジェノヴァを征服することで、サヴォイアは内陸国家から脱却し、地中海に直接アクセスする海洋大国への第一歩を踏み出す。"

 sav_nice_naval_base: "ニースの海軍基地"
 sav_nice_naval_base_desc: "地中海岸のニースに海軍基地を設けることで、サヴォイアはティレニア海での制海権を確立する足がかりを得る。"

 sav_sardinia_union: "サルデーニャとの統合"
 sav_sardinia_union_desc: "サルデーニャ島の大部分を掌握し、「サルデーニャ王国」の称号を得ることで、サヴォイア家はイタリアの主要な王家の一員として認められる。"

 sav_seize_lombardy: "ロンバルディアの制圧"
 sav_seize_lombardy_desc: "ミラノを中心とするロンバルディアを支配下に置くことで、サヴォイアは北イタリアの覇者となる。"

 sav_push_tuscany: "トスカーナへの進出"
 sav_push_tuscany_desc: "フィレンツェをはじめとするトスカーナの豊かな都市国家群を制圧し、ルネサンス文化の中心地をサヴォイアの版図に加える。"

 sav_capture_venice: "ヴェネツィアの掌握"
 sav_capture_venice_desc: "アドリア海の女王ヴェネツィアを征服することで、サヴォイアはイタリア北部の海洋覇権を確立する。"

 sav_emilia_and_beyond: "エミリアを越えて"
 sav_emilia_and_beyond_desc: "エミリア地方を掌握し、北イタリアの残余の地を支配下に収めることで、サヴォイアの覇権は確固たるものとなる。"

 sav_march_on_naples: "ナポリへの進軍"
 sav_march_on_naples_desc: "イタリア南部の重要都市ナポリを征服し、半島全体の支配を完成に近づける。"

 sav_eternal_rome: "永遠の都ローマ"
 sav_eternal_rome_desc: "ローマを制することがイタリアを制することだ。永遠の都を手中に収めたサヴォイアは、イタリアの正統な支配者としての権威を世界に示す。"

 sav_integrate_geneva: "ジュネーヴの統合"
 sav_integrate_geneva_desc: "スイス連邦との結びつきが強いジュネーヴをサヴォイアの完全な支配下に置き、北方への拡張の足がかりとする。"

 sav_control_provence: "プロヴァンスの掌握"
 sav_control_provence_desc: "地中海沿岸のプロヴァンスを掌握することで、サヴォイアはフランス南部での覇権を確立し、より大きな野望への道を開く。"

 sav_against_the_swiss: "スイスへの挑戦"
 sav_against_the_swiss_desc: "独立を誇るスイス連邦を押さえ込み、西スイス地方を掌握することで、サヴォイアはライン川以西の支配者となる。"

 sav_conquer_burgundy: "ブルゴーニュの征服"
 sav_conquer_burgundy_desc: "かつてブルゴーニュ公国が支配した豊かな地を制圧し、フランスへの侵攻への道を開く。"

 sav_savoyard_occitania: "サヴォイアのオクシタニア"
 sav_savoyard_occitania_desc: "オクシタン語の地域を掌握し、南フランス全体をサヴォイアの文化圏に取り込む。"

 sav_claim_france: "フランスの征服"
 sav_claim_france_desc: "フランス王国の都パリを制し、かつてサヴォイアを脅かした強国フランスを逆に配下に収める時が来た。"

 sav_kingdom_of_italy: "イタリア王国"
 sav_kingdom_of_italy_desc: "サヴォイア家はアルプスの峠を越えてイタリア全土を統一し、かつてのローマ帝国の後継者として「イタリア王国」を建国した。リソルジメントの夢がここに実現した。"
 STATIC_MODIFIER_NAME_sav_unified_piedmont_mod: "ピエモンテの統一"
 STATIC_MODIFIER_DESC_sav_unified_piedmont_mod: "ピエモンテ（「山の麓」の意）はアルプスとアペニン山脈に囲まれた肥沃な平野で、サヴォイア・モンフェラート・サルッツォなどの諸侯が割拠した。これらを統一することで初めてサヴォイアはアルプスとポー川を結ぶ交通の要衝を完全に掌握できる。"

 STATIC_MODIFIER_NAME_sav_shroud_of_turin_mod: "聖骸布の加護"
 STATIC_MODIFIER_DESC_sav_shroud_of_turin_mod: "トリノの聖骸布はキリストが磔刑後に包まれたとされるリネンの布で、人体の陰影が焼き付いたように見える。1353年にサヴォイア家が入手して以来カトリック世界最大の聖遺物の一つとして崇拝された。科学的な真偽論争は続くが、その宗教的・政治的影響力は疑いようがない。"
 STATIC_MODIFIER_NAME_sav_alpine_roads_mod: "アルプスの街道"
 STATIC_MODIFIER_DESC_sav_alpine_roads_mod: "サン・ベルナール峠・モン・スニ峠・サン・ゴタール峠——アルプスを越えるルートはローマ時代から中世を通じてヨーロッパ最重要の交通路だった。この峠道を支配するサヴォイアは通行料と交易の恩恵で莫大な富を得た。「アルプスの門番」の役割こそサヴォイア繁栄の根源だ。"
 STATIC_MODIFIER_NAME_sav_crossroads_mod: "ヨーロッパの十字路"
 STATIC_MODIFIER_DESC_sav_crossroads_mod: "ピエモンテはフランス・スイス・ジェノヴァ・ミラノを繋ぐ交差点に位置する。シャンパーニュの大市に向かうイタリア商人、ローマに向かうフランスの巡礼者、スイスへ向かう傭兵——あらゆる人と物がピエモンテを通過し、サヴォイアは通行を管理することで「中間者の利益」を独占した。"
 STATIC_MODIFIER_NAME_sav_order_of_saints_mod: "聖マウリティウスと聖ラザロの騎士団"
 STATIC_MODIFIER_DESC_sav_order_of_saints_mod: "聖マウリティウスと聖ラザロの騎士団はサヴォイア家がそれぞれ1434年と1572年に創設した二つの騎士団を統合したものだ。聖マウリティウスはローマ時代のキリスト教殉教者、聖ラザロはらい病（ハンセン病）の守護聖人として崇拝された。この騎士団はカトリック世界におけるサヴォイア家の宗教的権威の象徴となった。"
 STATIC_MODIFIER_NAME_sav_savoy_academy_mod: "サヴォイア・アカデミーの薫陶"
 STATIC_MODIFIER_DESC_sav_savoy_academy_mod: "ルネサンス期のサヴォイア公国は学芸の後援者として知られた。1404年創設のトリノ大学はピエモンテの知的中心となり、法学・医学・神学を教えた。後にカルロ・エマヌエーレ1世が創設するアカデミア・デッレ・ベッレ・アルティの前身となる芸術支援の伝統もこの時代に根ざしている。"
 STATIC_MODIFIER_NAME_sav_alpine_powerhouse_mod: "アルプスの強国"
 STATIC_MODIFIER_DESC_sav_alpine_powerhouse_mod: "「小さいが強い」——サヴォイアの強さはその地理的位置の賢明な活用にあった。フランス・オーストリア・スペインという大国に囲まれながら、巧みな外交と地の利を活かした軍事戦略で生き残り、最終的にイタリア統一の主役となった「運命の王朝」だ。"
 STATIC_MODIFIER_NAME_sav_alpine_fortifications_mod: "アルプスの要塞"
 STATIC_MODIFIER_DESC_sav_alpine_fortifications_mod: "アルプスの天然の要害にブリアンソン・フェネストレッレ・エクシルなどの要塞群を配置することでサヴォイアは「アルプスの盾」を形成した。17〜18世紀にはヴォーバン式稜堡要塞がこれらの峠を守るようになり、サヴォイアはヨーロッパで最も難攻不落の国家の一つとなった。"
 STATIC_MODIFIER_NAME_sav_diplomatic_balance_mod: "外交的均衡"
 STATIC_MODIFIER_DESC_sav_diplomatic_balance_mod: "サヴォイア外交の真髄は「いつも強い側につく」ことだった。フランスとオーストリアの間で綱渡りを繰り返し、ユトレヒト条約（1713年）ではサルデーニャ島を獲得して王国に昇格した。ヴィットーリオ・アメデーオ2世はこの「バランサー」外交の頂点を体現した君主だ。"
 STATIC_MODIFIER_NAME_sav_savoyard_army_mod: "サヴォイアの精鋭"
 STATIC_MODIFIER_DESC_sav_savoyard_army_mod: "サヴォイアの兵士はアルプスの険しい地形で鍛えられた山岳戦の達人だ。14〜15世紀のピエモンテ兵制改革では「オルディナンツァ・ピエモンテーゼ」（ピエモンテ式軍規）が確立され、規律ある歩兵戦術がサヴォイア軍の強みとなった。後のリソルジメント期にも彼らは北イタリア解放の主力となった。"
 STATIC_MODIFIER_NAME_sav_conquer_genoa_mod: "ジェノヴァの掌握"
 STATIC_MODIFIER_DESC_sav_conquer_genoa_mod: "ジェノヴァはヴェネツィアと覇を争った中世地中海最大の海洋都市国家の一つで、黒海・北アフリカ・イベリア半島に広大な商業ネットワークを張り巡らせた。銀行業（聖ジョルジョ銀行は世界最古の銀行の一つ）と保険業の発祥地でもある。この「誇り高き共和国」を征服することはサヴォイアに地中海への扉を開く。"
 STATIC_MODIFIER_NAME_sav_nice_naval_base_mod: "ニースの海軍基地"
 STATIC_MODIFIER_DESC_sav_nice_naval_base_mod: "ニース（ニッツァ・マリッティマ）は古代ギリシャのマッサリア（マルセイユ）の植民地として建設された地中海の古港だ。サヴォイア家が1388年に獲得して以来、フランスとイタリアの境界に位置するこの港はサヴォイア唯一の海軍基地として機能し続けた（1860年までサヴォイア領だった）。"
 STATIC_MODIFIER_NAME_sav_sardinia_union_mod: "サルデーニャ統合"
 STATIC_MODIFIER_DESC_sav_sardinia_union_mod: "1720年のユトレヒト条約の調整でサヴォイア家はシチリアとサルデーニャを交換し、「サルデーニャ王国」として台頭した。この島嶼部と大陸部ピエモンテの合体は、後にカミッロ・カヴールとガリバルディがイタリア統一（1861年）を達成する母体となった。"
 STATIC_MODIFIER_NAME_sav_seize_lombardy_mod: "ロンバルディアの制圧"
 STATIC_MODIFIER_DESC_sav_seize_lombardy_mod: "ロンバルディア平野はヨーロッパ最肥沃な農業地帯の一つであり、ミラノを中心とする工業・商業の集積地だ。オーストリアに奪われ続けたこの豊かな地を取り戻すことはリソルジメント（イタリア統一運動）の核心的課題であり、サヴォイアの夢の具体的形だ。"
 STATIC_MODIFIER_NAME_sav_push_tuscany_mod: "トスカーナ進出"
 STATIC_MODIFIER_DESC_sav_push_tuscany_mod: "フィレンツェを中心とするトスカーナはルネサンス文化の発祥地として人類史上最高の芸術的遺産を持つ。メディチ家が育てたウフィツィ美術館・ドゥオーモ・ダンテの詩——この文化的宝庫を版図に加えることはサヴォイア王国に精神的権威をもたらす。"
 STATIC_MODIFIER_NAME_sav_capture_venice_mod: "ヴェネツィアの掌握"
 STATIC_MODIFIER_DESC_sav_capture_venice_mod: "「アドリア海の女王」ヴェネツィアは1000年以上にわたって独立を守った奇跡の都市国家だ。潟の中島に築かれた運河の都は東方交易の独占と卓越した造船技術（アルセナーレ）で地中海の覇者に君臨した。この不落の都市を征服することは歴史上の偉業だ。"
 STATIC_MODIFIER_NAME_sav_emilia_and_beyond_mod: "エミリアを越えて"
 STATIC_MODIFIER_DESC_sav_emilia_and_beyond_mod: "エミリア街道（ヴィア・エミリア）沿いに連なるボローニャ・パルマ・モデナ・フェラーラは中世から食・文化・学術の中心地として知られた。ボローニャはヨーロッパ最古の大学（1088年創設）の所在地であり、その知的伝統はサヴォイア王国の文化的深みを増す。"
 STATIC_MODIFIER_NAME_sav_march_on_naples_mod: "ナポリへの進軍"
 STATIC_MODIFIER_DESC_sav_march_on_naples_mod: "「ナポリを見てから死ね」と言われるほど美しいこの都市は、地中海最大の都市の一つとして古代から栄えた。アンジュー・アラゴン・スペイン・ブルボンと支配者が変わる激動の歴史を経たナポリは、イタリア統一において最後の難関となった。"
 STATIC_MODIFIER_NAME_sav_eternal_rome_mod: "永遠の都"
 STATIC_MODIFIER_DESC_sav_eternal_rome_mod: "「すべての道はローマに通ず」——古代ローマ帝国の首都、カトリック教会の本拠地、ルネサンス文化の中心地として、ローマは西洋文明の象徴だ。コロッセオ・パンテオン・サン・ピエトロ大聖堂——これほどの歴史的重みを持つ都市を首都とすることはイタリア統一の完成を意味する。"
 STATIC_MODIFIER_NAME_sav_integrate_geneva_mod: "ジュネーヴ統合"
 STATIC_MODIFIER_DESC_sav_integrate_geneva_mod: "ジュネーヴはかつてサヴォイア伯の影響下にあったが、1536年にジャン・カルヴァンが宗教改革の拠点とし「プロテスタントのローマ」となった。この湖畔の都市を再統合することはサヴォイアのスイス方面への拡張の重要な足がかりとなる。"
 STATIC_MODIFIER_NAME_sav_control_provence_mod: "プロヴァンス掌握"
 STATIC_MODIFIER_DESC_sav_control_provence_mod: "プロヴァンスはかつてアンジュー家の領土であり、ルネ王の死後（1480年）フランス王家に編入された。地中海岸のラヴェンダー畑・オリーブ畑・ブドウ園——この豊かな南フランスの地はサヴォイアの版図を大きく広げる要となる。"
 STATIC_MODIFIER_NAME_sav_against_the_swiss_mod: "スイスへの挑戦"
 STATIC_MODIFIER_DESC_sav_against_the_swiss_mod: "スイス連邦はブルゴーニュ公シャルル突進公を1476〜1477年のグランソン・ムルテンの戦いで破った無敵の山岳戦士の国だ。この強大な隣人を制圧することは軍事的に容易ではないが、スイス傭兵（ランツクネヒト）を宮廷警護に使ったサヴォイアにとって、その本国を支配することは最大の軍事的勝利となる。"
 STATIC_MODIFIER_NAME_sav_conquer_burgundy_mod: "ブルゴーニュ征服"
 STATIC_MODIFIER_DESC_sav_conquer_burgundy_mod: "ブルゴーニュはヴァロワ朝の分家として最盛期にはネーデルラントからブルゴーニュまで広大な「中間王国」を支配した。シャルル突進公の死（1477年）でフランスに再吸収されたが、このワインと美食で名高い豊かな地方を掌握することはフランス侵攻の重要な拠点となる。"
 STATIC_MODIFIER_NAME_sav_savoyard_occitania_mod: "サヴォイアのオクシタニア"
 STATIC_MODIFIER_DESC_sav_savoyard_occitania_mod: "オクシタン語を話す南フランスの民はトルバドゥール（吟遊詩人）の文化を生み出したが、13世紀のアルビジョワ十字軍で壊滅的な打撃を受けた。カタリ派への弾圧とフランス王家の支配の下で埋もれていったオクシタニアの自治の伝統をサヴォイアの旗の下で復活させる。"
 STATIC_MODIFIER_NAME_sav_claim_france_mod: "フランス征服"
 STATIC_MODIFIER_DESC_sav_claim_france_mod: "フランスはサヴォイアにとって常に脅威であり魅力でもあった。ナポレオン（コルシカ出身だがニースの隣人）の時代にはサヴォイアがフランスに飲み込まれる歴史があった。しかし今はその逆——フランス王の玉座をサヴォイアが奪う壮大な逆転劇だ。"
 STATIC_MODIFIER_NAME_sav_kingdom_of_italy_mod: "イタリア王国"
 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "1861年3月17日、ヴィットーリオ・エマヌエーレ2世（サルデーニャ王）が「イタリア王国」の初代国王として即位した——これが現実の歴史だ。カヴールの外交・ガリバルディの軍事・マッツィーニの理念が融合した19世紀最大の政治的奇跡を、このゲームでは400年早く実現する。"
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "トリノの栄光"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "「ノワール大通り（Il Balon）」の青空市場、バローロとバルバレスコの産地ランゲ丘陵、ピアッツァ・サン・カルロの絢爛たる広場——トリノはサヴォイア家がイタリア随一の計画都市として整備した都だ。ローマのグリッド状都市計画（Augusta Taurinorum）を受け継ぐこの都市はアルプスの南で最も洗練された姿を誇る。"

 sav_events.1.t: "サヴォイア家の野望"
 sav_events.1.d: "アルプス山脈の南北を繋ぐ要衝に位置するサヴォイア公国。フランスとイタリアの二つの世界を股にかけるこの小国は、今や大きな野望に目覚めようとしている。サヴォイア家の紋章——白い十字架と赤い盾——は、いずれイタリア全土に翻るだろう。ピエモンテを統一し、ジェノヴァを征服し、ローマを制し、そしてイタリア王国を建国する——サヴォイアの千年の夢が始まろうとしている。"
 sav_events.1.a: "サヴォイア家の栄光を掲げよ！"

 sav_events.2.t: "トリノの栄光"
 sav_events.2.d: "ピエモンテの中心都市トリノは、サヴォイア家の支配の下で急速な発展を遂げている。宮殿や教会が建ち並び、学者や芸術家が集まるこの都市は、北イタリアの文化・政治の中心地として台頭しつつある。サヴォイア家の首都に相応しい偉容を持つトリノの発展は、王国全体の繁栄の礎となるだろう。"
 sav_events.2.a: "トリノこそがサヴォイア家の輝ける都だ"

 sav_woolens_of_piedmont: "ピエモンテのウール工業"
 sav_woolens_of_piedmont_desc: "ピエモンテはイタリア有数のウール・生地産地として知られている。良質な羊毛の生産と生地の加工は、サヴォイアの商業的富の基盤となる。"

 sav_nebbiolo_vineyards: "ネッビオーロのぶどう畑"
 sav_nebbiolo_vineyards_desc: "ピエモンテのランゲ丘陵で育つネッビオーロ種のぶどうは、バローロやバルバレスコなど名高いワインの原料となる。ピエモンテのワインはヨーロッパ各地に輸出され、大きな利益をもたらす。"

 sav_casa_savoia: "サヴォイア家の権威"
 sav_casa_savoia_desc: "サヴォイア家の統治が安定し、その権威は国内外に広く認められるようになった。正統性の高い統治と国内の安定こそが、サヴォイアをイタリアの強国へと押し上げる礎となる。"

 sav_ordinanza_piedmontese: "ピエモンテ歩兵の軍規"
 sav_ordinanza_piedmontese_desc: "15世紀、サヴォイアはアルプス山岳地帯で鍛えた独自の歩兵戦術「オルディナンツァ・ピエモンテーゼ」を確立した。槍衾を中心とする規律ある戦列歩兵がサヴォイアの軍事的強さの根幹となる。"

 sav_university_of_turin: "トリノ大学"
 sav_university_of_turin_desc: "1404年に設立されたトリノ大学は、ピエモンテの学術的中心地として法学・医学・神学を教える。サヴォイアの知的遺産がルネサンス文化の開花を支えている。"

 sav_corsica_seized: "コルシカ島の掌握"
 sav_corsica_seized_desc: "ジェノヴァが長く支配してきたコルシカ島を手中に収めることで、サヴォイアはティレニア海西部における制海権を大きく前進させる。"

 sav_towers_of_sardinia: "サルデーニャの見張り塔"
 sav_towers_of_sardinia_desc: "中世以来、サルデーニャ島の海岸線には無数の見張り塔（トッレ・コスティエーラ）が建ち並んでいる。この防衛施設を整備・強化し、海賊の侵入からサルデーニャを守る。"

 sav_cagliari_development: "カリャリの発展"
 sav_cagliari_development_desc: "サルデーニャ島の首府カリャリを発展させ、地中海西部における重要な港湾都市・交易拠点へと育て上げる。"

 sav_tyrrhenian_sea: "ティレニア海の覇者"
 sav_tyrrhenian_sea_desc: "コルシカ・サルデーニャの両島を掌握し、強大な艦隊を整備したサヴォイアは、ティレニア海の制海権を完全に掌握した。地中海西部の貿易はサヴォイアの庇護の下に置かれる。"

 sav_languedoc: "ラングドックの支配"
 sav_languedoc_desc: "南フランスの要衝ラングドックを手中に収める。モンペリエとトゥールーズという二大都市の掌握は、南フランス全体の支配への足がかりとなる。"

 sav_gascony: "ガスコーニュの掌握"
 sav_gascony_desc: "ボルドーを中心とするガスコーニュは、大西洋に面した豊かなワイン産地だ。イングランドとの長い歴史的関係を断ち切り、この地をサヴォイアの版図に加える。"

 sav_lyon_gateway: "リヨンの関門"
 sav_lyon_gateway_desc: "ローヌ川とソーヌ川の合流点に位置するリヨンは、南フランスと北フランスを繋ぐ交易の要衝だ。この都市を掌握することで、フランス内陸部への進出路が開ける。"

 sav_loire_valley: "ロワール渓谷"
 sav_loire_valley_desc: "「フランスの庭園」と呼ばれるロワール渓谷は、かつてフランス王家の居城が立ち並んだ地だ。ナントとトゥールの掌握は、フランス中西部の制圧を意味する。"

 sav_normandy_coast: "ノルマンディーの海岸"
 sav_normandy_coast_desc: "かつてノルマン人が上陸した歴史的な海岸ノルマンディーを掌握する。ルーアンを中心とするこの豊かな地はフランス北部の要衝であり、パリへの最後の障壁だ。"

 STATIC_MODIFIER_NAME_sav_woolens_of_piedmont_mod: "ピエモンテのウール工業"
 STATIC_MODIFIER_DESC_sav_woolens_of_piedmont_mod: "ピエモンテはアルプスの高原牧草地で育つ羊の優れた羊毛産地だった。特にビエッラ地方は中世から現代に至るまでヨーロッパ最高峰の羊毛・高級布地の産地として知られ、「ピエモンテの羊毛」はイングランド産と並ぶ最高品質の証明だった。"
 STATIC_MODIFIER_NAME_sav_nebbiolo_vineyards_mod: "ネッビオーロのぶどう畑"
 STATIC_MODIFIER_DESC_sav_nebbiolo_vineyards_mod: "ピエモンテのランゲ丘陵で育つネッビオーロ種からは「バローロ（ワインの王）」と「バルバレスコ（王妃のワイン）」が生まれる。このブドウの栽培の記録は13世紀まで遡り、サヴォイア宮廷でも珍重されたピエモンテの誇りだ。現代でもイタリアワインの頂点として世界中で愛飲される。"
 STATIC_MODIFIER_NAME_sav_casa_savoia_mod: "サヴォイア家の権威"
 STATIC_MODIFIER_DESC_sav_casa_savoia_mod: "サヴォイア家はヨーロッパで最も長い歴史を持つ王朝の一つで、11世紀のウンベルト白眼公（ビアンカマーノ）を始祖とする。「最も古い王朝」として700年以上にわたって命脈を保ち続け、最終的にイタリア王国の王家となったその歴史は欧州王家史上稀な持続力を示している。"
 STATIC_MODIFIER_NAME_sav_ordinanza_piedmontese_mod: "ピエモンテ歩兵の軍規"
 STATIC_MODIFIER_DESC_sav_ordinanza_piedmontese_mod: "15世紀にサヴォイア公国が整備した「オルディナンツァ・ピエモンテーゼ」は槍衾（パイク）歩兵を中心とする規律ある常備軍制度だ。スイス傭兵の戦術を参考にしつつ独自の改良を加えたこの軍制は、後のサルデーニャ王国軍の基礎となり、リソルジメント期の統一戦争を戦う軍隊の先駆けとなった。"
 STATIC_MODIFIER_NAME_sav_university_of_turin_mod: "トリノ大学の薫陶"
 STATIC_MODIFIER_DESC_sav_university_of_turin_mod: "1404年に創設されたトリノ大学は北イタリアでもっとも古い大学の一つだ。法学・医学・神学の三学部から始まったこの大学は、その後チェーザレ・ベッカリーア（刑法改革者）・ラグランジュ（数学者）などの傑出した知性を輩出し、啓蒙主義のピエモンテを支える知的中枢となった。"
 STATIC_MODIFIER_NAME_sav_corsica_seized_mod: "コルシカ掌握"
 STATIC_MODIFIER_DESC_sav_corsica_seized_mod: "コルシカ島はジェノヴァが1284年以来支配してきた西地中海の要衝だ。1768年にジェノヴァがフランスに売却したことで翌年ナポレオン・ボナパルトが「フランス人」として生まれた——歴史のアイロニーだ。この島を掌握することはティレニア海西部の制海権を確保する要になる。"
 STATIC_MODIFIER_NAME_sav_towers_of_sardinia_mod: "サルデーニャの見張り塔"
 STATIC_MODIFIER_DESC_sav_towers_of_sardinia_mod: "サルデーニャ島の海岸線には中世から近世にかけて建設された「トッレ・コスティエーラ（沿岸の塔）」が点在する。バルバリア海賊の侵略を監視するために整備されたこの防衛システムは最盛期に100以上の塔を数え、島民に危険を知らせる警報ネットワークとして機能した。"
 STATIC_MODIFIER_NAME_sav_cagliari_development_mod: "カリャリの繁栄"
 STATIC_MODIFIER_DESC_sav_cagliari_development_mod: "カリャリ（Karalis）はフェニキア人が建設した港湾都市でローマ時代も重要な行政拠点だった。地中海の中央に位置するサルデーニャの首府として、チュニジア・スペイン・イタリアとの交易拠点となり、アラゴン支配下でも西地中海交易の要衝として機能し続けた。"
 STATIC_MODIFIER_NAME_sav_tyrrhenian_sea_mod: "ティレニア海の覇者"
 STATIC_MODIFIER_DESC_sav_tyrrhenian_sea_mod: "ティレニア海はイタリア半島・シチリア・コルシカ・サルデーニャに囲まれた地中海の内海で、古代フェニキア人・ギリシャ人・ローマ人が交易した歴史の海だ。コルシカとサルデーニャを掌握することでこの内海を丸ごと支配下に置くことができ、東地中海への進出の根拠地となる。"
 STATIC_MODIFIER_NAME_sav_languedoc_mod: "ラングドック支配"
 STATIC_MODIFIER_DESC_sav_languedoc_mod: "ラングドック（「オック語の国」の意）は南フランスのオクシタン語圏を指す。トゥールーズを首府とするこの地方は13世紀のアルビジョワ十字軍でフランス王家に征服されるまで独自の文化・政治・宗教（カタリ派）を誇った。その残り火はプロヴァンスとともに南フランス固有の文明圏として輝き続けている。"
 STATIC_MODIFIER_NAME_sav_gascony_mod: "ガスコーニュ掌握"
 STATIC_MODIFIER_DESC_sav_gascony_mod: "ガスコーニュはバスク人に起源を持つ南西フランスの地方で、ボルドーの大西洋ワイン交易・バイヨンヌの港・アルマニャックのブランデーで知られる。エレアノール・オブ・アクイテーニュが嫁いだことでイングランドと縁深いこの地方は百年戦争最後の主戦場にもなった。"
 STATIC_MODIFIER_NAME_sav_lyon_gateway_mod: "リヨンの関門"
 STATIC_MODIFIER_DESC_sav_lyon_gateway_mod: "リヨン（ルグドゥヌム）はローマ帝国のガリア属州の首都として建設された交通の要衝だ。中世にはシャンパーニュの大市に次ぐフランス最大の定期市が開かれ、イタリア・フランドル・ドイツの商人が集った。ローヌ川とソーヌ川の合流点というその立地は地理的必然として交易都市としての地位を保証した。"
 STATIC_MODIFIER_NAME_sav_loire_valley_mod: "ロワール渓谷"
 STATIC_MODIFIER_DESC_sav_loire_valley_mod: "「フランスの庭園」と呼ばれるロワール渓谷にはシャンボール・シュノンソー・アンボワーズなどのルネサンス様式城館が並ぶ。15〜16世紀のフランス国王がこの地を好んだのはパリより温暖な気候と豊かな食材、そして防衛上の安全性があったからだ。この美しい地を制することはフランス文化の中心を握ることを意味する。"
 STATIC_MODIFIER_NAME_sav_normandy_coast_mod: "ノルマンディー海岸"
 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "ノルマンディーはヴァイキング（北方人＝ノルマン人）が911年にフランス王から授かった地だ。1066年のウィリアム征服王のイングランド侵攻・百年戦争の最大の戦場・1944年のDデイ上陸作戦——この地は常に歴史の転換点となってきた。ルーアンはジャンヌ・ダルクが処刑された地でもある。"

 sav_events.3.t: "サルデーニャ・ピエモンテの形成"
 sav_events.3.d: "サルデーニャ島のほぼ全域を掌握したサヴォイア家は、「サルデーニャ国王」の称号を正式に採用することを決定した。1720年（史実）にはサヴォイアがスペイン継承戦争の結果としてサルデーニャ島を獲得し、「サルデーニャ王国」が成立した。このサルデーニャ・ピエモンテという二重王国は、後にイタリア統一の母体となる国家だ。大陸側のピエモンテと島嶼部のサルデーニャを統合したこの王国は、北イタリアの強国として台頭していく。"
 sav_events.3.a: "サルデーニャ王として、イタリア統一の旗手となれ！"

 sav_franchises: "サヴォイア式フランシーズ"
 sav_franchises_desc: "中世ピエモンテにおいて、サヴォイア家は「フランシーズ」と呼ばれる都市権利を各都市に付与した。移住の自由・農民の参政権・市民の交易権拡大を保証するこの制度は、都市間競争を刺激してピエモンテを経済的に活性化させる。ミッション達成により「サヴォイア式フランシーズ」都市権利を各ロケーションに付与できるようになる。"
 sav_franchises_unlock_tt: "都市特権「フランシーズ」が使用可能になる。"

 sav_patria_legis: "サヴォワ・ヴァル・ダオスタ"
 sav_patria_legis_desc: "ヴァル・ダオスタ地方の伝統的な自治慣行とサヴォイア家の統治理念を融合させた「パトリア法」は、ルネサンスの精神を反映した合理的な法体系だ。都市の繁栄・社会的流動性・農業と商業の生産性向上をもたらす。ミッション達成により「サヴォワ・ヴァル・ダオスタ」都市権利を各ロケーションに付与できるようになる。"
 sav_patria_legis_unlock_tt: "都市特権「パトリア法」が使用可能になる。"


 franchises: "フランシーズ"
 franchises_desc: "サヴォイア家が制定したフランシーズ都市権利。POPの移住の自由・農民の参政権・市民の交易権拡大を保証する。"
 patria_legis: "パトリア法"
 patria_legis_desc: "ヴァル・ダオスタの伝統とサヴォイア家の法理念を融合させた都市権利。都市の繁栄・社会的流動性・生産効率の向上をもたらす。"
