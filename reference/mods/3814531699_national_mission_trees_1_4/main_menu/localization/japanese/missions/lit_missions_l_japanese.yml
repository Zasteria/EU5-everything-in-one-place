l_japanese:
 lit_lithuania_mission_pack: "バルトから黒海へ"
 lit_lithuania_mission_pack_DESCRIPTION:0 "1337年、ゲディミナス大公のリトアニアは東欧最大の可能性を秘めた大公国だ。チュートン騎士団を打倒し、ルーシを征服し、黒海まで達し、ポーランドとのコモンウェルスを形成せよ——そして信仰の選択でリトアニアの魂を決めよ。"
 lit_lithuania_mission_pack_CRITERIA_DESCRIPTION:0 "バルトから黒海まで征服し、ポーランドとのコモンウェルスを形成してリトアニア大帝国を建設せよ。"
 lit_lithuania_mission_pack_BUTTON_TOOLTIP:0 "リトアニアでバルトから黒海までを制覇せよ。"
 lit_lithuania_mission_pack_BUTTON_DETAILS:0 "「リトアニアの大地よ、永遠に」——ゲディミナスからヴィタウタスへ、大公国の栄光を取り戻せ！"
 lit_gediminas_legacy: "ゲディミナス家の遺産"
 lit_gediminas_legacy_desc: "ゲディミナス大公が築いた王朝の基盤を継承し、バルト海から黒海まで伸びる大帝国への道を歩め。"
 lit_teutonic_threat: "チュートン騎士団の脅威"
 lit_teutonic_threat_desc: "十字軍の旗を掲げて東進するチュートン騎士団——この宗教的軍事国家こそリトアニアの最大の敵だ。彼らを牽制して西方の安全を確立せよ。"
 lit_black_ruthenia_integration: "黒ルーシの統合"
 lit_black_ruthenia_integration_desc: "黒ルーシ——グロドノとブレストを中心とするこの地をリトアニア版図に収め、東方拡張の基盤とせよ。"
 lit_volhynia_podolia: "ヴォルィーニとポジーリャ"
 lit_volhynia_podolia_desc: "ヴォルィーニとポジーリャ——ウクライナ西部の豊かな平野をリトアニアの支配下に置き、黒海への道を開け。"
 lit_smolensk: "スモレンスクの制圧"
 lit_smolensk_desc: "スモレンスク——ルーシ東方への要衝。この要塞都市を掌握してモスクワへの圧力を強めよ。"
 lit_kyiv: "キーウ征服"
 lit_kyiv_desc: "キーウ——ルーシの母なる都市。リトアニアがキーウを掌握した時、「全ルーシの支配者」への道が開かれる。"
 lit_steppe_frontier: "ステップ国境線"
 lit_steppe_frontier_desc: "タタールとポロヴェツ人が跋扈する大草原——この危険な国境地帯に防衛線を確立してクリミアへの進軍路を切り開け。"
 lit_crimea: "クリミアの制圧"
 lit_crimea_desc: "クリミア半島——黒海の鍵。タタール人のクリミア汗国を従属させ黒海への入口を確保せよ。"
 lit_black_sea: "黒海の覇者"
 lit_black_sea_desc: "黒海——リトアニアの海。クリミアからオデッサまで、黒海沿岸全体をリトアニアの旗で染めよ。"
 lit_dominant_in_rus: "ルーシの覇者"
 lit_dominant_in_rus_desc: "モスクワか、リトアニアか——東欧の覇権をめぐる戦いでリトアニアが勝利し「全ルーシの支配者」として君臨する。"
 lit_teutonic_defeat: "チュートン騎士団の打倒"
 lit_teutonic_defeat_desc: "グルンヴァルトの戦い以来の宿敵チュートン騎士団がついに滅んだ——バルト海の支配はリトアニアのものだ。"
 lit_samogitia: "サモギティア"
 lit_samogitia_desc: "サモギティア——チュートン騎士団との争奪の地。この頑固なバルト族の地をリトアニアに取り戻せ。"
 lit_livonia: "リヴォニア掌握"
 lit_livonia_desc: "リガとリヴォニア——バルト海交易の中心をリトアニアの支配下に置きハンザ同盟への影響力を確立せよ。"
 lit_jogaila_union: "ヤギェウォの同盟"
 lit_jogaila_union_desc: "ヤギェウォ大公とポーランド王国の同盟——カトリックへの改宗と婚姻でリトアニアとポーランドが結びつく。"
 lit_jagiellonian_dynasty: "ヤギェウォ朝"
 lit_jagiellonian_dynasty_desc: "ヤギェウォ朝——リトアニアとポーランドを統治するこの王朝が中欧最大の勢力として台頭する。"
 lit_lublin_union: "ルブリン合同"
 lit_lublin_union_desc: "1569年のルブリン合同——リトアニアとポーランドが「ポーランド・リトアニア共和国」として統合される歴史的瞬間だ。"
 lit_polish_sejm: "ポーランド議会"
 lit_polish_sejm_desc: "議会（セイム）——シュラフタが国家の意思決定に参加するこの制度が共和国の心臓部となる。"
 lit_commonwealth: "コモンウェルスの完成"
 lit_commonwealth_desc: "ポーランド・リトアニア共和国——バルト海から黒海まで伸びる中欧最大の国家が完成した。「我々の自由のために」——この共和国の旗が欧州に輝く。"
 lit_faith_choice: "信仰の選択"
 lit_faith_choice_desc: "カトリック・正教会・ロムヴァ——リトアニアはどの信仰を選ぶのか。この決断が国家の未来を決める。"
 lit_catholic_baptism: "カトリックへの洗礼"
 lit_catholic_baptism_desc: "1387年のヴィルニュス洗礼——リトアニアがカトリックを受け入れ欧州キリスト教世界の一員となる。"
 lit_faith_romuva_chosen_tt: "ロムヴァを選択した"
 lit_faith_orthodox_chosen_tt: "正教会を選択した"
 lit_faith_catholic_chosen_tt: "カトリックを選択した"
 lit_catholic_crusade: "カトリック十字軍"
 lit_catholic_crusade_desc: "カトリックの旗のもとに——異教徒の十字軍国家チュートン騎士団への反撃でリトアニアがカトリック世界の守護者として認められる。"
 lit_catholic_bishoprics: "大司教区の設立"
 lit_catholic_bishoprics_desc: "ヴィルニュス司教区——リトアニアにカトリック教会の組織を整備して信仰の根を深く張れ。"
 lit_catholic_king: "カトリック王の戴冠"
 lit_catholic_king_desc: "ポーランド・リトアニアのカトリック王——教皇から認められた正統なる王位がヤギェウォ朝に輝く。"
 lit_orthodox_metropolis: "正教会の都府主教"
 lit_orthodox_metropolis_desc: "キーウ都府主教区——ルーシの正教会の中心をリトアニアが庇護する。正教徒の守護者として東欧に君臨せよ。"
 lit_orthodox_third_rome: "第三のローマ"
 lit_orthodox_third_rome_desc: "コンスタンティノープルが陥落した今——キーウこそ新たなる正教会の中心、「第三のローマ」だ。"
 lit_orthodox_unity: "正教会の統一"
 lit_orthodox_unity_desc: "正教徒の統一——ルーシ全土の正教会がリトアニアの庇護のもとに結集する。"
 lit_orthodox_tsar: "正教会のツァーリ"
 lit_orthodox_tsar_desc: "「全ルーシのツァーリ」——正教会の権威とルーシの覇権を兼ね備えたリトアニア君主がモスクワを凌駕する。"
 lit_romuva_maintained: "ロムヴァの維持"
 lit_romuva_maintained_desc: "古代バルト人の信仰ロムヴァ——永遠の炎ズニーチが再び燃え上がり、リトアニアが異教の旗のもとに立つ。"
 lit_romuva_sanctuary: "聖域の確立"
 lit_romuva_sanctuary_desc: "リトアニアの森の聖域——ロムヴァの聖所を守護してバルト人の信仰の中心地を確立せよ。"
 lit_romuva_expansion: "異教の拡張"
 lit_romuva_expansion_desc: "剣でロムヴァを広めよ——周辺の正教徒・カトリック・イスラム教徒をロムヴァに改宗させ「大異教国家」を建設せよ。"
 lit_romuva_pagan_king: "異教の王"
 lit_romuva_pagan_king_desc: "「大異教王」——ロムヴァの炎を掲げてバルトからステップまで君臨するリトアニアの異教王が誕生した。"
 lit_vilnius_capital: "ヴィルニュスの整備"
 lit_vilnius_capital_desc: "ヴィルニュス——リトアニアの黄金の都市。宮殿・大聖堂・市場を整備して帝国の首都にふさわしい輝きを与えよ。"
 lit_amber_road: "琥珀の道"
 lit_amber_road_desc: "琥珀の道——バルト海の琥珀が地中海まで運ばれるこの交易路を掌握してリトアニアを欧州交易の中継地とせよ。"
 lit_grand_duchy_law: "大公国の法典"
 lit_grand_duchy_law_desc: "リトアニア法典——1529年に制定される中欧最先端の法体系でリトアニアの統治を近代化せよ。"
 lit_krakow: "クラクフの整備"
 lit_krakow_desc: "クラクフ——ヤギェウォ朝の栄光の都市を整備してポーランド・リトアニア共和国の第二首都として輝かせよ。"
 lit_red_ruthenia: "赤ルーシ征服"
 lit_red_ruthenia_desc: "赤ルーシとガリツィア——ポーランドとハンガリーが争うこの地をリトアニアが掌握しカルパティア山脈まで版図を拡大せよ。"
 lit_moldavia: "モルダヴィアの従属"
 lit_moldavia_desc: "モルダヴィア——ドナウ川沿いのルーマニア系公国。この国を従属させてバルカン半島への足がかりを確立せよ。"
 lit_grand_empire: "リトアニア大帝国"
 lit_grand_empire_desc: "「バルト海から黒海まで」——ヴィタウタス大公の夢が実現した。リトアニア大公国が欧州最大の帝国として中東欧に君臨する。"
 lit_events.5.t: "信仰の選択——リトアニアの魂"
 lit_events.5.d: "リトアニア大公国は今、歴史的な分岐点に立っている。カトリックに改宗してポーランドとの同盟を深めるか、正教会を庇護してルーシの守護者となるか、それとも祖先の信仰ロムヴァを守り抜くか。この選択がリトアニアの未来を決める。"
 lit_events.5.a: "カトリックに改宗する——ポーランドとの同盟を深め欧州の一員となれ"
 lit_events.5.b: "正教会を選ぶ——ルーシの守護者として東欧に君臨せよ"
 lit_events.5.c: "ロムヴァを守る——祖先の炎ズニーチを絶やすな、異教王として立て"
 lit_events.10.t: "キーウ征服"
 lit_events.10.d: "キーウ——ルーシの母なる都市がリトアニアの手に落ちた。「キーウ・ルーシ」の栄光を継承するのはモスクワではなくリトアニアだ。"
 lit_events.10.a: "キーウ万歳！全ルーシの守護者よ永遠に！"
 lit_events.15.t: "カトリック王の戴冠"
 lit_events.15.d: "教皇の認可のもと、リトアニア・ポーランドのカトリック王が戴冠する——これでリトアニアは正式にカトリック世界の一員だ。"
 lit_events.15.a: "カトリック王万歳！神に選ばれた王国よ永遠に！"
 lit_events.16.t: "リトアニアのツァーリ"
 lit_events.16.d: "キーウを中心とする正教会の守護者として——リトアニアの君主が「全ルーシのツァーリ」を宣言する。モスクワではなくヴィルニュスが第三のローマだ。"
 lit_events.16.a: "ツァーリ万歳！第三のローマよ永遠に！"
 lit_events.17.t: "異教の王"
 lit_events.17.d: "永遠の炎ズニーチが燃え盛る——「大異教王」としてロムヴァの旗のもとバルトからステップまで君臨するリトアニア王が誕生した。"
 lit_events.17.a: "異教王万歳！ロムヴァの炎よ永遠に！"
 lit_events.20.t: "チュートン騎士団の終焉"
 lit_events.20.d: "グルンヴァルトの勝利から長い道のりを経て——チュートン騎士団がついに滅んだ。バルト海はリトアニアの内海となった。"
 lit_events.20.a: "チュートン騎士団打倒！バルト海はリトアニアのものだ！"
 lit_events.99.t: "リトアニア大帝国の完成"
 lit_events.99.d: "「バルト海から黒海まで」——ヴィタウタス大公が夢見た帝国が完成した。リトアニアはかつてのルーシを超え、欧州最大の陸上帝国として東欧・中欧に君臨する。"
 lit_events.99.a: "リトアニア大帝国万歳！永遠の栄光よ！"
 STATIC_MODIFIER_NAME_lit_amber_mod: "琥珀の道の掌握"
 STATIC_MODIFIER_DESC_lit_amber_mod: "バルト海の琥珀交易がリトアニアの富を倍増させる。"
 STATIC_MODIFIER_NAME_lit_bishopric_mod: "大司教区の整備"
 STATIC_MODIFIER_DESC_lit_bishopric_mod: "リトアニアにカトリック教会の組織が確立され信仰の根が深く張った。"
 STATIC_MODIFIER_NAME_lit_black_sea_mod: "黒海の覇権"
 STATIC_MODIFIER_DESC_lit_black_sea_mod: "黒海がリトアニアの内海となり莫大な交易収入が流入する。"
 STATIC_MODIFIER_NAME_lit_catholic_king_mod: "カトリック王の権威"
 STATIC_MODIFIER_DESC_lit_catholic_king_mod: "カトリック王として欧州に認められリトアニアの外交的権威が確立された。"
 STATIC_MODIFIER_NAME_lit_catholic_mod: "カトリックの洗礼"
 STATIC_MODIFIER_DESC_lit_catholic_mod: "リトアニアがカトリックに改宗し欧州キリスト教世界の一員となった。"
 STATIC_MODIFIER_NAME_lit_crimea_mod: "クリミアの制圧"
 STATIC_MODIFIER_DESC_lit_crimea_mod: "クリミア半島がリトアニアの支配下に入り黒海への入口が開かれた。"
 STATIC_MODIFIER_NAME_lit_crusade_mod: "十字軍の精神"
 STATIC_MODIFIER_DESC_lit_crusade_mod: "カトリックの十字軍精神がリトアニア軍を鍛え上げた。"
 STATIC_MODIFIER_NAME_lit_dynasty_mod: "ゲディミナス朝の覚醒"
 STATIC_MODIFIER_DESC_lit_dynasty_mod: "ゲディミナス家の血が東欧征服への野望を燃え上がらせた。"
 STATIC_MODIFIER_NAME_lit_grand_empire_mod: "リトアニア大帝国の完成"
 STATIC_MODIFIER_DESC_lit_grand_empire_mod: "バルトから黒海まで——ヴィタウタス大公の夢が実現した。"
 STATIC_MODIFIER_NAME_lit_jagiellonian_mod: "ヤギェウォ朝の統治"
 STATIC_MODIFIER_DESC_lit_jagiellonian_mod: "ヤギェウォ朝が中欧最大の王朝として台頭した。"
 STATIC_MODIFIER_NAME_lit_jogaila_mod: "ヤギェウォの同盟"
 STATIC_MODIFIER_DESC_lit_jogaila_mod: "クレヴァの盟約に押された封蝋は、リトアニアの使節がポーランドの宮廷で受ける敬意を一変させた。"
 STATIC_MODIFIER_NAME_lit_krakow_mod: "クラクフの繁栄"
 STATIC_MODIFIER_DESC_lit_krakow_mod: "クラクフがヤギェウォ朝の栄光の都市として輝く。"
 STATIC_MODIFIER_NAME_lit_livonia_mod: "リヴォニア掌握"
 STATIC_MODIFIER_DESC_lit_livonia_mod: "バルト海交易の中心リヴォニアがリトアニアの旗のもとに収まった。"
 STATIC_MODIFIER_NAME_lit_moldavia_mod: "モルダヴィア従属"
 STATIC_MODIFIER_DESC_lit_moldavia_mod: "モルダヴィアがリトアニアの従属国としてバルカンへの足がかりとなった。"
 STATIC_MODIFIER_NAME_lit_orthodox_mod: "正教会の庇護"
 STATIC_MODIFIER_DESC_lit_orthodox_mod: "リトアニアが正教会を庇護しルーシの守護者として認められた。"
 STATIC_MODIFIER_NAME_lit_orthodox_tsar_mod: "正教会のツァーリ"
 STATIC_MODIFIER_DESC_lit_orthodox_tsar_mod: "全ルーシのツァーリとして正教会世界の盟主に君臨する。"
 STATIC_MODIFIER_NAME_lit_orthodox_unity_mod: "正教会の統一"
 STATIC_MODIFIER_DESC_lit_orthodox_unity_mod: "ルーシ全土の正教会がリトアニアの旗のもとに結集した。"
 STATIC_MODIFIER_NAME_lit_pagan_empire_mod: "異教大王の覇権"
 STATIC_MODIFIER_DESC_lit_pagan_empire_mod: "ロムヴァの旗のもとバルトからステップまで異教王として君臨する。"
 STATIC_MODIFIER_NAME_lit_pagan_expansion_mod: "異教の拡張"
 STATIC_MODIFIER_DESC_lit_pagan_expansion_mod: "異教の旗のもとリトアニア軍が周辺国家を席巻する。"
 STATIC_MODIFIER_NAME_lit_red_ruthenia_mod: "赤ルーシ征服"
 STATIC_MODIFIER_DESC_lit_red_ruthenia_mod: "赤ルーシとガリツィアがリトアニアの版図に加わった。"
 STATIC_MODIFIER_NAME_lit_romuva_mod: "ロムヴァの復活"
 STATIC_MODIFIER_DESC_lit_romuva_mod: "古代バルト人の信仰ロムヴァが復活しリトアニアが異教国家として立つ。"
 STATIC_MODIFIER_NAME_lit_rus_mod: "ルーシの覇者"
 STATIC_MODIFIER_DESC_lit_rus_mod: "リトアニアが全ルーシの支配者として東欧の盟主となった。"
 STATIC_MODIFIER_NAME_lit_ruthenia_mod: "黒ルーシ制圧"
 STATIC_MODIFIER_DESC_lit_ruthenia_mod: "黒ルーシがリトアニアの版図に収まり東方拡張の基盤が確立された。"
 STATIC_MODIFIER_NAME_lit_sanctuary_mod: "ロムヴァ聖域の確立"
 STATIC_MODIFIER_DESC_lit_sanctuary_mod: "リトアニアの森の聖域が確立され異教の炎が燃え盛る。"
 STATIC_MODIFIER_NAME_lit_sejm_mod: "セイムの設立"
 STATIC_MODIFIER_DESC_lit_sejm_mod: "議会（セイム）が設立されリトアニアの統治が近代化された。"
 STATIC_MODIFIER_NAME_lit_smolensk_mod: "スモレンスクの掌握"
 STATIC_MODIFIER_DESC_lit_smolensk_mod: "スモレンスクがリトアニアの東方の門番として機能する。"
 STATIC_MODIFIER_NAME_lit_steppe_mod: "ステップ国境線の確立"
 STATIC_MODIFIER_DESC_lit_steppe_mod: "大草原の国境線が確立されタタールの侵入が食い止められた。"
 STATIC_MODIFIER_NAME_lit_teutonic_mod: "チュートン騎士団への抵抗"
 STATIC_MODIFIER_DESC_lit_teutonic_mod: "チュートン騎士団の脅威がリトアニア軍を鍛え上げた。"
 STATIC_MODIFIER_NAME_lit_third_rome_mod: "第三のローマ"
 STATIC_MODIFIER_DESC_lit_third_rome_mod: "キーウが「第三のローマ」として正教会の中心地となった。"
 STATIC_MODIFIER_NAME_lit_volhynia_mod: "ヴォルィーニ・ポジーリャ征服"
 STATIC_MODIFIER_DESC_lit_volhynia_mod: "ウクライナ西部の平野がリトアニアの旗で染まった。"
 lit_vilnius_jerusalem: "北のエルサレム"
 lit_vilnius_jerusalem_desc: "ヴィルニュス——「北のエルサレム」。多様な宗教・文化が共存するこの都市に芸術と人口が集まり、リトアニアの文化的中心地として欧州に輝く。"
 STATIC_MODIFIER_NAME_lit_vilnius_jerusalem_mod: "北のエルサレム"
 STATIC_MODIFIER_DESC_lit_vilnius_jerusalem_mod: "ヴィルニュスが「北のエルサレム」として多様な民族・宗教・文化の中心地となった。"
 STATIC_MODIFIER_NAME_lit_teutonic_victory_mod: "チュートン騎士団の打倒"
 STATIC_MODIFIER_DESC_lit_teutonic_victory_mod: "マリーエンブルクの黒十字の旗が降ろされ、リトアニアの兵たちは勝利の歌とともに西へ進んでいる。"
 STATIC_MODIFIER_NAME_lit_vilnius_capital_mod: "ヴィルニュスの発展"
 STATIC_MODIFIER_DESC_lit_vilnius_capital_mod: "ヴィルニュスのゲディミナスの塔からは、帝国の首都の屋根と市壁が広がって見える。"
 lit_memel: "クライペダ——バルト海への玄関口"
 lit_memel_desc: "クライペダ（メーメル）——バルト海沿岸の港湾都市。チュートン騎士団から奪い返したこの都市をリトアニアの海の玄関口として整備して、琥珀交易の拠点とせよ。"
 STATIC_MODIFIER_NAME_lit_memel_mod: "クライペダ港の整備"
 STATIC_MODIFIER_DESC_lit_memel_mod: "クライペダ港がバルト海交易の玄関口として整備された。"
 STATIC_MODIFIER_NAME_lit_lublin_union_mod: "ルブリン合同の恩恵"
 STATIC_MODIFIER_DESC_lit_lublin_union_mod: "ポーランド・リトアニア共和国の議会制度と行政機構が整備された。"
 lit_lublin_dev: "ルブリンの整備"
 lit_lublin_dev_desc: "ルブリン——後にルブリン合同の舞台となるこの都市をリトアニア南部の行政・商業の中心地として整備せよ。"
 lit_lviv_dev: "ルヴフの整備"
 lit_lviv_dev_desc: "ルヴフ（レンベルク）——東方交易の要衝。ガリツィアの中心都市として整備し帝国東南部の繁栄を促せ。"
 lit_kaunas_dev: "カウナス——リトアニアの法の守護者"
 lit_kaunas_dev_desc: "カウナス（コウノ/Kaunas/Kowno）——ネリス川とネムナス川の合流点に位置するこの都市は、リトアニア大公国地方裁判所（Lietuvos Vyriausiasis Tribunolas）の所在地として、リトアニア側の最高上訴裁判所の機能を担った。ポーランドのクラクフ王立高等法院やプロヴァンスのパルルマン・ダクスと同様に、地方的法律の守護機関として中央の法と地方の慣習法の橋渡しを行ったカウナスをリトアニア司法行政の中心都市として発展させよ。"
 lit_hrodna_dev: "フロドナの整備"
 lit_hrodna_dev_desc: "フロドナ（グロドノ）——黒ルーシの中心都市をリトアニア大公国の西方の要衝として発展させよ。"
 lit_minsk_dev: "ミンスクの整備"
 lit_minsk_dev_desc: "ミンスク——ベラルーシの中心都市をリトアニア帝国の東方行政の要衝として整備せよ。"
 STATIC_MODIFIER_NAME_lit_commonwealth_final_mod: "コモンウェルスの完成"
 STATIC_MODIFIER_DESC_lit_commonwealth_final_mod: "ポーランド・リトアニア共和国が完成し全土の行政と軍事が整備された。"
 STATIC_MODIFIER_NAME_lit_lublin_mod: "ルブリンの繁栄"
 STATIC_MODIFIER_DESC_lit_lublin_mod: "ルブリンがリトアニア南部の行政・商業の中心地として整備された。"
 STATIC_MODIFIER_NAME_lit_lviv_mod: "ルヴフの繁栄"
 STATIC_MODIFIER_DESC_lit_lviv_mod: "ルヴフが東方交易の要衝として繁栄する。"
