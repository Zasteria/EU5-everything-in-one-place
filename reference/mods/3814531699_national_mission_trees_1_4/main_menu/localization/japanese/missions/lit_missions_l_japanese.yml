 STATIC_MODIFIER_DESC_lit_kaunas_mod: "カウナスがバルト海交易の内陸拠点として整備された。"
 STATIC_MODIFIER_NAME_lit_hrodna_mod: "フロドナの行政強化"
 STATIC_MODIFIER_DESC_lit_hrodna_mod: "フロドナの城門から、首都ヴィルニュスへ向かう使者の馬が朝から晩まで駆けている。"
