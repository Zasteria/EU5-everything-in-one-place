l_japanese:
 bra_brandenburg_mission_pack: "鉄と血——ブランデンブルクからドイツ帝国へ"
 bra_brandenburg_mission_pack_DESCRIPTION:0 "アスカニエン家の小さな辺境伯領から、ホーエンツォレルン家の下でプロイセン王国を築き、鉄と血をもってドイツ統一を成し遂げよ。"
 bra_brandenburg_mission_pack_CRITERIA_DESCRIPTION:0 "辺境伯領を確立し、プロイセン王国を打ち立て、ドイツ帝国を完成させよ。"
 bra_brandenburg_mission_pack_BUTTON_TOOLTIP:0 "神聖ローマ帝国の砂場から、ヨーロッパの覇者へ。"
 bra_brandenburg_mission_pack_BUTTON_DETAILS:0 "現下の大問題は演説や多数決によってではなく、鉄と血によってのみ解決される——ドイツを統一せよ！"
 bra_ascanian_legacy: "アスカニエン家の遺産"
 bra_ascanian_legacy_desc: "アスカニエン家が築いたブランデンブルク辺境伯領——その遺産を受け継ぎ、新たな時代の統治を始めよ。"
 bra_march_authority: "辺境伯権の確立"
 bra_march_authority_desc: "分裂した貴族領を抑え、辺境伯としての権威を国土全体に行き渡らせよ。"
 bra_turmoil_ended_tt: "ブランデンブルクの混乱の国難が終結した"
 bra_altmark_secure: "アルトマルクの確保"
 bra_altmark_secure_desc: "辺境伯領発祥の地アルトマルク——その支配を盤石なものとせよ。"
 bra_neumark_colonization: "ノイマルクの植民"
 bra_neumark_colonization_desc: "オーデル川東方のノイマルクへ東方植民を進め、新たな入植地を築け。"
 bra_uckermark_integration: "ウッカーマルクの統合"
 bra_uckermark_integration_desc: "ウッカーマルクの地を辺境伯領に完全に組み込め。"
 bra_pomeranian_rivalry: "ポンメルンとの角逐"
 bra_pomeranian_rivalry_desc: "バルト海への足がかりを巡り、ポンメルン公国との対立に決着をつけよ。"
 bra_wendish_lands: "ヴェンド人の地"
 bra_wendish_lands_desc: "スラヴ系ヴェンド人の末裔、カシューブ人が暮らすこの地——彼らの文化を寛容に受け入れ、ドイツ文化への理解を深めさせることで、両民族の共存を示せ。"
 bra_berlin_dev: "ベルリンの発展"
 bra_berlin_dev_desc: "シュプレー川沿いの町ベルリン——ケルンとの統合を経て辺境伯領の中心地へと成長したこの街を、さらに発展させよ。"
 bra_electoral_dignity: "選帝侯の威厳"
 bra_electoral_dignity_desc: "神聖ローマ皇帝を選ぶ選帝侯としての地位を確立し、帝国内の威信を高めよ。"
 bra_hohenzollern_investiture: "ホーエンツォレルン家の叙任"
 bra_hohenzollern_investiture_desc: "1417年、ジギスムント皇帝がホーエンツォレルン家に選帝侯の地位を授けた——この新たな王朝の統治を確立せよ。"
 bra_hohenzollern_dynasty: "ホーエンツォレルン王朝の確立"
 bra_hohenzollern_dynasty_desc: "ホーエンツォレルン家の血統を国家の柱とし、末永い統治の礎を築け。"
 bra_imperial_diet: "帝国議会での発言力"
 bra_imperial_diet_desc: "帝国議会（ライヒスターク）における発言力を高め、帝国政治の一翼を担え。"
 bra_reformation_choice: "宗教改革の選択"
 bra_reformation_choice_desc: "ルターの教えがドイツ中を揺るがす——ブランデンブルクもまた、信仰の選択を迫られている。"
 bra_secularize_prussia: "プロイセンの世俗化"
 bra_secularize_prussia_desc: "ドイツ騎士団国家の世俗化を促し、プロイセンをブランデンブルクの影響下に置け。"
 bra_cleves_inheritance: "クレーフェ継承"
 bra_cleves_inheritance_desc: "ライン川流域のクレーフェ＝ユーリヒ継承戦争を制し、西方の飛び地を確保せよ。"
 bra_thirty_years_war: "三十年戦争を耐え抜け"
 bra_thirty_years_war_desc: "ドイツを荒廃させる三十年戦争——この災厄を耐え抜き、辺境伯領を存続させよ。"
 bra_great_elector: "大選帝侯の治世"
 bra_great_elector_desc: "フリードリヒ・ヴィルヘルム、後の「大選帝侯」——その治世のもとで国力を再建せよ。"
 bra_standing_army: "常備軍の創設"
 bra_standing_army_desc: "貴族の私兵に頼らぬ、選帝侯直属の常備軍を創設せよ。"
 bra_absolutism: "絶対王政の確立"
 bra_absolutism_desc: "身分制議会の力を抑え、選帝侯の意志が国家の隅々にまで行き渡る体制を築け。"
 bra_sovereign_prussia: "プロイセンの主権獲得"
 bra_sovereign_prussia_desc: "オリヴァ条約により、プロイセン公国におけるポーランドの宗主権を脱せよ。"
 bra_king_in_prussia: "プロイセンにおける王の戴冠"
 bra_king_in_prussia_desc: "1701年、ケーニヒスベルクにて、フリードリヒ1世が自らに「プロイセンにおける王」の冠を授けた。"
 bra_prussian_administration: "プロイセン式行政"
 bra_prussian_administration_desc: "効率的で規律ある官僚制度を整備し、近代国家への道を歩め。"
 bra_junker_integration: "ユンカーの統合"
 bra_junker_integration_desc: "エルベ川以東の地主貴族ユンカーを軍と行政の中核に組み込め。"
 bra_potsdam_dev: "ポツダムの発展"
 bra_potsdam_dev_desc: "王家の離宮の地ポツダムを発展させ、宮廷文化の中心とせよ。"
 bra_soldier_king: "兵隊王の遺産"
 bra_soldier_king_desc: "フリードリヒ・ヴィルヘルム1世、「兵隊王」——その質実剛健な軍国主義の遺産を継げ。"
 bra_royal_treasury: "王室財庫の充実"
 bra_royal_treasury_desc: "質実剛健な財政運営により、ヨーロッパ随一の潤沢な国庫を築け。"
 bra_silesian_ambition: "シレジアへの野心"
 bra_silesian_ambition_desc: "ハプスブルク家の統べる豊かなシレジアに、正統な継承権を主張せよ。"
 bra_first_silesian_war: "第一次シュレージエン戦争"
 bra_first_silesian_war_desc: "若きフリードリヒ2世が、電撃的な侵攻でシレジアへ進軍する。"
 bra_silesia_annexed: "シレジア併合"
 bra_silesia_annexed_desc: "豊かな鉱工業地帯シレジアを完全に併合し、プロイセンの経済的基盤とせよ。"
 bra_prussian_enlightenment: "プロイセン啓蒙主義"
 bra_prussian_enlightenment_desc: "フリードリヒ大王のもとで花開く啓蒙思想——「君主は国家第一の下僕」の理念を体現せよ。"
 bra_seven_years_war: "七年戦争を耐え抜け"
 bra_seven_years_war_desc: "全ヨーロッパを敵に回した七年戦争——この試練を耐え抜き、大国の地位を守り抜け。"
 bra_frederick_the_great: "フリードリヒ大王の遺産"
 bra_frederick_the_great_desc: "「フリードリヒ大王」と讃えられる名君の遺産を、次代へと引き継げ。"
 bra_partitions_of_poland: "ポーランド分割への参加"
 bra_invasion_of_poland: "ポーランド侵攻"
 bra_invasion_of_poland_desc: "大ポーランドの地に軍を進め、この弱体化した隣国から領土を切り取れ。"
 bra_partitions_of_poland_desc: "衰退するポーランド・リトアニア共和国の分割に加わり、西プロイセンを獲得せよ。"
 bra_prussian_academy: "プロイセン科学アカデミー"
 bra_prussian_academy_desc: "ベルリン科学アカデミーを育成し、学問と科学の中心地たれ。"
 bra_prussian_army_reform: "プロイセン軍制改革"
 bra_prussian_army_reform_desc: "「質」を極めるか「量」を恃むか——プロイセン軍のあり方を定め、独自の軍制を国家に根付かせよ。"
 bra_napoleonic_crisis: "ナポレオンの危機"
 bra_napoleonic_crisis_desc: "イエナ・アウエルシュタットの敗北——ナポレオンの前に、プロイセンは存亡の危機を迎える。"
 bra_stein_hardenberg_reforms: "シュタイン・ハルデンベルク改革"
 bra_stein_hardenberg_reforms_desc: "国力で我らを凌ぐフランスの財政基盤を突き崩す時が来た——農奴解放と行政改革により、危機からの再生を果たせ。"
 bra_rhineland_acquisition: "ラインラント獲得"
 bra_rhineland_acquisition_desc: "ライン川流域の豊かな諸領邦を獲得し、工業化の礎を築け。"
 bra_show_of_strength: "北ドイツでの威信誇示"
 bra_show_of_strength_desc: "ドイツの大領土に手を伸ばす前に、まず北ドイツ諸侯にプロイセンの実力を見せつけよ。"
 bra_lower_saxony_conquest: "下ザクセン征服"
 bra_lower_saxony_conquest_desc: "リューネブルクやマクデブルクのライバルを退け、ホルシュタインの港エムデンを確保しつつ、下ザクセンへと版図を広げよ。"
 bra_westphalian_conquest: "ヴェストファーレン征服"
 bra_westphalian_conquest_desc: "北ドイツでの覇権をさらに西へ、ヴェストファーレンの地へと広げよ。"
 bra_zollverein: "ドイツ関税同盟"
 bra_zollverein_desc: "ドイツ諸邦を経済的に統合するツォルフェアイン（関税同盟）を主導せよ。"
 bra_prussian_constitution: "プロイセン憲法"
 bra_prussian_constitution_desc: "1850年憲法により、立憲君主制の枠組みを整えよ。"
 bra_army_reform_1860s: "軍制改革"
 bra_army_reform_1860s_desc: "ローンとモルトケによる軍制改革——先に定めた「質」か「量」かの軍事ドクトリンを、さらなる高みへと洗練させよ。"
 bra_danish_war: "対デンマーク戦争"
 bra_danish_war_desc: "シュレースヴィヒ・ホルシュタイン問題を巡り、デンマークと干戈を交えよ。"
 bra_austro_prussian_war: "普墺戦争"
 bra_austro_prussian_war_desc: "ケーニヒグレーツの戦いで決着をつけ、ドイツの盟主の座を勝ち取れ。"
 bra_north_german_confederation: "北ドイツ連邦"
 bra_north_german_confederation_desc: "オーストリアを排したドイツ北部諸邦をまとめ、北ドイツ連邦を樹立せよ。"
 bra_south_german_states: "南ドイツ諸邦との同盟"
 bra_south_german_states_desc: "バイエルン、ヴュルテンベルクなど南ドイツ諸邦と軍事同盟を結べ。"
 bra_franco_prussian_war: "普仏戦争"
 bra_franco_prussian_war_desc: "エムス電報事件を契機に、フランス第二帝政との決戦に臨め。"
 bra_alsace_lorraine_annexed: "アルザス=ロレーヌ併合"
 bra_alsace_lorraine_annexed_desc: "戦利品としてアルザスとロレーヌを併合し、フランスとの宿怨を刻め。"
 bra_german_empire: "ドイツ帝国の成立"
 bra_german_empire_desc: "プロイセン国王を皇帝とするドイツ帝国を、ヨーロッパの新たな大国として確立せよ。"
 bra_kulturkampf: "文化闘争"
 bra_kulturkampf_desc: "カトリック教会の影響力を抑え、国家と教会の関係を再定義せよ。"
 bra_social_legislation: "社会保険制度"
 bra_social_legislation_desc: "疾病・労災・老齢の各保険制度を整備し、社会主義への対抗策とせよ。"
 bra_colonial_empire: "植民地帝国"
 bra_colonial_empire_desc: "「陽の当たる場所」を求め、アフリカと太平洋に植民地を築け。"
 bra_high_seas_fleet: "大洋艦隊"
 bra_high_seas_fleet_desc: "ティルピッツ提督の号令のもと、イギリスに対抗しうる大洋艦隊を建造せよ。"
 bra_weltpolitik: "世界政策"
 bra_weltpolitik_desc: "ヴィルヘルム2世の掲げる「世界政策」のもと、世界列強の一員たれ。"
 bra_berlin_metropolis: "大ベルリンの完成"
 bra_berlin_metropolis_desc: "ベルリンを、パリやロンドンに並ぶ世界都市へと発展させよ。"
 bra_ruhr_industry_complete: "ルール工業の完成"
 bra_ruhr_industry_complete_desc: "ルール地方の工業力を極限まで高め、世界有数の重工業国となれ。"
 bra_german_science: "ドイツ科学の興隆"
 bra_german_science_desc: "物理学・化学の分野で世界を牽引する、ドイツ科学の黄金時代を築け。"
 bra_naval_race: "建艦競争"
 bra_naval_race_desc: "イギリスとの建艦競争を制し、海軍力で世界に伍する力を示せ。"
 bra_balkan_influence: "バルカンへの影響力"
 bra_balkan_influence_desc: "同盟国オーストリアを通じ、バルカン半島への影響力を拡大せよ。"
 bra_ottoman_partnership: "オスマンとの提携"
 bra_ottoman_partnership_desc: "「病める男」オスマン帝国と結び、東方への足がかりとせよ。"
 bra_mitteleuropa: "中欧構想"
 bra_mitteleuropa_desc: "中央ヨーロッパをドイツの経済圏として統合する「ミッテルオイローパ」構想を推進せよ。"
 bra_grossdeutschland: "大ドイツ主義"
 bra_grossdeutschland_desc: "オーストリアをも包含する「大ドイツ」の理念を、ついに実現せよ。"
 bra_hegemon_of_europe: "ヨーロッパの覇者"
 bra_hegemon_of_europe_desc: "経済・軍事・外交のあらゆる面で、ヨーロッパに並ぶ者なき覇権を確立せよ。"
 bra_second_reich_eternal: "第二帝国、永遠なれ"
 bra_second_reich_eternal_desc: "辺境の小さな辺境伯領から、ヨーロッパを統べる帝国へ——ホーエンツォレルン家の物語がここに完成する。"
 bra_events.1.t: "プロイセンにおける王"
 bra_events.1.d: "1701年1月18日、ケーニヒスベルクにて、フリードリヒ1世が自らに冠を戴かせ「プロイセンにおける王」を名乗った。ブランデンブルク選帝侯は、いまや一国の王でもある。"
 bra_events.1.a: "国王万歳！プロイセン王国、ここに成立す！"
 bra_events.2.t: "ヴェルサイユの帝国宣言"
 bra_events.2.d: "1871年1月18日、ヴェルサイユ宮殿の鏡の間にて、プロイセン国王ヴィルヘルム1世がドイツ皇帝として即位した。分裂の時代は終わり、統一されたドイツ帝国がここに誕生する。"
 bra_events.2.a: "皇帝万歳！ドイツ帝国、永遠なれ！"
 bra_events.99.t: "第二帝国、永遠なれ"
 bra_events.99.d: "アスカニエン家の小さな辺境伯領から出発した長い道のりは、ここに終着点を迎えた。ホーエンツォレルン家のもと、ドイツはヨーロッパに並ぶ者なき帝国として君臨する。"
 bra_events.99.a: "ドイツに栄光あれ！第二帝国、永遠なれ！"
 STATIC_MODIFIER_NAME_bra_ascanian_mod: "アスカニエン家の遺産"
 STATIC_MODIFIER_DESC_bra_ascanian_mod: "熊を紋章とするアスカニエン家が築いた辺境統治の記憶は、いまも城砦の石に刻まれている。"
 STATIC_MODIFIER_NAME_bra_march_mod: "辺境伯権の確立"
 STATIC_MODIFIER_DESC_bra_march_mod: "辺境伯の印章を押された布告が、荘園から荘園へと届けられ、領主たちも従うようになった。"
 STATIC_MODIFIER_NAME_bra_altmark_mod: "アルトマルクの防衛"
 STATIC_MODIFIER_DESC_bra_altmark_mod: "発祥の地アルトマルクの防備が固められた。"
 STATIC_MODIFIER_NAME_bra_neumark_mod: "ノイマルク植民"
 STATIC_MODIFIER_DESC_bra_neumark_mod: "オーデル川の向こう、ノイマルクの荒野に、ドイツ人の入植者たちが鍬を入れている。"
 STATIC_MODIFIER_NAME_bra_pomerania_mod: "ポンメルンとの角逐"
 STATIC_MODIFIER_DESC_bra_pomerania_mod: "ポンメルン公との長い争いは、辺境の領主たちに征服地を治める術を教えた。"
 STATIC_MODIFIER_NAME_bra_uckermark_mod: "ウッカーマルク統合"
 STATIC_MODIFIER_DESC_bra_uckermark_mod: "ウッカーマルクの穀倉地帯が、辺境伯の徴税官の帳簿にも載るようになった。"
 STATIC_MODIFIER_NAME_bra_berlin_mod: "ベルリンの発展"
 STATIC_MODIFIER_DESC_bra_berlin_mod: "ベルリンが、辺境伯領の中心地として繁栄している。"
 STATIC_MODIFIER_NAME_bra_electoral_mod: "選帝侯の威厳"
 STATIC_MODIFIER_DESC_bra_electoral_mod: "選帝侯の印章を帯びた使者が、皇帝の宮廷で諸侯と並んで席に着いている。"
 STATIC_MODIFIER_NAME_bra_hohenzollern_mod: "ホーエンツォレルン家の叙任"
 STATIC_MODIFIER_DESC_bra_hohenzollern_mod: "ニュルンベルク城伯の家に生まれた一族が、いまやブランデンブルクの城で新たな王朝の旗を掲げている。"
 STATIC_MODIFIER_NAME_bra_dynasty_mod: "王朝の確立"
 STATIC_MODIFIER_DESC_bra_dynasty_mod: "ホーエンツォレルン家の血筋は、いまや辺境の城砦でも宮廷でも疑いなき権威として認められている。"
 STATIC_MODIFIER_NAME_bra_diet_mod: "帝国議会での発言力"
 STATIC_MODIFIER_DESC_bra_diet_mod: "レーゲンスブルクの帝国議会では、ブランデンブルクの使節の発言に諸侯が耳を傾けている。"
 STATIC_MODIFIER_NAME_bra_reformation_mod: "宗教改革の選択"
 STATIC_MODIFIER_DESC_bra_reformation_mod: "ルターの教えを受け入れた選帝侯のもとで、領民たちは信仰の違いに寛容であることを学んでいる。"
 STATIC_MODIFIER_NAME_bra_secularize_mod: "プロイセンの世俗化"
 STATIC_MODIFIER_DESC_bra_secularize_mod: "かつて司教領だった土地の収入が、いまや選帝侯の役人たちによって管理されている。"
 STATIC_MODIFIER_NAME_bra_cleves_mod: "クレーフェ継承"
 STATIC_MODIFIER_DESC_bra_cleves_mod: "西方の飛び地クレーフェが、税収に新たな富をもたらす。"
 STATIC_MODIFIER_NAME_bra_thirty_years_mod: "三十年戦争の試練"
 STATIC_MODIFIER_DESC_bra_thirty_years_mod: "戦禍を耐え抜いた経験が、国土防衛の要となっている。"
 STATIC_MODIFIER_NAME_bra_great_elector_mod: "大選帝侯の治世"
 STATIC_MODIFIER_DESC_bra_great_elector_mod: "フェールベリンの勝利を挙げた大選帝侯の名は、王朝の権威そのものとなっている。"
 STATIC_MODIFIER_NAME_bra_standing_army_mod: "常備軍の創設"
 STATIC_MODIFIER_DESC_bra_standing_army_mod: "選帝侯にだけ忠誠を誓う常備軍の兵たちが、ポツダムの練兵場で日々の調練を重ねている。"
 STATIC_MODIFIER_NAME_bra_absolutism_mod: "絶対王政の確立"
 STATIC_MODIFIER_DESC_bra_absolutism_mod: "王の命令は、いまやベルリンの宮廷から国土の隅々の村役場にまで届いている。"
 STATIC_MODIFIER_NAME_bra_sovereign_mod: "プロイセンの主権"
 STATIC_MODIFIER_DESC_bra_sovereign_mod: "ポーランド王への臣従の礼を捨てたプロイセン公は、対等の君主として諸国の宮廷に迎えられている。"
 STATIC_MODIFIER_NAME_bra_administration_mod: "プロイセン式行政"
 STATIC_MODIFIER_DESC_bra_administration_mod: "総監理府の書記たちが整えた帳簿と規則が、王国の隅々の行政を支えている。"
 STATIC_MODIFIER_NAME_bra_junker_mod: "ユンカーの統合"
 STATIC_MODIFIER_DESC_bra_junker_mod: "ユンカーが軍と行政の中核として機能し始めている。"
 STATIC_MODIFIER_NAME_bra_potsdam_mod: "ポツダムの発展"
 STATIC_MODIFIER_DESC_bra_potsdam_mod: "王家の離宮ポツダムが、宮廷文化の中心として栄えている。"
 STATIC_MODIFIER_NAME_bra_soldier_king_mod: "兵隊王の遺産"
 STATIC_MODIFIER_DESC_bra_soldier_king_mod: "軍人王の倹約と厳格な規律の遺産は、いまも兵舎の壁に染みついている。"
 STATIC_MODIFIER_NAME_bra_treasury_mod: "王室財庫の充実"
 STATIC_MODIFIER_DESC_bra_treasury_mod: "倹約を旨とする王室の金庫には、戦争のための銀貨が箱に詰まって積み上げられている。"
 STATIC_MODIFIER_NAME_bra_silesian_ambition_mod: "シレジアへの野心"
 STATIC_MODIFIER_DESC_bra_silesian_ambition_mod: "シュレージエンの肥沃な谷を思う将校たちの胸は、開戦の号令を待ちわびている。"
 STATIC_MODIFIER_NAME_bra_first_silesian_mod: "第一次シュレージエン戦争"
 STATIC_MODIFIER_DESC_bra_first_silesian_mod: "雪の中を電光のごとく進んだ軍勢は、オーストリアがまだ動員を終えぬうちにブレスラウの城門に立っていた。"
 STATIC_MODIFIER_NAME_bra_silesia_mod: "シレジア併合"
 STATIC_MODIFIER_DESC_bra_silesia_mod: "シュレージエンの炉と織機が生む富が、ベルリンの国庫に絶え間なく流れ込んでいる。"
 STATIC_MODIFIER_NAME_bra_enlightenment_mod: "プロイセン啓蒙主義"
 STATIC_MODIFIER_DESC_bra_enlightenment_mod: "サンスーシの宮廷から広まった啓蒙の理念は、村々の学校の数を増やしている。"
 STATIC_MODIFIER_NAME_bra_seven_years_mod: "七年戦争の試練"
 STATIC_MODIFIER_DESC_bra_seven_years_mod: "全欧を相手にした戦いの経験が、軍の規律を鍛えた。"
 STATIC_MODIFIER_NAME_bra_frederick_mod: "フリードリヒ大王の遺産"
 STATIC_MODIFIER_DESC_bra_frederick_mod: "フリードリヒ大王の名は、兵の誇りとしても、国の威光としても、語り継がれている。"
 STATIC_MODIFIER_NAME_bra_partitions_mod: "ポーランド分割"
 STATIC_MODIFIER_DESC_bra_partitions_mod: "分割で得た西プロイセンの村々に、プロイセンの役人と測量士が次々と入っている。"
 STATIC_MODIFIER_NAME_bra_academy_mod: "プロイセン科学アカデミー"
 STATIC_MODIFIER_DESC_bra_academy_mod: "ベルリンの学士院に集う学者たちの講義が、国じゅうの学徒を惹きつけている。"
 STATIC_MODIFIER_NAME_bra_invasion_poland_mod: "ポーランド侵攻"
 STATIC_MODIFIER_DESC_bra_invasion_poland_mod: "征服した大ポーランドの町々に、ドイツ語の看板と役所が次々と掲げられている。"
 STATIC_MODIFIER_NAME_bra_napoleonic_mod: "ナポレオンの危機"
 STATIC_MODIFIER_DESC_bra_napoleonic_mod: "危機を乗り越えた経験が、国土防衛の礎となっている。"
 STATIC_MODIFIER_NAME_bra_reforms_mod: "シュタイン・ハルデンベルク改革"
 STATIC_MODIFIER_DESC_bra_reforms_mod: "シュタインとハルデンベルクの改革は、農民を農奴の身分から解き放ち、役所の門戸を開いた。"
 STATIC_MODIFIER_NAME_bra_rhineland_mod: "ラインラント獲得"
 STATIC_MODIFIER_DESC_bra_rhineland_mod: "ライン川沿いの豊かな都市と炭鉱から上がる税は、ベルリンの財務官を喜ばせている。"
 STATIC_MODIFIER_NAME_bra_show_of_strength_mod: "北ドイツでの威信誇示"
 STATIC_MODIFIER_DESC_bra_show_of_strength_mod: "ベルリンの閲兵場に並んだ軍勢の威容を見た北ドイツの諸侯は、言葉少なに引き下がった。"
 STATIC_MODIFIER_NAME_bra_lower_saxony_mod: "下ザクセン征服"
 STATIC_MODIFIER_DESC_bra_lower_saxony_mod: "ハノーファーの平原を進んだプロイセン軍の勝利が、北ドイツの地図を塗り替えた。"
 STATIC_MODIFIER_NAME_bra_westphalia_mod: "ヴェストファーレン征服"
 STATIC_MODIFIER_DESC_bra_westphalia_mod: "ヴェストファーレンの町々の市長たちが、ベルリンの役人の指示に従い始めている。"
 STATIC_MODIFIER_NAME_bra_zollverein_mod: "ドイツ関税同盟"
 STATIC_MODIFIER_DESC_bra_zollverein_mod: "関税同盟の国境では、荷馬車が税関の遮断棒を待たずに通り抜けている。"
 STATIC_MODIFIER_NAME_bra_constitution_mod: "プロイセン憲法"
 STATIC_MODIFIER_DESC_bra_constitution_mod: "憲法の条文が定める議会と君主の役割は、政治の慣行に新しい秩序をもたらした。"
 STATIC_MODIFIER_NAME_bra_danish_war_mod: "対デンマーク戦争"
 STATIC_MODIFIER_DESC_bra_danish_war_mod: "デュッペルの塹壕を陥落させたプロイセン兵の凱旋は、シュレースヴィヒとホルシュタインの統合を早めた。"
 STATIC_MODIFIER_NAME_bra_austro_prussian_war_mod: "普墺戦争"
 STATIC_MODIFIER_DESC_bra_austro_prussian_war_mod: "ケーニヒグレーツの野で、後装式の銃が戦の常識を覆した。"
 STATIC_MODIFIER_NAME_bra_north_confederation_mod: "北ドイツ連邦"
 STATIC_MODIFIER_DESC_bra_north_confederation_mod: "北ドイツ連邦の旗が初めてベルリンの宮殿に翻った日、諸邦の使節たちは新しい時代の到来を悟った。"
 STATIC_MODIFIER_NAME_bra_south_german_mod: "南ドイツ諸邦との同盟"
 STATIC_MODIFIER_DESC_bra_south_german_mod: "バイエルンやヴュルテンベルクの宮廷にも、プロイセンとの盟約を守る使者が行き交っている。"
 STATIC_MODIFIER_NAME_bra_franco_prussian_mod: "普仏戦争"
 STATIC_MODIFIER_DESC_bra_franco_prussian_mod: "セダンでの勝利の報がベルリンに届いた夜、通りという通りが歓声に包まれた。"
 STATIC_MODIFIER_NAME_bra_alsace_mod: "アルザス=ロレーヌ併合"
 STATIC_MODIFIER_DESC_bra_alsace_mod: "アルザスの織物工場と鉄鉱山の煙突が、新たなドイツ帝国の工業を押し上げている。"
 STATIC_MODIFIER_NAME_bra_kulturkampf_mod: "文化闘争"
 STATIC_MODIFIER_DESC_bra_kulturkampf_mod: "国家と教会の争いの末に整えられた新しい制度が、役所と教区の境界を引き直した。"
 STATIC_MODIFIER_NAME_bra_social_mod: "社会保険制度"
 STATIC_MODIFIER_DESC_bra_social_mod: "疾病保険と老齢年金の窓口に並ぶ労働者たちは、国家が自分たちを見捨てないことを知っている。"
 STATIC_MODIFIER_NAME_bra_colonial_mod: "植民地帝国"
 STATIC_MODIFIER_DESC_bra_colonial_mod: "アフリカと南洋の植民地へ向かう蒸気船の甲板には、新天地を夢見る移民たちの姿がある。"
 STATIC_MODIFIER_NAME_bra_fleet_mod: "大洋艦隊"
 STATIC_MODIFIER_DESC_bra_fleet_mod: "キールの軍港に並ぶ装甲艦の煙突からは、通商路を守る決意の煙が立ちのぼっている。"
 STATIC_MODIFIER_NAME_bra_weltpolitik_mod: "世界政策"
 STATIC_MODIFIER_DESC_bra_weltpolitik_mod: "ベルリンの外務省の地図は、いまやアフリカからアジアまでの世界政策を映し出している。"
 STATIC_MODIFIER_NAME_bra_berlin_metropolis_mod: "大ベルリンの完成"
 STATIC_MODIFIER_DESC_bra_berlin_metropolis_mod: "世界都市ベルリンが、繁栄と統治力の中心として輝いている。"
 STATIC_MODIFIER_NAME_bra_ruhr_complete_mod: "ルール工業の完成"
 STATIC_MODIFIER_DESC_bra_ruhr_complete_mod: "ルール地方の溶鉱炉は昼夜を分かたず火を吐き、ドイツの鋼を世界へと送り出している。"
 STATIC_MODIFIER_NAME_bra_science_mod: "ドイツ科学の興隆"
 STATIC_MODIFIER_DESC_bra_science_mod: "ゲッティンゲンやベルリンの研究室から生まれた発見が、ドイツを世界の科学の中心にしている。"
 STATIC_MODIFIER_NAME_bra_naval_race_mod: "建艦競争"
 STATIC_MODIFIER_DESC_bra_naval_race_mod: "ヴィルヘルムスハーフェンの船台では、次の戦艦の竜骨がすでに据えられている。"
 STATIC_MODIFIER_NAME_bra_balkan_mod: "バルカンへの影響力"
 STATIC_MODIFIER_DESC_bra_balkan_mod: "ウィーンとベルリンの外交官が連日語らうバルカンの情勢が、両同盟国の結びつきをいっそう固くしている。"
 STATIC_MODIFIER_NAME_bra_ottoman_mod: "オスマンとの提携"
 STATIC_MODIFIER_DESC_bra_ottoman_mod: "バグダード鉄道の線路が延びるたび、ベルリンとコンスタンティノープルの結びつきは深まっている。"
 STATIC_MODIFIER_NAME_bra_mitteleuropa_mod: "中欧構想"
 STATIC_MODIFIER_DESC_bra_mitteleuropa_mod: "中欧に一つの経済圏をという構想は、隣国の商人や官僚たちの間にも静かに広まっている。"
 STATIC_MODIFIER_NAME_bra_grossdeutschland_mod: "大ドイツ主義"
 STATIC_MODIFIER_DESC_bra_grossdeutschland_mod: "「ドイツ人の祖国とは何か」——ウィーンからベルリンまで歌われたこの古い問いが、ついに答えを得ようとしている。"
 STATIC_MODIFIER_NAME_bra_hegemon_mod: "ヨーロッパの覇者"
 STATIC_MODIFIER_DESC_bra_hegemon_mod: "欧州のいかなる宮廷も、ベルリンの意向を確かめずには重要な決断を下せなくなった。"
 STATIC_MODIFIER_NAME_bra_king_in_prussia_mod: "プロイセンにおける王"
 STATIC_MODIFIER_DESC_bra_king_in_prussia_mod: "ケーニヒスベルクの城教会で王冠を戴いた日から、プロイセンの宮廷は王国としての儀礼を整えていった。"
 STATIC_MODIFIER_NAME_bra_second_reich_mod: "第二帝国、永遠なれ"
 STATIC_MODIFIER_DESC_bra_second_reich_mod: "ヴェルサイユの鏡の間に響いた宣言から、ホーエンツォレルン家の帝冠は欧州の頂点にまで輝いている。"
