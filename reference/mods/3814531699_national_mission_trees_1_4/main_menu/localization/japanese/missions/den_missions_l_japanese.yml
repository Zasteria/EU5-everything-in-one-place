l_japanese:
 den_kalmar_union_mission_pack: "カルマル同盟の栄光"
 den_kalmar_union_mission_pack_DESCRIPTION:0 "1337年、デンマーク王国は財政破綻と領土分裂の危機に瀕している。ヴァルデマー4世（アッテルダグ）は王位奪還と国家再建を目指す。ゴットランド奪還・ハンザ同盟との対決・ノルウェーとスウェーデンとのカルマル同盟締結・バルト海制覇・イングランド征服——そして信仰の選択（カトリック堅守・ルター派改革・ノルド古神の復活）を経て、スカンジナビア帝国を建設せよ。"
 den_kalmar_union_mission_pack_CRITERIA_DESCRIPTION:0 "デンマークとして北方・東方・宗教の全方面で拡大し、スカンジナビア帝国を建国せよ。"
 den_kalmar_union_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してスカンジナビア帝国を建設せよ。"
 den_kalmar_union_mission_pack_BUTTON_DETAILS:0 "ヴァルデマーの復位からカルマル同盟の黄金時代へ——スカンジナビアを統一せよ！"

 den_restoration_of_denmark: "ヴァルデマーの復位"
 den_restoration_of_denmark_desc: "1340年、ヴァルデマー4世（アッテルダグ）が散り散りに分裂したデンマーク王国の王位を取り戻した。プロイセンに抵当に入っていたユラン（ユトランド）半島すら失っていたデンマークを、彼は一つずつ取り戻していく。「アッテルダグ」——「再び昼が来た」——この渾名こそ彼の歴史的使命を体現する。コペンハーゲンを確保し、王権の正統性を高めよ。"

 den_secure_denmark: "デンマークの安定化"
 den_secure_denmark_desc: "ロスキレ・オーフス・マルメを掌握することで、デンマーク王国の中心部が再統一される。ロスキレはデンマーク王の伝統的な埋葬地であり精神的首都、マルメはバルト海への重要な窓口だ。"

 den_norway_union: "ノルウェーとの同君連合"
 den_norway_union_desc: "ノルウェーとデンマークは1380年にホーコン6世の死去によって同君連合を形成した。ヴァルデマー4世の娘マルグレーテ1世がノルウェー摂政となり、後のカルマル同盟の礎を築く。ノルウェーをデンマークの傘下に置き、スカンジナビア統一への第一歩を踏み出せ。"

 den_sweden_union: "スウェーデンとの同君連合"
 den_sweden_union_desc: "スウェーデンはデンマークと幾度となく衝突してきた北方の大国だ。スウェーデン貴族の一部はデンマーク王の保護を求めている。外交か征服か——いずれかの手段でスウェーデンをデンマークの支配下に置くことで、スカンジナビア全体の統一が視野に入る。"

 den_integrate_holstein: "ホルシュタインの統合"
 den_integrate_holstein_desc: "ホルシュタインはデンマーク王が公爵を兼任するドイツ語圏の領地だ。ハンブルクとホルシュタインを掌握することで、ハンザ同盟への圧力と南部国境の安定が確保される。「デンマーク人のホルシュタイン、ホルシュタイン人のデンマーク」——この曖昧な二重性を解消せよ。"

 den_kalmar_union: "カルマル同盟の締結"
 den_kalmar_union_desc: "1397年のカルマル同盟は、マルグレーテ1世の主導のもとデンマーク・ノルウェー・スウェーデン三国が一人の王の下に統合された歴史的事件だ。三国はそれぞれの法律と伝統を保ちながら共通の外交政策を取ることになった。「北方の帝国」の誕生だ。"



 den_unite_scandinavia: "スカンジナビアの統一"
 den_unite_scandinavia_desc: "スウェーデン掌握とホルシュタイン統合により、スカンジナビア全域がデンマークの旗の下に統一された。バルト海からノルウェー海まで、全てが一つの王朝の下に統合されるこの瞬間は、北方史上最大の政治的偉業だ。"

 den_integrate_norway: "ノルウェーの統合"
 den_integrate_norway_desc: "オスロとベルゲンを掌握し、ノルウェーをデンマーク帝国の一部として完全統合する。ベルゲンはかつてハンザ同盟の主要拠点だったが、今やデンマークの北大西洋支配の要衝となる。"

 den_integrate_sweden: "スウェーデンの統合"
 den_integrate_sweden_desc: "スウェーデンをデンマーク帝国の一部として完全統合する。スヴェアランド（スウェーデン中心部）に5以上のロケーションを保有し、ストックホルムを直接支配することで、スウェーデンがデンマーク帝国の不可分の一部となる。"

 den_develop_trondheim: "ノルウェー北方の整備"
 den_develop_trondheim_desc: "トロンハイムはノルウェー王国の歴史的首都であり、大司教座が置かれた信仰の中心地だ。ベルゲンとオスロに加え、ノルウェー北部を整備することで、北大西洋とノルウェー海の制海権が確立される。"

 den_scandinavian_golden_age: "スカンジナビアの黄金時代"
 den_scandinavian_golden_age_desc: "ノルウェー・スウェーデンの統合と絶対王政の確立——スカンジナビアは今や北ヨーロッパ最大の帝国として黄金時代を迎えた。コペンハーゲンはバルト海と北海を結ぶ文化・経済の中心地として栄える。"

 den_retake_gotland: "ゴットランド奪還"
 den_retake_gotland_desc: "ゴットランド島のヴィスビーはかつてハンザ同盟最大の交易都市の一つだったが、スウェーデン・リヴォニア・ドイツ騎士団が争う焦点となってきた。1361年、ヴァルデマー4世はゴットランドを武力で奪取した。この島を手中にすることでバルト海交易の要衝が確保される。"

 den_sound_toll: "オーレスン海峡通行税"
 den_sound_toll_desc: "デンマークはバルト海と北海の境目に位置し、全ての船舶がオーレスン海峡を通過する際に通行税を支払う義務がある。1429年頃から正式に制度化されたこの通行税はデンマーク財政の根幹となった。艦隊を整備して海峡を完全支配せよ。"

 den_humiliate_hansa: "ハンザ同盟の打倒"
 den_humiliate_hansa_desc: "ハンザ同盟はバルト海交易を独占し、デンマークにとって長年の脅威だった。1370年のシュトラルズント条約でデンマークが屈辱的な条件を飲まされて以来、雪辱の機会を待ってきた。リューベックを支配するか経済力で凌駕し、ハンザ同盟の覇権を打ち砕け。"

 den_reconquer_estonia: "エストニアの再征服"
 den_reconquer_estonia_desc: "タリン（レヴァル）はかつてデンマーク王ヴァルデマー2世が1219年に建設した城塞都市だ。「デンマーク人の城（Taani linn）」がタリンの語源とも言われる。1346年にドイツ騎士団に売却されたこの地を取り戻し、バルト海東岸への影響力を復活させよ。"

 den_control_livonia: "リヴォニアの支配"
 den_control_livonia_desc: "リヴォニア（現ラトビア・エストニア）はドイツ騎士団・ポーランド・スウェーデン・ロシアが争う戦略的要衝だ。リガとタルトゥを掌握することで、バルト海東岸全域の支配権がデンマークの手に入る。"

 den_stralsund_treaty: "シュトラルズントの制圧"
 den_stralsund_treaty_desc: "シュトラルズントとシュテッティンはバルト海南岸のポメラニアの主要都市だ。1370年にここでデンマークがハンザ同盟に屈辱的な条約を結ばされた。今度はデンマークが主導権を握り、これらの都市を掌握することでポメラニア海岸の制海権を確立せよ。"

 den_expand_the_toll: "通行税の拡大"
 den_expand_the_toll_desc: "オーレスン海峡通行税をさらに拡大し、バルト海全域の交易路に課税する体制を整える。ポメラニア制圧とハンザ同盟打倒の後、デンマークは北ヨーロッパ最大の交易覇者となった。"

 den_master_of_the_baltic: "バルト海の覇者"
 den_master_of_the_baltic_desc: "ハンザ同盟打倒とリヴォニア支配——デンマークはバルト海の絶対的覇者となった。ケーニヒスベルクとグダニスクを掌握し、バルト海に出入りする全ての商船がデンマークの許可なしに航行できない体制が完成した。"

 den_eliminate_novgorod: "ノヴゴロドの制圧"
 den_eliminate_novgorod_desc: "ノヴゴロド共和国はバルト海・バレンツ海交易路の東端に位置する大商業国家だ。ノヴゴロドとプスコフを支配することで、毛皮・琥珀・ハチミツなどロシア産品の交易ルート全体がデンマークの管理下に入る。"

 den_rival_england: "イングランドとの対立"
 den_rival_england_desc: "デンマーク王ヴァルデマー・カヌーテはかつてイングランドを征服した（1016年）。クヌート大王の北海帝国——それはデンマーク史上最大の栄光だ。今こそその夢を再び追う時だ。イングランドをライバルに定め、北海の支配権を争え。"

 den_north_sea_fleet: "北海艦隊"
 den_north_sea_fleet_desc: "北海を制するには強力な艦隊が必要だ。コペンハーゲンの造船所を拡充し、スカンジナビア史上最大の艦隊を整備する。デンマークの艦船がアイスランドからテームズ川まで航行する日が来た。"

 den_danish_scotland: "スコットランドへの進出"
 den_danish_scotland_desc: "スコットランドはイングランドの永遠の宿敵であり、デンマークにとって潜在的な同盟者だ。エジンバラを掌握することで、イングランドを南北から挟撃する体制が整う。かつてのヴァイキングがスコットランドの海岸を支配した歴史が再現される。"

 den_invade_england: "イングランドへの侵攻"
 den_invade_england_desc: "デンマーク・ノルウェー軍がイングランド北部に上陸した。ヨークはかつてヴァイキングの「ヨルヴィーク王国（デーンロウ）」の首都だった地だ。ヨークを占領することで、9世紀にデーン人が支配したイングランド北部——デーンロウ（Danelaw）——の栄光が現代に甦る。"

 den_conquer_england: "イングランドの征服"
 den_conquer_england_desc: "ロンドンとエジンバラの支配——クヌート大王以来1000年ぶりにスカンジナビア王朝がブリテン島を支配した。デンマーク・ノルウェー・スウェーデン・イングランドを統合した「北海帝国」がついに復活した。"

 den_religious_question: "信仰の問い"
 den_religious_question_desc: "デンマーク王国の信仰はどうあるべきか——ローマ教皇への忠誠を保つか、ルターの改革思想を受け入れるか、あるいは先祖たちの古い神々のもとへ帰るか。この選択がデンマークの未来を決定する。"

 den_catholic_denmark: "カトリックデンマーク"
 den_catholic_denmark_desc: "デンマーク王国はローマ・カトリック教会への忠誠を堅持する。教皇との良好な関係を維持することで、デンマークは北方カトリック世界の守護者として外交的優位に立つ。"

 den_crusade_north: "北方十字軍"
 den_crusade_north_desc: "デンマークはキリスト教世界の北の盾として、異教国家との聖戦に参加する。バルト海東岸のいまだ改宗していない地域への十字軍を率いることで、デンマークの信仰的権威が不動のものとなる。"

 den_kingdom_of_god: "神の王国"
 den_kingdom_of_god_desc: "教皇との深い信頼関係とハンブルクの掌握——デンマークは北方カトリック世界の守護者として確固たる地位を築いた。ローマからの承認を受けたデンマーク王は「北方の十字軍騎士」として歴史に刻まれる。"

 den_reformation: "宗教改革"
 den_reformation_desc: "1517年、マルティン・ルターが九十五箇条の論題を発表し、欧州全土に宗教改革の波が押し寄せた。デンマーク王クリスチャン3世は1536年にルター派をデンマーク国教として宣言した。この歴史的転換を今こそ先取りし、ルター派デンマークを建設せよ。"

 den_protestant_church: "プロテスタント教会の整備"
 den_protestant_church_desc: "ルター派への改宗後、教会財産はデンマーク王家に接収され、国家財政が大幅に強化された。大学を整備してルター派神学者を育成し、デンマーク全土にプロテスタント信仰を根付かせよ。"

 den_protestant_league: "プロテスタント同盟"
 den_protestant_league_desc: "デンマークを中心にルター派諸国が同盟を結成する。シュマルカルデン同盟のように、ルター派の盟主としてデンマークが北ヨーロッパのプロテスタント世界を率いる。"


 den_norse_revival: "ノルド古信仰の復興"
 den_norse_revival_desc: "ヴァイキング時代の神々——オーディン・トール・フレイ——への信仰が秘かに生き続けてきた。一部の北欧貴族はキリスト教化に抵抗し、古い神々への回帰を夢見ている。この異端的な動きを王権が後押しすることで、スカンジナビアに前例のない宗教的革命が起こる。"

 den_viking_tradition: "ヴァイキングの伝統"
 den_viking_tradition_desc: "古代スカンジナビア人の血が甦る。海を渡り、敵地に踏み込み、略奪と征服を繰り返した先祖たちの戦士精神がデンマーク軍に宿る。強大な陸軍と艦隊を整備し、ヴァイキング時代の栄光を現代に再現せよ。"

 den_asgard_kingdom: "アースガルドの王国"
 den_asgard_kingdom_desc: "オーディンの加護のもと、スカンジナビアは古代の神々の王国として再生した。キリスト教化以前のスカンジナビアの姿——勇者が戦場で死ねばヴァルハラへ招かれるという信仰——が国民の精神的支柱となる。スカンジナビア全域を統一し、神々の国を建設せよ。"

 den_strengthen_crown: "王権の強化"
 den_strengthen_crown_desc: "デンマーク王国は歴史的に強力な貴族によって王権が制約されてきた。「王権協約（ハーンドファェスタング）」によって王は即位のたびに貴族への特権付与を強制されてきた。この枷を少しずつ解き、デンマーク王権を強化せよ。"

 den_copenhagen_university: "コペンハーゲン大学の設立"
 den_copenhagen_university_desc: "1479年に設立されたコペンハーゲン大学はスカンジナビア最古の大学だ。神学・法学・医学・哲学を教えるこの学府がデンマーク文化の中心となる。コペンハーゲンに大学を建設し、北方の学術の都を実現せよ。"

 den_develop_copenhagen: "コペンハーゲンの整備"
 den_develop_copenhagen_desc: "コペンハーゲンは「商人の港（Kǿbmændenes Havn）」という名の通り、バルト海交易の要衝として発展してきた。都市ランクに引き上げ、デンマーク王都にふさわしい大都市へと発展させよ。"

 den_revoke_privileges: "特権の廃止"
 den_revoke_privileges_desc: "デンマーク王権を制約してきた貴族特権を廃止する。王室権力を高め、政府改革を実施することで、デンマークは中央集権的な絶対王政国家への道を歩み始める。"

 den_danish_navy: "デンマーク王立海軍"
 den_danish_navy_desc: "コペンハーゲンの造船所を整備し、デンマーク王立海軍を創設する。バルト海・北海の制海権を握るための恒常的な軍事組織として、この海軍はデンマークの覇権を支える柱となる。"

 den_amber_trade: "琥珀交易"
 den_amber_trade_desc: "バルト海産の琥珀は「北の黄金」として古代から珍重されてきた。デンマークが支配するバルト海交易路を通じて琥珀・宝石の輸出を拡大し、豊かな交易収入を確保せよ。"

 den_develop_aarhus: "オーフスの整備"
 den_develop_aarhus_desc: "オーフスはユトランド半島最大の都市であり、デンマーク西部の商業中心地だ。都市ランクに引き上げることで、コペンハーゲンに次ぐデンマーク第二の都市として発展する。"

 den_develop_malmo: "マルメの整備"
 den_develop_malmo_desc: "マルメはスウェーデン南部（スコーネ）の主要都市で、オーレスン海峡を挟んでコペンハーゲンと向かい合う。この都市を開発することで、デンマークのバルト海支配の橋頭堡として機能する。"

 den_absolutism: "絶対王政の確立"
 den_absolutism_desc: "1660年、デンマーク王フレデリク3世は貴族・聖職者・市民の三身分を召集し、世襲的絶対王政を宣言させた。これは北欧史上最も劇的な政治変革の一つだ。王室権力を高め、正統性を強化することで、この歴史的転換を先取りせよ。"

 den_economic_powerhouse: "北の商業大国"
 den_economic_powerhouse_desc: "バルト海通行税・北海交易・スカンジナビア農業——多様な収入源を持つデンマークは北ヨーロッパ随一の経済大国となった。月収300以上と複数の市場中心地を維持し、経済的覇権を確立せよ。"


 den_north_sea_dominion: "北方の覇権"
 den_north_sea_dominion_desc: "スカンジナビア統一・バルト海制覇・スカンジナビア黄金時代の三つが揃い、デンマークは北ヨーロッパ最大の帝国として君臨する。艦船80以上・月収600以上・600ロケーション以上でこの栄光の称号を手にせよ。"

 den_scandinavian_empire: "スカンジナビア帝国"
 den_scandinavian_empire_desc: "バルト海からイングランド、ゴットランドからノヴゴロドまで——スカンジナビア帝国が完成した。ヴァルデマー4世が再建したデンマークは、今や北ヨーロッパ全域を支配する大帝国へと成長した。1000以上のロケーション・威信80以上・月収1000以上でその栄光を掴め。"

 den_events.10.t: "ノルウェー同君連合の成立"
 den_events.10.d: "デンマーク王はノルウェー王位を継承した。バイキング時代以来、デンマークとノルウェーは一つの王家の下に結ばれてきた。ノルウェーの豊かな漁業資源・木材・北大西洋への窓口がデンマークの力を大幅に拡大する。「二王国の王」の称号を持つデンマーク王は、スカンジナビア統一に向けた歴史的な第一歩を踏み出した。"
 den_events.10.a: "ノルウェーとデンマークは永遠に一つだ！"

 den_events.20.t: "スウェーデン同君連合の成立"
 den_events.20.d: "デンマーク王はスウェーデン王位をも手中に収めた。スウェーデン貴族の一部は反発しているが、この同君連合はスカンジナビア統一の決定的な一歩だ。マルグレーテ女王の外交的天才がこの奇跡を実現した——「スカンジナビアの帝王」の夢が現実に近づいている。"
 den_events.20.a: "三王国の統一へ——前進せよ！"

 den_events.30.t: "カルマル同盟の締結"
 den_events.30.d: "1397年のカルマル（スウェーデン）において、デンマーク・ノルウェー・スウェーデン三国の代表が一堂に会し、エーリク・ポンメラニア王の下への統一を宣言した。三国はそれぞれの法律と伝統を保ちながらも、外交・軍事を共通化する。「ヴァルデマーの夢がマルグレーテの手で実現した」——歴史家たちは後にそう記すだろう。"
 den_events.30.a: "カルマル同盟万歳！スカンジナビアは一つだ！"

 den_events.40.t: "信仰の岐路"
 den_events.40.d: "デンマーク宮廷で宗教的な議論が激化している。ローマ教皇への伝統的な忠誠を続けるか——マルティン・ルターの新しい教えを受け入れるか——あるいは先祖たちの古い神々のもとへ帰るか。この選択はデンマーク国家の根幹に関わる問題だ。"
 den_events.40.a: "ローマへの忠誠を守る——カトリックこそデンマークの信仰だ"
 den_events.40.a.tt: "カトリック路線に進む。den_catholic_denmarkのミッション条件を満たしやすくなる"
 den_events.40.b: "ルターの教えを受け入れる——改革の時代が来た"
 den_events.40.b.tt: "ルター派路線に進む。den_reformationのミッション条件を満たしやすくなる"
 den_events.40.c: "古い神々のもとへ——オーディンの加護を求める"
 den_events.40.c.tt: "ノルド路線に進む。den_norse_revivalのミッション条件を満たしやすくなる"

 den_events.99.t: "スカンジナビア帝国の誕生"
 den_events.99.d: "ヴァルデマー4世が廃墟同然のデンマークを引き継いでから数世紀——今やそのデンマークは北ヨーロッパ全域を支配する大帝国へと成長した。バルト海から北海、ノヴゴロドの草原からブリテン島の霧まで、全てがデンマーク皇帝の版図に収まった。歴史家たちは後に書くだろう——「アッテルダグ（再び昼が来た）は真の預言だった」と。"
 den_events.99.a: "スカンジナビア帝国皇帝陛下万歳！"
 STATIC_MODIFIER_NAME_den_valdemar_legacy_mod: "ヴァルデマーの遺産"
 STATIC_MODIFIER_DESC_den_valdemar_legacy_mod: "「アッテルダグ（再び昼が来た）」——ヴァルデマー4世の復位がデンマーク再建の礎を築いた。"

 STATIC_MODIFIER_NAME_den_holstein_integration_mod: "ホルシュタインの統合"
 STATIC_MODIFIER_DESC_den_holstein_integration_mod: "ホルシュタイン公国がデンマーク帝国に完全統合された。南部国境の安定と南方交易路の確保が実現する。"
 STATIC_MODIFIER_NAME_den_scandinavia_united_mod: "スカンジナビアの統一"
 STATIC_MODIFIER_DESC_den_scandinavia_united_mod: "三王国が一つの旗の下に統一された。北ヨーロッパ最大の国家の誕生だ。"
 STATIC_MODIFIER_NAME_den_norway_integration_mod: "ノルウェー統合"
 STATIC_MODIFIER_DESC_den_norway_integration_mod: "ノルウェーがデンマーク帝国の一部として統合された。北大西洋への窓口が開かれる。"
 STATIC_MODIFIER_NAME_den_sweden_integration_mod: "スウェーデン統合"
 STATIC_MODIFIER_DESC_den_sweden_integration_mod: "ストックホルムの議場にデンマーク王の名が読み上げられ、スウェーデンの諸侯も帝国の一員として同じ卓に着いている。"
 STATIC_MODIFIER_NAME_den_visby_trade_mod: "ヴィスビーの商業"
 STATIC_MODIFIER_DESC_den_visby_trade_mod: "ゴットランド島のヴィスビーがデンマークの交易拠点として復活した。かつてのハンザ交易都市が再び繁栄する。"
 STATIC_MODIFIER_NAME_den_sound_toll_mod: "オーレスン海峡通行税"
 STATIC_MODIFIER_DESC_den_sound_toll_mod: "海峡通行税の徴収体制が確立した。バルト海に入出する全ての商船がデンマークに通行料を支払う。"
 STATIC_MODIFIER_NAME_den_hansa_dominance_mod: "ハンザ同盟の打倒"
 STATIC_MODIFIER_DESC_den_hansa_dominance_mod: "ハンザ同盟の覇権を打ち砕いたデンマークがバルト海交易の主導権を握った。"
 STATIC_MODIFIER_NAME_den_estonia_mod: "エストニアの再征服"
 STATIC_MODIFIER_DESC_den_estonia_mod: "タリン（デンマーク人の城）がデンマークに帰還した。バルト海東岸への影響力が復活する。"
 STATIC_MODIFIER_NAME_den_livonia_mod: "リヴォニアの支配"
 STATIC_MODIFIER_DESC_den_livonia_mod: "リガとタルトゥの掌握でバルト海東岸全域がデンマークの管理下に入った。"
 STATIC_MODIFIER_NAME_den_pomeranian_coast_mod: "ポメラニア海岸"
 STATIC_MODIFIER_DESC_den_pomeranian_coast_mod: "シュトラルズントとシュテッティンの制圧でポメラニア海岸全域がデンマークの管制下に入った。"
 STATIC_MODIFIER_NAME_den_sound_toll_extended_mod: "通行税の拡大"
 STATIC_MODIFIER_DESC_den_sound_toll_extended_mod: "エーレスンド海峡を通るすべての船が、バルト海のどの港へ向かうにも、デンマークの税関の鎖の前で帆を下ろしている。"
 STATIC_MODIFIER_NAME_den_baltic_master_mod: "バルト海の覇者"
 STATIC_MODIFIER_DESC_den_baltic_master_mod: "デンマーク艦隊がバルト海全域を支配した。ケーニヒスベルクからグダニスクまで、全ての港がデンマークに従う。"
 STATIC_MODIFIER_NAME_den_eastern_routes_mod: "東方交易路の掌握"
 STATIC_MODIFIER_DESC_den_eastern_routes_mod: "ノヴゴロドの制圧でロシア産品の交易ルート全体がデンマークの管理下に入った。"
 STATIC_MODIFIER_NAME_den_north_sea_fleet_mod: "北海艦隊"
 STATIC_MODIFIER_DESC_den_north_sea_fleet_mod: "デンマーク王立海軍が北海の制海権を握った。アイスランドからテームズ川まで、デンマークの旗が翻る。"
 STATIC_MODIFIER_NAME_den_scotland_mod: "スコットランド進出"
 STATIC_MODIFIER_DESC_den_scotland_mod: "エジンバラの掌握でイングランドを南北から挟撃する体制が整った。"
 STATIC_MODIFIER_NAME_den_england_invasion_mod: "イングランド侵攻の栄光"
 STATIC_MODIFIER_DESC_den_england_invasion_mod: "ヨークを占領したデンマーク軍がデーン法地帯（Danelaw）の記憶を甦らせた。"
 STATIC_MODIFIER_NAME_den_north_sea_empire_mod: "北海帝国"
 STATIC_MODIFIER_DESC_den_north_sea_empire_mod: "クヌート大王以来1000年ぶりにスカンジナビア王朝がブリテン島を支配した。北海帝国が復活した。"
 STATIC_MODIFIER_NAME_den_catholic_devotion_mod: "カトリックへの献身"
 STATIC_MODIFIER_DESC_den_catholic_devotion_mod: "デンマーク王国はローマ教会への忠誠を堅持した。教皇との協力がデンマークに外交的優位をもたらす。"
 STATIC_MODIFIER_NAME_den_northern_crusader_mod: "北方の十字軍騎士"
 STATIC_MODIFIER_DESC_den_northern_crusader_mod: "聖戦に参加したデンマーク軍はキリスト教世界の守護者としての名声を得た。"
 STATIC_MODIFIER_NAME_den_papal_champion_mod: "教皇の盾"
 STATIC_MODIFIER_DESC_den_papal_champion_mod: "デンマークが北方カトリック世界の守護者として確固たる地位を築いた。"
 STATIC_MODIFIER_NAME_den_lutheran_reform_mod: "ルター派改革"
 STATIC_MODIFIER_DESC_den_lutheran_reform_mod: "没収された修道院の金の聖杯と銀の燭台が、コペンハーゲンの王の造幣所で溶かされ、新しい硬貨となっている。"
 STATIC_MODIFIER_NAME_den_protestant_church_mod: "プロテスタント教会"
 STATIC_MODIFIER_DESC_den_protestant_church_mod: "ルター派神学者の育成と大学整備でデンマーク全土に改革信仰が根付いた。"
 STATIC_MODIFIER_NAME_den_protestant_league_mod: "プロテスタント同盟"
 STATIC_MODIFIER_DESC_den_protestant_league_mod: "デンマーク主導のルター派同盟が北ヨーロッパのプロテスタント世界を束ねる。"
 STATIC_MODIFIER_NAME_den_norse_revival_mod: "ノルド古信仰の復興"
 STATIC_MODIFIER_DESC_den_norse_revival_mod: "オーディン・トール・フレイへの信仰が復活した。先祖たちの戦士精神がデンマーク軍に宿る。"
 STATIC_MODIFIER_NAME_den_viking_warriors_mod: "ヴァイキングの戦士"
 STATIC_MODIFIER_DESC_den_viking_warriors_mod: "ヴァイキング時代の戦士精神が甦った。海を渡り、敵地を征服するデンマーク軍の強さは無双だ。"
 STATIC_MODIFIER_NAME_den_asgard_kingdom_mod: "アースガルドの王国"
 STATIC_MODIFIER_DESC_den_asgard_kingdom_mod: "オーディンの加護のもと、スカンジナビアが古代の神々の王国として再生した。"
 STATIC_MODIFIER_NAME_den_royal_authority_mod: "王権の強化"
 STATIC_MODIFIER_DESC_den_royal_authority_mod: "もはや貴族の評議会が王の意志を阻むことはなく、その命令は国土の隅々の村へ直接届いている。"
 STATIC_MODIFIER_NAME_den_copenhagen_learning_mod: "コペンハーゲン大学"
 STATIC_MODIFIER_DESC_den_copenhagen_learning_mod: "スカンジナビア最古の大学がコペンハーゲンに開設された。北方の学術・文化の中心地として繁栄する。"
 STATIC_MODIFIER_NAME_den_copenhagen_capital_mod: "コペンハーゲン王都の整備"
 STATIC_MODIFIER_DESC_den_copenhagen_capital_mod: "コペンハーゲンの通りには石造りの新しい館が次々と建ち並び、王都にふさわしい賑わいを見せている。"
 STATIC_MODIFIER_NAME_den_absolutism_mod: "絶対王政"
 STATIC_MODIFIER_DESC_den_absolutism_mod: "デンマークに絶対王政が確立した。1660年の歴史的転換を先取りし、王権が完全に確立された。"
 STATIC_MODIFIER_NAME_den_danish_economy_mod: "経済大国デンマーク"
 STATIC_MODIFIER_DESC_den_danish_economy_mod: "バルト海通行税・北海交易・スカンジナビア農業を基盤とするデンマーク経済が北ヨーロッパ随一の規模に達した。"
 STATIC_MODIFIER_NAME_den_crown_privileges_mod: "王権特権の確立"
 STATIC_MODIFIER_DESC_den_crown_privileges_mod: "貴族が代々守ってきた特権の証書が廃され、王の書記たちが国じゅうの行政を一手に取り仕切っている。"
 STATIC_MODIFIER_NAME_den_royal_navy_mod: "デンマーク王立海軍"
 STATIC_MODIFIER_DESC_den_royal_navy_mod: "コペンハーゲンを拠点とするデンマーク王立海軍が創設された。バルト海・北海の制海権を支える恒常的軍事組織だ。"
 STATIC_MODIFIER_NAME_den_amber_trade_mod: "琥珀交易"
 STATIC_MODIFIER_DESC_den_amber_trade_mod: "バルト海産琥珀の輸出拡大でデンマークの交易収入が増大した。「北の黄金」がヨーロッパ全土へ流通する。"
 STATIC_MODIFIER_NAME_den_aarhus_mod: "オーフスの整備"
 STATIC_MODIFIER_DESC_den_aarhus_mod: "ユトランド最大の都市オーフスがデンマーク西部の商業拠点として整備された。"
 STATIC_MODIFIER_NAME_den_malmo_mod: "マルメの整備"
 STATIC_MODIFIER_DESC_den_malmo_mod: "オーレスン海峡西岸のマルメが発展し、コペンハーゲンと対をなすバルト海交易の拠点となった。"
 STATIC_MODIFIER_NAME_den_norway_north_mod: "ノルウェー北方の整備"
 STATIC_MODIFIER_DESC_den_norway_north_mod: "ノルウェー北部の整備で北大西洋とノルウェー海の制海権が確立した。"
 STATIC_MODIFIER_NAME_den_golden_age_mod: "スカンジナビアの黄金時代"
 STATIC_MODIFIER_DESC_den_golden_age_mod: "ノルウェー・スウェーデン統合と絶対王政の確立でスカンジナビアは北ヨーロッパ最大の帝国として黄金時代を迎えた。"
 STATIC_MODIFIER_NAME_den_north_sea_dominion_mod: "北方の覇権"
 STATIC_MODIFIER_DESC_den_north_sea_dominion_mod: "バルト海と北海の両方を制するデンマークが北ヨーロッパ全域の交易を支配する。"
 STATIC_MODIFIER_NAME_den_scandinavian_empire_final_mod: "スカンジナビア帝国の栄光"
 STATIC_MODIFIER_DESC_den_scandinavian_empire_final_mod: "バルト海から北海まで広がるスカンジナビア帝国が完成した。ヴァルデマーの復位から始まったデンマークの再建が頂点に達した。"
 STATIC_MODIFIER_NAME_den_norway_union_bonus_mod: "ノルウェー同君連合の恩恵"
 STATIC_MODIFIER_DESC_den_norway_union_bonus_mod: "ノルウェーとの同君連合でスカンジナビア統一への道が開かれた。"
 STATIC_MODIFIER_NAME_den_sweden_union_bonus_mod: "スウェーデン同君連合の恩恵"
 STATIC_MODIFIER_DESC_den_sweden_union_bonus_mod: "スウェーデンとの同君連合でカルマル同盟結成が視野に入った。"
 STATIC_MODIFIER_NAME_den_kalmar_union_mod: "カルマル同盟"
 STATIC_MODIFIER_DESC_den_kalmar_union_mod: "デンマーク・ノルウェー・スウェーデン三王国が一人の王の下に統合された。北方史上最大の政治的統合だ。"
 STATIC_MODIFIER_NAME_den_faith_steadfast_mod: "揺るぎない信仰"
 STATIC_MODIFIER_DESC_den_faith_steadfast_mod: "揺るぎないカトリックの信仰は、ロスキレの大聖堂の鐘の音とともに、王の権威を民に告げている。"
 STATIC_MODIFIER_NAME_den_reform_winds_mod: "改革の風"
 STATIC_MODIFIER_DESC_den_reform_winds_mod: "ルターの教えがデンマーク全土に広まりつつある。改革の波がデンマーク社会を変えていく。"
 STATIC_MODIFIER_NAME_den_old_gods_calling_mod: "古い神々の呼び声"
 STATIC_MODIFIER_DESC_den_old_gods_calling_mod: "オーディンとトールへの信仰が秘かに蘇りつつある。先祖の神々の加護がデンマーク軍を鼓舞する。"

 den_finland_integration: "フィンランドの整備"
 den_finland_integration_desc: "フィンランドはスウェーデン王国の東部に位置する広大な森林地帯だ。オーボ（トゥルク）はフィンランドの行政・宗教の中心地、ヴィボルクはカレリア地方の要衝、ウレオボルク（オウル）は最北の都市だ。フィンランドを完全支配することで、バルト海北端から北極圏まで広がるデンマーク帝国の東方辺境が確立され、入植政策の展開が可能になる。"
 STATIC_MODIFIER_NAME_den_finland_mod: "フィンランドの開拓"
 STATIC_MODIFIER_DESC_den_finland_mod: "フィンランドの広大な森林・水辺が入植者を引き寄せる。デンマーク・スウェーデンからの移民がこの辺境の地を開拓し、帝国の東方国境を押し広げる。"

