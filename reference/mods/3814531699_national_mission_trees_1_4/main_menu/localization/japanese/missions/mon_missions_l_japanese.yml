l_japanese:
 mon_montferrat_mission_pack: "パライオロゴスの野望とイタリアの覇者へ"
 mon_montferrat_mission_pack_DESCRIPTION:0 "1337年、モンフェラート辺境伯国の統治者の血管にはビザンツ帝国パライオロゴス朝の血が流れる。テッサロニキへの権利を主張し東方へ進出するか、剣と外交で北イタリアの覇者となるか——二つの野望が一人の君主に宿る。"
 mon_montferrat_mission_pack_CRITERIA_DESCRIPTION:0 "東方の夢か、西方の覇権か——パライオロゴスの血が両方の道を開く。"
 mon_montferrat_mission_pack_BUTTON_TOOLTIP:0 "パライオロゴスの血でイタリアとギリシャを制覇せよ。"
 mon_montferrat_mission_pack_BUTTON_DETAILS:0 "パライオロゴスの名のもとにテッサロニキからアテナイへ、カサーレからジェノヴァへ——東と西を制覇せよ！"

 mon_palaiologos_ambition: "パライオロゴスの野望"
 mon_palaiologos_ambition_desc: "モンフェラート辺境伯国の統治者——彼の血管にはビザンツ帝国パライオロゴス朝の血が流れる。東方への夢か、イタリアの覇権か——カサーレ・モンフェラートの宮廷でその選択が下される。"
 mon_claim_thessaloniki: "テッサロニキへの請求権"
 mon_claim_thessaloniki_desc: "テッサロニキ——かつてビザンツ帝国第二の都市。パライオロゴスの血統でこの都市への正当な請求権を主張し、ギリシャ侵攻の足がかりとせよ。"
 mon_seize_thessaloniki: "テッサロニキ掌握"
 mon_seize_thessaloniki_desc: "「白い塔の都市」テッサロニキを掌握することで、モンフェラート辺境伯国がギリシャの覇者への道を歩み始める。"
 mon_conquer_macedonia: "マケドニア征服"
 mon_conquer_macedonia_desc: "アレクサンダー大王の故地マケドニアを征服し、ビザンツ帝国復興への足がかりを確立せよ。"
 mon_northern_greece: "北ギリシャ制圧"
 mon_northern_greece_desc: "北ギリシャ全土を制圧し、ギリシャ南部——モレアとアテナイへの道を開けよ。"
 mon_conquer_morea: "モレア征服"
 mon_conquer_morea_desc: "ペロポネソス半島のモレアとアテナイ——ギリシャ文明の心臓部を征服し、ビザンツ復興の礎を固めよ。"
 mon_aegean_control: "エーゲ海の制覇"
 mon_aegean_control_desc: "エーゲ海の島々を掌握することでギリシャ侵攻が完成し、モンフェラートが地中海の新たな覇者として台頭する。"
 mon_new_byzantium: "新ビザンツの夢"
 mon_new_byzantium_desc: "「パライオロゴス皇帝——ローマの後継者」——モンフェラートがビザンツ帝国の名を継承し、東地中海の覇者として復活する。"
 mon_secure_piedmont: "ピエモンテ制圧"
 mon_secure_piedmont_desc: "カサーレを中心とするピエモンテを完全制圧し、北イタリア制覇の基盤を固めよ。"
 mon_casale_capital: "カサーレ・モンフェラートの整備"
 mon_casale_capital_desc: "モンフェラート辺境伯国の首都カサーレ——この古代都市を整備し、北イタリア制覇の拠点として輝かせよ。"
 mon_rival_savoy: "サヴォイアとの対決"
 mon_rival_savoy_desc: "サヴォイア公国——ピエモンテを巡る宿命のライバル。この強敵を制することで北イタリアの覇権が確立される。"
 mon_control_lombardy: "ロンバルディア制圧"
 mon_control_lombardy_desc: "ミラノを中心とするロンバルディア——北イタリアの心臓部を制圧することでイタリア王への道が開かれる。"
 mon_seize_genoa: "ジェノヴァ掌握"
 mon_seize_genoa_desc: "「ラ・スペルバ（誇り高き者）」ジェノヴァ——この海洋共和国を掌握することで地中海交易への参入が確立される。"
 mon_north_italy_trade: "北イタリア交易帝国"
 mon_north_italy_trade_desc: "ロンバルディア・リグーリア・ヴェネトの交易網を掌握し、モンフェラートが北イタリア最大の商業帝国として君臨せよ。"
 mon_emilia: "エミリア征服"
 mon_emilia_desc: "ポー川南岸のエミリア——ボローニャ・パルマ・モデナを征服してイタリア統一への道を進めよ。"
 mon_king_of_italy: "イタリア王への道"
 mon_king_of_italy_desc: "「イタリア王」——この称号がカサーレの宮廷で宣言された。ロンバルディア・リグーリア・エミリアを統一したモンフェラートがイタリアの新たな覇者として台頭する。"
 mon_hre_relations: "神聖ローマ帝国との関係"
 mon_hre_relations_desc: "神聖ローマ帝国——北イタリアに影響力を持つこの存在との関係を定めよ。帝国との協調がモンフェラートの安定を支える。"
 mon_dev_casale: "カサーレ——学芸と富の都へ"
 mon_dev_casale_desc: "カサーレが都市として地位を確立した今、さらなる高みへ——学者と商人と職人が集い、ルネサンスの光が石畳に輝く。辺境伯国の都が北イタリアを照らす灯台となる。"
 mon_renaissance_court: "ルネサンスの宮廷"
 mon_renaissance_court_desc: "パライオロゴスとルネサンスの融合——東方の古典知識と西方の芸術革新が交わるカサーレの宮廷が北イタリア文化の中枢となる。"
 mon_mercenary_tradition: "コンドッティエーレの伝統"
 mon_mercenary_tradition_desc: "イタリア傭兵隊長（コンドッティエーレ）——モンフェラートの軍事的伝統を活かして精鋭軍を育成せよ。"
 mon_papal_alliance: "教皇との同盟"
 mon_papal_alliance_desc: "ローマ教皇——イタリア政治の最大の権威との同盟がモンフェラートの正統性を高める。"
 mon_tuscany: "トスカーナ征服"
 mon_tuscany_desc: "フィレンツェを中心とするトスカーナ——メディチ家のルネサンス文化の地を征服し、イタリア統一を進めよ。"
 mon_veneto: "ヴェネト征服"
 mon_veneto_desc: "「水の都」ヴェネツィアを含むヴェネト——この海洋共和国を征服することで北イタリア制覇が完成する。"
 mon_byzantine_heritage: "ビザンツの遺産"
 mon_byzantine_heritage_desc: "パライオロゴス朝の遺産——東ローマ帝国の精神的・文化的遺産がモンフェラートの国際的権威を高める。"
 mon_navy_adriatic: "アドリア海艦隊"
 mon_navy_adriatic_desc: "ジェノヴァとヴェネツィアの海洋力を統合したモンフェラートのアドリア海艦隊が地中海の制海権を握る。"
 mon_southern_italy: "南イタリア進出"
 mon_southern_italy_desc: "ナポリを中心とする南イタリア——「両シチリア王国」の地に進出してイタリア半島の全土統一を実現せよ。"
 mon_marquis_of_italy: "イタリアの大侯爵"
 mon_marquis_of_italy_desc: "「イタリア大侯爵——北と南、東と西を結ぶ者」——カサーレ・モンフェラートから出発した小辺境伯国が、今やイタリア全土の覇者として君臨する。"
 mon_new_roman_empire: "新ローマ帝国"
 mon_new_roman_empire_desc: "「パライオロゴス皇帝——東西ローマの後継者、イタリアの王、ギリシャの主」——この称号が歴史に刻まれた。モンフェラートの小辺境伯国から始まった物語が、世界帝国の建設で幕を閉じる。"

 mon_events.10.t: "テッサロニキ掌握——パライオロゴスの旗が白い塔に翻る"
 mon_events.10.d: "テッサロニキ——かつてビザンツ帝国第二の都市が、今モンフェラートの手に落ちた。パライオロゴスの血を引く統治者が「ビザンツの後継者」として東方への野望を現実のものとし始めた。白い塔の鐘が響く——新たな時代が始まった。"
 mon_events.10.a: "テッサロニキ万歳！パライオロゴスの旗のもとに！"
 mon_events.20.t: "イタリア王——カサーレから聖都への凱旋"
 mon_events.20.d: "「イタリア王」——ロンバルディア・リグーリア・エミリアを統一したモンフェラートがイタリア半島の新たな覇者として宣言された。カサーレの宮廷に歓声が響く。"
 mon_events.20.a: "イタリア王万歳！"
 mon_events.50.t: "新ビザンツの誕生——パライオロゴスの夢が現実に"
 mon_events.50.d: "「パライオロゴス皇帝——ローマとコンスタンティノープルの後継者」——モンフェラートがビザンツ帝国の名を継承した。北イタリアの小辺境伯国から始まった旅が、東地中海の覇者への道を歩み始めた。"
 mon_events.50.a: "パライオロゴス皇帝万歳！新ビザンツ万歳！"
 mon_events.60.t: "イタリアの大侯爵——東西文明の交差点に君臨"
 mon_events.60.d: "カサーレ・モンフェラートからジェノヴァ、フィレンツェ、ナポリまで——モンフェラート帝国が誕生した。ルネサンスの芸術・ビザンツの精神・コンドッティエーレの剣——三つの力が融合してイタリアの覇者を生み出した。"
 mon_events.60.a: "イタリアの大侯爵万歳！"
 mon_events.99.t: "新ローマ帝国——東西の統合者"
 mon_events.99.d: "「パライオロゴス皇帝——東西ローマの後継者、イタリアの王、ギリシャの主」——この称号が地中海世界に響き渡った。1337年にカサーレの小宮廷で芽生えた野望が、今や世界帝国の建設として結実した。ローマの名が復活した。"
 mon_events.99.a: "新ローマ帝国万歳！永遠の栄光よ！"
 STATIC_MODIFIER_NAME_mon_palaiologos_mod: "パライオロゴスの目覚め"
 STATIC_MODIFIER_DESC_mon_palaiologos_mod: "カサーレの宮廷にビザンツの血が脈打つ——東と西への野望が同時に燃え上がった。"
 STATIC_MODIFIER_NAME_mon_thessaloniki_claim_mod: "テッサロニキへの渇望"
 STATIC_MODIFIER_DESC_mon_thessaloniki_claim_mod: "白い塔の都が我らを呼ぶ——パライオロゴスの旗がエーゲ海の風に翻る時は近い。"
 STATIC_MODIFIER_NAME_mon_macedonia_mod: "マケドニアの覇者"
 STATIC_MODIFIER_DESC_mon_macedonia_mod: "アレクサンダーが踏みしめた大地を我らの旗が覆った——東方への扉が開いた。"
 STATIC_MODIFIER_NAME_mon_northern_greece_mod: "北ギリシャ制圧"
 STATIC_MODIFIER_DESC_mon_northern_greece_mod: "テッサリアの平野からエピルスの山まで——ギリシャの北半分が我らのものとなった。"
 STATIC_MODIFIER_NAME_mon_morea_mod: "ペロポネソスの主"
 STATIC_MODIFIER_DESC_mon_morea_mod: "アテナイの廃墟とモレアの丘——古代ギリシャ文明の地が再びパライオロゴスの掌中に。"
 STATIC_MODIFIER_NAME_mon_aegean_mod: "エーゲ海の風"
 STATIC_MODIFIER_DESC_mon_aegean_mod: "青い海の島々が我らの旗をなびかせる——古代の海路が再び開かれた。"
 STATIC_MODIFIER_NAME_mon_piedmont_mod: "ピエモンテの支柱"
 STATIC_MODIFIER_DESC_mon_piedmont_mod: "ポー川の平野がモンフェラートの礎となった——北イタリア制覇の序章が始まった。"
 STATIC_MODIFIER_NAME_mon_casale_mod: "カサーレの栄光"
 STATIC_MODIFIER_DESC_mon_casale_mod: "モンフェラートの心臓が力強く脈打つ——辺境伯国の首都が北イタリアの輝きを放ち始めた。"
 STATIC_MODIFIER_NAME_mon_savoy_mod: "サヴォイアとの決着"
 STATIC_MODIFIER_DESC_mon_savoy_mod: "アルプスの向こうの宿敵が退いた——ピエモンテの覇権がモンフェラートのものとなった。"
 STATIC_MODIFIER_NAME_mon_lombardy_mod: "ロンバルディアの夜明け"
 STATIC_MODIFIER_DESC_mon_lombardy_mod: "ミラノの塔が我らの旗の影に沈んだ——北イタリアの心臓部がモンフェラートの版図となった。"
 STATIC_MODIFIER_NAME_mon_genoa_mod: "ラ・スペルバ陥落"
 STATIC_MODIFIER_DESC_mon_genoa_mod: "「誇り高き者」ジェノヴァが我らの旗のもとに——地中海への扉が大きく開いた。"
 STATIC_MODIFIER_NAME_mon_trade_mod: "北イタリアの交易王"
 STATIC_MODIFIER_DESC_mon_trade_mod: "ロンバルディアとリグーリアの富が合流した——モンフェラートが北イタリア最大の商業帝国となった。"
 STATIC_MODIFIER_NAME_mon_emilia_mod: "エミリアの沃野"
 STATIC_MODIFIER_DESC_mon_emilia_mod: "ポー川南岸の豊かな大地が我らのものとなった——イタリア半島を縦断する道が開かれた。"
 STATIC_MODIFIER_NAME_mon_hre_mod: "神聖ローマの庇護"
 STATIC_MODIFIER_DESC_mon_hre_mod: "皇帝の権威がモンフェラートの背後に立つ——北イタリアの政治地図が塗り変わった。"
 STATIC_MODIFIER_NAME_mon_casale_dev_mod: "カサーレの黄金時代"
 STATIC_MODIFIER_DESC_mon_casale_dev_mod: "カサーレが文芸と商業の中枢として完成した——北イタリアの学術・識字・制度成長の輝きが辺境伯国全土に広がる。"
 STATIC_MODIFIER_NAME_mon_renaissance_mod: "ルネサンスの結晶"
 STATIC_MODIFIER_DESC_mon_renaissance_mod: "パライオロゴスが持ち込んだビザンツの古典知識とイタリアの芸術革新が融合した——カサーレに新時代の光が宿った。"
 STATIC_MODIFIER_NAME_mon_condottieri_mod: "コンドッティエーレの誉れ"
 STATIC_MODIFIER_DESC_mon_condottieri_mod: "モンフェラートの傭兵隊長たちは伝説となった——その旗のもとに精鋭が集い、イタリアの戦場を制した。"
 STATIC_MODIFIER_NAME_mon_papal_mod: "教皇の祝福"
 STATIC_MODIFIER_DESC_mon_papal_mod: "聖座の権威がモンフェラートを認めた——ローマの鍵がカサーレの同盟者に手渡された。"
 STATIC_MODIFIER_NAME_mon_tuscany_mod: "トスカーナの薔薇"
 STATIC_MODIFIER_DESC_mon_tuscany_mod: "フィレンツェのルネサンスがモンフェラートの翼のもとに咲き誇る——芸術と征服が一つになった。"
 STATIC_MODIFIER_NAME_mon_veneto_mod: "水の都の征服"
 STATIC_MODIFIER_DESC_mon_veneto_mod: "ヴェネツィアのゴンドラがモンフェラートの旗を映した——北イタリア制覇の最後のピースが嵌まった。"
 STATIC_MODIFIER_NAME_mon_heritage_mod: "ビザンツの血の誇り"
 STATIC_MODIFIER_DESC_mon_heritage_mod: "千年の帝国の記憶がモンフェラートを照らす——パライオロゴスの名が再び地中海世界に轟いた。"
 STATIC_MODIFIER_NAME_mon_navy_mod: "アドリア海の覇者"
 STATIC_MODIFIER_DESC_mon_navy_mod: "ジェノヴァとヴェネツィアの海洋力が一つになった——モンフェラートの艦隊が青い海を制した。"
 STATIC_MODIFIER_NAME_mon_southern_italy_mod: "南半島制圧"
 STATIC_MODIFIER_DESC_mon_southern_italy_mod: "ナポリの王冠がモンフェラートの頭上に——イタリア半島全土が一つの旗のもとに統一された。"
 STATIC_MODIFIER_NAME_mon_marquis_final_mod: "イタリア大侯爵の栄光"
 STATIC_MODIFIER_DESC_mon_marquis_final_mod: "東と西、北と南を結ぶ者——パライオロゴスの血がイタリアとギリシャを一つにした。"
 STATIC_MODIFIER_NAME_mon_new_roman_mod: "新ローマ帝国の夜明け"
 STATIC_MODIFIER_DESC_mon_new_roman_mod: "千年の夢が現実となった——東西ローマの後継者がカサーレからコンスタンティノープルまで君臨する。"
 mon_carta_di_franchigia: "カルタ・ディ・フランキジア"
 mon_carta_di_franchigia_desc: "カルタ・ディ・フランキジア——「自由の憲章」。モンフェラートの統治者は各都市に自治権と特権を付与し、商人・農民・市民が安定して繁栄できる土壌を整えた。かつてカサーレの街がこの特権で栄えたように、辺境伯国全土がその恩恵を受ける。"
 mon_carta_di_franchigia_unlock_tt: "都市特権「カルタ・ディ・フランキジア」が使用可能になる。"
 mon_acqui_terme: "アクイ温泉の都市整備"
 mon_acqui_terme_desc: "アクイ・テルメ——「温泉の都市」として古代ローマ時代から名高いこの街の泉を整備せよ。ローマ皇帝も訪れた名湯がモンフェラートの新たな誇りとなり、人々が遠方から訪れる健康都市として再生する。"
 STATIC_MODIFIER_NAME_mon_acqui_terme_mod: "アクイ温泉の復活"
 STATIC_MODIFIER_DESC_mon_acqui_terme_mod: "古代ローマの名湯が再整備され、アクイが健康と繁栄の都市として輝き始めた。"
 STATIC_MODIFIER_NAME_mon_heritage_basic_mod: "ビザンツの残光"
 STATIC_MODIFIER_DESC_mon_heritage_basic_mod: "ビザンツの遺産がモンフェラートを照らす——その正統性が静かに高まり始めた。"
 STATIC_MODIFIER_NAME_mon_new_byzantium_mod: "新ビザンツの威光"
 STATIC_MODIFIER_DESC_mon_new_byzantium_mod: "パライオロゴスの夢が実現した——帝国の行政・海軍・交通網がモンフェラートの力として結実した。"
