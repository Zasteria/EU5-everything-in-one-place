 teo_events.1.b: "ゴート族の誇りをよみがえらせる——我らこそゴティアの真の後継者だ"
 teo_events.5.t: "ガザリア共和国——購入か、拒否か"
 teo_events.5.d: "ジェノヴァ共和国はクリミアの交易植民地「ガザリア（GAZ）」を経営している。ガウラス家のもとにある我らのダカットで300を支払えば、ジェノヴァはガザリアをテオドロに譲渡し属国化することを提案している。\n\nこれはクリミアの平和的支配確立の好機だ——しかし300ダカットの出費は痛い。購入するか？"
 teo_events.5.a: "300ダカットを支払い、ガザリアを購入する——クリミアはテオドロのものだ"
 teo_events.5.b: "購入しない——今は資金を温存する"
 STATIC_MODIFIER_NAME_teo_gothic_penalty_mod: "ゴート文化への転換の痛み"
 STATIC_MODIFIER_DESC_teo_gothic_penalty_mod: "ポントスのギリシャ人たちは、ゴート人の言葉と習わしに慣れきれず、不満の声が村々でくすぶっている。"
 STATIC_MODIFIER_NAME_teo_gothic_bonus_mod: "ゴティアの真の後継者"
 STATIC_MODIFIER_DESC_teo_gothic_bonus_mod: "ゴート文化のままゴティア帝国を完成させた——古代ゴート族の魂がよみがえりゴティア帝国に永遠の栄光をもたらす。"
 teo_events.10.b: "同盟者として連帯する——コムネノスの誇りを尊重せよ"
 STATIC_MODIFIER_NAME_teo_russian_alliance_mod: "ロシアとの同盟"
