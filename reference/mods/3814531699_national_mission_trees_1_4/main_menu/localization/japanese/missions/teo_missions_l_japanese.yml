l_japanese:
 teo_theodoro_mission_pack: "テオドロ公国 ゴティア再興と黒海の覇者へ"
 teo_theodoro_mission_pack_DESCRIPTION:0 "1337年、テオドロ公国（マングプ公国）はクリミア半島の山岳要塞に拠るギリシャ系の小公国だ。かつてビザンツ帝国の一部だったこの地は、タタール・ジェノヴァ・オスマンに囲まれ危機に瀕している。ガウラス家の知略で黒海交易を掌握し、ゴティアの名をよみがえらせ、コンスタンティノープルを奪還してビザンツの遺産を受け継ぎ、ゴティア帝国として東地中海に君臨せよ。"
 teo_theodoro_mission_pack_CRITERIA_DESCRIPTION:0 "黒海を制覇し、ジェノヴァを排除し、コンスタンティノープルを奪還し、ゴティア帝国として東地中海・黒海・ステップを支配せよ。"
 teo_theodoro_mission_pack_BUTTON_TOOLTIP:0 "ゴティア帝国として東地中海の覇者となれ。"
 teo_theodoro_mission_pack_BUTTON_DETAILS:0 "クリミアの山岳要塞から出発し、黒海交易・ビザンツ遺産・ステップ征服の三本柱でゴティア帝国を築け！"

 teo_rise_of_theodoro: "テオドロの台頭"
 teo_rise_of_theodoro_desc: "1337年のテオドロ公国——クリミア半島南西部の山岳要塞マングプを拠点とするギリシャ系小公国だ。かつてビザンツ帝国の辺境伯領だったこの地には、ガウラス家という商人・軍人の一族が支配している。タタールのくびき・ジェノヴァの圧力・迫りくるオスマン帝国。この困難を乗り越えて「ゴティア」の名をよみがえらせよ。"
 teo_black_sea_fleet: "黒海艦隊の創設"
 teo_black_sea_fleet_desc: "黒海はジェノヴァ・ヴェネツィア・タタール・オスマンが覇権を争う交易の海だ。テオドロがこの海で生き残るには強力な艦隊が不可欠だ。ガレー船を建造し、黒海の波頭に我らの旗を立てよ。"
 teo_build_theodoro_harbor: "テオドロ港の整備"
 teo_build_theodoro_harbor_desc: "マングプ要塞の麓の港——セヴァストポリの天然良港を整備することで黒海交易の拠点が確立される。造船所を建設し、テオドロを黒海の海洋国家として打ち立てよ。"
 teo_genoese_question: "ジェノヴァ問題"
 teo_genoese_question_desc: "ジェノヴァ共和国——カッファ（フェオドシヤ）を拠点として黒海交易を独占するこの商業国家との関係を定めよ。外交か、武力か——ガウラス家の選択がテオドロの命運を決める。"
 teo_expel_genoese: "ジェノヴァ勢力の排除"
 teo_expel_genoese_desc: "クリミアのジェノヴァ植民地——カッファ・チェンバロ・スダクを排除し、クリミアの真の支配者となれ。「イタリアのくびき」を断ち切る時が来た。"
 teo_dominate_crimea: "クリミアの制覇"
 teo_dominate_crimea_desc: "クリミア半島全体——ステップのタタール・海岸のジェノヴァを全て排除し、テオドロがクリミアの唯一の主として君臨せよ。"
 teo_tana_trade: "タナの交易"
 teo_tana_trade_desc: "ドン川河口のタナ（アゾフ）——東西交易路の要衝。ここを掌握することでシルクロードの交易品がテオドロを通じて西方に流れる。"
 teo_black_sea_domination: "黒海の制覇"
 teo_black_sea_domination_desc: "「黒海はテオドロの内海となった」——全ての競争者を退け、テオドロが黒海交易の唯一の覇者として君臨する。"
 teo_greek_heritage: "ギリシャの遺産"
 teo_greek_heritage_desc: "ビザンツ帝国の末裔としてのテオドロ——ギリシャ正教・ギリシャ文化・コムネノス朝の記憶がこの小公国を支える精神的基盤だ。正教会を強化し、ヘレニズムの遺産を守護せよ。"
 teo_trebizond_relations: "トレビゾンドとの関係"
 teo_trebizond_relations_desc: "トレビゾンド帝国——コムネノス王朝が支配する黒海南岸の最後のビザンツ後継国家だ。同じギリシャ系として連帯するか、征服するか——ガウラス家の選択がポントスの命運を決める。"
 teo_restore_pontus: "ポントスの復興"
 teo_restore_pontus_desc: "トレビゾンドを中心とするポントス地方——黒海南岸のアナトリアを制圧することで、かつてのポントス王国の版図が甦る。"
 teo_constantinople: "コンスタンティノープル奪還"
 teo_constantinople_desc: "「第二のローマ」コンスタンティノープル——1453年のオスマン征服から正教の聖都を奪還せよ。ガウラス家がビザンツ皇帝の玉座に座る時、ゴティアの栄光が完成する。"
 teo_gothia_ascendant: "ゴティア台頭"
 teo_gothia_ascendant_desc: "「ゴティア」——古代ゴート族の名を冠するこの国家がビザンツの遺産を継承し、黒海の覇者として東地中海に君臨する。"
 teo_aegean_supremacy: "エーゲ海の制覇"
 teo_aegean_supremacy_desc: "「エーゲ海はゴティアの海となった」——エーゲ海の島々と沿岸を制圧し、地中海交易ネットワークを掌握せよ。"
 teo_balkans: "バルカンの制覇"
 teo_balkans_desc: "バルカン半島——かつてのビザンツ帝国の心臓地帯を征服し、ゴティア帝国の基盤を固めよ。"
 teo_azov_gateway: "アゾフ海への進出"
 teo_azov_gateway_desc: "アゾフ海——黒海への玄関口を掌握することで、ドン川・ヴォルガ川を通じる内陸交易路が開かれる。"
 teo_pryazovia: "プリヤゾヴィアの制圧"
 teo_pryazovia_desc: "アゾフ海北岸のプリヤゾヴィア——ドン川流域の草原地帯を制圧することでステップへの道が開かれる。"
 teo_tatar_wars: "タタールとの戦い"
 teo_tatar_wars_desc: "クリミア・タタール——黒海北岸のステップを支配するこの遊牧民族と決戦せよ。ゴティアの騎馬軍団でタタールを打倒し、ポンティックステップを制せ。"
 teo_into_steppes: "ステップへ"
 teo_into_steppes_desc: "広大なポンティックステップ——黒海北岸から中央アジアへと続くこの草原地帯を征服することで、ゴティアが大陸帝国の姿を現す。"
 teo_caucasus_gateway: "コーカサスへの進軍"
 teo_caucasus_gateway_desc: "コーカサス山脈——グルジア・アルメニア・アゼルバイジャンの山岳地帯への進軍がゴティアを真の大陸帝国とする。"
 teo_caspian_reach: "カスピ海到達"
 teo_caspian_reach_desc: "カスピ海——ペルシャ・中央アジアへの交易の「ロシアの内海」を掌握することで、シルクロードの全ルートがゴティアの支配下に入る。"
 teo_russian_question: "ロシア問題"
 teo_russian_question_desc: "モスクワ・ノヴゴロドとの関係——同盟か征服か。ガウラス家のロシア貴族との縁故を活かして北方への影響力を確立せよ。"
 teo_russian_claim: "ルーシへの進出"
 teo_russian_claim_desc: "ルーシの諸公国を制圧し、ゴティアがビザンツの名のもとにスラブ人を統治する帝国を建設せよ。"
 teo_ruthenia_conquest: "ルテニア征服"
 teo_ruthenia_conquest_desc: "キーウを含むルテニア——かつてキエフ・ルーシの中心地を征服することで、ゴティアがビザンツ・ルーシ双方の後継者として君臨する。"
 teo_dev_theodoro: "テオドロの発展"
 teo_dev_theodoro_desc: "マングプの城塞都市テオドロ——その天然の要害と交易上の優位を活かして偉大な都市として発展させよ。テオドロがゴティア帝国の首都にふさわしい輝きを放つ時が来た。"
 teo_trade_empire: "交易帝国"
 teo_trade_empire_desc: "「テオドロは東西交易の要衝だ」——黒海・地中海・シルクロードを結ぶ交易帝国を構築せよ。ガウラス家の商業的才覚が帝国の繁栄を支える。"
 teo_silk_road: "シルクロード交易"
 teo_silk_road_desc: "中央アジアから黒海を経て西方へと流れる絹——この高級商品の交易路を掌握することで莫大な富が流れ込む。"
 teo_gothic_culture: "ゴティア文化の振興"
 teo_gothic_culture_desc: "ギリシャ・ゴート・タタールが融合したゴティアの独自文化——この多様な文化遺産を振興し、地中海世界における知的・芸術的中心として台頭せよ。"
 teo_orthodox_fortress: "正教の要塞"
 teo_orthodox_fortress_desc: "「ゴティアは信仰の砦だ」——正教の聖堂と軍事要塞が一体となったゴティアの防衛体制を構築せよ。オスマンの攻勢からクリミアを守護せよ。"
 teo_great_theodoro: "偉大なるテオドロ"
 teo_great_theodoro_desc: "「テオドロはゴティア帝国の永遠の都だ」——マングプ要塞を中心に壮大な都市が建設され、地中海世界の新たな文化・商業の中心として輝く。"
 teo_crimean_wine: "クリミアの葡萄酒"
 teo_crimean_wine_desc: "クリミア半島の豊かな葡萄畑——古代ギリシャ人が開いたこの葡萄農業の伝統を復活させ、クリミア産ワインを地中海市場に供給せよ。"
 teo_fortress_mangup: "マングプ要塞"
 teo_fortress_mangup_desc: "マングプ——クリミア半島の平頂山に築かれた天然の要害。オスマン帝国でさえ長期包囲なしに攻略できないこの要塞を最強の防衛拠点に強化せよ。"
 teo_anatolian_coast: "アナトリア海岸の制圧"
 teo_anatolian_coast_desc: "黒海南岸のアナトリア——シノプ・サムスン・トラブゾンを征服することで黒海全体がゴティアの内海となる。"
 teo_orthodox_patriarch: "正教の大主教区"
 teo_orthodox_patriarch_desc: "コンスタンティノープル陥落後の正教世界——テオドロがビザンツ皇帝の後継者として正教世界の精神的守護者となる。ゴティアに大主教区を設立し、全正教徒の求心力となれ。"
 teo_merchant_republic: "商人共和国"
 teo_merchant_republic_desc: "「ガウラス家は剣と帳簿で帝国を築いた」——交易と征服を両立させ、ゴティアを地中海最大の商業帝国として確立せよ。"
 teo_dev_trebizond_city: "トレビゾンド市の整備"
 teo_dev_trebizond_city_desc: "ポントスの真珠トレビゾンド——黒海南岸の交易都市を整備し、東方との交易の要衝として発展させよ。"
 teo_gavras_triumphant: "ガウラス家の勝利"
 teo_gavras_triumphant_desc: "「かつてマングプの山岳要塞に拠った小公国が、今や地中海・黒海・ステップを支配する大帝国となった」——ガウラス家の商業的才覚と軍事的勇気が歴史を変えた。"
 teo_gothia_empire: "ゴティア帝国"
 teo_gothia_empire_desc: "「ゴティア皇帝——黒海・地中海・ステップの主」——マングプの丘から出発したガウラス家が、かつてのビザンツ帝国を超える大帝国を建設した。古代ゴート族の名と栄光が1000年の時を超えて甦った。"

 teo_events.1.t: "テオドロ台頭——ギリシャの伝統かゴートの誇りか"
 teo_events.1.d: "1337年、テオドロ公国はクリミア山上のマングプ要塞に拠る。我らの先祖はビザンツ帝国の末裔であり、ギリシャ語を話し正教を守るポントス・ギリシャ人だ。\n\nしかし遠い昔——ゴート族もこの地に暮らし、かの「ゴティア」の名はゴート族に由来する。ガウラス家はポントス・ギリシャの血を引くが、ゴート族との混血の歴史も持つ。\n\n今、我らは問われる——「ポントスの伝統を守るか、ゴートの誇りをよみがえらせるか」と。\n\n※ゴート文化を選択した場合、100年間POPの同化速度が大幅に低下し反乱の危険が増す。しかしゴート主要文化のまま「ゴティア帝国」ミッションを完了すると、より強力な報酬が得られる。"
 teo_events.1.a: "ポントス・ギリシャの伝統を守る——我らはビザンツの末裔だ"


 teo_events.10.t: "トレビゾンドの帰趨——属国化か連帯か"
 teo_events.10.d: "コムネノス王朝のトレビゾンド帝国——かつてテオドロと深い縁で結ばれたこの国家が今やオスマンの圧力で衰退している。ガウラス家はコムネノス家との婚姻関係を持ち、同じギリシャ正教を奉じる。\n\n我らはトレビゾンドを保護国とし、ゴティア帝国の傘下に収めるか？それとも独立した同盟者として連帯を続けるか？"
 teo_events.10.a: "トレビゾンドを属国化する——ゴティアの傘下でポントスの遺産を守れ"

 teo_events.20.t: "コンスタンティノープル奪還——ゴティア王の戴冠"
 teo_events.20.d: "「第二のローマ」コンスタンティノープルがゴティアの手に！1453年のオスマン陥落から正教の聖都を奪い返した今、ガウラス家がビザンツ皇帝の玉座に座る。聖ソフィア大聖堂に再び正教の十字架が掲げられる。"
 teo_events.20.a: "ゴティア王万歳！コンスタンティノープル万歳！"

 teo_events.30.t: "ロシア問題——同盟か征服か"
 teo_events.30.d: "ガウラス家はロシアの貴族家門と深い縁がある。モスクワ・ノヴゴロドとの関係をどう定めるか——同盟を結び互いの利益を守るか、それともルーシをゴティアの支配下に置くか？"
 teo_events.30.a: "ロシアと同盟を結ぶ——正教の兄弟として協力せよ"
 teo_events.30.b: "ルーシの征服を目指す——ゴティアがルーシの真の主となれ"

 teo_events.60.t: "ガウラス家の勝利——ゴティア帝国の建国"
 teo_events.60.d: "黒海制覇・コンスタンティノープル奪還・ステップ征服——三つの偉業を成し遂げたガウラス家が今、「ゴティア帝国」の皇帝として東地中海に君臨する。マングプの山岳要塞から始まった旅が、世界帝国の樹立で終わる。"
 teo_events.60.a: "ゴティア帝国万歳！ガウラス家万歳！"

 teo_events.99.t: "ゴティア帝国——永遠の栄光"
 teo_events.99.d: "「ゴティア皇帝——黒海・地中海・ステップの主」——古代ゴート族の名を冠するこの帝国が東西文明の交差点に君臨する。ビザンツの遺産・黒海交易・ルーシの豊かさが融合したゴティア帝国は、1337年の小さなマングプ要塞から始まった奇跡的な物語の結末だ。"
 teo_events.99.a: "ゴティア帝国万歳！永遠の栄光よ！"

