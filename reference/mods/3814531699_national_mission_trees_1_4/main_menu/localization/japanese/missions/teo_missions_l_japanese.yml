 STATIC_MODIFIER_DESC_teo_gothia_mod: "ゴティアの名がよみがえりビザンツの後継者として国際的に認知された。"
 STATIC_MODIFIER_NAME_teo_aegean_mod: "エーゲ海の制覇"
 STATIC_MODIFIER_DESC_teo_aegean_mod: "エーゲ海の島々の港には、ゴティアの旗を掲げた船が並び、地中海交易の荷が次々と積み替えられている。"
