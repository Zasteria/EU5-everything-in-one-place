 teo_events.99.b: "ゴート文化の誇りと共に帝国を完成させる——ドイツへの侵攻権を得よ"
 cb_gothic_invasion: "ゴートの侵攻"
 cb_gothic_invasion_desc: "ドイツ文化圏の諸国に対する固有の開戦事由——征服コストと敵対心が80%軽減される。ゴティア帝国FINAL完了後のゴート文化限定で解禁される。"
