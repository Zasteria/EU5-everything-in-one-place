 STATIC_MODIFIER_DESC_teo_caucasus_mod: "コーカサス山脈への進軍でゴティアが大陸帝国の姿を現した。"
 STATIC_MODIFIER_NAME_teo_caspian_mod: "カスピ海到達"
 STATIC_MODIFIER_DESC_teo_caspian_mod: "カスピ海の掌握でペルシャ・中央アジアへの交易路が完成した。"
 STATIC_MODIFIER_NAME_teo_russian_claim_mod: "ルーシへの進出"
