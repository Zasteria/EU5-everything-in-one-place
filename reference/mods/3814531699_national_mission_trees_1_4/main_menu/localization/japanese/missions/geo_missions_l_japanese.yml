l_japanese:
 geo_georgia_mission_pack: "黄金の羊毛——コーカサスの王国"
 geo_georgia_mission_pack_DESCRIPTION:0 "バグラティオニ朝のもと、コーカサスの十字路に立つグルジア王国。国内を統一し、コーカサスとステップに覇を唱え、あるいは十字軍としてアナトリアと聖地に進軍し、正教の光を東方に灯せ。"
 geo_georgia_mission_pack_CRITERIA_DESCRIPTION:0 "グルジアを再統一し、コーカサスを制し、南方への十字軍を経て黄金時代を実現せよ。"
 geo_georgia_mission_pack_BUTTON_TOOLTIP:0 "黄金の羊毛の地から、コーカサスの覇者となれ。"
 geo_georgia_mission_pack_BUTTON_DETAILS:0 "タマル女王の栄光を再び——山々の王国から、正教世界の守護者へ！"
 geo_bagrationi_legacy: "バグラティオニ朝の遺産"
 geo_bagrationi_legacy_desc: "コーカサスを統べるバグラティオニ王家の血脈。その遺産を受け継ぎ、新たな時代の統治を始めよ。"
 geo_royal_succession: "王位継承の安定"
 geo_royal_succession_desc: "貴族たちの野心と王位を巡る争いを鎮め、正統性ある統治を確立せよ。"
 geo_reunite_georgia: "グルジアの再統一"
 geo_reunite_georgia_desc: "トビリシ、クタイシ、アハルツィヘ、バトゥミ——分裂したグルジアの諸地方を一つの王冠のもとに統合せよ。"
 geo_fortify_caucasia: "コーカサスの要塞化"
 geo_fortify_caucasia_desc: "峻険な山岳地帯を要塞網で固め、異教徒や征服者の侵入を跳ね返せ。"
 geo_church_of_georgia: "グルジア正教会の統制"
 geo_church_of_georgia_desc: "自主独立教会としてのグルジア正教会を国家の柱とし、信仰による結束を固めよ。"
 geo_royal_court: "王宮の充実"
 geo_royal_court_desc: "トビリシの王宮を整え、コーカサスに並ぶ者なき文化と権威の中心とせよ。"
 geo_georgian_army: "グルジア軍の精鋭化"
 geo_georgian_army_desc: "山岳の民から徴募した精強な軍隊を鍛え上げ、王国の剣とせよ。"
 geo_recover_strength: "国力回復"
 geo_recover_strength_desc: "度重なる苦難で疲弊した国力を回復し、同盟と再軍備によって未来を切り開け。"
 geo_queen_tamar_ambition: "タマル女王の野望"
 geo_queen_tamar_ambition_desc: "かつてタマル女王が版図に収めたアルメニアの地——同胞であるキリスト教徒を異教の支配から解放し、トビリシの権威を取り戻せ。"
 geo_reclaim_shirvan: "シルヴァン回収"
 geo_reclaim_shirvan_desc: "かつてグルジアの宗主権下にあったシルヴァンを取り戻し、カスピ海への足がかりを得よ。"
 geo_heirs_of_seljuks: "セルジュークの後継者たち"
 geo_heirs_of_seljuks_desc: "セルジューク朝の遺産を継ぐ勢力から東方の地を奪還し、十字の権威をこの地に取り戻せ。"
 geo_gates_of_alexander: "アレクサンドロスの門"
 geo_gates_of_alexander_desc: "「アレクサンドロスの門」と呼ばれるコーカサスの隘路を越え、北方の諸部族を服従させよ。"
 geo_bane_of_khagan: "ハーンの災厄"
 geo_bane_of_khagan_desc: "モンゴルの末裔たちが正教世界を脅かし続けている。彼らの支配に終止符を打ち、この災厄を永遠に排除せよ。"
 geo_seize_crimea: "クリミア確保"
 geo_seize_crimea_desc: "タタールの最後の砦であるクリミア半島を制圧し、黒海の支配権を固めよ。"
 geo_control_black_sea: "黒海の支配"
 geo_control_black_sea_desc: "黒海沿岸の大半を掌握した今、この内海を完全にグルジアの交易圏として組み込め。"
 geo_envoy_to_tsar: "ツァーリへの使者"
 geo_envoy_to_tsar_desc: "ルーシの覇者として台頭したツァーリのもとへ使者を送り、同盟の道を探れ。"
 geo_caucasus_hegemony: "コーカサス覇権の完成"
 geo_caucasus_hegemony_desc: "山々と草原、そして黒海——コーカサス全域における揺るぎない覇権をここに完成させよ。"
 geo_deal_with_trebizond: "トレビゾンドとの盟約"
 geo_deal_with_trebizond_desc: "タマル女王の助力によって建国されたトレビゾンド帝国——古き友邦との絆を新たにし、共に歩む道を選べ。"
 geo_conquer_jalayirids: "ジャライール・ウルスの制圧"
 geo_conquer_jalayirids_desc: "イルハン朝崩壊後の混乱の中、この地に興ったジャライール朝——モンゴルの遺産を継ぐこの勢力を屈服させ、東方への道を切り開け。"
 geo_encroach_mamluks: "マムルーク朝への進出"
 geo_encroach_mamluks_desc: "かつて十字軍が失った聖地——マムルーク朝の支配する東方の地に進出し、信仰の光を取り戻す準備を整えよ。"
 geo_conquer_cyprus: "キプロス征服"
 geo_conquer_cyprus_desc: "東地中海の要衝キプロス島を掌握し、地元の十字軍勢力と結んでこの地の覇権を固めよ。"
 geo_cradle_of_civilization: "文明のゆりかご"
 geo_cradle_of_civilization_desc: "人類文明発祥の地メソポタミアをイスラムの支配から解放し、その豊かさをグルジアのものとせよ。"
 geo_claim_holy_city: "聖都奪還"
 geo_claim_holy_city_desc: "サラセンの支配下にある限り、キリスト教世界には暗い影が差す。聖地エルサレムを奪還し、信仰の勝利を証明せよ。"
 geo_light_of_east: "東方の光"
 geo_light_of_east_desc: "アレクサンドリア、エルサレム、アンティオキア——かつての東方総主教座を解放し、東方教会の光が消えていないことを世界に示せ。"
 geo_anatolian_incursion: "アナトリア侵攻"
 geo_anatolian_incursion_desc: "マンジケルトの敗北以来、トルコ系勢力の手に落ちたアナトリア——その雪辱を果たし、この地の新たな覇者となれ。"
 geo_empires_downfall: "帝国の没落"
 geo_empires_downfall_desc: "バルカンと中東に覇を唱えるオスマン帝国——全キリスト教世界の脅威であるこの帝国を歴史の彼方へ葬り去れ。"
 geo_throne_of_romans: "ローマ人の玉座"
 geo_throne_of_romans_desc: "偉大なるコンスタンティノープルが異教徒の手に落ちて久しい。この宝石を解放し、グルジア皇帝としてローマの玉座に座せ。"
 geo_beacon_of_christendom: "キリスト教世界の灯台"
 geo_beacon_of_christendom_desc: "正教の信仰を回復させた今、その敬虔さと神に与えられた正義を世界に証明する時が来た——我らが王国を、キリスト教世界の統一された楽園とせよ。"
 geo_georgian_crusader_realm: "グルジア十字軍国家"
 geo_georgian_crusader_realm_desc: "コーカサスから地中海まで——十字架のもとに築かれたこの大帝国こそ、タマル女王の夢の完成形である。"
 geo_rebuild_tbilisi: "トビリシ再建"
 geo_rebuild_tbilisi_desc: "度重なる異民族の侵攻で荒廃した王都トビリシ——かつての栄華を取り戻すべく、再建に着手せよ。"
 geo_georgian_vineyards: "グルジアのワイン"
 geo_georgian_vineyards_desc: "千年を超える歴史を持つグルジアのワイン造り——この誇るべき産業を世界に知らしめよ。"
 geo_revive_literature: "文学の復興"
 geo_revive_literature_desc: "アソムタヴルリ、ヌスハ、ムヘドルリ——三つの文字体系を受け継ぐグルジアの文化を復興し、その言葉と文字をコーカサス全域に広めよ。"
 geo_legacy_of_builder: "建設王の遺産"
 geo_legacy_of_builder_desc: "「建設王」と呼ばれたダヴィド4世の治世に倣い、都市に富と栄光と重要性をもたらせ。"
 geo_svetitskhoveli_cathedral: "スヴェティツホヴェリ大聖堂"
 geo_svetitskhoveli_cathedral_desc: "「命の柱の大聖堂」——グルジア使徒教会の中心たるこの聖堂を、かつての威容を超えて再建せよ。"
 geo_patriarchate_of_georgia: "全グルジア総主教座"
 geo_patriarchate_of_georgia_desc: "国家の影響力が広がるにつれ、自主独立教会たるグルジア教会を総主教座へと格上げする声が高まっている。"
 geo_silk_road_trade: "シルクロード交易"
 geo_silk_road_trade_desc: "東西を結ぶシルクロードの結節点として、グルジアの都市を交易の富で満たせ。"
 geo_mountain_fortresses: "山岳要塞網"
 geo_mountain_fortresses_desc: "コーカサスの峻険な地形を活かし、いかなる大軍も阻む要塞網を完成させよ。"
 geo_golden_age: "黄金時代の完成"
 geo_golden_age_desc: "タマル女王とダヴィド4世が築いた黄金時代——その栄光を、これまでにない高みへと押し上げよ。"
 geo_events.1.t: "サライ陥落"
 geo_events.1.d: "モンゴルの後継国家の都サライが、我らの手に落ちた。かつて正教世界を震撼させたハーンの権威は、今や過去のものとなった。"
 geo_events.1.a: "ハーンの災厄は終わりを告げた！"
 geo_events.2.t: "コンスタンティノープル陥落"
 geo_events.2.d: "偉大なる帝都コンスタンティノープルが、ついに我らの手に落ちた。異教徒に奪われていたこの都に、グルジアの旗が翻る——コーカサスの王が、いまやローマの後継者を名乗る。"
 geo_events.2.a: "ローマ帝国万歳！グルジア皇帝万歳！"
 geo_events.99.t: "黄金時代の宣言"
 geo_events.99.d: "コーカサスから地中海まで——タマル女王が夢見た黄金時代が、ここに完成した。山々の小王国は、正教世界を照らす大帝国へと生まれ変わった。"
 geo_events.99.a: "グルジアに栄光あれ！黄金時代よ永遠に！"
 STATIC_MODIFIER_NAME_geo_bagrationi_mod: "バグラティオニ朝の威光"
 STATIC_MODIFIER_DESC_geo_bagrationi_mod: "王家の血統が国家に威信と正統性をもたらす。"
 STATIC_MODIFIER_NAME_geo_succession_mod: "継承の安定"
 STATIC_MODIFIER_DESC_geo_succession_mod: "王位継承が安定し、国内の混乱が収まった。"
 STATIC_MODIFIER_NAME_geo_reunite_mod: "グルジア再統一"
 STATIC_MODIFIER_DESC_geo_reunite_mod: "分裂した諸地方が再び一つの王冠のもとに統合された。"
 STATIC_MODIFIER_NAME_geo_fortify_mod: "コーカサスの要塞網"
 STATIC_MODIFIER_DESC_geo_fortify_mod: "カフカスの峠の頂に築かれた石造りの砦が、侵略者の影を遠くから見張っている。"
 STATIC_MODIFIER_NAME_geo_church_mod: "グルジア正教会の統制"
 STATIC_MODIFIER_DESC_geo_church_mod: "正教会が国家の柱として機能し、信仰による結束が固まった。"
 STATIC_MODIFIER_NAME_geo_court_mod: "王宮の栄華"
 STATIC_MODIFIER_DESC_geo_court_mod: "トビリシの王宮がコーカサスの文化と権威の中心として輝く。"
 STATIC_MODIFIER_NAME_geo_army_mod: "グルジア軍の精鋭化"
 STATIC_MODIFIER_DESC_geo_army_mod: "山岳の民から徴募した精強な軍隊が、王国の剣として完成した。"
 STATIC_MODIFIER_NAME_geo_recover_mod: "国力の回復"
 STATIC_MODIFIER_DESC_geo_recover_mod: "同盟と再軍備によって、王国は新たな未来へ踏み出した。"
 STATIC_MODIFIER_NAME_geo_tamar_mod: "タマル女王の野望"
 STATIC_MODIFIER_DESC_geo_tamar_mod: "アルメニアの同胞たちが解放され、トビリシの権威が東方に及んだ。"
 STATIC_MODIFIER_NAME_geo_shirvan_mod: "シルヴァン回収"
 STATIC_MODIFIER_DESC_geo_shirvan_mod: "カスピ海への足がかりを得て、東方交易の富が流れ込む。"
 STATIC_MODIFIER_NAME_geo_seljuk_mod: "セルジュークの後継者たち"
 STATIC_MODIFIER_DESC_geo_seljuk_mod: "セルジューク朝の遺産を継ぐ勢力を退け、東方の地に十字の権威が戻った。"
 STATIC_MODIFIER_NAME_geo_gates_mod: "アレクサンドロスの門"
 STATIC_MODIFIER_DESC_geo_gates_mod: "北方の隘路を越え、コーカサス以北の諸部族を服従させた。"
 STATIC_MODIFIER_NAME_geo_crimea_mod: "クリミア確保"
 STATIC_MODIFIER_DESC_geo_crimea_mod: "タタールの最後の砦を制圧し、黒海の交易路が開かれた。"
 STATIC_MODIFIER_NAME_geo_black_sea_mod: "黒海の支配"
 STATIC_MODIFIER_DESC_geo_black_sea_mod: "黒海沿岸の大半がグルジアの交易圏として組み込まれた。"
 STATIC_MODIFIER_NAME_geo_tsar_mod: "ツァーリとの盟約"
 STATIC_MODIFIER_DESC_geo_tsar_mod: "ルーシの覇者との関係が確立され、外交網が広がった。"
 STATIC_MODIFIER_NAME_geo_hegemony_mod: "コーカサス覇権"
 STATIC_MODIFIER_DESC_geo_hegemony_mod: "山々と草原、そして黒海——コーカサス全域における覇権が完成した。"
 STATIC_MODIFIER_NAME_geo_trebizond_mod: "トレビゾンドとの盟約"
 STATIC_MODIFIER_DESC_geo_trebizond_mod: "古き友邦との絆が新たにされ、両国の交易が活発化した。"
 STATIC_MODIFIER_NAME_geo_jalayirid_mod: "ジャライール・ウルスの制圧"
 STATIC_MODIFIER_DESC_geo_jalayirid_mod: "ジャライール朝の脅威を排除し、軍の精強さが証明された。"
 STATIC_MODIFIER_NAME_geo_mamluk_mod: "マムルーク朝への進出"
 STATIC_MODIFIER_DESC_geo_mamluk_mod: "東方へと進んだ十字の旗は、砂漠の地平線にも翻り、異教の王たちもその名を耳にしている。"
 STATIC_MODIFIER_NAME_geo_cyprus_mod: "キプロス征服"
 STATIC_MODIFIER_DESC_geo_cyprus_mod: "キプロスの港に停泊するグルジアの商船が、東地中海の香辛料を積み込んでいる。"
 STATIC_MODIFIER_NAME_geo_mesopotamia_mod: "文明のゆりかご"
 STATIC_MODIFIER_DESC_geo_mesopotamia_mod: "チグリスとユーフラテスの肥沃な岸辺から、グルジアの工房へ羊毛と染料が運ばれている。"
 STATIC_MODIFIER_NAME_geo_holy_city_mod: "聖都奪還"
 STATIC_MODIFIER_DESC_geo_holy_city_mod: "聖地エルサレムの奪還により、教会の権威と信仰心が高まった。"
 STATIC_MODIFIER_NAME_geo_light_east_mod: "東方の光"
 STATIC_MODIFIER_DESC_geo_light_east_mod: "東方総主教座の解放により、軍の士気と誉れが高まった。"
 STATIC_MODIFIER_NAME_geo_anatolia_mod: "アナトリア侵攻"
 STATIC_MODIFIER_DESC_geo_anatolia_mod: "マンジケルトの野に再び立ったグルジアの兵たちは、古き屈辱を晴らした誇りを胸に隊列を組んで進んでいる。"
 STATIC_MODIFIER_NAME_geo_downfall_mod: "帝国の没落"
 STATIC_MODIFIER_DESC_geo_downfall_mod: "オスマンの脅威が去ったトビリシの宮廷では、諸国の使節がグルジア王の前に頭を下げている。"
 STATIC_MODIFIER_NAME_geo_beacon_mod: "キリスト教世界の灯台"
 STATIC_MODIFIER_DESC_geo_beacon_mod: "信仰の守護者と呼ばれるグルジア王の名は、同じ十字を戴く国々の宮廷で敬意をもって語られている。"
 STATIC_MODIFIER_NAME_geo_tbilisi_mod: "トビリシ再建"
 STATIC_MODIFIER_DESC_geo_tbilisi_mod: "王都トビリシがかつての栄華を取り戻しつつある。"
 STATIC_MODIFIER_NAME_geo_vineyards_mod: "グルジアのワイン"
 STATIC_MODIFIER_DESC_geo_vineyards_mod: "クヴェヴリの土甕の中で千年の間熟成されてきたワインの香りが、カヘティの谷を満たしている。"
 STATIC_MODIFIER_NAME_geo_literature_mod: "文学の復興"
 STATIC_MODIFIER_DESC_geo_literature_mod: "ムヘドルリ文字の普及により、学問と統治が発展した。"
 STATIC_MODIFIER_NAME_geo_builder_mod: "建設王の遺産"
 STATIC_MODIFIER_DESC_geo_builder_mod: "ダヴィド4世の遺志を継ぎ、諸都市が繁栄への道を歩んでいる。"
 STATIC_MODIFIER_NAME_geo_cathedral_mod: "スヴェティツホヴェリ大聖堂"
 STATIC_MODIFIER_DESC_geo_cathedral_mod: "命の柱の大聖堂が再建され、信仰の中心として輝きを取り戻した。"
 STATIC_MODIFIER_NAME_geo_patriarchate_mod: "全グルジア総主教座"
 STATIC_MODIFIER_DESC_geo_patriarchate_mod: "グルジア教会が総主教座に格上げされ、その権威が広く認められた。"
 STATIC_MODIFIER_NAME_geo_silk_road_mod: "シルクロード交易"
 STATIC_MODIFIER_DESC_geo_silk_road_mod: "東西交易の結節点として、グルジアの都市が富に満ちている。"
 STATIC_MODIFIER_NAME_geo_mountain_fort_mod: "山岳要塞網"
 STATIC_MODIFIER_DESC_geo_mountain_fort_mod: "コーカサスの地形を活かした要塞網が、いかなる大軍をも阻む。"
 STATIC_MODIFIER_NAME_geo_golden_age_mod: "黄金時代の完成"
 STATIC_MODIFIER_DESC_geo_golden_age_mod: "タマル女王とダヴィド4世が築いた黄金時代が、新たな高みに到達した。"
 STATIC_MODIFIER_NAME_geo_constantinople_fall_mod: "帝都ビザンティオンの遺産"
 STATIC_MODIFIER_DESC_geo_constantinople_fall_mod: "千年の都が遺した外交と統治の機構を接収した。ローマ以来の官僚制度と外交儀礼を受け継いだことで、属国はより忠実に従い、併合の手続きも円滑に進む。"
 STATIC_MODIFIER_NAME_geo_golden_age_declaration_mod: "黄金時代の統治網"
 STATIC_MODIFIER_DESC_geo_golden_age_declaration_mod: "コーカサスから地中海まで広がる大帝国を、王道と地方総督の網が結ぶ。タマル女王とダヴィド4世が築いた繁栄は、遠方の属州にまで王権の光を届け、王朝の正統性と威信を不動のものとする。"
