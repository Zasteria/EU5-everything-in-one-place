l_japanese:
 hun_crown_of_saint_stephen_mission_pack: "聖ステファンの王冠"
 hun_crown_of_saint_stephen_mission_pack_DESCRIPTION:0 "1337年、ハンガリー王国はアンジュー家のカーロイ1世（カール・ロベール）の治世下にある。その後継者として聡明なラヨシュ（後の「大王」ラヨシュ1世）が控えており、次代のポーランド同君連合が待ち受ける。カルパティア盆地を中心とするこの王国は、北方・バルカン・オスマン・アドリア海の全方向に拡張の道を持つ。マーチャーシュ（コルヴィヌス）王の黒軍を育て、ブダ宮廷でルネサンスを花開かせ、キリスト教世界の盾として歴史に名を刻め。"
 hun_crown_of_saint_stephen_mission_pack_CRITERIA_DESCRIPTION:0 "ハンガリーとして、北方・バルカン・オスマン・アドリア海の全方面で拡大し、内政改革を完成させよ。"
 hun_crown_of_saint_stephen_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成して「聖ステファンの王冠」の栄光を取り戻せ。"
 hun_crown_of_saint_stephen_mission_pack_BUTTON_DETAILS:0 "アンジュー家からコルヴィヌス王家へ——ハンガリーの栄光を取り戻せ！"

 hun_crown_of_st_stephen: "聖ステファンの王冠"
 hun_crown_of_st_stephen_desc: "聖ステファン（イシュトヴァーン1世）は1000年にハンガリー王国を建国し、キリスト教への改宗を推し進めた。彼が戴く「聖ステファンの王冠」はハンガリー王権の象徴として現在に至るまで神聖視されている。1337年、アンジュー家のラヨシュ1世はこの王冠を継承し、中欧最大の王国の主として君臨している。ブダとエステルゴムを掌握し、王国の基盤を固めよ。"

 hun_angevin_diplomacy: "アンジュー家の外交"
 hun_angevin_diplomacy_desc: "ハンガリーのアンジュー家はナポリ・ポーランド・ボヘミアとの複雑な王位継承関係を持つ。ラヨシュ1世の母エリーザベトはポーランド王カジミェシュ3世の姉妹であり、ポーランド王位継承の可能性が開かれている。同盟網を整備し、アンジュー家の外交的影響力を高めよ。"

 hun_polish_union: "ポーランドとの同君連合"
 hun_polish_union_desc: "1370年、カジミェシュ3世（大王）が後継者なく死去すると、甥であるラヨシュ1世がポーランド王を兼任した。これはハンガリー・ポーランド同君連合の始まりだ。二つの大王国が一人の王の下に統一される——中欧の力の均衡が一変する。"

 hun_bohemian_ambitions: "ボヘミアへの野望"
 hun_bohemian_ambitions_desc: "ボヘミア王国はフス派の本拠地として宗教的混乱が続く。アンジュー家・ルクセンブルク家・ハプスブルク家がボヘミア王位を争う中、ハンガリーも正当な候補者として名乗りを上げる機会がある。プラハを掌握することで「ボヘミア・ハンガリー」二重王国が実現する。"

 hun_lord_of_the_north: "北方の覇者"
 hun_lord_of_the_north_desc: "クラクフとグダニスクを掌握することで、ハンガリーはバルト海まで版図を広げた巨大な中欧帝国となる。かつてのピャスト朝・アンジュー朝ポーランドの栄光がハンガリー王の下に復活する。"


 hun_conquer_serbia: "セルビア征服"
 hun_conquer_serbia_desc: "セルビア王国はコソヴォの戦い（1389年）後にオスマンの属国となりつつある。しかしハンガリーにとってベオグラード（ナンドルフェヘールヴァール）はドナウ川の防衛に不可欠な要衝だ。1440年、スカンデルベグとフニャディ・ヤーノシュがベオグラードを守った歴史的な戦いがここで繰り広げられる。"

 hun_subjugate_wallachia: "ワラキアを従わせる"
 hun_subjugate_wallachia_desc: "ワラキア（ハーヴァシェルフォルド）は歴史的にハンガリーの宗主権を認めてきた。ヴラド（串刺し公）の父ヴラド2世はハンガリー王ジギスムントからドラゴン騎士団員の称号を授けられている。この緩衝国を確実にハンガリーの影響下に置け。"

 hun_subjugate_moldavia: "モルダヴィアを従わせる"
 hun_subjugate_moldavia_desc: "モルダヴィア（モルドヴァ）はドナウ川河口とポーランドの間に位置する緩衝国だ。ハンガリー・ポーランド・オスマンの三国が影響力を争うこの公国を確実にハンガリーの傘下に置くことで、東部国境の安定を確保する。"

 hun_danube_fortress_line: "ドナウの要塞線"
 hun_danube_fortress_line_desc: "ヴェーグヴァール制度（国境要塞システム）はハンガリーが15世紀に発展させた対オスマン防衛システムだ。ドナウ川に沿って配置された多数の要塞が互いに連絡を取り合い、オスマン軍の侵攻を食い止める防衛線を形成する。この制度こそがハンガリーをキリスト教世界の最初の盾にした。"

 hun_order_of_the_dragon: "ドラゴン騎士団"
 hun_order_of_the_dragon_desc: "ドラゴン騎士団は1408年にハンガリー王ジギスムントが設立した宗教騎士団だ。ヴラド2世・スカンデルベグ・フニャディ・ヤーノシュなどが団員として知られる。この騎士団はハンガリー貴族を対オスマン十字軍の旗の下に統合し、キリスト教世界の守護者としての使命を体現する。"

 hun_crusade_preparations: "十字軍の準備"
 hun_crusade_preparations_desc: "フニャディ・ヤーノシュ（ヨハン・フォン・フニャド）は15世紀最大の対オスマン十字軍戦士だ。1442〜43年の長距離遠征でオスマン軍を連破し、キリスト教世界に希望をもたらした。しかし1444年のヴァルナの戦いでの敗北は、ポーランド・ハンガリー連合軍の壊滅をもたらした。今度こそ、十分な準備で臨め。"

 hun_battle_of_nicopolis: "ニコポリスの戦い"
 hun_battle_of_nicopolis_desc: "1396年のニコポリスの戦いは、ハンガリー王ジギスムント率いるヨーロッパ十字軍連合がオスマン軍に大敗した歴史的決戦だ。この敗北はバルカン半島のオスマン支配を確立させた。しかし今回は違う——十分な準備を整えたハンガリーがニコポリスを奪還し、バルカン奪回への扉を開く。"

 hun_black_army: "黒軍の創設"
 hun_black_army_desc: "マーチャーシュ・コルヴィヌス王が1458年頃に創設した「黒軍（ニグル・エクセルシトゥス）」は、傭兵と常備軍を統合したヨーロッパ最先端の職業軍だった。黒色の鎧を纏い、火器を積極的に採用したこの軍隊は、オスマン・ハプスブルク両方との戦いで恐れられた。莫大な維持費を支払う価値がある——この軍こそがハンガリーの覇権の要だ。"

 hun_bulwark_of_christendom: "キリスト教世界の盾"
 hun_bulwark_of_christendom_desc: "ハンガリーは数世紀にわたってキリスト教世界の最前線でオスマン帝国と戦い続けた。ついにオスマン帝国がヨーロッパから駆逐された今、教皇・皇帝・ヨーロッパ列強がハンガリー王に最大の賛辞を送る——「キリスト教世界の盾（アンテムラーレ・クリスティアニタティス）」の称号だ。"

 hun_croatian_union: "クロアチアとの同君連合"
 hun_croatian_union_desc: "1102年のパクタ・コンヴェンタ（合意書）以来、クロアチア王国はハンガリー王国と同君連合を形成してきた。クロアチア貴族がハンガリー王を自らの王として認める代わりに、クロアチアは広範な自治権を保持する。この歴史的な連合を強化し、アドリア海への出口を確保せよ。"

 hun_reclaim_dalmatia: "ダルマチアの奪還"
 hun_reclaim_dalmatia_desc: "ダルマチア沿岸はかつてハンガリー・クロアチア王国の領土だったが、ヴェネツィア共和国が1409年に购入して以来、ヴェネツィアの支配下にある。スプリット・ラグーザ（ドゥブロヴニク）を奪還することでアドリア海への確実なアクセスを取り戻し、イタリアへの道を開く。"

 hun_adriatic_supremacy: "アドリア海の覇権"
 hun_adriatic_supremacy_desc: "ヴェネツィアが長年独占してきたアドリア海の制海権を奪取する時が来た。「アドリア海の花嫁」と呼ばれたヴェネツィアの覇権に終止符を打ち、ハンガリー・クロアチアの旗がアドリア海に翻る。"

 hun_angevin_naples: "アンジュー家のナポリ継承"
 hun_angevin_naples_desc: "ハンガリーのアンジュー家はナポリ王国の王位継承権を有している。ラヨシュ1世は1347年と1350年の二度にわたってナポリを占領した。今こそアンジュー家の権利を完全に実現し、ハンガリー王がナポリを永続的に支配する時だ。"

 hun_strengthen_estates: "身分制議会の強化"
 hun_strengthen_estates_desc: "ハンガリーの貴族と聖職者は1222年の黄金勅書（アランニュ・ブッラ）で広範な特権を獲得した。この伝統的な身分制度を活用し、貴族・聖職者の支持を固めることで王権の正統性を高める。ただし特権を与えすぎると後に問題となることもある——適切なバランスを保て。"

 hun_tripartitum: "トリパルティトゥム法典"
 hun_tripartitum_desc: "1514年にヴェルベーツィ・イシュトヴァーンが編纂した「トリパルティトゥム（三部法典）」はハンガリーの慣習法を体系化した法典だ。貴族の特権・農民の義務・国王の権限を明確に規定するこの法典は、ハンガリー法律制度の基盤となる。しかし農民の農奴化を固定化する側面もあり、1514年のドージャ・ジョルジの農民反乱の遠因ともなった。"

 hun_matthias_reforms: "マーチャーシュ王の改革"
 hun_matthias_reforms_desc: "コルヴィヌス・マーチャーシュ王（1458〜90年在位）は「正義のマーチャーシュ」と呼ばれるハンガリー史上最大の英雄王だ。中央集権的な課税制度・常備軍（黒軍）の整備・ルネサンス文化の積極的導入——その改革はハンガリーを中欧最強の国家に変えた。"

 hun_buda_renaissance: "ブダのルネサンス"
 hun_buda_renaissance_desc: "マーチャーシュ王の宮廷はイタリア・ルネサンスをハンガリーに輸入した。ブダ王宮図書館「コルヴィナ図書館」にはラテン語・ギリシャ語の写本が何千冊も所蔵され、ヨーロッパ中から学者・芸術家が集まった。このルネサンス文化の花開きがハンガリーを中欧の文化的中心地に変える。"

 hun_great_hungary: "大ハンガリー"
 hun_great_hungary_desc: "バルカン・ポーランド・ボヘミア・ダルマチア——ハンガリー王国はカルパティア盆地を遥かに超えた大帝国に成長した。コルヴィヌス家の黒軍・ブダのルネサンス宮廷・ドナウの要塞線——これら全てが一体となって、かつてないほど強力なハンガリーを作り上げた。"

 hun_glory_of_st_stephen: "聖ステファンの王冠の栄光"
 hun_glory_of_st_stephen_desc: "千年前に聖ステファンが建国したハンガリー王国は、今や中欧・バルカンを支配する大帝国となった。北はバルト海、南はアドリア海・地中海、東はカルパティア山脈を越えた広大な版図——聖ステファンの王冠はかつてない輝きを放っている。「キリスト教世界の盾」として名高いハンガリーの栄光が極限に達した。"


 hun_events.99.t: "聖ステファンの王冠の栄光"
 hun_events.99.d: "かつて聖ステファン王が夢見た「聖ステファンの王国」——その版図は今や中欧・バルカン・アドリア海・地中海にまで広がった。ポーランド・ボヘミア・クロアチアを包摂し、オスマンをバルカンから駆逐し、ナポリのアンジュー家の権利を回復した。ブダ宮廷のルネサンスはヨーロッパ中に名声を轟かせ、黒軍はいかなる敵にも恐れられる。聖ステファンの王冠は今、史上最大の輝きを放っている。"
 hun_events.99.a: "聖ステファンよ、我らはあなたの夢を実現した！"
 STATIC_MODIFIER_NAME_hun_angevin_prestige_mod: "アンジュー家の威光"
 STATIC_MODIFIER_DESC_hun_angevin_prestige_mod: "1308年、フランス・アンジュー家の王子カーロイ（カール・ロベール）がハンガリー王位を継承した。ナポリ・シチリア・プロヴァンス・ポーランドに連なるこの王家の血統は、ハンガリーをヨーロッパ外交の中心舞台に引き上げた。アヴィニョンの教皇庁もウィーンのハプスブルクも、このアンジュー家の宮廷を無視することはできない。"

 STATIC_MODIFIER_NAME_hun_angevin_diplomacy_mod: "アンジュー家の外交網"
 STATIC_MODIFIER_DESC_hun_angevin_diplomacy_mod: "ナポリからポーランドまで嫁いだアンジュー家の姫君たちの書簡が、ヴィシェグラードの宮廷に絶えず届いている。"
 STATIC_MODIFIER_NAME_hun_bohemian_crown_mod: "ボヘミア王冠"
 STATIC_MODIFIER_DESC_hun_bohemian_crown_mod: "ボヘミア王冠の獲得により、ハンガリー・ポーランド・ボヘミア三重王国が形成された。"
 STATIC_MODIFIER_NAME_hun_northern_lord_mod: "北方の覇者"
 STATIC_MODIFIER_DESC_hun_northern_lord_mod: "バルト海への出口を獲得したハンガリーは、北欧・東欧交易の要衝を握る大国となった。"
 STATIC_MODIFIER_NAME_hun_wallachian_buffer_mod: "ワラキア緩衝国"
 STATIC_MODIFIER_DESC_hun_wallachian_buffer_mod: "ワラキアがハンガリーの緩衝国として機能し、東部国境の安定を確保する。"
 STATIC_MODIFIER_NAME_hun_moldavian_buffer_mod: "モルダヴィア緩衝国"
 STATIC_MODIFIER_DESC_hun_moldavian_buffer_mod: "モルダヴィアがハンガリーの影響下に置かれ、東部国境が二重に守られる。"
 STATIC_MODIFIER_NAME_hun_vegvar_system_mod: "ヴェーグヴァール要塞システム"
 STATIC_MODIFIER_DESC_hun_vegvar_system_mod: "ドナウ川沿いに整備された要塞網がオスマン帝国の侵攻を組織的に阻む。ハンガリーはキリスト教世界の最前線の盾となる。"
 STATIC_MODIFIER_NAME_hun_dragon_order_mod: "ドラゴン騎士団"
 STATIC_MODIFIER_DESC_hun_dragon_order_mod: "ジギスムント王が設立したドラゴン騎士団が貴族と軍を一致団結させる。対オスマン十字軍の精神的支柱となる。"
 STATIC_MODIFIER_NAME_hun_crusade_zeal_mod: "十字軍の熱狂"
 STATIC_MODIFIER_DESC_hun_crusade_zeal_mod: "フニャディ・ヤーノシュの旗の下に集った十字軍の熱狂は、いまも兵たちの胸に燃え続けている。"
 STATIC_MODIFIER_NAME_hun_black_army_mod: "黒軍"
 STATIC_MODIFIER_DESC_hun_black_army_mod: "マーチャーシュ・コルヴィヌス王が創設した「フェケテ・セレグ（黒軍）」は、黒い鎧に身を包んだ数万の傭兵と常備兵から成る当時ヨーロッパ最先端の軍隊だった。ボヘミアのフス派騎士を中核とするこの軍は火器を積極的に採用し、オスマンもハプスブルクも等しく恐れた。その維持費は王室財政を圧迫したが、この軍があればこそハンガリーは列強の間で生き残れた。"
 STATIC_MODIFIER_NAME_hun_christendom_bulwark_mod: "キリスト教世界の盾"
 STATIC_MODIFIER_DESC_hun_christendom_bulwark_mod: "オスマン帝国をヨーロッパから駆逐したハンガリーは「アンテムラーレ・クリスティアニタティス」の栄誉を担う。"
 STATIC_MODIFIER_NAME_hun_adriatic_coast_mod: "アドリア海沿岸の掌握"
 STATIC_MODIFIER_DESC_hun_adriatic_coast_mod: "ダルマチアの奪還によりハンガリーはアドリア海への直接アクセスを獲得した。"
 STATIC_MODIFIER_NAME_hun_angevin_italy_mod: "アンジュー家のイタリア"
 STATIC_MODIFIER_DESC_hun_angevin_italy_mod: "ナポリを掌握したハンガリー・アンジュー家が南イタリアを支配する。"
 STATIC_MODIFIER_NAME_hun_golden_bull_mod: "黄金勅書の伝統"
 STATIC_MODIFIER_DESC_hun_golden_bull_mod: "1222年の黄金勅書（アランニュ・ブッラ）の精神を継承した身分制度が王国の安定を支える。"
 STATIC_MODIFIER_NAME_hun_tripartitum_mod: "トリパルティトゥム法典"
 STATIC_MODIFIER_DESC_hun_tripartitum_mod: "1514年、イシュトヴァーン・ヴェルベーツィが編纂した「トリパルティトゥム（三部法典）」はハンガリー慣習法の集大成だ。貴族の「一と同じ自由」・農民の農奴化・国王の権限の三部から成るこの法典は、ドジャ・ジョルジの農民反乱という血の代償を経てもなお、ハンガリー社会の根幹として機能し続けた。"
 STATIC_MODIFIER_NAME_hun_matthias_admin_mod: "マーチャーシュ王の行政改革"
 STATIC_MODIFIER_DESC_hun_matthias_admin_mod: "マーチャーシュ王が「正義のマーチャーシュ（イガジシャーグォシュ・マーチャーシュ）」と呼ばれたのは、身分を問わず裁判を行い、大貴族の横暴から農民を守ったからだ。彼は中央集権的な官僚制を整備し、地方貴族の権限を削ぎ、王権を直接農村にまで及ぼした。その統治はハンガリー史上最も完成された王権の姿と称される。"
 STATIC_MODIFIER_NAME_hun_buda_renaissance_mod: "ブダのルネサンス"
 STATIC_MODIFIER_DESC_hun_buda_renaissance_mod: "マーチャーシュ王の宮廷には、イタリアから招かれた人文主義者・建築家・彫刻家・音楽家が集まった。ブダ王宮はウィーンよりも豪華なルネサンス様式で改築され、「コルヴィナ文庫」には古典ギリシャ・ローマの写本が5000冊以上収蔵された。マーチャーシュ王の死後、ある人文主義者はこう嘆いた——「マーチャーシュ王は死んだ。正義も消えた」と。"
 STATIC_MODIFIER_NAME_hun_great_hungary_mod: "大ハンガリー"
 STATIC_MODIFIER_DESC_hun_great_hungary_mod: "中欧・バルカン・アドリア海にまたがる大ハンガリー帝国が完成した。"

 hun_baltic_trade: "バルト海交易の掌握"
 hun_baltic_trade_desc: "グダニスクはハンザ同盟の要衝であり、北海・バルト海を結ぶ交易の中心地だ。この港市を掌握したハンガリーはバルト海の琥珀・毛皮・木材交易に参入し、西欧との直接交易路を確保できる。ハンガリーが内陸の農業国から海洋交易国家へと変貌する転換点だ。"
 hun_hre_influence: "神聖ローマへの影響力"
 hun_hre_influence_desc: "ポーランド・ボヘミアを掌握したハンガリーは神聖ローマ帝国の最大の隣国となった。外交的評判と複数の同盟を通じてハンガリーの影響力をドイツ諸侯に及ぼし、ハプスブルク家の覇権に対抗せよ。"
 hun_challenge_habsburgs: "ハプスブルクへの挑戦"
 hun_challenge_habsburgs_desc: "オーストリアのハプスブルク家はハンガリーの永遠の宿敵であり競争相手だ。ウィーンを掌握することでドナウ川流域の覇権がハンガリーに移る。EU4でのハンガリー最大の野望——「ハプスブルクを打倒してHRE皇帝になれ」——がここに実現する。"
 hun_conquer_bulgaria: "ブルガリア征服"
 hun_conquer_bulgaria_desc: "ブルガリア第二帝国はオスマンによって1396年に滅ぼされた。しかしハンガリーがバルカンを制圧した今、ソフィアとタルノヴォを回復し、かつての栄光をハンガリー王冠の下に復活させる。"
 hun_conquer_greece: "ギリシャ征服"
 hun_conquer_greece_desc: "アテネとテッサロニキ——古代ギリシャ文明の二大都市をハンガリーが掌握する。ビザンツ帝国の滅亡後に分裂したギリシャ諸侯を統一し、バルカン半島の南端まで版図を伸ばせ。"
 hun_balkan_empire: "バルカン帝国"
 hun_balkan_empire_desc: "セルビア・ブルガリア・ギリシャ・ワラキア・モルダヴィアを全て掌握したハンガリーはバルカン半島の真の支配者となった。かつてのビザンツ帝国・オスマン帝国がバルカンで築いた覇権がハンガリーの下に集約される。"
 hun_push_into_anatolia: "アナトリアへの進出"
 hun_push_into_anatolia_desc: "コンスタンティノープルを掌握したハンガリーは今や二つの大陸にまたがる国家だ。ビザンツ帝国が失った小アジアを奪還し、オスマン帝国の心臓部を突く十字軍を発動せよ。"
 hun_hungarian_crusade: "ハンガリー十字軍"
 hun_hungarian_crusade_desc: "エルサレムを解放したハンガリー王はキリスト教世界の英雄となる。聖ステファン以来の夢——聖地をキリスト教徒の手に取り戻すこと——が遂に実現した。ドラゴン騎士団の創設者ジギスムントが夢見た聖戦の勝利がここに刻まれる。"
 hun_mediterranean_fleet: "地中海艦隊"
 hun_mediterranean_fleet_desc: "ナポリとシチリアを掌握したハンガリーは地中海の主要な海軍国家となった。30隻以上の艦船を保有する艦隊が地中海の制海権を争う。かつてヴェネツィアが独占した地中海がハンガリーのものとなる。"
 hun_conquer_north_africa: "北アフリカ征服"
 hun_conquer_north_africa_desc: "チュニスを掌握することでハンガリーは地中海の南岸にも版図を広げる。バルバリア海賊の本拠地を制圧し、地中海通商の障害を排除せよ。ハンガリーの国旗が地中海の南端に翻る。"
 hun_latin_empire: "ラテン帝国の復興"
 hun_latin_empire_desc: "コンスタンティノープル・ローマ・ナポリを掌握したハンガリー王は「ラテン帝国」の後継者を自称できる。1204年の第四次十字軍が樹立したラテン帝国の夢が、今度は正当な征服によって実現される。キリスト教世界最大の帝国がここに誕生する。"
 hun_corvinus_library: "コルヴィナ図書館"
 hun_corvinus_library_desc: "マーチャーシュ王が収集した「コルヴィナ文庫」は当時ヨーロッパ最大のラテン語・ギリシャ語写本コレクションだった。5000冊以上の写本がブダ王宮に収蔵され、イタリア・フランス・ドイツから学者・芸術家が集まった。この文化投資がハンガリーを中欧ルネサンスの中心地に変える。"
 hun_hungarian_church: "ハンガリー教会の整備"
 hun_hungarian_church_desc: "エステルゴムの大主教座を中心とするハンガリー教会を整備し、聖職者の支持を固める。宗教改革の波が押し寄せる前に、カトリック教会とハンガリー王権の関係を確固たるものにせよ。"
 hun_economic_powerhouse: "黄金のドナウ"
 hun_economic_powerhouse_desc: "バルカン・北方・アドリア海にまたがる版図を持つハンガリーは、複数の主要交易路の交差点に位置する経済大国となった。ドナウ川流域の農業生産・トランシルヴァニアの銀山・地中海の交易収入が合わさって莫大な富を生み出す。"
 hun_danube_empire: "ドナウ帝国"
 hun_danube_empire_desc: "ポーランド・ボヘミア・バルカン・アドリア海・地中海にまたがる広大な版図、整備された行政制度、豊かな経済基盤——ハンガリーはドナウ川を中心とする「ドナウ帝国」となった。かつてのオーストリア＝ハンガリー帝国が夢見た多民族複合国家が、今度はハンガリー主導の下に実現する。"
 STATIC_MODIFIER_NAME_hun_baltic_trade_mod: "バルト海交易"
 STATIC_MODIFIER_DESC_hun_baltic_trade_mod: "グダニスクの港に停泊するハンガリーの商船が、琥珀と毛皮を積んで戻ってくる。"
 STATIC_MODIFIER_NAME_hun_habsburg_rival_mod: "ハンガリー・オーストリア"
 STATIC_MODIFIER_DESC_hun_habsburg_rival_mod: "ウィーンの陥落によりハプスブルクの権威が崩れ、ハンガリーがドナウ流域の覇者となる。"
 STATIC_MODIFIER_NAME_hun_bulgaria_mod: "ブルガリアの支配"
 STATIC_MODIFIER_DESC_hun_bulgaria_mod: "ティルノヴォの丘に立つ新しい代官たちは、ハンガリーの言葉と法を南のバルカンの村々に広めている。"
 STATIC_MODIFIER_NAME_hun_greece_mod: "ギリシャの光"
 STATIC_MODIFIER_DESC_hun_greece_mod: "アテネのアクロポリスを仰ぐハンガリーの王は、古代ギリシャの栄光を自らの宮廷の誇りとしている。"
 STATIC_MODIFIER_NAME_hun_balkan_empire_mod: "バルカン帝国"
 STATIC_MODIFIER_DESC_hun_balkan_empire_mod: "ドナウからペロポネソスまで、バルカンのあらゆる城壁に聖イシュトヴァーンの王冠の旗が翻っている。"
 STATIC_MODIFIER_NAME_hun_new_crusade_mod: "新十字軍"
 STATIC_MODIFIER_DESC_hun_new_crusade_mod: "コンスタンティノープルの城門をくぐった兵たちは、さらに東方へ十字架を掲げて進む誓いを新たにしている。"
 STATIC_MODIFIER_NAME_hun_crusade_victory_mod: "十字軍の完遂"
 STATIC_MODIFIER_DESC_hun_crusade_victory_mod: "エルサレム解放の栄光がハンガリーに未曾有の威信・正統性・外交的権威をもたらす。"
 STATIC_MODIFIER_NAME_hun_med_fleet_mod: "地中海艦隊"
 STATIC_MODIFIER_DESC_hun_med_fleet_mod: "アドリア海の港からは、ハンガリー王の旗を掲げたガレー船が次々と地中海へ漕ぎ出している。"
 STATIC_MODIFIER_NAME_hun_north_africa_mod: "北アフリカ拠点"
 STATIC_MODIFIER_DESC_hun_north_africa_mod: "北アフリカの沿岸では、ハンガリーの商人と海賊狩りの船団が、港から港へ絶えず行き来している。"
 STATIC_MODIFIER_NAME_hun_latin_empire_mod: "ラテン帝国の復興"
 STATIC_MODIFIER_DESC_hun_latin_empire_mod: "コンスタンティノープルとローマとナポリを従える王の名は、あらゆる宮廷で畏敬をもって囁かれている。"
 STATIC_MODIFIER_NAME_hun_corvinus_library_mod: "コルヴィナ図書館"
 STATIC_MODIFIER_DESC_hun_corvinus_library_mod: "コルヴィナ図書館の写字室では、修道士たちが昼も夜もランプの灯りで写本を写し続けている。"
 STATIC_MODIFIER_NAME_hun_church_mod: "ハンガリー教会"
 STATIC_MODIFIER_DESC_hun_church_mod: "強固なハンガリー教会が正統性・立法効率・宗教的安定をもたらす。"
 STATIC_MODIFIER_NAME_hun_economy_mod: "黄金のドナウ"
 STATIC_MODIFIER_DESC_hun_economy_mod: "ドナウを上り下りする荷船と、鉱山から運ばれる荷車が、王国の市場をいつも賑わせている。"
 STATIC_MODIFIER_NAME_hun_danube_empire_mod: "ドナウ帝国"
 STATIC_MODIFIER_DESC_hun_danube_empire_mod: "ドナウ川を中心とする多民族帝国が完成した。税収・人口・行政・立法効率が全て最高水準に達する。"

 hun_transylvanian_mines: "下ハンガリー鉱山の掌握"
 hun_transylvanian_mines_desc: "クレムニツァ（クレムニツ）はハンガリー最大の金貨鋳造所を擁する都市だ。バンスカー・ビストリツァ（バーニャ・ビストリツァ）は中欧最大の銅鉱山で知られる。この二都市を掌握することで、ハンガリーは中欧随一の鉱山国家となる。コルヴィヌス王は1467〜68年にかけてこの地域を帝国直轄地として整備し、鉱山収入を黒軍の財政基盤とした。"
 hun_silver_mines: "バンスカー・シュチャヴニツァの銀山"
 hun_silver_mines_desc: "ホント（バンスカー・シュチャヴニツァ周辺）は下ハンガリー鉱山地帯の中でも最大の銀鉱山地帯だ。この地の銀がハンガリー王の造幣所でターレルに鋳造され、中欧全域の交易を支えた。「下ハンガリー鉱山都市群」として知られるこの地域はハンガリーの経済的心臓部だ。"
 hun_salt_mines: "トランシルヴァニアの岩塩鉱"
 hun_salt_mines_desc: "シゲト（マーラマロシュシゲト）とトゥルダは古代から採掘されてきた岩塩鉱山を擁する。塩はかつて「白い金」と呼ばれるほど重要な商品であり、ハンガリーの塩の専売制は王室財政の重要な柱だった。この岩塩鉱を掌握し、独占的な塩交易を確立せよ。"
 hun_tokaj_wine: "トカイのワイン"
 hun_tokaj_wine_desc: "シャートラヤーウーイヘイ周辺のトカイ地方は「ワインの王、王のワイン」と称される貴腐ワイン「トカイ・アスー」の産地だ。教皇ベネディクトゥス14世がルイ15世に贈ったほどの名酒が、このハンガリーの丘陵地帯から生まれる。ブドウ園を整備し、ヨーロッパ最高級のワインを輸出せよ。"
 hun_mining_empire: "鉱山帝国"
 hun_mining_empire_desc: "クレムニツァの金貨・ホントの銀・バンスカー・ビストリツァの銅・シゲトとトゥルダの塩——ハンガリーの地下資源が全て掌握された。中欧最大の鉱山国家として、ハンガリーは金属の輸出から莫大な収入を得る。この富がマーチャーシュ王の黒軍を支え、ルネサンス宮廷の栄光を可能にした。"
 hun_buda_capital: "ブダとペストの整備"
 hun_buda_capital_desc: "ドナウ川を挟んで向かい合うブダとペストは、ハンガリー王国の心臓部だ。ブダの王宮と大市場・ペストの商業港——この双子都市が繁栄することでハンガリー全体の経済が活性化する。マーチャーシュ王の宮廷はヨーロッパ最大の規模を誇り、中欧のルネサンスの中心地として知られた。"
 hun_upper_hungary_cities: "上ハンガリーの都市整備"
 hun_upper_hungary_cities_desc: "ブラティスラヴァ（ポジョニ）はハプスブルクに対する西部の門戸であり、コシツェ（カッサ）は上ハンガリー最大の商業都市、トルナヴァ（ナジソンバト）は司教座都市だ。この三都市を整備することで上ハンガリー（現スロヴァキア）が経済・政治の要衝となる。"
 hun_pannonian_cities: "パンノニアの都市整備"
 hun_pannonian_cities_desc: "ジェール（ラーバ）はオーストリア国境の要塞都市、ショプロン（エーデンブルク）はハンガリー西端の豊かな商業都市、ペーチ（フュンフキルヘン）は1367年にラヨシュ1世が創設した中央ヨーロッパ最古の大学都市の一つだ。これらパンノニア地方の都市を整備してハンガリー西部を繁栄させよ。"
 hun_great_plain_cities: "大平原の都市整備"
 hun_great_plain_cities_desc: "デブレツェン（カルヴァン主義の中心地）・セゲド（ティサ川の要衝）・ケチケメート（大平原の牧畜都市）——ハンガリー大平原（プスタ）の主要都市を整備し、この広大な農業地帯の潜在力を引き出せ。大平原の牛・羊・穀物がハンガリーの主要輸出品となる。"
 hun_transylvania_cities: "トランシルヴァニア都市整備"
 hun_transylvania_cities_desc: "コロジュヴァール（クルジュ）はトランシルヴァニアの政治・文化的中心地、ナジュヴァーラド（オラデア）は聖ラースロー王の聖地として知られる巡礼都市、ミシュコルツはハンガリー北東部の工業都市だ。トランシルヴァニアの多民族地域を都市整備を通じて統合せよ。"
 hun_kingdom_of_cities: "都市王国"
 hun_kingdom_of_cities_desc: "クレムニツァの金・ホントの銀・トカイのワイン・ブダの宮廷・コシツェの商業・ペーチの大学・デブレツェンの農業・コロジュヴァールの文化——ハンガリー王国の全都市が有機的に連携し、中欧最大の経済圏が完成した。都市の繁栄がハンガリー帝国の力の真の源泉となる。"
 STATIC_MODIFIER_NAME_hun_kremnica_mint_mod: "クレムニツァの造幣局"
 STATIC_MODIFIER_DESC_hun_kremnica_mint_mod: "クレムニツァ（ケルメツバーニャ）の造幣局は1328年にカーロイ1世が設立した。ここで鋳造された「フォリント」金貨はフィレンツェのフィオリーノと並んで中欧最高品質の通貨と見なされ、バルト海からコンスタンティノープルまで流通した。"
 STATIC_MODIFIER_NAME_hun_banska_copper_mod: "バンスカー・ビストリツァの銅山"
 STATIC_MODIFIER_DESC_hun_banska_copper_mod: "バンスカー・ビストリツァの坑道では、銅を掘る槌の音が絶えることなく響いている。"
 STATIC_MODIFIER_NAME_hun_hont_silver_mod: "バンスカー・シュチャヴニツァの銀山"
 STATIC_MODIFIER_DESC_hun_hont_silver_mod: "ホントの銀山から掘り出された銀が、王室の造幣所へと運ばれていく。"
 STATIC_MODIFIER_NAME_hun_salt_mine_mod: "岩塩鉱山"
 STATIC_MODIFIER_DESC_hun_salt_mine_mod: "古代ローマの時代から掘られてきた岩塩の坑道が、いまも王国の食卓を支えている。"
 STATIC_MODIFIER_NAME_hun_tokaj_wine_mod: "トカイ・アスーのブドウ園"
 STATIC_MODIFIER_DESC_hun_tokaj_wine_mod: "トカイの丘のブドウ園で熟した貴腐の房が、「ワインの王」となって諸国の宮廷へ運ばれていく。"
 STATIC_MODIFIER_NAME_hun_buda_capital_mod: "ブダ王都の整備"
 STATIC_MODIFIER_DESC_hun_buda_capital_mod: "ドナウを見下ろすブダの王宮の窓からは、行き交う商船の帆が絶えず見渡せる。"
 STATIC_MODIFIER_NAME_hun_pest_trade_mod: "ペストの交易港"
 STATIC_MODIFIER_DESC_hun_pest_trade_mod: "ペストの船着き場では、荷揚げ人足たちの掛け声が朝から晩まで響いている。"
 STATIC_MODIFIER_NAME_hun_bratislava_gateway_mod: "ポジョニの交通要衝"
 STATIC_MODIFIER_DESC_hun_bratislava_gateway_mod: "ポジョニの城門は、オーストリアへ向かう荷馬車と王の使者が肩を並べて通る要衝となった。"
 STATIC_MODIFIER_NAME_hun_kosice_commerce_mod: "カッサの商業中心"
 STATIC_MODIFIER_DESC_hun_kosice_commerce_mod: "カッサの市場広場では、ポーランドやシレジアから来た商人たちが、上ハンガリーの品を競って買い付けている。"
 STATIC_MODIFIER_NAME_hun_pecs_university_mod: "ペーチ大学"
 STATIC_MODIFIER_DESC_hun_pecs_university_mod: "ペーチの大学の回廊では、ラヨシュ1世の遺志を継ぐ学徒たちが、ラテン語の講義に耳を傾けている。"
 STATIC_MODIFIER_NAME_hun_gyor_fortress_mod: "ジェールの要塞"
 STATIC_MODIFIER_DESC_hun_gyor_fortress_mod: "ジェールの城壁の上では、オーストリア国境を見張る歩哨が夜通し松明を掲げている。"
 STATIC_MODIFIER_NAME_hun_debrecen_agri_mod: "デブレツェンの農業都市"
 STATIC_MODIFIER_DESC_hun_debrecen_agri_mod: "デブレツェンの市場には、大平原で育った牛の群れと小麦の荷が絶えず運び込まれている。"
 STATIC_MODIFIER_NAME_hun_szeged_trade_mod: "セゲドの交易港"
 STATIC_MODIFIER_DESC_hun_szeged_trade_mod: "ティサ川とドナウ川の合流点付近に位置するセゲドが内陸交易の要衝として整備された。"
 STATIC_MODIFIER_NAME_hun_cluj_center_mod: "コロジュヴァールの中心"
 STATIC_MODIFIER_DESC_hun_cluj_center_mod: "コロジュヴァールの市場と学舎には、ドイツ人、ハンガリー人、ルーマニア人の声が入り混じっている。"
 STATIC_MODIFIER_NAME_hun_oradea_pilgrimage_mod: "ナジュヴァーラドの巡礼地"
 STATIC_MODIFIER_DESC_hun_oradea_pilgrimage_mod: "聖ラースロー王の遺骸を祀るナジュヴァーラドの大聖堂へ、王国じゅうから巡礼者の列が続いている。"
 STATIC_MODIFIER_NAME_hun_mining_empire_mod: "鉱山帝国"
 STATIC_MODIFIER_DESC_hun_mining_empire_mod: "金、銀、銅、塩——王国の坑道から掘り出される富の量は、いまや中欧のどの国も及ばない。"
 STATIC_MODIFIER_NAME_hun_kingdom_of_cities_mod: "都市王国"
 STATIC_MODIFIER_DESC_hun_kingdom_of_cities_mod: "ブダからコロジュヴァールまで、王国の都市の市場は互いの荷を融通し合い、一つの大きな経済圏として息づいている。"

 hun_secure_transylvania: "トランシルヴァニアの掌握"
 hun_secure_transylvania_desc: "トランシルヴァニアはハンガリー王国の東部に位置し、コロジュヴァール（クルジュ）とブラショフ（ブラッソー）という二大都市を中心に発展してきた。ハンガリー人・ザクセン人・ルーマニア人（ヴラフ人）が共存するこの地は、古くからハンガリー王国の核心領土だ。豊富な財源を投入してこの地を本格的に整備し、トランシルヴァニアの二大都市のどちらかを大都市に昇格させよ。"
 hun_events.20.t: "トランシルヴァニアの掌握"
 hun_events.20.d: "コロジュヴァールとブラショフを確保し、1000ダカット以上の財源でトランシルヴァニア整備に乗り出した。コロジュヴァール（ラテン語：クラウゼンブルク、ルーマニア語：クルージ）はトランシルヴァニア最大の都市であり、ザクセン人入植者が築いた商業都市ブラショフ（ラテン語：コロナ、ドイツ語：クロンシュタット）はワラキアとの交易の要衝だ。どちらの都市を優先的に整備するか——この決断がトランシルヴァニアの発展の方向性を定める。"
 hun_events.30.t: "パクタ・コンヴェンタ——クロアチアとの歴史的合意"
 hun_events.30.d: "1102年、ハンガリー王カールマーン（コロマン）はクロアチア貴族12族の代表とパクタ・コンヴェンタ（合意書）を締結した。クロアチア貴族はハンガリー王を自らの王として認める代わりに、クロアチアは自治権と独自の法制度を保持することが保証された。この歴史的合意から200年以上が経過した今、ハンガリーとクロアチアの関係を改めて整理する時が来た。クロアチアを正式な封土（フィーフダム）として組み込むことで法的地位を明確化するか、あるいは現在の柔軟な同盟関係を維持するか——選択はハンガリー王にある。"

 hun_events.30.a: "クロアチアを封土（fiefdom）として正式に組み込む"
 hun_events.30.b: "現状の関係を維持する（威信+10）"


 hun_events.20.a: "コロジュヴァールを都市に昇格させ（1000ダカット消費）"
 hun_events.20.b: "ブラショフを都市に昇格させ（1000ダカット消費）"


 STATIC_MODIFIER_NAME_hun_eternal_crown_mod: "聖ステファンの永遠の王冠"
 STATIC_MODIFIER_DESC_hun_eternal_crown_mod: "聖ステファン（イシュトヴァーン1世）は紀元1000年の降誕祭に教皇シルウェステル2世から王冠を授かった。この王冠——後に「聖ステファンの王冠」と呼ばれる——はハンガリーという国家の本質そのものと見なされ、王冠なき王は「ハンガリーの王」ではないとされた。外交使節が各地から王宮に参集し、世界中がハンガリーの栄光を認める。"
