l_japanese:
 VEN_DOGES_PALACE_EVENT_OCCURRED: "イベント「ドゥカーレ宮殿の拡張」が発生している"
 ven_mainland_food_crisis: "本土の食糧問題"
 ven_mainland_food_crisis_desc: "ヴェネツィアは潟に浮かぶ都市であり、本土からの穀物供給に依存している。安定した食糧供給網を確立せよ。"

 ven_scaliger_war: "スカリジェリ戦争"
 ven_scaliger_war_desc: "ヴェローナを支配するスカラ家との戦争に勝利し、トレヴィーゾとヴィチェンツァを確保せよ。"

 ven_mainland_consolidation: "本土の安定化"
 ven_mainland_consolidation_desc: "新たに獲得した本土領を行政的に統合し、貴族や統治機構との関係を安定させよ。"

 ven_terraferma_expansion: "テラフェルマの拡大"
 ven_terraferma_expansion_desc: "ヴェローナとベルガモを征服し、本土領テラフェルマをさらに拡大せよ。"

 ven_warehouse_expansion: "倉庫の拡張"
 ven_warehouse_expansion_desc: "増大する貿易量に対応するため、ヴェネツィアの倉庫設備を拡張せよ。"

 ven_piazza_san_marco: "サン・マルコ広場の整備"
 ven_piazza_san_marco_desc: "共和国の象徴であるサン・マルコ広場を整備し、貴族たちの威信を高めよ。"

 ven_canal_administration: "水路の管理"
 ven_canal_administration_desc: "ヴェネツィアを縦横に走る運河網を整備し、海軍の運用効率を高めよ。"

 ven_fondaco: "フォンダコ"
 ven_fondaco_desc: "外国商人のための商館（フォンダコ）網を整備し、貿易拠点を拡充せよ。"

 ven_bridge_of_wealth: "富の橋の繁栄"
 ven_bridge_of_wealth_desc: "潟を渡る橋には、フォンダコへ向かう商人たちの列が絶えない。この橋を中心とした商業区を整備し、富の流れをさらに太くせよ。"


 ven_doges_palace: "ドゥカーレ宮殿の改修"
 ven_doges_palace_desc: "総督の権威を象徴するドゥカーレ宮殿を整備し、共和国の統治体制を強化せよ。"
 ven_doges_palace_event_occurred_tt: "決断「ドゥカーレ宮殿の拡張」を使用した"

 ven_arsenal: "アルセナーレ・ディ・ヴェネツィア"
 ven_arsenal_desc: "国営造船所アルセナーレを拡張し、共和国の海軍生産能力を世界最高水準に高めよ。"

 ven_marciana_library: "国立マルチャーナ図書館"
 ven_marciana_library_desc: "図書館と大学を備えた国立図書館を設立し、共和国の学術的威信を高めよ。"

 ven_lombardy_hegemony: "ロンバルディアの覇権"
 ven_lombardy_hegemony_desc: "ミラノの市場に共和国の旗が掲げられたことで、ロンバルディア全域の商人たちは新たな盟主を認めた。"

 ven_settling_with_genoa: "ジェノヴァとの決着"
 ven_settling_with_genoa_desc: "長きにわたる商業上の宿敵ジェノヴァとの争いに、最終的な決着をつけよ。その本拠地を手中に収めるか、あるいはジェノヴァそのものをこの世から消し去るのだ。"


 ven_city_of_water: "水の都"
 ven_city_of_water_desc: "潟の都市ヴェネツィアを、水運と商業が織りなす世界に並ぶもののない繁栄の都市として完成させよ。"

 ven_secure_ferrara: "フェラーラの確保"
 ven_secure_ferrara_desc: "エステ家が支配するフェッラーラを獲得し、ポー川流域への足がかりを得よ。"

 ven_northern_expansion: "北方への拡大"
 ven_northern_expansion_desc: "トレントとウーディネを確保し、アルプスの峠道を見据えた北方への拡大を進めよ。"

 ven_papal_conflict: "教皇領との対立"
 ven_papal_conflict_desc: "フェッラーラの帰属を巡り、教皇領との緊張が高まっている。この対立を乗り越えよ。"

 ven_alpine_trade: "アルプスを越える商売"
 ven_alpine_trade_desc: "アルプスの峠を越える隊商は、いまや単一の市場に縛られることなく、複数の市場の中心地を結ぶ広範な交易網を築き上げている。"

 ven_render_unto_caesar: "神のものは神に、商人のものは商人に"
 ven_render_unto_caesar_desc: "聖職者と市民、双方の信頼を得た共和国は、永遠の都ローマにおいてさえ、その権威を疑われることはない。"

 ven_league_of_cambrai: "カンブレー同盟の攪乱"
 ven_league_of_cambrai_desc: "ヨーロッパ列強が結成したカンブレー同盟の包囲を打ち破り、共和国の独立を守り抜け。"

 ven_terraferma_completed: "テラフェルマの完成"
 ven_terraferma_completed_desc: "本土領テラフェルマの統治体制を完成させ、共和国の権威を北イタリア全域に確立せよ。"

 ven_italian_unity_route: "ラ・セレニッシマ"
 ven_italian_unity_route_desc: "イタリア半島の諸国を主導する大国として、半島の新たな秩序の中心となれ。"

 ven_fleet_unification: "艦隊の準備"
 ven_fleet_unification_desc: "共和国の各艦隊を統合運用し、海軍維持の効率を高めよ。"

 ven_black_sea_insurance: "黒海交易の保険"
 ven_black_sea_insurance_desc: "ネグロポンテを拠点とし、黒海方面への交易路を護衛する体制を整えよ。"

 ven_secure_adriatic: "アドリア海の確保"
 ven_secure_adriatic_desc: "ザラとポーラを確保し、アドリア海の制海権を共和国の手に収めよ。"

 ven_expel_genoa_black_sea: "黒海からのジェノヴァの排除"
 ven_expel_genoa_black_sea_desc: "黒海貿易の要衝カッファとタナを確保し、最大の競争相手ジェノヴァの権益を奪取せよ。"

 ven_aegean_expansion: "エーゲ海での拡大"
 ven_aegean_expansion_desc: "クレタ島とナクソス島を確保し、エーゲ海における共和国の足場を拡大せよ。"

 ven_dalmatian_subjugation: "ダルマチアの制圧"
 ven_dalmatian_subjugation_desc: "クロアチア沿岸全域を確保し、ダルマチア地方を共和国の支配下に置け。"

 ven_dominate_eastern_trade: "東方貿易を支配せよ"
 ven_dominate_eastern_trade_desc: "黒海・地中海東部の交易路を共和国の管理下に置き、東方貿易の支配権を握れ。"

 ven_greek_bridgehead: "ギリシャの橋頭堡"
 ven_greek_bridgehead_desc: "クレタ島とモドンを確保し、ギリシャ本土・エーゲ海への足がかりとなる橋頭堡を築け。"

 ven_pearl_of_adriatic: "アドリア海の真珠の回収"
 ven_pearl_of_adriatic_desc: "交易都市ラグーザの繁栄を取り戻し、「アドリア海の真珠」と称される富を共和国にもたらせ。"

 ven_protect_corfu: "コルフ島の保護"
 ven_protect_corfu_desc: "アドリア海の出入り口を扼するコルフ島に守備隊を配置し、その安全を確保せよ。"

 ven_occupy_cyprus: "キプロス占有"
 ven_occupy_cyprus_desc: "ラルナカを確保し、地中海東部の要衝キプロス島を共和国の領土とせよ。"

 ven_second_conquest_of_constantinople: "二度目の帝都の制圧"
 ven_second_conquest_of_constantinople_desc: "かつて第四回十字軍が成し遂げたように、再びコンスタンティノープルを共和国の手に収めよ。"

 ven_queen_of_the_adriatic: "アドリア海の女王"
 ven_queen_of_the_adriatic_desc: "アドリア海全域の交易・防衛体制を完成させ、共和国を「アドリア海の女王」と呼ばれる地位に押し上げよ。"

 ven_pen_not_sword: "剣ではなく、ペンを持って"
 ven_pen_not_sword_desc: "軍事力ではなく外交と条約によって地中海東部における権益を確保し、共和国の繁栄を持続させよ。"

 ven_latin_empire: "ラテン人の帝国"
 ven_latin_empire_desc: "コンスタンティノープルを中心に新たなラテン人の帝国を打ち立て、共和国を地中海の覇者として歴史に刻め。"
 ven_grand_strategy_mission_pack: "海洋共和国の大戦略"
 ven_grand_strategy_mission_pack_desc: "潟の上に築かれた小さな共和国は、本土への拡大と海上帝国の構築という二つの道を同時に歩む。テラフェルマを完成させ、アドリア海の女王となり、最終的にはイタリアの中心、あるいはラテン人の帝国の継承者として歴史に名を刻め。"
 ven_grand_strategy_mission_pack_BUTTON_TOOLTIP:0 "海と陸の双方で共和国の覇権を確立せよ。"
 ven_grand_strategy_mission_pack_DESCRIPTION:0 "潟の上に築かれた小さな共和国は、本土への拡大と海上帝国の構築という二つの道を同時に歩む。アドリア海の女王として、地中海にその名を刻め。"
 ven_grand_strategy_mission_pack_BUTTON_DETAILS:0 "テラフェルマを完成させ、アドリア海の女王となり、ラテン人の帝国の継承者として、共和国の名を歴史に刻め！"
 ven_grand_strategy_mission_pack_CRITERIA_DESCRIPTION:0 "ヴェネツィアとしてテラフェルマを完成させ、アドリア海の女王となれ。"

 ven_events.1.t: "スカリジェリ家の没落"
 ven_events.1.d: "ヴェローナの僭主スカラ家との戦争は、ヴェネツィアの勝利に終わった。トレヴィーゾとヴィチェンツァの市民たちは、新たな支配者を歓迎する。本土への第一歩が、ここに刻まれた。"
 ven_events.1.a: "新たな領土を歓迎する"

 ven_events.2.t: "テラフェルマの躍進"
 ven_events.2.d: "ヴェローナとベルガモが共和国の旗のもとに加わった。ロンバルディア平原の豊かな農地と商業都市が、ヴェネツィアの経済力をさらに強化する。"
 ven_events.2.a: "新領土の経済発展を支援する"

 ven_events.3.t: "ドゥカーレ宮殿の威光"
 ven_events.3.d: "再建されたドゥカーレ宮殿は、総督の権威と共和国の威信を体現する建築として完成した。広間には貴族たちが集い、共和国の将来を議論する。"
 ven_events.3.a: "宮殿の完成を祝う"

 ven_events.4.t: "アルセナーレの拡張"
 ven_events.4.d: "国営造船所アルセナーレが拡張され、かつてない規模でガレー船と商船が建造されるようになった。共和国の海軍力は新たな高みに達する。"
 ven_events.4.a: "拡張されたアルセナーレを視察する"

 ven_events.5.t: "水の都の完成"
 ven_events.5.d: "運河、商館、図書館、造船所——潟の上に築かれた都市は、世界に類を見ない繁栄を遂げた。「水の都」は、その名にふさわしい姿を完成させた。"
 ven_events.5.a: "水の都の完成を世界に示す"

 ven_events.6.t: "フェッラーラ継承戦争"
 ven_events.6.d: "フェッラーラの帰属を巡り、教皇領との関係が緊張した。聖職者たちは共和国の野心を非難するが、市民たちは新領土の獲得を歓迎している。"
 ven_events.6.a: "教皇領との緊張に対処する"

 ven_events.7.t: "神のものは神に、商人のものは商人に"
 ven_events.7.d: "共和国は、聖職者の特権と世俗の商業活動との境界を明確にした。教会の権威は尊重されるが、貿易と商業は共和国の管理下にあることが改めて確認された。"
 ven_events.7.a: "世俗的権威の確立を宣言する"

 ven_events.8.t: "カンブレー同盟、瓦解"
 ven_events.8.d: "教皇・神聖ローマ皇帝・フランス・スペインが結成したカンブレー同盟は、共和国を分割しようとした。だが内部の対立により同盟は瓦解し、ヴェネツィアは独立を保った。"
 ven_events.8.a: "同盟の瓦解を見届ける"

 ven_events.9.t: "テラフェルマ、完成す"
 ven_events.9.d: "北イタリアの広大な領土が、ついに共和国の統治体制のもとに統合された。テラフェルマは、ヴェネツィアの経済力と軍事力の源泉として揺るぎない基盤を築いた。"
 ven_events.9.a: "テラフェルマの完成を祝う"

 ven_events.10.t: "イタリアの中心"
 ven_events.10.d: "本土と海上の双方で力を蓄えた共和国は、もはやイタリア半島における一地方勢力ではない。諸国はヴェネツィアの動向を注視し、半島の新たな秩序がここに形を成し始める。"
 ven_events.10.a: "イタリアにおける主導的地位を確立する"

 ven_events.11.t: "アドリア海の関門"
 ven_events.11.d: "ザラとポーラが共和国の支配下に入り、アドリア海の出入り口を扼する重要な拠点が確保された。共和国の船団は、より安全に航行できるようになる。"
 ven_events.11.a: "新たな拠点の防備を整える"

 ven_events.12.t: "黒海からの撤退"
 ven_events.12.d: "長年の競争相手ジェノヴァは、黒海貿易における主要な拠点を失った。ヴェネツィアの商人たちは、新たに開かれた市場へと進出を始める。"
 ven_events.12.a: "新市場への進出を支援する"

 ven_events.13.t: "エーゲ海の足場"
 ven_events.13.d: "クレタ島とモドンが確保され、エーゲ海とギリシャ本土への足がかりが整った。共和国の商船は、これらの港を中継地として東方への航路をさらに延伸する。"
 ven_events.13.a: "新たな中継港の整備を進める"

 ven_events.14.t: "キプロスの真珠"
 ven_events.14.d: "ファマグスタとニコシアが共和国の版図に加わった。地中海東部の要衝キプロス島は、香辛料・砂糖・綿花の取引で共和国にさらなる富をもたらす。"
 ven_events.14.a: "キプロスの経済発展を進める"

 ven_events.15.t: "再びコンスタンティノープルへ"
 ven_events.15.d: "第四回十字軍以来となる、ヴェネツィアによるコンスタンティノープルの占領が成し遂げられた。かつての分割統治の記憶が、再び共和国の野心を刺激する。"
 ven_events.15.a: "新たな統治体制を構築する"

 ven_events.16.t: "アドリア海の女王"
 ven_events.16.d: "アドリア海の真珠と称されたラグーザの繁栄、そしてコルフ島の堅固な守りが完成した。共和国はもはやアドリア海の一勢力ではなく、その海そのものの支配者である。"
 ven_events.16.a: "「アドリア海の女王」の称号を受け入れる"

 ven_events.17.t: "ペンの勝利"
 ven_events.17.d: "共和国は、軍事力ではなく外交と条約をもってキプロスとその周辺の権益を確固たるものとした。「剣ではなく、ペンを持って」——これが共和国の新たな信条となる。"
 ven_events.17.a: "外交的勝利を祝う"

 ven_events.18.t: "ラテン人の帝国、再臨"
 ven_events.18.d: "コンスタンティノープルを中心に、新たなラテン人の帝国が打ち立てられた。地中海の交易路、本土の穀倉、東方の富——すべてがヴェネツィアの手中にある。共和国は、コンスタンティノープルを首都として、トラキア・マケドニア・ギリシャ本土・モレア・エーゲ海の島々を治める新たな従属国「ラテン帝国」を打ち立て、その盟主としてアドリア海から地中海全域に号令する一つの帝国となった。元老院は共和国を帝国として認め、その地位は世界に示されることとなる。"
 ven_events.18.a: "ラテン人の帝国の成立を宣言する"

 STATIC_MODIFIER_NAME_ven_grain_reserves: "穀物の備蓄"
 STATIC_MODIFIER_DESC_ven_grain_reserves: "島嶼都市ヴェネツィアは食料自給ができず、常に本土からの穀物輸入に依存してきた。ヴェロナ・パドヴァを掌握することで、この弱点を補う安定した後背地が確保される。1348年の黒死病でヴェネツィアが壊滅的打撃を受けた際も、農村の回復力がこの都市を救った。"

 STATIC_MODIFIER_NAME_ven_scaliger_victory: "スカリジェリ戦争の勝利"
 STATIC_MODIFIER_DESC_ven_scaliger_victory: "スカリジェリ（スカーラ）家はダンテを庇護したことで知られるヴェローナの僭主だ。カングランデ・デッラ・スカーラはパドヴァ・ヴィチェンツァを支配下に置きヴェネツィアを脅かしたが、1387年にヴィスコンティに滅ぼされた。この宿敵を共和国自ら打ち破ることは北イタリアにおけるヴェネツィアの覇権を証明する。"

 STATIC_MODIFIER_NAME_ven_mainland_order: "本土の秩序"
 STATIC_MODIFIER_DESC_ven_mainland_order: "ヴェネツィアの本土行政はポデスタ（総督代理）制度を通じて機能した。総督評議会から派遣されたポデスタが各都市を統治し、ヴェネツィアの法と商業規範を普及させた。この官僚制はヴェネツィアの著名な「理性的支配」の具現化であり、暴政よりも取引で統治する商人国家の哲学を体現した。"

 STATIC_MODIFIER_NAME_ven_terraferma_growth: "テラフェルマの成長"
 STATIC_MODIFIER_DESC_ven_terraferma_growth: "テラフェルマ（「固い陸地」）政策はヴェネツィアが15世紀初頭にパドヴァ・ヴェロナ・ヴィチェンツァを征服して確立した本土支配だ。ポー川流域の肥沃な農地と絹・羊毛産業の集積はヴェネツィアの交易収入を補完し、共和国の財政基盤を多角化した。"

 STATIC_MODIFIER_NAME_ven_fondaco_supply: "フォンダコの供給網"
 STATIC_MODIFIER_DESC_ven_fondaco_supply: "フォンダコ・デイ・テデスキ（ドイツ商人の館）はリアルト橋のほとりに建つドイツ商人専用の宿泊・倉庫施設だ。ヴェネツィアはここで外国商人を管理・監視しながら交易を許可する巧みな制度を確立した。フォンダコはヴェネツィアの対外交易管理システムの中核をなした。"

 STATIC_MODIFIER_NAME_ven_san_marco_square: "サンマルコ広場"
 STATIC_MODIFIER_DESC_ven_san_marco_square: "サン・マルコ広場はナポレオンが「ヨーロッパで最も美しいサロン」と称えた空間だ。ビザンツ様式のサン・マルコ大聖堂・ドゥカーレ宮殿・鐘楼が囲むこの広場は、千年にわたって地中海世界の商業・政治・文化の中心として機能した。第四回十字軍の出陣式もここで行われた。"

 STATIC_MODIFIER_NAME_ven_canal_efficiency: "運河の効率"
 STATIC_MODIFIER_DESC_ven_canal_efficiency: "ヴェネツィアの177の水路と118の島を繋ぐ400以上の橋は、歩行者と船が共存する独自の都市インフラだ。大運河（カナル・グランデ）に沿って並ぶゴシック・ルネサンス様式の宮殿は商人貴族の富を示す。ゴンドラは物資・人・情報を効率的に運ぶこの都市の毛細血管だった。"

 STATIC_MODIFIER_NAME_ven_fondaco_network: "フォンダコ"
 STATIC_MODIFIER_DESC_ven_fondaco_network: "ヴェネツィアはコンスタンティノープル・アレクサンドリア・ベイルート・アッコン（アッカ）に商業特区（コロニア）を設け、現地の商業活動を支配した。1204年の第四回十字軍でビザンツ帝国を打ち倒してコンスタンティノープルに三分の一の支配権を得たことはこの帝国的商業ネットワークの頂点だった。"

 STATIC_MODIFIER_NAME_ven_bridge_of_wealth_bonus: "富の橋"
 STATIC_MODIFIER_DESC_ven_bridge_of_wealth_bonus: "潟を渡る橋を行き交う隊商は、道中の関所での足止めをほとんど受けることなく荷を運んでいる。"


 STATIC_MODIFIER_NAME_ven_doges_authority: "総督の権威"
 STATIC_MODIFIER_DESC_ven_doges_authority: "ドージェ（総督）はヴェネツィア共和国の元首だが、独裁を防ぐ複雑な制度に縛られた。十人委員会・大評議会・元老院という三権分立に近い体制は、メディチ家のフィレンツェやスフォルツァ家のミラノとは対照的な「商人共和主義」の実践だった。"

 STATIC_MODIFIER_NAME_ven_arsenal_production: "アルセナーレの生産力"
 STATIC_MODIFIER_DESC_ven_arsenal_production: "ヴェネツィアのアルセナーレ（造兵廠）は世界初の大量生産工場と呼ばれる。1000人以上の職人（アルセナロッティ）が流れ作業でガレー船を建造し、ピーク時には一日一隻を完成させた。ダンテは『神曲』地獄篇でこの沸き立つ活気を描写し、後にヘンリー4世がアルセナーレ訪問を感動的に記録した。"

 STATIC_MODIFIER_NAME_ven_marciana_biblioteca: "マルチャーナ図書館"
 STATIC_MODIFIER_DESC_ven_marciana_biblioteca: "サンソヴィーノ設計のマルチャーナ図書館（1537年着工）はペトラルカのコレクションを元にした古代写本の宝庫だ。1453年のコンスタンティノープル陥落後に亡命した学者たちが持ち込んだギリシャ語写本がヴェネツィアに集まり、ルネサンスの西方への伝播に大きく貢献した。"

 STATIC_MODIFIER_NAME_ven_lombardy_dominance: "ロンバルディアの支配"
 STATIC_MODIFIER_DESC_ven_lombardy_dominance: "ミラノの工房と職人たちは、共和国の指導のもとでより多くの品を生み出している。"

 STATIC_MODIFIER_NAME_ven_genoese_settlement: "ジェノヴァとの決着"
 STATIC_MODIFIER_DESC_ven_genoese_settlement: "ヴェネツィアとジェノヴァの百年戦争（1261〜1381年）は地中海の商業覇権を賭けた死闘だった。1380年のキオッジャの戦いでヴェネツィアは包囲されながらも奇跡的に勝利し、ジェノヴァの東地中海進出を決定的に封じた。この宿敵との和解は千年の競争に終止符を打つ歴史的な出来事だ。"


 STATIC_MODIFIER_NAME_ven_queen_of_canals: "運河の女王"
 STATIC_MODIFIER_DESC_ven_queen_of_canals: "「アドリア海の女王」と呼ばれたヴェネツィアは潟の上に奇跡的に建設された都市だ。1000万本を超える木杭の上に建つ宮殿・教会・橋の眺めはマルコ・ポーロの時代から今日まで旅人を魅了し続けた。ペスト・火災・洪水と戦い続けながら一千年の独立を守ったこの都市は人類史の奇跡だ。"

 STATIC_MODIFIER_NAME_ven_ferrara_secured: "フェッラーラの確保"
 STATIC_MODIFIER_DESC_ven_ferrara_secured: "フェラーラはエステ家が支配するルネサンス芸術の都だった。アリオストが「狂えるオルランド」を書き、タッソが「解放されたエルサレム」を詠んだこの都市は教皇領とヴェネツィアの間に位置する戦略的緩衝地帯だ。1482〜1484年のフェラーラ戦争でヴェネツィアがエステ家に敗れた屈辱を今こそ晴らす。"

 STATIC_MODIFIER_NAME_ven_alpine_frontier: "アルプス辺境"
 STATIC_MODIFIER_DESC_ven_alpine_frontier: "ヴェネツィアの本土支配（テラフェルマ）は北イタリアの平野を越えてアルプス山麓にまで及んだ。ブレンナー峠・グレート・サン・バーナード峠を通るドイツ商人の交易路を管理することで、ヴェネツィアはアルプス以北のヨーロッパと地中海を結ぶ最重要の中継地となった。"

 STATIC_MODIFIER_NAME_ven_papal_tension: "教皇領との緊張"
 STATIC_MODIFIER_DESC_ven_papal_tension: "1509年のカンブレー同盟でユリウス2世がヴェネツィアに破門を宣言した際も、共和国の商人たちはほとんど動揺しなかった。「まず商人、次にキリスト教徒」と皮肉られたヴェネツィアの実利主義は、宗教権威より通商利益を優先するという明確な国家哲学を体現していた。"

 STATIC_MODIFIER_NAME_ven_alpine_trade_routes: "アルプス越えの交易路"
 STATIC_MODIFIER_DESC_ven_alpine_trade_routes: "リアルト市場に集まるドイツ商人・フランドル商人・レヴァント商人たちは、アルプスを越える交易路のヴェネツィア側の出発点だった。ガラス・絹・香辛料が北に向かい、羊毛・銅・銀が南に流れるこのアルプス貿易はヴェネツィア共和国の富の半分以上を支えた。"

 STATIC_MODIFIER_NAME_ven_secular_authority: "世俗的権威"
 STATIC_MODIFIER_DESC_ven_secular_authority: "ヴェネツィアはカトリック国家でありながら、教会権威を国家の支配下に置くことを厭わなかった。聖職者の任命・教会財産の管理・修道院の規律まで共和国が介入し、破門を恐れず教皇とも交渉した。この「聖なる冒涜」ともいえる世俗主義がヴェネツィアに独特の柔軟性をもたらした。"

 STATIC_MODIFIER_NAME_ven_cambrai_survived: "カンブレー同盟を生き延びた"
 STATIC_MODIFIER_DESC_ven_cambrai_survived: "1508年のカンブレー同盟（教皇・フランス・神聖ローマ・スペイン）はヴェネツィアを完全に包囲した。1509年のアニャデッロの戦いで共和国軍は壊滅したが、外交的巧みさで連合を分裂させ、ヴェネツィアは奇跡的に生き延びた。この経験が「軍事より外交」という共和国の国是を確固たるものにした。"

 STATIC_MODIFIER_NAME_ven_terraferma_zenith: "テラフェルマの頂点"
 STATIC_MODIFIER_DESC_ven_terraferma_zenith: "15世紀最盛期のヴェネツィアはベルガモからブレシア、パドヴァからトレヴィーゾまで北イタリアに広大なテラフェルマ帝国を築いた。この本土帝国はヴェネツィアを単なる商人都市から真の地域大国へと変貌させた。コジモ・デ・メディチが「ヴェネツィアは最も平和的かつ賢明な政府だ」と評した所以だ。"

 STATIC_MODIFIER_NAME_ven_italian_unity_unlock: "イタリアの中心としての地位"
 STATIC_MODIFIER_DESC_ven_italian_unity_unlock: "「イタリア人によるイタリア」——この理念はマキャヴェリが「君主論」で訴え、リソルジメント（統一運動）の旗印となった。フランス・スペイン・神聖ローマ帝国がイタリアを戦場にする中、ヴェネツィアが率いるイタリア統一の動きはこの「外国人の追放」を実現する唯一の可能性だ。"

 STATIC_MODIFIER_NAME_ven_unified_fleet: "統合艦隊"
 STATIC_MODIFIER_DESC_ven_unified_fleet: "ヴェネツィアの艦隊は世界最高水準の海軍組織だった。アルセナーレで量産されたガレー船は専門的な訓練を受けた水兵（ガレオッティ）が操り、中世から近代にかけて地中海で最も恐れられる戦闘力を誇った。1571年のレパントの海戦でオスマン艦隊に勝利したのもこの強力な海軍力あってこそだった。"

 STATIC_MODIFIER_NAME_ven_black_sea_protection: "黒海交易の護衛"
 STATIC_MODIFIER_DESC_ven_black_sea_protection: "エウボイア島のネグロポンテ（カルキス）はヴェネツィアの東地中海支配の要衝だった。1470年にオスマン艦隊がこの島を征服したことはヴェネツィア史上最大の衝撃の一つとなり、教皇シクストゥス4世は「第二のコンスタンティノープル陥落」と嘆いた。この戦略的拠点を守ることが東地中海商業網の生命線だ。"

 STATIC_MODIFIER_NAME_ven_adriatic_secured: "アドリア海の確保"
 STATIC_MODIFIER_DESC_ven_adriatic_secured: "アドリア海はヴェネツィアが「我らの湾（ゴルフォ・ディ・ヴェネツィア）」と呼ぶ内海だ。毎年昇天祭に総督がリド沖で海に金の指輪を投げ込む「海との結婚式（スポサリツィオ・デル・マーレ）」の儀式は、ヴェネツィアとアドリア海の不可分の絆を象徴する千年の伝統だ。"

 STATIC_MODIFIER_NAME_ven_zadar_trade_hub: "ザーラの商館"
 STATIC_MODIFIER_DESC_ven_zadar_trade_hub: "ザダル（ザーラ）はダルマチア最大の港湾都市だ。第四回十字軍でヴェネツィア軍が攻略したこの「同胞キリスト教徒の都市」の略奪は教皇からの破門を招いたが、それでもヴェネツィアは利益を優先した。塩・魚・皮革の集散地として、ザダルはアドリア海交易の重要な中継点だ。"


 STATIC_MODIFIER_NAME_ven_genoese_rivalry_won: "ジェノヴァとの競争に勝利"
 STATIC_MODIFIER_DESC_ven_genoese_rivalry_won: "クリミアのカッファ・ガラタ（コンスタンティノープル対岸）・キオスなどジェノヴァの黒海・エーゲ海の商業拠点は、ヴェネツィアの最大の競争相手だった。1380年のキオッジャ戦争での勝利後もジェノヴァは東地中海で粘り続けたが、最終的にヴェネツィアがその支配を確立することで、300年の商業戦争に決着がつく。"

 STATIC_MODIFIER_NAME_ven_aegean_dominance: "エーゲ海の支配"
 STATIC_MODIFIER_DESC_ven_aegean_dominance: "ヴェネツィア支配下のクレタ（カンディア）は1204年から1669年まで460年以上続く最長の植民地支配を受けた。エル・グレコが生まれたこの島のヘラクリオン（カンディア）はエーゲ海最大の要塞都市として知られ、ヴェネツィアの「海の帝国（スタト・ダ・マール）」の中核をなした。"

 STATIC_MODIFIER_NAME_ven_dalmatia_subdued: "ダルマチアの平定"
 STATIC_MODIFIER_DESC_ven_dalmatia_subdued: "ダルマチア海岸はヴェネツィアの「母国海岸」として1000年以上にわたって争われた。1000年にドージェのピエトロ2世オルセオーロが海賊討伐遠征を行い「ダルマチア公爵」を称したことに始まるこの地への関与は、デュブロヴニク（ラグーザ）・スプリット（スパラト）・ザダルを巡る長い争奪戦の始まりだった。"

 STATIC_MODIFIER_NAME_ven_eastern_trade_dominance: "東方貿易の支配"
 STATIC_MODIFIER_DESC_ven_eastern_trade_dominance: "東方からの香辛料や絹は、まずヴェネツィアの市場を経由するのが当然となった。"

 STATIC_MODIFIER_NAME_ven_greek_bridgehead_secured: "ギリシャ橋頭堡の確保"
 STATIC_MODIFIER_DESC_ven_greek_bridgehead_secured: "クレタとモドンを足がかりに、共和国の船はギリシャの海をさらに東へと進む。"

 STATIC_MODIFIER_NAME_ven_pearl_prosperity: "真珠の繁栄"
 STATIC_MODIFIER_DESC_ven_pearl_prosperity: "かつての賑わいを取り戻したラグーザの市場には、再び商人たちの声が響く。"

 STATIC_MODIFIER_NAME_ven_corfu_garrison: "コルフ島の守備隊"
 STATIC_MODIFIER_DESC_ven_corfu_garrison: "コルフ島の城壁に立つ守備隊は、アドリア海の入り口を静かに見守っている。"

 STATIC_MODIFIER_NAME_ven_cyprus_secured: "キプロスの確保"
 STATIC_MODIFIER_DESC_ven_cyprus_secured: "キプロスの港から運ばれる砂糖と綿花は、共和国の倉庫を満たしている。"

 STATIC_MODIFIER_NAME_ven_latin_empire_foundation: "ラテン帝国の基盤"
 STATIC_MODIFIER_DESC_ven_latin_empire_foundation: "コンスタンティノープルの宮殿には、再びラテン人の旗が掲げられた。多様な信仰を持つ住民たちも、共和国の統治のもとで穏やかに暮らしている。"

 STATIC_MODIFIER_NAME_ven_adriatic_queen: "アドリア海の女王"
 STATIC_MODIFIER_DESC_ven_adriatic_queen: "アドリア海を統べる者として、共和国はもう一人の提督を艦隊の指揮に任命する権限を得た。"

 STATIC_MODIFIER_NAME_ven_diplomatic_mastery: "外交の達人"
 STATIC_MODIFIER_DESC_ven_diplomatic_mastery: "共和国の使節は、剣を抜くことなく望む条件を相手に認めさせる。諸国の共和国への敵対心は和らぎ、戦における交渉も有利に進められる。"

 STATIC_MODIFIER_NAME_ven_latin_empire_unlock: "ラテン人の帝国"
 STATIC_MODIFIER_DESC_ven_latin_empire_unlock: "地中海の交易路、本土の穀倉、東方の富——すべてがヴェネツィアの手中にある。"

 ven_italian_unity_unlock_tt: "ヴェネツィアはイタリア統一の礎を完成させた。「ラ・セレニッシマ」がアドリア海からアルプスまでイタリア半島を統一し、古代ローマ以来初めてイタリアが一つの旗の下に統治される。"

 ven_latin_empire_unlock_tt: "コンスタンティノープルを首都とするラテン帝国（LAT）が属国として建国され、ヴェネツィアの保護下に置かれる。"
