l_japanese:
 pro_jewel_of_occitania_mission_pack: "オクシタニアの宝石"
 pro_jewel_of_occitania_mission_pack_DESCRIPTION:0 "プロヴァンス伯爵家はカペー系アンジュー家の末裔として、ナポリ・シチリア・アラゴン・ハンガリー・エルサレムへの継承権を持つ。マルセイユを地中海最大の港湾都市に育て上げ、オクシタニアを統一し、アンジュー家の正統な継承権を世界に示せ。「王の中の王」となる栄光が待っている。"
 pro_jewel_of_occitania_mission_pack_CRITERIA_DESCRIPTION:0 "プロヴァンス伯として、アンジュー家の継承権を実現し、オクシタニアを統一してフランスを制覇せよ。"
 pro_jewel_of_occitania_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成して「王の中の王」となれ。"
 pro_jewel_of_occitania_mission_pack_BUTTON_DETAILS:0 "マルセイユから世界を制せよ！"

 pro_house_of_anjou: "アンジュー家の野望"
 pro_house_of_anjou_desc: "カペー朝アンジュー家はシチリア・ナポリ・ハンガリーの王家として栄えたが、今は南フランスの一侯国プロヴァンスにのみ拠点を残す。しかしルネ王の胸には多くの王位継承権への夢が宿っている。プロヴァンスの地から再び栄光を取り戻す時が来た。"

 pro_statutes_of_aix: "エクスの法令"
 pro_statutes_of_aix_desc: "エクス＝アン＝プロヴァンスはプロヴァンス伯爵家の首都として、独自の法体系「エクスの法令」を整備している。支配度の確立と法の整備が、エタ・ド・プロヴァンス（身分会）とマルセイユの自由港という二つの固有制度を解放する。"
 pro_statutes_of_aix_unlock_tt: "エタ・ド・プロヴァンスとマルセイユの自由港の都市特権が使用可能になる。"

 pro_sponsor_the_arts: "芸術の後援"
 pro_sponsor_the_arts_desc: "ルネ王はイタリア・ルネサンスの最高の後援者の一人として名高い。芸術家・学者を招き、プロヴァンスをルネサンス文化の西方の中心地とせよ。"

 pro_develop_marseille: "マルセイユの発展"
 pro_develop_marseille_desc: "古代ギリシャ人が建設した港湾都市マルセイユは、地中海交易の要衝だ。この都市を発展させることでプロヴァンスは商業的・海洋的な強国への第一歩を踏み出す。"

 pro_toulon_dockyard: "トゥーロン造船所"
 pro_toulon_dockyard_desc: "トゥーロンは天然の良港として地中海最高の海軍拠点の一つだ。ここに壮大な造船所と兵器廠を建設し、プロヴァンス艦隊の母港とする。"

 pro_lords_of_the_rhone: "ローヌ回廊の支配者"
 pro_lords_of_the_rhone_desc: "ローヌ川はアルプスとプロヴァンスを繋ぐ重要な交通・交易路だ。この回廊を完全に掌握することで、プロヴァンスはフランス南部の支配者として確固たる地位を築く。"

 pro_avignon_question: "アヴィニョン問題"
 pro_avignon_question_desc: "1309年から1377年まで教皇庁の所在地であったアヴィニョンは、今もなお教皇領の飛び地として存続している。外交・占領いずれかの手段でこの都市をプロヴァンスに統合せよ。"

 pro_piqure_de_marseilles: "マルセイユの刺繍"
 pro_piqure_de_marseilles_desc: "「マルセイユ刺繍（ピクレ・ド・マルセイユ）」はプロヴァンスの精緻な布地加工技術を代表するものだ。生地・高級生地の生産拡大がプロヴァンスに大きな富をもたらす。"

 pro_la_marseillaise: "ラ・マルセイエーズ"
 pro_la_marseillaise_desc: "マルセイユから出発した義勇軍の行進曲として歌い継がれるラ・マルセイエーズ。プロヴァンスの精強な軍隊は今や南フランス最強の戦力となっている。"

 pro_claims_of_king_rene: "ルネ王の継承権"
 pro_claims_of_king_rene_desc: "「善良なるルネ」ことルネ1世はナポリ王位を奪われ、アラゴン王位も認められなかった。しかしアンジュー家の正統な継承権は失われていない。これらの権利を世界に示す時が来た。"

 pro_king_of_naples: "ナポリ王"
 pro_king_of_naples_desc: "ナポリ王位はアンジュー家の正統な継承権だ。トラスタマラ家のアラゴンによって奪われたこの玉座を取り戻し、アンジュー家の南イタリア支配を再建せよ。"

 pro_king_of_sicily: "シチリア王"
 pro_king_of_sicily_desc: "かつてノルマン人が建設した偉大なシチリア王国はアンジュー家にも引き継がれた。今再びシチリアをプロヴァンスの旗の下に統合する。"

 pro_king_of_aragon: "アラゴン王"
 pro_king_of_aragon_desc: "アラゴン王位はアンジュー家の最大の宿敵が保持する玉座だ。ナポリを奪ったトラスタマラ家に報復し、イベリア半島の支配権を握る。"

 pro_king_of_hungary: "ハンガリー王"
 pro_king_of_hungary_desc: "アンジュー家はかつてハンガリー王家としても君臨した。14世紀末に失われたこの玉座を取り戻し、東ヨーロッパへの影響力を確立する。"

 pro_king_of_jerusalem: "エルサレム王"
 pro_king_of_jerusalem_desc: "「エルサレム王」の称号はアンジュー家が長く主張してきた。空虚な称号に終止符を打ち、聖都を実際に征服してキリスト教世界の守護者となれ。"

 pro_integrate_lorraine: "ロレーヌの統合"
 pro_integrate_lorraine_desc: "ロレーヌ公国はアンジュー家が保持した数少ない称号の一つだ。分離していた諸勢力を統合し、ロレーヌを完全にプロヴァンスの支配下に置く。"

 pro_join_the_empire: "帝国への加入"
 pro_join_the_empire_desc: "神聖ローマ帝国への加入は大国の脅威から身を守るための賢明な外交的選択だ。あるいは、その盟主として帝国を率いることも選択肢の一つだ。"

 pro_unite_occitania: "オクシタニアの統一"
 pro_unite_occitania_desc: "オクシタン語を話す南フランスの民はアルビジョワ十字軍と百年戦争で疲弊している。プロヴァンス伯爵家のもとにオクシタニアを統一し、フランスの支配から解放せよ。"

 pro_gascony: "ガスコーニュの掌握"
 pro_gascony_desc: "ボルドーを中心とするガスコーニュはイングランドとの歴史的なつながりを持つ豊かな地だ。トゥールーズとボルドーを支配することで南フランス全体を掌握する。"

 pro_king_of_france: "フランス王"
 pro_king_of_france_desc: "フランス王国は長らくプロヴァンスの宿敵だったが、今その玉座を奪う時が来た。パリを征服し、アンジュー家の旗をフランス全土に掲げよ。"

 pro_king_of_kings: "王の中の王"
 pro_king_of_kings_desc: "アンジュー家はナポリ・シチリア・アラゴン・ハンガリー・エルサレム・フランスを制した。複数の王冠を戴くこの帝国を「王の中の王」が統治する——まさしく中世の夢が実現した。"
 STATIC_MODIFIER_NAME_pro_statutes_of_aix_mod: "エクスの法令"
 STATIC_MODIFIER_DESC_pro_statutes_of_aix_mod: "プロヴァンス伯爵家はエクス＝アン＝プロヴァンスを拠点に独自の法典を整備した。ローマ法の伝統を引くこの成文法は貴族・聖職者・市民の権利義務を明文化し、プロヴァンスを中世フランスで最も法的に整備された地域の一つとした。"

 STATIC_MODIFIER_NAME_pro_sponsor_the_arts_mod: "芸術の後援"
 STATIC_MODIFIER_DESC_pro_sponsor_the_arts_mod: "ルネ王は自ら絵筆を執り、詩を詠んだ稀代の文人君主だ。彼の宮廷はプロヴァンスのトルバドゥール（吟遊詩人）の伝統を継承しつつ、フランドルやイタリアから芸術家を招いた。「善良なるルネ」の名声はその文化的後援によるところが大きい。"
 STATIC_MODIFIER_NAME_pro_marseille_mod: "マルセイユの繁栄"
 STATIC_MODIFIER_DESC_pro_marseille_mod: "紀元前600年にギリシャ人フォカイア人が建設したマッサリア（マルセイユ）は、ローマ時代から地中海交易の要衝として栄えてきた。十字軍時代には東方との物資輸送拠点として、また14世紀以降は黒死病の侵入口としても歴史に名を刻んだ。この港湾都市の繁栄はプロヴァンス全体の富の源泉だ。"
 STATIC_MODIFIER_NAME_pro_toulon_dockyard_mod: "トゥーロン造船所"
 STATIC_MODIFIER_DESC_pro_toulon_dockyard_mod: "天然の良港として知られるトゥーロン湾は、古代から船乗りたちの避難所だった。15世紀のプロヴァンス伯爵家は、この天然の要害を海軍の要衝として整備した。後にルイ14世が大規模な海軍基地を建設するこの地は、すでにプロヴァンス海軍力の礎となっている。"
 STATIC_MODIFIER_NAME_pro_lords_of_the_rhone_mod: "ローヌ回廊の支配者"
 STATIC_MODIFIER_DESC_pro_lords_of_the_rhone_mod: "ローヌ川は地中海と内陸フランスを繋ぐ古代から続く大動脈だ。ローマ人が整備したこの水路沿いには多くの都市が栄え、商品・軍勢・巡礼者が行き交った。アルルやアヴィニョンを含むこの回廊を支配することはプロヴァンスの戦略的核心を握ることを意味する。"
 STATIC_MODIFIER_NAME_pro_avignon_question_mod: "アヴィニョン統合"
 STATIC_MODIFIER_DESC_pro_avignon_question_mod: "1309年から1377年まで、七人の教皇がローマを離れてアヴィニョンに居を構えた「アヴィニョン捕囚」。この特異な歴史がアヴィニョンをヨーロッパ最大の外交都市の一つとした。教皇庁の記憶が色濃く残るこの都市を掌握することは、カトリック世界における影響力を象徴する。"
 STATIC_MODIFIER_NAME_pro_piqure_de_marseilles_mod: "マルセイユの刺繍"
 STATIC_MODIFIER_DESC_pro_piqure_de_marseilles_mod: "「マルセイユ刺繍（ピクレ・ド・マルセイユ）」は表裏両面に施された精緻な縫い目が特徴の布地工芸で、17〜18世紀に全ヨーロッパを席巻した。その起源はすでに中世プロヴァンスの熟練した布地職人たちにある。マルセイユの港から輸出されるこの高級生地はプロヴァンスの商業的名声の礎となっている。"
 STATIC_MODIFIER_NAME_pro_la_marseillaise_mod: "ラ・マルセイエーズ"
 STATIC_MODIFIER_DESC_pro_la_marseillaise_mod: "フランス革命時にマルセイユの義勇兵がパリへ行進しながら歌った歌は後に国歌となった。しかしプロヴァンスの戦士の魂は中世からある。アルルのトーナメント、十字軍への参加、そしてアンジュー家の旗の下での遠征——プロヴァンスの兵士は地中海世界で鍛えられた歴戦の士だ。"
 STATIC_MODIFIER_NAME_pro_claims_of_king_rene_mod: "ルネ王の継承権"
 STATIC_MODIFIER_DESC_pro_claims_of_king_rene_mod: "「善良なるルネ」ことルネ1世はナポリ・シチリア・アラゴン・ハンガリー・エルサレムへの継承権を主張したが、現実の戦争ではほぼ全てを失った。それでも多くの称号を保持し続けた彼の外交的粘り強さは、アンジュー家の正統性をヨーロッパ中に示し続けた。"
 STATIC_MODIFIER_NAME_pro_king_of_naples_mod: "ナポリ王の称号"
 STATIC_MODIFIER_DESC_pro_king_of_naples_mod: "カール1世・ダンジューが1266年に建設したアンジュー朝ナポリは、南イタリア・シチリアを支配する地中海の大国だった。シチリアの晩鐘で島部を失ったとはいえ、ナポリ王位はフランス系アンジュー家がイタリアに持つ最大の権威の象徴だ。"
 STATIC_MODIFIER_NAME_pro_king_of_sicily_mod: "シチリア王の称号"
 STATIC_MODIFIER_DESC_pro_king_of_sicily_mod: "1282年の「シチリアの晩鐘」でフランス人支配者を追放したシチリア人は、アラゴン家を呼び込んだ。しかしノルマン人以来の多文化文明が花開いたこの島は、地中海制覇の鍵だ。シチリアを再び取り戻すことはアンジュー家最大の悲願の成就を意味する。"
 STATIC_MODIFIER_NAME_pro_king_of_aragon_mod: "アラゴン王の称号"
 STATIC_MODIFIER_DESC_pro_king_of_aragon_mod: "アラゴン連合王国はシチリア・サルデーニャ・ナポリを次々と手中に収めた地中海最大の勢力だ。ナポリを巡るアンジュー家との抗争は百年以上続いたが、この宿敵の王冠を奪うことはアンジュー家の完全な雪辱を意味する。"
 STATIC_MODIFIER_NAME_pro_king_of_hungary_mod: "ハンガリー王の称号"
 STATIC_MODIFIER_DESC_pro_king_of_hungary_mod: "カール・ロベルト（シャルル・ロベール）がハンガリー王となった14世紀初頭、アンジュー家の一族は中央ヨーロッパの強国を手中に収めた。マティアス・コルヴィヌス以前のハンガリー最盛期を築いたこのアンジュー系ハンガリー王家の伝統は今も生きている。"
 STATIC_MODIFIER_NAME_pro_king_of_jerusalem_mod: "エルサレム王の称号"
 STATIC_MODIFIER_DESC_pro_king_of_jerusalem_mod: "1099年、第一回十字軍がエルサレムを征服してゴドフロワ・ド・ブイヨンを初代指導者とした。その後アイユーブ朝・マムルーク朝に奪われた聖都を奪還することは、カトリック世界全体の悲願だ。アンジュー家はカール1世以来この称号を保持してきたが、今こそ名実ともに「エルサレム王」となる時だ。"
 STATIC_MODIFIER_NAME_pro_integrate_lorraine_mod: "ロレーヌの統合"
 STATIC_MODIFIER_DESC_pro_integrate_lorraine_mod: "ロレーヌ（ロートリンゲン）は古代ローマの属州からフランク王国・神聖ローマ帝国の係争地として歴史を歩んだ。ルネ1世の父ルイ2世はロレーヌ公の称号を持ち、ルネ自身もロレーヌ公として即位した。この地はアンジュー家の権威を西欧全体に示す重要な拠点だ。"
 STATIC_MODIFIER_NAME_pro_join_the_empire_mod: "帝国外交"
 STATIC_MODIFIER_DESC_pro_join_the_empire_mod: "神聖ローマ帝国はフランスとの境界で常にプロヴァンスと隣接し、その政治的影響は無視できない。ロレーヌを通じて帝国との紐帯を持つアンジュー家が帝国内に地位を築くことは、プロヴァンスの外交的地平を大きく広げる。"
 STATIC_MODIFIER_NAME_pro_unite_occitania_mod: "オクシタニアの統一"
 STATIC_MODIFIER_DESC_pro_unite_occitania_mod: "オクシタン語を話す南フランスの民はトルバドゥール（吟遊詩人）の文化を育んだが、13世紀のアルビジョワ十字軍と百年戦争で疲弊した。プロヴァンスとランゲドックを一つの旗の下に統一することは、失われたオクシタニア文明の復興を意味する。"
 STATIC_MODIFIER_NAME_pro_gascony_mod: "ガスコーニュの掌握"
 STATIC_MODIFIER_DESC_pro_gascony_mod: "ガスコーニュはボルドーのワインと大西洋貿易で知られる豊かな地だ。百年戦争でイングランドがフランスから撤退した後も、この地の帰属は不安定だった。ガスコーニュを掌握することでプロヴァンスは大西洋に面した通商国家へと変貌する。"
 STATIC_MODIFIER_NAME_pro_king_of_france_mod: "フランス王の称号"
 STATIC_MODIFIER_DESC_pro_king_of_france_mod: "フランス王家カペー朝の分家として生まれたアンジュー家が、本家の玉座を奪う——これは歴史の逆転だ。フランク王国の伝統と「最もキリスト教的な王」の称号を持つフランス王国の王冠は、ヨーロッパで最も権威ある称号の一つだ。"
 STATIC_MODIFIER_NAME_pro_king_of_kings_mod: "王の中の王"
 STATIC_MODIFIER_DESC_pro_king_of_kings_mod: "ナポリ・シチリア・アラゴン・ハンガリー・エルサレム・フランス——これほど多くの王冠を同時に戴いた君主は中世ヨーロッパの歴史でも類を見ない。アンジュー家は小さなプロヴァンス伯爵家から、地中海からドナウ川まで支配する「王の中の王」へと昇りつめた。"


 pro_events.2.t: "ルネ王の継承権"
 pro_events.2.d: "アンジュー家の正統な王位継承権を宣言する時が来た。ナポリ王国はかつてアンジュー家のものだったが、アルフォンソ5世率いるアラゴン軍に敗れて失われた。今こそルネ王の名において、この不当な占領に異議を唱える。ナポリへの開戦事由を獲得し、アンジュー家の正統性を軍事力で証明せよ。"
 pro_events.2.a: "ナポリはアンジュー家のものだ！"

 pro_lorraine_marriage: "ロレーヌとの婚姻"
 pro_lorraine_marriage_desc: "ロレーヌ公国はアンジュー家がかつて保持した称号の一つだ。外交的婚姻と同盟によってロレーヌ公家との絆を深め、その封土化への道を開く。かつてルネ王の父シャルル2世もロレーヌの諸問題に介入した。血縁・婚姻・同盟のいずれかを通じてロレーヌとの関係を確立せよ。"




 pro_events.3.t: "賢王ロベールの治世"
 pro_events.3.d: "1337年現在、プロヴァンスを統治するのは「賢王」と称えられるロベール・ダンジュー（Roberto d'Angiò、1277年頃〜1343年）だ。ナポリ王・称号上のエルサレム王・プロヴァンス伯として、彼はイタリア政治の中心人物として君臨している。グエルフ党（教皇派）の旗手として皇帝の侵略を退け、1336年にはジョヴァンニ・ディ・ボエミアをイタリアから追い出した。芸術と学問を深く愛し、ペトラルカやボッカッチョからも尊敬されたロベールは、ナポリとプロヴァンスに文化的黄金時代をもたらした。しかしその晩年は、シチリア島奪還の失敗と後継者問題に悩まされている。ロベールの後継者ヨランデは若く、アンジュー家の将来は不確かだ。この偉大な王の意志を継ぎ、アンジュー家の栄光を取り戻す時が来た。"
 pro_events.3.a: "ロベール王の遺志を継ぎ、アンジュー家の栄光を再び！"

 pro_events.4.t: "ロレーヌとの婚姻"
 pro_events.4.d: "外交的策略と婚姻政策の結果、ロレーヌ公国との関係はかつてないほど強固なものとなった。アンジュー家とロレーヌ家の血が混ざり合うことで、両家の利益は深く結びついている。ロレーヌ公をプロヴァンスの封臣として迎え入れ、その資源と軍事力をアンジュー家の野望に活かす時が来た。"
 pro_events.4.a: "ロレーヌ公を封臣として迎え入れる"
 pro_events.4.b: "独立は保ちつつ、同盟関係を維持する"

 pro_events.5.t: "エルサレム王国の形成"
 pro_events.5.d: "聖都エルサレムはついにプロヴァンスの旗の下に入った。アンジュー家は今、十字軍の伝統を引き継ぐ「エルサレム王」の称号を名実ともに手にした。レヴァント地方の要衝に「エルサレム王国（KOJ）」を再建し、プロヴァンスの封臣として統治させよ。かつて1099年に第一回十字軍が建国したこの聖なる王国が、アンジュー家の手によって再興される。カトリックの守護者として、聖地をイスラム勢力から守り抜け。"
 pro_events.5.a: "エルサレム王国を再建し、アンジュー家の封臣として統治させる！"

 pro_etats_de_provence_town_rights: "エタ・ド・プロヴァンス"
 pro_etats_de_provence_town_rights_desc: "プロヴァンス地方の貴族・聖職者・市民が参加する身分会（エタ）。三身分の権力を強化し、地方の自治と合議制を保証する。内閣効率化の効果もある。"
 pro_marseille_free_port_town_rights: "マルセイユの自由港"
 pro_marseille_free_port_town_rights_desc: "マルセイユを自由港として宣言する。商人の交易権を大幅に拡大し、人口増加・繁栄・市民の権力を高める。マルセイユにのみ付与可能。"

 pro_events.6.t: "アヴィニョン問題の解決"
 pro_events.6.d: "アヴィニョンは1309年以来、教皇庁の所在地として歴史的にプロヴァンスの地に存在してきた。1377年に教皇グレゴリウス11世がローマに帰還したのち、この都市は教皇庁の飛び地として残り続けた。プロヴァンス伯国はこの飛び地が自国の版図に楔を打ち込んでいることに長年不満を抱いてきた。今や教皇との関係が整い、アヴィニョン問題を平和的に解決する機会が訪れた。教皇は補償と引き換えにアヴィニョンをプロヴァンスへ割譲することを認める。"
 pro_events.6.a: "アヴィニョンはプロヴァンスのものだ"
