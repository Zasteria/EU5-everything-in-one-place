l_russian:
 sic_restoration_mission_pack: "Путь Королевства Сицилия"
 sic_restoration_mission_pack_DESCRIPTION:0 "Отделённое от Неаполя восстанием 1282 года, Королевство Сицилия готово теперь собрать силы этого острова в сердце Средиземноморья и вновь вписать своё имя в историю. Пересечёшь ли ты пролив и вновь станешь единым целым с Неаполем, или выкуешь из самого острова край золота? Выбор за тобой, о король."
 sic_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Заверши миссии как Королевство Сицилия, работая над восстановлением обеих Сицилий или золотым веком острова Сицилия."
 sic_restoration_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, чтобы пройти путь Королевства Сицилия."
 sic_restoration_mission_pack_BUTTON_DETAILS:0 "Завоюй Неаполь за проливом и выкуй Королевство обеих Сицилий, или отполируй остров Сицилия до состояния жемчужины Средиземноморья. На любом из этих путей лежит процветание нового королевства!"
 sic_divided_kingdom: "За проливом"
 sic_divided_kingdom_desc: "В 1282 году, в восстании, известном как Сицилийская вечерня, мы свергли власть дома Анжу. Более не в силах терпеть тиранию французских чиновников, народ острова поднялся как один при звуке вечерних колоколов и изгнал французов с наших берегов. Мы приветствовали Педро III Арагонского как нового короля, и Королевство Сицилия было тем самым разделено надвое. За проливом, на материке с центром в Неаполе, король дома Анжу до сих пор именует себя «королём Сицилии». Лишь мы — законные короли этого острова. Соперничество между двумя нашими державами продолжается по сей день."
 sic_ambitions_on_naples: "Притязания на Неаполь"
 sic_ambitions_on_naples_desc: "Анжуйский король за проливом по праву стоит соперничающим претендентом на самый титул короля Сицилии. Настало время нарастить нашу постоянную армию и поднять справедливое дело — когда-нибудь заявить права на корону Неаполя для себя."
 sic_army_of_the_island: "Флот острова"
 sic_army_of_the_island_desc: "Остров Сицилия — крепость, со всех сторон окружённая морем. Чтобы отправить наши войска через пролив в Неаполь, мы должны прежде построить мощный флот, обеспечивающий как оборону острова, так и безопасную переправу наших воинов."
 sic_conquest_of_naples: "Завоевание Неаполя"
 sic_conquest_of_naples_desc: "Наконец наши силы пересекли пролив и высадились на берегах Неаполя. Если мы сможем сокрушить анжуйскую армию и завладеть короной Неаполя, королевство, разделённое в 1282 году, вновь станет единым целым, под нашей властью."
 sic_two_sicilies: "Обе Сицилии"
 sic_two_sicilies_desc: "Неаполь и Палермо, две короны, покоятся теперь в наших руках. Настало время объявить об основании нового королевства, охватывающего оба берега пролива — Королевства обеих Сицилий. Это историческое деяние кладёт конец разделению 1282 года."
 sic_golden_wheat_fields: "Золотые пшеничные поля"
 sic_golden_wheat_fields_desc: "С древних времён остров Сицилия зовётся житницей Средиземноморья. Развивая плодородные равнины вокруг Палермо, богатый урожай накормит всё королевство, а излишки зерна повезут за границу как ценный торговый товар."
 sic_palermo_resurgent: "Возрождённое Палермо"
 sic_palermo_resurgent_desc: "В дни нормандского королевства Палермо был городом несравненного блеска в Средиземноморье. Возвести здесь новые постройки и вернуть хоть частицу того давнего великолепия станет первым шагом к развитию всего острова."
 sic_mediterranean_crossroads: "Перекрёсток средиземноморской торговли"
 sic_mediterranean_crossroads_desc: "Остров Сицилия лежит в самом сердце перекрёстка Средиземноморья, где сходятся торговые пути Востока и Запада. Учредив рынки в портах острова, мы соберём здесь купцов из всех земель, значительно увеличив торговый доход королевства."
 sic_sicilian_renaissance: "Сицилийское Возрождение"
 sic_sicilian_renaissance_desc: "Сицилийский двор, где встречаются нормандская, арабская, византийская и латинская культуры, издавна был центром искусства и учёности. Множество произведений искусства, собранных в Палермо, предвещают зарю нового культурного расцвета."
 sic_kingdom_resurgent: "Возрождённое королевство"
 sic_kingdom_resurgent_desc: "Будь то как королевство, охватывающее оба берега пролива, или как остров, сияющий культурой и торговлей в сердце Средиземноморья, Сицилия вновь вписала своё имя в историю. Отсюда путь этого королевства отметит зарю новой эпохи."
 STATIC_MODIFIER_NAME_sic_army_of_the_island_mod: "Флот острова"
 STATIC_MODIFIER_DESC_sic_army_of_the_island_mod: "Реорганизованный флот острова отличается высоким боевым духом и обильными резервами живой силы."
 STATIC_MODIFIER_NAME_sic_conquest_of_naples_mod: "Завоевание Неаполя"
 STATIC_MODIFIER_DESC_sic_conquest_of_naples_mod: "Пройдя через кампанию в Неаполе, дисциплина королевской армии возросла, а наша рука в военных переговорах окрепла."
 STATIC_MODIFIER_NAME_sic_two_sicilies_mod: "Обе Сицилии"
 STATIC_MODIFIER_DESC_sic_two_sicilies_mod: "Престиж и легитимность нового королевства, охватывающего оба берега пролива, никогда не были выше."
 STATIC_MODIFIER_NAME_sic_golden_wheat_fields_mod: "Золотые пшеничные поля"
 STATIC_MODIFIER_DESC_sic_golden_wheat_fields_mod: "Древний Рим называл Сицилию «житницей империи» (Granarium Imperii). Обширные пшеничные поля внутренних областей острова непрестанно кормили мир Средиземноморья. Земледельческая роль Сицилии как «острова пшеницы» оставалась неизменной от античности до XIX века и была опорой продовольственной безопасности Средиземноморья."
 STATIC_MODIFIER_NAME_sic_palermo_resurgent_mod: "Возрождённое Палермо"
 STATIC_MODIFIER_DESC_sic_palermo_resurgent_mod: "Палермо (по-финикийски Панормос — «все гавани») — величайший город Сицилии, где слились нормандская, арабская и византийская культуры. Двор Рожера II славился как один из самых утончённых дворов Европы и был многокультурным центром, где арабский, греческий и латинский языки использовались бок о бок."
 STATIC_MODIFIER_NAME_sic_mediterranean_crossroads_mod: "Перекрёсток средиземноморской торговли"
 STATIC_MODIFIER_DESC_sic_mediterranean_crossroads_mod: "Сицилия лежит почти в центре Средиземноморья и служила перевалочным пунктом торговли между Востоком и Западом ещё со времён, когда древние финикийцы основали Карфаген. Сиракузы, родина греческого философа Архимеда, и Палермо, благоухающее арабской культурой — этот остров есть подлинное воплощение средиземноморской цивилизации."
 STATIC_MODIFIER_NAME_sic_sicilian_renaissance_mod: "Сицилийское Возрождение"
 STATIC_MODIFIER_DESC_sic_sicilian_renaissance_mod: "Расцветшая в Палермо культура повысила мастерство новых художников, поступающих на службу королевству."
 STATIC_MODIFIER_NAME_sic_kingdom_resurgent_mod: "Возрождённое королевство"
 STATIC_MODIFIER_DESC_sic_kingdom_resurgent_mod: "Блеск возрождённого королевства поднял его престиж и легитимность и укрепил его руку в военных переговорах как никогда прежде."
 sic_events.1.t: "Королевство, разделённое надвое"
 sic_events.1.d: "В 1282 году мы восстали против власти дома Анжу. Более не в силах терпеть тиранию чиновников, присланных из Франции, народ острова поднялся как один при звуке вечерних колоколов и изгнал французов с наших берегов. Мы приветствовали Педро III Арагонского как нового короля, и Королевство Сицилия было тем самым разделено надвое. За проливом, на материке с центром в Неаполе, король дома Анжу до сих пор именует себя «королём Сицилии». Лишь мы — истинные короли этого острова. Соперничество между двумя нашими державами продолжается по сей день."
 sic_events.1.a: "Понятно"
