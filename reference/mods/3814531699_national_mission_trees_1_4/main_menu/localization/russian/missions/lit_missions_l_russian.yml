l_russian:
 lit_lithuania_mission_pack: "От Балтики до Чёрного моря"
 lit_lithuania_mission_pack_DESCRIPTION:0 "В 1337 году Великое княжество Литовское под великим князем Гедимином — самая динамичная держава Восточной Европы. Разгроми Тевтонский орден, завоюй Рутению, достигни Чёрного моря, образуй дворянскую республику с Польшей — и избери свою веру, дабы определить душу Литвы."
 lit_lithuania_mission_pack_CRITERIA_DESCRIPTION:0 "Завоюй от Балтики до Чёрного моря и образуй дворянскую республику с Польшей, дабы возвести литовскую великую империю."
 lit_lithuania_mission_pack_BUTTON_TOOLTIP:0 "Правь как Литва Восточной Европой от Балтики до Чёрного моря."
 lit_lithuania_mission_pack_BUTTON_DETAILS:0 "«Земля Литвы, навеки» — от Гедимина до Витовта, верни блеск Великого княжества!"
 lit_gediminas_legacy: "Наследие Гедиминовичей"
 lit_gediminas_legacy_desc: "Унаследуй династические основы, заложенные великим князем Гедимином, и пройди путь к великой империи, простирающейся от Балтики до Чёрного моря."
 lit_teutonic_threat: "Угроза со стороны Тевтонского ордена"
 lit_teutonic_threat_desc: "Тевтонский орден, марширующий на восток под крестоносным знаменем — это религиозное военное государство — величайший враг Литвы. Сдержи его и обеспечь западную границу."
 lit_black_ruthenia_integration: "Включение Чёрной Руси"
 lit_black_ruthenia_integration_desc: "Чёрная Русь — расположенная вокруг Гродно и Бреста, приведи эту землю в сферу правления Литвы как основу для восточной экспансии."
 lit_volhynia_podolia: "Волынь и Подолия"
 lit_volhynia_podolia_desc: "Волынь и Подолия — приведи богатые равнины Западной Украины под литовский контроль и открой путь к Чёрному морю."
 lit_smolensk: "Завоевание Смоленска"
 lit_smolensk_desc: "Смоленск — стратегические врата к восточной Руси. Займи эту крепость и усиль давление на Москву."
 lit_kyiv: "Завоевание Киева"
 lit_kyiv_desc: "Киев — мать всех городов русских. Если Литва займёт Киев, откроется путь стать «правителем всей Руси»."
 lit_steppe_frontier: "Степная граница"
 lit_steppe_frontier_desc: "Великая степь, где бродят татары и куманы — возведи оборонительную линию в этом опасном пограничье и открой путь к Крыму."
 lit_crimea: "Покорение Крыма"
 lit_crimea_desc: "Полуостров Крым — ключ к Чёрному морю. Покори Крымское татарское ханство и обеспечь врата к Чёрному морю."
 lit_black_sea: "Владыка Чёрного моря"
 lit_black_sea_desc: "Чёрное море — море Литвы. От Крыма до Одессы окраси всё черноморское побережье литовским знаменем."
 lit_dominant_in_rus: "Верховенство над Русью"
 lit_dominant_in_rus_desc: "Москва или Литва — в борьбе за верховенство над Восточной Европой Литва торжествует и правит «владыкой всей Руси»."
 lit_teutonic_defeat: "Падение Тевтонского ордена"
 lit_teutonic_defeat_desc: "Старый враг со времён Танненберга, Тевтонский орден, наконец пал — владычество над Балтикой принадлежит Литве."
 lit_samogitia: "Жемайтия"
 lit_samogitia_desc: "Жемайтия — земля, долго оспариваемая Тевтонским орденом. Верни Литве родину этого упрямого балтийского народа."
 lit_livonia: "Владычество над Ливонией"
 lit_livonia_desc: "Рига и Ливония — приведи сердце балтийской торговли под литовский контроль и утверди влияние на Ганзу."
 lit_jogaila_union: "Уния Ягайло"
 lit_jogaila_union_desc: "Уния великого князя Ягайло с Королевством Польша — через обращение в католицизм и брак Литва и Польша связаны."
 lit_jagiellonian_dynasty: "Ягеллонская династия"
 lit_jagiellonian_dynasty_desc: "Ягеллонская династия — правя равно Литвой и Польшей, этот дом восстаёт величайшей державой Центральной Европы."
 lit_lublin_union: "Люблинская уния"
 lit_lublin_union_desc: "Люблинская уния 1569 года — исторический миг, когда Литва и Польша объединяются в «Польско-Литовскую дворянскую республику»."
 lit_polish_sejm: "Польский сейм"
 lit_polish_sejm_desc: "Сейм — это учреждение, через кое шляхта участвует в решениях государства, становится сердцем дворянской республики."
 lit_commonwealth: "Завершение дворянской республики"
 lit_commonwealth_desc: "Польско-Литовская дворянская республика — величайшее государство Центральной Европы, простирающееся от Балтики до Чёрного моря, завершено. «За нашу свободу» — знамя этой дворянской республики сияет над Европой."
 lit_faith_choice: "Выбор веры"
 lit_faith_choice_desc: "Католицизм, православие или Ромува — какую веру изберёт Литва? Это решение определит будущее нации."
 lit_catholic_baptism: "Крещение в католическую веру"
 lit_catholic_baptism_desc: "Крещение Вильнюса 1387 года — Литва принимает католицизм и становится частью европейского христианства."
 lit_faith_romuva_chosen_tt: "Выбрана ромува"
 lit_faith_orthodox_chosen_tt: "Выбрано православие"
 lit_faith_catholic_chosen_tt: "Выбрано католичество"
 lit_catholic_crusade: "Католический крестовый поход"
 lit_catholic_crusade_desc: "Под католическим знаменем — через контрудар против языческого крестоносного государства Тевтонского ордена Литва признаётся защитницей католического мира."
 lit_catholic_bishoprics: "Учреждение епископств"
 lit_catholic_bishoprics_desc: "Вильнюсское епископство — организуй структуру католической церкви в Литве и дай вере пустить глубокие корни."
 lit_catholic_king: "Коронация католического короля"
 lit_catholic_king_desc: "Католический король Польши-Литвы — законная, признанная папой корона ныне сияет над Ягеллонской династией."
 lit_orthodox_metropolis: "Православная митрополия"
 lit_orthodox_metropolis_desc: "Киевская митрополия — Литва берёт центр православия Руси под свою защиту. Правь Восточной Европой защитником православных верующих."
 lit_orthodox_third_rome: "Третий Рим"
 lit_orthodox_third_rome_desc: "Ныне, когда Константинополь пал — Киев становится новым центром православия, «Третьим Римом»."
 lit_orthodox_unity: "Единство православной церкви"
 lit_orthodox_unity_desc: "Единство православных верующих — православные церкви всей Руси собираются под защитой Литвы."
 lit_orthodox_tsar: "Православный царь"
 lit_orthodox_tsar_desc: "«Царь всея Руси» — литовский монарх, соединяющий православную власть с правлением над Русью, превосходит саму Москву."
 lit_romuva_maintained: "Сохрани Ромуву"
 lit_romuva_maintained_desc: "Ромува, древняя балтийская вера — вечное пламя жреца-жиниса горит заново, пока Литва стоит под языческим знаменем."
 lit_romuva_sanctuary: "Возведи святилище"
 lit_romuva_sanctuary_desc: "Священные рощи Литвы — защити святилища Ромувы и утверди духовный центр балтийской веры."
 lit_romuva_expansion: "Языческая экспансия"
 lit_romuva_expansion_desc: "Распространи Ромуву мечом — обрати окружающих православных, католиков и мусульман в Ромуву и возведи «великое языческое государство»."
 lit_romuva_pagan_king: "Языческий король"
 lit_romuva_pagan_king_desc: "«Великий языческий король» — рождён литовский языческий монарх, поднявший пламя Ромувы и правящий от Балтики до степи."
 lit_vilnius_capital: "Развитие Вильнюса"
 lit_vilnius_capital_desc: "Вильнюс — золотой город Литвы. Развей его дворцы, собор и рынки и придай ему великолепие, достойное имперской столицы."
 lit_amber_road: "Янтарный путь"
 lit_amber_road_desc: "Янтарный путь — захвати этот торговый путь, по коему балтийский янтарь несётся к Средиземноморью, и сделай Литву узлом европейской торговли."
 lit_grand_duchy_law: "Литовский статут"
 lit_grand_duchy_law_desc: "Литовский статут — изданный в 1529 году как самый передовой свод законов Центральной Европы, модернизируй правление Литвы."
 lit_krakow: "Развитие Кракова"
 lit_krakow_desc: "Краков — развей этот город ягеллонского блеска и дай ему сиять второй столицей Польско-Литовской дворянской республики."
 lit_red_ruthenia: "Завоевание Червонной Руси"
 lit_red_ruthenia_desc: "Червонная Русь и Галич — оспариваемые Польшей и Венгрией, займи эту землю для Литвы и расширь её территорию до Карпат."
 lit_moldavia: "Покорение Молдавии"
 lit_moldavia_desc: "Молдавия — румынское княжество на Дунае. Покори это государство и утверди опорный пункт на Балканах."
 lit_grand_empire: "Литовская великая империя"
 lit_grand_empire_desc: "«От Балтики до Чёрного моря» — мечта великого князя Витовта осуществлена. Великое княжество Литовское правит крупнейшей империей Европы."
 lit_events.5.t: "Выбор веры"
 lit_events.5.d: "Литва стоит на перекрёстке. Обратиться ли в католицизм и углубить союз с Польшей? Защитить ли православие и стать защитником Руси? Или сохранить унаследованную веру Ромувы и стать великим языческим королём?"
 lit_events.5.a: "Обратиться в католицизм — присоединиться к христианству и углубить польский союз"
 lit_events.5.b: "Избрать православие — стать защитником Руси и Восточного христианства"
 lit_events.5.c: "Сохранить Ромуву — никогда не дать погаснуть священному пламени жиниса"
 lit_events.10.t: "Завоевание Киева"
 lit_events.10.d: "Киев — мать всех городов русских — пал Литве. Не Москва, но Литва ныне несёт наследие Киевской Руси."
 lit_events.10.a: "Слава Киеву! Слава защитнику всей Руси!"
 lit_events.15.t: "Католический король"
 lit_events.15.d: "Под папским признанием коронован католический король Литвы и Польши — Литва ныне формально часть католического мира."
 lit_events.15.a: "Слава католическому королю! Пусть королевство пребудет вечно!"
 lit_events.16.t: "Царь Литвы"
 lit_events.16.d: "Правитель Литвы провозглашает себя «Царём всея Руси» — защитником православной веры. Не Москва, но Вильнюс должен быть Третьим Римом."
 lit_events.16.a: "Слава царю! Слава Третьему Риму!"
 lit_events.17.t: "Языческий король"
 lit_events.17.d: "Вечное пламя жиниса горит ярко — «Великий языческий король» взошёл под знаменем Ромувы и правит от Балтики до степи."
 lit_events.17.a: "Слава языческому королю! Пусть пламя Ромувы горит вечно!"
 lit_events.20.t: "Падение Тевтонского ордена"
 lit_events.20.d: "От Танненберга до последнего расчёта — Тевтонский орден наконец пал. Балтика принадлежит Литве."
 lit_events.20.a: "Тевтонский орден побеждён! Балтика наша!"
 lit_events.99.t: "Литовская великая империя"
 lit_events.99.d: "От Балтики до Чёрного моря — мечта Витовта исполнена. Литва правит крупнейшей империей Восточной Европы, превосходя даже древнюю Русь."
 lit_events.99.a: "Слава литовской великой империи! Вечная слава!"
 STATIC_MODIFIER_NAME_lit_amber_mod: "Владычество над Янтарным путём"
 STATIC_MODIFIER_DESC_lit_amber_mod: "Балтийская янтарная торговля удваивает богатство Литвы."
 STATIC_MODIFIER_NAME_lit_bishopric_mod: "Организация епископств"
 STATIC_MODIFIER_DESC_lit_bishopric_mod: "Структура католической церкви в Литве утверждена, и вера пустила глубокие корни."
 STATIC_MODIFIER_NAME_lit_black_sea_mod: "Владычество над Чёрным морем"
 STATIC_MODIFIER_DESC_lit_black_sea_mod: "Чёрное море стало внутренним морем Литвы, принося огромный поток торгового дохода."
 STATIC_MODIFIER_NAME_lit_catholic_king_mod: "Власть католического короля"
 STATIC_MODIFIER_DESC_lit_catholic_king_mod: "Признанная по всей Европе католическим королём, дипломатическая власть Литвы утверждена."
 STATIC_MODIFIER_NAME_lit_catholic_mod: "Крещение в католицизм"
 STATIC_MODIFIER_DESC_lit_catholic_mod: "Литва обратилась в католицизм и стала частью европейского христианства."
 STATIC_MODIFIER_NAME_lit_crimea_mod: "Покорение Крыма"
 STATIC_MODIFIER_DESC_lit_crimea_mod: "Полуостров Крым попал под литовский контроль, открывая врата к Чёрному морю."
 STATIC_MODIFIER_NAME_lit_crusade_mod: "Дух крестового похода"
 STATIC_MODIFIER_DESC_lit_crusade_mod: "Дух католического крестового похода выковал литовскую армию."
 STATIC_MODIFIER_NAME_lit_dynasty_mod: "Пробуждение династии Гедиминовичей"
 STATIC_MODIFIER_DESC_lit_dynasty_mod: "Кровь Гедиминовичей разжигает честолюбия завоевать Восточную Европу."
 STATIC_MODIFIER_NAME_lit_grand_empire_mod: "Завершение литовской великой империи"
 STATIC_MODIFIER_DESC_lit_grand_empire_mod: "От Балтики до Чёрного моря — мечта великого князя Витовта осуществлена."
 STATIC_MODIFIER_NAME_lit_jagiellonian_mod: "Правление Ягеллонской династии"
 STATIC_MODIFIER_DESC_lit_jagiellonian_mod: "Ягеллонская династия восходит величайшим королевским домом Центральной Европы."
 STATIC_MODIFIER_NAME_lit_jogaila_mod: "Уния Ягайло"
 STATIC_MODIFIER_DESC_lit_jogaila_mod: "Восковая печать на Кревской унии полностью изменила уважение, оказываемое литовским послам при польском дворе."
 STATIC_MODIFIER_NAME_lit_krakow_mod: "Процветание Кракова"
 STATIC_MODIFIER_DESC_lit_krakow_mod: "Краков сияет городом ягеллонского блеска."
 STATIC_MODIFIER_NAME_lit_livonia_mod: "Владычество над Ливонией"
 STATIC_MODIFIER_DESC_lit_livonia_mod: "Ливония, сердце балтийской торговли, ныне под литовским знаменем."
 STATIC_MODIFIER_NAME_lit_moldavia_mod: "Покорение Молдавии"
 STATIC_MODIFIER_DESC_lit_moldavia_mod: "Молдавия, будучи литовским вассалом, становится опорным пунктом к Балканам."
 STATIC_MODIFIER_NAME_lit_orthodox_mod: "Защита православной церкви"
 STATIC_MODIFIER_DESC_lit_orthodox_mod: "Литва взяла православную церковь под свою защиту и признана защитником Руси."
 STATIC_MODIFIER_NAME_lit_orthodox_tsar_mod: "Православный царь"
 STATIC_MODIFIER_DESC_lit_orthodox_tsar_mod: "Как царь всея Руси Литва правит вождём православного мира."
 STATIC_MODIFIER_NAME_lit_orthodox_unity_mod: "Единство православной церкви"
 STATIC_MODIFIER_DESC_lit_orthodox_unity_mod: "Православные церкви всей Руси собрались под литовским знаменем."
 STATIC_MODIFIER_NAME_lit_pagan_empire_mod: "Гегемония Великого языческого короля"
 STATIC_MODIFIER_DESC_lit_pagan_empire_mod: "Под знаменем Ромувы языческий король правит от Балтики до степи."
 STATIC_MODIFIER_NAME_lit_pagan_expansion_mod: "Языческая экспансия"
 STATIC_MODIFIER_DESC_lit_pagan_expansion_mod: "Под языческим знаменем литовская армия проносится по соседним государствам."
 STATIC_MODIFIER_NAME_lit_red_ruthenia_mod: "Завоевание Червонной Руси"
 STATIC_MODIFIER_DESC_lit_red_ruthenia_mod: "Червонная Русь и Галич присоединились к правлению Литвы."
 STATIC_MODIFIER_NAME_lit_romuva_mod: "Возрождение Ромувы"
 STATIC_MODIFIER_DESC_lit_romuva_mod: "Ромува, древняя балтийская вера, возрождена, и Литва стоит языческим государством."
 STATIC_MODIFIER_NAME_lit_rus_mod: "Правитель Руси"
 STATIC_MODIFIER_DESC_lit_rus_mod: "Литва стала правителем всей Руси и вождём Восточной Европы."
 STATIC_MODIFIER_NAME_lit_ruthenia_mod: "Покорение Чёрной Руси"
 STATIC_MODIFIER_DESC_lit_ruthenia_mod: "Чёрная Русь присоединилась к правлению Литвы, утверждая основу для восточной экспансии."
 STATIC_MODIFIER_NAME_lit_sanctuary_mod: "Учреждение святилища Ромувы"
 STATIC_MODIFIER_DESC_lit_sanctuary_mod: "Священные рощи Литвы утверждены, и языческое пламя горит ярко."
 STATIC_MODIFIER_NAME_lit_sejm_mod: "Учреждение сейма"
 STATIC_MODIFIER_DESC_lit_sejm_mod: "Сейм учреждён и модернизирует правление Литвы."
 STATIC_MODIFIER_NAME_lit_smolensk_mod: "Владычество над Смоленском"
 STATIC_MODIFIER_DESC_lit_smolensk_mod: "Смоленск действует восточными вратами Литвы."
 STATIC_MODIFIER_NAME_lit_steppe_mod: "Учреждение степной границы"
 STATIC_MODIFIER_DESC_lit_steppe_mod: "Степная граница учреждена и сдерживает татарские набеги."
 STATIC_MODIFIER_NAME_lit_teutonic_mod: "Сопротивление Тевтонскому ордену"
 STATIC_MODIFIER_DESC_lit_teutonic_mod: "Угроза Тевтонского ордена выковала литовскую армию."
 STATIC_MODIFIER_NAME_lit_third_rome_mod: "Третий Рим"
 STATIC_MODIFIER_DESC_lit_third_rome_mod: "Киев стал «Третьим Римом», центром православной церкви."
 STATIC_MODIFIER_NAME_lit_volhynia_mod: "Завоевание Волыни и Подолии"
 STATIC_MODIFIER_DESC_lit_volhynia_mod: "Равнины Западной Украины окрашены литовским знаменем."
 lit_vilnius_jerusalem: "Иерусалим Севера"
 lit_vilnius_jerusalem_desc: "Вильнюс — «Иерусалим Севера». Искусство и население текут в этот город, где сосуществуют разнообразные религии и культуры, и он сияет культурным центром Литвы в Европе."
 STATIC_MODIFIER_NAME_lit_vilnius_jerusalem_mod: "Иерусалим Севера"
 STATIC_MODIFIER_DESC_lit_vilnius_jerusalem_mod: "Вильнюс становится «Иерусалимом Севера» — центром разнообразных народов, религий и культур."
 STATIC_MODIFIER_NAME_lit_teutonic_victory_mod: "Поражение Тевтонского ордена"
 STATIC_MODIFIER_DESC_lit_teutonic_victory_mod: "Чёрно-крестное знамя Мальборка спущено, и литовские солдаты маршируют на запад с песнями победы."
 STATIC_MODIFIER_NAME_lit_vilnius_capital_mod: "Вильнюс развит"
 STATIC_MODIFIER_DESC_lit_vilnius_capital_mod: "От Гедиминовой башни в Вильнюсе крыши и стены имперской столицы простираются, насколько хватает взора."
 lit_memel: "Клайпеда — врата к Балтике"
 lit_memel_desc: "Клайпеда (Мемель) — портовый город на балтийском побережье. Возвращённый от Тевтонского ордена, развей этот город вратами Литвы к морю и центром янтарной торговли."
 STATIC_MODIFIER_NAME_lit_memel_mod: "Порт Клайпеда развит"
 STATIC_MODIFIER_DESC_lit_memel_mod: "Порт Клайпеда развит вратами балтийской торговли."
 STATIC_MODIFIER_NAME_lit_lublin_union_mod: "Преимущества Люблинской унии"
 STATIC_MODIFIER_DESC_lit_lublin_union_mod: "Парламентская система и управление дворянской республики утверждены."
 lit_lublin_dev: "Развитие Люблина"
 lit_lublin_dev_desc: "Люблин — будущее место Люблинской унии. Развей этот город административным и торговым центром южной Литвы."
 lit_lviv_dev: "Развитие Львова"
 lit_lviv_dev_desc: "Львов — перекрёсток восточной торговли. Развей центр Галича и способствуй процветанию юго-востока царства."
 lit_kaunas_dev: "Каунас — страж литовского права"
 lit_kaunas_dev_desc: "Каунас (Ковно) — расположенный при слиянии Нериса и Немана, этот город служил седалищем Высшего трибунала Великого княжества Литовского (Lietuvos Vyriausiasis Tribunolas) и действовал высшей апелляционной инстанцией для литовской стороны дворянской республики. Подобно королевскому двору в Кракове в Польше или Парламенту Экса в Провансе, Каунас служил стражем регионального права, связующего центральное законодательство с местным обычаем. Развей Каунас центром литовского правового управления."
 lit_hrodna_dev: "Развитие Гродно"
 lit_hrodna_dev_desc: "Гродно (Хрудна) — центр Чёрной Руси. Развей этот важный западный город Великого княжества."
 lit_minsk_dev: "Развитие Минска"
 lit_minsk_dev_desc: "Минск — центр Белоруссии. Развей его восточным административным узлом литовской империи."
 STATIC_MODIFIER_NAME_lit_commonwealth_final_mod: "Дворянская республика завершена"
 STATIC_MODIFIER_DESC_lit_commonwealth_final_mod: "Польско-Литовская дворянская республика завершена — управление и войско организованы во всех провинциях."
 STATIC_MODIFIER_NAME_lit_lublin_mod: "Люблин процветает"
 STATIC_MODIFIER_DESC_lit_lublin_mod: "Люблин развит административным и торговым центром южной Литвы."
 STATIC_MODIFIER_NAME_lit_lviv_mod: "Львов процветает"
 STATIC_MODIFIER_DESC_lit_lviv_mod: "Львов процветает перекрёстком восточной торговли."
 STATIC_MODIFIER_NAME_lit_kaunas_mod: "Высший трибунал Великого княжества Литовского"
 STATIC_MODIFIER_DESC_lit_kaunas_mod: "Каунас развит внутренним узлом балтийской торговли."
 STATIC_MODIFIER_NAME_lit_hrodna_mod: "Административное усиление Гродно"
 STATIC_MODIFIER_DESC_lit_hrodna_mod: "От врат Гродно кони гонцов скачут утром до вечера к столице Вильнюс."
 STATIC_MODIFIER_NAME_lit_minsk_mod: "Минск процветает"
 STATIC_MODIFIER_DESC_lit_minsk_mod: "Минск развит восточным административным узлом литовской империи."
