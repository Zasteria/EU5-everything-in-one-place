l_russian:
 por_portuguese_mission_pack: "Эпоха великих открытий — морская держава Португалии"
 por_portuguese_mission_pack_DESCRIPTION:0 "В 1337 году Португалия — малое королевство на западной оконечности Иберийского полуострова. Но экспедиции, организованные принцем Энрике Мореплавателем (1394-1460), изменят мир — Мадейра, Азорские острова, Западная Африка, мыс Доброй Надежды, Индия, Малакка, Бразилия. От Атлантики до Индийского океана возведи «Estado da Índia», где португальские мореходы правят морями."
 por_portuguese_mission_pack_CRITERIA_DESCRIPTION:0 "Развей метрополию, обогни Африку, дабы достичь Индийского океана, колонизируй Бразилию и правь владыкой морей."
 por_portuguese_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы осуществить империю эпохи великих открытий Португалии."
 por_portuguese_mission_pack_BUTTON_DETAILS:0 "От принца Энрике Мореплавателя до Португалии Филиппа II!"
 por_infante_henrique: "Мореходная традиция Португалии"
 por_infante_henrique_desc: "В 1337 году Португалия — малое королевство на западной оконечности Иберийского полуострова. Под правлением Альфонсо IV Португалия поддержала Кастилию в битве при Рио-Саладо (1340) и отразила Маринидов как морская держава. Это королевство, обращённое к Атлантике, издавна питает сродство с морем. Порт Лиссабона, рыбаки Алгарве, атлантические ветры — эта мореходная традиция есть основа, кая породит грядущее поколение эпохи великих открытий."
 por_dev_lisbon: "Развей Лиссабон"
 por_dev_lisbon_desc: "Лиссабон в устье Тежу благословлён естественной гаванью. Развитие этого города, основанного древними финикийцами, в столицу португальской империи делает его центром мировой торговли."
 por_dev_porto: "Развей Порту"
 por_dev_porto_desc: "Порту на Дору — город вина и рыболовства. Развей этот древний город, кой одолжит своё имя грядущим поколениям для «Portugal (порт Порту)»."
 por_university_coimbra: "Университет Коимбры"
 por_university_coimbra_desc: "Университет Коимбры, основанный в 1290 году — старейший в Португалии — обучает мореходов, юристов и духовенство. Многие учёные, служившие принцу Энрике, обучались здесь."
 por_lisbon_entrepot_nmt: "Лиссабон как торговый узел"
 por_lisbon_entrepot_nmt_desc: "Развей портовое управление Лиссабона, дабы восточные товары распределялись отсюда по всей Европе. Перец, пряности, шёлк — Лиссабон становится крупнейшим пряным рынком Европы."
 por_avis_dynasty: "Укрепление дома Авис"
 por_avis_dynasty_desc: "Дом Авис, переживший династический кризис 1385 года — победа Жуана I утвердила португальскую династию с устойчивой основой правления."
 por_ordenacoes_afonsinas: "Ordenações Afonsinas"
 por_ordenacoes_afonsinas_desc: "Ordenações Afonsinas, составленные в 1446 году, — первый систематический свод законов Португалии. Служа образцом для позднейших мануэлинских и филиппинских сводов, они утверждают правовую традицию Португалии."
 por_dev_evora: "Развей Эвору"
 por_dev_evora_desc: "Эвора, столица области Алентежу — развей этот древний город, хранящий римские храмы, земледельческим и культурным центром."
 por_algarve_fisheries: "Рыболовство Алгарве"
 por_algarve_fisheries_desc: "Область Алгарве на юге Португалии граничит с атлантическими рыбными угодьями. Богатые угодья трески, сардины и тунца питают португальское сродство с морем, кое станет основой эпохи великих открытий."
 por_ceuta_gateway: "Сеута — врата в Африку"
 por_ceuta_gateway_desc: "В 1415 году войска Жуана I завоевали Сеуту — начало заморской экспансии Португалии. Здесь принц Энрике получил от мусульманских купцов сведения о сахарских торговых путях, что питало его честолюбие плыть на юг вдоль Африки."
 por_conquer_tangier: "Завоюй Танжер"
 por_conquer_tangier_desc: "Танжер, лежащий напротив Сеуты через Гибралтарский пролив — усиль давление на мусульманские силы Северной Африки и обеспечь атлантический выход."
 por_moroccan_fortress: "Марокканские крепости"
 por_moroccan_fortress_desc: "Через владычество над марокканскими торговыми городами, включая Агадир, овладей конечной точкой трансахарской торговли и монополизируй прибыли от золота, слоновой кости и соли."
 por_madeira_settlement: "Заселение Мадейры"
 por_madeira_settlement_desc: "Мадейра, достигнутая португальцами в 1419 году, — первая атлантическая колония. Введение сахара на этом необитаемом острове утвердило модель сахарных плантаций, кая позже будет использована в Бразилии и Вест-Индии."
 por_azores_settlement: "Заселение Азорских островов"
 por_azores_settlement_desc: "Колонизация Азорских островов посреди Атлантики обеспечивает промежуточную станцию на трансатлантических путях. Использование её базой позволяет дальнейшее исследование на запад."
 por_guinea_trade: "Торговля с Гвинеей"
 por_guinea_trade_desc: "Гвинейский залив, достигнутый португальцами при их плавании на юг вдоль западноафриканского побережья — торговля золотом, слоновой костью и позже рабами начинается. Мечта принца Энрике становится явью."
 por_gold_coast: "Золотой берег"
 por_gold_coast_desc: "Эльмина (1482) — первая постоянная торговая крепость, воздвигнутая Португалией в Африке. Огромные количества золота текут из этого «Золотого берега» в Португалию."
 por_sao_tome_sugar: "Сахар Сан-Томе"
 por_sao_tome_sugar_desc: "Остров Сан-Томе близ экватора идеален для сахарных плантаций. С принудительным трудом с африканского материка Сан-Томе становится крупнейшим поставщиком сахара Европе."
 por_angola_colony: "Колония Ангола"
 por_angola_colony_desc: "Ангола, будучи следующим опорным пунктом после Сан-Томе, становится важной португальской колонией. Учреди торговые отношения с Королевством Конго и расширь влияние в центрально-западной Африке."
 por_cape_of_good_hope: "Мыс Доброй Надежды"
 por_cape_of_good_hope_desc: "В 1488 году Бартоломеу Диаш достиг южной оконечности Африки, «мыса Бурь». Жуан II переименовал его в «мыс Доброй Надежды» — ибо путь в Индию был ныне открыт."
 por_east_africa_trading_posts: "Восточноафриканские торговые посты"
 por_east_africa_trading_posts_desc: "Мозамбик, Софала — занятие золото- и слоновокостяных торговых постов суахилийского побережья достигает вхождения в торговую сеть Индийского океана."
 por_mombasa_fort: "Крепость Момбаса"
 por_mombasa_fort_desc: "Момбаса и Малинди — покорение крупнейших торговых городов Восточной Африки утверждает контроль над Индийским океаном. В 1498 году Васко да Гама получил в Малинди навигационное руководство в Индию."
 por_vasco_da_gama: "Васко да Гама достигает Индии"
 por_vasco_da_gama_desc: "20 мая 1498 года Васко да Гама высадился в Каликуте (Кожикоде). В этот миг морской путь между Европой и Азией открылся, и структура торговли пряностями, монополизированной арабскими купцами и Венецией, коренным образом изменилась."
 por_conquer_goa: "Завоюй Гоа"
 por_conquer_goa_desc: "В 1510 году Альбукерке завоевал Гоа — рождение «восточной столицы» Португалии. Естественная гавань Гоа на западном побережье Индии процветает центром Estado da Índia (Португальской Индии)."
 por_malabar_trade: "Пряности Малабарского берега"
 por_malabar_trade_desc: "Кочин, Каликут, Килон — Малабарский берег производит перец, кардамон и имбирь. Через монополизацию пряностей здесь Португалия господствует над европейскими ценами на пряности."
 por_hormuz_control: "Овладей Ормузом"
 por_hormuz_control_desc: "В 1515 году Альбукерке завоевал Ормуз у входа в Персидский залив. Владычество над этим пунктом означает господство над персидско-индийской торговлей и пресечение торговли исламского мира."
 por_conquer_malacca: "Завоюй Малакку"
 por_conquer_malacca_desc: "В июле 1511 года Афонсу де Албукерки с 1200 португальскими солдатами завоевал Малакку — величайшая стратегическая победа эпохи великих открытий. Владычество над «горловиной восточной торговли» захватывает все торговые пути пряностей, шёлка и фарфора."
 por_spice_monopoly: "Монополия на пряности"
 por_spice_monopoly_desc: "С обеспеченными Гоа, Ормузом и Малаккой торговые пути пряностей Индийского океана полностью под португальским контролем. Перец, мускатный орех и гвоздика поставляются через Лиссабон в Европу."
 por_indian_ocean_empire: "Империя Индийского океана"
 por_indian_ocean_empire_desc: "От Восточной Африки до Малакки — португальский флот господствует над Индийским океаном. Casa da Índia (Индийский дом) в Лиссабоне управляет всей торговлей пряностями, и огромное богатство течёт в Португалию."
 por_brazil_discovery: "Открытие Бразилии"
 por_brazil_discovery_desc: "22 апреля 1500 года — на пути в Индию с флотом из 13 кораблей Педру Алвариш Кабрал далеко отклонился на запад, дабы избежать бури, и открыл неведомую землю. «Ilha de Vera Cruz (Остров Истинного Креста)» — позже названный «Бразилией» (от дерева пау-бразил). По Тордесильясскому договору эта земля становится португальской территорией и позже станет крупнейшей колонией Португалии."
 por_brazil_colony: "Колонизируй Бразилию"
 por_brazil_colony_desc: "В 1532 году Мартин Афонсу де Соуза основал первую постоянную колонию Бразилии, «Сан-Висенте». Возникает новое общество, в коем смешиваются португальские поселенцы и коренные народы."
 por_brazil_sugar: "Сахарная промышленность Бразилии"
 por_brazil_sugar_desc: "К середине XVI века Бразилия стала крупнейшим поставщиком сахара Европе. Инженьу (сахарные мельницы) Пернамбуку и Баии работают принудительным трудом из Африки, производя огромное богатство."
 por_brazil_empire: "Бразильская империя"
 por_brazil_empire_desc: "Баия, Пернамбуку, Рио-де-Жанейро — колонии Бразилии выросли до имперского масштаба. Сахар, красное дерево и позже золото и самоцветы создают потоки богатства в Португалию."
 por_naval_supremacy: "Морское владычество"
 por_naval_supremacy_desc: "Португальский флот, господствующий и над Атлантикой, и над Индийским океаном — превосходная манёвренность каравеллы и огневая мощь пушек превосходят арабские, индийские и китайские торговые суда."
 por_caravel: "Каравелла"
 por_caravel_desc: "Каравелла, развитая в эпоху принца Энрике — это малое, быстрое судно с латинскими парусами, способное идти против ветра, сделало эпоху великих открытий возможной. Санта-Мария также была каравеллой."
 por_padroes: "Padrões (каменные столбы)"
 por_padroes_desc: "Португальские исследователи возводили в разных местах Африки каменные столбы (padrões), несущие имя португальского короля и христианский крест. Это было заявлением открытия и владычества — досягаемость Португалии, высеченная в камне."
 por_royal_navy: "Королевский флот"
 por_royal_navy_desc: "Сильнейший флот мира поддерживает португальское верховенство — галеоны, каракки и каравеллы защищают всё от Индийского океана до Бразилии."
 por_dev_setubal: "Развей Сетубал"
 por_dev_setubal_desc: "Залив Сетубал к югу от Лиссабона — естественная гавань. Развей его портовым городом, дополняющим Лиссабон и производящим соль, рыбу и вино."
 por_order_of_christ: "Орден Христа"
 por_order_of_christ_desc: "Орден Христа (Ordem de Cristo), основанный в 1319 году — этот военный орден, учреждённый в Португалии наследником тамплиеров, финансировал экспедиции принца Энрике. Алый крест ордена был начертан на португальских парусах."
 por_treaty_tordesillas: "Тордесильясский договор"
 por_treaty_tordesillas_desc: "В 1494 году Испания и Португалия при посредничестве папы Александра VI заключили Тордесильясский договор — разделивший Атлантику вертикально, запад Испании, восток Португалии. Этот договор подтвердил Бразилию португальской территорией."
 por_colonial_administration: "Колониальное управление"
 por_colonial_administration_desc: "Административный аппарат для руководства империей Португалии, охватывающей Африку, Индию и Бразилию — наместники и вице-короли доносят королю в Лиссабоне и посылают торговые доходы в метрополию."
 por_estado_da_india_nmt: "Estado da Índia"
 por_estado_da_india_nmt_desc: "«Estado da Índia (Государство Индия)» — термин, относящийся ко всей азиатской империи Португалии. С Гоа столицей и владычеством над морскими торговыми путями от Восточной Африки до Малакки эта «империя» — первая истинно глобальная морская империя истории."
 por_dev_tomar: "Развей Томар"
 por_dev_tomar_desc: "Томар, главная резиденция Ордена Христа — Монастырь Христа (Convento de Cristo) считается лучшим образцом португальской мануэлинской архитектуры. Развей его финансовыми средствами ордена."
 por_wine_trade: "Португальская винная торговля"
 por_wine_trade_desc: "Вина долины Дору — прототип «портвейна» — важный экспортный товар в Англию и Фландрию. Утверди англо-португальские торговые отношения, предвосхищающие Метуэнский договор (1703)."
 por_dev_faro: "Развей Фару"
 por_dev_faro_desc: "Фару, столица области Алгарве — включённая в Португалию христианской Реконкистой в 1249 году, развей этот южный город узлом рыболовства и торговли."
 por_cape_verde: "Острова Зелёного Мыса"
 por_cape_verde_desc: "Острова Зелёного Мыса, открытые в 1456 году, занимают стратегическое положение на полпути между Африкой и Америкой. Как перевалочный пункт трансатлантической торговли, они станут базой снабжения для позднейшей бразильской колонизации."
 por_lisbon_megalopolis: "Лиссабон — мировой город"
 por_lisbon_megalopolis_desc: "В XVI веке Лиссабон стал одним из крупнейших городов Европы с населением свыше 100000. Восточные пряности, африканское золото и бразильский сахар сходятся здесь, обретая ему прозвище «столица мира»."
 por_casa_india: "Casa da Índia"
 por_casa_india_desc: "Casa da Índia (Индийский дом), учреждённый в Лиссабоне, управляет восточной торговлей Португалии исключительно как государственное учреждение. Весь пряный импорт проходит здесь, порождая огромные таможенные доходы."
 por_brazil_wood: "Пау-бразил (бразильское дерево)"
 por_brazil_wood_desc: "Пау-бразил (бразильское дерево), от коего Бразилия получила своё имя — это красное красильное дерево вывозится в огромных количествах, незаменимый товар для европейской шерстекрасильной промышленности. Это первый продукт бразильской торговли."
 por_atlantic_domination: "Владычество над Атлантикой"
 por_atlantic_domination_desc: "От Лиссабона до Азорских островов, Мадейры, Островов Зелёного Мыса и Бразилии — Португалия господствует над всей Атлантикой. Победив соперничество с Испанией, Португалия правит главным действующим лицом атлантической торговли."
 por_empire_of_seas: "Владыка морей"
 por_empire_of_seas_desc: "«Португалия — малая страна, но правит половиной мира» — слова историка сбываются. От Атлантики до Индийского океана, от Бразилии до Малакки — империя Португалии господствует над морями мира. Estado da Índia завершён."
 por_events.10.t: "Мыс Доброй Надежды — путь в Индию открывается"
 por_events.10.d: "В 1488 году флот Бартоломеу Диаша обогнул южнейший «мыс Бурь» Африки и достиг Индийского океана. Жуан II затрепетал при этой вести — пятнадцать лет спустя Васко да Гама откроет прямой путь в Индию. Эпоха, когда арабские купцы монополизировали торговлю пряностями, приближается к концу."
 por_events.10.a: "Слава Богу и Португалии! Путь в Индию открыт!"
 por_events.20.t: "Васко да Гама достигает Индии"
 por_events.20.d: "20 мая 1498 года — через десять месяцев после отплытия из Лиссабона с четырьмя кораблями, Васко да Гама высадился в Каликуте. Местный правитель (заморин) был недоверчив, но Португалия обеспечила вход в торговлю пряностями. Пока арабские купцы кипели гневом, началась эпоха восточной торговли Португалии."
 por_events.20.a: "Перец и пряности — Португалия захватила богатство Индии!"
 por_events.30.t: "Завоевание Малакки — захват горловины пряной торговли"
 por_events.30.d: "В июле 1511 года Афонсу де Албукерки с 1200 португальскими силами завоевал Малакку. «Важнейшее место Востока» — владычество над Малаккой захватывает все торговые пути Китая, Индии и Островов пряностей. Албукерки поставил Малакку рядом с Гоа и Ормузом одним из трёх столпов португальской империи."
 por_events.30.a: "Малакка наша! Восточная торговля — монополия Португалии!"
 por_events.40.t: "Открытие Бразилии Кабралом"
 por_events.40.d: "22 апреля 1500 года — на пути в Индию с флотилией из 13 кораблей Педру Алвариш Кабрал далеко отклонился на запад, дабы избежать бури, и открыл неведомую землю. «Ilha de Vera Cruz» — часть южноамериканского континента, позже названная «Бразилией». По Тордесильясскому договору эта земля становится португальской территорией, и эта земля позже станет крупнейшей колонией Португалии."
 por_events.40.a: "Открытие по Божьему водительству! Бразилия принадлежит Португалии!"
 por_events.99.t: "Владыка морей — империя Португалии завершена"
 por_events.99.d: "От Лиссабона до Гоа, от Малакки до Бразилии — империя Португалии господствует над морями мира. «Морской Шёлковый путь», о коем мечтал принц Энрике, стал явью, и пряности, золото, сахар и слоновая кость встречаются в Лиссабоне. Португалия преобразилась из малой нации в 92000 квадратных километров в первую в мире «глобальную морскую империю»."
 por_events.99.a: "Португалия навеки! Правь владыкой морей!"
 STATIC_MODIFIER_NAME_por_henrique_mod: "Мореходная традиция Португалии"
 STATIC_MODIFIER_DESC_por_henrique_mod: "Португалия Альфонсо IV лелеет свою мореходную традицию — атлантическое рыболовство, торговля и навигационное искусство образуют основу этого царства."
 STATIC_MODIFIER_NAME_por_lisbon_mod: "Процветание Лиссабона"
 STATIC_MODIFIER_DESC_por_lisbon_mod: "Лиссабон в устье Тежу развит центром мировой торговли."
 STATIC_MODIFIER_NAME_por_porto_mod: "Рост Порту"
 STATIC_MODIFIER_DESC_por_porto_mod: "Порту на Дору развит городом вина и рыболовства."
 STATIC_MODIFIER_NAME_por_coimbra_mod: "Университет Коимбры"
 STATIC_MODIFIER_DESC_por_coimbra_mod: "Старейший университет Португалии обучает мореходов, юристов и духовенство."
 STATIC_MODIFIER_NAME_por_lisbon_trade_mod: "Лиссабон как торговый узел"
 STATIC_MODIFIER_DESC_por_lisbon_trade_mod: "Лиссабон утверждён крупнейшим восточным пряным узлом Европы."
 STATIC_MODIFIER_NAME_por_avis_mod: "Власть дома Авис"
 STATIC_MODIFIER_DESC_por_avis_mod: "Правление династии Авис стабилизировано, основа для эпохи великих открытий заложена."
 STATIC_MODIFIER_NAME_por_ordenacoes_mod: "Ordenações Afonsinas"
 STATIC_MODIFIER_DESC_por_ordenacoes_mod: "Первый систематический свод законов, составленный писцами Лиссабона, несёт те же правила в суды каждого уголка царства."
 STATIC_MODIFIER_NAME_por_evora_mod: "Рост Эворы"
 STATIC_MODIFIER_DESC_por_evora_mod: "Древний город Алентежу, Эвора, развит земледельческим и культурным центром."
 STATIC_MODIFIER_NAME_por_fisheries_mod: "Рыболовство Алгарве"
 STATIC_MODIFIER_DESC_por_fisheries_mod: "Атлантические рыбные угодья питали португальское сродство с морем."
 STATIC_MODIFIER_NAME_por_ceuta_mod: "Опорный пункт Сеута"
 STATIC_MODIFIER_DESC_por_ceuta_mod: "Африканские врата Сеута стали отправной точкой заморской экспансии Португалии."
 STATIC_MODIFIER_NAME_por_tangier_mod: "Танжер завоёван"
 STATIC_MODIFIER_DESC_por_tangier_mod: "Гибралтарский пролив занят, контроль над африканским переходом утверждён."
 STATIC_MODIFIER_NAME_por_morocco_mod: "Марокканские крепости"
 STATIC_MODIFIER_DESC_por_morocco_mod: "Сахарские торговые конечные точки покорены — португальское влияние распространяется по Северной Африке."
 STATIC_MODIFIER_NAME_por_madeira_mod: "Мадейра развита"
 STATIC_MODIFIER_DESC_por_madeira_mod: "Первая колония Атлантики, Мадейра, утвердила модель сахарных плантаций."
 STATIC_MODIFIER_NAME_por_azores_mod: "Азорские острова"
 STATIC_MODIFIER_DESC_por_azores_mod: "Срединно-атлантические Азорские острова обеспечены трансатлантической базой перевалки."
 STATIC_MODIFIER_NAME_por_guinea_trade_mod: "Торговля с Гвинеей"
 STATIC_MODIFIER_DESC_por_guinea_trade_mod: "Мешки золотого песка и слоновой кости, прибывающие из портов Гвинеи, каждый день наполняют книги королевской торговой палаты Лиссабона."
 STATIC_MODIFIER_NAME_por_gold_coast_mod: "Золотой берег"
 STATIC_MODIFIER_DESC_por_gold_coast_mod: "Золото из крепости Эльмина обогатило португальскую экономику."
 STATIC_MODIFIER_NAME_por_sao_tome_mod: "Сахар Сан-Томе"
 STATIC_MODIFIER_DESC_por_sao_tome_mod: "Экваториальный Сан-Томе стал крупнейшим поставщиком сахара Европе."
 STATIC_MODIFIER_NAME_por_angola_mod: "Колония Ангола"
 STATIC_MODIFIER_DESC_por_angola_mod: "Ангола утверждена центральнозападноафриканским опорным пунктом Португалии."
 STATIC_MODIFIER_NAME_por_east_africa_mod: "Восточноафриканские торговые посты"
 STATIC_MODIFIER_DESC_por_east_africa_mod: "Золото- и слоновокостяная торговая сеть суахилийского побережья занята Португалией."
 STATIC_MODIFIER_NAME_por_mombasa_mod: "Крепость Момбаса"
 STATIC_MODIFIER_DESC_por_mombasa_mod: "Крупнейший торговый город Восточной Африки, Момбаса, попал под португальский контроль."
 STATIC_MODIFIER_NAME_por_goa_mod: "Гоа — восточная столица"
 STATIC_MODIFIER_DESC_por_goa_mod: "Столица Estado da Índia, Гоа, стала центром торговли Индийским океаном."
 STATIC_MODIFIER_NAME_por_malabar_mod: "Пряности Малабарского берега"
 STATIC_MODIFIER_DESC_por_malabar_mod: "Малабарский берег, производящий перец, кардамон и имбирь, под португальским контролем."
 STATIC_MODIFIER_NAME_por_hormuz_mod: "Ормуз покорён"
 STATIC_MODIFIER_DESC_por_hormuz_mod: "Вход в Персидский залив, Ормуз, занят — персидско-индийская торговля покорена."
 STATIC_MODIFIER_NAME_por_spice_monopoly_mod: "Монополия на пряности"
 STATIC_MODIFIER_DESC_por_spice_monopoly_mod: "Торговые пути пряностей Индийского океана полностью под португальским контролем."
 STATIC_MODIFIER_NAME_por_indian_ocean_mod: "Империя Индийского океана"
 STATIC_MODIFIER_DESC_por_indian_ocean_mod: "Португальский флот господствует над Индийским океаном от Восточной Африки до Малакки."
 STATIC_MODIFIER_NAME_por_brazil_mod: "Колония Бразилия"
 STATIC_MODIFIER_DESC_por_brazil_mod: "Обширная южноамериканская колония Бразилия стала вторым столпом португальской империи."
 STATIC_MODIFIER_NAME_por_brazil_sugar_mod: "Бразильский сахар"
 STATIC_MODIFIER_DESC_por_brazil_sugar_mod: "Сахарные плантации Бразилии стали крупнейшим поставщиком сахара Европе."
 STATIC_MODIFIER_NAME_por_brazil_empire_mod: "Бразильская империя"
 STATIC_MODIFIER_DESC_por_brazil_empire_mod: "Бразилия выросла в колонию имперского масштаба — западная империя Португалии завершена."
 STATIC_MODIFIER_NAME_por_naval_mod: "Морское владычество"
 STATIC_MODIFIER_DESC_por_naval_mod: "Португальский флот, господствующий над Атлантикой и Индийским океаном, утверждён."
 STATIC_MODIFIER_NAME_por_caravel_mod: "Каравелла"
 STATIC_MODIFIER_DESC_por_caravel_mod: "Каравелла, бросающая вызов ветру, сделала эпоху великих открытий возможной."
 STATIC_MODIFIER_NAME_por_padroes_mod: "Padrões"
 STATIC_MODIFIER_DESC_por_padroes_mod: "Каменные столбы, отмечающие досягаемость Португалии, возведены по всему миру."
 STATIC_MODIFIER_NAME_por_royal_navy_mod: "Королевский флот"
 STATIC_MODIFIER_DESC_por_royal_navy_mod: "Сильнейший королевский флот Португалии в мире охраняет империю."
 STATIC_MODIFIER_NAME_por_setubal_mod: "Порт Сетубал"
 STATIC_MODIFIER_DESC_por_setubal_mod: "Порт Сетубала развит, дополняя Лиссабон."
 STATIC_MODIFIER_NAME_por_order_christ_mod: "Орден Христа"
 STATIC_MODIFIER_DESC_por_order_christ_mod: "Орден, поддерживавший экспедиции Энрике, стал защитником Португалии."
 STATIC_MODIFIER_NAME_por_tordesillas_mod: "Тордесильясский договор"
 STATIC_MODIFIER_DESC_por_tordesillas_mod: "Мирораздельный договор подтвердил Бразилию и Восток португальской территорией."
 STATIC_MODIFIER_NAME_por_colonial_admin_mod: "Колониальное управление"
 STATIC_MODIFIER_DESC_por_colonial_admin_mod: "Административный аппарат для руководства Африкой, Индией и Бразилией утверждён."
 STATIC_MODIFIER_NAME_por_estado_india_mod: "Estado da Índia"
 STATIC_MODIFIER_DESC_por_estado_india_mod: "Португальская Индия с Гоа столицей — первая истинно глобальная морская империя истории."
 STATIC_MODIFIER_NAME_por_tomar_mod: "Монастырь Томар"
 STATIC_MODIFIER_DESC_por_tomar_mod: "Главная резиденция Ордена Христа, Томар, развита архитектурным шедевром Португалии."
 STATIC_MODIFIER_NAME_por_wine_mod: "Португальское вино"
 STATIC_MODIFIER_DESC_por_wine_mod: "Вина долины Дору стали важным экспортным товаром в Англию и Фландрию."
 STATIC_MODIFIER_NAME_por_faro_mod: "Рост Фару"
 STATIC_MODIFIER_DESC_por_faro_mod: "Столица Алгарве, Фару, развита узлом рыболовства и торговли."
 STATIC_MODIFIER_NAME_por_empire_of_seas_final_mod: "Владыка морей"
 STATIC_MODIFIER_DESC_por_empire_of_seas_final_mod: "Мечта принца Энрике осуществлена. От Атлантики до Индийского океана империя Португалии господствует над морями мира."
 STATIC_MODIFIER_NAME_por_cape_verde_mod: "Острова Зелёного Мыса"
 STATIC_MODIFIER_DESC_por_cape_verde_mod: "Трансатлантическая перевалочная база Островов Зелёного Мыса утверждена."
 STATIC_MODIFIER_NAME_por_lisbon_mega_mod: "Лиссабон, мировой город"
 STATIC_MODIFIER_DESC_por_lisbon_mega_mod: "Лиссабон завершён одним из крупнейших городов Европы."
 STATIC_MODIFIER_NAME_por_casa_india_mod: "Casa da Índia"
 STATIC_MODIFIER_DESC_por_casa_india_mod: "Индийский дом управляет всей восточной торговлей Португалии исключительно."
 STATIC_MODIFIER_NAME_por_brazil_wood_mod: "Бразильское дерево"
 STATIC_MODIFIER_DESC_por_brazil_wood_mod: "Красильное дерево пау-бразил поставлено европейской шерстекрасильной промышленности."
 STATIC_MODIFIER_NAME_por_atlantic_mod: "Владычество над Атлантикой"
 STATIC_MODIFIER_DESC_por_atlantic_mod: "Португалия утвердила морское владычество, господствующее над всей Атлантикой."
