l_russian:
 boh_crown_of_bohemia_mission_pack: "Слава Богемской короны"
 boh_crown_of_bohemia_mission_pack_DESCRIPTION:0 "В 1337 году Богемия — могучее центральноевропейское королевство под властью Яна I (Слепого короля) из дома Люксембургов. Пронесись сквозь бурную историю Богемии — императора Карла IV, основание Карлова университета, Золотую буллу — и от казни Яна Гуса до вагенбургской тактики Гуситских войн. Объедини Моравию, Силезию и Словакию, брось вызов Габсбургам за господство в Священной Римской империи, и основай Богемское содружество."
 boh_crown_of_bohemia_mission_pack_CRITERIA_DESCRIPTION:0 "Как Богемия, достигни имперского владычества, культурного расцвета и южного завоевания, дабы основать Богемское содружество."
 boh_crown_of_bohemia_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы основать Богемское содружество."
 boh_crown_of_bohemia_mission_pack_BUTTON_DETAILS:0 "Неси волю Слепого короля — от Золотой Праги до Центральноевропейской империи!"
 boh_crown_of_jan: "Корона Слепого короля"
 boh_crown_of_jan_desc: "1337 год — Ян I, Слепой король, правит Богемией как один из могущественнейших правителей Центральной Европы. «Я не вижу, но всё же могу сражаться» — дух Слепого короля есть гордость Богемии. Прежде своей героической смерти в битве при Креси в 1346 году он возвысил дом Люксембургов до одной из величайших династий Европы. Утверди Прагу королевской столицей и укрепи основы королевства."
 boh_lion_of_empire: "Лев Империи"
 boh_lion_of_empire_desc: "Король Богемии — сильнейший курфюрст Священной Римской империи. Каждый князь Империи должен склониться перед мечом Богемии. Утверди положение «Льва Империи» через военную силу и престиж."
 boh_challenge_habsburg: "Брось вызов Габсбургам"
 boh_challenge_habsburg_desc: "Дом Габсбургов — величайший соперник Богемии за господство над Центральной Европой — замышляет имперское владычество со своей австрийской базы. Богемия должна ясно показать своё противостояние."
 boh_saxony_ambitions: "Саксонские честолюбия"
 boh_saxony_ambitions_desc: "Саксония, с Дрезденом в её сердце, — важный центр торговли и культуры вдоль Эльбы. Приведи саксонское курфюршество под контроль и расширь имперское влияние Богемии."
 boh_conquer_austria: "Завоюй Австрию"
 boh_conquer_austria_desc: "Вена пала, и австрийское коренное сердце Габсбургов сокрушено. Спесь «Габсбургов, над коими никогда не заходит солнце», наконец сломлена. Богемия — истинный владыка Центральной Европы."
 boh_dominate_hre: "Господствуй в Священной Римской империи"
 boh_dominate_hre_desc: "Богемия господствует в Священной Римской империи. Помимо императорского титула, осуществлённого Карлом IV в 1355 году, Богемия ныне правит бесспорным предводителем всей Империи."
 boh_develop_prague: "Развей Прагу"
 boh_develop_prague_desc: "Прага, «Город ста шпилей» — простираясь по обоим берегам Влтавы, этот город вступил в свой золотой век в XIV веке как величайший город Центральной Европы. Пражский Град, Карлов мост и Староместская площадь провозглашают миру славу Богемского королевства."
 boh_charles_university: "Карлов университет"
 boh_charles_university_desc: "В 1348 году Карл IV основал Карлов университет в Праге — первый университет Центральной Европы. Это учреждение богословия, права, медицины и философии произвело таких великих реформаторов, как Ян Гус. Построй университет в Праге после 1348 года, дабы достичь этой исторической вехи."
 boh_golden_bull: "Золотая булла"
 boh_golden_bull_desc: "Золотая булла 1356 года, обнародованная Карлом IV, кодифицировала избирательную систему Священной Римской империи и утвердила короля Богемии важнейшим курфюрстом Империи. Сделай правовое и политическое положение Богемии неприкосновенным."
 boh_bohemian_glass: "Богемское стекло"
 boh_bohemian_glass_desc: "Рождённое из кристально чистых вод и обильного кварцевого песка Богемии, богемское стекло ценится при дворах по всей Европе за свою изысканную красоту. Разви эту отрасль, дабы «богемский хрусталь» стал синонимом лучшего европейского качества."
 boh_silver_mines: "Кутногорские серебряные копи"
 boh_silver_mines_desc: "Серебряные копи Кутна-Горы были самыми продуктивными в Европе XIV века. Это серебро, чеканенное как пражские гроши, обращалось по всей Центральной Европе и поддерживало экономический золотой век Богемии."
 boh_develop_moravia: "Развей Моравию"
 boh_develop_moravia_desc: "Моравия, с центром в Брно и Оломоуце, — важная часть Земель богемской короны. Разви этот плодородный земледельческий регион как второй культурный и административный центр Богемской империи."
 boh_internal_prosperity: "Внутреннее процветание"
 boh_internal_prosperity_desc: "Богемское стекло, кутногорское серебро, пражские торговые рынки — вместе они делают Богемию величайшей экономической державой Центральной Европы."
 boh_jan_hus_question: "Вопрос Яна Гуса"
 boh_suppress_heresy: "Подави ересь"
 boh_suppress_heresy_desc: "Богемия хранит верность Римской церкви. Подавляя гуситов как еретиков и утверждая католическую веру краеугольным камнем государства, строится твёрдый союз с папой."
 boh_crusade_against_hussites: "Крестовый поход против гуситов"
 boh_crusade_against_hussites_desc: "Папа провозгласил крестовый поход против гуситов. Возглавляя натиск на ересь, Богемия утверждает свою репутацию стража католической Центральной Европы."
 boh_papal_champion: "Поборник папы"
 boh_papal_champion_desc: "Глубокое доверие с папством и непоколебимая католическая вера — Богемия признана сильнейшим стражем католической Центральной Европы."
 boh_hussite_reformation: "Гуситская реформация"
 boh_hussite_reformation_desc: "«Хоть сожжённая, истина сияет из пламени» — дух Яна Гуса укореняется в Богемии. Утраквисты (гуситы), символизируемые чашей (kalich), становятся верой нации, обретая религиозную независимость от Рима."
 boh_wagenburg: "Boží Bojovníci (Воины Божьи)"
 boh_wagenburg_desc: "Тактика вагенбурга (повозочной крепости), изобретённая Яном Жижкой — соединение укреплённых повозок в оборонительный строй — многократно разбивала крестоносную тяжёлую конницу. Военный гений Богемии расцветает."
 boh_king_of_heretics: "Король еретиков"
 boh_king_of_heretics_desc: "Иржи из Подебрад правил как «еретический король Богемии», несмотря на отлучение папой. Сохрани престиж среди европейской дипломатической изоляции и докажи миру законность гуситского государства."
 boh_hungarian_succession: "Венгерское наследование"
 boh_hungarian_succession_desc: "Богемия и Венгрия неоднократно образовывали личные унии через Люксембургов и Ягеллонов. Приведи богатое дунайское королевство с центром в Буде под богемский сюзеренитет и упрочи центральноевропейское владычество."
 boh_control_slovakia: "Овладей Словакией"
 boh_control_slovakia_desc: "Словакия — родина Великой Моравской империи, где обитают братские чешский и словацкий народы. Обеспечение этой земли укрепляет славянские основы Богемии."
 boh_conquer_transylvania: "Завоюй Трансильванию"
 boh_conquer_transylvania_desc: "Трансильвания — «земля за лесом», где смешиваются румыны, венгры и немцы, — служит передовым бастионом христианского мира против Османской империи. Контроль над ней открывает путь на Балканы."
 boh_nicopolis_revenge: "Месть за Никополь"
 boh_nicopolis_revenge_desc: "В битве при Никополе в 1396 году крестоносное войско под водительством Сигизмунда Богемского потерпело катастрофическое поражение от Османской империи. Настало время отомстить за это унижение — верни Никополь и изгони османов с Балкан."
 boh_defend_against_turks: "Оплот против турок"
 boh_defend_against_turks_desc: "Османская империя проносится по Балканам и приближается к вратам Центральной Европы. Укрепи оборону Трансильвании и стань щитом христианского мира с мощной армией. Богемия есть «Antemurale Christianitatis» — оплот христианской цивилизации."
 boh_push_into_balkans: "Продвинься на Балканы"
 boh_push_into_balkans_desc: "Отомсти за Никополь и продвинься на юг освободителем христианского мира. Славяне, греки и болгары Балкан освобождаются под богемским знаменем."
 boh_secure_silesia: "Обеспечь Силезию"
 boh_secure_silesia_desc: "Вся Силезия попадает под прямое богемское правление. Богатая железом и углём, эта земля становится ядром богемской индустриальной империи."
 boh_polish_ambitions: "Польские честолюбия"
 boh_polish_ambitions_desc: "Захвати Краков и утверди отношения Богемии с Польским королевством. Наследие династии Пржемысловичей принадлежит Богемии — Польша должна стать соседом под богемским сюзеренитетом."
 boh_conquer_poland: "Завоюй Польшу"
 boh_conquer_poland_desc: "Обширные равнины польских земель попадают под богемский контроль. От Вислы до Одера славянские земли объединены под знаменем богемского короля."
 boh_baltic_access: "Доступ к Балтике"
 boh_baltic_access_desc: "С захваченным Гданьском Богемия обретает прямой доступ к Балтийскому морю. Преображённая из сухопутного государства, Богемия ныне участвует и в северной торговле."
 boh_bohemian_diet: "Богемский сейм"
 boh_bohemian_diet_desc: "Богемское сословное собрание (Земский сейм) — где участвуют дворяне, духовенство и бюргеры — есть политическое учреждение. Его укрепление закладывает основу централизованного имперского правления."
 boh_absolute_monarchy: "Абсолютная монархия"
 boh_absolute_monarchy_desc: "Абсолютная монархия утверждена в Богемии. Ограничивая дворянские привилегии и полностью консолидируя королевскую власть, Богемия преображается в современное централизованное государство."
 boh_great_power_army: "Армия великой державы"
 boh_great_power_army_desc: "Тактика вагенбурга, Чёрная армия, элитная пехота — военные новшества Богемии создают сильнейшую армию Центральной Европы. Утверди военное превосходство Богемии с высокой воинской традицией и крупной постоянной силой."
 boh_dev_brno: "Развей Брно"
 boh_dev_brno_desc: "Брно, столица Моравии, процветает как промышленный и торговый город на перекрёстке торговых путей."
 boh_dev_wroclaw: "Развей Вроцлав"
 boh_dev_wroclaw_desc: "Вроцлав на Одере — сердце Силезии. Его многокультурная торговая традиция расширяет богатство Богемской империи."
 boh_amber_road: "Янтарный путь"
 boh_amber_road_desc: "Древний Янтарный путь, простирающийся от Балтики до Средиземноморья, пересекает Богемию. Контролируя этот торговый путь, Богемия становится узлом северо-южной торговли."
 boh_dev_pest: "Развей Пешт"
 boh_dev_pest_desc: "Пешт, стоящий напротив Буды через Дунай, — величайший торговый город Венгрии. Разви его как экономический центр южной Богемской империи."
 boh_renaissance_court: "Двор Возрождения"
 boh_renaissance_court_desc: "Прага Карла IV была центром центральноевропейского Возрождения, где сходились итальянская, французская и священноримская культуры. Художники, учёные и зодчие собираются при пражском дворе, пока расцветает золотой век культуры."
 boh_great_moravia_restored: "Великая Моравия восстановлена"
 boh_great_moravia_restored_desc: "Впервые со времён Великой Моравской империи IX века, вся Богемия, Моравия и Силезия объединены. Мечта Святоплука и Ростислава возрождена в наши дни, и Богемия сияет центром славянской цивилизации."
 boh_central_european_power: "Центральноевропейская держава"
 boh_central_european_power_desc: "Три столпа — восстановленная Великая Моравия, внутреннее процветание и абсолютная монархия — сходятся воедино, и Богемия правит величайшей державой Центральной Европы. С 500+ провинциями, доходом 500+ и престижем 80+, захвати эту славу."
 boh_bohemian_commonwealth: "Богемское содружество"
 boh_bohemian_commonwealth_desc: "Прага, Вена, Берлин, Краков, Буда — пять великих городов Центральной Европы, объединённых под богемским знаменем. Корона, что посеял Ян Слепой в 1337 году, ныне сияет короной имперской. «Bohemia non perit» — Богемия не гибнет — эти слова навеки высечены в истории."
 boh_krecy_legacy: "Наследие Креси"
 boh_krecy_legacy_desc: "В битве при Креси в 1346 году Слепой король Ян I стоял на поле боя, несмотря на слепоту, и погиб героической смертью. «Я не вижу, но всё же могу сражаться» — этот дух запечатлён в воинской душе Богемии."
 boh_styria_carinthia: "Штирия и Каринтия"
 boh_styria_carinthia_desc: "Покорение Штирии и Каринтии у подножия Альп утверждает южные границы Богемской империи. Эти богатые полезными ископаемыми и земледелием земли поддерживают процветание империи."
 boh_kutna_hora_mint: "Кутногорский монетный двор"
 boh_kutna_hora_mint_desc: "Пражский грош — чеканенный из кутногорского серебра — был самой доверенной валютой Центральной Европы в XIV веке. Утверди денежное превосходство Богемии через масштабную серебродобычу."
 boh_gothic_architecture: "Город готической архитектуры"
 boh_gothic_architecture_desc: "Собор Святого Вита, Карлов мост, Староместская площадь — великолепная готическая архитектура, построенная Карлом IV, преобразила Прагу в «Золотой город». Подними развитие Праги и предвосхити эту архитектурную славу."
 boh_bohemian_trade_network: "Богемская торговая сеть"
 boh_bohemian_trade_network_desc: "Торговая сеть с центром в Праге, связующая Вену, Вроцлав, Краков и Нюрнберг, поддерживает торговое превосходство Богемии."
 boh_compactata: "Пражские компактаты"
 boh_compactata_desc: "Компактаты 1436 года заставили Католическую церковь признать утраквистское причастие под обоими видами как уступку. Умеренный утраквистский путь приносит Богемии религиозную стабильность."
 boh_utraquist_church: "Утраквистская церковь"
 boh_utraquist_church_desc: "«Sub utraque specie» (под обоими видами) — утраквистская церковь, дающая причастникам и хлеб, и вино, утверждается государственной религией Богемии."
 boh_protestant_alliance: "Протестантский союз"
 boh_protestant_alliance_desc: "Гуситская традиция Богемии становится предтечей протестантской реформы. Через союз с лютеранами и кальвинистами Богемия признаётся опорой протестантского мира."
 boh_black_army: "Чёрная армия"
 boh_black_army_desc: "Чёрная армия, организованная королём Матьяшем Корвином — одна из первых постоянных профессиональных армий средневековой Европы. Когда эта элитная сила сражается под богемским знаменем, ничто в Центральной Европе не может устоять против неё."
 boh_dev_berlin: "Развей Берлин"
 boh_dev_berlin_desc: "Малый бранденбургский городок Берлин растёт северным административным узлом Богемской империи."
 boh_dev_konigsberg: "Развей Кёнигсберг"
 boh_dev_konigsberg_desc: "Кёнигсберг (Королевский замок), построенный Отакаром II, возвращается к Богемии и становится узлом балтийской торговли."
 boh_great_king: "Великий король"
 boh_great_king_desc: "Высокий престиж, великая легитимность, богатый доход — имя короля Богемии, одного из величайших правителей центральноевропейской истории, звучит по всей Европе, превосходя даже славу Карла IV."
 boh_dev_olomouc: "Оломоуц расцветает"
 boh_dev_olomouc_desc: "Оломоуц, древний город учёности и епископский престол Моравии, сияет центром северного культуры Возрождения."
 boh_upper_austria: "Верхняя Австрия"
 boh_upper_austria_desc: "Верхняя Австрия вдоль верхнего Дуная включается в Богемскую империю, утверждая основу для дальнейшего продвижения на юг."
 boh_carpathian_defense: "Карпатская оборона"
 boh_carpathian_defense_desc: "Крепостная сеть вдоль Карпатских гор утверждает прочную восточную оборонительную линию Богемской империи — щит против Османской империи, татар и других восточных угроз."
 boh_events.20.t: "Габсбурги сокрушены — Богемское владычество"
 boh_events.20.d: "Вена пала, и гордость Габсбургов сломлена. «Габсбургское владычество над Центральной Европой, длившееся со времён Рудольфа, закончилось» — эти слова звучат при дворе Праги. Король Богемии ныне истинный владыка Центральной Европы. Историки позже напишут: «Дом Люксембургов был истинным наследником Империи»."
 boh_events.20.a: "Слава Богемии! Эпоха Габсбургов окончена!"
 boh_events.50.t: "Великая Моравия восстановлена"
 boh_events.50.d: "Богемия, Моравия и Силезия объединены. Четыреста лет спустя после распада Великой Моравской империи, построенной Святоплуком, это наследие возрождено в наши дни. При дворе Праги король Богемии провозглашает титул «Rex Slavorum» — Король славян."
 boh_events.50.a: "Слава Великой Моравии! Слава славянскому единству!"
 boh_events.99.t: "Рождение Богемского содружества"
 boh_events.99.d: "Прага, Вена, Берлин, Краков, Буда — пять великих городов Центральной Европы, объединённых под богемским знаменем. Корона, что посеял Ян Слепой в 1337 году, ныне сияет короной имперской. Когда шпили готических соборов возносятся над небом Праги, слова «Bohemia non perit» — Богемия не гибнет — навеки высечены в истории."
 boh_events.99.a: "Слава Богемскому содружеству! Пусть владыка Центральной Европы пребудет вечно!"
 STATIC_MODIFIER_NAME_boh_blind_king_mod: "Наследие Слепого короля"
 STATIC_MODIFIER_DESC_boh_blind_king_mod: "«Я не вижу, но всё же могу сражаться» — дух Яна I, Слепого короля, заложил краеугольный камень Богемского королевства."
 STATIC_MODIFIER_NAME_boh_imperial_power_mod: "Лев Империи"
 STATIC_MODIFIER_DESC_boh_imperial_power_mod: "Богемия выступает вперёд сильнейшим курфюрстом Империи."
 STATIC_MODIFIER_NAME_boh_habsburg_rival_mod: "Вызов Габсбургам"
 STATIC_MODIFIER_DESC_boh_habsburg_rival_mod: "Соперничество между домом Люксембургов и Габсбургами за имперское владычество усиливается."
 STATIC_MODIFIER_NAME_boh_silesia_mod: "Железо Силезии"
 STATIC_MODIFIER_DESC_boh_silesia_mod: "Обильная железная руда Силезии поддерживает основу оборонной промышленности Богемии."
 STATIC_MODIFIER_NAME_boh_hre_master_mod: "Владыка Священной Римской империи"
 STATIC_MODIFIER_DESC_boh_hre_master_mod: "Богемия правит бесспорным предводителем Священной Римской империи, и ни один князь не смеет писать в Прагу иначе, как склонив голову."
 STATIC_MODIFIER_NAME_boh_prague_capital_mod: "Прага, Город ста шпилей"
 STATIC_MODIFIER_DESC_boh_prague_capital_mod: "Прага на Влтаве развита как величайший город Центральной Европы."
 STATIC_MODIFIER_NAME_boh_charles_university_mod: "Карлов университет"
 STATIC_MODIFIER_DESC_boh_charles_university_mod: "Первый университет Центральной Европы открывается в Праге — сияя центром учёности и реформы."
 STATIC_MODIFIER_NAME_boh_golden_bull_mod: "Золотая булла"
 STATIC_MODIFIER_DESC_boh_golden_bull_mod: "Курфюрстский статус короля Богемии утверждён Золотой буллой."
 STATIC_MODIFIER_NAME_boh_glass_industry_mod: "Богемское стекло"
 STATIC_MODIFIER_DESC_boh_glass_industry_mod: "Богемский хрусталь утверждает свою славу лучшего мастерства Европы."
 STATIC_MODIFIER_NAME_boh_kutna_hora_mod: "Серебро Кутна-Горы"
 STATIC_MODIFIER_DESC_boh_kutna_hora_mod: "Величайший серебряный рудник Центральной Европы поддерживает экономический золотой век Богемии. Пражский грош широко обращается."
 STATIC_MODIFIER_NAME_boh_moravia_mod: "Моравская интеграция"
 STATIC_MODIFIER_DESC_boh_moravia_mod: "Моравия с центром в Брно и Оломоуце включена в Богемскую империю."
 STATIC_MODIFIER_NAME_boh_prosperity_mod: "Внутреннее процветание"
 STATIC_MODIFIER_DESC_boh_prosperity_mod: "Богемское стекло, серебро и торговые рынки сочетаются, создавая величайшую экономическую державу Центральной Европы."
 STATIC_MODIFIER_NAME_boh_catholic_reform_mod: "Непоколебимая католическая вера"
 STATIC_MODIFIER_DESC_boh_catholic_reform_mod: "Богемия, храня верность Римской церкви, признана стражем центральноевропейской католической цивилизации."
 STATIC_MODIFIER_NAME_boh_crusader_glory_mod: "Слава крестоносца"
 STATIC_MODIFIER_DESC_boh_crusader_glory_mod: "Возглавляя антигуситский крестовый поход, Богемия обретает репутацию защитника христианского мира."
 STATIC_MODIFIER_NAME_boh_papal_ally_mod: "Щит папы"
 STATIC_MODIFIER_DESC_boh_papal_ally_mod: "Глубокое доверие с папством делает Богемию предводителем католической Центральной Европы."
 STATIC_MODIFIER_NAME_boh_hussite_church_mod: "Гуситская церковь"
 STATIC_MODIFIER_DESC_boh_hussite_church_mod: "Дух Яна Гуса укореняется в Богемии — независимый путь религиозной реформы утверждён."
 STATIC_MODIFIER_NAME_boh_wagenburg_mod: "Тактика вагенбурга"
 STATIC_MODIFIER_DESC_boh_wagenburg_mod: "Революционная тактика Яна Жижки поселяется в богемской армии. Повозочные крепости сокрушают крестоносную конницу."
 STATIC_MODIFIER_NAME_boh_king_heretic_mod: "Престиж короля еретиков"
 STATIC_MODIFIER_DESC_boh_king_heretic_mod: "Сохраняя престиж, несмотря на папское отлучение, богемский король преодолевает дипломатическую изоляцию."
 STATIC_MODIFIER_NAME_boh_slovakia_mod: "Словацкая интеграция"
 STATIC_MODIFIER_DESC_boh_slovakia_mod: "Львиное знамя Богемии ныне реет над холмами Словакии, родиной Великой Моравской империи."
 STATIC_MODIFIER_NAME_boh_transylvania_mod: "Трансильвания"
 STATIC_MODIFIER_DESC_boh_transylvania_mod: "Земля за лесом попадает под богемское правление — плацдарм для балканской экспансии утверждён."
 STATIC_MODIFIER_NAME_boh_nicopolis_glory_mod: "Месть за Никополь"
 STATIC_MODIFIER_DESC_boh_nicopolis_glory_mod: "Унижение 1396 года отомщено. Богемия становится авангардом контрудара против Османской империи."
 STATIC_MODIFIER_NAME_boh_antemurale_mod: "Щит христианского мира"
 STATIC_MODIFIER_DESC_boh_antemurale_mod: "Крепости Трансильвании становятся щитом, останавливающим османское продвижение."
 STATIC_MODIFIER_NAME_boh_balkan_conqueror_mod: "Освободитель Балкан"
 STATIC_MODIFIER_DESC_boh_balkan_conqueror_mod: "Богемия продвигается на юг освободителем славян и христиан Балкан."
 STATIC_MODIFIER_NAME_boh_silesia_secured_mod: "Силезия полностью включена"
 STATIC_MODIFIER_DESC_boh_silesia_secured_mod: "Вся Силезия под прямым богемским правлением — основа железной и угольной промышленности утверждена."
 STATIC_MODIFIER_NAME_boh_poland_subjugated_mod: "Польша покорена"
 STATIC_MODIFIER_DESC_boh_poland_subjugated_mod: "Польские равнины попадают под богемский контроль — основа для восточной экспансии утверждена."
 STATIC_MODIFIER_NAME_boh_baltic_access_mod: "Доступ к Балтике"
 STATIC_MODIFIER_DESC_boh_baltic_access_mod: "С захваченным Гданьском Богемия может прямо участвовать в балтийской торговле."
 STATIC_MODIFIER_NAME_boh_diet_mod: "Богемский сейм"
 STATIC_MODIFIER_DESC_boh_diet_mod: "В зале Земского сейма делегаты сословий ныне внимают политике императора."
 STATIC_MODIFIER_NAME_boh_absolutism_mod: "Абсолютная монархия"
 STATIC_MODIFIER_DESC_boh_absolutism_mod: "Абсолютная монархия утверждена в Богемии — преображение в современное централизованное государство."
 STATIC_MODIFIER_NAME_boh_military_power_mod: "Армия великой державы"
 STATIC_MODIFIER_DESC_boh_military_power_mod: "Элитная армия Богемии, наследница традиций Вагенбурга и Чёрной армии, обладает величайшей военной мощью Центральной Европы."
 STATIC_MODIFIER_NAME_boh_brno_mod: "Брно процветает"
 STATIC_MODIFIER_DESC_boh_brno_mod: "Столица Моравии Брно развивается центром торговли и промышленности."
 STATIC_MODIFIER_NAME_boh_wroclaw_mod: "Вроцлав процветает"
 STATIC_MODIFIER_DESC_boh_wroclaw_mod: "Вроцлав на Одере действует сердцем силезской экономики."
 STATIC_MODIFIER_NAME_boh_amber_road_mod: "Янтарный путь"
 STATIC_MODIFIER_DESC_boh_amber_road_mod: "Богемия, контролирующая древний Янтарный путь от Балтики до Средиземноморья, становится узлом северо-южной торговли."
 STATIC_MODIFIER_NAME_boh_pest_mod: "Пешт процветает"
 STATIC_MODIFIER_DESC_boh_pest_mod: "Пешт на Дунае развит как торговый центр южной Богемской империи."
 STATIC_MODIFIER_NAME_boh_renaissance_mod: "Двор Возрождения"
 STATIC_MODIFIER_DESC_boh_renaissance_mod: "Прага становится центром центральноевропейского Возрождения, где сходятся итальянская, французская и центральноевропейская культуры."
 STATIC_MODIFIER_NAME_boh_great_moravia_mod: "Великая Моравия восстановлена"
 STATIC_MODIFIER_DESC_boh_great_moravia_mod: "Впервые со времён Святоплука, Богемия, Моравия и Силезия объединены — центр славянской цивилизации возрождён."
 STATIC_MODIFIER_NAME_boh_central_power_mod: "Центральноевропейская держава"
 STATIC_MODIFIER_DESC_boh_central_power_mod: "Богемия правит величайшей державой Центральной Европы, утверждая превосходство в империи, культуре и военной силе."
 STATIC_MODIFIER_NAME_boh_krecy_glory_mod: "Наследие Креси"
 STATIC_MODIFIER_DESC_boh_krecy_glory_mod: "Героическая смерть Слепого короля передаётся как воинская гордость Богемии."
 STATIC_MODIFIER_NAME_boh_alpine_lands_mod: "Альпийские земли"
 STATIC_MODIFIER_DESC_boh_alpine_lands_mod: "Гарнизоны, несущие богемское знамя, ныне охраняют горные перевалы Штирии и Каринтии."
 STATIC_MODIFIER_NAME_boh_silver_currency_mod: "Пражский грош"
 STATIC_MODIFIER_DESC_boh_silver_currency_mod: "Пражский грош, чеканенный из кутногорского серебра, становится величайшей международной валютой Центральной Европы."
 STATIC_MODIFIER_NAME_boh_golden_prague_mod: "Золотая Прага"
 STATIC_MODIFIER_DESC_boh_golden_prague_mod: "Собор Святого Вита, Карлов мост, Сто шпилей — Прага становится величайшим культурным центром Центральной Европы как «Золотой город»."
 STATIC_MODIFIER_NAME_boh_trade_network_mod: "Богемская торговая сеть"
 STATIC_MODIFIER_DESC_boh_trade_network_mod: "Центральноевропейская торговая сеть с центром в Праге поддерживает торговое превосходство Богемии."
 STATIC_MODIFIER_NAME_boh_compactata_mod: "Пражские компактаты"
 STATIC_MODIFIER_DESC_boh_compactata_mod: "Примирение католиков и утраквистов достигнуто — религиозная стабильность возвращена в Богемию."
 STATIC_MODIFIER_NAME_boh_utraquist_mod: "Утраквистская церковь"
 STATIC_MODIFIER_DESC_boh_utraquist_mod: "Утраквистская церковь причастия под обоими видами утверждена государственной религией Богемии."
 STATIC_MODIFIER_NAME_boh_protestant_alliance_mod: "Протестантский союз"
 STATIC_MODIFIER_DESC_boh_protestant_alliance_mod: "Богемия с её гуситской традицией признана опорой протестантского мира."
 STATIC_MODIFIER_NAME_boh_black_army_mod: "Чёрная армия"
 STATIC_MODIFIER_DESC_boh_black_army_mod: "Дух Чёрной армии поселяется в Богемии — сильнейшая профессиональная армия Центральной Европы завершена."
 STATIC_MODIFIER_NAME_boh_berlin_mod: "Берлин развит"
 STATIC_MODIFIER_DESC_boh_berlin_mod: "Малый северный городок Берлин растёт северным административным узлом Богемской империи."
 STATIC_MODIFIER_NAME_boh_konigsberg_mod: "Кёнигсберг возвращён"
 STATIC_MODIFIER_DESC_boh_konigsberg_mod: "Кёнигсберг, построенный Отакаром II, возвращается к Богемии и становится узлом балтийской торговли."
 STATIC_MODIFIER_NAME_boh_great_king_mod: "Великий король"
 STATIC_MODIFIER_DESC_boh_great_king_mod: "Имя короля Богемии высечено в центральноевропейской истории как величайшего её правителя, превосходящего даже Карла IV."
 STATIC_MODIFIER_NAME_boh_fortress_europe_mod: "Крепость Европы"
 STATIC_MODIFIER_DESC_boh_fortress_europe_mod: "Крепостная сеть от Альп до Карпат сдерживает османское продвижение."
 STATIC_MODIFIER_NAME_boh_olomouc_mod: "Оломоуц расцветает"
 STATIC_MODIFIER_DESC_boh_olomouc_mod: "Оломоуц, центр учёности и религии Моравии, сияет узлом северного культуры Возрождения."
 STATIC_MODIFIER_NAME_boh_upper_austria_mod: "Верхняя Австрия"
 STATIC_MODIFIER_DESC_boh_upper_austria_mod: "Над стенами Верхней Австрии, вверх по течению Дуная, реет знамя Богемской империи, и пути на юг лежат открытыми."
 STATIC_MODIFIER_NAME_boh_carpathian_mod: "Карпатская оборона"
 STATIC_MODIFIER_DESC_boh_carpathian_mod: "Крепостная сеть вдоль Карпат становится щитом, защищающим восточную границу Богемской империи."
 STATIC_MODIFIER_NAME_boh_bohemian_commonwealth_final_mod: "Слава Богемского содружества"
 STATIC_MODIFIER_DESC_boh_bohemian_commonwealth_final_mod: "Богемское содружество, контролирующее пять великих городов Центральной Европы, завершено. «Bohemia non perit» — эти слова навеки высечены в истории."
 STATIC_MODIFIER_NAME_boh_habsburg_crushed_mod: "Габсбурги сокрушены"
 STATIC_MODIFIER_DESC_boh_habsburg_crushed_mod: "Вена пала, и владычество Габсбургов над Центральной Европой закончено. Богемия стоит истинным владыкой."
 boh_fortress_of_europe: "Крепость Европы"
 boh_fortress_of_europe_desc: "Крепостная сеть, простирающаяся от Альп до Карпат, сдерживает османское продвижение. Богемия действует «Щитом Европы»."
 boh_dev_plzen: "Развей Пльзень"
 boh_dev_plzen_desc: "Пльзень — ключевой город западной Богемии и будущая родина всемирно известного пльзенского пива. Расположенный на слиянии Огрже и Мже, развитие этого города продвигает торговлю и промышленность по всей западной Богемии."
 boh_dev_cheb: "Развей Хеб"
 boh_dev_cheb_desc: "Хеб, древний город на Огрже, — имперские врата, где пересекаются немецкая и богемская культуры. Разви этот город, повелевающий торговыми путями со Священной Римской империей, как плацдарм для западной дипломатии."
 boh_dev_kutna_hora_city: "Развей Кутна-Гору"
 boh_dev_kutna_hora_city_desc: "Сверкая серебряным богатством, Кутна-Гора развилась во второй город Богемии после Праги. Со строящимся собором Святой Варвары, разви этот город в подлинный мегаполис и утверди его экономическим сердцем Богемии."
 boh_bohemian_agriculture: "Богемское земледелие"
 boh_bohemian_agriculture_desc: "Богемские низменности вдоль Эльбы — богатая земледельческая зона. Пшеница, ячмень и рожь зреют в изобилии, и развитие ферм резко повышает продуктивность. Устойчивое продовольственное снабжение поддерживает рост населения по всей Богемской империи."
 boh_moravian_wine: "Моравское вино"
 boh_moravian_wine_desc: "Южная Моравия вокруг Зноймо — величайший виноградарский регион Богемии. Тёплый климат и известняковая почва взращивают моравские вина, ценимые даже при австрийском дворе в Вене. Их богатый вкус символизирует культурную утончённость Богемской империи."
 boh_jihlava_silver: "Йиглавские серебряные копи"
 boh_jihlava_silver_desc: "Йиглава, в Чешско-Моравской возвышенности, — серебродобывающий город, соперничающий с Кутна-Горой. Приведение этих серебряных копей в полную работу дополнительно расширяет серебродобычу Богемии и увеличивает чеканку пражских грошей."
 boh_opava_iron: "Опавская железная промышленность"
 boh_opava_iron_desc: "Опава, столица герцогства Силезия, известна залежами железной руды. Развитие стальной промышленности этого города дополнительно укрепляет промышленную основу Силезии и резко улучшает богемское военное снаряжение."
 boh_dev_litomerice: "Развей Литомержице"
 boh_dev_litomerice_desc: "Литомержице на Эльбе — важный торговый город северной Богемии. Развитие его узлом торгового пути, простирающегося до Гамбурга через Эльбу, оживляет торговлю с Северной Германией."
 boh_silesian_mines: "Силезские копи"
 boh_silesian_mines_desc: "Под почвой Силезии лежат железо и коксующийся уголь, кои поддержат будущие промышленные революции. Утверди полномасштабную систему добычи и резко подними промышленную производительность Богемской империи."
 boh_silesian_mines_unlock_tt: "Решение «Освоение шахт Силезии» теперь доступно."
 boh_silesian_mining_decision.title: "Освоение шахт Силезии"
 boh_silesian_mining_decision.desc: "Горнорудные районы Силезии обширны, и корона не может освоить их все разом. Каждое вложение в шахты, плавильни и дороги выводит на полную мощность ещё один район, и это дело можно возобновлять каждое десятилетие."
 boh_silesian_mining_decision.a: "Вложиться в новый горнорудный район."
 boh_bohemian_cloth: "Богемская текстильная промышленность"
 boh_bohemian_cloth_desc: "Наряду с богемским стеклом, богемская текстильная и суконная промышленность утверждает свою европейскую репутацию. Северобогемское сукно в сочетании с торговыми путями Литомержице делает Богемию центром текстильной промышленности."
 STATIC_MODIFIER_NAME_boh_plzen_mod: "Пльзень развит"
 STATIC_MODIFIER_DESC_boh_plzen_mod: "Пльзень, ключевой город западной Богемии, развит центром торговли и промышленности."
 STATIC_MODIFIER_NAME_boh_cheb_mod: "Хеб развит"
 STATIC_MODIFIER_DESC_boh_cheb_mod: "Хеб, западные врата, действует торговым узлом с Империей."
 STATIC_MODIFIER_NAME_boh_kutna_hora_city_mod: "Город Кутна-Гора"
 STATIC_MODIFIER_DESC_boh_kutna_hora_city_mod: "Богатый серебром второй город Богемии развился в подлинный мегаполис."
 STATIC_MODIFIER_NAME_boh_agriculture_mod: "Богемское земледелие"
 STATIC_MODIFIER_DESC_boh_agriculture_mod: "Плодородная эльбская земледельческая зона развита — устойчивое продовольственное снабжение обеспечено."
 STATIC_MODIFIER_NAME_boh_znojmo_mod: "Зноймские виноградники"
 STATIC_MODIFIER_DESC_boh_znojmo_mod: "Южноморавское виноградарство зреет, производя высококачественное вино."
 STATIC_MODIFIER_NAME_boh_moravian_wine_mod: "Моравское вино"
 STATIC_MODIFIER_DESC_boh_moravian_wine_mod: "Моравское вино становится ценимым товаром даже при австрийском дворе в Вене."
 STATIC_MODIFIER_NAME_boh_jihlava_mod: "Йиглавские серебряные копи"
 STATIC_MODIFIER_DESC_boh_jihlava_mod: "Серебряные копи Йиглавы работают в полную мощь — производитель серебра, соперничающий с Кутна-Горой."
 STATIC_MODIFIER_NAME_boh_opava_mod: "Опавская сталелитейная промышленность"
 STATIC_MODIFIER_DESC_boh_opava_mod: "Сталелитейная промышленность развита в Опаве, столице герцогства Силезия."
 STATIC_MODIFIER_NAME_boh_litomerice_mod: "Торговый узел Литомержице"
 STATIC_MODIFIER_DESC_boh_litomerice_mod: "Литомержице на Эльбе развивается узлом торговых путей с Северной Германией."
 STATIC_MODIFIER_NAME_boh_silesian_mines_mod: "Силезские копи"
 STATIC_MODIFIER_DESC_boh_silesian_mines_mod: "Богатые железные и угольные копи Силезии работают в полную мощь — промышленная мощь Богемии резко возросла."
 STATIC_MODIFIER_NAME_boh_cloth_industry_mod: "Богемская текстильная промышленность"
 STATIC_MODIFIER_DESC_boh_cloth_industry_mod: "Текстильная и суконная промышленность Богемии, наряду со стеклом, утверждена главным экспортным товаром."
 boh_sugar_beet: "Возделывание сахарной свёклы"
 boh_sugar_beet_desc: "Эпоха революций — научные и промышленные новшества преображают богемское земледелие. Сахарная свёкла — идеальная культура для прохладного климата Богемии. Сахарное производство, некогда монополия сахарного тростника, ныне возникает и из богемских полей. Новые земледельческие технологии Промышленной революции модернизируют богемское сельское хозяйство."
 boh_porcelain_industry: "Богемская фарфоровая промышленность"
 boh_porcelain_industry_desc: "Эпоха революций — каолин (фарфоровая глина) западной Богемии — лучший фарфоровый материал Европы. Богемский фарфор, рождённый из белой глины вокруг Карлсбада (Карловых Вар), соперничает с изысканным мастерством мейсенского фарфора из Дрездена, украшая дворы по всей Европе."
 STATIC_MODIFIER_NAME_boh_porcelain_mod: "Богемский фарфор"
 STATIC_MODIFIER_DESC_boh_porcelain_mod: "Фарфор из западнобогемского каолина становится предметом роскоши, украшающим европейские дворы."
 boh_jan_hus_question_desc: "Реформистский дух Яна Гуса распространяется по всей Богемии. Память о его сожжении на Констанцском соборе (1415) глубоко запечатлена в сердцах богемцев, и гнев на Римскую церковь достигает предела. Когда вопрос веры уже нельзя избежать, Богемия должна определить свой собственный путь."
 boh_events.60.t: "Плантация сахарной свёклы — заря новой отрасли"
 boh_events.60.d: "1737 год — технология производства сахара из сахарной свёклы (Beta vulgaris) разработана по всей Европе. Плодородные богемские угодья идеальны для возделывания этой новой культуры. Какое место примет первую ферму сахарной свёклы — Подебрады или Градец Кралове?"
 boh_events.60.a: "Посадить сахарную свёклу на угодьях Подебрад (родине «еретического короля» Иржи)"
 boh_events.60.b: "Посадить сахарную свёклу на угодьях Градца Кралове (плодородных землях вдоль Эльбы)"
 STATIC_MODIFIER_NAME_boh_jan_hus_mod: "Истина Гуса"
 STATIC_MODIFIER_DESC_boh_jan_hus_mod: "Списки проповедей Яна Гуса переходят из рук в руки даже в фермерских домах Богемии."
 STATIC_MODIFIER_NAME_boh_sugar_beet_choice_mod: "Ферма сахарной свёклы"
 STATIC_MODIFIER_DESC_boh_sugar_beet_choice_mod: "Возделывание сахарной свёклы созревает — богемский сахар вывозится на европейские рынки."
 boh_conquer_silesia: "Включи Силезию"
 boh_conquer_silesia_desc: "Силезия — часть Земель богемской короны. Включение этого региона, богатого железной рудой и серебром, резко укрепляет промышленную и военную основу Богемии."
 boh_events.50.b: "Нет, сохранить традиционные цвета Богемии — нет нужды меняться"
 boh_urban_privileges: "Богемские городские привилегии"
 boh_urban_privileges_desc: "С развитыми Брно и Оломоуцем, Богемия утвердила систему дарования особых привилегий своим городам. Феодальные города укрепляют дворянский контроль, подавляя крестьянское освобождение; церковные города продвигают религиозное обращение."
 STATIC_MODIFIER_NAME_boh_ecclesiastical_city_rights: "Права церковного города"
 STATIC_MODIFIER_DESC_boh_ecclesiastical_city_rights: "В этом городе, где колокола собора отмечают каждый час дня, даже правила рынка подчинены часам молитвы."
 boh_urban_privileges_unlock_tt: "Открывает городские привилегии Феодальный город (Poddanská nebo vrchnostenská města) и Церковный город (Biskupská nebo klášterní města)."
