l_russian:
 VEN_DOGES_PALACE_EVENT_OCCURRED: "Событие «Расширение Дворца дожей» произошло"
 ven_mainland_food_crisis: "Продовольственный кризис материка"
 ven_mainland_food_crisis_desc: "Венеция, город, построенный на лагуне, зависит от зерновых поставок с материка. Возведи устойчивую сеть продовольственного снабжения."
 ven_scaliger_war: "Война против делла Скала"
 ven_scaliger_war_desc: "Разгроми дом делла Скала, правящий Вероной, и обеспечь Тревизо и Виченцу."
 ven_mainland_consolidation: "Упрочение материка"
 ven_mainland_consolidation_desc: "Административно включи вновь обретённые материковые земли и стабилизируй отношения со знатью и правительственными учреждениями."
 ven_terraferma_expansion: "Расширение Терраферма"
 ven_terraferma_expansion_desc: "Завоюй Верону и Бергамо и расширь материковые владения Терраферма ещё далее."
 ven_warehouse_expansion: "Расширение складов"
 ven_warehouse_expansion_desc: "Расширь складские учреждения Венеции, дабы справляться с растущим объёмом торговли."
 ven_piazza_san_marco: "Развитие площади Сан-Марко"
 ven_piazza_san_marco_desc: "Развей площадь Сан-Марко, символ Республики, дабы умножить престиж знати."
 ven_canal_administration: "Управление каналами"
 ven_canal_administration_desc: "Улучши сеть каналов, проходящих через Венецию, дабы повысить эффективность морских операций."
 ven_fondaco: "Фондако"
 ven_fondaco_desc: "Возведи сеть торговых домов (Fondachi) для иностранных купцов и расширь торговые опорные пункты."
 ven_bridge_of_wealth: "Мост богатства"
 ven_bridge_of_wealth_desc: "Непрерывная вереница купцов переходит мост к Фондако. Развей торговый квартал вокруг этого моста и позволь потоку богатства нарастать далее."
 ven_doges_palace: "Обновление Дворца дожей"
 ven_doges_palace_desc: "Развей Дворец дожей, символ власти дожа, дабы укрепить структуру правления Республики."
 ven_doges_palace_event_occurred_tt: "Использовано решение «Расширение дворца дожей»"
 ven_arsenal: "Арсенале ди Венеция"
 ven_arsenal_desc: "Расширь государственную верфь, Арсенале, и подними кораблестроительную мощность Республики до мирового уровня."
 ven_marciana_library: "Библиотека Марчиана"
 ven_marciana_library_desc: "Возведи национальную библиотеку с библиотекой и университетом и умножь учёный престиж Республики."
 ven_lombardy_hegemony: "Верховенство над Ломбардией"
 ven_lombardy_hegemony_desc: "Со знаменем Республики над рынками Милана купцы всей Ломбардии признают нового владыку."
 ven_settling_with_genoa: "Расчёт с Генуей"
 ven_settling_with_genoa_desc: "Приведи давнее торговое соперничество с Генуей к его окончательному завершению. Займи её родной порт или сотри Геную с карты вовсе."
 ven_city_of_water: "Город воды"
 ven_city_of_water_desc: "Заверши лагунный город Венецию городом несравненного богатства, сплетённым водными путями и торговлей."
 ven_secure_ferrara: "Обеспечь Феррару"
 ven_secure_ferrara_desc: "Обрети Феррару, правимую домом Эсте, и обрети опорный пункт в Потале."
 ven_northern_expansion: "Расширение на север"
 ven_northern_expansion_desc: "Обеспечь Тренто и Удине и продвинь расширение на север с оком на альпийские перевалы."
 ven_papal_conflict: "Конфликт с Папской областью"
 ven_papal_conflict_desc: "Напряжённость с Папской областью из-за статуса Феррары растёт. Преодолей этот конфликт."
 ven_alpine_trade: "Торговля через Альпы"
 ven_alpine_trade_desc: "Караваны, пересекающие альпийские перевалы, более не привязаны к единому рынку, ибо возвели обширную торговую сеть из множества торговых центров."
 ven_render_unto_caesar: "Отдайте кесарю кесарево"
 ven_render_unto_caesar_desc: "Обретя доверие и духовенства, и горожан равно, власть Республики остаётся неоспоримой даже в Вечном городе Риме."
 ven_league_of_cambrai: "Разбить Камбрейскую лигу"
 ven_league_of_cambrai_desc: "Прорви окружение Камбрейской лиги, образованной державами Европы, и защити независимость Республики."
 ven_terraferma_completed: "Завершение Терраферма"
 ven_terraferma_completed_desc: "Заверши административную структуру материковых владений Терраферма и утверди власть Республики над Северной Италией."
 ven_italian_unity_route: "La Serenissima"
 ven_italian_unity_route_desc: "Стань ведущей державой среди итальянских государств и центром нового порядка на полуострове."
 ven_fleet_unification: "Подготовка флотов"
 ven_fleet_unification_desc: "Объедини руководство различных флотов Республики и улучши эффективность содержания флота."
 ven_black_sea_insurance: "Обеспечь черноморскую торговлю"
 ven_black_sea_insurance_desc: "Возведи с Негропонтом базой систему сопровождения торговых путей к Чёрному морю."
 ven_secure_adriatic: "Обеспечь Адриатику"
 ven_secure_adriatic_desc: "Обеспечь Зару и Полу и приведи господство над Адриатикой в руки Республики."
 ven_expel_genoa_black_sea: "Изгони Геную из Чёрного моря"
 ven_expel_genoa_black_sea_desc: "Обеспечь Каффу и Тану, ключевые посты черноморской торговли, и переними интересы Генуи, величайшего соперника Республики."
 ven_aegean_expansion: "Расширение в Эгейском море"
 ven_aegean_expansion_desc: "Обеспечь Крит и Наксос и расширь опорный пункт Республики в Эгейском море."
 ven_dalmatian_subjugation: "Покорение Далмации"
 ven_dalmatian_subjugation_desc: "Обеспечь всё хорватское побережье и приведи регион Далмации под власть Республики."
 ven_dominate_eastern_trade: "Овладей восточной торговлей"
 ven_dominate_eastern_trade_desc: "Приведи торговые пути Чёрного моря и восточного Средиземноморья под контроль Республики и захвати верховенство над восточной торговлей."
 ven_greek_bridgehead: "Плацдарм в Греции"
 ven_greek_bridgehead_desc: "Обеспечь Крит и Метони и утверди плацдарм в греческом коренном крае и Эгейском море."
 ven_pearl_of_adriatic: "Верни жемчужину Адриатики"
 ven_pearl_of_adriatic_desc: "Восстанови процветание торгового города Рагуза и принеси Республике богатство, известное как «жемчужина Адриатики»."
 ven_protect_corfu: "Защити Корфу"
 ven_protect_corfu_desc: "Расположи гарнизон на Корфу, кой повелевает входом в Адриатику, и обеспечь его оборону."
 ven_occupy_cyprus: "Занятие Кипра"
 ven_occupy_cyprus_desc: "Обеспечь Ларнаку и сделай стратегически важный остров Кипр провинцией Республики."
 ven_second_conquest_of_constantinople: "Второе завоевание Константинополя"
 ven_second_conquest_of_constantinople_desc: "Приведи, как некогда Четвёртый крестовый поход, Константинополь вновь под контроль Республики."
 ven_queen_of_the_adriatic: "Царица Адриатики"
 ven_queen_of_the_adriatic_desc: "Заверши торговую и оборонительную сеть над всей Адриатикой и возведи Республику в ранг «Царицы Адриатики»."
 ven_pen_not_sword: "Обратиться к перу, не к мечу"
 ven_pen_not_sword_desc: "Обеспечь интересы Республики в восточном Средиземноморье дипломатией и договорами, а не военной силой, и обеспечь долговременное процветание."
 ven_latin_empire: "Латинская империя"
 ven_latin_empire_desc: "Возведи новую Латинскую империю с центром в Константинополе и впиши Республику в историю владычицей Средиземноморья."
 ven_grand_strategy_mission_pack: "Великая стратегия морской республики"
 ven_grand_strategy_mission_pack_desc: "Малая республика, построенная на лагуне, идёт двумя путями разом: расширением на материк и построением морской империи. Заверши Терраферма, стань Царицей Адриатики и наконец впиши своё имя в историю центром Италии — или наследницей Латинской империи."
 ven_grand_strategy_mission_pack_BUTTON_TOOLTIP:0 "Утверди верховенство Республики на суше и на море."
 ven_grand_strategy_mission_pack_DESCRIPTION:0 "Малая республика, построенная на лагуне, идёт двумя путями разом: расширением на материк и построением морской империи. Впиши своё имя в историю Средиземноморья Царицей Адриатики."
 ven_grand_strategy_mission_pack_BUTTON_DETAILS:0 "Заверши Терраферма, стань Царицей Адриатики и стой наследницей Латинской империи — впиши имя Республики в историю!"
 ven_grand_strategy_mission_pack_CRITERIA_DESCRIPTION:0 "Заверши как Венеция Терраферма и стань Царицей Адриатики."
 ven_events.1.t: "Падение делла Скала"
 ven_events.1.d: "Война против тиранов делла Скала Веронских заканчивается венецианской победой. Граждане Тревизо и Виченцы приветствуют своих новых правителей. Первый шаг на материк сделан."
 ven_events.1.a: "Приветствовать новые провинции"
 ven_events.2.t: "Возвышение Терраферма"
 ven_events.2.d: "Верона и Бергамо переходят под знамя Республики. Плодородные пахотные земли и торговые города ломбардской равнины ещё более укрепляют экономическую мощь Венеции."
 ven_events.2.a: "Способствовать экономическому развитию новых провинций"
 ven_events.3.t: "Великолепие Дворца дожей"
 ven_events.3.d: "Перестроенный Дворец дожей стоит завершённым, воплощая власть дожа и престиж Республики. В его залах собирается знать, дабы совещаться о будущем Республики."
 ven_events.3.a: "Праздновать завершение дворца"
 ven_events.4.t: "Расширение Арсенале"
 ven_events.4.d: "Государственная верфь, Арсенале, расширена и ныне производит галеры и торговые суда в невиданном прежде масштабе. Морская мощь Республики достигает новых высот."
 ven_events.4.a: "Посетить расширенное Арсенале"
 ven_events.5.t: "Завершение Города воды"
 ven_events.5.d: "Каналы, торговые дома, библиотеки, верфи — построенный на лагуне город достиг процветания, коему нет равных в мире. «Город воды» стал достоин своего имени."
 ven_events.5.a: "Провозгласить завершение Города воды"
 ven_events.6.t: "Война за Феррару"
 ven_events.6.d: "Отношения с Папской областью напрягаются из-за статуса Феррары. Духовенство осуждает честолюбия Республики, но горожане приветствуют территориальное приобретение."
 ven_events.6.a: "Разрешить напряжённость с Папской областью"
 ven_events.7.t: "Отдайте кесарю кесарево"
 ven_events.7.d: "Республика прояснила границу между церковной прерогативой и мирской торговой деятельностью. Власть церкви почитается, но торговля и ремёсла остаются твёрдо под контролем Республики."
 ven_events.7.a: "Провозгласить утверждение мирской власти"
 ven_events.8.t: "Крушение Камбрейской лиги"
 ven_events.8.d: "Камбрейская лига, образованная папой, императором Священной Римской империи, Францией и Испанией, стремилась разделить Республику. Но внутренние раздоры привели к крушению лиги, и Венеция сохранила свою независимость."
 ven_events.8.a: "Засвидетельствовать крушение лиги"
 ven_events.9.t: "Терраферма завершена"
 ven_events.9.d: "Обширные провинции Северной Италии наконец включены в административную систему Республики. Терраферма ныне стоит несокрушимым основанием экономической и военной мощи Венеции."
 ven_events.9.a: "Праздновать завершение Терраферма"
 ven_events.10.t: "Центр Италии"
 ven_events.10.d: "Собрав мощь на суше и на море, Республика более не просто региональная держава на итальянском полуострове. Прочие государства следят за каждым шагом Венеции, и новый порядок на полуострове начинает обретать форму."
 ven_events.10.a: "Утвердить ведущее положение в Италии"
 ven_events.11.t: "Врата Адриатики"
 ven_events.11.d: "С Зарой и Полой под контролем Республики ключевые позиции, повелевающие входом в Адриатику, обеспечены. Флоты Республики ныне могут плавать с большей уверенностью."
 ven_events.11.a: "Укрепить оборону новых опорных пунктов"
 ven_events.12.t: "Отступление Генуи из Чёрного моря"
 ven_events.12.d: "Генуя, давний соперник Республики, утратила свои важнейшие опорные пункты черноморской торговли. Венецианские купцы начинают проникать на вновь открытые рынки."
 ven_events.12.a: "Способствовать расширению на новые рынки"
 ven_events.13.t: "Опорный пункт в Эгейском море"
 ven_events.13.d: "С обеспеченными Критом и Метони опорный пункт в Эгейском море и греческом коренном крае утверждён. Торговые суда Республики продолжают расширять свои восточные пути, используя эти гавани как промежуточные станции."
 ven_events.13.a: "Развить новые промежуточные гавани"
 ven_events.14.t: "Жемчужина Кипра"
 ven_events.14.d: "Фамагуста и Никосия присоединились к владениям Республики. Стратегически важный остров Кипр приносит Республике дальнейшее богатство через торговлю пряностями, сахаром и хлопком."
 ven_events.14.a: "Развить экономику Кипра"
 ven_events.15.t: "В Константинополь, снова"
 ven_events.15.d: "Впервые со времён Четвёртого крестового похода Венеция достигла занятия Константинополя. Память о старом разделе вновь разжигает честолюбия Республики."
 ven_events.15.a: "Построить новую административную структуру"
 ven_events.16.t: "Царица Адриатики"
 ven_events.16.d: "Процветание Рагузы, называемой «жемчужиной Адриатики», и твёрдая оборона Корфу ныне завершены. Республика более не просто держава Адриатики — она сама владычица моря."
 ven_events.16.a: "Принять титул «Царица Адриатики»"
 ven_events.17.t: "Триумф пера"
 ven_events.17.d: "Республика обеспечила свои интересы на Кипре и в окружающем регионе не военной силой, но дипломатией и договорами. «Обратимся к перу, не к мечу» — это становится новым символом веры Республики."
 ven_events.17.a: "Праздновать дипломатический триумф"
 ven_events.18.t: "Латинская империя, возрождённая"
 ven_events.18.d: "Новая Латинская империя возведена с центром в Константинополе. Торговые пути Средиземноморья, житницы материка, богатство Востока — всё это ныне в руках Венеции. Республика возвела нового вассального государя, «Латинскую империю», со столицей Константинополь, дабы править Фракией, Македонией, греческим коренным краем, Мореей и Эгейскими островами — и малая республика Адриатики ныне сама стоит империей. Сенат провозглашает миру новый имперский ранг Республики."
 ven_events.18.a: "Провозгласить утверждение Латинской империи"
 STATIC_MODIFIER_NAME_ven_grain_reserves: "Зерновые запасы"
 STATIC_MODIFIER_DESC_ven_grain_reserves: "Зерно, привезённое с материка, наполняет лагунный город и приносит облегчение его народу."
 STATIC_MODIFIER_NAME_ven_scaliger_victory: "Победа в войне против делла Скала"
 STATIC_MODIFIER_DESC_ven_scaliger_victory: "Сокрушив тиранов Вероны, солдаты несут новую уверенность в грядущих материковых походах."
 STATIC_MODIFIER_NAME_ven_mainland_order: "Порядок на материке"
 STATIC_MODIFIER_DESC_ven_mainland_order: "Даже во вновь обретённых провинциях закон и управление Республики ныне действуют гладко."
 STATIC_MODIFIER_NAME_ven_terraferma_growth: "Рост Терраферма"
 STATIC_MODIFIER_DESC_ven_terraferma_growth: "Плодородные земли Терраферма приносят Республике новое богатство."
 STATIC_MODIFIER_NAME_ven_fondaco_supply: "Сеть снабжения Фондако"
 STATIC_MODIFIER_DESC_ven_fondaco_supply: "Расширенные склады неустанно наполняются товарами, прибывающими из каждого уголка торговой сети."
 STATIC_MODIFIER_NAME_ven_san_marco_square: "Площадь Сан-Марко"
 STATIC_MODIFIER_DESC_ven_san_marco_square: "Обновлённая площадь Сан-Марко показывает каждому посетителю престиж Республики."
 STATIC_MODIFIER_NAME_ven_canal_efficiency: "Эффективность каналов"
 STATIC_MODIFIER_DESC_ven_canal_efficiency: "Лодки ныне скользят более плавно через улучшенные каналы, чем когда-либо."
 STATIC_MODIFIER_NAME_ven_fondaco_network: "Фондако"
 STATIC_MODIFIER_DESC_ven_fondaco_network: "Иностранные купцы, собирающиеся в торговых домах, приносят новую жизнь рынкам Республики."
 STATIC_MODIFIER_NAME_ven_bridge_of_wealth_bonus: "Мост богатства"
 STATIC_MODIFIER_DESC_ven_bridge_of_wealth_bonus: "Караваны, пересекающие мост через лагуну, несут свои товары почти без остановки у таможенных застав по пути."
 STATIC_MODIFIER_NAME_ven_doges_authority: "Власть дожа"
 STATIC_MODIFIER_DESC_ven_doges_authority: "Величие Дворца дожей придаёт вес каждому слову дожа."
 STATIC_MODIFIER_NAME_ven_arsenal_production: "Производство Арсенале"
 STATIC_MODIFIER_DESC_ven_arsenal_production: "В расширенном Арсенале ремесленники трудятся день и ночь, собирая галеры."
 STATIC_MODIFIER_NAME_ven_marciana_biblioteca: "Библиотека Марчиана"
 STATIC_MODIFIER_DESC_ven_marciana_biblioteca: "Библиотека Марчиана, спроектированная Сансовино (начата в 1537 году), — сокровищница древних рукописей, основанная на собрании Петрарки. Греческие рукописи, принесённые учёными, бежавшими после падения Константинополя 1453 года, собрались в Венеции и значительно способствовали распространению Возрождения на Запад."
 STATIC_MODIFIER_NAME_ven_lombardy_dominance: "Верховенство над Ломбардией"
 STATIC_MODIFIER_DESC_ven_lombardy_dominance: "Мастерские и ремесленники Милана производят под руководством Республики больше."
 STATIC_MODIFIER_NAME_ven_genoese_settlement: "Расчёт с Генуей"
 STATIC_MODIFIER_DESC_ven_genoese_settlement: "С законченным соперничеством с Генуей купцы Республики обретают всё больше опыта в переговорах и торговле."
 STATIC_MODIFIER_NAME_ven_queen_of_canals: "Царица каналов"
 STATIC_MODIFIER_DESC_ven_queen_of_canals: "Суда, заполняющие каналы, и дворцы, окаймляющие их берега, очаровывают путешественников со всего мира."
 STATIC_MODIFIER_NAME_ven_ferrara_secured: "Феррара обеспечена"
 STATIC_MODIFIER_DESC_ven_ferrara_secured: "С обеспеченной Феррарой напряжённость с Папской областью более не потрясает Республику, как некогда."
 STATIC_MODIFIER_NAME_ven_alpine_frontier: "Альпийская граница"
 STATIC_MODIFIER_DESC_ven_alpine_frontier: "Караваны, пересекающие альпийские перевалы, более не страшатся опасностей пути."
 STATIC_MODIFIER_NAME_ven_papal_tension: "Напряжённость с Папской областью"
 STATIC_MODIFIER_DESC_ven_papal_tension: "Напряжённость с папством продолжается, но купцы Республики продолжают свою торговлю невозмутимо."
 STATIC_MODIFIER_NAME_ven_alpine_trade_routes: "Трансальпийские торговые пути"
 STATIC_MODIFIER_DESC_ven_alpine_trade_routes: "Караваны, пересекающие альпийские перевалы, более не страшатся крутых горных дорог, неся свои товары."
 STATIC_MODIFIER_NAME_ven_secular_authority: "Мирская власть"
 STATIC_MODIFIER_DESC_ven_secular_authority: "Хотя и католическое государство, Венеция не колебалась поставить церковную власть под государственный контроль. Республика даже вмешивалась в назначение духовенства, управление церковным имуществом и дисциплину монастырей, ведя переговоры с папой без страха отлучения. Этот секуляризм, почти «святое кощунство», придавал Венеции своеобразную гибкость."
 STATIC_MODIFIER_NAME_ven_cambrai_survived: "Камбрейская лига пережита"
 STATIC_MODIFIER_DESC_ven_cambrai_survived: "Пережив осаду, солдаты и дипломаты Республики являют возрождённую уверенность."
 STATIC_MODIFIER_NAME_ven_terraferma_zenith: "Вершина Терраферма"
 STATIC_MODIFIER_DESC_ven_terraferma_zenith: "Обширные провинции Северной Италии ныне следуют воле Республики."
 STATIC_MODIFIER_NAME_ven_italian_unity_unlock: "Ранг центра Италии"
 STATIC_MODIFIER_DESC_ven_italian_unity_unlock: "Ни одно государство итальянского полуострова не смеет действовать, прежде не рассмотрев позицию Венеции."
 STATIC_MODIFIER_NAME_ven_unified_fleet: "Объединённый флот"
 STATIC_MODIFIER_DESC_ven_unified_fleet: "Объединённый флот готов выйти в море в любое время."
 STATIC_MODIFIER_NAME_ven_black_sea_protection: "Защита черноморской торговли"
 STATIC_MODIFIER_DESC_ven_black_sea_protection: "Сопровождаемые конвои уверенно плывут из порта Негропонт к Чёрному морю."
 STATIC_MODIFIER_NAME_ven_adriatic_secured: "Адриатика обеспечена"
 STATIC_MODIFIER_DESC_ven_adriatic_secured: "Порты Зары и Полы ныне служат безопасными убежищами для судов Республики."
 STATIC_MODIFIER_NAME_ven_zadar_trade_hub: "Торговый пост Задар"
 STATIC_MODIFIER_DESC_ven_zadar_trade_hub: "У перестроенного порта Задара торговые суда, пересекающие Адриатику, разгружают свой груз одно за другим."
 STATIC_MODIFIER_NAME_ven_genoese_rivalry_won: "Победа над генуэзским соперничеством"
 STATIC_MODIFIER_DESC_ven_genoese_rivalry_won: "Генуэзское знамя более не реет над постами черноморской торговли."
 STATIC_MODIFIER_NAME_ven_aegean_dominance: "Верховенство над Эгейским морем"
 STATIC_MODIFIER_DESC_ven_aegean_dominance: "Корабли под флагом Республики постоянно проходят через порты Крита и Наксоса."
 STATIC_MODIFIER_NAME_ven_dalmatia_subdued: "Далмация покорена"
 STATIC_MODIFIER_DESC_ven_dalmatia_subdued: "Далматинское побережье ныне значится на каждой карте владением Республики."
 STATIC_MODIFIER_NAME_ven_eastern_trade_dominance: "Верховенство в восточной торговле"
 STATIC_MODIFIER_DESC_ven_eastern_trade_dominance: "Пряности и шёлк с Востока ныне без труда проходят через рынки Венеции."
 STATIC_MODIFIER_NAME_ven_greek_bridgehead_secured: "Греческий плацдарм обеспечен"
 STATIC_MODIFIER_DESC_ven_greek_bridgehead_secured: "От Крита и Метони корабли Республики продвигаются далее на восток в греческие моря."
 STATIC_MODIFIER_NAME_ven_pearl_prosperity: "Процветание жемчужины"
 STATIC_MODIFIER_DESC_ven_pearl_prosperity: "Рынки Рагузы вновь отдаются голосами купцов, вернувшись к прежней силе."
 STATIC_MODIFIER_NAME_ven_corfu_garrison: "Гарнизон Корфу"
 STATIC_MODIFIER_DESC_ven_corfu_garrison: "Гарнизон на стенах Корфу тихо стоит на страже врат Адриатики."
 STATIC_MODIFIER_NAME_ven_cyprus_secured: "Кипр обеспечен"
 STATIC_MODIFIER_DESC_ven_cyprus_secured: "Сахар и хлопок с портов Кипра наполняют склады Республики."
 STATIC_MODIFIER_NAME_ven_latin_empire_foundation: "Основание Латинской империи"
 STATIC_MODIFIER_DESC_ven_latin_empire_foundation: "Вновь знамя латинян реет над дворцами Константинополя. Под властью Республики люди многих вер живут в тихом мире."
 STATIC_MODIFIER_NAME_ven_adriatic_queen: "Царица Адриатики"
 STATIC_MODIFIER_DESC_ven_adriatic_queen: "Как владычица Адриатики Республика обретает полномочие назначить ещё одного адмирала возглавить свои флоты."
 STATIC_MODIFIER_NAME_ven_diplomatic_mastery: "Мастерство дипломатии"
 STATIC_MODIFIER_DESC_ven_diplomatic_mastery: "Послы Республики обеспечивают выгодные условия, никогда не обнажая меча. Враждебность к Республике за границей ослабевает, и её переговорщики используют своё преимущество в войне с великим мастерством."
 STATIC_MODIFIER_NAME_ven_latin_empire_unlock: "Латинская империя"
 STATIC_MODIFIER_DESC_ven_latin_empire_unlock: "Торговые пути Средиземноморья, житницы материка, богатство Востока — всё это ныне в руках Венеции."
 ven_italian_unity_unlock_tt: "Венеция завершила основание итальянского единства. La Serenissima объединяет итальянский полуостров от Адриатики до Альп — впервые со времён античного Рима вся Италия правится под единым знаменем."
 ven_latin_empire_unlock_tt: "Латинская империя (LAT), со столицей Константинополь, основана вассальным государством под венецианской защитой."
