l_russian:
 geo_georgia_mission_pack: "Золотое руно — Царство Кавказа"
 geo_georgia_mission_pack_DESCRIPTION:0 "Под династией Багратиони Царство Грузия стоит на перекрёстке Кавказа. Объедини царство, заяви права на гегемонию над Кавказом и степью, или марширируй на юг крестоносцем в Анатолию и Святую землю — и пусть свет Православия воссияет над Востоком."
 geo_georgia_mission_pack_CRITERIA_DESCRIPTION:0 "Объедини Грузию вновь, овладей Кавказом и продвинься на юг в крестовый поход, дабы осуществить новый золотой век."
 geo_georgia_mission_pack_BUTTON_TOOLTIP:0 "Стань гегемоном Кавказа от земли Золотого руна."
 geo_georgia_mission_pack_BUTTON_DETAILS:0 "Восстанови славу царицы Тамар — от горного царства до защитника православного мира!"
 geo_bagrationi_legacy: "Наследие Багратиони"
 geo_bagrationi_legacy_desc: "Кровная линия дома Багратиони правит Кавказом. Унаследуй это наследие и начни новую эпоху правления."
 geo_royal_succession: "Обеспечь престолонаследие"
 geo_royal_succession_desc: "Подави честолюбия знати и споры о престоле и утверди законное правление."
 geo_reunite_georgia: "Воссоедини Грузию"
 geo_reunite_georgia_desc: "Тбилиси, Кутаиси, Ахалцихе, Батуми — объедини раздробленные провинции Грузии под единой короной."
 geo_fortify_caucasia: "Укрепи Кавказ"
 geo_fortify_caucasia_desc: "Закали изрезанные горы сетью крепостей и отрази набеги и язычников, и завоевателей равно."
 geo_church_of_georgia: "Грузинская церковь"
 geo_church_of_georgia_desc: "Сделай автокефальную Грузинскую православную церковь опорой государства, выковав единство через веру."
 geo_royal_court: "Королевский двор"
 geo_royal_court_desc: "Укрась королевский двор Тбилиси и сделай его центром культуры и власти, коему не сравнится весь Кавказ."
 geo_georgian_army: "Грузинская армия"
 geo_georgian_army_desc: "Выкуй мощную армию из горных народов и сделай её мечом царства."
 geo_recover_strength: "Верни силу"
 geo_recover_strength_desc: "Восстанови силу, утраченную повторными бедствиями, и открой новое будущее через союз и перевооружение."
 geo_queen_tamar_ambition: "Честолюбие царицы Тамар"
 geo_queen_tamar_ambition_desc: "Земли Армении, некогда часть владений царицы Тамар — освободи наших христианских братьев от языческого владычества и восстанови власть Тбилиси."
 geo_reclaim_shirvan: "Верни Ширван"
 geo_reclaim_shirvan_desc: "Верни Ширван, некогда под грузинским сюзеренитетом, и обрети плацдарм на Каспийском море."
 geo_heirs_of_seljuks: "Наследники сельджуков"
 geo_heirs_of_seljuks_desc: "Верни восточные земли у держав, унаследовавших сельджукское наследие, и восстанови власть креста в этом регионе."
 geo_gates_of_alexander: "Врата Александра"
 geo_gates_of_alexander_desc: "Пересеки так называемые «Врата Александра» через Кавказ и покори племена севера."
 geo_bane_of_khagan: "Проклятие хагана"
 geo_bane_of_khagan_desc: "Потомки монголов продолжают угрожать православному миру. Положи конец их владычеству и устрани это проклятие навсегда."
 geo_seize_crimea: "Захвати Крым"
 geo_seize_crimea_desc: "Покори полуостров Крым, последнее убежище татар, и обеспечь наше владычество над Чёрным морем."
 geo_control_black_sea: "Овладей Чёрным морем"
 geo_control_black_sea_desc: "Захватив большую часть черноморского побережья, полностью включи это внутреннее море в торговую сферу Грузии."
 geo_envoy_to_tsar: "Посол к царю"
 geo_envoy_to_tsar_desc: "Отправь посла к царю, возвысившемуся как господствующая сила Руси, и ищи путь союза."
 geo_caucasus_hegemony: "Гегемония над Кавказом"
 geo_caucasus_hegemony_desc: "Горы, степь и Чёрное море — заверши несокрушимую гегемонию над всем Кавказом."
 geo_deal_with_trebizond: "Отношения с Трапезундом"
 geo_deal_with_trebizond_desc: "Трапезундская империя, основанная с помощью царицы Тамар — обнови узы с этим давним другом и вместе изберите путь вперёд."
 geo_conquer_jalayirids: "Покори Султанат Джалаиридов"
 geo_conquer_jalayirids_desc: "Среди хаоса после распада Ильханата в этой земле возвысился Султанат Джалаиридов — покори этого наследника монгольского наследия и открой путь на восток."
 geo_encroach_mamluks: "Вторгнись в земли мамлюков"
 geo_encroach_mamluks_desc: "Святая земля, утраченная прежними крестоносцами — вторгнись в мамлюкски управляемый восток и приготовься вернуть свет веры."
 geo_conquer_cyprus: "Завоюй Кипр"
 geo_conquer_cyprus_desc: "Захвати Кипр, оплот восточного Средиземноморья, и утверди гегемонию над регионом вместе с местными крестоносными державами."
 geo_cradle_of_civilization: "Колыбель цивилизации"
 geo_cradle_of_civilization_desc: "Освободи Месопотамию, колыбель человеческой цивилизации, от мусульманского владычества и заяви права на её богатство для Грузии."
 geo_claim_holy_city: "Заяви права на Святой город"
 geo_claim_holy_city_desc: "Пока Иерусалим под сарацинским владычеством, тёмная туча висит над христианским миром. Верни Святой город и докажи торжество веры."
 geo_light_of_east: "Свет Востока"
 geo_light_of_east_desc: "Александрия, Иерусалим, Антиохия — освободи древние восточные патриархаты и покажи миру, что свет Востока не угас."
 geo_anatolian_incursion: "Анатолийское вторжение"
 geo_anatolian_incursion_desc: "Со времён поражения при Манцикерте Анатолия пала перед турецкими державами — отомсти за это поражение и стань новым гегемоном этой земли."
 geo_empires_downfall: "Падение империи"
 geo_empires_downfall_desc: "Османская империя, господствующая над Балканами и Ближним Востоком — отправь эту угрозу всему христианскому миру на страницы истории."
 geo_throne_of_romans: "Престол ромеев"
 geo_throne_of_romans_desc: "Великий город Константинополь долго удерживают язычники. Освободи эту жемчужину и займи римский престол как грузинский император."
 geo_beacon_of_christendom: "Маяк христианского мира"
 geo_beacon_of_christendom_desc: "Восстановив мощь Православия, настало время доказать миру нашу набожность и богоданную праведность — обрати наше царство в объединённый рай христианского мира."
 geo_georgian_crusader_realm: "Грузинское крестоносное царство"
 geo_georgian_crusader_realm_desc: "От Кавказа до Средиземного моря — эта великая держава, возведённая под крестом, есть осуществление мечты царицы Тамар."
 geo_rebuild_tbilisi: "Отстрой Тбилиси заново"
 geo_rebuild_tbilisi_desc: "Наша столица Тбилиси, истёртая повторными чужеземными вторжениями — примись за восстановление её прежнего блеска."
 geo_georgian_vineyards: "Грузинские виноградники"
 geo_georgian_vineyards_desc: "Тысячелетняя традиция виноделия Грузии — пусть эта гордая отрасль станет известной миру."
 geo_revive_literature: "Возроди самобытную литературу"
 geo_revive_literature_desc: "Асомтаврули, нусхури, мхедрули — три письменности, несущие грузинское наследие. Возроди эту культуру и распространи её язык и письменность по всему Кавказу."
 geo_legacy_of_builder: "Наследие Строителя"
 geo_legacy_of_builder_desc: "Следуя правлению Давида Строителя, принеси славу, богатство и значимость нашим городам."
 geo_svetitskhoveli_cathedral: "Собор Светицховели"
 geo_svetitskhoveli_cathedral_desc: "Собор Живоносного столпа, сердце Грузинской апостольской церкви — отстрой его в блеске, превосходящем прежний."
 geo_patriarchate_of_georgia: "Патриархат всей Грузии"
 geo_patriarchate_of_georgia_desc: "Пока растёт влияние государства, растёт и призыв возвысить автокефальную грузинскую церковь до ранга патриархата."
 geo_silk_road_trade: "Торговля по Шёлковому пути"
 geo_silk_road_trade_desc: "Как узел, связующий Восток и Запад вдоль Шёлкового пути, наполни города Грузии богатством торговли."
 geo_mountain_fortresses: "Горные крепости"
 geo_mountain_fortresses_desc: "Используй изрезанную местность Кавказа и заверши сеть крепостей, способную остановить любую армию."
 geo_golden_age: "Золотой век завершён"
 geo_golden_age_desc: "Золотой век, возведённый царицей Тамар и Давидом Строителем — вознеси его славу на невиданные высоты."
 geo_events.1.t: "Падение Сарая"
 geo_events.1.d: "Сарай, столица монгольской наследственной державы, пал в наши руки. Власть хагана, некогда сотрясавшая православный мир, ныне принадлежит прошлому."
 geo_events.1.a: "Проклятие хагана нашло свой конец!"
 geo_events.2.t: "Падение Константинополя"
 geo_events.2.d: "Великая имперская столица Константинополь наконец пала в наши руки. Грузинское знамя ныне реет над этим городом, некогда удерживаемым неверными — король Кавказа заявляет права на титул наследника Рима."
 geo_events.2.a: "Слава Римской империи! Слава грузинскому императору!"
 geo_events.99.t: "Провозглашение золотого века"
 geo_events.99.d: "От Кавказа до Средиземного моря — золотой век, о коем некогда мечтала царица Тамар, ныне завершён. Малое горное царство возродилось великой державой, освещающей православный мир."
 geo_events.99.a: "Слава Грузии! Слава золотому веку!"
 STATIC_MODIFIER_NAME_geo_bagrationi_mod: "Блеск Багратиони"
 STATIC_MODIFIER_DESC_geo_bagrationi_mod: "Королевская кровная линия придаёт государству престиж и легитимность."
 STATIC_MODIFIER_NAME_geo_succession_mod: "Устойчивое престолонаследие"
 STATIC_MODIFIER_DESC_geo_succession_mod: "Королевское престолонаследие устойчиво, и внутренние беспорядки улеглись."
 STATIC_MODIFIER_NAME_geo_reunite_mod: "Грузия воссоединена"
 STATIC_MODIFIER_DESC_geo_reunite_mod: "Раздробленные провинции вновь объединены под единой короной."
 STATIC_MODIFIER_NAME_geo_fortify_mod: "Кавказская крепостная сеть"
 STATIC_MODIFIER_DESC_geo_fortify_mod: "Каменные крепости, воздвигнутые на вершинах кавказских перевалов, издали хранят стражу против тени захватчика."
 STATIC_MODIFIER_NAME_geo_church_mod: "Грузинская церковь"
 STATIC_MODIFIER_DESC_geo_church_mod: "Православная церковь ныне действует опорой государства, выковывая единство через веру."
 STATIC_MODIFIER_NAME_geo_court_mod: "Блеск королевского двора"
 STATIC_MODIFIER_DESC_geo_court_mod: "Королевский двор Тбилиси сияет центром культуры и власти на Кавказе."
 STATIC_MODIFIER_NAME_geo_army_mod: "Грузинская армия"
 STATIC_MODIFIER_DESC_geo_army_mod: "Мощная армия из горных народов завершена и служит мечом царства."
 STATIC_MODIFIER_NAME_geo_recover_mod: "Сила возвращена"
 STATIC_MODIFIER_DESC_geo_recover_mod: "Через союз и перевооружение царство встретило новое будущее."
 STATIC_MODIFIER_NAME_geo_tamar_mod: "Честолюбие царицы Тамар"
 STATIC_MODIFIER_DESC_geo_tamar_mod: "Наши армянские братья освобождены, и власть Тбилиси ныне простирается на восток."
 STATIC_MODIFIER_NAME_geo_shirvan_mod: "Ширван возвращён"
 STATIC_MODIFIER_DESC_geo_shirvan_mod: "Плацдарм на Каспийском море обеспечен, и богатство восточной торговли течёт внутрь."
 STATIC_MODIFIER_NAME_geo_seljuk_mod: "Наследники сельджуков"
 STATIC_MODIFIER_DESC_geo_seljuk_mod: "Державы, унаследовавшие сельджукское наследие, оттеснены, и власть креста вернулась на восток."
 STATIC_MODIFIER_NAME_geo_gates_mod: "Врата Александра"
 STATIC_MODIFIER_DESC_geo_gates_mod: "Перейдя северные перевалы, племена к северу от Кавказа покорены."
 STATIC_MODIFIER_NAME_geo_crimea_mod: "Крым захвачен"
 STATIC_MODIFIER_DESC_geo_crimea_mod: "Последнее убежище татар покорено, открывая торговые пути через Чёрное море."
 STATIC_MODIFIER_NAME_geo_black_sea_mod: "Владычество над Чёрным морем"
 STATIC_MODIFIER_DESC_geo_black_sea_mod: "Большая часть черноморского побережья ныне включена в торговую сферу Грузии."
 STATIC_MODIFIER_NAME_geo_tsar_mod: "Союз с царём"
 STATIC_MODIFIER_DESC_geo_tsar_mod: "Отношения с господствующей силой Руси установлены, расширяя нашу дипломатическую сеть."
 STATIC_MODIFIER_NAME_geo_hegemony_mod: "Гегемония над Кавказом"
 STATIC_MODIFIER_DESC_geo_hegemony_mod: "Горы, степь и Чёрное море — гегемония над всем Кавказом завершена."
 STATIC_MODIFIER_NAME_geo_trebizond_mod: "Отношения с Трапезундом"
 STATIC_MODIFIER_DESC_geo_trebizond_mod: "Узы с нашим давним другом обновлены, и торговля между двумя державами процветает."
 STATIC_MODIFIER_NAME_geo_jalayirid_mod: "Султанат Джалаиридов покорён"
 STATIC_MODIFIER_DESC_geo_jalayirid_mod: "Джалаиридская угроза устранена, доказывая силу нашей армии."
 STATIC_MODIFIER_NAME_geo_mamluk_mod: "Вторжение в земли мамлюков"
 STATIC_MODIFIER_DESC_geo_mamluk_mod: "Знамя креста, пронесённое на восток, реет даже на горизонте пустыни, и цари иных вер узнали его имя."
 STATIC_MODIFIER_NAME_geo_cyprus_mod: "Кипр завоёван"
 STATIC_MODIFIER_DESC_geo_cyprus_mod: "Грузинские торговые суда, стоящие на якоре в портах Кипра, грузят пряности восточного Средиземноморья."
 STATIC_MODIFIER_NAME_geo_mesopotamia_mod: "Колыбель цивилизации"
 STATIC_MODIFIER_DESC_geo_mesopotamia_mod: "Шерсть и краски с плодородных берегов Тигра и Евфрата привозятся в мастерские Грузии."
 STATIC_MODIFIER_NAME_geo_holy_city_mod: "Святой город заявлен"
 STATIC_MODIFIER_DESC_geo_holy_city_mod: "Возвращение Иерусалима повысило власть церкви и преданность народа."
 STATIC_MODIFIER_NAME_geo_light_east_mod: "Свет Востока"
 STATIC_MODIFIER_DESC_geo_light_east_mod: "Освобождение восточных патриархатов повысило мораль и честь армии."
 STATIC_MODIFIER_NAME_geo_anatolia_mod: "Анатолийское вторжение"
 STATIC_MODIFIER_DESC_geo_anatolia_mod: "Грузинские солдаты, вновь стоящие на поле Манцикерта, маршируют рядами, гордясь тем, что отомстили за старое унижение."
 STATIC_MODIFIER_NAME_geo_downfall_mod: "Падение империи"
 STATIC_MODIFIER_DESC_geo_downfall_mod: "При дворе Тбилиси, освобождённом от османской угрозы, послы многих наций преклоняются перед королём Грузии."
 STATIC_MODIFIER_NAME_geo_beacon_mod: "Маяк христианского мира"
 STATIC_MODIFIER_DESC_geo_beacon_mod: "Имя короля Грузии, названного защитником веры, произносится с уважением при дворах наций, несущих тот же крест."
 STATIC_MODIFIER_NAME_geo_tbilisi_mod: "Тбилиси отстроен заново"
 STATIC_MODIFIER_DESC_geo_tbilisi_mod: "Королевская столица Тбилиси возвращает свой прежний блеск."
 STATIC_MODIFIER_NAME_geo_vineyards_mod: "Грузинские виноградники"
 STATIC_MODIFIER_DESC_geo_vineyards_mod: "Аромат вина, тысячу лет зревшего в глиняных квеври, наполняет долины Кахетии."
 STATIC_MODIFIER_NAME_geo_literature_mod: "Самобытная литература возрождена"
 STATIC_MODIFIER_DESC_geo_literature_mod: "Распространение письменности мхедрули продвинуло учёность и правление."
 STATIC_MODIFIER_NAME_geo_builder_mod: "Наследие Строителя"
 STATIC_MODIFIER_DESC_geo_builder_mod: "Следуя воле Давида Строителя, наши города вступают на путь процветания."
 STATIC_MODIFIER_NAME_geo_cathedral_mod: "Собор Светицховели"
 STATIC_MODIFIER_DESC_geo_cathedral_mod: "Собор Живоносного столпа отстроен заново, восстанавливая свой блеск как центр веры."
 STATIC_MODIFIER_NAME_geo_patriarchate_mod: "Патриархат всей Грузии"
 STATIC_MODIFIER_DESC_geo_patriarchate_mod: "Грузинская церковь возведена в ранг патриархата, и её власть широко признана."
 STATIC_MODIFIER_NAME_geo_silk_road_mod: "Торговля по Шёлковому пути"
 STATIC_MODIFIER_DESC_geo_silk_road_mod: "Как узел торговли Восток-Запад, города Грузии переполняются богатством."
 STATIC_MODIFIER_NAME_geo_mountain_fort_mod: "Сеть горных крепостей"
 STATIC_MODIFIER_DESC_geo_mountain_fort_mod: "Сеть крепостей, возведённая на местности Кавказа, способна остановить любую великую армию."
 STATIC_MODIFIER_NAME_geo_golden_age_mod: "Золотой век завершён"
 STATIC_MODIFIER_DESC_geo_golden_age_mod: "Золотой век, возведённый царицей Тамар и Давидом Строителем, достиг новых высот."
 STATIC_MODIFIER_NAME_geo_constantinople_fall_mod: "Наследие имперской Византии"
 STATIC_MODIFIER_DESC_geo_constantinople_fall_mod: "Дипломатическая и административная машина тысячелетнего города перенята. Как наследники бюрократии и дипломатического церемониала Рима, наши подданные становятся преданнее, и процесс аннексии проходит глаже."
 STATIC_MODIFIER_NAME_geo_golden_age_declaration_mod: "Управленческая сеть золотого века"
 STATIC_MODIFIER_DESC_geo_golden_age_declaration_mod: "Великая держава, простирающаяся от Кавказа до Средиземного моря, связана королевскими дорогами и сетью местных наместников. Процветание, возведённое царицей Тамар и Давидом Строителем, несёт свет короны в самые дальние провинции, делая легитимность и престиж династии несокрушимыми."
