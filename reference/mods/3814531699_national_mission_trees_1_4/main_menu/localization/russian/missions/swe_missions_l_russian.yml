l_russian:
 swe_stormaktstiden_mission_pack: "Стормактстиден — эпоха великодержавия Швеции"
 swe_stormaktstiden_mission_pack_DESCRIPTION:0 "В 1337 году Швеция — независимое королевство в личной унии с Норвегией под властью короля Магнуса Эрикссона. На севере лежит могущественная Дания, и грядущая борьба за скандинавское верховенство — предвещённая Кальмарской унией (1397) — неизбежна. Через фалунскую медь, владычество на Балтике и варяжские восточные пути осуществи Стормактстиден (эпоху великодержавия) и построй Шведскую империю."
 swe_stormaktstiden_mission_pack_CRITERIA_DESCRIPTION:0 "Как Швеция, достигни скандинавского верховенства, объединения, восточной экспансии и промышленного развития, дабы основать Скандинавскую империю."
 swe_stormaktstiden_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы построить Шведскую империю."
 swe_stormaktstiden_mission_pack_BUTTON_DETAILS:0 "От восстания Энгельбректа до Стормактстидена — выкуй Швецию в Империю!"
 swe_kingdom_of_sweden: "Королевство Швеция"
 swe_kingdom_of_sweden_desc: "В 1337 году Швеция — независимое королевство в личной унии с Норвегией под властью короля Магнуса Эрикссона. Окружённая могущественной Данией на севере, русскими княжествами на востоке и Ганзейским союзом на юге, Швеция должна укрепить свою легитимность и стабилизировать своё царство в подготовке к грядущей борьбе за скандинавское верховенство."
 swe_norway_union: "Личная уния с Норвегией"
 swe_norway_union_desc: "Швеция и Норвегия находятся в личной унии под королём Магнусом с 1319 года. Укрепление этого союза соединяет военную и экономическую мощь двух северных королевств против Дании."
 swe_break_from_denmark: "Противостань Дании"
 swe_break_from_denmark_desc: "Грядущая Кальмарская уния (1397) рискует дать Дании господство над Скандинавией — будущее, коего Швеция должна избежать. Активно утверди шведскую власть против Дании сейчас и обеспечь основание для притязания на скандинавское верховенство. Предвосхити дух восстания Энгельбректа (1434) и утверди шведскую королевскую власть прежде, чем настанет тот день."
 swe_control_skaane: "Овладей Сконе"
 swe_control_skaane_desc: "Сконе (Скания) — самый южный регион Швеции, давно оспариваемый Данией. Захват Мальмё и Сконе обеспечивает пролив Эресунн и даёт Швеции свободный выход к Балтийскому морю."
 swe_defeat_denmark: "Разгроми Данию"
 swe_defeat_denmark_desc: "Дания — величайший враг Швеции. Занятие Копенгагена или превращение Дании в шведского вассала означает, что владычество над Севером переходит к Швеции. «Швеция — истинный вождь Скандинавии» — положение, о коем мечтал Густав Ваза, осуществлено здесь."
 swe_integrate_norway: "Включи Норвегию"
 swe_integrate_norway_desc: "Прямое владение Осло, Бергеном и Нидаросом полностью включает Норвегию частью Шведской империи. Богатые рыбные промыслы Норвегии и врата в Северную Атлантику резко расширяют шведскую мощь."
 swe_unite_scandinavia: "Объедини Скандинавию"
 swe_unite_scandinavia_desc: "Дания сокрушена, Норвегия включена — вся Скандинавия объединена под шведским знаменем. Это достижение — объединение всей Скандинавии, чего никто не сумел с эпохи викингов — ныне осуществлено."
 swe_danish_navy_seizure: "Захвати датский флот"
 swe_danish_navy_seizure_desc: "После разгрома Дании её мощный флот переходит к Швеции. Сильнейшая морская сила Балтики ныне в шведских руках, открывая путь к владычеству над Северным морем."
 swe_danish_navy_seizure_unlock_tt: "Решение «Включение датского флота» теперь доступно."
 swe_danish_fleet_decision.title: "Включение датского флота"
 swe_danish_fleet_decision.desc: "Захваченные датские корабли праздно стоят в гаванях побеждённого королевства. Набор команд и переоснащение дорого обойдутся казне и взбудоражат державу, но шесть больших каррак под шведским флагом изменили бы баланс сил на Балтике."
 swe_danish_fleet_decision.a: "Ввести в строй шесть каррак."
 swe_sound_toll: "Зундская пошлина"
 swe_sound_toll_desc: "С обеспеченным Сконе Швеция ныне контролирует пролив Эресунн со шведской стороны. Сбор Зундской пошлины вместо Дании порождает огромный доход."
 swe_control_gotland: "Овладей Готландом"
 swe_control_gotland_desc: "Висбю на Готланде — один из величайших торговых городов Балтики. Захват этого приза — оспариваемого Данией, Ганзейским союзом и Ливонским орденом — утверждает плацдарм Швеции в балтийской торговле."
 swe_baltic_trade: "Балтийская торговля"
 swe_baltic_trade_desc: "Используя Готланд базой, Швеция всерьёз вступает в балтийскую торговлю. Варяги некогда несли товары из Швеции до самой Византии. Возроди эту традицию и создай эпоху шведских купцов, правящих Балтикой."
 swe_conquer_estonia: "Завоюй Эстонию"
 swe_conquer_estonia_desc: "Таллин (Ревель) изначально был построен датчанами, но Швеция обретёт Эстонию в Ливонской войне (1558-83). Предвосхити это историческое завоевание и утверди плацдарм Швеции на восточном берегу Балтики."
 swe_control_livonia: "Овладей Ливонией"
 swe_control_livonia_desc: "Захват Риги и Тарту (Дорпат) приводит всё восточное балтийское побережье под шведский контроль. Среди соперничества с Польшей, Россией и Данией Швеция становится верховным владыкой Ливонии."
 swe_varangian_legacy: "Варяжское наследие"
 swe_varangian_legacy_desc: "В VIII-X веках варяги (викинги) построили Новгород и открыли торговые пути через Днепр до Константинополя. Захват Новгорода и Пскова возрождает это древнее наследие в наши дни."
 swe_city_of_rus: "Город Руси"
 swe_city_of_rus_desc: "Москва — столица Великого княжества Московского и центр русского мира. Как наследники варягов, Швеция, контролирующая Москву, завершает Шведскую империю, простирающуюся от Балтики до всей восточнославянской цивилизации."
 swe_bane_of_hansa: "Проклятие Ганзы"
 swe_bane_of_hansa_desc: "Ганзейский союз монополизировал балтийскую торговлю, но трещины появляются по мере расширения Швеции. Контролируй Любек (вождя Ганзы) или разбей Ганзейский союз совершенно, дабы передать главную роль в балтийской торговле Швеции."
 swe_pomeranian_coast: "Поморское побережье"
 swe_pomeranian_coast_desc: "Захват Штральзунда и Штеттина помещает поморское побережье вдоль южной Балтики под шведский контроль. Предвосхити то, что Швеция действительно обрела в Тридцатилетней войне (1618-48), и обеспечь этот регион."
 swe_prussian_ambition: "Прусские честолюбия"
 swe_prussian_ambition_desc: "Пруссия, некогда правимая тевтонскими рыцарями, — юго-восточный балтийский узел. Обеспечение Кёнигсберга и области Пруссии даёт Швеции полное владычество над Балтийским морем."
 swe_dominium_maris_baltici: "Dominium Maris Baltici"
 swe_dominium_maris_baltici_desc: "«Dominium Maris Baltici» (Владычество над Балтийским морем) — высшая стратегическая цель Швеции XVII века. Господство над всей балтийской береговой линией делает это внутреннее море шведским «озером»."
 swe_secure_stockholm: "Обеспечь Стокгольм"
 swe_secure_stockholm_desc: "Стокгольм — «остров меж вод» — природная крепость-город между озером Меларен и Балтикой. Возведение его до ранга города с развитием 30+ утверждает его центром шведской королевской власти."
 swe_falun_mine: "Фалунский рудник"
 swe_falun_mine_desc: "Стура Коппарберьет (Великая медная гора) — фалунский медный рудник действует с IX века, сердце шведской экономики. Когда Магнус IV даровал горнодобывающей компании дополнительные привилегии в 1347 году, он покрывал две трети европейского спроса на медь. Максимизируй этот рудник."
 swe_iron_industry: "Шведская железная промышленность"
 swe_iron_industry_desc: "Железные рудники Свеаланда — основа шведской оборонной промышленности. Высококачественное шведское железо желали армии по всей Европе — пушки Тридцатилетней войны использовали шведское железо. Расширь это промышленное преимущество ещё далее."
 swe_swedish_steel: "Шведская сталь"
 swe_swedish_steel_desc: "Шведская сталь — прославленная лучшим качеством в Европе. Сталелитейная промышленность, подкреплённая обильным производством меди и железа, символизирует экономическую мощь Шведской империи и в вооружении шведских армий, и в экспортном доходе."
 swe_riksdag: "Риксдаг"
 swe_riksdag_desc: "Риксдаг (Парламент) впервые созван в 1435 году в Швеции. Это сословное собрание дворян, рыцарей, духовенства и крестьян (своеобразно, шведские крестьяне имели собственное сословное представительство) должно быть укреплено, дабы утвердить самобытную политическую традицию Швеции."
 swe_absolutism: "Абсолютизм"
 swe_absolutism_desc: "В 1680 году Карл XI вернул дворянские земли через «редукцию» и утвердил абсолютную монархию в Швеции. Предвосхити это историческое преображение и полностью упрочи королевскую власть."
 swe_great_power: "Швеция как великая держава"
 swe_great_power_desc: "Стормактстиден XVII века видел, как Швеция возникла крупной европейской державой под Густавом Адольфом, Карлом X Густавом и Карлом XII. Предвосхити эту эпоху обширной территорией, богатым доходом и высоким престижем."
 swe_stormakt_economy: "Экономика великой державы"
 swe_stormakt_economy_desc: "Шведская сталь, административная эффективность абсолютной монархии, балтийская торговля — экономическая основа Стормактстидена завершена. Докажи шведскую имперскую мощь ежемесячным доходом 400+ и множеством торговых центров."
 swe_religious_crossroads: "Религиозный перекрёсток"
 swe_religious_crossroads_desc: "Буря Реформации проносится по Скандинавии. Шведский двор ожесточённо спорит: сохранить верность римскому папе — принять революционное учение Мартина Лютера — или вернуться к древним богам, коих чтили предки. Решение шведского короля определит будущее этого северного королевства."
 swe_catholic_sweden: "Католическая Швеция"
 swe_catholic_sweden_desc: "Королевство Швеция сохраняет верность Римской церкви. Тесные отношения с папой дают Швеции дипломатические преимущества и признание стражем северной католической цивилизации."
 swe_northern_crusade: "Северный крестовый поход"
 swe_northern_crusade_desc: "Швеция участвует в священной войне северным щитом христианства. Возглавление северных крестовых походов против нехристианских народов возвышает религиозную власть и престиж Швеции."
 swe_church_reform: "Поборник папы"
 swe_church_reform_desc: "Глубокое доверие с папством и контроль над Любеком — Швеция утвердила несокрушимое положение стража северной католической цивилизации."
 swe_reformation: "Реформация"
 swe_reformation_desc: "В 1527 году шведский король Густав Ваза провозгласил лютеранство фактической государственной религией на вестеросском сейме. Передача церковного имущества короне резко укрепила государственные финансы. Предвосхити это решающее деяние сейчас."
 swe_protestant_reform: "Протестантская церковь"
 swe_protestant_reform_desc: "Развей университеты, дабы обучать лютеранских богословов и укоренить протестантскую веру по всей Швеции. Самобытность шведской церкви становится основой шведской культуры и самобытности."
 swe_protestant_empire: "Протестантская империя"
 swe_protestant_empire_desc: "Лютеранство проникает по всей Скандинавии. Шведский король царствует северным поборником протестантского мира, способным противостоять южным католическим державам, как в Тридцатилетней войне."
 swe_norse_revival: "Возрождение норманнской веры"
 swe_norse_revival_desc: "Боги предков — Один, Тор, Фрейр — возрождаются. Облик Скандинавии до христианизации воссоздаётся в наши дни. Шведский король, царствующий представителем норманнских богов — этот революционный выбор потрясёт всю Европу."
 swe_berserker_army: "Армия берсерков"
 swe_berserker_army_desc: "Дух медвежьих воинов эпохи викингов возрождён. Воины, преданные норманнским богам, спущены на пиратство, вольные разорять берега неверных."
 swe_yggdrasil_throne: "Престол Иггдрасиля"
 swe_yggdrasil_throne_desc: "Подобно Одину, восседающему у корней Мирового Древа, шведский император царствует в центре северного мира. С имперским рангом и 500+ провинциями северная империя, благословенная норманнскими богами, завершена."
 swe_finland_integration: "Включи Финляндию"
 swe_finland_integration_desc: "Финляндия — неотъемлемая часть Швеции с XII века. Прямое владение Або, Выборгом и Улеаборгом утверждает плацдарм Швеции к Северной Атлантике и Баренцеву морю."
 swe_lapland_expansion: "Лапландская экспансия"
 swe_lapland_expansion_desc: "Обширные леса Норрланда (северной Швеции) — дом народа саами. Включение их земель в королевство и обеспечение обильных ресурсов древесины, пушнины и железной руды начинает серьёзное освоение северного пограничья Швеции."
 swe_arctic_empire: "Арктическая империя"
 swe_arctic_empire_desc: "Развёртывание к Норвежскому морю и Баренцеву морю с центром в Улеаборге — Швеция становится северной империей, простирающейся до Полярного круга. Морские наместники устанавливаются, и морское присутствие расширяется, дабы завершить северное пограничье Шведской империи."
 swe_develop_stockholm: "Великий Стокгольм"
 swe_develop_stockholm_desc: "Стокгольм развился в великий город с университетом. Этот город, связующий Балтику и Северное море, вырастает в величайший город Северной Европы, культурный, торговый и политический центр Шведской империи."
 swe_develop_goteborg: "Развей Гётеборг"
 swe_develop_goteborg_desc: "Гётеборг был построен Густавом Адольфом в 1621 году западным прибрежным портом Швеции. Возведение его до ранга города открывает прямой торговый путь в Данию, Нидерланды и Англию."
 swe_peasant_support: "Поддержка крестьян"
 swe_peasant_support_desc: "Крестьянское сословие Швеции держит собственное представительство в Риксдаге — своеобразная черта. Повышение удовлетворённости крестьян и расширение зернового производства утверждают социальную стабильность и самобытную демократическую традицию Швеции."
 swe_engelbrekt: "Дух Энгельбректа"
 swe_engelbrekt_desc: "В 1434-36 годах Энгельбрект Энгельбректссон повёл рудокопов и крестьян в восстание против датского владычества. Он был убит, но его дух стал вечным символом шведского освободительного движения. Формально воплоти этот дух сейчас."
 swe_colonization: "Шведская колониальная империя"
 swe_colonization_desc: "Швеция также построила колонии в XVII веке, включая Новую Швецию (область реки Делавэр). Опираясь на развитие Финляндии, начни заморские колониальные предприятия и распространи досягаемость Шведской империи по всему миру."
 swe_develop_uppsala: "Уппсальский университет процветает"
 swe_develop_uppsala_desc: "Уппсальский университет (основан 1477), старейший в Швеции, произвёл Карла Линнея (таксономия) и Андерса Цельсия (термометр) — лучшую академию Северной Европы. Развей этот университет и упрочи основы шведской учёности."
 swe_karoliner: "Каролинцы"
 swe_karoliner_desc: "Каролинцы (солдаты короля Карла) были элитной пехотой Шведской империи под Карлом XII в начале XVIII века, известной сильнейшей пехотой своей эпохи. Развей высокую воинскую традицию и крупную армию, дабы предвосхитить этот элитный корпус."
 swe_amber_trade: "Янтарная торговля"
 swe_amber_trade_desc: "Балтийский янтарь, вывозимый с контролируемых Швецией территорий по всей Европе — «Золото Севера». Опираясь на экономическую основу великой державы и расширяя далее янтарную торговлю, усиль торговый доход Шведской империи."
 swe_stormaktstiden: "Стормактстиден"
 swe_stormaktstiden_desc: "Скандинавия объединена, Балтика покорена, экономика великой державы достигнута — три столпа сходятся, и Швеция достигает вершины Стормактстидена (эпохи великодержавия). С 600+ провинциями, доходом 600+, престижем 80+ захвати эту славу."
 swe_swedish_empire: "Шведская империя"
 swe_swedish_empire_desc: "От Балтики до Москвы, от Скандинавии до Пруссии — Шведская империя завершена. Путь Швеции, начавшийся в 1337 году личной унией с Норвегией, заканчивается здесь прибытием великой империи, господствующей над всей Северной Европой. «Швеция смеётся последней» — слова Карла XII осуществлены здесь."
 swe_events.30.t: "Скандинавское единство — заря Стормактстидена"
 swe_events.30.d: "Дания сокрушена, Норвегия включена — вся Скандинавия объединена под шведским знаменем. Это достижение, недостигнутое со времён эпохи викингов, наконец осуществлено. Шведский король настоящим провозглашает титул «Король Скандинавии», и строительство величайшего государства Северной Европы начинается. «Мечта Энгельбректа осуществилась здесь сегодня» — так напишут будущие историки."
 swe_events.30.a: "Да здравствует Скандинавия! Единство Севера навеки!"
 swe_events.40.t: "Перекрёсток веры — религиозный выбор Швеции"
 swe_events.40.d: "Буря Реформации проносится по Скандинавии. Шведский двор ожесточённо спорит. Сохранить ли верность папе в Риме — принять ли революционное учение Лютера — или вернуться к древним богам, коих чтили предки? Решение шведского короля определит будущее этого северного королевства."
 swe_events.40.a: "Хранить верность Риму — католицизм есть душа Швеции"
 swe_events.40.b: "Принять учение Лютера — настала эпоха реформы"
 swe_events.40.c: "Вернуться к древним богам — искать благословения Одина"
 swe_events.99.t: "Рождение Шведской империи"
 swe_events.99.d: "От Балтики до Москвы, от Скандинавии до Пруссии — Шведская империя наконец завершена. От пути Швеции, начавшегося в 1337 году норвежской личной унией, Швеция преобразилась из периферийной северной нации в великую империю, господствующую над всей Северной Европой. Стормактстиден (эпоха великодержавия) — то была эпоха, когда Швеция стала ведущим актёром мировой истории. «Вновь настал день — но на сей раз это день Швеции»."
 swe_events.99.a: "Да здравствует Император Шведской империи! Пусть Северная империя пребудет вечно!"
 STATIC_MODIFIER_NAME_swe_kingdom_mod: "Королевство Швеция"
 STATIC_MODIFIER_DESC_swe_kingdom_mod: "Краеугольный камень восстановления Швеции при правлении короля Магнуса Эрикссона заложен."
 STATIC_MODIFIER_NAME_swe_norway_union_mod: "Бонус норвежской унии"
 STATIC_MODIFIER_DESC_swe_norway_union_mod: "Личная уния с Норвегией объединяет военную мощь северо-западной Скандинавии."
 STATIC_MODIFIER_NAME_swe_skaane_mod: "Сконе обеспечено"
 STATIC_MODIFIER_DESC_swe_skaane_mod: "Шведская сторона пролива Эресунн обеспечена через контроль над Сконе."
 STATIC_MODIFIER_NAME_swe_norway_integrated_mod: "Норвегия включена — дар рыбных промыслов"
 STATIC_MODIFIER_DESC_swe_norway_integrated_mod: "Богатые рыбные угодья Норвегии включены в Шведскую империю."
 STATIC_MODIFIER_NAME_swe_scandinavia_united_mod: "Скандинавия объединена"
 STATIC_MODIFIER_DESC_swe_scandinavia_united_mod: "Знамёна трёх королевств стоят бок о бок под единой короной, и приказы, изданные из Стокгольма, достигают северных морей."
 STATIC_MODIFIER_NAME_swe_baltic_trade_mod: "Балтийская торговля"
 STATIC_MODIFIER_DESC_swe_baltic_trade_mod: "Швеция всерьёз вступает в балтийскую торговлю. Древние варяжские торговые пути живут вновь."
 STATIC_MODIFIER_NAME_swe_estonia_mod: "Эстония завоёвана"
 STATIC_MODIFIER_DESC_swe_estonia_mod: "Эстония с центром в Таллине пришла под шведский контроль."
 STATIC_MODIFIER_NAME_swe_livonia_mod: "Ливония покорена"
 STATIC_MODIFIER_DESC_swe_livonia_mod: "С захваченными Ригой и Тарту всё восточное балтийское побережье под шведским управлением."
 STATIC_MODIFIER_NAME_swe_varangian_mod: "Варяжское наследие"
 STATIC_MODIFIER_DESC_swe_varangian_mod: "Захват Новгорода возрождает древние варяжские торговые пути."
 STATIC_MODIFIER_NAME_swe_eastern_empire_mod: "Владычество над Русью"
 STATIC_MODIFIER_DESC_swe_eastern_empire_mod: "Захват Москвы делает Швецию владыкой восточнославянского мира."
 STATIC_MODIFIER_NAME_swe_dominium_baltici_mod: "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_swe_dominium_baltici_mod: "Балтийское море становится «озером» Швеции. Каждый торговый корабль, пересекающий это море, отвечает Швеции."
 STATIC_MODIFIER_NAME_swe_hansa_victory_mod: "Ганза разбита"
 STATIC_MODIFIER_DESC_swe_hansa_victory_mod: "Швеция побеждает Ганзейский союз и становится звездой балтийской торговли."
 STATIC_MODIFIER_NAME_swe_pomerania_mod: "Поморское побережье"
 STATIC_MODIFIER_DESC_swe_pomerania_mod: "Предвосхищая то, что Швеция обрела в Тридцатилетней войне, южное балтийское побережье под шведским контролем."
 STATIC_MODIFIER_NAME_swe_prussia_mod: "Прусские честолюбия"
 STATIC_MODIFIER_DESC_swe_prussia_mod: "Пруссия, включая Кёнигсберг, пришла под шведский контроль."
 STATIC_MODIFIER_NAME_swe_stockholm_mod: "Стокгольм обеспечен"
 STATIC_MODIFIER_DESC_swe_stockholm_mod: "Шведская королевская столица Стокгольм развита административным центром."
 STATIC_MODIFIER_NAME_swe_falun_copper_mod: "Фалунский медный рудник"
 STATIC_MODIFIER_DESC_swe_falun_copper_mod: "Фалунский медный рудник, поддерживающий европейский спрос на медь, работает в полную мощь."
 STATIC_MODIFIER_NAME_swe_iron_industry_mod: "Железная промышленность"
 STATIC_MODIFIER_DESC_swe_iron_industry_mod: "Железные рудники Свеаланда полностью действуют, утверждая основу шведской оборонной промышленности."
 STATIC_MODIFIER_NAME_swe_steel_mod: "Шведская сталь"
 STATIC_MODIFIER_DESC_swe_steel_mod: "Лучшая в Европе шведская сталь поставляется армиям дома и за рубежом."
 STATIC_MODIFIER_NAME_swe_riksdag_mod: "Риксдаг"
 STATIC_MODIFIER_DESC_swe_riksdag_mod: "Парламент Швеции учреждён действующим законодательным органом. Самобытная политическая традиция Швеции — где участвуют крестьяне — обретает форму."
 STATIC_MODIFIER_NAME_swe_absolutism_mod: "Абсолютизм"
 STATIC_MODIFIER_DESC_swe_absolutism_mod: "Предвосхищая редукцию Карла XI, абсолютная монархия утверждена в Швеции."
 STATIC_MODIFIER_NAME_swe_great_power_mod: "Швеция как великая держава"
 STATIC_MODIFIER_DESC_swe_great_power_mod: "Наступление Стормактстидена видит, как Швеция возникает крупной европейской державой."
 STATIC_MODIFIER_NAME_swe_stormakt_economy_mod: "Экономика великой державы"
 STATIC_MODIFIER_DESC_swe_stormakt_economy_mod: "Экономика великой державы Швеции — построенная на шведской стали, абсолютной монархии и балтийской торговле — завершена."
 STATIC_MODIFIER_NAME_swe_catholic_mod: "Католическая Швеция"
 STATIC_MODIFIER_DESC_swe_catholic_mod: "Сохраняя верность Римской церкви, Швеция признана стражем северной католической цивилизации."
 STATIC_MODIFIER_NAME_swe_crusader_glory_mod: "Слава северного крестоносца"
 STATIC_MODIFIER_DESC_swe_crusader_glory_mod: "Швеция участвует в священной войне, утверждая свою репутацию стража христианства."
 STATIC_MODIFIER_NAME_swe_lutheran_mod: "Лютеранская реформа"
 STATIC_MODIFIER_DESC_swe_lutheran_mod: "Предвосхищая лютеранское провозглашение Густава Вазы, церковное имущество переходит к короне."
 STATIC_MODIFIER_NAME_swe_protestant_reform_mod: "Протестантская церковь"
 STATIC_MODIFIER_DESC_swe_protestant_reform_mod: "Подготовка лютеранского богословия укореняет протестантскую веру по всей Швеции."
 STATIC_MODIFIER_NAME_swe_norse_conversion_mod: "Возрождение норманнской веры"
 STATIC_MODIFIER_DESC_swe_norse_conversion_mod: "Вера в Одина, Тора и Фрейра возрождена. Дух воина эпохи викингов обитает в армиях Швеции."
 STATIC_MODIFIER_NAME_swe_berserker_mod: "Армия берсерков"
 STATIC_MODIFIER_DESC_swe_berserker_mod: "Дух медвежьих воинов эпохи викингов возрождён. Каперство спущено, дабы разорять берега неверных."
 STATIC_MODIFIER_NAME_swe_yggdrasil_mod: "Престол Иггдрасиля"
 STATIC_MODIFIER_DESC_swe_yggdrasil_mod: "Подобно Одину у корней Мирового Древа, шведский император царствует в центре северного мира."
 STATIC_MODIFIER_NAME_swe_finland_mod: "Финляндия включена"
 STATIC_MODIFIER_DESC_swe_finland_mod: "Финляндия включена частью Шведской империи. Колониальная политика открывает северное пограничье."
 STATIC_MODIFIER_NAME_swe_lapland_mod: "Лапландская экспансия"
 STATIC_MODIFIER_DESC_swe_lapland_mod: "Обширные леса Норрланда включены в Швецию."
 STATIC_MODIFIER_NAME_swe_arctic_mod: "Арктическая империя"
 STATIC_MODIFIER_DESC_swe_arctic_mod: "Шведские маяки, стоящие на арктическом побережье, ведут моряков, пересекающих Северную Атлантику."
 STATIC_MODIFIER_NAME_swe_stormaktstiden_mod: "Стормактстиден"
 STATIC_MODIFIER_DESC_swe_stormaktstiden_mod: "Эпоха великодержавия Швеции — достигнута вершина северной империи, господствующей над Скандинавией, Балтикой и Восточной Европой."
 STATIC_MODIFIER_NAME_swe_sound_toll_mod: "Зундская пошлина"
 STATIC_MODIFIER_DESC_swe_sound_toll_mod: "Сбор Зундской пошлины обогащает шведскую казну."
 STATIC_MODIFIER_NAME_swe_stockholm_great_mod: "Стокгольм — город Севера"
 STATIC_MODIFIER_DESC_swe_stockholm_great_mod: "Стокгольм развился в великий город с университетом, став величайшей культурной и учёной столицей Северной Европы."
 STATIC_MODIFIER_NAME_swe_peasant_mod: "Поддержка крестьян"
 STATIC_MODIFIER_DESC_swe_peasant_mod: "Поддержка крестьянского сословия Швеции создаёт социальную стабильность, своеобразную для Швеции."
 STATIC_MODIFIER_NAME_swe_engelbrekt_mod: "Дух Энгельбректа"
 STATIC_MODIFIER_DESC_swe_engelbrekt_mod: "Дух восстания 1434 года вдохновляет шведские армии. Сражаться за свободу есть гордость Швеции."
 STATIC_MODIFIER_NAME_swe_colonial_mod: "Шведская колониальная империя"
 STATIC_MODIFIER_DESC_swe_colonial_mod: "Швеция начинает заморские колониальные предприятия, становясь империей за пределами Северной Европы."
 STATIC_MODIFIER_NAME_swe_papal_champion_mod: "Поборник папы"
 STATIC_MODIFIER_DESC_swe_papal_champion_mod: "Швеция утверждает несокрушимое положение сильнейшего стража северной католической цивилизации."
 STATIC_MODIFIER_NAME_swe_protestant_empire_mod: "Протестантская империя"
 STATIC_MODIFIER_DESC_swe_protestant_empire_mod: "Швеция со всескандинавским лютеранством царствует северным поборником протестантского мира."
 STATIC_MODIFIER_NAME_swe_amber_mod: "Янтарная торговля"
 STATIC_MODIFIER_DESC_swe_amber_mod: "Янтарь, собранный на берегах Балтики, сверкает золотом в витринах ювелиров Стокгольма."
 STATIC_MODIFIER_NAME_swe_uppsala_mod: "Уппсальский университет"
 STATIC_MODIFIER_DESC_swe_uppsala_mod: "Старейший университет Швеции процветает лучшим учёным учреждением Северной Европы."
 STATIC_MODIFIER_NAME_swe_karoliner_mod: "Каролинцы"
 STATIC_MODIFIER_DESC_swe_karoliner_mod: "Предвосхищая элитную пехоту Карла, высоко обученная шведская армия завершена."
 STATIC_MODIFIER_NAME_swe_scandinavian_empire_final_mod: "Шведская империя"
 STATIC_MODIFIER_DESC_swe_scandinavian_empire_final_mod: "Шведская империя, простирающаяся от Балтики до Восточной Европы, завершена. Стормактстиден пребывает вечно."
 STATIC_MODIFIER_NAME_swe_faith_steadfast_mod: "Твёрд в вере"
 STATIC_MODIFIER_DESC_swe_faith_steadfast_mod: "Непоколебимая католическая вера провозглашает власть короля народу звоном колоколов Уппсальского собора."
 STATIC_MODIFIER_NAME_swe_reform_winds_mod: "Ветры реформы"
 STATIC_MODIFIER_DESC_swe_reform_winds_mod: "Учение Лютера распространяется по Швеции."
 STATIC_MODIFIER_NAME_swe_old_gods_calling_mod: "Зов древних богов"
 STATIC_MODIFIER_DESC_swe_old_gods_calling_mod: "Вера в Одина и Тора тайно возрождается."
 swe_norrkoping_textiles: "Текстильная промышленность Норрчёпинга"
 swe_norrkoping_textiles_desc: "Норрчёпинг стал промышленным городом восточного побережья Швеции, центром производства текстиля и сукна. Используя обильную водную силу реки Мутала, производство сукна становится важным столпом шведского экспорта."
 STATIC_MODIFIER_NAME_swe_norrkoping_textile_mod: "Текстильная промышленность Норрчёпинга"
 STATIC_MODIFIER_DESC_swe_norrkoping_textile_mod: "Производство сукна на водной силе в Норрчёпинге работает в полную мощность. Шведский экспорт сукна на европейские рынки."
 STATIC_MODIFIER_NAME_swe_goteborg_mod: "Гавань Варберга развита"
 STATIC_MODIFIER_DESC_swe_goteborg_mod: "В гавани Варберга на Каттегате парусные суда, идущие в Северное море, снимаются с якоря одно за другим."
 STATIC_MODIFIER_NAME_swe_visby_mod: "Торговля Висбю"
 STATIC_MODIFIER_DESC_swe_visby_mod: "Складской квартал Висбю на Готланде вновь оживлён купцами со всей Балтики."
 STATIC_MODIFIER_NAME_swe_denmark_crushed_mod: "Дания сокрушена"
 STATIC_MODIFIER_DESC_swe_denmark_crushed_mod: "Когда флаг Дании, нашего давнего врага, был спущен, лорды Скандинавии тихо произнесли имя своего нового владыки."
