l_russian:
 bul_bulgaria_mission_pack: "Новая Византия — наследие Второй империи и гегемония на Балканах"
 bul_bulgaria_mission_pack_DESCRIPTION:0 "Как наследник наследия Второго Болгарского царства, утверди независимость, заяви права на гегемонию над Балканским полуостровом, отрази османскую угрозу и воздвигни новую Византию в Константинополе."
 bul_bulgaria_mission_pack_CRITERIA_DESCRIPTION:0 "Утверди независимость, возроди Балканскую империю, отрази османов и основай Третье Болгарское царство."
 bul_bulgaria_mission_pack_BUTTON_TOOLTIP:0 "От древнего города Тырново к новой империи, сияющей над Балканами."
 bul_bulgaria_mission_pack_BUTTON_DETAILS:0 "«Владыка Царьграда» — унаследуй славу Второй империи и основай Третье Болгарское царство!"
 bul_second_bulgarian_legacy: "Раскалывающаяся империя"
 bul_second_bulgarian_legacy_desc: "Славная империя, построенная Иваном Асенем I и Иваном Асенем II, ныне раскалывается под честолюбием знати на Тырново, Видин и Добруджу — останови этот упадок."
 bul_assert_independence: "Власть Царьграда"
 bul_assert_independence_desc: "Империя на грани раскола — как царь Тырновский, утверди власть, кою не согнёт ни одна соперничающая держава."
 bul_tarnovo_capital: "Развей Тырново"
 bul_tarnovo_capital_desc: "Тырново, некогда именуемый «Вторым Царьградом» — верни этой земле славу прежней имперской столицы ещё раз."
 bul_bulgarian_patriarchate: "Болгарский патриархат"
 bul_bulgarian_patriarchate_desc: "Автокефальная церковь, независимая от Константинополя — сделай власть Болгарской православной церкви несокрушимой."
 bul_boyar_council: "Боярский совет"
 bul_boyar_council_desc: "Бояре, знать, долго поддерживавшая Болгарию — воспользуйся их советом как опорой правления."
 bul_reunite_bulgaria: "Воссоедини Болгарию"
 bul_reunite_bulgaria_desc: "Болгария и Силистрия — воссоедини эти исторические коренные земли под единым знаменем."
 bul_bulgarian_independence: "Воссоединение империи"
 bul_bulgarian_independence_desc: "Империя раскололась на Видин и Добруджу — верни эти земли под единую корону и воссоедини империю с центром в Тырново."
 bul_sofia: "Город Святой Премудрости"
 bul_sofia_desc: "Сердика, Средец, Триадица — этот город носил множество имён сквозь века. Переименуй его титулом, подобающим новой эпохе."
 bul_conquer_macedonia: "Завоюй Македонию"
 bul_conquer_macedonia_desc: "Македония, издревле центр болгарской культуры — верни эту землю в наши владения."
 bul_conquer_serbia: "Завоюй Сербию"
 bul_conquer_serbia_desc: "Соседние земли Сербии — покори этого соперника в борьбе за гегемонию на Балканах."
 bul_bulgarian_empire: "Болгарская империя"
 bul_bulgarian_empire_desc: "Болгария некогда правила великой империей, охватывавшей большую часть Балкан. Мы вернём эти земли в наши владения!"
 bul_conquer_wallachia: "Завоюй Валахию"
 bul_conquer_wallachia_desc: "Валахия, на северном берегу Дуная — утверди наше влияние над этой землёй."
 bul_conquer_moldavia: "Завоюй Молдавию"
 bul_conquer_moldavia_desc: "Молдавия, к востоку от Карпатских гор — приведи эту богатую землю в наши владения."
 bul_conquer_transylvania: "Завоюй Трансильванию"
 bul_conquer_transylvania_desc: "Трансильвания, окружённая горами — сделай этот край частью нашей империи."
 bul_conquer_thrace_greece: "Завоюй Фракию и Северную Грецию"
 bul_conquer_thrace_greece_desc: "Земля древних фракийцев и Северная Греция — включи этот край в нашу империю."
 bul_extend_the_empire: "Расширь империю"
 bul_extend_the_empire_desc: "Границы империи должны быть отодвинуты ещё дальше. Продолжим наш поход в Грецию и Карпаты."
 bul_chitalishte_movement: "Движение читалищ"
 bul_chitalishte_movement_desc: "«Читальни», известные как читалища — общинные центры культуры — пусть они укоренятся по всей стране, взращивая грамотность и национальное самосознание среди горожан. Здесь начинается болгарское Национальное возрождение."
 bul_chitalishte_unlock_tt: "Городская привилегия «Город читалища» становится доступна."
 bul_ottoman_wars: "Османские войны"
 bul_ottoman_wars_desc: "Восходящая Османская империя — прими вызов борьбы с этой новой угрозой."
 bul_varna_crusade: "Крестовый поход при Варне"
 bul_varna_crusade_desc: "Поднимись бок о бок с Венгрией и возглавь крестовый поход против османов. В 1444 году история поворачивается при Варне."
 bul_end_ottoman_threat: "Положи конец османской угрозе"
 bul_end_ottoman_threat_desc: "Некогда грозная османская угроза — положи ей конец и обеспечь наше положение на Балканах."
 bul_constantinople_ambition: "Честолюбие в отношении Константинополя"
 bul_constantinople_ambition_desc: "Город, некогда бывший центром православного мира — взлелей честолюбие в отношении этого города."
 bul_new_byzantium: "Владение Константинополем и Римом"
 bul_new_byzantium_desc: "Константинополь, центр православного мира, и Рим, престол Западной церкви — захвати оба города разом, и пусть Болгария восстанет новой империей, председательствующей над обеими половинами христианского мира."
 bul_black_sea_trade: "Черноморская торговля"
 bul_black_sea_trade_desc: "Варна, портовый город на Чёрном море — развей его как плацдарм для черноморской торговли."
 bul_black_sea_dominion: "Владычество над Чёрным морем"
 bul_black_sea_dominion_desc: "Обширное побережье Чёрного моря — установи господство в торговле по этим водам."
 bul_third_bulgarian_empire: "Третье Болгарское царство"
 bul_third_bulgarian_empire_desc: "Независимость, объединение Балкан, поражение османов и основание Новой Византии — здесь Третье Болгарское царство завершено."
 bul_events.1.t: "Провозглашение воссоединения империи"
 bul_events.1.d: "Тырново, Видин и Добруджа, некогда расколотые, вновь объединены как единая империя. Второе Болгарское царство обретает новую силу."
 bul_events.1.a: "Слава Болгарии!"
 bul_events.4.t: "История Софии"
 bul_events.4.d: "Этот древний город, называемый римлянами Сердикой, а позже славянами Средцом, ныне примет новое имя в честь Церкви Святой Премудрости (Софии). Фракийцы, римляне, византийцы и болгары — пусть тяжесть множества цивилизаций, прошедших через этот бассейн, будет запечатлена в памяти."
 bul_events.4.a: "Назвать Софией"
 bul_events.4.b: "Назвать Софией и сделать новой имперской столицей"
 bul_events.2.t: "Провозглашение Болгарской империи"
 bul_events.2.d: "Как повелитель Македонии и Сербии, Болгария здесь провозглашает себя империей."
 bul_events.2.a: "Да здравствует Император!"
 bul_events.3.t: "Мечта о Новой Византии"
 bul_events.3.d: "В стенах Константинополя, как и на холмах вечного Рима, ныне развевается знамя Болгарии. Как новый центр православного мира и престол Западной церкви, эти два города здесь возрождены как двойные столпы новой империи."
 bul_events.3.a: "С нами Бог!"
 bul_events.99.t: "Провозглашение Третьего Болгарского царства"
 bul_events.99.d: "Долгий путь, начавшийся в древнем городе Тырново, через объединение Балкан, поражение османов и основание Новой Византии, здесь достигает своего истинного завершения."
 bul_events.99.a: "Да здравствует Третье Болгарское царство!"
 bul_hagia_sophia_sofia: "Церковь Святой Софии"
 bul_hagia_sophia_sofia_desc: "Базилика, воздвигнутая в VI веке во время правления императора Юстиниана — её имя, означающее «Святая Премудрость», со временем передалось городу, выросшему вокруг неё. Пережившая бесчисленные века, эта церковь безмолвно свидетельствует о своей истории как душа новой столицы, воздвигнутой в сердце Болгарии."
 STATIC_MODIFIER_NAME_bul_legacy_mod: "Наследие Второго Болгарского царства"
 STATIC_MODIFIER_DESC_bul_legacy_mod: "Даже среди бури междоусобиц механизм закона и ремесло писцов при дворе едва держатся вместе."
 STATIC_MODIFIER_NAME_bul_independence_mod: "Независимость утверждена"
 STATIC_MODIFIER_DESC_bul_independence_mod: "Никто ныне не смеет оспаривать власть того, кто восседает на престоле Тырново."
 STATIC_MODIFIER_NAME_bul_tarnovo_mod: "Велико-Тырново"
 STATIC_MODIFIER_DESC_bul_tarnovo_mod: "Дворцы и церкви, воздвигнутые на холме Царевец, возвращают себе величие имперской столицы."
 STATIC_MODIFIER_NAME_bul_patriarchate_mod: "Болгарский патриархат"
 STATIC_MODIFIER_DESC_bul_patriarchate_mod: "Благословение патриарха приносит мир в сердца верующих, где бы они ни обитали."
 STATIC_MODIFIER_NAME_bul_boyar_mod: "Боярский совет"
 STATIC_MODIFIER_DESC_bul_boyar_mod: "Бояре обновили свою клятву верности престолу."
 STATIC_MODIFIER_NAME_bul_reunite_mod: "Болгария воссоединена"
 STATIC_MODIFIER_DESC_bul_reunite_mod: "Над некогда разорванными землями вновь развевается единое знамя."
 STATIC_MODIFIER_NAME_bul_macedonia_mod: "Македония завоёвана"
 STATIC_MODIFIER_DESC_bul_macedonia_mod: "Горы, некогда бывшие свидетелями славы Самуила, вернулись во владения царя."
 STATIC_MODIFIER_NAME_bul_extend_empire_mod: "Империя расширена"
 STATIC_MODIFIER_DESC_bul_extend_empire_mod: "Наши расширяющиеся границы делают нашу силу известной каждому соседнему царству."
 STATIC_MODIFIER_NAME_bul_ottoman_wars_mod: "Османские войны"
 STATIC_MODIFIER_DESC_bul_ottoman_wars_mod: "Бесчисленные столкновения с турецкой угрозой закалили наших солдат."
 STATIC_MODIFIER_NAME_bul_varna_mod: "Крестовый поход при Варне"
 STATIC_MODIFIER_DESC_bul_varna_mod: "Память о павших на холмах Варны рассказывается и по сей день."
 STATIC_MODIFIER_NAME_bul_end_ottoman_mod: "Османская угроза окончена"
 STATIC_MODIFIER_DESC_bul_end_ottoman_mod: "Вздох облегчения проходит по Балканам, когда долго страшимая угроза отступает."
 STATIC_MODIFIER_NAME_bul_constantinople_ambition_mod: "Честолюбие в отношении Константинополя"
 STATIC_MODIFIER_DESC_bul_constantinople_ambition_mod: "Тень наших военных кораблей ныне ложится на морской путь, соединяющий Чёрное море со Средиземным."
 STATIC_MODIFIER_NAME_bul_varna_port_mod: "Черноморская торговля"
 STATIC_MODIFIER_DESC_bul_varna_port_mod: "Иноземные торговые суда беспрестанно приходят и уходят из гавани Варны."
 STATIC_MODIFIER_NAME_bul_black_sea_dominion_mod: "Владычество над Чёрным морем"
 STATIC_MODIFIER_DESC_bul_black_sea_dominion_mod: "Болгарские торговые суда ныне бороздят волны Чёрного моря, как своё собственное."
 STATIC_MODIFIER_NAME_bul_third_bulgarian_empire_mod: "Третье Болгарское царство"
 STATIC_MODIFIER_DESC_bul_third_bulgarian_empire_mod: "Свет, некогда сиявший из Тырново, ныне озаряет весь Балканский полуостров."
 STATIC_MODIFIER_NAME_bul_bulgarian_independence_mod: "Болгарская независимость провозглашена"
 STATIC_MODIFIER_DESC_bul_bulgarian_independence_mod: "Расколотые земли вновь едины, и каждая нация должна считаться с этим возрождением."
 STATIC_MODIFIER_NAME_bul_new_byzantium_mod: "Новая Византия"
 STATIC_MODIFIER_DESC_bul_new_byzantium_mod: "Новые голоса молитвы ныне звучат по церквям Константинополя."
