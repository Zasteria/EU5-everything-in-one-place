l_russian:
 mlo_biscione_mission_pack: "Наследие Бишоне"
 mlo_biscione_mission_pack_DESCRIPTION:0 "Бишоне, змей, пожирающий человека, красуется на гербе Висконти. Некогда лишь один из многих городов-государств Ломбардии, герцогство Милан ныне выковывает свой собственный путь среди запутанной борьбы за верховенство над Северной Италией. Через развитие правления и культуры, через возвышение до ведущей державы Севера, или через удержание положения между великими державами папы, императора и Франции — выбор, какое наследие возвести, лежит за герцогом."
 mlo_biscione_mission_pack_CRITERIA_DESCRIPTION:0 "Заверши миссии как герцогство Милан и утверди господствующее положение в Северной Италии."
 mlo_biscione_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы унаследовать наследие Бишоне."
 mlo_biscione_mission_pack_BUTTON_DETAILS:0 "От города-государства Ломбардии до сердца Италии!"
 mlo_expanded_domain: "Расширенное владение"
 mlo_expanded_domain_desc: "Герцогство Милан включило города Ломбардии и значительно расширило свою территорию."
 mlo_curb_della_scala: "Сдержи делла Скала"
 mlo_curb_della_scala_desc: "Растущая гегемония делла Скала, владык Вероны, над Северной Италией должна быть сдержана."
 mlo_imperial_vicariate: "Имперское наместничество"
 mlo_imperial_vicariate_desc: "Удостоенный титула имперского наместника от императора Священной Римской империи, правление Милана ныне несёт легитимность Империи."
 mlo_serpent_that_devours_men: "Змей, пожирающий людей"
 mlo_serpent_that_devours_men_desc: "Бишоне, змей, пожирающий человека, красуется на гербе Висконти. Легенда воплощает мощь семьи и провозглашает новую эпоху для Милана."
 mlo_state_led_enterprises: "Государственные предприятия"
 mlo_state_led_enterprises_desc: "Герцогство Милан продвигает под государственным руководством развитие своих учреждений и культуры."
 mlo_rigorous_plague_policy: "Строгая политика против чумы"
 mlo_rigorous_plague_policy_desc: "Перед лицом чумы должна быть возведена тщательная система карантина и изоляции, дабы защитить народ герцогства."
 mlo_duomo_di_milano: "Миланский собор"
 mlo_duomo_di_milano_desc: "Продвинь строительство Миланского собора и позволь великолепию герцогства достичь небес."
 mlo_road_network_of_the_realm: "Дорожная сеть для царства"
 mlo_road_network_of_the_realm_desc: "Развей дорожную сеть, связующую всё герцогство, и оживи движение людей и товаров."
 mlo_expand_administrative_buildings: "Расширь административные здания"
 mlo_expand_administrative_buildings_desc: "Черпая из уроков политики против чумы, расширь далее административные учреждения герцогства."
 mlo_embrace_the_renaissance: "Прими Возрождение"
 mlo_embrace_the_renaissance_desc: "Наряду со строительством собора миланский двор принимает новый дух Возрождения."
 mlo_the_last_supper: "Тайная вечеря"
 mlo_the_last_supper_desc: "Закажи Леонардо да Винчи написать Тайную вечерю и сделай Милан городом искусств."
 mlo_naviglio_grande_renovation: "Обновление Навильо-Гранде"
 mlo_naviglio_grande_renovation_desc: "Обнови Навильо-Гранде, канал, связующий Милан с окружающим регионом, и оживи торговлю и земледелие."
 mlo_castello_sforzesco: "Кастелло Сфорцеско"
 mlo_castello_sforzesco_desc: "Расширь Кастелло Сфорцеско, символ герцогского великолепия, как седалище миланского правления."
 mlo_biblioteca_ambrosiana: "Библиотека Амброзиана"
 mlo_biblioteca_ambrosiana_desc: "Возведи Библиотеку Амброзиана, дабы вместить накопленное знание веков и способствовать учёности."
 mlo_heart_of_italy: "Город, достойный быть сердцем Италии"
 mlo_heart_of_italy_desc: "С правлением, ремеслом, искусством и учёностью все равно расцветающими, Милан стал городом, достойным стоять сердцем Италии."
 mlo_north_italian_ambitions: "Северно-итальянские честолюбия"
 mlo_north_italian_ambitions_desc: "Герцогство Милан приводит свои армии в движение, дабы обеспечить верховенство над всей Северной Италией."
 mlo_subjugate_lombardy: "Покори Ломбардию"
 mlo_subjugate_lombardy_desc: "Приведи города Ломбардии под полный контроль и обеспечь основу герцогства."
 mlo_advance_into_piedmont: "Продвинься в Пьемонт"
 mlo_advance_into_piedmont_desc: "Расширь влияние на запад в Пьемонт и противостань мощи дома Савойского."
 mlo_strife_over_veneto: "Раздор за Венето"
 mlo_strife_over_veneto_desc: "Конфликт с Венецией и другими державами за контроль над Венето неизбежен."
 mlo_through_emilia_and_beyond: "Через Эмилию и далее"
 mlo_through_emilia_and_beyond_desc: "Пройди через Эмилию и открой путь для дальнейшей экспансии на юг."
 mlo_secure_liguria: "Обеспечь Лигурию"
 mlo_secure_liguria_desc: "Обеспечь Лигурию, включая Геную, и обрети опорный пункт на Средиземноморье."
 mlo_reach_the_coveted_sea: "Достигни желанного моря"
 mlo_reach_the_coveted_sea_desc: "Милан, некогда сухопутное государство, наконец обеспечивает прямой доступ к Средиземному морю."
 mlo_topple_the_old_rival_florence: "Свергни давнего соперника Флоренцию"
 mlo_topple_the_old_rival_florence_desc: "Разгроми давнего соперника Флоренцию и утверди влияние на Тоскану."
 mlo_between_two_authorities: "Между двух властей"
 mlo_between_two_authorities_desc: "Милан ищет свой собственный путь, зажатый между тремя великими державами папы, императора и короля Франции."
 mlo_reconcile_with_the_papacy: "Примирись с папством"
 mlo_reconcile_with_the_papacy_desc: "Улучши отношения с римской курией и обрети её власть опорой."
 mlo_trust_of_the_emperor: "Обрети доверие императора"
 mlo_trust_of_the_emperor_desc: "Обрети доверие императора Священной Римской империи и подними престиж герцогства внутри Империи."
 mlo_overture_to_france: "Приближение к Франции"
 mlo_overture_to_france_desc: "Построй дипломатические узы с Королевством Франция и обеспечь новые возможности."
 mlo_the_italian_wars: "Итальянские войны"
 mlo_the_italian_wars_desc: "Милан втянут в Итальянские войны, где сталкиваются интересы папы, императора и Франции."
 mlo_isolate_papal_authority: "Изолируй папскую власть"
 mlo_isolate_papal_authority_desc: "После пережитых Итальянских войн отдели светскую власть папы от миланской политики."
 mlo_deny_imperial_authority: "Отвергни имперскую власть"
 mlo_deny_imperial_authority_desc: "После пережитых Итальянских войн избери путь управления герцогством без обращения к имперской власти."
 mlo_repel_french_authority: "Отрази французскую власть"
 mlo_repel_french_authority_desc: "После пережитых Итальянских войн отрази французское вмешательство и сохрани независимость герцогства."
 mlo_italian_independence: "Итальянская независимость"
 mlo_italian_independence_desc: "Милан обеспечил свой ранг сильной, самостоятельной державой в Италии, независимой от папы, императора или Франции."
 mlo_who_achieves_all_things: "Тот, кто достигает всего"
 mlo_who_achieves_all_things_desc: "Достигнув вершины равно в правлении, культуре, территории и дипломатии, герцог Милана ныне достоин зваться «тем, кто достигает всего»."
 STATIC_MODIFIER_NAME_mlo_expanded_domain_mod: "Растущее герцогство"
 STATIC_MODIFIER_DESC_mlo_expanded_domain_mod: "Быстрый рост территории герцогства ускорил распространение управления и ускорил включение вновь обретённых земель."
 STATIC_MODIFIER_NAME_mlo_curb_della_scala_mod: "Верховенство над делла Скала"
 STATIC_MODIFIER_DESC_mlo_curb_della_scala_mod: "Ныне, когда влияние делла Скала в Северной Италии сдержано, дипломатический престиж герцогства возрос."
 STATIC_MODIFIER_NAME_mlo_state_led_enterprises_mod: "Утончённый государственный аппарат"
 STATIC_MODIFIER_DESC_mlo_state_led_enterprises_mod: "Висконти и Сфорца отличались масштабными государственными общественными постройками. Чертоза ди Павия, Кастелло Сфорцеско в Милане, канальная сеть Навильо-Гранде — все были крупными строительными проектами, движимыми общественной властью."
 STATIC_MODIFIER_NAME_mlo_rigorous_plague_policy_mod: "Учреждённая карантинная система"
 STATIC_MODIFIER_DESC_mlo_rigorous_plague_policy_mod: "Больницы, возведённые по всему герцогству, укрепили общенациональное сопротивление болезни."
 STATIC_MODIFIER_NAME_mlo_duomo_di_milano_mod: "Величие собора"
 STATIC_MODIFIER_DESC_mlo_duomo_di_milano_mod: "Завершённый Миланский собор укрепил культурную традицию и влияние герцогства."
 STATIC_MODIFIER_NAME_mlo_road_network_of_the_realm_mod: "Процветающая дорожная сеть"
 STATIC_MODIFIER_DESC_mlo_road_network_of_the_realm_mod: "Развитая дорожная сеть оживила торговлю по всему герцогству."
 STATIC_MODIFIER_NAME_mlo_expand_administrative_buildings_mod: "Расширенное управление"
 STATIC_MODIFIER_DESC_mlo_expand_administrative_buildings_mod: "Сфорца построили мощную чиновничью систему. В центральной канцелярии Милана (Cancelleria) собрались способные юристы и писцы, и она была известна утончённейшим административным аппаратом Северной Италии."
 STATIC_MODIFIER_NAME_mlo_embrace_the_renaissance_mod: "Ренессансный двор"
 STATIC_MODIFIER_DESC_mlo_embrace_the_renaissance_mod: "Двор Франческо Сфорца и его сына Людовико Сфорца (иль Моро) стал великим центром Возрождения. Людовико принимал Леонардо да Винчи почти двадцать лет при дворе и собрал художников и зодчих, таких как Браманте."
 STATIC_MODIFIER_NAME_mlo_the_last_supper_mod: "Бессмертный шедевр"
 STATIC_MODIFIER_DESC_mlo_the_last_supper_mod: "Написанная в 1495-1498 годах Леонардо да Винчи на стене трапезной монастыря Санта-Мария-делле-Грацие, «Тайная вечеря» считается шедевром западной живописи за своё совершенное использование перспективы и психологическое изображение каждой фигуры. Заказанная Людовико Сфорца, она наследие миланского двора на его вершине."
 STATIC_MODIFIER_NAME_mlo_naviglio_grande_renovation_mod: "Преимущества канальной сети"
 STATIC_MODIFIER_DESC_mlo_naviglio_grande_renovation_mod: "Обновлённый Навильо-Гранде постоянно ускорил распространение правления из столицы."
 STATIC_MODIFIER_NAME_mlo_biblioteca_ambrosiana_mod: "Процветающая учёность"
 STATIC_MODIFIER_DESC_mlo_biblioteca_ambrosiana_mod: "Основание Библиотеки Амброзиана повысило мастерство новых художников."
 STATIC_MODIFIER_NAME_mlo_heart_of_italy_mod: "Сердце Италии"
 STATIC_MODIFIER_DESC_mlo_heart_of_italy_mod: "Как сердце Италии Милан привлекает людей из каждого уголка, его процветание ныне постоянно."
 STATIC_MODIFIER_NAME_mlo_north_italian_ambitions_mod: "Честолюбия в Северной Италии"
 STATIC_MODIFIER_DESC_mlo_north_italian_ambitions_mod: "Честолюбия на всю Северную Италию ускорили построение шпионских сетей."
 STATIC_MODIFIER_NAME_mlo_subjugate_lombardy_mod: "Верховный владыка Ломбардии"
 STATIC_MODIFIER_DESC_mlo_subjugate_lombardy_mod: "Полный контроль над Ломбардией повысил дипломатический престиж герцогства."
 STATIC_MODIFIER_NAME_mlo_advance_into_piedmont_mod: "Опорный пункт в Пьемонте"
 STATIC_MODIFIER_DESC_mlo_advance_into_piedmont_mod: "Пьемонт был сферой дома Савойского и давним соперником Милана. Удержание этого стратегического коридора через Альпы во Францию было бы щитом против вторжения с запада. И Висконти, и Сфорца неоднократно пытались продвинуться в регион."
 STATIC_MODIFIER_NAME_mlo_strife_over_veneto_mod: "Военные почести из Венето"
 STATIC_MODIFIER_DESC_mlo_strife_over_veneto_mod: "Военные почести из раздора за Венето повысили престиж войска."
 STATIC_MODIFIER_NAME_mlo_through_emilia_and_beyond_mod: "Путь на юг"
 STATIC_MODIFIER_DESC_mlo_through_emilia_and_beyond_mod: "Путь, открытый за Эмилией, поддерживает мораль войска."
 STATIC_MODIFIER_NAME_mlo_secure_liguria_mod: "Торговля Лигурии"
 STATIC_MODIFIER_DESC_mlo_secure_liguria_mod: "Обеспечение Лигурии, включая Геную, оживило деятельность купцов."
 STATIC_MODIFIER_NAME_mlo_reach_the_coveted_sea_mod: "Врата к Средиземноморью"
 STATIC_MODIFIER_DESC_mlo_reach_the_coveted_sea_mod: "Ныне, когда желанное море достигнуто, снабженческая способность флота улучшена."
 STATIC_MODIFIER_NAME_mlo_topple_the_old_rival_florence_mod: "Закат над Арно"
 STATIC_MODIFIER_DESC_mlo_topple_the_old_rival_florence_mod: "Слава разгрома давнего соперника Флоренции повысила великолепие герцогства."
 STATIC_MODIFIER_NAME_mlo_between_two_authorities_mod: "Дипломатия между державами"
 STATIC_MODIFIER_DESC_mlo_between_two_authorities_mod: "Милан направлял свою дипломатию, сохраняя определённую дистанцию равно от всех трёх властей: императора Священной Римской империи, папы и короля Франции. Дипломаты Сфорца практиковали концепцию «равновесия сил» и принесли Северной Италии долгий относительный мир."
 STATIC_MODIFIER_NAME_mlo_reconcile_with_the_papacy_mod: "Мир с папством"
 STATIC_MODIFIER_DESC_mlo_reconcile_with_the_papacy_mod: "Примирение с папством принесло стабильность веры в герцогство."
 STATIC_MODIFIER_NAME_mlo_trust_of_the_emperor_mod: "Доверие императора"
 STATIC_MODIFIER_DESC_mlo_trust_of_the_emperor_mod: "Доверие императора повысило престиж герцогства внутри Империи."
 STATIC_MODIFIER_NAME_mlo_overture_to_france_mod: "Дружба с Францией"
 STATIC_MODIFIER_DESC_mlo_overture_to_france_mod: "Дипломатические узы с Королевством Франция углубили дружбу между двумя государствами."
 STATIC_MODIFIER_NAME_mlo_the_italian_wars_mod: "Опыт Итальянских войн"
 STATIC_MODIFIER_DESC_mlo_the_italian_wars_mod: "Выживание в Итальянских войнах способствовало традиции войска."
 STATIC_MODIFIER_NAME_mlo_isolate_papal_authority_mod: "Независимость от папы"
 STATIC_MODIFIER_DESC_mlo_isolate_papal_authority_mod: "Дистанция от светской власти папы повысила терпимость к еретикам."
 STATIC_MODIFIER_NAME_mlo_deny_imperial_authority_mod: "Независимость от императора"
 STATIC_MODIFIER_DESC_mlo_deny_imperial_authority_mod: "Правление, свободное от обращения к имперской власти, принесло стабильность в герцогство."
 STATIC_MODIFIER_NAME_mlo_repel_french_authority_mod: "Независимость от Франции"
 STATIC_MODIFIER_DESC_mlo_repel_french_authority_mod: "Отражение французского вмешательства повысило мораль войска."
 STATIC_MODIFIER_NAME_mlo_italian_independence_mod: "Самостоятельная итальянская держава"
 STATIC_MODIFIER_DESC_mlo_italian_independence_mod: "Стояние независимым от любой великой державы повысило равно великолепие и легитимность герцога."
 STATIC_MODIFIER_NAME_mlo_who_achieves_all_things_mod: "Герцог, достигающий всего"
 STATIC_MODIFIER_DESC_mlo_who_achieves_all_things_mod: "«Тот, кто достигает всего» (Chi tutte cose fa) — девиз Сфорца не был пустым хвастовством, но политическим выражением ренессансного идеала «универсального человека». Военный завоеватель и великий покровитель искусств, законодатель и попечитель торговли — вершина герцогства Милан воплощает политическую вершину итальянского Возрождения."
 mlo_events.1.t: "Легенда о Бишоне"
 mlo_events.1.d: "Герб Висконти несёт единственного змея, пожирающего человека — Бишоне. Одни говорят, он напоминает о подвиге в крестовых походах; другие утверждают, он символизирует побеждённого неверного. Какова бы ни была истина, символ провозглашает по всей Северной Италии, что мощь семьи и сам город-государство Милан более не дела простого местного владыки. Перед герцогом ныне лежат многие пути: путь государственного мужа, путь завоевателя и путь дипломата, идущего между великими державами."
 mlo_events.1.a: "Новая эпоха пришла к Милану"
 mlo_events.2.t: "Милан в 1337 году"
 mlo_events.2.d: "В 1337 году Миланом правят совместно Лукино Висконти и его брат, архиепископ Джованни Висконти. Во времена их предшественника Аццоне титул имперского наместника был дарован императором Людовиком IV, тем самым одолжив правлению Милана авторитет Империи. По всей Северной Италии могучие владыки удерживают правление, соперничая друг с другом — делла Скала из Вероны, Гонзага из Мантуи, Эсте из Феррары и другие. С папой, сидящим в Авиньоне, и силой императора, сосредоточенной к северу от Альп, тот, кто захватит верховенство над Ломбардией, будет решать судьбу Северной Италии."
 mlo_events.2.a: "Основы Милана поняты"
 mlo_events.3.t: "История Кастелло Сфорцеско"
 mlo_events.3.d: "Замок Милана начался крепостью, построенной Висконти, известной как Корте дель Аренго. Когда герцогская линия закончилась со смертью Филиппо Марии Висконти в 1447 году, граждане провозгласили Амброзианскую республику и снесли большую часть замка, символа старых правителей, коих они свергли. Но в 1450 году Франческо Сфорца, кой положил конец хаосу республики и принял герцогский титул, повелел отстроить крепость заново, ещё великолепнее прежней, дабы провозгласить собственную власть. С тех пор Кастелло Сфорцеско стоит седалищем герцогской власти в Милане, его блеск неомрачённым."
 mlo_events.3.a: "Тяжесть этой истории понята"
 mlo_castello_sforzesco_building: "Кастелло Сфорцеско"
 mlo_castello_sforzesco_building_desc: "Крепость, отстроенная заново Франческо Сфорца, стоящая символом герцогской власти в Милане. Когда находится в столице, укрепляет культурную традицию, культурное влияние и власть короны."
 STATIC_MODIFIER_NAME_mlo_serpent_reward_mod: "Правление Бишоне"
 STATIC_MODIFIER_DESC_mlo_serpent_reward_mod: "Змеиный герб Висконти (Бишоне) — змей, пожирающий человека — есть символ мощи и честолюбия Милана. По легенде, его выиграл предок Висконти в поединке с сарацинским рыцарем. Завершение объединения Италии означает, что змей наконец поглотил всю землю."
