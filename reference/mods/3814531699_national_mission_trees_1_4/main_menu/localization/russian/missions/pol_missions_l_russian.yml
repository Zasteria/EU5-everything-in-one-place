l_russian:
 pol_jagiellonian_dynasty_mission_pack: "Блеск Ягеллонской династии"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION:0 "В 1337 году Королевством Польша правит Казимир III Великий. Его наследником станет Людовик I Венгерский (из дома Анжу), а дочь Людовика, Ядвига, выйдет замуж за литовского великого князя Ягайло, создав польско-литовскую личную унию. Конфликт с Тевтонским орденом на севере, уния с Венгрией на юге, экспансия на восток через Литву и честолюбия на Богемию — осуществи всё это и построй величайшую дворянскую республику Центрально-Восточной Европы."
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION:0 "Расширься как Польша во всех направлениях — внутренняя реформа, восток, север, юг и запад — и осуществи польский золотой век."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы осуществить польский золотой век."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS:0 "От Казимира Великого до золотого века Ягеллонов — построй дворянскую республику!"
 pol_kingdom_of_poland: "Королевство Польша"
 pol_kingdom_of_poland_desc: "Казимир III — «Великий» — взошёл на престол в 1333 году и объединил раздробленную Польшу. «Он принял Польшу деревянной и оставил её каменной», — как говорили позднейшие поколения. Он способствовал правовой реформе, градостроительству и защите евреев, и его правление считается вершиной средневекового польского процветания. Возвысь легитимность и стабильность и упрочи основы царства."
 pol_integrate_mazovia: "Включи Мазовию"
 pol_integrate_mazovia_desc: "Мазовецкое герцогство правимо младшей ветвью пястовской династии, расположенное на плодородной низменности в сердце Польши. Обеспечение Варшавы и Люблина и полное включение этой богатой равнины в Королевство Польша утверждает политический центр Центральной Польши. Захвати заранее то, что история дарует лишь в 1526 году."
 pol_great_sejm: "Великий сейм"
 pol_great_sejm_desc: "Польский сейм — парламент — развивался с XIII века. Это сословное собрание магнатов, шляхты (дворянства) и духовенства утвердило в XV-XVI веках понятие «Золотой свободы» (Złota Wolność) и постепенно превратило Польшу в дворянскую республику. Укрепи сейм и сохрани равновесие между королевской властью и дворянскими правами."
 pol_krakow_renaissance: "Возрождение Кракова"
 pol_krakow_renaissance_desc: "Краков — столица Королевства Польша, а Ягеллонский университет — alma mater Коперника — лучшая академия Центрально-Восточной Европы. Итальянское Возрождение достигает Кракова, и Вавель перестраивается в ренессансном стиле. Развей университет и лелей Краков как духовный центр Центрально-Восточной Европы."
 pol_jagiellonian_university: "Расцвет Ягеллонского университета"
 pol_jagiellonian_university_desc: "Ягеллонский университет, основанный Казимиром III в 1364 году и возрождённый королевой Ядвигой в 1400 году, произвёл Николая Коперника (1473-1543) и многих других великих умов. Расширение университетов по всей Польше распространяет свет учёности по всему царству."
 pol_polish_golden_age: "Польский золотой век"
 pol_polish_golden_age_desc: "Под Ягеллонской династией Польша пережила в XV-XVI веках «Золотой век» (Złoty Wiek). Гелиоцентризм Коперника, поэзия Кохановского, искусство Кракова — Польша была не только великой державой, но и культурным авангардом. Докажи этот золотой век обширной территорией, богатым доходом и высоким престижем."
 pol_jadwiga_union: "Брак Ядвиги и Ягайло"
 pol_jadwiga_union_desc: "Кревская уния 1385 года условилась о браке польской королевы Ядвиги с литовским великим князем Ягайло (Владиславом II Ягелло). Ягайло принял христианство и заявил притязание на титул короля Польши в обмен на католизацию Литвы. Этот брак стал началом польско-литовского унионного государства — и зарёй Ягеллонской династии, кой суждено было длиться более двух веков."
 pol_develop_ruthenia: "Развей Рутению"
 pol_control_kyiv: "Владычество над Киевом"
 pol_control_kyiv_desc: "Киев был столицей Киевской Руси, колыбели славянской цивилизации. После монгольского разорения 1240 года город пал под литовское владычество. Взятие Киева утверждает контроль над всем бассейном Днепра и открывает путь к Чёрному морю."
 pol_push_east: "Продвижение на восток"
 pol_push_east_desc: "Минск — сердце Литвы; Смоленск — важный узел восточнославянского мира. С возвышением Великого княжества Московского обеспечение этих городов сделает польско-литовскую унию господствующей державой восточнославянского мира. Исторический спор о Смоленске, кой вёл Иван III — на сей раз он разворачивается в пользу Польши."
 pol_eastern_empire: "Восточная империя"
 pol_eastern_empire_desc: "Польско-Литовская дворянская республика на своей вершине (около 1618 года) стала крупнейшим государством Европы. От Балтики до понтийской степи (Чёрное море) весь восточнославянский мир объединился под польским флагом. Возведи великую восточную империю, коей равно страшатся Россия, османы и Габсбурги."
 pol_prussian_confederation: "Прусская конфедерация и Тевтонский орден"
 pol_prussian_confederation_desc: "Тевтонский орден, покоривший прибалтийских язычников в XIII веке, стал заклятым врагом Польши. При Танненберге в 1410 году польско-литовское войско сокрушило его совершенно. С поддержкой Прусской конфедерации — прусских горожан, искавших польской защиты — разгроми Тевтонский орден и обеспечь доступ Польши к Балтике."
 pol_gdansk_port: "Порт Гданьск"
 pol_gdansk_port_desc: "Гданьск называют «вратами Польши» — важнейшим портом Балтики. Расположенный в устье Вислы, этот город был ведущим узлом Ганзы и ключом польского экспорта зерна. Обеспеченный Польшей по Торуньскому миру (1466), Гданьск два века служил сердцем польской экономики."
 pol_livonian_expansion: "Расширение в Ливонию"
 pol_livonian_expansion_desc: "Ливония (нынешние Латвия и Эстония), некогда правимая Ливонским орденом, стала в XVI веке ареной спора между Россией, Швецией, Данией и Польшей. Взятие Риги и Ревеля (Таллина) приводит всю Балтику под польский контроль."
 pol_master_of_the_north: "Владыка Севера"
 pol_master_of_the_north_desc: "Кёнигсберг (нынешний Калининград), некогда оплот Тевтонского ордена, ныне несёт польское знамя. С мощным флотом, повелевающим всей Балтикой, Польша держит Скандинавию, Ганзу и голландцев в руке — высший владыка Севера."
 pol_hungarian_union: "Личная уния с Венгрией"
 pol_hungarian_union_desc: "Когда Казимир III умер без наследника в 1370 году, его племянник Людовик I Венгерский (из дома Анжу) унаследовал польский престол. Это стало началом польско-венгерской личной унии. Два великих королевства, объединённые под одним королём — баланс сил в Центрально-Восточной Европе коренным образом меняется."
 pol_moldavia_vassal: "Покори Молдавию"
 pol_moldavia_vassal_desc: "Молдавское княжество (Молдова) — буферное государство, оспариваемое Польшей, Венгрией и османами. Стефан Великий (правил 1457-1504) сохранял номинальный польский сюзеренитет, удерживая фактическую независимость. Приведи это стратегическое княжество твёрдо под польскую защиту и захвати врата к Чёрному морю."
 pol_wallachia_control: "Владычество над Валахией"
 pol_wallachia_control_desc: "Валахия, княжество к северу от Дуная, — передовая линия против Османской империи. Влад II (отец Влада Колосажателя) служил Венгрии членом Ордена Дракона. Приведение Валахии под защиту польско-венгерской унии утверждает влияние на Балканском полуострове."
 pol_battle_of_grunwald: "Дух Танненберга"
 pol_battle_of_grunwald_desc: "15 июля 1410 года польско-литовское войско сокрушило Тевтонский орден совершенно на полях Танненберга (Грюнвальда). Великий магистр Ульрих фон Юнгинген пал на поле, и Польша упрочила свою репутацию «защитницы христианства». Докажи этот дух ныне вновь в войне против сил ислама."
 pol_shield_of_christendom: "Щит христианства"
 pol_shield_of_christendom_desc: "Со времён политики христианизации Ядвиги Польша стоит на передовой линии восточноевропейского католицизма. После окончательного изгнания Османской империи папа, Венеция и Габсбурги равно признают, что Польша — истинный Antemurale Christianitatis — оплот христианства."
 pol_silesia_integration: "Включение Силезии"
 pol_silesia_integration_desc: "Силезия (Śląsk) — колыбель пястовской династии, но попала под богемский и габсбургский контроль в XIV веке. Возвращение этого богатого промышленного и торгового региона вокруг Бреслау (Вроцлава) — одна из важнейших национальных и экономических заповедей Польши."
 pol_bohemian_claim: "Богемская корона"
 pol_bohemian_claim_desc: "Ягеллонская династия держит наследственные права на богемский и венгерский престолы. Владислав II (Ягеллон) стал королём Богемии в 1471 году, а затем и королём Венгрии в 1490 году. Взятие богемской короны в Праге создаёт польско-богемско-венгерскую тройную монархию."
 pol_hre_influence: "Влияние на Священную Римскую империю"
 pol_hre_influence_desc: "Король Польши, держащий также богемскую корону, может стать курфюрстом Священной Римской империи. Через равновесие дипломатии с Габсбургами и расширение влияния на германских князей Польша становится политическим центром Центральной Европы."
 pol_central_european_power: "Центральноевропейская держава"
 pol_central_european_power_desc: "Обширное царство, охватывающее Польшу, Литву, Богемию и Венгрию, с богатым доходом — Польша выступила величайшей державой Центрально-Восточной Европы. Окружённая тремя великими державами Священной Римской империей, Османской империей и Великим княжеством Московским, Польша сияет собственным блеском."
 pol_grand_commonwealth: "Великая дворянская республика"
 pol_grand_commonwealth_desc: "Дворянская республика, объединяющая Польшу, Литву, Богемию и Венгрию — это государство со своеобразной политической системой, согласующей дворянскую свободу с королевской властью, было известно в XVI-XVII веках как «Республика многих народов» (Rzeczpospolita). Этот замечательный политический эксперимент, охватывающий несколько народов, вер и языков, достиг своей вершины."
 pol_events.10.t: "Брак Ядвиги и Ягайло"
 pol_events.10.d: "Кревская уния принесла плод: польская королева Ядвига и литовский великий князь Ягайло сочетались браком. Ягайло принял христианское крещение и принял как король Польши имя «Владислав II». Литва вступает с Польшей в личную унию, и величайшее политическое объединение Восточной Европы началось. Этот брак есть больше, чем политический расчёт — это исторический миг, когда два народа, две культуры, два языка объединяются под одной династией. «Польша и Литва едины навеки», — провозгласила Кревская уния."
 pol_events.10.a: "Да здравствует новая Ягеллонская династия!"
 pol_events.20.t: "Польско-венгерская личная уния"
 pol_events.20.d: "Польша и Венгрия образовали личную унию. Два великих королевства, объединённых под одним королём — это дипломатический триумф дома Анжу и событие, перекраивающее историю Центрально-Восточной Европы. Польские и венгерские рыцари ныне стоят плечом к плечу. От Балтики на севере до Адриатики на юге огромное царство под одной династией обретает форму. Для Османской империи эта уния — величайшая угроза, с коей она сталкивается."
 pol_events.20.a: "Польша и Венгрия едины!"
 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "Наследие пястовской династии"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "Тысячелетнее наследие пястовской династии — первого польского королевского дома — подкрепляет легитимность польской короны."
 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "Включение Мазовии"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "Мазовия вокруг Варшавы полностью включена в Польшу. Эта плодородная низменность действует сердцем царства."
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "Великий сейм учреждён"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "Сейм Польши учреждён учреждением Золотой свободы. Своеобразная политическая система, согласующая дворянскую автономию с королевской властью, рождается."
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "Культурный расцвет Кракова"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "Краков вокруг Вавеля купается в свете Возрождения. Как величайший академический город Центрально-Восточной Европы, здесь собираются учёные и художники со всей Европы."
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "Ягеллонский университет процветает"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "Ягеллонский университет — alma mater Коперника — процветает лучшей академией Центрально-Восточной Европы. Знание и искусство распространяются по всей Польше."
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "Польский золотой век"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "Гелиоцентризм Коперника, поэзия Кохановского, зодчество Кракова — во всех отношениях Польша наслаждается своим золотым веком."
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "Узы унии Ядвиги и Ягайло"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "Польско-литовская личная уния утверждена. Обширное государство, простирающееся от Балтики до Чёрного моря, обретает форму."
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "Сила польско-венгерского союза"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "Знамёна королевских войск, собранных с берегов Вислы и Дуная, стоят бок о бок на холмах над османской границей."
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "Развитие Рутении"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "Пахотные земли Червонной Руси полностью развиты. Черноморский торговый путь через Львов оживлён."
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "Врата Киева"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "Киев, колыбель славянской цивилизации, пришёл под польский контроль. Влияние на весь бассейн Днепра утверждено."
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "Продвижение на восток"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "С обеспеченными Минском и Смоленском весь восточнославянский мир попадает в сферу влияния Польши."
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "Восточная империя"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "Польская империя, простирающаяся от Балтики до Чёрного моря, завершена. Вписана в историю крупнейшим государством Восточной Европы."
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "Победа над Тевтонским орденом"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "Дух Танненберга воодушевляет польскую армию. Память о победе над крестоносцами христианства становится гордостью войска."
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "Торговый город Гданьск"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "Гданьск развился в крупнейший зерноэкспортный порт Балтики. Польское зерно, текущее по Висле, кормит всю Европу."
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "Слава Танненберга"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "Дух Танненберга воодушевляет польскую армию. В борьбе против неверных Польша обретает всё большую славу."
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "Щит христианства"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "Польша вписана в историю Antemurale Christianitatis — оплотом христианства."
 STATIC_MODIFIER_NAME_pol_silesia_mod: "Включение Силезии"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "Орлиное знамя вернулось к замкам Силезии, родине пястов, и дым её рудников и мастерских вновь поднимается в польские небеса."
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "Богемская корона"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "Ягеллонская династия захватила богемскую корону. Богемский королевский двор в Праге становится сценой польской дипломатии."
 STATIC_MODIFIER_NAME_pol_central_power_mod: "Центральноевропейская держава"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "Польша выступила величайшей державой Центрально-Восточной Европы. Даже среди трёх великих держав она сияет собственным блеском."
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "Великая дворянская республика"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "Rzeczpospolita завершена — величайший политический эксперимент Европы, охватывающий несколько народов, вер и языков."
 pol_support_merchants: "Поддержка купечества"
 pol_support_merchants_desc: "Городские горожане Польши — важная опора королевских финансов. Через поддержку торговой сети вокруг Суконных рядов (Sukiennice) в Кракове улучшаются и верность горожан, и налоговые доходы. Удовлетвори купечество и заложи основы Польши торговой нацией."
 pol_black_sea_access: "Доступ к Чёрному морю"
 pol_black_sea_access_desc: "Спускаясь по Днепру, Польша может достичь Чёрного моря. Контроль над полуостровом Крым и северным берегом Понта Эвксинского (Чёрного моря) означает обеспечение торгового пути на Восток, минуя османски управляемый Константинополь. Построй черноморский флот и расширь морское господство."
 pol_breadbasket_of_europe: "Житница Европы"
 pol_breadbasket_of_europe_desc: "К концу XVI века Польша поставляла большую часть зерна, потребляемого Европой. Купцы Амстердама, Лиссабона и Севильи не могли вести дела без польской пшеницы и ржи. Польша вписана в историю «Житницей Европы»."
 pol_nieszawa_privileges: "Нешавские привилегии"
 pol_nieszawa_privileges_desc: "В 1454 году Казимиру IV Ягеллончику потребовались дворянские ополчения для войны против Тевтонского ордена — и он заплатил за это Нешавским статутом, даровавшим шляхте широкие привилегии. Отныне король не мог ни ввести новые налоги, ни издать новые законы без согласия дворянства. Это стало краеугольным камнем польской «Золотой свободы»."
 pol_develop_krakow: "Развей Краков"
 pol_develop_krakow_desc: "Польская столица Краков выросла вокруг Вавеля. Полное развитие этого города — возвышение его до ранга города — утверждает его ранг крупнейшего торгового города Центрально-Восточной Европы."
 pol_baltic_fleet: "Балтийский флот"
 pol_baltic_fleet_desc: "С обеспеченным Гданьском Польша обеспечила доступ к Балтике. Настало время построить флот и соперничать за верховенство на Балтике. Пока Швеция, Дания и Ливонский орден все соперничают за эти воды, польский флот становится новейшей — и крупнейшей — державой Балтики."
 pol_sea_to_sea: "От моря до моря"
 pol_sea_to_sea_desc: "Господство над Ливонией на море и взятие Киева и Смоленска — польско-литовская уния ныне простирается от Балтики до Чёрного моря. От Ревеля на севере до Киева на юге крупнейшая непрерывная империя Восточной Европы завершена. Великий гетман Ян Замойский позже скажет: «Эта Польша — нация, кою построил сам Бог»."
 pol_challenge_habsburg: "Брось вызов Габсбургам"
 pol_challenge_habsburg_desc: "В XVI веке Габсбурги правили Священной Римской империей, Испанией, Богемией и Венгрией — крупнейшей династией Европы. Но как король Богемии и Польши, ягеллонский монарх может бросить вызов этой гегемонии. Займи Вену или приведи Габсбургов под польское знамя."
 pol_codify_law: "Кодифицируй право"
 pol_codify_law_desc: "Вислицкий статут Казимира Великого 1346/47 года был первой систематической кодификацией польского права. Опираясь на делопроизводство и административную инфраструктуру, сосредоточенную на конторах, более полная кодификация польского права значительно улучшает административную эффективность."
 pol_develop_warsaw: "Развей Варшаву"
 pol_develop_warsaw_desc: "Варшава выросла центром Мазовецкого герцогства. Расположенная в центре Польши, она станет столицей Польско-Литовской дворянской республики после Люблинской унии 1569 года. Возвышение её до ранга города утверждает административную основу центра царства."
 pol_amber_road: "Янтарный путь"
 pol_amber_road_desc: "Балтийский янтарь — «золото Севера» — ценится со времён древности. Гданьск был главным портом вывоза балтийского янтаря, и экспорт в Италию и Средиземноморье приносил огромное богатство. Оживи этот древний торговый путь и подними экономический ранг Польши."
 pol_poznan_commerce: "Торговля Познани"
 pol_poznan_commerce_desc: "Познань — торговый город Западной Польши, узел торговли с Бранденбургом и Силезией. Этот город, вместивший первую польскую епископскую кафедру, постоянно был торговым центром Западной Польши со времён Средневековья. Возвысь его до ранга города и полностью раскрой его торговый потенциал."
 pol_vilnius_capital: "Развей Вильнюс"
 pol_vilnius_capital_desc: "Вильнюс быстро вырос в XIV веке столицей Великого княжества Литовского. Построенный великим князем Гедимином, этот город стал домом для многих евреев, католиков и православных христиан, живущих бок о бок — позже известный как «Иерусалим Севера». Возвысь его до ранга города и развей центром литовского управления."
 pol_russia_rivalry: "Соперничество с Москвой"
 pol_russia_rivalry_desc: "Иван III Великий яростно спорил с Польшей-Литвой из-за Смоленска. Смоленские войны между Москвой и Польшей-Литвой продолжались весь XVI век — судьбоносный спор. Объяви Москву соперником и утверди восточную гегемонию. Против притязания Москвы быть «хранителем Святой Руси» стоит Польша как «хранитель свободы»."
 pol_malbork_castle: "Мальборкский замок"
 pol_malbork_castle_desc: "Мальборк был построен главным седалищем Тевтонского ордена — крупнейшим средневековым замком Европы. Переданный Польше по Торуньскому миру (1457), эта могучая крепость становится совершенным оборонительным пунктом."
 pol_gniezno_church: "Гнезненское архиепископство"
 pol_gniezno_church_desc: "Гнезно — историческая столица Польши и седалище её первого архиепископства. Построенный около 987 года собор в Гнезно хранит мощи Святого Войцеха и с тех пор служит сердцем польской католической веры. Укрепи польскую церковь и осуществи миссию защитника восточноевропейского католицизма."
 pol_hanseatic_ties: "Узы с Ганзой"
 pol_hanseatic_ties_desc: "Ганзейский союз господствовал в торговле Балтики и Северного моря. Польские города, такие как Гданьск, Торунь и Эльблонг, имели тесные ганзейские узы. Возведи обширную торговую сеть вокруг этих городов, и Польша выступит ведущей торговой державой Балтики."
 pol_transylvania_influence: "Влияние на Трансильванию"
 pol_transylvania_influence_desc: "Трансильвания — богатый регион на границе между Королевством Венгрия и польской личной унией. Утверждение влияния на Трансильванию — через венгерскую унию или прямо — стабилизирует юго-восточную границу Польши."
 pol_subjugate_serbia: "Покори Сербию"
 pol_subjugate_serbia_desc: "Королевство Сербия стало османским вассалом после Косова поля (1389). Как часть южной экспансии польско-венгерской унии, обеспечение Белграда или превращение Сербии в вассала утверждает твёрдый опорный пункт на северных Балканах."
 pol_varna_revenge: "Месть за Варну"
 pol_varna_revenge_desc: "В битве при Варне 1444 года польско-венгерское крестоносное войско было сокрушено османами, и польский король Владислав III пал на поле. Настало наконец время отомстить за это унижение. Займи Варну, воюя с мусульманской нацией, и эта трагедия будет переписана в победу."
 pol_upper_silesia_mines: "Верхнесилезские рудники"
 pol_upper_silesia_mines_desc: "Верхняя Силезия известна богатыми серебряными, цинковыми и свинцовыми рудниками. Полное развитие горнодобывающих округов вокруг Тешина и Гливице утверждает промышленную основу Польши. Захвати заранее природные богатства этого региона — позже ставшего центром Промышленной революции."
 pol_upper_silesia_mines_unlock_tt: "Решение «Освоение шахт Верхней Силезии» теперь доступно."
 pol_silesia_mining_decision.title: "Освоение шахт Верхней Силезии"
 pol_silesia_mining_decision.desc: "Горнорудные районы Силезии обширны, и корона не может освоить их все разом. Каждое вложение в шахты, плавильни и дороги выводит на полную мощность ещё один район, и это дело можно возобновлять каждое десятилетие."
 pol_silesia_mining_decision.a: "Вложиться в новый горнорудный район."
 pol_pomeranian_coast: "Поморское побережье"
 pol_pomeranian_coast_desc: "Поморье (Pomorze) — прибалтийский регион вокруг Щецина. Возвращение этого исторически принадлежавшего польскому царству региона даёт Польше полный контроль над балтийским побережьем."
 pol_prague_university: "Пражский университет"
 pol_prague_university_desc: "Карлов университет в Праге (основан в 1348 году) — старейший университет Центрально-Восточной Европы. Некогда рассадник гуситской реформации, эта академия может ныне быть отстроена и развита под польским правлением — и Прага вновь станет центром католической учёности."
 pol_catholicism_of_lithuania: "Католизация Литвы"
 pol_catholicism_of_lithuania_desc: "Когда Ягайло стал королём Польши, он поклялся обратить Литву в католицизм. Возведи церкви и монастыри по всей Литве вокруг Вильнюса и преврати эту некогда языческую землю в полностью католическое государство. Без этого обращения не может быть истинного единства польско-литовской унии. «Литва, возрождённая в вере»."
 pol_royal_road: "Королевская дорога"
 pol_royal_road_desc: "«Королевская дорога» (Droga Królewska), идущая от Кракова через Гнезно и Познань до Гданьска, — великая артерия Королевства Польша. С включённой Мазовией и завоёванной Пруссией развитие этой дороги значительно улучшает сообщение, торговлю и управление по всему царству."
 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "Нешавские привилегии"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "Шляхта обрела право вето над королевским законодательством. Начало польской «Золотой свободы»."
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "Польский свод законов"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "Новые статьи, происходящие от свода законов Казимира Великого, приближают день, когда дворяне и горожане равно будут судимы одним и тем же судом."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Политика поддержки купечества"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "Политика поддержки польского городского купечества поднимает торговый доход."
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "Янтарный путь"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "Повозки, гружённые балтийским янтарём, следуют по древней дороге к купцам, ищущим «золото Севера»."
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "Торговый узел Познань"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "Торговый город Западной Польши, Познань, отстроен важным торговым узлом."
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "Вильнюс процветает"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "Столица Великого княжества Литовского, Вильнюс, процветает многокультурным городом."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Доступ к Чёрному морю"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "Польша обеспечила доступ к северному черноморскому побережью и вступает в средиземноморские торговые пути."
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "Крепость Мальборк"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "Крупнейший средневековый замок Европы отстроен бастионами — несокрушимым оплотом."
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "Гнезненское архиепископство"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "Собор в Гнезно, дом мощей Святого Войцеха, действует духовным центром польской католической цивилизации."
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "Месть за Варну"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "Унизительное поражение 1444 года отомщено. Польша обретает всё большую славу в борьбе против исламского мира."
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "Поморское побережье"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "Поморское побережье вокруг Щецина отстроено опорным пунктом польского флота."
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "Пражский университет процветает"
 STATIC_MODIFIER_DESC_pol_prague_learning_mod: "Старейший университет Центрально-Восточной Европы, Карлов университет, вновь процветает под польским правлением."
 STATIC_MODIFIER_NAME_pol_habsburg_victory_mod: "Победа над Габсбургами"
 STATIC_MODIFIER_DESC_pol_habsburg_victory_mod: "Вена занята или габсбургская личная уния — Польша стала владыкой Центральной Европы."
 STATIC_MODIFIER_NAME_pol_sea_to_sea_mod: "От моря до моря"
 STATIC_MODIFIER_DESC_pol_sea_to_sea_mod: "Польша, простирающаяся от Балтики до Чёрного моря, господствует над всей восточноевропейской торговлей."
 STATIC_MODIFIER_NAME_pol_lithuanian_church_mod: "Литовская церковь"
 STATIC_MODIFIER_DESC_pol_lithuanian_church_mod: "Католизация Литвы достигла духовного единства польско-литовской унии."
 STATIC_MODIFIER_NAME_pol_royal_road_mod: "Королевская дорога"
 STATIC_MODIFIER_DESC_pol_royal_road_mod: "Чиновники, купцы и солдаты путешествуют длинной вереницей по Королевской дороге от Кракова до Гданьска."
 pol_lithuanian_relations: "Отношения с Литвой"
 pol_lithuanian_relations_desc: "Великое княжество Литовское — важнейший сосед Польши — возможный союзник или величайшая угроза. В XIV веке Литва была последней языческой нацией Европы и всё же обширным государством, простиравшимся от Балтики до Чёрного моря. Дабы обеспечить личную унию с Литвой через брачную политику королевы Ядвиги, сначала должна быть заложена дипломатическая основа. Будь то через дружеские отношения или военное давление, Польша может заявить притязание на литовский престол."
 pol_develop_ruthenia_desc: "Галиция (Галич) и Волынь — два великих княжества Червонной Руси. Львов, центр княжества Галиции, и Волынское княжество были завоёваны Польшей в 1349-66 годах. Белз также важный русский оплот. Приведение и Галиции, и Волыни в личную унию под Польшей — или прямое владение Львовом и Белзом — утверждает контроль над всей Червонной Русью. Эта земля — одна из крупнейших земледельческих зон Европы, и её богатая почва несёт польское население и экономику."
 STATIC_MODIFIER_NAME_pol_silesia_mines_mod: "Верхнесилезские рудники"
 STATIC_MODIFIER_DESC_pol_silesia_mines_mod: "В шахтах Верхней Силезии звук кирок, добывающих серебро, цинк и свинец, звучит день и ночь."
 STATIC_MODIFIER_NAME_pol_baltic_fleet_mod: "Польский балтийский флот"
 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "Польский флот, стоящий в Гданьске, господствует над Балтикой. От устья Вислы до Северного моря реет польское знамя на волнах."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Владычество над Ливонией"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "Под польским флагом, реющим над портами Риги и Ревеля, народы многих языков платят подать одним и тем же сборщикам."
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "Узы с Ганзой"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "В конторах Гданьска те, кто делят чашу с ганзейскими купцами, ведут свою торговлю, доверяя грузу друг друга."
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "Влияние на Трансильванию"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Через личную унию с Венгрией польские послы принимаются даже при дворах горных долин Трансильвании."
 pol_breadbasket_town_right_tt: "Городское право «Польская королевская житница» ныне доступно. Его можно даровать районам ранга города или выше с зернохранилищем 5-го уровня или выше."
 STATIC_MODIFIER_NAME_pol_warsaw_location_mod: "Королевская столица Варшава развита"
 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "Улицы Варшавы, построенной на берегах Вислы, расширяются день ото дня, и кареты чиновников со всего царства собираются здесь."
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "Краков процветает"
 STATIC_MODIFIER_DESC_pol_krakow_location_mod: "Краков вокруг Вавеля полностью развит. Расширение максимального размера сырьевых ресурсов и ежемесячного роста процветания преображает его в город, достойный польской королевской столицы."
