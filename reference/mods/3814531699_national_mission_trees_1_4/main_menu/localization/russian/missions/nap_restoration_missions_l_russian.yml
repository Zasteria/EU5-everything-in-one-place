 nap_patronage_of_diverse_arts: "Покровительство разнообразным искусствам"
 nap_dynastic_stability: "Династическая стабильность"
 nap_subjugation_of_epirus: "Покорение Эпира"
 nap_southern_renaissance: "Южное Возрождение"
 nap_caserta_palace: "Дворец Казерта"
 nap_charles_dream: "Мечта Карла I"
 nap_never_die_without_seeing_naples: "Увидеть Неаполь и умереть"
 nap_latin_empire: "Латинская империя"
 nap_new_capital_of_sicily_desc: "Утратив Сицилию, мы избрали Неаполь нашей новой столицей вместо Палермо. Этот город должен быть развит в седалище, достойное царства."
 nap_apulian_granary_desc: "Плодородные равнины Апулии долго славятся источником зерна. Их урожай кормит наш народ и образует важный экспортный товар царства. Апулия также лежит напротив Греции через пролив Отранто, делая её жизненно важным форпостом."
 nap_control_of_transumanza_desc: "Трансуманса, унаследованное перегонное скотоводство, практикуемое в Абруццо и Молизе, образует экономический хребет этих регионов. Когда государство управляет тратурами и защищает пастухов, производство шерсти, сыра и других товаров будет процветать."
 nap_patronage_of_diverse_arts_desc: "Сицилия была пройдена греками, карфагенянами, римлянами, германцами, арабами, норманнами и французами, и их культуры смешались здесь. Искусство, укоренённое в этом культурном разнообразии, есть истинное искусство Сицилии."
 nap_dynastic_stability_desc: "Никогда устойчивая династия не пускала корни на Сицилии, и это неоднократно призывало иноземное вторжение. Стабилизация династии есть вернейший путь к стабильности самой Сицилии."
 nap_southern_renaissance_desc: "Художники и учёные со всей страны, привлечённые стабильным и достойным двором, принесли и Неаполю Возрождение — придворно управляемая культура, отличная от Северной Италии, ныне расцветает здесь."
 STATIC_MODIFIER_NAME_nap_new_capital_mod: "Новая столица"
 STATIC_MODIFIER_DESC_nap_new_capital_mod: "Неаполь развит в седалище, достойное царства, способствуя росту и производительности города."
 STATIC_MODIFIER_NAME_nap_apulian_granary_mod: "Житница Апулии"
 STATIC_MODIFIER_DESC_nap_apulian_granary_mod: "Плодородные земли Апулии постоянно способствуют производству сырья здесь."
 STATIC_MODIFIER_NAME_nap_control_of_transumanza_mod: "Контроль над трансумансой"
 STATIC_MODIFIER_DESC_nap_control_of_transumanza_mod: "Защита пастухов и управление тратурами постоянно повысили производство сырья здесь."
 STATIC_MODIFIER_NAME_nap_patronage_of_diverse_arts_mod: "Покровительство разнообразным искусствам"
 STATIC_MODIFIER_DESC_nap_patronage_of_diverse_arts_mod: "Художники, укоренённые во многих культурах, собрались при дворе, повышая престиж царства и терпимость к иным верам."
 STATIC_MODIFIER_NAME_nap_dynastic_stability_mod: "Династическая стабильность"
 STATIC_MODIFIER_DESC_nap_dynastic_stability_mod: "Под устойчивой династией легитимность короны растёт, и внутренние беспорядки убывают."
 STATIC_MODIFIER_NAME_nap_southern_renaissance_mod: "Южное Возрождение"
 STATIC_MODIFIER_DESC_nap_southern_renaissance_mod: "Художники, собравшиеся в Неаполе, отточили своё искусство, и мастерство новых художников, поступающих на службу царству, возросло."
 nap_divided_kingdom_desc: "В 1282 году народ Сицилии восстал против правления нашего дома Анжу и приветствовал дом Арагона новым королём. С тех пор Королевство Сицилия разделено надвое. Мы правим материком вокруг Неаполя, но возвращение острова Сицилия остаётся исторической миссией, вверенной нашей династии."
 nap_papal_blessing_desc: "С тех пор как Карл I завоевал Королевство Сицилия по приглашению папы, наша династия хранит тесные узы с папством. Сохранение доверия папы незаменимо для поддержания легитимности нашего правления."
 nap_army_buildup_desc: "Укрепи постоянную армию царства в подготовке к борьбе за возвращение Сицилии. Сильное войско также понадобится для любого вмешательства в Северной Италии или для подавления восстаний на материке."
 nap_match_aragon_navy_desc: "Дабы противостоять арагонскому флоту, господствующему над Сицилийским проливом, наше царство также должно обладать мощной морской силой. Кто правит морем, тот со временем будет править Сицилией."
 nap_sword_of_the_guelphs_desc: "Борьба между гвельфами (папской партией) и гибеллинами (императорской партией) потрясает всю Северную Италию. Как союзник папы, наше царство может присоединиться к этой борьбе мечом гвельфов и захватить возможность расширить наше влияние на север."
 nap_sicilian_reunification_war_desc: "Наконец настало время послать наши войска на остров Сицилия. Если мы сможем сломить арагонский гарнизон и занять Палермо, путь к воссоединению разделённого царства откроется."
 nap_invest_in_provence_desc: "Графство Прованс, родина дома Анжу, всё ещё хранит глубокие узы с нашей династией. Инвестиции здесь создадут опорный пункт на западе, одновременно укрепляя наши узы с родовой родиной."
 STATIC_MODIFIER_NAME_nap_papal_blessing_mod: "Папская поддержка"
 STATIC_MODIFIER_DESC_nap_papal_blessing_mod: "Через наши тесные узы с папством наше религиозное влияние неуклонно растёт."
 STATIC_MODIFIER_NAME_nap_army_buildup_mod: "Реорганизованное королевское войско"
 STATIC_MODIFIER_DESC_nap_army_buildup_mod: "Реорганизованное королевское войско гордится высокой моралью и обильными резервами живой силы."
 STATIC_MODIFIER_NAME_nap_match_aragon_navy_mod: "Антиарагонский флот"
 STATIC_MODIFIER_DESC_nap_match_aragon_navy_mod: "Королевский флот, построенный, дабы противостоять Арагону, гордится высокой моралью и быстрым передвижением."
 STATIC_MODIFIER_NAME_nap_sword_of_the_guelphs_mod: "Меч гвельфов"
 STATIC_MODIFIER_DESC_nap_sword_of_the_guelphs_mod: "Вмешавшись в раздор Северной Италии мечом папства, наше войско обрело искусство в осадном деле и дисциплине."
 STATIC_MODIFIER_NAME_nap_sicilian_reunification_war_mod: "Война воссоединения Сицилии"
 STATIC_MODIFIER_DESC_nap_sicilian_reunification_war_mod: "Пройдя через ожесточённую войну за Сицилию, королевское войско может выставить больше войск, и бремя войны давит на царство легче."
 STATIC_MODIFIER_NAME_nap_invest_in_provence_mod: "Инвестиция в Прованс"
 STATIC_MODIFIER_DESC_nap_invest_in_provence_mod: "Для дома Анжу Прованс был «домом». Утратив Неаполь, король Рене провёл остаток своей жизни в Провансе, и Экс-ан-Прованс вырос в культурный центр. Узы между Неаполем и Провансом глубоки, выкованные кровью и историей дома Анжу."
 nap_events.1.t: "Королевство, разделённое надвое"
 nap_events.1.d: "В 1282 году, в восстании, известном как Сицилийская вечерня, народ Сицилии свергнул правление дома Анжу. Более не в силах терпеть тиранию присланных из Франции чиновников, народ острова поднялся как один при звоне вечерних колоколов и изгнал французов с наших берегов. Мы приветствовали короля Педро III Арагонского новым правителем, и Королевство Сицилия было тем самым разделено надвое. За проливом, на материке с центром в Неаполе, король дома Анжу до сих пор именует себя «королём Сицилии». Лишь мы — законные короли этого острова. Соперничество между двумя нашими царствами продолжается по сей день."
 nap_events.1.a: "Понятно"
 nap_cross_the_strait_of_otranto_desc: "Пролив Отранто, едва в 70 километров шириной, есть морские врата между итальянским и балканским полуостровами. Если мы пересечём его и утвердим опорный пункт в Албании, наши флоты и торговые суда обретут путь далее на восток."
 nap_influence_over_the_papacy_desc: "Если мы углубим наши узы с папством далее, сохраняя внутреннюю стабильность, наша династия обретёт влияние на Святой престол, кое нельзя не заметить."
 nap_the_bells_fall_silent_desc: "Остров Сицилия вновь наш, и разделённое царство воссоединено. Мы должны упрочить наше правление с осторожностью, дабы «колокола», кои некогда разорвали царство, никогда не зазвонили вновь."
 nap_defeat_of_aragon_desc: "Лишённый своего сицилийского владения, дом Арагона более не та угроза для нашего царства, коей был некогда. Если сам Арагон падёт или его корона будет приведена под наш сюзеренитет, давнее соперничество через Средиземноморье может наконец быть закончено."
 nap_expand_influence_in_southern_france_desc: "От нашего опорного пункта в Провансе наше влияние ныне простирается вверх по Роне до самого Лиона. Наше присутствие по всей Южной Франции продолжает расти."
 nap_western_mediterranean_hegemony_desc: "Если мы сможем занять Сардинию и Балеарские острова, два великих оплота западного Средиземноморья, наши флоты будут господствовать над водами от Генуи до Иберии, сделав нас неоспоримыми владыками западного моря."
 STATIC_MODIFIER_NAME_nap_cross_the_strait_of_otranto_mod: "Опорный пункт за Отранто"
 STATIC_MODIFIER_DESC_nap_cross_the_strait_of_otranto_mod: "Наш опорный пункт в Албании позволяет нашим флотам и торговым судам плыть далее."
 STATIC_MODIFIER_NAME_nap_influence_over_the_papacy_mod: "Влияние на папство"
 STATIC_MODIFIER_DESC_nap_influence_over_the_papacy_mod: "Наши узы с папством углубились, укрепляя легитимность нашего правления и нашу терпимость к еретикам."
 STATIC_MODIFIER_NAME_nap_the_bells_fall_silent_mod: "Тихие колокола"
 STATIC_MODIFIER_DESC_nap_the_bells_fall_silent_mod: "Правление воссоединённого царства стабилизировалось; недовольство народа смягчено, и легитимность короны выросла."
 STATIC_MODIFIER_NAME_nap_defeat_of_aragon_mod: "Поражение Арагона"
 STATIC_MODIFIER_DESC_nap_defeat_of_aragon_mod: "Конфликт между Арагоном и домом Анжу начался с Сицилийской вечерни 1282 года и длился более 160 лет, до завоевания Неаполя Альфонсо V в 1442 году. Наконец победить этого старого врага означало бы завершение величайшей мести в истории Королевства Неаполь."
 STATIC_MODIFIER_NAME_nap_expand_influence_in_southern_france_mod: "Влияние в Южной Франции"
 STATIC_MODIFIER_DESC_nap_expand_influence_in_southern_france_mod: "Торговое и дипломатическое присутствие царства по всей Южной Франции продолжает расти."
 STATIC_MODIFIER_NAME_nap_western_mediterranean_hegemony_mod: "Гегемония западного Средиземноморья"
 STATIC_MODIFIER_DESC_nap_western_mediterranean_hegemony_mod: "Завоевав Сардинию и Балеарские острова, наш флот господствует над всем западным Средиземноморьем, его мораль высока."
 nap_anjou_hungary_desc: "Наш дом Анжу имеет побочные ветви не только в Неаполе, но и в Венгрии. Должны ли узы между нашими двумя царствами общей крови углубиться, мы можем найти также справедливое основание притязать на венгерскую корону."
 nap_foothold_in_northern_italy_desc: "Если мы сможем обеспечить опорный пункт в Тоскане, мы можем углубить наши узы с богатыми городами-государствами Северной Италии, такими как Флоренция и Пиза, и обрести преимущество в любой кампании по всему полуострову."
 nap_crossroads_of_civilizations_desc: "Королевство Сицилия долго стояло на перекрёстке греческой, римской, арабской и норманнской цивилизаций. Огромная коллекция искусства, накопленная при нашем дворе, стоит доказательством того, что наше царство воистину есть перекрёсток цивилизаций."
 nap_anjou_homeland_desc: "Ныне, когда Анже обеспечен, наше влияние простирается вплоть до родовой родины нашего дома Анжу. Эта связь с землями наших предков может принести нам ещё и притязание на сам французский престол."
 nap_french_throne_claim_desc: "Дом Анжу родился побочной ветвью французской королевской линии. Если мы сможем обеспечить сам Париж или образовать личную унию с французской короной, наш король будет носить и корону Франции, и Неаполя."
 STATIC_MODIFIER_NAME_nap_foothold_in_northern_italy_mod: "Опорный пункт в Северной Италии"
 STATIC_MODIFIER_DESC_nap_foothold_in_northern_italy_mod: "Наши узы с городами Тосканы позволяют нам эффективнее обращать военные приобретения в очки войны по всему полуострову."
 STATIC_MODIFIER_NAME_nap_crossroads_of_civilizations_mod: "Перекрёсток цивилизаций"
 STATIC_MODIFIER_DESC_nap_crossroads_of_civilizations_mod: "Огромная коллекция искусства, накопленная при нашем дворе, продолжает распространять культурное влияние царства на соседние земли."
 STATIC_MODIFIER_NAME_nap_anjou_homeland_mod: "Родовые земли Анжу"
 STATIC_MODIFIER_DESC_nap_anjou_homeland_mod: "Имя дома Анжу происходит от Анже во Франции, города на Луаре. Генрих II, основавший Плантагенетскую Англию, также был графом Анжу. Восстановление узы с родовой родиной Анже возродило бы анжуйскую сеть по всей Европе."
 STATIC_MODIFIER_NAME_nap_king_of_france_mod: "Король Франции"
 STATIC_MODIFIER_DESC_nap_king_of_france_mod: "Дом Анжу, потомки Капетингов, принимает корону своего капетингского сюзерена — поворот истории вспять. Титул «Христианнейший король» Франции — один из самых почётных в Европе, и его обретение возвышает династию Южной Италии до политической вершины всего христианского мира."
 nap_mediterranean_greatest_city_desc: "Население Неаполя ныне достигло масштаба, редкого даже в Средиземноморье. Со времён древнего Рима ни один город на этом море не знал такого процветания."
 nap_university_of_frederick_ii_desc: "Университет Неаполя, основанный Фридрихом II, есть центр учёности царства. Обеспечив его залами искусства и науки, его слава распространится по всей Европе."
 nap_magnificent_royal_palace_desc: "Разбивка садов при королевском дворце незаменима, дабы показать великолепие короны равно подданным и чужеземцам. Великолепные сады возвестят всем посетителям процветание царства."
 nap_expansion_of_naples_port_desc: "Через постройку дока в порту Неаполя корабли могут быть отремонтированы и построены эффективнее, значительно помогая содержанию и росту королевского флота."
 nap_subjugation_of_epirus_desc: "Пересекши пролив Отранто и возведя опорный пункт, наши силы наконец покорили весь Эпир. Побережье Албании ныне под властью царства."
 nap_caserta_palace_desc: "Возведение нового дворца в Казерте покажет великолепие короны и одновременно даст королевской семье спокойное седалище правления вдали от неаполитанского двора."
 nap_charles_dream_desc: "Карл I некогда мечтал возвести великую империю в восточном Средиземноморье, расширение крестоносного духа. Ныне, с опорным пунктом в Морее, эта мечта начинает вновь обретать форму."
 nap_never_die_without_seeing_naples_desc: "Как гласит старая пословица, «увидеть Неаполь и умереть» — Неаполь стал городом, коего жаждут путешественники со всего мира. Его красота и процветание будут обсуждаться поколениями."
 nap_latin_empire_desc: "Королевство Сицилия более не просто региональная держава. На западе оно господствует над Средиземноморьем; на востоке путь от Мореи в Константинополь лежит открытым перед ним. Ныне настало время объявить себя миру наследником древней Латинской империи."
 STATIC_MODIFIER_NAME_nap_mediterranean_greatest_city_mod: "Величайший город Средиземноморья"
 STATIC_MODIFIER_DESC_nap_mediterranean_greatest_city_mod: "Неаполь стал одним из великих городов Средиземноморья, его производительность и рост далеко превосходят соседей."
 STATIC_MODIFIER_NAME_nap_university_of_frederick_ii_mod: "Университет Фридриха II"
 STATIC_MODIFIER_DESC_nap_university_of_frederick_ii_mod: "Учёные, собравшиеся в университете Неаполя, приносят царству новое знание и новаторство."
 STATIC_MODIFIER_NAME_nap_magnificent_royal_palace_mod: "Великолепный королевский дворец"
 STATIC_MODIFIER_DESC_nap_magnificent_royal_palace_mod: "Великолепные сады королевского дворца показывают всем престиж царства и легитимность короны."
 STATIC_MODIFIER_NAME_nap_expansion_of_naples_port_mod: "Расширение порта Неаполя"
 STATIC_MODIFIER_DESC_nap_expansion_of_naples_port_mod: "Неаполитанский залив, с Везувием в фоне, действует естественной гаванью со времён древности. Портовые сооружения, возведённые в анжуйскую и арагонскую эпохи, стали великим узлом средиземноморской торговли, через кой проходили восточные пряности, североафриканское зерно и иберийская шерсть."
 STATIC_MODIFIER_NAME_nap_subjugation_of_epirus_mod: "Покорение Эпира"
 STATIC_MODIFIER_DESC_nap_subjugation_of_epirus_mod: "Пройдя через кампанию в Эпире, королевское войско может выставить больше войск, и бремя войны давит на царство легче."
 STATIC_MODIFIER_NAME_nap_caserta_palace_mod: "Дворец Казерта"
 STATIC_MODIFIER_DESC_nap_caserta_palace_mod: "Дворец Казерта, спроектированный Ванвителли (начат в 1752 году), гордится масштабом, соперничающим с Версалем, и символизировал престиж бурбонского Королевства Неаполь. Более 1200 комнат, трёхкилометровые сады, фонтаны, питаемые акведуком — заложить основу перед созданием этого великолепного дворца есть цель этой миссии."
 STATIC_MODIFIER_NAME_nap_charles_dream_mod: "Мечта Карла I"
 STATIC_MODIFIER_DESC_nap_charles_dream_mod: "Старое честолюбие на восток горит заново, повышая престиж царства и мораль его войск."
 STATIC_MODIFIER_NAME_nap_never_die_without_seeing_naples_mod: "Увидеть Неаполь и умереть"
 STATIC_MODIFIER_DESC_nap_never_die_without_seeing_naples_mod: "«Увидеть Неаполь и умереть» (Vedi Napoli e poi muori) — так передавали европейские путешественники XVIII века словами, ибо Неаполь ошеломлял каждого посетителя Везувием, великолепным видом на залив, античными руинами и своими оживлёнными улицами."
 STATIC_MODIFIER_NAME_nap_latin_empire_mod: "Латинская империя"
 STATIC_MODIFIER_DESC_nap_latin_empire_mod: "Великолепие восстановленной Латинской империи простирается над Средиземноморьем, повышая престиж и легитимность царства и укрепляя его руку в военных переговорах."
