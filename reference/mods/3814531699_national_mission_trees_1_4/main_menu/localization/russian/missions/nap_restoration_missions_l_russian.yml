l_russian:
 nap_restoration_mission_pack: "Путь Королевства Неаполь"
 nap_restoration_mission_pack_DESCRIPTION:0 "Утратив Сицилию, царство ищет воссоединения и восстановления своей мощи в Средиземноморье. Под кровью и блеском дома Анжу возведи новый золотой век вокруг Неаполя."
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Заверши миссии как Королевство Неаполь, работая над воссоединением Сицилии и восстановлением Латинской империи."
 nap_restoration_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы пройти путём Королевства Неаполь."
 nap_restoration_mission_pack_BUTTON_DETAILS:0 "Воссоедини разделённое Королевство Сицилия и впиши своё имя в историю владыкой западного Средиземноморья и наследником древней Латинской империи!"
