l_russian:
 ara_crown_mission_pack: "Путь Арагонской короны"
 ara_crown_mission_pack_DESCRIPTION:0 "Арагонская корона — объединяющая Каталонию, Арагон и Валенсию — стоит в центре истории, соперничая за иберийское единство и верховенство в Средиземноморье. Протяни руку Кастилии и выкуй Испанию, или иди своим путём одна, включи Неаполь и марширируй на Константинополь. Путь за тобой."
 ara_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Заверши миссии как Арагонская корона, дабы утвердить иберийское единство и средиземноморскую гегемонию."
 ara_crown_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы пройти путём Арагонской короны."
 ara_crown_mission_pack_BUTTON_DETAILS:0 "Заложи основы Испании, стань владыкой западного Средиземноморья и займи Константинополь!"
 ara_accession_of_pedro_iv: "Восшествие Педро IV"
 ara_accession_of_pedro_iv_desc: "В 1336 году, со смертью Альфонсо IV, его сын Педро IV (Пере III Церемонный) взошёл на престол Арагонской короны. Учёный и глубоко приверженный придворному церемониалу, этот молодой король лелеет твёрдую решимость укрепить королевскую власть и объединить царство. С зарёй нового правления честолюбия Арагона в Средиземноморье вновь начинают разгораться."
 ara_kingdom_of_majorca: "Королевство Майорка"
 ara_kingdom_of_majorca_desc: "Королевство Майорка, некогда правимое побочной ветвью арагонского королевского дома, продолжает существовать самостоятельной политической силой на Балеарских островах. Полное включение этой территории станет первым шагом к большим честолюбиям в западном Средиземноморье."
 ara_reconquest_of_granada: "Реконкиста Гранады"
 ara_reconquest_of_granada_desc: "Королевство Гранада, последний оплот ислама на Иберийском полуострове, долго мучило христианских королей своими плодородными землями и великолепными дворцами. Завоевание этого царства знаменует завершение Реконкисты — конец векового противостояния."
 ara_vassalize_navarre: "Подчини Наварру"
 ara_vassalize_navarre_desc: "Малое Королевство Наварра, зажатое между Францией и Кастилией, — стратегически важная буферная зона для Арагона. Прежде чем Франция сможет поглотить её, мы должны привести Наварру в сферу влияния Арагона."
 ara_intervene_in_castile: "Вмешайся в дела Кастилии"
 ara_intervene_in_castile_desc: "Двор Кастилии, разделяющий кровь Трастамара с нашим собственным королевским домом, долго раздирался фракционным раздором. Как некогда инфанты Арагона спорили за влияние на это великое королевство, так ныне настало время вмешаться в его судьбу."
 ara_union_of_the_crowns: "Уния корон"
 ara_union_of_the_crowns_desc: "Короны Арагона и Кастилии объединены под одним королевским домом. Это заря нового царства — Испании. Осуществи собственными руками историческую унию, выкованную в эпоху Фердинанда и Изабеллы."
 ara_catalan_nobility: "Каталонская знать"
 ara_catalan_nobility_desc: "После восстания мы должны решить судьбу каталонской знати. Урезать их власть и укрепить королевскую власть, или искать сосуществования в реформированном порядке? Это решение определит стабильность Каталонии и будущее правления во всём царстве."
 ara_crowns_of_iberia: "Короны Иберии"
 ara_crowns_of_iberia_desc: "Арагон, Кастилия, Наварра, Гранада — все короны Иберийского полуострова собрались под одним королевским домом. Здесь заложена основа Испанской империи. Настало время провозгласить миру рождение новой империи."
 ara_pacify_sardinia: "Умиротвори Сардинию"
 ara_pacify_sardinia_desc: "Арагон долго притязал на владычество над Сардинией, но внутренние восстания и соперничающие державы терзали остров. Полное умиротворение этого богатого средиземноморского оплота — незаменимый шаг для дальнейшего расширения на восток."
 ara_consulate_of_the_sea: "Консулат моря"
 ara_consulate_of_the_sea_desc: "Морское торговое право, развитое вокруг Барселоны и Валенсии — Consolat de Mar — регулирует средиземноморскую торговлю. Используй престиж этого учреждения, дабы привести торговлю в западном Средиземноморье под нашу юрисдикцию."
 ara_dominate_genoa: "Овладей Генуей"
 ara_dominate_genoa_desc: "Генуя долго соперничала с Арагоном за верховенство в средиземноморской торговле. Если мы сможем занять Лигурию и саму Геную, торговля во всём западном Средиземноморье полностью попадёт в наши руки."
 ara_rule_italy: "Правь Италией"
 ara_rule_italy_desc: "Правление всей Италией — включая владение папы — несёт историческое значение, выходящее за пределы простого завоевания. Управляя землёй, в коей живёт наследие Рима, Арагон утверждает себя гегемоном Европы."
 ara_invade_occitania: "Вторгнись в Окситанию"
 ara_invade_occitania_desc: "Прованс, Лангедок, Гасконь — земли Южной Франции некогда попадали в арагонскую сферу влияния. Расширение нашей северной границы против Королевства Франция — существенная стратегическая задача для безопасности Иберийского полуострова."
 ara_humiliate_provence: "Унизь Прованс"
 ara_humiliate_provence_desc: "Граф Прованса долго притязал на законные наследственные права на Арагон и Неаполь равно. Мы должны положить конец этим самонадеянным притязаниям и привести Прованс под наш контроль, дабы сделать нашу гегемонию в западном Средиземноморье неоспоримой."
 ara_aragonese_navy: "Арагонский флот"
 ara_aragonese_navy_desc: "Владения Арагонской короны разбросаны по Средиземноморью. Защитить их все и сохранить морское владычество требует мощного флота. Построй арагонскую армаду и утверди руководство над этим внутренним морем."
 ara_seize_sicily: "Захвати Сицилию"
 ara_seize_sicily_desc: "С построенным арагонским флотом вторжение на остров Сицилия становится реальной перспективой. Сицилия, некогда освобождённая от французов через «Сицилийскую вечерню», видит в Арагоне своего собственного защитника. Обеспечь Палермо и сделай этот важный средиземноморский оплот навеки собственностью Арагона."
 ara_integrate_naples: "Включи Неаполь"
 ara_integrate_naples_desc: "Королевство Неаполь, завоёванное королём Альфонсо V, остаётся одной из жемчужин арагонской короны. Полностью включив Южную Италию и портовый город Неаполь, наше царство обретает плацдарм для расширения в восточное Средиземноморье."
 ara_mediterranean_ambitions: "Средиземноморские честолюбия"
 ara_mediterranean_ambitions_desc: "Дабы наше имя звучало вплоть до восточного Средиземноморья, требуется больший флот и более мощная морская сила. Построй крупную галерную флотилию и подними наш флаг над всем Средиземноморьем. Опорный пункт на Балканах ныне в досягаемости."
 ara_combat_barbary_piracy: "Сражайся против берберийского пиратства"
 ara_combat_barbary_piracy_desc: "Мусульманские корсары, стоящие у северо-африканского побережья, — постоянная угроза арагонскому судоходству. Атаковать их базы и освободить невинных христиан из рабства безотлагательно и для веры, и для государственного интереса."
 ara_conquer_tunis: "Завоюй Тунис"
 ara_conquer_tunis_desc: "Тунис — не просто пиратский порт. Если мы оставим эту морскую силу, связанную с османами, необузданной, наша средиземноморская гегемония будет постоянно под угрозой. Завоюй Тунис и утверди полное владычество над Северной Африкой."
 ara_occupy_alexandria: "Займи Александрию"
 ara_occupy_alexandria_desc: "Александрия, ключ к восточному Средиземноморью, была некогда центром древнего мирового знания и остаётся узлом египетской и азиатской торговли. Если мы сможем занять этот город и монополизировать восточную торговлю, Арагон станет истинным средиземноморским гегемоном."
 ara_claims_on_athens: "Притязания на Афины"
 ara_claims_on_athens_desc: "Поскольку арагонские наёмники — Каталонская компания — некогда основали Афинское герцогство, Арагон держит исторические права на греческие земли. Займи Морею и Северную Грецию и обеспечь последний опорный пункт на пути в Константинополь."
 ara_mare_nostrum: "Mare Nostrum"
 ara_mare_nostrum_desc: "От Гибралтара до Мраморного моря Средиземноморье — наше внутреннее море. Никто не смеет плавать в этих водах без дозволения арагонского флота. Гегемония над западным Средиземноморьем утверждена — следующая цель — тот золотой город за его древними стенами."
 ara_taula_de_canvi: "Taula de Canvi"
 ara_taula_de_canvi_desc: "Taula de Canvi (Обменный стол), учреждённый в Барселоне в 1401 году, — один из старейших публичных банков Европы. Используя это учреждение, всё более утончённое по мере расширения торговли, мы можем поставить финансы царства на непоколебимую основу."
 ara_valencian_silk: "Валенсийский шёлк"
 ara_valencian_silk_desc: "Валенсия становится известна производителем тонкого шёлка. Через расширение Шёлковой биржи (Llotja de la Seda) и развитие шёлковой промышленности Валенсии мы можем взять верх даже над восточной конкуренцией."
 ara_guilds_of_barcelona: "Гильдии Барселоны"
 ara_guilds_of_barcelona_desc: "Ремесленные и купеческие гильдии Барселоны давно являются хребтом городской экономики. Обеспечив их верность и организовав подобные гильдии по всему царству, основа ремесла и торговли будет далее упрочена."
 ara_industrial_districts: "Промышленные кварталы"
 ara_industrial_districts_desc: "Стекло, вино, бумага и шёлк — Арагон — дом разнообразной палитры высококачественных товаров. Через организацию этих отраслей и расширение производства экономическая мощь царства резко возрастёт."
 ara_aragonese_renaissance: "Арагонское Возрождение"
 ara_aragonese_renaissance_desc: "Двор Альфонсо V стал центром культуры Возрождения в Неаполе, привлекая итальянских гуманистов со всего полуострова. Через распространение этого культурного расцвета по всему царству Арагон утвердит себя духовным и художественным сердцем Европы."
 ara_golden_century: "Золотой век"
 ara_golden_century_desc: "Объединив Иберию, овладев Средиземноморьем и увидев расцвет экономики и культуры, наше царство воистину вступает в свой Siglo de Oro — Золотой век. Его блеск будет обсуждаться поколениями."
 ara_city_of_the_worlds_desire: "Город мировой мечты"
 ara_city_of_the_worlds_desire_desc: "Константинополь — город мировой мечты. Его золотые стены удерживали многих завоевателей через века. Но ныне наш флот — владыка Средиземноморья — и наши армии — объединённые над Иберией — готовы наконец осадить этот город. Займи оба берега Босфора и осуществи древнюю мечту."
 ara_plus_ultra: "Plus Ultra"
 ara_plus_ultra_desc: "«Plus Ultra» — далее за пределы. Некогда говорили, что к западу от Геркулесовых столпов нет ничего. Но наши исследователи ныне знают, что за ними лежит обширное неведомое море. Настало время проплыть мимо столпов и отправиться к краям мира."
 ara_african_outposts: "Африканские форпосты"
 ara_african_outposts_desc: "Продвижение на юг вдоль западноафриканского побережья открывает новые пути, обходящие мусульманских посредников, дабы достичь золота и товаров напрямую. Сначала возведи форпосты на Канарских островах и вдоль марокканского побережья."
 ara_gold_coast_trade: "Торговля на Золотом берегу"
 ara_gold_coast_trade_desc: "Регион западноафриканского побережья, известный как Золотой берег, верен своему имени, богатый источник золота. Учредив здесь торговый пост, мы можем принести богатство Африки напрямую в царство, не завися от заморского сахарского пути."
 ara_discover_the_new_world: "Открой Новый Свет"
 ara_discover_the_new_world_desc: "Что лежит к западу от великого океана? Наши исследователи, веря в шарообразность Земли, убеждены, что существует западный путь в Азию. Снаряди исследовательский флот и выйди в неведомое море. Что ты найдёшь там, может быть новым миром, превосходящим всякое воображение."
 ara_caribbean_foothold: "Опорный пункт в Карибском море"
 ara_caribbean_foothold_desc: "Мы утвердили наш первый плацдарм в Новом Свете. Заселяй Эспаньолу и окружающие острова и сделай их отправной точкой для дальнейшего исследования континента. Отсюда открываются пути на юг, север и вглубь материка."
 ara_conquest_of_the_incas: "Завоевание инков"
 ara_conquest_of_the_incas_desc: "Глубоко в южноамериканском континенте лежит великая империя, говорят, полная золота и серебра — Империя Инков (Тауантинсуйу). Веди конкистадоров в андское высокогорье и сделай богатство этой империи своим собственным."
 ara_new_kingdom_of_aragon: "Новое Королевство Арагон"
 ara_new_kingdom_of_aragon_desc: "Колонии, кои мы возвели в Новом Свете, более не просто форпосты. Организуй их прямым владением арагонской короны — Новым Королевством Арагон — с учреждениями, соответствующими метрополии. Как суверен Америк, наш король будет вписан владыкой двух миров."
 ara_route_to_the_indies: "Путь в Индии"
 ara_route_to_the_indies_desc: "Португалия уже открыла морской путь в Индию вокруг южной оконечности Африки. Но мы не можем просто наблюдать со стороны. Открой маршрут вокруг света, как Магеллан, или достигни портов Индии прежде Португалии."
 ara_spice_trade_outposts: "Пряные торговые форпосты"
 ara_spice_trade_outposts_desc: "Гвоздика, мускатный орех и перец с Островов пряностей (Молуккских островов) обретают огромные цены в Европе. Если мы возведём там опорный пункт и монополизируем торговлю пряностями, казна царства будет обогащена навеки."
 ara_las_filipinas: "Las Filipinas"
 ara_las_filipinas_desc: "Архипелаг, достигнутый Магелланом — Филиппины (Filipinas). Через завоевание и колонизацию этих стратегически расположенных островов рождается новый узел в центре тихоокеанской торговли. Как центр серебряного торгового пути, связующего Китай и Америки, эта территория несёт бесценную стоимость."
 ara_empire_of_the_three_oceans: "Империя трёх океанов"
 ara_empire_of_the_three_oceans_desc: "Атлантический, Индийский, Тихий океан — империя, кая поднимает свой флаг над тремя великими океанами, возникла. Скипетр Арагона ныне простирается не только на дворы Европы, но и в джунгли Африки, высокогорья Нового Света и Островов пряностей Азии. Мы достигли деяния, коего не достигла ни одна нация в истории."
 STATIC_MODIFIER_NAME_ara_kingdom_of_majorca_mod: "Флот Балеар"
 STATIC_MODIFIER_DESC_ara_kingdom_of_majorca_mod: "Обеспечив наш опорный пункт в западном Средиземноморье, досягаемость наших кораблей и охват наших купцов выросли."
 STATIC_MODIFIER_NAME_ara_reconquest_of_granada_mod: "Слава крестового похода"
 STATIC_MODIFIER_DESC_ara_reconquest_of_granada_mod: "Завершение Реконкисты повысило нашу терпимость к еретикам и легитимность короны."
 STATIC_MODIFIER_NAME_ara_vassalize_navarre_mod: "Равновесие Пиренеев"
 STATIC_MODIFIER_DESC_ara_vassalize_navarre_mod: "Включение Наварры в нашу сферу повысило дипломатический вес царства."
 STATIC_MODIFIER_NAME_ara_intervene_in_castile_mod: "Кастильский экспедиционный корпус"
 STATIC_MODIFIER_DESC_ara_intervene_in_castile_mod: "После вмешательства в Кастилию королевская армия гордится высокой сухопутной моралью."
 STATIC_MODIFIER_NAME_ara_union_of_the_crowns_mod: "Слава Католических королей"
 STATIC_MODIFIER_DESC_ara_union_of_the_crowns_mod: "Брак Фердинанда II и Изабеллы I в 1469 году связал два великих царства Арагон и Кастилию в династической унии. Правление этих двоих, названных «Католическими королями», стало основой объединённого испанского государства и вскоре последовало завоеванием Гранады и путешествиями Колумба."
 STATIC_MODIFIER_NAME_ara_catalan_nobility_mod: "Приговор Justicia"
 STATIC_MODIFIER_DESC_ara_catalan_nobility_mod: "Учреждение Justicia de Aragón позволяет недовольству дворянского сословия убывать быстрее."
 STATIC_MODIFIER_NAME_ara_crowns_of_iberia_mod: "Военная готовность Испании"
 STATIC_MODIFIER_DESC_ara_crowns_of_iberia_mod: "Через объединение Арагонской короны с Кастилией и Португалией весь Иберийский полуостров попадает под единого монарха. Осуществление мечты о единой «Испании», лелеемой со времён Римской империи, есть предприятие всемирно-исторического масштаба."
 STATIC_MODIFIER_NAME_ara_pacify_sardinia_mod: "Сардинский гарнизон"
 STATIC_MODIFIER_DESC_ara_pacify_sardinia_mod: "Умиротворённый остров Сардиния умножил живую силу царства и облегчил бремя войны."
 STATIC_MODIFIER_NAME_ara_consulate_of_the_sea_mod: "Престиж морского права"
 STATIC_MODIFIER_DESC_ara_consulate_of_the_sea_mod: "Престиж нашего морского права повысил торговый доход царства и охват его купцов."
 STATIC_MODIFIER_NAME_ara_dominate_genoa_mod: "Лигурийский торговый дом"
 STATIC_MODIFIER_DESC_ara_dominate_genoa_mod: "Торговый дом Генуи повысил охват наших купцов в этой земле."
 STATIC_MODIFIER_NAME_ara_rule_italy_mod: "Гегемон полуострова"
 STATIC_MODIFIER_DESC_ara_rule_italy_mod: "Арагонская корона была глубоко вовлечена в Италию с завоеванием Неаполя Альфонсо V Великодушным (1442). Альфонсо сделал Неаполь своей резиденцией и правил великим покровителем Возрождения. Правление всей Италией стало бы окончательным исполнением честолюбия Альфонсо."
 STATIC_MODIFIER_NAME_ara_invade_occitania_mod: "Окситанский экспедиционный корпус"
 STATIC_MODIFIER_DESC_ara_invade_occitania_mod: "Пробившись через Южную Францию, королевская армия марширует быстрее и осаждает с большим мастерством."
 STATIC_MODIFIER_NAME_ara_humiliate_provence_mod: "Покорение Прованса"
 STATIC_MODIFIER_DESC_ara_humiliate_provence_mod: "Заняв верфи Прованса, производство морских товаров в царстве выросло."
 STATIC_MODIFIER_NAME_ara_aragonese_navy_mod: "Armada de Aragón"
 STATIC_MODIFIER_DESC_ara_aragonese_navy_mod: "Реорганизованный арагонский флот гордится высокой моралью и превосходной способностью к ремонту."
 STATIC_MODIFIER_NAME_ara_integrate_naples_mod: "Казна обеих Сицилий"
 STATIC_MODIFIER_DESC_ara_integrate_naples_mod: "Торговля с Неаполем процветает, и живая сила королевской армии выросла."
 STATIC_MODIFIER_NAME_ara_mediterranean_ambitions_mod: "Мощь галерной флотилии"
 STATIC_MODIFIER_DESC_ara_mediterranean_ambitions_mod: "Расширенный флот гордится высокой моралью и непревзойдённой дальностью."
 STATIC_MODIFIER_NAME_ara_combat_barbary_piracy_mod: "Антипиратская эскадра"
 STATIC_MODIFIER_DESC_ara_combat_barbary_piracy_mod: "Подавив корсаров, торговые суда царства плавают в дальнейшей безопасности, и дисциплина войска выросла."
 STATIC_MODIFIER_NAME_ara_conquer_tunis_mod: "Северо-африканский гарнизон"
 STATIC_MODIFIER_DESC_ara_conquer_tunis_mod: "Обеспечив руководство над Северной Африкой, наша рука в военных переговорах сильнее, и живая сила войска выросла."
 STATIC_MODIFIER_NAME_ara_occupy_alexandria_mod: "Монополия на восточную торговлю"
 STATIC_MODIFIER_DESC_ara_occupy_alexandria_mod: "Обеспечив узел восточной торговли, торговый доход царства и охват его купцов выросли как никогда прежде."
 STATIC_MODIFIER_NAME_ara_claims_on_athens_mod: "Наследие Каталонской компании"
 STATIC_MODIFIER_DESC_ara_claims_on_athens_mod: "Проведя походы в Греции, королевская армия марширует быстрее, и бремя войны давит на царство легче."
 STATIC_MODIFIER_NAME_ara_mare_nostrum_mod: "Верховное командование средиземноморским флотом"
 STATIC_MODIFIER_DESC_ara_mare_nostrum_mod: "Обеспечив всё Средиземноморье, наш флот гордится высокой моралью и несравненной оперативной и торговой дальностью."
 STATIC_MODIFIER_NAME_ara_taula_de_canvi_mod: "Кредит Обменного стола"
 STATIC_MODIFIER_DESC_ara_taula_de_canvi_mod: "«Taula de Canvi» (Обменный стол), основанный в Барселоне в 1401 году, считается одним из первых публичных банков мира. Управляемое купеческими гильдиями Барселоны, это финансовое учреждение вело кредиты, векселя и вклады и стало столпом, поддерживающим каталонскую торговлю."
 STATIC_MODIFIER_NAME_ara_valencian_silk_mod: "Llotja de la Seda"
 STATIC_MODIFIER_DESC_ara_valencian_silk_mod: "Валенсия была одним из ведущих центров производства шёлка средневекового Средиземноморья. Технологии шелководства, принесённые маврами, перешли к христианским ремесленникам, и валенсийский шёлк гордился репутацией, соперничающей с тонкими тканями Италии. Llotja de la Seda (Шёлковая биржа) — символ его процветания."
 STATIC_MODIFIER_NAME_ara_guilds_of_barcelona_mod: "Верность гильдий"
 STATIC_MODIFIER_DESC_ara_guilds_of_barcelona_mod: "Укреплённые узы с гильдиями Барселоны слегка повысили производственную эффективность этой земли."
 STATIC_MODIFIER_NAME_ara_industrial_districts_mod: "Возвышение мануфактуры"
 STATIC_MODIFIER_DESC_ara_industrial_districts_mod: "В Барселоне, Валенсии и Сарагосе развились промышленные кварталы, где сосредоточились мастерские шерсти, сукна, кожи и металлических изделий. Торговое процветание Арагонской короны поддерживалось производительностью этих городских отраслей, и их товары высоко ценились даже на рынках Италии."
 STATIC_MODIFIER_NAME_ara_aragonese_renaissance_mod: "Двор гуманистов"
 STATIC_MODIFIER_DESC_ara_aragonese_renaissance_mod: "Этот культурный расцвет повысил мастерство новых художников и темп новаторства."
 STATIC_MODIFIER_NAME_ara_golden_century_mod: "Процветание Siglo de Oro"
 STATIC_MODIFIER_DESC_ara_golden_century_mod: "Siglo de Oro (Золотой век) означает XVI и XVII века, когда Испания достигла вершины политических, военных и культурных достижений. «Дон Кихот» Сервантеса, придворная живопись Веласкеса, пьесы Лопе де Вега — объединённые короны Арагона и Кастилии правили на вершине европейской культуры."
 STATIC_MODIFIER_NAME_ara_city_of_the_worlds_desire_mod: "Владыка Босфора"
 STATIC_MODIFIER_DESC_ara_city_of_the_worlds_desire_mod: "Блеск империи, держащей Константинополь, повысил её престиж и легитимность и укрепил её руку в военных переговорах как никогда прежде."
 STATIC_MODIFIER_NAME_ara_plus_ultra_mod: "Жар странствий за пределы"
 STATIC_MODIFIER_DESC_ara_plus_ultra_mod: "Дух исследования за пределы расширил дальность наших колониальных флотов и флота."
 STATIC_MODIFIER_NAME_ara_african_outposts_mod: "Канарские опорные пункты"
 STATIC_MODIFIER_DESC_ara_african_outposts_mod: "Наши опорные пункты вдоль африканского побережья расширили дальность торговых судов царства."
 STATIC_MODIFIER_NAME_ara_gold_coast_trade_mod: "Сеть золотой торговли"
 STATIC_MODIFIER_DESC_ara_gold_coast_trade_mod: "Торговля с Золотым берегом повысила торговый доход царства и охват его купцов."
 STATIC_MODIFIER_NAME_ara_discover_the_new_world_mod: "Дух океанского флота"
 STATIC_MODIFIER_DESC_ara_discover_the_new_world_mod: "Открытие врат в Новый Свет ускорило поток эмигрантов в царстве."
 STATIC_MODIFIER_NAME_ara_caribbean_foothold_mod: "Поселения Эспаньолы"
 STATIC_MODIFIER_DESC_ara_caribbean_foothold_mod: "Наш опорный пункт в Новом Свете повысил его притягательность для поселенцев."
 STATIC_MODIFIER_NAME_ara_conquest_of_the_incas_mod: "Наследие конкистадоров"
 STATIC_MODIFIER_DESC_ara_conquest_of_the_incas_mod: "В 1532 году Франсиско Писарро захватил инкского императора Атауальпу и завоевал Империю Инков. Разграбление величайшей золотой цивилизации мира принесло Испании беспримерное богатство, и с открытием серебряных рудников Потоси огромные количества драгоценного металла потекли из Нового Света в Европу."
 STATIC_MODIFIER_NAME_ara_new_kingdom_of_aragon_mod: "Корона Америк"
 STATIC_MODIFIER_DESC_ara_new_kingdom_of_aragon_mod: "Строительство Нового Королевства Арагон — великое колониальное предприятие, дабы пересадить наследие Арагона в Новый Свет. Под системой энкомьенды, включающей коренной труд, серебро, золото, сахар и красители продолжают посылаться в метрополию."
 STATIC_MODIFIER_NAME_ara_route_to_the_indies_mod: "Компас мореходов"
 STATIC_MODIFIER_DESC_ara_route_to_the_indies_mod: "Открытие пути в Индии расширило оперативную дальность нашего флота."
 STATIC_MODIFIER_NAME_ara_spice_trade_outposts_mod: "Молуккский торговый дом"
 STATIC_MODIFIER_DESC_ara_spice_trade_outposts_mod: "Пряности, такие как перец, мускатный орех и гвоздика, стоили в средневековой Европе столько же, сколько золото. Пресечь этот торговый путь, монополизированный мусульманскими купцами и Венецией, и основать опорные пункты прямо у источника — есть источник имперского богатства."
 STATIC_MODIFIER_NAME_ara_las_filipinas_mod: "Тихоокеанская промежуточная станция"
 STATIC_MODIFIER_DESC_ara_las_filipinas_mod: "Филиппинский архипелаг был достигнут Магелланом (1521) и позже, с Манилой на Лусоне базой, стал центром «галеонной торговли». По этому пути, связующему Акапулько в Мексике и Манилу, серебро Нового Света непрестанно обменивалось на китайский шёлк и фарфор."
 STATIC_MODIFIER_NAME_ara_empire_of_the_three_oceans_mod: "Империя, над коей никогда не заходит солнце"
 STATIC_MODIFIER_DESC_ara_empire_of_the_three_oceans_mod: "Блеск империи, охватывающей три океана, повысил торговый доход царства и охват его купцов как никогда прежде."
 ara_events.1.t: "Восшествие Педро IV"
 ara_events.1.d: "В 1336 году Альфонсо IV скончался, и его сын Педро IV взошёл на престол Арагонской короны. В 1337 году царство представляет собой свободный союз земель Каталонии, Арагона, Валенсии и Балеарских островов. Контроль над Сардинией остаётся нестабильным, и отношения с соседней Кастилией несут постоянное напряжение. Торговые державы, правящие средиземноморскими торговыми путями, держат большое влияние, и корона должна править в согласии с привилегиями этих различных царств. Перед молодым королём Педро IV простирается долгий путь к объединённой Иберии и верховенству в Средиземноморье."
 ara_events.1.a: "Начинается новое правление"
 ara_events.2.t: "Включение Королевства Майорка"
 ara_events.2.d: "Королевство Майорка, некогда основанное Хайме II побочной ветвью арагонского королевского дома, долго остаётся в арагонской сфере влияния, несмотря на владения на Балеарах, в Руссильоне и Монпелье. Настало время его полного включения. Будет ли оно полностью аннексировано и сделано частью Арагона, или сохранено дружественным вассалом — в любом случае Майорка падёт под арагонскую корону."
 ara_events.2.a: "Полностью аннексировать Майорку"
 ara_events.2.b: "Сохранить Майорку дружественным вассалом"
 STATIC_MODIFIER_NAME_ara_seize_sicily_mod: "Слава занятия Сицилии"
 STATIC_MODIFIER_DESC_ara_seize_sicily_mod: "Сицилийцы, изгнавшие дом Анжу в «Сицилийской вечерне» 1282 года, приветствовали Педро III Арагонского своим новым королём. С тех пор Сицилия была важным владением арагонского королевского дома и продолжала служить стратегическим ключом, повелевающим центральным Средиземноморьем."
