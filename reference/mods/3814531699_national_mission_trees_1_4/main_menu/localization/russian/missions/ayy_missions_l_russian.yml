l_russian:
 ayy_ayyubid_mission_pack: "Новый Саладин и владыка Ближнего Востока"
 ayy_ayyubid_mission_pack_DESCRIPTION:0 "В 1337 году династия Айюбидов выживает малым государством в Северной Сирии. Верни славу Саладина (1138-1193), кой объединил Египет, Сирию и Месопотамию и изгнал крестоносцев из Иерусалима. Завоюй Египет, освободи Иерусалим, займи Багдад и стань хранителем Мекки и Медины, дабы править Новым Саладином."
 ayy_ayyubid_mission_pack_CRITERIA_DESCRIPTION:0 "Завоюй Египет, Левант, Месопотамию и Аравию и правь владыкой Ближнего Востока как страж суннитского ислама."
 ayy_ayyubid_mission_pack_BUTTON_TOOLTIP:0 "Правь Новым Саладином над Ближним Востоком."
 ayy_ayyubid_mission_pack_BUTTON_DETAILS:0 "От малого государства в Северной Сирии разгроми крестоносцев, верни Иерусалим и возведи великую ближневосточную империю!"
 ayy_rise_of_ayyubids: "Возвышение Айюбидов"
 ayy_rise_of_ayyubids_desc: "Династия Айюбидов, наследники Саладина, начинает своё восстановление от малого государства в Северной Сирии."
 ayy_secure_sinai: "Обеспечь Синай"
 ayy_secure_sinai_desc: "Обеспечь Синайский полуостров вратами между Египтом и Левантом."
 ayy_conquer_lower_egypt: "Завоевание Нижнего Египта"
 ayy_conquer_lower_egypt_desc: "Завоюй дельту Нила и Александрию, дабы занять богатое коренное сердце Египта."
 ayy_seize_cairo: "Займи Каир"
 ayy_seize_cairo_desc: "Займи Каир — город тысячи минаретов — столицей Айюбидов."
 ayy_upper_egypt: "Завоевание Верхнего Египта"
 ayy_upper_egypt_desc: "Завоюй Верхний Египет до порогов Асуана и заверши владычество над Нилом."
 ayy_nile_breadbasket: "Житница Нила"
 ayy_nile_breadbasket_desc: "Используй плодородные паводковые равнины Нила, дабы кормить империю."
 ayy_dev_cairo: "Построй имперскую столицу Каир"
 ayy_dev_cairo_desc: "Отстрой Каир крупнейшим городом исламского мира — имперской столицей Айюбидской империи."
 ayy_secure_levant: "Обеспечь Левант"
 ayy_secure_levant_desc: "Обеспечь Левант вокруг Дамаска и изгони крестоносцев."
 ayy_seize_aleppo: "Займи Алеппо"
 ayy_seize_aleppo_desc: "Займи Алеппо — венец Северной Сирии."
 ayy_reclaim_jerusalem: "Верни Иерусалим"
 ayy_reclaim_jerusalem_desc: "Верни Иерусалим у крестоносцев, как некогда сделал Саладин в 1187 году."
 ayy_coastal_levant: "Прибрежный Левант"
 ayy_coastal_levant_desc: "Займи средиземноморские прибрежные города Леванта, дабы овладеть морской торговлей."
 ayy_antioch: "Покори Антиохию"
 ayy_antioch_desc: "Покори древний великий город Антиохию, дабы расширить северное влияние."
 ayy_jazira: "Независимость от Ильханата"
 ayy_jazira_desc: "Регион Джазира между Тигром и Евфратом попал под монгольское влияние Ильханата. Приведи эту богатую землю под айюбидский или вассальный контроль и освободись от монгольского ига. Возвышение до герцогства повысит айюбидскую легитимность."
 ayy_kurdish_highlands: "Курдское высокогорье"
 ayy_kurdish_highlands_desc: "Включи курдские горные племена — собственный народ Саладина — в айюбидскую армию."
 ayy_iraq_arabi: "Завоевание Ирак аль-Араби"
 ayy_iraq_arabi_desc: "Завоюй Ирак аль-Араби, дабы овладеть месопотамским коренным сердцем."
 ayy_seize_baghdad: "Займи Багдад"
 ayy_seize_baghdad_desc: "Займи Багдад — город мира — и провозгласи айюбидское верховенство."
 ayy_mesopotamia_trade: "Месопотамская торговля"
 ayy_mesopotamia_trade_desc: "Овладей месопотамской торговой сетью вокруг Багдада."
 ayy_hejaz: "Продвижение в Хиджаз"
 ayy_hejaz_desc: "Продвинься в Хиджаз и приблизься к священным городам Мекке и Медине."
 ayy_holy_cities: "Хранитель Священных городов"
 ayy_holy_cities_desc: "Стань хранителем двух Священных городов — Мекки и Медины."
 ayy_north_yemen: "Северный Йемен"
 ayy_north_yemen_desc: "Завоюй Северный Йемен и обрети доступ к красноморской торговле."
 ayy_south_yemen: "Займи порт Аден"
 ayy_south_yemen_desc: "Займи порт Аден — врата в Аравийское море."
 ayy_arabian_trade: "Аравийская морская торговля"
 ayy_arabian_trade_desc: "Монополизируй аравийские торговые пути, связующие Индийский океан со Средиземноморьем."
 ayy_madrasa: "Возведи медресе"
 ayy_madrasa_desc: "Возведи медресе по всей империи, дабы возродить исламскую учёность."
 ayy_crusader_wars: "Священная война против крестоносцев"
 ayy_crusader_wars_desc: "Веди священную войну против крестоносцев, дабы выковать айюбидскую армию в элитных воинов."
 ayy_dev_damascus: "Процветание Дамаска"
 ayy_dev_damascus_desc: "Развей Дамаск — земной рай — айюбидской культурной столицей."
 ayy_spice_trade: "Торговля пряностями"
 ayy_spice_trade_desc: "Монополизируй торговлю пряностями от Индийского океана через Аден до европейских рынков."
 ayy_silk_road_control: "Овладей Шёлковым путём"
 ayy_silk_road_control_desc: "Овладей Шёлковым путём через Багдад, дабы овладеть сухопутной торговлей Восток-Запад."
 ayy_kurdish_cavalry: "Элита курдской конницы"
 ayy_kurdish_cavalry_desc: "Выкуй курдскую конницу в лучшую боевую силу Айюбидов."
 ayy_nile_fleet: "Флот Нила"
 ayy_nile_fleet_desc: "Построй флот на Ниле и Средиземноморье, дабы пресечь снабженческие линии крестоносцев."
 ayy_defeat_crusaders: "Разгроми крестоносцев"
 ayy_defeat_crusaders_desc: "Повтори уничтожение Саладином крестоносного войска при Хаттине."
 ayy_egypt_navy: "Египетская морская сила"
 ayy_egypt_navy_desc: "Построй мощную египетскую морскую силу, дабы овладеть Средиземным и Красным морем."
 ayy_sugar_egypt: "Сахар Египта"
 ayy_sugar_egypt_desc: "Монополизируй сахарное производство Египта — сладкое золото средневековой торговли."
 ayy_iraq_ajam: "Продвижение в Ирак аль-Аджам"
 ayy_iraq_ajam_desc: "Продвинься в Ирак аль-Аджам, дабы расширить айюбидское влияние в Персию."
 ayy_build_mosques: "Возведи мечети повсюду"
 ayy_build_mosques_desc: "Возведи мечети по всей империи, дабы объединить всех подданных под суннитским исламом."
 ayy_sultan_of_egypt_syria: "Султан Египта и Сирии"
 ayy_sultan_of_egypt_syria_desc: "Провозгласи себя султаном Египта, Сирии, Ирака и Хиджаза — владыкой Ближнего Востока."
 ayy_new_saladin: "Новый Саладин"
 ayy_new_saladin_desc: "Правь Новым Саладином — владыкой Ближнего Востока, наследником наследия Саладина."
 ayy_events.1.t: "Возвышение Айюбидов — клятва Саладина"
 ayy_events.1.d: "Во имя Бога — в 1337 году династия Айюбидов выживает малым государством, но дух Саладина течёт в её жилах. Память о битве при Хаттине (1187) и освобождении Иерусалима движет айюбидского султана. Завоюй Египет, освободи священный город, защити Мекку — стань Новым Саладином, владыкой Ближнего Востока."
 ayy_events.1.a: "На пути Бога — восстань, Айюбиды!"
 ayy_events.10.t: "Освобождение Иерусалима — священный город возвращается к исламу"
 ayy_events.10.d: "Аллаху акбар! — великое деяние Саладина 1187 года повторилось. Иерусалим вернулся в мусульманские руки. Купол Скалы и Священная мечеть вновь звучат исламской молитвой. Исламский мир ликует."
 ayy_events.10.a: "Слава Иерусалиму! Во имя Бога!"
 ayy_events.20.t: "Вступление в Багдад — к сердцу исламского мира"
 ayy_events.20.d: "Город мира, Багдад — айюбидские силы вошли в город, где некогда правили халифы Аббасиды. Люди восклицают: «Пришёл наследник Саладина!» Культура и учёность Багдада процветают под айюбидским покровительством."
 ayy_events.20.a: "Слава Багдаду! Слава славе ислама!"
 ayy_events.30.t: "Хранитель двух Священных городов — защити Мекку и Медину"
 ayy_events.30.d: "Мекка и Медина — священные места пророка Мухаммада — пришли под айюбидскую защиту. «Хадим аль-Харамайн аш-Шарифайн» — этот титул даётся айюбидскому султану и признан всем исламским миром."
 ayy_events.30.a: "Как хранитель двух Священных городов — во имя Бога!"
 ayy_events.60.t: "Султан Египта и Сирии — владыка Ближнего Востока"
 ayy_events.60.d: "Провозглашено при дворе в Каире — «Султан Египта, Сирии, Ирака и Хиджаза, владыка династии Айюбидов». Иерусалим, Багдад, Мекка и Каир все объединены под знаменем Айюбидов. Мечта со времён Саладина осуществлена."
 ayy_events.60.a: "Слава султану! Слава Айюбидам!"
 ayy_events.99.t: "Новый Саладин — вечный владыка Ближнего Востока"
 ayy_events.99.d: "«Салах ад-Дин Айюби — праведность веры, владыка Ближнего Востока» — этот титул вписан в историю. От Нила в Египте до Тигра в Месопотамии, от аравийской пустыни до анатолийских гор — все земли объединены под знаменем Айюбидов."
 ayy_events.99.a: "Слава Новому Саладину! Слава Айюбидской империи!"
 STATIC_MODIFIER_NAME_ayy_sinai_mod: "Синай"
 STATIC_MODIFIER_DESC_ayy_sinai_mod: "Синайский полуостров обеспечен, открывая врата между Египтом и Левантом."
 STATIC_MODIFIER_NAME_ayy_lower_egypt_mod: "Нижний Египет"
 STATIC_MODIFIER_DESC_ayy_lower_egypt_mod: "Дельта Нила и Александрия завоёваны — богатое коренное сердце Египта обеспечено."
 STATIC_MODIFIER_NAME_ayy_cairo_mod: "Каир"
 STATIC_MODIFIER_DESC_ayy_cairo_mod: "Каир — город тысячи минаретов — занят айюбидской столицей."
 STATIC_MODIFIER_NAME_ayy_upper_egypt_mod: "Верхний Египет"
 STATIC_MODIFIER_DESC_ayy_upper_egypt_mod: "Верхний Египет до Асуана завоёван, завершая владычество над Нилом."
 STATIC_MODIFIER_NAME_ayy_nile_mod: "Нил"
 STATIC_MODIFIER_DESC_ayy_nile_mod: "На чёрном иле, несомом наводнением Нила, крестьяне ждут сезона, когда пшеничные колосья заколышутся на ветру."
 STATIC_MODIFIER_NAME_ayy_cairo_great_mod: "Великий Каир"
 STATIC_MODIFIER_DESC_ayy_cairo_great_mod: "Каир становится крупнейшим городом исламского мира — имперской столицей."
 STATIC_MODIFIER_NAME_ayy_aleppo_mod: "Алеппо"
 STATIC_MODIFIER_DESC_ayy_aleppo_mod: "Алеппо — венец Северной Сирии — занят, дабы овладеть регионом."
 STATIC_MODIFIER_NAME_ayy_coastal_mod: "Прибрежный регион"
 STATIC_MODIFIER_DESC_ayy_coastal_mod: "Средиземноморские прибрежные города Леванта заняты, овладевая морской торговлей."
 STATIC_MODIFIER_NAME_ayy_antioch_mod: "Антиохия"
 STATIC_MODIFIER_DESC_ayy_antioch_mod: "Древний город Антиохия покорён, расширяя северное влияние."
 STATIC_MODIFIER_NAME_ayy_jazira_mod: "Независимость от Ильханата"
 STATIC_MODIFIER_DESC_ayy_jazira_mod: "Влияние Ильханата изгнано — айюбидское герцогство признано международным сообществом."
 STATIC_MODIFIER_NAME_ayy_kurdish_mod: "Курды"
 STATIC_MODIFIER_DESC_ayy_kurdish_mod: "Курдские горные племена — собственный народ Саладина — включены в айюбидскую армию."
 STATIC_MODIFIER_NAME_ayy_iraq_mod: "Ирак"
 STATIC_MODIFIER_DESC_ayy_iraq_mod: "Ирак аль-Араби завоёван, овладевая месопотамским коренным сердцем."
 STATIC_MODIFIER_NAME_ayy_mesopotamia_trade_mod: "Месопотамская торговля"
 STATIC_MODIFIER_DESC_ayy_mesopotamia_trade_mod: "Месопотамская торговая сеть вокруг Багдада овладена."
 STATIC_MODIFIER_NAME_ayy_hejaz_mod: "Хиджаз"
 STATIC_MODIFIER_DESC_ayy_hejaz_mod: "Вдоль песчаных путей Хиджаза паломнические караваны идут в Мекку и Медину под бдительными знамёнами Айюбидов."
 STATIC_MODIFIER_NAME_ayy_yemen_mod: "Йемен"
 STATIC_MODIFIER_DESC_ayy_yemen_mod: "Северный Йемен завоёван, обретая доступ к красноморской торговле."
 STATIC_MODIFIER_NAME_ayy_aden_mod: "Аден"
 STATIC_MODIFIER_DESC_ayy_aden_mod: "Порт Аден — врата в Аравийское море — попадает под айюбидский контроль."
 STATIC_MODIFIER_NAME_ayy_arabian_trade_mod: "Аравийская торговля"
 STATIC_MODIFIER_DESC_ayy_arabian_trade_mod: "Аравийские торговые пути, связующие Индийский океан со Средиземноморьем, монополизированы."
 STATIC_MODIFIER_NAME_ayy_madrasa_mod: "Медресе"
 STATIC_MODIFIER_DESC_ayy_madrasa_mod: "Медресе по всей империи возрождают исламскую учёность и правоведение."
 STATIC_MODIFIER_NAME_ayy_jihad_mod: "Джихад"
 STATIC_MODIFIER_DESC_ayy_jihad_mod: "Священная война против крестоносцев выковывает айюбидскую армию в элитных воинов."
 STATIC_MODIFIER_NAME_ayy_damascus_dev_mod: "Дамаск развит"
 STATIC_MODIFIER_DESC_ayy_damascus_dev_mod: "Дамаск развит важным торговым и культурным узлом."
 STATIC_MODIFIER_NAME_ayy_spice_mod: "Пряности"
 STATIC_MODIFIER_DESC_ayy_spice_mod: "Торговля пряностями от Индийского океана через Аден в Европу монополизирована."
 STATIC_MODIFIER_NAME_ayy_silk_mod: "Шёлк"
 STATIC_MODIFIER_DESC_ayy_silk_mod: "Шёлковый путь через Багдад овладен, доминируя над сухопутной торговлей Восток-Запад."
 STATIC_MODIFIER_NAME_ayy_cavalry_mod: "Конница"
 STATIC_MODIFIER_DESC_ayy_cavalry_mod: "Курдская конница — элита Саладина — выкована в лучшую силу Айюбидов."
 STATIC_MODIFIER_NAME_ayy_fleet_mod: "Флот"
 STATIC_MODIFIER_DESC_ayy_fleet_mod: "Флот на Ниле и Средиземноморье пресекает снабженческие линии крестоносцев."
 STATIC_MODIFIER_NAME_ayy_crusader_mod: "Крестоносцы"
 STATIC_MODIFIER_DESC_ayy_crusader_mod: "Уничтожение Саладином крестоносного войска при Хаттине повторено — престиж возрос резко."
 STATIC_MODIFIER_NAME_ayy_navy_mod: "Морская сила"
 STATIC_MODIFIER_DESC_ayy_navy_mod: "Мощная египетская морская сила господствует над Средиземным и Красным морем."
 STATIC_MODIFIER_NAME_ayy_sugar_mod: "Сахар"
 STATIC_MODIFIER_DESC_ayy_sugar_mod: "Сахарное производство Египта — сладкое золото средневековой торговли — монополизировано."
 STATIC_MODIFIER_NAME_ayy_iraq_ajam_mod: "Ирак Аджам"
 STATIC_MODIFIER_DESC_ayy_iraq_ajam_mod: "Кони айюбидских послов ныне вновь и вновь видны в горных городах Западной Персии."
 STATIC_MODIFIER_NAME_ayy_mosque_mod: "Мечеть"
 STATIC_MODIFIER_DESC_ayy_mosque_mod: "Мечети по всей империи объединяют всех подданных под суннитским исламом."
 STATIC_MODIFIER_NAME_ayy_sultan_mod: "Султан"
 STATIC_MODIFIER_DESC_ayy_sultan_mod: "Султан Египта, Сирии, Ирака и Хиджаза — владыка Ближнего Востока."
 STATIC_MODIFIER_NAME_ayy_saladin_mod: "Саладин"
 STATIC_MODIFIER_DESC_ayy_saladin_mod: "Новый Саладин правит — владыка Ближнего Востока, наследник наследия Саладина."
 STATIC_MODIFIER_NAME_ayy_rise_mod: "Возвышение Айюбидов"
 STATIC_MODIFIER_DESC_ayy_rise_mod: "С именем Саладина на устах воины племён собираются один за другим под знамёнами."
 ayy_mamluk_rivalry: "Противостояние с мамлюками"
 ayy_mamluk_rivalry_desc: "Мамлюкский султанат — первоначально тюркские рабы-солдаты, возвышенные Айюбидами, кои свергли династию в 1250 году — наши заклятые враги. Сдержи мамлюков и утверди притязание на Алеппо опорным пунктом для отвоевания Сирии."
 STATIC_MODIFIER_NAME_ayy_baghdad_city_mod: "Город халифа"
 STATIC_MODIFIER_DESC_ayy_baghdad_city_mod: "Багдад возрождён центром торговли и культуры исламской цивилизации."
 STATIC_MODIFIER_NAME_ayy_levant_control_mod: "Контроль над Левантом утверждён"
 STATIC_MODIFIER_DESC_ayy_levant_control_mod: "Административная структура в Леванте утверждена, улучшая эффективность включения и аннексии."
 STATIC_MODIFIER_NAME_ayy_holy_cities_mod: "Хранитель двух Священных городов"
 STATIC_MODIFIER_DESC_ayy_holy_cities_mod: "Прославленный хранителем Мекки и Медины, айюбидский двор привлекает учёных, юристов и обращённых со всего мира."
 STATIC_MODIFIER_NAME_ayy_jerusalem_mod: "Священная война за освобождение Иерусалима"
