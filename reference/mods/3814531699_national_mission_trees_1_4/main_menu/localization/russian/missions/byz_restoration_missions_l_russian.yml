l_russian:
 byz_restoration_mission_pack: "Восстановление Римской империи"
 byz_restoration_mission_pack_desc: "Верни Константинополь, вновь займи Анатолию и Балканы, объедини четыре патриархата, восторжествуй в Риме и восстанови величайшую протяжённость древней Римской империи."
 byz_restoration_mission_pack_BUTTON_TOOLTIP:0 "Восстанови земли Римской империи."
 byz_restoration_mission_pack_DESCRIPTION:0 "Спаси рушащуюся империю и восстанови её прежний блеск. Как наследник наследия Рима, вновь приведи древние земли Востока и Запада под императорское знамя."
 byz_restoration_mission_pack_BUTTON_DETAILS:0 "Отстрой Византийскую империю от края краха и верни в своё царство мир Средиземноморья, кой некогда правил Рим. Осуществи мечту Renovatio Imperii!"
 byz_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Верни как Византия древние римские земли и достигни Renovatio Imperii."
 byz_retake_anatolia_west: "Верни Западную Анатолию"
 byz_retake_anatolia_west_desc: "Верни Смирну, дабы восстановить имперскую власть в Западной Анатолии."
 byz_retake_anatolia_east: "Верни Восточную Анатолию"
 byz_retake_anatolia_east_desc: "Завоюй Анкару, Конью и Сивас, дабы привести всю Анатолию под имперский контроль. Управление живущими здесь народами греческой культуры потребует нового административного подхода."
 byz_secure_greece: "Восстанови Грецию"
 byz_secure_greece_desc: "Верни Афины и Коринф и возроди православие и греческую культуру в Элладе."
 byz_balkan_dominance: "Владычество над Балканами"
 byz_balkan_dominance_desc: "Завоюй Белград и Тырново, дабы восстановить имперский порядок по всем Балканам."
 byz_invasion_of_syria: "Вторжение в Сирию"
 byz_invasion_of_syria_desc: "Завоюй земли Сирии, включая Антиохию, один из пяти великих патриархатов. Древние торговые пути и богатые производящие центры принесут империи новое процветание."
 byz_protect_jerusalem: "Защита Иерусалима"
 byz_protect_jerusalem_desc: "Верни Святую землю, где страдал Христос. Римский император несёт долг стража святых мест. Утверди терпимое правление, дабы народы многих вер могли жить в мире на этой земле."
 byz_dominion_of_aegyptus: "Владычество над Египтом"
 byz_dominion_of_aegyptus_desc: "Обеспечь Александрию и Каир, великие седалища египетской учёности. Плодородные земли Нила будут кормить многие народы империи."
 byz_control_aegean: "Овладей Эгейским морем"
 byz_control_aegean_desc: "Обеспечь Крит и построй мощный флот, дабы удержать полное владычество над Эгейским морем."
 byz_retake_italy_south: "Верни Южную Италию"
 byz_retake_italy_south_desc: "Верни Неаполь и Сицилию, дабы утвердить опорный пункт на итальянском полуострове."
 byz_reclaim_rome: "Верни Вечный город"
 byz_reclaim_rome_desc: "Верни Вечный город Рим. Настало время, дабы законный наследник Римской империи вернул западную столицу."
 byz_iberian_conquest: "Завоюй Иберию"
 byz_iberian_conquest_desc: "Завоюй Толедо и Кордову, дабы восстановить империи древнюю провинцию Испания."
 byz_north_africa: "Верни Северную Африку"
 byz_north_africa_desc: "Завоюй Тунис, Триполи и Алжир, дабы восстановить империи древнюю провинцию Африка."
 byz_north_italy: "Северная Италия"
 byz_north_italy_desc: "Завоюй Венецию, Геную, Милан и Флоренцию, дабы объединить итальянский полуостров под римским именем."
 byz_invasion_of_france: "Вторжение во Францию"
 byz_invasion_of_france_desc: "С обеспеченными Северной Италией и Иберией взор империи обращается на Галлию. Завоюй весь регион Франция и заверши имперскую территорию на западе."
 byz_renovatio_imperii: "Renovatio Imperii"
 byz_renovatio_imperii_desc: "Восстановление империи. От Иберии до Галлии, от Северной Африки до Италии, от Малой Азии до Балкан и Святой земли. Требует 1000+ провинций и 2000+ ежемесячного дохода."
 byz_events.2.t: "Процветание Смирны"
 byz_events.2.d: "Смирна и порты Западной Анатолии возвращены. Эти древние торговые города вновь становятся владением византийских купцов, и торговля в Эгейском море оживает."
 byz_events.2.a: "Способствовать торговле в Смирне"
 byz_events.3.t: "Афины — восстановление Эллады"
 byz_events.3.d: "Афины и Коринф возвращены. Город Сократа и Платона, холм, на коем стоит Парфенон, вновь византийские. Православные монастыри отстраиваются, и греческая учёность оживает."
 byz_events.3.a: "Восстановить православие и греческую культуру в Элладе"
 byz_events.7.t: "Южная Италия возвращена"
 byz_events.7.d: "Неаполь и Палермо возвращены. Эти земли, некогда процветавшие Великой Грецией, вновь часть Римской империи. Богатство средиземноморской торговли течёт в имперскую казну."
 byz_events.7.a: "Включить Южную Италию в империю"
 byz_events.8.t: "Вечный город — вход в Рим"
 byz_events.8.d: "Рим — город семи холмов, место мученической смерти Петра и Павла — возвращён. Как некогда Константин Великий правил империей из этого места, так ныне вновь римский император восседает в Риме. История свершилась."
 byz_events.8.a: "Сделать Вечный город западной столицей"
 byz_events.10.t: "Renovatio Imperii"
 byz_events.10.d: "Восстановление Римской империи. От Иберии до Малой Азии, от Северной Африки до Балкан, от Италии до Святой земли. То, к чему стремился Юстиниан Великий с 527 по 565 год, о чём мечтали через всё Средневековье — восстановление Римской империи наконец стало явью. Средиземноморье вновь Mare Nostrum."
 byz_events.10.a: "Провозгласить миру Renovatio Imperii"
 byz_renovatio_unlock_tt: "Renovatio Imperii достигнуто."
 byz_reclaim_bursa: "Верни Бурсу"
 byz_reclaim_bursa_desc: "Верни Бурсу, некогда значительный византийский город. Расположенный в ключевой точке Шёлкового пути, будущее направление ремесла этого города оставлено на усмотрение империи."
 byz_avoid_collapse: "Отврати крах"
 byz_avoid_collapse_desc: "Империя шатается на грани краха. Но если легитимность и внутренняя стабильность могут быть сохранены, путь к восстановлению ещё не закрыт."
 byz_events.20.t: "Будущее Бурсы"
 byz_events.20.d: "В мастерских Бурсы ремесленники спорят о новом пути производства. Строить ли на давней традиции города в шелкоткачестве, или сосредоточиться на производстве более тонкой ткани? Решение империи сформирует будущее города."
 byz_events.20.a: "Способствовать производству шёлка"
 byz_events.20.b: "Сосредоточиться на производстве тонкой ткани"
 byz_events.21.t: "Будущее Никомедии"
 byz_events.21.d: "Никомедия, ключевой город на южном берегу Мраморного моря, возвращена империи. Двор спорит, какое ремесло определит будущее этого города: способствовать оружейному производству или посадить тутовые деревья и начать производство шёлка."
 byz_events.21.a: "Способствовать оружейному производству"
 byz_events.21.b: "Посадить тутовые деревья и начать производство шёлка"
 byz_reclaim_nicomedia: "Верни Никомедию"
 byz_reclaim_nicomedia_desc: "Никомедия (Измит) — ключевой город на южном берегу Мраморного моря. Обрати его производство сырья в шёлк и отстрой шёлковую экономику империи. Обеспечение 50%+ контроля отмечает первый шаг к восстановлению Римской империи."
 byz_orthodox_antioch: "Обрати Антиохию в православие"
 byz_orthodox_antioch_desc: "Подтверди, что большинство населения Антиохии обратилось в православие. Пусть город, где впервые прозвучало имя «христианин», вновь будет наполнен светом православия."
 byz_orthodox_jerusalem: "Обрати Иерусалим в православие"
 byz_orthodox_jerusalem_desc: "Подтверди, что большинство населения Иерусалима обратилось в православие. Колокола Храма Гроба Господня звонят православной литургией."
 byz_orthodox_alexandria: "Обрати Александрию в православие"
 byz_orthodox_alexandria_desc: "Подтверди, что большинство населения Александрии обратилось в православие. Традиции Коптской церкви включаются в православный поток."
 byz_orthodox_rome: "Конец Великого раскола"
 byz_orthodox_rome_desc: "Подтверди, что большинство населения Рима обратилось в православие. Раскол 1054 года заканчивается — не примирением, но торжеством православия над Римом."
 byz_hellenic_athens: "Возрождение Парфенона"
 byz_hellenic_athens_desc: "Афины — город Афины. Вновь на Акрополе приносятся жертвы олимпийским богам, и возрождение эллинской веры начинается здесь."
 byz_hellenic_corinth: "Святилище Посейдона в Коринфе"
 byz_hellenic_corinth_desc: "На Коринфском перешейке Посейдон — страж двух морей — некогда держал великий храм. Восстанови это святилище и привлеки благословение морского бога к империи."
 byz_hellenic_mystras: "Святилище Аполлона в Мистре"
 byz_hellenic_mystras_desc: "Мистра близ Спарты — духовное сердце Пелопоннеса. Восстанови здесь святилище Аполлона и пробуди смелый дух Спарты, несущий память об оракуле Дельф."
 byz_hellenic_alexandria: "Восстановление Серапеума"
 byz_hellenic_alexandria_desc: "Серапеум Александрии был некогда одним из величайших храмов античного мира. Посвящённый Серапису — рождённому от слияния греческой и египетской религии — его восстановление утверждает эллинскую религию в Египте и вновь объединяет мудрость античного мира."
 byz_events.11.t: "Антиохия — возвращение к первой церкви"
 byz_events.11.d: "Антиохия, где впервые прозвучало имя «христианин», ныне наполнена светом православия. Память о трудах Петра и Павла здесь возрождена, и город принимает новую миссию духовного центра православия."
 byz_events.11.a: "Поставить Антиохию под православную опеку"
 byz_events.12.t: "Иерусалим — православные колокола в Святом городе"
 byz_events.12.d: "Святой город Иерусалим, желанный всеми православными верующими, стал православным городом. Храм Гроба Господня вновь звонит восточной литургией. Это не просто завоевание — это торжество веры."
 byz_events.12.a: "Хранить Святую землю навеки"
 byz_events.13.t: "Александрия — православизация города учёности"
 byz_events.13.d: "Александрия, сокровищница древнего знания, стала православным городом. Древние традиции Коптской церкви сливаются с более широким православным потоком, и диалог между неоплатонической философией и богословием начинает вновь расцветать."
 byz_events.13.a: "Развить Александрию городом православной учёности"
 byz_events.14.t: "Конец Великого раскола — единство церквей"
 byz_events.14.d: "С 1054 года, когда папа Лев IX и патриарх Керуларий отлучили друг друга, прошли века. Не примирением, но православным завоеванием Рима — Великий раскол заканчивается. Большинство граждан Рима обратилось в православие. Вечный город становится западным столпом Восточной церкви. История избрала византийскую веру."
 byz_events.14.a: "Провозгласить миру конец Великого раскола"
 byz_events.15.t: "Парфенон — пробуждение Афины"
 byz_events.15.d: "Вновь на Акрополе приносятся жертвы Афине. Парфенон, ставший христианской церковью, восстановлен храмом древних богов. Народ Афин призывает олимпийских богов по имени, и пламя эллинизма разгорается вновь."
 byz_events.15.a: "Направить империю под защитой Афины"
 byz_events.16.t: "Коринф — Посейдон проливов"
 byz_events.16.d: "На холме Коринфа, взирающем на два моря, восстанавливается храм Посейдона. Бог перешейка долго защищал купцов и мореходов. С восстановлением его обрядов Коринф вновь становится духовным центром средиземноморской торговли."
 byz_events.16.a: "Позволить торговле процветать под благословением Посейдона"
 byz_events.17.t: "Делос — родина бога света"
 byz_events.17.d: "На священном эгейском острове Делос, почитаемом родиной Аполлона и Артемиды, отстраивается древний храм. Паломники и жрецы собираются со всего Эгейского моря, и дух античного греческого разума и красоты возрождается. Неоплатоническая империя, о коей мечтал Плифон, начинает обретать форму."
 byz_events.17.a: "Озарить империю блеском Делоса"
 byz_events.18.t: "Серапеум — завершение эллинского возрождения"
 byz_events.18.d: "Александрия — в этой земле, где некогда стоял Серапеум, вера в эллинских богов вернулась.\n\nС завершённым восстановлением храма боги Олимпа вновь нисходят на великую землю у Нила. Граждане Александрии вновь совершают древние обряды, и молитвы Серапису звучат сквозь утреннее небо.\n\nЭто священное возрождение посылает волны эллинской веры по всей Византийской империи — новые обращённые появляются один за другим, сила знамений растёт, и религиозное влияние возрастает. Зевс, Аполлон, Афина — все боги благословляют восстановление империи."
 byz_events.18.a: "Сделать Серапеум священным городом эллинского мира"
 byz_faith_choice: "Выбор веры"
 byz_faith_choice_desc: "Новая эпоха идей начинается. При дворе Мистры обсуждается неоплатоническое учение, тогда как в Константинополе власть православной церкви ставится под вопрос. Империя стоит на духовном перекрёстке."
 byz_faith_orthodox_chosen_tt: "Выбрано православие"
 byz_faith_hellenic_chosen_tt: "Выбран эллинизм"
 byz_events.19.t: "Перекрёсток веры — православие или эллинизм"
 byz_events.19.d: "Греция возвращена. С Акрополя Афин вдали виден Константинополь, и руины античных храмов дремлют на вершинах Пелопоннеса. Восстановление Византийской империи есть не просто возвращение территории — это отстройка души. Два голоса спорят при императорском дворе. Один принадлежит духовенству: «Мы народ Христа. Мы должны отстроить империю стражем православной церкви». Другой принадлежит эллинским философам: «Зачем чтить чужого бога на земле Платона и Аристотеля? Древние греческие боги — истинный дом наших душ»."
 byz_events.19.a: "Сохранить православную церковь — защитить восточную традицию"
 byz_events.19.a.tt: "Открыт православный ветвь веры. Продолжи к миссиям православизации Антиохии, Иерусалима, Александрии и Рима."
 byz_events.19.b: "Возродить древних богов — вновь разжечь эллинское пламя"
 byz_events.19.b.tt: "Открыт эллинский ветвь. Империя обращается в эллинизм, и становятся доступны миссии восстановления святилищ в Афинах, Коринфе, Мистре и Александрии."
 byz_orthodox_path_start: "Православный путь"
 byz_orthodox_path_start_desc: "Путь православного стража открыт. Продолжай возвращать и православизировать святые города."
 byz_hellenic_path_start: "Эллинский путь"
 byz_hellenic_path_start_desc: "Путь древних богов открыт. Восстанови святилища Эллады и отстрой заново древнюю греческую цивилизацию."
 byz_recovery_from_decline: "Возрождение от упадка"
 byz_recovery_from_decline_desc: "Обуздай власть придворной знати и восстанови власть короны. Пока имперская власть восстанавливается, стабильность в правлении последует."
 byz_city_the_world_desires: "Город мировой мечты"
 byz_city_the_world_desires_desc: "Константинополь вновь вырос в великий город, коего люди со всего мира жаждут увидеть. Пусть это процветание станет вечным."
 byz_islamic_heartland: "Сердце ислама"
 byz_islamic_heartland_desc: "Мекка и Медина, два святейших города ислама, пали в наши руки. Империя должна ныне принять судьбоносное решение о судьбе этих святых мест."
 byz_events.22.t: "Святые места ислама"
 byz_events.22.d: "Кааба Мекки и Мечеть Пророка Медины — святейшие места исламского мира — ныне под имперским контролем. Разрушить ли их, дабы показать верховенство православия, или принять их, дабы империя извлекала выгоду из богатства паломников?"
 byz_events.22.a: "Разрушить святые места"
 byz_events.22.b: "Принять святые места"
 STATIC_MODIFIER_NAME_byz_anatolia_west: "Западная Анатолия восстановлена"
 STATIC_MODIFIER_DESC_byz_anatolia_west: "Разнообразные народы Западной Анатолии постепенно включаются в культуру империи."
 STATIC_MODIFIER_NAME_byz_anatolia_east: "Восточная Анатолия"
 STATIC_MODIFIER_DESC_byz_anatolia_east: "Разнообразные народы Восточной Анатолии постепенно включаются в культуру империи."
 STATIC_MODIFIER_NAME_byz_greece_restored: "Эллада восстановлена"
 STATIC_MODIFIER_DESC_byz_greece_restored: "Афины, Салоники, Пелопоннес — коренное сердце античной греческой цивилизации и византийско-греческой культуры. Возвращение этих земель после латинского правления (франкского герцогства Афинского и других), разграбления Каталонской компанией и завоевания османами есть исполнение тысячелетней мечты возрождённого «эллинизма»."
 STATIC_MODIFIER_NAME_byz_balkan_order: "Балканский порядок"
 STATIC_MODIFIER_DESC_byz_balkan_order: "Живая сила и военная мощь Балкан усилены."
 STATIC_MODIFIER_NAME_byz_syria_province: "Провинция Сирия"
 STATIC_MODIFIER_DESC_byz_syria_province: "Сирия была со времён древности центром торговли и ремесла как западный конец Шёлкового пути. Дамасская сталь, алеппское мыло, сирийское стекло — эти прославленные товары вывозились по всему средиземноморскому миру. В IV-VII веках она также была богатейшей провинцией Византийской империи, приносящей огромные налоговые доходы."
 STATIC_MODIFIER_NAME_byz_judaea_province: "Провинция Иудея"
 STATIC_MODIFIER_DESC_byz_judaea_province: "Управление Иудеей, домом Святой земли, способствует большей терпимости к многим верам империи."
 STATIC_MODIFIER_NAME_byz_aegyptus_province: "Провинция Египет"
 STATIC_MODIFIER_DESC_byz_aegyptus_province: "Плодородные земли Нила позволяют империи содержать большее население во всех её провинциях."
 STATIC_MODIFIER_NAME_byz_aegean_mastery: "Овладение Эгейским морем"
 STATIC_MODIFIER_DESC_byz_aegean_mastery: "В портах Эгейских островов беспрестанно швартуются военные и торговые корабли империи, и море вновь стало «нашим морем»."
 STATIC_MODIFIER_NAME_byz_rome_restored: "Вечный город восстановлен"
 STATIC_MODIFIER_DESC_byz_rome_restored: "Когда знамя Византии вновь реяло над семью холмами, двор в Константинополе знал, что империя наконец достигла своей вершины."
 STATIC_MODIFIER_NAME_byz_hispania_province: "Провинция Испания"
 STATIC_MODIFIER_DESC_byz_hispania_province: "Обширные земли Испании посылают многих солдат, дабы умножить ряды имперской армии."
 STATIC_MODIFIER_NAME_byz_gallia_province: "Провинция Галлия"
 STATIC_MODIFIER_DESC_byz_gallia_province: "Римские орлы вновь летают над равнинами Галлии, и солдаты на берегах Луары маршируют с гордостью за императора, далёкого на востоке."
 STATIC_MODIFIER_NAME_byz_true_rome: "Истинный Рим"
 STATIC_MODIFIER_DESC_byz_true_rome: "Паруса и повозки купцов Венеции, Генуи и Милана ныне ведут свою торговлю под знаменем императора. Итальянский полуостров более не ветвь Рима, но его ствол."
 STATIC_MODIFIER_NAME_byz_renovatio_imperii_mod: "Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_imperii_mod: "Римская империя полностью восстановлена — дороги, о коих мечтал Юстиниан, вновь связуют каждый уголок империи, и гонцы императора скачут беспрепятственно к дальним берегам Средиземноморья."
 STATIC_MODIFIER_NAME_byz_collapse_averted: "Крах отвращён"
 STATIC_MODIFIER_DESC_byz_collapse_averted: "Империя ещё не пала. Пережив кризис, двор облегчает бремя лишения привилегий у могущественных и смягчает сопротивление таким реформам."
 STATIC_MODIFIER_NAME_byz_bursa_silk: "Шёлковая торговля Бурсы"
 STATIC_MODIFIER_DESC_byz_bursa_silk: "В тутовых рощах Бурсы звук прядущих шелкопрядов никогда не смолкает весенними ночами."
 STATIC_MODIFIER_NAME_byz_bursa_fine_cloth: "Торговля тонкой тканью Бурсы"
 STATIC_MODIFIER_DESC_byz_bursa_fine_cloth: "Из ткацких станков мастерских Бурсы выходят один за другим тонкие ткани, за кои соперничают придворные."
 STATIC_MODIFIER_NAME_byz_nicomedia_weaponry: "Оружейная торговля Никомедии"
 STATIC_MODIFIER_DESC_byz_nicomedia_weaponry: "В кузницах Никомедии звенят молоты день и ночь, и мечи и доспехи для имперской армии громоздятся высоко."
 STATIC_MODIFIER_NAME_byz_nicomedia_silk: "Шёлковая торговля Никомедии"
 STATIC_MODIFIER_DESC_byz_nicomedia_silk: "Молодые тутовые деревья посажены на холмах вокруг Никомедии, ожидая дня, когда город прославится домом шёлка."
 STATIC_MODIFIER_NAME_byz_hellenic_sanctuary: "Эллинское святилище"
 STATIC_MODIFIER_DESC_byz_hellenic_sanctuary: "Вновь в святилище древних богов приносятся жертвы, и стопы паломников изнашивают мостовые камни."
 STATIC_MODIFIER_NAME_byz_hellenic_serapeum: "Серапеум"
 STATIC_MODIFIER_DESC_byz_hellenic_serapeum: "С восстановлением Серапеума Александрия стала духовным центром античного мира, и учёные, и паломники собираются у её врат."
 STATIC_MODIFIER_NAME_byz_schism_ended: "Конец Великого раскола"
 STATIC_MODIFIER_DESC_byz_schism_ended: "Спустя века после взаимных отлучений 1054 года церкви Востока и Запада наконец собрались у единого алтаря через торжество православия."
 STATIC_MODIFIER_NAME_byz_islamic_sites_destroyed: "Святые места разрушены"
 STATIC_MODIFIER_DESC_byz_islamic_sites_destroyed: "Разрушение исламских святых мест мощно доказало верховенство православия и укрепило веру в государственную религию и престиж империи."
 STATIC_MODIFIER_NAME_byz_islamic_sites_accepted: "Святые места приняты"
 STATIC_MODIFIER_DESC_byz_islamic_sites_accepted: "Принятие исламских святых мест умножило терпимость к еретикам и язычникам, и торговая деятельность расцвела среди притока паломников."
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "Возрождение от упадка"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "Тёмное время упадка миновало, и утренний свет вновь сияет над двором императора и полями империи."
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "Город мировой мечты"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "Константинополь отстроен административным центром империи."
 STATIC_MODIFIER_NAME_byz_africa_province_mod: "Провинция Африка"
 STATIC_MODIFIER_DESC_byz_africa_province_mod: "Имперский флот вернулся в порт Карфагена, и мечта эпохи Юстиниана вновь вырисовывается на море."
 STATIC_MODIFIER_NAME_byz_renovatio_bonus_mod: "Слава Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_bonus_mod: "Восстановление Римской империи признало Византию владыкой мировой империи."
 STATIC_MODIFIER_NAME_byz_antioch_orthodox_mod: "Православие Антиохии"
 STATIC_MODIFIER_DESC_byz_antioch_orthodox_mod: "Антиохия восстановлена православной святыней, что повышает религиозную власть империи."
 STATIC_MODIFIER_NAME_byz_jerusalem_orthodox_mod: "Православие Иерусалима"
 STATIC_MODIFIER_DESC_byz_jerusalem_orthodox_mod: "Святой город Иерусалим православизирован, что даёт преимущества в борьбе против язычников."
 STATIC_MODIFIER_NAME_byz_alexandria_orthodox_mod: "Православие Александрии"
 STATIC_MODIFIER_DESC_byz_alexandria_orthodox_mod: "Православное пение звучит в церквях Александрии, и рынки переполнены семьями верующих."
 STATIC_MODIFIER_NAME_byz_serapeum_restored_mod: "Серапеум восстановлен"
 STATIC_MODIFIER_DESC_byz_serapeum_restored_mod: "Серапеум Александрии отстроен, и боги Олимпа вновь нисходят на землю Египта."
