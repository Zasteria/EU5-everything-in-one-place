l_russian:
 lbv_niederbayern_mission_pack: "Наследие Ландсхута — путь к объединению Баварии"
 lbv_niederbayern_mission_pack_DESCRIPTION:0 "Как дом Ландсхут, наследник владений Альбрехта I, простиравшихся до Нидерландов, объедини раздробленные земли Баварии вновь в единое целое."
 lbv_niederbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Развей Ландсхут и объедини Баварию."
 lbv_niederbayern_mission_pack_BUTTON_TOOLTIP:0 "Развей Ландсхут и объедини Баварию."
 lbv_niederbayern_mission_pack_BUTTON_DETAILS:0 "Возвысься как герцог всей Баварии!"
 lbv_straubing_holland_legacy: "Наследие Штраубинг-Голландии"
 lbv_straubing_holland_legacy_desc: "Наследие Альбрехта I, чьи владения простирались до Нидерландов — как дом Ландсхут, унаследуй память об этом обширном наследстве."
 lbv_secure_landshut: "Развей Ландсхут"
 lbv_secure_landshut_desc: "Ландсхут, вверх по течению Изара — развей этот город великолепной готической архитектуры как центр герцогства."
 lbv_danube_trade: "Дунайская торговля"
 lbv_danube_trade_desc: "Торговые суда, плавающие по Дунаю — воспользуйся этим жизненно важным водным путём и обеспечь богатство торговли."
 lbv_low_countries_ties: "Связи с Нидерландами"
 lbv_low_countries_ties_desc: "Наследие Альбрехта I, некогда правившего Голландией, Зеландией и Эно — взлелей наши связи с Нидерландами и поныне."
 lbv_bavarian_ambition: "Притязание на единую Баварию"
 lbv_bavarian_ambition_desc: "Развитие Ландсхута, дунайская торговля и связи с Нидерландами — построй на этом и взлелей притязание на всю Баварию."
 lbv_reunite_bavaria: "Воссоедини Баварию"
 lbv_reunite_bavaria_desc: "Раздробленное герцогство — верни земли Верхней Баварии и объедини Баварию вновь в единое целое."
 lbv_duke_of_all_bavaria: "Герцог всей Баварии"
 lbv_duke_of_all_bavaria_desc: "Под родословной дома Ландсхут вся Бавария наконец объединена под единым знаменем."
 lbv_events.1.t: "Провозглашение единства Баварии"
 lbv_events.1.d: "Под родословной дома Ландсхут Бавария наконец объединена в единое целое. Эпоха раздробленности подходит к концу."
 lbv_events.1.a: "Слава Баварии!"
 STATIC_MODIFIER_NAME_lbv_legacy_mod: "Наследие Штраубинг-Голландии"
 STATIC_MODIFIER_DESC_lbv_legacy_mod: "Слава Альбрехта I, чьи владения некогда охватывали Голландию и Эно, до сих пор с гордостью вспоминается при дворе Ландсхута."
 STATIC_MODIFIER_NAME_lbv_landshut_mod: "Ландсхут развит"
 STATIC_MODIFIER_DESC_lbv_landshut_mod: "Город готической архитектуры процветает как центр герцогства."
 STATIC_MODIFIER_NAME_lbv_danube_mod: "Дунайская торговля"
 STATIC_MODIFIER_DESC_lbv_danube_mod: "Баржи, плавающие по долине Дуная, беспрестанно разгружают соль и зерно вдоль берегов Нижней Баварии."
 STATIC_MODIFIER_NAME_lbv_low_countries_mod: "Связи с Нидерландами"
 STATIC_MODIFIER_DESC_lbv_low_countries_mod: "Послы и торговцы тканями из Нидерландов за северным морем радушно принимаются даже при дворе Ландсхута."
 STATIC_MODIFIER_NAME_lbv_reunite_mod: "Бавария воссоединена"
 STATIC_MODIFIER_DESC_lbv_reunite_mod: "Вассалы двух некогда разделённых ветвей ныне приносят присягу под единым знаменем."
 STATIC_MODIFIER_NAME_lbv_unify_bavaria_mod: "Герцог всей Баварии"
 STATIC_MODIFIER_DESC_lbv_unify_bavaria_mod: "Колокола баварских башен звонят, провозглашая конец раздробленности."
 lbv_unified_duchy: "Объединённое герцогство Бавария"
 lbv_unified_duchy_desc: "Эпоха раздробленности окончена — как единое герцогство Бавария, открой новую эру."
 lbv_bavaria_unified_tt: "Бавария объединена"
 lbv_landrecht: "Баварское земское право"
 lbv_landrecht_desc: "Единый закон для объединённого герцогства — введи баварский свод законов (Ландрехт) и укрепи основу правления."
 lbv_tyrol_ambition: "Притязания на Тироль"
 lbv_tyrol_ambition_desc: "Графство Тироль, укрытое в объятиях Альп — взлелей притязания на эту землю."
 lbv_swabian_expansion: "Экспансия в Швабию"
 lbv_swabian_expansion_desc: "Швабия, простирающаяся на юго-запад — укрепи наше влияние над этим краем."
 lbv_greater_bavaria: "Осуществи Великую Баварию"
 lbv_greater_bavaria_desc: "Свод законов, Тироль и Швабия — построй на этом и осуществи Великую Баварию."
 lbv_counter_reformation_leader: "Вождь Контрреформации"
 lbv_counter_reformation_leader_desc: "Воплоти дух Тридентского собора и встань во главе Контрреформации."
 lbv_electoral_dignity: "Курфюршеское достоинство"
 lbv_electoral_dignity_desc: "В 1623 году Максимилиан I наконец обретает ранг курфюрста — сделай эту честь вечной гордостью Баварии."
 lbv_austrian_rivalry: "Соперничество с Австрией"
 lbv_austrian_rivalry_desc: "Соперничество с домом Габсбургов за гегемонию в Империи — прими этот вызов от нашего великого соперника."
 lbv_war_of_austrian_succession: "Война за австрийское наследство"
 lbv_war_of_austrian_succession_desc: "Война за притязания Карла VII на императорский престол — воспользуйся этой войной за наследство, дабы поднять престиж Баварии."
 lbv_imperial_crown: "Императорская корона"
 lbv_imperial_crown_desc: "В 1742 году Карл VII, герцог Баварский, коронован Императором Священной Римской империи — первым не-Габсбургом, надевшим корону за много веков."
 lbv_enlightened_absolutism: "Просвещённый абсолютизм"
 lbv_enlightened_absolutism_desc: "Эпоха Просвещения, чтящая разум и учёность — привнеси это новое течение мысли в правление Баварии."
 lbv_napoleonic_alliance: "Вызов Франции"
 lbv_napoleonic_alliance_desc: "Европа, потрясённая революцией и честолюбием Наполеона — Бавария закрепляет притязание на трон этого могучего соседа и прокладывает собственный путь."
 lbv_kingdom_of_bavaria: "Провозглашение Королевства Бавария"
 lbv_kingdom_of_bavaria_desc: "В 1806 году курфюрст Максимилиан IV Иосиф провозглашает себя королём Баварии — долгая история дома Виттельсбахов достигает здесь новой вершины."
 lbv_events.3.t: "Императорская корона"
 lbv_events.3.d: "В 1742 году Карл VII, герцог Баварский, был коронован Императором Священной Римской империи во франкфуртском соборе. Прошли века с тех пор, как кто-либо, кроме Габсбурга, надевал императорскую корону."
 lbv_events.3.a: "Слава Его Императорскому Величеству!"
 lbv_events.99.t: "Провозглашение Королевства Бавария"
 lbv_events.99.d: "В 1806 году курфюрст Максимилиан IV Иосиф, под сенью Рейнского союза, провозгласил себя королём Баварии. Долгая история дома Виттельсбахов достигает здесь новой вершины."
 lbv_events.99.a: "Да здравствует Королевство Бавария!"
 STATIC_MODIFIER_NAME_lbv_unified_mod: "Объединённое герцогство Бавария"
 STATIC_MODIFIER_DESC_lbv_unified_mod: "Герцогству более не нужно делить свои дворы, доходы и воинов между соперничающими ветвями."
 STATIC_MODIFIER_NAME_lbv_greater_mod: "Великая Бавария осуществлена"
 STATIC_MODIFIER_DESC_lbv_greater_mod: "От предгорий Альп до холмов Швабии земли под герцогским знаменем расширяются с каждым проходящим сезоном."
 STATIC_MODIFIER_NAME_lbv_counter_reformation_mod: "Вождь Контрреформации"
 STATIC_MODIFIER_DESC_lbv_counter_reformation_mod: "В духе Тридентского собора иезуитские коллегии открываются одна за другой в городах герцогства."
 STATIC_MODIFIER_NAME_lbv_succession_war_mod: "Война за австрийское наследство"
 STATIC_MODIFIER_DESC_lbv_succession_war_mod: "Офицеры и солдаты, закалённые на полях сражений Войны за австрийское наследство, ныне составляют ядро герцогской армии."
 STATIC_MODIFIER_NAME_lbv_imperial_crown_mod: "Императорская корона"
 STATIC_MODIFIER_DESC_lbv_imperial_crown_mod: "Память о дне, когда герцог Баварский был коронован во франкфуртском соборе, с гордостью запечатлена в сердце каждого при дворе."
 STATIC_MODIFIER_NAME_lbv_enlightenment_mod: "Просвещённый абсолютизм"
 STATIC_MODIFIER_DESC_lbv_enlightenment_mod: "При дворе новые книги, прибывающие из Франции, распространяют идеалы Просвещения, а число школ растёт год от года."
 STATIC_MODIFIER_NAME_lbv_electoral_dignity_mod: "Курфюршеское достоинство"
 STATIC_MODIFIER_DESC_lbv_electoral_dignity_mod: "Когда герцог, облачённый в одеяния курфюрста, занимает своё место на имперских выборах, князья со вниманием внимают его словам."
 STATIC_MODIFIER_NAME_lbv_kingdom_mod: "Королевство Бавария"
 STATIC_MODIFIER_DESC_lbv_kingdom_mod: "Во дворце в Мюнхене гремят салюты, празднуя коронацию первого короля Баварии из дома Виттельсбахов."
