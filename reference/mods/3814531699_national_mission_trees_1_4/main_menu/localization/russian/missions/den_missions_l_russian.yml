l_russian:
 den_kalmar_union_mission_pack: "Слава Кальмарской унии"
 den_kalmar_union_mission_pack_DESCRIPTION:0 "В 1337 году Королевство Дания стоит на грани финансового краха и территориальной раздробленности. Вальдемар IV Аттердаг стремится вернуть престол и восстановить нацию. Верни Готланд, брось вызов Ганзейскому союзу, образуй Кальмарскую унию с Норвегией и Швецией, овладей Балтикой, завоюй Англию — и избери свою веру: католическую твёрдость, лютеранскую Реформацию или возрождение норманнских богов. Построй Скандинавскую империю."
 den_kalmar_union_mission_pack_CRITERIA_DESCRIPTION:0 "Как Дания, расширься во всех направлениях — на север, на восток, религиозно — и основай Скандинавскую империю."
 den_kalmar_union_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы построить Скандинавскую империю."
 den_kalmar_union_mission_pack_BUTTON_DETAILS:0 "От восстановления Вальдемара до золотого века Кальмарской унии — объедини Скандинавию!"
 den_restoration_of_denmark: "Восстановление Вальдемара"
 den_restoration_of_denmark_desc: "В 1340 году Вальдемар IV Аттердаг вернул престол раздробленной и распроданной по частям Дании — даже Ютландия была заложена Пруссии. Кусок за куском он вернул её. «Аттердаг» — «вновь настал день» — самое его прозвище воплощало его историческую миссию. Обеспечь Копенгаген и возвысь легитимность короны."
 den_secure_denmark: "Стабилизируй Данию"
 den_secure_denmark_desc: "Захват Роскилле, Орхуса и Мальмё воссоединяет датское сердце. Роскилле — традиционное место погребения датских королей и её духовная столица; Мальмё — ключевые врата к Балтике. С ними обеспеченными Дания может смотреть вовне."
 den_norway_union: "Личная уния с Норвегией"
 den_norway_union_desc: "Дания и Норвегия вступили в личную унию в 1380 году со смертью Хокона VI. Его дочь Маргрете I стала регентом Норвегии и заложила основы Кальмарской унии. Приведи Норвегию под датское знамя и сделай первый шаг к скандинавскому единству."
 den_sweden_union: "Личная уния со Швецией"
 den_sweden_union_desc: "Швеция была великим северным соперником Дании поколениями конфликта. Некоторые шведские дворяне ищут датской защиты. Будь то через дипломатию или завоевание, приведи Швецию под датский контроль — и Скандинавия становится досягаемой."
 den_integrate_holstein: "Включи Гольштейн"
 den_integrate_holstein_desc: "Гольштейн — германоязычное герцогство, чей герцог — датский король. Контроль над Гамбургом и Гольштейном обеспечивает южную границу и оказывает давление на Ганзейский союз. «Датский в Гольштейне, Гольштейн в Дании» — разреши эту двусмысленность раз и навсегда."
 den_kalmar_union: "Кальмарская уния"
 den_kalmar_union_desc: "Кальмарская уния 1397 года, задуманная Маргрете I, объединила три короны Дании, Норвегии и Швеции под одним королём. Каждая страна сохраняла свои законы и традиции, но координировала внешнюю и военную политику. Рождение Северной империи."
 den_unite_scandinavia: "Объедини Скандинавию"
 den_unite_scandinavia_desc: "С покорённой Швецией и включённым Гольштейном вся Скандинавия объединяется под датским знаменем. От Балтики до Норвежского моря одна династия правит всем. Это величайшее политическое достижение в истории Севера."
 den_integrate_norway: "Включи Норвегию"
 den_integrate_norway_desc: "Захвати Осло и Берген и полностью включи Норвегию частью датской империи. Берген был некогда первейшим северным узлом Ганзейского союза — ныне он становится вратами Дании к Северной Атлантике."
 den_integrate_sweden: "Включи Швецию"
 den_integrate_sweden_desc: "Полностью включи Швецию частью датской империи. Владение Стокгольмом и удержание Свеаланда делают Швецию неотделимой частью царства."
 den_develop_trondheim: "Развей Северную Норвегию"
 den_develop_trondheim_desc: "Тронхейм — историческая столица Норвегии и резиденция её архиепископа. Развитие северонорвежского побережья утверждает контроль над Северной Атлантикой и Норвежским морем."
 den_scandinavian_golden_age: "Скандинавский золотой век"
 den_scandinavian_golden_age_desc: "С включёнными Норвегией и Швецией и утверждённым абсолютизмом Скандинавия вступает в свой золотой век величайшей империи Северной Европы. Копенгаген процветает культурным и экономическим центром, связующим Балтику и Северное море."
 den_retake_gotland: "Верни Готланд"
 den_retake_gotland_desc: "Висбю на Готланде был некогда одним из величайших торговых городов Ганзейского союза — призом, оспариваемым Швецией, Ливонией и Тевтонским орденом. В 1361 году Вальдемар IV захватил Готланд силой. Взятие этого острова обеспечивает важнейший узел балтийской торговли."
 den_sound_toll: "Зундская пошлина"
 den_sound_toll_desc: "Дания сидит в узком проходе между Балтикой и Северным морем; каждый корабль должен пройти через пролив Эресунн и заплатить пошлину. Формализованная около 1429 года, эта пошлина стала хребтом датских королевских финансов. Построй флот и полностью контролируй пролив."
 den_humiliate_hansa: "Унизь Ганзу"
 den_humiliate_hansa_desc: "Ганзейский союз монополизировал балтийскую торговлю и угрожал Дании поколениями. Со времён унизительного Штральзундского мира 1370 года Дания ждала мести. Контролируй Любек или превзойди Союз экономически — и разбей ганзейскую гегемонию."
 den_reconquer_estonia: "Отвоюй Эстонию"
 den_reconquer_estonia_desc: "Таллин (Ревель) был основан датской крепостью в 1219 году Вальдемаром II — «Таани линн» (датский замок), как говорят, происхождение его имени. Проданный Тевтонскому ордену в 1346 году, возвращение этой земли восстанавливает датское влияние на восточном берегу Балтики."
 den_control_livonia: "Овладей Ливонией"
 den_control_livonia_desc: "Ливония (нынешние Латвия и Эстония) — стратегический приз, оспариваемый Тевтонским орденом, Польшей, Швецией и Русью. Захват Риги и Тарту помещает всё восточное балтийское побережье в датские руки."
 den_stralsund_treaty: "Захвати Штральзунд"
 den_stralsund_treaty_desc: "Штральзунд и Штеттин — главные города Померании на южном берегу Балтики. В 1370 году Дания была принуждена к унизительному договору здесь. Ныне Дания захватывает инициативу — контроль над этими городами утверждает господство над поморским побережьем."
 den_expand_the_toll: "Расширь пошлину"
 den_expand_the_toll_desc: "Расширь Зундскую пошлину, дабы охватить всю балтийскую торговую сеть. Покорив Померанию и сломив Ганзейский союз, Дания становится владыкой североевропейской торговли."
 den_master_of_the_baltic: "Владыка Балтики"
 den_master_of_the_baltic_desc: "Ганзейское поражение и ливонский контроль — Дания бесспорный владыка Балтики. Захват Кёнигсберга и Гданьска завершает окружение: ни одно торговое судно не может войти или выйти без датского дозволения."
 den_eliminate_novgorod: "Устрани Новгород"
 den_eliminate_novgorod_desc: "Новгородская республика — великое торговое государство на восточном конце балтийско-баренцевых торговых путей. Контроль над Новгородом и Псковом приводит весь торговый путь русской пушнины, янтаря и мёда под датское управление."
 den_rival_england: "Соперничай с Англией"
 den_rival_england_desc: "Датский король Вальдемар Победоносный некогда завоевал Англию (1016). Империя Северного моря Кнуда Великого была величайшей исторической славой Дании. Настало время вновь преследовать эту мечту. Объяви Англию соперником и оспаривай владычество над Северным морем."
 den_north_sea_fleet: "Флот Северного моря"
 den_north_sea_fleet_desc: "Дабы править Северным морем, нужен мощный флот. Расширь верфи Копенгагена и построй величайший флот в скандинавской истории. Настал день, когда датские корабли плавают от Исландии до Темзы."
 den_danish_scotland: "Дания в Шотландии"
 den_danish_scotland_desc: "Шотландия — вечный враг Англии и потенциальный союзник Дании. Захват Эдинбурга создаёт клещи вокруг Англии с севера и юга — воссоздавая эпоху, когда викинги правили берегами Шотландии."
 den_invade_england: "Вторгнись в Англию"
 den_invade_england_desc: "Датские и норвежские силы высадились в северной Англии. Йорк был некогда столицей норвежского королевства Йорвик — сердцем Денло. Захват Йорка возрождает славу Денло, обширных северных английских территорий, правимых датскими и норманнскими поселенцами в IX веке."
 den_conquer_england: "Завоюй Англию"
 den_conquer_england_desc: "Лондон и Эдинбург под датским контролем — впервые за тысячу лет со времён Кнуда Великого скандинавская династия правит Британскими островами. Империя Северного моря Дании, Норвегии, Швеции и Англии возрождена."
 den_religious_question: "Вопрос веры"
 den_religious_question_desc: "Какой должна быть вера Дании? Сохранить верность папе в Риме — принять реформаторское учение Лютера — или вернуться к древним богам предков? Этот выбор определит будущее Дании."
 den_catholic_denmark: "Католическая Дания"
 den_catholic_denmark_desc: "Королевство Дания сохраняет верность Римской католической церкви. Храня добрые отношения с папой, Дания стоит стражем северной католической цивилизации с дипломатическим преимуществом."
 den_crusade_north: "Крестовый поход Севера"
 den_crusade_north_desc: "Дания стоит северным щитом христианства, участвуя в священной войне против неверных наций. Возглавление крестовых походов против остающихся языческих территорий восточной Балтики закрепляет религиозную власть Дании."
 den_kingdom_of_god: "Царство Божие"
 den_kingdom_of_god_desc: "Глубокое доверие с папством и контроль над Гамбургом — Дания утвердила несокрушимое положение стража северной католической цивилизации. Признанный Римом, датский король вписан в историю «Крестоносцем Севера»."
 den_reformation: "Реформация"
 den_reformation_desc: "В 1517 году Мартин Лютер опубликовал свои девяносто пять тезисов, и волна религиозной реформы прокатилась по Европе. В 1536 году король Кристиан III провозгласил лютеранство государственной религией Дании. Предвосхити это историческое преображение и построй лютеранскую Данию."
 den_protestant_church: "Протестантская церковь"
 den_protestant_church_desc: "После обращения в лютеранство церковное имущество было передано датской короне, резко укрепив государственные финансы. Развей университеты, дабы обучать лютеранских богословов и укоренить протестантскую веру по всей Дании."
 den_protestant_league: "Протестантская лига"
 den_protestant_league_desc: "Лютеранские нации объединяются в лигу с центром в Дании. Подобно Шмалькальденскому союзу, Дания возглавляет протестантский мир Северной Европы поборником Реформации."
 den_norse_revival: "Возрождение норманнской веры"
 den_norse_revival_desc: "Боги эпохи викингов — Один, Тор, Фрейр — никогда воистину не уходили. Некоторые норманнские дворяне сопротивлялись христианизации и мечтают о возвращении к старым богам. Королевское покровительство этому движению зажигает невиданную религиозную революцию в Скандинавии."
 den_viking_tradition: "Традиция викингов"
 den_viking_tradition_desc: "Кровь древних скандинавов вновь горяча. Воинский дух предков — пересекать моря, входить во вражеские земли, разорять и завоёвывать — обитает в датской армии. Построй могучую сухопутную армию и флот; воссоздай славу эпохи викингов."
 den_asgard_kingdom: "Царство Асгарда"
 den_asgard_kingdom_desc: "Под благословением Одина Скандинавия возрождается царством древних богов. Вера, что храбрые воины, павшие в бою, принимаются в Вальхаллу, становится духовным столпом нации. Объедини всю Скандинавию и построй царство богов."
 den_strengthen_crown: "Укрепи корону"
 den_strengthen_crown_desc: "Королевство Дания исторически имело свою королевскую власть, ограниченную могущественной знатью. «Хандфестнинг» принуждал каждого короля даровать дворянские привилегии при восшествии. Медленно разорви эти цепи и укрепи датскую монархию."
 den_copenhagen_university: "Копенгагенский университет"
 den_copenhagen_university_desc: "Копенгагенский университет, основанный в 1479 году, — старейший университет Скандинавии. Его факультеты богословия, права, медицины и философии делают его центром датской культуры. Построй университет в Копенгагене и осуществи учёную столицу Севера."
 den_develop_copenhagen: "Развей Копенгаген"
 den_develop_copenhagen_desc: "Копенгаген — «купеческая гавань» — вырос ключевым узлом балтийской торговли. Возведи его до ранга города, преобразив его в великую королевскую столицу, коей заслуживает Дания."
 den_revoke_privileges: "Отмени привилегии"
 den_revoke_privileges_desc: "Упраздни дворянские привилегии, кои ограничивали датскую королевскую власть. Возвышение королевской власти и проведение правительственных реформ ставит Данию на путь централизованного абсолютизма."
 den_danish_navy: "Датский королевский флот"
 den_danish_navy_desc: "Развей верфи Копенгагена и основай датский королевский флот. Это постоянное военное учреждение, поддерживающее датскую гегемонию над Балтикой и Северным морем, становится столпом датской мощи."
 den_amber_trade: "Янтарная торговля"
 den_amber_trade_desc: "Балтийский янтарь — «Золото Севера» — ценился со времён древности. Расширь вывоз янтаря и самоцветов через балтийские торговые пути Дании и обеспечь богатый торговый доход."
 den_develop_aarhus: "Развей Орхус"
 den_develop_aarhus_desc: "Орхус — крупнейший город Ютландии и торговый центр западной Дании. Возведение его до ранга города делает его вторым городом Дании после Копенгагена."
 den_develop_malmo: "Развей Мальмё"
 den_develop_malmo_desc: "Мальмё, в южной Швеции (Сконе), стоит через пролив Эресунн от Копенгагена. Развитие этого города создаёт жизненно важную пару Копенгагену как узел датского контроля над Балтикой."
 den_absolutism: "Абсолютизм"
 den_absolutism_desc: "В 1660 году король Фредерик III созвал три сословия — дворянство, духовенство и простолюдинов — и заставил их провозгласить наследственную абсолютную монархию. Одно из самых драматичных политических преображений в скандинавской истории. Возвысь королевскую власть и легитимность, дабы предвосхитить этот исторический сдвиг."
 den_economic_powerhouse: "Северная торговая держава"
 den_economic_powerhouse_desc: "Зундская пошлина, североморская торговля, скандинавское земледелие — Дания с её разнообразными источниками дохода стала величайшей экономической державой Северной Европы. Поддерживай доход 300+ и множество торговых центров, дабы обеспечить экономическое господство."
 den_north_sea_dominion: "Владычество над Северным морем"
 den_north_sea_dominion_desc: "Скандинавия объединена, Балтика покорена, скандинавский золотой век достигнут — Дания царствует величайшей империей Северной Европы. С 80+ кораблями, 600+ ежемесячным доходом и 600+ провинциями заяви права на этот славный титул."
 den_scandinavian_empire: "Скандинавская империя"
 den_scandinavian_empire_desc: "От Балтики до Англии, от Готланда до Новгорода — Скандинавская империя завершена. Дания, восстановленная Вальдемаром IV, выросла в великую империю, господствующую над всей Северной Европой. 1000+ провинций, престиж 80+, доход 1000+ — захвати эту славу."
 den_events.10.t: "Норвежская личная уния"
 den_events.10.d: "Король Дании унаследовал престол Норвегии. Со времён эпохи викингов Дания и Норвегия были связаны под одним королевским домом. Богатые рыбные промыслы, древесина и врата в Северную Атлантику Норвегии резко расширяют датскую мощь. Король, держащий титул «Король двух царств», сделал исторический первый шаг к скандинавскому единству."
 den_events.10.a: "Норвегия и Дания едины навеки!"
 den_events.20.t: "Шведская личная уния"
 den_events.20.d: "Король Дании также обеспечил шведский престол. Некоторые шведские дворяне сопротивляются, но эта личная уния — решающий шаг к скандинавскому единству. Дипломатический гений королевы Маргрете осуществил это чудо — мечта об «Императоре Скандинавии» приближается к реальности."
 den_events.20.a: "К единству трёх королевств — вперёд!"
 den_events.30.t: "Кальмарская уния"
 den_events.30.d: "В Кальмаре в Швеции представители Дании, Норвегии и Швеции собрались и провозгласили унию под королём Эриком Померанским. Каждая страна сохраняет свои законы и традиции, но координирует внешнюю и военную политику. «Вальдемар мечтал об этом; Маргрете сделала это реальностью» — так позже напишут историки."
 den_events.30.a: "Да здравствует Кальмарская уния! Скандинавия едина!"
 den_events.40.t: "Перекрёсток веры"
 den_events.40.d: "Ожесточённый религиозный спор разгорелся при датском дворе. Продолжить традиционную верность папе в Риме — принять новое учение Мартина Лютера — или вернуться к древним богам предков? Этот выбор поражает самые основы датского государства."
 den_events.40.a: "Хранить верность Риму — католицизм есть вера Дании"
 den_events.40.a.tt: "Продвинуть католический путь. Делает условия миссии den_catholic_denmark легче для выполнения."
 den_events.40.b: "Принять учение Лютера — настала эпоха реформы"
 den_events.40.b.tt: "Продвинуть лютеранский путь. Делает условия миссии den_reformation легче для выполнения."
 den_events.40.c: "Вернуться к древним богам — искать благословения Одина"
 den_events.40.c.tt: "Продвинуть норманнский путь. Делает условия миссии den_norse_revival легче для выполнения."
 den_events.99.t: "Рождение Скандинавской империи"
 den_events.99.d: "Века спустя после того, как Вальдемар IV унаследовал разрушенную Данию — ныне, когда Дания выросла в великую империю, господствующую над всей Северной Европой. От Балтики до Северного моря, от новгородских степей до Британских островов, всё лежит в пределах царства датского императора. Историки позже напишут: «Аттердаг — вновь настал день — было истинным пророчеством»."
 den_events.99.a: "Да здравствует Император Скандинавской империи!"
 STATIC_MODIFIER_NAME_den_valdemar_legacy_mod: "Наследие Вальдемара"
 STATIC_MODIFIER_DESC_den_valdemar_legacy_mod: "«Аттердаг — вновь настал день». Восстановление Вальдемара IV заложило краеугольный камень возрождения Дании."
 STATIC_MODIFIER_NAME_den_holstein_integration_mod: "Гольштейн включён"
 STATIC_MODIFIER_DESC_den_holstein_integration_mod: "Герцогство Гольштейн полностью включено в Датскую империю. Южная граница стабилизирована, и южные торговые пути обеспечены."
 STATIC_MODIFIER_NAME_den_scandinavia_united_mod: "Скандинавия объединена"
 STATIC_MODIFIER_DESC_den_scandinavia_united_mod: "Три королевства объединены под единым знаменем. Рождение величайшего государства Северной Европы."
 STATIC_MODIFIER_NAME_den_norway_integration_mod: "Норвегия включена"
 STATIC_MODIFIER_DESC_den_norway_integration_mod: "Норвегия включена частью Датской империи. Врата в Северную Атлантику открыты."
 STATIC_MODIFIER_NAME_den_sweden_integration_mod: "Швеция включена"
 STATIC_MODIFIER_DESC_den_sweden_integration_mod: "Имя датского короля зачитывается в палатах Стокгольма, и шведские лорды тоже занимают места за одним столом членами империи."
 STATIC_MODIFIER_NAME_den_visby_trade_mod: "Торговый узел Висбю"
 STATIC_MODIFIER_DESC_den_visby_trade_mod: "Висбю на Готланде возрождён датским торговым узлом. Прежний ганзейский город вновь процветает."
 STATIC_MODIFIER_NAME_den_sound_toll_mod: "Зундская пошлина"
 STATIC_MODIFIER_DESC_den_sound_toll_mod: "Система сбора пошлины учреждена. Каждое торговое судно, входящее или покидающее Балтику, платит Дании."
 STATIC_MODIFIER_NAME_den_hansa_dominance_mod: "Ганзейское поражение"
 STATIC_MODIFIER_DESC_den_hansa_dominance_mod: "Дания разбила ганзейскую гегемонию и захватила контроль над балтийской торговлей."
 STATIC_MODIFIER_NAME_den_estonia_mod: "Эстония отвоёвана"
 STATIC_MODIFIER_DESC_den_estonia_mod: "Таллин (датский замок) вернулся к Дании. Датское влияние на восточном берегу Балтики восстановлено."
 STATIC_MODIFIER_NAME_den_livonia_mod: "Ливония покорена"
 STATIC_MODIFIER_DESC_den_livonia_mod: "С обеспеченными Ригой и Тарту всё восточное балтийское побережье под датским управлением."
 STATIC_MODIFIER_NAME_den_pomeranian_coast_mod: "Поморское побережье"
 STATIC_MODIFIER_DESC_den_pomeranian_coast_mod: "Захват Штральзунда и Штеттина помещает всё поморское побережье под датский контроль."
 STATIC_MODIFIER_NAME_den_sound_toll_extended_mod: "Расширенная пошлина"
 STATIC_MODIFIER_DESC_den_sound_toll_extended_mod: "Каждый корабль, проходящий через Эресунн, в какой бы балтийский порт он ни направлялся, спускает паруса перед цепью датской таможни."
 STATIC_MODIFIER_NAME_den_baltic_master_mod: "Владыка Балтики"
 STATIC_MODIFIER_DESC_den_baltic_master_mod: "Датский флот господствует над всей Балтикой. Каждый порт от Кёнигсберга до Гданьска отвечает Дании."
 STATIC_MODIFIER_NAME_den_eastern_routes_mod: "Восточные торговые пути"
 STATIC_MODIFIER_DESC_den_eastern_routes_mod: "Новгород завоёван — весь торговый путь русских товаров ныне под датским управлением."
 STATIC_MODIFIER_NAME_den_north_sea_fleet_mod: "Флот Северного моря"
 STATIC_MODIFIER_DESC_den_north_sea_fleet_mod: "Датский королевский флот контролирует Северное море. От Исландии до Темзы реет датское знамя."
 STATIC_MODIFIER_NAME_den_scotland_mod: "Дания в Шотландии"
 STATIC_MODIFIER_DESC_den_scotland_mod: "Эдинбург захвачен — Англия ныне может быть зажата с севера и юга."
 STATIC_MODIFIER_NAME_den_england_invasion_mod: "Вторжение в Англию"
 STATIC_MODIFIER_DESC_den_england_invasion_mod: "Датские силы, занимающие Йорк, возродили память о Денло."
 STATIC_MODIFIER_NAME_den_north_sea_empire_mod: "Империя Северного моря"
 STATIC_MODIFIER_DESC_den_north_sea_empire_mod: "Впервые за тысячу лет со времён Кнуда Великого скандинавская династия правит Британскими островами. Империя Северного моря возрождена."
 STATIC_MODIFIER_NAME_den_catholic_devotion_mod: "Католическая преданность"
 STATIC_MODIFIER_DESC_den_catholic_devotion_mod: "Дания сохраняет верность Римской церкви. Сотрудничество с папой даёт Дании дипломатическое преимущество."
 STATIC_MODIFIER_NAME_den_northern_crusader_mod: "Северный крестоносец"
 STATIC_MODIFIER_DESC_den_northern_crusader_mod: "Участие Дании в священной войне обретает известность стражем христианства."
 STATIC_MODIFIER_NAME_den_papal_champion_mod: "Поборник папы"
 STATIC_MODIFIER_DESC_den_papal_champion_mod: "Дания утвердила несокрушимое положение стража северной католической цивилизации."
 STATIC_MODIFIER_NAME_den_lutheran_reform_mod: "Лютеранская реформа"
 STATIC_MODIFIER_DESC_den_lutheran_reform_mod: "Золотые чаши и серебряные подсвечники конфискованных монастырей переплавлены на королевском монетном дворе в Копенгагене и отчеканены в новую монету."
 STATIC_MODIFIER_NAME_den_protestant_church_mod: "Протестантская церковь"
 STATIC_MODIFIER_DESC_den_protestant_church_mod: "Развитие университетов и подготовка лютеранского богословия укореняют протестантскую веру по всей Дании."
 STATIC_MODIFIER_NAME_den_protestant_league_mod: "Протестантская лига"
 STATIC_MODIFIER_DESC_den_protestant_league_mod: "Возглавляемый Данией лютеранский союз объединяет протестантский мир Северной Европы."
 STATIC_MODIFIER_NAME_den_norse_revival_mod: "Возрождение норманнской веры"
 STATIC_MODIFIER_DESC_den_norse_revival_mod: "Поклонение Одину, Тору и Фрейру восстановлено. Воинский дух предков обитает в датских армиях."
 STATIC_MODIFIER_NAME_den_viking_warriors_mod: "Воины-викинги"
 STATIC_MODIFIER_DESC_den_viking_warriors_mod: "Воинский дух эпохи викингов возрождён. Армии Дании непревзойдённы в пересечении морей и завоевании вражеских земель."
 STATIC_MODIFIER_NAME_den_asgard_kingdom_mod: "Царство Асгарда"
 STATIC_MODIFIER_DESC_den_asgard_kingdom_mod: "Под благословением Одина Скандинавия возрождается царством древних богов."
 STATIC_MODIFIER_NAME_den_royal_authority_mod: "Королевская власть"
 STATIC_MODIFIER_DESC_den_royal_authority_mod: "Более не стоит совет знати на пути воли короля, и его приказы достигают деревень каждого уголка земли напрямую."
 STATIC_MODIFIER_NAME_den_copenhagen_learning_mod: "Копенгагенский университет"
 STATIC_MODIFIER_DESC_den_copenhagen_learning_mod: "Старейший университет Скандинавии открыт в Копенгагене. Он процветает центром северной учёности и культуры."
 STATIC_MODIFIER_NAME_den_copenhagen_capital_mod: "Столица Копенгаген развита"
 STATIC_MODIFIER_DESC_den_copenhagen_capital_mod: "Новые каменные особняки поднимаются один за другим вдоль улиц Копенгагена, кой кипит, как подобает королевской столице."
 STATIC_MODIFIER_NAME_den_absolutism_mod: "Абсолютизм"
 STATIC_MODIFIER_DESC_den_absolutism_mod: "Абсолютная монархия утверждена в Дании — предвосхищая историческое преображение 1660 года, королевская власть полностью упрочена."
 STATIC_MODIFIER_NAME_den_danish_economy_mod: "Датская экономическая держава"
 STATIC_MODIFIER_DESC_den_danish_economy_mod: "Экономика Дании — построенная на Зундской пошлине, североморской торговле и скандинавском земледелии — величайшая в Северной Европе."
 STATIC_MODIFIER_NAME_den_crown_privileges_mod: "Привилегии короны"
 STATIC_MODIFIER_DESC_den_crown_privileges_mod: "Грамоты привилегий, кои дворяне хранили поколениями, повержены, и королевские писцы ныне управляют администрацией всего царства."
 STATIC_MODIFIER_NAME_den_royal_navy_mod: "Датский королевский флот"
 STATIC_MODIFIER_DESC_den_royal_navy_mod: "Датский королевский флот, с базой в Копенгагене, основан — постоянное военное учреждение, поддерживающее верховенство над Балтикой и Северным морем."
 STATIC_MODIFIER_NAME_den_amber_trade_mod: "Янтарная торговля"
 STATIC_MODIFIER_DESC_den_amber_trade_mod: "Вывоз балтийского янтаря расширен. «Золото Севера» обращается по всей Европе, обогащая Данию."
 STATIC_MODIFIER_NAME_den_aarhus_mod: "Орхус развит"
 STATIC_MODIFIER_DESC_den_aarhus_mod: "Крупнейший город Ютландии, Орхус, развит торговым узлом западной Дании."
 STATIC_MODIFIER_NAME_den_malmo_mod: "Мальмё развит"
 STATIC_MODIFIER_DESC_den_malmo_mod: "Мальмё на западном берегу пролива Эресунн вырос балтийским торговым узлом, парным Копенгагену."
 STATIC_MODIFIER_NAME_den_norway_north_mod: "Северная Норвегия развита"
 STATIC_MODIFIER_DESC_den_norway_north_mod: "Развитие северонорвежского побережья утверждает контроль над Северной Атлантикой и Норвежским морем."
 STATIC_MODIFIER_NAME_den_golden_age_mod: "Скандинавский золотой век"
 STATIC_MODIFIER_DESC_den_golden_age_mod: "С включёнными Норвегией и Швецией и утверждённым абсолютизмом Скандинавия вступает в свой золотой век величайшей империи Северной Европы."
 STATIC_MODIFIER_NAME_den_north_sea_dominion_mod: "Владычество над Северным морем"
 STATIC_MODIFIER_DESC_den_north_sea_dominion_mod: "Дания, контролирующая и Балтику, и Северное море, господствует над всей североевропейской торговлей."
 STATIC_MODIFIER_NAME_den_scandinavian_empire_final_mod: "Скандинавская империя"
 STATIC_MODIFIER_DESC_den_scandinavian_empire_final_mod: "Скандинавская империя, простирающаяся от Балтики до Северного моря, завершена. Возрождение Дании от восстановления Вальдемара достигло своей вершины."
 STATIC_MODIFIER_NAME_den_norway_union_bonus_mod: "Бонус норвежской унии"
 STATIC_MODIFIER_DESC_den_norway_union_bonus_mod: "Норвежская личная уния открыла путь к скандинавскому единству."
 STATIC_MODIFIER_NAME_den_sweden_union_bonus_mod: "Бонус шведской унии"
 STATIC_MODIFIER_DESC_den_sweden_union_bonus_mod: "Шведская личная уния приводит образование Кальмарской унии в поле зрения."
 STATIC_MODIFIER_NAME_den_kalmar_union_mod: "Кальмарская уния"
 STATIC_MODIFIER_DESC_den_kalmar_union_mod: "Дания, Норвегия и Швеция объединены под одним королём — величайшая политическая интеграция в истории Севера."
 STATIC_MODIFIER_NAME_den_faith_steadfast_mod: "Твёрд в вере"
 STATIC_MODIFIER_DESC_den_faith_steadfast_mod: "Непоколебимая католическая вера провозглашает власть короля народу звоном колоколов Роскилльского собора."
 STATIC_MODIFIER_NAME_den_reform_winds_mod: "Ветры реформы"
 STATIC_MODIFIER_DESC_den_reform_winds_mod: "Учение Лютера распространяется по Дании. Волна реформы меняет датское общество."
 STATIC_MODIFIER_NAME_den_old_gods_calling_mod: "Зов древних богов"
 STATIC_MODIFIER_DESC_den_old_gods_calling_mod: "Вера в Одина и Тора тайно возрождается. Благословение богов предков вдохновляет датские армии."
 den_finland_integration: "Включи Финляндию"
 den_finland_integration_desc: "Финляндия — обширное лесистое восточное царство шведского королевства. Або (Турку) — административный и религиозный центр Финляндии; Выборг охраняет карельскую границу; Улеаборг (Оулу) — самый северный город. Полный контроль над Финляндией утверждает восточную границу датской империи от северной Балтики до Полярного круга, позволяя колониальную политику по всей дикой местности."
 STATIC_MODIFIER_NAME_den_finland_mod: "Финское пограничье"
 STATIC_MODIFIER_DESC_den_finland_mod: "Обширные леса и водные пути Финляндии привлекают поселенцев. Переселенцы из Дании и Швеции осваивают эту пограничную землю, отодвигая восточные границы империи всё дальше."
