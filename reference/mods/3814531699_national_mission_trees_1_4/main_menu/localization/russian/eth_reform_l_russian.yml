l_russian:
 eth_mobile_court_reform_tooltip: "При каждом переносе столицы новое место столицы получает временное преимущество"
 eth_mobile_court_reform: "Кочующий лагерь (Кетема)"
 eth_mobile_court_reform_desc: "Без постоянной столицы — своеобразный стиль правления, при котором Император, его войско, двор и церковь непрестанно странствуют по стране — это облегчает бремя переноса столицы и приносит благословение всякой земле, которую посетит Император."
 STATIC_MODIFIER_NAME_eth_mobile_court_mod: "Благословение Императорского лагеря (Кетема)"
 STATIC_MODIFIER_DESC_eth_mobile_court_mod: "Двор Императора пребывал здесь, принеся этой земле приток людей и процветание (со временем угасает)."
