l_russian:
 bra_quality_doctrine_reform: "Доктрина элитного оружия"
 bra_quality_doctrine_reform_desc: "Военная доктрина, отдающая предпочтение малочисленной элитной армии — превосходные солдаты и умелое обращение с ополчением позволяют меньшей армии противостоять большей. Дорога в содержании, но не имеет равных по боевой мощи."
 bra_quantity_doctrine_reform: "Доктрина всеобщей мобилизации"
 bra_quantity_doctrine_reform_desc: "«Пруссия — не государство с армией, а армия с государством» — доктрина количества, а не качества, сокрушающая противника числом. Дёшева в содержании, хотя дисциплина и мораль несколько страдают."
 bra_advanced_quality_doctrine_reform: "Ауфтрагстактик"
 bra_advanced_quality_doctrine_reform_desc: "«Тактика поручений» — доктрина, доверяющая полевым командирам самостоятельные решения, позволяющая быстро действовать сообразно обстановке. Армия непревзойдённого мастерства в каждом роде войск, пехоте и артиллерии равно, устанавливает подавляющее превосходство через качество. Дорога в содержании и живой силе, но никакая армия не сравнится с её боевой мощью."
 bra_advanced_quantity_doctrine_reform: "Нация под ружьём"
 bra_advanced_quantity_doctrine_reform_desc: "Доктрина всеобщей национальной мобилизации, вооружающая всё население — дешёвое содержание, обильная живая сила и огромная протяжённость фронта сокрушают врага числом. Дисциплина и мораль остаются слабым местом."
 bra_german_empire_reform: "Имперская германская конституция"
 bra_german_empire_reform_desc: "Своеобразная германская структура правления — федерация государств, увенчанная Императором, сочетающая центральную власть с федеральной автономией. Повышает легитимность и престиж короны, даруя как господство в торговле, так и гибкость во внутреннем управлении."
