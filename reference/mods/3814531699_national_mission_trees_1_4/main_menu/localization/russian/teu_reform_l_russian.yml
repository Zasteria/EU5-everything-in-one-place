l_russian:
 teu_crusade_path_reform: "Дисциплина Крестоносного ордена"
 teu_crusade_path_reform_desc: "Обет дисциплины, налагаемый Великим магистром на всех рыцарей-монахов в начале Восточного крестового похода. Мародёрство обращается в орудие упорядоченного похода, и войско ведётся под знаменем священной войны."
 teu_northern_crusade_reform: "Железнокрестный режим грабежа"
 teu_northern_crusade_reform_desc: "Царство террора, воздвигнутое под сенью креста. Богатство безжалостно извлекается из завоёванных земель, а сопротивляющихся продают в рабство. Старые идеалы священной войны поблёкли; Орден уже не просто крестоносное братство, а военное государство, построенное на завоевании и эксплуатации."
 teu_northern_crusade_reform_loot_tt: "Наносит ущерб от разграбления занятым провинциям (со временем угасает)"
