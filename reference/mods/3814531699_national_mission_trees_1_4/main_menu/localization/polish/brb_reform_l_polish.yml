l_polish:
 brb_estates_balance_reform: "Równowaga szlachty i mieszczaństwa"
 brb_estates_balance_reform_desc: "Feudalna szlachta czy kupieckie mieszczaństwo — czyj głos brzmi głośniej, ten określa charakter rządów wielkiego księstwa. Im silniejszy wpływ szlachty, tym mocniejszy porządek feudalny i władza podatkowa; im silniejszy wpływ mieszczaństwa, tym mocniejszy dobrobyt handlowy."
