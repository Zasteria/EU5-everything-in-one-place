l_polish:
 ara_crown_mission_pack: "Droga Korony Aragońskiej"
 ara_crown_mission_pack_DESCRIPTION:0 "Korona Aragońska — jednocząca Katalonię, Aragonię i Walencję — stoi w centrum historii, rywalizując o jedność iberyjską i zwierzchność na Morzu Śródziemnym. Wyciągnij rękę do Kastylii i wykuj Hiszpanię, albo idź własną drogą samotnie, włącz Neapol i marsz na Konstantynopol. Droga należy do ciebie."
 ara_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Ukończ misje jako Korona Aragońska, by ustanowić jedność iberyjską i hegemonię śródziemnomorską."
 ara_crown_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by przejść drogą Korony Aragońskiej."
 ara_crown_mission_pack_BUTTON_DETAILS:0 "Połóż fundamenty Hiszpanii, zostań panem zachodniego Morza Śródziemnego i zajmij Konstantynopol!"
 ara_accession_of_pedro_iv: "Wstąpienie Piotra IV"
 ara_accession_of_pedro_iv_desc: "W 1336 roku, ze śmiercią Alfonsa IV, jego syn Piotr IV (Pere III Ceremonialny) wstąpił na tron Korony Aragońskiej. Uczony i głęboko oddany ceremoniałowi dworskiemu, ten młody król żywi twardą determinację, by wzmocnić władzę królewską i zjednoczyć królestwo. Wraz ze świtem nowych rządów ambicje Aragonii na Morzu Śródziemnym znów zaczynają się rozpalać."
 ara_kingdom_of_majorca: "Królestwo Majorki"
 ara_kingdom_of_majorca_desc: "Królestwo Majorki, niegdyś rządzone przez młodszą gałąź aragońskiego domu królewskiego, nadal istnieje jako samodzielna siła polityczna na Balearach. Całkowite włączenie tego terytorium będzie pierwszym krokiem ku większym ambicjom na zachodnim Morzu Śródziemnym."
 ara_reconquest_of_granada: "Rekonkwista Grenady"
 ara_reconquest_of_granada_desc: "Królestwo Grenady, ostatni bastion islamu na Półwyspie Iberyjskim, od dawna dręczyło chrześcijańskich królów swymi żyznymi ziemiami i wspaniałymi pałacami. Podbój tego królestwa oznacza zakończenie Rekonkwisty — koniec wielowiekowej konfrontacji."
 ara_vassalize_navarre: "Podporządkuj Nawarrę"
 ara_vassalize_navarre_desc: "Małe Królestwo Nawarry, zaklinowane między Francją a Kastylią, jest strategicznie ważną strefą buforową dla Aragonii. Zanim Francja zdoła je wchłonąć, musimy przywieść Nawarrę do sfery wpływów Aragonii."
 ara_intervene_in_castile: "Interweniuj w sprawy Kastylii"
 ara_intervene_in_castile_desc: "Dwór Kastylii, dzielący krew Trastámara z naszym własnym domem królewskim, od dawna rozdzierany był przez spory frakcyjne. Jak niegdyś infantowie Aragonii spierali się o wpływ na to wielkie królestwo, tak teraz nadszedł czas, by interweniować w jego losy."
 ara_union_of_the_crowns: "Unia koron"
 ara_union_of_the_crowns_desc: "Korony Aragonii i Kastylii zjednoczone pod jednym domem królewskim. To świt nowego królestwa — Hiszpanii. Urzeczywistnij własnymi rękami historyczną unię, wykutą w epoce Ferdynanda i Izabeli."
 ara_catalan_nobility: "Szlachta katalońska"
 ara_catalan_nobility_desc: "Po powstaniu musimy zdecydować o losie szlachty katalońskiej. Ograniczyć ich władzę i wzmocnić władzę królewską, czy szukać współistnienia w zreformowanym porządku? Ta decyzja określi stabilność Katalonii i przyszłość rządów w całym królestwie."
 ara_crowns_of_iberia: "Korony Iberii"
 ara_crowns_of_iberia_desc: "Aragonia, Kastylia, Nawarra, Grenada — wszystkie korony Półwyspu Iberyjskiego zebrały się pod jednym domem królewskim. Tu położona jest podstawa Imperium Hiszpańskiego. Nadszedł czas, by ogłosić światu narodziny nowego imperium."
 ara_pacify_sardinia: "Uspokój Sardynię"
 ara_pacify_sardinia_desc: "Aragonia od dawna zgłaszała roszczenia do panowania nad Sardynią, lecz wewnętrzne powstania i rywalizujące potęgi dręczyły wyspę. Całkowite uspokojenie tego bogatego śródziemnomorskiego bastionu jest niezastąpionym krokiem dla dalszej ekspansji na wschód."
 ara_consulate_of_the_sea: "Konsulat Morza"
 ara_consulate_of_the_sea_desc: "Morskie prawo handlowe, rozwinięte wokół Barcelony i Walencji — Consolat de Mar — reguluje handel śródziemnomorski. Wykorzystaj prestiż tej instytucji, by przywieść handel w zachodnim Morzu Śródziemnym pod naszą jurysdykcję."
 ara_dominate_genoa: "Opanuj Genuę"
 ara_dominate_genoa_desc: "Genua od dawna rywalizowała z Aragonią o zwierzchność w handlu śródziemnomorskim. Jeśli zdołamy zająć Ligurię i samą Genuę, handel w całym zachodnim Morzu Śródziemnym całkowicie wpadnie w nasze ręce."
 ara_rule_italy: "Rządź Włochami"
 ara_rule_italy_desc: "Rządzenie wszystkimi Włochami — w tym posiadłościami papieża — niesie znaczenie historyczne, wykraczające poza zwykły podbój. Zarządzając ziemią, w której żyje dziedzictwo Rzymu, Aragonia ustanawia się hegemonem Europy."
 ara_invade_occitania: "Najedź Oksytanię"
 ara_invade_occitania_desc: "Prowansja, Langwedocja, Gaskonia — ziemie Południowej Francji niegdyś wpadały w aragońską sferę wpływów. Rozszerzenie naszej północnej granicy przeciw Królestwu Francji jest istotnym zadaniem strategicznym dla bezpieczeństwa Półwyspu Iberyjskiego."
 ara_humiliate_provence: "Upokorz Prowansję"
 ara_humiliate_provence_desc: "Hrabia Prowansji od dawna zgłaszał prawowite roszczenia dziedziczne zarówno do Aragonii, jak i Neapolu. Musimy położyć kres tym zuchwałym roszczeniom i przywieść Prowansję pod naszą kontrolę, by uczynić naszą hegemonię w zachodnim Morzu Śródziemnym niekwestionowaną."
 ara_aragonese_navy: "Armada Aragonii"
 ara_aragonese_navy_desc: "Posiadłości Korony Aragońskiej są rozsiane po Morzu Śródziemnym. Obrona ich wszystkich i utrzymanie panowania morskiego wymaga potężnej floty. Zbuduj aragońską armadę i ustanów przywództwo nad tym morzem wewnętrznym."
 ara_seize_sicily: "Zdobądź Sycylię"
 ara_seize_sicily_desc: "Z zbudowaną aragońską flotą inwazja na wyspę Sycylię staje się realną perspektywą. Sycylia, niegdyś wyzwolona od Francuzów przez „Nieszpory Sycylijskie”, widzi w Aragonii swego własnego obrońcę. Zabezpiecz Palermo i uczyń ten ważny śródziemnomorski bastion na wieki własnością Aragonii."
 ara_integrate_naples: "Włącz Neapol"
 ara_integrate_naples_desc: "Królestwo Neapolu, podbite przez króla Alfonsa V, pozostaje jedną z pereł korony aragońskiej. Całkowicie włączywszy Południowe Włochy i miasto portowe Neapol, nasze królestwo zyskuje przyczółek do ekspansji na wschodnie Morze Śródziemne."
 ara_mediterranean_ambitions: "Ambicje śródziemnomorskie"
 ara_mediterranean_ambitions_desc: "Aby nasze imię rozbrzmiewało aż po wschodnie Morze Śródziemne, potrzebna jest większa flota i potężniejsza siła morska. Zbuduj dużą flotyllę galer i podnieś naszą flagę nad całym Morzem Śródziemnym. Przyczółek na Bałkanach jest teraz w zasięgu."
 ara_combat_barbary_piracy: "Zwalczaj piractwo berberyjskie"
 ara_combat_barbary_piracy_desc: "Korsarze muzułmańscy, stojący u wybrzeża północnoafrykańskiego, są stałym zagrożeniem dla żeglugi aragońskiej. Atakować ich bazy i uwalniać niewinnych chrześcijan z niewoli jest pilne zarówno dla wiary, jak i dla interesu państwa."
 ara_conquer_tunis: "Podbij Tunis"
 ara_conquer_tunis_desc: "Tunis to nie tylko port piracki. Jeśli pozostawimy tę siłę morską, związaną z Osmanami, nieujarzmioną, nasza hegemonia śródziemnomorska będzie stale zagrożona. Podbij Tunis i ustanów pełne panowanie nad Afryką Północną."
 ara_occupy_alexandria: "Zajmij Aleksandrię"
 ara_occupy_alexandria_desc: "Aleksandria, klucz do wschodniego Morza Śródziemnego, była niegdyś centrum starożytnej wiedzy świata i pozostaje węzłem handlu egipskiego i azjatyckiego. Jeśli zdołamy zająć to miasto i zmonopolizować handel wschodni, Aragonia stanie się prawdziwym hegemonem śródziemnomorskim."
 ara_claims_on_athens: "Roszczenia do Aten"
 ara_claims_on_athens_desc: "Ponieważ najemnicy aragońscy — Kompania Katalońska — niegdyś założyli Księstwo Aten, Aragonia posiada historyczne prawa do ziem greckich. Zajmij Morea i Północną Grecję i zabezpiecz ostatni przyczółek na drodze do Konstantynopola."
 ara_mare_nostrum: "Mare Nostrum"
 ara_mare_nostrum_desc: "Od Gibraltaru po Morze Marmara Morze Śródziemne jest naszym morzem wewnętrznym. Nikt nie ośmiela się żeglować po tych wodach bez pozwolenia floty aragońskiej. Hegemonia nad zachodnim Morzem Śródziemnym ustanowiona — następnym celem jest to złote miasto za jego starożytnymi murami."
 ara_taula_de_canvi: "Taula de Canvi"
 ara_taula_de_canvi_desc: "Taula de Canvi (Stół Wymiany), ustanowiony w Barcelonie w 1401 roku, jest jednym z najstarszych banków publicznych Europy. Wykorzystując tę instytucję, coraz wyrafinowańszą w miarę rozszerzania handlu, możemy postawić finanse królestwa na niewzruszonej podstawie."
 ara_valencian_silk: "Jedwab walencki"
 ara_valencian_silk_desc: "Walencja staje się znana jako producent cienkiego jedwabiu. Poprzez rozszerzenie Giełdy Jedwabiu (Llotja de la Seda) i rozwój przemysłu jedwabnego Walencji możemy nawet przewyższyć konkurencję wschodnią."
 ara_guilds_of_barcelona: "Gildie Barcelony"
 ara_guilds_of_barcelona_desc: "Gildie rzemieślnicze i kupieckie Barcelony od dawna są kręgosłupem gospodarki miejskiej. Zapewniając ich lojalność i organizując podobne gildie po całym królestwie, podstawa rzemiosła i handlu zostanie dalej umocniona."
 ara_industrial_districts: "Dzielnice przemysłowe"
 ara_industrial_districts_desc: "Szkło, wino, papier i jedwab — Aragonia jest domem zróżnicowanej palety wysokiej jakości towarów. Poprzez organizację tych przemysłów i rozszerzenie produkcji potęga gospodarcza królestwa gwałtownie wzrośnie."
 ara_aragonese_renaissance: "Renesans aragoński"
 ara_aragonese_renaissance_desc: "Dwór Alfonsa V stał się centrum kultury renesansowej w Neapolu, przyciągając włoskich humanistów z całego półwyspu. Poprzez rozprzestrzenienie tego rozkwitu kulturalnego po całym królestwie Aragonia ustanowi się duchowym i artystycznym sercem Europy."
 ara_golden_century: "Złoty Wiek"
 ara_golden_century_desc: "Zjednoczywszy Iberię, opanowawszy Morze Śródziemne i ujrzawszy rozkwit gospodarki i kultury, nasze królestwo prawdziwie wkracza w swój Siglo de Oro — Złoty Wiek. Jego blask będzie omawiany przez pokolenia."
 ara_city_of_the_worlds_desire: "Miasto pożądane przez świat"
 ara_city_of_the_worlds_desire_desc: "Konstantynopol — miasto pożądane przez świat. Jego złote mury powstrzymywały wielu zdobywców przez wieki. Lecz teraz nasza flota — pan Morza Śródziemnego — i nasze armie — zjednoczone nad Iberią — są gotowe wreszcie oblegać to miasto. Zajmij oba brzegi Bosforu i urzeczywistnij starożytne marzenie."
 ara_plus_ultra: "Plus Ultra"
 ara_plus_ultra_desc: "„Plus Ultra” — dalej poza granice. Niegdyś mówiono, że na zachód od Słupów Heraklesa nic nie ma. Lecz nasi odkrywcy teraz wiedzą, że za nimi leży rozległe nieznane morze. Nadszedł czas, by przepłynąć obok słupów i wyruszyć ku krańcom świata."
 ara_african_outposts: "Placówki afrykańskie"
 ara_african_outposts_desc: "Posuwanie się na południe wzdłuż zachodnioafrykańskiego wybrzeża otwiera nowe drogi, omijające muzułmańskich pośredników, by dotrzeć do złota i towarów bezpośrednio. Najpierw wznieś placówki na Wyspach Kanaryjskich i wzdłuż wybrzeża marokańskiego."
 ara_gold_coast_trade: "Handel na Złotym Wybrzeżu"
 ara_gold_coast_trade_desc: "Region wybrzeża zachodnioafrykańskiego, znany jako Złote Wybrzeże, jest wierny swej nazwie, bogatym źródłem złota. Ustanawiając tu placówkę handlową, możemy przynieść bogactwo Afryki bezpośrednio do królestwa, nie zależąc od zamorskiego szlaku saharyjskiego."
 ara_discover_the_new_world: "Odkryj Nowy Świat"
 ara_discover_the_new_world_desc: "Co leży na zachód od wielkiego oceanu? Nasi odkrywcy, wierząc w kulistość Ziemi, są przekonani, że istnieje zachodnia droga do Azji. Wyposaż flotę eksploracyjną i wypłyń w nieznane morze. To, co tam znajdziesz, może być nowym światem, przewyższającym wszelką wyobraźnię."
 ara_caribbean_foothold: "Przyczółek na Karaibach"
 ara_caribbean_foothold_desc: "Ustanowiliśmy nasz pierwszy przyczółek w Nowym Świecie. Zasiedlaj Hispaniolę i otaczające wyspy i uczyń je punktem wyjścia dla dalszej eksploracji kontynentu. Stąd otwierają się drogi na południe, północ i w głąb lądu."
 ara_conquest_of_the_incas: "Podbój Inków"
 ara_conquest_of_the_incas_desc: "Głęboko w kontynencie południowoamerykańskim leży wielkie imperium, jak mówią, pełne złota i srebra — Imperium Inków (Tawantinsuyu). Poprowadź konkwistadorów w andyjskie wyżyny i uczyń bogactwo tego imperium swoim własnym."
 ara_new_kingdom_of_aragon: "Nowe Królestwo Aragonii"
 ara_new_kingdom_of_aragon_desc: "Kolonie, które zbudowaliśmy w Nowym Świecie, nie są już zwykłymi placówkami. Zorganizuj je jako bezpośrednie posiadanie korony aragońskiej — Nowe Królestwo Aragonii — z instytucjami odpowiednimi metropolii. Jako suweren Ameryk nasz król zostanie wpisany panem dwóch światów."
 ara_route_to_the_indies: "Droga do Indii"
 ara_route_to_the_indies_desc: "Portugalia już otworzyła morski szlak do Indii wokół południowego krańca Afryki. Lecz my nie możemy tylko patrzeć z boku. Otwórz trasę dookoła świata, jak Magellan, lub dotrzyj do portów Indii przed Portugalią."
 ara_spice_trade_outposts: "Placówki handlu przyprawami"
 ara_spice_trade_outposts_desc: "Goździki, gałka muszkatołowa i pieprz z Wysp Korzennych (Moluków) osiągają ogromne ceny w Europie. Jeśli wzniesiemy tam przyczółek i zmonopolizujemy handel przyprawami, skarbiec królestwa będzie wzbogacony na wieki."
 ara_las_filipinas: "Las Filipinas"
 ara_las_filipinas_desc: "Archipelag, do którego dotarł Magellan — Filipiny (Filipinas). Poprzez podbój i kolonizację tych strategicznie położonych wysp rodzi się nowy węzeł w centrum handlu pacyficznego. Jako centrum srebrnego szlaku handlowego, łączącego Chiny i Ameryki, to terytorium niesie bezcenną wartość."
 ara_empire_of_the_three_oceans: "Imperium trzech oceanów"
 ara_empire_of_the_three_oceans_desc: "Atlantyk, Ocean Indyjski, Pacyfik — imperium, które podnosi swój sztandar nad trzema wielkimi oceanami, powstało. Berło Aragonii rozciąga się teraz nie tylko na dwory Europy, lecz także na dżungle Afryki, wyżyny Nowego Świata i Wyspy Korzenne Azji. Osiągnęliśmy czyn, którego żaden naród w historii nie osiągnął."
 STATIC_MODIFIER_NAME_ara_kingdom_of_majorca_mod: "Flota Balearów"
 STATIC_MODIFIER_DESC_ara_kingdom_of_majorca_mod: "Zabezpieczywszy nasz przyczółek na zachodnim Morzu Śródziemnym, zasięg naszych statków i zasięg naszych kupców wzrosły."
 STATIC_MODIFIER_NAME_ara_reconquest_of_granada_mod: "Chwała krucjaty"
 STATIC_MODIFIER_DESC_ara_reconquest_of_granada_mod: "Zakończenie Rekonkwisty podniosło naszą tolerancję dla heretyków i legitymizację korony."
 STATIC_MODIFIER_NAME_ara_vassalize_navarre_mod: "Równowaga Pirenejów"
 STATIC_MODIFIER_DESC_ara_vassalize_navarre_mod: "Włączenie Nawarry do naszej sfery podniosło wagę dyplomatyczną królestwa."
 STATIC_MODIFIER_NAME_ara_intervene_in_castile_mod: "Korpus ekspedycyjny kastylijski"
 STATIC_MODIFIER_DESC_ara_intervene_in_castile_mod: "Po interwencji w Kastylii armia królewska szczyci się wysokim morale lądowym."
 STATIC_MODIFIER_NAME_ara_union_of_the_crowns_mod: "Chwała Katolickich Monarchów"
 STATIC_MODIFIER_DESC_ara_union_of_the_crowns_mod: "Małżeństwo Ferdynanda II i Izabeli I w 1469 roku związało dwa wielkie królestwa Aragonię i Kastylię w unii dynastycznej. Rządy tych dwojga, nazwanych „Katolickimi Monarchami”, stały się podstawą zjednoczonego państwa hiszpańskiego i wkrótce nastąpiły po nich podbój Grenady i podróże Kolumba."
 STATIC_MODIFIER_NAME_ara_catalan_nobility_mod: "Wyrok Justicia"
 STATIC_MODIFIER_DESC_ara_catalan_nobility_mod: "Ustanowienie Justicia de Aragón pozwala niezadowoleniu stanu szlacheckiego opadać szybciej."
 STATIC_MODIFIER_NAME_ara_crowns_of_iberia_mod: "Gotowość wojskowa Hiszpanii"
 STATIC_MODIFIER_DESC_ara_crowns_of_iberia_mod: "Poprzez zjednoczenie Korony Aragońskiej z Kastylią i Portugalią cały Półwysep Iberyjski wchodzi pod jednego monarchę. Urzeczywistnienie marzenia o jednej „Hiszpanii”, pielęgnowanego od czasów Cesarstwa Rzymskiego, jest przedsięwzięciem o skali historii światowej."
 STATIC_MODIFIER_NAME_ara_pacify_sardinia_mod: "Garnizon sardyński"
 STATIC_MODIFIER_DESC_ara_pacify_sardinia_mod: "Uspokojona wyspa Sardynia pomnożyła siłę żywą królestwa i ulżyła ciężarowi wojny."
 STATIC_MODIFIER_NAME_ara_consulate_of_the_sea_mod: "Prestiż prawa morskiego"
 STATIC_MODIFIER_DESC_ara_consulate_of_the_sea_mod: "Prestiż naszego prawa morskiego podniósł dochód handlowy królestwa i zasięg jego kupców."
 STATIC_MODIFIER_NAME_ara_dominate_genoa_mod: "Dom handlowy Ligurii"
 STATIC_MODIFIER_DESC_ara_dominate_genoa_mod: "Dom handlowy Genui podniósł zasięg naszych kupców w tej ziemi."
 STATIC_MODIFIER_NAME_ara_rule_italy_mod: "Hegemon półwyspu"
 STATIC_MODIFIER_DESC_ara_rule_italy_mod: "Korona Aragońska była głęboko zaangażowana we Włochy od podboju Neapolu przez Alfonsa V Wspaniałomyślnego (1442). Alfons uczynił Neapol swą rezydencją i rządził jako wielki mecenas renesansu. Rządzenie całymi Włochami byłoby ostatecznym spełnieniem ambicji Alfonsa."
 STATIC_MODIFIER_NAME_ara_invade_occitania_mod: "Korpus ekspedycyjny oksytański"
 STATIC_MODIFIER_DESC_ara_invade_occitania_mod: "Przebiwszy się przez Południową Francję, armia królewska maszeruje szybciej i oblega z większym mistrzostwem."
 STATIC_MODIFIER_NAME_ara_humiliate_provence_mod: "Podporządkowanie Prowansji"
 STATIC_MODIFIER_DESC_ara_humiliate_provence_mod: "Zająwszy stocznie Prowansji, produkcja towarów morskich w królestwie wzrosła."
 STATIC_MODIFIER_NAME_ara_aragonese_navy_mod: "Armada de Aragón"
 STATIC_MODIFIER_DESC_ara_aragonese_navy_mod: "Zreorganizowana flota aragońska szczyci się wysokim morale i doskonałą zdolnością do napraw."
 STATIC_MODIFIER_NAME_ara_integrate_naples_mod: "Skarbiec Obu Sycylii"
 STATIC_MODIFIER_DESC_ara_integrate_naples_mod: "Handel z Neapolem prosperuje, a siła żywa armii królewskiej wzrosła."
 STATIC_MODIFIER_NAME_ara_mediterranean_ambitions_mod: "Potęga flotylli galer"
 STATIC_MODIFIER_DESC_ara_mediterranean_ambitions_mod: "Rozbudowana flota szczyci się wysokim morale i niezrównanym zasięgiem."
 STATIC_MODIFIER_NAME_ara_combat_barbary_piracy_mod: "Eskadra antypiracka"
 STATIC_MODIFIER_DESC_ara_combat_barbary_piracy_mod: "Stłumiwszy korsarzy, statki handlowe królestwa pływają w większym bezpieczeństwie, a dyscyplina wojska wzrosła."
 STATIC_MODIFIER_NAME_ara_conquer_tunis_mod: "Garnizon północnoafrykański"
 STATIC_MODIFIER_DESC_ara_conquer_tunis_mod: "Zabezpieczywszy przywództwo nad Afryką Północną, nasza ręka w negocjacjach wojennych jest silniejsza, a siła żywa wojska wzrosła."
 STATIC_MODIFIER_NAME_ara_occupy_alexandria_mod: "Monopol handlu wschodniego"
 STATIC_MODIFIER_DESC_ara_occupy_alexandria_mod: "Zabezpieczywszy węzeł handlu wschodniego, dochód handlowy królestwa i zasięg jego kupców wzrosły jak nigdy dotąd."
 STATIC_MODIFIER_NAME_ara_claims_on_athens_mod: "Dziedzictwo Kompanii Katalońskiej"
 STATIC_MODIFIER_DESC_ara_claims_on_athens_mod: "Przeprowadziwszy wyprawy w Grecji, armia królewska maszeruje szybciej, a ciężar wojny ciąży na królestwie lżej."
 STATIC_MODIFIER_NAME_ara_mare_nostrum_mod: "Naczelne dowództwo floty śródziemnomorskiej"
 STATIC_MODIFIER_DESC_ara_mare_nostrum_mod: "Zabezpieczywszy całe Morze Śródziemne, nasza flota szczyci się wysokim morale i niezrównanym zasięgiem operacyjnym i handlowym."
 STATIC_MODIFIER_NAME_ara_taula_de_canvi_mod: "Kredyt Stołu Wymiany"
 STATIC_MODIFIER_DESC_ara_taula_de_canvi_mod: "„Taula de Canvi” (Stół Wymiany), założony w Barcelonie w 1401 roku, uważany jest za jeden z pierwszych banków publicznych świata. Zarządzana przez gildie kupieckie Barcelony ta instytucja finansowa prowadziła kredyty, weksle i depozyty i stała się filarem, wspierającym handel kataloński."
 STATIC_MODIFIER_NAME_ara_valencian_silk_mod: "Llotja de la Seda"
 STATIC_MODIFIER_DESC_ara_valencian_silk_mod: "Walencja była jednym z wiodących ośrodków produkcji jedwabiu średniowiecznego Morza Śródziemnego. Technologie jedwabnictwa, przyniesione przez Maurów, przeszły do chrześcijańskich rzemieślników, a jedwab walencki szczycił się reputacją, rywalizującą z cienkimi tkaninami Włoch. Llotja de la Seda (Giełda Jedwabiu) jest symbolem jego dobrobytu."
 STATIC_MODIFIER_NAME_ara_guilds_of_barcelona_mod: "Lojalność gildii"
 STATIC_MODIFIER_DESC_ara_guilds_of_barcelona_mod: "Wzmocnione więzy z gildiami Barcelony nieznacznie podniosły wydajność produkcyjną tej ziemi."
 STATIC_MODIFIER_NAME_ara_industrial_districts_mod: "Wzrost manufaktury"
 STATIC_MODIFIER_DESC_ara_industrial_districts_mod: "W Barcelonie, Walencji i Saragossie rozwinęły się dzielnice przemysłowe, gdzie skupiły się warsztaty wełny, sukna, skóry i wyrobów metalowych. Dobrobyt handlowy Korony Aragońskiej wspierany był produktywnością tych przemysłów miejskich, a ich towary były wysoko cenione nawet na rynkach Włoch."
 STATIC_MODIFIER_NAME_ara_aragonese_renaissance_mod: "Dwór humanistów"
 STATIC_MODIFIER_DESC_ara_aragonese_renaissance_mod: "Ten rozkwit kulturalny podniósł umiejętności nowych artystów i tempo innowacji."
 STATIC_MODIFIER_NAME_ara_golden_century_mod: "Dobrobyt Siglo de Oro"
 STATIC_MODIFIER_DESC_ara_golden_century_mod: "Siglo de Oro (Złoty Wiek) oznacza XVI i XVII wiek, gdy Hiszpania osiągnęła szczyt osiągnięć politycznych, wojskowych i kulturalnych. „Don Kichot” Cervantesa, dworskie malarstwo Velázqueza, sztuki Lope de Vegi — zjednoczone korony Aragonii i Kastylii rządziły na szczycie kultury europejskiej."
 STATIC_MODIFIER_NAME_ara_city_of_the_worlds_desire_mod: "Pan Bosforu"
 STATIC_MODIFIER_DESC_ara_city_of_the_worlds_desire_mod: "Blask imperium, dzierżącego Konstantynopol, podniósł jego prestiż i legitymizację i wzmocnił jego rękę w negocjacjach wojennych jak nigdy dotąd."
 STATIC_MODIFIER_NAME_ara_plus_ultra_mod: "Zapał wypraw poza granice"
 STATIC_MODIFIER_DESC_ara_plus_ultra_mod: "Duch eksploracji poza granice rozszerzył zasięg naszych flot kolonialnych i floty."
 STATIC_MODIFIER_NAME_ara_african_outposts_mod: "Przyczółki kanaryjskie"
 STATIC_MODIFIER_DESC_ara_african_outposts_mod: "Nasze przyczółki wzdłuż wybrzeża afrykańskiego rozszerzyły zasięg statków handlowych królestwa."
 STATIC_MODIFIER_NAME_ara_gold_coast_trade_mod: "Sieć handlu złotem"
 STATIC_MODIFIER_DESC_ara_gold_coast_trade_mod: "Handel ze Złotym Wybrzeżem podniósł dochód handlowy królestwa i zasięg jego kupców."
 STATIC_MODIFIER_NAME_ara_discover_the_new_world_mod: "Duch floty oceanicznej"
 STATIC_MODIFIER_DESC_ara_discover_the_new_world_mod: "Otwarcie wrót do Nowego Świata przyspieszyło strumień emigrantów w królestwie."
 STATIC_MODIFIER_NAME_ara_caribbean_foothold_mod: "Osady Hispanioli"
 STATIC_MODIFIER_DESC_ara_caribbean_foothold_mod: "Nasz przyczółek w Nowym Świecie podniósł jego atrakcyjność dla osadników."
 STATIC_MODIFIER_NAME_ara_conquest_of_the_incas_mod: "Dziedzictwo konkwistadorów"
 STATIC_MODIFIER_DESC_ara_conquest_of_the_incas_mod: "W 1532 roku Francisco Pizarro pojmał inkaskiego cesarza Atahualpę i podbił Imperium Inków. Splądrowanie największej cywilizacji złota świata przyniosło Hiszpanii niespotykane bogactwo, a z odkryciem kopalń srebra Potosí ogromne ilości drogocennego metalu popłynęły z Nowego Świata do Europy."
 STATIC_MODIFIER_NAME_ara_new_kingdom_of_aragon_mod: "Korona Ameryk"
 STATIC_MODIFIER_DESC_ara_new_kingdom_of_aragon_mod: "Budowa Nowego Królestwa Aragonii to wielkie przedsięwzięcie kolonialne, by przesadzić dziedzictwo Aragonii do Nowego Świata. W systemie encomiendy, obejmującym pracę tubylców, srebro, złoto, cukier i barwniki nadal wysyłane są do metropolii."
 STATIC_MODIFIER_NAME_ara_route_to_the_indies_mod: "Kompas żeglarzy"
 STATIC_MODIFIER_DESC_ara_route_to_the_indies_mod: "Otwarcie drogi do Indii rozszerzyło zasięg operacyjny naszej floty."
 STATIC_MODIFIER_NAME_ara_spice_trade_outposts_mod: "Dom handlowy Moluków"
 STATIC_MODIFIER_DESC_ara_spice_trade_outposts_mod: "Przyprawy, takie jak pieprz, gałka muszkatołowa i goździki, kosztowały w średniowiecznej Europie tyle samo co złoto. Przerwać ten szlak handlowy, zmonopolizowany przez muzułmańskich kupców i Wenecję, i założyć przyczółki bezpośrednio u źródła — to źródło bogactwa imperialnego."
 STATIC_MODIFIER_NAME_ara_las_filipinas_mod: "Stacja pośrednia Pacyfiku"
 STATIC_MODIFIER_DESC_ara_las_filipinas_mod: "Archipelag Filipin dostał się Magellanowi (1521) i później, z Manilą na Luzonie jako bazą, stał się centrum „handlu galeonami”. Tym szlakiem, łączącym Acapulco w Meksyku i Manilę, srebro Nowego Świata nieustannie wymieniane było na chiński jedwab i porcelanę."
 STATIC_MODIFIER_NAME_ara_empire_of_the_three_oceans_mod: "Imperium, w którym słońce nigdy nie zachodzi"
 STATIC_MODIFIER_DESC_ara_empire_of_the_three_oceans_mod: "Blask imperium, obejmującego trzy oceany, podniósł dochód handlowy królestwa i zasięg jego kupców jak nigdy dotąd."
 ara_events.1.t: "Wstąpienie Piotra IV"
 ara_events.1.d: "W 1336 roku Alfons IV zmarł, a jego syn Piotr IV wstąpił na tron Korony Aragońskiej. W 1337 roku królestwo jest luźnym związkiem ziem Katalonii, Aragonii, Walencji i Balearów. Kontrola nad Sardynią pozostaje niestabilna, a stosunki z sąsiednią Kastylią niosą stałe napięcie. Potęgi handlowe, rządzące szlakami handlowymi Morza Śródziemnego, dzierżą wielki wpływ, a korona musi rządzić w zgodzie z przywilejami tych różnych królestw. Przed młodym królem Piotrem IV rozciąga się długa droga ku zjednoczonej Iberii i zwierzchności na Morzu Śródziemnym."
 ara_events.1.a: "Rozpoczynają się nowe rządy"
 ara_events.2.t: "Włączenie Królestwa Majorki"
 ara_events.2.d: "Królestwo Majorki, niegdyś założone przez Jakuba II młodszą gałęzią aragońskiego domu królewskiego, od dawna pozostaje w aragońskiej sferze wpływów, mimo posiadłości na Balearach, w Roussillon i Montpellier. Nadszedł czas jego pełnego włączenia. Czy zostanie całkowicie zaanektowane i uczynione częścią Aragonii, czy zachowane jako przyjazny wasal — w każdym przypadku Majorka upadnie pod aragońską koronę."
 ara_events.2.a: "Całkowicie zaanektować Majorkę"
 ara_events.2.b: "Zachować Majorkę jako przyjaznego wasala"
 STATIC_MODIFIER_NAME_ara_seize_sicily_mod: "Chwała zajęcia Sycylii"
 STATIC_MODIFIER_DESC_ara_seize_sicily_mod: "Sycylijczycy, którzy wypędzili dom Andegawenów w „Nieszporach Sycylijskich” 1282 roku, powitali Piotra III Aragońskiego swym nowym królem. Od tego czasu Sycylia była ważną posiadłością aragońskiego domu królewskiego i nadal służyła jako strategiczny klucz, panujący nad centralnym Morzem Śródziemnym."
