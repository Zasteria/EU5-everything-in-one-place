l_polish:
 ple_english_pale_mission_pack: "Pale — od przyczółka korony do Królestwa Irlandii"
 ple_english_pale_mission_pack_DESCRIPTION:0 "Wąskie angielskie Pale wokół Dublina — wyciągnij rękę do anglo-normańskich panów, podbij gaelickie ziemie i załóż królestwo, rządzące całą Irlandią."
 ple_english_pale_mission_pack_CRITERIA_DESCRIPTION:0 "Umocnij Pale, podbij całą Irlandię i załóż królestwo."
 ple_english_pale_mission_pack_BUTTON_TOOLTIP:0 "Od małego przyczółka do królestwa, rządzącego całą Zieloną Wyspą."
 ple_english_pale_mission_pack_BUTTON_DETAILS:0 "„Bardziej irlandzki niż sami Irlandczycy” — wznieś sztandar Pale nad całą Irlandią!"
 ple_english_pale: "Angielskie Pale"
 ple_english_pale_desc: "Wąski pas przybrzeżny wokół Dublina — to ostatni przyczółek angielskiej władzy królewskiej pośród rozległego morza gaelickiego."
 ple_dublin_castle: "Rozwiń Zamek Dubliński"
 ple_dublin_castle_desc: "Zamek Dubliński, zbudowany w 1204 roku — umocnij dalej to centrum angielskich rządów w Irlandii."
 ple_pale_defense: "Umocnij Pale"
 ple_pale_defense_desc: "Wały ziemne i rowy, chroniące Pale przed najazdami gaelickimi — umocnij tę linię obronną, znaną jako „Fosa”."
 ple_lord_deputy: "Lord Deputy Irlandii"
 ple_lord_deputy_desc: "Lord Deputy, który rządzi Irlandią jako namiestnik króla angielskiego — uczyń ten urząd niezłomnym."
 ple_anglo_irish_parliament: "Parlament anglo-irlandzki"
 ple_anglo_irish_parliament_desc: "Parlament irlandzki, zwoływany w Drogheda lub Dublinie — zmuś to zgromadzenie anglo-irlandzkich panów i przedstawicieli miast do działania."
 ple_pale_consolidated: "Pale umocnione"
 ple_pale_consolidated_desc: "Umocnienia, lord deputy, prawo i parlament — zbuduj na tym wszystkim i uczyń rządy Pale niezłomnymi."
 ple_hiberno_norman_lords: "Panowie anglo-normańscy"
 ple_hiberno_norman_lords_desc: "Panowie anglo-normańscy, o których mówi się, że są „bardziej Anglikami niż sami Anglicy” — zbuduj stosunki z nimi."
 ple_fitzgerald_kildare: "Fitzgeraldowie z Kildare"
 ple_fitzgerald_kildare_desc: "„Cała Irlandia nie może rządzić hrabią Kildare” — tak mówiono. Zbuduj stosunki z tym potężnym domem."
 ple_butler_ormond: "Butlerowie z Ormond"
 ple_butler_ormond_desc: "Butlerowie z Ormond, rywale Kildare’ów — zbuduj stosunki z tym domem, oddanym koronie."
 ple_statutes_of_kilkenny: "Statuty Kilkenny"
 ple_statutes_of_kilkenny_desc: "Wydane w 1367 roku, Statuty Kilkenny — egzekwuj to prawo, zabraniające angielskim osadnikom „gaelizacji”."
 ple_gaelic_frontier_wars: "Gaelickie wojny graniczne"
 ple_gaelic_frontier_wars_desc: "Gaelickie władcy, otaczający Pale — stań w obliczu nieustającej wojny tej granicy."
 ple_conquer_leinster: "Podbij Leinster"
 ple_conquer_leinster_desc: "Leinster, leżący na południe od Pale — przywiedź ten region w nasze władanie."
 ple_conquer_munster: "Podbij Munster"
 ple_conquer_munster_desc: "Munster, sfera hrabiego Desmond — podbij ten bogaty region."
 ple_conquer_connacht: "Podbij Connacht"
 ple_conquer_connacht_desc: "Connacht, rozciągający się na zachodnich pustkowiach — przywiedź to pogranicze pod naszą kontrolę."
 ple_conquer_ulster: "Podbij Ulster"
 ple_conquer_ulster_desc: "Ulster, północna ziemia najuporczywszego oporu gaelickiego — podbij ten region."
 ple_master_of_ireland: "Pan Irlandii"
 ple_master_of_ireland_desc: "Leinster, Munster, Connacht i Ulster — rządź nimi wszystkimi i stań prawdziwym panem Irlandii."
 ple_reformation_choice: "Wybór Reformacji"
 ple_reformation_choice_desc: "Nauki Lutra i Kalwina przekraczają morze — stojąc na tym rozdrożu wiary, jaką ścieżkę wybierzemy?"
 ple_church_of_ireland: "Kościół Irlandii"
 ple_church_of_ireland_desc: "Kościół Irlandii, związany z Kościołem Anglii — ustanów tę nową wiarę narzędziem rządów."
 ple_recusant_catholics: "Katolicy-rekuzanci"
 ple_recusant_catholics_desc: "„Rekuzanci”, odmawiający wyrzeczenia się wierności Rzymowi — przyjmij ich wiarę podporą rządów."
 ple_dublin_university: "Uniwersytet Dublina"
 ple_dublin_university_desc: "Siedziba nauki Dublina, uosobiona przez Trinity College — rozwiń to miejsce centrum nauki."
 ple_english_crown_relations: "Stosunki z koroną angielską"
 ple_english_crown_relations_desc: "Korona angielska za morzem — rozważ nasze stosunki z tym suzerenem, bo określą one naszą przyszłość."
 ple_kingdom_of_ireland: "Królestwo Irlandii proklamowane"
 ple_kingdom_of_ireland_desc: "Droga, rozpoczęta małym przyczółkiem Pale, przynosi tu owoc królestwem, rządzącym całą Irlandią — lecz jaką drogą pójdzie to nowe królestwo, pozostaje nierozstrzygnięte."
 ple_events.99.t: "Proklamacja Królestwa Irlandii"
 ple_events.99.d: "Długa historia, rozpoczęta małym przyczółkiem Dublina, wkracza tu w nową epokę królestwem, rządzącym całą Irlandią."
 ple_events.99.a: "Chwała Irlandii!"
 ple_defy_the_crown: "Wyzwanie dla korony"
 ple_defy_the_crown_desc: "Królestwo Irlandii nie jest już zwykłym sługą Anglii — uczyń to zerwanie pierwszym krokiem ku prawdziwej suwerenności."
 ple_war_of_irish_independence: "Wojna o niepodległość Irlandii"
 ple_war_of_irish_independence_desc: "Nieunikniona wojna z koroną za morzem — wygraj tę wojnę o niepodległość i rozbij łańcuchy."
 ple_sovereign_kingdom_of_ireland: "Suwerenna Irlandia"
 ple_sovereign_kingdom_of_ireland_desc: "Prawdziwie niezależne Królestwo Irlandii, niepodlegające żadnej koronie — Zielona Wyspa wreszcie staje się panem własnego losu."
 ple_loyal_crown_partnership: "Partnerstwo z koroną"
 ple_loyal_crown_partnership_desc: "Partnerstwo, nie rywalizacja — Królestwo Irlandii wybiera sojusz równych z koroną angielską."
 ple_anglo_irish_union: "Unia anglo-irlandzka"
 ple_anglo_irish_union_desc: "Poprzez ścisłe więzy polityczne dwa królestwa czynią krok ku głębszej unii."
 ple_united_kingdoms: "Partner w unii"
 ple_united_kingdoms_desc: "Wybrawszy partnerstwo zamiast rywalizacji, Królestwo Irlandii stoi partnerem w unii obok Anglii i wznosi epokę wspólnego dobrobytu."
 STATIC_MODIFIER_NAME_ple_pale_mod: "Angielskie Pale"
 STATIC_MODIFIER_DESC_ple_pale_mod: "Od czasów Henryka II ta ziemia pozostaje jedynym przyczółkiem korony angielskiej za morzem."
 STATIC_MODIFIER_NAME_ple_dublin_mod: "Zamek Dubliński rozwinięty"
 STATIC_MODIFIER_DESC_ple_dublin_mod: "Starożytny port wikingów jest teraz ożywiony jako siedziba rządów i handlu w Irlandii."
 STATIC_MODIFIER_NAME_ple_defense_mod: "Pale umocnione"
 STATIC_MODIFIER_DESC_ple_defense_mod: "Wewnątrz wałów ziemnych i rowów „Pale” chłopi uprawiają swe pola, nie lękając się nagłych najazdów gaelickich."
 STATIC_MODIFIER_NAME_ple_lord_deputy_mod: "Lord Deputy"
 STATIC_MODIFIER_DESC_ple_lord_deputy_mod: "Deputy, siedzący w Zamku Dublińskim w miejsce króla za morzem, budzi szacunek nawet wśród wielkich panów."
 STATIC_MODIFIER_NAME_ple_parliament_mod: "Parlament anglo-irlandzki"
 STATIC_MODIFIER_DESC_ple_parliament_mod: "Głosy mieszczan, zebranych wewnątrz murów zamkowych, niosą teraz większą wagę w sprawach państwa."
 STATIC_MODIFIER_NAME_ple_consolidated_mod: "Pale umocnione"
 STATIC_MODIFIER_DESC_ple_consolidated_mod: "Dublin nie jest już obcym anklawem, lecz prawdziwym sercem rdzennym, wpisanym w własne księgi korony."
 STATIC_MODIFIER_NAME_ple_norman_lords_mod: "Panowie anglo-normańscy"
 STATIC_MODIFIER_DESC_ple_norman_lords_mod: "Panowie normańscy w swych zamkach są tak głęboko zakorzenieni w tej ziemi, że mówi się, iż są „bardziej Irlandczykami niż sami Irlandczycy”."
 STATIC_MODIFIER_NAME_ple_kilkenny_mod: "Statuty Kilkenny"
 STATIC_MODIFIER_DESC_ple_kilkenny_mod: "Wydane w 1367 roku, to prawo zabrania osadnikom przyjmowania języka irlandzkiego lub obyczajów gaelickich."
 STATIC_MODIFIER_NAME_ple_frontier_wars_mod: "Gaelickie wojny graniczne"
 STATIC_MODIFIER_DESC_ple_frontier_wars_mod: "Niezliczone potyczki za fosą Pale zahartowały żołnierzy do wojen pogranicza."
 STATIC_MODIFIER_NAME_ple_leinster_mod: "Leinster podbity"
 STATIC_MODIFIER_DESC_ple_leinster_mod: "Spichlerze Leinsteru, sąsiadujące z Pale, figurują teraz w własnych księgach podatkowych korony."
 STATIC_MODIFIER_NAME_ple_munster_mod: "Munster podbity"
 STATIC_MODIFIER_DESC_ple_munster_mod: "Z portów Munsteru, niegdyś posiadłości hrabiego Desmond, wypływają statki, załadowane wełną i skórami, bez końca."
 STATIC_MODIFIER_NAME_ple_connacht_mod: "Connacht podbity"
 STATIC_MODIFIER_DESC_ple_connacht_mod: "Nawet klany dzikiego Connachtu podążają teraz za wezwaniem korony do broni."
 STATIC_MODIFIER_NAME_ple_ulster_mod: "Ulster podbity"
 STATIC_MODIFIER_DESC_ple_ulster_mod: "Uparta północ, długo dzierżona przez O’Neillów i O’Donnellów, wreszcie poddała się sztandarowi królewskiemu."
 STATIC_MODIFIER_NAME_ple_master_ireland_mod: "Pan Irlandii"
 STATIC_MODIFIER_DESC_ple_master_ireland_mod: "Od Leinsteru po Ulster cała Zielona Wyspa leży teraz pod jednym sztandarem."
 STATIC_MODIFIER_NAME_ple_reformation_mod: "Wybór Reformacji"
 STATIC_MODIFIER_DESC_ple_reformation_mod: "Nauki Lutra i Kalwina, przyniesione przez morze, wysyłają ciche fale przez kościoły tej wyspy."
 STATIC_MODIFIER_NAME_ple_church_ireland_mod: "Kościół Irlandii"
 STATIC_MODIFIER_DESC_ple_church_ireland_mod: "W kaplicach nowego kościoła, związanego z Canterbury, angielska Biblia jest teraz głośno czytana."
 STATIC_MODIFIER_NAME_ple_recusant_mod: "Katolicy-rekuzanci"
 STATIC_MODIFIER_DESC_ple_recusant_mod: "Obłożeni grzywnami, lecz nieujarzmieni, „rekuzanci” kontynuują swe ciche modlitwy do Rzymu."
 STATIC_MODIFIER_NAME_ple_university_mod: "Uniwersytet Dublina"
 STATIC_MODIFIER_DESC_ple_university_mod: "Wzdłuż dziedzińców Trinity College rozbrzmiewają teraz kroki nowego pokolenia uczonych."
 STATIC_MODIFIER_NAME_ple_crown_relations_mod: "Stosunki z koroną angielską"
 STATIC_MODIFIER_DESC_ple_crown_relations_mod: "Każdy list, przybywający z dworu za morzem, cicho kształtuje los tego królestwa."
 STATIC_MODIFIER_NAME_ple_kingdom_ireland_mod: "Królestwo Irlandii"
 STATIC_MODIFIER_DESC_ple_kingdom_ireland_mod: "Nowo koronowany król Irlandii zasiada teraz na tronie wewnątrz Zamku Dublińskiego."
 STATIC_MODIFIER_NAME_ple_defy_crown_mod: "Wyzwanie dla korony"
 STATIC_MODIFIER_DESC_ple_defy_crown_mod: "Wśród tych, którzy zrzucili wierność koronie za morzem, rozprzestrzenia się nieposkromiony zapał."
 STATIC_MODIFIER_NAME_ple_irish_independence_war_mod: "Wojna o niepodległość Irlandii"
 STATIC_MODIFIER_DESC_ple_irish_independence_war_mod: "Niezliczone starcia z wojskiem, wysłanym przez morze, wykuły żołnierzy tej wyspy w doświadczonych taktyków."
 STATIC_MODIFIER_NAME_ple_sovereign_ireland_mod: "Suwerenna Irlandia"
 STATIC_MODIFIER_DESC_ple_sovereign_ireland_mod: "Sztandar prawdziwie wolnej Irlandii, niezobowiązanej żadnej koronie, powiewa teraz z wież Zamku Dublińskiego. Namiestnicy, wysłani do każdego zakątka kraju, wznoszą administracyjne żyły suwerennego państwa."
 STATIC_MODIFIER_NAME_ple_loyal_partnership_mod: "Partnerstwo z koroną"
 STATIC_MODIFIER_DESC_ple_loyal_partnership_mod: "Wybrawszy zaufanie zamiast rywalizacji, posłowie dwóch koron przekraczają teraz morze częściej niż kiedykolwiek."
 STATIC_MODIFIER_NAME_ple_anglo_irish_union_mod: "Unia anglo-irlandzka"
 STATIC_MODIFIER_DESC_ple_anglo_irish_union_mod: "Poprzez niestrudzoną pracę posłów, służących dworowi za morzem, dwie korony są związane ściślej niż kiedykolwiek wcześniej."
