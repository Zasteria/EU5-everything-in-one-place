l_polish:
 flo_magnifico_mission_pack: "Dziedzictwo Il Magnifico"
 flo_magnifico_mission_pack_DESCRIPTION:0 "Republika Florencji pod niezwykłym domem Medyceuszy prowadzi całą Europę w handlu, sztuce i nauce. Czy zbudujesz na ogromnym bogactwie, zrodzonym z handlu wełną i banku Medyceuszy, i rozkwitniesz kolebką renesansu? Czy zjednoczysz Toskanię, ruszysz na Rzym i zostaniesz panem Włoch — Il Magnifico? We Florencji spotykają się mądrość kupca i ambicja władcy."
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION:0 "Ukończ misje jako Florencja i osiągnij zarówno prosperujący handel i kulturę, jak i podbój Włoch."
 flo_magnifico_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by przejść drogą Il Magnifico."
 flo_magnifico_mission_pack_BUTTON_DETAILS:0 "Pozwól renesansowi rozkwitnąć, opanuj Toskanię i zostań panem Włoch!"
 flo_rise_of_the_commune: "Wzrost komuny"
 flo_rise_of_the_commune_desc: "W 1337 roku Florencja, pośród walki między gwelfami (partia papieska) a gibelinami (partia cesarska), wyrosła w „Comune” — samorządne miasto-państwo kupców i rzemieślników. Wielkie banki rodzin Bardich i Peruzzich rządzą finansami europejskimi, a handel wełną wzdłuż Arno wzbogaca miasto. Lecz wewnętrzny spór frakcyjny nie ustaje. Przezwyciężaj tę epokę zamętu i doprowadź Florencję do prawdziwej wielkości."
 flo_the_prince: "Książę"
 flo_the_prince_desc: "W czasie wojen włoskich, gdy obce potęgi pustoszyły Włochy, florencki dyplomata Niccolò Machiavelli napisał „Księcia”. Rewolucyjne dzieło, spoglądające na rzeczywistość polityczną zimnym okiem, wyraziło głębokie pragnienie nowego władcy, zdolnego zjednoczyć Włochy."
 flo_arte_della_lana: "Przemysł wełniany"
 flo_arte_della_lana_desc: "Arte della Lana — gildia handlarzy wełną — jest sercem gospodarki florenckiej. Poprzez import wełny angielskiej i wywóz gotowego sukna po całej Europie rodzi bogactwo, które czyni miasto wielkim."
 flo_medici_bank: "Założenie banku Medyceuszy"
 flo_medici_bank_desc: "Bank, założony przez rodzinę Medyceuszy, działa jako oficjalny bank papiestwa rzymskiego, z oddziałami rozsianymi po całej Europie. Ta potęga finansowa jest podstawą, na której Florencja sprawuje wpływ zarówno w kulturze, jak i polityce."
 flo_arno_renewal: "Odnowa Arno"
 flo_arno_renewal_desc: "W miarę rozwoju miasta prace wzdłuż Arno postępują, a Florencja stała się jednym z prosperujących miast Włoch. Wysoki poziom rozwoju przynosi miastu stały przyrost w miesięcznym wzroście."
 flo_arno_corridor: "Korytarz nad Arno"
 flo_arno_corridor_desc: "Ponte Vecchio i kanały, przecinające Arno, są arteriami handlowymi i administracyjnymi Florencji. Wznoszenie mostów i transportu wodnego przyspieszy rozwój miasta."
 flo_arno_trade_network: "Sieć handlowa Arno"
 flo_arno_trade_network_desc: "Sieć handlowa, rozciągająca się wzdłuż Arno przez całą Toskanię, jest źródłem potęgi handlowej Florencji. Poprzez opanowanie tej sieci możemy przywieść cały handel Północnych Włoch pod naszą kontrolę."
 flo_dominate_italian_trade: "Opanuj handel włoski"
 flo_dominate_italian_trade_desc: "Sieć handlowa Florencji obejmuje teraz całe Włochy. Od północy po południe gospodarka włoska nie może funkcjonować bez kupców florenckich."
 flo_duomo_di_firenze: "Santa Maria del Fiore"
 flo_duomo_di_firenze_desc: "Ukończenie kopuły Brunelleschiego — czyn, który przekroczył granice architektury swego czasu. Jego wielka kopuła napełnia obywateli Florencji głęboką dumą i stała się wiecznym symbolem miasta."
 flo_birthplace_of_renaissance: "Kolebka renesansu"
 flo_birthplace_of_renaissance_desc: "Florencja przewodzi jako kolebka renesansu duchowemu odnowieniu całej Europy. Duch powrotu do klasycznej starożytności i humanizmu zapuścił tu głębokie korzenie."
 flo_florentine_school_of_painting: "Florencka szkoła malarska"
 flo_florentine_school_of_painting_desc: "Florencki styl malarstwa, założony przez Botticellego i innych, wyprzedza całą Europę w perspektywie i realizmie."
 flo_the_mona_lisa: "Mona Lisa"
 flo_the_mona_lisa_desc: "Arcydzieło Leonarda da Vinci zmieniło samo pojęcie malarstwa. Artystyczna gleba Florencji, nadal rodząca takich geniuszy, jest niezrównana."
 flo_uffizi: "Uffizi"
 flo_uffizi_desc: "Poprzez zjednoczenie kolekcji artystycznej, zgromadzonej przez rodzinę Medyceuszy, Uffizi mogą stać się największym muzeum świata. Ich prestiż kulturalny na wieki wyniesie imię Florencji."
 flo_the_rise_of_medici: "Wzrost Medyceuszy"
 flo_the_rise_of_medici_desc: "Po upadku rodzin Bardich i Peruzzich wzniosła się nowa dynastia bankierska: Medyceusze. Bank Medyceuszy, założony przez Giovanniego di Bicci de’ Medici w 1397 roku, szybko wzrósł dzięki stosunkom z papiestwem rzymskim i rozszerzył oddziały po całej Europie. Ta rodzina poniesie przyszłość Florencji."
 flo_pazzi_conspiracy: "Spisek Pazzich"
 flo_pazzi_conspiracy_desc: "Zamach na Lorenza Medyceusza, wsparty przez papieża Sykstusa IV i rodzinę Pazzich, zakończył się niepowodzeniem i, paradoksalnie, jedynie umocnił władzę Medyceuszy."
 flo_machiavelli: "Dzieła Machiavellego"
 flo_machiavelli_desc: "W „Księciu” Niccolò Machiavelli chłodno przeanalizował rzeczywistość władzy. Jego myślenie głęboko wpłynęło na florencką filozofię polityczną."
 flo_republic_of_virtue: "Republika cnoty"
 flo_republic_of_virtue_desc: "Florencja dąży, by być nie tylko państwem handlowym, lecz opartym na cnocie i ideałach republikańskich. Legitymizacja i stabilność są kamieniami węgielnymi republiki."
 flo_camerata_fiorentina_nmt: "Camerata Fiorentina"
 flo_camerata_fiorentina_nmt_desc: "Camerata, gdzie zbierają się florenccy uczeni i muzycy, staje się rozsadnikiem innowacji muzycznej, która doprowadzi do narodzin opery. Miasto, gdzie sztuka i nauka rozkwitają jako jedno."
 flo_subjugate_pisa: "Podporządkuj Pizę"
 flo_subjugate_pisa_desc: "Piza, miasto portowe, od dawna pożądane przez Florencję jako brama do morza, musi zostać zabezpieczona. Zajęcie tego portu nad Arno znacznie rozszerzy zasięg handlowy Florencji."
 flo_siena_submitted: "Podporządkowanie Sieny"
 flo_siena_submitted_desc: "Nasz dawny rywal Siena wreszcie ujarzmiony. Pomściwszy hańbę Montaperti, Florencja przyjmuje jej jedwabników i bankierów i zapewnia pełną kontrolę nad Południową Toskanią."
 flo_lucca_absorbed: "Wchłonięcie Lukki"
 flo_lucca_absorbed_desc: "Lukka, długo zachowująca niezależność, jest jedną z ostatnich przeszkód zjednoczenia Toskanii przez Florencję. Przywiedź jej przemysł jedwabny pod władzę florencką."
 flo_unify_tuscany: "Zjednocz Toskanię"
 flo_unify_tuscany_desc: "Teraz, gdy prawie cała Toskania jest pod kontrolą florencką, wyniesienie do rangi królestwa jest naturalną konsekwencją. Florencja nie jest już zwykłym miastem-państwem."
 flo_push_into_lombardy: "Posunięcie do Lombardii"
 flo_push_into_lombardy_desc: "Poza Toskanią nadszedł czas, by rozszerzyć nasze władanie w serce Północnych Włoch. Konflikt z Mediolanem, Genuą i Wenecją jest nieunikniony."
 flo_march_on_rome: "Marsz na Rzym"
 flo_march_on_rome_desc: "Kto rządzi Rzymem, ten rządzi Włochami. Przywiódłszy starożytną stolicę Cesarstwa Rzymskiego w swe władanie, Florencja zgłasza roszczenie do legitymizacji, której nikt nie dorównuje."
 flo_the_new_rome: "Nowy Rzym"
 flo_the_new_rome_desc: "Florencja, która podbiła Rzym, rządzi teraz większością półwyspu włoskiego i stała się imperium. Nadszedł czas, by wznieść nowy Rzym."
 flo_il_magnifico_of_italy: "Il Magnifico Włoch"
 flo_il_magnifico_of_italy_desc: "Jak Lorenzo de’ Medici nazwano „Il Magnifico”, tak teraz cała Florencja stała się „Wspaniałą” Włoch."
 flo_medici_oriental_press: "Prasa Medyceuszy rękopisów wschodnich"
 flo_medici_oriental_press_desc: "Drukarnia, wzniesiona przez rodzinę Medyceuszy, zbiera i drukuje greckie rękopisy, które napłynęły po upadku Cesarstwa Bizantyjskiego. Starożytna wiedza znów tchnie nowe życie w Europę."
 flo_clock_tower: "Wieża zegarowa Piazza della Signoria"
 flo_clock_tower_desc: "Dokładna wieża zegarowa, wzniesiona w Palazzo della Signoria, stała się symbolem florenckiej biegłości technicznej. Zarządzanie czasem poprawia efektywność handlu i rządów."
 flo_first_modern_engineer: "Pierwszy nowoczesny inżynier"
 flo_first_modern_engineer_desc: "Filippo Brunelleschi rozwinął rewolucyjne metody budowlane, przewyższające starożytny Rzym przy wznoszeniu kopuły. Jego techniczne dziedzictwo stosowane jest do fortyfikacji w całych Włoszech."
 flo_humiliate_venice: "Upokorz Wenecję"
 flo_humiliate_venice_desc: "Nadszedł czas, by przewyższyć naszego dawnego rywala morskiego, Republikę Wenecką. Stawiając Królową Adriatyku na jej miejscu, dowiedziemy, że Florencja jest wiodącym narodem Włoch."
 flo_papal_relations: "Stosunki z papiestwem"
 flo_papal_relations_desc: "Teraz, gdy Rzym zabezpieczony, stosunki z papiestwem muszą być postawione na twardej podstawie. Czy to przez sojusz, czy zwierzchność, Florencja stanie się największym mecenasem kościoła rzymskiego."
 flo_vasari_corridor: "Uffizi i korytarz Vasariego"
 flo_vasari_corridor_desc: "Korytarz Vasariego, łączący pałac Uffizi i Ponte Vecchio, został zaprojektowany przez Giorgia Vasariego na zamówienie Cosima I de’ Medici. Ten tajny wzniesiony przejazd symbolizuje władzę i artystyczną przewagę Medyceuszy."
 flo_academy_of_florence: "Akademia Florencji"
 flo_academy_of_florence_desc: "Akademia, wzniesiona we Florencji, stała się miejscem wszechstronnych badań sztuki, nauki i filozofii. Wiedza renesansu rozprzestrzenia się stąd w świat."
 flo_italian_cultural_hegemon: "Hegemon kulturalny Włoch"
 flo_italian_cultural_hegemon_desc: "Florencja, gdzie handel, sztuka i nauka rozkwitły jako jedno, stała się centrum kulturalnym całych Włoch. Jej wpływ sięga nawet za Alpy."
 flo_magnifico: "Il Magnifico"
 flo_magnifico_desc: "Od miasta handlowego Florencja wzniosła się na szczyt kultury, podbiła całe Włochy i ustanowiła się dziedziczką Cesarstwa Rzymskiego. „Il Magnifico” — imię Wspaniałego na wieki wpisane w historię."
 STATIC_MODIFIER_NAME_flo_arte_della_lana_mod: "Prosperujący przemysł wełniany"
 STATIC_MODIFIER_DESC_flo_arte_della_lana_mod: "Arte della Lana (gildia wełniana) była największą gildią Florencji i podstawą dobrobytu miejskiego. Misternie obrobione sukno z surowej wełny, kupowanej w Anglii i Hiszpanii, było cenione w całej Europie i stało się źródłem ogromnej fortuny Medyceuszy."
 STATIC_MODIFIER_NAME_flo_medici_bank_mod: "Zwierzchność banku Medyceuszy"
 STATIC_MODIFIER_DESC_flo_medici_bank_mod: "Założony przez Giovanniego di Bicci de’ Medici w 1397 roku, bank Medyceuszy miał na swym szczycie oddziały w szesnastu miastach, w tym w Rzymie, Wenecji, Londynie i Brugii. Jako oficjalny bank dworu papieskiego zbierał ogromne zyski, obchodząc kościelny zakaz lichwy pod postacią „zysku z wymiany”."
 STATIC_MODIFIER_NAME_flo_arno_trade_network_mod: "Sieć handlowa Arno"
 STATIC_MODIFIER_DESC_flo_arno_trade_network_mod: "Arno było wielką arterią wodną, łączącą Florencję z portem Piza. Poprzez opanowanie szlaków handlowych wzdłuż jego biegu Florencja, będąc miastem śródlądowym, uczestniczyła bezpośrednio w handlu śródziemnomorskim, tworząc swoistą sferę ekonomiczną, łączącą sukno, bankowość i handel."
 STATIC_MODIFIER_NAME_flo_dominate_italian_trade_mod: "Zwierzchność w handlu włoskim"
 STATIC_MODIFIER_DESC_flo_dominate_italian_trade_mod: "Późnośredniowieczne Włochy były największą strefą handlową Europy, z kupcami Florencji, Wenecji i Genui na jej szczycie. Florenccy kupcy tkali sieć finansową po całej Europie Północnej, posiadając wystarczający wpływ, by pożyczać obu stronom Wojny Stuletniej między Anglią a Francją."
 STATIC_MODIFIER_NAME_flo_duomo_di_firenze_mod: "Ukończenie katedry"
 STATIC_MODIFIER_DESC_flo_duomo_di_firenze_mod: "Kopuła katedry Florencji (Santa Maria del Fiore) została ukończona przez Brunelleschiego w 1436 roku. Rewolucyjne osiągnięcie techniczne — gigantyczna kopuła, wzniesiona bez drewnianych rusztowań ani podpór budowlanych, czego nikt nie dokonał od ponad tysiąca lat od czasów Panteonu w Rzymie — symbolizuje ducha renesansu."
 STATIC_MODIFIER_NAME_flo_birthplace_of_renaissance_mod: "Kolebka renesansu"
 STATIC_MODIFIER_DESC_flo_birthplace_of_renaissance_mod: "„Renesans” — ponowne narodziny — narodził się we Florencji. W Akademii Platońskiej, założonej przez Cosima de’ Medici, Marsilio Ficino i inni wskrzesili myśl starożytnej Grecji i Rzymu, a w połączeniu z tradycją literacką Dantego, Petrarki i Boccaccia przekształciła cywilizację zachodnią do samych jej podstaw."
 STATIC_MODIFIER_NAME_flo_florentine_school_of_painting_mod: "Florencka szkoła malarska"
 STATIC_MODIFIER_DESC_flo_florentine_school_of_painting_mod: "Tradycja malarstwa realistycznego, założona przez Giotta di Bondone pod koniec XIII wieku, przeszła do perspektywy Masaccia, wdzięku Botticellego i wszechstronności Leonarda. Malarstwo florenckie ucieleśniło przejście od średniowiecznych obrazów świętych do sztuki nowoczesnej i określiło kierunek malarstwa europejskiego."
 STATIC_MODIFIER_NAME_flo_the_mona_lisa_mod: "Wpływ Mony Lisy"
 STATIC_MODIFIER_DESC_flo_the_mona_lisa_mod: "Namalowana około 1503-1519 roku przez Leonarda da Vinci, „Mona Lisa” z jej zagadkowym uśmiechem i nowatorską perspektywą i techniką sfumato stała się najsłynniejszym dziełem w historii sztuki zachodniej. Leonardo był geniuszem uniwersalnym, obejmującym nie tylko malarstwo, lecz także anatomię, inżynierię, architekturę i muzykę."
 STATIC_MODIFIER_NAME_flo_uffizi_mod: "Chwała Uffizi"
 STATIC_MODIFIER_DESC_flo_uffizi_mod: "Pałac Uffizi, zaprojektowany przez Vasariego na zamówienie Cosima I de’ Medici w 1560 roku, początkowo był biurem administracyjnym (Uffizi oznacza „biura”), lecz później pomieścił kolekcje Medyceuszy i stał się jednym z pierwszych muzeów świata — świątynią sztuki, gdzie zbierają się dzieła Botticellego, Leonarda i Michała Anioła."
 STATIC_MODIFIER_NAME_flo_machiavelli_mod: "Nauki Księcia"
 STATIC_MODIFIER_DESC_flo_machiavelli_mod: "Niccolò Machiavelli służył Republice Florenckiej jako dyplomata i administrator od 1498 do 1512 roku. „Książę”, napisany po wygnaniu Medyceuszy, był dziełem realistycznej myśli politycznej, twierdzącym, że „cel uświęca środki”, i stał się podstawą nowoczesnej teorii politycznej."
 STATIC_MODIFIER_NAME_flo_republic_of_virtue_mod: "Republika cnoty"
 STATIC_MODIFIER_DESC_flo_republic_of_virtue_mod: "Florencja posiadała swoisty ustrój, zachowując republikańską fasadę, podczas gdy Medyceusze faktycznie rządzili. Instytucje, takie jak Signoria (rząd miejski), Priorzy (magistraci) i Wielka Rada, zręcznie łączyły ideały republikanizmu z rzeczywistością oligarchii."
 STATIC_MODIFIER_NAME_flo_camerata_fiorentina_mod: "Camerata Fiorentina"
 STATIC_MODIFIER_DESC_flo_camerata_fiorentina_mod: "„Camerata”, krąg muzyków, poetów i uczonych, zbierający się w latach 70. i 80. XVI wieku w rezydencji hrabiego Giovanniego de’ Bardi we Florencji, dążył do odrodzenia starożytnego dramatu greckiego. Ich eksperymenty zrodziły zupełnie nową formę artystyczną, operę, i na wieki zmieniły historię muzyki zachodniej."
 STATIC_MODIFIER_NAME_flo_subjugate_pisa_mod: "Port Piza"
 STATIC_MODIFIER_DESC_flo_subjugate_pisa_mod: "Piza niegdyś rządziła republiką morską obok Wenecji i Genui nad Morzem Śródziemnym, lecz podupadła po druzgocącej klęsce z Genuą w bitwie pod Meloria w 1284 roku. Z podbojem Pizy przez Florencję w 1406 roku niegdyś lądowa Florencja wreszcie zyskała dostęp do morza."
 STATIC_MODIFIER_NAME_flo_siena_submitted_mod: "Podporządkowanie Sieny"
 STATIC_MODIFIER_DESC_flo_siena_submitted_mod: "Siena była odziedziczonym rywalem Florencji, długo spierającym się o zwierzchność nad Toskanią. Siena zachowywała niezależność z hiszpańskim wsparciem, lecz ostatecznie upadła w 1555 roku. Przywieść pod rządy florenckie dumnych sieneńczyków, znanych z wyścigów Palio, jest symbolem zjednoczenia Toskanii."
 STATIC_MODIFIER_NAME_flo_lucca_absorbed_mod: "Jedwab i sukno Lukki"
 STATIC_MODIFIER_DESC_flo_lucca_absorbed_mod: "Lukka była miastem z najcieńszym przemysłem jedwabnym Toskanii. W XIII i XIV wieku jedwab lukkański był ceniony w całej Europie, zdobiąc szaty książąt i szlachty. Bogactwo bankierów Lukki, rywali Medyceuszy, również zasługuje na uwagę."
 STATIC_MODIFIER_NAME_flo_unify_tuscany_mod: "Pan Toskanii"
 STATIC_MODIFIER_DESC_flo_unify_tuscany_mod: "Arezzo, starożytne miasto Etrusków; Siena, miasto poezji; Lukka, miasto rzemiosł; Piza, port — poprzez ich zjednoczenie Florencja staje się centrum Toskanii jako historycznej, kulturalnej i geograficznej całości. Ten czyn łączy rzymską „Tuscię” pod sztandarem Medyceuszy."
 STATIC_MODIFIER_NAME_flo_push_into_lombardy_mod: "Posunięcie do Lombardii"
 STATIC_MODIFIER_DESC_flo_push_into_lombardy_mod: "Florencja i Mediolan były dwiema wielkimi potęgami polityki włoskiej XV wieku, zawsze w napięciu. Przeciw ekspansjonistycznej polityce książąt Visconti i Sforzów Mediolańskich Florencja opierała się dyplomacją i kondotierami, najemnymi dowódcami. Ta równowaga sił zrodziła wyrafinowanie dyplomacji renesansowej."
 STATIC_MODIFIER_NAME_flo_the_new_rome_mod: "Nowy Rzym"
 STATIC_MODIFIER_DESC_flo_the_new_rome_mod: "Florencję często nazywano „Nowym Rzymem”. Cosimo i Lorenzo de’ Medici świadomie naśladowali kulturę mecenatu Rzymu, dążąc do odtworzenia cnót starożytnego Rzymu w duchu renesansu. Panowanie nad samym Rzymem jest symbolicznym dopełnieniem tego celu."
 STATIC_MODIFIER_NAME_flo_il_magnifico_of_italy_mod: "Il Magnifico Włoch"
 STATIC_MODIFIER_DESC_flo_il_magnifico_of_italy_mod: "Lorenzo de’ Medici (Wawrzyniec Wspaniały, 1449-1492) stał na szczycie swej epoki jako artysta, poeta, dyplomata i mąż stanu. Polityka równowagi, którą nazwał „równowagą Włoch”, zachowała pokój u progu wojen włoskich, a jego dwór promieniował najwyrafinowańszym blaskiem kultury renesansowej."
 STATIC_MODIFIER_NAME_flo_medici_oriental_press_mod: "Dziedzictwo nauki wschodniej"
 STATIC_MODIFIER_DESC_flo_medici_oriental_press_mod: "Na Soborze Ferrarsko-Florenckim 1438-1439 Cosimo de’ Medici kupił w dużej liczbie greckie rękopisy od uczonych, którzy przybyli z Bizancjum. Ten zbiór doprowadził do łacińskiego przekładu Platona i odrodzenia neoplatonizmu, zmieniając historię myśli zachodniej. W połączeniu z rewolucją druku Gutenberga wiedza rozprzestrzeniała się szybko."
 STATIC_MODIFIER_NAME_flo_clock_tower_mod: "Precyzja wieży zegarowej"
 STATIC_MODIFIER_DESC_flo_clock_tower_mod: "Zegary mechaniczne zaczęły pojawiać się na placach miast północnowłoskich w XIV wieku. Dzwonnica (Campanile) katedry Florencji, zaprojektowana przez Giotta, jest typowym przykładem. Wspólny pomiar czasu zjednoczył handel i rządy miasta i stał się infrastrukturą, która wsparła przejście od średniowiecza do nowoczesności."
 STATIC_MODIFIER_NAME_flo_the_rise_of_medici_mod: "Wzrost Medyceuszy"
 STATIC_MODIFIER_DESC_flo_the_rise_of_medici_mod: "Cosimo de’ Medici (zwany Pater Patriae, 1389-1464), opierając się na zyskach bankowych, wygnał swych wrogów politycznych i stał się faktycznym władcą Florencji. Jako skarbnik dworu papieskiego, mecenas sztuk i pośrednik w dyplomacji, położył podstawę pod chwałę domu Medyceuszy."
 STATIC_MODIFIER_NAME_flo_first_modern_engineer_mod: "Pionier nowoczesnej inżynierii"
 STATIC_MODIFIER_DESC_flo_first_modern_engineer_mod: "Filippo Brunelleschi przyniósł rewolucję w architekturze, rzeźbie i inżynierii. Teoretyzował perspektywę liniową i zrealizował wielką kopułę katedry Florencji poprzez nowatorską podwójną powłokę i techniki szkieletowe. Jest archetypem renesansowego „człowieka uniwersalnego” (uomo universale)."
 STATIC_MODIFIER_NAME_flo_humiliate_venice_mod: "Upokorzenie Wenecji"
 STATIC_MODIFIER_DESC_flo_humiliate_venice_mod: "Florencja i Wenecja, dwie wielkie potęgi handlowe średniowiecznych Włoch, rywalizowały w dobrobycie i długo konfliktowały zarówno dyplomatycznie, jak i militarnie. Konflikt o ekspansję w Mediolan w XV wieku był szczególnie zaciekły, a Florencja zawsze postrzegała lądową ekspansję Wenecji (politykę Terraferma) jako zagrożenie."
 STATIC_MODIFIER_NAME_flo_papal_relations_mod: "Więzy z papiestwem"
 STATIC_MODIFIER_DESC_flo_papal_relations_mod: "Stosunki między Medyceuszami a dworem papieskim były zawiłe. Po spisku Pazzich z 1478 roku (zabójczym zamiarze, w który zamieszany był arcybiskup Francesco Salviati), który zabił brata Lorenza, Giuliana, Lorenzo przez pewien czas konfliktował z Sykstusem IV, lecz później pojednał się i przywrócił mocne stosunki."
 STATIC_MODIFIER_NAME_flo_academy_of_florence_mod: "Akademia Florencji"
 STATIC_MODIFIER_DESC_flo_academy_of_florence_mod: "Akademia Platońska, wspierana przez Cosima de’ Medici, podjęła pod przewodnictwem Marsilia Ficina odrodzenie filozofii starożytnej. Łaciński przekład pełnych dzieł Platona, przekład Corpus Hermeticum, usystematyzowanie neoplatonizmu — te przedsięwzięcia duchowe odnowiły same podstawy filozofii zachodniej, teologii i nauki."
 STATIC_MODIFIER_NAME_flo_italian_cultural_hegemon_mod: "Mecenas sztuki włoskiej"
 STATIC_MODIFIER_DESC_flo_italian_cultural_hegemon_mod: "Florencja renesansu była centrum kulturalnym całej Europy. Książęta i szlachta Francji, Niderlandów, Niemiec i Anglii zapraszali florenckich artystów, architektów i uczonych, rywalizując w naśladowaniu „włoskiej” kultury dworskiej."
 STATIC_MODIFIER_NAME_flo_magnifico_mod: "Chwała Il Magnifico"
 STATIC_MODIFIER_DESC_flo_magnifico_mod: "„Il Magnifico” — wyrażenie, odzwierciedlające nie tylko blask jednego człowieka, lecz całego miasta Florencji. Chwała Florencji, stojącej na szczycie Europy zarówno w sztuce, filozofii, dyplomacji, jak i finansach, uosabia samą istotę epoki, którą późniejsze pokolenia nazwą „renesansem”."
 flo_events.1.t: "Wzrost komuny florenckiej"
 flo_events.1.d: "W 1337 roku Florencja jest opanowana przez długą walkę między frakcjami gwelfów i gibelinów. Wielkie banki rodzin Bardich i Peruzzich, obciążone ogromnymi kredytami dla króla Anglii, zaczynają się chwiać. Cień Czarnej Śmierci skrada się ze wschodu, a niektórzy knują zaproszenie tyrana Gautiera de Brienne. A jednak duch komuny florenckiej — samorządnego miasta kupieckiego — żyje. Na podstawie handlu wełną i gildii kupieckich przetrwaj tę epokę burz."
 flo_events.1.a: "Przyszłość Florencji w naszych rękach"
 flo_events.3.t: "Następstwa spisku Pazzich"
 flo_events.3.d: "Zamach na Lorenza de’ Medici, wsparty przez papieża Sykstusa IV i rodzinę Pazzich, zakończył się niepowodzeniem i, paradoksalnie, jedynie umocnił władzę Medyceuszy. Spiskowcy straceni, a obywatele Florencji jeszcze bardziej umocnili swe poparcie dla Medyceuszy. Przetrwawszy tę próbę, struktura polityczna republiki jest gotowa odrodzić się w coś bardziej wyrafinowanego."
 flo_events.3.a: "Próba uczyniła nas silniejszymi"
 flo_events.4.t: "Marsz na Rzym"
 flo_events.4.d: "Starożytna stolica Cesarstwa Rzymskiego jest teraz pod sztandarem Florencji. Donacja Konstantyna już dowiedziona fałszerstwem — jeśli tak, prawowita władza rządzenia Włochami należy do Florencji, zdobytej siłą i mądrością. Ta mała republika, zrodzona z miasta handlowego, idzie teraz drogą ku imperium, którego imię zostanie wyryte w historii."
 flo_events.4.a: "Rzym jaśnieje chwałą Florencji"
 STATIC_MODIFIER_NAME_flo_arno_renewal_mod: "La Grande Opera"
 STATIC_MODIFIER_DESC_flo_arno_renewal_mod: "Powodzie Arno nękały Florencję przez lata (powódź 1966 roku jest omawiana do dziś). Lecz poprzez ulepszenie brzegów, budowę mostów i umocnienie wałów rzeka stała się raczej zaletą miasta. Warsztaty, farbiarnie i płuczkarnie wełny wzdłuż rzeki działały sercem gospodarki florenckiej."
 STATIC_MODIFIER_NAME_flo_arno_corridor_mod: "Dobrobyt Ponte Vecchio"
 STATIC_MODIFIER_DESC_flo_arno_corridor_mod: "Ponte Vecchio (Stary Most) jest najstarszym mostem przez Arno i od XIV wieku symbolem handlu florenckiego, obstawionym sklepami złotników i jubilerów. Odnowiony jako część korytarza Vasariego, który Cosimo I nakazał wznieść, by połączyć Uffizi z pałacem Pitti, stał się symbolicznym przejściem, jednoczącym władcę i miasto."
 STATIC_MODIFIER_NAME_flo_vasari_corridor_mod: "Korytarz Vasariego"
 STATIC_MODIFIER_DESC_flo_vasari_corridor_mod: "Ukończony przez Giorgia Vasariego w zaledwie pięć miesięcy w 1565 roku, korytarz Vasariego jest wzniesionym przejściem, łączącym pałac Uffizi przez Ponte Vecchio z pałacem Pitti. Zaprojektowany, by Cosimo I mógł się poruszać, nie mieszając się z tłumem, jest techniczną krystalizacją bezpieczeństwa władcy i jego mistrzostwa nad miastem."
 flo_events.5.t: "Uffizi i korytarz Vasariego"
 flo_events.5.d: "Cosimo I de’ Medici nakazał architektowi Giorgio Vasariemu połączyć pałac Uffizi (siedzibę zarządu) z pałacem Pitti tajnym wzniesionym przejazdem. Ten „korytarz Vasariego”, biegnący nad Ponte Vecchio, to ukryte przejście, pozwalające władcy poruszać się, nie będąc widzianym przez publiczność — symbol władzy Medyceuszy i ich mistrzostwa nad miastem. Ta genialna architektura, przecinająca Arno, jasno pokazuje, że polityka i sztuka we Florencji są jednym i tym samym."
 flo_events.5.a: "Ukończenie korytarza podniosło rządy Florencji na nowy poziom"
 STATIC_MODIFIER_NAME_flo_the_prince_mod: "Nowy książę"
 STATIC_MODIFIER_DESC_flo_the_prince_mod: "W „Księciu” (1513) Machiavelli głosił, że trzeba mieć „i siłę lwa, i przebiegłość lisa”. Realizm, że bezpieczniej jest być bojaźliwie szanowanym niż kochanym i że w razie potrzeby należy stawiać zachowanie władzy ponad moralnością, stał się punktem wyjścia współczesnej politologii."
 flo_events.6.t: "Książę"
 flo_events.6.d: "Wojny włoskie dały Florencji surową lekcję. Dyplomata Niccolò Machiavelli napisał „Księcia”, dzieło ujawniające samą istotę władzy. Aby zjednoczyć rozdrobnione Włochy, potrzebny jest nowy władca, stawiający realną władzę ponad moralnością. „Tylko książę, posiadający zarówno dzielność, jak i fortunę, może ocalić Włochy w chaosie” — i, być może, ta odpowiedź leży w samej Florencji."
 flo_events.6.a: "Niech powstanie nowy książę, by ocalić Włochy!"
