l_polish:
 gae_gaelic_ireland_mission_pack: "Gaelicki kontratak Irlandii"
 gae_gaelic_ireland_mission_pack_DESCRIPTION:0 "Angielskie panowanie chwieje się wśród zarazy i inwazji Bruce’a — jako gaelicki wódz, poprowadź odrodzenie, zgłoś roszczenia do tronu Wysokiego Króla, by zjednoczyć Irlandię, i wreszcie przekrocz morze, by podbić samą Anglię."
 gae_gaelic_ireland_mission_pack_CRITERIA_DESCRIPTION:0 "Zjednocz klan, zostań Wysokim Królem nad całą Irlandią i podbij Anglię."
 gae_gaelic_ireland_mission_pack_BUTTON_TOOLTIP:0 "Od podzielonego klanu do Wysokiego Króla, który podbił Anglię."
 gae_gaelic_ireland_mission_pack_BUTTON_DETAILS:0 "Podnieś gaelicki sztandar nad Szmaragdową Wyspą — i za morzem również!"
 gae_gaelic_resurgence: "Gaelickie odrodzenie"
 gae_gaelic_resurgence_desc: "Wśród chaosu Czarnej Śmierci i inwazji Bruce’a angielskie panowanie kolonialne chwieje się — era gaelickich panów powraca na tę wyspę."
 gae_brehon_law: "Zachowaj Prawo Brehońskie"
 gae_brehon_law_desc: "Prawo Brehońskie, tradycja prawna niepodległa ani rzymskiemu, ani angielskiemu zwyczajowi — zachowaj ten starożytny system jako fundament rządów."
 gae_fili_and_bards: "Fili i bardowie"
 gae_fili_and_bards_desc: "Fili, uczeni poeci przechowujący historię i rodowód klanu — otocz opieką ich sztukę i pozwól, by honor klanu był opiewany przez pokolenia."
 gae_gallowglass_recruitment: "Zwerbuj Gallóglaigh"
 gae_gallowglass_recruitment_desc: "Groźni wojownicy ze szkockich wysp — powitaj tych „Gallóglaigh” w swoich szeregach i wzmocnij potęgę klanu."
 gae_clan_unification: "Zjednocz klan"
 gae_clan_unification_desc: "Podzielone gałęzie boczne i sporne ziemie — zbierz je razem i ustanów swój autorytet jako wódz."
 gae_lord_of_the_clan: "Pan klanu"
 gae_lord_of_the_clan_desc: "Prawo, poezja, oręż i zjednoczony rodowód — zbuduj na tym wszystkim i stań się prawdziwym panem klanu."
 gae_rout_the_settlers: "Rozgromić osadników"
 gae_rout_the_settlers_desc: "Angielscy osadnicy, ich szeregi przerzedzone zarazą — wykorzystaj tę okazję i wypędź ich z tej ziemi."
 gae_ostmen_towns: "Miasta Ostmanów"
 gae_ostmen_towns_desc: "Miasta portowe, dawno założone przez potomków Wikingów, Ostmanów — zajmij takie miasta jak Dublin i Waterford."
 gae_resurgence_triumphant: "Triumf odrodzenia"
 gae_resurgence_triumphant_desc: "Rozgromienie osadników i zajęcie miast Ostmanów — gaelickie odrodzenie osiąga tutaj swój pierwszy triumf."
 gae_ulster_hegemony: "Hegemonia nad Ulsterem"
 gae_ulster_hegemony_desc: "Ulster, północna ziemia O’Neillów i O’Donnellów — ustanów hegemonię nad tym regionem."
 gae_connaught_hegemony: "Hegemonia nad Connachtem"
 gae_connaught_hegemony_desc: "Connacht, dzika ziemia zachodu — jako dziedzic chwały O’Connorów, władaj tym regionem."
 gae_munster_hegemony: "Hegemonia nad Munsterem"
 gae_munster_hegemony_desc: "Munster na południu, ziemia MacCarthych i O’Brienów — zdobądź hegemonię nad tym bogatym regionem."
 gae_leinster_hegemony: "Hegemonia nad Leinsterem"
 gae_leinster_hegemony_desc: "Leinster, graniczący z samym Pale — ustanów hegemonię nad tym strategicznie ważnym regionem."
 gae_high_king_of_ireland: "Wysoki Król Irlandii"
 gae_high_king_of_ireland_desc: "Starożytny tytuł Ard Rí, Wysokiego Króla, drzemiący na wzgórzu Tara — przekrocz erę podziałów i wskrześ ten najzaszczytniejszy rangę."
 gae_conquer_the_pale: "Podbij Pale"
 gae_conquer_the_pale_desc: "Pale, ostatni przyczółek Anglii wokół Dublina — przywróć tę ziemię w gaelickie ręce."
 gae_expel_the_english: "Wypędź Anglików"
 gae_expel_the_english_desc: "Ostatnie resztki angielskiej władzy, wciąż czepiające się tej wyspy — zmieć je całkowicie."
 gae_master_of_the_emerald_isle: "Pan Szmaragdowej Wyspy"
 gae_master_of_the_emerald_isle_desc: "Tron Wysokiego Króla, podbój Pale i całkowite wypędzenie Anglików — Irlandia stała się na powrót prawdziwie gaelicka."
 gae_gaelic_fleet: "Zbuduj gaelicką flotę"
 gae_gaelic_fleet_desc: "By przekroczyć morze do samej Anglii — zbuduj potężną flotę i zwróć wzrok ku ojczyźnie dawnych najeźdźców."
 gae_invade_wales: "Najedź Walię"
 gae_invade_wales_desc: "Walia, ziemia pokrewnej krwi celtyckiej — wyląduj na tych brzegach i zabezpiecz przyczółek przeciwko Anglii."
 gae_war_on_england: "Wojna przeciw Anglii"
 gae_war_on_england_desc: "Nadszedł czas, by odwrócić bieg historii — rzuć wyzwanie Anglii, dawnemu najeźdźcy, twarzą w twarz."
 gae_conquest_of_england: "Podbój Anglii dokonany"
 gae_conquest_of_england_desc: "Ojczyzna tych, którzy niegdyś deptali tę wyspę — ta sama ziemia leży teraz pod panowaniem gaelickiego króla. Historia jest tu całkowicie odwrócona."
 gae_events.1.t: "Wysoki Król wstępuje na tron"
 gae_events.1.d: "Na wzgórzu Tara, zgodnie ze starożytnym zwyczajem, ogłoszono nowego Wysokiego Króla. Era podziałów dobiega tu końca."
 gae_events.1.a: "Chwała Wysokiemu Królowi!"
 gae_events.2.t: "Pan Szmaragdowej Wyspy"
 gae_events.2.d: "Wraz z upadkiem Pale i całkowitym wypędzeniem Anglików, ta wyspa wreszcie stała się na powrót prawdziwie gaelicka."
 gae_events.2.a: "Chwała Irlandii!"
 gae_events.99.t: "Podbój Anglii dokonany"
 gae_events.99.d: "Ojczyzna Anglii, która niegdyś deptała tę wyspę, klęka teraz przed tronem gaelickiego króla. Historia jest całkowicie odwrócona."
 gae_events.99.a: "Historia odwrócona!"
 STATIC_MODIFIER_NAME_gae_resurgence_mod: "Gaelickie odrodzenie"
 STATIC_MODIFIER_DESC_gae_resurgence_mod: "Odkąd zaraza przerzedziła populację osadników, język i obyczaje tej ziemi znów rozprzestrzeniają się po kraju."
 STATIC_MODIFIER_NAME_gae_brehon_mod: "Prawo Brehońskie zachowane"
 STATIC_MODIFIER_DESC_gae_brehon_mod: "Pamięć precedensów, przekazywana przez pokolenia prawników brehońskich, nakazuje więcej zaufania niż jakikolwiek kodeks pisany."
 STATIC_MODIFIER_NAME_gae_bards_mod: "Fili i bardowie"
 STATIC_MODIFIER_DESC_gae_bards_mod: "Uczniowie-fili wciąż spędzają siedem lat, ucząc się na pamięć rodowodu i czynów klanu."
 STATIC_MODIFIER_NAME_gae_gallowglass_mod: "Gallóglaigh zwerbowani"
 STATIC_MODIFIER_DESC_gae_gallowglass_mod: "Wojownicy z toporami, którzy przybyli morzem z Hebrydów, tworzą teraz rdzeń stałej siły klanu."
 STATIC_MODIFIER_NAME_gae_clan_mod: "Klan zjednoczony"
 STATIC_MODIFIER_DESC_gae_clan_mod: "Sąsiedni wodzowie, związani małżeństwem i paktem, patrzą teraz ponad dawnymi waśniami na wspólnego wroga."
 STATIC_MODIFIER_NAME_gae_lord_clan_mod: "Pan klanu"
 STATIC_MODIFIER_DESC_gae_lord_clan_mod: "Wybrany zgodnie ze starożytnym zwyczajem tanistry, ten wódz dowodzi teraz mieczami każdej gałęzi bocznej."
 STATIC_MODIFIER_NAME_gae_rout_settlers_mod: "Osadnicy rozgromieni"
 STATIC_MODIFIER_DESC_gae_rout_settlers_mod: "Rezydencje osadników, przerzedzonych zarazą, stoją opuszczone, jedna po drugiej wracając do dzikości."
 STATIC_MODIFIER_NAME_gae_ostmen_mod: "Miasta Ostmanów"
 STATIC_MODIFIER_DESC_gae_ostmen_mod: "Z nabrzeży, na których pracują potomkowie normańskiej krwi, wypływają bez końca statki załadowane skórami i wełną."
 STATIC_MODIFIER_NAME_gae_triumphant_mod: "Triumf odrodzenia"
 STATIC_MODIFIER_DESC_gae_triumphant_mod: "Po pół wieku odwrotu angielska kolonia została zepchnięta do zwykłego pasa wybrzeża."
 STATIC_MODIFIER_NAME_gae_ulster_mod: "Hegemonia nad Ulsterem"
 STATIC_MODIFIER_DESC_gae_ulster_mod: "Pod imieniem O’Neill stoją teraz zebrani wojownicy z dziewięciu hrabstw północy."
 STATIC_MODIFIER_NAME_gae_connaught_hegemony_mod: "Hegemonia nad Connachtem"
 STATIC_MODIFIER_DESC_gae_connaught_hegemony_mod: "Jako dziedzice krwi O’Connorów, zaciągi klanów zamieszkujących zachodnie pustkowia przyjmowane są jako oczywistość."
 STATIC_MODIFIER_NAME_gae_munster_mod: "Hegemonia nad Munsterem"
 STATIC_MODIFIER_DESC_gae_munster_mod: "Od wzgórz Decies po port Cork bogactwo obfitego południa napełnia skarbiec."
 STATIC_MODIFIER_NAME_gae_leinster_mod: "Hegemonia nad Leinsterem"
 STATIC_MODIFIER_DESC_gae_leinster_mod: "Gaelicki poborcy podatkowi docierają teraz aż do samego rowu Pale."
 STATIC_MODIFIER_NAME_gae_conquer_pale_mod: "Pale podbite"
 STATIC_MODIFIER_DESC_gae_conquer_pale_mod: "Angielski sztandar, który niegdyś powiewał na wieżach Zamku Dublińskiego, został wreszcie opuszczony."
 STATIC_MODIFIER_NAME_gae_expel_english_mod: "Anglicy wypędzeni"
 STATIC_MODIFIER_DESC_gae_expel_english_mod: "Obce panowanie nad tą wyspą, rozpoczęte za czasów Henryka II, dobiegło wreszcie całkowitego końca."
 STATIC_MODIFIER_NAME_gae_fleet_mod: "Gaelicka flota zbudowana"
 STATIC_MODIFIER_DESC_gae_fleet_mod: "Gaelickie żeglarze, niegdyś obawiani jedynie jako rozbójnicy, dowodzą teraz prawdziwą własną flotą."
 STATIC_MODIFIER_NAME_gae_war_england_mod: "Wojna przeciw Anglii"
 STATIC_MODIFIER_DESC_gae_war_england_mod: "Wojna, którą przynieśli na tę wyspę półtora wieku temu, teraz spada na ich własną ziemię."
 STATIC_MODIFIER_NAME_gae_high_king_mod: "Wysoki Król Irlandii"
 STATIC_MODIFIER_DESC_gae_high_king_mod: "Siedziba Ard Rí, opuszczona od czasów Briana Boru, znów znalazła swego pana na wzgórzu Tara."
 STATIC_MODIFIER_NAME_gae_emerald_isle_mod: "Pan Szmaragdowej Wyspy"
 STATIC_MODIFIER_DESC_gae_emerald_isle_mod: "Od brzegu do brzegu nie pozostał już żaden obcy urzędnik na tej wyspie."
 STATIC_MODIFIER_NAME_gae_conquest_england_mod: "Historia odwrócona"
 STATIC_MODIFIER_DESC_gae_conquest_england_mod: "Na tronie, niegdyś zajmowanym przez samozwańczych zdobywców, zasiada teraz gaelicki król."
