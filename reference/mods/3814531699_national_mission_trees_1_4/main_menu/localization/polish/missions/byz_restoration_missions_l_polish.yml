l_polish:
 byz_restoration_mission_pack: "Odbudowa Cesarstwa Rzymskiego"
 byz_restoration_mission_pack_desc: "Odzyskaj Konstantynopol, ponownie zajmij Anatolię i Bałkany, zjednocz cztery patriarchaty, zatriumfuj w Rzymie i odbuduj największy zasięg starożytnego Cesarstwa Rzymskiego."
 byz_restoration_mission_pack_BUTTON_TOOLTIP:0 "Odbuduj ziemie Cesarstwa Rzymskiego."
 byz_restoration_mission_pack_DESCRIPTION:0 "Ocal chylące się ku upadkowi cesarstwo i odbuduj jego dawny blask. Jako dziedzic dziedzictwa Rzymu, ponownie przywiedź starożytne ziemie Wschodu i Zachodu pod sztandar cesarski."
 byz_restoration_mission_pack_BUTTON_DETAILS:0 "Odbuduj Cesarstwo Bizantyjskie z krawędzi upadku i przywróć do swego królestwa świat śródziemnomorski, którym niegdyś rządził Rzym. Urzeczywistnij marzenie Renovatio Imperii!"
 byz_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Odzyskaj jako Bizancjum starożytne ziemie rzymskie i osiągnij Renovatio Imperii."
 byz_retake_anatolia_west: "Odzyskaj Zachodnią Anatolię"
 byz_retake_anatolia_west_desc: "Odzyskaj Smyrnę, by przywrócić władzę cesarską w Zachodniej Anatolii."
 byz_retake_anatolia_east: "Odzyskaj Wschodnią Anatolię"
 byz_retake_anatolia_east_desc: "Podbij Ankarę, Konyę i Sivas, by przywieść całą Anatolię pod kontrolę cesarską. Rządzenie żyjącymi tu ludami kultury greckiej będzie wymagało nowego podejścia administracyjnego."
 byz_secure_greece: "Odbuduj Grecję"
 byz_secure_greece_desc: "Odzyskaj Ateny i Korynt i wskrześ prawosławie i kulturę grecką w Helladzie."
 byz_balkan_dominance: "Panowanie nad Bałkanami"
 byz_balkan_dominance_desc: "Podbij Belgrad i Tyrnowo, by przywrócić porządek imperialny na całych Bałkanach."
 byz_invasion_of_syria: "Inwazja na Syrię"
 byz_invasion_of_syria_desc: "Podbij ziemie Syrii, w tym Antiochię, jeden z pięciu wielkich patriarchatów. Starożytne szlaki handlowe i bogate ośrodki produkcyjne przyniosą imperium nowy dobrobyt."
 byz_protect_jerusalem: "Obrona Jerozolimy"
 byz_protect_jerusalem_desc: "Odzyskaj Ziemię Świętą, gdzie cierpiał Chrystus. Cesarz rzymski ma obowiązek strażnika świętych miejsc. Ustanów tolerancyjne rządy, by ludy wielu wiar mogły żyć w pokoju na tej ziemi."
 byz_dominion_of_aegyptus: "Panowanie nad Egiptem"
 byz_dominion_of_aegyptus_desc: "Zabezpiecz Aleksandrię i Kair, wielkie siedziby egipskiej nauki. Żyzne ziemie Nilu będą karmić wiele narodów imperium."
 byz_control_aegean: "Opanuj Morze Egejskie"
 byz_control_aegean_desc: "Zabezpiecz Kretę i zbuduj potężną flotę, by utrzymać pełne panowanie nad Morzem Egejskim."
 byz_retake_italy_south: "Odzyskaj Południowe Włochy"
 byz_retake_italy_south_desc: "Odzyskaj Neapol i Sycylię, by ustanowić przyczółek na półwyspie włoskim."
 byz_reclaim_rome: "Odzyskaj Wieczne Miasto"
 byz_reclaim_rome_desc: "Odzyskaj Wieczne Miasto Rzym. Nadszedł czas, by prawowity dziedzic Cesarstwa Rzymskiego odzyskał zachodnią stolicę."
 byz_iberian_conquest: "Podbij Iberię"
 byz_iberian_conquest_desc: "Podbij Toledo i Kordobę, by przywrócić imperium starożytną prowincję Hispanię."
 byz_north_africa: "Odzyskaj Afrykę Północną"
 byz_north_africa_desc: "Podbij Tunis, Trypolis i Algier, by przywrócić imperium starożytną prowincję Afrykę."
 byz_north_italy: "Północne Włochy"
 byz_north_italy_desc: "Podbij Wenecję, Genuę, Mediolan i Florencję, by zjednoczyć półwysep włoski pod imieniem rzymskim."
 byz_invasion_of_france: "Inwazja na Francję"
 byz_invasion_of_france_desc: "Ze zabezpieczonymi Północnymi Włochami i Iberią wzrok imperium zwraca się ku Galii. Podbij cały region Francji i dopełnij terytorium imperialne na zachodzie."
 byz_renovatio_imperii: "Renovatio Imperii"
 byz_renovatio_imperii_desc: "Odbudowa imperium. Od Iberii po Galię, od Afryki Północnej po Włochy, od Azji Mniejszej po Bałkany i Ziemię Świętą. Wymaga 1000+ prowincji i 2000+ miesięcznego dochodu."
 byz_events.2.t: "Dobrobyt Smyrny"
 byz_events.2.d: "Smyrna i porty Zachodniej Anatolii odzyskane. Te starożytne miasta handlowe znów stają się posiadłością bizantyjskich kupców, a handel na Morzu Egejskim ożywa."
 byz_events.2.a: "Wspierać handel w Smyrnie"
 byz_events.3.t: "Ateny — odbudowa Hellady"
 byz_events.3.d: "Ateny i Korynt odzyskane. Miasto Sokratesa i Platona, wzgórze, na którym stoi Partenon, znów bizantyjskie. Klasztory prawosławne są odbudowywane, a uczoność grecka ożywa."
 byz_events.3.a: "Przywrócić prawosławie i kulturę grecką w Helladzie"
 byz_events.7.t: "Południowe Włochy odzyskane"
 byz_events.7.d: "Neapol i Palermo odzyskane. Te ziemie, niegdyś kwitnące Wielką Grecją, znów są częścią Cesarstwa Rzymskiego. Bogactwo handlu śródziemnomorskiego płynie do skarbca imperialnego."
 byz_events.7.a: "Włączyć Południowe Włochy do imperium"
 byz_events.8.t: "Wieczne Miasto — wjazd do Rzymu"
 byz_events.8.d: "Rzym — miasto siedmiu wzgórz, miejsce męczeńskiej śmierci Piotra i Pawła — odzyskany. Jak niegdyś Konstantyn Wielki rządził imperium z tego miejsca, tak teraz znów cesarz rzymski zasiada w Rzymie. Historia się dokonała."
 byz_events.8.a: "Uczynić Wieczne Miasto zachodnią stolicą"
 byz_events.10.t: "Renovatio Imperii"
 byz_events.10.d: "Odbudowa Cesarstwa Rzymskiego. Od Iberii po Azję Mniejszą, od Afryki Północnej po Bałkany, od Włoch po Ziemię Świętą. To, do czego dążył Justynian Wielki w latach 527-565, o czym marzono przez całe średniowiecze — odbudowa Cesarstwa Rzymskiego wreszcie stała się rzeczywistością. Morze Śródziemne znów jest Mare Nostrum."
 byz_events.10.a: "Ogłosić światu Renovatio Imperii"
 byz_renovatio_unlock_tt: "Renovatio Imperii osiągnięte."
 byz_reclaim_bursa: "Odzyskaj Bursę"
 byz_reclaim_bursa_desc: "Odzyskaj Bursę, niegdyś znaczące miasto bizantyjskie. Położone w kluczowym punkcie Jedwabnego Szlaku, przyszły kierunek rzemiosła tego miasta pozostawiono do decyzji imperium."
 byz_avoid_collapse: "Odwróć upadek"
 byz_avoid_collapse_desc: "Imperium chwieje się na krawędzi upadku. Lecz jeśli legitymizacja i stabilność wewnętrzna mogą zostać zachowane, droga do odbudowy nie jest jeszcze zamknięta."
 byz_events.20.t: "Przyszłość Bursy"
 byz_events.20.d: "W warsztatach Bursy rzemieślnicy spierają się o nową drogę produkcji. Czy budować na długiej tradycji miasta w tkactwie jedwabnym, czy skupić się na produkcji cieńszej tkaniny? Decyzja imperium ukształtuje przyszłość miasta."
 byz_events.20.a: "Wspierać produkcję jedwabiu"
 byz_events.20.b: "Skupić się na produkcji cienkiej tkaniny"
 byz_events.21.t: "Przyszłość Nikomedii"
 byz_events.21.d: "Nikomedia, kluczowe miasto na południowym brzegu Morza Marmara, wróciła do imperium. Dwór spiera się, jakie rzemiosło zdefiniuje przyszłość tego miasta: wspierać produkcję uzbrojenia czy zasadzić morwy i rozpocząć produkcję jedwabiu."
 byz_events.21.a: "Wspierać produkcję uzbrojenia"
 byz_events.21.b: "Zasadzić morwy i rozpocząć produkcję jedwabiu"
 byz_reclaim_nicomedia: "Odzyskaj Nikomedię"
 byz_reclaim_nicomedia_desc: "Nikomedia (Izmit) — kluczowe miasto na południowym brzegu Morza Marmara. Przekształć jego produkcję surowców w jedwab i odbuduj jedwabną gospodarkę imperium. Zabezpieczenie 50%+ kontroli wyznacza pierwszy krok ku odbudowie Cesarstwa Rzymskiego."
 byz_orthodox_antioch: "Nawróć Antiochię na prawosławie"
 byz_orthodox_antioch_desc: "Potwierdź, że większość populacji Antiochii nawróciła się na prawosławie. Niech miasto, gdzie po raz pierwszy zabrzmiało imię „chrześcijanin”, znów napełni się światłem prawosławia."
 byz_orthodox_jerusalem: "Nawróć Jerozolimę na prawosławie"
 byz_orthodox_jerusalem_desc: "Potwierdź, że większość populacji Jerozolimy nawróciła się na prawosławie. Dzwony Bazyliki Grobu Pańskiego biją prawosławną liturgią."
 byz_orthodox_alexandria: "Nawróć Aleksandrię na prawosławie"
 byz_orthodox_alexandria_desc: "Potwierdź, że większość populacji Aleksandrii nawróciła się na prawosławie. Tradycje Kościoła Koptyjskiego włączane są do nurtu prawosławnego."
 byz_orthodox_rome: "Koniec Wielkiej Schizmy"
 byz_orthodox_rome_desc: "Potwierdź, że większość populacji Rzymu nawróciła się na prawosławie. Schizma 1054 roku się kończy — nie pojednaniem, lecz triumfem prawosławia nad Rzymem."
 byz_hellenic_athens: "Odrodzenie Partenonu"
 byz_hellenic_athens_desc: "Ateny — miasto Ateny. Znów na Akropolu składane są ofiary bogom olimpijskim, a odrodzenie wiary hellenistycznej zaczyna się tutaj."
 byz_hellenic_corinth: "Sanktuarium Posejdona w Koryncie"
 byz_hellenic_corinth_desc: "Na Przesmyku Korynckim Posejdon — strażnik dwóch mórz — niegdyś dzierżył wielką świątynię. Odbuduj to sanktuarium i przyciągnij błogosławieństwo boga morza do imperium."
 byz_hellenic_mystras: "Sanktuarium Apolla w Mistrze"
 byz_hellenic_mystras_desc: "Mistra koło Sparty — duchowe serce Peloponezu. Odbuduj tu sanktuarium Apolla i obudź odważnego ducha Sparty, niosącego pamięć wyroczni delfickiej."
 byz_hellenic_alexandria: "Odbudowa Serapeum"
 byz_hellenic_alexandria_desc: "Serapeum Aleksandrii było niegdyś jedną z największych świątyń świata starożytnego. Poświęcone Serapisowi — zrodzonemu ze zlania religii greckiej i egipskiej — jego odbudowa ustanawia religię hellenistyczną w Egipcie i na nowo jednoczy mądrość świata starożytnego."
 byz_events.11.t: "Antiochia — powrót do pierwszego kościoła"
 byz_events.11.d: "Antiochia, gdzie po raz pierwszy zabrzmiało imię „chrześcijanin”, jest teraz napełniona światłem prawosławia. Pamięć o pracach Piotra i Pawła jest tu odrodzona, a miasto przyjmuje nową misję duchowego centrum prawosławia."
 byz_events.11.a: "Postawić Antiochię pod opieką prawosławną"
 byz_events.12.t: "Jerozolima — prawosławne dzwony w Świętym Mieście"
 byz_events.12.d: "Święte Miasto Jerozolima, upragnione przez wszystkich wiernych prawosławnych, stało się miastem prawosławnym. Bazylika Grobu Pańskiego znów dzwoni wschodnią liturgią. To nie tylko podbój — to triumf wiary."
 byz_events.12.a: "Strzec Ziemi Świętej na wieki"
 byz_events.13.t: "Aleksandria — prawosławizacja miasta nauki"
 byz_events.13.d: "Aleksandria, skarbnica starożytnej wiedzy, stała się miastem prawosławnym. Starożytne tradycje Kościoła Koptyjskiego zlewają się z szerszym nurtem prawosławnym, a dialog między filozofią neoplatońską a teologią zaczyna znów rozkwitać."
 byz_events.13.a: "Rozwinąć Aleksandrię miastem nauki prawosławnej"
 byz_events.14.t: "Koniec Wielkiej Schizmy — jedność kościołów"
 byz_events.14.d: "Od 1054 roku, kiedy papież Leon IX i patriarcha Cerulariusz wzajemnie się ekskomunikowali, minęły wieki. Nie pojednaniem, lecz prawosławnym podbojem Rzymu — Wielka Schizma się kończy. Większość obywateli Rzymu nawróciła się na prawosławie. Wieczne Miasto staje się zachodnim filarem Kościoła wschodniego. Historia wybrała wiarę bizantyjską."
 byz_events.14.a: "Ogłosić światu koniec Wielkiej Schizmy"
 byz_events.15.t: "Partenon — przebudzenie Ateny"
 byz_events.15.d: "Znów na Akropolu składane są ofiary Atenie. Partenon, który stał się kościołem chrześcijańskim, odbudowany jako świątynia dawnych bogów. Lud Aten wzywa bogów olimpijskich po imieniu, a płomień hellenizmu rozpala się na nowo."
 byz_events.15.a: "Skierować imperium pod ochroną Ateny"
 byz_events.16.t: "Korynt — Posejdon cieśnin"
 byz_events.16.d: "Na wzgórzu Koryntu, spoglądającym na dwa morza, odbudowywana jest świątynia Posejdona. Bóg przesmyku długo chronił kupców i żeglarzy. Z odbudową jego obrzędów Korynt znów staje się duchowym centrum handlu śródziemnomorskiego."
 byz_events.16.a: "Pozwolić handlowi prosperować pod błogosławieństwem Posejdona"
 byz_events.17.t: "Delos — ojczyzna boga światła"
 byz_events.17.d: "Na świętej wyspie egejskiej Delos, czczonej jako ojczyzna Apolla i Artemidy, odbudowywana jest starożytna świątynia. Pielgrzymi i kapłani zbierają się z całego Morza Egejskiego, a duch starożytnego greckiego rozumu i piękna się odradza. Imperium neoplatońskie, o którym marzył Pleton, zaczyna nabierać kształtu."
 byz_events.17.a: "Oświetlić imperium blaskiem Delos"
 byz_events.18.t: "Serapeum — dopełnienie odrodzenia hellenistycznego"
 byz_events.18.d: "Aleksandria — w tej ziemi, gdzie niegdyś stało Serapeum, wiara w bogów hellenistycznych powróciła.\n\nZ ukończoną odbudową świątyni bogowie Olimpu znów zstępują na wielką ziemię nad Nilem. Obywatele Aleksandrii znów odprawiają starożytne obrzędy, a modlitwy do Serapisa rozbrzmiewają przez poranne niebo.\n\nTo święte odrodzenie wysyła fale wiary hellenistycznej po całym Cesarstwie Bizantyjskim — nowi nawróceni pojawiają się jeden po drugim, siła znaków rośnie, a wpływ religijny wzrasta. Zeus, Apollo, Atena — wszyscy bogowie błogosławią odbudowę imperium."
 byz_events.18.a: "Uczynić Serapeum świętym miastem świata hellenistycznego"
 byz_faith_choice: "Wybór wiary"
 byz_faith_choice_desc: "Nowa era idei się rozpoczyna. Na dworze w Mistrze dyskutowana jest nauka neoplatońska, podczas gdy w Konstantynopolu władza kościoła prawosławnego jest kwestionowana. Imperium stoi na duchowym skrzyżowaniu."
 byz_faith_orthodox_chosen_tt: "Wybrano prawosławie"
 byz_faith_hellenic_chosen_tt: "Wybrano hellenizm"
 byz_events.19.t: "Skrzyżowanie wiary — prawosławie czy hellenizm"
 byz_events.19.d: "Grecja odzyskana. Z Akropolu Aten w oddali widać Konstantynopol, a ruiny starożytnych świątyń drzemią na szczytach Peloponezu. Odbudowa Cesarstwa Bizantyjskiego to nie tylko odzyskanie terytorium — to odbudowa duszy. Dwa głosy spierają się na dworze imperialnym. Jeden należy do duchowieństwa: „Jesteśmy ludem Chrystusa. Musimy odbudować imperium strażnikiem kościoła prawosławnego”. Drugi należy do filozofów hellenistycznych: „Dlaczego czcić obcego boga na ziemi Platona i Arystotelesa? Starożytni bogowie greccy są prawdziwym domem naszych dusz”."
 byz_events.19.a: "Zachować kościół prawosławny — chronić tradycję wschodnią"
 byz_events.19.a.tt: "Odblokowana gałąź prawosławna wiary. Kontynuuj do misji prawosławizacji Antiochii, Jerozolimy, Aleksandrii i Rzymu."
 byz_events.19.b: "Wskrzesić dawnych bogów — na nowo rozpalić płomień hellenistyczny"
 byz_events.19.b.tt: "Odblokowana gałąź hellenistyczna. Imperium zwraca się ku hellenizmowi, a dostępne stają się misje odbudowy sanktuariów w Atenach, Koryncie, Mistrze i Aleksandrii."
 byz_orthodox_path_start: "Ścieżka prawosławna"
 byz_orthodox_path_start_desc: "Ścieżka prawosławnego strażnika otwarta. Kontynuuj odzyskiwanie i prawosławizację świętych miast."
 byz_hellenic_path_start: "Ścieżka hellenistyczna"
 byz_hellenic_path_start_desc: "Ścieżka dawnych bogów otwarta. Odbuduj sanktuaria Hellady i odbuduj na nowo starożytną cywilizację grecką."
 byz_recovery_from_decline: "Odrodzenie po upadku"
 byz_recovery_from_decline_desc: "Ujarzmij władzę szlachty dworskiej i odbuduj władzę korony. W miarę odbudowywania władzy imperialnej stabilność w rządach nastąpi."
 byz_city_the_world_desires: "Miasto pożądane przez świat"
 byz_city_the_world_desires_desc: "Konstantynopol znów wyrósł na wielkie miasto, które ludzie z całego świata pragną zobaczyć. Niech ten dobrobyt stanie się wieczny."
 byz_islamic_heartland: "Serce islamu"
 byz_islamic_heartland_desc: "Mekka i Medyna, dwa najświętsze miasta islamu, upadły w nasze ręce. Imperium musi teraz podjąć decyzję o losie tych świętych miejsc."
 byz_events.22.t: "Święte miejsca islamu"
 byz_events.22.d: "Kaaba w Mekce i Meczet Proroka w Medynie — najświętsze miejsca świata islamskiego — są teraz pod kontrolą imperialną. Zniszczyć je, by pokazać zwierzchność prawosławia, czy przyjąć je, by imperium czerpało korzyści z bogactwa pielgrzymów?"
 byz_events.22.a: "Zniszczyć święte miejsca"
 byz_events.22.b: "Przyjąć święte miejsca"
 STATIC_MODIFIER_NAME_byz_anatolia_west: "Zachodnia Anatolia odbudowana"
 STATIC_MODIFIER_DESC_byz_anatolia_west: "Różnorodne ludy Zachodniej Anatolii stopniowo włączane są do kultury imperium."
 STATIC_MODIFIER_NAME_byz_anatolia_east: "Wschodnia Anatolia"
 STATIC_MODIFIER_DESC_byz_anatolia_east: "Różnorodne ludy Wschodniej Anatolii stopniowo włączane są do kultury imperium."
 STATIC_MODIFIER_NAME_byz_greece_restored: "Hellada odbudowana"
 STATIC_MODIFIER_DESC_byz_greece_restored: "Ateny, Saloniki, Peloponez — serce starożytnej cywilizacji greckiej i kultury bizantyjsko-greckiej. Odzyskanie tych ziem po rządach łacińskich (frankońskim Księstwie Aten i innych), splądrowaniu przez Kompanię Katalońską i podboju przez Osmanów jest spełnieniem tysiącletniego marzenia odrodzonego „hellenizmu”."
 STATIC_MODIFIER_NAME_byz_balkan_order: "Porządek bałkański"
 STATIC_MODIFIER_DESC_byz_balkan_order: "Siła żywa i potęga wojskowa Bałkanów wzmocnione."
 STATIC_MODIFIER_NAME_byz_syria_province: "Prowincja Syria"
 STATIC_MODIFIER_DESC_byz_syria_province: "Syria była od czasów starożytnych centrum handlu i rzemiosła jako zachodni kraniec Jedwabnego Szlaku. Stal damasceńska, mydło z Aleppo, szkło syryjskie — te słynne towary wywożono po całym świecie śródziemnomorskim. W IV-VII wieku była też najbogatszą prowincją Cesarstwa Bizantyjskiego, przynoszącą ogromne dochody podatkowe."
 STATIC_MODIFIER_NAME_byz_judaea_province: "Prowincja Judea"
 STATIC_MODIFIER_DESC_byz_judaea_province: "Zarządzanie Judeą, domem Ziemi Świętej, sprzyja większej tolerancji dla wielu wiar imperium."
 STATIC_MODIFIER_NAME_byz_aegyptus_province: "Prowincja Egipt"
 STATIC_MODIFIER_DESC_byz_aegyptus_province: "Żyzne ziemie Nilu pozwalają imperium utrzymać większą populację we wszystkich jego prowincjach."
 STATIC_MODIFIER_NAME_byz_aegean_mastery: "Opanowanie Morza Egejskiego"
 STATIC_MODIFIER_DESC_byz_aegean_mastery: "W portach Wysp Egejskich nieustannie cumują okręty wojenne i handlowe imperium, a morze znów stało się „naszym morzem”."
 STATIC_MODIFIER_NAME_byz_rome_restored: "Wieczne Miasto odbudowane"
 STATIC_MODIFIER_DESC_byz_rome_restored: "Gdy sztandar Bizancjum znów powiewał nad siedmioma wzgórzami, dwór w Konstantynopolu wiedział, że imperium wreszcie osiągnęło swój szczyt."
 STATIC_MODIFIER_NAME_byz_hispania_province: "Prowincja Hispania"
 STATIC_MODIFIER_DESC_byz_hispania_province: "Rozległe ziemie Hiszpanii wysyłają wielu żołnierzy, by pomnożyć szeregi armii imperialnej."
 STATIC_MODIFIER_NAME_byz_gallia_province: "Prowincja Galia"
 STATIC_MODIFIER_DESC_byz_gallia_province: "Rzymskie orły znów latają nad równinami Galii, a żołnierze na brzegach Loary maszerują z dumą za cesarza, dalekiego na wschodzie."
 STATIC_MODIFIER_NAME_byz_true_rome: "Prawdziwy Rzym"
 STATIC_MODIFIER_DESC_byz_true_rome: "Żagle i wozy kupców Wenecji, Genui i Mediolanu prowadzą teraz swój handel pod sztandarem cesarza. Półwysep włoski nie jest już gałęzią Rzymu, lecz jego pniem."
 STATIC_MODIFIER_NAME_byz_renovatio_imperii_mod: "Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_imperii_mod: "Cesarstwo Rzymskie w pełni odbudowane — drogi, o których marzył Justynian, znów łączą każdy zakątek imperium, a gońcy cesarza jeżdżą bez przeszkód do dalekich brzegów Morza Śródziemnego."
 STATIC_MODIFIER_NAME_byz_collapse_averted: "Upadek odwrócony"
 STATIC_MODIFIER_DESC_byz_collapse_averted: "Imperium jeszcze nie upadło. Przetrwawszy kryzys, dwór łagodzi ciężar pozbawiania przywilejów potężnych i osłabia opór wobec takich reform."
 STATIC_MODIFIER_NAME_byz_bursa_silk: "Handel jedwabiem Bursy"
 STATIC_MODIFIER_DESC_byz_bursa_silk: "W gajach morwowych Bursy dźwięk przędących jedwabników nigdy nie milknie w wiosenne noce."
 STATIC_MODIFIER_NAME_byz_bursa_fine_cloth: "Handel cienką tkaniną Bursy"
 STATIC_MODIFIER_DESC_byz_bursa_fine_cloth: "Z krosien warsztatów Bursy wychodzą jedna po drugiej cienkie tkaniny, o które rywalizują dworzanie."
 STATIC_MODIFIER_NAME_byz_nicomedia_weaponry: "Handel uzbrojeniem Nikomedii"
 STATIC_MODIFIER_DESC_byz_nicomedia_weaponry: "W kuźniach Nikomedii dzwonią młoty dzień i noc, a miecze i zbroje dla armii imperialnej piętrzą się wysoko."
 STATIC_MODIFIER_NAME_byz_nicomedia_silk: "Handel jedwabiem Nikomedii"
 STATIC_MODIFIER_DESC_byz_nicomedia_silk: "Młode morwy posadzone na wzgórzach wokół Nikomedii, czekając na dzień, gdy miasto zasłynie domem jedwabiu."
 STATIC_MODIFIER_NAME_byz_hellenic_sanctuary: "Sanktuarium hellenistyczne"
 STATIC_MODIFIER_DESC_byz_hellenic_sanctuary: "Znów w sanktuarium dawnych bogów składane są ofiary, a stopy pielgrzymów wycierają kamienie brukowe."
 STATIC_MODIFIER_NAME_byz_hellenic_serapeum: "Serapeum"
 STATIC_MODIFIER_DESC_byz_hellenic_serapeum: "Z odbudową Serapeum Aleksandria stała się duchowym centrum świata starożytnego, a zarówno uczeni, jak i pielgrzymi zbierają się u jej bram."
 STATIC_MODIFIER_NAME_byz_schism_ended: "Koniec Wielkiej Schizmy"
 STATIC_MODIFIER_DESC_byz_schism_ended: "Po wiekach wzajemnych ekskomunik z 1054 roku kościoły Wschodu i Zachodu wreszcie zebrały się przy jednym ołtarzu przez triumf prawosławia."
 STATIC_MODIFIER_NAME_byz_islamic_sites_destroyed: "Święte miejsca zniszczone"
 STATIC_MODIFIER_DESC_byz_islamic_sites_destroyed: "Zniszczenie islamskich świętych miejsc potężnie dowiodło zwierzchności prawosławia i wzmocniło wiarę w religię państwową i prestiż imperium."
 STATIC_MODIFIER_NAME_byz_islamic_sites_accepted: "Święte miejsca przyjęte"
 STATIC_MODIFIER_DESC_byz_islamic_sites_accepted: "Przyjęcie islamskich świętych miejsc pomnożyło tolerancję dla heretyków i pogan, a działalność handlowa rozkwitła wśród napływu pielgrzymów."
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "Odrodzenie po upadku"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "Ciemny czas upadku minął, a poranne światło znów jaśnieje nad dworem cesarza i polami imperium."
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "Miasto pożądane przez świat"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "Konstantynopol odbudowany jako centrum administracyjne imperium."
 STATIC_MODIFIER_NAME_byz_africa_province_mod: "Prowincja Afryka"
 STATIC_MODIFIER_DESC_byz_africa_province_mod: "Flota imperialna wróciła do portu Kartaginy, a marzenie epoki Justyniana znów rysuje się na morzu."
 STATIC_MODIFIER_NAME_byz_renovatio_bonus_mod: "Chwała Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_bonus_mod: "Odbudowa Cesarstwa Rzymskiego uznała Bizancjum panem imperium światowego."
 STATIC_MODIFIER_NAME_byz_antioch_orthodox_mod: "Prawosławie Antiochii"
 STATIC_MODIFIER_DESC_byz_antioch_orthodox_mod: "Antiochia odbudowana jako świątynia prawosławna, co podnosi władzę religijną imperium."
 STATIC_MODIFIER_NAME_byz_jerusalem_orthodox_mod: "Prawosławie Jerozolimy"
 STATIC_MODIFIER_DESC_byz_jerusalem_orthodox_mod: "Święte Miasto Jerozolima zprawosławnione, co daje korzyści w walce przeciw poganom."
 STATIC_MODIFIER_NAME_byz_alexandria_orthodox_mod: "Prawosławie Aleksandrii"
 STATIC_MODIFIER_DESC_byz_alexandria_orthodox_mod: "Śpiew prawosławny rozbrzmiewa w kościołach Aleksandrii, a rynki są pełne rodzin wiernych."
 STATIC_MODIFIER_NAME_byz_serapeum_restored_mod: "Serapeum odbudowane"
 STATIC_MODIFIER_DESC_byz_serapeum_restored_mod: "Serapeum Aleksandrii odbudowane, a bogowie Olimpu znów zstępują na ziemię Egiptu."
