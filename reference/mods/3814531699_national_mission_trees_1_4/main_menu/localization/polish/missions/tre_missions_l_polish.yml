l_polish:
 tre_trebizond_mission_pack: "Odrodzenie dynastii Komnenów i odbudowa Bizancjum"
 tre_trebizond_mission_pack_DESCRIPTION:0 "W 1337 roku Cesarstwo Trapezuntu przetrwa jako małe państwo na wybrzeżu pontyjskim, dziedzice dynastii Komnenów. Zdobądź handel czarnomorski, odzyskaj Anatolię, wyzwól Konstantynopol i odbuduj Cesarstwo Bizantyjskie."
 tre_trebizond_mission_pack_CRITERIA_DESCRIPTION:0 "Podbij Anatolię, odzyskaj Konstantynopol, podporządkuj Bałkany i odbuduj Cesarstwo Bizantyjskie."
 tre_trebizond_mission_pack_BUTTON_TOOLTIP:0 "Odbuduj Cesarstwo Komnenów."
 tre_trebizond_mission_pack_BUTTON_DETAILS:0 "Z brzegów Pontu odziedzicz dziedzictwo bizantyjskie i maszeruj triumfalnie na Konstantynopol!"
 tre_komnenian_legacy: "Dziedzictwo Komnenów"
 tre_komnenian_legacy_desc: "Dziedzictwo dynastii Komnenów napędza ambicję Trapezuntu, by odbudować wielkość bizantyjską."
 tre_pontus_coast: "Zabezpiecz wybrzeże pontyjskie"
 tre_pontus_coast_desc: "Zabezpiecz linię brzegową pontyjską jako podstawę dominacji w handlu czarnomorskim."
 tre_black_sea_trade: "Handel czarnomorski"
 tre_black_sea_trade_desc: "Zdobądź handel czarnomorski od konkurentów genueńskich i weneckich."
 tre_dev_trebizond: "Rozwiń Trapezunt"
 tre_dev_trebizond_desc: "Rozwiń Trapezunt w kwitnący węzeł, godny Cesarstwa Komnenów."
 tre_orthodox_stronghold: "Bastion prawosławny"
 tre_orthodox_stronghold_desc: "Umocnij klasztory prawosławne, by ustanowić Trapezunt duchowym dziedzicem Bizancjum."
 tre_armenia_campaign: "Podporządkuj Armenię"
 tre_armenia_campaign_desc: "Podporządkuj Armenię, by zabezpieczyć wschodnią granicę i zyskać górskich wojowników."
 tre_cappadocia: "Podbój Kapadocji"
 tre_cappadocia_desc: "Podbij jaskiniowo-klasztorne serce Kapadocji i posuń się ku centralnej Anatolii."
 tre_central_anatolia: "Odzyskaj centralną Anatolię"
 tre_central_anatolia_desc: "Odzyskaj centralną Anatolię, w tym Ankarę, spod rządów tureckich."
 tre_west_anatolia: "Marsz na Zachodnią Anatolię"
 tre_west_anatolia_desc: "Maszeruj na bogate wybrzeże egejskie Zachodniej Anatolii."
 tre_reclaim_nicaea: "Odzyskaj Niceę"
 tre_reclaim_nicaea_desc: "Odzyskaj Niceę i Bursę — bizantyjską stolicę na wygnaniu — i zbliż się do Konstantynopola."
 tre_anatolian_emperor: "Cesarz Anatolii"
 tre_anatolian_emperor_desc: "Zjednocz całą Anatolię pod sztandarem Komnenów."
 tre_thrace_campaign: "Zdobądź Trację"
 tre_thrace_campaign_desc: "Zdobądź Trację, by okrążyć Konstantynopol i przygotować jego wyzwolenie."
 tre_reclaim_constantinople: "Odzyskaj Konstantynopol"
 tre_reclaim_constantinople_desc: "Wyzwól Konstantynopol i przywróć prawosławny krzyż nad Hagia Sophia."
 tre_northern_greece: "Odzyskaj Północną Grecję"
 tre_northern_greece_desc: "Odzyskaj Północną Grecję, w tym Saloniki — drugie miasto Bizancjum."
 tre_bulgaria: "Podbój Bułgarii"
 tre_bulgaria_desc: "Podbij Bułgarię, by umocnić dominację bałkańską."
 tre_morea: "Odzyskaj Moreę"
 tre_morea_desc: "Odzyskaj Moreę i Ateny — serce starożytnej cywilizacji greckiej."
 tre_aegean_islands: "Wyspy egejskie"
 tre_aegean_islands_desc: "Odzyskaj wyspy egejskie spod okupacji łacińskich krzyżowców."
 tre_macedonian_campaign: "Podbój Macedonii"
 tre_macedonian_campaign_desc: "Podbij Macedonię — miejsce narodzin Aleksandra Wielkiego."
 tre_silk_trade: "Handel jedwabiem"
 tre_silk_trade_desc: "Opanuj handel na Jedwabnym Szlaku przez Trapezunt, by zdominować handel Wschód-Zachód."
 tre_komnenian_army: "Armia Komnenów"
 tre_komnenian_army_desc: "Zbuduj armię Komnenów — mieszankę najemników i sił prowincjonalnych."
 tre_greek_culture: "Odrodzenie kultury greckiej"
 tre_greek_culture_desc: "Odrodź naukę i sztuki bizantyjskie, by uczynić Trapezunt latarnią kultury."
 tre_cilicia_campaign: "Podporządkuj Cylicję"
 tre_cilicia_campaign_desc: "Podporządkuj Cylicję, by zabezpieczyć dostęp do Morza Śródziemnego."
 tre_dev_constantinople: "Odbuduj Konstantynopol"
 tre_dev_constantinople_desc: "Odbuduj Konstantynopol jako wspaniałą stolicę odbudowanego Cesarstwa Bizantyjskiego."
 tre_orthodox_patriarch: "Patriarchat prawosławny"
 tre_orthodox_patriarch_desc: "Ustanów Patriarchat Konstantynopola, czyniąc Trapezunt strażnikiem prawosławia."
 tre_georgia_campaign: "Wyprawa gruzińska"
 tre_georgia_campaign_desc: "Poprowadź wyprawę do Gruzji, by zabezpieczyć kaukaską flankę."
 tre_komnenian_navy: "Flota Komnenów"
 tre_komnenian_navy_desc: "Zbuduj potężną flotę, by zdominować Morze Czarne i Egejskie."
 tre_antioch_crusade: "Odzyskaj Antiochię"
 tre_antioch_crusade_desc: "Odzyskaj Antiochię — niegdyś klejnot bizantyjskiej Syrii."
 tre_greek_population: "Wzrost populacji greckiej"
 tre_greek_population_desc: "Zwiększ populację grecką jako kręgosłup kulturowy odbudowanego imperium."
 tre_restore_byzantium: "Odbuduj Bizancjum"
 tre_restore_byzantium_desc: "Ogłoś odbudowę Cesarstwa Bizantyjskiego pod przywództwem Komnenów."
 tre_komnenos_dynasty: "Chwała dynastii Komnenów"
 tre_komnenos_dynasty_desc: "Panuj jako wieczny Cesarz Komnen — następca Rzymu Wschodniego, strażnik prawosławia."
 tre_events.20.t: "Konstantynopol odzyskany — Bizancjum żyje"
 tre_events.20.d: "Konstantynopol w rękach Komnenów! Prawosławny krzyż znów powiewa nad Hagia Sophia. Świat drży — Bizancjum powstało."
 tre_events.20.a: "Niech żyje Konstantynopol w chwale Boga!"
 tre_events.60.t: "Proklamacja odbudowy Bizancjum"
 tre_events.60.d: "Anatolia, Bałkany i Konstantynopol zjednoczone — dynastia Komnenów ogłasza odbudowę Cesarstwa Bizantyjskiego. Powstałego z tragedii 1204 roku."
 tre_events.60.a: "Niech żyje Bizancjum! Niech żyje dynastia Komnenów!"
 tre_events.99.t: "Wieczna chwała dynastii Komnenów"
 tre_events.99.d: "„Cesarz Komnen — następca Rzymu Wschodniego i strażnik prawosławia” — ten tytuł odbija się echem po całym świecie śródziemnomorskim. Małe cesarstwo, które zaczęło się w Trapezuncie, panuje jako następca największego imperium historii."
 tre_events.99.a: "Niech żyje dynastia Komnenów! Niech żyje wieczna chwała!"
 STATIC_MODIFIER_NAME_tre_komnenian_mod: "Komnenowie"
 STATIC_MODIFIER_DESC_tre_komnenian_mod: "Patrząc w górę na purpurowy sztandar Komnenów, każdy na dworze wyobraża sobie dzień, gdy chwała Bizancjum zostanie odzyskana w rękach Trapezuntu."
 STATIC_MODIFIER_NAME_tre_pontus_mod: "Pont"
 STATIC_MODIFIER_DESC_tre_pontus_mod: "Linia brzegowa pontyjska zabezpieczona jako podstawa dominacji w handlu czarnomorskim."
 STATIC_MODIFIER_NAME_tre_black_sea_mod: "Morze Czarne"
 STATIC_MODIFIER_DESC_tre_black_sea_mod: "Żaden statek handlowy na Morzu Czarnym nie może zabrać wschodnich jedwabi, nie zarzucając kotwicy w porcie Trapezuntu."
 STATIC_MODIFIER_NAME_tre_trebizond_city_mod: "Miasto Trapezunt"
 STATIC_MODIFIER_DESC_tre_trebizond_city_mod: "Trapezunt rozwinięty w kwitnący węzeł handlowy Cesarstwa Komnenów."
 STATIC_MODIFIER_NAME_tre_orthodox_mod: "Prawosławie"
 STATIC_MODIFIER_DESC_tre_orthodox_mod: "Klasztory prawosławne umocnione, ustanawiając Trapezunt duchowym dziedzicem Bizancjum."
 STATIC_MODIFIER_NAME_tre_armenia_mod: "Armenia"
 STATIC_MODIFIER_DESC_tre_armenia_mod: "Armenia podporządkowana, zabezpieczając wschodnią granicę i zyskując górskich wojowników."
 STATIC_MODIFIER_NAME_tre_cappadocia_mod: "Kapadocja"
 STATIC_MODIFIER_DESC_tre_cappadocia_mod: "Jaskiniowo-klasztorne serce Kapadocji wpada pod kontrolę Komnenów."
 STATIC_MODIFIER_NAME_tre_anatolia_mod: "Anatolia"
 STATIC_MODIFIER_DESC_tre_anatolia_mod: "Centralna Anatolia odzyskana — droga do Konstantynopola otwarta."
 STATIC_MODIFIER_NAME_tre_west_anatolia_mod: "Zachodnia Anatolia"
 STATIC_MODIFIER_DESC_tre_west_anatolia_mod: "Bogate wybrzeże egejskie Zachodniej Anatolii zabezpieczone dla Cesarstwa Komnenów."
 STATIC_MODIFIER_NAME_tre_nicaea_mod: "Nicea"
 STATIC_MODIFIER_DESC_tre_nicaea_mod: "Nicea odzyskana — bizantyjska stolica na wygnaniu wraca pod rządy prawosławne."
 STATIC_MODIFIER_NAME_tre_thrace_mod: "Tracja"
 STATIC_MODIFIER_DESC_tre_thrace_mod: "Tracja zdobyta, okrążając Konstantynopol w przygotowaniu do jego wyzwolenia."
 STATIC_MODIFIER_NAME_tre_greece_mod: "Grecja"
 STATIC_MODIFIER_DESC_tre_greece_mod: "Północna Grecja, w tym Saloniki, zabezpieczona — drugie miasto Bizancjum odbudowane."
 STATIC_MODIFIER_NAME_tre_bulgaria_mod: "Bułgaria"
 STATIC_MODIFIER_DESC_tre_bulgaria_mod: "Bułgaria podbita, umacniając dominację bałkańską."
 STATIC_MODIFIER_NAME_tre_morea_mod: "Morea"
 STATIC_MODIFIER_DESC_tre_morea_mod: "Morea i Ateny odzyskane — serce starożytnej cywilizacji greckiej odbudowane."
 STATIC_MODIFIER_NAME_tre_aegean_mod: "Morze Egejskie"
 STATIC_MODIFIER_DESC_tre_aegean_mod: "Wyspy egejskie odzyskane spod okupacji łacińskich krzyżowców."
 STATIC_MODIFIER_NAME_tre_macedonia_mod: "Macedonia"
 STATIC_MODIFIER_DESC_tre_macedonia_mod: "Macedonia — miejsce narodzin Aleksandra — wpada pod rządy Komnenów."
 STATIC_MODIFIER_NAME_tre_silk_mod: "Jedwab"
 STATIC_MODIFIER_DESC_tre_silk_mod: "Handel na Jedwabnym Szlaku przez Trapezunt dominuje nad handlem Wschód-Zachód."
 STATIC_MODIFIER_NAME_tre_army_mod: "Armia"
 STATIC_MODIFIER_DESC_tre_army_mod: "Najemnicy i pospolite ruszenie prowincjonalne ćwiczą pod tym samym sztandarem, a armia Komnenów znalazła nową siłę."
 STATIC_MODIFIER_NAME_tre_culture_mod: "Kultura"
 STATIC_MODIFIER_DESC_tre_culture_mod: "Nauka i sztuki bizantyjskie odrodzone, czyniąc Trapezunt latarnią kultury."
 STATIC_MODIFIER_NAME_tre_cilicia_mod: "Cylicja"
 STATIC_MODIFIER_DESC_tre_cilicia_mod: "Cylicja podporządkowana, zabezpieczając dostęp do Morza Śródziemnego."
 STATIC_MODIFIER_NAME_tre_cpole_city_mod: "Miasto Konstantynopol"
 STATIC_MODIFIER_DESC_tre_cpole_city_mod: "Konstantynopol odbudowany jako wspaniała stolica odbudowanego Cesarstwa Bizantyjskiego."
 STATIC_MODIFIER_NAME_tre_patriarch_mod: "Patriarcha"
 STATIC_MODIFIER_DESC_tre_patriarch_mod: "Patriarchat Konstantynopola ustanowiony pod opieką Komnenów."
 STATIC_MODIFIER_NAME_tre_georgia_mod: "Gruzja"
 STATIC_MODIFIER_DESC_tre_georgia_mod: "Gruzja zabezpieczona, stabilizując kaukaską flankę imperium."
 STATIC_MODIFIER_NAME_tre_navy_mod: "Flota"
 STATIC_MODIFIER_DESC_tre_navy_mod: "Potężna flota Komnenów dominuje nad Morzem Czarnym i Egejskim."
 STATIC_MODIFIER_NAME_tre_antioch_mod: "Antiochia"
 STATIC_MODIFIER_DESC_tre_antioch_mod: "Antiochia — klejnot bizantyjskiej Syrii — odzyskana."
 STATIC_MODIFIER_NAME_tre_greek_pop_mod: "Populacja grecka"
 STATIC_MODIFIER_DESC_tre_greek_pop_mod: "Greckie modlitwy i okrzyki targowe wypełniają ulice każdego miasta odbudowanego imperium."
 STATIC_MODIFIER_NAME_tre_restore_byzantium_mod: "Odbudowa Bizancjum"
 STATIC_MODIFIER_DESC_tre_restore_byzantium_mod: "Cesarstwo Bizantyjskie formalnie odbudowane pod przywództwem Komnenów."
 STATIC_MODIFIER_NAME_tre_komnenos_final_mod: "Finał Komnenów"
 STATIC_MODIFIER_DESC_tre_komnenos_final_mod: "Cesarstwo Komnenów stoi wiecznie — pan wschodniego Morza Śródziemnego."
 tre_rize_tea: "Uprawa herbaty w Rize"
 tre_rize_tea_desc: "Rize — obdarzone ciepłym, wilgotnym klimatem między Górami Pontyjskimi a Morzem Czarnym, ten region stanie się największym obszarem produkcji herbaty w Turcji. Od 1737 roku przekształć wzgórza Rize w plantacje herbaty, używając technik uprawy, które przybyły przez Gruzję. Przynieś szlachetny wschodni napój do Cesarstwa Komnenów."
 STATIC_MODIFIER_NAME_tre_rize_tea_mod: "Plantacje herbaty w Rize"
 STATIC_MODIFIER_DESC_tre_rize_tea_mod: "Wzgórza Rize przekształcone w plantacje herbaty, ustanawiając bazę produkcji herbaty dla imperium."
 STATIC_MODIFIER_NAME_tre_cpole_loc_mod: "Konstantynopol odbudowany"
 STATIC_MODIFIER_DESC_tre_cpole_loc_mod: "Konstantynopol zaczyna działać jako centrum administracyjne i rządowe imperium."
