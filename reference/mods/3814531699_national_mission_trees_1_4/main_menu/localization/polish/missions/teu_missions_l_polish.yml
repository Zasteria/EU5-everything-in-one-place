l_polish:
 teu_teutonic_mission_pack: "Zakon Krzyżacki — miecz i krzyż"
 teu_teutonic_mission_pack_DESCRIPTION:0 "Zakon Krzyżacki, który podbił Bałtyk w imię Boga. Podnieś sztandar krzyżowy i zniszcz pogan i prawosławnych Wschodu, by dopełnić Krucjatę Północną — lub zsekularyzuj się i połóż podstawy nowoczesnych Niemiec Królestwem Prus. Nadszedł czas wyboru."
 teu_teutonic_mission_pack_CRITERIA_DESCRIPTION:0 "Dopełnij Krucjatę Północną na ścieżce krzyżowej, lub zbuduj Królestwo Prus na ścieżce sekularyzacji."
 teu_teutonic_mission_pack_BUTTON_TOOLTIP:0 "Podbij Bałtyk i Europę Wschodnią mieczem i krzyżem."
 teu_teutonic_mission_pack_BUTTON_DETAILS:0 "„Cała pomoc proszącym, żadnej litości dla wroga” — rządź Bałtykiem w imieniu Wielkiego Mistrza!"
 teu_crusaders_legacy: "Dziedzictwo zakonu krzyżowego"
 teu_crusaders_legacy_desc: "Założony w Akce w 1190 roku podczas Trzeciej Krucjaty, Zakon Krzyżacki zaczął jako zakon szpitalny w Ziemi Świętej. W 1226 roku Złota Bulla Fryderyka II z Rimini nadała zakonowi prawo prowadzenia wyprawy przeciw pogańskim Prusom, i od tego czasu podbił on południowy brzeg Bałtyku mieczem krzyżowym. To „państwo mniszo-rycerskie”, ze stolicą w Malborku, pozostaje ostatnim państwem krzyżowym Europy, kontynuującym wojny nawracania i kolonizacji. Teraz, otoczony potężnymi rywalami Litwy Giedyminowej i Polski Jagiellońskiej, prawdziwa wartość zakonu zostanie poddana próbie."
 teu_secure_prussia: "Zabezpiecz Prusy"
 teu_secure_prussia_desc: "Prusy — niegdyś dom bałtyckich ludów pruskich — zostały zdobyte przez ponad pięćdziesiąt lat podbojów Zakonu Krzyżackiego, rozpoczętych w latach 30. XIII wieku. Po stłumieniu „Wielkiego Powstania” 1283 roku ludność rdzenna została faktycznie unicestwiona, a ziemia odbudowana przez kolonię niemieckich osadników. Jednak w górach i lasach wciąż tlą się żary oporu. Dopełnij sieć twierdz po całych Prusach i uczyń rządy zakonu niezłomnymi — bo bez Prus nie ma Zakonu Krzyżackiego."
 teu_christianize_prussia: "Schrystianizuj Prusy"
 teu_christianize_prussia_desc: "Deklarowanym powodem istnienia Zakonu Krzyżackiego jest „nawracanie pogan”. W rzeczywistości większość podbitych Prusów została siłą nawrócona, a opierający się wytępieni. Traktat z Christburga z 1249 roku nadał pruskiej szlachcie prawa w zamian za chrzest, lecz późniejsze powstania złamały tę obietnicę. Teraz osiągnij prawdziwą katolizację i zbuduj sieć kościołów, by ustanowić religijną legitymizację zakonu — tylko z poparciem papieża to państwo może stać się prawdziwie prawowite."
 teu_subdue_lithuania: "Podporządkuj Litwę"
 teu_subdue_lithuania_desc: "Wielkie Księstwo Litewskie — rozległe państwo pogańskie, które pod dynastią Giedyminowiczów rozciągało się od Bałtyku po Ukrainę — było zarówno największym zagrożeniem dla Zakonu Krzyżackiego, jak i jego największym celem krzyżowym. Klęska pod Durbe w 1260 roku, katastrofa pod Grunwaldem w 1410 roku — Litwa wielokrotnie pokonywała zakon. Jednak z nawróceniem Jagiełły na katolicyzm w 1387 roku Litwa nominalnie przestała być „państwem pogańskim”, co skomplikowało uzasadnienie krucjaty. Niemniej jednak tylko wygrywając walkę o zwierzchność przeciw Litwie zakon może prawdziwie rządzić Bałtykiem."
 teu_subdue_poland: "Podporządkuj Polskę"
 teu_subdue_poland_desc: "15 lipca 1410 roku, bitwa pod Grunwaldem (Tannenberg) — największa klęska w historii Zakonu Krzyżackiego. Wielki mistrz Ulrich von Jungingen i kwiat rycerstwa zakonu polegli, a sam Malbork został oblężony. Drugi Pokój Toruński z 1466 roku oddał Prusy Zachodnie Polsce, sprowadzając zakon do niewiele więcej niż wasala. Pomścij to upokorzenie — rozgrom Polskę, odzyskaj utracone ziemie i zmyj hańbę Grunwaldu."
 teu_order_or_prussia: "Wybór — krucjata czy sekularyzacja"
 teu_order_or_prussia_desc: "W 1511 roku, gdy Albrecht Hohenzollern został Wielkim Mistrzem, zakon stał na rozdrożu przetrwania. Podczas gdy Reformacja Lutra z 1517 roku wstrząsała Europą, Albrecht spotkał się z samym Lutrem i wybrał sekularyzować zakon, zakładając księstwo Prus — w 1525 roku. Lecz co, gdyby zakon zamiast tego kontynuował swą misję krzyżową? Dopełnij „Krucjatę Północną”, podporządkowując prawosławnych, pogan i muzułmanów Wschodu, lub połóż podstawy nowoczesnych Prus świeckim księstwem — wybór należy do ciebie."
 teu_crusade_path: "Ścieżka Krucjaty Północnej"
 teu_crusade_path_desc: "Ścieżka krucjaty — weź miecz w imieniu Boga. Prawdziwym powołaniem Zakonu Krzyżackiego jest nawracanie i podbój pogan. Na wschodzie czekają ziemie prawosławne Rusi; na wybrzeżu bałtyckim kusi sojusz z Zakonem Inflanckim. Jak niegdyś z podbojem Prus, wznieś sztandar krzyżowy od wschodniego brzegu Bałtyku po Północną Rosję. Odpust krzyżowy, nadany przez Grzegorza IX, pozostaje wiecznie ważny — dopełnij Krucjatę Północną w imieniu Boga i wyryj imię Wielkiego Mistrza w historii."
 teu_path_crusade_chosen_tt: "Wybrano drogę krucjaty"
 teu_path_secular_chosen_tt: "Wybrano drogę sekularyzacji"
 teu_livonian_alliance: "Sojusz z Zakonem Inflanckim"
 teu_livonian_alliance_desc: "Zakon Inflancki — dziedzic Kawalerów Mieczowych, wchłonięty przez Zakon Krzyżacki w 1237 roku. Z bazą w Rydze ten zakon kontroluje wschodnie wybrzeże bałtyckie, lecz pod stałą presją Litwy i Rusi. Poniósł klęskę od Aleksandra Newskiego w bitwie na Jeziorze Pejpus w 1242 roku i druzgocący cios od Litwy pod Durbe w 1260 roku. Teraz wykuj sojusz z Zakonem Inflanckim i zbuduj wspólny system, by razem rządzić wschodnim Bałtykiem — wykorzystaj siłę zakonu-brata, by pokonać wrogów Wschodu."
 teu_crusade_east: "Krucjata na Wschód"
 teu_crusade_east_desc: "Zwróć miecz krzyżowy na wschód — prawosławni „schizmatycy”, poganie „romuwici”, muzułmańscy „niewierni”. Wszyscy są wrogami wiary katolickiej i celu krucjaty. Od lat 30. XIII wieku Zakon Krzyżacki prowadził „Krucjatę Północną” po ziemiach bałtyckich. Teraz rozszerz horyzont dalej na wschód i prowadź świętą wojnę przeciw sercu wschodniego prawosławia i ostatnim bastionom Bałtów. Nawrócenie Litwy na katolicyzm w 1386 roku zmniejszyło liczbę „prawowitych” celów krucjaty, lecz państwa prawosławne Rusi wciąż pozostają."
 teu_riga_crusade: "Ryga, bastion krzyżowy"
 teu_riga_crusade_desc: "Ryga — założona w 1201 roku przez biskupa Alberta von Buxhoevdena, to miasto jest najważniejszym bastionem na wschodnim wybrzeżu bałtyckim. Długa walka o władzę szalała między Zakonem Inflanckim a arcybiskupem Rygi, lecz jeśli Zakon Krzyżacki zdoła zjednoczyć miasto i rozwinąć je wysuniętą bazą wschodniej krucjaty, stanie się przyczółkiem do przeciwstawienia się Rusi. Położona u ujścia Dźwiny Ryga jest żywotna zarówno dla handlu, jak i wojny — zabezpieczenie jej ustanawia linię zaopatrzenia dla wschodniego posuwania się."
 teu_march_to_orthodox: "Marsz na prawosławie"
 teu_march_to_orthodox_desc: "„Heretycki” kościół prawosławny — w oczach katolickiego Rzymu kościoły bizantyjski i ruski dzierżyły „fałszywą wiarę” od czasów Wielkiej Schizmy 1054 roku. Republika Nowogrodzka, Psków, księstwa ruskie — te państwa prawosławne — są prawdziwym celem Krucjaty Północnej. W 1242 roku Aleksander Newski rozgromił Zakon Inflancki na lodzie Jeziora Pejpus i do dziś jest sławiony jako „bohater, który pokonał krzyżowców”. Pomścij tę klęskę i wznieś sztandar katolicki na ziemi prawosławnej — to najwyższa misja Zakonu Krzyżackiego."
 teu_northern_crusade_final: "Krucjata Północna dopełniona"
 teu_northern_crusade_final_desc: "Krucjata Północna — rozpoczęta podbojem Prus i rozciągnięta przez wschodnie wybrzeże bałtyckie w głąb Rusi — wreszcie zbliża się do dopełnienia. Jak niegdyś Prusowie, prawosławni muszą zostać nawróceni lub podporządkowani. Bałtyk staje się morzem wewnętrznym Zakonu Krzyżackiego, a sztandar Wielkiego Mistrza powiewa aż po wschodni kraniec świata. Marzenie „Krucjaty Północnej”, odziedziczone od Kawalerów Mieczowych XIII wieku — zjednoczenie ziem Bałtów, Słowian i Finów w święte imperium — jest teraz urzeczywistnione."
 teu_secularize_path: "Ścieżka sekularyzacji"
 teu_secularize_path_desc: "10 kwietnia 1525 roku w Krakowie Albrecht Hohenzollern ogłosił założenie księstwa Prus jako lenna króla Zygmunta I Polskiego — sekularyzację Zakonu Krzyżackiego. W zamian za nawrócenie na luteranizm ziemie zakonu przetrwają jako świeckie księstwo. Państwa katolickie oburzały się na tę „zdradę”, lecz rosnąca fala protestantyzmu dała zakonowi nową drogę naprzód. Osiądź na fali Reformacji i, jako świecki książę, połóż podstawy nowoczesnych Prus — to nowy sposób życia zakonu w nowej epoce."
 teu_prussian_duchy: "Księstwo Prus"
 teu_prussian_duchy_desc: "Księstwo Prus — zrodzone z sekularyzacji w 1525 roku — szybko rozwijało się pod rządami Hohenzollernów. Z Królewcem stolicą aktywnie wspierało Reformację luterańską i przez Uniwersytet Królewiecki (założony 1544) nazywało siebie „Prusami nauki”. Dawne państwo krzyżowe przekształca się teraz w nowoczesne księstwo. Zbuduj administrację, wykuj współpracę ze szlachtą-junkrami i ustanów podstawy państwa wojskowego — pierwszy krok ku przyszłemu Królestwu Prus i później Cesarstwu Niemieckiemu."
 teu_control_pomerania: "Opanuj Pomorze"
 teu_control_pomerania_desc: "Pomorze — rozciągające się wzdłuż południowego wybrzeża bałtyckiego na zachód od Wisły — długo spierane było przez książąt niemieckich, Danię i Polskę. Księstwo Pomorskie dynastii Gryfitów to małe państwo, zaklinowane między Prusami a Brandenburgią, lecz jego dostęp do Bałtyku czyni je strategicznie żywotnym. Zdobywszy Pomorze, Prusy stają się prawdziwym panem Bałtyku. Opanuj port Szczecin (Stettin) i drogi wodne Odry, i wykuj „oś północnoniemiecką”, łączącą Brandenburgię i Pomorze."
 teu_protestant_reformation: "Reformacja protestancka"
 teu_protestant_reformation_desc: "W 1517 roku Marcin Luter przybił swoje Dziewięćdziesiąt pięć tez do drzwi kościoła w Wittenberdze — i fala Reformacji uderzyła prosto w Prusy. Sam Wielki Mistrz Albrecht spotkał się z Lutrem i wybrał sekularyzować zakon. Przyjęcie luteranizmu przez Prusy stało się podstawą „ligi protestanckiej” przeciw katolickim Habsburgom. Aktywnie promuj Reformację i zmodernizuj edukację i zarządzanie — tradycja naukowa Uniwersytetu Królewieckiego i zdyscyplinowana biurokracja Prus staną się kamieniem węgielnym kultury pruskiej na pokolenia."
 teu_dominate_hre: "Wznieś się w Świętym Cesarstwie Rzymskim"
 teu_dominate_hre_desc: "Święte Cesarstwo Rzymskie — wyśmiewane jako „ani święte, ani rzymskie, ani cesarstwo” — jest złożonym porządkiem politycznym. Jak Prusy utorują sobie w nim drogę? Władza cesarzy habsburskich, rywalizacja elektorów, rozłamy spowodowane Reformacją — wszystko to tworzy możliwości dla wyniesienia Prus. Unia Brandenburgii i Prus z 1618 roku pod dziedzictwem Hohenzollernów stanie się podstawą późniejszych zjednoczonych Niemiec. Ustanów swój status elektora, rozszerz swój wpływ wewnątrz Cesarstwa i wznieś Prusy rywalem Habsburgów i przywódcą Północnych Niemiec."
 teu_north_german_empire: "Związek Północnoniemiecki"
 teu_north_german_empire_desc: "Cesarstwo Północnoniemieckie — marzenie Bismarcka, ambicja domu Hohenzollernów. W XVIII wieku Fryderyk Wielki dowiódł potęgi Prus w Wojnie Siedmioletniej przeciw Austrii; w XIX Bismarck zjednoczył Niemcy „krwią i żelazem”. Lecz na długo przedtem, jako państwo-dziedzic Zakonu Krzyżackiego, marzenie Prus o zjednoczeniu całych Północnych Niemiec miało już długą historię. Brandenburgia, Pomorze, Meklemburgia, Hanower — zgromadź książąt Północnych Niemiec i urzeczywistnij tu i teraz Związek Północnoniemiecki, który stanie się zwiastunem nowoczesnego państwa niemieckiego."
 teu_malbork_citadel: "Umocnij cytadelę Malbork"
 teu_malbork_citadel_desc: "Zamek Malbork (Marienburg) — ta rozległa ceglana twierdza w delcie Wisły — jest siedzibą główną Zakonu Krzyżackiego. Przeniesiona z Wenecji w 1309 roku, stoi jako największy średniowieczny zamek ceglany Europy. Po klęsce pod Grunwaldem w 1410 roku została oblężona przez siły polskie, lecz wytrzymała pod dowództwem pełniącego obowiązki Wielkiego Mistrza Heinricha von Plauena. Mury Malborka — sam symbol państwa zakonu — umocnić je w niezdobyty bastion jest podstawą każdej strategii obronnej."
 teu_konigsberg_dev: "Rozwiń Królewiec"
 teu_konigsberg_dev_desc: "Królewiec (dzisiejszy Kaliningrad) — założony w 1255 roku przy wsparciu króla Przemysła Ottokara II Czeskiego, to miasto wyrosło centrum kolonii pruskiej. Uniwersytet został tam założony w 1544 roku, później domu filozofa Immanuela Kanta. Położone u ujścia Pregoły to miasto jest żywotnym bałtyckim węzłem handlowym i służyło jako faktyczna stolica państwa zakonu. Rozwiń jego infrastrukturę miejską, rozszerz jego katedrę i rynki i pozwól mu prosperować punktem przeładunkowym handlu północnego i wschodnioeuropejskiego — umocnienie serca Prus jest źródłem siły narodowej."
 teu_danzig_port: "Rozwiń port Gdańsk"
 teu_danzig_port_desc: "Gdańsk — położony u ujścia Wisły, to największe miasto portowe Bałtyku. W 1308 roku Zakon Krzyżacki „zdobył” Gdańsk od swych polskich sojuszników i od tego czasu pozwolił mu prosperować węzłem handlu bałtyckiego. Lecz Drugi Pokój Toruński z 1466 roku oddał miasto Polsce, która ceni je sercem „Prus Królewskich”. Odzyskaj Gdańsk, włącz go w sieć handlową hanzeatycką i zmaksymalizuj zyski z bałtyckiego handlu zbożem — to miasto, znane jako „Królowa Bałtyku”, jest arterią finansową zakonu."
 teu_teutonic_law: "Kodeks krzyżacki"
 teu_teutonic_law_desc: "Prawo chełmińskie z lat 30. XIII wieku (Kulmer Handfeste) było pierwszym kodeksem prawnym, nadanym przez Zakon Krzyżacki jego miastom kolonialnym. Opierając się na tym, pruski system prawny się rozwinął i stał się podstawą prawną niemieckiej kolonizacji wschodniej. Dekret arcybiskupi z 1489 roku, pruski kodeks praw z 1529 roku — rozwój prawny jest środkiem, przez który państwo zakonu przekształca się z „barbarzyńskiego zdobywcy” w „nosiciela cywilizacji”. Uporządkuj zarządzanie, chroń prawa chłopów i rozwiń prawo handlowe — ustanów Prusy państwem, rządzonym przez prawo."
 teu_amber_trade: "Zdobądź handel bursztynem"
 teu_amber_trade_desc: "Złoto Bałtyku — bursztyn. Zwany „złotem Północy” od czasów starożytnych, ten klejnot znajduje się jedynie wzdłuż wybrzeża bałtyckiego i niegdyś był dostarczany aż do świata śródziemnomorskiego. Po podboju Prus Zakon Krzyżacki zgłosił roszczenie do monopolu bursztynu, karząc przemytników śmiercią. Ten „monopol bursztynowy” jest jednym z najważniejszych źródeł dochodu zakonu. Weź pełną kontrolę nad regionami bałtyckimi produkującymi bursztyn i opanuj szlaki handlowe do Europy Środkowej — bo oprócz miecza, bogactwo bursztynu jest innym źródłem władzy zakonu."
 teu_hanseatic_ties: "Więzy z Ligą Hanzeatycką"
 teu_hanseatic_ties_desc: "Liga Hanzeatycka — ten związek niemieckich miast kupieckich, przewodzony przez Lubekę, panuje nad handlem Bałtyku i Morza Północnego. Gdańsk, Ryga, Rewal (Tallin) — wszystkie te miasta — są głównymi węzłami hanzeatyckimi, a ich terytoria przecinają się z własnym władaniem Zakonu Krzyżackiego. Kupcy hanzeatyccy nieśli pruskie zboże, drewno i bursztyn do Europy Zachodniej, przynosili w zamian sukno, wino i sól. Zbuduj ścisłe więzy z Ligą Hanzeatycką i stań się skutecznym panem bałtyckiej sieci handlowej — zapewnij dobrobyt zakonu zarówno mieczem, jak i handlem."
 teu_colonize_prussia: "Skoloryzuj Prusy"
 teu_colonize_prussia_desc: "Ostsiedlung — wielka historyczna migracja Niemców, zasiedlających wschód od Łaby od XI do XIV wieku. Zakon Krzyżacki stał w awangardzie tego ruchu, przyciągając niemieckich chłopów, rzemieślników i kupców na podbite Prusy. W zamian za zniknięcie rdzennych ludów pruskich ta ziemia została skolonizowana jako „niemieckie pogranicze wschodnie”. Planowa budowa miast, rozwój rolniczy, budowa dróg — te środki, którymi „barbarzyńska ziemia” włączana jest w europejską sferę cywilizacji. Dopełnij kolonizację Prus i mocno ustanów je ziemią niemiecką."
 teu_torun_city: "Rozwiń Toruń"
 teu_torun_city_desc: "Toruń — zbudowany wzdłuż Wisły, to miasto było pierwszym bastionem Zakonu Krzyżackiego, założonym w 1231 roku. „Pokoje toruńskie” z 1454 i 1466 roku określiły jego stosunki z Polską: pierwszy przyniósł pokój, drugi — upokarzające oddanie terytorium zakonu. W 1473 roku urodził się tu Kopernik — astronom, który zaproponował teorię heliocentryczną. Rozwiń Toruń, kolebkę historii zakonu, i odbuduj go centrum wiślanego handlu rzecznego."
 teu_memel_fortress: "Umocnij Memel"
 teu_memel_fortress_desc: "Memel (Kłajpeda) — u ujścia Niemna na granicy litewsko-pruskiej to miasto-twierdza zostało zbudowane przez Zakon Krzyżacki wysuniętą linią obrony przeciw Litwie. Zamek Memel, założony w 1252 roku, przetrwał niezliczone bitwy z Litwą. Gdy ta twierdza upadnie — wrota do Prus się otworzą; przeciwnie, mocne utrzymanie Memla jest kluczem do powstrzymania inwazji litewskiej. Umocnij te wrota do Bałtyku i pozwól im służyć jako wewnętrzny węzeł handlu bursztynem."
 teu_grand_master: "Hegemonia Wielkiego Mistrza"
 teu_grand_master_desc: "Wielki Mistrz (Hochmeister) jest najwyższym wodzem Zakonu Krzyżackiego. Jako namiestnik Chrystusa prowadzi rycerzy-mnichów, rządzących imperium krzyżowym, rozciągającym się od Bałtyku przez całą Europę Wschodnią. Hermann von Salza (1209-1239) ustanowił podstawy polityczne zakonu przez dyplomację z Fryderykiem II, a rządy Winricha von Kniprode (1351-1382) zaznaczyły złoty wiek zakonu. Teraz każdy wróg podporządkowany, a Krucjata Północna dopełniona — władza Wielkiego Mistrza rozciąga się od Bałtyku po ziemie prawosławnych. Jako Wielki Mistrz, którego imię zostanie wyryte w historii, przynieś wolę Boga aż po krańce Wschodu."
 teu_prussian_king: "Proklamacja Króla Prus"
 teu_prussian_king_desc: "Król Prus — 18 stycznia 1701 roku Fryderyk III koronował się w Królewcu na króla Fryderyka I Pruskiego. Koronując się w Prusach (dawnych ziemiach Zakonu Krzyżackiego), które leżały poza jurysdykcją cesarza Świętego Cesarstwa Rzymskiego, znalazł przebiegły sposób na zgłoszenie roszczenia do tytułu królewskiego bez aprobaty habsburskiej. „Fryderyk Wielki”, Fryderyk II, zdobył Śląsk i wygrał Wojnę Siedmioletnią, wznosząc Prusy wielką potęgą europejską. „Prusy — nie kraj z armią, lecz armia z krajem” — pod tą filozofią narodową połóż tu i teraz podstawy nowoczesnych Niemiec."
 teu_events.10.t: "Przyszłość zakonu — krucjata czy sekularyzacja"
 teu_events.10.d: "Z podporządkowanymi Litwą i Polską Zakon Krzyżacki stoi teraz przed historycznym wyborem. Kontynuować pod sztandarem krzyżowym, uderzając w pogan i prawosławnych Wschodu — czy zsekularyzować się w nowoczesne księstwo i przekształcić w Królestwo Prus."
 teu_events.10.a: "Ścieżka krucjaty — rozgrom pogan i prawosławnych Wschodu i dopełnij Krucjatę Północną"
 teu_events.10.b: "Ścieżka sekularyzacji — zbuduj księstwo Prus i połóż podstawy nowoczesnych Niemiec"
 teu_events.50.t: "Krucjata Północna dopełniona"
 teu_events.50.d: "„Taka jest wola Boga” — od Bałtyku po dalekie krańce Rusi krucjata Zakonu Krzyżackiego dopełniona. Krzyż jaśnieje jasno nad północnymi ziemiami."
 teu_events.50.a: "Niech żyje krucjata! Hegemonia Wielkiego Mistrza ustanowiona!"
 teu_constantinople_fall: "Upadek Konstantynopola"
 teu_constantinople_fall_desc: "Z teraz dopełnioną Krucjatą Północną Zakon Krzyżacki zwraca wzrok ku południu. Konstantynopol, niegdyś wschodni bastion chrześcijaństwa, od dawna upadł w ręce heretyków i niewiernych. Odzyskaj to starożytne miasto imperialne i podnieś sztandar prawdziwej wiary nad Złotym Rogiem ponownie. Droga do Ziemi Świętej Jerozolimy zaczyna się od wyzwolenia tego miasta."
 teu_jerusalem_reclaimed: "Odzyskanie Jerozolimy"
 teu_jerusalem_reclaimed_desc: "Z odzyskanym Konstantynopolem ostateczny cel krucjaty jest teraz jedyny — sama Ziemia Święta Jerozolima. Niezliczeni krzyżowcy próbowali, a niezliczeni krzyżowcy polegli na tej ziemi; teraz nadszedł czas, by czarny krzyż Zakonu Krzyżackiego powiewał tu. Zanieś modlitwy przy Bazylice Grobu Pańskiego i urzeczywistnij odwieczne marzenie świata chrześcijańskiego."
 teu_events.55.t: "Konstantynopol, wreszcie nasz"
 teu_events.55.d: "Dopełniwszy Krucjatę Północną, Zakon Krzyżacki zwrócił swą włócznię na południe. Konstantynopol, niegdyś sam symbol chwały bizantyjskiej, stał się niewiele więcej niż ruinami, deptanymi przez heretyków i niewiernych. Lecz armie zakonu wyzwoliły miasto i ponownie wzniosły krzyż nad Hagia Sophia. Następny cel jest jasny — odzyskaj Ziemię Świętą Jerozolimę."
 teu_events.55.a: "Droga do Ziemi Świętej otwarta — naprzód, do Jerozolimy!"
 teu_events.56.t: "Jerozolima, wyzwolona"
 teu_events.56.d: "Marzenie, za którym krzyżowcy gonili przez wieki, i nadzieja, która rozbijała się raz po raz — odzyskanie Ziemi Świętej Jerozolimy wreszcie urzeczywistnione. Podczas gdy sztandar Zakonu Krzyżackiego powiewa nad Bazyliką Grobu Pańskiego, cały świat chrześcijański raduje się z tego zwycięstwa. Imię Wielkiego Mistrza będzie wymawiane na wieki obok imion wielkich wodzów krzyżowych przeszłości. Przez ten święty triumf dzielność i chwała władcy stały się nieśmiertelne."
 teu_events.56.a: "Z nami Bóg! Ziemia Święta wyzwolona!"
 teu_events.60.t: "Związek Północnoniemiecki proklamowany"
 teu_events.60.d: "Od Prus po Pomorze i Brandenburgię — cała Północ Niemiec zjednoczona pod sztandarem pruskim. Świt nowoczesnego państwa niemieckiego."
 teu_events.60.a: "Niech żyją Prusy! Niech żyje Związek Północnoniemiecki!"
 teu_events.99.t: "Ostateczny cel zakonu"
 teu_events.99.d: "Misja Zakonu Krzyżackiego wypełniona — jego imię wyryte w historii wielkim imperium, które rządziło Bałtykiem."
 teu_events.99.a: "Niech żyje Zakon Krzyżacki!"
 STATIC_MODIFIER_NAME_teu_amber_mod: "Monopol handlu bursztynem"
 STATIC_MODIFIER_DESC_teu_amber_mod: "Złoto Bałtyku, bursztyn — jego zmonopolizowany handel napełnia skarbiec Zakonu Krzyżackiego."
 STATIC_MODIFIER_NAME_teu_christian_mod: "Chrystianizacja Prus"
 STATIC_MODIFIER_DESC_teu_christian_mod: "Wiara katolicka zapuściła korzenie po całych Prusach, ustanawiając władzę religijną."
 STATIC_MODIFIER_NAME_teu_colonize_mod: "Kolonizacja Prus"
 STATIC_MODIFIER_DESC_teu_colonize_mod: "Osadnicy, przybywający wozami zza Łaby, wznoszą nowe wsie na pruskiej dzikiej ziemi."
 STATIC_MODIFIER_NAME_teu_danzig_mod: "Dobrobyt portu Gdańsk"
 STATIC_MODIFIER_DESC_teu_danzig_mod: "„Królowa Bałtyku”, Gdańsk, rozwinięta węzłem handlu morskiego zakonu."
 STATIC_MODIFIER_NAME_teu_duchy_mod: "Ustanowienie księstwa Prus"
 STATIC_MODIFIER_DESC_teu_duchy_mod: "Zsekularyzowane księstwo Prus zorganizowane nowoczesnym państwem administracyjnym."
 STATIC_MODIFIER_NAME_teu_east_crusade_mod: "Krucjata na Wschód"
 STATIC_MODIFIER_DESC_teu_east_crusade_mod: "Z każdą wyprawą w pogańskie ziemie bracia-rycerze przyszywają czarny krzyż do swych białych płaszczy i odnawiają śluby świętej wojny."
 STATIC_MODIFIER_NAME_teu_hanseatic_mod: "Więzy z Ligą Hanzeatycką"
 STATIC_MODIFIER_DESC_teu_hanseatic_mod: "Kogi hanzeatyckie zarzucają kotwice nieustannie w portach Gdańska i Torunia, szukając bursztynu i zboża."
 STATIC_MODIFIER_NAME_teu_hre_mod: "Wzrost wewnątrz Świętego Cesarstwa"
 STATIC_MODIFIER_DESC_teu_hre_mod: "Prusy wzniosły się centralną potęgą wewnątrz Świętego Cesarstwa Rzymskiego."
 STATIC_MODIFIER_NAME_teu_konigsberg_mod: "Dobrobyt Królewca"
 STATIC_MODIFIER_DESC_teu_konigsberg_mod: "Królewiec, serce Prus, prosperuje miastem handlu i nauki."
 STATIC_MODIFIER_NAME_teu_law_mod: "Kodeks krzyżacki"
 STATIC_MODIFIER_DESC_teu_law_mod: "Kodeks zakonu, zbudowany na prawie chełmińskim, zdobył miano sądzącego miasto i wieś jedną miarą."
 STATIC_MODIFIER_NAME_teu_legacy_mod: "Dziedzictwo Zakonu Krzyżackiego"
 STATIC_MODIFIER_DESC_teu_legacy_mod: "Portrety Wielkich Mistrzów w wielkiej sali Malborka niosą tradycję zakonu do każdego zakątka jego odzyskanego terytorium."
 STATIC_MODIFIER_NAME_teu_lithuania_mod: "Podporządkowanie Litwy"
 STATIC_MODIFIER_DESC_teu_lithuania_mod: "Linia twierdz, wzniesionych w lasach Żmudzi, stoi zaporą przeciw armiom Wielkiego Księcia Litewskiego."
 STATIC_MODIFIER_NAME_teu_livonia_mod: "Opanowanie Inflant"
 STATIC_MODIFIER_DESC_teu_livonia_mod: "Sojusz z Zakonem Inflanckim zapewnił kontrolę nad wschodnim wybrzeżem bałtyckim."
 STATIC_MODIFIER_NAME_teu_malbork_mod: "Umocnienie Malborka"
 STATIC_MODIFIER_DESC_teu_malbork_mod: "Malbork umocniony w niezdobyty bastion, kamień węgielny obrony zakonu."
 STATIC_MODIFIER_NAME_teu_memel_mod: "Umocnienie Memla"
 STATIC_MODIFIER_DESC_teu_memel_mod: "Memel rozwinięty umocnionym miastem portowym, zabezpieczającym granicę przeciw Litwie."
 STATIC_MODIFIER_NAME_teu_orthodox_march_mod: "Marsz na prawosławie"
 STATIC_MODIFIER_DESC_teu_orthodox_march_mod: "Po wielu wojnach z książętami prawosławnymi żołnierze zakonu dobrze znają ścieżki wojny pogranicznej na wschodzie."
 STATIC_MODIFIER_NAME_teu_poland_mod: "Podporządkowanie Polski"
 STATIC_MODIFIER_DESC_teu_poland_mod: "Duma, utracona w klęsce pod Grunwaldem, wreszcie odzyskana przez zwycięstwo odwetu."
 STATIC_MODIFIER_NAME_teu_pomerania_mod: "Kontrola nad Pomorzem"
 STATIC_MODIFIER_DESC_teu_pomerania_mod: "Z portami Pomorza w ręku żadne miasto na wybrzeżu bałtyckim nie może nie okazać szacunku sztandarowi zakonu."
 STATIC_MODIFIER_NAME_teu_protestant_mod: "Reformacja protestancka"
 STATIC_MODIFIER_DESC_teu_protestant_mod: "W Prusach, które przyjęły naukę Lutra, uczeni zbierają się z daleka i szeroka w kolegiach Królewca."
 STATIC_MODIFIER_NAME_teu_prussia_mod: "Całkowite podporządkowanie Prus"
 STATIC_MODIFIER_DESC_teu_prussia_mod: "Całkowite podporządkowanie Prus wytępiło nasiona buntu."
 STATIC_MODIFIER_NAME_teu_prussian_kingdom_mod: "Królestwo Prus"
 STATIC_MODIFIER_DESC_teu_prussian_kingdom_mod: "Nowoczesne Królestwo Prus ustanowione panem Północnych Niemiec."
 STATIC_MODIFIER_NAME_teu_constantinople_reclaimed_mod: "Odzyskanie Konstantynopola"
 STATIC_MODIFIER_DESC_teu_constantinople_reclaimed_mod: "Krzyż znów wzniesiony nad wielkim kościołem Konstantynopola, a jego światło dociera do całego Wschodu."
 STATIC_MODIFIER_NAME_teu_jerusalem_ruler_mod: "Wyzwoliciel Jerozolimy"
 STATIC_MODIFIER_DESC_teu_jerusalem_ruler_mod: "Wielki Mistrz, który uklęknął przy Grobie Pańskim, czczony jest przez lud jako żywy święty, a jego imię stało się sztandarem, prowadzącym armie."
 STATIC_MODIFIER_NAME_teu_riga_mod: "Ryga, bastion krzyżowy"
 STATIC_MODIFIER_DESC_teu_riga_mod: "Ryga rozwinięta handlowym, wojskowym i krzyżowym centrum wschodniego wybrzeża bałtyckiego."
 STATIC_MODIFIER_NAME_teu_secular_start_mod: "Pierwszy krok sekularyzacji"
 STATIC_MODIFIER_DESC_teu_secular_start_mod: "Od dnia, gdy Wielki Mistrz przyjął koronę książęcą, nowy duch nowoczesnego państwa poruszył się w zgromadzeniach Prus."
 STATIC_MODIFIER_NAME_teu_torun_mod: "Dobrobyt Torunia"
 STATIC_MODIFIER_DESC_teu_torun_mod: "Toruń, ojczyzna Kopernika, prosperuje centrum wiślanego handlu rzecznego."
 teu_mazovia_subjugation: "Podporządkowanie Mazowsza"
 teu_mazovia_subjugation_desc: "Mazowsze — polskie serce, rozciągające się wzdłuż środkowej Wisły. Ta ziemia, gdzie później zostanie zbudowana Warszawa, jest bramą Polski na wschód i głównym szlakiem inwazji na Prusy. Księstwo Mazowieckie było rządzone przez młodszą gałąź polskiej dynastii Piastów, dopóki nie zostało wchłonięte przez Królestwo Polskie w 1526 roku z wygaśnięciem jego linii panującej. Kontrola nad tą ziemią usuwa zagrożenie z południa i zapewnia bezpieczeństwo Prus. Uczyń bogatą ziemię uprawną dorzecza Wisły spichlerzem Zakonu Krzyżackiego."
 teu_narva_fortress: "Twierdza Narwa"
 teu_narva_fortress_desc: "Narwa — to miasto-twierdza nad rzeką Narwą na północnym wybrzeżu Estonii wyznacza strategiczną granicę między Inflantami a Rosją. Za rzeką stoi rosyjska twierdza Iwangorod — prawdziwy punkt zderzenia cywilizacji. Sprzedana Zakonowi Krzyżackiemu przez Danię wraz z północnym krańcem Estonii w 1346 roku, Narwa służy jako wysunięta baza dla wschodniej krucjaty. W 1558 roku jest przeznaczona na krótki upadek przed siłami Iwana Groźnego — lecz zmień ten los tu i teraz. Umocnij Narwę w niezdobyty bastion i utrzymuj presję na prawosławną Rosję."
 teu_berlin_dev: "Rozwój Berlina"
 teu_berlin_dev_desc: "Berlin — to małe miasteczko u zbiegu rzek Sprewy i Haweli zostało założone w XIII wieku jako miasta bliźniacze (Berlin i Kolonia) przez margrabiego Brandenburgii. Na razie to jedynie mała siedziba elektorów Hohenzollernów Brandenburgii, lecz gdy tylko Prusy zjednoczą się z Brandenburgią, to miejsce jest przeznaczone stać się stolicą imperialną. Z unią personalną Brandenburgii-Prus z 1618 roku i założeniem Królestwa Prus w 1701 roku Berlin stał się sercem Północnych Niemiec. Połóż tę podstawę teraz — rozwój Berlina zrodzi miasto, symbolizujące zjednoczenie Północnych Niemiec."
 teu_junker_system: "Ustanowienie systemu junkrów"
 teu_junker_system_desc: "Junker — po niemiecku „młody pan”, ten termin odnosi się do zmilitaryzowanej szlachty ziemskiej Prus. Posiadając rozległe majątki (Gutsherrschaft) na wschód od Łaby, junkrzy wykorzystywali pracę pańszczyźnianą do produkcji zboża na wywóz do Europy Zachodniej przez Bałtyk. Lecz ich prawdziwa rola była wojskowa — junkrzy zapełniali większość stanowisk oficerskich armii pruskiej, tworząc samo jądro „Prus jako państwa wojskowego”. Fryderyk Wilhelm I („Król-Żołnierz”) przymusowo wysyłał junkrów do akademii wojskowych, instytucjonalizując ich obowiązek wojskowy. Ustanów system junkrów teraz i połóż podstawę „pruskiej kultury wojskowej”, która przetrwa pokolenia."
 teu_silesia_claim: "Opanuj Śląsk"
 teu_silesia_claim_desc: "Śląsk — rozciągający się wzdłuż górnej Odry, ten region posiada potencjał, by stać się największą strefą przemysłową Europy Środkowej, bogatą w węgiel, rudę żelaza i cynk. Niegdyś część polskich posiadłości Piastów, wpadł pod Królestwo Czech po 1335 roku i stał się częścią Austrii przez dziedziczenie Czech przez Habsburgów w 1526 roku. Lecz w 1740 roku Fryderyk Wielki rozpoczął błyskawiczną inwazję na Śląsk na samym początku Wojny o sukcesję austriacką, zdobywając tę bogatą ziemię „siłą”. Weź Śląsk teraz dla Prus — jego potęga przemysłowa stanie się podstawą gospodarczą imperium pruskiego."
 teu_cathedral_network: "Sieć katedr"
 teu_cathedral_network_desc: "Sieć katedr po całych Prusach — Zakon Krzyżacki zawsze budował kościoły na podbitej ziemi. Katedra Królewiecka, kaplica zamkowa Malborka, kościół Świętego Jana w Toruniu — wszystkie były narzędziami, by zaszczepić wiarę katolicką na glebie pogańskiej. Organizacja systemu parafialnego, ustanowienie biskupstw, budowa klasztorów — te środki instytucjonalne, którymi „barbarzyńskie ziemie” włączane są w cywilizację chrześcijańską. Katedra jest zarówno czynem służby Bogu, jak i symbolem rządów kolonialnych. Ustanów sieć katedr po całych Prusach i umocnij władzę religijną i legitymizację rządów Zakonu Krzyżackiego."
 teu_elbing_dev: "Rozwój Elbląga"
 teu_elbing_dev_desc: "Elbląg (Elbing) — założony w 1237 roku na wschodnim krańcu delty Wisły, to miasto jest jednym z najważniejszych portów Prus obok Gdańska i ważnym członkiem Ligi Hanzeatyckiej. Połączony z Królewcem śródlądowymi drogami wodnymi, prosperował jako port eksportowy zboża, drewna i bursztynu. Podobnie jak Gdańsk, wpadł pod kontrolę polską po Drugim Pokoju Toruńskim (1466), lecz dla Prus pełna kontrola nad deltą Wisły jest niezastąpionym wyjściem do morza. Rozwiń Elbląg i ustanów parzysty system wielkich portów bałtyckich obok Gdańska."
 STATIC_MODIFIER_NAME_teu_mazovia_mod: "Mazowsze podporządkowane"
 STATIC_MODIFIER_DESC_teu_mazovia_mod: "Mazowsze podporządkowane, zabezpieczając granicę południową."
 STATIC_MODIFIER_NAME_teu_narva_mod: "Twierdza Narwa"
 STATIC_MODIFIER_DESC_teu_narva_mod: "Narwa umocniona w niezdobyty bastion na wschodzie."
 STATIC_MODIFIER_NAME_teu_berlin_mod: "Rozwój Berlina"
 STATIC_MODIFIER_DESC_teu_berlin_mod: "Berlin rozwinięty stolicą Prus."
 STATIC_MODIFIER_NAME_teu_junker_mod: "System junkrów"
 STATIC_MODIFIER_DESC_teu_junker_mod: "Junkrzy, zakorzenieni w swych majątkach na wschód od Łaby, wspierają królestwo zarówno oficerami, jak i urzędnikami."
 STATIC_MODIFIER_NAME_teu_silesia_mod: "Śląsk podbity"
 STATIC_MODIFIER_DESC_teu_silesia_mod: "Krosna i kopalnie Śląska nadają nowy puls finansom Prus."
 STATIC_MODIFIER_NAME_teu_cathedral_mod: "Sieć katedr"
 STATIC_MODIFIER_DESC_teu_cathedral_mod: "Katedry zbudowane po całych Prusach, a wiara katolicka zapuściła korzenie."
 STATIC_MODIFIER_NAME_teu_elbing_mod: "Dobrobyt portu Elbląg"
 STATIC_MODIFIER_DESC_teu_elbing_mod: "Elbląg rozwinięty dużym bałtyckim miastem portowym."
 teu_mongol_empire: "Bastion mongolski upadł"
 teu_mongol_empire_desc: "Saraj, Kazań, Samarkanda, Kaffa, Dadu, Karakorum — jedna po drugiej wielkie stolice Imperium Mongolskiego, które niegdyś wstrząsało światem, upadły pod czarno-krzyżowym sztandarem. „Wielki naród mongolski”, założony przez Czyngis-chana w 1206 roku, rozpadł się pod koniec XIII wieku, a jego dawna chwała dawno minęła. W to, co pozostaje z jego posiadłości, żelazne armie Zakonu Krzyżackiego maszerują zarówno ze wschodu, jak i zachodu, podporządkowując władców stepu. Od Pacyfiku na wschodzie po Bałtyk na zachodzie — całe dziedzictwo mongolskie zdobyte przez imperium krzyża."
 teu_sacred_nomads: "Tron Wielkiego Chana uzurpowany"
 teu_sacred_nomads_desc: "Z podporządkowanym całym Imperium Mongolskim Wielki Mistrz teraz zgłasza roszczenie do tytułu, którego ludy stepu boją się najbardziej — „chan” — jako trofeum wojenne. To nie jest zlanie się ani współistnienie; to po prostu zdobywca, zasiadający na tronie pokonanego. Ciężka kawaleria, niosąca krzyż, stała się panami tego, co niegdyś było najbardziej obawianą hordą na ziemi. Zjednocz imperia Wschodu i Zachodu wolą Boga — to ostateczne zwycięstwo Zakonu Krzyżackiego."
 teu_events.70.t: "Stolice mongolskie, nasze"
 teu_events.70.d: "Saraj, Kazań, Samarkanda, Kaffa, Dadu, Karakorum — każda stolica Imperium Mongolskiego upadła. Od tego dnia Wielki Mistrz nazywa siebie „niemieckim Wielkim Chanem”, lecz nie jako dziedzic krwi lub kultury mongolskiej. To nie więcej niż zdobywca, przejmujący tytuł pokonanego jako znak własnej władzy. Pax Deus — pokój Boga — teraz zastępuje to, co niegdyś było panowaniem stepu."
 teu_events.70.a: "Posiadłości mongolskie wreszcie nasze!"
 teu_events.80.t: "Żelazny krzyż rządzi światem"
 teu_events.80.d: "Jako końcowy akt podboju Imperium Mongolskiego Zakon Krzyżacki całkowicie przywiódł zarówno wschodnie, jak i zachodnie imperium pod własne rządy. Ludy stepu się poddają, a nowy porządek narzucony pod władzą krzyża. To nie jest zlanie się, lecz czyste dopełnienie podboju — zakon pozostaje zakonem i stał się panem największego imperium ziemi."
 teu_events.80.a: "Wolą Boga świat nasz!"
 STATIC_MODIFIER_NAME_teu_mongol_empire_mod: "Podporządkowanie Mongołów"
 STATIC_MODIFIER_DESC_teu_mongol_empire_mod: "Machina wojenna Imperium Mongolskiego zdobyta — jeźdźcy stepu służą teraz pod dowództwem krzyżackim."
 STATIC_MODIFIER_NAME_teu_sacred_nomads_mod: "Tron Wielkiego Chana"
 STATIC_MODIFIER_DESC_teu_sacred_nomads_mod: "Rządząc panem tego, co niegdyś było imperium światowym — Mongołowie całkowicie podporządkowani Zakonowi Krzyżackiemu."
 teu_great_khan_name: "Niemiecki Wielki Chanat"
 teu_events.11.t: "Ślub Krucjaty Północnej"
 teu_events.11.d: "Wrota na Wschód otwarte — z podporządkowanymi Litwą i Polską nadszedł czas, by Zakon Krzyżacki podjął historyczną decyzję. Każdy rycerz przysięga przed władzą Wielkiego Mistrza: „Wolą Boga zniszczymy pogan i prawosławnych Wschodu i dopełnimy Krucjatę Północną”. Ten ślub staje się zasadą rządzącą państwa Zakonu Krzyżackiego, a im wyższa jego legitymizacja, tym większa jego dyscyplina i porządek."
 teu_events.11.a: "Przysięgamy — wolą Boga dopełnij Krucjatę Północną!"
 teu_steppe_crusade: "Krucjata stepu"
 teu_steppe_crusade_desc: "Step pontyjski — niegdyś serce Imperium Mongolskiego, bezkresne pastwisko, rządzone przez Tatarów. Teraz, z ciężką kawalerią Zakonu Krzyżackiego, zlaną z lekką kawalerią w stylu mongolskim, podbij ten step i ustanów zwierzchność nad całą Europą Wschodnią. Kto rządzi stepem, ten rządzi Europą Wschodnią — dowiedź tej prawdy siłą Zakonu Krzyżackiego."
 STATIC_MODIFIER_NAME_teu_steppe_crusade_mod: "Krucjata stepu"
 STATIC_MODIFIER_DESC_teu_steppe_crusade_mod: "Konni bracia-rycerze, jeżdżący przez wiatry stepu, uczynili nawet drogi wojny koczowników swoimi własnymi."
 STATIC_MODIFIER_NAME_teu_crusade_loot_mod: "Łup krzyżowy"
 STATIC_MODIFIER_DESC_teu_crusade_loot_mod: "Łup krucjaty wyczerpał ziemię: pola leżą ugorem, wsie stoją puste, a lud czeka lepszych dni."
