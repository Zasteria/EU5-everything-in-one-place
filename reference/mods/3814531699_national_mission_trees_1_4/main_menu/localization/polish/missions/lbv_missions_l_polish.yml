l_polish:
 lbv_niederbayern_mission_pack: "Dziedzictwo Landshut — droga do zjednoczenia Bawarii"
 lbv_niederbayern_mission_pack_DESCRIPTION:0 "Jako dom Landshut, dziedzic posiadłości Albrechta I, sięgających aż do Niderlandów, zjednocz podzielone ziemie Bawarii z powrotem w jedną całość."
 lbv_niederbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Rozwiń Landshut i zjednocz Bawarię."
 lbv_niederbayern_mission_pack_BUTTON_TOOLTIP:0 "Rozwiń Landshut i zjednocz Bawarię."
 lbv_niederbayern_mission_pack_BUTTON_DETAILS:0 "Wznieś się jako książę całej Bawarii!"
 lbv_straubing_holland_legacy: "Dziedzictwo Straubing-Holandii"
 lbv_straubing_holland_legacy_desc: "Dziedzictwo Albrechta I, którego posiadłości sięgały aż do Niderlandów — jako dom Landshut, odziedzicz pamięć o tym rozległym spadku."
 lbv_secure_landshut: "Rozwiń Landshut"
 lbv_secure_landshut_desc: "Landshut, w górę biegu Izary — rozwiń to miasto wspaniałej architektury gotyckiej ośrodkiem księstwa."
 lbv_danube_trade: "Handel dunajski"
 lbv_danube_trade_desc: "Statki handlowe pływające po Dunaju — wykorzystaj tę żywotną drogę wodną i zapewnij bogactwo handlu."
 lbv_low_countries_ties: "Więzi z Niderlandami"
 lbv_low_countries_ties_desc: "Dziedzictwo Albrechta I, który niegdyś rządził Holandią, Zelandią i Hainaut — pielęgnuj nasze więzi z Niderlandami po dziś dzień."
 lbv_bavarian_ambition: "Roszczenie do jednej Bawarii"
 lbv_bavarian_ambition_desc: "Rozwój Landshut, handel dunajski i więzi z Niderlandami — buduj na tym i pielęgnuj roszczenie do całej Bawarii."
 lbv_reunite_bavaria: "Zjednocz Bawarię"
 lbv_reunite_bavaria_desc: "Podzielone księstwo — odzyskaj ziemie Górnej Bawarii i zjednocz Bawarię z powrotem w jedną całość."
 lbv_duke_of_all_bavaria: "Książę całej Bawarii"
 lbv_duke_of_all_bavaria_desc: "Pod rodem domu Landshut cała Bawaria jest wreszcie zjednoczona pod jednym sztandarem."
 lbv_events.1.t: "Proklamacja jedności Bawarii"
 lbv_events.1.d: "Pod rodem domu Landshut Bawaria jest wreszcie zjednoczona w jedną całość. Era podziałów dobiega końca."
 lbv_events.1.a: "Chwała Bawarii!"
 STATIC_MODIFIER_NAME_lbv_legacy_mod: "Dziedzictwo Straubing-Holandii"
 STATIC_MODIFIER_DESC_lbv_legacy_mod: "Chwała Albrechta I, którego posiadłości niegdyś obejmowały Holandię i Hainaut, wciąż jest z dumą wspominana na dworze w Landshut."
 STATIC_MODIFIER_NAME_lbv_landshut_mod: "Landshut rozwinięte"
 STATIC_MODIFIER_DESC_lbv_landshut_mod: "Miasto architektury gotyckiej rozkwita jako ośrodek księstwa."
 STATIC_MODIFIER_NAME_lbv_danube_mod: "Handel dunajski"
 STATIC_MODIFIER_DESC_lbv_danube_mod: "Barki pływające po dolinie Dunaju nieustannie rozładowują sól i zboże wzdłuż brzegów Dolnej Bawarii."
 STATIC_MODIFIER_NAME_lbv_low_countries_mod: "Więzi z Niderlandami"
 STATIC_MODIFIER_DESC_lbv_low_countries_mod: "Posłowie i handlarze tkanin z Niderlandów za morzem północnym są ciepło przyjmowani nawet na dworze w Landshut."
 STATIC_MODIFIER_NAME_lbv_reunite_mod: "Bawaria zjednoczona"
 STATIC_MODIFIER_DESC_lbv_reunite_mod: "Wasale dwóch niegdyś podzielonych gałęzi składają teraz przysięgę pod jednym sztandarem."
 STATIC_MODIFIER_NAME_lbv_unify_bavaria_mod: "Książę całej Bawarii"
 STATIC_MODIFIER_DESC_lbv_unify_bavaria_mod: "Dzwony bawarskich wież biją, ogłaszając koniec podziałów."
 lbv_unified_duchy: "Zjednoczone Księstwo Bawarii"
 lbv_unified_duchy_desc: "Era podziałów się skończyła — jako zjednoczone księstwo Bawarii, otwórz nową erę."
 lbv_bavaria_unified_tt: "Zjednoczono Bawarię"
 lbv_landrecht: "Bawarskie prawo krajowe"
 lbv_landrecht_desc: "Jednolite prawo dla zjednoczonego księstwa — wprowadź bawarski kodeks praw (Landrecht) i wzmocnij fundament rządów."
 lbv_tyrol_ambition: "Ambicje wobec Tyrolu"
 lbv_tyrol_ambition_desc: "Hrabstwo Tyrolu, ukryte w objęciach Alp — pielęgnuj ambicje wobec tej ziemi."
 lbv_swabian_expansion: "Ekspansja w Szwabii"
 lbv_swabian_expansion_desc: "Szwabia, rozciągająca się na południowy zachód — wzmocnij nasze wpływy nad tym regionem."
 lbv_greater_bavaria: "Urzeczywistnij Wielką Bawarię"
 lbv_greater_bavaria_desc: "Kodeks praw, Tyrol i Szwabia — buduj na tym i urzeczywistnij Wielką Bawarię."
 lbv_counter_reformation_leader: "Przywódca Kontrreformacji"
 lbv_counter_reformation_leader_desc: "Uosabiaj ducha Soboru Trydenckiego i stań na czele Kontrreformacji."
 lbv_electoral_dignity: "Godność elektorska"
 lbv_electoral_dignity_desc: "W 1623 roku Maksymilian I wreszcie zdobywa rangę elektora — uczyń ten zaszczyt wieczną dumą Bawarii."
 lbv_austrian_rivalry: "Rywalizacja z Austrią"
 lbv_austrian_rivalry_desc: "Rywalizacja z domem Habsburgów o hegemonię w Cesarstwie — przyjmij to wyzwanie od naszego wielkiego rywala."
 lbv_war_of_austrian_succession: "Wojna o sukcesję austriacką"
 lbv_war_of_austrian_succession_desc: "Wojna o roszczenia Karola VII do tronu cesarskiego — wykorzystaj tę wojnę sukcesyjną, by podnieść prestiż Bawarii."
 lbv_imperial_crown: "Korona cesarska"
 lbv_imperial_crown_desc: "W 1742 roku Karol VII, książę Bawarii, koronowany zostaje Cesarzem Świętego Cesarstwa Rzymskiego — pierwszym nie-Habsburgiem noszącym koronę od wieków."
 lbv_enlightened_absolutism: "Oświecony absolutyzm"
 lbv_enlightened_absolutism_desc: "Era Oświecenia, czcząca rozum i naukę — wprowadź ten nowy nurt myśli do rządów Bawarii."
 lbv_napoleonic_alliance: "Wyzwanie dla Francji"
 lbv_napoleonic_alliance_desc: "Europa, wstrząśnięta rewolucją i ambicją Napoleona — Bawaria umacnia roszczenie do tronu tego potężnego sąsiada i toruje własną drogę."
 lbv_kingdom_of_bavaria: "Proklamacja Królestwa Bawarii"
 lbv_kingdom_of_bavaria_desc: "W 1806 roku elektor Maksymilian IV Józef ogłasza się królem Bawarii — długa historia domu Wittelsbachów osiąga tu nowy szczyt."
 lbv_events.3.t: "Korona cesarska"
 lbv_events.3.d: "W 1742 roku Karol VII, książę Bawarii, został koronowany Cesarzem Świętego Cesarstwa Rzymskiego we frankfurckiej katedrze. Minęły wieki, odkąd ktoś inny niż Habsburg nosił koronę cesarską."
 lbv_events.3.a: "Chwała Jego Cesarskiej Mości!"
 lbv_events.99.t: "Proklamacja Królestwa Bawarii"
 lbv_events.99.d: "W 1806 roku elektor Maksymilian IV Józef, pod osłoną Związku Reńskiego, ogłosił się królem Bawarii. Długa historia domu Wittelsbachów osiąga tu nowy szczyt."
 lbv_events.99.a: "Niech żyje Królestwo Bawarii!"
 STATIC_MODIFIER_NAME_lbv_unified_mod: "Zjednoczone Księstwo Bawarii"
 STATIC_MODIFIER_DESC_lbv_unified_mod: "Księstwo nie musi już dzielić swoich dworów, dochodów i wojowników między rywalizujące gałęzie."
 STATIC_MODIFIER_NAME_lbv_greater_mod: "Wielka Bawaria urzeczywistniona"
 STATIC_MODIFIER_DESC_lbv_greater_mod: "Od podnóża Alp po wzgórza Szwabii ziemie pod książęcym sztandarem rozszerzają się z każdą mijającą porą roku."
 STATIC_MODIFIER_NAME_lbv_counter_reformation_mod: "Przywódca Kontrreformacji"
 STATIC_MODIFIER_DESC_lbv_counter_reformation_mod: "W duchu Soboru Trydenckiego kolegia jezuickie otwierają się jedno po drugim w miastach księstwa."
 STATIC_MODIFIER_NAME_lbv_succession_war_mod: "Wojna o sukcesję austriacką"
 STATIC_MODIFIER_DESC_lbv_succession_war_mod: "Oficerowie i żołnierze, zahartowani na polach bitew Wojny o sukcesję austriacką, tworzą teraz rdzeń książęcej armii."
 STATIC_MODIFIER_NAME_lbv_imperial_crown_mod: "Korona cesarska"
 STATIC_MODIFIER_DESC_lbv_imperial_crown_mod: "Pamięć o dniu, gdy książę Bawarii został koronowany we frankfurckiej katedrze, z dumą jest przechowywana w sercu każdego dworzanina."
 STATIC_MODIFIER_NAME_lbv_enlightenment_mod: "Oświecony absolutyzm"
 STATIC_MODIFIER_DESC_lbv_enlightenment_mod: "Na dworze nowe księgi, przybywające z Francji, szerzą ideały Oświecenia, a liczba szkół rośnie z roku na rok."
 STATIC_MODIFIER_NAME_lbv_electoral_dignity_mod: "Godność elektorska"
 STATIC_MODIFIER_DESC_lbv_electoral_dignity_mod: "Gdy książę, odziany w szaty elektora, zajmuje swoje miejsce na wyborach cesarskich, książęta z uwagą wsłuchują się w jego słowa."
 STATIC_MODIFIER_NAME_lbv_kingdom_mod: "Królestwo Bawarii"
 STATIC_MODIFIER_DESC_lbv_kingdom_mod: "W pałacu w Monachium grzmi salut, świętując koronację pierwszego króla Bawarii z domu Wittelsbachów."
