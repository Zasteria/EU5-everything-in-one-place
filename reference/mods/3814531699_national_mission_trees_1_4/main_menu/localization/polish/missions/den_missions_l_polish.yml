l_polish:
 den_kalmar_union_mission_pack: "Chwała Unii Kalmarskiej"
 den_kalmar_union_mission_pack_DESCRIPTION:0 "W 1337 roku Królestwo Danii stoi na krawędzi krachu finansowego i rozdrobnienia terytorialnego. Waldemar IV Atterdag dąży do odzyskania tronu i odbudowy narodu. Odzyskaj Gotlandię, rzuć wyzwanie Lidze Hanzeatyckiej, utwórz Unię Kalmarską z Norwegią i Szwecją, opanuj Bałtyk, podbij Anglię — i wybierz swą wiarę: katolicką niezłomność, luterańską Reformację lub odrodzenie bogów nordyckich. Zbuduj Imperium Skandynawskie."
 den_kalmar_union_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Dania, rozszerz się we wszystkich kierunkach — na północ, na wschód, religijnie — i ustanów Imperium Skandynawskie."
 den_kalmar_union_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by zbudować Imperium Skandynawskie."
 den_kalmar_union_mission_pack_BUTTON_DETAILS:0 "Od odbudowy Waldemara po złoty wiek Unii Kalmarskiej — zjednocz Skandynawię!"
 den_restoration_of_denmark: "Odbudowa Waldemara"
 den_restoration_of_denmark_desc: "W 1340 roku Waldemar IV Atterdag odzyskał tron rozdrobnionej i wyprzedanej po kawałku Danii — nawet Jutlandia była zastawiona Prusom. Kawałek po kawałku ją odzyskał. „Atterdag” — „znów nastał dzień” — samo jego przezwisko uosabiało jego historyczną misję. Zabezpiecz Kopenhagę i podnieś legitymizację korony."
 den_secure_denmark: "Ustabilizuj Danię"
 den_secure_denmark_desc: "Zdobycie Roskilde, Aarhus i Malmö łączy duńskie serce. Roskilde jest tradycyjnym miejscem pochówku duńskich królów i jego duchową stolicą; Malmö jest kluczową bramą do Bałtyku. Z nimi zabezpieczonymi Dania może patrzeć na zewnątrz."
 den_norway_union: "Unia personalna z Norwegią"
 den_norway_union_desc: "Dania i Norwegia weszły w unię personalną w 1380 roku wraz ze śmiercią Haakona VI. Jego córka Małgorzata I została regentką Norwegii i położyła podwaliny pod Unię Kalmarską. Przywiedź Norwegię pod duński sztandar i uczyń pierwszy krok ku jedności skandynawskiej."
 den_sweden_union: "Unia personalna ze Szwecją"
 den_sweden_union_desc: "Szwecja była wielkim północnym rywalem Danii przez pokolenia konfliktu. Niektórzy szwedzcy szlachcice szukają duńskiej ochrony. Czy to przez dyplomację, czy podbój, przywiedź Szwecję pod duńską kontrolę — a Skandynawia stanie się osiągalna."
 den_integrate_holstein: "Włącz Holsztyn"
 den_integrate_holstein_desc: "Holsztyn jest niemieckojęzycznym księstwem, którego książę jest duńskim królem. Kontrola nad Hamburgiem i Holsztynem zabezpiecza południową granicę i wywiera presję na Ligę Hanzeatycką. „Duński w Holsztynie, Holsztyn w Danii” — rozwiąż tę dwuznaczność raz na zawsze."
 den_kalmar_union: "Unia Kalmarska"
 den_kalmar_union_desc: "Unia Kalmarska z 1397 roku, zaprojektowana przez Małgorzatę I, zjednoczyła trzy korony Danii, Norwegii i Szwecji pod jednym królem. Każdy kraj zachowywał swe prawa i tradycje, lecz koordynował politykę zagraniczną i wojskową. Narodziny Imperium Północnego."
 den_unite_scandinavia: "Zjednocz Skandynawię"
 den_unite_scandinavia_desc: "Ze podbitą Szwecją i włączonym Holsztynem cała Skandynawia jednoczy się pod duńskim sztandarem. Od Bałtyku po Morze Norweskie jedna dynastia rządzi wszystkim. To największe osiągnięcie polityczne w historii Północy."
 den_integrate_norway: "Włącz Norwegię"
 den_integrate_norway_desc: "Zdobądź Oslo i Bergen i całkowicie włącz Norwegię częścią imperium duńskiego. Bergen było niegdyś pierwszym północnym węzłem Ligi Hanzeatyckiej — teraz staje się bramą Danii do Północnego Atlantyku."
 den_integrate_sweden: "Włącz Szwecję"
 den_integrate_sweden_desc: "Całkowicie włącz Szwecję częścią imperium duńskiego. Posiadanie Sztokholmu i utrzymanie Svealandu czyni Szwecję nierozłączną częścią królestwa."
 den_develop_trondheim: "Rozwiń Północną Norwegię"
 den_develop_trondheim_desc: "Trondheim jest historyczną stolicą Norwegii i siedzibą jej arcybiskupa. Rozwój północnonorweskiego wybrzeża ustanawia kontrolę nad Północnym Atlantykiem i Morzem Norweskim."
 den_scandinavian_golden_age: "Skandynawski złoty wiek"
 den_scandinavian_golden_age_desc: "Z włączonymi Norwegią i Szwecją i ustanowionym absolutyzmem Skandynawia wkracza w swój złoty wiek największego imperium Europy Północnej. Kopenhaga prosperuje jako centrum kulturalne i gospodarcze, łączące Bałtyk i Morze Północne."
 den_retake_gotland: "Odzyskaj Gotlandię"
 den_retake_gotland_desc: "Visby na Gotlandii było niegdyś jednym z największych miast handlowych Ligi Hanzeatyckiej — nagrodą spornym przez Szwecję, Inflanty i Zakon Krzyżacki. W 1361 roku Waldemar IV zdobył Gotlandię siłą. Zajęcie tej wyspy zabezpiecza kluczowy węzeł handlu bałtyckiego."
 den_sound_toll: "Cło Sundzkie"
 den_sound_toll_desc: "Dania siedzi w wąskim przejściu między Bałtykiem a Morzem Północnym; każdy statek musi przejść przez cieśninę Sund i zapłacić cło. Sformalizowane około 1429 roku, to cło stało się kręgosłupem duńskich finansów królewskich. Zbuduj flotę i w pełni kontroluj cieśninę."
 den_humiliate_hansa: "Upokorz Hanzę"
 den_humiliate_hansa_desc: "Liga Hanzeatycka zmonopolizowała handel bałtycki i zagrażała Danii przez pokolenia. Od upokarzającego Pokoju w Stralsundzie z 1370 roku Dania czekała na zemstę. Kontroluj Lubekę lub prześcigaj Ligę gospodarczo — i rozbij hegemonię hanzeatycką."
 den_reconquer_estonia: "Odzyskaj Estonię"
 den_reconquer_estonia_desc: "Tallin (Reval) został założony jako duńska twierdza w 1219 roku przez Waldemara II — „Taani linn” (duński zamek), jak mówią, pochodzenie jego nazwy. Sprzedany Zakonowi Krzyżackiemu w 1346 roku, odzyskanie tej ziemi przywraca wpływ duński na wschodnim wybrzeżu Bałtyku."
 den_control_livonia: "Opanuj Inflanty"
 den_control_livonia_desc: "Inflanty (dzisiejsza Łotwa i Estonia) są strategiczną nagrodą, spornym przez Zakon Krzyżacki, Polskę, Szwecję i Ruś. Zdobycie Rygi i Tartu umieszcza całe wschodnie wybrzeże bałtyckie w rękach duńskich."
 den_stralsund_treaty: "Zdobądź Stralsund"
 den_stralsund_treaty_desc: "Stralsund i Szczecin są głównymi miastami Pomorza na południowym brzegu Bałtyku. W 1370 roku Dania została zmuszona do upokarzającego traktatu tutaj. Teraz Dania przejmuje inicjatywę — kontrola nad tymi miastami ustanawia dominację nad wybrzeżem pomorskim."
 den_expand_the_toll: "Rozszerz cło"
 den_expand_the_toll_desc: "Rozszerz Cło Sundzkie, by objąć całą bałtycką sieć handlową. Podbiwszy Pomorze i złamawszy Ligę Hanzeatycką, Dania staje się panem handlu północnoeuropejskiego."
 den_master_of_the_baltic: "Pan Bałtyku"
 den_master_of_the_baltic_desc: "Klęska Hanzy i kontrola inflancka — Dania jest niekwestionowanym panem Bałtyku. Zdobycie Królewca i Gdańska dopełnia okrążenie: żaden statek handlowy nie może wejść ani wyjść bez duńskiego pozwolenia."
 den_eliminate_novgorod: "Wyeliminuj Nowogród"
 den_eliminate_novgorod_desc: "Republika Nowogrodzka jest wielkim państwem handlowym na wschodnim krańcu bałtycko-barentsowskich szlaków handlowych. Kontrola nad Nowogrodem i Pskowem przywodzi cały szlak handlu rosyjskimi futrami, bursztynem i miodem pod duński zarząd."
 den_rival_england: "Rywalizuj z Anglią"
 den_rival_england_desc: "Duński król Waldemar Zwycięski niegdyś podbił Anglię (1016). Imperium Morza Północnego Kanuta Wielkiego było największą historyczną chwałą Danii. Nadszedł czas, by ponownie gonić to marzenie. Ogłoś Anglię rywalem i rywalizuj o panowanie nad Morzem Północnym."
 den_north_sea_fleet: "Flota Morza Północnego"
 den_north_sea_fleet_desc: "By rządzić Morzem Północnym, potrzebna jest potężna flota. Rozszerz stocznie Kopenhagi i zbuduj największą flotę w historii skandynawskiej. Nadszedł dzień, gdy duńskie statki pływają od Islandii po Tamizę."
 den_danish_scotland: "Dania w Szkocji"
 den_danish_scotland_desc: "Szkocja jest odwiecznym wrogiem Anglii i potencjalnym sojusznikiem Danii. Zdobycie Edynburga tworzy kleszcze wokół Anglii z północy i południa — odtwarzając erę, gdy wikingowie rządzili wybrzeżami Szkocji."
 den_invade_england: "Najedź Anglię"
 den_invade_england_desc: "Siły duńskie i norweskie wylądowały w północnej Anglii. York był niegdyś stolicą norweskiego królestwa Jórvík — sercem Danelaw. Zdobycie Yorku wskrzesza chwałę Danelaw, rozległych północnych terytoriów angielskich, rządzonych przez osadników duńskich i nordyckich w IX wieku."
 den_conquer_england: "Podbij Anglię"
 den_conquer_england_desc: "Londyn i Edynburg pod duńską kontrolą — po raz pierwszy od tysiąca lat od czasów Kanuta Wielkiego skandynawska dynastia rządzi Wyspami Brytyjskimi. Imperium Morza Północnego Danii, Norwegii, Szwecji i Anglii odrodzone."
 den_religious_question: "Kwestia wiary"
 den_religious_question_desc: "Jaka powinna być wiara Danii? Zachować wierność papieżowi w Rzymie — przyjąć reformatorską naukę Lutra — czy powrócić do dawnych bogów przodków? Ten wybór zdecyduje o przyszłości Danii."
 den_catholic_denmark: "Katolicka Dania"
 den_catholic_denmark_desc: "Królestwo Danii zachowuje wierność Rzymskiemu Kościołowi Katolickiemu. Utrzymując dobre stosunki z papieżem, Dania stoi strażniczką północnej cywilizacji katolickiej z przewagą dyplomatyczną."
 den_crusade_north: "Krucjata Północy"
 den_crusade_north_desc: "Dania stoi północną tarczą chrześcijaństwa, uczestnicząc w świętej wojnie przeciwko niewiernym narodom. Przewodzenie krucjatom przeciwko pozostałym pogańskim terytoriom wschodniego Bałtyku utrwala władzę religijną Danii."
 den_kingdom_of_god: "Królestwo Boże"
 den_kingdom_of_god_desc: "Głębokie zaufanie z papiestwem i kontrola nad Hamburgiem — Dania ustanowiła niewzruszoną pozycję strażniczki północnej cywilizacji katolickiej. Uznany przez Rzym, duński król zapisany jest w historii „Krzyżowcem Północy”."
 den_reformation: "Reformacja"
 den_reformation_desc: "W 1517 roku Marcin Luter opublikował swe dziewięćdziesiąt pięć tez, a fala reformy religijnej przetoczyła się przez Europę. W 1536 roku król Chrystian III ogłosił luteranizm religią państwową Danii. Wyprzedź tę historyczną transformację i zbuduj luterańską Danię."
 den_protestant_church: "Kościół protestancki"
 den_protestant_church_desc: "Po nawróceniu na luteranizm majątek kościelny został przekazany koronie duńskiej, znacznie wzmacniając finanse państwowe. Rozwiń uniwersytety, by kształcić teologów luterańskich i zakorzenić wiarę protestancką w całej Danii."
 den_protestant_league: "Liga protestancka"
 den_protestant_league_desc: "Narody luterańskie jednoczą się w lidze ze środkiem w Danii. Podobnie jak Związek Szmalkaldzki, Dania przewodzi protestanckiemu światu Europy Północnej jako obrońca Reformacji."
 den_norse_revival: "Odrodzenie wiary nordyckiej"
 den_norse_revival_desc: "Bogowie epoki wikingów — Odyn, Thor, Freyr — nigdy naprawdę nie odeszli. Niektórzy szlachcice nordyccy opierali się chrystianizacji i marzą o powrocie do dawnych bogów. Królewski mecenat tego ruchu zapala niespotykaną rewolucję religijną w Skandynawii."
 den_viking_tradition: "Tradycja wikingów"
 den_viking_tradition_desc: "Krew dawnych Skandynawów znów jest gorąca. Wojenny duch przodków — przekraczać morza, wkraczać na wrogie ziemie, pustoszyć i podbijać — zamieszkuje armię duńską. Zbuduj potężną armię lądową i flotę; odtwórz chwałę epoki wikingów."
 den_asgard_kingdom: "Królestwo Asgardu"
 den_asgard_kingdom_desc: "Pod błogosławieństwem Odyna Skandynawia odradza się królestwem dawnych bogów. Wiara, że odważni wojownicy, polegli w bitwie, są przyjmowani do Walhalli, staje się duchowym filarem narodu. Zjednocz całą Skandynawię i zbuduj królestwo bogów."
 den_strengthen_crown: "Wzmocnij koronę"
 den_strengthen_crown_desc: "Królestwo Danii historycznie miało swą władzę królewską ograniczoną przez potężną szlachtę. „Håndfæstning” zmuszał każdego króla do nadania przywilejów szlacheckich przy wstąpieniu na tron. Powoli zerwij te łańcuchy i wzmocnij duńską monarchię."
 den_copenhagen_university: "Uniwersytet Kopenhaski"
 den_copenhagen_university_desc: "Uniwersytet Kopenhaski, założony w 1479 roku, jest najstarszym uniwersytetem Skandynawii. Jego wydziały teologii, prawa, medycyny i filozofii czynią go centrum kultury duńskiej. Zbuduj uniwersytet w Kopenhadze i urzeczywistnij uczoną stolicę Północy."
 den_develop_copenhagen: "Rozwiń Kopenhagę"
 den_develop_copenhagen_desc: "Kopenhaga — „port kupców” — wyrosła kluczowym węzłem handlu bałtyckiego. Podnieś ją do rangi miasta, przekształcając ją w wielką stolicę królewską, na jaką zasługuje Dania."
 den_revoke_privileges: "Uchyl przywileje"
 den_revoke_privileges_desc: "Zniosij przywileje szlacheckie, które ograniczały duńską władzę królewską. Wyniesienie władzy królewskiej i przeprowadzenie reform rządowych stawia Danię na ścieżce scentralizowanego absolutyzmu."
 den_danish_navy: "Duńska Królewska Marynarka"
 den_danish_navy_desc: "Rozwiń stocznie Kopenhagi i ustanów duńską flotę królewską. Ta stała instytucja wojskowa, wspierająca duńską hegemonię nad Bałtykiem i Morzem Północnym, staje się filarem duńskiej potęgi."
 den_amber_trade: "Handel bursztynem"
 den_amber_trade_desc: "Bałtycki bursztyn — „Złoto Północy” — ceniony od czasów starożytnych. Rozszerz wywóz bursztynu i klejnotów przez bałtyckie szlaki handlowe Danii i zapewnij bogaty dochód handlowy."
 den_develop_aarhus: "Rozwiń Aarhus"
 den_develop_aarhus_desc: "Aarhus jest największym miastem Jutlandii i centrum handlowym zachodniej Danii. Podniesienie go do rangi miasta czyni je drugim miastem Danii po Kopenhadze."
 den_develop_malmo: "Rozwiń Malmö"
 den_develop_malmo_desc: "Malmö, w południowej Szwecji (Skania), stoi po drugiej stronie cieśniny Sund od Kopenhagi. Rozwój tego miasta tworzy żywotną parę dla Kopenhagi jako węzła duńskiej kontroli nad Bałtykiem."
 den_absolutism: "Absolutyzm"
 den_absolutism_desc: "W 1660 roku król Fryderyk III zwołał trzy stany — szlachtę, duchowieństwo i pospólstwo — i zmusił je do ogłoszenia dziedzicznej monarchii absolutnej. Jedna z najdramatyczniejszych transformacji politycznych w historii skandynawskiej. Wyniesienie władzy królewskiej i legitymizacji, by wyprzedzić ten historyczny zwrot."
 den_economic_powerhouse: "Północna potęga handlowa"
 den_economic_powerhouse_desc: "Cło Sundzkie, handel północnomorski, rolnictwo skandynawskie — Dania z jej zróżnicowanymi źródłami dochodu stała się największą potęgą gospodarczą Europy Północnej. Utrzymuj dochód 300+ i liczne centra handlowe, by zapewnić dominację gospodarczą."
 den_north_sea_dominion: "Panowanie nad Morzem Północnym"
 den_north_sea_dominion_desc: "Skandynawia zjednoczona, Bałtyk podbity, skandynawski złoty wiek osiągnięty — Dania panuje największym imperium Europy Północnej. Z 80+ okrętami, 600+ dochodem miesięcznym i 600+ prowincjami zgłoś roszczenia do tego chwalebnego tytułu."
 den_scandinavian_empire: "Imperium Skandynawskie"
 den_scandinavian_empire_desc: "Od Bałtyku po Anglię, od Gotlandii po Nowogród — Imperium Skandynawskie ukończone. Dania, odbudowana przez Waldemara IV, wyrosła na wielkie imperium, panujące nad całą Europą Północną. 1000+ prowincji, prestiż 80+, dochód 1000+ — zdobądź tę chwałę."
 den_events.10.t: "Norweska unia personalna"
 den_events.10.d: "Król Danii odziedziczył tron Norwegii. Od czasów wikingów Dania i Norwegia były związane pod jednym domem królewskim. Bogate łowiska, drewno i wrota do Północnego Atlantyku Norwegii znacznie rozszerzają duńską potęgę. Król, dzierżący tytuł „Króla Dwóch Królestw”, uczynił historyczny pierwszy krok ku jedności skandynawskiej."
 den_events.10.a: "Norwegia i Dania jednością na wieki!"
 den_events.20.t: "Szwedzka unia personalna"
 den_events.20.d: "Król Danii zabezpieczył również tron szwedzki. Niektórzy szwedzcy szlachcice się opierają, lecz ta unia personalna jest decydującym krokiem ku jedności skandynawskiej. Dyplomatyczny geniusz królowej Małgorzaty dokonał tego cudu — marzenie o „Cesarzu Skandynawii” zbliża się do rzeczywistości."
 den_events.20.a: "Ku jedności trzech królestw — naprzód!"
 den_events.30.t: "Unia Kalmarska"
 den_events.30.d: "W Kalmarze w Szwecji przedstawiciele Danii, Norwegii i Szwecji zebrali się i ogłosili unię pod królem Erykiem Pomorskim. Każdy kraj zachowuje swe prawa i tradycje, lecz koordynuje politykę zagraniczną i wojskową. „Waldemar marzył o tym; Małgorzata uczyniła to rzeczywistością” — tak później napiszą historycy."
 den_events.30.a: "Niech żyje Unia Kalmarska! Skandynawia jest jednością!"
 den_events.40.t: "Skrzyżowanie wiary"
 den_events.40.d: "Zażarty spór religijny rozgorzał na dworze duńskim. Kontynuować tradycyjną wierność papieżowi w Rzymie — przyjąć nową naukę Marcina Lutra — czy powrócić do dawnych bogów przodków? Ten wybór uderza w same podstawy państwa duńskiego."
 den_events.40.a: "Zachować wierność Rzymowi — katolicyzm jest wiarą Danii"
 den_events.40.a.tt: "Postęp drogą katolicką. Ułatwia spełnienie warunków misji den_catholic_denmark."
 den_events.40.b: "Przyjąć naukę Lutra — nadeszła era reformy"
 den_events.40.b.tt: "Postęp drogą luterańską. Ułatwia spełnienie warunków misji den_reformation."
 den_events.40.c: "Powrócić do dawnych bogów — szukać błogosławieństwa Odyna"
 den_events.40.c.tt: "Postęp drogą nordycką. Ułatwia spełnienie warunków misji den_norse_revival."
 den_events.99.t: "Narodziny Imperium Skandynawskiego"
 den_events.99.d: "Wieki po tym, jak Waldemar IV odziedziczył zniszczoną Danię — teraz, gdy Dania wyrosła na wielkie imperium, panujące nad całą Europą Północną. Od Bałtyku po Morze Północne, od stepów nowogrodzkich po Wyspy Brytyjskie, wszystko leży w granicach królestwa cesarza duńskiego. Historycy napiszą później: „Atterdag — znów nastał dzień — był prawdziwą przepowiednią”."
 den_events.99.a: "Niech żyje Cesarz Imperium Skandynawskiego!"
 STATIC_MODIFIER_NAME_den_valdemar_legacy_mod: "Dziedzictwo Waldemara"
 STATIC_MODIFIER_DESC_den_valdemar_legacy_mod: "„Atterdag — znów nastał dzień”. Odbudowa Waldemara IV położyła kamień węgielny odrodzenia Danii."
 STATIC_MODIFIER_NAME_den_holstein_integration_mod: "Holsztyn włączony"
 STATIC_MODIFIER_DESC_den_holstein_integration_mod: "Księstwo Holsztynu w pełni włączone do imperium duńskiego. Południowa granica ustabilizowana, a południowe szlaki handlowe zabezpieczone."
 STATIC_MODIFIER_NAME_den_scandinavia_united_mod: "Skandynawia zjednoczona"
 STATIC_MODIFIER_DESC_den_scandinavia_united_mod: "Trzy królestwa zjednoczone pod jednym sztandarem. Narodziny największego państwa Europy Północnej."
 STATIC_MODIFIER_NAME_den_norway_integration_mod: "Norwegia włączona"
 STATIC_MODIFIER_DESC_den_norway_integration_mod: "Norwegia włączona częścią imperium duńskiego. Wrota do Północnego Atlantyku otwarte."
 STATIC_MODIFIER_NAME_den_sweden_integration_mod: "Szwecja włączona"
 STATIC_MODIFIER_DESC_den_sweden_integration_mod: "Imię króla duńskiego odczytywane jest w halach Sztokholmu, a szwedzcy panowie również zasiadają przy tym samym stole jako członkowie imperium."
 STATIC_MODIFIER_NAME_den_visby_trade_mod: "Węzeł handlowy Visby"
 STATIC_MODIFIER_DESC_den_visby_trade_mod: "Visby na Gotlandii odrodzone jako duński węzeł handlowy. Dawne miasto hanzeatyckie znów prosperuje."
 STATIC_MODIFIER_NAME_den_sound_toll_mod: "Cło Sundzkie"
 STATIC_MODIFIER_DESC_den_sound_toll_mod: "System poboru cła ustanowiony. Każdy statek handlowy wchodzący na Bałtyk lub go opuszczający płaci Danii."
 STATIC_MODIFIER_NAME_den_hansa_dominance_mod: "Klęska Hanzy"
 STATIC_MODIFIER_DESC_den_hansa_dominance_mod: "Dania rozbiła hegemonię hanzeatycką i zdobyła kontrolę nad handlem bałtyckim."
 STATIC_MODIFIER_NAME_den_estonia_mod: "Estonia odzyskana"
 STATIC_MODIFIER_DESC_den_estonia_mod: "Tallin (duński zamek) wrócił do Danii. Wpływ duński na wschodnim wybrzeżu Bałtyku przywrócony."
 STATIC_MODIFIER_NAME_den_livonia_mod: "Inflanty podporządkowane"
 STATIC_MODIFIER_DESC_den_livonia_mod: "Z zabezpieczonymi Rygą i Tartu całe wschodnie wybrzeże bałtyckie pod zarządem duńskim."
 STATIC_MODIFIER_NAME_den_pomeranian_coast_mod: "Wybrzeże pomorskie"
 STATIC_MODIFIER_DESC_den_pomeranian_coast_mod: "Zdobycie Stralsundu i Szczecina umieszcza całe wybrzeże pomorskie pod duńską kontrolą."
 STATIC_MODIFIER_NAME_den_sound_toll_extended_mod: "Rozszerzone cło"
 STATIC_MODIFIER_DESC_den_sound_toll_extended_mod: "Każdy statek przepływający przez Sund, do jakiegokolwiek portu bałtyckiego zmierzający, opuszcza żagle przed łańcuchem duńskiej służby celnej."
 STATIC_MODIFIER_NAME_den_baltic_master_mod: "Pan Bałtyku"
 STATIC_MODIFIER_DESC_den_baltic_master_mod: "Duńska flota dominuje nad całym Bałtykiem. Każdy port od Królewca po Gdańsk odpowiada Danii."
 STATIC_MODIFIER_NAME_den_eastern_routes_mod: "Wschodnie szlaki handlowe"
 STATIC_MODIFIER_DESC_den_eastern_routes_mod: "Nowogród podbity — cały szlak handlowy rosyjskich towarów teraz pod duńskim zarządem."
 STATIC_MODIFIER_NAME_den_north_sea_fleet_mod: "Flota Morza Północnego"
 STATIC_MODIFIER_DESC_den_north_sea_fleet_mod: "Duńska flota królewska kontroluje Morze Północne. Od Islandii po Tamizę powiewa duński sztandar."
 STATIC_MODIFIER_NAME_den_scotland_mod: "Dania w Szkocji"
 STATIC_MODIFIER_DESC_den_scotland_mod: "Edynburg zdobyty — Anglię można teraz zacisnąć z północy i południa."
 STATIC_MODIFIER_NAME_den_england_invasion_mod: "Inwazja na Anglię"
 STATIC_MODIFIER_DESC_den_england_invasion_mod: "Siły duńskie zajmujące York wskrzesiły pamięć o Danelaw."
 STATIC_MODIFIER_NAME_den_north_sea_empire_mod: "Imperium Morza Północnego"
 STATIC_MODIFIER_DESC_den_north_sea_empire_mod: "Po raz pierwszy od tysiąca lat od czasów Kanuta Wielkiego skandynawska dynastia rządzi Wyspami Brytyjskimi. Imperium Morza Północnego odrodzone."
 STATIC_MODIFIER_NAME_den_catholic_devotion_mod: "Oddanie katolickie"
 STATIC_MODIFIER_DESC_den_catholic_devotion_mod: "Dania zachowuje wierność Kościołowi Rzymskiemu. Współpraca z papieżem daje Danii przewagę dyplomatyczną."
 STATIC_MODIFIER_NAME_den_northern_crusader_mod: "Krzyżowiec Północy"
 STATIC_MODIFIER_DESC_den_northern_crusader_mod: "Udział Danii w świętej wojnie zyskuje rozgłos strażniczki chrześcijaństwa."
 STATIC_MODIFIER_NAME_den_papal_champion_mod: "Obrońca papieża"
 STATIC_MODIFIER_DESC_den_papal_champion_mod: "Dania ustanowiła niewzruszoną pozycję strażniczki północnej cywilizacji katolickiej."
 STATIC_MODIFIER_NAME_den_lutheran_reform_mod: "Reforma luterańska"
 STATIC_MODIFIER_DESC_den_lutheran_reform_mod: "Złote kielichy i srebrne świeczniki skonfiskowanych klasztorów przetopione w mennicy królewskiej w Kopenhadze i wybite w nową monetę."
 STATIC_MODIFIER_NAME_den_protestant_church_mod: "Kościół protestancki"
 STATIC_MODIFIER_DESC_den_protestant_church_mod: "Rozwój uniwersytetów i przygotowanie teologii luterańskiej zakorzenia wiarę protestancką w całej Danii."
 STATIC_MODIFIER_NAME_den_protestant_league_mod: "Liga protestancka"
 STATIC_MODIFIER_DESC_den_protestant_league_mod: "Sojusz luterański, przewodzony przez Danię, jednoczy protestancki świat Europy Północnej."
 STATIC_MODIFIER_NAME_den_norse_revival_mod: "Odrodzenie wiary nordyckiej"
 STATIC_MODIFIER_DESC_den_norse_revival_mod: "Kult Odyna, Thora i Freyra przywrócony. Wojenny duch przodków zamieszkuje armie duńskie."
 STATIC_MODIFIER_NAME_den_viking_warriors_mod: "Wojownicy wikingów"
 STATIC_MODIFIER_DESC_den_viking_warriors_mod: "Wojenny duch epoki wikingów odrodzony. Armie Danii są niezrównane w przekraczaniu mórz i podbijaniu wrogich ziem."
 STATIC_MODIFIER_NAME_den_asgard_kingdom_mod: "Królestwo Asgardu"
 STATIC_MODIFIER_DESC_den_asgard_kingdom_mod: "Pod błogosławieństwem Odyna Skandynawia odradza się królestwem dawnych bogów."
 STATIC_MODIFIER_NAME_den_royal_authority_mod: "Władza królewska"
 STATIC_MODIFIER_DESC_den_royal_authority_mod: "Rada szlachty nie stoi już na drodze woli króla, a jego rozkazy docierają do wsi każdego zakątka ziemi bezpośrednio."
 STATIC_MODIFIER_NAME_den_copenhagen_learning_mod: "Uniwersytet Kopenhaski"
 STATIC_MODIFIER_DESC_den_copenhagen_learning_mod: "Najstarszy uniwersytet Skandynawii otwarty w Kopenhadze. Prosperuje jako centrum północnej nauki i kultury."
 STATIC_MODIFIER_NAME_den_copenhagen_capital_mod: "Stolica Kopenhaga rozwinięta"
 STATIC_MODIFIER_DESC_den_copenhagen_capital_mod: "Nowe kamienne rezydencje wznoszą się jedna po drugiej wzdłuż ulic Kopenhagi, która kipi życiem, jak przystało na stolicę królewską."
 STATIC_MODIFIER_NAME_den_absolutism_mod: "Absolutyzm"
 STATIC_MODIFIER_DESC_den_absolutism_mod: "Monarchia absolutna ustanowiona w Danii — wyprzedzając historyczną transformację z 1660 roku, władza królewska w pełni umocniona."
 STATIC_MODIFIER_NAME_den_danish_economy_mod: "Duńska potęga gospodarcza"
 STATIC_MODIFIER_DESC_den_danish_economy_mod: "Gospodarka Danii — zbudowana na Cle Sundzkim, handlu północnomorskim i rolnictwie skandynawskim — największa w Europie Północnej."
 STATIC_MODIFIER_NAME_den_crown_privileges_mod: "Przywileje korony"
 STATIC_MODIFIER_DESC_den_crown_privileges_mod: "Listy przywilejów, które szlachcice trzymali przez pokolenia, obalone, a królewscy pisarze zarządzają teraz administracją całego królestwa."
 STATIC_MODIFIER_NAME_den_royal_navy_mod: "Duńska Królewska Marynarka"
 STATIC_MODIFIER_DESC_den_royal_navy_mod: "Duńska flota królewska, z bazą w Kopenhadze, założona — stała instytucja wojskowa, wspierająca zwierzchność nad Bałtykiem i Morzem Północnym."
 STATIC_MODIFIER_NAME_den_amber_trade_mod: "Handel bursztynem"
 STATIC_MODIFIER_DESC_den_amber_trade_mod: "Wywóz bałtyckiego bursztynu rozszerzony. „Złoto Północy” krąży po całej Europie, wzbogacając Danię."
 STATIC_MODIFIER_NAME_den_aarhus_mod: "Aarhus rozwinięte"
 STATIC_MODIFIER_DESC_den_aarhus_mod: "Największe miasto Jutlandii, Aarhus, rozwinięte węzłem handlowym zachodniej Danii."
 STATIC_MODIFIER_NAME_den_malmo_mod: "Malmö rozwinięte"
 STATIC_MODIFIER_DESC_den_malmo_mod: "Malmö na zachodnim brzegu cieśniny Sund wyrosło bałtyckim węzłem handlowym, sparowanym z Kopenhagą."
 STATIC_MODIFIER_NAME_den_norway_north_mod: "Północna Norwegia rozwinięta"
 STATIC_MODIFIER_DESC_den_norway_north_mod: "Rozwój północnonorweskiego wybrzeża ustanawia kontrolę nad Północnym Atlantykiem i Morzem Norweskim."
 STATIC_MODIFIER_NAME_den_golden_age_mod: "Skandynawski złoty wiek"
 STATIC_MODIFIER_DESC_den_golden_age_mod: "Z włączonymi Norwegią i Szwecją i ustanowionym absolutyzmem Skandynawia wkracza w swój złoty wiek największego imperium Europy Północnej."
 STATIC_MODIFIER_NAME_den_north_sea_dominion_mod: "Panowanie nad Morzem Północnym"
 STATIC_MODIFIER_DESC_den_north_sea_dominion_mod: "Dania, kontrolująca zarówno Bałtyk, jak i Morze Północne, panuje nad całym handlem północnoeuropejskim."
 STATIC_MODIFIER_NAME_den_scandinavian_empire_final_mod: "Imperium Skandynawskie"
 STATIC_MODIFIER_DESC_den_scandinavian_empire_final_mod: "Imperium Skandynawskie, rozciągające się od Bałtyku po Morze Północne, ukończone. Odrodzenie Danii od odbudowy Waldemara osiągnęło swój szczyt."
 STATIC_MODIFIER_NAME_den_norway_union_bonus_mod: "Bonus unii norweskiej"
 STATIC_MODIFIER_DESC_den_norway_union_bonus_mod: "Norweska unia personalna otworzyła drogę do jedności skandynawskiej."
 STATIC_MODIFIER_NAME_den_sweden_union_bonus_mod: "Bonus unii szwedzkiej"
 STATIC_MODIFIER_DESC_den_sweden_union_bonus_mod: "Szwedzka unia personalna wprowadza utworzenie Unii Kalmarskiej w pole widzenia."
 STATIC_MODIFIER_NAME_den_kalmar_union_mod: "Unia Kalmarska"
 STATIC_MODIFIER_DESC_den_kalmar_union_mod: "Dania, Norwegia i Szwecja zjednoczone pod jednym królem — największa integracja polityczna w historii Północy."
 STATIC_MODIFIER_NAME_den_faith_steadfast_mod: "Niezłomny w wierze"
 STATIC_MODIFIER_DESC_den_faith_steadfast_mod: "Niezłomna wiara katolicka ogłasza władzę króla ludowi dzwonami katedry w Roskilde."
 STATIC_MODIFIER_NAME_den_reform_winds_mod: "Wiatry reformy"
 STATIC_MODIFIER_DESC_den_reform_winds_mod: "Nauka Lutra rozprzestrzenia się po Danii. Fala reformy zmienia społeczeństwo duńskie."
 STATIC_MODIFIER_NAME_den_old_gods_calling_mod: "Wołanie dawnych bogów"
 STATIC_MODIFIER_DESC_den_old_gods_calling_mod: "Wiara w Odyna i Thora potajemnie się odradza. Błogosławieństwo bogów przodków inspiruje armie duńskie."
 den_finland_integration: "Włącz Finlandię"
 den_finland_integration_desc: "Finlandia to rozległe leśne wschodnie królestwo szwedzkiego królestwa. Turku (Åbo) jest centrum administracyjnym i religijnym Finlandii; Wyborg strzeże granicy karelskiej; Uleåborg (Oulu) jest najbardziej wysuniętym na północ miastem. Pełna kontrola nad Finlandią ustanawia wschodnią granicę imperium duńskiego od północnego Bałtyku po Koło Podbiegunowe, umożliwiając politykę kolonialną na dzikich obszarach."
 STATIC_MODIFIER_NAME_den_finland_mod: "Pogranicze fińskie"
 STATIC_MODIFIER_DESC_den_finland_mod: "Rozległe lasy i drogi wodne Finlandii przyciągają osadników. Przesiedleńcy z Danii i Szwecji zagospodarowują to pogranicze, odsuwając wschodnie granice imperium coraz dalej."
