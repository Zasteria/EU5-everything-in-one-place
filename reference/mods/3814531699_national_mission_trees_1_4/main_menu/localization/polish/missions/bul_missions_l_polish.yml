l_polish:
 bul_bulgaria_mission_pack: "Nowe Bizancjum — dziedzictwo Drugiego Cesarstwa i hegemonia bałkańska"
 bul_bulgaria_mission_pack_DESCRIPTION:0 "Jako dziedzic dziedzictwa Drugiego Cesarstwa Bułgarskiego ustanów niepodległość, zgłoś roszczenia do hegemonii nad Półwyspem Bałkańskim, odeprzyj zagrożenie osmańskie i wznieś nowe Bizancjum w Konstantynopolu."
 bul_bulgaria_mission_pack_CRITERIA_DESCRIPTION:0 "Ustanów niepodległość, odrodź imperium bałkańskie, odeprzyj Osmanów i załóż Nowe Bizancjum."
 bul_bulgaria_mission_pack_BUTTON_TOOLTIP:0 "Od starożytnego miasta Tyrnowo do nowego imperium, jaśniejącego nad Bałkanami."
 bul_bulgaria_mission_pack_BUTTON_DETAILS:0 "„Pan Carogrodu” — odziedzicz chwałę Drugiego Cesarstwa i załóż Trzecie Cesarstwo Bułgarskie!"
 bul_second_bulgarian_legacy: "Rozpadające się cesarstwo"
 bul_second_bulgarian_legacy_desc: "Chwalebne cesarstwo, zbudowane przez Iwana Asena I i Iwana Asena II, rozpada się teraz pod ambicją szlachty na Tyrnowo, Widyń i Dobrudżę — powstrzymaj ten upadek."
 bul_assert_independence: "Władza Carogrodu"
 bul_assert_independence_desc: "Cesarstwo na krawędzi rozpadu — jako car Tyrnowa ustanów władzę, która nie kłania się żadnej rywalizującej potędze."
 bul_tarnovo_capital: "Rozwiń Tyrnowo"
 bul_tarnovo_capital_desc: "Tyrnowo, niegdyś zwane „Drugim Carogrodem” — odrodź chwałę dawnej stolicy imperialnej w tej ziemi raz jeszcze."
 bul_bulgarian_patriarchate: "Patriarchat Bułgarski"
 bul_bulgarian_patriarchate_desc: "Autokefaliczny kościół, niezależny od Konstantynopola — uczyń władzę Bułgarskiego Kościoła Prawosławnego niewzruszoną."
 bul_boyar_council: "Rada Bojarów"
 bul_boyar_council_desc: "Bojarzy, szlachta, która od dawna wspierała Bułgarię — wykorzystaj ich radę jako filar rządzenia."
 bul_reunite_bulgaria: "Zjednocz Bułgarię"
 bul_reunite_bulgaria_desc: "Bułgaria i Sylistra — zjednocz te historyczne ziemie rdzenne pod jednym sztandarem."
 bul_bulgarian_independence: "Zjednoczenie cesarstwa"
 bul_bulgarian_independence_desc: "Cesarstwo rozpadło się na Widyń i Dobrudżę — przywiedź te ziemie z powrotem pod jedną koronę i zjednocz cesarstwo ze środkiem w Tyrnowie."
 bul_sofia: "Miasto Świętej Mądrości"
 bul_sofia_desc: "Serdika, Sredec, Triadica — to miasto nosiło wiele imion przez wieki. Nazwij je tytułem odpowiednim dla nowej epoki."
 bul_conquer_macedonia: "Podbij Macedonię"
 bul_conquer_macedonia_desc: "Macedonia, od dawna centrum kultury bułgarskiej od czasów starożytnych — odzyskaj tę ziemię w naszą domenę."
 bul_conquer_serbia: "Podbij Serbię"
 bul_conquer_serbia_desc: "Sąsiednie ziemie Serbii — podporządkuj tego rywala w zmaganiach o hegemonię bałkańską."
 bul_bulgarian_empire: "Cesarstwo Bułgarskie"
 bul_bulgarian_empire_desc: "Bułgaria niegdyś rządziła wielkim Cesarstwem, obejmującym znaczną część Bałkanów. Przywrócimy te ziemie w naszą domenę!"
 bul_conquer_wallachia: "Podbij Wołoszczyznę"
 bul_conquer_wallachia_desc: "Wołoszczyzna, na północnym brzegu Dunaju — ustanów nasz wpływ nad tą ziemią."
 bul_conquer_moldavia: "Podbij Mołdawię"
 bul_conquer_moldavia_desc: "Mołdawia, na wschód od Gór Karpackich — przywiedź tę bogatą ziemię w naszą domenę."
 bul_conquer_transylvania: "Podbij Siedmiogród"
 bul_conquer_transylvania_desc: "Siedmiogród, otoczony górami — uczyń ten region częścią naszego imperium."
 bul_conquer_thrace_greece: "Podbij Trację i Północną Grecję"
 bul_conquer_thrace_greece_desc: "Ziemia starożytnych Traków i Północna Grecja — włącz ten region do naszego imperium."
 bul_extend_the_empire: "Rozszerz Cesarstwo"
 bul_extend_the_empire_desc: "Granice Cesarstwa muszą zostać odsunięte jeszcze dalej. Kontynuujmy naszą kampanię w Grecji i Karpatach."
 bul_chitalishte_movement: "Ruch czytelni (Chitalishte)"
 bul_chitalishte_movement_desc: "„Czytelnie”, znane jako chitalishte — ośrodki kulturalne wspólnoty — niech zapuszczą korzenie po całej ziemi, pielęgnując piśmienność i świadomość narodową wśród mieszczan. Tu zaczyna się Bułgarskie Odrodzenie Narodowe."
 bul_chitalishte_unlock_tt: "Przywilej miejski „Miasto Czytelni” staje się dostępny."
 bul_ottoman_wars: "Wojny osmańskie"
 bul_ottoman_wars_desc: "Rosnące Imperium Osmańskie — stawić czoła walce z tym nowym zagrożeniem."
 bul_varna_crusade: "Krucjata Warneńska"
 bul_varna_crusade_desc: "Powstań obok Węgier i poprowadź krucjatę przeciw Osmanom. W 1444 roku historia zwraca się pod Warną."
 bul_end_ottoman_threat: "Zakończ zagrożenie osmańskie"
 bul_end_ottoman_threat_desc: "Niegdyś obawiane zagrożenie osmańskie — połóż mu kres i zabezpiecz naszą pozycję na Bałkanach."
 bul_constantinople_ambition: "Ambicja wobec Konstantynopola"
 bul_constantinople_ambition_desc: "Miasto, które niegdyś było centrum świata prawosławnego — żywij ambicję wobec tego miasta."
 bul_new_byzantium: "Posiadanie Konstantynopola i Rzymu"
 bul_new_byzantium_desc: "Konstantynopol, centrum świata prawosławnego, i Rzym, siedziba Kościoła Zachodniego — zdobądź oba miasta razem i pozwól Bułgarii wznieść się jako nowe imperium, przewodzące obu połowom chrześcijaństwa."
 bul_black_sea_trade: "Handel czarnomorski"
 bul_black_sea_trade_desc: "Warna, miasto portowe nad Morzem Czarnym — rozwiń je jako przyczółek handlu czarnomorskiego."
 bul_black_sea_dominion: "Panowanie nad Morzem Czarnym"
 bul_black_sea_dominion_desc: "Rozległa linia brzegowa Morza Czarnego — ustanów zwierzchność w handlu na tych wodach."
 bul_third_bulgarian_empire: "Trzecie Cesarstwo Bułgarskie"
 bul_third_bulgarian_empire_desc: "Niepodległość, zjednoczenie Bałkanów, klęska Osmanów i założenie Nowego Bizancjum — tu Trzecie Cesarstwo Bułgarskie jest ukończone."
 bul_events.1.t: "Proklamacja zjednoczenia imperialnego"
 bul_events.1.d: "Tyrnowo, Widyń i Dobrudża, niegdyś rozdrobnione, są znów zjednoczone jako jedno cesarstwo. Drugie Cesarstwo Bułgarskie znajduje nową siłę."
 bul_events.1.a: "Chwała Bułgarii!"
 bul_events.4.t: "Historia Sofii"
 bul_events.4.d: "To starożytne miasto, zwane przez Rzymian Serdiką, a później przez Słowian Sredcem, przyjmie teraz nowe imię na cześć Kościoła Świętej Mądrości (Sofii). Trakowie, Rzymianie, Bizantyjczycy i Bułgarzy — niech ciężar wielu cywilizacji, które przeszły przez tę kotlinę, zostanie wyryty w pamięci."
 bul_events.4.a: "Nazwać ją Sofią"
 bul_events.4.b: "Nazwać ją Sofią i uczynić nową stolicą imperialną"
 bul_events.2.t: "Proklamacja Cesarstwa Bułgarskiego"
 bul_events.2.d: "Jako władca nad Macedonią i Serbią Bułgaria tu ogłasza się cesarstwem."
 bul_events.2.a: "Niech żyje Cesarz!"
 bul_events.3.t: "Marzenie o Nowym Bizancjum"
 bul_events.3.d: "Za murami Konstantynopola i na wzgórzach wiecznego Rzymu jednakowo sztandar Bułgarii powiewa teraz. Jako nowe centrum świata prawosławnego i siedziba Kościoła Zachodniego te dwa miasta odradzają się tu jako bliźniacze filary nowego imperium."
 bul_events.3.a: "Bóg jest z nami!"
 bul_events.99.t: "Proklamacja Trzeciego Cesarstwa Bułgarskiego"
 bul_events.99.d: "Długa droga, rozpoczęta w starożytnym mieście Tyrnowo, przez zjednoczenie Bałkanów, klęskę Osmanów i założenie Nowego Bizancjum, osiągnęła tu swe prawdziwe dopełnienie."
 bul_events.99.a: "Niech żyje Trzecie Cesarstwo Bułgarskie!"
 bul_hagia_sophia_sofia: "Kościół Świętej Zofii"
 bul_hagia_sophia_sofia_desc: "Bazylika wzniesiona w VI wieku za panowania cesarza Justyniana — jej imię, oznaczające „Świętą Mądrość”, z czasem pożyczy się miastu, które wyrosło wokół niej. Przetrwawszy niezliczone wieki, ten kościół cicho świadczy o swej historii jako dusza nowej stolicy, osadzonej w sercu Bułgarii."
 STATIC_MODIFIER_NAME_bul_legacy_mod: "Dziedzictwo Drugiego Cesarstwa Bułgarskiego"
 STATIC_MODIFIER_DESC_bul_legacy_mod: "Nawet pośród burzy walk wewnętrznych maszyneria prawa i rzemiosło pisarzy na dworze ledwo się trzymają."
 STATIC_MODIFIER_NAME_bul_independence_mod: "Niepodległość ustanowiona"
 STATIC_MODIFIER_DESC_bul_independence_mod: "Nikt nie śmie już kwestionować władzy tego, kto zasiada na tronie Tyrnowa."
 STATIC_MODIFIER_NAME_bul_tarnovo_mod: "Wielkie Tyrnowo"
 STATIC_MODIFIER_DESC_bul_tarnovo_mod: "Pałace i kościoły, wzniesione na wzgórzu Carewiec, odzyskują wielkość stolicy imperialnej."
 STATIC_MODIFIER_NAME_bul_patriarchate_mod: "Patriarchat Bułgarski"
 STATIC_MODIFIER_DESC_bul_patriarchate_mod: "Błogosławieństwo Patriarchy przynosi pokój sercom wiernych, gdziekolwiek mieszkają."
 STATIC_MODIFIER_NAME_bul_boyar_mod: "Rada Bojarów"
 STATIC_MODIFIER_DESC_bul_boyar_mod: "Bojarzy odnowili swą przysięgę wierności wobec tronu."
 STATIC_MODIFIER_NAME_bul_reunite_mod: "Bułgaria zjednoczona"
 STATIC_MODIFIER_DESC_bul_reunite_mod: "Nad ziemiami, niegdyś rozdartymi, jeden sztandar powiewa znów."
 STATIC_MODIFIER_NAME_bul_macedonia_mod: "Macedonia podbita"
 STATIC_MODIFIER_DESC_bul_macedonia_mod: "Góry, które niegdyś były świadkami chwały Samuela, wróciły w domenę cara."
 STATIC_MODIFIER_NAME_bul_extend_empire_mod: "Cesarstwo rozszerzone"
 STATIC_MODIFIER_DESC_bul_extend_empire_mod: "Nasze rozszerzające się granice ukazują naszą siłę każdemu sąsiedniemu królestwu."
 STATIC_MODIFIER_NAME_bul_ottoman_wars_mod: "Wojny osmańskie"
 STATIC_MODIFIER_DESC_bul_ottoman_wars_mod: "Niezliczone starcia z zagrożeniem tureckim zahartowały naszych żołnierzy."
 STATIC_MODIFIER_NAME_bul_varna_mod: "Krucjata Warneńska"
 STATIC_MODIFIER_DESC_bul_varna_mod: "Pamięć tych, którzy polegli na wzgórzach Warny, jest opowiadana po dziś dzień."
 STATIC_MODIFIER_NAME_bul_end_ottoman_mod: "Zagrożenie osmańskie zakończone"
 STATIC_MODIFIER_DESC_bul_end_ottoman_mod: "Westchnienie ulgi przechodzi przez Bałkany, gdy długo obawiane zagrożenie odchodzi."
 STATIC_MODIFIER_NAME_bul_constantinople_ambition_mod: "Ambicja wobec Konstantynopola"
 STATIC_MODIFIER_DESC_bul_constantinople_ambition_mod: "Cień naszych okrętów wojennych pada teraz na szlak morski, łączący Morze Czarne ze Śródziemnym."
 STATIC_MODIFIER_NAME_bul_varna_port_mod: "Handel czarnomorski"
 STATIC_MODIFIER_DESC_bul_varna_port_mod: "Obce statki kupieckie przybywają i odpływają nieustannie z portu Warny."
 STATIC_MODIFIER_NAME_bul_black_sea_dominion_mod: "Panowanie nad Morzem Czarnym"
 STATIC_MODIFIER_DESC_bul_black_sea_dominion_mod: "Bułgarskie statki kupieckie pływają teraz po falach Morza Czarnego, jakby było ich własnym."
 STATIC_MODIFIER_NAME_bul_third_bulgarian_empire_mod: "Trzecie Cesarstwo Bułgarskie"
 STATIC_MODIFIER_DESC_bul_third_bulgarian_empire_mod: "Światło, które niegdyś jaśniało z Tyrnowa, oświetla teraz całe Bałkany."
 STATIC_MODIFIER_NAME_bul_bulgarian_independence_mod: "Niepodległość Bułgarii ogłoszona"
 STATIC_MODIFIER_DESC_bul_bulgarian_independence_mod: "Rozdrobnione ziemie są znów jednością, a każdy naród musi liczyć się z tym odrodzeniem."
 STATIC_MODIFIER_NAME_bul_new_byzantium_mod: "Nowe Bizancjum"
 STATIC_MODIFIER_DESC_bul_new_byzantium_mod: "Nowe głosy modlitwy rozbrzmiewają teraz przez kościoły Konstantynopola."
