l_polish:
 ubv_oberbayern_mission_pack: "Dziedzictwo Monachium — droga do zjednoczenia Bawarii"
 ubv_oberbayern_mission_pack_DESCRIPTION:0 "Jako dom Monachium, potomkowie cesarza Ludwika IV, zjednocz podzielone ziemie Bawarii z powrotem w jedną całość."
 ubv_oberbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Rozwiń Monachium i zjednocz Bawarię."
 ubv_oberbayern_mission_pack_BUTTON_TOOLTIP:0 "Rozwiń Monachium i zjednocz Bawarię."
 ubv_oberbayern_mission_pack_BUTTON_DETAILS:0 "Wznieś się jako książę całej Bawarii!"
 ubv_wittelsbach_legacy: "Dziedzictwo Wittelsbachów"
 ubv_wittelsbach_legacy_desc: "Księstwo Bawarii, podzielone traktatem pawijskim z 1329 roku — jako gałąź monachijska, potomkowie cesarza Ludwika IV, odziedzicz to dziedzictwo."
 ubv_secure_munich: "Rozwiń Monachium"
 ubv_secure_munich_desc: "Monachium nad Izarą — rozwiń to miasto, umiłowane przez cesarza Ludwika IV, ośrodkiem księstwa."
 ubv_salt_trade: "Handel solą"
 ubv_salt_trade_desc: "Sól, zwana „białym złotem” — zdobądź kopalnie soli Reichenhall i zapewnij bogactwo tego cennego surowca."
 ubv_imperial_relations: "Stosunki z Cesarstwem"
 ubv_imperial_relations_desc: "Tron cesarski, niegdyś zajmowany przez Ludwika IV — uczyń nasze stosunki ze Świętym Cesarstwem Rzymskim godnymi tej chwalebnej pamięci."
 ubv_bavarian_ambition: "Roszczenie do jednej Bawarii"
 ubv_bavarian_ambition_desc: "Rozwój Monachium, handel solą i stosunki z Cesarstwem — buduj na tym i pielęgnuj roszczenie do całej Bawarii."
 ubv_reunite_bavaria: "Zjednocz Bawarię"
 ubv_reunite_bavaria_desc: "Podzielone księstwo — odzyskaj ziemie Dolnej Bawarii i zjednocz Bawarię z powrotem w jedną całość."
 ubv_duke_of_all_bavaria: "Książę całej Bawarii"
 ubv_duke_of_all_bavaria_desc: "Pod rodem domu Monachium cała Bawaria jest wreszcie zjednoczona pod jednym sztandarem."
 ubv_events.1.t: "Proklamacja jedności Bawarii"
 ubv_events.1.d: "Pod rodem domu Monachium Bawaria jest wreszcie zjednoczona w jedną całość. Era podziałów dobiega końca."
 ubv_events.1.a: "Chwała Bawarii!"
 STATIC_MODIFIER_NAME_ubv_legacy_mod: "Dziedzictwo Wittelsbachów"
 STATIC_MODIFIER_DESC_ubv_legacy_mod: "Krew Ludwika IV, który niegdyś nosił koronę cesarską, pozostaje imieniem, które z dumą przechowuje w sercu każdy dworzanin."
 STATIC_MODIFIER_NAME_ubv_munich_mod: "Monachium rozwinięte"
 STATIC_MODIFIER_DESC_ubv_munich_mod: "Miasto nad Izarą rozkwita jako ośrodek księstwa."
 STATIC_MODIFIER_NAME_ubv_salt_mod: "Handel solą"
 STATIC_MODIFIER_DESC_ubv_salt_mod: "Wozy załadowane „białym złotem” z kopalni soli Reichenhall nieustannie toczą się ku rynkom Monachium."
 STATIC_MODIFIER_NAME_ubv_imperial_mod: "Stosunki z Cesarstwem"
 STATIC_MODIFIER_DESC_ubv_imperial_mod: "Więzi z dworem cesarskim, któremu niegdyś przewodniczył Ludwik IV, wciąż utrzymują posłów wędrujących tam i z powrotem."
 STATIC_MODIFIER_NAME_ubv_reunite_mod: "Bawaria zjednoczona"
 STATIC_MODIFIER_DESC_ubv_reunite_mod: "Wasale dwóch niegdyś podzielonych gałęzi składają teraz przysięgę pod jednym sztandarem."
 STATIC_MODIFIER_NAME_ubv_unify_bavaria_mod: "Książę całej Bawarii"
 STATIC_MODIFIER_DESC_ubv_unify_bavaria_mod: "Dzwony bawarskich wież biją, ogłaszając koniec podziałów."
 ubv_unified_duchy: "Zjednoczone Księstwo Bawarii"
 ubv_unified_duchy_desc: "Era podziałów się skończyła — jako zjednoczone księstwo Bawarii, otwórz nową erę."
 ubv_bavaria_unified_tt: "Zjednoczono Bawarię"
 ubv_landrecht: "Bawarskie prawo krajowe"
 ubv_landrecht_desc: "Jednolite prawo dla zjednoczonego księstwa — wprowadź bawarski kodeks praw (Landrecht) i wzmocnij fundament rządów."
 ubv_tyrol_ambition: "Ambicje wobec Tyrolu"
 ubv_tyrol_ambition_desc: "Hrabstwo Tyrolu, ukryte w objęciach Alp — pielęgnuj ambicje wobec tej ziemi."
 ubv_swabian_expansion: "Ekspansja w Szwabii"
 ubv_swabian_expansion_desc: "Szwabia, rozciągająca się na południowy zachód — wzmocnij nasze wpływy nad tym regionem."
 ubv_greater_bavaria: "Urzeczywistnij Wielką Bawarię"
 ubv_greater_bavaria_desc: "Kodeks praw, Tyrol i Szwabia — buduj na tym i urzeczywistnij Wielką Bawarię."
 ubv_counter_reformation_leader: "Przywódca Kontrreformacji"
 ubv_counter_reformation_leader_desc: "Uosabiaj ducha Soboru Trydenckiego i stań na czele Kontrreformacji."
 ubv_electoral_dignity: "Godność elektorska"
 ubv_electoral_dignity_desc: "W 1623 roku Maksymilian I wreszcie zdobywa rangę elektora — uczyń ten zaszczyt wieczną dumą Bawarii."
 ubv_austrian_rivalry: "Rywalizacja z Austrią"
 ubv_austrian_rivalry_desc: "Rywalizacja z domem Habsburgów o hegemonię w Cesarstwie — przyjmij to wyzwanie od naszego wielkiego rywala."
 ubv_war_of_austrian_succession: "Wojna o sukcesję austriacką"
 ubv_war_of_austrian_succession_desc: "Wojna o roszczenia Karola VII do tronu cesarskiego — wykorzystaj tę wojnę sukcesyjną, by podnieść prestiż Bawarii."
 ubv_imperial_crown: "Korona cesarska"
 ubv_imperial_crown_desc: "W 1742 roku Karol VII, książę Bawarii, koronowany zostaje Cesarzem Świętego Cesarstwa Rzymskiego — pierwszym nie-Habsburgiem noszącym koronę od wieków."
 ubv_enlightened_absolutism: "Oświecony absolutyzm"
 ubv_enlightened_absolutism_desc: "Era Oświecenia, czcząca rozum i naukę — wprowadź ten nowy nurt myśli do rządów Bawarii."
 ubv_napoleonic_alliance: "Wyzwanie dla Francji"
 ubv_napoleonic_alliance_desc: "Europa, wstrząśnięta rewolucją i ambicją Napoleona — Bawaria umacnia roszczenie do tronu tego potężnego sąsiada i toruje własną drogę."
 ubv_kingdom_of_bavaria: "Proklamacja Królestwa Bawarii"
 ubv_kingdom_of_bavaria_desc: "W 1806 roku elektor Maksymilian IV Józef ogłasza się królem Bawarii — długa historia domu Wittelsbachów osiąga tu nowy szczyt."
 ubv_events.3.t: "Korona cesarska"
 ubv_events.3.d: "W 1742 roku Karol VII, książę Bawarii, został koronowany Cesarzem Świętego Cesarstwa Rzymskiego we frankfurckiej katedrze. Minęły wieki, odkąd ktoś inny niż Habsburg nosił koronę cesarską."
 ubv_events.3.a: "Chwała Jego Cesarskiej Mości!"
 ubv_events.99.t: "Proklamacja Królestwa Bawarii"
 ubv_events.99.d: "W 1806 roku elektor Maksymilian IV Józef, pod osłoną Związku Reńskiego, ogłosił się królem Bawarii. Długa historia domu Wittelsbachów osiąga tu nowy szczyt."
 ubv_events.99.a: "Niech żyje Królestwo Bawarii!"
 STATIC_MODIFIER_NAME_ubv_unified_mod: "Zjednoczone Księstwo Bawarii"
 STATIC_MODIFIER_DESC_ubv_unified_mod: "Księstwo nie musi już dzielić swoich dworów, dochodów i wojowników między rywalizujące gałęzie."
 STATIC_MODIFIER_NAME_ubv_greater_mod: "Wielka Bawaria urzeczywistniona"
 STATIC_MODIFIER_DESC_ubv_greater_mod: "Od podnóża Alp po wzgórza Szwabii ziemie pod książęcym sztandarem rozszerzają się z każdą mijającą porą roku."
 STATIC_MODIFIER_NAME_ubv_counter_reformation_mod: "Przywódca Kontrreformacji"
 STATIC_MODIFIER_DESC_ubv_counter_reformation_mod: "W duchu Soboru Trydenckiego kolegia jezuickie otwierają się jedno po drugim w miastach księstwa."
 STATIC_MODIFIER_NAME_ubv_succession_war_mod: "Wojna o sukcesję austriacką"
 STATIC_MODIFIER_DESC_ubv_succession_war_mod: "Oficerowie i żołnierze, zahartowani na polach bitew Wojny o sukcesję austriacką, tworzą teraz rdzeń książęcej armii."
 STATIC_MODIFIER_NAME_ubv_imperial_crown_mod: "Korona cesarska"
 STATIC_MODIFIER_DESC_ubv_imperial_crown_mod: "Pamięć o dniu, gdy książę Bawarii został koronowany we frankfurckiej katedrze, z dumą jest przechowywana w sercu każdego dworzanina."
 STATIC_MODIFIER_NAME_ubv_enlightenment_mod: "Oświecony absolutyzm"
 STATIC_MODIFIER_DESC_ubv_enlightenment_mod: "Na dworze nowe księgi, przybywające z Francji, szerzą ideały Oświecenia, a liczba szkół rośnie z roku na rok."
 STATIC_MODIFIER_NAME_ubv_electoral_dignity_mod: "Godność elektorska"
 STATIC_MODIFIER_DESC_ubv_electoral_dignity_mod: "Gdy książę, odziany w szaty elektora, zajmuje swoje miejsce na wyborach cesarskich, książęta z uwagą wsłuchują się w jego słowa."
 STATIC_MODIFIER_NAME_ubv_kingdom_mod: "Królestwo Bawarii"
 STATIC_MODIFIER_DESC_ubv_kingdom_mod: "W pałacu w Monachium grzmi salut, świętując koronację pierwszego króla Bawarii z domu Wittelsbachów."
