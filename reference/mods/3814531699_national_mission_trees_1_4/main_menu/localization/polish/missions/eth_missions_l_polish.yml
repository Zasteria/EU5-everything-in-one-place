l_polish:
 eth_ethiopia_mission_pack: "Nowe Cesarstwo Salomońskie — krzyż, jaśniejący nad Rogiem Afryki"
 eth_ethiopia_mission_pack_DESCRIPTION:0 "Pod dynastią, która, jak mówią, wywodzi się od Królowej Saby i króla Salomona, rywalizuj z Mameluków jako obrońca Koptów, zatriumfuj w śmiertelnej walce z Adalem i odrodź chwałę Aksum, by wznieść nowe imperium."
 eth_ethiopia_mission_pack_CRITERIA_DESCRIPTION:0 "Wznieś imperium, zgłoś roszczenia do hegemonii nad Rogiem Afryki, broń Koptów i odrodź chwałę Aksum."
 eth_ethiopia_mission_pack_BUTTON_TOOLTIP:0 "Od górskiej twierdzy do imperium, jaśniejącego nad Morzem Czerwonym."
 eth_ethiopia_mission_pack_BUTTON_DETAILS:0 "„Król Królów, Lew Judy” — jako dziedzic Królowej Saby wznieś nowe Cesarstwo Salomońskie!"
 eth_negus_authority: "Ustanów władzę Negusa Negesti"
 eth_negus_authority_desc: "„Król Królów” — tytuł Negusa Negesti. Niech ta władza dotrze do każdego zakątka imperium."
 eth_amba_geshen: "Więzienie Amba Geszen"
 eth_amba_geshen_desc: "Aby zapobiec sporom o sukcesję, książęta królewscy są zamykani w naturalnej twierdzy Amba Geszen — ustanów ten zwyczaj instytucją."
 eth_mobile_court: "Wędrowny dwór Etiopii"
 eth_mobile_court_desc: "Bez stałej stolicy cesarz i jego wojsko przemierzają imperium w ruchomym obozie (Ketema) — ustanów ten swoisty styl rządzenia instytucją państwową."
 eth_coptic_church: "Broń etiopskiego kościoła prawosławnego"
 eth_coptic_church_desc: "Etiopski kościół prawosławny, pod władzą Aleksandrii — uczyń jego wiarę podporą państwa i zostań obrońcą Koptów."
 eth_gondar_founding: "Rozwiń Gonder"
 eth_gondar_founding_desc: "Gonder, zwany „afrykańskim Camelotem” — rozwiń go w wielkie miasto kamienne."
 eth_royal_chronicle: "Sporządź kroniki królewskie"
 eth_royal_chronicle_desc: "Odziedzicz ducha „Kebra Negest”, kroniki, zapisującej czyny dawnych cesarzy, i pielęgnuj tradycję nauki i zapisu."
 eth_feudal_levies: "Feudalny system pospolitego ruszenia"
 eth_feudal_levies_desc: "Ustanów swoisty feudalny system wojskowy Etiopii, w którym lokalni panowie prowadzą wojska na wezwanie cesarza."
 eth_negus_dynasty: "Dynastia Salomońska zabezpieczona"
 eth_negus_dynasty_desc: "Z kościołem, kronikami, systemem wojskowym i stolicą, wszystkimi na swoich miejscach, uczyń rządy dynastii Salomońskiej niezłomnymi."
 eth_oromo_migration: "Migracje Oromo"
 eth_oromo_migration_desc: "W XVI wieku ludy Oromo rozpoczynają wielką migrację — odpowiedz na ten historyczny ruch ludów."
 eth_agaw_people: "Rządź Agawami"
 eth_agaw_people_desc: "Agawowie, starożytni mieszkańcy wyżyny etiopskiej — rządź nimi jako poddanymi imperium, szanując ich kulturę."
 eth_beta_israel: "Współistnienie z Beta Israel"
 eth_beta_israel_desc: "Beta Israel, etiopscy Żydzi, zwani również „Falaszami” — ustanów ścieżkę współistnienia z nimi."
 eth_horn_hegemony: "Hegemonia nad Rogiem Afryki"
 eth_horn_hegemony_desc: "Jako imperium jednoczące Sidama, Oromo, Agawów i Beta Israel zgłoś roszczenia do hegemonii nad Rogiem Afryki."
 eth_nubian_alliance: "Sojusz z Nubią"
 eth_nubian_alliance_desc: "Makuria i Alodia, państwa koptyjskie na północy — wykuj sojusze z tymi braćmi w wierze."
 eth_conquer_makuria: "Włącz Makurię"
 eth_conquer_makuria_desc: "Makuria, królestwo koptyjskie, niegdyś kwitnące nad Nilem — chroń lub włącz to teraz gasnące państwo."
 eth_conquer_alodia: "Włącz Alodię"
 eth_conquer_alodia_desc: "Alodia, królestwo koptyjskie Południowej Nubii — przywiedź tę ziemię w sferę rządów Etiopii."
 eth_sudan_dominion: "Ustanów panowanie nad Sudanem"
 eth_sudan_dominion_desc: "Od doliny Nilu po pustynię nubijską — ustanów rządy etiopskie nad tą rozległą ziemią."
 eth_mamluk_rivalry: "Rywalizacja z Mamelukami"
 eth_mamluk_rivalry_desc: "Sułtanat Mameluków, rządzący Egiptem — jako obrońca Koptów rozwiąż rywalizację z nimi."
 eth_liberate_jerusalem: "Wyzwól Jerozolimę"
 eth_liberate_jerusalem_desc: "Święte Miasto Jerozolima — wyzwól tę ziemię, by chronić prawa Koptów do modlitwy."
 eth_coptic_patriarchate: "Dowodź Patriarchatem Koptyjskim"
 eth_coptic_patriarchate_desc: "Patriarchat Koptyjski Aleksandrii — przywiedź jego władzę pod kontrolę etiopską."
 eth_protector_of_copts: "Obrońca Koptów"
 eth_protector_of_copts_desc: "Dla Koptów, rozproszonych po świecie, cesarz etiopski jest ich ostatnim obrońcą — wypełnij tę rolę."
 eth_adal_wars: "Wojny adalskie"
 eth_adal_wars_desc: "Sułtanat Adalu, państwo islamskie na wybrzeżu czerwonomorskim — podejmij wyzwanie wojny z tym dawnym rywalem."
 eth_conquer_zeila: "Podbij Zejlę"
 eth_conquer_zeila_desc: "Zejla, ważne miasto portowe Adalu — podbij je i zdobądź przyczółek w handlu czerwonomorskim."
 eth_conquer_harar: "Podbij Harar"
 eth_conquer_harar_desc: "Harar, centrum nauki islamskiej — podbij to święte miasto."
 eth_conquer_adal: "Podbij Adal"
 eth_conquer_adal_desc: "Połóż kres zagrożeniu „Ahmada Lewaka” (Gragn) i podbij dawnego rywala, sułtanat Adalu."
 eth_somali_coast: "Zabezpiecz wybrzeże somalijskie"
 eth_somali_coast_desc: "Wybrzeże somalijskie — zmieć resztki Adalu i zabezpiecz tę ziemię."
 eth_red_sea_access: "Dostęp do Morza Czerwonego"
 eth_red_sea_access_desc: "Zabezpiecz port Massawa i otwórz lądowej Etiopii długo upragnioną drogę do morza."
 eth_portuguese_contact: "Kontakt z Portugalczykami"
 eth_portuguese_contact_desc: "Portugalczycy, szukający legendarnej ziemi „króla Jana” — kontakt z nimi przyniesie Etiopii nową erę."
 eth_massawa_port: "Rozwiń port Massawa"
 eth_massawa_port_desc: "Massawa, miasto portowe nad Morzem Czerwonym — rozwiń je bramą dla handlu zagranicznego."
 eth_firearms_adoption: "Przyjmij broń palną"
 eth_firearms_adoption_desc: "Z portugalskim wsparciem wprowadź muszkiety i armaty do armii etiopskiej."
 eth_european_trade: "Handel z Europą"
 eth_european_trade_desc: "Ożyw handel z narodami europejskimi przez Massawę."
 eth_modernize_army: "Zmodernizuj armię"
 eth_modernize_army_desc: "Opierając się na broni palnej i handlu europejskim, przekształć armię etiopską w nowoczesną siłę."
 eth_aksum_heritage: "Dziedzictwo Aksum"
 eth_aksum_heritage_desc: "Imperium Aksumickie, niegdyś kwitnące przez handel czerwonomorski — zabezpiecz jego święte miasto i odziedzicz pamięć o jego chwale."
 eth_reclaim_aksum: "Odrodź Tigraj"
 eth_reclaim_aksum_desc: "Tigraj, kolebka Imperium Aksumickiego — odrodź ten region ziemią rdzenną imperium."
 eth_red_sea_empire: "Odbuduj na nowo Imperium Czerwonomorskie"
 eth_red_sea_empire_desc: "Czerwonomorskie imperium handlowe, niegdyś wzniesione przez Aksum — odrodź je w naszych czasach."
 eth_horn_unification: "Zjednocz Róg Afryki"
 eth_horn_unification_desc: "Poprzez włączenie ludów kuszyckich i odrodzenie Imperium Czerwonomorskiego — zjednocz cały Róg Afryki pod sztandarem Etiopii."
 eth_new_solomonic_empire: "Nowe Cesarstwo Salomońskie"
 eth_new_solomonic_empire_desc: "Obrońca Koptów, zmodernizowana armia i zjednoczony Róg Afryki — rodowód Królowej Saby i króla Salomona tu dopełniony nowym imperium."
 eth_events.1.t: "Jerozolima wyzwolona"
 eth_events.1.d: "Święte Miasto Jerozolima wróciło w ręce koptyjskie. Dla braci, rozproszonych po świecie, ten dzień będzie pamiętany na wieki."
 eth_events.1.a: "Chwała Bogu!"
 eth_events.99.t: "Proklamacja Nowego Cesarstwa Salomońskiego"
 eth_events.99.d: "Małe górskie królestwo odrodziło się wielkim imperium — obrońcą Koptów, panem Morza Czerwonego, władcą Rogu Afryki. Rodowód Królowej Saby i króla Salomona tu dopełniony."
 eth_events.99.a: "Chwała Etiopii! Chwała Nowemu Cesarstwu Salomońskiemu!"
 STATIC_MODIFIER_NAME_eth_negus_mod: "Władza Negusa ustanowiona"
 STATIC_MODIFIER_DESC_eth_negus_mod: "Władza cesarza dociera do imperium, podnosząc legitymizację rządów."
 STATIC_MODIFIER_NAME_eth_amba_geshen_mod: "Więzienie Amba Geszen"
 STATIC_MODIFIER_DESC_eth_amba_geshen_mod: "Na urwiskach Amba Geszen młodzi książęta krwi cicho się starzeją, nigdy nie śmiejąc dążyć do tronu."
 STATIC_MODIFIER_NAME_eth_coptic_church_mod: "Kościół prawosławny obroniony"
 STATIC_MODIFIER_DESC_eth_coptic_church_mod: "Dzwony kościoła Tewahedo biją z doliny w dolinę po całej wyżynie, a nawet ludy innych wiar zatrzymują się, by posłuchać."
 STATIC_MODIFIER_NAME_eth_gondar_mod: "Gonder rozwinięty"
 STATIC_MODIFIER_DESC_eth_gondar_mod: "Miasto kamienne stało się symbolem dobrobytu królestwa."
 STATIC_MODIFIER_NAME_eth_chronicle_mod: "Kroniki królewskie sporządzone"
 STATIC_MODIFIER_DESC_eth_chronicle_mod: "W ciemnych skryptoriach klasztorów pióra pisarzy, kopiujących kroniki w języku gyyz, nigdy nie odpoczywają."
 STATIC_MODIFIER_NAME_eth_levies_mod: "Feudalny system pospolitego ruszenia"
 STATIC_MODIFIER_DESC_eth_levies_mod: "Na dźwięk bębnów władcy wyżyny zbierają się, każdy prowadząc swych ludzi pod własnym sztandarem."
 STATIC_MODIFIER_NAME_eth_dynasty_mod: "Dynastia zabezpieczona"
 STATIC_MODIFIER_DESC_eth_dynasty_mod: "Duma z pochodzenia od króla Salomona i Królowej Saby czyni imię dynastii czczonym wśród wszystkich ludów."
 STATIC_MODIFIER_NAME_eth_horn_hegemony_mod: "Hegemonia nad Rogiem"
 STATIC_MODIFIER_DESC_eth_horn_hegemony_mod: "Od wyżyny abisyńskiej po niziny Rogu ludy niezliczonych języków płacą daninę w imieniu jednego króla."
 STATIC_MODIFIER_NAME_eth_nubian_mod: "Sojusz z Nubią"
 STATIC_MODIFIER_DESC_eth_nubian_mod: "Posłowie od naszych braci w północnej Nubii są ciepło przyjmowani jako dzielący tę samą wiarę krzyża."
 STATIC_MODIFIER_NAME_eth_makuria_mod: "Makuria włączona"
 STATIC_MODIFIER_DESC_eth_makuria_mod: "Włączenie zaanektowanej Makurii postępuje."
 STATIC_MODIFIER_NAME_eth_alodia_mod: "Alodia włączona"
 STATIC_MODIFIER_DESC_eth_alodia_mod: "Włączenie zaanektowanej Alodii postępuje."
 STATIC_MODIFIER_NAME_eth_sudan_mod: "Panowanie nad Sudanem"
 STATIC_MODIFIER_DESC_eth_sudan_mod: "Karawany, załadowane zbożem i złotem, nieustannie wznoszą się z równin Sudanu wzdłuż Nilu."
 STATIC_MODIFIER_NAME_eth_mamluk_rivalry_mod: "Rywalizacja z Mamelukami"
 STATIC_MODIFIER_DESC_eth_mamluk_rivalry_mod: "Skrzyżowawszy klingi z kawalerią mamelucką, żołnierze wyżyny zahartowali się w doświadczonych wojowników."
 STATIC_MODIFIER_NAME_eth_patriarchate_mod: "Patriarchat Koptyjski"
 STATIC_MODIFIER_DESC_eth_patriarchate_mod: "Duchowni wyżyny od dawna czekali dnia, gdy własny patriarcha udzieli błogosławieństwa."
 STATIC_MODIFIER_NAME_eth_protector_mod: "Obrońca Koptów"
 STATIC_MODIFIER_DESC_eth_protector_mod: "Sława obrońcy pomaga poprawić stosunki dyplomatyczne."
 STATIC_MODIFIER_NAME_eth_adal_wars_mod: "Wojny adalskie"
 STATIC_MODIFIER_DESC_eth_adal_wars_mod: "Żołnierze, którzy przetrwali niekończące się wojny z Adalem, noszą swe blizny jak znaki honoru."
 STATIC_MODIFIER_NAME_eth_zeila_mod: "Zejla podbita"
 STATIC_MODIFIER_DESC_eth_zeila_mod: "Z magazynów portu Zejla przyprawy i perły Morza Czerwonego niesione są w górę ku dworowi wyżyny."
 STATIC_MODIFIER_NAME_eth_harar_mod: "Harar podbity"
 STATIC_MODIFIER_DESC_eth_harar_mod: "Gdy sztandar króla został podniesiony nad murami Hararu, żołnierze wyżyny jednogłośnie mówili o zwycięstwie, które zdobyło święte miasto."
 STATIC_MODIFIER_NAME_eth_conquer_adal_mod: "Adal podbity"
 STATIC_MODIFIER_DESC_eth_conquer_adal_mod: "Nawet we wsiach Adalu, naszego dawnego rywala, urzędnicy króla zaczęli otwierać swe księgi podatkowe."
 STATIC_MODIFIER_NAME_eth_somali_coast_mod: "Wybrzeże somalijskie zabezpieczone"
 STATIC_MODIFIER_DESC_eth_somali_coast_mod: "W portach wybrzeża somalijskiego statki, załadowane kadzidłem i kością słoniową, kotwiczą nieustannie."
 STATIC_MODIFIER_NAME_eth_red_sea_access_mod: "Dostęp do Morza Czerwonego"
 STATIC_MODIFIER_DESC_eth_red_sea_access_mod: "Z dawno zamkniętą drogą do Morza Czerwonego teraz otwartą spojrzenia kupców wyżyny zwracają się ku horyzontowi."
 STATIC_MODIFIER_NAME_eth_portuguese_mod: "Kontakt z Portugalczykami"
 STATIC_MODIFIER_DESC_eth_portuguese_mod: "Portugalscy posłowie z Goa są przyjmowani z honorami na dworze wyżyny, niosąc rzadkie dary."
 STATIC_MODIFIER_NAME_eth_massawa_mod: "Massawa rozwinięta"
 STATIC_MODIFIER_DESC_eth_massawa_mod: "Port Massawa prosperuje bramą handlu."
 STATIC_MODIFIER_NAME_eth_firearms_mod: "Broń palna przyjęta"
 STATIC_MODIFIER_DESC_eth_firearms_mod: "Grzmot muszkietów i armat w dolinach ogłasza, że era włóczni i tarczy się skończyła."
 STATIC_MODIFIER_NAME_eth_european_trade_mod: "Handel z Europą"
 STATIC_MODIFIER_DESC_eth_european_trade_mod: "Kupcy europejscy, lądujący w porcie Massawa, kupują złoto i piżmo wyżyny w zamian za srebrne monety."
 STATIC_MODIFIER_NAME_eth_modernize_mod: "Armia zmodernizowana"
 STATIC_MODIFIER_DESC_eth_modernize_mod: "Żołnierze w mundurach nowego wzoru maszerują, śpiewając stare pieśni wojenne."
 STATIC_MODIFIER_NAME_eth_aksum_heritage_mod: "Dziedzictwo Aksum"
 STATIC_MODIFIER_DESC_eth_aksum_heritage_mod: "Ci, którzy stoją przed stelami Aksum, pamiętają, że imiona tysiącletnich królów wciąż płyną w ich własnej krwi."
 STATIC_MODIFIER_NAME_eth_reclaim_aksum_mod: "Tigraj odrodzony"
 STATIC_MODIFIER_DESC_eth_reclaim_aksum_mod: "Starożytne pola i rynki Aksum znów odzyskały oddech, a urzędnicy króla znów liczą plon."
 STATIC_MODIFIER_NAME_eth_red_sea_empire_mod: "Imperium Czerwonomorskie odbudowane"
 STATIC_MODIFIER_DESC_eth_red_sea_empire_mod: "Z odbudowanym imperium handlowym, łączącym porty Morza Czerwonego, floty króla rozwijają żagle wzdłuż całego wybrzeża."
 STATIC_MODIFIER_NAME_eth_horn_unification_mod: "Róg Afryki zjednoczony"
 STATIC_MODIFIER_DESC_eth_horn_unification_mod: "Każdy władca Rogu Afryki teraz klęka według ceremoniału jednego dworu."
 STATIC_MODIFIER_NAME_eth_new_solomonic_empire_mod: "Nowe Cesarstwo Salomońskie"
 STATIC_MODIFIER_DESC_eth_new_solomonic_empire_mod: "Ukończenie nowego imperium podniosło potęgę państwa na jej szczyt."
 STATIC_MODIFIER_NAME_eth_jerusalem_mod: "Jerozolima wyzwolona"
 STATIC_MODIFIER_DESC_eth_jerusalem_mod: "Przed Grobem Pańskim w Jerozolimie duchowni etiopscy płaczą z powodu zakończenia swej długiej pielgrzymki."
