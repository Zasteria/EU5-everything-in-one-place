 nap_southern_renaissance: "Renesans południowy"
 nap_caserta_palace: "Pałac w Casercie"
 nap_charles_dream: "Marzenie Karola I"
 nap_never_die_without_seeing_naples: "Zobaczyć Neapol i umrzeć"
 nap_latin_empire: "Cesarstwo Łacińskie"
 nap_new_capital_of_sicily_desc: "Utraciwszy Sycylię, wybraliśmy Neapol naszą nową stolicą zamiast Palermo. To miasto musi być rozwinięte w siedzibę, godną królestwa."
 nap_apulian_granary_desc: "Żyzne równiny Apulii od dawna słyną jako źródło zboża. Ich plony karmią nasz lud i tworzą ważny towar eksportowy królestwa. Apulia leży również naprzeciw Grecji przez Cieśninę Otranto, czyniąc ją żywotnym przyczółkiem."
 nap_control_of_transumanza_desc: "Transhumancja, odziedziczone pasterstwo wędrowne, praktykowane w Abruzji i Molise, tworzy ekonomiczny kręgosłup tych regionów. Gdy państwo zarządza tratturami i chroni pasterzy, produkcja wełny, sera i innych towarów będzie prosperować."
 nap_patronage_of_diverse_arts_desc: "Sycylia była przemierzana przez Greków, Kartagińczyków, Rzymian, Germanów, Arabów, Normanów i Francuzów, a ich kultury zmieszały się tutaj. Sztuka zakorzeniona w tej różnorodności kulturowej jest prawdziwą sztuką Sycylii."
 nap_dynastic_stability_desc: "Nigdy trwała dynastia nie zapuściła korzeni na Sycylii, co wielokrotnie wzywało obcą inwazję. Ustabilizowanie dynastii jest najpewniejszą drogą do stabilności samej Sycylii."
 nap_southern_renaissance_desc: "Artyści i uczeni z całego kraju, przyciągnięci przez stabilny i godny dwór, przynieśli również Neapolowi renesans — kulturę zarządzaną dworsko, odmienną od Północnych Włoch, rozkwita teraz tutaj."
 STATIC_MODIFIER_NAME_nap_new_capital_mod: "Nowa stolica"
 STATIC_MODIFIER_DESC_nap_new_capital_mod: "Neapol rozwinięty w siedzibę, godną królestwa, wspierając wzrost i produktywność miasta."
 STATIC_MODIFIER_NAME_nap_apulian_granary_mod: "Spichlerz Apulii"
 STATIC_MODIFIER_DESC_nap_apulian_granary_mod: "Żyzne ziemie Apulii stale wspierają produkcję surowców tutaj."
 STATIC_MODIFIER_NAME_nap_control_of_transumanza_mod: "Kontrola nad transhumancją"
 STATIC_MODIFIER_DESC_nap_control_of_transumanza_mod: "Ochrona pasterzy i zarządzanie tratturami stale podniosły produkcję surowców tutaj."
 STATIC_MODIFIER_NAME_nap_patronage_of_diverse_arts_mod: "Mecenat różnorodnych sztuk"
 STATIC_MODIFIER_DESC_nap_patronage_of_diverse_arts_mod: "Artyści zakorzenieni w wielu kulturach zgromadzili się na dworze, podnosząc prestiż królestwa i tolerancję dla innych wiar."
 STATIC_MODIFIER_NAME_nap_dynastic_stability_mod: "Stabilność dynastyczna"
 STATIC_MODIFIER_DESC_nap_dynastic_stability_mod: "Pod trwałą dynastią legitymizacja korony rośnie, a niepokoje wewnętrzne słabną."
 STATIC_MODIFIER_NAME_nap_southern_renaissance_mod: "Renesans południowy"
 STATIC_MODIFIER_DESC_nap_southern_renaissance_mod: "Artyści, zgromadzeni w Neapolu, doskonalili swą sztukę, a umiejętności nowych artystów, wstępujących w służbę królestwa, wzrosły."
 nap_divided_kingdom_desc: "W 1282 roku lud Sycylii powstał przeciw rządom naszego domu Andegawenów i powitał dom Aragonii nowym królem. Od tego czasu Królestwo Sycylii jest podzielone na dwoje. Rządzimy kontynentem wokół Neapolu, lecz odzyskanie wyspy Sycylii pozostaje misją historyczną, powierzoną naszej dynastii."
 nap_papal_blessing_desc: "Odkąd Karol I podbił Królestwo Sycylii na zaproszenie papieża, nasza dynastia utrzymuje ścisłe więzy z papiestwem. Zachowanie zaufania papieża jest niezbędne dla utrzymania legitymizacji naszych rządów."
 nap_army_buildup_desc: "Umocnij stałą armię królestwa w przygotowaniu do walki o odzyskanie Sycylii. Silne wojsko będzie też potrzebne do jakiejkolwiek interwencji w Północnych Włoszech lub do tłumienia powstań na kontynencie."
 nap_match_aragon_navy_desc: "Aby przeciwstawić się flocie aragońskiej, panującej nad Cieśniną Sycylijską, nasze królestwo musi również posiadać potężną siłę morską. Kto rządzi morzem, ten z czasem będzie rządził Sycylią."
 nap_sword_of_the_guelphs_desc: "Walka między gwelfami (partią papieską) a gibelinami (partią cesarską) wstrząsa całymi Północnymi Włochami. Jako sojusznik papieża nasze królestwo może dołączyć do tej walki mieczem gwelfów i wykorzystać okazję, by rozszerzyć nasz wpływ na północ."
 nap_sicilian_reunification_war_desc: "Nadszedł wreszcie czas, by wysłać nasze wojska na wyspę Sycylię. Jeśli zdołamy złamać garnizon aragoński i zająć Palermo, droga do zjednoczenia rozdzielonego królestwa się otworzy."
 nap_invest_in_provence_desc: "Hrabstwo Prowansji, ojczyzna domu Andegawenów, wciąż utrzymuje głębokie więzy z naszą dynastią. Inwestycje tutaj stworzą przyczółek na zachodzie, jednocześnie umacniając nasze więzy z ojczyzną przodków."
 STATIC_MODIFIER_NAME_nap_papal_blessing_mod: "Wsparcie papieskie"
 STATIC_MODIFIER_DESC_nap_papal_blessing_mod: "Przez nasze ścisłe więzy z papiestwem nasz wpływ religijny nieustannie rośnie."
 STATIC_MODIFIER_NAME_nap_army_buildup_mod: "Zreorganizowane wojsko królewskie"
 STATIC_MODIFIER_DESC_nap_army_buildup_mod: "Zreorganizowane wojsko królewskie szczyci się wysokim morale i obfitymi rezerwami siły żywej."
 STATIC_MODIFIER_NAME_nap_match_aragon_navy_mod: "Flota antyaragońska"
 STATIC_MODIFIER_DESC_nap_match_aragon_navy_mod: "Flota królewska, zbudowana, by przeciwstawić się Aragonii, szczyci się wysokim morale i szybkim poruszaniem."
 STATIC_MODIFIER_NAME_nap_sword_of_the_guelphs_mod: "Miecz gwelfów"
 STATIC_MODIFIER_DESC_nap_sword_of_the_guelphs_mod: "Wmieszawszy się w spór Północnych Włoch mieczem papiestwa, nasze wojsko zyskało biegłość w oblężeniach i dyscyplinie."
 STATIC_MODIFIER_NAME_nap_sicilian_reunification_war_mod: "Wojna o zjednoczenie Sycylii"
 STATIC_MODIFIER_DESC_nap_sicilian_reunification_war_mod: "Przeszedłszy przez zaciekłą wojnę o Sycylię, wojsko królewskie może wystawić więcej wojsk, a ciężar wojny ciąży na królestwie lżej."
 STATIC_MODIFIER_NAME_nap_invest_in_provence_mod: "Inwestycja w Prowansję"
 STATIC_MODIFIER_DESC_nap_invest_in_provence_mod: "Dla domu Andegawenów Prowansja była „domem”. Utraciwszy Neapol, król René spędził resztę życia w Prowansji, a Aix-en-Provence wyrosło centrum kulturalnym. Więzy między Neapolem a Prowansją są głębokie, wykute krwią i historią domu Andegawenów."
 nap_events.1.t: "Królestwo, rozdzielone na dwoje"
 nap_events.1.d: "W 1282 roku, w powstaniu znanym jako Nieszpory Sycylijskie, lud Sycylii obalił rządy domu Andegawenów. Niezdolny dłużej znosić tyranii urzędników przysłanych z Francji, lud wyspy powstał jak jeden mąż przy biciu dzwonów wieczornych i wypędził Francuzów z naszych brzegów. Powitaliśmy króla Piotra III Aragońskiego nowym władcą, a Królestwo Sycylii zostało tym samym podzielone na dwoje. Za cieśniną, na kontynencie ze środkiem w Neapolu, król domu Andegawenów wciąż nazywa siebie „królem Sycylii”. Tylko my jesteśmy prawowitymi królami tej wyspy. Rywalizacja między naszymi dwoma królestwami trwa po dziś dzień."
 nap_events.1.a: "Zrozumiano"
 nap_cross_the_strait_of_otranto_desc: "Cieśnina Otranto, zaledwie 70 kilometrów szeroka, jest bramą morską między półwyspem włoskim a bałkańskim. Jeśli ją przekroczymy i ustanowimy przyczółek w Albanii, nasze floty i statki handlowe zyskają drogę dalej na wschód."
 nap_influence_over_the_papacy_desc: "Jeśli pogłębimy nasze więzy z papiestwem dalej, zachowując stabilność wewnętrzną, nasza dynastia zdobędzie wpływ na Stolicę Apostolską, którego nie sposób nie zauważyć."
 nap_the_bells_fall_silent_desc: "Wyspa Sycylia znów nasza, a rozdzielone królestwo zjednoczone. Musimy umocnić nasze rządy ostrożnie, by „dzwony”, które niegdyś rozerwały królestwo, nigdy nie zadzwoniły ponownie."
 nap_defeat_of_aragon_desc: "Pozbawiony swej sycylijskiej posiadłości dom Aragonii nie jest już tym zagrożeniem dla naszego królestwa, jakim był niegdyś. Jeśli sama Aragonia upadnie lub jej korona zostanie przywiedziona pod nasze zwierzchnictwo, dawna rywalizacja przez Morze Śródziemne może wreszcie zostać zakończona."
 nap_expand_influence_in_southern_france_desc: "Z naszego przyczółka w Prowansji nasz wpływ rozciąga się teraz w górę Rodanu aż po Lyon. Nasza obecność w całej Południowej Francji nadal rośnie."
 nap_western_mediterranean_hegemony_desc: "Jeśli zdołamy zająć Sardynię i Balearów, dwa wielkie bastiony zachodniego Morza Śródziemnego, nasze floty będą panować nad wodami od Genui po Iberię, czyniąc nas niekwestionowanymi panami zachodniego morza."
 STATIC_MODIFIER_NAME_nap_cross_the_strait_of_otranto_mod: "Przyczółek za Otranto"
 STATIC_MODIFIER_DESC_nap_cross_the_strait_of_otranto_mod: "Nasz przyczółek w Albanii pozwala naszym flotom i statkom handlowym żeglować dalej."
 STATIC_MODIFIER_NAME_nap_influence_over_the_papacy_mod: "Wpływ na papiestwo"
 STATIC_MODIFIER_DESC_nap_influence_over_the_papacy_mod: "Nasze więzy z papiestwem pogłębiły się, umacniając legitymizację naszych rządów i naszą tolerancję dla heretyków."
 STATIC_MODIFIER_NAME_nap_the_bells_fall_silent_mod: "Ciche dzwony"
 STATIC_MODIFIER_DESC_nap_the_bells_fall_silent_mod: "Rządy zjednoczonego królestwa ustabilizowały się; niezadowolenie ludu złagodzone, a legitymizacja korony wzrosła."
 STATIC_MODIFIER_NAME_nap_defeat_of_aragon_mod: "Klęska Aragonii"
 STATIC_MODIFIER_DESC_nap_defeat_of_aragon_mod: "Konflikt między Aragonią a domem Andegawenów rozpoczął się od Nieszporów Sycylijskich 1282 roku i trwał ponad 160 lat, aż do podboju Neapolu przez Alfonsa V w 1442 roku. Wreszcie pokonać tego starego wroga oznaczałoby dopełnienie największej zemsty w historii Królestwa Neapolu."
 STATIC_MODIFIER_NAME_nap_expand_influence_in_southern_france_mod: "Wpływ w Południowej Francji"
 STATIC_MODIFIER_DESC_nap_expand_influence_in_southern_france_mod: "Obecność handlowa i dyplomatyczna królestwa po całej Południowej Francji nadal rośnie."
 STATIC_MODIFIER_NAME_nap_western_mediterranean_hegemony_mod: "Hegemonia zachodniego Morza Śródziemnego"
 STATIC_MODIFIER_DESC_nap_western_mediterranean_hegemony_mod: "Podbiwszy Sardynię i Balearów, nasza flota panuje nad całym zachodnim Morzem Śródziemnym, a jej morale jest wysokie."
 nap_anjou_hungary_desc: "Nasz dom Andegawenów ma młodsze gałęzie nie tylko w Neapolu, lecz także na Węgrzech. Jeśli więzy między naszymi dwoma królestwami wspólnej krwi się pogłębią, możemy znaleźć również słuszną podstawę do zgłoszenia roszczenia do korony węgierskiej."
 nap_foothold_in_northern_italy_desc: "Jeśli zdołamy zabezpieczyć przyczółek w Toskanii, możemy pogłębić nasze więzy z bogatymi miastami-państwami Północnych Włoch, takimi jak Florencja i Piza, i zdobyć przewagę w jakiejkolwiek kampanii po całym półwyspie."
 nap_crossroads_of_civilizations_desc: "Królestwo Sycylii od dawna stało na skrzyżowaniu cywilizacji greckiej, rzymskiej, arabskiej i normańskiej. Ogromna kolekcja sztuki, zgromadzona na naszym dworze, stoi dowodem, że nasze królestwo jest prawdziwie skrzyżowaniem cywilizacji."
 nap_anjou_homeland_desc: "Teraz, gdy Angers zabezpieczone, nasz wpływ sięga aż po ojczyznę naszego domu Andegawenów. Ta więź z ziemiami naszych przodków może przynieść nam jeszcze roszczenie do samego tronu francuskiego."
 nap_french_throne_claim_desc: "Dom Andegawenów narodził się młodszą gałęzią francuskiej linii królewskiej. Jeśli zdołamy zabezpieczyć sam Paryż lub utworzyć unię personalną z koroną francuską, nasz król będzie nosił zarówno koronę Francji, jak i Neapolu."
 STATIC_MODIFIER_NAME_nap_foothold_in_northern_italy_mod: "Przyczółek w Północnych Włoszech"
 STATIC_MODIFIER_DESC_nap_foothold_in_northern_italy_mod: "Nasze więzy z miastami Toskanii pozwalają nam skuteczniej zamieniać zdobycze wojskowe na punkty wojenne po całym półwyspie."
 STATIC_MODIFIER_NAME_nap_crossroads_of_civilizations_mod: "Skrzyżowanie cywilizacji"
 STATIC_MODIFIER_DESC_nap_crossroads_of_civilizations_mod: "Ogromna kolekcja sztuki, zgromadzona na naszym dworze, nadal rozprzestrzenia wpływ kulturowy królestwa na sąsiednie ziemie."
 STATIC_MODIFIER_NAME_nap_anjou_homeland_mod: "Ziemie ojczyste Andegawenów"
 STATIC_MODIFIER_DESC_nap_anjou_homeland_mod: "Imię domu Andegawenów pochodzi od Angers we Francji, miasta nad Loarą. Henryk II, który założył Plantagenetowską Anglię, był również hrabią Andegawenii. Odbudowa więzi z ojczyzną Angers wskrzesiłaby sieć andegaweńską po całej Europie."
 STATIC_MODIFIER_NAME_nap_king_of_france_mod: "Król Francji"
 STATIC_MODIFIER_DESC_nap_king_of_france_mod: "Dom Andegawenów, potomkowie Kapetyngów, przyjmuje koronę swego kapetyńskiego suzerena — zwrot historii wstecz. Tytuł „Najchrześcijańskiego Króla” Francji jest jednym z najbardziej zaszczytnych w Europie, a jego zdobycie wznosi dynastię Południowych Włoch na polityczny szczyt całego chrześcijaństwa."
 nap_mediterranean_greatest_city_desc: "Populacja Neapolu osiągnęła teraz skalę, rzadką nawet na Morzu Śródziemnym. Od czasów starożytnego Rzymu żadne miasto na tym morzu nie znało takiego dobrobytu."
 nap_university_of_frederick_ii_desc: "Uniwersytet Neapolu, założony przez Fryderyka II, jest centrum nauki królestwa. Zapewniwszy mu sale sztuki i nauki, jego sława rozprzestrzeni się po całej Europie."
 nap_magnificent_royal_palace_desc: "Założenie ogrodów przy pałacu królewskim jest niezbędne, by pokazać wspaniałość korony zarówno poddanym, jak i obcokrajowcom. Wspaniałe ogrody obwieszczą wszystkim odwiedzającym dobrobyt królestwa."
 nap_expansion_of_naples_port_desc: "Poprzez budowę doku w porcie Neapolu statki mogą być naprawiane i budowane efektywniej, znacznie pomagając w utrzymaniu i wzroście floty królewskiej."
 nap_subjugation_of_epirus_desc: "Przekroczywszy Cieśninę Otranto i wzniósłszy przyczółek, nasze siły wreszcie podporządkowały cały Epir. Wybrzeże Albanii jest teraz pod władzą królestwa."
 nap_caserta_palace_desc: "Wzniesienie nowego pałacu w Casercie pokaże wspaniałość korony i jednocześnie da rodzinie królewskiej spokojną siedzibę rządów, z dala od dworu neapolitańskiego."
 nap_charles_dream_desc: "Karol I niegdyś marzył o wzniesieniu wielkiego imperium we wschodnim Morzu Śródziemnym, rozszerzeniu ducha krzyżowego. Teraz, z przyczółkiem na Morei, to marzenie zaczyna znów nabierać kształtu."
 nap_never_die_without_seeing_naples_desc: "Jak głosi stare przysłowie, „zobaczyć Neapol i umrzeć” — Neapol stał się miastem, którego pragną podróżnicy z całego świata. Jego piękno i dobrobyt będą omawiane przez pokolenia."
 nap_latin_empire_desc: "Królestwo Sycylii nie jest już zwykłą potęgą regionalną. Na zachodzie panuje nad Morzem Śródziemnym; na wschodzie droga od Morei do Konstantynopola leży otwarta przed nim. Teraz nadszedł czas, by ogłosić się światu dziedzicem starożytnego Cesarstwa Łacińskiego."
 STATIC_MODIFIER_NAME_nap_mediterranean_greatest_city_mod: "Największe miasto Morza Śródziemnego"
 STATIC_MODIFIER_DESC_nap_mediterranean_greatest_city_mod: "Neapol stał się jednym z wielkich miast Morza Śródziemnego, a jego produktywność i wzrost daleko przewyższają sąsiadów."
 STATIC_MODIFIER_NAME_nap_university_of_frederick_ii_mod: "Uniwersytet Fryderyka II"
 STATIC_MODIFIER_DESC_nap_university_of_frederick_ii_mod: "Uczeni, zgromadzeni na uniwersytecie Neapolu, przynoszą królestwu nową wiedzę i nowatorstwo."
 STATIC_MODIFIER_NAME_nap_magnificent_royal_palace_mod: "Wspaniały pałac królewski"
 STATIC_MODIFIER_DESC_nap_magnificent_royal_palace_mod: "Wspaniałe ogrody pałacu królewskiego pokazują wszystkim prestiż królestwa i legitymizację korony."
 STATIC_MODIFIER_NAME_nap_expansion_of_naples_port_mod: "Rozbudowa portu Neapolu"
 STATIC_MODIFIER_DESC_nap_expansion_of_naples_port_mod: "Zatoka Neapolitańska, z Wezuwiuszem w tle, działa naturalnym portem od czasów starożytnych. Obiekty portowe, wzniesione w epoce andegaweńskiej i aragońskiej, stały się wielkim węzłem handlu śródziemnomorskiego, przez który przechodziły wschodnie przyprawy, północnoafrykańskie zboże i iberyjska wełna."
 STATIC_MODIFIER_NAME_nap_subjugation_of_epirus_mod: "Podporządkowanie Epiru"
 STATIC_MODIFIER_DESC_nap_subjugation_of_epirus_mod: "Przeszedłszy przez kampanię w Epirze, wojsko królewskie może wystawić więcej wojsk, a ciężar wojny ciąży na królestwie lżej."
 STATIC_MODIFIER_NAME_nap_caserta_palace_mod: "Pałac w Casercie"
 STATIC_MODIFIER_DESC_nap_caserta_palace_mod: "Pałac w Casercie, zaprojektowany przez Vanvitellego (rozpoczęty w 1752 roku), szczycił się skalą, rywalizującą z Wersalem, i symbolizował prestiż burbońskiego Królestwa Neapolu. Ponad 1200 pokoi, trzykilometrowe ogrody, fontanny zasilane akweduktem — położenie podstawy przed stworzeniem tego wspaniałego pałacu jest celem tej misji."
 STATIC_MODIFIER_NAME_nap_charles_dream_mod: "Marzenie Karola I"
 STATIC_MODIFIER_DESC_nap_charles_dream_mod: "Stara ambicja na wschód znów płonie, podnosząc prestiż królestwa i morale jego wojsk."
 STATIC_MODIFIER_NAME_nap_never_die_without_seeing_naples_mod: "Zobaczyć Neapol i umrzeć"
 STATIC_MODIFIER_DESC_nap_never_die_without_seeing_naples_mod: "„Zobaczyć Neapol i umrzeć” (Vedi Napoli e poi muori) — tak przekazywali europejscy podróżnicy XVIII wieku słowami, bo Neapol oszałamiał każdego odwiedzającego Wezuwiuszem, wspaniałym widokiem na zatokę, starożytnymi ruinami i swymi ożywionymi ulicami."
 STATIC_MODIFIER_NAME_nap_latin_empire_mod: "Cesarstwo Łacińskie"
 STATIC_MODIFIER_DESC_nap_latin_empire_mod: "Wspaniałość odbudowanego Cesarstwa Łacińskiego rozciąga się nad Morzem Śródziemnym, podnosząc prestiż i legitymizację królestwa i wzmacniając jego rękę w negocjacjach wojennych."
