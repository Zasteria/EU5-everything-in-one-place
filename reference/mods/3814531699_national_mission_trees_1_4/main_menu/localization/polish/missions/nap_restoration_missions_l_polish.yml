l_polish:
 nap_restoration_mission_pack: "Droga Królestwa Neapolu"
 nap_restoration_mission_pack_DESCRIPTION:0 "Utraciwszy Sycylię, królestwo szuka zjednoczenia i odbudowy swej potęgi na Morzu Śródziemnym. Pod krwią i blaskiem domu Andegawenów wznieś nowy złoty wiek wokół Neapolu."
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Ukończ misje jako Królestwo Neapolu, pracując nad zjednoczeniem Sycylii i odbudową Cesarstwa Łacińskiego."
 nap_restoration_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by przejść drogą Królestwa Neapolu."
 nap_restoration_mission_pack_BUTTON_DETAILS:0 "Zjednocz rozdzielone Królestwo Sycylii i wpisz swe imię w historię panem zachodniego Morza Śródziemnego i dziedzicem starożytnego Cesarstwa Łacińskiego!"
