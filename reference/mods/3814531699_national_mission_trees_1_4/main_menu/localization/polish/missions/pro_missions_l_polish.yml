l_polish:
 pro_jewel_of_occitania_mission_pack: "Klejnot Oksytanii"
 pro_jewel_of_occitania_mission_pack_DESCRIPTION:0 "Jako potomkowie Kapetyńskiego Domu Andegawenów hrabiowie Prowansji dzierżą roszczenia do Neapolu, Sycylii, Aragonii, Węgier i Jerozolimy. Rozwiń Marsylię w największe miasto portowe Morza Śródziemnego, zjednocz Oksytanię i ukaż światu prawowite prawa dziedziczenia dynastii Andegawenów. Chwała „Króla Królów” czeka."
 pro_jewel_of_occitania_mission_pack_CRITERIA_DESCRIPTION:0 "Jako hrabia Prowansji urzeczywistnij prawa dziedziczenia domu Andegawenów, zjednocz Oksytanię i podbij Francję."
 pro_jewel_of_occitania_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by zostać Królem Królów."
 pro_jewel_of_occitania_mission_pack_BUTTON_DETAILS:0 "Rządź światem z Marsylii!"
 pro_house_of_anjou: "Ambicje domu Andegawenów"
 pro_house_of_anjou_desc: "Kapetyński Dom Andegawenów niegdyś rozkwitał jako dom królewski Sycylii, Neapolu i Węgier, lecz teraz zachowuje tylko Hrabstwo Prowansji w południowej Francji. A jednak serce króla René żywi marzenia o wielu roszczeniach królewskich. Nadszedł czas, by odzyskać chwałę z gleby Prowansji."
 pro_statutes_of_aix: "Statuty Aix"
 pro_statutes_of_aix_desc: "Aix-en-Provence, jako stolica Hrabstwa Prowansji, rozwinęło własny system prawny, znany jako „Statuty Aix”. Ustanowienie kontroli i kodyfikacji prawnej odblokowuje dwie swoiste instytucje: Etats de Provence (Stany Generalne) i Wolny Port Marsylii."
 pro_statutes_of_aix_unlock_tt: "Odblokowuje przywileje miejskie Stany Generalne Prowansji i Wolny Port Marsylii."
 pro_sponsor_the_arts: "Wspieraj sztuki"
 pro_sponsor_the_arts_desc: "Król René jest znany jako jeden z największych mecenasów włoskiego renesansu. Zaproś artystów i uczonych i uczyń Prowansję zachodnim centrum kultury renesansowej."
 pro_develop_marseille: "Rozwiń Marsylię"
 pro_develop_marseille_desc: "Marsylia, miasto portowe założone przez starożytnych Greków, jest kluczowym węzłem handlu śródziemnomorskiego. Rozwój tego miasta wyznacza pierwszy krok Prowansji ku staniu się potęgą handlową i morską."
 pro_toulon_dockyard: "Stocznia w Tulonie"
 pro_toulon_dockyard_desc: "Tulon, wspaniały naturalny port, jest jedną z najlepszych pozycji morskich na Morzu Śródziemnym. Zbuduj tu wielką stocznię i arsenał, by uczynić go portem macierzystym floty prowansalskiej."
 pro_lords_of_the_rhone: "Panowie korytarza Rodanu"
 pro_lords_of_the_rhone_desc: "Rzeka Rodan jest żywotnym szlakiem transportu i handlu, łączącym Alpy z Prowansją. Pełne opanowanie tego korytarza ustanawia Prowansję niekwestionowanym władcą południowej Francji."
 pro_avignon_question: "Kwestia Awinionu"
 pro_avignon_question_desc: "Awinion, siedziba papiestwa od 1309 do 1377 roku, wciąż istnieje jako enklawa papieska. Przywiedź to miasto do Prowansji dyplomacją lub podbojem."
 pro_piqure_de_marseilles: "Piqure de Marseilles"
 pro_piqure_de_marseilles_desc: "„Piqué de Marseille”, misterna pikowana tkanina, reprezentuje wyrafinowane rzemiosło tekstylne Prowansji. Rozszerzenie produkcji sukna i cienkiego sukna przynosi Prowansji wielkie bogactwo."
 pro_la_marseillaise: "La Marseillaise"
 pro_la_marseillaise_desc: "Marsz, śpiewany przez ochotników, wyruszających z Marsylii. Armia prowansalska jest teraz najsilniejszą siłą wojskową w południowej Francji."
 pro_claims_of_king_rene: "Roszczenia króla René"
 pro_claims_of_king_rene_desc: "Dobry Król René został tragicznie wyrzucony z tronu neapolitańskiego i pozbawiony korony Aragonii. Lecz prawowite prawa dziedziczenia domu Andegawenów nie są stracone. Nadszedł czas, by ukazać te prawa światu."
 pro_king_of_naples: "Król Neapolu"
 pro_king_of_naples_desc: "Tron neapolitański jest prawowitym dziedzictwem domu Andegawenów. Odzyskaj to siedlisko, wyrwane przez dynastię Trastámara z Aragonii, i odbuduj rządy andegaweńskie w Południowych Włoszech."
 pro_king_of_sicily: "Król Sycylii"
 pro_king_of_sicily_desc: "Wielkie Królestwo Sycylii, niegdyś zbudowane przez Normanów, zostało również odziedziczone przez dom Andegawenów. Przywiedź Sycylię znów pod sztandar Prowansji."
 pro_king_of_aragon: "Król Aragonii"
 pro_king_of_aragon_desc: "Tron aragoński dzierży największy rywal domu Andegawenów. Pomścij się na dynastii Trastámara, która ukradła Neapol, i zdobądź dominację nad Półwyspem Iberyjskim."
 pro_king_of_hungary: "Król Węgier"
 pro_king_of_hungary_desc: "Dom Andegawenów niegdyś rządził jako dom królewski Węgier. Odzyskaj ten tron, utracony pod koniec XIV wieku, i ustanów wpływ na Europę Wschodnią."
 pro_king_of_jerusalem: "Król Jerozolimy"
 pro_king_of_jerusalem_desc: "Tytuł „Króla Jerozolimy” od dawna zgłaszany jest przez dom Andegawenów. Połóż kres temu pustemu tytułowi, faktycznie podbijając Święte Miasto i stając się strażnikiem świata chrześcijańskiego."
 pro_integrate_lorraine: "Włącz Lotaryngię"
 pro_integrate_lorraine_desc: "Księstwo Lotaryngii jest jednym z niewielu tytułów, które dom Andegawenów zdołał zachować. Zintegruj różne frakcje i przywiedź Lotaryngię w pełni pod kontrolę prowansalską."
 pro_join_the_empire: "Dołącz do Cesarstwa"
 pro_join_the_empire_desc: "Dołączenie do Świętego Cesarstwa Rzymskiego jest mądrym wyborem dyplomatycznym, by osłonić Prowansję przed zagrożeniami ze strony wielkich potęg. Alternatywnie przewodzenie Cesarstwu jako jego Arcyksiążę jest również opcją."
 pro_unite_occitania: "Zjednocz Oksytanię"
 pro_unite_occitania_desc: "Ludzie Południowej Francji, mówiący po oksytańsku, są wyczerpani Krucjatą Albigensów i Wojną Stuletnią. Zjednocz Oksytanię pod sztandarem hrabiów Prowansji i uwolnij ich spod rządów francuskich."
 pro_gascony: "Gaskonia"
 pro_gascony_desc: "Gaskonia, skupiona wokół Bordeaux, jest bogatą ziemią z historycznymi więzami z Anglią. Kontrola nad Tuluzą i Bordeaux zdobywa całą Południową Francję."
 pro_king_of_france: "Król Francji"
 pro_king_of_france_desc: "Królestwo Francji od dawna jest rywalem Prowansji, lecz nadszedł czas, by zająć jego tron. Podbij Paryż i wznieś sztandar andegaweński nad całą Francją."
 pro_king_of_kings: "Król Królów"
 pro_king_of_kings_desc: "Dom Andegawenów podbił Neapol, Sycylię, Aragonię, Węgry, Jerozolimę i Francję. To imperium, noszące wiele koron, jest rządzone przez Króla Królów — średniowieczne marzenie urzeczywistnione."
 STATIC_MODIFIER_NAME_pro_statutes_of_aix_mod: "Statuty Aix"
 STATIC_MODIFIER_DESC_pro_statutes_of_aix_mod: "Hrabiowie Prowansji, rezydujący w Aix-en-Provence, rozwinęli własny kodeks prawny, czerpiący z tradycji prawa rzymskiego. To pisane prawo skodyfikowało prawa i obowiązki szlachty, duchowieństwa i mieszczan, czyniąc Prowansję jednym z najbardziej zaawansowanych prawnie regionów średniowiecznej Francji."
 STATIC_MODIFIER_NAME_pro_sponsor_the_arts_mod: "Mecenat sztuk"
 STATIC_MODIFIER_DESC_pro_sponsor_the_arts_mod: "Sam król René władał pędzlem i komponował poezję — rzadki władca-artysta. Jego dwór odziedziczył tradycję trubadurów Prowansji, przyciągając jednocześnie artystów z Flandrii i Włoch. Znaczna część jego reputacji „Dobrego Króla René” opiera się na tym niezwykłym mecenacie kulturalnym."
 STATIC_MODIFIER_NAME_pro_marseille_mod: "Dobrobyt Marsylii"
 STATIC_MODIFIER_DESC_pro_marseille_mod: "Założona jako Massalia przez greckich kolonistów z Fokai około 600 roku p.n.e., Marsylia od starożytności jest węzłem handlu śródziemnomorskiego. W czasach krucjat służyła jako główny punkt zborny ludzi i materiałów, zmierzających do Ziemi Świętej. To starożytne miasto portowe jest gospodarczym sercem Prowansji."
 STATIC_MODIFIER_NAME_pro_toulon_dockyard_mod: "Stocznia w Tulonie"
 STATIC_MODIFIER_DESC_pro_toulon_dockyard_mod: "Zatoka Tulonu, wspaniały naturalny port, osłonięty wzgórzami, oferowała schronienie żeglarzom od starożytności. Hrabiowie Prowansji rozwinęli tę naturalną twierdzę jako bazę morską w XV wieku. Ludwik XIV później zbuduje tu jeden z największych arsenałów morskich Europy — dziedzictwo, które już zapuszcza korzenie."
 STATIC_MODIFIER_NAME_pro_lords_of_the_rhone_mod: "Panowie korytarza Rodanu"
 STATIC_MODIFIER_DESC_pro_lords_of_the_rhone_mod: "Rzeka Rodan od czasów rzymskich była wielką arterią, łączącą Morze Śródziemne z wnętrzem Francji. Wzdłuż tej drogi wodnej stoją Arles, Awinion i niezliczone miasta handlowe, przez które od wieków płyną towary, armie i pielgrzymi. Kontrolować ten korytarz to dzierżyć strategiczne serce Prowansji."
 STATIC_MODIFIER_NAME_pro_avignon_question_mod: "Awinion włączony"
 STATIC_MODIFIER_DESC_pro_avignon_question_mod: "Od 1309 do 1377 roku siedmiu papieży rezydowało w Awinionie zamiast w Rzymie w tym, co stało się znane jako „Papiestwo Awiniońskie”. Ten osobliwy epizod przekształcił Awinion w jedno z największych miast dyplomatycznych Europy. Pamięć o dworze papieskim wciąż trwa w tym mieście — jego zdobycie niesie głęboką wagę symboliczną dla świata katolickiego."
 STATIC_MODIFIER_NAME_pro_piqure_de_marseilles_mod: "Piqure de Marseilles"
 STATIC_MODIFIER_DESC_pro_piqure_de_marseilles_mod: "„Piqué de Marseille”, pikowana tkanina z misternym szyciem po obu stronach, zdobyła Europę w XVII i XVIII wieku. Jej korzenie leżą w biegłych średniowiecznych tkaczach Prowansji. Cienkie sukno, wywożone przez port Marsylii, od dawna stanowi kamień węgielny reputacji handlowej Prowansji."
 STATIC_MODIFIER_NAME_pro_la_marseillaise_mod: "La Marseillaise"
 STATIC_MODIFIER_DESC_pro_la_marseillaise_mod: "Pieśń, śpiewana przez marsylskich ochotników, maszerujących do Paryża podczas Rewolucji, pewnego dnia stanie się hymnem narodowym Francji. Lecz wojowniczy duch Prowansji jest jeszcze starszy — zahartowany na turniejowych arenach Arles, w krucjatach i niezliczonych kampaniach pod sztandarem andegaweńskim po całym Morzu Śródziemnym."
 STATIC_MODIFIER_NAME_pro_claims_of_king_rene_mod: "Roszczenia króla René"
 STATIC_MODIFIER_DESC_pro_claims_of_king_rene_mod: "„Dobry Król René” dzierżył roszczenia do Neapolu, Sycylii, Aragonii, Węgier i Jerozolimy, a jednak przegrał prawie wszystkie swe wojny. Mimo to jego uparte podtrzymywanie tych tytułów — utrzymywane przez dziesięciolecia dyplomacji i mecenatu artystycznego — utrzymało legitymizację dynastii Andegawenów żywą na dworach Europy."
 STATIC_MODIFIER_NAME_pro_king_of_naples_mod: "Tytuł Króla Neapolu"
 STATIC_MODIFIER_DESC_pro_king_of_naples_mod: "Andegaweńskie Królestwo Neapolu, założone przez Karola I Andegaweńskiego w 1266 roku, było niegdyś dominującą potęgą Południowych Włoch. Choć Sycylia została utracona w Nieszporach Sycylijskich, Neapol pozostał klejnotem koronnym francuskich ambicji we Włoszech i najbardziej namacalnym symbolem władzy andegaweńskiej na półwyspie."
 STATIC_MODIFIER_NAME_pro_king_of_sicily_mod: "Tytuł Króla Sycylii"
 STATIC_MODIFIER_DESC_pro_king_of_sicily_mod: "Nieszpory Sycylijskie z 1282 roku — gdy wyspiarze powstali i wymordowali swych francuskich władców przy biciu dzwonów kościelnych — wypędziły Andegawenów z Sycylii na zawsze i sprowadziły Aragończyków. Lecz ta wyspa, gdzie niegdyś razem rozkwitały kultury normańska, arabska i bizantyjska, pozostaje największym niedokończonym marzeniem Andegawenów."
 STATIC_MODIFIER_NAME_pro_king_of_aragon_mod: "Tytuł Króla Aragonii"
 STATIC_MODIFIER_DESC_pro_king_of_aragon_mod: "Korona Aragońska zbudowała imperium śródziemnomorskie, obejmujące Sycylię, Sardynię i Neapol — i uczyniła to w dużej mierze kosztem Andegawenów. Ponad stulecie rywalizacji między tymi dwiema dynastiami ukształtowało politykę zachodniego Morza Śródziemnego. Wyrwanie korony Aragonii z rąk Trastámarów jest ostateczną zemstą."
 STATIC_MODIFIER_NAME_pro_king_of_hungary_mod: "Tytuł Króla Węgier"
 STATIC_MODIFIER_DESC_pro_king_of_hungary_mod: "Gdy Karol Robert (Karobert) Andegaweński został królem Węgier w 1310 roku, gałąź rodziny ustanowiła się w Europie Środkowej jako wielka potęga. Pod dynastią Andegawenów Węgry przeżyły jedną ze swych najbardziej pomyślnych epok, zanim Habsburgowie i Osmanowie przekształcili region."
 STATIC_MODIFIER_NAME_pro_king_of_jerusalem_mod: "Tytuł Króla Jerozolimy"
 STATIC_MODIFIER_DESC_pro_king_of_jerusalem_mod: "Gdy Godfryd z Bouillon poprowadził Pierwszą Krucjatę do zwycięstwa w 1099 roku, narodziło się Królestwo Jerozolimskie. Utracony na rzecz Saladyna w 1187 roku i nigdy w pełni nieodzyskany, tytuł „Króla Jerozolimy” stał się pustym roszczeniem, przekazywanym między europejskimi dynastiami. Dom Andegawenów od dawna dzierży ten tytuł — teraz staje się on rzeczywisty."
 STATIC_MODIFIER_NAME_pro_integrate_lorraine_mod: "Lotaryngia włączona"
 STATIC_MODIFIER_DESC_pro_integrate_lorraine_mod: "Lotaryngia (Lothringen) jest spornym pograniczem od czasu, gdy Traktat z Verdun podzielił imperium Karola Wielkiego. Ojciec René I, Ludwik II, dzierżył Księstwo Lotaryngii, a sam René był księciem Lotaryngii, zanim odziedziczył Prowansję. To starożytne księstwo łączy świat francuski i niemiecki."
 STATIC_MODIFIER_NAME_pro_join_the_empire_mod: "Dyplomacja imperialna"
 STATIC_MODIFIER_DESC_pro_join_the_empire_mod: "Święte Cesarstwo Rzymskie od dawna graniczy z Prowansją, a przez Lotaryngię dom Andegawenów ma już więzy ze światem imperialnym. Czy to dołączając jako członek, czy przewodząc jako Arcyksiążę, osadzenie Prowansji w złożonej sieci sojuszy Cesarstwa znacznie rozszerza jej zasięg dyplomatyczny."
 STATIC_MODIFIER_NAME_pro_unite_occitania_mod: "Unia Oksytanii"
 STATIC_MODIFIER_DESC_pro_unite_occitania_mod: "Oksytańskojęzyczne południe było niegdyś domem trubadurów — poetów, którzy wynaleźli sztukę miłości dworskiej i których pieśni rozprzestrzeniły się po Europie. Krucjata Albigensów z XIII wieku i Wojna Stuletnia zniszczyły ten świat. Zjednoczyć Oksytanię pod Prowansją to rozpalić na nowo utraconą cywilizację."
 STATIC_MODIFIER_NAME_pro_gascony_mod: "Gaskonia zdobyta"
 STATIC_MODIFIER_DESC_pro_gascony_mod: "Gaskonia, skupiona wokół wielkiego portu winnego Bordeaux, była ostatnią znaczącą kontynentalną posiadłością Anglii — dzierżoną przez trzy stulecia, zanim została utracona w 1453 roku. Bogata w wino, wełnę i handel atlantycki, ten region zawsze był nagrodą. Wyrwanie go z wpływu angielskiego dopełnia południowy łuk Francji prowansalskiej."
 STATIC_MODIFIER_NAME_pro_king_of_france_mod: "Tytuł Króla Francji"
 STATIC_MODIFIER_DESC_pro_king_of_france_mod: "Dynastia Kapetyngów Francji i jej andegaweńska młodsza gałąź dzielą wspólną krew — a jednak ich drogi się rozeszły, gdy Karol Andegaweński popłynął na południe, by podbić Sycylię. Teraz młodsza gałąź zajmuje tron linii głównej. „Najchrześcijańskiejszy Król” Francji, najstarszy syn Kościoła, nosi najbardziej prestiżową koronę w katolickim chrześcijaństwie."
 STATIC_MODIFIER_NAME_pro_king_of_kings_mod: "Król Królów"
 STATIC_MODIFIER_DESC_pro_king_of_kings_mod: "Neapol, Sycylia, Aragonia, Węgry, Jerozolima, Francja — żadna średniowieczna dynastia nigdy nie nosiła jednocześnie tak wielu koron. Dom Andegawenów wzniósł się z drobnego hrabstwa prowansalskiego do imperium, rozciągającego się od Morza Śródziemnego po Dunaj. Marzenie „Dobrego Króla René” — odrzucane jako niemożliwa fantazja — stoi spełnione."
 pro_events.2.t: "Roszczenia króla René"
 pro_events.2.d: "Nadszedł czas, by ogłosić prawowite prawa dziedziczenia domu Andegawenów. Królestwo Neapolu było niegdyś andegaweńskie, lecz zostało utracone w klęsce przed siłami aragońskimi Alfonsa V. Teraz w imieniu króla René kwestionujemy tę niesprawiedliwą okupację. Uzyskaj casus belli przeciw Neapolowi i dowiedź prawowitości domu Andegawenów siłą oręża."
 pro_events.2.a: "Neapol należy do domu Andegawenów!"
 pro_lorraine_marriage: "Małżeństwo z Lotaryngią"
 pro_lorraine_marriage_desc: "Księstwo Lotaryngii jest jednym z tytułów, które dom Andegawenów niegdyś dzierżył. Pogłębij więzy z domem Lotaryngii przez małżeństwo dyplomatyczne i sojusz, otwierając drogę do jego nadania w lenno. Ustanów stosunki z Lotaryngią przez pokrewieństwo, małżeństwo lub sojusz."
 pro_events.3.t: "Rządy Roberta Mądrego"
 pro_events.3.d: "W 1337 roku Prowansją rządzi Robert Andegaweński (Roberto d’Angiò, ok. 1277–1343), sławiony jako „Mądry”. Jako król Neapolu, tytularny król Jerozolimy i hrabia Prowansji stoi jako centralna postać polityki włoskiej. Mistrz partii gwelfów (prapapieskiej), który odparł inwazje cesarskie, w 1336 roku wypędził Jana Czeskiego z Włoch. Głęboki miłośnik sztuk i nauki, szanowany równo przez Petrarkę i Boccaccia, Robert przyniósł złoty wiek kultury Neapolowi i Prowansji. Lecz jego ostatnie lata są zakłócone przez niepowodzenie w odzyskaniu Sycylii i kryzys sukcesyjny. Dziedziczka Roberta, Joanna, jest młoda, a przyszłość domu Andegawenów niepewna. Nadszedł czas, by kontynuować wolę tego wielkiego króla i odbudować chwałę domu Andegawenów."
 pro_events.3.a: "Kontynuować wolę króla Roberta i odbudować chwałę Andegawenów!"
 pro_events.4.t: "Małżeństwo z Lotaryngią"
 pro_events.4.d: "Poprzez manewry dyplomatyczne i politykę małżeńską nasze stosunki z Księstwem Lotaryngii stały się silniejsze niż kiedykolwiek wcześniej. Z krwią andegaweńską i lotaryńską splecioną interesy obu domów są głęboko związane. Nadszedł czas, by przyjąć księcia Lotaryngii jako wasala Prowansji i wykorzystać jego zasoby i potęgę wojskową dla sprawy andegaweńskiej."
 pro_events.4.a: "Przyjąć księcia Lotaryngii jako wasala"
 pro_events.4.b: "Zachować niezależność, utrzymując sojusz"
 pro_events.5.t: "Utworzenie Królestwa Jerozolimskiego"
 pro_events.5.d: "Święte Miasto Jerozolima wreszcie wpadło pod sztandar Prowansji. Dom Andegawenów dzierży teraz tytuł „Króla Jerozolimy” zarówno w imieniu, jak i w czynie, kontynuując tradycję krzyżową. Odbuduj Królestwo Jerozolimskie (KOJ) na kluczowych pozycjach Lewantu i pozwól mu być rządzonym jako wasal Prowansji. To święte królestwo, po raz pierwszy założone przez Pierwszą Krucjatę w 1099 roku, odradza się ręką domu Andegawenów. Jako strażnik wiary katolickiej broń Ziemi Świętej przed siłami islamskimi."
 pro_events.5.a: "Odbudować Królestwo Jerozolimskie i pozwolić mu być rządzonym jako wasal andegaweński!"
 pro_etats_de_provence_town_rights: "Etats de Provence"
 pro_etats_de_provence_town_rights_desc: "Stany Generalne Prowansji, w których uczestniczą szlachta, duchowieństwo i mieszczanie. Wzmacniają trzy stany i gwarantują autonomię regionalną i rządy konsultacyjne. Poprawiają też efektywność gabinetu."
 pro_marseille_free_port_town_rights: "Wolny Port Marsylii"
 pro_marseille_free_port_town_rights_desc: "Ogłasza Marsylię wolnym portem. Znacznie rozszerza prawa handlowe kupców i podnosi wzrost populacji, dobrobyt i siłę mieszczan. Może być nadane wyłącznie Marsylii."
 pro_events.6.t: "Rozwiązanie kwestii Awinionu"
 pro_events.6.d: "Awinion stoi jako enklawa papieska na terytorium prowansalskim, odkąd papiestwo zamieszkało tam w 1309 roku. Gdy papież Grzegorz XI wrócił do Rzymu w 1377 roku, miasto pozostało papieskim punktem oporu, wbijając klin w ziemie prowansalskie, którego hrabia Prowansji od dawna nie znosił. Teraz, gdy stosunki z papiestwem są w porządku, nadarzyła się okazja, by rozwiązać kwestię Awinionu pokojowo. Papież zgadza się ustąpić Awinion Prowansji w zamian za stosowne wynagrodzenie."
 pro_events.6.a: "Awinion należy do Prowansji"
