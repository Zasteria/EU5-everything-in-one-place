l_polish:
 mos_moscow_mission_pack: "Od jarzma tatarskiego do samodzierżcy całej Rusi"
 mos_moscow_mission_pack_DESCRIPTION:0 "W 1337 roku Wielkie Księstwo Moskiewskie jest małym księstwem pod panowaniem Złotej Ordy. Dzięki przebiegłemu gromadzeniu bogactwa i dyplomatycznej zręczności Iwana I Kality wobec Tatarów, Moskwa nieustannie rosła w siłę. Lecz Nowogród, Twer i Litwa ją otaczają, podczas gdy zagrożenie tatarskie trwa od południa. Zrzuć jarzmo tatarskie, zjednocz księstwa ruskie, ogłoś się carem, panuj jako Trzeci Rzym i stań się samodzierżcą całej Rusi — władcą aż po kresy Syberii."
 mos_moscow_mission_pack_CRITERIA_DESCRIPTION:0 "Zrzuć jarzmo tatarskie, podbij Kazań, Astrachań i Nowogród, by zjednoczyć Ruś, przyjmij tytuł cara, stań się Trzecim Rzymem i podbij Syberię."
 mos_moscow_mission_pack_BUTTON_TOOLTIP:0 "Stań się samodzierżcą całej Rusi."
 mos_moscow_mission_pack_BUTTON_DETAILS:0 "Od Wielkiego Księstwa Moskiewskiego do Imperium Rosyjskiego — spełnij historyczne przeznaczenie!"
 mos_rally_the_army: "Zmobilizuj armię"
 mos_rally_the_army_desc: "W 1337 roku Wielkie Księstwo Moskiewskie nieustannie rośnie dzięki przebiegłej zręczności Iwana I Kality. Przygotuj armię i rozpocznij ekspansję moskiewskiego panowania nad księstwami ruskimi."
 mos_break_tatar_yoke: "Zrzuć jarzmo tatarskie"
 mos_break_tatar_yoke_desc: "Od 1237 roku tatarskie daniny i podległość gnębią Ruś. Pamięć zwycięstwa Dymitra Dońskiego na Kulikowym Polu wciąż żyje. Ogłoś pełną niepodległość i zrzuć jarzmo tatarskie na zawsze."
 mos_conquer_kazan: "Podbój Kazania"
 mos_conquer_kazan_desc: "Chanat Kazański kontroluje szlak handlowy Wołgi. Jego podbój daje Moskwie panowanie nad wielką rzeką — wyprzedź zwycięstwo Iwana Groźnego z 1552 roku."
 mos_subjugate_kazan: "Podporządkuj Środkową Wołgę"
 mos_subjugate_kazan_desc: "Po podboju Kazania zajmij dorzecze środkowej Wołgi — Samarę i Tambow — by otworzyć drogę na południe."
 mos_conquer_astrakhan: "Podbój Astrachania"
 mos_conquer_astrakhan_desc: "Chanat Astrachański kontroluje deltę dolnej Wołgi. Podbij go, by zapewnić dostęp do Morza Kaspijskiego i wschodni szlak handlowy."
 mos_destroy_hordes: "Zniszczenie hord"
 mos_destroy_hordes_desc: "Rozbij tatarskie państwa sukcesyjne, w tym Ordę Nogajską, i otwórz drogę na step."
 mos_claim_steppes: "Zgłoś roszczenia do stepów"
 mos_claim_steppes_desc: "Podbij step pontyjski na północnym wybrzeżu Morza Czarnego, by ujawnić oblicze Moskwy jako wielkiego imperium kontynentalnego."
 mos_black_sea_access: "Dostęp do Morza Azowskiego"
 mos_black_sea_access_desc: "Posuń się w kierunku Morza Azowskiego, by zapewnić dostęp do handlu czarnomorskiego — wyprzedź zdobycie Azowa przez Piotra Wielkiego w 1696 roku."
 mos_conquer_crimea: "Podbój Krymu"
 mos_conquer_crimea_desc: "Podbij Chanat Krymski, by ustanowić panowanie nad Morzem Czarnym — wyprzedź aneksję Katarzyny Wielkiej z 1783 roku."
 mos_consolidate_russia: "Konsolidacja Rusi"
 mos_consolidate_russia_desc: "Z Moskwą w centrum, skonsoliduj księstwa ruskie w jedną potężną podstawę państwa."
 mos_dev_moscow: "Rozwój Kremla"
 mos_dev_moscow_desc: "Rozwiń Kreml moskiewski — symbol władzy rosyjskiej. Wielkie sobory wypełniające tę świętą siedzibę stają się sercem Imperium Rosyjskiego."
 mos_conquer_novgorod: "Podbój Nowogrodu"
 mos_conquer_novgorod_desc: "Nowogród — niegdyś największe miasto-państwo handlowe Rusi. Urzeczywistnij decydujący podbój Iwana III z 1478 roku jeszcze wcześniej."
 mos_conquer_tver: "Podbój Tweru"
 mos_conquer_tver_desc: "Twer, niegdyś rywal Moskwy — jego potęga osłabła. Podbij to kluczowe miasto nad Wołgą, by posunąć naprzód zjednoczenie Rusi."
 mos_conquer_ryazan: "Podporządkowanie Riazania"
 mos_conquer_ryazan_desc: "Riazań, po raz pierwszy spustoszony przez Mongołów w 1237 roku — podbij jego południowy step i zbuduj linię obronną."
 mos_conquer_smolensk: "Podbój Smoleńska"
 mos_conquer_smolensk_desc: "Smoleńsk, „klucz do Rusi” — kontroluj to skrzyżowanie wschodu i zachodu, by ustanowić wpływ zachodni."
 mos_conquer_ruthenia: "Podbój Rusi Białej"
 mos_conquer_ruthenia_desc: "Ruś Biała — podbij ten kontrolowany przez Litwę obszar ze stolicą w Mińsku i ustanów panowanie ogólnosłowiańskie."
 mos_window_on_west: "Okno na Zachód"
 mos_window_on_west_desc: "Zdobądź Wyborg i Karelię, by otworzyć „okno na Zachód” — wyprzedź marzenie Piotra Wielkiego o zachodnim dostępie."
 mos_baltic_ambition: "Ambicje bałtyckie"
 mos_baltic_ambition_desc: "Wschodnie wybrzeże Bałtyku, kontrolowane przez Zakon Inflancki — podbój tego obszaru pozwala wejść w handel północnoeuropejski."
 mos_conquer_riga: "Podbój Rygi"
 mos_conquer_riga_desc: "Ryga, filar Hanzy — podbij to bałtyckie centrum handlowe, by uzyskać dostęp do północnoeuropejskiej sieci handlowej."
 mos_partition_poland: "Rozbiór Polski"
 mos_partition_poland_desc: "Zakończ długą walkę z Rzecząpospolitą Obojga Narodów o Ruś Białą i Europę Wschodnią."
 mos_metropolitan_see: "Metropolia moskiewska"
 mos_metropolitan_see_desc: "W 1448 roku Moskwa ustanowiła niezależną metropolię kościelną. Ta władza prawosławna wspiera legitymizację polityczną Moskwy."
 mos_land_of_churches: "Ziemia cerkwi"
 mos_land_of_churches_desc: "„Święta Ruś” — zbuduj prawosławne sobory na całej ziemi i uświęć Ruś jako królestwo Boże."
 mos_tsar_title: "Tytuł cara"
 mos_tsar_title_desc: "„Car (Cesarz)” — Iwan IV formalnie przyjął ten tytuł w 1547 roku. Ogłoś władzę jako dziedzic Rzymu i zdobądź uznanie jako potęga europejska."
 mos_russian_patriarchate: "Patriarchat rosyjski"
 mos_russian_patriarchate_desc: "Patriarchat moskiewski, ustanowiony w 1589 roku, niezależny od Konstantynopola — wzmocnij religijne fundamenty „Trzeciego Rzymu”."
 mos_guardian_orthodoxy: "Strażnik prawosławia"
 mos_guardian_orthodoxy_desc: "Po upadku Konstantynopola przed Osmanami w 1453 roku, Ruś staje się strażnikiem wiary prawosławnej. Zbuduj sieć prawosławną na całej ziemi."
 mos_conquer_constantinople: "Podbój Konstantynopola"
 mos_conquer_constantinople_desc: "Odzyskaj prawosławną świętą stolicę Konstantynopol z rąk osmańskich — spełnij misję „Trzeciego Rzymu” i przepisz historię."
 mos_third_rome: "Trzeci Rzym"
 mos_third_rome_desc: "„Moskwa jest Trzecim Rzymem, a czwartemu nie być” — słowa mnicha Filoteusza stają się rzeczywistością. Moskwa panuje jako duchowe centrum świata chrześcijańskiego."
 mos_march_caucasus: "Marsz na Kaukaz"
 mos_march_caucasus_desc: "Podbij Gruzję, Armenię i Azerbejdżan w Górach Kaukazu i uczyń Rosję prawdziwym imperium kontynentalnym."
 mos_caspian_sea: "Opanowanie Morza Kaspijskiego"
 mos_caspian_sea_desc: "„Rosyjskie morze wewnętrzne” Kaspij — podbij szlak handlowy do Persji i Azji Środkowej."
 mos_beyond_urals: "Za Uralem"
 mos_beyond_urals_desc: "Góry Uralskie oznaczają granicę Europy i Azji — za nimi leżą rozległe przestrzenie Syberii. Wyprzedź podbój Jermaka z 1582 roku i zgłoś roszczenia do krainy futer."
 mos_conquer_perm: "Podbój Permu"
 mos_conquer_perm_desc: "Perm nad górną Kamą — podbij to źródło „futer kamskich” i wykorzystaj je jako przyczółek do podboju Syberii."
 mos_west_siberia: "Zachodnia Syberia"
 mos_west_siberia_desc: "Zachodnia Syberia ze stolicą w Tobolsku — rozległa tajga dostarcza niekończących się zasobów futer. Rozwiń Tobolsk „stolicą Syberii”."
 mos_east_siberia: "Wschodnia Syberia"
 mos_east_siberia_desc: "Aż po Irkuck — dotarcie do jeziora Bajkał otwiera drzwi do Wschodniej Syberii."
 mos_pacific_coast: "Osiągnij wybrzeże Pacyfiku"
 mos_pacific_coast_desc: "„Kozacy dotarli do Pacyfiku” — od Jakucka po Morze Ochockie. Rosyjska flaga powiewa na krańcu Pacyfiku."
 mos_fur_monopoly: "Monopol na futra"
 mos_fur_monopoly_desc: "Syberyjskie futra to najcenniejszy towar rynków europejskich. Zmonopolizuj ich dostawy i zdobądź niezmierzone bogactwo."
 mos_sudebnik: "Sudiebnik"
 mos_sudebnik_desc: "Sudiebnik z 1497 roku, pierwszy jednolity kodeks praw Rusi Iwana III — ten kodeks, podstawa poddaństwa chłopskiego, staje się narzędziem centralizacji."
 mos_handle_boyars: "Ujarzmij bojarów"
 mos_handle_boyars_desc: "Bojarzy kontrolują władzę lokalną — złam tę pozycję i ustanów bezpośrednich namiestników carskich, by posunąć naprzód centralizację."
 mos_oprichnina: "Opricznina"
 mos_oprichnina_desc: "Mroczna opricznina Iwana IV — czarni jeźdźcy cara oczyszczali zbuntowanych bojarów. Wykorzystaj tę okrutną, lecz skuteczną politykę, by uczynić władzę carską absolutną."
 mos_dev_agriculture: "Rozwój rolnictwa"
 mos_dev_agriculture_desc: "Bogate rosyjskie czarnoziemy — rozwiń żyzne ziemie rozciągające się od Ukrainy po Wołgę, by podnieść wydajność rolniczą."
 mos_dev_agriculture_unlock_tt: "Decyzja „Rozwój rolnictwa” jest teraz dostępna."
 mos_agriculture_decision.title: "Rozwój rolnictwa"
 mos_agriculture_decision.desc: "Czarnoziem rozciąga się od Ukrainy po Wołgę, lecz jego plony zależą od narzędzi, spichlerzy i współpracy wielkich właścicieli ziemskich. Skarbiec i wpływy władcy na dworze można przeznaczyć na jego zorganizowanie."
 mos_agriculture_decision.a: "Zorganizować zbiory."
 mos_agriculture_upgrade_decision.title: "Wielka uprawa czarnoziemu"
 mos_agriculture_upgrade_decision.desc: "Gdy pierwsze zbiory są zapewnione, państwo może objąć pługiem samo stepowe pogranicze: nowe wsie, nowe młyny i nowe drogi do wywozu zboża. Będzie to kosztować fortunę i sporą część wpływów władcy, lecz czarnoziem zaowocuje jak nigdy dotąd."
 mos_agriculture_upgrade_decision.a: "Zaorać stepowe pogranicze."
 mos_pomestye_system: "System pomiestny"
 mos_pomestye_system_desc: "System pomiestny — nadawanie ziemi w zamian za służbę wojskową — tworzy podstawę siły militarnej Rusi."
 mos_streltsy: "Ustanów strzelców"
 mos_streltsy_desc: "Strzelcy — stała piechota strzelecka utworzona przez Iwana IV. Ta elitarna formacja staje się kręgosłupem armii rosyjskiej."
 mos_zasechnaya_cherta: "Linia zasieczna"
 mos_zasechnaya_cherta_desc: "Zbuduj „linię zasieczną” z powalonych drzew i twierdz jako linię obronną przeciwko najazdom kawalerii tatarskiej."
 mos_dev_arkhangelsk: "Wznieś Archangielsk"
 mos_dev_arkhangelsk_desc: "Archangielsk, port na Morzu Białym — jedyny zamorski port handlowy Rusi przed Piotrem Wielkim. Rozwiń ten port dla bezpośredniego handlu z Europą Zachodnią."
 mos_white_sea_trade: "Handel na Morzu Białym"
 mos_white_sea_trade_desc: "Angielska Kompania Moskiewska (1555) weszła na Ruś stąd — wyprzedź ją i zajmij szlak handlowy Morza Białego."
 mos_dev_nizhny: "Rozwiń Niżny Nowogród"
 mos_dev_nizhny_desc: "U zbiegu Wołgi i Oki — rozwiń „Niżny Nowogród” centrum handlu wołżańskiego."
 mos_conquer_pskov: "Podbój Pskowa"
 mos_conquer_pskov_desc: "Psków został przyłączony do Moskwy w 1510 roku. Idąc za Nowogrodem, podbij Psków i podporządkuj całkowicie Ruś Północno-Zachodnią."
 mos_dev_yaroslavl: "Rozwiń Jarosław"
 mos_dev_yaroslavl_desc: "Jarosław ze „Złotego Pierścienia” — rozwiń to miasto handlowe nad Wołgą w węzeł tranzytowy handlu północnego."
 mos_conquer_vologda: "Rozwiń Wołogdę"
 mos_conquer_vologda_desc: "Wołogda — zdobądź to kluczowe skrzyżowanie szlaku północnego i zapewnij połączenie z handlem na Morzu Białym."
 mos_amber_road: "Szlak bursztynowy"
 mos_amber_road_desc: "Bałtycki bursztyn — dostarczaj ten towar przez Rygę na rynki europejskie i zwiększ dochody handlowe."
 mos_reform_taxation: "Reforma podatkowa"
 mos_reform_taxation_desc: "Ustanów jednolity system podatkowy i wzmocnij finanse państwa. Scentralizowany dochód podatkowy wspiera armię rosyjską."
 mos_dev_kazan_city: "Rozwiń miasto Kazań"
 mos_dev_kazan_city_desc: "Rozwiń podbity Kazań w wielonarodowe miasto, gdzie współistnieją Tatarzy, Rosjanie i Czuwasze."
 mos_conquer_vilnius: "Podbój Wilna"
 mos_conquer_vilnius_desc: "Wilno, stolica Wielkiego Księstwa Litewskiego — jego podbój kończy panowanie litewskie i przenosi hegemonię wschodnioeuropejską do Moskwy."
 mos_develop_moscow_university: "Ustanów Uniwersytet Moskiewski"
 mos_develop_moscow_university_desc: "Zbuduj sale nauki przed Uniwersytetem Moskiewskim (założonym w 1755 roku). Wczesne urzeczywistnienie marzenia Łomonosowa sprzyja intelektualnemu rozwojowi Rusi."
 mos_teutonic_order: "Rozbij Zakon Krzyżacki"
 mos_teutonic_order_desc: "Zakon Krzyżacki, dziedzictwo krucjat bałtyckich — podbój ich terytorium przynosi całkowity wpływ rosyjski nad południowym Bałtykiem."
 mos_estonian_coast: "Wybrzeże estońskie"
 mos_estonian_coast_desc: "Tallin — zdobądź ten kluczowy port hanzeatycki i osiągnij pełne włączenie w handel bałtycki."
 mos_dev_tobolsk_city: "Rozwiń miasto Tobolsk"
 mos_dev_tobolsk_city_desc: "Rozwiń Tobolsk na dobre jako „stolicę Syberii” — wyrośnij go w centrum administracyjne podboju Syberii."
 mos_streltsy_reform: "Reforma wojskowa"
 mos_streltsy_reform_desc: "Zmodernizuj strzelców — przyjmij zachodnie technologie wojskowe, by podnieść armię rosyjską do standardów europejskich."
 mos_siberian_ostrog: "Sieć ostrogów syberyjskich"
 mos_siberian_ostrog_desc: "Rozwiń sieć twierdz (ostrogów) łączącą Tobolsk, Jenisejsk i Irkuck, wspierającą podbój Syberii."
 mos_absolute_monarchy: "Ustanów monarchię absolutną"
 mos_absolute_monarchy_desc: "Ustanów absolutną władzę carską — pozbaw władzy bojarów, kościół i lokalnych panów, skupiając całą władzę w rękach cesarza."
 mos_peter_reforms: "Reformy Piotrowe"
 mos_peter_reforms_desc: "Piotr Wielki (1672-1725) przekształcił Ruś w nowoczesne państwo poprzez westernizację. Reforma wojskowa, stworzenie floty, akademia nauk. Urzeczywistnij ducha „otwarcia okna na Zachód”."
 mos_dev_st_petersburg: "Wznieś Sankt Petersburg"
 mos_dev_st_petersburg_desc: "Zbudowany przez Piotra Wielkiego w 1703 roku na bagnach Newy — wznieś Sankt Petersburg pierwszym zachodnim miastem Rusi."
 mos_russian_navy: "Ustanów flotę rosyjską"
 mos_russian_navy_desc: "„Rosja potrzebuje floty” — zgodnie z przekonaniem Piotra Wielkiego, stwórz flotę azowską i bałtycką."
 mos_dev_suzdal: "Rozwiń Suzdal"
 mos_dev_suzdal_desc: "Suzdal ze „Złotego Pierścienia” — rozwiń to starożytne miasto z licznymi średniowiecznymi cerkwiami ośrodkiem religii i kultury."
 mos_dev_vladimir: "Rozwiń Włodzimierz"
 mos_dev_vladimir_desc: "Włodzimierz, niegdyś stolica Wielkiego Księstwa — rozwiń to starożytne miasto ośrodkiem rolnictwa i zaopatrzenia w żywność."
 mos_salt_works: "Przemysł solny"
 mos_salt_works_desc: "Sól z Wołogdy i Solikamska — zapewnij stałe dostawy soli, niezbędnej dla rosyjskiego konserwowania żywności."
 mos_beeswax_trade: "Handel woskiem"
 mos_beeswax_trade_desc: "Rosyjski wosk pszczeli — kluczowy towar, wysoko poszukiwany na świece cerkwi prawosławnej i eksport zachodnioeuropejski."
 mos_iron_works: "Przemysł żelazny"
 mos_iron_works_desc: "Ruda żelaza regionu uralskiego — połóż fundament pod uralski przemysł żelazny, który wzmocni się w epoce piotrowej."
 mos_dev_astrakhan_city: "Rozwiń miasto Astrachań"
 mos_dev_astrakhan_city_desc: "Astrachań, „południowe wrota” — rozwiń go centrum handlu kaspijskiego i zajmij handel z Persją i Azją Środkową."
 mos_cossack_cavalry: "Kawaleria kozacka"
 mos_cossack_cavalry_desc: "Kozacy dońscy i zaporoscy — włącz tych najlepszych jeźdźców stepowych do armii rosyjskiej."
 mos_book_of_royal_degrees: "Stiepiennaja Kniga"
 mos_book_of_royal_degrees_desc: "Stiepiennaja Kniga zapisuje rodowód władców rosyjskich, wzmacniając legitymizację i efektywność administracyjną Moskwy."
 mos_kholmogory: "Rozwiń Chołmogory"
 mos_kholmogory_desc: "Chołmogory nad Dźwiną Północną — rozwiń tę placówkę handlową na Morzu Białym."
 mos_protect_south_slavs: "Chroń Słowian południowych"
 mos_protect_south_slavs_desc: "Wyzwól chrześcijan prawosławnych Bałkanów spod panowania osmańskiego i zbuduj ogólnosłowiańskie imperium."
 mos_conquer_carpathia: "Podbój Karpat"
 mos_conquer_carpathia_desc: "Góry Karpackie — podbój tych wrót do Europy Środkowej znacznie rozszerza wpływ zachodni."
 mos_great_northern_war: "Wielka Wojna Północna"
 mos_great_northern_war_desc: "W Wielkiej Wojnie Północnej (1700-1721) Piotr Wielki rozgromił Szwecję i ustanowił hegemonię bałtycką — urzeczywistnij to zwycięstwo wcześniej."
 mos_dev_perm_city: "Rozwiń miasto Perm"
 mos_dev_perm_city_desc: "Rozwiń Perm, węzeł handlu futrami, w prawdziwe miasto — wyrośnij go w centrum handlu i zbioru futer nad górną Kamą."
 mos_yakutsk_founded: "Załóż Jakuck"
 mos_yakutsk_founded_desc: "Jakuck, założony w 1632 roku — zbuduj go centrum Wschodniej Syberii i otwórz drogę na Pacyfik."
 mos_dev_irkutsk: "Rozwiń Irkuck"
 mos_dev_irkutsk_desc: "Irkuck nad jeziorem Bajkał — rozwiń to miasto, później „Paryż Syberii”, centrum administracyjnym i handlowym Wschodniej Syberii."
 mos_dev_minsk: "Rozwiń Mińsk"
 mos_dev_minsk_desc: "Rozwiń Mińsk, centrum Białorusi, bazą władzy zachodniej."
 mos_conquer_warsaw: "Podbój Warszawy"
 mos_conquer_warsaw_desc: "Warszawa, stolica Polski — zakończ rozbiór Polski i ustanów wpływ nad Europą Środkową."
 mos_iron_ring_defense: "Obrona Żelaznego Pierścienia"
 mos_iron_ring_defense_desc: "Sieć twierdz przeciwko inwazji z południa i zachodu — żelazny system bastionów chroni terytorium rosyjskie."
 mos_form_russia: "Utwórz Rosję"
 mos_form_russia_desc: "Zrzuciwszy jarzmo tatarskie, podbiwszy Kazań i zjednoczywszy księstwa ruskie — formalnie ogłoś państwo „Rosja” i panuj nad wszystkimi jako car."
 mos_russian_empire: "Imperium Rosyjskie"
 mos_russian_empire_desc: "Piotr Wielki ogłosił Rosję „imperium” traktatem nystadzkim z 1721 roku — urzeczywistnij ten moment wcześniej poprzez futra, rolnictwo i reformy piotrowe."
 mos_autocrat_of_all_russias: "Samodzierżca całej Rusi"
 mos_autocrat_of_all_russias_desc: "„Z łaski Bożej, Cesarz i Samodzierżca Całej Rusi” — od Bałtyku po Syberię, od Kaukazu po Ocean Arktyczny, wszystkie ziemie leżą pod suwerenną łaską cara."
 mos_events.1.t: "Wielkie Księstwo Moskiewskie — pod jarzmem tatarskim"
 mos_events.1.d: "W 1337 roku Moskwa jest małym księstwem. Jednak dzięki przebiegłej zręczności Iwana I Kality („worka pieniędzy”), poborcy tatarskiej daniny, Moskwa nagromadziła siłę.\n\nPrzewaga Moskwy to geografia: jej leśne położenie w głębi kraju utrudnia bezpośrednią kontrolę tatarską.\n\nPamięć bitwy na Kulikowym Polu (1380), gdzie Dymitr Doński odparł Tatarów, wciąż żyje. Całkowite zrzucenie jarzma tatarskiego i zjednoczenie księstw ruskich pod władzą carską — oto przeznaczenie Moskwy."
 mos_events.1.a: "Chwała Moskwie!"
 mos_events.5.t: "Zrzuć jarzmo tatarskie!"
 mos_events.5.d: "Wreszcie wojsko moskiewskie rozbiło Tatarów w bitwie — hołd tatarski skończony na zawsze. W tym historycznym zwrocie, porównywalnym do „Stania na rzece Ugrze (1480)”, Moskwa staje się chorążym wolnej Rusi. Księstwa ruskie uznają hegemonię Moskwy, a droga do jednolitego państwa jest otwarta."
 mos_events.5.a: "Ruś jest wolna! Teraz do zjednoczenia Rusi!"
 mos_events.10.t: "Koronacja cara"
 mos_events.10.d: "„Car i Wielki Książę Całej Rusi” — przyjmując ten tytuł, Moskwa ogłasza się prawowitym dziedzicem Cesarstwa Bizantyjskiego. Wyprzedź historyczny obrzęd koronacji Iwana IV z 1547 roku. Dwory Europy zaczynają uznawać Moskwę nową wielką potęgą."
 mos_events.10.a: "Niech żyje car! Niech żyje Moskwa!"
 mos_events.30.t: "Powrót Konstantynopola — dopełnienie Trzeciego Rzymu"
 mos_events.30.d: "Prawosławne święte miasto Konstantynopol w rosyjskich rękach! Odzyskanie tego miasta, które upadło przed Osmanami w 1453 roku, oznacza, że Ruś staje się duchowym przywódcą świata prawosławnego jako „Trzeci Rzym”. Chrześcijański krzyż znów wznosi się nad Hagia Sophia."
 mos_events.30.a: "Niech żyje Trzeci Rzym! Niech żyje rosyjskie prawosławie!"
 mos_events.50.t: "Reformy piotrowe — westernizacja czy tradycja?"
 mos_events.50.d: "Fala westernizacji gotowa jest zalać Ruś. Czy aktywnie przyjąć zachodnie technologie, systemy wojskowe i naukę, by rozwinąć Ruś w nowoczesną europejską potęgę — czy bronić prawosławnej tradycji i „drogi rosyjskiej”, budując swoiste imperium?"
 mos_events.50.a: "Promuj westernizację — Rosja jest częścią Europy"
 mos_events.60.t: "Utworzenie Rosji — narodziny nowego imperium"
 mos_events.60.d: "Ukraina, Białoruś i Halicz pod jedną flagą — jednolite państwo wschodniosłowiańskie „Rutenia” powstaje nową wielką potęgą Europy Wschodniej. Wszystkie ludy Rusi zbierają się pod złotymi kopułami Kijowa."
 mos_events.60.a: "Niech żyje Rosja! Niech żyje car całej Rusi!"
 mos_events.99.t: "Samodzierżca całej Rusi — dopełnienie imperium"
 mos_events.99.d: "„Z łaski Bożej, Cesarz i Samodzierżca Całej Rusi” — od Bałtyku po Syberię, od Kaukazu po Ocean Arktyczny — rosyjska flaga powiewa nad największym imperium świata. Od małego księstwa moskiewskiego z 1337 roku do największego imperium świata — ten historyczny wyczyn będzie opowiadany wiecznie."
 mos_events.99.a: "Niech żyje samodzierżca całej Rusi! Niech żyje Imperium Rosyjskie!"
 mos_events.50.b: "Zachowaj tradycję"
 STATIC_MODIFIER_NAME_mos_moscow_dev_mod: "Konsolidacja Rusi"
 STATIC_MODIFIER_DESC_mos_moscow_dev_mod: "Ruś jest skonsolidowana — Moskwa wznosi się jako niekwestionowana stolica ziem ruskich."
 STATIC_MODIFIER_NAME_mos_kremlin_mod: "Kreml moskiewski"
 STATIC_MODIFIER_DESC_mos_kremlin_mod: "Kreml moskiewski zbudowany — wieczna siedziba władzy i chwały rosyjskiej."
 STATIC_MODIFIER_NAME_mos_kazan_mod: "Podbój Kazania"
 STATIC_MODIFIER_DESC_mos_kazan_mod: "Kazań podbity — chanat tatarski upadł, a Wołga otwiera się rosyjskiej ekspansji."
 STATIC_MODIFIER_NAME_mos_volga_mod: "Środkowa Wołga"
 STATIC_MODIFIER_DESC_mos_volga_mod: "Środkowa Wołga zapewniona — wielka rosyjska rzeka staje się imperialnym szlakiem."
 STATIC_MODIFIER_NAME_mos_astrakhan_mod: "Podbój Astrachania"
 STATIC_MODIFIER_DESC_mos_astrakhan_mod: "Sztandar Moskwy powiewa z murów Astrachania, a bieg Wołgi płynie aż do brzegów kaspijskich w imieniu wielkiego księcia."
 STATIC_MODIFIER_NAME_mos_steppes_mod: "Klęska Tatarów"
 STATIC_MODIFIER_DESC_mos_steppes_mod: "Tatarzy pokonani — step pontyjski otwiera się na rosyjskie osadnictwo."
 STATIC_MODIFIER_NAME_mos_pontic_mod: "Opanowanie stepu pontyjskiego"
 STATIC_MODIFIER_DESC_mos_pontic_mod: "Opanowanie stepu pontyjskiego — Ruś panuje nad ziemiami na północ od Morza Czarnego."
 STATIC_MODIFIER_NAME_mos_azov_mod: "Posunięcie ku Morzu Azowskiemu"
 STATIC_MODIFIER_DESC_mos_azov_mod: "Za Morzem Czarnym, widocznym z portu Azowa, szlaki morskie ciągną się ku Morzu Śródziemnemu."
 STATIC_MODIFIER_NAME_mos_crimea_mod: "Podbój Krymu"
 STATIC_MODIFIER_DESC_mos_crimea_mod: "Krym podbity — Ruś zyskuje ciepły port, którego długo szukała."
 STATIC_MODIFIER_NAME_mos_novgorod_mod: "Podbój Nowogrodu"
 STATIC_MODIFIER_DESC_mos_novgorod_mod: "Nowogród podbity — wielka republika handlowa wchłonięta przez państwo rosyjskie."
 STATIC_MODIFIER_NAME_mos_tver_mod: "Twer — miasto handlowe nad Wołgą"
 STATIC_MODIFIER_DESC_mos_tver_mod: "Twer — miasto handlowe nad Wołgą — podporządkowane i włączone do Moskwy."
 STATIC_MODIFIER_NAME_mos_ryazan_mod: "Podporządkowanie Riazania"
 STATIC_MODIFIER_DESC_mos_ryazan_mod: "Riazań podporządkowany — ostatnie niezależne księstwo wchłonięte przez Ruś."
 STATIC_MODIFIER_NAME_mos_smolensk_mod: "Smoleńsk — klucz do Rusi"
 STATIC_MODIFIER_DESC_mos_smolensk_mod: "Smoleńsk — klucz do Rusi — odzyskany, zabezpieczając granicę zachodnią."
 STATIC_MODIFIER_NAME_mos_ruthenia_mod: "Podbój Rusi Białej"
 STATIC_MODIFIER_DESC_mos_ruthenia_mod: "Ruś Biała podbita — Słowianie prawosławni zachodu przychodzą pod ochronę Moskwy."
 STATIC_MODIFIER_NAME_mos_vyborg_mod: "Wyborg — brama na zachód"
 STATIC_MODIFIER_DESC_mos_vyborg_mod: "Wyborg — brama na zachód — zdobyty, dając dostęp do Bałtyku."
 STATIC_MODIFIER_NAME_mos_baltic_mod: "Ambicje bałtyckie"
 STATIC_MODIFIER_DESC_mos_baltic_mod: "Ambicje bałtyckie spełnione — Ruś rości sobie prawa do morza północnego."
 STATIC_MODIFIER_NAME_mos_riga_mod: "Ryga — bałtycki węzeł handlowy"
 STATIC_MODIFIER_DESC_mos_riga_mod: "Ryga — bałtycki węzeł handlowy — upada pod rosyjską kontrolę."
 STATIC_MODIFIER_NAME_mos_poland_mod: "Rozbiór Polski"
 STATIC_MODIFIER_DESC_mos_poland_mod: "Polska rozbita — jej terytorium wchłonięte przez Imperium Rosyjskie."
 STATIC_MODIFIER_NAME_mos_metropolitan_mod: "Metropolia moskiewska"
 STATIC_MODIFIER_DESC_mos_metropolitan_mod: "Metropolia moskiewska podniesiona — kościół wzmacnia władzę państwa rosyjskiego."
 STATIC_MODIFIER_NAME_mos_churches_mod: "Ziemia cerkwi"
 STATIC_MODIFIER_DESC_mos_churches_mod: "Ziemia cerkwi — prawosławie przenika każde miasto, miasteczko i wieś Rusi."
 STATIC_MODIFIER_NAME_mos_patriarchate_mod: "Patriarchat rosyjski"
 STATIC_MODIFIER_DESC_mos_patriarchate_mod: "Patriarchat rosyjski ustanowiony — kościół moskiewski stoi niezależny od Konstantynopola."
 STATIC_MODIFIER_NAME_mos_orthodoxy_mod: "Strażnik prawosławia"
 STATIC_MODIFIER_DESC_mos_orthodoxy_mod: "Ruś uznana strażnikiem prawosławia — obrończynią wiary."
 STATIC_MODIFIER_NAME_mos_third_rome_mod: "Trzeci Rzym"
 STATIC_MODIFIER_DESC_mos_third_rome_mod: "Moskwa ogłasza się Trzecim Rzymem — wiecznym tronem cywilizacji prawosławnej."
 STATIC_MODIFIER_NAME_mos_caucasus_mod: "Marsz na Kaukaz"
 STATIC_MODIFIER_DESC_mos_caucasus_mod: "Ogniska strażnicze rosyjskich przyczółków płoną w przełęczach kaukaskich, a nawet górskie królestwa usłyszały imię cesarza północy."
 STATIC_MODIFIER_NAME_mos_caspian_mod: "Opanowanie Kaspiku"
 STATIC_MODIFIER_DESC_mos_caspian_mod: "Opanowanie Morza Kaspijskiego otwiera szlaki handlowe do Persji i Azji Środkowej."
 STATIC_MODIFIER_NAME_mos_urals_mod: "Przekroczenie Uralu"
 STATIC_MODIFIER_DESC_mos_urals_mod: "Ural przekroczony — drzwi do Syberii otwarte."
 STATIC_MODIFIER_NAME_mos_perm_mod: "Podbój Permu"
 STATIC_MODIFIER_DESC_mos_perm_mod: "Perm podbity — wrota do Uralu i pogranicza syberyjskiego zapewnione."
 STATIC_MODIFIER_NAME_mos_tobolsk_mod: "Ustanowienie handlu syberyjskiego"
 STATIC_MODIFIER_DESC_mos_tobolsk_mod: "Handel syberyjski ustanowiony przez Tobolsk — futra i zasoby płyną na zachód."
 STATIC_MODIFIER_NAME_mos_east_siberia_mod: "Podbój Wschodniej Syberii"
 STATIC_MODIFIER_DESC_mos_east_siberia_mod: "Wschodnia Syberia podbita — panowanie Rusi rozciąga się aż po horyzont Pacyfiku."
 STATIC_MODIFIER_NAME_mos_pacific_mod: "Osiągnięcie Pacyfiku"
 STATIC_MODIFIER_DESC_mos_pacific_mod: "Pacyfik osiągnięty — Ruś obejmuje całą szerokość kontynentu eurazjatyckiego."
 STATIC_MODIFIER_NAME_mos_fur_monopoly_mod: "Monopol na futra"
 STATIC_MODIFIER_DESC_mos_fur_monopoly_mod: "Syberyjski monopol futrzany wzbogaca Ruś — skóra soboli wyceniana na wagę srebra."
 STATIC_MODIFIER_NAME_mos_sudebnik_mod: "Sudiebnik"
 STATIC_MODIFIER_DESC_mos_sudebnik_mod: "Kodeks praw Sudiebnik przyjęty — system prawny Rusi zjednoczony i zmodernizowany."
 STATIC_MODIFIER_NAME_mos_boyar_mod: "Ujarzmienie bojarów"
 STATIC_MODIFIER_DESC_mos_boyar_mod: "Bojarzy nie mogą już sprzeciwiać się carowi w Dumie i skłaniają głowy."
 STATIC_MODIFIER_NAME_mos_oprichnina_mod: "Opricznina"
 STATIC_MODIFIER_DESC_mos_oprichnina_mod: "Opricznina ustanowiona — tajna policja Iwana wymusza absolutną lojalność."
 STATIC_MODIFIER_NAME_mos_agriculture_mod: "Rozwój rolnictwa"
 STATIC_MODIFIER_DESC_mos_agriculture_mod: "Na rozległych równinach czarnoziemu złote kłosy pszenicy kołyszą się po horyzont."
 STATIC_MODIFIER_NAME_mos_black_earth_mod: "Plony czarnoziemu"
 STATIC_MODIFIER_DESC_mos_black_earth_mod: "Nowe wsie i młyny usiały stepowe pogranicze, a wozy pełne zboża toczą się na północ nowymi drogami. Czarnoziem żywi państwo jak nigdy dotąd."
 STATIC_MODIFIER_NAME_mos_pomestye_mod: "System pomiestny"
 STATIC_MODIFIER_DESC_mos_pomestye_mod: "System pomiestny daje ziemię za służbę wojskową — rodzi się szlacheckie wojsko."
 STATIC_MODIFIER_NAME_mos_streltsy_mod: "Strzelcy"
 STATIC_MODIFIER_DESC_mos_streltsy_mod: "Strzeleccy muszkieterzy sformowani — pierwsza profesjonalna stała piechota Rusi."
 STATIC_MODIFIER_NAME_mos_zaseka_mod: "Linia zasieczna"
 STATIC_MODIFIER_DESC_mos_zaseka_mod: "Linia zasieczna — wielka leśna linia obronna — chroni Ruś przed najazdami stepowymi."
 STATIC_MODIFIER_NAME_mos_arkhangelsk_mod: "Archangielsk — brama na Morze Białe"
 STATIC_MODIFIER_DESC_mos_arkhangelsk_mod: "Archangielsk otwiera okno Rusi na Morze Białe i handel północnoeuropejski."
 STATIC_MODIFIER_NAME_mos_white_sea_mod: "Handel na Morzu Białym"
 STATIC_MODIFIER_DESC_mos_white_sea_mod: "Szlaki handlowe Morza Białego łączą Ruś z kupcami angielskimi i holenderskimi."
 STATIC_MODIFIER_NAME_mos_nizhny_mod: "Niżny Nowogród — zbieg Wołgi i Oki"
 STATIC_MODIFIER_DESC_mos_nizhny_mod: "Niżny Nowogród — u zbiegu Wołgi i Oki — staje się wielkim jarmarkiem handlowym."
 STATIC_MODIFIER_NAME_mos_pskov_mod: "Psków — miasto handlowe północno-zachodnie"
 STATIC_MODIFIER_DESC_mos_pskov_mod: "Psków — miasto handlowe północno-zachodnie — włączone do państwa rosyjskiego."
 STATIC_MODIFIER_NAME_mos_yaroslavl_mod: "Złote miasto Wołgi — centrum handlu jedwabiem i lnem"
 STATIC_MODIFIER_DESC_mos_yaroslavl_mod: "Jarosław — złote miasto Wołgi — handluje jedwabiem i lnem między wschodem a zachodem."
 STATIC_MODIFIER_NAME_mos_vologda_mod: "Wołogda — północne skrzyżowanie handlowe"
 STATIC_MODIFIER_DESC_mos_vologda_mod: "Wołogda — północne skrzyżowanie handlowe — łączy Morze Białe z dorzeczem Wołgi."
 STATIC_MODIFIER_NAME_mos_amber_mod: "Szlak bursztynowy"
 STATIC_MODIFIER_DESC_mos_amber_mod: "Szlak bursztynowy z Bałtyku przepływa przez terytorium kontrolowane przez Ruś."
 STATIC_MODIFIER_NAME_mos_taxation_mod: "Reforma podatkowa"
 STATIC_MODIFIER_DESC_mos_taxation_mod: "Poborcy podatkowi na całej ziemi zapisują swoje wpływy w jednolitej formie ksiąg rachunkowych, a całe srebro płynie do skarbca carskiego."
 STATIC_MODIFIER_NAME_mos_kazan_city_mod: "Budowa wielonarodowego miasta"
 STATIC_MODIFIER_DESC_mos_kazan_city_mod: "Kazań przebudowany w wielonarodowe miasto — kultura tatarska i rosyjska współistnieją pod Moskwą."
 STATIC_MODIFIER_NAME_mos_vilnius_mod: "Wilno — stolica Litwy"
 STATIC_MODIFIER_DESC_mos_vilnius_mod: "Wilno — stolica Litwy — upada pod rosyjskie panowanie."
 STATIC_MODIFIER_NAME_mos_university_mod: "Uniwersytet Moskiewski"
 STATIC_MODIFIER_DESC_mos_university_mod: "Sale wykładowe Uniwersytetu Moskiewskiego rozbrzmiewają głosami studentów z całej Rusi, a światło Oświecenia dotarło i do tej ziemi."
 STATIC_MODIFIER_NAME_mos_teutonic_mod: "Klęska Zakonu Krzyżackiego"
 STATIC_MODIFIER_DESC_mos_teutonic_mod: "Zakon Krzyżacki rozgromiony — pogranicze bałtyckie zapewnione dla Rusi."
 STATIC_MODIFIER_NAME_mos_tallinn_mod: "Tallin — hanzeatycki przyczółek północny"
 STATIC_MODIFIER_DESC_mos_tallinn_mod: "Tallin — hanzeatycki przyczółek północny — zdobyty, dając dostęp do handlu bałtyckiego."
 STATIC_MODIFIER_NAME_mos_tobolsk_city_mod: "Stolica handlowa Syberii"
 STATIC_MODIFIER_DESC_mos_tobolsk_city_mod: "Syberyjskie futra i dary lasu piętrzą się na rynkach Tobolska, a głosy kupców nie milkną."
 STATIC_MODIFIER_NAME_mos_military_reform_mod: "Reforma wojskowa"
 STATIC_MODIFIER_DESC_mos_military_reform_mod: "Żołnierze w zachodnich mundurach maszerują po placu z nowymi muszkietami na ramionach."
 STATIC_MODIFIER_NAME_mos_ostrog_mod: "Sieć ostrogów syberyjskich"
 STATIC_MODIFIER_DESC_mos_ostrog_mod: "Z drewnianych fortów wzniesionych głęboko w syberyjskiej tajdze urzędnicy zbierający jasak futrzany ogłaszają ludowi imię imperium."
 STATIC_MODIFIER_NAME_mos_absolutism_mod: "Monarchia absolutna"
 STATIC_MODIFIER_DESC_mos_absolutism_mod: "Monarchia absolutna umocniona — słowo cara jest prawem od Bałtyku po Pacyfik."
 STATIC_MODIFIER_NAME_mos_st_petersburg_mod: "Sankt Petersburg — okno do Europy"
 STATIC_MODIFIER_DESC_mos_st_petersburg_mod: "Sankt Petersburg — okno Rusi do Europy — zbudowany na bagnach Newy."
 STATIC_MODIFIER_NAME_mos_navy_mod: "Flota rosyjska"
 STATIC_MODIFIER_DESC_mos_navy_mod: "Flota rosyjska założona — potężna eskadra pływa po Bałtyku i Morzu Czarnym."
 STATIC_MODIFIER_NAME_mos_suzdal_mod: "Suzdal — serce Złotego Pierścienia"
 STATIC_MODIFIER_DESC_mos_suzdal_mod: "Suzdal — serce Złotego Pierścienia — lśni klejnotem dawnej kultury ruskiej."
 STATIC_MODIFIER_NAME_mos_vladimir_mod: "Włodzimierz — starożytna stolica Rusi"
 STATIC_MODIFIER_DESC_mos_vladimir_mod: "Włodzimierz — starożytna stolica Rusi — odrodzony centrum carstwa rosyjskiego."
 STATIC_MODIFIER_NAME_mos_salt_mod: "Przemysł solny"
 STATIC_MODIFIER_DESC_mos_salt_mod: "Sól z kopalń wołogodzkich niesiona jest do wsi Rusi, by zachować zimowe zapasy."
 STATIC_MODIFIER_NAME_mos_beeswax_mod: "Handel woskiem"
 STATIC_MODIFIER_DESC_mos_beeswax_mod: "Handel woskiem pszczelim wzbogaca Ruś — świece i wosk łączą handel imperium."
 STATIC_MODIFIER_NAME_mos_iron_mod: "Przemysł żelazny"
 STATIC_MODIFIER_DESC_mos_iron_mod: "Piece hutnicze Uralu rozgrzane do czerwoności, a miecze i lemiesze kute z ich żelaza niesione są po całej ziemi."
 STATIC_MODIFIER_NAME_mos_astrakhan_city_mod: "Astrachań — brama na Kaspij"
 STATIC_MODIFIER_DESC_mos_astrakhan_city_mod: "Na nabrzeżach Astrachania statki załadowane perskimi dywanami i przyprawami środkowoazjatyckimi czekają na dzień, gdy popłyną w górę Wołgi."
 STATIC_MODIFIER_NAME_mos_cossack_mod: "Kawaleria kozacka"
 STATIC_MODIFIER_DESC_mos_cossack_mod: "Kawaleria kozacka służy carowi — wolni jeźdźcy stepu walczą teraz za Moskwę."
 STATIC_MODIFIER_NAME_mos_royal_degrees_mod: "Stiepiennaja Kniga"
 STATIC_MODIFIER_DESC_mos_royal_degrees_mod: "Rodowód przedstawiony w Stiepiennej Knidze pokazuje dom carski jako prawowitą linię, wybraną przez Boga."
 STATIC_MODIFIER_NAME_mos_kholmogory_mod: "Przyczółek handlowy na Morzu Białym"
 STATIC_MODIFIER_DESC_mos_kholmogory_mod: "Chołmogory służą jako przyczółek handlowy na Morzu Białym, łącząc Ruś z północą."
 STATIC_MODIFIER_NAME_mos_grand_duchy_mod: "Wielkie Księstwo"
 STATIC_MODIFIER_DESC_mos_grand_duchy_mod: "Wielkie Księstwo Moskiewskie proklamowane — fundament państwa rosyjskiego."
 STATIC_MODIFIER_NAME_mos_balkans_mod: "Ochrona Słowian południowych"
 STATIC_MODIFIER_DESC_mos_balkans_mod: "Ruś ogłasza się obrończynią Słowian południowych przeciwko uciskowi osmańskiemu."
 STATIC_MODIFIER_NAME_mos_carpathia_mod: "Podbój Karpat"
 STATIC_MODIFIER_DESC_mos_carpathia_mod: "Rosyjscy żołnierze stojący w przełęczach karpackich obserwują, jak cień imperium wydłuża się nad równinami Europy Środkowej za górami."
 STATIC_MODIFIER_NAME_mos_western_mod: "Westernizacja"
 STATIC_MODIFIER_DESC_mos_western_mod: "Reformy westernizacyjne przekształcają Ruś — technologia i kultura europejska przyjęte."
 STATIC_MODIFIER_NAME_mos_northern_war_mod: "Wielka Wojna Północna"
 STATIC_MODIFIER_DESC_mos_northern_war_mod: "Wielka Wojna Północna wygrana — Ruś powstaje jako dominująca potęga bałtycka."
 STATIC_MODIFIER_NAME_mos_perm_city_mod: "Uralska placówka handlu futrami"
 STATIC_MODIFIER_DESC_mos_perm_city_mod: "Perm rośnie jako uralska placówka handlu futrami — brama między Europą a Syberią."
 STATIC_MODIFIER_NAME_mos_yakutsk_mod: "Dalekowschodnia baza wysunięta"
 STATIC_MODIFIER_DESC_mos_yakutsk_mod: "Jakuck służy jako dalekowschodnia baza wysunięta — obecność Rusi na wybrzeżu Pacyfiku."
 STATIC_MODIFIER_NAME_mos_irkutsk_mod: "Miasto Bajkału"
 STATIC_MODIFIER_DESC_mos_irkutsk_mod: "Irkuck — miasto Bajkału — staje się centrum administracyjnym wschodniej Syberii."
 STATIC_MODIFIER_NAME_mos_minsk_mod: "Mińsk — centrum Rusi Białej"
 STATIC_MODIFIER_DESC_mos_minsk_mod: "Mińsk — centrum Rusi Białej — wchłonięty przez Imperium Rosyjskie."
