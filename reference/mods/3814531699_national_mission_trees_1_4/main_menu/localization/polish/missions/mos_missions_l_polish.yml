 mos_great_moscow: "Założenie Trzeciego Rzymu: Wielka rozbudowa Moskwy"
 mos_great_moscow_desc: "Rozbuduj Moskwę w wielkie miasto, godne Trzeciego Rzymu. Sobory, pałace, rynki i twierdze wzniosą się wzdłuż tego wspaniałego miasta, czyniąc je sercem Imperium Rosyjskiego. Spełnij wszystkie trzy warunki rozwoju, budowli i ludności, by zasłużyć Moskwie na tytuł Miasta Wiecznego."
