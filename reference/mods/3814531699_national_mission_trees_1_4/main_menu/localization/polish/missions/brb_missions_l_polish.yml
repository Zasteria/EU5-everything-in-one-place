l_polish:
 brb_brabant_mission_pack: "Dziedzictwo Dolnej Lotaryngii — zjednoczenie Niderlandów i wchłonięcie Burgundii"
 brb_brabant_mission_pack_DESCRIPTION:0 "Księstwo Brabancji, rządzone przez niezależny dom książęcy — zjednocz Niderlandy, wchłoń nowo wyrosłe Księstwo Burgundii przed historią i zbuduj prawdziwy złoty wiek."
 brb_brabant_mission_pack_CRITERIA_DESCRIPTION:0 "Zjednocz Niderlandy, wchłoń Burgundię i załóż republikę, by osiągnąć złoty wiek."
 brb_brabant_mission_pack_BUTTON_TOOLTIP:0 "Od małego księstwa do wielkiego księstwa, rządzącego Niderlandami i Burgundią."
 brb_brabant_mission_pack_BUTTON_DETAILS:0 "„Je Maintiendrai” — odwróć historię i zatknij sztandar Brabancji w całych Niderlandach!"
 brb_ducal_authority: "Ustanów władzę książęcą"
 brb_ducal_authority_desc: "Jako książę linii Leuven niech twoja władza dotrze do każdego zakątka księstwa."
 brb_joyous_entry: "Radosny Wjazd (Blijde Inkomst)"
 brb_joyous_entry_desc: "„Radosny Wjazd” — ceremonia, w której nowy książę przechodzi przez bramy miasta i potwierdza przywileje miast — ustanów tę tradycję i nadaj miastom ich własne prawa."
 brb_joyous_entry_unlock_tt: "Przywilej miejski „Miasto Radosnego Wjazdu” staje się dostępny."
 brb_develop_antwerp: "Rozwiń Antwerpię"
 brb_develop_antwerp_desc: "Antwerpia, miasto handlowe u ujścia Skaldy — rozwiń ją dalej i utrwal jej status węzła handlu północnomorskiego."
 brb_unify_brabant: "Zjednocz Brabancję"
 brb_unify_brabant_desc: "Księstwo Brabancji, podzielone między północ i południe — zjednocz je pod jednym sztandarem."
 brb_flemish_rivalry: "Rywalizacja z Flandrią"
 brb_flemish_rivalry_desc: "Hrabstwo Flandrii, znane z bogatego przemysłu sukienniczego — ustanów nasz wpływ nad tym dawnym rywalem."
 brb_hainaut_marriage: "Małżeństwo z Hainaut-Holandią"
 brb_hainaut_marriage_desc: "Hainaut, Holandia i Zelandia, rządzone przez dom Wittelsbachów — poprzez małżeństwo, sojusz lub rywalizację jednakowo zabezpiecz roszczenie do tego tronu."
 brb_liege_relations: "Stosunki z Liège"
 brb_liege_relations_desc: "Książę-Biskupstwo Liège, dzierżące rozległą władzę świecką — poprzez rywalizację lub więzy małżeńskie jednakowo zabezpiecz roszczenie do tej ziemi."
 brb_utrecht_bishopric: "Biskupstwo Utrechtu"
 brb_utrecht_bishopric_desc: "Biskupstwo Utrechtu, dzierżące rozległą władzę świecką — przywiedź je pod nasz wpływ jako podstawę zjednoczenia Niderlandów."
 brb_burgundian_ambition: "Ambicje wobec Burgundii"
 brb_burgundian_ambition_desc: "Opanowawszy główne ziemie Niderlandów, zwróć oko ambicji ku nowo wzniesionemu Księstwu Burgundii, dzierżonemu przez młodszą gałąź francuskiego domu królewskiego."
 brb_contest_flanders_inheritance: "Zakwestionuj dziedzictwo Flandrii"
 brb_contest_flanders_inheritance_desc: "Małżeństwo Małgorzaty, dziedziczki Flandrii — wygraj ten sporny związek i zdobądź Flandrię dla siebie, zanim zrobi to dom Burgundii."
 brb_absorb_burgundy: "Wchłoń Burgundię"
 brb_absorb_burgundy_desc: "Zaanektuj lub podporządkuj nowo wyrosłe Księstwo Burgundii — odwróć bieg historii i dowiedź, że Brabancja, nie Burgundia, jest panem Niderlandów."
 brb_valois_brabant: "Wielkie Księstwo Brabancji"
 brb_valois_brabant_desc: "Wchłonąwszy dziedzictwo burgundzkie, Brabancja nie jest już zwykłym księstwem — wznieś się jako wielka potęga, przewodząca Niderlandom."
 brb_je_maintiendrai: "Je Maintiendrai"
 brb_je_maintiendrai_desc: "Brabancja, Flandria, Holandia i wchłonięte dziedzictwo burgundzkie — jako pan głównych ziem Niderlandów utrzymaj te rządy."
 brb_hansa_relations: "Stosunki z Hanzą"
 brb_hansa_relations_desc: "Liga Hanzeatycka, dominująca w handlu bałtyckim — odbuduj z nią stosunki z pozycji równości."
 brb_bulk_trade: "Wspieraj handel masowy"
 brb_bulk_trade_desc: "Handel masowy zbożem i drewnem — zwiększ obecność naszej floty kupieckiej na Bałtyku."
 brb_baltic_supremacy: "Zwierzchność w handlu bałtyckim"
 brb_baltic_supremacy_desc: "Pan północnych szlaków handlowych jest prawdziwą potęgą handlową — ustanów zwierzchność w handlu bałtyckim."
 brb_land_commercial_empire: "Lądowe imperium handlowe"
 brb_land_commercial_empire_desc: "Nie tylko morze — opanuj wielkie śródlądowe centra rynkowe i zgłoś roszczenie do mistrzostwa także w handlu lądowym."
 brb_secure_grain: "Zabezpiecz zboże bałtyckie"
 brb_secure_grain_desc: "Niderlandy od dawna polegają na zbożu bałtyckim — weź te dostawy we własne ręce."
 brb_reformation_choice: "Wybór Reformacji"
 brb_reformation_choice_desc: "Nauki Lutra wstrząsają Niderlandami — stojąc na tym rozdrożu wiary, jaką ścieżkę wybierzemy?"
 brb_religious_settlement: "Ugoda religijna"
 brb_religious_settlement_desc: "Ponad sto lat po Reformacji — teraz, gdy wiara państwowa dominuje nad zdecydowaną większością ludności, przynieś stabilne pojednanie między zwaśnionymi wyznaniami."
 brb_spanish_fury: "Hiszpańska Furia"
 brb_spanish_fury_desc: "Ucisk habsburski i ciężkie opodatkowanie — furia ludu przeciw „Hiszpańskiej Furii” nie może być już powstrzymana."
 brb_sea_beggars: "Żebracy Morscy"
 brb_sea_beggars_desc: "Korsarze, nazywający siebie „Żebrakami Morskimi” — ich wyczyny przebijają dziury w hiszpańskiej dominacji na morzach."
 brb_eighty_years_war: "Wojna Osiemdziesięcioletnia"
 brb_eighty_years_war_desc: "Długa walka o niepodległość — przetrwaj tę Wojnę Osiemdziesięcioletnią i wygraj naszą wolność."
 brb_united_netherlands: "Zjednoczone Niderlandy"
 brb_united_netherlands_desc: "Federacja siedmiu prowincji — ustanów tu książęcą konfederację pod Wielkim Księciem Brabancji, niosącą dalej tradycje zarówno szlachty, jak i miast."
 brb_east_india_charter: "Karta Kompanii Wschodnioindyjskiej"
 brb_east_india_charter_desc: "Nadaj kartę na założenie Kompanii Wschodnioindyjskiej, dążąc do monopolu na handel azjatycki."
 brb_voc_trade_empire: "Imperium handlowe VOC"
 brb_voc_trade_empire_desc: "„Zjednoczona Kompania Wschodnioindyjska” (VOC) — pierwsza na świecie spółka akcyjna rozprzestrzenia swą sieć handlową od Wysp Korzennych po całą Azję."
 brb_west_india_company: "Kompania Zachodnioindyjska"
 brb_west_india_company_desc: "Handel łączący Nowy Świat i Afrykę — załóż Kompanię Zachodnioindyjską i dziel bogactwo Atlantyku."
 brb_golden_age: "Złoty Wiek"
 brb_golden_age_desc: "Rembrandt, Vermeer i kwitnący handel — osiągnij zenit „Holenderskiego Złotego Wieku”."
 brb_amsterdam_exchange: "Giełda Amsterdamska"
 brb_amsterdam_exchange_desc: "Pierwsza na świecie giełda papierów wartościowych — uczyń Amsterdam centrum finansów europejskich."
 brb_form_netherlands: "Wielkie Księstwo Niderlandów ukończone"
 brb_form_netherlands_desc: "Długa droga, która rozpoczęła się od dziedzictwa Dolnej Lotaryngii i wchłonięcia Burgundii, przez niepodległość i złoty wiek, dobiega tu dopełnienia jako wielkie księstwo, zachowujące głębokie tradycje szlachty i miast."
 brb_wool_staple_calais: "Skład wełny w Calais"
 brb_wool_staple_calais_desc: "Wełna angielska, krew życiodajna flamandzkiego przemysłu sukienniczego — ożyw handel przez skład wełny w Calais."
 brb_anglo_dutch_alliance: "Sojusz anglo-holenderski"
 brb_anglo_dutch_alliance_desc: "Anglia, nasz sąsiad za Kanałem — pośród chaosu Wojny Stuletniej umocnij trwałe stosunki z tym narodem, czy to przez sojusz, czy rywalizację."
 brb_english_channel_trade: "Mistrzostwo w handlu kanałowym"
 brb_english_channel_trade_desc: "Kanał, łączący Morze Północne i Atlantyk — ustanów zwierzchność w handlu przez tę żywotną cieśninę."
 brb_valois_suzerainty_dispute: "Zakwestionuj zwierzchnictwo Valois"
 brb_valois_suzerainty_dispute_desc: "Nominalnie wasal korony francuskiej — zakwestionuj to zwierzchnictwo i zażądaj pozycji równości."
 brb_hundred_years_war_intervention: "Interwencja w Wojnie Stuletniej"
 brb_hundred_years_war_intervention_desc: "Długa wojna, rozdzierająca Anglię i Francję — wykorzystaj tę okazję, by zainterweniować dla własnej korzyści."
 brb_somme_towns: "Miasta nad Sommą"
 brb_somme_towns_desc: "Bogate miasta Pikardii — włącz ziemie wzdłuż Sommy w nasze władanie."
 brb_end_french_vassalage: "Zakończ wasalstwo francuskie"
 brb_end_french_vassalage_desc: "Zerwij całkowicie to nominalne wasalstwo i ustanów nasz status prawdziwie niezależnego wielkiego księstwa."
 brb_events.1.t: "Początek Wojny Osiemdziesięcioletniej"
 brb_events.1.d: "Poprzez Unię Utrechcką i wyczyny Żebraków Morskich rozpoczęła się długa wojna z Hiszpanią. Ta walka zdecyduje o naszej niepodległości."
 brb_events.1.a: "Wolność albo śmierć!"
 brb_events.2.t: "Ambicje wobec Burgundii"
 brb_events.2.d: "Wyskoczkowskie Księstwo Burgundii — jaką drogę wybierzemy w sprawie jego losu?"
 brb_events.2.a: "Zapłacić złotem i przyjąć je jako wasala"
 brb_events.2.b: "Zgłosić roszczenie do Dijon i przygotować się do jego zdobycia siłą"
 brb_events.2.c: "Obserwować i czekać na razie"
 brb_events.3.t: "Zakwestionuj dziedzictwo Flandrii"
 brb_events.3.d: "Spór sukcesyjny o Małgorzatę, dziedziczkę Flandrii — jak zabezpieczymy tę bogatą ziemię dla siebie?"
 brb_events.3.a: "Zapłacić złotem i przyjąć je jako wasala"
 brb_events.3.b: "Zgłosić roszczenie do Brugii i przygotować się do jej zdobycia siłą"
 brb_events.3.c: "Obserwować i czekać na razie"
 brb_events.99.t: "Proklamacja Wielkiego Księstwa Niderlandów"
 brb_events.99.d: "Małe księstwo, które odziedziczyło Dolną Lotaryngię i wchłonęło Burgundię, odrodziło się, przez niepodległość i złoty wiek, jako wielkie księstwo pod domem Brabancji, zachowujące głębokie tradycje szlachty i miast."
 brb_events.99.a: "Chwała Wielkiemu Księstwu!"
 STATIC_MODIFIER_NAME_brb_ducal_mod: "Władza książęca ustanowiona"
 STATIC_MODIFIER_DESC_brb_ducal_mod: "Sztandar książęcy, powiewający nad Leuven, ogłasza tę samą władzę w każdym mieście zamkowym księstwa."
 STATIC_MODIFIER_NAME_brb_antwerp_mod: "Antwerpia zabezpieczona"
 STATIC_MODIFIER_DESC_brb_antwerp_mod: "Miasto handlowe Antwerpia kwitnie."
 STATIC_MODIFIER_NAME_brb_unify_brabant_mod: "Brabancja zjednoczona"
 STATIC_MODIFIER_DESC_brb_unify_brabant_mod: "Panowie dworów, niegdyś podzieleni między północ i południe, klękają teraz na tym samym dworze książęcym."
 STATIC_MODIFIER_NAME_brb_flemish_mod: "Rywalizacja z Flandrią"
 STATIC_MODIFIER_DESC_brb_flemish_mod: "Nawet tkacze z Gandawy i Brugii prowadzą teraz swe interesy z oczami zwróconymi na życzenia księcia Brabancji."
 STATIC_MODIFIER_NAME_brb_utrecht_mod: "Biskupstwo Utrechtu"
 STATIC_MODIFIER_DESC_brb_utrecht_mod: "Dzwony katedry w Utrechcie biją teraz modlitwami, błogosławiącymi panowanie księcia Brabancji."
 STATIC_MODIFIER_NAME_brb_absorb_burgundy_mod: "Burgundia wchłonięta"
 STATIC_MODIFIER_DESC_brb_absorb_burgundy_mod: "Klucze do skarbca Dijon wiszą teraz na dworze w Brukseli."
 STATIC_MODIFIER_NAME_brb_maintiendrai_mod: "Je Maintiendrai"
 STATIC_MODIFIER_DESC_brb_maintiendrai_mod: "„Utrzymam” — panowie i mieszczanie Niderlandów zbierają się na jednym dworze pod tą dewizą."
 STATIC_MODIFIER_NAME_brb_hansa_mod: "Stosunki z Hanzą"
 STATIC_MODIFIER_DESC_brb_hansa_mod: "Kupcy hanzeatyccy z Lubeki zajmują teraz swe miejsca jako równi w kantorach Antwerpii."
 STATIC_MODIFIER_NAME_brb_bulk_trade_mod: "Handel masowy wspierany"
 STATIC_MODIFIER_DESC_brb_bulk_trade_mod: "Statki załadowane zbożem i drewnem wysyłają stały strumień zamówień do stoczni u ujścia Skaldy."
 STATIC_MODIFIER_NAME_brb_baltic_supremacy_mod: "Zwierzchność w handlu bałtyckim"
 STATIC_MODIFIER_DESC_brb_baltic_supremacy_mod: "Po całym Bałtyku żagle niezliczonych statków handlowych niosą lwi sztandar Brabancji."
 STATIC_MODIFIER_NAME_brb_land_commercial_empire_mod: "Lądowe imperium handlowe"
 STATIC_MODIFIER_DESC_brb_land_commercial_empire_mod: "Wozy z Kolonii i Paryża ustawiają się w kolejkach na rynkach Brukseli i Leuven."
 STATIC_MODIFIER_NAME_brb_grain_mod: "Zboże bałtyckie zabezpieczone"
 STATIC_MODIFIER_DESC_brb_grain_mod: "Ze zbożem bałtyckim na wieki wypełniającym spichlerze żołnierze maszerują na wezwanie bez lęku przed głodem."
 STATIC_MODIFIER_NAME_brb_reformation_mod: "Wybór Reformacji"
 STATIC_MODIFIER_DESC_brb_reformation_mod: "Pod kazalnicami i w kątach rynku ludzie mówią cichymi głosami o nowej wierze."
 STATIC_MODIFIER_NAME_brb_settlement_mod: "Ugoda religijna"
 STATIC_MODIFIER_DESC_brb_settlement_mod: "Sąsiedzi, którzy niegdyś walczyli o wiarę, stoją teraz ramię w ramię przy tych samych straganach."
 STATIC_MODIFIER_NAME_brb_spanish_fury_mod: "Hiszpańska Furia"
 STATIC_MODIFIER_DESC_brb_spanish_fury_mod: "Furia tych, którzy widzieli popioły Antwerpii, wciąż dodaje sił rękom, ściskającym miecz."
 STATIC_MODIFIER_NAME_brb_sea_beggars_mod: "Żebracy Morscy"
 STATIC_MODIFIER_DESC_brb_sea_beggars_mod: "„Lepiej żebracy niż ludzie króla” — flaga Żebraków Morskich stała się koszmarem w snach hiszpańskich żeglarzy."
 STATIC_MODIFIER_NAME_brb_united_netherlands_mod: "Zjednoczone Niderlandy"
 STATIC_MODIFIER_DESC_brb_united_netherlands_mod: "Sztandary siedmiu prowincji stoją obok siebie w jednej sali zgromadzeń, a nowe państwo bierze pierwszy oddech jako książęca konfederacja."
 STATIC_MODIFIER_NAME_brb_east_india_mod: "Karta Kompanii Wschodnioindyjskiej"
 STATIC_MODIFIER_DESC_brb_east_india_mod: "Zanim woskowa pieczęć na karcie zdążyła wyschnąć, floty, zmierzające na Wschód, zaczęły podnosić żagle."
 STATIC_MODIFIER_NAME_brb_voc_mod: "Imperium handlowe VOC"
 STATIC_MODIFIER_DESC_brb_voc_mod: "Pieprz i goździki, przybywające z faktorii Batawii, wiążą nawet odległych namiestników kolonialnych z ojczyzną."
 STATIC_MODIFIER_NAME_brb_wic_mod: "Kompania Zachodnioindyjska"
 STATIC_MODIFIER_DESC_brb_wic_mod: "Pogłoski o cukrze i srebrze za Atlantykiem pędzą emigrantów, marzących o nowym świecie, do portów."
 STATIC_MODIFIER_NAME_brb_golden_age_mod: "Złoty Wiek"
 STATIC_MODIFIER_DESC_brb_golden_age_mod: "W kamienicach wielkich kupców nad kanałami wiszą obrazy pokoi oświetlonych oknami, przesyconych światłem Vermeera."
 STATIC_MODIFIER_NAME_brb_amsterdam_mod: "Giełda Amsterdamska"
 STATIC_MODIFIER_DESC_brb_amsterdam_mod: "Amsterdam, centrum finansów, kwitnie."
 STATIC_MODIFIER_NAME_brb_wool_staple_mod: "Skład wełny w Calais"
 STATIC_MODIFIER_DESC_brb_wool_staple_mod: "Na składzie wełny w Calais piętrzą się wysoko bele wełny angielskiej, przeznaczone dla tkaczy Flandrii."
 STATIC_MODIFIER_NAME_brb_anglo_treaty_mod: "Sojusz anglo-holenderski"
 STATIC_MODIFIER_DESC_brb_anglo_treaty_mod: "Posłowie, niosący zobowiązania sojuszu, przechodzą raz po raz między dworami po obu brzegach Kanału."
 STATIC_MODIFIER_NAME_brb_channel_trade_mod: "Mistrzostwo w handlu kanałowym"
 STATIC_MODIFIER_DESC_brb_channel_trade_mod: "W wąskiej cieśninie, prowadzącej od Morza Północnego do Atlantyku, flagi kupieckie Brabancji powiewają teraz w rzędach."
 STATIC_MODIFIER_NAME_brb_suzerainty_dispute_mod: "Zakwestionowanie zwierzchnictwa Valois"
 STATIC_MODIFIER_DESC_brb_suzerainty_dispute_mod: "Bramy Brukseli odprawiły bez wstydu heroldów, wysłanych z Paryża, by wezwać swego wasala."
 STATIC_MODIFIER_NAME_brb_intervention_mod: "Interwencja w Wojnie Stuletniej"
 STATIC_MODIFIER_DESC_brb_intervention_mod: "Żołnierze, którzy walczyli w bagnie Wojny Stuletniej, wrócili, nauczywszy się sposobów wojny zarówno Francji, jak i Anglii."
 STATIC_MODIFIER_NAME_brb_somme_mod: "Miasta nad Sommą"
 STATIC_MODIFIER_DESC_brb_somme_mod: "Zdobywszy mury wzdłuż Sommy, armia książęca zatknęła trwały przyczółek na równinach Północnej Francji."
 STATIC_MODIFIER_NAME_brb_end_vassalage_mod: "Koniec wasalstwa francuskiego"
 STATIC_MODIFIER_DESC_brb_end_vassalage_mod: "Nad bramami, z których zdjęto herb króla francuskiego, powiewa teraz tylko sztandar księcia Brabancji."
 STATIC_MODIFIER_NAME_brb_form_netherlands_mod: "Wielkie Księstwo Niderlandów ukończone"
 STATIC_MODIFIER_DESC_brb_form_netherlands_mod: "Na dworze wielkiego księstwa, gdzie sztandary szlacheckie i flagi miejskie powiewają obok siebie, panowie i mieszczanie Niderlandów jednakowo świętują świt nowej epoki."
