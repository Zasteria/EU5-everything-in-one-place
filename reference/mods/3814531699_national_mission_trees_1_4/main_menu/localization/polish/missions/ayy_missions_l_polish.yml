l_polish:
 ayy_ayyubid_mission_pack: "Nowy Saladyn i pan Bliskiego Wschodu"
 ayy_ayyubid_mission_pack_DESCRIPTION:0 "W 1337 roku dynastia Ajjubidów przetrwa małym państwem w Północnej Syrii. Przywróć chwałę Saladyna (1138-1193), który zjednoczył Egipt, Syrię i Mezopotamię i wypędził krzyżowców z Jerozolimy. Podbij Egipt, wyzwól Jerozolimę, zajmij Bagdad i zostań strażnikiem Mekki i Medyny, by rządzić Nowym Saladynem."
 ayy_ayyubid_mission_pack_CRITERIA_DESCRIPTION:0 "Podbij Egipt, Lewant, Mezopotamię i Arabię i rządź panem Bliskiego Wschodu jako strażnik sunnickiego islamu."
 ayy_ayyubid_mission_pack_BUTTON_TOOLTIP:0 "Rządź Nowym Saladynem nad Bliskim Wschodem."
 ayy_ayyubid_mission_pack_BUTTON_DETAILS:0 "Od małego państwa w Północnej Syrii rozgrom krzyżowców, odzyskaj Jerozolimę i wznieś wielkie imperium bliskowschodnie!"
 ayy_rise_of_ayyubids: "Wzrost Ajjubidów"
 ayy_rise_of_ayyubids_desc: "Dynastia Ajjubidów, dziedzice Saladyna, rozpoczyna swą odbudowę od małego państwa w Północnej Syrii."
 ayy_secure_sinai: "Zabezpiecz Synaj"
 ayy_secure_sinai_desc: "Zabezpiecz Półwysep Synaj bramą między Egiptem a Lewantem."
 ayy_conquer_lower_egypt: "Podbój Dolnego Egiptu"
 ayy_conquer_lower_egypt_desc: "Podbij deltę Nilu i Aleksandrię, by zająć bogate serce Egiptu."
 ayy_seize_cairo: "Zajmij Kair"
 ayy_seize_cairo_desc: "Zajmij Kair — miasto tysiąca minaretów — stolicą Ajjubidów."
 ayy_upper_egypt: "Podbój Górnego Egiptu"
 ayy_upper_egypt_desc: "Podbij Górny Egipt aż po katarakty Asuanu i dopełnij panowanie nad Nilem."
 ayy_nile_breadbasket: "Spichlerz Nilu"
 ayy_nile_breadbasket_desc: "Wykorzystaj żyzne równiny zalewowe Nilu, by karmić imperium."
 ayy_dev_cairo: "Zbuduj imperialną stolicę Kair"
 ayy_dev_cairo_desc: "Odbuduj Kair największym miastem świata islamskiego — imperialną stolicą Imperium Ajjubidów."
 ayy_secure_levant: "Zabezpiecz Lewant"
 ayy_secure_levant_desc: "Zabezpiecz Lewant wokół Damaszku i wypędź krzyżowców."
 ayy_seize_aleppo: "Zajmij Aleppo"
 ayy_seize_aleppo_desc: "Zajmij Aleppo — koronę Północnej Syrii."
 ayy_reclaim_jerusalem: "Odzyskaj Jerozolimę"
 ayy_reclaim_jerusalem_desc: "Odzyskaj Jerozolimę od krzyżowców, jak niegdyś uczynił Saladyn w 1187 roku."
 ayy_coastal_levant: "Przybrzeżny Lewant"
 ayy_coastal_levant_desc: "Zajmij śródziemnomorskie miasta przybrzeżne Lewantu, by opanować handel morski."
 ayy_antioch: "Podporządkuj Antiochię"
 ayy_antioch_desc: "Podporządkuj starożytne wielkie miasto Antiochię, by rozszerzyć wpływ północny."
 ayy_jazira: "Niezależność od Ilchanatu"
 ayy_jazira_desc: "Region Dżazira między Tygrysem a Eufratem wpadł pod wpływ mongolski Ilchanatu. Przywiedź tę bogatą ziemię pod kontrolę ajjubidzką lub wasalną i uwolnij się od jarzma mongolskiego. Wyniesienie do księstwa podniesie legitymizację ajjubidzką."
 ayy_kurdish_highlands: "Wyżyny kurdyjskie"
 ayy_kurdish_highlands_desc: "Włącz kurdyjskie plemiona górskie — własny lud Saladyna — do armii ajjubidzkiej."
 ayy_iraq_arabi: "Podbój Iraku Arabskiego"
 ayy_iraq_arabi_desc: "Podbij Irak Arabski, by opanować mezopotamskie serce."
 ayy_seize_baghdad: "Zajmij Bagdad"
 ayy_seize_baghdad_desc: "Zajmij Bagdad — miasto pokoju — i ogłoś zwierzchność ajjubidzką."
 ayy_mesopotamia_trade: "Handel mezopotamski"
 ayy_mesopotamia_trade_desc: "Opanuj mezopotamską sieć handlową wokół Bagdadu."
 ayy_hejaz: "Posunięcie do Hidżazu"
 ayy_hejaz_desc: "Posuń się do Hidżazu i zbliż się do świętych miast Mekki i Medyny."
 ayy_holy_cities: "Strażnik Świętych Miast"
 ayy_holy_cities_desc: "Zostań strażnikiem dwóch Świętych Miast — Mekki i Medyny."
 ayy_north_yemen: "Północny Jemen"
 ayy_north_yemen_desc: "Podbij Północny Jemen i zyskaj dostęp do handlu czerwonomorskiego."
 ayy_south_yemen: "Zajmij port Aden"
 ayy_south_yemen_desc: "Zajmij port Aden — bramę do Morza Arabskiego."
 ayy_arabian_trade: "Arabski handel morski"
 ayy_arabian_trade_desc: "Zmonopolizuj arabskie szlaki handlowe, łączące Ocean Indyjski ze Morzem Śródziemnym."
 ayy_madrasa: "Wznieś medresę"
 ayy_madrasa_desc: "Wznieś medresy po całym imperium, by odrodzić naukę islamską."
 ayy_crusader_wars: "Święta wojna przeciw krzyżowcom"
 ayy_crusader_wars_desc: "Prowadź świętą wojnę przeciw krzyżowcom, by wykuć armię ajjubidzką w elitarnych wojowników."
 ayy_dev_damascus: "Dobrobyt Damaszku"
 ayy_dev_damascus_desc: "Rozwiń Damaszek — ziemski raj — stolicą kulturalną Ajjubidów."
 ayy_spice_trade: "Handel przyprawami"
 ayy_spice_trade_desc: "Zmonopolizuj handel przyprawami od Oceanu Indyjskiego przez Aden na rynki europejskie."
 ayy_silk_road_control: "Opanuj Jedwabny Szlak"
 ayy_silk_road_control_desc: "Opanuj Jedwabny Szlak przez Bagdad, by opanować handel lądowy Wschód-Zachód."
 ayy_kurdish_cavalry: "Elita kawalerii kurdyjskiej"
 ayy_kurdish_cavalry_desc: "Wykuj kawalerię kurdyjską w najlepszą siłę bojową Ajjubidów."
 ayy_nile_fleet: "Flota Nilu"
 ayy_nile_fleet_desc: "Zbuduj flotę na Nilu i Morzu Śródziemnym, by przeciąć linie zaopatrzenia krzyżowców."
 ayy_defeat_crusaders: "Rozgrom krzyżowców"
 ayy_defeat_crusaders_desc: "Powtórz zniszczenie przez Saladyna wojska krzyżowego pod Hittin."
 ayy_egypt_navy: "Egipska siła morska"
 ayy_egypt_navy_desc: "Zbuduj potężną egipską siłę morską, by opanować Morze Śródziemne i Czerwone."
 ayy_sugar_egypt: "Cukier Egiptu"
 ayy_sugar_egypt_desc: "Zmonopolizuj produkcję cukru Egiptu — słodkie złoto średniowiecznego handlu."
 ayy_iraq_ajam: "Posunięcie do Iraku Adżamskiego"
 ayy_iraq_ajam_desc: "Posuń się do Iraku Adżamskiego, by rozszerzyć wpływ ajjubidzki w Persji."
 ayy_build_mosques: "Wznieś meczety wszędzie"
 ayy_build_mosques_desc: "Wznieś meczety po całym imperium, by zjednoczyć wszystkich poddanych pod sunnickim islamem."
 ayy_sultan_of_egypt_syria: "Sułtan Egiptu i Syrii"
 ayy_sultan_of_egypt_syria_desc: "Ogłoś się sułtanem Egiptu, Syrii, Iraku i Hidżazu — panem Bliskiego Wschodu."
 ayy_new_saladin: "Nowy Saladyn"
 ayy_new_saladin_desc: "Rządź Nowym Saladynem — panem Bliskiego Wschodu, dziedzicem dziedzictwa Saladyna."
 ayy_events.1.t: "Wzrost Ajjubidów — przysięga Saladyna"
 ayy_events.1.d: "W imię Boga — w 1337 roku dynastia Ajjubidów przetrwa małym państwem, lecz duch Saladyna płynie w jej żyłach. Pamięć bitwy pod Hittin (1187) i wyzwolenia Jerozolimy porusza ajjubidzkiego sułtana. Podbij Egipt, wyzwól święte miasto, broń Mekki — zostań Nowym Saladynem, panem Bliskiego Wschodu."
 ayy_events.1.a: "Na drodze Boga — powstań, Ajjubidzi!"
 ayy_events.10.t: "Wyzwolenie Jerozolimy — święte miasto wraca do islamu"
 ayy_events.10.d: "Allahu akbar! — wielki czyn Saladyna z 1187 roku się powtórzył. Jerozolima wróciła w ręce muzułmańskie. Kopuła na Skale i Święty Meczet znów rozbrzmiewają modlitwą islamską. Świat islamski się raduje."
 ayy_events.10.a: "Chwała Jerozolimie! W imię Boga!"
 ayy_events.20.t: "Wjazd do Bagdadu — ku sercu świata islamskiego"
 ayy_events.20.d: "Miasto pokoju, Bagdad — siły ajjubidzkie wkroczyły do miasta, gdzie niegdyś rządzili kalifowie Abbasydzi. Ludzie wołają: „Przybył dziedzic Saladyna!” Kultura i nauka Bagdadu prosperują pod ajjubidzkim mecenatem."
 ayy_events.20.a: "Chwała Bagdadowi! Chwała chwale islamu!"
 ayy_events.30.t: "Strażnik dwóch Świętych Miast — broń Mekki i Medyny"
 ayy_events.30.d: "Mekka i Medyna — święte miejsca proroka Mahometa — wpadły pod ochronę ajjubidzką. „Chadim al-Haramajn asz-Szarifajn” — ten tytuł nadawany jest sułtanowi ajjubidzkiemu i uznany przez cały świat islamski."
 ayy_events.30.a: "Jako strażnik dwóch Świętych Miast — w imię Boga!"
 ayy_events.60.t: "Sułtan Egiptu i Syrii — pan Bliskiego Wschodu"
 ayy_events.60.d: "Ogłoszone na dworze w Kairze — „Sułtan Egiptu, Syrii, Iraku i Hidżazu, pan dynastii Ajjubidów”. Jerozolima, Bagdad, Mekka i Kair wszystkie zjednoczone pod sztandarem Ajjubidów. Marzenie od czasów Saladyna spełnione."
 ayy_events.60.a: "Chwała sułtanowi! Chwała Ajjubidom!"
 ayy_events.99.t: "Nowy Saladyn — wieczny pan Bliskiego Wschodu"
 ayy_events.99.d: "„Salah ad-Din Ajjubi — prawość wiary, pan Bliskiego Wschodu” — ten tytuł wpisany w historię. Od Nilu w Egipcie po Tygrys w Mezopotamii, od pustyni arabskiej po góry anatolijskie — wszystkie ziemie zjednoczone pod sztandarem Ajjubidów."
 ayy_events.99.a: "Chwała Nowemu Saladynowi! Chwała Imperium Ajjubidów!"
 STATIC_MODIFIER_NAME_ayy_sinai_mod: "Synaj"
 STATIC_MODIFIER_DESC_ayy_sinai_mod: "Półwysep Synaj zabezpieczony, otwierając bramę między Egiptem a Lewantem."
 STATIC_MODIFIER_NAME_ayy_lower_egypt_mod: "Dolny Egipt"
 STATIC_MODIFIER_DESC_ayy_lower_egypt_mod: "Delta Nilu i Aleksandria podbite — bogate serce Egiptu zabezpieczone."
 STATIC_MODIFIER_NAME_ayy_cairo_mod: "Kair"
 STATIC_MODIFIER_DESC_ayy_cairo_mod: "Kair — miasto tysiąca minaretów — zajęty stolicą ajjubidzką."
 STATIC_MODIFIER_NAME_ayy_upper_egypt_mod: "Górny Egipt"
 STATIC_MODIFIER_DESC_ayy_upper_egypt_mod: "Górny Egipt aż po Asuan podbity, dopełniając panowanie nad Nilem."
 STATIC_MODIFIER_NAME_ayy_nile_mod: "Nil"
 STATIC_MODIFIER_DESC_ayy_nile_mod: "Na czarnym mule, niesionym przez powódź Nilu, chłopi czekają sezonu, gdy kłosy pszenicy zakołyszą się na wietrze."
 STATIC_MODIFIER_NAME_ayy_cairo_great_mod: "Wielki Kair"
 STATIC_MODIFIER_DESC_ayy_cairo_great_mod: "Kair staje się największym miastem świata islamskiego — stolicą imperialną."
 STATIC_MODIFIER_NAME_ayy_aleppo_mod: "Aleppo"
 STATIC_MODIFIER_DESC_ayy_aleppo_mod: "Aleppo — korona Północnej Syrii — zajęte, by opanować region."
 STATIC_MODIFIER_NAME_ayy_coastal_mod: "Region przybrzeżny"
 STATIC_MODIFIER_DESC_ayy_coastal_mod: "Śródziemnomorskie miasta przybrzeżne Lewantu zajęte, opanowując handel morski."
 STATIC_MODIFIER_NAME_ayy_antioch_mod: "Antiochia"
 STATIC_MODIFIER_DESC_ayy_antioch_mod: "Starożytne miasto Antiochia podporządkowane, rozszerzając wpływ północny."
 STATIC_MODIFIER_NAME_ayy_jazira_mod: "Niezależność od Ilchanatu"
 STATIC_MODIFIER_DESC_ayy_jazira_mod: "Wpływ Ilchanatu wypędzony — księstwo ajjubidzkie uznane przez społeczność międzynarodową."
 STATIC_MODIFIER_NAME_ayy_kurdish_mod: "Kurdowie"
 STATIC_MODIFIER_DESC_ayy_kurdish_mod: "Kurdyjskie plemiona górskie — własny lud Saladyna — włączone do armii ajjubidzkiej."
 STATIC_MODIFIER_NAME_ayy_iraq_mod: "Irak"
 STATIC_MODIFIER_DESC_ayy_iraq_mod: "Irak Arabski podbity, opanowując mezopotamskie serce."
 STATIC_MODIFIER_NAME_ayy_mesopotamia_trade_mod: "Handel mezopotamski"
 STATIC_MODIFIER_DESC_ayy_mesopotamia_trade_mod: "Mezopotamska sieć handlowa wokół Bagdadu opanowana."
 STATIC_MODIFIER_NAME_ayy_hejaz_mod: "Hidżaz"
 STATIC_MODIFIER_DESC_ayy_hejaz_mod: "Wzdłuż piaszczystych szlaków Hidżazu karawany pielgrzymów idą do Mekki i Medyny pod czujnymi sztandarami Ajjubidów."
 STATIC_MODIFIER_NAME_ayy_yemen_mod: "Jemen"
 STATIC_MODIFIER_DESC_ayy_yemen_mod: "Północny Jemen podbity, zyskując dostęp do handlu czerwonomorskiego."
 STATIC_MODIFIER_NAME_ayy_aden_mod: "Aden"
 STATIC_MODIFIER_DESC_ayy_aden_mod: "Port Aden — brama do Morza Arabskiego — wpada pod kontrolę ajjubidzką."
 STATIC_MODIFIER_NAME_ayy_arabian_trade_mod: "Handel arabski"
 STATIC_MODIFIER_DESC_ayy_arabian_trade_mod: "Arabskie szlaki handlowe, łączące Ocean Indyjski ze Morzem Śródziemnym, zmonopolizowane."
 STATIC_MODIFIER_NAME_ayy_madrasa_mod: "Medresa"
 STATIC_MODIFIER_DESC_ayy_madrasa_mod: "Medresy po całym imperium odradzają naukę i prawoznawstwo islamskie."
 STATIC_MODIFIER_NAME_ayy_jihad_mod: "Dżihad"
 STATIC_MODIFIER_DESC_ayy_jihad_mod: "Święta wojna przeciw krzyżowcom wykuwa armię ajjubidzką w elitarnych wojowników."
 STATIC_MODIFIER_NAME_ayy_damascus_dev_mod: "Damaszek rozwinięty"
 STATIC_MODIFIER_DESC_ayy_damascus_dev_mod: "Damaszek rozwinięty ważnym węzłem handlowym i kulturalnym."
 STATIC_MODIFIER_NAME_ayy_spice_mod: "Przyprawy"
 STATIC_MODIFIER_DESC_ayy_spice_mod: "Handel przyprawami od Oceanu Indyjskiego przez Aden do Europy zmonopolizowany."
 STATIC_MODIFIER_NAME_ayy_silk_mod: "Jedwab"
 STATIC_MODIFIER_DESC_ayy_silk_mod: "Jedwabny Szlak przez Bagdad opanowany, dominując nad handlem lądowym Wschód-Zachód."
 STATIC_MODIFIER_NAME_ayy_cavalry_mod: "Kawaleria"
 STATIC_MODIFIER_DESC_ayy_cavalry_mod: "Kawaleria kurdyjska — elita Saladyna — wykuta w najlepszą siłę Ajjubidów."
 STATIC_MODIFIER_NAME_ayy_fleet_mod: "Flota"
 STATIC_MODIFIER_DESC_ayy_fleet_mod: "Flota na Nilu i Morzu Śródziemnym przecina linie zaopatrzenia krzyżowców."
 STATIC_MODIFIER_NAME_ayy_crusader_mod: "Krzyżowcy"
 STATIC_MODIFIER_DESC_ayy_crusader_mod: "Zniszczenie przez Saladyna wojska krzyżowego pod Hittin powtórzone — prestiż wzrósł gwałtownie."
 STATIC_MODIFIER_NAME_ayy_navy_mod: "Siła morska"
 STATIC_MODIFIER_DESC_ayy_navy_mod: "Potężna egipska siła morska dominuje nad Morzem Śródziemnym i Czerwonym."
 STATIC_MODIFIER_NAME_ayy_sugar_mod: "Cukier"
 STATIC_MODIFIER_DESC_ayy_sugar_mod: "Produkcja cukru Egiptu — słodkie złoto średniowiecznego handlu — zmonopolizowana."
 STATIC_MODIFIER_NAME_ayy_iraq_ajam_mod: "Irak Adżamski"
 STATIC_MODIFIER_DESC_ayy_iraq_ajam_mod: "Konie posłów ajjubidzkich widoczne są teraz raz po raz w górskich miastach Zachodniej Persji."
 STATIC_MODIFIER_NAME_ayy_mosque_mod: "Meczet"
 STATIC_MODIFIER_DESC_ayy_mosque_mod: "Meczety po całym imperium jednoczą wszystkich poddanych pod sunnickim islamem."
 STATIC_MODIFIER_NAME_ayy_sultan_mod: "Sułtan"
 STATIC_MODIFIER_DESC_ayy_sultan_mod: "Sułtan Egiptu, Syrii, Iraku i Hidżazu — pan Bliskiego Wschodu."
 STATIC_MODIFIER_NAME_ayy_saladin_mod: "Saladyn"
 STATIC_MODIFIER_DESC_ayy_saladin_mod: "Nowy Saladyn rządzi — pan Bliskiego Wschodu, dziedzic dziedzictwa Saladyna."
 STATIC_MODIFIER_NAME_ayy_rise_mod: "Wzrost Ajjubidów"
 STATIC_MODIFIER_DESC_ayy_rise_mod: "Z imieniem Saladyna na ustach wojownicy plemion zbierają się jeden po drugim pod sztandarami."
 ayy_mamluk_rivalry: "Konfrontacja z Mamelukami"
 ayy_mamluk_rivalry_desc: "Sułtanat Mameluków — pierwotnie tureccy niewolnicy-żołnierze, wyniesieni przez Ajjubidów, którzy obalili dynastię w 1250 roku — to nasi zaprzysiężeni wrogowie. Powstrzymaj Mameluków i ustanów roszczenie do Aleppo przyczółkiem do odzyskania Syrii."
 STATIC_MODIFIER_NAME_ayy_baghdad_city_mod: "Miasto kalifa"
 STATIC_MODIFIER_DESC_ayy_baghdad_city_mod: "Bagdad odrodzony centrum handlu i kultury cywilizacji islamskiej."
 STATIC_MODIFIER_NAME_ayy_levant_control_mod: "Kontrola nad Lewantem ustanowiona"
 STATIC_MODIFIER_DESC_ayy_levant_control_mod: "Struktura administracyjna w Lewancie ustanowiona, poprawiając efektywność włączania i aneksji."
 STATIC_MODIFIER_NAME_ayy_holy_cities_mod: "Strażnik dwóch Świętych Miast"
 STATIC_MODIFIER_DESC_ayy_holy_cities_mod: "Sławiony strażnikiem Mekki i Medyny, dwór ajjubidzki przyciąga uczonych, prawników i nawróconych z całego świata."
 STATIC_MODIFIER_NAME_ayy_jerusalem_mod: "Święta wojna o wyzwolenie Jerozolimy"
 STATIC_MODIFIER_DESC_ayy_jerusalem_mod: "Chwała wyzwolenia Jerozolimy daje siłom ajjubidzkim stałą przewagę w walce przeciw innym wiarom."
