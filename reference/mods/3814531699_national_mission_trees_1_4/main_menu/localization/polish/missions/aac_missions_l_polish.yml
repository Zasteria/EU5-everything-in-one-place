l_polish:
 aac_carolingian_legacy_mission_pack: "Dziedzictwo Karolingów — odbudowa Królestwa Franków"
 aac_carolingian_legacy_mission_pack_DESCRIPTION:0 "W 1337 roku Akwizgran jest wolnym miastem w Świętym Cesarstwie Rzymskim, którego burmistrz jest potomkiem dynastii Karolingów. Z tego miasta, niegdyś domu dworu Karola Wielkiego (742–814), odzyskaj chwałę Królestwa Franków. Zjednocz Ren, Galię i Flandrię i panuj jako „Cesarz Zachodu” z koronacją papieską."
 aac_carolingian_legacy_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Akwizgran zjednocz Ren, Galię i Włochy, by odbudować Zachodnie Cesarstwo Rzymskie."
 aac_carolingian_legacy_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by odbudować Królestwo Franków."
 aac_carolingian_legacy_mission_pack_BUTTON_DETAILS:0 "Od tronu Karola Wielkiego do Zachodniego Cesarstwa Rzymskiego!"
 aac_throne_of_charlemagne: "Tron Karola Wielkiego"
 aac_throne_of_charlemagne_desc: "Katedra w Akwizgranie — zbudowana na rozkaz Karola Wielkiego i miejsce jego koronacji na Cesarza Zachodniorzymskiego w 800 roku — wróciła w ręce karolińskie. Rządź Akwizgranem, niegdyś centrum cywilizacji zachodniej, i uczyń pierwszy krok ku odbudowie Królestwa Franków."
 aac_control_rhineland: "Opanuj Ren"
 aac_control_rhineland_desc: "Kolonia, Trewir, Moguncja — trzy wielkie miasta arcybiskupie wzdłuż Renu były centrum gospodarczym, religijnym i politycznym Królestwa Franków. Zdobycie ich zwraca cały Ren w ręce karolińskie."
 aac_integrate_lorraine: "Włącz Lotaryngię"
 aac_integrate_lorraine_desc: "Lotaryngia (Lotharingia) narodziła się jako strefa środkowa, gdy Traktat z Verdun (843) podzielił Cesarstwo Franków między wnuków Karola Wielkiego. Odzyskanie Metz i Verdun ponownie włącza rdzeń Cesarstwa Franków, jakim był przed podziałem."
 aac_conquer_hre: "Pan Świętego Cesarstwa Rzymskiego"
 aac_conquer_hre_desc: "Akwizgran był niegdyś miejscem koronacji cesarzy Świętego Cesarstwa Rzymskiego. Stając jako pan Cesarstwa, dziedzictwo imperialne Karola Wielkiego zostaje zgłoszone najprawowiciej."
 aac_control_flanders: "Opanuj Flandrię"
 aac_control_flanders_desc: "Flandria jest centrum największego przemysłu tekstylnego wełnianego Europy. Zdobądź Brukselę i Liège i wykorzystaj bogatą potęgę handlową i przemysłową Flandrii, by odbudować Królestwo Franków."
 aac_brabant_trade: "Handel Brabancji"
 aac_brabant_trade_desc: "Największa sieć handlowa w Niderlandach rozprzestrzenia się z miasta handlowego Bruksela w Księstwie Brabancji. Kontrola nad tą siecią handlową dramatycznie wzmacnia podstawy finansowe Królestwa Franków."
 aac_push_into_france: "Marsz na Paryż"
 aac_push_into_france_desc: "Karol Wielki rządził całą Galią, w tym Paryżem, jako król Franków. Odzyskanie Paryża mści dynastię Valois i wskrzesza karolińskie rządy galijskie."
 aac_conquer_northern_france: "Podbij Północną Francję"
 aac_conquer_northern_france_desc: "Reims jest miejscem koronacji Królestwa Franków — kontynuując tradycję Chlodwiga I, ochrzczonego tutaj, podporządkuj Normandię i Pikardię, by ustanowić pełną dominację nad północną Galią."
 aac_conquer_burgundy: "Podbij Burgundię"
 aac_conquer_burgundy_desc: "Burgundia odgrywała ważną rolę w Cesarstwie Franków jako ziemia bogata w wino i rolnictwo. Jej podporządkowanie otwiera drogę do południowej Francji."
 aac_conquer_southern_france: "Podbij Południową Francję"
 aac_conquer_southern_france_desc: "Podporządkuj Langwedocję i Gaskonię, a południowa Galia wraca w ręce karolińskie. Rozszerzenie królestwa aż po Pireneje urzeczywistnia pełną dominację nad Galią, do której dążył Karol Wielki."
 aac_reunite_gaul: "Zjednocz Galię"
 aac_reunite_gaul_desc: "Cała Galia — ziemie niegdyś rządzone przez Karola Wielkiego — zjednoczona pod sztandarem Królestwa Franków. Cesarstwo, podzielone na trzy przez Traktat z Verdun, jest zjednoczone po raz pierwszy od 500 lat."
 aac_develop_aachen: "Rozwiń Akwizgran"
 aac_develop_aachen_desc: "Rozwiń to starożytne miasto, skupione wokół Katedry w Akwizgranie, i spraw, by działało jako nowa stolica Cesarstwa Franków. Z tego miejsca, gdzie przebywa dziedzictwo Karola Wielkiego, światło promieniuje ku odbudowie Europy Zachodniej."
 aac_frankish_law: "Kodeks praw frankijskich"
 aac_frankish_law_desc: "Karol Wielki rozwinął system prawny Cesarstwa Franków przez Kapitularze (zbiór dekretów). Kontynuowanie tej tradycji i ustanowienie nowego Kodeksu Praw Frankijskich kładzie podstawę prawną Cesarstwa."
 aac_missi_dominici: "Missi Dominici"
 aac_missi_dominici_desc: "System Missi Dominici (posłańców pana), ustanowiony przez Karola Wielkiego — przedstawiciele królewscy, wysyłani po całym Cesarstwie, by nadzorować lokalne rządy. Wskrzeszenie tego systemu umożliwia scentralizowane rządzenie rozległym imperium."
 aac_carolingian_renaissance: "Renesans karoliński"
 aac_carolingian_renaissance_desc: "Karol Wielki promował „Renesans karoliński”, zapraszając uczonych takich jak Alkuin i Einhard. Odrodź dwór akwizgrański jako centrum kultury i nauki i poprowadź odbudowę cywilizacji zachodniej."
 aac_trade_empire: "Imperium handlowe"
 aac_trade_empire_desc: "Cesarstwo Franków, dominujące nad szlakami handlowymi Renu, Mozy i Skaldy, staje się największym narodem handlowym Europy Zachodniej. Ustanów zwierzchność handlową z wieloma centrami rynkowymi i bogatym dochodem."
 aac_frankish_levy: "Frankijski system pospolitego ruszenia"
 aac_frankish_levy_desc: "Armia frankijska Karola Wielkiego była najsilniejsza w Europie. Wskrześ system pospolitego ruszenia (system hosta) i odbuduj potęgę wojskową Cesarstwa Franków szeroką organizacją wojskową od żołnierzy-chłopów po rycerzy."
 aac_palatine_guard: "Gwardia Pałacowa"
 aac_palatine_guard_desc: "Gwardia Pałacowa, chroniąca bok cesarza — elitarna siła, kontynuująca tradycję gwardii pałacowej Karola Wielkiego, uosabia chwałę wojskową Cesarstwa Franków."
 aac_carolingian_cavalry: "Kawaleria karolińska"
 aac_carolingian_cavalry_desc: "Sercem wojskowego sukcesu Karola Wielkiego była potężna kawaleria. Odbuduj legendarną siłę konną, w której ciężko opancerzeni rycerze (chevaliers) dominowali na polu bitwy i pokonali Sasów, Awarów i muzułmanów."
 aac_kingdom_of_franks: "Królestwo Franków odbudowane"
 aac_kingdom_of_franks_desc: "Galia zjednoczona, Lotaryngia włączona, Missi Dominici ustanowieni — trzy filary się zbiegają, a Królestwo Franków jest wreszcie odbudowane. Po raz pierwszy od 800 roku sztandar karoliński powiewa od Renu po Pireneje."
 aac_papal_alliance: "Sojusz papieski"
 aac_papal_alliance_desc: "W Boże Narodzenie 800 roku w Bazylice Świętego Piotra w Rzymie papież Leon III włożył koronę Cesarza Zachodniorzymskiego na Karola Wielkiego. Kontynuuj tę tradycję, zbuduj mocny sojusz z papieżem i ustanów legitymizację jako „przedstawiciela Boga”."
 aac_conquer_italy: "Podbij Włochy"
 aac_conquer_italy_desc: "Karol Wielki podbił Królestwo Longobardów w 774 roku i zdobył tytuł Króla Włoch. Zdobycie Rzymu dopełnia drogę do odrodzenia „Cesarza Zachodniorzymskiego” z aprobatą papieską."
 aac_western_roman_empire: "Odbudowa Zachodniego Cesarstwa Rzymskiego"
 aac_western_roman_empire_desc: "Akwizgran, Paryż, Rzym — trzy miasta Zachodniego Cesarstwa Rzymskiego zjednoczone pod sztandarem karolińskim. Cesarstwo, które Karol Wielki zbudował w 800 roku, odradza się w epoce nowożytnej, a „Renovatio Imperii Romani (Odbudowa Cesarstwa Rzymskiego)” jest spełnione."
 aac_alsace_swabia: "Alzacja i Szwabia"
 aac_alsace_swabia_desc: "Alzacja i Szwabia na wschodnim brzegu Renu są ważną częścią Cesarstwa Franków. Zdobycie tej ziemi, rozciągającej się od Wogezów po Alpy, dopełnia dominację nad Renem."
 aac_champagne_fairs: "Jarmarki szampańskie"
 aac_champagne_fairs_desc: "Okresowe jarmarki (foires) regionu Szampanii były największymi zgromadzeniami handlowymi Europy. Kontrola nad tym miejscem spotkań kupców włoskich, flamandzkich i niemieckich ustanawia frankijską zwierzchność handlową."
 aac_conquer_brittany: "Podbij Bretanię"
 aac_conquer_brittany_desc: "Bretania jest ziemią celtyckich Bretończyków — nawet Karol Wielki nie zdołał w pełni podporządkować tego upartego regionu. Podbicie tego zachodniego krańca przywodzi zachodnią Galię całkowicie pod kontrolę frankijską i zapewnia wyjście atlantyckie."
 aac_holy_crown: "Święta Korona"
 aac_holy_crown_desc: "Głębokie zaufanie z papiestwem i wysoka legitymizacja — jako „wikariusz Chrystusa” papież zatwierdza władzę króla Franków. Rządy uznane zarówno przez Boga, jak i człowieka ustanowione."
 aac_dev_reims: "Rozwiń Reims"
 aac_dev_reims_desc: "Reims jest miejscem chrztu narodu Franków — Chlodwig I przyjął tu chrzest chrześcijański, a francuskie koronacje odbywają się tu od tego czasu. Dalszy rozwój tego świętego miasta wzmacnia legitymizację karolińską."
 aac_dev_paris: "Rozwiń Paryż"
 aac_dev_paris_desc: "Paryż, skupiony na wyspie na Sekwanie (Île de la Cité), jest największym miastem Galii. Rozwinięcie go jako zachodniej stolicy Cesarstwa Franków tworzy system dwóch stolic, Akwizgranu i Paryża, wspierający Cesarstwo Franków."
 aac_bretagne_fleet: "Flota bretońska"
 aac_bretagne_fleet_desc: "Tradycje morskie Bretanii i Flandrii łączą się, tak że Cesarstwo Franków posiada teraz potężną flotę, kontrolującą zarówno Atlantyk, jak i Morze Północne."
 aac_events.20.t: "Paryż upada — powrót Karolingów"
 aac_events.20.d: "Sztandar Valois zdjęty z murów Paryża, zastąpiony orłem Królestwa Franków. Gdy dzwony Notre-Dame biją, potomek karolińskiego burmistrza wkracza do Paryża. „Dziedzic Karola Wielkiego wrócił” — tak napiszą historycy."
 aac_events.20.a: "Niech żyje Paryż! Wznieś wysoko sztandar karoliński!"
 aac_events.40.t: "Galia zjednoczona — powrót króla Franków"
 aac_events.40.d: "Od Renu po Pireneje, od Flandrii po Prowansję — cała Galia zjednoczona pod sztandarem Królestwa Franków. Cesarstwo, podzielone na trzy przez Traktat z Verdun w 843 roku, zjednoczone po 500 latach. „Dieu le veut (Bóg tak chce)” — ludzie, zebrani w katedrze, wołają."
 aac_events.40.a: "Niech żyje Galia! Królestwo Franków jest wieczne!"
 aac_events.50.t: "Proklamacja odbudowy Królestwa Franków"
 aac_events.50.d: "Galia zjednoczona, Lotaryngia włączona, Missi Dominici ustanowieni — trzy filary Królestwa Franków ukończone. Koronacja króla Franków odbywa się w Katedrze w Akwizgranie i po raz pierwszy od Karola Wielkiego rodzi się Cesarz Franków. „W imię Carolus Magnus Rex Francorum (Karola Wielkiego, króla Franków) ogłaszamy Cesarstwo”."
 aac_events.50.a: "Niech żyje Królestwo Franków! Chwała karolińska odrodzona — zabarwmy nasze barwy na błękit Francji!"
 aac_events.99.t: "Odbudowa Zachodniego Cesarstwa Rzymskiego"
 aac_events.99.d: "Akwizgran, Paryż, Rzym — trzy miasta zjednoczone pod sztandarem karolińskim. Legendarna chwila, gdy papież Leon III włożył koronę na Karola Wielkiego w Boże Narodzenie 800 roku, odtworzona w epoce nowożytnej. „Renovatio Imperii Romani” — te słowa na wieki wyryte w historii. Czy zmienisz barwę Cesarstwa na karmazyn karoliński?"
 STATIC_MODIFIER_NAME_aac_rhineland_mod: "Opanowanie Renu"
 STATIC_MODIFIER_DESC_aac_rhineland_mod: "Trzy wielkie miasta arcybiskupie wzdłuż Renu zdobyte — gospodarcze i religijne centrum Cesarstwa Franków odrodzone."
 STATIC_MODIFIER_NAME_aac_lorraine_mod: "Lotaryngia włączona"
 STATIC_MODIFIER_DESC_aac_lorraine_mod: "Lotaryngia, podzielona przez Traktat z Verdun, ponownie włączona. Symbol frankijskiego podziału imperialnego rozwiązany."
 STATIC_MODIFIER_NAME_aac_hre_master_mod: "Pan Świętego Cesarstwa Rzymskiego"
 STATIC_MODIFIER_DESC_aac_hre_master_mod: "Jako pan Cesarstwa dziedzictwo imperialne Karola Wielkiego zgłoszone prawowicie."
 STATIC_MODIFIER_NAME_aac_flanders_mod: "Opanowanie Flandrii"
 STATIC_MODIFIER_DESC_aac_flanders_mod: "Największe centrum przemysłu tekstylnego wełnianego Europy, Flandria, wpada w ręce frankijskie."
 STATIC_MODIFIER_NAME_aac_brabant_mod: "Handel Brabancji"
 STATIC_MODIFIER_DESC_aac_brabant_mod: "Sieć handlowa Niderlandów wzbogaca finanse Królestwa Franków."
 STATIC_MODIFIER_NAME_aac_northern_france_mod: "Północna Francja podbita"
 STATIC_MODIFIER_DESC_aac_northern_france_mod: "Normandia i Pikardia podporządkowane — pełna dominacja nad północną Galią ustanowiona."
 STATIC_MODIFIER_NAME_aac_burgundy_mod: "Burgundia podbita"
 STATIC_MODIFIER_DESC_aac_burgundy_mod: "Bogata w wino Burgundia włączona do Królestwa Franków."
 STATIC_MODIFIER_NAME_aac_southern_france_mod: "Południowa Francja podbita"
 STATIC_MODIFIER_DESC_aac_southern_france_mod: "Langwedocja i Gaskonia podporządkowane — południowa Galia wraca w ręce karolińskie."
 STATIC_MODIFIER_NAME_aac_gaul_unified_mod: "Galia zjednoczona"
 STATIC_MODIFIER_DESC_aac_gaul_unified_mod: "Po raz pierwszy od 843 roku cała Galia zjednoczona pod sztandarem Królestwa Franków."
 STATIC_MODIFIER_NAME_aac_aachen_capital_mod: "Akwizgran — stolica imperialna"
 STATIC_MODIFIER_DESC_aac_aachen_capital_mod: "Miasto dworskie Karola Wielkiego, Akwizgran, rozwinięte jako stolica Cesarstwa Franków."
 STATIC_MODIFIER_NAME_aac_frankish_law_mod: "Kodeks praw frankijskich"
 STATIC_MODIFIER_DESC_aac_frankish_law_mod: "Kodeks praw frankijskich, kontynuujący tradycję Kapitularzy, kładzie podstawę prawną Cesarstwa."
 STATIC_MODIFIER_NAME_aac_missi_dominici_mod: "Missi Dominici"
 STATIC_MODIFIER_DESC_aac_missi_dominici_mod: "Posłańcy królewscy, wysyłani po całym Cesarstwie, nadzorują lokalne rządy — scentralizowane rządy urzeczywistnione."
 STATIC_MODIFIER_NAME_aac_renaissance_mod: "Renesans karoliński"
 STATIC_MODIFIER_DESC_aac_renaissance_mod: "Dwór akwizgrański odrodzony jako centrum nauki i kultury cywilizacji zachodniej."
 STATIC_MODIFIER_NAME_aac_trade_empire_mod: "Imperium handlowe"
 STATIC_MODIFIER_DESC_aac_trade_empire_mod: "Cesarstwo Franków, kontrolujące szlaki handlowe Ren-Moza-Skalda, staje się największym narodem handlowym Europy Zachodniej."
 STATIC_MODIFIER_NAME_aac_frankish_levy_mod: "Frankijski system pospolitego ruszenia"
 STATIC_MODIFIER_DESC_aac_frankish_levy_mod: "System hosta Karola Wielkiego wskrzeszony — potęga wojskowa Cesarstwa Franków odbudowana."
 STATIC_MODIFIER_NAME_aac_palatine_mod: "Gwardia Pałacowa"
 STATIC_MODIFIER_DESC_aac_palatine_mod: "Elitarna gwardia cesarza uosabia chwałę wojskową Cesarstwa Franków."
 STATIC_MODIFIER_NAME_aac_cavalry_mod: "Kawaleria karolińska"
 STATIC_MODIFIER_DESC_aac_cavalry_mod: "Ciężko opancerzeni rycerze dominują na polu bitwy frankijskim. Legendarna siła konna Karola Wielkiego odrodzona."
 STATIC_MODIFIER_NAME_aac_kingdom_of_franks_mod: "Królestwo Franków odbudowane"
 STATIC_MODIFIER_DESC_aac_kingdom_of_franks_mod: "Chwała roku 800 odrodzona w epoce nowożytnej. Karolińskie Królestwo Franków oficjalnie odbudowane."
 STATIC_MODIFIER_NAME_aac_papal_mod: "Sojusz papieski"
 STATIC_MODIFIER_DESC_aac_papal_mod: "Papież zatwierdza władzę króla Franków. Rządy uznane zarówno przez Boga, jak i człowieka ustanowione."
 STATIC_MODIFIER_NAME_aac_italy_mod: "Włochy podbite"
 STATIC_MODIFIER_DESC_aac_italy_mod: "Podbój Longobardów przez Karola Wielkiego odtworzony. Włochy, w tym Rzym, wpadają pod panowanie frankijskie."
 STATIC_MODIFIER_NAME_aac_western_roman_empire_final_mod: "Zachodnie Cesarstwo Rzymskie odbudowane"
 STATIC_MODIFIER_DESC_aac_western_roman_empire_final_mod: "Renovatio Imperii Romani spełnione. Akwizgran, Paryż i Rzym zjednoczone pod sztandarem karolińskim."
 STATIC_MODIFIER_NAME_aac_alsace_mod: "Alzacja i Szwabia"
 STATIC_MODIFIER_DESC_aac_alsace_mod: "Alzacja i Szwabia na wschodnim brzegu Renu włączone do Cesarstwa Franków."
 STATIC_MODIFIER_NAME_aac_champagne_mod: "Jarmarki szampańskie"
 STATIC_MODIFIER_DESC_aac_champagne_mod: "Największy jarmark okresowy Europy podtrzymuje frankijską zwierzchność handlową."
 STATIC_MODIFIER_NAME_aac_brittany_mod: "Bretania podbita"
 STATIC_MODIFIER_DESC_aac_brittany_mod: "Uparta celtycka ziemia bretońska podbita — wyjście atlantyckie zabezpieczone."
 STATIC_MODIFIER_NAME_aac_holy_crown_mod: "Święta Korona"
 STATIC_MODIFIER_DESC_aac_holy_crown_mod: "„Święta Korona”, zatwierdzona zarówno przez papieża, jak i Boga, jaśnieje nad królem Franków."
 STATIC_MODIFIER_NAME_aac_reims_mod: "Reims rozwinięty"
 STATIC_MODIFIER_DESC_aac_reims_mod: "Miejsce chrztu Franków Reims rozwinięte jako stolica religijna."
 STATIC_MODIFIER_NAME_aac_paris_mod: "Paryż rozwinięty"
 STATIC_MODIFIER_DESC_aac_paris_mod: "Największe miasto Galii Paryż rozwinięte jako zachodnia stolica Cesarstwa Franków."
 STATIC_MODIFIER_NAME_aac_fleet_mod: "Flota bretońska"
 STATIC_MODIFIER_DESC_aac_fleet_mod: "Tradycje morskie Bretanii i Flandrii łączą się — Cesarstwo Franków kontroluje zarówno Atlantyk, jak i Morze Północne."
 aac_aachen_megalopolis: "Akwizgran — największe miasto Europy Środkowej"
 aac_aachen_megalopolis_desc: "Miasto dworskie Karola Wielkiego, Akwizgran, jest wreszcie ukończone jako największa metropolia Europy Środkowej. Z populacją 200000, zaawansowanym rozwojem miejskim i wspaniałą architekturą Akwizgran ustanowiony jest centrum cywilizacji europejskiej."
 aac_events.10.t: "Tron Karola Wielkiego — przebudzenie karolińskie"
 aac_events.10.d: "Akwizgran — to miasto, gdzie Karol Wielki (742–814) niegdyś trzymał swój dwór i został koronowany na Cesarza Zachodniorzymskiego w 800 roku — wróciło w ręce karolińskie. Pod uroczystą kopułą Katedry w Akwizgranie marmurowy tron czeka na powrót swego pana.\n\nMarzenie Karola Wielkiego, zwanego „Ojcem Europy (Pater Europae)” — zjednoczone chrześcijańskie cesarstwo od Renu po Pireneje, od Rzymu po Bałtyk — nadszedł czas, by je urzeczywistnić. Ogłoś odbudowę karolińską i uczyń pierwszy krok ku odbudowie Królestwa Franków."
 aac_events.10.a: "Panować jako król dynastii karolińskiej — ogłosić monarchię"
 aac_events.10.b: "Czas jeszcze nie dojrzał — budować siłę pod obecnym systemem rządów"
 STATIC_MODIFIER_NAME_aac_aachen_megalopolis_mod: "Megalopolis Akwizgran"
 STATIC_MODIFIER_DESC_aac_aachen_megalopolis_mod: "Tak daleko, jak niosą się dzwony katedry, ulice są wypełnione domami rzemieślników, uczonych i kupców — Akwizgran stał się czołowym miastem Zachodu."
 aac_events.50.b: "Niech żyje Królestwo Franków! Chwała karolińska odrodzona — zachowajmy nasze tradycyjne barwy"
 aac_events.99.a: "Przyjąć nazwę i barwy Zachodniego Cesarstwa Rzymskiego (map_ROM) — ogłosić światu odrodzenie Rzymu"
