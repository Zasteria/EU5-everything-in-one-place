l_polish:
 por_portuguese_mission_pack: "Era Wielkich Odkryć — potęga morska Portugalii"
 por_portuguese_mission_pack_DESCRIPTION:0 "W 1337 roku Portugalia jest małym królestwem na zachodnim krańcu Półwyspu Iberyjskiego. Lecz wyprawy zorganizowane przez księcia Henryka Żeglarza (1394-1460) zmienią świat — Madera, Azory, Afryka Zachodnia, Przylądek Dobrej Nadziei, Indie, Malakka, Brazylia. Od Atlantyku po Ocean Indyjski wznieś „Estado da Índia”, gdzie portugalscy żeglarze rządzą morzami."
 por_portuguese_mission_pack_CRITERIA_DESCRIPTION:0 "Rozwiń metropolię, opłyń Afrykę, by dotrzeć do Oceanu Indyjskiego, skolonizuj Brazylię i rządź jako pan mórz."
 por_portuguese_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by urzeczywistnić imperium ery wielkich odkryć Portugalii."
 por_portuguese_mission_pack_BUTTON_DETAILS:0 "Od księcia Henryka Żeglarza do Portugalii Filipa II!"
 por_infante_henrique: "Tradycja morska Portugalii"
 por_infante_henrique_desc: "W 1337 roku Portugalia jest małym królestwem na zachodnim krańcu Półwyspu Iberyjskiego. Pod rządami Alfonsa IV Portugalia wsparła Kastylię w bitwie nad Rio Salado (1340) i odparła Merynidów jako potęga morska. To królestwo, zwrócone ku Atlantykowi, od dawna żywi pokrewieństwo z morzem. Port Lizbony, rybacy Algarve, wiatry atlantyckie — ta tradycja morska jest podstawą, która zrodzi nadchodzące pokolenie ery wielkich odkryć."
 por_dev_lisbon: "Rozwiń Lizbonę"
 por_dev_lisbon_desc: "Lizbona u ujścia Tagu obdarzona jest naturalnym portem. Rozwój tego miasta, założonego przez starożytnych Fenicjan, w stolicę imperium portugalskiego czyni je centrum handlu światowego."
 por_dev_porto: "Rozwiń Porto"
 por_dev_porto_desc: "Porto nad Douro to miasto wina i rybołówstwa. Rozwiń to starożytne miasto, które pożyczy swe imię nadchodzącym pokoleniom dla „Portugal (port Porto)”."
 por_university_coimbra: "Uniwersytet w Coimbrze"
 por_university_coimbra_desc: "Uniwersytet w Coimbrze, założony w 1290 roku — najstarszy w Portugalii — kształci żeglarzy, prawników i duchowieństwo. Wielu uczonych, którzy służyli księciu Henrykowi, uczyło się tutaj."
 por_lisbon_entrepot_nmt: "Lizbona jako węzeł handlowy"
 por_lisbon_entrepot_nmt_desc: "Rozwiń zarządzanie portowe Lizbony, by towary wschodnie były stąd dystrybuowane po całej Europie. Pieprz, przyprawy, jedwab — Lizbona staje się największym rynkiem przypraw Europy."
 por_avis_dynasty: "Umocnienie domu Avis"
 por_avis_dynasty_desc: "Dom Avis, który przetrwał kryzys dynastyczny 1385 roku — zwycięstwo Jana I ustanowiło dynastię portugalską ze stabilną podstawą rządów."
 por_ordenacoes_afonsinas: "Ordenações Afonsinas"
 por_ordenacoes_afonsinas_desc: "Ordenações Afonsinas, sporządzone w 1446 roku, są pierwszym systematycznym kodeksem praw Portugalii. Służąc jako wzór dla późniejszych kodeksów manuelińskich i filipińskich, ustanawiają tradycję prawną Portugalii."
 por_dev_evora: "Rozwiń Évorę"
 por_dev_evora_desc: "Évora, stolica regionu Alentejo — rozwiń to starożytne miasto, przechowujące rzymskie świątynie, centrum rolniczym i kulturalnym."
 por_algarve_fisheries: "Rybołówstwo Algarve"
 por_algarve_fisheries_desc: "Region Algarve na południu Portugalii graniczy z atlantyckimi łowiskami. Bogate łowiska dorsza, sardynek i tuńczyka karmią portugalskie pokrewieństwo z morzem, które stanie się podstawą ery wielkich odkryć."
 por_ceuta_gateway: "Ceuta — brama do Afryki"
 por_ceuta_gateway_desc: "W 1415 roku wojska Jana I podbiły Ceutę — początek zamorskiej ekspansji Portugalii. Tu książę Henryk otrzymał od kupców muzułmańskich informacje o szlakach saharyjskich, co karmiło jego ambicje, by płynąć na południe wzdłuż Afryki."
 por_conquer_tangier: "Podbij Tanger"
 por_conquer_tangier_desc: "Tanger, leżący naprzeciw Ceuty przez Cieśninę Gibraltarską — zwiększ presję na siły muzułmańskie Afryki Północnej i zabezpiecz wyjście atlantyckie."
 por_moroccan_fortress: "Twierdze marokańskie"
 por_moroccan_fortress_desc: "Poprzez panowanie nad marokańskimi miastami handlowymi, w tym Agadirem, opanuj końcowy punkt handlu transsaharyjskiego i zmonopolizuj zyski ze złota, kości słoniowej i soli."
 por_madeira_settlement: "Zasiedlenie Madery"
 por_madeira_settlement_desc: "Madera, osiągnięta przez Portugalczyków w 1419 roku, jest pierwszą kolonią atlantycką. Wprowadzenie cukru na tej niezamieszkanej wyspie ustanowiło model plantacji cukrowych, który później zostanie użyty w Brazylii i Indiach Zachodnich."
 por_azores_settlement: "Zasiedlenie Azorów"
 por_azores_settlement_desc: "Kolonizacja Azorów pośrodku Atlantyku zapewnia stację pośrednią na szlakach transatlantyckich. Wykorzystanie jej jako bazy pozwala na dalszą eksplorację na zachód."
 por_guinea_trade: "Handel z Gwineą"
 por_guinea_trade_desc: "Zatoka Gwinejska, osiągnięta przez Portugalczyków podczas ich żeglugi na południe wzdłuż wybrzeża zachodnioafrykańskiego — handel złotem, kością słoniową i później niewolnikami się rozpoczyna. Marzenie księcia Henryka staje się rzeczywistością."
 por_gold_coast: "Złote Wybrzeże"
 por_gold_coast_desc: "Elmina (1482) — pierwsza stała twierdza handlowa wzniesiona przez Portugalię w Afryce. Ogromne ilości złota płyną z tego „Złotego Wybrzeża” do Portugalii."
 por_sao_tome_sugar: "Cukier São Tomé"
 por_sao_tome_sugar_desc: "Wyspa São Tomé w pobliżu równika jest idealna dla plantacji cukrowych. Z pracą przymusową z kontynentu afrykańskiego São Tomé staje się największym dostawcą cukru do Europy."
 por_angola_colony: "Kolonia Angola"
 por_angola_colony_desc: "Angola, będąca kolejnym przyczółkiem po São Tomé, staje się ważną kolonią portugalską. Ustanów stosunki handlowe z Królestwem Konga i rozszerz wpływ w centralno-zachodniej Afryce."
 por_cape_of_good_hope: "Przylądek Dobrej Nadziei"
 por_cape_of_good_hope_desc: "W 1488 roku Bartolomeu Dias dotarł do południowego krańca Afryki, „Przylądka Burz”. Jan II przemianował go na „Przylądek Dobrej Nadziei” — bo droga do Indii była teraz otwarta."
 por_east_africa_trading_posts: "Placówki handlowe Afryki Wschodniej"
 por_east_africa_trading_posts_desc: "Mozambik, Sofala — zajęcie placówek handlu złotem i kością słoniową wybrzeża suahilijskiego osiąga wejście w sieć handlową Oceanu Indyjskiego."
 por_mombasa_fort: "Fort Mombasa"
 por_mombasa_fort_desc: "Mombasa i Malindi — podporządkowanie największych miast handlowych Afryki Wschodniej ustanawia kontrolę nad Oceanem Indyjskim. W 1498 roku Vasco da Gama otrzymał w Malindi wskazówki nawigacyjne do Indii."
 por_vasco_da_gama: "Vasco da Gama dociera do Indii"
 por_vasco_da_gama_desc: "20 maja 1498 roku Vasco da Gama wylądował w Kalikucie (Kozhikode). W tej chwili morski szlak między Europą a Azją się otworzył, a struktura handlu przyprawami, zmonopolizowanego przez kupców arabskich i Wenecję, radykalnie się zmieniła."
 por_conquer_goa: "Podbij Goa"
 por_conquer_goa_desc: "W 1510 roku Albuquerque podbił Goa — narodziny „wschodniej stolicy” Portugalii. Naturalny port Goa na zachodnim wybrzeżu Indii prosperuje jako centrum Estado da Índia (Portugalskich Indii)."
 por_malabar_trade: "Przyprawy Wybrzeża Malabarskiego"
 por_malabar_trade_desc: "Cochin, Kalikut, Quilon — Wybrzeże Malabarskie produkuje pieprz, kardamon i imbir. Poprzez monopolizację przypraw tutaj Portugalia dominuje nad europejskimi cenami przypraw."
 por_hormuz_control: "Opanuj Ormuz"
 por_hormuz_control_desc: "W 1515 roku Albuquerque podbił Ormuz przy wejściu do Zatoki Perskiej. Panowanie nad tym punktem oznacza dominację nad handlem perskim-indyjskim i przecięcie handlu świata islamskiego."
 por_conquer_malacca: "Podbij Malakkę"
 por_conquer_malacca_desc: "W lipcu 1511 roku Afonso de Albuquerque z 1200 portugalskimi żołnierzami podbił Malakkę — największe zwycięstwo strategiczne ery wielkich odkryć. Panowanie nad „szyją handlu wschodniego” zdobywa wszystkie szlaki handlowe przypraw, jedwabiu i porcelany."
 por_spice_monopoly: "Monopol na przyprawy"
 por_spice_monopoly_desc: "Z zabezpieczonymi Goa, Ormuzem i Malakką szlaki handlowe przypraw Oceanu Indyjskiego są całkowicie pod kontrolą portugalską. Pieprz, gałka muszkatołowa i goździki dostarczane są przez Lizbonę do Europy."
 por_indian_ocean_empire: "Imperium Oceanu Indyjskiego"
 por_indian_ocean_empire_desc: "Od Afryki Wschodniej po Malakkę portugalska flota dominuje nad Oceanem Indyjskim. Casa da Índia (Dom Indii) w Lizbonie zarządza całym handlem przyprawami, a ogromne bogactwo płynie do Portugalii."
 por_brazil_discovery: "Odkrycie Brazylii"
 por_brazil_discovery_desc: "22 kwietnia 1500 roku — w drodze do Indii z flotą 13 okrętów Pedro Álvares Cabral daleko odchylił się na zachód, by uniknąć burzy, i odkrył nieznaną ziemię. „Ilha de Vera Cruz (Wyspa Prawdziwego Krzyża)” — później nazwana „Brazylią” (od drzewa pau-brasil). Na mocy Traktatu z Tordesillas ta ziemia staje się portugalskim terytorium i później stanie się największą kolonią Portugalii."
 por_brazil_colony: "Skoloryzuj Brazylię"
 por_brazil_colony_desc: "W 1532 roku Martim Afonso de Sousa założył pierwszą stałą kolonię Brazylii, „São Vicente”. Rodzi się nowe społeczeństwo, w którym mieszają się portugalscy osadnicy i ludy tubylcze."
 por_brazil_sugar: "Przemysł cukrowy Brazylii"
 por_brazil_sugar_desc: "W połowie XVI wieku Brazylia stała się największym dostawcą cukru do Europy. Engenhos (młyny cukrowe) Pernambuco i Bahii pracują pracą przymusową z Afryki, produkując ogromne bogactwo."
 por_brazil_empire: "Imperium brazylijskie"
 por_brazil_empire_desc: "Bahia, Pernambuco, Rio de Janeiro — kolonie Brazylii urosły do skali imperialnej. Cukier, drewno brazylijskie i później złoto i klejnoty tworzą strumienie bogactwa do Portugalii."
 por_naval_supremacy: "Panowanie morskie"
 por_naval_supremacy_desc: "Portugalska flota, dominująca zarówno nad Atlantykiem, jak i Oceanem Indyjskim — zwrotność karaweli i siła ognia armat przewyższają arabskie, indyjskie i chińskie statki handlowe."
 por_caravel: "Karawela"
 por_caravel_desc: "Karawela, rozwinięta w epoce księcia Henryka — to mały, szybki statek z żaglami łacińskimi, zdolny do żeglugi pod wiatr, uczynił erę wielkich odkryć możliwą. Santa Maria również była karawelą."
 por_padroes: "Padrões (kamienne słupy)"
 por_padroes_desc: "Portugalscy odkrywcy wznosili w różnych miejscach Afryki kamienne słupy (padrões), niosące imię króla portugalskiego i krzyż chrześcijański. Było to oświadczeniem odkrycia i panowania — zasięg Portugalii, wykuty w kamieniu."
 por_royal_navy: "Flota królewska"
 por_royal_navy_desc: "Najsilniejsza flota świata wspiera portugalską zwierzchność — galeony, karaki i karawele chronią wszystko od Oceanu Indyjskiego po Brazylię."
 por_dev_setubal: "Rozwiń Setúbal"
 por_dev_setubal_desc: "Zatoka Setúbal na południe od Lizbony jest naturalnym portem. Rozwiń ją miastem portowym, uzupełniającym Lizbonę i produkującym sól, ryby i wino."
 por_order_of_christ: "Zakon Chrystusa"
 por_order_of_christ_desc: "Zakon Chrystusa (Ordem de Cristo), założony w 1319 roku — ten zakon wojskowy, ustanowiony w Portugalii jako dziedzic templariuszy, finansował wyprawy księcia Henryka. Szkarłatny krzyż zakonu był wyryty na żaglach portugalskich."
 por_treaty_tordesillas: "Traktat z Tordesillas"
 por_treaty_tordesillas_desc: "W 1494 roku Hiszpania i Portugalia za pośrednictwem papieża Aleksandra VI zawarły Traktat z Tordesillas — dzielący Atlantyk pionowo, zachód Hiszpanii, wschód Portugalii. Ten traktat potwierdził Brazylię jako terytorium portugalskie."
 por_colonial_administration: "Administracja kolonialna"
 por_colonial_administration_desc: "Aparat administracyjny do kierowania imperium Portugalii, obejmującym Afrykę, Indie i Brazylię — namiestnicy i wicekrólowie meldują królowi w Lizbonie i przesyłają dochody handlowe do metropolii."
 por_estado_da_india_nmt: "Estado da Índia"
 por_estado_da_india_nmt_desc: "„Estado da Índia (Państwo Indii)” — termin odnoszący się do całego imperium azjatyckiego Portugalii. Z Goa stolicą i panowaniem nad morskimi szlakami handlowymi od Afryki Wschodniej po Malakkę to „imperium” jest pierwszym prawdziwie globalnym imperium morskim historii."
 por_dev_tomar: "Rozwiń Tomar"
 por_dev_tomar_desc: "Tomar, główna rezydencja Zakonu Chrystusa — Klasztor Chrystusa (Convento de Cristo) uważany jest za najlepszy przykład portugalskiej architektury manuelińskiej. Rozwiń go środkami zakonu."
 por_wine_trade: "Portugalski handel winem"
 por_wine_trade_desc: "Wina doliny Douro — prototyp „porto” — ważny towar eksportowy do Anglii i Flandrii. Ustanów angielsko-portugalskie stosunki handlowe, wyprzedzające Traktat Methuena (1703)."
 por_dev_faro: "Rozwiń Faro"
 por_dev_faro_desc: "Faro, stolica regionu Algarve — włączona do Portugalii przez chrześcijańską Rekonkwistę w 1249 roku, rozwiń to południowe miasto węzłem rybołówstwa i handlu."
 por_cape_verde: "Wyspy Zielonego Przylądka"
 por_cape_verde_desc: "Wyspy Zielonego Przylądka, odkryte w 1456 roku, zajmują strategiczne położenie w połowie drogi między Afryką a Ameryką. Jako punkt przeładunkowy handlu transatlantyckiego staną się bazą zaopatrzenia dla późniejszej kolonizacji brazylijskiej."
 por_lisbon_megalopolis: "Lizbona — miasto światowe"
 por_lisbon_megalopolis_desc: "W XVI wieku Lizbona stała się jednym z największych miast Europy z populacją ponad 100000. Wschodnie przyprawy, afrykańskie złoto i brazylijski cukier zbiegają się tutaj, zyskując jej przydomek „stolicy świata”."
 por_casa_india: "Casa da Índia"
 por_casa_india_desc: "Casa da Índia (Dom Indii), założony w Lizbonie, zarządza handlem wschodnim Portugalii wyłącznie jako instytucja państwowa. Cały import przypraw przechodzi tu, rodząc ogromne dochody celne."
 por_brazil_wood: "Pau-brasil (drewno brazylijskie)"
 por_brazil_wood_desc: "Pau-brasil (drewno brazylijskie), od którego Brazylia wzięła swą nazwę — to czerwone drewno barwierskie wywożone jest w ogromnych ilościach, niezastąpiony towar dla europejskiego przemysłu farbiarskiego wełny. To pierwszy produkt handlu brazylijskiego."
 por_atlantic_domination: "Panowanie nad Atlantykiem"
 por_atlantic_domination_desc: "Od Lizbony po Azory, Maderę, Wyspy Zielonego Przylądka i Brazylię — Portugalia panuje nad całym Atlantykiem. Pokonawszy rywalizację z Hiszpanią, Portugalia rządzi głównym aktorem handlu atlantyckiego."
 por_empire_of_seas: "Pan mórz"
 por_empire_of_seas_desc: "„Portugalia — mały kraj, lecz rządzi połową świata” — słowa historyka się spełniają. Od Atlantyku po Ocean Indyjski, od Brazylii po Malakkę imperium Portugalii dominuje nad morzami świata. Estado da Índia ukończone."
 por_events.10.t: "Przylądek Dobrej Nadziei — droga do Indii się otwiera"
 por_events.10.d: "W 1488 roku flota Bartolomeu Diasa opłynęła południowy „Przylądek Burz” Afryki i dotarła do Oceanu Indyjskiego. Jan II zadrżał na tę wieść — piętnaście lat później Vasco da Gama otworzy bezpośrednią drogę do Indii. Era, gdy kupcy arabscy monopolizowali handel przyprawami, zbliża się ku końcowi."
 por_events.10.a: "Chwała Bogu i Portugalii! Droga do Indii otwarta!"
 por_events.20.t: "Vasco da Gama dociera do Indii"
 por_events.20.d: "20 maja 1498 roku — dziesięć miesięcy po wypłynięciu z Lizbony z czterema okrętami Vasco da Gama wylądował w Kalikucie. Miejscowy władca (zamorin) był nieufny, lecz Portugalia zapewniła sobie wejście w handel przyprawami. Podczas gdy kupcy arabscy kipieli gniewem, rozpoczęła się era handlu wschodniego Portugalii."
 por_events.20.a: "Pieprz i przyprawy — Portugalia zdobyła bogactwo Indii!"
 por_events.30.t: "Podbój Malakki — zajęcie szyi handlu przyprawami"
 por_events.30.d: "W lipcu 1511 roku Afonso de Albuquerque z 1200 portugalskimi siłami podbił Malakkę. „Najważniejsze miejsce Wschodu” — panowanie nad Malakką zdobywa wszystkie szlaki handlowe Chin, Indii i Wysp Korzennych. Albuquerque postawił Malakkę obok Goa i Ormuzu jako jeden z trzech filarów imperium portugalskiego."
 por_events.30.a: "Malakka nasza! Handel wschodni — monopol Portugalii!"
 por_events.40.t: "Odkrycie Brazylii przez Cabrala"
 por_events.40.d: "22 kwietnia 1500 roku — w drodze do Indii z flotyllą 13 okrętów Pedro Álvares Cabral daleko odchylił się na zachód, by uniknąć burzy, i odkrył nieznaną ziemię. „Ilha de Vera Cruz” — część kontynentu południowoamerykańskiego, później nazwana „Brazylią”. Na mocy Traktatu z Tordesillas ta ziemia staje się portugalskim terytorium, i ta ziemia później stanie się największą kolonią Portugalii."
 por_events.40.a: "Odkrycie z Bożego przewodnictwa! Brazylia należy do Portugalii!"
 por_events.99.t: "Pan mórz — imperium Portugalii ukończone"
 por_events.99.d: "Od Lizbony po Goa, od Malakki po Brazylię — imperium Portugalii dominuje nad morzami świata. „Morski Jedwabny Szlak”, o którym marzył książę Henryk, stał się rzeczywistością, a przyprawy, złoto, cukier i kość słoniowa spotykają się w Lizbonie. Portugalia przekształciła się z małego narodu o 92000 kilometrów kwadratowych w pierwsze na świecie „globalne imperium morskie”."
 por_events.99.a: "Portugalia na wieki! Rządź jako pan mórz!"
 STATIC_MODIFIER_NAME_por_henrique_mod: "Tradycja morska Portugalii"
 STATIC_MODIFIER_DESC_por_henrique_mod: "Portugalia Alfonsa IV pielęgnuje swą tradycję morską — atlantyckie rybołówstwo, handel i sztuka nawigacji tworzą podstawę tego królestwa."
 STATIC_MODIFIER_NAME_por_lisbon_mod: "Dobrobyt Lizbony"
 STATIC_MODIFIER_DESC_por_lisbon_mod: "Lizbona u ujścia Tagu rozwinięta centrum handlu światowego."
 STATIC_MODIFIER_NAME_por_porto_mod: "Wzrost Porto"
 STATIC_MODIFIER_DESC_por_porto_mod: "Porto nad Douro rozwinięte miastem wina i rybołówstwa."
 STATIC_MODIFIER_NAME_por_coimbra_mod: "Uniwersytet w Coimbrze"
 STATIC_MODIFIER_DESC_por_coimbra_mod: "Najstarszy uniwersytet Portugalii kształci żeglarzy, prawników i duchowieństwo."
 STATIC_MODIFIER_NAME_por_lisbon_trade_mod: "Lizbona jako węzeł handlowy"
 STATIC_MODIFIER_DESC_por_lisbon_trade_mod: "Lizbona ustanowiona największym wschodnim węzłem przypraw Europy."
 STATIC_MODIFIER_NAME_por_avis_mod: "Władza domu Avis"
 STATIC_MODIFIER_DESC_por_avis_mod: "Rządy dynastii Avis ustabilizowane, podstawa dla ery wielkich odkryć położona."
 STATIC_MODIFIER_NAME_por_ordenacoes_mod: "Ordenações Afonsinas"
 STATIC_MODIFIER_DESC_por_ordenacoes_mod: "Pierwszy systematyczny kodeks praw, sporządzony przez pisarzy Lizbony, niesie te same zasady do sądów każdego zakątka królestwa."
 STATIC_MODIFIER_NAME_por_evora_mod: "Wzrost Évory"
 STATIC_MODIFIER_DESC_por_evora_mod: "Starożytne miasto Alentejo, Évora, rozwinięte centrum rolniczym i kulturalnym."
 STATIC_MODIFIER_NAME_por_fisheries_mod: "Rybołówstwo Algarve"
 STATIC_MODIFIER_DESC_por_fisheries_mod: "Atlantyckie łowiska karmiły portugalskie pokrewieństwo z morzem."
 STATIC_MODIFIER_NAME_por_ceuta_mod: "Przyczółek Ceuta"
