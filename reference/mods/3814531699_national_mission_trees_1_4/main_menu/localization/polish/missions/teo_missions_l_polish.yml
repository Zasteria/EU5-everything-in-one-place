l_polish:
 teo_theodoro_mission_pack: "Księstwo Teodoro: Gotia odrodzona i pan Morza Czarnego"
 teo_theodoro_mission_pack_DESCRIPTION:0 "W 1337 roku księstwo Teodoro czepia się górskiej twierdzy Mangup na Półwyspie Krymskim. Niegdyś część Cesarstwa Bizantyjskiego, to greckie księstwo otoczone jest przez Tatarów, Genueńczyków i wznoszących się Osmanów. Wykorzystaj kupiecki geniusz i wojskową dzielność rodziny Gavras, by zdobyć handel czarnomorski, odrodzić imię Gotii, odzyskać Konstantynopol i rządzić Cesarstwem Gockim nad wschodnim Morzem Śródziemnym."
 teo_theodoro_mission_pack_CRITERIA_DESCRIPTION:0 "Opanuj Morze Czarne, wypędź Genueńczyków, odzyskaj Konstantynopol i rządź Cesarstwem Gockim nad wschodnim Morzem Śródziemnym, Morzem Czarnym i stepami."
 teo_theodoro_mission_pack_BUTTON_TOOLTIP:0 "Rządź Cesarstwem Gockim nad wschodnim Morzem Śródziemnym."
 teo_theodoro_mission_pack_BUTTON_DETAILS:0 "Wznieś z górskiej twierdzy Mangup Cesarstwo Gockie przez handel czarnomorski, dziedzictwo bizantyjskie i podbój stepu!"
 teo_rise_of_theodoro: "Wzrost Teodoro"
 teo_rise_of_theodoro_desc: "Od górskiej twierdzy Mangup zaczyna się wzrost księstwa Teodoro. Otoczony przez Tatarów, Genueńczyków i Osmanów, geniusz rodziny Gavras obróci kryzys w możliwość."
 teo_black_sea_fleet: "Flota czarnomorska"
 teo_black_sea_fleet_desc: "Morze Czarne jest spierane przez Genuę, Wenecję, Tatarów i Osmanów. Zbuduj flotę, by ustanowić potęgę teodoryjską na tych żywotnych wodach."
 teo_build_theodoro_harbor: "Port Teodoro"
 teo_build_theodoro_harbor_desc: "Rozwiń port Teodoro u podnóża Mangupa, by ustanowić go potęgą morską Morza Czarnego."
 teo_genoese_question: "Kwestia genueńska"
 teo_genoese_question_desc: "Genueńska kolonia Gazaria, rządząca z Kaffy, dominuje nad handlem czarnomorskim. Kup Gazarię wasalem — lub zachowaj skarbiec."
 teo_expel_genoese: "Wypędź Genueńczyków"
 teo_expel_genoese_desc: "Wypędź Genueńczyków z Krymu i zajmij ich kolonie, by ustanowić zwierzchność teodoryjską."
 teo_dominate_crimea: "Opanuj Krym"
 teo_dominate_crimea_desc: "Wypędź wszystkich rywali z Krymu i rządź jego jedynym panem."
 teo_tana_trade: "Handel Tany"
 teo_tana_trade_desc: "Zajmij węzeł handlowy Tana u ujścia Donu, by opanować wschodnie szlaki handlowe."
 teo_black_sea_domination: "Panowanie nad Morzem Czarnym"
 teo_black_sea_domination_desc: "Ustanów pełną zwierzchność nad Morzem Czarnym, nie zostawiając żadnego rywala, który rzuciłby wyzwanie władzy teodoryjskiej."
 teo_greek_heritage: "Dziedzictwo greckie"
 teo_greek_heritage_desc: "Umocnij wiarę prawosławną i dziedzictwo kulturowe bizantyjskie, wspierające legitymizację Teodoro."
 teo_trebizond_relations: "Stosunki z Trapezuntem"
 teo_trebizond_relations_desc: "Określ stosunki z Cesarstwem Komnenów Trapezuntu — zaoferuj wasalstwo lub zachowaj sojusz."
 teo_restore_pontus: "Odbuduj Pont"
 teo_restore_pontus_desc: "Podbij wybrzeże pontyjskie i odbuduj starożytne Królestwo Pontu."
 teo_constantinople: "Odzyskaj Konstantynopol"
 teo_constantinople_desc: "Odzyskaj Drugi Rzym od Osmanów i przywróć prawosławny krzyż nad Hagia Sophia."
 teo_gothia_ascendant: "Gotia wznosi się"
 teo_gothia_ascendant_desc: "Ogłoś odrodzenie Gotii i bądź uznany za prawowitego dziedzica Bizancjum."
 teo_aegean_supremacy: "Zwierzchność na Morzu Egejskim"
 teo_aegean_supremacy_desc: "Zajmij wyspy egejskie i wybrzeże, by rozszerzyć potęgę morską teodoryjską na Morze Śródziemne."
 teo_balkans: "Podbij Bałkany"
 teo_balkans_desc: "Podbij Bałkany — serce dawnego Cesarstwa Bizantyjskiego — by umocnić Cesarstwo Gockie."
 teo_azov_gateway: "Brama do Morza Azowskiego"
 teo_azov_gateway_desc: "Opanuj Morze Azowskie, by otworzyć wewnętrzne szlaki handlowe przez Don i Wołgę."
 teo_pryazovia: "Nadazowie"
 teo_pryazovia_desc: "Zabezpiecz region Nadazowia na północ od Morza Azowskiego i otwórz drogę na stepy."
 teo_tatar_wars: "Wojny przeciw Tatarom"
 teo_tatar_wars_desc: "Walcz przeciw Tatarom krymskim, by wykuć kawalerię teodoryjską w elitarnych wojowników stepowych."
 teo_into_steppes: "Na stepy"
 teo_into_steppes_desc: "Podbij rozległy step pontyjski i przekształć Teodoro w imperium kontynentalne."
 teo_caucasus_gateway: "Brama do Kaukazu"
 teo_caucasus_gateway_desc: "Posuń się w górskie ziemie Kaukazu — Gruzję, Armenię i Azerbejdżan."
 teo_caspian_reach: "Dotrzyj do Morza Kaspijskiego"
 teo_caspian_reach_desc: "Dotrzyj do Morza Kaspijskiego, by zyskać dostęp do perskich i środkowoazjatyckich szlaków handlowych."
 teo_russian_question: "Kwestia rosyjska"
 teo_russian_question_desc: "Określ stosunki z Moskwą i Nowogrodem — wykuj sojusz lub dąż do podboju."
 teo_russian_claim: "Roszczenie do Rusi"
 teo_russian_claim_desc: "Rozszerz wpływ teodoryjski na księstwa ruskie."
 teo_ruthenia_conquest: "Podbój Rusi"
 teo_ruthenia_conquest_desc: "Podbij Ruś, w tym Kijów, i zgłoś roszczenie do płaszcza zarówno Bizancjum, jak i Rusi."
 teo_dev_theodoro: "Rozwiń Teodoro"
 teo_dev_theodoro_desc: "Rozwiń miasto-twierdzę Teodoro w stolicę, godną Cesarstwa Gockiego."
 teo_trade_empire: "Imperium handlowe"
 teo_trade_empire_desc: "Wznieś imperium handlowe na skrzyżowaniu Morza Czarnego, Śródziemnego i Jedwabnego Szlaku."
 teo_silk_road: "Handel na Jedwabnym Szlaku"
 teo_silk_road_desc: "Opanuj Jedwabny Szlak i zmonopolizuj strumień jedwabiu ze Środkowej Azji na rynki zachodnie."
 teo_gothic_culture: "Kultura gocka"
 teo_gothic_culture_desc: "Rozwiń swoistą kulturę gocką, łączącą dziedzictwo greckie, gockie i tatarskie."
 teo_orthodox_fortress: "Bastion prawosławny"
 teo_orthodox_fortress_desc: "Zbuduj sieć klasztorów prawosławnych i twierdz wojskowych, by chronić wiarę."
 teo_great_theodoro: "Wielkie Teodoro"
 teo_great_theodoro_desc: "Przekształć Mangup w wieczną stolicę Cesarstwa Gockiego, latarnię cywilizacji."
 teo_crimean_wine: "Wino krymskie"
 teo_crimean_wine_desc: "Wskrześ starożytną grecką tradycję winiarską na Krymie i dostarczaj wino na rynki śródziemnomorskie."
 teo_fortress_mangup: "Twierdza Mangup"
 teo_fortress_mangup_desc: "Umocnij Mangup — naturalną twierdzę płaskowyżową, której nawet Osmanowie z trudem mogli zdobyć."
 teo_anatolian_coast: "Wybrzeże anatolijskie"
 teo_anatolian_coast_desc: "Podbij południowe wybrzeże czarnomorskie Anatolii, by uczynić Morze Czarne morzem wewnętrznym teodoryjskim."
 teo_orthodox_patriarch: "Patriarchat prawosławny"
 teo_orthodox_patriarch_desc: "Ustanów patriarchat w Konstantynopolu, który uczyni Teodoro obrońcą wszystkich chrześcijan prawosławnych."
 teo_merchant_republic: "Republika kupiecka"
 teo_merchant_republic_desc: "Wznieś przez handel i podbój największe imperium handlowe Morza Śródziemnego."
 teo_dev_trebizond_city: "Rozwiń Trapezunt"
 teo_dev_trebizond_city_desc: "Rozwiń Trapezunt ważnym węzłem handlowym na południowym wybrzeżu czarnomorskim."
 teo_gavras_triumphant: "Triumf Gavrasów"
 teo_gavras_triumphant_desc: "Kupiecki geniusz i wojskowa odwaga rodziny Gavras stworzyły wielkie imperium z górskiej twierdzy."
 teo_gothia_empire: "Cesarstwo Gockie"
 teo_gothia_empire_desc: "Rządź cesarzem Gotii — panem Morza Czarnego, Śródziemnego i stepów."
 teo_events.1.t: "Teodoro się wznosi — tradycja grecka czy duma gocka?"
 teo_events.1.d: "W 1337 roku od płaskowyżowej twierdzy Mangup zaczyna się wzrost księstwa Teodoro. Otoczeni przez Tatarów, Genueńczyków i Osmanów, kupiecki geniusz i wojskowa dzielność rodziny Gavras obrócą ten kryzys w możliwość. Zdobądź handel czarnomorski, odrodź Gotię i odzyskaj Konstantynopol."
 teo_events.1.a: "Zachować tradycję pontyjsko-grecką — jesteśmy dziedzicami Bizancjum"
 teo_events.10.t: "Zjednoczenie z Trapezuntem — więzy Komnenów"
 teo_events.10.d: "Cesarstwo Trapezuntu dynastii Komnenów gaśnie pod presją osmańską. Czy pomożemy Trapezuntowi jako współbracia Grecy, czy włączymy go do Gotii?"
 teo_events.10.a: "Uczynić Trapezunt wasalem — chronić dziedzictwo pontyjskie pod Gotią"
 teo_events.20.t: "Konstantynopol odzyskany — koronacja Króla Gockiego"
 teo_events.20.d: "Konstantynopol w rękach Gotii! Odzyskanie prawosławnego świętego miasta od Osmanów oznacza, że Rosja jako „Trzeci Rzym” staje się duchowym przywódcą świata prawosławnego. Chrześcijański krzyż znów powiewa nad Hagia Sophia."
 teo_events.20.a: "Chwała Królowi Gockiemu! Chwała Konstantynopolowi!"
 teo_events.30.t: "Kwestia rosyjska — sojusz czy podbój?"
 teo_events.30.d: "Rodzina Gavras ma głębokie więzy z rosyjskimi domami szlacheckimi. Jak określimy nasze stosunki z Moskwą i Nowogrodem — czy wykujemy sojusz, chroniący wspólne interesy, czy przywiedziemy Ruś pod rządy Gotii?"
 teo_events.30.a: "Zawrzeć sojusz z Rosją — pracować razem jako bracia prawosławni"
 teo_events.30.b: "Dążyć do podboju Rusi — Gotia musi być prawdziwym panem Rusi"
 teo_events.60.t: "Triumf Gavrasów — narodziny Cesarstwa Gockiego"
 teo_events.60.d: "Panowanie nad Morzem Czarnym, Konstantynopol odzyskany, stepy podbite — rodzina Gavras rządzi teraz „Cesarzem Cesarstwa Gockiego” nad wschodnim Morzem Śródziemnym. Podróż od górskiej twierdzy Mangup kończy się założeniem imperium światowego."
 teo_events.60.a: "Chwała Cesarstwu Gockiemu! Chwała rodzinie Gavras!"
 teo_events.99.t: "Cesarstwo Gockie — wieczna chwała"
 teo_events.99.d: "„Cesarz Gotii — pan Morza Czarnego, Śródziemnego i stepu” — to imperium na skrzyżowaniu cywilizacji wschodniej i zachodniej rządzi najwyższe. Zdumiewająca historia, rozpoczęta w 1337 roku od małej twierdzy Mangup, znajduje tu swoje dopełnienie."
 teo_events.99.a: "Chwała Cesarstwu Gockiemu! Chwała wiecznej chwale!"
 STATIC_MODIFIER_NAME_teo_black_sea_fleet_mod: "Flota czarnomorska"
 STATIC_MODIFIER_DESC_teo_black_sea_fleet_mod: "Flota czarnomorska Teodoro broni zwierzchności nad żywotnymi wodami handlowymi."
 STATIC_MODIFIER_NAME_teo_theodoro_harbor_mod: "Port Teodoro"
 STATIC_MODIFIER_DESC_teo_theodoro_harbor_mod: "Port u podnóża Mangupa służy jako brama potęgi morskiej teodoryjskiej."
 STATIC_MODIFIER_NAME_teo_crimea_trade_mod: "Handel krymski"
 STATIC_MODIFIER_DESC_teo_crimea_trade_mod: "Krymsko-tatarskie szlaki handlowe zabezpieczone pod kontrolą teodoryjską."
 STATIC_MODIFIER_NAME_teo_crimea_domination_mod: "Krym podporządkowany"
 STATIC_MODIFIER_DESC_teo_crimea_domination_mod: "Wszyscy rywale wypędzeni z Krymu — Teodoro rządzi jego jedynym panem."
 STATIC_MODIFIER_NAME_teo_tana_mod: "Węzeł handlowy Tana"
 STATIC_MODIFIER_DESC_teo_tana_mod: "Węzeł handlowy Tana u ujścia Donu podporządkowany, otwierając handel wschodni."
 STATIC_MODIFIER_NAME_teo_black_sea_dom_mod: "Pan Morza Czarnego"
 STATIC_MODIFIER_DESC_teo_black_sea_dom_mod: "Pełna zwierzchność nad Morzem Czarnym — żaden rywal nie ośmiela się rzucić wyzwania zwierzchności teodoryjskiej."
 STATIC_MODIFIER_NAME_teo_greek_heritage_mod: "Dziedzictwo greckie"
 STATIC_MODIFIER_DESC_teo_greek_heritage_mod: "Ikony i liturgia Bizancjum wciąż przechowywane są w kaplicach Teodoro, cicho wspierając legitymizację tej ziemi."
 STATIC_MODIFIER_NAME_teo_pontus_mod: "Pont odbudowany"
 STATIC_MODIFIER_DESC_teo_pontus_mod: "Wybrzeże pontyjskie zabezpieczone, otwierając drogę do zwierzchności na Morzu Czarnym."
 STATIC_MODIFIER_NAME_teo_gothia_mod: "Gotia się wznosi"
 STATIC_MODIFIER_DESC_teo_gothia_mod: "Cesarstwo Gockie proklamowane — odrodzenie Gotii uznane przez świat."
 STATIC_MODIFIER_NAME_teo_aegean_mod: "Zwierzchność na Morzu Egejskim"
 STATIC_MODIFIER_DESC_teo_aegean_mod: "W portach wysp egejskich okręty pod flagą Gotii stoją rzędami, a ładunki handlu śródziemnomorskiego rozładowywane są jeden po drugim."
 STATIC_MODIFIER_NAME_teo_balkans_mod: "Bałkany podbite"
 STATIC_MODIFIER_DESC_teo_balkans_mod: "Bałkany podbite — Cesarstwo Gockie rozciąga się nad bizantyjskim sercem."
 STATIC_MODIFIER_NAME_teo_azov_mod: "Brama do Morza Azowskiego"
 STATIC_MODIFIER_DESC_teo_azov_mod: "Brama do Morza Azowskiego otwiera wewnętrzne szlaki handlowe przez Don i Wołgę."
 STATIC_MODIFIER_NAME_teo_pryazovia_mod: "Nadazowie zabezpieczone"
 STATIC_MODIFIER_DESC_teo_pryazovia_mod: "Północny brzeg Morza Azowskiego zabezpieczony, otwierając drogę na stepy."
 STATIC_MODIFIER_NAME_teo_tatar_wars_mod: "Walka przeciw Tatarom"
 STATIC_MODIFIER_DESC_teo_tatar_wars_mod: "Wojny przeciw Tatarom krymskim wykuły kawalerię teodoryjską w elitarnych wojowników stepowych."
 STATIC_MODIFIER_NAME_teo_steppes_mod: "Pan stepów"
 STATIC_MODIFIER_DESC_teo_steppes_mod: "Rozległy step pontyjski wpada pod rządy teodoryjskie — imperium kontynentalne narodzone."
 STATIC_MODIFIER_NAME_teo_caucasus_mod: "Wyprawa kaukaska"
 STATIC_MODIFIER_DESC_teo_caucasus_mod: "Brama do Kaukazu otwiera dostęp do handlu perskiego i środkowoazjatyckiego."
 STATIC_MODIFIER_NAME_teo_caspian_mod: "Morze Kaspijskie osiągnięte"
 STATIC_MODIFIER_DESC_teo_caspian_mod: "Morze Kaspijskie osiągnięte — perskie i środkowoazjatyckie szlaki handlowe są teraz dostępne."
 STATIC_MODIFIER_NAME_teo_russian_claim_mod: "Roszczenie do Rusi"
 STATIC_MODIFIER_DESC_teo_russian_claim_mod: "Posłowie książąt ruskich odwiedzają dwór Gotii, a szlachta ruska jeden po drugim staje pod jej sztandarem."
 STATIC_MODIFIER_NAME_teo_ruthenia_mod: "Ruś podbita"
 STATIC_MODIFIER_DESC_teo_ruthenia_mod: "Ruś, w tym Kijów, podbita — płaszcz Bizancjum i Rusi zgłoszony."
 STATIC_MODIFIER_NAME_teo_theodoro_dev_mod: "Teodoro rozwinięte"
 STATIC_MODIFIER_DESC_teo_theodoro_dev_mod: "Miasto-twierdza Teodoro rozwinięte w stolicę, godną Cesarstwa Gockiego."
 STATIC_MODIFIER_NAME_teo_trade_empire_mod: "Imperium handlowe"
 STATIC_MODIFIER_DESC_teo_trade_empire_mod: "Wielkie imperium handlowe wzniesione na skrzyżowaniu cywilizacji."
 STATIC_MODIFIER_NAME_teo_silk_mod: "Handel na Jedwabnym Szlaku"
 STATIC_MODIFIER_DESC_teo_silk_mod: "Jedwabny Szlak podporządkowany — jedwab płynie przez ręce teodoryjskie na rynki zachodnie."
 STATIC_MODIFIER_NAME_teo_gothic_culture_mod: "Kultura gocka"
 STATIC_MODIFIER_DESC_teo_gothic_culture_mod: "Swoista kultura gocka powstaje, łącząc dziedzictwo greckie, gockie i tatarskie."
 STATIC_MODIFIER_NAME_teo_orthodox_fortress_mod: "Bastion prawosławny"
 STATIC_MODIFIER_DESC_teo_orthodox_fortress_mod: "Klasztory prawosławne i twierdze wojskowe chronią zarówno wiarę, jak i granicę."
 STATIC_MODIFIER_NAME_teo_great_theodoro_mod: "Wielkie Teodoro"
 STATIC_MODIFIER_DESC_teo_great_theodoro_mod: "Mangup przekształcony w wieczną stolicę Cesarstwa Gockiego."
 STATIC_MODIFIER_NAME_teo_wine_mod: "Wino krymskie"
 STATIC_MODIFIER_DESC_teo_wine_mod: "Winnice krymskie odrodzone — cienkie wina płyną na rynki śródziemnomorskie."
 STATIC_MODIFIER_NAME_teo_mangup_fortress_mod: "Twierdza Mangup"
 STATIC_MODIFIER_DESC_teo_mangup_fortress_mod: "Twierdza Mangup umocniona ponad wszelki atak — wieczna siedziba Cesarstwa Gockiego."
 STATIC_MODIFIER_NAME_teo_anatolia_mod: "Wybrzeże anatolijskie zabezpieczone"
 STATIC_MODIFIER_DESC_teo_anatolia_mod: "Południowe wybrzeże czarnomorskie Anatolii podbite — morze staje się morzem wewnętrznym teodoryjskim."
 STATIC_MODIFIER_NAME_teo_patriarch_mod: "Patriarchat prawosławny"
 STATIC_MODIFIER_DESC_teo_patriarch_mod: "Patriarchat Konstantynopola czyni Teodoro obrońcą wszystkich chrześcijan prawosławnych."
 STATIC_MODIFIER_NAME_teo_merchant_republic_mod: "Republika kupiecka"
 STATIC_MODIFIER_DESC_teo_merchant_republic_mod: "Rozległa sieć handlowa rozciąga się nad Morzem Śródziemnym, Czarnym i Jedwabnym Szlakiem."
 STATIC_MODIFIER_NAME_teo_trebizond_city_mod: "Miasto Trapezunt"
 STATIC_MODIFIER_DESC_teo_trebizond_city_mod: "Trapezunt rozwinięty ważnym węzłem handlowym na południowym wybrzeżu czarnomorskim."
 STATIC_MODIFIER_NAME_teo_gavras_final_mod: "Hegemonia Cesarstwa Gockiego"
 STATIC_MODIFIER_DESC_teo_gavras_final_mod: "Wizja dynastii Gavras ukończona — Cesarstwo Gockie rządzi morzem i stepem."
 teo_events.1.b: "Wskrzesić dumę gocką — jesteśmy prawdziwymi dziedzicami Gotii"
 teo_events.5.t: "Gazaria — kupić czy odmówić?"
 teo_events.5.d: "Republika Genui zarządza swą krymsko-tatarską kolonią handlową „Gazaria (GAZ)”. Za opłatą 300 dukatów Genua oferuje przekazać Gazarię wasalem Teodoro.\n\nTo możliwość pokojowego ustanowienia kontroli nad Krymem — lecz 300 dukatów to wysoka cena. Czy ją kupisz?"
 teo_events.5.a: "Zapłacić 300 dukatów, by kupić Gazarię — Krym będzie nasz"
 teo_events.5.b: "Odmówić — zachować skarbiec na razie"
 STATIC_MODIFIER_NAME_teo_gothic_penalty_mod: "Ból nawrócenia gockiego"
 STATIC_MODIFIER_DESC_teo_gothic_penalty_mod: "Grecy pontyjscy, niezdolni przyzwyczaić się do języka i obyczajów gockich, żywią urazę, która tli się we wsiach — lecz wszyscy wiedzą, że większa nagroda czeka, gdy Cesarstwo Gockie jest ukończone."
 STATIC_MODIFIER_NAME_teo_gothic_bonus_mod: "Prawdziwy dziedzic Gotii"
 STATIC_MODIFIER_DESC_teo_gothic_bonus_mod: "Cesarstwo Gockie, ukończone przy zachowaniu kultury gockiej — duch dawnych Gotów odrodzony, przynosząc Cesarstwu Gockiemu wieczną chwałę."
 teo_events.10.b: "Zachować sojusz — uczcić dumę Komnenów"
 STATIC_MODIFIER_NAME_teo_russian_alliance_mod: "Sojusz z Rosją"
 STATIC_MODIFIER_DESC_teo_russian_alliance_mod: "Przyjazny sojusz z księstwami ruskimi podniósł wpływ dyplomatyczny Gotii."
 STATIC_MODIFIER_NAME_teo_russian_conquest_mod: "Wola podboju Rusi"
 STATIC_MODIFIER_DESC_teo_russian_conquest_mod: "Wola Gotii do podboju Rusi tłumi otrzymaną wrogość."
 teo_events.99.b: "Dopełnić imperium z dumą gocką — otworzyć prawo do najazdu na Niemcy"
 cb_gothic_invasion: "Inwazja gocka"
 cb_gothic_invasion_desc: "Swoisty casus belli przeciw narodom grupy kulturowej germańskiej — koszty podboju i wrogość zmniejszone o 80%. Odblokowany wyłącznie dla gockiej kultury głównej po ukończeniu finałowej misji Cesarstwa Gockiego."
