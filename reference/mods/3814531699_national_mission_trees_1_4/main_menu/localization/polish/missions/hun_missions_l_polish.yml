l_polish:
 hun_crown_of_saint_stephen_mission_pack: "Korona Świętego Stefana"
 hun_crown_of_saint_stephen_mission_pack_DESCRIPTION:0 "W 1337 roku Królestwem Węgier rządzi król Karol I (Karol Robert) z dynastii andegaweńskiej. Jego następca, wspaniały Ludwik — później znany jako Ludwik Wielki — czeka na swój czas, z unią personalną z Polską, nadchodzącą w następnym pokoleniu. To królestwo, skupione w Kotlinie Karpackiej, żywi ambicje we wszystkich kierunkach: na północ przez Polskę i Czechy, na południe na Bałkany, na wschód przeciw Osmanom i na zachód ku Adriatykowi. Zbuduj Czarną Armię, przynieś renesans do Budy i stań się Przedmurzem chrześcijaństwa."
 hun_crown_of_saint_stephen_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Węgry, rozszerz się na północ przez Polskę i Czechy, zabezpiecz Bałkany, pokonaj Osmanów, osiągnij Adriatyk i ukończ reformy wewnętrzne."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by odbudować chwałę Korony Świętego Stefana."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_DETAILS:0 "Od dynastii andegaweńskiej do ery Macieja Korwina — największe dni Węgier czekają!"
 hun_crown_of_st_stephen: "Korona Świętego Stefana"
 hun_crown_of_st_stephen_desc: "Święty Stefan I założył Królestwo Węgier w roku 1000 n.e., przeprowadzając nawrócenie na chrześcijaństwo. Korona Świętego Stefana — Święta Korona — pozostaje świętym symbolem godności królewskiej Węgier po dziś dzień. W 1337 roku dynastia andegaweńska dzierży tę koronę i rządzi największym królestwem Europy Środkowej. Zabezpiecz Budę i Ostrzyhom i umocnij podstawy królestwa."
 hun_angevin_diplomacy: "Dyplomacja andegaweńska"
 hun_angevin_diplomacy_desc: "Andegaweńska dynastia Węgier ma złożone więzi dynastyczne z Neapolem, Polską i Czechami. Matka Ludwika I, Elżbieta, była siostrą polskiego króla Kazimierza III, otwierając perspektywę odziedziczenia korony polskiej. Zbuduj sieć sojuszy i podnieś andegaweński wpływ dyplomatyczny w całej Europie Środkowej."
 hun_polish_union: "Unia personalna z Polską"
 hun_polish_union_desc: "Gdy Kazimierz III Wielki zmarł bez męskiego dziedzica w 1370 roku, jego siostrzeniec Ludwik I Węgierski (z domu Andegawenów) odziedziczył tron polski. Było to początkiem węgiersko-polskiej unii personalnej. Dwa wielkie królestwa, zjednoczone pod jednym królem — równowaga sił w Europie Środkowej zmienia się gruntownie."
 hun_bohemian_ambitions: "Ambicje czeskie"
 hun_bohemian_ambitions_desc: "Królestwo Czech, siedlisko herezji husyckiej, jest rozdarte niepokojami religijnymi. Podczas gdy Andegawenowie, Luksemburgowie i Habsburgowie rywalizują o koronę czeską, Węgry również mają prawowite roszczenie. Zdobycie Pragi tworzy podwójną monarchię węgiersko-czeską w sercu Europy Środkowej."
 hun_lord_of_the_north: "Pan Północy"
 hun_lord_of_the_north_desc: "Zdobycie Krakowa i Gdańska rozszerza panowanie węgierskie aż do Morza Bałtyckiego, tworząc rozległe imperium środkowoeuropejskie od Adriatyku po Bałtyk. Chwała dynastii piastowskiej i andegaweńskiej Polski odradza się pod koroną węgierską."
 hun_conquer_serbia: "Podbij Serbię"
 hun_conquer_serbia_desc: "Królestwo Serbii stało się wasalem osmańskim po bitwie na Kosowym Polu (1389). Lecz dla Węgier Belgrad (Nándorfehérvár) jest niezastąpionym kluczem do obrony Dunaju. W 1440 roku legendarna obrona Belgradu przez Skanderbega i Jana Hunyadiego przed Osmanami — niech ta bitwa rozegra się tutaj."
 hun_subjugate_wallachia: "Podporządkuj Wołoszczyznę"
 hun_subjugate_wallachia_desc: "Wołoszczyzna (Havasalföld) historycznie uznawała zwierzchnictwo węgierskie. Vlad II — ojciec Vlada Palownika — otrzymał Zakon Smoka od węgierskiego króla Zygmunta. Mocno ustanów to państwo buforowe pod wpływem węgierskim."
 hun_subjugate_moldavia: "Podporządkuj Mołdawię"
 hun_subjugate_moldavia_desc: "Mołdawia leży między deltą Dunaju a Polską, sporna między Węgrami, Polską i Osmanami. Przywiedzenie tego księstwa mocno pod zwierzchnictwo węgierskie zabezpiecza wschodnią granicę."
 hun_danube_fortress_line: "Dunajska linia twierdz"
 hun_danube_fortress_line_desc: "System végvár — pogranicznej sieci twierdz Węgier — był najwyrafinowańszą strukturą obronną antyosmańską w Europie XV wieku. Dziesiątki twierdz wzdłuż Dunaju komunikowały się ze sobą, tworząc linię wczesnego ostrzegania i obrony, która zatrzymywała ofensywy osmańskie na śmierć. System ten uczynił Węgry prawdziwą pierwszą tarczą chrześcijaństwa."
 hun_order_of_the_dragon: "Zakon Smoka"
 hun_order_of_the_dragon_desc: "Zakon Smoka był zakonem rycerskim założonym przez króla Zygmunta Węgierskiego w 1408 roku. Vlad II, Skanderbeg i Jan Hunyady byli wśród jego członków. Ten zakon zjednoczył szlachtę węgierską pod sztandarem krucjaty antyosmańskiej, uosabiając misję strażnika chrześcijaństwa."
 hun_crusade_preparations: "Przygotowania do krucjaty"
 hun_crusade_preparations_desc: "Jan Hunyady był największym antyosmańskim krzyżowcem XV wieku. Jego Długa Wyprawa z lat 1442-43 odepchnęła Osmanów, dając chrześcijaństwu nadzieję. Lecz bitwa pod Warną w 1444 roku zniszczyła polsko-węgierskie wojsko krzyżowe. Tym razem wystąp przygotowany."
 hun_battle_of_nicopolis: "Bitwa pod Nikopolis"
 hun_battle_of_nicopolis_desc: "W 1396 roku wojsko krzyżowe pod królem Zygmuntem Węgierskim zostało zmiażdżone w bitwie pod Nikopolis — klęsce, która utrwaliła panowanie osmańskie nad Bałkanami. Lecz tym razem jest inaczej — w pełni przygotowane Węgry zdobywają Nikopolis i otwierają drzwi do odzyskania Bałkanów. Imię Hunyadiego rozbrzmiewa po całej Europie."
 hun_black_army: "Czarna Armia"
 hun_black_army_desc: "Czarna Armia (Fekete Sereg), stworzona przez króla Macieja Korwina około 1458 roku, była najbardziej zaawansowaną profesjonalną siłą wojskową współczesnej Europy — połączeniem najemników i stałych wojsk w czarnych zbrojach, agresywnie przyjmujących broń palną. Mimo ogromnych kosztów utrzymania, ta armia budziła strach zarówno u Osmanów, jak i Habsburgów. Jest kluczem do hegemonii węgierskiej."
 hun_bulwark_of_christendom: "Przedmurze chrześcijaństwa"
 hun_bulwark_of_christendom_desc: "Przez wieki Węgry walczyły na linii frontu chrześcijaństwa przeciw Imperium Osmańskiemu. Teraz, gdy Osmanowie zostali całkowicie wypędzeni z Europy, papież, cesarz i książęta Europy obsypują króla Węgier najwyższym honorem: Antemurale Christianitatis — Przedmurze chrześcijaństwa."
 hun_croatian_union: "Unia z Chorwacją"
 hun_croatian_union_desc: "Od Pacta Conventa z 1102 roku Chorwacja jest w unii personalnej z Węgrami — chorwaccy szlachcice przyjęli króla węgierskiego za swego własnego w zamian za szeroką autonomię. Wzmocnij tę historyczną unię i zabezpiecz wrota Węgier do Adriatyku."
 hun_reclaim_dalmatia: "Odzyskaj Dalmację"
 hun_reclaim_dalmatia_desc: "Wybrzeże dalmatyńskie było częścią królestwa węgiersko-chorwackiego, aż Wenecja kupiła je w 1409 roku. Odzyskanie Splitu i Raguzy (Dubrownik) przywraca gwarantowany dostęp do Adriatyku i otwiera drogę do Włoch."
 hun_adriatic_supremacy: "Zwierzchność nad Adriatykiem"
 hun_adriatic_supremacy_desc: "Nadszedł czas, by zakończyć dawny monopol Wenecji nad Adriatykiem — „Oblubienicą Adriatyku”. Flota węgiersko-chorwacka podniesie swą flagę nad Morzem Adriatyckim."
 hun_angevin_naples: "Andegaweńskie roszczenie do Neapolu"
 hun_angevin_naples_desc: "Andegaweńska dynastia Węgier zgłasza roszczenie do tronu neapolitańskiego. Ludwik I zajmował Neapol dwukrotnie, w 1347 i 1350 roku. Nadszedł czas, by urzeczywistnić andegaweńskie roszczenie na zawsze — niech król Węgier rządzi Neapolem wiecznie."
 hun_strengthen_estates: "Wzmocnij stany"
 hun_strengthen_estates_desc: "Szlachta i duchowieństwo węgierskie zdobyły rozległe przywileje w Złotej Bulli (Aranybulla) z 1222 roku. Opierając się na tej tradycji polityki stanowej, zdobycie poparcia szlachty i duchowieństwa wzmacnia legitymizację królewską. Lecz uważaj — nadmierne ustępstwa przyczynią kłopotów później. Zachowaj właściwą równowagę."
 hun_tripartitum: "Tripartitum"
 hun_tripartitum_desc: "Tripartitum, opracowane przez Istvána Werbőczy w 1514 roku, było systematyczną kodyfikacją węgierskiego prawa zwyczajowego. Definiowało przywileje szlacheckie, obowiązki chłopskie i władzę królewską. Ten kodeks stał się podstawą prawa węgierskiego — choć jego kodyfikacja poddaństwa przyczyniła się również do powstania chłopskiego Györgya Dózsy z 1514 roku."
 hun_matthias_reforms: "Reformy króla Macieja"
 hun_matthias_reforms_desc: "Król Maciej Korwin (panował 1458-90), zwany „Sprawiedliwym”, był największym z królów węgierskich. Scentralizowane opodatkowanie, profesjonalna Czarna Armia i agresywne przyjęcie kultury renesansu przekształciły Węgry w najsilniejsze państwo Europy Środkowej."
 hun_buda_renaissance: "Renesans w Budzie"
 hun_buda_renaissance_desc: "Dwór króla Macieja wprowadził włoski renesans na Węgry. Bibliotheca Corviniana w pałacu w Budzie przechowywała tysiące łacińskich i greckich rękopisów, przyciągając uczonych i artystów z całej Europy. Ten rozkwit kulturalny czyni Węgry centrum kulturalnym Europy Środkowej."
 hun_great_hungary: "Wielkie Węgry"
 hun_great_hungary_desc: "Bałkany, Polska, Czechy, Dalmacja — Królestwo Węgier wyrosło na wielkie imperium daleko poza Kotlinę Karpacką. Czarna Armia, renesansowy dwór Budy, dunajska linia twierdz — wszystko to razem stworzyło Węgry potężniejsze niż kiedykolwiek wcześniej."
 hun_glory_of_st_stephen: "Chwała Korony Świętego Stefana"
 hun_glory_of_st_stephen_desc: "Królestwo Węgier, założone przez Świętego Stefana tysiąc lat temu, stało się wielkim imperium, panującym nad Europą Środkową i Bałkanami. Od Bałtyku na północy po Adriatyk i Morze Śródziemne na południu, od Karpat po wschód — Korona Świętego Stefana jaśnieje niespotykanym blaskiem. Sławione jako Przedmurze chrześcijaństwa, chwała Węgier osiągnęła swój absolutny szczyt."
 hun_events.99.t: "Chwała Korony Świętego Stefana"
 hun_events.99.d: "Królestwo Świętego Stefana — niegdyś zamknięte w Kotlinie Karpackiej — teraz rozciąga się od Bałtyku po Adriatyk i Morze Śródziemne. Polska, Czechy i Chorwacja zjednoczone pod koroną węgierską; Osmanowie wypędzeni z Bałkanów; andegaweńskie roszczenie do Neapolu urzeczywistnione. Renesansowy dwór Budy sławiony jest w całej Europie; Czarnej Armii boi się każdy wróg. Korona Świętego Stefana jaśnieje największym blaskiem w całej swej tysiącletniej historii."
 hun_events.99.a: "Święty Stefanie, spełniliśmy twe marzenie!"
 STATIC_MODIFIER_NAME_hun_angevin_prestige_mod: "Prestiż andegaweński"
 STATIC_MODIFIER_DESC_hun_angevin_prestige_mod: "W 1308 roku andegaweński książę Karol (Karol Robert) odziedziczył tron węgierski. Więzy rodowe tej dynastii związały Węgry z Neapolem, Sycylią, Prowansją i Polską, wrzucając Węgry w centrum europejskiej dyplomacji. Dwór papieski w Awinionie i Habsburgowie w Wiedniu nie mogli sobie pozwolić na ignorowanie tego dworu andegaweńskiego."
 STATIC_MODIFIER_NAME_hun_angevin_diplomacy_mod: "Andegaweńska sieć dyplomatyczna"
 STATIC_MODIFIER_DESC_hun_angevin_diplomacy_mod: "Listy od księżniczek andegaweńskich, wydanych za mąż od Neapolu po Polskę, przybywają nieustannie na dwór w Wyszehradzie."
 STATIC_MODIFIER_NAME_hun_bohemian_crown_mod: "Korona Czech"
 STATIC_MODIFIER_DESC_hun_bohemian_crown_mod: "Z zabezpieczoną koroną czeską trójmonarchia węgiersko-polsko-czeska utworzona."
 STATIC_MODIFIER_NAME_hun_northern_lord_mod: "Pan Północy"
 STATIC_MODIFIER_DESC_hun_northern_lord_mod: "Z dostępem do Bałtyku Węgry stały się wielką potęgą, kontrolującą kluczowy handel północny i wschodnioeuropejski."
 STATIC_MODIFIER_NAME_hun_wallachian_buffer_mod: "Wołoskie państwo buforowe"
 STATIC_MODIFIER_DESC_hun_wallachian_buffer_mod: "Wołoszczyzna działa jako węgierskie państwo buforowe, zabezpieczając wschodnią granicę."
 STATIC_MODIFIER_NAME_hun_moldavian_buffer_mod: "Mołdawskie państwo buforowe"
 STATIC_MODIFIER_DESC_hun_moldavian_buffer_mod: "Mołdawia pod wpływem węgierskim daje podwójną warstwę zabezpieczenia wschodniej granicy."
 STATIC_MODIFIER_NAME_hun_vegvar_system_mod: "System twierdz végvár"
 STATIC_MODIFIER_DESC_hun_vegvar_system_mod: "Zorganizowana sieć twierdz wzdłuż Dunaju systematycznie blokuje natarcia osmańskie. Węgry stają się przednią tarczą chrześcijaństwa."
 STATIC_MODIFIER_NAME_hun_dragon_order_mod: "Zakon Smoka"
 STATIC_MODIFIER_DESC_hun_dragon_order_mod: "Zakon Smoka króla Zygmunta jednoczy szlachtę i wojsko w jednej sprawie. Staje się duchowym kręgosłupem krucjaty antyosmańskiej."
 STATIC_MODIFIER_NAME_hun_crusade_zeal_mod: "Zapał krucjaty"
 STATIC_MODIFIER_DESC_hun_crusade_zeal_mod: "Zapał krucjaty, zebranej pod sztandarami Jana Hunyadiego, wciąż płonie w sercach żołnierzy."
 STATIC_MODIFIER_NAME_hun_black_army_mod: "Czarna Armia"
 STATIC_MODIFIER_DESC_hun_black_army_mod: "Fekete Sereg — Czarna Armia — stworzona przez Macieja Korwina, była najnowocześniejszą siłą wojskową współczesnej Europy: dziesiątki tysięcy najemników i stałych wojsk, odzianych w czarne zbroje. Zbudowana wokół rdzenia rycerzy husyckich z Czech, agresywnie przyjmowała broń palną i budziła strach zarówno u Osmanów, jak i Habsburgów. Zabójczy koszt obciążał skarbiec królewski — lecz bez tej armii Węgry nie mogłyby przetrwać wśród takich gigantów."
 STATIC_MODIFIER_NAME_hun_christendom_bulwark_mod: "Przedmurze chrześcijaństwa"
 STATIC_MODIFIER_DESC_hun_christendom_bulwark_mod: "Wypędziwszy Osmanów z Europy, Węgry niosą zaszczyt Antemurale Christianitatis."
 STATIC_MODIFIER_NAME_hun_adriatic_coast_mod: "Wybrzeże adriatyckie zabezpieczone"
 STATIC_MODIFIER_DESC_hun_adriatic_coast_mod: "Odzyskanie Dalmacji daje Węgrom bezpośredni dostęp do Morza Adriatyckiego."
 STATIC_MODIFIER_NAME_hun_angevin_italy_mod: "Andegaweńskie Włochy"
 STATIC_MODIFIER_DESC_hun_angevin_italy_mod: "Węgierscy Andegawenowie panują nad południowymi Włochami przez Neapol."
 STATIC_MODIFIER_NAME_hun_golden_bull_mod: "Tradycja Złotej Bulli"
 STATIC_MODIFIER_DESC_hun_golden_bull_mod: "System stanowy, dziedziczący ducha Złotej Bulli z 1222 roku, wspiera stabilność królestwa."
 STATIC_MODIFIER_NAME_hun_tripartitum_mod: "Tripartitum"
 STATIC_MODIFIER_DESC_hun_tripartitum_mod: "Tripartitum, opracowane przez Istvána Werbőczy w 1514 roku, było kulminacją węgierskiego prawa zwyczajowego — trzy części, obejmujące „jedną i tę samą wolność” szlachty, zniewolenie chłopstwa i władzę królewską. Krwawe powstanie chłopskie Dózsy było jego ceną. A jednak ten kodeks pozostawał podstawą społeczeństwa węgierskiego przez wieki."
 STATIC_MODIFIER_NAME_hun_matthias_admin_mod: "Reformy króla Macieja"
 STATIC_MODIFIER_DESC_hun_matthias_admin_mod: "Macieja nazywano „Sprawiedliwym” (Igazságos Mátyás), gdyż sądził bez różnicy stanu i chronił chłopów przed uciskiem baronów. Zbudował scentralizowaną biurokrację, ujarzmił władzę magnatów i rozszerzył władzę królewską bezpośrednio na ziemie wiejskie. Jego panowanie jest pamiętane jako najdoskonalszy wyraz królewskości węgierskiej w historii."
 STATIC_MODIFIER_NAME_hun_buda_renaissance_mod: "Renesans w Budzie"
 STATIC_MODIFIER_DESC_hun_buda_renaissance_mod: "Dwór Macieja przyciągnął humanistów, architektów, rzeźbiarzy i muzyków z całych Włoch. Pałac w Budzie został przebudowany w stylu renesansowym — wspanialszy niż Wiedeń — a Bibliotheca Corviniana przechowywała ponad pięć tysięcy rękopisów klasycznych tekstów greckich i rzymskich. Gdy Maciej zmarł, humanista napisał: „Maciej nie żyje. Sprawiedliwość zginęła”."
 STATIC_MODIFIER_NAME_hun_great_hungary_mod: "Wielkie Węgry"
 STATIC_MODIFIER_DESC_hun_great_hungary_mod: "Wielkie imperium węgierskie, obejmujące Europę Środkową, Bałkany i Adriatyk, ukończone."
 hun_baltic_trade: "Handel bałtycki"
 hun_baltic_trade_desc: "Gdańsk — kluczowy węzeł Ligi Hanzeatyckiej — jest bramą między Morzem Północnym a Bałtykiem. Kontrola węgierska nad tym portem otwiera dostęp do handlu bałtyckim bursztynem, futrami i drewnem, zapewniając bezpośrednią drogę do Europy Zachodniej. To punkt zwrotny, w którym Węgry przekształcają się z lądowego państwa rolniczego w morską potęgę handlową."
 hun_hre_influence: "Wpływ na Święte Cesarstwo Rzymskie"
 hun_hre_influence_desc: "Z zabezpieczonymi Polską i Czechami Węgry stały się najpotężniejszym sąsiadem Świętego Cesarstwa Rzymskiego. Rozszerz wpływ węgierski na książąt niemieckich poprzez reputację dyplomatyczną i wiele sojuszy, przeciwstawiając się hegemonii habsburskiej."
 hun_challenge_habsburgs: "Rzuć wyzwanie Habsburgom"
 hun_challenge_habsburgs_desc: "Dynastia Habsburgów Austrii była odwiecznym rywalem Węgier. Zdobycie Wiednia przenosi hegemonię dunajską na Węgry. Największa ambicja węgierska — obalić Habsburgów i zostać cesarzem Świętego Cesarstwa — jest tu urzeczywistniona."
 hun_conquer_bulgaria: "Podbij Bułgarię"
 hun_conquer_bulgaria_desc: "Drugie Carstwo Bułgarskie zostało zniszczone przez Osmanów w 1396 roku. Lecz z Węgrami, panującymi teraz na Bałkanach, Sofia i Tyrnowo mogą zostać odzyskane — wskrzeszając dziedzictwo bułgarskie pod koroną węgierską."
 hun_conquer_greece: "Podbij Grecję"
 hun_conquer_greece_desc: "Ateny i Saloniki — dwa wielkie miasta starożytnej cywilizacji greckiej — upadają przed Węgrami. Zjednocz podzielone księstwa greckie po upadku Bizancjum i rozszerz sztandar węgierski aż po południowy kraniec Bałkanów."
 hun_balkan_empire: "Imperium bałkańskie"
 hun_balkan_empire_desc: "Serbia, Bułgaria, Grecja, Wołoszczyzna, Mołdawia — cały Półwysep Bałkański pod panowaniem węgierskim. Hegemonia, którą Bizancjum, a następnie Osmanowie sprawowali nad Bałkanami, teraz w pełni należy do Węgier."
 hun_push_into_anatolia: "Posuń się do Anatolii"
 hun_push_into_anatolia_desc: "Ze zabezpieczonym Konstantynopolem Węgry obejmują teraz dwa kontynenty. Rozpocznij krucjatę, by odzyskać ziemie anatolijskie, które utracił Bizancjum, i uderz w serce Imperium Osmańskiego."
 hun_hungarian_crusade: "Krucjata węgierska"
 hun_hungarian_crusade_desc: "Król węgierski, który wyzwolił Jerozolimę, staje się bohaterem całego chrześcijaństwa. Marzenie od czasów Świętego Stefana — powrót Ziemi Świętej w ręce chrześcijańskie — wreszcie urzeczywistnione. Zwycięstwo krzyżowe, o którym marzył Zygmunt, założyciel Zakonu Smoka, jest tu wpisane."
 hun_mediterranean_fleet: "Flota śródziemnomorska"
 hun_mediterranean_fleet_desc: "Ze zabezpieczonymi Neapolem i Sycylią Węgry stały się główną śródziemnomorską potęgą morską. Flota trzydziestu lub więcej okrętów rywalizuje o kontrolę nad Morzem Śródziemnym. Morze, niegdyś zmonopolizowane przez Wenecję, teraz należy do Węgier."
 hun_conquer_north_africa: "Podbij Afrykę Północną"
 hun_conquer_north_africa_desc: "Zdobycie Tunisu rozszerza terytorium węgierskie na południowy brzeg Morza Śródziemnego. Zmiażdż bazy piratów berberyjskich i usuń przeszkody dla handlu śródziemnomorskiego. Sztandar węgierski powiewa na południowym krańcu Morza Śródziemnego."
 hun_latin_empire: "Odbudowa Cesarstwa Łacińskiego"
 hun_latin_empire_desc: "Ze zabezpieczonymi Konstantynopolem, Rzymem i Neapolem król Węgier może ogłosić się dziedzicem Cesarstwa Łacińskiego. Marzenie Czwartej Krucjaty z 1204 roku jest teraz spełnione poprzez prawowity podbój. Największe imperium chrześcijańskie w historii się rodzi."
 hun_corvinus_library: "Bibliotheca Corviniana"
 hun_corvinus_library_desc: "Bibliotheca Corviniana króla Macieja była największym zbiorem łacińskich i greckich rękopisów współczesnej Europy — ponad pięć tysięcy kodeksów, przechowywanych w pałacu w Budzie, przyciągających uczonych i artystów z Włoch, Francji i Niemiec. Ta inwestycja kulturowa przekształca Węgry w centrum kulturalne Europy Środkowej."
 hun_hungarian_church: "Kościół węgierski"
 hun_hungarian_church_desc: "Skupiony na archidiecezji ostrzyhomskiej, umocnij węgierski Kościół katolicki i zapewnij wsparcie duchowe. Zanim napłyną fale Reformacji, mocno ustanów stosunki między Kościołem katolickim a władzą królewską Węgier."
 hun_economic_powerhouse: "Złoty Dunaj"
 hun_economic_powerhouse_desc: "Węgry, obejmujące Bałkany, północ i Adriatyk, leżą na skrzyżowaniu wielu głównych szlaków handlowych — gigant ekonomiczny. Produkcja rolnicza Dunaju, siedmiogrodzkie kopalnie srebra i śródziemnomorskie dochody handlowe łączą się, rodząc ogromne bogactwo."
 hun_danube_empire: "Imperium Dunajskie"
 hun_danube_empire_desc: "Polska, Czechy, Bałkany, Adriatyk, Morze Śródziemne — wszystko pod panowaniem węgierskim, z wyrafinowanymi instytucjami administracyjnymi i kwitnącą podstawą gospodarczą. Węgry stały się „Imperium Dunajskim” ze środkiem na wielkiej rzece. Wielonarodowe państwo złożone, o którym niegdyś marzyły Austro-Węgry, teraz zrealizowane pod przywództwem węgierskim."
 STATIC_MODIFIER_NAME_hun_baltic_trade_mod: "Handel bałtycki"
 STATIC_MODIFIER_DESC_hun_baltic_trade_mod: "Węgierskie statki kupieckie, zakotwiczone w porcie Gdańska, wracają załadowane bursztynem i futrami."
 STATIC_MODIFIER_NAME_hun_habsburg_rival_mod: "Węgry-Austria"
 STATIC_MODIFIER_DESC_hun_habsburg_rival_mod: "Upadek Wiednia miażdży władzę Habsburgów, czyniąc Węgry panem Dunaju."
 STATIC_MODIFIER_NAME_hun_bulgaria_mod: "Panowanie bułgarskie"
 STATIC_MODIFIER_DESC_hun_bulgaria_mod: "Nowi namiestnicy na wzgórzu Tyrnowa rozprzestrzeniają mowę i prawo węgierskie do wsi południowych Bałkanów."
 STATIC_MODIFIER_NAME_hun_greece_mod: "Światło Grecji"
 STATIC_MODIFIER_DESC_hun_greece_mod: "Król Węgier, spoglądający na Akropol Aten, przyjmuje chwałę starożytnej Grecji dumą własnego dworu."
 STATIC_MODIFIER_NAME_hun_balkan_empire_mod: "Imperium bałkańskie"
 STATIC_MODIFIER_DESC_hun_balkan_empire_mod: "Od Dunaju po Peloponez sztandar Korony Świętego Stefana powiewa z każdego muru Bałkanów."
 STATIC_MODIFIER_NAME_hun_new_crusade_mod: "Nowa krucjata"
 STATIC_MODIFIER_DESC_hun_new_crusade_mod: "Żołnierze, którzy przeszli przez bramy Konstantynopola, przysięgają ponownie nieść krzyż jeszcze dalej na wschód."
 STATIC_MODIFIER_NAME_hun_crusade_victory_mod: "Krucjata dokonana"
 STATIC_MODIFIER_DESC_hun_crusade_victory_mod: "Chwała wyzwolenia Jerozolimy przynosi Węgrom niespotykany prestiż, legitymizację i moc dyplomatyczną."
 STATIC_MODIFIER_NAME_hun_med_fleet_mod: "Flota śródziemnomorska"
 STATIC_MODIFIER_DESC_hun_med_fleet_mod: "Z portów Adriatyku galery pod sztandarem króla węgierskiego wychodzą jedna po drugiej na Morze Śródziemne."
 STATIC_MODIFIER_NAME_hun_north_africa_mod: "Baza północnoafrykańska"
 STATIC_MODIFIER_DESC_hun_north_africa_mod: "Wzdłuż wybrzeża Afryki Północnej węgierscy kupcy i eskadry polujące na korsarzy nieustannie przechodzą od portu do portu."
 STATIC_MODIFIER_NAME_hun_latin_empire_mod: "Odbudowa Cesarstwa Łacińskiego"
 STATIC_MODIFIER_DESC_hun_latin_empire_mod: "Imię króla, dzierżącego Konstantynopol, Rzym i Neapol, wymawiane jest z trwogą na każdym dworze."
 STATIC_MODIFIER_NAME_hun_corvinus_library_mod: "Bibliotheca Corviniana"
 STATIC_MODIFIER_DESC_hun_corvinus_library_mod: "W skryptorium Biblioteki Korwina skrybowie kopiują rękopisy przy świetle lampy dzień i noc."
 STATIC_MODIFIER_NAME_hun_church_mod: "Kościół węgierski"
 STATIC_MODIFIER_DESC_hun_church_mod: "Silny Kościół węgierski przynosi legitymizację, efektywność legislacyjną i stabilność religijną."
 STATIC_MODIFIER_NAME_hun_economy_mod: "Złoty Dunaj"
 STATIC_MODIFIER_DESC_hun_economy_mod: "Barki płynące po Dunaju i wozy wożące z kopalń utrzymują rynki królestwa wiecznie ożywione."
 STATIC_MODIFIER_NAME_hun_danube_empire_mod: "Imperium Dunajskie"
 STATIC_MODIFIER_DESC_hun_danube_empire_mod: "Wielonarodowe Imperium Dunajskie ze środkiem na wielkiej rzece ukończone. Podatki, ludność, administracja i efektywność legislacyjna osiągają swój szczyt."
 hun_transylvanian_mines: "Dolnowęgierskie miasta górnicze"
 hun_transylvanian_mines_desc: "Kremnica (Körmöcbánya) zawiera największą mennicę złota Węgier. Bańska Bystrzyca (Besztercebánya) sławna jest z największych kopalni miedzi Europy Środkowej. Zabezpieczenie tych dwóch miast czyni Węgry pierwszym państwem górniczym Europy Środkowej. Maciej Korwin zreorganizował ten region posiadaniem imperialnym w latach 1467-68, używając dochodów górniczych do finansowania Czarnej Armii."
 hun_silver_mines: "Kopalnie srebra Bańskiej Szczawnicy"
 hun_silver_mines_desc: "Region Hont (obejmujący Bańską Szczawnicę) jest największym okręgiem wydobycia srebra Dolnych Węgier. Srebro tej ziemi bito w talary w mennicy królewskiej, wspierając handel w całej Europie Środkowej. „Dolnowęgierskie miasta górnicze” są sercem ekonomicznym królestwa."
 hun_salt_mines: "Kopalnie soli Siedmiogrodu"
 hun_salt_mines_desc: "Sighet (Máramarossziget) i Turda wydobywały sól kamienną od starożytności. Sól niegdyś nazywano „białym złotem” — tak żywotnym towarem, że królewski monopol solny Węgier był krytycznym filarem finansów korony. Zabezpiecz te kopalnie soli i ustanów monopol na handel solą."
 hun_tokaj_wine: "Wina Tokaju"
 hun_tokaj_wine_desc: "Region tokajski wokół Sátoraljaújhely produkuje Tokaj Aszú — „Wino królów, król win”. Tak sławione, że papież Benedykt XIV podarował je Ludwikowi XV Francuskiemu, to wino szlachetnej pleśni ze wzgórz węgierskich — najsłynniejsze wino Europy. Rozwiń winnice i wywoź najlepsze wino Europy."
 hun_mining_empire: "Imperium górnicze"
 hun_mining_empire_desc: "Złoto Kremnicy, srebro Hontu, miedź Bańskiej Bystrzycy i sól Sighetu i Turdy — całe bogactwo mineralne Węgier jest teraz zabezpieczone. Jako pierwsze państwo górnicze Europy Środkowej, Węgry zyskują ogromny dochód z wywozu metali. To bogactwo finansowało Czarną Armię Macieja i chwałę jego renesansowego dworu."
 hun_buda_capital: "Rozwój Budy i Pesztu"
 hun_buda_capital_desc: "Buda i Peszt, stojące naprzeciw siebie przez Dunaj, są sercem Królestwa Węgier. Pałac królewski i wielki rynek Budy, port handlowy Pesztu — gdy to podwójne miasto prosperuje, całe Węgry kwitną. Dwór Macieja był największym w Europie i sławiony jako centrum środkowoeuropejskiego renesansu."
 hun_upper_hungary_cities: "Miasta Górnych Węgier"
 hun_upper_hungary_cities_desc: "Bratysława (Pozsony) strzeże zachodnich bram przeciw Habsburgom; Koszyce (Kassa) są największym miastem handlowym Górnych Węgier; Trnawa (Nagyszombat) jest siedzibą biskupią. Rozwój tych trzech miast czyni Górne Węgry (dzisiejszą Słowację) ekonomicznym i politycznym kręgosłupem północy."
 hun_pannonian_cities: "Miasta Panonii"
 hun_pannonian_cities_desc: "Győr (Rába) strzeże granicy austriackiej; Sopron (Ödenburg) jest bogatym miastem handlowym zachodnich Węgier; Peczuj (Fünfkirchen) zawiera jeden z najstarszych uniwersytetów Europy Środkowej, założony przez Ludwika I w 1367 roku. Rozwiń te miasta panońskie, by zachodnie Węgry prosperowały."
 hun_great_plain_cities: "Miasta Wielkiej Niziny"
 hun_great_plain_cities_desc: "Debreczyn (centrum węgierskiego kalwinizmu), Segedyn (klucz do rzeki Cisy), Kecskemét (miasto pasterskie Wielkiej Niziny) — rozwiń główne miasta węgierskiej puszty i otwórz potencjał rolniczy tego rozległego stepu. Bydło, owce i zboże Wielkiej Niziny staną się głównym eksportem Węgier."
 hun_transylvania_cities: "Miasta Siedmiogrodu"
 hun_transylvania_cities_desc: "Kluż (Kolozsvár) jest politycznym i kulturalnym sercem Siedmiogrodu; Oradea (Nagyvárad) jest wielkim miastem pielgrzymkowym, przechowującym relikwie Świętego Władysława; Miszkolc jest ośrodkiem przemysłowym północno-wschodnich Węgier. Włącz wielonarodowy region siedmiogrodzki poprzez rozwój miejski."
 hun_kingdom_of_cities: "Królestwo miast"
 hun_kingdom_of_cities_desc: "Złoto Kremnicy, srebro Hontu, wino Tokaju, dwór Budy, handel Koszyc, uniwersytet Peczuju, rolnictwo Debreczyna, kultura Klużu — każde miasto Królestwa Węgier działa w organicznej harmonii. Największa strefa gospodarcza Europy Środkowej ukończona. Dobrobyt miejski jest prawdziwym źródłem węgierskiej potęgi imperialnej."
 STATIC_MODIFIER_NAME_hun_kremnica_mint_mod: "Królewska mennica w Kremnicy"
 STATIC_MODIFIER_DESC_hun_kremnica_mint_mod: "Mennica w Kremnicy została założona przez Karola I Węgierskiego w 1328 roku w Körmöcbánya. Złoty „florin” (forint), bity tutaj, uważany był za równy jakością florynowi florenckiemu — i krążył od Bałtyku po Konstantynopol. Staranne standardy mennicy uczyniły ją pieniężnym kręgosłupem handlu środkowoeuropejskiego."
 STATIC_MODIFIER_NAME_hun_banska_copper_mod: "Kopalnie miedzi w Bańskiej Bystrzycy"
 STATIC_MODIFIER_DESC_hun_banska_copper_mod: "W szybach Bańskiej Bystrzycy dźwięk młotów rąbiących miedź nie milknie."
 STATIC_MODIFIER_NAME_hun_hont_silver_mod: "Kopalnie srebra Bańskiej Szczawnicy"
 STATIC_MODIFIER_DESC_hun_hont_silver_mod: "Srebro wydobyte z kopalni Hontu niesione jest do mennicy królewskiej."
 STATIC_MODIFIER_NAME_hun_salt_mine_mod: "Kopalnia soli kamiennej"
 STATIC_MODIFIER_DESC_hun_salt_mine_mod: "Galerie soli kamiennej, wykopane od czasów rzymskich, wciąż zasilają stoły królestwa."
 STATIC_MODIFIER_NAME_hun_tokaj_wine_mod: "Winnice Tokaju Aszú"
 STATIC_MODIFIER_DESC_hun_tokaj_wine_mod: "Winogrona szlachetnej pleśni, dojrzałe na wzgórzach Tokaju, podróżują do dworów wielu krain jako „wino królów”."
 STATIC_MODIFIER_NAME_hun_buda_capital_mod: "Stolica królewska Buda"
 STATIC_MODIFIER_DESC_hun_buda_capital_mod: "Z okien pałacu królewskiego w Budzie, patrzącego na Dunaj, żagle przepływających statków kupieckich są zawsze widoczne."
 STATIC_MODIFIER_NAME_hun_pest_trade_mod: "Port handlowy Peszt"
 STATIC_MODIFIER_DESC_hun_pest_trade_mod: "Na nabrzeżach Pesztu okrzyki tragarzy rozbrzmiewają od rana do nocy."
 STATIC_MODIFIER_NAME_hun_bratislava_gateway_mod: "Pozsony — miasto-brama"
 STATIC_MODIFIER_DESC_hun_bratislava_gateway_mod: "Bramy Pozsony stały się skrzyżowaniem, gdzie wozy jadące do Austrii i posłańcy królewscy przechodzą obok siebie."
 STATIC_MODIFIER_NAME_hun_kosice_commerce_mod: "Kassa — centrum handlowe"
 STATIC_MODIFIER_DESC_hun_kosice_commerce_mod: "Na rynku Kassy kupcy z Polski i Śląska rywalizują o towary Górnych Węgier."
 STATIC_MODIFIER_NAME_hun_pecs_university_mod: "Uniwersytet w Peczuju"
 STATIC_MODIFIER_DESC_hun_pecs_university_mod: "W celach uniwersytetu w Peczuju studenci, kontynuujący dziedzictwo Ludwika I, słuchają wykładów po łacinie."
 STATIC_MODIFIER_NAME_hun_gyor_fortress_mod: "Twierdza Győr"
 STATIC_MODIFIER_DESC_hun_gyor_fortress_mod: "Na murach Győru wartownicy, obserwujący granicę austriacką, trzymają pochodnie wysoko przez całą noc."
 STATIC_MODIFIER_NAME_hun_debrecen_agri_mod: "Miasto rolnicze Debreczyn"
 STATIC_MODIFIER_DESC_hun_debrecen_agri_mod: "Stada bydła i ładunki pszenicy, wyhodowane na Wielkiej Nizinie, nieustannie płyną na rynek Debreczyna."
 STATIC_MODIFIER_NAME_hun_szeged_trade_mod: "Port handlowy Segedyn"
 STATIC_MODIFIER_DESC_hun_szeged_trade_mod: "Segedyn, u zbiegu Cisy i Dunaju, rozwinięty węzłem handlu wewnętrznego."
 STATIC_MODIFIER_NAME_hun_cluj_center_mod: "Kluż — serce Siedmiogrodu"
 STATIC_MODIFIER_DESC_hun_cluj_center_mod: "Na rynkach i w szkołach Klużu głosy Niemców, Węgrów i Rumunów mieszają się."
 STATIC_MODIFIER_NAME_hun_oradea_pilgrimage_mod: "Nagyvárad — miasto pielgrzymkowe"
 STATIC_MODIFIER_DESC_hun_oradea_pilgrimage_mod: "Rzesze pielgrzymów z całego królestwa kierują się do katedry Nagyváradu, domu relikwii króla Świętego Władysława."
 STATIC_MODIFIER_NAME_hun_mining_empire_mod: "Imperium górnicze"
 STATIC_MODIFIER_DESC_hun_mining_empire_mod: "Złoto, srebro, miedź, sól — bogactwo wydobyte z kopalni królestwa przewyższa teraz każdą inną ziemię Europy Środkowej."
 STATIC_MODIFIER_NAME_hun_kingdom_of_cities_mod: "Królestwo miast"
 STATIC_MODIFIER_DESC_hun_kingdom_of_cities_mod: "Od Budy po Kluż rynki miast królestwa wymieniają towary jedne z drugimi i oddychają jedną wielką sferą gospodarczą."
 hun_secure_transylvania: "Opanowanie Siedmiogrodu"
 hun_secure_transylvania_desc: "Siedmiogród — od dawna rdzenne terytorium węgierskie — skupiony jest na dwóch wielkich miastach: Kluż i Braszów. Węgrzy, Sasi i Wołosi (Rumuni) współistnieją na tej ziemi. Z wystarczającymi zasobami skarbowymi zainwestuj w poważny rozwój Siedmiogrodu i podnieś jedno z dwóch jego wielkich miast do pełnego statusu miejskiego."
 hun_events.20.t: "Opanowanie Siedmiogrodu"
 hun_events.20.d: "Z zabezpieczonymi Klużem i Braszowem i zainwestowanymi ponad 1000 dukatami rozpoczyna się poważny program rozwoju Siedmiogrodu. Kluż (po łacinie Claudiopolis; po rumuńsku Cluj) jest największym miastem Siedmiogrodu; Braszów (po łacinie Corona; po niemiecku Kronstadt), zbudowany przez osadników saskich, jest handlową bramą do Wołoszczyzny. Które miasto otrzyma priorytet rozwoju — ta decyzja kształtuje przyszły kierunek Siedmiogrodu."
 hun_events.30.t: "Pacta Conventa — historyczny traktat z Chorwacją"
 hun_events.30.d: "W 1102 roku król Koloman Węgierski zawarł Pacta Conventa z przedstawicielami dwunastu chorwackich rodów szlacheckich. Szlachta chorwacka przyjęła króla węgierskiego za swego własnego suwerena; w zamian Chorwacja zachowała swą autonomię i tradycje prawne. Ponad dwa wieki po tym historycznym traktacie nadszedł czas, by wyjaśnić stosunki między Węgrami a Chorwacją. Czy Chorwacja powinna zostać formalnie włączona jako lenno, by wyjaśnić jej status prawny? Czy obecne elastyczne rozwiązanie powinno być zachowane? Wybór spoczywa na królu Węgier."
 hun_events.30.a: "Formalnie włączyć Chorwację jako lenno"
 hun_events.30.b: "Zachować obecne stosunki (+10 prestiżu)"
 hun_events.20.a: "Podnieść Kluż do statusu miasta (kosztuje 1000 dukatów)"
 hun_events.20.b: "Podnieść Braszów do statusu miasta (kosztuje 1000 dukatów)"
 STATIC_MODIFIER_NAME_hun_eternal_crown_mod: "Wieczna Korona Świętego Stefana"
 STATIC_MODIFIER_DESC_hun_eternal_crown_mod: "W Boże Narodzenie roku 1000 papież Sylwester II przesłał koronę Istvánowi, księciu Węgrów, czyniąc go Stefanem I — pierwszym królem Węgier. Ta korona — Święta Korona Świętego Stefana — zaczęła być postrzegana jako sama istota państwa węgierskiego: król bez niej w ogóle nie był królem Węgier. Teraz, po wiekach, dyplomaci z każdego zakątka świata odbywają pielgrzymkę na dwór Węgier, by uznać jego zwierzchnictwo."
