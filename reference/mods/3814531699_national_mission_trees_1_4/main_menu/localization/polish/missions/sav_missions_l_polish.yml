l_polish:
 sav_house_of_savoy_mission_pack: "Ambicje domu sabaudzkiego"
 sav_house_of_savoy_mission_pack_DESCRIPTION:0 "Dom sabaudzki, panujący nad przełęczami alpejskimi, jest przeznaczony wznieść się z małego piemonckiego księstwa, by rządzić całymi Włochami i Południową Francją i założyć Królestwo Włoch. Sprytnie manewruj między papieżem, cesarzem i Francją; zdobądź Genuę, by ustanowić potęgę morską; zmiażdż Lombardię, Toskanię i Wenecję, by zgłosić roszczenia do Rzymu. Powstań jako Sardynia-Piemont i wreszcie zostań chorążym zjednoczenia Włoch."
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Sabaudia-Piemont podbij Włochy i Francję i załóż Królestwo Włoch."
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by urzeczywistnić ambicje domu sabaudzkiego."
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS:0 "Przekrocz Alpy i zjednocz Włochy!"
 sav_the_savoy_ambition: "Ambicje Sabaudii"
 sav_the_savoy_ambition_desc: "Dom sabaudzki zajmuje szczególne miejsce na skrzyżowaniu Alp, z wpływem zarówno na Włochy, jak i Francję. Poprzez panowanie nad żyznymi ziemiami Piemontu i alpejskimi szlakami handlowymi to małe księstwo rozpoczyna swą drogę ku wielkości."
 sav_unify_piedmont: "Zjednocz Piemont"
 sav_unify_piedmont_desc: "Włączenie niezależnych potęg, takich jak Saluzzo i Monferrato, i zjednoczenie całego Piemontu — pierwszy krok ku wielkim ambicjom Sabaudii."
 sav_glory_of_turin: "Chwała Turynu"
 sav_glory_of_turin_desc: "Rozwiń Turyn, centralne miasto Piemontu, w kwitnącą metropolię, godną stolicy domu sabaudzkiego."
 sav_shroud_of_turin: "Całun Turyński"
 sav_shroud_of_turin_desc: "Lniane płótno, uważane za całun pogrzebowy Chrystusa, spoczywa w katedrze turyńskiej. Wiara w tę relikwię przynosi królestwu bogactwo i prestiż."
 sav_alpine_roads: "Drogi alpejskie"
 sav_alpine_roads_desc: "Rozwój infrastruktury drogowej wzdłuż alpejskich szlaków handlowych zwiększa zysk płynący do Sabaudii, gdy kupcy przechodzą między Francją a Włochami."
 sav_crossroads_of_europe: "Skrzyżowanie Europy"
 sav_crossroads_of_europe_desc: "Piemont, łączący Genuę, Wenecję i Francję, staje się jednym z czołowych węzłów handlowych Europy."
 sav_order_of_saints_maurice: "Zakon Świętych Maurycego i Łazarza"
 sav_order_of_saints_maurice_desc: "Zakon Świętych Maurycego i Łazarza, założony przez dom sabaudzki, staje się symbolem władzy religijnej i legitymizacji w świecie katolickim."
 sav_savoy_academy: "Akademia Sabaudii"
 sav_savoy_academy_desc: "Przyjęcie ducha renesansu i rozwój instytucji akademickich wokół Turynu ustanawia Sabaudię pewnym członkiem włoskiego kręgu kulturalnego."
 sav_alpine_powerhouse: "Potęga alpejska"
 sav_alpine_powerhouse_desc: "Poprzez zjednoczenie Piemontu, rozwój kulturalny i rosnącą potęgę gospodarczą Sabaudia uznana jest za znaczącą potęgę wokół Alp."
 sav_alpine_fortifications: "Umocnienia alpejskie"
 sav_alpine_fortifications_desc: "Pełne wykorzystanie naturalnej rzeźby Alp i budowa potężnych twierdz w strategicznych punktach czyni Sabaudię niezdobytym państwem górskim."
 sav_diplomatic_balance: "Równowaga dyplomatyczna"
 sav_diplomatic_balance_desc: "Dla Sabaudii, zaklinowanej między wielkimi potęgami, mistrzostwo dyplomatyczne jest niezbędne do przetrwania. Utrzymywanie wysokiego prestiżu dyplomatycznego zręcznie odwraca presję potężnych sąsiadów."
 sav_savoyard_army: "Wojsko sabaudzkie"
 sav_savoyard_army_desc: "Żołnierze sabaudzcy, zahartowani w poszarpanym terenie Alp, uważani są za jednych z najlepszych wojowników górskich Europy. Zbudowanie stałej armii wspiera niezależność wojskową królestwa."
 sav_conquer_genoa: "Podbij Genuę"
 sav_conquer_genoa_desc: "Podbój Genui, jednego z czołowych miast morskich Morza Śródziemnego, pozwala Sabaudii przezwyciężyć jej położenie lądowe i uczynić pierwszy krok ku potędze morskiej z bezpośrednim dostępem do Morza Śródziemnego."
 sav_nice_naval_base: "Baza morska Nicea"
 sav_nice_naval_base_desc: "Założenie bazy morskiej w Nicei na wybrzeżu śródziemnomorskim daje Sabaudii przyczółek do panowania nad Morzem Tyrreńskim."
 sav_sardinia_union: "Unia z Sardynią"
 sav_sardinia_union_desc: "Zajęcie większej części Sardynii i przyjęcie tytułu „Królestwo Sardynii” zyskuje domowi sabaudzkiemu uznanie za jeden ze znaczących domów królewskich Włoch."
 sav_seize_lombardy: "Zdobądź Lombardię"
 sav_seize_lombardy_desc: "Przywiedzenie Lombardii wokół Mediolanu pod kontrolę sabaudzką czyni Sabaudię panem Północnych Włoch."
 sav_push_tuscany: "Posuń się do Toskanii"
 sav_push_tuscany_desc: "Podporządkowanie bogatych miast-państw Toskanii pod przewodnictwem Florencji dodaje do terytorium sabaudzkiego rdzenną ziemię kultury renesansowej."
 sav_capture_venice: "Zdobądź Wenecję"
 sav_capture_venice_desc: "Podbój Wenecji, Królowej Adriatyku, ustanawia morską hegemonię Sabaudii w Północnych Włoszech."
 sav_emilia_and_beyond: "Emilia i dalej"
 sav_emilia_and_beyond_desc: "Zajęcie regionu Emilii i panowanie nad pozostałymi prowincjami Północnych Włoch czyni hegemonię sabaudzką absolutną."
 sav_march_on_naples: "Marsz na Neapol"
 sav_march_on_naples_desc: "Podbój Neapolu, kluczowego miasta Południowych Włoch, zbliża dopełnienie panowania nad półwyspem."
 sav_eternal_rome: "Wieczne Miasto"
 sav_eternal_rome_desc: "Panowanie nad Rzymem oznacza panowanie nad Włochami. Zająwszy Wieczne Miasto, Sabaudia pokazuje światu swą władzę prawowitego władcy Włoch."
 sav_integrate_geneva: "Włącz Genewę"
 sav_integrate_geneva_desc: "Przywiedzenie Genewy, z jej mocnymi więzami ze Związkiem Szwajcarskim, mocno pod kontrolę sabaudzką ustanawia przyczółek dla ekspansji na północ."
 sav_control_provence: "Opanuj Prowansję"
 sav_control_provence_desc: "Zajęcie Prowansji wzdłuż wybrzeża śródziemnomorskiego ustanawia hegemonię Sabaudii w Południowej Francji i otwiera drogę do większych ambicji."
 sav_against_the_swiss: "Przeciw Szwajcarom"
 sav_against_the_swiss_desc: "Stłumienie uparcie niezależnego Związku Szwajcarskiego i zajęcie Zachodniej Szwajcarii czyni Sabaudię panem ziem na zachód od Renu."
 sav_conquer_burgundy: "Podbij Burgundię"
 sav_conquer_burgundy_desc: "Podporządkowanie bogatych ziem, którymi niegdyś rządziło księstwo Burgundii, otwiera drogę do inwazji na Francję."
 sav_savoyard_occitania: "Sabaudzka Oksytania"
 sav_savoyard_occitania_desc: "Zajęcie ziem oksytańskojęzycznych i włączenie całej Południowej Francji do sabaudzkiego kręgu kulturalnego."
 sav_claim_france: "Zgłoś roszczenie do Francji"
 sav_claim_france_desc: "Nadszedł czas, by zająć Paryż, stolicę Królestwa Francji, i przywieść niegdyś zagrażającą Sabaudii wielką potęgę pod nasze rządy."
 sav_kingdom_of_italy: "Królestwo Włoch"
 sav_kingdom_of_italy_desc: "Dom sabaudzki przekroczył Alpy, by zjednoczyć całe Włochy, i jako dziedzic Cesarstwa Rzymskiego założył Królestwo Włoch. Marzenie Risorgimenta tu spełnione."
 STATIC_MODIFIER_NAME_sav_unified_piedmont_mod: "Zjednoczenie Piemontu"
 STATIC_MODIFIER_DESC_sav_unified_piedmont_mod: "Piemont — „podnóże gór” — żyzna równina, otoczona Alpami i Apeninami, którą rządzili panowie Sabaudii, Monferrato, Saluzzo i inni. Tylko poprzez ich zjednoczenie Sabaudia może w pełni opanować skrzyżowanie, łączące Alpy z rzeką Pad."
 STATIC_MODIFIER_NAME_sav_shroud_of_turin_mod: "Błogosławieństwo Całunu"
 STATIC_MODIFIER_DESC_sav_shroud_of_turin_mod: "Całun Turyński — lniane płótno, które, jak się uważa, owijało Chrystusa po ukrzyżowaniu, niosąc cienisty odcisk ludzkiego ciała. Odkąd dom sabaudzki zdobył go w 1353 roku, jest czczony jako jedna z największych relikwii świata katolickiego. Debaty o jego autentyczności trwają, lecz jego religijny i polityczny wpływ jest niepodważalny."
 STATIC_MODIFIER_NAME_sav_alpine_roads_mod: "Drogi alpejskie"
 STATIC_MODIFIER_DESC_sav_alpine_roads_mod: "Wielka Przełęcz Świętego Bernarda, Mont Cenis i Świętego Gotarda — drogi przez Alpy były głównymi arteriami Europy od czasów rzymskich po średniowiecze. Sabaudia, pan tych przełęczy, stała się niezmiernie bogata poprzez cła i handel. Jej rola „strażnika Alp” była korzeniem jej dobrobytu."
 STATIC_MODIFIER_NAME_sav_crossroads_mod: "Skrzyżowanie Europy"
 STATIC_MODIFIER_DESC_sav_crossroads_mod: "Piemont leży na samym skrzyżowaniu Francji, Szwajcarii, Genui i Mediolanu. Kupcy włoscy w drodze na jarmarki szampańskie, pielgrzymi francuscy w drodze do Rzymu, najemnicy w drodze do Szwajcarii — ludzie i towary wszelkiego rodzaju przechodzili przez Piemont, a nadzorując drogę, Sabaudia monopolizowała zyski z handlu pośredniczącego."
 STATIC_MODIFIER_NAME_sav_order_of_saints_mod: "Zakon Świętych Maurycego i Łazarza"
 STATIC_MODIFIER_DESC_sav_order_of_saints_mod: "Zakon Świętych Maurycego i Łazarza połączył dwa zakony założone przez dom sabaudzki w latach 1434 i 1572, odpowiednio. Święty Maurycy był chrześcijańskim męczennikiem epoki rzymskiej; Święty Łazarz był czczony jako patron trędowatych. Zakon stał się symbolem religijnej władzy domu sabaudzkiego w świecie katolickim."
 STATIC_MODIFIER_NAME_sav_savoy_academy_mod: "Wpływ Akademii Sabaudii"
 STATIC_MODIFIER_DESC_sav_savoy_academy_mod: "W epoce renesansu księstwo Sabaudii znane było z mecenatu nauki i sztuki. Założony w 1404 roku Uniwersytet Turyński stał się duchowym centrum Piemontu, ucząc prawa, medycyny i teologii. Tradycja mecenatu artystycznego, która później doprowadzi do Accademia delle Belle Arti za Karola Emanuela I, również zakorzeniona była w tej epoce."
 STATIC_MODIFIER_NAME_sav_alpine_powerhouse_mod: "Potęga alpejska"
 STATIC_MODIFIER_DESC_sav_alpine_powerhouse_mod: "„Mały, lecz silny” — siła Sabaudii leżała w mądrym wykorzystaniu jej geografii. Otoczona wielkimi potęgami Francją, Austrią i Hiszpanią, przetrwała dzięki zręcznej dyplomacji i strategii wojskowej, wykorzystującej naturę ziemi, i wreszcie stała się „dynastią przeznaczenia”, która poprowadziła zjednoczenie Włoch."
 STATIC_MODIFIER_NAME_sav_alpine_fortifications_mod: "Umocnienia alpejskie"
 STATIC_MODIFIER_DESC_sav_alpine_fortifications_mod: "Rozmieściwszy grupy twierdz, takich jak Briançon, Fenestrelle i Exilles, w naturalnych bastionach Alp, Sabaudia wykuła „tarczę Alp”. W XVII-XVIII wieku przyszły twierdze bastionowe w stylu Vaubana, by strzec tych przełęczy, czyniąc Sabaudię jednym z najbardziej niezdobytych państw Europy."
 STATIC_MODIFIER_NAME_sav_diplomatic_balance_mod: "Równowaga dyplomatyczna"
 STATIC_MODIFIER_DESC_sav_diplomatic_balance_mod: "Istotą dyplomacji sabaudzkiej było „zawsze być po stronie najsilniejszego”. Balansując na linie między Francją a Austrią, Sabaudia zdobyła Sardynię na mocy Pokoju Utrechckiego (1713) i wzniosła się do rangi królestwa. Wiktor Amadeusz II uosabiał szczyt tej „równoważącej” dyplomacji."
 STATIC_MODIFIER_NAME_sav_savoyard_army_mod: "Elita sabaudzka"
 STATIC_MODIFIER_DESC_sav_savoyard_army_mod: "Żołnierze sabaudzcy byli mistrzami wojny górskiej, wykutymi w surowym terenie Alp. Reformy wojskowe Piemontu XIV-XV wieku ustanowiły „Ordinanza Piemontese”, a zdyscyplinowana taktyka piechoty stała się siłą armii sabaudzkiej. Nawet w późniejszym Risorgimento byli oparciem wyzwolenia Północnych Włoch."
 STATIC_MODIFIER_NAME_sav_conquer_genoa_mod: "Zajęcie Genui"
 STATIC_MODIFIER_DESC_sav_conquer_genoa_mod: "Genua, rywal Wenecji, była jednym z największych średniowiecznych miast-państw morskich Morza Śródziemnego, rozpościerającym ogromną sieć handlową po Morzu Czarnym, Afryce Północnej i Iberii. Była też kolebką bankowości (Bank św. Jerzego jest jednym z najstarszych na świecie) i ubezpieczeń. Podbój tej „dumnej republiki” otwiera Sabaudii drzwi Morza Śródziemnego."
 STATIC_MODIFIER_NAME_sav_nice_naval_base_mod: "Baza morska Nicea"
 STATIC_MODIFIER_DESC_sav_nice_naval_base_mod: "Nicea (Nizza Marittima) — starożytny port śródziemnomorski, założony przez kolonię greckiej Massalii (Marsylii). Odkąd dom sabaudzki zdobył ją w 1388 roku, ten port na granicy Francji i Włoch służył jako jedyna baza morska Sabaudii (pozostawał sabaudzki do 1860 roku)."
 STATIC_MODIFIER_NAME_sav_sardinia_union_mod: "Unia z Sardynią"
 STATIC_MODIFIER_DESC_sav_sardinia_union_mod: "W 1720 roku, w przebudowach po Pokoju Utrechckim, dom sabaudzki wymienił Sycylię na Sardynię i wzniósł się „Królestwem Sardynii”. Unia tej wyspy z kontynentalnym Piemontem stanie się podstawą, od której Camillo Cavour i Garibaldi osiągną zjednoczenie Włoch (1861)."
 STATIC_MODIFIER_NAME_sav_seize_lombardy_mod: "Zajęcie Lombardii"
 STATIC_MODIFIER_DESC_sav_seize_lombardy_mod: "Równina lombardzka jest jedną z najżyźniejszych ziem uprawnych Europy, a Mediolan jest jej centrum przemysłu i handlu. Odzyskanie tej bogatej, długo dzierżonej przez Austrię ziemi było głównym celem Risorgimenta — konkretnym ucieleśnieniem marzenia Sabaudii."
 STATIC_MODIFIER_NAME_sav_push_tuscany_mod: "Posunięcie do Toskanii"
 STATIC_MODIFIER_DESC_sav_push_tuscany_mod: "Toskania, wokół Florencji, jest kolebką kultury renesansowej, przechowującą największe dziedzictwo artystyczne w historii ludzkości. Uffizi, katedra, wiersze Dantego — wszystko wspierane przez Medyceuszy. Dodanie tego skarbu kulturalnego do swego terytorium dałoby Królestwu Sabaudii władzę duchową."
 STATIC_MODIFIER_NAME_sav_capture_venice_mod: "Zajęcie Wenecji"
 STATIC_MODIFIER_DESC_sav_capture_venice_mod: "Wenecja, „Królowa Adriatyku”, jest cudownym miastem-państwem, które zachowało swą niezależność przez ponad tysiąc lat. Miasto kanałów, zbudowane na wyspach laguny, rządziło poprzez monopol na handel wschodni i wybitną sztukę budowy okrętów, Arsenale, jako pan Morza Śródziemnego. Podbić to niezdobyte miasto byłoby wielkim czynem historii."
 STATIC_MODIFIER_NAME_sav_emilia_and_beyond_mod: "Emilia i dalej"
 STATIC_MODIFIER_DESC_sav_emilia_and_beyond_mod: "Bolonia, Parma, Modena i Ferrara, ustawione wzdłuż Via Emilia, były znane od średniowiecza jako centra jedzenia, kultury i nauki. Bolonia przechowuje najstarszy uniwersytet Europy (założony w 1088 roku), a jej tradycja duchowa pogłębiłaby kulturalną głębię Królestwa Sabaudii."
 STATIC_MODIFIER_NAME_sav_march_on_naples_mod: "Marsz na Neapol"
 STATIC_MODIFIER_DESC_sav_march_on_naples_mod: "Tak piękny, że dał powód do przysłowia „Zobaczyć Neapol i umrzeć”, to miasto prosperowało od starożytności jako jedno z wielkich miast Morza Śródziemnego. Neapol, który przeżył burzliwą historię pod rządami andegaweńskimi, aragońskimi, hiszpańskimi i burbońskimi, był ostatnią wielką przeszkodą zjednoczenia Włoch."
 STATIC_MODIFIER_NAME_sav_eternal_rome_mod: "Wieczne Miasto"
 STATIC_MODIFIER_DESC_sav_eternal_rome_mod: "„Wszystkie drogi prowadzą do Rzymu” — stolica starożytnego Cesarstwa Rzymskiego, siedziba Kościoła katolickiego, centrum kultury renesansowej, Rzym jest symbolem cywilizacji zachodniej. Koloseum, Panteon, bazylika Świętego Piotra — uczynić miasto takiej wagi historycznej swoją własną stolicą oznacza dopełnienie zjednoczenia Włoch."
 STATIC_MODIFIER_NAME_sav_integrate_geneva_mod: "Włączenie Genewy"
 STATIC_MODIFIER_DESC_sav_integrate_geneva_mod: "Genewa niegdyś stała pod wpływem hrabiów sabaudzkich, lecz w 1536 roku Jan Kalwin uczynił z niej bazę Reformacji i stała się „protestanckim Rzymem”. Ponowne włączenie tego jeziornego miasta byłoby ważnym przyczółkiem dla ekspansji sabaudzkiej ku Szwajcarii."
 STATIC_MODIFIER_NAME_sav_control_provence_mod: "Panowanie nad Prowansją"
 STATIC_MODIFIER_DESC_sav_control_provence_mod: "Prowansja była niegdyś posiadłością domu Andegawenów i została przyłączona do korony francuskiej po śmierci króla Renata (1480). Pola lawendy, gaje oliwne i winnice wybrzeża śródziemnomorskiego — ta bogata ziemia Południowej Francji byłaby kluczem do znacznej ekspansji terytorialnej Sabaudii."
 STATIC_MODIFIER_NAME_sav_against_the_swiss_mod: "Przeciw Szwajcarom"
 STATIC_MODIFIER_DESC_sav_against_the_swiss_mod: "Związek Szwajcarski jest krajem nieujarzmionych górskich wojowników, którzy rozbili Karola Śmiałego, księcia Burgundii, w latach 1476-77 pod Grandson i Murten. Podporządkować tego potężnego sąsiada nie jest łatwym zadaniem, lecz dla Sabaudii, która używała szwajcarskich najemników (lansknechtów) jako straży pałacowej, opanowanie ich ojczyzny byłoby największym zwycięstwem wojskowym."
 STATIC_MODIFIER_NAME_sav_conquer_burgundy_mod: "Podbój Burgundii"
 STATIC_MODIFIER_DESC_sav_conquer_burgundy_mod: "Burgundia, młodsza gałąź Valois, u swego szczytu rządziła ogromnym „Królestwem Środkowym”, rozciągającym się od Niderlandów po Burgundię. Ponownie przyłączona do Francji ze śmiercią Karola Śmiałego (1477), ta bogata, słynna z wina i kuchni prowincja stałaby się ważnym przyczółkiem dla inwazji na Francję."
 STATIC_MODIFIER_NAME_sav_savoyard_occitania_mod: "Sabaudzka Oksytania"
 STATIC_MODIFIER_DESC_sav_savoyard_occitania_mod: "Ludy oksytańskojęzyczne Południowej Francji zrodziły kulturę trubadurów, lecz zostały spustoszone przez Krucjatę Albigensów z XIII wieku. Pogrzebana pod prześladowaniem katarów i rządami korony francuskiej, tradycja oksytańskiego samorządu ożywa pod sztandarem Sabaudii."
 STATIC_MODIFIER_NAME_sav_claim_france_mod: "Roszczenie do Francji"
 STATIC_MODIFIER_DESC_sav_claim_france_mod: "Francja zawsze była dla Sabaudii zarówno zagrożeniem, jak i pokusą. W epoce Napoleona (urodzonego jako Korsykanin, lecz sąsiad Nicei) Sabaudia została wchłonięta przez Francję. Teraz jest odwrotnie — wielki zwrot, w którym Sabaudia zdobywa tron króla francuskiego dla siebie."
 STATIC_MODIFIER_NAME_sav_kingdom_of_italy_mod: "Królestwo Włoch"
 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "17 marca 1861 roku Wiktor Emanuel II (król Sardynii) wstąpił jako pierwszy król Królestwa Włoch — tak się stało w rzeczywistej historii. Największy cud polityczny XIX wieku, łączący dyplomację Cavoura, oręż Garibaldiego i ideały Mazziniego, osiągnięty tutaj cztery wieki wcześniej."
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "Chwała Turynu"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "Otwarty rynek „Balon”, wzgórza Langhe, dające Barolo i Barbaresco, wspaniały plac San Carlo — Turyn jest stolicą, którą dom sabaudzki ukształtował w wiodące miasto planowe Włoch. Jako dziedzic siatki rzymskiego Augusta Taurinorum to miasto ukazuje najdelikatniejsze oblicze na południe od Alp."
 sav_events.1.t: "Ambicje domu sabaudzkiego"
 sav_events.1.d: "Księstwo Sabaudii panuje nad strategicznymi przełęczami Alp, łączącymi Północną i Południową Europę. Z Francją i Włochami po obu stronach to małe księstwo budzi się do wielkich ambicji. Herb Sabaudii — biały krzyż na szkarłatnej tarczy — pewnego dnia będzie powiewał nad całymi Włochami. Zjednocz Piemont, zdobądź Genuę, zajmij Rzym i załóż Królestwo Włoch — tysiącletnie marzenie domu sabaudzkiego gotowe się rozpocząć."
 sav_events.1.a: "Wznieś chwałę domu sabaudzkiego!"
 sav_events.2.t: "Chwała Turynu"
 sav_events.2.d: "Pod rządami domu sabaudzkiego Turyn szybko się rozwija. Z pałacami i kościołami wznoszącymi się po całym mieście oraz uczonymi i artystami gromadzącymi się tutaj to miasto występuje jako kulturalne i polityczne centrum Północnych Włoch. Rozkwit Turynu jako stolicy, godnej domu sabaudzkiego, staje się podstawą dobrobytu całego królestwa."
 sav_events.2.a: "Turyn — jaśniejąca stolica domu sabaudzkiego"
 sav_woolens_of_piedmont: "Przemysł wełniany Piemontu"
 sav_woolens_of_piedmont_desc: "Piemont znany jest jako jeden z czołowych producentów wełny i sukna Włoch. Wysokiej jakości produkcja wełny i obróbka sukna tworzą podstawę handlową bogactwa sabaudzkiego."
 sav_nebbiolo_vineyards: "Winnice Nebbiolo"
 sav_nebbiolo_vineyards_desc: "Winogrona Nebbiolo, uprawiane na wzgórzach Langhe w Piemoncie, są źródłem takich słynnych win jak Barolo i Barbaresco. Wina piemonckie wywożone są po całej Europie, przynosząc wielki zysk."
 sav_casa_savoia: "Władza domu sabaudzkiego"
 sav_casa_savoia_desc: "Rządy domu sabaudzkiego umocniły się, a jego władza jest teraz szeroko uznawana w kraju i za granicą. Prawowite, stabilne rządy są podstawą, która wznosi Sabaudię do rangi znaczącej potęgi włoskiej."
 sav_ordinanza_piedmontese: "Ordinanza Piemontese"
 sav_ordinanza_piedmontese_desc: "W XV wieku Sabaudia ustanowiła swoistą taktykę piechoty — Ordinanza Piemontese — wykutą w wysokogórskich Alpach. Zdyscyplinowane formacje pikinierskie są kręgosłupem siły wojskowej Sabaudii."
 sav_university_of_turin: "Uniwersytet Turyński"
 sav_university_of_turin_desc: "Założony w 1404 roku, Uniwersytet Turyński służy jako duchowe serce Piemontu, ucząc prawa, medycyny i teologii. Duchowe dziedzictwo Sabaudii wspiera rozkwit kultury renesansowej."
 sav_corsica_seized: "Korsyka zajęta"
 sav_corsica_seized_desc: "Zajęcie Korsyki, długo rządzonej przez Genuę, znacznie posuwa rządy Sabaudii nad zachodnim Morzem Tyrreńskim."
 sav_towers_of_sardinia: "Wieże Sardynii"
 sav_towers_of_sardinia_desc: "Od średniowiecza niezliczone wieże strażnicze (Torre Costiera) ustawiają się wzdłuż wybrzeża sardyńskiego. Rozwój i umocnienie tych obiektów obronnych chroni Sardynię przed najazdami piratów."
 sav_cagliari_development: "Rozwój Cagliari"
 sav_cagliari_development_desc: "Rozwiń Cagliari, stolicę Sardynii, w ważne miasto portowe i węzeł handlowy zachodniego Morza Śródziemnego."
 sav_tyrrhenian_sea: "Pan Morza Tyrreńskiego"
 sav_tyrrhenian_sea_desc: "Zająwszy zarówno Korsykę, jak i Sardynię, i zbudowawszy potężną flotę, Sabaudia ustanowiła pełne panowanie nad Morzem Tyrreńskim. Handel zachodniego Morza Śródziemnego wchodzi pod ochronę sabaudzką."
 sav_languedoc: "Panowanie nad Langwedocją"
 sav_languedoc_desc: "Zajęcie Langwedocji, kluczowego punktu Południowej Francji. Zajęcie dwóch wielkich miast Montpellier i Tuluzy staje się przyczółkiem do panowania nad całą Południową Francją."
 sav_gascony: "Gaskonia zajęta"
 sav_gascony_desc: "Gaskonia, wokół Bordeaux, jest bogatą ziemią winiarską, zwróconą ku Atlantykowi. Zerwij jej długi związek historyczny z Anglią i dodaj tę ziemię do terytorium sabaudzkiego."
 sav_lyon_gateway: "Brama Lyonu"
 sav_lyon_gateway_desc: "Położony u zbiegu Rodanu i Saony, Lyon jest węzłem handlowym, łączącym Południową i Północną Francję. Zajęcie tego miasta otwiera drogę do wnętrza Francji."
 sav_loire_valley: "Dolina Loary"
 sav_loire_valley_desc: "Dolina Loary — „Ogród Francji” — gdzie niegdyś stały zamki francuskiej rodziny królewskiej. Zajęcie Nantes i Tours oznacza podbój zachodnio-centralnej Francji."
 sav_normandy_coast: "Wybrzeże normandzkie"
 sav_normandy_coast_desc: "Zajęcie Normandii, historycznego brzegu, gdzie niegdyś wylądowali Normanowie. Rouen, w sercu tej bogatej ziemi, jest kluczowym punktem Północnej Francji i ostatnim rubieżem przed Paryżem."
 STATIC_MODIFIER_NAME_sav_woolens_of_piedmont_mod: "Przemysł wełniany Piemontu"
 STATIC_MODIFIER_DESC_sav_woolens_of_piedmont_mod: "Piemont był wybitnym regionem wełny, którego owce trzymały się wysokich alpejskich łąk. Okręg Biella w szczególności był znany od średniowiecza po dziś dzień jako jedno z najlepszych źródeł wełny i cienkiego sukna w Europie, a „wełna piemoncka” stała obok wełny angielskiej znakiem najwyższej jakości."
 STATIC_MODIFIER_NAME_sav_nebbiolo_vineyards_mod: "Winnice Nebbiolo"
 STATIC_MODIFIER_DESC_sav_nebbiolo_vineyards_mod: "Z winogron Nebbiolo, uprawianych na wzgórzach Langhe w Piemoncie, rodzą się Barolo, „król win”, i Barbaresco, „wino królowej”. Zapisy o jego uprawie sięgają XIII wieku, a cenione było nawet na dworze sabaudzkim — duma Piemontu, wciąż kochana na całym świecie szczytem win włoskich."
 STATIC_MODIFIER_NAME_sav_casa_savoia_mod: "Władza domu sabaudzkiego"
 STATIC_MODIFIER_DESC_sav_casa_savoia_mod: "Dom sabaudzki jest jedną z najtrwalszych dynastii Europy, wywodzącą swoje pochodzenie od Humberta Białoręki w XI wieku. Jego ponad siedemsetletnie przetrwanie „najstarszą dynastią”, która ostatecznie stała się domem królewskim Królestwa Włoch, ukazuje wytrzymałość rzadką w historii europejskich domów królewskich."
 STATIC_MODIFIER_NAME_sav_ordinanza_piedmontese_mod: "Ordinanza Piemontese"
 STATIC_MODIFIER_DESC_sav_ordinanza_piedmontese_mod: "„Ordinanza Piemontese”, zorganizowana przez księstwo Sabaudii w XV wieku, była zdyscyplinowanym stałym systemem wojskowym, skupionym na piechocie pikinierskiej. Opierając się na taktyce szwajcarskich najemników, dodając własne udoskonalenia, stała się podstawą późniejszej armii sardyńskiej i zwiastunem armii, które poprowadziły wojny zjednoczeniowe Risorgimenta."
 STATIC_MODIFIER_NAME_sav_university_of_turin_mod: "Wpływ Uniwersytetu Turyńskiego"
 STATIC_MODIFIER_DESC_sav_university_of_turin_mod: "Założony w 1404 roku, Uniwersytet Turyński jest jednym z najstarszych uniwersytetów Północnych Włoch. Zaczynając od trzech wydziałów — prawa, medycyny i teologii — później wydał znaczących umysłów, takich jak Cesare Beccaria (reformator prawa karnego) i Lagrange (matematyk), i stał się duchowym sercem oświeconego Piemontu."
 STATIC_MODIFIER_NAME_sav_corsica_seized_mod: "Korsyka zajęta"
 STATIC_MODIFIER_DESC_sav_corsica_seized_mod: "Korsyka jest kluczem do zachodniego Morza Śródziemnego, którą Genua rządziła od 1284 roku. Gdy Genua sprzedała ją Francji w 1768 roku, Napoleon Bonaparte urodził się w następnym roku „Francuzem” — ironia historii. Zajęcie tej wyspy zapewniłoby panowanie nad zachodnim Morzem Tyrreńskim."
 STATIC_MODIFIER_NAME_sav_towers_of_sardinia_mod: "Wieże Sardynii"
 STATIC_MODIFIER_DESC_sav_towers_of_sardinia_mod: "Wzdłuż wybrzeży Sardynii rozsiane są „torri costiere” (wieże przybrzeżne), zbudowane od średniowiecza po wczesną epokę nowożytną. Ten system obronny, wzniesiony do obserwacji najazdów berberyjskich, u swego szczytu liczył ponad sto wież i służył jako sieć alarmowa, ostrzegająca mieszkańców wyspy przed niebezpieczeństwem."
 STATIC_MODIFIER_NAME_sav_cagliari_development_mod: "Dobrobyt Cagliari"
 STATIC_MODIFIER_DESC_sav_cagliari_development_mod: "Cagliari (Karalis) jest miastem portowym, założonym przez Fenicjan, i ważnym centrum administracyjnym epoki rzymskiej. Jako stolica Sardynii, w środku Morza Śródziemnego, stało się węzłem handlowym z Tunisem, Hiszpanią i Włochami i pozostawało kluczowym punktem handlu zachodniośródziemnomorskiego pod rządami aragońskimi."
 STATIC_MODIFIER_NAME_sav_tyrrhenian_sea_mod: "Pan Morza Tyrreńskiego"
 STATIC_MODIFIER_DESC_sav_tyrrhenian_sea_mod: "Morze Tyrreńskie jest morzem wewnętrznym Morza Śródziemnego, otoczonym półwyspem włoskim, Sycylią, Korsyką i Sardynią — historycznym morzem, na którym handlowali starożytni Fenicjanie, Grecy i Rzymianie. Panowanie nad Korsyką i Sardynią pozwala panować nad całym tym morzem wewnętrznym i zdobyć przyczółek do posuwania się na wschodnie Morze Śródziemne."
 STATIC_MODIFIER_NAME_sav_languedoc_mod: "Panowanie nad Langwedocją"
 STATIC_MODIFIER_DESC_sav_languedoc_mod: "Langwedocja („ziemia języka oc”) oznacza oksytańskojęzyczny region Południowej Francji. Ten region, ze stolicą Tuluzą, szczycił się własną kulturą, polityką i religią (katarami), dopóki nie został podbity przez koronę francuską w Krucjacie Albigensów w XIII wieku. Jego tlenie, wraz z Prowansją, wciąż tli się swoistą cywilizacją południa Francji."
 STATIC_MODIFIER_NAME_sav_gascony_mod: "Gaskonia zajęta"
 STATIC_MODIFIER_DESC_sav_gascony_mod: "Gaskonia to region Południowo-Zachodniej Francji o pochodzeniu baskijskim, znany atlantyckim winiarskim Bordeaux, portem Bayonne i armaniakiem. Ściśle związana z Anglią od czasów małżeństwa Eleonory Akwitańskiej, była także ostatnim głównym polem bitwy Wojny Stuletniej."
 STATIC_MODIFIER_NAME_sav_lyon_gateway_mod: "Brama Lyonu"
 STATIC_MODIFIER_DESC_sav_lyon_gateway_mod: "Lyon (Lugdunum) został założony jako stolica rzymskiej prowincji Galii i jest skrzyżowaniem komunikacji. W średniowieczu posiadał największe regularne jarmarki Francji po szampańskich, gdzie gromadzili się kupcy z Włoch, Flandrii i Niemiec. Jego położenie u zbiegu Rodanu i Saony zapewniło mu rangę miasta handlowego geograficzną koniecznością."
 STATIC_MODIFIER_NAME_sav_loire_valley_mod: "Dolina Loary"
 STATIC_MODIFIER_DESC_sav_loire_valley_mod: "W dolinie Loary, „Ogrodzie Francji”, stoją renesansowe zamki, takie jak Chambord, Chenonceau i Amboise. Królowie francuscy XV-XVI wieku kochali ten region za jego łagodniejszy klimat niż w Paryżu, bogate zapasy i bezpieczeństwo obrony. Panowanie nad tą piękną ziemią oznacza utrzymanie centrum kultury francuskiej."
 STATIC_MODIFIER_NAME_sav_normandy_coast_mod: "Wybrzeże normandzkie"
 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "Normandia to ziemia, którą wikingowie (Normanowie) otrzymali od króla francuskiego w 911 roku. Inwazja Wilhelma Zdobywcy na Anglię w 1066 roku, największe pole bitwy Wojny Stuletniej, lądowanie w Normandii w 1944 roku — ta ziemia zawsze była punktem zwrotnym historii. W Rouen została również stracona Joanna d’Arc."
 sav_events.3.t: "Utworzenie Sardynii-Piemontu"
 sav_events.3.d: "Zająwszy prawie całą Sardynię, dom sabaudzki postanowił formalnie przyjąć tytuł „Króla Sardynii”. W historii (1720) Sabaudia zdobyła Sardynię w wyniku wojny o sukcesję hiszpańską i założyła „Królestwo Sardynii”. To podwójne królestwo Sardynia-Piemont stanie się kolebką zjednoczenia Włoch. Poprzez zjednoczenie kontynentalnego Piemontu z wyspą Sardynią to królestwo wystąpi jako znacząca potęga Północnych Włoch."
 sav_events.3.a: "Stań się jako król Sardynii chorążym zjednoczenia Włoch!"
 sav_franchises: "Wolności sabaudzkie"
 sav_franchises_desc: "W średniowiecznym Piemoncie dom sabaudzki nadawał różnym miastom prawa miejskie, znane jako „wolności”. Poprzez gwarancję swobody przemieszczania się, wyzwolenia chłopów i rozszerzonych praw handlowych dla kupców ten system ożywia rywalizację miejską i wzrost Piemontu. Ukończenie tej misji pozwala na nadanie prowincjom prawa miejskiego „Wolności sabaudzkie”."
 sav_franchises_unlock_tt: "Przywilej miejski „Wolności” staje się dostępny."
 sav_patria_legis: "Sabaudia-Dolina Aosty"
 sav_patria_legis_desc: "„Patria Legis” łączy odziedziczone praktyki samorządu Doliny Aosty z ideałami rządowymi domu sabaudzkiego w racjonalną strukturę prawną, odzwierciedlającą ducha renesansu. Ukończenie tej misji pozwala na nadanie prowincjom prawa miejskiego „Sabaudia-Dolina Aosty”."
 sav_patria_legis_unlock_tt: "Przywilej miejski „Patria Legis” staje się dostępny."
 franchises: "Wolności"
 franchises_desc: "Prawa miejskie, ustanowione przez dom sabaudzki, gwarantujące swobodę przemieszczania się ludności, wyzwolenie chłopów i rozszerzone prawa handlowe dla kupców."
 patria_legis: "Patria Legis"
 patria_legis_desc: "Prawa miejskie, łączące tradycje Doliny Aosty z sabaudzkimi zasadami prawnymi, przynoszące dobrobyt miejski, mobilność społeczną i efektywność produkcyjną."
