l_polish:
 bra_brandenburg_mission_pack: "Krew i żelazo — od Brandenburgii do Cesarstwa Niemieckiego"
 bra_brandenburg_mission_pack_DESCRIPTION:0 "Od małej marchii domu askańskiego zbuduj Królestwo Prus pod Hohenzollernami i osiągnij zjednoczenie Niemiec krwią i żelazem."
 bra_brandenburg_mission_pack_CRITERIA_DESCRIPTION:0 "Ustanów marchię, utwórz Królestwo Prus i ukończ Cesarstwo Niemieckie."
 bra_brandenburg_mission_pack_BUTTON_TOOLTIP:0 "Od piaskownicy Świętego Cesarstwa Rzymskiego do hegemona Europy."
 bra_brandenburg_mission_pack_BUTTON_DETAILS:0 "Wielkie kwestie dnia nie rozstrzygają się mowami ani większością głosów, lecz krwią i żelazem — zjednocz Niemcy!"
 bra_ascanian_legacy: "Dziedzictwo Askańczyków"
 bra_ascanian_legacy_desc: "Odziedzicz marchię brandenburską zbudowaną przez dom askański i rozpocznij nową erę rządów."
 bra_march_authority: "Ustanów władzę margrabiego"
 bra_march_authority_desc: "Ujarzmij rozdrobnione ziemie szlacheckie i pozwól, by władza margrabiego dotarła do całego kraju."
 bra_turmoil_ended_tt: "Katastrofa „Niepokoje w Brandenburgii” dobiegła końca"
 bra_altmark_secure: "Zabezpiecz Altmarkię"
 bra_altmark_secure_desc: "Altmarkia, ojczyzna marchii — uczyń jej rządy niewzruszonymi."
 bra_neumark_colonization: "Kolonizuj Nową Marchię"
 bra_neumark_colonization_desc: "Posuń kolonizację na wschód do Nowej Marchii za Odrą i zbuduj nowe osady."
 bra_uckermark_integration: "Włącz Uckermark"
 bra_uckermark_integration_desc: "Całkowicie włącz Uckermark do marchii."
 bra_pomeranian_rivalry: "Rywalizacja z Pomorzem"
 bra_pomeranian_rivalry_desc: "Rozwiąż rywalizację z księstwem pomorskim o dostęp do Bałtyku."
 bra_wendish_lands: "Ziemie wendyjskie"
 bra_wendish_lands_desc: "Ta ziemia jest domem Kaszubów, potomków słowiańskich Wendów — przyjmij ich kulturę z tolerancją i pogłęb ich zrozumienie obyczajów niemieckich, pokazując, że oba narody mogą współistnieć."
 bra_berlin_dev: "Rozwiń Berlin"
 bra_berlin_dev_desc: "Berlin, miasteczko nad Sprewą, które wyrosło w serce marchii po unii z Kolonią — rozwiń je dalej."
 bra_electoral_dignity: "Godność elektorska"
 bra_electoral_dignity_desc: "Ustanów swój status elektora Świętego Cesarstwa Rzymskiego i podnieś swój prestiż w nim."
 bra_hohenzollern_investiture: "Inwestytura Hohenzollernów"
 bra_hohenzollern_investiture_desc: "W 1417 roku cesarz Zygmunt nadał tytuł elektorski domowi Hohenzollernów — ustanów rządy tej nowej dynastii."
 bra_hohenzollern_dynasty: "Dynastia Hohenzollernów zabezpieczona"
 bra_hohenzollern_dynasty_desc: "Uczyń krew hohenzollerńską filarem państwa i połóż fundament pod długotrwałe rządy."
 bra_imperial_diet: "Głos w Sejmie Rzeszy"
 bra_imperial_diet_desc: "Wzmocnij swój głos w Sejmie Rzeszy i przyjmij rolę w polityce cesarskiej."
 bra_reformation_choice: "Wybór Reformacji"
 bra_reformation_choice_desc: "Nauka Lutra wstrząsa całymi Niemcami — Brandenburgia również musi wybrać swą wiarę."
 bra_secularize_prussia: "Zsekularyzuj Prusy"
 bra_secularize_prussia_desc: "Zachęć sekularyzację państwa Zakonu Krzyżackiego i przywiedź Prusy pod wpływ Brandenburgii."
 bra_cleves_inheritance: "Dziedzictwo Kliwii"
 bra_cleves_inheritance_desc: "Wygraj wojnę o sukcesję jülichską nad Renem i zabezpiecz zachodnią eksklawę."
 bra_thirty_years_war: "Przetrwaj Wojnę Trzydziestoletnią"
 bra_thirty_years_war_desc: "Wojna Trzydziestoletnia pustoszy Niemcy — przetrwaj tę klęskę i zachowaj marchię."
 bra_great_elector: "Rządy Wielkiego Elektora"
 bra_great_elector_desc: "Pod Fryderykiem Wilhelmem, później zwanym „Wielkim Elektorem”, odbuduj siłę państwa."
 bra_standing_army: "Ustanów stałą armię"
 bra_standing_army_desc: "Stwórz stałą armię, podległą bezpośrednio elektorowi, niezależną od milicji szlacheckich."
 bra_absolutism: "Ustanów absolutyzm"
 bra_absolutism_desc: "Ujarzmij władzę stanów i zbuduj państwo, gdzie wola elektora dociera do każdego zakątka."
 bra_sovereign_prussia: "Suwerenność nad Prusami"
 bra_sovereign_prussia_desc: "Poprzez traktat oliwski zrzuć zwierzchnictwo polskie nad księstwem Prus."
 bra_king_in_prussia: "Ukoronowany Królem w Prusach"
 bra_king_in_prussia_desc: "W 1701 roku w Królewcu Fryderyk I koronował się „Królem w Prusach”."
 bra_prussian_administration: "Administracja pruska"
 bra_prussian_administration_desc: "Ustanów wydajną i zdyscyplinowaną biurokrację i podąż ścieżką do nowoczesnego państwa."
 bra_junker_integration: "Włącz junkrów"
 bra_junker_integration_desc: "Przywiedź posiadłościową szlachtę junkrów na wschód od Łaby w rdzeń armii i administracji."
 bra_potsdam_dev: "Rozwiń Poczdam"
 bra_potsdam_dev_desc: "Rozwiń Poczdam, siedzibę rezydencji królewskiej, w centrum kultury dworskiej."
 bra_soldier_king: "Dziedzictwo Króla-Żołnierza"
 bra_soldier_king_desc: "Odziedzicz oszczędne, zmilitaryzowane dziedzictwo Fryderyka Wilhelma I, „Króla-Żołnierza”."
 bra_royal_treasury: "Pełen skarbiec królewski"
 bra_royal_treasury_desc: "Poprzez oszczędne zarządzanie finansami zbuduj jeden z najpełniejszych skarbców Europy."
 bra_silesian_ambition: "Ambicje wobec Śląska"
 bra_silesian_ambition_desc: "Zgłoś prawowite roszczenie do bogatego Śląska, rządzonego przez dom Habsburgów."
 bra_first_silesian_war: "Pierwsza wojna śląska"
 bra_first_silesian_war_desc: "Młody Fryderyk II maszeruje na Śląsk błyskawiczną inwazją."
 bra_silesia_annexed: "Śląsk zaanektowany"
 bra_silesia_annexed_desc: "Całkowicie zaanektuj bogaty region górniczy i przemysłowy Śląska jako podstawę gospodarczą Prus."
 bra_prussian_enlightenment: "Pruskie Oświecenie"
 bra_prussian_enlightenment_desc: "Myśl oświecona rozkwita pod Fryderykiem Wielkim — urzeczywistnij ideał, że „król jest pierwszym sługą państwa”."
 bra_seven_years_war: "Przetrwaj Wojnę Siedmioletnią"
 bra_seven_years_war_desc: "Wojna Siedmioletnia stawia przeciw tobie całą Europę — przetrwaj tę próbę i obroń swój status wielkiej potęgi."
 bra_frederick_the_great: "Dziedzictwo Fryderyka Wielkiego"
 bra_frederick_the_great_desc: "Nieś dziedzictwo wielkiego króla, wspominanego jako „Fryderyk Wielki”, w następną epokę."
 bra_partitions_of_poland: "Weź udział w rozbiorach Polski"
 bra_invasion_of_poland: "Inwazja na Polskę"
 bra_invasion_of_poland_desc: "Wprowadź nasze siły do Wielkopolski i wykrój terytorium od tego osłabionego sąsiada."
 bra_partitions_of_poland_desc: "Dołącz do rozbioru upadającej Rzeczpospolitej Obojga Narodów i zdobądź Prusy Zachodnie."
 bra_prussian_academy: "Pruska Akademia Nauk"
 bra_prussian_academy_desc: "Uprawiaj Berlińską Akademię Nauk i stań się centrum nauki i uczoności."
 bra_prussian_army_reform: "Reforma armii pruskiej"
 bra_prussian_army_reform_desc: "Jakość czy ilość — określ charakter armii pruskiej i zakorzeń swoistą doktrynę wojskową w państwie."
 bra_napoleonic_crisis: "Kryzys napoleoński"
 bra_napoleonic_crisis_desc: "Klęska pod Jeną-Auerstedt — przed Napoleonem Prusy stoją przed kryzysem przetrwania."
 bra_stein_hardenberg_reforms: "Reformy Steina-Hardenberga"
 bra_stein_hardenberg_reforms_desc: "Nadszedł czas, by podważyć fundamenty finansowe wciąż górującej Francji — poprzez uwolnienie chłopów pańszczyźnianych i reformę administracyjną osiągnij odrodzenie z kryzysu."
 bra_rhineland_acquisition: "Zdobądź Nadrenię"
 bra_rhineland_acquisition_desc: "Zdobądź bogate ziemie wzdłuż Renu i połóż fundament pod uprzemysłowienie."
 bra_show_of_strength: "Pokaz siły"
 bra_show_of_strength_desc: "Zanim wyciągniesz rękę po wielkie przestrzenie Niemiec, pokaż potęgę Prus książętom północy."
 bra_lower_saxony_conquest: "Podbij Dolną Saksonię"
 bra_lower_saxony_conquest_desc: "Rozbij naszych rywali w Lüneburgu i Magdeburgu, zabezpiecz port Emden w Holsztynie i rozszerz nasz zasięg po całej Dolnej Saksonii."
 bra_westphalian_conquest: "Podbój westfalski"
 bra_westphalian_conquest_desc: "Rozszerz naszą hegemonię nad Niemcami Północnymi dalej na zachód, na ziemie Westfalii."
 bra_zollverein: "Związek Celny"
 bra_zollverein_desc: "Poprowadź Związek Celny (Zollverein), gospodarczo jednoczący państwa niemieckie."
 bra_prussian_constitution: "Konstytucja pruska"
 bra_prussian_constitution_desc: "Ustanów podstawy monarchii konstytucyjnej poprzez konstytucję z 1850 roku."
 bra_army_reform_1860s: "Reforma wojskowa lat 60. XIX wieku"
 bra_army_reform_1860s_desc: "Reformy wojskowe Roona i Moltkego — udoskonal wcześniej wybraną doktrynę wojskową jakości lub ilości do jeszcze większych wyżyn."
 bra_danish_war: "Wojna przeciw Danii"
 bra_danish_war_desc: "Chwyć za broń przeciwko Danii z powodu kwestii szlezwicko-holsztyńskiej."
 bra_austro_prussian_war: "Wojna austriacko-pruska"
 bra_austro_prussian_war_desc: "Rozwiąż kwestię w bitwie pod Sadową i wygraj przywództwo nad Niemcami."
 bra_north_german_confederation: "Związek Północnoniemiecki"
 bra_north_german_confederation_desc: "Zjednocz państwa niemieckie na północ od Menu, z wyjątkiem Austrii, i ustanów Związek Północnoniemiecki."
 bra_south_german_states: "Sojusz z państwami południowoniemieckimi"
 bra_south_german_states_desc: "Wykuj sojusze wojskowe z południowoniemieckimi państwami Bawarii, Wirtembergii i innymi."
 bra_franco_prussian_war: "Wojna francusko-pruska"
 bra_franco_prussian_war_desc: "Sprowokowana depeszą emską, przyjmij decydującą wojnę przeciwko Drugiemu Cesarstwu Francuskiemu."
 bra_alsace_lorraine_annexed: "Alzacja-Lotaryngia zaanektowane"
 bra_alsace_lorraine_annexed_desc: "Zaanektuj Alzację i Lotaryngię jako łup wojenny, zapisując wieczną wrogość z Francją."
 bra_german_empire: "Cesarstwo Niemieckie ustanowione"
 bra_german_empire_desc: "Ustanów Cesarstwo Niemieckie z królem Prus jako cesarzem, najnowszą wielką potęgą Europy."
 bra_kulturkampf: "Kulturkampf"
 bra_kulturkampf_desc: "Ujarzmij wpływ Kościoła Katolickiego i przedefiniuj stosunki między państwem a kościołem."
 bra_social_legislation: "Ustawodawstwo ubezpieczeń społecznych"
 bra_social_legislation_desc: "Ustanów systemy ubezpieczeń zdrowotnych, wypadkowych i starczych jako przeciwwagę dla socjalizmu."
 bra_colonial_empire: "Imperium kolonialne"
 bra_colonial_empire_desc: "Szukając „miejsca pod słońcem”, zbuduj kolonie w Afryce i na Pacyfiku."
 bra_high_seas_fleet: "Flota Pełnego Morza"
 bra_high_seas_fleet_desc: "Pod dowództwem admirała Tirpitza zbuduj Flotę Pełnego Morza, zdolną rywalizować z Brytanią."
 bra_weltpolitik: "Weltpolitik"
 bra_weltpolitik_desc: "Pod sztandarem „polityki światowej” Wilhelma II zajmij swoje miejsce wśród wielkich potęg świata."
 bra_berlin_metropolis: "Wielki Berlin ukończony"
 bra_berlin_metropolis_desc: "Rozwiń Berlin w metropolię światową, zdolną rywalizować z Paryżem i Londynem."
 bra_ruhr_industry_complete: "Przemysł Zagłębia Ruhry ukończony"
 bra_ruhr_industry_complete_desc: "Doprowadź potęgę przemysłową Zagłębia Ruhry do granic, stając się jedną z wielkich potęg przemysłu ciężkiego świata."
 bra_german_science: "Wzniesienie się nauki niemieckiej"
 bra_german_science_desc: "Zbuduj złoty wiek nauki niemieckiej, prowadząc świat w fizyce i chemii."
 bra_naval_race: "Wyścig morski"
 bra_naval_race_desc: "Wygraj wyścig zbrojeń morskich z Brytanią i pokaż potęgę morską, zdolną rywalizować ze światem."
 bra_balkan_influence: "Wpływ na Bałkanach"
 bra_balkan_influence_desc: "Poprzez naszego austriackiego sojusznika rozszerz wpływ na Półwysep Bałkański."
 bra_ottoman_partnership: "Partnerstwo z Osmanami"
 bra_ottoman_partnership_desc: "Zawrzyj sojusz z „chorym człowiekiem” Europy, Imperium Osmańskim, jako przyczółkiem na Wschód."
 bra_mitteleuropa: "Mitteleuropa"
 bra_mitteleuropa_desc: "Promuj wizję „Mitteleuropy”, jednoczącą Europę Środkową w niemiecką sferę gospodarczą."
 bra_grossdeutschland: "Wielkie Niemcy"
 bra_grossdeutschland_desc: "Wreszcie urzeczywistnij ideał „Wielkich Niemiec”, obejmujący również Austrię."
 bra_hegemon_of_europe: "Hegemon Europy"
 bra_hegemon_of_europe_desc: "Ustanów niekwestionowaną hegemonię nad Europą zarówno w gospodarce, sile militarnej, jak i dyplomacji."
 bra_second_reich_eternal: "Drugie Cesarstwo wieczne"
 bra_second_reich_eternal_desc: "Od małej marchii granicznej do imperium rządzącego Europą — historia domu Hohenzollernów osiąga swe dopełnienie."
 bra_events.1.t: "Król w Prusach"
 bra_events.1.d: "18 stycznia 1701 roku w Królewcu Fryderyk I koronował się „Królem w Prusach”. Elektor brandenburski jest teraz sam królem."
 bra_events.1.a: "Chwała Królowi! Królestwo Prus ustanowione!"
 bra_events.2.t: "Proklamacja w Wersalu"
 bra_events.2.d: "18 stycznia 1871 roku w Sali Lustrzanej w Wersalu król Wilhelm I Pruski został ogłoszony Cesarzem Niemieckim. Era podziałów skończona, a zjednoczone Cesarstwo Niemieckie narodzone."
 bra_events.2.a: "Chwała Cesarzowi! Chwała Cesarstwu Niemieckiemu!"
 bra_events.99.t: "Drugie Cesarstwo wieczne"
 bra_events.99.d: "Długa droga, rozpoczęta małą marchią domu askańskiego, osiągnęła swoje przeznaczenie. Pod Hohenzollernami Niemcy panują teraz imperium, któremu nie ma równych w Europie."
 bra_events.99.a: "Chwała Niemcom! Chwała Drugiemu Cesarstwu!"
 STATIC_MODIFIER_NAME_bra_ascanian_mod: "Dziedzictwo Askańczyków"
 STATIC_MODIFIER_DESC_bra_ascanian_mod: "Pamięć o Askańczykach, których niedźwiedzi herb niegdyś znaczył marchie, pozostaje wyryta w kamieniach zamków granicznych."
 STATIC_MODIFIER_NAME_bra_march_mod: "Władza margrabiego ustanowiona"
 STATIC_MODIFIER_DESC_bra_march_mod: "Edykty opieczętowane pieczęcią margrabiego idą od posiadłości do posiadłości, a nawet panowie podporządkowują się teraz."
 STATIC_MODIFIER_NAME_bra_altmark_mod: "Altmarkia zabezpieczona"
 STATIC_MODIFIER_DESC_bra_altmark_mod: "Obrony Altmarkii, ojczyzny marchii, wzmocnione."
 STATIC_MODIFIER_NAME_bra_neumark_mod: "Nowa Marchia skolonizowana"
 STATIC_MODIFIER_DESC_bra_neumark_mod: "Za Odrą niemieccy osadnicy wbijają swe pługi w dzikie ziemie Nowej Marchii."
 STATIC_MODIFIER_NAME_bra_pomerania_mod: "Rywalizacja z Pomorzem"
 STATIC_MODIFIER_DESC_bra_pomerania_mod: "Długa waśń z książętami Pomorza nauczyła panów marchii, jak rządzić podbitą ziemią."
 STATIC_MODIFIER_NAME_bra_uckermark_mod: "Uckermark włączony"
 STATIC_MODIFIER_DESC_bra_uckermark_mod: "Żyzne ziemie Uckermarku figurują teraz w księgach poborców podatkowych margrabiego."
 STATIC_MODIFIER_NAME_bra_berlin_mod: "Berlin rozwinięty"
 STATIC_MODIFIER_DESC_bra_berlin_mod: "Berlin prosperuje jako serce marchii."
 STATIC_MODIFIER_NAME_bra_electoral_mod: "Godność elektorska"
 STATIC_MODIFIER_DESC_bra_electoral_mod: "Posłowie noszący pieczęć elektora zajmują teraz miejsca obok książąt na dworze cesarza."
 STATIC_MODIFIER_NAME_bra_hohenzollern_mod: "Inwestytura Hohenzollernów"
 STATIC_MODIFIER_DESC_bra_hohenzollern_mod: "Rodzina, zrodzona z burgrabiów Norymbergi, podnosi teraz sztandar nowej dynastii w zamkach Brandenburgii."
 STATIC_MODIFIER_NAME_bra_dynasty_mod: "Dynastia zabezpieczona"
 STATIC_MODIFIER_DESC_bra_dynasty_mod: "Krew Hohenzollernów uznana jest teraz za niekwestionowaną władzę zarówno na zamkach granicznych, jak i na dworze."
 STATIC_MODIFIER_NAME_bra_diet_mod: "Głos w sejmie"
 STATIC_MODIFIER_DESC_bra_diet_mod: "Na Sejmie Rzeszy w Ratyzbonie książęta słuchają uważnie, gdy przemawia poseł Brandenburgii."
 STATIC_MODIFIER_NAME_bra_reformation_mod: "Wybór Reformacji"
 STATIC_MODIFIER_DESC_bra_reformation_mod: "Pod elektorem, który przyjął naukę Lutra, jego poddani uczą się tolerancji dla różnic wiary."
 STATIC_MODIFIER_NAME_bra_secularize_mod: "Prusy zsekularyzowane"
 STATIC_MODIFIER_DESC_bra_secularize_mod: "Dochody ziem, niegdyś biskupstw, zarządzane są teraz przez własnych urzędników elektora."
 STATIC_MODIFIER_NAME_bra_cleves_mod: "Dziedzictwo Kliwii"
 STATIC_MODIFIER_DESC_bra_cleves_mod: "Zachodnia eksklawa Kliwii przynosi nowe bogactwo skarbowi."
 STATIC_MODIFIER_NAME_bra_thirty_years_mod: "Próba Wojny Trzydziestoletniej"
 STATIC_MODIFIER_DESC_bra_thirty_years_mod: "Doświadczenie przetrwania wojny stało się kluczem do obrony ojczyzny."
 STATIC_MODIFIER_NAME_bra_great_elector_mod: "Rządy Wielkiego Elektora"
 STATIC_MODIFIER_DESC_bra_great_elector_mod: "Imię Wielkiego Elektora, zwycięzcy pod Fehrbellin, stało się samą władzą dynastii."
 STATIC_MODIFIER_NAME_bra_standing_army_mod: "Stała armia stworzona"
 STATIC_MODIFIER_DESC_bra_standing_army_mod: "Żołnierze stałej armii, przysięgający jedynie elektorowi, dzień po dniu ćwiczą na placach Poczdamu."
 STATIC_MODIFIER_NAME_bra_absolutism_mod: "Absolutyzm ustanowiony"
 STATIC_MODIFIER_DESC_bra_absolutism_mod: "Rozkazy króla idą teraz z dworu w Berlinie do rad wiejskich każdego zakątka państwa."
 STATIC_MODIFIER_NAME_bra_sovereign_mod: "Suwerenność pruska"
 STATIC_MODIFIER_DESC_bra_sovereign_mod: "Książę Prus, który zrzucił niegdyś należną królowi polskiemu przysięgę, jest teraz przyjmowany na obcych dworach jako równy suweren."
 STATIC_MODIFIER_NAME_bra_administration_mod: "Administracja pruska"
 STATIC_MODIFIER_DESC_bra_administration_mod: "Księgi i regulacje sporządzane przez pisarzy Generalnej Dyrekcji wspierają zarządzanie każdym zakątkiem królestwa."
 STATIC_MODIFIER_NAME_bra_junker_mod: "Junkrzy włączeni"
 STATIC_MODIFIER_DESC_bra_junker_mod: "Junkrzy działają teraz jako rdzeń armii i administracji."
 STATIC_MODIFIER_NAME_bra_potsdam_mod: "Poczdam rozwinięty"
 STATIC_MODIFIER_DESC_bra_potsdam_mod: "Rezydencja królewska Poczdam prosperuje jako centrum kultury dworskiej."
 STATIC_MODIFIER_NAME_bra_soldier_king_mod: "Dziedzictwo Króla-Żołnierza"
 STATIC_MODIFIER_DESC_bra_soldier_king_mod: "Oszczędność i surowa dyscyplina, przekazane przez Króla-Żołnierza, wciąż przylegają do samych murów koszar."
 STATIC_MODIFIER_NAME_bra_treasury_mod: "Pełny skarbiec"
 STATIC_MODIFIER_DESC_bra_treasury_mod: "W oszczędnych skarbcach królewskich wysoko piętrzą się skrzynie srebra na nadchodzące wojny."
 STATIC_MODIFIER_NAME_bra_silesian_ambition_mod: "Ambicje wobec Śląska"
 STATIC_MODIFIER_DESC_bra_silesian_ambition_mod: "Oficerowie marzący o żyznych dolinach Śląska niecierpliwie czekają na rozkaz wymarszu."
 STATIC_MODIFIER_NAME_bra_first_silesian_mod: "Pierwsza wojna śląska"
 STATIC_MODIFIER_DESC_bra_first_silesian_mod: "Maszerując błyskawicznie przez śnieg, armia stała pod murami Breslau, zanim Austria zdążyła zakończyć mobilizację."
 STATIC_MODIFIER_NAME_bra_silesia_mod: "Śląsk zaanektowany"
 STATIC_MODIFIER_DESC_bra_silesia_mod: "Bogactwo, zrodzone z pieców hutniczych i warsztatów Śląska, nieustannie płynie do skarbca Berlina."
 STATIC_MODIFIER_NAME_bra_enlightenment_mod: "Pruskie Oświecenie"
 STATIC_MODIFIER_DESC_bra_enlightenment_mod: "Ideały Oświecenia, rozprzestrzeniające się z dworu Sanssouci, zwielokrotniają szkoły na wsiach."
 STATIC_MODIFIER_NAME_bra_seven_years_mod: "Próba Wojny Siedmioletniej"
 STATIC_MODIFIER_DESC_bra_seven_years_mod: "Doświadczenie walki przeciwko całej Europie wykuło dyscyplinę wojskową."
 STATIC_MODIFIER_NAME_bra_frederick_mod: "Dziedzictwo Fryderyka Wielkiego"
 STATIC_MODIFIER_DESC_bra_frederick_mod: "Imię Fryderyka Wielkiego przekazywane jest zarówno jako duma żołnierza, jak i chwała państwa."
 STATIC_MODIFIER_NAME_bra_partitions_mod: "Rozbiory Polski"
 STATIC_MODIFIER_DESC_bra_partitions_mod: "Pruscy urzędnicy i geodeci przenoszą się jeden po drugim do wsi Prus Zachodnich, zdobytych w rozbiorach."
 STATIC_MODIFIER_NAME_bra_academy_mod: "Pruska Akademia"
 STATIC_MODIFIER_DESC_bra_academy_mod: "Wykłady uczonych, zgromadzonych w akademii Berlina, przyciągają studentów z całego kraju."
 STATIC_MODIFIER_NAME_bra_invasion_poland_mod: "Inwazja na Polskę"
 STATIC_MODIFIER_DESC_bra_invasion_poland_mod: "Niemieckie szyldy i biura powstają jeden po drugim w podbitych miastach Wielkopolski."
 STATIC_MODIFIER_NAME_bra_napoleonic_mod: "Kryzys napoleoński"
 STATIC_MODIFIER_DESC_bra_napoleonic_mod: "Doświadczenie przezwyciężenia kryzysu staje się podstawą obrony ojczyzny."
 STATIC_MODIFIER_NAME_bra_reforms_mod: "Reformy Steina-Hardenberga"
 STATIC_MODIFIER_DESC_bra_reforms_mod: "Reformy Steina i Hardenberga uwolniły chłopa z poddaństwa i otworzyły drzwi do służby państwowej."
 STATIC_MODIFIER_NAME_bra_rhineland_mod: "Nadrenia zdobyta"
 STATIC_MODIFIER_DESC_bra_rhineland_mod: "Podatki, płynące z bogatych miast i kopalni węgla wzdłuż Renu, cieszą skarbników Berlina."
 STATIC_MODIFIER_NAME_bra_show_of_strength_mod: "Pokaz siły"
 STATIC_MODIFIER_DESC_bra_show_of_strength_mod: "Książęta Niemiec Północnych, ujrzawszy szyk wojsk na placu berlińskim, odeszli bez zbędnych słów."
 STATIC_MODIFIER_NAME_bra_lower_saxony_mod: "Dolna Saksonia podbita"
 STATIC_MODIFIER_DESC_bra_lower_saxony_mod: "Zwycięstwo armii pruskiej na równinach Hanoweru przekreśliło mapę Niemiec Północnych."
 STATIC_MODIFIER_NAME_bra_westphalia_mod: "Westfalia podbita"
 STATIC_MODIFIER_DESC_bra_westphalia_mod: "Burmistrzowie miast westfalskich zaczęli podążać za wskazówkami urzędników z Berlina."
 STATIC_MODIFIER_NAME_bra_zollverein_mod: "Związek Celny"
 STATIC_MODIFIER_DESC_bra_zollverein_mod: "Na granicach związku celnego wozy przejeżdżają, nie czekając na podniesienie szlabanu."
 STATIC_MODIFIER_NAME_bra_constitution_mod: "Konstytucja pruska"
 STATIC_MODIFIER_DESC_bra_constitution_mod: "Role parlamentu i monarchy, ustalone w artykułach konstytucji, przyniosły nowy porządek w praktyce polityki."
 STATIC_MODIFIER_NAME_bra_danish_war_mod: "Wojna przeciw Danii"
 STATIC_MODIFIER_DESC_bra_danish_war_mod: "Triumfalny powrót pruskich żołnierzy, którzy szturmowali okopy pod Dybbøl, przyspieszył unię Szlezwiku i Holsztynu."
 STATIC_MODIFIER_NAME_bra_austro_prussian_war_mod: "Wojna austriacko-pruska"
 STATIC_MODIFIER_DESC_bra_austro_prussian_war_mod: "Na polu pod Sadową karabin tylnokomorowy obalił wszystko, co żołnierze uważali za zasady wojny."
 STATIC_MODIFIER_NAME_bra_north_confederation_mod: "Związek Północnoniemiecki"
 STATIC_MODIFIER_DESC_bra_north_confederation_mod: "W dniu, gdy flaga Związku Północnoniemieckiego po raz pierwszy zawisła nad pałacem berlińskim, posłowie państw poznali, że nastała nowa era."
 STATIC_MODIFIER_NAME_bra_south_german_mod: "Sojusz z południem"
 STATIC_MODIFIER_DESC_bra_south_german_mod: "Posłowie, przechowujący pakt z Prusami, teraz chodzą tam i z powrotem nawet na dworach Bawarii i Wirtembergii."
 STATIC_MODIFIER_NAME_bra_franco_prussian_mod: "Wojna francusko-pruska"
 STATIC_MODIFIER_DESC_bra_franco_prussian_mod: "W noc, gdy wieść o zwycięstwie pod Sedanem dotarła do Berlina, każda ulica ogarnięta była radością."
 STATIC_MODIFIER_NAME_bra_alsace_mod: "Alzacja-Lotaryngia zaanektowane"
 STATIC_MODIFIER_DESC_bra_alsace_mod: "Kominy alzackich fabryk tekstylnych i kopalni żelaza napędzają przemysł nowego Cesarstwa Niemieckiego."
 STATIC_MODIFIER_NAME_bra_kulturkampf_mod: "Kulturkampf"
 STATIC_MODIFIER_DESC_bra_kulturkampf_mod: "Nowe instytucje, uformowane po walce państwa z kościołem, przekreśliły granice między urzędami państwa a parafiami."
 STATIC_MODIFIER_NAME_bra_social_mod: "Ustawodawstwo ubezpieczeń społecznych"
 STATIC_MODIFIER_DESC_bra_social_mod: "Robotnicy, stojący w kolejkach po zasiłki chorobowe i starcze, wiedzą, że państwo ich nie opuści."
 STATIC_MODIFIER_NAME_bra_colonial_mod: "Imperium kolonialne"
 STATIC_MODIFIER_DESC_bra_colonial_mod: "Na pokładach parowców, płynących do kolonii Afryki i Mórz Południowych, stoją osadnicy marzący o nowym świecie."
 STATIC_MODIFIER_NAME_bra_fleet_mod: "Flota Pełnego Morza"
 STATIC_MODIFIER_DESC_bra_fleet_mod: "Z kominów pancerników, ustawionych w porcie wojennym Kilonii, unosi się dym determinacji, by strzec szlaków handlowych."
 STATIC_MODIFIER_NAME_bra_weltpolitik_mod: "Polityka światowa"
 STATIC_MODIFIER_DESC_bra_weltpolitik_mod: "Mapy w ministerstwie spraw zagranicznych Berlina odzwierciedlają teraz politykę światową, rozciągającą się od Afryki po Azję."
 STATIC_MODIFIER_NAME_bra_berlin_metropolis_mod: "Wielki Berlin ukończony"
 STATIC_MODIFIER_DESC_bra_berlin_metropolis_mod: "Metropolia światowa Berlin lśni centrum dobrobytu i rządów."
 STATIC_MODIFIER_NAME_bra_ruhr_complete_mod: "Przemysł Zagłębia Ruhry ukończony"
 STATIC_MODIFIER_DESC_bra_ruhr_complete_mod: "Piece hutnicze Ruhry wypluwają ogień dzień i noc, wysyłając niemiecką stal na świat."
 STATIC_MODIFIER_NAME_bra_science_mod: "Wzniesienie się nauki niemieckiej"
 STATIC_MODIFIER_DESC_bra_science_mod: "Odkrycia, zrodzone w laboratoriach Getyngi i Berlina, uczyniły Niemcy centrum nauki światowej."
 STATIC_MODIFIER_NAME_bra_naval_race_mod: "Wyścig morski"
 STATIC_MODIFIER_DESC_bra_naval_race_mod: "Na stoczniach Wilhelmshaven już położono stępkę następnego pancernika."
 STATIC_MODIFIER_NAME_bra_balkan_mod: "Wpływ na Bałkanach"
 STATIC_MODIFIER_DESC_bra_balkan_mod: "Sprawy bałkańskie, codziennie omawiane przez dyplomatów Wiednia i Berlina, coraz ściślej wiążą dwóch sojuszników."
 STATIC_MODIFIER_NAME_bra_ottoman_mod: "Partnerstwo z Osmanami"
 STATIC_MODIFIER_DESC_bra_ottoman_mod: "Z każdą milą zbudowanej Kolei Bagdadzkiej więzi między Berlinem a Konstantynopolem pogłębiają się."
 STATIC_MODIFIER_NAME_bra_mitteleuropa_mod: "Mitteleuropa"
 STATIC_MODIFIER_DESC_bra_mitteleuropa_mod: "Wizja jednolitej sfery gospodarczej w Europie Środkowej cicho rozprzestrzenia się nawet wśród kupców i urzędników sąsiednich krajów."
 STATIC_MODIFIER_NAME_bra_grossdeutschland_mod: "Wielkie Niemcy"
 STATIC_MODIFIER_DESC_bra_grossdeutschland_mod: "„Gdzie jest ojczyzna Niemca?” — stare pytanie, śpiewane od Wiednia po Berlin, wreszcie znajduje swą odpowiedź."
 STATIC_MODIFIER_NAME_bra_hegemon_mod: "Hegemon Europy"
 STATIC_MODIFIER_DESC_bra_hegemon_mod: "Żaden dwór Europy nie może już podjąć ważnej decyzji, nie poznawszy najpierw woli Berlina."
 STATIC_MODIFIER_NAME_bra_king_in_prussia_mod: "Król w Prusach"
 STATIC_MODIFIER_DESC_bra_king_in_prussia_mod: "Od dnia koronacji w kaplicy zamkowej Królewca, dwór pruski zaczął kuć ceremoniał królestwa."
 STATIC_MODIFIER_NAME_bra_second_reich_mod: "Drugie Cesarstwo wieczne"
 STATIC_MODIFIER_DESC_bra_second_reich_mod: "Od proklamacji, ogłoszonej w Sali Lustrzanej w Wersalu, korona Hohenzollernów wzniosła się, by jaśnieć na szczycie Europy."
