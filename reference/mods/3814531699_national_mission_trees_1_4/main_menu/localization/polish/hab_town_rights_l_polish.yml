l_polish:
 wiener_stadtrecht_town_rights: "Prawo miejskie Wiednia"
 wiener_stadtrecht_town_rights_desc: "Szczególne prawo miejskie, nadawane wyłącznie Wiedniowi — poprawia dostęp do rynku, siłę centrum handlowego i pojemność kupców. Może być nadane wyłącznie Wiedniowi."
 landstadt_town_rights: "Landstadt"
 landstadt_town_rights_desc: "Prawo miejskie nadawane miastom cesarskim — wzmacnia władzę korony i stanu szlacheckiego, poprawiając zasięg administracyjny ze stolicy."
