l_turkish:
 bra_quality_doctrine_reform: "Seçkin Silahlar Doktrini"
 bra_quality_doctrine_reform_desc: "Küçük ve seçkin bir güce dayanan askeri doktrin: üstün askerler ve ustaca yönetilen seferberlik birlikleri, daha küçük bir ordunun daha büyüğüne karşı durmasını sağlar. Bakımı pahalıdır ama muharebe gücü eşsizdir."
 bra_quantity_doctrine_reform: "Genel Seferberlik Doktrini"
 bra_quantity_doctrine_reform_desc: "“Prusya, ordusu olan bir devlet değil, devleti olan bir ordudur”: kaliteden çok nicelik esasına dayanan, düşmanı salt sayı üstünlüğüyle ezen bir doktrin. Bakımı ucuzdur, ancak disiplin ve moral bir miktar zarar görür."
 bra_advanced_quality_doctrine_reform: "Auftragstaktik"
 bra_advanced_quality_doctrine_reform_desc: "“Görev esaslı taktik”: sahadaki komutanlara özerk karar yetkisi vererek duruma uygun hızlı hareketi mümkün kılan bir doktrin. Piyadeden topçuya her sınıfta eşsiz yetkinliğe sahip bir ordu, kalite yoluyla ezici bir üstünlük kurar. Bakım ve insan gücü maliyeti yüksektir, ancak hiçbir ordu muharebe gücünde onunla boy ölçüşemez."
 bra_advanced_quantity_doctrine_reform: "Silahlı Millet"
 bra_advanced_quantity_doctrine_reform_desc: "Tüm halkı silahlandıran toplam ulusal seferberlik doktrini: ucuz bakım, bol insan gücü ve geniş cephe kapasitesi düşmanı salt sayıyla ezer. Disiplin ve moral kalıcı bir zayıflık olarak kalır."
 bra_german_empire_reform: "İmparatorluk Alman Anayasası"
 bra_german_empire_reform_desc: "Kendine özgü Alman yönetim yapısı: bir İmparator’un taçlandırdığı devletler federasyonu; merkezi otoriteyi federal özerklikle harmanlar. Tacın meşruiyetini ve prestijini artırır, hem ticarette hâkimiyet hem de iç idarede esneklik sağlar."
