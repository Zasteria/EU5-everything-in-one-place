l_turkish:
 hun_crown_of_saint_stephen_mission_pack: "Aziz István Tacı"
 hun_crown_of_saint_stephen_mission_pack_DESCRIPTION:0 "1337’de Macaristan Krallığı’nı Anjou Hanedanı’ndan Kral I. Károly (Károly Róbert) yönetiyor. Varisi, parlak Lajos, sonradan Büyük Lajos olarak anılacak, kulislerde bekliyor ve bir sonraki nesilde Polonya ile şahsi birlik gelecek. Karpat Havzası merkezli bu diyarın her yöne emelleri var: kuzeye Polonya ve Bohemya üzerinden, güneye Balkanlar’a, doğuya Osmanlılara karşı ve batıya Adriyatik’e. Kara Ordu’yu kur, Buda’ya Rönesans’ı getir ve Hıristiyan Dünyasının Kalesi olarak dur."
 hun_crown_of_saint_stephen_mission_pack_CRITERIA_DESCRIPTION:0 "Macaristan olarak Polonya ve Bohemya üzerinden kuzeye genişle, Balkanlar’ı güvenceye al, Osmanlıları yen, Adriyatik’e ulaş ve iç reformları tamamla."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_TOOLTIP:0 "Aziz István Tacı’nın şanını yeniden kurmak için görevleri tamamla."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_DETAILS:0 "Anjou Hanedanı’ndan Matthias Corvinus çağına: Macaristan’ın en büyük günleri seni bekliyor!"
 hun_crown_of_st_stephen: "Aziz István Tacı"
 hun_crown_of_st_stephen_desc: "Aziz I. István, MS 1000’de Macaristan Krallığı’nı kurdu ve Hıristiyanlığa geçişi yürüttü. Aziz István Tacı, yani Kutsal Taç, bugün de Macar krallığının kutsal simgesi olmayı sürdürür. 1337’de Anjou Hanedanı bu tacı elinde tutuyor ve Orta Avrupa’nın en büyük krallığını yönetiyor. Buda’yı ve Esztergom’u güvenceye al ve diyarın temellerini pekiştir."
 hun_angevin_diplomacy: "Anjou Diplomasisi"
 hun_angevin_diplomacy_desc: "Macaristan’ın Anjou Hanedanı’nın Napoli, Polonya ve Bohemya ile karmaşık hanedan bağları vardır. I. Lajos’un annesi Elisabeth, Polonya Kralı III. Kazimierz’in kız kardeşiydi ve bu, Polonya tacını miras alma ihtimalini açtı. Bir ittifaklar ağı kur ve Anjou diplomatik nüfuzunu Orta Avrupa’ya yay."
 hun_polish_union: "Polonya ile Şahsi Birlik"
 hun_polish_union_desc: "Büyük Kazimierz 1370’de erkek varis bırakmadan ölünce yeğeni I. Lajos hem Macaristan hem Polonya Kralı oldu. Bu Macar-Polonya şahsi birliği Orta Avrupa’da güçlü bir çifte monarşinin başlangıcıydı. İki büyük krallık tek bir kralın altında: Orta Avrupa’daki güç dengesi çarpıcı biçimde kayar."
 hun_bohemian_ambitions: "Bohemya Emelleri"
 hun_bohemian_ambitions_desc: "Hus sapkınlığının kaynağı olan Bohemya Krallığı dinî kargaşadan kırılıyor. Anjoular, Lüksemburglar ve Habsburglar Bohemya tacı için yarışırken Macaristan’ın da meşru bir hakkı var. Prag’ı ele geçirmek, Orta Avrupa’nın kalbinde bir Macar-Bohemya çifte krallığı yaratır."
 hun_lord_of_the_north: "Kuzey’in Lordu"
 hun_lord_of_the_north_desc: "Krakov’u ve Gdańsk’ı ele geçirmek Macar egemenliğini Baltık Denizi’ne uzatarak Adriyatik’ten Baltık’a uzanan geniş bir Orta Avrupa imparatorluğu yaratır. Polonya’nın Piast ve Anjou hanedanlarının şanı Macar tacı altında yeniden doğar."
 hun_conquer_serbia: "Sırbistan’ı Fethet"
 hun_conquer_serbia_desc: "Sırbistan Krallığı Kosova Muharebesi’nin (1389) ardından Osmanlı vasalı oldu. Ama Macaristan için Belgrad (Nándorfehérvár) Tuna savunmasının vazgeçilmez anahtarıdır. 1440’ta Skanderbeg’in ve Hunyadi János’un Osmanlılara karşı efsanevi Belgrad savunması: o muharebe burada verilsin."
 hun_subjugate_wallachia: "Eflak’a Boyun Eğdir"
 hun_subjugate_wallachia_desc: "Eflak (Havasalföld) tarihsel olarak Macar üstünlüğünü tanımıştır. Kazıklı Voyvoda Vlad’ın babası II. Vlad, Macaristan Kralı Sigismund’dan Ejder Tarikatı’nı aldı. Bu tampon devleti Macar nüfuzu altında sağlamca kur."
 hun_subjugate_moldavia: "Boğdan’a Boyun Eğdir"
 hun_subjugate_moldavia_desc: "Boğdan Tuna deltası ile Polonya arasında yer alır ve Macaristan, Polonya ve Osmanlılar tarafından çekişilir. Bu prensliği Macar hükümranlığı altına sağlamca almak doğu sınırını güvenceye alır."
 hun_danube_fortress_line: "Tuna Kale Hattı"
 hun_danube_fortress_line_desc: "Végvár sistemi, yani Macaristan’ın sınır kale ağı, 15. yüzyıl Avrupası’ndaki en sofistike Osmanlı karşıtı savunma yapısıydı. Tuna boyunca onlarca kale birbirleriyle haberleşerek Osmanlı ilerleyişini yerinde durduran bir erken uyarı ve savunma hattı oluşturdu. Bu sistem Macaristan’ı Hıristiyan dünyasının gerçek ilk kalkanı yaptı."
 hun_order_of_the_dragon: "Ejder Tarikatı"
 hun_order_of_the_dragon_desc: "Ejder Tarikatı, Macaristan Kralı Sigismund’un 1408’de kurduğu bir şövalyelik tarikatıydı. II. Vlad, Skanderbeg ve Hunyadi János üyeleri arasındaydı. Bu tarikat Macar soylularını Osmanlı karşıtı haçlı seferi sancağı altında toplayarak Hıristiyan koruyuculuğu görevini simgeledi."
 hun_crusade_preparations: "Haçlı Seferi Hazırlıkları"
 hun_crusade_preparations_desc: "Hunyadi János 15. yüzyılın en büyük Osmanlı karşıtı haçlısıydı. 1442-43 Uzun Sefer’i Osmanlıları geri püskürttü ve Hıristiyan dünyasına umut verdi. Ama 1444’teki Varna Muharebesi Polonya-Macar haçlı ordusunu yok etti. Bu sefer hazırlıklı git."
 hun_battle_of_nicopolis: "Niğbolu Muharebesi"
 hun_battle_of_nicopolis_desc: "1396’da Macaristan Kralı Sigismund önderliğindeki haçlı ordusu Niğbolu Muharebesi’nde ezildi: Osmanlı’nın Balkanlar hâkimiyetini güvence altına alan felaket. Ama bu sefer farklı: tam hazırlıklı Macaristan Niğbolu’yu ele geçirir ve Balkanlar’ın yeniden fethine giden kapıyı açar. Hunyadi’nin adı tüm Avrupa’da yankılanır."
 hun_black_army: "Kara Ordu"
 hun_black_army_desc: "Kral Matthias Corvinus’un yaklaşık 1458’de oluşturduğu Kara Ordu (Fekete Sereg), çağdaş Avrupa’nın en gelişmiş profesyonel askerî gücüydü: siyah zırhlı paralı askerlerin ve daimi birliklerin bir bileşimi, ateşli silahları saldırgan biçimde benimsiyordu. Muazzam bakım maliyetine rağmen bu ordu hem Osmanlıları hem Habsburgları korkuttu. Macar hegemonyasının anahtarıdır."
 hun_bulwark_of_christendom: "Hıristiyan Dünyasının Kalesi"
 hun_bulwark_of_christendom_desc: "Yüzyıllar boyunca Macaristan Osmanlı İmparatorluğu’na karşı Hıristiyan dünyasının ön saflarında savaştı. Şimdi Osmanlılar Avrupa’dan tamamen kovulduğuna göre Papa, İmparator ve Avrupa prensleri Macaristan Kralı’na en yüksek onuru bahşediyor: Antemurale Christianitatis, yani Hıristiyan Dünyasının Kalesi."
 hun_croatian_union: "Hırvatistan ile Birlik"
 hun_croatian_union_desc: "1102 Pacta Conventa’sından beri Hırvatistan Macaristan ile şahsi birliktedir: Hırvat soylular geniş özerklik karşılığında Macar kralını kendi kralları olarak kabul etti. Bu tarihî birliği güçlendir ve Macaristan’ın Adriyatik kapısını güvenceye al."
 hun_reclaim_dalmatia: "Dalmaçya’yı Geri Al"
 hun_reclaim_dalmatia_desc: "Dalmaçya kıyısı, Venedik 1409’da satın alana kadar Macar-Hırvat krallığının bir parçasıydı. Split’i ve Raguza’yı (Dubrovnik) geri almak garantili Adriyatik erişimini yeniden kurar ve İtalya’ya giden yolu açar."
 hun_adriatic_supremacy: "Adriyatik Üstünlüğü"
 hun_adriatic_supremacy_desc: "“Adriyatik’in Gelini” Venedik’in Adriyatik üzerindeki uzun tekeline son verme vakti geldi. Macar-Hırvat filosu bayrağını Adriyatik Denizi üzerinde yükseltecek."
 hun_angevin_naples: "Napoli’ye Anjou İddiası"
 hun_angevin_naples_desc: "Macaristan’ın Anjou Hanedanı’nın Napoli tahtı üzerinde bir hakkı var. I. Lajos Napoli’yi 1347’de ve 1350’de iki kez işgal etti. Anjou iddiasını kalıcı olarak gerçekleştirme vakti: Macaristan Kralı Napoli’yi ilelebet yönetsin."
 hun_strengthen_estates: "Zümreleri Güçlendir"
 hun_strengthen_estates_desc: "Macar soylular ve din adamları 1222 Altın Bula’sında (Aranybulla) geniş ayrıcalıklar kazandı. Bu zümre siyaseti geleneğinden yararlanarak soyluların ve din adamlarının desteğini kazanmak kraliyet meşruiyetini güçlendirir. Ama dikkat: aşırı tavizler ileride sorun yaratır. Doğru dengeyi koru."
 hun_tripartitum: "Tripartitum"
 hun_tripartitum_desc: "1514’te István Werbőczy’nin derlediği Tripartitum, Macar örf ve âdet hukukunun sistematik bir kodlamasıydı. Soylu ayrıcalıklarını, köylü yükümlülüklerini ve kraliyet otoritesini tanımladı. Bu hukuk kanunu Macar hukukunun temeli oldu; ancak serfliği kodlaması 1514 Dózsa Köylü İsyanı’na da katkıda bulundu."
 hun_matthias_reforms: "Kral Matthias’ın Reformları"
 hun_matthias_reforms_desc: "“Adil” denen Kral Matthias Corvinus (saltanatı 1458-90) Macar krallarının en büyüğüydü. Merkezî vergilendirme, profesyonel Kara Ordu ve Rönesans kültürünün saldırgan biçimde benimsenmesi Macaristan’ı Orta Avrupa’nın en güçlü devletine dönüştürdü."
 hun_buda_renaissance: "Buda Rönesansı"
 hun_buda_renaissance_desc: "Kral Matthias’ın sarayı İtalyan Rönesansı’nı Macaristan’a ithal etti. Buda Sarayı’ndaki Bibliotheca Corviniana binlerce Latince ve Yunanca el yazması barındırdı ve Avrupa’nın dört bir yanından bilginleri ve sanatçıları çekti. Bu kültürel çiçeklenme Macaristan’ı Orta Avrupa’nın kültür merkezi yapar."
 hun_great_hungary: "Büyük Macaristan"
 hun_great_hungary_desc: "Balkanlar, Polonya, Bohemya, Dalmaçya: Macaristan Krallığı Karpat Havzası’nın çok ötesinde büyük bir imparatorluğa dönüştü. Kara Ordu, Buda’nın Rönesans sarayı ve Tuna kale hattı: bunların hepsi birlikte Macaristan’ı hiç olmadığı kadar güçlü kıldı."
 hun_glory_of_st_stephen: "Aziz István Tacı’nın Şanı"
 hun_glory_of_st_stephen_desc: "Aziz István’ın bin yıl önce kurduğu Macaristan Krallığı, Orta Avrupa’ya ve Balkanlar’a hâkim büyük bir imparatorluk oldu. Kuzeyde Baltık’tan güneyde Adriyatik’e ve Akdeniz’e, doğuda Karpatlar’a: Aziz István Tacı benzersiz bir parlaklıkla ışıldıyor. Hıristiyan Dünyasının Kalesi olarak kutlanan Macaristan’ın şanı mutlak zirvesine ulaştı."
 hun_events.99.t: "Aziz István Tacı’nın Şanı"
 hun_events.99.d: "Bir zamanlar Karpat Havzası’na hapsolmuş Aziz István Krallığı artık Baltık’tan Adriyatik’e ve Akdeniz’e uzanıyor. Polonya, Bohemya ve Hırvatistan Macar tacı altında birleşti; Osmanlılar Balkanlar’dan kovuldu; Napoli üzerindeki Anjou iddiası yerine getirildi. Buda’nın Rönesans sarayı tüm Avrupa’da ünlü; Kara Ordu her düşman tarafından korkuluyor. Aziz István Tacı bin yıllık tarihinin en büyük parlaklığıyla ışıldıyor."
 hun_events.99.a: "Aziz István, hayalini gerçekleştirdik!"
 STATIC_MODIFIER_NAME_hun_angevin_prestige_mod: "Anjou Prestiji"
 STATIC_MODIFIER_DESC_hun_angevin_prestige_mod: "1308’de Anjou prensi Károly (Károly Róbert) Macar tahtını miras aldı. Bu hanedanın kan bağları Macaristan’ı Napoli’ye, Sicilya’ya, Provence’a ve Polonya’ya bağladı ve Macaristan’ı Avrupa diplomasisinin merkezine itti. Avignon’daki papalık sarayı ve Viyana’daki Habsburglar bu Anjou sarayını göz ardı edemezdi."
 STATIC_MODIFIER_NAME_hun_angevin_diplomacy_mod: "Anjou Diplomatik Ağı"
 STATIC_MODIFIER_DESC_hun_angevin_diplomacy_mod: "Napoli’den Polonya’ya evlendirilen Anjou prenseslerinin mektupları Visegrád sarayına durmaksızın ulaşıyor."
 STATIC_MODIFIER_NAME_hun_bohemian_crown_mod: "Bohemya Tacı"
 STATIC_MODIFIER_DESC_hun_bohemian_crown_mod: "Bohemya tacı güvence altına alındığında bir Macar-Polonya-Bohemya üçlü monarşisi oluştu."
 STATIC_MODIFIER_NAME_hun_northern_lord_mod: "Kuzey’in Lordu"
 STATIC_MODIFIER_DESC_hun_northern_lord_mod: "Baltık’a erişimle Macaristan, kuzey ve doğu Avrupa ticaretinin kilit noktalarını denetleyen büyük bir güç oldu."
 STATIC_MODIFIER_NAME_hun_wallachian_buffer_mod: "Eflak Tampon Devleti"
 STATIC_MODIFIER_DESC_hun_wallachian_buffer_mod: "Eflak bir Macar tampon devleti olarak işlev görür ve doğu sınırını güvenceye alır."
 STATIC_MODIFIER_NAME_hun_moldavian_buffer_mod: "Boğdan Tampon Devleti"
 STATIC_MODIFIER_DESC_hun_moldavian_buffer_mod: "Macar nüfuzu altındaki Boğdan doğu sınırı güvenliğine çift katman sağlar."
 STATIC_MODIFIER_NAME_hun_vegvar_system_mod: "Végvár Kale Sistemi"
 STATIC_MODIFIER_DESC_hun_vegvar_system_mod: "Tuna boyunca düzenlenmiş kale ağı Osmanlı ilerleyişini sistematik biçimde engeller. Macaristan Hıristiyan dünyasının ön saf kalkanı olur."
 STATIC_MODIFIER_NAME_hun_dragon_order_mod: "Ejder Tarikatı"
 STATIC_MODIFIER_DESC_hun_dragon_order_mod: "Kral Sigismund’un Ejder Tarikatı soyluları ve ordu tek bir dava altında birleştirir. Osmanlı karşıtı haçlı seferinin manevi belkemiği olur."
 STATIC_MODIFIER_NAME_hun_crusade_zeal_mod: "Haçlı Gayreti"
 STATIC_MODIFIER_DESC_hun_crusade_zeal_mod: "Hunyadi János’un sancağı altında toplanan haçlı seferinin coşkusu hâlâ askerlerin yüreklerinde yanıyor."
 STATIC_MODIFIER_NAME_hun_black_army_mod: "Kara Ordu"
 STATIC_MODIFIER_DESC_hun_black_army_mod: "Matthias Corvinus’un yarattığı Fekete Sereg, yani Kara Ordu, çağdaş Avrupa’nın en modern askerî gücüydü: siyah zırhlı on binlerce paralı asker ve daimi birlik. Bohemya’dan gelen Husçu şövalyelerin çekirdeği etrafında kurulan ordu ateşli silahları saldırgan biçimde benimsedi ve hem Osmanlılar hem Habsburglar tarafından eşit derecede korkuldu. Yıkıcı maliyet kraliyet hazinesini zorladı, ama bu ordu olmasaydı Macaristan bu devler arasında hayatta kalamazdı."
 STATIC_MODIFIER_NAME_hun_christendom_bulwark_mod: "Hıristiyan Dünyasının Kalesi"
 STATIC_MODIFIER_DESC_hun_christendom_bulwark_mod: "Osmanlıları Avrupa’dan kovan Macaristan, Antemurale Christianitatis onurunu taşır."
 STATIC_MODIFIER_NAME_hun_adriatic_coast_mod: "Adriyatik Kıyısı Güvence Altında"
 STATIC_MODIFIER_DESC_hun_adriatic_coast_mod: "Dalmaçya’nın geri alınması Macaristan’a Adriyatik Denizi’ne doğrudan erişim sağlar."
 STATIC_MODIFIER_NAME_hun_angevin_italy_mod: "Anjou İtalyası"
 STATIC_MODIFIER_DESC_hun_angevin_italy_mod: "Macar Anjoular Napoli aracılığıyla güney İtalya’ya hâkim olur."
 STATIC_MODIFIER_NAME_hun_golden_bull_mod: "Altın Bula Geleneği"
 STATIC_MODIFIER_DESC_hun_golden_bull_mod: "1222 Altın Bula’sının ruhunu miras alan zümre sistemi diyarın istikrarını destekler."
 STATIC_MODIFIER_NAME_hun_tripartitum_mod: "Tripartitum"
 STATIC_MODIFIER_DESC_hun_tripartitum_mod: "1514’te István Werbőczy’nin derlediği Tripartitum Macar örf ve âdet hukukunun doruğuydu: soyluların “tek ve aynı özgürlüğünü”, köylülüğün serfleştirilmesini ve kraliyet otoritesini kapsayan üç bölüm. Kanlı Dózsa Köylü İsyanı bedeliydi. Yine de bu hukuk kanunu yüzyıllar boyunca Macar toplumunun temeli olarak kaldı."
 STATIC_MODIFIER_NAME_hun_matthias_admin_mod: "Kral Matthias’ın Reformları"
 STATIC_MODIFIER_DESC_hun_matthias_admin_mod: "Matthias “Adil” (Igazságos Mátyás) olarak anıldı çünkü rütbeye bakmaksızın mahkeme kurdu ve köylüleri baron zulmünden korudu. Merkezî bir bürokrasi kurdu, mağnatların gücünü kıstı ve kraliyet otoritesini doğrudan kırsala uzattı. Saltanatı tarihte Macar krallığının en mükemmel ifadesi olarak anılır."
 STATIC_MODIFIER_NAME_hun_buda_renaissance_mod: "Buda Rönesansı"
 STATIC_MODIFIER_DESC_hun_buda_renaissance_mod: "Matthias’ın sarayı İtalya’nın dört bir yanından hümanistleri, mimarları, heykeltıraşları ve müzisyenleri çekti. Buda Sarayı Rönesans tarzında yeniden inşa edildi: Viyana’dan daha görkemli. Bibliotheca Corviniana klasik Yunan ve Roma metinlerinden beş binden fazla el yazması barındırdı. Matthias öldüğünde bir hümanist şöyle yazdı: “Matthias öldü. Adalet yok oldu.”"
 STATIC_MODIFIER_NAME_hun_great_hungary_mod: "Büyük Macaristan"
 STATIC_MODIFIER_DESC_hun_great_hungary_mod: "Orta Avrupa’ya, Balkanlar’a ve Adriyatik’e yayılan büyük Macar imparatorluğu tamam."
 hun_baltic_trade: "Baltık Ticareti"
 hun_baltic_trade_desc: "Gdańsk, Hansa Birliği’nin kilit merkezidir: Kuzey Denizi ile Baltık arasındaki kapı. Macaristan’ın bu limanı denetlemesi Baltık kehribarına, kürküne ve kereste ticaretine erişimi açar ve Batı Avrupa’ya doğrudan bir yol güvence altına alır. Macaristan’ın denize kıyısı olmayan bir tarım devletinden denizci bir ticaret gücüne dönüştüğü dönüm noktası budur."
 hun_hre_influence: "Kutsal Roma İmparatorluğu Üzerinde Nüfuz"
 hun_hre_influence_desc: "Polonya ve Bohemya güvence altındayken Macaristan, Kutsal Roma İmparatorluğu’nun en güçlü komşusu oldu. Habsburg hegemonyasına karşı koymak için diplomatik itibar ve birden fazla ittifak aracılığıyla Macar nüfuzunu Alman prenslerine yay."
 hun_challenge_habsburgs: "Habsburglara Meydan Oku"
 hun_challenge_habsburgs_desc: "Avusturya’nın Habsburg Hanedanı Macaristan’ın ebedî rakibi olmuştur. Viyana’yı ele geçirmek Tuna hegemonyasını Macaristan’a aktarır. EU4’teki en büyük Macar emeli, Habsburglar’ı devirip Kutsal Roma İmparatoru olmak, burada gerçekleşir."
 hun_conquer_bulgaria: "Bulgaristan’ı Fethet"
 hun_conquer_bulgaria_desc: "İkinci Bulgar İmparatorluğu 1396’da Osmanlılar tarafından yok edildi. Ama Macaristan artık Balkanlar’a hâkim olduğundan Sofya ve Tırnova geri alınabilir: Bulgar mirası Macar tacı altında canlandırılır."
 hun_conquer_greece: "Yunanistan’ı Fethet"
 hun_conquer_greece_desc: "Antik Yunan uygarlığının iki büyük şehri Atina ve Selanik Macaristan’a düşer. Bizans’ın düşüşünden sonra bölünmüş Yunan prensliklerini birleştir ve Macar sancağını Balkanlar’ın güney ucuna taşı."
 hun_balkan_empire: "Balkan İmparatorluğu"
 hun_balkan_empire_desc: "Sırbistan, Bulgaristan, Yunanistan, Eflak, Boğdan: tüm Balkanlar Macar egemenliği altında. Bizans’ın ve sonra Osmanlıların Balkanlar üzerinde uyguladığı hegemonya artık tamamen Macaristan’a ait."
 hun_push_into_anatolia: "Anadolu’ya Doğru İlerle"
 hun_push_into_anatolia_desc: "İstanbul güvence altındayken Macaristan iki kıtaya yayılıyor. Bizans’ın kaybettiği Anadolu topraklarını geri almak ve Osmanlı İmparatorluğu’nun merkezine vurmak için bir haçlı seferi başlat."
 hun_hungarian_crusade: "Macar Haçlı Seferi"
 hun_hungarian_crusade_desc: "Kudüs’ü kurtaran Macar kralı tüm Hıristiyan dünyasının kahramanı olur. Aziz István günlerinden beri süren hayal, yani Kutsal Topraklar’ı Hıristiyan ellerine geri vermek, nihayet gerçekleşir. Ejder Tarikatı’nın kurucusu Sigismund’un hayal ettiği haçlı zaferi burada kazınır."
 hun_mediterranean_fleet: "Akdeniz Filosu"
 hun_mediterranean_fleet_desc: "Napoli ve Sicilya güvence altındayken Macaristan büyük bir Akdeniz deniz gücü oldu. Otuz veya daha fazla gemilik bir filo Akdeniz’in denetimi için yarışıyor. Bir zamanlar Venedik’in tekelindeki deniz artık Macaristan’a ait."
 hun_conquer_north_africa: "Kuzey Afrika’yı Fethet"
 hun_conquer_north_africa_desc: "Tunus’u ele geçirmek Macar topraklarını Akdeniz’in güney kıyısına uzatır. Berberi korsan üslerini ez ve Akdeniz ticaretinin önündeki engelleri kaldır. Macar bayrağı Akdeniz’in güney ucunda dalgalanıyor."
 hun_latin_empire: "Latin İmparatorluğu’nun Yeniden Kurulması"
 hun_latin_empire_desc: "İstanbul, Roma ve Napoli güvence altındayken Macaristan Kralı Latin İmparatorluğu’nun varisi olduğunu iddia edebilir. 1204’teki Dördüncü Haçlı Seferi’nin hayali artık meşru fetih yoluyla gerçekleşti. Tarihin en büyük Hıristiyan imparatorluğu doğuyor."
 hun_corvinus_library: "Bibliotheca Corviniana"
 hun_corvinus_library_desc: "Kral Matthias’ın Bibliotheca Corviniana’sı çağdaş Avrupa’nın en büyük Latince ve Yunanca el yazması koleksiyonuydu: Buda Sarayı’nda barındırılan beş binden fazla kodeks, İtalya’dan, Fransa’dan ve Almanya’dan bilginleri ve sanatçıları çekti. Bu kültürel yatırım Macaristan’ı Orta Avrupa’nın kültür merkezine dönüştürür."
 hun_hungarian_church: "Macar Kilisesi"
 hun_hungarian_church_desc: "Esztergom Başpiskoposluğu merkezli olarak Macar Katolik Kilisesi’ni güçlendir ve din adamlarının desteğini güvence altına al. Reform dalgaları gelmeden önce Katolik Kilisesi ile Macar kraliyet gücü arasındaki ilişkiyi sağlamca kur."
 hun_economic_powerhouse: "Altın Tuna"
 hun_economic_powerhouse_desc: "Balkanlar’a, kuzeye ve Adriyatik’e yayılan Macaristan, birden fazla büyük ticaret yolunun kesiştiği yerde duruyor: bir ekonomik dev. Tuna tarım üretimi, Transilvanya gümüş madenleri ve Akdeniz ticaret gelirleri bir araya gelerek muazzam servet yaratır."
 hun_danube_empire: "Tuna İmparatorluğu"
 hun_danube_empire_desc: "Polonya, Bohemya, Balkanlar, Adriyatik, Akdeniz: hepsi Macar egemenliği altında, rafine idari kurumlar ve müreffeh bir ekonomik tabanla. Macaristan büyük nehir merkezli “Tuna İmparatorluğu” oldu. Avusturya-Macaristan’ın bir zamanlar hayal ettiği çok etnikli bileşik devlet artık Macar önderliğinde gerçekleşti."
 STATIC_MODIFIER_NAME_hun_baltic_trade_mod: "Baltık Ticareti"
 STATIC_MODIFIER_DESC_hun_baltic_trade_mod: "Gdańsk limanında demirleyen Macar ticaret gemileri kehribar ve kürk yüklü dönüyor."
 STATIC_MODIFIER_NAME_hun_habsburg_rival_mod: "Macaristan-Avusturya"
 STATIC_MODIFIER_DESC_hun_habsburg_rival_mod: "Viyana’nın düşüşü Habsburg otoritesini çökertir ve Macaristan’ı Tuna’nın efendisi yapar."
 STATIC_MODIFIER_NAME_hun_bulgaria_mod: "Bulgar Egemenliği"
 STATIC_MODIFIER_DESC_hun_bulgaria_mod: "Tırnova tepesindeki yeni valiler Macar dilini ve hukukunu güney Balkan köylerine yayıyor."
 STATIC_MODIFIER_NAME_hun_greece_mod: "Yunanistan’ın Işığı"
 STATIC_MODIFIER_DESC_hun_greece_mod: "Atina Akropolü’ne bakan Macaristan Kralı, antik Yunan’ın şanını kendi sarayının gururu olarak benimser."
 STATIC_MODIFIER_NAME_hun_balkan_empire_mod: "Balkan İmparatorluğu"
 STATIC_MODIFIER_DESC_hun_balkan_empire_mod: "Tuna’dan Mora’ya Aziz István Tacı’nın sancağı Balkanlar’ın her suruna dalgalanıyor."
 STATIC_MODIFIER_NAME_hun_new_crusade_mod: "Yeni Haçlı Seferi"
 STATIC_MODIFIER_DESC_hun_new_crusade_mod: "İstanbul kapılarından geçen askerler haçı daha da doğuya taşıyacaklarına yeniden yemin ediyor."
 STATIC_MODIFIER_NAME_hun_crusade_victory_mod: "Haçlı Seferi Tamamlandı"
 STATIC_MODIFIER_DESC_hun_crusade_victory_mod: "Kudüs’ün kurtarılmasının şanı Macaristan’a benzeri görülmemiş prestij, meşruiyet ve diplomatik otorite getirir."
 STATIC_MODIFIER_NAME_hun_med_fleet_mod: "Akdeniz Filosu"
 STATIC_MODIFIER_DESC_hun_med_fleet_mod: "Adriyatik limanlarından Macar kralının sancağını taşıyan kadırgalar birbiri ardına Akdeniz’e kürek çekiyor."
 STATIC_MODIFIER_NAME_hun_north_africa_mod: "Kuzey Afrika Üssü"
 STATIC_MODIFIER_DESC_hun_north_africa_mod: "Kuzey Afrika kıyısı boyunca Macar tüccarlar ve korsan avlayan filolar limandan limana durmaksızın geçiyor."
 STATIC_MODIFIER_NAME_hun_latin_empire_mod: "Latin İmparatorluğu’nun Yeniden Kurulması"
 STATIC_MODIFIER_DESC_hun_latin_empire_mod: "İstanbul’u, Roma’yı ve Napoli’yi elinde tutan kralın adı her sarayda hürmetle fısıldanıyor."
 STATIC_MODIFIER_NAME_hun_corvinus_library_mod: "Bibliotheca Corviniana"
 STATIC_MODIFIER_DESC_hun_corvinus_library_mod: "Corvinus Kütüphanesi’nin yazıhanesinde katipler gece gündüz kandil ışığında el yazmalarını kopyalıyor."
 STATIC_MODIFIER_NAME_hun_church_mod: "Macar Kilisesi"
 STATIC_MODIFIER_DESC_hun_church_mod: "Güçlü bir Macar Kilisesi meşruiyet, yasama verimliliği ve dinî istikrar getirir."
 STATIC_MODIFIER_NAME_hun_economy_mod: "Altın Tuna"
 STATIC_MODIFIER_DESC_hun_economy_mod: "Tuna’yı kat eden mavnalar ve madenlerden mal taşıyan arabalar krallığın pazarlarını daima hareketli tutuyor."
 STATIC_MODIFIER_NAME_hun_danube_empire_mod: "Tuna İmparatorluğu"
 STATIC_MODIFIER_DESC_hun_danube_empire_mod: "Büyük nehir merkezli çok etnikli Tuna İmparatorluğu tamam. Vergi, nüfus, idare ve yasama verimliliği zirveye ulaşır."
 hun_transylvanian_mines: "Aşağı Macaristan Madencilik Kasabaları"
 hun_transylvanian_mines_desc: "Kremnica (Körmöcbánya) Macaristan’ın en büyük altın darphanesine ev sahipliği yapar. Banská Bystrica (Besztercebánya) Orta Avrupa’nın en büyük bakır madenleriyle ünlüdür. Bu iki şehri güvenceye almak Macaristan’ı Orta Avrupa’nın başlıca madencilik devleti yapar. Matthias Corvinus bu bölgeyi 1467-68’de imparatorluk malı olarak yeniden düzenledi ve madencilik gelirlerini Kara Ordu’yu finanse etmek için kullandı."
 hun_silver_mines: "Banská Štiavnica Gümüş Madenleri"
 hun_silver_mines_desc: "Hont bölgesi (Banská Štiavnica’yı kapsar), Aşağı Macaristan’ın en büyük gümüş madenciliği bölgesidir. Bu toprağın gümüşü kraliyet darphanesinde tolar olarak basıldı ve Orta Avrupa genelindeki ticareti destekledi. “Aşağı Macaristan Madencilik Kasabaları” krallığın ekonomik kalbidir."
 hun_salt_mines: "Transilvanya Tuz Madenleri"
 hun_salt_mines_desc: "Sighet (Máramarossziget) ve Turda antik çağdan beri kaya tuzu için işletilmektedir. Tuz bir zamanlar “beyaz altın” olarak anılırdı: o kadar hayati bir maldı ki Macaristan’ın kraliyet tuz tekeli taç maliyesinin kritik bir sütunuydu. Bu tuz madenlerini güvenceye al ve tuz ticaretinde bir tekel kur."
 hun_tokaj_wine: "Tokaj Şarapları"
 hun_tokaj_wine_desc: "Sátoraljaújhely çevresindeki Tokaj bölgesi “Kralların Şarabı, Şarapların Kralı” Tokaji Aszú’yu üretir. Papa XIV. Benedictus’un Fransa Kralı XV. Louis’ye hediye ettiği kadar ünlü olan bu Macar tepelerinin asil çürük şarabı Avrupa’nın en kutlanan şarabıdır. Bağları geliştir ve Avrupa’nın en iyi şarabını ihraç et."
 hun_mining_empire: "Madencilik İmparatorluğu"
 hun_mining_empire_desc: "Kremnica’nın altını, Hont’un gümüşü, Banská Bystrica’nın bakırı ve Sighet ile Turda’nın tuzu: Macaristan’ın tüm maden zenginliği artık güvence altında. Orta Avrupa’nın önde gelen madencilik devleti olarak Macaristan metal ihracatından muazzam gelir kazanır. Bu servet Matthias’ın Kara Ordusu’nu ve Rönesans sarayının şanını finanse etti."
 hun_buda_capital: "Buda ve Pest’i Geliştir"
 hun_buda_capital_desc: "Tuna’nın iki yakasında birbirine bakan Buda ve Pest, Macaristan Krallığı’nın kalbidir. Buda’nın kraliyet sarayı ve büyük pazarı, Pest’in ticaret limanı: bu ikiz şehir çiçek açtığında tüm Macaristan refah bulur. Matthias’ın sarayı Avrupa’nın en büyüğüydü ve Orta Avrupa Rönesansı’nın merkezi olarak ünlüydü."
 hun_upper_hungary_cities: "Yukarı Macaristan’ın Şehirleri"
 hun_upper_hungary_cities_desc: "Bratislava (Pozsony) batı kapısını Habsburglara karşı korur; Košice (Kassa) Yukarı Macaristan’ın en büyük ticaret şehridir; Trnava (Nagyszombat) bir piskoposluk merkezidir. Bu üç şehri geliştirmek Yukarı Macaristan’ı (günümüz Slovakya’sı) kuzeyin ekonomik ve siyasi ekseni yapar."
 hun_pannonian_cities: "Pannonia Şehirleri"
 hun_pannonian_cities_desc: "Győr (Raab) Avusturya sınırını korur; Sopron (Ödenburg) batı Macaristan’ın zengin ticaret şehridir; Pécs (Fünfkirchen), I. Lajos’un 1367’de kurduğu Orta Avrupa’nın en eski üniversitelerinden birine ev sahipliği yapar. Batı Macaristan’ı geliştirmek için bu Pannonia şehirlerini geliştir."
 hun_great_plain_cities: "Büyük Ova Şehirleri"
 hun_great_plain_cities_desc: "Debrecen (Macar Kalvinizminin merkezi), Szeged (Tisza Nehri’nin anahtarı), Kecskemét (Büyük Ova’nın çobanlık şehri): Macar Puszta’sının ana şehirlerini geliştir ve bu uçsuz bucaksız çayırın tarım potansiyelini aç. Büyük Ova’nın sığırları, koyunları ve tahılı Macaristan’ın başlıca ihraç malı olur."
 hun_transylvania_cities: "Transilvanya Şehirleri"
 hun_transylvania_cities_desc: "Kolozsvár (Cluj) Transilvanya’nın siyasi ve kültürel kalbidir; Nagyvárad (Oradea) Aziz Ladislaus’un kalıntılarını barındıran büyük bir hac şehridir; Miskolc kuzeydoğu Macaristan’ın sanayi merkezidir. Çok etnikli Transilvanya bölgesini şehir gelişimi yoluyla bütünleştir."
 hun_kingdom_of_cities: "Şehirler Krallığı"
 hun_kingdom_of_cities_desc: "Kremnica’nın altını, Hont’un gümüşü, Tokaj’ın şarabı, Buda’nın sarayı, Košice’nin ticareti, Pécs’in üniversitesi, Debrecen’in tarımı, Kolozsvár’ın kültürü: Macaristan Krallığı’nın her şehri organik bir uyum içinde çalışıyor. Orta Avrupa’nın en büyük ekonomik bölgesi tamam. Şehir refahı Macar imparatorluk gücünün gerçek kaynağıdır."
 STATIC_MODIFIER_NAME_hun_kremnica_mint_mod: "Kremnica Kraliyet Darphanesi"
 STATIC_MODIFIER_DESC_hun_kremnica_mint_mod: "Kremnica darphanesi, Macaristan Kralı I. Károly tarafından 1328’de Körmöcbánya’da kuruldu. Burada basılan altın “florin” (forint), Floransa florini ile kalite açısından eşit sayıldı ve Baltık’tan İstanbul’a kadar dolaştı. Darphanenin titiz standartları onu Orta Avrupa ticaretinin parasal belkemiği yaptı."
 STATIC_MODIFIER_NAME_hun_banska_copper_mod: "Banská Bystrica Bakır Madenleri"
 STATIC_MODIFIER_DESC_hun_banska_copper_mod: "Banská Bystrica’nın ocaklarında bakır kesen çekiçlerin sesi hiç dinmiyor."
 STATIC_MODIFIER_NAME_hun_hont_silver_mod: "Banská Štiavnica Gümüş Madenleri"
 STATIC_MODIFIER_DESC_hun_hont_silver_mod: "Hont madenlerinden çıkarılan gümüş kraliyet darphanesine taşınıyor."
 STATIC_MODIFIER_NAME_hun_salt_mine_mod: "Kaya Tuzu Madeni"
 STATIC_MODIFIER_DESC_hun_salt_mine_mod: "Roma zamanlarından beri kazılan kaya tuzu galerileri hâlâ krallığın sofralarını ayakta tutuyor."
 STATIC_MODIFIER_NAME_hun_tokaj_wine_mod: "Tokaji Aszú Bağları"
 STATIC_MODIFIER_DESC_hun_tokaj_wine_mod: "Tokaj tepelerinin bağlarında olgunlaşan asil çürük üzümler “kralların şarabı” olarak birçok diyarın sarayına gidiyor."
 STATIC_MODIFIER_NAME_hun_buda_capital_mod: "Kraliyet Başkenti Buda"
 STATIC_MODIFIER_DESC_hun_buda_capital_mod: "Buda’daki kraliyet sarayının Tuna’ya bakan pencerelerinden geçen ticaret gemilerinin yelkenleri her zaman görünüyor."
 STATIC_MODIFIER_NAME_hun_pest_trade_mod: "Pest Ticaret Limanı"
 STATIC_MODIFIER_DESC_hun_pest_trade_mod: "Pest rıhtımlarında hamalların nidaları sabahtan akşama kadar yankılanıyor."
 STATIC_MODIFIER_NAME_hun_bratislava_gateway_mod: "Pozsony: Kapı Şehri"
 STATIC_MODIFIER_DESC_hun_bratislava_gateway_mod: "Pozsony’un kapıları Avusturya’ya giden arabaların ve kralın ulaklarının yan yana geçtiği bir geçide dönüştü."
 STATIC_MODIFIER_NAME_hun_kosice_commerce_mod: "Kassa: Ticaret Merkezi"
 STATIC_MODIFIER_DESC_hun_kosice_commerce_mod: "Kassa’nın pazar meydanında Polonya’dan ve Silezya’dan tüccarlar Yukarı Macaristan’ın mallarını satın almak için yarışıyor."
 STATIC_MODIFIER_NAME_hun_pecs_university_mod: "Pécs Üniversitesi"
 STATIC_MODIFIER_DESC_hun_pecs_university_mod: "Pécs’teki üniversitenin kemerli avlularında I. Lajos’un mirasını sürdüren öğrenciler Latince dersleri dinliyor."
 STATIC_MODIFIER_NAME_hun_gyor_fortress_mod: "Győr Kalesi"
 STATIC_MODIFIER_DESC_hun_gyor_fortress_mod: "Győr surlarında Avusturya sınırını gözetleyen nöbetçiler meşalelerini gece boyunca yüksekte tutuyor."
 STATIC_MODIFIER_NAME_hun_debrecen_agri_mod: "Debrecen Tarım Şehri"
 STATIC_MODIFIER_DESC_hun_debrecen_agri_mod: "Büyük Ova’da yetiştirilen sığır sürüleri ve buğday yükleri Debrecen pazarına durmaksızın akıyor."
 STATIC_MODIFIER_NAME_hun_szeged_trade_mod: "Szeged Ticaret Limanı"
 STATIC_MODIFIER_DESC_hun_szeged_trade_mod: "Tisza ile Tuna’nın birleştiği yerdeki Szeged iç ticaretin merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_hun_cluj_center_mod: "Kolozsvár: Transilvanya’nın Kalbi"
 STATIC_MODIFIER_DESC_hun_cluj_center_mod: "Kolozsvár’ın pazarlarında ve okullarında Almanların, Macarların ve Romenlerin sesleri karışıyor."
 STATIC_MODIFIER_NAME_hun_oradea_pilgrimage_mod: "Nagyvárad: Hac Şehri"
 STATIC_MODIFIER_DESC_hun_oradea_pilgrimage_mod: "Krallığın dört bir yanından hacı kafileleri Kral Aziz Ladislaus’un kalıntılarına ev sahipliği yapan Nagyvárad katedraline doğru yol alıyor."
 STATIC_MODIFIER_NAME_hun_mining_empire_mod: "Madencilik İmparatorluğu"
 STATIC_MODIFIER_DESC_hun_mining_empire_mod: "Altın, gümüş, bakır, tuz: krallığın madenlerinden çıkarılan servet şimdi Orta Avrupa’daki her diyarınkini aşıyor."
 STATIC_MODIFIER_NAME_hun_kingdom_of_cities_mod: "Şehirler Krallığı"
 STATIC_MODIFIER_DESC_hun_kingdom_of_cities_mod: "Buda’dan Kolozsvár’a krallığın şehirlerinin pazarları birbirlerinin mallarını değiş tokuş ediyor ve tek bir büyük ekonomik alan olarak nefes alıyor."
 hun_secure_transylvania: "Transilvanya Hâkimiyeti"
 hun_secure_transylvania_desc: "Transilvanya, uzun süre çekirdek bir Macar toprağı, iki büyük şehir etrafında toplanır: Kolozsvár (Cluj) ve Brașov (Brassó). Macarlar, Saksonlar ve Eflaklılar (Romenler) bu toprakta bir arada yaşar. Yeterli hazine kaynaklarıyla Transilvanya’nın gelişimine ciddi biçimde yatırım yap ve iki büyük şehrinden birini tam şehir statüsüne yükselt."
 hun_events.20.t: "Transilvanya Hâkimiyeti"
 hun_events.20.d: "Kolozsvár ve Brașov güvence altına alınıp 1.000 dükadan fazla yatırım yapıldığında Transilvanya için büyük bir gelişim programı başlar. Kolozsvár (Latince: Claudiopolis; Romence: Cluj) Transilvanya’nın en büyük şehridir; Saksonlar yerleşimcilerin kurduğu Brașov (Latince: Corona; Almanca: Kronstadt) Eflak’a açılan ticaret kapısıdır. Hangi şehir gelişim için öncelikli olacak: bu karar Transilvanya’nın gelecekteki yönünü şekillendirir."
 hun_events.30.t: "Pacta Conventa: Hırvatistan ile Tarihî Anlaşma"
 hun_events.30.d: "1102’de Macaristan Kralı Coloman, on iki Hırvat soylu ailenin temsilcileriyle Pacta Conventa’yı akdetti. Hırvat soylular Macar kralını kendi egemenleri olarak kabul etti; karşılığında Hırvatistan özerkliğini ve hukuk geleneklerini korudu. Bu tarihî anlaşmadan iki yüzyıldan fazla sonra Macaristan ile Hırvatistan arasındaki ilişkiyi netleştirme vakti geldi. Hukuki statüsünü netleştirmek için Hırvatistan resmen bir fief olarak mı katılmalı? Yoksa mevcut esnek düzen mi korunmalı? Seçim Macaristan Kralı’na ait."
 hun_events.30.a: "Hırvatistan’ı resmen bir fief olarak kat"
 hun_events.30.b: "Mevcut ilişkiyi koru (+10 prestij)"
 hun_events.20.a: "Kolozsvár’ı şehir statüsüne yükselt (1.000 düka)"
 hun_events.20.b: "Brașov’u şehir statüsüne yükselt (1.000 düka)"
 STATIC_MODIFIER_NAME_hun_eternal_crown_mod: "Aziz István’ın Ebedî Tacı"
 STATIC_MODIFIER_DESC_hun_eternal_crown_mod: "1000 yılının Noel Günü’nde Papa II. Sylvester, Macarların dükü István’a bir taç gönderdi ve onu Macaristan’ın ilk kralı I. István yaptı. Bu taç, yani Aziz István’ın Kutsal Tacı, Macar devletinin özü olarak görülmeye başlandı: onsuz bir kral Macaristan’ın kralı değildi. Şimdi, yüzyıllar sonra dünyanın dört bir yanından diplomatlar Macar sarayının üstünlüğünü kabul etmek için hacca gidiyor."
