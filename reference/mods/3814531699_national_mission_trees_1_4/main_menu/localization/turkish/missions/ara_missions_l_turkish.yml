l_turkish:
 ara_crown_mission_pack: "Aragon Tacı’nın Yolu"
 ara_crown_mission_pack_DESCRIPTION:0 "Katalonya’yı, Aragon’u ve Valensiya’yı birleştiren Aragon Tacı tarihin merkezinde durur ve İber birliği ve Akdeniz üstünlüğü için yarışır. Kastilya ile el ele verip İspanya’yı dövebilir ya da tek başına yola çıkıp Napoli’yi bütünleştirerek İstanbul’a yürüyebilirsin. Yol senin seçimin."
 ara_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Aragon Tacı olarak görevleri tamamla ve İber birliğini ve Akdeniz hegemonyasını kur."
 ara_crown_mission_pack_BUTTON_TOOLTIP:0 "Aragon Tacı’nın yolunda yürümek için görevleri tamamla."
 ara_crown_mission_pack_BUTTON_DETAILS:0 "İspanya’nın temelini at, batı Akdeniz’in efendisi ol ve İstanbul’u ele geçir!"
 ara_accession_of_pedro_iv: "IV. Pedro’nun Tahta Çıkışı"
 ara_accession_of_pedro_iv_desc: "1336’da IV. Alfonso’nun ölümüyle oğlu IV. Pedro (Törenci III. Pere) Aragon Tacı’nın tahtına çıktı. Bilgili ve saray törenlerine derinden bağlı bu genç kral kraliyet otoritesini güçlendirme ve diyarı birleştirme konusunda kararlıdır. Yeni bir saltanatın şafağıyla Aragon’un Akdeniz’deki emelleri bir kez daha yanmaya başlıyor."
 ara_kingdom_of_majorca: "Mayorka Krallığı"
 ara_kingdom_of_majorca_desc: "Bir zamanlar Aragon kraliyet evinin bir yan koluyla yönetilen Mayorka Krallığı, Balear Adaları’nda ayrı bir siyasi güç olarak varlığını sürdürüyor. Bu toprağı tamamen bütünleştirmek batı Akdeniz’deki daha büyük emellere ilk adım olacak."
 ara_reconquest_of_granada: "Granada’nın Yeniden Fethi"
 ara_reconquest_of_granada_desc: "İber Yarımadası’ndaki İslam’ın son kalesi Granada Krallığı, bereketli toprakları ve muhteşem sarayları ile Hıristiyan kralları uzun süredir kışkırttı. Bu diyarı fethetmek Reconquista’nın tamamlanması demektir: yüzyıllara yayılan bir mücadelenin sonu."
 ara_vassalize_navarre: "Navarra’yı Vasallaştır"
 ara_vassalize_navarre_desc: "Fransa ile Kastilya arasına sıkışmış küçük Navarra Krallığı, Aragon için stratejik açıdan hayati bir tampon bölgedir. Fransa onu özümsemeden önce Navarra’yı Aragon’un nüfuz alanına almalıyız."
 ara_intervene_in_castile: "Kastilya’ya Müdahale Et"
 ara_intervene_in_castile_desc: "Kendi kraliyet evimizle Trastámara kanını paylaşan Kastilya sarayı uzun süredir hizip çekişmeleriyle parçalanıyor. Aragon İnfantları bir zamanlar bu büyük krallık üzerindeki nüfuz için yarıştığı gibi, şimdi onun kaderine müdahale etme zamanı."
 ara_union_of_the_crowns: "Tacların Birliği"
 ara_union_of_the_crowns_desc: "Aragon ve Kastilya tacları tek bir kraliyet evi altında birleşti. Bu yeni bir krallığın, İspanya’nın şafağı. Fernando ve Isabel çağında dövülen tarihî birliği kendi ellerimizle gerçeğe dönüştürelim."
 ara_catalan_nobility: "Katalan Soylular"
 ara_catalan_nobility_desc: "Ayaklanmadan sonra Katalan soyluların kaderine karar vermeliyiz. Yetkilerini ellerinden alıp kraliyet otoritesini mi güçlendirmeli, yoksa reforme edilmiş bir düzen içinde bir arada yaşamayı mı aramalı? Bu karar Katalonya’nın istikrarını ve diyar genelindeki yönetimin geleceğini belirleyecek."
 ara_crowns_of_iberia: "İberya Tacları"
 ara_crowns_of_iberia_desc: "Aragon, Kastilya, Navarra, Granada: İber Yarımadası’nın tüm tacı tek bir kraliyet evi altında toplandı. Burada İspanyol İmparatorluğu’nun temeli atıldı. Yeni bir imparatorluğun doğuşunu dünyaya duyurma vakti geldi."
 ara_pacify_sardinia: "Sardinya’yı Yatıştır"
 ara_pacify_sardinia_desc: "Aragon uzun süredir Sardinya üzerinde egemenlik iddia etti, ama iç isyanlar ve rakip güçler adayı rahatsız etti. Bu zengin Akdeniz kalesini tamamen yatıştırmak doğuya doğru daha fazla genişleme için vazgeçilmez bir basamaktır."
 ara_consulate_of_the_sea: "Deniz Konsolosluğu"
 ara_consulate_of_the_sea_desc: "Barselona ve Valensiya çevresinde gelişen denizcilik ticaret hukuku, yani Consolat de Mar, Akdeniz ticaretini düzenler. Bu kurumun itibarından yararlanarak batı Akdeniz ticaretini yargı yetkimiz altına al."
 ara_dominate_genoa: "Cenova’ya Hâkim Ol"
 ara_dominate_genoa_desc: "Cenova uzun süredir Aragon ile Akdeniz ticaretine hâkimiyet için yarıştı. Liguria’yı ve Cenova’nın kendisini ele geçirebilirsek batı Akdeniz boyunca ticaret tamamen ellerimize düşecek."
 ara_rule_italy: "İtalya’ya Hükmet"
 ara_rule_italy_desc: "Papa’nın egemenlik alanı dahil tüm İtalya’ya hükmetmek salt fetihten öte tarihî bir anlam taşır. Roma’nın mirasının yaşadığı toprağı yöneterek Aragon kendini Avrupa’nın hegemonu olarak kurar."
 ara_invade_occitania: "Oksitanya’yı İstila Et"
 ara_invade_occitania_desc: "Provence, Languedoc, Gaskonya: güney Fransa’nın toprakları bir zamanlar Aragon nüfuz alanının içindeydi. Kuzey sınırımızı Fransa Krallığı’na doğru itmek İber Yarımadası’nın güvenliği için esaslı bir stratejik görevdir."
 ara_humiliate_provence: "Provence’ı Küçük Düşür"
 ara_humiliate_provence_desc: "Provence Kontu uzun süredir hem Aragon hem Napoli üzerinde meşru veraset hakları iddia etti. Bu küstah iddialara son vermeli ve Provence’ı denetimimiz altına almalıyız: batı Akdeniz hegemonyamızı saldırılamaz kılmak için."
 ara_aragonese_navy: "Aragon Donanması"
 ara_aragonese_navy_desc: "Aragon Tacı’nın toprakları Akdeniz’e dağılmış durumda. Hepsini korumak ve deniz üstünlüğünü sürdürmek güçlü bir filo gerektirir. Aragon Armada’sını inşa et ve bu iç denize komuta kur."
 ara_seize_sicily: "Sicilya’yı Ele Geçir"
 ara_seize_sicily_desc: "Aragon filosu güçlendiğinde Sicilya adasının istilası gerçek bir olasılık haline geldi. “Sicilya Vespers”la Fransızlardan kurtulan Sicilya Aragon’u kendi koruyucusu olarak görür. Palermo’yu güvenceye al ve bu hayati Akdeniz kalesini ilelebet Aragon’un yap."
 ara_integrate_naples: "Napoli’yi Bütünleştir"
 ara_integrate_naples_desc: "Kral V. Alfonso’nun fethettiği Napoli Krallığı, Aragon tacının mücevherlerinden biri olmayı sürdürür. Güney İtalya’yı ve Napoli liman şehrini tamamen bütünleştirerek krallığımız doğu Akdeniz’e genişleme için bir köprübaşı kazanır."
 ara_mediterranean_ambitions: "Akdeniz Emelleri"
 ara_mediterranean_ambitions_desc: "Adımızı doğu Akdeniz’e kadar duyurmak için daha büyük bir filo ve daha güçlü bir deniz gücü gerekir. Büyük bir kadırga filosu inşa et ve bayrağımızı tüm Akdeniz’de dalgalandır. Balkanlar’da bir tutunak artık erişim içinde."
 ara_combat_barbary_piracy: "Berberi Korsanlığıyla Savaş"
 ara_combat_barbary_piracy_desc: "Kuzey Afrika kıyısı boyunca konuşlanan Müslüman korsanlar Aragon ticaretine sürekli tehdit oluşturur. Üslerine vurmak ve masum Hıristiyanları kölelikten kurtarmak hem inanç hem ulusal çıkar için acildir."
 ara_conquer_tunis: "Tunus’u Fethet"
 ara_conquer_tunis_desc: "Tunus salt bir korsan limanı değil. Osmanlılarla bağları olan bu deniz gücünü denetimsiz bırakırsak Akdeniz hegemonyamız sürekli tehlikeye girecek. Tunus’u fethet ve Kuzey Afrika’ya komutayı tamamen kur."
 ara_occupy_alexandria: "İskenderiye’yi İşgal Et"
 ara_occupy_alexandria_desc: "Doğu Akdeniz’in anahtarı İskenderiye, bir zamanlar antik dünya bilgisinin merkeziydi ve Mısır ve Asya ticaretinin merkezi olmayı sürdürür. Bu şehri ele geçirip doğu ticaretini tekelleştirebilirsek Aragon gerçek bir Akdeniz hegemonu olur."
 ara_claims_on_athens: "Atina Üzerinde Hak İddiaları"
 ara_claims_on_athens_desc: "Aragonlu paralı askerler, yani Katalan Birliği, bir zamanlar Atina Dukalığı’nı kurduğu için Aragon Yunan topraklarında tarihî haklara sahiptir. Mora’yı ve kuzey Yunanistan’ı ele geçir ve İstanbul’a giden yoldaki son tutunağı güvenceye al."
 ara_mare_nostrum: "Mare Nostrum"
 ara_mare_nostrum_desc: "Cebelitarık’tan Marmara Denizi’ne Akdeniz bizim gölümüzdür. Hiç kimse Aragon filosunun izni olmadan bu sularda seyredemez. Batı Akdeniz üzerindeki hegemonya kuruldu: bir sonraki hedef kadim surlarının ardındaki o altın şehir."
 ara_taula_de_canvi: "Taula de Canvi"
 ara_taula_de_canvi_desc: "1401’de Barselona’da kurulan Taula de Canvi (Değişim Masası) Avrupa’nın en eski kamu bankalarından biridir. Ticaretin genişlemesiyle giderek sofistikeleşen bu mali kurumdan yararlanarak krallığın maliyesini sarsılmaz bir temel üzerine koyabiliriz."
 ara_valencian_silk: "Valensiya İpeği"
 ara_valencian_silk_desc: "Valensiya ince ipek üreticisi olarak tanınmaya başlıyor. İpek Borsası’nı (Llotja de la Seda) güçlendirerek ve Valensiya’nın ipek sanayisini geliştirerek doğu rekabetine karşı bile üstünlük kazanabiliriz."
 ara_guilds_of_barcelona: "Barselona Loncaları"
 ara_guilds_of_barcelona_desc: "Barselona’nın zanaatkâr ve tüccar loncaları uzun süredir şehir ekonomisinin belkemiği olmuştur. Sadakatlerini güvence altına alarak ve diyar genelinde benzer loncalar örgütleyerek sanayinin ve ticaretin temeli daha da pekiştirilecek."
 ara_industrial_districts: "Sanayi Bölgeleri"
 ara_industrial_districts_desc: "Cam, şarap, kâğıt ve ipek: Aragon çeşitli yüksek değerli mallara ev sahipliği yapar. Bu sanayileri örgütleyerek ve imalatı geliştirerek krallığın ekonomik gücü sıçramalarla büyüyecek."
 ara_aragonese_renaissance: "Aragon Rönesansı"
 ara_aragonese_renaissance_desc: "V. Alfonso’nun sarayı Napoli’de Rönesans kültürünün bir merkezi oldu ve yarımadanın dört bir yanından İtalyan hümanistleri çekti. Bu kültürel çiçeklenmeyi krallık genelinde yayarak Aragon kendini Avrupa’nın entelektüel ve sanatsal kalbi olarak kuracak."
 ara_golden_century: "Altın Yüzyıl"
 ara_golden_century_desc: "İberya’yı birleştirmiş, Akdeniz’e hâkim olmuş ve ekonomi ile kültürün çiçek açtığını görmüş krallığımız gerçekten Siglo de Oro’ya, yani Altın Yüzyıl’a giriyor. Parlaklığı nesiller boyu anılacak."
 ara_city_of_the_worlds_desire: "Dünyanın Arzu Ettiği Şehir"
 ara_city_of_the_worlds_desire_desc: "İstanbul, dünyanın arzu ettiği şehir. Altın surları yüzyıllar boyunca birçok fatihi geri püskürttü. Ama şimdi Akdeniz’in efendisi filomuz ve İberya genelinde birleşmiş ordularımız bu şehri nihayet kuşatmaya hazır duruyor. Boğaz’ın iki kıyısını da ele geçir ve kadim hayali gerçeğe dönüştür."
 ara_plus_ultra: "Plus Ultra"
 ara_plus_ultra_desc: "“Plus Ultra”: daha ötesi. Bir zamanlar Herkül Sütunları’nın batısında hiçbir şey olmadığı söylenirdi. Ama kâşiflerimiz artık ötesinde uçsuz bucaksız bilinmeyen bir deniz yattığını biliyor. Sütunların ötesine yelken açıp dünyanın uçlarına yönelme vakti geldi."
 ara_african_outposts: "Afrika Karakolları"
 ara_african_outposts_desc: "Batı Afrika kıyısı boyunca güneye ilerlemek, altına ve ticaret mallarına doğrudan ulaşmak için Müslüman aracıları atlayan yeni yollar açar. Önce Kanarya Adaları’nda ve Fas kıyısı boyunca tutunaklar kur."
 ara_gold_coast_trade: "Altın Sahil Ticareti"
 ara_gold_coast_trade_desc: "Batı Afrika kıyısının Altın Sahil olarak bilinen bölgesi, adına yaraşır biçimde zengin bir altın kaynağıdır. Burada bir ticaret karakolu kurarak, Sahra kara yoluna güvenmeden Afrika’nın servetini doğrudan krallığa getirebiliriz."
 ara_discover_the_new_world: "Yeni Dünya’yı Keşfet"
 ara_discover_the_new_world_desc: "Büyük okyanusun batısında ne var? Yuvarlak bir Dünya’ya inanan kâşiflerimiz Asya’ya batıya giden bir yolun var olduğuna ikna olmuş durumda. Bir keşif filosu donat ve bilinmeyen denize açıl. Orada bulacağın şey herkesin hayal gücünün ötesinde bir Yeni Dünya olabilir."
 ara_caribbean_foothold: "Karayip Tutunağı"
 ara_caribbean_foothold_desc: "Yeni Dünya’da ilk köprübaşımızı kurduk. Hispaniola’yı ve çevre adaları iskân et ve onları kıtanın daha derinlerine keşif için fırlatma noktası yap. Buradan güneye, kuzeye ve iç kesimlerin derinliklerine yollar önümüzde açılıyor."
 ara_conquest_of_the_incas: "İnkalar’ın Fethi"
 ara_conquest_of_the_incas_desc: "Güney Amerika kıtasının derinliklerinde altınla ve gümüşle dolu olduğu söylenen büyük bir imparatorluk yatar: İnka İmparatorluğu (Tawantinsuyu). Fatihleri And yaylalarına götür ve bu imparatorluğun servetini krallığın kendisi yap."
 ara_new_kingdom_of_aragon: "Yeni Aragon Krallığı"
 ara_new_kingdom_of_aragon_desc: "Yeni Dünya’da kurduğumuz koloniler artık salt karakollar değil. Onları Aragon tacının doğrudan egemenlik alanı olarak, yani Yeni Aragon Krallığı olarak, anavatanınkilerle eşleşen kurumlarla örgütle. Amerika’nın hükümdarı olarak kralımız iki dünyanın efendisi olarak kaydedilecek."
 ara_route_to_the_indies: "Hint Adaları’na Giden Yol"
 ara_route_to_the_indies_desc: "Portekiz Afrika’nın güney ucunu dolaşarak Hindistan’a deniz yoluna zaten öncülük etti. Ama kenardan seyredemeyiz. Macellan gibi dünyanın etrafından bir yol aç ya da Hindistan limanlarına Portekiz’den önce ulaş."
 ara_spice_trade_outposts: "Baharat Ticareti Karakolları"
 ara_spice_trade_outposts_desc: "Baharat Adaları’ndan (Moluk Adaları) gelen karanfil, hindistan cevizi ve karabiber Avrupa’da muazzam fiyatlar getirir. Orada bir üs kurup baharat ticaretini tekelleştirebilirsek krallığın hazinesi ebediyen zenginleşir."
 ara_las_filipinas: "Las Filipinas"
 ara_las_filipinas_desc: "Macellan’ın ulaştığı takımadalar: Filipinler (Filipinas). Bu stratejik konumdaki adaları fethedip kolonileştirerek Pasifik ticaretinin merkezinde yeni bir merkez ortaya çıkar. Çin ile Amerika’yı bağlayan gümüş ticaret yolunun orta noktası olarak bu toprağın hesaplanamaz bir değeri vardır."
 ara_empire_of_the_three_oceans: "Üç Okyanus İmparatorluğu"
 ara_empire_of_the_three_oceans_desc: "Atlantik, Hint Okyanusu, Pasifik: bayrağını üç büyük okyanusta dalgalandıran bir imparatorluk doğdu. Aragon’un asası artık yalnızca Avrupa saraylarına değil, Afrika ormanlarına, Yeni Dünya yaylalarına ve Asya’nın baharat adalarına uzanıyor. Tarihte hiçbir ulusun başarmadığı bir başarıyı gerçekleştirdik."
 STATIC_MODIFIER_NAME_ara_kingdom_of_majorca_mod: "Balear Filosu"
 STATIC_MODIFIER_DESC_ara_kingdom_of_majorca_mod: "Batı Akdeniz’de tutunağımızı güvence altına almak gemilerimizin menzilini ve tüccarlarımızın erişimini artırdı."
 STATIC_MODIFIER_NAME_ara_reconquest_of_granada_mod: "Haçlı Seferinin Şanı"
 STATIC_MODIFIER_DESC_ara_reconquest_of_granada_mod: "Reconquista’nın tamamlanması sapkınlara hoşgörümüzü ve tacın meşruiyetini yükseltti."
 STATIC_MODIFIER_NAME_ara_vassalize_navarre_mod: "Pireneler’in Dengesi"
 STATIC_MODIFIER_DESC_ara_vassalize_navarre_mod: "Navarra’yı nüfuz alanımıza almak krallığın diplomatik konumunu yükseltti."
 STATIC_MODIFIER_NAME_ara_intervene_in_castile_mod: "Kastilya Seferi Kuvveti"
 STATIC_MODIFIER_DESC_ara_intervene_in_castile_mod: "Kastilya’ya müdahale eden kraliyet ordusu yüksek kara morali taşır."
 STATIC_MODIFIER_NAME_ara_union_of_the_crowns_mod: "Katolik Hükümdarların Şanı"
 STATIC_MODIFIER_DESC_ara_union_of_the_crowns_mod: "II. Fernando ile I. Isabel’in 1469’daki evliliği Aragon ve Kastilya’nın iki büyük krallığını bir hanedan birliğinde bağladı. “Katolik Hükümdarlar” denen ikilinin saltanatı birleşik bir İspanyol devletinin temeli oldu ve çok geçmeden Granada’nın fethi ve Kolomb’un yolculukları izledi."
 STATIC_MODIFIER_NAME_ara_catalan_nobility_mod: "Justicia’nın Hükmü"
 STATIC_MODIFIER_DESC_ara_catalan_nobility_mod: "Justicia de Aragón’un kurulması soylu zümresinin hoşnutsuzluğunun daha çabuk yatışmasına izin verir."
 STATIC_MODIFIER_NAME_ara_crowns_of_iberia_mod: "İspanya’nın Savaş Hazırlığı"
 STATIC_MODIFIER_DESC_ara_crowns_of_iberia_mod: "Aragon Tacı’nı Kastilya ve Portekiz ile birleştirerek tüm İber yarımadası tek bir hükümdarın altına girer. Roma İmparatorluğu’ndan beri süren birleşik “Hispania” hayalinin gerçekleşmesi dünya-tarihî ölçekte bir girişimdir."
 STATIC_MODIFIER_NAME_ara_pacify_sardinia_mod: "Sardinya Garnizonu"
 STATIC_MODIFIER_DESC_ara_pacify_sardinia_mod: "Yatıştırılan Sardinya adası krallığın insan gücünü artırdı ve savaşın yükünü hafifletti."
 STATIC_MODIFIER_NAME_ara_consulate_of_the_sea_mod: "Denizcilik Hukukunun İtibarı"
 STATIC_MODIFIER_DESC_ara_consulate_of_the_sea_mod: "Denizcilik hukukumuzun itibarı krallığın ticaret gelirini ve tüccarlarının erişimini artırdı."
 STATIC_MODIFIER_NAME_ara_dominate_genoa_mod: "Liguria Ticaret Evi"
 STATIC_MODIFIER_DESC_ara_dominate_genoa_mod: "Cenova’nın ticaret evi tüccarlarımızın bu topraktaki erişimini artırdı."
 STATIC_MODIFIER_NAME_ara_rule_italy_mod: "Yarımadanın Hegemonu"
 STATIC_MODIFIER_DESC_ara_rule_italy_mod: "Aragon Tacı, Cömert V. Alfonso’nun Napoli’yi fethiyle (1442) İtalya’ya derinden karıştı. Alfonso Napoli’yi makamı yaptı ve Rönesans’ın büyük hamisi olarak hüküm sürdü. Tüm İtalya üzerinde egemenlik Alfonso’nun emelinin nihai gerçekleşmesi olurdu."
 STATIC_MODIFIER_NAME_ara_invade_occitania_mod: "Oksitanya Seferi Kuvveti"
 STATIC_MODIFIER_DESC_ara_invade_occitania_mod: "Güney Fransa’da savaşmış olan kraliyet ordusu daha hızlı yürür ve daha büyük bir ustalıkla kuşatır."
 STATIC_MODIFIER_NAME_ara_humiliate_provence_mod: "Provence’ın Boyun Eğdirilmesi"
 STATIC_MODIFIER_DESC_ara_humiliate_provence_mod: "Provence tersanelerinin ele geçirilmesiyle krallığın deniz malzemesi üretimi arttı."
 STATIC_MODIFIER_NAME_ara_aragonese_navy_mod: "Armada de Aragón"
 STATIC_MODIFIER_DESC_ara_aragonese_navy_mod: "Yeniden düzenlenen Aragon filosu yüksek moral ve mükemmel onarım kabiliyeti taşır."
 STATIC_MODIFIER_NAME_ara_integrate_naples_mod: "İki Sicilya’nın Hazinesi"
 STATIC_MODIFIER_DESC_ara_integrate_naples_mod: "Napoli ile ticaret gelişir ve kraliyet ordusunun insan gücü büyüdü."
 STATIC_MODIFIER_NAME_ara_mediterranean_ambitions_mod: "Kadırga Filosunun Gücü"
 STATIC_MODIFIER_DESC_ara_mediterranean_ambitions_mod: "Genişleyen filo yüksek moral ve eşsiz bir harekât menzili taşır."
 STATIC_MODIFIER_NAME_ara_combat_barbary_piracy_mod: "Korsanlık Karşıtı Filo"
 STATIC_MODIFIER_DESC_ara_combat_barbary_piracy_mod: "Korsanları bastıran krallığın ticaret gemileri güvenle daha uzağa yelken açar ve ordunun disiplini arttı."
 STATIC_MODIFIER_NAME_ara_conquer_tunis_mod: "Kuzey Afrika Garnizonu"
 STATIC_MODIFIER_DESC_ara_conquer_tunis_mod: "Kuzey Afrika’ya komutayı güvenceye almak savaş müzakerelerindeki elimizi güçlendirdi ve ordunun insan gücü arttı."
 STATIC_MODIFIER_NAME_ara_occupy_alexandria_mod: "Doğu Ticareti Tekeli"
 STATIC_MODIFIER_DESC_ara_occupy_alexandria_mod: "Doğu ticaretinin bir merkezini güvenceye almak krallığın ticaret gelirini ve tüccarlarının erişimini hiç olmadığı kadar artırdı."
 STATIC_MODIFIER_NAME_ara_claims_on_athens_mod: "Katalan Birliği’nin Mirası"
 STATIC_MODIFIER_DESC_ara_claims_on_athens_mod: "Yunanistan’da sefer yapan kraliyet ordusu daha hızlı yürür ve savaşın yükü diyarın üzerine daha hafif biner."
 STATIC_MODIFIER_NAME_ara_mare_nostrum_mod: "Akdeniz Filosu Yüksek Komutanlığı"
 STATIC_MODIFIER_DESC_ara_mare_nostrum_mod: "Tüm Akdeniz’e hâkim olan filomuz yüksek moral ve eşsiz bir harekât ve ticaret menzili taşır."
 STATIC_MODIFIER_NAME_ara_taula_de_canvi_mod: "Değişim Masası’nın Kredisi"
 STATIC_MODIFIER_DESC_ara_taula_de_canvi_mod: "1401’de Barselona’da kurulan “Taula de Canvi” (değişim masası) dünyanın ilk kamu bankaları arasında sayılır. Barselona tüccar loncalarınca yönetilen bu mali kurum borçları, kambiyoyu ve mevduatı yürüttü ve Katalan ticaretini destekleyen bir sütun oldu."
 STATIC_MODIFIER_NAME_ara_valencian_silk_mod: "Llotja de la Seda"
 STATIC_MODIFIER_DESC_ara_valencian_silk_mod: "Valensiya ortaçağ Akdeniz’inin önde gelen ipek üretim merkezlerinden biriydi. Mağriplilerin getirdiği ipekböcekçiliği teknikleri Hıristiyan zanaatkârlara geçti ve Valensiya ipeği İtalya’nın ince kumaşlarıyla eşit itibar taşıdı. Llotja de la Seda (ipek borsası) refahının simgesidir."
 STATIC_MODIFIER_NAME_ara_guilds_of_barcelona_mod: "Loncaların Sadakati"
 STATIC_MODIFIER_DESC_ara_guilds_of_barcelona_mod: "Barselona loncalarıyla güçlenen bağlar bu toprağın üretim verimliliğini hafifçe artırdı."
 STATIC_MODIFIER_NAME_ara_industrial_districts_mod: "İmalatın Yükselişi"
 STATIC_MODIFIER_DESC_ara_industrial_districts_mod: "Barselona’da, Valensiya’da ve Zaragoza’da yün, kumaş, deri ve metal işleme atölyelerinin yoğunlaştığı sanayi bölgeleri gelişti. Aragon Tacı’nın ticari refahı bu kentsel sanayilerin üretken gücüyle desteklendi ve mamulleri İtalya pazarlarında bile yüksek saygı gördü."
 STATIC_MODIFIER_NAME_ara_aragonese_renaissance_mod: "Hümanistlerin Sarayı"
 STATIC_MODIFIER_DESC_ara_aragonese_renaissance_mod: "Bu kültürel çiçeklenme yeni sanatçıların becerisini ve yenilik hızını yükseltti."
 STATIC_MODIFIER_NAME_ara_golden_century_mod: "Siglo de Oro’nun Refahı"
 STATIC_MODIFIER_DESC_ara_golden_century_mod: "Siglo de Oro (Altın Yüzyıl), İspanya’nın siyasi, askerî ve kültürel başarının zirvesine ulaştığı 16. ve 17. yüzyılları ifade eder. Cervantes’in “Don Kişot”u, Velázquez’in saray resimleri, Lope de Vega’nın oyunları: birleşik Aragon ve Kastilya Tacları Avrupa kültürünün zirvesinde hüküm sürdü."
 STATIC_MODIFIER_NAME_ara_city_of_the_worlds_desire_mod: "Boğaz’ın Efendisi"
 STATIC_MODIFIER_DESC_ara_city_of_the_worlds_desire_mod: "İstanbul’u elinde tutan bir imparatorluğun görkemi onun prestijini ve meşruiyetini yükseltti ve savaş müzakerelerindeki elini hiç olmadığı kadar güçlendirdi."
 STATIC_MODIFIER_NAME_ara_plus_ultra_mod: "Ötesine Yolculuk Ateşi"
 STATIC_MODIFIER_DESC_ara_plus_ultra_mod: "Ötesini keşfetme ruhu sömürge filolarımızın ve donanmamızın menzilini genişletti."
 STATIC_MODIFIER_NAME_ara_african_outposts_mod: "Kanarya Karakolları"
 STATIC_MODIFIER_DESC_ara_african_outposts_mod: "Afrika kıyısı boyunca karakollarımız krallığın ticaret gemilerinin menzilini genişletti."
 STATIC_MODIFIER_NAME_ara_gold_coast_trade_mod: "Altın Ticareti Ağı"
 STATIC_MODIFIER_DESC_ara_gold_coast_trade_mod: "Altın Sahil ile ticaret krallığın ticaret gelirini ve tüccarlarının erişimini artırdı."
 STATIC_MODIFIER_NAME_ara_discover_the_new_world_mod: "Okyanus Filosunun Ruhu"
 STATIC_MODIFIER_DESC_ara_discover_the_new_world_mod: "Yeni Dünya’nın kapısının açılması krallık genelinde göçmen akışını hızlandırdı."
 STATIC_MODIFIER_NAME_ara_caribbean_foothold_mod: "Hispaniola Yerleşimleri"
 STATIC_MODIFIER_DESC_ara_caribbean_foothold_mod: "Yeni Dünya’daki tutunağımız yerleşimciler için çekiciliğini artırdı."
 STATIC_MODIFIER_NAME_ara_conquest_of_the_incas_mod: "Fatihlerin Mirası"
 STATIC_MODIFIER_DESC_ara_conquest_of_the_incas_mod: "1532’de Francisco Pizarro İnka imparatoru Atahualpa’yı yakaladı ve İnka İmparatorluğu’nu fethetti. Dünyanın en büyük altın uygarlığının yağması İspanya’ya benzeri görülmemiş servet getirdi ve Potosí gümüş madenlerinin keşfiyle Yeni Dünya’dan Avrupa’ya muazzam miktarda kıymetli maden aktı."
 STATIC_MODIFIER_NAME_ara_new_kingdom_of_aragon_mod: "Amerika’nın Tacı"
 STATIC_MODIFIER_DESC_ara_new_kingdom_of_aragon_mod: "Yeni Aragon Krallığı’nın inşası, Aragon’un mirasını Yeni Dünya’ya nakletmeye yönelik büyük bir sömürge girişimidir. Yerli emeği bütünleştiren encomienda sistemi altında gümüş, altın, şeker ve boyalar anavatana gönderilmeyi sürdürür."
 STATIC_MODIFIER_NAME_ara_route_to_the_indies_mod: "Denizcilerin Pusulası"
 STATIC_MODIFIER_DESC_ara_route_to_the_indies_mod: "Hint Adaları’na giden yolun açılması filomuzun harekât menzilini genişletti."
 STATIC_MODIFIER_NAME_ara_spice_trade_outposts_mod: "Moluk Ticaret Evi"
 STATIC_MODIFIER_DESC_ara_spice_trade_outposts_mod: "Karabiber, hindistan cevizi ve karanfil gibi baharatlar ortaçağ Avrupası’nda altın kadar değerliydi. Müslüman tüccarların ve Venedik’in tekelindeki bu ticaret yolunu kesmek ve doğrudan kaynakta üsler kurmak imparatorluk servetinin bir pınarıdır."
 STATIC_MODIFIER_NAME_ara_las_filipinas_mod: "Pasifik Konak Yeri"
 STATIC_MODIFIER_DESC_ara_las_filipinas_mod: "Filipin takımadalarına Macellan ulaştı (1521) ve sonra Luzon’daki Manila’yı üs alarak “kalyon ticareti”nin merkezi oldu. Meksika’daki Acapulco ile Manila’yı bağlayan bu yol boyunca Yeni Dünya gümüşü sürekli Çin ipeği ve porseleniyle değiş tokuş edildi."
 STATIC_MODIFIER_NAME_ara_empire_of_the_three_oceans_mod: "Güneşin Batmadığı İmparatorluk"
 STATIC_MODIFIER_DESC_ara_empire_of_the_three_oceans_mod: "Üç okyanusa yayılan bir imparatorluğun görkemi krallığın ticaret gelirini ve tüccarlarının erişimini hiç olmadığı kadar yükseltti."
 ara_events.1.t: "IV. Pedro’nun Tahta Çıkışı"
 ara_events.1.d: "1336’da IV. Alfonso öldü ve oğlu IV. Pedro Aragon Tacı’nın tahtına çıktı. 1337 itibarıyla diyar Katalonya, Aragon, Valensiya ve Balear Adaları topraklarının gevşek bir birliğidir. Sardinya üzerindeki denetim istikrarsız kalıyor ve komşu Kastilya ile ilişkiler sürekli bir gerilim altında. Akdeniz ticaret yollarına hükmeden tüccar güçler büyük nüfuza sahip ve taç bu çeşitli diyarların ayrıcalıklarına danışarak yönetmelidir. Genç Kral IV. Pedro’nun önünde birleşik bir İberya’ya ve Akdeniz üstünlüğüne giden uzun bir yol uzanıyor."
 ara_events.1.a: "Yeni bir saltanat başlıyor"
 ara_events.2.t: "Mayorka Krallığı’nın Bütünleşmesi"
 ara_events.2.d: "Bir zamanlar II. Jaume tarafından Aragon kraliyet evinin bir yan kolu olarak kurulan Mayorka Krallığı, Balear Adaları’ndaki, Roussillon’daki ve Montpellier’deki mülklerine rağmen uzun süredir Aragon’un nüfuz alanında kaldı. Tam bütünleşme zamanı geldi. Onu doğrudan ilhak edip Aragon’un bir parçası mı yapmalı, yoksa dostane bir vasal olarak mı elde tutmalı: her iki durumda da Mayorka Aragon tacı altına girecek."
 ara_events.2.a: "Mayorka’yı doğrudan ilhak et"
 ara_events.2.b: "Mayorka’yı dostane bir vasal olarak elde tut"
 STATIC_MODIFIER_NAME_ara_seize_sicily_mod: "Sicilya’yı Ele Geçirmenin Şanı"
 STATIC_MODIFIER_DESC_ara_seize_sicily_mod: "1282’deki “Sicilya Vespers”ta Anjou Hanedanı’nı kovan Sicilyalılar Aragonlu III. Pedro’yu yeni kralları olarak karşıladı. O günden sonra Sicilya Aragon kraliyet evinin önemli bir egemenlik alanıydı ve orta Akdeniz’e komuta eden stratejik bir anahtar olarak işlev görmeyi sürdürdü."
