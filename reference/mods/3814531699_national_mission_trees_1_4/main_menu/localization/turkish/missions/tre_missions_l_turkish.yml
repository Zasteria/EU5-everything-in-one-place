l_turkish:
 tre_trebizond_mission_pack: "Komnenos Hanedanı’nın Canlanışı ve Bizans’ın Yeniden Kuruluşu"
 tre_trebizond_mission_pack_DESCRIPTION:0 "1337’de Trabzon İmparatorluğu Komnenos hanedanının mirasçıları olarak Pontus kıyısında küçük bir devlet olarak varlığını sürdürüyor. Karadeniz ticaretini ele geçir, Anadolu’yu yeniden fethet, İstanbul’u kurtar ve Bizans İmparatorluğu’nu yeniden kur."
 tre_trebizond_mission_pack_CRITERIA_DESCRIPTION:0 "Anadolu’yu fethet, İstanbul’u geri al, Balkanlar’a boyun eğdir ve Bizans İmparatorluğu’nu yeniden kur."
 tre_trebizond_mission_pack_BUTTON_TOOLTIP:0 "Komnenos İmparatorluğu’nu yeniden kur."
 tre_trebizond_mission_pack_BUTTON_DETAILS:0 "Pontus kıyılarından Bizans mirasını devral ve zaferle İstanbul’a yürü!"
 tre_komnenian_legacy: "Komnenos Mirası"
 tre_komnenian_legacy_desc: "Komnenos hanedanının mirası Trabzon’un Bizans büyüklüğünü yeniden kurma emelini yönlendiriyor."
 tre_pontus_coast: "Pontus Kıyısını Güvenceye Al"
 tre_pontus_coast_desc: "Karadeniz ticaret hâkimiyetinin temeli olarak Pontus kıyı şeridini güvenceye al."
 tre_black_sea_trade: "Karadeniz Ticareti"
 tre_black_sea_trade_desc: "Karadeniz ticaretini Cenevizli ve Venedikli rakiplerden ele geçir."
 tre_dev_trebizond: "Trabzon’u Geliştir"
 tre_dev_trebizond_desc: "Trabzon’u Komnenos İmparatorluğu’na layık gelişen bir merkeze dönüştür."
 tre_orthodox_stronghold: "Ortodoks Kalesi"
 tre_orthodox_stronghold_desc: "Trabzon’u Bizans’ın manevi varisi olarak ortaya koymak için Ortodoks manastırlarını güçlendir."
 tre_armenia_campaign: "Ermenistan’a Boyun Eğdir"
 tre_armenia_campaign_desc: "Doğu sınırını güvenceye almak ve dağ savaşçıları kazanmak için Ermenistan’a boyun eğdir."
 tre_cappadocia: "Kapadokya’nın Fethi"
 tre_cappadocia_desc: "Kapadokya’nın mağara manastırı ana topraklarını fethet ve orta Anadolu’ya doğru ilerle."
 tre_central_anatolia: "Orta Anadolu’yu Geri Al"
 tre_central_anatolia_desc: "Ankara dahil orta Anadolu’yu Türk yönetiminden geri al."
 tre_west_anatolia: "Batı Anadolu’ya Yürü"
 tre_west_anatolia_desc: "Batı Anadolu’nun zengin Ege kıyısına yürü."
 tre_reclaim_nicaea: "İznik’i Geri Al"
 tre_reclaim_nicaea_desc: "Sürgündeki Bizans başkenti İznik’i ve Bursa’yı geri al ve İstanbul’a yaklaş."
 tre_anatolian_emperor: "Anadolu İmparatoru"
 tre_anatolian_emperor_desc: "Tüm Anadolu’yu Komnenos sancağı altında birleştir."
 tre_thrace_campaign: "Trakya’yı Ele Geçir"
 tre_thrace_campaign_desc: "İstanbul’u kuşatmak ve kurtuluşuna hazırlanmak için Trakya’yı ele geçir."
 tre_reclaim_constantinople: "İstanbul’u Geri Al"
 tre_reclaim_constantinople_desc: "İstanbul’u kurtar ve Ortodoks haçını Ayasofya’nın üzerine geri koy."
 tre_northern_greece: "Kuzey Yunanistan’ı Geri Al"
 tre_northern_greece_desc: "Bizans’ın ikinci şehri Selanik dahil kuzey Yunanistan’ı geri al."
 tre_bulgaria: "Bulgaristan’ın Fethi"
 tre_bulgaria_desc: "Balkan hâkimiyetini pekiştirmek için Bulgaristan’ı fethet."
 tre_morea: "Mora’yı Geri Al"
 tre_morea_desc: "Kadim Yunan medeniyetinin kalbi Mora’yı ve Atina’yı geri al."
 tre_aegean_islands: "Ege Adaları"
 tre_aegean_islands_desc: "Ege adalarını Latin Haçlı işgalinden geri al."
 tre_macedonian_campaign: "Makedonya’nın Fethi"
 tre_macedonian_campaign_desc: "Büyük İskender’in doğum yeri Makedonya’yı fethet."
 tre_silk_trade: "İpek Ticareti"
 tre_silk_trade_desc: "Doğu-batı ticaretine hâkim olmak için Trabzon üzerinden İpek Yolu ticaretini denetle."
 tre_komnenian_army: "Komnenos Ordusu"
 tre_komnenian_army_desc: "Komnenos ordusunu inşa et: paralı askerlerin ve eyalet kuvvetlerinin bir karışımı."
 tre_greek_culture: "Yunan Kültürel Canlanışı"
 tre_greek_culture_desc: "Trabzon’u bir kültür feneri yapmak için Bizans ilmini ve sanatlarını canlandır."
 tre_cilicia_campaign: "Kilikya’ya Boyun Eğdir"
 tre_cilicia_campaign_desc: "Akdeniz’e erişimi güvenceye almak için Kilikya’ya boyun eğdir."
 tre_dev_constantinople: "İstanbul’u Yeniden İnşa Et"
 tre_dev_constantinople_desc: "İstanbul’u yeniden kurulan Bizans İmparatorluğu’nun muhteşem başkenti olarak yeniden inşa et."
 tre_orthodox_patriarch: "Ortodoks Patrikhanesi"
 tre_orthodox_patriarch_desc: "İstanbul Patrikhanesi’ni kur ve Trabzon’u Ortodoksluğun koruyucusu yap."
 tre_georgia_campaign: "Gürcistan Seferi"
 tre_georgia_campaign_desc: "Kafkasya kanadını güvenceye almak için Gürcistan’a bir sefer yönet."
 tre_komnenian_navy: "Komnenos Donanması"
 tre_komnenian_navy_desc: "Karadeniz’e ve Ege’ye hâkim olmak için güçlü bir donanma inşa et."
 tre_antioch_crusade: "Antakya’yı Geri Al"
 tre_antioch_crusade_desc: "Bir zamanlar Bizans Suriyesi’nin mücevheri olan Antakya’yı geri al."
 tre_greek_population: "Yunan Nüfusunun Büyümesi"
 tre_greek_population_desc: "Yunan nüfusunu yeniden kurulan imparatorluğun kültürel belkemiği olarak büyüt."
 tre_restore_byzantium: "Bizans’ı Yeniden Kur"
 tre_restore_byzantium_desc: "Komnenos liderliği altında Bizans İmparatorluğu’nun yeniden kuruluşunu ilan et."
 tre_komnenos_dynasty: "Komnenos Hanedanı’nın Şanı"
 tre_komnenos_dynasty_desc: "Ebedî Komnenos İmparatoru olarak hüküm sür: Doğu Roma’nın halefi, Ortodoksluğun koruyucusu."
 tre_events.20.t: "İstanbul Geri Alındı: Bizans Yaşıyor"
 tre_events.20.d: "İstanbul Komnenos ellerinde! Ortodoks haçı bir kez daha Ayasofya’nın üzerinde dalgalanıyor. Dünya titriyor: Bizans yükseldi."
 tre_events.20.a: "Tanrı’nın şanıyla İstanbul çok yaşasın!"
 tre_events.60.t: "Bizans Yeniden Kuruluşunun İlanı"
 tre_events.60.d: "Anadolu, Balkanlar ve İstanbul birleşti: Komnenos hanedanı Bizans İmparatorluğu’nun yeniden kuruluşunu ilan ediyor. 1204’ün trajedisinden yükseldi."
 tre_events.60.a: "Bizans çok yaşasın! Komnenos hanedanı çok yaşasın!"
 tre_events.99.t: "Komnenos Hanedanı’nın Ebedî Şanı"
 tre_events.99.d: "“Komnenos İmparatoru: Doğu Roma’nın halefi ve Ortodoksluğun koruyucusu”: bu unvan Akdeniz dünyasında yankılanıyor. Trabzon’da başlayan küçük imparatorluk tarihin en büyük imparatorluğunun halefi olarak hüküm sürüyor."
 tre_events.99.a: "Komnenos hanedanı çok yaşasın! Ebedî şan çok yaşasın!"
 STATIC_MODIFIER_NAME_tre_komnenian_mod: "Komnenos"
 STATIC_MODIFIER_DESC_tre_komnenian_mod: "Komnenosların mor sancağına bakarak sarayda herkes Bizans’ın şanının Trabzon’un ellerinde geri kazanılacağı günü hayal ediyor."
 STATIC_MODIFIER_NAME_tre_pontus_mod: "Pontus"
 STATIC_MODIFIER_DESC_tre_pontus_mod: "Pontus kıyı şeridi Karadeniz ticaret hâkimiyetinin temeli olarak güvenceye alındı."
 STATIC_MODIFIER_NAME_tre_black_sea_mod: "Karadeniz"
 STATIC_MODIFIER_DESC_tre_black_sea_mod: "Karadeniz’de hiçbir ticaret gemisi Trabzon limanına demir atmadan Doğu’nun ipeklerini alamaz."
 STATIC_MODIFIER_NAME_tre_trebizond_city_mod: "Trabzon Şehri"
 STATIC_MODIFIER_DESC_tre_trebizond_city_mod: "Trabzon Komnenos İmparatorluğu’nun gelişen bir ticaret merkezine dönüştürüldü."
 STATIC_MODIFIER_NAME_tre_orthodox_mod: "Ortodoks"
 STATIC_MODIFIER_DESC_tre_orthodox_mod: "Ortodoks manastırları güçlendirildi ve Trabzon’u Bizans’ın manevi varisi olarak ortaya koydu."
 STATIC_MODIFIER_NAME_tre_armenia_mod: "Ermenistan"
 STATIC_MODIFIER_DESC_tre_armenia_mod: "Ermenistan’a boyun eğdirildi: doğu sınırı güvenceye alındı ve dağ savaşçıları kazanıldı."
 STATIC_MODIFIER_NAME_tre_cappadocia_mod: "Kapadokya"
 STATIC_MODIFIER_DESC_tre_cappadocia_mod: "Kapadokya’nın mağara manastırı ana toprakları Komnenos denetimine giriyor."
 STATIC_MODIFIER_NAME_tre_anatolia_mod: "Anadolu"
 STATIC_MODIFIER_DESC_tre_anatolia_mod: "Orta Anadolu geri alındı: İstanbul’a giden yol açık."
 STATIC_MODIFIER_NAME_tre_west_anatolia_mod: "Batı Anadolu"
 STATIC_MODIFIER_DESC_tre_west_anatolia_mod: "Batı Anadolu’nun zengin Ege kıyısı Komnenos İmparatorluğu için güvenceye alındı."
 STATIC_MODIFIER_NAME_tre_nicaea_mod: "İznik"
 STATIC_MODIFIER_DESC_tre_nicaea_mod: "İznik geri alındı: sürgündeki Bizans başkenti Ortodoks yönetimine döndü."
 STATIC_MODIFIER_NAME_tre_thrace_mod: "Trakya"
 STATIC_MODIFIER_DESC_tre_thrace_mod: "Trakya ele geçirildi ve İstanbul’u kurtuluşuna hazırlanmak için kuşattı."
 STATIC_MODIFIER_NAME_tre_greece_mod: "Yunanistan"
 STATIC_MODIFIER_DESC_tre_greece_mod: "Selanik dahil kuzey Yunanistan güvenceye alındı: Bizans’ın ikinci şehri yeniden kuruldu."
 STATIC_MODIFIER_NAME_tre_bulgaria_mod: "Bulgaristan"
 STATIC_MODIFIER_DESC_tre_bulgaria_mod: "Bulgaristan fethedildi ve Balkan hâkimiyetini pekiştirdi."
 STATIC_MODIFIER_NAME_tre_morea_mod: "Mora"
 STATIC_MODIFIER_DESC_tre_morea_mod: "Mora ve Atina geri alındı: kadim Yunan medeniyetinin kalbi yeniden kuruldu."
 STATIC_MODIFIER_NAME_tre_aegean_mod: "Ege"
 STATIC_MODIFIER_DESC_tre_aegean_mod: "Ege adaları Latin Haçlı işgalinden geri alındı."
 STATIC_MODIFIER_NAME_tre_macedonia_mod: "Makedonya"
 STATIC_MODIFIER_DESC_tre_macedonia_mod: "İskender’in doğum yeri Makedonya Komnenos yönetimine düşüyor."
 STATIC_MODIFIER_NAME_tre_silk_mod: "İpek"
 STATIC_MODIFIER_DESC_tre_silk_mod: "Trabzon üzerinden İpek Yolu ticareti doğu-batı ticaretine hâkim."
 STATIC_MODIFIER_NAME_tre_army_mod: "Ordu"
 STATIC_MODIFIER_DESC_tre_army_mod: "Paralı askerler ve eyalet seferberlikleri aynı sancak altında talim yapıyor ve Komnenosların ordusu yeni bir güç buldu."
 STATIC_MODIFIER_NAME_tre_culture_mod: "Kültür"
 STATIC_MODIFIER_DESC_tre_culture_mod: "Bizans ilmi ve sanatları canlandırıldı ve Trabzon’u bir kültür feneri yaptı."
 STATIC_MODIFIER_NAME_tre_cilicia_mod: "Kilikya"
 STATIC_MODIFIER_DESC_tre_cilicia_mod: "Kilikya’ya boyun eğdirildi ve Akdeniz’e erişim güvenceye alındı."
 STATIC_MODIFIER_NAME_tre_cpole_city_mod: "İstanbul Şehri"
 STATIC_MODIFIER_DESC_tre_cpole_city_mod: "İstanbul yeniden kurulan Bizans İmparatorluğu’nun muhteşem başkenti olarak yeniden inşa edildi."
 STATIC_MODIFIER_NAME_tre_patriarch_mod: "Patrik"
 STATIC_MODIFIER_DESC_tre_patriarch_mod: "İstanbul Patrikhanesi Komnenos koruyuculuğu altında kuruldu."
 STATIC_MODIFIER_NAME_tre_georgia_mod: "Gürcistan"
 STATIC_MODIFIER_DESC_tre_georgia_mod: "Gürcistan güvenceye alındı ve imparatorluğun Kafkasya kanadını istikrara kavuşturdu."
 STATIC_MODIFIER_NAME_tre_navy_mod: "Donanma"
 STATIC_MODIFIER_DESC_tre_navy_mod: "Güçlü bir Komnenos donanması Karadeniz’e ve Ege’ye hâkim."
 STATIC_MODIFIER_NAME_tre_antioch_mod: "Antakya"
 STATIC_MODIFIER_DESC_tre_antioch_mod: "Bizans Suriyesi’nin mücevheri Antakya geri alındı."
 STATIC_MODIFIER_NAME_tre_greek_pop_mod: "Yunan Nüfusu"
 STATIC_MODIFIER_DESC_tre_greek_pop_mod: "Yunan duaları ve pazar çığlıkları yeniden kurulan imparatorluğun her kasabasının sokaklarını dolduruyor."
 STATIC_MODIFIER_NAME_tre_restore_byzantium_mod: "Bizans’ı Yeniden Kur"
 STATIC_MODIFIER_DESC_tre_restore_byzantium_mod: "Bizans İmparatorluğu Komnenos liderliği altında resmen yeniden kuruldu."
 STATIC_MODIFIER_NAME_tre_komnenos_final_mod: "Komnenos Sonu"
 STATIC_MODIFIER_DESC_tre_komnenos_final_mod: "Komnenos İmparatorluğu ebedî olarak duruyor: Doğu Akdeniz’in efendisi."
 tre_rize_tea: "Rize’de Çay Yetiştiriciliği"
 tre_rize_tea_desc: "Rize: Karadeniz Dağları ile Karadeniz arasında sıcak, nemli bir iklimle kutsanmış bu bölge Türkiye’nin en büyük çay üretim alanı olacak. 1737’den itibaren Rize’nin yamaçlarını Gürcistan üzerinden gelen yetiştirme teknikleriyle çay plantasyonlarına dönüştür. Soylu doğu içeceğini Komnenos İmparatorluğu’na getir."
 STATIC_MODIFIER_NAME_tre_rize_tea_mod: "Rize Çay Plantasyonları"
 STATIC_MODIFIER_DESC_tre_rize_tea_mod: "Rize’nin yamaçları çay plantasyonlarına dönüştürüldü ve imparatorluk için bir çay üretim tabanı kurdu."
 STATIC_MODIFIER_NAME_tre_cpole_loc_mod: "İstanbul Yeniden Kuruldu"
 STATIC_MODIFIER_DESC_tre_cpole_loc_mod: "İstanbul imparatorluğun idari ve hükümet merkezi olarak işlev görmeye başlıyor."
