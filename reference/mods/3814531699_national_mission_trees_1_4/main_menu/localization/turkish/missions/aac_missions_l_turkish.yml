 aac_aachen_megalopolis: "Aachen: Orta Avrupa’nın En Büyük Şehri"
 aac_aachen_megalopolis_desc: "Büyük Karl’ın saray şehri Aachen nihayet Orta Avrupa’nın en büyük metropolü olarak tamamlandı. 200.000 nüfusu, gelişmiş şehir gelişimi ve muhteşem mimarisiyle Aachen Avrupa uygarlığının merkezi olarak kurulur."
 aac_events.10.t: "Büyük Karl’ın Tahtı: Karolenj Uyanışı"
 aac_events.10.d: "Büyük Karl’ın (742-814) bir zamanlar sarayını kurduğu ve 800’de Batı Roma İmparatoru olarak taç giydiği Aachen şehri Karolenj ellerine döndü. Aachen Katedrali’nin ağırbaşlı kubbesi altında mermer taht efendisinin dönüşünü bekliyor.\n\n“Avrupa’nın Babası (Pater Europae)” denen Büyük Karl’ın hayali: Ren’den Pireneler’e, Roma’dan Baltık’a birleşik bir Hıristiyan imparatorluğu: gerçekleştirme vakti geldi. Karolenj restorasyonunu ilan et ve Frank Krallığı’nı yeniden inşa etmeye ilk adımı at."
 aac_events.10.a: "Karolenj hanedanının kralı olarak hüküm sür: monarşiyi ilan et"
 aac_events.10.b: "Zaman henüz olgunlaşmadı: mevcut yönetim sistemi altında güç inşa et"
 STATIC_MODIFIER_NAME_aac_aachen_megalopolis_mod: "Aachen Megalopolü"
