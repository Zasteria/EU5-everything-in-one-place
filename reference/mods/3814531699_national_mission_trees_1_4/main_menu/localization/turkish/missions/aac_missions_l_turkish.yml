l_turkish:
 aac_carolingian_legacy_mission_pack: "Karolenj Mirası: Frank Krallığı’nın Yeniden Kuruluşu"
 aac_carolingian_legacy_mission_pack_DESCRIPTION:0 "1337’de Aachen Kutsal Roma İmparatorluğu içinde belediye başkanı Karolenj hanedanının bir torunu olan bir serbest şehirdir. Bir zamanlar Büyük Karl’ın (742-814) sarayına ev sahipliği yapan bu şehirden Frank Krallığı’nın şanını geri al. Ren’i, Galya’yı ve Flandre’ı birleştir ve Papa’nın taç giydirmesiyle “Batı İmparatoru” olarak hüküm sür."
 aac_carolingian_legacy_mission_pack_CRITERIA_DESCRIPTION:0 "Aachen olarak Batı Roma İmparatorluğu’nu yeniden kurmak için Ren’i, Galya’yı ve İtalya’yı birleştir."
 aac_carolingian_legacy_mission_pack_BUTTON_TOOLTIP:0 "Frank Krallığı’nı yeniden kurmak için görevleri tamamla."
 aac_carolingian_legacy_mission_pack_BUTTON_DETAILS:0 "Büyük Karl’ın tahtından Batı Roma İmparatorluğu’na!"
 aac_throne_of_charlemagne: "Büyük Karl’ın Tahtı"
 aac_throne_of_charlemagne_desc: "Büyük Karl’ın emriyle inşa edilen ve 800’de Batı Roma İmparatoru olarak taç giydiği yer olan Aachen Katedrali Karolenj ellerine döndü. Bir zamanlar Batı uygarlığının merkezi olan Aachen’e hükmet ve Frank Krallığı’nı yeniden kurmaya ilk adımı at."
 aac_control_rhineland: "Ren’i Denetle"
 aac_control_rhineland_desc: "Köln, Trier, Mainz: Ren boyundaki üç büyük başpiskopos şehri Frank Krallığı’nın ekonomik, dinî ve siyasi merkeziydi. Bunları ele geçirmek tüm Ren’i Karolenj ellerine verir."
 aac_integrate_lorraine: "Loren’i Bütünleştir"
 aac_integrate_lorraine_desc: "Loren (Lotaringya), Verdun Antlaşması (843) Frank İmparatorluğu’nu Büyük Karl’ın torunları arasında bölünce orta bölge olarak doğdu. Metz’i ve Verdun’ü geri almak Frank İmparatorluğu’nun bölünmeden önceki çekirdeğini yeniden bütünleştirir."
 aac_conquer_hre: "Kutsal Roma İmparatorluğu’nun Efendisi"
 aac_conquer_hre_desc: "Aachen bir zamanlar Kutsal Roma İmparatorlarının taç giyme yeriydi. İmparatorluğun efendisi olarak durarak Büyük Karl’ın imparatorluk mirası en meşru biçimde iddia edilir."
 aac_control_flanders: "Flandre’ı Denetle"
 aac_control_flanders_desc: "Flandre Avrupa’nın en büyük yünlü tekstil sanayisinin merkezidir. Brüksel’i ve Liège’i ele geçir ve Frank Krallığı’nı yeniden kurmak için Flandre’ın zengin ticari ve sanayi gücünü kullan."
 aac_brabant_trade: "Brabant Ticareti"
 aac_brabant_trade_desc: "Düşük Ülkeler’deki en büyük ticaret ağı Brabant Dukalığı’ndaki Brüksel ticaret şehrinden yayılır. Bu ticaret ağını denetlemek Frank Krallığı’nın mali temelini çarpıcı biçimde güçlendirir."
 aac_push_into_france: "Paris’e Yürüyüş"
 aac_push_into_france_desc: "Büyük Karl Franklar Kralı olarak Paris dahil tüm Galya’ya hükmetti. Paris’i yeniden fethetmek Valois hanedanının öcünü alır ve Karolenj Galya yönetimini canlandırır."
 aac_conquer_northern_france: "Kuzey Fransa’yı Fethet"
 aac_conquer_northern_france_desc: "Reims Frank Krallığı’nın taç giyme yeridir: burada vaftiz edilen I. Clovis’in geleneğini sürdürerek Normandiya’ya ve Picardie’ye boyun eğdir ve kuzey Galya’da tam hâkimiyeti kur."
 aac_conquer_burgundy: "Burgonya’yı Fethet"
 aac_conquer_burgundy_desc: "Burgonya şarapla ve tarımla zengin bir toprak olarak Frank İmparatorluğu’nda önemli bir rol oynadı. Ona boyun eğdirmek güney Fransa’ya giden yolu açar."
 aac_conquer_southern_france: "Güney Fransa’yı Fethet"
 aac_conquer_southern_france_desc: "Languedoc’a ve Gaskonya’ya boyun eğdir ve güney Galya Karolenj ellerine döner. Diyarı Pireneler’e kadar genişletmek Büyük Karl’ın hedeflediği tam Galya hâkimiyetini gerçekleştirir."
 aac_reunite_gaul: "Galya’yı Yeniden Birleştir"
 aac_reunite_gaul_desc: "Tüm Galya, bir zamanlar Büyük Karl’ın yönettiği topraklar, Frank Krallığı sancağı altında birleşti. Verdun Antlaşması’yla üçe bölünen İmparatorluk 500 yıl sonra ilk kez yeniden birleşti."
 aac_develop_aachen: "Aachen’i Geliştir"
 aac_develop_aachen_desc: "Aachen Katedrali merkezli bu kadim şehri geliştir ve onu Frank İmparatorluğu’nun yeni başkenti olarak işlevselleştir. Büyük Karl’ın mirasının yaşadığı bu yerden Batı Avrupa’nın yeniden inşası için ışık yayılır."
 aac_frankish_law: "Frank Hukuk Kanunnamesi"
 aac_frankish_law_desc: "Büyük Karl Frank İmparatorluğu’nun hukuk sistemini Capitularia (kararname koleksiyonu) aracılığıyla geliştirdi. Bu geleneği sürdürmek ve yeni bir Frank Hukuk Kanunnamesi kurmak İmparatorluğun hukuki temelini kurar."
 aac_missi_dominici: "Missi Dominici"
 aac_missi_dominici_desc: "Büyük Karl’ın kurduğu Missi Dominici (lordun ulakları) sistemi: yerel yönetimi denetlemek için İmparatorluğun dört bir yanına gönderilen kraliyet temsilcileri. Bu sistemi canlandırmak geniş imparatorluğun merkezî yönetimine imkân verir."
 aac_carolingian_renaissance: "Karolenj Rönesansı"
 aac_carolingian_renaissance_desc: "Büyük Karl Alcuin ve Einhard gibi bilginleri davet ederek “Karolenj Rönesansı”nı teşvik etti. Aachen sarayını kültür ve ilmin merkezi olarak canlandır ve Batı uygarlığının yeniden kuruluşuna öncülük et."
 aac_trade_empire: "Ticaret İmparatorluğu"
 aac_trade_empire_desc: "Ren, Meuse ve Schelde ticaret yollarına hâkim olan Frank İmparatorluğu Batı Avrupa’nın en büyük ticaret ulusu olur. Birden fazla pazar merkezi ve zengin gelirle ticari üstünlüğü kur."
 aac_frankish_levy: "Frank Seferberlik Sistemi"
 aac_frankish_levy_desc: "Büyük Karl’ın Frank ordusu Avrupa’nın en güçlüsüydü. Seferberlik sistemini (host sistemi) canlandır ve köylü askerlerden şövalyelere uzanan geniş askerî örgütlenmeyle Frank İmparatorluğu’nun askerî gücünü yeniden inşa et."
 aac_palatine_guard: "Palatin Muhafızı"
 aac_palatine_guard_desc: "İmparatorun yanını koruyan Palatin Muhafızı: Büyük Karl’ın saray muhafızlarının geleneğini sürdüren seçkin bir güç Frank İmparatorluğu’nun askerî şanını somutlaştırır."
 aac_carolingian_cavalry: "Karolenj Süvarisi"
 aac_carolingian_cavalry_desc: "Büyük Karl’ın askerî başarısının kalbinde güçlü süvari vardı. Ağır zırhlı şövalyelerin (chevalier) savaş alanına hâkim olduğu ve Saksonları, Avarları ve Müslümanları yendiği efsanevi atlı gücü yeniden inşa et."
 aac_kingdom_of_franks: "Franklar Krallığı Yeniden Kuruldu"
 aac_kingdom_of_franks_desc: "Galya yeniden birleşti, Loren bütünleşti, Missi Dominici kuruldu: üç sütun hizalandı ve Frank Krallığı nihayet yeniden kuruldu. 800’den beri ilk kez Karolenj sancağı Ren’den Pireneler’e dalgalanıyor."
 aac_papal_alliance: "Papalık İttifakı"
 aac_papal_alliance_desc: "800 Noel’inde Roma’daki Aziz Petrus Bazilikası’nda Papa III. Leo Büyük Karl’ın başına Batı Roma İmparatoru tacını koydu. Bu geleneği sürdür, Papa ile sağlam bir ittifak kur ve “Tanrı’nın temsilcisi” olarak meşruiyeti kur."
 aac_conquer_italy: "İtalya’yı Fethet"
 aac_conquer_italy_desc: "Büyük Karl 774’te Lombard Krallığı’nı fethetti ve İtalya Kralı unvanını edindi. Roma’yı ele geçirmek Papa’nın onayıyla “Batı Roma İmparatoru”nun canlanışına giden yolu tamamlar."
 aac_western_roman_empire: "Batı Roma İmparatorluğu’nun Yeniden Kuruluşu"
 aac_western_roman_empire_desc: "Aachen, Paris, Roma: Batı Roma İmparatorluğu’nun üç şehri Karolenj sancağı altında yeniden birleşti. Büyük Karl’ın 800’de kurduğu İmparatorluk modern çağda yeniden doğdu ve “Renovatio Imperii Romani (Roma İmparatorluğu’nun Yeniden Kuruluşu)” yerine geldi."
 aac_alsace_swabia: "Alsas ve Svabya"
 aac_alsace_swabia_desc: "Doğu Ren yakasındaki Alsas ve Svabya Frank İmparatorluğu’nun önemli bir parçasıdır. Vosges’tan Alpler’e uzanan bu toprağı ele geçirmek Ren hâkimiyetini tamamlar."
 aac_champagne_fairs: "Champagne Fuarları"
 aac_champagne_fairs_desc: "Champagne bölgesinin periyodik fuarları (foires) Avrupa’nın en büyük ticaret toplantılarıydı. İtalyan, Flandrelı ve Alman tüccarların bu buluşma yerini denetlemek Frank ticari üstünlüğünü kurar."
 aac_conquer_brittany: "Bretanya’yı Fethet"
 aac_conquer_brittany_desc: "Bretanya Keltli Bretonların diyarıdır: Büyük Karl bile bu inatçı bölgeyi tamamen boyun eğdirememişti. Bu batı ucunu fethetmek batı Galya’yı tamamen Frank denetimine alır ve Atlantik’e bir çıkış güvenceye alır."
 aac_holy_crown: "Kutsal Taç"
 aac_holy_crown_desc: "Papalıkla derin güven ve yüksek meşruiyet: “Mesih’in vekili” olarak Papa Frank kralının otoritesini onaylar. Hem Tanrı hem insan tarafından tanınan yönetim kurulur."
 aac_dev_reims: "Reims’i Geliştir"
 aac_dev_reims_desc: "Reims Frank halkının vaftiz yeridir: I. Clovis burada Hıristiyan vaftizi aldı ve Fransız taç giymeleri o zamandan beri burada yapıldı. Bu kutsal şehri daha da geliştirmek Karolenj meşruiyetini güçlendirir."
 aac_dev_paris: "Paris’i Geliştir"
 aac_dev_paris_desc: "Seine adası (Île de la Cité) merkezli Paris Galya’nın en büyük şehridir. Onu Frank İmparatorluğu’nun batı başkenti olarak geliştirmek Frank İmparatorluğu’nu destekleyen Aachen ve Paris’ten oluşan iki başkentli bir sistem yaratır."
 aac_bretagne_fleet: "Breton Filosu"
 aac_bretagne_fleet_desc: "Bretanya’nın ve Flandre’ın denizcilik gelenekleri birleşir ve Frank İmparatorluğu artık hem Atlantik’e hem Kuzey Denizi’ne hâkim güçlü bir donanmaya sahip."
 aac_events.20.t: "Paris Düşüyor: Karolenjlerin Dönüşü"
 aac_events.20.d: "Valois sancağı Paris’in surlarından indirildi ve yerini Frank Krallığı’nın kartalı aldı. Notre-Dame’ın çanları çalarken Karolenj belediye başkanının torunu Paris’e giriyor. “Büyük Karl’ın varisi geri döndü”: tarihçiler böyle yazacak."
 aac_events.20.a: "Paris çok yaşasın! Karolenj sancağını yüksekte tut!"
 aac_events.40.t: "Galya Yeniden Birleşti: Frank Kralı’nın Dönüşü"
 aac_events.40.d: "Ren’den Pireneler’e, Flandre’dan Provence’a: tüm Galya Frank Krallığı sancağı altında birleşti. 843’te Verdun Antlaşması’yla üçe bölünen İmparatorluk 500 yıl sonra yeniden birleşti. “Dieu le veut (Tanrı böyle istiyor)”: katedralde toplanan halk haykırıyor."
 aac_events.40.a: "Galya çok yaşasın! Frank Krallığı ebedîdir!"
 aac_events.50.t: "Frank Krallığı’nın Yeniden Kuruluşunun İlanı"
 aac_events.50.d: "Galya yeniden birleşti, Loren bütünleşti, Missi Dominici kuruldu: Frank Krallığı’nın üç sütunu tamam. Aachen Katedrali’nde bir Frank kralının taç giyme töreni yapılıyor ve Büyük Karl’dan beri ilk kez bir Frank İmparatoru doğuyor. “Carolus Magnus Rex Francorum (Büyük Karl, Franklar Kralı) adına İmparatorluğu ilan ediyoruz.”"
 aac_events.50.a: "Frank Krallığı çok yaşasın! Karolenj şanı yeniden doğdu: renklerimizi Fransa’nın mavisine boyayalım!"
 aac_events.99.t: "Batı Roma İmparatorluğu’nun Yeniden Kuruluşu"
 aac_events.99.d: "Aachen, Paris, Roma: üç şehir Karolenj sancağı altında yeniden birleşti. 800 Noel’inde Papa III. Leo’nun Büyük Karl’ın başına tacı koyduğu efsanevi an modern çağda yeniden yaratıldı. “Renovatio Imperii Romani”: bu sözler tarihe ebediyen kazındı. İmparatorluğun rengini Karolenj kızıl rengine değiştirecek misin?"
