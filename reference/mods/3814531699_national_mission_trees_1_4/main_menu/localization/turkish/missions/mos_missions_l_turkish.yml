 mos_great_moscow: "Üçüncü Roma’nın Kuruluşu: Moskova’nın Büyük Genişlemesi"
 mos_great_moscow_desc: "Moskova’yı Üçüncü Roma’ya layık büyük bir şehre dönüştür. Katedraller, saraylar, pazarlar ve kaleler bu muhteşem şehri doldurarak onu Rus İmparatorluğu’nun kalbi yapacak. Moskova’ya Ebedî Şehir unvanını kazandırmak için gelişim, binalar ve nüfus olmak üzere üç koşulun hepsini yerine getir."
