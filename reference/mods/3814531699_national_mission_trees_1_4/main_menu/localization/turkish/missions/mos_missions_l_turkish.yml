l_turkish:
 mos_moscow_mission_pack: "Tatar Boyunduruğundan Tüm Rusya’nın Otokratına"
 mos_moscow_mission_pack_DESCRIPTION:0 "1337’de Moskova Büyük Dukalığı, Altın Orda’nın egemenliği altında küçük bir prenslikten ibarettir. I. İvan Kalita’nın servet biriktirmedeki keskin zekâsı ve Tatarlarla ilişkilerdeki diplomatik becerisi sayesinde Moskova istikrarlı biçimde büyümüştür. Ancak Novgorod, Tver ve Litvanya onu çevrelerken, güneyden Tatar tehdidi sürmektedir. Tatar boyunduruğunu kır, Rus prensliklerini birleştir, kendini Çar ilan et, Üçüncü Roma olarak hüküm sür ve Tüm Rusya’nın Otokratı ol: Sibirya’nın uçlarına kadar hükümdar."
 mos_moscow_mission_pack_CRITERIA_DESCRIPTION:0 "Tatar boyunduruğunu kır, Rusya’yı birleştirmek için Kazan’ı, Astrahan’ı ve Novgorod’u fethet, Çar unvanını al, Üçüncü Roma ol ve Sibirya’yı fethet."
 mos_moscow_mission_pack_BUTTON_TOOLTIP:0 "Tüm Rusya’nın Otokratı ol."
 mos_moscow_mission_pack_BUTTON_DETAILS:0 "Moskova Büyük Dukalığı’ndan Rus İmparatorluğu’na: tarihî kaderi yerine getir!"
 mos_rally_the_army: "Orduyu Seferber Et"
 mos_rally_the_army_desc: "1337’de Moskova Büyük Dukalığı, I. İvan Kalita’nın keskin becerisiyle istikrarlı biçimde büyüdü. Orduyu hazırla ve Moskova’nın Rus prenslikleri üzerindeki hâkimiyetini genişletmeye başla."
 mos_break_tatar_yoke: "Tatar Boyunduruğunu Kır"
 mos_break_tatar_yoke_desc: "1237’den beri Tatar haracı ve boyun eğme Rusya’yı ezmektedir. Dmitri Donskoy’un Kulikovo zaferinin anısı yaşamaktadır. Tam bağımsızlığını ilan et ve Tatar boyunduruğunu sonsuza dek kır."
 mos_conquer_kazan: "Kazan’ın Fethi"
 mos_conquer_kazan_desc: "Kazan Hanlığı İdil ticaret yolunu denetler. Fethi Moskova’ya büyük nehrin hâkimiyetini verir: Korkunç İvan’ın 1552 zaferini önceden gerçekleştir."
 mos_subjugate_kazan: "Orta İdil’e Boyun Eğdir"
 mos_subjugate_kazan_desc: "Kazan’ın fethinin ardından Orta İdil havzasını, yani Samara ve Tambov’u ele geçirerek güneye giden yolu aç."
 mos_conquer_astrakhan: "Astrahan’ın Fethi"
 mos_conquer_astrakhan_desc: "Astrahan Hanlığı aşağı İdil deltasını denetler. Hazar Denizi’ne erişimi ve doğu ticaret yolunu kurmak için onu fethet."
 mos_destroy_hordes: "Orduların Yıkımı"
 mos_destroy_hordes_desc: "Nogay Ordası dahil Tatar ardıl devletlerini dağıt ve bozkıra giden yolu aç."
 mos_claim_steppes: "Bozkırları Sahiplen"
 mos_claim_steppes_desc: "Moskova’nın büyük bir kıtasal imparatorluk olarak biçimini ortaya koymak için Karadeniz’in kuzey kıyısındaki Pontus Bozkırı’nı ele geçir."
 mos_black_sea_access: "Azak Denizi’ne Erişim"
 mos_black_sea_access_desc: "Karadeniz ticaretine erişim kurmak için Azak Denizi’ne ilerle: Büyük Petro’nun 1696’daki Azak’ı ele geçirişini önceden gerçekleştir."
 mos_conquer_crimea: "Kırım’ın Fethi"
 mos_conquer_crimea_desc: "Karadeniz hâkimiyetini kurmak için Kırım Hanlığı’nı fethet: Büyük Katerina’nın 1783’teki ilhakını önceden gerçekleştir."
 mos_consolidate_russia: "Rusya’nın Pekiştirilmesi"
 mos_consolidate_russia_desc: "Moskova’yı merkez alarak Rus prensliklerini tek ve güçlü bir devlet temelinde pekiştir."
 mos_dev_moscow: "Kremlin’in Geliştirilmesi"
 mos_dev_moscow_desc: "Rus gücünün simgesi Moskova Kremlin’ini geliştir. Bu kutsal alanı dolduran büyük katedraller Rus İmparatorluğu’nun kalbi olur."
 mos_conquer_novgorod: "Novgorod’un Fethi"
 mos_conquer_novgorod_desc: "Novgorod, bir zamanlar Rusya’nın en büyük ticaret şehir devleti. III. İvan’ın 1478’deki belirleyici fethini çok daha erken gerçekleştir."
 mos_conquer_tver: "Tver’in Fethi"
 mos_conquer_tver_desc: "Bir zamanlar Moskova’nın rakibi olan Tver’in gücü azaldı. Rus birliğini ilerletmek için İdil üzerindeki bu kilit şehri fethet."
 mos_conquer_ryazan: "Ryazan’a Boyun Eğdirme"
 mos_conquer_ryazan_desc: "1237’de Moğollar tarafından ilk yıkılan Ryazan: güney bozkırını fethet ve bir savunma hattı kur."
 mos_conquer_smolensk: "Smolensk’in Fethi"
 mos_conquer_smolensk_desc: "“Rusya’nın Anahtarı” Smolensk: batı nüfuzunu kurmak için bu doğu-batı kavşağını denetle."
 mos_conquer_ruthenia: "Ruthenia’nın Fethi"
 mos_conquer_ruthenia_desc: "Beyaz Ruthenia: Minsk merkezli, Litvanya denetimindeki bölgeyi fethet ve pan-Slav hâkimiyetini kur."
 mos_window_on_west: "Batıya Açılan Pencere"
 mos_window_on_west_desc: "“Batıya açılan pencereyi” aralamak için Viborg ve Karelya’yı ele geçir: Büyük Petro’nun batıya erişim hayalini önceden gerçekleştir."
 mos_baltic_ambition: "Baltık Emelleri"
 mos_baltic_ambition_desc: "Livonya Tarikatı’nın denetlediği Baltık doğu kıyısı: bu bölgeye boyun eğdirmek Kuzey Avrupa ticaretine girişi mümkün kılar."
 mos_conquer_riga: "Riga’nın Fethi"
 mos_conquer_riga_desc: "Hansa Birliği’nin kilit taşı Riga: Kuzey Avrupa ticaret ağına erişmek için bu Baltık ticaret merkezini fethet."
 mos_partition_poland: "Polonya’nın Paylaşılması"
 mos_partition_poland_desc: "Ruthenia ve Doğu Avrupa üzerinde Polonya-Litvanya Ortak Devleti ile uzun mücadeleye son ver."
 mos_metropolitan_see: "Moskova Metropolitlik Makamı"
 mos_metropolitan_see_desc: "1448’de Moskova bağımsız bir kilise metropolitliği kurdu. Bu Ortodoks otorite Moskova’nın siyasi meşruiyetini destekler."
 mos_land_of_churches: "Kiliseler Diyarı"
 mos_land_of_churches_desc: "“Kutsal Rusya”: ülke genelinde Ortodoks katedraller inşa et ve Rusya’yı Tanrı’nın krallığı olarak kutsa."
 mos_tsar_title: "Çar Unvanı"
 mos_tsar_title_desc: "“Çar (İmparator)”: IV. İvan bu unvanı 1547’de resmen benimsedi. Roma’nın halefi olarak otoriteni ilan et ve Avrupa gücü olarak tanınma kazan."
 mos_russian_patriarchate: "Rus Patrikhanesi"
 mos_russian_patriarchate_desc: "1589’da kurulan, İstanbul’dan bağımsız Moskova Patrikhanesi: “Üçüncü Roma”nın dinî temelini pekiştir."
 mos_guardian_orthodoxy: "Ortodoksluğun Koruyucusu"
 mos_guardian_orthodoxy_desc: "İstanbul’un 1453’te Osmanlı’ya düşmesinin ardından Rusya Ortodoks inancının koruyucusu olur. Ülke genelinde bir Ortodoks ağı kur."
 mos_conquer_constantinople: "İstanbul’un Fethi"
 mos_conquer_constantinople_desc: "Ortodoks kutsal şehri İstanbul’u Osmanlı ellerinden geri al: “Üçüncü Roma” görevini yerine getir ve tarihi yeniden yaz."
 mos_third_rome: "Üçüncü Roma"
 mos_third_rome_desc: "“Moskova Üçüncü Roma’dır ve dördüncüsü olmayacaktır”: keşiş Filofey’in sözleri gerçek oluyor. Moskova Hıristiyan dünyasının manevi merkezi olarak hüküm sürer."
 mos_march_caucasus: "Kafkasya’ya Yürüyüş"
 mos_march_caucasus_desc: "Kafkas Dağları’ndaki Gürcistan’ı, Ermenistan’ı ve Azerbaycan’ı fethet ve Rusya’yı gerçek bir kıtasal imparatorluk yap."
 mos_caspian_sea: "Hazar Denizi Hâkimiyeti"
 mos_caspian_sea_desc: "“Rus iç denizi” Hazar: İran’a ve Orta Asya’ya giden ticaret yolunu ele geçir."
 mos_beyond_urals: "Urallar’ın Ötesi"
 mos_beyond_urals_desc: "Ural Dağları Avrupa ile Asya’nın sınırını belirler; ötesinde Sibirya’nın uçsuz bucaksız genişliği uzanır. Yermak’ın 1582 fethinin önüne geç ve kürk krallığını sahiplen."
 mos_conquer_perm: "Perm’in Fethi"
 mos_conquer_perm_desc: "Yukarı Kama Nehri’ndeki Perm: bu “Kama kürklerinin” kaynağını fethet ve Sibirya fethi için bir tutunak olarak kullan."
 mos_west_siberia: "Batı Sibirya"
 mos_west_siberia_desc: "Tobolsk merkezli Batı Sibirya: uçsuz bucaksız tayga bitmez tükenmez kürk kaynakları sağlar. Tobolsk’u “Sibirya’nın başkenti” olarak geliştir."
 mos_east_siberia: "Doğu Sibirya"
 mos_east_siberia_desc: "İrkutsk’a kadar: Baykal Gölü’ne ulaşmak Doğu Sibirya’nın kapılarını açar."
 mos_pacific_coast: "Pasifik Kıyısına Ulaş"
 mos_pacific_coast_desc: "“Kazaklar Pasifik’e ulaştı”: Yakutsk’tan Okhotsk Denizi’ne. Rus bayrağı Pasifik’in kıyısında dalgalanıyor."
 mos_fur_monopoly: "Kürk Tekeli"
 mos_fur_monopoly_desc: "Sibirya kürkleri, Avrupa pazarlarında en yüksek değerli mal. Arzını tekelleştir ve büyük servet kazan."
 mos_sudebnik: "Sudebnik (Kanunname)"
 mos_sudebnik_desc: "III. İvan’ın 1497 tarihli Sudebnik’i, Rusya’nın ilk birleşik kanunnamesi: serfliğin temeli olan bu kanunname, merkezileşmenin silahı olur."
 mos_handle_boyars: "Boyarları Denetle"
 mos_handle_boyars_desc: "Boyarlar yerel gücü denetler: bu durumu kır ve merkezileşmeyi ilerletmek için doğrudan Çar’a bağlı yöneticiler tayin et."
 mos_oprichnina: "Oprichnina"
 mos_oprichnina_desc: "IV. İvan’ın karanlık Oprichnina’sı: Çar’ın kara atlıları isyankâr boyarları temizledi. Çar’ın otoritesini mutlaklaştırmak için bu acımasız ama etkili politikayı kullan."
 mos_dev_agriculture: "Tarımsal Gelişme"
 mos_dev_agriculture_desc: "Rusya’nın zengin karatoprağı: Ukrayna’dan İdil’e uzanan bereketli tarım arazilerini geliştirerek tarımsal verimliliği artır."
 mos_dev_agriculture_unlock_tt: "“Tarımsal Kalkınmanın Teşviki” kararı artık kullanılabilir."
 mos_agriculture_decision.title: "Tarımsal Kalkınmanın Teşviki"
 mos_agriculture_decision.desc: "Kara toprak Ukrayna’dan Volga’ya uzanır, ancak verimi aletlere, ambarlara ve büyük toprak sahiplerinin iş birliğine bağlıdır. Hazine ve hükümdarın saraydaki nüfuzu bunu örgütlemek için harcanabilir."
 mos_agriculture_decision.a: "Hasadı örgütle."
 mos_agriculture_upgrade_decision.title: "Kara Toprağın Büyük Ekimi"
 mos_agriculture_upgrade_decision.desc: "İlk hasatlar güvence altına alınınca devlet bozkır sınırını bile pulluğun altına alabilir: yeni köyler, yeni değirmenler ve tahılı taşıyacak yeni yollar. Bu bir servete ve hükümdarın nüfuzunun büyük bölümüne mal olur, ama kara toprak eşi görülmemiş bir verim sunar."
 mos_agriculture_upgrade_decision.a: "Bozkır sınırını sürmeye aç."
 mos_pomestye_system: "Pomestye Sistemi"
 mos_pomestye_system_desc: "Pomestye sistemi, askerî hizmet karşılığı toprak vermek, Rusya’nın askerî gücünün temelini oluşturur."
 mos_streltsy: "Streltsy’yi Kur"
 mos_streltsy_desc: "Streltsy, IV. İvan’ın oluşturduğu daimi barutlu silahlı piyade. Bu seçkin birlik Rus ordusunun belkemiği olur."
 mos_zasechnaya_cherta: "Zasechnaya Cherta"
 mos_zasechnaya_cherta_desc: "Tatar süvari akınlarına karşı bir savunma hattı olarak kesilmiş ağaçlardan ve kalelerden “Zasechnaya Cherta”yı inşa et."
 mos_dev_arkhangelsk: "Arhangelsk’i İnşa Et"
 mos_dev_arkhangelsk_desc: "Beyaz Deniz limanı Arhangelsk: Büyük Petro’dan önce Rusya’nın tek denizaşırı ticaret limanı. Batı Avrupa ile doğrudan ticaret için bu limanı geliştir."
 mos_white_sea_trade: "Beyaz Deniz Ticareti"
 mos_white_sea_trade_desc: "İngiliz Moskova Şirketi (1555) Rusya’ya buradan girdi: öne geç ve Beyaz Deniz ticaret yolunu ele geçir."
 mos_dev_nizhny: "Nijni Novgorod’u Geliştir"
 mos_dev_nizhny_desc: "İdil ile Oka’nın birleştiği yerde: “Aşağı Novgorod”u İdil ticaretinin merkezi olarak geliştir."
 mos_conquer_pskov: "Pskov’un Fethi"
 mos_conquer_pskov_desc: "Pskov 1510’da Moskova’ya katıldı. Novgorod’un ardından Pskov’u fethet ve kuzeybatı Rusya’yı tamamen denetle."
 mos_dev_yaroslavl: "Yaroslavl’ı Geliştir"
 mos_dev_yaroslavl_desc: "“Altın Halka”nın Yaroslavl’ı: bu İdil ticaret şehrini kuzey ticaretinin aktarma merkezine dönüştür."
 mos_conquer_vologda: "Vologda’yı Geliştir"
 mos_conquer_vologda_desc: "Vologda: bu kilit kuzey ticaret yolu kavşağını ele geçir ve Beyaz Deniz ticaretiyle bağlantıyı güvenceye al."
 mos_amber_road: "Kehribar Yolu"
 mos_amber_road_desc: "Baltık kehribarı: bu malı Riga üzerinden Avrupa pazarlarına sun ve ticaret gelirini artır."
 mos_reform_taxation: "Vergi Reformu"
 mos_reform_taxation_desc: "Birleşik bir vergi sistemi kur ve ulusal maliyeyi güçlendir. Merkezileşmiş vergi geliri Rus ordusunu destekler."
 mos_dev_kazan_city: "Kazan Şehrini Geliştir"
 mos_dev_kazan_city_desc: "Fethedilen Kazan’ı Tatarların, Rusların ve Çuvaşların bir arada yaşadığı çok etnikli bir şehre dönüştür."
 mos_conquer_vilnius: "Vilnius’un Fethi"
 mos_conquer_vilnius_desc: "Litvanya Büyük Dukalığı’nın başkenti Vilnius: onu fethetmek Litvanya hâkimiyetine son verir ve Doğu Avrupa hegemonyasını Moskova’ya kaydırır."
 mos_develop_moscow_university: "Moskova Üniversitesi’ni Kur"
 mos_develop_moscow_university_desc: "Moskova Üniversitesi’nden (1755’te kuruldu) önce ilim salonlarını inşa et. Lomonosov’un hayalini erken gerçekleştirmek Rusya’nın entelektüel gelişimini teşvik eder."
 mos_teutonic_order: "Töton Tarikatı’nı Yen"
 mos_teutonic_order_desc: "Baltık Haçlı Seferleri’nin mirası Töton Tarikatı: topraklarına boyun eğdirmek güney Baltık’ı tamamen Rus nüfuzu altına sokar."
 mos_estonian_coast: "Estonya Kıyısı"
 mos_estonian_coast_desc: "Tallinn: bu kilit Hansa Birliği limanını ele geçir ve Baltık ticaretine tam giriş sağla."
 mos_dev_tobolsk_city: "Tobolsk Şehrini Geliştir"
 mos_dev_tobolsk_city_desc: "Tobolsk’u ciddi biçimde “Sibirya’nın başkenti” olarak geliştir: Sibirya fethinin idari merkezi olarak büyüt."
 mos_streltsy_reform: "Askerî Reform"
 mos_streltsy_reform_desc: "Streltsy’yi modernleştir: Rus ordusunu Avrupa standartlarına yükseltmek için Batı askerî teknolojisini içine al."
 mos_siberian_ostrog: "Sibirya Ostrog Ağı"
 mos_siberian_ostrog_desc: "Sibirya fethini destekleyen, Tobolsk, Yeniseysk ve İrkutsk’u birbirine bağlayan kale (ostrog) ağını geliştir."
 mos_absolute_monarchy: "Mutlak Monarşiyi Kur"
 mos_absolute_monarchy_desc: "Çar’ın mutlak otoritesini kur: boyarların, kilisenin ve yerel lordların gücünü sök, tüm otoriteyi imparatorun elinde topla."
 mos_peter_reforms: "Petro Reformları"
 mos_peter_reforms_desc: "Büyük Petro (1672-1725) Batılılaşma yoluyla Rusya’yı modern bir devlete dönüştürdü. Askerî reform, donanmanın kuruluşu, bilim akademisi. “Batıya pencere açma” ruhunu gerçekleştir."
 mos_dev_st_petersburg: "Saint Petersburg’u İnşa Et"
 mos_dev_st_petersburg_desc: "Büyük Petro’nun 1703’te Neva bataklıkları üzerinde kurduğu şehir: Saint Petersburg’u Rusya’nın ilk Batı tarzı şehri olarak inşa et."
 mos_russian_navy: "Rus Donanmasını Kur"
 mos_russian_navy_desc: "“Rusya’nın bir donanmaya ihtiyacı var”: Büyük Petro’nun inancı doğrultusunda Azak ve Baltık filolarını oluştur."
 mos_dev_suzdal: "Suzdal’ı Geliştir"
 mos_dev_suzdal_desc: "“Altın Halka”nın Suzdal’ı: çok sayıda ortaçağ kilisesine sahip bu kadim şehri din ve kültür merkezi olarak geliştir."
 mos_dev_vladimir: "Vladimir’i Geliştir"
 mos_dev_vladimir_desc: "Bir zamanlar Büyük Dukalığın başkenti olan Vladimir: bu kadim şehri tarım ve gıda tedarik merkezi olarak geliştir."
 mos_salt_works: "Tuz Sanayisi"
 mos_salt_works_desc: "Vologda ve Solikamsk tuzu: Rusya’da gıda korumanın vazgeçilmezi olan tuzun istikrarlı arzını kur."
 mos_beeswax_trade: "Balmumu Ticareti"
 mos_beeswax_trade_desc: "Rus balmumu: Ortodoks kilise mumları ve Batı Avrupa ihracatı için yüksek talep gören kilit bir mal."
 mos_iron_works: "Demir Sanayisi"
 mos_iron_works_desc: "Ural bölgesinin demir cevheri: Petro döneminde yoğunlaşacak Ural demir üretiminin temelini at."
 mos_dev_astrakhan_city: "Astrahan Şehrini Geliştir"
 mos_dev_astrakhan_city_desc: "“Güney kapısı” Astrahan: onu Hazar ticaretinin merkezi olarak geliştir ve İran ile Orta Asya ticaretini ele geçir."
 mos_cossack_cavalry: "Kazak Süvarisi"
 mos_cossack_cavalry_desc: "Don Kazakları ve Zaporojya Kazakları: bu en seçkin bozkır atlılarını Rus ordusuna kat."
 mos_book_of_royal_degrees: "Stepennaya Kniga"
 mos_book_of_royal_degrees_desc: "Stepennaya Kniga, Rus hükümdarlarının soyunu kaydeder ve Moskova’nın meşruiyetini ve idari verimliliğini güçlendirir."
 mos_kholmogory: "Kholmogory’yi Geliştir"
 mos_kholmogory_desc: "Dvina Nehri üzerindeki Kholmogory: bu Beyaz Deniz ticaret karakolunu geliştir."
 mos_protect_south_slavs: "Güney Slavları Koru"
 mos_protect_south_slavs_desc: "Balkanlar’ın Ortodoks Hıristiyanlarını Osmanlı yönetiminden kurtar ve pan-Slav bir imparatorluk inşa et."
 mos_conquer_carpathia: "Karpatlar’ın Fethi"
 mos_conquer_carpathia_desc: "Karpat Dağları: Orta Avrupa’ya açılan bu kapıya boyun eğdirmek batı nüfuzunu büyük ölçüde genişletir."
 mos_great_northern_war: "Büyük Kuzey Savaşı"
 mos_great_northern_war_desc: "Büyük Kuzey Savaşı’nda (1700-1721) Büyük Petro İsveç’i yendi ve Baltık hegemonyasını kurdu: bu zaferi erkenden gerçekleştir."
 mos_dev_perm_city: "Perm Şehrini Geliştir"
 mos_dev_perm_city_desc: "Kürk ticaretinin merkezi Perm’i gerçek bir şehre dönüştür: Yukarı Kama Nehri’nde ticaret ve kürk toplama merkezi olarak büyüt."
 mos_yakutsk_founded: "Yakutsk’u Kur"
 mos_yakutsk_founded_desc: "1632’de kurulan Yakutsk: onu Doğu Sibirya’nın merkezi olarak inşa et ve Pasifik’e giden yolu aç."
 mos_dev_irkutsk: "İrkutsk’u Geliştir"
 mos_dev_irkutsk_desc: "Baykal Gölü kıyısındaki İrkutsk: sonradan “Sibirya’nın Paris’i” olacak bu şehri Doğu Sibirya’nın idari ve ticaret merkezi olarak geliştir."
 mos_dev_minsk: "Minsk’i Geliştir"
 mos_dev_minsk_desc: "Belarus’un merkezi Minsk’i batı egemenliğinin üssü olarak geliştir."
 mos_conquer_warsaw: "Varşova’nın Fethi"
 mos_conquer_warsaw_desc: "Polonya’nın başkenti Varşova: Polonya’nın paylaşımını tamamla ve Orta Avrupa üzerinde nüfuz kur."
 mos_iron_ring_defense: "Demir Halka Savunması"
 mos_iron_ring_defense_desc: "Güneyden ve batıdan gelecek istilalara karşı bir kale ağı: tabya kalelerinden oluşan demir bir savunma sistemi Rus topraklarını korur."
 mos_form_russia: "Rusya’yı Kur"
 mos_form_russia_desc: "Tatar boyunduruğunu kırdıktan, Kazan’ı fethettikten ve Rus prensliklerini birleştirdikten sonra: “Rusya” devletini resmen ilan et ve Çar olarak hepsinin üzerinde hüküm sür."
 mos_russian_empire: "Rus İmparatorluğu"
 mos_russian_empire_desc: "Büyük Petro 1721’deki Nystad Antlaşması ile Rusya’yı “imparatorluk” ilan etti: bu anı kürkler, tarım ve Petro reformları aracılığıyla erkenden gerçekleştir."
 mos_autocrat_of_all_russias: "Tüm Rusya’nın Otokratı"
 mos_autocrat_of_all_russias_desc: "“Tanrı’nın lütfuyla Tüm Rusya’nın İmparatoru ve Otokratı”: Baltık’tan Sibirya’ya, Kafkaslar’dan Kuzey Buz Denizi’ne tüm topraklar Çar’ın egemen lütfu altındadır."
 mos_events.1.t: "Moskova Büyük Dukalığı: Tatar Boyunduruğu Altında"
 mos_events.1.d: "1337’de Moskova küçük bir prenslik. Ancak Tatarların vergi toplama aracısı I. İvan Kalita’nın (“Para Çantası”) keskin becerisi sayesinde Moskova güç biriktirdi.\n\nMoskova’nın avantajı coğrafyasıdır: iç kesimdeki ormanlık konumu doğrudan Tatar denetimini güçleştirir.\n\nDmitri Donskoy’un Tatarları püskürttüğü Kulikovo Muharebesi’nin (1380) anısı yaşıyor. Tatar boyunduruğunu tamamen kır ve Rus prensliklerini Çar’ın egemenliği altında birleştir: Moskova’nın kaderi budur."
 mos_events.1.a: "Moskova’nın şanı için!"
 mos_events.5.t: "Tatar Boyunduruğunu Kır!"
 mos_events.5.d: "Moskova ordusu nihayet Tatarları savaşta yendi: Tatarlara haraç sonsuza dek sona erdi. “Ugra Nehri’nde Duruş (1480)” ile kıyaslanabilir bu tarihî dönüm noktasında Moskova özgür Rusya’nın sancaktarı olur. Rus prenslikleri Moskova’nın hegemonyasını tanır ve birleşik bir devlete giden yol açılır."
 mos_events.5.a: "Rusya özgür! Şimdi Rus birliği için!"
 mos_events.10.t: "Çar’ın Taç Giymesi"
 mos_events.10.d: "“Tüm Rusya’nın Çarı ve Büyük Prensi”: bu unvanı benimseyen Moskova, kendini Bizans İmparatorluğu’nun hak sahibi halefi olarak konumlandırır. IV. İvan’ın 1547’deki tarihî taç giyme törenini önceden gerçekleştir. Avrupa sarayları Moskova’yı yeni bir büyük güç olarak tanımaya başlar."
 mos_events.10.a: "Çar çok yaşasın! Moskova çok yaşasın!"
 mos_events.30.t: "İstanbul’un Geri Alınışı: Üçüncü Roma’nın Tamamlanışı"
 mos_events.30.d: "Ortodoks kutsal şehri İstanbul Rus ellerinde! 1453’te Osmanlılara düşen bu şehrin geri alınması, Rusya’nın “Üçüncü Roma” olarak Ortodoks dünyasının manevi lideri olması demektir. Hıristiyan haçı bir kez daha Ayasofya’nın üzerinde dalgalanıyor."
 mos_events.30.a: "Üçüncü Roma çok yaşasın! Rus Ortodoksluğu çok yaşasın!"
 mos_events.50.t: "Petro Reformları: Batılılaşma mı, Gelenek mi?"
 mos_events.50.d: "Bir Batılılaşma dalgası Rusya’yı sarmak üzere. Rusya’yı modern bir Avrupa gücü olarak geliştirmek için Batı teknolojisini, askerî sistemlerini ve bilimini aktif biçimde mi benimseyeceksin, yoksa Ortodoks geleneğini ve “Rus yolunu” koruyarak eşsiz bir imparatorluk mu inşa edeceksin?"
 mos_events.50.a: "Batılılaşmayı teşvik et: Rusya Avrupa’nın bir parçasıdır"
 mos_events.60.t: "Rusya’nın Oluşumu: Yeni Bir İmparatorluğun Doğuşu"
 mos_events.60.d: "Ukrayna, Belarus ve Galiçya tek bayrak altında: birleşik Doğu Slav devleti “Ruthenia” Doğu Avrupa’nın yeni bir büyük gücü olarak ortaya çıkıyor. Tüm Rus halkları Kiev’in altın kubbeleri altında toplanıyor."
 mos_events.60.a: "Rusya çok yaşasın! Tüm Rusya’nın Çarı çok yaşasın!"
 mos_events.99.t: "Tüm Rusya’nın Otokratı: İmparatorluğun Tamamlanışı"
 mos_events.99.d: "“Tanrı’nın lütfuyla Tüm Rusya’nın İmparatoru ve Otokratı”: Baltık’tan Sibirya’ya, Kafkaslar’dan Kuzey Buz Denizi’ne Rus bayrağı dünyanın en büyük imparatorluğu üzerinde dalgalanıyor. 1337’nin küçük Moskova prensliğinden dünyanın en büyük imparatorluğuna: bu tarihî başarı sonsuza dek anlatılacak."
 mos_events.99.a: "Tüm Rusya’nın Otokratı çok yaşasın! Rus İmparatorluğu çok yaşasın!"
 mos_events.50.b: "Geleneği koru"
