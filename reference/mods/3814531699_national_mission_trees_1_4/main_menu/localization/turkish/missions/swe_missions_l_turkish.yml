l_turkish:
 swe_stormaktstiden_mission_pack: "Stormaktstiden: İsveç’in Büyük Güç Çağı"
 swe_stormaktstiden_mission_pack_DESCRIPTION:0 "1337’de İsveç, Kral Magnus Eriksson yönetiminde Norveç ile şahsi birlik içinde bağımsız bir krallıktır. Kuzeyde güçlü Danimarka yer alır ve Kalmar Birliği’nin (1397) önceden haber verdiği gibi İskandinav üstünlüğü için gelecek mücadele kaçınılmazdır. Falun bakır madeni, Baltık hâkimiyeti ve Varegler’in doğu yolları aracılığıyla Stormaktstiden’i (Büyük Güç Çağı) gerçekleştir ve İsveç İmparatorluğu’nu inşa et."
 swe_stormaktstiden_mission_pack_CRITERIA_DESCRIPTION:0 "İsveç olarak İskandinav üstünlüğünü, birleşmeyi, doğu genişlemesini ve sanayi gelişimini başararak İskandinav İmparatorluğu’nu kur."
 swe_stormaktstiden_mission_pack_BUTTON_TOOLTIP:0 "İsveç İmparatorluğu’nu inşa etmek için görevleri tamamla."
 swe_stormaktstiden_mission_pack_BUTTON_DETAILS:0 "Engelbrekt İsyanı’ndan Stormaktstiden’e: İsveç’i bir İmparatorluğa dönüştür!"
 swe_kingdom_of_sweden: "İsveç Krallığı"
 swe_kingdom_of_sweden_desc: "1337’de İsveç, Kral Magnus Eriksson yönetiminde Norveç ile şahsi birlik içinde bağımsız bir krallıktır. Kuzeyde güçlü Danimarka, doğuda Rus prenslikleri ve güneyde Hansa Birliği ile çevrili İsveç, gelecek İskandinav üstünlüğü mücadelesine hazırlanmak için meşruiyetini güçlendirmeli ve diyarını istikrara kavuşturmalıdır."
 swe_norway_union: "Norveç ile Şahsi Birlik"
 swe_norway_union_desc: "İsveç ve Norveç 1319’dan beri Kral Magnus altında şahsi birlik içinde. Bu ittifakı güçlendirmek iki kuzey krallığının askerî ve ekonomik gücünü Danimarka’ya karşı birleştirir."
 swe_break_from_denmark: "Danimarka’ya Karşı Koy"
 swe_break_from_denmark_desc: "Gelmekte olan Kalmar Birliği (1397) Danimarka’ya İskandinavya üzerinde hâkimiyet vermek riskini taşıyor: İsveç’in kaçınması gereken bir gelecek. İsveç gücünü şimdiden Danimarka’ya karşı aktif biçimde ortaya koy ve İskandinav üstünlüğü iddiasının zeminini güvence altına al. Engelbrekt İsyanı’nın (1434) ruhunu önceden hayata geçir ve o gün gelmeden İsveç kraliyet otoritesini kur."
 swe_control_skaane: "Skåneland’ı Denetle"
 swe_control_skaane_desc: "Skåne (Scania) İsveç’in en güney bölgesidir ve Danimarka ile uzun süredir çekişmelidir. Malmö’yü ve Skåneland’ı ele geçirmek Öresund Boğazı’nı güvence altına alır ve İsveç’e Baltık Denizi’ne serbest bir çıkış sağlar."
 swe_defeat_denmark: "Danimarka’yı Yen"
 swe_defeat_denmark_desc: "Danimarka İsveç’in en büyük düşmanıdır. Kopenhag’ı işgal etmek ya da Danimarka’yı bir İsveç tabisi yapmak, Kuzey’in hâkimiyetinin İsveç’e geçmesi demektir. “İsveç İskandinavya’nın gerçek lideridir”: Gustav Vasa’nın hayalini kurduğu konum burada gerçekleşir."
 swe_integrate_norway: "Norveç’i Bütünleştir"
 swe_integrate_norway_desc: "Oslo’ya, Bergen’e ve Nidaros’a doğrudan sahip olmak Norveç’i İsveç İmparatorluğu’nun bir parçası olarak tamamen bütünleştirir. Norveç’in zengin balıkçılığı ve Kuzey Atlantik kapısı İsveç gücünü çarpıcı biçimde genişletir."
 swe_unite_scandinavia: "İskandinavya’yı Birleştir"
 swe_unite_scandinavia_desc: "Danimarka ezildi, Norveç bütünleşti: tüm İskandinavya İsveç sancağı altında birleşti. Viking çağından beri kimsenin başaramadığı bu başarı, tüm İskandinavya’yı birleştirmek, şimdi gerçekleşiyor."
 swe_danish_navy_seizure: "Danimarka Filosunu Ele Geçir"
 swe_danish_navy_seizure_desc: "Danimarka’yı yendikten sonra güçlü filosu İsveç’e geçer. Baltık’ın en güçlü deniz gücü artık İsveç ellerinde ve Kuzey Denizi hâkimiyetine giden yolu açıyor."
 swe_danish_navy_seizure_unlock_tt: "“Danimarka Donanmasının Katılması” kararı artık kullanılabilir."
 swe_danish_fleet_decision.title: "Danimarka Donanmasının Katılması"
 swe_danish_fleet_decision.desc: "Ele geçirilen Danimarka gemileri yenilen krallığın limanlarında atıl yatıyor. Onları mürettebatlandırıp yeniden donatmak hazineye pahalıya mal olacak ve krallığı huzursuz edecek, ama İsveç bayrağı altındaki altı büyük karaka Baltık’taki dengeyi değiştirebilir."
 swe_danish_fleet_decision.a: "Altı karakayı hizmete al."
 swe_sound_toll: "Sound Geçiş Ücreti"
 swe_sound_toll_desc: "Skåneland güvence altına alındığında İsveç, Öresund Boğazı’nı İsveç tarafında denetler. Danimarka’nın yerine Sound Geçiş Ücreti toplamak muazzam gelir sağlar."
 swe_control_gotland: "Gotland’ı Denetle"
 swe_control_gotland_desc: "Gotland’daki Visby, Baltık’ın en büyük ticaret şehirlerinden biridir. Danimarka’nın, Hansa Birliği’nin ve Livonya Tarikatı’nın çekiştiği bu ödülü ele geçirmek İsveç’in Baltık ticaretindeki tutunağını kurar."
 swe_baltic_trade: "Baltık Ticareti"
 swe_baltic_trade_desc: "Gotland’ı üs alan İsveç, Baltık ticaretine ciddi biçimde girer. Varegler bir zamanlar İsveç’ten Bizans’a kadar mal taşırdı. Bu geleneği canlandır ve Baltık’a hükmeden İsveçli tüccarlar çağını yarat."
 swe_conquer_estonia: "Estonya’yı Fethet"
 swe_conquer_estonia_desc: "Tallinn (Reval) aslen Danimarkalılar tarafından kurulmuştu, ancak İsveç Estonya’yı Livonya Savaşı’nda (1558-83) kazanacaktı. Bu tarihî fethi önceden gerçekleştir ve İsveç’in doğu Baltık kıyısındaki köprübaşını kur."
 swe_control_livonia: "Livonya’yı Denetle"
 swe_control_livonia_desc: "Riga’yı ve Tartu’yu (Dorpat) ele geçirmek tüm doğu Baltık kıyısını İsveç denetimine sokar. Polonya, Rusya ve Danimarka ile rekabet içinde İsveç Livonya’nın nihai efendisi olur."
 swe_varangian_legacy: "Vareg Mirası"
 swe_varangian_legacy_desc: "8.-10. yüzyıllarda Varegler (Vikingler) Novgorod’u kurdu ve Dinyeper üzerinden İstanbul’a giden ticaret yollarını açtı. Novgorod’u ve Pskov’u ele geçirmek bu kadim mirası modern çağda canlandırır."
 swe_city_of_rus: "Rus’un Şehri"
 swe_city_of_rus_desc: "Moskova, Moskova Büyük Dukalığı’nın başkenti ve Rus dünyasının merkezidir. Varegler’in mirasçıları olarak İsveç’in Moskova’yı denetlemesi Baltık’tan tüm Doğu Slav uygarlığına uzanan İsveç İmparatorluğu’nu tamamlar."
 swe_bane_of_hansa: "Hansa’nın Belası"
 swe_bane_of_hansa_desc: "Hansa Birliği Baltık ticaretini tekeline almıştı, ancak İsveç genişledikçe çatlaklar beliriyor. Lübeck’i (Hansa’nın lideri) denetle ya da Hansa Birliği’ni tamamen dağıt ve Baltık ticaretindeki başrolü İsveç’e aktar."
 swe_pomeranian_coast: "Pomeranya Kıyısı"
 swe_pomeranian_coast_desc: "Stralsund’u ve Stettin’i ele geçirmek güney Baltık boyunca Pomeranya kıyısını İsveç denetimine sokar. İsveç’in Otuz Yıl Savaşları’nda (1618-48) gerçekte kazandığını önceden gerçekleştir ve bu bölgeyi güvenceye al."
 swe_prussian_ambition: "Prusya Emeli"
 swe_prussian_ambition_desc: "Bir zamanlar Töton Şövalyelerince yönetilen Prusya, güneydoğu Baltık’ın merkezidir. Königsberg’i ve Prusya bölgesini güvenceye almak İsveç’e Baltık Denizi’nin tam hâkimiyetini verir."
 swe_dominium_maris_baltici: "Dominium Maris Baltici"
 swe_dominium_maris_baltici_desc: "“Dominium Maris Baltici” (Baltık Denizi Hâkimiyeti): İsveç’in 17. yüzyıldaki nihai stratejik hedefi. Baltık kıyı şeridinin tamamına hâkim olmak bu iç denizi İsveç’in “gölü” yapar."
 swe_secure_stockholm: "Stokholm’ü Güvenceye Al"
 swe_secure_stockholm_desc: "Stokholm, “suların arasındaki ada”, Mälaren Gölü ile Baltık arasında doğal bir kale şehridir. Onu 30+ gelişimle şehir rütbesine yükseltmek, İsveç kraliyet gücünün merkezi olarak kurar."
 swe_falun_mine: "Falun Madeni"
 swe_falun_mine_desc: "Stora Kopparberget (Büyük Bakır Dağı): Falun bakır madeni 9. yüzyıldan beri işliyor ve İsveç ekonomisinin kalbi. IV. Magnus 1347’de madencilik şirketine ek ayrıcalıklar verdiğinde madenin Avrupa’nın bakır talebinin üçte ikisini karşıladığı söylenirdi. Bu madeni azamiye çıkar."
 swe_iron_industry: "İsveç Demir Sanayisi"
 swe_iron_industry_desc: "Svealand’ın demir madenleri İsveç’in savunma sanayisinin temelidir. Yüksek kaliteli İsveç demiri Avrupa orduları tarafından arzulanırdı: Otuz Yıl Savaşları’nın topları İsveç demiri kullandı. Bu sanayi avantajını daha da genişlet."
 swe_swedish_steel: "İsveç Çeliği"
 swe_swedish_steel_desc: "İsveç çeliği Avrupa’nın en iyi kalitesi olarak ünlüdür. Bol bakır ve demir üretimine dayanan çelik sanayisi hem İsveç ordularını teçhiz etmekte hem ihracat gelirinde İsveç İmparatorluğu’nun ekonomik gücünü simgeler."
 swe_riksdag: "Riksdag"
 swe_riksdag_desc: "Riksdag (Parlamento) İsveç’te ilk kez 1435’te toplandı. Soyluların, şövalyelerin, din adamlarının ve köylülerin (eşsiz biçimde İsveçli köylülerin kendi zümre temsili vardı) bu zümreler meclisi, İsveç’in kendine özgü siyasi geleneğini kurmak için güçlendirilmelidir."
 swe_absolutism: "Mutlakiyet"
 swe_absolutism_desc: "1680’de XI. Karl “reduktionen” (indirim) yoluyla soylu topraklarını geri aldı ve İsveç’te mutlak monarşiyi kurdu. Bu tarihî dönüşümü önceden gerçekleştir ve kraliyet gücünü tamamen pekiştir."
 swe_great_power: "Büyük Güç Olarak İsveç"
 swe_great_power_desc: "17. yüzyıl Stormaktstiden’i, İsveç’in II. Gustav Adolf, X. Karl Gustav ve XII. Karl yönetiminde büyük bir Avrupa gücü olarak ortaya çıktığını gördü. Bu çağı geniş toprak, zengin gelir ve yüksek prestijle önceden gerçekleştir."
 swe_stormakt_economy: "Büyük Gücün Ekonomisi"
 swe_stormakt_economy_desc: "İsveç çeliği, mutlak monarşinin idari verimliliği, Baltık ticareti: Stormaktstiden’in ekonomik temeli tamam. İsveç imparatorluk gücünü aylık gelir 400+ ve birden fazla pazar merkeziyle kanıtla."
 swe_religious_crossroads: "Dinî Kavşak"
 swe_religious_crossroads_desc: "Reform fırtınası İskandinavya’yı süpürüyor. İsveç sarayı hararetle tartışıyor: Roma Papası’na bağlılığı korumak mı, Martin Luther’in devrimci öğretilerini kabul etmek mi, yoksa atalarının taptığı kadim tanrılara dönmek mi? İsveç kralının kararı bu kuzey krallığının geleceğini belirleyecek."
 swe_catholic_sweden: "Katolik İsveç"
 swe_catholic_sweden_desc: "İsveç Krallığı Roma Kilisesi’ne bağlılığını sürdürür. Papa ile yakın ilişkiler İsveç’e diplomatik avantajlar ve kuzey Katolik uygarlığının koruyucusu olarak tanınma sağlar."
 swe_northern_crusade: "Kuzey Haçlı Seferi"
 swe_northern_crusade_desc: "İsveç, Hıristiyan dünyasının kuzey kalkanı olarak kutsal savaşa katılır. Gayrihıristiyan halklara karşı kuzey haçlı seferlerine önderlik etmek İsveç’in dinî otoritesini ve prestijini yükseltir."
 swe_church_reform: "Papa’nın Şampiyonu"
 swe_church_reform_desc: "Papalıkla derin güven ve Lübeck’in denetimi: İsveç kuzey Katolik uygarlığının koruyucusu olarak sarsılmaz bir konum kurdu."
 swe_reformation: "Reform"
 swe_reformation_desc: "1527’de İsveç Kralı Gustav Vasa, Västerås Parlamentosu’nda Lutherciliği fiilî devlet dini ilan etti. Kilise mallarının tacı devredilmesi devlet maliyesini çarpıcı biçimde güçlendirdi. Bu belirleyici eylemi şimdi önceden gerçekleştir."
 swe_protestant_reform: "Protestan Kilisesi"
 swe_protestant_reform_desc: "Lutherci ilahiyatçılar yetiştirmek için üniversiteler geliştir ve Protestan inancını tüm İsveç’e yerleştir. İsveç Kilisesi’nin özgünlüğü İsveç kültürünün ve kimliğinin temeli olur."
 swe_protestant_empire: "Protestan İmparatorluk"
 swe_protestant_empire_desc: "Lutherçilik tüm İskandinavya’ya nüfuz eder. İsveç kralı Protestan dünyasının kuzey şampiyonu olarak hüküm sürer ve Otuz Yıl Savaşları’nda olduğu gibi güneyin Katolik güçleriyle yüzleşebilir."
 swe_norse_revival: "Norse Canlanışı"
 swe_norse_revival_desc: "Atalarının tanrıları, Odin, Thor, Freyr, yeniden doğuyor. Hıristiyanlaşmadan önceki İskandinavya’nın biçimi modern çağda yeniden yaratılıyor. Norse tanrılarının temsilcisi olarak hüküm süren İsveç kralı: bu devrimci tercih tüm Avrupa’yı şoke edecek."
 swe_berserker_army: "Berserker Ordusu"
 swe_berserker_army_desc: "Viking çağı ayı-savaşçılarının ruhu yeniden canlanıyor. Norse tanrılarına adanmış savaşçılar korsanlık için salıveriliyor ve gayrimüslimlerin kıyılarını serbestçe yağmalıyor."
 swe_yggdrasil_throne: "Yggdrasil Tahtı"
 swe_yggdrasil_throne_desc: "Dünya Ağacı’nın köklerinde tahta oturan Odin gibi İsveç imparatoru kuzey dünyasının merkezinde hüküm sürer. İmparatorluk rütbesi ve 500+ konumla Norse tanrılarının kutsadığı kuzey imparatorluğu tamamlanır."
 swe_finland_integration: "Finlandiya’yı Bütünleştir"
 swe_finland_integration_desc: "Finlandiya 12. yüzyıldan beri İsveç’in ayrılmaz bir parçasıdır. Åbo’ya, Viborg’a ve Uleåborg’a doğrudan sahip olmak İsveç’in Kuzey Atlantik’e ve Barents Denizi’ne köprübaşını kurar."
 swe_lapland_expansion: "Laponya Genişlemesi"
 swe_lapland_expansion_desc: "Norrland’ın (kuzey İsveç) uçsuz bucaksız ormanları Sami halkının yurdudur. Topraklarını krallığa bütünleştirmek ve kereste, kürk ve demir cevherinin bol kaynaklarını güvence altına almak İsveç’in kuzey sınırının ciddi gelişimini başlatır."
 swe_arctic_empire: "Arktik İmparatorluk"
 swe_arctic_empire_desc: "Uleåborg merkezli Norveç Denizi’ne ve Barents Denizi’ne konuşlanmak: İsveç Kuzey Kutup Dairesi’ne uzanan bir kuzey imparatorluğu olur. Deniz valileri atanır ve denizcilik varlığı genişletilerek İsveç İmparatorluğu’nun kuzey sınırı tamamlanır."
 swe_develop_stockholm: "Büyük Stokholm"
 swe_develop_stockholm_desc: "Stokholm üniversitesi olan büyük bir şehre dönüştü. Baltık’ı ve Kuzey Denizi’ni bağlayan bu şehir, İsveç İmparatorluğu’nun kültürel, ticari ve siyasi merkezi olarak Kuzey Avrupa’nın en büyük şehrine dönüşür."
 swe_develop_goteborg: "Göteborg’u Geliştir"
 swe_develop_goteborg_desc: "Göteborg, II. Gustav Adolf tarafından 1621’de İsveç’in batı kıyısı limanı olarak kuruldu. Onu şehir rütbesine yükseltmek Danimarka’ya, Hollanda’ya ve İngiltere’ye doğrudan bir ticaret yolu açar."
 swe_peasant_support: "Köylü Desteği"
 swe_peasant_support_desc: "İsveç’in köylü zümresi Riksdag’da kendi temsiline sahiptir: eşsiz bir özellik. Köylü memnuniyetini yükseltmek ve tahıl üretimini genişletmek toplumsal istikrarı ve İsveç’in kendine özgü demokratik geleneğini kurar."
 swe_engelbrekt: "Engelbrekt’in Ruhu"
 swe_engelbrekt_desc: "1434-36’da Engelbrekt Engelbrektsson madencileri ve köylüleri Danimarka egemenliğine karşı isyana sevk etti. Suikasta uğradı, ama ruhu İsveç bağımsızlık hareketinin ebedî simgesi oldu. Bu ruhu şimdi resmen bünyende topla."
 swe_colonization: "İsveç Sömürge İmparatorluğu"
 swe_colonization_desc: "İsveç de 17. yüzyılda Yeni İsveç (Delaware Nehri bölgesi) dahil koloniler kurdu. Finlandiya’nın gelişimi üzerine inşa ederek denizaşırı sömürge girişimleri başlat ve İsveç İmparatorluğu’nun erişimini dünyaya yay."
 swe_develop_uppsala: "Uppsala Üniversitesi Çiçek Açıyor"
 swe_develop_uppsala_desc: "İsveç’in en eski üniversitesi olan Uppsala Üniversitesi (1477’de kuruldu), Carl Linnaeus’u (sınıflandırma) ve Anders Celsius’u (termometre) yetiştirdi: Kuzey Avrupa’nın en seçkin akademisi. Bu üniversiteyi geliştir ve İsveç ilminin temellerini sağlamlaştır."
 swe_karoliner: "Karoliner"
 swe_karoliner_desc: "Karoliner (Kral Karl’ın askerleri), 18. yüzyılın başında XII. Karl yönetiminde İsveç İmparatorluğu’nun seçkin piyadesiydi ve çağının en güçlü piyadesi olarak bilinirdi. Bu seçkin birliği önceden gerçekleştirmek için yüksek askerî gelenek ve büyük bir ordu geliştir."
 swe_amber_trade: "Kehribar Ticareti"
 swe_amber_trade_desc: "İsveç denetimindeki topraklardan tüm Avrupa’ya ihraç edilen Baltık kehribarı “Kuzey’in Altını”dır. Büyük gücün ekonomik temeli üzerine inşa ederek ve kehribar ticaretini daha da genişleterek İsveç İmparatorluğu’nun ticari gelirini artır."
 swe_stormaktstiden: "Stormaktstiden"
 swe_stormaktstiden_desc: "İskandinavya birleşti, Baltık’a hâkim olundu, büyük güç ekonomisi başarıldı: üç sütun hizalanır ve İsveç Stormaktstiden’in (Büyük Güç Çağı) zirvesine ulaşır. 600+ konum, 600+ gelir ve 80+ prestijle bu şanı ele geçir."
 swe_swedish_empire: "İsveç İmparatorluğu"
 swe_swedish_empire_desc: "Baltık’tan Moskova’ya, İskandinavya’dan Prusya’ya: İsveç İmparatorluğu tamam. 1337’de Norveç ile şahsi birlikle başlayan İsveç’in yolculuğu, tüm Kuzey Avrupa’ya hâkim büyük bir imparatorluğun gelişiyle burada sona eriyor. “İsveç en son güler”: XII. Karl’ın sözleri burada gerçekleşir."
 swe_events.30.t: "İskandinav Birliği: Stormaktstiden’in Şafağı"
 swe_events.30.d: "Danimarka ezildi, Norveç bütünleşti: tüm İskandinavya İsveç sancağı altında birleşti. Viking çağından beri ulaşılamayan bu başarı nihayet gerçekleşti. İsveç kralı burada “İskandinavya Kralı” unvanını ilan eder ve Kuzey Avrupa’nın en büyük devletinin inşası başlar. “Engelbrekt’in hayali bugün burada gerçekleşti”: gelecekteki tarihçiler böyle yazacak."
 swe_events.30.a: "İskandinavya çok yaşasın! Kuzey’in birliği ilelebet!"
 swe_events.40.t: "İnancın Kavşağı: İsveç’in Dinî Tercihi"
 swe_events.40.d: "Reform fırtınası İskandinavya’yı süpürüyor. İsveç sarayı hararetle tartışıyor. Roma’daki Papa’ya bağlılığı mı koruyacağız, Luther’in devrimci öğretilerini mi kabul edeceğiz, yoksa atalarımızın taptığı kadim tanrılara mı döneceğiz? İsveç kralının kararı bu kuzey krallığının geleceğini belirleyecek."
 swe_events.40.a: "Roma’ya bağlılığı koru: Katoliklik İsveç’in ruhudur"
 swe_events.40.b: "Luther’in öğretilerini kabul et: reform çağı geldi"
 swe_events.40.c: "Kadim tanrılara dön: Odin’in lütfunu ara"
 swe_events.99.t: "İsveç İmparatorluğu’nun Doğuşu"
 swe_events.99.d: "Baltık’tan Moskova’ya, İskandinavya’dan Prusya’ya: İsveç İmparatorluğu nihayet tamamlandı. 1337’de bir Norveç şahsi birliğiyle başlayan yolculuğundan İsveç, çevre bir kuzey ulusundan tüm Kuzey Avrupa’ya hâkim büyük bir imparatorluğa dönüştü. Stormaktstiden (Büyük Güç Çağı): İsveç’in dünya tarihinde önde gelen bir aktör olduğu çağ buydu. “Yine gündüz oldu, ama bu sefer İsveç’in gündüzü.”"
 swe_events.99.a: "İsveç İmparatorluğu’nun İmparatoru çok yaşasın! Kuzey İmparatorluğu ilelebet payidar olsun!"
 STATIC_MODIFIER_NAME_swe_kingdom_mod: "İsveç Krallığı"
 STATIC_MODIFIER_DESC_swe_kingdom_mod: "Kral Magnus Eriksson’un saltanatı altında İsveç’in yeniden inşasının temel taşı atıldı."
 STATIC_MODIFIER_NAME_swe_norway_union_mod: "Norveç Birliği Bonusu"
 STATIC_MODIFIER_DESC_swe_norway_union_mod: "Norveç ile şahsi birlik, kuzeybatı İskandinavya’nın askerî gücünü bütünleştirir."
 STATIC_MODIFIER_NAME_swe_skaane_mod: "Skåneland Güvence Altında"
 STATIC_MODIFIER_DESC_swe_skaane_mod: "Skåneland’ın denetimiyle Öresund Boğazı’nın İsveç tarafı güvence altına alındı."
 STATIC_MODIFIER_NAME_swe_norway_integrated_mod: "Norveç Bütünleşti: Balıkçılığın Hediyesi"
 STATIC_MODIFIER_DESC_swe_norway_integrated_mod: "Norveç’in zengin balıkçılık alanları İsveç İmparatorluğu’na bütünleşti."
 STATIC_MODIFIER_NAME_swe_scandinavia_united_mod: "İskandinavya Birleşti"
 STATIC_MODIFIER_DESC_swe_scandinavia_united_mod: "Üç krallığın sancakları tek bir taç altında yan yana duruyor ve Stokholm’den çıkan emirler kuzey denizlerinin ötesine ulaşıyor."
 STATIC_MODIFIER_NAME_swe_baltic_trade_mod: "Baltık Ticareti"
 STATIC_MODIFIER_DESC_swe_baltic_trade_mod: "İsveç Baltık ticaretine ciddi biçimde giriyor. Kadim Vareg ticaret yolları yeniden yaşıyor."
 STATIC_MODIFIER_NAME_swe_estonia_mod: "Estonya Fethedildi"
 STATIC_MODIFIER_DESC_swe_estonia_mod: "Tallinn merkezli Estonya İsveç denetimine girdi."
 STATIC_MODIFIER_NAME_swe_livonia_mod: "Livonya Denetlendi"
 STATIC_MODIFIER_DESC_swe_livonia_mod: "Riga ve Tartu ele geçirilince tüm doğu Baltık kıyısı İsveç yönetiminde."
 STATIC_MODIFIER_NAME_swe_varangian_mod: "Vareg Mirası"
 STATIC_MODIFIER_DESC_swe_varangian_mod: "Novgorod’u ele geçirmek kadim Vareg ticaret yollarını canlandırır."
 STATIC_MODIFIER_NAME_swe_eastern_empire_mod: "Rus’a Hâkimiyet"
 STATIC_MODIFIER_DESC_swe_eastern_empire_mod: "Moskova’yı ele geçirmek İsveç’i Doğu Slav dünyasının efendisi yapar."
 STATIC_MODIFIER_NAME_swe_dominium_baltici_mod: "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_swe_dominium_baltici_mod: "Baltık Denizi İsveç’in “gölü” olur. Bu denizi geçen her ticaret gemisi İsveç’e hesap verir."
 STATIC_MODIFIER_NAME_swe_hansa_victory_mod: "Hansa Yenildi"
 STATIC_MODIFIER_DESC_swe_hansa_victory_mod: "İsveç Hansa Birliği’ni yener ve Baltık ticaretinin yıldızı olur."
 STATIC_MODIFIER_NAME_swe_pomerania_mod: "Pomeranya Kıyısı"
 STATIC_MODIFIER_DESC_swe_pomerania_mod: "İsveç’in Otuz Yıl Savaşları’nda kazandığını önceden gerçekleştirerek güney Baltık kıyısı İsveç denetiminde."
 STATIC_MODIFIER_NAME_swe_prussia_mod: "Prusya Emeli"
 STATIC_MODIFIER_DESC_swe_prussia_mod: "Königsberg dahil Prusya İsveç denetimine girdi."
 STATIC_MODIFIER_NAME_swe_stockholm_mod: "Stokholm Güvence Altında"
 STATIC_MODIFIER_DESC_swe_stockholm_mod: "İsveç kraliyet başkenti Stokholm idari merkez olarak geliştirildi."
 STATIC_MODIFIER_NAME_swe_falun_copper_mod: "Falun Bakır Madeni"
 STATIC_MODIFIER_DESC_swe_falun_copper_mod: "Avrupa’nın bakır talebini karşılayan Falun bakır madeni tam işletmede."
 STATIC_MODIFIER_NAME_swe_iron_industry_mod: "Demir Sanayisi"
 STATIC_MODIFIER_DESC_swe_iron_industry_mod: "Svealand’ın demir madenleri tam işletmede ve İsveç’in savunma sanayisinin temelini kuruyor."
 STATIC_MODIFIER_NAME_swe_steel_mod: "İsveç Çeliği"
 STATIC_MODIFIER_DESC_swe_steel_mod: "Avrupa’nın en iyi kalitesindeki İsveç çeliği yurt içi ve yurt dışı ordulara tedarik ediliyor."
 STATIC_MODIFIER_NAME_swe_riksdag_mod: "Riksdag"
 STATIC_MODIFIER_DESC_swe_riksdag_mod: "İsveç’in parlamentosu işlevsel bir yasama organı olarak kuruldu. Köylülerin katıldığı İsveç’in eşsiz siyasi geleneği şekilleniyor."
 STATIC_MODIFIER_NAME_swe_absolutism_mod: "Mutlakiyet"
 STATIC_MODIFIER_DESC_swe_absolutism_mod: "XI. Karl’ın reduktionen’ini önceden gerçekleştirerek İsveç’te mutlak monarşi kuruldu."
 STATIC_MODIFIER_NAME_swe_great_power_mod: "Büyük Güç Olarak İsveç"
 STATIC_MODIFIER_DESC_swe_great_power_mod: "Stormaktstiden’in gelişi İsveç’i büyük bir Avrupa gücü olarak ortaya çıkarır."
 STATIC_MODIFIER_NAME_swe_stormakt_economy_mod: "Büyük Güç Ekonomisi"
 STATIC_MODIFIER_DESC_swe_stormakt_economy_mod: "İsveç çeliği, mutlak monarşi ve Baltık ticaretine dayanan İsveç’in büyük güç ekonomisi tamam."
 STATIC_MODIFIER_NAME_swe_catholic_mod: "Katolik İsveç"
 STATIC_MODIFIER_DESC_swe_catholic_mod: "Roma Kilisesi’ne bağlılığını koruyan İsveç, kuzey Katolik uygarlığının koruyucusu olarak tanınır."
 STATIC_MODIFIER_NAME_swe_crusader_glory_mod: "Kuzey Haçlı Şanı"
 STATIC_MODIFIER_DESC_swe_crusader_glory_mod: "İsveç kutsal savaşa katılır ve Hıristiyan dünyasının koruyucusu olarak itibarını kurar."
 STATIC_MODIFIER_NAME_swe_lutheran_mod: "Lutherci Reform"
 STATIC_MODIFIER_DESC_swe_lutheran_mod: "Gustav Vasa’nın Lutherci ilanını önceden gerçekleştirerek kilise malları tacı geçer."
 STATIC_MODIFIER_NAME_swe_protestant_reform_mod: "Protestan Kilisesi"
 STATIC_MODIFIER_DESC_swe_protestant_reform_mod: "Lutherci ilahiyat eğitimi Protestan inancını tüm İsveç’e yerleştirir."
 STATIC_MODIFIER_NAME_swe_norse_conversion_mod: "Norse Canlanışı"
 STATIC_MODIFIER_DESC_swe_norse_conversion_mod: "Odin’e, Thor’a ve Freyr’e inanç yeniden canlanıyor. Viking çağı savaşçı ruhu İsveç ordularına yerleşiyor."
 STATIC_MODIFIER_NAME_swe_berserker_mod: "Berserker Ordusu"
 STATIC_MODIFIER_DESC_swe_berserker_mod: "Viking çağının ayı-savaşçı ruhu yeniden canlandı. Gayrimüslim kıyıları yağmalamak için korsanlık salıverildi."
 STATIC_MODIFIER_NAME_swe_yggdrasil_mod: "Yggdrasil Tahtı"
 STATIC_MODIFIER_DESC_swe_yggdrasil_mod: "Dünya Ağacı’nın köklerindeki Odin gibi İsveç imparatoru kuzey dünyasının merkezinde hüküm sürer."
 STATIC_MODIFIER_NAME_swe_finland_mod: "Finlandiya Bütünleşti"
 STATIC_MODIFIER_DESC_swe_finland_mod: "Finlandiya İsveç İmparatorluğu’nun bir parçası olarak bütünleşti. Sömürge politikası kuzey sınırını açar."
 STATIC_MODIFIER_NAME_swe_lapland_mod: "Laponya Genişlemesi"
 STATIC_MODIFIER_DESC_swe_lapland_mod: "Norrland’ın uçsuz bucaksız ormanları İsveç’e bütünleşti."
 STATIC_MODIFIER_NAME_swe_arctic_mod: "Arktik İmparatorluk"
 STATIC_MODIFIER_DESC_swe_arctic_mod: "Arktik kıyısında duran İsveç fenerleri Kuzey Atlantik’i geçen denizcilere yol gösteriyor."
 STATIC_MODIFIER_NAME_swe_stormaktstiden_mod: "Stormaktstiden"
 STATIC_MODIFIER_DESC_swe_stormaktstiden_mod: "İsveç’in Büyük Güç Çağı: İskandinavya’ya, Baltık’a ve Doğu Avrupa’ya hâkim kuzey imparatorluğunun zirvesine ulaşıldı."
 STATIC_MODIFIER_NAME_swe_sound_toll_mod: "Sound Geçiş Ücreti"
 STATIC_MODIFIER_DESC_swe_sound_toll_mod: "Öresund Sound Geçiş Ücreti’ni toplamak İsveç hazinesini zenginleştirir."
 STATIC_MODIFIER_NAME_swe_stockholm_great_mod: "Stokholm: Kuzey’in Şehri"
 STATIC_MODIFIER_DESC_swe_stockholm_great_mod: "Stokholm üniversitesi olan büyük bir şehre dönüştü ve Kuzey Avrupa’nın en büyük kültürel ve akademik başkenti oldu."
 STATIC_MODIFIER_NAME_swe_peasant_mod: "Köylü Desteği"
 STATIC_MODIFIER_DESC_swe_peasant_mod: "İsveç köylü zümresinin desteği İsveç’e özgü toplumsal istikrar yaratır."
 STATIC_MODIFIER_NAME_swe_engelbrekt_mod: "Engelbrekt’in Ruhu"
 STATIC_MODIFIER_DESC_swe_engelbrekt_mod: "1434 isyanının ruhu İsveç ordularına ilham verir. Özgürlük için savaşmak İsveç’in gururudur."
 STATIC_MODIFIER_NAME_swe_colonial_mod: "İsveç Sömürge İmparatorluğu"
 STATIC_MODIFIER_DESC_swe_colonial_mod: "İsveç denizaşırı sömürge girişimleri başlatır ve Kuzey Avrupa’nın ötesinde bir imparatorluk olur."
 STATIC_MODIFIER_NAME_swe_papal_champion_mod: "Papa’nın Şampiyonu"
 STATIC_MODIFIER_DESC_swe_papal_champion_mod: "İsveç kuzey Katolik uygarlığının en güçlü koruyucusu olarak sarsılmaz bir konum kurar."
 STATIC_MODIFIER_NAME_swe_protestant_empire_mod: "Protestan İmparatorluk"
 STATIC_MODIFIER_DESC_swe_protestant_empire_mod: "Tüm İskandinav Lutherçiliğiyle İsveç Protestan dünyasının kuzey şampiyonu olarak hüküm sürer."
 STATIC_MODIFIER_NAME_swe_amber_mod: "Kehribar Ticareti"
 STATIC_MODIFIER_DESC_swe_amber_mod: "Baltık kıyılarında toplanan kehribar Stokholm kuyumcularının vitrinlerinde altın rengi parlıyor."
 STATIC_MODIFIER_NAME_swe_uppsala_mod: "Uppsala Üniversitesi"
 STATIC_MODIFIER_DESC_swe_uppsala_mod: "İsveç’in en eski üniversitesi Kuzey Avrupa’nın en seçkin akademik kurumu olarak gelişiyor."
 STATIC_MODIFIER_NAME_swe_karoliner_mod: "Karoliner"
 STATIC_MODIFIER_DESC_swe_karoliner_mod: "Karl’ın seçkin piyadesini önceden gerçekleştirerek yüksek eğitimli bir İsveç ordusu tamamlandı."
 STATIC_MODIFIER_NAME_swe_scandinavian_empire_final_mod: "İsveç İmparatorluğu"
 STATIC_MODIFIER_DESC_swe_scandinavian_empire_final_mod: "Baltık’tan Doğu Avrupa’ya uzanan İsveç İmparatorluğu tamam. Stormaktstiden ilelebet sürer."
 STATIC_MODIFIER_NAME_swe_faith_steadfast_mod: "İnançta Sarsılmaz"
 STATIC_MODIFIER_DESC_swe_faith_steadfast_mod: "Sarsılmaz Katolik inancı, Uppsala Katedrali’nin çanlarının çalmasıyla kralın otoritesini halka ilan eder."
 STATIC_MODIFIER_NAME_swe_reform_winds_mod: "Reform Rüzgârları"
 STATIC_MODIFIER_DESC_swe_reform_winds_mod: "Luther’in öğretileri İsveç’e yayılıyor."
 STATIC_MODIFIER_NAME_swe_old_gods_calling_mod: "Kadim Tanrıların Çağrısı"
 STATIC_MODIFIER_DESC_swe_old_gods_calling_mod: "Odin’e ve Thor’a inanç gizlice yeniden canlanıyor."
 swe_norrkoping_textiles: "Norrköping Tekstil Sanayisi"
 swe_norrkoping_textiles_desc: "Norrköping İsveç’in doğu kıyısında tekstil ve kumaş üretiminin merkezi olan bir sanayi şehri oldu. Motala Nehri’nin bol su gücünü kullanarak kumaş üretimi İsveç ihracatının önemli bir dayanağı olur."
 STATIC_MODIFIER_NAME_swe_norrkoping_textile_mod: "Norrköping Tekstil Sanayisi"
 STATIC_MODIFIER_DESC_swe_norrkoping_textile_mod: "Norrköping’de su gücüyle kumaş üretimi tam kapasiteyle işliyor. İsveç kumaşı Avrupa pazarlarına ihraç ediliyor."
 STATIC_MODIFIER_NAME_swe_goteborg_mod: "Varberg Limanı Geliştirildi"
 STATIC_MODIFIER_DESC_swe_goteborg_mod: "Kattegat üzerindeki Varberg limanında Kuzey Denizi’ne giden yelkenliler birbiri ardına demir alıyor."
 STATIC_MODIFIER_NAME_swe_visby_mod: "Visby Ticareti"
 STATIC_MODIFIER_DESC_swe_visby_mod: "Gotland’daki Visby’nin ardiye mahallesi bir kez daha tüm Baltık’tan gelen tüccarlarla dolup taşıyor."
 STATIC_MODIFIER_NAME_swe_denmark_crushed_mod: "Danimarka Ezildi"
 STATIC_MODIFIER_DESC_swe_denmark_crushed_mod: "Eski düşmanımız Danimarka’nın bayrağı indirildiğinde İskandinavya’nın lordları yeni hükümdarlarının adını sessizce andı."
