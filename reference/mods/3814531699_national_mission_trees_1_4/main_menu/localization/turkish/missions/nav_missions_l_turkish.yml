l_turkish:
 nav_crown_mission_pack: "Navarra Krallığı’nın Mirası"
 nav_crown_mission_pack_DESCRIPTION:0 "Pireneler’in eteklerine kök salmış Bask Navarra Krallığı Kastilya’nın, Aragon’un ve Fransa’nın üç büyük diyarı arasına sıkışmış küçük bir güçtür. Yine de kan hattı hem Fransa’nın hem Aragon’un kraliyet evlerinden geçer ve tarihin çarkları hizalanırsa önünde beklenmedik bir büyüklük yolu açılabilir. Bask birliğini mi kuracaksın, Gaskonya’nın ötesine geçip Fransa’ya mı müdahale edeceksin, yoksa İber Yarımadası üzerinde hâkimiyeti mi ele geçireceksin? Bu küçük krallığın kaderi kralının ellerinde."
 nav_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Navarra Krallığı olarak görevleri tamamla ve İberya ile Fransa üzerinde nüfuzla birlikte Bask birliğini kur."
 nav_crown_mission_pack_BUTTON_TOOLTIP:0 "Navarra Krallığı’nın mirasında yürümek için görevleri tamamla."
 nav_crown_mission_pack_BUTTON_DETAILS:0 "Bask birliğini kur, Gaskonya’ya ilerle ve İberya üzerinde hâkimiyet iddia et!"
 nav_kingdom_of_pamplona: "Pamplona Krallığı"
 nav_kingdom_of_pamplona_desc: "Eneko Arista tarafından kurulan Pamplona Krallığı Bask topraklarına derinden kök salmış kadim bir hattır. Yine de Kastilya’nın, Aragon’un ve Fransa’nın büyük güçleriyle çevrili olarak hayatta kalışı daima kırılgan bir dengeye dayandı."
 nav_secure_bayonne: "Bayonne’u Güvenceye Al"
 nav_secure_bayonne_desc: "Denizin karşısındaki akrabalarımızı, Bayonne’un Fransız Basklarını, tacımız altında birleştirme vakti geldi. Tüm Basklar bir gün tek bir sancağın altında toplanmalı."
 nav_basque_unity: "Bask Birliği"
 nav_basque_unity_desc: "Dilimizi ve âdetlerimizi paylaşan bir halk artık krallığın çekirdeğini oluşturuyor. Bask olmak en büyük gururumuz oldu."
 nav_fueros_and_privileges: "Fuero’ları Güvence Altına Al"
 nav_fueros_and_privileges_desc: "Fuero’lar, Bask kasabalarının uzun süredir elinde tuttuğu kadim özyönetim ayrıcalıklarıdır. Soyluların hoşnutluğu arttıkça bu ayrıcalıkları güvence altına almak tacın kendisi için sağlam bir temel olur."
 nav_efficient_administration: "Verimli Bir İdare"
 nav_efficient_administration_desc: "Diyar genelinde kurulan muhasebe evleri mali temellerimizi güçlendirir. Küçük bir krallık için yönetim verimliliği bir can damarıdır."
 nav_renaissance_of_pamplona: "Pamplona Rönesansı"
 nav_renaissance_of_pamplona_desc: "İtalya’dan yükselen yeni ilim rüzgârları Pireneler’in eteklerine bile ulaştı. Krallık ne kadar küçük olursa olsun ruhu çağın ön saflarında yürüyor."
 nav_intervene_hundred_years_war: "Yüz Yıl Savaşları’na Müdahale Et"
 nav_intervene_hundred_years_war_desc: "Fransa ile İngiltere arasındaki uzun mücadele şiddetlenerek sürüyor. Kraliyet kan hattımız her iki taçtan da geçer ve Navarra’nın üçüncü bir güç olarak müdahale etme hem hakkı hem fırsatı vardır."
 nav_foothold_in_france: "Fransa’da Bir Tutunak"
 nav_foothold_in_france_desc: "Yüz Yıl Savaşları’nın kaosundan yararlanarak Fransız topraklarının bir kısmını güvenceye al. Bu krallığın erişimini güneybatı Fransa’nın kalbine kadar genişletir."
 nav_secure_gascony: "Gaskonya’yı Güvenceye Al"
 nav_secure_gascony_desc: "Tursan toprağına hâkim olmak ve Bordeaux limanını ele geçirmek tüm Gaskonya’yı yönetimimiz altına alır ve Atlantik’e açılan kapıyı açar."
 nav_claims_on_france: "Fransız Tacı İçin Bir Tutunak"
 nav_claims_on_france_desc: "Fransa’nın içindeki geniş topraklar güvence altına alındığına göre hanedanımızın Fransız tahtına yönelik emeli artık salt hayal değil."
 nav_house_of_evreux: "Évreux Hanedanı’nın Emeli"
 nav_house_of_evreux_desc: "İster Fransa ile şahsi birlik yoluyla ister Paris’in kendisinin doğrudan işgali yoluyla olsun, hanedanımızın Fransız tahtına yönelik meşruiyeti artık şüphe götürmez."
 nav_claim_french_throne: "Fransız Tahtını Sahiplen"
 nav_claim_french_throne_desc: "Fransız kraliyet hattı artık söndüğüne göre hanedanımız tacının meşru varisi olarak duruyor. Navarra ve Fransa iki tacın tek bir baş üzerinde durma vakti geldi."
 nav_aragonese_inheritance: "Aragon ile Kan Bağı"
 nav_aragonese_inheritance_desc: "Hanedanımız ve Aragon kraliyet evi aynı ata kanını paylaşır. İki diyarın kaderi hâlâ bir olarak bağlanabilir."
 nav_castilian_question: "Kastilya Meselesi"
 nav_castilian_question_desc: "İber Yarımadası’nın en büyük gücü Kastilya. Onunla ittifak yoluyla bağlanmak mı, yoksa rakip olarak ona karşı durmak mı: bu ilişkinin doğası netleştirilmeli."
 nav_reconquista_legacy: "Reconquista’nın Mirası"
 nav_reconquista_legacy_desc: "İslam güçlerine karşı yüzyıllarca süren mücadelenin hatırası İberya’nın tüm diyarlarının paylaştığı bir gururdur. Krallığımız da o şanın bir payını taşıyor."
 nav_dominate_iberia: "İberya Üzerinde Hâkimiyet"
 nav_dominate_iberia_desc: "Bir zamanlar küçük bir krallık olan Navarra artık İber Yarımadası’nda göz ardı edilemez. Bask tacı tüm yarımadanın kaderini şekillendirecek kadar güçlendi."
 nav_basque_seafarers: "Bask Balıkçıları"
 nav_basque_seafarers_desc: "Bask halkı uzun süredir korkusuz balıkçılar olarak bilinir. Becerileri ve cesaretleri artık devletin bir varlığı olarak kullanılmalı."
 nav_fearless_fishermen: "Korkusuz Denizciler"
 nav_fearless_fishermen_desc: "Bask denizcileri öfkeli kuzey denizlerinden bile korkmaz. Denizcilikleri ve cesaretleri zaten kıta genelinde ünlü."
 nav_transatlantic_whalers: "Atlantik Ötesi Balina Avcıları"
 nav_transatlantic_whalers_desc: "Avlarının peşindeki Bask balina avcılarının gemileri nihayet Atlantik’in ötesine kadar ulaştı. Bu yeni sulardaki faaliyetler krallığa muazzam servet vaat ediyor."
 nav_basque_in_glory: "Bask Şanında"
 nav_basque_in_glory_desc: "Pireneler’in eteklerinde doğan küçük bir krallık kültürde çiçek açtı, Fransa tahtını ele geçirdi ve birleşik İberya’ya İspanya olarak hüküm sürdü. Baskların şanı artık hiç kimse tarafından inkâr edilemez."
 STATIC_MODIFIER_NAME_nav_secure_bayonne_mod: "Bayonne’dan Askerî Tecrübe"
 STATIC_MODIFIER_DESC_nav_secure_bayonne_mod: "Bayonne’un bütünleşmesi kuvvetlerimize muharebe tecrübesi kazandırdı."
 STATIC_MODIFIER_NAME_nav_basque_unity_mod: "Bask Birliği"
 STATIC_MODIFIER_DESC_nav_basque_unity_mod: "Basklar Avrupa’nın en eski halklarından biridir: kökenleri bilinmez ve Hint-Avrupa ailesiyle ilgisiz bir dil konuşurlar. Pireneler’in iki yakasında yaşayan Baskların kültürel birliği hem Fransız hem İspanyol yönetimi altında kendi kimliğini korudu."
 STATIC_MODIFIER_NAME_nav_fueros_and_privileges_mod: "Güvence Altındaki Fuero’lar"
 STATIC_MODIFIER_DESC_nav_fueros_and_privileges_mod: "Fuero’lar (ayrıcalıklar ve örf ve âdet hukuku), Navarra’nın ve Bask ülkesinin geleneksel özerkliğini güvence altına alan bir hukuk sistemidir. Vergilendirme, askerlik hizmeti ve adalet üzerindeki kendi yetkileri daima merkezileştirici Kastilya tacıyla gerilim içindeydi. Bu eşsiz hukuk geleneği Navarra’nın kimliğinin çekirdeğini oluşturur."
 STATIC_MODIFIER_NAME_nav_efficient_administration_mod: "Verimli Yönetim"
 STATIC_MODIFIER_DESC_nav_efficient_administration_mod: "Navarra Krallığı bir mali yönetim makamı olan “Cámara de Comptos”u kurdu ve Fransız tarzı bir idari sistem benimsedi. Fransız kraliyet evi ile uzun bağlarından (Navarra kraliyet ailesi sık sık Fransızlarla evlendi) gelen idari incelik onu İberya’nın diğer krallıklarından ayırdı."
 STATIC_MODIFIER_NAME_nav_renaissance_of_pamplona_mod: "Pamplona’nın Yeni Ruhu"
 STATIC_MODIFIER_DESC_nav_renaissance_of_pamplona_mod: "Rönesans’ın ruhu zanaatlarına yeni giren sanatçıların becerisini yükseltti."
 STATIC_MODIFIER_NAME_nav_foothold_in_france_mod: "Fransa’da Bir Köprübaşı"
 STATIC_MODIFIER_DESC_nav_foothold_in_france_mod: "Navarra Krallığı Pireneler’in kuzeyinde de topraklara sahipti ve merkezi Aşağı Navarra’ydı (bugünün Fransız Bask ülkesi). Tarihsel olarak Navarra kraliyet evi sık sık Fransız kraliyet evine evlendi ve Fransa’da bir tutunak elde tutmak diplomasisinin temeliydi."
 STATIC_MODIFIER_NAME_nav_secure_gascony_mod: "Gaskonya Tacı"
 STATIC_MODIFIER_DESC_nav_secure_gascony_mod: "Tüm Gaskonya’yı güvenceye almak tacın görkemini güçlendirdi."
 STATIC_MODIFIER_NAME_nav_house_of_evreux_mod: "Évreux Hanedanı’nın Prestiji"
 STATIC_MODIFIER_DESC_nav_house_of_evreux_mod: "Fransız kraliyet evi ile sağlam bir ilişki ulusumuzun diplomatik konumunu yükseltti."
 STATIC_MODIFIER_NAME_nav_claim_french_throne_mod: "Navarra ve Fransa’nın İkiz Tacı"
 STATIC_MODIFIER_DESC_nav_claim_french_throne_mod: "Navarra’nın ve Fransa’nın ikiz tacını takmak diyarın görkemini ve yönetiminin istikrarını yükseltti."
 STATIC_MODIFIER_NAME_nav_castilian_question_mod: "Kastilya ile Net Bir İlişki"
 STATIC_MODIFIER_DESC_nav_castilian_question_mod: "Kastilya ile netleştirilmiş bir ilişki ulusumuzun diplomatik konumunu yükseltti."
 STATIC_MODIFIER_NAME_nav_reconquista_legacy_mod: "Reconquista’nın Gururu"
 STATIC_MODIFIER_DESC_nav_reconquista_legacy_mod: "İslam güçlerine karşı mücadelenin hatırası baskın dinimize hoşgörüyü yükseltti."
 STATIC_MODIFIER_NAME_nav_dominate_iberia_mod: "İberya’nın Efendisi"
 STATIC_MODIFIER_DESC_nav_dominate_iberia_mod: "İber yarımadasının küçük bir krallığı olan Navarra’nın Kastilya ve Aragon’un büyük güçlerini aşıp yarımadanın efendisi olması Büyük III. Sancho’nun (saltanatı 1000-1035) kısa süreliğine gerçekleştirdiği hayali hatırlatır. Pirene geçitlerini elde tutmanın coğrafi avantajından tam yararlanarak ulaşılabilen tarihî bir başarıdır."
 STATIC_MODIFIER_NAME_nav_basque_seafarers_mod: "Bask Balıkçılık Geleneği"
 STATIC_MODIFIER_DESC_nav_basque_seafarers_mod: "Balıkçı köylerinin büyümesi her ay kalıcı olarak 5 denizci sağlıyor."
 STATIC_MODIFIER_NAME_nav_fearless_fishermen_mod: "Korkusuz Denizcilerin Morali"
 STATIC_MODIFIER_DESC_nav_fearless_fishermen_mod: "“Bask denizcisi hiçbir fırtınadan korkmaz” Avrupa genelinde bilinen bir sözdü. Biscay Körfezi’nin (Basklar için “bizim denizimiz”) çalkantılı sularında bilenen denizcilik ve cesaret onları Atlantik çağının ön saflarına koydu. İspanyol Armada’sının denizcilerinin çoğu Basklıydı."
 STATIC_MODIFIER_NAME_nav_transatlantic_whalers_mod: "Atlantik Balina Avcılarının Denizciliği"
 STATIC_MODIFIER_DESC_nav_transatlantic_whalers_mod: "Bask balina avcılarının 15. yüzyıldan itibaren Kuzey Amerika’nın Labrador kıyısı açıklarında sağ balinaları avladığı düşünülür. Bir Bask balina avcılığı istasyonunun kalıntıları Kanada’daki Red Bay’de ayakta kalmıştır ve UNESCO Dünya Mirası Listesi’nde yer alır. Bu öncü Atlantik ötesi faaliyet sömürge çağının zeminini hazırladı."
 STATIC_MODIFIER_NAME_nav_third_faction_mod: "Bağımsız Üçüncü Hizbin Kararlılığı"
 STATIC_MODIFIER_DESC_nav_third_faction_mod: "Hiçbir büyük güçle yan yana durmama kararlılığı ordunun morali yükseltti."
 STATIC_MODIFIER_NAME_nav_basque_in_glory_mod: "Bask Şanında"
 STATIC_MODIFIER_DESC_nav_basque_in_glory_mod: "Kültürde, diplomasiye ve yönetimde ustalaşan Bask tacı artık küçük bir krallığın çok ötesinde bir görkem yayıyor. Askerî disiplin ve ağır gemi gücü de kalıcı olarak güçlendirildi."
 nav_events.1.t: "Pamplona Krallığı’nın Kökenleri"
 nav_events.1.d: "Navarra Krallığı 9. yüzyılda Eneko Arista tarafından kurulan Pamplona Krallığı’nın varisidir. Bask Ülkesi merkezli bu hat Karolenj İmparatorluğu’nun bir sınır bölgesi olarak doğdu ve İslam diyarlarının ve Frank krallığının iki büyük gücü arasında kendi rotasını çizmeyi sürdürdü. Şimdi sancağını Pireneler’in eteklerinde bir kez daha yükseltme vakti geldi."
 nav_events.1.a: "Krallığın tarihi yüreğe işlendi"
 nav_events.2.t: "Fransız Tahtı İçin Emel"
 nav_events.2.d: "Hanedanımız Évreux Hanedanı Fransa’nın kraliyet evinin kendisiyle kan paylaşır. Fransa’nın içindeki geniş topraklar güvence altına alındığına göre Navarra Kralı artık veraset üzerindeki hakkını açıkça ileri sürebilir. Bu meşruiyet şimdi hem mahkemede hem savaş alanında kanıtlanmalı."
 nav_events.2.a: "Hak iddiasının davası yükseltildi"
 nav_events.3.t: "Aragon ile Kan Bağı"
 nav_events.3.d: "Navarra ve Aragon kraliyet evleri aynı ata kanını paylaşır. Her iki tahtın varislerinin aynı kişi olması hiç de ender değildir. Hatlardan biri tükenirse iki diyar hâlâ tek bir taç altında birleşmeye mukadder olabilir."
 nav_events.3.a: "Bu akrabalığın anlamı anlaşıldı"
 nav_events.4.t: "Yüz Yıl Savaşları’na Müdahale"
 nav_events.4.d: "Fransa ile İngiltere arasındaki Yüz Yıl Savaşları artık iki ulus arasında basit bir çatışma değil. Hanedanımız Évreux Hanedanı Fransız Capet hattından gelirken İngiliz sarayıyla da derin evlilik bağlarına sahip. Ayrıca Navarra tacının kendisi Fransız veraset yasaları üzerindeki tartışmalarda uzun süredir önemli bir emsal olarak hizmet etti.\\n\\nBu çalkantılı çağda Navarra için üç yol açık duruyor. Biri kan bağları ve köklü dostluk gerekçesiyle Fransa’yı desteklemek. Bir diğeri ticaret çıkarları uğruna ve Kastilya’ya karşı bir kale olarak İngiltere’yi desteklemek. Sonuncusu ise hiçbir büyük güçle yan yana durmayıp bağımsız bir üçüncü hizip olarak kendi çıkarlarımızı gütmek. Bu seçim krallığın kaderine ağır gelecek."
 nav_events.4.a: "Fransa’yı destekle"
 nav_events.4.b: "İngiltere’yi destekle"
 nav_events.4.c: "Savaşa bağımsız bir üçüncü hizip olarak gir"
