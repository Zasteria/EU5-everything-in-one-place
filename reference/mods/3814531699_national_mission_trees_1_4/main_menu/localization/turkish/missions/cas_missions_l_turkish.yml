 STATIC_MODIFIER_NAME_cas_tercio_mod: "Tercio"
 STATIC_MODIFIER_DESC_cas_tercio_mod: "Dünyanın en iyi piyade düzeni olan Tercio, İspanyol ordusunun temeli olur."
 STATIC_MODIFIER_NAME_cas_military_orders_mod: "Askerî Tarikatlar"
 STATIC_MODIFIER_DESC_cas_military_orders_mod: "Santiago, Calatrava ve Alcántara askerî tarikatları İspanyol ordusuna katılır."
 STATIC_MODIFIER_NAME_cas_armada_mod: "Yenilmez Armada"
 STATIC_MODIFIER_DESC_cas_armada_mod: "130 gemilik “Yenilmez Armada” İspanyol deniz gücünün zirvesini temsil eder."
 STATIC_MODIFIER_NAME_cas_conquistadors_mod: "Fatihler"
 STATIC_MODIFIER_DESC_cas_conquistadors_mod: "Cortés ve Pizarro’nun efsanesi yaşıyor: İspanyol fatihler dünyayı kasıp kavurur."
 STATIC_MODIFIER_NAME_cas_siglo_de_oro_mod: "Altın Çağ"
