 STATIC_MODIFIER_NAME_cas_sicily_mod: "Sicilya Krallığı"
 STATIC_MODIFIER_DESC_cas_sicily_mod: "Akdeniz ambarı Sicilya İspanyol yönetimi altında istikrara kavuşur."
 STATIC_MODIFIER_NAME_cas_milan_mod: "Milano Dukalığı"
 STATIC_MODIFIER_DESC_cas_milan_mod: "İtalya Savaşları’nın sonucunda Milano İspanya’nın nüfuz alanına girer."
 STATIC_MODIFIER_NAME_cas_mediterranean_mod: "Akdeniz Hegemonu"
 STATIC_MODIFIER_DESC_cas_mediterranean_mod: "İspanya Akdeniz’in komutasını ele geçirir: antik Roma’dan beri ilk kez deniz tek bir güç tarafından yönetilir."
 STATIC_MODIFIER_NAME_cas_lepanto_mod: "İnebahtı’nın Kahramanı"
 STATIC_MODIFIER_DESC_cas_lepanto_mod: "İnebahtı Muharebesi Osmanlı donanmasını paramparça eder ve Akdeniz’de Hıristiyan üstünlüğünü kurar."
 STATIC_MODIFIER_NAME_cas_ceuta_mod: "Septe Kalesi"
 STATIC_MODIFIER_DESC_cas_ceuta_mod: "Cebelitarık Boğazı’nın kapısı Septe güvence altına alındı: Afrika’ya açılan kapı açılıyor."
 STATIC_MODIFIER_NAME_cas_oran_mod: "Oran’ın Fethi"
