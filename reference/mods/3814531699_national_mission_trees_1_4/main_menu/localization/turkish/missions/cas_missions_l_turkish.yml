 STATIC_MODIFIER_NAME_cas_tunis_mod: "Tunus’a Boyun Eğdirme"
 STATIC_MODIFIER_DESC_cas_tunis_mod: "Tunus’u fetheden İspanya, Kuzey Afrika üstünlüğü için Osmanlı İmparatorluğu’na meydan okur."
 STATIC_MODIFIER_NAME_cas_north_africa_mod: "Kuzey Afrika Üzerinde Egemenlik"
