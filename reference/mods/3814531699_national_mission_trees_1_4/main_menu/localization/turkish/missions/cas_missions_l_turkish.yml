 STATIC_MODIFIER_NAME_cas_rio_salado_mod: "Río Salado’da Zafer"
 STATIC_MODIFIER_DESC_cas_rio_salado_mod: "Merini-Granada koalisyonunun Río Salado’da ezilmesi Reconquista’nın son perdesini açar."
