 STATIC_MODIFIER_NAME_cas_escorial_mod: "El Escorial"
 STATIC_MODIFIER_DESC_cas_escorial_mod: "II. Felipe’nin sarayı, manastırı ve türbesi İspanya İmparatorluğu’nun zirvesini temsil eder."
 STATIC_MODIFIER_NAME_cas_segovia_mod: "Segovya Su Kemeri"
 STATIC_MODIFIER_DESC_cas_segovia_mod: "Roma çağına ait büyük su kemeri onarılıp yükseltildi ve Segovya’nın şehir suyu temini önemli ölçüde iyileşti. Bu su kemeri tüm Kastilya’da su altyapısı için örnek olur."
 STATIC_MODIFIER_NAME_cas_west_africa_mod: "Batı Afrika Ticareti"
 STATIC_MODIFIER_DESC_cas_west_africa_mod: "İspanya, Kanarya Adaları’nı tutunak olarak kullanarak Batı Afrika ticaretine girer."
 STATIC_MODIFIER_NAME_cas_trent_mod: "Trento Konsili"
