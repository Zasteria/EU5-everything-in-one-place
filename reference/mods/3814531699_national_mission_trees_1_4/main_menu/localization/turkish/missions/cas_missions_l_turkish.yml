 STATIC_MODIFIER_NAME_cas_navarre_mod: "Navarra Fethedildi"
 STATIC_MODIFIER_DESC_cas_navarre_mod: "Pireneler kavşağı Navarra güvence altında: kuzey İberya denetimde."
 STATIC_MODIFIER_NAME_cas_salamanca_mod: "Salamanca Üniversitesi"
 STATIC_MODIFIER_DESC_cas_salamanca_mod: "Avrupa’nın en eski üniversitelerinden biri İspanya’nın seçkin bilginlerini ve memurlarını yetiştirir."
 STATIC_MODIFIER_NAME_cas_toledo_dev_mod: "Toledo Çeliği"
