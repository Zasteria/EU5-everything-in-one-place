 STATIC_MODIFIER_NAME_cas_empire_of_sun_final_mod: "Güneşin Batmadığı İmparatorluk"
 STATIC_MODIFIER_DESC_cas_empire_of_sun_final_mod: "İspanya tarihin ilk küresel imparatorluğu olarak tamamlandı: “güneşin batmadığı imparatorluk” adı tarihe ebediyen kazındı."
 STATIC_MODIFIER_NAME_cas_gold_fleet_mod: "Hazine Filoları"
