l_turkish:
 cas_castile_dev_hub: "Taç Şehirlerinin Gelişimi"
 cas_castile_dev_hub_desc: "Kastilya tacının egemenlik alanına ait şehirlerin gelişimini yönet ve krallığın ekonomik temelini güvence altına al."
 cas_granada_dev_hub: "Granada’nın Yeniden Canlanışı"
 cas_granada_dev_hub_desc: "Düşmüş Granada Krallığı’nın şehirlerine, yani Granada’nın kendisine ve Malaga’ya yeni bir refah getir."
 STATIC_MODIFIER_NAME_cas_crown_domains_mod: "Taç Şehirlerinin Gelişimi"
 STATIC_MODIFIER_DESC_cas_crown_domains_mod: "Kralın vergi tahsildarları, taç şehirlerinde yükselen yeni pazarları ve surları gururla denetliyor."
 STATIC_MODIFIER_NAME_cas_granada_dev_mod: "Yeniden Canlanan Granada"
 STATIC_MODIFIER_DESC_cas_granada_dev_mod: "Elhamra’nın pencerelerinden yeni kilise çanlarının sesi vadi boyunca yayılıyor."
 cas_castile_mission_pack: "Kastilya Krallığı’nın Şanı"
 cas_castile_mission_pack_DESCRIPTION:0 "1337’de Kastilya, XI. Alfonso yönetiminde güçlü bir krallıktır. Reconquista neredeyse tamamlanmış durumda; yalnızca Granada kalmış. Granada’nın düşüşü, Aragon ile birleşme, Kolomb’un seferi, fatihler Cortés ve Pizarro ve II. Felipe’nin Güneşin Batmadığı İmparatorluğu. Kastilya’nın tarihinde at koştur."
 cas_castile_mission_pack_CRITERIA_DESCRIPTION:0 "Reconquista’yı tamamla, İspanya’yı kur, bir sömürge imparatorluğu inşa et ve Güneşin Batmadığı İmparatorluğu’nu kur."
 cas_castile_mission_pack_BUTTON_TOOLTIP:0 "Güneşin Batmadığı İmparatorluğu’nu kurmak için görevleri tamamla."
 cas_castile_mission_pack_BUTTON_DETAILS:0 "Granada’nın düşüşünden II. Felipe’nin dünya imparatorluğuna!"
 cas_sword_of_castile: "Kastilya’nın Kılıcı"
 cas_sword_of_castile_desc: "1337: XI. Alfonso Kastilya’yı enerjik biçimde yönetiyor. 1340’taki Río Salado Muharebesi’nde Merinilerin ve Granada’nın birleşik güçlerini yok etti ve son Müslüman gücü İber Yarımadası’ndan atmanın temelini attı. Kastilya ve León tacını yükselt ve Reconquista’nın kılıcını bir kez daha salla."
 cas_secure_castile: "Valladolid’in Genişlemesi"
 cas_secure_castile_desc: "Hem Kastilya’yı hem León’u tamamen denetleyerek Reconquista’nın merkezi üssünü kur."
 cas_fall_of_granada: "Granada’nın Düşüşü"
 cas_fall_of_granada_desc: "2 Ocak 1492: Granada’nın son sultanı Boabdil, “Gözyaşı Tepesi”nde anahtarları Kastilyalı Isabel’e teslim eder. 780 yıl süren Reconquista nihayet tamamlanır."
 cas_conquer_navarre: "Navarra’yı Fethet"
 cas_conquer_navarre_desc: "Pireneler kavşağındaki Navarra Krallığı’nı ele geçirmek Fransa ile sınırı belirler ve kuzey İber hâkimiyetini tamamlar."
 cas_subdue_aragon: "Aragon ile Birleşme"
 cas_subdue_aragon_desc: "Isabel ve Fernando’nun evliliği (1469) Kastilya ve Aragon’un şahsi birliğini yarattı. “Katolik Hükümdarlar” altında İspanya şekilleniyor."
 cas_form_spain: "İspanya’nın Oluşumu"
 cas_form_spain_desc: "İber Yarımadası’nın büyük kısmını birleştiren Kastilya, resmen “İspanya Krallığı”nı ilan eder. Avrupa’nın en büyük gücünün doğuşu."
 cas_conquer_portugal: "Portekiz’in Katılımı"
 cas_conquer_portugal_desc: "1580’de II. Felipe Portekiz tahtını miras aldı: “İber Birliği”. Bu, İspanya’ya Portekiz’in sömürge imparatorluğu üzerinde de denetim verdi."
 cas_iberian_union: "İber Birliği"
 cas_iberian_union_desc: "Tüm İber Yarımadası İspanyol egemenliği altına girer. Atlantik’ten Hint Okyanusu’na, İspanyol ve Portekiz kolonileri dünyayı kaplar."
 cas_holy_brotherhood: "Santa Hermandad"
 cas_holy_brotherhood_desc: "Kraliçe Isabel’in kurduğu Santa Hermandad (Kutsal Kardeşlik), bir kolluk örgütü olarak soyluların gücünü bastırır ve kraliyet otoritesini güçlendirir."
 cas_inquisition: "İspanyol Engizisyonu"
 cas_inquisition_desc: "1478’de Papa IV. Sixtus, Isabel ve Fernando’ya Engizisyon’u kurma yetkisi verdi. Torquemada önderliğindeki engizitörler inancın saflığını korumak için çalışır."
 cas_expulsion_of_jews: "Sürgün Fermanı"
 cas_expulsion_of_jews_desc: "1492 tarihli Elhamra Fermanı: din değiştirmeyi reddeden Yahudilerin İspanya’dan sürülmesi ilan edilir. Bu karar Katolik saflığı korur ama birçok yetenekli tüccarı ve bilgini kaybettirir."
 cas_catholic_monarchs: "Katolik Hükümdarlar"
 cas_catholic_monarchs_desc: "Papa VI. Alexander, Isabel ve Fernando’ya “Katolik Hükümdarlar (Reyes Católicos)” unvanını verir. İspanya Katolik dünyanın koruyucusu olarak tanınır."
 cas_absolute_crown: "Mutlak Monarşi"
 cas_absolute_crown_desc: "Soylu ayrıcalıklarını sınırlamak ve kraliyet gücünü mutlaklaştırmak: İspanya Avrupa’nın ilk modern mutlakiyetçi devletlerinden biri olarak ortaya çıkar."
 cas_cortes: "Kastilya Cortes’i"
 cas_cortes_desc: "Cortes (parlamento), Kastilya’nın geleneksel zümreler meclisidir. Kraliyet otoritesi ile parlamento arasında denge kurmak istikrarlı bir yönetim sistemi kurar."
 cas_leyes_de_indias: "Hint Kanunları"
 cas_leyes_de_indias_desc: "Kolonilerdeki yerli halklara muameleyi düzenleyen Hint Kanunları: Bartolomé de las Casas’ın insani savlarına karşılık olarak çıkarıldı."
 cas_canary_islands: "Kanarya Adaları"
 cas_canary_islands_desc: "Atlantik’teki Kanarya Adaları, Portekiz’le rekabette stratejik bir noktadır. Bu adaları denetlemek İspanya’nın Atlantik genişlemesini başlatır."
 cas_atlantic_exploration: "Atlantik Keşifleri"
 cas_atlantic_exploration_desc: "Portekiz Afrika kıyısı boyunca güneye giderken İspanya Atlantik’in ötesinde batıya yönelir. “Hint Adaları’na batı yolu” hayali gerçek olmak üzere."
 cas_columbus_voyage: "Kolomb’un Seferi"
 cas_columbus_voyage_desc: "3 Ağustos 1492: Kristof Kolomb Palos’tan yola çıkar. Üç gemi, Santa María, Pinta ve Niña, Atlantik’i aşar ve yeni bir dünyanın kapısını açar."
 cas_conquer_caribbean: "Karayipler’i Fethet"
 cas_conquer_caribbean_desc: "Hispaniola’yı (Santo Domingo) üs alarak İspanyol Karayip hâkimiyeti kurulur. Şeker, tütün ve kıymetli madenler İspanya’ya bir zenginlik akışı yaratır."
 cas_conquer_mexico: "Meksika’yı Fethet"
 cas_conquer_mexico_desc: "1519-1521: Hernán Cortés 500 askerle Aztek başkenti Tenochtitlan’ı fethetti. “Yeni İspanya Genel Valiliği” doğar."
 cas_conquer_peru: "Peru’yu Fethet"
 cas_conquer_peru_desc: "Francisco Pizarro 168 adamla İnka İmparatorluğu’nu devirdi: tarihin en şaşırtıcı fetihlerinden biri. And altını ve gümüşü İspanya’ya akar."
 cas_silver_of_potosi: "Potosí Gümüşü"
 cas_silver_of_potosi_desc: "Potosí gümüş madenleri (1545’te keşfedildi, 4.000 m rakım) Avrupa tarihinin en büyükleridir. “Cerro Rico (Zengin Dağ)”dan çıkan gümüş İspanya İmparatorluğu’nun maliyesini ayakta tutar."
 cas_colonial_empire: "Sömürge İmparatorluğu"
 cas_colonial_empire_desc: "Meksika’dan Peru’ya, Karayipler’den Kuzey Amerika’nın güney kıyısına: İspanyol sömürge ulusları dünyayı kaplar. Fatihlerin başarıları imparatorluğun temelini atar."
 cas_manila_galleon: "Manila Kalyonu"
 cas_manila_galleon_desc: "Manila’nın 1571’de kurulmasının ardından Manila Kalyonu, Acapulco ile Manila arasındaki Pasifik aşırı ticareti tekeline aldı: Asya ipeğini ve porselenini Amerikan gümüşüyle birleştiren dünyanın ilk gerçekten küresel ticaret yolu."
 cas_conquer_naples: "Napoli Krallığı’nı Fethet"
 cas_conquer_naples_desc: "“El Gran Capitán” Gonzalo de Córdoba Fransa’yı yendi ve Napoli’yi ele geçirdi. İspanya’nın İtalya üzerindeki nüfuzu kurulur."
 cas_conquer_sicily: "Sicilya’yı Güvenceye Al"
 cas_conquer_sicily_desc: "Zaten Aragon tacı altındaki Akdeniz ambarı Sicilya, Akdeniz ada denetimini tamamlamak için İspanya İmparatorluğu’na katılır."
 cas_conquer_milan: "Milano’ya Boyun Eğdir"
 cas_conquer_milan_desc: "İtalya Savaşları’nın nihai sonucu olarak Milano Dukalığı İspanyol egemenliğine girer. Tüm İtalya yarımadası İspanya’nın nüfuz alanı olur."
 cas_mediterranean_mastery: "Akdeniz Hâkimiyeti"
 cas_mediterranean_mastery_desc: "Napoli, Sicilya, Sardinya, Milano: İspanya’nın Akdeniz imparatorluğu kurulur. Antik Roma’dan beri ilk kez Akdeniz tek bir güç tarafından yönetilir."
 cas_battle_of_lepanto: "İnebahtı Muharebesi"
 cas_battle_of_lepanto_desc: "7 Ekim 1571: İspanya, Venedik ve Papa’nın Hıristiyan Birliği filosu Osmanlı donanmasını yok eder. “Kutsal Birlik Zaferi.” Akdeniz’de Hıristiyan üstünlüğü kurulur."
 cas_secure_ceuta: "Septe’yi Güvenceye Al"
 cas_secure_ceuta_desc: "Cebelitarık Boğazı’nın karşısında İber Yarımadası’na bakan Septe, Afrika’nın kapısıdır. Onu denetlemek batı Akdeniz girişini güvence altına alır."
 cas_conquer_oran: "Oran’ı Fethet"
 cas_conquer_oran_desc: "1509’da Kardinal Cisneros Oran’ı fethetti: “Afrika Reconquista’sı”nın ilk adımı. Kuzey Afrika’daki Müslüman güçlere karşı karşı saldırı başlar."
 cas_conquer_tunis: "Tunus’u Fethet"
 cas_conquer_tunis_desc: "1535’te V. Carlos’un İspanyol kuvvetleri Tunus’u fethetti. Kuzey Afrika üstünlüğü için Osmanlı İmparatorluğu ile yarışan İspanya’nın askerî gücü dünyaya gösterilir."
 cas_north_africa_dominion: "Kuzey Afrika Üzerinde Egemenlik"
 cas_north_africa_dominion_desc: "Septe’den Oran’a Kuzey Afrika Akdeniz kıyısı İspanyol egemenliğine girer. Müslüman korsanlık ortadan kalkar ve Akdeniz ticareti istikrar kazanır."
 cas_dev_sevilla: "Hint Adaları’na Açılan Kapı"
 cas_dev_sevilla_desc: "Guadalquivir üzerindeki Sevilla: kadim şehir Yeni Dünya ticaretinin tekel kapısı olarak çiçeklenir. “Casa de Contratación” onu dünyanın en büyük ticaret şehrine dönüştürür."
 cas_casa_de_contratacion: "Casa de Contratación"
 cas_casa_de_contratacion_desc: "1503’te Sevilla’da kurulan Casa de Contratación (Ticaret Evi), İspanyol sömürge ticaretini tekelci biçimde yönetir. Yeni Dünya ile tüm ticaret buradan geçer."
 cas_dev_toledo: "Toledo Kılıç Sanayisi"
 cas_dev_toledo_desc: "Toledo, Kastilya’nın tarihî başkentidir ve kılıçları, kuyumculuğu ve ipeğiyle ünlü sanayi şehridir. “Toledo çeliği”nin şöhreti dünyaya yayılır."
 cas_dev_madrid: "Başkent Olarak Madrid"
 cas_dev_madrid_desc: "1561’de II. Felipe Madrid’i kalıcı başkent ilan etti: sarayın daha önce şehirden şehre taşındığı İspanya için devrim niteliğinde bir değişiklik. Madrid’in nüfusu patlama yapar."
 cas_dev_burgos: "El Cid’in Şehri"
 cas_dev_burgos_desc: "Burgos, “El Cid’in Şehri”: Kastilya’nın tarihî başkenti, kuzey Avrupa’ya yün ticareti ihracatıyla gelişir."
 cas_trade_network: "İmparatorluk Ticaret Ağı"
 cas_trade_network_desc: "Sevilla’dan Manila’ya, Anvers’ten Yeni Dünya’ya: İspanya’nın imparatorluk ticaret ağı dünyayı kaplar."
 cas_tercio: "Tercio (İspanyol Karesi)"
 cas_tercio_desc: "16. yüzyılın en büyük taktiği: Tercio, mızraklıları, tüfekçileri ve kılıç ustalarını bir piyade düzeninde birleştirir. “İspanyol piyadesi dünyanın en güçlüsüdür” savaş alanında kanıtlanır."
 cas_military_orders: "Askerî Tarikatlar"
 cas_military_orders_desc: "Santiago, Calatrava ve Alcántara olmak üzere üç Askerî Tarikat: Katolik Hükümdarlar döneminde varlıkları ve yetkileri askerî gücü desteklemek üzere kraliyet denetimi altına alınır."
 cas_grande_armada: "İspanyol Armada’sı"
 cas_grande_armada_desc: "1588’de II. Felipe, İngiltere’nin fethi için 130 gemilik büyük bir filo, “La Armada”yı gönderdi: İspanyol deniz gücünün zirvesini simgeler."
 cas_conquistadors: "Fatihler (Conquistadorlar)"
 cas_conquistadors_desc: "Cortés, Pizarro, Balboa, de Soto: fatihlerin isimleri tarihe kazınmıştır. Az sayıda askerle uçsuz bucaksız imparatorlukları fethederek İspanyol askerî teknolojisinin üstünlüğünü dünyaya gösterdiler."
 cas_salamanca_university: "Salamanca Üniversitesi"
 cas_salamanca_university_desc: "1218’de kurulan Salamanca Üniversitesi, Avrupa’nın en eski üniversitelerinden biridir. İlahiyat, hukuk ve tıbbın en iyi kurumu olarak İspanya İmparatorluğu’nun bürokratlarını, din adamlarını ve bilginlerini yetiştirir."
 cas_siglo_de_oro: "Altın Çağ (Siglo de Oro)"
 cas_siglo_de_oro_desc: "Cervantes, Lope de Vega, Velázquez, El Greco: 16.-17. yüzyılların İspanyol kültürel altın çağı çiçek açar. İspanya edebiyatta, tiyatroda ve resimde Avrupa’ya öncülük eder."
 cas_escorial: "El Escorial"
 cas_escorial_desc: "II. Felipe’nin 1563’te inşasını emrettiği El Escorial manastır-sarayı: saray, manastır ve türbeyi birleştiren bu anıtsal yapı İspanya İmparatorluğu’nun zirvesini simgeler."
 cas_dev_granada_city: "İspanya’nın Mücevheri"
 cas_dev_granada_city_desc: "Elhamra Sarayı’nın yurdu Granada, Müslüman kültür mirasının nefes aldığı bir şehirdir. Bu “İspanya’nın mücevheri”ni güneyin kültür ve ekonomi merkezi olarak geliştir."
 cas_dev_cordoba: "Kurtuba Deri Şöhreti"
 cas_dev_cordoba_desc: "Mezquita’sıyla ünlü Kurtuba, bir zamanlar Emevî Halifeliği’nin başkenti ve dünyanın en büyük şehriydi. Bu mirastan yararlanarak onu kültür ve ilim merkezi olarak geliştir."
 cas_inherit_flanders: "Flandre’ı Miras Al"
 cas_inherit_flanders_desc: "Flandre, Burgonya mirasının bir parçası olarak İspanya’ya katıldı. Anvers, Brugge ve Gent’in zengin tekstil şehirleri İspanya İmparatorluğu’nun maliyesini destekler."
 cas_revolt_of_flanders: "Flandre’ı Yatıştır"
 cas_revolt_of_flanders_desc: "Flaman direnişini bastır ve bu müreffeh bölgeyi İspanya İmparatorluğu’nun istikrarlı bir parçası olarak bütünleştir."
 cas_greatest_power: "Batmayan İmparatorluğun Temeli"
 cas_greatest_power_desc: "Sömürge imparatorluğu, Tercio’lar ve Armada: üç sütun tamamlandı ve İspanya benzeri görülmemiş bir refah zirvesine ulaştı. Güneşin Batmadığı İmparatorluk’a doğru son adımı atmanın tam vakti."
 cas_empire_of_the_sun: "Güneşin Batmadığı İmparatorluk"
 cas_empire_of_the_sun_desc: "“İmparatorluğumda güneş asla batmaz”: V. Carlos’un sözleri gerçek oluyor. İspanya’dan Napoli’ye, Flandre’dan Yeni Dünya’ya, Manila’dan Karayipler’e: İspanyol bayrağı yeryüzünün her yerinde dalgalanıyor."
 cas_battle_rio_salado: "Río Salado’da Zafer"
 cas_battle_rio_salado_desc: "1340’taki Río Salado Muharebesi’nde XI. Alfonso, Merinilerin ve Granada’nın birleşik güçlerini yendi: Reconquista’nın son perdesi açılıyor."
 cas_dev_leon_city: "Eski León Krallığı’nın Şanı"
 cas_dev_leon_city_desc: "Bir zamanlar Reconquista’ya öncülük eden León Krallığı’nın eski başkenti León: tarihinden ve geleneğinden yararlanarak onu geliştir."
 cas_church_reform: "Kilise Reformu"
 cas_church_reform_desc: "Kardinal Cisneros’un önderlik ettiği kilise reformu: manastır disiplinini yeniden kurmak, din adamlarının eğitimini geliştirmek ve yozlaşmayı ortadan kaldırmak İspanya’nın Katolik Kilisesi’ni Avrupa’nın en güçlü manevi otoritesi yapar."
 cas_counter_reformation: "Karşı-Reform"
 cas_counter_reformation_desc: "Loyolalı Ignatius’un kurduğu İsa Cemiyeti: İspanya önderliğindeki Karşı-Reform Protestan tehdidine karşı koyar. Trento Konsili Katolik öğretiyi yeniden teyit eder."
 cas_conquer_cuba: "Küba’yı Fethet"
 cas_conquer_cuba_desc: "1511’de Diego Velázquez Küba’yı fethetti. Havana bir Karayip ticaret merkezi olarak geliştirilir ve Yeni Dünya yollarının kilit limanı olur."
 cas_conquer_florida: "Florida’yı Keşfet"
 cas_conquer_florida_desc: "Juan Ponce de León 1513’te “La Florida (Çiçekler Diyarı)”nı keşfetti: “Gençlik Pınarı” efsanesinin peşinde Kuzey Amerika’nın keşfi başlar."
 cas_conquer_philippines: "Filipinler’i Fethet"
 cas_conquer_philippines_desc: "1565’te Miguel López de Legazpi Filipin Adaları’nı fethetti ve Manila’yı kurdu. İspanya’nın Asya genişlemesi gerçekleşir ve Pasifik aşırı Manila Kalyonu ticareti doğar."
 cas_gold_fleets: "Altın ve Gümüş Filoları"
 cas_gold_fleets_desc: "Potosí gümüşü ve İnka altını: her yıl İspanya’ya doğru yol alan “Hint Adaları Filosu (Flota de Indias)” dünyanın en büyük zenginlik akışını yaratır."
 cas_sardinia: "Sardinya’yı Güvenceye Al"
 cas_sardinia_desc: "Zaten Aragon tacı altındaki Sardinya, batı Akdeniz ada denetimini tamamlamak için İspanya İmparatorluğu’na katılır."
 cas_conquer_tunis_italy: "İtalyan Egemenliğini Kur"
 cas_conquer_tunis_italy_desc: "Napoli, Sicilya, Sardinya, Milano: İtalya Yarımadası’nın başlıca bölgeleri İspanyol egemenliğine girer ve İspanya İmparatorluğu’nun refahına Rönesans zenginliğini ekler."
 cas_garrison_system: "Kale Savunma Ağı"
 cas_garrison_system_desc: "Geniş İspanya İmparatorluğu’nu koruyan bir kale savunma ağı: Flandre’daki Tercio’lar, Napoli’deki kaleler ve Kuzey Afrika’daki presidio’lar imparatorluğun sınırlarını korur."
 cas_dev_cadiz: "Kadim Fenike Limanı"
 cas_dev_cadiz_desc: "Kadim Fenike şehri Kadiz, Atlantik’e uzanan bir yarımadada doğal bir limanın üzerinde yer alır. Hint Adaları ticaretinin kapısı olarak Sevilla’nın yerini alması mukadderdir."
 cas_dev_malaga: "Malaga’yı Geliştir"
 cas_dev_malaga_desc: "Akdeniz kıyısındaki Malaga ipek, şarap ve kuru üzümüyle bilinen bir ticaret şehridir. Granada’nın fethinden sonra hızla gelişir."
 cas_dev_valencia: "Güneşin Şehri"
 cas_dev_valencia_desc: "“Güneşin Şehri” Valensiya, ipek, şeker ve pirinç üreten bir Akdeniz ticaret merkezidir. Aragon tacının büyük şehrini geliştirmek İspanya’nın doğu kıyısına refah getirir."
 cas_dev_zaragoza: "Aragon’un Başkenti"
 cas_dev_zaragoza_desc: "Aragon Krallığı’nın başkenti Zaragoza, Ebro Nehri üzerinde kilit bir ulaşım merkezidir. Onu geliştirmek iç İber ticaretini canlandırır."
 cas_dev_barcelona: "Akdeniz’in Kraliçesi"
 cas_dev_barcelona_desc: "Akdeniz ticaretinin merkezi Barselona: Aragon’un en büyük ticaret şehri olan Katalan başkentini İspanya İmparatorluğu’nun Akdeniz ticaret merkezi olarak geliştir."
 cas_dev_segovia: "Segovya Su Kemeri"
 cas_dev_segovia_desc: "Su kemeri ve kraliyet kalesiyle ünlü Segovya, Kastilya kraliyet gücünün simgesi olarak gelişir."
 cas_west_africa_trade: "Batı Afrika Ticareti"
 cas_west_africa_trade_desc: "Kanarya Adaları’nı tutunak olarak kullanan İspanya, fildişi, altın ve nihayet köle ticareti yolları için Portekiz’le rekabet ederek Batı Afrika ticaretine girer."
 cas_council_of_trent: "Trento Konsili"
 cas_council_of_trent_desc: "Trento Konsili (1545-1563): Katolik öğretiyi yeniden teyit etmek ve Karşı-Reform’un yönergelerini belirlemek için İspanya önderliğinde toplandı. Cizvitler Protestanlığa karşı karşı saldırının ön saflarında yer alır."
 cas_events.20.t: "Granada’nın Düşüşü: Reconquista’nın Tamamlanışı"
 cas_events.20.d: "2 Ocak 1492: Elhamra’nın kapıları açılır ve Granada’nın son sultanı XII. Muhammed (Boabdil), “Gözyaşı Tepesi”nde anahtarları Isabel ve Fernando’ya teslim eder. 780 yıl süren Reconquista nihayet tamamlanmıştır. “Bir erkek gibi savunamadığın şeye şimdi bir kadın gibi ağla”: Boabdil’in annesinin sözleri tarihte kalmıştır."
 cas_events.20.a: "İspanya çok yaşasın! Reconquista tamam! Tanrı’ya ve Bakire Meryem’e şeref!"
 cas_events.30.t: "Katolik Hükümdarlar: Aragon ile Birleşme"
 cas_events.30.d: "Isabel ve Fernando’nun evliliğinden on yıllar sonra Kastilya ile Aragon’un birleşme zamanı geldi. Papa VI. Alexander onlara “Katolik Hükümdarlar (Reyes Católicos)” unvanını verir ve İspanya’nın bir ulus olarak oluşumu gerçeğe dönüşür."
 cas_events.30.a: "Katolik Hükümdarlar çok yaşasın! İspanya tek bir inanç altında birdir!"
 cas_events.50.t: "Kolomb’un Seferi: Yeni Dünya’nın Keşfi"
 cas_events.50.d: "12 Ekim 1492: Kristof Kolomb Bahamalar’daki Guanahani Adası’na ayak basar. Avrupalıların bilmediği bir Yeni Dünya’nın varlığı ortaya çıkar. “Hint Adaları’na (Asya’ya)” ulaştığına inanan Kolomb’un keşfi İspanya’ya hesaplanamaz servet getirecek."
 cas_events.50.a: "Yeni Dünya’ya Tanrı’nın bereketi olsun! İspanya’nın sancağı Atlantik’in öte yakasına!"
 cas_events.99.t: "Güneşin Batmadığı İmparatorluk"
 cas_events.99.d: "“İmparatorluğumda güneş asla batmaz (En mi Imperio nunca se pone el sol)”: V. Carlos’un sözleri gerçek oluyor. İspanya’dan Napoli’ye, Flandre’dan Yeni Dünya’ya, Filipinler’den Karayipler’e İspanyol bayrağı dünyanın her köşesinde dalgalanıyor. II. Felipe’nin saltanatında İspanya İmparatorluğu insanlığın ilk “dünya imparatorluğu” olarak tamamlanır."
 cas_events.99.a: "Güneşin Batmadığı İmparatorluk çok yaşasın! İspanya ilelebet!"
 STATIC_MODIFIER_NAME_cas_reconquista_spirit_mod: "Reconquista Ruhu"
