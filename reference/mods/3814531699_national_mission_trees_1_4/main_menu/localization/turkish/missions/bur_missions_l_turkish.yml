l_turkish:
 bur_crown_of_lothair_mission_pack: "Lothar’ın Tacı"
 bur_crown_of_lothair_mission_pack_DESCRIPTION:0 "1337: Yüz Yıl Savaşları başlıyor. Fransa ile İngiltere arasına sıkışan Burgonya Dukalığı iki tarafı da oynatacak kurnazlığa ve kaynaklara sahip: ve sonunda Büyük Karl’ın mirasçılarının kadim Orta Krallığı Lotaringya’yı diriltecek. Dijon sarayını güvenceye al, Altın Post Tarikatı’nı kur ve Flandre kumaş ticaretine hâkim ol; sonra Flandre’ı, Franche-Comté’yi ve Loren’i yeni bir “Lotaringya Krallığı”nda birleştirmeden önce azami taviz koparmak için İngiltere ile Fransa arasındaki savaşta yol bul."
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION:0 "Burgonya olarak Yüz Yıl Savaşları’nda yol bul, iç düzeni pekiştir ve Lotaringya’yı yeniden kur."
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP:0 "Lothar’ın Tacı’nı sahiplenmek için görevleri tamamla."
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS:0 "İngiltere ile Fransa arasında hayatta kal, sonra ikisini de aş!"
 bur_duchy_of_burgundy: "Dukalığın Emelleri"
 bur_duchy_of_burgundy_desc: "1337: Valois-Burgonya Hanedanı Fransız kraliyet evinin bir yan kolu olarak yükseliyor. İngiltere ile Fransa’yı birbirine oynatan Dukalık Flandre’a, Franche-Comté’ye ve Loren’e genişlemeyi hedefliyor. Yüz Yıl Savaşları bu küçük dukalığın büyük bir güç olması için nesilde bir kez gelen bir fırsat."
 bur_court_of_dijon: "Dijon Sarayı"
 bur_court_of_dijon_desc: "Dijon’daki Burgonya sarayı 15. yüzyıl Avrupası’nın en görkemli saraylarından biriydi. Jan van Eyck ve Rogier van der Weyden Burgonya himayesi altında çalıştı ve dükalık kütüphanesi Fransa’daki herhangi birine rakipti. Bu “avant la lettre Kuzey Rönesansı” Flandre kumaş gelirlerinin ve dükün müsrif emelinin üzerine inşa edilmişti."
 bur_flemish_cloth: "Flandre Kumaş Sanayisi"
 bur_flemish_cloth_desc: "Brugge, Gent ve Ieper üçgeni ortaçağ Avrupası’nın en büyük sanayi bölgesiydi. İngiliz yünü Flandre’a gönderilir, usta zanaatkârlarca ince kumaşa işlenir ve Champagne fuarlarında tüm Avrupa’ya satılırdı. Bu tedarik zinciri Burgonya’nın ekonomik belkemiğiydi."
 bur_golden_fleece: "Altın Post Tarikatı"
 bur_golden_fleece_desc: "1430’da Brugge’de İyi Philippe tarafından kurulan Altın Post Tarikatı Katolik Hıristiyan dünyasının en prestijli şövalye tarikatıydı: üyelik hükümdarlara ve büyük prenslere ayrılmıştı. Iason ve Argonotlar efsanesine dayanan tarikatın nişanı (altın post kolye) 19. yüzyıla kadar en yüce onur olarak kaldı."
 bur_estates_general: "Genel Meclis"
 bur_estates_general_desc: "Her birinin kendi hukuk geleneği olan Flandre’a, Brabant’a ve Franche-Comté’ye hükmeden birleşik bir devlet olarak Burgonya etkili yönetmek için temsilî kurumlara ihtiyaç duydu. Genel Meclis çeşitli bölgeler genelinde üç zümreyi tek bir müzakere çerçevesi altında bir araya getirdi."
 bur_feast_of_pheasants: "Sülün Ziyafeti"
 bur_feast_of_pheasants_desc: "1454’te İstanbul’un düşüşünden sarsılan İyi Philippe Lille’de “Sülün Ziyafeti”ni verdi: ortaçağın en gösterişli ziyafeti. Şövalyeler canlı bir sülünün üzerine haçlı yeminleri etti; Philippe bizzat kralını Kutsal Topraklar’a kadar takip etmeye söz verdi. Haçlı seferi hiç yelken açmadı, ama ziyafet Burgonya’nın Hıristiyan şövalyeliğinin koruyucusu olarak itibarını pekiştirdi."
 bur_balance_of_power: "İki Diyar Arasında"
 bur_balance_of_power_desc: "Burgonya’nın diplomatik dehası dengeleyici konumunda yatıyordu. Feodal hukuk gereği bir Fransız vasalı, doğu toprakları aracılığıyla İmparatorluğa bağlı ve potansiyel bir İngiliz müttefiki olarak Burgonya Yüz Yıl Savaşları’nın terazisini her iki yöne de eğdirebilirdi. Bu koz Burgonya gücünün temeliydi."
 bur_ally_england: "İngiltere ile İttifak"
 bur_ally_england_desc: "1419’da Montereau köprüsünde Korkusuz Jean’ın öldürülmesinden sonra Burgonya ağırlığını İngiltere’nin arkasına koydu. Sonuçta ortaya çıkan Troyes Antlaşması (1420) V. Henry’yi Fransız tacının varisi ilan etti: Burgonya desteği olmadan düşünülemez bir sonuç. Burgonya-İngiliz ittifakı Yüz Yıl Savaşları’nın belirleyici askerî ortaklıklarından biriydi."
 bur_treaty_of_troyes: "Troyes Antlaşması"
 bur_treaty_of_troyes_desc: "Burgonya’nın desteklediği Troyes Antlaşması V. Henry’yi Fransa’nın naibi ve varisi yaptı. Reims’i (Fransız krallarının taç giydiği yer) ve Paris’i (başkent) güvenceye almak Burgonya’yı fiilen Fransa’nın efendisi yapar: İngiliz ittifakının nihai doğrulanması."
 bur_ally_france: "Fransa ile Uzlaşma"
 bur_ally_france_desc: "1435’te Arras Kongresi’nde İyi Philippe taraf değiştirdi: İngiltere’yi terk etti ve VII. Charles ile uzlaştı. Karşılığında Burgonya resmî biat muafiyeti ve stratejik kasabaların devrini aldı. Bu diplomatik piruet Burgonya’yı Yüz Yıl Savaşları’nın nihai galibi yaptı."
 bur_treaty_of_arras: "Arras Ruhu"
 bur_treaty_of_arras_desc: "Arras Antlaşması (1435) Burgonya’nın en büyük diplomatik zaferiydi: VII. Charles kamuya açık bir özür dilemeye aşağılanırken Philippe toprak kazanımları ve feragat edilmiş bir biatla çıktı. Bu nefes alma alanını kullanarak Burgonya Loren’i pekiştirmeye ve Orta Krallık’ı tamamlamaya odaklanabilirdi."
 bur_flanders_in_the_war: "Yüz Yıl Savaşları’nda Flandre"
 bur_flanders_in_the_war_desc: "Flandre Kontluğu Yüz Yıl Savaşları’nın en şiddetle çekişilen topraklarından biriydi. İngiltere Flandre kumaş kasabalarına yün tedarik etti ve orada güçlü bir ekonomik nüfuza sahipti; Flandre şehirleri çoğunlukla Fransa’ya karşı İngiltere’nin yanında yer aldı. Yine de Fransa Flandre Kontu’nu bir vasal olarak talep etti. Flandre kumaş gelirlerine bağımlı Burgonya bu belirleyici bölgeyi yörüngesine çekmek zorundaydı."
 bur_integrate_brabant: "Brüksel’e Giden Yol"
 bur_integrate_brabant_desc: "Brabant’ın ticaret başkenti Anvers 15. yüzyılın sonlarında kuzey Avrupa’nın en büyük ticaret şehri olacaktı. Plantin matbaası, elmas ticareti ve İspanyol gümüş takasları: hepsi burada toplandı. Brabant’ı güvenceye almak Burgonya’nın Düşük Ülkeler üzerindeki hâkimiyetini tamamlar."
 bur_integrate_franche_comte: "Dole’yi Ele Geçir"
 bur_integrate_franche_comte_desc: "Franche-Comté’nin başkenti Dole, Burgonya dükalık hanedanının desteklediği Dole Üniversitesi’ne (1422’de kuruldu) ev sahipliği yaptı. Bu şehri güvenceye almak tüm Franche-Comté’nin etkin denetimi anlamına gelir ve Loren’e giden yolu açar."
 bur_expand_into_lorraine: "Loren’e Genişle"
 bur_expand_into_lorraine_desc: "Nancy Loren Dukalığı’nın başkentiydi. Cüretkâr Charles 1477’de Nancy Muharebesi’nde bu şehre takıntılı olarak öldü: burada oyuncu farklı bir son yazar. Nancy’yi ele geçirmek Lüksemburg’a giden yolu açar ve Düşük Ülkeler ile ana toprakları arasındaki Burgonya koridorunu güvenceye alır."
 bur_crown_of_lothair: "Lothar’ın Tacı"
 bur_crown_of_lothair_desc: "843’te Verdun Antlaşması Ren boyunca Flandre’dan İtalya’ya uzanan Orta Krallık Lotaringya’yı yarattı. 870’te Mersen Antlaşması’yla Fransa ve Almanya tarafından yutulan bu krallık bin yıl boyunca tarihten kayboldu. Şimdi Burgonya Hanedanı onu yeniden kuruyor: Fransa olarak değil, Almanya olarak değil, yepyeni bir şey olarak: Karolenj merkezinin dirilişi."
 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "Dijon Sarayı"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "Dijon’daki Burgonya sarayı Jan van Eyck’i, Rogier van der Weyden’i ve çağın en iyi müzisyenlerini ve şairlerini çekti: onu kuzey Avrupa’nın kültür başkenti ve Batı sanatını dönüştürecek Flandre resim geleneğinin öncüsü yaptı."
 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "Flandre Kumaş Sanayisi"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "Brugge, Gent ve Ieper kumaş üçgeni ortaçağ Avrupası’nın en büyük sanayi ekonomisinin motoruydu. Flandre kumaşları Avrupa genelinde kalitenin ölçütüydü ve bu sanayinin denetimi Burgonya’ya herhangi bir krallıkla boy ölçüşen mali kaynaklar verdi."
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "Altın Post Tarikatı"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "1430’da kurulan Altın Post Tarikatı Hıristiyan dünyasının en seçkin onuruydu: üye listesi Avrupa kraliyetinin bir yoklama defteri gibi okunurdu. Postu vermek Burgonya’ya krallar ve imparatorlar üzerinde diplomatik kaldıraç sağladı."
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "Genel Meclis"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "Burgonya’nın Genel Meclisi Flandre’da, Brabant’ta ve asıl Burgonya’da üç zümreyi tek bir müzakere meclisinde birleştirdi: sonraki Hollanda Cumhuriyeti’ni ve Fransız devrimci organlarını etkileyen erken bir temsilî yönetim modeli."
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "Sülün Yemini"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "Ortaçağın en büyük ziyafetinde İyi Philippe canlı bir sülünün üzerine Osmanlılara karşı bir haçlı seferine önderlik etmeye yemin etti. Yemin hiç yerine getirilmedi, ama gösteri Burgonya’yı Hıristiyan dünyasının başlıca şövalyelik gücü olarak ilan etti ve Papalıkla bağlarını derinleştirdi."
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "İki Diyar Arasında"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "İngiltere ile Fransa arasında dengeleyici olarak oynayan Burgonya iki hükümdardan hiçbirine tam boyun eğmeyi reddeder ve feodal yükümlülüklerinin belirsizliğinden yararlanır. Yüz Yıl Savaşları’nın kaosu iki tarafı da kol mesafesinde tutarken bağımsız askerî güç inşa etmek için mükemmel fırsatı yaratır."
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "İngiliz İttifakı"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "Montereau’dan sonra Burgonya ve İngiltere Yüz Yıl Savaşları’nın en sonuç doğuran askerî ittifakını kurdu. Birlikte Paris’i işgal ettiler ve Valois hattını neredeyse söndürdüler: yalnızca Jeanne d’Arc’ın müdahalesi akışı tersine çevirdi."
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "Troyes Antlaşması"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "Burgonya’nın desteklediği Troyes Antlaşması V. Henry’yi Fransa’nın varisi yaptı: Anglo-Burgonya gücünün zirve noktası. Bu zafer üzerine inşa ederek Burgonya kendini Fransız diyarının gerçek hükümdarı olarak konumlandırıyor."
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "Fransız İttifakı"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "Arras Kongresi (1435) Burgonya’nın diplomatik şaheseriydi: azami kaldıraç anında İngiltere’yi terk etmek ve çaresiz VII. Charles’tan aşağılayıcı tavizler koparmak. Burgonya sonunda Fransız galibin vazgeçilmez ortağı olarak ortaya çıktı."
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "Arras Antlaşması"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "Arras’ta İyi Philippe VII. Charles’tan resmî bir özür koparıp toprak kazandı ve kişisel biat şartından feragat etti. Bu Burgonya’yı nominal olarak Fransız feodal düzeninin içinde kalırken fiilen bağımsız yaptı: mükemmel diplomatik sonuç."
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "Lothar’ın Tacı"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "870’te kaybedilen Lotaringya Krallığı bin yıl sonra yeniden doğdu. Flandre’dan Franche-Comté’ye, Loren’den asıl Burgonya’ya Burgonya Hanedanı Büyük Karl’ın torunlarının elde tutamadığı Orta Krallık’ı bir araya getirdi. Avrupa’nın yeni bir ağırlık merkezi var."
 bur_events.1.t: "Burgonya Dukalığı’nın Emelleri"
 bur_events.1.d: "1337: Yüz Yıl Savaşları’nın ilk atışları çalmak üzere. İngiltere Kralı III. Edward Fransız tahtı üzerindeki hakkını zorluyor: ama Burgonya iki dev arasındaki eşsiz gözetleme noktasından izliyor. Fransız Valois evinin bir yan kolu, ama yine de güçlü Flandre’a, seçkin bir şövalyelik geleneğine ve herhangi bir krallıkla boy ölçüşen gelirlere sahip: Burgonya bu savaşın dönüneceği dayanak noktasıdır. Dijon’daki muhteşem saraydan Brugge’ün ve Gent’in kalabalık kumaş salonlarına kadar Dukalık Avrupa’daki herhangi bir gücün en büyük emellerini barındırıyor. Soru hangi tarafı destekleyeceği: ya da herhangi bir tarafı destekleyip desteklemeyeceği."
 bur_events.1.a: "Burgonya İngiltere ile Fransa arasında kendi yolunu seçecek!"
 bur_events.2.t: "Sülün Ziyafeti"
 bur_events.2.d: "1454’te Lille’de Dük Philippe ortaçağın en olağanüstü ziyafetini verdi. Altın bir tasma takılı canlı bir sülün salona taşındı; huzurunda toplanan Burgonya şövalyeleri Tanrı’ya, Meryem Ana’ya ve sülünün kendisine haçlı yemini etti. Philippe kralını Kutsal Topraklar’a kadar takip etmeye söz verdi. Sahne makineleri yemek masalarında bir şapel, bir gemi ve bir kale ortaya çıkardı. Hokkabazlar, şairler ve müzisyenler dikkat için yarıştı. Haçlı seferi hiç yelken açmadı: ama Avrupa’da hiç kimse Burgonya’nın şövalyelik erdeminin Hıristiyan dünyasındaki başlıca koruyucusu olduğundan şüphe etmedi."
 bur_events.2.a: "Hıristiyan dünyasını savunmak için Tanrı’nın ve Sülün’ün önünde yemin ederiz!"
 bur_events.3.t: "Lothar’ın Tacı"
 bur_events.3.d: "843’te Verdun Antlaşması Büyük Karl’ın imparatorluğunu üç torunu arasında böldü. Ren boyunca Flandre’dan İtalya’ya uzanan orta kısım I. Lothar’a gitti ve “Lotaringya” oldu. 870’te Mersen Antlaşması onu silip Fransa ile Almanya arasında böldü. Bin yıl boyunca Orta Krallık bir hatıradan başka bir şey değildi: Fransa’nın ve İmparatorluğun sınırlarında dolaşan bir hayalet. Şimdi Burgonya Hanedanı kurnazlık ve silahlarla Karolenjlerin elde tutamadığını yeniden inşa etti. Lothar’ın Tacı meşru varisine geçsin."
 bur_council_of_mechelen: "Mechelen Büyük Konseyi"
 bur_council_of_mechelen_desc: "İyi Philippe’in danışmanları Mechelen’de tüm Burgonya topraklarında yargı yetkisi olan bir “Büyük Konsey” kurdu: Flandre’ın, Brabant’ın ve Franche-Comté’nin ayrı hukuk geleneklerinin üzerinde duran bir yüksek mahkeme. Bu gerçek merkezileşmenin kurumsal temel taşıydı."
 bur_siege_of_calais: "Calais Ele Geçirildi"
 bur_siege_of_calais_desc: "Calais İngiltere’nin Fransa anakarasındaki son tutunağıydı: 1347’den 1558’e kadar elde tutuldu. Rodin’in ünlü “Calais Burjuvaları” heykeli kahramanca teslimiyetini anar. Bu stratejik limanı ele geçirmek Burgonya’ya Manş geçişinin denetimini verir ve İngiliz ittifakının değerini azamiye çıkarır."
 bur_hainaut_namur: "Hainaut’yu ve Namur’u Miras Al"
 bur_hainaut_namur_desc: "İyi Philippe 1421’de Namur’u satın aldı ve 1433’te Hainaut’yu miras aldı: Flandre ile Brabant arasındaki kara köprüsünü tamamladı. Tekstil kasabaları ve stratejik nehir geçitleriyle bu kontluklar Burgonya Düşük Ülkeler’inin bağ dokusunu oluşturdu."
 bur_holland_zeeland: "Hollanda ve Zelanda"
 bur_holland_zeeland_desc: "Ringa balıkçılığıyla, Amsterdam gibi yeni ticaret kasabalarıyla ve mükemmel limanlarıyla Hollanda ve Zelanda kontlukları 1428’de İyi Philippe tarafından edinildi. Bu topraklar Hollanda Cumhuriyeti’nin ana toprakları olacaktı; Burgonya altında bir Kuzey Denizi ticaret imparatorluğunun motorudur."
 bur_luxemburg: "Lüksemburg"
 bur_luxemburg_desc: "İyi Philippe 1443’te Habsburg hattından Sigismund’a karşı bir seferden sonra Lüksemburg Dukalığı’nı fethetti. İmparatorluktaki en güçlü kalelerden biri olan Lüksemburg, Burgonya Düşük Ülkeler’inin doğu çıpasıydı: ve Loren’e ve Alsas’a açılan kapı."
 bur_dominate_rhine: "Ren"
 bur_dominate_rhine_desc: "Ren, Roma’dan bugüne Avrupa uygarlığının omurgası oldu. Nehri Düşük Ülkeler’den Alsas’a kadar elde tutmak Büyük Karl’ın ana topraklarını elde tutmaktır: Karolenj imparatorluğunun yönetildiği, katedral şehirlerinin yükseldiği, en büyük ortaçağ ticaret yollarının birleştiği Rheinland."
 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "Mechelen Büyük Konseyi"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "Mechelen’deki Büyük Konsey Burgonya’nın farklı hukuk geleneklerine sahip birleşik bir devleti yönetme sorununa cevabıydı. Flandre, Brabant ve Burgonya hukukunun üzerinde bir yüksek mahkeme yaratarak Philippe’in danışmanları gerçek merkezileşmenin kurumsal temelini inşa etti."
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "Calais Serbest Limanı"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "Manş’ın en dar noktasındaki Calais antik çağdan beri Kuzey Denizi’ni, Baltık’ı ve Akdeniz ticaretini bağlayan başlıca aktarma merkezi olmuştur. İngiltere tam da bu ticari değeri için onu iki yüzyıldan fazla elde tuttu. Burgonya şimdi Calais’i kuzey Avrupa’nın başlıca kumaş ticareti antreposuna dönüştürüyor."
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "Lüksemburg"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "İmparatorluktaki en güçlü konumlardan biri olan kale-dükalık Lüksemburg Burgonya’ya doğu çıpasını verdi. 1443’teki edinilişi Meuse vadisinin kuşatmasını tamamladı ve Loren’e ve Alsas’a giden yolu açtı."
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "Ren"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "Deltadan bağlara kadar Ren artık Burgonya’nın. Karolenj ana topraklarının en büyük nehri, ortaçağ Avrupası’nın ticaret yolu, medeniyet ile orman arasındaki sınır: hepsi tek bir sancak altında."
 bur_join_hre: "Kutsal Roma İmparatorluğu’na Katıl"
 bur_join_hre_desc: "Burgonya’nın Kutsal Roma İmparatorluğu’nun bir prensi olarak resmen tanınma fırsatı var. Çifte bir statü, Fransa’nın vasalı ve imparatorluk prensi, Burgonya’ya eşsiz biçimde güçlü bir diplomatik konum verirdi. 1473’te Cüretkâr Charles Trier’de III. Friedrich ile İmparatorluk içinde “Burgonya Krallığı”na yükseltilmek için müzakere etti: ama İmparator son anda geri çekildi. Şimdi fırsat yeniden geliyor."
 bur_franchecomte_fiefdom: "Franche-Comté ile Evlilik"
 bur_franchecomte_fiefdom_desc: "13. yüzyılda Burgonya Hanedanı evlilik yoluyla Franche-Comté Kontları ile derin bağlar kurdu. Burgonya Dükü IV. Otto, Artois Kontesi Mahaut ile evlendi ve Franche-Comté’nin Burgonya’ya bağlılığını güvenceye aldı. Bu “Özgür Kontluk”un tuz madenleri, demir cevheri ve Dole Üniversitesi onu Burgonya’nın İsviçre’ye ve Loren’e doğru doğu genişlemesi için hayati bir kapı yapar."
 bur_events.4.t: "Kutsal Roma İmparatorluğu"
 bur_events.4.d: "Burgonya daima eşiksel bir konumda durdu: feodal hukuk gereği bir Fransız vasalı, ama doğu toprakları aracılığıyla İmparatorluğa bağlı. İmparator’un lütfu resmî üyeliğe giden yolu açar. 1473’te Cüretkâr Charles Trier’de III. Friedrich ile buluştu ve İmparatorluk içinde “Burgonya Krallığı” statüsü için müzakere etti: ama İmparator şafakta mavnasına binip imzalamadan yelken açtı. Şimdi ilişkiler yeterince sıcakken kapı yeniden açık duruyor."
 bur_events.4.a: "İmparatorluğa katıl ve imparatorluk prensi ol"
 bur_events.4.b: "Şimdilik bağımsızlığımızı koru"
 bur_events.5.t: "Franche-Comté ile Evlilik"
 bur_events.5.d: "13. yüzyılda Burgonya dükü IV. Otto Franche-Comté kont evine evlendi ve bu zengin “Özgür Kontluk”u kan yoluyla Burgonya’ya bağladı. Jura’nın tuz madenleri, demir ocakları, Dole Üniversitesi ve İsviçre’ye ve Loren’e giden yolları denetleyen dağ geçitleri: hepsi nesillerdir Burgonya dünyasının parçası. Evliliğin zaten yarattığını resmîleştirme vakti geldi."
 bur_events.5.a: "Evlilik bağlarını Franche-Comté’yi tımarlı bir tabi olarak almak için kullan"
 bur_events.5.b: "Evlilik bağlarını koru ama özerkliklerine saygı göster"
 bur_events.6.t: "Yüz Yıl Savaşları’nda Flandre"
 bur_events.6.d: "Flandre Kontluğu Yüz Yıl Savaşları’nda eşsiz bir konum işgal eder. Flandre kumaş üretimi İngiliz yünü olmadan işleyemez ve Brugge’ün, Gent’in ve Ieper’in zengin vatandaşları İngiliz ticaret ilişkilerine her şeyden çok değer verir. Fransa Kont’u bir vasal olarak talep eder, ama Flandre’lı kasabalılar Fransız hâkimiyetine direnir ve defalarca İngiltere’nin yanında yer aldı. Flandre’ı Burgonya yörüngesine çekerek dük bu kumaş şehirlerinin servetini kullanabilir. Seçim: Flandre’ı Burgonya tabisi olarak tımarla ya da bağımsızlığına saygı göstererek bağları derinleştir."
 bur_events.6.a: "Flandre’ı Burgonya vasalı olarak al"
 bur_events.6.b: "İttifakı derinleştirirken Flandre bağımsızlığına saygı göster"
 bur_nevers_union: "Nevers ile Birlik"
 bur_nevers_union_desc: "Nevers Kontluğu Flandre’ın güneyinde yer alır ve Burgonya dükalık hanedanıyla tarihî bağları vardır. Flandre elimizde sağlam durduğuna göre Nevers üzerinde bir hak iddiası kurmak Burgonya’nın nüfuz alanını güneye genişletir. Flandre ile Nevers arasındaki topraklar Fransa’ya gelecek genişleme için bir koridor oluşturur."
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "Düşük Ülkeler Birleşti"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "Hollanda’yı, Zelanda’yı, Brabant’ı ve Flandre’ı bağlayan Düşük Ülkeler’in ticaret ağı birleştirildi. Anvers’in ve Amsterdam’ın ticaret gücü sonraki Hollanda Altın Çağı’nın temelini oluşturur."
 bur_events.3.a: "Yeniden kurulan Lotaringya Krallığı olarak yüksel"
 bur_events.3.b: "Burgonya olarak kal ve imparatorluk unvanını sahiplen (statüko)"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "Lotaringya Yeniden Doğdu"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "Orta Francia’nın halefi Lotaringya Krallığı 869’daki çöküşünden altı yüzyıl sonra canlandırıldı. Büyük Karl’ın imparatorluğunun varisi bu krallık Kutsal Roma İmparatorluğu ile Fransa Krallığı arasında duran üçüncü bir imparatorluk gücü olarak tanınıyor."
