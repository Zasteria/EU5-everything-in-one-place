l_turkish:
 byz_restoration_mission_pack: "Roma İmparatorluğu’nun Yeniden Kuruluşu"
 byz_restoration_mission_pack_desc: "İstanbul’u geri al, Anadolu’yu ve Balkanlar’ı yeniden fethet, dört Patrikhane’yi yeniden birleştir, Roma’da zafer kazan ve eski Roma İmparatorluğu’nun azami sınırlarını yeniden kur."
 byz_restoration_mission_pack_BUTTON_TOOLTIP:0 "Roma İmparatorluğu’nun topraklarını yeniden kur."
 byz_restoration_mission_pack_DESCRIPTION:0 "Çöken imparatorluğu kurtar ve eski şanını geri getir. Roma’nın mirasının varisi olarak Doğu’nun ve Batı’nın eski topraklarını bir kez daha imparatorluk sancağı altına al."
 byz_restoration_mission_pack_BUTTON_DETAILS:0 "Bizans İmparatorluğu’nu çöküşün eşiğinden yeniden inşa et ve bir zamanlar Roma’nın yönettiği Akdeniz dünyasını egemenlik alanına geri kat. Renovatio Imperii hayalini gerçek yap!"
 byz_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Bizans olarak eski Roma topraklarını geri al ve Renovatio Imperii’yi gerçekleştir."
 byz_retake_anatolia_west: "Batı Anadolu’yu Geri Al"
 byz_retake_anatolia_west_desc: "Batı Anadolu’da imparatorluk otoritesini yeniden kurmak için İzmir’i geri al."
 byz_retake_anatolia_east: "Doğu Anadolu’yu Geri Al"
 byz_retake_anatolia_east_desc: "Tüm Anadolu’yu imparatorluk denetimine almak için Ankara’yı, Konya’yı ve Sivas’ı fethet. Burada yaşayan Yunan kültürüne mensup halkları yönetmek yeni bir idare yaklaşımı gerektirecek."
 byz_secure_greece: "Yunanistan’ı Yeniden Kur"
 byz_secure_greece_desc: "Atina’yı ve Korint’i geri al ve Hellas’ta Ortodoksluğu ve Yunan kültürünü canlandır."
 byz_balkan_dominance: "Balkan Hâkimiyeti"
 byz_balkan_dominance_desc: "Balkanlar genelinde imparatorluk düzenini yeniden kurmak için Belgrad’ı ve Tırnova’yı fethet."
 byz_invasion_of_syria: "Suriye’nin İstilası"
 byz_invasion_of_syria_desc: "Beş büyük Patrikhane’den biri olan Antakya dahil Suriye topraklarını fethet. Kadim ticaret yolları ve zengin üretim merkezleri İmparatorluğa yeni refah getirecek."
 byz_protect_jerusalem: "Kudüs’ün Korunması"
 byz_protect_jerusalem_desc: "İsa’nın acı çektiği Kutsal Topraklar’ı geri al. Roma İmparatoru’nun Kutsal Yerler’in Koruyucusu olarak bir görevi vardır. Birçok inançtan halkın bu toprakta barış içinde yaşayabilmesi için hoşgörülü bir yönetim kur."
 byz_dominion_of_aegyptus: "Aegyptus Egemenliği"
 byz_dominion_of_aegyptus_desc: "Mısır’ın büyük ilim merkezleri İskenderiye’yi ve Kahire’yi güvenceye al. Nil’in bereketli toprakları İmparatorluğun birçok halkını besleyecek."
 byz_control_aegean: "Ege Hâkimiyeti"
 byz_control_aegean_desc: "Girit’i güvenceye al ve Ege Denizi’ne tam hâkimiyet için güçlü bir donanma inşa et."
 byz_retake_italy_south: "Güney İtalya’yı Geri Al"
 byz_retake_italy_south_desc: "İtalya yarımadasında bir tutunak kurmak için Napoli’yi ve Sicilya’yı geri al."
 byz_reclaim_rome: "Ebedî Şehir’i Geri Al"
 byz_reclaim_rome_desc: "Ebedî Şehir Roma’yı geri al. Roma İmparatorluğu’nun hak sahibi halefinin batı başkentini geri alma vakti geldi."
 byz_iberian_conquest: "İberya’yı Fethet"
 byz_iberian_conquest_desc: "Eski Hispania eyaletini imparatorluğa geri vermek için Toledo’yu ve Kurtuba’yı fethet."
 byz_north_africa: "Kuzey Afrika’yı Geri Al"
 byz_north_africa_desc: "Eski Africa eyaletini imparatorluğa geri vermek için Tunus’u, Trablus’u ve Cezayir’i fethet."
 byz_north_italy: "Kuzey İtalya"
 byz_north_italy_desc: "İtalya yarımadasını Roma adı altında birleştirmek için Venedik’i, Cenova’yı, Milano’yu ve Floransa’yı fethet."
 byz_invasion_of_france: "Fransa’nın İstilası"
 byz_invasion_of_france_desc: "Kuzey İtalya ve İberya elde olduğundan İmparatorluğun gözü Galya’ya döner. Tüm Fransa bölgesini fethet ve İmparatorluğun Batı’daki egemenlik alanını tamamla."
 byz_renovatio_imperii: "Renovatio Imperii"
 byz_renovatio_imperii_desc: "İmparatorluğun yeniden kuruluşu. İberya’dan Galya’ya, Kuzey Afrika’dan İtalya’ya, Küçük Asya’dan Balkanlar’a ve Kutsal Topraklar’a. 1000+ konum ve 2000+ aylık gelir gerektirir."
 byz_events.2.t: "İzmir’in Refahı"
 byz_events.2.d: "İzmir ve batı Anadolu’nun limanları geri alındı. Bu kadim ticaret şehirleri bir kez daha Bizanslı tüccarların egemenlik alanı olur ve Ege ticareti canlanır."
 byz_events.2.a: "İzmir’de ticareti teşvik et"
 byz_events.3.t: "Atina: Hellas’ın Yeniden Kuruluşu"
 byz_events.3.d: "Atina ve Korint geri alındı. Sokrates’in ve Platon’un şehri, Partenon’un durduğu tepe bir kez daha Bizans’ın. Ortodoks manastırlar yeniden inşa edilir ve Yunan ilmi canlanır."
 byz_events.3.a: "Hellas’ta Ortodoksluğu ve Yunan kültürünü yeniden kur"
 byz_events.7.t: "Güney İtalya Geri Alındı"
 byz_events.7.d: "Napoli ve Palermo geri alındı. Bir zamanlar Magna Graecia olarak çiçek açan bu topraklar bir kez daha Roma İmparatorluğu’nun parçası. Akdeniz ticaret serveti imparatorluk hazinesine akar."
 byz_events.7.a: "Güney İtalya’yı imparatorluğa bütünleştir"
 byz_events.8.t: "Ebedî Şehir: Roma’ya Giriş"
 byz_events.8.d: "Yedi tepeli şehir, Petrus ile Pavlus’un şehit düştüğü yer Roma geri alındı. Büyük Konstantin bir zamanlar imparatorluğu buradan yönettiği gibi, bir Roma İmparatoru bir kez daha Roma’da oturuyor. Tarih tam bir daire çizdi."
 byz_events.8.a: "Ebedî Şehir’i batı başkenti yap"
 byz_events.10.t: "Renovatio Imperii"
 byz_events.10.d: "Roma İmparatorluğu’nun yeniden kuruluşu. İberya’dan Küçük Asya’ya, Kuzey Afrika’dan Balkanlar’a, İtalya’dan Kutsal Topraklar’a. Büyük Justinianus’un 527’den 565’e kadar peşinde koştuğu, ortaçağ boyunca hayal edilen şey: Roma İmparatorluğu’nun yeniden kuruluşu nihayet gerçek oldu. Akdeniz bir kez daha Mare Nostrum."
 byz_events.10.a: "Renovatio Imperii’yi dünyaya ilan et"
 byz_renovatio_unlock_tt: "Renovatio Imperii gerçekleştirildi."
 byz_reclaim_bursa: "Bursa’yı Geri Al"
 byz_reclaim_bursa_desc: "Bir zamanlar büyük bir Bizans şehri olan Bursa’yı geri al. İpek Yolu’nun kilit noktasında yer alan bu şehrin gelecekteki sanayisi İmparatorluğun kararına bırakılır."
 byz_avoid_collapse: "Çöküşü Önle"
 byz_avoid_collapse_desc: "İmparatorluk çöküşün eşiğinde sallanıyor. Ama meşruiyet ve iç istikrar korunabilirse yeniden kuruluşa giden yol henüz kapanmadı."
 byz_events.20.t: "Bursa’nın Geleceği"
 byz_events.20.d: "Bursa’nın atölyelerinde zanaatkârlar üretimin yeni rotasını tartışıyor. Şehrin uzun ipek dokuma geleneği üzerine mi inşa etmeli, yoksa daha ince kumaş üretimine mi odaklanmalı? İmparatorluğun kararı şehrin geleceğini şekillendirecek."
 byz_events.20.a: "İpek üretimini teşvik et"
 byz_events.20.b: "İnce kumaş üretimine odaklan"
 byz_events.21.t: "İzmit’in Geleceği"
 byz_events.21.d: "Marmara Denizi’nin güney kıyısındaki kilit şehir İzmit İmparatorluğa döndü. Saray bu şehrin geleceğini hangi sanayinin tanımlaması gerektiğini tartışıyor: silah üretimini teşvik etmek mi, yoksa ipek üretimine başlamak için dut ağaçları dikmek mi."
 byz_events.21.a: "Silah üretimini teşvik et"
 byz_events.21.b: "Dut ağaçları dik ve ipek üretimine başla"
 byz_reclaim_nicomedia: "İzmit’i Geri Al"
 byz_reclaim_nicomedia_desc: "İzmit (Nikomedeia), Marmara Denizi’nin güney kıyısında kilit bir şehirdir. Kaynak üretimini ipeğe çevir ve imparatorluğun ipek ekonomisini yeniden kur. %50+ denetim sağlamak Roma İmparatorluğu’nun yeniden kuruluşunda ilk adımı işaretler."
 byz_orthodox_antioch: "Antakya’yı Ortodokslaştır"
 byz_orthodox_antioch_desc: "Antakya nüfusunun çoğunluğunun Ortodoksluğa geçtiğini doğrula. “Hıristiyan” adının ilk kullanıldığı şehir bir kez daha Ortodoks ışığıyla dolsun."
 byz_orthodox_jerusalem: "Kudüs’ü Ortodokslaştır"
 byz_orthodox_jerusalem_desc: "Kudüs nüfusunun çoğunluğunun Ortodoksluğa geçtiğini doğrula. Kutsal Kabir Kilisesi’nin çanları Ortodoks litürjisiyle çalar."
 byz_orthodox_alexandria: "İskenderiye’yi Ortodokslaştır"
 byz_orthodox_alexandria_desc: "İskenderiye nüfusunun çoğunluğunun Ortodoksluğa geçtiğini doğrula. Kıpti Kilisesi’nin gelenekleri Ortodoks çerçeveye bütünleştirilir."
 byz_orthodox_rome: "Büyük Ayrılığın Sonu"
 byz_orthodox_rome_desc: "Roma nüfusunun çoğunluğunun Ortodoksluğa geçtiğini doğrula. 1054’teki ayrılık sona erer: uzlaşmayla değil, Ortodoksluğun Roma üzerindeki zaferiyle."
 byz_hellenic_athens: "Partenon’un Canlanışı"
 byz_hellenic_athens_desc: "Atina Athena’nın şehridir. Akropolis’te bir kez daha Olimpos tanrılarına adaklar sunuluyor ve Hellen dininin canlanışı burada başlıyor."
 byz_hellenic_corinth: "Korint’teki Poseidon Tapınağı"
 byz_hellenic_corinth_desc: "Korint Kıstağı’ndaki Korint’te iki denizin koruyucusu Poseidon’un bir zamanlar büyük bir tapınağı vardı. Bu tapınağı yeniden kur ve deniz tanrısının lütfunu imparatorluğa çek."
 byz_hellenic_mystras: "Mistra’daki Apollon Tapınağı"
 byz_hellenic_mystras_desc: "Sparta yakınlarındaki Mistra, Mora’nın manevi kalbidir. Apollon’un tapınağını burada yeniden kur ve Delphi kehanetinin hatırasını sürdürerek Sparta’nın cesur ruhunu uyandır."
 byz_hellenic_alexandria: "Serapeum’un Yeniden İnşası"
 byz_hellenic_alexandria_desc: "İskenderiye Serapeum’u bir zamanlar antik dünyanın en büyük tapınaklarından biriydi. Yunan ve Mısır dininin kaynaşmasından doğan Serapis’e adanan bu tapınağı yeniden inşa etmek Mısır’da Hellen dinini kurar ve antik dünyanın bilgeliğini bir kez daha bir araya getirir."
 byz_events.11.t: "Antakya: İlk Kilise’ye Dönüş"
 byz_events.11.d: "“Hıristiyan” adının ilk kullanıldığı Antakya şimdi Ortodoks ışığıyla dolu. Petrus ile Pavlus’un burada yürüttüğü hizmetin hatırası canlanır ve şehir Ortodoksluğun manevi merkezi olarak yeni bir görev üstlenir."
 byz_events.11.a: "Antakya’yı Ortodoks vesayeti altına al"
 byz_events.12.t: "Kudüs: Kutsal Şehir’de Ortodoks Çanları"
 byz_events.12.d: "Tüm Ortodoks müminlerin özlem duyduğu Kutsal Şehir Kudüs bir Ortodoks şehri oldu. Kutsal Kabir Kilisesi bir kez daha Doğu litürjisiyle çınlıyor. Bu salt fetih değil: inancın zaferi."
 byz_events.12.a: "Kutsal Topraklar’ı ilelebet koru"
 byz_events.13.t: "İskenderiye: İlim Şehri’nin Ortodokslaştırılması"
 byz_events.13.d: "Kadim bilginin deposu İskenderiye bir Ortodoks şehri oldu. Kıpti Kilisesi’nin eski gelenekleri daha büyük Ortodoks akıma karışıyor ve Yeni Eflatuncu felsefe ile ilahiyat arasındaki diyalog yeniden çiçek açmaya başlıyor."
 byz_events.13.a: "İskenderiye’yi Ortodoks ilminin şehri olarak geliştir"
 byz_events.14.t: "Büyük Ayrılığın Sonu: Kiliselerin Birliği"
 byz_events.14.d: "Papa IX. Leo ile Patrik Kerularios’un birbirlerini aforoz ettiği 1054’ten beri yüzyıllar geçti. Uzlaşmayla değil, Ortodoksluğun Roma’yı fethiyle Büyük Ayrılık sona eriyor. Roma vatandaşlarının çoğunluğu Ortodoksluğa geçti. Ebedî Şehir Doğu Kilisesi’nin batı sütunu oluyor. Tarih Bizans inancını seçti."
 byz_events.14.a: "Büyük Ayrılığın sonunu dünyaya ilan et"
 byz_events.15.t: "Partenon: Athena’nın Canlanışı"
 byz_events.15.d: "Akropolis’te bir kez daha Athena’ya adaklar sunuluyor. Hıristiyan kilisesine dönüşmüş olan Partenon antik tanrılara bir tapınak olarak yeniden kuruldu. Atinalılar Olimpos tanrılarını adlarıyla çağırıyor ve Hellenizmin ateşi yeniden tutuşuyor."
 byz_events.15.a: "İmparatorluğu Athena’nın koruması altında yönlendir"
 byz_events.16.t: "Korint: Boğazların Poseidon’u"
 byz_events.16.d: "İki denize bakan Korint tepesinde Poseidon’un tapınağı yeniden kuruldu. Kıstağın tanrısı uzun süre tüccarları ve denizcileri korudu. Ayinlerinin yeniden kurulmasıyla Korint bir kez daha Akdeniz ticaretinin manevi merkezi oluyor."
 byz_events.16.a: "Poseidon’un lütfuyla ticareti gelişir"
 byz_events.17.t: "Delos: Işık Tanrısı’nın Doğum Yeri"
 byz_events.17.d: "Apollon ile Artemis’in doğum yeri olarak saygı gören kutsal Ege adası Delos’ta kadim tapınak yeniden inşa edildi. Hacılar ve rahipler Ege’nin dört bir yanından toplanıyor ve antik Yunan aklının ve güzelliğinin ruhu canlanıyor. Plethon’un hayal ettiği Yeni Eflatuncu imparatorluk şekillenmeye başlıyor."
 byz_events.17.a: "İmparatorluğu Delos’un parlaklığıyla aydınlat"
 byz_events.18.t: "Serapeum: Hellen Canlanışı’nın Tamamlanışı"
 byz_events.18.d: "İskenderiye: Serapeum’un bir zamanlar durduğu bu toprakta Hellen tanrılarına inanç geri döndü.\n\nTapınağın yeniden inşası tamamlanınca Olimpos’un tanrıları bir kez daha Nil’in büyük toprağına iniyor. İskenderiyeliler kadim ayinlere yeniden başlıyor ve Serapis’e dualar şafak göğünde yankılanıyor.\n\nBu kutsal canlanış Bizans İmparatorluğu boyunca Hellen inancı dalgaları gönderiyor: yeni dönenler art arda beliriyor, alametlerin gücü artıyor ve dinî nüfuz yükseliyor. Zeus, Apollon, Athena: tüm tanrılar İmparatorluğun yeniden kuruluşunu kutsuyor."
 byz_events.18.a: "Serapeum’u Hellen dünyasının kutsal şehri yap"
 byz_faith_choice: "İnanç Tercihi"
 byz_faith_choice_desc: "Yeni bir fikir çağı doğuyor. Mistra sarayında Yeni Eflatuncu öğretiler tartışılırken İstanbul’da Ortodoks Kilisesi’nin otoritesi sorgulanıyor. İmparatorluk manevi bir kavşakta duruyor."
 byz_faith_orthodox_chosen_tt: "Ortodoksluk seçildi"
 byz_faith_hellenic_chosen_tt: "Helenizm seçildi"
 byz_events.19.t: "İnancın Kavşağı: Ortodoksluk mu Hellenizm mi"
 byz_events.19.d: "Yunanistan geri alındı. Atina Akropolisi’nden uzakta İstanbul görülebiliyor ve antik tapınakların harabeleri Mora’nın zirvelerinde uyuyor. Bizans İmparatorluğu’nun yeniden kuruluşu salt toprakların geri alınması değil: bir ruhun yeniden inşası. İmparatorluk sarayında iki ses yarışıyor. Biri din adamlarına ait: “Biz Mesih’in halkıyız. İmparatorluğu Ortodoks Kilisesi’nin koruyucuları olarak yeniden inşa etmeliyiz.” Diğeri Hellen filozoflarına ait: “Platon’un ve Aristoteles’in topraklarında neden yabancı bir tanrıya tapınalım? Kadim Yunan tanrıları ruhlarımızın gerçek yuvasıdır.”"
 byz_events.19.a: "Ortodoks Kilisesi’ni koru: Doğu geleneğini savun"
 byz_events.19.a.tt: "Ortodoks dinî dalın kilidi açılır. Antakya’yı, Kudüs’ü, İskenderiye’yi ve Roma’yı Ortodokslaştırma görevlerine ilerle."
 byz_events.19.b: "Kadim tanrıları canlandır: Hellen ateşini yeniden tutuştur"
 byz_events.19.b.tt: "Hellen dalının kilidi açılır. İmparatorluk Hellenizme geçer ve Atina’da, Korint’te, Mistra’da ve İskenderiye’de tapınakları yeniden kurma görevleri kullanılabilir olur."
 byz_orthodox_path_start: "Ortodoks Yolu"
 byz_orthodox_path_start_desc: "Ortodoks koruyucusunun yolu açık. Kutsal şehirleri geri almaya ve Ortodokslaştırmaya ilerle."
 byz_hellenic_path_start: "Hellen Yolu"
 byz_hellenic_path_start_desc: "Kadim tanrıların yolu açık. Hellas’ın tapınaklarını yeniden kur ve antik Yunan uygarlığını yeniden inşa et."
 byz_recovery_from_decline: "Gerilemeden Toparlanma"
 byz_recovery_from_decline_desc: "Saray soylularının gücünü dizginle ve tacın otoritesini yeniden kur. İmparatorluk otoritesi toparlandıkça yönetimde istikrar da gelecektir."
 byz_city_the_world_desires: "Dünyanın Arzu Ettiği Şehir"
 byz_city_the_world_desires_desc: "İstanbul yine dünyanın dört bir yanından insanların görmeyi özlediği büyük bir şehre dönüştü. Bu refah kalıcı olsun."
 byz_islamic_heartland: "İslam’ın Kalbi"
 byz_islamic_heartland_desc: "İslam’ın en kutsal iki şehri Mekke ve Medine elimize geçti. İmparatorluk şimdi bu kutsal yerlerin kaderi hakkında tarihî bir karar vermelidir."
 byz_events.22.t: "İslam’ın Kutsal Yerleri"
 byz_events.22.d: "Mekke’nin Kâbe’si ve Medine’nin Peygamber Mescidi: İslam dünyasının en kutsal yerleri artık imparatorluk denetiminde. Ortodoksluğun üstünlüğünü göstermek için yıkılmalı mı, yoksa kabul edilerek İmparatorluğun hacıların servetinden kâr etmesine mi izin verilmeli?"
 byz_events.22.a: "Kutsal yerleri yık"
 byz_events.22.b: "Kutsal yerleri kabul et"
 STATIC_MODIFIER_NAME_byz_anatolia_west: "Batı Anadolu Yeniden Kuruldu"
 STATIC_MODIFIER_DESC_byz_anatolia_west: "Batı Anadolu’nun çeşitli halkları giderek İmparatorluğun kültürüne bütünleştiriliyor."
 STATIC_MODIFIER_NAME_byz_anatolia_east: "Doğu Anadolu"
 STATIC_MODIFIER_DESC_byz_anatolia_east: "Doğu Anadolu’nun çeşitli halkları giderek İmparatorluğun kültürüne bütünleştiriliyor."
 STATIC_MODIFIER_NAME_byz_greece_restored: "Hellas Yeniden Kuruldu"
 STATIC_MODIFIER_DESC_byz_greece_restored: "Atina, Selanik, Mora: antik Yunan uygarlığının ve Bizans Yunan kültürünün ana toprakları. Latin yönetiminden (Atina Frank Dukalığı ve diğerleri), Katalan Birliği’nin yağmasından ve Osmanlı fethinden sonra bu toprakları geri kazanmak, yeniden canlanan “Hellenizm”in bin yıllık hayalinin gerçekleşmesidir."
 STATIC_MODIFIER_NAME_byz_balkan_order: "Balkan Düzeni"
 STATIC_MODIFIER_DESC_byz_balkan_order: "Balkan insan gücü ve askerî gücü pekiştirilir."
 STATIC_MODIFIER_NAME_byz_syria_province: "Suriye Eyaleti"
 STATIC_MODIFIER_DESC_byz_syria_province: "Suriye antik çağdan beri İpek Yolu’nun batı ucu olarak bir ticaret ve zanaat merkeziydi. Şam çeliği, Halep sabunu, Suriye camı: bu ünlü mallar tüm Akdeniz dünyasına ihraç edildi. 4. ile 7. yüzyıllar arasında aynı zamanda Bizans İmparatorluğu’nun en zengin eyaletiydi ve muazzam vergi geliri getirdi."
 STATIC_MODIFIER_NAME_byz_judaea_province: "Yahudiye Eyaleti"
 STATIC_MODIFIER_DESC_byz_judaea_province: "Kutsal Topraklar’a ev sahipliği yapan Yahudiye’yi yönetmek İmparatorluğun birçok inancına daha fazla hoşgörü kazandırır."
 STATIC_MODIFIER_NAME_byz_aegyptus_province: "Aegyptus Eyaleti"
 STATIC_MODIFIER_DESC_byz_aegyptus_province: "Nil’in bereketli toprakları İmparatorluğun tüm topraklarında daha büyük bir nüfusu beslemesine imkân verir."
 STATIC_MODIFIER_NAME_byz_aegean_mastery: "Ege Hâkimiyeti"
 STATIC_MODIFIER_DESC_byz_aegean_mastery: "Ege adalarının limanlarında imparatorluğun savaş gemileri ve ticaret gemileri durmaksızın demir atıyor ve deniz yeniden “bizim denizimiz” oldu."
 STATIC_MODIFIER_NAME_byz_rome_restored: "Ebedî Şehir Yeniden Kuruldu"
 STATIC_MODIFIER_DESC_byz_rome_restored: "Bizans’ın sancağı bir kez daha yedi tepenin üzerinde dalgalandığında İstanbul sarayı imparatorluğun nihayet zirvesine ulaştığını anladı."
 STATIC_MODIFIER_NAME_byz_hispania_province: "Hispania Eyaleti"
 STATIC_MODIFIER_DESC_byz_hispania_province: "Hispania’nın geniş toprakları imparatorluk ordusunun saflarını şişirmek için çok sayıda asker gönderiyor."
 STATIC_MODIFIER_NAME_byz_gallia_province: "Galya Eyaleti"
 STATIC_MODIFIER_DESC_byz_gallia_province: "Roma kartalları bir kez daha Galya ovalarının üzerinde uçuyor ve Loire kıyılarındaki askerler çok uzaktaki doğu imparatoru için gururla yürüyor."
 STATIC_MODIFIER_NAME_byz_true_rome: "Gerçek Roma"
 STATIC_MODIFIER_DESC_byz_true_rome: "Venedik’in, Cenova’nın ve Milano’nun tüccarlarının yelkenleri ve arabaları artık imparatorun sancağı altında ticaret yapıyor. İtalya yarımadası artık Roma’nın bir dalı değil, gövdesidir."
 STATIC_MODIFIER_NAME_byz_renovatio_imperii_mod: "Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_imperii_mod: "Roma İmparatorluğu tamamen yeniden kuruldu: Justinianus’un hayal ettiği yollar bir kez daha diyarın her köşesini bağlıyor ve imparatorun ulakları Akdeniz’in uzak kıyılarına engelsiz gidiyor."
 STATIC_MODIFIER_NAME_byz_collapse_averted: "Çöküş Önlendi"
 STATIC_MODIFIER_DESC_byz_collapse_averted: "İmparatorluk henüz düşmedi. Krizi atlatan saray, güçlülerin ayrıcalıklarını elinden alma yükünü hafifletiyor ve bu tür reformlara direnci azaltıyor."
 STATIC_MODIFIER_NAME_byz_bursa_silk: "Bursa İpek Ticareti"
 STATIC_MODIFIER_DESC_byz_bursa_silk: "Bursa’nın dut bahçelerinde ipekböceklerinin ilkbahar gecelerinde ördüğü sesler hiç dinmiyor."
 STATIC_MODIFIER_NAME_byz_bursa_fine_cloth: "Bursa İnce Kumaş Ticareti"
 STATIC_MODIFIER_DESC_byz_bursa_fine_cloth: "Bursa atölyelerinin tezgâhlarından saray mensuplarının elde etmek için yarıştığı ince kumaşlar art arda çıkıyor."
 STATIC_MODIFIER_NAME_byz_nicomedia_weaponry: "İzmit Silah Ticareti"
 STATIC_MODIFIER_DESC_byz_nicomedia_weaponry: "İzmit’in demirhanelerinde çekiçler gece gündüz çınlıyor ve imparatorluk ordusu için kılıçlar ve zırhlar yüksekçe yığılıyor."
 STATIC_MODIFIER_NAME_byz_nicomedia_silk: "İzmit İpek Ticareti"
 STATIC_MODIFIER_DESC_byz_nicomedia_silk: "İzmit çevresindeki tepelere genç dut ağaçları dikildi: kasabanın bir ipek yurdu olarak ünleneceği günü bekliyorlar."
 STATIC_MODIFIER_NAME_byz_hellenic_sanctuary: "Hellen Tapınağı"
 STATIC_MODIFIER_DESC_byz_hellenic_sanctuary: "Eski tanrıların tapınağında bir kez daha adaklar bırakılıyor ve hacıların ayakları kaldırım taşlarını aşındırıyor."
 STATIC_MODIFIER_NAME_byz_hellenic_serapeum: "Serapeum"
 STATIC_MODIFIER_DESC_byz_hellenic_serapeum: "Serapeum’un yeniden inşasıyla İskenderiye antik dünyanın manevi merkezi oldu ve bilginler ve hacılar birlikte kapılarının önünde toplanıyor."
 STATIC_MODIFIER_NAME_byz_schism_ended: "Büyük Ayrılığın Sonu"
 STATIC_MODIFIER_DESC_byz_schism_ended: "1054’teki karşılıklı aforozlardan yüzyıllar sonra Doğu ve Batı Kiliseleri Ortodoksluğun zaferiyle nihayet tek bir sunak etrafında toplandı."
 STATIC_MODIFIER_NAME_byz_islamic_sites_destroyed: "Kutsal Yerler Yıkıldı"
 STATIC_MODIFIER_DESC_byz_islamic_sites_destroyed: "İslam’ın kutsal yerlerinin yıkılması Ortodoksluğun üstünlüğünü güçlü biçimde gösterdi ve devlet dinine olan inancı ve İmparatorluğun prestijini güçlendirdi."
 STATIC_MODIFIER_NAME_byz_islamic_sites_accepted: "Kutsal Yerler Kabul Edildi"
 STATIC_MODIFIER_DESC_byz_islamic_sites_accepted: "İslam’ın kutsal yerlerinin kabul edilmesiyle sapkınlara ve putperestlere hoşgörü arttı ve tüccar faaliyeti hacı akışı içinde gelişti."
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "Gerilemeden Toparlanma"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "Gerilemenin karanlık mevsimi geçti ve sabah ışığı yeniden imparatorun sarayına ve imparatorluğun tarım arazilerine vuruyor."
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "Dünyanın Arzu Ettiği Şehir"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "İstanbul İmparatorluğun idari merkezi olarak yeniden inşa edildi."
 STATIC_MODIFIER_NAME_byz_africa_province_mod: "Africa Eyaleti"
 STATIC_MODIFIER_DESC_byz_africa_province_mod: "İmparatorluk filosu Kartaca limanına döndü ve Justinianus çağının hayali bir kez daha denizin üzerine çiziliyor."
 STATIC_MODIFIER_NAME_byz_renovatio_bonus_mod: "Renovatio Imperii’nin Şanı"
 STATIC_MODIFIER_DESC_byz_renovatio_bonus_mod: "Roma İmparatorluğu’nun yeniden kuruluşu Bizans’ı bir dünya imparatorluğunun efendisi olarak tanıdı."
 STATIC_MODIFIER_NAME_byz_antioch_orthodox_mod: "Antakya’nın Ortodoksluğu"
 STATIC_MODIFIER_DESC_byz_antioch_orthodox_mod: "Antakya bir Ortodoks kutsal yeri olarak yeniden kuruldu ve İmparatorluğun dinî otoritesini yükseltiyor."
 STATIC_MODIFIER_NAME_byz_jerusalem_orthodox_mod: "Kudüs’ün Ortodoksluğu"
 STATIC_MODIFIER_DESC_byz_jerusalem_orthodox_mod: "Kutsal Şehir Kudüs Ortodokslaştırıldı ve putperestlere karşı savaşta avantaj sağlıyor."
 STATIC_MODIFIER_NAME_byz_alexandria_orthodox_mod: "İskenderiye’nin Ortodoksluğu"
 STATIC_MODIFIER_DESC_byz_alexandria_orthodox_mod: "İskenderiye kiliselerinde Ortodoks ilahileri çınlıyor ve pazarlar müminlerin ailelerinden taşıyor."
 STATIC_MODIFIER_NAME_byz_serapeum_restored_mod: "Serapeum Yeniden Kuruldu"
 STATIC_MODIFIER_DESC_byz_serapeum_restored_mod: "İskenderiye Serapeum’u yeniden inşa edildi ve Olimpos’un tanrıları bir kez daha Mısır topraklarına iniyor."
