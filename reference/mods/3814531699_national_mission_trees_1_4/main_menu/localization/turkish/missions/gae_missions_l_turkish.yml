l_turkish:
 gae_gaelic_ireland_mission_pack: "Gal İrlandası’nın Karşı Saldırısı"
 gae_gaelic_ireland_mission_pack_DESCRIPTION:0 "İngiliz egemenliği veba ve Bruce istilası altında sarsılıyor: bir Gal reisi olarak yeniden doğuşa öncülük et, İrlanda’yı birleştirmek için Yüce Kral’ın tahtına talip ol ve sonunda denizi aşıp İngiltere’nin kendisini fethet."
 gae_gaelic_ireland_mission_pack_CRITERIA_DESCRIPTION:0 "Klanı birleştir, tüm İrlanda’nın Yüce Kralı ol ve İngiltere’yi fethet."
 gae_gaelic_ireland_mission_pack_BUTTON_TOOLTIP:0 "Bölünmüş bir klandan İngiltere’yi fetheden bir Yüce Kral’a."
 gae_gaelic_ireland_mission_pack_BUTTON_DETAILS:0 "Gal sancağını Zümrüt Ada’nın üzerinde, hatta denizin ötesinde de yükselt!"
 gae_gaelic_resurgence: "Gal Yeniden Doğuşu"
 gae_gaelic_resurgence_desc: "Kara Ölüm ve Bruce istilasının kaosunda İngiliz sömürge egemenliği sarsılıyor: Gal lordlarının çağı bu adaya yeniden dönüyor."
 gae_brehon_law: "Brehon Hukukunu Koru"
 gae_brehon_law_desc: "Ne Roma’ya ne de İngiliz geleneğine bağlı bir hukuk geleneği olan Brehon Hukuku: bu kadim sistemi yönetimin temeli olarak koru."
 gae_fili_and_bards: "Filí’ler ve Bardlar"
 gae_fili_and_bards_desc: "Klanın tarihini ve soyunu koruyan bilgin şairler olan filí’ler: sanatlarına destek ver ve klanın şerefi nesiller boyu şarkılarda söylensin."
 gae_gallowglass_recruitment: "Gallowglass’ları Topla"
 gae_gallowglass_recruitment_desc: "İskoç adalarının korkunç savaşçıları: bu “gallowglass”ları saflarına kat ve klanın gücünü pekiştir."
 gae_clan_unification: "Klanı Birleştir"
 gae_clan_unification_desc: "Bölünmüş yan kollar ve çekişmeli topraklar: bunları bir araya getir ve reis olarak otoriteni kur."
 gae_lord_of_the_clan: "Klanın Lordu"
 gae_lord_of_the_clan_desc: "Hukuk, şiir, silah ve birleşik bir soy: bunların hepsinin üzerine inşa et ve klanın gerçek lordu ol."
 gae_rout_the_settlers: "Yerleşimcileri Bozguna Uğrat"
 gae_rout_the_settlers_desc: "Sayıları vebayla azalan İngiliz yerleşimciler: bu fırsatı değerlendir ve onları bu topraklardan kov."
 gae_ostmen_towns: "Ostmen Kasabaları"
 gae_ostmen_towns_desc: "Çok önceleri Vikinglerin torunları Ostmen’in kurduğu liman kasabaları: Dublin ve Waterford gibi şehirleri ele geçir."
 gae_resurgence_triumphant: "Zafer Kazanan Yeniden Doğuş"
 gae_resurgence_triumphant_desc: "Yerleşimcilerin bozguna uğratılması ve Ostmen kasabalarının ele geçirilmesi: Gal yeniden doğuşu burada ilk zaferine ulaşıyor."
 gae_ulster_hegemony: "Ulster Üzerinde Hegemonya"
 gae_ulster_hegemony_desc: "O’Neill’lerin ve O’Donnell’lerin kuzey toprağı Ulster: bu bölge üzerinde hegemonya kur."
 gae_connaught_hegemony: "Connaught Üzerinde Hegemonya"
 gae_connaught_hegemony_desc: "Batının yabanıl toprağı Connaught: O’Connor’ların görkeminin varisi olarak bu bölgeyi yönet."
 gae_munster_hegemony: "Munster Üzerinde Hegemonya"
 gae_munster_hegemony_desc: "MacCarthy’lerin ve O’Brien’ların toprağı, güneydeki Munster: bu zengin bölge üzerinde hegemonyayı ele geçir."
 gae_leinster_hegemony: "Leinster Üzerinde Hegemonya"
 gae_leinster_hegemony_desc: "Pale’in hemen sınırındaki Leinster: bu stratejik açıdan hayati bölge üzerinde hegemonya kur."
 gae_high_king_of_ireland: "İrlanda’nın Yüce Kralı"
 gae_high_king_of_ireland_desc: "Tara Tepesi’nde uyuyan kadim Ard Rí, Yüce Kral unvanı: bölünme çağını aş ve bu en şerefli rütbeyi yeniden canlandır."
 gae_conquer_the_pale: "Pale’i Fethet"
 gae_conquer_the_pale_desc: "İngiltere’nin Dublin merkezli son köprübaşı Pale: bu toprağı Gal ellerine geçir."
 gae_expel_the_english: "İngilizleri Kov"
 gae_expel_the_english_desc: "Bu adaya yapışmış İngiliz otoritesinin son kalıntıları: onları tamamen süpür."
 gae_master_of_the_emerald_isle: "Zümrüt Ada’nın Efendisi"
 gae_master_of_the_emerald_isle_desc: "Yüce Kral’ın tahtı, Pale’in fethi ve İngilizlerin tamamen kovulması: İrlanda gerçekten yeniden Gal oldu."
 gae_gaelic_fleet: "Bir Gal Filosu İnşa Et"
 gae_gaelic_fleet_desc: "Denizi aşıp İngiltere’nin kendisine yönelmek için güçlü bir filo inşa et ve gözünü eski istilacıların anavatanına dik."
 gae_invade_wales: "Galler’i İstila Et"
 gae_invade_wales_desc: "Kardeş Kelt kanının toprağı Galler: bu kıyılara çık ve İngiltere’ye doğru bir tutunak edin."
 gae_war_on_england: "İngiltere’ye Savaş"
 gae_war_on_england_desc: "Tarihi tersine çevirme vakti geldi: eski istilacı İngiltere’ye doğrudan meydan oku."
 gae_conquest_of_england: "İngiltere’nin Fethi Tamam"
 gae_conquest_of_england_desc: "Bir zamanlar bu adayı ayaklar altına alanların anavatanı artık bir Gal kralının egemenliği altında yatıyor. Tarih burada tamamen tersine döndü."
 gae_events.1.t: "Yüce Kral Tahta Çıktı"
 gae_events.1.d: "Tara Tepesi’nde, kadim geleneğe uygun olarak yeni bir Yüce Kral ilan edildi. Bölünme çağı burada sona eriyor."
 gae_events.1.a: "Yüce Kral’a şeref!"
 gae_events.2.t: "Zümrüt Ada’nın Efendisi"
 gae_events.2.d: "Pale’in düşmesi ve İngilizlerin tamamen kovulmasıyla bu ada nihayet yeniden gerçekten Gal oldu."
 gae_events.2.a: "İrlanda’ya şeref!"
 gae_events.99.t: "İngiltere’nin Fethi Tamam"
 gae_events.99.d: "Bir zamanlar bu adayı ayaklar altına alan İngiltere’nin anavatanı artık bir Gal kralının tahtı önünde diz çöküyor. Tarih tamamen tersine döndü."
 gae_events.99.a: "Tarih tersine döndü!"
 STATIC_MODIFIER_NAME_gae_resurgence_mod: "Gal Yeniden Doğuşu"
 STATIC_MODIFIER_DESC_gae_resurgence_mod: "Veba yerleşimci nüfusunu seyreltince, bu toprağın dili ve gelenekleri kırsala yeniden yayıldı."
 STATIC_MODIFIER_NAME_gae_brehon_mod: "Brehon Hukuku Korundu"
 STATIC_MODIFIER_DESC_gae_brehon_mod: "Nesiller boyu brehon hukukçularınca aktarılan emsal belleği, yazılı herhangi bir kanundan daha fazla güven uyandırır."
 STATIC_MODIFIER_NAME_gae_bards_mod: "Filí’ler ve Bardlar"
 STATIC_MODIFIER_DESC_gae_bards_mod: "Çırak filí’ler hâlâ yedi yıl boyunca klanın soyunu ve işlerini ezberlemekle geçirir."
 STATIC_MODIFIER_NAME_gae_gallowglass_mod: "Gallowglass’lar Toplandı"
 STATIC_MODIFIER_DESC_gae_gallowglass_mod: "Hebrid’lerden denizi aşıp gelen baltalı savaşçılar artık klanın daimi gücünün çekirdeğini oluşturuyor."
 STATIC_MODIFIER_NAME_gae_clan_mod: "Klan Birleşti"
 STATIC_MODIFIER_DESC_gae_clan_mod: "Evlilik ve anlaşmayla bağlanan komşu reisler artık eski kan davalarının ötesine, ortak düşmana bakıyor."
 STATIC_MODIFIER_NAME_gae_lord_clan_mod: "Klanın Lordu"
 STATIC_MODIFIER_DESC_gae_lord_clan_mod: "Kadim tanistry geleneğiyle seçilen bu reis, artık her yan kolun kılıçlarına komuta ediyor."
 STATIC_MODIFIER_NAME_gae_rout_settlers_mod: "Yerleşimciler Bozguna Uğratıldı"
 STATIC_MODIFIER_DESC_gae_rout_settlers_mod: "Vebayla seyrelen yerleşimcilerin malikâneleri terk edilmiş, birer birer yabaniliğe dönüyor."
 STATIC_MODIFIER_NAME_gae_ostmen_mod: "Ostmen Kasabaları"
 STATIC_MODIFIER_DESC_gae_ostmen_mod: "Norse kanından gelenlerin işlettiği rıhtımlardan deri ve yünle yüklü gemiler durmaksızın yola çıkıyor."
 STATIC_MODIFIER_NAME_gae_triumphant_mod: "Zafer Kazanan Yeniden Doğuş"
 STATIC_MODIFIER_DESC_gae_triumphant_mod: "Yarım yüzyıllık gerilemenin ardından İngiliz kolonisi sadece dar bir kıyı şeridine geri itildi."
 STATIC_MODIFIER_NAME_gae_ulster_mod: "Ulster Üzerinde Hegemonya"
 STATIC_MODIFIER_DESC_gae_ulster_mod: "O’Neill adı altında, kuzeyin dokuz kontluğundan toplanan savaşçılar artık saf tutuyor."
 STATIC_MODIFIER_NAME_gae_connaught_hegemony_mod: "Connaught Üzerinde Hegemonya"
 STATIC_MODIFIER_DESC_gae_connaught_hegemony_mod: "O’Connor kanının varisi olarak, batı ıssızlıklarında yaşayan klanların seferberlik çağrısı doğal bir şey olarak kabul ediliyor."
 STATIC_MODIFIER_NAME_gae_munster_mod: "Munster Üzerinde Hegemonya"
 STATIC_MODIFIER_DESC_gae_munster_mod: "Decies tepelerinden Cork limanına kadar zengin güneyin serveti hazineyi dolduruyor."
 STATIC_MODIFIER_NAME_gae_leinster_mod: "Leinster Üzerinde Hegemonya"
 STATIC_MODIFIER_DESC_gae_leinster_mod: "Gal vergi tahsildarları artık Pale’in hendeğine kadar yürüyüp geliyor."
 STATIC_MODIFIER_NAME_gae_conquer_pale_mod: "Pale Fethedildi"
 STATIC_MODIFIER_DESC_gae_conquer_pale_mod: "Bir zamanlar Dublin Kalesi’nin kulelerinde dalgalanan İngiliz sancağı nihayet indirildi."
 STATIC_MODIFIER_NAME_gae_expel_english_mod: "İngilizler Kovuldu"
 STATIC_MODIFIER_DESC_gae_expel_english_mod: "II. Henry günlerinde başlayan bu ada üzerindeki yabancı egemenlik nihayet tamamen sona erdi."
 STATIC_MODIFIER_NAME_gae_fleet_mod: "Gal Filosu İnşa Edildi"
 STATIC_MODIFIER_DESC_gae_fleet_mod: "Bir zamanlar yalnızca akıncı olarak korkulan Gal denizcileri artık kendilerine ait gerçek bir filoya komuta ediyor."
 STATIC_MODIFIER_NAME_gae_war_england_mod: "İngiltere’ye Savaş"
 STATIC_MODIFIER_DESC_gae_war_england_mod: "Bir buçuk asır önce bu adaya getirdikleri savaş, şimdi kendi topraklarının başına geliyor."
 STATIC_MODIFIER_NAME_gae_high_king_mod: "İrlanda’nın Yüce Kralı"
 STATIC_MODIFIER_DESC_gae_high_king_mod: "Brian Boru günlerinden beri boş duran Ard Rí makamı, Tara Tepesi’nde yeniden efendisini buldu."
 STATIC_MODIFIER_NAME_gae_emerald_isle_mod: "Zümrüt Ada’nın Efendisi"
 STATIC_MODIFIER_DESC_gae_emerald_isle_mod: "Kıyıdan kıyıya, bu adanın hiçbir yerinde yabancı bir görevli kalmadı."
 STATIC_MODIFIER_NAME_gae_conquest_england_mod: "Tarih Tersine Döndü"
 STATIC_MODIFIER_DESC_gae_conquest_england_mod: "Kendini fatih ilan edenlerin bir zamanlar iddia ettiği tahtta artık bir Gal kralı oturuyor."
