l_turkish:
 som_ottoman_mission_pack_desc: "Bir uç beyliğinden dünyanın en güçlü sultanlığına. Anadolu’yu pekiştir, Rumeli’ye geç ve tahtın olacak ebedî şehir İstanbul’u sahiplen."
 som_tur_secure_bursa: "Bursa’yı Güvenceye Al"
 som_tur_secure_bursa_desc: "Osmanlıların ilk büyük şehri Bursa, hanedanın sıkı denetimi altında olmalıdır. Düzeni sağla ve kalıcı bir devletin temelini at."
 som_tur_frontier_warriors: "Uç Savaşçılarını Demirle"
 som_tur_frontier_warriors_desc: "Beyliğimizi yoktan var eden gazi savaşçılar hanedana bağlanmalıdır. Onların savaş ruhu en büyük silahımızdır."
 som_tur_cross_the_straits: "Boğazları Geç"
 som_tur_cross_the_straits_desc: "Çanakkale’yi güvenceye al ve Avrupa’ya giden yolu aç. Ödül olarak Gelibolu eyaletini fethetmek için bir savaş gerekçesi verilecektir."
 som_tur_anatolian_heartland: "Anadolu’yu Pekiştir"
 som_tur_anatolian_heartland_desc: "Ankara’yı güvenceye al ve onun Anadolu’nun kalbi olarak gelişiminin rotasını belirle. Bu toprağın neler üreteceği İmparatorluğun geleceğini şekillendirecek."
 som_ottoman_events.18.t: "Anadolu’nun Kalbi: Ankara’nın Geleceği"
 som_ottoman_events.18.d: "Anadolu’nun merkez şehri Ankara İmparatorluğun denetimine girdi. Saray, bu bölgenin geleceğini hangi sanayi dalının belirlemesi gerektiğini tartışıyor: uzun dokumacılık geleneğini inceltmek, ipek üretimi için dut ağaçları dikmek ya da canlı boya bitkileri yetiştirmek."
 som_ottoman_events.18.a: "Dokumacılık sanayisini daha da geliştir"
 som_ottoman_events.18.b: "Dut ağaçları dik ve ipek üretimine başla"
 som_ottoman_events.18.c: "Boya bitkisi yetiştiriciliğini teşvik et"
 som_tur_vassalize_beyliks: "Beyliklerin Fethi"
 som_tur_vassalize_beyliks_desc: "Diğer Anadolu beylikleri diz çökmeli ya da ezilmelidir. Doğunun ve batının güçlerine ancak birleşik bir Anadolu meydan okuyabilir."
 som_tur_siege_constantinople: "İstanbul’un Fethi"
 som_tur_siege_constantinople_desc: "Doğu Roma İmparatorluğu’nun makamı olan ebedî şehir Osmanlı topuna ve çeliğine yenilmelidir. Fethi imparatorluğumuzu dünyaya ilan edecek. Şehrin nüfusu Osmanlı yönetimi altında dönüşecektir."
 STATIC_MODIFIER_NAME_som_tur_ghazi_warriors: "Gazi Savaşçılar"
 STATIC_MODIFIER_DESC_som_tur_ghazi_warriors: "“Gazi”, İslam adına inançsızlarla savaşan kişinin unvanıdır. Hanedanın kurucusu Osman Gazi’den itibaren uç savaşçıları bu kutsal görev duygusuyla Bizans’ın zayıflamış sınır topraklarına doğru durmaksızın ilerledi. Bu dinî coşku Osmanlı genişlemesinin manevi motoruydu."
 som_ottoman_events.1.t: "Bursa: Osmanlıların Beşiği"
 som_ottoman_events.1.d: "Bursa, İznik ve İzmit Osmanlı ellerine düştü. Bursa’da Rum Ortodoks, Ermeni, Yahudi ve Türk Müslüman cemaatler yeni hanedanın altında yan yana yaşıyor. Sultan’ın sarayı şimdi bir soruyla karşı karşıya: bu çeşitli halklar Osmanlı devletine nasıl bütünleştirilmeli?"
 som_ottoman_events.1.a: "Onları İslam sancağı ve Türk geleneği altında birleştir"
 som_ottoman_events.1.a.tt: "Bursa’daki birçok nüfus Sünnî Müslümanlığa geçecek ve Türk kültürünü benimseyecek."
 som_ottoman_events.4.t: "İstanbul’un Fethi"
 som_ottoman_events.4.d: "İstanbul düştü. Bizans’ın son imparatoru XI. Konstantinos surlarda savaşırken öldü ve II. Mehmed’in orduları şehre girdi. Bir zamanlar Ayasofya’nın çanlarının çaldığı yerde şimdi ezan yankılanıyor. Sultan şehrin adını Kostantiniyye olarak değiştirir ve onu yeni imparatorluk başkenti ilan eder."
 som_ottoman_events.4.a: "Şehri bir Osmanlı başkentine dönüştür"
 som_ottoman_events.4.a.tt: "İstanbul’daki nüfusun çoğu Sünnî Müslümanlığa geçecek ve Türk kültürünü benimseyecek."
 som_tur_conquer_bulgaria: "Bulgaristan’ı Fethet"
 som_tur_conquer_bulgaria_desc: "Tırnova, İkinci Bulgar İmparatorluğu’nun şanlı başkentiydi. Bu şehri al ve kuzeye giden yolu aç."
 som_tur_conquer_serbia: "Sırbistan’ı Fethet"
 som_tur_conquer_serbia_desc: "Novo Brdo Balkanlar’ın en büyük gümüş madenlerine sahipken Üsküp Makedonya’nın kapısıdır. Güney Sırbistan’ı Osmanlı denetimine sokmak için her iki şehri de güvenceye al."
 som_tur_conquer_hungary: "Macaristan’ı İstila Et"
 som_tur_conquer_hungary_desc: "Macar sahra ordusunu Mohaç’ta dağıt ve Budin’i işgal et. Tuna Osmanlı İmparatorluğu’nun kuzey sınırı olacak."
 som_tur_siege_vienna: "Viyana Kuşatması"
 som_tur_siege_vienna_desc: "Osmanlı sancağını Viyana surlarının önüne dik. Dünya Osmanlı İmparatorluğu’nun gücüne tanık olacak."
 som_tur_anatolia_unified: "Anadolu Birliği"
 som_tur_anatolia_unified_desc: "Tüm Anadolu’yu Osmanlı yönetimi altına almak için Trabzon’u ve Erzurum’u fethet. Pontus dağları imparatorluğun doğu sınırını belirler."
 som_tur_conquer_syria: "Suriye’ye"
 som_tur_conquer_syria_desc: "Halep’i ve Şam’ı fethet. Suriye İslam ilminin ve ticaretinin kalbidir; ele geçirilmesi imparatorluğun prestijini yükseltir."
 som_tur_defeat_mamluks: "Memlüklüleri Yen"
 som_tur_defeat_mamluks_desc: "Memlüklerle savaştayken, elverişli bir barışı zorlamak için Kahire’yi işgal et. Kahire işgal altındayken Memlükler vasallığı kabul etmeye zorlanabilir."
 som_tur_holy_cities: "Kutsal Şehirler"
 som_tur_holy_cities_desc: "Kudüs’ü güvenceye al ve Sultan’ı Halife ilan et. İki kutsal şehrin hâmisi olarak Osmanlılar İslam dünyasının zirvesinde yer alır."
 som_tur_red_sea_dominance: "Kızıldeniz Hâkimiyeti"
 som_tur_red_sea_dominance_desc: "İskenderiye’yi güvenceye al ve Kızıldeniz ticaret yollarına hâkim ol. Hint Okyanusu ticaretinin zenginliği Osmanlı hazinesini doldurur."
 som_tur_age_of_suleiman: "Pax Ottomana"
 STATIC_MODIFIER_NAME_som_tur_danube_frontier: "Tuna Sınırı"
 STATIC_MODIFIER_DESC_som_tur_danube_frontier: "Tuna kuzey sınırı olarak kuruldu ve Viyana kapılarına dayanan Osmanlı ordusunun dersleri imparatorluk doktrinine kazındı."
 STATIC_MODIFIER_NAME_som_tur_anatolia_unified_mod: "Birleşik Anadolu"
 STATIC_MODIFIER_DESC_som_tur_anatolia_unified_mod: "Trabzon’dan Erzurum’a tüm Anadolu Osmanlı denetiminde. İmparatorluğun doğu temeli güvende; vergi geliri ve meşruiyet iyileşir."
 STATIC_MODIFIER_NAME_som_tur_red_sea_trade: "İmparatorluk Yol Ağı"
 STATIC_MODIFIER_DESC_som_tur_red_sea_trade: "Kızıldeniz, Hindistan’ın ve Güneydoğu Asya’nın baharatlarının, ipeklerinin ve boyalarının Avrupa’ya ulaştığı altın yoldu. Portekiz Afrika’nın güney ucunu dolaşan yeni yolu açtıktan sonra bile Kahire ve İskenderiye üzerinden geçen Kızıldeniz yolu değerini korudu ve Osmanlı İmparatorluğu bu ticaret yolunun en büyük yararlanıcısı oldu."
 som_tur_fate_of_crimea: "Kırım’ın Kaderi"
 som_tur_fate_of_crimea_desc: "Kalbinde Cenevizlilerin Kefe ticaret merkezi bulunan Kırım yarımadası, kuzey Karadeniz boyunca ticareti denetler. Bu bölgeyi güvenceye al ve Karadeniz ticaretini Osmanlı denetimine sok."
 som_tur_black_sea_dominance: "Karadeniz Hâkimiyeti"
 som_tur_black_sea_dominance_desc: "Kırım güvenceye alındığında, Edirne pekiştirildiğinde ve Anadolu birleştiğinde Karadeniz bir Osmanlı gölüne dönüştü. İstanbul’un kaynak seviyesini geliştir ve tam bir Karadeniz hegemonyası kur."
 som_tur_italy_south: "Güney İtalya"
 som_tur_italy_south_desc: "Akdeniz’in merkezini ele geçirmek için Napoli’yi ve Sicilya’yı fethet. Bu kadim ticaret şehirleri imparatorluk hazinesini dolduracak."
 som_tur_italy_north: "İtalya Fethedildi"
 som_tur_italy_north_desc: "İtalya yarımadasının fethini tamamlamak için Roma’yı, Floransa’yı ve Milano’yu fethet. Papa’nın şehri, Medici’lerin şehri, Visconti’lerin şehri: hepsi Sultan’ın olur."
 som_tur_arabia_conquest: "Arabistan Hâkimiyeti"
 som_tur_arabia_conquest_desc: "İslam dünyasının kutsal şehirlerini ve Hint Okyanusu’nun kapısını denetlemek için Mekke’yi, Medine’yi ve Süveyş’i güvenceye al."
 som_tur_persian_gulf: "Basra Körfezi"
 som_tur_persian_gulf_desc: "Hürmüz’ü ele geçir ve Basra Körfezi ticaret yollarına hâkim ol. Hint Okyanusu ticaretinin zenginliği Osmanlı hazinesine akar."
 som_tur_north_africa: "Mağrip"
 som_tur_north_africa_desc: "Güney Akdeniz kıyısını Osmanlı yönetimi altına almak için Tunus’u, Cezayir’i ve Trablus’u fethet. Berberi korsanlar Sultan’ın sancağı önünde eğilir."
 som_tur_morocco: "Fas"
 som_tur_morocco_desc: "Tüm Kuzey Afrika’yı Osmanlı İmparatorluğu’na eklemek için Fes’i ve Marakeş’i fethet. Atlantik kıyıları imparatorluğun batı sınırı olur."
 som_tur_age_of_suleiman_desc: "Kuzeyde Viyana’dan güneyde Arabistan’a ve Fas’a: üç kıtaya yayılan bir dünya imparatorluğu tamamlandı. Viyana Kuşatması’nın, Basra Körfezi’nin ve Fas’ın üçünün de tamamlanmasını gerektirir."
 STATIC_MODIFIER_NAME_som_tur_black_sea_master: "Karadeniz’in Efendisi"
 STATIC_MODIFIER_DESC_som_tur_black_sea_master: "Karadeniz artık bir Osmanlı gölü. Bu başarı ışığında saray yeni yönetim kurumlarının getirilmesini tartışıyor ve yeni bir reforma yer açıyor."
 STATIC_MODIFIER_NAME_som_tur_italy_south_mod: "Güney İtalya Egemenliği"
 STATIC_MODIFIER_DESC_som_tur_italy_south_mod: "Napoli ve Sicilya’yı denetleyerek orta Akdeniz Osmanlı ellerine geçti. Ticaret geliri ve diplomatik itibar iyileşir."
 STATIC_MODIFIER_NAME_som_tur_arabia_mod: "Arabistan’ın Koruyucusu"
 STATIC_MODIFIER_DESC_som_tur_arabia_mod: "“Hâdimü’l-Haremeyn”: Mekke ve Medine İslam’ın en kutsal iki yeridir. 1517’de I. Selim Mısır’ı ve Hicaz’ı fethedip bu yerleri eline aldı ve Osmanlı sultanı tüm Sünnî Müslüman dünyanın dinî koruyucusu oldu. Yıllık hac kafilesini koruma görevi ve şerefi sultana verildi."
 STATIC_MODIFIER_NAME_som_tur_gulf_trade: "Basra Körfezi Ticari Hâkimiyeti"
 STATIC_MODIFIER_DESC_som_tur_gulf_trade: "Hürmüz Boğazı, Hindistan’ın ve Güneydoğu Asya’nın baharat ve ipeklerinin Basra Körfezi’ne geçtiği tek kapıdır. Bu “dünyanın boğazı”na komuta etmek, Portekiz’in Afrika çevresinde kurmaya çalıştığı Hint Okyanusu ticaret yoluna karşı belirleyici koz olurdu."
 STATIC_MODIFIER_NAME_som_tur_africa_final_mod: "Afrika Hegemonyası"
 STATIC_MODIFIER_DESC_som_tur_africa_final_mod: "Kuzey Afrika fethedildi. Çöllerin ve bozkırların seçkin süvarisi Osmanlı ordusuna katılır ve hem hafif hem ağır süvari gücünü artırır."
 STATIC_MODIFIER_NAME_som_tur_ankara_fine_cloth: "Ankara’nın Dokumacılık Ticareti"
 STATIC_MODIFIER_DESC_som_tur_ankara_fine_cloth: "Ankara’nın atölyelerinde geleneksel dokuma teknikleri daha da inceltilir ve ince kumaş üretimi artar."
 STATIC_MODIFIER_NAME_som_tur_ankara_silk: "Ankara’nın İpek Ticareti"
 STATIC_MODIFIER_DESC_som_tur_ankara_silk: "Ankara’nın tarlalarına dut ağaçları dikilir ve ipek üretimi artar."
 STATIC_MODIFIER_NAME_som_tur_ankara_dyes: "Ankara’nın Boya Ticareti"
 STATIC_MODIFIER_DESC_som_tur_ankara_dyes: "Canlı boya bitkilerinin yetiştiriciliği Ankara çevresine yayılır ve boya üretimi artar."
 eyalet: "Eyalet"
 eyalet_desc: "Osmanlı İmparatorluğu’nun taşra tabi devleti. Vasaldan daha sıkı denetime tabidir, çifte haraç öder ve diplomatik ilhaka iki kat hızla tabidir."
 eyalet_plural: "Eyaletler"
 som_ottoman_events.20.t: "Karadeniz Hâkimiyeti"
 som_ottoman_events.20.d: "Karadeniz bir zamanlar bir Ceneviz gölüydü. Ancak 1475’te Kefe’nin düşmesi ve Boğaz’ın Osmanlı denetimine girmesiyle son Ceneviz kalesi ortadan kalktı. Karadeniz artık bir Osmanlı gölü. Doğu Akdeniz üzerindeki üç yüzyıllık Venedik ve Ceneviz ticari hâkimiyeti sona eriyor."
 som_ottoman_events.20.a: "Karadeniz bir Osmanlı gölüdür"
 som_ottoman_events.30.t: "Viyana Kapıları"
 som_ottoman_events.30.d: "Muhteşem Süleyman’ın ordusu Viyana’ya ulaştı. Üç yüz bin Osmanlı askeri tüm Hıristiyan dünyasını sarstı. 1529’da şehir erken gelen kışa ve aşırı uzamış ikmal hatlarına karşı ayakta kalmıştı, ama bu sefer farklı. “Viyana düşerse Avrupa bizimdir”, diye ilan ediyor Sultan."
 som_ottoman_events.30.a: "Viyana’yı ele geçir ve Avrupa’nın efendisi ol"
 som_ottoman_events.99.t: "Süleyman Çağı"
 som_ottoman_events.99.d: "Osmanlı İmparatorluğu zirvesine ulaştı: Muhteşem Süleyman Çağı. Balkanlar’dan Arabistan’a, Kırım’dan Kuzey Afrika’ya Roma’yı bile aşan bir egemenlik tek bir Sultan’ın iradesi önünde eğiliyor. Osmanlı hukukunu kodladığı için “Kanuni” denen Süleyman, imparatorluk tarihinin sanatta, mimaride ve askerî güçte en büyük çiçeklenmesine başkanlık eder. İstanbul’un camileri, sarayları ve çarşıları dünyanın en büyük şehrinin şanını ilan eder. Osmanlı İmparatorluğu tarihin en yüce güçlerinden biri olmuştur."
 som_ottoman_events.99.a: "Büyük Osmanlı İmparatorluğu’nun altın çağı başlıyor"
 som_tur_edirne_capital: "Edirne Kalesi"
 som_tur_edirne_capital_desc: "Kadim Hadrianopolis, I. Murad’ın 1363’te onu Osmanlı başkenti yapmasıyla Edirne oldu: Balkanlar’ı fethetmek için üs. 1453’te İstanbul’un düşmesine kadar yaklaşık doksan yıl imparatorluk başkenti olarak kaldı ve II. Mehmed burada doğdu. Bu şehri Rumeli’nin çıpası ve Balkanlar’ın fethi için sıçrama tahtası olarak tahkim et."
 som_tur_aegean_dominance: "Ege Hâkimiyeti"
 som_tur_aegean_dominance_desc: "Ege, Venedik ve Ceneviz ticari rekabetinin savaş alanıydı. İzmir’i doğu Ege kıyısının temel taşı olarak ele geçirmek ve bir deniz gücü inşa etmek Osmanlılara tüm Akdeniz genişlemesi için tutunak verir. İlk Osmanlı donanması sıfırdan inşa edilmelidir, ama müthiş bir güç hâline gelecektir."
 som_tur_janissary_corps: "Yeniçeri Ocağı"
 som_tur_janissary_corps_desc: "14. yüzyılın ortasında Orhan’ın oğlu I. Murad Yeniçerileri, yani “yeni askerleri” yarattı: devşirme sistemiyle alınan Hıristiyan çocuklardan oluşturulan, İslam’a döndürülen ve Sultan’ın sadık daimi piyadesi olarak eğitilen askerler. Düzenli maaş alan ve sıkı disiplinli Yeniçeriler Osmanlı ordusunun belkemiği oldu ve İstanbul’un fethinde ve sayısız başka savaşta belirleyici rol oynadı."
 som_tur_devshirme_system: "Devşirme Sistemi"
 som_tur_devshirme_system_desc: "Devşirme (“çocuk toplama”), Balkanlar’dan Hıristiyan gençleri alır, İslam’a döndürür ve Yeniçeri ile saray görevlisi olarak eğitirdi. Sistem yalnızca Sultan’a sadık, kabile veya aile bağlılıklarına bağlı olmayan bir görevli sınıfı yarattı. Bu sınıftan imparatorluğun en büyük Sadrazamlarının birçoğu çıktı: esaretten ülkenin en yüksek makamına yükselen adamlar."
 som_tur_elite_guard: "Seçkin Muhafızlar"
 som_tur_elite_guard_desc: "En iyi Yeniçerilerden seçilen Sultan’ın şahsi muhafızları imparatorluğun en disiplinli askerleriydi. Saray nöbetçisi olarak hizmet eder ve seferde imparatorluk sancağını taşırlardı. Sıkı eğitime ve yüksek standartlara yatırım yapmak, imparatorluğu zafere taşıyacak profesyonel bir savaş gücünün çekirdeğini oluşturur."
 som_tur_kanun_i_osmani: "Kanun-ı Osmani"
 som_tur_kanun_i_osmani_desc: "Kanun-ı Osmani (“Osmanlı Kanunnamesi”), şeriatın yanında geliştirilen laik bir hukuk sistemiydi. “Kanuni” (Kanun Koyucu) I. Süleyman kodlamasını tamamladı, ama temelleri 14. ve 15. yüzyıllarda atıldı. Vergi hukukunu, ceza usulünü ve idareyi kapsayan kanun, Osmanlı devletine İslam’ın kutsal hukukunun yanında işleyen ve onu tamamlayan rasyonelleştirilmiş bir hukuk çerçevesi kazandırdı."
 som_tur_imperial_army: "İmparatorluk Ordusu"
 som_tur_imperial_army_desc: "Yeniçeriler, Sipahi süvarisi, Azaplar, Akıncı hafif süvarisi: Osmanlı ordusu, birden fazla birlik türünü merkezî komuta altında bütünleştiren bir birleşik silah sistemiydi. Disiplinli, maaşlı ve giderek barutlu silahlarla donanmış 16. yüzyıl Osmanlı ordusu, dünyanın gördüğü en müthiş savaş makinelerinden biriydi. Onu tam potansiyeline ulaştır."
 som_tur_timar_system: "Tımar Sistemi"
 som_tur_timar_system_desc: "Tımar, Osmanlı devletinin temel toprak tasarruf kurumuydu. Sultan, fethedilen toprağı askerî hizmet karşılığı Sipahi süvarilerine tımar olarak verirdi: Avrupa feodalizmine benzer, ama miras hakkı olmadan. Tımar sistemi imparatorluk hazinesini tüketmeden büyük bir askerî gücü finanse etti ve erken dönem Osmanlı genişlemesini kendi kendini finanse eden bir hâle getirdi."
 som_tur_sipahi_cavalry: "Sipahi Süvarisi"
 som_tur_sipahi_cavalry_desc: "Tımar tahsisleriyle finanse edilen zırhlı süvariler olan Sipahiler, 15. ve 16. yüzyıllarda Osmanlı ordusunun ana vurucu gücünü oluşturdu. Gürleyen hücumları Balkanlar’da ve Anadolu’da korkuyla anılırdı. İmparatorluk genişledikçe Sipahi sınıfı, çıkarlarını Sultan’ın dikkatle yönetmesi gereken güçlü bir taşra aristokrasisi hâline geldi."
 som_tur_eyalet_system: "Eyalet Sistemi"
 som_tur_eyalet_system_desc: "Eyalet (“vilayet”), Osmanlı İmparatorluğu’nun en büyük idari birimiydi ve doğrudan Sultan tarafından atanan bir Beylerbeyi tarafından yönetilirdi. Rumeli, Anadolu, Mısır, Suriye: her eyalet kendi askerî birliği ve idari aygıtıyla küçük bir imparatorluktu. Sistem, Sultan’ın şahsen bulunmasını gerektirmeden imparatorluk otoritesini diyarın en uzak köşelerine taşıdı."
 som_tur_grand_vizier: "Sadrazam"
 som_tur_grand_vizier_desc: "Sadrazam, Sultan’dan sonra imparatorluğun baş yöneticisiydi. Konutu olan “Bâb-ı Âli”, Osmanlı hükümetinin kendisiyle eş anlamlı hâle geldi ve Avrupalı diplomatların itimatnamelerini sundukları adresti. Yetenekli bir Sadrazam imparatorluğu fiilen yönetebilir, Sultan’ın meşruiyete ve askerî komutaya odaklanmasını sağlayabilirdi."
 som_tur_imperial_bureaucracy: "İmparatorluk Bürokrasisi"
 som_tur_imperial_bureaucracy_desc: "Devşirme görevliler ile geleneksel Türk-İslam yöneticilerinin karışımı olan Osmanlı bürokrasisi, çağının en sofistike yönetim sistemlerinden biriydi. Belge kültürü, merkezî kayıt tutma ve uzmanlaşmış kurullar (divanlar) geniş imparatorluğu şaşırtıcı biçimde yönetilebilir kıldı. Osmanlı katiplerinin tuttuğu kayıtların sırf miktarı bugün hâlâ tarihçiler için bir hazine."
 som_tur_new_capital: "Kostantiniyye’nin Geliştirilmesi"
 som_tur_new_capital_desc: "II. Mehmed fethedilen şehri “Kostantiniyye” olarak yeniden adlandırdı ve derhal iddialı bir yeniden geliştirme programı başlattı. Zanaatkârların ve tüccarların zorunlu iskânı, altyapının yeniden inşası ve pazarlarının canlandırılması, harabelerden oluşan bir şehri gelişen bir metropole dönüştürdü. Sultan, Kostantiniyye’nin yerini aldığı Bizans başkentinin şanını aşmasını talep etti ve imparatorluğun tüm kaynaklarını bunu başarmaya yöneltti."
 som_tur_new_capital_unlock_tt: "“Kostantiniyye’nin Yeniden İmarı” kararı artık kullanılabilir."
 som_develop_kostantiniyye_decision.title: "Kostantiniyye’nin Yeniden İmarı"
 som_develop_kostantiniyye_decision.desc: "Fethedilen başkent büyüdü, ancak mahalleleri hâlâ kuşatmanın izlerini taşıyor. Sultanın hazinesi iskânı, yeni pazarları ve yeniden inşa edilen sokakları karşılayabilir; böylece Kostantiniyye yeniden gelişir."
 som_develop_kostantiniyye_decision.a: "Başkentin yeniden inşasına kaynak ayır."
 som_expand_kostantiniyye_decision.title: "Kostantiniyye’yi İhtişama Taşımak"
 som_expand_kostantiniyye_decision.desc: "Yeniden inşa meyvesini verdi: yeni mahalleleri göçmenler ve zanaatkârlar dolduruyor. Atölyelere, kervansaraylara ve şehrin çevresindeki topraklara yapılacak daha büyük yatırımlarla Kostantiniyye, Bizans başkentinin şanını bile aşabilir."
 som_expand_kostantiniyye_decision.a: "Şehrin büyüklüğüne yatırım yap."
 som_tur_grand_bazaar: "Kapalıçarşı"
 som_tur_grand_bazaar_desc: "II. Mehmed’in emriyle 1455 ile 1461 arasında inşa edilen Kapalıçarşı, dünyanın ilk kapalı pazarlarından biriydi ve kısa sürede dünyanın en büyüğü oldu. İpek, baharat, mücevher, seramik ve silah satan dört bin dükkân her gün on binlerce alıcı çekerdi. Merkezinde altın ve gümüş tüccarlarının salonu olan Bedesten, imparatorluğun ticari kalbi olarak hizmet etti."
 som_tur_grand_bazaar_condition_tt: "“Kostantiniyye’yi İhtişama Taşımak” kararı kullanıldı"
 som_tur_suleiman_mosque: "Süleymaniye Camii"
 som_tur_suleiman_mosque_desc: "Usta mimar Sinan tarafından tasarlanan ve 1557’de tamamlanan Süleymaniye Camii, Osmanlı mimarisinin başyapıtıdır. Dört minare İstanbul silüetini deler; geniş kubbe, Boğaz’dan bakıldığında şehrin siluetine hâkimdir. Çevresindeki külliye medreseleri, bir hastaneyi, dükkânları ve bir kervansarayı içeriyordu: şehrin içinde bir şehir, Osmanlı imparatorluk himayesi idealini somutlaştırıyordu."
 som_tur_topkapi_palace: "Topkapı Sarayı"
 som_tur_topkapi_palace_desc: "Boğaz’a, Haliç’e ve Marmara Denizi’ne hâkim burun üzerine kurulan Topkapı Sarayı dört yüzyıl boyunca Osmanlı sarayı olarak hizmet etti. Sultan’ın daireleri, imparatorluk haremi, hazine ve divan salonu (Divan-ı Hümayun) hep dört avlusunun içindeydi. Her Sadrazam burada atandı ve azledildi; her sefer onun gölgesinden başladı."
 som_tur_city_of_worlds_desire: "Dünyanın Arzu Ettiği Şehir"
 som_tur_ulema_authority: "Ulema Otoritesi"
 som_tur_ulema_authority_desc: "Hâkim, hukuk danışmanı ve öğretmen olarak hizmet eden İslam âlimleri olan ulema, Osmanlı devletine dinî meşruiyetini sağladı. Kadı (hâkim), müftü (hukuk danışmanı) ve medrese hocası olarak imparatorluk genelinde adaleti ve eğitimi yürüttüler. Onların onayı, her önemli politikanın, savaş ilanları dahil, Müslüman halk tarafından meşru görülmesi için vazgeçilmezdi."
 som_tur_millet_system: "Millet Sistemi"
 som_tur_millet_system_desc: "Millet (“ulus” veya “cemaat”) sistemi, Osmanlı İmparatorluğu’nun gayrimüslim tebaasını yarı özerk dinî cemaatler olarak örgütledi. Rum Ortodoks Milleti, Ermeni Milleti ve Yahudi Milleti, kendi dinî başkanlarının yönettiği kendi mahkemelerine, okullarına ve hayır kurumlarına sahipti. Bu olağanüstü yönetilen çoğulculuk sistemi, imparatorluğun zorla din değiştirme gerektirmeden muazzam çeşitliliği yönetmesine izin verdi."
 som_tur_kadi_courts: "Kadı Mahkemeleri"
 som_tur_kadi_courts_desc: "Doğrudan Sultan tarafından atanan hâkimler olan kadılar, büyük şehirlerden uzak köylere kadar imparatorluk genelinde İslam hukukunu uyguladı. Mahkeme kayıtları (sicil) yalnızca hukukî anlaşmazlıkları değil, aynı zamanda sözleşmeleri, tapu senetlerini ve toplumsal ilişkileri de belgeleyerek Osmanlı toplumunun olağanüstü ayrıntılı bir portresini oluşturdu. Kadı sistemi hukukun üstünlüğünü, yani Osmanlı hukukunu, diyarın her köşesine taşıdı."
 som_tur_sufi_culture: "Sufi Kültürü"
 som_tur_sufi_culture_desc: "Sufi tarikatlar (tarikatlar) Osmanlı toplumunun dokusuna işlenmişti. Dönen dervişleriyle ünlü Mevlevî tarikatı sarayca himaye edildi. Bektaşî tarikatı Yeniçerilerin manevi belkemiğiydi. Nakşibendî tarikatı saray siyasetinde nüfuzluydu. Sufi mistisizmi Osmanlı şiirini, müziğini ve sanatını şekillendirdi ve İslam’ın legalist yorumuna karşı manevi bir denge unsuru sundu."
 som_tur_cultural_synthesis: "Kültürel Sentez"
 som_tur_cultural_synthesis_desc: "Osmanlı İmparatorluğu fethettiği kültürleri yok etmek yerine özümsedi. Bizans idari sistemleri, Arap ilmi, Fars saray kültürü ve Türk askerî geleneği, kendine özgü bir “Osmanlı uygarlığı” içinde kaynaştı. Bu kültürel sentez yalnızca süs değildi: imparatorluğun yönetici felsefesiydi ve onlarca fethedilmiş halkın enerjisini özümseyip yönlendirmesine olanak verdi."
 som_tur_bursa_silk_industry: "Bursa İpek Sanayisi"
 som_tur_bursa_silk_industry_desc: "İlk Osmanlı başkenti Bursa, 14. yüzyıldan itibaren imparatorluğun ipek başkentine dönüştü. Daha önce Bizans himayesinde çalışmış zanaatkârlar Osmanlı sarayında yeni işverenler buldu ve Avrupa’ya ve Orta Doğu’ya ihraç edilmek üzere lüks ipekler üretti. “İpek Şehri” Bursa’nın kimliği oldu: Osmanlı genişlemesini finanse etmeye yardım eden ticari bir başarı."
 som_tur_silk_road: "İpek Yolu"
 som_tur_silk_road_desc: "Trabzon, Hazar ticaret yolunun batı terminaliydi: Orta Asya’dan ipek, baharat ve lüks malların Anadolu’ya girdiği kanal. Bu liman şehrini denetlemek Osmanlılara Asya ile Avrupa arasındaki kara ticaretinde boğucu bir hâkimiyet verdi. Yalnızca Trabzon’dan geçen ticaretin gelirleri nesiller boyu imparatorluk emellerini finanse etmeye yardım etti."
 som_tur_ankara_prosperity: "Ankara’nın Refahı"
 som_tur_ankara_prosperity_desc: "Ankara, binlerce yıldır tüccarlara hizmet etmiş, kara ticaretinin orta Anadolu merkeziydi. Ankara keçisi yünü, adı (Angora, sonra Ankara) yumuşaklıkla eş anlamlı hâle gelen lüks bir lifi doğurdu. Boya bitkileri, yün işleme ve Bursa’yı Trabzon’a bağlayan yol üzerindeki konumu onu Osmanlı ticaret ağında vazgeçilmez bir düğüm yaptı."
 som_tur_trade_routes: "İmparatorluk Ticaret Yolları"
 som_tur_trade_routes_desc: "İmparatorluk genişledikçe Osmanlılar kervansaraylara (yol kenarı hanları), döşeli yollara, köprülere ve korsanlara karşı deniz devriyelerine yatırım yaptı. Sonuç, kara ve deniz ticaretini Roma İmparatorluğu’nun zirvesinden beri olduğundan daha güvenli ve kârlı kılan bir ticari altyapı oldu. Işınsal bir ticaret ağının merkezindeki İstanbul üç kıtanın atan ekonomik kalbi oldu."
 som_tur_commercial_empire: "Ticaret İmparatorluğu"
 som_tur_commercial_empire_desc: "Halep, İskenderiye, İstanbul: dünyanın en büyük üç ticaret şehri artık hepsi Osmanlı. Hindistan’ın baharatları, Çin’in ipekleri, Avrupa’nın gümüşü, üreticiden tüketiciye giderken hep Osmanlı ellerinden geçti. İmparatorluk her işlemden pay aldı. Portekizliler Afrika çevresindeki deniz yolunu açtığında bile Osmanlı aracıları bir yüzyıl daha muazzam ticari etkiyi korudu."
 STATIC_MODIFIER_NAME_som_tur_janissary_mod: "Yeniçeri Ocağı"
 STATIC_MODIFIER_DESC_som_tur_janissary_mod: "İslam’a döndürülmüş Hıristiyan çocuklardan oluşturulan seçkin daimi piyade olan Yeniçeriler Osmanlı ordusunun belkemiği oldu. Kendine özgü beyaz börkleri ve mavi üniformaları 15. yüzyıl savaş alanlarında en çok korkulan manzaraydı. İstanbul’un fethindeki rolleri belirleyiciydi."
 STATIC_MODIFIER_NAME_som_tur_devshirme_mod: "Devşirme Sistemi"
 STATIC_MODIFIER_DESC_som_tur_devshirme_mod: "Devşirme, yalnızca Sultan’a sadık, aile veya kabile bağlılıklarına bağlı olmayan bir görevli sınıfı yarattı. Bu (Osmanlı standartlarına göre) liyakate dayalı sistem, mütevazı Hıristiyan kökenli adamların imparatorluğun en yüksek makamlarına yükselmesine izin verirken Sultan’a yerleşik Türk soyluluğuna karşı daima alternatif bir güç tabanı sağlıyordu."
 STATIC_MODIFIER_NAME_som_tur_elite_guard_mod: "Seçkin Muhafızlar"
 STATIC_MODIFIER_DESC_som_tur_elite_guard_mod: "En iyi Yeniçerilerden seçilen Sultan’ın şahsi muhafızları imparatorluğun en disiplinli birlikleriydi. Yalnızca askerî gücü değil, Saltanat’ın sembolik otoritesini de temsil ederlerdi: seferdeki varlıkları, Sultan kendisi bulunmasa bile Sultan’ın şahsının orada olduğu anlamına geliyordu."
 STATIC_MODIFIER_NAME_som_tur_kanun_mod: "Kanun Kanunnamesi"
 STATIC_MODIFIER_DESC_som_tur_kanun_mod: "Laik Osmanlı hukuku olan kanun, vergi, ceza usulü ve idareyi kapsayan ikili bir hukuk sistemi yaratmak üzere şeriatla birlikte işledi. Sultan’ın laik hukuk yaratma yasama yetkisi, Osmanlı devletine salt şeriata dayalı yönetimlerde bulunmayan esneklik veren teolojik bir yenilikti."
 STATIC_MODIFIER_NAME_som_tur_imperial_army_mod: "İmparatorluk Ordusu"
 STATIC_MODIFIER_DESC_som_tur_imperial_army_mod: "Yeniçeri piyadesini, Sipahi süvarisini ve dünyanın en sofistike top kolunu birleştiren tam gelişmiş Osmanlı ordusu 16. yüzyılın askerî mucizesiydi. Disiplin, ateş gücü ve lojistik örgütlenmenin birleşimi, hiçbir Avrupa gücünün eşleştiremeyeceği ölçekte seferlere onu muktedir kıldı."
 STATIC_MODIFIER_NAME_som_tur_timar_mod: "Tımar Sistemi"
 STATIC_MODIFIER_DESC_som_tur_timar_mod: "Fethedilen toprağı askerî hizmet karşılığı Sipahi süvarilerine kalıtsal olmayan tımarlar olarak vererek Osmanlılar ordularını hazineyi tüketmeden finanse etti. Sultan tüm tımar toprağının nihai mülkiyetini elinde tuttu ve Avrupalı monarkların ancak imrenebileceği bir güç verdi."
 STATIC_MODIFIER_NAME_som_tur_sipahi_mod: "Sipahi Süvarisi"
 STATIC_MODIFIER_DESC_som_tur_sipahi_mod: "Tımar tahsisleriyle finanse edilen zırhlı Sipahi süvarileri 15. ve 16. yüzyıllarda Osmanlı ordusunun başlıca vurucu gücüydü. Gürleyen hücumları Balkanlar’dan Fars sınırına kadar orduları parçaladı. İmparatorluk olgunlaştıkça Sipahi sınıfı kendi siyasi çıkarları olan güçlü bir taşra aristokrasisi hâline geldi."
 STATIC_MODIFIER_NAME_som_tur_eyalet_mod: "Eyalet Sistemi"
 STATIC_MODIFIER_DESC_som_tur_eyalet_mod: "Her büyük eyaleti Sultan’ın atadığı bir Beylerbeyi’nin yönettiği eyalet sistemi, Osmanlı idari erişimini muazzam bir coğrafi alana yaydı. Her eyalet fiilen küçük bir imparatorluktu; kendi askerî birliği, hazinesi ve sarayı vardı ve merkeze kaynak ve asker aktarırdı."
 STATIC_MODIFIER_NAME_som_tur_vizier_mod: "Sadrazam"
 STATIC_MODIFIER_DESC_som_tur_vizier_mod: "Sadrazam’ın konutu Bâb-ı Âli, Avrupalı büyükelçilerin Osmanlı diplomasisini yürüttüğü adres oldu. Başkanlık ettiği Divan imparatorluğun politika belirleme organıydı. Yetenekli bir Sadrazam imparatorluğu on yıllarca etkin biçimde yönetebilirdi; yeteneksiz biri onu çöküşün eşiğine getirebilirdi."
 STATIC_MODIFIER_NAME_som_tur_bureaucracy_mod: "İmparatorluk Bürokrasisi"
 STATIC_MODIFIER_DESC_som_tur_bureaucracy_mod: "Osmanlı katiplik kültürü, miktar ve ayrıntıda şaşırtıcı bir kâğıt kaydı üretti. Tapu defterleri, vergi etütleri, mahkeme kayıtları ve imparatorluk fermanları, Osmanlı İmparatorluğu’nu modern öncesi tarihin en iyi belgelenmiş devletlerinden biri yapan bir idari altyapı yarattı."
 STATIC_MODIFIER_NAME_som_tur_mosque_mod: "Süleymaniye Camii"
 STATIC_MODIFIER_DESC_som_tur_mosque_mod: "Sinan’ın başyapıtı, Osmanlıların aynı anda Roma’nın, Bizans’ın ve en yüce İslam uygarlığının mirasçısı olduğunu dünyaya duyurdu. Kubbesi İstanbul silüetinde Ayasofya ile yarıştı: eski Hıristiyan imparatorluk ile yeni Müslüman olan arasında kasıtlı bir mimari konuşma."
 STATIC_MODIFIER_NAME_som_tur_topkapi_mod: "Topkapı Sarayı"
 STATIC_MODIFIER_DESC_som_tur_topkapi_mod: "Topkapı, üç kıtaya yayılan bir imparatorluğun sinir merkeziydi. Her Sultan burada taç giydi; her sefer kapılarından başladı; her Sadrazam onun hoşnutluğuyla hizmet etti. Duvarlarının içindeki harem yüzyıllar boyunca veraset siyasetini şekillendirdi."
 STATIC_MODIFIER_NAME_som_tur_ulema_mod: "Ulema Otoritesi"
 STATIC_MODIFIER_DESC_som_tur_ulema_mod: "Ulema Osmanlı devletine dinî meşruiyetini sağladı. Sultan’ın savaşlarını cihat olarak onaylamaları, şer’î mahkeme sistemini yönetmeleri ve medrese eğitim ağını kadrolandırmaları onları Osmanlı yönetiminin vazgeçilmez ortakları yaptı."
 STATIC_MODIFIER_NAME_som_tur_millet_mod: "Millet Sistemi"
 STATIC_MODIFIER_DESC_som_tur_millet_mod: "Örgütlü dinî çoğulculuk, yani tek bir imparatorluk şemsiyesi altında yaşayan, her biri kendi cemaat işlerini yöneten Hıristiyanlar, Yahudiler ve Müslümanlar, çeşitli bir imparatorluğu yönetme sorununa Osmanlı çözümüydü. Eşitlik değildi, ama imparatorluğu yüzyıllar boyunca ayakta tutan bir arada yaşama biçimiydi."
 STATIC_MODIFIER_NAME_som_tur_kadi_mod: "Kadı Mahkemeleri"
 STATIC_MODIFIER_DESC_som_tur_kadi_mod: "Kadı mahkemeleri Osmanlı hukukun üstünlüğünü İstanbul’dan uzak Anadolu köylerine kadar imparatorluğun her köşesine taşıdı. Ürettikleri sicil kayıtları bir tarihçinin hazinesidir: yüzyıllar boyunca mülkiyet uyuşmazlıklarını, evlilikleri, ticari sözleşmeleri ve ceza davalarını belgeleyen on binlerce cilt."
 STATIC_MODIFIER_NAME_som_tur_sufi_mod: "Sufi Kültürü"
 STATIC_MODIFIER_DESC_som_tur_sufi_mod: "Sufi tarikatlar Osmanlı dinî hayatına, resmî ve legalist İslam’ın sağlayamayacağı manevi derinlik kazandırdı. Dönen Mevlevîler, askerî Bektaşîler, siyasi bağlantıları olan Nakşibendîler: her tarikat Osmanlı toplumunda kendine özgü bir yer edindi ve birlikte tüm imparatorluk boyunca manevi bir cemaat ağı ördüler."
 STATIC_MODIFIER_NAME_som_tur_synthesis_mod: "Kültürel Sentez"
 STATIC_MODIFIER_DESC_som_tur_synthesis_mod: "Yok etmek yerine özümseme konusundaki Osmanlı yeteneği imparatorluğu kültürel bir sünger yaptı. Bizans idari uzmanlığı, Fars edebî kültürü, Arap bilimsel geleneği ve Türk askerî enerjisi bir araya akarak kendine özgü ve görkemli biçimde Osmanlı bir şeye dönüştü."
 STATIC_MODIFIER_NAME_som_tur_bursa_silk_trade: "Bursa İpek Sanayisi"
 STATIC_MODIFIER_DESC_som_tur_bursa_silk_trade: "Bursa imparatorluğun ipek başkenti oldu: yüzyıllarca koruduğu bir rol. Şehrin zanaatkârları Avrupa’nın ve Orta Doğu’nun saraylarını süsleyen lüks ipekler üretti ve gelirleri imparatorluğu kuran seferleri finanse etmeye yardım etti."
 STATIC_MODIFIER_NAME_som_tur_trade_empire_mod: "İmparatorluk Ticaret Yolları"
 STATIC_MODIFIER_DESC_som_tur_trade_empire_mod: "Kervansaraylar, yollar ve korsanlığın bastırılması imparatorluk içindeki ticareti canlandırdı. İstanbul merkezli ışınsal bir ticaret ağı ekonomik bütünleşme getirdi."
 STATIC_MODIFIER_NAME_som_tur_istanbul_glory_mod: "Dünyanın Arzu Ettiği Şehir"
 STATIC_MODIFIER_DESC_som_tur_istanbul_glory_mod: "İki kıtaya yayılan ve Karadeniz ile Akdeniz arasındaki tek geçide hâkim İstanbul, tüm dünyanın arzu ettiği şehirdi. Nüfusu, ticareti, mimarisi ve siyasi önemi onu bilinen dünyanın tartışmasız başkenti yaptı."
 som_ottoman_events.50.t: "Dünyanın Arzu Ettiği Şehir"
 som_ottoman_events.50.d: "İstanbul, gerçek ve tam anlamıyla tüm dünyanın arzu ettiği şehir oldu. Yarım milyonluk nüfusu onu Avrupa ile Orta Doğu’nun birleşiminden daha büyük yapıyor. İki kıtaya yayılıyor. Karadeniz ile Akdeniz arasındaki tek deniz geçidini denetliyor. Süleymaniye Camii’nin zarif siluet’i ile Topkapı Sarayı’nın hâkim yüksekliği Boğaz’ın sularında yansıyor. Saraylarında şairler filozoflarla, mimarlar bilginlerle yarışıyor. Osmanlı uygarlığı zirvesine ulaştı. Bu şehir bin yıl parlayacak."
 som_ottoman_events.50.a: "İstanbul bin yıl parlasın!"
 som_ottoman_events.50.breadbasket_tt: "“Osmanlı İmparatorluk Tarım Merkezi” şehir hakkı artık kullanılabilir. Seviye 5 veya daha yüksek bir ambara sahip, şehir rütbesindeki veya üstündeki konumlara verilebilir."
 STATIC_MODIFIER_NAME_som_tur_constantinople_dev_mod: "Kostantiniyye’nin Gelişimi"
 STATIC_MODIFIER_DESC_som_tur_constantinople_dev_mod: "II. Mehmed’in komutası altında iskân ve yeniden inşa sürüyor; yeni sakinlerin sesleri pazarları dolduruyor ve onarılan taş işçiliği eski imparatorluk şehrine yeni bir parlaklık kazandırıyor."
 STATIC_MODIFIER_NAME_som_tur_constantinople_splendor_mod: "Kostantiniyye’nin İhtişamı"
 STATIC_MODIFIER_DESC_som_tur_constantinople_splendor_mod: "Haliç çevresinde yeni atölyeler, kervansaraylar ve mahalleler yükseliyor; göçmenler ve zanaatkârlar şehre akın ediyor, arkasındaki topraklar her zamankinden fazla ürün veriyor. Sultanın başkenti yeniden bilinen dünyadaki tüm şehirleri gölgede bırakıyor."
 STATIC_MODIFIER_NAME_som_tur_trebizond_trade_mod: "Trabzon: İpek Yolu’nun Kapısı"
 STATIC_MODIFIER_DESC_som_tur_trebizond_trade_mod: "Güney Karadeniz kıyısındaki Trabzon limanında Orta Asya’dan ve Hazar’dan İpek Yolu boyunca inen kervanların yükleri yüksekçe yığılmış, Akdeniz’e gidecek gemileri bekliyor."
 STATIC_MODIFIER_NAME_som_tur_commercial_empire_mod: "Ticaret İmparatorluğu"
 STATIC_MODIFIER_DESC_som_tur_commercial_empire_mod: "Halep, İskenderiye, İstanbul: üç kıtanın serveti artık sultanın pazarlarından akıyor."
 STATIC_MODIFIER_NAME_som_tur_grand_bazaar_loc_mod: "Kapalıçarşı"
 STATIC_MODIFIER_DESC_som_tur_grand_bazaar_loc_mod: "Kapalıçarşı’nın örtülü sokaklarında kuyumcuların ve baharatçıların nidaları hiç kesilmez ve tüm dünyanın malları burada toplanır."
 som_ottoman_events.19.t: "İzmir’in Ticari Kaderi"
 som_ottoman_events.19.d: "İzmir, doğu Ege kıyısının en büyük liman şehridir: Anadolu’nun iç kesimini Akdeniz dünyasına bağlayan kapı. Antik çağda Yunan kolonistler kurdu; şimdi Osmanlılara ait. Sultan şehrin gelecekteki yönüne karar vermelidir: bilinen dünyanın dört bir yanından tüccarları çeken gelişen bir ticaret merkezi olarak mı geliştirmeli, yoksa Osmanlı gücünü Ege’ye yaymak için gemi inşasına mı yatırım yapmalı?"
 som_ottoman_events.19.a: "İzmir’in tüccar mahallesini geliştir ve bir ticaret merkezi yap"
 som_ottoman_events.19.b: "İzmir’de bir tersane inşa et ve onu Ege genişlemesi için bir deniz üssü olarak kullan"
 STATIC_MODIFIER_NAME_som_tur_anatolian_heartland_mod: "Anadolu Hâkimiyeti"
 STATIC_MODIFIER_DESC_som_tur_anatolian_heartland_mod: "Konya’dan Trabzon’a sultanın vergi tahsildarları ve görevlileri Anadolu köylerine ulaşıyor ve imparatorluk yönetimi yaylanın her köşesine uzanıyor."
 STATIC_MODIFIER_NAME_som_tur_crimea_dominance: "Kırım Hâkimiyeti"
 STATIC_MODIFIER_DESC_som_tur_crimea_dominance: "Kefe limanından Karadeniz’e bakıldığında dalgaları yalnızca Osmanlı bayrağı taşıyan gemiler yarıyor. Karadeniz bir “Osmanlı gölü” oluyor."
 STATIC_MODIFIER_NAME_som_tur_aleppo_learning_mod: "Halep İlmi"
 STATIC_MODIFIER_DESC_som_tur_aleppo_learning_mod: "Halep İslam dünyasının büyük entelektüel merkezlerinden biriydi. Burada toplanan ünlü medreseler, kütüphaneler ve âlimler Osmanlı İmparatorluğu’na Arap ilim geleneğinden bir aşı getirir."
 STATIC_MODIFIER_NAME_som_tur_damascus_learning_mod: "Şam İlmi"
 STATIC_MODIFIER_DESC_som_tur_damascus_learning_mod: "Şam, Emevî, Abbasî ve Memlük dönemlerinin birikmiş entelektüel mirasını taşır. Osmanlı yönetimi altında bu zengin miras büyümeye devam eder."
 STATIC_MODIFIER_NAME_som_tur_caliph_successor: "Halifeliğin Halefi"
 STATIC_MODIFIER_DESC_som_tur_caliph_successor: "Artık kutsal yerlerin koruyucusu olan sultanın adı minberlerden halife olarak anılıyor."
 STATIC_MODIFIER_NAME_som_tur_aegean_shipbuilding_mod: "Ege Gemi İnşa Teknikleri"
 STATIC_MODIFIER_DESC_som_tur_aegean_shipbuilding_mod: "Ege adalarından gemi ustaları nesiller boyu aktarılan sanatları İstanbul tersanelerine getiriyor ve omurga ardına omurga kızağa konuyor."
 som_ottoman_events.61.t: "Mercidabık Muharebesi"
 som_ottoman_events.61.d: "1516’da Sultan I. Selim, Mercidabık ovasında Memlük Sultanı Kansu Gavri’nin ordusunu yok etti. Kansu’nun kendisi sahada düştü; tüm Suriye Osmanlı ellerine geçti. Kahire işgal edildiğinde Memlük Sultanlığı’nın kaderi Osmanlı ellerinde."
 som_ottoman_events.61.a: "Memlük Sultanlığı’nı müzakereyle sağlanan barışla bir eyalet olarak özümse"
 som_ottoman_events.61.b: "Barış yap ve bağımsızlığını korumalarına izin ver"
 STATIC_MODIFIER_NAME_som_tur_edirne_trade_mod: "Edirne: Ticaret Merkezi"
 STATIC_MODIFIER_DESC_som_tur_edirne_trade_mod: "Edirne (Hadrianopolis), Rumeli’nin ticaret merkezidir. Balkanlar ile Anadolu’yu bağlayan bu şehir boya, ipek ve ince kumaş üretim merkezi olarak geliştirilir ve erken Osmanlı mali temelini destekler."
 STATIC_MODIFIER_NAME_som_tur_novo_brdo_silver_mod: "Novo Brdo Gümüş Madenleri"
 STATIC_MODIFIER_DESC_som_tur_novo_brdo_silver_mod: "Novo Brdo (“Yeni Tepe”) Balkanlar’ın en büyük gümüş madenlerine sahiptir. 1450’lerdeki Osmanlı fethinden sonra bile zengin madenleri imparatorluk hazinesini zenginleştirmeyi sürdürdü. Aylık refah ve nüfus artışı da desteklenir."
 STATIC_MODIFIER_NAME_som_tur_hungarian_march_mod: "Macar Yürüyüşü"
 STATIC_MODIFIER_DESC_som_tur_hungarian_march_mod: "Budin düştüğünde Tuna’yı geçip Viyana’ya doğru ilerleyen Osmanlı askerleri, zaferin parıltısı içinde bile Habsburglarla uzun bir savaşın başladığını hissediyor."
 STATIC_MODIFIER_NAME_som_tur_italy_north_mod: "İtalya Yarımadası Üzerinde Egemenlik"
 STATIC_MODIFIER_DESC_som_tur_italy_north_mod: "Hilâl sancağı Roma’nın, Floransa’nın ve Milano’nun meydanlarında dalgalanıyor ve Rönesans şehirlerinin halkı yeni hükümdarlarının dilini öğrenmeye başlıyor."
 STATIC_MODIFIER_NAME_som_tur_maghreb_mod: "Mağrip Hâkimiyeti"
 STATIC_MODIFIER_DESC_som_tur_maghreb_mod: "Tunus ve Cezayir limanlarında toplanan Berberi korsan gemileri artık batı Akdeniz’e sultanın filosunun bir kanadı olarak bakıyor."
 som_tur_silk_road_revival: "İpek Yolu’nun Yeniden Canlanışı"
 som_tur_silk_road_revival_desc: "Tebriz, İpek Yolu’nun en batıdaki merkeziydi: bir zamanlar İran’ı ve Orta Asya’yı Akdeniz dünyasına bağlayan İlhanlı başkenti. Bu şehri ele geçirmek Osmanlı İmparatorluğu’na Asya’dan gelen ipek, baharat ve mücevher akışı üzerinde doğrudan denetim verir. Karadeniz’i Orta Asya’ya bağlayan geniş ticaret ağı canlanır ve imparatorluk ticari gücünü çarpıcı biçimde artırır."
 STATIC_MODIFIER_NAME_som_tur_silk_road_revival_mod: "İpek Yolu’nun Yeniden Canlanışı"
 STATIC_MODIFIER_DESC_som_tur_silk_road_revival_mod: "Tebriz pazarlarından Çin ipeği yüklü kervanlar yeniden İstanbul’a giden yola düşüyor ve İpek Yolu eski canlılığını geri kazandı."
 som_tur_city_of_worlds_desire_desc: "İstanbul gerçekten dünyanın arzu ettiği şehir. Yarım milyonu aşan nüfusuyla dünya ticaretinin tartışmasız eksenidir. Bu büyük şehir tam şanına ulaştıkça kadim Bizans İmparatorluk Ambarı hakkı Osmanlı İmparatorluğu için de kullanılabilir olur."
 som_tur_true_rome: "Gerçek Roma İmparatorluğu"
 som_tur_true_rome_desc: "Balkanlar, Anadolu, Arap dünyası, Mısır, Kuzey Afrika, İtalya: bir zamanlar Roma’nın yönettiği toprakların neredeyse tamamı artık Osmanlı sancağını taşıyor. II. Mehmed İstanbul’un düşüşünün ardından Kayser (İmparator) unvanını aldı. Şimdi Osmanlı İmparatorluğu yollarının, yasalarının, uygarlığının mirasçısı olarak Roma’nın gerçek halefi olarak duruyor. Justinianus’un Corpus Juris’ini canlandır, su kemeri sistemini genişlet ve geniş imparatorluğu tek bir hukuk ve tek bir kültür altında bağla."
 STATIC_MODIFIER_NAME_som_tur_true_rome_mod: "Gerçek Roma İmparatorluğu"
 STATIC_MODIFIER_DESC_som_tur_true_rome_mod: "Roma’nın örtüsünü üstlenen bir imparatorluk altında yollar onarılıyor, su kemerleri genişletiliyor ve Justinianus kanunnamesi yeni bir çağın hukuku olarak canlandırılıyor."
 som_ottoman_mission_pack: "Osmanlı İmparatorluğu’nun Yükselişi"
 som_ottoman_mission_pack_DESCRIPTION:0 "1337’de Osmanlı yapısı, Bursa, İznik ve İzmit merkezli küçük bir Anadolu beyliğidir. Birkaç nesil içinde Balkanlar’dan Arabistan’a, Kırım’dan Kuzey Afrika’ya ve İtalya’ya uzanan bir imparatorluğa dönüşecek. Gazi ruhunu Balkanlar’a taşı, İstanbul’u dize getir, Muhteşem Süleyman’ın altın çağını gerçekleştir ve Gerçek Roma’nın örtüsünü sahiplen."
 som_ottoman_mission_pack_CRITERIA_DESCRIPTION:0 "Osmanlılar olarak Balkanlar’ı, Anadolu’yu, Arap dünyasını ve Akdeniz’i fethet; sağlam iç kurumlar inşa et; ve Süleyman Çağı’na ulaş."
 som_ottoman_mission_pack_BUTTON_TOOLTIP:0 "Osmanlı İmparatorluğu’nun Yükselişi’ni gerçekleştirmek için görevleri tamamla."
 som_ottoman_mission_pack_BUTTON_DETAILS:0 "1337’de küçük bir beylikten dünyanın en büyük imparatorluğuna!"
