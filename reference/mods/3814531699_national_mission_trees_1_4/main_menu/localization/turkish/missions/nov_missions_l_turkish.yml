l_turkish:
 nov_novgorod_mission_pack: "Novgorod’un Şanı: Ticaret Cumhuriyeti’nden Rus’un Hükümdarlığına"
 nov_novgorod_mission_pack_DESCRIPTION:0 "1337’de Büyük Novgorod Cumhuriyeti Rusya’nın en büyük ticaret devletidir. Veçe (halk meclisi) siyaseti yönlendirir ve Hansa Birliği ile ticaret servet getirir. Ama Moskova durmadan güçleniyor ve Tatar tehdidi doğudan belirmekte. Kürk ticareti, Baltık hâkimiyeti, Moskova Prensliği’nin yenilgisi: tüm Rus’un Büyük Prensi olarak hüküm sür."
 nov_novgorod_mission_pack_CRITERIA_DESCRIPTION:0 "Bir ticaret imparatorluğu inşa et, Rusya’yı birleştirmek için Moskova Prensliği’ni yen, Baltık’a ve Sibirya’ya hâkim ol ve Rus’un Büyük Prensi olarak hüküm sür."
 nov_novgorod_mission_pack_BUTTON_TOOLTIP:0 "Rus’un Büyük Prensi olmak için görevleri tamamla."
 nov_novgorod_mission_pack_BUTTON_DETAILS:0 "Novgorod’un ticaret cumhuriyetinden Rus İmparatorluğu’nun temeline!"
 nov_veche_republic: "Veçe Cumhuriyeti"
 nov_veche_republic_desc: "Novgorod Veçesi vatandaşların, soyluların ve tüccarların hepsinin katıldığı eşsiz bir demokratik kurumdur. “Novgorod yalnızca Novgorod’a aittir”: bu devleti bir prens değil vatandaşların iradesi yönlendirir ve onu diğer tüm Rus prensliklerinden ayırır. Veçe geleneğini güçlendir ve ticaret cumhuriyetinin temelini sağlamlaştır."
 nov_dev_novgorod: "Büyük Novgorod’u Geliştir"
 nov_dev_novgorod_desc: "Volhov Nehri üzerindeki “Veliky Novgorod (Büyük Novgorod)” ortaçağ Rusya’sının en büyük ticaret şehridir. Hansa, Bizans ve Doğu Müslüman tüccarları burada buluşur ve kürk, balmumu, keten ve balık ticareti yapar. Novgorod “kontor”u (ticaret karakolu) Lübeck’te, Brugge’de, Londra’da ve Bergen’de işler."
 nov_birch_bark: "Huş Kabuğu El Yazmaları"
 nov_birch_bark_desc: "Novgorodlular huş kabuğuna yazma geleneğine sahipti: dünyanın en okur-yazar ortaçağ şehrinin kanıtı. Bu okuryazarlık geleneğinden yararlanarak akademik, idari ve ticari kayıtları geliştir."
 nov_hanseatic_league: "Hansa Ticareti"
 nov_hanseatic_league_desc: "Novgorod kuzey Avrupa’nın en büyük ticaret şehirlerinden biri olarak Hansa Birliği ağına derinden bütünleşmiştir. Lübeck’e, Hamburg’a ve Brugge’ye bağlanan ticaret yollarını güçlendir."
 nov_fur_trade: "Kürk Ticareti"
 nov_fur_trade_desc: "Novgorod’un en büyük ticaret malı kürktür: Sibirya ormanlarından çıkarılan sincap, samur, kunduz ve vizon kürkleri batı Avrupa soylularına satılır. “Kuzey’in altını” denen kürk ticareti Novgorod’un servet kaynağıdır."
 nov_dev_pskov: "Pskov’u Geliştir"
 nov_dev_pskov_desc: "Şiddetle bağımsız Pskov, Novgorod’un “küçük kardeşi” şehir, ticari ve kültürel alt başkent olur. Pskov Kremlin’inin surlarına ve Üçlü Birlik Katedrali’ne sahip bu şehri geliştir."
 nov_trade_empire: "Ticaret İmparatorluğu"
 nov_trade_empire_desc: "Kürk, balmumu, tuz, balık: Novgorod’un ticaret ağı kuzey Avrupa’yı kaplar. Tüccar loncaları devleti yönetir ve ticaret karakolları her yerde kurulur. “Kuzey’in Venedik’i”nin şöhreti dünyaya yayılır."
 nov_dev_staraya_russa: "Staraya Russa’yı Geliştir"
 nov_dev_staraya_russa_desc: "“Eski Rus” adını taşıyan Staraya Russa, tuz üretim merkezi olarak ünlüdür. Bu kadim şehrin tuz sanayisini geliştirerek Novgorod’un gıda korumasına ve ticaretine katkıda bulun."
 nov_secure_novgorod_region: "Novgorod Bölgesini Güvenceye Al"
 nov_secure_novgorod_region_desc: "Novgorod’un öz toprağı: hem Batı hem Doğu Novgorod bölgelerini tamamen denetlemek genişleme için temeli kurar."
 nov_conquer_tver: "Tver’i Fethet"
 nov_conquer_tver_desc: "Bir zamanlar Moskova’nın üstünlük için rakibi olan Tver Prensliği’nin gücü şimdi azaldı. Yukarı İdil’deki bu önemli şehri fethet ve güneye giden yolu aç."
 nov_conquer_yaroslavl: "Yaroslavl’ı Fethet"
 nov_conquer_yaroslavl_desc: "İdil üzerindeki “Altın Halka” şehri Yaroslavl: bu ticaret şehrini fethet ve kuzey ticaret yolunu ele geçir."
 nov_conquer_moscow: "Moskova’yı Fethet"
 nov_conquer_moscow_desc: "I. İvan’dan (Kalita) beri Moskova Tatar desteğiyle istikrarlı biçimde genişledi. “Moskova ya da savaş”: Novgorod’un en büyük tehdidini yen ve Rusya’nın liderliğini ele geçir."
 nov_conquer_suzdal: "Suzdal’ı ve Vladimir’i Fethet"
 nov_conquer_suzdal_desc: "Suzdal ve Vladimir: bir zamanlar Kiev-Rus’un halefleri olarak çiçek açmış kadim şehirler. Çok sayıda altın kubbeli kiliseye sahip bu şehirleri fethet ve Eski Rus meşruiyetini miras al."
 nov_defeat_muscovy: "Moskova Prensliği’ni Yen"
 nov_defeat_muscovy_desc: "Moskova Büyük Dukalığı yok edilir ve Rusya’nın liderliği Novgorod’a geçer. Rurikid hanedanının emelleri ezilir: Rusya’nın geleceğini Veçe Cumhuriyeti belirleyecek."
 nov_conquer_smolensk: "Smolensk’i Fethet"
 nov_conquer_smolensk_desc: "“Rusya’nın anahtarı” denen Smolensk: bu doğu-batı ulaşım merkezini denetlemek batı nüfuzunu kurar."
 nov_conquer_ryazan: "Ryazan’ı Fethet"
 nov_conquer_ryazan_desc: "1237’de Moğol ordusunca ilk yıkılan Ryazan prensliği: güney bozkır topraklarını fethet ve Tatarlara karşı bir savunma hattı kur."
 nov_form_russia: "Rus’u Kur"
 nov_form_russia_desc: "Novgorod merkezli birleşik bir Rus devleti şekilleniyor: Rusya’yı Moskova değil Novgorod birleştirdi. Bu tarihî dönüm noktasından doğan yeni Rusya nasıl bir biçim alacak?"
 nov_vologda_trade: "Vologda Ticareti"
 nov_vologda_trade_desc: "Kuzey ticaret yolunun kilit noktaları Vologda’yı ve Beloozero’yu denetlemek Beyaz Deniz erişimini ve kürk ticaret yolunu kurar."
 nov_found_arkhangelsk: "Arhangelsk’i Kur"
 nov_found_arkhangelsk_desc: "Beyaz Deniz kıyısında Arhangelsk liman kasabasını inşa et: kışın donsa da bu liman kuzey Avrupa ile ve Britanya ile doğrudan ticareti mümkün kılar. İleride İngiliz tüccarlar Rusya’ya buradan girecek."
 nov_white_sea_trade: "Beyaz Deniz Ticaretine Hâkimiyet"
 nov_white_sea_trade_desc: "Beyaz Deniz ticaret yoluna hâkim ol ve kuzey Avrupa ile doğrudan ticaret kur. Arhangelsk kuzey ticaretinin merkezi olarak gelişir."
 nov_conquer_perm: "Perm’i Fethet"
 nov_conquer_perm_desc: "Yukarı Kama Nehri üzerindeki Perm bölgesi, en kaliteli post olan “Kama kürklerinin” üreticisi. Burayı fethetmek kürk ticareti tekelini kurar."
 nov_kola_fortress: "Kola Kalesi"
 nov_kola_fortress_desc: "Kola Yarımadası’nın en kuzey ucu: Murmansk Körfezi’nin buzsuz limanını ele geçir ve bir kuzey deniz yolu üssü kur."
 nov_siberian_frontier: "Sibirya Sınırı"
 nov_siberian_frontier_desc: "Ural Dağları’nı geçip Sibirya’ya girmek: sınırsız kürk kaynaklarıyla “toprağın ötesine” giden yol açık. Yermak’ın fethinden önce Sibirya’ya ilerle."
 nov_fur_monopoly: "Kürk Ticareti Tekeli"
 nov_fur_monopoly_desc: "Perm’den Sibirya’ya: tüm kürk ticaret yolları Novgorod’un denetimine girer. Avrupa kraliyet ve soylularının aradığı lüks kürklerin arzını tekelleştir ve muazzam servet kazan."
 nov_secure_karelia: "Karelya’yı Güvenceye Al"
 nov_secure_karelia_desc: "Baltık Denizi erişimini güvenceye almak için Finlandiya Körfezi’nin kuzey kıyısındaki Karelya bölgesini ele geçir: İsveç ile sınırı kuran önemli bir stratejik nokta."
 nov_conquer_viborg: "Viborg’u Fethet"
 nov_conquer_viborg_desc: "İsveç’in inşa ettiği Viborg kalesi: Finlandiya Körfezi’ndeki bu kilit noktaya saldırmak Baltık’ın kapısını açar."
 nov_baltic_fleet: "Baltık Filosu"
 nov_baltic_fleet_desc: "Novgorod’un Baltık filosunu inşa et: kuzey Avrupa ticaretine hâkim olmak için deniz gücü şarttır."
 nov_conquer_riga: "Riga’yı Fethet"
 nov_conquer_riga_desc: "Dvina Nehri’nin ağzındaki Riga: bu önemli Hansa Birliği şehrini fethetmek Baltık ticaretinin liderliğini ele geçirir. “Danzig ya da savaş” ruhuyla Riga’yı da al."
 nov_livonia: "Livonya’ya Boyun Eğdir"
 nov_livonia_desc: "Livonya Tarikatı’nın hâkim olduğu Baltık doğu kıyısı: bu bölgeye boyun eğdirmek Baltık devletlerine erişim kurar."
 nov_neva_ports: "Neva Limanları"
 nov_neva_ports_desc: "Neva Nehri üzerindeki liman kasabasını geliştir: Büyük Petro’nun ileride “Petersburg”u inşa edeceği bu yer Baltık’ın kapısı olur."
 nov_orthodox_archbishop: "Ortodoks Başpiskoposluğu"
 nov_orthodox_archbishop_desc: "Novgorod Başpiskoposu Moskova’dan ve İstanbul’dan bağımsız bir otoriteye sahiptir: dinî özerklik Novgorod’un özgünlüğünü destekler. Aya Sofya Katedrali’yle Novgorod’un Ortodoks geleneğini güçlendir."
 nov_cathedral_cities: "Katedral Şehirleri"
 nov_cathedral_cities_desc: "Novgorod’un tüm şehirlerinde katedraller inşa et: “Kutsal Rus” idealini gerçekleştir ve tüm ülkeyi Ortodoks inancının parlaklığıyla kapla."
 nov_guardian_of_orthodoxy: "Ortodoksluğun Koruyucusu"
 nov_guardian_of_orthodoxy_desc: "İstanbul Osmanlılara düşünce Ortodoks koruyucusu görevi Novgorod’a düşer. “Üçüncü Roma” unvanını ele geçir: onu Moskova değil Novgorod taşıyacak."
 nov_novgorod_chronicle: "Novgorod Vakayinamesi"
 nov_novgorod_chronicle_desc: "Yıllık olayları titizlikle kaydeden bu tarihî eser Novgorod Vakayinamesi (Novgorodskaya Letopis), Novgorod’un entelektüel mirasını gelecek nesillere aktarır."
 nov_dev_torzhok: "Torzhok’u Geliştir"
 nov_dev_torzhok_desc: "Novgorod ile Moskova arasında yer alan Torzhok: onu bir ticaret merkezi olarak geliştir ve güney ticaret yolunu denetle."
 nov_kazan_subjugation: "Kazan’a Boyun Eğdir"
 nov_kazan_subjugation_desc: "Kazan Hanlığı: orta İdil’i denetleyen bu Tatar ardıl devletine boyun eğdirmek doğuya giden yolu açar."
 nov_ushkuiniks: "Ushkuinikler"
 nov_ushkuiniks_desc: "Ushkuinikler: Novgorod’un nehir korsanlarından, kâşiflerinden ve askerlerinden oluşan karışık topluluğu. İdil’i inerek Tatar ticaret gemilerini yağmalayan bu kaba karakterleri Novgorod’un düzenli ordusuna kat ve seçkin birlikler olarak eğit."
 nov_dev_suzdal: "Suzdal’ı Geliştir"
 nov_dev_suzdal_desc: "“Altın Halka”nın Suzdal’ı: çok sayıda ortaçağ kilisesine ve manastırına sahip bu kadim şehri bir kültürel ve dinî merkez olarak geliştir."
 nov_conquer_beloozero: "Beloozero’yu Fethet"
 nov_conquer_beloozero_desc: "“Beyaz Göl” Beloozero bölgesi: kürkle ve balıkla zengin, bu bölgeyi ele geçir ve kuzey ticaret yolunu güvenceye al."
 nov_dev_kholmogory: "Kholmogory’yi Geliştir"
 nov_dev_kholmogory_desc: "Dvina Nehri üzerindeki Kholmogory: bu liman kasabasını Beyaz Deniz’in kapısı olarak geliştir ve gelecekteki Arhangelsk refahının temelini at."
 nov_conquer_vladimir: "Vladimir’i Fethet"
 nov_conquer_vladimir_desc: "Bir zamanlar Vladimir Büyük Prensliği’nin başkenti: Dmitrievsky Katedrali dahil birçok dinî yapıya sahip bu kadim şehir Novgorod’a düşer."
 nov_tatar_wars: "Tatarlara Karşı Savaşlar"
 nov_tatar_wars_desc: "Novgorod Tatar boyunduruğuna boyun eğmeyen tek büyük Rus şehriydi: şimdi bu gururu silah olarak kullanarak Tatarlarla savaş. Neva kıyısı ruhuyla bozkır atlılarını yen."
 nov_golden_horde: "Altın Orda’ya Karşı Saldırı"
 nov_golden_horde_desc: "Novgorod’un sancağını Altın Orda (Kıpçak Hanlığı) topraklarında yükselt: Rusya’yı Moğol yönetiminden kurtaran Rus’un gerçek efendisidir."
 nov_nizhny_novgorod: "Nijni Novgorod’u Fethet"
 nov_nizhny_novgorod_desc: "“Aşağı Novgorod” Nijni Novgorod: İdil ve Oka nehirlerinin birleştiği yerdeki bu ticaret şehrine boyun eğdir ve orta İdil ticaretini ele geçir."
 nov_orthodox_mission: "Ortodoks Misyonu"
 nov_orthodox_mission_desc: "Ortodoks inancını kuzeydeki ve doğudaki paganlara yay: Fin halkları, Sibirya yerlileri ve Tatarlar arasındaki misyonerlik faaliyetleri Novgorod’un meşruiyetini artırır."
 nov_hanseatic_kontors: "Hansa Kontorları"
 nov_hanseatic_kontors_desc: "Büyük Hansa Birliği şehirlerinde Novgorod ticaret karakolları (kontorlar) kur: Novgorod, Riga, Lübeck. Kuzey Avrupa ticaret ağını doğrudan denetle."
 nov_ostrog_system: "Ostrog Sistemi"
 nov_ostrog_system_desc: "Sibirya’ya ilerlemeyi destekleyen bir kale ağı (ostrog) kur: Tümen’e, Tobolsk’a ve İrkutsk’a giden Sibirya fethi için ileri üsler."
 nov_dev_ryazan: "Ryazan’ı Geliştir"
 nov_dev_ryazan_desc: "Moğollarca yok edilen Ryazan: harabeleri üzerine yeni bir Ryazan şehri inşa edildi. Bu önemli güney şehrini bozkıra doğru bir ileri üs olarak geliştir."
 nov_estonian_coast: "Estonya Kıyısı"
 nov_estonian_coast_desc: "Estonya kıyısına boyun eğdirmek Baltık güney kıyısı denetimini tamamlar. Hansa ticaret şehri Reval’ı (Tallinn) ele geçir."
 nov_conquer_teutonic: "Töton Tarikatı’nı Yen"
 nov_conquer_teutonic_desc: "Baltık Haçlı Seferleri’nin mirası sona erer: Töton Tarikatı’nı yenmek güneydoğu Baltık kıyısını tamamen Novgorod’un denetimine sokar."
 nov_moscow_capital: "Moskova’yı Geliştir"
 nov_moscow_capital_desc: "Fethedilen Moskova’yı Novgorod yönetimi altında önemli bir şehir olarak geliştir: eski Moskova Büyük Prensi’nin sarayını hâkimiyetin simgesi olan Novgorod Valisi Konağı’na dönüştür."
 nov_iron_ring: "Demir Halka"
 nov_iron_ring_desc: "Novgorod’u koruyan kale halkası: Pskov’u, Novgorod’u, Ladoga’yı ve Tver’i birbirine bağlayan savunma ağı tamam. Her yönden gelecek istilayı püskürtebilecek demir bir savunma sistemi."
 nov_kholmogory_trade: "Kholmogory Ticareti"
 nov_kholmogory_trade_desc: "Dvina üzerindeki ticaret merkezi Kholmogory’den Beyaz Deniz’e: bu kuzey ticaret yolunu İngiliz Moskova Şirketi’nden önce ele geçir."
 nov_eastern_orthodoxy: "Doğu Ortodoks Kilisesi Kuruldu"
 nov_eastern_orthodoxy_desc: "İstanbul’un düşüşünden sonra Novgorod Doğu Ortodoks Kilisesi’nin merkezi olarak ortaya çıkar. Aya Sofya Katedrali, İstanbul’daki Ayasofya’nın halefi olarak parlar."
 nov_amber_road: "Kehribar Yolu"
 nov_amber_road_desc: "Baltık Denizi’nden güneye uzanan kehribar ticaret yolu: Baltık kehribarı, Novgorod kürkleri ve Doğu ipeği artık Novgorod’un denetlediği bu yolda kesişir."
 nov_great_novgorod: "Büyük Novgorod Tamam"
 nov_great_novgorod_desc: "Ticaret imparatorluğu, askerî güç, Ortodoks otoritesi: üç sütun tamam ve Novgorod “Büyük (Veliky)” unvanına layık bir devlet olur. “Rus’un Büyük Prensi”ne doğru son adımı at."
 nov_ruler_of_rus: "Rus’un Büyük Prensi"
 nov_ruler_of_rus_desc: "“Novgorod’un ve tüm Rus’un Büyük Prensi”: bu unvan Novgorod’un Veçe meydanında yankılandı. Baltık’tan Sibirya’ya, Beyaz Deniz’den güney bozkırlarına Novgorod’un sancağı tüm Rusya’da dalgalanıyor. Ticaret cumhuriyeti dünyanın en büyük imparatorluklarından birini inşa etti. Tarih yeniden yazıldı: Rusya’nın geleceğini Novgorod belirliyor."
 nov_events.10.t: "Moskova Düşer: Rus Liderliği Novgorod’a"
 nov_events.10.d: "Moskova Kremlin’i Novgorodlu ellere düştü. “Tatar köpekleri” diye küçümsenen Moskova Büyük Prensi ailesinin emelleri ezildi. Rusya’nın geleceğini artık Novgorod Veçe Cumhuriyeti belirlediğine göre bu zafer salt bir toprak fethi değil: Rus tarihini kökten değiştiren bir dönüm noktası."
 nov_events.10.a: "Moskova düştü! Novgorod çağı başlıyor!"
 nov_events.20.t: "Rus’un Oluşumu: Novgorod Merkezli Yeni Bir Devlet"
 nov_events.20.d: "Novgorod merkezli birleşik bir Rus devleti doğdu. Adı ne olmalı? Yeni bir başlangıcı müjdelemek için “Rus Büyük Dukalığı”nı mı ilan edeceksin, yoksa “Novgorod” adını gururla mı koruyacaksın?"
 nov_events.20.a: "“Rus Büyük Dukalığı”nı ilan et: yeni bir Rusya’nın doğuşu"
 nov_events.20.b: "“Novgorod” adını gururla koru"
 nov_events.99.t: "Rus’un Büyük Prensi: Novgorod Rusya’ya Hükmediyor"
 nov_events.99.d: "“Novgorod’un ve tüm Rus’un Büyük Prensi”: bu unvan Novgorod’un Veçe meydanında yankılandı. Baltık’tan Sibirya’ya, Beyaz Deniz’den bozkıra Novgorod’un sancağı tüm Rusya’da dalgalanıyor. Ticaret cumhuriyeti tarihin en büyük imparatorluklarından birini inşa etti. Tarih yeniden yazıldı."
 nov_events.99.a: "Rus’un Büyük Prensi çok yaşasın! Novgorod ilelebet!"
 STATIC_MODIFIER_NAME_nov_novgorod_city_mod: "Büyük Novgorod Refahı"
 STATIC_MODIFIER_DESC_nov_novgorod_city_mod: "Bir Hansa merkezi olarak Büyük Novgorod geliştirildi ve ticaret gelişiyor."
 STATIC_MODIFIER_NAME_nov_literacy_mod: "Huş Kabuğu Geleneği"
 STATIC_MODIFIER_DESC_nov_literacy_mod: "Okuryazarlık geleneği Novgorod’un entelektüel ve ticari avantajını destekler."
 STATIC_MODIFIER_NAME_nov_hansa_mod: "Hansa Ticareti"
 STATIC_MODIFIER_DESC_nov_hansa_mod: "Kuzey Avrupa’nın en büyük ticaret ağıyla ortaklık kuruldu."
 STATIC_MODIFIER_NAME_nov_fur_mod: "Kürk Ticareti"
 STATIC_MODIFIER_DESC_nov_fur_mod: "Kuzey kürkleri Novgorod aracılığıyla batı Avrupa’ya tedarik ediliyor."
 STATIC_MODIFIER_NAME_nov_pskov_mod: "Pskov’un Büyümesi"
 STATIC_MODIFIER_DESC_nov_pskov_mod: "Pskov Novgorod’un ticari alt başkenti olarak gelişiyor."
 STATIC_MODIFIER_NAME_nov_trade_empire_mod: "Ticaret İmparatorluğu"
 STATIC_MODIFIER_DESC_nov_trade_empire_mod: "Novgorod’un ticaret ağı kuzey Avrupa’yı kaplıyor."
 STATIC_MODIFIER_NAME_nov_russa_mod: "Staraya Russa Tuzu"
 STATIC_MODIFIER_DESC_nov_russa_mod: "Tuz üretim merkezi Staraya Russa geliştirildi."
 STATIC_MODIFIER_NAME_nov_novgorod_secured_mod: "Novgorod Bölgesi Güvence Altında"
 STATIC_MODIFIER_DESC_nov_novgorod_secured_mod: "Novgorod’un öz toprağı tamamen denetleniyor: genişleme için temel kuruldu."
 STATIC_MODIFIER_NAME_nov_tver_mod: "Tver Fethedildi"
 STATIC_MODIFIER_DESC_nov_tver_mod: "Yukarı İdil’deki Tver fethedildi: güney yolu açıldı."
 STATIC_MODIFIER_NAME_nov_yaroslavl_mod: "Yaroslavl Çiçek Açıyor"
 STATIC_MODIFIER_DESC_nov_yaroslavl_mod: "İdil ticaret şehri Yaroslavl Novgorod’a düşer."
 STATIC_MODIFIER_NAME_nov_suzdal_mod: "Suzdal-Vladimir"
 STATIC_MODIFIER_DESC_nov_suzdal_mod: "Kadim Rus ana toprakları Suzdal ve Vladimir bütünleştirildi."
 STATIC_MODIFIER_NAME_nov_defeat_muscovy_mod: "Moskova Yenildi"
