 nov_events.1.t: "Veliky Novgorod: Büyük Cumhuriyet"
 nov_events.1.d: "1337’de Veliky Novgorod (Büyük Novgorod) Cumhuriyeti Rusya’nın en büyük ticaret şehir devletidir.\n\nVolhov Nehri’nin iki yakasına yayılan bu şehir batı yakasındaki “Sofya Yakası” ve doğu yakasındaki “Ticaret Yakası” olarak bölünmüştür. Merkezinde Novgorod’un simgesi Aya Sofya Katedrali yükselir.\n\nVeçe (halk meclisi) en yüce karar organı olarak işlev görür ve Posadnik (belediye başkanı), Tısyatski (milis komutanı) ve Başpiskopos idareyi yürütür.\n\n“Novgorod yalnızca Novgorod’a aittir”: bu cumhuriyeti bir prens veya imparator değil vatandaşların iradesi yönlendirir.\n\nHansa Birliği’nin kontoru (ticaret karakolu) burada kuruludur ve Lübeck ile, Brugge ile, Londra ile ve Bergen ile ticaret gelişir. Kürk, balmumu, keten ve balık Novgorod aracılığıyla batı Avrupa’ya tedarik edilir.\n\nAma Moskova durmadan güçleniyor, Litvanya batıdan baskı yapıyor ve Tatarlar doğuda pusuda bekliyor. Novgorod bu karmaşık güç dengesinden yararlanarak ayakta kaldı. Şimdi bu bilgeliği ve ticari gücü Rus’a hâkim olmayı hedeflemek için kullan."
 nov_events.1.a: "Novgorod’un özgürlüğünü ve refahını savun!"
