 ayy_ayyubid_mission_pack: "Yeni Selahaddin ve Orta Doğu’nun Efendisi"
 ayy_ayyubid_mission_pack_DESCRIPTION:0 "1337’de Eyyubî hanedanı kuzey Suriye’de küçük bir devlet olarak varlığını sürdürüyor. Mısır’ı, Suriye’yi ve Mezopotamya’yı birleştiren ve Haçlıları Kudüs’ten kovan Selahaddin’in (1138-1193) şanını yeniden kazan. Mısır’ı fethet, Kudüs’ü kurtar, Bağdat’ı ele geçir ve Yeni Selahaddin olarak hüküm sürmek için Mekke ve Medine’nin Koruyucusu ol."
 ayy_ayyubid_mission_pack_CRITERIA_DESCRIPTION:0 "Mısır’ı, Levant’ı, Mezopotamya’yı ve Arabistan’ı fethet ve Sünnî İslam’ın koruyucusu olarak Orta Doğu’nun efendisi olarak hüküm sür."
 ayy_ayyubid_mission_pack_BUTTON_TOOLTIP:0 "Orta Doğu’ya Yeni Selahaddin olarak hüküm sür."
 ayy_ayyubid_mission_pack_BUTTON_DETAILS:0 "Kuzey Suriye’deki küçük bir devletten Haçlıları yen, Kudüs’ü geri al ve büyük bir Orta Doğu imparatorluğu inşa et!"
 ayy_rise_of_ayyubids: "Eyyubîlerin Yükselişi"
 ayy_rise_of_ayyubids_desc: "Selahaddin’in mirasçıları olan Eyyubî hanedanı kuzey Suriye’deki küçük bir devletten yeniden kuruluşuna başlıyor."
 ayy_secure_sinai: "Sina’yı Güvenceye Al"
 ayy_secure_sinai_desc: "Sina Yarımadası’nı Mısır ile Levant arasındaki kapı olarak güvenceye al."
 ayy_conquer_lower_egypt: "Aşağı Mısır’ın Fethi"
 ayy_conquer_lower_egypt_desc: "Mısır’ın zengin ana topraklarını ele geçirmek için Nil Deltası’nı ve İskenderiye’yi fethet."
 ayy_seize_cairo: "Kahire’yi Ele Geçir"
 ayy_seize_cairo_desc: "Bin Minareli Şehir Kahire’yi Eyyubî başkenti olarak ele geçir."
 ayy_upper_egypt: "Yukarı Mısır’ın Fethi"
 ayy_upper_egypt_desc: "Yukarı Mısır’ı Asvan şelalelerine kadar fethet ve Nil denetimini tamamla."
 ayy_nile_breadbasket: "Nil’in Tahıl Ambarı"
 ayy_nile_breadbasket_desc: "İmparatorluğu beslemek için bereketli Nil taşkın ovalarından yararlan."
 ayy_dev_cairo: "İmparatorluk Başkenti Kahire’nin İnşası"
 ayy_dev_cairo_desc: "Kahire’yi İslam dünyasının en büyük şehrine dönüştür: Eyyubî İmparatorluğu’nun imparatorluk başkenti."
 ayy_secure_levant: "Levant’ı Güvenceye Al"
 ayy_secure_levant_desc: "Şam merkezli Levant’ı güvenceye al ve Haçlıları kov."
 ayy_seize_aleppo: "Halep’i Ele Geçir"
 ayy_seize_aleppo_desc: "Kuzey Suriye’nin tacı Halep’i ele geçir."
 ayy_reclaim_jerusalem: "Kudüs’ü Geri Al"
 ayy_reclaim_jerusalem_desc: "Selahaddin’in 1187’de yaptığı gibi Kudüs’ü Haçlılardan geri al."
 ayy_coastal_levant: "Kıyı Levant’ı"
 ayy_coastal_levant_desc: "Deniz ticaretini denetlemek için Levant’ın Akdeniz kıyı şehirlerini ele geçir."
 ayy_antioch: "Antakya’ya Boyun Eğdir"
 ayy_antioch_desc: "Kuzey nüfuzunu genişletmek için kadim büyük şehir Antakya’ya boyun eğdir."
 ayy_jazira: "İlhanlılar’dan Bağımsızlık"
 ayy_jazira_desc: "Dicle ile Fırat arasındaki Cezire bölgesi Moğol İlhanlı nüfuzu altına girmiş durumda. Bu zengin toprağı Eyyubî veya vasal denetimi altına al ve Moğol boyunduruğundan kurtul. Dukalığa yükselmek Eyyubî meşruiyetini yükseltecek."
 ayy_kurdish_highlands: "Kürt Yaylaları"
 ayy_kurdish_highlands_desc: "Selahaddin’in kendi halkı olan Kürt dağ kabilelerini Eyyubî ordusuna kat."
 ayy_iraq_arabi: "Irak-ı Arabî’nin Fethi"
 ayy_iraq_arabi_desc: "Mezopotamya ana topraklarını denetlemek için Irak-ı Arabî’yi fethet."
 ayy_seize_baghdad: "Bağdat’ı Ele Geçir"
 ayy_seize_baghdad_desc: "Barış Şehri Bağdat’ı ele geçir ve Eyyubî üstünlüğünü ilan et."
 ayy_mesopotamia_trade: "Mezopotamya Ticareti"
 ayy_mesopotamia_trade_desc: "Bağdat merkezli Mezopotamya ticaret ağını denetle."
 ayy_hejaz: "Hicaz’a İlerle"
 ayy_hejaz_desc: "Hicaz’a ilerle ve Mekke ile Medine’nin kutsal şehirlerine yaklaş."
 ayy_holy_cities: "Kutsal Şehirlerin Koruyucusu"
 ayy_holy_cities_desc: "İki Kutsal Şehrin, Mekke ve Medine’nin Koruyucusu ol."
 ayy_north_yemen: "Kuzey Yemen"
 ayy_north_yemen_desc: "Kuzey Yemen’i fethet ve Kızıldeniz ticaretine erişim kazan."
 ayy_south_yemen: "Aden Limanı’nı Ele Geçir"
 ayy_south_yemen_desc: "Arap Denizi’nin kapısı Aden limanını ele geçir."
 ayy_arabian_trade: "Arap Denizi Ticareti"
 ayy_arabian_trade_desc: "Hint Okyanusu’nu Akdeniz’e bağlayan Arap ticaret yollarını tekelleştir."
 ayy_madrasa: "Medreseyi Kur"
 ayy_madrasa_desc: "İslam ilmini canlandırmak için imparatorluk genelinde medreseler kur."
 ayy_crusader_wars: "Haçlılara Karşı Kutsal Savaş"
 ayy_crusader_wars_desc: "Eyyubî ordusunu seçkin savaşçılara dönüştürmek için Haçlılara karşı kutsal savaş yürüt."
 ayy_dev_damascus: "Şam’ın Refahı"
 ayy_dev_damascus_desc: "Dünyevî Cennet Şam’ı Eyyubî kültür başkenti olarak geliştir."
 ayy_spice_trade: "Baharat Ticareti"
 ayy_spice_trade_desc: "Hint Okyanusu’ndan Aden üzerinden Avrupa pazarlarına baharat ticaretini tekelleştir."
 ayy_silk_road_control: "İpek Yolu’nu Denetle"
 ayy_silk_road_control_desc: "Doğu-batı kara ticaretine hâkim olmak için Bağdat üzerinden İpek Yolu’nu denetle."
 ayy_kurdish_cavalry: "Kürt Süvari Seçkinleri"
 ayy_kurdish_cavalry_desc: "Kürt süvarisini Eyyubîlerin en iyi savaş gücüne dönüştür."
 ayy_nile_fleet: "Nil Filosu"
 ayy_nile_fleet_desc: "Haçlı ikmal hatlarını kesmek için Nil’de ve Akdeniz’de bir filo inşa et."
 ayy_defeat_crusaders: "Haçlıları Yen"
 ayy_defeat_crusaders_desc: "Selahaddin’in Hıttin’de Haçlı ordusunu yok edişini tekrarla."
 ayy_egypt_navy: "Mısır Donanması"
 ayy_egypt_navy_desc: "Akdeniz’e ve Kızıldeniz’e hâkim olmak için güçlü bir Mısır donanması inşa et."
 ayy_sugar_egypt: "Mısır Şekeri"
 ayy_sugar_egypt_desc: "Mısır’ın şeker üretimini, ortaçağ ticaretinin tatlı altınını tekelleştir."
 ayy_iraq_ajam: "Irak-ı Acemî’ye İlerle"
 ayy_iraq_ajam_desc: "Eyyubî nüfuzunu İran’a genişletmek için Irak-ı Acemî’ye ilerle."
 ayy_build_mosques: "Her Yerde Camiler İnşa Et"
 ayy_build_mosques_desc: "Tüm tebaayı Sünnî İslam altında birleştirmek için imparatorluk genelinde camiler inşa et."
 ayy_sultan_of_egypt_syria: "Mısır ve Suriye Sultanı"
 ayy_sultan_of_egypt_syria_desc: "Mısır, Suriye, Irak ve Hicaz Sultanı’nı, Orta Doğu’nun efendisini ilan et."
 ayy_new_saladin: "Yeni Selahaddin"
 ayy_new_saladin_desc: "Yeni Selahaddin olarak hüküm sür: Orta Doğu’nun efendisi, Selahaddin’in mirasının halefi."
 ayy_events.1.t: "Eyyubîlerin Yükselişi: Selahaddin’in Yemini"
 ayy_events.1.d: "Allah adına: 1337’de Eyyubî hanedanı küçük bir devlet olarak varlığını sürdürüyor, ama Selahaddin’in ruhu damarlarında akıyor. Hıttin Muharebesi’nin (1187) ve Kudüs’ün kurtuluşunun hatırası Eyyubî Sultanı’nı ileri sürüyor. Mısır’ı fethet, kutsal şehri kurtar, Mekke’yi koru: Yeni Selahaddin, Orta Doğu’nun efendisi ol."
 ayy_events.1.a: "Allah yolunda: Kalkın, Eyyubîler!"
 ayy_events.10.t: "Kudüs’ün Kurtuluşu: Kutsal Şehir İslam’a Dönüyor"
 ayy_events.10.d: "Allahu Ekber! Selahaddin’in 1187’deki büyük başarısı tekrarlandı. Kudüs Müslüman ellere döndü. Kubbetü’s-Sahra ve Kutsal Mescit bir kez daha İslam duasıyla çınlıyor. İslam dünyası sevinç içinde."
 ayy_events.10.a: "Kudüs çok yaşasın! Allah adına!"
 ayy_events.20.t: "Bağdat’a Giriş: İslam Dünyasının Kalbine"
 ayy_events.20.d: "Barış Şehri Bağdat: Eyyubî kuvvetleri bir zamanlar Abbasî halifelerinin hüküm sürdüğü şehre girdi. İnsanlar “Selahaddin’in halefi geldi!” diye haykırıyor. Bağdat’ın kültürü ve ilmi Eyyubî himayesi altında çiçek açıyor."
 ayy_events.20.a: "Bağdat çok yaşasın! İslam’ın şanı çok yaşasın!"
 ayy_events.30.t: "İki Kutsal Şehrin Koruyucusu: Mekke ve Medine’yi Koru"
 ayy_events.30.d: "Mekke ve Medine: Hz. Muhammed’in kutsal yerleri Eyyubî himayesi altına girdi. “Hâdimü’l-Haremeyni’ş-Şerîfeyn”: bu unvan Eyyubî Sultanı’na verilir ve tüm İslam dünyası tarafından tanınır."
 ayy_events.30.a: "İki Kutsal Şehrin Koruyucusu olarak: Allah adına!"
 ayy_events.60.t: "Mısır ve Suriye Sultanı: Orta Doğu’nun Efendisi"
 ayy_events.60.d: "Kahire sarayında ilan edildi: “Mısır, Suriye, Irak ve Hicaz Sultanı, Eyyubî hanedanının Efendisi.” Kudüs, Bağdat, Mekke ve Kahire hep Eyyubî sancağı altında birleşti. Selahaddin’in zamanından beri süren hayal gerçekleşti."
 ayy_events.60.a: "Sultan çok yaşasın! Eyyubîler çok yaşasın!"
 ayy_events.99.t: "Yeni Selahaddin: Orta Doğu’nun Ebedî Efendisi"
 ayy_events.99.d: "“Salâhaddîn Eyyûbî: İnancın Doğruluğu, Orta Doğu’nun Efendisi”: bu unvan tarihe kazındı. Mısır’daki Nil’den Mezopotamya’daki Dicle’ye, Arap çölünden Anadolu dağlarına tüm topraklar Eyyubî sancağı altında birleşti."
 ayy_events.99.a: "Yeni Selahaddin çok yaşasın! Eyyubî İmparatorluğu çok yaşasın!"
