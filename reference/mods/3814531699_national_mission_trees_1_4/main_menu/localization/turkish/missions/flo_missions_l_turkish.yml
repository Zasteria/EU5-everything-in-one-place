l_turkish:
 flo_magnifico_mission_pack: "Il Magnifico’nun Mirası"
 flo_magnifico_mission_pack_DESCRIPTION:0 "Olağanüstü Medici hanedanı altındaki Floransa Cumhuriyeti ticarette, sanatta ve ilimde tüm Avrupa’ya öncülük eder. Yün ticaretinin ve Medici Bankası’nın yarattığı muazzam servet üzerine inşa edip Rönesans’ın beşiği olarak çiçek açacak mısın? Yoksa Toskana’yı birleştirip Roma’ya yürüyecek ve İtalya’nın efendisi, Il Magnifico mu olacaksın? Floransa’da tüccarın bilgeliği ve prensin emeli buluşur."
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION:0 "Floransa olarak görevleri tamamla ve hem gelişen ticareti ve kültürü hem İtalya’nın fethini başar."
 flo_magnifico_mission_pack_BUTTON_TOOLTIP:0 "Il Magnifico’nun mirasında yürümek için görevleri tamamla."
 flo_magnifico_mission_pack_BUTTON_DETAILS:0 "Rönesans çiçek açsın, Toskana’ya hâkim ol ve İtalya’nın efendisi ol!"
 flo_rise_of_the_commune: "Komün’ün Yükselişi"
 flo_rise_of_the_commune_desc: "1337’de Floransa, Güelf (papalık yanlısı hizip) ile Gibel (imparatorluk yanlısı hizip) arasındaki mücadele içinde bir “Comune”, yani tüccarların ve zanaatkârların özyönetimli şehir devleti olarak büyüdü. Bardi ve Peruzzi bankaları Avrupa maliyesine hâkim ve Arno boyunca yün ticareti şehri zenginleştiriyor. Yine de iç hizip çekişmeleri dinmiyor. Bu çalkantı çağını aş ve Floransa’yı gerçek büyüklüğe taşı."
 flo_the_prince: "Prens"
 flo_the_prince_desc: "İtalya Savaşları sırasında yabancı güçler İtalya’yı harap ederken Floransalı diplomat Niccolò Machiavelli “Prens”i yazdı. Siyasi gerçekliğe soğuk gözlerle bakan devrimci bir eser olarak İtalya’yı birleştirebilecek yeni bir hükümdar için derin bir özlem dile getirdi."
 flo_arte_della_lana: "Yün Sanayisi"
 flo_arte_della_lana_desc: "Arte della Lana, yani yün tüccarları loncası, Floransa ekonomisinin çekirdeğidir. İngiliz yünü ithal edip bitmiş kumaşı tüm Avrupa’ya ihraç ederek şehri büyük kılan serveti yaratır."
 flo_medici_bank: "Medici Bankası’nın Kuruluşu"
 flo_medici_bank_desc: "Medici ailesinin kurduğu banka Roma papalığının resmî bankası olarak işlev görür ve şubeleri tüm Avrupa’ya yayılmıştır. Bu mali güç, Floransa’nın hem kültürde hem siyasette nüfuzunu kullandığı temeldir."
 flo_arno_renewal: "Arno’nun Yenilenmesi"
 flo_arno_renewal_desc: "Şehir geliştikçe Arno boyunca çalışmalar ilerledi ve Floransa İtalya’nın en müreffeh şehirlerinden biri oldu. Yüksek gelişim seviyesi şehrin aylık büyümesine kalıcı bir destek getirir."
 flo_arno_corridor: "Arno Üzerindeki Koridor"
 flo_arno_corridor_desc: "Ponte Vecchio ve Arno Nehri’ni aşan kanallar Floransa’nın ticari ve idari damarlarıdır. Köprüler ve su taşımacılığı kurmak şehrin gelişimini hızlandıracaktır."
 flo_arno_trade_network: "Arno Ticaret Ağı"
 flo_arno_trade_network_desc: "Arno Nehri boyunca Toskana’ya yayılan ticaret ağı Floransa’nın ticari gücünün kaynağıdır. Bu ağa hâkim olarak kuzey İtalya’nın tüm ticaretini denetimimiz altına alabiliriz."
 flo_dominate_italian_trade: "İtalyan Ticaretine Hâkim Ol"
 flo_dominate_italian_trade_desc: "Floransa’nın ticaret ağı artık tüm İtalya’yı kaplıyor. Kuzeyden güneye İtalyan ekonomisi Floransalı tüccarlar olmadan işleyemez."
 flo_duomo_di_firenze: "Santa Maria del Fiore"
 flo_duomo_di_firenze_desc: "Brunelleschi’nin kubbesinin tamamlanması, çağının mimari teknolojisinin sınırlarını zorlayan bir başarıdır. Büyük kubbesi Floransa vatandaşlarını derin bir gururla doldurur ve şehrin ebedî simgesi olmuştur."
 flo_birthplace_of_renaissance: "Rönesans’ın Doğum Yeri"
 flo_birthplace_of_renaissance_desc: "Floransa Rönesans’ın doğum yeri olarak tüm Avrupa’nın entelektüel yenilenmesine öncülük eder. Klasik antikiteye dönüş ve hümanizm ruhu bu şehirde sağlam kök salmıştır."
 flo_florentine_school_of_painting: "Floransa Resim Okulu"
 flo_florentine_school_of_painting_desc: "Botticelli ve diğerlerinin kurduğu Floransa resim tarzı, perspektifte ve gerçekçilikte tüm Avrupa’nın önündedir."
 flo_the_mona_lisa: "Mona Lisa"
 flo_the_mona_lisa_desc: "Leonardo da Vinci’nin başyapıtı resim kavramını kökten değiştirdi. Böyle bir dehayı üretmeyi sürdüren Floransa’nın sanat toprağı eşsizdir."
 flo_uffizi: "Uffizi"
 flo_uffizi_desc: "Medici ailesinin biriktirdiği sanat koleksiyonunu bir araya getiren Uffizi dünyanın en büyük müzesi olabilir. Kültürel prestiji Floransa’nın adını kalıcı olarak yükseltecek."
 flo_the_rise_of_medici: "Medici’lerin Yükselişi"
 flo_the_rise_of_medici_desc: "Bardi ve Peruzzi ailelerinin çöküşünden sonra yeni bir bankacı hanedan yükseliyordu: Medici’ler. 1397’de Giovanni di Bicci de’ Medici tarafından kurulan Medici Bankası, Roma papalığıyla ilişkisinin gücüyle hızla büyüdü ve şubelerini tüm Avrupa’ya yaydı. Bu aile Floransa’nın geleceğini taşıyacak."
 flo_pazzi_conspiracy: "Pazzi Suikastı"
 flo_pazzi_conspiracy_desc: "Papa IV. Sixtus ve Pazzi ailesinin desteklediği Lorenzo de’ Medici’ye suikast girişimi başarısızlıkla sonuçlandı ve paradoksal biçimde yalnızca Medici otoritesini pekiştirdi."
 flo_machiavelli: "Machiavelli’nin Yazıları"
 flo_machiavelli_desc: "“Prens”te Niccolò Machiavelli iktidarın gerçekliğini soğukkanlılıkla çözümledi. Düşüncesi Floransa siyaset felsefesini derinden etkilemiştir."
 flo_republic_of_virtue: "Erdem Cumhuriyeti"
 flo_republic_of_virtue_desc: "Floransa salt bir ticaret devleti değil, erdeme ve cumhuriyetçi ideallere dayalı bir devlet olmayı arzular. Meşruiyet ve istikrar cumhuriyetin temel taşlarıdır."
 flo_camerata_fiorentina_nmt: "Camerata Fiorentina"
 flo_camerata_fiorentina_nmt_desc: "Floransalı aydınların ve müzisyenlerin toplandığı Camerata, operanın doğuşuna yol açacak müzikal yeniliğin kaynağı oluyor. Sanatın ve bilimin bir bütün olarak çiçek açtığı bir şehir."
 flo_subjugate_pisa: "Piza’ya Boyun Eğdir"
 flo_subjugate_pisa_desc: "Floransa’nın uzun süredir denize açılan kapısı olarak göz diktiği liman şehri Piza güvenceye alınmalıdır. Arno üzerindeki bu limana komuta etmek Floransa’nın ticari erişimini büyük ölçüde genişletecek."
 flo_siena_submitted: "Siena’nın Boyun Eğişi"
 flo_siena_submitted_desc: "Uzun süreli rakibimiz Siena nihayet diz çöktürüldü. Montaperti’nin utancının öcü alındığında Floransa ipek tüccarlarını ve bankacılarını özümser ve güney Toskana’nın tam denetimini güvenceye alır."
 flo_lucca_absorbed: "Lucca Özümsendi"
 flo_lucca_absorbed_desc: "Bağımsızlığını uzun süredir koruyan Lucca, Floransa’nın Toskana’yı birleştirmesinin önündeki son engellerden biridir. İpek sanayisini Floransa otoritesi altına al."
 flo_unify_tuscany: "Toskana’yı Birleştir"
 flo_unify_tuscany_desc: "Toskana’nın neredeyse tamamı Floransa denetimine girdiğine göre krallığa yükselmek doğal bir sonuçtur. Floransa artık salt bir şehir devleti değil."
 flo_push_into_lombardy: "Lombardiya’ya İlerle"
 flo_push_into_lombardy_desc: "Toskana’nın ötesinde egemenlik alanımızı kuzey İtalya’nın kalbine genişletme vakti geldi. Milano, Cenova ve Venedik ile çatışma kaçınılmaz."
 flo_march_on_rome: "Roma’ya Yürüyüş"
 flo_march_on_rome_desc: "Roma’yı denetleyen İtalya’yı denetler. Roma İmparatorluğu’nun kadim başkentini egemenlik alanımıza katarak Floransa hiçbirinin boy ölçüşemeyeceği bir meşruiyet iddiasında bulunur."
 flo_the_new_rome: "Yeni Roma"
 flo_the_new_rome_desc: "Roma’yı fetheden Floransa artık İtalya Yarımadası’nın çoğuna hâkim ve bir imparatorluk oldu. Yeni bir Roma inşa etme vakti geldi."
 flo_il_magnifico_of_italy: "İtalya’nın Il Magnifico’su"
 flo_il_magnifico_of_italy_desc: "Lorenzo de’ Medici’ye “Il Magnifico” denildiği gibi tüm Floransa artık İtalya’nın “Muhteşem Olan”ı oldu."
 flo_medici_oriental_press: "Medici Doğu Matbaası"
 flo_medici_oriental_press_desc: "Medici ailesinin kurduğu matbaa, Bizans İmparatorluğu’nun düşüşünden sonra akın eden Yunanca el yazmalarını toplar ve basar. Kadim bilgi Avrupa’ya bir kez daha yeni bir hayat veriyor."
 flo_clock_tower: "Piazza della Signoria Saat Kulesi"
 flo_clock_tower_desc: "Palazzo della Signoria’ya yerleştirilen hassas saat kulesi Floransa’nın teknik ustalığının simgesi oldu. Zamanın yönetimi ticaretin ve yönetimin verimliliğini artırır."
 flo_first_modern_engineer: "İlk Modern Mühendis"
 flo_first_modern_engineer_desc: "Filippo Brunelleschi kubbeyi inşa ederken antik Roma’yı aşan devrimci yapım yöntemleri geliştirdi. Teknik mirası tüm İtalya’daki kale yapımında uygulanacak."
 flo_humiliate_venice: "Venedik’i Küçük Düşür"
 flo_humiliate_venice_desc: "Uzun süreli denizci rakibimiz Venedik Cumhuriyeti’ni aşma vakti geldi. Adriyatik’in Kraliçesi’ni yerine oturtarak Floransa’nın İtalya’nın önde gelen ulusu olduğunu kanıtlayacağız."
 flo_papal_relations: "Papalıkla İlişkiler"
 flo_papal_relations_desc: "Roma güvence altına alındığına göre papalıkla ilişkiler sağlam bir zemine oturtulmalı. İttifak ya da hâkimiyet yoluyla Floransa Roma Kilisesi’nin en büyük hamisi olacak."
 flo_vasari_corridor: "Uffizi ve Vasari Koridoru"
 flo_vasari_corridor_desc: "Uffizi Sarayı’nı Ponte Vecchio’ya bağlayan Vasari Koridoru, I. Cosimo de’ Medici’nin emriyle Giorgio Vasari tarafından tasarlandı. Bu gizli yükseltilmiş yürüyüş yolu Medici’lerin otoritesini ve sanatsal üstünlüğünü simgeler."
 flo_academy_of_florence: "Floransa Akademisi"
 flo_academy_of_florence_desc: "Floransa’da kurulan akademi sanatta, bilimde ve felsefede kapsamlı araştırmaların yapıldığı bir yer oldu. Rönesans’ın bilgisi buradan dünyaya yayılıyor."
 flo_italian_cultural_hegemon: "İtalyan Kültürel Hegemonu"
 flo_italian_cultural_hegemon_desc: "Ticaretin, sanatın ve ilmin bir bütün olarak çiçek açtığı Floransa tüm İtalya’nın kültür merkezi oldu. Etkisi Alpler’in ötesine bile uzanıyor."
 flo_magnifico: "Il Magnifico"
 flo_magnifico_desc: "Bir tüccarlar şehrinden Floransa kültürün zirvesine yükseldi, tüm İtalya’yı fethetti ve Roma İmparatorluğu’nun halefi olarak kendini kurdu. “Il Magnifico”: Muhteşem Olan’ın adı tarihe ebediyen kazındı."
 STATIC_MODIFIER_NAME_flo_arte_della_lana_mod: "Gelişen Yün Sanayisi"
 STATIC_MODIFIER_DESC_flo_arte_della_lana_mod: "Arte della Lana (yün loncası) Floransa’nın en büyük loncası ve şehrin refahının temeliydi. İngiltere’den ve İspanya’dan ithal edilen ham yünden ince işlenen kumaş tüm Avrupa’da kıymetliydi ve Medici’lerin muazzam servetinin kaynağı oldu."
 STATIC_MODIFIER_NAME_flo_medici_bank_mod: "Medici Bankası’nın Üstünlüğü"
 STATIC_MODIFIER_DESC_flo_medici_bank_mod: "1397’de Giovanni di Bicci de’ Medici tarafından kurulan Medici Bankası zirvesinde Roma, Venedik, Londra ve Brugge dahil on altı şehirde şubelere sahipti. Papalık sarayının resmî bankası olarak muazzam kâr elde etti ve Kilise’nin tefeciliğe yasağını “kambiyo kârları” kılığı altında dolandı."
 STATIC_MODIFIER_NAME_flo_arno_trade_network_mod: "Arno Ticaret Ağı"
 STATIC_MODIFIER_DESC_flo_arno_trade_network_mod: "Arno, Floransa’yı Piza deniz limanına bağlayan büyük su trafiği damarıydı. Boyundaki ticaret yollarına komuta ederek Floransa, iç kesimde bir şehir olmasına rağmen Akdeniz ticaretine doğrudan katıldı ve kumaşı, bankacılığı ve ticareti birleştiren kendine özgü bir ekonomik alan oluşturdu."
 STATIC_MODIFIER_NAME_flo_dominate_italian_trade_mod: "İtalyan Ticaretine Hâkimiyet"
 STATIC_MODIFIER_DESC_flo_dominate_italian_trade_mod: "Geç ortaçağ İtalya’sı Avrupa’nın en büyük ticaret bölgesiydi ve zirvesinde Floransa, Venedik ve Cenova tüccarları vardı. Floransalı tüccarlar tüm kuzey Avrupa’ya bir mali ağ ördü ve İngiltere ile Fransa arasındaki Yüz Yıl Savaşları’nda her iki tarafa da borç verecek kadar nüfuz kullandı."
 STATIC_MODIFIER_NAME_flo_duomo_di_firenze_mod: "Katedralin Tamamlanışı"
 STATIC_MODIFIER_DESC_flo_duomo_di_firenze_mod: "Floransa Katedrali’nin (Santa Maria del Fiore) kubbesi 1436’da Brunelleschi tarafından tamamlandı. Devrimci bir mühendislik başarısı: Roma’daki Pantheon’dan beri bin yılı aşkın sürede kimsenin başaramadığı, ahşap kalıp ve iskele olmadan inşa edilmiş geniş bir kubbe. Rönesans ruhunu simgeler."
 STATIC_MODIFIER_NAME_flo_birthplace_of_renaissance_mod: "Rönesans’ın Doğum Yeri"
 STATIC_MODIFIER_DESC_flo_birthplace_of_renaissance_mod: "“Rönesans”, yeniden doğuş, Floransa’da doğdu. Cosimo de’ Medici’nin kurduğu Platon Akademisi’nde Marsilio Ficino ve diğerleri antik Yunan ve Roma düşüncesini canlandırdı ve Dante’nin, Petrarca’nın ve Boccaccio’nun edebî geleneğiyle birleşerek Batı uygarlığını temellerinden dönüştürdü."
 STATIC_MODIFIER_NAME_flo_florentine_school_of_painting_mod: "Floransa Resim Okulu"
 STATIC_MODIFIER_DESC_flo_florentine_school_of_painting_mod: "13. yüzyılın sonunda Giotto di Bondone’nin kurduğu gerçekçi resim geleneği Masaccio’nun perspektifine, Botticelli’nin zarafetine ve Leonardo’nun çok yönlülüğüne aktarıldı. Floransa resmi ortaçağ kutsal imgelerinden modern sanata geçişi somutlaştırdı ve Avrupa resminin yönünü belirledi."
 STATIC_MODIFIER_NAME_flo_the_mona_lisa_mod: "Mona Lisa’nın Etkisi"
 STATIC_MODIFIER_DESC_flo_the_mona_lisa_mod: "Yaklaşık 1503-1519’da Leonardo da Vinci tarafından yapılan, esrarengiz gülümsemesi ile yenilikçi perspektifi ve sfumato tekniğiyle “Mona Lisa” Batı sanat tarihinin en ünlü eseri oldu. Leonardo yalnızca resmi değil anatomiyi, mühendisliği, mimariyi ve müziği de kapsayan evrensel bir dahiydi."
 STATIC_MODIFIER_NAME_flo_uffizi_mod: "Uffizi’nin Şanı"
 STATIC_MODIFIER_DESC_flo_uffizi_mod: "I. Cosimo de’ Medici’nin 1560’ta Vasari’ye tasarlattığı Uffizi Sarayı başta bir idari büroydu (uffizi “bürolar” demek), ama Medici koleksiyonlarını barındırır hâle geldi ve dünyanın ilk müzelerinden biri oldu: Botticelli’nin, Leonardo’nun ve Michelangelo’nun eserlerinin toplandığı bir sanat tapınağı."
 STATIC_MODIFIER_NAME_flo_machiavelli_mod: "Prens’in Dersleri"
 STATIC_MODIFIER_DESC_flo_machiavelli_mod: "Niccolò Machiavelli 1498’den 1512’ye Floransa Cumhuriyeti’ne diplomat ve idareci olarak hizmet etti. Medici’lerin sürülmesinden sonra yazılan “Prens”, “amaç aracı haklı kılar” görüşünü savunan gerçekçi bir siyasi düşünce eseriydi ve modern siyaset teorisinin temeli oldu."
 STATIC_MODIFIER_NAME_flo_republic_of_virtue_mod: "Erdem Cumhuriyeti"
 STATIC_MODIFIER_DESC_flo_republic_of_virtue_mod: "Floransa, Medici’ler gerçekte hâkimken cumhuriyetçi bir cepheyi sürdüren eşsiz bir yönetim biçimine sahipti. Signoria (şehir hükümeti), Priori (sulh hâkimleri) ve Büyük Konsey gibi kurumlar cumhuriyetçilik idealini oligarşi gerçeğiyle ustaca kaynaştırdı."
 STATIC_MODIFIER_NAME_flo_camerata_fiorentina_mod: "Camerata Fiorentina"
 STATIC_MODIFIER_DESC_flo_camerata_fiorentina_mod: "1570’lerde ve 1580’lerde Floransa’da Kont Giovanni de’ Bardi’nin konutunda toplanan müzisyenler, şairler ve aydınlar çevresi “Camerata”, antik Yunan dramasını canlandırmayı amaçladı. Deneyleri tamamen yeni bir sanat biçimi olan operayı doğurdu ve Batı müziğinin tarihini sonsuza dek değiştirdi."
 STATIC_MODIFIER_NAME_flo_subjugate_pisa_mod: "Piza Limanı"
 STATIC_MODIFIER_DESC_flo_subjugate_pisa_mod: "Piza bir zamanlar Venedik ve Cenova ile birlikte bir denizci cumhuriyet olarak Akdeniz’e hükmetti, ama 1284’te Meloria Muharebesi’nde Cenova’ya karşı ezici yenilgisinden sonra geriledi. Floransa’nın 1406’da Piza’yı fethetmesiyle bir zamanlar denize kıyısı olmayan Floransa nihayet denize bir çıkış kazandı."
 STATIC_MODIFIER_NAME_flo_siena_submitted_mod: "Siena’nın Boyun Eğişi"
 STATIC_MODIFIER_DESC_flo_siena_submitted_mod: "Siena Floransa’nın geleneksel rakibiydi ve Toskana’daki hegemonya konusunda uzun süre çatıştı. Siena İspanya’nın desteğiyle bağımsızlığını korudu, ama sonunda 1555’te düştü. Palio at yarışıyla bilinen gururlu Sienalıları Floransa yönetimi altına almak Toskana birliğinin simgesidir."
 STATIC_MODIFIER_NAME_flo_lucca_absorbed_mod: "Lucca’nın İpeği ve Kumaşı"
 STATIC_MODIFIER_DESC_flo_lucca_absorbed_mod: "Lucca, Toskana’nın en rafine ipek sanayisine sahip şehriydi. 13. ve 14. yüzyıllarda Lucca ipeği tüm Avrupa’da kıymetliydi ve prenslerin ve soyluların giysilerini süsledi. Medici’lerin rakibi Lucca bankacılarının serveti de kayda değerdir."
 STATIC_MODIFIER_NAME_flo_unify_tuscany_mod: "Toskana’nın Efendisi"
 STATIC_MODIFIER_DESC_flo_unify_tuscany_mod: "Etrüsklerin kadim şehri Arezzo, şiirin şehri Siena, zanaatın kasabası Lucca, liman Piza: onları birleştirerek Floransa Toskana’nın tarihî, kültürel ve coğrafi bir bütün olarak merkezi olur. Bu, Roma’nın “Tuscia”sını Medici sancağı altında yeniden birleştirme işidir."
 STATIC_MODIFIER_NAME_flo_push_into_lombardy_mod: "Lombardiya’ya İlerleyiş"
 STATIC_MODIFIER_DESC_flo_push_into_lombardy_mod: "Floransa ve Milano 15. yüzyıl İtalyan siyasetinin iki büyük gücüydü ve daima gerilim içindeydi. Milano’nun Visconti ve Sforza dükalarının yayılmacı politikalarına karşı Floransa diplomasi ve paralı asker bölükleri komutanları condottieri ile direndi. Bu güç dengesi Rönesans diplomasisinin inceliğini doğurdu."
 STATIC_MODIFIER_NAME_flo_the_new_rome_mod: "Yeni Roma"
 STATIC_MODIFIER_DESC_flo_the_new_rome_mod: "Floransa sıklıkla “Yeni Roma” olarak anıldı. Cosimo ve Lorenzo de’ Medici Roma’nın himaye kültürünü bilinçli olarak taklit etti ve antik Roma’nın erdemlerini Rönesans ruhuyla yeniden yaratmaya çalıştı. Roma’nın kendisine hükmetmek bu amacın simgesel tamamlanışıdır."
 STATIC_MODIFIER_NAME_flo_il_magnifico_of_italy_mod: "İtalya’nın Il Magnifico’su"
 STATIC_MODIFIER_DESC_flo_il_magnifico_of_italy_mod: "Lorenzo de’ Medici (Muhteşem Lorenzo, 1449-1492) sanatçı, şair, diplomat ve devlet adamı olarak çağının zirvesinde durdu. “İtalya’nın dengesi” dediği güç dengesi politikası İtalya Savaşları’nın arifesinde barışı sürdürdü ve sarayı Rönesans kültürünün en ince parıltısını verdi."
 STATIC_MODIFIER_NAME_flo_medici_oriental_press_mod: "Doğu Bilgisinin Mirası"
 STATIC_MODIFIER_DESC_flo_medici_oriental_press_mod: "1438-1439 Floransa Konsili’nde Cosimo de’ Medici Bizans’tan gelen bilginlerden çok sayıda Yunanca el yazması satın aldı. Bu toplama Platon’un Latinceye çevrilmesine ve Yeni Eflatunculuğun canlanmasına yol açtı ve Batı düşüncesinin tarihini değiştirdi. Gutenberg’in matbaa devrimiyle birleşerek bilgi hızla yayıldı."
 STATIC_MODIFIER_NAME_flo_clock_tower_mod: "Saat Kulesinin Hassasiyeti"
 STATIC_MODIFIER_DESC_flo_clock_tower_mod: "Mekanik saatler 14. yüzyılda kuzey İtalya şehirlerinin meydanlarında belirmeye başladı. Giotto’nun tasarladığı Floransa Katedrali çan kulesi (campanile) tipik bir örnektir. Ortak zaman tutma bir şehrin ticaretini ve idaresini birleştirdi ve ortaçağdan modern çağa geçişi destekleyen altyapı oldu."
 STATIC_MODIFIER_NAME_flo_the_rise_of_medici_mod: "Medici’lerin Yükselişi"
 STATIC_MODIFIER_DESC_flo_the_rise_of_medici_mod: "Cosimo de’ Medici (Pater Patriae denen, 1389-1464) bankacılık kârlarının gücüyle siyasi düşmanlarını sürgün etti ve Floransa’nın fiilî hükümdarı oldu. Papalık sarayının haznedarı, sanatın hamisi ve diplomaside hakem olarak Medici Hanedanı’nın şanının temelini attı."
 STATIC_MODIFIER_NAME_flo_first_modern_engineer_mod: "Modern Mühendisliğin Öncüsü"
 STATIC_MODIFIER_DESC_flo_first_modern_engineer_mod: "Filippo Brunelleschi (1377-1446) mimariye, heykele ve mühendisliğe devrim getirdi. Doğrusal perspektifi teorileştirdi ve yenilikçi çift kabuklu yapı ve çerçeveleme teknikleriyle Floransa Katedrali’nin büyük kubbesini gerçekleştirdi. Rönesans’ın “evrensel insan”ının (uomo universale) arketipidir."
 STATIC_MODIFIER_NAME_flo_humiliate_venice_mod: "Venedik’in Küçük Düşürülmesi"
 STATIC_MODIFIER_DESC_flo_humiliate_venice_mod: "Ortaçağ İtalya’sının iki büyük ticaret gücü Floransa ve Venedik refahta yarıştı ve uzun süre hem diplomatik hem askerî olarak ters düştü. 15. yüzyılda Milano’ya doğru genişleme üzerindeki çatışma özellikle şiddetliydi ve Floransa Venedik’in kara tabanlı genişlemesini (Terraferma politikası) daima bir tehdit olarak hissetti."
 STATIC_MODIFIER_NAME_flo_papal_relations_mod: "Papalıkla Bağ"
 STATIC_MODIFIER_DESC_flo_papal_relations_mod: "Medici’ler ile papalık sarayı arasındaki ilişki karmaşıktı. 1478 Pazzi komplosunun (Başpiskopos Francesco Salviati’nin de karıştığı bir suikast planı) Lorenzo’nun kardeşi Giuliano’yu öldürmesinden sonra Lorenzo bir süre IV. Sixtus ile ters düştü, ama sonra barıştı ve sağlam bir ilişki yeniden kurdu."
 STATIC_MODIFIER_NAME_flo_academy_of_florence_mod: "Floransa Akademisi"
 STATIC_MODIFIER_DESC_flo_academy_of_florence_mod: "Cosimo de’ Medici’nin desteklediği Platon Akademisi, Marsilio Ficino önderliğinde antik felsefenin canlandırılmasını üstlendi. Platon’un bütün eserlerinin Latince çevirisi, Hermetik külliyatın çevirisi, Yeni Eflatunculuğun sistemleştirilmesi: bu entelektüel girişimler Batı felsefesinin, ilahiyatının ve biliminin temellerini yeniledi."
 STATIC_MODIFIER_NAME_flo_italian_cultural_hegemon_mod: "İtalyan Sanatının Himayesi"
 STATIC_MODIFIER_DESC_flo_italian_cultural_hegemon_mod: "Rönesans Floransa’sı tüm Avrupa için kültürel ağırlık merkeziydi. Fransa’nın, Hollanda’nın, Almanya’nın ve İngiltere’nin prensleri ve soyluları Floransalı sanatçıları, mimarları ve bilginleri çağırdı ve “İtalyan tarzı” saray kültürünü taklit etmek için yarıştı."
 STATIC_MODIFIER_NAME_flo_magnifico_mod: "Il Magnifico’nun Şanı"
 STATIC_MODIFIER_DESC_flo_magnifico_mod: "“Il Magnifico”, yalnızca tek bir adamın değil tüm Floransa şehrinin parlaklığını ifade eden bir deyimdir. Sanatta, felsefede, diplomaside ve maliyede Avrupa’nın zirvesinde duran Floransa’nın şanı, sonraki nesillerin “Rönesans” dediği çağın özünü somutlaştırır."
 flo_events.1.t: "Floransa Komünü’nün Yükselişi"
 flo_events.1.d: "1337’de Floransa Güelf ve Gibel hizipleri arasındaki uzun mücadelenin içinde sıkışmış. İngiltere Kralı’na verilen muazzam borçların altında ezilen Bardi ve Peruzzi ailelerinin büyük bankaları sendelemeye başlıyor. Kara Ölüm’ün gölgesi doğudan sürünüyor ve zorba Walter de Brienne’i davet etmeyi planlayanlar var. Yine de Floransa Komünü’nün, yani tüccarların özyönetimli şehrinin ruhu yaşıyor. Yün ticaretinin ve tüccar loncalarının temeli üzerinde bu fırtınalar çağından sağ çık."
 flo_events.1.a: "Floransa’nın geleceği ellerimizde"
 flo_events.3.t: "Pazzi Suikastı’nın Ardından"
 flo_events.3.d: "Papa IV. Sixtus ve Pazzi ailesinin desteklediği Lorenzo de’ Medici’ye suikast girişimi başarısızlıkla sonuçlandı ve paradoksal biçimde yalnızca Medici otoritesini pekiştirdi. Komplocular idam edildi ve Floransa vatandaşları Medici’lere desteklerini daha da güçlendirdi. Bu sınavdan sağ çıkan cumhuriyetin siyasi yapısı daha rafine bir şeye dönüşmek üzere."
 flo_events.3.a: "Sınav bizi güçlendirdi"
 flo_events.4.t: "Roma’ya Yürüyüş"
 flo_events.4.d: "Roma İmparatorluğu’nun kadim başkenti artık Floransa’nın sancağı altında duruyor. Konstantin Bağışı’nın zaten sahte olduğu kanıtlandı: öyleyse İtalya’ya hükmetme hakkı meşru olarak güç ve bilgelikle kazanılmış Floransa’ya aittir. Bir tüccarlar şehri olarak doğan bu küçük cumhuriyet şimdi adı tarihe kazınacak bir imparatorluğa giden yolda yürüyor."
 flo_events.4.a: "Roma Floransa’nın şanıyla parlıyor"
 STATIC_MODIFIER_NAME_flo_arno_renewal_mod: "La Grande Opera"
 STATIC_MODIFIER_DESC_flo_arno_renewal_mod: "Arno’nun taşkınları Floransa’yı yıllarca rahatsız etti (1966 taşkını bugün hâlâ anılır). Ama kıyıların iyileştirilmesi, köprülerin yapılması ve setlerin güçlendirilmesiyle nehir şehir için daha çok bir varlık oldu. Nehir boyundaki atölyeler, boyahaneler ve yün yıkama sahaları Floransa ekonomisinin kalbi olarak işlev gördü."
 STATIC_MODIFIER_NAME_flo_arno_corridor_mod: "Ponte Vecchio’nun Refahı"
 STATIC_MODIFIER_DESC_flo_arno_corridor_mod: "Ponte Vecchio (Eski Köprü) Arno üzerindeki en eski köprüdür ve 14. yüzyıldan beri kuyumcuların ve mücevhercilerin dükkânlarıyla dizilmiş Floransa ticaretinin simgesi olmuştur. I. Cosimo’nun Uffizi’yi Pitti Sarayı’na bağlamak için yaptırdığı Vasari Koridoru’nun bir parçası olarak yenilenerek hükümdarı şehre bağlayan simgesel bir geçit oldu."
 STATIC_MODIFIER_NAME_flo_vasari_corridor_mod: "Vasari Koridoru"
 STATIC_MODIFIER_DESC_flo_vasari_corridor_mod: "Giorgio Vasari tarafından 1565’te yalnızca beş ayda tamamlanan Vasari Koridoru, Uffizi Sarayı’nı Ponte Vecchio üzerinden Pitti Sarayı’na bağlayan yükseltilmiş bir geçittir. I. Cosimo’nun kalabalıklara karışmadan hareket edebilmesi için tasarlanan koridor, bir hükümdarın güvenliğinin ve şehre hâkimiyetin teknik billurlaşmasıdır."
 flo_events.5.t: "Uffizi ve Vasari Koridoru"
 flo_events.5.d: "I. Cosimo de’ Medici mimar Giorgio Vasari’ye Uffizi Sarayı’nı (idare merkezi) gizli yükseltilmiş bir yürüyüş yoluyla Palazzo Pitti’ye bağlamasını emretti. Ponte Vecchio’nun üzerinden geçen bu “Vasari Koridoru”, hükümdarın halk tarafından görülmeden hareket etmesine izin veren gizli bir geçittir: Medici otoritesinin ve şehre hâkimiyetin simgesi. Arno’yu aşan bu dahice mimari Floransa’da siyasetin ve sanatın bir ve aynı olduğunu açıkça gösterir."
 flo_events.5.a: "Koridorun tamamlanması Floransa’nın yönetimini yeni bir boyuta yükseltti"
 STATIC_MODIFIER_NAME_flo_the_prince_mod: "Yeni Prens"
 STATIC_MODIFIER_DESC_flo_the_prince_mod: "“Prens”te (1513) Machiavelli “hem aslanın gücü hem tilkinin kurnazlığı ol” diye vaaz etti. Korkulmanın sevilmekten daha güvenli olduğu ve gerekirse iktidarın sürdürülmesini ahlakın önüne koymak gerektiği gerçekçiliği modern siyaset biliminin başlangıç noktası oldu."
 flo_events.6.t: "Prens"
 flo_events.6.d: "İtalya Savaşları Floransa’ya ağır bir ders verdi. Diplomat Niccolò Machiavelli, iktidarın doğasını çıplak ortaya koyan bir eser olan “Prens”i yazdı. Bölünmüş bir İtalya’yı birleştirmek için gerçek gücü ahlaktan üstün tutan yeni bir hükümdar gerekir. “Hem erdeme hem talihe sahip bir prens kaostaki bir İtalya’yı kurtarabilir”: ve belki de cevap Floransa’nın kendi içinde yatıyor."
 flo_events.6.a: "İtalya’yı kurtaracak yeni bir prens, ortaya çık!"
