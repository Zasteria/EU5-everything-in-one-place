l_turkish:
 pol_jagiellonian_dynasty_mission_pack: "Jagiellon Hanedanı’nın Şanı"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION:0 "1337’de Polonya Krallığı’nı Büyük III. Kazimierz yönetiyor. Varisi Macaristan’ın (Anjou) I. Lajos’u olacak ve Lajos’un kızı Jadwiga Litvanya Büyük Dükü Jagiełło ile evlenerek Polonya-Litvanya şahsi birliğini yaratacak. Kuzeyde Töton Şövalyeleri ile çatışma, güneyde Macaristan ile birlik, Litvanya aracılığıyla doğu genişlemesi ve Bohemya yönünde emeller: bunların hepsini gerçekleştir ve Orta-Doğu Avrupa’nın en büyük soylu cumhuriyetini inşa et."
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION:0 "Polonya olarak her yöne, yani iç meselelerde, doğuda, kuzeyde, güneyde ve batıda genişle ve Polonya Altın Çağı’nı gerçekleştir."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP:0 "Polonya Altın Çağı’nı gerçekleştirmek için görevleri tamamla."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS:0 "Büyük Kazimierz’den Jagiellon Altın Çağı’na: Soylular Cumhuriyeti’ni inşa et!"
 pol_kingdom_of_poland: "Polonya Krallığı"
 pol_kingdom_of_poland_desc: "“Büyük” III. Kazimierz 1333’te tahta çıktı ve Polonya’yı parçalanmış durumundan birleştirdi. Sonraki nesillerin dediği gibi: “Ahşap bir Polonya devraldı, taştan birini bıraktı.” Hukuk reformunu, şehir inşasını ve Yahudilerin korunmasını teşvik etti ve saltanatı ortaçağ Polonya refahının zirvesi sayılır. Meşruiyeti ve istikrarı yükselt ve diyarın temellerini pekiştir."
 pol_integrate_mazovia: "Mazovya’yı Bütünleştir"
 pol_integrate_mazovia_desc: "Mazovya Dukalığı, Piast hanedanının bir yan kolunca yönetilir ve Polonya’nın kalbindeki bereketli ovada yer alır. Varşova’yı ve Lublin’i güvenceye almak ve bu zengin ovayı Polonya Krallığı’na tamamen bütünleştirmek orta Polonya’nın siyasi merkezini kurar. Tarihin 1526’da vereceğini erken ele geçir."
 pol_great_sejm: "Büyük Sejm"
 pol_great_sejm_desc: "Polonya Sejm’i, yani parlamentosu, 13. yüzyıldan beri gelişti. Mağnatların, szlachta’nın (soylular) ve din adamlarının bu zümreler meclisi 15.-16. yüzyıllarda “Altın Özgürlük” (Złota Wolność) kavramını kurdu ve Polonya’yı giderek bir soylu cumhuriyetine dönüştürdü. Sejm’i güçlendir ve kraliyet gücünü soylu hakları ile dengele."
 pol_krakow_renaissance: "Krakov Rönesansı"
 pol_krakow_renaissance_desc: "Krakov Polonya Krallığı’nın başkentidir ve Kopernik’in alma mater’i olan Jagiellon Üniversitesi Orta-Doğu Avrupa’nın en seçkin akademisidir. İtalyan Rönesansı Krakov’a ulaşır ve Wawel Kalesi Rönesans tarzında yeniden inşa edilir. Üniversiteyi geliştir ve Krakov’u Orta-Doğu Avrupa’nın entelektüel merkezi olarak yetiştir."
 pol_jagiellonian_university: "Jagiellon Üniversitesi’nin Çiçeklenmesi"
 pol_jagiellonian_university_desc: "1364’te III. Kazimierz’in kurduğu ve 1400’de Kraliçe Jadwiga’nın yeniden canlandırdığı Jagiellon Üniversitesi, Nicolaus Kopernik’i (1473-1543) ve birçok başka büyük zihni yetiştirdi. Polonya genelinde üniversiteleri genişletmek ilmin ışığını tüm diyara yayar."
 pol_polish_golden_age: "Polonya Altın Çağı"
 pol_polish_golden_age_desc: "Jagiellon Hanedanı altında Polonya 15.-16. yüzyıllarda bir “Altın Çağ” (Złoty Wiek) yaşadı. Kopernik’in güneş merkezciliği, Kochanowski’nin şiiri, Krakov’un sanatı: Polonya yalnızca büyük bir güç değil, bir kültürel öncüydü. Bu altın çağı geniş toprak, zengin gelir ve yüksek prestijle kanıtla."
 pol_jadwiga_union: "Jadwiga ile Jagiełło’nun Evliliği"
 pol_jadwiga_union_desc: "1385 Krewo Birliği, Polonya Kraliçesi Jadwiga ile Litvanya Büyük Dükü Jagiełło’nun (II. Władysław Jagiełło) evliliğini düzenledi. Jagiełło Hıristiyanlığa geçti ve Litvanya’yı Katolikleştirmesi karşılığında Polonya Kralı unvanını iddia etti. Bu evlilik Polonya-Litvanya birlik devletinin başlangıcıydı: iki yüzyıldan fazla sürecek Jagiellon Hanedanı’nın şafağı."
 pol_develop_ruthenia: "Ruthenia’yı Geliştir"
 pol_control_kyiv: "Kiev’in Denetimi"
 pol_control_kyiv_desc: "Kiev, Slav uygarlığının doğum yeri olan Kiev Rusyası’nın başkentiydi. 1240’taki Moğol yıkımından sonra şehir Litvanya yönetimine girdi. Kiev’i ele geçirmek tüm Dinyeper Nehri havzası üzerinde denetim kurar ve Karadeniz’e giden yolu açar."
 pol_push_east: "Doğuya Doğru İlerle"
 pol_push_east_desc: "Minsk Litvanya’nın kalbidir; Smolensk doğu Slav dünyasının hayati bir merkezidir. Moskova Büyük Dukalığı yükselirken bu şehirleri güvenceye almak Polonya-Litvanya birliğini doğu Slav dünyasının hâkim gücü yapar. III. İvan’ın verdiği Smolensk için tarihî mücadele: bu sefer Polonya’nın lehine gelişir."
 pol_eastern_empire: "Doğu İmparatorluğu"
 pol_eastern_empire_desc: "Polonya-Litvanya Ortak Devleti zirvesinde (yaklaşık 1618) Avrupa’nın en büyük devleti oldu. Baltık’tan Pontus Bozkırı’na (Karadeniz) tüm doğu Slav dünyası Polonya bayrağı altında birleşti. Rusya’nın, Osmanlıların ve Habsburgların eşit derecede korktuğu büyük doğu imparatorluğunu inşa et."
 pol_prussian_confederation: "Prusya Konfederasyonu ve Töton Şövalyeleri"
 pol_prussian_confederation_desc: "13. yüzyılda Baltık paganlarını fetheden Töton Tarikatı, Polonya’nın ezelî düşmanı oldu. 1410’da Grunwald’da Polonya-Litvanya ordusu onları tamamen ezdi. Polonya himayesi arayan Prusyalı kasabalıların Prusya Konfederasyonu’nun desteğiyle Töton Tarikatı’nı yen ve Polonya’nın Baltık Denizi’ne çıkışını güvenceye al."
 pol_gdansk_port: "Gdańsk Limanı"
 pol_gdansk_port_desc: "Gdańsk (Danzig), “Polonya’nın Kapısı” olarak anılır: Baltık Denizi’nin en önemli limanı. Vistula Nehri’nin ağzında yer alan bu şehir Hansa Birliği’nin başlıca merkeziydi ve Polonya tahıl ihracatının anahtarıydı. Thorn Barışı’nda (1466) Polonya tarafından güvenceye alınan Gdańsk iki yüzyıl boyunca Polonya ekonomisinin kalbi olarak hizmet etti."
 pol_livonian_expansion: "Livonya’ya Genişleme"
 pol_livonian_expansion_desc: "Bir zamanlar Livonya Tarikatı’nın yönettiği Livonya (günümüz Letonya ve Estonya), 16. yüzyılda Rusya, İsveç, Danimarka ve Polonya arasında bir çekişme sahnesi oldu. Riga’yı ve Tallinn’i (Reval) ele geçirmek tüm Baltık Denizi’ni Polonya denetimine sokar."
 pol_master_of_the_north: "Kuzey’in Efendisi"
 pol_master_of_the_north_desc: "Bir zamanlar Töton Tarikatı’nın kalesi olan Königsberg (şimdi Kaliningrad) artık Polonya sancağını taşıyor. Tüm Baltık’ı denetleyen güçlü bir filoyla Polonya İskandinavya’yı, Hansa’yı ve Hollandalıları avucunun içinde tutar: kuzeyin yüce efendisi."
 pol_hungarian_union: "Macaristan ile Şahsi Birlik"
 pol_hungarian_union_desc: "III. Kazimierz 1370’te varissiz öldüğünde yeğeni Macaristan’ın (Anjou) I. Lajos’u Polonya tahtını miras aldı. Bu Polonya-Macar şahsi birliğinin başlangıcıydı. İki büyük krallık tek bir kral altında birleşir: Orta-Doğu Avrupa’daki güç dengesi köklü biçimde değişir."
 pol_moldavia_vassal: "Moldavya’ya Boyun Eğdir"
 pol_moldavia_vassal_desc: "Moldavya Prensliği (Moldova), Polonya’nın, Macaristan’ın ve Osmanlıların çekiştiği bir tampon devlettir. Büyük Stefan (saltanatı 1457-1504) fiilî bağımsızlığını korurken nominal Polonya üstünlüğünü sürdürdü. Bu stratejik prensliği sağlamca Polonya himayesi altına koy ve Karadeniz’e açılan kapıyı ele geçir."
 pol_wallachia_control: "Eflak’ın Denetimi"
 pol_wallachia_control_desc: "Tuna’nın kuzeyindeki prenslik Eflak, Osmanlı İmparatorluğu’na karşı ön hattır. II. Vlad (Kazıklı Voyvoda Vlad’ın babası) Ejder Tarikatı üyesi olarak Macaristan’a hizmet etti. Eflak’ı Polonya-Macar birliğinin himayesi altına almak Balkan Yarımadası üzerinde nüfuz kurar."
 pol_battle_of_grunwald: "Grunwald Ruhu"
 pol_battle_of_grunwald_desc: "15 Temmuz 1410’da Grunwald sahasında Polonya-Litvanya ordusu Töton Tarikatı’nı tamamen ezdi. Büyük Üstat Ulrich von Jungingen sahada düştü ve Polonya “Hıristiyan Dünyasının Koruyucusu” olarak itibarını pekiştirdi. Şimdi bu ruhu İslam güçlerine karşı savaşta yeniden kanıtla."
 pol_shield_of_christendom: "Hıristiyan Dünyasının Kalkanı"
 pol_shield_of_christendom_desc: "Jadwiga’nın Hıristiyanlaştırma politikasından beri Polonya, Doğu Avrupa Katolikliğinin ön hattında durdu. Osmanlı İmparatorluğu nihayet kovulunca Papa, Venedik ve Habsburglar hep Polonya’nın gerçek Antemurale Christianitatis, yani Hıristiyan Dünyasının Kalesi olduğunu kabul eder."
 pol_silesia_integration: "Silezya’nın Bütünleştirilmesi"
 pol_silesia_integration_desc: "Silezya (Śląsk) Piast hanedanının doğum yeridir, ama 14. yüzyılda Bohemya ve Habsburg denetimine geçti. Wrocław (Breslau) merkezli bu zengin sanayi ve ticaret bölgesini geri almak Polonya’nın en önemli ulusal ve ekonomik zorunluluklarından biridir."
 pol_bohemian_claim: "Bohemya Tacı"
 pol_bohemian_claim_desc: "Jagiellon Hanedanı Bohemya ve Macaristan tahtları üzerinde miras haklarına sahiptir. II. Vladislaus (Jagiellon) 1471’de Bohemya Kralı, sonra 1490’da Macaristan Kralı da oldu. Bohemya tacını Prag’da ele geçirmek Polonya-Bohemya-Macaristan üçlü monarşisini yaratır."
 pol_hre_influence: "Kutsal Roma İmparatorluğu Üzerinde Nüfuz"
 pol_hre_influence_desc: "Bohemya tacını da elinde tutan Polonya Kralı Kutsal Roma İmparatorluğu’nun Seçici Prensi olabilir. Habsburglarla diplomasiyi dengeleyerek ve Alman prensleri üzerinde nüfuzu genişleterek Polonya Orta Avrupa’nın siyasi merkezi olur."
 pol_central_european_power: "Orta Avrupa Gücü"
 pol_central_european_power_desc: "Polonya, Litvanya, Bohemya ve Macaristan’ı kapsayan geniş bir diyar ve zengin gelir: Polonya Orta-Doğu Avrupa’nın en büyük gücü olarak ortaya çıktı. Kutsal Roma İmparatorluğu’nun, Osmanlı İmparatorluğu’nun ve Moskova Büyük Dukalığı’nın üç büyük gücüyle çevrili Polonya kendine özgü bir parlaklıkla ışıldar."
 pol_grand_commonwealth: "Büyük Ortak Devlet"
 pol_grand_commonwealth_desc: "Polonya’yı, Litvanya’yı, Bohemya’yı ve Macaristan’ı bütünleştiren Ortak Devlet: soylu özgürlüğünü ve kraliyet otoritesini uyumlu kılan eşsiz siyasi sistemiyle bu devlet 16.-17. yüzyıllarda “Birçok Ulusun Cumhuriyeti” (Rzeczpospolita) olarak biliniyordu. Birden fazla etnisiteyi, dini ve dili kapsayan bu olağanüstü siyasi deney zirvesine ulaştı."
 pol_events.10.t: "Jadwiga ile Jagiełło’nun Evliliği"
 pol_events.10.d: "Krewo Birliği meyvesini verdi: Polonya Kraliçesi Jadwiga ve Litvanya Büyük Dükü Jagiełło evlendi. Jagiełło Hıristiyan vaftizi aldı ve Polonya Kralı olarak “II. Władysław” adını aldı. Litvanya Polonya ile şahsi birliğe girer ve Doğu Avrupa’nın en büyük siyasi bütünleşmesi başlar. Bu evlilik siyasi hesaptan fazlasıdır: iki halkın, iki kültürün, iki dilin tek bir hanedan altında birleştiği tarihî andır. “Polonya ve Litvanya ilelebet birdir”, diye ilan etti Krewo Birliği."
 pol_events.10.a: "Yeni Jagiellon Hanedanı çok yaşasın!"
 pol_events.20.t: "Polonya-Macar Şahsi Birliği"
 pol_events.20.d: "Polonya ve Macaristan bir şahsi birlik kurdu. İki büyük krallık tek bir kral altında birleşti: bu Anjou Hanedanı’nın diplomatik zaferi ve Orta-Doğu Avrupa tarihini yeniden şekillendiren bir olaydır. Polonyalı ve Macar şövalyeler artık omuz omuza duruyor. Kuzeydeki Baltık Denizi’nden güneydeki Adriyatik Denizi’ne tek bir hanedan altında geniş bir diyar şekilleniyor. Osmanlı İmparatorluğu için bu birlik karşılaştığı en büyük tehdittir."
 pol_events.20.a: "Polonya ve Macaristan birdir!"
 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "Piast Hanedanı Mirası"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "Polonya’nın ilk kraliyet evi Piast hanedanının bin yıllık mirası Polonya tacının meşruiyetini destekler."
 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "Mazovya’nın Bütünleştirilmesi"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "Varşova merkezli Mazovya Polonya’ya tamamen bütünleşti. Bu bereketli ova krallığın kalbi olarak işlev görür."
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "Büyük Sejm Kuruldu"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "Polonya Sejm’i Altın Özgürlük kurumu olarak kuruldu. Soylu özerkliğini ve kraliyet gücünü uyumlu kılan eşsiz bir siyasi sistem ortaya çıkıyor."
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "Krakov’un Kültürel Çiçeklenmesi"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "Wawel Kalesi merkezli Krakov Rönesans’ın ışığına bulandı. Orta-Doğu Avrupa’nın en büyük akademik şehri olarak Avrupa’nın dört bir yanından bilginler ve sanatçılar toplanıyor."
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "Jagiellon Üniversitesi Çiçek Açıyor"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "Kopernik’in alma mater’i Jagiellon Üniversitesi Orta-Doğu Avrupa’nın en seçkin akademisi olarak gelişiyor. İlim ve sanat tüm Polonya’ya yayılıyor."
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "Polonya Altın Çağı"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "Kopernik’in güneş merkezciliği, Kochanowski’nin şiiri, Krakov’un mimarisi: Polonya her boyutta altın çağını yaşıyor."
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "Jadwiga-Jagiełło Birliği Bağı"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "Polonya-Litvanya şahsi birliği kuruldu. Baltık’tan Karadeniz’e uzanan geniş bir devlet şekilleniyor."
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "Polonya-Macar İttifakının Gücü"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "Vistula ve Tuna kıyılarından toplanan kraliyet ordularının sancakları Osmanlı sınırına bakan tepelerde yan yana duruyor."
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "Ruthenia’nın Gelişimi"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "Kızıl Ruthenia’nın tarım toprakları tamamen geliştirildi. Lviv üzerinden Karadeniz ticaret yolu devreye girdi."
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "Kiev Kapısı"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "Slav uygarlığının doğum yeri Kiev Polonya denetimine girdi. Tüm Dinyeper Nehri havzası üzerinde nüfuz kuruldu."
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "Doğuya Doğru İlerleyiş"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "Minsk ve Smolensk güvence altındayken tüm doğu Slav dünyası Polonya’nın nüfuz alanına giriyor."
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "Doğu İmparatorluğu"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "Baltık’tan Karadeniz’e uzanan Polonya imparatorluğu tamam. Tarihe Doğu Avrupa’nın en büyük devleti olarak kazındı."
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "Töton Tarikatı’na Karşı Zafer"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "Grunwald ruhu Polonya ordusuna ilham verir. Hıristiyan dünyasının haçlı şövalyelerini yenme hatırası ordunun gururu olur."
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "Gdańsk Ticaret Şehri"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "Gdańsk Baltık’ın en büyük tahıl ihracat limanı olarak gelişti. Vistula Nehri boyunca akan Polonya tahılı tüm Avrupa’yı besliyor."
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "Grunwald’ın Şanı"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "Grunwald ruhu Polonya ordusuna ilham verir. İnançsızlara karşı savaşta Polonya giderek daha büyük şan kazanır."
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "Hıristiyan Dünyasının Kalkanı"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "Polonya Antemurale Christianitatis, yani Hıristiyan Dünyasının Kalesi olarak tarihe kazındı."
 STATIC_MODIFIER_NAME_pol_silesia_mod: "Silezya’nın Bütünleştirilmesi"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "Kartal sancağı Piastların yurdu Silezya’nın kalelerine döndü ve madenlerinin ve atölyelerinin dumanı bir kez daha Polonya göklerine yükseliyor."
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "Bohemya Tacı"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "Jagiellon Hanedanı Bohemya tacını ele geçirdi. Prag’ın Bohemya kraliyet sarayı Polonya diplomasisinin sahnesi olur."
 STATIC_MODIFIER_NAME_pol_central_power_mod: "Orta Avrupa Gücü"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "Polonya Orta-Doğu Avrupa’nın en büyük gücü olarak ortaya çıktı. Üç büyük gücün arasında bile kendine özgü bir parlaklıkla ışıldar."
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "Büyük Ortak Devlet"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "Rzeczpospolita tamam: birden fazla halkı, dini ve dili kapsayan Avrupa’nın en büyük siyasi deneyi."
 pol_support_merchants: "Tüccar Sınıfına Destek"
 pol_support_merchants_desc: "Polonya’nın kentli burjuvaları kraliyet maliyesinin hayati bir sütunudur. Krakov’daki Sukiennice (Kumaş Salonu) merkezli ticaret ağını destekleyerek burjuva sadakati ve mali gelirler birlikte iyileşir. Tüccar zümresini memnun et ve Polonya’nın bir ticaret ulusu olarak temellerini at."
 pol_black_sea_access: "Karadeniz’e Erişim"
 pol_black_sea_access_desc: "Dinyeper Nehri’ni inerek Polonya Karadeniz’e ulaşabilir. Kırım Yarımadası’nı ve Pontus Euxinus’un (Karadeniz) kuzey kıyısını denetlemek, Osmanlı denetimindeki İstanbul’u atlayan doğuya bir ticaret yolu güvenceye almak demektir. Bir Karadeniz filosu inşa et ve deniz egemenliğini genişlet."
 pol_breadbasket_of_europe: "Avrupa’nın Tahıl Ambarı"
 pol_breadbasket_of_europe_desc: "16. yüzyılın sonlarına gelindiğinde Polonya Avrupa’da tüketilen tahılın çoğunu tedarik ediyordu. Amsterdam’daki, Lizbon’daki ve Sevilla’daki tüccarlar Polonya buğdayı ve çavdarı olmadan iş yapamazdı. Polonya tarihe “Avrupa’nın Tahıl Ambarı” olarak kazındı."
 pol_nieszawa_privileges: "Nieszawa Ayrıcalıkları"
 pol_nieszawa_privileges_desc: "1454’te Jagiellon Hanedanı’ndan IV. Kazimierz Töton Tarikatı’na karşı savaş için soylu seferberliklerine ihtiyaç duydu ve bunların bedelini szlachta’ya geniş ayrıcalıklar veren Nieszawa Statüsü ile ödedi. Bundan böyle kral soyluların rızası olmadan ne yeni vergi koyabilir ne yeni yasa çıkarabilirdi. Bu Polonya’nın “Altın Özgürlüğü”nün temel taşı oldu."
 pol_develop_krakow: "Krakov’u Geliştir"
 pol_develop_krakow_desc: "Polonya başkenti Krakov Wawel Kalesi çevresinde büyüdü. Bu şehri tamamen geliştirmek, yani şehir rütbesine yükseltmek, onun Orta-Doğu Avrupa’nın en büyük ticaret şehri statüsünü kurar."
 pol_baltic_fleet: "Baltık Filosu"
 pol_baltic_fleet_desc: "Gdańsk elde olduğundan Polonya Baltık çıkışını güvenceye aldı. Bir filo inşa etme ve Baltık hâkimiyeti için yarışma vakti geldi. İsveç, Danimarka ve Livonya Tarikatı bu sular için yarışırken Polonya filosu Baltık’ın en yeni ve en büyük gücü olacak."
 pol_sea_to_sea: "Denizden Denize"
 pol_sea_to_sea_desc: "Livonya deniz denetimi ve Kiev ile Smolensk’in ele geçirilmesi: Polonya-Litvanya birliği artık Baltık’tan Karadeniz’e uzanıyor. Kuzeydeki Tallinn’den güneydeki Kiev’e Doğu Avrupa’nın en büyük bitişik imparatorluğu tamam. Büyük Hetman Jan Zamoyski sonradan şöyle diyecekti: “Bu Polonya Tanrı’nın bizzat inşa ettiği bir ulustur.”"
 pol_challenge_habsburg: "Habsburglara Meydan Oku"
 pol_challenge_habsburg_desc: "16. yüzyıla gelindiğinde Habsburglar Kutsal Roma İmparatorluğu’nu, İspanya’yı, Bohemya’yı ve Macaristan’ı denetliyordu: Avrupa’nın en büyük hanedanı. Ama Bohemya ve Polonya Kralı olarak Jagiellon hükümdarı bu hegemonyaya meydan okuyabilir. Viyana’yı ele geçir ya da Habsburglar’ı Polonya bayrağı altına al."
 pol_codify_law: "Hukuku Kodifiye Et"
 pol_codify_law_desc: "Büyük Kazimierz’in 1346/47 Wiślica Statüsü Polonya hukukunun ilk sistematik kodlamasıydı. Muhasebe evi merkezli hesap tutma ve idari altyapı üzerine inşa ederek Polonya hukukunun daha kapsamlı bir kodlaması idari verimliliği çarpıcı biçimde artırır."
 pol_develop_warsaw: "Varşova’yı Geliştir"
 pol_develop_warsaw_desc: "Varşova Mazovya Dukalığı’nın merkezi olarak büyüdü. Polonya’nın merkezinde konumlanan şehir, 1569 Lublin Birliği’nden sonra Polonya-Litvanya Ortak Devleti’nin başkenti olacaktı. Onu şehir rütbesine yükseltmek krallığın merkezinin idari temelini kurar."
 pol_amber_road: "Kehribar Yolu"
 pol_amber_road_desc: "Baltık kehribarı, “Kuzey’in Altını”, antik çağdan beri değerlidir. Gdańsk Baltık kehribarının başlıca ihracat limanıydı ve İtalya’ya ve Akdeniz’e ihracat muazzam servet getirdi. Bu kadim ticaret yolunu canlandır ve Polonya’nın ekonomik konumunu yükselt."
 pol_poznan_commerce: "Poznań Ticareti"
 pol_poznan_commerce_desc: "Poznań batı Polonya’nın ticaret şehridir ve Brandenburg ile ve Silezya ile ticaretin merkezidir. Polonya’nın ilk piskoposluk makamına ev sahipliği yapan bu şehir ortaçağdan beri batı Polonya’nın ticaret merkezi olmayı sürdürdü. Onu şehir rütbesine yükselt ve ticari potansiyelini azamiye çıkar."
 pol_vilnius_capital: "Vilnius’u Geliştir"
 pol_vilnius_capital_desc: "Vilnius 14. yüzyılda Litvanya Büyük Dukalığı’nın başkenti olarak hızla büyüdü. Büyük Dük Gediminas tarafından kurulan bu şehir, yan yana yaşayan birçok Yahudi’nin, Katolik’in ve Ortodoks’un yurdu oldu: sonradan “Kuzey’in Kudüs’ü” olarak bilindi. Onu şehir rütbesine yükselt ve Litvanya idaresinin merkezi olarak geliştir."
 pol_russia_rivalry: "Moskova ile Rekabet"
 pol_russia_rivalry_desc: "Büyük III. İvan Smolensk yüzünden Polonya-Litvanya ile şiddetle çatıştı. Moskova ile Polonya-Litvanya arasındaki Smolensk Savaşları 16. yüzyıl boyunca sürdü: kaderî bir mücadele. Moskova’yı rakip ilan et ve doğu hegemonyasını kur. Moskova’nın “Kutsal Rus’un Koruyucusu” iddiasına karşı Polonya “Özgürlüğün Koruyucusu” olarak durur."
 pol_malbork_castle: "Malbork Kalesi"
 pol_malbork_castle_desc: "Malbork Kalesi (Marienburg) Töton Tarikatı’nın karargâhı olarak inşa edildi: Avrupa’nın en büyük ortaçağ kalesi. Thorn Barışı’nda (1457) Polonya’ya devredilen bu müthiş kale mükemmel bir savunma noktası olur."
 pol_gniezno_church: "Gniezno Başpiskoposluğu"
 pol_gniezno_church_desc: "Gniezno Polonya’nın tarihî başkenti ve ilk başpiskoposluğunun makamıdır. Yaklaşık 987’de inşa edilen Gniezno Katedrali, Aziz Adalbert’in kalıntılarına ev sahipliği yapar ve o zamandan beri Polonya Katolik inancının kalbi olarak hizmet etmiştir. Polonya Kilisesi’ni güçlendir ve Doğu Avrupa Katolikliğinin koruyucusu görevini yerine getir."
 pol_hanseatic_ties: "Hansa Bağları"
 pol_hanseatic_ties_desc: "Hansa Birliği Baltık ve Kuzey Denizi ticaretine hâkimdi. Gdańsk, Toruń ve Elbląg gibi Polonya şehirlerinin yakın Hansa bağları vardı. Bu şehirler merkezli geniş bir ticaret ağı kur ve Polonya Baltık’ın önde gelen ticaret gücü olarak ortaya çıkar."
 pol_transylvania_influence: "Transilvanya Üzerinde Nüfuz"
 pol_transylvania_influence_desc: "Transilvanya, Macaristan Krallığı ile Polonya şahsi birliği arasındaki sınırda zengin bir bölgedir. Macar birliği aracılığıyla ya da doğrudan Transilvanya üzerinde nüfuz kurmak Polonya’nın güneydoğu sınırını istikrara kavuşturur."
 pol_subjugate_serbia: "Sırbistan’a Boyun Eğdir"
 pol_subjugate_serbia_desc: "Sırbistan Krallığı Kosova’dan (1389) sonra Osmanlı vasalı oldu. Polonya-Macar birliğinin güney genişlemesinin bir parçası olarak Belgrad’ı güvenceye almak ya da Sırbistan’ı vasal statüsüne sokmak kuzey Balkanlar’da sağlam bir tutunak kurar."
 pol_varna_revenge: "Varna’nın İntikamı"
 pol_varna_revenge_desc: "1444’teki Varna Muharebesi’nde Polonya-Macar haçlı ordusu Osmanlılar tarafından ezildi ve Polonya Kralı III. Władysław sahada öldü. O aşağılanmanın öcünü alma vakti nihayet geldi. Müslüman bir ulusla savaşırken Varna’yı işgal et ve o trajedi zafer olarak yeniden yazılır."
 pol_upper_silesia_mines: "Yukarı Silezya Madenleri"
 pol_upper_silesia_mines_desc: "Yukarı Silezya bol gümüş, çinko ve kurşun madenleriyle bilinir. Cieszyn ve Gliwice çevresindeki madencilik bölgelerini tamamen geliştirmek Polonya’nın sanayi temelini kurar. Sonradan Sanayi Devrimi’nin merkezi olacak bu bölgenin maden kaynaklarını erken ele geçir."
 pol_upper_silesia_mines_unlock_tt: "“Yukarı Silezya Madenlerinin Geliştirilmesi” kararı artık kullanılabilir."
 pol_silesia_mining_decision.title: "Yukarı Silezya Madenlerinin Geliştirilmesi"
 pol_silesia_mining_decision.desc: "Silezya’nın madencilik bölgeleri geniştir ve Taç hepsini bir anda açamaz. Ocaklara, dökümhanelere ve yollara yapılan her yatırım bir bölgeyi daha tam üretime geçirir; bu iş her on yılda bir yenilenebilir."
 pol_silesia_mining_decision.a: "Yeni bir madencilik bölgesine yatırım yap."
 pol_pomeranian_coast: "Pomeranya Kıyısı"
 pol_pomeranian_coast_desc: "Pomeranya (Pomorze), Stettin (Szczecin) merkezli Baltık kıyı bölgesidir. Tarihsel olarak Polonya diyarının bir parçası olan bu bölgeyi geri almak Polonya’ya Baltık kıyı şeridinin tam denetimini verir."
 pol_prague_university: "Prag Üniversitesi"
 pol_prague_university_desc: "Prag’daki Charles Üniversitesi (1348’de kuruldu) Orta-Doğu Avrupa’nın en eski üniversitesidir. Hus reformunun kaynağı olan bu akademi, şimdi Polonya yönetiminde yeniden inşa edilip geliştirilebilir ve Prag’ı bir kez daha Katolik ilminin merkezi yapabilir."
 pol_catholicism_of_lithuania: "Litvanya’nın Katolikleştirilmesi"
 pol_catholicism_of_lithuania_desc: "Jagiełło Polonya Kralı olduğunda Litvanya’yı Katolikliğe geçirmeyi taahhüt etti. Vilnius merkezli tüm Litvanya’da kiliseler ve manastırlar inşa et ve bu eski pagan toprağı tamamen Katolik bir devlete dönüştür. Bu dönüşüm olmadan Polonya-Litvanya birliğinin gerçek bir bütünleşmesi olamaz. “İnançla yeniden doğan Litvanya.”"
 pol_royal_road: "Kraliyet Yolu"
 pol_royal_road_desc: "Krakov’dan Gniezno’ya, Poznań’a ve Gdańsk’a uzanan “Kraliyet Yolu” (Droga Królewska) Polonya Krallığı’nın büyük damarıdır. Mazovya bütünleşmiş ve Prusya fethedilmişken bu yolu geliştirmek diyar genelinde iletişimi, ticareti ve idareyi çarpıcı biçimde iyileştirir."
 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "Nieszawa Ayrıcalıkları"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "Szlachta kraliyet yasaları üzerinde veto yetkisi kazandı. Polonya’nın “Altın Özgürlüğü”nün başlangıcı."
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "Polonya Hukuk Kanunnamesi"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "Büyük Kazimierz’in kanunnamesinden türeyen yeni maddeler soyluların ve kasabalıların aynı mahkemede yargılanacağı günü yaklaştırıyor."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Tüccar Destek Politikası"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "Polonya’nın tüccar burjuvazisini destekleyen politikalar ticaret gelirini yükseltir."
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "Kehribar Yolu"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "Baltık kehribarı yüklü arabalar “Kuzey’in altını”nı arayan tüccarlara doğru eski yolda ilerliyor."
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "Poznań Ticaret Merkezi"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "Batı Polonya’nın ticaret şehri Poznań büyük bir ticaret merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "Vilnius Çiçek Açıyor"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "Litvanya Büyük Dukalığı’nın başkenti Vilnius çok kültürlü bir şehir olarak gelişiyor."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Karadeniz’e Erişim"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "Polonya kuzey Karadeniz kıyısına erişimi güvence altına aldı ve Akdeniz ticaret yollarına girdi."
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "Malbork Kalesi"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "Avrupa’nın en büyük ortaçağ kalesi tabyalarla yükseltildi: aşılmaz bir savunma kalesi."
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "Gniezno Başpiskoposluğu"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "Aziz Adalbert’in kalıntılarına ev sahipliği yapan Gniezno Katedrali Polonya Katolik uygarlığının manevi merkezi olarak işlev görür."
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "Varna’nın İntikamı"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "1444’ün aşağılayıcı yenilgisinin öcü alındı. Polonya İslam dünyasına karşı savaşta giderek daha büyük şan kazanır."
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "Pomeranya Kıyısı"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "Stettin merkezli Pomeranya kıyısı Polonya filosunun üssü olarak geliştirildi."
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "Prag Üniversitesi Çiçek Açıyor"
 STATIC_MODIFIER_DESC_pol_prague_learning_mod: "Orta-Doğu Avrupa’nın en eski üniversitesi olan Charles Üniversitesi Polonya yönetimi altında yeniden gelişiyor."
 STATIC_MODIFIER_NAME_pol_habsburg_victory_mod: "Habsburglara Karşı Zafer"
 STATIC_MODIFIER_DESC_pol_habsburg_victory_mod: "Viyana işgal edildi ya da Habsburg şahsi birliği: Polonya Orta Avrupa’nın efendisi oldu."
 STATIC_MODIFIER_NAME_pol_sea_to_sea_mod: "Denizden Denize"
 STATIC_MODIFIER_DESC_pol_sea_to_sea_mod: "Baltık’tan Karadeniz’e uzanan Polonya tüm Doğu Avrupa ticaretine hâkim olur."
 STATIC_MODIFIER_NAME_pol_lithuanian_church_mod: "Litvanya Kilisesi"
 STATIC_MODIFIER_DESC_pol_lithuanian_church_mod: "Litvanya’nın Katolikleştirilmesi Polonya-Litvanya birliğinin manevi bütünleşmesini sağladı."
 STATIC_MODIFIER_NAME_pol_royal_road_mod: "Kraliyet Yolu"
 STATIC_MODIFIER_DESC_pol_royal_road_mod: "Memurlar, tüccarlar ve askerler Krakov’dan Gdańsk’a Kraliyet Yolu boyunca uzun bir sıra hâlinde yolculuk ediyor."
 pol_lithuanian_relations: "Litvanya ile İlişkiler"
 pol_lithuanian_relations_desc: "Litvanya Büyük Dukalığı Polonya’nın en önemli komşusudur: potansiyel bir müttefik ya da en büyük tehdit. 14. yüzyılda Litvanya Avrupa’nın son pagan ulusuydu ve yine de Baltık’tan Karadeniz’e uzanan müthiş bir devletti. Kraliçe Jadwiga’nın evlilik politikası aracılığıyla Litvanya ile şahsi birliği güvenceye almak için önce diplomatik zemin hazırlanmalıdır. Dostane ilişkiler ya da askerî baskı yoluyla Polonya Litvanya tahtı üzerindeki hak iddiasını ortaya koyabilir."
 pol_develop_ruthenia_desc: "Galiçya (Halych) ve Volinya Kızıl Ruthenia’nın iki büyük prensliğidir. Galiçya Prensliği’nin (HAL) merkezi Lviv (Lemberg) ve Volinya Prensliği (VOL), Polonya tarafından 1349-66’da fethedildi. Belz de kilit bir Ruthenia kalesidir. Hem Galiçya’yı hem Volinya’yı Polonya altında şahsi birliğe sokmak, ya da Lviv’e ve Belz’e doğrudan sahip olmak, tüm Kızıl Ruthenia üzerinde denetim kurar. Bu toprak Avrupa’nın en büyük tarım bölgelerinden biridir ve zengin toprağı Polonya’nın nüfusunu ve ekonomisini destekler."
 STATIC_MODIFIER_NAME_pol_silesia_mines_mod: "Yukarı Silezya Madenleri"
 STATIC_MODIFIER_DESC_pol_silesia_mines_mod: "Yukarı Silezya’nın ocaklarında gümüş, çinko ve kurşun kesen kazmaların sesi gece gündüz yankılanıyor."
 STATIC_MODIFIER_NAME_pol_baltic_fleet_mod: "Polonya Baltık Filosu"
 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "Gdańsk merkezli Polonya filosu Baltık Denizi’ni denetliyor. Vistula’nın ağzından Kuzey Denizi’ne Polonya sancağı dalgalar üzerinde dalgalanıyor."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Livonya Üzerinde Egemenlik"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "Riga ve Tallinn limanları üzerinde dalgalanan Polonya bayrağı altında birçok dilde konuşan halklar vergilerini aynı tahsildarlara ödüyor."
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "Hansa Bağları"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "Danzig’in ticarethanelerinde Hansa tüccarlarıyla kadeh paylaşanlar birbirlerinin yüküne güvenerek ticaret yapıyor."
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "Transilvanya Nüfuzu"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Macaristan ile şahsi birlik aracılığıyla Polonyalı elçiler Transilvanya’nın dağ vadilerindeki saraylarda bile karşılanıyor."
 pol_breadbasket_town_right_tt: "“Polonya Krallığı Tarım Merkezi” şehir hakkı artık kullanılabilir. Seviye 5 veya daha yüksek bir ambara sahip, şehir rütbesindeki veya üstündeki konumlara verilebilir."
 STATIC_MODIFIER_NAME_pol_warsaw_location_mod: "Varşova Kraliyet Başkenti Geliştirildi"
 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "Vistula kıyısında inşa edilen Varşova’nın sokakları günbegün genişliyor ve krallığın dört bir yanından memurların arabaları buraya toplanıyor."
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "Krakov Çiçek Açıyor"
 STATIC_MODIFIER_DESC_pol_krakow_location_mod: "Wawel Kalesi merkezli Krakov tamamen geliştirildi. Azami kaynak büyüklüğünü ve aylık refah artışını genişletmek onu Polonya kraliyet başkentine layık bir şehre dönüştürür."
