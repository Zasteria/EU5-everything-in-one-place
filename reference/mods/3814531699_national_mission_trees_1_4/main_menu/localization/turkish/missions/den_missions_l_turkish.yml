l_turkish:
 den_kalmar_union_mission_pack: "Kalmar Birliği’nin Şanı"
 den_kalmar_union_mission_pack_DESCRIPTION:0 "1337’de Danimarka Krallığı mali yıkımın ve toprak parçalanmasının eşiğindedir. IV. Valdemar Atterdag tahtı geri almaya ve ulusu yeniden inşa etmeye çalışır. Gotland’ı geri al, Hansa Birliği ile yüzleş, Norveç ve İsveç ile Kalmar Birliği’ni kur, Baltık’a hâkim ol, İngiltere’yi fethet ve inancını seç: Katolik sarsılmazlığı, Lutherci Reform ya da Norse tanrılarının yeniden doğuşu. İskandinav İmparatorluğu’nu inşa et."
 den_kalmar_union_mission_pack_CRITERIA_DESCRIPTION:0 "Danimarka olarak her yöne, kuzeye, doğuya ve dinî alanda genişle ve İskandinav İmparatorluğu’nu kur."
 den_kalmar_union_mission_pack_BUTTON_TOOLTIP:0 "İskandinav İmparatorluğu’nu inşa etmek için görevleri tamamla."
 den_kalmar_union_mission_pack_BUTTON_DETAILS:0 "Valdemar’ın restorasyonundan Kalmar Birliği’nin altın çağına: İskandinavya’yı birleştir!"
 den_restoration_of_denmark: "Valdemar’ın Restorasyonu"
 den_restoration_of_denmark_desc: "1340’ta IV. Valdemar Atterdag, paramparça edilmiş ve parça parça satılmış bir Danimarka’nın tahtını geri aldı: Jutland bile Prusya’ya rehin verilmişti. Parça parça geri aldı. “Atterdag”, yani “yine gündüz oldu”, lakabı bizzat tarihî görevini somutlaştırıyordu. Kopenhag’ı güvenceye al ve tacın meşruiyetini yükselt."
 den_secure_denmark: "Danimarka’yı İstikrara Kavuştur"
 den_secure_denmark_desc: "Roskilde’yi, Aarhus’u ve Malmö’yü ele geçirmek Danimarka’nın merkez topraklarını yeniden birleştirir. Roskilde Danimarka krallarının geleneksel gömü yeri ve manevi başkentidir; Malmö Baltık’a açılan kilit kapıdır. Bunlar güvence altına alındığında Danimarka dışarıya bakabilir."
 den_norway_union: "Norveç ile Şahsi Birlik"
 den_norway_union_desc: "Danimarka ve Norveç 1380’de VI. Håkon’un ölümü üzerine şahsi birliğe girdi. Kızı I. Margrete Norveç’in naibi oldu ve Kalmar Birliği’nin zeminini hazırladı. Norveç’i Danimarka sancağı altına al ve İskandinav birliğine ilk adımı at."
 den_sweden_union: "İsveç ile Şahsi Birlik"
 den_sweden_union_desc: "İsveç nesiller boyu süren çatışmalar boyunca Danimarka’nın büyük kuzey rakibiydi. Bazı İsveçli soylular Danimarka’nın himayesini arıyor. Diplomasi veya fetih yoluyla İsveç’i Danimarka denetimine al: İskandinavya erişim içine girer."
 den_integrate_holstein: "Holstein’ı Bütünleştir"
 den_integrate_holstein_desc: "Holstein, dükü Danimarka kralı olan Almanca konuşan bir dukalıktır. Hamburg’u ve Holstein’ı denetlemek güney sınırını güvenceye alır ve Hansa Birliği üzerinde baskı kurar. “Holstein’da Danimarkalı, Danimarka’da Holsteinlı”: bu belirsizliği kesin olarak çöz."
 den_kalmar_union: "Kalmar Birliği"
 den_kalmar_union_desc: "I. Margrete’nin tasarladığı 1397 Kalmar Birliği, Danimarka, Norveç ve İsveç’in üç tacını tek bir kral altında birleştirdi. Her ülke kendi yasalarını ve geleneklerini korurken dış ve askerî politikayı koordine etti. Kuzey İmparatorluğu’nun doğuşu."
 den_unite_scandinavia: "İskandinavya’yı Birleştir"
 den_unite_scandinavia_desc: "İsveç boyun eğdirildi ve Holstein bütünleşti: tüm İskandinavya Danimarka sancağı altında birleşir. Baltık’tan Norveç Denizi’ne tek bir hanedan her şeye hükmeder. Bu Kuzey tarihinin en büyük siyasi başarısıdır."
 den_integrate_norway: "Norveç’i Bütünleştir"
 den_integrate_norway_desc: "Oslo’yu ve Bergen’i ele geçir ve Norveç’i Danimarka imparatorluğunun bir parçası olarak tamamen bütünleştir. Bergen bir zamanlar Hansa Birliği’nin başlıca kuzey merkeziydi: şimdi Danimarka’nın Kuzey Atlantik kapısı olur."
 den_integrate_sweden: "İsveç’i Bütünleştir"
 den_integrate_sweden_desc: "İsveç’i Danimarka imparatorluğunun bir parçası olarak tamamen bütünleştir. Stokholm’e sahip olmak ve Svealand’ı elde tutmak İsveç’i diyarın bölünmez bir parçası yapar."
 den_develop_trondheim: "Kuzey Norveç’i Geliştir"
 den_develop_trondheim_desc: "Trondheim Norveç’in tarihî başkenti ve başpiskoposunun makamıdır. Kuzey Norveç kıyısını geliştirmek Kuzey Atlantik ve Norveç Denizi üzerinde denetim kurar."
 den_scandinavian_golden_age: "İskandinav Altın Çağı"
 den_scandinavian_golden_age_desc: "Norveç ve İsveç bütünleşmiş ve mutlakiyet kurulmuşken İskandinavya, Kuzey Avrupa’nın en büyük imparatorluğu olarak altın çağına girer. Kopenhag Baltık ile Kuzey Denizi’ni bağlayan kültürel ve ekonomik merkez olarak çiçek açar."
 den_retake_gotland: "Gotland’ı Geri Al"
 den_retake_gotland_desc: "Gotland’daki Visby bir zamanlar Hansa Birliği’nin en büyük ticaret şehirlerinden biriydi: İsveç’in, Livonya’nın ve Töton Tarikatı’nın çekiştiği bir ödül. 1361’de IV. Valdemar Gotland’ı kuvvetle ele geçirdi. Bu adayı almak Baltık ticaretinin kritik bir merkezini güvenceye alır."
 den_sound_toll: "Sound Geçiş Ücreti"
 den_sound_toll_desc: "Danimarka Baltık ile Kuzey Denizi arasındaki dar geçitte durur; her gemi Öresund Boğazı’ndan geçmeli ve ücret ödemelidir. Yaklaşık 1429’da resmîleşen bu ücret Danimarka kraliyet maliyesinin belkemiği oldu. Filoyu inşa et ve boğazı tamamen denetle."
 den_humiliate_hansa: "Hansa’yı Küçük Düşür"
 den_humiliate_hansa_desc: "Hansa Birliği Baltık ticaretini tekeline almış ve nesiller boyu Danimarka’yı tehdit etmiştir. 1370’teki aşağılayıcı Stralsund Antlaşması’ndan beri Danimarka intikam bekliyor. Lübeck’i denetle ya da Birliği ekonomik olarak geç ve Hansa hegemonyasını kır."
 den_reconquer_estonia: "Estonya’yı Yeniden Fethet"
 den_reconquer_estonia_desc: "Tallinn (Reval) 1219’da II. Valdemar tarafından bir Danimarka kalesi olarak kuruldu: “Taani linn” (Danimarka kalesi) adının kökeni olduğu söylenir. 1346’da Töton Tarikatı’na satıldı; bu toprağı geri almak doğu Baltık kıyısında Danimarka nüfuzunu yeniden kurar."
 den_control_livonia: "Livonya’yı Denetle"
 den_control_livonia_desc: "Livonya (günümüz Letonya ve Estonya) Töton Tarikatı’nın, Polonya’nın, İsveç’in ve Rusya’nın çekiştiği stratejik ödüldür. Riga’yı ve Tartu’yu ele geçirmek tüm doğu Baltık kıyısını Danimarka ellerine verir."
 den_stralsund_treaty: "Stralsund’u Ele Geçir"
 den_stralsund_treaty_desc: "Stralsund ve Stettin, güney Baltık kıyısında Pomeranya’nın başlıca şehirleridir. 1370’te Danimarka burada aşağılayıcı bir antlaşmaya zorlandı. Şimdi Danimarka inisiyatifi ele alıyor: bu şehirleri denetlemek Pomeranya kıyısı üzerinde hâkimiyet kurar."
 den_expand_the_toll: "Geçiş Ücretini Genişlet"
 den_expand_the_toll_desc: "Sound Geçiş Ücretini tüm Baltık ticaret ağını kapsayacak şekilde genişlet. Pomeranya’ya boyun eğdirip Hansa Birliği’ni kırdıktan sonra Danimarka Kuzey Avrupa ticaretinin efendisi olur."
 den_master_of_the_baltic: "Baltık’ın Efendisi"
 den_master_of_the_baltic_desc: "Hansa yenilgisi ve Livonya denetimi: Danimarka Baltık’ın tartışmasız efendisidir. Königsberg’i ve Gdańsk’ı ele geçirmek kuşatmayı tamamlar: hiçbir ticaret gemisi Danimarka izni olmadan giremez veya çıkamaz."
 den_eliminate_novgorod: "Novgorod’u Ortadan Kaldır"
 den_eliminate_novgorod_desc: "Novgorod Cumhuriyeti, Baltık-Barents ticaret yollarının doğu ucundaki büyük ticaret devletidir. Novgorod’u ve Pskov’u denetlemek Rus kürkleri, kehribarı ve balının tüm ticaret yolunu Danimarka yönetimi altına alır."
 den_rival_england: "İngiltere’yi Rakip Say"
 den_rival_england_desc: "Danimarka kralı Muzaffer Valdemar bir zamanlar İngiltere’yi fethetti (1016). Büyük Knut’un Kuzey Denizi İmparatorluğu Danimarka’nın en büyük tarihî şanıydı. O hayalin yeniden peşine düşme vakti geldi. İngiltere’yi rakip ilan et ve Kuzey Denizi hâkimiyeti için yarış."
 den_north_sea_fleet: "Kuzey Denizi Filosu"
 den_north_sea_fleet_desc: "Kuzey Denizi’ne hükmetmek için güçlü bir filo gerekir. Kopenhag tersanelerini genişlet ve İskandinav tarihinin en büyük filosunu inşa et. Danimarka gemilerinin İzlanda’dan Thames’e yelken açtığı gün geldi."
 den_danish_scotland: "İskoçya’da Danimarka"
 den_danish_scotland_desc: "İskoçya İngiltere’nin ebedî düşmanı ve Danimarka’nın potansiyel müttefikidir. Edinburgh’u ele geçirmek İngiltere’nin etrafında kuzeyden ve güneyden bir kıskaç yaratır: Vikinglerin İskoçya kıyılarına hükmettiği çağı yeniden canlandırır."
 den_invade_england: "İngiltere’yi İstila Et"
 den_invade_england_desc: "Danimarka ve Norveç kuvvetleri kuzey İngiltere’ye çıktı. York bir zamanlar Jórvík Viking krallığının başkentiydi: Danelaw’ın kalbi. York’u ele geçirmek 9. yüzyılda Danimarkalı ve Norse yerleşimcilerin yönettiği geniş kuzey İngiltere topraklarının, Danelaw’ın şanını canlandırır."
 den_conquer_england: "İngiltere’yi Fethet"
 den_conquer_england_desc: "Londra ve Edinburgh Danimarka denetiminde: Büyük Knut’tan beri bin yıl içinde ilk kez bir İskandinav hanedanı Britanya Adaları’na hükmediyor. Danimarka, Norveç, İsveç ve İngiltere’nin Kuzey Denizi İmparatorluğu yeniden doğar."
 den_religious_question: "İnanç Meselesi"
 den_religious_question_desc: "Danimarka’nın inancı ne olmalı? Roma’daki Papa’ya bağlılığı korumak mı, Luther’in reform öğretilerini kucaklamak mı, yoksa atalarının kadim tanrılarına dönmek mi? Bu seçim Danimarka’nın geleceğini belirleyecek."
 den_catholic_denmark: "Katolik Danimarka"
 den_catholic_denmark_desc: "Danimarka Krallığı Roma Katolik Kilisesi’ne bağlılığını sürdürür. Papa ile iyi ilişkileri korumakla Danimarka, diplomatik bir avantajla kuzey Katolik uygarlığının koruyucusu olarak durur."
 den_crusade_north: "Kuzey Haçlı Seferi"
 den_crusade_north_desc: "Danimarka, Hıristiyan dünyasının kuzey kalkanı olarak durur ve inançsız uluslara karşı kutsal savaşa katılır. Doğu Baltık kıyısında kalan pagan topraklara karşı haçlı seferlerine öncülük etmek Danimarka’nın dinî otoritesini pekiştirir."
 den_kingdom_of_god: "Tanrı’nın Krallığı"
 den_kingdom_of_god_desc: "Papalıkla derin güven ve Hamburg’un denetimi: Danimarka kuzey Katolik uygarlığının koruyucusu olarak sarsılmaz bir konum kurdu. Roma tarafından tanınan Danimarka kralı tarihe “Kuzey’in Haçlısı” olarak kazınır."
 den_reformation: "Reform"
 den_reformation_desc: "1517’de Martin Luther doksan beş tezini yayımladı ve dinî reform dalgası Avrupa’yı sardı. 1536’da Kral III. Christian Lutherciliği Danimarka’nın devlet dini ilan etti. Bu tarihî dönüşümü önceden gerçekleştir ve Lutherci bir Danimarka inşa et."
 den_protestant_church: "Protestan Kilisesi"
 den_protestant_church_desc: "Lutherciliğe geçişin ardından kilise malları Danimarka tacına devredildi ve devlet maliyesini çarpıcı biçimde güçlendirdi. Lutherci ilahiyatçılar yetiştirmek için üniversiteler geliştir ve Protestan inancını tüm Danimarka’ya yerleştir."
 den_protestant_league: "Protestan Birliği"
 den_protestant_league_desc: "Lutherci uluslar Danimarka merkezli bir birlikte birleşir. Schmalkalden Birliği gibi Danimarka, Reform’un şampiyonu olarak Kuzey Avrupa’nın Protestan dünyasına öncülük eder."
 den_norse_revival: "Norse Canlanışı"
 den_norse_revival_desc: "Viking çağının tanrıları, Odin, Thor, Freyr, hiçbir zaman gerçekten ayrılmadı. Bazı Norse soylular Hıristiyanlaşmaya direndi ve eski tanrılara dönüşü düşledi. Bu hareketin kraliyet himayesi İskandinavya’da benzeri görülmemiş bir dinî devrimi ateşler."
 den_viking_tradition: "Viking Geleneği"
 den_viking_tradition_desc: "Kadim İskandinavların kanı yeniden kaynıyor. Ataların denizleri aşan, düşman topraklarına giren, yağmalayan ve fetheden savaşçı ruhu Danimarka ordusuna yerleşiyor. Güçlü bir kara ordusu ve filo inşa et; Viking çağının şanını yeniden yarat."
 den_asgard_kingdom: "Asgard Krallığı"
 den_asgard_kingdom_desc: "Odin’in lütfuyla İskandinavya kadim tanrıların krallığı olarak yeniden doğar. Savaşta ölen cesur savaşçıların Valhalla’ya kabul edildiği inancı ulusun manevi sütunu olur. Tüm İskandinavya’yı birleştir ve tanrıların diyarını inşa et."
 den_strengthen_crown: "Tacı Güçlendir"
 den_strengthen_crown_desc: "Danimarka Krallığı’nda kraliyet gücü tarihsel olarak güçlü soylular tarafından kısıtlanmıştır. “Handfæstning” her kralı tahta çıkarken soylu ayrıcalıkları tanımaya zorladı. Bu zincirleri yavaşça kır ve Danimarka monarşisini güçlendir."
 den_copenhagen_university: "Kopenhag Üniversitesi"
 den_copenhagen_university_desc: "1479’da kurulan Kopenhag Üniversitesi İskandinavya’nın en eski üniversitesidir. İlahiyat, hukuk, tıp ve felsefe fakülteleri onu Danimarka kültürünün merkezi yapar. Kopenhag’da üniversiteyi inşa et ve Kuzey’in akademik başkentini gerçekleştir."
 den_develop_copenhagen: "Kopenhag’ı Geliştir"
 den_develop_copenhagen_desc: "Kopenhag, “tüccarların limanı”, Baltık ticaretinin kilit merkezi olarak büyüdü. Onu şehir rütbesine yükselt; Danimarka’ya yaraşır büyük kraliyet başkentine dönüştür."
 den_revoke_privileges: "Ayrıcalıkları Kaldır"
 den_revoke_privileges_desc: "Danimarka kraliyet gücünü kısıtlayan soylu ayrıcalıklarını kaldır. Kraliyet otoritesini yükseltmek ve hükümet reformları uygulamak Danimarka’yı merkezî mutlakiyete giden yola koyar."
 den_danish_navy: "Danimarka Kraliyet Donanması"
 den_danish_navy_desc: "Kopenhag tersanelerini geliştir ve Danimarka Kraliyet Donanması’nı kur. Danimarka’nın Baltık ve Kuzey Denizi üzerindeki hegemonyasını destekleyen bu daimi askerî kurum Danimarka gücünün sütunu olur."
 den_amber_trade: "Kehribar Ticareti"
 den_amber_trade_desc: "Baltık kehribarı, “Kuzey’in Altını”, antik çağdan beri değerlidir. Danimarka’nın Baltık ticaret yolları aracılığıyla kehribar ve mücevher ihracatını genişlet ve zengin ticari gelir güvenceye al."
 den_develop_aarhus: "Aarhus’u Geliştir"
 den_develop_aarhus_desc: "Aarhus Jutland’ın en büyük şehri ve batı Danimarka’nın ticaret merkezidir. Onu şehir rütbesine yükseltmek Kopenhag’dan sonra Danimarka’nın ikinci şehri yapar."
 den_develop_malmo: "Malmö’yü Geliştir"
 den_develop_malmo_desc: "Güney İsveç’teki (Scania) Malmö, Öresund Boğazı’nın karşı yakasında Kopenhag ile karşılıklı durur. Bu şehri geliştirmek Danimarka’nın Baltık denetimi merkezi olarak Kopenhag’ın hayati bir karşılığını yaratır."
 den_absolutism: "Mutlakiyet"
 den_absolutism_desc: "1660’ta Kral III. Frederik üç zümreyi, soyluları, din adamlarını ve halkı topladı ve onlara kalıtsal mutlak monarşiyi ilan ettirdi. İskandinav tarihinin en dramatik siyasi dönüşümlerinden biri. Bu tarihî kaymayı önceden gerçekleştirmek için kraliyet otoritesini ve meşruiyeti yükselt."
 den_economic_powerhouse: "Kuzey Ticaret Gücü"
 den_economic_powerhouse_desc: "Sound Geçiş Ücreti, Kuzey Denizi ticareti, İskandinav tarımı: çeşitli gelir kaynaklarıyla Danimarka Kuzey Avrupa’nın en büyük ekonomik gücü oldu. Ekonomik hâkimiyeti güvence altına almak için 300+ gelir ve birden fazla pazar merkezini sürdür."
 den_north_sea_dominion: "Kuzey Denizi Egemenliği"
 den_north_sea_dominion_desc: "İskandinavya birleşti, Baltık’a hâkim olundu, İskandinav altın çağı sağlandı: Danimarka Kuzey Avrupa’nın en büyük imparatorluğu olarak hüküm sürer. 80+ gemi, 600+ aylık gelir ve 600+ konumla bu şanlı unvanı üstlen."
 den_scandinavian_empire: "İskandinav İmparatorluğu"
 den_scandinavian_empire_desc: "Baltık’tan İngiltere’ye, Gotland’dan Novgorod’a: İskandinav İmparatorluğu tamam. IV. Valdemar’ın yeniden inşa ettiği Danimarka tüm Kuzey Avrupa’ya hâkim büyük bir imparatorluğa dönüştü. 1000+ konum, prestij 80+, gelir 1000+: bu şanı ele geçir."
 den_events.10.t: "Norveç Şahsi Birliği"
 den_events.10.d: "Danimarka Kralı Norveç tahtını miras aldı. Viking çağından beri Danimarka ve Norveç tek bir kraliyet evi altında bağlıdır. Norveç’in zengin balıkçılığı, kerestesi ve Kuzey Atlantik’e açılan kapısı Danimarka gücünü çarpıcı biçimde genişletir. “İki Diyarın Kralı” unvanını taşıyan kral İskandinav birliğine tarihî ilk adımı attı."
 den_events.10.a: "Norveç ve Danimarka ilelebet birdir!"
 den_events.20.t: "İsveç Şahsi Birliği"
 den_events.20.d: "Danimarka Kralı İsveç tahtını da güvenceye aldı. Bazı İsveçli soylular direniyor, ama bu şahsi birlik İskandinav birliğine giden belirleyici adımdır. Kraliçe Margrete’nin diplomatik dehası bu mucizeyi başardı: “İskandinavya İmparatoru” hayali gerçeğe bir adım daha yaklaştı."
 den_events.20.a: "Üç krallığın birliğine, ileri!"
 den_events.30.t: "Kalmar Birliği"
 den_events.30.d: "İsveç’teki Kalmar’da Danimarka, Norveç ve İsveç temsilcileri toplandı ve Pomeranyalı Kral Erik altında birliği ilan etti. Her ülke kendi yasalarını ve geleneklerini korur, ama dış ve askerî politikayı koordine eder. “Valdemar hayal etti, Margrete gerçekleştirdi”: tarihçiler sonradan böyle yazacak."
 den_events.30.a: "Kalmar Birliği çok yaşasın! İskandinavya birdir!"
 den_events.40.t: "İnancın Kavşağı"
 den_events.40.d: "Danimarka sarayında şiddetli bir dinî tartışma patlak verdi. Roma’daki Papa’ya geleneksel bağlılığı mı sürdüreceğiz, Martin Luther’in yeni öğretilerini mi kucaklayacağız, yoksa atalarımızın kadim tanrılarına mı döneceğiz? Bu seçim Danimarka devletinin temellerine dokunuyor."
 den_events.40.a: "Roma’ya bağlılığı koru: Katoliklik Danimarka’nın inancıdır"
 den_events.40.a.tt: "Katolik yolu ilerlet. den_catholic_denmark görev koşullarını yerine getirmeyi kolaylaştırır."
 den_events.40.b: "Luther’in öğretilerini kucakla: reform çağı geldi"
 den_events.40.b.tt: "Lutherci yolu ilerlet. den_reformation görev koşullarını yerine getirmeyi kolaylaştırır."
 den_events.40.c: "Kadim tanrılara dön: Odin’in lütfunu ara"
 den_events.40.c.tt: "Norse yolu ilerlet. den_norse_revival görev koşullarını yerine getirmeyi kolaylaştırır."
 den_events.99.t: "İskandinav İmparatorluğu’nun Doğuşu"
 den_events.99.d: "IV. Valdemar’ın harabeye dönmüş bir Danimarka’yı miras almasından yüzyıllar sonra Danimarka tüm Kuzey Avrupa’ya hâkim büyük bir imparatorluğa dönüştü. Baltık’tan Kuzey Denizi’ne, Novgorod bozkırlarından Britanya Adaları’na her şey Danimarka imparatorunun diyarının içinde. Tarihçiler sonradan şöyle yazacak: “Atterdag, yine gündüz oldu, gerçek bir kehanetti.”"
 den_events.99.a: "İskandinav İmparatorluğu’nun İmparatoru çok yaşasın!"
 STATIC_MODIFIER_NAME_den_valdemar_legacy_mod: "Valdemar’ın Mirası"
 STATIC_MODIFIER_DESC_den_valdemar_legacy_mod: "“Atterdag, yine gündüz oldu.” IV. Valdemar’ın restorasyonu Danimarka’nın yeniden inşasının temel taşını attı."
 STATIC_MODIFIER_NAME_den_holstein_integration_mod: "Holstein Bütünleşti"
 STATIC_MODIFIER_DESC_den_holstein_integration_mod: "Holstein Dukalığı Danimarka İmparatorluğu’na tamamen bütünleşti. Güney sınırı istikrar kazandı ve güney ticaret yolları güvence altına alındı."
 STATIC_MODIFIER_NAME_den_scandinavia_united_mod: "İskandinavya Birleşti"
 STATIC_MODIFIER_DESC_den_scandinavia_united_mod: "Üç krallık tek bir sancak altında birleşti. Kuzey Avrupa’nın en büyük devletinin doğuşu."
 STATIC_MODIFIER_NAME_den_norway_integration_mod: "Norveç Bütünleşti"
 STATIC_MODIFIER_DESC_den_norway_integration_mod: "Norveç Danimarka İmparatorluğu’nun bir parçası olarak bütünleşti. Kuzey Atlantik’e açılan kapı açıldı."
 STATIC_MODIFIER_NAME_den_sweden_integration_mod: "İsveç Bütünleşti"
 STATIC_MODIFIER_DESC_den_sweden_integration_mod: "Danimarka kralının adı Stokholm salonlarında okunuyor ve İsveçli lordlar da imparatorluğun üyeleri olarak aynı masada yerlerini alıyor."
 STATIC_MODIFIER_NAME_den_visby_trade_mod: "Visby Ticaret Merkezi"
 STATIC_MODIFIER_DESC_den_visby_trade_mod: "Gotland’daki Visby bir Danimarka ticaret merkezi olarak yeniden canlandı. Eski Hansa şehri yeniden çiçek açıyor."
 STATIC_MODIFIER_NAME_den_sound_toll_mod: "Sound Geçiş Ücreti"
 STATIC_MODIFIER_DESC_den_sound_toll_mod: "Ücret toplama sistemi kuruldu. Baltık’a giren veya çıkan her ticaret gemisi Danimarka’ya öder."
 STATIC_MODIFIER_NAME_den_hansa_dominance_mod: "Hansa Yenilgisi"
 STATIC_MODIFIER_DESC_den_hansa_dominance_mod: "Danimarka Hansa hegemonyasını kırdı ve Baltık ticaretinin denetimini ele geçirdi."
 STATIC_MODIFIER_NAME_den_estonia_mod: "Estonya Yeniden Fethedildi"
 STATIC_MODIFIER_DESC_den_estonia_mod: "Tallinn (Danimarka kalesi) Danimarka’ya döndü. Doğu Baltık kıyısında Danimarka nüfuzu yeniden kuruldu."
 STATIC_MODIFIER_NAME_den_livonia_mod: "Livonya Denetlendi"
 STATIC_MODIFIER_DESC_den_livonia_mod: "Riga ve Tartu güvence altındayken tüm doğu Baltık kıyısı Danimarka yönetiminde."
 STATIC_MODIFIER_NAME_den_pomeranian_coast_mod: "Pomeranya Kıyısı"
 STATIC_MODIFIER_DESC_den_pomeranian_coast_mod: "Stralsund’u ve Stettin’i ele geçirmek tüm Pomeranya kıyısını Danimarka denetimine sokar."
 STATIC_MODIFIER_NAME_den_sound_toll_extended_mod: "Genişletilmiş Geçiş Ücreti"
 STATIC_MODIFIER_DESC_den_sound_toll_extended_mod: "Hangi Baltık limanına gidiyor olursa olsun, Öresund’dan geçen her gemi Danimarka gümrük evinin zincirinin önünde yelkenlerini indiriyor."
 STATIC_MODIFIER_NAME_den_baltic_master_mod: "Baltık’ın Efendisi"
 STATIC_MODIFIER_DESC_den_baltic_master_mod: "Danimarka filosu tüm Baltık Denizi’ne hâkim. Königsberg’den Gdańsk’a her liman Danimarka’ya cevap veriyor."
 STATIC_MODIFIER_NAME_den_eastern_routes_mod: "Doğu Ticaret Yolları"
 STATIC_MODIFIER_DESC_den_eastern_routes_mod: "Novgorod fethedildi: Rus mallarının tüm ticaret yolu artık Danimarka yönetiminde."
 STATIC_MODIFIER_NAME_den_north_sea_fleet_mod: "Kuzey Denizi Filosu"
 STATIC_MODIFIER_DESC_den_north_sea_fleet_mod: "Danimarka Kraliyet Donanması Kuzey Denizi’ni denetliyor. İzlanda’dan Thames’e Danimarka sancağı dalgalanıyor."
 STATIC_MODIFIER_NAME_den_scotland_mod: "İskoçya’da Danimarka"
 STATIC_MODIFIER_DESC_den_scotland_mod: "Edinburgh ele geçirildi: İngiltere artık kuzeyden ve güneyden kıskaca alınabilir."
 STATIC_MODIFIER_NAME_den_england_invasion_mod: "İngiltere’nin İstilası"
 STATIC_MODIFIER_DESC_den_england_invasion_mod: "York’u işgal eden Danimarka kuvvetleri Danelaw’ın hatırasını canlandırdı."
 STATIC_MODIFIER_NAME_den_north_sea_empire_mod: "Kuzey Denizi İmparatorluğu"
 STATIC_MODIFIER_DESC_den_north_sea_empire_mod: "Büyük Knut’tan beri bin yıl içinde ilk kez bir İskandinav hanedanı Britanya Adaları’na hükmediyor. Kuzey Denizi İmparatorluğu yeniden doğar."
 STATIC_MODIFIER_NAME_den_catholic_devotion_mod: "Katolik Bağlılık"
 STATIC_MODIFIER_DESC_den_catholic_devotion_mod: "Danimarka Roma Kilisesi’ne bağlılığını sürdürür. Papalıkla iş birliği Danimarka’ya diplomatik avantaj verir."
 STATIC_MODIFIER_NAME_den_northern_crusader_mod: "Kuzey Haçlısı"
 STATIC_MODIFIER_DESC_den_northern_crusader_mod: "Danimarka’nın kutsal savaşa katılımı ona Hıristiyan dünyasının koruyucusu olarak ün kazandırır."
 STATIC_MODIFIER_NAME_den_papal_champion_mod: "Papa’nın Şampiyonu"
 STATIC_MODIFIER_DESC_den_papal_champion_mod: "Danimarka kuzey Katolik uygarlığının koruyucusu olarak sarsılmaz bir konum kurdu."
 STATIC_MODIFIER_NAME_den_lutheran_reform_mod: "Lutherci Reform"
 STATIC_MODIFIER_DESC_den_lutheran_reform_mod: "El konulan manastırların altın kadehleri ve gümüş şamdanları Kopenhag’daki kralın darphanesinde eritilip yeni sikkeler olarak basılıyor."
 STATIC_MODIFIER_NAME_den_protestant_church_mod: "Protestan Kilisesi"
 STATIC_MODIFIER_DESC_den_protestant_church_mod: "Üniversite gelişimi ve Lutherci ilahiyat eğitimi Protestan inancını tüm Danimarka’ya yerleştirir."
 STATIC_MODIFIER_NAME_den_protestant_league_mod: "Protestan Birliği"
 STATIC_MODIFIER_DESC_den_protestant_league_mod: "Danimarka önderliğindeki bir Lutherci ittifak Kuzey Avrupa’nın Protestan dünyasını birleştirir."
 STATIC_MODIFIER_NAME_den_norse_revival_mod: "Norse Canlanışı"
 STATIC_MODIFIER_DESC_den_norse_revival_mod: "Odin’e, Thor’a ve Freyr’e tapınma yeniden kuruldu. Ataların savaşçı ruhu Danimarka ordularına yerleşiyor."
 STATIC_MODIFIER_NAME_den_viking_warriors_mod: "Viking Savaşçıları"
 STATIC_MODIFIER_DESC_den_viking_warriors_mod: "Viking çağı savaşçı ruhu yeniden doğdu. Danimarka orduları denizleri aşmakta ve düşman topraklarını fethetmekte eşsizdir."
 STATIC_MODIFIER_NAME_den_asgard_kingdom_mod: "Asgard Krallığı"
 STATIC_MODIFIER_DESC_den_asgard_kingdom_mod: "Odin’in lütfuyla İskandinavya kadim tanrıların diyarı olarak yeniden doğar."
 STATIC_MODIFIER_NAME_den_royal_authority_mod: "Kraliyet Otoritesi"
 STATIC_MODIFIER_DESC_den_royal_authority_mod: "Soylular konseyi artık kralın iradesinin önünde durmuyor ve emirleri diyarın her köşesindeki köylere doğrudan ulaşıyor."
 STATIC_MODIFIER_NAME_den_copenhagen_learning_mod: "Kopenhag Üniversitesi"
 STATIC_MODIFIER_DESC_den_copenhagen_learning_mod: "İskandinavya’nın en eski üniversitesi Kopenhag’da açık. Kuzey ilminin ve kültürünün merkezi olarak çiçek açıyor."
 STATIC_MODIFIER_NAME_den_copenhagen_capital_mod: "Kopenhag Başkenti Geliştirildi"
 STATIC_MODIFIER_DESC_den_copenhagen_capital_mod: "Kopenhag sokakları boyunca yeni taş konaklar birbiri ardına yükseliyor ve şehir bir kraliyet başkentine yaraşır biçimde canlı."
 STATIC_MODIFIER_NAME_den_absolutism_mod: "Mutlakiyet"
 STATIC_MODIFIER_DESC_den_absolutism_mod: "Danimarka’da mutlak monarşi kuruldu: 1660’ın tarihî dönüşümünü önceden gerçekleştirerek kraliyet gücü tamamen pekiştirildi."
 STATIC_MODIFIER_NAME_den_danish_economy_mod: "Danimarka Ekonomik Gücü"
 STATIC_MODIFIER_DESC_den_danish_economy_mod: "Sound Geçiş Ücreti’ne, Kuzey Denizi ticaretine ve İskandinav tarımına dayanan Danimarka ekonomisi Kuzey Avrupa’nın en büyüğü."
 STATIC_MODIFIER_NAME_den_crown_privileges_mod: "Taç Ayrıcalıkları"
 STATIC_MODIFIER_DESC_den_crown_privileges_mod: "Soyluların nesiller boyu koruduğu ayrıcalık fermanları yırtılıp atıldı ve kralın katipleri artık tüm diyarın idaresini yönetiyor."
 STATIC_MODIFIER_NAME_den_royal_navy_mod: "Danimarka Kraliyet Donanması"
 STATIC_MODIFIER_DESC_den_royal_navy_mod: "Kopenhag merkezli Danimarka Kraliyet Donanması kuruldu: Baltık ve Kuzey Denizi üstünlüğünü destekleyen daimi askerî kurum."
 STATIC_MODIFIER_NAME_den_amber_trade_mod: "Kehribar Ticareti"
 STATIC_MODIFIER_DESC_den_amber_trade_mod: "Baltık kehribarı ihracatı genişletildi. “Kuzey’in Altını” tüm Avrupa’da dolaşarak Danimarka’yı zenginleştiriyor."
 STATIC_MODIFIER_NAME_den_aarhus_mod: "Aarhus Geliştirildi"
 STATIC_MODIFIER_DESC_den_aarhus_mod: "Jutland’ın en büyük şehri Aarhus batı Danimarka’nın ticaret merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_den_malmo_mod: "Malmö Geliştirildi"
 STATIC_MODIFIER_DESC_den_malmo_mod: "Öresund Boğazı’nın batı kıyısındaki Malmö, Kopenhag ile boy ölçüşen bir Baltık ticaret merkezi olarak büyüdü."
 STATIC_MODIFIER_NAME_den_norway_north_mod: "Kuzey Norveç Geliştirildi"
 STATIC_MODIFIER_DESC_den_norway_north_mod: "Kuzey Norveç kıyısını geliştirmek Kuzey Atlantik ve Norveç Denizi üzerinde denetim kurar."
 STATIC_MODIFIER_NAME_den_golden_age_mod: "İskandinav Altın Çağı"
 STATIC_MODIFIER_DESC_den_golden_age_mod: "Norveç ve İsveç bütünleşmiş ve mutlakiyet kurulmuşken İskandinavya Kuzey Avrupa’nın en büyük imparatorluğu olarak altın çağına girer."
 STATIC_MODIFIER_NAME_den_north_sea_dominion_mod: "Kuzey Denizi Egemenliği"
 STATIC_MODIFIER_DESC_den_north_sea_dominion_mod: "Hem Baltık’ı hem Kuzey Denizi’ni denetleyen Danimarka tüm Kuzey Avrupa ticaretine hâkim."
 STATIC_MODIFIER_NAME_den_scandinavian_empire_final_mod: "İskandinav İmparatorluğu"
 STATIC_MODIFIER_DESC_den_scandinavian_empire_final_mod: "Baltık’tan Kuzey Denizi’ne uzanan İskandinav İmparatorluğu tamam. Valdemar’ın restorasyonundan Danimarka’nın yeniden inşası zirvesine ulaştı."
 STATIC_MODIFIER_NAME_den_norway_union_bonus_mod: "Norveç Birliği Bonusu"
 STATIC_MODIFIER_DESC_den_norway_union_bonus_mod: "Norveç şahsi birliği İskandinav birliğine giden yolu açtı."
 STATIC_MODIFIER_NAME_den_sweden_union_bonus_mod: "İsveç Birliği Bonusu"
 STATIC_MODIFIER_DESC_den_sweden_union_bonus_mod: "İsveç şahsi birliği Kalmar Birliği’nin oluşumunu görüş alanına getirir."
 STATIC_MODIFIER_NAME_den_kalmar_union_mod: "Kalmar Birliği"
 STATIC_MODIFIER_DESC_den_kalmar_union_mod: "Danimarka, Norveç ve İsveç tek bir kral altında birleşti: Kuzey tarihinin en büyük siyasi bütünleşmesi."
 STATIC_MODIFIER_NAME_den_faith_steadfast_mod: "İnançta Sarsılmaz"
 STATIC_MODIFIER_DESC_den_faith_steadfast_mod: "Sarsılmaz Katolik inancı, Roskilde Katedrali’nin çanlarının çalmasıyla kralın otoritesini halka ilan eder."
 STATIC_MODIFIER_NAME_den_reform_winds_mod: "Reform Rüzgârları"
 STATIC_MODIFIER_DESC_den_reform_winds_mod: "Luther’in öğretileri Danimarka’ya yayılıyor. Reform dalgası Danimarka toplumunu değiştiriyor."
 STATIC_MODIFIER_NAME_den_old_gods_calling_mod: "Kadim Tanrıların Çağrısı"
 STATIC_MODIFIER_DESC_den_old_gods_calling_mod: "Odin’e ve Thor’a inanç gizlice yeniden canlanıyor. Ata tanrılarının lütfu Danimarka ordularına ilham veriyor."
 den_finland_integration: "Finlandiya’yı Bütünleştir"
 den_finland_integration_desc: "Finlandiya, İsveç krallığının uçsuz bucaksız ormanlık doğu diyarıdır. Åbo (Turku) Finlandiya’nın idari ve dinî merkezidir; Viborg Karelya sınırını korur; Uleåborg (Oulu) en kuzeydeki şehirdir. Finlandiya’yı tamamen denetlemek Danimarka imparatorluğunun doğu sınırını kuzey Baltık’tan Kuzey Kutup Dairesi’ne kurar ve ıssızlık boyunca bir sömürge politikasına olanak verir."
 STATIC_MODIFIER_NAME_den_finland_mod: "Finlandiya Sınırı"
 STATIC_MODIFIER_DESC_den_finland_mod: "Finlandiya’nın uçsuz bucaksız ormanları ve su yolları yerleşimcileri çeker. Danimarka’dan ve İsveç’ten göçmenler bu sınır toprağını açarak imparatorluğun doğu sınırlarını giderek daha da ileriye iter."
