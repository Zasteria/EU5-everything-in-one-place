 brb_estates_balance_reform: "Soylular ve Burjuvalar Arasındaki Denge"
 brb_estates_balance_reform_desc: "Feodal soylular ya da ticaret burjuvaları: hangisinin sesi daha yüksek çıkarsa büyük dukalığın yönetiminin karakterini o belirler. Soyluların etkisi arttıkça feodal düzen ve vergi gücü güçlenir; burjuvaların etkisi arttıkça ticari refah güçlenir."
