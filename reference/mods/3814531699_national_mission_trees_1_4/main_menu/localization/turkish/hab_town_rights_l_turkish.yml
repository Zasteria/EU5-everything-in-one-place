l_turkish:
 wiener_stadtrecht_town_rights: "Viyana Şehir Hukuku"
 wiener_stadtrecht_town_rights_desc: "Yalnızca Viyana’ya verilen özel bir şehir hakkı: pazar erişimini, ticaret merkezi gücünü ve tüccar kapasitesini geliştirir. Yalnızca Viyana’ya verilebilir."
 landstadt_town_rights: "Landstadt"
 landstadt_town_rights_desc: "İmparatorluk şehirlerine verilen şehir hakları: taç ve soylu zümresi gücünü pekiştirir, başkentten idari erişimi geliştirir."
