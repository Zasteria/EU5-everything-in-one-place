 hol_republican_reform: "República sob a soberania dos Estados"
 hol_republican_reform_desc: "Uma forma peculiar de governo sem stadtholder, em que a soberania repousa nas assembleias das sete províncias — favorece o comércio e os interesses do estamento burguês, embora manter um exército permanente se torne um pouco mais difícil."
