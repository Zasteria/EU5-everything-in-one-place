l_braz_por:
 bra_quality_doctrine_reform: "Doutrina da arma de elite"
 bra_quality_doctrine_reform_desc: "Uma doutrina militar que prioriza um exército pequeno e de elite — soldados excelentes e o uso hábil de milícias permitem que uma força menor enfrente uma maior. Cara de manter, mas inigualável em poder de combate."
 bra_quantity_doctrine_reform: "Doutrina da mobilização geral"
 bra_quantity_doctrine_reform_desc: "“A Prússia não é um Estado com um exército, mas um exército com um Estado” — uma doutrina de quantidade, não de qualidade, que esmaga o inimigo pelo número. Barata de manter, embora a disciplina e o moral sofram um pouco."
 bra_advanced_quality_doctrine_reform: "Auftragstaktik"
 bra_advanced_quality_doctrine_reform_desc: "A “tática de missão” — uma doutrina que confia decisões independentes aos comandantes de campo, permitindo ação rápida e adequada à situação. Um exército de maestria incomparável em todas as armas, infantaria e artilharia por igual, que estabelece uma vantagem esmagadora pela qualidade. Caro em manutenção e em efetivos, mas nenhum exército iguala seu poder de combate."
 bra_advanced_quantity_doctrine_reform: "Nação em armas"
 bra_advanced_quantity_doctrine_reform_desc: "Uma doutrina de mobilização nacional total que arma toda a população — barata de manter, com efetivos abundantes e enorme largura de frente que esmagam o inimigo pelo número. A disciplina e o moral continuam sendo o ponto fraco."
 bra_german_empire_reform: "Constituição imperial alemã"
 bra_german_empire_reform_desc: "Uma estrutura de governo peculiarmente alemã — uma federação de Estados coroada por um Imperador, combinando autoridade central com autonomia federal. Eleva a legitimidade e o prestígio da coroa, oferecendo tanto domínio comercial quanto flexibilidade na administração interna."
