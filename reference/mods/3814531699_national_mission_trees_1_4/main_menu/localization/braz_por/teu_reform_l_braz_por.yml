l_braz_por:
 teu_crusade_path_reform: "Disciplina da Ordem Cruzada"
 teu_crusade_path_reform_desc: "O voto de disciplina imposto pelo Grão-Mestre a todos os cavaleiros-monges no início da Cruzada do Leste. A pilhagem é convertida em instrumento de uma expedição organizada, e o exército marcha sob a bandeira da guerra santa."
 teu_northern_crusade_reform: "Regime de pilhagem da Cruz de Ferro"
 teu_northern_crusade_reform_desc: "Um reinado de terror erguido à sombra da cruz. A riqueza é extraída sem piedade das terras conquistadas, e os que resistem são vendidos como escravos. Os antigos ideais da guerra santa desbotaram; a Ordem já não é uma simples irmandade cruzada, mas um Estado militar construído sobre conquista e exploração."
 teu_northern_crusade_reform_loot_tt: "Causa dano de pilhagem às províncias ocupadas (diminui com o tempo)"
