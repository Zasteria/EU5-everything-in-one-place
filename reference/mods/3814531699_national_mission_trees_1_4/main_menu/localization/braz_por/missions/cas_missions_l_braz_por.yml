l_braz_por:
 cas_castile_dev_hub: "Desenvolvimento das Cidades da Coroa"
 cas_castile_dev_hub_desc: "Dirija o desenvolvimento das cidades pertencentes ao domínio da coroa castelhana e assegure a base econômica do reino."
 cas_granada_dev_hub: "Renascimento de Granada"
 cas_granada_dev_hub_desc: "Traga nova prosperidade às cidades do extinto Reino de Granada — a própria Granada e Málaga."
 STATIC_MODIFIER_NAME_cas_crown_domains_mod: "Desenvolvimento das Cidades da Coroa"
 STATIC_MODIFIER_DESC_cas_crown_domains_mod: "Os coletores de impostos do rei percorrem com orgulho os novos mercados e muralhas erguidos nas cidades da coroa."
 STATIC_MODIFIER_NAME_cas_granada_dev_mod: "Granada Renascida"
 STATIC_MODIFIER_DESC_cas_granada_dev_mod: "Das janelas da Alhambra, o som dos novos sinos das igrejas se espalha por todo o vale."
 cas_castile_mission_pack: "A Glória do Reino de Castela"
 cas_castile_mission_pack_DESCRIPTION:0 "Em 1337, Castela é um reino poderoso sob Afonso XI. A Reconquista está quase completa — resta apenas Granada. A queda de Granada, a união com Aragão, a navegação de Colombo, os conquistadores Cortés e Pizarro e o Império de Filipe II, no qual o sol nunca se punha. Percorra a história de Castela."
 cas_castile_mission_pack_CRITERIA_DESCRIPTION:0 "Conclua a Reconquista, forme a Espanha, construa um império colonial e estabeleça o Império em que o sol nunca se põe."
 cas_castile_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para estabelecer o Império em que o sol nunca se põe."
 cas_castile_mission_pack_BUTTON_DETAILS:0 "Da queda de Granada ao império mundial de Filipe II!"
 cas_sword_of_castile: "A Espada de Castela"
 cas_sword_of_castile_desc: "Ano de 1337 — Afonso XI governa Castela com energia. Na batalha do Salado, em 1340, destruiu as forças combinadas dos merínidas e de Granada, assentando a base para expulsar da Península Ibérica o último poder muçulmano. Ergue as coroas de Castela e Leão e levante de novo a espada da Reconquista."
 cas_secure_castile: "Desenvolvimento de Valladolid"
 cas_secure_castile_desc: "Possuindo por inteiro tanto Castela quanto Leão, estabeleça a base central da Reconquista."
 cas_fall_of_granada: "A Queda de Granada"
 cas_fall_of_granada_desc: "2 de janeiro de 1492 — o último sultão de Granada, Boabdil, entrega as chaves a Isabel de Castela no “Monte das Lágrimas”. A Reconquista, que durou 780 anos, chega enfim ao fim."
 cas_conquer_navarre: "Conquiste Navarra"
 cas_conquer_navarre_desc: "A conquista do Reino de Navarra, na encruzilhada dos Pireneus, estabelece a fronteira com a França e completa o domínio da Ibéria setentrional."
 cas_subdue_aragon: "União com Aragão"
 cas_subdue_aragon_desc: "O casamento de Isabel e Fernando (1469) criou a união pessoal de Castela e Aragão. Sob os “Reis Católicos”, a Espanha ganha forma."
 cas_form_spain: "Formação da Espanha"
 cas_form_spain_desc: "Castela, tendo unido a maior parte da Península Ibérica, proclama formalmente o “Reino da Espanha”. Nasce a maior potência da Europa."
 cas_conquer_portugal: "Incorporação de Portugal"
 cas_conquer_portugal_desc: "Em 1580, Filipe II herdou o trono português — a “União Ibérica”. Isso deu à Espanha também o controle do império colonial de Portugal."
 cas_iberian_union: "A União Ibérica"
 cas_iberian_union_desc: "Toda a Península Ibérica passa ao domínio espanhol. Do Atlântico ao Oceano Índico, as colônias espanholas e portuguesas cobrem o mundo."
 cas_holy_brotherhood: "A Santa Irmandade"
 cas_holy_brotherhood_desc: "A Santa Irmandade, estabelecida pela rainha Isabel, limita o poder da nobreza e reforça a autoridade real como organização de ordem pública."
 cas_inquisition: "A Inquisição Espanhola"
 cas_inquisition_desc: "Em 1478, o papa Sisto IV concedeu a Isabel e Fernando autoridade para estabelecer a Inquisição. Os inquisidores, sob a liderança de Torquemada, trabalham para preservar a pureza da fé."
 cas_expulsion_of_jews: "O Decreto de Expulsão"
 cas_expulsion_of_jews_desc: "O Decreto da Alhambra, de 1492 — proclama a expulsão da Espanha dos judeus que se recusaram a converter-se. Essa decisão preserva a pureza católica, mas priva o país de muitos mercadores e eruditos talentosos."
 cas_catholic_monarchs: "Os Reis Católicos"
 cas_catholic_monarchs_desc: "O papa Alexandre VI concede a Isabel e Fernando o título de “Reis Católicos” (Reyes Católicos). A Espanha é reconhecida como guardiã do mundo católico."
 cas_absolute_crown: "Monarquia Absoluta"
 cas_absolute_crown_desc: "Restringir os privilégios da nobreza e tornar absoluto o poder real — a Espanha surge como um dos primeiros Estados absolutistas modernos da Europa."
 cas_cortes: "As Cortes de Castela"
 cas_cortes_desc: "As Cortes (parlamento) — a assembleia tradicional de estamentos de Castela. Equilibrar o poder real e o parlamento estabelece um sistema de governo duradouro."
 cas_leyes_de_indias: "As Leis das Índias"
 cas_leyes_de_indias_desc: "As Leis das Índias, que regulam o tratamento dos povos nativos nas colônias — estabelecidas em resposta aos argumentos humanitários de Bartolomé de las Casas."
 cas_canary_islands: "As Ilhas Canárias"
 cas_canary_islands_desc: "As Ilhas Canárias, no Atlântico — ponto estratégico na rivalidade com Portugal. O controle dessas ilhas inicia a expansão atlântica da Espanha."
 cas_atlantic_exploration: "Exploração Atlântica"
 cas_atlantic_exploration_desc: "Enquanto Portugal avança para o sul ao longo da costa africana, a Espanha volta-se para o oeste, através do Atlântico. O sonho da “rota ocidental para as Índias” está pronto para tornar-se realidade."
 cas_columbus_voyage: "A Viagem de Colombo"
 cas_columbus_voyage_desc: "3 de agosto de 1492 — Cristóvão Colombo zarpa de Palos. Três navios — a “Santa Maria”, a “Pinta” e a “Niña” — cortam o Atlântico e abrem as portas de um novo mundo."
 cas_conquer_caribbean: "Conquiste o Caribe"
 cas_conquer_caribbean_desc: "Com Hispaniola (Santo Domingo) como base, estabelece-se o domínio espanhol no Caribe. Açúcar, tabaco e metais preciosos criam um fluxo de riqueza para a Espanha."
 cas_conquer_mexico: "Conquiste o México"
 cas_conquer_mexico_desc: "1519-1521 — Hernán Cortés conquistou a capital asteca, Tenochtitlán, com 500 soldados. Nasce o “Vice-Reino da Nova Espanha”."
 cas_conquer_peru: "Conquiste o Peru"
 cas_conquer_peru_desc: "Francisco Pizarro derrubou o Império Inca com 168 homens — uma das conquistas mais espantosas da história. O ouro e a prata dos Andes fluem para a Espanha."
 cas_silver_of_potosi: "A Prata de Potosí"
 cas_silver_of_potosi_desc: "As minas de prata de Potosí (descobertas em 1545, a 4000 m de altitude) — as maiores da história europeia. A prata do “Cerro Rico (Monte Rico)” sustenta as finanças do Império Espanhol."
 cas_colonial_empire: "O Império Colonial"
 cas_colonial_empire_desc: "Do México ao Peru, do Caribe ao litoral sul da América do Norte — as colônias espanholas cobrem o mundo. Os feitos dos conquistadores lançam a base do império."
 cas_manila_galleon: "O Galeão de Manila"
 cas_manila_galleon_desc: "Depois da fundação de Manila em 1571, o Galeão de Manila monopolizou o comércio transoceânico entre Acapulco e Manila — a primeira rota comercial verdadeiramente global, ligando a seda e a porcelana asiáticas à prata americana."
 cas_conquer_naples: "Conquiste o Reino de Nápoles"
 cas_conquer_naples_desc: "“El Gran Capitán”, Gonzalo de Córdoba, derrotou a França e tomou Nápoles. Estabelecida a influência espanhola na Itália."
 cas_conquer_sicily: "Assegure a Sicília"
 cas_conquer_sicily_desc: "A Sicília, celeiro do Mediterrâneo, já sob a coroa de Aragão, é incorporada ao Império Espanhol, completando o controle das ilhas mediterrâneas."
 cas_conquer_milan: "Conquiste Milão"
 cas_conquer_milan_desc: "Como resultado final das guerras italianas, o ducado de Milão passa ao domínio espanhol. Toda a península italiana torna-se esfera de influência espanhola."
 cas_mediterranean_mastery: "Domínio do Mediterrâneo"
 cas_mediterranean_mastery_desc: "Nápoles, Sicília, Sardenha, Milão — o império mediterrâneo da Espanha está estabelecido. Pela primeira vez desde a Roma antiga, uma só potência governa o Mediterrâneo."
 cas_battle_of_lepanto: "A Batalha de Lepanto"
 cas_battle_of_lepanto_desc: "7 de outubro de 1571 — a frota da Liga Santa, formada por Espanha, Veneza e o papa, destrói a frota otomana. A “Vitória da Liga Santa”. Estabelecida a superioridade cristã no Mediterrâneo."
 cas_secure_ceuta: "Assegure Ceuta"
 cas_secure_ceuta_desc: "Ceuta, em frente à Península Ibérica através do Estreito de Gibraltar, é a porta da África. Controlá-la garante a entrada ocidental do Mediterrâneo."
 cas_conquer_oran: "Conquiste Orã"
 cas_conquer_oran_desc: "Em 1509, o cardeal Cisneros conquistou Orã — o primeiro passo da “Reconquista Africana”. Começa o contra-ataque às forças muçulmanas do norte da África."
 cas_conquer_tunis: "Conquiste Túnis"
 cas_conquer_tunis_desc: "Em 1535, as forças espanholas de Carlos V conquistaram Túnis. O poderio militar da Espanha, que disputa com o Império Otomano o domínio do norte da África, é exibido ao mundo."
 cas_north_africa_dominion: "Domínio do Norte da África"
 cas_north_africa_dominion_desc: "De Ceuta a Orã, o litoral mediterrâneo do norte da África passa ao domínio espanhol. A pirataria muçulmana é erradicada e o comércio mediterrâneo se estabiliza."
 cas_dev_sevilla: "Porta das Índias"
 cas_dev_sevilla_desc: "Sevilha, no Guadalquivir — a antiga cidade floresce como porta singular para o comércio com o Novo Mundo. A “Casa de Contratación” faz dela a maior cidade comercial do mundo."
 cas_casa_de_contratacion: "A Casa de Contratação"
 cas_casa_de_contratacion_desc: "Estabelecida em Sevilha em 1503, a Casa de Contratação administra com exclusividade o comércio colonial espanhol. Todo o comércio com o Novo Mundo passa por ela."
 cas_dev_toledo: "Indústria do Aço de Toledo"
 cas_dev_toledo_desc: "Toledo — capital histórica de Castela e cidade industrial famosa por suas espadas, joias e sedas. A fama do “aço de Toledo” se espalha pelo mundo."
 cas_dev_madrid: "Madri como Capital"
 cas_dev_madrid_desc: "Em 1561, Filipe II declarou Madri capital permanente — uma mudança revolucionária para a Espanha, onde a corte antes passava de cidade em cidade. A população de Madri cresce rapidamente."
 cas_dev_burgos: "A Cidade do Cid"
 cas_dev_burgos_desc: "Burgos, a “Cidade do Cid” — capital histórica de Castela, que floresce com a exportação de lã para o norte da Europa."
 cas_trade_network: "A Rede Comercial Imperial"
 cas_trade_network_desc: "De Sevilha a Manila, de Antuérpia ao Novo Mundo — a rede comercial imperial da Espanha abarca todo o globo."
 cas_tercio: "O Tercio (quadrado espanhol)"
 cas_tercio_desc: "A maior tática do século XVI — o tercio combina piqueiros, mosqueteiros e espadachins numa formação de infantaria. A “infantaria espanhola — a mais forte do mundo” comprovada no campo de batalha."
 cas_military_orders: "As Ordens Militares"
 cas_military_orders_desc: "As três ordens militares — Santiago, Calatrava e Alcântara — têm, na era dos Reis Católicos, seu patrimônio e poder postos sob controle real para sustentar a força militar."
 cas_grande_armada: "A Grande Armada"
 cas_grande_armada_desc: "Em 1588, Filipe II enviou uma grande frota de 130 navios, a “Armada”, para conquistar a Inglaterra — símbolo do auge do poderio naval espanhol."
 cas_conquistadors: "Os Conquistadores"
 cas_conquistadors_desc: "Cortés, Pizarro, Balboa, de Soto — os nomes dos conquistadores gravados na história. Conquistando vastos impérios com poucos soldados, mostraram ao mundo a superioridade da tecnologia militar espanhola."
 cas_salamanca_university: "A Universidade de Salamanca"
 cas_salamanca_university_desc: "Fundada em 1218, a Universidade de Salamanca é uma das mais antigas da Europa. Como a melhor instituição de teologia, direito e medicina, forma funcionários, clérigos e eruditos do Império Espanhol."
 cas_siglo_de_oro: "O Século de Ouro (Siglo de Oro)"
 cas_siglo_de_oro_desc: "Cervantes, Lope de Vega, Velázquez, El Greco — floresce a era de ouro cultural espanhola dos séculos XVI-XVII. A Espanha lidera a Europa em literatura, teatro e pintura."
 cas_escorial: "O Escorial"
 cas_escorial_desc: "O palácio-mosteiro do Escorial, cuja construção Filipe II ordenou em 1563 — reunindo palácio, mosteiro e mausoléu, essa estrutura monumental simboliza o auge do Império Espanhol."
 cas_dev_granada_city: "A Pérola da Espanha"
 cas_dev_granada_city_desc: "Granada, lar do palácio da Alhambra — cidade em que respira a herança cultural muçulmana. Desenvolva essa “pérola da Espanha” como centro cultural e econômico do sul."
 cas_dev_cordoba: "A Glória do Couro de Córdoba"
 cas_dev_cordoba_desc: "Conhecida por sua Mesquita-Catedral, Córdoba foi outrora a capital do califado omíada e a maior cidade do mundo. Aproveite essa herança para desenvolvê-la como centro de cultura e saber."
 cas_inherit_flanders: "Herde Flandres"
 cas_inherit_flanders_desc: "Flandres foi incorporada à Espanha como parte da herança borgonhesa. As ricas cidades têxteis de Antuérpia, Bruges e Gante sustentam as finanças do Império Espanhol."
 cas_revolt_of_flanders: "Pacifique Flandres"
 cas_revolt_of_flanders_desc: "Suprima a resistência flamenga e incorpore essa próspera região como parte permanente do Império Espanhol."
 cas_greatest_power: "Os Alicerces do Império Que Nunca Dorme"
 cas_greatest_power_desc: "O império colonial, o tercio e a Armada — três pilares concluídos, e a Espanha alcançou uma prosperidade sem precedentes. Chegou o momento de dar o último passo rumo ao Império em que o sol nunca se põe."
 cas_empire_of_the_sun: "O Império em que o Sol Nunca se Põe"
 cas_empire_of_the_sun_desc: "“Em meu Império o sol nunca se põe (En mi Imperio nunca se pone el sol)” — as palavras de Carlos V tornam-se realidade. Da Espanha a Nápoles, de Flandres ao Novo Mundo, de Manila ao Caribe — a bandeira espanhola tremula em todos os cantos da terra."
 cas_battle_rio_salado: "Vitória no Salado"
 cas_battle_rio_salado_desc: "Na batalha do Salado, em 1340, Afonso XI esmagou as forças combinadas dos merínidas e de Granada — abre-se a cortina do último ato da Reconquista."
 cas_dev_leon_city: "A Glória do Antigo Reino de Leão"
 cas_dev_leon_city_desc: "Leão, antiga capital do Reino de Leão, que um dia liderou a Reconquista — desenvolva-a apoiando-se em sua história e tradição."
 cas_church_reform: "Reforma da Igreja"
 cas_church_reform_desc: "A reforma eclesiástica sob a liderança do cardeal Cisneros — restaurar a disciplina monástica, melhorar a educação do clero e erradicar a corrupção faz da Igreja Católica da Espanha a mais forte autoridade espiritual da Europa."
 cas_counter_reformation: "A Contrarreforma"
 cas_counter_reformation_desc: "A Companhia de Jesus, fundada por Inácio de Loyola — a Contrarreforma, liderada pela Espanha, opõe-se à ameaça protestante. O Concílio de Trento reafirma a doutrina católica."
 cas_conquer_cuba: "Conquiste Cuba"
 cas_conquer_cuba_desc: "Em 1511, Diego Velázquez conquistou Cuba. Havana se desenvolve como nó comercial caribenho e torna-se porto-chave nas rotas para o Novo Mundo."
 cas_conquer_florida: "Explore a Flórida"
 cas_conquer_florida_desc: "Juan Ponce de León descobriu “La Florida (Terra das Flores)” em 1513 — perseguindo a lenda da “Fonte da Juventude”, começa a exploração da América do Norte."
 cas_conquer_philippines: "Conquiste as Filipinas"
 cas_conquer_philippines_desc: "Em 1565, Miguel López de Legazpi conquistou as Ilhas Filipinas e fundou Manila. Concluída a expansão asiática da Espanha, nasce o comércio transoceânico do Galeão de Manila."
 cas_gold_fleets: "As Frotas de Ouro e Prata"
 cas_gold_fleets_desc: "A prata de Potosí e o ouro dos incas — a “Frota das Índias (Flota de Indias)” anual, rumo à Espanha, cria o maior fluxo de riqueza do mundo."
 cas_sardinia: "Assegure a Sardenha"
 cas_sardinia_desc: "A Sardenha, já sob a coroa de Aragão, é incorporada ao Império Espanhol, completando o controle das ilhas do Mediterrâneo ocidental."
 cas_conquer_tunis_italy: "Estabeleça o Domínio Italiano"
 cas_conquer_tunis_italy_desc: "Nápoles, Sicília, Sardenha, Milão — as principais regiões da Península Itálica passam ao domínio espanhol, somando a riqueza do Renascimento à prosperidade do Império Espanhol."
 cas_garrison_system: "Rede Defensiva de Guarnições"
 cas_garrison_system_desc: "Uma rede defensiva de guarnições que protege o vasto Império Espanhol — os tercios em Flandres, as fortalezas em Nápoles e os presídios no norte da África guardam as fronteiras do império."
 cas_dev_cadiz: "O Antigo Porto Fenício"
 cas_dev_cadiz_desc: "A antiga cidade fenícia de Cádis ergue-se num porto natural numa península atlântica. Está destinada a substituir Sevilha como porta do comércio com as Índias."
 cas_dev_malaga: "Desenvolva Málaga"
 cas_dev_malaga_desc: "Málaga, no litoral mediterrâneo — cidade mercantil conhecida pela seda, pelo vinho e pelas passas. Desenvolve-se rapidamente após a conquista de Granada."
 cas_dev_valencia: "A Cidade do Sol"
 cas_dev_valencia_desc: "Valência, a “Cidade do Sol”, é um nó comercial mediterrâneo que produz seda, açúcar e arroz. O desenvolvimento da principal cidade da coroa de Aragão traz prosperidade ao litoral leste da Espanha."
 cas_dev_zaragoza: "A Capital de Aragão"
 cas_dev_zaragoza_desc: "Saragoça, capital do Reino de Aragão, é um nó de transporte-chave no Ebro. Seu desenvolvimento anima o comércio interno ibérico."
 cas_dev_barcelona: "A Rainha do Mediterrâneo"
 cas_dev_barcelona_desc: "Barcelona, centro do comércio mediterrâneo — desenvolva a capital catalã, a maior cidade comercial de Aragão, como nó comercial mediterrâneo do Império Espanhol."
 cas_dev_segovia: "O Aqueduto de Segóvia"
 cas_dev_segovia_desc: "Segóvia, famosa por seu aqueduto e seu castelo real, desenvolve-se como símbolo do poder real de Castela."
 cas_west_africa_trade: "Comércio com a África Ocidental"
 cas_west_africa_trade_desc: "Usando as Ilhas Canárias como cabeça de ponte, a Espanha entra no comércio com a África Ocidental, disputando com Portugal as rotas de marfim, ouro e, por fim, do tráfico de escravos."
 cas_council_of_trent: "O Concílio de Trento"
 cas_council_of_trent_desc: "O Concílio de Trento (1545-1563) — liderado pela Espanha, reafirma a doutrina católica e define os rumos da Contrarreforma. Os jesuítas lideram o contra-ataque ao protestantismo."
 cas_events.20.t: "A Queda de Granada — Fim da Reconquista"
 cas_events.20.d: "2 de janeiro de 1492 — as portas da Alhambra se abrem, e o último sultão de Granada, Muhammad XII (Boabdil), entrega as chaves a Isabel e Fernando no “Monte das Lágrimas”. A Reconquista, que durou 780 anos, chega finalmente ao fim. “Chora agora como mulher o que não soubeste defender como homem” — as palavras da mãe de Boabdil permanecem na história."
 cas_events.20.a: "Glória à Espanha! Reconquista concluída! Glória a Deus e à Virgem Maria!"
 cas_events.30.t: "Os Reis Católicos — União com Aragão"
 cas_events.30.d: "Décadas após o casamento de Isabel e Fernando — chegou a hora da união de Castela e Aragão. O papa Alexandre VI lhes concede o título de “Reis Católicos” (Reyes Católicos), e a formação da Espanha como nação torna-se realidade."
 cas_events.30.a: "Glória aos Reis Católicos! A Espanha une-se numa só fé!"
 cas_events.50.t: "A Viagem de Colombo — Descoberta do Novo Mundo"
 cas_events.50.d: "12 de outubro de 1492 — Cristóvão Colombo desembarca na ilha de Guanahani, nas Bahamas. Revela-se a existência de um Novo Mundo, desconhecido dos europeus. A descoberta de Colombo, que acreditava ter chegado às “Índias (Ásia)”, trará à Espanha riqueza incalculável."
 cas_events.50.a: "Bênção de Deus sobre o Novo Mundo! A bandeira da Espanha até o distante litoral do Atlântico!"
 cas_events.99.t: "O Império em que o Sol Nunca se Põe"
 cas_events.99.d: "“Em meu Império o sol nunca se põe (En mi Imperio nunca se pone el sol)” — as palavras de Carlos V tornam-se realidade. Da Espanha a Nápoles, de Flandres ao Novo Mundo, das Filipinas ao Caribe, a bandeira espanhola tremula em todos os cantos do mundo. No reinado de Filipe II, o Império Espanhol é concluído como o primeiro “império mundial” da humanidade."
 cas_events.99.a: "Glória ao Império em que o sol nunca se põe! Espanha para sempre!"
 STATIC_MODIFIER_NAME_cas_reconquista_spirit_mod: "O Espírito da Reconquista"
 STATIC_MODIFIER_DESC_cas_reconquista_spirit_mod: "A espada de Castela inspira a guerra santa contra os muçulmanos da Ibéria."
 STATIC_MODIFIER_NAME_cas_rio_salado_mod: "Vitória no Salado"
 STATIC_MODIFIER_DESC_cas_rio_salado_mod: "O esmagamento da coalizão de merínidas e Granada no Salado abre o último ato da Reconquista."
 STATIC_MODIFIER_NAME_cas_leon_city_mod: "A Glória do Antigo Reino de Leão"
 STATIC_MODIFIER_DESC_cas_leon_city_mod: "A antiga capital de Leão desenvolvida como símbolo da herança da Reconquista."
 STATIC_MODIFIER_NAME_cas_church_reform_mod: "Reforma da Igreja"
 STATIC_MODIFIER_DESC_cas_church_reform_mod: "A reforma de Cisneros faz da Igreja Católica da Espanha a mais disciplinada e poderosa da Europa."
 STATIC_MODIFIER_NAME_cas_counter_ref_mod: "A Contrarreforma"
 STATIC_MODIFIER_DESC_cas_counter_ref_mod: "A Espanha lidera o contra-ataque católico à Reforma protestante."
 STATIC_MODIFIER_NAME_cas_havana_mod: "Havana — nó caribenho"
 STATIC_MODIFIER_DESC_cas_havana_mod: "Havana desenvolvida como o maior nó comercial e marítimo do Caribe."
 STATIC_MODIFIER_NAME_cas_florida_mod: "La Florida"
 STATIC_MODIFIER_DESC_cas_florida_mod: "A exploração espanhola da América do Norte estabelece presença no sudeste do continente."
 STATIC_MODIFIER_NAME_cas_philippines_mod: "As Ilhas Filipinas"
 STATIC_MODIFIER_DESC_cas_philippines_mod: "Concluída a expansão asiática da Espanha — Manila torna-se nó do comércio transoceânico."
 STATIC_MODIFIER_NAME_cas_sardinia_mod: "Reino da Sardenha"
 STATIC_MODIFIER_DESC_cas_sardinia_mod: "A Sardenha, celeiro mediterrâneo, sob controle espanhol."
 STATIC_MODIFIER_NAME_cas_italy_dominion_mod: "Domínio Italiano"
 STATIC_MODIFIER_DESC_cas_italy_dominion_mod: "A Península Itálica passa ao domínio espanhol — a riqueza do Renascimento somada ao império."
 STATIC_MODIFIER_NAME_cas_garrison_mod: "Rede de Guarnições"
 STATIC_MODIFIER_DESC_cas_garrison_mod: "A rede estratégica de guarnições guarda as vastas fronteiras do Império Espanhol."
 STATIC_MODIFIER_NAME_cas_cadiz_mod: "O Antigo Porto Fenício"
 STATIC_MODIFIER_DESC_cas_cadiz_mod: "O porto natural de Cádis torna-se a principal porta do comércio atlântico."
 STATIC_MODIFIER_NAME_cas_malaga_mod: "A Seda de Málaga"
 STATIC_MODIFIER_DESC_cas_malaga_mod: "Depois da conquista de Granada, o clima quente e a terra fértil de Málaga desenvolvem-se como região produtora de seda. Os artesãos da Alhambra sustentam a indústria da seda de Málaga, comercializada a preços altos por todo o Mediterrâneo."
 STATIC_MODIFIER_NAME_cas_valencia_mod: "A Cidade do Sol"
 STATIC_MODIFIER_DESC_cas_valencia_mod: "A seda e o comércio mediterrâneo de Valência fazem dela o centro econômico oriental da Espanha."
 STATIC_MODIFIER_NAME_cas_zaragoza_mod: "A Capital de Aragão"
 STATIC_MODIFIER_DESC_cas_zaragoza_mod: "Saragoça, no Ebro, anima as redes comerciais internas da Ibéria."
 STATIC_MODIFIER_NAME_cas_barcelona_mod: "Barcelona — nó mediterrâneo"
 STATIC_MODIFIER_DESC_cas_barcelona_mod: "Barcelona como o maior nó comercial mediterrâneo da Espanha."
 STATIC_MODIFIER_NAME_cas_reconquista_done_mod: "Reconquista Concluída"
 STATIC_MODIFIER_DESC_cas_reconquista_done_mod: "780 anos de guerra santa encerrados — a Espanha unida sob a fé católica. A noção de “Espanha” formada."
 STATIC_MODIFIER_NAME_cas_hermandad_mod: "A Santa Irmandade"
 STATIC_MODIFIER_DESC_cas_hermandad_mod: "Os arqueiros da Hermandad patrulham as estradas, e até os portões dos castelos da nobreza se abrem à justiça real."
 STATIC_MODIFIER_NAME_cas_inquisition_mod: "A Inquisição Espanhola"
 STATIC_MODIFIER_DESC_cas_inquisition_mod: "Os inquisidores do Santo Ofício, em hábitos negros, vão de cidade em cidade, e as pessoas testemunham sua fé em vozes abafadas."
 STATIC_MODIFIER_NAME_cas_pure_faith_mod: "Pureza da Fé"
 STATIC_MODIFIER_DESC_cas_pure_faith_mod: "A expulsão dos judeus estabelece a pureza católica da Espanha."
 STATIC_MODIFIER_NAME_cas_catholic_monarchs_mod: "O Legado dos Reis Católicos"
 STATIC_MODIFIER_DESC_cas_catholic_monarchs_mod: "O título papal de “Reis Católicos” estabelece a autoridade da Espanha."
 STATIC_MODIFIER_NAME_cas_absolutism_mod: "Absolutismo"
 STATIC_MODIFIER_DESC_cas_absolutism_mod: "O poder real torna-se absoluto, e a Espanha emerge como Estado moderno centralizado."
 STATIC_MODIFIER_NAME_cas_cortes_mod: "As Cortes"
 STATIC_MODIFIER_DESC_cas_cortes_mod: "Na câmara das Cortes de Castela, o rei e os delegados das cidades sentam-se à mesma mesa, fixando as condições do governo."
 STATIC_MODIFIER_NAME_cas_colonial_law_mod: "As Leis das Índias"
 STATIC_MODIFIER_DESC_cas_colonial_law_mod: "O direito da administração colonial codificado, estabilizando o governo dos vastos territórios ultramarinos."
 STATIC_MODIFIER_NAME_cas_canary_mod: "Cabeça de Ponte nas Canárias"
 STATIC_MODIFIER_DESC_cas_canary_mod: "Estabelecida a cabeça de ponte para a expansão atlântica."
 STATIC_MODIFIER_NAME_cas_atlantic_mod: "Espírito da Exploração Atlântica"
 STATIC_MODIFIER_DESC_cas_atlantic_mod: "O desejo de explorar mares desconhecidos torna possível o domínio atlântico da Espanha."
 STATIC_MODIFIER_NAME_cas_caribbean_mod: "Domínio do Caribe"
 STATIC_MODIFIER_DESC_cas_caribbean_mod: "O Mar do Caribe torna-se “mar interior” do Império Espanhol."
 STATIC_MODIFIER_NAME_cas_mexico_mod: "Vice-Reino da Nova Espanha"
 STATIC_MODIFIER_DESC_cas_mexico_mod: "A conquista do Império Asteca dá origem ao Vice-Reino da Nova Espanha."
 STATIC_MODIFIER_NAME_cas_peru_mod: "Vice-Reino do Peru"
 STATIC_MODIFIER_DESC_cas_peru_mod: "A conquista do Império Inca dá origem ao Vice-Reino do Peru. A riqueza dos Andes flui para a Espanha."
 STATIC_MODIFIER_NAME_cas_potosi_mod: "Minas de Prata de Potosí"
 STATIC_MODIFIER_DESC_cas_potosi_mod: "A maior mina de prata do mundo sustenta as finanças do Império Espanhol; a prata torna-se a moeda da Espanha."
 STATIC_MODIFIER_NAME_cas_colonial_empire_mod: "O Império Colonial"
 STATIC_MODIFIER_DESC_cas_colonial_empire_mod: "O império colonial global espanhol concluído; o sonho dos conquistadores torna-se realidade."
 STATIC_MODIFIER_NAME_cas_manila_galleon_mod: "Comércio do Galeão de Manila"
 STATIC_MODIFIER_DESC_cas_manila_galleon_mod: "Os galeões de Manila, cruzando o Pacífico, estabelecem a primeira rota comercial global, ligando a Ásia e a América."
 STATIC_MODIFIER_NAME_cas_naples_mod: "Reino de Nápoles"
 STATIC_MODIFIER_DESC_cas_naples_mod: "O Reino de Nápoles entra sob a coroa espanhola, estabelecendo influência na Itália."
 STATIC_MODIFIER_NAME_cas_sicily_mod: "Reino da Sicília"
 STATIC_MODIFIER_DESC_cas_sicily_mod: "A Sicília, celeiro do Mediterrâneo, estabilizada sob o domínio espanhol."
 STATIC_MODIFIER_NAME_cas_milan_mod: "Ducado de Milão"
 STATIC_MODIFIER_DESC_cas_milan_mod: "Como resultado das guerras italianas, Milão entra na esfera de influência da Espanha."
 STATIC_MODIFIER_NAME_cas_mediterranean_mod: "Hegemon do Mediterrâneo"
 STATIC_MODIFIER_DESC_cas_mediterranean_mod: "A Espanha obtém o domínio do Mediterrâneo — pela primeira vez desde a Roma antiga, uma só potência governa o mar."
 STATIC_MODIFIER_NAME_cas_lepanto_mod: "Herói de Lepanto"
 STATIC_MODIFIER_DESC_cas_lepanto_mod: "A batalha de Lepanto destrói a frota otomana, estabelecendo a superioridade cristã no Mediterrâneo."
 STATIC_MODIFIER_NAME_cas_ceuta_mod: "Fortaleza de Ceuta"
 STATIC_MODIFIER_DESC_cas_ceuta_mod: "Ceuta, porta do Estreito de Gibraltar, assegurada — a porta da África aberta."
 STATIC_MODIFIER_NAME_cas_oran_mod: "Conquista de Orã"
 STATIC_MODIFIER_DESC_cas_oran_mod: "A Reconquista se estende ao norte da África — Orã torna-se um baluarte espanhol norte-africano."
 STATIC_MODIFIER_NAME_cas_tunis_mod: "Conquista de Túnis"
 STATIC_MODIFIER_DESC_cas_tunis_mod: "Conquistando Túnis, a Espanha disputa com o Império Otomano o domínio do norte da África."
 STATIC_MODIFIER_NAME_cas_north_africa_mod: "Domínio do Norte da África"
 STATIC_MODIFIER_DESC_cas_north_africa_mod: "O litoral mediterrâneo do norte da África passa ao governo espanhol, estabilizando o comércio mediterrâneo."
 STATIC_MODIFIER_NAME_cas_casa_contratacion_mod: "A Casa de Contratação"
 STATIC_MODIFIER_DESC_cas_casa_contratacion_mod: "A Casa de Contratação de Sevilha monopoliza o comércio com o Novo Mundo — nasce a maior instituição comercial do mundo."
 STATIC_MODIFIER_NAME_cas_tercio_mod: "O Tercio"
 STATIC_MODIFIER_DESC_cas_tercio_mod: "O tercio, a melhor formação de infantaria do mundo, torna-se a base do exército espanhol."
 STATIC_MODIFIER_NAME_cas_military_orders_mod: "As Ordens Militares"
 STATIC_MODIFIER_DESC_cas_military_orders_mod: "As ordens militares de Santiago, Calatrava e Alcântara juntam-se ao exército espanhol."
 STATIC_MODIFIER_NAME_cas_armada_mod: "A Armada Invencível"
 STATIC_MODIFIER_DESC_cas_armada_mod: "Com 130 navios, a “Armada Invencível” encarna o auge do poderio naval espanhol."
 STATIC_MODIFIER_NAME_cas_conquistadors_mod: "Os Conquistadores"
 STATIC_MODIFIER_DESC_cas_conquistadors_mod: "A lenda de Cortés e Pizarro vive — os conquistadores espanhóis percorrem o mundo inteiro."
 STATIC_MODIFIER_NAME_cas_siglo_de_oro_mod: "O Século de Ouro"
 STATIC_MODIFIER_DESC_cas_siglo_de_oro_mod: "A era de Cervantes, Velázquez e El Greco — a cultura espanhola está no topo do mundo."
 STATIC_MODIFIER_NAME_cas_escorial_mod: "O Escorial"
 STATIC_MODIFIER_DESC_cas_escorial_mod: "O palácio, mosteiro e mausoléu de Filipe II encarnam o auge do Império Espanhol."
 STATIC_MODIFIER_NAME_cas_segovia_mod: "O Aqueduto de Segóvia"
 STATIC_MODIFIER_DESC_cas_segovia_mod: "O grande aqueduto romano restaurado e modernizado, melhorando muito o abastecimento de água de Segóvia. Esse aqueduto torna-se modelo para a infraestrutura hídrica de toda Castela."
 STATIC_MODIFIER_NAME_cas_west_africa_mod: "Comércio com a África Ocidental"
 STATIC_MODIFIER_DESC_cas_west_africa_mod: "A Espanha entra no comércio com a África Ocidental, usando as Ilhas Canárias como cabeça de ponte."
 STATIC_MODIFIER_NAME_cas_trent_mod: "O Concílio de Trento"
 STATIC_MODIFIER_DESC_cas_trent_mod: "O Concílio de Trento, liderado pela Espanha, reafirma a doutrina católica e define os rumos da Contrarreforma."
 STATIC_MODIFIER_NAME_cas_navarre_mod: "Navarra Conquistada"
 STATIC_MODIFIER_DESC_cas_navarre_mod: "A encruzilhada pirenaica de Navarra assegurada — a Ibéria setentrional sob controle."
 STATIC_MODIFIER_NAME_cas_salamanca_mod: "A Universidade de Salamanca"
 STATIC_MODIFIER_DESC_cas_salamanca_mod: "Uma das mais antigas universidades da Europa forma os eruditos e funcionários de elite da Espanha."
 STATIC_MODIFIER_NAME_cas_toledo_dev_mod: "Aço de Toledo"
 STATIC_MODIFIER_DESC_cas_toledo_dev_mod: "O aço e a ourivesaria de Toledo florescem — a capital histórica plenamente desenvolvida."
 STATIC_MODIFIER_NAME_cas_madrid_mod: "Madri — capital imperial"
 STATIC_MODIFIER_DESC_cas_madrid_mod: "A capital permanente de Filipe II, Madri, torna-se o coração do império mundial."
 STATIC_MODIFIER_NAME_cas_burgos_mod: "Burgos — cidade internacional do Caminho de Santiago"
 STATIC_MODIFIER_DESC_cas_burgos_mod: "Burgos desenvolve-se como capital histórica de Castela e centro do comércio de lã."
 STATIC_MODIFIER_NAME_cas_granada_city_mod: "A Pérola da Espanha"
 STATIC_MODIFIER_DESC_cas_granada_city_mod: "A cidade da Alhambra torna-se o centro cultural e econômico do sul da Espanha."
 STATIC_MODIFIER_NAME_cas_cordoba_mod: "Produção de Couro de Córdoba"
 STATIC_MODIFIER_DESC_cas_cordoba_mod: "O cordovão, couro de cabra curtido pelos artesãos de Córdoba, é estimado nas cortes da Europa, e carregamentos deixam sem cessar as oficinas da cidade."
 STATIC_MODIFIER_NAME_cas_flanders_pacified_mod: "Flandres Pacificada"
 STATIC_MODIFIER_DESC_cas_flanders_pacified_mod: "Resistência flamenga suprimida — essa próspera região incorporada de modo permanente ao império."
 STATIC_MODIFIER_NAME_cas_greatest_power_mod: "Alicerces do Império em que o Sol Nunca se Põe"
 STATIC_MODIFIER_DESC_cas_greatest_power_mod: "Com os três pilares no lugar, a Espanha está à beira de completar o “império em que o sol nunca se põe”."
 STATIC_MODIFIER_NAME_cas_empire_of_sun_final_mod: "O Império em que o Sol Nunca se Põe"
 STATIC_MODIFIER_DESC_cas_empire_of_sun_final_mod: "A Espanha concluída como o primeiro império global da história — o nome “império em que o sol nunca se põe” gravado para sempre na história."
 STATIC_MODIFIER_NAME_cas_gold_fleet_mod: "As Frotas do Tesouro"
 STATIC_MODIFIER_DESC_cas_gold_fleet_mod: "As frotas do tesouro, que navegam todo ano à Espanha, transformam a economia europeia."
 STATIC_MODIFIER_NAME_cas_portugal_mod: "União com Portugal"
 STATIC_MODIFIER_DESC_cas_portugal_mod: "Pela União Ibérica, o império colonial de Portugal junta-se também à Espanha."
 STATIC_MODIFIER_NAME_cas_iberian_union_mod: "A União Ibérica"
 STATIC_MODIFIER_DESC_cas_iberian_union_mod: "Toda a Península Ibérica unida, completando a base do maior império do mundo."
 STATIC_MODIFIER_NAME_cas_sevilla_mod: "Sevilha Prospera"
 STATIC_MODIFIER_DESC_cas_sevilla_mod: "Sevilha, porta do comércio com o Novo Mundo, desenvolvida como a maior cidade comercial do mundo."
 STATIC_MODIFIER_NAME_cas_trade_network_mod: "A Rede Comercial Imperial"
 STATIC_MODIFIER_DESC_cas_trade_network_mod: "De Sevilha a Manila, a rede comercial imperial da Espanha abarca todo o globo."
 STATIC_MODIFIER_NAME_cas_valladolid_dev_mod: "Desenvolvimento de Valladolid"
 STATIC_MODIFIER_DESC_cas_valladolid_dev_mod: "Valladolid, cidade-castelo de Castela, desenvolvida como sede da corte, com seus mercados e oficinas prosperando."
 STATIC_MODIFIER_NAME_cas_form_spain_mod: "Nascimento do Reino da Espanha"
 STATIC_MODIFIER_DESC_cas_form_spain_mod: "Os escrivães da corte em Madri redigem decretos para cada província em nome de um único reino."
