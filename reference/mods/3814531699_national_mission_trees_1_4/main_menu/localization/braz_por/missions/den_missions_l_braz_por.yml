l_braz_por:
 den_kalmar_union_mission_pack: "A Glória da União de Kalmar"
 den_kalmar_union_mission_pack_DESCRIPTION:0 "Em 1337, o Reino da Dinamarca está à beira do colapso financeiro e da fragmentação territorial. Valdemar IV Atterdag busca recuperar o trono e reconstruir a nação. Recupere Gotlândia, desafie a Liga Hanseática, forme a União de Kalmar com a Noruega e a Suécia, domine o Báltico, conquiste a Inglaterra — e escolha sua fé: a firmeza católica, a Reforma luterana ou o renascimento dos deuses nórdicos. Construa o Império Escandinavo."
 den_kalmar_union_mission_pack_CRITERIA_DESCRIPTION:0 "Como Dinamarca, expanda-se em todas as direções — ao norte, ao leste, religiosamente — e estabeleça o Império Escandinavo."
 den_kalmar_union_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para construir o Império Escandinavo."
 den_kalmar_union_mission_pack_BUTTON_DETAILS:0 "Da reconstrução de Valdemar à era de ouro da União de Kalmar — una a Escandinávia!"
 den_restoration_of_denmark: "A Reconstrução de Valdemar"
 den_restoration_of_denmark_desc: "Em 1340, Valdemar IV Atterdag recuperou o trono de uma Dinamarca fragmentada e vendida aos pedaços — até a Jutlândia estava penhorada à Prússia. Pouco a pouco, ele a recuperou. “Atterdag” — “de novo amanheceu” — seu próprio apelido encarnava sua missão histórica. Assegure Copenhague e eleve a legitimidade da coroa."
 den_secure_denmark: "Estabilize a Dinamarca"
 den_secure_denmark_desc: "Tomar Roskilde, Aarhus e Malmö une o coração dinamarquês. Roskilde é o local tradicional de sepultamento dos reis dinamarqueses e sua capital espiritual; Malmö é a porta-chave para o Báltico. Com elas asseguradas, a Dinamarca pode olhar para fora."
 den_norway_union: "União Pessoal com a Noruega"
 den_norway_union_desc: "A Dinamarca e a Noruega entraram em união pessoal em 1380, com a morte de Haakon VI. Sua filha, Margarida I, tornou-se regente da Noruega e lançou as bases da União de Kalmar. Traga a Noruega sob a bandeira dinamarquesa e dê o primeiro passo rumo à unidade escandinava."
 den_sweden_union: "União Pessoal com a Suécia"
 den_sweden_union_desc: "A Suécia foi a grande rival setentrional da Dinamarca por gerações de conflito. Alguns nobres suecos buscam a proteção dinamarquesa. Seja por diplomacia, seja por conquista, traga a Suécia ao controle dinamarquês — e a Escandinávia estará ao alcance."
 den_integrate_holstein: "Integre Holstein"
 den_integrate_holstein_desc: "Holstein é um ducado de língua alemã cujo duque é o rei dinamarquês. Controlar Hamburgo e Holstein assegura a fronteira sul e pressiona a Liga Hanseática. “Dinamarquês em Holstein, Holstein na Dinamarca” — resolva essa ambiguidade de uma vez por todas."
 den_kalmar_union: "A União de Kalmar"
 den_kalmar_union_desc: "A União de Kalmar de 1397, planejada por Margarida I, uniu as três coroas da Dinamarca, Noruega e Suécia sob um só rei. Cada país mantinha seus direitos e tradições, mas coordenava a política externa e militar. Nasce o Império do Norte."
 den_unite_scandinavia: "Una a Escandinávia"
 den_unite_scandinavia_desc: "Com a Suécia conquistada e Holstein integrada, toda a Escandinávia une-se sob o estandarte dinamarquês. Do Báltico ao Mar da Noruega, uma só dinastia governa tudo. É a maior façanha política da história do Norte."
 den_integrate_norway: "Integre a Noruega"
 den_integrate_norway_desc: "Tome Oslo e Bergen e integre por completo a Noruega como parte do império dinamarquês. Bergen foi outrora o primeiro nó setentrional da Liga Hanseática — agora torna-se a porta da Dinamarca para o Atlântico Norte."
 den_integrate_sweden: "Integre a Suécia"
 den_integrate_sweden_desc: "Integre por completo a Suécia como parte do império dinamarquês. Possuir Estocolmo e manter Svealand torna a Suécia parte inseparável do reino."
 den_develop_trondheim: "Desenvolva a Noruega do Norte"
 den_develop_trondheim_desc: "Trondheim é a capital histórica da Noruega e sede de seu arcebispo. O desenvolvimento da costa norte norueguesa estabelece controle sobre o Atlântico Norte e o Mar da Noruega."
 den_scandinavian_golden_age: "A Era de Ouro Escandinava"
 den_scandinavian_golden_age_desc: "Com a Noruega e a Suécia integradas e o absolutismo estabelecido, a Escandinávia entra em sua era de ouro como o maior império da Europa setentrional. Copenhague prospera como centro cultural e econômico, ligando o Báltico e o Mar do Norte."
 den_retake_gotland: "Recupere Gotlândia"
 den_retake_gotland_desc: "Visby, em Gotlândia, foi outrora uma das maiores cidades comerciais da Liga Hanseática — prêmio disputado pela Suécia, pela Livônia e pela Ordem Teutônica. Em 1361, Valdemar IV conquistou Gotlândia pela força. Tomar essa ilha assegura um nó crucial do comércio báltico."
 den_sound_toll: "A Taxa do Öresund"
 den_sound_toll_desc: "A Dinamarca situa-se na estreita passagem entre o Báltico e o Mar do Norte; todo navio deve atravessar o estreito de Öresund e pagar a taxa. Formalizada por volta de 1429, essa taxa tornou-se a espinha dorsal das finanças reais dinamarquesas. Construa uma frota e controle plenamente o estreito."
 den_humiliate_hansa: "Humilhe a Hansa"
 den_humiliate_hansa_desc: "A Liga Hanseática monopolizou o comércio báltico e ameaçou a Dinamarca por gerações. Desde a humilhante Paz de Stralsund, de 1370, a Dinamarca aguarda vingança. Controle Lübeck ou supere a Liga economicamente — e quebre a hegemonia hanseática."
 den_reconquer_estonia: "Reconquiste a Estônia"
 den_reconquer_estonia_desc: "Tallinn (Reval) foi fundada como fortaleza dinamarquesa em 1219 por Valdemar II — “Taani linn” (castelo dinamarquês), dizem, a origem de seu nome. Vendida à Ordem Teutônica em 1346, recuperar essa terra restaura a influência dinamarquesa na costa leste do Báltico."
 den_control_livonia: "Controle a Livônia"
 den_control_livonia_desc: "A Livônia (atuais Letônia e Estônia) é um prêmio estratégico, disputado pela Ordem Teutônica, Polônia, Suécia e Rus. Tomar Riga e Tartu põe toda a costa leste do Báltico em mãos dinamarquesas."
 den_stralsund_treaty: "Tome Stralsund"
 den_stralsund_treaty_desc: "Stralsund e Stettin são as principais cidades da Pomerânia, na margem sul do Báltico. Em 1370, a Dinamarca foi forçada a um tratado humilhante aqui. Agora a Dinamarca toma a iniciativa — controlar essas cidades estabelece o domínio sobre a costa pomerana."
 den_expand_the_toll: "Amplie a Taxa"
 den_expand_the_toll_desc: "Amplie a Taxa do Öresund para abranger toda a rede comercial báltica. Tendo conquistado a Pomerânia e quebrado a Liga Hanseática, a Dinamarca torna-se senhora do comércio do norte da Europa."
 den_master_of_the_baltic: "Senhor do Báltico"
 den_master_of_the_baltic_desc: "A derrota da Hansa e o controle da Livônia — a Dinamarca é a incontestada senhora do Báltico. Tomar Königsberg e Gdansk completa o cerco: nenhum navio mercante pode entrar nem sair sem permissão dinamarquesa."
 den_eliminate_novgorod: "Elimine Novgorod"
 den_eliminate_novgorod_desc: "A República de Novgorod é um grande Estado comercial no extremo oriental das rotas comerciais báltico-barentsianas. Controlar Novgorod e Pskov traz toda a rota de comércio russo de peles, âmbar e mel sob administração dinamarquesa."
 den_rival_england: "Rivalize com a Inglaterra"
 den_rival_england_desc: "O rei dinamarquês Valdemar, o Vitorioso, outrora conquistou a Inglaterra (1016). O Império do Mar do Norte de Canuto, o Grande, foi a maior glória histórica da Dinamarca. Chegou a hora de perseguir de novo esse sonho. Declare a Inglaterra rival e dispute o domínio do Mar do Norte."
 den_north_sea_fleet: "A Frota do Mar do Norte"
 den_north_sea_fleet_desc: "Para governar o Mar do Norte, é preciso uma poderosa frota. Amplie os estaleiros de Copenhague e construa a maior frota da história escandinava. Chegou o dia em que os navios dinamarqueses navegam da Islândia ao Tâmisa."
 den_danish_scotland: "A Dinamarca na Escócia"
 den_danish_scotland_desc: "A Escócia é a eterna inimiga da Inglaterra e potencial aliada da Dinamarca. Tomar Edimburgo cria uma tenaz em torno da Inglaterra, pelo norte e pelo sul — recriando a era em que os vikings governavam as costas da Escócia."
 den_invade_england: "Invada a Inglaterra"
 den_invade_england_desc: "Forças dinamarquesas e norueguesas desembarcaram no norte da Inglaterra. York foi outrora capital do reino norueguês de Jórvík — coração do Danelaw. Tomar York ressuscita a glória do Danelaw, os vastos territórios do norte da Inglaterra, governados por colonos dinamarqueses e nórdicos no século IX."
 den_conquer_england: "Conquiste a Inglaterra"
 den_conquer_england_desc: "Londres e Edimburgo sob controle dinamarquês — pela primeira vez em mil anos, desde os tempos de Canuto, o Grande, uma dinastia escandinava governa as Ilhas Britânicas. O Império do Mar do Norte de Dinamarca, Noruega, Suécia e Inglaterra renasce."
 den_religious_question: "A Questão da Fé"
 den_religious_question_desc: "Qual deve ser a fé da Dinamarca? Manter a fidelidade ao papa em Roma — adotar a doutrina reformadora de Lutero — ou retornar aos antigos deuses dos ancestrais? Essa escolha decidirá o futuro da Dinamarca."
 den_catholic_denmark: "A Dinamarca Católica"
 den_catholic_denmark_desc: "O Reino da Dinamarca mantém fidelidade à Igreja Católica Romana. Mantendo boas relações com o papa, a Dinamarca ergue-se como guardiã da civilização católica do norte, com vantagem diplomática."
 den_crusade_north: "A Cruzada do Norte"
 den_crusade_north_desc: "A Dinamarca ergue-se como escudo setentrional da cristandade, participando da guerra santa contra nações infiéis. Liderar cruzadas contra os territórios pagãos remanescentes do Báltico oriental consolida a autoridade religiosa da Dinamarca."
 den_kingdom_of_god: "O Reino de Deus"
 den_kingdom_of_god_desc: "Profunda confiança com o papado e controle de Hamburgo — a Dinamarca estabeleceu a posição inabalável de guardiã da civilização católica do norte. Reconhecido por Roma, o rei dinamarquês é inscrito na história como “Cruzado do Norte”."
 den_reformation: "A Reforma"
 den_reformation_desc: "Em 1517, Martinho Lutero publicou suas noventa e cinco teses, e uma onda de reforma religiosa varreu a Europa. Em 1536, o rei Cristiano III declarou o luteranismo religião de Estado da Dinamarca. Antecipe essa transformação histórica e construa uma Dinamarca luterana."
 den_protestant_church: "A Igreja Protestante"
 den_protestant_church_desc: "Após a conversão ao luteranismo, os bens da igreja foram transferidos à coroa dinamarquesa, fortalecendo muito as finanças do Estado. Desenvolva universidades para formar teólogos luteranos e enraizar a fé protestante em toda a Dinamarca."
 den_protestant_league: "A Liga Protestante"
 den_protestant_league_desc: "As nações luteranas unem-se numa liga centrada na Dinamarca. Como a Liga de Esmalcalda, a Dinamarca lidera o mundo protestante da Europa setentrional como defensora da Reforma."
 den_norse_revival: "O Renascimento da Fé Nórdica"
 den_norse_revival_desc: "Os deuses da era viking — Odin, Thor, Freyr — nunca partiram de verdade. Alguns nobres nórdicos resistiram à cristianização e sonham com um retorno aos antigos deuses. O mecenato real desse movimento acende uma revolução religiosa inédita na Escandinávia."
 den_viking_tradition: "A Tradição Viking"
 den_viking_tradition_desc: "O sangue dos antigos escandinavos ferve de novo. O espírito guerreiro dos ancestrais — cruzar os mares, entrar em terras hostis, devastar e conquistar — habita o exército dinamarquês. Construa um poderoso exército terrestre e uma frota; recrie a glória da era viking."
 den_asgard_kingdom: "O Reino de Asgard"
 den_asgard_kingdom_desc: "Sob a bênção de Odin, a Escandinávia renasce como o reino dos antigos deuses. A crença de que os bravos guerreiros tombados em batalha são recebidos em Valhalla torna-se o pilar espiritual da nação. Una toda a Escandinávia e construa o reino dos deuses."
 den_strengthen_crown: "Fortaleça a Coroa"
 den_strengthen_crown_desc: "O Reino da Dinamarca teve historicamente seu poder real limitado por uma poderosa nobreza. A “Håndfæstning” obrigava cada rei a conceder privilégios nobres ao subir ao trono. Rompa pouco a pouco essas cadeias e fortaleça a monarquia dinamarquesa."
 den_copenhagen_university: "A Universidade de Copenhague"
 den_copenhagen_university_desc: "A Universidade de Copenhague, fundada em 1479, é a mais antiga da Escandinávia. Suas faculdades de teologia, direito, medicina e filosofia a fazem centro da cultura dinamarquesa. Construa uma universidade em Copenhague e realize a capital erudita do Norte."
 den_develop_copenhagen: "Desenvolva Copenhague"
 den_develop_copenhagen_desc: "Copenhague — “porto dos mercadores” — cresceu como nó-chave do comércio báltico. Eleve-a ao posto de cidade, transformando-a na grande capital real que a Dinamarca merece."
 den_revoke_privileges: "Revogue os Privilégios"
 den_revoke_privileges_desc: "Abolir os privilégios nobres que limitaram o poder real dinamarquês. Elevar o poder real e realizar reformas governamentais põe a Dinamarca no caminho do absolutismo centralizado."
 den_danish_navy: "A Real Marinha Dinamarquesa"
 den_danish_navy_desc: "Desenvolva os estaleiros de Copenhague e estabeleça a frota real dinamarquesa. Essa instituição militar permanente, que sustenta a hegemonia dinamarquesa sobre o Báltico e o Mar do Norte, torna-se pilar do poder dinamarquês."
 den_amber_trade: "Comércio de Âmbar"
 den_amber_trade_desc: "O âmbar do Báltico — “Ouro do Norte” — é valorizado desde a Antiguidade. Amplie a exportação de âmbar e joias pelas rotas comerciais bálticas da Dinamarca e assegure rica renda comercial."
 den_develop_aarhus: "Desenvolva Aarhus"
 den_develop_aarhus_desc: "Aarhus é a maior cidade da Jutlândia e centro comercial da Dinamarca ocidental. Elevá-la ao posto de cidade faz dela a segunda cidade da Dinamarca depois de Copenhague."
 den_develop_malmo: "Desenvolva Malmö"
 den_develop_malmo_desc: "Malmö, no sul da Suécia (Escânia), fica do outro lado do estreito de Öresund em relação a Copenhague. O desenvolvimento dessa cidade cria um par vital com Copenhague como nó do controle dinamarquês do Báltico."
 den_absolutism: "Absolutismo"
 den_absolutism_desc: "Em 1660, o rei Frederico III convocou os três estamentos — nobreza, clero e plebeus — e os obrigou a proclamar a monarquia absoluta hereditária. Uma das transformações políticas mais dramáticas da história escandinava. Eleve o poder real e a legitimidade para antecipar essa virada histórica."
 den_economic_powerhouse: "Potência Comercial do Norte"
 den_economic_powerhouse_desc: "A Taxa do Öresund, o comércio do Mar do Norte, a agricultura escandinava — a Dinamarca, com suas diversas fontes de renda, tornou-se a maior potência econômica da Europa setentrional. Mantenha renda 300+ e vários centros comerciais para assegurar o domínio econômico."
 den_north_sea_dominion: "Domínio do Mar do Norte"
 den_north_sea_dominion_desc: "Escandinávia unida, Báltico conquistado, era de ouro escandinava alcançada — a Dinamarca governa o maior império da Europa setentrional. Com 80+ navios, renda mensal 600+ e 600+ províncias, reivindique esse glorioso título."
 den_scandinavian_empire: "O Império Escandinavo"
 den_scandinavian_empire_desc: "Do Báltico à Inglaterra, de Gotlândia a Novgorod — o Império Escandinavo está concluído. A Dinamarca, reconstruída por Valdemar IV, cresceu até tornar-se um grande império que domina toda a Europa setentrional. 1000+ províncias, prestígio 80+, renda 1000+ — conquiste essa glória."
 den_events.10.t: "União Pessoal Norueguesa"
 den_events.10.d: "O rei da Dinamarca herdou o trono da Noruega. Desde os tempos vikings, Dinamarca e Noruega estiveram ligadas sob uma só casa real. Os ricos pesqueiros, a madeira e a porta do Atlântico Norte da Noruega ampliam muito o poder dinamarquês. O rei, que porta o título de “Rei dos Dois Reinos”, deu o primeiro passo histórico rumo à unidade escandinava."
 den_events.10.a: "Noruega e Dinamarca, unidas para sempre!"
 den_events.20.t: "União Pessoal Sueca"
 den_events.20.d: "O rei da Dinamarca assegurou também o trono sueco. Alguns nobres suecos resistem, mas essa união pessoal é um passo decisivo rumo à unidade escandinava. O gênio diplomático da rainha Margarida realizou esse milagre — o sonho de um “Imperador da Escandinávia” aproxima-se da realidade."
 den_events.20.a: "Rumo à unidade dos três reinos — avante!"
 den_events.30.t: "A União de Kalmar"
 den_events.30.d: "Em Kalmar, na Suécia, representantes da Dinamarca, Noruega e Suécia reuniram-se e proclamaram a união sob o rei Érico da Pomerânia. Cada país mantém seus direitos e tradições, mas coordena a política externa e militar. “Valdemar sonhou com isto; Margarida o tornou realidade” — escreverão depois os historiadores."
 den_events.30.a: "Viva a União de Kalmar! A Escandinávia é una!"
 den_events.40.t: "A Encruzilhada da Fé"
 den_events.40.d: "Uma acirrada disputa religiosa irrompeu na corte dinamarquesa. Continuar a tradicional fidelidade ao papa em Roma — adotar a nova doutrina de Martinho Lutero — ou retornar aos antigos deuses dos ancestrais? Essa escolha atinge as próprias bases do Estado dinamarquês."
 den_events.40.a: "Manter a fidelidade a Roma — o catolicismo é a fé da Dinamarca"
 den_events.40.a.tt: "Avançar pelo caminho católico. Facilita cumprir as condições da missão den_catholic_denmark."
 den_events.40.b: "Adotar a doutrina de Lutero — chegou a era da reforma"
 den_events.40.b.tt: "Avançar pelo caminho luterano. Facilita cumprir as condições da missão den_reformation."
 den_events.40.c: "Retornar aos antigos deuses — buscar a bênção de Odin"
 den_events.40.c.tt: "Avançar pelo caminho nórdico. Facilita cumprir as condições da missão den_norse_revival."
 den_events.99.t: "Nasce o Império Escandinavo"
 den_events.99.d: "Séculos depois de Valdemar IV herdar uma Dinamarca devastada — agora a Dinamarca cresceu até ser um grande império que domina toda a Europa setentrional. Do Báltico ao Mar do Norte, das estepes de Novgorod às Ilhas Britânicas, tudo repousa nos limites do reino do imperador dinamarquês. Os historiadores escreverão depois: “Atterdag — de novo amanheceu — era uma verdadeira profecia”."
 den_events.99.a: "Viva o Imperador do Império Escandinavo!"
 STATIC_MODIFIER_NAME_den_valdemar_legacy_mod: "O Legado de Valdemar"
 STATIC_MODIFIER_DESC_den_valdemar_legacy_mod: "“Atterdag — de novo amanheceu”. A reconstrução de Valdemar IV lançou a pedra angular do renascimento da Dinamarca."
 STATIC_MODIFIER_NAME_den_holstein_integration_mod: "Holstein Integrada"
 STATIC_MODIFIER_DESC_den_holstein_integration_mod: "O ducado de Holstein plenamente integrado ao império dinamarquês. Fronteira sul estabilizada e rotas comerciais meridionais asseguradas."
 STATIC_MODIFIER_NAME_den_scandinavia_united_mod: "Escandinávia Unida"
 STATIC_MODIFIER_DESC_den_scandinavia_united_mod: "Três reinos unidos sob um só estandarte. Nasce o maior Estado da Europa setentrional."
 STATIC_MODIFIER_NAME_den_norway_integration_mod: "Noruega Integrada"
 STATIC_MODIFIER_DESC_den_norway_integration_mod: "A Noruega integrada como parte do império dinamarquês. A porta do Atlântico Norte aberta."
 STATIC_MODIFIER_NAME_den_sweden_integration_mod: "Suécia Integrada"
 STATIC_MODIFIER_DESC_den_sweden_integration_mod: "O nome do rei dinamarquês é lido nos salões de Estocolmo, e os senhores suecos sentam-se também à mesma mesa como membros do império."
 STATIC_MODIFIER_NAME_den_visby_trade_mod: "Nó Comercial de Visby"
 STATIC_MODIFIER_DESC_den_visby_trade_mod: "Visby, em Gotlândia, revive como nó comercial dinamarquês. A antiga cidade hanseática prospera de novo."
 STATIC_MODIFIER_NAME_den_sound_toll_mod: "A Taxa do Öresund"
 STATIC_MODIFIER_DESC_den_sound_toll_mod: "Sistema de cobrança estabelecido. Todo navio mercante que entra ou sai do Báltico paga à Dinamarca."
 STATIC_MODIFIER_NAME_den_hansa_dominance_mod: "Derrota da Hansa"
 STATIC_MODIFIER_DESC_den_hansa_dominance_mod: "A Dinamarca quebrou a hegemonia hanseática e conquistou o controle do comércio báltico."
 STATIC_MODIFIER_NAME_den_estonia_mod: "Estônia Recuperada"
 STATIC_MODIFIER_DESC_den_estonia_mod: "Tallinn (castelo dinamarquês) voltou à Dinamarca. Influência dinamarquesa na costa leste do Báltico restaurada."
 STATIC_MODIFIER_NAME_den_livonia_mod: "Livônia Subjugada"
 STATIC_MODIFIER_DESC_den_livonia_mod: "Com Riga e Tartu asseguradas, toda a costa leste do Báltico sob administração dinamarquesa."
 STATIC_MODIFIER_NAME_den_pomeranian_coast_mod: "A Costa da Pomerânia"
 STATIC_MODIFIER_DESC_den_pomeranian_coast_mod: "A tomada de Stralsund e Stettin põe toda a costa pomerana sob controle dinamarquês."
 STATIC_MODIFIER_NAME_den_sound_toll_extended_mod: "A Taxa Ampliada"
 STATIC_MODIFIER_DESC_den_sound_toll_extended_mod: "Todo navio que passa pelo Öresund, rumo a qualquer porto báltico, arria as velas diante da cadeia do serviço aduaneiro dinamarquês."
 STATIC_MODIFIER_NAME_den_baltic_master_mod: "Senhor do Báltico"
 STATIC_MODIFIER_DESC_den_baltic_master_mod: "A frota dinamarquesa domina todo o Báltico. Cada porto, de Königsberg a Gdansk, responde à Dinamarca."
 STATIC_MODIFIER_NAME_den_eastern_routes_mod: "Rotas Comerciais do Leste"
 STATIC_MODIFIER_DESC_den_eastern_routes_mod: "Novgorod conquistada — toda a rota comercial de mercadorias russas sob administração dinamarquesa."
 STATIC_MODIFIER_NAME_den_north_sea_fleet_mod: "A Frota do Mar do Norte"
 STATIC_MODIFIER_DESC_den_north_sea_fleet_mod: "A frota real dinamarquesa controla o Mar do Norte. Da Islândia ao Tâmisa, a bandeira dinamarquesa tremula."
 STATIC_MODIFIER_NAME_den_scotland_mod: "A Dinamarca na Escócia"
 STATIC_MODIFIER_DESC_den_scotland_mod: "Edimburgo tomada — a Inglaterra pode agora ser apertada pelo norte e pelo sul."
 STATIC_MODIFIER_NAME_den_england_invasion_mod: "Invasão da Inglaterra"
 STATIC_MODIFIER_DESC_den_england_invasion_mod: "As forças dinamarquesas que ocupam York ressuscitaram a memória do Danelaw."
 STATIC_MODIFIER_NAME_den_north_sea_empire_mod: "O Império do Mar do Norte"
 STATIC_MODIFIER_DESC_den_north_sea_empire_mod: "Pela primeira vez em mil anos, desde os tempos de Canuto, o Grande, uma dinastia escandinava governa as Ilhas Britânicas. O Império do Mar do Norte renasce."
 STATIC_MODIFIER_NAME_den_catholic_devotion_mod: "Devoção Católica"
 STATIC_MODIFIER_DESC_den_catholic_devotion_mod: "A Dinamarca mantém fidelidade à Igreja de Roma. A cooperação com o papa dá à Dinamarca vantagem diplomática."
 STATIC_MODIFIER_NAME_den_northern_crusader_mod: "Cruzado do Norte"
 STATIC_MODIFIER_DESC_den_northern_crusader_mod: "A participação da Dinamarca na guerra santa ganha fama de guardiã da cristandade."
 STATIC_MODIFIER_NAME_den_papal_champion_mod: "Campeã do Papa"
 STATIC_MODIFIER_DESC_den_papal_champion_mod: "A Dinamarca estabeleceu a posição inabalável de guardiã da civilização católica do norte."
 STATIC_MODIFIER_NAME_den_lutheran_reform_mod: "Reforma Luterana"
 STATIC_MODIFIER_DESC_den_lutheran_reform_mod: "Cálices de ouro e castiçais de prata dos mosteiros confiscados fundidos na casa da moeda real em Copenhague e cunhados em nova moeda."
 STATIC_MODIFIER_NAME_den_protestant_church_mod: "A Igreja Protestante"
 STATIC_MODIFIER_DESC_den_protestant_church_mod: "O desenvolvimento das universidades e a formação de teologia luterana enraízam a fé protestante em toda a Dinamarca."
 STATIC_MODIFIER_NAME_den_protestant_league_mod: "A Liga Protestante"
 STATIC_MODIFIER_DESC_den_protestant_league_mod: "A aliança luterana, liderada pela Dinamarca, une o mundo protestante da Europa setentrional."
 STATIC_MODIFIER_NAME_den_norse_revival_mod: "Renascimento da Fé Nórdica"
 STATIC_MODIFIER_DESC_den_norse_revival_mod: "O culto a Odin, Thor e Freyr restaurado. O espírito guerreiro dos ancestrais habita os exércitos dinamarqueses."
 STATIC_MODIFIER_NAME_den_viking_warriors_mod: "Guerreiros Vikings"
 STATIC_MODIFIER_DESC_den_viking_warriors_mod: "O espírito guerreiro da era viking renasce. Os exércitos da Dinamarca são insuperáveis em cruzar mares e conquistar terras hostis."
 STATIC_MODIFIER_NAME_den_asgard_kingdom_mod: "O Reino de Asgard"
 STATIC_MODIFIER_DESC_den_asgard_kingdom_mod: "Sob a bênção de Odin, a Escandinávia renasce como o reino dos antigos deuses."
 STATIC_MODIFIER_NAME_den_royal_authority_mod: "Autoridade Real"
 STATIC_MODIFIER_DESC_den_royal_authority_mod: "O conselho da nobreza já não se interpõe à vontade do rei, e suas ordens chegam diretamente às aldeias de todos os cantos da terra."
 STATIC_MODIFIER_NAME_den_copenhagen_learning_mod: "A Universidade de Copenhague"
 STATIC_MODIFIER_DESC_den_copenhagen_learning_mod: "A mais antiga universidade da Escandinávia aberta em Copenhague. Prospera como centro de saber e cultura do norte."
 STATIC_MODIFIER_NAME_den_copenhagen_capital_mod: "Capital Copenhague Desenvolvida"
 STATIC_MODIFIER_DESC_den_copenhagen_capital_mod: "Novas residências de pedra erguem-se uma após outra ao longo das ruas de Copenhague, que ferve de vida como convém a uma capital real."
 STATIC_MODIFIER_NAME_den_absolutism_mod: "Absolutismo"
 STATIC_MODIFIER_DESC_den_absolutism_mod: "Monarquia absoluta estabelecida na Dinamarca — antecipando a transformação histórica de 1660, o poder real plenamente consolidado."
 STATIC_MODIFIER_NAME_den_danish_economy_mod: "Potência Econômica Dinamarquesa"
 STATIC_MODIFIER_DESC_den_danish_economy_mod: "A economia da Dinamarca — construída sobre a Taxa do Öresund, o comércio do Mar do Norte e a agricultura escandinava — é a maior da Europa setentrional."
 STATIC_MODIFIER_NAME_den_crown_privileges_mod: "Privilégios da Coroa"
 STATIC_MODIFIER_DESC_den_crown_privileges_mod: "As cartas de privilégio que os nobres guardaram por gerações derrubadas, e os escribas reais administram agora todo o reino."
 STATIC_MODIFIER_NAME_den_royal_navy_mod: "A Real Marinha Dinamarquesa"
 STATIC_MODIFIER_DESC_den_royal_navy_mod: "A frota real dinamarquesa, baseada em Copenhague, fundada — instituição militar permanente que sustenta a supremacia sobre o Báltico e o Mar do Norte."
 STATIC_MODIFIER_NAME_den_amber_trade_mod: "Comércio de Âmbar"
 STATIC_MODIFIER_DESC_den_amber_trade_mod: "Exportação de âmbar do Báltico ampliada. O “Ouro do Norte” circula por toda a Europa, enriquecendo a Dinamarca."
 STATIC_MODIFIER_NAME_den_aarhus_mod: "Aarhus Desenvolvida"
 STATIC_MODIFIER_DESC_den_aarhus_mod: "A maior cidade da Jutlândia, Aarhus, desenvolvida como nó comercial da Dinamarca ocidental."
 STATIC_MODIFIER_NAME_den_malmo_mod: "Malmö Desenvolvida"
 STATIC_MODIFIER_DESC_den_malmo_mod: "Malmö, na margem oeste do estreito de Öresund, cresceu como nó comercial báltico, emparelhada com Copenhague."
 STATIC_MODIFIER_NAME_den_norway_north_mod: "Noruega do Norte Desenvolvida"
 STATIC_MODIFIER_DESC_den_norway_north_mod: "O desenvolvimento da costa norte norueguesa estabelece controle sobre o Atlântico Norte e o Mar da Noruega."
 STATIC_MODIFIER_NAME_den_golden_age_mod: "A Era de Ouro Escandinava"
 STATIC_MODIFIER_DESC_den_golden_age_mod: "Com a Noruega e a Suécia integradas e o absolutismo estabelecido, a Escandinávia entra em sua era de ouro como o maior império da Europa setentrional."
 STATIC_MODIFIER_NAME_den_north_sea_dominion_mod: "Domínio do Mar do Norte"
 STATIC_MODIFIER_DESC_den_north_sea_dominion_mod: "A Dinamarca, que controla tanto o Báltico quanto o Mar do Norte, domina todo o comércio do norte da Europa."
 STATIC_MODIFIER_NAME_den_scandinavian_empire_final_mod: "O Império Escandinavo"
 STATIC_MODIFIER_DESC_den_scandinavian_empire_final_mod: "O Império Escandinavo, que se estende do Báltico ao Mar do Norte, concluído. O renascimento da Dinamarca desde a reconstrução de Valdemar atingiu seu auge."
 STATIC_MODIFIER_NAME_den_norway_union_bonus_mod: "Bônus da União Norueguesa"
 STATIC_MODIFIER_DESC_den_norway_union_bonus_mod: "A união pessoal norueguesa abriu o caminho para a unidade escandinava."
 STATIC_MODIFIER_NAME_den_sweden_union_bonus_mod: "Bônus da União Sueca"
 STATIC_MODIFIER_DESC_den_sweden_union_bonus_mod: "A união pessoal sueca traz a formação da União de Kalmar ao campo de visão."
 STATIC_MODIFIER_NAME_den_kalmar_union_mod: "A União de Kalmar"
 STATIC_MODIFIER_DESC_den_kalmar_union_mod: "Dinamarca, Noruega e Suécia unidas sob um só rei — a maior integração política da história do Norte."
 STATIC_MODIFIER_NAME_den_faith_steadfast_mod: "Firme na Fé"
 STATIC_MODIFIER_DESC_den_faith_steadfast_mod: "A inabalável fé católica proclama a autoridade do rei ao povo com os sinos da catedral de Roskilde."
 STATIC_MODIFIER_NAME_den_reform_winds_mod: "Ventos de Reforma"
 STATIC_MODIFIER_DESC_den_reform_winds_mod: "O ensinamento de Lutero se espalha pela Dinamarca. A onda de reforma transforma a sociedade dinamarquesa."
 STATIC_MODIFIER_NAME_den_old_gods_calling_mod: "O Chamado dos Antigos Deuses"
 STATIC_MODIFIER_DESC_den_old_gods_calling_mod: "A fé em Odin e Thor renasce em segredo. A bênção dos deuses ancestrais inspira os exércitos dinamarqueses."
 den_finland_integration: "Integre a Finlândia"
 den_finland_integration_desc: "A Finlândia é o vasto reino florestal oriental do reino sueco. Turku (Åbo) é o centro administrativo e religioso da Finlândia; Vyborg guarda a fronteira careliana; Uleåborg (Oulu) é a cidade mais setentrional. O controle pleno da Finlândia estabelece a fronteira oriental do império dinamarquês do norte do Báltico ao Círculo Polar Ártico, permitindo a política colonial nas áreas selvagens."
 STATIC_MODIFIER_NAME_den_finland_mod: "A Fronteira Finlandesa"
 STATIC_MODIFIER_DESC_den_finland_mod: "As vastas florestas e vias fluviais da Finlândia atraem colonos. Povoadores da Dinamarca e da Suécia desbravam essa fronteira, empurrando as fronteiras orientais do império cada vez mais longe."
