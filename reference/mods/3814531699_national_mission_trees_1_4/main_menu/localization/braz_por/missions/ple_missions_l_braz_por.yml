l_braz_por:
 ple_english_pale_mission_pack: "O Pale — De Cabeça de Ponte da Coroa ao Reino da Irlanda"
 ple_english_pale_mission_pack_DESCRIPTION:0 "O estreito Pale inglês em torno de Dublin — estenda a mão aos senhores anglo-normandos, conquiste as terras gaélicas e funde um reino que governe toda a Irlanda."
 ple_english_pale_mission_pack_CRITERIA_DESCRIPTION:0 "Fortaleça o Pale, conquiste toda a Irlanda e funde um reino."
 ple_english_pale_mission_pack_BUTTON_TOOLTIP:0 "De pequena cabeça de ponte a reino que governa toda a Ilha Esmeralda."
 ple_english_pale_mission_pack_BUTTON_DETAILS:0 "“Mais irlandeses que os próprios irlandeses” — erga o estandarte do Pale sobre toda a Irlanda!"
 ple_english_pale: "O Pale Inglês"
 ple_english_pale_desc: "Estreita faixa costeira em torno de Dublin — é o último ponto de apoio da autoridade real inglesa em meio ao vasto mar gaélico."
 ple_dublin_castle: "Desenvolva o Castelo de Dublin"
 ple_dublin_castle_desc: "O Castelo de Dublin, construído em 1204 — fortaleça ainda mais esse centro do governo inglês na Irlanda."
 ple_pale_defense: "Fortifique o Pale"
 ple_pale_defense_desc: "Muros de terra e fossos, que protegem o Pale das incursões gaélicas — fortaleça essa linha de defesa, conhecida como “o Fosso”."
 ple_lord_deputy: "O Lorde Deputado da Irlanda"
 ple_lord_deputy_desc: "O Lorde Deputado, que governa a Irlanda como vice-rei do rei inglês — torne inabalável esse cargo."
 ple_anglo_irish_parliament: "O Parlamento Anglo-Irlandês"
 ple_anglo_irish_parliament_desc: "O Parlamento irlandês, convocado em Drogheda ou Dublin — faça funcionar essa assembleia de senhores anglo-irlandeses e representantes das cidades."
 ple_pale_consolidated: "Pale Consolidado"
 ple_pale_consolidated_desc: "Fortificações, lorde deputado, direito e parlamento — construa sobre tudo isso e torne inabalável o governo do Pale."
 ple_hiberno_norman_lords: "Os Senhores Anglo-Normandos"
 ple_hiberno_norman_lords_desc: "Senhores anglo-normandos, de quem se diz serem “mais ingleses que os próprios ingleses” — construa relações com eles."
 ple_fitzgerald_kildare: "Os Fitzgerald de Kildare"
 ple_fitzgerald_kildare_desc: "“Toda a Irlanda não pode governar o conde de Kildare” — assim se dizia. Construa relações com essa poderosa casa."
 ple_butler_ormond: "Os Butler de Ormond"
 ple_butler_ormond_desc: "Os Butler de Ormond, rivais dos Kildare — construa relações com essa casa, leal à coroa."
 ple_statutes_of_kilkenny: "Os Estatutos de Kilkenny"
 ple_statutes_of_kilkenny_desc: "Emitidos em 1367, os Estatutos de Kilkenny — imponha essa lei, que proíbe os colonos ingleses de “gaelicizar-se”."
 ple_gaelic_frontier_wars: "As Guerras de Fronteira Gaélicas"
 ple_gaelic_frontier_wars_desc: "Os governantes gaélicos, que cercam o Pale — enfrente a guerra incessante dessa fronteira."
 ple_conquer_leinster: "Conquiste Leinster"
 ple_conquer_leinster_desc: "Leinster, ao sul do Pale — traga essa região ao nosso domínio."
 ple_conquer_munster: "Conquiste Munster"
 ple_conquer_munster_desc: "Munster, esfera do conde de Desmond — conquiste essa rica região."
 ple_conquer_connacht: "Conquiste Connacht"
 ple_conquer_connacht_desc: "Connacht, que se estende pelos ermos ocidentais — traga essa fronteira ao nosso controle."
 ple_conquer_ulster: "Conquiste Ulster"
 ple_conquer_ulster_desc: "Ulster, terra do norte da mais obstinada resistência gaélica — conquiste essa região."
 ple_master_of_ireland: "Senhor da Irlanda"
 ple_master_of_ireland_desc: "Leinster, Munster, Connacht e Ulster — governe todos eles e torne-se verdadeiro senhor da Irlanda."
 ple_reformation_choice: "A Escolha da Reforma"
 ple_reformation_choice_desc: "Os ensinamentos de Lutero e Calvino cruzam o mar — nessa encruzilhada da fé, que caminho escolheremos?"
 ple_church_of_ireland: "A Igreja da Irlanda"
 ple_church_of_ireland_desc: "A Igreja da Irlanda, ligada à Igreja da Inglaterra — estabeleça essa nova fé como instrumento de governo."
 ple_recusant_catholics: "Os Católicos Recusantes"
 ple_recusant_catholics_desc: "Os “recusantes”, que se recusam a renunciar à fidelidade a Roma — acolha sua fé como pilar do governo."
 ple_dublin_university: "A Universidade de Dublin"
 ple_dublin_university_desc: "A sede do saber de Dublin, personificada pelo Trinity College — desenvolva esse lugar como centro do aprendizado."
 ple_english_crown_relations: "Relações com a Coroa Inglesa"
 ple_english_crown_relations_desc: "A coroa inglesa, do outro lado do mar — pondere nossas relações com esse suserano, pois definirão nosso futuro."
 ple_kingdom_of_ireland: "Reino da Irlanda Proclamado"
 ple_kingdom_of_ireland_desc: "O caminho, iniciado com uma pequena cabeça de ponte do Pale, dá aqui fruto num reino, que governa toda a Irlanda — mas que caminho seguirá esse novo reino permanece indeciso."
 ple_events.99.t: "Proclamação do Reino da Irlanda"
 ple_events.99.d: "A longa história, iniciada com a pequena cabeça de ponte de Dublin, entra aqui numa nova era com um reino, que governa toda a Irlanda."
 ple_events.99.a: "Glória à Irlanda!"
 ple_defy_the_crown: "Desafie a Coroa"
 ple_defy_the_crown_desc: "O Reino da Irlanda já não é mero servo da Inglaterra — faça dessa ruptura o primeiro passo rumo à verdadeira soberania."
 ple_war_of_irish_independence: "A Guerra da Independência Irlandesa"
 ple_war_of_irish_independence_desc: "A inevitável guerra com a coroa do outro lado do mar — vença essa guerra de independência e quebre as correntes."
 ple_sovereign_kingdom_of_ireland: "A Irlanda Soberana"
 ple_sovereign_kingdom_of_ireland_desc: "O Reino da Irlanda verdadeiramente independente, que não se submete a coroa alguma — a Ilha Esmeralda torna-se enfim senhora de seu próprio destino."
 ple_loyal_crown_partnership: "Parceria com a Coroa"
 ple_loyal_crown_partnership_desc: "Parceria, e não rivalidade — o Reino da Irlanda escolhe uma aliança de iguais com a coroa inglesa."
 ple_anglo_irish_union: "A União Anglo-Irlandesa"
 ple_anglo_irish_union_desc: "Por meio de estreitos laços políticos, os dois reinos dão um passo rumo a uma união mais profunda."
 ple_united_kingdoms: "Parceiro na União"
 ple_united_kingdoms_desc: "Tendo escolhido a parceria em vez da rivalidade, o Reino da Irlanda põe-se como parceiro na união ao lado da Inglaterra e ergue uma era de prosperidade partilhada."
 STATIC_MODIFIER_NAME_ple_pale_mod: "O Pale Inglês"
 STATIC_MODIFIER_DESC_ple_pale_mod: "Desde os tempos de Henrique II, essa terra permanece como único ponto de apoio da coroa inglesa do outro lado do mar."
 STATIC_MODIFIER_NAME_ple_dublin_mod: "Castelo de Dublin Desenvolvido"
 STATIC_MODIFIER_DESC_ple_dublin_mod: "O antigo porto viking é agora reanimado como sede do governo e do comércio na Irlanda."
 STATIC_MODIFIER_NAME_ple_defense_mod: "Pale Fortificado"
 STATIC_MODIFIER_DESC_ple_defense_mod: "Dentro dos muros de terra e fossos do “Pale”, camponeses lavram seus campos sem temer súbitas incursões gaélicas."
 STATIC_MODIFIER_NAME_ple_lord_deputy_mod: "Lorde Deputado"
 STATIC_MODIFIER_DESC_ple_lord_deputy_mod: "O deputado, sentado no Castelo de Dublin no lugar do rei do outro lado do mar, é respeitado até por grandes senhores."
 STATIC_MODIFIER_NAME_ple_parliament_mod: "Parlamento Anglo-Irlandês"
 STATIC_MODIFIER_DESC_ple_parliament_mod: "As vozes dos burgueses, reunidos dentro das muralhas do castelo, têm agora mais peso nos assuntos do Estado."
 STATIC_MODIFIER_NAME_ple_consolidated_mod: "Pale Consolidado"
 STATIC_MODIFIER_DESC_ple_consolidated_mod: "Dublin já não é um enclave estrangeiro, mas o verdadeiro coração-núcleo, inscrito nos próprios livros da coroa."
 STATIC_MODIFIER_NAME_ple_norman_lords_mod: "Os Senhores Anglo-Normandos"
 STATIC_MODIFIER_DESC_ple_norman_lords_mod: "Os senhores normandos em seus castelos estão tão profundamente enraizados nessa terra que se diz serem “mais irlandeses que os próprios irlandeses”."
 STATIC_MODIFIER_NAME_ple_kilkenny_mod: "Os Estatutos de Kilkenny"
 STATIC_MODIFIER_DESC_ple_kilkenny_mod: "Emitida em 1367, essa lei proíbe os colonos de adotar a língua irlandesa ou os costumes gaélicos."
 STATIC_MODIFIER_NAME_ple_frontier_wars_mod: "As Guerras de Fronteira Gaélicas"
 STATIC_MODIFIER_DESC_ple_frontier_wars_mod: "Inúmeras escaramuças além do fosso do Pale temperaram os soldados para as guerras de fronteira."
 STATIC_MODIFIER_NAME_ple_leinster_mod: "Leinster Conquistado"
 STATIC_MODIFIER_DESC_ple_leinster_mod: "Os celeiros de Leinster, vizinhos do Pale, figuram agora nos próprios livros de impostos da coroa."
 STATIC_MODIFIER_NAME_ple_munster_mod: "Munster Conquistado"
 STATIC_MODIFIER_DESC_ple_munster_mod: "Dos portos de Munster, outrora posse do conde de Desmond, zarpam sem fim navios carregados de lã e couro."
 STATIC_MODIFIER_NAME_ple_connacht_mod: "Connacht Conquistado"
 STATIC_MODIFIER_DESC_ple_connacht_mod: "Até os clãs do selvagem Connacht seguem agora o chamado da coroa às armas."
 STATIC_MODIFIER_NAME_ple_ulster_mod: "Ulster Conquistado"
 STATIC_MODIFIER_DESC_ple_ulster_mod: "O obstinado norte, há muito detido pelos O’Neill e pelos O’Donnell, enfim se submeteu ao estandarte real."
 STATIC_MODIFIER_NAME_ple_master_ireland_mod: "Senhor da Irlanda"
 STATIC_MODIFIER_DESC_ple_master_ireland_mod: "De Leinster a Ulster, toda a Ilha Esmeralda jaz agora sob um só estandarte."
 STATIC_MODIFIER_NAME_ple_reformation_mod: "A Escolha da Reforma"
 STATIC_MODIFIER_DESC_ple_reformation_mod: "Os ensinamentos de Lutero e Calvino, trazidos pelo mar, enviam silenciosas ondas pelas igrejas dessa ilha."
 STATIC_MODIFIER_NAME_ple_church_ireland_mod: "A Igreja da Irlanda"
 STATIC_MODIFIER_DESC_ple_church_ireland_mod: "Nas capelas da nova igreja, ligada a Canterbury, a Bíblia inglesa é agora lida em voz alta."
 STATIC_MODIFIER_NAME_ple_recusant_mod: "Os Católicos Recusantes"
 STATIC_MODIFIER_DESC_ple_recusant_mod: "Multados, mas indomados, os “recusantes” continuam suas silenciosas orações a Roma."
 STATIC_MODIFIER_NAME_ple_university_mod: "A Universidade de Dublin"
 STATIC_MODIFIER_DESC_ple_university_mod: "Pelos pátios do Trinity College ecoam agora os passos de uma nova geração de eruditos."
 STATIC_MODIFIER_NAME_ple_crown_relations_mod: "Relações com a Coroa Inglesa"
 STATIC_MODIFIER_DESC_ple_crown_relations_mod: "Cada carta que chega da corte do outro lado do mar molda em silêncio o destino desse reino."
 STATIC_MODIFIER_NAME_ple_kingdom_ireland_mod: "O Reino da Irlanda"
 STATIC_MODIFIER_DESC_ple_kingdom_ireland_mod: "O recém-coroado rei da Irlanda ocupa agora o trono dentro do Castelo de Dublin."
 STATIC_MODIFIER_NAME_ple_defy_crown_mod: "Desafio à Coroa"
 STATIC_MODIFIER_DESC_ple_defy_crown_mod: "Entre os que sacudiram a lealdade à coroa do outro lado do mar, espalha-se um zelo indomável."
 STATIC_MODIFIER_NAME_ple_irish_independence_war_mod: "A Guerra da Independência Irlandesa"
 STATIC_MODIFIER_DESC_ple_irish_independence_war_mod: "Incontáveis choques com o exército, enviado pelo mar, forjaram os soldados dessa ilha em táticos experimentados."
 STATIC_MODIFIER_NAME_ple_sovereign_ireland_mod: "A Irlanda Soberana"
 STATIC_MODIFIER_DESC_ple_sovereign_ireland_mod: "O estandarte de uma Irlanda verdadeiramente livre, que não se deve a coroa alguma, tremula agora das torres do Castelo de Dublin. Governadores, enviados a todos os cantos do país, erguem as veias administrativas do Estado soberano."
 STATIC_MODIFIER_NAME_ple_loyal_partnership_mod: "Parceria com a Coroa"
 STATIC_MODIFIER_DESC_ple_loyal_partnership_mod: "Tendo escolhido a confiança em vez da rivalidade, os enviados das duas coroas cruzam agora o mar com mais frequência que nunca."
 STATIC_MODIFIER_NAME_ple_anglo_irish_union_mod: "A União Anglo-Irlandesa"
 STATIC_MODIFIER_DESC_ple_anglo_irish_union_mod: "Pelo incansável trabalho dos enviados, que servem à corte do outro lado do mar, as duas coroas estão ligadas mais estreitamente que nunca."
