l_braz_por:
 tre_trebizond_mission_pack: "O Renascimento da Dinastia Comneno e a Restauração de Bizâncio"
 tre_trebizond_mission_pack_DESCRIPTION:0 "Em 1337, o Império de Trebizonda sobrevive como pequeno Estado no litoral pôntico, herdeiro da dinastia Comneno. Conquiste o comércio do Mar Negro, recupere a Anatólia, liberte Constantinopla e restaure o Império Bizantino."
 tre_trebizond_mission_pack_CRITERIA_DESCRIPTION:0 "Conquiste a Anatólia, recupere Constantinopla, subjugue os Bálcãs e restaure o Império Bizantino."
 tre_trebizond_mission_pack_BUTTON_TOOLTIP:0 "Restaure o Império dos Comnenos."
 tre_trebizond_mission_pack_BUTTON_DETAILS:0 "Das margens do Ponto, herde o legado bizantino e marche em triunfo sobre Constantinopla!"
 tre_komnenian_legacy: "O Legado dos Comnenos"
 tre_komnenian_legacy_desc: "O legado da dinastia Comneno alimenta a ambição de Trebizonda de restaurar a grandeza bizantina."
 tre_pontus_coast: "Assegure o Litoral Pôntico"
 tre_pontus_coast_desc: "Assegure o litoral pôntico como base da dominação do comércio do Mar Negro."
 tre_black_sea_trade: "Comércio do Mar Negro"
 tre_black_sea_trade_desc: "Arrebate o comércio do Mar Negro dos concorrentes genoveses e venezianos."
 tre_dev_trebizond: "Desenvolva Trebizonda"
 tre_dev_trebizond_desc: "Desenvolva Trebizonda num próspero nó, digno do Império dos Comnenos."
 tre_orthodox_stronghold: "Bastião Ortodoxo"
 tre_orthodox_stronghold_desc: "Fortifique os mosteiros ortodoxos para estabelecer Trebizonda como herdeira espiritual de Bizâncio."
 tre_armenia_campaign: "Subjugue a Armênia"
 tre_armenia_campaign_desc: "Subjugue a Armênia para assegurar a fronteira oriental e obter guerreiros montanheses."
 tre_cappadocia: "Conquista da Capadócia"
 tre_cappadocia_desc: "Conquiste o coração monástico-rupestre da Capadócia e avance rumo à Anatólia central."
 tre_central_anatolia: "Recupere a Anatólia Central"
 tre_central_anatolia_desc: "Recupere a Anatólia central, incluindo Ancara, do domínio turco."
 tre_west_anatolia: "Marcha sobre a Anatólia Ocidental"
 tre_west_anatolia_desc: "Marche sobre o rico litoral egeu da Anatólia Ocidental."
 tre_reclaim_nicaea: "Recupere Niceia"
 tre_reclaim_nicaea_desc: "Recupere Niceia e Bursa — a capital bizantina no exílio — e aproxime-se de Constantinopla."
 tre_anatolian_emperor: "O Imperador da Anatólia"
 tre_anatolian_emperor_desc: "Una toda a Anatólia sob o estandarte dos Comnenos."
 tre_thrace_campaign: "Tome a Trácia"
 tre_thrace_campaign_desc: "Tome a Trácia para cercar Constantinopla e preparar sua libertação."
 tre_reclaim_constantinople: "Recupere Constantinopla"
 tre_reclaim_constantinople_desc: "Liberte Constantinopla e restaure a cruz ortodoxa sobre a Hagia Sophia."
 tre_northern_greece: "Recupere o Norte da Grécia"
 tre_northern_greece_desc: "Recupere o norte da Grécia, incluindo Salonica — a segunda cidade de Bizâncio."
 tre_bulgaria: "Conquista da Bulgária"
 tre_bulgaria_desc: "Conquiste a Bulgária para consolidar a dominação balcânica."
 tre_morea: "Recupere a Moreia"
 tre_morea_desc: "Recupere a Moreia e Atenas — coração da antiga civilização grega."
 tre_aegean_islands: "As Ilhas Egeias"
 tre_aegean_islands_desc: "Recupere as ilhas egeias da ocupação dos cruzados latinos."
 tre_macedonian_campaign: "Conquista da Macedônia"
 tre_macedonian_campaign_desc: "Conquiste a Macedônia — local de nascimento de Alexandre, o Grande."
 tre_silk_trade: "Comércio da Seda"
 tre_silk_trade_desc: "Domine o comércio da Rota da Seda por Trebizonda para dominar o comércio Leste-Oeste."
 tre_komnenian_army: "O Exército Comneno"
 tre_komnenian_army_desc: "Construa o exército dos Comnenos — uma mistura de mercenários e forças provinciais."
 tre_greek_culture: "Renascimento da Cultura Grega"
 tre_greek_culture_desc: "Reviva o saber e as artes bizantinos para fazer de Trebizonda um farol de cultura."
 tre_cilicia_campaign: "Subjugue a Cilícia"
 tre_cilicia_campaign_desc: "Subjugue a Cilícia para assegurar acesso ao Mediterrâneo."
 tre_dev_constantinople: "Reconstrua Constantinopla"
 tre_dev_constantinople_desc: "Reconstrua Constantinopla como magnífica capital do Império Bizantino restaurado."
 tre_orthodox_patriarch: "O Patriarcado Ortodoxo"
 tre_orthodox_patriarch_desc: "Estabeleça o Patriarcado de Constantinopla, fazendo de Trebizonda guardiã da ortodoxia."
 tre_georgia_campaign: "Expedição à Geórgia"
 tre_georgia_campaign_desc: "Conduza uma expedição à Geórgia para assegurar o flanco caucasiano."
 tre_komnenian_navy: "A Frota dos Comnenos"
 tre_komnenian_navy_desc: "Construa uma poderosa frota para dominar o Mar Negro e o Egeu."
 tre_antioch_crusade: "Recupere Antioquia"
 tre_antioch_crusade_desc: "Recupere Antioquia — outrora joia da Síria bizantina."
 tre_greek_population: "Crescimento da População Grega"
 tre_greek_population_desc: "Aumente a população grega como espinha dorsal cultural do império restaurado."
 tre_restore_byzantium: "Restaure Bizâncio"
 tre_restore_byzantium_desc: "Proclame a restauração do Império Bizantino sob a liderança dos Comnenos."
 tre_komnenos_dynasty: "A Glória da Dinastia Comneno"
 tre_komnenos_dynasty_desc: "Governe como eterno Imperador Comneno — sucessor de Roma Oriental, guardião da ortodoxia."
 tre_events.20.t: "Constantinopla Recuperada — Bizâncio Vive"
 tre_events.20.d: "Constantinopla nas mãos dos Comnenos! A cruz ortodoxa tremula de novo sobre a Hagia Sophia. O mundo estremece — Bizâncio ergueu-se."
 tre_events.20.a: "Viva Constantinopla, na glória de Deus!"
 tre_events.60.t: "Proclamação da Restauração de Bizâncio"
 tre_events.60.d: "Anatólia, Bálcãs e Constantinopla unidas — a dinastia Comneno proclama a restauração do Império Bizantino. Erguido da tragédia de 1204."
 tre_events.60.a: "Viva Bizâncio! Viva a dinastia Comneno!"
 tre_events.99.t: "A Glória Eterna da Dinastia Comneno"
 tre_events.99.d: "“Imperador Comneno — sucessor de Roma Oriental e guardião da ortodoxia” — esse título ecoa por todo o mundo mediterrâneo. O pequeno império, que começou em Trebizonda, governa como sucessor do maior império da história."
 tre_events.99.a: "Viva a dinastia Comneno! Viva a glória eterna!"
 STATIC_MODIFIER_NAME_tre_komnenian_mod: "Os Comnenos"
 STATIC_MODIFIER_DESC_tre_komnenian_mod: "Olhando para o alto, ao estandarte púrpura dos Comnenos, todos na corte imaginam o dia em que a glória de Bizâncio será recuperada em mãos de Trebizonda."
 STATIC_MODIFIER_NAME_tre_pontus_mod: "O Ponto"
 STATIC_MODIFIER_DESC_tre_pontus_mod: "Litoral pôntico assegurado como base da dominação do comércio do Mar Negro."
 STATIC_MODIFIER_NAME_tre_black_sea_mod: "O Mar Negro"
 STATIC_MODIFIER_DESC_tre_black_sea_mod: "Nenhum navio mercante no Mar Negro pode levar as sedas orientais sem lançar âncora no porto de Trebizonda."
 STATIC_MODIFIER_NAME_tre_trebizond_city_mod: "A Cidade de Trebizonda"
 STATIC_MODIFIER_DESC_tre_trebizond_city_mod: "Trebizonda desenvolvida como próspero nó comercial do Império dos Comnenos."
 STATIC_MODIFIER_NAME_tre_orthodox_mod: "Ortodoxia"
 STATIC_MODIFIER_DESC_tre_orthodox_mod: "Mosteiros ortodoxos fortificados, estabelecendo Trebizonda como herdeira espiritual de Bizâncio."
 STATIC_MODIFIER_NAME_tre_armenia_mod: "Armênia"
 STATIC_MODIFIER_DESC_tre_armenia_mod: "Armênia subjugada, assegurando a fronteira oriental e obtendo guerreiros montanheses."
 STATIC_MODIFIER_NAME_tre_cappadocia_mod: "Capadócia"
 STATIC_MODIFIER_DESC_tre_cappadocia_mod: "O coração monástico-rupestre da Capadócia cai sob controle dos Comnenos."
 STATIC_MODIFIER_NAME_tre_anatolia_mod: "Anatólia"
 STATIC_MODIFIER_DESC_tre_anatolia_mod: "Anatólia central recuperada — o caminho para Constantinopla aberto."
 STATIC_MODIFIER_NAME_tre_west_anatolia_mod: "Anatólia Ocidental"
 STATIC_MODIFIER_DESC_tre_west_anatolia_mod: "O rico litoral egeu da Anatólia Ocidental assegurado para o Império dos Comnenos."
 STATIC_MODIFIER_NAME_tre_nicaea_mod: "Niceia"
 STATIC_MODIFIER_DESC_tre_nicaea_mod: "Niceia recuperada — a capital bizantina no exílio volta ao governo ortodoxo."
 STATIC_MODIFIER_NAME_tre_thrace_mod: "Trácia"
 STATIC_MODIFIER_DESC_tre_thrace_mod: "Trácia tomada, cercando Constantinopla em preparação para sua libertação."
 STATIC_MODIFIER_NAME_tre_greece_mod: "Grécia"
 STATIC_MODIFIER_DESC_tre_greece_mod: "Norte da Grécia, incluindo Salonica, assegurado — a segunda cidade de Bizâncio reconstruída."
 STATIC_MODIFIER_NAME_tre_bulgaria_mod: "Bulgária"
 STATIC_MODIFIER_DESC_tre_bulgaria_mod: "Bulgária conquistada, consolidando a dominação balcânica."
 STATIC_MODIFIER_NAME_tre_morea_mod: "Moreia"
 STATIC_MODIFIER_DESC_tre_morea_mod: "Moreia e Atenas recuperadas — o coração da antiga civilização grega reconstruído."
 STATIC_MODIFIER_NAME_tre_aegean_mod: "Mar Egeu"
 STATIC_MODIFIER_DESC_tre_aegean_mod: "Ilhas egeias recuperadas da ocupação dos cruzados latinos."
 STATIC_MODIFIER_NAME_tre_macedonia_mod: "Macedônia"
 STATIC_MODIFIER_DESC_tre_macedonia_mod: "A Macedônia — local de nascimento de Alexandre — cai sob o governo dos Comnenos."
 STATIC_MODIFIER_NAME_tre_silk_mod: "Seda"
 STATIC_MODIFIER_DESC_tre_silk_mod: "O comércio da Rota da Seda por Trebizonda domina o comércio Leste-Oeste."
 STATIC_MODIFIER_NAME_tre_army_mod: "Exército"
 STATIC_MODIFIER_DESC_tre_army_mod: "Mercenários e levas provinciais treinam sob o mesmo estandarte, e o exército dos Comnenos encontrou nova força."
 STATIC_MODIFIER_NAME_tre_culture_mod: "Cultura"
 STATIC_MODIFIER_DESC_tre_culture_mod: "O saber e as artes bizantinos revividos, fazendo de Trebizonda um farol de cultura."
 STATIC_MODIFIER_NAME_tre_cilicia_mod: "Cilícia"
 STATIC_MODIFIER_DESC_tre_cilicia_mod: "Cilícia subjugada, assegurando acesso ao Mediterrâneo."
 STATIC_MODIFIER_NAME_tre_cpole_city_mod: "A Cidade de Constantinopla"
 STATIC_MODIFIER_DESC_tre_cpole_city_mod: "Constantinopla reconstruída como magnífica capital do Império Bizantino restaurado."
 STATIC_MODIFIER_NAME_tre_patriarch_mod: "Patriarca"
 STATIC_MODIFIER_DESC_tre_patriarch_mod: "Patriarcado de Constantinopla estabelecido sob o patrocínio dos Comnenos."
 STATIC_MODIFIER_NAME_tre_georgia_mod: "Geórgia"
 STATIC_MODIFIER_DESC_tre_georgia_mod: "Geórgia assegurada, estabilizando o flanco caucasiano do império."
 STATIC_MODIFIER_NAME_tre_navy_mod: "Frota"
 STATIC_MODIFIER_DESC_tre_navy_mod: "A poderosa frota dos Comnenos domina o Mar Negro e o Egeu."
 STATIC_MODIFIER_NAME_tre_antioch_mod: "Antioquia"
 STATIC_MODIFIER_DESC_tre_antioch_mod: "Antioquia — joia da Síria bizantina — recuperada."
 STATIC_MODIFIER_NAME_tre_greek_pop_mod: "População Grega"
 STATIC_MODIFIER_DESC_tre_greek_pop_mod: "Orações gregas e pregões do mercado enchem as ruas de todas as cidades do império restaurado."
 STATIC_MODIFIER_NAME_tre_restore_byzantium_mod: "Restauração de Bizâncio"
 STATIC_MODIFIER_DESC_tre_restore_byzantium_mod: "O Império Bizantino formalmente restaurado sob a liderança dos Comnenos."
 STATIC_MODIFIER_NAME_tre_komnenos_final_mod: "Final dos Comnenos"
 STATIC_MODIFIER_DESC_tre_komnenos_final_mod: "O Império dos Comnenos permanece eterno — senhor do Mediterrâneo oriental."
 tre_rize_tea: "Cultivo de Chá em Rize"
 tre_rize_tea_desc: "Rize — dotada de clima quente e úmido entre os Montes Pônticos e o Mar Negro, essa região tornar-se-á a maior área produtora de chá da Turquia. A partir de 1737, transforme as colinas de Rize em plantações de chá, usando técnicas de cultivo que chegaram pela Geórgia. Traga a nobre bebida oriental ao Império dos Comnenos."
 STATIC_MODIFIER_NAME_tre_rize_tea_mod: "Plantações de Chá de Rize"
 STATIC_MODIFIER_DESC_tre_rize_tea_mod: "As colinas de Rize transformadas em plantações de chá, estabelecendo a base da produção de chá do império."
 STATIC_MODIFIER_NAME_tre_cpole_loc_mod: "Constantinopla Reconstruída"
 STATIC_MODIFIER_DESC_tre_cpole_loc_mod: "Constantinopla começa a funcionar como centro administrativo e governamental do império."
