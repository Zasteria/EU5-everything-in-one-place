l_braz_por:
 som_ottoman_mission_pack_desc: "De beilique de fronteira ao mais poderoso sultanato do mundo. Una a Anatólia, avance até a Rumélia e reivindique Constantinopla — a cidade eterna que será seu trono."
 som_tur_secure_bursa: "Assegure Bursa"
 som_tur_secure_bursa_desc: "Bursa, a primeira grande cidade dos otomanos, deve estar firmemente sob o controle da dinastia. Estabeleça a ordem e construa a base de um Estado duradouro."
 som_tur_frontier_warriors: "Forje os Guerreiros da Fronteira"
 som_tur_frontier_warriors_desc: "Os guerreiros gazis que forjaram nosso beilique devem ser ligados à dinastia. Seu espírito de luta é nossa maior arma."
 som_tur_cross_the_straits: "Cruze os Estreitos"
 som_tur_cross_the_straits_desc: "Assegure Çanakkale e abra o caminho para a Europa. Como recompensa, será concedido um casus belli para conquistar a província de Galípoli."
 som_tur_anatolian_heartland: "Una a Anatólia"
 som_tur_anatolian_heartland_desc: "Assegure Ancara e defina a direção de seu desenvolvimento como coração da Anatólia. O que essa terra produzir decidirá o futuro do Império."
 som_ottoman_events.18.t: "O Coração da Anatólia — O Futuro de Ancara"
 som_ottoman_events.18.d: "Ancara, a cidade central da Anatólia, caiu sob controle do Império. A corte debate qual ramo da indústria deve definir o futuro da região: aprimorar sua longa tradição de tecelagem, plantar amoreiras para a sericultura ou promover o cultivo de plantas tintureiras de cores vivas."
 som_ottoman_events.18.a: "Continuar o desenvolvimento da indústria de tecelagem"
 som_ottoman_events.18.b: "Plantar amoreiras e iniciar a produção de seda"
 som_ottoman_events.18.c: "Promover o cultivo de plantas tintureiras"
 som_tur_vassalize_beyliks: "Subjugação dos Beiliques"
 som_tur_vassalize_beyliks_desc: "Os demais beiliques anatólios devem prestar homenagem ou ser esmagados. Só uma Anatólia unida pode desafiar as potências do leste e do oeste."
 som_tur_siege_constantinople: "A Queda de Constantinopla"
 som_tur_siege_constantinople_desc: "A cidade eterna, sede do Império Romano do Oriente, deve cair diante do canhão e do aço otomanos. Sua conquista anunciará nosso império ao mundo. A população da cidade será transformada sob o governo otomano."
 STATIC_MODIFIER_NAME_som_tur_ghazi_warriors: "Guerreiros Gazis"
 STATIC_MODIFIER_DESC_som_tur_ghazi_warriors: "“Gazi” — título de quem luta contra os infiéis em nome do islã. Desde Osman Gazi, fundador da dinastia, os guerreiros de fronteira avançaram sem cessar pelas fronteiras enfraquecidas de Bizâncio com esse sagrado senso de missão. Esse zelo religioso era o motor espiritual da expansão otomana."
 som_ottoman_events.1.t: "Bursa — Berço dos Otomanos"
 som_ottoman_events.1.d: "Bursa, Iznik e Nicomédia caíram em mãos otomanas. Em Bursa, comunidades gregas ortodoxas, armênias, judaicas e turcas muçulmanas vivem lado a lado sob a nova dinastia. A corte do sultão enfrenta agora a questão: como incorporar esses diversos povos ao Estado otomano?"
 som_ottoman_events.1.a: "Uni-los sob a bandeira do islã e da tradição turca"
 som_ottoman_events.1.a.tt: "Muitos habitantes de Bursa se converterão ao sunismo e adotarão a cultura turca."
 som_ottoman_events.4.t: "A Queda de Constantinopla"
 som_ottoman_events.4.d: "Constantinopla caiu. O último imperador de Bizâncio, Constantino XI, tombou lutando nas muralhas, e as tropas de Mehmed II entraram na cidade. Onde antes dobravam os sinos da Hagia Sophia, ressoa agora o chamado à oração. O sultão rebatiza a cidade como Kostantiniyye e a proclama nova capital imperial."
 som_ottoman_events.4.a: "Transformar a cidade na capital otomana"
 som_ottoman_events.4.a.tt: "A maioria dos habitantes de Constantinopla se converterá ao sunismo e adotará a cultura turca."
 som_tur_conquer_bulgaria: "Conquiste a Bulgária"
 som_tur_conquer_bulgaria_desc: "Tarnovo foi a gloriosa capital do Segundo Império Búlgaro. Tome essa cidade e abra o caminho para o norte."
 som_tur_conquer_serbia: "Conquiste a Sérvia"
 som_tur_conquer_serbia_desc: "Novo Brdo contém as maiores minas de prata dos Bálcãs, enquanto Escópia é a porta da Macedônia. Assegure as duas cidades para trazer a Sérvia meridional ao controle otomano."
 som_tur_conquer_hungary: "Invada a Hungria"
 som_tur_conquer_hungary_desc: "Derrote o exército de campanha húngaro em Mohács e tome Buda. O Danúbio tornar-se-á a fronteira norte do Império Otomano."
 som_tur_siege_vienna: "O Cerco de Viena"
 som_tur_siege_vienna_desc: "Erga o estandarte otomano diante das muralhas de Viena. O mundo testemunhará o poder do Império Otomano."
 som_tur_anatolia_unified: "Unidade da Anatólia"
 som_tur_anatolia_unified_desc: "Conquiste Trebizonda e Erzurum para trazer toda a Anatólia ao domínio otomano. Os Montes Pônticos marcarão a fronteira oriental do império."
 som_tur_conquer_syria: "À Síria"
 som_tur_conquer_syria_desc: "Conquiste Alepo e Damasco. A Síria é o coração do saber e do comércio islâmicos; sua tomada eleva o prestígio do império."
 som_tur_defeat_mamluks: "Derrote os Mamelucos"
 som_tur_defeat_mamluks_desc: "Durante a guerra contra os mamelucos, tome o Cairo para impor uma paz favorável. Com o Cairo ocupado, os mamelucos podem ser forçados a aceitar a vassalagem."
 som_tur_holy_cities: "As Cidades Santas"
 som_tur_holy_cities_desc: "Assegure Jerusalém e proclame o sultão califa. Como guardião das duas cidades santas, os otomanos estão no topo do mundo islâmico."
 som_tur_red_sea_dominance: "Domínio do Mar Vermelho"
 som_tur_red_sea_dominance_desc: "Assegure Alexandria e domine as rotas comerciais do Mar Vermelho. A riqueza do comércio do Oceano Índico enche o tesouro otomano."
 som_tur_age_of_suleiman: "Pax Otomana"
 STATIC_MODIFIER_NAME_som_tur_danube_frontier: "A Fronteira do Danúbio"
 STATIC_MODIFIER_DESC_som_tur_danube_frontier: "O Danúbio estabelecido como fronteira norte, e as lições do exército otomano diante das portas de Viena inscritas na doutrina imperial."
 STATIC_MODIFIER_NAME_som_tur_anatolia_unified_mod: "Anatólia Unificada"
 STATIC_MODIFIER_DESC_som_tur_anatolia_unified_mod: "De Trebizonda a Erzurum, toda a Anatólia sob controle otomano. A base oriental do império assegurada, melhorando a receita fiscal e a legitimidade."
 STATIC_MODIFIER_NAME_som_tur_red_sea_trade: "Rede Rodoviária Imperial"
 STATIC_MODIFIER_DESC_som_tur_red_sea_trade: "O Mar Vermelho foi a rota dourada por onde especiarias, sedas e corantes da Índia e do Sudeste Asiático chegavam à Europa. Mesmo depois que Portugal abriu uma nova rota em torno da extremidade sul da África, a rota do Mar Vermelho por Cairo e Alexandria conservou seu valor, e o Império Otomano tornou-se o maior beneficiário dessa rota comercial."
 som_tur_fate_of_crimea: "O Destino da Crimeia"
 som_tur_fate_of_crimea_desc: "A península da Crimeia, com o entreposto comercial genovês de Caffa em seu coração, controla o comércio ao longo do norte do Mar Negro. Assegure essa região e traga o comércio do Mar Negro ao controle otomano."
 som_tur_black_sea_dominance: "Domínio do Mar Negro"
 som_tur_black_sea_dominance_desc: "Com a Crimeia assegurada, Edirne fortificada e a Anatólia unificada, o Mar Negro tornou-se um lago otomano. Desenvolva o recurso de Constantinopla e estabeleça a plena hegemonia sobre o Mar Negro."
 som_tur_italy_south: "Sul da Itália"
 som_tur_italy_south_desc: "Conquiste Nápoles e a Sicília para obter o centro do Mediterrâneo. Essas antigas cidades comerciais encherão o tesouro imperial."
 som_tur_italy_north: "Itália Conquistada"
 som_tur_italy_north_desc: "Conquiste Roma, Florença e Milão para completar a conquista da península itálica. A cidade do papa, a cidade dos Médici, a cidade dos Visconti — todas se tornam do sultão."
 som_tur_arabia_conquest: "Domine a Arábia"
 som_tur_arabia_conquest_desc: "Assegure Meca, Medina e Suez para controlar as cidades santas do mundo islâmico e a porta do Oceano Índico."
 som_tur_persian_gulf: "O Golfo Pérsico"
 som_tur_persian_gulf_desc: "Tome Ormuz e domine as rotas comerciais do Golfo Pérsico. A riqueza do comércio do Oceano Índico flui para o tesouro otomano."
 som_tur_north_africa: "O Magrebe"
 som_tur_north_africa_desc: "Conquiste Túnis, Argel e Trípoli para trazer o litoral mediterrâneo meridional ao domínio otomano. Os corsários berberes inclinam-se diante do estandarte do sultão."
 som_tur_morocco: "Marrocos"
 som_tur_morocco_desc: "Conquiste Fez e Marrakech para somar todo o norte da África ao Império Otomano. As costas do Atlântico tornam-se a fronteira ocidental do império."
 som_tur_age_of_suleiman_desc: "De Viena ao norte à Arábia e ao Marrocos ao sul — concluído um império mundial que abrange três continentes. Exige concluir o Cerco de Viena, o Golfo Pérsico e Marrocos."
 STATIC_MODIFIER_NAME_som_tur_black_sea_master: "Senhor do Mar Negro"
 STATIC_MODIFIER_DESC_som_tur_black_sea_master: "O Mar Negro é agora um lago otomano. À luz dessa conquista, a corte debate introduzir novas instituições de governo, abrindo espaço para uma nova reforma."
 STATIC_MODIFIER_NAME_som_tur_italy_south_mod: "Domínio do Sul da Itália"
 STATIC_MODIFIER_DESC_som_tur_italy_south_mod: "Controlando Nápoles e a Sicília, o Mediterrâneo central passou a mãos otomanas. Renda comercial e reputação diplomática melhoradas."
 STATIC_MODIFIER_NAME_som_tur_arabia_mod: "Guardião da Arábia"
 STATIC_MODIFIER_DESC_som_tur_arabia_mod: "“Servidor dos Dois Santos Haram” — Meca e Medina são os dois lugares mais sagrados do islã. Em 1517, Selim I conquistou o Egito e o Hejaz e tomou esses lugares em suas mãos, e o sultão otomano tornou-se o protetor religioso de todo o mundo muçulmano sunita. O dever e a honra de proteger a peregrinação anual do hajj recaíram sobre o sultão."
 STATIC_MODIFIER_NAME_som_tur_gulf_trade: "Domínio Comercial no Golfo Pérsico"
 STATIC_MODIFIER_DESC_som_tur_gulf_trade: "O Estreito de Ormuz é a única porta por onde as especiarias e sedas da Índia e do Sudeste Asiático entram no Golfo Pérsico. Possuir esse “pescoço do mundo” seria uma vantagem decisiva contra a rota comercial indiana que Portugal procurava estabelecer em torno da África."
 STATIC_MODIFIER_NAME_som_tur_africa_final_mod: "Hegemonia Africana"
 STATIC_MODIFIER_DESC_som_tur_africa_final_mod: "Norte da África conquistado. A cavalaria de elite dos desertos e das estepes junta-se ao exército otomano, melhorando a força da cavalaria leve e pesada."
 STATIC_MODIFIER_NAME_som_tur_ankara_fine_cloth: "Comércio de Tecidos Finos de Ancara"
 STATIC_MODIFIER_DESC_som_tur_ankara_fine_cloth: "Nas oficinas de Ancara, as técnicas tradicionais de tecelagem são aprimoradas, aumentando a produção de tecido fino."
 STATIC_MODIFIER_NAME_som_tur_ankara_silk: "Comércio de Seda de Ancara"
 STATIC_MODIFIER_DESC_som_tur_ankara_silk: "Amoreiras plantadas em todos os campos de Ancara, aumentando a produção de seda."
 STATIC_MODIFIER_NAME_som_tur_ankara_dyes: "Comércio de Corantes de Ancara"
 STATIC_MODIFIER_DESC_som_tur_ankara_dyes: "O cultivo de plantas tintureiras de cores vivas se espalha em torno de Ancara, aumentando a produção de corantes."
 eyalet: "Eyalet"
 eyalet_desc: "Estado vassalo provincial do Império Otomano. Sujeito a controle mais rigoroso que um vassalo, paga tributo em dobro e é anexado diplomaticamente duas vezes mais rápido."
 eyalet_plural: "Eyalets"
 som_ottoman_events.20.t: "Domínio do Mar Negro"
 som_ottoman_events.20.d: "O Mar Negro foi outrora um lago genovês. Mas com a queda de Caffa em 1475 e o controle otomano do Bósforo, o último bastião genovês desapareceu. O Mar Negro é agora um lago otomano. Três séculos de domínio comercial veneziano e genovês sobre o Mediterrâneo oriental chegam ao fim."
 som_ottoman_events.20.a: "O Mar Negro — lago otomano"
 som_ottoman_events.30.t: "Às Portas de Viena"
 som_ottoman_events.30.d: "O exército de Solimão, o Magnífico, chegou a Viena. Trezentos mil soldados otomanos abalaram todo o mundo cristão. Em 1529, a cidade sobreviveu graças a um inverno precoce e a linhas de suprimento sobrecarregadas — mas desta vez é diferente. “Se Viena cair, a Europa será nossa” — declara o sultão."
 som_ottoman_events.30.a: "Tomar Viena e tornar-se senhor da Europa"
 som_ottoman_events.99.t: "A Era de Solimão"
 som_ottoman_events.99.d: "O Império Otomano alcançou seu apogeu — a era de Solimão, o Magnífico. Dos Bálcãs à Arábia, da Crimeia ao norte da África, o domínio, que supera até Roma, inclina-se diante da vontade de um único sultão. Chamado de “Legislador” (Kanuni) por codificar o direito otomano, Solimão preside o maior florescimento de arte, arquitetura e poder militar da história do império. As mesquitas, os palácios e os bazares de Istambul proclamam a glória da maior cidade do mundo. O Império Otomano tornou-se uma das supremas potências da história."
 som_ottoman_events.99.a: "Começa a era de ouro do grande Império Otomano"
 som_tur_edirne_capital: "A Fortaleza de Edirne"
 som_tur_edirne_capital_desc: "A antiga Adrianópolis tornou-se Edirne quando Murad I a fez capital otomana em 1363 — base de onde se conquistaram os Bálcãs. Permaneceu capital imperial por quase noventa anos, até a queda de Constantinopla em 1453, e foi onde nasceu Mehmed II. Fortifique essa cidade como âncora da Rumélia e trampolim para a conquista dos Bálcãs."
 som_tur_aegean_dominance: "Domine o Mar Egeu"
 som_tur_aegean_dominance_desc: "O Mar Egeu foi o campo de batalha da rivalidade comercial entre Veneza e Gênova. Tomar Esmirna como pedra angular do litoral oriental egeu e construir poder naval dá aos otomanos uma cabeça de ponte para toda a expansão mediterrânea. A frota otomana inicial deve ser construída do zero — mas crescerá numa força temível."
 som_tur_janissary_corps: "O Corpo de Janízaros"
 som_tur_janissary_corps_desc: "Em meados do século XIV, o filho de Orhan I, Murad I, criou os janízaros — “novos soldados”, formados com meninos cristãos levados pelo sistema devshirme, convertidos ao islã e treinados como fiel infantaria permanente do sultão. Pagos regularmente e rigorosamente disciplinados, os janízaros tornaram-se a espinha dorsal do exército otomano e tiveram papel decisivo na queda de Constantinopla e em incontáveis outras batalhas."
 som_tur_devshirme_system: "O Sistema Devshirme"
 som_tur_devshirme_system_desc: "O devshirme (“recolhimento de meninos”) levava jovens cristãos dos Bálcãs, convertia-os ao islã e os treinava como janízaros e funcionários do palácio. O sistema criou uma classe de funcionários leais apenas ao sultão, sem vínculos de linhagem ou família. Dessa classe saíram muitos dos maiores grão-vizires do império — homens que ascenderam da escravidão ao mais alto cargo do país."
 som_tur_elite_guard: "A Guarda de Elite"
 som_tur_elite_guard_desc: "A guarda pessoal do sultão, selecionada entre os melhores janízaros, era a tropa mais disciplinada do império. Serviam de sentinelas do palácio e levavam o estandarte imperial em campanha. Investir em treinamento rigoroso e altos padrões cria o núcleo de uma força de combate profissional que levará o império à glória."
 som_tur_kanun_i_osmani: "O Kanun-i Osmani"
 som_tur_kanun_i_osmani_desc: "O Kanun-i Osmani (“Código Otomano”) era um sistema jurídico secular desenvolvido ao lado da xaria. O sultão “Kanuni” (Legislador) Solimão I concluiu sua codificação, mas as bases foram lançadas nos séculos XIV e XV. Abrangendo direito fiscal, processo penal e administração, o kanun deu ao Estado otomano uma estrutura jurídica racionalizada, que operava ao lado do direito sagrado islâmico — e o complementava."
 som_tur_imperial_army: "O Exército Imperial"
 som_tur_imperial_army_desc: "Janízaros, cavalaria sipahi, azabs, cavalaria leve akıncı — o exército otomano era um sistema de armas combinadas, que unia vários tipos de tropa sob comando centralizado. Disciplinado, pago e cada vez mais armado com armas de fogo, o exército otomano do século XVI era uma das máquinas de guerra mais formidáveis que o mundo já viu. Leve-o ao pleno potencial."
 som_tur_timar_system: "O Sistema Timar"
 som_tur_timar_system_desc: "O timar era a instituição fundamental de posse de terra do Estado otomano. O sultão concedia a terra conquistada aos cavaleiros sipahi como timares em troca de serviço militar — de modo semelhante ao feudalismo europeu, mas sem direitos hereditários. O sistema timar financiava uma grande força militar sem esgotar o tesouro imperial, tornando autofinanciada a expansão otomana inicial."
 som_tur_sipahi_cavalry: "A Cavalaria Sipahi"
 som_tur_sipahi_cavalry_desc: "Os sipahi — cavaleiros encouraçados financiados por concessões de timar — formaram a principal força de choque do exército otomano nos séculos XV e XVI. Suas cargas trovejantes eram temidas nos Bálcãs e na Anatólia. À medida que o império se expandia, a classe sipahi tornou-se uma poderosa aristocracia provincial, cujos interesses o sultão precisava considerar com cuidado."
 som_tur_eyalet_system: "O Sistema de Eyalets"
 som_tur_eyalet_system_desc: "O eyalet (“província”) era a maior unidade administrativa do Império Otomano, administrada por um beilerbei nomeado diretamente pelo sultão. Rumélia, Anatólia, Egito, Síria — cada eyalet era um império em miniatura, com seu contingente militar e aparato administrativo. O sistema estendia a autoridade imperial aos mais distantes cantos do reino sem exigir a presença pessoal do sultão."
 som_tur_grand_vizier: "O Grão-Vizir"
 som_tur_grand_vizier_desc: "O grão-vizir (Sadrazam) era o principal administrador do império, abaixo apenas do sultão. Sua residência — a “Sublime Porta” (Bab-ı Ali) — tornou-se sinônimo do próprio governo otomano e o endereço onde os diplomatas europeus apresentavam suas credenciais. Um grão-vizir capaz podia governar o império com eficácia, deixando o sultão concentrar-se na legitimidade e no comando militar."
 som_tur_imperial_bureaucracy: "A Burocracia Imperial"
 som_tur_imperial_bureaucracy_desc: "A burocracia otomana — combinação de funcionários devshirme e administradores turco-islâmicos tradicionais — era um dos mais sofisticados sistemas de governo de sua época. A cultura de documentos, a contabilidade centralizada e os departamentos especializados (divãs) tornaram o enorme império surpreendentemente administrável. A simples quantidade de registros mantidos pelos escribas otomanos continua sendo um tesouro para os historiadores."
 som_tur_new_capital: "Desenvolva Kostantiniyye"
 som_tur_new_capital_desc: "Mehmed II rebatizou a cidade conquistada de “Kostantiniyye” e iniciou de imediato um ambicioso programa de reconstrução. O reassentamento forçado de artesãos e mercadores, a reconstrução da infraestrutura e o renascimento dos mercados transformaram a cidade de ruínas numa metrópole florescente. O sultão exigiu que Kostantiniyye superasse a glória da capital bizantina que substituíra — e dirigiu todos os recursos do império para alcançá-lo."
 som_tur_new_capital_unlock_tt: "A decisão “A Reconstrução de Kostantiniyye” está agora disponível."
 som_develop_kostantiniyye_decision.title: "A Reconstrução de Kostantiniyye"
 som_develop_kostantiniyye_decision.desc: "A capital conquistada cresceu, mas seus bairros ainda carregam as cicatrizes do cerco. O tesouro do sultão pode custear o reassentamento, novos mercados e ruas reconstruídas, para que Kostantiniyye volte a prosperar."
 som_develop_kostantiniyye_decision.a: "Investir na reconstrução da capital."
 som_expand_kostantiniyye_decision.title: "Conduzir Kostantiniyye ao esplendor"
 som_expand_kostantiniyye_decision.desc: "A reconstrução deu frutos: colonos e artesãos enchem os novos bairros. Com maiores investimentos em oficinas, caravançarás e nas terras ao redor da cidade, Kostantiniyye pode superar até a glória da capital bizantina."
 som_expand_kostantiniyye_decision.a: "Investir na grandeza da cidade."
 som_tur_grand_bazaar: "O Grande Bazar"
 som_tur_grand_bazaar_desc: "Construído por ordem de Mehmed II entre 1455 e 1461, o Grande Bazar (Kapalıçarşı) foi um dos primeiros mercados cobertos do mundo e logo se tornou o maior. Quatro mil lojas, que vendiam seda, especiarias, joias, cerâmica e armas, atraíam dezenas de milhares de compradores por dia. Em seu centro, o salão dos comerciantes de ouro e prata — o Bedesten — servia de coração comercial do império."
 som_tur_grand_bazaar_condition_tt: "A decisão “Conduzir Kostantiniyye ao esplendor” foi usada"
 som_tur_suleiman_mosque: "A Mesquita de Solimão"
 som_tur_suleiman_mosque_desc: "Projetada pelo mestre arquiteto Sinan e concluída em 1557, a mesquita de Solimão é uma obra-prima da arquitetura otomana. Quatro minaretes perfuram o horizonte de Istambul; a vasta cúpula domina a silhueta da cidade vista do Bósforo. O complexo ao redor (külliye) incluía colégios, um hospital, lojas e um caravançarai — uma cidade dentro da cidade, encarnando o ideal otomano de mecenato imperial."
 som_tur_topkapi_palace: "O Palácio de Topkapı"
 som_tur_topkapi_palace_desc: "O Palácio de Topkapı — erguido num promontório que domina o Bósforo, o Corno de Ouro e o Mar de Mármara — serviu de corte otomana por quatro séculos. Os aposentos do sultão, o harém imperial, o tesouro e a sala do conselho (Divan-ı Hümayun) estavam todos em seus quatro pátios. Todo grão-vizir foi ali nomeado e destituído; toda campanha começava à sua sombra."
 som_tur_city_of_worlds_desire: "A Cidade Desejada pelo Mundo"
 som_tur_ulema_authority: "A Autoridade dos Ulemás"
 som_tur_ulema_authority_desc: "Os ulemás — eruditos islâmicos que serviam de juízes, consultores jurídicos e professores — davam ao Estado otomano sua legitimidade religiosa. Como cádis (juízes), muftis (consultores jurídicos) e professores de madraças, administravam justiça e educação por todo o império. Sua aprovação era indispensável para que qualquer política importante — inclusive declarações de guerra — fosse vista pela população muçulmana como legítima."
 som_tur_millet_system: "O Sistema Millet"
 som_tur_millet_system_desc: "O sistema millet (“nação” ou “comunidade”) organizava os súditos não muçulmanos do Império Otomano em comunidades religiosas semiautônomas. O millet ortodoxo grego Rum, o millet armênio e o millet judeu — cada um tinha seus tribunais, escolas e instituições de caridade sob a direção de seus líderes religiosos. Esse extraordinário sistema de pluralismo administrado permitiu ao império governar uma imensa diversidade sem exigir conversões forçadas."
 som_tur_kadi_courts: "Os Tribunais dos Cádis"
 som_tur_kadi_courts_desc: "Os cádis — juízes nomeados diretamente pelo sultão — administravam o direito islâmico por todo o império, das grandes cidades às aldeias remotas. Seus registros judiciais (sijillat) documentavam não apenas disputas jurídicas, mas também contratos, escrituras de terra e relações sociais, criando um retrato extraordinariamente detalhado da sociedade otomana. O sistema dos cádis levava o Estado de direito — o direito otomano — a cada canto do reino."
 som_tur_sufi_culture: "A Cultura Sufi"
 som_tur_sufi_culture_desc: "As ordens sufis (tarikats) estavam entretecidas na trama da sociedade otomana. A ordem Mevlevi — conhecida pelos dervixes rodopiantes — era protegida pela corte. A ordem Bektashi — espinha dorsal espiritual dos janízaros. A ordem Naqshbandi — influente na política do palácio. O misticismo sufi moldou a poesia, a música e a arte otomanas e serviu de contrapeso espiritual a uma interpretação legalista do islã."
 som_tur_cultural_synthesis: "Síntese Cultural"
 som_tur_cultural_synthesis_desc: "O Império Otomano absorveu, em vez de destruir, as culturas que conquistou. Os sistemas administrativos bizantinos, o saber árabe, a cultura de corte persa e a tradição militar turca fundiram-se numa “civilização otomana” singular. Essa síntese cultural não era mero ornamento — era a filosofia que regia o império, permitindo-lhe absorver e aproveitar as energias de dezenas de povos conquistados."
 som_tur_bursa_silk_industry: "A Indústria da Seda de Bursa"
 som_tur_bursa_silk_industry_desc: "Bursa, a primeira capital otomana, desenvolveu-se como capital da seda do império desde o século XIV. Os artesãos, que antes trabalhavam sob mecenato bizantino, encontraram novos senhores na corte otomana, produzindo sedas de luxo para exportar a toda a Europa e ao Oriente Médio. “Cidade da seda” tornou-se a autodefinição de Bursa — um sucesso comercial que ajudou a financiar a expansão otomana."
 som_tur_silk_road: "A Rota da Seda"
 som_tur_silk_road_desc: "Trebizonda era o ponto terminal ocidental da rota cáspia — o canal por onde seda, especiarias e artigos de luxo da Ásia Central entravam na Anatólia. Controlar esse porto deu aos otomanos um aperto mortal sobre o comércio terrestre entre a Ásia e a Europa. A própria renda do comércio que passava por Trebizonda ajudou a financiar as ambições imperiais por gerações."
 som_tur_ankara_prosperity: "Prosperidade de Ancara"
 som_tur_ankara_prosperity_desc: "Ancara era um nó do comércio terrestre da Anatólia central — cidade que serviu a mercadores por milênios. Sua lã de cabra angorá deu origem a uma fibra de luxo cujo nome (angorá, depois ancara) tornou-se sinônimo de maciez. As plantas tintureiras, o processamento da lã e sua posição na rota que liga Bursa a Trebizonda a tornaram um nó insubstituível da rede comercial otomana."
 som_tur_trade_routes: "As Rotas Comerciais Imperiais"
 som_tur_trade_routes_desc: "À medida que o império se expandia, os otomanos investiam em caravançarais (estalagens de beira de estrada), estradas pavimentadas, pontes e patrulhas navais contra piratas. O resultado foi uma infraestrutura comercial que tornou o comércio terrestre e marítimo mais seguro e lucrativo do que desde o auge do Império Romano. Constantinopla, no centro de uma rede comercial em expansão, tornou-se o coração econômico pulsante de três continentes."
 som_tur_commercial_empire: "O Império Comercial"
 som_tur_commercial_empire_desc: "Alepo, Alexandria, Constantinopla — as três maiores cidades comerciais do mundo, agora todas otomanas. As especiarias da Índia, as sedas da China, a prata da Europa — tudo passava por mãos otomanas no caminho do produtor ao consumidor. O império cobrava uma parcela de cada transação. Mesmo quando os portugueses abriram a rota marítima em torno da África, os intermediários otomanos conservaram enorme vantagem comercial por mais um século."
 STATIC_MODIFIER_NAME_som_tur_janissary_mod: "O Corpo de Janízaros"
 STATIC_MODIFIER_DESC_som_tur_janissary_mod: "Os janízaros — infantaria permanente de elite, formada com meninos cristãos convertidos — tornaram-se a espinha dorsal da força militar otomana. Seus característicos chapéus brancos e uniformes azuis eram a visão mais aterrorizante dos campos de batalha do século XV. Seu papel na queda de Constantinopla foi decisivo."
 STATIC_MODIFIER_NAME_som_tur_devshirme_mod: "O Sistema Devshirme"
 STATIC_MODIFIER_DESC_som_tur_devshirme_mod: "O devshirme criou uma classe de funcionários leais apenas ao sultão, sem vínculos familiares ou de linhagem. Esse sistema meritocrático (pelos padrões otomanos) permitia que homens de origem cristã humilde ascendessem aos mais altos cargos do império — ao mesmo tempo que dava ao sultão sempre um pilar de poder alternativo contra a consolidada nobreza turca."
 STATIC_MODIFIER_NAME_som_tur_elite_guard_mod: "A Guarda de Elite"
 STATIC_MODIFIER_DESC_som_tur_elite_guard_mod: "Selecionada entre os melhores janízaros, a guarda pessoal do sultão era a tropa mais disciplinada do império. Encarnava não só o poderio militar, mas também a autoridade simbólica do sultanato — sua presença em campanha era a declaração de que a pessoa do sultão estava presente, mesmo quando ele próprio não estava."
 STATIC_MODIFIER_NAME_som_tur_kanun_mod: "O Código Kanun"
 STATIC_MODIFIER_DESC_som_tur_kanun_mod: "O kanun — direito secular otomano — operava ao lado da xaria, criando um sistema jurídico duplo que abrangia impostos, processo penal e administração. A autoridade legislativa do sultão para criar direito secular era uma inovação teológica, dando ao Estado otomano uma flexibilidade que faltava a Estados puramente xariáticos."
 STATIC_MODIFIER_NAME_som_tur_imperial_army_mod: "O Exército Imperial"
 STATIC_MODIFIER_DESC_som_tur_imperial_army_mod: "O exército otomano plenamente desenvolvido — combinando a infantaria janízara, a cavalaria sipahi e o mais sofisticado trem de artilharia do mundo — era uma maravilha militar do século XVI. Sua combinação de disciplina, poder de fogo e organização logística o tornava capaz de campanhas numa escala que nenhuma potência europeia podia igualar."
 STATIC_MODIFIER_NAME_som_tur_timar_mod: "O Sistema Timar"
 STATIC_MODIFIER_DESC_som_tur_timar_mod: "Concedendo a terra conquistada como timares não hereditários aos cavaleiros sipahi em troca de serviço militar, os otomanos financiavam seu exército sem esgotar o tesouro. O sultão mantinha a propriedade última de toda a terra de timar, dando-lhe uma vantagem sobre o estamento militar que os monarcas europeus só podiam invejar."
 STATIC_MODIFIER_NAME_som_tur_sipahi_mod: "A Cavalaria Sipahi"
 STATIC_MODIFIER_DESC_som_tur_sipahi_mod: "Os cavaleiros encouraçados sipahi, financiados por concessões de timar, eram a principal força de choque do exército otomano nos séculos XV e XVI. Suas cargas trovejantes esmagaram exércitos dos Bálcãs à fronteira persa. À medida que o império amadurecia, a classe sipahi tornou-se uma poderosa aristocracia provincial com interesses políticos próprios."
 STATIC_MODIFIER_NAME_som_tur_eyalet_mod: "O Sistema de Eyalets"
 STATIC_MODIFIER_DESC_som_tur_eyalet_mod: "O sistema de eyalets — com um beilerbei nomeado pelo sultão administrando cada província importante — estendeu o alcance administrativo otomano por uma imensa extensão geográfica. Cada eyalet era, na prática, um império em miniatura, com seu contingente militar, tesouro e corte, alimentando o centro de recursos e tropas."
 STATIC_MODIFIER_NAME_som_tur_vizier_mod: "O Grão-Vizir"
 STATIC_MODIFIER_DESC_som_tur_vizier_mod: "A residência do grão-vizir — a Sublime Porta — tornou-se o endereço pelo qual os enviados europeus conduziam a diplomacia otomana. O Divã que ele presidia era o órgão de formulação de políticas do império. Um grão-vizir capaz podia governar o império por décadas; um incapaz podia levá-lo à beira do colapso."
 STATIC_MODIFIER_NAME_som_tur_bureaucracy_mod: "A Burocracia Imperial"
 STATIC_MODIFIER_DESC_som_tur_bureaucracy_mod: "A cultura escribal otomana produziu um registro em papel de espantosa quantidade e detalhe. Cadastros de terras, levantamentos fiscais, atas judiciais e éditos imperiais criaram uma infraestrutura administrativa que fez do Império Otomano um dos Estados mais bem documentados do período pré-moderno."
 STATIC_MODIFIER_NAME_som_tur_mosque_mod: "A Mesquita de Solimão"
 STATIC_MODIFIER_DESC_som_tur_mosque_mod: "A obra-prima de Sinan anunciou ao mundo que os otomanos eram herdeiros de Roma, de Bizâncio e da suprema civilização islâmica ao mesmo tempo. Sua cúpula rivalizava com a Hagia Sophia no horizonte de Istambul — um diálogo arquitetônico deliberado entre o velho império cristão e o novo muçulmano."
 STATIC_MODIFIER_NAME_som_tur_topkapi_mod: "O Palácio de Topkapı"
 STATIC_MODIFIER_DESC_som_tur_topkapi_mod: "O Topkapı era o centro nervoso de um império de três continentes. Todo sultão foi ali coroado; toda campanha partia de seus portões; todo grão-vizir servia por sua graça. O harém entre seus muros moldou a política de sucessão por séculos."
 STATIC_MODIFIER_NAME_som_tur_ulema_mod: "A Autoridade dos Ulemás"
 STATIC_MODIFIER_DESC_som_tur_ulema_mod: "Os ulemás davam ao Estado otomano sua legitimidade religiosa. Sua aprovação das guerras do sultão como jihad, sua administração do sistema de tribunais xariáticos e sua dotação da rede educacional das madraças os tornavam parceiros indispensáveis do governo otomano."
 STATIC_MODIFIER_NAME_som_tur_millet_mod: "O Sistema Millet"
 STATIC_MODIFIER_DESC_som_tur_millet_mod: "O pluralismo religioso organizado — cristãos, judeus e muçulmanos vivendo sob um só guarda-chuva imperial, cada um gerindo seus próprios assuntos comunitários — foi a solução otomana para o problema de governar um império diverso. Não era igualdade, mas uma forma de convivência que sustentou o império por séculos."
 STATIC_MODIFIER_NAME_som_tur_kadi_mod: "Os Tribunais dos Cádis"
 STATIC_MODIFIER_DESC_som_tur_kadi_mod: "Os tribunais dos cádis levaram o Estado de direito otomano a todos os cantos do império, de Istambul às remotas aldeias anatólias. Os registros sijillat que produziram são um tesouro para o historiador: dezenas de milhares de volumes documentando disputas de propriedade, casamentos, contratos comerciais e casos criminais ao longo dos séculos."
 STATIC_MODIFIER_NAME_som_tur_sufi_mod: "A Cultura Sufi"
 STATIC_MODIFIER_DESC_som_tur_sufi_mod: "As ordens sufis davam à vida religiosa otomana uma profundidade espiritual que a compreensão formal e legalista do islã não podia oferecer. Os Mevlevi rodopiantes, os belicosos Bektashi, os politicamente ligados Naqshbandi — cada ordem ocupava um nicho próprio na sociedade otomana, e juntas teceram uma rede de comunidade espiritual por todo o império."
 STATIC_MODIFIER_NAME_som_tur_synthesis_mod: "Síntese Cultural"
 STATIC_MODIFIER_DESC_som_tur_synthesis_mod: "O talento otomano para absorver em vez de destruir fez do império uma esponja cultural. A proficiência administrativa bizantina, a cultura literária persa, a tradição acadêmica árabe e a energia militar turca fundiram-se em algo singular — e magnificamente — otomano."
 STATIC_MODIFIER_NAME_som_tur_bursa_silk_trade: "A Indústria da Seda de Bursa"
 STATIC_MODIFIER_DESC_som_tur_bursa_silk_trade: "Bursa tornou-se a capital da seda do império — papel que manteve por séculos. Os artesãos da cidade produziam sedas de luxo que adornavam as cortes da Europa e do Oriente Médio por igual, e sua renda ajudava a financiar as campanhas que construíram o império."
 STATIC_MODIFIER_NAME_som_tur_trade_empire_mod: "As Rotas Comerciais Imperiais"
 STATIC_MODIFIER_DESC_som_tur_trade_empire_mod: "Caravançarais, estradas e a repressão da pirataria reanimaram o comércio dentro do império. Uma rede comercial radial centrada em Constantinopla trouxe integração econômica."
 STATIC_MODIFIER_NAME_som_tur_istanbul_glory_mod: "A Cidade Desejada pelo Mundo"
 STATIC_MODIFIER_DESC_som_tur_istanbul_glory_mod: "Istambul — que se estende por dois continentes e domina a única passagem entre o Mar Negro e o Mediterrâneo — era a cidade que o mundo inteiro desejava. Sua população, seu comércio, sua arquitetura e sua importância política a fizeram a capital incontestada do mundo conhecido."
 som_ottoman_events.50.t: "A Cidade Desejada pelo Mundo"
 som_ottoman_events.50.d: "Constantinopla — Istambul — tornou-se de fato e plenamente a cidade que o mundo inteiro deseja. Sua população de meio milhão a faz a maior cidade da Europa e do Oriente Médio juntos. Estende-se por dois continentes. Controla a única passagem marítima entre o Mar Negro e o Mediterrâneo. A silhueta refinada da mesquita de Solimão e a altura dominante do palácio de Topkapı refletem-se nas águas do Bósforo. Em suas cortes, poetas rivalizam com filósofos, e arquitetos competem com eruditos. A civilização otomana atingiu seu auge. Esta cidade brilhará mil anos."
 som_ottoman_events.50.a: "Que Istambul brilhe mil anos!"
 som_ottoman_events.50.breadbasket_tt: "O direito urbano “Celeiro Imperial Otomano” está agora disponível. Pode ser concedido a locais de posto cidade ou superior que tenham um celeiro de nível 5 ou maior."
 STATIC_MODIFIER_NAME_som_tur_constantinople_dev_mod: "Desenvolvimento de Kostantiniyye"
 STATIC_MODIFIER_DESC_som_tur_constantinople_dev_mod: "Sob Mehmed II, o reassentamento e a reconstrução prosseguem; as vozes dos novos moradores enchem os mercados, e a alvenaria restaurada devolve novo brilho à antiga capital imperial."
 STATIC_MODIFIER_NAME_som_tur_constantinople_splendor_mod: "O Esplendor de Kostantiniyye"
 STATIC_MODIFIER_DESC_som_tur_constantinople_splendor_mod: "Em torno do Corno de Ouro erguem-se novas oficinas, caravançarás e bairros; colonos e artesãos afluem à cidade, e as terras atrás dela rendem mais do que nunca. A capital do sultão volta a ofuscar todas as cidades do mundo conhecido."
 STATIC_MODIFIER_NAME_som_tur_trebizond_trade_mod: "Trebizonda — Porta da Rota da Seda"
 STATIC_MODIFIER_DESC_som_tur_trebizond_trade_mod: "No porto de Trebizonda, na costa sul do Mar Negro, as cargas das caravanas que desceram da Rota da Seda da Ásia Central e do Cáspio empilham-se alto, à espera de navios rumo ao Mediterrâneo."
 STATIC_MODIFIER_NAME_som_tur_commercial_empire_mod: "O Império Comercial"
 STATIC_MODIFIER_DESC_som_tur_commercial_empire_mod: "Alepo, Alexandria, Constantinopla — a riqueza de três continentes flui agora pelos mercados do sultão."
 STATIC_MODIFIER_NAME_som_tur_grand_bazaar_loc_mod: "O Grande Bazar"
 STATIC_MODIFIER_DESC_som_tur_grand_bazaar_loc_mod: "Ao longo das ruas cobertas do Kapalıçarşı, os pregões de ourives e mercadores de especiarias não cessam, e as mercadorias de todo o mundo se reúnem aqui."
 som_ottoman_events.19.t: "O Destino Comercial de Esmirna"
 som_ottoman_events.19.d: "Esmirna (Izmir) é a maior cidade portuária da costa leste do Egeu, porta que liga o interior anatólio ao mundo mediterrâneo. Colonizadores gregos a fundaram na Antiguidade; agora pertence aos otomanos. O sultão deve decidir o rumo futuro da cidade: desenvolvê-la num próspero nó comercial, atraindo mercadores de todo o mundo conhecido, ou investir em construção naval para projetar o poder otomano por todo o Egeu?"
 som_ottoman_events.19.a: "Desenvolver o distrito mercantil de Esmirna e fazer dela um centro comercial"
 som_ottoman_events.19.b: "Construir um estaleiro em Esmirna e usá-lo como base naval para a expansão egeia"
 STATIC_MODIFIER_NAME_som_tur_anatolian_heartland_mod: "Domínio da Anatólia"
 STATIC_MODIFIER_DESC_som_tur_anatolian_heartland_mod: "De Konya a Trebizonda, coletores de impostos e funcionários do sultão chegam às aldeias da Anatólia, e o governo imperial se estende a cada canto do planalto."
 STATIC_MODIFIER_NAME_som_tur_crimea_dominance: "Domínio da Crimeia"
 STATIC_MODIFIER_DESC_som_tur_crimea_dominance: "Olhando por sobre o Mar Negro a partir do porto de Caffa, só navios com bandeira otomana cortam as ondas. O Mar Negro torna-se “lago otomano”."
 STATIC_MODIFIER_NAME_som_tur_aleppo_learning_mod: "O Saber de Alepo"
 STATIC_MODIFIER_DESC_som_tur_aleppo_learning_mod: "Alepo foi um dos grandes centros intelectuais do mundo islâmico. As famosas madraças, bibliotecas e eruditos reunidos aqui trazem um afluxo da tradição acadêmica árabe ao Império Otomano."
 STATIC_MODIFIER_NAME_som_tur_damascus_learning_mod: "O Saber de Damasco"
 STATIC_MODIFIER_DESC_som_tur_damascus_learning_mod: "Damasco carrega o legado intelectual acumulado dos períodos omíada, abássida e mameluco. Sob o domínio otomano, essa rica herança continua a crescer."
 STATIC_MODIFIER_NAME_som_tur_caliph_successor: "Sucessor do Califado"
 STATIC_MODIFIER_DESC_som_tur_caliph_successor: "O nome do sultão, agora guardião dos lugares santos, é pronunciado dos púlpitos como o nome do califa."
 STATIC_MODIFIER_NAME_som_tur_aegean_shipbuilding_mod: "Técnicas Navais Egeias"
 STATIC_MODIFIER_DESC_som_tur_aegean_shipbuilding_mod: "Mestres construtores das ilhas egeias levam ofícios transmitidos por gerações aos estaleiros de Istambul, e quilha após quilha é assentada."
 som_ottoman_events.61.t: "A Batalha de Marj Dabiq"
 som_ottoman_events.61.d: "Em 1516, o sultão Selim I destruiu o exército mameluco do sultão Qansuh al-Ghuri nas planícies de Marj Dabiq. O próprio Qansuh tombou no campo; toda a Síria passou a mãos otomanas. Com o Cairo ocupado, o destino do Sultanato Mameluco repousa em mãos otomanas."
 som_ottoman_events.61.a: "Absorver o Sultanato Mameluco como eyalet por meio de paz negociada"
 som_ottoman_events.61.b: "Firmar a paz e permitir que mantenham a independência"
 STATIC_MODIFIER_NAME_som_tur_edirne_trade_mod: "Edirne — Nó Comercial"
 STATIC_MODIFIER_DESC_som_tur_edirne_trade_mod: "Edirne (Adrianópolis) é o centro comercial da Rumélia. Essa cidade, que liga os Bálcãs e a Anatólia, desenvolvida como nó de produção de corantes, seda e tecido fino, sustenta a base fiscal inicial dos otomanos."
 STATIC_MODIFIER_NAME_som_tur_novo_brdo_silver_mod: "Minas de Prata de Novo Brdo"
 STATIC_MODIFIER_DESC_som_tur_novo_brdo_silver_mod: "Novo Brdo (“Nova Colina”) possui as maiores minas de prata dos Bálcãs. Mesmo depois da conquista otomana nos anos 1450, suas ricas minas continuaram a enriquecer o tesouro imperial. A prosperidade mensal e o crescimento populacional também são reforçados."
 STATIC_MODIFIER_NAME_som_tur_hungarian_march_mod: "A Marcha Húngara"
 STATIC_MODIFIER_DESC_som_tur_hungarian_march_mod: "Com Buda caída, os soldados otomanos, avançando pelo Danúbio rumo a Viena, sentem, mesmo em meio ao brilho da vitória, o começo de uma longa guerra com os Habsburgo."
 STATIC_MODIFIER_NAME_som_tur_italy_north_mod: "Domínio da Península Itálica"
 STATIC_MODIFIER_DESC_som_tur_italy_north_mod: "O estandarte do crescente tremula sobre as praças de Roma, Florença e Milão, e os moradores das cidades do Renascimento começam a aprender a língua de seus novos senhores."
 STATIC_MODIFIER_NAME_som_tur_maghreb_mod: "Domínio do Magrebe"
 STATIC_MODIFIER_DESC_som_tur_maghreb_mod: "Os navios dos corsários berberes, reunidos nos portos de Túnis e Argel, olham agora o Mediterrâneo ocidental como ala da frota do sultão."
 som_tur_silk_road_revival: "Renascimento da Rota da Seda"
 som_tur_silk_road_revival_desc: "Tabriz era o nó mais ocidental da Rota da Seda — capital do Ilcanato, que outrora ligava a Pérsia e a Ásia Central ao mundo mediterrâneo. Tomar essa cidade dá ao Império Otomano controle direto sobre o fluxo de seda, especiarias e joias da Ásia. A vasta rede comercial que liga o Mar Negro à Ásia Central renasce, reforçando muito o poder comercial imperial."
 STATIC_MODIFIER_NAME_som_tur_silk_road_revival_mod: "Renascimento da Rota da Seda"
 STATIC_MODIFIER_DESC_som_tur_silk_road_revival_mod: "Dos mercados de Tabriz, caravanas carregadas de seda chinesa seguem de novo o caminho rumo a Istambul, e a Rota da Seda recuperou sua animação."
 som_tur_city_of_worlds_desire_desc: "Istambul é verdadeiramente a cidade desejada pelo mundo. Com população superior a meio milhão, é o eixo incontestado do comércio mundial. À medida que essa grande cidade alcança sua plena glória, a antiga lei bizantina do Celeiro Imperial torna-se disponível também ao Império Otomano."
 som_tur_true_rome: "O Verdadeiro Império Romano"
 som_tur_true_rome_desc: "Bálcãs, Anatólia, mundo árabe, Egito, norte da África, Itália — praticamente todas as terras outrora governadas por Roma levam agora o estandarte otomano. Mehmed II assumiu o título de Kayser-i Rum (Imperador) depois da queda de Constantinopla. Agora o Império Otomano ergue-se como verdadeiro herdeiro de Roma — herdando suas estradas, suas leis, sua civilização. Ressuscite o Código de Justiniano, amplie o sistema de aquedutos e una o vasto império sob uma só lei e uma só cultura."
 STATIC_MODIFIER_NAME_som_tur_true_rome_mod: "O Verdadeiro Império Romano"
 STATIC_MODIFIER_DESC_som_tur_true_rome_mod: "Sob um império que reivindica o manto de Roma, as estradas são reparadas, os aquedutos ampliados e o código de Justiniano ressuscitado como direito de uma nova era."
 som_ottoman_mission_pack: "A Ascensão do Império Otomano"
 som_ottoman_mission_pack_DESCRIPTION:0 "Em 1337, o Estado otomano é um pequeno beilique anatólio com capital em Bursa, Iznik e Izmit. Em poucas gerações, transformar-se-á num império que se estende dos Bálcãs à Arábia, da Crimeia ao norte da África e à Itália. Leve o espírito dos gazis aos Bálcãs, ponha Constantinopla de joelhos, realize a era de ouro de Solimão, o Magnífico — e reivindique o manto da verdadeira Roma."
 som_ottoman_mission_pack_CRITERIA_DESCRIPTION:0 "Como Otomanos, conquiste os Bálcãs, a Anatólia, o mundo árabe e o Mediterrâneo; construa instituições internas duradouras; e alcance a era de Solimão."
 som_ottoman_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para realizar a Ascensão do Império Otomano."
 som_ottoman_mission_pack_BUTTON_DETAILS:0 "De um pequeno beilique em 1337 ao maior império do mundo!"
