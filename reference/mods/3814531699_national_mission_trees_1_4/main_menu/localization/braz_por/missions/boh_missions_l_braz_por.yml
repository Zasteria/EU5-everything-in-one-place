l_braz_por:
 boh_crown_of_bohemia_mission_pack: "A Glória da Coroa da Boêmia"
 boh_crown_of_bohemia_mission_pack_DESCRIPTION:0 "Em 1337, a Boêmia é um poderoso reino da Europa Central sob João I (o Rei Cego) da casa de Luxemburgo. Percorra a turbulenta história da Boêmia — o imperador Carlos IV, a fundação da Universidade Carolina, a Bula de Ouro — e, da execução de Jan Hus à tática das carroças de guerra das guerras hussitas. Una a Morávia, a Silésia e a Eslováquia, desafie os Habsburgo pelo domínio do Sacro Império Romano e estabeleça a Comunidade Boêmia."
 boh_crown_of_bohemia_mission_pack_CRITERIA_DESCRIPTION:0 "Como Boêmia, alcance o domínio imperial, o florescimento cultural e a conquista do sul, para estabelecer a Comunidade Boêmia."
 boh_crown_of_bohemia_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para estabelecer a Comunidade Boêmia."
 boh_crown_of_bohemia_mission_pack_BUTTON_DETAILS:0 "Leve adiante a vontade do Rei Cego — da Praga dourada ao Império da Europa Central!"
 boh_crown_of_jan: "A Coroa do Rei Cego"
 boh_crown_of_jan_desc: "Ano de 1337 — João I, o Rei Cego, governa a Boêmia como um dos mais poderosos soberanos da Europa Central. “Não vejo, mas ainda posso lutar” — o espírito do Rei Cego é o orgulho da Boêmia. Antes de sua morte heroica na batalha de Crécy, em 1346, elevou a casa de Luxemburgo ao posto de uma das maiores dinastias da Europa. Estabeleça Praga como capital real e fortaleça os alicerces do reino."
 boh_lion_of_empire: "O Leão do Império"
 boh_lion_of_empire_desc: "O rei da Boêmia é o mais poderoso eleitor do Sacro Império Romano. Todo príncipe do Império deve inclinar-se diante da espada da Boêmia. Estabeleça a posição de “Leão do Império” por meio da força militar e do prestígio."
 boh_challenge_habsburg: "Desafie os Habsburgo"
 boh_challenge_habsburg_desc: "A casa de Habsburgo — a maior rival da Boêmia pelo domínio da Europa Central — planeja a hegemonia imperial a partir de sua base austríaca. A Boêmia deve deixar clara sua oposição."
 boh_saxony_ambitions: "Ambições sobre a Saxônia"
 boh_saxony_ambitions_desc: "A Saxônia, com Dresden em seu coração, é um importante centro de comércio e cultura no Elba. Traga o eleitorado da Saxônia sob controle e amplie a influência imperial da Boêmia."
 boh_conquer_austria: "Conquiste a Áustria"
 boh_conquer_austria_desc: "Viena caiu, e o coração austríaco dos Habsburgo foi esmagado. O orgulho dos “Habsburgo, sobre cujos domínios o sol nunca se punha” enfim quebrado. A Boêmia é a verdadeira senhora da Europa Central."
 boh_dominate_hre: "Domine o Sacro Império Romano"
 boh_dominate_hre_desc: "A Boêmia domina o Sacro Império Romano. Além do título imperial concretizado por Carlos IV em 1355, a Boêmia governa agora como líder incontestada de todo o Império."
 boh_develop_prague: "Desenvolva Praga"
 boh_develop_prague_desc: "Praga, a “Cidade das Cem Torres” — estendida pelas duas margens do Moldava, entrou em sua era de ouro no século XIV como a maior cidade da Europa Central. O Castelo de Praga, a Ponte Carlos e a Praça da Cidade Velha proclamam ao mundo a glória do Reino da Boêmia."
 boh_charles_university: "Universidade Carolina"
 boh_charles_university_desc: "Em 1348, Carlos IV fundou a Universidade Carolina em Praga — a primeira universidade da Europa Central. Essa instituição de teologia, direito, medicina e filosofia produziu grandes reformadores como Jan Hus. Construa uma universidade em Praga depois de 1348 para alcançar esse marco histórico."
 boh_golden_bull: "A Bula de Ouro"
 boh_golden_bull_desc: "A Bula de Ouro de 1356, promulgada por Carlos IV, codificou o sistema eleitoral do Sacro Império Romano e estabeleceu o rei da Boêmia como o mais importante eleitor do Império. Torne inviolável a posição jurídica e política da Boêmia."
 boh_bohemian_glass: "O Vidro da Boêmia"
 boh_bohemian_glass_desc: "Nascido das águas cristalinas e da abundante areia de quartzo da Boêmia, o vidro boêmio é estimado nas cortes de toda a Europa por sua beleza refinada. Desenvolva essa indústria para que o “cristal da Boêmia” se torne sinônimo de excelência europeia."
 boh_silver_mines: "As Minas de Prata de Kutná Hora"
 boh_silver_mines_desc: "As minas de prata de Kutná Hora foram as mais produtivas da Europa do século XIV. Essa prata, cunhada como groschen de Praga, circulou por toda a Europa Central e sustentou a era de ouro econômica da Boêmia."
 boh_develop_moravia: "Desenvolva a Morávia"
 boh_develop_moravia_desc: "A Morávia, centrada em Brno e Olomouc, é parte importante das Terras da Coroa da Boêmia. Desenvolva essa fértil região agrícola como segundo centro cultural e administrativo do Império Boêmio."
 boh_internal_prosperity: "Prosperidade Interna"
 boh_internal_prosperity_desc: "O vidro da Boêmia, a prata de Kutná Hora, os mercados de Praga — juntos fazem da Boêmia a maior potência econômica da Europa Central."
 boh_jan_hus_question: "A Questão de Jan Hus"
 boh_suppress_heresy: "Suprima a Heresia"
 boh_suppress_heresy_desc: "A Boêmia mantém lealdade à Igreja de Roma. Reprimindo os hussitas como hereges e fazendo da fé católica a pedra angular do Estado, constrói-se uma forte aliança com o papa."
 boh_crusade_against_hussites: "Cruzada contra os Hussitas"
 boh_crusade_against_hussites_desc: "O papa proclamou uma cruzada contra os hussitas. Liderando o ataque à heresia, a Boêmia estabelece sua reputação de guardiã da Europa Central católica."
 boh_papal_champion: "Campeã do Papa"
 boh_papal_champion_desc: "Profunda confiança com o papado e fé católica inabalável — a Boêmia reconhecida como a mais forte guardiã da Europa Central católica."
 boh_hussite_reformation: "A Reforma Hussita"
 boh_hussite_reformation_desc: "“Embora queimada, a verdade brilha das chamas” — o espírito de Jan Hus enraíza-se na Boêmia. Os utraquistas (hussitas), simbolizados pelo cálice (kalich), tornam-se a fé da nação, conquistando independência religiosa de Roma."
 boh_wagenburg: "Os Guerreiros de Deus"
 boh_wagenburg_desc: "A tática de carroças de guerra (wagenburg), inventada por Jan Žižka — ligar carroças fortificadas numa formação defensiva — esmagou repetidas vezes a cavalaria pesada dos cruzados. O gênio militar da Boêmia floresce."
 boh_king_of_heretics: "O Rei dos Hereges"
 boh_king_of_heretics_desc: "Jorge de Poděbrady governou como “rei herege da Boêmia”, apesar da excomunhão papal. Mantenha o prestígio em meio ao isolamento diplomático europeu e prove ao mundo a legitimidade do Estado hussita."
 boh_hungarian_succession: "Sucessão Húngara"
 boh_hungarian_succession_desc: "A Boêmia e a Hungria formaram repetidas uniões pessoais por meio dos Luxemburgo e dos Jagelões. Traga o rico reino danubiano, com capital em Buda, para a suserania boêmia e reforce o domínio da Europa Central."
 boh_control_slovakia: "Controle a Eslováquia"
 boh_control_slovakia_desc: "A Eslováquia — pátria da Grande Morávia, onde vivem os povos irmãos tcheco e eslovaco. Assegurar essa terra fortalece as bases eslavas da Boêmia."
 boh_conquer_transylvania: "Conquiste a Transilvânia"
 boh_conquer_transylvania_desc: "A Transilvânia — a “terra além da floresta”, onde se misturam romenos, húngaros e alemães — serve de linha de frente do bastião cristão contra o Império Otomano. Controlá-la abre o caminho para os Bálcãs."
 boh_nicopolis_revenge: "A Vingança de Nicópolis"
 boh_nicopolis_revenge_desc: "Na batalha de Nicópolis, em 1396, o exército cruzado sob o comando de Sigismundo da Boêmia sofreu uma derrota catastrófica diante do Império Otomano. Chegou a hora de vingar essa humilhação — recupere Nicópolis e expulse os otomanos dos Bálcãs."
 boh_defend_against_turks: "Baluarte contra os Turcos"
 boh_defend_against_turks_desc: "O Império Otomano varre os Bálcãs e aproxima-se das portas da Europa Central. Reforce as defesas da Transilvânia e torne-se escudo da cristandade com um poderoso exército. A Boêmia é o “Antemurale Christianitatis” — o bastião da civilização cristã."
 boh_push_into_balkans: "Avance sobre os Bálcãs"
 boh_push_into_balkans_desc: "Vingue Nicópolis e avance para o sul como libertador da cristandade. Os eslavos, gregos e búlgaros dos Bálcãs são libertados sob o estandarte boêmio."
 boh_secure_silesia: "Assegure a Silésia"
 boh_secure_silesia_desc: "Toda a Silésia passa ao governo direto boêmio. Rica em ferro e carvão, essa terra torna-se o núcleo do império industrial boêmio."
 boh_polish_ambitions: "Ambições sobre a Polônia"
 boh_polish_ambitions_desc: "Tome Cracóvia e estabeleça as relações da Boêmia com o Reino da Polônia. A herança da dinastia Premislida pertence à Boêmia — a Polônia deve tornar-se vizinha sob suserania boêmia."
 boh_conquer_poland: "Conquiste a Polônia"
 boh_conquer_poland_desc: "As vastas planícies das terras polonesas passam ao controle boêmio. Do Vístula ao Oder, as terras eslavas unidas sob o estandarte do rei da Boêmia."
 boh_baltic_access: "Acesso ao Báltico"
 boh_baltic_access_desc: "Com Gdansk tomada, a Boêmia obtém acesso direto ao Mar Báltico. Transformada de Estado interior, a Boêmia participa agora também do comércio do norte."
 boh_bohemian_diet: "A Dieta da Boêmia"
 boh_bohemian_diet_desc: "A assembleia de estamentos boêmia (dieta territorial) — da qual participam nobreza, clero e burguesia — é uma instituição política. Fortalecê-la assenta a base do governo imperial centralizado."
 boh_absolute_monarchy: "Monarquia Absoluta"
 boh_absolute_monarchy_desc: "Monarquia absoluta estabelecida na Boêmia. Restringindo os privilégios da nobreza e consolidando por completo o poder real, a Boêmia se transforma num Estado centralizado moderno."
 boh_great_power_army: "O Exército da Grande Potência"
 boh_great_power_army_desc: "A tática wagenburg, o Exército Negro, a infantaria de elite — as inovações militares da Boêmia criam o mais forte exército da Europa Central. Estabeleça a superioridade militar da Boêmia com alta tradição militar e grande exército permanente."
 boh_dev_brno: "Desenvolva Brno"
 boh_dev_brno_desc: "Brno, capital da Morávia, prospera como cidade industrial e comercial na encruzilhada das rotas comerciais."
 boh_dev_wroclaw: "Desenvolva Breslávia"
 boh_dev_wroclaw_desc: "Breslávia, no Oder — coração da Silésia. Sua tradição comercial multicultural amplia a riqueza do Império Boêmio."
 boh_amber_road: "A Rota do Âmbar"
 boh_amber_road_desc: "A antiga Rota do Âmbar, que se estende do Báltico ao Mediterrâneo, atravessa a Boêmia. Controlando essa rota comercial, a Boêmia torna-se nó do comércio norte-sul."
 boh_dev_pest: "Desenvolva Peste"
 boh_dev_pest_desc: "Peste, do outro lado do Danúbio em relação a Buda — a maior cidade comercial da Hungria. Desenvolva-a como centro econômico do sul do Império Boêmio."
 boh_renaissance_court: "A Corte Renascentista"
 boh_renaissance_court_desc: "A Praga de Carlos IV foi centro do renascimento da Europa Central, onde se encontravam as culturas italiana, francesa e imperial. Artistas, eruditos e arquitetos reúnem-se na corte de Praga enquanto floresce uma era de ouro da cultura."
 boh_great_moravia_restored: "Grande Morávia Restaurada"
 boh_great_moravia_restored_desc: "Pela primeira vez desde a Grande Morávia do século IX, toda a Boêmia, a Morávia e a Silésia estão unidas. O sonho de Svatopluk e Rostislav renasce em nossos dias, e a Boêmia brilha como centro da civilização eslava."
 boh_central_european_power: "Potência da Europa Central"
 boh_central_european_power_desc: "Três pilares — a Grande Morávia restaurada, a prosperidade interna e a monarquia absoluta — juntam-se, e a Boêmia reina como a maior potência da Europa Central. Com 500+ províncias, renda de 500+ e prestígio de 80+, conquiste essa glória."
 boh_bohemian_commonwealth: "A Comunidade Boêmia"
 boh_bohemian_commonwealth_desc: "Praga, Viena, Berlim, Cracóvia, Buda — cinco grandes cidades da Europa Central unidas sob o estandarte boêmio. A coroa semeada por João, o Cego, em 1337 brilha agora como coroa imperial. “Bohemia non perit” — a Boêmia não perece — essas palavras gravadas para sempre na história."
 boh_krecy_legacy: "O Legado de Crécy"
 boh_krecy_legacy_desc: "Na batalha de Crécy, em 1346, o Rei Cego João I permaneceu no campo apesar da cegueira e morreu heroicamente. “Não vejo, mas ainda posso lutar” — esse espírito está inscrito na alma militar da Boêmia."
 boh_styria_carinthia: "Estíria e Caríntia"
 boh_styria_carinthia_desc: "A conquista da Estíria e da Caríntia, no sopé dos Alpes, estabelece as fronteiras meridionais do Império Boêmio. Essas terras ricas em minerais e agricultura sustentam a prosperidade do império."
 boh_kutna_hora_mint: "A Casa da Moeda de Kutná Hora"
 boh_kutna_hora_mint_desc: "O groschen de Praga — cunhado com a prata de Kutná Hora — foi a moeda mais confiável da Europa Central no século XIV. Estabeleça a supremacia monetária da Boêmia por meio da mineração maciça de prata."
 boh_gothic_architecture: "Cidade da Arquitetura Gótica"
 boh_gothic_architecture_desc: "A Catedral de São Vito, a Ponte Carlos, a Praça da Cidade Velha — a magnífica arquitetura gótica construída por Carlos IV transformou Praga na “Cidade Dourada”. Eleve o desenvolvimento de Praga e antecipe essa glória arquitetônica."
 boh_bohemian_trade_network: "A Rede Comercial Boêmia"
 boh_bohemian_trade_network_desc: "Uma rede comercial centrada em Praga, ligando Viena, Breslávia, Cracóvia e Nuremberga, sustenta a vantagem comercial da Boêmia."
 boh_compactata: "Os Compactata de Praga"
 boh_compactata_desc: "Os Compactata de 1436 obrigaram a Igreja Católica a reconhecer, como concessão, a comunhão utraquista sob as duas espécies. O caminho moderado utraquista traz estabilidade religiosa à Boêmia."
 boh_utraquist_church: "A Igreja Utraquista"
 boh_utraquist_church_desc: "“Sub utraque specie” (sob as duas espécies) — a igreja utraquista, que dá aos comungantes tanto o pão quanto o vinho, estabelecida como religião de Estado da Boêmia."
 boh_protestant_alliance: "A Aliança Protestante"
 boh_protestant_alliance_desc: "A tradição hussita da Boêmia torna-se precursora da Reforma protestante. Por meio de alianças com luteranos e calvinistas, a Boêmia é reconhecida como pilar do mundo protestante."
 boh_black_army: "O Exército Negro"
 boh_black_army_desc: "O Exército Negro, organizado pelo rei Matias Corvino — um dos primeiros exércitos profissionais permanentes da Europa medieval. Quando essa força de elite luta sob o estandarte boêmio, nada na Europa Central pode se opor a ela."
 boh_dev_berlin: "Desenvolva Berlim"
 boh_dev_berlin_desc: "A pequena cidade de Berlim, em Brandemburgo, cresce como nó administrativo do norte do Império Boêmio."
 boh_dev_konigsberg: "Desenvolva Königsberg"
 boh_dev_konigsberg_desc: "Königsberg (Castelo Real), construída por Premislau Otocar II, volta à Boêmia e torna-se nó do comércio báltico."
 boh_great_king: "O Grande Rei"
 boh_great_king_desc: "Alto prestígio, grande legitimidade, rica renda — o nome do rei da Boêmia, um dos maiores governantes da história da Europa Central, ressoa por toda a Europa, superando até a glória de Carlos IV."
 boh_dev_olomouc: "Olomouc Floresce"
 boh_dev_olomouc_desc: "Olomouc, antiga cidade do saber e sede episcopal da Morávia, brilha como nó da cultura renascentista do norte."
 boh_upper_austria: "Alta Áustria"
 boh_upper_austria_desc: "A Alta Áustria, ao longo do alto Danúbio, incorporada ao Império Boêmio, estabelece a base para novo avanço rumo ao sul."
 boh_carpathian_defense: "Defesa dos Cárpatos"
 boh_carpathian_defense_desc: "Uma rede de fortalezas ao longo dos Montes Cárpatos estabelece uma sólida linha defensiva da fronteira oriental do Império Boêmio — escudo contra o Império Otomano, os tártaros e outras ameaças do leste."
 boh_events.20.t: "Os Habsburgo Esmagados — Domínio Boêmio"
 boh_events.20.d: "Viena caiu, e o orgulho dos Habsburgo está quebrado. “O domínio dos Habsburgo sobre a Europa Central, que durava desde os tempos de Rodolfo, chegou ao fim” — essas palavras ecoam na corte de Praga. O rei da Boêmia é agora o verdadeiro senhor da Europa Central. Os historiadores escreverão depois: “A casa de Luxemburgo era a verdadeira herdeira do Império”."
 boh_events.20.a: "Glória à Boêmia! A era dos Habsburgo acabou!"
 boh_events.50.t: "Grande Morávia Restaurada"
 boh_events.50.d: "Boêmia, Morávia e Silésia unidas. Quatrocentos anos depois do colapso da Grande Morávia, construída por Svatopluk, esse legado renasce em nossos dias. Na corte de Praga, o rei da Boêmia proclama o título de “Rex Slavorum” — Rei dos Eslavos."
 boh_events.50.a: "Glória à Grande Morávia! Glória à unidade eslava!"
 boh_events.99.t: "Nasce a Comunidade Boêmia"
 boh_events.99.d: "Praga, Viena, Berlim, Cracóvia, Buda — cinco grandes cidades da Europa Central, unidas sob o estandarte boêmio. A coroa semeada por João, o Cego, em 1337 brilha agora como coroa imperial. Enquanto as agulhas das catedrais góticas se erguem sobre o céu de Praga, as palavras “Bohemia non perit” — a Boêmia não perece — estão gravadas para sempre na história."
 boh_events.99.a: "Glória à Comunidade Boêmia! Que o senhor da Europa Central dure para sempre!"
 STATIC_MODIFIER_NAME_boh_blind_king_mod: "O Legado do Rei Cego"
 STATIC_MODIFIER_DESC_boh_blind_king_mod: "“Não vejo, mas ainda posso lutar” — o espírito de João I, o Rei Cego, assentou a pedra angular do Reino da Boêmia."
 STATIC_MODIFIER_NAME_boh_imperial_power_mod: "O Leão do Império"
 STATIC_MODIFIER_DESC_boh_imperial_power_mod: "A Boêmia está à frente como o mais forte eleitor do Império."
 STATIC_MODIFIER_NAME_boh_habsburg_rival_mod: "Desafio aos Habsburgo"
 STATIC_MODIFIER_DESC_boh_habsburg_rival_mod: "A rivalidade entre a casa de Luxemburgo e os Habsburgo pelo domínio imperial se intensifica."
 STATIC_MODIFIER_NAME_boh_silesia_mod: "O Ferro da Silésia"
 STATIC_MODIFIER_DESC_boh_silesia_mod: "O abundante minério de ferro da Silésia sustenta a base da indústria de defesa da Boêmia."
 STATIC_MODIFIER_NAME_boh_hre_master_mod: "Domínio do Sacro Império Romano"
 STATIC_MODIFIER_DESC_boh_hre_master_mod: "A Boêmia governa como líder incontestada do Sacro Império Romano, e nenhum príncipe ousa escrever a Praga senão de cabeça inclinada."
 STATIC_MODIFIER_NAME_boh_prague_capital_mod: "Praga, a Cidade das Cem Torres"
 STATIC_MODIFIER_DESC_boh_prague_capital_mod: "Praga, no Moldava, desenvolvida como a maior cidade da Europa Central."
 STATIC_MODIFIER_NAME_boh_charles_university_mod: "Universidade Carolina"
 STATIC_MODIFIER_DESC_boh_charles_university_mod: "A primeira universidade da Europa Central abre-se em Praga — brilhando como centro de saber e reforma."
 STATIC_MODIFIER_NAME_boh_golden_bull_mod: "A Bula de Ouro"
 STATIC_MODIFIER_DESC_boh_golden_bull_mod: "O status eleitoral do rei da Boêmia estabelecido pela Bula de Ouro."
 STATIC_MODIFIER_NAME_boh_glass_industry_mod: "O Vidro da Boêmia"
 STATIC_MODIFIER_DESC_boh_glass_industry_mod: "O cristal boêmio estabelece sua fama como a melhor maestria da Europa."
 STATIC_MODIFIER_NAME_boh_kutna_hora_mod: "A Prata de Kutná Hora"
 STATIC_MODIFIER_DESC_boh_kutna_hora_mod: "A maior mina de prata da Europa Central sustenta a era de ouro econômica da Boêmia. O groschen de Praga circula amplamente."
 STATIC_MODIFIER_NAME_boh_moravia_mod: "Integração da Morávia"
 STATIC_MODIFIER_DESC_boh_moravia_mod: "A Morávia, centrada em Brno e Olomouc, incorporada ao Império Boêmio."
 STATIC_MODIFIER_NAME_boh_prosperity_mod: "Prosperidade Interna"
 STATIC_MODIFIER_DESC_boh_prosperity_mod: "O vidro da Boêmia, a prata e os mercados juntam-se para criar a maior potência econômica da Europa Central."
 STATIC_MODIFIER_NAME_boh_catholic_reform_mod: "Fé Católica Inabalável"
 STATIC_MODIFIER_DESC_boh_catholic_reform_mod: "A Boêmia, mantendo a lealdade à Igreja de Roma, é reconhecida como líder da civilização católica da Europa Central."
 STATIC_MODIFIER_NAME_boh_crusader_glory_mod: "Glória do Cruzado"
 STATIC_MODIFIER_DESC_boh_crusader_glory_mod: "Liderando a cruzada anti-hussita, a Boêmia conquista a reputação de defensora da cristandade."
 STATIC_MODIFIER_NAME_boh_papal_ally_mod: "Escudo do Papa"
 STATIC_MODIFIER_DESC_boh_papal_ally_mod: "Profunda confiança com o papado faz da Boêmia a líder da Europa Central católica."
 STATIC_MODIFIER_NAME_boh_hussite_church_mod: "A Igreja Hussita"
 STATIC_MODIFIER_DESC_boh_hussite_church_mod: "O espírito de Jan Hus enraíza-se na Boêmia — estabelecido um caminho independente de reforma religiosa."
 STATIC_MODIFIER_NAME_boh_wagenburg_mod: "Tática Wagenburg"
 STATIC_MODIFIER_DESC_boh_wagenburg_mod: "A tática revolucionária de Jan Žižka instala-se no exército boêmio. As carroças de guerra esmagam a cavalaria dos cruzados."
 STATIC_MODIFIER_NAME_boh_king_heretic_mod: "Prestígio do Rei dos Hereges"
 STATIC_MODIFIER_DESC_boh_king_heretic_mod: "Mantendo o prestígio apesar da excomunhão papal, o rei boêmio supera o isolamento diplomático."
 STATIC_MODIFIER_NAME_boh_slovakia_mod: "Integração da Eslováquia"
 STATIC_MODIFIER_DESC_boh_slovakia_mod: "O estandarte do leão da Boêmia tremula agora sobre as colinas da Eslováquia, pátria da Grande Morávia."
 STATIC_MODIFIER_NAME_boh_transylvania_mod: "A Transilvânia"
 STATIC_MODIFIER_DESC_boh_transylvania_mod: "A terra além da floresta passa ao governo boêmio — estabelecida a cabeça de ponte para a expansão balcânica."
 STATIC_MODIFIER_NAME_boh_nicopolis_glory_mod: "A Vingança de Nicópolis"
 STATIC_MODIFIER_DESC_boh_nicopolis_glory_mod: "A humilhação de 1396 vingada. A Boêmia torna-se vanguarda do contra-ataque ao Império Otomano."
 STATIC_MODIFIER_NAME_boh_antemurale_mod: "Escudo da Cristandade"
 STATIC_MODIFIER_DESC_boh_antemurale_mod: "As fortalezas da Transilvânia tornam-se o escudo que detém o avanço otomano."
 STATIC_MODIFIER_NAME_boh_balkan_conqueror_mod: "Libertador dos Bálcãs"
 STATIC_MODIFIER_DESC_boh_balkan_conqueror_mod: "A Boêmia avança para o sul como libertadora dos eslavos e cristãos dos Bálcãs."
 STATIC_MODIFIER_NAME_boh_silesia_secured_mod: "Silésia Plenamente Incorporada"
 STATIC_MODIFIER_DESC_boh_silesia_secured_mod: "Toda a Silésia sob domínio boêmio direto — estabelecida a base da indústria do ferro e do carvão."
 STATIC_MODIFIER_NAME_boh_poland_subjugated_mod: "Polônia Subjugada"
 STATIC_MODIFIER_DESC_boh_poland_subjugated_mod: "As planícies polonesas passam ao controle boêmio — estabelecida a base para a expansão oriental."
 STATIC_MODIFIER_NAME_boh_baltic_access_mod: "Acesso ao Báltico"
 STATIC_MODIFIER_DESC_boh_baltic_access_mod: "Com Gdansk tomada, a Boêmia pode participar diretamente do comércio báltico."
 STATIC_MODIFIER_NAME_boh_diet_mod: "A Dieta da Boêmia"
 STATIC_MODIFIER_DESC_boh_diet_mod: "Na câmara da dieta territorial, os delegados dos estamentos escutam agora com atenção a política do imperador."
 STATIC_MODIFIER_NAME_boh_absolutism_mod: "Monarquia Absoluta"
 STATIC_MODIFIER_DESC_boh_absolutism_mod: "Monarquia absoluta estabelecida na Boêmia — transformação num Estado centralizado moderno."
 STATIC_MODIFIER_NAME_boh_military_power_mod: "Exército da Grande Potência"
 STATIC_MODIFIER_DESC_boh_military_power_mod: "O exército de elite da Boêmia, herdeiro da tradição wagenburg e do Exército Negro, possui o maior poderio militar da Europa Central."
 STATIC_MODIFIER_NAME_boh_brno_mod: "Brno Prospera"
 STATIC_MODIFIER_DESC_boh_brno_mod: "A capital da Morávia, Brno, desenvolve-se como centro de comércio e indústria."
 STATIC_MODIFIER_NAME_boh_wroclaw_mod: "Breslávia Prospera"
 STATIC_MODIFIER_DESC_boh_wroclaw_mod: "Breslávia, no Oder, funciona como coração da economia silesiana."
 STATIC_MODIFIER_NAME_boh_amber_road_mod: "A Rota do Âmbar"
 STATIC_MODIFIER_DESC_boh_amber_road_mod: "A Boêmia, controlando a antiga Rota do Âmbar do Báltico ao Mediterrâneo, torna-se nó do comércio norte-sul."
 STATIC_MODIFIER_NAME_boh_pest_mod: "Peste Prospera"
 STATIC_MODIFIER_DESC_boh_pest_mod: "Peste, no Danúbio, desenvolvida como centro comercial do sul do Império Boêmio."
 STATIC_MODIFIER_NAME_boh_renaissance_mod: "A Corte Renascentista"
 STATIC_MODIFIER_DESC_boh_renaissance_mod: "Praga torna-se centro do renascimento da Europa Central, onde se encontram as culturas italiana, francesa e centro-europeia."
 STATIC_MODIFIER_NAME_boh_great_moravia_mod: "Grande Morávia Restaurada"
 STATIC_MODIFIER_DESC_boh_great_moravia_mod: "Pela primeira vez desde Svatopluk, Boêmia, Morávia e Silésia unidas — o centro da civilização eslava renasce."
 STATIC_MODIFIER_NAME_boh_central_power_mod: "Potência da Europa Central"
 STATIC_MODIFIER_DESC_boh_central_power_mod: "A Boêmia governa como a maior potência da Europa Central, estabelecendo superioridade em império, cultura e força militar."
 STATIC_MODIFIER_NAME_boh_krecy_glory_mod: "O Legado de Crécy"
 STATIC_MODIFIER_DESC_boh_krecy_glory_mod: "A morte heroica do Rei Cego é transmitida como orgulho militar da Boêmia."
 STATIC_MODIFIER_NAME_boh_alpine_lands_mod: "Terras Alpinas"
 STATIC_MODIFIER_DESC_boh_alpine_lands_mod: "Guarnições com a bandeira boêmia guardam agora as passagens montanhosas da Estíria e da Caríntia."
 STATIC_MODIFIER_NAME_boh_silver_currency_mod: "O Groschen de Praga"
 STATIC_MODIFIER_DESC_boh_silver_currency_mod: "O groschen de Praga, cunhado com a prata de Kutná Hora, torna-se a maior moeda internacional da Europa Central."
 STATIC_MODIFIER_NAME_boh_golden_prague_mod: "A Praga Dourada"
 STATIC_MODIFIER_DESC_boh_golden_prague_mod: "A Catedral de São Vito, a Ponte Carlos, as Cem Torres — Praga torna-se o maior centro cultural da Europa Central como “Cidade Dourada”."
 STATIC_MODIFIER_NAME_boh_trade_network_mod: "A Rede Comercial Boêmia"
 STATIC_MODIFIER_DESC_boh_trade_network_mod: "A rede comercial da Europa Central, centrada em Praga, sustenta a vantagem comercial da Boêmia."
 STATIC_MODIFIER_NAME_boh_compactata_mod: "Os Compactata de Praga"
 STATIC_MODIFIER_DESC_boh_compactata_mod: "Reconciliação entre católicos e utraquistas alcançada — estabilidade religiosa restaurada à Boêmia."
 STATIC_MODIFIER_NAME_boh_utraquist_mod: "A Igreja Utraquista"
 STATIC_MODIFIER_DESC_boh_utraquist_mod: "A igreja da comunhão sob as duas espécies estabelecida como religião de Estado da Boêmia."
 STATIC_MODIFIER_NAME_boh_protestant_alliance_mod: "A Aliança Protestante"
 STATIC_MODIFIER_DESC_boh_protestant_alliance_mod: "A Boêmia, com sua tradição hussita, é reconhecida como pilar do mundo protestante."
 STATIC_MODIFIER_NAME_boh_black_army_mod: "O Exército Negro"
 STATIC_MODIFIER_DESC_boh_black_army_mod: "O espírito do Exército Negro instala-se na Boêmia — o mais forte exército profissional da Europa Central concluído."
 STATIC_MODIFIER_NAME_boh_berlin_mod: "Berlim Desenvolvida"
 STATIC_MODIFIER_DESC_boh_berlin_mod: "A pequena cidade nortista de Berlim cresce como nó administrativo do norte do Império Boêmio."
 STATIC_MODIFIER_NAME_boh_konigsberg_mod: "Königsberg Recuperada"
 STATIC_MODIFIER_DESC_boh_konigsberg_mod: "Königsberg, construída por Premislau Otocar II, volta à Boêmia e torna-se nó do comércio báltico."
 STATIC_MODIFIER_NAME_boh_great_king_mod: "O Grande Rei"
 STATIC_MODIFIER_DESC_boh_great_king_mod: "O nome do rei da Boêmia está gravado na história da Europa Central como o do seu maior governante, superando até Carlos IV."
 STATIC_MODIFIER_NAME_boh_fortress_europe_mod: "Fortaleza da Europa"
 STATIC_MODIFIER_DESC_boh_fortress_europe_mod: "Uma rede de fortalezas dos Alpes aos Cárpatos detém o avanço otomano."
 STATIC_MODIFIER_NAME_boh_olomouc_mod: "Olomouc Floresce"
 STATIC_MODIFIER_DESC_boh_olomouc_mod: "Olomouc, centro do saber e da religião da Morávia, brilha como nó da cultura renascentista do norte."
 STATIC_MODIFIER_NAME_boh_upper_austria_mod: "Alta Áustria"
 STATIC_MODIFIER_DESC_boh_upper_austria_mod: "Sobre as muralhas da Alta Áustria, rio acima no Danúbio, tremula o estandarte do Império Boêmio, e os caminhos para o sul estão abertos."
 STATIC_MODIFIER_NAME_boh_carpathian_mod: "Defesa dos Cárpatos"
 STATIC_MODIFIER_DESC_boh_carpathian_mod: "Uma rede de fortalezas ao longo dos Cárpatos torna-se o escudo que protege a fronteira oriental do Império Boêmio."
 STATIC_MODIFIER_NAME_boh_bohemian_commonwealth_final_mod: "Glória da Comunidade Boêmia"
 STATIC_MODIFIER_DESC_boh_bohemian_commonwealth_final_mod: "A Comunidade Boêmia, que controla as cinco grandes cidades da Europa Central, concluída. “Bohemia non perit” — essas palavras gravadas para sempre na história."
 STATIC_MODIFIER_NAME_boh_habsburg_crushed_mod: "Os Habsburgo Esmagados"
 STATIC_MODIFIER_DESC_boh_habsburg_crushed_mod: "Viena caiu, e o domínio dos Habsburgo sobre a Europa Central chegou ao fim. A Boêmia ergue-se como verdadeira senhora."
 boh_fortress_of_europe: "Fortaleza da Europa"
 boh_fortress_of_europe_desc: "Uma rede de fortalezas que se estende dos Alpes aos Cárpatos detém o avanço otomano. A Boêmia atua como “Escudo da Europa”."
 boh_dev_plzen: "Desenvolva Pilsen"
 boh_dev_plzen_desc: "Pilsen — cidade-chave da Boêmia ocidental e futura pátria da cerveja Pilsner, famosa no mundo todo. Situada na confluência do Radbuza e do Mže, o desenvolvimento dessa cidade sustenta o comércio e a indústria em toda a Boêmia ocidental."
 boh_dev_cheb: "Desenvolva Cheb"
 boh_dev_cheb_desc: "Cheb, antiga cidade às margens do Ohře, é a porta imperial onde se encontram as culturas alemã e tcheca. Desenvolva essa cidade, que domina as rotas comerciais com o Sacro Império Romano, como cabeça de ponte da diplomacia ocidental."
 boh_dev_kutna_hora_city: "Desenvolva Kutná Hora"
 boh_dev_kutna_hora_city_desc: "Brilhando com a riqueza da prata, Kutná Hora tornou-se a segunda cidade da Boêmia depois de Praga. Com a Catedral de Santa Bárbara em construção, desenvolva essa cidade numa verdadeira metrópole e estabeleça-a como coração econômico da Boêmia."
 boh_bohemian_agriculture: "A Agricultura Boêmia"
 boh_bohemian_agriculture_desc: "As planícies boêmias ao longo do Elba formam uma rica zona agrícola. Trigo, cevada e centeio amadurecem com abundância, e o desenvolvimento das fazendas eleva muito a produtividade. O suprimento estável de alimentos sustenta o crescimento populacional em todo o Império Boêmio."
 boh_moravian_wine: "O Vinho da Morávia"
 boh_moravian_wine_desc: "A Morávia meridional, em torno de Znojmo, é a maior região vinícola da Boêmia. O clima quente e o solo calcário produzem vinhos moravos, apreciados até na corte austríaca de Viena. Seu sabor rico simboliza o refinamento cultural do Império Boêmio."
 boh_jihlava_silver: "As Minas de Prata de Jihlava"
 boh_jihlava_silver_desc: "Jihlava, nas terras altas boêmio-moravas, é uma cidade mineira que rivaliza com Kutná Hora. Pôr essas minas de prata em plena atividade amplia ainda mais a mineração de prata da Boêmia e aumenta a cunhagem de groschen de Praga."
 boh_opava_iron: "A Indústria do Ferro de Opava"
 boh_opava_iron_desc: "Opava, capital do ducado silesiano, é conhecida por seus depósitos de minério de ferro. Desenvolver a indústria do aço dessa cidade reforça ainda mais a base industrial da Silésia e melhora bastante o equipamento militar boêmio."
 boh_dev_litomerice: "Desenvolva Litoměřice"
 boh_dev_litomerice_desc: "Litoměřice, no Elba, é uma importante cidade comercial da Boêmia setentrional. Desenvolvê-la como nó de rotas comerciais, que chegam até Hamburgo pelo Elba, anima o comércio com o norte da Alemanha."
 boh_silesian_mines: "As Minas da Silésia"
 boh_silesian_mines_desc: "Sob o solo da Silésia jazem ferro e carvão coqueificável que sustentarão as futuras revoluções industriais. Estabeleça um sistema de mineração em escala plena e eleve bastante a produtividade industrial do Império Boêmio."
 boh_silesian_mines_unlock_tt: "A decisão “Desenvolver as minas da Silésia” está agora disponível."
 boh_silesian_mining_decision.title: "Desenvolver as minas da Silésia"
 boh_silesian_mining_decision.desc: "Os distritos mineiros da Silésia são vastos, e a Coroa não pode abri-los todos de uma vez. Cada investimento em poços, fundições e estradas leva mais um distrito à produção plena, e a obra pode ser renovada a cada década."
 boh_silesian_mining_decision.a: "Investir em um novo distrito mineiro."
 boh_bohemian_cloth: "A Indústria Têxtil Boêmia"
 boh_bohemian_cloth_desc: "Ao lado do vidro boêmio, a indústria têxtil e de tecidos da Boêmia estabelece sua reputação europeia. O tecido da Boêmia setentrional, junto às rotas comerciais de Litoměřice, faz da Boêmia um centro da indústria têxtil."
 STATIC_MODIFIER_NAME_boh_plzen_mod: "Pilsen Desenvolvida"
 STATIC_MODIFIER_DESC_boh_plzen_mod: "Pilsen, cidade-chave da Boêmia ocidental, desenvolvida como centro de comércio e indústria."
 STATIC_MODIFIER_NAME_boh_cheb_mod: "Cheb Desenvolvida"
 STATIC_MODIFIER_DESC_boh_cheb_mod: "Cheb, o portão ocidental, funciona como nó comercial com o Império."
 STATIC_MODIFIER_NAME_boh_kutna_hora_city_mod: "Cidade de Kutná Hora"
 STATIC_MODIFIER_DESC_boh_kutna_hora_city_mod: "A segunda cidade da Boêmia, rica em prata, desenvolveu-se numa verdadeira metrópole."
 STATIC_MODIFIER_NAME_boh_agriculture_mod: "Agricultura Boêmia"
 STATIC_MODIFIER_DESC_boh_agriculture_mod: "Zona agrícola fértil ao longo do Elba desenvolvida — suprimento estável de alimentos assegurado."
 STATIC_MODIFIER_NAME_boh_znojmo_mod: "Vinhedos de Znojmo"
 STATIC_MODIFIER_DESC_boh_znojmo_mod: "A viticultura da Morávia meridional amadurece, produzindo vinho de alta qualidade."
 STATIC_MODIFIER_NAME_boh_moravian_wine_mod: "Vinho da Morávia"
 STATIC_MODIFIER_DESC_boh_moravian_wine_mod: "O vinho morávio torna-se mercadoria apreciada até na corte austríaca de Viena."
 STATIC_MODIFIER_NAME_boh_jihlava_mod: "Minas de Prata de Jihlava"
 STATIC_MODIFIER_DESC_boh_jihlava_mod: "As minas de prata de Jihlava operam a plena capacidade — produtora de prata que rivaliza com Kutná Hora."
 STATIC_MODIFIER_NAME_boh_opava_mod: "Indústria do Aço de Opava"
 STATIC_MODIFIER_DESC_boh_opava_mod: "Indústria do aço desenvolvida em Opava, capital do ducado silesiano."
 STATIC_MODIFIER_NAME_boh_litomerice_mod: "Nó Comercial de Litoměřice"
 STATIC_MODIFIER_DESC_boh_litomerice_mod: "Litoměřice, no Elba, desenvolve-se como nó de rotas comerciais com o norte da Alemanha."
 STATIC_MODIFIER_NAME_boh_silesian_mines_mod: "Minas da Silésia"
 STATIC_MODIFIER_DESC_boh_silesian_mines_mod: "As ricas minas de ferro e carvão da Silésia operam a plena capacidade — o poder industrial da Boêmia aumentou muito."
 STATIC_MODIFIER_NAME_boh_cloth_industry_mod: "Indústria Têxtil Boêmia"
 STATIC_MODIFIER_DESC_boh_cloth_industry_mod: "A indústria têxtil e de tecidos da Boêmia, ao lado do vidro, estabelecida como principal mercadoria de exportação."
 boh_sugar_beet: "Cultivo da Beterraba Açucareira"
 boh_sugar_beet_desc: "A era das revoluções — as inovações científicas e industriais transformam a agricultura boêmia. A beterraba açucareira é uma cultura ideal para o clima frio da Boêmia. A produção de açúcar, outrora monopólio da cana, passa também a vir dos campos boêmios. As novas tecnologias agrícolas da Revolução Industrial modernizam a agricultura boêmia."
 boh_porcelain_industry: "A Indústria da Porcelana Boêmia"
 boh_porcelain_industry_desc: "A era das revoluções — o caulim (argila de porcelana) da Boêmia ocidental é o melhor material de porcelana da Europa. A porcelana boêmia, nascida da argila branca em torno de Karlovy Vary (Carlsbad), rivaliza com a refinada maestria da porcelana de Meissen, em Dresden, adornando cortes de toda a Europa."
 STATIC_MODIFIER_NAME_boh_porcelain_mod: "Porcelana Boêmia"
 STATIC_MODIFIER_DESC_boh_porcelain_mod: "A porcelana do caulim da Boêmia ocidental torna-se artigo de luxo, adornando as cortes europeias."
 boh_jan_hus_question_desc: "O espírito reformador de Jan Hus se espalha por toda a Boêmia. A memória de sua queima no concílio de Constança (1415) está gravada fundo nos corações dos tchecos, e a ira contra a Igreja de Roma atinge o auge. Quando a questão da fé já não pode ser evitada, a Boêmia deve definir seu próprio caminho."
 boh_events.60.t: "Cultivo da Beterraba Açucareira — Aurora de uma Nova Indústria"
 boh_events.60.d: "Ano de 1737 — a tecnologia de produção de açúcar a partir da beterraba (Beta vulgaris) foi desenvolvida em toda a Europa. Os campos férteis da Boêmia são ideais para o cultivo dessa nova planta. Que local receberá a primeira fazenda de beterraba açucareira — Poděbrady ou Hradec Králové?"
 boh_events.60.a: "Plantar beterraba açucareira nos campos de Poděbrady (pátria do “rei herege” Jorge)"
 boh_events.60.b: "Plantar beterraba açucareira nos campos de Hradec Králové (as férteis terras do Elba)"
 STATIC_MODIFIER_NAME_boh_jan_hus_mod: "A Verdade de Hus"
 STATIC_MODIFIER_DESC_boh_jan_hus_mod: "Cópias dos sermões de Jan Hus passam de mão em mão até nas casas de camponeses da Boêmia."
 STATIC_MODIFIER_NAME_boh_sugar_beet_choice_mod: "Fazenda de Beterraba Açucareira"
 STATIC_MODIFIER_DESC_boh_sugar_beet_choice_mod: "O cultivo da beterraba amadurece — o açúcar boêmio é exportado para os mercados europeus."
 boh_conquer_silesia: "Incorpore a Silésia"
 boh_conquer_silesia_desc: "A Silésia é parte das Terras da Coroa da Boêmia. Incorporar essa região, rica em minério de ferro e prata, reforça muito a base industrial e militar da Boêmia."
 boh_events.50.b: "Não, manter as cores tradicionais da Boêmia — não há necessidade de mudança"
 boh_urban_privileges: "Privilégios Urbanos Boêmios"
 boh_urban_privileges_desc: "Com Brno e Olomouc desenvolvidas, a Boêmia estabeleceu um sistema de conceder privilégios especiais às suas cidades. As cidades feudais reforçam o controle da nobreza, suprimindo a libertação dos camponeses; as cidades eclesiásticas promovem a conversão religiosa."
 STATIC_MODIFIER_NAME_boh_ecclesiastical_city_rights: "Direitos de Cidade Eclesiástica"
 STATIC_MODIFIER_DESC_boh_ecclesiastical_city_rights: "Nesta cidade, onde os sinos da catedral marcam cada hora do dia, até as regras do mercado se submetem às horas de oração."
 boh_urban_privileges_unlock_tt: "Desbloqueia os privilégios urbanos Cidade feudal (Poddanská nebo vrchnostenská města) e Cidade eclesiástica (Biskupská nebo klášterní města)."
