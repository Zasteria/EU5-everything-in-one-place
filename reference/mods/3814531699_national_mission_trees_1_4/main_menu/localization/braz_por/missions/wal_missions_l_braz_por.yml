l_braz_por:
 wal_wallachia_mission_pack: "A Ordem do Dragão — Guardião do Danúbio"
 wal_wallachia_mission_pack_DESCRIPTION:0 "A Valáquia, encravada entre os Cárpatos e o Danúbio. Subjugue a nobreza boiarda e una os principados romenos, com a Moldávia e a Transilvânia, ou erga o estandarte da Ordem do Dragão e declare guerra ao Império Otomano para construir o império danubiano."
 wal_wallachia_mission_pack_CRITERIA_DESCRIPTION:0 "Fortaleça o voivodato, una os principados romenos e derrote o Império Otomano para completar o império danubiano."
 wal_wallachia_mission_pack_BUTTON_TOOLTIP:0 "Continue a vontade do Empalador e torne-se guardião do Danúbio."
 wal_wallachia_mission_pack_BUTTON_DETAILS:0 "“Somos filhos do Dragão” — lobos dos Cárpatos, erguei a cruz!"
 wal_voivode_beginnings: "A Aurora do Voivodato"
 wal_voivode_beginnings_desc: "Em 1330, Basarab I repeliu o rei da Hungria na batalha de Posada — herde seu espírito de independência e assente os fundamentos do novo principado entre os Cárpatos e o Danúbio."
 wal_voivode_authority: "A Autoridade do Voivoda"
 wal_voivode_authority_desc: "O trono do voivoda, eleito por aclamação da nobreza boiarda — assegure essa autoridade e evite o caos da sucessão disputada."
 wal_boyar_council: "O Conselho dos Boiardos"
 wal_boyar_council_desc: "A assembleia dos grandes boiardos proprietários — sem seu apoio, a Valáquia não pode ser governada. Estabilize as relações com o conselho."
 wal_found_bucharest: "Funde Bucareste"
 wal_found_bucharest_desc: "Giurgiu, perto do Danúbio — onde o voivoda mantinha sua corte de verão. Desenvolva esse lugar como “Bucureşti”, bastião da defesa e do comércio do sul."
 wal_targoviste_dev: "Desenvolva Târgovişte"
 wal_targoviste_dev_desc: "Târgovişte, antiga capital construída ao pé dos Cárpatos, sede de gerações de voivodas — traga a essa cidade nova prosperidade."
 wal_fortify_carpathians: "Fortifique os Cárpatos"
 wal_fortify_carpathians_desc: "Os Montes Cárpatos, que se estendem de sul a norte — sobre essa muralha natural, imponha fortalezas feitas pelo homem, construindo uma linha de defesa que nenhum invasor rompa."
 wal_orthodox_church: "Proteja a Igreja Ortodoxa"
 wal_orthodox_church_desc: "A Igreja Ortodoxa, herdeira da fé bizantina — assuma a liderança de seu patriarcado autocéfalo e dê legitimidade religiosa à autoridade do voivoda."
 wal_dregatori: "Nomeie os Dregatori"
 wal_dregatori_desc: "A tirania dos nobres hereditários é inimiga do Estado. Nomeie “dregatori” — funcionários escolhidos por habilidade, e não por nascimento — e construa uma administração leal à coroa."
 wal_unite_voivodes: "Una os Voivodas"
 wal_unite_voivodes_desc: "Valáquia e Moldávia — dois principados romenos e, no entanto, ainda divididos, sua rivalidade serve apenas a nossos inimigos. Qualquer potência que detenha uma cabeça de ponte na Moldávia pode agora reivindicar legitimamente toda essa terra."
 wal_subdue_moldavia: "Subjugue a Moldávia"
 wal_subdue_moldavia_desc: "A glória de Estêvão, o Grande, pertence agora ao passado — traga o Principado da Moldávia ao governo valáquio e assente a pedra angular da unidade romena."
 wal_conquer_transylvania: "Conquiste a Transilvânia"
 wal_conquer_transylvania_desc: "A Transilvânia, há muito governada pelos reis da Hungria e seus sucessores — traga essa terra ao domínio da Valáquia e ponha fim à ingerência estrangeira."
 wal_szekely_land: "A Terra dos Székely"
 wal_szekely_land_desc: "Os Székely, povo de guerreiros da Transilvânia oriental — respeite sua autonomia e tradição guerreira e faça de sua bravura a força da Valáquia."
 wal_saxon_towns: "Incorpore as Cidades Saxãs"
 wal_saxon_towns_desc: "Brașov, Sibiu e outras cidades saxãs da Transilvânia — faça dessas cidades, que prosperam desde os tempos medievais, um pilar da economia do reino."
 wal_secure_danube: "Assegure o Danúbio"
 wal_secure_danube_desc: "O grande rio Danúbio, que divide os Bálcãs dos Cárpatos — assegure suas margens como linha vital da defesa e do comércio do sul."
 wal_carpathian_hegemony: "Hegemonia Cárpata Concluída"
 wal_carpathian_hegemony_desc: "Chegou a hora de toda a terra entre os Cárpatos e o Danúbio submeter-se à autoridade do voivoda."
 wal_romanian_unity: "Unidade Romena Concluída"
 wal_romanian_unity_desc: "Valáquia, Moldávia, Transilvânia — una enfim as terras há muito divididas do povo romeno sob uma só coroa."
 wal_order_of_dragon_founding: "Junte-se à Ordem do Dragão"
 wal_order_of_dragon_founding_desc: "O imperador do Sacro Império Romano, Sigismundo, funda a Ordem do Dragão no ideal da cruzada contra os otomanos — que nosso próprio governante ocupe um lugar entre essa ilustre irmandade."
 wal_impale_the_sultan: "Empale o Sultão"
 wal_impale_the_sultan_desc: "O sultão julga-se seguro, escondendo-se atrás de suas muralhas e legiões. No campo de batalha contra os exércitos do islã, que aprenda, na própria carne, que ninguém pode esconder-se do juízo de Deus."
 wal_drive_out_turks: "Expulse os Turcos"
 wal_drive_out_turks_desc: "Chegou a hora de libertar os povos grego e búlgaro da opressão. Empurre os invasores turcos de volta à distante margem do Bósforo."
 wal_liberate_serbia: "Liberte a Sérvia"
 wal_liberate_serbia_desc: "Nossos irmãos sérvios, que sofrem sob o jugo otomano desde a derrota em Kosovo — liberte-os e torne-se guardião dos Bálcãs ortodoxos."
 wal_reclaim_morea: "Recupere a Moreia"
 wal_reclaim_morea_desc: "O Despotado da Moreia, onde outrora ardeu a última luz de Bizâncio — recupere esse canto do Peloponeso das mãos dos infiéis."
 wal_heir_of_rome: "Herdeiro de Roma"
 wal_heir_of_rome_desc: "O que o Império Bizantino jamais alcançou — a completa derrota e a expulsão dos infiéis da Europa — nós o realizamos. Ninguém é mais digno do manto de Roma do que nós."
 wal_bulwark_of_christendom: "Baluarte da Cristandade"
 wal_bulwark_of_christendom_desc: "Os principados romenos são o baluarte da cristandade. Fortalecer nossas fronteiras é nosso dever diante de Deus."
 wal_ottoman_downfall: "A Queda dos Otomanos"
 wal_ottoman_downfall_desc: "O Império Otomano, outrora dominante nos Bálcãs e no Oriente Médio — sua ameaça foi enfim condenada às páginas da história."
 wal_reclaim_constantinople: "Recupere Constantinopla"
 wal_reclaim_constantinople_desc: "Constantinopla, há muito caída nas mãos de infiéis — como herdeiros da Ordem do Dragão, liberte essa cidade imperial."
 wal_danubian_empire: "Império Danubiano Concluído"
 wal_danubian_empire_desc: "Dos Cárpatos aos Bálcãs e, mais além, ao Bósforo — essa luta, iniciada com a vingança do Empalador, termina com a conclusão de um grande império, que governa o Danúbio."
 wal_danube_trade: "A Rota Comercial do Danúbio"
 wal_danube_trade_desc: "A rota comercial, que liga a Europa Ocidental e o Mar Negro ao longo do Danúbio — atraia essa corrente de riqueza ao tesouro da Valáquia."
 wal_treasury: "Construa o Tesouro"
 wal_treasury_desc: "Guerra, diplomacia, manutenção da corte — todo assunto de Estado exige ouro. Construa um tesouro cheio e prepare-se para qualquer dificuldade."
 wal_manufactories: "Desenvolva as Manufaturas"
 wal_manufactories_desc: "Uma grande transformação avança no campo da produção — invista sem hesitar em manufaturas e prepare-se para a era da indústria."
 wal_events.2.t: "Constantinopla Recuperada"
 wal_events.2.d: "A grande cidade imperial de Constantinopla caiu enfim em nossas mãos. O estandarte da Ordem do Dragão tremula agora sobre essa cidade, outrora detida por infiéis."
 wal_events.2.a: "A cidade de Roma é nossa!"
 wal_events.99.t: "Proclamação do Império Danubiano"
 wal_events.99.d: "O pequeno principado ao pé dos Cárpatos renasceu como grande império, que governa o Danúbio e os Bálcãs. A vontade do Empalador foi enfim plenamente realizada."
 wal_events.99.a: "Glória ao Império Danubiano!"
 STATIC_MODIFIER_NAME_wal_voivode_beginnings_mod: "A Aurora do Voivodato"
 STATIC_MODIFIER_DESC_wal_voivode_beginnings_mod: "A memória do dia em que Basarab I recusou ajoelhar-se diante de um suserano estrangeiro é o orgulho dos soldados da Valáquia."
 STATIC_MODIFIER_NAME_wal_voivode_mod: "A Autoridade do Voivoda"
 STATIC_MODIFIER_DESC_wal_voivode_mod: "O trono do voivoda está estável, e a confiança na sucessão aumentou."
 STATIC_MODIFIER_NAME_wal_boyar_mod: "O Conselho dos Boiardos"
 STATIC_MODIFIER_DESC_wal_boyar_mod: "As relações com a nobreza boiarda estão estáveis, reforçando o fundamento do governo."
 STATIC_MODIFIER_NAME_wal_bucharest_mod: "Bucareste Fundada"
 STATIC_MODIFIER_DESC_wal_bucharest_mod: "Giurgiu desenvolvida como “Bucureşti”, bastião do sul."
 STATIC_MODIFIER_NAME_wal_targoviste_mod: "Târgovişte Desenvolvida"
 STATIC_MODIFIER_DESC_wal_targoviste_mod: "A antiga capital Târgovişte continua a prosperar."
 STATIC_MODIFIER_NAME_wal_carpathians_mod: "Rede de Fortalezas dos Cárpatos"
 STATIC_MODIFIER_DESC_wal_carpathians_mod: "A rede de fortalezas nas montanhas repele todo invasor."
 STATIC_MODIFIER_NAME_wal_church_mod: "Proteção da Igreja Ortodoxa"
 STATIC_MODIFIER_DESC_wal_church_mod: "A Igreja Ortodoxa valáquia está sob proteção do Estado, elevando a legitimidade religiosa."
 STATIC_MODIFIER_NAME_wal_impale_mod: "Empale o Sultão"
 STATIC_MODIFIER_DESC_wal_impale_mod: "O rumor de uma fileira de estacas, erguida diante dos enviados do sultão, ainda gela os corações do exército do islã."
 STATIC_MODIFIER_NAME_wal_dregatori_mod: "Dregatori Nomeados"
 STATIC_MODIFIER_DESC_wal_dregatori_mod: "Funcionários escolhidos por habilidade sustentam agora uma administração leal."
 STATIC_MODIFIER_NAME_wal_moldavia_mod: "Moldávia Subjugada"
 STATIC_MODIFIER_DESC_wal_moldavia_mod: "O Principado da Moldávia trazido ao governo valáquio."
 STATIC_MODIFIER_NAME_wal_transylvania_mod: "Transilvânia Conquistada"
 STATIC_MODIFIER_DESC_wal_transylvania_mod: "A Transilvânia trazida ao domínio da Valáquia."
 STATIC_MODIFIER_NAME_wal_szekely_mod: "Bravura dos Székely"
 STATIC_MODIFIER_DESC_wal_szekely_mod: "Os guerreiros montanheses das terras dos Székely alinham suas lanças em fileira sob os estandartes da Valáquia."
 STATIC_MODIFIER_NAME_wal_saxon_mod: "Prosperidade das Cidades Saxãs"
 STATIC_MODIFIER_DESC_wal_saxon_mod: "As cidades saxãs da Transilvânia tornaram-se um pilar da economia do reino."
 STATIC_MODIFIER_NAME_wal_danube_mod: "Danúbio Assegurado"
 STATIC_MODIFIER_DESC_wal_danube_mod: "As margens do Danúbio asseguradas, abrindo a linha vital do comércio."
 STATIC_MODIFIER_NAME_wal_hegemony_mod: "Hegemonia Cárpata"
 STATIC_MODIFIER_DESC_wal_hegemony_mod: "A terra entre os Cárpatos e o Danúbio submete-se plenamente à autoridade do voivoda."
 STATIC_MODIFIER_NAME_wal_unity_mod: "Unidade Romena"
 STATIC_MODIFIER_DESC_wal_unity_mod: "Valáquia, Moldávia e Transilvânia unidas sob uma só coroa."
 STATIC_MODIFIER_NAME_wal_order_of_dragon_mod: "Membro da Ordem do Dragão"
 STATIC_MODIFIER_DESC_wal_order_of_dragon_mod: "Enviados, que portam a insígnia da Ordem do Dragão, viajam pelas cortes da cristandade, ampliando o círculo da aliança contra os otomanos."
 STATIC_MODIFIER_NAME_wal_drive_out_mod: "Turcos Expulsos"
 STATIC_MODIFIER_DESC_wal_drive_out_mod: "A guerra contra os infiéis provou a força de nosso exército."
 STATIC_MODIFIER_NAME_wal_serbia_mod: "Sérvia Libertada"
 STATIC_MODIFIER_DESC_wal_serbia_mod: "Nossos irmãos sérvios libertados, elevando nossa posição nos Bálcãs ortodoxos."
 STATIC_MODIFIER_NAME_wal_morea_mod: "Moreia Recuperada"
 STATIC_MODIFIER_DESC_wal_morea_mod: "Cargas de vinho e seda dos portos do Peloponeso enchem os armazéns dos mercadores valáquios."
 STATIC_MODIFIER_NAME_wal_heir_of_rome_mod: "Herdeiro de Roma"
 STATIC_MODIFIER_DESC_wal_heir_of_rome_mod: "Na corte valáquia, que reivindica a sucessão dos imperadores bizantinos, clero e nobreza inclinam por igual a cabeça, sem duvidar de sua legitimidade."
 STATIC_MODIFIER_NAME_wal_bulwark_mod: "Baluarte da Cristandade"
 STATIC_MODIFIER_DESC_wal_bulwark_mod: "A rede de fortalezas de fronteira serve agora de escudo à cristandade."
 STATIC_MODIFIER_NAME_wal_downfall_mod: "A Queda dos Otomanos"
 STATIC_MODIFIER_DESC_wal_downfall_mod: "Nas fronteiras, não mais assoladas por incursões otomanas, os soldados mostram com orgulho uns aos outros o treino que aperfeiçoaram."
 STATIC_MODIFIER_NAME_wal_manufactories_mod: "Manufaturas Desenvolvidas"
 STATIC_MODIFIER_DESC_wal_manufactories_mod: "Das chaminés das oficinas de Bucareste sobe a fumaça incessante de novo tecido e de ferramentas em produção."
 STATIC_MODIFIER_NAME_wal_trade_mod: "A Rota Comercial do Danúbio"
 STATIC_MODIFIER_DESC_wal_trade_mod: "A rede comercial ao longo do Danúbio protege a riqueza do Estado."
 STATIC_MODIFIER_NAME_wal_treasury_mod: "Tesouro Cheio"
 STATIC_MODIFIER_DESC_wal_treasury_mod: "Caixas de moedas de prata empilham-se nos cofres palacianos, e os mercadores negociam sem duvidar do peso da moeda."
 STATIC_MODIFIER_NAME_wal_danubian_empire_mod: "Rede de Governo do Império Danubiano"
 STATIC_MODIFIER_DESC_wal_danubian_empire_mod: "O próprio Danúbio tornou-se o sangue vital do império, suas águas levam exércitos rio acima e rio abaixo com facilidade. A legitimidade da dinastia é inabalável, e o poder da coroa alcança todos os cantos do reino."
