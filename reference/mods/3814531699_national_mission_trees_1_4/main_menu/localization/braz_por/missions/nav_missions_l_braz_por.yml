l_braz_por:
 nav_crown_mission_pack: "O Legado do Reino de Navarra"
 nav_crown_mission_pack_DESCRIPTION:0 "Enraizado ao pé dos Pireneus, o Reino basco de Navarra é uma pequena potência, cercada pelos três grandes reinos de Castela, Aragão e França. E, no entanto, sua linhagem corre pelas casas reais tanto da França quanto de Aragão, e, quando as rodas da história se alinharem, um inesperado caminho rumo à grandeza poderá ainda abrir-se diante dele. Você forjará a unidade basca, avançará além da Gasconha para intervir na França, ou conquistará a dominação sobre a Península Ibérica? O destino desse pequeno reino repousa nas mãos de seu rei."
 nav_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Conclua as missões como Reino de Navarra e estabeleça a unidade basca, com influência sobre a Ibéria e a França."
 nav_crown_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para seguir o caminho do legado do Reino de Navarra."
 nav_crown_mission_pack_BUTTON_DETAILS:0 "Forje a unidade basca, avance sobre a Gasconha e reivindique a dominação sobre a Ibéria!"
 nav_kingdom_of_pamplona: "O Reino de Pamplona"
 nav_kingdom_of_pamplona_desc: "Fundado por Íñigo Arista, o Reino de Pamplona é uma antiga linhagem, profundamente enraizada nas terras bascas. Contudo, cercado pelas grandes potências de Castela, Aragão e França, sua sobrevivência sempre repousou num frágil equilíbrio."
 nav_secure_bayonne: "Assegure Bayonne"
 nav_secure_bayonne_desc: "Chegou a hora de unir nossos compatriotas do outro lado do mar, os bascos franceses de Bayonne, sob nossa coroa. Todos os bascos devem um dia reunir-se sob um só estandarte."
 nav_basque_unity: "Unidade Basca"
 nav_basque_unity_desc: "O povo, que partilha nossa língua e costumes, forma agora o núcleo do reino. Ser basco tornou-se nosso maior orgulho."
 nav_fueros_and_privileges: "Garanta os Fueros"
 nav_fueros_and_privileges_desc: "Os fueros, antigos privilégios de autogoverno, há muito detidos pelas cidades bascas. À medida que a nobreza fica mais satisfeita, garantir esses privilégios torna-se base sólida para a própria coroa."
 nav_efficient_administration: "Administração Eficiente"
 nav_efficient_administration_desc: "Escritórios de contabilidade, estabelecidos por todo o reino, reforçam nossa base fiscal. Para um pequeno reino, a eficiência do governo é tábua de salvação."
 nav_renaissance_of_pamplona: "O Renascimento de Pamplona"
 nav_renaissance_of_pamplona_desc: "Novos ventos de saber, que sobem da Itália, chegaram até o sopé dos Pireneus. Por pequeno que seja o reino, seu espírito caminha na vanguarda da época."
 nav_intervene_hundred_years_war: "Intervenha na Guerra dos Cem Anos"
 nav_intervene_hundred_years_war_desc: "A longa luta entre a França e a Inglaterra continua a assolar. Nossa linhagem real corre por ambas as coroas, e Navarra tem tanto o direito quanto a oportunidade de intervir como terceira potência."
 nav_foothold_in_france: "Cabeça de Ponte na França"
 nav_foothold_in_france_desc: "Aproveitando o caos da Guerra dos Cem Anos, assegure parte da terra francesa. Isso estende o alcance do reino fundo ao coração do sudoeste da França."
 nav_secure_gascony: "Assegure a Gasconha"
 nav_secure_gascony_desc: "Dominar a terra de Tursan e tomar o porto de Bordeaux traz toda a Gasconha ao nosso governo, abrindo a porta para o Atlântico."
 nav_claims_on_france: "Cabeça de Ponte para a Coroa Francesa"
 nav_claims_on_france_desc: "Agora que vastos territórios no interior da própria França estão assegurados, a ambição que nossa casa nutre sobre o trono francês já não é mero devaneio."
 nav_house_of_evreux: "A Ambição da Casa de Évreux"
 nav_house_of_evreux_desc: "Seja por união pessoal com a França, seja pela tomada da própria Paris, a legitimidade que nossa casa detém sobre o trono francês está agora fora de dúvida."
 nav_claim_french_throne: "Reivindique o Trono Francês"
 nav_claim_french_throne_desc: "Agora que a linha real francesa se extinguiu, nossa casa ergue-se como legítima herdeira de sua coroa. Chegou a hora de as duas coroas, a de Navarra e a da França, repousarem sobre uma só cabeça."
 nav_aragonese_inheritance: "Laços de Sangue com Aragão"
 nav_aragonese_inheritance_desc: "Nossa casa e a casa real de Aragão compartilham o mesmo sangue ancestral. Os destinos dos dois reinos ainda podem ser ligados num só."
 nav_castilian_question: "A Questão Castelhana"
 nav_castilian_question_desc: "Castela, a maior potência da Península Ibérica. Seja ligando-se a ela por aliança, seja opondo-se a ela como rival, a natureza dessas relações deve ser esclarecida."
 nav_reconquista_legacy: "O Legado da Reconquista"
 nav_reconquista_legacy_desc: "A memória de séculos de luta contra as potências islâmicas é orgulho partilhado por todos os reinos da Ibéria. Nosso reino carrega também sua parte dessa glória."
 nav_dominate_iberia: "Domínio sobre a Ibéria"
 nav_dominate_iberia_desc: "O que outrora foi um pequeno reino já não pode ser ignorado na Península Ibérica. A coroa basca tornou-se poderosa o bastante para moldar o destino de toda a península."
 nav_basque_seafarers: "Os Pescadores Bascos"
 nav_basque_seafarers_desc: "O povo basco é há muito conhecido como destemidos pescadores. Sua habilidade e coragem devem agora ser usadas como trunfo do Estado."
 nav_fearless_fishermen: "Os Navegantes Destemidos"
 nav_fearless_fishermen_desc: "Os navegantes bascos não temem nem os mares setentrionais enfurecidos. Sua habilidade marinheira e coragem já são conhecidas por todo o continente."
 nav_transatlantic_whalers: "Baleeiros Transatlânticos"
 nav_transatlantic_whalers_desc: "Os navios dos baleeiros bascos, que perseguem sua presa, chegaram enfim muito além do Atlântico. A atividade nessas novas águas promete enorme riqueza ao reino."
 nav_basque_in_glory: "Os Bascos em Glória"
 nav_basque_in_glory_desc: "O pequeno reino, nascido ao pé dos Pireneus, floresceu em cultura, ocupou o trono da França e governou uma Ibéria unificada como Espanha. A glória dos bascos já não pode ser negada por ninguém."
 STATIC_MODIFIER_NAME_nav_secure_bayonne_mod: "Experiência Militar de Bayonne"
 STATIC_MODIFIER_DESC_nav_secure_bayonne_mod: "A incorporação de Bayonne deu a nossas forças experiência em batalha."
 STATIC_MODIFIER_NAME_nav_basque_unity_mod: "Unidade Basca"
 STATIC_MODIFIER_DESC_nav_basque_unity_mod: "Os bascos são um dos mais antigos povos da Europa, de origem desconhecida, que fala língua sem parentesco com a família indo-europeia. A unidade cultural dos bascos, que vivem em ambos os lados dos Pireneus, preservou sua própria identidade sob os governos tanto francês quanto espanhol."
 STATIC_MODIFIER_NAME_nav_fueros_and_privileges_mod: "Fueros Garantidos"
 STATIC_MODIFIER_DESC_nav_fueros_and_privileges_mod: "Os fueros (privilégios e direito consuetudinário) são o sistema jurídico que garante a autonomia tradicional de Navarra e do País Basco. Seus poderes próprios em matéria de tributação, serviço militar e justiça estiveram sempre em tensão com a coroa centralizadora castelhana. Essa singular tradição jurídica forma o núcleo da identidade de Navarra."
 STATIC_MODIFIER_NAME_nav_efficient_administration_mod: "Governo Eficiente"
 STATIC_MODIFIER_DESC_nav_efficient_administration_mod: "O Reino de Navarra criou a “Cámara de Comptos”, escritório de gestão financeira, e adotou um sistema administrativo ao estilo francês. A sofisticação administrativa, resultante de seus longos laços com a casa real francesa (a família real de Navarra muitas vezes casava com franceses), distinguia-o de outros reinos da Ibéria."
 STATIC_MODIFIER_NAME_nav_renaissance_of_pamplona_mod: "O Novo Espírito de Pamplona"
 STATIC_MODIFIER_DESC_nav_renaissance_of_pamplona_mod: "O espírito do Renascimento elevou a habilidade dos artistas, que iniciam agora seu ofício."
 STATIC_MODIFIER_NAME_nav_foothold_in_france_mod: "Cabeça de Ponte na França"
 STATIC_MODIFIER_DESC_nav_foothold_in_france_mod: "O Reino de Navarra possuía também terras ao norte dos Pireneus, com a Baixa Navarra (atual País Basco francês) em seu centro. Historicamente, a casa real de Navarra casava com frequência com a casa real francesa, e possuir uma cabeça de ponte na França era a base de sua diplomacia."
 STATIC_MODIFIER_NAME_nav_secure_gascony_mod: "A Coroa da Gasconha"
 STATIC_MODIFIER_DESC_nav_secure_gascony_mod: "A segurança de toda a Gasconha reforçou a magnificência da coroa."
 STATIC_MODIFIER_NAME_nav_house_of_evreux_mod: "Prestígio da Casa de Évreux"
 STATIC_MODIFIER_DESC_nav_house_of_evreux_mod: "As fortes relações com a casa real francesa elevaram a posição diplomática de nossa nação."
 STATIC_MODIFIER_NAME_nav_claim_french_throne_mod: "As Coroas Gêmeas de Navarra e da França"
 STATIC_MODIFIER_DESC_nav_claim_french_throne_mod: "Portar as coroas gêmeas de Navarra e da França elevou a magnificência do reino e a estabilidade de seu governo."
 STATIC_MODIFIER_NAME_nav_castilian_question_mod: "Relações Claras com Castela"
 STATIC_MODIFIER_DESC_nav_castilian_question_mod: "As relações esclarecidas com Castela elevaram a posição diplomática de nossa nação."
 STATIC_MODIFIER_NAME_nav_reconquista_legacy_mod: "Orgulho da Reconquista"
 STATIC_MODIFIER_DESC_nav_reconquista_legacy_mod: "A memória da luta contra as potências islâmicas elevou a tolerância à nossa religião dominante."
 STATIC_MODIFIER_NAME_nav_dominate_iberia_mod: "Senhor da Ibéria"
 STATIC_MODIFIER_DESC_nav_dominate_iberia_mod: "Para Navarra, pequeno reino da península ibérica, superar as grandes potências de Castela e Aragão e tornar-se senhora da península evoca o sonho que Sancho III, o Grande (reinou 1000–1035), brevemente realizou. É um feito histórico, alcançável pelo pleno aproveitamento da vantagem geográfica de possuir as passagens pirenaicas."
 STATIC_MODIFIER_NAME_nav_basque_seafarers_mod: "Tradição Pesqueira Basca"
 STATIC_MODIFIER_DESC_nav_basque_seafarers_mod: "O crescimento das aldeias de pescadores fornece de forma constante 5 marinheiros a cada mês."
 STATIC_MODIFIER_NAME_nav_fearless_fishermen_mod: "Moral dos Navegantes Destemidos"
 STATIC_MODIFIER_DESC_nav_fearless_fishermen_mod: "“O navegante basco não teme tempestade alguma” era um ditado conhecido por toda a Europa. A habilidade marinheira e a têmpera, afiadas nas águas agitadas do Golfo da Biscaia (“nosso mar” para os bascos), colocaram-nos na vanguarda da era atlântica. Muitos marinheiros da Armada espanhola eram bascos."
 STATIC_MODIFIER_NAME_nav_transatlantic_whalers_mod: "Navegação dos Baleeiros Atlânticos"
 STATIC_MODIFIER_DESC_nav_transatlantic_whalers_mod: "Acredita-se que baleeiros bascos caçavam baleias-francas ao largo do Labrador, na América do Norte, desde o século XV. Os remanescentes de uma estação baleeira basca sobrevivem em Red Bay, no Canadá, e estão inscritos na Lista do Patrimônio Mundial da UNESCO. Essa atividade transatlântica pioneira lançou os alicerces da era colonial."
 STATIC_MODIFIER_NAME_nav_third_faction_mod: "Determinação da Terceira Facção Independente"
 STATIC_MODIFIER_DESC_nav_third_faction_mod: "A determinação de não tomar partido de nenhuma das grandes potências elevou o moral do exército."
 STATIC_MODIFIER_NAME_nav_basque_in_glory_mod: "Os Bascos em Glória"
 STATIC_MODIFIER_DESC_nav_basque_in_glory_mod: "Dominando a cultura, a diplomacia e o governo por igual, a coroa basca irradia agora uma magnificência muito superior à de um pequeno reino. A disciplina militar e a força dos navios pesados são também permanentemente reforçadas."
 nav_events.1.t: "As Origens do Reino de Pamplona"
 nav_events.1.d: "O Reino de Navarra é herdeiro do Reino de Pamplona, fundado no século IX por Íñigo Arista. Centrada no País Basco, essa linhagem nasceu como marca do Império Carolíngio e continua a traçar seu próprio caminho entre duas grandes potências: o mundo islâmico e o reino dos francos. Agora chegou a hora de erguer de novo seu estandarte ao pé dos Pireneus."
 nav_events.1.a: "A história do reino tomada a peito"
 nav_events.2.t: "Ambição sobre o Trono Francês"
 nav_events.2.d: "Nossa casa, a casa de Évreux, partilha sangue com a própria casa real francesa. Agora que vastos territórios dentro da França estão assegurados, o rei de Navarra pode reivindicar abertamente sua sucessão. Essa legitimidade deve agora ser provada, tanto na corte quanto no campo de batalha."
 nav_events.2.a: "A causa da reivindicação levantada"
 nav_events.3.t: "Laços de Sangue com Aragão"
 nav_events.3.d: "As casas reais de Navarra e Aragão partilham o mesmo sangue ancestral. Não é raro que os herdeiros de ambos os tronos sejam a mesma pessoa. Se qualquer das linhas falhar, os dois reinos podem ainda estar destinados a unir-se sob uma só coroa."
 nav_events.3.a: "O significado desse parentesco compreendido"
 nav_events.4.t: "Intervenção na Guerra dos Cem Anos"
 nav_events.4.d: "A Guerra dos Cem Anos entre a França e a Inglaterra já não é um simples conflito entre duas nações. Nossa casa, a casa de Évreux, descende da linha capetíngia francesa, ao mesmo tempo que tem profundos laços matrimoniais com a corte inglesa. Além disso, a própria coroa navarra há muito serve de importante precedente nos debates sobre o direito sucessório francês.\\n\\nNessa era de tumulto, três caminhos estão abertos a Navarra. Um é apoiar a França, por laços de sangue e longa amizade. Outro é apoiar a Inglaterra, por interesses comerciais e como baluarte contra Castela. O último é não tomar partido de nenhuma das grandes potências, perseguindo os próprios interesses como terceira facção independente. Essa escolha pesará muito sobre o destino do reino."
 nav_events.4.a: "Apoiar a França"
 nav_events.4.b: "Apoiar a Inglaterra"
 nav_events.4.c: "Entrar na guerra como terceira facção independente"
