l_braz_por:
 ara_crown_mission_pack: "O Caminho da Coroa de Aragão"
 ara_crown_mission_pack_DESCRIPTION:0 "A Coroa de Aragão — que une Catalunha, Aragão e Valência — está no centro da história, disputando a unidade ibérica e a supremacia no Mediterrâneo. Estenda a mão a Castela e forje a Espanha, ou siga sozinho o próprio caminho, incorpore Nápoles e marche sobre Constantinopla. O caminho é seu."
 ara_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Conclua as missões como Coroa de Aragão para estabelecer a unidade ibérica e a hegemonia mediterrânea."
 ara_crown_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para seguir o caminho da Coroa de Aragão."
 ara_crown_mission_pack_BUTTON_DETAILS:0 "Lance as bases da Espanha, torne-se senhor do Mediterrâneo ocidental e tome Constantinopla!"
 ara_accession_of_pedro_iv: "A Ascensão de Pedro IV"
 ara_accession_of_pedro_iv_desc: "Em 1336, com a morte de Afonso IV, seu filho Pedro IV (Pere III, o Cerimonioso) subiu ao trono da Coroa de Aragão. Erudito e profundamente devoto do cerimonial da corte, esse jovem rei nutre firme determinação de fortalecer o poder real e unificar o reino. Com a aurora de um novo governo, as ambições de Aragão no Mediterrâneo voltam a acender-se."
 ara_kingdom_of_majorca: "O Reino de Maiorca"
 ara_kingdom_of_majorca_desc: "O Reino de Maiorca, outrora governado por um ramo mais jovem da casa real aragonesa, continua a existir como força política autônoma nas Baleares. Integrar por completo esse território será o primeiro passo rumo a ambições maiores no Mediterrâneo ocidental."
 ara_reconquest_of_granada: "A Reconquista de Granada"
 ara_reconquest_of_granada_desc: "O Reino de Granada, último bastião do islã na Península Ibérica, há muito atormenta os reis cristãos com suas terras férteis e seus magníficos palácios. Conquistar esse reino significa o fim da Reconquista — o fim de um confronto de séculos."
 ara_vassalize_navarre: "Subjugue Navarra"
 ara_vassalize_navarre_desc: "O pequeno Reino de Navarra, encravado entre a França e Castela, é uma zona-tampão estrategicamente importante para Aragão. Antes que a França consiga absorvê-lo, devemos trazer Navarra à esfera de influência de Aragão."
 ara_intervene_in_castile: "Intervenha em Castela"
 ara_intervene_in_castile_desc: "A corte de Castela, que partilha o sangue Trastâmara com nossa própria casa real, foi há muito dilacerada por disputas de facções. Como os infantes de Aragão outrora disputaram influência sobre esse grande reino, agora chegou a hora de intervir em seu destino."
 ara_union_of_the_crowns: "A União das Coroas"
 ara_union_of_the_crowns_desc: "As coroas de Aragão e Castela unidas sob uma só casa real. É a aurora de um novo reino — a Espanha. Realize com suas próprias mãos a união histórica, forjada na era de Fernando e Isabel."
 ara_catalan_nobility: "A Nobreza Catalã"
 ara_catalan_nobility_desc: "Após a revolta, devemos decidir o destino da nobreza catalã. Restringir seu poder e fortalecer a autoridade real, ou buscar a coexistência numa ordem reformada? Essa decisão definirá a estabilidade da Catalunha e o futuro do governo em todo o reino."
 ara_crowns_of_iberia: "As Coroas da Ibéria"
 ara_crowns_of_iberia_desc: "Aragão, Castela, Navarra, Granada — todas as coroas da Península Ibérica reuniram-se sob uma só casa real. Aqui se assenta a base do Império Espanhol. Chegou a hora de proclamar ao mundo o nascimento do novo império."
 ara_pacify_sardinia: "Pacifique a Sardenha"
 ara_pacify_sardinia_desc: "Aragão há muito reivindica o domínio sobre a Sardenha, mas revoltas internas e potências rivais atormentaram a ilha. Pacificar por completo esse rico bastião mediterrâneo é passo indispensável para a expansão rumo ao leste."
 ara_consulate_of_the_sea: "O Consulado do Mar"
 ara_consulate_of_the_sea_desc: "O direito marítimo comercial, desenvolvido em torno de Barcelona e Valência — o Consolat de Mar — regula o comércio mediterrâneo. Use o prestígio dessa instituição para trazer o comércio do Mediterrâneo ocidental à nossa jurisdição."
 ara_dominate_genoa: "Domine Gênova"
 ara_dominate_genoa_desc: "Gênova há muito rivalizou com Aragão pela supremacia no comércio mediterrâneo. Se conseguirmos tomar a Ligúria e a própria Gênova, o comércio em todo o Mediterrâneo ocidental cairá por completo em nossas mãos."
 ara_rule_italy: "Governe a Itália"
 ara_rule_italy_desc: "Governar toda a Itália — incluindo as posses do papa — tem significado histórico, que vai além da mera conquista. Administrando a terra em que vive a herança de Roma, Aragão estabelece-se como hegemon da Europa."
 ara_invade_occitania: "Invada a Occitânia"
 ara_invade_occitania_desc: "Provença, Languedoc, Gasconha — as terras do sul da França outrora caíam na esfera de influência aragonesa. Ampliar nossa fronteira norte contra o Reino da França é tarefa estratégica essencial para a segurança da Península Ibérica."
 ara_humiliate_provence: "Humilhe a Provença"
 ara_humiliate_provence_desc: "O conde da Provença há muito apresenta legítimas reivindicações hereditárias tanto a Aragão quanto a Nápoles. Devemos pôr fim a essas pretensões audaciosas e trazer a Provença ao nosso controle, para tornar incontestada nossa hegemonia no Mediterrâneo ocidental."
 ara_aragonese_navy: "A Armada de Aragão"
 ara_aragonese_navy_desc: "As posses da Coroa de Aragão estão espalhadas pelo Mediterrâneo. Defendê-las todas e manter o domínio naval exige uma poderosa frota. Construa a armada aragonesa e estabeleça a liderança sobre esse mar interior."
 ara_seize_sicily: "Tome a Sicília"
 ara_seize_sicily_desc: "Com a frota aragonesa construída, a invasão da ilha da Sicília torna-se perspectiva realista. A Sicília, outrora libertada dos franceses pelas “Vésperas Sicilianas”, vê em Aragão seu próprio protetor. Assegure Palermo e faça desse importante bastião mediterrâneo, para sempre, propriedade de Aragão."
 ara_integrate_naples: "Integre Nápoles"
 ara_integrate_naples_desc: "O Reino de Nápoles, conquistado pelo rei Afonso V, permanece como uma das pérolas da coroa aragonesa. Tendo integrado por completo o sul da Itália e a cidade portuária de Nápoles, nosso reino ganha uma cabeça de ponte para a expansão rumo ao Mediterrâneo oriental."
 ara_mediterranean_ambitions: "Ambições Mediterrâneas"
 ara_mediterranean_ambitions_desc: "Para que nosso nome ressoe até o Mediterrâneo oriental, é preciso uma frota maior e uma força naval mais poderosa. Construa uma grande flotilha de galés e ergua nossa bandeira sobre todo o Mediterrâneo. Uma cabeça de ponte nos Bálcãs está agora ao alcance."
 ara_combat_barbary_piracy: "Combata a Pirataria Berbere"
 ara_combat_barbary_piracy_desc: "Os corsários muçulmanos, que se postam no litoral norte-africano, são ameaça constante à navegação aragonesa. Atacar suas bases e libertar cristãos inocentes do cativeiro é urgente tanto para a fé quanto para o interesse do Estado."
 ara_conquer_tunis: "Conquiste Túnis"
 ara_conquer_tunis_desc: "Túnis não é apenas um porto pirata. Se deixarmos indomada essa força naval, ligada aos otomanos, nossa hegemonia mediterrânea estará constantemente ameaçada. Conquiste Túnis e estabeleça o pleno domínio do norte da África."
 ara_occupy_alexandria: "Ocupe Alexandria"
 ara_occupy_alexandria_desc: "Alexandria, chave do Mediterrâneo oriental, foi outrora centro do saber antigo do mundo e permanece nó do comércio egípcio e asiático. Se conseguirmos tomar essa cidade e monopolizar o comércio oriental, Aragão tornar-se-á o verdadeiro hegemon mediterrâneo."
 ara_claims_on_athens: "Reivindicações sobre Atenas"
 ara_claims_on_athens_desc: "Como os mercenários aragoneses — a Companhia Catalã — outrora fundaram o Ducado de Atenas, Aragão tem direitos históricos sobre as terras gregas. Tome a Moreia e o norte da Grécia e assegure a última cabeça de ponte no caminho para Constantinopla."
 ara_mare_nostrum: "Mare Nostrum"
 ara_mare_nostrum_desc: "De Gibraltar ao Mar de Mármara, o Mediterrâneo é nosso mar interior. Ninguém ousa navegar nessas águas sem a permissão da frota aragonesa. Hegemonia sobre o Mediterrâneo ocidental estabelecida — o próximo objetivo é aquela cidade dourada por trás de suas antigas muralhas."
 ara_taula_de_canvi: "A Taula de Canvi"
 ara_taula_de_canvi_desc: "A Taula de Canvi (Mesa de Câmbio), estabelecida em Barcelona em 1401, é um dos mais antigos bancos públicos da Europa. Usando essa instituição, cada vez mais sofisticada à medida que o comércio se expande, podemos pôr as finanças do reino sobre uma base inabalável."
 ara_valencian_silk: "A Seda Valenciana"
 ara_valencian_silk_desc: "Valência passa a ser conhecida como produtora de seda fina. Ampliando a Lonja da Seda (Llotja de la Seda) e desenvolvendo a indústria da seda de Valência, podemos até superar a concorrência oriental."
 ara_guilds_of_barcelona: "As Guildas de Barcelona"
 ara_guilds_of_barcelona_desc: "As guildas de artesãos e mercadores de Barcelona são há muito a espinha dorsal da economia urbana. Garantindo sua lealdade e organizando guildas semelhantes por todo o reino, a base do ofício e do comércio será reforçada ainda mais."
 ara_industrial_districts: "Distritos Industriais"
 ara_industrial_districts_desc: "Vidro, vinho, papel e seda — Aragão é lar de uma paleta diversificada de mercadorias de alta qualidade. Organizando essas indústrias e ampliando a produção, o poder econômico do reino crescerá com rapidez."
 ara_aragonese_renaissance: "O Renascimento Aragonês"
 ara_aragonese_renaissance_desc: "A corte de Afonso V tornou-se centro da cultura renascentista em Nápoles, atraindo humanistas italianos de toda a península. Difundindo esse florescimento cultural por todo o reino, Aragão estabelecerá a si própria como coração espiritual e artístico da Europa."
 ara_golden_century: "O Século de Ouro"
 ara_golden_century_desc: "Tendo unificado a Ibéria, dominado o Mediterrâneo e visto florescer a economia e a cultura, nosso reino ingressa de fato em seu Siglo de Oro — o Século de Ouro. Seu brilho será discutido por gerações."
 ara_city_of_the_worlds_desire: "A Cidade Desejada pelo Mundo"
 ara_city_of_the_worlds_desire_desc: "Constantinopla — a cidade desejada pelo mundo. Suas muralhas douradas deteram muitos conquistadores por séculos. Mas agora nossa frota — senhora do Mediterrâneo — e nossos exércitos — unidos sobre a Ibéria — estão prontos para enfim cercar essa cidade. Ocupe ambas as margens do Bósforo e realize o antigo sonho."
 ara_plus_ultra: "Plus Ultra"
 ara_plus_ultra_desc: "“Plus Ultra” — mais além. Dizia-se outrora que a oeste dos Pilares de Hércules nada havia. Mas nossos exploradores sabem agora que, além deles, jaz um vasto mar desconhecido. Chegou a hora de navegar além dos pilares e partir rumo aos confins do mundo."
 ara_african_outposts: "Postos Africanos"
 ara_african_outposts_desc: "Avançar para o sul ao longo da costa da África Ocidental abre novos caminhos, que contornam os intermediários muçulmanos para chegar ao ouro e às mercadorias diretamente. Primeiro, erga postos nas Ilhas Canárias e ao longo da costa marroquina."
 ara_gold_coast_trade: "Comércio da Costa do Ouro"
 ara_gold_coast_trade_desc: "A região do litoral da África Ocidental, conhecida como Costa do Ouro, é fiel ao nome, rica fonte de ouro. Estabelecendo aqui um posto comercial, podemos trazer a riqueza da África diretamente ao reino, sem depender da rota transaariana."
 ara_discover_the_new_world: "Descubra o Novo Mundo"
 ara_discover_the_new_world_desc: "O que há a oeste do grande oceano? Nossos exploradores, crendo na esfericidade da Terra, estão convencidos de que existe uma rota ocidental para a Ásia. Equipe uma frota de exploração e navegue rumo ao mar desconhecido. O que ali encontrar pode ser um novo mundo, que supere toda imaginação."
 ara_caribbean_foothold: "Cabeça de Ponte no Caribe"
 ara_caribbean_foothold_desc: "Estabelecemos nossa primeira cabeça de ponte no Novo Mundo. Povoe Hispaniola e as ilhas circundantes e faça delas ponto de partida para a exploração do continente. Daqui se abrem caminhos para o sul, o norte e o interior."
 ara_conquest_of_the_incas: "A Conquista dos Incas"
 ara_conquest_of_the_incas_desc: "No fundo do continente sul-americano jaz um grande império, dizem, cheio de ouro e prata — o Império Inca (Tawantinsuyu). Conduza os conquistadores às terras altas andinas e faça da riqueza desse império a sua própria."
 ara_new_kingdom_of_aragon: "O Novo Reino de Aragão"
 ara_new_kingdom_of_aragon_desc: "As colônias que construímos no Novo Mundo já não são meros postos. Organize-as como posses diretas da coroa de Aragão — o Novo Reino de Aragão — com instituições apropriadas à metrópole. Como soberano das Américas, nosso rei será inscrito como senhor de dois mundos."
 ara_route_to_the_indies: "A Rota para as Índias"
 ara_route_to_the_indies_desc: "Portugal já abriu a rota marítima para as Índias em torno da extremidade sul da África. Mas não podemos apenas olhar de lado. Abra uma rota ao redor do mundo, como Magalhães, ou alcance os portos da Índia antes de Portugal."
 ara_spice_trade_outposts: "Postos do Comércio de Especiarias"
 ara_spice_trade_outposts_desc: "Cravo, noz-moscada e pimenta das Ilhas das Especiarias (Molucas) alcançam preços enormes na Europa. Se erguermos ali uma cabeça de ponte e monopolizarmos o comércio de especiarias, o tesouro do reino será enriquecido para sempre."
 ara_las_filipinas: "Las Filipinas"
 ara_las_filipinas_desc: "O arquipélago ao qual chegou Magalhães — as Filipinas (Filipinas). Pela conquista e colonização dessas ilhas estrategicamente situadas, nasce um novo nó no centro do comércio do Pacífico. Como centro da rota comercial da prata, que liga a China e as Américas, esse território tem valor inestimável."
 ara_empire_of_the_three_oceans: "O Império dos Três Oceanos"
 ara_empire_of_the_three_oceans_desc: "Atlântico, Oceano Índico, Pacífico — ergueu-se o império que levanta seu estandarte sobre os três grandes oceanos. O cetro de Aragão estende-se agora não só às cortes da Europa, mas também às selvas da África, às terras altas do Novo Mundo e às Ilhas das Especiarias da Ásia. Alcançamos um feito que nenhuma nação na história alcançou."
 STATIC_MODIFIER_NAME_ara_kingdom_of_majorca_mod: "A Frota das Baleares"
 STATIC_MODIFIER_DESC_ara_kingdom_of_majorca_mod: "Assegurada nossa cabeça de ponte no Mediterrâneo ocidental, o alcance de nossos navios e o dos nossos mercadores aumentaram."
 STATIC_MODIFIER_NAME_ara_reconquest_of_granada_mod: "Glória da Cruzada"
 STATIC_MODIFIER_DESC_ara_reconquest_of_granada_mod: "A conclusão da Reconquista elevou nossa tolerância a hereges e a legitimidade da coroa."
 STATIC_MODIFIER_NAME_ara_vassalize_navarre_mod: "Equilíbrio dos Pireneus"
 STATIC_MODIFIER_DESC_ara_vassalize_navarre_mod: "A incorporação de Navarra à nossa esfera elevou o peso diplomático do reino."
 STATIC_MODIFIER_NAME_ara_intervene_in_castile_mod: "Corpo Expedicionário Castelhano"
 STATIC_MODIFIER_DESC_ara_intervene_in_castile_mod: "Depois da intervenção em Castela, o exército real ostenta alto moral terrestre."
 STATIC_MODIFIER_NAME_ara_union_of_the_crowns_mod: "A Glória dos Reis Católicos"
 STATIC_MODIFIER_DESC_ara_union_of_the_crowns_mod: "O casamento de Fernando II e Isabel I em 1469 ligou dois grandes reinos, Aragão e Castela, numa união dinástica. O governo desses dois, chamados “Reis Católicos”, tornou-se a base do Estado espanhol unificado, e logo seguiram-se a conquista de Granada e as viagens de Colombo."
 STATIC_MODIFIER_NAME_ara_catalan_nobility_mod: "O Veredicto da Justicia"
 STATIC_MODIFIER_DESC_ara_catalan_nobility_mod: "O estabelecimento da Justicia de Aragón permite que o descontentamento do estamento nobre diminua mais depressa."
 STATIC_MODIFIER_NAME_ara_crowns_of_iberia_mod: "Prontidão Militar da Espanha"
 STATIC_MODIFIER_DESC_ara_crowns_of_iberia_mod: "Pela união da Coroa de Aragão com Castela e Portugal, toda a Península Ibérica passa a um só monarca. Realizar o sonho de uma única “Espanha”, acalentado desde o Império Romano, é um empreendimento de escala histórica mundial."
 STATIC_MODIFIER_NAME_ara_pacify_sardinia_mod: "Guarnição Sarda"
 STATIC_MODIFIER_DESC_ara_pacify_sardinia_mod: "A ilha pacificada da Sardenha multiplicou os efetivos do reino e aliviou o peso da guerra."
 STATIC_MODIFIER_NAME_ara_consulate_of_the_sea_mod: "Prestígio do Direito Marítimo"
 STATIC_MODIFIER_DESC_ara_consulate_of_the_sea_mod: "O prestígio de nosso direito marítimo elevou a renda comercial do reino e o alcance de seus mercadores."
 STATIC_MODIFIER_NAME_ara_dominate_genoa_mod: "Casa Comercial da Ligúria"
 STATIC_MODIFIER_DESC_ara_dominate_genoa_mod: "A casa comercial de Gênova elevou o alcance de nossos mercadores nessa terra."
 STATIC_MODIFIER_NAME_ara_rule_italy_mod: "Hegemon da Península"
 STATIC_MODIFIER_DESC_ara_rule_italy_mod: "A Coroa de Aragão esteve profundamente envolvida com a Itália desde a conquista de Nápoles por Afonso V, o Magnânimo (1442). Afonso fez de Nápoles sua residência e governou como grande mecenas do Renascimento. Governar toda a Itália seria o cumprimento supremo da ambição de Afonso."
 STATIC_MODIFIER_NAME_ara_invade_occitania_mod: "Corpo Expedicionário Occitano"
 STATIC_MODIFIER_DESC_ara_invade_occitania_mod: "Tendo se aberto caminho pelo sul da França, o exército real marcha mais depressa e sitia com maior maestria."
 STATIC_MODIFIER_NAME_ara_humiliate_provence_mod: "Subjugação da Provença"
 STATIC_MODIFIER_DESC_ara_humiliate_provence_mod: "Tendo tomado os estaleiros da Provença, a produção de bens navais do reino aumentou."
 STATIC_MODIFIER_NAME_ara_aragonese_navy_mod: "Armada de Aragão"
 STATIC_MODIFIER_DESC_ara_aragonese_navy_mod: "A frota aragonesa reorganizada ostenta alto moral e excelente capacidade de reparo."
 STATIC_MODIFIER_NAME_ara_integrate_naples_mod: "Tesouro das Duas Sicílias"
 STATIC_MODIFIER_DESC_ara_integrate_naples_mod: "O comércio com Nápoles prospera, e os efetivos do exército real aumentaram."
 STATIC_MODIFIER_NAME_ara_mediterranean_ambitions_mod: "Poder da Flotilha de Galés"
 STATIC_MODIFIER_DESC_ara_mediterranean_ambitions_mod: "A frota ampliada ostenta alto moral e alcance incomparável."
 STATIC_MODIFIER_NAME_ara_combat_barbary_piracy_mod: "Esquadra Antipirataria"
 STATIC_MODIFIER_DESC_ara_combat_barbary_piracy_mod: "Reprimidos os corsários, os navios mercantes do reino navegam com maior segurança, e a disciplina do exército aumentou."
 STATIC_MODIFIER_NAME_ara_conquer_tunis_mod: "Guarnição Norte-Africana"
 STATIC_MODIFIER_DESC_ara_conquer_tunis_mod: "Assegurada a liderança sobre o norte da África, nossa mão nas negociações de guerra é mais forte, e os efetivos do exército aumentaram."
 STATIC_MODIFIER_NAME_ara_occupy_alexandria_mod: "Monopólio do Comércio Oriental"
 STATIC_MODIFIER_DESC_ara_occupy_alexandria_mod: "Assegurado o nó do comércio oriental, a renda comercial do reino e o alcance de seus mercadores aumentaram como nunca."
 STATIC_MODIFIER_NAME_ara_claims_on_athens_mod: "O Legado da Companhia Catalã"
 STATIC_MODIFIER_DESC_ara_claims_on_athens_mod: "Realizadas as expedições na Grécia, o exército real marcha mais depressa, e o peso da guerra recai mais leve sobre o reino."
 STATIC_MODIFIER_NAME_ara_mare_nostrum_mod: "Comando Supremo da Frota Mediterrânea"
 STATIC_MODIFIER_DESC_ara_mare_nostrum_mod: "Assegurado todo o Mediterrâneo, nossa frota ostenta alto moral e alcance operacional e comercial incomparável."
 STATIC_MODIFIER_NAME_ara_taula_de_canvi_mod: "Crédito da Mesa de Câmbio"
 STATIC_MODIFIER_DESC_ara_taula_de_canvi_mod: "A “Taula de Canvi” (Mesa de Câmbio), fundada em Barcelona em 1401, é considerada um dos primeiros bancos públicos do mundo. Gerida pelas guildas mercantis de Barcelona, essa instituição financeira administrava créditos, letras de câmbio e depósitos e tornou-se pilar que sustentava o comércio catalão."
 STATIC_MODIFIER_NAME_ara_valencian_silk_mod: "A Lonja da Seda"
 STATIC_MODIFIER_DESC_ara_valencian_silk_mod: "Valência foi um dos principais centros de produção de seda do Mediterrâneo medieval. As tecnologias de sericultura, trazidas pelos mouros, passaram aos artesãos cristãos, e a seda valenciana ostentava reputação que rivalizava com a dos tecidos finos da Itália. A Llotja de la Seda (Lonja da Seda) é símbolo de sua prosperidade."
 STATIC_MODIFIER_NAME_ara_guilds_of_barcelona_mod: "Lealdade das Guildas"
 STATIC_MODIFIER_DESC_ara_guilds_of_barcelona_mod: "Os laços fortalecidos com as guildas de Barcelona elevaram um pouco a eficiência produtiva dessa terra."
 STATIC_MODIFIER_NAME_ara_industrial_districts_mod: "Crescimento da Manufatura"
 STATIC_MODIFIER_DESC_ara_industrial_districts_mod: "Em Barcelona, Valência e Saragoça desenvolveram-se distritos industriais, onde se concentraram oficinas de lã, tecidos, couro e artigos de metal. A prosperidade comercial da Coroa de Aragão era sustentada pela produtividade dessas indústrias urbanas, e suas mercadorias eram muito estimadas até nos mercados da Itália."
 STATIC_MODIFIER_NAME_ara_aragonese_renaissance_mod: "Corte dos Humanistas"
 STATIC_MODIFIER_DESC_ara_aragonese_renaissance_mod: "Esse florescimento cultural elevou a habilidade dos novos artistas e o ritmo de inovação."
 STATIC_MODIFIER_NAME_ara_golden_century_mod: "Prosperidade do Siglo de Oro"
 STATIC_MODIFIER_DESC_ara_golden_century_mod: "O Siglo de Oro (Século de Ouro) designa os séculos XVI e XVII, quando a Espanha alcançou o auge de suas realizações políticas, militares e culturais. O “Dom Quixote” de Cervantes, a pintura de corte de Velázquez, as peças de Lope de Vega — as coroas unidas de Aragão e Castela governaram no auge da cultura europeia."
 STATIC_MODIFIER_NAME_ara_city_of_the_worlds_desire_mod: "Senhor do Bósforo"
 STATIC_MODIFIER_DESC_ara_city_of_the_worlds_desire_mod: "O brilho do império que detém Constantinopla elevou seu prestígio e legitimidade e fortaleceu sua mão nas negociações de guerra como nunca antes."
 STATIC_MODIFIER_NAME_ara_plus_ultra_mod: "Zelo das Expedições Além-Mar"
 STATIC_MODIFIER_DESC_ara_plus_ultra_mod: "O espírito de exploração além dos limites ampliou o alcance de nossas frotas coloniais e navais."
 STATIC_MODIFIER_NAME_ara_african_outposts_mod: "Cabeças de Ponte nas Canárias"
 STATIC_MODIFIER_DESC_ara_african_outposts_mod: "Nossas cabeças de ponte ao longo da costa africana ampliaram o alcance dos navios mercantes do reino."
 STATIC_MODIFIER_NAME_ara_gold_coast_trade_mod: "Rede do Comércio de Ouro"
 STATIC_MODIFIER_DESC_ara_gold_coast_trade_mod: "O comércio com a Costa do Ouro elevou a renda comercial do reino e o alcance de seus mercadores."
 STATIC_MODIFIER_NAME_ara_discover_the_new_world_mod: "Espírito da Frota Oceânica"
 STATIC_MODIFIER_DESC_ara_discover_the_new_world_mod: "A abertura da porta ao Novo Mundo acelerou o fluxo de emigrantes no reino."
 STATIC_MODIFIER_NAME_ara_caribbean_foothold_mod: "Assentamentos de Hispaniola"
 STATIC_MODIFIER_DESC_ara_caribbean_foothold_mod: "Nossa cabeça de ponte no Novo Mundo elevou sua atratividade para colonos."
 STATIC_MODIFIER_NAME_ara_conquest_of_the_incas_mod: "O Legado dos Conquistadores"
 STATIC_MODIFIER_DESC_ara_conquest_of_the_incas_mod: "Em 1532, Francisco Pizarro capturou o imperador inca Atahualpa e conquistou o Império Inca. A pilhagem da maior civilização do ouro do mundo trouxe à Espanha riqueza sem precedentes, e, com a descoberta das minas de prata de Potosí, enormes quantidades do metal precioso fluíram do Novo Mundo à Europa."
 STATIC_MODIFIER_NAME_ara_new_kingdom_of_aragon_mod: "A Coroa das Américas"
 STATIC_MODIFIER_DESC_ara_new_kingdom_of_aragon_mod: "A construção do Novo Reino de Aragão é um grande empreendimento colonial para transplantar o legado de Aragão ao Novo Mundo. No sistema da encomienda, que envolvia o trabalho nativo, prata, ouro, açúcar e corantes continuam a ser enviados à metrópole."
 STATIC_MODIFIER_NAME_ara_route_to_the_indies_mod: "Bússola dos Navegantes"
 STATIC_MODIFIER_DESC_ara_route_to_the_indies_mod: "A abertura da rota para as Índias ampliou o alcance operacional de nossa frota."
 STATIC_MODIFIER_NAME_ara_spice_trade_outposts_mod: "Casa Comercial das Molucas"
 STATIC_MODIFIER_DESC_ara_spice_trade_outposts_mod: "Especiarias como pimenta, noz-moscada e cravo custavam, na Europa medieval, tanto quanto o ouro. Romper essa rota comercial, monopolizada por mercadores muçulmanos e Veneza, e estabelecer cabeças de ponte diretamente na fonte — essa é a fonte da riqueza imperial."
 STATIC_MODIFIER_NAME_ara_las_filipinas_mod: "Estação Intermediária do Pacífico"
 STATIC_MODIFIER_DESC_ara_las_filipinas_mod: "O arquipélago das Filipinas coube a Magalhães (1521) e, depois, com Manila, em Luzon, como base, tornou-se o centro do “comércio dos galeões”. Por essa rota, que liga Acapulco, no México, e Manila, a prata do Novo Mundo era trocada sem cessar por seda e porcelana chinesas."
 STATIC_MODIFIER_NAME_ara_empire_of_the_three_oceans_mod: "O Império em que o Sol Nunca se Põe"
 STATIC_MODIFIER_DESC_ara_empire_of_the_three_oceans_mod: "O brilho do império que abarca três oceanos elevou a renda comercial do reino e o alcance de seus mercadores como nunca antes."
 ara_events.1.t: "A Ascensão de Pedro IV"
 ara_events.1.d: "Em 1336, Afonso IV morreu, e seu filho Pedro IV subiu ao trono da Coroa de Aragão. Em 1337, o reino é uma frouxa união de terras da Catalunha, de Aragão, de Valência e das Baleares. O controle sobre a Sardenha permanece instável, e as relações com a vizinha Castela carregam constante tensão. As potências comerciais, que governam as rotas comerciais do Mediterrâneo, detêm grande influência, e a coroa deve governar em harmonia com os privilégios desses diversos reinos. Diante do jovem rei Pedro IV estende-se um longo caminho rumo a uma Ibéria unida e à supremacia no Mediterrâneo."
 ara_events.1.a: "Começa um novo governo"
 ara_events.2.t: "Incorporação do Reino de Maiorca"
 ara_events.2.d: "O Reino de Maiorca, outrora fundado por Jaime II como ramo mais jovem da casa real aragonesa, há muito permanece na esfera de influência aragonesa, apesar de suas posses nas Baleares, no Rossilhão e em Montpellier. Chegou a hora de sua plena incorporação. Seja totalmente anexada e tornada parte de Aragão, seja mantida como vassalo amistoso — em qualquer caso, Maiorca cairá sob a coroa aragonesa."
 ara_events.2.a: "Anexar por completo Maiorca"
 ara_events.2.b: "Manter Maiorca como vassalo amistoso"
 STATIC_MODIFIER_NAME_ara_seize_sicily_mod: "Glória da Tomada da Sicília"
 STATIC_MODIFIER_DESC_ara_seize_sicily_mod: "Os sicilianos, que expulsaram a casa de Anjou nas “Vésperas Sicilianas” de 1282, saudaram Pedro III de Aragão como seu novo rei. Desde então, a Sicília foi importante posse da casa real aragonesa e continuou a servir de chave estratégica que domina o Mediterrâneo central."
