l_braz_por:
 hol_holland_mission_pack: "A Verdadeira Liberdade — Do Condado da Holanda às Províncias Unidas"
 hol_holland_mission_pack_DESCRIPTION:0 "O Condado da Holanda, governado pela casa de Avesnes — triunfe sobre a Liga Hanseática, absorva Hainaut e Brabante, conquiste a independência da tirania espanhola e construa uma era de ouro como verdadeira república sem monarca."
 hol_holland_mission_pack_CRITERIA_DESCRIPTION:0 "Una o condado, conquiste a independência e alcance a era de ouro como república sob a soberania dos Estados."
 hol_holland_mission_pack_BUTTON_TOOLTIP:0 "De pequeno condado a república unida de comércio e liberdade."
 hol_holland_mission_pack_BUTTON_DETAILS:0 "“A união faz a força” — construa uma verdadeira república sem monarca por todos os Países Baixos!"
 hol_county_of_holland: "O Condado da Holanda"
 hol_county_of_holland_desc: "O Condado da Holanda, no coração dos Países Baixos, dotado de vias fluviais e comércio — o idoso conde Guilherme III, da casa de Avesnes, aproxima-se do fim de seu governo."
 hol_secure_dordrecht: "Desenvolva Dordrecht"
 hol_secure_dordrecht_desc: "Dordrecht, antiga cidade comercial na confluência do Reno e do Mosa — construa sobre seu direito de entreposto concedido e traga novo desenvolvimento."
 hol_hoekse_kabeljauwse: "Anzóis e Bacalhaus"
 hol_hoekse_kabeljauwse_desc: "A facção nobre dos Anzóis (Hoeken) e a facção urbana dos Bacalhaus (Kabeljauwen) — reprima essa disputa interna, que dividia o condado por causa da sucessão condal, e estabeleça um governo estável."
 hol_zeeland_unification: "Una a Zelândia"
 hol_zeeland_unification_desc: "A Zelândia, terra de ilhas, espalhada pelo Mar do Norte — incorpore essa região ao domínio do condado."
 hol_frisian_freedom: "A Liberdade da Frísia Ocidental"
 hol_frisian_freedom_desc: "O povo da Frísia Ocidental, que preza sua autonomia — conceda-lhes liberdade sob o estandarte do condado."
 hol_utrecht_relations: "Relações com Utrecht"
 hol_utrecht_relations_desc: "O Bispado de Utrecht, que detém vasto poder secular — construa relações com esse vizinho sob nossa influência."
 hol_wittelsbach_inheritance: "União com Hainaut"
 hol_wittelsbach_inheritance_desc: "Por meio da princesa Margarida, casada com o imperador Luís IV, aprofunde o vínculo com o vizinho Condado de Hainaut — por casamento, subjugação ou extinção, una a Holanda, a Zelândia e Hainaut sob um só estandarte."
 hol_herring_industry: "Desenvolva a Indústria do Arenque"
 hol_herring_industry_desc: "A pesca do arenque, conhecida como a “Grande Pesca” (grote visserij) — desenvolva ainda mais esse grande ramo da indústria, junto com a arte da salga."
 hol_hansa_rivalry: "Rivalidade com a Hansa"
 hol_hansa_rivalry_desc: "A Liga Hanseática, que domina o comércio do Báltico — armado de fretes baratos e eficientes navios mercantes, triunfe sobre essa venerável liga."
 hol_amsterdam_rise: "A Ascensão de Amsterdã"
 hol_amsterdam_rise_desc: "Amsterdã, pequena aldeia de pescadores às margens do IJ — desenvolva esse lugar num grande nó do comércio do Mar do Norte."
 hol_moedernegotie: "O Comércio Mãe (Moedernegotie)"
 hol_moedernegotie_desc: "O comércio báltico de grãos — domine esse comércio, chamado “mãe de todo comércio”, e faça dele a base da prosperidade."
 hol_contest_brabant: "Ambições sobre Brabante"
 hol_contest_brabant_desc: "O Ducado de Brabante, segunda grande potência dos Países Baixos — volte o olhar da ambição para essa terra."
 hol_absorb_brabant: "Absorva Brabante"
 hol_absorb_brabant_desc: "Anexe ou subjugue o Ducado de Brabante — prove que a Holanda, e não Brabante, é senhora dos Países Baixos."
 hol_reformation_choice: "A Escolha da Reforma"
 hol_reformation_choice_desc: "Os ensinamentos de Lutero e Calvino abalam os Países Baixos — nessa encruzilhada da fé, que caminho escolheremos?"
 hol_calvinist_merchants: "Mercadores Calvinistas"
 hol_calvinist_merchants_desc: "O calvinismo, que prega uma fé frugal e disciplinada — adote essa confissão, que conquistou o coração dos cidadãos-mercadores, como religião de Estado."
 hol_union_of_utrecht: "A União de Utrecht"
 hol_union_of_utrecht_desc: "A União de Utrecht, formada pelas províncias setentrionais dos Países Baixos — erga-se como seu núcleo e enfrente o inimigo comum."
 hol_watergeuzen: "Os Mendigos do Mar (Watergeuzen)"
 hol_watergeuzen_desc: "Corsários que se chamam “Mendigos do Mar” — suas façanhas abrem brechas na dominação espanhola nos mares."
 hol_dutch_republic_proper: "Estabeleça a Verdadeira República"
 hol_dutch_republic_proper_desc: "A federação das sete províncias, de pé como iguais — estabeleça aqui uma verdadeira república de mercadores e cidadãos, sem monarca."
 hol_east_india_company: "Funde a Companhia das Índias Orientais"
 hol_east_india_company_desc: "Funde a Companhia Unida das Índias Orientais (VOC), buscando o monopólio do comércio asiático."
 hol_amsterdam_bank: "O Banco de Amsterdã"
 hol_amsterdam_bank_desc: "Para pôr ordem no caos das moedas rivais, funde o Banco de Câmbio (Wisselbank) e construa um sistema de crédito estável."
 hol_stock_exchange: "A Bolsa de Amsterdã"
 hol_stock_exchange_desc: "A primeira bolsa de valores do mundo, onde se compram e vendem ações — faça desse lugar o centro das finanças europeias."
 hol_dutch_golden_age: "A Era de Ouro Holandesa"
 hol_dutch_golden_age_desc: "Rembrandt, Vermeer e o comércio florescente — alcance o zênite da “Era de Ouro Holandesa”."
 hol_estates_of_holland: "Os Estados da Holanda"
 hol_estates_of_holland_desc: "Os Estados da Holanda, compostos por representantes das cidades — faça dessa assembleia o núcleo do governo republicano."
 hol_regent_oligarchy: "A Oligarquia dos Regentes"
 hol_regent_oligarchy_desc: "Os “Regenten”, ricas famílias de patrícios mercantes — estabeleça seu governo oligárquico como a verdadeira estrutura dirigente da república."
 hol_stadtholderless_era: "A Era sem Stadtholder (a Verdadeira Liberdade)"
 hol_stadtholderless_era_desc: "A era sem stadtholder, em que os Estados detêm a soberania — encarne a “Verdadeira Liberdade”, proclamada por Johan de Witt."
 hol_states_sovereignty: "Estabeleça a Soberania dos Estados"
 hol_states_sovereignty_desc: "A república sem monarca — estabeleça a natureza de sua soberania como instituição duradoura."
 hol_anglo_dutch_rivalry: "A Rivalidade Anglo-Holandesa"
 hol_anglo_dutch_rivalry_desc: "A rivalidade com a Inglaterra pela supremacia no comércio marítimo — enfrente essa rivalidade, simbolizada pelos Atos de Navegação."
 hol_navigation_act_response: "Responda ao Ato de Navegação"
 hol_navigation_act_response_desc: "O Ato de Navegação inglês — oponha-se a essa lei protecionista e defenda nossa frota mercante."
 hol_channel_trade_dominance: "Domínio do Comércio do Canal"
 hol_channel_trade_dominance_desc: "O estreito que liga o Mar do Norte e o Atlântico — estabeleça a supremacia marítima e comercial sobre essa vital via d’água."
 hol_french_relations: "Relações com a França"
 hol_french_relations_desc: "As ambições do Rei Sol, Luís XIV — dê atenta consideração às relações com esse poderoso vizinho."
 hol_rampjaar_survival: "Sobreviva ao Ano do Desastre (Rampjaar)"
 hol_rampjaar_survival_desc: "Em 1672, atingido por invasões simultâneas da Inglaterra e da França — sobreviva a esse “Ano do Desastre”, que ameaça a própria existência da nação."
 hol_glorious_revolution: "Vitória sobre o Rei Sol"
 hol_glorious_revolution_desc: "Tendo sobrevivido ao Ano do Desastre, a República passa agora à ofensiva — impulsione nossos exércitos fundo em terra francesa e force o Rei Sol, Luís XIV, a pagar por suas ambições."
 hol_united_provinces: "As Províncias Unidas dos Países Baixos"
 hol_united_provinces_desc: "Das bases do condado, pela guerra de independência e pela era de ouro, a verdadeira república está aqui concluída."
 hol_events.2.t: "Proclamação das Províncias Unidas"
 hol_events.2.d: "A federação das sete províncias, de pé como iguais — uma verdadeira república de mercadores e cidadãos, sem monarca, respira pela primeira vez."
 hol_events.2.a: "Glória à República!"
 hol_events.3.t: "O Ano do Desastre (Rampjaar)"
 hol_events.3.d: "1672 — invasão simultânea da França, da Inglaterra, de Münster e de Colônia. Descritos como “povo desatinado, governo desamparado, país desesperado”, sobrevivemos a essa crise."
 hol_events.3.a: "A República sobreviveu!"
 hol_events.4.t: "Vitória sobre o Rei Sol"
 hol_events.4.d: "Tendo avançado fundo em território francês, nossos exércitos quebraram enfim as ambições de Luís XIV. O nome da República é agora amplamente conhecido como grande potência da Europa."
 hol_events.4.a: "Glória à República!"
 hol_events.5.t: "Encruzilhada para os Estados da Holanda"
 hol_events.5.d: "Os Estados enfrentam uma escolha de graves consequências sobre a forma de governo da república — inclinar-se para uma ordem monárquica sob um stadtholder, ou manter-se firmes na verdadeira república de cidadãos e mercadores."
 hol_events.5.a: "Concentrar o poder na casa de Orange"
 hol_events.5.b: "Manter a república sob a soberania dos Estados"
 hol_events.99.t: "As Províncias Unidas Concluídas"
 hol_events.99.d: "O longo caminho, iniciado no Condado da Holanda, pela guerra de independência e pela era de ouro, está aqui concluído como verdadeira república."
 hol_events.99.a: "Vivam as Províncias Unidas!"
 STATIC_MODIFIER_NAME_hol_county_mod: "O Condado da Holanda"
 STATIC_MODIFIER_DESC_hol_county_mod: "A memória do condado, criado por vias fluviais e comércio, ainda vive como orgulho do povo."
 STATIC_MODIFIER_NAME_hol_dordrecht_mod: "Dordrecht Desenvolvida"
 STATIC_MODIFIER_DESC_hol_dordrecht_mod: "Na confluência do Reno e do Mosa, os navios mercantes de Dordrecht jamais cessam de carregar e descarregar suas mercadorias."
 STATIC_MODIFIER_NAME_hol_hoekse_mod: "Anzóis e Bacalhaus"
 STATIC_MODIFIER_DESC_hol_hoekse_mod: "Os que outrora ergueram os estandartes dos Anzóis e dos Bacalhaus marcham agora juntos nas fileiras do conde."
 STATIC_MODIFIER_NAME_hol_zeeland_mod: "Zelândia Unificada"
 STATIC_MODIFIER_DESC_hol_zeeland_mod: "Nas carreiras de Middelburg, a madeira, colhida nas ilhas, toma forma casco após casco."
 STATIC_MODIFIER_NAME_hol_frisian_mod: "A Liberdade da Frísia Ocidental"
 STATIC_MODIFIER_DESC_hol_frisian_mod: "“Os frísios não têm senhor” — esse orgulhoso espírito de autonomia reúne muitos nas fileiras quando a hora o exige."
 STATIC_MODIFIER_NAME_hol_utrecht_mod: "Relações com Utrecht"
 STATIC_MODIFIER_DESC_hol_utrecht_mod: "Os sinos das torres de Utrecht dobram a silenciosa e calorosa vizinhança entre o condado e o bispado."
 STATIC_MODIFIER_NAME_hol_wittelsbach_mod: "União com Hainaut"
 STATIC_MODIFIER_DESC_hol_wittelsbach_mod: "Uma nova linha de governantes da Baviera traz ordem às terras da Holanda, da Zelândia e de Hainaut."
 STATIC_MODIFIER_NAME_hol_absorb_brabant_mod: "Brabante Absorvida"
 STATIC_MODIFIER_DESC_hol_absorb_brabant_mod: "O brasão da Holanda pende agora na corte de Bruxelas, e a riqueza do sul flui com constância a Amsterdã."
 STATIC_MODIFIER_NAME_hol_herring_mod: "Indústria do Arenque Desenvolvida"
 STATIC_MODIFIER_DESC_hol_herring_mod: "Frotas, carregadas de arenque salgado, voltam para casa pelas ondas do Mar do Norte, uma após outra."
 STATIC_MODIFIER_NAME_hol_hansa_rivalry_mod: "Rivalidade com a Hansa"
 STATIC_MODIFIER_DESC_hol_hansa_rivalry_mod: "Enquanto os mercadores de Lübeck franzem o cenho, nossas tarifas de frete baratas conquistam os embarcadores por todo o Báltico."
 STATIC_MODIFIER_NAME_hol_amsterdam_rise_mod: "A Ascensão de Amsterdã"
 STATIC_MODIFIER_DESC_hol_amsterdam_rise_mod: "Outrora pequena aldeia de pescadores junto ao IJ, Amsterdã atrai agora veleiros de todos os cantos do mundo."
 STATIC_MODIFIER_NAME_hol_moedernegotie_mod: "O Comércio Mãe"
 STATIC_MODIFIER_DESC_hol_moedernegotie_mod: "O grão, trazido do Báltico, mantém nossas mesas e nosso tesouro cheios até em anos de fome."
 STATIC_MODIFIER_NAME_hol_reformation_mod: "A Escolha da Reforma"
 STATIC_MODIFIER_DESC_hol_reformation_mod: "Entre os sinos das igrejas, silenciosos debates sobre a velha e a nova fé nunca cessam nas praças do mercado."
 STATIC_MODIFIER_NAME_hol_calvinist_mod: "Mercadores Calvinistas"
 STATIC_MODIFIER_DESC_hol_calvinist_mod: "Lâmpadas ardem até tarde da noite nas casas dos mercadores, onde a Bíblia é lida e meditada em primeira mão."
 STATIC_MODIFIER_NAME_hol_union_utrecht_mod: "A União de Utrecht"
 STATIC_MODIFIER_DESC_hol_union_utrecht_mod: "O pacto, assinado em Utrecht, tornou-se a esperança a que se agarra toda província setentrional."
 STATIC_MODIFIER_NAME_hol_watergeuzen_mod: "Os Mendigos do Mar"
 STATIC_MODIFIER_DESC_hol_watergeuzen_mod: "“Melhor mendigos que homens do rei” — com esse grito na memória, nossos marinheiros ainda caçam a bandeira espanhola."
 STATIC_MODIFIER_NAME_hol_voc_mod: "A Companhia das Índias Orientais"
 STATIC_MODIFIER_DESC_hol_voc_mod: "O aroma das especiarias de Batávia enche o bairro dos armazéns de Amsterdã."
 STATIC_MODIFIER_NAME_hol_wisselbank_mod: "O Banco de Amsterdã"
 STATIC_MODIFIER_DESC_hol_wisselbank_mod: "A confiança, guardada nos cofres do Banco de Câmbio, é a mais verdadeira segurança que os mercadores dessa cidade possuem."
 STATIC_MODIFIER_NAME_hol_wisselbank_capital_mod: "Capital do Banco de Câmbio"
 STATIC_MODIFIER_DESC_hol_wisselbank_capital_mod: "Com os livros do tesouro e os cofres do Banco de Câmbio sob um só teto, os assuntos do Estado correm com mais suavidade."
 STATIC_MODIFIER_NAME_hol_exchange_mod: "A Bolsa de Amsterdã"
 STATIC_MODIFIER_DESC_hol_exchange_mod: "No pregão da bolsa, os gritos dos corretores, que agitam seus certificados de ações, jamais silenciam."
 STATIC_MODIFIER_NAME_hol_golden_age_mod: "A Era de Ouro Holandesa"
 STATIC_MODIFIER_DESC_hol_golden_age_mod: "A luz e a sombra, capturadas pelo pincel de Rembrandt, contarão sobre essa era de prosperidade por gerações."
 STATIC_MODIFIER_NAME_hol_regent_mod: "A Oligarquia dos Regentes"
 STATIC_MODIFIER_DESC_hol_regent_mod: "As silenciosas assembleias de ricas famílias de patrícios são o lugar onde são tomadas as verdadeiras decisões da república."
 STATIC_MODIFIER_NAME_hol_stadtholderless_mod: "A Era sem Stadtholder"
 STATIC_MODIFIER_DESC_hol_stadtholderless_mod: "A cadeira do stadtholder está vazia — e, no entanto, os assuntos do Estado correm mais suaves que nunca."
 STATIC_MODIFIER_NAME_hol_anglo_rivalry_mod: "A Rivalidade Anglo-Holandesa"
 STATIC_MODIFIER_DESC_hol_anglo_rivalry_mod: "As repetidas trocas de fogo de canhão com nossa rival do outro lado do Canal forjaram nossos marinheiros em veteranos experimentados."
 STATIC_MODIFIER_NAME_hol_navigation_act_mod: "Resposta ao Ato de Navegação"
 STATIC_MODIFIER_DESC_hol_navigation_act_mod: "Imperturbadas pelos regulamentos ingleses, nossas frotas mercantes continuam a encontrar brechas que mantêm as rotas comerciais abertas."
 STATIC_MODIFIER_NAME_hol_channel_dominance_mod: "Domínio do Comércio do Canal"
 STATIC_MODIFIER_DESC_hol_channel_dominance_mod: "Tornou-se raro ver, nesse estreito entre o Mar do Norte e o Atlântico, um navio que não leve nossas cores."
 STATIC_MODIFIER_NAME_hol_french_relations_mod: "Relações com a França"
 STATIC_MODIFIER_DESC_hol_french_relations_mod: "Rumores inquietantes da corte do Rei Sol mantêm nossas guarnições de fronteira sempre alertas."
 STATIC_MODIFIER_NAME_hol_united_provinces_mod: "As Províncias Unidas dos Países Baixos"
 STATIC_MODIFIER_DESC_hol_united_provinces_mod: "A unidade das sete províncias sem monarca tornou nosso nome conhecido em todo mar e mercado do mundo."
 STATIC_MODIFIER_NAME_hol_rampjaar_mod: "Sobrevivência ao Ano do Desastre"
 STATIC_MODIFIER_DESC_hol_rampjaar_mod: "“Povo desatinado, governo desamparado, país desesperado” — tendo sacudido esse veredicto, nossos soldados carregam essa memória com orgulho."
 STATIC_MODIFIER_NAME_hol_glorious_revolution_mod: "Vitória sobre o Rei Sol"
 STATIC_MODIFIER_DESC_hol_glorious_revolution_mod: "Histórias da marcha de nosso exército fundo em terra francesa são agora contadas com orgulho em todas as cortes da Europa."
 STATIC_MODIFIER_NAME_hol_republic_declared_mod: "República Proclamada"
 STATIC_MODIFIER_DESC_hol_republic_declared_mod: "Delegados de cidadãos e mercadores reúnem-se agora com orgulho numa câmara, que não se submete a monarca algum."
