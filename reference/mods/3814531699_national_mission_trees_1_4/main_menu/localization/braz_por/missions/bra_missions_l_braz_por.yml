l_braz_por:
 bra_brandenburg_mission_pack: "Sangue e Ferro — De Brandemburgo ao Império Alemão"
 bra_brandenburg_mission_pack_DESCRIPTION:0 "De pequena marca da casa de Ascânia, construa o Reino da Prússia sob os Hohenzollern e alcance a unificação da Alemanha por sangue e ferro."
 bra_brandenburg_mission_pack_CRITERIA_DESCRIPTION:0 "Estabeleça a marca, forme o Reino da Prússia e conclua o Império Alemão."
 bra_brandenburg_mission_pack_BUTTON_TOOLTIP:0 "Do areal do Sacro Império Romano à hegemonia da Europa."
 bra_brandenburg_mission_pack_BUTTON_DETAILS:0 "As grandes questões do dia não se decidem por discursos nem por votos de maioria, mas por sangue e ferro — una a Alemanha!"
 bra_ascanian_legacy: "O Legado dos Ascânios"
 bra_ascanian_legacy_desc: "Herde a marca de Brandemburgo construída pela casa de Ascânia e inicie uma nova era de governo."
 bra_march_authority: "Estabeleça a Autoridade do Margrave"
 bra_march_authority_desc: "Subjugue as terras fragmentadas da nobreza e faça a autoridade do margrave alcançar todo o país."
 bra_turmoil_ended_tt: "O desastre “Tumulto em Brandemburgo” terminou"
 bra_altmark_secure: "Assegure a Altmark"
 bra_altmark_secure_desc: "A Altmark, pátria da marca — torne inabalável seu governo."
 bra_neumark_colonization: "Colonize a Neumark"
 bra_neumark_colonization_desc: "Avance a colonização para o leste, até a Neumark, além do Oder, e construa novos povoados."
 bra_uckermark_integration: "Integre a Uckermark"
 bra_uckermark_integration_desc: "Integre por completo a Uckermark à marca."
 bra_pomeranian_rivalry: "Rivalidade com a Pomerânia"
 bra_pomeranian_rivalry_desc: "Resolva a rivalidade com o ducado da Pomerânia pelo acesso ao Báltico."
 bra_wendish_lands: "As Terras Vendas"
 bra_wendish_lands_desc: "Esta terra é a pátria dos cassúbios, descendentes dos vendos eslavos — acolha sua cultura com tolerância e aprofunde sua compreensão dos costumes alemães, mostrando que os dois povos podem coexistir."
 bra_berlin_dev: "Desenvolva Berlim"
 bra_berlin_dev_desc: "Berlim, cidade às margens do Spree que cresceu até o coração da marca após a união com Cölln — desenvolva-a mais."
 bra_electoral_dignity: "Dignidade Eleitoral"
 bra_electoral_dignity_desc: "Estabeleça seu status de eleitor do Sacro Império Romano e eleve seu prestígio nele."
 bra_hohenzollern_investiture: "Investidura dos Hohenzollern"
 bra_hohenzollern_investiture_desc: "Em 1417, o imperador Sigismundo concedeu o título eleitoral à casa de Hohenzollern — estabeleça o governo dessa nova dinastia."
 bra_hohenzollern_dynasty: "Dinastia Hohenzollern Assegurada"
 bra_hohenzollern_dynasty_desc: "Faça do sangue dos Hohenzollern o pilar do Estado e assente a base de um governo duradouro."
 bra_imperial_diet: "Voz na Dieta Imperial"
 bra_imperial_diet_desc: "Reforce sua voz na Dieta Imperial e assuma um papel na política imperial."
 bra_reformation_choice: "A Escolha da Reforma"
 bra_reformation_choice_desc: "O ensinamento de Lutero abala toda a Alemanha — Brandemburgo também deve escolher sua fé."
 bra_secularize_prussia: "Secularize a Prússia"
 bra_secularize_prussia_desc: "Incentive a secularização do Estado da Ordem Teutônica e traga a Prússia à influência de Brandemburgo."
 bra_cleves_inheritance: "A Herança de Cleves"
 bra_cleves_inheritance_desc: "Vença a guerra da sucessão de Jülich, no Reno, e assegure o exclave ocidental."
 bra_thirty_years_war: "Sobreviva à Guerra dos Trinta Anos"
 bra_thirty_years_war_desc: "A Guerra dos Trinta Anos devasta a Alemanha — sobreviva a essa calamidade e preserve a marca."
 bra_great_elector: "O Governo do Grande Eleitor"
 bra_great_elector_desc: "Sob Frederico Guilherme, mais tarde chamado “Grande Eleitor”, reconstrua a força do Estado."
 bra_standing_army: "Estabeleça um Exército Permanente"
 bra_standing_army_desc: "Crie um exército permanente, subordinado diretamente ao eleitor, independente das milícias da nobreza."
 bra_absolutism: "Estabeleça o Absolutismo"
 bra_absolutism_desc: "Subjugue o poder dos estamentos e construa um Estado em que a vontade do eleitor alcança todos os cantos."
 bra_sovereign_prussia: "Soberania sobre a Prússia"
 bra_sovereign_prussia_desc: "Pelo Tratado de Oliva, livre-se da suserania polonesa sobre o ducado da Prússia."
 bra_king_in_prussia: "Coroado Rei na Prússia"
 bra_king_in_prussia_desc: "Em 1701, em Königsberg, Frederico I coroou-se “Rei na Prússia”."
 bra_prussian_administration: "A Administração Prussiana"
 bra_prussian_administration_desc: "Estabeleça uma burocracia eficiente e disciplinada e siga o caminho do Estado moderno."
 bra_junker_integration: "Integre os Junkers"
 bra_junker_integration_desc: "Faça da nobreza proprietária de terras a leste do Elba, os junkers, o núcleo do exército e da administração."
 bra_potsdam_dev: "Desenvolva Potsdam"
 bra_potsdam_dev_desc: "Desenvolva Potsdam, sede da residência real, como centro da cultura de corte."
 bra_soldier_king: "O Legado do Rei-Soldado"
 bra_soldier_king_desc: "Herde o legado frugal e militarizado de Frederico Guilherme I, o “Rei-Soldado”."
 bra_royal_treasury: "O Tesouro Real Cheio"
 bra_royal_treasury_desc: "Com gestão financeira frugal, construa um dos tesouros mais cheios da Europa."
 bra_silesian_ambition: "Ambições sobre a Silésia"
 bra_silesian_ambition_desc: "Reivindique com legitimidade a rica Silésia, governada pela casa de Habsburgo."
 bra_first_silesian_war: "A Primeira Guerra da Silésia"
 bra_first_silesian_war_desc: "O jovem Frederico II marcha sobre a Silésia numa invasão relâmpago."
 bra_silesia_annexed: "Silésia Anexada"
 bra_silesia_annexed_desc: "Anexe por completo a rica região mineira e industrial da Silésia como base econômica da Prússia."
 bra_prussian_enlightenment: "O Iluminismo Prussiano"
 bra_prussian_enlightenment_desc: "O pensamento iluminista floresce sob Frederico, o Grande — realize o ideal de que “o rei é o primeiro servidor do Estado”."
 bra_seven_years_war: "Sobreviva à Guerra dos Sete Anos"
 bra_seven_years_war_desc: "A Guerra dos Sete Anos põe toda a Europa contra você — sobreviva a essa prova e defenda seu status de grande potência."
 bra_frederick_the_great: "O Legado de Frederico, o Grande"
 bra_frederick_the_great_desc: "Leve o legado do grande rei, lembrado como “Frederico, o Grande”, à era seguinte."
 bra_partitions_of_poland: "Participe das Partilhas da Polônia"
 bra_invasion_of_poland: "Invasão da Polônia"
 bra_invasion_of_poland_desc: "Leve nossas forças à Grande Polônia e arranque território desse vizinho enfraquecido."
 bra_partitions_of_poland_desc: "Junte-se à partilha da decadente Comunidade Polaco-Lituana e tome a Prússia Ocidental."
 bra_prussian_academy: "A Academia de Ciências Prussiana"
 bra_prussian_academy_desc: "Cultive a Academia de Ciências de Berlim e torne-se centro de ciência e erudição."
 bra_prussian_army_reform: "Reforma do Exército Prussiano"
 bra_prussian_army_reform_desc: "Qualidade ou quantidade — defina o caráter do exército prussiano e enraíze uma doutrina militar singular no Estado."
 bra_napoleonic_crisis: "A Crise Napoleônica"
 bra_napoleonic_crisis_desc: "A derrota em Jena-Auerstedt — diante de Napoleão, a Prússia enfrenta uma crise de sobrevivência."
 bra_stein_hardenberg_reforms: "As Reformas de Stein-Hardenberg"
 bra_stein_hardenberg_reforms_desc: "Chegou a hora de desafiar os fundamentos financeiros de uma França ainda dominante — pela libertação dos servos e pela reforma administrativa, alcance a recuperação da crise."
 bra_rhineland_acquisition: "Adquira a Renânia"
 bra_rhineland_acquisition_desc: "Tome as ricas terras ao longo do Reno e assente a base da industrialização."
 bra_show_of_strength: "Demonstração de Força"
 bra_show_of_strength_desc: "Antes de estender a mão aos vastos espaços da Alemanha, mostre o poder da Prússia aos príncipes do norte."
 bra_lower_saxony_conquest: "Conquiste a Baixa Saxônia"
 bra_lower_saxony_conquest_desc: "Derrote nossos rivais em Lüneburg e Magdeburgo, assegure o porto de Emden e amplie nosso alcance por toda a Baixa Saxônia."
 bra_westphalian_conquest: "Conquista da Vestfália"
 bra_westphalian_conquest_desc: "Estenda nossa hegemonia sobre o norte da Alemanha mais a oeste, até as terras da Vestfália."
 bra_zollverein: "O Zollverein"
 bra_zollverein_desc: "Lidere a União Aduaneira (Zollverein), que une economicamente os Estados alemães."
 bra_prussian_constitution: "A Constituição Prussiana"
 bra_prussian_constitution_desc: "Estabeleça as bases da monarquia constitucional por meio da constituição de 1850."
 bra_army_reform_1860s: "Reforma Militar da Década de 1860"
 bra_army_reform_1860s_desc: "As reformas militares de Roon e Moltke — leve a doutrina militar anteriormente escolhida, de qualidade ou quantidade, a alturas ainda maiores."
 bra_danish_war: "Guerra contra a Dinamarca"
 bra_danish_war_desc: "Empunhe armas contra a Dinamarca pela questão de Schleswig-Holstein."
 bra_austro_prussian_war: "A Guerra Austro-Prussiana"
 bra_austro_prussian_war_desc: "Resolva a questão na batalha de Sadowa e vença a liderança da Alemanha."
 bra_north_german_confederation: "A Confederação da Alemanha do Norte"
 bra_north_german_confederation_desc: "Una os Estados alemães ao norte do Meno, exceto a Áustria, e estabeleça a Confederação da Alemanha do Norte."
 bra_south_german_states: "Aliança com os Estados do Sul da Alemanha"
 bra_south_german_states_desc: "Forje alianças militares com os Estados sul-alemães da Baviera, Württemberg e outros."
 bra_franco_prussian_war: "A Guerra Franco-Prussiana"
 bra_franco_prussian_war_desc: "Provocada pelo Telegrama de Ems, aceite a guerra decisiva contra o Segundo Império Francês."
 bra_alsace_lorraine_annexed: "Alsácia-Lorena Anexadas"
 bra_alsace_lorraine_annexed_desc: "Anexe a Alsácia e a Lorena como espólio de guerra, gravando a inimizade eterna com a França."
 bra_german_empire: "Império Alemão Estabelecido"
 bra_german_empire_desc: "Estabeleça o Império Alemão, com o rei da Prússia como imperador, a mais nova grande potência da Europa."
 bra_kulturkampf: "O Kulturkampf"
 bra_kulturkampf_desc: "Subjugue a influência da Igreja Católica e redefina as relações entre o Estado e a igreja."
 bra_social_legislation: "Legislação de Seguridade Social"
 bra_social_legislation_desc: "Estabeleça sistemas de seguro de saúde, acidentes e velhice como contrapeso ao socialismo."
 bra_colonial_empire: "O Império Colonial"
 bra_colonial_empire_desc: "Buscando um “lugar ao sol”, construa colônias na África e no Pacífico."
 bra_high_seas_fleet: "A Frota de Alto-Mar"
 bra_high_seas_fleet_desc: "Sob o comando do almirante Tirpitz, construa uma Frota de Alto-Mar capaz de rivalizar com a Grã-Bretanha."
 bra_weltpolitik: "Weltpolitik"
 bra_weltpolitik_desc: "Sob a bandeira da “política mundial” de Guilherme II, ocupe seu lugar entre as grandes potências do mundo."
 bra_berlin_metropolis: "A Grande Berlim Concluída"
 bra_berlin_metropolis_desc: "Desenvolva Berlim numa metrópole mundial, capaz de rivalizar com Paris e Londres."
 bra_ruhr_industry_complete: "A Indústria do Ruhr Concluída"
 bra_ruhr_industry_complete_desc: "Leve o poderio industrial do Ruhr ao limite, tornando-se uma das grandes potências da indústria pesada do mundo."
 bra_german_science: "A Ascensão da Ciência Alemã"
 bra_german_science_desc: "Construa uma era de ouro da ciência alemã, liderando o mundo em física e química."
 bra_naval_race: "A Corrida Naval"
 bra_naval_race_desc: "Vença a corrida armamentista naval com a Grã-Bretanha e mostre um poderio naval capaz de rivalizar com o mundo."
 bra_balkan_influence: "Influência nos Bálcãs"
 bra_balkan_influence_desc: "Por meio de nosso aliado austríaco, amplie a influência sobre a Península Balcânica."
 bra_ottoman_partnership: "Parceria com os Otomanos"
 bra_ottoman_partnership_desc: "Firme uma aliança com o “homem doente” da Europa, o Império Otomano, como cabeça de ponte para o Oriente."
 bra_mitteleuropa: "Mitteleuropa"
 bra_mitteleuropa_desc: "Promova a visão de “Mitteleuropa”, que une a Europa Central numa esfera econômica alemã."
 bra_grossdeutschland: "A Grande Alemanha"
 bra_grossdeutschland_desc: "Realize enfim o ideal da “Grande Alemanha”, que inclui também a Áustria."
 bra_hegemon_of_europe: "Hegemon da Europa"
 bra_hegemon_of_europe_desc: "Estabeleça uma hegemonia incontestada sobre a Europa em economia, força militar e diplomacia."
 bra_second_reich_eternal: "O Segundo Reich Eterno"
 bra_second_reich_eternal_desc: "De pequena marca de fronteira a um império que governa a Europa — a história da casa de Hohenzollern alcança seu cumprimento."
 bra_events.1.t: "Rei na Prússia"
 bra_events.1.d: "Em 18 de janeiro de 1701, em Königsberg, Frederico I coroou-se “Rei na Prússia”. O eleitor de Brandemburgo é agora ele próprio rei."
 bra_events.1.a: "Glória ao Rei! Reino da Prússia estabelecido!"
 bra_events.2.t: "A Proclamação em Versalhes"
 bra_events.2.d: "Em 18 de janeiro de 1871, no Salão dos Espelhos de Versalhes, o rei Guilherme I da Prússia foi proclamado Imperador Alemão. A era das divisões acabou, e nasce o Império Alemão unificado."
 bra_events.2.a: "Glória ao Imperador! Glória ao Império Alemão!"
 bra_events.99.t: "O Segundo Reich Eterno"
 bra_events.99.d: "A longa estrada, iniciada com a pequena marca da casa de Ascânia, alcançou seu destino. Sob os Hohenzollern, a Alemanha governa agora um império sem igual na Europa."
 bra_events.99.a: "Glória à Alemanha! Glória ao Segundo Reich!"
 STATIC_MODIFIER_NAME_bra_ascanian_mod: "O Legado dos Ascânios"
 STATIC_MODIFIER_DESC_bra_ascanian_mod: "A memória dos ascânios, cujo urso heráldico um dia marcou as marcas, permanece gravada nas pedras dos castelos de fronteira."
 STATIC_MODIFIER_NAME_bra_march_mod: "Autoridade do Margrave Estabelecida"
 STATIC_MODIFIER_DESC_bra_march_mod: "Éditos selados com o selo do margrave vão de propriedade em propriedade, e até os senhores se submetem agora."
 STATIC_MODIFIER_NAME_bra_altmark_mod: "Altmark Assegurada"
 STATIC_MODIFIER_DESC_bra_altmark_mod: "As defesas da Altmark, pátria da marca, reforçadas."
 STATIC_MODIFIER_NAME_bra_neumark_mod: "Neumark Colonizada"
 STATIC_MODIFIER_DESC_bra_neumark_mod: "Além do Oder, colonos alemães cravam seus arados nas terras selvagens da Neumark."
 STATIC_MODIFIER_NAME_bra_pomerania_mod: "Rivalidade com a Pomerânia"
 STATIC_MODIFIER_DESC_bra_pomerania_mod: "As longas rixas com os duques da Pomerânia ensinaram aos senhores da marca a governar a terra conquistada."
 STATIC_MODIFIER_NAME_bra_uckermark_mod: "Uckermark Integrada"
 STATIC_MODIFIER_DESC_bra_uckermark_mod: "As férteis terras da Uckermark figuram agora nos livros dos coletores de impostos do margrave."
 STATIC_MODIFIER_NAME_bra_berlin_mod: "Berlim Desenvolvida"
 STATIC_MODIFIER_DESC_bra_berlin_mod: "Berlim prospera como coração da marca."
 STATIC_MODIFIER_NAME_bra_electoral_mod: "Dignidade Eleitoral"
 STATIC_MODIFIER_DESC_bra_electoral_mod: "Embaixadores com o selo do eleitor ocupam agora lugar ao lado dos príncipes na corte do imperador."
 STATIC_MODIFIER_NAME_bra_hohenzollern_mod: "Investidura dos Hohenzollern"
 STATIC_MODIFIER_DESC_bra_hohenzollern_mod: "A família, nascida dos burgraves de Nuremberga, ergue agora o estandarte de uma nova dinastia nos castelos de Brandemburgo."
 STATIC_MODIFIER_NAME_bra_dynasty_mod: "Dinastia Assegurada"
 STATIC_MODIFIER_DESC_bra_dynasty_mod: "O sangue dos Hohenzollern é agora reconhecido como autoridade indiscutível, tanto nos castelos de fronteira quanto na corte."
 STATIC_MODIFIER_NAME_bra_diet_mod: "Voz na Dieta"
 STATIC_MODIFIER_DESC_bra_diet_mod: "Na Dieta Imperial de Regensburg, os príncipes escutam com atenção quando fala o enviado de Brandemburgo."
 STATIC_MODIFIER_NAME_bra_reformation_mod: "A Escolha da Reforma"
 STATIC_MODIFIER_DESC_bra_reformation_mod: "Sob um eleitor que adotou a doutrina de Lutero, seus súditos aprendem tolerância pelas diferenças de fé."
 STATIC_MODIFIER_NAME_bra_secularize_mod: "Prússia Secularizada"
 STATIC_MODIFIER_DESC_bra_secularize_mod: "As rendas das terras, antes bispados, são agora administradas pelos funcionários do próprio eleitor."
 STATIC_MODIFIER_NAME_bra_cleves_mod: "A Herança de Cleves"
 STATIC_MODIFIER_DESC_bra_cleves_mod: "O exclave ocidental de Cleves traz nova riqueza ao tesouro."
 STATIC_MODIFIER_NAME_bra_thirty_years_mod: "A Prova da Guerra dos Trinta Anos"
 STATIC_MODIFIER_DESC_bra_thirty_years_mod: "A experiência de sobreviver à guerra tornou-se a chave para a defesa da pátria."
 STATIC_MODIFIER_NAME_bra_great_elector_mod: "O Governo do Grande Eleitor"
 STATIC_MODIFIER_DESC_bra_great_elector_mod: "O nome do Grande Eleitor, vencedor em Fehrbellin, tornou-se a própria autoridade da dinastia."
 STATIC_MODIFIER_NAME_bra_standing_army_mod: "Exército Permanente Criado"
 STATIC_MODIFIER_DESC_bra_standing_army_mod: "Os soldados do exército permanente, que juram lealdade apenas ao eleitor, treinam dia após dia nas praças de Potsdam."
 STATIC_MODIFIER_NAME_bra_absolutism_mod: "Absolutismo Estabelecido"
 STATIC_MODIFIER_DESC_bra_absolutism_mod: "As ordens do rei vão agora da corte de Berlim aos conselhos rurais de todos os cantos do Estado."
 STATIC_MODIFIER_NAME_bra_sovereign_mod: "Soberania Prussiana"
 STATIC_MODIFIER_DESC_bra_sovereign_mod: "O duque da Prússia, que abandonou o juramento antes devido ao rei polonês, é agora recebido em cortes estrangeiras como soberano igual."
 STATIC_MODIFIER_NAME_bra_administration_mod: "A Administração Prussiana"
 STATIC_MODIFIER_DESC_bra_administration_mod: "Os livros e regulamentos redigidos pelos escribas do Diretório Geral sustentam a administração de todos os cantos do reino."
 STATIC_MODIFIER_NAME_bra_junker_mod: "Junkers Integrados"
 STATIC_MODIFIER_DESC_bra_junker_mod: "Os junkers funcionam agora como núcleo do exército e da administração."
 STATIC_MODIFIER_NAME_bra_potsdam_mod: "Potsdam Desenvolvida"
 STATIC_MODIFIER_DESC_bra_potsdam_mod: "A residência real, Potsdam, prospera como centro da cultura de corte."
 STATIC_MODIFIER_NAME_bra_soldier_king_mod: "O Legado do Rei-Soldado"
 STATIC_MODIFIER_DESC_bra_soldier_king_mod: "A frugalidade e a disciplina rígida legadas pelo Rei-Soldado ainda se agarram às próprias paredes dos quartéis."
 STATIC_MODIFIER_NAME_bra_treasury_mod: "Tesouro Cheio"
 STATIC_MODIFIER_DESC_bra_treasury_mod: "Nos frugais cofres reais, caixas de prata empilham-se altas para as guerras que virão."
 STATIC_MODIFIER_NAME_bra_silesian_ambition_mod: "Ambições sobre a Silésia"
 STATIC_MODIFIER_DESC_bra_silesian_ambition_mod: "Oficiais que sonham com os vales férteis da Silésia aguardam impacientes a ordem de marcha."
 STATIC_MODIFIER_NAME_bra_first_silesian_mod: "A Primeira Guerra da Silésia"
 STATIC_MODIFIER_DESC_bra_first_silesian_mod: "Marchando como relâmpago pela neve, o exército já estava às muralhas de Breslau antes que a Áustria concluísse a mobilização."
 STATIC_MODIFIER_NAME_bra_silesia_mod: "Silésia Anexada"
 STATIC_MODIFIER_DESC_bra_silesia_mod: "A riqueza nascida dos fornos e oficinas da Silésia flui sem cessar para o tesouro de Berlim."
 STATIC_MODIFIER_NAME_bra_enlightenment_mod: "O Iluminismo Prussiano"
 STATIC_MODIFIER_DESC_bra_enlightenment_mod: "Os ideais do Iluminismo, que se difundem da corte de Sanssouci, multiplicam as escolas nas aldeias."
 STATIC_MODIFIER_NAME_bra_seven_years_mod: "A Prova da Guerra dos Sete Anos"
 STATIC_MODIFIER_DESC_bra_seven_years_mod: "A experiência de lutar contra toda a Europa forjou a disciplina militar."
 STATIC_MODIFIER_NAME_bra_frederick_mod: "O Legado de Frederico, o Grande"
 STATIC_MODIFIER_DESC_bra_frederick_mod: "O nome de Frederico, o Grande, é transmitido tanto como orgulho do soldado quanto como glória do Estado."
 STATIC_MODIFIER_NAME_bra_partitions_mod: "Partilhas da Polônia"
 STATIC_MODIFIER_DESC_bra_partitions_mod: "Funcionários e agrimensores prussianos mudam-se um após o outro para as aldeias da Prússia Ocidental, tomadas nas partilhas."
 STATIC_MODIFIER_NAME_bra_academy_mod: "A Academia Prussiana"
 STATIC_MODIFIER_DESC_bra_academy_mod: "As conferências dos eruditos reunidos na academia de Berlim atraem estudantes de todo o país."
 STATIC_MODIFIER_NAME_bra_invasion_poland_mod: "Invasão da Polônia"
 STATIC_MODIFIER_DESC_bra_invasion_poland_mod: "Placas e repartições alemãs surgem uma a uma nas cidades conquistadas da Grande Polônia."
 STATIC_MODIFIER_NAME_bra_napoleonic_mod: "A Crise Napoleônica"
 STATIC_MODIFIER_DESC_bra_napoleonic_mod: "A experiência de superar a crise torna-se a base da defesa da pátria."
 STATIC_MODIFIER_NAME_bra_reforms_mod: "As Reformas de Stein-Hardenberg"
 STATIC_MODIFIER_DESC_bra_reforms_mod: "As reformas de Stein e Hardenberg libertaram o camponês da servidão e abriram a porta ao serviço público."
 STATIC_MODIFIER_NAME_bra_rhineland_mod: "Renânia Adquirida"
 STATIC_MODIFIER_DESC_bra_rhineland_mod: "Os impostos que fluem das ricas cidades e minas de carvão ao longo do Reno alegram os tesoureiros de Berlim."
 STATIC_MODIFIER_NAME_bra_show_of_strength_mod: "Demonstração de Força"
 STATIC_MODIFIER_DESC_bra_show_of_strength_mod: "Os príncipes do norte da Alemanha, tendo visto a formação das tropas na praça de Berlim, partiram sem palavras desnecessárias."
 STATIC_MODIFIER_NAME_bra_lower_saxony_mod: "Baixa Saxônia Conquistada"
 STATIC_MODIFIER_DESC_bra_lower_saxony_mod: "A vitória do exército prussiano nas planícies de Hanôver riscou o mapa do norte da Alemanha."
 STATIC_MODIFIER_NAME_bra_westphalia_mod: "Vestfália Conquistada"
 STATIC_MODIFIER_DESC_bra_westphalia_mod: "Os prefeitos das cidades vestfalianas passaram a seguir as orientações dos funcionários de Berlim."
 STATIC_MODIFIER_NAME_bra_zollverein_mod: "O Zollverein"
 STATIC_MODIFIER_DESC_bra_zollverein_mod: "Nas fronteiras da união aduaneira, as carroças passam sem esperar que se levante a cancela."
 STATIC_MODIFIER_NAME_bra_constitution_mod: "A Constituição Prussiana"
 STATIC_MODIFIER_DESC_bra_constitution_mod: "Os papéis do parlamento e do monarca, fixados nos artigos da constituição, trouxeram uma nova ordem à prática política."
 STATIC_MODIFIER_NAME_bra_danish_war_mod: "Guerra contra a Dinamarca"
 STATIC_MODIFIER_DESC_bra_danish_war_mod: "O retorno triunfal dos soldados prussianos que tomaram as trincheiras de Dybbøl acelerou a união de Schleswig e Holstein."
 STATIC_MODIFIER_NAME_bra_austro_prussian_war_mod: "A Guerra Austro-Prussiana"
 STATIC_MODIFIER_DESC_bra_austro_prussian_war_mod: "No campo de Sadowa, o fuzil de carregar pela culatra derrubou tudo o que os soldados julgavam regras da guerra."
 STATIC_MODIFIER_NAME_bra_north_confederation_mod: "A Confederação da Alemanha do Norte"
 STATIC_MODIFIER_DESC_bra_north_confederation_mod: "No dia em que a bandeira da Confederação da Alemanha do Norte foi hasteada pela primeira vez sobre o palácio de Berlim, os enviados dos Estados souberam que uma nova era havia começado."
 STATIC_MODIFIER_NAME_bra_south_german_mod: "Aliança com o Sul"
 STATIC_MODIFIER_DESC_bra_south_german_mod: "Os enviados, guardiões do pacto com a Prússia, vão e vêm agora até nas cortes da Baviera e de Württemberg."
 STATIC_MODIFIER_NAME_bra_franco_prussian_mod: "A Guerra Franco-Prussiana"
 STATIC_MODIFIER_DESC_bra_franco_prussian_mod: "Na noite em que a notícia da vitória em Sedan chegou a Berlim, todas as ruas estavam tomadas de alegria."
 STATIC_MODIFIER_NAME_bra_alsace_mod: "Alsácia-Lorena Anexadas"
 STATIC_MODIFIER_DESC_bra_alsace_mod: "As chaminés das fábricas têxteis e minas de ferro alsacianas movem a indústria do novo Império Alemão."
 STATIC_MODIFIER_NAME_bra_kulturkampf_mod: "O Kulturkampf"
 STATIC_MODIFIER_DESC_bra_kulturkampf_mod: "As novas instituições, formadas após a luta do Estado contra a igreja, apagaram as fronteiras entre as repartições estatais e as paróquias."
 STATIC_MODIFIER_NAME_bra_social_mod: "Legislação de Seguridade Social"
 STATIC_MODIFIER_DESC_bra_social_mod: "Os trabalhadores, em fila pelos auxílios por doença e velhice, sabem que o Estado não os abandonará."
 STATIC_MODIFIER_NAME_bra_colonial_mod: "O Império Colonial"
 STATIC_MODIFIER_DESC_bra_colonial_mod: "No convés dos vapores rumo às colônias da África e dos Mares do Sul, estão colonos que sonham com um novo mundo."
 STATIC_MODIFIER_NAME_bra_fleet_mod: "A Frota de Alto-Mar"
 STATIC_MODIFIER_DESC_bra_fleet_mod: "Das chaminés dos encouraçados alinhados no porto de guerra de Kiel sobe a fumaça da determinação de proteger as rotas comerciais."
 STATIC_MODIFIER_NAME_bra_weltpolitik_mod: "Política Mundial"
 STATIC_MODIFIER_DESC_bra_weltpolitik_mod: "Os mapas no ministério das Relações Exteriores de Berlim refletem agora uma política mundial que se estende da África à Ásia."
 STATIC_MODIFIER_NAME_bra_berlin_metropolis_mod: "A Grande Berlim Concluída"
 STATIC_MODIFIER_DESC_bra_berlin_metropolis_mod: "A metrópole mundial de Berlim brilha como centro de prosperidade e governo."
 STATIC_MODIFIER_NAME_bra_ruhr_complete_mod: "A Indústria do Ruhr Concluída"
 STATIC_MODIFIER_DESC_bra_ruhr_complete_mod: "Os altos-fornos do Ruhr cospem fogo noite e dia, enviando aço alemão ao mundo."
 STATIC_MODIFIER_NAME_bra_science_mod: "A Ascensão da Ciência Alemã"
 STATIC_MODIFIER_DESC_bra_science_mod: "As descobertas nascidas nos laboratórios de Göttingen e Berlim fizeram da Alemanha o centro da ciência mundial."
 STATIC_MODIFIER_NAME_bra_naval_race_mod: "A Corrida Naval"
 STATIC_MODIFIER_DESC_bra_naval_race_mod: "Nos estaleiros de Wilhelmshaven, a quilha do próximo encouraçado já foi assentada."
 STATIC_MODIFIER_NAME_bra_balkan_mod: "Influência nos Bálcãs"
 STATIC_MODIFIER_DESC_bra_balkan_mod: "Os assuntos balcânicos, discutidos diariamente pelos diplomatas de Viena e Berlim, ligam cada vez mais os dois aliados."
 STATIC_MODIFIER_NAME_bra_ottoman_mod: "Parceria com os Otomanos"
 STATIC_MODIFIER_DESC_bra_ottoman_mod: "A cada milha construída da Ferrovia de Bagdá, os laços entre Berlim e Constantinopla se aprofundam."
 STATIC_MODIFIER_NAME_bra_mitteleuropa_mod: "Mitteleuropa"
 STATIC_MODIFIER_DESC_bra_mitteleuropa_mod: "A visão de uma esfera econômica unificada na Europa Central se espalha em silêncio até entre mercadores e funcionários de países vizinhos."
 STATIC_MODIFIER_NAME_bra_grossdeutschland_mod: "A Grande Alemanha"
 STATIC_MODIFIER_DESC_bra_grossdeutschland_mod: "“Onde fica a pátria do alemão?” — a velha pergunta, cantada de Viena a Berlim, encontra enfim sua resposta."
 STATIC_MODIFIER_NAME_bra_hegemon_mod: "Hegemon da Europa"
 STATIC_MODIFIER_DESC_bra_hegemon_mod: "Nenhuma corte da Europa pode mais tomar uma decisão importante sem conhecer antes a vontade de Berlim."
 STATIC_MODIFIER_NAME_bra_king_in_prussia_mod: "Rei na Prússia"
 STATIC_MODIFIER_DESC_bra_king_in_prussia_mod: "Desde o dia da coroação na capela do castelo de Königsberg, a corte prussiana começou a forjar o cerimonial de um reino."
 STATIC_MODIFIER_NAME_bra_second_reich_mod: "O Segundo Reich Eterno"
 STATIC_MODIFIER_DESC_bra_second_reich_mod: "Desde a proclamação feita no Salão dos Espelhos de Versalhes, a coroa dos Hohenzollern ergueu-se para brilhar no cume da Europa."
