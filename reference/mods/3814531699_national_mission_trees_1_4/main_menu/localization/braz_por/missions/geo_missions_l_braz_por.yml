l_braz_por:
 geo_georgia_mission_pack: "O Velocino de Ouro — O Reino do Cáucaso"
 geo_georgia_mission_pack_DESCRIPTION:0 "Sob a dinastia Bagrationi, o Reino da Geórgia está na encruzilhada do Cáucaso. Una o reino, reivindique a hegemonia sobre o Cáucaso e a estepe, ou marche como cruzado rumo à Anatólia e à Terra Santa — e deixe que a luz da ortodoxia brilhe sobre o Oriente."
 geo_georgia_mission_pack_CRITERIA_DESCRIPTION:0 "Una a Geórgia, domine o Cáucaso e conduza a cruzada para o sul, para realizar uma nova era de ouro."
 geo_georgia_mission_pack_BUTTON_TOOLTIP:0 "Da terra do Velocino de Ouro, torne-se hegemon do Cáucaso."
 geo_georgia_mission_pack_BUTTON_DETAILS:0 "Restaure a glória da rainha Tamar — de reino montanhês a guardião do mundo ortodoxo!"
 geo_bagrationi_legacy: "O Legado dos Bagrationi"
 geo_bagrationi_legacy_desc: "A linhagem da casa Bagrationi governa o Cáucaso. Herde esse legado e inicie uma nova era de governo."
 geo_royal_succession: "Assegure a Sucessão"
 geo_royal_succession_desc: "Reprima as ambições da nobreza e as disputas pelo trono e estabeleça um governo legítimo."
 geo_reunite_georgia: "Reunifique a Geórgia"
 geo_reunite_georgia_desc: "Tbilisi, Kutaisi, Akhaltsikhe, Batumi — una as províncias fragmentadas da Geórgia sob uma só coroa."
 geo_fortify_caucasia: "Fortifique o Cáucaso"
 geo_fortify_caucasia_desc: "Endureça as montanhas acidentadas com uma rede de fortalezas e repila as incursões de pagãos e conquistadores por igual."
 geo_church_of_georgia: "A Igreja Georgiana"
 geo_church_of_georgia_desc: "Faça da Igreja Ortodoxa Georgiana autocéfala um pilar do Estado e forje a unidade pela fé."
 geo_royal_court: "A Corte Real"
 geo_royal_court_desc: "Adorne a corte real de Tbilisi e faça dela centro de cultura e poder, inigualável no Cáucaso."
 geo_georgian_army: "O Exército Georgiano"
 geo_georgian_army_desc: "Forje um poderoso exército, extraído dos povos montanheses, e faça dele a espada do reino."
 geo_recover_strength: "Recupere as Forças"
 geo_recover_strength_desc: "Restaure as forças, esgotadas pelas repetidas dificuldades, e abra um novo futuro por meio de aliança e rearmamento."
 geo_queen_tamar_ambition: "A Ambição da Rainha Tamar"
 geo_queen_tamar_ambition_desc: "As terras da Armênia, outrora parte do domínio da rainha Tamar — liberte nossos irmãos cristãos do domínio de pagãos e restaure a autoridade de Tbilisi."
 geo_reclaim_shirvan: "Recupere Shirvan"
 geo_reclaim_shirvan_desc: "Recupere Shirvan, outrora sob suserania georgiana, e obtenha uma cabeça de ponte no Mar Cáspio."
 geo_heirs_of_seljuks: "Herdeiros dos Seljúcidas"
 geo_heirs_of_seljuks_desc: "Recupere as terras orientais das potências que herdaram o legado seljúcida e restaure a autoridade da cruz nessa região."
 geo_gates_of_alexander: "As Portas de Alexandre"
 geo_gates_of_alexander_desc: "Cruze as chamadas “Portas de Alexandre”, através do Cáucaso, e subjugue as tribos do norte."
 geo_bane_of_khagan: "O Flagelo do Cã"
 geo_bane_of_khagan_desc: "Os descendentes dos mongóis continuam a ameaçar o mundo ortodoxo. Ponha fim a seu governo e elimine essa maldição para sempre."
 geo_seize_crimea: "Tome a Crimeia"
 geo_seize_crimea_desc: "Subjugue a Península da Crimeia, último refúgio dos tártaros, e assegure nosso domínio sobre o Mar Negro."
 geo_control_black_sea: "Domine o Mar Negro"
 geo_control_black_sea_desc: "Tendo tomado a maior parte do litoral do Mar Negro, incorpore plenamente esse mar interior à esfera comercial da Geórgia."
 geo_envoy_to_tsar: "Enviado ao Tsar"
 geo_envoy_to_tsar_desc: "Envie um enviado ao tsar, elevado a potência dominante da Rus, e busque o caminho da aliança."
 geo_caucasus_hegemony: "Hegemonia do Cáucaso"
 geo_caucasus_hegemony_desc: "Montanhas, estepe e Mar Negro — complete a inabalável hegemonia sobre todo o Cáucaso."
 geo_deal_with_trebizond: "Resolva a Questão de Trebizonda"
 geo_deal_with_trebizond_desc: "O Império de Trebizonda, fundado com a ajuda da rainha Tamar — renove o vínculo com esse velho amigo e escolham juntos o caminho adiante."
 geo_conquer_jalayirids: "Subjugue o Sultanato Jalairida"
 geo_conquer_jalayirids_desc: "No caos após a queda do Ilcanato, o Sultanato Jalairida ergueu-se nessa terra — subjugue esse herdeiro do legado mongol e abra o caminho rumo ao Leste."
 geo_encroach_mamluks: "Pressione os Mamelucos"
 geo_encroach_mamluks_desc: "A Terra Santa, perdida pelos antigos cruzados — avance sobre o Oriente governado pelos mamelucos e prepare-se para recuperar a luz da fé."
 geo_conquer_cyprus: "Conquiste Chipre"
 geo_conquer_cyprus_desc: "Tome Chipre, bastião do Mediterrâneo oriental, e assegure a hegemonia sobre a região junto às potências cruzadas ali presentes."
 geo_cradle_of_civilization: "Berço da Civilização"
 geo_cradle_of_civilization_desc: "Liberte a Mesopotâmia, berço da civilização humana, do domínio muçulmano e reivindique suas riquezas para a Geórgia."
 geo_claim_holy_city: "Reivindique a Cidade Santa"
 geo_claim_holy_city_desc: "Enquanto Jerusalém estiver sob domínio sarraceno, uma nuvem escura paira sobre a cristandade. Recupere a Cidade Santa e prove o triunfo da fé."
 geo_light_of_east: "A Luz do Oriente"
 geo_light_of_east_desc: "Alexandria, Jerusalém, Antioquia — liberte os antigos patriarcados orientais e mostre ao mundo que a luz do Oriente não se apagou."
 geo_anatolian_incursion: "Incursão na Anatólia"
 geo_anatolian_incursion_desc: "Desde a derrota em Manziquerta, a Anatólia caiu nas mãos de potências turcas — vingue essa derrota e torne-se o novo hegemon dessa terra."
 geo_empires_downfall: "A Queda do Império"
 geo_empires_downfall_desc: "O Império Otomano, dominante nos Bálcãs e no Oriente Médio — condene essa ameaça a toda a cristandade às páginas da história."
 geo_throne_of_romans: "O Trono dos Romanos"
 geo_throne_of_romans_desc: "A grande cidade de Constantinopla jaz há muito nas mãos de pagãos. Liberte essa joia e ocupe o trono romano como imperador georgiano."
 geo_beacon_of_christendom: "O Farol da Cristandade"
 geo_beacon_of_christendom_desc: "Tendo restaurado o poder da ortodoxia, chegou a hora de provar ao mundo nossa piedade e a retidão dada por Deus — faça de nosso reino o paraíso unido da cristandade."
 geo_georgian_crusader_realm: "O Reino Cruzado Georgiano"
 geo_georgian_crusader_realm_desc: "Do Cáucaso ao Mediterrâneo — esse grande império, construído sob a cruz, é o cumprimento do sonho da rainha Tamar."
 geo_rebuild_tbilisi: "Reconstrua Tbilisi"
 geo_rebuild_tbilisi_desc: "Nossa capital, Tbilisi, arrasada por repetidas invasões estrangeiras — comece a restaurar sua antiga magnificência."
 geo_georgian_vineyards: "Os Vinhedos Georgianos"
 geo_georgian_vineyards_desc: "A tradição vinícola da Geórgia, que abrange mais de mil anos — que esse orgulhoso ramo da indústria se torne conhecido do mundo."
 geo_revive_literature: "Reviva a Literatura Nativa"
 geo_revive_literature_desc: "Asomtavruli, Nuskhuri, Mkhedruli — três escritas, que levam o legado georgiano. Reviva essa cultura e difunda sua língua e escrita por todo o Cáucaso."
 geo_legacy_of_builder: "O Legado do Construtor"
 geo_legacy_of_builder_desc: "Seguindo o governo de Davi, o Construtor, traga fama, riqueza e importância a nossas cidades."
 geo_svetitskhoveli_cathedral: "A Catedral de Svetitskhoveli"
 geo_svetitskhoveli_cathedral_desc: "A Catedral do Pilar Vivo, coração da Igreja Apostólica Georgiana — reconstrua-a com magnificência maior que nunca."
 geo_patriarchate_of_georgia: "O Patriarcado de Toda a Geórgia"
 geo_patriarchate_of_georgia_desc: "À medida que cresce a influência do Estado, cresce o clamor para elevar a Igreja Georgiana autocéfala ao posto de patriarcado."
 geo_silk_road_trade: "O Comércio da Rota da Seda"
 geo_silk_road_trade_desc: "Como nó, que liga Oriente e Ocidente ao longo da Rota da Seda, encha as cidades da Geórgia com a riqueza do comércio."
 geo_mountain_fortresses: "Fortalezas Montanhesas"
 geo_mountain_fortresses_desc: "Aproveite o terreno acidentado do Cáucaso e complete uma rede de fortalezas, capaz de deter qualquer exército."
 geo_golden_age: "A Era de Ouro Concluída"
 geo_golden_age_desc: "A era de ouro, construída pela rainha Tamar e por Davi, o Construtor — eleve sua glória a alturas inéditas."
 geo_events.1.t: "A Queda de Sarai"
 geo_events.1.d: "Sarai, capital do Estado sucessor mongol, caiu em nossas mãos. O poder do Cã, que outrora abalou o mundo ortodoxo, pertence agora ao passado."
 geo_events.1.a: "O flagelo do Cã chegou ao fim!"
 geo_events.2.t: "A Queda de Constantinopla"
 geo_events.2.d: "A grande cidade imperial de Constantinopla caiu enfim em nossas mãos. O estandarte georgiano tremula agora sobre essa cidade, outrora detida por infiéis — o Rei do Cáucaso reivindica o título de herdeiro de Roma."
 geo_events.2.a: "Viva o Império Romano! Viva o Imperador Georgiano!"
 geo_events.99.t: "Proclamação da Era de Ouro"
 geo_events.99.d: "Do Cáucaso ao Mediterrâneo — a era de ouro, com que outrora sonhou a rainha Tamar, está agora concluída. O pequeno reino montanhês renasceu como grande império, que ilumina o mundo ortodoxo."
 geo_events.99.a: "Glória à Geórgia! Viva a Era de Ouro!"
 STATIC_MODIFIER_NAME_geo_bagrationi_mod: "A Magnificência dos Bagrationi"
 STATIC_MODIFIER_DESC_geo_bagrationi_mod: "A linhagem real dá ao Estado prestígio e legitimidade."
 STATIC_MODIFIER_NAME_geo_succession_mod: "Sucessão Estável"
 STATIC_MODIFIER_DESC_geo_succession_mod: "A sucessão real está estável, e os distúrbios internos amainaram."
 STATIC_MODIFIER_NAME_geo_reunite_mod: "Geórgia Unificada"
 STATIC_MODIFIER_DESC_geo_reunite_mod: "As províncias fragmentadas estão de novo unidas sob uma só coroa."
 STATIC_MODIFIER_NAME_geo_fortify_mod: "Rede de Fortalezas do Cáucaso"
 STATIC_MODIFIER_DESC_geo_fortify_mod: "Fortalezas de pedra, erguidas nos cumes das passagens do Cáucaso, velam de longe sobre a sombra do invasor."
 STATIC_MODIFIER_NAME_geo_church_mod: "A Igreja Georgiana"
 STATIC_MODIFIER_DESC_geo_church_mod: "A Igreja Ortodoxa funciona agora como pilar do Estado, forjando a unidade pela fé."
 STATIC_MODIFIER_NAME_geo_court_mod: "Magnificência da Corte Real"
 STATIC_MODIFIER_DESC_geo_court_mod: "A corte real de Tbilisi brilha como centro de cultura e poder no Cáucaso."
 STATIC_MODIFIER_NAME_geo_army_mod: "O Exército Georgiano"
 STATIC_MODIFIER_DESC_geo_army_mod: "Poderoso exército, extraído dos povos montanheses, concluído, servindo de espada do reino."
 STATIC_MODIFIER_NAME_geo_recover_mod: "Forças Recuperadas"
 STATIC_MODIFIER_DESC_geo_recover_mod: "Por meio de aliança e rearmamento, o reino deu um passo rumo a um novo futuro."
 STATIC_MODIFIER_NAME_geo_tamar_mod: "A Ambição da Rainha Tamar"
 STATIC_MODIFIER_DESC_geo_tamar_mod: "Nossos irmãos armênios foram libertados, e a autoridade de Tbilisi estende-se agora para o leste."
 STATIC_MODIFIER_NAME_geo_shirvan_mod: "Shirvan Recuperada"
 STATIC_MODIFIER_DESC_geo_shirvan_mod: "Cabeça de ponte no Mar Cáspio assegurada, e a riqueza do comércio oriental flui."
 STATIC_MODIFIER_NAME_geo_seljuk_mod: "Herdeiros dos Seljúcidas"
 STATIC_MODIFIER_DESC_geo_seljuk_mod: "As potências que herdaram o legado seljúcida foram repelidas, e a autoridade da cruz voltou ao Oriente."
 STATIC_MODIFIER_NAME_geo_gates_mod: "As Portas de Alexandre"
 STATIC_MODIFIER_DESC_geo_gates_mod: "Tendo cruzado as passagens setentrionais, as tribos ao norte do Cáucaso foram subjugadas."
 STATIC_MODIFIER_NAME_geo_crimea_mod: "Crimeia Tomada"
 STATIC_MODIFIER_DESC_geo_crimea_mod: "O último refúgio dos tártaros subjugado, abrindo rotas comerciais pelo Mar Negro."
 STATIC_MODIFIER_NAME_geo_black_sea_mod: "Domínio do Mar Negro"
 STATIC_MODIFIER_DESC_geo_black_sea_mod: "A maior parte do litoral do Mar Negro está agora incorporada à esfera comercial da Geórgia."
 STATIC_MODIFIER_NAME_geo_tsar_mod: "Aliança com o Tsar"
 STATIC_MODIFIER_DESC_geo_tsar_mod: "Relações com a potência dominante da Rus estabelecidas, ampliando nossa rede diplomática."
 STATIC_MODIFIER_NAME_geo_hegemony_mod: "Hegemonia do Cáucaso"
 STATIC_MODIFIER_DESC_geo_hegemony_mod: "Montanhas, estepe e Mar Negro — hegemonia sobre todo o Cáucaso concluída."
 STATIC_MODIFIER_NAME_geo_trebizond_mod: "A Questão de Trebizonda"
 STATIC_MODIFIER_DESC_geo_trebizond_mod: "O vínculo com nosso velho amigo renovado, e o comércio entre os dois reinos floresce."
 STATIC_MODIFIER_NAME_geo_jalayirid_mod: "Sultanato Jalairida Subjugado"
 STATIC_MODIFIER_DESC_geo_jalayirid_mod: "A ameaça jalairida eliminada, provando a força de nosso exército."
 STATIC_MODIFIER_NAME_geo_mamluk_mod: "Pressão sobre os Mamelucos"
 STATIC_MODIFIER_DESC_geo_mamluk_mod: "O estandarte da cruz, avançado para o leste, tremula até no horizonte do deserto, e reis de outras fés ouviram seu nome."
 STATIC_MODIFIER_NAME_geo_cyprus_mod: "Chipre Conquistada"
 STATIC_MODIFIER_DESC_geo_cyprus_mod: "Os navios mercantes georgianos, ancorados nos portos de Chipre, carregam as especiarias do Mediterrâneo oriental."
 STATIC_MODIFIER_NAME_geo_mesopotamia_mod: "Berço da Civilização"
 STATIC_MODIFIER_DESC_geo_mesopotamia_mod: "A lã e os corantes das férteis margens do Tigre e do Eufrates são levados às oficinas da Geórgia."
 STATIC_MODIFIER_NAME_geo_holy_city_mod: "Cidade Santa Tomada"
 STATIC_MODIFIER_DESC_geo_holy_city_mod: "A recuperação de Jerusalém elevou a autoridade da Igreja e a piedade do povo."
 STATIC_MODIFIER_NAME_geo_light_east_mod: "A Luz do Oriente"
 STATIC_MODIFIER_DESC_geo_light_east_mod: "A libertação dos patriarcados orientais elevou o moral e a honra do exército."
 STATIC_MODIFIER_NAME_geo_anatolia_mod: "Incursão na Anatólia"
 STATIC_MODIFIER_DESC_geo_anatolia_mod: "Soldados georgianos, que de novo pisaram o campo de Manziquerta, marcham nas fileiras, orgulhosos de ter vingado a antiga humilhação."
 STATIC_MODIFIER_NAME_geo_downfall_mod: "A Queda do Império"
 STATIC_MODIFIER_DESC_geo_downfall_mod: "Na corte de Tbilisi, libertada da ameaça otomana, enviados de muitas nações inclinam-se diante do Rei da Geórgia."
 STATIC_MODIFIER_NAME_geo_beacon_mod: "O Farol da Cristandade"
 STATIC_MODIFIER_DESC_geo_beacon_mod: "O nome do Rei da Geórgia, chamado guardião da fé, é pronunciado com respeito nas cortes das nações que portam a mesma cruz."
 STATIC_MODIFIER_NAME_geo_tbilisi_mod: "Tbilisi Reconstruída"
 STATIC_MODIFIER_DESC_geo_tbilisi_mod: "A capital real Tbilisi recupera sua antiga magnificência."
 STATIC_MODIFIER_NAME_geo_vineyards_mod: "Os Vinhedos Georgianos"
 STATIC_MODIFIER_DESC_geo_vineyards_mod: "O aroma do vinho, envelhecido mil anos em jarros de barro qvevri, enche os vales da Kakhétia."
 STATIC_MODIFIER_NAME_geo_literature_mod: "Literatura Nativa Revivida"
 STATIC_MODIFIER_DESC_geo_literature_mod: "A difusão da escrita Mkhedruli fez avançar o saber e o governo."
 STATIC_MODIFIER_NAME_geo_builder_mod: "O Legado do Construtor"
 STATIC_MODIFIER_DESC_geo_builder_mod: "Continuando a vontade de Davi, o Construtor, nossas cidades seguem o caminho da prosperidade."
 STATIC_MODIFIER_NAME_geo_cathedral_mod: "A Catedral de Svetitskhoveli"
 STATIC_MODIFIER_DESC_geo_cathedral_mod: "A Catedral do Pilar Vivo reconstruída, recuperando sua magnificência como centro da fé."
 STATIC_MODIFIER_NAME_geo_patriarchate_mod: "O Patriarcado de Toda a Geórgia"
 STATIC_MODIFIER_DESC_geo_patriarchate_mod: "A Igreja Georgiana elevada ao posto de patriarcado, e sua autoridade é amplamente reconhecida."
 STATIC_MODIFIER_NAME_geo_silk_road_mod: "O Comércio da Rota da Seda"
 STATIC_MODIFIER_DESC_geo_silk_road_mod: "Como nó do comércio Oriente-Ocidente, as cidades da Geórgia transbordam de riqueza."
 STATIC_MODIFIER_NAME_geo_mountain_fort_mod: "A Rede de Fortalezas Montanhesas"
 STATIC_MODIFIER_DESC_geo_mountain_fort_mod: "A rede de fortalezas, construída sobre o terreno do Cáucaso, pode deter qualquer grande exército."
 STATIC_MODIFIER_NAME_geo_golden_age_mod: "Era de Ouro Concluída"
 STATIC_MODIFIER_DESC_geo_golden_age_mod: "A era de ouro, construída pela rainha Tamar e por Davi, o Construtor, alcançou novas alturas."
 STATIC_MODIFIER_NAME_geo_constantinople_fall_mod: "O Legado do Bizâncio Imperial"
 STATIC_MODIFIER_DESC_geo_constantinople_fall_mod: "A máquina diplomática e administrativa da cidade milenar foi capturada. Herdando a burocracia de Roma e o cerimonial diplomático, nossos súditos tornam-se mais leais, e o processo de anexação corre mais suave."
 STATIC_MODIFIER_NAME_geo_golden_age_declaration_mod: "A Rede de Governo da Era de Ouro"
 STATIC_MODIFIER_DESC_geo_golden_age_declaration_mod: "O vasto império, que se estende do Cáucaso ao Mediterrâneo, está unido por estradas reais e por uma rede de governadores locais. A prosperidade, construída pela rainha Tamar e por Davi, o Construtor, leva a luz da coroa às províncias mais distantes, tornando inabaláveis a legitimidade e o prestígio da dinastia."
