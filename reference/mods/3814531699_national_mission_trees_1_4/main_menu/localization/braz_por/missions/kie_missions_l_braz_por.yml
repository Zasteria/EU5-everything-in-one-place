l_braz_por:
 kie_kyiv_mission_pack: "A Unificação da Rus e o Senhor dos Cossacos"
 kie_kyiv_mission_pack_DESCRIPTION:0 "Em 1337, o Principado de Kiev é um pequeno Estado, apertado entre a Lituânia e os tártaros. Mas Kiev brilhou outrora como coração da Rus de Kiev — a Catedral de Santa Sofia, o Mosteiro das Cavernas e a Porta Dourada ainda dão testemunho de seu esplendor. Una a Ucrânia da margem esquerda e da direita, conquiste Halych e Volínia, derrote os tártaros com a força militar cossaca, forme a Rutênia e governe o Grão-Principado."
 kie_kyiv_mission_pack_CRITERIA_DESCRIPTION:0 "Una a Rus, estabeleça o Hetmanato Cossaco, torne-se guardiã da fé ortodoxa, forme a Rutênia e governe o Grão-Principado de Kiev."
 kie_kyiv_mission_pack_BUTTON_TOOLTIP:0 "Governe o Grão-Principado de Kiev sobre toda a Rus."
 kie_kyiv_mission_pack_BUTTON_DETAILS:0 "Una a Rus fragmentada sob Kiev — domine a estepe com a espada cossaca!"
 kie_restore_kyiv: "Reconstrua Kiev"
 kie_restore_kyiv_desc: "Em 1337, Kiev — outrora a cidade dourada da Rus de Kiev — está devastada pela invasão mongol de 1240. A Catedral de Santa Sofia e o Mosteiro das Cavernas ainda testemunham seu antigo esplendor. Reconstrua a “mãe das cidades russas” como uma grande cidade."
 kie_dev_kyiv: "Desenvolva Kiev"
 kie_dev_kyiv_desc: "Encruzilhada-chave, que liga as rotas comerciais do Volkhov e do Dnieper — desenvolva Kiev como centro de comércio, cultura e política."
 kie_secure_left_bank: "Consolide o Controle da Ucrânia da Margem Esquerda"
 kie_secure_left_bank_desc: "Consolide o controle da Ucrânia da margem esquerda — preserve as tradições culturais da Rus e, com uma burocracia habilidosa, faça dessa rica terra agrícola a base de Kiev."
 kie_secure_right_bank: "Consolide o Controle da Ucrânia da Margem Direita"
 kie_secure_right_bank_desc: "Consolide o controle da Ucrânia da margem direita — difundindo a cultura ucraniana e reforçando a autoridade da coroa, faça da Ucrânia da margem direita terra-núcleo de Kiev."
 kie_conquer_chernihiv: "Expedição a Tchernihiv"
 kie_conquer_chernihiv_desc: "Conquiste Tchernihiv, antiga cidade do principado russo, e consolide o controle da Ucrânia da margem esquerda."
 kie_conquer_poltava: "Marcha sobre Poltava"
 kie_conquer_poltava_desc: "Subjugue o bastião cossaco Poltava e abra a porta para a Sloboda Ucrânia."
 kie_kyiv_metropolitan: "A Metrópole de Kiev"
 kie_kyiv_metropolitan_desc: "Erga a Metrópole de Kiev, independente de Constantinopla, como centro da igreja ortodoxa da Rus."
 kie_unite_rus: "A Unificação da Rus"
 kie_unite_rus_desc: "Una de novo, sob Kiev, os principados russos fragmentados pela invasão mongol. A “mãe das cidades russas” brilha de novo como centro de toda a Ucrânia."
 kie_secure_volhynia: "Assegure a Volínia"
 kie_secure_volhynia_desc: "Assegure a Volínia, na fronteira da Rus e da Polônia, para estabelecer influência ocidental."
 kie_conquer_lutsk: "Expedição a Lutsk"
 kie_conquer_lutsk_desc: "Tome a cidade-chave da Volínia, Lutsk, e faça dela uma cabeça de ponte rumo ao oeste."
 kie_conquer_galicia: "Invasão de Halych"
 kie_conquer_galicia_desc: "Invada Halych — a conquista dessa região estabelece o controle pleno da Ucrânia Ocidental."
 kie_red_ruthenia: "Subjugue a Rutênia Vermelha"
 kie_red_ruthenia_desc: "Subjugue a Rutênia Vermelha — a subjugação dessa região em torno de Lviv completa o controle pleno da Ucrânia Ocidental."
 kie_conquer_lviv: "Tome Lviv"
 kie_conquer_lviv_desc: "A “cidade do leão”, Lviv — conquiste essa cidade comercial, construída pelo príncipe Daniel, e obtenha o controle do comércio ocidental."
 kie_conquer_podolia: "Avance sobre a Podólia"
 kie_conquer_podolia_desc: "Avance sobre a Podólia — conquiste essa região agrícola da margem direita e assegure o caminho para a costa do Mar Negro."
 kie_conquer_vinnytsia: "Tome Vinnytsia"
 kie_conquer_vinnytsia_desc: "Tome Vinnytsia e estabeleça uma cabeça de ponte agrícola na Ucrânia da margem direita."
 kie_conquer_polesia: "Expedição ao Polésia"
 kie_conquer_polesia_desc: "Conquiste o pantanoso Polésia — erga a linha de defesa do norte."
 kie_conquer_minsk: "Tome Minsk"
 kie_conquer_minsk_desc: "Tome Minsk, centro da Rutênia Branca, para ampliar a influência setentrional."
 kie_cossack_host: "Erga o Exército Cossaco"
 kie_cossack_host_desc: "Os cossacos reúnem-se sob as bandeiras de Kiev — incorpore a tradição cossaca de Zaporíjia ao exército regular e construa a melhor cavalaria da Rus."
 kie_zaporizhzhia: "A Sich de Zaporíjia"
 kie_zaporizhzhia_desc: "Erga a fortaleza da Sich de Zaporíjia, além das corredeiras do Dnieper, como cabeça de ponte para a defesa da estepe."
 kie_tatar_wars: "Guerras contra os Tártaros"
 kie_tatar_wars_desc: "Conduza a batalha decisiva contra os tártaros da Crimeia, que dominam o norte do Mar Negro. Use a cavalaria cossaca para opor-se a eles e recuperar a estepe ucraniana."
 kie_black_sea_steppe: "Conquiste a Estepe do Mar Negro"
 kie_black_sea_steppe_desc: "Tome a estepe pôntica — o vasto pasto faz de Kiev senhora do norte do Mar Negro."
 kie_conquer_crimea: "Conquista da Crimeia"
 kie_conquer_crimea_desc: "Conquiste a península do Canato da Crimeia para estabelecer a supremacia no Mar Negro. Tome o posto comercial genovês de Caffa."
 kie_black_sea_coast: "Erga a Frota do Mar Negro"
 kie_black_sea_coast_desc: "Use os chaikas cossacos (navios rápidos), que descem o Dnieper rumo ao Mar Negro — desafie os otomanos e tome a rota comercial do Mar Negro."
 kie_kyiv_pechersk: "O Mosteiro das Cavernas de Kiev"
 kie_kyiv_pechersk_desc: "O Mosteiro das Cavernas de Kiev, fundado em 1051 — coração espiritual da igreja ortodoxa da Rus. Desenvolva esse mosteiro e proclame Kiev centro ortodoxo."
 kie_orthodox_revival: "O Renascimento Ortodoxo"
 kie_orthodox_revival_desc: "Reconstrua a igreja ortodoxa da Rus, devastada pela invasão mongol — erga catedrais por toda a terra e ressuscite a “Santa Rus”."
 kie_grain_breadbasket: "Ucrânia — O Celeiro da Europa"
 kie_grain_breadbasket_desc: "O fértil chernozem — a Ucrânia, rica terra agrícola, chamada “celeiro da Europa”. Maximize essa produtividade e reforce a base alimentar do reino."
 kie_trade_routes: "As Rotas Comerciais de Kiev"
 kie_trade_routes_desc: "O “Caminho dos Varegues aos Gregos”, que liga o Báltico ao Mar Negro — reanime essa antiga rota comercial, que trouxe prosperidade a Kiev."
 kie_hetmanate: "O Hetmanato Cossaco"
 kie_hetmanate_desc: "O hetman — o estabelecimento do Hetmanato Cossaco permite a Kiev erguer-se como Estado com seu próprio sistema político-militar. Antecipe a grande realização de Bohdan Khmelnytsky de 1648."
 kie_literacy_culture: "Apoie a Educação e a Cultura"
 kie_literacy_culture_desc: "A tradição espiritual de Kiev — como pioneira da cultura de escrita monástica e das escolas catedralícias, apoie a cultura da educação."
 kie_conquer_zhytomyr: "Desenvolva Jitomir"
 kie_conquer_zhytomyr_desc: "Desenvolva Jitomir, ponto-chave da Ucrânia da margem direita, com construções adequadas, como importante cidade-bastião."
 kie_salt_of_galicia: "O Sal de Halych"
 kie_salt_of_galicia_desc: "As minas de sal de Halych — tome essa região, que produz “ouro branco”, e assegure o suprimento estável dessa importante mercadoria."
 kie_dev_poltava: "Desenvolva Poltava"
 kie_dev_poltava_desc: "Desenvolva Poltava, cidade-chave da Ucrânia cossaca da margem esquerda, como cabeça de ponte oriental."
 kie_beyond_donets: "Além do Donets"
 kie_beyond_donets_desc: "A Sloboda Ucrânia — assente camponeses cossacos ao longo do Donets e desenvolva a estepe oriental."
 kie_conquer_moldavia: "Invasão da Moldávia"
 kie_conquer_moldavia_desc: "Conquiste a Moldávia, na costa do Mar Negro, e alcance a plena inserção no comércio do Mar Negro."
 kie_amber_route: "A Rota do Âmbar"
 kie_amber_route_desc: "A antiga rota comercial do âmbar, do Báltico, passando por Lutsk e Lviv rumo ao sul, forma a espinha dorsal da rede comercial rutena."
 kie_fortress_line: "A Linha de Fortalezas"
 kie_fortress_line_desc: "Uma linha de fortalezas contra as ameaças da estepe — o sistema defensivo de Zaporíjia à Podólia protege os camponeses e cidades ucranianos."
 kie_great_kyiv: "A Grande Kiev"
 kie_great_kyiv_desc: "Restaure em Kiev a grandeza que tinha antes da invasão mongol — reconstrua-a como magnífica cidade, cujas cúpulas douradas recuperarão seu brilho original."
 kie_ruthenian_culture: "Identidade Cultural Rutena"
 kie_ruthenian_culture_desc: "Estabeleça uma identidade ucraniano-rutena singular — uma identidade em que se unem a língua ucraniana, a cultura cossaca e a fé ortodoxa."
 kie_dev_chernihiv: "Desenvolva Tchernihiv"
 kie_dev_chernihiv_desc: "Desenvolva Tchernihiv como centro de cultura e comércio na Ucrânia da margem esquerda."
 kie_conquer_wallachia: "Avance sobre a Valáquia"
 kie_conquer_wallachia_desc: "A Valáquia, ao longo do Danúbio — conquiste essa região como cabeça de ponte rumo aos Bálcãs e complete o controle da costa do Mar Negro."
 kie_cossack_cavalry: "Elite da Cavalaria Cossaca"
 kie_cossack_cavalry_desc: "A cavalaria cossaca — tanto leve quanto pesada, elevada a tropa de elite. Derrote os tártaros com sua mobilidade e poder de combate."
 kie_kyiv_academy: "A Academia Quiev-Mohyla"
 kie_kyiv_academy_desc: "Erga a Academia Quiev-Mohyla antes de sua fundação, em 1632 — uma das mais antigas universidades da Europa Oriental. Realize o renascimento espiritual e cultural da Rus."
 kie_conquer_krakow: "Tome Cracóvia"
 kie_conquer_krakow_desc: "Cracóvia, capital histórica do Reino da Polônia — a conquista dessa cidade com Wawel amplia muito a influência sobre a Europa Central."
 kie_navy_dnipro: "A Frota do Dnieper"
 kie_navy_dnipro_desc: "Use os chaikas cossacos a vela, do Dnieper ao Mar Negro — a Frota do Dnieper guarda o comércio do Mar Negro."
 kie_protect_orthodoxy: "Protetora da Ortodoxia"
 kie_protect_orthodoxy_desc: "Após a queda de Constantinopla, Kiev emerge como guardiã do mundo ortodoxo — estabeleça a suprema autoridade da igreja ortodoxa da Rus."
 kie_conquer_vilnius: "A Tomada de Vilnius"
 kie_conquer_vilnius_desc: "Vilnius, capital do Grão-Ducado da Lituânia — a tomada dessa cidade põe fim à suserania lituana sobre a Rus."
 kie_western_alliance: "Aliança com o Ocidente"
 kie_western_alliance_desc: "Construa relações diplomáticas com a Polônia, a Hungria e o Sacro Império Romano para estabelecer uma aliança ocidental contra as ameaças do leste."
 kie_silver_route: "A Rota da Prata"
 kie_silver_route_desc: "A prata do leste flui por Kiev, ao longo do Dnieper, rumo ao oeste — estabeleça a posição de Kiev no comércio internacional."
 kie_ruthenian_army: "Reforma do Exército Rutênio"
 kie_ruthenian_army_desc: "Combine a tradição cossaca com a tecnologia militar ocidental — o exército rutênio governa como a melhor força da Europa Oriental."
 kie_conquer_warsaw: "A Tomada de Varsóvia"
 kie_conquer_warsaw_desc: "Varsóvia, capital da Polônia — complete a longa luta contra a Comunidade Polaco-Lituana."
 kie_beeswax_honey: "Comércio de Cera e Mel"
 kie_beeswax_honey_desc: "A cera ucraniana — mercadoria-chave, fornecida às igrejas ortodoxas e aos mercados da Europa Ocidental."
 kie_form_ruthenia: "Forme a Rutênia"
 kie_form_ruthenia_desc: "Declare a formação do Estado da “Rutênia” — que abarca a Ucrânia, a Bielorrússia e a Rus Ocidental. O sonho da unidade da Rus desde a invasão mongol finalmente realizado."
 kie_grand_principality: "O Grão-Principado de Kiev"
 kie_grand_principality_desc: "“Grão-Principado de Kiev” — esse título dá testemunho do esplendor da antiga Rus de Kiev. Kiev, onde se unem a força militar cossaca, a autoridade ortodoxa e a cultura rutena, governa como grande potência da Europa Oriental."
 kie_events.1.t: "Kiev Desperta — A Reconstrução da Mãe das Cidades Russas"
 kie_events.1.d: "Sobre as colinas ao longo do Dnieper — as cúpulas douradas da Catedral de Santa Sofia brilham no céu de Kiev.\n\nEm 1337, o Principado de Kiev é pequeno, mas carrega o peso da história como coração da Rus de Kiev. “Mãe de todas as cidades russas” — esse título define a missão de Kiev.\n\nA Lituânia, a Polônia e os tártaros pressionam de todos os lados, mas as dádivas do Dnieper, o fértil chernozem e o espírito cossaco sustentam Kiev.\n\nOs monges do Mosteiro das Cavernas rezam — “Ergue-te de novo, ó Rus”. Responda a essa oração."
 kie_events.1.a: "Restaurar a glória de Kiev!"
 kie_events.20.t: "Proclamação do Hetmanato Cossaco"
 kie_events.20.d: "Os cossacos de Zaporíjia estão em linha sob a bandeira do hetman — o Grão-Príncipe de Kiev incorpora formalmente a força cossaca ao sistema do Estado e proclama o “Hetmanato Cossaco”. Esse singular sistema militar-estatal definirá o futuro da Rus."
 kie_events.20.a: "Viva o Hetmanato Cossaco! Viva a Ucrânia livre!"
 kie_events.60.t: "Formação da Rutênia — Uma Nova Potência da Europa Oriental"
 kie_events.60.d: "Ucrânia, Bielorrússia e Halych sob uma só bandeira — o Estado eslavo oriental unificado da “Rutênia” surge como nova grande potência da Europa Oriental. Todos os povos da Rus se reúnem sob as cúpulas douradas de Kiev."
 kie_events.60.a: "Viva a Rutênia! Viva Kiev!"
 kie_events.99.t: "O Grão-Principado de Kiev — O Renascimento da Glória da Rus"
 kie_events.99.d: "“Grão-Principado de Kiev” — esse título ressoa ao longo das margens do Dnieper. Um reino, onde se unem a força militar cossaca, a autoridade ortodoxa e a cultura rutena, governa como senhor da Europa Oriental. A Rus de Kiev, destruída pelos mongóis, renasce em nova forma — a mãe das cidades russas, Kiev, brilha de novo."
 kie_events.99.a: "Viva o Grão-Principado de Kiev! Viva a glória da Rus para sempre!"
 STATIC_MODIFIER_NAME_kie_kyiv_dev_mod: "Cidade Dourada sobre o Dnieper"
 STATIC_MODIFIER_DESC_kie_kyiv_dev_mod: "Kiev desenvolvida como grande cidade, digna do título de “mãe das cidades russas”."
 STATIC_MODIFIER_NAME_kie_left_bank_mod: "Ucrânia da Margem Esquerda Assegurada"
 STATIC_MODIFIER_DESC_kie_left_bank_mod: "Ucrânia da margem esquerda assegurada — o Dnieper oriental sob o governo de Kiev."
 STATIC_MODIFIER_NAME_kie_right_bank_mod: "Ucrânia da Margem Direita Assegurada"
 STATIC_MODIFIER_DESC_kie_right_bank_mod: "Ucrânia da margem direita assegurada — o Dnieper ocidental unido ao leste."
 STATIC_MODIFIER_NAME_kie_poltava_mod: "Bastião Cossaco Assegurado"
 STATIC_MODIFIER_DESC_kie_poltava_mod: "O bastião cossaco Poltava assegurado — fronteira da estepe estabilizada."
 STATIC_MODIFIER_NAME_kie_metropolitan_mod: "Coração da Ortodoxia da Rus"
 STATIC_MODIFIER_DESC_kie_metropolitan_mod: "A Metrópole de Kiev restaurada como coração da ortodoxia da Rus."
 STATIC_MODIFIER_NAME_kie_volhynia_mod: "Celeiro da Volínia"
 STATIC_MODIFIER_DESC_kie_volhynia_mod: "As férteis planícies da Volínia tornam-se celeiro do Estado de Kiev."
 STATIC_MODIFIER_NAME_kie_lutsk_mod: "Chave da Rus Ocidental"
 STATIC_MODIFIER_DESC_kie_lutsk_mod: "Lutsk — chave da Rus Ocidental — assegurada e abre o caminho para Halych."
 STATIC_MODIFIER_NAME_kie_galicia_mod: "Invasão de Halych"
 STATIC_MODIFIER_DESC_kie_galicia_mod: "Halych tomada, e o legado do Principado de Halych-Volínia renasce."
 STATIC_MODIFIER_NAME_kie_red_ruthenia_mod: "Rutênia Vermelha Subjugada"
 STATIC_MODIFIER_DESC_kie_red_ruthenia_mod: "Rutênia Vermelha subjugada e unida à Ucrânia."
 STATIC_MODIFIER_NAME_kie_lviv_mod: "Prosperidade da Cidade do Leão"
 STATIC_MODIFIER_DESC_kie_lviv_mod: "Lviv — a cidade do leão — prospera como porta do comércio ocidental."
 STATIC_MODIFIER_NAME_kie_podolia_mod: "Campos Cultivados de Chernozem"
 STATIC_MODIFIER_DESC_kie_podolia_mod: "Os campos cultivados de chernozem da Podólia assegurados — a riqueza agrícola flui a Kiev."
 STATIC_MODIFIER_NAME_kie_vinnytsia_mod: "Bastião da Margem Direita"
 STATIC_MODIFIER_DESC_kie_vinnytsia_mod: "Vinnytsia serve de bastião da Ucrânia da margem direita."
 STATIC_MODIFIER_NAME_kie_polesia_mod: "Muralha de Pântanos"
 STATIC_MODIFIER_DESC_kie_polesia_mod: "Os pântanos do Polésia formam uma muralha defensiva natural contra invasões do norte."
 STATIC_MODIFIER_NAME_kie_minsk_mod: "Coração da Rutênia Branca"
 STATIC_MODIFIER_DESC_kie_minsk_mod: "Minsk — coração da Rutênia Branca — passa ao controle de Kiev."
 STATIC_MODIFIER_NAME_kie_cossack_mod: "A Espada Cossaca"
 STATIC_MODIFIER_DESC_kie_cossack_mod: "A espada cossaca forja a força de Kiev num exército de elite da estepe."
 STATIC_MODIFIER_NAME_kie_zaporizhzhia_mod: "Liberdade além das Corredeiras"
 STATIC_MODIFIER_DESC_kie_zaporizhzhia_mod: "Além das corredeiras do Dnieper, os cossacos de Zaporíjia dedicam suas espadas a Kiev."
 STATIC_MODIFIER_NAME_kie_tatar_wars_mod: "Luta contra os Tártaros"
 STATIC_MODIFIER_DESC_kie_tatar_wars_mod: "As expedições contra os tártaros temperam a cavalaria de Kiev em destemidos guerreiros da estepe."
 STATIC_MODIFIER_NAME_kie_steppe_mod: "Conquistador da Estepe"
 STATIC_MODIFIER_DESC_kie_steppe_mod: "Estepe conquistada — Kiev governa como senhora dos pastos pônticos."
 STATIC_MODIFIER_NAME_kie_crimea_mod: "Supremacia no Mar Negro"
 STATIC_MODIFIER_DESC_kie_crimea_mod: "Supremacia no Mar Negro alcançada — Crimeia sob o governo de Kiev."
 STATIC_MODIFIER_NAME_kie_black_sea_mod: "O Caminho ao Mar Negro"
 STATIC_MODIFIER_DESC_kie_black_sea_mod: "O caminho ao Mar Negro aberto — Kiev obtém acesso ao comércio do Mediterrâneo."
 STATIC_MODIFIER_NAME_kie_lavra_mod: "A Lavra das Cavernas"
 STATIC_MODIFIER_DESC_kie_lavra_mod: "O Mosteiro das Cavernas de Kiev restaurado como alma da ortodoxia da Rus."
 STATIC_MODIFIER_NAME_kie_orthodox_mod: "Renascimento Ortodoxo Rutênio"
 STATIC_MODIFIER_DESC_kie_orthodox_mod: "A ortodoxia rutena renasce — Kiev retoma seu papel de guardiã da fé."
 STATIC_MODIFIER_NAME_kie_grain_mod: "Celeiro da Europa"
 STATIC_MODIFIER_DESC_kie_grain_mod: "O fértil chernozem da Ucrânia faz de Kiev o celeiro da Europa."
 STATIC_MODIFIER_NAME_kie_trade_mod: "Rota Comercial do Dnieper"
 STATIC_MODIFIER_DESC_kie_trade_mod: "A rota comercial do Dnieper, do Báltico ao Mar Negro, flui por mãos de Kiev."
 STATIC_MODIFIER_NAME_kie_salt_mod: "Ouro Branco de Halych"
 STATIC_MODIFIER_DESC_kie_salt_mod: "O ouro branco de Halych — o sal — monopolizado em favor do reino."
 STATIC_MODIFIER_NAME_kie_poltava_city_mod: "Poltava Desenvolvida"
 STATIC_MODIFIER_DESC_kie_poltava_city_mod: "Poltava desenvolvida como próspera cidade da estepe ucraniana."
 STATIC_MODIFIER_NAME_kie_sloboda_mod: "Ucrânia Livre Povoada"
 STATIC_MODIFIER_DESC_kie_sloboda_mod: "Os assentamentos livres ucranianos povoam a fronteira oriental sob proteção de Kiev."
 STATIC_MODIFIER_NAME_kie_moldavia_mod: "Moldávia Conquistada"
 STATIC_MODIFIER_DESC_kie_moldavia_mod: "O vento do Mar Negro sopra sobre as fortalezas da Moldávia, e os portos do litoral estão agora sob o estandarte de Kiev."
 STATIC_MODIFIER_NAME_kie_amber_mod: "A Rota do Âmbar"
 STATIC_MODIFIER_DESC_kie_amber_mod: "A rota do âmbar, do Báltico ao Mar Negro, flui por Kiev."
 STATIC_MODIFIER_NAME_kie_fortress_mod: "Linha de Defesa da Estepe"
 STATIC_MODIFIER_DESC_kie_fortress_mod: "A cadeia de fortalezas da estepe protege a fronteira sul contra as incursões tártaras."
 STATIC_MODIFIER_NAME_kie_great_kyiv_mod: "Mãe das Cidades Russas"
 STATIC_MODIFIER_DESC_kie_great_kyiv_mod: "Kiev recuperou seu título de mãe das cidades russas — capital eterna da Ucrânia."
 STATIC_MODIFIER_NAME_kie_culture_mod: "Florescimento Cultural Rutênio"
 STATIC_MODIFIER_DESC_kie_culture_mod: "A cultura rutena floresce — Kiev torna-se farol de saber e arte."
 STATIC_MODIFIER_NAME_kie_chernihiv_city_mod: "Tchernihiv Prospera"
 STATIC_MODIFIER_DESC_kie_chernihiv_city_mod: "Tchernihiv prospera como principal cidade do nordeste da Ucrânia."
 STATIC_MODIFIER_NAME_kie_wallachia_mod: "Valáquia Conquistada"
 STATIC_MODIFIER_DESC_kie_wallachia_mod: "A Valáquia conquistada e trazida à suserania de Kiev."
 STATIC_MODIFIER_NAME_kie_cavalry_mod: "Elite da Cavalaria Cossaca"
 STATIC_MODIFIER_DESC_kie_cavalry_mod: "A cavalaria cossaca forjada em força de elite — orgulho das armas de Kiev."
 STATIC_MODIFIER_NAME_kie_academy_mod: "Salas do Saber da Rus"
 STATIC_MODIFIER_DESC_kie_academy_mod: "A Academia Quiev-Mohyla se abre — as salas do saber da Rus brilham sobre a Europa Oriental."
 STATIC_MODIFIER_NAME_kie_krakow_mod: "Cidade dos Jagelões"
 STATIC_MODIFIER_DESC_kie_krakow_mod: "O estandarte de Kiev tremula da torre de Wawel, e a cidade dos Jagelões ouve o nome de seu novo senhor."
 STATIC_MODIFIER_NAME_kie_navy_mod: "Frota do Dnieper"
 STATIC_MODIFIER_DESC_kie_navy_mod: "Frota do Dnieper construída — o poder naval de Kiev surge no Mar Negro."
 STATIC_MODIFIER_NAME_kie_protector_mod: "Protetora da Ortodoxia"
 STATIC_MODIFIER_DESC_kie_protector_mod: "Kiev reconhecida como protetora dos cristãos ortodoxos de toda a Europa Oriental."
 STATIC_MODIFIER_NAME_kie_vilnius_mod: "Fim da Suserania Lituana"
 STATIC_MODIFIER_DESC_kie_vilnius_mod: "A suserania lituana sobre as terras rutenas termina — Kiev recupera o leste."
 STATIC_MODIFIER_NAME_kie_diplomacy_mod: "Laços com o Ocidente"
 STATIC_MODIFIER_DESC_kie_diplomacy_mod: "Os enviados do Grão-Príncipe de Kiev estão nos salões das cortes ocidentais, e seu nome está agora inscrito nos livros dos escribas estrangeiros."
 STATIC_MODIFIER_NAME_kie_silver_route_mod: "A Rota da Prata"
 STATIC_MODIFIER_DESC_kie_silver_route_mod: "A rota da prata do ocidente flui ao tesouro de Kiev."
 STATIC_MODIFIER_NAME_kie_ruthenian_army_mod: "Nascimento do Exército Rutênio"
 STATIC_MODIFIER_DESC_kie_ruthenian_army_mod: "Exército rutênio nascido — força disciplinada, que combina a cavalaria cossaca e a nobre."
 STATIC_MODIFIER_NAME_kie_warsaw_mod: "Pacificação da Polônia"
 STATIC_MODIFIER_DESC_kie_warsaw_mod: "Polônia pacificada — Varsóvia reconhece a suserania de Kiev."
 STATIC_MODIFIER_NAME_kie_beeswax_mod: "Cera e Mel"
 STATIC_MODIFIER_DESC_kie_beeswax_mod: "A cera e o mel das florestas ucranianas enriquecem o comércio de Kiev."
 STATIC_MODIFIER_NAME_kie_zhytomyr_mod: "Nó Comercial de Jitomir"
 STATIC_MODIFIER_DESC_kie_zhytomyr_mod: "Jitomir desenvolve-se como próspero nó comercial da Ucrânia da margem direita."
 STATIC_MODIFIER_NAME_kie_grand_principality_mod: "O Grão-Principado de Kiev"
 STATIC_MODIFIER_DESC_kie_grand_principality_mod: "Grão-Principado de Kiev proclamado — a mais poderosa força da Europa Oriental."
 STATIC_MODIFIER_NAME_kie_literacy_mod: "Alfabetização em Kiev"
 STATIC_MODIFIER_DESC_kie_literacy_mod: "Manuscritos do scriptorium do Mosteiro das Cavernas são levados às escolas, e as crianças de Kiev aprendem suas letras."
 kie_conquer_smolensk: "Expedição a Smolensk"
 kie_conquer_smolensk_desc: "Tome Smolensk, a “chave da Rus” e encruzilhada das comunicações leste-oeste — estabeleça influência sobre Moscou e a Polônia. Use Tchernihiv como cabeça de ponte para dominar toda a região de Smolensk."
 STATIC_MODIFIER_NAME_kie_smolensk_mod: "Smolensk — Encruzilhada do Comércio Leste-Oeste"
 STATIC_MODIFIER_DESC_kie_smolensk_mod: "Smolensk assegurada como importante nó leste-oeste."
 STATIC_MODIFIER_NAME_kie_chernihiv_mod: "Tchernihiv — Bastião da Margem Esquerda"
 STATIC_MODIFIER_DESC_kie_chernihiv_mod: "O coletor de impostos de Kiev, de pé no mercado de Tchernihiv, abre os livros de grãos da margem esquerda do Dnieper."
 kie_build_sevastopol: "Construção da Base Naval de Sebastopol"
 kie_build_sevastopol_desc: "Construa uma base naval rutena no porto natural de Teodoro — esse bastião marítimo, que domina o Mar Negro, tornar-se-á o porto de origem da frota cossaca."
 kie_build_odesa: "Construção do Porto de Odessa"
 kie_build_odesa_desc: "Construa o maior porto comercial da Rus no litoral de Hadjibey — esse porto, que liga o comércio do Mar Negro ao do Mediterrâneo, tornar-se-á artéria vital do comércio rutênio."
 STATIC_MODIFIER_NAME_kie_sevastopol_mod: "Base Naval de Sebastopol"
 STATIC_MODIFIER_DESC_kie_sevastopol_mod: "A base naval de Sebastopol, que domina o Mar Negro, erguida como bastião marítimo da Rus."
 STATIC_MODIFIER_NAME_kie_odesa_mod: "Porto Comercial de Odessa"
 STATIC_MODIFIER_DESC_kie_odesa_mod: "Odessa, centro do comércio do Mar Negro, construída — o comércio marítimo da Rus prospera."
 STATIC_MODIFIER_NAME_kie_unite_rus_mod: "Legado da Unificação"
 STATIC_MODIFIER_DESC_kie_unite_rus_mod: "Os príncipes da Rus reúnem-se na corte de um só Grão-Príncipe, e os funcionários de Kiev enviam ordens no mesmo formato aos escribas de todas as terras."
