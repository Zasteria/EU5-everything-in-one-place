l_braz_por:
 flo_magnifico_mission_pack: "O Legado do Il Magnifico"
 flo_magnifico_mission_pack_DESCRIPTION:0 "A República de Florença, sob a extraordinária casa dos Médici, lidera toda a Europa em comércio, arte e saber. Construirá sobre a enorme riqueza gerada pelo comércio da lã e pelo banco dos Médici e florescerá como berço do Renascimento? Ou unificará a Toscana, marchará sobre Roma e tornar-se-á senhora da Itália — Il Magnifico? Em Florença encontram-se a sabedoria do mercador e a ambição do governante."
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION:0 "Conclua as missões como Florença e alcance tanto o comércio e a cultura prósperos quanto a conquista da Itália."
 flo_magnifico_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para seguir o caminho do Il Magnifico."
 flo_magnifico_mission_pack_BUTTON_DETAILS:0 "Deixe o Renascimento florescer, domine a Toscana e torne-se senhora da Itália!"
 flo_rise_of_the_commune: "A Ascensão da Comuna"
 flo_rise_of_the_commune_desc: "Em 1337, Florença, em meio à luta entre guelfos (partido papal) e gibelinos (partido imperial), surgiu como “Comune” — cidade-Estado autogovernada de mercadores e artesãos. Os grandes bancos das famílias Bardi e Peruzzi governam as finanças europeias, e o comércio de lã ao longo do Arno enriquece a cidade. Mas a disputa de facções interna não cessa. Supere essa era de turbulência e conduza Florença à verdadeira grandeza."
 flo_the_prince: "O Príncipe"
 flo_the_prince_desc: "No tempo das Guerras Italianas, quando potências estrangeiras devastavam a Itália, o diplomata florentino Nicolau Maquiavel escreveu “O Príncipe”. Uma obra revolucionária, que olhava a realidade política com olhar frio, expressou o profundo desejo de um novo governante, capaz de unificar a Itália."
 flo_arte_della_lana: "A Indústria da Lã"
 flo_arte_della_lana_desc: "A Arte della Lana — guilda dos comerciantes de lã — é o coração da economia florentina. Importando lã inglesa e exportando tecido acabado por toda a Europa, gera a riqueza que torna grande a cidade."
 flo_medici_bank: "Fundação do Banco dos Médici"
 flo_medici_bank_desc: "O banco, fundado pela família Médici, funciona como banco oficial do papado romano, com filiais espalhadas por toda a Europa. Esse poder financeiro é a base sobre a qual Florença exerce influência tanto na cultura quanto na política."
 flo_arno_renewal: "Renovação do Arno"
 flo_arno_renewal_desc: "À medida que a cidade se desenvolve, as obras ao longo do Arno avançam, e Florença tornou-se uma das cidades prósperas da Itália. O alto nível de desenvolvimento traz à cidade um aumento constante no crescimento mensal."
 flo_arno_corridor: "O Corredor do Arno"
 flo_arno_corridor_desc: "A Ponte Vecchio e os canais, que cortam o Arno, são as artérias comerciais e administrativas de Florença. A construção de pontes e do transporte fluvial acelerará o desenvolvimento da cidade."
 flo_arno_trade_network: "A Rede Comercial do Arno"
 flo_arno_trade_network_desc: "A rede comercial, que se estende ao longo do Arno por toda a Toscana, é a fonte do poder comercial de Florença. Dominando essa rede, podemos trazer todo o comércio do norte da Itália ao nosso controle."
 flo_dominate_italian_trade: "Domine o Comércio Italiano"
 flo_dominate_italian_trade_desc: "A rede comercial de Florença abarca agora toda a Itália. Do norte ao sul, a economia italiana não pode funcionar sem os mercadores florentinos."
 flo_duomo_di_firenze: "Santa Maria del Fiore"
 flo_duomo_di_firenze_desc: "A conclusão da cúpula de Brunelleschi — feito que ultrapassou os limites da arquitetura de seu tempo. Sua grande cúpula enche os cidadãos de Florença de profundo orgulho e tornou-se símbolo eterno da cidade."
 flo_birthplace_of_renaissance: "Berço do Renascimento"
 flo_birthplace_of_renaissance_desc: "Florença lidera, como berço do Renascimento, a renovação espiritual de toda a Europa. O espírito de retorno à Antiguidade clássica e ao humanismo lançou aqui raízes profundas."
 flo_florentine_school_of_painting: "A Escola Florentina de Pintura"
 flo_florentine_school_of_painting_desc: "O estilo florentino de pintura, fundado por Botticelli e outros, antecipa-se a toda a Europa em perspectiva e realismo."
 flo_the_mona_lisa: "A Mona Lisa"
 flo_the_mona_lisa_desc: "A obra-prima de Leonardo da Vinci mudou o próprio conceito de pintura. O solo artístico de Florença, que continua a gerar tais gênios, é incomparável."
 flo_uffizi: "Os Uffizi"
 flo_uffizi_desc: "Pela união da coleção de arte reunida pela família Médici, os Uffizi podem tornar-se o maior museu do mundo. Seu prestígio cultural elevará para sempre o nome de Florença."
 flo_the_rise_of_medici: "A Ascensão dos Médici"
 flo_the_rise_of_medici_desc: "Após a queda das famílias Bardi e Peruzzi, ergueu-se uma nova dinastia bancária: os Médici. O banco dos Médici, fundado por Giovanni di Bicci de’ Medici em 1397, cresceu rapidamente graças às relações com o papado romano e ampliou as filiais por toda a Europa. Essa família levará adiante o futuro de Florença."
 flo_pazzi_conspiracy: "A Conspiração dos Pazzi"
 flo_pazzi_conspiracy_desc: "O atentado contra Lourenço de Médici, apoiado pelo papa Sisto IV e pela família Pazzi, fracassou e, paradoxalmente, apenas fortaleceu a autoridade dos Médici."
 flo_machiavelli: "As Obras de Maquiavel"
 flo_machiavelli_desc: "Em “O Príncipe”, Nicolau Maquiavel analisou friamente a realidade do poder. Seu pensamento influenciou profundamente a filosofia política florentina."
 flo_republic_of_virtue: "A República da Virtude"
 flo_republic_of_virtue_desc: "Florença busca ser não só um Estado comercial, mas também baseado na virtude e nos ideais republicanos. A legitimidade e a estabilidade são as pedras angulares da república."
 flo_camerata_fiorentina_nmt: "A Camerata Fiorentina"
 flo_camerata_fiorentina_nmt_desc: "A Camerata, onde se reúnem eruditos e músicos florentinos, torna-se viveiro de inovação musical, que levará ao nascimento da ópera. Cidade em que arte e ciência florescem como uma só."
 flo_subjugate_pisa: "Subjugue Pisa"
 flo_subjugate_pisa_desc: "Pisa, cidade portuária, há muito cobiçada por Florença como porta para o mar, deve ser assegurada. Tomar esse porto no Arno ampliará muito o alcance comercial de Florença."
 flo_siena_submitted: "Subjugação de Siena"
 flo_siena_submitted_desc: "Nossa antiga rival Siena foi enfim subjugada. Tendo vingado a humilhação de Montaperti, Florença acolhe seus seleiros e banqueiros e assegura pleno controle da Toscana meridional."
 flo_lucca_absorbed: "Absorção de Luca"
 flo_lucca_absorbed_desc: "Luca, que há muito preservou a independência, é um dos últimos obstáculos à unificação da Toscana por Florença. Traga sua indústria da seda ao governo florentino."
 flo_unify_tuscany: "Una a Toscana"
 flo_unify_tuscany_desc: "Agora que quase toda a Toscana está sob controle florentino, a elevação ao posto de reino é consequência natural. Florença já não é uma simples cidade-Estado."
 flo_push_into_lombardy: "Avanço sobre a Lombardia"
 flo_push_into_lombardy_desc: "Além da Toscana, chegou a hora de estender nosso domínio ao coração do norte da Itália. O conflito com Milão, Gênova e Veneza é inevitável."
 flo_march_on_rome: "Marcha sobre Roma"
 flo_march_on_rome_desc: "Quem governa Roma governa a Itália. Tendo trazido a antiga capital do Império Romano ao seu domínio, Florença reivindica uma legitimidade que ninguém iguala."
 flo_the_new_rome: "A Nova Roma"
 flo_the_new_rome_desc: "Florença, que conquistou Roma, governa agora a maior parte da península itálica e tornou-se um império. Chegou a hora de erguer uma nova Roma."
 flo_il_magnifico_of_italy: "O Il Magnifico da Itália"
 flo_il_magnifico_of_italy_desc: "Como Lourenço de Médici foi chamado “Il Magnifico”, assim toda Florença tornou-se a “Magnífica” da Itália."
 flo_medici_oriental_press: "A Prensa dos Médici de Manuscritos Orientais"
 flo_medici_oriental_press_desc: "A gráfica, erguida pela família Médici, reúne e imprime manuscritos gregos que afluíram após a queda do Império Bizantino. O saber antigo respira de novo na Europa."
 flo_clock_tower: "A Torre do Relógio da Piazza della Signoria"
 flo_clock_tower_desc: "A precisa torre do relógio, erguida no Palazzo della Signoria, tornou-se símbolo da perícia técnica florentina. A gestão do tempo melhora a eficiência do comércio e do governo."
 flo_first_modern_engineer: "O Primeiro Engenheiro Moderno"
 flo_first_modern_engineer_desc: "Filippo Brunelleschi desenvolveu métodos construtivos revolucionários, que superaram a Roma antiga na construção da cúpula. Seu legado técnico é aplicado às fortificações de toda a Itália."
 flo_humiliate_venice: "Humilhe Veneza"
 flo_humiliate_venice_desc: "Chegou a hora de superar nossa antiga rival marítima, a República de Veneza. Pondo a Rainha do Adriático em seu lugar, provaremos que Florença é a nação líder da Itália."
 flo_papal_relations: "Relações com o Papado"
 flo_papal_relations_desc: "Agora que Roma está assegurada, as relações com o papado devem ser postas sobre base sólida. Seja por aliança, seja por supremacia, Florença tornar-se-á o maior mecenas da igreja romana."
 flo_vasari_corridor: "Os Uffizi e o Corredor Vasariano"
 flo_vasari_corridor_desc: "O Corredor Vasariano, que liga o palácio dos Uffizi e a Ponte Vecchio, foi projetado por Giorgio Vasari por encomenda de Cosimo I de Médici. Essa passagem elevada secreta simboliza o poder e a superioridade artística dos Médici."
 flo_academy_of_florence: "A Academia de Florença"
 flo_academy_of_florence_desc: "A Academia, erguida em Florença, tornou-se lugar de pesquisa abrangente de arte, ciência e filosofia. O saber do Renascimento espalha-se daqui ao mundo."
 flo_italian_cultural_hegemon: "Hegemon Cultural da Itália"
 flo_italian_cultural_hegemon_desc: "Florença, onde o comércio, a arte e o saber floresceram como um só, tornou-se o centro cultural de toda a Itália. Sua influência alcança até além dos Alpes."
 flo_magnifico: "Il Magnifico"
 flo_magnifico_desc: "De cidade comercial, Florença elevou-se ao auge da cultura, conquistou toda a Itália e estabeleceu-se como herdeira do Império Romano. “Il Magnifico” — o nome do Magnífico gravado para sempre na história."
 STATIC_MODIFIER_NAME_flo_arte_della_lana_mod: "Indústria da Lã Próspera"
 STATIC_MODIFIER_DESC_flo_arte_della_lana_mod: "A Arte della Lana (guilda da lã) era a maior guilda de Florença e a base da prosperidade urbana. O tecido finamente trabalhado, feito de lã bruta comprada na Inglaterra e na Espanha, era estimado em toda a Europa e tornou-se a fonte da enorme fortuna dos Médici."
 STATIC_MODIFIER_NAME_flo_medici_bank_mod: "Supremacia do Banco dos Médici"
 STATIC_MODIFIER_DESC_flo_medici_bank_mod: "Fundado por Giovanni di Bicci de’ Medici em 1397, o banco dos Médici tinha, em seu auge, filiais em dezesseis cidades, incluindo Roma, Veneza, Londres e Bruges. Como banco oficial da corte papal, colhia enormes lucros, contornando a proibição eclesiástica da usura sob a forma de “lucro de câmbio”."
 STATIC_MODIFIER_NAME_flo_arno_trade_network_mod: "A Rede Comercial do Arno"
 STATIC_MODIFIER_DESC_flo_arno_trade_network_mod: "O Arno era a grande via fluvial que ligava Florença ao porto de Pisa. Pelo domínio das rotas comerciais ao longo de seu curso, Florença, cidade do interior, participava diretamente do comércio mediterrâneo, criando uma esfera econômica singular, que combinava tecido, banca e comércio."
 STATIC_MODIFIER_NAME_flo_dominate_italian_trade_mod: "Supremacia no Comércio Italiano"
 STATIC_MODIFIER_DESC_flo_dominate_italian_trade_mod: "A Itália do fim da Idade Média era a maior zona comercial da Europa, com mercadores de Florença, Veneza e Gênova no topo. Os mercadores florentinos teciam uma rede financeira por toda a Europa setentrional, com influência suficiente para emprestar a ambos os lados da Guerra dos Cem Anos entre Inglaterra e França."
 STATIC_MODIFIER_NAME_flo_duomo_di_firenze_mod: "Conclusão da Catedral"
 STATIC_MODIFIER_DESC_flo_duomo_di_firenze_mod: "A cúpula da catedral de Florença (Santa Maria del Fiore) foi concluída por Brunelleschi em 1436. Revolucionária realização técnica — uma gigantesca cúpula, erguida sem andaimes de madeira nem suportes construtivos, algo que ninguém alcançava havia mais de mil anos desde o Panteão de Roma — simboliza o espírito do Renascimento."
 STATIC_MODIFIER_NAME_flo_birthplace_of_renaissance_mod: "Berço do Renascimento"
 STATIC_MODIFIER_DESC_flo_birthplace_of_renaissance_mod: "O “Renascimento” — renascimento — nasceu em Florença. Na Academia Platônica, fundada por Cosimo de’ Medici, Marsilio Ficino e outros ressuscitaram o pensamento da Grécia e de Roma antigas e, combinado com a tradição literária de Dante, Petrarca e Boccaccio, transformou a civilização ocidental até seus fundamentos."
 STATIC_MODIFIER_NAME_flo_florentine_school_of_painting_mod: "Escola Florentina de Pintura"
 STATIC_MODIFIER_DESC_flo_florentine_school_of_painting_mod: "A tradição da pintura realista, fundada por Giotto di Bondone no fim do século XIII, passou à perspectiva de Masaccio, à graça de Botticelli e à versatilidade de Leonardo. A pintura florentina encarnou a transição das imagens sagradas medievais à arte moderna e definiu o rumo da pintura europeia."
 STATIC_MODIFIER_NAME_flo_the_mona_lisa_mod: "A Influência da Mona Lisa"
 STATIC_MODIFIER_DESC_flo_the_mona_lisa_mod: "Pintada por volta de 1503-1519 por Leonardo da Vinci, a “Mona Lisa”, com seu sorriso enigmático e sua inovadora perspectiva e técnica sfumato, tornou-se a obra mais famosa da história da arte ocidental. Leonardo foi gênio universal, abrangendo não só a pintura, mas também a anatomia, a engenharia, a arquitetura e a música."
 STATIC_MODIFIER_NAME_flo_uffizi_mod: "A Glória dos Uffizi"
 STATIC_MODIFIER_DESC_flo_uffizi_mod: "O palácio dos Uffizi, projetado por Vasari por encomenda de Cosimo I de Médici em 1560, era inicialmente um escritório administrativo (Uffizi significa “escritórios”), mas depois abrigou as coleções dos Médici e tornou-se um dos primeiros museus do mundo — templo da arte, onde se reúnem as obras de Botticelli, Leonardo e Michelangelo."
 STATIC_MODIFIER_NAME_flo_machiavelli_mod: "Os Ensinamentos do Príncipe"
 STATIC_MODIFIER_DESC_flo_machiavelli_mod: "Nicolau Maquiavel serviu à República Florentina como diplomata e administrador de 1498 a 1512. “O Príncipe”, escrito após o exílio dos Médici, foi uma obra de pensamento político realista, que afirmava que “os fins justificam os meios”, e tornou-se a base da teoria política moderna."
 STATIC_MODIFIER_NAME_flo_republic_of_virtue_mod: "A República da Virtude"
 STATIC_MODIFIER_DESC_flo_republic_of_virtue_mod: "Florença tinha um sistema peculiar, que preservava a fachada republicana enquanto os Médici governavam de fato. Instituições como a Signoria (governo da cidade), os Priori (magistrados) e o Grande Conselho combinavam hábilmente os ideais do republicanismo e a realidade da oligarquia."
 STATIC_MODIFIER_NAME_flo_camerata_fiorentina_mod: "A Camerata Fiorentina"
 STATIC_MODIFIER_DESC_flo_camerata_fiorentina_mod: "A “Camerata”, círculo de músicos, poetas e eruditos que se reunia nas décadas de 1570 e 1580 na residência do conde Giovanni de’ Bardi, em Florença, buscava ressuscitar o antigo drama grego. Seus experimentos deram à luz uma forma de arte inteiramente nova, a ópera, e mudaram para sempre a história da música ocidental."
 STATIC_MODIFIER_NAME_flo_subjugate_pisa_mod: "O Porto de Pisa"
 STATIC_MODIFIER_DESC_flo_subjugate_pisa_mod: "Pisa governou outrora uma república marítima ao lado de Veneza e Gênova sobre o Mediterrâneo, mas decaiu após a esmagadora derrota diante de Gênova na batalha de Meloria, em 1284. Com a conquista de Pisa por Florença em 1406, a outrora terrestre Florença obteve enfim acesso ao mar."
 STATIC_MODIFIER_NAME_flo_siena_submitted_mod: "Subjugação de Siena"
 STATIC_MODIFIER_DESC_flo_siena_submitted_mod: "Siena foi a rival hereditária de Florença, que há muito disputava a supremacia sobre a Toscana. Siena manteve a independência com apoio espanhol, mas acabou caindo em 1555. Trazer ao governo florentino os orgulhosos sieneses, conhecidos pelas corridas do Palio, é símbolo da unificação da Toscana."
 STATIC_MODIFIER_NAME_flo_lucca_absorbed_mod: "Seda e Tecido de Luca"
 STATIC_MODIFIER_DESC_flo_lucca_absorbed_mod: "Luca era a cidade de indústria da seda mais fina da Toscana. Nos séculos XIII e XIV, a seda lucquesa era estimada em toda a Europa, adornando as vestes de príncipes e nobres. Também merece atenção a riqueza dos banqueiros de Luca, rivais dos Médici."
 STATIC_MODIFIER_NAME_flo_unify_tuscany_mod: "Senhor da Toscana"
 STATIC_MODIFIER_DESC_flo_unify_tuscany_mod: "Arezzo, antiga cidade dos etruscos; Siena, cidade da poesia; Luca, cidade dos ofícios; Pisa, o porto — pela sua unificação, Florença torna-se o centro da Toscana como todo histórico, cultural e geográfico. Esse feito une a romana “Tuscia” sob o estandarte dos Médici."
 STATIC_MODIFIER_NAME_flo_push_into_lombardy_mod: "Avanço sobre a Lombardia"
 STATIC_MODIFIER_DESC_flo_push_into_lombardy_mod: "Florença e Milão foram as duas grandes potências da política italiana do século XV, sempre em tensão. Contra a política expansionista dos duques Visconti e Sforza de Milão, Florença resistiu com diplomacia e condottieri, comandantes mercenários. Esse equilíbrio de poder gerou a sofisticação da diplomacia renascentista."
 STATIC_MODIFIER_NAME_flo_the_new_rome_mod: "A Nova Roma"
 STATIC_MODIFIER_DESC_flo_the_new_rome_mod: "Florença era frequentemente chamada de “Nova Roma”. Cosimo e Lourenço de Médici imitaram conscientemente a cultura de mecenato de Roma, buscando recriar as virtudes da Roma antiga no espírito do Renascimento. Dominar a própria Roma é a conclusão simbólica desse objetivo."
 STATIC_MODIFIER_NAME_flo_il_magnifico_of_italy_mod: "O Il Magnifico da Itália"
 STATIC_MODIFIER_DESC_flo_il_magnifico_of_italy_mod: "Lourenço de Médici (Lourenço, o Magnífico, 1449-1492) estava no auge de sua época como artista, poeta, diplomata e estadista. A política de equilíbrio, que chamou de “equilíbrio da Itália”, preservou a paz no limiar das Guerras Italianas, e sua corte irradiava o mais refinado brilho da cultura renascentista."
 STATIC_MODIFIER_NAME_flo_medici_oriental_press_mod: "O Legado do Saber Oriental"
 STATIC_MODIFIER_DESC_flo_medici_oriental_press_mod: "No Concílio de Ferrara-Florença de 1438-1439, Cosimo de’ Medici comprou grande número de manuscritos gregos de eruditos que vieram de Bizâncio. Essa coleção levou à tradução latina de Platão e ao renascimento do neoplatonismo, mudando a história do pensamento ocidental. Combinado com a revolução da imprensa de Gutenberg, o saber espalhou-se com rapidez."
 STATIC_MODIFIER_NAME_flo_clock_tower_mod: "Precisão da Torre do Relógio"
 STATIC_MODIFIER_DESC_flo_clock_tower_mod: "Os relógios mecânicos começaram a aparecer nas praças das cidades do norte da Itália no século XIV. O campanário (Campanile) da catedral de Florença, projetado por Giotto, é exemplo típico. A medição comum do tempo unificou o comércio e o governo da cidade e tornou-se infraestrutura que sustentou a transição da Idade Média à modernidade."
 STATIC_MODIFIER_NAME_flo_the_rise_of_medici_mod: "A Ascensão dos Médici"
 STATIC_MODIFIER_DESC_flo_the_rise_of_medici_mod: "Cosimo de’ Medici (chamado Pater Patriae, 1389-1464), apoiando-se nos lucros bancários, baniu seus inimigos políticos e tornou-se governante de fato de Florença. Como tesoureiro da corte papal, mecenas das artes e mediador na diplomacia, lançou a base da glória da casa de Médici."
 STATIC_MODIFIER_NAME_flo_first_modern_engineer_mod: "Pioneiro da Engenharia Moderna"
 STATIC_MODIFIER_DESC_flo_first_modern_engineer_mod: "Filippo Brunelleschi trouxe revolução à arquitetura, à escultura e à engenharia. Teorizou a perspectiva linear e realizou a grande cúpula da catedral de Florença por meio de inovadoras técnicas de dupla casca e armação. É o arquétipo do “homem universal” (uomo universale) renascentista."
 STATIC_MODIFIER_NAME_flo_humiliate_venice_mod: "A Humilhação de Veneza"
 STATIC_MODIFIER_DESC_flo_humiliate_venice_mod: "Florença e Veneza, duas grandes potências comerciais da Itália medieval, rivalizaram em prosperidade e conflitaram há muito tanto diplomática quanto militarmente. O conflito sobre a expansão em Milão, no século XV, foi particularmente feroz, e Florença sempre viu a expansão terrestre de Veneza (a política de Terraferma) como ameaça."
 STATIC_MODIFIER_NAME_flo_papal_relations_mod: "Laços com o Papado"
 STATIC_MODIFIER_DESC_flo_papal_relations_mod: "As relações entre os Médici e a corte papal eram complexas. Após a conspiração dos Pazzi de 1478 (intento assassino, no qual esteve envolvido o arcebispo Francesco Salviati), que matou o irmão de Lourenço, Giuliano, Lourenço entrou por algum tempo em conflito com Sisto IV, mas depois reconciliou-se e restaurou sólidas relações."
 STATIC_MODIFIER_NAME_flo_academy_of_florence_mod: "A Academia de Florença"
 STATIC_MODIFIER_DESC_flo_academy_of_florence_mod: "A Academia Platônica, apoiada por Cosimo de’ Medici, empreendeu, sob a liderança de Marsilio Ficino, o renascimento da filosofia antiga. A tradução latina das obras completas de Platão, a tradução do Corpus Hermeticum, a sistematização do neoplatonismo — esses empreendimentos espirituais renovaram as próprias bases da filosofia, da teologia e da ciência ocidentais."
 STATIC_MODIFIER_NAME_flo_italian_cultural_hegemon_mod: "Mecenas da Arte Italiana"
 STATIC_MODIFIER_DESC_flo_italian_cultural_hegemon_mod: "A Florença do Renascimento era o centro cultural de toda a Europa. Príncipes e nobres da França, dos Países Baixos, da Alemanha e da Inglaterra convidavam artistas, arquitetos e eruditos florentinos, competindo na imitação da cultura de corte “italiana”."
 STATIC_MODIFIER_NAME_flo_magnifico_mod: "A Glória do Il Magnifico"
 STATIC_MODIFIER_DESC_flo_magnifico_mod: "“Il Magnifico” — expressão que reflete não só o brilho de um homem, mas o de toda a cidade de Florença. A glória de Florença, no topo da Europa tanto em arte, filosofia, diplomacia quanto em finanças, encarna a própria essência da era que as gerações posteriores chamarão de “Renascimento”."
 flo_events.1.t: "A Ascensão da Comuna Florentina"
 flo_events.1.d: "Em 1337, Florença está dominada por uma longa luta entre as facções dos guelfos e dos gibelinos. Os grandes bancos das famílias Bardi e Peruzzi, sobrecarregados por enormes empréstimos ao rei da Inglaterra, começam a vacilar. A sombra da Peste Negra aproxima-se sorrateira do leste, e alguns tramam convidar o tirano Gautier de Brienne. E, no entanto, o espírito da comuna florentina — a cidade mercantil autogovernada — está vivo. Com base no comércio de lã e nas guildas mercantis, sobreviva a essa era de tempestades."
 flo_events.1.a: "O futuro de Florença está em nossas mãos"
 flo_events.3.t: "Consequências da Conspiração dos Pazzi"
 flo_events.3.d: "O atentado contra Lourenço de Médici, apoiado pelo papa Sisto IV e pela família Pazzi, fracassou e, paradoxalmente, apenas fortaleceu a autoridade dos Médici. Os conspiradores executados, e os cidadãos de Florença reforçaram ainda mais seu apoio aos Médici. Tendo sobrevivido a essa prova, a estrutura política da república está pronta para renascer em algo mais refinado."
 flo_events.3.a: "A prova nos tornou mais fortes"
 flo_events.4.t: "Marcha sobre Roma"
 flo_events.4.d: "A antiga capital do Império Romano está agora sob o estandarte de Florença. A Doação de Constantino já provada falsificação — se assim for, a legítima autoridade de governar a Itália pertence a Florença, conquistada pela força e pela sabedoria. Essa pequena república, nascida de uma cidade comercial, percorre agora o caminho rumo ao império, cujo nome será gravado na história."
 flo_events.4.a: "Roma brilha com a glória de Florença"
 STATIC_MODIFIER_NAME_flo_arno_renewal_mod: "La Grande Opera"
 STATIC_MODIFIER_DESC_flo_arno_renewal_mod: "As cheias do Arno afligiram Florença por anos (a inundação de 1966 é discutida até hoje). Mas, melhorando as margens, construindo pontes e reforçando os diques, o rio tornou-se antes uma vantagem da cidade. As oficinas, tinturarias e lavagens de lã ao longo do rio operavam como coração da economia florentina."
 STATIC_MODIFIER_NAME_flo_arno_corridor_mod: "Prosperidade da Ponte Vecchio"
 STATIC_MODIFIER_DESC_flo_arno_corridor_mod: "A Ponte Vecchio (Ponte Velha) é a mais antiga ponte sobre o Arno e, desde o século XIV, símbolo do comércio florentino, ladeada por lojas de ourives e joalheiros. Renovada como parte do Corredor Vasariano, que Cosimo I ordenou erguer para ligar os Uffizi ao Palácio Pitti, tornou-se passagem simbólica, que une o governante e a cidade."
 STATIC_MODIFIER_NAME_flo_vasari_corridor_mod: "O Corredor Vasariano"
 STATIC_MODIFIER_DESC_flo_vasari_corridor_mod: "Concluído por Giorgio Vasari em apenas cinco meses em 1565, o Corredor Vasariano é uma passagem elevada, que liga o palácio dos Uffizi, passando pela Ponte Vecchio, ao Palácio Pitti. Projetado para que Cosimo I pudesse mover-se sem se misturar à multidão, é a cristalização técnica da segurança do governante e de seu domínio sobre a cidade."
 flo_events.5.t: "Os Uffizi e o Corredor Vasariano"
 flo_events.5.d: "Cosimo I de Médici ordenou ao arquiteto Giorgio Vasari que ligasse o palácio dos Uffizi (sede da administração) ao Palácio Pitti por uma passagem elevada secreta. Esse “Corredor Vasariano”, que corre sobre a Ponte Vecchio, é uma passagem oculta, que permitia ao governante mover-se sem ser visto pelo público — símbolo do poder dos Médici e de seu domínio sobre a cidade. Essa arquitetura genial, que cruza o Arno, mostra claramente que a política e a arte, em Florença, são uma e a mesma coisa."
 flo_events.5.a: "A conclusão do corredor elevou o governo de Florença a um novo nível"
 STATIC_MODIFIER_NAME_flo_the_prince_mod: "O Novo Príncipe"
 STATIC_MODIFIER_DESC_flo_the_prince_mod: "Em “O Príncipe” (1513), Maquiavel proclamava que é preciso ter “a força do leão e a astúcia da raposa”. O realismo de que é mais seguro ser temido respeitosamente do que amado e de que, em caso de necessidade, deve-se pôr a conservação do poder acima da moralidade tornou-se o ponto de partida da ciência política contemporânea."
 flo_events.6.t: "O Príncipe"
 flo_events.6.d: "As Guerras Italianas deram a Florença uma dura lição. O diplomata Nicolau Maquiavel escreveu “O Príncipe”, obra que revela a própria essência do poder. Para unificar a Itália fragmentada, é necessário um novo governante, que ponha o poder real acima da moralidade. “Somente um príncipe, que possua tanto virtù quanto fortuna, pode salvar a Itália no caos” — e, talvez, essa resposta esteja na própria Florença."
 flo_events.6.a: "Que se erga um novo príncipe, para salvar a Itália!"
