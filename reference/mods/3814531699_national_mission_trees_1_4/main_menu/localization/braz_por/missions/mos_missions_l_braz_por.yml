l_braz_por:
 mos_moscow_mission_pack: "Do jugo tártaro ao autocrata de toda a Rus"
 mos_moscow_mission_pack_DESCRIPTION:0 "Em 1337, o Grão-Principado de Moscou é um pequeno principado sob o domínio da Horda de Ouro. Graças ao astuto acúmulo de riqueza e à destreza diplomática de Ivan I Kalitá diante dos tártaros, Moscou foi crescendo sem parar. Mas Novgorod, Tver e a Lituânia a cercam, enquanto a ameaça tártara persiste ao sul. Livre-se do jugo tártaro, una os principados russos, proclame-se tsar, governe como Terceira Roma e torne-se o autocrata de toda a Rus — senhor até os confins da Sibéria."
 mos_moscow_mission_pack_CRITERIA_DESCRIPTION:0 "Livre-se do jugo tártaro, conquiste Cazã, Astracã e Novgorod para unir a Rus, assuma o título de tsar, torne-se a Terceira Roma e conquiste a Sibéria."
 mos_moscow_mission_pack_BUTTON_TOOLTIP:0 "Torne-se o autocrata de toda a Rus."
 mos_moscow_mission_pack_BUTTON_DETAILS:0 "Do Grão-Principado de Moscou ao Império Russo — cumpra o destino histórico!"
 mos_rally_the_army: "Mobilize o exército"
 mos_rally_the_army_desc: "Em 1337, o Grão-Principado de Moscou cresce sem cessar graças à astuta destreza de Ivan I Kalitá. Prepare o exército e inicie a expansão do domínio moscovita sobre os principados russos."
 mos_break_tatar_yoke: "Quebre o jugo tártaro"
 mos_break_tatar_yoke_desc: "Desde 1237, os tributos e a submissão aos tártaros oprimem a Rus. A memória da vitória de Dmitri Donskoi no Campo de Kulikovo ainda vive. Declare plena independência e quebre o jugo tártaro para sempre."
 mos_conquer_kazan: "Conquista de Cazã"
 mos_conquer_kazan_desc: "O Canato de Cazã controla a rota comercial do Volga. Conquistá-lo dá a Moscou o domínio sobre o grande rio — antecipe a vitória de Ivan, o Terrível, em 1552."
 mos_subjugate_kazan: "Subjugue o Médio Volga"
 mos_subjugate_kazan_desc: "Depois de conquistar Cazã, tome a bacia do médio Volga — Samara e Tambov — para abrir o caminho ao sul."
 mos_conquer_astrakhan: "Conquista de Astracã"
 mos_conquer_astrakhan_desc: "O Canato de Astracã controla o delta do baixo Volga. Conquiste-o para garantir o acesso ao Mar Cáspio e a rota comercial oriental."
 mos_destroy_hordes: "Destruição das Hordas"
 mos_destroy_hordes_desc: "Esmague os Estados sucessores tártaros, incluindo a Horda Nogai, e abra o caminho para a estepe."
 mos_claim_steppes: "Reivindique as Estepes"
 mos_claim_steppes_desc: "Conquiste a estepe pôntica na costa norte do Mar Negro para revelar a face de Moscou como grande império continental."
 mos_black_sea_access: "Acesso ao Mar de Azov"
 mos_black_sea_access_desc: "Avance rumo ao Mar de Azov para garantir acesso ao comércio do Mar Negro — antecipe a tomada de Azov por Pedro, o Grande, em 1696."
 mos_conquer_crimea: "Conquista da Crimeia"
 mos_conquer_crimea_desc: "Conquiste o Canato da Crimeia para estabelecer o domínio sobre o Mar Negro — antecipe a anexação de Catarina, a Grande, em 1783."
 mos_consolidate_russia: "Consolide a Rus"
 mos_consolidate_russia_desc: "Com Moscou ao centro, consolide os principados russos numa única e poderosa base estatal."
 mos_dev_moscow: "Desenvolva o Kremlin"
 mos_dev_moscow_desc: "Desenvolva o Kremlin de Moscou — símbolo do poder russo. As grandes catedrais que enchem essa sede sagrada tornam-se o coração do Império Russo."
 mos_conquer_novgorod: "Conquista de Novgorod"
 mos_conquer_novgorod_desc: "Novgorod — outrora a maior cidade-Estado mercantil da Rus. Realize ainda mais cedo a conquista decisiva de Ivan III em 1478."
 mos_conquer_tver: "Conquista de Tver"
 mos_conquer_tver_desc: "Tver, antiga rival de Moscou — seu poder diminuiu. Conquiste essa cidade-chave às margens do Volga para avançar a unificação da Rus."
 mos_conquer_ryazan: "Subjugação de Riazã"
 mos_conquer_ryazan_desc: "Riazã, devastada pela primeira vez pelos mongóis em 1237 — conquiste sua estepe meridional e construa uma linha de defesa."
 mos_conquer_smolensk: "Conquista de Smolensk"
 mos_conquer_smolensk_desc: "Smolensk, a “chave da Rus” — controle essa encruzilhada de leste e oeste para estabelecer influência ocidental."
 mos_conquer_ruthenia: "Conquista da Rutênia Branca"
 mos_conquer_ruthenia_desc: "A Rutênia Branca — conquiste essa área controlada pela Lituânia, com capital em Minsk, e estabeleça o domínio pan-eslavo."
 mos_window_on_west: "Janela para o Ocidente"
 mos_window_on_west_desc: "Tome Vyborg e a Carélia para abrir a “janela para o Ocidente” — antecipe o sonho de Pedro, o Grande, de acesso ao Ocidente."
 mos_baltic_ambition: "Ambição Báltica"
 mos_baltic_ambition_desc: "A costa leste do Báltico, controlada pela Ordem Livônia — conquistar essa área permite entrar no comércio do norte da Europa."
 mos_conquer_riga: "Conquista de Riga"
 mos_conquer_riga_desc: "Riga, pilar da Hansa — conquiste esse centro comercial báltico para obter acesso à rede comercial do norte da Europa."
 mos_partition_poland: "Partilha da Polônia"
 mos_partition_poland_desc: "Encerre a longa luta com a Comunidade Polaco-Lituana pela Rutênia Branca e pela Europa Oriental."
 mos_metropolitan_see: "A Metrópole de Moscou"
 mos_metropolitan_see_desc: "Em 1448 Moscou estabeleceu uma metrópole eclesiástica independente. Essa autoridade ortodoxa sustenta a legitimidade política de Moscou."
 mos_land_of_churches: "Terra das Igrejas"
 mos_land_of_churches_desc: "A “Santa Rus” — construa catedrais ortodoxas por toda a terra e santifique a Rus como reino de Deus."
 mos_tsar_title: "O Título de Tsar"
 mos_tsar_title_desc: "“Tsar (Imperador)” — Ivan IV assumiu formalmente esse título em 1547. Proclame o poder como herdeiro de Roma e obtenha reconhecimento como potência europeia."
 mos_russian_patriarchate: "O Patriarcado Russo"
 mos_russian_patriarchate_desc: "O patriarcado de Moscou, estabelecido em 1589, independente de Constantinopla — reforce os alicerces religiosos da “Terceira Roma”."
 mos_guardian_orthodoxy: "Guardiã da Ortodoxia"
 mos_guardian_orthodoxy_desc: "Com a queda de Constantinopla para os otomanos em 1453, a Rus torna-se guardiã da fé ortodoxa. Construa a rede ortodoxa por toda a terra."
 mos_conquer_constantinople: "Conquista de Constantinopla"
 mos_conquer_constantinople_desc: "Recupere a santa capital ortodoxa, Constantinopla, das mãos otomanas — cumpra a missão da “Terceira Roma” e reescreva a história."
 mos_third_rome: "A Terceira Roma"
 mos_third_rome_desc: "“Moscou é a Terceira Roma, e uma quarta não haverá” — as palavras do monge Filoteu tornam-se realidade. Moscou reina como centro espiritual do mundo cristão."
 mos_march_caucasus: "Marcha ao Cáucaso"
 mos_march_caucasus_desc: "Conquiste a Geórgia, a Armênia e o Azerbaijão nas montanhas do Cáucaso e faça da Rússia um verdadeiro império continental."
 mos_caspian_sea: "Domínio do Mar Cáspio"
 mos_caspian_sea_desc: "O “mar interior russo”, o Cáspio — conquiste a rota comercial para a Pérsia e a Ásia Central."
 mos_beyond_urals: "Além dos Urais"
 mos_beyond_urals_desc: "Os Montes Urais marcam a fronteira entre a Europa e a Ásia — além deles estendem-se os vastos espaços da Sibéria. Antecipe a conquista de Iermak, de 1582, e reivindique a terra das peles."
 mos_conquer_perm: "Conquista de Perm"
 mos_conquer_perm_desc: "Perm, no alto Kama — conquiste essa fonte das “peles de Kama” e use-a como cabeça de ponte para a conquista da Sibéria."
 mos_west_siberia: "Sibéria Ocidental"
 mos_west_siberia_desc: "A Sibéria Ocidental, com capital em Tobolsk — a vasta taiga fornece recursos de peles sem fim. Desenvolva Tobolsk como “capital da Sibéria”."
 mos_east_siberia: "Sibéria Oriental"
 mos_east_siberia_desc: "Até Irkutsk — alcançar o Lago Baikal abre a porta para a Sibéria Oriental."
 mos_pacific_coast: "Alcance a Costa do Pacífico"
 mos_pacific_coast_desc: "“Os cossacos chegaram ao Pacífico” — de Iakutsk ao Mar de Okhotsk. A bandeira russa tremula no extremo do Pacífico."
 mos_fur_monopoly: "Monopólio das Peles"
 mos_fur_monopoly_desc: "As peles siberianas são a mercadoria mais valiosa dos mercados europeus. Monopolize seu suprimento e obtenha riqueza incalculável."
 mos_sudebnik: "O Sudebnik"
 mos_sudebnik_desc: "O Sudebnik de 1497, o primeiro código de leis uniforme da Rus de Ivan III — esse código, base da servidão camponesa, torna-se instrumento de centralização."
 mos_handle_boyars: "Subjugue os Boiardos"
 mos_handle_boyars_desc: "Os boiardos controlam o poder local — quebre essa posição e estabeleça governadores diretos do tsar para avançar a centralização."
 mos_oprichnina: "A Oprichnina"
 mos_oprichnina_desc: "A sombria oprichnina de Ivan IV — os cavaleiros negros do tsar purgavam os boiardos rebeldes. Use essa política cruel, porém eficaz, para tornar absoluto o poder do tsar."
 mos_dev_agriculture: "Desenvolva a Agricultura"
 mos_dev_agriculture_desc: "O rico chernozem russo — desenvolva as férteis terras que se estendem da Ucrânia ao Volga para elevar a produtividade agrícola."
 mos_dev_agriculture_unlock_tt: "A decisão “Promover o desenvolvimento agrícola” está agora disponível."
 mos_agriculture_decision.title: "Promover o desenvolvimento agrícola"
 mos_agriculture_decision.desc: "A terra negra estende-se da Ucrânia ao Volga, mas sua colheita depende de ferramentas, celeiros e da cooperação dos grandes proprietários. O tesouro e a influência do soberano na corte podem ser gastos para organizá-la."
 mos_agriculture_decision.a: "Organizar as colheitas."
 mos_agriculture_upgrade_decision.title: "O grande cultivo da terra negra"
 mos_agriculture_upgrade_decision.desc: "Garantidas as primeiras colheitas, o Estado pode pôr a própria fronteira da estepe sob o arado: novas aldeias, novos moinhos e novas estradas para escoar o grão. Custará uma fortuna e muito da influência do soberano, mas a terra negra renderá como nunca."
 mos_agriculture_upgrade_decision.a: "Pôr a fronteira da estepe sob o arado."
 mos_pomestye_system: "O Sistema Pomiestie"
 mos_pomestye_system_desc: "O sistema pomiestie — concessão de terras em troca de serviço militar — cria a base do poder militar da Rus."
 mos_streltsy: "Estabeleça os Streltsy"
 mos_streltsy_desc: "Os streltsy — infantaria permanente de fuzileiros criada por Ivan IV. Essa formação de elite torna-se a espinha dorsal do exército russo."
 mos_zasechnaya_cherta: "A Linha Zasechnaia"
 mos_zasechnaya_cherta_desc: "Construa a “Linha Zasechnaia” de árvores derrubadas e fortalezas como linha de defesa contra as incursões da cavalaria tártara."
 mos_dev_arkhangelsk: "Erga Arcangel"
 mos_dev_arkhangelsk_desc: "Arcangel, porto no Mar Branco — o único porto mercantil marítimo da Rus antes de Pedro, o Grande. Desenvolva esse porto para o comércio direto com a Europa Ocidental."
 mos_white_sea_trade: "Comércio do Mar Branco"
 mos_white_sea_trade_desc: "A Companhia Moscovita inglesa (1555) entrou na Rus por aqui — antecipe-se e tome a rota comercial do Mar Branco."
 mos_dev_nizhny: "Desenvolva Níjni Novgorod"
 mos_dev_nizhny_desc: "Na confluência do Volga e do Oka — desenvolva “Níjni Novgorod” como centro do comércio do Volga."
 mos_conquer_pskov: "Conquista de Pskov"
 mos_conquer_pskov_desc: "Pskov foi incorporada a Moscou em 1510. Seguindo Novgorod, conquiste Pskov e subjugue por completo a Rus Noroeste."
 mos_dev_yaroslavl: "Desenvolva Iaroslavl"
 mos_dev_yaroslavl_desc: "Iaroslavl, do “Anel de Ouro” — desenvolva essa cidade mercantil às margens do Volga como nó de trânsito do comércio do norte."
 mos_conquer_vologda: "Desenvolva Vologda"
 mos_conquer_vologda_desc: "Vologda — tome essa encruzilhada-chave da rota do norte e garanta a ligação com o comércio do Mar Branco."
 mos_amber_road: "A Rota do Âmbar"
 mos_amber_road_desc: "O âmbar do Báltico — forneça essa mercadoria aos mercados europeus por Riga e aumente a renda comercial."
 mos_reform_taxation: "Reforma Tributária"
 mos_reform_taxation_desc: "Estabeleça um sistema tributário uniforme e fortaleça as finanças do Estado. A receita fiscal centralizada sustenta o exército russo."
 mos_dev_kazan_city: "Desenvolva a Cidade de Cazã"
 mos_dev_kazan_city_desc: "Desenvolva a conquistada Cazã numa cidade multiétnica onde coexistem tártaros, russos e tchuvaches."
 mos_conquer_vilnius: "Conquista de Vilnius"
 mos_conquer_vilnius_desc: "Vilnius, capital do Grão-Ducado da Lituânia — conquistá-la põe fim ao domínio lituano e transfere a hegemonia da Europa Oriental para Moscou."
 mos_develop_moscow_university: "Funde a Universidade de Moscou"
 mos_develop_moscow_university_desc: "Construa salas de estudo antes da Universidade de Moscou (fundada em 1755). A realização precoce do sonho de Lomonóssov promove o desenvolvimento intelectual da Rus."
 mos_teutonic_order: "Esmague a Ordem Teutônica"
 mos_teutonic_order_desc: "A Ordem Teutônica, legado das cruzadas bálticas — conquistar seu território traz total influência russa sobre o sul do Báltico."
 mos_estonian_coast: "A Costa Estoniana"
 mos_estonian_coast_desc: "Tallinn — tome esse porto-chave hanseático e alcance a plena inserção no comércio báltico."
 mos_dev_tobolsk_city: "Desenvolva a Cidade de Tobolsk"
 mos_dev_tobolsk_city_desc: "Desenvolva Tobolsk de vez como “capital da Sibéria” — faça dela o centro administrativo da conquista siberiana."
 mos_streltsy_reform: "Reforma Militar"
 mos_streltsy_reform_desc: "Modernize os streltsy — adote tecnologias militares ocidentais para elevar o exército russo aos padrões europeus."
 mos_siberian_ostrog: "Rede de Ostrogs Siberianos"
 mos_siberian_ostrog_desc: "Desenvolva uma rede de fortalezas (ostrogs) ligando Tobolsk, Ienisseisk e Irkutsk, que sustente a conquista da Sibéria."
 mos_absolute_monarchy: "Estabeleça a Monarquia Absoluta"
 mos_absolute_monarchy_desc: "Estabeleça o poder absoluto do tsar — retire o poder dos boiardos, da igreja e dos senhores locais, concentrando toda a autoridade nas mãos do imperador."
 mos_peter_reforms: "As Reformas de Pedro"
 mos_peter_reforms_desc: "Pedro, o Grande (1672-1725), transformou a Rus num Estado moderno por meio da ocidentalização. Reforma militar, criação de uma frota, academia de ciências. Realize o espírito de “abrir a janela para o Ocidente”."
 mos_dev_st_petersburg: "Erga São Petersburgo"
 mos_dev_st_petersburg_desc: "Construída por Pedro, o Grande, em 1703 nos pântanos do Neva — erga São Petersburgo como a primeira cidade ocidental da Rus."
 mos_russian_navy: "Estabeleça a Marinha Russa"
 mos_russian_navy_desc: "“A Rússia precisa de uma frota” — segundo a convicção de Pedro, o Grande, crie as frotas de Azov e do Báltico."
 mos_dev_suzdal: "Desenvolva Súzdal"
 mos_dev_suzdal_desc: "Súzdal, do “Anel de Ouro” — desenvolva essa cidade antiga, com muitas igrejas medievais, como centro de religião e cultura."
 mos_dev_vladimir: "Desenvolva Vladimir"
 mos_dev_vladimir_desc: "Vladimir, outrora capital do Grão-Principado — desenvolva essa cidade antiga como centro de agricultura e abastecimento de alimentos."
 mos_salt_works: "Indústria do Sal"
 mos_salt_works_desc: "O sal de Vologda e Solikamsk — garanta um suprimento estável de sal, essencial para a conservação de alimentos na Rússia."
 mos_beeswax_trade: "Comércio de Cera"
 mos_beeswax_trade_desc: "A cera de abelha russa — mercadoria-chave, muito procurada para as velas da Igreja Ortodoxa e para a exportação à Europa Ocidental."
 mos_iron_works: "Indústria do Ferro"
 mos_iron_works_desc: "O minério de ferro da região dos Urais — lance as bases da indústria do ferro uraliana, que se fortalecerá na era de Pedro."
 mos_dev_astrakhan_city: "Desenvolva a Cidade de Astracã"
 mos_dev_astrakhan_city_desc: "Astracã, o “portão do sul” — desenvolva-a como centro do comércio cáspio e tome o comércio com a Pérsia e a Ásia Central."
 mos_cossack_cavalry: "Cavalaria Cossaca"
 mos_cossack_cavalry_desc: "Os cossacos do Don e de Zaporíjia — incorpore esses melhores cavaleiros da estepe ao exército russo."
 mos_book_of_royal_degrees: "O Livro dos Graus"
 mos_book_of_royal_degrees_desc: "O Livro dos Graus (Stepennaia Kniga) registra a linhagem dos governantes russos, reforçando a legitimidade e a eficiência administrativa de Moscou."
 mos_kholmogory: "Desenvolva Kholmogory"
 mos_kholmogory_desc: "Kholmogory, no Dvina setentrional — desenvolva esse entreposto comercial no Mar Branco."
 mos_protect_south_slavs: "Proteja os Eslavos do Sul"
 mos_protect_south_slavs_desc: "Liberte os cristãos ortodoxos dos Bálcãs do domínio otomano e construa um império pan-eslavo."
 mos_conquer_carpathia: "Conquista dos Cárpatos"
 mos_conquer_carpathia_desc: "Os Montes Cárpatos — conquistar essas portas para a Europa Central amplia muito a influência ocidental."
 mos_great_northern_war: "A Grande Guerra do Norte"
 mos_great_northern_war_desc: "Na Grande Guerra do Norte (1700-1721), Pedro, o Grande, derrotou a Suécia e estabeleceu a hegemonia báltica — realize essa vitória mais cedo."
 mos_dev_perm_city: "Desenvolva a Cidade de Perm"
 mos_dev_perm_city_desc: "Desenvolva Perm, nó do comércio de peles, numa verdadeira cidade — faça dela centro de comércio e coleta de peles no alto Kama."
 mos_yakutsk_founded: "Funde Iakutsk"
 mos_yakutsk_founded_desc: "Iakutsk, fundada em 1632 — construa-a como centro da Sibéria Oriental e abra o caminho ao Pacífico."
 mos_dev_irkutsk: "Desenvolva Irkutsk"
 mos_dev_irkutsk_desc: "Irkutsk, no Lago Baikal — desenvolva essa cidade, mais tarde a “Paris da Sibéria”, como centro administrativo e comercial da Sibéria Oriental."
 mos_dev_minsk: "Desenvolva Minsk"
 mos_dev_minsk_desc: "Desenvolva Minsk, centro da Bielorrússia, como base do poder ocidental."
 mos_conquer_warsaw: "Conquista de Varsóvia"
 mos_conquer_warsaw_desc: "Varsóvia, capital da Polônia — conclua a partilha da Polônia e estabeleça influência sobre a Europa Central."
 mos_iron_ring_defense: "Defesa do Anel de Ferro"
 mos_iron_ring_defense_desc: "Uma rede de fortalezas contra invasões do sul e do oeste — o sistema de bastiões de ferro protege o território russo."
 mos_form_russia: "Forme a Rússia"
 mos_form_russia_desc: "Tendo quebrado o jugo tártaro, conquistado Cazã e unido os principados russos — proclame formalmente o Estado da “Rússia” e governe todos como tsar."
 mos_russian_empire: "O Império Russo"
 mos_russian_empire_desc: "Pedro, o Grande, proclamou a Rússia “império” com o Tratado de Nystad de 1721 — realize esse momento mais cedo por meio das peles, da agricultura e das reformas de Pedro."
 mos_autocrat_of_all_russias: "Autocrata de Toda a Rus"
 mos_autocrat_of_all_russias_desc: "“Pela graça de Deus, Imperador e Autocrata de Todas as Rússias” — do Báltico à Sibéria, do Cáucaso ao Oceano Ártico, todas as terras repousam sob a graça soberana do tsar."
 mos_events.1.t: "O Grão-Principado de Moscou — sob o jugo tártaro"
 mos_events.1.d: "Em 1337, Moscou é um pequeno principado. Mas graças à astuta destreza de Ivan I Kalitá (“bolsa de dinheiro”), o coletor do tributo tártaro, Moscou acumulou força.\n\nA vantagem de Moscou é a geografia: sua posição no interior das florestas dificulta o controle tártaro direto.\n\nA memória da batalha do Campo de Kulikovo (1380), em que Dmitri Donskoi repeliu os tártaros, ainda vive. Livrar-se por completo do jugo tártaro e unir os principados russos sob o poder do tsar — esse é o destino de Moscou."
 mos_events.1.a: "Glória a Moscou!"
 mos_events.5.t: "Quebre o jugo tártaro!"
 mos_events.5.d: "Por fim o exército moscovita derrotou os tártaros em batalha — o tributo tártaro acabou para sempre. Nessa virada histórica, comparável ao “Confronto no Rio Ugra (1480)”, Moscou torna-se a porta-bandeira da Rus livre. Os principados russos reconhecem a hegemonia de Moscou, e o caminho para um Estado unificado está aberto."
 mos_events.5.a: "A Rus está livre! Agora, à unificação da Rus!"
 mos_events.10.t: "Coroação do Tsar"
 mos_events.10.d: "“Tsar e Grão-Príncipe de Toda a Rus” — ao assumir esse título, Moscou proclama-se herdeira legítima do Império Bizantino. Antecipe a cerimônia histórica de coroação de Ivan IV em 1547. As cortes da Europa começam a reconhecer Moscou como nova grande potência."
 mos_events.10.a: "Viva o Tsar! Viva Moscou!"
 mos_events.30.t: "O Retorno de Constantinopla — a Terceira Roma Completa"
 mos_events.30.d: "A santa cidade ortodoxa de Constantinopla em mãos russas! A reconquista dessa cidade, que caíra para os otomanos em 1453, significa que a Rus se torna líder espiritual do mundo ortodoxo como “Terceira Roma”. A cruz cristã voa de novo sobre a Hagia Sophia."
 mos_events.30.a: "Viva a Terceira Roma! Viva a ortodoxia russa!"
 mos_events.50.t: "As Reformas de Pedro — ocidentalização ou tradição?"
 mos_events.50.d: "A onda de ocidentalização está prestes a inundar a Rus. Adotar ativamente as tecnologias, os sistemas militares e a ciência do Ocidente para fazer da Rus uma potência europeia moderna — ou defender a tradição ortodoxa e o “caminho russo”, construindo um império singular?"
 mos_events.50.a: "Promover a ocidentalização — a Rússia é parte da Europa"
 mos_events.60.t: "Formação da Rússia — nasce um novo império"
 mos_events.60.d: "Ucrânia, Bielorrússia e Galícia sob uma só bandeira — o Estado eslavo oriental unificado da “Rutênia” surge como nova grande potência da Europa Oriental. Todos os povos da Rus se reúnem sob as cúpulas douradas de Kiev."
 mos_events.60.a: "Viva a Rússia! Viva o tsar de toda a Rus!"
 mos_events.99.t: "Autocrata de Toda a Rus — o Império Completo"
 mos_events.99.d: "“Pela graça de Deus, Imperador e Autocrata de Todas as Rússias” — do Báltico à Sibéria, do Cáucaso ao Oceano Ártico — a bandeira russa tremula sobre o maior império do mundo. Do pequeno principado de Moscou de 1337 ao maior império do mundo — esse feito histórico será contado para sempre."
 mos_events.99.a: "Viva o autocrata de toda a Rus! Viva o Império Russo!"
 mos_events.50.b: "Preservar a tradição"
 STATIC_MODIFIER_NAME_mos_moscow_dev_mod: "Consolidação da Rus"
 STATIC_MODIFIER_DESC_mos_moscow_dev_mod: "A Rus está consolidada — Moscou ergue-se como a capital incontestada das terras russas."
 STATIC_MODIFIER_NAME_mos_kremlin_mod: "O Kremlin de Moscou"
 STATIC_MODIFIER_DESC_mos_kremlin_mod: "O Kremlin de Moscou construído — sede eterna do poder e da glória russos."
 STATIC_MODIFIER_NAME_mos_kazan_mod: "Conquista de Cazã"
 STATIC_MODIFIER_DESC_mos_kazan_mod: "Cazã conquistada — o canato tártaro caiu e o Volga se abre à expansão russa."
 STATIC_MODIFIER_NAME_mos_volga_mod: "O Médio Volga"
 STATIC_MODIFIER_DESC_mos_volga_mod: "O médio Volga assegurado — o grande rio russo torna-se uma rota imperial."
 STATIC_MODIFIER_NAME_mos_astrakhan_mod: "Conquista de Astracã"
 STATIC_MODIFIER_DESC_mos_astrakhan_mod: "O estandarte de Moscou tremula nas muralhas de Astracã, e o curso do Volga flui até as margens do Cáspio em nome do grão-príncipe."
 STATIC_MODIFIER_NAME_mos_steppes_mod: "Derrota dos Tártaros"
 STATIC_MODIFIER_DESC_mos_steppes_mod: "Os tártaros foram derrotados — a estepe pôntica se abre ao povoamento russo."
 STATIC_MODIFIER_NAME_mos_pontic_mod: "Domínio da Estepe Pôntica"
 STATIC_MODIFIER_DESC_mos_pontic_mod: "Domínio da estepe pôntica — a Rus governa as terras ao norte do Mar Negro."
 STATIC_MODIFIER_NAME_mos_azov_mod: "Avanço rumo ao Mar de Azov"
 STATIC_MODIFIER_DESC_mos_azov_mod: "Além do Mar Negro, visível do porto de Azov, as rotas marítimas se estendem rumo ao Mediterrâneo."
 STATIC_MODIFIER_NAME_mos_crimea_mod: "Conquista da Crimeia"
 STATIC_MODIFIER_DESC_mos_crimea_mod: "Crimeia conquistada — a Rus obtém o porto de águas quentes que tanto buscava."
 STATIC_MODIFIER_NAME_mos_novgorod_mod: "Conquista de Novgorod"
 STATIC_MODIFIER_DESC_mos_novgorod_mod: "Novgorod conquistada — a grande república mercantil absorvida pelo Estado russo."
 STATIC_MODIFIER_NAME_mos_tver_mod: "Tver — cidade mercantil do Volga"
 STATIC_MODIFIER_DESC_mos_tver_mod: "Tver — cidade mercantil do Volga — subjugada e incorporada a Moscou."
 STATIC_MODIFIER_NAME_mos_ryazan_mod: "Subjugação de Riazã"
 STATIC_MODIFIER_DESC_mos_ryazan_mod: "Riazã subjugada — o último principado independente absorvido pela Rus."
 STATIC_MODIFIER_NAME_mos_smolensk_mod: "Smolensk — chave da Rus"
 STATIC_MODIFIER_DESC_mos_smolensk_mod: "Smolensk — a chave da Rus — recuperada, assegurando a fronteira ocidental."
 STATIC_MODIFIER_NAME_mos_ruthenia_mod: "Conquista da Rutênia Branca"
 STATIC_MODIFIER_DESC_mos_ruthenia_mod: "Rutênia Branca conquistada — os eslavos ortodoxos do oeste passam à proteção de Moscou."
 STATIC_MODIFIER_NAME_mos_vyborg_mod: "Vyborg — porta para o Ocidente"
 STATIC_MODIFIER_DESC_mos_vyborg_mod: "Vyborg — a porta para o Ocidente — tomada, dando acesso ao Báltico."
 STATIC_MODIFIER_NAME_mos_baltic_mod: "Ambição Báltica"
 STATIC_MODIFIER_DESC_mos_baltic_mod: "Ambições bálticas cumpridas — a Rus reivindica o mar do norte."
 STATIC_MODIFIER_NAME_mos_riga_mod: "Riga — nó comercial báltico"
 STATIC_MODIFIER_DESC_mos_riga_mod: "Riga — o nó comercial do Báltico — cai sob controle russo."
 STATIC_MODIFIER_NAME_mos_poland_mod: "Partilha da Polônia"
 STATIC_MODIFIER_DESC_mos_poland_mod: "Polônia dividida — seu território absorvido pelo Império Russo."
 STATIC_MODIFIER_NAME_mos_metropolitan_mod: "A Metrópole de Moscou"
 STATIC_MODIFIER_DESC_mos_metropolitan_mod: "A metrópole de Moscou elevada — a igreja reforça o poder do Estado russo."
 STATIC_MODIFIER_NAME_mos_churches_mod: "Terra das Igrejas"
 STATIC_MODIFIER_DESC_mos_churches_mod: "Terra das igrejas — a ortodoxia permeia cada cidade, vila e aldeia da Rus."
 STATIC_MODIFIER_NAME_mos_patriarchate_mod: "O Patriarcado Russo"
 STATIC_MODIFIER_DESC_mos_patriarchate_mod: "Patriarcado russo estabelecido — a igreja de Moscou é independente de Constantinopla."
 STATIC_MODIFIER_NAME_mos_orthodoxy_mod: "Guardiã da Ortodoxia"
 STATIC_MODIFIER_DESC_mos_orthodoxy_mod: "A Rus reconhecida como guardiã da ortodoxia — defensora da fé."
 STATIC_MODIFIER_NAME_mos_third_rome_mod: "A Terceira Roma"
 STATIC_MODIFIER_DESC_mos_third_rome_mod: "Moscou proclama-se a Terceira Roma — o trono eterno da civilização ortodoxa."
 STATIC_MODIFIER_NAME_mos_caucasus_mod: "Marcha ao Cáucaso"
 STATIC_MODIFIER_DESC_mos_caucasus_mod: "As fogueiras de sinalização das cabeças de ponte russas queimam nas passagens do Cáucaso, e até os reinos montanhosos ouviram o nome do imperador do norte."
 STATIC_MODIFIER_NAME_mos_caspian_mod: "Domínio do Cáspio"
 STATIC_MODIFIER_DESC_mos_caspian_mod: "O domínio do Mar Cáspio abre rotas comerciais para a Pérsia e a Ásia Central."
 STATIC_MODIFIER_NAME_mos_urals_mod: "Travessia dos Urais"
 STATIC_MODIFIER_DESC_mos_urals_mod: "Os Urais cruzados — a porta para a Sibéria está aberta."
 STATIC_MODIFIER_NAME_mos_perm_mod: "Conquista de Perm"
 STATIC_MODIFIER_DESC_mos_perm_mod: "Perm conquistada — o portão dos Urais e da fronteira siberiana assegurado."
 STATIC_MODIFIER_NAME_mos_tobolsk_mod: "Comércio Siberiano Estabelecido"
 STATIC_MODIFIER_DESC_mos_tobolsk_mod: "O comércio siberiano estabelecido por Tobolsk — peles e recursos fluem para o oeste."
 STATIC_MODIFIER_NAME_mos_east_siberia_mod: "Conquista da Sibéria Oriental"
 STATIC_MODIFIER_DESC_mos_east_siberia_mod: "Sibéria Oriental conquistada — o domínio da Rus se estende até o horizonte do Pacífico."
 STATIC_MODIFIER_NAME_mos_pacific_mod: "Alcance do Pacífico"
 STATIC_MODIFIER_DESC_mos_pacific_mod: "O Pacífico alcançado — a Rus abarca toda a largura do continente eurasiano."
 STATIC_MODIFIER_NAME_mos_fur_monopoly_mod: "Monopólio das Peles"
 STATIC_MODIFIER_DESC_mos_fur_monopoly_mod: "O monopólio siberiano das peles enriquece a Rus — peles de zibelina avaliadas a peso de prata."
 STATIC_MODIFIER_NAME_mos_sudebnik_mod: "O Sudebnik"
 STATIC_MODIFIER_DESC_mos_sudebnik_mod: "O código de leis Sudebnik promulgado — o sistema jurídico da Rus unificado e modernizado."
 STATIC_MODIFIER_NAME_mos_boyar_mod: "Subjugação dos Boiardos"
 STATIC_MODIFIER_DESC_mos_boyar_mod: "Os boiardos já não podem se opor ao tsar na Duma e inclinam a cabeça."
 STATIC_MODIFIER_NAME_mos_oprichnina_mod: "A Oprichnina"
 STATIC_MODIFIER_DESC_mos_oprichnina_mod: "Oprichnina estabelecida — a polícia secreta de Ivan impõe lealdade absoluta."
 STATIC_MODIFIER_NAME_mos_agriculture_mod: "Desenvolvimento Agrícola"
 STATIC_MODIFIER_DESC_mos_agriculture_mod: "Nas vastas planícies de chernozem, espigas douradas de trigo ondulam até o horizonte."
 STATIC_MODIFIER_NAME_mos_black_earth_mod: "As colheitas da terra negra"
 STATIC_MODIFIER_DESC_mos_black_earth_mod: "Novas aldeias e moinhos pontilham a fronteira da estepe, e carroças carregadas de grão rolam para o norte por novas estradas. A terra negra alimenta o reino como nunca."
 STATIC_MODIFIER_NAME_mos_pomestye_mod: "O Sistema Pomiestie"
 STATIC_MODIFIER_DESC_mos_pomestye_mod: "O sistema pomiestie concede terra em troca de serviço militar — nasce o exército da nobreza."
 STATIC_MODIFIER_NAME_mos_streltsy_mod: "Os Streltsy"
 STATIC_MODIFIER_DESC_mos_streltsy_mod: "Mosqueteiros streltsy formados — a primeira infantaria permanente profissional da Rus."
 STATIC_MODIFIER_NAME_mos_zaseka_mod: "A Linha Zasechnaia"
 STATIC_MODIFIER_DESC_mos_zaseka_mod: "A linha zasechnaia — grande linha de defesa florestal — protege a Rus das incursões da estepe."
 STATIC_MODIFIER_NAME_mos_arkhangelsk_mod: "Arcangel — porta do Mar Branco"
 STATIC_MODIFIER_DESC_mos_arkhangelsk_mod: "Arcangel abre a janela da Rus para o Mar Branco e o comércio do norte da Europa."
 STATIC_MODIFIER_NAME_mos_white_sea_mod: "Comércio do Mar Branco"
 STATIC_MODIFIER_DESC_mos_white_sea_mod: "As rotas comerciais do Mar Branco ligam a Rus a mercadores ingleses e holandeses."
 STATIC_MODIFIER_NAME_mos_nizhny_mod: "Níjni Novgorod — confluência do Volga e do Oka"
 STATIC_MODIFIER_DESC_mos_nizhny_mod: "Níjni Novgorod — na confluência do Volga e do Oka — torna-se uma grande feira comercial."
 STATIC_MODIFIER_NAME_mos_pskov_mod: "Pskov — cidade mercantil do noroeste"
 STATIC_MODIFIER_DESC_mos_pskov_mod: "Pskov — cidade mercantil do noroeste — incorporada ao Estado russo."
 STATIC_MODIFIER_NAME_mos_yaroslavl_mod: "A Cidade Dourada do Volga — centro do comércio de seda e linho"
 STATIC_MODIFIER_DESC_mos_yaroslavl_mod: "Iaroslavl — cidade dourada do Volga — negocia seda e linho entre leste e oeste."
 STATIC_MODIFIER_NAME_mos_vologda_mod: "Vologda — encruzilhada comercial do norte"
 STATIC_MODIFIER_DESC_mos_vologda_mod: "Vologda — encruzilhada comercial do norte — liga o Mar Branco à bacia do Volga."
 STATIC_MODIFIER_NAME_mos_amber_mod: "A Rota do Âmbar"
 STATIC_MODIFIER_DESC_mos_amber_mod: "A rota do âmbar do Báltico passa por território controlado pela Rus."
 STATIC_MODIFIER_NAME_mos_taxation_mod: "Reforma Tributária"
 STATIC_MODIFIER_DESC_mos_taxation_mod: "Os coletores de impostos de toda a terra registram sua arrecadação num formato uniforme de livros-caixa, e toda a prata flui para o tesouro do tsar."
 STATIC_MODIFIER_NAME_mos_kazan_city_mod: "Construção de uma Cidade Multiétnica"
 STATIC_MODIFIER_DESC_mos_kazan_city_mod: "Cazã reconstruída como cidade multiétnica — a cultura tártara e a russa coexistem sob Moscou."
 STATIC_MODIFIER_NAME_mos_vilnius_mod: "Vilnius — capital da Lituânia"
 STATIC_MODIFIER_DESC_mos_vilnius_mod: "Vilnius — capital da Lituânia — cai sob domínio russo."
 STATIC_MODIFIER_NAME_mos_university_mod: "Universidade de Moscou"
 STATIC_MODIFIER_DESC_mos_university_mod: "As salas de aula da Universidade de Moscou ecoam com as vozes de estudantes de toda a Rus, e a luz do Iluminismo chegou também a esta terra."
 STATIC_MODIFIER_NAME_mos_teutonic_mod: "Derrota da Ordem Teutônica"
 STATIC_MODIFIER_DESC_mos_teutonic_mod: "A Ordem Teutônica derrotada — a fronteira báltica assegurada para a Rus."
 STATIC_MODIFIER_NAME_mos_tallinn_mod: "Tallinn — cabeça de ponte hanseática do norte"
 STATIC_MODIFIER_DESC_mos_tallinn_mod: "Tallinn — cabeça de ponte hanseática do norte — tomada, dando acesso ao comércio báltico."
 STATIC_MODIFIER_NAME_mos_tobolsk_city_mod: "Capital Comercial da Sibéria"
 STATIC_MODIFIER_DESC_mos_tobolsk_city_mod: "As peles siberianas e as dádivas da floresta empilham-se nos mercados de Tobolsk, e as vozes dos mercadores não se calam."
 STATIC_MODIFIER_NAME_mos_military_reform_mod: "Reforma Militar"
 STATIC_MODIFIER_DESC_mos_military_reform_mod: "Soldados em uniformes ocidentais marcham pela praça com novos mosquetes ao ombro."
 STATIC_MODIFIER_NAME_mos_ostrog_mod: "Rede de Ostrogs Siberianos"
 STATIC_MODIFIER_DESC_mos_ostrog_mod: "Dos fortes de madeira erguidos no fundo da taiga siberiana, os coletores do iasak de peles proclamam o nome do império ao povo."
 STATIC_MODIFIER_NAME_mos_absolutism_mod: "Monarquia Absoluta"
 STATIC_MODIFIER_DESC_mos_absolutism_mod: "Monarquia absoluta consolidada — a palavra do tsar é lei do Báltico ao Pacífico."
 STATIC_MODIFIER_NAME_mos_st_petersburg_mod: "São Petersburgo — janela para a Europa"
 STATIC_MODIFIER_DESC_mos_st_petersburg_mod: "São Petersburgo — janela da Rus para a Europa — construída nos pântanos do Neva."
 STATIC_MODIFIER_NAME_mos_navy_mod: "A Marinha Russa"
 STATIC_MODIFIER_DESC_mos_navy_mod: "Marinha russa fundada — um poderoso esquadrão navega pelo Báltico e pelo Mar Negro."
 STATIC_MODIFIER_NAME_mos_suzdal_mod: "Súzdal — coração do Anel de Ouro"
 STATIC_MODIFIER_DESC_mos_suzdal_mod: "Súzdal — coração do Anel de Ouro — brilha como joia da antiga cultura russa."
 STATIC_MODIFIER_NAME_mos_vladimir_mod: "Vladimir — antiga capital da Rus"
 STATIC_MODIFIER_DESC_mos_vladimir_mod: "Vladimir — antiga capital da Rus — renasce como centro do reino russo."
 STATIC_MODIFIER_NAME_mos_salt_mod: "Indústria do Sal"
 STATIC_MODIFIER_DESC_mos_salt_mod: "O sal das minas de Vologda é levado às aldeias da Rus para conservar as reservas de inverno."
 STATIC_MODIFIER_NAME_mos_beeswax_mod: "Comércio de Cera"
 STATIC_MODIFIER_DESC_mos_beeswax_mod: "O comércio da cera de abelha enriquece a Rus — velas e cera ligam o comércio do império."
 STATIC_MODIFIER_NAME_mos_iron_mod: "Indústria do Ferro"
 STATIC_MODIFIER_DESC_mos_iron_mod: "Os fornos dos Urais brilham em brasa, e espadas e relhas forjadas com seu ferro são levadas por toda a terra."
 STATIC_MODIFIER_NAME_mos_astrakhan_city_mod: "Astracã — porta do Cáspio"
 STATIC_MODIFIER_DESC_mos_astrakhan_city_mod: "Nos cais de Astracã, navios carregados de tapetes persas e especiarias da Ásia Central esperam o dia de subir o Volga."
 STATIC_MODIFIER_NAME_mos_cossack_mod: "Cavalaria Cossaca"
 STATIC_MODIFIER_DESC_mos_cossack_mod: "A cavalaria cossaca serve ao tsar — os cavaleiros livres da estepe lutam agora por Moscou."
 STATIC_MODIFIER_NAME_mos_royal_degrees_mod: "O Livro dos Graus"
 STATIC_MODIFIER_DESC_mos_royal_degrees_mod: "A genealogia apresentada no Livro dos Graus mostra a casa do tsar como uma linhagem legítima, escolhida por Deus."
 STATIC_MODIFIER_NAME_mos_kholmogory_mod: "Entreposto Comercial no Mar Branco"
 STATIC_MODIFIER_DESC_mos_kholmogory_mod: "Kholmogory serve de entreposto comercial no Mar Branco, ligando a Rus ao norte."
 STATIC_MODIFIER_NAME_mos_grand_duchy_mod: "O Grão-Principado"
 STATIC_MODIFIER_DESC_mos_grand_duchy_mod: "Grão-Principado de Moscou proclamado — o alicerce do Estado russo."
 STATIC_MODIFIER_NAME_mos_balkans_mod: "Proteção dos Eslavos do Sul"
 STATIC_MODIFIER_DESC_mos_balkans_mod: "A Rus declara-se protetora dos eslavos do sul contra a opressão otomana."
 STATIC_MODIFIER_NAME_mos_carpathia_mod: "Conquista dos Cárpatos"
 STATIC_MODIFIER_DESC_mos_carpathia_mod: "Os soldados russos postados nas passagens dos Cárpatos veem a sombra do império se alongar sobre as planícies da Europa Central além das montanhas."
 STATIC_MODIFIER_NAME_mos_western_mod: "Ocidentalização"
 STATIC_MODIFIER_DESC_mos_western_mod: "As reformas de ocidentalização transformam a Rus — tecnologia e cultura europeias adotadas."
 STATIC_MODIFIER_NAME_mos_northern_war_mod: "A Grande Guerra do Norte"
 STATIC_MODIFIER_DESC_mos_northern_war_mod: "A Grande Guerra do Norte vencida — a Rus emerge como potência báltica dominante."
 STATIC_MODIFIER_NAME_mos_perm_city_mod: "Posto Uraliano do Comércio de Peles"
 STATIC_MODIFIER_DESC_mos_perm_city_mod: "Perm cresce como posto uraliano do comércio de peles — portão entre a Europa e a Sibéria."
 STATIC_MODIFIER_NAME_mos_yakutsk_mod: "Base Avançada no Extremo Oriente"
 STATIC_MODIFIER_DESC_mos_yakutsk_mod: "Iakutsk serve como base avançada no Extremo Oriente — a presença da Rus na costa do Pacífico."
 STATIC_MODIFIER_NAME_mos_irkutsk_mod: "Cidade do Baikal"
 STATIC_MODIFIER_DESC_mos_irkutsk_mod: "Irkutsk — cidade do Baikal — torna-se o centro administrativo da Sibéria Oriental."
 STATIC_MODIFIER_NAME_mos_minsk_mod: "Minsk — centro da Rutênia Branca"
 STATIC_MODIFIER_DESC_mos_minsk_mod: "Minsk — centro da Rutênia Branca — absorvida pelo Império Russo."
 STATIC_MODIFIER_NAME_mos_warsaw_mod: "Pacificação da Polônia"
 STATIC_MODIFIER_DESC_mos_warsaw_mod: "Varsóvia pacificada — a capital da Polônia reconhece a suserania russa."
 STATIC_MODIFIER_NAME_mos_iron_ring_mod: "Defesa do Anel de Ferro"
 STATIC_MODIFIER_DESC_mos_iron_ring_mod: "O sistema de defesa do Anel de Ferro protege o coração da Rus contra invasões."
 STATIC_MODIFIER_NAME_mos_great_mod: "O Império Russo"
 STATIC_MODIFIER_DESC_mos_great_mod: "Império Russo proclamado — uma das maiores potências continentais da história."
 STATIC_MODIFIER_NAME_mos_autocrat_final_mod: "Autocrata de Toda a Rus"
 STATIC_MODIFIER_DESC_mos_autocrat_final_mod: "Autocrata de toda a Rus — o tsar reina como supremo governante do Báltico ao Pacífico."
 mos_great_moscow: "Fundação da Terceira Roma: A Grande Expansão de Moscou"
 mos_great_moscow_desc: "Expanda Moscou numa grande cidade digna da Terceira Roma. Catedrais, palácios, mercados e fortalezas se erguerão por essa magnífica cidade, tornando-a o coração do Império Russo. Cumpra as três condições de desenvolvimento, construções e população para merecer a Moscou o título de Cidade Eterna."
 STATIC_MODIFIER_NAME_mos_great_moscow_mod: "Cidade da Terceira Roma"
 STATIC_MODIFIER_DESC_mos_great_moscow_mod: "A Grande Moscou, cujas áureas agulhas do Kremlin reluzem, tornou-se uma metrópole digna do nome “Terceira Roma”."
