l_braz_por:
 sic_restoration_mission_pack: "O Caminho do Reino da Sicília"
 sic_restoration_mission_pack_DESCRIPTION:0 "Separado de Nápoles pela revolta de 1282, o Reino da Sicília está pronto para reunir a força da ilha no coração do Mediterrâneo e inscrever de novo seu nome na história. Você atravessará o estreito para voltar a ser um só com Nápoles, ou fará da própria ilha uma terra de ouro? A escolha é sua, ó rei."
 sic_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Conclua as missões como Reino da Sicília, trabalhando pela reconstituição das Duas Sicílias ou pela era de ouro da ilha da Sicília."
 sic_restoration_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para seguir o caminho do Reino da Sicília."
 sic_restoration_mission_pack_BUTTON_DETAILS:0 "Conquiste Nápoles além do estreito e forje o Reino das Duas Sicílias, ou lapide a própria ilha da Sicília até fazer dela a joia do Mediterrâneo. Em ambos os caminhos aguarda a prosperidade do novo reino!"
 sic_divided_kingdom: "Além do Estreito"
 sic_divided_kingdom_desc: "Em 1282, na revolta conhecida como Vésperas Sicilianas, derrubamos o domínio da casa de Anjou. Incapaz de suportar por mais tempo a tirania dos funcionários franceses, o povo da ilha se ergueu como um só ao som dos sinos do entardecer e expulsou os franceses de nossas costas. Saudamos Pedro III de Aragão como novo rei, e o Reino da Sicília ficou assim dividido em dois. Além do estreito, no continente com capital em Nápoles, o rei da casa de Anjou ainda se intitula “rei da Sicília”. Somente nós somos os legítimos reis desta ilha. A rivalidade entre nossos dois reinos continua até hoje."
 sic_ambitions_on_naples: "Ambições sobre Nápoles"
 sic_ambitions_on_naples_desc: "O rei angevino além do estreito disputa, com razão, o próprio título de rei da Sicília. Chegou a hora de formar nosso exército permanente e erguer a causa justa — um dia, reivindicar a coroa de Nápoles para nós."
 sic_army_of_the_island: "A Frota da Ilha"
 sic_army_of_the_island_desc: "A ilha da Sicília é uma fortaleza, cercada de mar por todos os lados. Para enviar nossas tropas por sobre o estreito até Nápoles, devemos primeiro construir uma poderosa frota, que garanta tanto a defesa da ilha quanto a travessia segura de nossos soldados."
 sic_conquest_of_naples: "A Conquista de Nápoles"
 sic_conquest_of_naples_desc: "Nossas forças finalmente cruzaram o estreito e desembarcaram nas praias de Nápoles. Se conseguirmos quebrar o exército angevino e tomar a coroa de Nápoles, o reino dividido em 1282 voltará a ser um só, sob o nosso governo."
 sic_two_sicilies: "As Duas Sicílias"
 sic_two_sicilies_desc: "Nápoles e Palermo, as duas coroas, repousam agora em nossas mãos. Chegou a hora de proclamar a fundação de um novo reino, que abarque as duas margens do estreito — o Reino das Duas Sicílias. Esse feito histórico encerra a divisão de 1282."
 sic_golden_wheat_fields: "Campos de Trigo Dourado"
 sic_golden_wheat_fields_desc: "Desde a Antiguidade a ilha da Sicília é chamada de celeiro do Mediterrâneo. Desenvolvendo as planícies férteis ao redor de Palermo, as ricas colheitas alimentarão todo o reino, e o excedente de grãos será exportado como valiosa mercadoria."
 sic_palermo_resurgent: "Palermo Ressurgente"
 sic_palermo_resurgent_desc: "Nos tempos do reino normando, Palermo era uma cidade de esplendor inigualável no Mediterrâneo. Erguer aqui novas construções e recuperar ao menos uma parte desse antigo fausto será o primeiro passo para o desenvolvimento de toda a ilha."
 sic_mediterranean_crossroads: "Encruzilhada do Comércio Mediterrâneo"
 sic_mediterranean_crossroads_desc: "A ilha da Sicília está bem no coração da encruzilhada do Mediterrâneo, onde se encontram as rotas comerciais do Oriente e do Ocidente. Estabelecendo mercados nos portos da ilha, reuniremos aqui mercadores de todas as terras, elevando muito a renda comercial do reino."
 sic_sicilian_renaissance: "O Renascimento Siciliano"
 sic_sicilian_renaissance_desc: "A corte siciliana, onde se encontram as culturas normanda, árabe, bizantina e latina, há muito é um centro de arte e saber. As numerosas obras de arte reunidas em Palermo anunciam a aurora de um novo florescimento cultural."
 sic_kingdom_resurgent: "O Reino Ressurgente"
 sic_kingdom_resurgent_desc: "Seja como um reino que abarca as duas margens do estreito, seja como uma ilha que brilha em cultura e comércio no coração do Mediterrâneo, a Sicília inscreveu de novo seu nome na história. Daqui em diante, o caminho deste reino marcará a aurora de uma nova era."
 STATIC_MODIFIER_NAME_sic_army_of_the_island_mod: "A Frota da Ilha"
 STATIC_MODIFIER_DESC_sic_army_of_the_island_mod: "A frota reorganizada da ilha ostenta moral elevado e abundantes reservas de efetivos."
 STATIC_MODIFIER_NAME_sic_conquest_of_naples_mod: "A Conquista de Nápoles"
 STATIC_MODIFIER_DESC_sic_conquest_of_naples_mod: "Depois da campanha em Nápoles, a disciplina do exército real aumentou e nossa posição nas negociações de guerra ficou mais forte."
 STATIC_MODIFIER_NAME_sic_two_sicilies_mod: "As Duas Sicílias"
 STATIC_MODIFIER_DESC_sic_two_sicilies_mod: "O prestígio e a legitimidade do novo reino, que abarca as duas margens do estreito, jamais foram tão altos."
 STATIC_MODIFIER_NAME_sic_golden_wheat_fields_mod: "Campos de Trigo Dourado"
 STATIC_MODIFIER_DESC_sic_golden_wheat_fields_mod: "A Roma antiga chamava a Sicília de “celeiro do Império” (Granarium Imperii). Os vastos campos de trigo do interior da ilha alimentaram sem cessar o mundo mediterrâneo. O papel agrícola da Sicília como “ilha do trigo” permaneceu inalterado da Antiguidade até o século XIX e foi um pilar da segurança alimentar do Mediterrâneo."
 STATIC_MODIFIER_NAME_sic_palermo_resurgent_mod: "Palermo Ressurgente"
 STATIC_MODIFIER_DESC_sic_palermo_resurgent_mod: "Palermo (em fenício Panormos — “todos os portos”) é a maior cidade da Sicília, onde se misturaram as culturas normanda, árabe e bizantina. A corte de Rogério II era conhecida como uma das mais refinadas da Europa e um centro multicultural onde se usavam lado a lado o árabe, o grego e o latim."
 STATIC_MODIFIER_NAME_sic_mediterranean_crossroads_mod: "Encruzilhada do Comércio Mediterrâneo"
 STATIC_MODIFIER_DESC_sic_mediterranean_crossroads_mod: "A Sicília fica quase no centro do Mediterrâneo e é um entreposto do comércio Oriente-Ocidente desde que os antigos fenícios fundaram Cartago. Siracusa, terra natal do filósofo grego Arquimedes, e Palermo, impregnada de cultura árabe — esta ilha é a verdadeira personificação da civilização mediterrânea."
 STATIC_MODIFIER_NAME_sic_sicilian_renaissance_mod: "O Renascimento Siciliano"
 STATIC_MODIFIER_DESC_sic_sicilian_renaissance_mod: "A cultura que floresceu em Palermo elevou a habilidade dos novos artistas que ingressam ao serviço do reino."
 STATIC_MODIFIER_NAME_sic_kingdom_resurgent_mod: "O Reino Ressurgente"
 STATIC_MODIFIER_DESC_sic_kingdom_resurgent_mod: "O brilho do reino ressurgente elevou seu prestígio e sua legitimidade e fortaleceu sua mão nas negociações de guerra como nunca antes."
 sic_events.1.t: "Um Reino Dividido em Dois"
 sic_events.1.d: "Em 1282 nos erguemos contra o domínio da casa de Anjou. Incapaz de suportar por mais tempo a tirania dos funcionários enviados da França, o povo da ilha se ergueu como um só ao som dos sinos do entardecer e expulsou os franceses de nossas costas. Saudamos Pedro III de Aragão como novo rei, e o Reino da Sicília ficou assim dividido em dois. Além do estreito, no continente com capital em Nápoles, o rei da casa de Anjou ainda se intitula “rei da Sicília”. Somente nós somos os verdadeiros reis desta ilha. A rivalidade entre nossos dois reinos continua até hoje."
 sic_events.1.a: "Entendido"
