 nov_events.1.t: "Novgorod, a Grande — A Grande República"
 nov_events.1.d: "Em 1337, a República de Novgorod, a Grande, é a maior cidade-Estado comercial da Rus.\n\nEssa cidade, que se estende pelas duas margens do Volkhov, divide-se no “Lado de Santa Sofia”, na margem ocidental, e no “Lado Comercial”, na margem oriental. Em seu centro ergue-se o símbolo de Novgorod, a Catedral de Santa Sofia.\n\nO veche (assembleia popular) funciona como órgão decisório supremo, enquanto o posadnik (prefeito), o tysiatsky (comandante da milícia) e o arcebispo cuidam da administração.\n\n“Novgorod pertence apenas a Novgorod” — não um príncipe nem um imperador, mas a vontade dos cidadãos dirige essa república.\n\nAqui se fundou o kontor hanseático, e o comércio prospera com Lübeck, Bruges, Londres e Bergen. Peles, cera, linho e peixe são fornecidos por Novgorod à Europa Ocidental.\n\nMas Moscou cresce sem cessar em força, a Lituânia pressiona do oeste, e os tártaros espreitam do leste. Novgorod sobreviveu aproveitando esse equilíbrio multicamada de forças. Agora, use essa sabedoria e essa força mercantil para buscar o domínio da Rus."
 nov_events.1.a: "Defender a liberdade e a prosperidade de Novgorod!"
