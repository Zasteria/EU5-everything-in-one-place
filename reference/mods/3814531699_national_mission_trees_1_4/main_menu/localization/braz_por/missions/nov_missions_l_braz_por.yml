l_braz_por:
 nov_novgorod_mission_pack: "A Glória de Novgorod — De República Mercantil a Senhora da Rus"
 nov_novgorod_mission_pack_DESCRIPTION:0 "Em 1337, a República de Novgorod, a Grande, é a maior potência comercial da Rus. O veche (assembleia popular) dirige a política, e o comércio com a Hansa traz riqueza. Mas Moscou cresce sem cessar em força, e a ameaça tártara pesa do leste. Comércio de peles, domínio do Báltico, derrota de Moscou — governe como Grão-Príncipe de toda a Rus."
 nov_novgorod_mission_pack_CRITERIA_DESCRIPTION:0 "Construa um império comercial, derrote Moscou para unir a Rus, domine o Báltico e a Sibéria e governe como Grão-Príncipe da Rus."
 nov_novgorod_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para tornar-se Grão-Príncipe da Rus."
 nov_novgorod_mission_pack_BUTTON_DETAILS:0 "Da república mercantil de Novgorod à fundação do Império Russo!"
 nov_veche_republic: "A República do Veche"
 nov_veche_republic_desc: "O veche de Novgorod — singular instituição democrática, da qual participam por igual burgueses, nobres e mercadores. “Novgorod pertence apenas a Novgorod” — é a vontade dos cidadãos, e não a do príncipe, que dirige esse Estado e o distingue de todos os demais principados russos. Reforce a tradição do veche e firme os alicerces da república mercantil."
 nov_dev_novgorod: "Desenvolva Novgorod, a Grande"
 nov_dev_novgorod_desc: "“Senhor Novgorod, a Grande”, às margens do Volkhov, é a maior cidade comercial da Rus medieval. Mercadores hanseáticos, bizantinos e muçulmanos orientais acorrem aqui, comerciando peles, cera, linho e peixe. O “Pátio” (posto comercial) de Novgorod tem filiais em Lübeck, Bruges, Londres e Bergen."
 nov_birch_bark: "As Cartas de Casca de Bétula"
 nov_birch_bark_desc: "Os novgorodianos tinham o costume de escrever em casca de bétula — prova da mais letrada cidade medieval do mundo. Use essa tradição de alfabetização para desenvolver o saber, o governo e os registros comerciais."
 nov_hanseatic_league: "Comércio Hanseático"
 nov_hanseatic_league_desc: "Novgorod, uma das maiores cidades comerciais da Europa setentrional, está profundamente entrelaçada na rede da Hansa. Reforce as rotas comerciais que levam a Lübeck, Hamburgo e Bruges."
 nov_fur_trade: "Comércio de Peles"
 nov_fur_trade_desc: "A maior mercadoria comercial de Novgorod são as peles: peles de esquilo, zibelina, castor e vison, obtidas nas florestas siberianas e vendidas à nobreza da Europa Ocidental. O comércio de peles, chamado de “ouro do Norte”, é a fonte da riqueza de Novgorod."
 nov_dev_pskov: "Desenvolva Pskov"
 nov_dev_pskov_desc: "A teimosamente independente Pskov — “irmã mais nova” de Novgorod — torna-se a segunda capital mercantil e cultural. Desenvolva essa cidade, com as muralhas do Kremlin de Pskov e a Catedral da Santíssima Trindade."
 nov_trade_empire: "O Império Comercial"
 nov_trade_empire_desc: "Peles, cera, sal, peixe — a rede comercial de Novgorod abarca a Europa setentrional. As guildas mercantis governam o Estado, e erguem-se postos comerciais por toda parte. A fama de “Veneza do Norte” se espalha pelo mundo inteiro."
 nov_dev_staraya_russa: "Desenvolva Staraia Russa"
 nov_dev_staraya_russa_desc: "Staraia Russa, cujo nome significa “Velha Rus”, é famosa pela extração de sal. Desenvolva a salinagem dessa antiga cidade para sustentar o abastecimento de alimentos e o comércio de Novgorod."
 nov_secure_novgorod_region: "Assegure a Terra de Novgorod"
 nov_secure_novgorod_region_desc: "A pátria de Novgorod — o pleno domínio das regiões de Novgorod Ocidental e Oriental estabelece a base para a expansão."
 nov_conquer_tver: "Conquiste Tver"
 nov_conquer_tver_desc: "O Principado de Tver, outrora rival de Moscou pela supremacia — seu poder se extinguiu agora. Conquiste essa importante cidade às margens do Volga e abra o caminho para o sul."
 nov_conquer_yaroslavl: "Conquiste Iaroslavl"
 nov_conquer_yaroslavl_desc: "Iaroslavl, cidade do “Anel de Ouro” às margens do Volga — conquiste essa cidade mercantil e tome a rota comercial do norte."
 nov_conquer_moscow: "Conquiste Moscou"
 nov_conquer_moscow_desc: "Desde Ivan I (Kalitá), Moscou expandiu-se sem cessar com apoio tártaro. “Moscou ou guerra” — derrote a maior ameaça de Novgorod e conquiste a liderança da Rus."
 nov_conquer_suzdal: "Conquiste Súzdal e Vladimir"
 nov_conquer_suzdal_desc: "Súzdal e Vladimir são cidades antigas, outrora florescentes como herdeiras da Rus de Kiev. Conquiste essas cidades, com muitas igrejas de cúpulas douradas, e herde a legitimidade da antiga Rus."
 nov_defeat_muscovy: "Destrua Moscou"
 nov_defeat_muscovy_desc: "O Grão-Principado de Moscou destruído, e a liderança da Rus passa a Novgorod. As ambições da dinastia Rurikida esmagadas — a república do veche decidirá o destino do futuro da Rus."
 nov_conquer_smolensk: "Conquiste Smolensk"
 nov_conquer_smolensk_desc: "Smolensk, chamada de “chave da Rus” — dominar esse nó de comunicação leste-oeste estabelece influência ocidental."
 nov_conquer_ryazan: "Conquiste Riazã"
 nov_conquer_ryazan_desc: "O Principado de Riazã, o primeiro devastado pelo exército mongol em 1237 — conquiste suas terras meridionais de estepe e erga uma linha de defesa contra os tártaros."
 nov_form_russia: "Forme a Rus"
 nov_form_russia_desc: "O Estado unificado da Rus, com centro em Novgorod, ganha forma — não Moscou, mas Novgorod unificou a Rus. Que forma tomará essa nova Rússia, nascida dessa virada histórica?"
 nov_vologda_trade: "Comércio de Vologda"
 nov_vologda_trade_desc: "Dominar Vologda e Beloozero — pontos-chave da rota comercial do norte — estabelece acesso ao Mar Branco e à rota do comércio de peles."
 nov_found_arkhangelsk: "Funde Arcangel"
 nov_found_arkhangelsk_desc: "Erga a cidade portuária de Arcangel nas margens do Mar Branco — embora congele no inverno, esse porto possibilita o comércio direto com a Europa setentrional e a Grã-Bretanha. Nas eras vindouras, mercadores ingleses virão à Rus por aqui."
 nov_white_sea_trade: "Domine o Comércio do Mar Branco"
 nov_white_sea_trade_desc: "Domine a rota comercial do Mar Branco e estabeleça o comércio direto com a Europa setentrional. Arcangel se desenvolve como centro do comércio do norte."
 nov_conquer_perm: "Conquiste Perm"
 nov_conquer_perm_desc: "A região de Perm, no alto Kama, é produtora das “peles de Kama”, as mais finas. A conquista desse lugar estabelece o monopólio das peles."
 nov_kola_fortress: "A Fortaleza de Kola"
 nov_kola_fortress_desc: "O extremo norte da Península de Kola — tome o porto livre de gelo da Baía de Murmansk e estabeleça uma cabeça de ponte para a rota marítima do norte."
 nov_siberian_frontier: "A Fronteira Siberiana"
 nov_siberian_frontier_desc: "Cruze os Montes Urais rumo à Sibéria — o caminho “para além da terra”, de recursos de peles sem limites, aberto. Avance sobre a Sibéria antes da conquista de Iermak."
 nov_fur_monopoly: "Monopólio do Comércio de Peles"
 nov_fur_monopoly_desc: "De Perm à Sibéria — todas as rotas do comércio de peles passam ao controle de Novgorod. Monopolize o suprimento das peles de luxo desejadas por reis e nobres europeus e obtenha enorme riqueza."
 nov_secure_karelia: "Assegure a Carélia"
 nov_secure_karelia_desc: "Tome a região da Carélia, na margem norte do Golfo da Finlândia, para assegurar acesso ao Báltico — importante ponto estratégico que estabelece a fronteira com a Suécia."
 nov_conquer_viborg: "Conquiste Vyborg"
 nov_conquer_viborg_desc: "A fortaleza de Vyborg, construída pelos suecos — assaltar esse ponto-chave do Golfo da Finlândia abre a porta para o Báltico."
 nov_baltic_fleet: "A Frota Báltica"
 nov_baltic_fleet_desc: "Construa a Frota Báltica de Novgorod — o poder naval é indispensável para dominar o comércio do norte da Europa."
 nov_conquer_riga: "Conquiste Riga"
 nov_conquer_riga_desc: "Riga, na foz do Dvina — a conquista dessa importante cidade hanseática conquista a liderança no comércio báltico. Com o espírito de “Gdansk ou guerra”, tome também Riga."
 nov_livonia: "Subjugue a Livônia"
 nov_livonia_desc: "A costa leste do Báltico, governada pela Ordem dos Irmãos da Espada — subjugar essa região estabelece acesso às terras bálticas."
 nov_neva_ports: "Portos do Neva"
 nov_neva_ports_desc: "Desenvolva uma cidade portuária no Neva — esse lugar, onde Pedro, o Grande, construirá mais tarde “Petersburgo”, torna-se a porta para o Báltico."
 nov_orthodox_archbishop: "O Arcebispado Ortodoxo"
 nov_orthodox_archbishop_desc: "O arcebispo de Novgorod detém autoridade independente de Moscou e Constantinopla — a autonomia religiosa sustenta a autossuficiência de Novgorod. Reforce a tradição ortodoxa de Novgorod com sua Catedral de Santa Sofia."
 nov_cathedral_cities: "Cidades de Catedrais"
 nov_cathedral_cities_desc: "Erga catedrais em todas as cidades de Novgorod — realize o ideal da “Santa Rus” e cubra toda a terra com o brilho da fé ortodoxa."
 nov_guardian_of_orthodoxy: "Guardiã da Ortodoxia"
 nov_guardian_of_orthodoxy_desc: "Com a queda de Constantinopla diante dos otomanos, a missão de guardiã da ortodoxia passa a Novgorod. Conquiste o título de “Terceira Roma” — que não Moscou, mas Novgorod o detenha."
 nov_novgorod_chronicle: "A Crônica de Novgorod"
 nov_novgorod_chronicle_desc: "A Crônica de Novgorod (Novgorodskaia Letopis) — essa obra histórica, que registra meticulosamente os acontecimentos de cada ano, leva o legado espiritual de Novgorod às gerações vindouras."
 nov_dev_torzhok: "Desenvolva Torjok"
 nov_dev_torzhok_desc: "Torjok, situada entre Novgorod e Moscou — desenvolva-a como nó comercial e domine a rota comercial do sul."
 nov_kazan_subjugation: "Subjugue Cazã"
 nov_kazan_subjugation_desc: "O Canato de Cazã — subjugar esse Estado sucessor tártaro, que domina o médio Volga, abre o caminho para o leste."
 nov_ushkuiniks: "Os Ushkuiniks"
 nov_ushkuiniks_desc: "Os ushkuiniks — grupo misto de piratas fluviais, pioneiros e soldados de Novgorod. Incorpore esses homens rudes, que descem o Volga e atacam navios mercantes tártaros, ao exército regular de Novgorod e treine-os como tropas de elite."
 nov_dev_suzdal: "Desenvolva Súzdal"
 nov_dev_suzdal_desc: "Súzdal, do “Anel de Ouro” — desenvolva essa antiga cidade, com muitas igrejas e mosteiros medievais, como centro cultural e religioso."
 nov_conquer_beloozero: "Conquiste Beloozero"
 nov_conquer_beloozero_desc: "A região de Beloozero (Lago Branco) — rica em peles e peixe, tome essa terra e assegure a rota comercial do norte."
 nov_dev_kholmogory: "Desenvolva Kholmogory"
 nov_dev_kholmogory_desc: "Kholmogory, no Dvina — desenvolva essa cidade portuária como porta do Mar Branco e lance a base da futura prosperidade de Arcangel."
 nov_conquer_vladimir: "Conquiste Vladimir"
 nov_conquer_vladimir_desc: "Outrora capital do Grão-Principado de Vladimir — essa antiga cidade, com muitas construções religiosas, incluindo a Catedral de São Demétrio, cai diante de Novgorod."
 nov_tatar_wars: "Guerras contra os Tártaros"
 nov_tatar_wars_desc: "Novgorod foi a única grande cidade da Rus que não se submeteu ao jugo tártaro — leve agora esse orgulho com a espada na luta contra os tártaros. Com o espírito das margens do Neva, derrote os cavaleiros da estepe."
 nov_golden_horde: "Contra-ataque à Horda de Ouro"
 nov_golden_horde_desc: "Erga o estandarte de Novgorod em terra da Horda de Ouro (Canato Kipchak) — quem libertar a Rus do domínio mongol é o verdadeiro senhor da Rus."
 nov_nizhny_novgorod: "Conquiste Níjni Novgorod"
 nov_nizhny_novgorod_desc: "“Níjni Novgorod” — subjugue essa cidade comercial na confluência do Volga e do Oka e conquiste o comércio do médio Volga."
 nov_orthodox_mission: "A Missão Ortodoxa"
 nov_orthodox_mission_desc: "Difunda a fé ortodoxa entre os pagãos do norte e do leste — a atividade missionária entre os povos fineses, os povos nativos siberianos e os tártaros multiplica a legitimidade de Novgorod."
 nov_hanseatic_kontors: "Kontors Hanseáticos"
 nov_hanseatic_kontors_desc: "Erga os postos comerciais de Novgorod (kontors) nas mais importantes cidades hanseáticas — Novgorod, Riga, Lübeck — e domine diretamente a rede comercial do norte da Europa."
 nov_ostrog_system: "O Sistema de Ostrogs"
 nov_ostrog_system_desc: "Construa uma rede de fortalezas (ostrogs) para sustentar o avanço sobre a Sibéria — cabeças de ponte para a conquista da Sibéria, que levam a Tiumen, Tobolsk e Irkutsk."
 nov_dev_ryazan: "Desenvolva Riazã"
 nov_dev_ryazan_desc: "Riazã, destruída pelos mongóis — a nova cidade de Riazã foi erguida sobre suas ruínas. Desenvolva essa importante cidade meridional como cabeça de ponte rumo à estepe."
 nov_estonian_coast: "A Costa Estoniana"
 nov_estonian_coast_desc: "Subjugar a costa estoniana completa o controle da margem sul do Báltico. Tome a cidade comercial hanseática de Reval (Tallinn)."
 nov_conquer_teutonic: "Esmague a Ordem Teutônica"
 nov_conquer_teutonic_desc: "O legado das cruzadas bálticas chega ao fim — a derrota da Ordem Teutônica põe a costa sudeste do Báltico por completo sob controle de Novgorod."
 nov_moscow_capital: "Desenvolva Moscou"
 nov_moscow_capital_desc: "Desenvolva a conquistada Moscou como importante cidade sob o governo de Novgorod — transforme o antigo palácio do grão-príncipe moscovita em residência do governador de Novgorod, símbolo do poder."
 nov_iron_ring: "O Anel de Ferro"
 nov_iron_ring_desc: "Um anel de fortalezas que protege Novgorod — uma rede defensiva que liga Pskov, Novgorod, Ladoga e Tver, concluída. Um sistema defensivo de ferro, capaz de repelir invasões de qualquer direção."
 nov_kholmogory_trade: "Comércio de Kholmogory"
 nov_kholmogory_trade_desc: "Do nó comercial de Kholmogory, no Dvina, ao Mar Branco — tome essa rota comercial do norte antes da Companhia Moscovita inglesa."
 nov_eastern_orthodoxy: "A Igreja do Oriente Estabelecida"
 nov_eastern_orthodoxy_desc: "Após a queda de Constantinopla, Novgorod ergue-se como centro da Igreja do Oriente. A Catedral de Santa Sofia brilha como herdeira da Hagia Sophia de Constantinopla."
 nov_amber_road: "A Rota do Âmbar"
 nov_amber_road_desc: "A rota comercial do âmbar, que segue do Báltico para o sul — o âmbar do Báltico, as peles de Novgorod e a seda oriental se cruzam nesta rota, agora controlada por Novgorod."
 nov_great_novgorod: "Novgorod, a Grande, Concluída"
 nov_great_novgorod_desc: "Império comercial, poder militar, autoridade ortodoxa — três pilares concluídos, e Novgorod torna-se um Estado digno do título de “Grande”. Dê o último passo rumo a “Grão-Príncipe da Rus”."
 nov_ruler_of_rus: "Grão-Príncipe da Rus"
 nov_ruler_of_rus_desc: "“Grão-Príncipe de Novgorod e de toda a Rus” — esse título ressoou sobre a praça do veche de Novgorod. Do Báltico à Sibéria, do Mar Branco às estepes do sul — o estandarte de Novgorod tremula sobre toda a Rus. A república mercantil ergueu um dos maiores impérios do mundo. História reescrita — Novgorod decide o futuro da Rus."
 nov_events.10.t: "Moscou Caiu — A Liderança da Rus Passa a Novgorod"
 nov_events.10.d: "O Kremlin de Moscou caiu em mãos novgorodianas. As ambições da desprezada como “cães tártaros” família grã-principesca de Moscou, esmagadas. Como o futuro da Rus é agora decidido pela república do veche de Novgorod, essa vitória não é uma mera conquista territorial — é um ponto de virada que muda radicalmente a história russa."
 nov_events.10.a: "Moscou caiu! Começa a era de Novgorod!"
 nov_events.20.t: "Formação da Rus — Um Novo Estado em Torno de Novgorod"
 nov_events.20.d: "O Estado unificado da Rus, com centro em Novgorod, nasceu. Como se chamará? Proclamar o “Grão-Principado da Rus”, para anunciar um novo começo, ou conservar com orgulho o nome “Novgorod”?"
 nov_events.20.a: "Proclamar o “Grão-Principado da Rus” — nasce a nova Rússia"
 nov_events.20.b: "Conservar com orgulho o nome “Novgorod”"
 nov_events.99.t: "Grão-Príncipe da Rus — Novgorod Governa a Rússia"
 nov_events.99.d: "“Grão-Príncipe de Novgorod e de toda a Rus” — esse título ressoou sobre a praça do veche de Novgorod. Do Báltico à Sibéria, do Mar Branco à estepe — o estandarte de Novgorod tremula sobre toda a Rus. A república mercantil ergueu um dos maiores impérios da história. História reescrita."
 nov_events.99.a: "Viva o Grão-Príncipe da Rus! Novgorod para sempre!"
 STATIC_MODIFIER_NAME_nov_novgorod_city_mod: "Prosperidade de Novgorod, a Grande"
 STATIC_MODIFIER_DESC_nov_novgorod_city_mod: "Como nó hanseático, Novgorod, a Grande, desenvolvida, e o comércio prospera."
 STATIC_MODIFIER_NAME_nov_literacy_mod: "A Tradição da Bétula"
 STATIC_MODIFIER_DESC_nov_literacy_mod: "A tradição de alfabetização sustenta a vantagem espiritual e mercantil de Novgorod."
 STATIC_MODIFIER_NAME_nov_hansa_mod: "Comércio Hanseático"
 STATIC_MODIFIER_DESC_nov_hansa_mod: "Parceria estabelecida com a maior rede comercial da Europa setentrional."
 STATIC_MODIFIER_NAME_nov_fur_mod: "Comércio de Peles"
 STATIC_MODIFIER_DESC_nov_fur_mod: "As peles do norte fornecidas por Novgorod à Europa Ocidental."
 STATIC_MODIFIER_NAME_nov_pskov_mod: "A Ascensão de Pskov"
 STATIC_MODIFIER_DESC_nov_pskov_mod: "Pskov desenvolve-se como segunda capital mercantil de Novgorod."
 STATIC_MODIFIER_NAME_nov_trade_empire_mod: "O Império Comercial"
 STATIC_MODIFIER_DESC_nov_trade_empire_mod: "A rede comercial de Novgorod abarca a Europa setentrional."
 STATIC_MODIFIER_NAME_nov_russa_mod: "O Sal de Staraia Russa"
 STATIC_MODIFIER_DESC_nov_russa_mod: "O centro de salinagem Staraia Russa desenvolvido."
 STATIC_MODIFIER_NAME_nov_novgorod_secured_mod: "Terra de Novgorod Assegurada"
 STATIC_MODIFIER_DESC_nov_novgorod_secured_mod: "A pátria de Novgorod totalmente subjugada — base da expansão estabelecida."
 STATIC_MODIFIER_NAME_nov_tver_mod: "Tver Conquistada"
 STATIC_MODIFIER_DESC_nov_tver_mod: "Tver, no alto Volga, conquistada — rota meridional aberta."
 STATIC_MODIFIER_NAME_nov_yaroslavl_mod: "Iaroslavl Prospera"
 STATIC_MODIFIER_DESC_nov_yaroslavl_mod: "A cidade mercantil do Volga, Iaroslavl, cai diante de Novgorod."
 STATIC_MODIFIER_NAME_nov_suzdal_mod: "Súzdal-Vladimir"
 STATIC_MODIFIER_DESC_nov_suzdal_mod: "O antigo coração da Rus, Súzdal e Vladimir, incorporado."
 STATIC_MODIFIER_NAME_nov_defeat_muscovy_mod: "Moscou Derrotada"
 STATIC_MODIFIER_DESC_nov_defeat_muscovy_mod: "Os clientes tártaros de Moscou destruídos — a liderança da Rus passa a Novgorod."
 STATIC_MODIFIER_NAME_nov_smolensk_mod: "Smolensk Subjugada"
 STATIC_MODIFIER_DESC_nov_smolensk_mod: "A chave da Rus, Smolensk, tomada — influência ocidental estabelecida."
 STATIC_MODIFIER_NAME_nov_ryazan_mod: "Riazã Conquistada"
 STATIC_MODIFIER_DESC_nov_ryazan_mod: "A porta da estepe Riazã passa ao controle de Novgorod."
 STATIC_MODIFIER_NAME_nov_vologda_mod: "Comércio de Vologda"
 STATIC_MODIFIER_DESC_nov_vologda_mod: "O nó comercial do norte, Vologda, tomado — caminho ao Mar Branco aberto."
 STATIC_MODIFIER_NAME_nov_arkhangelsk_mod: "Arcangel"
 STATIC_MODIFIER_DESC_nov_arkhangelsk_mod: "O porto do Mar Branco, Arcangel, possibilita o comércio direto com a Europa setentrional."
 STATIC_MODIFIER_NAME_nov_white_sea_mod: "Comércio do Mar Branco"
 STATIC_MODIFIER_DESC_nov_white_sea_mod: "A rota comercial do Mar Branco subjugada — comércio do norte de Novgorod concluído."
 STATIC_MODIFIER_NAME_nov_perm_mod: "Perm Conquistada"
 STATIC_MODIFIER_DESC_nov_perm_mod: "O centro de peles do Kama, Perm, conquistado — base do monopólio das peles estabelecida."
 STATIC_MODIFIER_NAME_nov_kola_mod: "A Fortaleza de Kola"
 STATIC_MODIFIER_DESC_nov_kola_mod: "A Península ártica de Kola ocupada — cabeça de ponte para a rota marítima do norte estabelecida."
 STATIC_MODIFIER_NAME_nov_siberia_mod: "A Fronteira Siberiana"
 STATIC_MODIFIER_DESC_nov_siberia_mod: "O caminho através dos Urais rumo à Sibéria aberto."
 STATIC_MODIFIER_NAME_nov_fur_monopoly_mod: "Monopólio do Comércio de Peles"
 STATIC_MODIFIER_DESC_nov_fur_monopoly_mod: "Todas as rotas do comércio de peles do norte passam ao controle exclusivo de Novgorod."
 STATIC_MODIFIER_NAME_nov_karelia_mod: "Carélia Assegurada"
 STATIC_MODIFIER_DESC_nov_karelia_mod: "Acesso ao Báltico assegurado pelo domínio da Carélia."
 STATIC_MODIFIER_NAME_nov_viborg_mod: "Vyborg Conquistada"
 STATIC_MODIFIER_DESC_nov_viborg_mod: "A porta báltica Vyborg tomada de assalto."
 STATIC_MODIFIER_NAME_nov_baltic_fleet_mod: "A Frota Báltica"
 STATIC_MODIFIER_DESC_nov_baltic_fleet_mod: "A frota báltica de Novgorod protege o comércio marítimo do norte."
 STATIC_MODIFIER_NAME_nov_riga_mod: "Riga Conquistada"
 STATIC_MODIFIER_DESC_nov_riga_mod: "O nó hanseático Riga passa ao controle de Novgorod."
 STATIC_MODIFIER_NAME_nov_livonia_mod: "Livônia Subjugada"
 STATIC_MODIFIER_DESC_nov_livonia_mod: "A costa leste do Báltico da Livônia subjugada — terras bálticas ao alcance."
 STATIC_MODIFIER_NAME_nov_neva_mod: "Porto no Neva"
 STATIC_MODIFIER_DESC_nov_neva_mod: "A porta comercial báltica no Neva desenvolvida."
 STATIC_MODIFIER_NAME_nov_archbishop_mod: "O Arcebispado Ortodoxo"
 STATIC_MODIFIER_DESC_nov_archbishop_mod: "O arcebispado ortodoxo de Novgorod estabelece a independência."
 STATIC_MODIFIER_NAME_nov_cathedrals_mod: "Cidade de Catedrais"
