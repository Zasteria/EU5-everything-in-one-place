l_braz_por:
 teu_teutonic_mission_pack: "A Ordem Teutônica — Espada e Cruz"
 teu_teutonic_mission_pack_DESCRIPTION:0 "A Ordem Teutônica, que conquistou o Báltico em nome de Deus. Erga o estandarte da cruzada e destrua os pagãos e os ortodoxos do Leste para completar a Cruzada do Norte — ou secularize-se e lance as bases da Alemanha moderna com o Reino da Prússia. Chegou a hora da escolha."
 teu_teutonic_mission_pack_CRITERIA_DESCRIPTION:0 "Complete a Cruzada do Norte pelo caminho da cruzada, ou construa o Reino da Prússia pelo caminho da secularização."
 teu_teutonic_mission_pack_BUTTON_TOOLTIP:0 "Conquiste o Báltico e a Europa Oriental com a espada e a cruz."
 teu_teutonic_mission_pack_BUTTON_DETAILS:0 "“Toda a ajuda aos que a pedem, nenhuma piedade ao inimigo” — governe o Báltico em nome do Grão-Mestre!"
 teu_crusaders_legacy: "O Legado da Ordem Cruzada"
 teu_crusaders_legacy_desc: "Fundada em Acre em 1190 durante a Terceira Cruzada, a Ordem Teutônica começou como ordem hospitalar na Terra Santa. Em 1226, a Bula de Ouro de Rimini, de Frederico II, concedeu à ordem o direito de conduzir uma expedição contra os pagãos prussianos, e desde então ela conquistou a costa sul do Báltico com a espada cruzada. Esse “Estado monge-cavaleiro”, com capital em Malbork, permanece o último Estado cruzado da Europa, que continua as guerras de conversão e colonização. Agora, cercada pelos poderosos rivais, a Lituânia de Gediminas e a Polônia Jagielônica, o verdadeiro valor da ordem será posto à prova."
 teu_secure_prussia: "Assegure a Prússia"
 teu_secure_prussia_desc: "A Prússia — outrora lar dos povos bálticos prussianos — foi conquistada em mais de cinquenta anos de conquistas da Ordem Teutônica, iniciadas na década de 1230. Após a supressão da “Grande Revolta” de 1283, a população nativa foi efetivamente aniquilada, e a terra, reconstruída por uma colônia de colonos alemães. No entanto, nas montanhas e florestas, as brasas da resistência ainda ardem. Complete a rede de fortalezas por toda a Prússia e torne inabalável o governo da ordem — pois sem a Prússia não há Ordem Teutônica."
 teu_christianize_prussia: "Cristianize a Prússia"
 teu_christianize_prussia_desc: "O declarado motivo de existência da Ordem Teutônica é “converter os pagãos”. Na realidade, a maioria dos prussianos conquistados foi convertida à força, e os que resistiram, exterminados. O Tratado de Christburg, de 1249, concedeu direitos à nobreza prussiana em troca do batismo, mas as revoltas posteriores quebraram essa promessa. Agora alcance a verdadeira catolicização e construa uma rede de igrejas para estabelecer a legitimidade religiosa da ordem — só com o apoio do papa esse Estado pode tornar-se verdadeiramente legítimo."
 teu_subdue_lithuania: "Subjugue a Lituânia"
 teu_subdue_lithuania_desc: "O Grão-Ducado da Lituânia — vasto Estado pagão que, sob a dinastia dos Gediminaitis, se estendia do Báltico à Ucrânia — foi tanto a maior ameaça da Ordem Teutônica quanto seu maior alvo de cruzada. A derrota em Durbe, em 1260, o desastre em Grunwald, em 1410 — a Lituânia repetidamente derrotou a ordem. No entanto, com a conversão de Jagelão ao catolicismo, em 1387, a Lituânia deixou nominalmente de ser um “Estado pagão”, o que complicou a justificação da cruzada. Mesmo assim, só vencendo a luta pela supremacia contra a Lituânia pode a ordem governar verdadeiramente o Báltico."
 teu_subdue_poland: "Subjugue a Polônia"
 teu_subdue_poland_desc: "15 de julho de 1410, batalha de Grunwald (Tannenberg) — a maior derrota da história da Ordem Teutônica. O grão-mestre Ulrich von Jungingen e a flor da cavalaria da ordem tombaram, e a própria Malbork foi sitiada. A Segunda Paz de Toruń, de 1466, entregou a Prússia Ocidental à Polônia, reduzindo a ordem a pouco mais que vassala. Vingue essa humilhação — derrote a Polônia, recupere as terras perdidas e lave a vergonha de Grunwald."
 teu_order_or_prussia: "A Escolha — Cruzada ou Secularização"
 teu_order_or_prussia_desc: "Em 1511, quando Alberto de Hohenzollern se tornou Grão-Mestre, a ordem estava numa encruzilhada de sobrevivência. Enquanto a Reforma de Lutero, de 1517, abalava a Europa, Alberto encontrou-se com o próprio Lutero e escolheu secularizar a ordem, fundando o ducado da Prússia — em 1525. Mas e se a ordem, em vez disso, tivesse continuado sua missão cruzada? Complete a “Cruzada do Norte”, subjugando os ortodoxos, pagãos e muçulmanos do Leste, ou lance as bases da Prússia moderna com um ducado secular — a escolha é sua."
 teu_crusade_path: "O Caminho da Cruzada do Norte"
 teu_crusade_path_desc: "O caminho da cruzada — empunhe a espada em nome de Deus. A verdadeira vocação da Ordem Teutônica é converter e conquistar os pagãos. A leste aguardam as terras ortodoxas da Rus; no litoral báltico, a aliança com a Ordem Livônia seduz. Como na conquista da Prússia, erga o estandarte cruzado da costa oriental do Báltico à Rússia setentrional. A indulgência de cruzada, concedida por Gregório IX, permanece eternamente válida — complete a Cruzada do Norte em nome de Deus e grave o nome do Grão-Mestre na história."
 teu_path_crusade_chosen_tt: "Escolheu o caminho da Cruzada"
 teu_path_secular_chosen_tt: "Escolheu o caminho da secularização"
 teu_livonian_alliance: "Aliança com a Ordem Livônia"
 teu_livonian_alliance_desc: "A Ordem Livônia — herdeira dos Irmãos da Espada, absorvida pela Ordem Teutônica em 1237. Com base em Riga, essa ordem controla a costa leste do Báltico, mas sob constante pressão da Lituânia e da Rus. Sofreu a derrota diante de Alexandre Nevski na batalha do Lago Peipus, em 1242, e um golpe esmagador da Lituânia em Durbe, em 1260. Agora forje a aliança com a Ordem Livônia e construa um sistema conjunto para governar juntos o Báltico oriental — use a força da ordem-irmã para derrotar os inimigos do Leste."
 teu_crusade_east: "Cruzada para o Leste"
 teu_crusade_east_desc: "Volte a espada cruzada para o leste — os “cismáticos” ortodoxos, os “romuvianos” pagãos, os “infiéis” muçulmanos. Todos são inimigos da fé católica e alvo da cruzada. Desde a década de 1230, a Ordem Teutônica conduziu a “Cruzada do Norte” por terras bálticas. Agora amplie o horizonte mais ao leste e conduza a guerra santa contra o coração da ortodoxia oriental e os últimos bastiões dos bálticos. A conversão da Lituânia ao catolicismo, em 1386, reduziu o número de alvos “legítimos” da cruzada, mas os Estados ortodoxos da Rus ainda permanecem."
 teu_riga_crusade: "Riga, Bastião da Cruzada"
 teu_riga_crusade_desc: "Riga — fundada em 1201 pelo bispo Alberto von Buxhoeveden, essa cidade é o mais importante bastião na costa oriental do Báltico. Uma longa luta de poder fez-se entre a Ordem Livônia e o arcebispo de Riga, mas, se a Ordem Teutônica conseguir unificar a cidade e desenvolvê-la como base avançada da cruzada oriental, ela se tornará cabeça de ponte para opor-se à Rus. Situada na foz do Dvina, Riga é vital tanto para o comércio quanto para a guerra — assegurá-la estabelece uma linha de suprimento para o avanço rumo ao leste."
 teu_march_to_orthodox: "Marcha sobre a Ortodoxia"
 teu_march_to_orthodox_desc: "A “herética” igreja ortodoxa — aos olhos da Roma católica, as igrejas bizantina e russa mantinham uma “fé falsa” desde o Grande Cisma de 1054. A República de Novgorod, Pskov, os principados russos — esses Estados ortodoxos — são o verdadeiro alvo da Cruzada do Norte. Em 1242, Alexandre Nevski derrotou a Ordem Livônia no gelo do Lago Peipus e é até hoje celebrado como “o herói que derrotou os cruzados”. Vingue essa derrota e erga o estandarte católico em terra ortodoxa — essa é a suprema missão da Ordem Teutônica."
 teu_northern_crusade_final: "Cruzada do Norte Concluída"
 teu_northern_crusade_final_desc: "A Cruzada do Norte — iniciada com a conquista da Prússia e estendida pela costa oriental do Báltico até o interior da Rus — aproxima-se enfim da conclusão. Como outrora os prussianos, os ortodoxos devem ser convertidos ou subjugados. O Báltico torna-se o mar interior da Ordem Teutônica, e o estandarte do Grão-Mestre tremula até o extremo oriental do mundo. O sonho da “Cruzada do Norte”, herdado dos Irmãos da Espada do século XIII — a unificação das terras dos bálticos, eslavos e fineses num império sagrado — é agora realizado."
 teu_secularize_path: "O Caminho da Secularização"
 teu_secularize_path_desc: "Em 10 de abril de 1525, em Cracóvia, Alberto de Hohenzollern proclamou a fundação do ducado da Prússia como feudo do rei Sigismundo I da Polônia — a secularização da Ordem Teutônica. Em troca da conversão ao luteranismo, as terras da ordem sobreviverão como ducado secular. Os Estados católicos indignavam-se com essa “traição”, mas a crescente onda do protestantismo deu à ordem um novo caminho adiante. Assente-se na onda da Reforma e, como duque secular, lance as bases da Prússia moderna — esse é um novo modo de vida da ordem numa nova era."
 teu_prussian_duchy: "O Ducado da Prússia"
 teu_prussian_duchy_desc: "O Ducado da Prússia — nascido da secularização em 1525 — desenvolveu-se rapidamente sob os Hohenzollern. Com Königsberg como capital, apoiou ativamente a Reforma luterana e, por meio da Universidade de Königsberg (fundada em 1544), chamou-se “Prússia do saber”. O antigo Estado cruzado transforma-se agora num ducado moderno. Construa a administração, forje a cooperação com a nobreza junker e estabeleça as bases do Estado militar — primeiro passo rumo ao futuro Reino da Prússia e, depois, ao Império Alemão."
 teu_control_pomerania: "Domine a Pomerânia"
 teu_control_pomerania_desc: "A Pomerânia — que se estende ao longo da costa meridional do Báltico, a oeste do Vístula — foi há muito disputada por príncipes alemães, Dinamarca e Polônia. O Ducado da Pomerânia, da dinastia dos Grifos, é um pequeno Estado, encravado entre a Prússia e Brandemburgo, mas seu acesso ao Báltico o torna estrategicamente vital. Tomando a Pomerânia, a Prússia torna-se verdadeira senhora do Báltico. Domine o porto de Stettin (Szczecin) e as vias fluviais do Oder e forje o “eixo norte-alemão”, que liga Brandemburgo e a Pomerânia."
 teu_protestant_reformation: "A Reforma Protestante"
 teu_protestant_reformation_desc: "Em 1517, Martinho Lutero pregou suas Noventa e Cinco Teses na porta da igreja de Wittenberg — e a onda da Reforma atingiu em cheio a Prússia. O próprio Grão-Mestre Alberto encontrou-se com Lutero e escolheu secularizar a ordem. A adoção do luteranismo pela Prússia tornou-se a base da “liga protestante” contra os Habsburgo católicos. Promova ativamente a Reforma e modernize a educação e o governo — a tradição acadêmica da Universidade de Königsberg e a burocracia disciplinada da Prússia tornar-se-ão a pedra angular da cultura prussiana por gerações."
 teu_dominate_hre: "Ascenda no Sacro Império Romano"
 teu_dominate_hre_desc: "O Sacro Império Romano — ridicularizado como “nem sagrado, nem romano, nem império” — é uma ordem política complexa. Como a Prússia se abrirá caminho nele? O poder dos imperadores habsburgos, a rivalidade dos eleitores, as divisões causadas pela Reforma — tudo isso cria oportunidades para a ascensão da Prússia. A união de Brandemburgo e Prússia de 1618 sob a herança dos Hohenzollern tornar-se-á a base da posterior Alemanha unificada. Estabeleça seu status de eleitor, amplie sua influência dentro do Império e eleve a Prússia como rival dos Habsburgo e líder da Alemanha do Norte."
 teu_north_german_empire: "A Confederação da Alemanha do Norte"
 teu_north_german_empire_desc: "O Império da Alemanha do Norte — sonho de Bismarck, ambição da casa de Hohenzollern. No século XVIII, Frederico, o Grande, provou o poder da Prússia na Guerra dos Sete Anos contra a Áustria; no XIX, Bismarck unificou a Alemanha “por sangue e ferro”. Mas muito antes, como Estado herdeiro da Ordem Teutônica, o sonho da Prússia de unificar toda a Alemanha do Norte já tinha longa história. Brandemburgo, Pomerânia, Mecklemburgo, Hanôver — reúna os príncipes da Alemanha do Norte e realize aqui e agora a Confederação da Alemanha do Norte, que se tornará precursora do Estado alemão moderno."
 teu_malbork_citadel: "Fortifique a Cidadela de Malbork"
 teu_malbork_citadel_desc: "O Castelo de Malbork (Marienburg) — essa vasta fortaleza de tijolos no delta do Vístula — é a sede principal da Ordem Teutônica. Transferida de Veneza em 1309, ergue-se como o maior castelo medieval de tijolos da Europa. Após a derrota em Grunwald, em 1410, foi sitiada por forças polonesas, mas resistiu sob o comando do grão-mestre em exercício Heinrich von Plauen. As muralhas de Malbork — símbolo mesmo do Estado da ordem — fortificá-las num bastião inexpugnável é a base de toda estratégia defensiva."
 teu_konigsberg_dev: "Desenvolva Königsberg"
 teu_konigsberg_dev_desc: "Königsberg (atual Kaliningrado) — fundada em 1255 com o apoio do rei Premislau Otocar II da Boêmia, essa cidade cresceu como centro da colônia prussiana. A universidade foi ali fundada em 1544, mais tarde lar do filósofo Immanuel Kant. Situada na foz do Pregel, essa cidade é vital nó comercial báltico e serviu de capital de fato do Estado da ordem. Desenvolva sua infraestrutura urbana, amplie sua catedral e seus mercados e deixe-a prosperar como ponto de transbordo do comércio setentrional e do Leste Europeu — fortalecer o coração da Prússia é fonte de força nacional."
 teu_danzig_port: "Desenvolva o Porto de Gdansk"
 teu_danzig_port_desc: "Gdansk — situada na foz do Vístula, é a maior cidade portuária do Báltico. Em 1308, a Ordem Teutônica “tomou” Gdansk de seus aliados poloneses e desde então permitiu que prosperasse como nó do comércio báltico. Mas a Segunda Paz de Toruń, de 1466, entregou a cidade à Polônia, que a estima como coração da “Prússia Real”. Recupere Gdansk, incorpore-a à rede comercial hanseática e maximize os lucros do comércio báltico de grãos — essa cidade, conhecida como “Rainha do Báltico”, é artéria financeira da ordem."
 teu_teutonic_law: "O Código Teutônico"
 teu_teutonic_law_desc: "O direito de Culm da década de 1230 (Kulmer Handfeste) foi o primeiro código jurídico concedido pela Ordem Teutônica às suas cidades coloniais. Com base nele, o sistema jurídico prussiano desenvolveu-se e tornou-se a base jurídica da colonização alemã oriental. O decreto arquiepiscopal de 1489, o código de leis prussiano de 1529 — o desenvolvimento jurídico é o meio pelo qual o Estado da ordem se transforma de “conquistador bárbaro” em “portador da civilização”. Organize o governo, proteja os direitos dos camponeses e desenvolva o direito comercial — estabeleça a Prússia como Estado regido pelo direito."
 teu_amber_trade: "Tome o Comércio de Âmbar"
 teu_amber_trade_desc: "O ouro do Báltico — o âmbar. Chamado “ouro do Norte” desde a Antiguidade, essa gema só se encontra ao longo da costa báltica e foi outrora fornecida até o mundo mediterrâneo. Após a conquista da Prússia, a Ordem Teutônica reivindicou o monopólio do âmbar, punindo contrabandistas com a morte. Esse “monopólio do âmbar” é uma das mais importantes fontes de renda da ordem. Assuma o pleno controle das regiões bálticas produtoras de âmbar e domine as rotas comerciais para a Europa Central — pois, além da espada, a riqueza do âmbar é outra fonte do poder da ordem."
 teu_hanseatic_ties: "Laços com a Liga Hanseática"
 teu_hanseatic_ties_desc: "A Liga Hanseática — essa união de cidades mercantis alemãs, liderada por Lübeck — domina o comércio do Báltico e do Mar do Norte. Gdansk, Riga, Reval (Tallinn) — todas essas cidades — são grandes nós hanseáticos, e seus territórios se cruzam com o domínio da própria Ordem Teutônica. Os mercadores hanseáticos levavam grãos, madeira e âmbar da Prússia à Europa Ocidental e traziam em troca tecido, vinho e sal. Construa estreitos laços com a Liga Hanseática e torne-se senhora eficaz da rede comercial báltica — assegure a prosperidade da ordem tanto pela espada quanto pelo comércio."
 teu_colonize_prussia: "Colonize a Prússia"
 teu_colonize_prussia_desc: "A Ostsiedlung — grande migração histórica de alemães, que se instalaram a leste do Elba do século XI ao XIV. A Ordem Teutônica estava na vanguarda desse movimento, atraindo camponeses, artesãos e mercadores alemães à conquistada Prússia. Em troca do desaparecimento dos povos nativos prussianos, essa terra foi colonizada como “fronteira oriental alemã”. Construção planejada de cidades, desenvolvimento agrícola, construção de estradas — essas são as medidas pelas quais a “terra bárbara” é incorporada à esfera da civilização europeia. Conclua a colonização da Prússia e estabeleça-a com firmeza como terra alemã."
 teu_torun_city: "Desenvolva Toruń"
 teu_torun_city_desc: "Toruń — construída ao longo do Vístula, essa cidade foi o primeiro bastião da Ordem Teutônica, fundada em 1231. As “Pazes de Toruń” de 1454 e 1466 definiram suas relações com a Polônia: a primeira trouxe paz, a segunda, a humilhante cessão de território da ordem. Em 1473 nasceu aqui Copérnico — o astrônomo que propôs a teoria heliocêntrica. Desenvolva Toruń, berço da história da ordem, e reconstrua-a como centro do comércio fluvial do Vístula."
 teu_memel_fortress: "Fortifique Memel"
 teu_memel_fortress_desc: "Memel (Klaipėda) — na foz do Nemunas, na fronteira lituano-prussiana, essa cidade-fortaleza foi construída pela Ordem Teutônica como linha avançada de defesa contra a Lituânia. O Castelo de Memel, fundado em 1252, resistiu a incontáveis batalhas contra a Lituânia. Quando essa fortaleza cair — as portas da Prússia se abrirão; ao contrário, manter Memel com firmeza é a chave para deter a invasão lituana. Fortifique essa porta para o Báltico e deixe-a servir de nó interno do comércio de âmbar."
 teu_grand_master: "Hegemonia do Grão-Mestre"
 teu_grand_master_desc: "O Grão-Mestre (Hochmeister) é o líder supremo da Ordem Teutônica. Como vigário de Cristo, conduz os cavaleiros-monges que governam o império cruzado, que se estende do Báltico por toda a Europa Oriental. Hermann von Salza (1209-1239) estabeleceu as bases políticas da ordem pela diplomacia com Frederico II, e o governo de Winrich von Kniprode (1351-1382) marcou a era de ouro da ordem. Agora cada inimigo subjugado, e a Cruzada do Norte concluída — a autoridade do Grão-Mestre estende-se do Báltico às terras dos ortodoxos. Como Grão-Mestre, cujo nome será gravado na história, leve a vontade de Deus até os confins do Leste."
 teu_prussian_king: "Proclamação do Rei da Prússia"
 teu_prussian_king_desc: "O Rei da Prússia — em 18 de janeiro de 1701, Frederico III coroou-se em Königsberg como rei Frederico I da Prússia. Coroando-se na Prússia (antigas terras da Ordem Teutônica), que ficava fora da jurisdição do imperador do Sacro Império Romano, encontrou um modo astuto de reivindicar o título real sem a aprovação habsburga. “Frederico, o Grande”, Frederico II, tomou a Silésia e venceu a Guerra dos Sete Anos, elevando a Prússia a grande potência europeia. “A Prússia — não um país com exército, mas um exército com país” — sob essa filosofia nacional, lance aqui e agora as bases da Alemanha moderna."
 teu_events.10.t: "O Futuro da Ordem — Cruzada ou Secularização"
 teu_events.10.d: "Com a Lituânia e a Polônia subjugadas, a Ordem Teutônica enfrenta agora uma escolha histórica. Continuar sob a bandeira cruzada, atacando os pagãos e ortodoxos do Leste — ou secularizar-se num ducado moderno e transformar-se no Reino da Prússia."
 teu_events.10.a: "O caminho da cruzada — derrote os pagãos e ortodoxos do Leste e complete a Cruzada do Norte"
 teu_events.10.b: "O caminho da secularização — construa o ducado da Prússia e lance as bases da Alemanha moderna"
 teu_events.50.t: "Cruzada do Norte Concluída"
 teu_events.50.d: "“Essa é a vontade de Deus” — do Báltico aos distantes confins da Rus, a cruzada da Ordem Teutônica concluída. A cruz brilha claramente sobre as terras do norte."
 teu_events.50.a: "Viva a cruzada! Hegemonia do Grão-Mestre estabelecida!"
 teu_constantinople_fall: "A Queda de Constantinopla"
 teu_constantinople_fall_desc: "Com a Cruzada do Norte agora concluída, a Ordem Teutônica volta o olhar para o sul. Constantinopla, outrora bastião oriental da cristandade, há muito caiu nas mãos de hereges e infiéis. Recupere essa antiga cidade imperial e ergue o estandarte da verdadeira fé sobre o Corno de Ouro de novo. O caminho para a Terra Santa de Jerusalém começa pela libertação dessa cidade."
 teu_jerusalem_reclaimed: "A Recuperação de Jerusalém"
 teu_jerusalem_reclaimed_desc: "Com Constantinopla recuperada, o objetivo final da cruzada é agora um só — a própria Terra Santa de Jerusalém. Incontáveis cruzados tentaram, e incontáveis cruzados tombaram nessa terra; agora chegou a hora de a cruz negra da Ordem Teutônica tremular aqui. Ofereça orações junto à Basílica do Santo Sepulcro e realize o antigo sonho do mundo cristão."
 teu_events.55.t: "Constantinopla, Finalmente Nossa"
 teu_events.55.d: "Tendo concluído a Cruzada do Norte, a Ordem Teutônica voltou sua lança para o sul. Constantinopla, outrora símbolo da glória bizantina, tornou-se pouco mais que ruínas, pisoteadas por hereges e infiéis. Mas os exércitos da ordem libertaram a cidade e ergueram de novo a cruz sobre a Hagia Sophia. O próximo objetivo é claro — recuperar a Terra Santa de Jerusalém."
 teu_events.55.a: "O caminho à Terra Santa aberto — avante, rumo a Jerusalém!"
 teu_events.56.t: "Jerusalém, Libertada"
 teu_events.56.d: "O sonho que os cruzados perseguiram por séculos, e a esperança que se despedaçou vez após vez — a recuperação da Terra Santa de Jerusalém enfim realizada. Enquanto o estandarte da Ordem Teutônica tremula sobre a Basílica do Santo Sepulcro, todo o mundo cristão se regozija com essa vitória. O nome do Grão-Mestre será pronunciado para sempre ao lado dos nomes dos grandes líderes cruzados do passado. Por esse sagrado triunfo, a bravura e a glória do governante tornaram-se imortais."
 teu_events.56.a: "Deus conosco! Terra Santa libertada!"
 teu_events.60.t: "Confederação da Alemanha do Norte Proclamada"
 teu_events.60.d: "Da Prússia à Pomerânia e a Brandemburgo — toda a Alemanha do Norte unida sob o estandarte prussiano. A aurora do Estado alemão moderno."
 teu_events.60.a: "Viva a Prússia! Viva a Confederação da Alemanha do Norte!"
 teu_events.99.t: "O Objetivo Final da Ordem"
 teu_events.99.d: "A missão da Ordem Teutônica cumprida — seu nome gravado na história com o grande império que governou o Báltico."
 teu_events.99.a: "Viva a Ordem Teutônica!"
 STATIC_MODIFIER_NAME_teu_amber_mod: "Monopólio do Comércio de Âmbar"
 STATIC_MODIFIER_DESC_teu_amber_mod: "O ouro do Báltico, o âmbar — seu comércio monopolizado enche o tesouro da Ordem Teutônica."
 STATIC_MODIFIER_NAME_teu_christian_mod: "Cristianização da Prússia"
 STATIC_MODIFIER_DESC_teu_christian_mod: "A fé católica lançou raízes por toda a Prússia, estabelecendo a autoridade religiosa."
 STATIC_MODIFIER_NAME_teu_colonize_mod: "Colonização da Prússia"
 STATIC_MODIFIER_DESC_teu_colonize_mod: "Colonos, que chegam em carroças de além do Elba, erguem novas aldeias na terra selvagem prussiana."
 STATIC_MODIFIER_NAME_teu_danzig_mod: "Prosperidade do Porto de Gdansk"
 STATIC_MODIFIER_DESC_teu_danzig_mod: "A “Rainha do Báltico”, Gdansk, desenvolvida como nó do comércio marítimo da ordem."
 STATIC_MODIFIER_NAME_teu_duchy_mod: "Estabelecimento do Ducado da Prússia"
 STATIC_MODIFIER_DESC_teu_duchy_mod: "O ducado secularizado da Prússia organizado como Estado administrativo moderno."
 STATIC_MODIFIER_NAME_teu_east_crusade_mod: "Cruzada para o Leste"
 STATIC_MODIFIER_DESC_teu_east_crusade_mod: "A cada expedição a terras pagãs, os irmãos-cavaleiros costuram a cruz negra em seus mantos brancos e renovam os votos da guerra santa."
 STATIC_MODIFIER_NAME_teu_hanseatic_mod: "Laços com a Liga Hanseática"
 STATIC_MODIFIER_DESC_teu_hanseatic_mod: "Cogas hanseáticas lançam âncora sem cessar nos portos de Gdansk e Toruń, em busca de âmbar e grãos."
 STATIC_MODIFIER_NAME_teu_hre_mod: "Ascensão dentro do Sacro Império"
 STATIC_MODIFIER_DESC_teu_hre_mod: "A Prússia ergueu-se como potência central dentro do Sacro Império Romano."
 STATIC_MODIFIER_NAME_teu_konigsberg_mod: "Prosperidade de Königsberg"
 STATIC_MODIFIER_DESC_teu_konigsberg_mod: "Königsberg, coração da Prússia, prospera como cidade de comércio e saber."
 STATIC_MODIFIER_NAME_teu_law_mod: "O Código Teutônico"
 STATIC_MODIFIER_DESC_teu_law_mod: "O código da ordem, construído sobre o direito de Culm, ganhou fama de julgar cidade e campo com a mesma medida."
 STATIC_MODIFIER_NAME_teu_legacy_mod: "O Legado da Ordem Teutônica"
 STATIC_MODIFIER_DESC_teu_legacy_mod: "Os retratos dos Grão-Mestres no grande salão de Malbork levam a tradição da ordem a todos os cantos de seu território recuperado."
 STATIC_MODIFIER_NAME_teu_lithuania_mod: "Subjugação da Lituânia"
 STATIC_MODIFIER_DESC_teu_lithuania_mod: "A linha de fortalezas, erguida nas florestas da Samogícia, ergue-se como barreira contra os exércitos do Grão-Duque da Lituânia."
 STATIC_MODIFIER_NAME_teu_livonia_mod: "Domínio da Livônia"
 STATIC_MODIFIER_DESC_teu_livonia_mod: "A aliança com a Ordem Livônia assegurou o controle da costa leste do Báltico."
 STATIC_MODIFIER_NAME_teu_malbork_mod: "Fortificação de Malbork"
 STATIC_MODIFIER_DESC_teu_malbork_mod: "Malbork fortificada num bastião inexpugnável, pedra angular da defesa da ordem."
 STATIC_MODIFIER_NAME_teu_memel_mod: "Fortificação de Memel"
 STATIC_MODIFIER_DESC_teu_memel_mod: "Memel desenvolvida como cidade portuária fortificada, que assegura a fronteira contra a Lituânia."
 STATIC_MODIFIER_NAME_teu_orthodox_march_mod: "Marcha sobre a Ortodoxia"
 STATIC_MODIFIER_DESC_teu_orthodox_march_mod: "Depois de muitas guerras contra príncipes ortodoxos, os soldados da ordem conhecem bem os caminhos da guerra de fronteira no leste."
 STATIC_MODIFIER_NAME_teu_poland_mod: "Subjugação da Polônia"
 STATIC_MODIFIER_DESC_teu_poland_mod: "O orgulho perdido na derrota de Grunwald, enfim recuperado pela vitória da vingança."
 STATIC_MODIFIER_NAME_teu_pomerania_mod: "Controle da Pomerânia"
 STATIC_MODIFIER_DESC_teu_pomerania_mod: "Com os portos da Pomerânia em mãos, nenhuma cidade da costa báltica pode deixar de prestar respeito ao estandarte da ordem."
 STATIC_MODIFIER_NAME_teu_protestant_mod: "A Reforma Protestante"
 STATIC_MODIFIER_DESC_teu_protestant_mod: "Na Prússia, que aceitou o ensinamento de Lutero, eruditos reúnem-se de longe e de perto nos colégios de Königsberg."
 STATIC_MODIFIER_NAME_teu_prussia_mod: "Subjugação Completa da Prússia"
 STATIC_MODIFIER_DESC_teu_prussia_mod: "A subjugação completa da Prússia extirpou as sementes da rebelião."
 STATIC_MODIFIER_NAME_teu_prussian_kingdom_mod: "O Reino da Prússia"
 STATIC_MODIFIER_DESC_teu_prussian_kingdom_mod: "O moderno Reino da Prússia estabelecido como senhor da Alemanha do Norte."
 STATIC_MODIFIER_NAME_teu_constantinople_reclaimed_mod: "Recuperação de Constantinopla"
 STATIC_MODIFIER_DESC_teu_constantinople_reclaimed_mod: "A cruz erguida de novo sobre a grande igreja de Constantinopla, e sua luz alcança todo o Oriente."
 STATIC_MODIFIER_NAME_teu_jerusalem_ruler_mod: "Libertador de Jerusalém"
 STATIC_MODIFIER_DESC_teu_jerusalem_ruler_mod: "O Grão-Mestre que se ajoelhou junto ao Santo Sepulcro é venerado pelo povo como santo vivo, e seu nome tornou-se estandarte que guia exércitos."
 STATIC_MODIFIER_NAME_teu_riga_mod: "Riga, Bastião da Cruzada"
 STATIC_MODIFIER_DESC_teu_riga_mod: "Riga desenvolvida como centro comercial, militar e cruzado da costa oriental do Báltico."
 STATIC_MODIFIER_NAME_teu_secular_start_mod: "Primeiro Passo da Secularização"
 STATIC_MODIFIER_DESC_teu_secular_start_mod: "Desde o dia em que o Grão-Mestre assumiu a coroa ducal, o novo espírito do Estado moderno agitou-se nas assembleias da Prússia."
 STATIC_MODIFIER_NAME_teu_torun_mod: "Prosperidade de Toruń"
 STATIC_MODIFIER_DESC_teu_torun_mod: "Toruń, pátria de Copérnico, prospera como centro do comércio fluvial do Vístula."
 teu_mazovia_subjugation: "Subjugação da Masóvia"
 teu_mazovia_subjugation_desc: "A Masóvia — coração polonês, que se estende ao longo do Vístula médio. Essa terra, onde mais tarde será construída Varsóvia, é a porta da Polônia para o leste e principal rota de invasão da Prússia. O Ducado da Masóvia foi governado por um ramo mais jovem da dinastia polonesa Piasta, até ser absorvido pelo Reino da Polônia em 1526 com a extinção de sua linha governante. O controle dessa terra remove a ameaça do sul e assegura a Prússia. Faça da rica terra agrícola da bacia do Vístula o celeiro da Ordem Teutônica."
 teu_narva_fortress: "A Fortaleza de Narva"
 teu_narva_fortress_desc: "Narva — essa cidade-fortaleza junto ao rio Narva, na costa norte da Estônia, marca a fronteira estratégica entre a Livônia e a Rússia. Do outro lado do rio ergue-se a fortaleza russa de Ivangorod — verdadeiro ponto de choque de civilizações. Vendida à Ordem Teutônica pela Dinamarca junto com a ponta norte da Estônia em 1346, Narva serve de base avançada para a cruzada oriental. Em 1558, está destinada a uma breve queda diante das forças de Ivan, o Terrível — mas mude esse destino aqui e agora. Fortifique Narva num bastião inexpugnável e mantenha a pressão sobre a Rússia ortodoxa."
 teu_berlin_dev: "Desenvolvimento de Berlim"
 teu_berlin_dev_desc: "Berlim — essa pequena cidade na confluência dos rios Spree e Havel foi fundada no século XIII como cidades gêmeas (Berlim e Cölln) pelo margrave de Brandemburgo. Por ora é apenas a pequena sede dos eleitores Hohenzollern de Brandemburgo, mas, assim que a Prússia se unir a Brandemburgo, esse lugar está destinado a tornar-se capital imperial. Com a união pessoal de Brandemburgo-Prússia de 1618 e a fundação do Reino da Prússia em 1701, Berlim tornou-se o coração da Alemanha do Norte. Assente essa base agora — o desenvolvimento de Berlim gerará uma cidade, que simboliza a unificação da Alemanha do Norte."
 teu_junker_system: "Estabeleça o Sistema dos Junkers"
 teu_junker_system_desc: "Junker — em alemão, “jovem senhor”; esse termo refere-se à nobreza proprietária militarizada da Prússia. Possuindo vastos latifúndios (Gutsherrschaft) a leste do Elba, os junkers usavam trabalho servil para produzir grãos para exportação à Europa Ocidental pelo Báltico. Mas seu verdadeiro papel era militar — os junkers preenchiam a maioria dos postos de oficial do exército prussiano, formando o próprio núcleo da “Prússia como Estado militar”. Frederico Guilherme I (o “Rei-Soldado”) enviava compulsoriamente os junkers às academias militares, institucionalizando seu dever militar. Estabeleça agora o sistema dos junkers e lance a base da “cultura militar prussiana”, que perdurará por gerações."
 teu_silesia_claim: "Domine a Silésia"
 teu_silesia_claim_desc: "A Silésia — que se estende ao longo do alto Oder, essa região possui potencial para tornar-se a maior zona industrial da Europa Central, rica em carvão, minério de ferro e zinco. Outrora parte das posses polonesas dos Piastas, passou ao Reino da Boêmia depois de 1335 e tornou-se parte da Áustria pela herança da Boêmia pelos Habsburgo em 1526. Mas em 1740, Frederico, o Grande, lançou uma invasão relâmpago da Silésia logo no início da Guerra de Sucessão Austríaca, tomando essa rica terra “pela força”. Tome agora a Silésia para a Prússia — seu poderio industrial tornar-se-á a base econômica do império prussiano."
 teu_cathedral_network: "A Rede de Catedrais"
 teu_cathedral_network_desc: "Rede de catedrais por toda a Prússia — a Ordem Teutônica sempre construiu igrejas em terra conquistada. A Catedral de Königsberg, a capela do castelo de Malbork, a igreja de São João em Toruń — todas foram instrumentos para implantar a fé católica em solo pagão. Organizar o sistema paroquial, estabelecer bispados, construir mosteiros — essas são as medidas institucionais pelas quais as “terras bárbaras” são incorporadas à civilização cristã. A catedral é ao mesmo tempo ato de serviço a Deus e símbolo do governo colonial. Estabeleça a rede de catedrais por toda a Prússia e reforce a autoridade religiosa e a legitimidade do governo da Ordem Teutônica."
 teu_elbing_dev: "Desenvolva Elbing"
 teu_elbing_dev_desc: "Elbing (Elbląg) — fundada em 1237 na extremidade oriental do delta do Vístula, essa cidade é um dos mais importantes portos da Prússia, ao lado de Gdansk, e importante membro da Liga Hanseática. Ligada a Königsberg por vias fluviais interiores, prosperou como porto de exportação de grãos, madeira e âmbar. Como Gdansk, caiu sob controle polonês depois da Segunda Paz de Toruń (1466), mas, para a Prússia, o pleno controle do delta do Vístula é uma saída ao mar indispensável. Desenvolva Elbing e estabeleça um sistema par de grandes portos bálticos ao lado de Gdansk."
 STATIC_MODIFIER_NAME_teu_mazovia_mod: "Masóvia Subjugada"
 STATIC_MODIFIER_DESC_teu_mazovia_mod: "A Masóvia subjugada, assegurando a fronteira meridional."
 STATIC_MODIFIER_NAME_teu_narva_mod: "A Fortaleza de Narva"
 STATIC_MODIFIER_DESC_teu_narva_mod: "Narva fortificada num bastião inexpugnável no leste."
 STATIC_MODIFIER_NAME_teu_berlin_mod: "Desenvolvimento de Berlim"
 STATIC_MODIFIER_DESC_teu_berlin_mod: "Berlim desenvolvida como capital da Prússia."
 STATIC_MODIFIER_NAME_teu_junker_mod: "O Sistema dos Junkers"
 STATIC_MODIFIER_DESC_teu_junker_mod: "Os junkers, enraizados em suas propriedades a leste do Elba, sustentam o reino tanto como oficiais quanto como funcionários."
 STATIC_MODIFIER_NAME_teu_silesia_mod: "Silésia Conquistada"
 STATIC_MODIFIER_DESC_teu_silesia_mod: "Os teares e as minas da Silésia dão novo pulso às finanças da Prússia."
 STATIC_MODIFIER_NAME_teu_cathedral_mod: "A Rede de Catedrais"
 STATIC_MODIFIER_DESC_teu_cathedral_mod: "Catedrais construídas por toda a Prússia, e a fé católica lançou raízes."
 STATIC_MODIFIER_NAME_teu_elbing_mod: "Prosperidade do Porto de Elbing"
 STATIC_MODIFIER_DESC_teu_elbing_mod: "Elbing desenvolvida como grande cidade portuária báltica."
 teu_mongol_empire: "Bastião Mongol Caído"
 teu_mongol_empire_desc: "Sarai, Cazã, Samarcanda, Caffa, Dadu, Karakorum — uma após outra, as grandes capitais do Império Mongol, que outrora abalou o mundo, caíram sob o estandarte preto e cruzado. A “grande nação mongol”, fundada por Gengis Khan em 1206, desintegrou-se no fim do século XIII, e sua antiga glória há muito passou. No que resta de suas posses, os exércitos de ferro da Ordem Teutônica marcham tanto do leste quanto do oeste, subjugando os governantes da estepe. Do Pacífico, a leste, ao Báltico, a oeste — toda a herança mongol tomada pelo império da cruz."
 teu_sacred_nomads: "Trono do Grande Cã Usurpado"
 teu_sacred_nomads_desc: "Com todo o Império Mongol subjugado, o Grão-Mestre reivindica agora o título que os povos da estepe mais temem — “cã” — como troféu de guerra. Não é fusão nem coexistência; é simplesmente o conquistador sentando-se no trono do derrotado. A cavalaria pesada, que leva a cruz, tornou-se senhora do que outrora foi a horda mais temida da terra. Una os impérios do Oriente e do Ocidente pela vontade de Deus — essa é a vitória final da Ordem Teutônica."
 teu_events.70.t: "Capitais Mongóis, Nossas"
 teu_events.70.d: "Sarai, Cazã, Samarcanda, Caffa, Dadu, Karakorum — todas as capitais do Império Mongol caíram. A partir deste dia, o Grão-Mestre intitula-se “Grão-Cã alemão”, mas não como herdeiro do sangue ou da cultura mongol. É nada mais que um conquistador, assumindo o título do derrotado como sinal de seu próprio poder. Pax Deus — a paz de Deus — substitui agora o que outrora foi o governo da estepe."
 teu_events.70.a: "As posses mongóis finalmente nossas!"
 teu_events.80.t: "A Cruz de Ferro Governa o Mundo"
 teu_events.80.d: "Como ato final da conquista do Império Mongol, a Ordem Teutônica trouxe por completo tanto o império oriental quanto o ocidental ao seu próprio governo. Os povos da estepe se rendem, e uma nova ordem é imposta sob o poder da cruz. Não é fusão, mas pura conclusão da conquista — a ordem permanece ordem e tornou-se senhora do maior império da terra."
 teu_events.80.a: "Pela vontade de Deus, o mundo é nosso!"
 STATIC_MODIFIER_NAME_teu_mongol_empire_mod: "Subjugação dos Mongóis"
 STATIC_MODIFIER_DESC_teu_mongol_empire_mod: "A máquina de guerra do Império Mongol capturada — os cavaleiros da estepe servem agora sob comando cruzado."
 STATIC_MODIFIER_NAME_teu_sacred_nomads_mod: "O Trono do Grande Cã"
 STATIC_MODIFIER_DESC_teu_sacred_nomads_mod: "Governando como senhor do que outrora foi um império mundial — os mongóis plenamente subjugados à Ordem Teutônica."
 teu_great_khan_name: "Grão-Canato Alemão"
 teu_events.11.t: "O Voto da Cruzada do Norte"
 teu_events.11.d: "A porta para o Leste aberta — com a Lituânia e a Polônia subjugadas, chegou a hora de a Ordem Teutônica tomar uma decisão histórica. Cada cavaleiro jura diante da autoridade do Grão-Mestre: “Pela vontade de Deus destruiremos os pagãos e ortodoxos do Leste e completaremos a Cruzada do Norte”. Esse voto torna-se o princípio governante do Estado da Ordem Teutônica, e quanto maior sua legitimidade, maior sua disciplina e ordem."
 teu_events.11.a: "Juramos — pela vontade de Deus, complete a Cruzada do Norte!"
 teu_steppe_crusade: "A Cruzada da Estepe"
 teu_steppe_crusade_desc: "A estepe pôntica — outrora coração do Império Mongol, ilimitado pasto, governado pelos tártaros. Agora, com a cavalaria pesada da Ordem Teutônica, fundida com a cavalaria leve ao estilo mongol, conquiste essa estepe e estabeleça a supremacia sobre toda a Europa Oriental. Quem governa a estepe governa a Europa Oriental — prove essa verdade com a força da Ordem Teutônica."
 STATIC_MODIFIER_NAME_teu_steppe_crusade_mod: "A Cruzada da Estepe"
 STATIC_MODIFIER_DESC_teu_steppe_crusade_mod: "Os irmãos-cavaleiros montados, que cavalgam pelos ventos da estepe, fizeram seus até os caminhos da guerra dos nômades."
 STATIC_MODIFIER_NAME_teu_crusade_loot_mod: "Pilhagem Cruzada"
 STATIC_MODIFIER_DESC_teu_crusade_loot_mod: "A pilhagem da cruzada esgotou a terra: os campos jazem em pousio, as aldeias estão vazias, e o povo aguarda dias melhores."
