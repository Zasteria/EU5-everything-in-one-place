l_braz_por:
 mon_montferrat_mission_pack: "As Ambições dos Paleólogos e o Senhor da Itália"
 mon_montferrat_mission_pack_DESCRIPTION:0 "Em 1337, o Marquesado de Monferrato é governado por um senhor em cujas veias corre o sangue da dinastia bizantina dos Paleólogos. Reivindique Salonica e marche rumo ao leste, a Constantinopla, ou forje um império no norte da Itália pela diplomacia e pela espada do condottiere — duas ambições ardem num só soberano."
 mon_montferrat_mission_pack_CRITERIA_DESCRIPTION:0 "O sonho oriental ou o domínio ocidental — o sangue dos Paleólogos abre os dois caminhos."
 mon_montferrat_mission_pack_BUTTON_TOOLTIP:0 "Use o sangue dos Paleólogos para conquistar a Itália e a Grécia."
 mon_montferrat_mission_pack_BUTTON_DETAILS:0 "De Salonica a Atenas sob o nome dos Paleólogos, de Casale a Gênova com aço e moeda — conquiste o Oriente e o Ocidente!"
 mon_palaiologos_ambition: "A Ambição dos Paleólogos"
 mon_palaiologos_ambition_desc: "O governante de Monferrato carrega o sangue dos Paleólogos. Duas ambições ardem: para o leste, rumo a Salonica, ou para o oeste, rumo ao domínio italiano."
 mon_claim_thessaloniki: "Reivindique Salonica"
 mon_claim_thessaloniki_desc: "Reivindique Salonica — outrora a segunda cidade de Bizâncio — como cabeça de ponte para as ambições orientais."
 mon_seize_thessaloniki: "Tome Salonica"
 mon_seize_thessaloniki_desc: "Tome Salonica e fixe o estandarte dos Paleólogos na Torre Branca."
 mon_conquer_macedonia: "Conquista da Macedônia"
 mon_conquer_macedonia_desc: "Conquiste a Macedônia — porta da Grécia e pátria de Alexandre, o Grande."
 mon_northern_greece: "Norte da Grécia"
 mon_northern_greece_desc: "Assegure o norte da Grécia como base para nova expansão."
 mon_conquer_morea: "Conquista da Moreia"
 mon_conquer_morea_desc: "Conquiste a Moreia e Atenas — coração da antiga civilização grega."
 mon_aegean_control: "Domine o Mar Egeu"
 mon_aegean_control_desc: "Tome as ilhas egeias para ampliar o alcance marítimo de Monferrato."
 mon_new_byzantium: "O Novo Bizâncio"
 mon_new_byzantium_desc: "Reivindique a herança bizantina e seja reconhecido como sucessor de Roma Oriental."
 mon_secure_piedmont: "Assegure o Piemonte"
 mon_secure_piedmont_desc: "Assegure o Piemonte como base da dominação norte-italiana."
 mon_casale_capital: "Casale Monferrato"
 mon_casale_capital_desc: "Desenvolva Casale Monferrato numa capital digna do Marquesado."
 mon_rival_savoy: "A Rival Saboia"
 mon_rival_savoy_desc: "Oponha-se a Saboia — rival pela dominação piemontesa — e estabeleça a supremacia."
 mon_control_lombardy: "Domine a Lombardia"
 mon_control_lombardy_desc: "Conquiste a Lombardia — coração do norte da Itália."
 mon_seize_genoa: "Tome Gênova"
 mon_seize_genoa_desc: "Tome Gênova — La Superba — e obtenha acesso ao comércio mediterrâneo."
 mon_north_italy_trade: "Império Comercial Norte-Italiano"
 mon_north_italy_trade_desc: "Construa um império comercial, que abarque a Lombardia, a Ligúria e o Vêneto."
 mon_emilia: "Conquista da Emília"
 mon_emilia_desc: "Conquiste a fértil margem sul do vale do Pó — Bolonha, Parma e Módena."
 mon_king_of_italy: "Rei da Itália"
 mon_king_of_italy_desc: "Proclame o Rei da Itália após unificar a Lombardia, a Ligúria e a Emília."
 mon_hre_relations: "Relações com o Sacro Império"
 mon_hre_relations_desc: "Determine as relações com o Sacro Império Romano — aliado, rival ou líder."
 mon_dev_casale: "Casale — Cidade do Saber e da Riqueza"
 mon_dev_casale_desc: "Transforme Casale numa cidade de saber e riqueza, onde se encontram o Renascimento e a herança bizantina."
 mon_renaissance_court: "A Corte Renascentista"
 mon_renaissance_court_desc: "Crie uma corte renascentista, onde se fundem o saber clássico bizantino e a inovação artística italiana."
 mon_mercenary_tradition: "A Tradição dos Condottieri"
 mon_mercenary_tradition_desc: "Construa a tradição dos condottieri — a herança militar mercenária de Monferrato."
 mon_papal_alliance: "Aliança Papal"
 mon_papal_alliance_desc: "Alie-se ao papa para legitimar as ambições de Monferrato na Itália."
 mon_tuscany: "Conquista da Toscana"
 mon_tuscany_desc: "Conquiste a Toscana — lar da cultura renascentista dos Médici — e avance rumo a Roma."
 mon_veneto: "Conquista do Vêneto"
 mon_veneto_desc: "Conquiste o Vêneto, incluindo Veneza, para completar a maestria norte-italiana."
 mon_byzantine_heritage: "A Herança Bizantina"
 mon_byzantine_heritage_desc: "Reivindique a plena herança bizantina — na cultura grega e na ortodoxia, obtenha maiores recompensas."
 mon_navy_adriatic: "A Frota Adriática"
 mon_navy_adriatic_desc: "Construa uma poderosa frota adriática, que combine o poder naval genovês e veneziano."
 mon_southern_italy: "Sul da Itália"
 mon_southern_italy_desc: "Avance sobre o sul da Itália e tome Nápoles para unificar a Península Itálica."
 mon_marquis_of_italy: "Grande Marquês da Itália"
 mon_marquis_of_italy_desc: "Governe como Grande Marquês da Itália — unindo Oriente e Ocidente, Norte e Sul."
 mon_new_roman_empire: "O Novo Império Romano"
 mon_new_roman_empire_desc: "Proclame o Novo Império Romano — sucessor tanto de Roma Oriental quanto da Ocidental."
 mon_events.10.t: "A Tomada de Salonica — O Estandarte dos Paleólogos sobre a Torre Branca"
 mon_events.10.d: "Salonica — outrora a segunda cidade do Império Bizantino, cai agora diante de Monferrato. O governante, com sangue paleólogo, começa a realizar as ambições orientais. Os sinos da Torre Branca dobram — uma nova era começou."
 mon_events.10.a: "Viva Salonica! Sob o estandarte dos Paleólogos!"
 mon_events.20.t: "Rei da Itália — Triunfo de Casale à Cidade Santa"
 mon_events.20.d: "“Rei da Itália” — Monferrato, tendo unificado a Lombardia, a Ligúria e a Emília, é proclamado novo senhor da Península Itálica. Os vivas ressoam na corte de Casale."
 mon_events.20.a: "Viva o Rei da Itália!"
 mon_events.50.t: "Nascimento do Novo Bizâncio — O Sonho dos Paleólogos Realizado"
 mon_events.50.d: "“Imperador Paleólogo — sucessor de Roma e Constantinopla” — Monferrato herda o nome bizantino. A jornada, de pequeno marquesado do norte da Itália, iniciou seu caminho rumo à maestria no Mediterrâneo oriental."
 mon_events.50.a: "Viva o Imperador Paleólogo! Viva o Novo Bizâncio!"
 mon_events.60.t: "Grande Marquês da Itália — Governo na Encruzilhada de Oriente e Ocidente"
 mon_events.60.d: "De Casale Monferrato a Gênova, Florença, Nápoles — o Império de Monferrato nasceu. Arte renascentista, espírito bizantino, espada de condottiere — três potências fundidas para criar o senhor da Itália."
 mon_events.60.a: "Viva o Grande Marquês da Itália!"
 mon_events.99.t: "O Novo Império Romano — Unificador de Oriente e Ocidente"
 mon_events.99.d: "“Imperador Paleólogo — sucessor de Roma Oriental e Ocidental, Rei da Itália, Senhor da Grécia” — esse título ecoa por todo o mundo mediterrâneo. A ambição que brotou na pequena corte de Casale em 1337 culmina agora na construção de um império mundial. O nome de Roma restaurado."
 mon_events.99.a: "Viva o Novo Império Romano! Viva a glória eterna!"
 STATIC_MODIFIER_NAME_mon_palaiologos_mod: "Os Paleólogos"
 STATIC_MODIFIER_DESC_mon_palaiologos_mod: "A linhagem dos Paleólogos desperta as ambições de Monferrato sobre o Oriente e o Ocidente."
 STATIC_MODIFIER_NAME_mon_thessaloniki_claim_mod: "Reivindicação a Salonica"
 STATIC_MODIFIER_DESC_mon_thessaloniki_claim_mod: "Salonica seduz — o estandarte dos Paleólogos logo tremulará sobre o Mar Egeu."
 STATIC_MODIFIER_NAME_mon_macedonia_mod: "Macedônia"
 STATIC_MODIFIER_DESC_mon_macedonia_mod: "Macedônia conquistada — porta da Grécia e pátria de Alexandre, o Grande."
 STATIC_MODIFIER_NAME_mon_northern_greece_mod: "Norte da Grécia"
 STATIC_MODIFIER_DESC_mon_northern_greece_mod: "Norte da Grécia assegurado como base para nova expansão rumo ao sul."
 STATIC_MODIFIER_NAME_mon_morea_mod: "Moreia"
 STATIC_MODIFIER_DESC_mon_morea_mod: "Moreia e Atenas conquistadas — o coração da antiga civilização grega restaurado."
 STATIC_MODIFIER_NAME_mon_aegean_mod: "Mar Egeu"
 STATIC_MODIFIER_DESC_mon_aegean_mod: "Ilhas egeias tomadas, ampliando o alcance marítimo de Monferrato rumo ao Mediterrâneo."
 STATIC_MODIFIER_NAME_mon_piedmont_mod: "Piemonte"
 STATIC_MODIFIER_DESC_mon_piedmont_mod: "Piemonte assegurado — a leva do norte da Itália marcha agora sob o estandarte de Monferrato."
 STATIC_MODIFIER_NAME_mon_casale_mod: "Casale"
 STATIC_MODIFIER_DESC_mon_casale_mod: "Casale Monferrato pulsa como coração comercial do Marquesado."
 STATIC_MODIFIER_NAME_mon_savoy_mod: "Saboia"
 STATIC_MODIFIER_DESC_mon_savoy_mod: "Saboia — rival pela dominação piemontesa — contraposta e suprimida."
 STATIC_MODIFIER_NAME_mon_lombardy_mod: "Lombardia"
 STATIC_MODIFIER_DESC_mon_lombardy_mod: "A Lombardia — coração do norte da Itália — cai sob controle de Monferrato."
 STATIC_MODIFIER_NAME_mon_genoa_mod: "Gênova"
 STATIC_MODIFIER_DESC_mon_genoa_mod: "La Superba Gênova tomada — as portas do comércio mediterrâneo se abrem."
 STATIC_MODIFIER_NAME_mon_trade_mod: "Comércio"
 STATIC_MODIFIER_DESC_mon_trade_mod: "Império comercial, que abarca a Lombardia, a Ligúria e o Vêneto, construído."
 STATIC_MODIFIER_NAME_mon_emilia_mod: "Emília"
 STATIC_MODIFIER_DESC_mon_emilia_mod: "A fértil margem sul do vale do Pó — Bolonha, Parma, Módena — conquistada."
 STATIC_MODIFIER_NAME_mon_hre_mod: "Sacro Império"
 STATIC_MODIFIER_DESC_mon_hre_mod: "Relações com o Sacro Império Romano determinadas — Monferrato ganha posição diplomática."
 STATIC_MODIFIER_NAME_mon_casale_dev_mod: "Desenvolvimento de Casale"
 STATIC_MODIFIER_DESC_mon_casale_dev_mod: "Casale entra em sua era de ouro de saber e riqueza — farol cultural do norte da Itália."
 STATIC_MODIFIER_NAME_mon_renaissance_mod: "Renascimento"
 STATIC_MODIFIER_DESC_mon_renaissance_mod: "Corte renascentista criada — o saber clássico bizantino funde-se com a inovação artística italiana."
 STATIC_MODIFIER_NAME_mon_condottieri_mod: "Condottieri"
 STATIC_MODIFIER_DESC_mon_condottieri_mod: "Os condottieri de Monferrato tornaram-se lenda — soldados de elite reúnem-se sob seus estandartes e dominaram os campos de batalha da Itália."
 STATIC_MODIFIER_NAME_mon_papal_mod: "Papal"
 STATIC_MODIFIER_DESC_mon_papal_mod: "A bênção do papa legitima as ambições de Monferrato em toda a Península Itálica."
 STATIC_MODIFIER_NAME_mon_tuscany_mod: "Toscana"
 STATIC_MODIFIER_DESC_mon_tuscany_mod: "Toscana — lar da cultura renascentista dos Médici — conquistada e assegurada."
 STATIC_MODIFIER_NAME_mon_veneto_mod: "Vêneto"
 STATIC_MODIFIER_DESC_mon_veneto_mod: "Vêneto, incluindo Veneza, conquistado — maestria norte-italiana concluída."
 STATIC_MODIFIER_NAME_mon_heritage_mod: "Herança"
 STATIC_MODIFIER_DESC_mon_heritage_mod: "Plena herança bizantina reivindicada — burocracia, aquedutos e legitimidade fluem da Roma antiga."
 STATIC_MODIFIER_NAME_mon_navy_mod: "Frota"
 STATIC_MODIFIER_DESC_mon_navy_mod: "Poderosa frota adriática, que combina o poder naval genovês e veneziano, construída."
 STATIC_MODIFIER_NAME_mon_southern_italy_mod: "Sul da Itália"
 STATIC_MODIFIER_DESC_mon_southern_italy_mod: "Sul da Itália e Nápoles tomados — a Península Itálica unida sob um só estandarte."
 STATIC_MODIFIER_NAME_mon_marquis_final_mod: "Final do Marquês"
 STATIC_MODIFIER_DESC_mon_marquis_final_mod: "O Grande Marquês da Itália governa — unindo Oriente e Ocidente, Norte e Sul."
 STATIC_MODIFIER_NAME_mon_new_roman_mod: "Nova Roma"
 STATIC_MODIFIER_DESC_mon_new_roman_mod: "Novo Império Romano proclamado — sucessor tanto de Roma Oriental quanto da Ocidental."
 mon_carta_di_franchigia: "Carta di Franchigia"
 mon_carta_di_franchigia_desc: "Carta di Franchigia — “Carta de Liberdade”. O marquês de Monferrato concede autonomia e privilégios a cada cidade, criando terreno fértil para que mercadores, camponeses e cidadãos prosperem. Assim como Casale outrora floresceu sob tal carta, todo o marquesado se beneficiará de suas bênçãos."
 mon_carta_di_franchigia_unlock_tt: "O privilégio urbano “Carta di Franchigia” torna-se disponível."
 mon_acqui_terme: "Desenvolva Acqui Terme"
 mon_acqui_terme_desc: "Acqui Terme — famosa como “cidade das águas termais” desde os tempos da Roma antiga. Restaure suas célebres águas. As fontes curativas, outrora visitadas por imperadores romanos, tornar-se-ão o novo orgulho de Monferrato, renascidas como cidade da saúde, que atrai visitantes de longe."
 STATIC_MODIFIER_NAME_mon_acqui_terme_mod: "Acqui Terme Renovada"
 STATIC_MODIFIER_DESC_mon_acqui_terme_mod: "Antigas termas romanas renovadas — Acqui renascida como cidade da saúde e da prosperidade."
 STATIC_MODIFIER_NAME_mon_heritage_basic_mod: "A Luz Esmaecente de Bizâncio"
 STATIC_MODIFIER_DESC_mon_heritage_basic_mod: "A herança bizantina ilumina Monferrato — sua legitimidade começa em silêncio a crescer."
 STATIC_MODIFIER_NAME_mon_new_byzantium_mod: "A Majestade do Novo Bizâncio"
 STATIC_MODIFIER_DESC_mon_new_byzantium_mod: "O sonho dos Paleólogos realizado — administração imperial, poder naval e redes viárias cristalizados como força de Monferrato."
