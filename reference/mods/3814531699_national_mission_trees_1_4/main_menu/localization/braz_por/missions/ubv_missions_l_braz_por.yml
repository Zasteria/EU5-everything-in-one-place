l_braz_por:
 ubv_oberbayern_mission_pack: "Legado de Munique — o caminho da unificação da Baviera"
 ubv_oberbayern_mission_pack_DESCRIPTION:0 "Como casa de Munique, descendente do imperador Luís IV, reunifique as terras divididas da Baviera num só todo."
 ubv_oberbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Desenvolva Munique e una a Baviera."
 ubv_oberbayern_mission_pack_BUTTON_TOOLTIP:0 "Desenvolva Munique e una a Baviera."
 ubv_oberbayern_mission_pack_BUTTON_DETAILS:0 "Erga-se como duque de toda a Baviera!"
 ubv_wittelsbach_legacy: "Legado dos Wittelsbach"
 ubv_wittelsbach_legacy_desc: "O ducado da Baviera, dividido pelo Tratado de Pavia de 1329 — como ramo de Munique, descendente do imperador Luís IV, herde esse legado."
 ubv_secure_munich: "Desenvolva Munique"
 ubv_secure_munich_desc: "Munique, no Isar — desenvolva essa cidade, tão querida pelo imperador Luís IV, como centro do ducado."
 ubv_salt_trade: "Comércio do Sal"
 ubv_salt_trade_desc: "O sal, chamado de “ouro branco” — tome as minas de sal de Reichenhall e garanta a riqueza desse valioso recurso."
 ubv_imperial_relations: "Relações com o Império"
 ubv_imperial_relations_desc: "O trono imperial, um dia ocupado por Luís IV — faça de nossas relações com o Sacro Império Romano algo digno dessa memória gloriosa."
 ubv_bavarian_ambition: "Reivindicação de uma Só Baviera"
 ubv_bavarian_ambition_desc: "Desenvolvimento de Munique, comércio do sal e relações com o Império — construa sobre isso e cultive a reivindicação a toda a Baviera."
 ubv_reunite_bavaria: "Reunifique a Baviera"
 ubv_reunite_bavaria_desc: "O ducado dividido — recupere as terras da Baixa Baviera e reunifique a Baviera num só todo."
 ubv_duke_of_all_bavaria: "Duque de Toda a Baviera"
 ubv_duke_of_all_bavaria_desc: "Sob a casa de Munique, toda a Baviera está finalmente unida sob um só estandarte."
 ubv_events.1.t: "Proclamação da Unidade da Baviera"
 ubv_events.1.d: "Sob a casa de Munique, a Baviera está finalmente unida num só todo. A era das divisões chega ao fim."
 ubv_events.1.a: "Glória à Baviera!"
 STATIC_MODIFIER_NAME_ubv_legacy_mod: "Legado dos Wittelsbach"
 STATIC_MODIFIER_DESC_ubv_legacy_mod: "O sangue de Luís IV, que um dia usou a coroa imperial, continua sendo um nome guardado com orgulho no coração de cada cortesão."
 STATIC_MODIFIER_NAME_ubv_munich_mod: "Munique Desenvolvida"
 STATIC_MODIFIER_DESC_ubv_munich_mod: "A cidade às margens do Isar floresce como centro do ducado."
 STATIC_MODIFIER_NAME_ubv_salt_mod: "Comércio do Sal"
 STATIC_MODIFIER_DESC_ubv_salt_mod: "Carroças carregadas de “ouro branco” das minas de sal de Reichenhall rolam sem cessar rumo aos mercados de Munique."
 STATIC_MODIFIER_NAME_ubv_imperial_mod: "Relações com o Império"
 STATIC_MODIFIER_DESC_ubv_imperial_mod: "Os laços com a corte imperial, outrora presidida por Luís IV, ainda mantêm enviados indo e vindo."
 STATIC_MODIFIER_NAME_ubv_reunite_mod: "Baviera Reunificada"
 STATIC_MODIFIER_DESC_ubv_reunite_mod: "Os vassalos dos dois ramos antes divididos prestam agora juramento sob um único estandarte."
 STATIC_MODIFIER_NAME_ubv_unify_bavaria_mod: "Duque de Toda a Baviera"
 STATIC_MODIFIER_DESC_ubv_unify_bavaria_mod: "Os sinos das torres bávaras repicam, proclamando o fim das divisões."
 ubv_unified_duchy: "Ducado Unificado da Baviera"
 ubv_unified_duchy_desc: "A era das divisões acabou — como ducado unificado da Baviera, abra uma nova era."
 ubv_bavaria_unified_tt: "Unificou a Baviera"
 ubv_landrecht: "Direito Territorial da Baviera"
 ubv_landrecht_desc: "Uma lei uniforme para o ducado unificado — introduza o código de leis bávaro (Landrecht) e fortaleça o alicerce do governo."
 ubv_tyrol_ambition: "Ambições sobre o Tirol"
 ubv_tyrol_ambition_desc: "O condado do Tirol, escondido no abraço dos Alpes — nutra ambições sobre essa terra."
 ubv_swabian_expansion: "Expansão na Suábia"
 ubv_swabian_expansion_desc: "A Suábia, que se estende ao sudoeste — reforce nossa influência sobre essa região."
 ubv_greater_bavaria: "Realize a Grande Baviera"
 ubv_greater_bavaria_desc: "Código de leis, Tirol e Suábia — construa sobre isso e realize a Grande Baviera."
 ubv_counter_reformation_leader: "Líder da Contrarreforma"
 ubv_counter_reformation_leader_desc: "Encarne o espírito do Concílio de Trento e assuma a liderança da Contrarreforma."
 ubv_electoral_dignity: "Dignidade Eleitoral"
 ubv_electoral_dignity_desc: "Em 1623 Maximiliano I conquista enfim o posto de eleitor — faça dessa honra o orgulho eterno da Baviera."
 ubv_austrian_rivalry: "Rivalidade com a Áustria"
 ubv_austrian_rivalry_desc: "A rivalidade com a casa de Habsburgo pela hegemonia no Império — aceite esse desafio de nosso grande rival."
 ubv_war_of_austrian_succession: "Guerra de Sucessão Austríaca"
 ubv_war_of_austrian_succession_desc: "A guerra pela reivindicação de Carlos VII ao trono imperial — aproveite essa guerra de sucessão para elevar o prestígio da Baviera."
 ubv_imperial_crown: "Coroa Imperial"
 ubv_imperial_crown_desc: "Em 1742 Carlos VII, duque da Baviera, é coroado Imperador do Sacro Império Romano — o primeiro não Habsburgo a portar a coroa em séculos."
 ubv_enlightened_absolutism: "Absolutismo Esclarecido"
 ubv_enlightened_absolutism_desc: "A era do Iluminismo, que venera a razão e a ciência — introduza essa nova corrente de pensamento no governo da Baviera."
 ubv_napoleonic_alliance: "Desafio à França"
 ubv_napoleonic_alliance_desc: "A Europa, abalada pela revolução e pela ambição de Napoleão — a Baviera reforça sua reivindicação ao trono desse poderoso vizinho e abre o próprio caminho."
 ubv_kingdom_of_bavaria: "Proclamação do Reino da Baviera"
 ubv_kingdom_of_bavaria_desc: "Em 1806 o eleitor Maximiliano IV José se proclama rei da Baviera — a longa história da casa de Wittelsbach atinge aqui um novo auge."
 ubv_events.3.t: "Coroa Imperial"
 ubv_events.3.d: "Em 1742 Carlos VII, duque da Baviera, foi coroado Imperador do Sacro Império Romano na catedral de Frankfurt. Haviam-se passado séculos desde que alguém que não fosse Habsburgo portara a coroa imperial."
 ubv_events.3.a: "Glória à Sua Majestade Imperial!"
 ubv_events.99.t: "Proclamação do Reino da Baviera"
 ubv_events.99.d: "Em 1806 o eleitor Maximiliano IV José, sob o abrigo da Confederação do Reno, proclamou-se rei da Baviera. A longa história da casa de Wittelsbach atinge aqui um novo auge."
 ubv_events.99.a: "Viva o Reino da Baviera!"
 STATIC_MODIFIER_NAME_ubv_unified_mod: "Ducado Unificado da Baviera"
 STATIC_MODIFIER_DESC_ubv_unified_mod: "O ducado já não precisa dividir suas cortes, rendas e guerreiros entre ramos rivais."
 STATIC_MODIFIER_NAME_ubv_greater_mod: "A Grande Baviera Realizada"
 STATIC_MODIFIER_DESC_ubv_greater_mod: "Do sopé dos Alpes às colinas da Suábia, as terras sob o estandarte ducal se ampliam a cada estação."
 STATIC_MODIFIER_NAME_ubv_counter_reformation_mod: "Líder da Contrarreforma"
 STATIC_MODIFIER_DESC_ubv_counter_reformation_mod: "No espírito do Concílio de Trento, os colégios jesuítas se abrem um após o outro nas cidades do ducado."
 STATIC_MODIFIER_NAME_ubv_succession_war_mod: "Guerra de Sucessão Austríaca"
 STATIC_MODIFIER_DESC_ubv_succession_war_mod: "Oficiais e soldados temperados nos campos de batalha da Guerra de Sucessão Austríaca formam agora o núcleo do exército ducal."
 STATIC_MODIFIER_NAME_ubv_imperial_crown_mod: "Coroa Imperial"
 STATIC_MODIFIER_DESC_ubv_imperial_crown_mod: "A memória do dia em que o duque da Baviera foi coroado na catedral de Frankfurt é guardada com orgulho no coração de cada cortesão."
 STATIC_MODIFIER_NAME_ubv_enlightenment_mod: "Absolutismo Esclarecido"
 STATIC_MODIFIER_DESC_ubv_enlightenment_mod: "Na corte, os novos livros que chegam da França difundem os ideais do Iluminismo, e o número de escolas cresce a cada ano."
 STATIC_MODIFIER_NAME_ubv_electoral_dignity_mod: "Dignidade Eleitoral"
 STATIC_MODIFIER_DESC_ubv_electoral_dignity_mod: "Quando o duque, vestido com o manto de eleitor, toma seu lugar nas eleições imperiais, os príncipes escutam com atenção suas palavras."
 STATIC_MODIFIER_NAME_ubv_kingdom_mod: "Reino da Baviera"
 STATIC_MODIFIER_DESC_ubv_kingdom_mod: "No palácio de Munique troam as salvas que celebram a coroação do primeiro rei da Baviera da casa de Wittelsbach."
