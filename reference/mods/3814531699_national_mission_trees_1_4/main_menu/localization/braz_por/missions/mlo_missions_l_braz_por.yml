l_braz_por:
 mlo_biscione_mission_pack: "O Legado do Biscione"
 mlo_biscione_mission_pack_DESCRIPTION:0 "O Biscione, a serpente que devora um homem, adorna o brasão dos Visconti. Outrora apenas uma das muitas cidades-Estado da Lombardia, o Ducado de Milão forja agora seu próprio caminho na intrincada luta pela supremacia no norte da Itália. Pelo desenvolvimento do governo e da cultura, pela elevação ao posto de potência líder do Norte, ou pela manutenção da posição entre as grandes potências do papa, do imperador e da França — a escolha de que legado erguer cabe ao duque."
 mlo_biscione_mission_pack_CRITERIA_DESCRIPTION:0 "Conclua as missões como Ducado de Milão e estabeleça uma posição dominante no norte da Itália."
 mlo_biscione_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para herdar o legado do Biscione."
 mlo_biscione_mission_pack_BUTTON_DETAILS:0 "De cidade-Estado da Lombardia ao coração da Itália!"
 mlo_expanded_domain: "Domínio Ampliado"
 mlo_expanded_domain_desc: "O Ducado de Milão incorporou as cidades da Lombardia e ampliou muito seu território."
 mlo_curb_della_scala: "Contenha os della Scala"
 mlo_curb_della_scala_desc: "A crescente hegemonia dos della Scala, senhores de Verona, sobre o norte da Itália deve ser contida."
 mlo_imperial_vicariate: "O Vicariato Imperial"
 mlo_imperial_vicariate_desc: "Honrado com o título de vigário imperial pelo imperador do Sacro Império Romano, o governo de Milão leva agora a legitimidade do Império."
 mlo_serpent_that_devours_men: "A Serpente que Devora Homens"
 mlo_serpent_that_devours_men_desc: "O Biscione, a serpente que devora um homem, adorna o brasão dos Visconti. A lenda personifica o poder da família e proclama uma nova era para Milão."
 mlo_state_led_enterprises: "Empreendimentos Estatais"
 mlo_state_led_enterprises_desc: "O Ducado de Milão promove, sob direção estatal, o desenvolvimento de suas instituições e de sua cultura."
 mlo_rigorous_plague_policy: "Rigorosa Política contra a Peste"
 mlo_rigorous_plague_policy_desc: "Diante da peste, deve ser erguido um cuidadoso sistema de quarentena e isolamento, para proteger o povo do ducado."
 mlo_duomo_di_milano: "A Catedral de Milão"
 mlo_duomo_di_milano_desc: "Avance a construção da Catedral de Milão e deixe a magnificência do ducado alcançar o céu."
 mlo_road_network_of_the_realm: "A Rede Viária do Reino"
 mlo_road_network_of_the_realm_desc: "Desenvolva a rede viária que liga todo o ducado e reanime o movimento de pessoas e mercadorias."
 mlo_expand_administrative_buildings: "Amplie os Edifícios Administrativos"
 mlo_expand_administrative_buildings_desc: "Aprendendo com as lições da política contra a peste, amplie ainda mais as instituições administrativas do ducado."
 mlo_embrace_the_renaissance: "Abrace o Renascimento"
 mlo_embrace_the_renaissance_desc: "Ao lado da construção da catedral, a corte milanesa abraça o novo espírito do Renascimento."
 mlo_the_last_supper: "A Última Ceia"
 mlo_the_last_supper_desc: "Encomende a Leonardo da Vinci a pintura da Última Ceia e faça de Milão uma cidade das artes."
 mlo_naviglio_grande_renovation: "Renovação do Naviglio Grande"
 mlo_naviglio_grande_renovation_desc: "Renove o Naviglio Grande, canal que liga Milão à região circundante, e reanime o comércio e a agricultura."
 mlo_castello_sforzesco: "O Castello Sforzesco"
 mlo_castello_sforzesco_desc: "Amplie o Castello Sforzesco, símbolo da magnificência ducal, como sede do governo milanês."
 mlo_biblioteca_ambrosiana: "A Biblioteca Ambrosiana"
 mlo_biblioteca_ambrosiana_desc: "Erga a Biblioteca Ambrosiana para abrigar o saber acumulado dos séculos e sustentar o aprendizado."
 mlo_heart_of_italy: "Cidade Digna de Ser o Coração da Itália"
 mlo_heart_of_italy_desc: "Com governo, ofícios, arte e saber, todos florescendo por igual, Milão tornou-se cidade digna de ser o coração da Itália."
 mlo_north_italian_ambitions: "Ambições no Norte da Itália"
 mlo_north_italian_ambitions_desc: "O Ducado de Milão põe seus exércitos em movimento para assegurar a supremacia sobre todo o norte da Itália."
 mlo_subjugate_lombardy: "Subjugue a Lombardia"
 mlo_subjugate_lombardy_desc: "Traga as cidades da Lombardia ao pleno controle e assegure a base do ducado."
 mlo_advance_into_piedmont: "Avance sobre o Piemonte"
 mlo_advance_into_piedmont_desc: "Amplie a influência para o oeste, rumo ao Piemonte, e oponha-se ao poder da casa de Saboia."
 mlo_strife_over_veneto: "Disputa pelo Vêneto"
 mlo_strife_over_veneto_desc: "O conflito com Veneza e outras potências pelo controle do Vêneto é inevitável."
 mlo_through_emilia_and_beyond: "Pela Emília e Além"
 mlo_through_emilia_and_beyond_desc: "Passe pela Emília e abra o caminho para a expansão rumo ao sul."
 mlo_secure_liguria: "Assegure a Ligúria"
 mlo_secure_liguria_desc: "Assegure a Ligúria, incluindo Gênova, e obtenha uma cabeça de ponte no Mediterrâneo."
 mlo_reach_the_coveted_sea: "Alcance o Mar Cobiçado"
 mlo_reach_the_coveted_sea_desc: "Milão, outrora Estado terrestre, assegura enfim acesso direto ao Mediterrâneo."
 mlo_topple_the_old_rival_florence: "Derrube a Antiga Rival Florença"
 mlo_topple_the_old_rival_florence_desc: "Derrote a antiga rival Florença e estabeleça influência sobre a Toscana."
 mlo_between_two_authorities: "Entre Duas Autoridades"
 mlo_between_two_authorities_desc: "Milão busca seu próprio caminho, encravada entre as três grandes potências do papa, do imperador e do rei da França."
 mlo_reconcile_with_the_papacy: "Reconcilie-se com o Papado"
 mlo_reconcile_with_the_papacy_desc: "Melhore as relações com a cúria romana e obtenha sua autoridade como apoio."
 mlo_trust_of_the_emperor: "Conquiste a Confiança do Imperador"
 mlo_trust_of_the_emperor_desc: "Conquiste a confiança do imperador do Sacro Império Romano e eleve o prestígio do ducado dentro do Império."
 mlo_overture_to_france: "Aproximação com a França"
 mlo_overture_to_france_desc: "Construa laços diplomáticos com o Reino da França e assegure novas oportunidades."
 mlo_the_italian_wars: "As Guerras Italianas"
 mlo_the_italian_wars_desc: "Milão arrastada às Guerras Italianas, onde colidem os interesses do papa, do imperador e da França."
 mlo_isolate_papal_authority: "Isole a Autoridade Papal"
 mlo_isolate_papal_authority_desc: "Tendo sobrevivido às Guerras Italianas, separe a autoridade secular do papa da política milanesa."
 mlo_deny_imperial_authority: "Negue a Autoridade Imperial"
 mlo_deny_imperial_authority_desc: "Tendo sobrevivido às Guerras Italianas, escolha o caminho de governar o ducado sem recorrer à autoridade imperial."
 mlo_repel_french_authority: "Repila a Autoridade Francesa"
 mlo_repel_french_authority_desc: "Tendo sobrevivido às Guerras Italianas, repila a intervenção francesa e preserve a independência do ducado."
 mlo_italian_independence: "Independência Italiana"
 mlo_italian_independence_desc: "Milão assegurou seu posto de potência forte e autônoma na Itália, independente do papa, do imperador ou da França."
 mlo_who_achieves_all_things: "Aquele que Tudo Realiza"
 mlo_who_achieves_all_things_desc: "Tendo alcançado o auge tanto em governo, cultura, território quanto em diplomacia, o duque de Milão é agora digno de chamar-se “aquele que tudo realiza”."
 STATIC_MODIFIER_NAME_mlo_expanded_domain_mod: "Ducado em Crescimento"
 STATIC_MODIFIER_DESC_mlo_expanded_domain_mod: "O rápido crescimento do território do ducado acelerou a difusão do governo e apressou a incorporação das terras recém-conquistadas."
 STATIC_MODIFIER_NAME_mlo_curb_della_scala_mod: "Supremacia sobre os della Scala"
 STATIC_MODIFIER_DESC_mlo_curb_della_scala_mod: "Agora que a influência dos della Scala no norte da Itália está contida, o prestígio diplomático do ducado aumentou."
 STATIC_MODIFIER_NAME_mlo_state_led_enterprises_mod: "Aparato Estatal Refinado"
 STATIC_MODIFIER_DESC_mlo_state_led_enterprises_mod: "Os Visconti e os Sforza distinguiram-se por extensas obras públicas estatais. A Certosa di Pavia, o Castello Sforzesco de Milão, a rede de canais Naviglio Grande — tudo isso foram grandes projetos de construção, impulsionados pelo poder público."
 STATIC_MODIFIER_NAME_mlo_rigorous_plague_policy_mod: "Sistema de Quarentena Estabelecido"
 STATIC_MODIFIER_DESC_mlo_rigorous_plague_policy_mod: "Hospitais, erguidos por todo o ducado, reforçaram a resistência nacional à doença."
 STATIC_MODIFIER_NAME_mlo_duomo_di_milano_mod: "A Grandeza da Catedral"
 STATIC_MODIFIER_DESC_mlo_duomo_di_milano_mod: "A Catedral de Milão concluída reforçou a tradição cultural e a influência do ducado."
 STATIC_MODIFIER_NAME_mlo_road_network_of_the_realm_mod: "Rede Viária Próspera"
 STATIC_MODIFIER_DESC_mlo_road_network_of_the_realm_mod: "A rede viária desenvolvida reanimou o comércio por todo o ducado."
 STATIC_MODIFIER_NAME_mlo_expand_administrative_buildings_mod: "Governo Ampliado"
 STATIC_MODIFIER_DESC_mlo_expand_administrative_buildings_mod: "Os Sforza construíram um poderoso sistema de funcionários. Na chancelaria central de Milão (Cancelleria), reuniam-se hábeis juristas e escribas, e era conhecida pelo mais sofisticado aparato administrativo do norte da Itália."
 STATIC_MODIFIER_NAME_mlo_embrace_the_renaissance_mod: "Corte Renascentista"
 STATIC_MODIFIER_DESC_mlo_embrace_the_renaissance_mod: "A corte de Francesco Sforza e de seu filho Ludovico Sforza (il Moro) tornou-se um grande centro do Renascimento. Ludovico hospedou Leonardo da Vinci por quase vinte anos na corte e reuniu artistas e arquitetos como Bramante."
 STATIC_MODIFIER_NAME_mlo_the_last_supper_mod: "Obra-Prima Imortal"
 STATIC_MODIFIER_DESC_mlo_the_last_supper_mod: "Pintada em 1495-1498 por Leonardo da Vinci na parede do refeitório do convento de Santa Maria delle Grazie, “A Última Ceia” é considerada obra-prima da pintura ocidental pelo uso perfeito da perspectiva e pela representação psicológica de cada figura. Encomendada por Ludovico Sforza, é o legado da corte milanesa em seu auge."
 STATIC_MODIFIER_NAME_mlo_naviglio_grande_renovation_mod: "Benefícios da Rede de Canais"
 STATIC_MODIFIER_DESC_mlo_naviglio_grande_renovation_mod: "O Naviglio Grande renovado acelerou de forma constante a difusão do governo a partir da capital."
 STATIC_MODIFIER_NAME_mlo_biblioteca_ambrosiana_mod: "Saber Próspero"
 STATIC_MODIFIER_DESC_mlo_biblioteca_ambrosiana_mod: "A fundação da Biblioteca Ambrosiana elevou a habilidade dos novos artistas."
 STATIC_MODIFIER_NAME_mlo_heart_of_italy_mod: "Coração da Itália"
 STATIC_MODIFIER_DESC_mlo_heart_of_italy_mod: "Como coração da Itália, Milão atrai gente de todos os cantos, e sua prosperidade é agora constante."
 STATIC_MODIFIER_NAME_mlo_north_italian_ambitions_mod: "Ambições no Norte da Itália"
 STATIC_MODIFIER_DESC_mlo_north_italian_ambitions_mod: "As ambições sobre todo o norte da Itália aceleraram a construção de redes de espionagem."
 STATIC_MODIFIER_NAME_mlo_subjugate_lombardy_mod: "Soberano da Lombardia"
 STATIC_MODIFIER_DESC_mlo_subjugate_lombardy_mod: "O pleno controle sobre a Lombardia elevou o prestígio diplomático do ducado."
 STATIC_MODIFIER_NAME_mlo_advance_into_piedmont_mod: "Cabeça de Ponte no Piemonte"
 STATIC_MODIFIER_DESC_mlo_advance_into_piedmont_mod: "O Piemonte era a esfera da casa de Saboia e antiga rival de Milão. Manter esse corredor estratégico através dos Alpes até a França seria um escudo contra a invasão do oeste. Tanto os Visconti quanto os Sforza tentaram repetidamente avançar sobre a região."
 STATIC_MODIFIER_NAME_mlo_strife_over_veneto_mod: "Honras Militares do Vêneto"
 STATIC_MODIFIER_DESC_mlo_strife_over_veneto_mod: "As honras militares da disputa pelo Vêneto elevaram o prestígio do exército."
 STATIC_MODIFIER_NAME_mlo_through_emilia_and_beyond_mod: "Caminho para o Sul"
 STATIC_MODIFIER_DESC_mlo_through_emilia_and_beyond_mod: "O caminho, aberto além da Emília, sustenta o moral do exército."
 STATIC_MODIFIER_NAME_mlo_secure_liguria_mod: "Comércio da Ligúria"
 STATIC_MODIFIER_DESC_mlo_secure_liguria_mod: "A segurança da Ligúria, incluindo Gênova, reanimou a atividade dos mercadores."
 STATIC_MODIFIER_NAME_mlo_reach_the_coveted_sea_mod: "Porta do Mediterrâneo"
 STATIC_MODIFIER_DESC_mlo_reach_the_coveted_sea_mod: "Agora que o mar cobiçado foi alcançado, a capacidade de abastecimento da frota melhorou."
 STATIC_MODIFIER_NAME_mlo_topple_the_old_rival_florence_mod: "Oeste sobre o Arno"
 STATIC_MODIFIER_DESC_mlo_topple_the_old_rival_florence_mod: "A glória de derrubar a antiga rival Florença elevou a magnificência do ducado."
 STATIC_MODIFIER_NAME_mlo_between_two_authorities_mod: "Diplomacia entre as Potências"
 STATIC_MODIFIER_DESC_mlo_between_two_authorities_mod: "Milão orientou sua diplomacia, mantendo certa distância igual de todas as três autoridades: o imperador do Sacro Império Romano, o papa e o rei da França. Os diplomatas dos Sforza praticavam o conceito de “equilíbrio de poder” e trouxeram ao norte da Itália uma longa paz relativa."
 STATIC_MODIFIER_NAME_mlo_reconcile_with_the_papacy_mod: "Paz com o Papado"
 STATIC_MODIFIER_DESC_mlo_reconcile_with_the_papacy_mod: "A reconciliação com o papado trouxe estabilidade da fé ao ducado."
 STATIC_MODIFIER_NAME_mlo_trust_of_the_emperor_mod: "Confiança do Imperador"
 STATIC_MODIFIER_DESC_mlo_trust_of_the_emperor_mod: "A confiança do imperador elevou o prestígio do ducado dentro do Império."
 STATIC_MODIFIER_NAME_mlo_overture_to_france_mod: "Amizade com a França"
 STATIC_MODIFIER_DESC_mlo_overture_to_france_mod: "Os laços diplomáticos com o Reino da França aprofundaram a amizade entre os dois Estados."
 STATIC_MODIFIER_NAME_mlo_the_italian_wars_mod: "Experiência das Guerras Italianas"
 STATIC_MODIFIER_DESC_mlo_the_italian_wars_mod: "A sobrevivência às Guerras Italianas sustentou a tradição do exército."
 STATIC_MODIFIER_NAME_mlo_isolate_papal_authority_mod: "Independência do Papa"
 STATIC_MODIFIER_DESC_mlo_isolate_papal_authority_mod: "A distância da autoridade secular do papa elevou a tolerância a hereges."
 STATIC_MODIFIER_NAME_mlo_deny_imperial_authority_mod: "Independência do Imperador"
 STATIC_MODIFIER_DESC_mlo_deny_imperial_authority_mod: "Um governo, livre de recorrer à autoridade imperial, trouxe estabilidade ao ducado."
 STATIC_MODIFIER_NAME_mlo_repel_french_authority_mod: "Independência da França"
 STATIC_MODIFIER_DESC_mlo_repel_french_authority_mod: "O repúdio à intervenção francesa elevou o moral do exército."
 STATIC_MODIFIER_NAME_mlo_italian_independence_mod: "Potência Italiana Autônoma"
 STATIC_MODIFIER_DESC_mlo_italian_independence_mod: "O fato de ser independente de qualquer grande potência elevou tanto a magnificência quanto a legitimidade do duque."
 STATIC_MODIFIER_NAME_mlo_who_achieves_all_things_mod: "O Príncipe que Tudo Realiza"
 STATIC_MODIFIER_DESC_mlo_who_achieves_all_things_mod: "“Aquele que tudo realiza” (Chi tutte cose fa) — o lema dos Sforza não era vã ostentação, mas expressão política do ideal renascentista do “homem universal”. Conquistador militar e grande mecenas das artes, legislador e protetor do comércio — o auge do ducado de Milão encarna o auge político do Renascimento italiano."
 mlo_events.1.t: "A Lenda do Biscione"
 mlo_events.1.d: "O brasão dos Visconti traz uma única serpente, que devora um homem — o Biscione. Alguns dizem que lembra um feito nas cruzadas; outros, que simboliza o infiel derrotado. Seja qual for a verdade, o símbolo proclama por todo o norte da Itália que o poder da família e a própria cidade-Estado de Milão já não são assunto de um mero governante local. Diante do duque estendem-se agora muitos caminhos: o do estadista, o do conquistador e o do diplomata, que caminha entre as grandes potências."
 mlo_events.1.a: "Uma nova era chegou a Milão"
 mlo_events.2.t: "Milão em 1337"
 mlo_events.2.d: "Em 1337, Milão é governada conjuntamente por Luchino Visconti e seu irmão, o arcebispo Giovanni Visconti. No tempo de seu antecessor Azzone, o título de vigário imperial foi concedido pelo imperador Luís IV, emprestando assim ao governo de Milão a autoridade do Império. Por todo o norte da Itália, poderosos senhores detêm o poder, rivalizando entre si — os della Scala de Verona, os Gonzaga de Mântua, os d’Este de Ferrara e outros. Com o papa sentado em Avignon e a força do imperador concentrada ao norte dos Alpes, quem conquistar a supremacia sobre a Lombardia decidirá o destino do norte da Itália."
 mlo_events.2.a: "Fundamentos de Milão compreendidos"
 mlo_events.3.t: "A História do Castello Sforzesco"
 mlo_events.3.d: "O castelo de Milão começou como fortaleza construída pelos Visconti, conhecida como Corte dell’Arengo. Quando a linha ducal terminou com a morte de Filippo Maria Visconti em 1447, os cidadãos proclamaram a República Ambrosiana e demoliram a maior parte do castelo, símbolo dos antigos governantes que haviam derrubado. Mas em 1450 Francesco Sforza, que pôs fim ao caos da república e assumiu o título ducal, ordenou reconstruir a fortaleza de novo, ainda mais magnífica que a anterior, para proclamar seu próprio poder. Desde então o Castello Sforzesco permanece como sede do poder ducal em Milão, e seu brilho é inalterado."
 mlo_events.3.a: "O peso dessa história compreendido"
 mlo_castello_sforzesco_building: "O Castello Sforzesco"
 mlo_castello_sforzesco_building_desc: "Fortaleza reconstruída por Francesco Sforza, que se ergue como símbolo do poder ducal em Milão. Quando está na capital, reforça a tradição cultural, a influência cultural e o poder da coroa."
 STATIC_MODIFIER_NAME_mlo_serpent_reward_mod: "O Governo do Biscione"
 STATIC_MODIFIER_DESC_mlo_serpent_reward_mod: "O brasão serpentino dos Visconti (Biscione) — serpente que devora um homem — é símbolo do poder e da ambição de Milão. Segundo a lenda, foi obtido por um antepassado dos Visconti em duelo com um cavaleiro sarraceno. A conclusão da unificação da Itália significa que a serpente enfim devorou toda a terra."
