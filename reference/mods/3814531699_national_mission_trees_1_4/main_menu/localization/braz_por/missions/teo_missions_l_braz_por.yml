l_braz_por:
 teo_theodoro_mission_pack: "O Principado de Teodoro: A Gótia Renascida e o Senhor do Mar Negro"
 teo_theodoro_mission_pack_DESCRIPTION:0 "Em 1337, o principado de Teodoro agarra-se à fortaleza montanhosa de Mangup, na Península da Crimeia. Outrora parte do Império Bizantino, esse principado grego é cercado por tártaros, genoveses e os ascendentes otomanos. Use o gênio mercantil e o valor militar da família Gabras para conquistar o comércio do Mar Negro, reviver o nome da Gótia, recuperar Constantinopla e governar o Império Gótico sobre o Mediterrâneo oriental."
 teo_theodoro_mission_pack_CRITERIA_DESCRIPTION:0 "Domine o Mar Negro, expulse os genoveses, recupere Constantinopla e governe o Império Gótico sobre o Mediterrâneo oriental, o Mar Negro e as estepes."
 teo_theodoro_mission_pack_BUTTON_TOOLTIP:0 "Governe o Império Gótico sobre o Mediterrâneo oriental."
 teo_theodoro_mission_pack_BUTTON_DETAILS:0 "Erga da fortaleza montanhosa de Mangup o Império Gótico, por meio do comércio do Mar Negro, da herança bizantina e da conquista da estepe!"
 teo_rise_of_theodoro: "A Ascensão de Teodoro"
 teo_rise_of_theodoro_desc: "Da fortaleza montanhosa de Mangup começa a ascensão do principado de Teodoro. Cercado por tártaros, genoveses e otomanos, o gênio da família Gabras transformará a crise em oportunidade."
 teo_black_sea_fleet: "A Frota do Mar Negro"
 teo_black_sea_fleet_desc: "O Mar Negro é disputado por Gênova, Veneza, tártaros e otomanos. Construa uma frota para estabelecer o poder teodórico nessas águas vitais."
 teo_build_theodoro_harbor: "O Porto de Teodoro"
 teo_build_theodoro_harbor_desc: "Desenvolva o porto de Teodoro, ao pé de Mangup, para estabelecê-lo como potência marítima do Mar Negro."
 teo_genoese_question: "A Questão Genovesa"
 teo_genoese_question_desc: "A colônia genovesa de Gazária, que governa a partir de Caffa, domina o comércio do Mar Negro. Compre a Gazária como vassalo — ou preserve o tesouro."
 teo_expel_genoese: "Expulse os Genoveses"
 teo_expel_genoese_desc: "Expulse os genoveses da Crimeia e tome suas colônias para estabelecer a supremacia teodórica."
 teo_dominate_crimea: "Domine a Crimeia"
 teo_dominate_crimea_desc: "Expulse todos os rivais da Crimeia e governe como seu único senhor."
 teo_tana_trade: "O Comércio de Tana"
 teo_tana_trade_desc: "Tome o nó comercial de Tana, na foz do Don, para dominar as rotas comerciais do leste."
 teo_black_sea_domination: "Domínio do Mar Negro"
 teo_black_sea_domination_desc: "Estabeleça pleno domínio sobre o Mar Negro, sem deixar rival algum que desafie a autoridade teodórica."
 teo_greek_heritage: "A Herança Grega"
 teo_greek_heritage_desc: "Reforce a fé ortodoxa e a herança cultural bizantina, que sustentam a legitimidade de Teodoro."
 teo_trebizond_relations: "Relações com Trebizonda"
 teo_trebizond_relations_desc: "Determine as relações com o Império dos Comnenos de Trebizonda — ofereça vassalagem ou mantenha a aliança."
 teo_restore_pontus: "Restaure o Ponto"
 teo_restore_pontus_desc: "Conquiste o litoral pôntico e restaure o antigo Reino do Ponto."
 teo_constantinople: "Recupere Constantinopla"
 teo_constantinople_desc: "Recupere a Segunda Roma dos otomanos e restaure a cruz ortodoxa sobre a Hagia Sophia."
 teo_gothia_ascendant: "A Gótia Ascende"
 teo_gothia_ascendant_desc: "Proclame o renascimento da Gótia e seja reconhecido como legítimo herdeiro de Bizâncio."
 teo_aegean_supremacy: "Supremacia no Mar Egeu"
 teo_aegean_supremacy_desc: "Tome as ilhas egeias e o litoral, para estender o poder naval teodórico ao Mediterrâneo."
 teo_balkans: "Conquiste os Bálcãs"
 teo_balkans_desc: "Conquiste os Bálcãs — coração do antigo Império Bizantino — para consolidar o Império Gótico."
 teo_azov_gateway: "A Porta do Mar de Azov"
 teo_azov_gateway_desc: "Domine o Mar de Azov para abrir as rotas comerciais interiores pelo Don e pelo Volga."
 teo_pryazovia: "O Azov Setentrional"
 teo_pryazovia_desc: "Assegure a região do Azov setentrional, ao norte do Mar de Azov, e abra o caminho para as estepes."
 teo_tatar_wars: "Guerras contra os Tártaros"
 teo_tatar_wars_desc: "Lute contra os tártaros da Crimeia para forjar a cavalaria teodórica em guerreiros de elite da estepe."
 teo_into_steppes: "Rumo às Estepes"
 teo_into_steppes_desc: "Conquiste a vasta estepe pôntica e transforme Teodoro num império continental."
 teo_caucasus_gateway: "A Porta do Cáucaso"
 teo_caucasus_gateway_desc: "Avance sobre as terras montanhosas do Cáucaso — Geórgia, Armênia e Azerbaijão."
 teo_caspian_reach: "Alcance o Mar Cáspio"
 teo_caspian_reach_desc: "Alcance o Mar Cáspio para obter acesso às rotas comerciais persas e centro-asiáticas."
 teo_russian_question: "A Questão Russa"
 teo_russian_question_desc: "Determine as relações com Moscou e Novgorod — forje aliança ou busque a conquista."
 teo_russian_claim: "Reivindicação à Rus"
 teo_russian_claim_desc: "Amplie a influência teodórica sobre os principados russos."
 teo_ruthenia_conquest: "Conquista da Rutênia"
 teo_ruthenia_conquest_desc: "Conquiste a Rutênia, incluindo Kiev, e reivindique o manto tanto de Bizâncio quanto da Rus."
 teo_dev_theodoro: "Desenvolva Teodoro"
 teo_dev_theodoro_desc: "Desenvolva a cidade-fortaleza de Teodoro numa capital digna do Império Gótico."
 teo_trade_empire: "O Império Comercial"
 teo_trade_empire_desc: "Erga um império comercial na encruzilhada do Mar Negro, do Mediterrâneo e da Rota da Seda."
 teo_silk_road: "O Comércio da Rota da Seda"
 teo_silk_road_desc: "Domine a Rota da Seda e monopolize o fluxo de seda da Ásia Central aos mercados ocidentais."
 teo_gothic_culture: "A Cultura Gótica"
 teo_gothic_culture_desc: "Desenvolva uma cultura gótica singular, que combina as heranças grega, gótica e tártara."
 teo_orthodox_fortress: "Bastião Ortodoxo"
 teo_orthodox_fortress_desc: "Construa uma rede de mosteiros ortodoxos e fortalezas militares para proteger a fé."
 teo_great_theodoro: "A Grande Teodoro"
 teo_great_theodoro_desc: "Transforme Mangup na eterna capital do Império Gótico, farol da civilização."
 teo_crimean_wine: "O Vinho da Crimeia"
 teo_crimean_wine_desc: "Ressuscite a antiga tradição vinícola grega na Crimeia e forneça vinho aos mercados mediterrâneos."
 teo_fortress_mangup: "A Fortaleza de Mangup"
 teo_fortress_mangup_desc: "Fortifique Mangup — fortaleza natural em planalto, que até os otomanos tiveram dificuldade em tomar."
 teo_anatolian_coast: "O Litoral Anatólio"
 teo_anatolian_coast_desc: "Conquiste o litoral sul do Mar Negro da Anatólia, para fazer do Mar Negro o mar interior teodórico."
 teo_orthodox_patriarch: "O Patriarcado Ortodoxo"
 teo_orthodox_patriarch_desc: "Estabeleça o patriarcado em Constantinopla, que fará de Teodoro protetora de todos os cristãos ortodoxos."
 teo_merchant_republic: "A República Mercantil"
 teo_merchant_republic_desc: "Erga, por comércio e conquista, o maior império comercial do Mediterrâneo."
 teo_dev_trebizond_city: "Desenvolva Trebizonda"
 teo_dev_trebizond_city_desc: "Desenvolva Trebizonda como importante nó comercial no litoral sul do Mar Negro."
 teo_gavras_triumphant: "O Triunfo dos Gabras"
 teo_gavras_triumphant_desc: "O gênio mercantil e a coragem militar da família Gabras criaram um grande império a partir de uma fortaleza montanhosa."
 teo_gothia_empire: "O Império Gótico"
 teo_gothia_empire_desc: "Governe como imperador da Gótia — senhor do Mar Negro, do Mediterrâneo e das estepes."
 teo_events.1.t: "Teodoro Ascende — Tradição Grega ou Orgulho Gótico?"
 teo_events.1.d: "Em 1337, da fortaleza em planalto de Mangup começa a ascensão do principado de Teodoro. Cercados por tártaros, genoveses e otomanos, o gênio mercantil e o valor militar da família Gabras transformarão essa crise em oportunidade. Conquiste o comércio do Mar Negro, reviva a Gótia e recupere Constantinopla."
 teo_events.1.a: "Preservar a tradição pôntico-grega — somos herdeiros de Bizâncio"
 teo_events.10.t: "União com Trebizonda — Os Laços dos Comnenos"
 teo_events.10.d: "O Império de Trebizonda da dinastia dos Comnenos esvai-se sob a pressão otomana. Ajudaremos Trebizonda como irmãos gregos, ou a incorporaremos à Gótia?"
 teo_events.10.a: "Fazer de Trebizonda vassala — proteger a herança pôntica sob a Gótia"
 teo_events.20.t: "Constantinopla Recuperada — Coroação do Rei Gótico"
 teo_events.20.d: "Constantinopla nas mãos da Gótia! A recuperação da cidade santa ortodoxa dos otomanos significa que a Rússia, como “Terceira Roma”, torna-se líder espiritual do mundo ortodoxo. A cruz cristã tremula de novo sobre a Hagia Sophia."
 teo_events.20.a: "Glória ao Rei Gótico! Glória a Constantinopla!"
 teo_events.30.t: "A Questão Russa — Aliança ou Conquista?"
 teo_events.30.d: "A família Gabras tem laços profundos com as casas nobres russas. Como determinaremos nossas relações com Moscou e Novgorod — forjaremos uma aliança, que proteja os interesses comuns, ou traremos a Rus ao governo da Gótia?"
 teo_events.30.a: "Firmar aliança com a Rússia — trabalhar juntos como irmãos ortodoxos"
 teo_events.30.b: "Buscar a conquista da Rus — a Gótia deve ser a verdadeira senhora da Rus"
 teo_events.60.t: "O Triunfo dos Gabras — O Nascimento do Império Gótico"
 teo_events.60.d: "Domínio do Mar Negro, Constantinopla recuperada, estepes conquistadas — a família Gabras governa agora como “Imperador do Império Gótico” sobre o Mediterrâneo oriental. A jornada da fortaleza montanhosa de Mangup termina com a fundação de um império mundial."
 teo_events.60.a: "Glória ao Império Gótico! Glória à família Gabras!"
 teo_events.99.t: "O Império Gótico — Glória Eterna"
 teo_events.99.d: "“Imperador da Gótia — senhor do Mar Negro, do Mediterrâneo e da estepe” — esse império, na encruzilhada das civilizações oriental e ocidental, governa supremo. A espantosa história, iniciada em 1337 com a pequena fortaleza de Mangup, encontra aqui seu cumprimento."
 teo_events.99.a: "Glória ao Império Gótico! Glória à glória eterna!"
 STATIC_MODIFIER_NAME_teo_black_sea_fleet_mod: "A Frota do Mar Negro"
 STATIC_MODIFIER_DESC_teo_black_sea_fleet_mod: "A frota do Mar Negro de Teodoro defende a supremacia sobre as vitais águas comerciais."
 STATIC_MODIFIER_NAME_teo_theodoro_harbor_mod: "O Porto de Teodoro"
 STATIC_MODIFIER_DESC_teo_theodoro_harbor_mod: "O porto ao pé de Mangup serve de porta do poder marítimo teodórico."
 STATIC_MODIFIER_NAME_teo_crimea_trade_mod: "Comércio da Crimeia"
 STATIC_MODIFIER_DESC_teo_crimea_trade_mod: "As rotas comerciais crimeo-tártaras asseguradas sob controle teodórico."
 STATIC_MODIFIER_NAME_teo_crimea_domination_mod: "Crimeia Subjugada"
 STATIC_MODIFIER_DESC_teo_crimea_domination_mod: "Todos os rivais expulsos da Crimeia — Teodoro governa como seu único senhor."
 STATIC_MODIFIER_NAME_teo_tana_mod: "Nó Comercial de Tana"
 STATIC_MODIFIER_DESC_teo_tana_mod: "O nó comercial de Tana, na foz do Don, subjugado, abrindo o comércio oriental."
 STATIC_MODIFIER_NAME_teo_black_sea_dom_mod: "Senhor do Mar Negro"
 STATIC_MODIFIER_DESC_teo_black_sea_dom_mod: "Pleno domínio sobre o Mar Negro — nenhum rival ousa desafiar a supremacia teodórica."
 STATIC_MODIFIER_NAME_teo_greek_heritage_mod: "A Herança Grega"
 STATIC_MODIFIER_DESC_teo_greek_heritage_mod: "Os ícones e a liturgia de Bizâncio ainda são guardados nas capelas de Teodoro, sustentando em silêncio a legitimidade dessa terra."
 STATIC_MODIFIER_NAME_teo_pontus_mod: "Ponto Restaurado"
 STATIC_MODIFIER_DESC_teo_pontus_mod: "O litoral pôntico assegurado, abrindo o caminho para a supremacia no Mar Negro."
 STATIC_MODIFIER_NAME_teo_gothia_mod: "A Gótia Ascende"
 STATIC_MODIFIER_DESC_teo_gothia_mod: "O Império Gótico proclamado — o renascimento da Gótia reconhecido pelo mundo."
 STATIC_MODIFIER_NAME_teo_aegean_mod: "Supremacia no Mar Egeu"
 STATIC_MODIFIER_DESC_teo_aegean_mod: "Nos portos das ilhas egeias, navios sob a bandeira da Gótia estão ancorados em fileiras, e as cargas do comércio mediterrâneo são descarregadas uma após outra."
 STATIC_MODIFIER_NAME_teo_balkans_mod: "Bálcãs Conquistados"
 STATIC_MODIFIER_DESC_teo_balkans_mod: "Os Bálcãs conquistados — o Império Gótico estende-se sobre o coração bizantino."
 STATIC_MODIFIER_NAME_teo_azov_mod: "A Porta do Mar de Azov"
 STATIC_MODIFIER_DESC_teo_azov_mod: "A porta do Mar de Azov abre as rotas comerciais interiores pelo Don e pelo Volga."
 STATIC_MODIFIER_NAME_teo_pryazovia_mod: "Azov Setentrional Assegurado"
 STATIC_MODIFIER_DESC_teo_pryazovia_mod: "A margem norte do Mar de Azov assegurada, abrindo o caminho para as estepes."
 STATIC_MODIFIER_NAME_teo_tatar_wars_mod: "Luta contra os Tártaros"
 STATIC_MODIFIER_DESC_teo_tatar_wars_mod: "As guerras contra os tártaros da Crimeia forjaram a cavalaria teodórica em guerreiros de elite da estepe."
 STATIC_MODIFIER_NAME_teo_steppes_mod: "Senhor das Estepes"
 STATIC_MODIFIER_DESC_teo_steppes_mod: "A vasta estepe pôntica passa ao governo teodórico — nasceu o império continental."
 STATIC_MODIFIER_NAME_teo_caucasus_mod: "Expedição ao Cáucaso"
 STATIC_MODIFIER_DESC_teo_caucasus_mod: "A porta do Cáucaso abre acesso ao comércio persa e centro-asiático."
 STATIC_MODIFIER_NAME_teo_caspian_mod: "Mar Cáspio Alcançado"
 STATIC_MODIFIER_DESC_teo_caspian_mod: "O Mar Cáspio alcançado — as rotas comerciais persas e centro-asiáticas estão agora disponíveis."
 STATIC_MODIFIER_NAME_teo_russian_claim_mod: "Reivindicação à Rus"
 STATIC_MODIFIER_DESC_teo_russian_claim_mod: "Enviados de príncipes russos visitam a corte da Gótia, e a nobreza russa, um a um, põe-se sob seu estandarte."
 STATIC_MODIFIER_NAME_teo_ruthenia_mod: "Rutênia Conquistada"
 STATIC_MODIFIER_DESC_teo_ruthenia_mod: "A Rutênia, incluindo Kiev, conquistada — o manto de Bizâncio e da Rus reivindicado."
 STATIC_MODIFIER_NAME_teo_theodoro_dev_mod: "Teodoro Desenvolvida"
 STATIC_MODIFIER_DESC_teo_theodoro_dev_mod: "A cidade-fortaleza de Teodoro desenvolvida numa capital digna do Império Gótico."
 STATIC_MODIFIER_NAME_teo_trade_empire_mod: "O Império Comercial"
 STATIC_MODIFIER_DESC_teo_trade_empire_mod: "O grande império comercial erguido na encruzilhada das civilizações."
 STATIC_MODIFIER_NAME_teo_silk_mod: "Comércio da Rota da Seda"
 STATIC_MODIFIER_DESC_teo_silk_mod: "A Rota da Seda subjugada — a seda flui por mãos teodóricas aos mercados ocidentais."
 STATIC_MODIFIER_NAME_teo_gothic_culture_mod: "A Cultura Gótica"
 STATIC_MODIFIER_DESC_teo_gothic_culture_mod: "Surge uma cultura gótica singular, que combina as heranças grega, gótica e tártara."
 STATIC_MODIFIER_NAME_teo_orthodox_fortress_mod: "Bastião Ortodoxo"
 STATIC_MODIFIER_DESC_teo_orthodox_fortress_mod: "Mosteiros ortodoxos e fortalezas militares protegem tanto a fé quanto a fronteira."
 STATIC_MODIFIER_NAME_teo_great_theodoro_mod: "A Grande Teodoro"
 STATIC_MODIFIER_DESC_teo_great_theodoro_mod: "Mangup transformada na eterna capital do Império Gótico."
 STATIC_MODIFIER_NAME_teo_wine_mod: "O Vinho da Crimeia"
 STATIC_MODIFIER_DESC_teo_wine_mod: "Os vinhedos da Crimeia renascidos — vinhos finos fluem aos mercados mediterrâneos."
 STATIC_MODIFIER_NAME_teo_mangup_fortress_mod: "A Fortaleza de Mangup"
 STATIC_MODIFIER_DESC_teo_mangup_fortress_mod: "A fortaleza de Mangup fortificada além de qualquer ataque — eterna sede do Império Gótico."
 STATIC_MODIFIER_NAME_teo_anatolia_mod: "Litoral Anatólio Assegurado"
 STATIC_MODIFIER_DESC_teo_anatolia_mod: "O litoral sul do Mar Negro da Anatólia conquistado — o mar torna-se o mar interior teodórico."
 STATIC_MODIFIER_NAME_teo_patriarch_mod: "O Patriarcado Ortodoxo"
 STATIC_MODIFIER_DESC_teo_patriarch_mod: "O patriarcado de Constantinopla faz de Teodoro protetora de todos os cristãos ortodoxos."
 STATIC_MODIFIER_NAME_teo_merchant_republic_mod: "A República Mercantil"
 STATIC_MODIFIER_DESC_teo_merchant_republic_mod: "Uma vasta rede comercial estende-se sobre o Mediterrâneo, o Mar Negro e a Rota da Seda."
 STATIC_MODIFIER_NAME_teo_trebizond_city_mod: "A Cidade de Trebizonda"
 STATIC_MODIFIER_DESC_teo_trebizond_city_mod: "Trebizonda desenvolvida como importante nó comercial no litoral sul do Mar Negro."
 STATIC_MODIFIER_NAME_teo_gavras_final_mod: "Hegemonia do Império Gótico"
 STATIC_MODIFIER_DESC_teo_gavras_final_mod: "A visão da dinastia Gabras concluída — o Império Gótico governa mar e estepe."
 teo_events.1.b: "Ressuscitar o orgulho gótico — somos os verdadeiros herdeiros da Gótia"
 teo_events.5.t: "Gazária — Comprar ou Recusar?"
 teo_events.5.d: "A República de Gênova administra sua colônia comercial crimeo-tártara “Gazária (GAZ)”. Por um preço de 300 ducados, Gênova oferece transferir a Gazária como vassala de Teodoro.\n\nÉ uma oportunidade de estabelecer pacificamente o controle da Crimeia — mas 300 ducados é um preço alto. Você a comprará?"
 teo_events.5.a: "Pagar 300 ducados para comprar a Gazária — a Crimeia será nossa"
 teo_events.5.b: "Recusar — preservar o tesouro por ora"
 STATIC_MODIFIER_NAME_teo_gothic_penalty_mod: "A Dor da Conversão Gótica"
 STATIC_MODIFIER_DESC_teo_gothic_penalty_mod: "Os gregos pônticos, incapazes de se acostumar à língua e aos costumes góticos, nutrem ressentimento que arde nas aldeias — mas todos sabem que maior recompensa os aguarda quando o Império Gótico estiver concluído."
 STATIC_MODIFIER_NAME_teo_gothic_bonus_mod: "O Verdadeiro Herdeiro da Gótia"
 STATIC_MODIFIER_DESC_teo_gothic_bonus_mod: "O Império Gótico, concluído com a preservação da cultura gótica — o espírito dos antigos godos renascido, trazendo ao Império Gótico glória eterna."
 teo_events.10.b: "Manter a aliança — honrar o orgulho dos Comnenos"
 STATIC_MODIFIER_NAME_teo_russian_alliance_mod: "Aliança com a Rússia"
 STATIC_MODIFIER_DESC_teo_russian_alliance_mod: "A aliança amistosa com os principados russos elevou a influência diplomática da Gótia."
 STATIC_MODIFIER_NAME_teo_russian_conquest_mod: "A Vontade de Conquistar a Rus"
 STATIC_MODIFIER_DESC_teo_russian_conquest_mod: "A vontade da Gótia de conquistar a Rus suprime a hostilidade recebida."
 teo_events.99.b: "Completar o império com orgulho gótico — abrir o direito de invadir a Alemanha"
 cb_gothic_invasion: "Invasão Gótica"
 cb_gothic_invasion_desc: "Casus belli singular contra nações do grupo cultural germânico — custos de conquista e hostilidade reduzidos em 80%. Desbloqueado apenas para a cultura primária gótica após a conclusão da missão final do Império Gótico."
