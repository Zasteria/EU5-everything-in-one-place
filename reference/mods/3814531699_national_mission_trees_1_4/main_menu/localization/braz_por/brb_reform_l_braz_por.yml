l_braz_por:
 brb_estates_balance_reform: "Equilíbrio entre nobreza e burguesia"
 brb_estates_balance_reform_desc: "Nobreza feudal ou burguesia mercantil — quem fala mais alto define o caráter do governo do grão-ducado. Quanto mais forte a influência da nobreza, mais firme a ordem feudal e o poder tributário; quanto mais forte a da burguesia, maior a prosperidade comercial."
