l_english:
 flo_magnifico_mission_pack: "Legacy of Il Magnifico"
 flo_magnifico_mission_pack_DESCRIPTION:0 "The Republic of Florence, under the extraordinary house of the Medici, leads all of Europe in commerce, art, and learning. Will you build upon the immense wealth generated by the wool trade and the Medici Bank, blossoming as the cradle of the Renaissance? Or will you unify Tuscany, march on Rome, and become the master of Italy — Il Magnifico? In Florence, the wisdom of the merchant and the ambition of the prince converge."
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION:0 "Complete missions as Florence and achieve both flourishing commerce and culture and the conquest of Italy."
 flo_magnifico_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to walk the legacy of Il Magnifico."
 flo_magnifico_mission_pack_BUTTON_DETAILS:0 "Let the Renaissance bloom, master Tuscany, and become the lord of Italy!"

 flo_rise_of_the_commune: "Rise of the Commune"
 flo_rise_of_the_commune_desc: "In 1337, Florence has grown as a 'Comune' — a self-governing city-state of merchants and craftsmen — amid the struggle between the Guelph (papal faction) and the Ghibelline (imperial faction). The Bardi and Peruzzi banks dominate European finance, and the wool trade along the Arno enriches the city. Yet factional strife within is unceasing. Overcome this age of turmoil and lead Florence to true greatness."

 flo_the_prince: "The Prince"
 flo_the_prince_desc: "During the Italian Wars, as foreign powers ravaged Italy, the Florentine diplomat Niccolò Machiavelli wrote 'The Prince.' A revolutionary work that looked upon political reality with cold eyes, it expressed a deep longing for a new ruler who could unify Italy."

 flo_arte_della_lana: "Wool Industry"
 flo_arte_della_lana_desc: "The Arte della Lana — the wool merchant guild — is the core of the Florentine economy. Importing English wool and exporting finished cloth across Europe, it generates the wealth that makes the city great."

 flo_medici_bank: "Establishment of the Medici Bank"
 flo_medici_bank_desc: "The bank founded by the Medici family functions as the official bank of the Roman papacy, with branches spread across Europe. This financial power is the foundation upon which Florence wields its influence in both culture and politics."

 flo_arno_renewal: "Renewal of the Arno"
 flo_arno_renewal_desc: "As the city develops, works along the Arno have advanced, and Florence has become one of Italy's most prosperous cities. The high level of development brings a lasting boost to the city's monthly growth."

 flo_arno_corridor: "The Corridor on the Arno"
 flo_arno_corridor_desc: "The Ponte Vecchio and the canals spanning the Arno River are the commercial and administrative arteries of Florence. Establishing bridges and water transport will accelerate the city's development."

 flo_arno_trade_network: "Arno Trade Network"
 flo_arno_trade_network_desc: "The trade network stretching across Tuscany along the Arno River is the source of Florence's commercial might. By dominating this network, we can place the entire trade of northern Italy under our control."

 flo_dominate_italian_trade: "Dominate Italian Trade"
 flo_dominate_italian_trade_desc: "Florence's commercial network now covers all of Italy. From north to south, the Italian economy cannot function without Florentine merchants."

 flo_duomo_di_firenze: "Santa Maria del Fiore"
 flo_duomo_di_firenze_desc: "The completion of Brunelleschi's dome is an achievement that pushed the limits of the architectural technology of its day. Its great cupola fills the citizens of Florence with deep pride and has become the eternal symbol of the city."

 flo_birthplace_of_renaissance: "Birthplace of the Renaissance"
 flo_birthplace_of_renaissance_desc: "Florence leads the intellectual renewal of all Europe as the birthplace of the Renaissance. The spirit of returning to classical antiquity and humanism has taken firm root in this city."

 flo_florentine_school_of_painting: "Florentine School of Painting"
 flo_florentine_school_of_painting_desc: "The Florentine painting style established by Botticelli and others is ahead of all Europe in perspective and realism."

 flo_the_mona_lisa: "The Mona Lisa"
 flo_the_mona_lisa_desc: "Leonardo da Vinci's masterpiece has changed the very concept of painting. The artistic soil of Florence that continues to produce such genius is unparalleled."

 flo_uffizi: "The Uffizi"
 flo_uffizi_desc: "Bringing together the art collection amassed by the Medici family, the Uffizi could become the greatest museum in the world. Its cultural prestige will permanently elevate the name of Florence."

 flo_the_rise_of_medici: "Rise of the Medici"
 flo_the_rise_of_medici_desc: "After the collapse of the Bardi and Peruzzi families, a new banking dynasty was rising: the Medici. The Medici Bank, founded in 1397 by Giovanni di Bicci de' Medici, grew rapidly on the strength of its relationship with the Roman papacy and expanded branches across Europe. This family will carry the future of Florence."

 flo_pazzi_conspiracy: "The Pazzi Conspiracy"
 flo_pazzi_conspiracy_desc: "The assassination attempt on Lorenzo de' Medici, backed by Pope Sixtus IV and the Pazzi family, ended in failure and paradoxically served only to reinforce Medici authority."

 flo_machiavelli: "The Writings of Machiavelli"
 flo_machiavelli_desc: "In 'The Prince,' Niccolò Machiavelli coolly analyzed the reality of power. His thought has deeply influenced Florentine political philosophy."

 flo_republic_of_virtue: "Republic of Virtue"
 flo_republic_of_virtue_desc: "Florence aspires to be not merely a commercial state, but one founded on virtue and republican ideals. Legitimacy and stability are the cornerstones of the republic."

 flo_camerata_fiorentina_nmt: "Camerata Fiorentina"
 flo_camerata_fiorentina_nmt_desc: "The Camerata, where Florentine intellectuals and musicians gather, is becoming a hotbed of musical innovation that will lead to the birth of opera. A city where art and science bloom as one."

 flo_subjugate_pisa: "Subjugate Pisa"
 flo_subjugate_pisa_desc: "Pisa, the port city that Florence has long coveted as its gateway to the sea, must be secured. Taking command of this harbor on the Arno will greatly expand Florence's commercial reach."

 flo_siena_submitted: "The Submission of Siena"
 flo_siena_submitted_desc: "Our longstanding rival Siena has at last been brought to heel. With the shame of Montaperti avenged, Florence absorbs its silk merchants and bankers and secures complete control of southern Tuscany."

 flo_lucca_absorbed: "Lucca Absorbed"
 flo_lucca_absorbed_desc: "Lucca, which has long guarded its independence, is one of the last barriers to Florence's unification of Tuscany. Placing its silk industry under Florentine authority."

 flo_unify_tuscany: "Unify Tuscany"
 flo_unify_tuscany_desc: "Now that nearly all of Tuscany has come under Florentine control, elevation to a kingdom is a natural consequence. Florence is no longer a mere city-state."

 flo_push_into_lombardy: "Push into Lombardy"
 flo_push_into_lombardy_desc: "Beyond Tuscany, the time has come to extend our domain into the heart of northern Italy. Conflict with Milan, Genoa, and Venice is inevitable."

 flo_march_on_rome: "March on Rome"
 flo_march_on_rome_desc: "He who controls Rome controls Italy. By bringing the ancient capital of the Roman Empire into our domain, Florence stakes a claim to legitimacy that none can rival."

 flo_the_new_rome: "The New Rome"
 flo_the_new_rome_desc: "Florence, having conquered Rome, now dominates most of the Italian Peninsula and has become an empire. The time has come to build a new Rome."

 flo_il_magnifico_of_italy: "Il Magnifico of Italy"
 flo_il_magnifico_of_italy_desc: "Just as Lorenzo de' Medici was called 'Il Magnifico,' all of Florence has now become the 'Magnificent One' of Italy."

 flo_medici_oriental_press: "Medici Oriental Press"
 flo_medici_oriental_press_desc: "The printing house established by the Medici family collects and prints Greek manuscripts that flooded in after the fall of the Byzantine Empire. Ancient knowledge is breathing new life into Europe once more."

 flo_clock_tower: "Clock Tower of the Piazza della Signoria"
 flo_clock_tower_desc: "The precision clock tower installed at the Palazzo della Signoria has become a symbol of Florentine technical prowess. The management of time improves the efficiency of commerce and governance."


 flo_first_modern_engineer: "The First Modern Engineer"
 flo_first_modern_engineer_desc: "Filippo Brunelleschi developed revolutionary construction methods that surpassed ancient Rome in building the dome. His technical legacy will be applied to fortress construction across all of Italy."

 flo_humiliate_venice: "Humiliate Venice"
 flo_humiliate_venice_desc: "The time has come to surpass our long-standing maritime rival, the Republic of Venice. Putting the Queen of the Adriatic in her place, we will prove that Florence is Italy's foremost nation."

 flo_papal_relations: "Relations with the Papacy"
 flo_papal_relations_desc: "Now that Rome is secured, relations with the papacy must be put on a firm footing. Whether through alliance or dominance, Florence will become the greatest patron of the Roman Church."

 flo_vasari_corridor: "The Uffizi and the Vasari Corridor"
 flo_vasari_corridor_desc: "The Vasari Corridor, connecting the Uffizi Palace and the Ponte Vecchio, was designed by Giorgio Vasari on the orders of Cosimo I de' Medici. This secret elevated walkway symbolizes the authority and artistic excellence of the Medici."

 flo_academy_of_florence: "Academy of Florence"
 flo_academy_of_florence_desc: "The academy established in Florence has become a place of comprehensive research in art, science, and philosophy. Knowledge from the Renaissance spreads out from here to the world."

 flo_italian_cultural_hegemon: "Italian Cultural Hegemon"
 flo_italian_cultural_hegemon_desc: "Florence, where commerce, art, and learning have blossomed as one, has become the cultural center of all Italy. Its influence extends even beyond the Alps."

 flo_magnifico: "Il Magnifico"
 flo_magnifico_desc: "From a city of merchants, Florence has risen to the pinnacle of culture, conquered all of Italy, and established itself as the successor to the Roman Empire. 'Il Magnifico' — the name of the Magnificent One is inscribed in history for eternity."
 STATIC_MODIFIER_NAME_flo_arte_della_lana_mod: "Flourishing Wool Industry"
 STATIC_MODIFIER_DESC_flo_arte_della_lana_mod: "The Arte della Lana (the wool guild) was Florence's greatest guild and the foundation of the city's prosperity. Cloth finely worked from raw wool imported from England and Spain was prized across Europe and became the source of the Medici's vast fortune."

 STATIC_MODIFIER_NAME_flo_medici_bank_mod: "Supremacy of the Medici Bank"
 STATIC_MODIFIER_DESC_flo_medici_bank_mod: "Founded in 1397 by Giovanni di Bicci de' Medici, the Medici Bank at its height had branches in sixteen cities, including Rome, Venice, London, and Bruges. As the official bank of the papal court it reaped enormous profits, while evading the Church's ban on usury under the guise of 'exchange profits.'"
 STATIC_MODIFIER_NAME_flo_arno_trade_network_mod: "Arno Trade Network"
 STATIC_MODIFIER_DESC_flo_arno_trade_network_mod: "The Arno was the great artery of water traffic linking Florence with the seaport of Pisa. By commanding the trade routes along it, Florence, though an inland city, took direct part in Mediterranean trade, and formed a distinctive economic sphere combining cloth, banking, and commerce."
 STATIC_MODIFIER_NAME_flo_dominate_italian_trade_mod: "Dominance of Italian Trade"
 STATIC_MODIFIER_DESC_flo_dominate_italian_trade_mod: "Late medieval Italy was the greatest commercial zone in Europe, with the merchants of Florence, Venice, and Genoa at its summit. Florentine merchants spun a financial network across all of northern Europe and wielded enough influence to lend to both sides in the Hundred Years' War between England and France."
 STATIC_MODIFIER_NAME_flo_duomo_di_firenze_mod: "Completion of the Cathedral"
 STATIC_MODIFIER_DESC_flo_duomo_di_firenze_mod: "The dome of Florence Cathedral (Santa Maria del Fiore) was completed by Brunelleschi in 1436. A revolutionary feat of engineering — a vast dome, built without wooden centering or scaffolding, that no one had achieved in over a thousand years since the Pantheon in Rome — it symbolizes the spirit of the Renaissance."
 STATIC_MODIFIER_NAME_flo_birthplace_of_renaissance_mod: "Birthplace of the Renaissance"
 STATIC_MODIFIER_DESC_flo_birthplace_of_renaissance_mod: "The 'Renaissance' — rebirth — was born in Florence. In the Platonic Academy founded by Cosimo de' Medici, Marsilio Ficino and others revived the thought of ancient Greece and Rome, and, joined with the literary tradition of Dante, Petrarch, and Boccaccio, transformed Western civilization to its foundations."
 STATIC_MODIFIER_NAME_flo_florentine_school_of_painting_mod: "Florentine School of Painting"
 STATIC_MODIFIER_DESC_flo_florentine_school_of_painting_mod: "The tradition of realistic painting established by Giotto di Bondone at the end of the 13th century passed on to Masaccio's perspective, Botticelli's grace, and Leonardo's versatility. Florentine painting embodied the transition from medieval sacred images to modern art and set the direction of European painting."
 STATIC_MODIFIER_NAME_flo_the_mona_lisa_mod: "The Impact of the Mona Lisa"
 STATIC_MODIFIER_DESC_flo_the_mona_lisa_mod: "Painted by Leonardo da Vinci around 1503–1519, the 'Mona Lisa,' with its enigmatic smile and its innovative perspective and sfumato technique, became the most famous work in the history of Western art. Leonardo was a universal genius spanning not only painting but anatomy, engineering, architecture, and music."
 STATIC_MODIFIER_NAME_flo_uffizi_mod: "The Glory of the Uffizi"
 STATIC_MODIFIER_DESC_flo_uffizi_mod: "The Uffizi Palace, which Cosimo I de' Medici had Vasari design in 1560, was at first an administrative office (uffizi means 'offices'), but came to house the Medici collections and became one of the world's first museums — a temple of art where the works of Botticelli, Leonardo, and Michelangelo gather."
 STATIC_MODIFIER_NAME_flo_machiavelli_mod: "The Lessons of The Prince"
 STATIC_MODIFIER_DESC_flo_machiavelli_mod: "Niccolò Machiavelli served the Florentine Republic as diplomat and administrator from 1498 to 1512. 'The Prince,' written after the expulsion of the Medici, was a work of realist political thought holding that 'the ends justify the means,' and became a foundation of modern political theory."
 STATIC_MODIFIER_NAME_flo_republic_of_virtue_mod: "Republic of Virtue"
 STATIC_MODIFIER_DESC_flo_republic_of_virtue_mod: "Florence had a unique form of government that kept up a republican front while the Medici in truth held sway. Institutions such as the Signoria (city government), the Priori (magistrates), and the Great Council skillfully fused the ideals of republicanism with the reality of oligarchy."
 STATIC_MODIFIER_NAME_flo_camerata_fiorentina_mod: "Camerata Fiorentina"
 STATIC_MODIFIER_DESC_flo_camerata_fiorentina_mod: "The 'Camerata,' a circle of musicians, poets, and intellectuals who gathered in the 1570s and 1580s at the residence of Count Giovanni de' Bardi in Florence, aimed to revive ancient Greek drama. Their experiments gave birth to an entirely new art form, opera, and changed the history of Western music forever."
 STATIC_MODIFIER_NAME_flo_subjugate_pisa_mod: "The Port of Pisa"
 STATIC_MODIFIER_DESC_flo_subjugate_pisa_mod: "Pisa once reigned over the Mediterranean as a maritime republic alongside Venice and Genoa, but declined after its crushing defeat by Genoa at the Battle of Meloria in 1284. With Florence's conquest of Pisa in 1406, the once landlocked Florence at last gained an outlet to the sea."
 STATIC_MODIFIER_NAME_flo_siena_submitted_mod: "The Submission of Siena"
 STATIC_MODIFIER_DESC_flo_siena_submitted_mod: "Siena was Florence's traditional rival, long in conflict over hegemony in Tuscany. Siena kept its independence with the backing of Spain, but finally fell in 1555. To place the proud Sienese, known for the Palio horse race, under Florentine rule is a symbol of Tuscan unification."
 STATIC_MODIFIER_NAME_flo_lucca_absorbed_mod: "The Silk and Cloth of Lucca"
 STATIC_MODIFIER_DESC_flo_lucca_absorbed_mod: "Lucca was the city with Tuscany's most refined silk industry. In the 13th and 14th centuries, Lucchese silk was prized across Europe and adorned the garments of princes and nobles. The wealth of Lucca's bankers, rivals of the Medici, is also worthy of note."
 STATIC_MODIFIER_NAME_flo_unify_tuscany_mod: "Master of Tuscany"
 STATIC_MODIFIER_DESC_flo_unify_tuscany_mod: "Arezzo, ancient city of the Etruscans; Siena, city of poetry; Lucca, town of crafts; Pisa, the port — by uniting them, Florence becomes the center of Tuscany as a historical, cultural, and geographical whole. It is the work of reuniting the Roman 'Tuscia' beneath the Medici banner."
 STATIC_MODIFIER_NAME_flo_push_into_lombardy_mod: "Push into Lombardy"
 STATIC_MODIFIER_DESC_flo_push_into_lombardy_mod: "Florence and Milan were the two great powers of 15th-century Italian politics, always in tension. Against the expansionist policies of the Visconti and Sforza dukes of Milan, Florence resisted with diplomacy and condottieri, the captains of mercenary bands. This balance of forces gave rise to the refinement of Renaissance diplomacy."
 STATIC_MODIFIER_NAME_flo_the_new_rome_mod: "The New Rome"
 STATIC_MODIFIER_DESC_flo_the_new_rome_mod: "Florence was often called the 'New Rome.' Cosimo and Lorenzo de' Medici consciously imitated the patronage culture of Rome and sought to recreate the virtues of ancient Rome in the spirit of the Renaissance. To rule Rome itself is the symbolic completion of that aim."
 STATIC_MODIFIER_NAME_flo_il_magnifico_of_italy_mod: "Il Magnifico of Italy"
 STATIC_MODIFIER_DESC_flo_il_magnifico_of_italy_mod: "Lorenzo de' Medici (Lorenzo the Magnificent, 1449–1492) stood at the summit of his age as artist, poet, diplomat, and statesman. The policy of balance of power he called the 'balance of Italy' sustained the peace on the eve of the Italian Wars, and his court gave off the finest brilliance of Renaissance culture."
 STATIC_MODIFIER_NAME_flo_medici_oriental_press_mod: "Heritage of Eastern Learning"
 STATIC_MODIFIER_DESC_flo_medici_oriental_press_mod: "At the Council of Florence in 1438–1439, Cosimo de' Medici bought Greek manuscripts in great numbers from the scholars who had come from Byzantium. This collecting led to the Latin translation of Plato and the revival of Neoplatonism, and changed the history of Western thought. Combined with Gutenberg's printing revolution, knowledge spread rapidly."
 STATIC_MODIFIER_NAME_flo_clock_tower_mod: "Precision of the Clock Tower"
 STATIC_MODIFIER_DESC_flo_clock_tower_mod: "Mechanical clocks began to appear in the squares of northern Italian cities in the 14th century. The bell tower (campanile) of Florence Cathedral, designed by Giotto, is a typical example. Shared timekeeping unified a city's commerce and administration and became the infrastructure that supported the transition from the Middle Ages to the modern age."
 STATIC_MODIFIER_NAME_flo_the_rise_of_medici_mod: "Rise of the Medici"
 STATIC_MODIFIER_DESC_flo_the_rise_of_medici_mod: "Cosimo de' Medici (called Pater Patriae, 1389–1464), on the strength of his banking profits, banished his political enemies and became the de facto ruler of Florence. As treasurer of the papal court, patron of the arts, and arbiter in diplomacy, he laid the foundation of the glory of the House of Medici."
 STATIC_MODIFIER_NAME_flo_first_modern_engineer_mod: "Pioneer of Modern Engineering"
 STATIC_MODIFIER_DESC_flo_first_modern_engineer_mod: "Filippo Brunelleschi (1377–1446) brought revolution to architecture, sculpture, and engineering. He theorized linear perspective and realized the great dome of Florence Cathedral through an innovative double-shell structure and framing techniques. He is the archetype of the Renaissance 'universal man' (uomo universale)."
 STATIC_MODIFIER_NAME_flo_humiliate_venice_mod: "Humiliation of Venice"
 STATIC_MODIFIER_DESC_flo_humiliate_venice_mod: "Florence and Venice, the two great commercial powers of medieval Italy, vied in prosperity and were long at odds both diplomatically and militarily. The conflict over expansion toward Milan in the 15th century was especially fierce, and Florence always felt Venice's land-based expansion (the Terraferma policy) as a threat."
 STATIC_MODIFIER_NAME_flo_papal_relations_mod: "Bond with the Papacy"
 STATIC_MODIFIER_DESC_flo_papal_relations_mod: "The relationship between the Medici and the papal court was complicated. After the Pazzi conspiracy of 1478 (an assassination plot in which Archbishop Francesco Salviati was involved) killed Lorenzo's brother Giuliano, Lorenzo was for a time at odds with Sixtus IV, but afterward reconciled and rebuilt a firm relationship."
 STATIC_MODIFIER_NAME_flo_academy_of_florence_mod: "Academy of Florence"
 STATIC_MODIFIER_DESC_flo_academy_of_florence_mod: "The Platonic Academy, supported by Cosimo de' Medici, took on the revival of ancient philosophy under Marsilio Ficino. The Latin translation of the complete works of Plato, the translation of the Hermetic corpus, the systematization of Neoplatonism — these intellectual undertakings renewed the foundations of Western philosophy, theology, and science."
 STATIC_MODIFIER_NAME_flo_italian_cultural_hegemon_mod: "Patronage of Italian Art"
 STATIC_MODIFIER_DESC_flo_italian_cultural_hegemon_mod: "Renaissance Florence was the center of cultural gravity for all of Europe. The princes and nobles of France, the Netherlands, Germany, and England summoned Florentine artists, architects, and scholars, and vied to imitate the 'Italian-style' court culture."
 STATIC_MODIFIER_NAME_flo_magnifico_mod: "The Glory of Il Magnifico"
 STATIC_MODIFIER_DESC_flo_magnifico_mod: "'Il Magnifico' is a phrase that expresses the brilliance not only of one man but of the whole city of Florence. The glory of Florence, which stood at the summit of Europe in art, philosophy, diplomacy, and finance alike, embodies the essence of the age that later generations call the 'Renaissance.'"

 flo_events.1.t: "Rise of the Florentine Commune"
 flo_events.1.d: "In 1337, Florence is caught in the long struggle between the Guelph and Ghibelline factions. The great banks of the Bardi and Peruzzi families, burdened by enormous loans to the King of England, are beginning to falter. The shadow of the Black Death creeps from the east, and there are those who scheme to invite the tyrant Walter de Brienne. And yet the spirit of Florence's Comune — self-governing city of merchants — lives on. On the foundation of the wool trade and the merchant guilds, survive this age of storms."
 flo_events.1.a: "The future of Florence lies in our hands"


 flo_events.3.t: "The Aftermath of the Pazzi Conspiracy"
 flo_events.3.d: "The assassination attempt on Lorenzo de' Medici, backed by Pope Sixtus IV and the Pazzi family, has ended in failure and paradoxically served only to reinforce Medici authority. The conspirators have been executed, and the citizens of Florence have strengthened their support for the Medici still further. Having survived this ordeal, the republic's political structure is poised to be reborn into something more refined."
 flo_events.3.a: "The ordeal has made us stronger"

 flo_events.4.t: "The March on Rome"
 flo_events.4.d: "The ancient capital of the Roman Empire now stands beneath the banner of Florence. The Donation of Constantine has already been proven a forgery — if so, the rightful authority to rule Italy belongs to Florence, won by strength and wisdom. This small republic, born as a city of merchants, now walks the path to an empire whose name will be carved in history."
 flo_events.4.a: "Rome shines in the glory of Florence"

 STATIC_MODIFIER_NAME_flo_arno_renewal_mod: "La Grande Opera"
 STATIC_MODIFIER_DESC_flo_arno_renewal_mod: "Floods of the Arno troubled Florence for years (the flood of 1966 is still spoken of today). But through the improvement of the banks, the building of bridges, and the strengthening of embankments, the river became rather an asset to the city. The workshops, dye-houses, and wool-washing yards along the river functioned as the heart of the Florentine economy."
 STATIC_MODIFIER_NAME_flo_arno_corridor_mod: "Prosperity of the Ponte Vecchio"
 STATIC_MODIFIER_DESC_flo_arno_corridor_mod: "The Ponte Vecchio (the Old Bridge) is the oldest bridge over the Arno, and since the 14th century has been the symbol of Florentine commerce, lined with the shops of goldsmiths and jewelers. Refurbished as part of the Vasari Corridor that Cosimo I had built to link the Uffizi and the Pitti Palace, it became a symbolic passage joining the ruler and the city."
 STATIC_MODIFIER_NAME_flo_vasari_corridor_mod: "The Vasari Corridor"
 STATIC_MODIFIER_DESC_flo_vasari_corridor_mod: "Completed by Giorgio Vasari in just five months in 1565, the Vasari Corridor is an elevated passage linking the Uffizi Palace via the Ponte Vecchio to the Pitti Palace. Designed so that Cosimo I could move about without mingling with the crowds, it is a technical crystallization of a ruler's safety and of mastery over the city."

 flo_events.5.t: "The Uffizi and the Vasari Corridor"
 flo_events.5.d: "Cosimo I de' Medici ordered the architect Giorgio Vasari to connect the Uffizi Palace (seat of administration) with the Palazzo Pitti by means of a secret elevated walkway. This 'Vasari Corridor,' passing above the Ponte Vecchio, is a hidden passage that allows the ruler to move without being seen by the public — a symbol of Medici authority and mastery over the city. This ingenious architecture spanning the Arno clearly demonstrates that politics and art in Florence are one and the same."
 flo_events.5.a: "The completion of the corridor has raised the governance of Florence to a new dimension"

 STATIC_MODIFIER_NAME_flo_the_prince_mod: "The New Prince"
 STATIC_MODIFIER_DESC_flo_the_prince_mod: "In 'The Prince' (1513), Machiavelli preached 'be both the lion's strength and the fox's cunning.' The realism that it is safer to be feared than loved, and that if need be one should put the maintenance of power before morality, became the starting point of modern political science."

 flo_events.6.t: "The Prince"
 flo_events.6.d: "The Italian Wars have given Florence a grave lesson. The diplomat Niccolò Machiavelli wrote 'The Prince,' a work that laid bare the very nature of power. To unite a divided Italy, a new ruler who values real power over morality is needed. 'Only a prince who possesses both virtue and fortune can save a Italy in chaos' — and perhaps that answer lies within Florence itself."
 flo_events.6.a: "A new prince to save Italy, come forth!"
