l_english:
 # === Mission pack ===
 mlo_biscione_mission_pack: "Legacy of the Biscione"
 mlo_biscione_mission_pack_DESCRIPTION:0 "The biscione, a serpent devouring a man, emblazoned on the Visconti coat of arms. Once but one city-state among many in Lombardy, the Duchy of Milan now forges its own path amid the tangled struggle for supremacy over northern Italy. Whether by developing governance and culture, by rising as the foremost power of the north, or by holding its own between the great powers of Pope, Emperor, and France, the choice of what legacy to build lies with the Duke."
 mlo_biscione_mission_pack_CRITERIA_DESCRIPTION:0 "Complete missions as the Duchy of Milan and establish a dominant position in northern Italy."
 mlo_biscione_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to inherit the Legacy of the Biscione."
 mlo_biscione_mission_pack_BUTTON_DETAILS:0 "From a city-state of Lombardy to the heart of Italy!"

 # === ROOT ===
 mlo_expanded_domain: "An Expanded Domain"
 mlo_expanded_domain_desc: "The Duchy of Milan has absorbed the cities of Lombardy, greatly expanding its territory."

 mlo_curb_della_scala: "Curbing the della Scala"
 mlo_curb_della_scala_desc: "The growing hegemony of the della Scala family, lords of Verona, over northern Italy must be checked."

 mlo_imperial_vicariate: "Imperial Vicariate"
 mlo_imperial_vicariate_desc: "Granted the title of Imperial Vicar by the Holy Roman Emperor, Milan's rule now carries the legitimacy of the empire."

 mlo_serpent_that_devours_men: "The Serpent That Devours Men"
 mlo_serpent_that_devours_men_desc: "The biscione, a serpent devouring a man, emblazoned on the Visconti coat of arms. The legend embodies the family's power and heralds a new age for Milan."

 # === BRANCH A: State-led enterprises ===
 mlo_state_led_enterprises: "State-Led Enterprises"
 mlo_state_led_enterprises_desc: "The Duchy of Milan, under state direction, pushes forward the development of its institutions and its culture."

 mlo_rigorous_plague_policy: "A Rigorous Plague Policy"
 mlo_rigorous_plague_policy_desc: "In the face of plague, a thorough system of quarantine and isolation must be established to protect the duchy's people."

 mlo_duomo_di_milano: "The Duomo di Milano"
 mlo_duomo_di_milano_desc: "Press forward the construction of the Milan Cathedral, letting the duchy's splendor reach toward the heavens."

 mlo_road_network_of_the_realm: "A Road Network for the Realm"
 mlo_road_network_of_the_realm_desc: "Develop a network of roads linking the entire duchy, invigorating the movement of people and goods."

 mlo_expand_administrative_buildings: "Expanding Administrative Buildings"
 mlo_expand_administrative_buildings_desc: "Drawing on the lessons of the plague policy, further expand the duchy's administrative institutions."

 mlo_embrace_the_renaissance: "Embracing the Renaissance"
 mlo_embrace_the_renaissance_desc: "Alongside the construction of the Duomo, the Milanese court embraces the new spirit of the Renaissance."

 mlo_the_last_supper: "The Last Supper"
 mlo_the_last_supper_desc: "Commission Leonardo da Vinci to paint The Last Supper, making Milan a city of the arts."

 mlo_naviglio_grande_renovation: "Renovating the Naviglio Grande"
 mlo_naviglio_grande_renovation_desc: "Renovate the Naviglio Grande, the canal linking Milan to the surrounding region, spurring trade and agriculture."

 mlo_castello_sforzesco: "Castello Sforzesco"
 mlo_castello_sforzesco_desc: "Expand the Castello Sforzesco, a symbol of ducal splendor, as the seat of Milan's government."

 mlo_biblioteca_ambrosiana: "Biblioteca Ambrosiana"
 mlo_biblioteca_ambrosiana_desc: "Establish the Biblioteca Ambrosiana to house the accumulated knowledge of the ages and foster scholarship."

 mlo_heart_of_italy: "A City Fit to Be the Heart of Italy"
 mlo_heart_of_italy_desc: "With governance, industry, art, and scholarship all in flower, Milan has become a city worthy of standing as the heart of Italy."

 # === BRANCH B: North Italian ambitions ===
 mlo_north_italian_ambitions: "North Italian Ambitions"
 mlo_north_italian_ambitions_desc: "The Duchy of Milan sets its armies in motion to secure dominance over the whole of northern Italy."

 mlo_subjugate_lombardy: "Subjugating Lombardy"
 mlo_subjugate_lombardy_desc: "Bring the cities of Lombardy under complete control, securing the duchy's foundation."

 mlo_advance_into_piedmont: "Advancing into Piedmont"
 mlo_advance_into_piedmont_desc: "Extend influence westward into Piedmont, countering the power of the House of Savoy."

 mlo_strife_over_veneto: "Strife Over Veneto"
 mlo_strife_over_veneto_desc: "Conflict with Venice and other powers over control of Veneto is unavoidable."

 mlo_through_emilia_and_beyond: "Through Emilia and Beyond"
 mlo_through_emilia_and_beyond_desc: "Pass through Emilia, opening a route for further expansion to the south."

 mlo_secure_liguria: "Securing Liguria"
 mlo_secure_liguria_desc: "Secure Liguria, including Genoa, gaining a foothold on the Mediterranean."

 mlo_reach_the_coveted_sea: "Reaching the Coveted Sea"
 mlo_reach_the_coveted_sea_desc: "Milan, once a landlocked state, finally secures direct access to the Mediterranean."

 mlo_topple_the_old_rival_florence: "Toppling the Old Rival, Florence"
 mlo_topple_the_old_rival_florence_desc: "Defeat the longstanding rival Florence, establishing influence over Tuscany."

 # === BRANCH C: Between two authorities ===
 mlo_between_two_authorities: "Between Two Authorities"
 mlo_between_two_authorities_desc: "Milan seeks its own path, caught between the three great authorities of Pope, Emperor, and the King of France."

 mlo_reconcile_with_the_papacy: "Reconciling with the Papacy"
 mlo_reconcile_with_the_papacy_desc: "Improve relations with the Roman Curia, gaining its authority as a support."

 mlo_trust_of_the_emperor: "The Emperor's Trust"
 mlo_trust_of_the_emperor_desc: "Earn the trust of the Holy Roman Emperor, raising the duchy's standing within the empire."

 mlo_overture_to_france: "Overture to France"
 mlo_overture_to_france_desc: "Build diplomatic ties with the Kingdom of France, securing new options."

 mlo_the_italian_wars: "The Italian Wars"
 mlo_the_italian_wars_desc: "Milan is drawn into the Italian Wars, where the interests of the Pope, the Emperor, and France collide."

 mlo_isolate_papal_authority: "Isolating Papal Authority"
 mlo_isolate_papal_authority_desc: "Having weathered the Italian Wars, separate the Pope's temporal authority from Milanese politics."

 mlo_deny_imperial_authority: "Denying Imperial Authority"
 mlo_deny_imperial_authority_desc: "Having weathered the Italian Wars, choose a path of governing the duchy without reliance on imperial authority."

 mlo_repel_french_authority: "Repelling French Authority"
 mlo_repel_french_authority_desc: "Having weathered the Italian Wars, repel French intervention and preserve the duchy's independence."

 mlo_italian_independence: "Italian Independence"
 mlo_italian_independence_desc: "Milan has secured its standing as a strong, self-reliant power in Italy, dependent on neither Pope, Emperor, nor France."

 # === FINAL ===
 mlo_who_achieves_all_things: "He Who Achieves All Things"
 mlo_who_achieves_all_things_desc: "Having reached the summit in governance, culture, territory, and diplomacy alike, the Duke of Milan is now fit to be called one who achieves all things."
 STATIC_MODIFIER_NAME_mlo_expanded_domain_mod: "An Expanding Duchy"
 STATIC_MODIFIER_DESC_mlo_expanded_domain_mod: "The rapid growth of the duchy's territory has spurred the spread of administration, speeding the integration of newly acquired lands."

 # === Static modifiers ===

 STATIC_MODIFIER_NAME_mlo_curb_della_scala_mod: "Ascendancy over the della Scala"
 STATIC_MODIFIER_DESC_mlo_curb_della_scala_mod: "Having checked the della Scala's influence in northern Italy, the duchy's diplomatic standing has risen."


 STATIC_MODIFIER_NAME_mlo_state_led_enterprises_mod: "A Refined State Apparatus"
 STATIC_MODIFIER_DESC_mlo_state_led_enterprises_mod: "The Visconti and Sforza excelled at large-scale state-led public works. The Certosa of Pavia, the Castello Sforzesco in Milan, the Naviglio Grande canal network — all were grand construction projects driven by public authority."

 STATIC_MODIFIER_NAME_mlo_rigorous_plague_policy_mod: "An Established Quarantine System"
 STATIC_MODIFIER_DESC_mlo_rigorous_plague_policy_mod: "Hospitals established across the duchy have strengthened resistance to disease nationwide."

 STATIC_MODIFIER_NAME_mlo_duomo_di_milano_mod: "The Splendor of the Duomo"
 STATIC_MODIFIER_DESC_mlo_duomo_di_milano_mod: "The completed Milan Cathedral has strengthened the duchy's cultural tradition and influence."

 STATIC_MODIFIER_NAME_mlo_road_network_of_the_realm_mod: "A Flourishing Road Network"
 STATIC_MODIFIER_DESC_mlo_road_network_of_the_realm_mod: "The developed network of roads has invigorated trade across the duchy."

 STATIC_MODIFIER_NAME_mlo_expand_administrative_buildings_mod: "An Expanded Administration"
 STATIC_MODIFIER_DESC_mlo_expand_administrative_buildings_mod: "The Sforza built up a powerful bureaucratic system. In Milan's central chancery (the Cancelleria), capable jurists and clerks were gathered, and it was known as the most refined administrative apparatus in northern Italy."

 STATIC_MODIFIER_NAME_mlo_embrace_the_renaissance_mod: "A Renaissance Court"
 STATIC_MODIFIER_DESC_mlo_embrace_the_renaissance_mod: "The court of Francesco Sforza and his son Ludovico Sforza (il Moro) became a great center of the Renaissance. Ludovico received Leonardo da Vinci at court for nearly twenty years and gathered artists and architects such as Bramante."

 STATIC_MODIFIER_NAME_mlo_the_last_supper_mod: "An Immortal Masterpiece"
 STATIC_MODIFIER_DESC_mlo_the_last_supper_mod: "Painted by Leonardo da Vinci on the refectory wall of the convent of Santa Maria delle Grazie in 1495–1498, 'The Last Supper' is counted a masterpiece of Western painting for its perfect use of perspective and its psychological depiction of each figure. Commissioned by Ludovico Sforza, it is a legacy of the Milanese court at its zenith."

 STATIC_MODIFIER_NAME_mlo_naviglio_grande_renovation_mod: "The Benefits of the Canal Network"
 STATIC_MODIFIER_DESC_mlo_naviglio_grande_renovation_mod: "The renovated Naviglio Grande has permanently sped the propagation of governance from the capital."


 STATIC_MODIFIER_NAME_mlo_biblioteca_ambrosiana_mod: "A Flourishing of Scholarship"
 STATIC_MODIFIER_DESC_mlo_biblioteca_ambrosiana_mod: "The founding of the Biblioteca Ambrosiana has raised the skill of artists newly coming into their craft."

 STATIC_MODIFIER_NAME_mlo_heart_of_italy_mod: "The Heart of Italy"
 STATIC_MODIFIER_DESC_mlo_heart_of_italy_mod: "As the heart of Italy, Milan draws people from every corner, its prosperity now permanent."

 STATIC_MODIFIER_NAME_mlo_north_italian_ambitions_mod: "Ambitions in Northern Italy"
 STATIC_MODIFIER_DESC_mlo_north_italian_ambitions_mod: "Ambitions over all of northern Italy have accelerated the construction of spy networks."

 STATIC_MODIFIER_NAME_mlo_subjugate_lombardy_mod: "Overlord of Lombardy"
 STATIC_MODIFIER_DESC_mlo_subjugate_lombardy_mod: "Complete control of Lombardy has raised the duchy's diplomatic standing."

 STATIC_MODIFIER_NAME_mlo_advance_into_piedmont_mod: "A Foothold in Piedmont"
 STATIC_MODIFIER_DESC_mlo_advance_into_piedmont_mod: "Piedmont was the sphere of the House of Savoy and a long-time rival of Milan. To hold this strategic corridor across the Alps to France would be a shield against invasion from the west. Both the Visconti and the Sforza repeatedly tried to advance into the region."

 STATIC_MODIFIER_NAME_mlo_strife_over_veneto_mod: "Battle Honors from Veneto"
 STATIC_MODIFIER_DESC_mlo_strife_over_veneto_mod: "Battle honors from the strife over Veneto have raised the army's renown."

 STATIC_MODIFIER_NAME_mlo_through_emilia_and_beyond_mod: "A Road to the South"
 STATIC_MODIFIER_DESC_mlo_through_emilia_and_beyond_mod: "The route opened beyond Emilia sustains the army's morale."

 STATIC_MODIFIER_NAME_mlo_secure_liguria_mod: "Commerce of Liguria"
 STATIC_MODIFIER_DESC_mlo_secure_liguria_mod: "The securing of Liguria, including Genoa, has spurred the activity of merchants."

 STATIC_MODIFIER_NAME_mlo_reach_the_coveted_sea_mod: "A Gateway to the Mediterranean"
 STATIC_MODIFIER_DESC_mlo_reach_the_coveted_sea_mod: "Having reached the coveted sea, the navy's supply capacity has improved."

 STATIC_MODIFIER_NAME_mlo_topple_the_old_rival_florence_mod: "Sunset on the Arno"
 STATIC_MODIFIER_DESC_mlo_topple_the_old_rival_florence_mod: "The glory of defeating the longstanding rival Florence has raised the duchy's splendor."

 STATIC_MODIFIER_NAME_mlo_between_two_authorities_mod: "Diplomacy Between Powers"
 STATIC_MODIFIER_DESC_mlo_between_two_authorities_mod: "Milan steered its diplomacy while keeping a certain distance from all three authorities: the Holy Roman Emperor, the Pope, and the King of France. The diplomats of the Sforza practiced the concept of the 'balance of power,' bringing northern Italy a long relative peace."

 STATIC_MODIFIER_NAME_mlo_reconcile_with_the_papacy_mod: "Peace with the Papacy"
 STATIC_MODIFIER_DESC_mlo_reconcile_with_the_papacy_mod: "Reconciliation with the Papacy has brought stability of faith within the duchy."

 STATIC_MODIFIER_NAME_mlo_trust_of_the_emperor_mod: "The Emperor's Confidence"
 STATIC_MODIFIER_DESC_mlo_trust_of_the_emperor_mod: "The Emperor's confidence has raised the duchy's standing within the empire."

 STATIC_MODIFIER_NAME_mlo_overture_to_france_mod: "Amity with France"
 STATIC_MODIFIER_DESC_mlo_overture_to_france_mod: "Diplomatic ties with the Kingdom of France have deepened the friendship between the two states."

 STATIC_MODIFIER_NAME_mlo_the_italian_wars_mod: "Experience of the Italian Wars"
 STATIC_MODIFIER_DESC_mlo_the_italian_wars_mod: "Surviving the Italian Wars has fostered the army's tradition."

 STATIC_MODIFIER_NAME_mlo_isolate_papal_authority_mod: "Independence from the Pope"
 STATIC_MODIFIER_DESC_mlo_isolate_papal_authority_mod: "Distance from the Pope's temporal authority has increased tolerance toward heretics."

 STATIC_MODIFIER_NAME_mlo_deny_imperial_authority_mod: "Independence from the Emperor"
 STATIC_MODIFIER_DESC_mlo_deny_imperial_authority_mod: "Governance free of reliance on imperial authority has brought stability within the duchy."

 STATIC_MODIFIER_NAME_mlo_repel_french_authority_mod: "Independence from France"
 STATIC_MODIFIER_DESC_mlo_repel_french_authority_mod: "Repelling French intervention has raised the army's morale."

 STATIC_MODIFIER_NAME_mlo_italian_independence_mod: "A Self-Reliant Italian Power"
 STATIC_MODIFIER_DESC_mlo_italian_independence_mod: "Standing independent of any great power has raised both the Duke's splendor and legitimacy."

 STATIC_MODIFIER_NAME_mlo_who_achieves_all_things_mod: "The Duke Who Achieves All Things"
 STATIC_MODIFIER_DESC_mlo_who_achieves_all_things_mod: "'He who does all things' (Chi tutte cose fa) — the Sforza motto was no mere boast but the political expression of the Renaissance ideal of the 'universal man.' Military conqueror and great patron of the arts, lawgiver and nurturer of commerce — the summit of the Duchy of Milan embodies the political peak of the Italian Renaissance."

 # === Events ===
 mlo_events.1.t: "The Legend of the Biscione"
 mlo_events.1.d: "The Visconti coat of arms bears a single serpent devouring a man — the biscione. Some say it commemorates a deed of valor in the Crusades; others claim it symbolizes a conquered infidel. Whatever the truth, the emblem proclaims throughout northern Italy that the family's power, and the city-state of Milan itself, are no longer the affairs of a mere local lord. Before the Duke now lie many paths: the path of the statesman, the path of the conqueror, and the path of the diplomat who walks between great powers."
 mlo_events.1.a: "A new age has come to Milan"

 mlo_events.2.t: "Milan in 1337"
 mlo_events.2.d: "As of 1337, Milan stands under the joint rule of Luchino Visconti and his brother, Archbishop Giovanni Visconti. In the time of their predecessor Azzone, the title of Imperial Vicar was granted by Holy Roman Emperor Louis IV, lending the authority of the Empire to Milan's rule. Across northern Italy, powerful lords hold sway and vie with one another — the della Scala of Verona, the Gonzaga of Mantua, the Este of Ferrara, and more. With the Pope seated in Avignon and the Emperor's strength concentrated north of the Alps, it will be whoever seizes supremacy over Lombardy who decides the fate of northern Italy."
 mlo_events.2.a: "The foundations of Milan are understood"

 mlo_events.3.t: "The History of Castello Sforzesco"
 mlo_events.3.d: "Milan's castle began as a fortress built by the Visconti, known as the Corte dell'Arengo. When the ducal line ended with the death of Filippo Maria Visconti in 1447, the citizens proclaimed the Ambrosian Republic and tore down much of the castle, a symbol of the old rulers they had cast off. Yet in 1450, Francesco Sforza, who brought the chaos of the republic to an end and assumed the ducal title, ordered the fortress rebuilt anew, grander than before, to proclaim his own authority. Ever since, Castello Sforzesco has stood as the seat of ducal power in Milan, its splendor undimmed."
 mlo_events.3.a: "The weight of this history is understood"

 # === Buildings ===
 mlo_castello_sforzesco_building: "Castello Sforzesco"
 mlo_castello_sforzesco_building_desc: "A fortress rebuilt by Francesco Sforza, standing as a symbol of ducal power in Milan. When present in the capital, it strengthens cultural tradition, cultural influence, and the power of the crown."

 STATIC_MODIFIER_NAME_mlo_serpent_reward_mod: "Rule of the Biscione"
 STATIC_MODIFIER_DESC_mlo_serpent_reward_mod: "The Visconti serpent emblem (the Biscione) — a serpent swallowing a man — is the symbol of Milan's power and ambition. According to legend, an ancestor of the Visconti won it in a duel with a Saracen knight. The achievement of Italian unification means that the serpent has at last swallowed the whole land."

