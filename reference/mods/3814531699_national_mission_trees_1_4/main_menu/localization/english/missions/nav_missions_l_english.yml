l_english:
 nav_crown_mission_pack: "Legacy of the Kingdom of Navarre"
 nav_crown_mission_pack_DESCRIPTION:0 "Rooted in the foothills of the Pyrenees, the Basque Kingdom of Navarre is a small power hemmed in by the three great realms of Castile, Aragon, and France. Yet its bloodline runs through the royal houses of both France and Aragon, and should the gears of history align, an unexpected path to greatness may yet open before it. Will you forge Basque unity, push beyond Gascony to intervene in France, or seize dominance over the Iberian Peninsula? The fate of this small kingdom rests in the hands of its king."
 nav_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Complete missions as the Kingdom of Navarre and establish Basque unity along with influence over Iberia and France."
 nav_crown_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to walk the legacy of the Kingdom of Navarre."
 nav_crown_mission_pack_BUTTON_DETAILS:0 "Forge Basque unity, push into Gascony, and claim dominance over Iberia!"

 # === ROOT ===
 nav_kingdom_of_pamplona: "The Kingdom of Pamplona"
 nav_kingdom_of_pamplona_desc: "Founded by Eneko Arista, the Kingdom of Pamplona is an ancient line deeply rooted in the Basque lands. Yet surrounded by the great powers of Castile, Aragon, and France, its survival has always rested on a fragile balance."

 # === BRANCH 1: Basque Unity ===
 nav_secure_bayonne: "Secure Bayonne"
 nav_secure_bayonne_desc: "The time has come to unite our kinsmen across the sea, the French Basques of Bayonne, under our crown. All Basques must one day gather beneath a single banner."

 nav_basque_unity: "Basque Unity"
 nav_basque_unity_desc: "A people sharing our language and customs now forms the core of the kingdom. To be Basque has become our greatest pride."

 nav_fueros_and_privileges: "Guarantee the Fueros"
 nav_fueros_and_privileges_desc: "The fueros, ancient privileges of self-governance long held by the Basque towns. As the nobility grows more content, guaranteeing these privileges becomes a firm foundation for the crown itself."

 nav_efficient_administration: "An Efficient Administration"
 nav_efficient_administration_desc: "Counting houses established across the realm strengthen our fiscal foundations. For a small kingdom, efficiency of governance is a lifeline."

 nav_renaissance_of_pamplona: "The Renaissance of Pamplona"
 nav_renaissance_of_pamplona_desc: "The new winds of learning rising from Italy have reached even the foothills of the Pyrenees. However small the kingdom, its spirit walks at the forefront of the age."

 # === BRANCH 2: Push into Gascony ===
 nav_intervene_hundred_years_war: "Intervene in the Hundred Years' War"
 nav_intervene_hundred_years_war_desc: "The long struggle between France and England rages on. Our royal bloodline runs through both crowns, and Navarre has both the right and the opportunity to intervene as a third power."

 nav_foothold_in_france: "A Foothold in France"
 nav_foothold_in_france_desc: "Taking advantage of the chaos of the Hundred Years' War, secure a portion of French soil. This extends the kingdom's reach far into the heart of southwestern France."

 nav_secure_gascony: "Secure Gascony"
 nav_secure_gascony_desc: "Mastering the land of Tursan and seizing the port of Bordeaux brings the whole of Gascony under our rule, opening the gateway to the Atlantic."

 nav_claims_on_france: "A Foothold for the French Crown"
 nav_claims_on_france_desc: "Now that broad territories within France itself are secured, the ambition our house holds toward the French throne is no longer mere fancy."

 nav_house_of_evreux: "The Ambition of the House of Evreux"
 nav_house_of_evreux_desc: "Whether through a personal union with France or the outright occupation of Paris itself, the legitimacy our house holds toward the French throne is now beyond doubt."

 nav_claim_french_throne: "Claim the French Throne"
 nav_claim_french_throne_desc: "With the French royal line now extinguished, our house stands as the rightful heir to its crown. The time has come for two crowns, Navarre and France, to rest upon a single head."

 # === BRANCH 3: Unification of Iberia ===
 nav_aragonese_inheritance: "Blood Ties with Aragon"
 nav_aragonese_inheritance_desc: "Our house and the royal house of Aragon share the same ancestral blood. The fates of the two realms may yet be bound together as one."

 nav_castilian_question: "The Castilian Question"
 nav_castilian_question_desc: "Castile, the greatest power of the Iberian Peninsula. Whether to bind ourselves to it in alliance or to stand against it as a rival, the nature of this relationship must be made clear."

 nav_reconquista_legacy: "The Legacy of the Reconquista"
 nav_reconquista_legacy_desc: "The memory of centuries of struggle against Islamic powers is a pride shared by all the realms of Iberia. Our kingdom too carries a share of that glory."

 nav_dominate_iberia: "Dominance over Iberia"
 nav_dominate_iberia_desc: "What was once a minor kingdom can no longer be ignored upon the Iberian Peninsula. The Basque crown has grown powerful enough to shape the fate of the entire peninsula."

 # === Yearning for the Sea ===
 nav_basque_seafarers: "Basque Fishermen"
 nav_basque_seafarers_desc: "The Basque people have long been known as fearless fishermen. Their skill and courage must now be put to use as an asset of the state."

 nav_fearless_fishermen: "Fearless Seafarers"
 nav_fearless_fishermen_desc: "Basque sailors fear not even the raging northern seas. Their seamanship and courage are already renowned across the continent."

 nav_transatlantic_whalers: "Whalers Across the Atlantic"
 nav_transatlantic_whalers_desc: "Ships of Basque whalers, pursuing their quarry, have at last reached far across the Atlantic. Operations in these new waters promise immense wealth for the kingdom."

 # === FINAL ===
 nav_basque_in_glory: "Basque in Glory"
 nav_basque_in_glory_desc: "A small kingdom born in the foothills of the Pyrenees has flourished in culture, seized the throne of France, and reigned over a unified Iberia as Spain. The glory of the Basques can no longer be denied by anyone."
 STATIC_MODIFIER_NAME_nav_secure_bayonne_mod: "Military Experience from Bayonne"
 STATIC_MODIFIER_DESC_nav_secure_bayonne_mod: "The integration of Bayonne has given our forces experience in battle."

 # === Static Modifiers ===


 STATIC_MODIFIER_NAME_nav_basque_unity_mod: "Basque Unity"
 STATIC_MODIFIER_DESC_nav_basque_unity_mod: "The Basques are one of the oldest peoples in Europe, of unknown origin, speaking a language unrelated to the Indo-European family. The cultural unity of the Basques living on both sides of the Pyrenees kept its own identity under French and Spanish rule alike."

 STATIC_MODIFIER_NAME_nav_fueros_and_privileges_mod: "Guaranteed Fueros"
 STATIC_MODIFIER_DESC_nav_fueros_and_privileges_mod: "The fueros (privileges and customary law) are a legal system guaranteeing the traditional autonomy of Navarre and the Basque country. Its own powers over taxation, military service, and justice were always in tension with the centralizing Castilian crown. This unique legal tradition forms the core of Navarre's identity."

 STATIC_MODIFIER_NAME_nav_efficient_administration_mod: "Efficient Governance"
 STATIC_MODIFIER_DESC_nav_efficient_administration_mod: "The Kingdom of Navarre set up the 'Cámara de Comptos,' an office of financial management, and adopted a French-style administrative system. The administrative refinement that came from its long ties with the French royal house (the Navarrese royal family often intermarried with the French) set it apart from the other kingdoms of Iberia."

 STATIC_MODIFIER_NAME_nav_renaissance_of_pamplona_mod: "The New Spirit of Pamplona"
 STATIC_MODIFIER_DESC_nav_renaissance_of_pamplona_mod: "The spirit of the Renaissance has raised the skill of artists newly coming into their craft."

 STATIC_MODIFIER_NAME_nav_foothold_in_france_mod: "A Bridgehead in France"
 STATIC_MODIFIER_DESC_nav_foothold_in_france_mod: "The Kingdom of Navarre also held lands north of the Pyrenees, with Lower Navarre (the French Basque country today) at their center. Historically the royal house of Navarre frequently married into the French royal house, and holding a foothold in France was the basis of its diplomacy."

 STATIC_MODIFIER_NAME_nav_secure_gascony_mod: "The Crown of Gascony"
 STATIC_MODIFIER_DESC_nav_secure_gascony_mod: "Securing the whole of Gascony has strengthened the splendor of the crown."

 STATIC_MODIFIER_NAME_nav_house_of_evreux_mod: "The Prestige of the House of Evreux"
 STATIC_MODIFIER_DESC_nav_house_of_evreux_mod: "A firm relationship with the French royal house has raised our nation's diplomatic standing."

 STATIC_MODIFIER_NAME_nav_claim_french_throne_mod: "Twin Crowns of Navarre and France"
 STATIC_MODIFIER_DESC_nav_claim_french_throne_mod: "Wearing the twin crowns of Navarre and France has raised the splendor of the realm and the stability of its governance."

 STATIC_MODIFIER_NAME_nav_castilian_question_mod: "A Clear Relationship with Castile"
 STATIC_MODIFIER_DESC_nav_castilian_question_mod: "A clarified relationship with Castile has raised our nation's diplomatic standing."

 STATIC_MODIFIER_NAME_nav_reconquista_legacy_mod: "Pride of the Reconquista"
 STATIC_MODIFIER_DESC_nav_reconquista_legacy_mod: "The memory of the struggle against Islamic powers has raised tolerance toward our dominant religion."

 STATIC_MODIFIER_NAME_nav_dominate_iberia_mod: "Master of Iberia"
 STATIC_MODIFIER_DESC_nav_dominate_iberia_mod: "For Navarre, a small kingdom of the Iberian peninsula, to surpass the great powers of Castile and Aragon and become master of the peninsula recalls the dream that Sancho III the Great (r. 1000–1035) briefly realized. It is a historic feat attainable by making full use of the geographic advantage of holding the Pyrenean passes."

 STATIC_MODIFIER_NAME_nav_basque_seafarers_mod: "The Basque Fishing Tradition"
 STATIC_MODIFIER_DESC_nav_basque_seafarers_mod: "The growth of fishing villages permanently supplies 5 sailors each month."

 STATIC_MODIFIER_NAME_nav_fearless_fishermen_mod: "The Morale of Fearless Seafarers"
 STATIC_MODIFIER_DESC_nav_fearless_fishermen_mod: "'The Basque sailor fears no storm' was a saying known across Europe. The seamanship and mettle honed on the rough waters of the Bay of Biscay ('our sea' to the Basques) placed them at the forefront of the Atlantic age. Many of the sailors of the Spanish Armada were Basques."

 STATIC_MODIFIER_NAME_nav_transatlantic_whalers_mod: "Seamanship of the Atlantic Whalers"
 STATIC_MODIFIER_DESC_nav_transatlantic_whalers_mod: "Basque whalers are thought to have hunted right whales off the Labrador coast of North America from the 15th century. The remains of a Basque whaling station survive at Red Bay in Canada and are listed as a UNESCO World Heritage Site. This pioneering transatlantic activity laid the groundwork for the colonial era."

 STATIC_MODIFIER_NAME_nav_third_faction_mod: "Resolve of an Independent Third Faction"
 STATIC_MODIFIER_DESC_nav_third_faction_mod: "The resolve to side with neither great power has raised the morale of the army."

 STATIC_MODIFIER_NAME_nav_basque_in_glory_mod: "Basque in Glory"
 STATIC_MODIFIER_DESC_nav_basque_in_glory_mod: "Having mastered culture, diplomacy, and governance alike, the Basque crown now radiates a splendor far beyond that of a minor kingdom. Military discipline and heavy ship power are also permanently strengthened."

 # === Events ===
 nav_events.1.t: "The Origins of the Kingdom of Pamplona"
 nav_events.1.d: "The Kingdom of Navarre is the heir to the Kingdom of Pamplona, founded in the 9th century by Eneko Arista. Centered on the Basque Country, this line was born as a march of the Carolingian Empire and has continued to chart its own course between the two great powers of the Islamic realms and the Frankish kingdom. Now the time has come to raise its banner once more in the foothills of the Pyrenees."
 nav_events.1.a: "The history of the kingdom is taken to heart"

 nav_events.2.t: "Ambition for the French Throne"
 nav_events.2.d: "Our house, the House of Evreux, shares blood with the royal house of France itself. Now that broad territories within France are secured, the King of Navarre may openly assert his claim to its succession. That legitimacy must now be proven, in court and on the battlefield alike."
 nav_events.2.a: "The cause of the claim is raised"

 nav_events.3.t: "Blood Ties with Aragon"
 nav_events.3.d: "The royal houses of Navarre and Aragon share the same ancestral blood. It is not at all uncommon for the heirs to both thrones to be one and the same person. Should either line fail, the two realms may yet be destined to unite beneath a single crown."
 nav_events.3.a: "The meaning of this kinship is understood"

 nav_events.4.t: "Intervention in the Hundred Years' War"
 nav_events.4.d: "The Hundred Years' War between France and England is no longer a simple conflict between two nations. Our house, the House of Evreux, descends from the French Capetian line while also holding deep ties of marriage with the English court. Moreover, the Navarrese crown itself has long served as an important precedent in debates over the French succession laws.\\n\\nIn this age of turmoil, three paths lie open to Navarre. One is to support France, on the grounds of blood ties and longstanding friendship. Another is to support England, for the sake of trade interests and as a bulwark against Castile. And the last is to side with neither great power, pursuing our own interests as an independent third faction. This choice will weigh heavily upon the kingdom's fate."
 nav_events.4.a: "Support France"
 nav_events.4.b: "Support England"
 nav_events.4.c: "Enter the war as an independent third faction"
