l_english:
 lbv_niederbayern_mission_pack: "The Landshut Legacy — The Road to Bavarian Reunification"
 lbv_niederbayern_mission_pack_DESCRIPTION:0 "As the House of Landshut, heir to Albert I's inheritance reaching to the Low Countries, unite the fractured lands of Bavaria as one once more."
 lbv_niederbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Develop Landshut and reunify Bavaria."
 lbv_niederbayern_mission_pack_BUTTON_TOOLTIP:0 "Develop Landshut and reunify Bavaria."
 lbv_niederbayern_mission_pack_BUTTON_DETAILS:0 "Rise as Duke of all Bavaria!"
 lbv_straubing_holland_legacy: "The Legacy of Straubing-Holland"
 lbv_straubing_holland_legacy_desc: "The legacy of Albert I, whose reach extended to the Low Countries — as the House of Landshut, inherit the memory of this vast inheritance."
 lbv_secure_landshut: "Develop Landshut"
 lbv_secure_landshut_desc: "Landshut, upstream on the Isar — develop this city of splendid Gothic architecture as the center of the duchy."
 lbv_danube_trade: "The Danube Trade"
 lbv_danube_trade_desc: "Merchant ships plying the Danube — make use of this vital waterway, and secure the wealth of trade."
 lbv_low_countries_ties: "Ties to the Low Countries"
 lbv_low_countries_ties_desc: "The legacy of Albert I, who once ruled Holland, Zeeland, and Hainaut — nurture our ties to the Low Countries even now."
 lbv_bavarian_ambition: "Ambition for a United Bavaria"
 lbv_bavarian_ambition_desc: "Landshut's development, the Danube trade, and ties to the Low Countries — build upon these, and harbor ambition for all of Bavaria."
 lbv_reunite_bavaria: "Reunite Bavaria"
 lbv_reunite_bavaria_desc: "The fractured duchy — reclaim the lands of Upper Bavaria, and unite Bavaria as one once more."
 lbv_duke_of_all_bavaria: "Duke of All Bavaria"
 lbv_duke_of_all_bavaria_desc: "Under the bloodline of the House of Landshut, all of Bavaria is at last united beneath a single banner."
 lbv_events.1.t: "Declaration of Bavarian Unity"
 lbv_events.1.d: "Under the bloodline of the House of Landshut, Bavaria is at last united as one. The age of division comes to an end."
 lbv_events.1.a: "Glory to Bavaria!"
 STATIC_MODIFIER_NAME_lbv_legacy_mod: "The Legacy of Straubing-Holland"
 STATIC_MODIFIER_DESC_lbv_legacy_mod: "The glory of Albert I, whose realm once embraced Holland and Hainaut, is still recounted with pride at the court of Landshut."
 STATIC_MODIFIER_NAME_lbv_landshut_mod: "Landshut Developed"
 STATIC_MODIFIER_DESC_lbv_landshut_mod: "The city of Gothic architecture flourishes as the center of the duchy."
 STATIC_MODIFIER_NAME_lbv_danube_mod: "The Danube Trade"
 STATIC_MODIFIER_DESC_lbv_danube_mod: "Barges plying the Danube valley unload salt and grain along the riverbanks of Lower Bavaria without pause."
 STATIC_MODIFIER_NAME_lbv_low_countries_mod: "Ties to the Low Countries"
 STATIC_MODIFIER_DESC_lbv_low_countries_mod: "Envoys and cloth merchants from the Low Countries beyond the northern sea are welcomed even at the court of Landshut."
 STATIC_MODIFIER_NAME_lbv_reunite_mod: "Bavaria Reunited"
 STATIC_MODIFIER_DESC_lbv_reunite_mod: "Vassals of the two once-divided branches now swear their oaths beneath a single banner."
 STATIC_MODIFIER_NAME_lbv_unify_bavaria_mod: "Duke of All Bavaria"
 STATIC_MODIFIER_DESC_lbv_unify_bavaria_mod: "The bells of Bavaria's towers ring out to proclaim the end of division."
 lbv_unified_duchy: "The Unified Duchy of Bavaria"
 lbv_unified_duchy_desc: "The age of division is over — as a unified Duchy of Bavaria, open a new era."
 lbv_bavaria_unified_tt: "Unified Bavaria"
 lbv_landrecht: "The Bavarian Landrecht"
 lbv_landrecht_desc: "One law for a unified duchy — enact the Bavarian legal code (Landrecht), and strengthen the foundation of governance."
 lbv_tyrol_ambition: "Ambition for Tyrol"
 lbv_tyrol_ambition_desc: "The County of Tyrol, cradled by the Alps — harbor ambition for this land."
 lbv_swabian_expansion: "Expansion into Swabia"
 lbv_swabian_expansion_desc: "Swabia, spreading to the southwest — strengthen our influence over this region."
 lbv_greater_bavaria: "Realize a Greater Bavaria"
 lbv_greater_bavaria_desc: "The legal code, Tyrol, and Swabia — build upon these, and realize a greater Bavaria."
 lbv_counter_reformation_leader: "Leader of the Counter-Reformation"
 lbv_counter_reformation_leader_desc: "Embody the spirit of the Council of Trent, and stand at the forefront of the Counter-Reformation."
 lbv_electoral_dignity: "Electoral Dignity"
 lbv_electoral_dignity_desc: "In 1623, Maximilian I at last secures the rank of Elector — make this honor the eternal pride of Bavaria."
 lbv_austrian_rivalry: "Rivalry with Austria"
 lbv_austrian_rivalry_desc: "Rivalry with the House of Habsburg over hegemony within the Empire — face this contest with our great rival."
 lbv_war_of_austrian_succession: "The War of the Austrian Succession"
 lbv_war_of_austrian_succession_desc: "The war over Charles VII's claim to the imperial throne — seize this succession war to raise Bavaria's prestige."
 lbv_imperial_crown: "The Imperial Crown"
 lbv_imperial_crown_desc: "In 1742, Charles VII, Duke of Bavaria, is crowned Holy Roman Emperor — the first non-Habsburg to wear the crown in centuries."
 lbv_enlightened_absolutism: "Enlightened Absolutism"
 lbv_enlightened_absolutism_desc: "An age of enlightenment valuing reason and learning — bring this new current of thought into Bavaria's governance."
 lbv_napoleonic_alliance: "Defiance of France"
 lbv_napoleonic_alliance_desc: "Europe shaken by revolution and the ambitions of Napoleon — Bavaria secures a claim to the throne of this powerful neighbor, and charts its own course."
 lbv_kingdom_of_bavaria: "The Kingdom of Bavaria Proclaimed"
 lbv_kingdom_of_bavaria_desc: "In 1806, Elector Maximilian IV Joseph proclaims himself King of Bavaria — the long history of the House of Wittelsbach reaches a new summit here."
 lbv_events.3.t: "The Imperial Crown"
 lbv_events.3.d: "In 1742, Charles VII, Duke of Bavaria, was crowned Holy Roman Emperor in the cathedral of Frankfurt. It has been centuries since anyone but a Habsburg wore the imperial crown."
 lbv_events.3.a: "Glory to His Imperial Majesty!"
 lbv_events.99.t: "Proclamation of the Kingdom of Bavaria"
 lbv_events.99.d: "In 1806, Elector Maximilian IV Joseph, under the Confederation of the Rhine, proclaimed himself King of Bavaria. The long history of the House of Wittelsbach reaches a new summit here."
 lbv_events.99.a: "Long live the Kingdom of Bavaria!"
 STATIC_MODIFIER_NAME_lbv_unified_mod: "The Unified Duchy of Bavaria"
 STATIC_MODIFIER_DESC_lbv_unified_mod: "No longer must the duchy divide its courts, its revenues, and its soldiers between rival branches."
 STATIC_MODIFIER_NAME_lbv_greater_mod: "A Greater Bavaria Realized"
 STATIC_MODIFIER_DESC_lbv_greater_mod: "From the Alpine foothills to the hills of Swabia, the lands beneath the ducal banner widen with every passing season."
 STATIC_MODIFIER_NAME_lbv_counter_reformation_mod: "Leader of the Counter-Reformation"
 STATIC_MODIFIER_DESC_lbv_counter_reformation_mod: "In the spirit of the Council of Trent, Jesuit colleges open one after another in the towns of the duchy."
 STATIC_MODIFIER_NAME_lbv_succession_war_mod: "The War of the Austrian Succession"
 STATIC_MODIFIER_DESC_lbv_succession_war_mod: "Officers and men hardened on the battlefields of the Austrian Succession now form the core of the ducal army."
 STATIC_MODIFIER_NAME_lbv_imperial_crown_mod: "The Imperial Crown"
 STATIC_MODIFIER_DESC_lbv_imperial_crown_mod: "The memory of the day the Duke of Bavaria was crowned in Frankfurt Cathedral is etched in pride upon every heart at court."
 STATIC_MODIFIER_NAME_lbv_enlightenment_mod: "Enlightened Absolutism"
 STATIC_MODIFIER_DESC_lbv_enlightenment_mod: "At court, new books arriving from France spread the ideals of the Enlightenment, and the number of schools grows year by year."
 STATIC_MODIFIER_NAME_lbv_electoral_dignity_mod: "Electoral Dignity"
 STATIC_MODIFIER_DESC_lbv_electoral_dignity_mod: "When the Duke, clad in the robes of an Elector, takes his place at an imperial election, the princes listen to his words with respect."
 STATIC_MODIFIER_NAME_lbv_kingdom_mod: "The Kingdom of Bavaria"
 STATIC_MODIFIER_DESC_lbv_kingdom_mod: "In the palace at Munich, salutes thunder to celebrate the crowning of the first King of Bavaria of the House of Wittelsbach."
