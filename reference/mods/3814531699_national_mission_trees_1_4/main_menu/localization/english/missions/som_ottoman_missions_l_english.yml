l_english:
 # === MISSION PACK ===
 som_ottoman_mission_pack_desc: "From a frontier beylik to the mightiest sultanate in the world. Consolidate Anatolia, cross into Rumelia, and claim Constantinople — the eternal city that shall be your throne."

 # === PHASE 1 ===
 som_tur_secure_bursa: "Secure Bursa"
 som_tur_secure_bursa_desc: "Bursa, the first great city of the Ottomans, must be firmly under dynastic control. Establish order and build the foundation of a lasting state."

 som_tur_frontier_warriors: "Forge the Frontier Warriors"
 som_tur_frontier_warriors_desc: "The ghazi warriors who carved out our beylik must be bound to the dynasty. Their fighting spirit is our greatest weapon."


 # === PHASE 2 ===
 som_tur_cross_the_straits: "Cross the Straits"
 som_tur_cross_the_straits_desc: "Secure Canakkale and open the road to Europe. A casus belli to conquer the province of Gallipoli will be granted as reward."

 som_tur_anatolian_heartland: "Consolidate Anatolia"
 som_tur_anatolian_heartland_desc: "Secure Ankara and set the course for its development as the heart of Anatolia. What this land comes to produce will shape the Empire's future."

 som_ottoman_events.18.t: "The Heart of Anatolia — The Future of Ankara"
 som_ottoman_events.18.d: "Ankara, the heartland city of Anatolia, has come under the Empire's control. The court debates what industry should define this region's future: refining its long tradition of weaving, planting mulberry trees for silk production, or cultivating vivid dye crops."
 som_ottoman_events.18.a: "Further develop the weaving industry"
 som_ottoman_events.18.b: "Plant mulberry trees and begin silk production"
 som_ottoman_events.18.c: "Promote the cultivation of dye crops"

 som_tur_vassalize_beyliks: "Conquest of the Beyliks"
 som_tur_vassalize_beyliks_desc: "The other Anatolian beyliks must bend the knee or be crushed. Only a unified Anatolia can challenge the powers to the east and west."

 # === PHASE 3 ===
 som_tur_siege_constantinople: "The Fall of Constantinople"
 som_tur_siege_constantinople_desc: "The eternal city, seat of the Eastern Roman Empire, must fall to Ottoman cannon and steel. Its conquest shall announce our empire to the world. The city's POP will be transformed under Ottoman rule."





 # === MODIFIERS ===

 STATIC_MODIFIER_NAME_som_tur_ghazi_warriors: "Ghazi Warriors"
 STATIC_MODIFIER_DESC_som_tur_ghazi_warriors: "'Ghazi' is the title of one who fights unbelievers in the name of Islam. From Osman Ghazi, founder of the dynasty, the frontier warriors pressed ever onward into the weakened borderlands of Byzantium with this sacred sense of mission. This religious fervor was the spiritual engine of Ottoman expansion."

 # === Events ===
 som_ottoman_events.1.t: "Bursa — Cradle of the Ottomans"
 som_ottoman_events.1.d: "Bursa, Iznik, and Nicomedia have fallen to Ottoman hands. In Bursa, Greek Orthodox, Armenian, Jewish, and Turkish Muslim communities live side by side under the new dynasty. The Sultan's court now faces a question: how should these diverse peoples be integrated into the Ottoman state?"
 som_ottoman_events.1.a: "Unite them under the banner of Islam and Turkish tradition"
 som_ottoman_events.1.a.tt: "Many POPs in Bursa will convert to Sunni and adopt Turkish culture."

 # === Event 2: Bursa silk ===

 # === Event 3: Smyrna ===

 # === Event 4: Fall of Constantinople ===
 som_ottoman_events.4.t: "The Fall of Constantinople"
 som_ottoman_events.4.d: "Constantinople has fallen. The last emperor of Byzantium, Constantine XI, fell in battle on the walls, and Mehmed II's armies entered the city. Where once the bells of Hagia Sophia rang out, the call to prayer now echoes. The Sultan declares the city renamed Kostantiniyye and proclaims it the new imperial capital."
 som_ottoman_events.4.a: "Transform the city into an Ottoman capital"
 som_ottoman_events.4.a.tt: "Most POPs in Constantinople will convert to Sunni and adopt Turkish culture."

 # === North Pack ===


 som_tur_conquer_bulgaria: "Conquer Bulgaria"
 som_tur_conquer_bulgaria_desc: "Tarnovo was the glorious capital of the Second Bulgarian Empire. Take this city and open the road north."

 som_tur_conquer_serbia: "Conquer Serbia"
 som_tur_conquer_serbia_desc: "Novo Brdo holds the greatest silver mines in the Balkans, while Skopje is the gateway to Macedonia. Secure both cities to bring southern Serbia under Ottoman control."


 som_tur_conquer_hungary: "Invade Hungary"
 som_tur_conquer_hungary_desc: "Shatter the Hungarian field army at Mohacs and occupy Buda. The Danube shall become the northern border of the Ottoman Empire."

 som_tur_siege_vienna: "The Siege of Vienna"
 som_tur_siege_vienna_desc: "Plant the Ottoman banner before the walls of Vienna. The world shall witness the might of the Ottoman Empire."

 # === South Pack ===

 som_tur_anatolia_unified: "Anatolian Unity"
 som_tur_anatolia_unified_desc: "Conquer Trebizond and Erzurum to bring all of Anatolia under Ottoman rule. The Pontic mountains mark the empire's eastern boundary."

 som_tur_conquer_syria: "Into Syria"
 som_tur_conquer_syria_desc: "Conquer Aleppo and Damascus. Syria is the heart of Islamic scholarship and commerce; its capture raises the empire's prestige."

 som_tur_defeat_mamluks: "Defeat the Mamluks"
 som_tur_defeat_mamluks_desc: "While at war with the Mamluks, occupy Cairo to force a favorable peace. With Cairo under occupation, the Mamluks can be compelled to accept vassalage."

 som_tur_holy_cities: "The Holy Cities"
 som_tur_holy_cities_desc: "Secure Jerusalem and proclaim the Sultan as Caliph. As guardian of the two holy cities, the Ottomans stand at the apex of the Islamic world."

 som_tur_red_sea_dominance: "Red Sea Dominance"
 som_tur_red_sea_dominance_desc: "Secure Alexandria and master the Red Sea trade routes. The wealth of the Indian Ocean trade fills the Ottoman treasury."

 som_tur_age_of_suleiman: "Pax Ottomana"

 # === Events 5-11 ===







 # === New modifiers ===


 STATIC_MODIFIER_NAME_som_tur_danube_frontier: "Danube Frontier"
 STATIC_MODIFIER_DESC_som_tur_danube_frontier: "The Danube has been established as the northern border, and the lessons of the Ottoman army that stood before Vienna's gates are inscribed in imperial doctrine."

 STATIC_MODIFIER_NAME_som_tur_anatolia_unified_mod: "Anatolia Unified"
 STATIC_MODIFIER_DESC_som_tur_anatolia_unified_mod: "From Trebizond to Erzurum, all of Anatolia is under Ottoman control. The empire's eastern foundation is secure, improving tax income and legitimacy."


 STATIC_MODIFIER_NAME_som_tur_red_sea_trade: "Imperial Road Network"
 STATIC_MODIFIER_DESC_som_tur_red_sea_trade: "The Red Sea was the golden route by which the spices, silks, and dyes of India and Southeast Asia traveled to Europe. Even after Portugal opened the new route around the southern tip of Africa, the Red Sea route via Cairo and Alexandria kept its value, and the Ottoman Empire became the greatest beneficiary of this trade route."

 # === Crimea / Black Sea ===
 som_tur_fate_of_crimea: "The Fate of Crimea"
 som_tur_fate_of_crimea_desc: "The Crimean peninsula, with the Genoese trading post of Kaffa at its heart, controls trade along the northern Black Sea. Secure this region and bring the Black Sea trade under Ottoman control."

 som_tur_black_sea_dominance: "Mastery of the Black Sea"
 som_tur_black_sea_dominance_desc: "With Crimea secured, Edirne consolidated, and Anatolia unified, the Black Sea has become an Ottoman lake. Develop Constantinople's RGO and establish complete Black Sea hegemony."

 # === Italy ===
 som_tur_italy_south: "Southern Italy"
 som_tur_italy_south_desc: "Conquer Naples and Sicily to seize the center of the Mediterranean. These ancient trading cities will fill the imperial coffers."

 som_tur_italy_north: "Italy Conquered"
 som_tur_italy_north_desc: "Conquer Rome, Florence, and Milan to complete the conquest of the Italian peninsula. The Pope's city, the Medici's city, the Visconti's city — all become the Sultan's."

 # === Arabia / Persian Gulf ===
 som_tur_arabia_conquest: "Mastery of Arabia"
 som_tur_arabia_conquest_desc: "Secure Mecca, Medina, and Suez to control the holy cities of the Islamic world and the gateway to the Indian Ocean."

 som_tur_persian_gulf: "The Persian Gulf"
 som_tur_persian_gulf_desc: "Seize Hormuz and master the Persian Gulf trade routes. The wealth of the Indian Ocean trade flows into the Ottoman treasury."

 # === North Africa ===
 som_tur_north_africa: "The Maghreb"
 som_tur_north_africa_desc: "Conquer Tunis, Algiers, and Tripoli to bring the southern Mediterranean coast under Ottoman rule. The Barbary corsairs bow to the Sultan's banner."

 som_tur_morocco: "Morocco"
 som_tur_morocco_desc: "Conquer Fez and Marrakesh to add all of North Africa to the Ottoman Empire. The shores of the Atlantic become the empire's western border."

 # === FINAL update ===
 som_tur_age_of_suleiman_desc: "From Vienna in the north to Arabia and Morocco in the south — a world empire spanning three continents is complete. Requires the Siege of Vienna, Persian Gulf, and Morocco all to be completed."

 # === Events 12-17 ===






 # === New modifiers ===

 STATIC_MODIFIER_NAME_som_tur_black_sea_master: "Master of the Black Sea"
 STATIC_MODIFIER_DESC_som_tur_black_sea_master: "The Black Sea is now an Ottoman lake. In light of this achievement, the court debates the introduction of new governing institutions, opening room for a fresh reform."

 STATIC_MODIFIER_NAME_som_tur_italy_south_mod: "Southern Italian Dominion"
 STATIC_MODIFIER_DESC_som_tur_italy_south_mod: "By controlling Naples and Sicily, the central Mediterranean has passed into Ottoman hands. Trade income and diplomatic reputation are improved."


 STATIC_MODIFIER_NAME_som_tur_arabia_mod: "Guardian of Arabia"
 STATIC_MODIFIER_DESC_som_tur_arabia_mod: "'Custodian of the Two Holy Mosques' — Mecca and Medina are the two holiest places of Islam. In 1517 Selim I conquered Egypt and the Hijaz and took these places into his hands, and the Ottoman sultan became the religious protector of the entire Sunni Muslim world. The duty and honor of guarding the annual Hajj pilgrimage was bestowed upon the sultan."

 STATIC_MODIFIER_NAME_som_tur_gulf_trade: "Persian Gulf Commercial Dominance"
 STATIC_MODIFIER_DESC_som_tur_gulf_trade: "The Strait of Hormuz is the only gateway through which the spices and silks of India and Southeast Asia pass into the Persian Gulf. To command this 'throat of the world' would be the decisive trump card against the Indian Ocean trade route Portugal sought to establish around Africa."


 STATIC_MODIFIER_NAME_som_tur_africa_final_mod: "African Hegemony"
 STATIC_MODIFIER_DESC_som_tur_africa_final_mod: "North Africa conquered. Elite cavalry from the deserts and steppes join the Ottoman army, improving both light and heavy cavalry power."


 STATIC_MODIFIER_NAME_som_tur_ankara_fine_cloth: "Ankara's Weaving Trade"
 STATIC_MODIFIER_DESC_som_tur_ankara_fine_cloth: "In Ankara's workshops, traditional weaving techniques are further refined, increasing fine cloth production."

 STATIC_MODIFIER_NAME_som_tur_ankara_silk: "Ankara's Silk Trade"
 STATIC_MODIFIER_DESC_som_tur_ankara_silk: "Mulberry trees are planted across Ankara's farmlands, increasing silk production."

 STATIC_MODIFIER_NAME_som_tur_ankara_dyes: "Ankara's Dye Trade"
 STATIC_MODIFIER_DESC_som_tur_ankara_dyes: "The cultivation of vivid dye plants spreads around Ankara, increasing dye production."



 # === Subject types ===
 eyalet: "Eyalet"
 eyalet_desc: "A provincial subject state of the Ottoman Empire. Subject to tighter control than a vassal, paying double tribute and subject to diplomatic annexation at twice the speed."
 eyalet_plural: "Eyalets"

 # === Schism branch missions ===

 # === Faith choice ===

 # === Event 22 ===

 som_ottoman_events.20.t: "Mastery of the Black Sea"
 som_ottoman_events.20.d: "The Black Sea was once a Genoese lake. But with the fall of Caffa in 1475 and Ottoman control of the Bosphorus, the last Genoese stronghold has vanished. The Black Sea is now an Ottoman lake. Three centuries of Venetian and Genoese commercial dominance over the eastern Mediterranean comes to an end."
 som_ottoman_events.20.a: "The Black Sea is an Ottoman lake"
 som_ottoman_events.30.t: "The Gates of Vienna"
 som_ottoman_events.30.d: "The army of Suleiman the Magnificent has reached Vienna. Three hundred thousand Ottoman soldiers have shaken all Christendom. In 1529 the city held against early winter and overextended supply lines — but this time is different. 'If Vienna falls, Europe is ours,' the Sultan declares."
 som_ottoman_events.30.a: "Seize Vienna and become master of Europe"
 som_ottoman_events.99.t: "The Age of Suleiman"
 som_ottoman_events.99.d: "The Ottoman Empire has reached its zenith — the Age of Suleiman the Magnificent. From the Balkans to Arabia, from Crimea to North Africa, a dominion surpassing even Rome bends to a single Sultan's will. Called 'the Lawgiver' (Kanuni) for codifying Ottoman law, Suleiman presides over the greatest flowering of art, architecture, and military power in the empire's history. Istanbul's mosques, palaces, and bazaars proclaim the glory of the world's greatest city. The Ottoman Empire has become one of history's supreme powers."
 som_ottoman_events.99.a: "The golden age of the great Ottoman Empire begins"

 som_tur_edirne_capital: "Fortress of Edirne"
 som_tur_edirne_capital_desc: "Ancient Hadrianopolis became Edirne when Murad I made it the Ottoman capital in 1363 — the base from which to conquer the Balkans. It remained the imperial capital for nearly ninety years until Constantinople fell in 1453, and it was here that Mehmed II was born. Fortify this city as the anchor of Rumelia and the springboard for the conquest of the Balkans."
 som_tur_aegean_dominance: "Mastery of the Aegean"
 som_tur_aegean_dominance_desc: "The Aegean was a battleground for Venetian and Genoese commercial rivalries. Seizing Smyrna as the cornerstone of the eastern Aegean coast and building a naval force gives Ottomans the foothold for all Mediterranean expansion. The early Ottoman navy must be built from scratch — but it will grow to be a formidable force."

 som_tur_janissary_corps: "The Janissary Corps"
 som_tur_janissary_corps_desc: "In the mid-14th century, Orhan I's son Murad I created the Janissaries — 'new soldiers' formed from Christian boys seized under the devshirme system, converted to Islam, and trained to be the Sultan's loyal standing infantry. Regularly paid and rigorously disciplined, the Janissaries became the backbone of the Ottoman army and played a decisive role in the fall of Constantinople and countless other battles."
 som_tur_devshirme_system: "The Devshirme System"
 som_tur_devshirme_system_desc: "The devshirme ('collection of boys') seized Christian youths from the Balkans, converted them to Islam, and trained them as Janissaries and palace officials. The system created a class of officials loyal solely to the Sultan, unbound by tribal or family allegiances. From this class came many of the Empire's greatest Grand Viziers — men who rose from captivity to the highest office in the land."
 som_tur_elite_guard: "The Elite Guard"
 som_tur_elite_guard_desc: "The Sultan's personal guard — selected from the finest Janissaries — were the most disciplined soldiers in the empire. They served as palace sentinels and carried the imperial standard on campaign. Investing in rigorous training and high standards creates the core of a professional fighting force that will carry the empire to glory."
 som_tur_kanun_i_osmani: "Kanun-i Osmani"
 som_tur_kanun_i_osmani_desc: "The Kanun-i Osmani ('Ottoman Law Code') was a secular legal system developed alongside sharia. The Sultan 'Kanuni' (the Lawgiver) Suleiman I completed its codification, but its foundations were laid in the 14th and 15th centuries. Covering tax law, criminal procedure, and administration, the kanun gave the Ottoman state a rationalized legal framework that operated alongside — and complemented — Islamic holy law."
 som_tur_imperial_army: "The Imperial Army"
 som_tur_imperial_army_desc: "Janissaries, Sipahi cavalry, Azaps, Akıncı light cavalry — the Ottoman army was a combined-arms system that integrated multiple troop types under centralized command. Disciplined, paid, and increasingly armed with gunpowder weapons, the Ottoman army of the 16th century was among the most formidable military machines the world had ever seen. Bring it to its full potential."
 som_tur_timar_system: "The Timar System"
 som_tur_timar_system_desc: "The timar was the foundational land-tenure institution of the Ottoman state. The Sultan granted conquered land to Sipahi cavalrymen as timars in exchange for military service — similar to European feudalism, but without hereditary rights. The timar system financed a large military force without draining the imperial treasury, making Ottoman expansion self-funding in its early phases."
 som_tur_sipahi_cavalry: "The Sipahi Cavalry"
 som_tur_sipahi_cavalry_desc: "The Sipahi — armored cavalrymen funded by timar land grants — formed the main striking force of the Ottoman army in the 15th and 16th centuries. Their thunderous charges were feared across the Balkans and Anatolia. As the empire expanded, the Sipahi class became a powerful provincial aristocracy whose interests the Sultan had to carefully manage."
 som_tur_eyalet_system: "The Eyalet System"
 som_tur_eyalet_system_desc: "An eyalet ('province') was the Ottoman Empire's largest administrative unit, governed by a Beylerbeyi appointed directly by the Sultan. Rumelia, Anatolia, Egypt, Syria — each eyalet was a miniature empire with its own military contingent and administrative apparatus. The system extended imperial authority to the furthest corners of the realm without requiring the Sultan's personal presence."
 som_tur_grand_vizier: "The Grand Vizier"
 som_tur_grand_vizier_desc: "The Grand Vizier (Sadrazam) was the empire's chief administrator, second only to the Sultan. His residence — the 'Sublime Porte' (Bab-i Ali) — became synonymous with the Ottoman government itself and was the address to which European diplomats presented their credentials. An able Grand Vizier could effectively run the empire, allowing the Sultan to focus on legitimacy and military command."
 som_tur_imperial_bureaucracy: "Imperial Bureaucracy"
 som_tur_imperial_bureaucracy_desc: "The Ottoman bureaucracy — a blend of devshirme officials and traditional Turkish-Islamic administrators — was one of the most sophisticated governmental systems of its age. Document culture, centralized record-keeping, and specialized ministries (divans) made the vast empire surprisingly manageable. The sheer quantity of records kept by Ottoman scribes remains a treasure trove for historians today."
 som_tur_new_capital: "The Development of Kostantiniyye"
 som_tur_new_capital_desc: "Mehmed II renamed the conquered city 'Kostantiniyye' and immediately launched an ambitious redevelopment program. Forced resettlement of craftsmen and merchants, rebuilding of infrastructure, and restoration of its markets transformed a city of ruins into a thriving metropolis. The Sultan demanded that Kostantiniyye surpass the glory of the Byzantine capital it replaced — and directed the full resources of the empire toward making it so."
 som_tur_new_capital_unlock_tt: "The decision 'The Redevelopment of Kostantiniyye' is now available."
 som_develop_kostantiniyye_decision.title: "The Redevelopment of Kostantiniyye"
 som_develop_kostantiniyye_decision.desc: "The conquered capital has grown, but its quarters still bear the scars of the siege. The Sultan's treasury can pay for resettlement, new markets and rebuilt streets, so that Kostantiniyye prospers once more."
 som_develop_kostantiniyye_decision.a: "Spend on rebuilding the capital."
 som_expand_kostantiniyye_decision.title: "Lead Kostantiniyye to Splendor"
 som_expand_kostantiniyye_decision.desc: "The rebuilding has borne fruit: settlers and craftsmen fill the new quarters. With greater investment in workshops, caravanserais and the lands around the city, Kostantiniyye can surpass even the glory of the Byzantine capital."
 som_expand_kostantiniyye_decision.a: "Invest in the city's greatness."
 som_tur_grand_bazaar: "The Grand Bazaar"
 som_tur_grand_bazaar_desc: "Built by order of Mehmed II between 1455 and 1461, the Grand Bazaar (Kapalıçarşı) was among the world's first enclosed markets and quickly became the world's largest. Four thousand shops selling silk, spices, jewels, ceramics, and weapons drew tens of thousands of buyers each day. At its center, the gold and silver merchants' hall — the Bedesten — served as the empire's commercial heart."
 som_tur_grand_bazaar_condition_tt: "Used the decision 'Lead Kostantiniyye to Splendor'"
 som_tur_suleiman_mosque: "The Süleymaniye Mosque"
 som_tur_suleiman_mosque_desc: "Designed by the master architect Sinan and completed in 1557, the Süleymaniye Mosque is the masterpiece of Ottoman architecture. Four minarets pierce the Istanbul skyline; the vast dome dominates the city's silhouette from the Bosphorus. Its surrounding complex (külliye) included colleges, a hospital, shops, and a caravanserai — a city within a city, embodying the Ottoman ideal of imperial patronage."
 som_tur_topkapi_palace: "Topkapı Palace"
 som_tur_topkapi_palace_desc: "Topkapı Palace — perched on the promontory commanding the Bosphorus, the Golden Horn, and the Sea of Marmara — served as the Ottoman court for four centuries. Sultan's quarters, the imperial harem, the treasury, and the council chamber (Divan-ı Hümayun) were all contained within its four courtyards. Every Grand Vizier was appointed and dismissed here; every campaign was launched from its shadow."
 som_tur_city_of_worlds_desire: "City of the World's Desire"
 som_tur_ulema_authority: "Authority of the Ulema"
 som_tur_ulema_authority_desc: "The ulema — Islamic scholars who served as judges, legal advisors, and teachers — provided the Ottoman state with its religious legitimacy. As kadis (judges), muftis (legal consultants), and madrasa professors, they administered justice and education across the empire. Their endorsement was essential for any major policy — including declarations of war — to be seen as legitimate by the Muslim population."
 som_tur_millet_system: "The Millet System"
 som_tur_millet_system_desc: "The millet ('nation' or 'community') system organized the Ottoman Empire's non-Muslim subjects into semi-autonomous religious communities. The Greek Orthodox Rum Millet, the Armenian Millet, and the Jewish Millet each had their own courts, schools, and charitable institutions led by their own religious heads. This remarkable system of managed pluralism allowed the empire to govern enormous diversity without requiring forced conversion."
 som_tur_kadi_courts: "The Kadi Courts"
 som_tur_kadi_courts_desc: "Kadis — judges appointed directly by the Sultan — administered Islamic law across the empire from major cities to remote villages. Their court records (sicils) documented not just legal disputes but contracts, property deeds, and social interactions, creating an extraordinarily detailed portrait of Ottoman society. The kadi system extended the rule of law — Ottoman law — to every corner of the realm."
 som_tur_sufi_culture: "Sufi Culture"
 som_tur_sufi_culture_desc: "Sufi orders (tarikas) were woven into the fabric of Ottoman society. The Mevlevi order — famous for their whirling dervishes — patronized by the court. The Bektashi order — spiritual backbone of the Janissaries. The Naqshbandi order — influential in palace politics. Sufi mysticism shaped Ottoman poetry, music, and art, and provided a spiritual counterweight to legalistic interpretation of Islam."
 som_tur_cultural_synthesis: "Cultural Synthesis"
 som_tur_cultural_synthesis_desc: "The Ottoman Empire absorbed rather than destroyed the cultures it conquered. Byzantine administrative systems, Arab scholarship, Persian court culture, and Turkish military tradition fused into a distinctive 'Ottoman civilization.' This cultural synthesis was not merely decorative — it was the empire's governing philosophy, allowing it to absorb and harness the energies of dozens of conquered peoples."
 som_tur_bursa_silk_industry: "Bursa's Silk Industry"
 som_tur_bursa_silk_industry_desc: "Bursa, the first Ottoman capital, developed into the empire's silk capital from the 14th century onward. Craftsmen who had previously worked under Byzantine patronage found new employers in the Ottoman court, producing luxury silks for export throughout Europe and the Middle East. 'City of Silk' became Bursa's identity — a commercial success that helped fund Ottoman expansion."
 som_tur_silk_road: "The Silk Road"
 som_tur_silk_road_desc: "Trebizond was the western terminus of the Caspian Sea trade route — the channel through which silk, spices, and luxury goods from Central Asia entered Anatolia. Controlling this port city gave the Ottomans a stranglehold on overland commerce between Asia and Europe. The revenues from trade passing through Trebizond alone helped finance imperial ambitions for generations."
 som_tur_ankara_prosperity: "The Prosperity of Ankara"
 som_tur_ankara_prosperity_desc: "Ankara was the central Anatolian hub of overland trade — a city that had served merchants for millennia. Its Angora goat wool gave birth to the luxury fiber whose name (Angora, later Ankara) became synonymous with softness. Dye plants, wool processing, and its position on the route connecting Bursa to Trebizond made it an indispensable node in the Ottoman commercial network."
 som_tur_trade_routes: "Imperial Trade Routes"
 som_tur_trade_routes_desc: "As the empire expanded, the Ottomans invested in caravanserais (roadside inns), paved roads, bridges, and naval patrols against pirates. The result was a commercial infrastructure that made overland and maritime trade safer and more profitable than it had been since the height of the Roman Empire. Constantinople at the center of a radiating trade network became the beating economic heart of three continents."
 som_tur_commercial_empire: "Commercial Empire"
 som_tur_commercial_empire_desc: "Aleppo, Alexandria, Constantinople — three of the greatest commercial cities in the world, now all Ottoman. The spices of India, the silks of China, the silver of Europe all passed through Ottoman hands on their way from producer to consumer. The empire took a cut of every transaction. Even when the Portuguese opened the sea route around Africa, Ottoman intermediaries retained enormous commercial leverage for another century."
 STATIC_MODIFIER_NAME_som_tur_janissary_mod: "The Janissary Corps"
 STATIC_MODIFIER_DESC_som_tur_janissary_mod: "The Janissaries — elite standing infantry formed from converted Christian boys — became the backbone of the Ottoman military. Their distinctive white caps and blue uniforms were the most feared sight on 15th-century battlefields. Their role in the fall of Constantinople was decisive."
 STATIC_MODIFIER_NAME_som_tur_devshirme_mod: "The Devshirme System"
 STATIC_MODIFIER_DESC_som_tur_devshirme_mod: "The devshirme created a class of officials loyal solely to the Sultan, unbound by family or tribal loyalties. This meritocratic (by Ottoman standards) system allowed men of humble Christian origins to rise to the empire's highest offices — while ensuring the Sultan always had an alternative power base to the established Turkish nobility."
 STATIC_MODIFIER_NAME_som_tur_elite_guard_mod: "The Elite Guard"
 STATIC_MODIFIER_DESC_som_tur_elite_guard_mod: "Selected from the finest Janissaries, the Sultan's personal guard were the most disciplined troops in the empire. They represented not just military might but the symbolic authority of the Sultanate — their presence on campaign was a statement that the Sultan's person was present, even when he was not."
 STATIC_MODIFIER_NAME_som_tur_kanun_mod: "Kanun Law Code"
 STATIC_MODIFIER_DESC_som_tur_kanun_mod: "The kanun — secular Ottoman law — operated alongside sharia to create a dual legal system covering tax, criminal procedure, and administration. The Sultan's legislative authority to create secular law was a theological innovation that gave the Ottoman state flexibility that purely sharia-based polities lacked."
 STATIC_MODIFIER_NAME_som_tur_imperial_army_mod: "The Imperial Army"
 STATIC_MODIFIER_DESC_som_tur_imperial_army_mod: "The fully developed Ottoman army — combining Janissary infantry, Sipahi cavalry, and the most sophisticated artillery train in the world — was the military marvel of the 16th century. Its combination of discipline, firepower, and logistical organization made it capable of campaigns on a scale no European power could match."
 STATIC_MODIFIER_NAME_som_tur_timar_mod: "The Timar System"
 STATIC_MODIFIER_DESC_som_tur_timar_mod: "By granting conquered land as non-hereditary timars to Sipahi cavalry in exchange for military service, the Ottomans financed their army without depleting the treasury. The Sultan retained ultimate ownership of all timar land, giving him leverage over the military class that European monarchs could only envy."
 STATIC_MODIFIER_NAME_som_tur_sipahi_mod: "Sipahi Cavalry"
 STATIC_MODIFIER_DESC_som_tur_sipahi_mod: "The armored Sipahi cavalrymen funded by timar grants were the Ottoman army's primary striking force in the 15th and 16th centuries. Their thunderous charges shattered armies from the Balkans to the Persian frontier. As the empire matured, the Sipahi class became a powerful provincial aristocracy with its own political interests."
 STATIC_MODIFIER_NAME_som_tur_eyalet_mod: "The Eyalet System"
 STATIC_MODIFIER_DESC_som_tur_eyalet_mod: "The eyalet system — with a Sultan-appointed Beylerbeyi governing each major province — extended Ottoman administrative reach across an enormous geographic space. Each eyalet was effectively a miniature empire, with its own military contingent, treasury, and court, feeding resources and troops to the center."
 STATIC_MODIFIER_NAME_som_tur_vizier_mod: "The Grand Vizier"
 STATIC_MODIFIER_DESC_som_tur_vizier_mod: "The Grand Vizier's residence — the Sublime Porte — became the address at which European ambassadors conducted Ottoman diplomacy. The Divan he chaired was the empire's policy-making body. An able Grand Vizier could run the empire effectively for decades; an incompetent one could bring it to the brink of collapse."
 STATIC_MODIFIER_NAME_som_tur_bureaucracy_mod: "Imperial Bureaucracy"
 STATIC_MODIFIER_DESC_som_tur_bureaucracy_mod: "Ottoman scribal culture produced a paper record of staggering quantity and detail. Land registers, tax surveys, court records, and imperial orders created an administrative infrastructure that made the Ottoman Empire one of the best-documented states in pre-modern history."
 STATIC_MODIFIER_NAME_som_tur_mosque_mod: "The Süleymaniye Mosque"
 STATIC_MODIFIER_DESC_som_tur_mosque_mod: "Sinan's masterpiece announced to the world that the Ottomans were the inheritors of Rome, Byzantium, and the highest Islamic civilization simultaneously. Its dome competed with Hagia Sophia on the Istanbul skyline — a deliberate architectural conversation between the old Christian empire and the new Muslim one."
 STATIC_MODIFIER_NAME_som_tur_topkapi_mod: "Topkapı Palace"
 STATIC_MODIFIER_DESC_som_tur_topkapi_mod: "Topkapı was the nerve center of an empire spanning three continents. Every Sultan was crowned here; every campaign was launched from its gates; every Grand Vizier served at its pleasure. The harem within its walls shaped succession politics for centuries."
 STATIC_MODIFIER_NAME_som_tur_ulema_mod: "Authority of the Ulema"
 STATIC_MODIFIER_DESC_som_tur_ulema_mod: "The ulema provided the Ottoman state with its religious legitimacy. Their endorsement of the Sultan's wars as jihad, their management of the sharia court system, and their staffing of the madrasa educational network made them indispensable partners in Ottoman governance."
 STATIC_MODIFIER_NAME_som_tur_millet_mod: "The Millet System"
 STATIC_MODIFIER_DESC_som_tur_millet_mod: "Organized religious pluralism — Christians, Jews, and Muslims living under a single imperial umbrella, each governing their own communal affairs — was the Ottoman solution to the problem of governing a diverse empire. It was not equality, but it was a form of coexistence that sustained the empire for centuries."
 STATIC_MODIFIER_NAME_som_tur_kadi_mod: "The Kadi Courts"
 STATIC_MODIFIER_DESC_som_tur_kadi_mod: "Kadi courts extended Ottoman rule of law to every corner of the empire, from Istanbul to remote Anatolian villages. The sicil records they generated are a historian's treasure: tens of thousands of volumes documenting property disputes, marriages, commercial contracts, and criminal cases across centuries."
 STATIC_MODIFIER_NAME_som_tur_sufi_mod: "Sufi Culture"
 STATIC_MODIFIER_DESC_som_tur_sufi_mod: "Sufi orders provided spiritual depth to Ottoman religious life that formal legalistic Islam could not supply. The whirling Mevlevis, the military Bektashis, the politically connected Naqshbandis — each order occupied a distinctive niche in Ottoman society, and together they wove a web of spiritual community across the entire empire."
 STATIC_MODIFIER_NAME_som_tur_synthesis_mod: "Cultural Synthesis"
 STATIC_MODIFIER_DESC_som_tur_synthesis_mod: "The Ottoman talent for absorption rather than destruction made the empire a cultural sponge. Byzantine administrative expertise, Persian literary culture, Arab scientific tradition, and Turkish martial energy all flowed together into something that was distinctively — and magnificently — Ottoman."
 STATIC_MODIFIER_NAME_som_tur_bursa_silk_trade: "Bursa's Silk Industry"
 STATIC_MODIFIER_DESC_som_tur_bursa_silk_trade: "Bursa became the empire's silk capital — a role it retained for centuries. The city's craftsmen produced luxury silks that graced the courts of Europe and the Middle East alike, and its revenues helped fund the campaigns that built the empire."
 STATIC_MODIFIER_NAME_som_tur_trade_empire_mod: "Imperial Trade Routes"
 STATIC_MODIFIER_DESC_som_tur_trade_empire_mod: "Caravanserais, roads, and the suppression of piracy invigorated trade within the empire. A radial trading network centered on Constantinople brought economic integration."
 STATIC_MODIFIER_NAME_som_tur_istanbul_glory_mod: "City of the World's Desire"
 STATIC_MODIFIER_DESC_som_tur_istanbul_glory_mod: "Istanbul — straddling two continents, commanding the only passage between the Black Sea and the Mediterranean — was the city the whole world desired. Its population, its commerce, its architecture, and its political significance made it the undisputed capital of the known world."
 som_ottoman_events.50.t: "City of the World's Desire"
 som_ottoman_events.50.d: "Constantinople — Istanbul — has become, truly and completely, the city the whole world desires. Its population of half a million makes it the largest city in Europe and the Middle East combined. It straddles two continents. It controls the only sea passage between the Black Sea and the Mediterranean. The Süleymaniye Mosque's graceful silhouette and Topkapı Palace's commanding height reflect in the waters of the Bosphorus. In its courts, poets compete with philosophers, and architects rival scientists. Ottoman civilization has reached its zenith. This city will shine for a thousand years."
 som_ottoman_events.50.a: "Let Istanbul shine for a thousand years!"
 som_ottoman_events.50.breadbasket_tt: "The town right 'Ottoman Imperial Breadbasket' is now available. It can be granted to city-rank or higher locations that have a granary of level 5 or above."
 STATIC_MODIFIER_NAME_som_tur_constantinople_dev_mod: "Development of Kostantiniyye"
 STATIC_MODIFIER_DESC_som_tur_constantinople_dev_mod: "Under Mehmed II's command, resettlement and rebuilding go on; the voices of new inhabitants fill the markets, and restored stonework returns a new luster to the former imperial city."
 STATIC_MODIFIER_NAME_som_tur_constantinople_splendor_mod: "The Splendor of Kostantiniyye"
 STATIC_MODIFIER_DESC_som_tur_constantinople_splendor_mod: "New workshops, caravanserais and quarters rise around the Golden Horn; settlers and craftsmen flock to the city, and the lands behind it yield more than ever. The Sultan's capital again outshines every city of the known world."

 STATIC_MODIFIER_NAME_som_tur_trebizond_trade_mod: "Trebizond — Gateway of the Silk Road"
 STATIC_MODIFIER_DESC_som_tur_trebizond_trade_mod: "At the port of Trebizond on the southern Black Sea shore, the loads of caravans that came down the Silk Road from Central Asia and the Caspian are piled high, awaiting ships bound for the Mediterranean."
 STATIC_MODIFIER_NAME_som_tur_commercial_empire_mod: "Commercial Empire"
 STATIC_MODIFIER_DESC_som_tur_commercial_empire_mod: "Aleppo, Alexandria, Constantinople — the wealth of three continents now flows through the sultan's markets."
 STATIC_MODIFIER_NAME_som_tur_grand_bazaar_loc_mod: "The Grand Bazaar"
 STATIC_MODIFIER_DESC_som_tur_grand_bazaar_loc_mod: "Along the covered streets of the Kapalıçarşı, the calls of goldsmiths and spice merchants never cease, and the goods of the whole world gather here."

 som_ottoman_events.19.t: "The Commercial Destiny of Smyrna"
 som_ottoman_events.19.d: "Smyrna (İzmir) is the greatest port city on the eastern Aegean coast — the gateway connecting Anatolia's hinterland to the Mediterranean world. Greek colonists founded it in antiquity; now it belongs to the Ottomans. The Sultan must decide the city's future direction: develop it as a thriving commercial hub attracting merchants from across the known world, or invest in shipbuilding to project Ottoman power across the Aegean?"
 som_ottoman_events.19.a: "Develop Smyrna's merchant quarter and make it a commercial center"
 som_ottoman_events.19.b: "Build a shipyard in Smyrna and use it as a naval base for Aegean expansion"
 STATIC_MODIFIER_NAME_som_tur_anatolian_heartland_mod: "Mastery of Anatolia"
 STATIC_MODIFIER_DESC_som_tur_anatolian_heartland_mod: "From Konya to Trebizond, the sultan's tax collectors and officials reach the villages of Anatolia, and imperial rule extends to every corner of the plateau."
 STATIC_MODIFIER_NAME_som_tur_crimea_dominance: "Dominance of the Crimea"
 STATIC_MODIFIER_DESC_som_tur_crimea_dominance: "Looking across the Black Sea from the harbor of Caffa, only ships flying the Ottoman flag cut the waves. The Black Sea is becoming an 'Ottoman lake.'"

 STATIC_MODIFIER_NAME_som_tur_aleppo_learning_mod: "The Learning of Aleppo"
 STATIC_MODIFIER_DESC_som_tur_aleppo_learning_mod: "Aleppo was among the great intellectual centers of the Islamic world. Renowned madrasas, libraries, and scholars concentrated here bring an infusion of Arab scholarly tradition to the Ottoman Empire."
 STATIC_MODIFIER_NAME_som_tur_damascus_learning_mod: "The Learning of Damascus"
 STATIC_MODIFIER_DESC_som_tur_damascus_learning_mod: "Damascus carries the accumulated intellectual heritage of the Umayyad, Abbasid, and Mamluk periods. Under Ottoman rule this rich legacy continues to grow."
 STATIC_MODIFIER_NAME_som_tur_caliph_successor: "Successor to the Caliphate"
 STATIC_MODIFIER_DESC_som_tur_caliph_successor: "The name of the sultan, now guardian of the holy places, is invoked from the pulpits as caliph."
 STATIC_MODIFIER_NAME_som_tur_aegean_shipbuilding_mod: "Aegean Shipbuilding Techniques"
 STATIC_MODIFIER_DESC_som_tur_aegean_shipbuilding_mod: "Shipwrights from the Aegean islands bring the crafts handed down through generations to the shipyards of Istanbul, and keel after keel is laid."

 som_ottoman_events.61.t: "The Battle of Marj Dabiq"
 som_ottoman_events.61.d: "In 1516, Sultan Selim I destroyed the Mamluk army of Sultan Qansuh al-Ghawri on the plains of Marj Dabiq. Qansuh himself fell on the field; all Syria passed into Ottoman hands. With Cairo occupied, the fate of the Mamluk Sultanate lies in Ottoman hands."
 som_ottoman_events.61.a: "Absorb the Mamluk Sultanate as an eyalet through negotiated peace"
 som_ottoman_events.61.b: "Make peace and allow them to retain independence"

 STATIC_MODIFIER_NAME_som_tur_edirne_trade_mod: "Edirne — Trading Hub"
 STATIC_MODIFIER_DESC_som_tur_edirne_trade_mod: "Edirne (Hadrianopolis) is the commercial center of Rumelia. This city connecting the Balkans and Anatolia is developed as a production hub for dyes, silk, and fine cloth, supporting the early Ottoman fiscal base."
 STATIC_MODIFIER_NAME_som_tur_novo_brdo_silver_mod: "The Silver Mines of Novo Brdo"
 STATIC_MODIFIER_DESC_som_tur_novo_brdo_silver_mod: "Novo Brdo ('New Hill') possesses the largest silver mines in the Balkans. Even after Ottoman conquest in the 1450s, its rich mines continued to enrich the imperial treasury. Monthly prosperity and population growth are also boosted."

 STATIC_MODIFIER_NAME_som_tur_hungarian_march_mod: "The Hungarian March"
 STATIC_MODIFIER_DESC_som_tur_hungarian_march_mod: "With Buda fallen, Ottoman soldiers pressing across the Danube toward Vienna sense, even amid the afterglow of victory, the opening of a long war with the Habsburgs."
 STATIC_MODIFIER_NAME_som_tur_italy_north_mod: "Dominion over the Italian Peninsula"
 STATIC_MODIFIER_DESC_som_tur_italy_north_mod: "The crescent banner flies over the squares of Rome, Florence, and Milan, and the people of the cities of the Renaissance are beginning to learn the language of their new rulers."
 STATIC_MODIFIER_NAME_som_tur_maghreb_mod: "Mastery of the Maghreb"
 STATIC_MODIFIER_DESC_som_tur_maghreb_mod: "The Barbary corsair ships gathered in the harbors of Tunis and Algiers now look out over the western Mediterranean as a wing of the sultan's fleet."


 som_tur_silk_road_revival: "Revival of the Silk Road"
 som_tur_silk_road_revival_desc: "Tabriz was the westernmost hub of the Silk Road — the Il-Khanate capital that once connected Persia and Central Asia to the Mediterranean world. Seizing this city gives the Ottoman Empire direct control over the flow of silk, spices, and gems from Asia. The vast trade network linking the Black Sea to Central Asia revives, dramatically enhancing imperial commercial power."
 STATIC_MODIFIER_NAME_som_tur_silk_road_revival_mod: "Revival of the Silk Road"
 STATIC_MODIFIER_DESC_som_tur_silk_road_revival_mod: "From the markets of Tabriz, caravans laden with Chinese silk once more travel the road to Istanbul, and the Silk Road has regained its bustle."
 som_tur_city_of_worlds_desire_desc: "Istanbul — truly the city the world desires. With a population exceeding half a million, it is the undisputed pivot of world commerce. As this great city reaches its full glory, the ancient Byzantine right of the Imperial Breadbasket becomes available to the Ottoman Empire as well."

 som_tur_true_rome: "True Empire of Rome"
 som_tur_true_rome_desc: "The Balkans, Anatolia, the Arab world, Egypt, North Africa, Italy — virtually all the lands once ruled by Rome now fly the Ottoman banner. Mehmed II claimed the title of Kaiser (Emperor) after the fall of Constantinople. Now the Ottoman Empire stands as the true successor of Rome — inheriting its roads, its laws, its civilization. Revive the Corpus Juris of Justinian, expand the aqueduct system, and bind a vast empire together under one law and one culture."
 STATIC_MODIFIER_NAME_som_tur_true_rome_mod: "True Empire of Rome"
 STATIC_MODIFIER_DESC_som_tur_true_rome_mod: "Under an empire that claims the mantle of Rome, the roads are mended, the aqueducts extended, and the code of Justinian is revived as the law of a new age."

 som_ottoman_mission_pack: "Rise of the Ottoman Empire"
 som_ottoman_mission_pack_DESCRIPTION:0 "In 1337, the Ottoman polity is a small Anatolian beylik centered on Bursa, Iznik, and Izmit. Within a few generations, it will transform into an empire stretching from the Balkans to Arabia, from Crimea to North Africa and Italy. Carry the Ghazi spirit into the Balkans, bring Constantinople to its knees, realize the golden age of Suleiman the Magnificent — and claim the mantle of True Rome itself."
 som_ottoman_mission_pack_CRITERIA_DESCRIPTION:0 "As the Ottomans, conquer the Balkans, Anatolia, the Arab world, and the Mediterranean; build robust domestic institutions; and achieve the Age of Suleiman."
 som_ottoman_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to fulfill the Rise of the Ottoman Empire."
 som_ottoman_mission_pack_BUTTON_DETAILS:0 "From a small beylik in 1337 to the greatest empire in the world!"
