l_english:
 geo_georgia_mission_pack: "The Golden Fleece — Kingdom of the Caucasus"
 geo_georgia_mission_pack_DESCRIPTION:0 "Under the Bagrationi dynasty, the Kingdom of Georgia stands at the crossroads of the Caucasus. Unite the realm, claim hegemony over the Caucasus and the steppe, or march as crusaders into Anatolia and the Holy Land — and let the light of Orthodoxy shine upon the East."
 geo_georgia_mission_pack_CRITERIA_DESCRIPTION:0 "Reunite Georgia, dominate the Caucasus, and crusade southward to realize a new golden age."
 geo_georgia_mission_pack_BUTTON_TOOLTIP:0 "From the land of the Golden Fleece, become the hegemon of the Caucasus."
 geo_georgia_mission_pack_BUTTON_DETAILS:0 "Restore the glory of Queen Tamar — from a mountain kingdom to the guardian of the Orthodox world!"
 geo_bagrationi_legacy: "The Legacy of the Bagrationi"
 geo_bagrationi_legacy_desc: "The bloodline of the House of Bagrationi rules the Caucasus. Inherit this legacy, and begin a new age of governance."
 geo_royal_succession: "Secure the Succession"
 geo_royal_succession_desc: "Quell the ambitions of the nobility and the disputes over the throne, and establish a legitimate rule."
 geo_reunite_georgia: "Reunite Georgia"
 geo_reunite_georgia_desc: "Tbilisi, Kutaisi, Akhaltsikhe, Batumi — unite the fractured provinces of Georgia under a single crown."
 geo_fortify_caucasia: "Fortify Caucasia"
 geo_fortify_caucasia_desc: "Harden the rugged mountains with a network of fortresses, and repel the incursions of heathens and conquerors alike."
 geo_church_of_georgia: "The Georgian Church"
 geo_church_of_georgia_desc: "Make the autocephalous Georgian Orthodox Church a pillar of the state, and forge unity through faith."
 geo_royal_court: "The Royal Court"
 geo_royal_court_desc: "Adorn the royal court of Tbilisi, and make it a center of culture and authority unmatched in the Caucasus."
 geo_georgian_army: "The Georgian Army"
 geo_georgian_army_desc: "Forge a mighty army drawn from the mountain peoples, and make it the sword of the kingdom."
 geo_recover_strength: "Recover Strength"
 geo_recover_strength_desc: "Restore the strength sapped by repeated hardship, and open a new future through alliance and rearmament."
 geo_queen_tamar_ambition: "Queen Tamar's Ambition"
 geo_queen_tamar_ambition_desc: "The lands of Armenia, once part of Queen Tamar's domain — liberate our Christian brethren from heathen rule, and restore Tbilisi's authority."
 geo_reclaim_shirvan: "Reclaim Shirvan"
 geo_reclaim_shirvan_desc: "Reclaim Shirvan, once under Georgian suzerainty, and gain a foothold on the Caspian Sea."
 geo_heirs_of_seljuks: "Heirs of the Seljuks"
 geo_heirs_of_seljuks_desc: "Reclaim the eastern lands from the powers that inherited the Seljuk legacy, and restore the authority of the cross to this region."
 geo_gates_of_alexander: "The Gates of Alexander"
 geo_gates_of_alexander_desc: "Cross the so-called 'Gates of Alexander' through the Caucasus, and subjugate the tribes of the north."
 geo_bane_of_khagan: "Bane of the Khagan"
 geo_bane_of_khagan_desc: "The descendants of the Mongols continue to threaten the Orthodox world. Put an end to their rule, and eliminate this bane forever."
 geo_seize_crimea: "Seize Crimea"
 geo_seize_crimea_desc: "Subdue the Crimean Peninsula, the Tatars' final sanctuary, and secure our dominion over the Black Sea."
 geo_control_black_sea: "Control the Black Sea"
 geo_control_black_sea_desc: "Having seized most of the Black Sea coast, fully integrate this inland sea into Georgia's trading sphere."
 geo_envoy_to_tsar: "An Envoy to the Tsar"
 geo_envoy_to_tsar_desc: "Send an envoy to the Tsar, risen as the dominant power of Rus, and seek the path of alliance."
 geo_caucasus_hegemony: "Hegemony of the Caucasus"
 geo_caucasus_hegemony_desc: "Mountains, steppe, and the Black Sea — complete an unshakeable hegemony over the entire Caucasus."
 geo_deal_with_trebizond: "Deal with Trebizond"
 geo_deal_with_trebizond_desc: "The Empire of Trebizond, founded with Queen Tamar's aid — renew the bond with this old friend, and choose a path forward together."
 geo_conquer_jalayirids: "Subdue the Jalayirid Sultanate"
 geo_conquer_jalayirids_desc: "Amid the chaos following the collapse of the Ilkhanate, the Jalayirid Sultanate has risen in this land — subdue this heir to the Mongol legacy, and open the road to the East."
 geo_encroach_mamluks: "Encroach on the Mamluks"
 geo_encroach_mamluks_desc: "The Holy Land, lost by crusaders of old — advance into the Mamluk-ruled East, and prepare to reclaim the light of faith."
 geo_conquer_cyprus: "Conquer Cyprus"
 geo_conquer_cyprus_desc: "Seize Cyprus, a stronghold of the eastern Mediterranean, and secure hegemony over the region alongside the local Crusader powers."
 geo_cradle_of_civilization: "Cradle of Civilization"
 geo_cradle_of_civilization_desc: "Liberate Mesopotamia, cradle of human civilization, from Muslim rule, and claim its riches for Georgia."
 geo_claim_holy_city: "Claim the Holy City"
 geo_claim_holy_city_desc: "As long as Jerusalem lies under Saracen rule, a dark cloud looms over Christendom. Reclaim the Holy City, and prove the triumph of the faith."
 geo_light_of_east: "Light of the East"
 geo_light_of_east_desc: "Alexandria, Jerusalem, Antioch — liberate the ancient Eastern patriarchates, and show the world that the light of the East has not been extinguished."
 geo_anatolian_incursion: "Anatolian Incursion"
 geo_anatolian_incursion_desc: "Since the defeat at Manzikert, Anatolia has fallen to Turkic powers — avenge that defeat, and become the new hegemon of this land."
 geo_empires_downfall: "The Empire's Downfall"
 geo_empires_downfall_desc: "The Ottoman Empire, dominant across the Balkans and the Middle East — consign this threat to all Christendom to the pages of history."
 geo_throne_of_romans: "Throne of the Romans"
 geo_throne_of_romans_desc: "The great city of Constantinople has long lain in heathen hands. Liberate this jewel, and take the Roman throne as a Georgian Emperor."
 geo_beacon_of_christendom: "Beacon of Christendom"
 geo_beacon_of_christendom_desc: "Having restored the might of Orthodoxy, the time has come to prove our piety and God-given righteousness to the world — make our realm a united paradise of Christendom."
 geo_georgian_crusader_realm: "The Georgian Crusader Realm"
 geo_georgian_crusader_realm_desc: "From the Caucasus to the Mediterranean — this great empire built beneath the cross is the fulfillment of Queen Tamar's dream."
 geo_rebuild_tbilisi: "Rebuild Tbilisi"
 geo_rebuild_tbilisi_desc: "Our capital, Tbilisi, worn down by repeated foreign invasions — set about restoring its former splendor."
 geo_georgian_vineyards: "Georgian Vineyards"
 geo_georgian_vineyards_desc: "Georgia's winemaking tradition, spanning over a thousand years — let this proud industry be known to the world."
 geo_revive_literature: "Revive Native Literature"
 geo_revive_literature_desc: "Asomtavruli, Nuskhuri, Mkhedruli — three scripts that carry Georgian heritage. Revive this culture, and spread its language and writing across all Caucasia."
 geo_legacy_of_builder: "Legacy of the Builder"
 geo_legacy_of_builder_desc: "Following the reign of David the Builder, bring fame, wealth, and significance to our cities."
 geo_svetitskhoveli_cathedral: "Svetitskhoveli Cathedral"
 geo_svetitskhoveli_cathedral_desc: "The Cathedral of the Living Pillar, heart of the Georgian Apostolic Church — rebuild it to a splendor greater than ever before."
 geo_patriarchate_of_georgia: "Patriarchate of All Georgia"
 geo_patriarchate_of_georgia_desc: "As the state's influence grows, so does the call to elevate the autocephalous Georgian Church to the status of a patriarchate."
 geo_silk_road_trade: "Silk Road Trade"
 geo_silk_road_trade_desc: "As a nexus linking East and West along the Silk Road, fill Georgia's cities with the wealth of trade."
 geo_mountain_fortresses: "Mountain Fortresses"
 geo_mountain_fortresses_desc: "Make use of Caucasia's rugged terrain, and complete a network of fortresses that can halt any army."
 geo_golden_age: "The Golden Age Complete"
 geo_golden_age_desc: "The golden age built by Queen Tamar and David the Builder — raise its glory to unprecedented heights."
 geo_events.1.t: "The Fall of Sarai"
 geo_events.1.d: "Sarai, capital of the Mongol successor state, has fallen into our hands. The authority of the Khagan, which once shook the Orthodox world, now belongs to the past."
 geo_events.1.a: "The Bane of the Khagan has come to an end!"
 geo_events.2.t: "The Fall of Constantinople"
 geo_events.2.d: "The great imperial city of Constantinople has fallen into our hands at last. The Georgian banner now flies over this city, once held by the infidel — the King of the Caucasus claims the title of heir to Rome."
 geo_events.2.a: "Long live the Roman Empire! Long live the Georgian Emperor!"
 geo_events.99.t: "Declaration of the Golden Age"
 geo_events.99.d: "From the Caucasus to the Mediterranean — the golden age Queen Tamar once dreamed of is now complete. A small mountain kingdom has been reborn as a great empire that illuminates the Orthodox world."
 geo_events.99.a: "Glory to Georgia! Long live the Golden Age!"
 STATIC_MODIFIER_NAME_geo_bagrationi_mod: "Splendor of the Bagrationi"
 STATIC_MODIFIER_DESC_geo_bagrationi_mod: "The royal bloodline grants the state prestige and legitimacy."
 STATIC_MODIFIER_NAME_geo_succession_mod: "Stable Succession"
 STATIC_MODIFIER_DESC_geo_succession_mod: "The royal succession is stable, and internal unrest has subsided."
 STATIC_MODIFIER_NAME_geo_reunite_mod: "Georgia Reunited"
 STATIC_MODIFIER_DESC_geo_reunite_mod: "The fractured provinces are once again united under a single crown."
 STATIC_MODIFIER_NAME_geo_fortify_mod: "The Caucasian Fortress Network"
 STATIC_MODIFIER_DESC_geo_fortify_mod: "Stone fortresses raised on the summits of the Caucasus passes keep watch from afar for the shadow of the invader."
 STATIC_MODIFIER_NAME_geo_church_mod: "The Georgian Church"
 STATIC_MODIFIER_DESC_geo_church_mod: "The Orthodox Church now functions as a pillar of the state, forging unity through faith."
 STATIC_MODIFIER_NAME_geo_court_mod: "Splendor of the Royal Court"
 STATIC_MODIFIER_DESC_geo_court_mod: "The royal court of Tbilisi shines as the center of culture and authority in the Caucasus."
 STATIC_MODIFIER_NAME_geo_army_mod: "The Georgian Army"
 STATIC_MODIFIER_DESC_geo_army_mod: "A mighty army drawn from the mountain peoples is complete, serving as the sword of the kingdom."
 STATIC_MODIFIER_NAME_geo_recover_mod: "Strength Recovered"
 STATIC_MODIFIER_DESC_geo_recover_mod: "Through alliance and rearmament, the kingdom has stepped toward a new future."
 STATIC_MODIFIER_NAME_geo_tamar_mod: "Queen Tamar's Ambition"
 STATIC_MODIFIER_DESC_geo_tamar_mod: "Our Armenian brethren have been liberated, and Tbilisi's authority now reaches eastward."
 STATIC_MODIFIER_NAME_geo_shirvan_mod: "Shirvan Reclaimed"
 STATIC_MODIFIER_DESC_geo_shirvan_mod: "A foothold on the Caspian Sea is secured, and the wealth of eastern trade flows in."
 STATIC_MODIFIER_NAME_geo_seljuk_mod: "Heirs of the Seljuks"
 STATIC_MODIFIER_DESC_geo_seljuk_mod: "The powers that inherited the Seljuk legacy have been driven back, and the authority of the cross has returned to the East."
 STATIC_MODIFIER_NAME_geo_gates_mod: "The Gates of Alexander"
 STATIC_MODIFIER_DESC_geo_gates_mod: "Having crossed the northern passes, the tribes north of the Caucasus have been subdued."
 STATIC_MODIFIER_NAME_geo_crimea_mod: "Crimea Seized"
 STATIC_MODIFIER_DESC_geo_crimea_mod: "The Tatars' final sanctuary has been subdued, opening trade routes across the Black Sea."
 STATIC_MODIFIER_NAME_geo_black_sea_mod: "Control of the Black Sea"
 STATIC_MODIFIER_DESC_geo_black_sea_mod: "Most of the Black Sea coast is now integrated into Georgia's trading sphere."
 STATIC_MODIFIER_NAME_geo_tsar_mod: "Alliance with the Tsar"
 STATIC_MODIFIER_DESC_geo_tsar_mod: "Relations with the dominant power of Rus are established, expanding our diplomatic network."
 STATIC_MODIFIER_NAME_geo_hegemony_mod: "Hegemony of the Caucasus"
 STATIC_MODIFIER_DESC_geo_hegemony_mod: "Mountains, steppe, and the Black Sea — hegemony over the entire Caucasus is complete."
 STATIC_MODIFIER_NAME_geo_trebizond_mod: "Deal with Trebizond"
 STATIC_MODIFIER_DESC_geo_trebizond_mod: "The bond with our old friend has been renewed, and trade between the two realms flourishes."
 STATIC_MODIFIER_NAME_geo_jalayirid_mod: "The Jalayirid Sultanate Subdued"
 STATIC_MODIFIER_DESC_geo_jalayirid_mod: "The Jalayirid threat has been eliminated, proving the strength of our army."
 STATIC_MODIFIER_NAME_geo_mamluk_mod: "Encroachment on the Mamluks"
 STATIC_MODIFIER_DESC_geo_mamluk_mod: "The banner of the cross, advanced to the east, flies even on the desert horizon, and the kings of other faiths have heard its name."
 STATIC_MODIFIER_NAME_geo_cyprus_mod: "Cyprus Conquered"
 STATIC_MODIFIER_DESC_geo_cyprus_mod: "Georgian merchantmen anchored in the harbors of Cyprus load the spices of the eastern Mediterranean."
 STATIC_MODIFIER_NAME_geo_mesopotamia_mod: "Cradle of Civilization"
 STATIC_MODIFIER_DESC_geo_mesopotamia_mod: "Wool and dyes from the fertile banks of the Tigris and Euphrates are carried to the workshops of Georgia."
 STATIC_MODIFIER_NAME_geo_holy_city_mod: "The Holy City Claimed"
 STATIC_MODIFIER_DESC_geo_holy_city_mod: "The reclamation of Jerusalem has raised the Church's authority and the people's devotion."
 STATIC_MODIFIER_NAME_geo_light_east_mod: "Light of the East"
 STATIC_MODIFIER_DESC_geo_light_east_mod: "The liberation of the Eastern patriarchates has raised the army's morale and honor."
 STATIC_MODIFIER_NAME_geo_anatolia_mod: "Anatolian Incursion"
 STATIC_MODIFIER_DESC_geo_anatolia_mod: "The Georgian soldiers who stood once more on the field of Manzikert march in ranks, proud to have avenged the old humiliation."
 STATIC_MODIFIER_NAME_geo_downfall_mod: "The Empire's Downfall"
 STATIC_MODIFIER_DESC_geo_downfall_mod: "At the court of Tbilisi, freed from the Ottoman threat, envoys from many nations bow before the King of Georgia."
 STATIC_MODIFIER_NAME_geo_beacon_mod: "Beacon of Christendom"
 STATIC_MODIFIER_DESC_geo_beacon_mod: "The name of the King of Georgia, called guardian of the faith, is spoken with respect in the courts of the nations that bear the same cross."
 STATIC_MODIFIER_NAME_geo_tbilisi_mod: "Tbilisi Rebuilt"
 STATIC_MODIFIER_DESC_geo_tbilisi_mod: "The royal capital of Tbilisi is reclaiming its former splendor."
 STATIC_MODIFIER_NAME_geo_vineyards_mod: "Georgian Vineyards"
 STATIC_MODIFIER_DESC_geo_vineyards_mod: "The scent of wine aged for a thousand years in clay qvevri jars fills the valleys of Kakheti."
 STATIC_MODIFIER_NAME_geo_literature_mod: "Native Literature Revived"
 STATIC_MODIFIER_DESC_geo_literature_mod: "The spread of the Mkhedruli script has advanced scholarship and governance."
 STATIC_MODIFIER_NAME_geo_builder_mod: "Legacy of the Builder"
 STATIC_MODIFIER_DESC_geo_builder_mod: "Carrying on David the Builder's will, our cities walk the path toward prosperity."
 STATIC_MODIFIER_NAME_geo_cathedral_mod: "Svetitskhoveli Cathedral"
 STATIC_MODIFIER_DESC_geo_cathedral_mod: "The Cathedral of the Living Pillar has been rebuilt, restoring its splendor as a center of faith."
 STATIC_MODIFIER_NAME_geo_patriarchate_mod: "Patriarchate of All Georgia"
 STATIC_MODIFIER_DESC_geo_patriarchate_mod: "The Georgian Church has been elevated to a patriarchate, and its authority is widely recognized."
 STATIC_MODIFIER_NAME_geo_silk_road_mod: "Silk Road Trade"
 STATIC_MODIFIER_DESC_geo_silk_road_mod: "As a nexus of East-West trade, Georgia's cities overflow with wealth."
 STATIC_MODIFIER_NAME_geo_mountain_fort_mod: "The Mountain Fortress Network"
 STATIC_MODIFIER_DESC_geo_mountain_fort_mod: "A fortress network built upon Caucasia's terrain can halt any great army."
 STATIC_MODIFIER_NAME_geo_golden_age_mod: "The Golden Age Complete"
 STATIC_MODIFIER_DESC_geo_golden_age_mod: "The golden age built by Queen Tamar and David the Builder has reached new heights."
 STATIC_MODIFIER_NAME_geo_constantinople_fall_mod: "Legacy of Imperial Byzantium"
 STATIC_MODIFIER_DESC_geo_constantinople_fall_mod: "The diplomatic and administrative machinery of the thousand-year city has been seized. Inheriting Rome's bureaucracy and diplomatic ceremony, our subjects grow more loyal, and the process of annexation proceeds more smoothly."
 STATIC_MODIFIER_NAME_geo_golden_age_declaration_mod: "The Golden Age's Web of Governance"
 STATIC_MODIFIER_DESC_geo_golden_age_declaration_mod: "A great empire stretching from the Caucasus to the Mediterranean is bound together by royal roads and a network of local governors. The prosperity built by Queen Tamar and David the Builder carries the light of the crown to the farthest provinces, making the dynasty's legitimacy and prestige unshakeable."
