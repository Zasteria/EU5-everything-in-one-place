l_russian:
 pol_royal_breadbasket_town_rights: "Польская королевская житница"
 pol_royal_breadbasket_town_rights_desc: "Этому району поручено собирать зерно королевства для вывоза вниз по Висле; его зернохранилища расширены для этой задачи. Зерно стекается из владений знати и уходит в балтийские порты, поддерживая и горожан, и купцов."
