l_russian:
 boh_feudal_city_rights: "Феодальный город"
 boh_feudal_city_rights_desc: "Феодальный город под сильной властью дворянства. Ограничение крестьянских свобод приносит региональный контроль и социальную стабильность."
 boh_ecclesiastical_city_rights: "Церковный город"
 boh_ecclesiastical_city_rights_desc: "Религиозный город, управляемый духовенством. Поощрение обращения в веру и духовный авторитет продвигают региональное религиозное единство."
