l_russian:
 som_imperial_breadbasket_town_rights: "Османская имперская житница"
 som_imperial_breadbasket_town_rights_desc: "Этому району поручено снабжать имперскую столицу и войска султана; его зернохранилища расширены, чтобы кормить великий город. Зерно стекается сюда под надзором государства, поддерживая и горожан, и воинов."
