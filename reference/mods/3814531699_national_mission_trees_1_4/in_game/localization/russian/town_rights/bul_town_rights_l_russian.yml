l_russian:
 bul_chitalishte_rights: "Город читалища"
 bul_chitalishte_rights_desc: "Город, где укоренилось культурное движение, сосредоточенное вокруг «читален» (читалища). Распространяются национальное самосознание и грамотность, хотя внимание горожан обращается больше к учению и просвещению, чем к производству."
