 hol_republican_reform: "Республика под суверенитетом штатов"
 hol_republican_reform_desc: "Своеобразная форма правления без штатгальтера, где суверенитет покоится на собраниях семи провинций — благоприятствует торговле и интересам бюргерского сословия, хотя содержание постоянной армии оказывается несколько затруднительным."
