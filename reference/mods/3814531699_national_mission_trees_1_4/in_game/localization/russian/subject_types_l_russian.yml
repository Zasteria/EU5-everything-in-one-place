 eng_welsh_principality: "Союзное княжество"
 eng_welsh_principality_plural: "Союзные княжества"
 eng_welsh_principality_desc: "Особый статус, даруемый королевству, избравшему партнёрство вместо соперничества — сюзерен не может принудить его вступить в наступательные войны, и это княжество даже обладает правом самостоятельно объявлять войну. Взамен аннексия становится практически невозможной, и оба государства процветают вместе благодаря этой особой связи."
