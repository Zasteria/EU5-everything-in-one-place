l_russian:
 wiener_stadtrecht_town_rights: "Венское городское право"
 wiener_stadtrecht_town_rights_desc: "Особое городское право, даруемое только Вене — улучшает доступ к рынку, силу торгового центра и вместимость купцов. Может быть даровано только Вене."
 landstadt_town_rights: "Ландштадт"
 landstadt_town_rights_desc: "Городское право, даруемое имперским городам — усиливает власть короны и дворянского сословия, улучшая административный охват из столицы."
