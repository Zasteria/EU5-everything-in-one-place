 brb_estates_balance_reform: "Равновесие дворян и бюргеров"
 brb_estates_balance_reform_desc: "Феодальное дворянство или торговые бюргеры — чей голос звучит громче, тот и определяет характер правления великого герцогства. Чем сильнее влияние дворян, тем крепче феодальный порядок и налоговая власть; чем сильнее влияние бюргеров, тем крепче торговое процветание."
