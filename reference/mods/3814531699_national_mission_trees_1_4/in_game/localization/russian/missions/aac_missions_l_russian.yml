l_russian:
 aac_carolingian_legacy_mission_pack: "Каролингское наследие — восстановление Франкского королевства"
 aac_carolingian_legacy_mission_pack_DESCRIPTION:0 "В 1337 году Ахен — вольный город в составе Священной Римской империи, чей бургомистр — потомок каролингской династии. Из этого города, некогда бывшего домом двора Карла Великого (742–814), верни славу Франкского королевства. Объедини Рейн, Галлию и Фландрию и правь как «Император Запада» с папской коронацией."
 aac_carolingian_legacy_mission_pack_CRITERIA_DESCRIPTION:0 "Как Ахен, объедини Рейн, Галлию и Италию, дабы восстановить Западную Римскую империю."
 aac_carolingian_legacy_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы восстановить Франкское королевство."
 aac_carolingian_legacy_mission_pack_BUTTON_DETAILS:0 "От престола Карла Великого до Западной Римской империи!"
 aac_throne_of_charlemagne: "Престол Карла Великого"
 aac_throne_of_charlemagne_desc: "Ахенский собор — воздвигнутый по велению Карла Великого и место его коронации Западным Римским императором в 800 году — вернулся в руки Каролингов. Правь Ахеном, некогда центром западной цивилизации, и сделай первый шаг к восстановлению Франкского королевства."
 aac_control_rhineland: "Овладей Рейном"
 aac_control_rhineland_desc: "Кёльн, Трир, Майнц — три великих архиепископских города вдоль Рейна были экономическим, религиозным и политическим центром Франкского королевства. Захват их возвращает весь Рейн в руки Каролингов."
 aac_integrate_lorraine: "Включи Лотарингию"
 aac_integrate_lorraine_desc: "Лотарингия родилась как срединная зона, когда Верденский договор (843) разделил Франкскую империю между внуками Карла Великого. Возвращение Меца и Вердена воссоединяет ядро Франкской империи, каким оно было до раздела."
 aac_conquer_hre: "Владыка Священной Римской империи"
 aac_conquer_hre_desc: "Ахен некогда был местом коронации императоров Священной Римской империи. Утвердившись владыкой Империи, каролингское имперское наследие заявлено самым законным образом."
 aac_control_flanders: "Овладей Фландрией"
 aac_control_flanders_desc: "Фландрия — центр величайшей суконной промышленности Европы. Захвати Брюссель и Льеж и используй богатую торговую и промышленную мощь Фландрии, дабы восстановить Франкское королевство."
 aac_brabant_trade: "Брабантская торговля"
 aac_brabant_trade_desc: "Величайшая торговая сеть Нижних земель раскинулась от торгового города Брюсселя в герцогстве Брабант. Контроль над этой торговой сетью резко укрепляет финансовую основу Франкского королевства."
 aac_push_into_france: "Марш на Париж"
 aac_push_into_france_desc: "Карл Великий правил всей Галлией, включая Париж, как король франков. Отвоевание Парижа мстит династии Валуа и возрождает каролингское владычество над Галлией."
 aac_conquer_northern_france: "Завоюй Северную Францию"
 aac_conquer_northern_france_desc: "Реймс — место коронации Франкского королевства — продолжая традицию крещённого здесь Хлодвига I, покори Нормандию и Пикардию, дабы утвердить полное господство над Северной Галлией."
 aac_conquer_burgundy: "Завоюй Бургундию"
 aac_conquer_burgundy_desc: "Бургундия сыграла важную роль во Франкской империи как земля, богатая вином и земледелием. Её покорение открывает путь на юг Франции."
 aac_conquer_southern_france: "Завоюй Южную Францию"
 aac_conquer_southern_france_desc: "Покори Лангедок и Гасконь, и южная Галлия возвращается в руки Каролингов. Распространение владений до Пиренеев осуществляет полное господство над Галлией, к коему стремился Карл Великий."
 aac_reunite_gaul: "Воссоедини Галлию"
 aac_reunite_gaul_desc: "Вся Галлия — земли, некогда правимые Карлом Великим — объединена под знаменем Франкского королевства. Империя, разделённая надвое Верденским договором, воссоединена впервые за 500 лет."
 aac_develop_aachen: "Развей Ахен"
 aac_develop_aachen_desc: "Развей этот древний город, сосредоточенный вокруг Ахенского собора, и сделай его новой столицей Франкской империи. Из этого места, где обитает наследие Карла Великого, воссияет свет для восстановления Западной Европы."
 aac_frankish_law: "Франкский свод законов"
 aac_frankish_law_desc: "Карл Великий развил правовую систему Франкской империи через Капитулярии (собрание указов). Продолжая эту традицию, учреждение нового Франкского свода законов утверждает правовую основу Империи."
 aac_missi_dominici: "Королевские посланцы"
 aac_missi_dominici_desc: "Система «Missi Dominici» (посланцев государя), учреждённая Карлом Великим — королевские представители, разосланные по всей Империи для надзора за местным управлением. Возрождение этой системы позволяет централизованно управлять обширной империей."
 aac_carolingian_renaissance: "Каролингское Возрождение"
 aac_carolingian_renaissance_desc: "Карл Великий содействовал «Каролингскому Возрождению», приглашая учёных, таких как Алкуин и Эйнхард. Возроди ахенский двор как центр культуры и учёности и возглавь восстановление западной цивилизации."
 aac_trade_empire: "Торговая империя"
 aac_trade_empire_desc: "Франкская империя, господствующая над торговыми путями Рейна, Мааса и Шельды, становится величайшей торговой державой Западной Европы. Утверди торговое превосходство с несколькими торговыми центрами и богатым доходом."
 aac_frankish_levy: "Франкское ополчение"
 aac_frankish_levy_desc: "Франкская армия Карла Великого была сильнейшей в Европе. Возроди систему ополчения (хостовую систему) и восстанови военную мощь Франкской империи с широкой военной организацией от крестьянских солдат до рыцарей."
 aac_palatine_guard: "Дворцовая стража"
 aac_palatine_guard_desc: "Дворцовая стража, защищающая особу императора — элитное войско, продолжающее традицию личных стражей Карла Великого, воплощает военную славу Франкской империи."
 aac_carolingian_cavalry: "Каролингская кавалерия"
 aac_carolingian_cavalry_desc: "Сердцем военного успеха Карла Великого была мощная кавалерия. Восстанови легендарную конную силу, где тяжёлые бронированные рыцари (шевалье) господствовали на поле боя и разбили саксов, аваров и мусульман."
 aac_kingdom_of_franks: "Королевство франков восстановлено"
 aac_kingdom_of_franks_desc: "Галлия воссоединена, Лотарингия включена, Missi Dominici учреждены — три столпа сходятся воедино, и Франкское королевство наконец восстановлено. Впервые с 800 года каролингское знамя развевается от Рейна до Пиренеев."
 aac_papal_alliance: "Союз с папством"
 aac_papal_alliance_desc: "На Рождество 800 года, в базилике Святого Петра в Риме, папа Лев III возложил корону Западного Римского императора на Карла Великого. Продолжи эту традицию, построй твёрдый союз с папой и утверди легитимность как «наместник Бога»."
 aac_conquer_italy: "Завоюй Италию"
 aac_conquer_italy_desc: "Карл Великий покорил Лангобардское королевство в 774 году и получил титул короля Италии. Захват Рима завершает путь к возрождению «Западного Римского императора» с папским одобрением."
 aac_western_roman_empire: "Восстановление Западной Римской империи"
 aac_western_roman_empire_desc: "Ахен, Париж, Рим — три города Западной Римской империи воссоединены под каролингским знаменем. Империя, построенная Карлом Великим в 800 году, возрождена в наши дни, и «Renovatio Imperii Romani» (Восстановление Римской империи) свершилось."
 aac_alsace_swabia: "Эльзас и Швабия"
 aac_alsace_swabia_desc: "Эльзас и Швабия на восточном берегу Рейна — важная часть Франкской империи. Захват этой земли, простирающейся от Вогезов до Альп, завершает господство над Рейном."
 aac_champagne_fairs: "Шампанские ярмарки"
 aac_champagne_fairs_desc: "Периодические ярмарки (foires) области Шампань были величайшими торговыми собраниями Европы. Контроль над этим местом встречи итальянских, фламандских и германских купцов утверждает франкское торговое превосходство."
 aac_conquer_brittany: "Завоюй Бретань"
 aac_conquer_brittany_desc: "Бретань — земля кельтских бретонцев, кою не сумел полностью покорить даже Карл Великий. Завоевание этой западной оконечности приводит западную Галлию полностью под франкский контроль и обеспечивает выход к Атлантике."
 aac_holy_crown: "Священная корона"
 aac_holy_crown_desc: "Глубокое доверие с папством и высокая легитимность — как «наместник Христа», папа одобряет власть франкского короля. Утверждается власть, признанная и Богом, и людьми."
 aac_dev_reims: "Развей Реймс"
 aac_dev_reims_desc: "Реймс — место крещения франкского народа: здесь Хлодвиг I принял христианское крещение, и с тех пор здесь проходят коронации французских королей. Дальнейшее развитие этого священного города укрепляет каролингскую легитимность."
 aac_dev_paris: "Развей Париж"
 aac_dev_paris_desc: "Париж, сосредоточенный вокруг острова Сите на Сене — величайший город Галлии. Развивая его как западную столицу Франкской империи, создаётся система двух столиц, Ахена и Парижа, поддерживающая Франкскую империю."
 aac_bretagne_fleet: "Бретонский флот"
 aac_bretagne_fleet_desc: "Морские традиции Бретани и Фландрии объединяются, дабы Франкская империя ныне обладала мощным флотом, господствующим и над Атлантикой, и над Северным морем."
 aac_events.20.t: "Париж пал — возвращение Каролингов"
 aac_events.20.d: "Знамя Валуа сорвано со стен Парижа, заменённое орлом Франкского королевства. Пока звонят колокола Нотр-Дама, потомок каролингского бургомистра входит в Париж. «Наследник Карла Великого вернулся» — так напишут историки."
 aac_events.20.a: "Да здравствует Париж! Поднимите каролингское знамя высоко!"
 aac_events.40.t: "Галлия воссоединена — возвращение франкского короля"
 aac_events.40.d: "От Рейна до Пиренеев, от Фландрии до Прованса — вся Галлия объединена под знаменем Франкского королевства. Империя, разделённая надвое Верденским договором 843 года, воссоединена через 500 лет. «Dieu le veut (Так хочет Бог)» — восклицает народ, собравшийся в соборе."
 aac_events.40.a: "Да здравствует Галлия! Франкское королевство вечно!"
 aac_events.50.t: "Провозглашение восстановления Франкского королевства"
 aac_events.50.d: "Галлия воссоединена, Лотарингия включена, Missi Dominici учреждены — три столпа Франкского королевства завершены. Коронация франкского короля проходит в Ахенском соборе, и впервые со времён Карла Великого рождается Франкский Император. «Во имя Carolus Magnus Rex Francorum (Карла Великого, короля франков), мы провозглашаем Империю»."
 aac_events.50.a: "Да здравствует Франкское королевство! Каролингская слава возрождена — окрасим наши цвета в синеву Франции!"
 aac_events.99.t: "Восстановление Западной Римской империи"
 aac_events.99.d: "Ахен, Париж, Рим — три города, воссоединённые под каролингским знаменем. Легендарный миг, когда папа Лев III возложил корону на Карла Великого на Рождество 800 года, воспроизведён в наши дни. «Renovatio Imperii Romani» — эти слова навеки запечатлены в истории. Изменишь ли ты цвет Империи на каролингский багрянец?"
 STATIC_MODIFIER_NAME_aac_rhineland_mod: "Контроль над Рейном"
 STATIC_MODIFIER_DESC_aac_rhineland_mod: "Три великих архиепископских города вдоль Рейна захвачены — экономический и религиозный центр Франкской империи возрождён."
 STATIC_MODIFIER_NAME_aac_lorraine_mod: "Лотарингия включена"
 STATIC_MODIFIER_DESC_aac_lorraine_mod: "Лотарингия, разделённая Верденским договором, воссоединена. Символ раздела Франкской империи разрешён."
 STATIC_MODIFIER_NAME_aac_hre_master_mod: "Владыка Священной Римской империи"
 STATIC_MODIFIER_DESC_aac_hre_master_mod: "Как владыка Империи, каролингское имперское наследие заявлено законно."
 STATIC_MODIFIER_NAME_aac_flanders_mod: "Контроль над Фландрией"
 STATIC_MODIFIER_DESC_aac_flanders_mod: "Центр величайшей суконной промышленности Европы, Фландрия, попадает в руки Каролингов."
 STATIC_MODIFIER_NAME_aac_brabant_mod: "Брабантская торговля"
 STATIC_MODIFIER_DESC_aac_brabant_mod: "Торговая сеть Нижних земель обогащает финансы Франкского королевства."
 STATIC_MODIFIER_NAME_aac_northern_france_mod: "Северная Франция завоёвана"
 STATIC_MODIFIER_DESC_aac_northern_france_mod: "Нормандия и Пикардия покорены — полное господство над Северной Галлией утверждено."
 STATIC_MODIFIER_NAME_aac_burgundy_mod: "Бургундия завоёвана"
 STATIC_MODIFIER_DESC_aac_burgundy_mod: "Богатая вином Бургундия включена во Франкское королевство."
 STATIC_MODIFIER_NAME_aac_southern_france_mod: "Южная Франция завоёвана"
 STATIC_MODIFIER_DESC_aac_southern_france_mod: "Лангедок и Гасконь покорены — южная Галлия возвращается в руки Каролингов."
 STATIC_MODIFIER_NAME_aac_gaul_unified_mod: "Галлия воссоединена"
 STATIC_MODIFIER_DESC_aac_gaul_unified_mod: "Впервые с 843 года вся Галлия объединена под знаменем Франкского королевства."
 STATIC_MODIFIER_NAME_aac_aachen_capital_mod: "Ахен — имперская столица"
 STATIC_MODIFIER_DESC_aac_aachen_capital_mod: "Двор-город Карла Великого, Ахен, развит как столица Франкской империи."
 STATIC_MODIFIER_NAME_aac_frankish_law_mod: "Франкский свод законов"
 STATIC_MODIFIER_DESC_aac_frankish_law_mod: "Франкский свод законов, продолжающий традицию Капитуляриев, утверждает правовую основу Империи."
 STATIC_MODIFIER_NAME_aac_missi_dominici_mod: "Королевские посланцы"
 STATIC_MODIFIER_DESC_aac_missi_dominici_mod: "Королевские посланцы, разосланные по всей Империи, надзирают за местным управлением — централизованное правление осуществлено."
 STATIC_MODIFIER_NAME_aac_renaissance_mod: "Каролингское Возрождение"
 STATIC_MODIFIER_DESC_aac_renaissance_mod: "Ахенский двор возрождён как центр учёности и культуры западной цивилизации."
 STATIC_MODIFIER_NAME_aac_trade_empire_mod: "Торговая империя"
 STATIC_MODIFIER_DESC_aac_trade_empire_mod: "Франкская империя, контролирующая торговые пути Рейна-Мааса-Шельды, становится величайшей торговой державой Западной Европы."
 STATIC_MODIFIER_NAME_aac_frankish_levy_mod: "Франкское ополчение"
 STATIC_MODIFIER_DESC_aac_frankish_levy_mod: "Хостовая система Карла Великого возрождена — военная мощь Франкской империи восстановлена."
 STATIC_MODIFIER_NAME_aac_palatine_mod: "Дворцовая стража"
 STATIC_MODIFIER_DESC_aac_palatine_mod: "Элитная стража императора воплощает военную славу Франкской империи."
 STATIC_MODIFIER_NAME_aac_cavalry_mod: "Каролингская кавалерия"
 STATIC_MODIFIER_DESC_aac_cavalry_mod: "Тяжёлые бронированные рыцари господствуют на франкском поле боя. Легендарная конная сила Карла Великого возрождена."
 STATIC_MODIFIER_NAME_aac_kingdom_of_franks_mod: "Франкское королевство восстановлено"
 STATIC_MODIFIER_DESC_aac_kingdom_of_franks_mod: "Слава 800 года возрождена в наши дни. Каролингское Франкское королевство официально восстановлено."
 STATIC_MODIFIER_NAME_aac_papal_mod: "Союз с папством"
 STATIC_MODIFIER_DESC_aac_papal_mod: "Папа одобряет власть франкского короля. Утверждается власть, признанная и Богом, и людьми."
 STATIC_MODIFIER_NAME_aac_italy_mod: "Италия завоёвана"
 STATIC_MODIFIER_DESC_aac_italy_mod: "Завоевание лангобардов Карлом Великим воссоздано. Италия, включая Рим, попадает под франкское владычество."
 STATIC_MODIFIER_NAME_aac_western_roman_empire_final_mod: "Западная Римская империя восстановлена"
 STATIC_MODIFIER_DESC_aac_western_roman_empire_final_mod: "Renovatio Imperii Romani свершилось. Ахен, Париж и Рим воссоединены под каролингским знаменем."
 STATIC_MODIFIER_NAME_aac_alsace_mod: "Эльзас и Швабия"
 STATIC_MODIFIER_DESC_aac_alsace_mod: "Эльзас и Швабия на восточном берегу Рейна включены во Франкскую империю."
 STATIC_MODIFIER_NAME_aac_champagne_mod: "Шампанские ярмарки"
 STATIC_MODIFIER_DESC_aac_champagne_mod: "Величайшая периодическая ярмарка Европы поддерживает торговое превосходство Франкской империи."
 STATIC_MODIFIER_NAME_aac_brittany_mod: "Бретань завоёвана"
 STATIC_MODIFIER_DESC_aac_brittany_mod: "Упорная кельтская земля бретонцев покорена — выход к Атлантике обеспечен."
 STATIC_MODIFIER_NAME_aac_holy_crown_mod: "Священная корона"
 STATIC_MODIFIER_DESC_aac_holy_crown_mod: "«Священная корона», одобренная и папой, и Богом, сияет над франкским королём."
 STATIC_MODIFIER_NAME_aac_reims_mod: "Реймс развит"
 STATIC_MODIFIER_DESC_aac_reims_mod: "Место крещения франков, Реймс, развит как религиозная столица."
 STATIC_MODIFIER_NAME_aac_paris_mod: "Париж развит"
 STATIC_MODIFIER_DESC_aac_paris_mod: "Величайший город Галлии, Париж, развит как западная столица Франкской империи."
 STATIC_MODIFIER_NAME_aac_fleet_mod: "Бретонский флот"
 STATIC_MODIFIER_DESC_aac_fleet_mod: "Морские традиции Бретани и Фландрии объединяются — Франкская империя владычествует и над Атлантикой, и над Северным морем."
 aac_aachen_megalopolis: "Ахен — величайший город Центральной Европы"
 aac_aachen_megalopolis_desc: "Двор-город Карла Великого, Ахен, наконец завершён как величайший мегаполис Центральной Европы. С населением в 200 000 человек, передовой городской застройкой и великолепной архитектурой, Ахен утверждён как центр европейской цивилизации."
 aac_events.10.t: "Престол Карла Великого — каролингское пробуждение"
 aac_events.10.d: "Ахен — этот город, где некогда держал двор Карл Великий (742–814) и был коронован Западным Римским императором в 800 году — вернулся в руки Каролингов. Под торжественным куполом Ахенского собора мраморный трон ожидает возвращения своего хозяина.\n\nМечта Карла Великого, названного «Отцом Европы (Pater Europae)» — единая христианская империя от Рейна до Пиренеев, от Рима до Балтики — настало время осуществить её. Провозгласи восстановление Каролингов и сделай первый шаг к воссозданию Франкского королевства."
 aac_events.10.a: "Правь как король каролингской династии — провозгласи монархию"
 aac_events.10.b: "Время ещё не пришло — накопи силы при нынешней системе правления"
 STATIC_MODIFIER_NAME_aac_aachen_megalopolis_mod: "Ахенский мегаполис"
 STATIC_MODIFIER_DESC_aac_aachen_megalopolis_mod: "Насколько разносится звон колоколов собора, улицы заполнены домами ремесленников, учёных и купцов — Ахен стал первым городом Запада."
 aac_events.50.b: "Да здравствует Франкское королевство! Каролингская слава возрождена — сохраним наши традиционные цвета"
 aac_events.99.a: "Прими имя и цвета Западной Римской империи (map_ROM) — провозгласи миру возрождение Рима"
 aac_events.99.b: "Провозгласи имя Западной Римской империи — но сохрани наши нынешние цвета"
