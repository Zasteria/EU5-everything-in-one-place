l_russian:
 nov_novgorod_mission_pack: "Слава Новгорода — от купеческой республики до владыки Руси"
 nov_novgorod_mission_pack_DESCRIPTION:0 "В 1337 году Республика Великий Новгород — величайшая торговая держава Руси. Вече (народное собрание) движет политику, и торговля с Ганзой приносит богатство. Но Москва неуклонно крепнет, и татарская угроза грозит с востока. Пушная торговля, владычество на Балтике, поражение Москвы — правь Великим князем всея Руси."
 nov_novgorod_mission_pack_CRITERIA_DESCRIPTION:0 "Возведи торговую империю, разгроми Москву, дабы объединить Русь, овладей Балтикой и Сибирью и правь Великим князем Руси."
 nov_novgorod_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы стать Великим князем Руси."
 nov_novgorod_mission_pack_BUTTON_DETAILS:0 "От новгородской купеческой республики до основания Русской империи!"
 nov_veche_republic: "Вечевая республика"
 nov_veche_republic_desc: "Вече Новгорода — своеобразное демократическое учреждение, в коем участвуют равно и горожане, и знать, и купцы. «Новгород принадлежит одному лишь Новгороду» — это воля граждан, а не князя, кая направляет это государство и отличает его от всех иных русских княжеств. Укрепи традицию вече и упрочи основы купеческой республики."
 nov_dev_novgorod: "Развей Великий Новгород"
 nov_dev_novgorod_desc: "«Господин Великий Новгород» на Волхове — крупнейший торговый город средневековой Руси. Ганзейские, византийские и восточные мусульманские купцы стекаются сюда, торгуя мехами, воском, льном и рыбой. Новгородский «Двор» (торговый пост) держит отделения в Любеке, Брюгге, Лондоне и Бергене."
 nov_birch_bark: "Берестяные грамоты"
 nov_birch_bark_desc: "Новгородцы имели обыкновение писать на берёзовой коре — свидетельство самого грамотного средневекового города мира. Используй эту традицию грамотности, дабы развить учёность, управление и торговые записи."
 nov_hanseatic_league: "Ганзейская торговля"
 nov_hanseatic_league_desc: "Новгород, будучи одним из крупнейших торговых городов Северной Европы, глубоко вплетён в сеть Ганзы. Укрепи торговые пути, ведущие в Любек, Гамбург и Брюгге."
 nov_fur_trade: "Пушная торговля"
 nov_fur_trade_desc: "Величайший торговый товар Новгорода — пушнина: беличьи, собольи, бобровые и норковые шкуры, добытые в сибирских лесах, продаются западноевропейской знати. Пушная торговля, называемая «золотом Севера», — источник богатства Новгорода."
 nov_dev_pskov: "Развей Псков"
 nov_dev_pskov_desc: "Упрямо независимый Псков — «младший брат» Новгорода — становится купеческой и культурной второй столицей. Развей этот город со стенами Псковского кремля и Троицким собором."
 nov_trade_empire: "Торговая империя"
 nov_trade_empire_desc: "Меха, воск, соль, рыба — торговая сеть Новгорода охватывает Северную Европу. Купеческие гильдии правят государством, и торговые посты возникают повсюду. Слава «Венеции Севера» распространяется по всему миру."
 nov_dev_staraya_russa: "Развей Старую Руссу"
 nov_dev_staraya_russa_desc: "Старая Русса, носящая имя «Старая Русь», славится добычей соли. Развей солеварение этого древнего города, дабы способствовать продовольственному снабжению и торговле Новгорода."
 nov_secure_novgorod_region: "Обеспечь Новгородскую землю"
 nov_secure_novgorod_region_desc: "Родной край Новгорода — полное владычество над Западноновгородской и Восточноновгородской областями утверждает основу для расширения."
 nov_conquer_tver: "Завоюй Тверь"
 nov_conquer_tver_desc: "Тверское княжество, некогда соперник Москвы за верховенство — его сила ныне угасла. Завоюй этот важный волжский город и открой путь на юг."
 nov_conquer_yaroslavl: "Завоюй Ярославль"
 nov_conquer_yaroslavl_desc: "Ярославль, город «Золотого кольца» на Волге — завоюй этот торговый город и захвати северный торговый путь."
 nov_conquer_moscow: "Завоюй Москву"
 nov_conquer_moscow_desc: "Со времён Ивана I (Калиты) Москва неуклонно расширялась с татарской поддержкой. «Москва или война» — разгроми величайшую угрозу Новгорода и захвати руководство Русью."
 nov_conquer_suzdal: "Завоюй Суздаль и Владимир"
 nov_conquer_suzdal_desc: "Суздаль и Владимир — древние города, некогда процветавшие наследниками Киевской Руси. Завоюй эти города со многими златоглавыми церквями и унаследуй легитимность древней Руси."
 nov_defeat_muscovy: "Уничтожь Москву"
 nov_defeat_muscovy_desc: "Великое княжество Московское уничтожено, и руководство Русью переходит к Новгороду. Честолюбия династии Рюриковичей сокрушены — вечевая республика решит судьбу будущего Руси."
 nov_conquer_smolensk: "Завоюй Смоленск"
 nov_conquer_smolensk_desc: "Смоленск, называемый «ключом Руси» — овладение этим узлом восточно-западного сообщения утверждает западное влияние."
 nov_conquer_ryazan: "Завоюй Рязань"
 nov_conquer_ryazan_desc: "Рязанское княжество, первым разорённое монгольским войском в 1237 году — завоюй его южные степные земли и возведи оборонительную линию против татар."
 nov_form_russia: "Образуй Русь"
 nov_form_russia_desc: "Единое государство Руси с центром в Новгороде обретает форму — не Москва, а Новгород объединил Русь. Какую форму примет эта новая Россия, рождённая из этого исторического поворота?"
 nov_vologda_trade: "Торговля в Вологде"
 nov_vologda_trade_desc: "Овладение Вологдой и Белоозером — ключевыми точками северного торгового пути — утверждает доступ к Белому морю и пушному торговому пути."
 nov_found_arkhangelsk: "Основай Архангельск"
 nov_found_arkhangelsk_desc: "Возведи портовый город Архангельск на берегу Белого моря — хотя он замерзает зимой, этот порт позволяет прямую торговлю с Северной Европой и Британией. В грядущие эпохи английские купцы будут прибывать сюда в Русь."
 nov_white_sea_trade: "Овладение беломорской торговлей"
 nov_white_sea_trade_desc: "Овладей торговым путём Белого моря и утверди прямую торговлю с Северной Европой. Архангельск развивается центром северной торговли."
 nov_conquer_perm: "Завоюй Пермь"
 nov_conquer_perm_desc: "Область Перми на верхней Каме — производитель «камских мехов», тончайших шкур. Завоевание этого места утверждает пушную торговую монополию."
 nov_kola_fortress: "Крепость Кола"
 nov_kola_fortress_desc: "Северная оконечность Кольского полуострова — займи свободный ото льда порт Мурманской бухты и утверди опорный пункт для северного морского пути."
 nov_siberian_frontier: "Сибирское пограничье"
 nov_siberian_frontier_desc: "Пересеки Уральские горы в Сибирь — путь «за пределы земли» с безграничными запасами пушнины открыт. Продвинься в Сибирь прежде завоевания Ермака."
 nov_fur_monopoly: "Пушная торговая монополия"
 nov_fur_monopoly_desc: "От Перми до Сибири — все пушные торговые пути попадают под контроль Новгорода. Монополизируй поставки роскошных мехов, желанных европейскими королями и дворянами, и обрети огромное богатство."
 nov_secure_karelia: "Обеспечь Карелию"
 nov_secure_karelia_desc: "Займи область Карелии на северном берегу Финского залива, дабы обеспечить доступ к Балтике — важный стратегический пункт, утверждающий границу со Швецией."
 nov_conquer_viborg: "Завоюй Выборг"
 nov_conquer_viborg_desc: "Крепость Выборг, построенная шведами — штурм этого ключевого пункта Финского залива открывает дверь к Балтике."
 nov_baltic_fleet: "Балтийский флот"
 nov_baltic_fleet_desc: "Построй Балтийский флот Новгорода — морская мощь незаменима, дабы овладеть североевропейской торговлей."
 nov_conquer_riga: "Завоюй Ригу"
 nov_conquer_riga_desc: "Рига в устье Двины — завоевание этого важного ганзейского города захватывает руководство балтийской торговлей. С духом «Гданьск или война» возьми также и Ригу."
 nov_livonia: "Покори Ливонию"
 nov_livonia_desc: "Восточное балтийское побережье, правимое Ливонским орденом — покорение этого региона утверждает доступ к прибалтийским землям."
 nov_neva_ports: "Гавани на Неве"
 nov_neva_ports_desc: "Развей портовый город на Неве — это место, где Пётр Великий позже построит «Петербург», станет вратами к Балтике."
 nov_orthodox_archbishop: "Православное архиепископство"
 nov_orthodox_archbishop_desc: "Архиепископ Новгорода держит власть независимо от Москвы и Константинополя — религиозная автономия поддерживает самостоятельность Новгорода. Укрепи православную традицию Новгорода с его Софийским собором."
 nov_cathedral_cities: "Города соборов"
 nov_cathedral_cities_desc: "Возведи соборы во всех городах Новгорода — осуществи идеал «Святой Руси» и покрой всю землю блеском православной веры."
 nov_guardian_of_orthodoxy: "Страж православия"
 nov_guardian_of_orthodoxy_desc: "С падением Константинополя перед османами миссия православного стража переходит к Новгороду. Захвати титул «Третьего Рима» — пусть не Москва, а Новгород держит его."
 nov_novgorod_chronicle: "Новгородская летопись"
 nov_novgorod_chronicle_desc: "Новгородская летопись (Novgorodskaja Letopis) — этот исторический труд, тщательно записывающий события каждого года, несёт духовное наследие Новгорода грядущим поколениям."
 nov_dev_torzhok: "Развей Торжок"
 nov_dev_torzhok_desc: "Торжок, расположенный между Новгородом и Москвой — развей его торговым узлом и овладей южным торговым путём."
 nov_kazan_subjugation: "Покори Казань"
 nov_kazan_subjugation_desc: "Казанское ханство — покорение этого татарского наследственного государства, правящего средней Волгой, открывает путь на восток."
 nov_ushkuiniks: "Ушкуйники"
 nov_ushkuiniks_desc: "Ушкуйники — смешанная группа речных пиратов, первопроходцев и солдат Новгорода. Включи этих суровых людей, спускающихся по Волге и нападающих на татарские торговые суда, в регулярную армию Новгорода и обучи их отборными войсками."
 nov_dev_suzdal: "Развей Суздаль"
 nov_dev_suzdal_desc: "Суздаль из «Золотого кольца» — развей этот древний город со многими средневековыми церквями и монастырями культурным и религиозным центром."
 nov_conquer_beloozero: "Завоюй Белоозеро"
 nov_conquer_beloozero_desc: "Область Белоозера у «Белого озера» — богатая мехом и рыбой, займи эту землю и обеспечь северный торговый путь."
 nov_dev_kholmogory: "Развей Холмогоры"
 nov_dev_kholmogory_desc: "Холмогоры на Двине — развей этот портовый город вратами к Белому морю и заложи основу для будущего процветания Архангельска."
 nov_conquer_vladimir: "Завоюй Владимир"
 nov_conquer_vladimir_desc: "Некогда столица Великого княжества Владимирского — этот древний город со многими религиозными постройками, включая Дмитриевский собор, падает Новгороду."
 nov_tatar_wars: "Войны против татар"
 nov_tatar_wars_desc: "Новгород был единственным крупным городом Руси, не покорившимся татарскому игу — неси ныне эту гордость оружием в борьбе против татар. С духом невских берегов разгроми степных всадников."
 nov_golden_horde: "Контрудар против Золотой Орды"
 nov_golden_horde_desc: "Подними знамя Новгорода на земле Золотой Орды (Кипчакского ханства) — кто освободит Русь от монгольского владычества, тот истинный владыка Руси."
 nov_nizhny_novgorod: "Завоюй Нижний Новгород"
 nov_nizhny_novgorod_desc: "«Нижний Новгород» — покори этот торговый город на слиянии Волги и Оки и захвати торговлю средней Волги."
 nov_orthodox_mission: "Православная миссия"
 nov_orthodox_mission_desc: "Распространи православную веру среди язычников севера и востока — миссионерская деятельность среди финских народов, коренных сибирских народов и татар умножает легитимность Новгорода."
 nov_hanseatic_kontors: "Ганзейские конторы"
 nov_hanseatic_kontors_desc: "Возведи новгородские торговые посты (конторы) в важнейших ганзейских городах — Новгороде, Риге, Любеке — и овладей североевропейской торговой сетью напрямую."
 nov_ostrog_system: "Система острогов"
 nov_ostrog_system_desc: "Построй сеть крепостей (острогов), поддерживающих продвижение в Сибирь — форпосты для завоевания Сибири, ведущие к Тюмени, Тобольску и Иркутску."
 nov_dev_ryazan: "Развей Рязань"
 nov_dev_ryazan_desc: "Рязань, уничтоженная монголами — новый город Рязань был возведён на её руинах. Развей этот важный южный город форпостом к степи."
 nov_estonian_coast: "Эстонское побережье"
 nov_estonian_coast_desc: "Покорение эстонского побережья завершает контроль над южным берегом Балтики. Займи ганзейский торговый город Ревель (Таллин)."
 nov_conquer_teutonic: "Разгроми Тевтонский орден"
 nov_conquer_teutonic_desc: "Наследие балтийских крестовых походов заканчивается — поражение Тевтонского ордена приводит юго-восточное балтийское побережье полностью под контроль Новгорода."
 nov_moscow_capital: "Развей Москву"
 nov_moscow_capital_desc: "Развей завоёванную Москву важным городом под новгородским правлением — обрати бывший дворец московского великого князя в резиденцию новгородского наместника, символ власти."
 nov_iron_ring: "Железное кольцо"
 nov_iron_ring_desc: "Крепостное кольцо, защищающее Новгород — оборонительная сеть, связующая Псков, Новгород, Ладогу и Тверь, завершена. Железная оборонительная система, способная отразить вторжения с любого направления."
 nov_kholmogory_trade: "Торговля в Холмогорах"
 nov_kholmogory_trade_desc: "От торгового узла Холмогоры на Двине до Белого моря — захвати этот северный торговый путь прежде английской Московской компании."
 nov_eastern_orthodoxy: "Восточная церковь основана"
 nov_eastern_orthodoxy_desc: "После падения Константинополя Новгород выступает центром Восточной церкви. Софийский собор сияет наследником Святой Софии Константинопольской."
 nov_amber_road: "Янтарный путь"
 nov_amber_road_desc: "Янтарный торговый путь, идущий от Балтики на юг — балтийский янтарь, новгородские меха и восточный шёлк пересекаются на этом ныне подконтрольном Новгороду пути."
 nov_great_novgorod: "Великий Новгород завершён"
 nov_great_novgorod_desc: "Торговая империя, военная мощь, православная власть — три столпа завершены, и Новгород становится государством, достойным титула «Великий». Сделай последний шаг к «Великому князю Руси»."
 nov_ruler_of_rus: "Великий князь Руси"
 nov_ruler_of_rus_desc: "«Великий князь Новгородский и всея Руси» — этот титул звучал над вечевой площадью Новгорода. От Балтики до Сибири, от Белого моря до южных степей — знамя Новгорода реет над всей Русью. Купеческая республика возвела одну из величайших империй мира. История переписана заново — Новгород решает будущее Руси."
 nov_events.10.t: "Москва пала — руководство Русью переходит к Новгороду"
 nov_events.10.d: "Московский кремль пал в новгородские руки. Честолюбия презираемой как «татарские псы» московской великокняжеской семьи сокрушены. Поскольку будущее Руси ныне решается вечевой республикой Новгорода, эта победа не просто территориальное завоевание — это поворотный момент, коренным образом меняющий русскую историю."
 nov_events.10.a: "Москва пала! Начинается эпоха Новгорода!"
 nov_events.20.t: "Образование Руси — новое государство вокруг Новгорода"
 nov_events.20.d: "Единое государство Руси с центром в Новгороде рождено. Как ему называться? Провозгласить «Великое княжество Русь», дабы возвестить новое начало, или гордо сохранить имя «Новгород»?"
 nov_events.20.a: "Провозгласить «Великое княжество Русь» — рождение новой России"
 nov_events.20.b: "Гордо сохранить имя «Новгород»"
 nov_events.99.t: "Великий князь Руси — Новгород правит Россией"
 nov_events.99.d: "«Великий князь Новгородский и всея Руси» — этот титул звучал над вечевой площадью Новгорода. От Балтики до Сибири, от Белого моря до степи — знамя Новгорода реет над всей Русью. Купеческая республика возвела одну из величайших империй истории. История переписана заново."
 nov_events.99.a: "Да здравствует Великий князь Руси! Новгород навеки!"
