 nov_events.1.t: "Великий Новгород — Великая республика"
 nov_events.1.d: "В 1337 году Республика Великий Новгород — крупнейший торговый город-государство Руси.\n\nЭтот город, раскинувшийся по обоим берегам Волхова, делится на «Софийскую сторону» на западном берегу и «Торговую сторону» на восточном берегу. В его центре возвышается символ Новгорода, Софийский собор.\n\nВече (народное собрание) действует высшим органом решений, тогда как посадник (мэр), тысяцкий (глава ополчения) и архиепископ ведают управлением.\n\n«Новгород принадлежит одному лишь Новгороду» — не князь и не император, но воля граждан направляет эту республику.\n\nЗдесь учреждена ганзейская контора, и торговля процветает с Любеком, Брюгге, Лондоном и Бергеном. Меха, воск, лён и рыба поставляются через Новгород в Западную Европу.\n\nНо Москва неуклонно крепнет, Литва теснит с запада, а татары подстерегают с востока. Новгород выжил, используя это многослойное равновесие сил. Ныне используй эту мудрость и купеческую силу, дабы стремиться к владычеству над Русью."
 nov_events.1.a: "Защити свободу и процветание Новгорода!"
