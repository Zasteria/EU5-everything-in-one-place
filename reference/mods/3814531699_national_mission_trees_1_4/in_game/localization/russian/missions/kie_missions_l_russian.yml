l_russian:
 kie_kyiv_mission_pack: "Воссоединение Руси и владыка казаков"
 kie_kyiv_mission_pack_DESCRIPTION:0 "В 1337 году Киевское княжество — малое государство, зажатое между Литвой и татарами. Но Киев некогда сиял сердцем Киевской Руси — Софийский собор, Печерская лавра и Золотые ворота всё ещё свидетельствуют о его блеске. Объедини левобережную и правобережную Украину, завоюй Галич и Волынь, разгроми татар казачьей военной мощью, образуй Рутению и правь Великим княжеством."
 kie_kyiv_mission_pack_CRITERIA_DESCRIPTION:0 "Объедини Русь, основай Казацкий гетманат, стань стражем православной веры, образуй Рутению и правь Великим княжеством Киевским."
 kie_kyiv_mission_pack_BUTTON_TOOLTIP:0 "Правь Великим княжеством Киевским над всей Русью."
 kie_kyiv_mission_pack_BUTTON_DETAILS:0 "Объедини раздробленную Русь под Киевом — захвати степь казацким мечом!"
 kie_restore_kyiv: "Восстанови Киев"
 kie_restore_kyiv_desc: "В 1337 году Киев — некогда золотой город Киевской Руси — опустошён монгольским вторжением 1240 года. Софийский собор и Печерская лавра всё ещё свидетельствуют о прошлом блеске. Восстанови «мать городов русских» великим городом."
 kie_dev_kyiv: "Развей Киев"
 kie_dev_kyiv_desc: "Ключевой перекрёсток, связующий торговые пути Волхова и Днепра — развей Киев центром торговли, культуры и политики."
 kie_secure_left_bank: "Укрепи контроль над левобережной Украиной"
 kie_secure_left_bank_desc: "Укрепи контроль над левобережной Украиной — сохрани культурные традиции Руси и, с умелой бюрократией, сделай эту богатую пахотную землю основой Киева."
 kie_secure_right_bank: "Укрепи контроль над правобережной Украиной"
 kie_secure_right_bank_desc: "Укрепи контроль над правобережной Украиной — через распространение украинской культуры и укрепление власти короны сделай правобережную Украину коренной землёй Киева."
 kie_conquer_chernihiv: "Поход на Чернигов"
 kie_conquer_chernihiv_desc: "Завоюй Чернигов, древний город русского княжества, и упрочи контроль над левобережной Украиной."
 kie_conquer_poltava: "Марш на Полтаву"
 kie_conquer_poltava_desc: "Покори казацкий оплот Полтаву и открой дверь к Слобожанщине."
 kie_kyiv_metropolitan: "Киевская митрополия"
 kie_kyiv_metropolitan_desc: "Возведи независимую от Константинополя Киевскую митрополию центром православной церкви Руси."
 kie_unite_rus: "Воссоединение Руси"
 kie_unite_rus_desc: "Воссоедини раздробленные монгольским вторжением русские княжества под Киевом вновь. «Мать городов русских» вновь сияет центром всей Украины."
 kie_secure_volhynia: "Обеспечь Волынь"
 kie_secure_volhynia_desc: "Обеспечь Волынь на границе Руси и Польши, дабы утвердить западное влияние."
 kie_conquer_lutsk: "Поход на Луцк"
 kie_conquer_lutsk_desc: "Займи волынский ключевой город Луцк и сделай его плацдармом на запад."
 kie_conquer_galicia: "Вторжение в Галич"
 kie_conquer_galicia_desc: "Вторгнись в Галич — завоевание этого региона утверждает полный контроль над Западной Украиной."
 kie_red_ruthenia: "Покори Червонную Русь"
 kie_red_ruthenia_desc: "Покори Червонную Русь — покорение этого региона вокруг Львова завершает полный контроль над Западной Украиной."
 kie_conquer_lviv: "Займи Львов"
 kie_conquer_lviv_desc: "«Город льва», Львов — завоюй этот торговый город, построенный князем Даниилом, и захвати контроль над западной торговлей."
 kie_conquer_podolia: "Продвинься в Подолию"
 kie_conquer_podolia_desc: "Продвинься в Подолию — завоюй этот земледельческий регион правого берега и обеспечь путь к черноморскому побережью."
 kie_conquer_vinnytsia: "Занятие Винницы"
 kie_conquer_vinnytsia_desc: "Займи Винницу и утверди земледельческий опорный пункт правобережной Украины."
 kie_conquer_polesia: "Поход на Полесье"
 kie_conquer_polesia_desc: "Завоюй болотистое Полесье — возведи северную оборонительную линию."
 kie_conquer_minsk: "Займи Минск"
 kie_conquer_minsk_desc: "Займи Минск, центр Белой Руси, дабы расширить северное влияние."
 kie_cossack_host: "Возведи казацкое войско"
 kie_cossack_host_desc: "Казаки собираются под знамёнами Киева — включи запорожскую казацкую традицию в регулярную армию и построй лучшую конницу Руси."
 kie_zaporizhzhia: "Запорожская Сечь"
 kie_zaporizhzhia_desc: "Возведи крепость Запорожской Сечи за днепровскими порогами опорным пунктом для защиты степи."
 kie_tatar_wars: "Войны против татар"
 kie_tatar_wars_desc: "Веди решающую битву против крымских татар, правящих северным Причерноморьем. Используй казацкую конницу, дабы противостать им и вернуть украинскую степь."
 kie_black_sea_steppe: "Завоюй Причерноморскую степь"
 kie_black_sea_steppe_desc: "Займи понтийскую степь — обширное пастбище делает Киев владыкой северного Причерноморья."
 kie_conquer_crimea: "Завоевание Крыма"
 kie_conquer_crimea_desc: "Завоюй полуостров Крымского ханства, дабы утвердить верховенство на Чёрном море. Займи генуэзский торговый пост Каффа."
 kie_black_sea_coast: "Возведи черноморский флот"
 kie_black_sea_coast_desc: "Используй казацкие чайки (быстроходные суда), спускающиеся по Днепру к Чёрному морю — брось вызов османам и захвати черноморский торговый путь."
 kie_kyiv_pechersk: "Киево-Печерская лавра"
 kie_kyiv_pechersk_desc: "Киево-Печерская лавра, основанная в 1051 году — духовное сердце православной церкви Руси. Развей этот монастырь и провозгласи Киев православным центром."
 kie_orthodox_revival: "Православное возрождение"
 kie_orthodox_revival_desc: "Отстрой разрушенную монгольским вторжением православную церковь Руси — возведи соборы по всей земле и возроди «Святую Русь»."
 kie_grain_breadbasket: "Украина — житница Европы"
 kie_grain_breadbasket_desc: "Плодородный чернозём — Украина, богатая пахотная земля, называемая «житницей Европы». Максимизируй эту продуктивность и упрочи продовольственную основу царства."
 kie_trade_routes: "Торговые пути Киева"
 kie_trade_routes_desc: "«Путь из варяг в греки», связующий Балтику с Чёрным морем — оживи этот древний торговый путь, кой нёс процветание Киеву."
 kie_hetmanate: "Казацкий гетманат"
 kie_hetmanate_desc: "Гетман — учреждение Казацкого гетманата позволяет Киеву выступить государством с собственной военно-политической системой. Предвосхити великое свершение Богдана Хмельницкого 1648 года."
 kie_literacy_culture: "Способствуй образованию и культуре"
 kie_literacy_culture_desc: "Духовная традиция Киева — как первопроходец монастырской письменной культуры и соборных школ, способствуй культуре образования."
 kie_conquer_zhytomyr: "Развей Житомир"
 kie_conquer_zhytomyr_desc: "Развей Житомир, ключевой пункт правобережной Украины, надлежащими постройками в важный опорный город."
 kie_salt_of_galicia: "Соль Галича"
 kie_salt_of_galicia_desc: "Соляные копи Галича — займи этот регион, производящий «белое золото», и обеспечь устойчивую поставку этого важного товара."
 kie_dev_poltava: "Развей Полтаву"
 kie_dev_poltava_desc: "Развей Полтаву, ключевой город казацкой левобережной Украины, в восточный форпост."
 kie_beyond_donets: "За Донцом"
 kie_beyond_donets_desc: "Слобожанщина — расселяй казацких крестьян вдоль Донца и развивай восточную степь."
 kie_conquer_moldavia: "Вторжение в Молдавию"
 kie_conquer_moldavia_desc: "Завоюй Молдавию на черноморском побережье и достигни полного вхождения в черноморскую торговлю."
 kie_amber_route: "Янтарный путь"
 kie_amber_route_desc: "Древний янтарный торговый путь с Балтики через Луцк и Львов на юг образует хребет рутенской торговой сети."
 kie_fortress_line: "Крепостная линия"
 kie_fortress_line_desc: "Крепостная линия против угроз со степи — оборонительная система от Запорожья до Подолии защищает украинских крестьян и города."
 kie_great_kyiv: "Великий Киев"
 kie_great_kyiv_desc: "Верни Киеву величие, кое он имел до монгольского вторжения — отстрой его великолепным городом, чьи золотые купола вернут свой изначальный блеск."
 kie_ruthenian_culture: "Рутенская культурная самобытность"
 kie_ruthenian_culture_desc: "Утверди самобытную украинско-рутенскую культуру — своеобразную самобытность, в коей сливаются украинский язык, казацкая культура и православная вера."
 kie_dev_chernihiv: "Развей Чернигов"
 kie_dev_chernihiv_desc: "Развей Чернигов центром культуры и торговли в левобережной Украине."
 kie_conquer_wallachia: "Продвинься в Валахию"
 kie_conquer_wallachia_desc: "Валахия вдоль Дуная — завоюй этот регион опорным пунктом к Балканам и заверши контроль над черноморским побережьем."
 kie_cossack_cavalry: "Элита казацкой конницы"
 kie_cossack_cavalry_desc: "Казацкая конница — и лёгкая, и тяжёлая, возведённая в отборные войска. Одолей татар их подвижностью и боевой мощью."
 kie_kyiv_academy: "Киево-Могилянская академия"
 kie_kyiv_academy_desc: "Возведи Киево-Могилянскую академию прежде её основания 1632 года — один из старейших университетов Восточной Европы. Осуществи духовное и культурное возрождение Руси."
 kie_conquer_krakow: "Займи Краков"
 kie_conquer_krakow_desc: "Краков, историческая столица Королевства Польша — завоевание этого города с Вавелем значительно расширяет влияние на Центральную Европу."
 kie_navy_dnipro: "Днепровский флот"
 kie_navy_dnipro_desc: "Используй казацкие парусные чайки от Днепра до Чёрного моря — Днепровский флот охраняет черноморскую торговлю."
 kie_protect_orthodoxy: "Защитник православия"
 kie_protect_orthodoxy_desc: "После падения Константинополя Киев выступает стражем православного мира — утверди высшую власть православной церкви Руси."
 kie_conquer_vilnius: "Занятие Вильнюса"
 kie_conquer_vilnius_desc: "Вильнюс, столица Великого княжества Литовского — занятие этого города кладёт конец литовскому верховенству над Русью."
 kie_western_alliance: "Союз с Западом"
 kie_western_alliance_desc: "Построй дипломатические отношения с Польшей, Венгрией и Священной Римской империей, дабы утвердить западный союз против угроз с востока."
 kie_silver_route: "Серебряный путь"
 kie_silver_route_desc: "Восточное серебро течёт через Киев вдоль Днепра на запад — утверди положение Киева в международной торговле."
 kie_ruthenian_army: "Реформа рутенской армии"
 kie_ruthenian_army_desc: "Соедини казацкую традицию с западной военной технологией — рутенская армия правит лучшей силой Восточной Европы."
 kie_conquer_warsaw: "Занятие Варшавы"
 kie_conquer_warsaw_desc: "Варшава, столица Польши — заверши долгую борьбу с Польско-Литовской дворянской республикой."
 kie_beeswax_honey: "Торговля воском и мёдом"
 kie_beeswax_honey_desc: "Украинский воск — ключевой товар, поставляемый православным церквям и на западноевропейские рынки."
 kie_form_ruthenia: "Образуй Рутению"
 kie_form_ruthenia_desc: "Провозгласи образование государства «Рутения» — охватывающего Украину, Белоруссию и Западную Русь. Мечта о единстве Руси со времён монгольского вторжения наконец осуществлена."
 kie_grand_principality: "Великое княжество Киевское"
 kie_grand_principality_desc: "«Великое княжество Киевское» — этот титул свидетельствует о блеске древней Киевской Руси. Киев, где сливаются казацкая военная мощь, православная власть и рутенская культура, правит великой державой Восточной Европы."
 kie_events.1.t: "Киев пробуждается — восстановление матери городов русских"
 kie_events.1.d: "Над холмами вдоль Днепра — золотые купола Софийского собора сияют в киевском небе.\n\nВ 1337 году Киевское княжество мало, но несёт вес истории сердцем Киевской Руси. «Мать всех городов русских» — этот титул определяет миссию Киева.\n\nЛитва, Польша и татары теснят со всех сторон, но дары Днепра, плодородный чернозём и казацкий дух поддерживают Киев.\n\nМонахи Печерской лавры молятся — «Восстань вновь, о Русь». Ответь на эту молитву."
 kie_events.1.a: "Верни славу Киева!"
 kie_events.20.t: "Провозглашение Казацкого гетманата"
 kie_events.20.d: "Запорожские казаки стоят строем под знаменем гетмана — Великий князь Киевский формально включает казацкую силу в государственную систему и провозглашает «Казацкий гетманат». Эта своеобразная военно-государственная система определит будущее Рутении."
 kie_events.20.a: "Да здравствует Казацкий гетманат! Да здравствует свободная Украина!"
 kie_events.60.t: "Образование Рутении — новая держава Восточной Европы"
 kie_events.60.d: "Украина, Белоруссия и Галич под одним знаменем — единое восточнославянское государство «Рутения» выступает новой великой державой Восточной Европы. Все народы Руси собираются под золотыми куполами Киева."
 kie_events.60.a: "Да здравствует Рутения! Да здравствует Киев!"
 kie_events.99.t: "Великое княжество Киевское — возрождение славы Руси"
 kie_events.99.d: "«Великое княжество Киевское» — этот титул звучит вдоль берегов Днепра. Царство, где сливаются казацкая военная мощь, православная власть и рутенская культура, правит владыкой Восточной Европы. Киевская Русь, разрушенная монголами, возрождена в новой форме — мать городов русских, Киев, вновь сияет."
 kie_events.99.a: "Да здравствует Великое княжество Киевское! Да здравствует слава Руси навеки!"
 STATIC_MODIFIER_NAME_kie_kyiv_dev_mod: "Золотой город на Днепре"
 STATIC_MODIFIER_DESC_kie_kyiv_dev_mod: "Киев развит великим городом, достойным титула «мать городов русских»."
 STATIC_MODIFIER_NAME_kie_left_bank_mod: "Левобережная Украина обеспечена"
 STATIC_MODIFIER_DESC_kie_left_bank_mod: "Левобережная Украина обеспечена — восточный Днепр под киевским правлением."
 STATIC_MODIFIER_NAME_kie_right_bank_mod: "Правобережная Украина обеспечена"
 STATIC_MODIFIER_DESC_kie_right_bank_mod: "Правобережная Украина обеспечена — западный Днепр объединён с востоком."
 STATIC_MODIFIER_NAME_kie_poltava_mod: "Казацкий оплот обеспечен"
 STATIC_MODIFIER_DESC_kie_poltava_mod: "Казацкий оплот Полтава обеспечен — степная граница стабилизирована."
 STATIC_MODIFIER_NAME_kie_metropolitan_mod: "Сердце православия Руси"
 STATIC_MODIFIER_DESC_kie_metropolitan_mod: "Киевская митрополия восстановлена сердцем православия Руси."
 STATIC_MODIFIER_NAME_kie_volhynia_mod: "Житница Волыни"
 STATIC_MODIFIER_DESC_kie_volhynia_mod: "Плодородные равнины Волыни становятся житницей киевского государства."
 STATIC_MODIFIER_NAME_kie_lutsk_mod: "Ключ Западной Руси"
 STATIC_MODIFIER_DESC_kie_lutsk_mod: "Луцк — ключ Западной Руси — обеспечен и открывает путь к Галичу."
 STATIC_MODIFIER_NAME_kie_galicia_mod: "Вторжение в Галич"
 STATIC_MODIFIER_DESC_kie_galicia_mod: "Галич захвачен, и наследие Галицко-Волынского княжества возрождено."
 STATIC_MODIFIER_NAME_kie_red_ruthenia_mod: "Червонная Русь покорена"
 STATIC_MODIFIER_DESC_kie_red_ruthenia_mod: "Червонная Русь покорена и объединена с Украиной."
 STATIC_MODIFIER_NAME_kie_lviv_mod: "Процветание города льва"
 STATIC_MODIFIER_DESC_kie_lviv_mod: "Львов — город льва — процветает вратами западной торговли."
 STATIC_MODIFIER_NAME_kie_podolia_mod: "Чернозёмная пахотная земля"
 STATIC_MODIFIER_DESC_kie_podolia_mod: "Чернозёмная пахотная земля Подолии обеспечена — земледельческое богатство течёт в Киев."
 STATIC_MODIFIER_NAME_kie_vinnytsia_mod: "Оплот правобережья"
 STATIC_MODIFIER_DESC_kie_vinnytsia_mod: "Винница служит оплотом правобережной Украины."
 STATIC_MODIFIER_NAME_kie_polesia_mod: "Болотный защитный вал"
 STATIC_MODIFIER_DESC_kie_polesia_mod: "Болота Полесья образуют природный защитный вал против вторжений с севера."
 STATIC_MODIFIER_NAME_kie_minsk_mod: "Сердце Белой Руси"
 STATIC_MODIFIER_DESC_kie_minsk_mod: "Минск — сердце Белой Руси — попадает под киевский контроль."
 STATIC_MODIFIER_NAME_kie_cossack_mod: "Казацкий меч"
