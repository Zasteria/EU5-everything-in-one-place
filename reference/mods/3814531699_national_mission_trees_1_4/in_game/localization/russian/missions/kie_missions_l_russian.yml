 kie_build_sevastopol: "Постройка морской базы Севастополь"
 kie_build_sevastopol_desc: "Построй рутенскую морскую базу в естественной гавани Феодоро — этот морской оплот, повелевающий Чёрным морем, станет родным портом казацкого флота."
 kie_build_odesa: "Постройка порта Одесса"
 kie_build_odesa_desc: "Построй крупнейший торговый порт Рутении на побережье Хаджибея — этот порт, связующий черноморскую торговлю со Средиземноморьем, станет жизненной артерией рутенской торговли."
 STATIC_MODIFIER_NAME_kie_sevastopol_mod: "Морская база Севастополь"
 STATIC_MODIFIER_DESC_kie_sevastopol_mod: "Морская база Севастополь, повелевающая Чёрным морем, возведена морским оплотом Рутении."
 STATIC_MODIFIER_NAME_kie_odesa_mod: "Торговый порт Одесса"
 STATIC_MODIFIER_DESC_kie_odesa_mod: "Одесса, центр черноморской торговли, построена — морская торговля Рутении процветает."
 STATIC_MODIFIER_NAME_kie_unite_rus_mod: "Наследие воссоединения"
