 kie_conquer_smolensk: "Поход на Смоленск"
 kie_conquer_smolensk_desc: "Займи Смоленск, «ключ Руси» и перекрёсток восточно-западного сообщения — утверди влияние на Москву и Польшу. Используй Чернигов опорным пунктом, дабы овладеть всем регионом Смоленска."
