l_russian:
 nor_kongedommen_mission_pack: "Kongeriket Norge — слава Норвегии"
 nor_kongedommen_mission_pack_DESCRIPTION:0 "В 1337 году Норвегия в личной унии со Швецией под королём Магнусом Эрикссоном, оставаясь под датским влиянием. Как наследники викингов, вырвись из-под Дании и объедини Скандинавию. Через бергенские рыбные промыслы, владычество над Северным морем, колонии в Исландии и Гренландии, и великое плавание в Винланд — и с выбором веры (католической, лютеранской или норманнской) — построй Норвежскую империю."
 nor_kongedommen_mission_pack_CRITERIA_DESCRIPTION:0 "Как Норвегия, достигни независимости, единства, владычества над Северной Атлантикой и колониальной империи, дабы основать Норвежскую империю."
 nor_kongedommen_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы построить Норвежскую империю."
 nor_kongedommen_mission_pack_BUTTON_DETAILS:0 "С гордостью наследников викингов, выкуй Норвегию в Империю!"
 nor_kingdom_of_norway: "Королевство Норвегия"
 nor_kingdom_of_norway_desc: "В 1337 году Норвегия в личной унии со Швецией под королём Магнусом Эрикссоном, тогда как датское влияние постоянно угрожает Северу. Как наследники викингов, укрепи королевскую легитимность и упрочи основы независимого норвежского королевства."
 nor_control_denmark: "Овладей Данией"
 nor_control_denmark_desc: "Дания — величайшая угроза и исторический соперник Норвегии. Занятие Копенгагена или превращение Дании в норвежского вассала переносит руководство Кальмарской унией к Норвегии."
 nor_sweden_union: "Личная уния со Швецией"
 nor_sweden_union_desc: "Укрепи и сохрани личную унию со Швецией, дабы вся мощь северной Скандинавии собралась под Норвегией. Продолжи правление короля Магнуса и сделай этот союз основой скандинавского единства."
 nor_unite_scandinavia: "Объедини Скандинавию"
 nor_unite_scandinavia_desc: "Дания контролируема, Швеция в личной унии — вся Скандинавия объединена под норвежским знаменем. Со времён эпохи викингов исторический миг, когда северный мир управляется под одним королём, настал здесь."
 nor_sound_toll: "Зундская пошлина"
 nor_sound_toll_desc: "С разгромленной Данией пролив Эресунн падает под норвежский контроль. Сбор Зундской пошлины порождает огромный доход."
 nor_develop_stockholm: "Развей Стокгольм"
 nor_develop_stockholm_desc: "Через шведскую личную унию развей Стокгольм восточным административным узлом Норвежской империи."
 nor_secure_bergen: "Обеспечь Берген"
 nor_fleet_of_norway: "Флот Норвегии"
 nor_fleet_of_norway_desc: "Норвежцы — потомки викингов — народ моря. Построение мощного флота с базой в Бергене утверждает возможность развёртывания по всему Северному морю, Северной Атлантике и Балтике."
 nor_north_sea_markets: "Североморские рынки"
 nor_north_sea_markets_desc: "Норвегия использует своё географическое преимущество, обращённое к Северному морю, дабы развить торговлю. Утверди Норвегию крупным игроком в североморской торговле с ежемесячным доходом 100+ и множеством торговых центров."
 nor_iceland_colony: "Овладей Исландией"
 nor_iceland_colony_desc: "Исландия была заселена норвежцами в 874 году — заморской базой норвежской культуры. Владение множеством исландских провинций завершает плацдарм в Северной Атлантике и приближает Гренландию и Винланд."
 nor_greenland_expedition: "Гренландская экспедиция"
 nor_greenland_expedition_desc: "В 985 году Эрик Рыжий (Эйрик рауди) основал колонию в Гренландии. Сделай этот первый шаг к западному континенту и открой путь к легендарному Винланду."
 nor_vinland: "Винланд"
 nor_orkney_shetland: "Оркнейские и Шетландские острова"
 nor_orkney_shetland_desc: "Оркнейские и Шетландские острова находятся под норвежским влиянием со времён эпохи викингов. Обеспечение этих стратегических островов резко улучшает возможность развёртывания в Северном море и к Британским островам."
 nor_conquer_scotland: "Завоюй Шотландию"
 nor_conquer_scotland_desc: "Западное побережье Шотландии и Гебриды некогда были во власти викингов. Захват Эдинбурга и Гебрид открывает путь к Йорку — столице области Денло."
 nor_invade_england: "Вторгнись в Англию"
 nor_invade_england_desc: "Йорк был некогда столицей норвежского королевства Йорвик. Норвежские силы, занимающие Йорк, возрождают память о Денло в наши дни."
 nor_kingdom_of_britain: "Королевство Британия"
 nor_master_of_north_sea: "Владыка Северного моря"
 nor_master_of_north_sea_desc: "Североморские рынки обеспечены, Оркнейские и Шетландские острова захвачены — Норвегия бесспорный владыка Северного моря. С флотом 50+ и доходом 200+ норвежское знамя реет над всем Северным морем."
 nor_secure_nidaros: "Обеспечь Нидарос"
 nor_fisheries: "Развей рыбные промыслы"
 nor_fisheries_desc: "Норвегия — величайшая рыболовецкая держава Европы. Треска, сельдь и лосось наполняют Северную Атлантику в изобилии. Полностью развей рыбные промыслы этой нации и утверди систему массового вывоза в Северное море и на Балтику."
 nor_timber_industry: "Лесопромышленность"
 nor_arctic_trade: "Арктическая торговля"
 nor_develop_oslo: "Развей Осло"
 nor_absolutism: "Абсолютизм"
 nor_absolutism_desc: "Утверди абсолютную монархию в Норвегии. Возвышение королевской власти и укрепление легитимности готовит основу для централизованного имперского правления."
 nor_northern_economy: "Северная экономика"
 nor_northern_economy_desc: "Арктическая торговля и экономические реформы абсолютной монархии — норвежская экономика достигает высшего уровня в Северной Европе. Докажи это ежемесячным доходом 300+ и множеством торговых центров."
 nor_religious_question: "Вопрос веры"
 nor_religious_question_desc: "Буря Реформации нахлынула в Норвегию. Духовенство Нидаросского собора взывает к верности Риму. Но всё больше находят отклик в новом учении Лютера. И — некоторые мечтают вернуться к древним богам. Выбор норвежского короля определит душу этого северного королевства."
 nor_catholic_norway: "Католическая Норвегия"
 nor_catholic_norway_desc: "Королевство Норвегия сохраняет верность Римской церкви. Храня традицию северного католицизма, символизируемую Нидаросским собором, сделай Норвегию стражем северной католической цивилизации через тесные узы с папой."
 nor_northern_crusade: "Северный крестовый поход"
 nor_northern_crusade_desc: "Норвегия участвует в священной войне северным щитом христианства. Через битву с неверными норвежская религиозная власть и престиж растут."
 nor_papal_champion: "Поборник папы"
 nor_papal_champion_desc: "Глубокое доверие с папством и контроль над Любеком — Норвегия утвердила несокрушимое положение сильнейшего стража северной католической цивилизации."
 nor_reformation: "Реформация"
 nor_reformation_desc: "Норвегия принимает лютеранство (или кальвинизм). Церковное имущество переходит к короне, укрепляя государственные финансы."
 nor_protestant_church: "Протестантская церковь"
 nor_protestant_church_desc: "Развей университеты, дабы обучать лютеранских богословов и укоренить протестантскую веру по всей Норвегии."
 nor_protestant_empire: "Протестантская империя"
 nor_protestant_empire_desc: "Лютеранство проникает в Скандинавию. Норвежский король царствует северным поборником протестантского мира."
 nor_norse_revival: "Возрождение норманнской веры"
 nor_norse_revival_desc: "Боги предков — Один, Тор, Фрейр — возрождаются. Облик Скандинавии до христианизации воссоздаётся в наши дни. Норвежский король царствует представителем норманнских богов."
 nor_berserker_fleet: "Флот берсерков"
 nor_berserker_fleet_desc: "Дух берсерков эпохи викингов обитает во флоте. Морские воины, преданные норманнским богам, спущены каперами, дабы разорять берега неверных."
 nor_ragnarok_empire: "Империя Рагнарёка"
 nor_ragnarok_empire_desc: "Подобно новому миру, приходящему после Рагнарёка, Норвегия возрождается северной империей под благословением древних богов. С имперским рангом и 500+ провинциями в прямом владении захвати эту славу."
 nor_bane_of_hansa: "Проклятие Ганзы"
 nor_bane_of_hansa_desc: "Ганзейский союз господствовал над норвежской торговлей через Брюгген (Немецкую пристань) в Бергене. Контролируй Любек или распусти Ганзейский союз, дабы норвежские купцы вернули собственные торговые пути."
 nor_baltic_access: "Доступ к Балтике"
 nor_baltic_access_desc: "Захват Штральзунда даёт Норвегии прямой доступ к Балтийскому морю. Норвегия тем самым становится крупнейшей морской державой Северной Европы, контролируя и Северное море, и Балтику."
 nor_hanseatic_expulsion: "Изгони ганзейских купцов"
 nor_hanseatic_expulsion_desc: "С распущенным Ганзейским союзом и развитым Бергеном Норвегия полностью освободила Берген от германского купеческого господства. Норвежские купцы — владыки своей собственной гавани."
 nor_control_north_sea_trade: "Господствуй в торговле Северного моря"
 nor_control_north_sea_trade_desc: "Североморские рынки обеспечены, и Ганзейский союз сокрушён — Норвегия захватывает инициативу над всем торговым путём Северного моря. Утверди господство с доходом 300+ и флотом 40+."
 nor_north_sea_empire: "Империя Северного моря"
 nor_north_sea_empire_desc: "Норвегия, контролирующая всё побережье Северного моря, включая Любек, построила Империю Северного моря. Империя Северного моря Кнуда Великого возрождена в наши дни."
 nor_develop_stavanger: "Развей Ставангер"
 nor_amber_trade: "Янтарная торговля"
 nor_amber_trade_desc: "Балтийский янтарь вывозится по всей Европе через североморскую торговую сеть Норвегии. «Золото Севера» дополнительно расширяет норвежский доход."
 nor_integrate_finland: "Включи Финляндию"
 nor_integrate_finland_desc: "Через шведскую личную унию включи Финляндию частью Норвежской империи. Прямое владение Або и Улеаборгом расширяет царство от Северной Атлантики до Баренцева моря."
 nor_engelbrekt: "Дух Энгельбректа"
 nor_engelbrekt_desc: "Дух восстания Энгельбректа распространился на Норвегию. С поддержкой крестьянства и твёрдой решимостью к независимости воплоти традицию северных свободных людей."
 nor_develop_hammerfest: "Развей Хаммерфест"
 nor_develop_hammerfest_desc: "Хаммерфест — один из самых северных городов мира. Развитие этого арктического торгового поста городом утверждает постоянный центр арктической торговли."
 nor_karoliner: "Норвежская элитная армия"
 nor_karoliner_desc: "Норвежская элитная армия, подкреплённая высокой воинской традицией, завершена. Сила военной мощи Норвежской империи — используя горный рельеф для обороны и мощного наступления — продемонстрирована."
 nor_great_power: "Великая держава Севера"
 nor_great_power_desc: "Абсолютная монархия и развитые рыбные промыслы и промышленность — Норвегия возникает великой державой Северной Европы. Утверди это положение 200+ провинциями, доходом 250+, престижем 60+."
 nor_colonization: "Норвежская колониальная империя"
 nor_stormakt: "Stormakt — великая держава Севера"
 nor_stormakt_desc: "Скандинавия объединена, Империя Северного моря построена, Северная экономика достигнута — три столпа сходятся, и Норвегия царствует Stormakt (великой державой) Северной Европы. С 600+ провинциями, доходом 600+, престижем 80+ захвати эту славу."
 nor_norwegian_empire: "Норвежская империя"
 nor_norwegian_empire_desc: "От Исландии до Винланда, от Нидароса до Британии — Норвежская империя завершена. Потомки викингов превзошли даже мечты своих предков. Империя такого масштаба, о коей никогда не мечтал даже Кнуд Великий, рождена здесь. «Северное море вновь стало озером Норвегии» — так напишут историки."
 nor_events.30.t: "Скандинавское единство — заря норвежской мощи"
 nor_events.30.d: "Дания контролируема, Швеция объединена — вся Скандинавия объединена под норвежским знаменем. Со времён эпохи викингов это достижение, коего никто не сумел, наконец осуществлено. Колокола Нидаросского собора звонят, и король Норвегии настоящим провозглашает титул «Король Скандинавии»."
 nor_events.30.a: "Да здравствует Скандинавия! Норвегия навеки!"
 nor_events.40.t: "Перекрёсток веры — религиозный выбор Норвегии"
 nor_events.40.d: "Буря Реформации нахлынула на Норвегию. Духовенство Нидаросского собора взывает к верности Риму. Но всё больше находят отклик в новом учении Лютера. И — есть те, кто мечтают вернуться к старым богам. Выбор норвежского короля определит будущее этого северного королевства."
 nor_events.40.a: "Хранить верность Риму — католицизм есть душа Норвегии"
 nor_events.40.b: "Принять учение Лютера — настала эпоха реформы"
 nor_events.40.c: "Вернуться к древним богам — искать благословения Одина"
 nor_events.99.t: "Рождение Норвежской империи"
 nor_events.99.d: "От Исландии до Винланда, от Нидароса до Британии — Норвежская империя наконец завершена. Потомки викингов превзошли своих предков. Империя такого масштаба, о коей никогда не мечтал даже Кнуд Великий, рождена здесь. «Северное море вновь стало внутренним морем Норвегии» — так запишут историки."
 nor_events.99.a: "Да здравствует Император Норвежской империи! Наследники викингов навеки!"
 STATIC_MODIFIER_NAME_nor_kingdom_mod: "Королевство Норвегия"
 STATIC_MODIFIER_DESC_nor_kingdom_mod: "Краеугольный камень восстановления Норвегии при правлении короля Магнуса Эрикссона заложен."
 STATIC_MODIFIER_NAME_nor_denmark_crushed_mod: "Дания сокрушена"
 STATIC_MODIFIER_DESC_nor_denmark_crushed_mod: "Величайший соперник Норвегии сокрушён. Руководство Скандинавией переходит к Норвегии."
 STATIC_MODIFIER_NAME_nor_sweden_union_mod: "Шведская личная уния"
 STATIC_MODIFIER_DESC_nor_sweden_union_mod: "Личная уния со Швецией закладывает основу скандинавского единства."
 STATIC_MODIFIER_NAME_nor_scandinavia_united_mod: "Скандинавия объединена"
 STATIC_MODIFIER_DESC_nor_scandinavia_united_mod: "Знамёна трёх королевств стоят бок о бок под единой короной, и приказы, изданные из Осло, достигают северных морей."
 STATIC_MODIFIER_NAME_nor_bergen_mod: "Бергенский торговый узел"
 STATIC_MODIFIER_DESC_nor_bergen_mod: "Берген развит центром североатлантической торговли Норвегии."
 STATIC_MODIFIER_NAME_nor_fleet_mod: "Флот Норвегии"
 STATIC_MODIFIER_DESC_nor_fleet_mod: "Норвежский флот с кровью викингов развёртывается по Северному морю и Северной Атлантике."
 STATIC_MODIFIER_NAME_nor_north_sea_mod: "Североморские рынки"
 STATIC_MODIFIER_DESC_nor_north_sea_mod: "Норвегия утверждена крупным игроком в североморской торговле."
 STATIC_MODIFIER_NAME_nor_iceland_mod: "Исландия покорена"
 STATIC_MODIFIER_DESC_nor_iceland_mod: "Исландия обеспечена плацдармом Норвегии в Северной Атлантике."
 STATIC_MODIFIER_NAME_nor_greenland_mod: "Гренландская экспедиция"
 STATIC_MODIFIER_DESC_nor_greenland_mod: "Норвежские моряки, плывущие к ледяным морям Гренландии, чертят новые линии на картах дальнего севера."
 STATIC_MODIFIER_NAME_nor_vinland_mod: "Винланд"
 STATIC_MODIFIER_DESC_nor_vinland_mod: "Норвегия становится первой колониальной нацией Европы в Новом Свете с поселениями в Северной Америке."
 STATIC_MODIFIER_NAME_nor_orkney_mod: "Оркнейские и Шетландские острова"
 STATIC_MODIFIER_DESC_nor_orkney_mod: "Через волны Северного моря, видимые из гаваней Оркнейских островов, силуэты норвежских кораблей проходят беспрестанно."
 STATIC_MODIFIER_NAME_nor_scotland_mod: "Шотландия завоёвана"
 STATIC_MODIFIER_DESC_nor_scotland_mod: "Захват Эдинбурга открывает путь к Британии."
 STATIC_MODIFIER_NAME_nor_england_invasion_mod: "Вторжение в Англию"
 STATIC_MODIFIER_DESC_nor_england_invasion_mod: "Память о Денло возрождена. Норвежские силы проносятся по северной Англии."
 STATIC_MODIFIER_NAME_nor_britain_mod: "Королевство Британия"
 STATIC_MODIFIER_DESC_nor_britain_mod: "Империя Северного моря Кнуда Великого возрождена. Весь Британский архипелаг под норвежским контролем."
 STATIC_MODIFIER_NAME_nor_north_sea_master_mod: "Владыка Северного моря"
 STATIC_MODIFIER_DESC_nor_north_sea_master_mod: "Норвегия становится бесспорным владыкой Северного моря. Всё Северное море под норвежским контролем."
 STATIC_MODIFIER_NAME_nor_nidaros_mod: "Нидарос развит"
 STATIC_MODIFIER_DESC_nor_nidaros_mod: "Историческая столица Норвегии развита религиозным и культурным центром Севера."
 STATIC_MODIFIER_NAME_nor_fisheries_mod: "Рыбные промыслы развиты"
 STATIC_MODIFIER_DESC_nor_fisheries_mod: "Богатые рыбные ресурсы Северной Атлантики полностью использованы, утверждая экономическую основу Норвегии."
 STATIC_MODIFIER_NAME_nor_oslo_mod: "Осло развит"
 STATIC_MODIFIER_DESC_nor_oslo_mod: "Писцы крепости Акерсхус пишут королевские указы от долины к долине по всей южной Норвегии."
 STATIC_MODIFIER_NAME_nor_absolutism_mod: "Абсолютизм"
 STATIC_MODIFIER_DESC_nor_absolutism_mod: "Абсолютная монархия утверждена в Норвегии. Основа для централизованного имперского правления заложена."
 STATIC_MODIFIER_NAME_nor_catholic_mod: "Католическая Норвегия"
 STATIC_MODIFIER_DESC_nor_catholic_mod: "Сохраняя верность Римской церкви, Норвегия признана стражем северной католической цивилизации."
 STATIC_MODIFIER_NAME_nor_crusader_mod: "Слава северного крестоносца"
 STATIC_MODIFIER_DESC_nor_crusader_mod: "Норвегия обретает известность стражем христианства через священную войну."
 STATIC_MODIFIER_NAME_nor_lutheran_mod: "Лютеранская реформа"
 STATIC_MODIFIER_DESC_nor_lutheran_mod: "Священные сосуды, вынесенные из монастырей, сложены в королевских сундуках, и казна Норвегии полнее, чем когда-либо."
 STATIC_MODIFIER_NAME_nor_protestant_church_mod: "Протестантская церковь"
 STATIC_MODIFIER_DESC_nor_protestant_church_mod: "Подготовка лютеранского богословия укореняет протестантскую веру по всей Норвегии."
 STATIC_MODIFIER_NAME_nor_norse_conversion_mod: "Возрождение норманнской веры"
 STATIC_MODIFIER_DESC_nor_norse_conversion_mod: "Вера в Одина, Тора и Фрейра возрождена. Дух воина эпохи викингов обитает в норвежских армиях."
 STATIC_MODIFIER_NAME_nor_berserker_fleet_mod: "Флот берсерков"
 STATIC_MODIFIER_DESC_nor_berserker_fleet_mod: "Дух берсерков викингов обитает во флоте. Каперы вольно разоряют берега неверных."
 STATIC_MODIFIER_NAME_nor_ragnarok_mod: "Империя Рагнарёка"
 STATIC_MODIFIER_DESC_nor_ragnarok_mod: "Под благословением древних богов Норвегия возрождается северной империей."
 STATIC_MODIFIER_NAME_nor_hansa_victory_mod: "Ганза разбита"
 STATIC_MODIFIER_DESC_nor_hansa_victory_mod: "Германское купеческое господство над Бергеном сокрушено."
 STATIC_MODIFIER_NAME_nor_baltic_mod: "Доступ к Балтике"
 STATIC_MODIFIER_DESC_nor_baltic_mod: "Норвегия обеспечивает прямой доступ к Балтике через Штральзунд."
 STATIC_MODIFIER_NAME_nor_trade_supremacy_mod: "Господство в североморской торговле"
 STATIC_MODIFIER_DESC_nor_trade_supremacy_mod: "Норвегия захватывает инициативу над всем торговым путём Северного моря."
 STATIC_MODIFIER_NAME_nor_stavanger_mod: "Порт Ставангер"
 STATIC_MODIFIER_DESC_nor_stavanger_mod: "Ставангер развит рыболовецким и торговым узлом юго-западной Норвегии."
 STATIC_MODIFIER_NAME_nor_amber_mod: "Янтарная торговля"
 STATIC_MODIFIER_DESC_nor_amber_mod: "Балтийский янтарь вывозится через торговую сеть Норвегии."
 STATIC_MODIFIER_NAME_nor_finland_mod: "Финляндия включена"
 STATIC_MODIFIER_DESC_nor_finland_mod: "Финляндия включена частью Норвежской империи."
 STATIC_MODIFIER_NAME_nor_engelbrekt_mod: "Дух Энгельбректа"
 STATIC_MODIFIER_DESC_nor_engelbrekt_mod: "Традиция северных свободных людей воплощена гордостью Норвегии."
 STATIC_MODIFIER_NAME_nor_hammerfest_mod: "Хаммерфест развит"
 STATIC_MODIFIER_DESC_nor_hammerfest_mod: "Самый северный торговый пост мира учреждён постоянным центром арктической торговли."
 STATIC_MODIFIER_NAME_nor_military_tradition_mod: "Норвежская элитная армия"
 STATIC_MODIFIER_DESC_nor_military_tradition_mod: "Высоко обученная норвежская элитная армия, подкреплённая сильной воинской традицией, завершена."
 STATIC_MODIFIER_NAME_nor_great_power_mod: "Великая держава Севера"
 STATIC_MODIFIER_DESC_nor_great_power_mod: "Норвегия возникает великой державой Северной Европы."
 STATIC_MODIFIER_NAME_nor_protestant_empire_mod: "Протестантская империя"
 STATIC_MODIFIER_DESC_nor_protestant_empire_mod: "Норвегия со всескандинавским лютеранством царствует северным поборником протестантского мира."
 STATIC_MODIFIER_NAME_nor_papal_champion_mod: "Поборник папы"
 STATIC_MODIFIER_DESC_nor_papal_champion_mod: "Несокрушимое положение сильнейшего стража северной католической цивилизации утверждено."
 STATIC_MODIFIER_NAME_nor_colonial_empire_mod: "Норвежская колониальная империя"
 STATIC_MODIFIER_DESC_nor_colonial_empire_mod: "Норвегия становится первой истинной колониальной империей Европы с 10+ колониями, включая Винланд."
 STATIC_MODIFIER_NAME_nor_stormakt_mod: "Stormakt"
 STATIC_MODIFIER_DESC_nor_stormakt_mod: "Эпоха великодержавия Норвегии настала — царствуя величайшей державой Северной Европы."
 STATIC_MODIFIER_NAME_nor_sound_toll_mod: "Зундская пошлина"
 STATIC_MODIFIER_DESC_nor_sound_toll_mod: "Сбор Зундской пошлины обогащает норвежскую казну."
 STATIC_MODIFIER_NAME_nor_stockholm_mod: "Стокгольм развит"
 STATIC_MODIFIER_DESC_nor_stockholm_mod: "Стокгольм развит восточным административным узлом Норвежской империи через шведскую унию."
 STATIC_MODIFIER_NAME_nor_hanseatic_expulsion_mod: "Ганзейские купцы изгнаны"
 STATIC_MODIFIER_DESC_nor_hanseatic_expulsion_mod: "Берген освобождён от германского купеческого господства — норвежские купцы владеют собственной гаванью."
 STATIC_MODIFIER_NAME_nor_north_sea_empire_mod: "Империя Северного моря"
 STATIC_MODIFIER_DESC_nor_north_sea_empire_mod: "Империя Северного моря Кнуда Великого возрождена в наши дни. Всё побережье Северного моря под норвежским контролем."
 STATIC_MODIFIER_NAME_nor_norwegian_empire_final_mod: "Норвежская империя"
 STATIC_MODIFIER_DESC_nor_norwegian_empire_final_mod: "Норвежская империя, простирающаяся от Исландии до Винланда, завершена. Наследники викингов превзошли своих предков."
 STATIC_MODIFIER_NAME_nor_faith_steadfast_mod: "Твёрд в вере"
 STATIC_MODIFIER_DESC_nor_faith_steadfast_mod: "Непоколебимая католическая вера провозглашает власть короля народу звоном колоколов Нидаросского собора."
 STATIC_MODIFIER_NAME_nor_reform_winds_mod: "Ветры реформы"
 STATIC_MODIFIER_DESC_nor_reform_winds_mod: "Учение Лютера распространяется по Норвегии."
 STATIC_MODIFIER_NAME_nor_old_gods_calling_mod: "Зов древних богов"
 STATIC_MODIFIER_DESC_nor_old_gods_calling_mod: "Вера в Одина и Тора тайно возрождается."
 nor_expel_danish_nobility: "Противостань Дании"
 nor_expel_danish_nobility_desc: "В 1337 году Норвегия — независимое королевство в личной унии со Швецией под королём Магнусом Эрикссоном — не датский вассал. Дания — сложный сосед, и грядущая Кальмарская уния (1397) рискует дать Дании господство над Скандинавией. Утверди положение Норвегии в Скандинавии через ясные отношения с Данией сейчас — будь то через соперничество, союз или дружбу."
 nor_secure_bergen_desc: "Брюгген — те красочные деревянные склады, выстроившиеся вдоль бергенского причала — символ ганзейского купеческого процветания. Но Берген должен быть норвежским городом. Когда власть короля распространится на эту гавань, богатство североатлантической торговли потечёт в норвежские руки."
 nor_develop_stavanger_desc: "Ставангер — древний епископский город на юго-западном побережье Норвегии. Как сердце Ругаланна, где переплетаются скалы и фьорды, эта гавань становится узлом сельдяного промысла и североморской торговли. Развей его вторым великим портовым городом Норвегии после Бергена."
 nor_develop_oslo_desc: "Осло, укрытое за стенами крепости Акерсхус, — южные врата между Данией и Швецией. На востоке лежит Швеция; на юге — Дания. Развив Осло в процветающий город, южная граница Норвегии обеспечена, и земледелие с торговлей начинают процветать."
 nor_secure_nidaros_desc: "Нидарос — этот город, построенный там, где принял мученическую смерть Святой Олаф, стоит под величайшим готическим собором Скандинавии и несёт тысячелетнюю историю духовного центра северного христианского мира. Развить Нидарос — значит обрести одобрение власти норвежского короля и небом, и землёй."
 nor_vinland_desc: "Тысячу лет назад Лейф, сын Эрика Рыжего, ступил на далёкий континент за туманом — Винланд. Ныне колониальная нация под норвежским знаменем несёт эту мечту вперёд. Норвегия вписана в историю первой европейской нацией, пустившей корни в Новом Свете."
 nor_colonization_desc: "От Винланда до Гренландии, от Исландии до арктических берегов — норвежские колониальные нации распространяются по Северной Атлантике. Дух викингского исследования живёт в наши дни, и Норвегия стоит истинной морской империей, повелевающей миром за морями."
 nor_kingdom_of_britain_desc: "Лондон, Йорк, Эдинбург — три великих города Британских островов объединены под норвежским знаменем. Мечта Кнуда Великого осуществлена вновь. Память о Денло оживает в наши дни, и Северное море становится озером Норвегии."
 nor_arctic_trade_desc: "Кольский полуостров — замёрзшая дичь на краю Арктики — сокровищница пушнины, дичи и моржовой кости. Арктические товары, приносимые саамскими охотниками, приносят огромное богатство как лучшие меха, коих ищет европейская знать. Захватив Кольский полуостров, Норвегия становится абсолютным владыкой арктической торговли."
 nor_timber_industry_desc: "Леса Норвегии — дар и корабелам, и строителям равно. Ель, сосна и берёза, срубленные из глубоких лесов — в паре с железными инструментами, коваными для работы с ними — образуют промышленный хребет норвежской экономики. Когда дым лесопилен поднимается, Норвегия становится величайшим лесоэкспортёром Северной Европы."
 STATIC_MODIFIER_NAME_nor_timber_mod: "Лесопромышленность"
 STATIC_MODIFIER_DESC_nor_timber_mod: "Древесина и инструменты, вытесанные из богатых лесов Норвегии, поддерживают промышленную основу."
 STATIC_MODIFIER_NAME_nor_arctic_trade_mod: "Арктическая торговля"
 STATIC_MODIFIER_DESC_nor_arctic_trade_mod: "Меха и дичь с Кольского полуострова текут через норвежских купцов по всей Европе."
 STATIC_MODIFIER_NAME_nor_northern_economy_mod: "Северная экономика"
 STATIC_MODIFIER_DESC_nor_northern_economy_mod: "Норвежская торговля, построенная на рыболовстве, лесе, пушнине и арктической торговле, достигает высшего уровня в Северной Европе. Издержки содержания купцов снижены, и больше торговых постов может быть учреждено."
