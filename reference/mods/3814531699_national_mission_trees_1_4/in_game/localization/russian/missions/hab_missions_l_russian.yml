l_russian:
 hab_habsburg_mission_pack: "Габсбургская гегемония и Всеобщая империя"
 hab_habsburg_mission_pack_DESCRIPTION:0 "От берегов Дуная — честолюбие дома Габсбургов простирается на всю Европу. Обеспечь престол императора Священной Римской империи, завоюй Венгрию на востоке, Францию и Испанию на западе, Италию на юге. Затем пусть Вена сияет величайшим городом мира, и осуществи Всеобщую империю."
 hab_habsburg_mission_pack_CRITERIA_DESCRIPTION:0 "Правь СРИ, завоюй Запад, Восток и Италию и осуществи Всеобщую империю."
 hab_habsburg_mission_pack_BUTTON_TOOLTIP:0 "Объедини Европу под габсбургской гегемонией."
 hab_habsburg_mission_pack_BUTTON_DETAILS:0 "«Пусть другие воюют; ты, счастливая Австрия, женись!» — стань владыкой Европы через дипломатию и завоевание равно!"
 hab_habsburg_ascendancy: "Возвышение дома Габсбургов"
 hab_habsburg_ascendancy_desc: "Кровь Рудольфа Габсбурга пульсирует вдоль Дуная — началась эпоха дипломатии и завоевания."
 hab_secure_electors: "Обеспечь курфюрстов"
 hab_secure_electors_desc: "Престол императора Священной Римской империи решается голосованием курфюрстов. Через союз или подавляющую силу — обеспечь непрерывное удержание домом Габсбургов имперской короны."
 hab_imperial_authority: "Утверди имперскую власть"
 hab_imperial_authority_desc: "Власть Священной Римской империи сходится к воле дома Габсбургов — настало время всей Империи подчиниться приказу Вены."
 hab_counter_reformation: "Контрреформация"
 hab_counter_reformation_desc: "Ересь Мартина Лютера потрясает Германию — осуществи указы Тридентского собора и защити католическую веру."
 hab_charlemagne_legacy: "Наследие Карла Великого"
 hab_charlemagne_legacy_desc: "Верни под габсбургское знамя южную Германию, кою объединил Карл Великий тысячу лет назад — основа имперской реформы заложена."
 hab_imperial_reform: "Имперская реформа"
 hab_imperial_reform_desc: "Имперская реформа — увековечь габсбургское правление через реорганизацию правящих учреждений Империи."
 hab_emperors_of_rome: "Наследник римских императоров"
 hab_emperors_of_rome_desc: "Мечта со времён Карла Великого — с владычеством над Вечным городом Римом и СРИ, дом Габсбургов провозглашает себя «наследником римских императоров»."
 hab_reclaim_burgundy: "Верни Бургундию"
 hab_reclaim_burgundy_desc: "Лотарингия и Бургундия — верни эти западные земли, кои некогда принадлежали дому Габсбургов."
 hab_austrian_netherlands: "Австрийские Нидерланды"
 hab_austrian_netherlands_desc: "Богатые торговые города Фландрии и Брабанта — богатство Нижних земель поддерживает финансы Габсбургской империи."
 hab_weaken_france: "Ослабь Францию"
 hab_weaken_france_desc: "Старый соперник Франция — величайшее препятствие европейской гегемонии. Ослабь её и урежь её силу вмешиваться в Германии и Италии."
 hab_defeat_france: "Поражение Франции"
 hab_defeat_france_desc: "«Галлия пала» — старый соперник Франция побеждена домом Габсбургов. Гегемония над Западной Европой принадлежит Габсбургам."
 hab_iberian_marriage: "Брачная дипломатия с Иберией"
 hab_iberian_marriage_desc: "«Пусть другие воюют; ты, счастливая Австрия, женись» — браки с Испанией и Португалией открывают дверь к империи, над коей никогда не заходит солнце."
 hab_crown_of_spain: "Испанская корона"
 hab_crown_of_spain_desc: "Весь Иберийский полуостров — с провозглашением дома Габсбургов «Королём Испании» империя, над коей никогда не заходит солнце, начинает обретать форму."
 hab_italian_ambition: "Честолюбия в Италии"
 hab_italian_ambition_desc: "Богатые города-государства Северной Италии — приведи Милан, Венецию и Неаполь под габсбургский контроль."
 hab_duchy_of_milan: "Захвати герцогство Милан"
 hab_duchy_of_milan_desc: "Милан — сердце Северной Италии. Захвати этот экономический и военный оплот и утверди базу для завоевания Италии."
 hab_papal_alliance: "Отношения с папой"
 hab_papal_alliance_desc: "Папа — утверди отношения с этой духовной властью католического мира и подними легитимность дома Габсбургов."
 hab_venetian_ports: "Порты Венеции"
 hab_venetian_ports_desc: "Венеция, «Царица Адриатики» — захвати её порты и флот и обеспечь вход в средиземноморскую торговлю."
 hab_king_of_naples: "Король Неаполя"
 hab_king_of_naples_desc: "Королевство Неаполь — ключ к Южной Италии. Эта корона — первый шаг к габсбургскому владычеству над всей Италией."
 hab_king_of_italy: "Король Италии"
 hab_king_of_italy_desc: "«Железная корона» сияет на челе габсбургского императора — вся Италия, от Ломбардии до Сицилии, объединена."
 hab_eastern_ambitions: "Честолюбия на востоке"
 hab_eastern_ambitions_desc: "Богемия и Венгрия — утверди притязания на эти две великие державы Восточной Европы и начни габсбургское продвижение на восток."
 hab_crown_of_bohemia: "Богемская корона"
 hab_crown_of_bohemia_desc: "Корона Вацлава в Праге — эта корона становится основой габсбургской экспансии на восток."
 hab_royal_hungary: "Королевская Венгрия"
 hab_royal_hungary_desc: "Буда освобождена от османов — корона Венгрии возвращается на чело габсбургского императора, и рождается «Королевская Венгрия»."
 hab_bohemian_union: "Включение Богемской унии"
 hab_bohemian_union_desc: "Личная уния с Богемией углубилась — ныне избери, правь ли ею прямо как включённой коронной землёй, или сохрани статус-кво."
 hab_secure_croatia: "Обеспечь Хорватию"
 hab_secure_croatia_desc: "Утверди военную границу в Хорватии, дабы остановить османские вторжения, и используй её плацдармом для завоевания Балкан."
 hab_ottoman_menace: "Османская угроза"
 hab_ottoman_menace_desc: "Османская империя — величайший враг Восточной Европы, поваливший Константинополь. Пусть дом Габсбургов станет оплотом, защищающим христианство."
 hab_liberate_balkans: "Освободи Балканы"
 hab_liberate_balkans_desc: "Освободи христиан Балканского полуострова от османского владычества — голос православных верующих призывает имя Габсбургов."
 hab_emperors_of_east: "Император Востока"
 hab_emperors_of_east_desc: "Константинополь — столица и Восточной, и Западной Римской империи — ныне падает в габсбургские руки. И восточная, и западная имперские короны объединены."
 hab_austrian_heartland: "Утверди австрийское коренное сердце"
 hab_austrian_heartland_desc: "Австрийское коренное сердце вдоль Дуная — обеспечь сердце имперской экспансии и утверди основу его экономики и войска."
 hab_tyrol_styria: "Тироль и Штирия"
 hab_tyrol_styria_desc: "Серебро из Швац и железо из Леобена — рудники Тироля и Штирии поддерживают финансы и армии Габсбургской империи."
 hab_dev_vienna: "Развитие Вены"
 hab_dev_vienna_desc: "«Город музыки», «Белый город Габсбургов» — наполни Вену великолепием, достойным имперской столицы."
 hab_graz_fortress: "Укрепи Грац"
 hab_graz_fortress_desc: "Грац — развей столицу Штирии в неприступный крепостной город, готовый против османского вторжения."
 hab_baroque_vienna: "Барочная Вена"
 hab_baroque_vienna_desc: "Барочная музыка, архитектура и живопись расцветают при венском дворе — университеты и художественные академии возвещают золотой век габсбургской культуры."
 hab_great_vienna: "Великий город Вена"
 hab_great_vienna_desc: "Дворец Шёнбрунн, собор Святого Стефана — Вена завершена величайшим и прекраснейшим городом Европы."
 hab_swiss_lands: "Верни швейцарские земли"
 hab_swiss_lands_desc: "Смой унижение, символизируемое Вильгельмом Теллем — верни землю альпийских крестьян дому Габсбургов."
 hab_south_german_cities: "Торговые города Южной Германии"
 hab_south_german_cities_desc: "Аугсбург и Франкфурт — захвати эти богатые города, родину семей Фуггеров и Ротшильдов."
 hab_unify_germany: "Объединение Германии"
 hab_unify_germany_desc: "Раздробленные германские княжества — ныне наконец объединены под габсбургским знаменем."
 hab_north_sea_trade: "Североморская торговля"
 hab_north_sea_trade_desc: "Гамбург и Амстердам — захвати контроль над североморской торговлей и построй новую торговую империю, дабы заменить Ганзейский союз."
 hab_hegemon_of_west: "Гегемон Запада"
 hab_hegemon_of_west_desc: "Франция, Испания — каждая великая держава Запада, кая некогда бросала вызов дому Габсбургов, ныне покорена."
 hab_tuscany: "Завоевание Тосканы"
 hab_tuscany_desc: "Культура Возрождения Флоренции — возьми эту землю искусств, кая расцвела под покровительством Медичи, под крыло Габсбургской империи."
 hab_surpass_poland: "Превзойди Польшу"
 hab_surpass_poland_desc: "Королевство Польша — утверди габсбургское военное превосходство в противостоянии с этой великой державой Восточной Европы."
 hab_wallachia_moldavia: "Валахия и Молдавия"
 hab_wallachia_moldavia_desc: "Покори румынские княжества к северу от Дуная и заверши габсбургское владычество над Балканами."
 hab_austrian_army: "Реорганизуй австрийскую армию"
 hab_austrian_army_desc: "Габсбургское войско — взлелей сильнейшую армию Европы, выкованную из союза многонациональных полков."
 hab_spanish_tercios: "Испанское терсио"
 hab_spanish_tercios_desc: "Терсио — введи эту революционную испанскую военную тактику по всей габсбургской армии и усовершенствуй лучшую пехоту Европы."
 hab_multicultural: "Многонациональная империя"
 hab_multicultural_desc: "Немцы, чехи, венгры, хорваты, итальянцы — эксперимент Габсбургской империи по объединению многих народов под единым знаменем завершён."
 hab_alsace_lorraine: "Эльзас-Лотарингия"
 hab_alsace_lorraine_desc: "Эльзас и Лотарингия вдоль Рейна — обеспечь эту землю западной границей Габсбургской империи."
 hab_renaissance_court: "Ренессансный двор"
 hab_renaissance_court_desc: "Свет Возрождения сияет при венском дворе — итальянское искусство и византийская учёность сливаются, приводя габсбургскую культуру в полный расцвет."
 hab_carinthia: "Каринтия"
 hab_carinthia_desc: "Каринтия — включи это альпийское герцогство в габсбургское владение и обеспечь коридор в Италию и на Балканы."
 hab_colonialism: "Колониальная империя"
 hab_colonialism_desc: "Через Испанию — к Америкам — построй колониальную империю, под чьим габсбургским знаменем никогда не заходит солнце."
 hab_universal_empire: "Всеобщая империя"
 hab_universal_empire_desc: "«Всеобщая империя — от Лиссабона на западе до Константинополя на востоке, от Гамбурга на севере до Палермо на юге» — мечта со времён Карла Великого осуществлена."
 hab_events.1.t: "Дом Габсбургов, к священному римскому престолу"
 hab_events.1.d: "Курфюрсты провозгласили свою поддержку дома Габсбургов — имперский престол принадлежит Габсбургам."
 hab_events.1.a: "Да здравствует Император Габсбург! Да здравствует Империя!"
 hab_events.10.t: "Провозглашение наследником римских императоров"
 hab_events.10.d: "Имперская реформа завершена, и Вечный город Рим объединён с СРИ — дом Габсбургов провозглашает себя «наследником римских императоров»."
 hab_events.10.a: "Да здравствует имперская реформа! Да здравствует наследник Рима!"
 hab_events.15.t: "Провозглашение объединения Германии"
 hab_events.15.d: "От севера до юга — Германия, некогда раздробленная на бесчисленные княжества, объединена под габсбургским знаменем."
 hab_events.15.a: "Да здравствует объединение Германии!"
 hab_events.20.t: "Упадок Франции — путь к престолу"
 hab_events.20.d: "Франция наконец преклонила колени перед домом Габсбургов. Настало время утвердить формальное притязание на французский престол — объяви шестидесятилетнее притязание и обрати свой взор на престолонаследие Королевства Франция."
 hab_events.20.a: "Объявить притязание на французский престол (60 лет)"
 hab_events.25.t: "Испанская корона"
 hab_events.25.d: "«Король Испании и эрцгерцог Австрии» — Иберийский полуостров ныне лежит во владении Габсбургской империи."
 hab_events.25.a: "Да здравствует Испания! Да здравствует Габсбургская империя!"
 hab_events.30.t: "Король Италии"
 hab_events.30.d: "«Железная корона» сияет на челе габсбургского императора — вся Италия, от Ломбардии до Сицилии, объединена."
 hab_events.40.t: "Основание Королевской Венгрии"
 hab_events.40.d: "Буда освобождена — «Королевская Венгрия» становится восточным столпом Габсбургской империи."
 hab_events.40.a: "Венгрия освобождена! Да здравствует Буда!"
 hab_events.50.t: "Император Востока"
 hab_events.50.d: "Константинополь пал в габсбургские руки — столицы и Восточной, и Западной Римской империи ныне держимы как единое целое."
 hab_events.50.a: "Да здравствует Константинополь! Да здравствует Император Востока!"
 hab_events.55.t: "Великий город Вена"
 hab_events.55.d: "Дворец Шёнбрунн, собор Святого Стефана — Вена завершена величайшим и прекраснейшим городом Европы."
 hab_events.55.a: "Да здравствует Великий город Вена!"
 hab_events.65.t: "Богемия — включение коронной землёй"
 hab_events.65.d: "Личная уния с Богемией углубилась, и настало время полного включения. Правь ею прямо как включённой коронной землёй, или сохрани нынешнюю личную унию — реши."
 hab_events.65.a: "Включить Богемию включённой коронной землёй"
 hab_events.99.t: "Провозглашение Всеобщей империи"
 hab_events.99.d: "«Всеобщая империя — Габсбургский император правит от Лиссабона на западе до Константинополя на востоке» — это провозглашение звучит по всей Европе."
 hab_events.99.a: "Да здравствует Всеобщая империя! Габсбургская империя навеки!"
 hab_events.65.b: "Сохранить нынешнюю личную унию"
 STATIC_MODIFIER_NAME_hab_army_mod: "Элитная габсбургская армия"
 STATIC_MODIFIER_DESC_hab_army_mod: "Габсбургская армия, объединяющая разнообразные национальные полки, завершена сильнейшей сухопутной силой Европы."
 STATIC_MODIFIER_NAME_hab_balkans_mod: "Освобождение Балкан"
 STATIC_MODIFIER_DESC_hab_balkans_mod: "Христиане Балкан освобождены от османского владычества."
 STATIC_MODIFIER_NAME_hab_baroque_mod: "Барочная Вена"
 STATIC_MODIFIER_DESC_hab_baroque_mod: "Барочное искусство расцветает при венском дворе, делая его центром европейской культуры."
 STATIC_MODIFIER_NAME_hab_boh_loyalty_mod: "Сопротивление богемскому включению"
 STATIC_MODIFIER_DESC_hab_boh_loyalty_mod: "В залах Праги богемские дворяне ропщут против утраты своих старых вольностей."
 STATIC_MODIFIER_NAME_hab_bohemia_mod: "Богемская корона"
 STATIC_MODIFIER_DESC_hab_bohemia_mod: "Золотой город Прага присоединяется к Империи второй столицей дома Габсбургов."
 STATIC_MODIFIER_NAME_hab_carinthia_mod: "Покорение Каринтии"
 STATIC_MODIFIER_DESC_hab_carinthia_mod: "Каринтия стала жизненно важным альпийским коридором, связующим север и юг для Габсбургской империи."
 STATIC_MODIFIER_NAME_hab_catholic_mod: "Триумф Контрреформации"
 STATIC_MODIFIER_DESC_hab_catholic_mod: "Католическая вера защищена по всей Империи."
 STATIC_MODIFIER_NAME_hab_charlemagne_mod: "Наследие Карла Великого"
 STATIC_MODIFIER_DESC_hab_charlemagne_mod: "Наследие Карла Великого даёт Габсбургской империи новую легитимность."
 STATIC_MODIFIER_NAME_hab_croatia_mod: "Хорватская военная граница"
 STATIC_MODIFIER_DESC_hab_croatia_mod: "Военная граница учреждена в Хорватии, останавливая османское вторжение."
 STATIC_MODIFIER_NAME_hab_danubian_mod: "Расширение Дунайской империи"
 STATIC_MODIFIER_DESC_hab_danubian_mod: "Нижний Дунай покорён, завершая габсбургское владычество над всеми Балканами."
 STATIC_MODIFIER_NAME_hab_dynasty_mod: "Пробуждение дома Габсбургов"
 STATIC_MODIFIER_DESC_hab_dynasty_mod: "Честолюбие дома Габсбургов разожжено — эпоха дипломатии и завоевания начинается."
 STATIC_MODIFIER_NAME_hab_france_mod: "Война с Францией"
 STATIC_MODIFIER_DESC_hab_france_mod: "Старый соперник Франция ослаблен, открывая путь к габсбургской гегемонии над Европой."
 STATIC_MODIFIER_NAME_hab_graz_mod: "Укрепление Граца"
 STATIC_MODIFIER_DESC_hab_graz_mod: "Грац развит в неприступный крепостной город, обороняющий против османского вторжения."
 STATIC_MODIFIER_NAME_hab_great_vienna_loc_mod: "Великий город Вена завершён"
 STATIC_MODIFIER_DESC_hab_great_vienna_loc_mod: "Вена завершена величайшим городом Европы, сияя вечной столицей Империи."
 STATIC_MODIFIER_NAME_hab_heartland_mod: "Стабильность австрийского коренного сердца"
 STATIC_MODIFIER_DESC_hab_heartland_mod: "Австрийское коренное сердце стабильно, утверждая основу имперской экспансии."
 STATIC_MODIFIER_NAME_hab_hegemon_mod: "Гегемон Запада"
 STATIC_MODIFIER_DESC_hab_hegemon_mod: "Ни одна держава Западной Европы не остаётся бросить вызов габсбургской гегемонии."
 STATIC_MODIFIER_NAME_hab_imperial_mod: "Утверждение имперской власти"
 STATIC_MODIFIER_DESC_hab_imperial_mod: "Вся Священная Римская империя ныне подчиняется приказу дома Габсбургов."
 STATIC_MODIFIER_NAME_hab_italian_mod: "Плоды Итальянских войн"
 STATIC_MODIFIER_DESC_hab_italian_mod: "Итальянские походы выковали габсбургскую армию в элитную силу."
 STATIC_MODIFIER_NAME_hab_multiethnic_mod: "Утверждение многонациональной империи"
 STATIC_MODIFIER_DESC_hab_multiethnic_mod: "Чудо сосуществования многих народов под габсбургским знаменем осуществлено."
 STATIC_MODIFIER_NAME_hab_north_sea_mod: "Гегемония в североморской торговле"
 STATIC_MODIFIER_DESC_hab_north_sea_mod: "Североморская торговля попала под контроль Габсбургской империи."
 STATIC_MODIFIER_NAME_hab_ottoman_mod: "Война с Османской империей"
 STATIC_MODIFIER_DESC_hab_ottoman_mod: "Победа над Османской империей утвердила признание Габсбургской империи оплотом христианства."
 STATIC_MODIFIER_NAME_hab_papal_mod: "Примирение с папой"
 STATIC_MODIFIER_DESC_hab_papal_mod: "Отношения с папой утверждены, и дом Габсбургов признан стражем католического мира."
 STATIC_MODIFIER_NAME_hab_reform_mod: "Завершение имперской реформы"
 STATIC_MODIFIER_DESC_hab_reform_mod: "Реорганизация правящих учреждений увековечивает габсбургское правление."
 STATIC_MODIFIER_NAME_hab_renaissance_mod: "Ренессанс Вены"
 STATIC_MODIFIER_DESC_hab_renaissance_mod: "Свет Возрождения сияет при венском дворе, делая Империю центром европейской культуры."
 STATIC_MODIFIER_NAME_hab_south_german_mod: "Торговые города Южной Германии"
 STATIC_MODIFIER_DESC_hab_south_german_mod: "Богатые вольные города Южной Германии стали ядром имперской экономики."
 STATIC_MODIFIER_NAME_hab_styria_iron_mod: "Железные рудники Леобена"
 STATIC_MODIFIER_DESC_hab_styria_iron_mod: "Железо Штирии поддерживает военную мощь Габсбургской империи."
 STATIC_MODIFIER_NAME_hab_swiss_mod: "Покорение Швейцарии"
 STATIC_MODIFIER_DESC_hab_swiss_mod: "Альпийское крестьянское государство завоёвано, утверждая габсбургскую гегемонию."
 STATIC_MODIFIER_NAME_hab_tercios_mod: "Испанское терсио"
 STATIC_MODIFIER_DESC_hab_tercios_mod: "Тактика терсио введена по всей габсбургской армии, породив лучшую пехоту Европы."
 STATIC_MODIFIER_NAME_hab_tuscany_mod: "Процветание Тосканы"
 STATIC_MODIFIER_DESC_hab_tuscany_mod: "Культура Возрождения Флоренции расцветает под защитой Габсбургской империи."
 STATIC_MODIFIER_NAME_hab_tyrol_silver_mod: "Серебряные рудники Швац"
 STATIC_MODIFIER_DESC_hab_tyrol_silver_mod: "Серебряные рудники Тироля поддерживают финансы Габсбургской империи."
 STATIC_MODIFIER_NAME_hab_universal_empire_mod: "Провозглашение Всеобщей империи"
 STATIC_MODIFIER_DESC_hab_universal_empire_mod: "«Всеобщая империя» — вся Европа объединена под габсбургским знаменем."
 STATIC_MODIFIER_NAME_hab_venetia_mod: "Захват Венеции"
 STATIC_MODIFIER_DESC_hab_venetia_mod: "«Царица Адриатики» ныне поддерживает морскую мощь Габсбургской империи."
 STATIC_MODIFIER_NAME_hab_vienna_mod: "Вена — сердце Империи"
 STATIC_MODIFIER_DESC_hab_vienna_mod: "Вена сияет культурным и административным центром Империи."
 hab_events.40.b: "Сохранить нынешние отношения"
 STATIC_MODIFIER_NAME_hab_hun_loyalty_mod: "Сопротивление венгерскому включению"
 STATIC_MODIFIER_DESC_hab_hun_loyalty_mod: "Во дворцах Буды венгерские магнаты ропщут против утраты своих древних вольностей."
 hab_integrated_crown_desc: "Включённая коронная земля — особый тип вассала, кой разделяет своего правителя с габсбургским императором, имеет ограниченную дипломатию и позволяет сюзерену строить и развивать ресурсы напрямую. Не может быть аннексирован в течение 100 лет."
 STATIC_MODIFIER_NAME_hab_spain_crown_mod: "Обретение испанской короны"
 STATIC_MODIFIER_DESC_hab_spain_crown_mod: "Иберийский полуостров стал частью владения Габсбургской империи, открывая дверь к империи, над коей никогда не заходит солнце."
 STATIC_MODIFIER_NAME_hab_alsace_mod: "Захват Эльзас-Лотарингии"
 STATIC_MODIFIER_DESC_hab_alsace_mod: "Двуглавый орёл Габсбургов реет с пограничных крепостей вдоль Рейна, и западная оборона стоит непоколебимой."
 hab_events.30.b: "Продолжить править Италией как есть"
 hab_events.15.b: "Да здравствует Германская империя!"
 hab_events.30.a: "Реорганизовать Королевство Италия включённой коронной землёй"
 STATIC_MODIFIER_NAME_hab_hre_unity_mod: "Объединение Священной Римской империи"
 STATIC_MODIFIER_DESC_hab_hre_unity_mod: "Священная Римская империя объединена, и дороги и армии Империи соединены воедино."
 STATIC_MODIFIER_NAME_hab_ger_empire_mod: "Рождение Германской империи"
 STATIC_MODIFIER_DESC_hab_ger_empire_mod: "Германская империя провозглашена, и дисциплинированная, мощная армия возвещает её рождение."
 STATIC_MODIFIER_NAME_hab_rome_legacy_mod: "Наследие римских императоров"
 STATIC_MODIFIER_DESC_hab_rome_legacy_mod: "Прославленный наследником римских императоров, дом Габсбургов видит свой двор переполненным клириками и учёными со всего христианского мира."
 hab_stadtrechtsbriefe: "Издай Stadtrechtsbriefe"
 hab_stadtrechtsbriefe_desc: "Stadtrechtsbriefe — «грамоты городского права». Под сильной королевской властью габсбургского императора даруй привилегии городам по всему царству — венское городское право для Вены и права ландштадта для имперских городов в иных местах."
 hab_stadtrechtsbriefe_unlock_tt: "Открывает городские привилегии Венское городское право и Ландштадт."
 hab_innsbruck_court: "Двор Инсбрука"
 hab_innsbruck_court_desc: "Инсбрук — ныне, когда этот центральный город Тироля вырос в истинный город, утверди здесь двор узлом альпийской культуры Габсбургов."
 hab_swarovski_crystal: "Хрусталь Сваровски"
 hab_swarovski_crystal_desc: "С 1737 года стеклодувы Инсбрука усовершенствовали искусство тонкой огранки хрусталя — задолго до рождения самого Сваровски тирольский хрусталь уже украшал дворы Европы."
 STATIC_MODIFIER_NAME_hab_innsbruck_loc_mod: "Развитие двора Инсбрука"
 STATIC_MODIFIER_DESC_hab_innsbruck_loc_mod: "Инсбрук начал сиять узлом альпийской культуры Габсбургов."
 STATIC_MODIFIER_NAME_hab_swarovski_mod: "Хрустальная промышленность Тироля"
 STATIC_MODIFIER_DESC_hab_swarovski_mod: "Стеклодувы Инсбрука усовершенствовали искусство тонкой огранки хрусталя."
 STATIC_MODIFIER_NAME_wiener_stadtrecht_town_rights: "Венское городское право"
 STATIC_MODIFIER_DESC_wiener_stadtrecht_town_rights: "Особое городское право, даруемое только Вене — преимущества в торговле и на рынках поддерживают процветание Вены."
 STATIC_MODIFIER_NAME_landstadt_town_rights: "Ландштадт"
 STATIC_MODIFIER_DESC_landstadt_town_rights: "Городское право, даруемое по имперским городам — улучшает дорожную сеть, уравновешивая власть короны с дворянским влиянием."
