l_russian:
 flo_magnifico_mission_pack: "Наследие Иль Маньифико"
 flo_magnifico_mission_pack_DESCRIPTION:0 "Республика Флоренция под необычайным домом Медичи ведёт всю Европу в торговле, искусстве и учёности. Построишь ли ты на огромном богатстве, порождённом шерстяной торговлей и банком Медичи, и расцветёшь колыбелью Возрождения? Или объединишь Тоскану, маршируешь на Рим и станешь владыкой Италии — Иль Маньифико? Во Флоренции встречаются мудрость купца и честолюбие государя."
 flo_magnifico_mission_pack_CRITERIA_DESCRIPTION:0 "Заверши миссии как Флоренция и достигни равно процветающей торговли и культуры, и завоевания Италии."
 flo_magnifico_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы пройти путём Иль Маньифико."
 flo_magnifico_mission_pack_BUTTON_DETAILS:0 "Дай Возрождению расцвести, овладей Тосканой и стань владыкой Италии!"
 flo_rise_of_the_commune: "Возвышение коммуны"
 flo_rise_of_the_commune_desc: "В 1337 году Флоренция посреди борьбы между гвельфами (папской партией) и гибеллинами (императорской партией) выросла в «Comune» — самоуправляемый город-государство купцов и ремесленников. Великие банки семей Барди и Перуцци правят европейскими финансами, и шерстяная торговля вдоль Арно обогащает город. Но внутренний фракционный раздор не прекращается. Преодолей эту эпоху смятения и приведи Флоренцию к истинному величию."
 flo_the_prince: "Государь"
 flo_the_prince_desc: "Во время Итальянских войн, когда чужеземные державы опустошали Италию, флорентийский дипломат Никколо Макиавелли написал «Государя». Революционное произведение, взиравшее на политическую реальность холодным взглядом, выразило глубокое желание нового правителя, способного объединить Италию."
 flo_arte_della_lana: "Шерстяная промышленность"
 flo_arte_della_lana_desc: "Arte della Lana — гильдия торговцев шерстью — есть сердце флорентийской экономики. Через импорт английской шерсти и вывоз готового сукна по всей Европе она порождает богатство, кое делает город великим."
 flo_medici_bank: "Основание банка Медичи"
 flo_medici_bank_desc: "Банк, основанный семьёй Медичи, действует официальным банком римского папства, с отделениями, разбросанными по всей Европе. Эта финансовая мощь есть основа, на коей Флоренция осуществляет влияние равно в культуре и политике."
 flo_arno_renewal: "Обновление Арно"
 flo_arno_renewal_desc: "По мере развития города работы вдоль Арно продвигаются, и Флоренция стала одним из процветающих городов Италии. Высокий уровень развития приносит городу постоянный прирост в ежемесячном росте."
 flo_arno_corridor: "Коридор над Арно"
 flo_arno_corridor_desc: "Понте Веккьо и каналы, пересекающие Арно, — торговые и административные артерии Флоренции. Возведение мостов и водного транспорта ускорит развитие города."
 flo_arno_trade_network: "Торговая сеть Арно"
 flo_arno_trade_network_desc: "Торговая сеть, простирающаяся вдоль Арно по всей Тоскане, — источник торговой мощи Флоренции. Через овладение этой сетью мы можем привести всю торговлю Северной Италии под наш контроль."
 flo_dominate_italian_trade: "Овладей итальянской торговлей"
 flo_dominate_italian_trade_desc: "Торговая сеть Флоренции ныне охватывает всю Италию. С севера до юга итальянская экономика не может функционировать без флорентийских купцов."
 flo_duomo_di_firenze: "Санта-Мария-дель-Фьоре"
 flo_duomo_di_firenze_desc: "Завершение купола Брунеллески — деяние, преодолевшее границы архитектуры своего времени. Его великий купол наполняет граждан Флоренции глубокой гордостью и стал вечным символом города."
 flo_birthplace_of_renaissance: "Колыбель Возрождения"
 flo_birthplace_of_renaissance_desc: "Флоренция ведёт как колыбель Возрождения духовное обновление всей Европы. Дух возвращения к классической древности и гуманизму пустил здесь глубокие корни."
 flo_florentine_school_of_painting: "Флорентийская школа живописи"
 flo_florentine_school_of_painting_desc: "Флорентийский стиль живописи, основанный Боттичелли и другими, опережает всю Европу в перспективе и реализме."
 flo_the_mona_lisa: "Мона Лиза"
 flo_the_mona_lisa_desc: "Шедевр Леонардо да Винчи изменил самое понятие живописи. Художественная почва Флоренции, продолжающая порождать таких гениев, несравненна."
 flo_uffizi: "Уффици"
 flo_uffizi_desc: "Через объединение художественной коллекции, накопленной семьёй Медичи, Уффици могли бы стать крупнейшим музеем мира. Их культурный престиж навеки возвысит имя Флоренции."
 flo_the_rise_of_medici: "Возвышение Медичи"
 flo_the_rise_of_medici_desc: "После краха семей Барди и Перуцци возвысилась новая банковская династия: Медичи. Банк Медичи, основанный Джованни ди Биччи де Медичи в 1397 году, быстро вырос благодаря отношениям с римским папством и расширил отделения по всей Европе. Эта семья понесёт будущее Флоренции."
 flo_pazzi_conspiracy: "Заговор Пацци"
 flo_pazzi_conspiracy_desc: "Покушение на Лоренцо де Медичи, поддержанное папой Сикстом IV и семьёй Пацци, окончилось провалом и, как ни парадоксально, лишь упрочило власть Медичи."
 flo_machiavelli: "Труды Макиавелли"
 flo_machiavelli_desc: "В «Государе» Никколо Макиавелли хладнокровно проанализировал реальность власти. Его мышление глубоко повлияло на флорентийскую политическую философию."
 flo_republic_of_virtue: "Республика добродетели"
 flo_republic_of_virtue_desc: "Флоренция стремится быть не просто торговым государством, но основанным на добродетели и республиканских идеалах. Легитимность и стабильность есть краеугольные камни республики."
 flo_camerata_fiorentina_nmt: "Camerata Fiorentina"
 flo_camerata_fiorentina_nmt_desc: "Camerata, где собираются флорентийские учёные и музыканты, становится рассадником музыкального новаторства, кое приведёт к рождению оперы. Город, где искусство и наука расцветают как единое целое."
 flo_subjugate_pisa: "Покори Пизу"
 flo_subjugate_pisa_desc: "Пиза, портовый город, долго желаемый Флоренцией как врата к морю, должна быть обеспечена. Занятие этого порта на Арно значительно расширит торговую досягаемость Флоренции."
 flo_siena_submitted: "Покорение Сиены"
 flo_siena_submitted_desc: "Наш давний соперник Сиена наконец укрощён. Отомстив за позор Монтаперти, Флоренция принимает её шёлковых торговцев и банкиров и обеспечивает полный контроль над Южной Тосканой."
 flo_lucca_absorbed: "Поглощение Лукки"
 flo_lucca_absorbed_desc: "Лукка, долго сохранявшая независимость, — одно из последних препятствий объединению Тосканы Флоренцией. Приведи её шёлковую промышленность под флорентийскую власть."
 flo_unify_tuscany: "Объедини Тоскану"
 flo_unify_tuscany_desc: "Ныне, когда почти вся Тоскана под флорентийским контролем, возвышение до ранга королевства — естественное следствие. Флоренция более не просто город-государство."
 flo_push_into_lombardy: "Продвижение в Ломбардию"
 flo_push_into_lombardy_desc: "За пределами Тосканы настало время расширить наше владение в сердце Северной Италии. Конфликт с Миланом, Генуей и Венецией неизбежен."
 flo_march_on_rome: "Марш на Рим"
 flo_march_on_rome_desc: "Кто правит Римом, тот правит Италией. Приведя древнюю столицу Римской империи в своё владение, Флоренция притязает на легитимность, коей не равна никто."
 flo_the_new_rome: "Новый Рим"
 flo_the_new_rome_desc: "Флоренция, завоевавшая Рим, ныне правит большей частью итальянского полуострова и стала империей. Настало время воздвигнуть новый Рим."
 flo_il_magnifico_of_italy: "Иль Маньифико Италии"
 flo_il_magnifico_of_italy_desc: "Как Лоренцо де Медичи назвали «Иль Маньифико», так ныне вся Флоренция стала «Великолепной» Италией."
 flo_medici_oriental_press: "Медицейская пресса восточных рукописей"
 flo_medici_oriental_press_desc: "Типография, возведённая семьёй Медичи, собирает и печатает греческие рукописи, хлынувшие после падения Византийской империи. Древнее знание вновь вдыхает новую жизнь в Европу."
 flo_clock_tower: "Часовая башня Пьяцца делла Синьория"
 flo_clock_tower_desc: "Точная часовая башня, возведённая во Дворце Синьории, стала символом флорентийского технического мастерства. Управление временем улучшает эффективность торговли и правления."
 flo_first_modern_engineer: "Первый современный инженер"
 flo_first_modern_engineer_desc: "Филиппо Брунеллески развил революционные строительные методы, превзошедшие античный Рим при возведении купола. Его техническое наследие применяется к фортификации по всей Италии."
 flo_humiliate_venice: "Унизь Венецию"
 flo_humiliate_venice_desc: "Настало время превзойти нашего давнего морского соперника, Республику Венеция. Поставив Царицу Адриатики на её место, мы докажем, что Флоренция — ведущая нация Италии."
 flo_papal_relations: "Отношения с папством"
 flo_papal_relations_desc: "Ныне, когда Рим обеспечен, отношения с папством должны быть поставлены на твёрдую основу. Будь то через союз или верховенство, Флоренция станет величайшим покровителем римской церкви."
 flo_vasari_corridor: "Уффици и коридор Вазари"
 flo_vasari_corridor_desc: "Коридор Вазари, связующий дворец Уффици и Понте Веккьо, был спроектирован Джорджо Вазари по заказу Козимо I де Медичи. Этот тайный возвышенный проход символизирует власть и художественное превосходство Медичи."
 flo_academy_of_florence: "Академия Флоренции"
 flo_academy_of_florence_desc: "Академия, возведённая во Флоренции, стала местом всеобъемлющего исследования искусства, науки и философии. Знание Возрождения распространяется отсюда в мир."
 flo_italian_cultural_hegemon: "Культурный гегемон Италии"
 flo_italian_cultural_hegemon_desc: "Флоренция, где торговля, искусство и учёность расцвели как единое целое, стала культурным центром всей Италии. Её влияние простирается даже за Альпы."
 flo_magnifico: "Иль Маньифико"
 flo_magnifico_desc: "От торгового города Флоренция взошла на вершину культуры, завоевала всю Италию и утвердила себя наследницей Римской империи. «Иль Маньифико» — имя Великолепного навеки вписано в историю."
 STATIC_MODIFIER_NAME_flo_arte_della_lana_mod: "Процветающая шерстяная промышленность"
 STATIC_MODIFIER_DESC_flo_arte_della_lana_mod: "Arte della Lana (шерстяная гильдия) была крупнейшей гильдией Флоренции и основой городского процветания. Тонко обработанное сукно из сырой шерсти, купленной в Англии и Испании, ценилось по всей Европе и стало источником огромного состояния Медичи."
 STATIC_MODIFIER_NAME_flo_medici_bank_mod: "Верховенство банка Медичи"
 STATIC_MODIFIER_DESC_flo_medici_bank_mod: "Основанный Джованни ди Биччи де Медичи в 1397 году, банк Медичи на своей вершине имел отделения в шестнадцати городах, включая Рим, Венецию, Лондон и Брюгге. Как официальный банк папского двора, он собирал огромную прибыль, обходя церковный запрет на ростовщичество под видом «прибыли от обмена»."
 STATIC_MODIFIER_NAME_flo_arno_trade_network_mod: "Торговая сеть Арно"
 STATIC_MODIFIER_DESC_flo_arno_trade_network_mod: "Арно был великой водной артерией, связующей Флоренцию с портом Пиза. Через овладение торговыми путями вдоль его течения Флоренция, будучи внутренним городом, участвовала напрямую в средиземноморской торговле, образуя своеобразную экономическую сферу, соединяющую сукно, банковское дело и торговлю."
 STATIC_MODIFIER_NAME_flo_dominate_italian_trade_mod: "Верховенство в итальянской торговле"
 STATIC_MODIFIER_DESC_flo_dominate_italian_trade_mod: "Позднесредневековая Италия была крупнейшей торговой зоной Европы, с купцами Флоренции, Венеции и Генуи на её вершине. Флорентийские купцы плели финансовую сеть по всей Северной Европе, обладая достаточным влиянием, дабы ссужать обеим сторонам Столетней войны между Англией и Францией."
 STATIC_MODIFIER_NAME_flo_duomo_di_firenze_mod: "Завершение собора"
 STATIC_MODIFIER_DESC_flo_duomo_di_firenze_mod: "Купол собора Флоренции (Санта-Мария-дель-Фьоре) был завершён Брунеллески в 1436 году. Революционное техническое достижение — гигантский купол, возведённый без деревянных лесов или строительных подмостей, чего никто не совершал более тысячи лет со времён Пантеона в Риме — он символизирует дух Возрождения."
 STATIC_MODIFIER_NAME_flo_birthplace_of_renaissance_mod: "Колыбель Возрождения"
 STATIC_MODIFIER_DESC_flo_birthplace_of_renaissance_mod: "«Возрождение» — рождение заново — родилось во Флоренции. В Платоновской академии, основанной Козимо де Медичи, Марсилио Фичино и другие возродили мысль античной Греции и Рима, и, соединённая с литературной традицией Данте, Петрарки и Боккаччо, она преобразила западную цивилизацию до самых её основ."
 STATIC_MODIFIER_NAME_flo_florentine_school_of_painting_mod: "Флорентийская школа живописи"
 STATIC_MODIFIER_DESC_flo_florentine_school_of_painting_mod: "Традиция реалистической живописи, основанная Джотто ди Бондоне в конце XIII века, перешла к перспективе Мазаччо, изяществу Боттичелли и многогранности Леонардо. Флорентийская живопись воплотила переход от средневековых священных образов к современному искусству и определила направление европейской живописи."
 STATIC_MODIFIER_NAME_flo_the_mona_lisa_mod: "Влияние Моны Лизы"
 STATIC_MODIFIER_DESC_flo_the_mona_lisa_mod: "Написанная около 1503-1519 годов Леонардо да Винчи, «Мона Лиза» с её загадочной улыбкой и новаторской перспективой и техникой сфумато стала самым знаменитым произведением в истории западного искусства. Леонардо был универсальным гением, охватывающим не только живопись, но анатомию, инженерное дело, архитектуру и музыку."
 STATIC_MODIFIER_NAME_flo_uffizi_mod: "Слава Уффици"
 STATIC_MODIFIER_DESC_flo_uffizi_mod: "Дворец Уффици, спроектированный Вазари по заказу Козимо I де Медичи в 1560 году, изначально был административным офисом (Uffizi означает «офисы»), но позже разместил коллекции Медичи и стал одним из первых музеев мира — храмом искусства, где собираются работы Боттичелли, Леонардо и Микеланджело."
 STATIC_MODIFIER_NAME_flo_machiavelli_mod: "Учения Государя"
 STATIC_MODIFIER_DESC_flo_machiavelli_mod: "Никколо Макиавелли служил Флорентийской республике дипломатом и администратором с 1498 по 1512 год. «Государь», написанный после изгнания Медичи, был произведением реалистической политической мысли, утверждавшим, что «цель оправдывает средства», и стал основой современной политической теории."
 STATIC_MODIFIER_NAME_flo_republic_of_virtue_mod: "Республика добродетели"
 STATIC_MODIFIER_DESC_flo_republic_of_virtue_mod: "Флоренция обладала своеобразной формой правления, сохраняя республиканский фасад, пока Медичи в действительности правили. Учреждения, такие как Синьория (городское правительство), Приоры (магистраты) и Большой совет, искусно сочетали идеалы республиканизма с реальностью олигархии."
 STATIC_MODIFIER_NAME_flo_camerata_fiorentina_mod: "Camerata Fiorentina"
 STATIC_MODIFIER_DESC_flo_camerata_fiorentina_mod: "«Camerata», круг музыкантов, поэтов и учёных, собиравшихся в 1570-х и 1580-х годах в резиденции графа Джованни де Барди во Флоренции, стремился возродить античную греческую драму. Их эксперименты породили совершенно новую художественную форму, оперу, и навеки изменили историю западной музыки."
 STATIC_MODIFIER_NAME_flo_subjugate_pisa_mod: "Порт Пизы"
 STATIC_MODIFIER_DESC_flo_subjugate_pisa_mod: "Пиза некогда правила морской республикой рядом с Венецией и Генуей над Средиземноморьем, но пришла в упадок после сокрушительного поражения от Генуи в битве при Мелории 1284 года. С завоеванием Флоренцией Пизы в 1406 году некогда сухопутная Флоренция наконец обрела доступ к морю."
 STATIC_MODIFIER_NAME_flo_siena_submitted_mod: "Покорение Сиены"
 STATIC_MODIFIER_DESC_flo_siena_submitted_mod: "Сиена была унаследованным соперником Флоренции, долго оспаривавшим верховенство над Тосканой. Сиена сохраняла независимость с испанской поддержкой, но наконец пала в 1555 году. Привести под флорентийское правление гордых сиенцев, известных скачками Палио, есть символ объединения Тосканы."
 STATIC_MODIFIER_NAME_flo_lucca_absorbed_mod: "Шёлк и сукно Лукки"
 STATIC_MODIFIER_DESC_flo_lucca_absorbed_mod: "Лукка была городом с тончайшей шёлковой промышленностью Тосканы. В XIII и XIV веках лукканский шёлк ценился по всей Европе, украшая одежды государей и знати. Богатство банкиров Лукки, соперников Медичи, также заслуживает внимания."
 STATIC_MODIFIER_NAME_flo_unify_tuscany_mod: "Владыка Тосканы"
 STATIC_MODIFIER_DESC_flo_unify_tuscany_mod: "Ареццо, древний город этрусков; Сиена, город поэзии; Лукка, город ремёсел; Пиза, порт — через их объединение Флоренция становится центром Тосканы как исторического, культурного и географического целого. Это деяние воссоединяет римскую «Тусцию» под знаменем Медичи."
 STATIC_MODIFIER_NAME_flo_push_into_lombardy_mod: "Продвижение в Ломбардию"
 STATIC_MODIFIER_DESC_flo_push_into_lombardy_mod: "Флоренция и Милан были двумя великими державами итальянской политики XV века, всегда в напряжении. Против экспансионистской политики герцогов Висконти и Сфорца Миланских Флоренция сопротивлялась дипломатией и кондотьерами, наёмными полководцами. Это равновесие сил породило утончённость ренессансной дипломатии."
 STATIC_MODIFIER_NAME_flo_the_new_rome_mod: "Новый Рим"
 STATIC_MODIFIER_DESC_flo_the_new_rome_mod: "Флоренцию часто называли «Новым Римом». Козимо и Лоренцо де Медичи сознательно подражали культуре покровительства Рима, стремясь воссоздать добродетели античного Рима в духе Возрождения. Владычество над самим Римом есть символическое завершение этой цели."
 STATIC_MODIFIER_NAME_flo_il_magnifico_of_italy_mod: "Иль Маньифико Италии"
 STATIC_MODIFIER_DESC_flo_il_magnifico_of_italy_mod: "Лоренцо де Медичи (Лоренцо Великолепный, 1449-1492) стоял на вершине своей эпохи художником, поэтом, дипломатом и государственным деятелем. Политика равновесия, кою он назвал «равновесием Италии», сохранила мир накануне Итальянских войн, и его двор излучал тончайший блеск культуры Возрождения."
 STATIC_MODIFIER_NAME_flo_medici_oriental_press_mod: "Наследие восточной учёности"
 STATIC_MODIFIER_DESC_flo_medici_oriental_press_mod: "На Ферраро-Флорентийском соборе 1438-1439 годов Козимо де Медичи купил в большом количестве греческие рукописи у учёных, прибывших из Византии. Это собрание привело к латинскому переводу Платона и возрождению неоплатонизма, изменив историю западной мысли. Соединённое с печатной революцией Гутенберга, знание распространялось быстро."
 STATIC_MODIFIER_NAME_flo_clock_tower_mod: "Точность часовой башни"
 STATIC_MODIFIER_DESC_flo_clock_tower_mod: "Механические часы начали появляться на площадях североитальянских городов в XIV веке. Колокольня (Кампаниле) собора Флоренции, спроектированная Джотто, — типичный пример. Общее измерение времени объединило торговлю и правление города и стало инфраструктурой, поддержавшей переход от Средневековья к современности."
 STATIC_MODIFIER_NAME_flo_the_rise_of_medici_mod: "Возвышение Медичи"
 STATIC_MODIFIER_DESC_flo_the_rise_of_medici_mod: "Козимо де Медичи (прозванный Pater Patriae, 1389-1464), опираясь на банковскую прибыль, изгнал своих политических врагов и стал фактическим правителем Флоренции. Как казначей папского двора, покровитель искусств и посредник в дипломатии, он заложил основу славы дома Медичи."
 STATIC_MODIFIER_NAME_flo_first_modern_engineer_mod: "Первопроходец современной инженерии"
 STATIC_MODIFIER_DESC_flo_first_modern_engineer_mod: "Филиппо Брунеллески привнёс революцию в архитектуру, скульптуру и инженерное дело. Он теоретизировал линейную перспективу и осуществил великий купол собора Флоренции через новаторскую двойную оболочку и каркасные техники. Он архетип ренессансного «универсального человека» (uomo universale)."
 STATIC_MODIFIER_NAME_flo_humiliate_venice_mod: "Унижение Венеции"
 STATIC_MODIFIER_DESC_flo_humiliate_venice_mod: "Флоренция и Венеция, две великие торговые державы средневековой Италии, соперничали в процветании и долго конфликтовали и дипломатически, и военно. Конфликт из-за экспансии в Милан в XV веке был особенно ожесточённым, и Флоренция всегда воспринимала сухопутную экспансию Венеции (политику Терраферма) угрозой."
 STATIC_MODIFIER_NAME_flo_papal_relations_mod: "Узы с папством"
 STATIC_MODIFIER_DESC_flo_papal_relations_mod: "Отношения между Медичи и папским двором были запутаны. После заговора Пацци 1478 года (убийственного замысла, в коем был замешан архиепископ Франческо Сальвиати), убившего брата Лоренцо Джулиано, Лоренцо некоторое время конфликтовал с Сикстом IV, но затем примирился и восстановил твёрдые отношения."
 STATIC_MODIFIER_NAME_flo_academy_of_florence_mod: "Академия Флоренции"
 STATIC_MODIFIER_DESC_flo_academy_of_florence_mod: "Платоновская академия, покровительствуемая Козимо де Медичи, предприняла под водительством Марсилио Фичино возрождение античной философии. Латинский перевод полного собрания сочинений Платона, перевод Corpus Hermeticum, систематизация неоплатонизма — эти духовные предприятия обновили самые основы западной философии, богословия и науки."
 STATIC_MODIFIER_NAME_flo_italian_cultural_hegemon_mod: "Покровитель итальянского искусства"
 STATIC_MODIFIER_DESC_flo_italian_cultural_hegemon_mod: "Флоренция Возрождения была культурным центром всей Европы. Государи и дворяне Франции, Нидерландов, Германии и Англии приглашали флорентийских художников, зодчих и учёных, соперничая в подражании «итальянской» придворной культуре."
 STATIC_MODIFIER_NAME_flo_magnifico_mod: "Слава Иль Маньифико"
 STATIC_MODIFIER_DESC_flo_magnifico_mod: "«Иль Маньифико» — выражение, отражающее не только блеск одного человека, но всего города Флоренции. Слава Флоренции, стоявшей на вершине Европы равно в искусстве, философии, дипломатии и финансах, воплощает саму суть эпохи, кою позднейшие поколения назовут «Возрождением»."
 flo_events.1.t: "Возвышение флорентийской коммуны"
 flo_events.1.d: "В 1337 году Флоренция захвачена долгой борьбой между фракциями гвельфов и гибеллинов. Великие банки семей Барди и Перуцци, обременённые огромными кредитами королю Англии, начинают шататься. Тень Чёрной смерти подкрадывается с востока, и некоторые замышляют пригласить тирана Готье де Бриенна. И всё же дух флорентийской коммуны — самоуправляемого купеческого города — живёт. На основе шерстяной торговли и купеческих гильдий переживи эту эпоху бурь."
 flo_events.1.a: "Будущее Флоренции в наших руках"
 flo_events.3.t: "Последствия заговора Пацци"
 flo_events.3.d: "Покушение на Лоренцо де Медичи, поддержанное папой Сикстом IV и семьёй Пацци, окончилось провалом и, как ни парадоксально, лишь упрочило власть Медичи. Заговорщики казнены, и граждане Флоренции ещё более укрепили свою поддержку Медичи. Пережив это испытание, политическая структура республики готова переродиться во что-то более утончённое."
 flo_events.3.a: "Испытание сделало нас сильнее"
 flo_events.4.t: "Марш на Рим"
 flo_events.4.d: "Древняя столица Римской империи ныне под знаменем Флоренции. Константинов дар уже доказан подделкой — если так, законная власть править Италией принадлежит Флоренции, обретённой силой и мудростью. Эта малая республика, рождённая торговым городом, ныне идёт путём к империи, чьё имя будет высечено в истории."
 flo_events.4.a: "Рим сияет славой Флоренции"
 STATIC_MODIFIER_NAME_flo_arno_renewal_mod: "La Grande Opera"
 STATIC_MODIFIER_DESC_flo_arno_renewal_mod: "Наводнения Арно терзали Флоренцию через годы (наводнение 1966 года обсуждается и поныне). Но через улучшение берегов, постройку мостов и укрепление дамб река стала скорее преимуществом города. Мастерские, красильни и шерстомойни вдоль реки действовали сердцем флорентийской экономики."
 STATIC_MODIFIER_NAME_flo_arno_corridor_mod: "Процветание Понте Веккьо"
 STATIC_MODIFIER_DESC_flo_arno_corridor_mod: "Понте Веккьо (Старый мост) — старейший мост через Арно и с XIV века символ флорентийской торговли, окаймлённый лавками золотых и ювелирных дел мастеров. Обновлённый как часть коридора Вазари, кой Козимо I повелел возвести, дабы связать Уффици с дворцом Питти, он стал символическим проходом, объединяющим правителя и город."
 STATIC_MODIFIER_NAME_flo_vasari_corridor_mod: "Коридор Вазари"
 STATIC_MODIFIER_DESC_flo_vasari_corridor_mod: "Завершённый Джорджо Вазари всего за пять месяцев в 1565 году, коридор Вазари — возвышенный проход, связующий дворец Уффици через Понте Веккьо с дворцом Питти. Спроектированный, дабы Козимо I мог передвигаться, не смешиваясь с толпой, он есть техническая кристаллизация безопасности правителя и его мастерства над городом."
 flo_events.5.t: "Уффици и коридор Вазари"
 flo_events.5.d: "Козимо I де Медичи повелел зодчему Джорджо Вазари связать дворец Уффици (седалище управления) с дворцом Питти тайным возвышенным проходом. Этот «коридор Вазари», идущий над Понте Веккьо, — скрытый переход, позволяющий правителю передвигаться, не будучи видимым публикой — символ власти Медичи и их мастерства над городом. Эта гениальная архитектура, пересекающая Арно, ясно показывает, что политика и искусство во Флоренции — одно и то же."
 flo_events.5.a: "Завершение коридора подняло правление Флоренции на новый уровень"
 STATIC_MODIFIER_NAME_flo_the_prince_mod: "Новый государь"
 STATIC_MODIFIER_DESC_flo_the_prince_mod: "В «Государе» (1513) Макиавелли проповедовал, что нужно обладать «и силой льва, и хитростью лисицы». Реализм, что безопаснее быть страшимым, чем любимым, и что при необходимости следует ставить сохранение власти выше морали, стал отправной точкой современной политологии."
 flo_events.6.t: "Государь"
 flo_events.6.d: "Итальянские войны преподали Флоренции суровый урок. Дипломат Никколо Макиавелли написал «Государя», произведение, раскрывшее самую суть власти. Дабы объединить раздробленную Италию, нужен новый правитель, ставящий реальную власть выше морали. «Лишь государь, обладающий и доблестью, и фортуной, может спасти Италию в хаосе» — и, быть может, этот ответ лежит в самой Флоренции."
 flo_events.6.a: "Пусть новый государь восстанет, дабы спасти Италию!"
