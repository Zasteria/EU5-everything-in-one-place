l_russian:
 eth_ethiopia_mission_pack: "Новая Соломонова империя — крест, сияющий над Африканским Рогом"
 eth_ethiopia_mission_pack_DESCRIPTION:0 "Под династией, кая, как говорят, происходит от Царицы Савской и царя Соломона, соперничай с мамлюками защитником коптов, восторжествуй в смертельной борьбе с Адалом и возроди славу Аксума, дабы возвести новую империю."
 eth_ethiopia_mission_pack_CRITERIA_DESCRIPTION:0 "Возведи империю, заяви права на гегемонию над Африканским Рогом, защити коптов и возроди славу Аксума."
 eth_ethiopia_mission_pack_BUTTON_TOOLTIP:0 "От горной крепости до империи, сияющей над Красным морем."
 eth_ethiopia_mission_pack_BUTTON_DETAILS:0 "«Царь царей, Лев Иудин» — как наследник Царицы Савской, возведи новую Соломонову империю!"
 eth_negus_authority: "Утверди власть Негус Негеста"
 eth_negus_authority_desc: "«Царь царей» — титул Негус Негеста. Пусть эта власть достигнет каждого уголка империи."
 eth_amba_geshen: "Тюрьма Амба-Гешен"
 eth_amba_geshen_desc: "Дабы предотвратить споры о престолонаследии, королевские принцы заключаются в природной крепости Амба-Гешен — утверди этот обычай учреждением."
 eth_mobile_court: "Кочующий двор Эфиопии"
 eth_mobile_court_desc: "Без постоянной столицы, император и его войско пересекают империю в подвижном лагере (Кетема) — утверди этот самобытный стиль правления государственным учреждением."
 eth_coptic_church: "Защити эфиопско-православную церковь"
 eth_coptic_church_desc: "Эфиопско-православная церковь, под властью Александрии — сделай её веру опорой государства и стань защитником коптов."
 eth_gondar_founding: "Развей Гондэр"
 eth_gondar_founding_desc: "Гондэр, называемый «африканским Камелотом» — развей его в великий каменный город."
 eth_royal_chronicle: "Составь королевские хроники"
 eth_royal_chronicle_desc: "Унаследуй дух «Кебра Негест», хроники, записывающей деяния прошлых императоров, и взлелей традицию учёности и записи."
 eth_feudal_levies: "Феодальная система ополчения"
 eth_feudal_levies_desc: "Утверди самобытную феодальную военную систему Эфиопии, в коей местные владыки ведут войска по призыву императора."
 eth_negus_dynasty: "Соломонова династия обеспечена"
 eth_negus_dynasty_desc: "С церковью, хрониками, военной системой и столицей все на своих местах, сделай правление Соломоновой династии несокрушимым."
 eth_oromo_migration: "Оромские миграции"
 eth_oromo_migration_desc: "В XVI веке народы оромо начинают великую миграцию — ответь на это историческое движение народов."
 eth_agaw_people: "Управляй агавами"
 eth_agaw_people_desc: "Агавы, древние обитатели эфиопского высокогорья — управляй ими подданными империи, почитая их культуру."
 eth_beta_israel: "Сосуществование с бета-Исраэль"
 eth_beta_israel_desc: "Бета-Исраэль, эфиопские евреи, также называемые «фалаша» — утверди путь сосуществования с ними."
 eth_horn_hegemony: "Гегемония над Африканским Рогом"
 eth_horn_hegemony_desc: "Как империя, объединяющая сидама, оромо, агавов и бета-Исраэль, заяви права на гегемонию над Африканским Рогом."
 eth_nubian_alliance: "Союз с Нубией"
 eth_nubian_alliance_desc: "Макурия и Алодия, коптские государства на севере — выкуй союзы с этими братьями по вере."
 eth_conquer_makuria: "Включи Макурию"
 eth_conquer_makuria_desc: "Макурия, коптское царство, некогда процветавшее на Ниле — защити или включи это ныне угасающее государство."
 eth_conquer_alodia: "Включи Алодию"
 eth_conquer_alodia_desc: "Алодия, коптское царство Южной Нубии — приведи эту землю в сферу правления Эфиопии."
 eth_sudan_dominion: "Утверди владычество над Суданом"
 eth_sudan_dominion_desc: "От долины Нила до нубийской пустыни — утверди эфиопское правление над этой обширной землёй."
 eth_mamluk_rivalry: "Соперничество с мамлюками"
 eth_mamluk_rivalry_desc: "Мамлюкский султанат, правящий Египтом — как защитник коптов, разреши соперничество с ними."
 eth_liberate_jerusalem: "Освободи Иерусалим"
 eth_liberate_jerusalem_desc: "Святой город Иерусалим — освободи эту землю, дабы защитить права коптов на поклонение."
 eth_coptic_patriarchate: "Командуй Коптским патриархатом"
 eth_coptic_patriarchate_desc: "Коптский патриархат Александрии — приведи его власть под эфиопский контроль."
 eth_protector_of_copts: "Защитник коптов"
 eth_protector_of_copts_desc: "Для коптов, разбросанных по миру, эфиопский император — их последний защитник — исполни эту роль."
 eth_adal_wars: "Адалские войны"
 eth_adal_wars_desc: "Султанат Адал, исламское государство на красноморском побережье — прими вызов войны с этим давним соперником."
 eth_conquer_zeila: "Завоюй Зейлу"
 eth_conquer_zeila_desc: "Зейла, важный портовый город Адала — завоюй его и обрети опорный пункт в красноморской торговле."
 eth_conquer_harar: "Завоюй Харар"
 eth_conquer_harar_desc: "Харар, центр исламской учёности — завоюй этот священный город."
 eth_conquer_adal: "Завоюй Адал"
 eth_conquer_adal_desc: "Положи конец угрозе «Ахмада Левши» (Грань) и завоюй давнего соперника, султанат Адал."
 eth_somali_coast: "Обеспечь сомалийское побережье"
 eth_somali_coast_desc: "Сомалийское побережье — сметы остатки Адала и обеспечь эту землю."
 eth_red_sea_access: "Доступ к Красному морю"
 eth_red_sea_access_desc: "Обеспечь порт Массауа и открой сухопутной Эфиопии давно желанный путь к морю."
 eth_portuguese_contact: "Контакт с португальцами"
 eth_portuguese_contact_desc: "Португальцы, ищущие легендарную землю «пресвитера Иоанна» — контакт с ними принесёт Эфиопии новую эпоху."
 eth_massawa_port: "Развей порт Массауа"
 eth_massawa_port_desc: "Массауа, портовый город на Красном море — развей его вратами для внешней торговли."
 eth_firearms_adoption: "Прими огнестрельное оружие"
 eth_firearms_adoption_desc: "С португальской поддержкой введи мушкеты и пушки в эфиопскую армию."
 eth_european_trade: "Торговля с Европой"
 eth_european_trade_desc: "Оживи торговлю с европейскими нациями через Массауа."
 eth_modernize_army: "Модернизируй армию"
 eth_modernize_army_desc: "Опираясь на огнестрельное оружие и европейскую торговлю, преобрази эфиопскую армию в современную силу."
 eth_aksum_heritage: "Наследие Аксума"
 eth_aksum_heritage_desc: "Аксумитская империя, некогда процветавшая через красноморскую торговлю — обеспечь её священный город и унаследуй память о её славе."
 eth_reclaim_aksum: "Возроди Тыграй"
 eth_reclaim_aksum_desc: "Тыграй, колыбель Аксумитской империи — возроди этот регион коренной землёй империи."
 eth_red_sea_empire: "Отстрой заново Красноморскую империю"
 eth_red_sea_empire_desc: "Красноморская торговая империя, некогда возведённая Аксумом — возроди её в наши дни."
 eth_horn_unification: "Объедини Африканский Рог"
 eth_horn_unification_desc: "Через включение кушитских народов и возрождение Красноморской империи — объедини весь Африканский Рог под знаменем Эфиопии."
 eth_new_solomonic_empire: "Новая Соломонова империя"
 eth_new_solomonic_empire_desc: "Защитник коптов, модернизированная армия и объединённый Африканский Рог — родословная Царицы Савской и царя Соломона здесь завершена новой империей."
 eth_events.1.t: "Иерусалим освобождён"
 eth_events.1.d: "Святой город Иерусалим вернулся в коптские руки. Для братьев, разбросанных по миру, этот день будет помниться навеки."
 eth_events.1.a: "Слава Богу!"
 eth_events.99.t: "Провозглашение Новой Соломоновой империи"
 eth_events.99.d: "Малое горное царство возродилось великой империей — защитником коптов, владыкой Красного моря, правителем Африканского Рога. Родословная Царицы Савской и царя Соломона здесь завершена."
 eth_events.99.a: "Слава Эфиопии! Слава Новой Соломоновой империи!"
 STATIC_MODIFIER_NAME_eth_negus_mod: "Власть Негуса утверждена"
 STATIC_MODIFIER_DESC_eth_negus_mod: "Власть императора достигает империи, повышая легитимность правления."
 STATIC_MODIFIER_NAME_eth_amba_geshen_mod: "Тюрьма Амба-Гешен"
 STATIC_MODIFIER_DESC_eth_amba_geshen_mod: "На утёсах Амба-Гешена юные принцы крови тихо стареют, никогда не смея домогаться престола."
 STATIC_MODIFIER_NAME_eth_coptic_church_mod: "Православная церковь защищена"
 STATIC_MODIFIER_DESC_eth_coptic_church_mod: "Колокола церкви Тевахедо звонят из долины в долину по всему высокогорью, и даже народы иных вер останавливаются послушать."
 STATIC_MODIFIER_NAME_eth_gondar_mod: "Гондэр развит"
 STATIC_MODIFIER_DESC_eth_gondar_mod: "Каменный город стал символом процветания царства."
 STATIC_MODIFIER_NAME_eth_chronicle_mod: "Королевские хроники составлены"
 STATIC_MODIFIER_DESC_eth_chronicle_mod: "В тёмных скрипториях монастырей перья писцов, копирующих хроники на языке геэз, никогда не отдыхают."
 STATIC_MODIFIER_NAME_eth_levies_mod: "Феодальная система ополчения"
 STATIC_MODIFIER_DESC_eth_levies_mod: "При звуке барабанов владыки высокогорья собираются, каждый ведя своих людей под собственным знаменем."
 STATIC_MODIFIER_NAME_eth_dynasty_mod: "Династия обеспечена"
 STATIC_MODIFIER_DESC_eth_dynasty_mod: "Гордость происхождения от царя Соломона и Царицы Савской делает имя династии почитаемым среди всех народов."
 STATIC_MODIFIER_NAME_eth_horn_hegemony_mod: "Гегемония над Рогом"
 STATIC_MODIFIER_DESC_eth_horn_hegemony_mod: "От абиссинского высокогорья до низменностей Рога народы бесчисленных языков платят дань именем единого царя."
 STATIC_MODIFIER_NAME_eth_nubian_mod: "Союз с Нубией"
 STATIC_MODIFIER_DESC_eth_nubian_mod: "Послы от наших братьев в северной Нубии тепло принимаются как разделяющие ту же веру креста."
 STATIC_MODIFIER_NAME_eth_makuria_mod: "Макурия включена"
 STATIC_MODIFIER_DESC_eth_makuria_mod: "Включение аннексированной Макурии продвигается."
 STATIC_MODIFIER_NAME_eth_alodia_mod: "Алодия включена"
 STATIC_MODIFIER_DESC_eth_alodia_mod: "Включение аннексированной Алодии продвигается."
 STATIC_MODIFIER_NAME_eth_sudan_mod: "Владычество над Суданом"
 STATIC_MODIFIER_DESC_eth_sudan_mod: "Караваны, гружённые зерном и золотом, беспрестанно поднимаются с равнин Судана вдоль Нила."
 STATIC_MODIFIER_NAME_eth_mamluk_rivalry_mod: "Соперничество с мамлюками"
 STATIC_MODIFIER_DESC_eth_mamluk_rivalry_mod: "Скрестив клинки с мамлюкской конницей, солдаты высокогорья закалились в опытных воинов."
 STATIC_MODIFIER_NAME_eth_patriarchate_mod: "Коптский патриархат"
 STATIC_MODIFIER_DESC_eth_patriarchate_mod: "Священники высокогорья долго ждали дня, когда собственный патриарх дарует благословение."
 STATIC_MODIFIER_NAME_eth_protector_mod: "Защитник коптов"
 STATIC_MODIFIER_DESC_eth_protector_mod: "Слава защитника помогает улучшить дипломатические отношения."
 STATIC_MODIFIER_NAME_eth_adal_wars_mod: "Адалские войны"
 STATIC_MODIFIER_DESC_eth_adal_wars_mod: "Солдаты, пережившие бесконечные войны с Адалом, носят свои шрамы как знаки чести."
 STATIC_MODIFIER_NAME_eth_zeila_mod: "Зейла завоёвана"
 STATIC_MODIFIER_DESC_eth_zeila_mod: "Из складов порта Зейла пряности и жемчуг Красного моря несутся вверх ко двору высокогорья."
 STATIC_MODIFIER_NAME_eth_harar_mod: "Харар завоёван"
 STATIC_MODIFIER_DESC_eth_harar_mod: "Когда знамя царя было поднято над стенами Харара, солдаты высокогорья единогласно говорили о победе, обретшей священный город."
 STATIC_MODIFIER_NAME_eth_conquer_adal_mod: "Адал завоёван"
 STATIC_MODIFIER_DESC_eth_conquer_adal_mod: "Даже в деревнях Адала, нашего давнего соперника, чиновники царя начали открывать свои налоговые книги."
 STATIC_MODIFIER_NAME_eth_somali_coast_mod: "Сомалийское побережье обеспечено"
 STATIC_MODIFIER_DESC_eth_somali_coast_mod: "В портах сомалийского побережья корабли, гружённые ладаном и слоновой костью, бросают якорь беспрестанно."
 STATIC_MODIFIER_NAME_eth_red_sea_access_mod: "Доступ к Красному морю"
 STATIC_MODIFIER_DESC_eth_red_sea_access_mod: "С давно закрытым путём к Красному морю ныне открытым, взоры купцов высокогорья обращаются к горизонту."
 STATIC_MODIFIER_NAME_eth_portuguese_mod: "Контакт с португальцами"
 STATIC_MODIFIER_DESC_eth_portuguese_mod: "Португальские послы из Гоа принимаются с почестями при дворе высокогорья, неся редкие дары."
 STATIC_MODIFIER_NAME_eth_massawa_mod: "Массауа развита"
 STATIC_MODIFIER_DESC_eth_massawa_mod: "Порт Массауа процветает вратами торговли."
 STATIC_MODIFIER_NAME_eth_firearms_mod: "Огнестрельное оружие принято"
 STATIC_MODIFIER_DESC_eth_firearms_mod: "Гром мушкетов и пушек в долинах провозглашает, что эпоха копья и щита закончилась."
 STATIC_MODIFIER_NAME_eth_european_trade_mod: "Торговля с Европой"
 STATIC_MODIFIER_DESC_eth_european_trade_mod: "Европейские купцы, высаживающиеся в порту Массауа, покупают золото и мускус высокогорья в обмен на серебряные монеты."
 STATIC_MODIFIER_NAME_eth_modernize_mod: "Армия модернизирована"
 STATIC_MODIFIER_DESC_eth_modernize_mod: "Солдаты в мундирах нового образца маршируют, поя старые военные песни."
 STATIC_MODIFIER_NAME_eth_aksum_heritage_mod: "Наследие Аксума"
 STATIC_MODIFIER_DESC_eth_aksum_heritage_mod: "Те, кто стоят перед стелами Аксума, помнят, что имена тысячелетних царей всё ещё текут в их собственной крови."
 STATIC_MODIFIER_NAME_eth_reclaim_aksum_mod: "Тыграй возрождён"
 STATIC_MODIFIER_DESC_eth_reclaim_aksum_mod: "Древние поля и рынки Аксума вновь обрели дыхание, и чиновники царя вновь считают урожай."
 STATIC_MODIFIER_NAME_eth_red_sea_empire_mod: "Красноморская империя отстроена"
 STATIC_MODIFIER_DESC_eth_red_sea_empire_mod: "С отстроенной торговой империей, связующей порты Красного моря, флоты царя разворачивают паруса вдоль всего побережья."
 STATIC_MODIFIER_NAME_eth_horn_unification_mod: "Африканский Рог объединён"
 STATIC_MODIFIER_DESC_eth_horn_unification_mod: "Каждый владыка Африканского Рога ныне преклоняет колени по церемониалу единого двора."
 STATIC_MODIFIER_NAME_eth_new_solomonic_empire_mod: "Новая Соломонова империя"
 STATIC_MODIFIER_DESC_eth_new_solomonic_empire_mod: "Завершение новой империи подняло государственную мощь на её вершину."
 STATIC_MODIFIER_NAME_eth_jerusalem_mod: "Иерусалим освобождён"
 STATIC_MODIFIER_DESC_eth_jerusalem_mod: "Перед Гробом Господним в Иерусалиме эфиопские священники плачут по завершении своего долгого паломничества."
