l_russian:
 teo_theodoro_mission_pack: "Княжество Феодоро: Готия возрождённая и владыка Чёрного моря"
 teo_theodoro_mission_pack_DESCRIPTION:0 "В 1337 году княжество Феодоро цепляется за горную крепость Мангуп на Крымском полуострове. Некогда часть Византийской империи, это греческое княжество окружено татарами, генуэзцами и восходящими османами. Используй купеческий гений и военную доблесть семьи Гаврас, дабы захватить черноморскую торговлю, возродить имя Готии, отвоевать Константинополь и править Готской империей над восточным Средиземноморьем."
 teo_theodoro_mission_pack_CRITERIA_DESCRIPTION:0 "Овладей Чёрным морем, изгони генуэзцев, отвоюй Константинополь и правь Готской империей над восточным Средиземноморьем, Чёрным морем и степями."
 teo_theodoro_mission_pack_BUTTON_TOOLTIP:0 "Правь Готской империей над восточным Средиземноморьем."
 teo_theodoro_mission_pack_BUTTON_DETAILS:0 "Возведи от горной крепости Мангуп Готскую империю через черноморскую торговлю, византийское наследие и степное завоевание!"
 teo_rise_of_theodoro: "Возвышение Феодоро"
 teo_rise_of_theodoro_desc: "От горной крепости Мангуп начинается возвышение княжества Феодоро. Окружённый татарами, генуэзцами и османами, гений семьи Гаврас обратит кризис в возможность."
 teo_black_sea_fleet: "Черноморский флот"
 teo_black_sea_fleet_desc: "Чёрное море оспаривается Генуей, Венецией, татарами и османами. Построй флот, дабы утвердить феодоританскую мощь на этих жизненно важных водах."
 teo_build_theodoro_harbor: "Гавань Феодоро"
 teo_build_theodoro_harbor_desc: "Развей гавань Феодоро у подножия Мангупа, дабы утвердить его черноморской морской державой."
 teo_genoese_question: "Генуэзский вопрос"
 teo_genoese_question_desc: "Генуэзская колония Газария, правя из Каффы, господствует над черноморской торговлей. Купи Газарию вассалом — или сохрани казну."
 teo_expel_genoese: "Изгони генуэзцев"
 teo_expel_genoese_desc: "Изгони генуэзцев из Крыма и займи их колонии, дабы утвердить феодоританское верховенство."
 teo_dominate_crimea: "Овладей Крымом"
 teo_dominate_crimea_desc: "Изгони всех соперников из Крыма и правь его единственным владыкой."
 teo_tana_trade: "Торговля Таны"
 teo_tana_trade_desc: "Займи торговый узел Тана в устье Дона, дабы овладеть восточными торговыми путями."
 teo_black_sea_domination: "Владычество над Чёрным морем"
 teo_black_sea_domination_desc: "Утверди полное верховенство над Чёрным морем, не оставив ни одного соперника, кой бросил бы вызов феодоританскому владычеству."
 teo_greek_heritage: "Греческое наследие"
 teo_greek_heritage_desc: "Укрепи православную веру и византийское культурное наследие, поддерживающее легитимность Феодоро."
 teo_trebizond_relations: "Отношения с Трапезундом"
 teo_trebizond_relations_desc: "Определи отношения с Комниновой империей Трапезунда — предложи вассалитет или сохрани союз."
 teo_restore_pontus: "Восстанови Понт"
 teo_restore_pontus_desc: "Завоюй понтийское побережье и восстанови древнее Понтийское царство."
 teo_constantinople: "Отвоюй Константинополь"
 teo_constantinople_desc: "Верни Второй Рим у османов и восстанови православный крест над Святой Софией."
 teo_gothia_ascendant: "Готия восходит"
 teo_gothia_ascendant_desc: "Провозгласи возрождение Готии и будь признан законным наследником Византии."
 teo_aegean_supremacy: "Верховенство в Эгейском море"
 teo_aegean_supremacy_desc: "Займи Эгейские острова и побережье, дабы расширить феодоританскую морскую мощь в Средиземноморье."
 teo_balkans: "Завоюй Балканы"
 teo_balkans_desc: "Завоюй Балканы — коренное сердце бывшей Византийской империи — дабы упрочить Готскую империю."
 teo_azov_gateway: "Врата к Азовскому морю"
 teo_azov_gateway_desc: "Овладей Азовским морем, дабы открыть внутренние торговые пути через Дон и Волгу."
 teo_pryazovia: "Приазовье"
 teo_pryazovia_desc: "Обеспечь регион Приазовья к северу от Азовского моря и открой путь в степи."
 teo_tatar_wars: "Войны против татар"
 teo_tatar_wars_desc: "Сражайся против крымских татар, дабы выковать феодоританскую конницу в элитных степных воинов."
 teo_into_steppes: "В степи"
 teo_into_steppes_desc: "Завоюй обширную понтийскую степь и преобрази Феодоро в континентальную империю."
 teo_caucasus_gateway: "Врата к Кавказу"
 teo_caucasus_gateway_desc: "Продвинься в горные земли Кавказа — Грузию, Армению и Азербайджан."
 teo_caspian_reach: "Достигни Каспийского моря"
 teo_caspian_reach_desc: "Достигни Каспийского моря, дабы обрести доступ к персидским и среднеазиатским торговым путям."
 teo_russian_question: "Русский вопрос"
 teo_russian_question_desc: "Определи отношения с Москвой и Новгородом — выкуй союз или стремись к завоеванию."
 teo_russian_claim: "Притязание на Русь"
 teo_russian_claim_desc: "Расширь феодоританское влияние на русские княжества."
 teo_ruthenia_conquest: "Завоевание Рутении"
 teo_ruthenia_conquest_desc: "Завоюй Рутению, включая Киев, и притязай на мантию и Византии, и Руси."
 teo_dev_theodoro: "Развей Феодоро"
 teo_dev_theodoro_desc: "Развей крепостной город Феодоро в столицу, достойную Готской империи."
 teo_trade_empire: "Торговая империя"
 teo_trade_empire_desc: "Возведи торговую империю на перекрёстке Чёрного моря, Средиземноморья и Шёлкового пути."
 teo_silk_road: "Торговля на Шёлковом пути"
 teo_silk_road_desc: "Овладей Шёлковым путём и монополизируй поток шёлка из Средней Азии на западные рынки."
 teo_gothic_culture: "Готская культура"
 teo_gothic_culture_desc: "Развей самобытную готскую культуру, сливающую греческое, готское и татарское наследие."
 teo_orthodox_fortress: "Православный оплот"
 teo_orthodox_fortress_desc: "Построй сеть православных монастырей и военных крепостей, дабы защитить веру."
 teo_great_theodoro: "Великий Феодоро"
 teo_great_theodoro_desc: "Преобрази Мангуп в вечную столицу Готской империи, маяк цивилизации."
 teo_crimean_wine: "Крымское вино"
 teo_crimean_wine_desc: "Возроди древнюю греческую традицию виноделия в Крыму и поставляй вино на средиземноморские рынки."
 teo_fortress_mangup: "Крепость Мангуп"
 teo_fortress_mangup_desc: "Укрепи Мангуп — природную плоскогорную крепость, кою даже османы с трудом могли захватить."
 teo_anatolian_coast: "Анатолийское побережье"
 teo_anatolian_coast_desc: "Завоюй южное черноморское побережье Анатолии, дабы сделать Чёрное море феодоританским внутренним морем."
 teo_orthodox_patriarch: "Православный патриархат"
 teo_orthodox_patriarch_desc: "Учреди патриархат в Константинополе, кой сделает Феодоро защитником всех православных христиан."
 teo_merchant_republic: "Купеческая республика"
 teo_merchant_republic_desc: "Возведи через торговлю и завоевание крупнейшую торговую империю Средиземноморья."
 teo_dev_trebizond_city: "Развей Трапезунд"
 teo_dev_trebizond_city_desc: "Развей Трапезунд важным торговым узлом на южном черноморском побережье."
 teo_gavras_triumphant: "Триумф Гаврасов"
 teo_gavras_triumphant_desc: "Купеческий гений и военная отвага семьи Гаврас создали великую империю из горной крепости."
 teo_gothia_empire: "Готская империя"
 teo_gothia_empire_desc: "Правь императором Готии — владыкой Чёрного моря, Средиземноморья и степей."
 teo_events.1.t: "Феодоро восходит — греческая традиция или готская гордость?"
 teo_events.1.d: "В 1337 году от плоскогорной крепости Мангуп начинается возвышение княжества Феодоро. Окружённые татарами, генуэзцами и османами, купеческий гений и военная доблесть семьи Гаврас обратят этот кризис в возможность. Захвати черноморскую торговлю, возроди Готию и верни Константинополь."
 teo_events.1.a: "Сохранить понтийско-греческую традицию — мы наследники Византии"
 teo_events.10.t: "Воссоединение с Трапезундом — узы Комнинов"
 teo_events.10.d: "Трапезундская империя Комниновой династии угасает под османским давлением. Поможем ли мы Трапезунду как собратья-греки, или включим его в Готию?"
 teo_events.10.a: "Сделать Трапезунд вассалом — защитить понтийское наследие под Готией"
 teo_events.20.t: "Константинополь отвоёван — коронация Готского короля"
 teo_events.20.d: "Константинополь в руках Готии! Вернуть православный священный город у османов означает, что Россия как «Третий Рим» становится духовным вождём православного мира. Христианский крест вновь реет над Святой Софией."
 teo_events.20.a: "Слава Готскому королю! Слава Константинополю!"
 teo_events.30.t: "Русский вопрос — союз или завоевание?"
 teo_events.30.d: "Семья Гаврас держит глубокие узы с русскими дворянскими домами. Как определим мы наши отношения с Москвой и Новгородом — выкуем ли союз, защищающий общие интересы, или приведём Русь под правление Готии?"
 teo_events.30.a: "Заключить союз с Россией — работать вместе как православные братья"
 teo_events.30.b: "Стремиться к завоеванию Руси — Готия должна быть истинным владыкой Руси"
 teo_events.60.t: "Триумф Гаврасов — рождение Готской империи"
 teo_events.60.d: "Владычество над Чёрным морем, Константинополь возвращён, степи завоёваны — семья Гаврас ныне правит «Императором Готской империи» над восточным Средиземноморьем. Путешествие от горной крепости Мангуп заканчивается основанием мировой империи."
 teo_events.60.a: "Слава Готской империи! Слава семье Гаврас!"
 teo_events.99.t: "Готская империя — вечная слава"
 teo_events.99.d: "«Император Готии — владыка Чёрного моря, Средиземноморья и степи» — эта империя на перекрёстке восточной и западной цивилизации правит высшей. Удивительная история, начавшаяся в 1337 году с малой крепости Мангуп, находит здесь своё завершение."
 teo_events.99.a: "Слава Готской империи! Слава вечной славе!"
 STATIC_MODIFIER_NAME_teo_black_sea_fleet_mod: "Черноморский флот"
 STATIC_MODIFIER_DESC_teo_black_sea_fleet_mod: "Черноморский флот Феодоро отстаивает верховенство над жизненно важными торговыми водами."
 STATIC_MODIFIER_NAME_teo_theodoro_harbor_mod: "Гавань Феодоро"
 STATIC_MODIFIER_DESC_teo_theodoro_harbor_mod: "Гавань у подножия Мангупа служит вратами феодоританской морской мощи."
 STATIC_MODIFIER_NAME_teo_crimea_trade_mod: "Крымская торговля"
 STATIC_MODIFIER_DESC_teo_crimea_trade_mod: "Крымско-татарские торговые пути обеспечены под феодоританским контролем."
 STATIC_MODIFIER_NAME_teo_crimea_domination_mod: "Крым покорён"
 STATIC_MODIFIER_DESC_teo_crimea_domination_mod: "Все соперники изгнаны из Крыма — Феодоро правит его единственным владыкой."
 STATIC_MODIFIER_NAME_teo_tana_mod: "Торговый узел Тана"
 STATIC_MODIFIER_DESC_teo_tana_mod: "Торговый узел Тана в устье Дона покорён, открывая восточную торговлю."
 STATIC_MODIFIER_NAME_teo_black_sea_dom_mod: "Владыка Чёрного моря"
 STATIC_MODIFIER_DESC_teo_black_sea_dom_mod: "Полное верховенство над Чёрным морем — ни один соперник не смеет бросить вызов феодоританскому верховенству."
 STATIC_MODIFIER_NAME_teo_greek_heritage_mod: "Греческое наследие"
 STATIC_MODIFIER_DESC_teo_greek_heritage_mod: "Иконы и литургия Византии всё ещё хранятся в часовнях Феодоро, тихо поддерживая легитимность этой земли."
 STATIC_MODIFIER_NAME_teo_pontus_mod: "Понт восстановлен"
 STATIC_MODIFIER_DESC_teo_pontus_mod: "Понтийское побережье обеспечено, открывая путь к верховенству на Чёрном море."
 STATIC_MODIFIER_NAME_teo_gothia_mod: "Готия восходит"
 STATIC_MODIFIER_DESC_teo_gothia_mod: "Готская империя провозглашена — возрождение Готии признано миром."
 STATIC_MODIFIER_NAME_teo_aegean_mod: "Верховенство в Эгейском море"
 STATIC_MODIFIER_DESC_teo_aegean_mod: "В портах Эгейских островов корабли под флагом Готии стоят рядами, и грузы средиземноморской торговли разгружаются один за другим."
 STATIC_MODIFIER_NAME_teo_balkans_mod: "Балканы завоёваны"
 STATIC_MODIFIER_DESC_teo_balkans_mod: "Балканы завоёваны — Готская империя простирается над бывшим византийским коренным сердцем."
 STATIC_MODIFIER_NAME_teo_azov_mod: "Врата к Азовскому морю"
 STATIC_MODIFIER_DESC_teo_azov_mod: "Врата к Азовскому морю открывают внутренние торговые пути через Дон и Волгу."
 STATIC_MODIFIER_NAME_teo_pryazovia_mod: "Приазовье обеспечено"
 STATIC_MODIFIER_DESC_teo_pryazovia_mod: "Северное побережье Азовского моря обеспечено, открывая путь в степи."
 STATIC_MODIFIER_NAME_teo_tatar_wars_mod: "Борьба против татар"
 STATIC_MODIFIER_DESC_teo_tatar_wars_mod: "Войны против крымских татар выковали феодоританскую конницу в элитных степных воинов."
 STATIC_MODIFIER_NAME_teo_steppes_mod: "Владыка степей"
 STATIC_MODIFIER_DESC_teo_steppes_mod: "Обширная понтийская степь попадает под феодоританское правление — континентальная империя рождена."
 STATIC_MODIFIER_NAME_teo_caucasus_mod: "Кавказский поход"
 STATIC_MODIFIER_DESC_teo_caucasus_mod: "Врата к Кавказу открывают доступ к персидской и среднеазиатской торговле."
 STATIC_MODIFIER_NAME_teo_caspian_mod: "Каспийское море достигнуто"
 STATIC_MODIFIER_DESC_teo_caspian_mod: "Каспийское море достигнуто — персидские и среднеазиатские торговые пути ныне доступны."
 STATIC_MODIFIER_NAME_teo_russian_claim_mod: "Притязание на Русь"
 STATIC_MODIFIER_DESC_teo_russian_claim_mod: "Послы русских князей посещают двор Готии, и русские дворяне один за другим встают под её знамя."
 STATIC_MODIFIER_NAME_teo_ruthenia_mod: "Рутения завоёвана"
 STATIC_MODIFIER_DESC_teo_ruthenia_mod: "Рутения, включая Киев, завоёвана — мантия Византии и Руси притязана."
 STATIC_MODIFIER_NAME_teo_theodoro_dev_mod: "Феодоро развит"
 STATIC_MODIFIER_DESC_teo_theodoro_dev_mod: "Крепостной город Феодоро развит в столицу, достойную Готской империи."
 STATIC_MODIFIER_NAME_teo_trade_empire_mod: "Торговая империя"
 STATIC_MODIFIER_DESC_teo_trade_empire_mod: "Великая торговая империя возведена на перекрёстке цивилизаций."
 STATIC_MODIFIER_NAME_teo_silk_mod: "Торговля на Шёлковом пути"
 STATIC_MODIFIER_DESC_teo_silk_mod: "Шёлковый путь покорён — шёлк течёт через феодоританские руки на западные рынки."
 STATIC_MODIFIER_NAME_teo_gothic_culture_mod: "Готская культура"
 STATIC_MODIFIER_DESC_teo_gothic_culture_mod: "Самобытная готская культура возникает, сливая греческое, готское и татарское наследие."
 STATIC_MODIFIER_NAME_teo_orthodox_fortress_mod: "Православный оплот"
 STATIC_MODIFIER_DESC_teo_orthodox_fortress_mod: "Православные монастыри и военные крепости защищают равно веру и границу."
 STATIC_MODIFIER_NAME_teo_great_theodoro_mod: "Великий Феодоро"
 STATIC_MODIFIER_DESC_teo_great_theodoro_mod: "Мангуп преобразован в вечную столицу Готской империи."
 STATIC_MODIFIER_NAME_teo_wine_mod: "Крымское вино"
 STATIC_MODIFIER_DESC_teo_wine_mod: "Крымские виноградники возрождены — тонкие вина текут на средиземноморские рынки."
 STATIC_MODIFIER_NAME_teo_mangup_fortress_mod: "Крепость Мангуп"
 STATIC_MODIFIER_DESC_teo_mangup_fortress_mod: "Крепость Мангуп укреплена сверх всякой атаки — вечное седалище Готской империи."
 STATIC_MODIFIER_NAME_teo_anatolia_mod: "Анатолийское побережье обеспечено"
 STATIC_MODIFIER_DESC_teo_anatolia_mod: "Южное черноморское побережье Анатолии завоёвано — море становится феодоританским внутренним морем."
 STATIC_MODIFIER_NAME_teo_patriarch_mod: "Православный патриархат"
 STATIC_MODIFIER_DESC_teo_patriarch_mod: "Патриархат Константинополя делает Феодоро защитником всех православных христиан."
 STATIC_MODIFIER_NAME_teo_merchant_republic_mod: "Купеческая республика"
 STATIC_MODIFIER_DESC_teo_merchant_republic_mod: "Обширная торговая сеть простирается над Средиземноморьем, Чёрным морем и Шёлковым путём."
 STATIC_MODIFIER_NAME_teo_trebizond_city_mod: "Город Трапезунд"
 STATIC_MODIFIER_DESC_teo_trebizond_city_mod: "Трапезунд развит важным торговым узлом на южном черноморском побережье."
 STATIC_MODIFIER_NAME_teo_gavras_final_mod: "Гегемония Готской империи"
 STATIC_MODIFIER_DESC_teo_gavras_final_mod: "Видение династии Гаврас завершено — Готская империя правит морем и степью."
 teo_events.1.b: "Возродить готскую гордость — мы истинные наследники Готии"
 teo_events.5.t: "Газария — купить или отказать?"
 teo_events.5.d: "Республика Генуя управляет своей крымско-татарской торговой колонией «Газария (GAZ)». За плату в 300 дукатов Генуя предлагает передать Газарию вассалом Феодоро.\n\nЭто возможность мирно утвердить контроль над Крымом — но 300 дукатов высокая цена. Купишь ли ты её?"
 teo_events.5.a: "Заплатить 300 дукатов, дабы купить Газарию — Крым будет нашим"
 teo_events.5.b: "Отказать — сохранить казну пока"
 STATIC_MODIFIER_NAME_teo_gothic_penalty_mod: "Боль готского обращения"
 STATIC_MODIFIER_DESC_teo_gothic_penalty_mod: "Понтийские греки, неспособные привыкнуть к готскому языку и обычаям, лелеют обиду, кая тлеет в деревнях — но все знают, что больший награда ждёт, когда Готская империя завершена."
 STATIC_MODIFIER_NAME_teo_gothic_bonus_mod: "Истинный наследник Готии"
 STATIC_MODIFIER_DESC_teo_gothic_bonus_mod: "Готская империя, завершённая при сохранении готской культуры — дух древних готов возрождён, принося Готской империи вечную славу."
 teo_events.10.b: "Сохранить союз — почтить гордость Комнинов"
 STATIC_MODIFIER_NAME_teo_russian_alliance_mod: "Союз с Россией"
 STATIC_MODIFIER_DESC_teo_russian_alliance_mod: "Дружественный союз с русскими княжествами повысил дипломатическое влияние Готии."
 STATIC_MODIFIER_NAME_teo_russian_conquest_mod: "Воля завоевать Русь"
 STATIC_MODIFIER_DESC_teo_russian_conquest_mod: "Воля Готии завоевать Русь подавляет полученную враждебность."
 teo_events.99.b: "Завершить империю с готской гордостью — открыть право вторгаться в Германию"
 cb_gothic_invasion: "Готское вторжение"
 cb_gothic_invasion_desc: "Своеобразный casus belli против наций германской культурной группы — издержки завоевания и враждебность снижены на 80%. Открыт исключительно для готской основной культуры после завершения финальной миссии Готской империи."
