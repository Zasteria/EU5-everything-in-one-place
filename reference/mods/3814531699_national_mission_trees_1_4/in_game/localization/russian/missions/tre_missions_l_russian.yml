l_russian:
 tre_trebizond_mission_pack: "Возрождение Комниновой династии и восстановление Византии"
 tre_trebizond_mission_pack_DESCRIPTION:0 "В 1337 году Трапезундская империя выживает малым государством на понтийском побережье, наследниками Комниновой династии. Захвати черноморскую торговлю, отвоюй Анатолию, освободи Константинополь и восстанови Византийскую империю."
 tre_trebizond_mission_pack_CRITERIA_DESCRIPTION:0 "Завоюй Анатолию, верни Константинополь, покори Балканы и восстанови Византийскую империю."
 tre_trebizond_mission_pack_BUTTON_TOOLTIP:0 "Восстанови Комнинову империю."
 tre_trebizond_mission_pack_BUTTON_DETAILS:0 "Унаследуй от берегов Понта византийское наследие и триумфально маршируй на Константинополь!"
 tre_komnenian_legacy: "Наследие Комнинов"
 tre_komnenian_legacy_desc: "Наследие Комниновой династии движет честолюбием Трапезунда восстановить византийское величие."
 tre_pontus_coast: "Обеспечь понтийское побережье"
 tre_pontus_coast_desc: "Обеспечь понтийское побережье как основу для господства в черноморской торговле."
 tre_black_sea_trade: "Черноморская торговля"
 tre_black_sea_trade_desc: "Захвати черноморскую торговлю у генуэзских и венецианских соперников."
 tre_dev_trebizond: "Развей Трапезунд"
 tre_dev_trebizond_desc: "Разви Трапезунд в процветающий узел, достойный Комниновой империи."
 tre_orthodox_stronghold: "Православный оплот"
 tre_orthodox_stronghold_desc: "Укрепи православные монастыри, дабы утвердить Трапезунд духовным наследником Византии."
 tre_armenia_campaign: "Покори Армению"
 tre_armenia_campaign_desc: "Покори Армению, дабы обеспечить восточную границу и обрести горных воинов."
 tre_cappadocia: "Завоевание Каппадокии"
 tre_cappadocia_desc: "Завоюй пещерно-монастырское коренное сердце Каппадокии и продвинься в Центральную Анатолию."
 tre_central_anatolia: "Верни Центральную Анатолию"
 tre_central_anatolia_desc: "Верни Центральную Анатолию, включая Анкару, из турецкого владычества."
 tre_west_anatolia: "Марш в Западную Анатолию"
 tre_west_anatolia_desc: "Маршируй к богатому эгейскому побережью Западной Анатолии."
 tre_reclaim_nicaea: "Верни Никею"
 tre_reclaim_nicaea_desc: "Верни Никею и Бурсу — византийскую столицу в изгнании — и приблизься к Константинополю."
 tre_anatolian_emperor: "Император Анатолии"
 tre_anatolian_emperor_desc: "Объедини всю Анатолию под знаменем Комнинов."
 tre_thrace_campaign: "Захвати Фракию"
 tre_thrace_campaign_desc: "Захвати Фракию, дабы окружить Константинополь и подготовить его освобождение."
 tre_reclaim_constantinople: "Верни Константинополь"
 tre_reclaim_constantinople_desc: "Освободи Константинополь и восстанови православный крест над Святой Софией."
 tre_northern_greece: "Верни Северную Грецию"
 tre_northern_greece_desc: "Верни Северную Грецию, включая Салоники — второй город Византии."
 tre_bulgaria: "Завоевание Болгарии"
 tre_bulgaria_desc: "Завоюй Болгарию, дабы упрочить господство на Балканах."
 tre_morea: "Верни Морею"
 tre_morea_desc: "Верни Морею и Афины — сердце античной греческой цивилизации."
 tre_aegean_islands: "Эгейские острова"
 tre_aegean_islands_desc: "Верни Эгейские острова из-под латинской крестоносной оккупации."
 tre_macedonian_campaign: "Завоевание Македонии"
 tre_macedonian_campaign_desc: "Завоюй Македонию — родину Александра Великого."
 tre_silk_trade: "Шёлковая торговля"
 tre_silk_trade_desc: "Овладей торговлей по Шёлковому пути через Трапезунд, дабы господствовать в торговле Восток-Запад."
 tre_komnenian_army: "Комнинова армия"
 tre_komnenian_army_desc: "Построй Комнинову армию — слияние наёмников и провинциальных ополчений."
 tre_greek_culture: "Возрождение греческой культуры"
 tre_greek_culture_desc: "Возроди византийскую учёность и искусства, дабы сделать Трапезунд культурным маяком."
 tre_cilicia_campaign: "Покори Киликию"
 tre_cilicia_campaign_desc: "Покори Киликию, дабы обеспечить доступ к Средиземному морю."
 tre_dev_constantinople: "Отстрой Константинополь"
 tre_dev_constantinople_desc: "Отстрой Константинополь как великолепную столицу восстановленной Византийской империи."
 tre_orthodox_patriarch: "Православный патриархат"
 tre_orthodox_patriarch_desc: "Учреди Константинопольский патриархат и сделай Трапезунд стражем православия."
 tre_georgia_campaign: "Грузинский поход"
 tre_georgia_campaign_desc: "Веди поход в Грузию, дабы обеспечить кавказский фланг."
 tre_komnenian_navy: "Комнинов флот"
 tre_komnenian_navy_desc: "Построй мощный флот, дабы господствовать над Чёрным морем и Эгейским морем."
 tre_antioch_crusade: "Верни Антиохию"
 tre_antioch_crusade_desc: "Верни Антиохию — некогда жемчужину византийской Сирии."
 tre_greek_population: "Рост греческого населения"
 tre_greek_population_desc: "Дай возрасти греческому населению как культурному хребту восстановленной империи."
 tre_restore_byzantium: "Восстанови Византию"
 tre_restore_byzantium_desc: "Провозгласи восстановление Византийской империи под комниновым водительством."
 tre_komnenos_dynasty: "Слава Комниновой династии"
 tre_komnenos_dynasty_desc: "Правь как вечный комнинов император — наследник Востока Рима, страж православия."
 tre_events.20.t: "Константинополь возвращён — Византия жива"
 tre_events.20.d: "Константинополь в комниновых руках! Православный крест ещё раз развевается над Святой Софией. Мир содрогается — Византия воскресла."
 tre_events.20.a: "Слава Константинополю во славе Господней!"
 tre_events.60.t: "Провозглашение восстановления Византии"
 tre_events.60.d: "Анатолия, Балканы и Константинополь объединены — Комнинова династия провозглашает восстановление Византийской империи. Воскрешение из трагедии 1204 года."
 tre_events.60.a: "Слава Византии! Слава Комниновой династии!"
 tre_events.99.t: "Вечная слава Комниновой династии"
 tre_events.99.d: "«Комнинов Император — наследник Востока Рима и страж православия» — этот титул звучит над миром Средиземноморья. Малая держава, начатая в Трапезунде, правит наследником величайшей империи истории."
 tre_events.99.a: "Слава Комниновой династии! Слава вечная!"
 STATIC_MODIFIER_NAME_tre_komnenian_mod: "Комнинов"
 STATIC_MODIFIER_DESC_tre_komnenian_mod: "Кто взирает на пурпурное знамя Комнинов, представляет при дворе тот день, когда слава Византии будет возвращена в руки Трапезунда."
 STATIC_MODIFIER_NAME_tre_pontus_mod: "Понт"
 STATIC_MODIFIER_DESC_tre_pontus_mod: "Понтийское побережье обеспечено как основа для господства в черноморской торговле."
 STATIC_MODIFIER_NAME_tre_black_sea_mod: "Чёрное море"
 STATIC_MODIFIER_DESC_tre_black_sea_mod: "Ни одно торговое судно на Чёрном море не может принять шелка Востока, не бросив якорь в порту Трапезунда."
 STATIC_MODIFIER_NAME_tre_trebizond_city_mod: "Город Трапезунд"
 STATIC_MODIFIER_DESC_tre_trebizond_city_mod: "Трапезунд развит в процветающий торговый узел Комниновой империи."
 STATIC_MODIFIER_NAME_tre_orthodox_mod: "Православный"
 STATIC_MODIFIER_DESC_tre_orthodox_mod: "Православные монастыри укреплены и утверждают Трапезунд духовным наследником Византии."
 STATIC_MODIFIER_NAME_tre_armenia_mod: "Армения"
 STATIC_MODIFIER_DESC_tre_armenia_mod: "Армения покорена, обеспечивая восточную границу и принося горных воинов."
 STATIC_MODIFIER_NAME_tre_cappadocia_mod: "Каппадокия"
 STATIC_MODIFIER_DESC_tre_cappadocia_mod: "Пещерно-монастырское коренное сердце Каппадокии падает под комнинов контроль."
 STATIC_MODIFIER_NAME_tre_anatolia_mod: "Анатолия"
 STATIC_MODIFIER_DESC_tre_anatolia_mod: "Центральная Анатолия возвращена — путь к Константинополю открыт."
 STATIC_MODIFIER_NAME_tre_west_anatolia_mod: "Западная Анатолия"
 STATIC_MODIFIER_DESC_tre_west_anatolia_mod: "Богатое эгейское побережье Западной Анатолии обеспечено для Комниновой империи."
 STATIC_MODIFIER_NAME_tre_nicaea_mod: "Никея"
 STATIC_MODIFIER_DESC_tre_nicaea_mod: "Никея возвращена — византийская столица в изгнании возвращается к православному владычеству."
 STATIC_MODIFIER_NAME_tre_thrace_mod: "Фракия"
 STATIC_MODIFIER_DESC_tre_thrace_mod: "Фракия захвачена, окружая Константинополь в подготовке к его освобождению."
 STATIC_MODIFIER_NAME_tre_greece_mod: "Греция"
 STATIC_MODIFIER_DESC_tre_greece_mod: "Северная Греция, включая Салоники, обеспечена — второй город Византии восстановлен."
 STATIC_MODIFIER_NAME_tre_bulgaria_mod: "Болгария"
 STATIC_MODIFIER_DESC_tre_bulgaria_mod: "Болгария завоёвана и упрочивает господство на Балканах."
 STATIC_MODIFIER_NAME_tre_morea_mod: "Морея"
 STATIC_MODIFIER_DESC_tre_morea_mod: "Морея и Афины возвращены — сердце античной греческой цивилизации восстановлено."
 STATIC_MODIFIER_NAME_tre_aegean_mod: "Эгейское море"
 STATIC_MODIFIER_DESC_tre_aegean_mod: "Эгейские острова возвращены из-под латинской крестоносной оккупации."
 STATIC_MODIFIER_NAME_tre_macedonia_mod: "Македония"
 STATIC_MODIFIER_DESC_tre_macedonia_mod: "Македония — родина Александра — падает под комнинов владычество."
 STATIC_MODIFIER_NAME_tre_silk_mod: "Шёлк"
 STATIC_MODIFIER_DESC_tre_silk_mod: "Торговля по Шёлковому пути через Трапезунд господствует в торговле Восток-Запад."
 STATIC_MODIFIER_NAME_tre_army_mod: "Армия"
 STATIC_MODIFIER_DESC_tre_army_mod: "Наёмники и провинциальные ополчения обучаются под единым знаменем, и Комнинова армия обрела новую силу."
 STATIC_MODIFIER_NAME_tre_culture_mod: "Культура"
 STATIC_MODIFIER_DESC_tre_culture_mod: "Византийская учёность и искусства возрождены, делая Трапезунд культурным маяком."
 STATIC_MODIFIER_NAME_tre_cilicia_mod: "Киликия"
 STATIC_MODIFIER_DESC_tre_cilicia_mod: "Киликия покорена и обеспечивает доступ к Средиземному морю."
 STATIC_MODIFIER_NAME_tre_cpole_city_mod: "Город Константинополь"
 STATIC_MODIFIER_DESC_tre_cpole_city_mod: "Константинополь отстроен как великолепная столица восстановленной Византийской империи."
 STATIC_MODIFIER_NAME_tre_patriarch_mod: "Патриарх"
 STATIC_MODIFIER_DESC_tre_patriarch_mod: "Константинопольский патриархат учреждён под комниновым надзором."
 STATIC_MODIFIER_NAME_tre_georgia_mod: "Грузия"
 STATIC_MODIFIER_DESC_tre_georgia_mod: "Грузия обеспечена и стабилизирует кавказский фланг империи."
 STATIC_MODIFIER_NAME_tre_navy_mod: "Флот"
 STATIC_MODIFIER_DESC_tre_navy_mod: "Мощный комнинов флот господствует над Чёрным морем и Эгейским морем."
 STATIC_MODIFIER_NAME_tre_antioch_mod: "Антиохия"
 STATIC_MODIFIER_DESC_tre_antioch_mod: "Антиохия — жемчужина византийской Сирии — возвращена."
 STATIC_MODIFIER_NAME_tre_greek_pop_mod: "Греческое население"
 STATIC_MODIFIER_DESC_tre_greek_pop_mod: "Греческие молитвы и рыночные выкрики наполняют улицы каждого города восстановленной империи."
 STATIC_MODIFIER_NAME_tre_restore_byzantium_mod: "Византия восстановлена"
 STATIC_MODIFIER_DESC_tre_restore_byzantium_mod: "Византийская империя формально восстановлена под комниновым водительством."
 STATIC_MODIFIER_NAME_tre_komnenos_final_mod: "Комнины завершены"
 STATIC_MODIFIER_DESC_tre_komnenos_final_mod: "Комнинова империя стоит вечно — владыка восточного Средиземноморья."
 tre_rize_tea: "Чайные плантации в Ризе"
 tre_rize_tea_desc: "Риза — благословенная тёплым влажным климатом между Понтийскими горами и Чёрным морем, эта область станет величайшим чаевозделывающим краем Анатолии. Начиная с 1737 года, обрати склоны Ризы в чайные плантации, применяя технологии возделывания, прибывшие из Грузии. Принеси благородный восточный напиток в Комнинову империю."
 STATIC_MODIFIER_NAME_tre_rize_tea_mod: "Чайные плантации Ризы"
 STATIC_MODIFIER_DESC_tre_rize_tea_mod: "Склоны Ризы обращены в чайные плантации, основывая базу чаепроизводства для империи."
 STATIC_MODIFIER_NAME_tre_cpole_loc_mod: "Константинополь восстановлен"
 STATIC_MODIFIER_DESC_tre_cpole_loc_mod: "Константинополь начинает действовать как административный и правительственный центр империи."
