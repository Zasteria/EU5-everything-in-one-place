l_russian:
 mon_montferrat_mission_pack: "Честолюбие Палеологов и Владыка Италии"
 mon_montferrat_mission_pack_DESCRIPTION:0 "В 1337 году маркграфством Монферрат правит господин, в чьих жилах течёт кровь византийской династии Палеологов. Заяви права на Салоники и марширируй на восток к Константинополю, или выкуй дипломатией и мечом кондотьеров империю в Северной Италии — две мечты пылают в одном правителе."
 mon_montferrat_mission_pack_CRITERIA_DESCRIPTION:0 "Восточная мечта или западное владычество — кровь Палеологов открывает оба пути."
 mon_montferrat_mission_pack_BUTTON_TOOLTIP:0 "Используй кровь Палеологов, дабы завоевать Италию и Грецию."
 mon_montferrat_mission_pack_BUTTON_DETAILS:0 "От Салоник до Афин под именем Палеологов, от Казале до Генуи сталью и монетой — завоюй Восток и Запад!"
 mon_palaiologos_ambition: "Честолюбие Палеологов"
 mon_palaiologos_ambition_desc: "Правитель Монферрата носит палеологову кровь. Две мечты пылают: на восток к Салоникам, или на запад к итальянскому владычеству."
 mon_claim_thessaloniki: "Заяви права на Салоники"
 mon_claim_thessaloniki_desc: "Заяви права на Салоники — некогда второй город Византии — как плацдарм для восточных честолюбий."
 mon_seize_thessaloniki: "Захвати Салоники"
 mon_seize_thessaloniki_desc: "Захвати Салоники и водрузи знамя Палеологов на Белую башню."
 mon_conquer_macedonia: "Завоевание Македонии"
 mon_conquer_macedonia_desc: "Завоюй Македонию — врата в Грецию и родину Александра Великого."
 mon_northern_greece: "Северная Греция"
 mon_northern_greece_desc: "Обеспечь Северную Грецию как основу для дальнейшей экспансии."
 mon_conquer_morea: "Завоевание Мореи"
 mon_conquer_morea_desc: "Завоюй Морею и Афины — сердце античной греческой цивилизации."
 mon_aegean_control: "Овладей Эгейским морем"
 mon_aegean_control_desc: "Захвати Эгейские острова, дабы расширить морскую досягаемость Монферрата."
 mon_new_byzantium: "Новая Византия"
 mon_new_byzantium_desc: "Заяви права на византийское наследие и стань признанным наследником Восточного Рима."
 mon_secure_piedmont: "Обеспечь Пьемонт"
 mon_secure_piedmont_desc: "Обеспечь Пьемонт как основу для северно-итальянского владычества."
 mon_casale_capital: "Казале Монферрато"
 mon_casale_capital_desc: "Разви Казале Монферрато в столицу, достойную маркграфства."
 mon_rival_savoy: "Соперник Савойя"
 mon_rival_savoy_desc: "Противостань Савойе — сопернику за пьемонтское владычество — и утверди господство."
 mon_control_lombardy: "Овладей Ломбардией"
 mon_control_lombardy_desc: "Завоюй Ломбардию — сердце Северной Италии."
 mon_seize_genoa: "Захвати Геную"
 mon_seize_genoa_desc: "Захвати Геную — Ла Супербу — и получи доступ к средиземноморской торговле."
 mon_north_italy_trade: "Северно-итальянская торговая империя"
 mon_north_italy_trade_desc: "Построй торговую империю, охватывающую Ломбардию, Лигурию и Венецию."
 mon_emilia: "Завоевание Эмилии"
 mon_emilia_desc: "Завоюй плодородный южный берег долины реки По — Болонью, Парму и Модену."
 mon_king_of_italy: "Король Италии"
 mon_king_of_italy_desc: "Провозгласи короля Италии, объединив Ломбардию, Лигурию и Эмилию."
 mon_hre_relations: "Отношения со Священной Римской империей"
 mon_hre_relations_desc: "Определи отношения со Священной Римской империей — союзник, соперник или предводитель."
 mon_dev_casale: "Казале — город учёности и богатства"
 mon_dev_casale_desc: "Обрати Казале в город учёности и богатства, где сливаются Возрождение и византийское наследие."
 mon_renaissance_court: "Двор Возрождения"
 mon_renaissance_court_desc: "Учреди двор Возрождения, где византийская классическая учёность сливается с итальянским художественным новаторством."
 mon_mercenary_tradition: "Традиция кондотьеров"
 mon_mercenary_tradition_desc: "Построй традицию кондотьеров — наёмное военное наследие Монферрата."
 mon_papal_alliance: "Союз с папой"
 mon_papal_alliance_desc: "Заключи союз с папой, дабы узаконить честолюбия Монферрата по всей Италии."
 mon_tuscany: "Завоевание Тосканы"
 mon_tuscany_desc: "Завоюй Тоскану — дом медичейской культуры Возрождения — и продвинься против Рима."
 mon_veneto: "Завоевание Венето"
 mon_veneto_desc: "Завоюй Венето, включая Венецию, дабы завершить северно-итальянское владычество."
 mon_byzantine_heritage: "Византийское наследие"
 mon_byzantine_heritage_desc: "Заяви права на полное византийское наследие — в греческой культуре и православии обретаешь больший выигрыш."
 mon_navy_adriatic: "Адриатический флот"
 mon_navy_adriatic_desc: "Построй мощный адриатический флот, объединяющий генуэзскую и венецианскую морскую мощь."
 mon_southern_italy: "Южная Италия"
 mon_southern_italy_desc: "Продвинься в Южную Италию и захвати Неаполь, дабы объединить итальянский полуостров."
 mon_marquis_of_italy: "Великий маркграф Италии"
 mon_marquis_of_italy_desc: "Правь как Великий маркграф Италии — объединяя Восток и Запад, Север и Юг."
 mon_new_roman_empire: "Новая Римская империя"
 mon_new_roman_empire_desc: "Провозгласи Новую Римскую империю — наследницу и Восточного, и Западного Рима."
 mon_events.10.t: "Салоники захвачены — знамя Палеологов над Белой башней"
 mon_events.10.d: "Салоники — некогда второй город Византийской империи — ныне падают Монферрату. Правитель с палеологовой кровью начинает осуществлять восточные честолюбия. Звонят колокола Белой башни — началась новая эпоха."
 mon_events.10.a: "Слава Салоникам! Под знаменем Палеологов!"
 mon_events.20.t: "Король Италии — триумф от Казале до Святого города"
 mon_events.20.d: "«Король Италии» — Монферрат, объединив Ломбардию, Лигурию и Эмилию, провозглашается новым владыкой итальянского полуострова. Ликование разносится по двору Казале."
 mon_events.20.a: "Слава Королю Италии!"
 mon_events.50.t: "Рождение Новой Византии — мечта Палеологов осуществлена"
 mon_events.50.d: "«Император Палеологов — наследник Рима и Константинополя» — Монферрат наследует византийское имя. Путь от малого северно-итальянского маркграфства начал свой путь к господству над восточным Средиземноморьем."
 mon_events.50.a: "Слава Императору Палеологов! Слава Новой Византии!"
 mon_events.60.t: "Великий маркграф Италии — владычество на перекрёстке Востока и Запада"
 mon_events.60.d: "От Казале Монферрато до Генуи, Флоренции, Неаполя — рождена империя Монферрата. Искусство Возрождения, византийский дух, меч кондотьеров — три силы слились, дабы создать владыку Италии."
 mon_events.60.a: "Слава Великому маркграфу Италии!"
 mon_events.99.t: "Новая Римская империя — Объединитель Востока и Запада"
 mon_events.99.d: "«Император Палеологов — наследник Востока и Запада Рима, Король Италии, Владыка Греции» — этот титул разносится над миром Средиземноморья. Честолюбие, зародившееся в 1337 году в малом дворе Казале, ныне достигает вершины в создании мировой империи. Имя Рима восстановлено."
 mon_events.99.a: "Слава Новой Римской империи! Слава вечная!"
 STATIC_MODIFIER_NAME_mon_palaiologos_mod: "Палеологи"
 STATIC_MODIFIER_DESC_mon_palaiologos_mod: "Кровная линия Палеологов пробуждает честолюбие Монферрата на восток и запад."
 STATIC_MODIFIER_NAME_mon_thessaloniki_claim_mod: "Притязание на Салоники"
 STATIC_MODIFIER_DESC_mon_thessaloniki_claim_mod: "Салоники манят — скоро знамя Палеологов будет реять над Эгейским морем."
 STATIC_MODIFIER_NAME_mon_macedonia_mod: "Македония"
 STATIC_MODIFIER_DESC_mon_macedonia_mod: "Македония завоёвана — врата в Грецию и родина Александра Великого."
 STATIC_MODIFIER_NAME_mon_northern_greece_mod: "Северная Греция"
 STATIC_MODIFIER_DESC_mon_northern_greece_mod: "Северная Греция обеспечена как основа для дальнейшей экспансии на юг."
 STATIC_MODIFIER_NAME_mon_morea_mod: "Морея"
 STATIC_MODIFIER_DESC_mon_morea_mod: "Морея и Афины завоёваны — сердце античной греческой цивилизации восстановлено."
 STATIC_MODIFIER_NAME_mon_aegean_mod: "Эгейское море"
 STATIC_MODIFIER_DESC_mon_aegean_mod: "Эгейские острова захвачены, расширяя морскую досягаемость Монферрата в Средиземноморье."
 STATIC_MODIFIER_NAME_mon_piedmont_mod: "Пьемонт"
 STATIC_MODIFIER_DESC_mon_piedmont_mod: "Пьемонт обеспечен — ополчения Северной Италии ныне маршируют под знаменем Монферрата."
 STATIC_MODIFIER_NAME_mon_casale_mod: "Казале"
 STATIC_MODIFIER_DESC_mon_casale_mod: "Казале Монферрато бьётся как торговое сердце маркграфства."
 STATIC_MODIFIER_NAME_mon_savoy_mod: "Савойя"
 STATIC_MODIFIER_DESC_mon_savoy_mod: "Савойя — соперник за пьемонтское владычество — противостоена и подавлена."
 STATIC_MODIFIER_NAME_mon_lombardy_mod: "Ломбардия"
 STATIC_MODIFIER_DESC_mon_lombardy_mod: "Ломбардия — сердце Северной Италии — падает под контроль Монферрата."
 STATIC_MODIFIER_NAME_mon_genoa_mod: "Генуя"
 STATIC_MODIFIER_DESC_mon_genoa_mod: "Ла Суперба Генуя захвачена — врата к средиземноморской торговле распахнуты."
 STATIC_MODIFIER_NAME_mon_trade_mod: "Торговля"
 STATIC_MODIFIER_DESC_mon_trade_mod: "Торговая империя, охватывающая Ломбардию, Лигурию и Венецию, возведена."
 STATIC_MODIFIER_NAME_mon_emilia_mod: "Эмилия"
 STATIC_MODIFIER_DESC_mon_emilia_mod: "Плодородный южный берег долины По — Болонья, Парма, Модена — завоёваны."
 STATIC_MODIFIER_NAME_mon_hre_mod: "СРИ"
 STATIC_MODIFIER_DESC_mon_hre_mod: "Отношения со Священной Римской империей определены — Монферрат обретает дипломатический вес."
 STATIC_MODIFIER_NAME_mon_casale_dev_mod: "Казале развит"
 STATIC_MODIFIER_DESC_mon_casale_dev_mod: "Казале вступает в свой золотой век учёности и богатства — культурный маяк Северной Италии."
 STATIC_MODIFIER_NAME_mon_renaissance_mod: "Возрождение"
 STATIC_MODIFIER_DESC_mon_renaissance_mod: "Двор Возрождения учреждён — византийская классическая учёность сливается с итальянским художественным новаторством."
 STATIC_MODIFIER_NAME_mon_condottieri_mod: "Кондотьеры"
 STATIC_MODIFIER_DESC_mon_condottieri_mod: "Кондотьеры Монферрата стали легендой — элитные воины собираются под их знамёнами и господствовали на полях сражений Италии."
 STATIC_MODIFIER_NAME_mon_papal_mod: "Папа"
 STATIC_MODIFIER_DESC_mon_papal_mod: "Благословение папы узаконивает честолюбия Монферрата по всему итальянскому полуострову."
 STATIC_MODIFIER_NAME_mon_tuscany_mod: "Тоскана"
 STATIC_MODIFIER_DESC_mon_tuscany_mod: "Тоскана — дом медичейской культуры Возрождения — завоёвана и обеспечена."
 STATIC_MODIFIER_NAME_mon_veneto_mod: "Венето"
 STATIC_MODIFIER_DESC_mon_veneto_mod: "Венето, включая Венецию, завоёвано — северно-итальянское владычество завершено."
 STATIC_MODIFIER_NAME_mon_heritage_mod: "Наследие"
 STATIC_MODIFIER_DESC_mon_heritage_mod: "Полное византийское наследие заявлено — бюрократия, акведуки и легитимность текут из античного Рима."
 STATIC_MODIFIER_NAME_mon_navy_mod: "Флот"
 STATIC_MODIFIER_DESC_mon_navy_mod: "Мощный адриатический флот, объединяющий генуэзскую и венецианскую морскую мощь, возведён."
 STATIC_MODIFIER_NAME_mon_southern_italy_mod: "Южная Италия"
 STATIC_MODIFIER_DESC_mon_southern_italy_mod: "Южная Италия и Неаполь захвачены — итальянский полуостров объединён под единым знаменем."
 STATIC_MODIFIER_NAME_mon_marquis_final_mod: "Маркграф"
 STATIC_MODIFIER_DESC_mon_marquis_final_mod: "Великий маркграф Италии правит — объединяя Восток и Запад, Север и Юг."
 STATIC_MODIFIER_NAME_mon_new_roman_mod: "Новый Рим"
 STATIC_MODIFIER_DESC_mon_new_roman_mod: "Новая Римская империя провозглашена — наследница и Восточного, и Западного Рима."
 mon_carta_di_franchigia: "Carta di Franchigia"
 mon_carta_di_franchigia_desc: "Carta di Franchigia — «Хартия свободы». Маркграф Монферрата даёт каждому городу автономию и привилегии, создавая плодородную почву, на коей могут процветать купцы, крестьяне и горожане. Как некогда процветал Казале под такой хартией, так весь маркграфат воспользуется её благословением."
 mon_carta_di_franchigia_unlock_tt: "Городская привилегия «Carta di Franchigia» становится доступна."
 mon_acqui_terme: "Развитие Аккуи Терме"
 mon_acqui_terme_desc: "Аккуи Терме — с римской древности известное как «город термальных источников». Верни к жизни его прославленные воды. Целебные источники, некогда посещаемые римскими императорами, возродятся новой гордостью Монферрата и городом здоровья, притягивающим гостей издалека."
 STATIC_MODIFIER_NAME_mon_acqui_terme_mod: "Аккуи Терме восстановлен"
 STATIC_MODIFIER_DESC_mon_acqui_terme_mod: "Античные римские термальные источники восстановлены — Аккуи возрождён как город здоровья и богатства."
 STATIC_MODIFIER_NAME_mon_heritage_basic_mod: "Угасающий свет Византии"
 STATIC_MODIFIER_DESC_mon_heritage_basic_mod: "Византийское наследие озаряет Монферрат — его легитимность начинает тихо возрастать."
 STATIC_MODIFIER_NAME_mon_new_byzantium_mod: "Величие Новой Византии"
 STATIC_MODIFIER_DESC_mon_new_byzantium_mod: "Мечта Палеологов осуществлена — имперское управление, морская мощь и дорожные сети кристаллизуются в силу Монферрата."
