l_russian:
 teu_teutonic_mission_pack: "Тевтонский орден — меч и крест"
 teu_teutonic_mission_pack_DESCRIPTION:0 "Тевтонский орден, завоевавший Балтику именем Бога. Подними крестоносное знамя и уничтожь язычников и православных Востока, дабы завершить Северный крестовый поход — или секуляризуйся и заложи основы современной Германии Королевством Пруссия. Настало время выбора."
 teu_teutonic_mission_pack_CRITERIA_DESCRIPTION:0 "Заверши Северный крестовый поход на крестоносном пути, или построй Королевство Пруссия на пути секуляризации."
 teu_teutonic_mission_pack_BUTTON_TOOLTIP:0 "Завоюй Балтику и Восточную Европу мечом и крестом."
 teu_teutonic_mission_pack_BUTTON_DETAILS:0 "«Вся помощь просящим, никакой пощады врагу» — правь Балтикой именем Великого магистра!"
 teu_crusaders_legacy: "Наследие крестоносного ордена"
 teu_crusaders_legacy_desc: "Основанный в Акре в 1190 году во время Третьего крестового похода, Тевтонский орден начался как госпитальерский орден в Святой земле. В 1226 году Золотая булла Фридриха II в Римини даровала ордену право вести поход против языческой Пруссии, и с тех пор он завоевал южный берег Балтики крестоносным мечом. Это «монашеско-рыцарское государство», со столицей в Мариенбурге, остаётся последним крестоносным государством Европы, продолжая войны обращения и колонизации. Ныне, окружённый могущественными соперниками Гедиминовой Литвы и Ягеллонской Польши, истинная ценность ордена будет испытана."
 teu_secure_prussia: "Обеспечь Пруссию"
 teu_secure_prussia_desc: "Пруссия — некогда дом балтийских прусских народов — была обретена более чем пятьюдесятью годами завоеваний Тевтонского ордена, начатых в 1230-х годах. После подавления «Великого восстания» 1283 года коренное население было фактически уничтожено, и земля отстроена заново колонией немецких поселенцев. Однако в горах и лесах ещё тлеют угли сопротивления. Заверши сеть крепостей по всей Пруссии и сделай правление ордена несокрушимым — ибо без Пруссии нет Тевтонского ордена."
 teu_christianize_prussia: "Христианизируй Пруссию"
 teu_christianize_prussia_desc: "Заявленная причина существования Тевтонского ордена — «обращение язычников». В действительности, большинство покорённых пруссов были насильно обращены, а сопротивлявшиеся истреблены. Кристбургский договор 1249 года даровал прусским дворянам права в обмен на крещение, но последующие восстания нарушили это обещание. Ныне добейся истинной католизации и построй сеть церквей, дабы утвердить религиозную легитимность ордена — лишь с поддержкой папы это государство может стать истинно законным."
 teu_subdue_lithuania: "Покори Литву"
 teu_subdue_lithuania_desc: "Великое княжество Литовское — обширное языческое государство, кое под Гедиминовой династией простиралось от Балтики до Украины — было и величайшей угрозой Тевтонскому ордену, и величайшей его крестоносной целью. Поражение при Дурбе в 1260 году, катастрофа при Танненберге в 1410 году — Литва неоднократно побеждала орден. Однако с обращением Ягайло в католицизм в 1387 году Литва номинально перестала быть «языческим государством», что запутало оправдание крестового похода. Тем не менее, лишь победив в борьбе за верховенство против Литвы, орден может истинно править Балтикой."
 teu_subdue_poland: "Покори Польшу"
 teu_subdue_poland_desc: "15 июля 1410 года, битва при Танненберге (Грюнвальде) — величайшее поражение в истории Тевтонского ордена. Великий магистр Ульрих фон Юнгинген и цвет рыцарства ордена пали, и сам Мариенбург был осаждён. Второй Торуньский мир 1466 года уступил Западную Пруссию Польше, низведя орден до немногим большего, чем вассал. Отомсти за это унижение — разгроми Польшу, верни утраченные земли и смой позор Танненберга."
 teu_order_or_prussia: "Выбор — крестовый поход или секуляризация"
 teu_order_or_prussia_desc: "В 1511 году, когда Альбрехт Гогенцоллерн стал Великим магистром, орден стоял на перекрёстке выживания. Пока Реформация Лютера 1517 года потрясала Европу, Альбрехт встретился с самим Лютером и избрал секуляризовать орден, основав герцогство Пруссия — в 1525 году. Но что, если орден вместо этого продолжил бы свою крестоносную миссию? Заверши «Северный крестовый поход», покорив православных, язычников и мусульман Востока, или заложи основы современной Пруссии светским княжеством — выбор за тобой."
 teu_crusade_path: "Путь Северного крестового похода"
 teu_crusade_path_desc: "Путь крестового похода — возьми меч именем Бога. Истинное призвание Тевтонского ордена — обращение и завоевание язычников. На востоке ждут православные земли Руси; на балтийском побережье манит союз с Ливонским орденом. Как некогда с завоеванием Пруссии, водрузи крестоносное знамя от восточного берега Балтики до Северной России. Крестоносная индульгенция, дарованная Григорием IX, остаётся вечно действительной — заверши Северный крестовый поход именем Бога и высеки имя Великого магистра в истории."
 teu_path_crusade_chosen_tt: "Выбран путь крестового похода"
 teu_path_secular_chosen_tt: "Выбран путь секуляризации"
 teu_livonian_alliance: "Союз с Ливонским орденом"
 teu_livonian_alliance_desc: "Ливонский орден — наследник Братьев меча, поглощённый Тевтонским орденом в 1237 году. Базируясь в Риге, этот орден контролирует восточное балтийское побережье, но под постоянным давлением Литвы и Руси. Он потерпел поражение от Александра Невского в битве на Чудском озере 1242 года, и сокрушительный удар от Литвы при Дурбе в 1260 году. Ныне выкуй союз с Ливонским орденом и построй совместную систему, дабы вместе править восточной Балтикой — используй силу братского ордена, дабы разгромить врагов Востока."
 teu_crusade_east: "Крестовый поход на Восток"
 teu_crusade_east_desc: "Обрати крестоносный меч на восток — православные «раскольники», языческие «ромувиты», мусульманские «неверные». Все они враги католической веры и цели крестового похода. С 1230-х годов Тевтонский орден вёл «Северный крестовый поход» по землям балтов. Ныне расширь горизонт далее на восток и веди священную войну против сердца восточного православия и последних оплотов балтов. Обращение Литвы в католицизм в 1386 году уменьшило число «законных» целей крестового похода, но православные государства Руси всё ещё остаются."
 teu_riga_crusade: "Рига, крестоносный оплот"
 teu_riga_crusade_desc: "Рига — основанная в 1201 году епископом Альбертом Буксгевденом, этот город — важнейший оплот на восточном балтийском побережье. Долгая борьба за власть бушевала между Ливонским орденом и архиепископом Риги, но если Тевтонский орден сможет объединить город и развить его передовой базой для восточного крестового похода, он станет плацдармом для противостояния Руси. Расположенная в устье Двины, Рига жизненно важна и для торговли, и для войны — обеспечение её устанавливает снабженческую линию для восточного продвижения."
 teu_march_to_orthodox: "Марш на православие"
 teu_march_to_orthodox_desc: "«Еретическая» православная церковь — в глазах католического Рима византийская и русская церкви держали «неверную веру» со времён Великого раскола 1054 года. Новгородская республика, Псков, русские княжества — эти православные государства — истинная цель Северного крестового похода. В 1242 году Александр Невский разгромил Ливонский орден на льду Чудского озера и до сих пор прославляется «героем, победившим крестоносцев». Отомсти за это поражение и водрузи католическое знамя на православной земле — это высшая миссия Тевтонского ордена."
 teu_northern_crusade_final: "Северный крестовый поход завершён"
 teu_northern_crusade_final_desc: "Северный крестовый поход — начавшийся завоеванием Пруссии и простёршийся через восточное балтийское побережье вглубь Руси — наконец близится к завершению. Как некогда пруссы, православные должны быть обращены или покорены. Балтика становится внутренним морем Тевтонского ордена, и знамя Великого магистра реет до восточного края мира. Мечта «Северного крестового похода», унаследованная от Братьев меча XIII века — объединение земель балтов, славян и финнов в священную империю — ныне осуществлена."
 teu_secularize_path: "Путь секуляризации"
 teu_secularize_path_desc: "10 апреля 1525 года в Кракове Альбрехт Гогенцоллерн провозгласил основание герцогства Пруссия вассалом короля Сигизмунда I Польского — секуляризацию Тевтонского ордена. В обмен на обращение в лютеранство земли ордена выживут как светское герцогство. Католические государства негодовали на это «предательство», но растущая волна протестантизма дала ордену новый путь вперёд. Оседлай волну Реформации и, как светский князь, заложи основы современной Пруссии — это новый образ жизни ордена в новую эпоху."
 teu_prussian_duchy: "Герцогство Пруссия"
 teu_prussian_duchy_desc: "Герцогство Пруссия — рождённое секуляризацией в 1525 году — быстро развивалось под гогенцоллерновым правлением. С Кёнигсбергом столицей оно активно способствовало лютеранской Реформации и через Кёнигсбергский университет (основан 1544) именовало себя «Пруссией учёности». Бывшее крестоносное государство ныне преображается в современное герцогство. Построй администрацию, выкуй сотрудничество с дворянами-юнкерами и утверди основы военного государства — первый шаг к будущему Королевству Пруссия и позже Германской империи."
 teu_control_pomerania: "Овладей Померанией"
 teu_control_pomerania_desc: "Померания — простираясь вдоль южного балтийского побережья к западу от Вислы — долго оспаривалась германскими князьями, Данией и Польшей. Герцогство Померания династии Грифичей — малое государство, зажатое между Пруссией и Бранденбургом, но его доступ к Балтике делает его стратегически жизненно важным. Захватив Померанию, Пруссия становится истинным владыкой Балтики. Овладей портом Штеттин (Щецин) и водными путями Одера, и выкуй «северогерманскую ось», связующую Бранденбург и Померанию."
 teu_protestant_reformation: "Протестантская Реформация"
 teu_protestant_reformation_desc: "В 1517 году Мартин Лютер прибил свои Девяносто пять тезисов к дверям церкви в Виттенберге — и волна Реформации ударила прямо по Пруссии. Сам Великий магистр Альбрехт встретился с Лютером и избрал секуляризовать орден. Принятие Пруссией лютеранства стало основой «протестантской лиги» против католических Габсбургов. Активно продвигай Реформацию и модернизируй образование и управление — учёная традиция Кёнигсбергского университета и дисциплинированная бюрократия Пруссии станут краеугольным камнем прусской культуры на поколения вперёд."
 teu_dominate_hre: "Возвысься в Священной Римской империи"
 teu_dominate_hre_desc: "Священная Римская империя — высмеиваемая как «ни священная, ни римская, ни империя» — сложный политический порядок. Как Пруссия проложит в ней путь? Власть габсбургских императоров, соперничество курфюрстов, расколы, причинённые Реформацией — всё это создаёт возможности для возвышения Пруссии. Уния Бранденбурга и Пруссии 1618 года под гогенцоллерновым наследством станет основой позднейшей объединённой Германии. Утверди свой статус курфюрста, расширь своё влияние внутри Империи и возвысь Пруссию соперником Габсбургов и вождём Северной Германии."
 teu_north_german_empire: "Северогерманский союз"
 teu_north_german_empire_desc: "Северогерманская империя — мечта Бисмарка, честолюбие дома Гогенцоллернов. В XVIII веке Фридрих Великий доказал мощь Пруссии в Семилетней войне против Австрии; в XIX Бисмарк объединил Германию «кровью и железом». Но задолго до этого, как государство-наследник Тевтонского ордена, мечта Пруссии объединить всю Северную Германию уже имела долгую историю. Бранденбург, Померания, Мекленбург, Ганновер — сплоти князей Северной Германии и осуществи здесь и сейчас Северогерманский союз, кой станет предвестником современного германского государства."
 teu_malbork_citadel: "Укрепи цитадель Мальборк"
 teu_malbork_citadel_desc: "Мальборкский замок (Мариенбург) — эта обширная кирпичная крепость в дельте Вислы — штаб-квартира Тевтонского ордена. Перенесённая из Венеции в 1309 году, она стоит крупнейшим средневековым кирпичным замком Европы. После поражения при Грюнвальде в 1410 году она была осаждена польскими силами, но удержалась под командованием исполняющего обязанности Великого магистра Генриха фон Плауэна. Стены Мальборка — сам символ государства ордена — укрепить их в неприступный оплот есть основа всякой оборонительной стратегии."
 teu_konigsberg_dev: "Развей Кёнигсберг"
 teu_konigsberg_dev_desc: "Кёнигсберг (нынешний Калининград) — основанный в 1255 году при поддержке короля Оттокара II Богемского, этот город вырос центром прусской колонии. Университет был основан там в 1544 году, позже родиной философа Иммануила Канта. Расположенный в устье Прегеля, этот город — жизненно важный балтийский торговый узел и служил фактической столицей государства ордена. Развей его городскую инфраструктуру, расширь его собор и рынки и дай ему процветать перевалочным пунктом северной и восточноевропейской торговли — укрепление сердца Пруссии есть источник национальной мощи."
 teu_danzig_port: "Развей порт Гданьск"
 teu_danzig_port_desc: "Гданьск — расположенный в устье Вислы, это крупнейший портовый город Балтики. В 1308 году Тевтонский орден «захватил» Гданьск у своих польских союзников и с тех пор дал ему процветать узлом балтийской торговли. Но Второй Торуньский мир 1466 года уступил город Польше, кая ценит его сердцем «Королевской Пруссии». Верни Гданьск, включи его в ганзейскую торговую сеть и максимизируй прибыли балтийской зерновой торговли — этот город, известный «Царицей Балтики», — финансовая артерия ордена."
 teu_teutonic_law: "Тевтонский свод законов"
 teu_teutonic_law_desc: "Кульмское право 1230-х годов (Kulmer Handfeste) — первый правовой свод, дарованный Тевтонским орденом своим колониальным городам. Опираясь на это, прусская правовая система развилась и стала правовой основой германской восточной колонизации. Архиепископский указ 1489 года, прусский свод законов 1529 года — правовое развитие есть средство, коим государство ордена преображается из «варварского завоевателя» в «носителя цивилизации». Упорядочи управление, защити права крестьян и развей торговое право — утверди Пруссию государством, управляемым законом."
 teu_amber_trade: "Захвати янтарную торговлю"
 teu_amber_trade_desc: "Золото Балтики — янтарь. Называемый «золотом Севера» со времён древности, этот самоцвет находится лишь вдоль балтийского побережья и некогда доставлялся вплоть до средиземноморского мира. После завоевания Пруссии Тевтонский орден притязал на монополию янтаря, карая контрабандистов смертью. Эта «янтарная монополия» — один из важнейших источников дохода ордена. Возьми полный контроль над балтийскими янтарьпроизводящими регионами и овладей торговыми путями в Центральную Европу — ибо помимо меча, богатство янтаря — другой источник власти ордена."
 teu_hanseatic_ties: "Узы с Ганзейским союзом"
 teu_hanseatic_ties_desc: "Ганзейский союз — этот союз германских купеческих городов, возглавляемый Любеком, господствует над торговлей Балтики и Северного моря. Гданьск, Рига, Ревель (Таллин) — все эти города — крупные ганзейские узлы, и их территории пересекаются с собственным владением Тевтонского ордена. Ганзейские купцы несли прусское зерно, лес и янтарь в Западную Европу, приносили взамен сукно, вино и соль. Построй тесные узы с Ганзейским союзом и стань действенным владыкой балтийской торговой сети — обеспечь процветание ордена равно мечом и торговлей."
 teu_colonize_prussia: "Колонизируй Пруссию"
 teu_colonize_prussia_desc: "Ostsiedlung — великая историческая миграция немцев, заселявших восток от Эльбы с XI по XIV век. Тевтонский орден стоял в авангарде этого движения, привлекая немецких крестьян, ремесленников и купцов в завоёванную Пруссию. В обмен на исчезновение коренных прусских народов эта земля была колонизирована «германской восточной границей». Плановое градостроительство, земледельческое развитие, дорожное строительство — эти средства, коими «варварская земля» вовлекается в европейскую сферу цивилизации. Заверши колонизацию Пруссии и твёрдо утверди её германской землёй."
 teu_torun_city: "Развей Торунь"
 teu_torun_city_desc: "Торунь — построенная вдоль Вислы, этот город был самым первым оплотом Тевтонского ордена, основанным в 1231 году. «Торуньские договоры» 1454 и 1466 годов определили его отношения с Польшей: первый принёс мир, второй — унизительную уступку территории ордена. В 1473 году здесь родился Коперник — астроном, предложивший гелиоцентрическую теорию. Развей Торунь, колыбель истории ордена, и отстрой его центром вислинской речной торговли."
 teu_memel_fortress: "Укрепи Мемель"
 teu_memel_fortress_desc: "Мемель (Клайпеда) — в устье Немана на литовско-прусской границе этот крепостной городок был построен Тевтонским орденом передовой линией обороны против Литвы. Мемельский замок, основанный в 1252 году, пережил бесчисленные битвы с Литвой. Падёт эта крепость — врата в Пруссию распахнутся; напротив, твёрдое удержание Мемеля есть ключ к пресечению литовского вторжения. Укрепи эти врата к Балтике и пусть они служат внутренним узлом янтарной торговли."
 teu_grand_master: "Гегемония Великого магистра"
 teu_grand_master_desc: "Великий магистр (Hochmeister) — верховный вождь Тевтонского ордена. Как наместник Христа, он ведёт рыцарей-монахов, правящих крестоносной империей, простирающейся от Балтики через всю Восточную Европу. Герман фон Зальца (1209-1239) утвердил политические основы ордена через дипломатию с Фридрихом II, и правление Винриха фон Книпроде (1351-1382) отметило золотой век ордена. Ныне каждый враг покорён, и Северный крестовый поход завершён — власть Великого магистра простирается от Балтики до земель православных. Как Великий магистр, чьё имя будет высечено в истории, принеси волю Бога до самых краёв Востока."
 teu_prussian_king: "Провозглашение Короля Пруссии"
 teu_prussian_king_desc: "Король Пруссии — 18 января 1701 года Фридрих III короновал себя в Кёнигсберге королём Фридрихом I Прусским. Короновав себя в Пруссии (бывших землях Тевтонского ордена), кои лежали вне юрисдикции императора Священной Римской империи, он нашёл хитрый способ притязать на королевский титул без габсбургского одобрения. «Фридрих Великий», Фридрих II, захватил Силезию и выиграл Семилетнюю войну, возвысив Пруссию великой европейской державой. «Пруссия — не страна с армией, но армия со страной» — под этой национальной философией заложи здесь и сейчас основы современной Германии."
 teu_events.10.t: "Будущее ордена — крестовый поход или секуляризация"
 teu_events.10.d: "С покорёнными Литвой и Польшей Тевтонский орден ныне стоит перед историческим выбором. Продолжить ли под крестоносным знаменем, разя язычников и православных Востока — или секуляризоваться в современное княжество и преобразиться в Королевство Пруссия."
 teu_events.10.a: "Путь крестового похода — разгроми язычников и православных Востока и заверши Северный крестовый поход"
 teu_events.10.b: "Путь секуляризации — построй герцогство Пруссия и заложи основы современной Германии"
 teu_events.50.t: "Северный крестовый поход завершён"
 teu_events.50.d: "«Такова воля Бога» — от Балтики до дальних пределов Руси крестовый поход Тевтонского ордена завершён. Крест сияет ярко над северными землями."
 teu_events.50.a: "Да здравствует крестовый поход! Гегемония Великого магистра утверждена!"
 teu_constantinople_fall: "Падение Константинополя"
 teu_constantinople_fall_desc: "С ныне завершённым Северным крестовым походом Тевтонский орден обращает взор на юг. Константинополь, некогда восточный оплот христианства, давно пал в руки еретиков и неверных. Верни этот древний имперский город и подними знамя истинной веры над Золотым Рогом ещё раз. Путь в Святую землю Иерусалим начинается с освобождения этого города."
 teu_jerusalem_reclaimed: "Возвращение Иерусалима"
 teu_jerusalem_reclaimed_desc: "С возвращённым Константинополем финальная цель крестового похода ныне единственна — сама Святая земля Иерусалим. Бесчисленные крестоносцы пытались, и бесчисленные крестоносцы пали на этой земле; ныне настало время, дабы чёрный крест Тевтонского ордена реял здесь. Вознеси молитвы у Храма Гроба Господня и осуществи давнюю мечту христианского мира."
 teu_events.55.t: "Константинополь, наконец наш"
 teu_events.55.d: "Завершив Северный крестовый поход, Тевтонский орден обратил своё копьё на юг. Константинополь, некогда сам символ византийской славы, стал немногим более руин, попираемых еретиками и неверными. Но армии ордена освободили город и вновь подняли крест над Святой Софией. Следующая цель ясна — верни Святую землю Иерусалим."
 teu_events.55.a: "Путь в Святую землю открыт — вперёд, в Иерусалим!"
 teu_events.56.t: "Иерусалим, освобождённый"
 teu_events.56.d: "Мечта, кою крестоносцы преследовали через века, и надежда, кая разбивалась вновь и вновь — возвращение Святой земли Иерусалим наконец осуществлено. Пока знамя Тевтонского ордена реет над Храмом Гроба Господня, весь христианский мир радуется этой победе. Имя Великого магистра будет произноситься навеки рядом с именами великих крестоносных вождей прошлого. Через этот священный триумф доблесть и слава правителя стали бессмертными."
 teu_events.56.a: "С нами Бог! Святая земля освобождена!"
 teu_events.60.t: "Северогерманский союз провозглашён"
 teu_events.60.d: "От Пруссии до Померании и Бранденбурга — вся Северная Германия объединена под прусским знаменем. Заря современного германского государства."
 teu_events.60.a: "Да здравствует Пруссия! Да здравствует Северогерманский союз!"
 teu_events.99.t: "Конечная цель ордена"
 teu_events.99.d: "Миссия Тевтонского ордена исполнена — его имя высечено в истории великой империей, правившей Балтикой."
 teu_events.99.a: "Да здравствует Тевтонский орден!"
 STATIC_MODIFIER_NAME_teu_amber_mod: "Монополия янтарной торговли"
 STATIC_MODIFIER_DESC_teu_amber_mod: "Золото Балтики, янтарь — его монополизированная торговля наполняет казну Тевтонского ордена."
 STATIC_MODIFIER_NAME_teu_christian_mod: "Христианизация Пруссии"
 STATIC_MODIFIER_DESC_teu_christian_mod: "Католическая вера пустила корни по всей Пруссии, утверждая религиозную власть."
 STATIC_MODIFIER_NAME_teu_colonize_mod: "Колонизация Пруссии"
 STATIC_MODIFIER_DESC_teu_colonize_mod: "Поселенцы, прибывающие обозами из-за Эльбы, воздвигают новые деревни на прусской дикой земле."
 STATIC_MODIFIER_NAME_teu_danzig_mod: "Процветание порта Гданьск"
 STATIC_MODIFIER_DESC_teu_danzig_mod: "«Царица Балтики», Гданьск, развита узлом морской торговли ордена."
 STATIC_MODIFIER_NAME_teu_duchy_mod: "Учреждение герцогства Пруссия"
 STATIC_MODIFIER_DESC_teu_duchy_mod: "Секуляризованное герцогство Пруссия организовано современным административным государством."
 STATIC_MODIFIER_NAME_teu_east_crusade_mod: "Крестовый поход на Восток"
 STATIC_MODIFIER_DESC_teu_east_crusade_mod: "С каждой экспедицией в языческие земли братья-рыцари шьют чёрный крест на своих белых плащах и обновляют обеты священной войны."
 STATIC_MODIFIER_NAME_teu_hanseatic_mod: "Узы с Ганзейским союзом"
 STATIC_MODIFIER_DESC_teu_hanseatic_mod: "Ганзейские когги бросают якорь беспрестанно в гаванях Гданьска и Торуни, ищущие янтарь и зерно."
 STATIC_MODIFIER_NAME_teu_hre_mod: "Возвышение внутри СРИ"
 STATIC_MODIFIER_DESC_teu_hre_mod: "Пруссия возвысилась центральной державой внутри Священной Римской империи."
 STATIC_MODIFIER_NAME_teu_konigsberg_mod: "Процветание Кёнигсберга"
 STATIC_MODIFIER_DESC_teu_konigsberg_mod: "Кёнигсберг, сердце Пруссии, процветает городом торговли и учёности."
 STATIC_MODIFIER_NAME_teu_law_mod: "Тевтонский свод законов"
 STATIC_MODIFIER_DESC_teu_law_mod: "Свод ордена, построенный на кульмском праве, завоевал имя судящего город и деревню одной мерой."
 STATIC_MODIFIER_NAME_teu_legacy_mod: "Наследие Тевтонского ордена"
 STATIC_MODIFIER_DESC_teu_legacy_mod: "Портреты Великих магистров в великом зале Мариенбурга несут традицию ордена в каждый уголок его вновь обретённой территории."
 STATIC_MODIFIER_NAME_teu_lithuania_mod: "Покорение Литвы"
 STATIC_MODIFIER_DESC_teu_lithuania_mod: "Линия крепостей, воздвигнутых в лесах Жемайтии, стоит преградой против армий Великого князя Литовского."
 STATIC_MODIFIER_NAME_teu_livonia_mod: "Овладение Ливонией"
 STATIC_MODIFIER_DESC_teu_livonia_mod: "Союз с Ливонским орденом обеспечил контроль над восточным балтийским побережьем."
 STATIC_MODIFIER_NAME_teu_malbork_mod: "Укрепление Мальборка"
 STATIC_MODIFIER_DESC_teu_malbork_mod: "Мальборк укреплён в неприступный оплот, краеугольный камень обороны ордена."
 STATIC_MODIFIER_NAME_teu_memel_mod: "Укрепление Мемеля"
 STATIC_MODIFIER_DESC_teu_memel_mod: "Мемель развит укреплённым портовым городом, обеспечивающим границу против Литвы."
 STATIC_MODIFIER_NAME_teu_orthodox_march_mod: "Марш на православие"
 STATIC_MODIFIER_DESC_teu_orthodox_march_mod: "После многих войн с православными князьями солдаты ордена хорошо знают пути восточной пограничной войны."
 STATIC_MODIFIER_NAME_teu_poland_mod: "Покорение Польши"
 STATIC_MODIFIER_DESC_teu_poland_mod: "Гордость, утраченная в поражении при Грюнвальде, наконец возвращена через победу возмездия."
 STATIC_MODIFIER_NAME_teu_pomerania_mod: "Контроль над Померанией"
 STATIC_MODIFIER_DESC_teu_pomerania_mod: "С портами Померании в руках ни один город на балтийском побережье не может не выказать уважения знамени ордена."
 STATIC_MODIFIER_NAME_teu_protestant_mod: "Протестантская Реформация"
 STATIC_MODIFIER_DESC_teu_protestant_mod: "В Пруссии, принявшей учение Лютера, учёные собираются издалека и отовсюду в коллегиях Кёнигсберга."
 STATIC_MODIFIER_NAME_teu_prussia_mod: "Полное покорение Пруссии"
 STATIC_MODIFIER_DESC_teu_prussia_mod: "Полное покорение Пруссии истребило семена восстания."
 STATIC_MODIFIER_NAME_teu_prussian_kingdom_mod: "Королевство Пруссия"
 STATIC_MODIFIER_DESC_teu_prussian_kingdom_mod: "Современное Королевство Пруссия утверждено владыкой Северной Германии."
 STATIC_MODIFIER_NAME_teu_constantinople_reclaimed_mod: "Возвращение Константинополя"
 STATIC_MODIFIER_DESC_teu_constantinople_reclaimed_mod: "Крест вновь поднят над великой церковью Константинополя, и его свет достигает всего Востока."
 STATIC_MODIFIER_NAME_teu_jerusalem_ruler_mod: "Освободитель Иерусалима"
 STATIC_MODIFIER_DESC_teu_jerusalem_ruler_mod: "Великий магистр, преклонивший колени у Гроба Господня, почитаем народом живым святым, и его имя стало знаменем, ведущим армии."
 STATIC_MODIFIER_NAME_teu_riga_mod: "Рига, крестоносный оплот"
 STATIC_MODIFIER_DESC_teu_riga_mod: "Рига развита торговым, военным и крестоносным центром восточного балтийского побережья."
 STATIC_MODIFIER_NAME_teu_secular_start_mod: "Первый шаг секуляризации"
 STATIC_MODIFIER_DESC_teu_secular_start_mod: "Со дня, как Великий магистр принял герцогскую корону, новый дух современного государства зашевелился в собраниях Пруссии."
 STATIC_MODIFIER_NAME_teu_torun_mod: "Процветание Торуни"
 STATIC_MODIFIER_DESC_teu_torun_mod: "Торунь, родина Коперника, процветает центром вислинской речной торговли."
 teu_mazovia_subjugation: "Покорение Мазовии"
 teu_mazovia_subjugation_desc: "Мазовия — польское коренное сердце, простирающееся вдоль средней Вислы. Эта земля, где позже будет построена Варшава, — врата Польши на восток и главный путь вторжения в Пруссию. Мазовецкое герцогство правилось побочной ветвью польской пястовской династии, пока не было поглощено Королевством Польша в 1526 году с угасанием его правящей линии. Контроль над этой землёй устраняет угрозу с юга и обеспечивает безопасность Пруссии. Сделай богатую пахотную землю бассейна Вислы житницей Тевтонского ордена."
 teu_narva_fortress: "Крепость Нарва"
 teu_narva_fortress_desc: "Нарва — этот крепостной город на реке Нарва на северном побережье Эстонии отмечает стратегическую границу между Ливонией и Россией. За рекой стоит русская крепость Ивангород — истинная точка столкновения цивилизаций. Проданная Тевтонскому ордену Данией вместе с северной оконечностью Эстонии в 1346 году, Нарва служит передовой базой для восточного крестового похода. В 1558 году ей суждено ненадолго пасть перед силами Ивана Грозного — но измени эту судьбу здесь и сейчас. Укрепи Нарву в неприступный оплот и держи давление на православную Россию."
 teu_berlin_dev: "Развитие Берлина"
 teu_berlin_dev_desc: "Берлин — этот малый городок при слиянии рек Шпрее и Хафель был основан в XIII веке как города-близнецы (Берлин и Кёльн) маркграфом Бранденбурга. Пока это лишь малое седалище гогенцоллерновых курфюрстов Бранденбурга, но как только Пруссия объединится с Бранденбургом, этому месту суждено стать имперской столицей. С личной унией Бранденбурга-Пруссии 1618 года и основанием Королевства Пруссия в 1701 году Берлин стал сердцем Северной Германии. Заложи эту основу ныне — развитие Берлина породит город, символизирующий объединение Северной Германии."
 teu_junker_system: "Учреждение юнкерской системы"
 teu_junker_system_desc: "Юнкер — по-немецки «молодой господин», этот термин относится к военизированному землевладельческому дворянству Пруссии. Владея обширными поместьями (Gutsherrschaft) к востоку от Эльбы, юнкеры использовали крепостной труд для производства зерна на вывоз в Западную Европу через Балтику. Но их истинная роль была военной — юнкеры заполняли большинство офицерских должностей прусской армии, образуя самое ядро «Пруссии как военного государства». Фридрих Вильгельм I («Король-солдат») принудительно посылал юнкеров в военные академии, институционализировав их военную обязанность. Учреди юнкерскую систему ныне и заложи основу «прусской военной культуры», кая продлится поколениями."
 teu_silesia_claim: "Овладей Силезией"
 teu_silesia_claim_desc: "Силезия — простираясь вдоль верхнего Одера, этот регион держит потенциал стать величайшей промышленной зоной Центральной Европы, богатой углём, железной рудой и цинком. Некогда часть польских пястовских владений, она попала под Королевство Богемия после 1335 года и стала частью Австрии через габсбургское наследование Богемии в 1526 году. Но в 1740 году Фридрих Великий начал молниеносное вторжение в Силезию в самом начале Войны за австрийское наследство, захватив эту богатую землю «силой». Возьми Силезию ныне для Пруссии — её промышленная мощь станет экономической основой прусской империи."
 teu_cathedral_network: "Сеть соборов"
 teu_cathedral_network_desc: "Сеть соборов по всей Пруссии — Тевтонский орден всегда строил церкви на завоёванной земле. Кёнигсбергский собор, замковая капелла Мариенбурга, церковь Святого Иоанна в Торуни — все были орудиями, дабы насадить католическую веру на языческой почве. Организация приходской системы, учреждение епископств, постройка монастырей — эти институциональные средства, коими «варварские земли» вовлекаются в христианскую цивилизацию. Собор есть и деяние служения Богу, и символ колониального правления. Утверди сеть соборов по всей Пруссии и укрепи религиозную власть и легитимность правления Тевтонского ордена."
 teu_elbing_dev: "Развитие Эльбинга"
 teu_elbing_dev_desc: "Эльбинг (Эльблонг) — основанный в 1237 году на восточном краю дельты Вислы, этот город — один из важнейших портов Пруссии наряду с Гданьском, и важный член Ганзейского союза. Связанный с Кёнигсбергом внутренними водными путями, он процветал экспортным портом зерна, леса и янтаря. Как и Гданьск, он попал под польский контроль после Второго Торуньского мира (1466), но для Пруссии полный контроль над дельтой Вислы незаменим выходом к морю. Развей Эльбинг и утверди парную систему великих балтийских портов наряду с Гданьском."
 STATIC_MODIFIER_NAME_teu_mazovia_mod: "Мазовия покорена"
 STATIC_MODIFIER_DESC_teu_mazovia_mod: "Мазовия покорена, обеспечивая южную границу."
 STATIC_MODIFIER_NAME_teu_narva_mod: "Крепость Нарва"
 STATIC_MODIFIER_DESC_teu_narva_mod: "Нарва укреплена в неприступный оплот на востоке."
 STATIC_MODIFIER_NAME_teu_berlin_mod: "Развитие Берлина"
 STATIC_MODIFIER_DESC_teu_berlin_mod: "Берлин развит столицей Пруссии."
 STATIC_MODIFIER_NAME_teu_junker_mod: "Юнкерская система"
 STATIC_MODIFIER_DESC_teu_junker_mod: "Юнкеры, укоренённые в своих поместьях к востоку от Эльбы, поддерживают королевство равно офицерами и чиновниками."
 STATIC_MODIFIER_NAME_teu_silesia_mod: "Силезия завоёвана"
 STATIC_MODIFIER_DESC_teu_silesia_mod: "Станки и рудники Силезии придают новый пульс финансам Пруссии."
 STATIC_MODIFIER_NAME_teu_cathedral_mod: "Сеть соборов"
 STATIC_MODIFIER_DESC_teu_cathedral_mod: "Соборы построены по всей Пруссии, и католическая вера пустила корни."
 STATIC_MODIFIER_NAME_teu_elbing_mod: "Процветание порта Эльбинг"
 STATIC_MODIFIER_DESC_teu_elbing_mod: "Эльбинг развит крупным балтийским портовым городом."
 teu_mongol_empire: "Монгольский оплот пал"
 teu_mongol_empire_desc: "Сарай, Казань, Самарканд, Каффа, Дайду, Каракорум — один за другим великие столицы Монгольской империи, кая некогда потрясала мир, пали под чёрно-крестовым знаменем. «Великая монгольская нация», основанная Чингисханом в 1206 году, раздробилась к концу XIII века, и её прежняя слава давно минула. В то, что остаётся от её владений, железные армии Тевтонского ордена маршируют и с востока, и с запада равно, покоряя владык степи. От Тихого океана на востоке до Балтики на западе — всё монгольское наследие захвачено империей креста."
 teu_sacred_nomads: "Престол Великого хана узурпирован"
 teu_sacred_nomads_desc: "С покорённой всей Монгольской империей Великий магистр ныне притязает для себя на титул, коего степные народы страшатся превыше всего — «хан» — как военный трофей. Это не слияние и не сосуществование; это просто завоеватель, восседающий на престоле побеждённого. Тяжёлая конница, несущая крест, стала владыками того, что некогда было самой страшимой ордой на земле. Объедини империи Востока и Запада волей Бога — это окончательная победа Тевтонского ордена."
 teu_events.70.t: "Монгольские столицы, наши"
 teu_events.70.d: "Сарай, Казань, Самарканд, Каффа, Дайду, Каракорум — каждая столица Монгольской империи пала. С этого дня Великий магистр именует себя «германским Великим ханом», но не как наследник монгольской крови или культуры. Это не более, чем завоеватель, захватывающий титул побеждённого знаком собственной власти. Pax Deus — мир Бога — ныне сменяет то, что некогда было владычеством степи."
 teu_events.70.a: "Монгольские владения наконец наши!"
 teu_events.80.t: "Железный крест правит миром"
 teu_events.80.d: "Как финальный акт завоевания Монгольской империи Тевтонский орден полностью привёл и восточную, и западную империи под собственное правление. Народы степи покоряются, и новый порядок навязан под властью креста. Это не слияние, но чистое завершение завоевания — орден остаётся орденом и стал владыкой величайшей империи земли."
 teu_events.80.a: "Волей Бога мир наш!"
 STATIC_MODIFIER_NAME_teu_mongol_empire_mod: "Покорение монголов"
 STATIC_MODIFIER_DESC_teu_mongol_empire_mod: "Военная машина Монгольской империи захвачена — всадники степи ныне служат под тевтонским командованием."
 STATIC_MODIFIER_NAME_teu_sacred_nomads_mod: "Престол Великого хана"
 STATIC_MODIFIER_DESC_teu_sacred_nomads_mod: "Правя владыкой того, что некогда было мировой империей — монголы совершенно покорены Тевтонским орденом."
 teu_great_khan_name: "Германский Великий ханат"
 teu_events.11.t: "Обет Северного крестового похода"
 teu_events.11.d: "Врата на Восток открыты — с покорёнными Литвой и Польшей настало время Тевтонскому ордену принять историческое решение. Каждый рыцарь клянётся пред властью Великого магистра: «Волей Бога мы уничтожим язычников и православных Востока и завершим Северный крестовый поход». Этот обет становится управляющим принципом государства Тевтонского ордена, и чем выше его легитимность, тем больше его дисциплина и порядок."
 teu_events.11.a: "Клянёмся — волей Бога заверши Северный крестовый поход!"
 teu_steppe_crusade: "Крестовый поход степи"
 teu_steppe_crusade_desc: "Понтийская степь — некогда сердце Монгольской империи, бескрайнее пастбище, правимое татарами. Ныне, с тяжёлой конницей Тевтонского ордена, слитой с лёгкой конницей монгольского стиля, завоюй эту степь и утверди верховенство над всей Восточной Европой. Кто правит степью, тот правит Восточной Европой — докажи эту истину силой Тевтонского ордена."
 STATIC_MODIFIER_NAME_teu_steppe_crusade_mod: "Крестовый поход степи"
 STATIC_MODIFIER_DESC_teu_steppe_crusade_mod: "Конные братья-рыцари, скачущие сквозь ветра степи, сделали даже пути войны кочевников своими собственными."
 STATIC_MODIFIER_NAME_teu_crusade_loot_mod: "Крестоносная добыча"
 STATIC_MODIFIER_DESC_teu_crusade_loot_mod: "Добыча крестового похода истощила землю: поля лежат под паром, деревни стоят пустыми, и народ ждёт лучших дней."
