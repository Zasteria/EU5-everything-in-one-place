l_russian:
 gae_gaelic_ireland_mission_pack: "Гэльский ирландский контрудар"
 gae_gaelic_ireland_mission_pack_DESCRIPTION:0 "Английское владычество шатается среди чумы и вторжения Брюса — будучи гэльским вождём, возглавь возрождение, заяви права на трон Верховного короля, чтобы объединить Ирландию, и наконец пересеки море, дабы завоевать саму Англию."
 gae_gaelic_ireland_mission_pack_CRITERIA_DESCRIPTION:0 "Объедини клан, стань Верховным королём над всей Ирландией и завоюй Англию."
 gae_gaelic_ireland_mission_pack_BUTTON_TOOLTIP:0 "От разделённого клана к Верховному королю, покорившему Англию."
 gae_gaelic_ireland_mission_pack_BUTTON_DETAILS:0 "Подними гэльское знамя над Изумрудным островом — и за морем тоже!"
 gae_gaelic_resurgence: "Гэльское возрождение"
 gae_gaelic_resurgence_desc: "Среди хаоса Чёрной смерти и вторжения Брюса английское колониальное владычество шатается — эпоха гэльских лордов вновь возвращается на этот остров."
 gae_brehon_law: "Соблюдай Брегонское право"
 gae_brehon_law_desc: "Брегонское право, правовая традиция, не подчинённая ни римскому, ни английскому обычаю — сохрани эту древнюю систему как основу правления."
 gae_fili_and_bards: "Филиды и барды"
 gae_fili_and_bards_desc: "Филиды, учёные поэты, хранящие историю и родословную клана — покровительствуй их искусству, и пусть честь клана воспевается из поколения в поколение."
 gae_gallowglass_recruitment: "Наймите галлогласов"
 gae_gallowglass_recruitment_desc: "Грозные воины с шотландских островов — прими этих «галлогласов» в свои ряды и укрепи мощь клана."
 gae_clan_unification: "Объедини клан"
 gae_clan_unification_desc: "Разделённые побочные ветви и оспариваемые земли — собери их воедино и утверди свою власть как вождь."
 gae_lord_of_the_clan: "Владыка клана"
 gae_lord_of_the_clan_desc: "Закон, поэзия, оружие и единая родословная — построй на всём этом, и встань истинным владыкой клана."
 gae_rout_the_settlers: "Обрати поселенцев в бегство"
 gae_rout_the_settlers_desc: "Английские поселенцы, чьи ряды поредели от чумы — воспользуйся этой возможностью и изгони их с этой земли."
 gae_ostmen_towns: "Города остменов"
 gae_ostmen_towns_desc: "Портовые города, давно основанные потомками викингов, остменами — захвати такие города, как Дублин и Уотерфорд."
 gae_resurgence_triumphant: "Триумф возрождения"
 gae_resurgence_triumphant_desc: "Обращение поселенцев в бегство и захват городов остменов — гэльское возрождение достигает здесь своего первого триумфа."
 gae_ulster_hegemony: "Гегемония над Ольстером"
 gae_ulster_hegemony_desc: "Ольстер, северная земля О’Нейллов и О’Доннеллов — установи гегемонию над этим краем."
 gae_connaught_hegemony: "Гегемония над Коннахтом"
 gae_connaught_hegemony_desc: "Коннахт, дикая земля запада — как наследник славы О’Конноров, правь этим краем."
 gae_munster_hegemony: "Гегемония над Манстером"
 gae_munster_hegemony_desc: "Манстер на юге, земля Маккарти и О’Брайенов — захвати гегемонию над этим богатым краем."
 gae_leinster_hegemony: "Гегемония над Ленстером"
 gae_leinster_hegemony_desc: "Ленстер, граничащий с самим Пейлом — установи гегемонию над этим стратегически важным краем."
 gae_high_king_of_ireland: "Верховный король Ирландии"
 gae_high_king_of_ireland_desc: "Древний титул Ард Ри, Верховного короля, дремлющий на холме Тара — превзойди эпоху раздробленности и возроди этот самый почётный ранг."
 gae_conquer_the_pale: "Завоюй Пейл"
 gae_conquer_the_pale_desc: "Пейл, последний плацдарм Англии с центром в Дублине — приведи эту землю в гэльские руки."
 gae_expel_the_english: "Изгони англичан"
 gae_expel_the_english_desc: "Последние остатки английской власти, ещё цепляющиеся за этот остров — сметите их совершенно."
 gae_master_of_the_emerald_isle: "Владыка Изумрудного острова"
 gae_master_of_the_emerald_isle_desc: "Трон Верховного короля, завоевание Пейла и полное изгнание англичан — Ирландия воистину вновь стала гэльской."
 gae_gaelic_fleet: "Построй гэльский флот"
 gae_gaelic_fleet_desc: "Чтобы пересечь море к самой Англии — построй могучий флот и обрати свой взор на родину прежних захватчиков."
 gae_invade_wales: "Вторгнись в Уэльс"
 gae_invade_wales_desc: "Уэльс, земля родственной кельтской крови — высадись на этих берегах и обеспечь плацдарм против Англии."
 gae_war_on_england: "Война против Англии"
 gae_war_on_england_desc: "Настало время повернуть историю вспять — брось вызов Англии, прежнему захватчику, лицом к лицу."
 gae_conquest_of_england: "Завоевание Англии завершено"
 gae_conquest_of_england_desc: "Родина тех, кто некогда попирал этот остров — эта самая земля теперь лежит под властью гэльского короля. История здесь совершенно перевёрнута."
 gae_events.1.t: "Верховный король возведён на трон"
 gae_events.1.d: "На холме Тара, согласно древнему обычаю, провозглашён новый Верховный король. Эпоха раздробленности здесь подходит к концу."
 gae_events.1.a: "Слава Верховному королю!"
 gae_events.2.t: "Владыка Изумрудного острова"
 gae_events.2.d: "С падением Пейла и полным изгнанием англичан этот остров наконец воистину вновь стал гэльским."
 gae_events.2.a: "Слава Ирландии!"
 gae_events.99.t: "Завоевание Англии завершено"
 gae_events.99.d: "Родина Англии, некогда попиравшая этот остров, теперь преклоняет колени перед троном гэльского короля. История совершенно перевёрнута."
 gae_events.99.a: "История перевёрнута!"
 STATIC_MODIFIER_NAME_gae_resurgence_mod: "Гэльское возрождение"
 STATIC_MODIFIER_DESC_gae_resurgence_mod: "Раз чума поредила население поселенцев, язык и обычаи этой земли вновь распространяются по стране."
 STATIC_MODIFIER_NAME_gae_brehon_mod: "Брегонское право соблюдено"
 STATIC_MODIFIER_DESC_gae_brehon_mod: "Память о прецедентах, передаваемых поколениями брегонских законников, повелевает большим доверием, чем любой писаный свод."
 STATIC_MODIFIER_NAME_gae_bards_mod: "Филиды и барды"
 STATIC_MODIFIER_DESC_gae_bards_mod: "Ученики-филиды по-прежнему проводят семь лет, запечатлевая в памяти родословную и деяния клана."
 STATIC_MODIFIER_NAME_gae_gallowglass_mod: "Галлогласы наняты"
 STATIC_MODIFIER_DESC_gae_gallowglass_mod: "Воины с топорами, пересёкшие море с Гебрид, ныне составляют ядро постоянной силы клана."
 STATIC_MODIFIER_NAME_gae_clan_mod: "Клан объединён"
 STATIC_MODIFIER_DESC_gae_clan_mod: "Соседние вожди, связанные браком и договором, теперь смотрят поверх старых распрей на общего врага."
 STATIC_MODIFIER_NAME_gae_lord_clan_mod: "Владыка клана"
 STATIC_MODIFIER_DESC_gae_lord_clan_mod: "Избранный по древнему обычаю танистри, этот вождь ныне повелевает мечами каждой побочной ветви."
 STATIC_MODIFIER_NAME_gae_rout_settlers_mod: "Поселенцы обращены в бегство"
 STATIC_MODIFIER_DESC_gae_rout_settlers_mod: "Усадьбы поселенцев, поредевших от чумы, стоят заброшенными, одна за другой возвращаясь в дикую природу."
 STATIC_MODIFIER_NAME_gae_ostmen_mod: "Города остменов"
 STATIC_MODIFIER_DESC_gae_ostmen_mod: "С причалов, где трудятся потомки норманнской крови, беспрестанно отплывают корабли, гружённые кожей и шерстью."
 STATIC_MODIFIER_NAME_gae_triumphant_mod: "Триумф возрождения"
 STATIC_MODIFIER_DESC_gae_triumphant_mod: "После полувека отступления английская колония отброшена к простой полосе побережья."
 STATIC_MODIFIER_NAME_gae_ulster_mod: "Гегемония над Ольстером"
 STATIC_MODIFIER_DESC_gae_ulster_mod: "Под именем О’Нейлл ныне стоят собранные воины из девяти графств севера."
 STATIC_MODIFIER_NAME_gae_connaught_hegemony_mod: "Гегемония над Коннахтом"
 STATIC_MODIFIER_DESC_gae_connaught_hegemony_mod: "Как наследники крови О’Конноров, аулы кланов, обитающих в западных пустошах, воспринимаются как должное."
 STATIC_MODIFIER_NAME_gae_munster_mod: "Гегемония над Манстером"
 STATIC_MODIFIER_DESC_gae_munster_mod: "От холмов Дециес до порта Корк богатство щедрого юга наполняет казну."
 STATIC_MODIFIER_NAME_gae_leinster_mod: "Гегемония над Ленстером"
 STATIC_MODIFIER_DESC_gae_leinster_mod: "Гэльские сборщики податей ныне подходят прямо к самому рву Пейла."
 STATIC_MODIFIER_NAME_gae_conquer_pale_mod: "Пейл завоёван"
 STATIC_MODIFIER_DESC_gae_conquer_pale_mod: "Английское знамя, некогда развевавшееся над шпилями Дублинского замка, наконец спущено."
 STATIC_MODIFIER_NAME_gae_expel_english_mod: "Англичане изгнаны"
 STATIC_MODIFIER_DESC_gae_expel_english_mod: "Чужеземное владычество над этим островом, начавшееся во дни Генриха II, наконец пришло к полному концу."
 STATIC_MODIFIER_NAME_gae_fleet_mod: "Гэльский флот построен"
 STATIC_MODIFIER_DESC_gae_fleet_mod: "Гэльские мореходы, прежде страшившиеся лишь как разбойники, ныне повелевают собственным настоящим флотом."
 STATIC_MODIFIER_NAME_gae_war_england_mod: "Война против Англии"
 STATIC_MODIFIER_DESC_gae_war_england_mod: "Война, которую они принесли на этот остров полтора века назад, ныне обрушивается на их собственную землю."
 STATIC_MODIFIER_NAME_gae_high_king_mod: "Верховный король Ирландии"
 STATIC_MODIFIER_DESC_gae_high_king_mod: "Престол Ард Ри, пустовавший со дней Брайана Бору, вновь обрёл хозяина на холме Тара."
 STATIC_MODIFIER_NAME_gae_emerald_isle_mod: "Владыка Изумрудного острова"
 STATIC_MODIFIER_DESC_gae_emerald_isle_mod: "От берега до берега не осталось ни одного чужеземного чиновника на этом острове."
 STATIC_MODIFIER_NAME_gae_conquest_england_mod: "История перевёрнута"
 STATIC_MODIFIER_DESC_gae_conquest_england_mod: "На троне, некогда захваченном самозваными завоевателями, ныне восседает гэльский король."
