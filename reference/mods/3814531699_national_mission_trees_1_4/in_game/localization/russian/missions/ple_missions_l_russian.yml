l_russian:
 ple_english_pale_mission_pack: "Пейл — от плацдарма короны до Королевства Ирландия"
 ple_english_pale_mission_pack_DESCRIPTION:0 "Узкое английское Пейл вокруг Дублина — протяни руку англо-норманнским лордам, завоюй гэльские земли и основай королевство, правящее всей Ирландией."
 ple_english_pale_mission_pack_CRITERIA_DESCRIPTION:0 "Упрочи Пейл, завоюй всю Ирландию и основай королевство."
 ple_english_pale_mission_pack_BUTTON_TOOLTIP:0 "От малого плацдарма до королевства, правящего всем Зелёным островом."
 ple_english_pale_mission_pack_BUTTON_DETAILS:0 "«Более ирландский, чем сами ирландцы» — водрузи знамя Пейла над всей Ирландией!"
 ple_english_pale: "Английское Пейл"
 ple_english_pale_desc: "Узкая прибрежная полоса вокруг Дублина — это последний плацдарм английской королевской власти посреди обширного гэльского моря."
 ple_dublin_castle: "Развей Дублинский замок"
 ple_dublin_castle_desc: "Дублинский замок, построенный в 1204 году — упрочь далее этот центр английского правления в Ирландии."
 ple_pale_defense: "Укрепи Пейл"
 ple_pale_defense_desc: "Земляные валы и рвы, защищающие Пейл от гэльских набегов — укрепи эту оборонительную линию, известную как «Ров»."
 ple_lord_deputy: "Лорд-депутат Ирландии"
 ple_lord_deputy_desc: "Лорд-депутат, кой правит Ирландией наместником английского короля — сделай эту должность несокрушимой."
 ple_anglo_irish_parliament: "Англо-ирландский парламент"
 ple_anglo_irish_parliament_desc: "Ирландский парламент, созываемый в Дроэде или Дублине — заставь это собрание англо-ирландских лордов и городских представителей действовать."
 ple_pale_consolidated: "Пейл упрочен"
 ple_pale_consolidated_desc: "Укрепления, лорд-депутат, закон и парламент — построй на всём этом и сделай правление Пейла несокрушимым."
 ple_hiberno_norman_lords: "Англо-норманнские лорды"
 ple_hiberno_norman_lords_desc: "Англо-норманнские лорды, о коих говорят, что они «более англичане, чем сами англичане» — построй отношения с ними."
 ple_fitzgerald_kildare: "Фицджеральды Килдэра"
 ple_fitzgerald_kildare_desc: "«Вся Ирландия не может править графом Килдэра» — так говорили. Построй отношения с этим могущественным домом."
 ple_butler_ormond: "Батлеры Ормонда"
 ple_butler_ormond_desc: "Батлеры Ормонда, соперники Килдэров — построй отношения с этим домом, преданным короне."
 ple_statutes_of_kilkenny: "Килкеннийские статуты"
 ple_statutes_of_kilkenny_desc: "Изданные в 1367 году, Килкеннийские статуты — приведи в исполнение этот закон, запрещающий английским поселенцам «огэльчиваться»."
 ple_gaelic_frontier_wars: "Гэльские пограничные войны"
 ple_gaelic_frontier_wars_desc: "Гэльские лорды, окружающие Пейл — встань перед лицом непрестанной войны этой границы."
 ple_conquer_leinster: "Завоюй Ленстер"
 ple_conquer_leinster_desc: "Ленстер, лежащий к югу от Пейла — приведи этот регион в наше владение."
 ple_conquer_munster: "Завоюй Манстер"
 ple_conquer_munster_desc: "Манстер, сфера графа Десмонда — завоюй этот богатый регион."
 ple_conquer_connacht: "Завоюй Коннахт"
 ple_conquer_connacht_desc: "Коннахт, простирающийся в западных пустошах — приведи это пограничье под наш контроль."
 ple_conquer_ulster: "Завоюй Ольстер"
 ple_conquer_ulster_desc: "Ольстер, северная земля упрямейшего гэльского сопротивления — завоюй этот регион."
 ple_master_of_ireland: "Владыка Ирландии"
 ple_master_of_ireland_desc: "Ленстер, Манстер, Коннахт и Ольстер — правь всеми ими и встань истинным владыкой Ирландии."
 ple_reformation_choice: "Выбор Реформации"
 ple_reformation_choice_desc: "Учения Лютера и Кальвина пересекают море — стоя на этом перекрёстке веры, какой путь мы изберём?"
 ple_church_of_ireland: "Церковь Ирландии"
 ple_church_of_ireland_desc: "Церковь Ирландии, связанная с Церковью Англии — утверди эту новую веру орудием правления."
 ple_recusant_catholics: "Католики-рекузанты"
 ple_recusant_catholics_desc: "«Рекузанты», отказывающиеся отречься от верности Риму — прими их веру опорой правления."
 ple_dublin_university: "Университет Дублина"
 ple_dublin_university_desc: "Седалище учёности Дублина, воплощённое Тринити-колледжем — развей это место центром учёности."
 ple_english_crown_relations: "Отношения с английской короной"
 ple_english_crown_relations_desc: "Английская корона за морем — взвесь наши отношения с этим сюзереном, ибо они определят наше будущее."
 ple_kingdom_of_ireland: "Королевство Ирландия провозглашено"
 ple_kingdom_of_ireland_desc: "Путь, начавшийся малым плацдармом Пейла, приносит здесь плод королевством, правящим всей Ирландией — но каким путём пойдёт это новое королевство, остаётся нерешённым."
 ple_events.99.t: "Провозглашение Королевства Ирландия"
 ple_events.99.d: "Долгая история, начавшаяся малым плацдармом Дублина, вступает здесь в новую эпоху королевством, правящим всей Ирландией."
 ple_events.99.a: "Слава Ирландии!"
 ple_defy_the_crown: "Вызов короне"
 ple_defy_the_crown_desc: "Королевство Ирландия более не просто слуга Англии — сделай этот разрыв первым шагом к истинному суверенитету."
 ple_war_of_irish_independence: "Война за независимость Ирландии"
 ple_war_of_irish_independence_desc: "Неизбежная война с короной за морем — выиграй эту войну за независимость и разбей цепи."
 ple_sovereign_kingdom_of_ireland: "Суверенная Ирландия"
 ple_sovereign_kingdom_of_ireland_desc: "Истинно независимое Королевство Ирландия, не подвластное ни одной короне — Зелёный остров наконец становится хозяином собственной судьбы."
 ple_loyal_crown_partnership: "Партнёрство с короной"
 ple_loyal_crown_partnership_desc: "Партнёрство, не соперничество — Королевство Ирландия избирает союз равных с английской короной."
 ple_anglo_irish_union: "Англо-ирландская уния"
 ple_anglo_irish_union_desc: "Через тесные политические узы два королевства делают шаг к более глубокой унии."
 ple_united_kingdoms: "Партнёр в унии"
 ple_united_kingdoms_desc: "Избрав партнёрство вместо соперничества, Королевство Ирландия стоит партнёром в унии рядом с Англией и возводит эпоху общего процветания."
 STATIC_MODIFIER_NAME_ple_pale_mod: "Английское Пейл"
 STATIC_MODIFIER_DESC_ple_pale_mod: "Со времён Генриха II эта земля остаётся единственным опорным пунктом английской короны за морем."
 STATIC_MODIFIER_NAME_ple_dublin_mod: "Дублинский замок развит"
 STATIC_MODIFIER_DESC_ple_dublin_mod: "Древняя викингская гавань ныне оживлена как седалище правления и торговли в Ирландии."
 STATIC_MODIFIER_NAME_ple_defense_mod: "Пейл укреплён"
 STATIC_MODIFIER_DESC_ple_defense_mod: "Внутри земляных валов и рвов «Пейла» крестьяне возделывают свои поля, не страшась внезапных гэльских набегов."
 STATIC_MODIFIER_NAME_ple_lord_deputy_mod: "Лорд-депутат"
 STATIC_MODIFIER_DESC_ple_lord_deputy_mod: "Депутат, сидящий в Дублинском замке вместо короля за морем, внушает уважение даже великим лордам."
 STATIC_MODIFIER_NAME_ple_parliament_mod: "Англо-ирландский парламент"
 STATIC_MODIFIER_DESC_ple_parliament_mod: "Голоса горожан, собранных внутри замковых стен, ныне несут больший вес в государственных делах."
 STATIC_MODIFIER_NAME_ple_consolidated_mod: "Пейл упрочен"
 STATIC_MODIFIER_DESC_ple_consolidated_mod: "Дублин более не чужой анклав, но истинное коренное сердце, вписанное в собственные книги короны."
 STATIC_MODIFIER_NAME_ple_norman_lords_mod: "Англо-норманнские лорды"
 STATIC_MODIFIER_DESC_ple_norman_lords_mod: "Норманнские лорды в своих замках так глубоко укоренены в этой земле, что говорят, они «более ирландцы, чем сами ирландцы»."
 STATIC_MODIFIER_NAME_ple_kilkenny_mod: "Килкеннийские статуты"
 STATIC_MODIFIER_DESC_ple_kilkenny_mod: "Изданный в 1367 году, этот закон запрещает поселенцам принимать ирландский язык или гэльские обычаи."
 STATIC_MODIFIER_NAME_ple_frontier_wars_mod: "Гэльские пограничные войны"
 STATIC_MODIFIER_DESC_ple_frontier_wars_mod: "Бесчисленные стычки за рвом Пейла закалили солдат для войн границы."
 STATIC_MODIFIER_NAME_ple_leinster_mod: "Ленстер завоёван"
 STATIC_MODIFIER_DESC_ple_leinster_mod: "Житницы Ленстера, соседствующие с Пейлом, ныне вписаны в собственные налоговые книги короны."
 STATIC_MODIFIER_NAME_ple_munster_mod: "Манстер завоёван"
 STATIC_MODIFIER_DESC_ple_munster_mod: "Из портов Манстера, некогда владения графа Десмонда, отплывают корабли, гружённые шерстью и шкурами, без конца."
 STATIC_MODIFIER_NAME_ple_connacht_mod: "Коннахт завоёван"
 STATIC_MODIFIER_DESC_ple_connacht_mod: "Даже кланы дикого Коннахта ныне следуют призыву короны к оружию."
 STATIC_MODIFIER_NAME_ple_ulster_mod: "Ольстер завоёван"
 STATIC_MODIFIER_DESC_ple_ulster_mod: "Упрямый север, долго удерживаемый О’Нейллами и О’Доннеллами, наконец покорился королевскому знамени."
 STATIC_MODIFIER_NAME_ple_master_ireland_mod: "Владыка Ирландии"
 STATIC_MODIFIER_DESC_ple_master_ireland_mod: "От Ленстера до Ольстера весь Зелёный остров ныне лежит под единым знаменем."
 STATIC_MODIFIER_NAME_ple_reformation_mod: "Выбор Реформации"
 STATIC_MODIFIER_DESC_ple_reformation_mod: "Учения Лютера и Кальвина, принесённые через море, посылают тихие волны через церкви этого острова."
 STATIC_MODIFIER_NAME_ple_church_ireland_mod: "Церковь Ирландии"
 STATIC_MODIFIER_DESC_ple_church_ireland_mod: "В часовнях новой церкви, связанной с Кентербери, ныне громко читается английская Библия."
 STATIC_MODIFIER_NAME_ple_recusant_mod: "Католики-рекузанты"
 STATIC_MODIFIER_DESC_ple_recusant_mod: "Обложенные штрафами, но непокорённые, «рекузанты» продолжают свои тихие молитвы к Риму."
 STATIC_MODIFIER_NAME_ple_university_mod: "Университет Дублина"
 STATIC_MODIFIER_DESC_ple_university_mod: "Вдоль дворов Тринити-колледжа ныне звучат шаги нового поколения учёных."
 STATIC_MODIFIER_NAME_ple_crown_relations_mod: "Отношения с английской короной"
 STATIC_MODIFIER_DESC_ple_crown_relations_mod: "Каждое письмо, прибывающее со двора за морем, тихо формирует судьбу этого королевства."
 STATIC_MODIFIER_NAME_ple_kingdom_ireland_mod: "Королевство Ирландия"
 STATIC_MODIFIER_DESC_ple_kingdom_ireland_mod: "Вновь коронованный король Ирландии ныне восседает на престоле внутри Дублинского замка."
 STATIC_MODIFIER_NAME_ple_defy_crown_mod: "Вызов короне"
 STATIC_MODIFIER_DESC_ple_defy_crown_mod: "Среди тех, кто сбросил верность короне за морем, распространяется неукротимый пыл."
 STATIC_MODIFIER_NAME_ple_irish_independence_war_mod: "Война за независимость Ирландии"
 STATIC_MODIFIER_DESC_ple_irish_independence_war_mod: "Бесчисленные столкновения с войском, посланным через море, выковали солдат этого острова в опытных тактиков."
 STATIC_MODIFIER_NAME_ple_sovereign_ireland_mod: "Суверенная Ирландия"
 STATIC_MODIFIER_DESC_ple_sovereign_ireland_mod: "Знамя истинно свободной Ирландии, не обязанное ни одной короне, ныне реет с башен Дублинского замка. Наместники, посланные в каждый уголок страны, возводят административные жилы суверенного государства."
 STATIC_MODIFIER_NAME_ple_loyal_partnership_mod: "Партнёрство с короной"
 STATIC_MODIFIER_DESC_ple_loyal_partnership_mod: "Избрав доверие вместо соперничества, послы двух корон ныне пересекают море чаще, чем когда-либо."
 STATIC_MODIFIER_NAME_ple_anglo_irish_union_mod: "Англо-ирландская уния"
 STATIC_MODIFIER_DESC_ple_anglo_irish_union_mod: "Через неустанный труд послов, служащих двору за морем, две короны связаны теснее, чем когда-либо прежде."
