l_russian:
 bur_crown_of_lothair_mission_pack: "Корона Лотаря"
 bur_crown_of_lothair_mission_pack_DESCRIPTION:0 "1337 год: начинается Столетняя война. Герцогство Бургундия, зажатое между Францией и Англией, обладает хитростью и средствами, дабы играть на противостоянии обеих сторон — и в конце концов возродить Лотарингию, древнее Срединное царство наследников Карла Великого. Обеспечь двор в Дижоне, учреди Орден Золотого руна и господствуй во фламандской суконной торговле; затем проведи государство через войну между Англией и Францией, дабы извлечь наибольшие уступки, прежде чем объединить Фландрию, Франш-Конте и Лотарингию в новое «Королевство Лотарингия»."
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION:0 "Как Бургундия, проведи государство через Столетнюю войну, укрепи внутреннее устройство и восстанови Лотарингию."
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы заявить права на Корону Лотаря."
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS:0 "Выживи между Англией и Францией — а затем превзойди обеих!"
 bur_duchy_of_burgundy: "Честолюбие герцогства"
 bur_duchy_of_burgundy_desc: "1337 год: дом Валуа-Бургундия восходит побочной ветвью французского королевского дома. Играя Англией и Францией друг против друга, герцогство стремится расшириться во Фландрию, Франш-Конте и Лотарингию. Столетняя война — редчайшая возможность для этого малого герцогства стать великой державой."
 bur_court_of_dijon: "Двор Дижона"
 bur_court_of_dijon_desc: "Бургундский двор в Дижоне был одним из самых блистательных в Европе XV века. Ян ван Эйк и Рогир ван дер Вейден трудились под бургундским покровительством, а герцогская библиотека соперничала с любой во Франции. Это «Северное Возрождение» avant la lettre было построено на доходах от фламандского сукна и безграничном честолюбии герцога."
 bur_flemish_cloth: "Фламандская суконная промышленность"
 bur_flemish_cloth_desc: "Треугольник Брюгге, Гента и Ипра был величайшим промышленным регионом средневековой Европы. Английская шерсть отправлялась во Фландрию, обрабатывалась искусными мастерами в тонкое сукно и продавалась по всей Европе на шампанских ярмарках. Эта цепочка поставок была экономическим хребтом Бургундии."
 bur_golden_fleece: "Орден Золотого руна"
 bur_golden_fleece_desc: "Основанный в Брюгге в 1430 году Филиппом Добрым, Орден Золотого руна был самым престижным рыцарским орденом католического христианского мира — членство было зарезервировано для монархов и великих князей. Основанный на легенде о Ясоне и аргонавтах, знак ордена (подвеска золотого руна) оставался высшей честью вплоть до XIX века."
 bur_estates_general: "Генеральные штаты"
 bur_estates_general_desc: "Как составное государство, правящее над Фландрией, Брабантом и Франш-Конте — каждое со своими правовыми традициями — Бургундии требовались представительные учреждения для действенного правления. Генеральные штаты объединили три сословия из разных областей в единую совещательную структуру."
 bur_feast_of_pheasants: "Пир фазана"
 bur_feast_of_pheasants_desc: "В 1454 году, потрясённый падением Константинополя, Филипп Добрый устроил в Лилле «Пир фазана» — самый пышный пир Средневековья. Рыцари приносили крестоносные обеты над живым фазаном; сам Филипп поклялся последовать за своим королём в Святую землю. Крестовый поход так и не состоялся, но пир закрепил репутацию Бургундии как стража христианского рыцарства."
 bur_balance_of_power: "Между двух царств"
 bur_balance_of_power_desc: "Дипломатический гений Бургундии заключался в её положении уравновешивающей силы. Французский вассал по феодальному праву, связанный с Империей своими восточными землями, и возможный английский союзник — Бургундия могла склонить чашу весов Столетней войны в любую сторону. Этот рычаг был основой бургундской власти."
 bur_ally_england: "Союз с Англией"
 bur_ally_england_desc: "После убийства Иоанна Бесстрашного на мосту Монтеро в 1419 году Бургундия бросила свой вес на сторону Англии. Последовавший Труаский договор (1420) объявил Генриха V наследником французской короны — исход, немыслимый без бургундской поддержки. Бургундско-английский союз был одним из решающих военных партнёрств Столетней войны."
 bur_treaty_of_troyes: "Труаский договор"
 bur_treaty_of_troyes_desc: "Труаский договор, поддержанный Бургундией, сделал Генриха V регентом и наследником Франции. Обеспечение Реймса (где короновались французские короли) и Парижа (столицы) делает Бургундию фактическим владыкой Франции — высшее оправдание английского союза."
 bur_ally_france: "Примирение с Францией"
 bur_ally_france_desc: "На Аррасском конгрессе 1435 года Филипп Добрый сменил сторону — оставив Англию и примирившись с Карлом VII. Взамен Бургундия получила формальное освобождение от вассальной присяги и уступку стратегических городов. Этот дипломатический поворот сделал Бургундию окончательным победителем Столетней войны."
 bur_treaty_of_arras: "Дух Арраса"
 bur_treaty_of_arras_desc: "Аррасский договор (1435) стал величайшим дипломатическим триумфом Бургундии — Карл VII был унижен до публичного извинения, в то время как Филипп ушёл с территориальными приобретениями и отменённой присягой. Используя эту передышку, Бургундия могла сосредоточиться на укреплении Лотарингии и завершении Срединного царства."
 bur_flanders_in_the_war: "Фландрия в Столетней войне"
 bur_flanders_in_the_war_desc: "Графство Фландрия было одной из наиболее ожесточённо оспариваемых территорий Столетней войны. Англия поставляла шерсть фламандским суконным городам и держала там сильное экономическое влияние; фламандские города часто принимали сторону Англии против Франции. Однако Франция притязала на графа Фландрии как на вассала. Бургундия, зависимая от доходов фламандского сукна, должна была вовлечь этот ключевой регион в свою орбиту."
 bur_integrate_brabant: "Путь на Брюссель"
 bur_integrate_brabant_desc: "Антверпен, торговая столица Брабанта, к концу XV века станет величайшим торговым городом Северной Европы. Дом печати Плантена, торговля алмазами, испанский обмен серебром — всё сосредоточено здесь. Обеспечение Брабанта завершает бургундское овладение Нижними землями."
 bur_integrate_franche_comte: "Захвати Доль"
 bur_integrate_franche_comte_desc: "Доль, столица Франш-Конте, был домом Дольского университета (основан в 1422 году) — поддерживаемого бургундским герцогским домом. Обеспечение этого города означает действенный контроль над всей Франш-Конте и открывает путь к Лотарингии."
 bur_expand_into_lorraine: "Расширься в Лотарингию"
 bur_expand_into_lorraine_desc: "Нанси был столицей герцогства Лотарингия. Карл Смелый погиб в битве при Нанси в 1477 году, одержимый этим городом — здесь игрок пишет иной финал. Захват Нанси открывает путь на Люксембург и обеспечивает бургундский коридор между Нидерландами и коренными землями."
 bur_crown_of_lothair: "Корона Лотаря"
 bur_crown_of_lothair_desc: "В 843 году Верденский договор создал Лотарингию — Срединное царство, простиравшееся от Фландрии до Италии вдоль Рейна. Поглощённое Францией и Германией по Мерсенскому договору 870 года, это королевство исчезло из истории на тысячу лет. Ныне дом Бургундии восстанавливает то, что не смогли удержать Каролинги: не Францию, не Германию, но нечто новое — возрождение каролингского центра."
 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "Двор Дижона"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "Бургундский двор в Дижоне привлёк Яна ван Эйка, Рогира ван дер Вейдена и лучших музыкантов и поэтов эпохи — сделав его культурной столицей Северной Европы и первопроходцем фламандской живописной традиции, кою суждено было преобразить западное искусство."
 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "Фламандская суконная промышленность"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "Суконный треугольник Брюгге, Гента и Ипра был двигателем крупнейшей промышленной экономики средневековой Европы. Фламандские сукна были эталоном качества по всей Европе, и контроль над этой промышленностью дал Бургундии финансовые средства, кои соперничали с любым королевством."
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "Орден Золотого руна"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "Основанный в 1430 году, Орден Золотого руна был самой исключительной честью христианского мира — список его членов читался как перекличка европейского монаршества. Дарование руна давало Бургундии дипломатический рычаг равно над королями и императорами."
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "Генеральные штаты"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "Генеральные штаты Бургундии объединили три сословия из Фландрии, Брабанта и коренной Бургундии в единое совещательное собрание — раннюю модель представительного правления, повлиявшую на позднейшую Нидерландскую республику и французские революционные органы."
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "Обет фазана"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "На величайшем пиру Средневековья Филипп Добрый поклялся над живым фазаном возглавить крестовый поход против османов. Обет так и не был исполнен, но зрелище провозгласило Бургундию первейшей рыцарской державой христианского мира и углубило её узы с папством."
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "Между двух царств"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "Играя роль уравновешивающей силы между Англией и Францией, Бургундия отказывается от полного подчинения обоим сюзеренам и использует двусмысленность своих феодальных обязательств. Хаос Столетней войны создаёт превосходную возможность построить независимую военную мощь, держа обе стороны на расстоянии."
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "Английский союз"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "После Монтеро Бургундия и Англия образовали самое значимое военное партнёрство Столетней войны. Вместе они заняли Париж и почти пресекли линию Валуа — лишь вмешательство Жанны д’Арк обратило прилив вспять."
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "Труаский договор"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "Труаский договор, поддержанный Бургундией, сделал Генриха V наследником Франции — высшую точку англо-бургундской власти. Опираясь на этот триумф, Бургундия утверждает себя истинным правителем французского королевства."
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "Французский союз"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "Аррасский конгресс (1435) стал дипломатическим шедевром Бургундии — покидая Англию в момент наибольшего рычага и извлекая унизительные уступки у отчаявшегося Карла VII. Бургундия вышла незаменимым партнёром окончательного французского победителя."
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "Аррасский договор"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "В Аррасе Филипп Добрый извлёк формальное извинение у Карла VII и обрёл территорию, отказавшись от требования личной присяги. Это сделало Бургундию фактически независимой, оставаясь номинально в французском феодальном порядке — совершенный дипломатический исход."
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "Корона Лотаря"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "Утраченное в 870 году, Королевство Лотарингия возрождено спустя тысячу лет. От Фландрии до Франш-Конте, от Лотарингии до коренной Бургундии, дом Бургундии собрал воедино Срединное царство, кое не смогли удержать внуки Карла Великого. У Европы есть новый центр тяжести."
 bur_events.1.t: "Честолюбие герцогства Бургундия"
 bur_events.1.d: "1337 год: первые выстрелы Столетней войны вот-вот прогремят. Эдуард III Английский настаивает на своём притязании на французский престол — но Бургундия наблюдает со своей особой точки зрения между двумя гигантами. Побочная ветвь французского дома Валуа, однако владеющая могучей Фландрией, элитной рыцарской традицией и доходами, кои сравнятся с любым королевством — Бургундия есть та ось, вокруг коей повернётся эта война. От великолепного двора в Дижоне до кипящих суконных залов Брюгге и Гента, герцогство лелеет величайшие честолюбия любой державы Европы. Вопрос в том, чью сторону поддержать — или не поддерживать ли ни одну вовсе."
 bur_events.1.a: "Бургундия изберёт собственный путь между Англией и Францией!"
 bur_events.2.t: "Пир фазана"
 bur_events.2.d: "В Лилле в 1454 году герцог Филипп устроил самый необычайный пир Средневековья. Живой фазан был внесён в зал, украшенный золотым ожерельем; перед ним собранные рыцари Бургундии приносили крестоносные обеты именем Бога, Девы и самого фазана. Филипп поклялся последовать за своим королём в Святую землю. Сценические механизмы создавали часовню, корабль и замок на обеденных столах. Жонглёры, поэты и музыканты соперничали за внимание. Крестовый поход так и не состоялся — но никто в Европе не сомневался, что Бургундия — первейший страж рыцарской доблести христианского мира."
 bur_events.2.a: "Клянёмся пред Богом и Фазаном защищать христианский мир!"
 bur_events.3.t: "Корона Лотаря"
 bur_events.3.d: "В 843 году Верденский договор разделил империю Карла Великого между тремя его внуками. Средняя часть — простиравшаяся от Фландрии до Италии вдоль Рейна — досталась Лотарю I и стала «Лотарингией». В 870 году Мерсенский договор стёр её, разделив между Францией и Германией. Тысячу лет Срединное царство было не более чем воспоминанием — призраком, преследующим границы Франции и Империи. Ныне дом Бургундии, хитростью и оружием, восстановил то, что не смогли удержать Каролинги. Пусть же Корона Лотаря перейдёт к своему законному наследнику."
 bur_council_of_mechelen: "Великий совет Мехелена"
 bur_council_of_mechelen_desc: "Советники Филиппа Доброго учредили в Мехелене «Великий совет» с юрисдикцией над всеми бургундскими землями — верховный суд, стоящий над отдельными правовыми традициями Фландрии, Брабанта и Франш-Конте. Это было институциональным краеугольным камнем истинной централизации."
 bur_siege_of_calais: "Кале захвачен"
 bur_siege_of_calais_desc: "Кале был последним оплотом Англии на французском материке — удерживаемым с 1347 по 1558 год. Знаменитые «Граждане Кале» Родена увековечивают его героическую сдачу. Захват этого стратегического порта даёт Бургундии контроль над переправой через пролив и максимизирует ценность английского союза."
 bur_hainaut_namur: "Унаследуй Эно и Намюр"
 bur_hainaut_namur_desc: "Филипп Добрый купил Намюр в 1421 году и унаследовал Эно в 1433 году — завершив сухопутный мост между Фландрией и Брабантом. Эти графства с их суконными городами и стратегическими речными переправами составляли соединительную ткань Бургундских Нидерландов."
 bur_holland_zeeland: "Голландия и Зеландия"
 bur_holland_zeeland_desc: "Графства Голландия и Зеландия — с их сельдяными промыслами, новыми торговыми городами вроде Амстердама и превосходными гаванями — были приобретены Филиппом Добрым в 1428 году. Эти земли станут коренными землями Нидерландской республики; под Бургундией они — двигатель североморской торговой империи."
 bur_luxemburg: "Люксембург"
 bur_luxemburg_desc: "Филипп Добрый завоевал герцогство Люксембург в 1443 году после похода против Сигизмунда из рода Габсбургов. Одна из сильнейших крепостей Империи, Люксембург был восточным якорем Бургундских Нидерландов — и вратами в Лотарингию и Эльзас."
 bur_dominate_rhine: "Рейн"
 bur_dominate_rhine_desc: "Рейн был хребтом европейской цивилизации от Рима до наших дней. Удержать реку от Нидерландов до Эльзаса — значит удержать коренные земли Карла Великого — Рейнланд, где управлялась Каролингская империя, где возвышались соборные города, где сходились величайшие торговые пути Средневековья."
 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "Великий совет Мехелена"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "Великий совет в Мехелене был ответом Бургундии на проблему управления составным государством с расходящимися правовыми традициями. Создавая верховный суд над фламандским, брабантским и бургундским правом равно, советники Филиппа построили институциональную основу истинной централизации."
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "Свободный порт Кале"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "Кале, в самой узкой точке Ла-Манша, был ключевым транзитным узлом, связующим торговлю Северного моря, Балтики и Средиземноморья со времён древности. Англия удерживала его более двух веков именно ради этой торговой ценности. Ныне Бургундия развивает Кале в первейший суконно-торговый порт Северной Европы."
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "Люксембург"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "Крепость-герцогство Люксембург, одна из сильнейших позиций Империи, дало Бургундии её восточный якорь. Его приобретение в 1443 году завершило окружение долины Мааса и открыло путь к Лотарингии и Эльзасу."
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "Рейн"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "От дельты до виноградников Рейн ныне бургундский. Величайшая река коренных земель Каролингов, торговый путь средневековой Европы, граница между цивилизацией и лесом — всё под единым флагом."
 bur_join_hre: "Вступи в Священную Римскую империю"
 bur_join_hre_desc: "У Бургундии есть возможность быть формально признанной князем Священной Римской империи. Двойной статус — вассал Франции и имперский князь — придал бы Бургундии уникально мощное дипломатическое положение. В 1473 году Карл Смелый вёл переговоры с Фридрихом III в Трире о возвышении в «Королевство Бургундия» внутри Империи — лишь дабы Император отступил в последний миг. Ныне возможность приходит вновь."
 bur_franchecomte_fiefdom: "Брак с Франш-Конте"
 bur_franchecomte_fiefdom_desc: "В XIII веке дом Бургундии выковал глубокие узы с графами Франш-Конте через брак. Герцог Одон IV Бургундский женился на графине Матильде Артуа и обеспечил верность Франш-Конте Бургундии. Соляные копи, железная руда и Дольский университет этого «Вольного графства» делают его жизненно важными вратами для бургундской экспансии на восток, к Швейцарии и Лотарингии."
 bur_events.4.t: "Священная Римская империя"
 bur_events.4.d: "Бургундия всегда занимала пограничное положение — вассал Франции по феодальному праву, однако связанный с Империей через свои восточные земли. Милость Императора открывает путь к формальному членству. В 1473 году Карл Смелый встретился с Фридрихом III в Трире и вёл переговоры о статусе «Королевство Бургундия» внутри Империи — лишь дабы Император на рассвете взошёл на свою барку и уплыл прочь, не подписав. Ныне, с достаточно тёплыми отношениями, врата вновь открыты."
 bur_events.4.a: "Вступить в Империю и стать имперским князем"
 bur_events.4.b: "Сохранить нашу независимость пока"
 bur_events.5.t: "Брак с Франш-Конте"
 bur_events.5.d: "В XIII веке бургундский герцог Одон IV женился в графский дом Франш-Конте, связав это богатое «Вольное графство» с Бургундией кровью. Соляные копи Юры, железные кузни, Дольский университет и горные перевалы, контролирующие пути в Швейцарию и Лотарингию — всё это поколениями было частью бургундского мира. Настало время формализовать то, что уже создал брак."
 bur_events.5.a: "Использовать брачные узы, дабы принять Франш-Конте как пожалованного вассала"
 bur_events.5.b: "Сохранить брачные узы, уважая их автономию"
 bur_events.6.t: "Фландрия в Столетней войне"
 bur_events.6.d: "Графство Фландрия занимает своеобразное положение в Столетней войне. Фламандское суконное производство не может функционировать без английской шерсти, и богатые горожане Брюгге, Гента и Ипра ценят свои торговые отношения с Англией превыше всего. Франция притязает на графа как на вассала, но фламандские горожане сопротивляются французскому владычеству и неоднократно принимали сторону Англии. Вовлекая Фландрию в бургундскую орбиту, герцог может использовать богатство этих суконных городов. Выбор: пожаловать Фландрию бургундским вассалом, либо углубить узы, уважая её независимость."
 bur_events.6.a: "Принять Фландрию бургундским вассалом"
 bur_events.6.b: "Уважать независимость Фландрии, углубляя союз"
 bur_nevers_union: "Уния с Невером"
 bur_nevers_union_desc: "Графство Невер лежит к югу от Фландрии и имеет исторические узы с бургундским герцогским домом. С прочно удержанной Фландрией, установление притязания на Невер расширяет сферу влияния Бургундии на юг. Земли между Фландрией и Невером образуют коридор для будущей экспансии во Францию."
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "Нижние земли объединены"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "Торговая сеть Нижних земель — связующая Голландию, Зеландию, Брабант и Фландрию — объединена. Торговая мощь Антверпена и Амстердама, составляющая основу позднейшего голландского Золотого века."
 bur_events.3.a: "Восстать как восстановленное Королевство Лотарингия"
 bur_events.3.b: "Остаться Бургундией и заявить императорский титул (сохранение статус-кво)"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "Лотарингия возрождена"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "Королевство Лотарингия, наследник Средней Франции, возрождено через шесть веков после своего падения в 869 году. Наследник империи Карла Великого, это королевство признано третьей императорской державой, стоящей между Священной Римской империей и Королевством Франция."
