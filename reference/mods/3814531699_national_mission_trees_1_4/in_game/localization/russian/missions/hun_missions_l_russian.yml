l_russian:
 hun_crown_of_saint_stephen_mission_pack: "Корона Святого Стефана"
 hun_crown_of_saint_stephen_mission_pack_DESCRIPTION:0 "В 1337 году Королевством Венгрия правит король Карл I (Кароль Роберт) из анжуйской династии. Его наследник, блистательный Людовик — позже известный как Людовик Великий — ждёт своего часа, с личной унией с Польшей, грядущей в следующем поколении. Это царство, сосредоточенное в Карпатской котловине, лелеет честолюбия во всех направлениях: на север через Польшу и Богемию, на юг на Балканы, на восток против османов и на запад к Адриатике. Построй Чёрную армию, принеси Возрождение в Буду и встань Оплотом христианского мира."
 hun_crown_of_saint_stephen_mission_pack_CRITERIA_DESCRIPTION:0 "Как Венгрия, расширься на север через Польшу и Богемию, обеспечь Балканы, разгроми османов, достигни Адриатики и заверши внутренние реформы."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы восстановить славу Короны Святого Стефана."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_DETAILS:0 "От анжуйской династии до эпохи Матьяша Корвина — величайшие дни Венгрии ждут!"
 hun_crown_of_st_stephen: "Корона Святого Стефана"
 hun_crown_of_st_stephen_desc: "Святой Стефан I основал Королевство Венгрия в 1000 году от Р.Х., проведя обращение в христианство. Корона Святого Стефана — Священная корона — остаётся священным символом венгерского королевского достоинства по сей день. В 1337 году анжуйская династия держит эту корону и правит величайшим королевством Центральной Европы. Обеспечь Буду и Эстергом и упрочи основы царства."
 hun_angevin_diplomacy: "Анжуйская дипломатия"
 hun_angevin_diplomacy_desc: "Анжуйская династия Венгрии имеет сложные династические узы с Неаполем, Польшей и Богемией. Мать Людовика I, Елизавета, была сестрой польского короля Казимира III, открывая перспективу наследования польской короны. Построй сеть союзов и подними анжуйское дипломатическое влияние по всей Центральной Европе."
 hun_polish_union: "Личная уния с Польшей"
 hun_polish_union_desc: "Когда Казимир III Великий умер без наследника мужского пола в 1370 году, его племянник Людовик I стал королём Польши, наряду с Венгрией. Эта венгеро-польская личная уния стала началом могучей двойной монархии в Центральной Европе. Два великих королевства под одним королём — баланс сил в Центральной Европе резко смещается."
 hun_bohemian_ambitions: "Богемские честолюбия"
 hun_bohemian_ambitions_desc: "Королевство Богемия, рассадник гуситской ереси, терзаемо религиозными смутами. Пока Анжу, Люксембурги и Габсбурги соперничают за богемскую корону, Венгрия также имеет законное притязание. Захват Праги создаёт венгеро-богемскую двойную монархию в сердце Центральной Европы."
 hun_lord_of_the_north: "Владыка Севера"
 hun_lord_of_the_north_desc: "Захват Кракова и Гданьска расширяет венгерское владычество до Балтийского моря, создавая обширную центральноевропейскую империю от Адриатики до Балтики. Слава пястовской и анжуйской династий Польши возрождается под венгерской короной."
 hun_conquer_serbia: "Завоюй Сербию"
 hun_conquer_serbia_desc: "Королевство Сербия стало османским вассалом после битвы на Косовом поле (1389). Но для Венгрии Белград (Нандорфехервар) — незаменимый ключ к обороне Дуная. В 1440 году легендарная защита Белграда Скандербегом и Яношем Хуньяди от османов — пусть эта битва свершится здесь."
 hun_subjugate_wallachia: "Покори Валахию"
 hun_subjugate_wallachia_desc: "Валахия (Хавашалфёлд) исторически признавала венгерский сюзеренитет. Влад II — отец Влада Колосажателя — получил Орден Дракона от венгерского короля Сигизмунда. Твёрдо утверди это буферное государство под венгерским влиянием."
 hun_subjugate_moldavia: "Покори Молдавию"
 hun_subjugate_moldavia_desc: "Молдавия лежит между дельтой Дуная и Польшей, оспариваемая Венгрией, Польшей и османами. Приведение этого княжества твёрдо под венгерский сюзеренитет обеспечивает восточную границу."
 hun_danube_fortress_line: "Дунайская крепостная линия"
 hun_danube_fortress_line_desc: "Система вегвар — пограничная крепостная сеть Венгрии — была самой утончённой антиосманской оборонительной структурой Европы XV века. Десятки крепостей вдоль Дуная сообщались друг с другом, образуя линию раннего предупреждения и обороны, кая останавливала османские наступления насмерть. Эта система сделала Венгрию истинным первым щитом христианства."
 hun_order_of_the_dragon: "Орден Дракона"
 hun_order_of_the_dragon_desc: "Орден Дракона был рыцарским орденом, основанным королём Сигизмундом Венгерским в 1408 году. Влад II, Скандербег и Янош Хуньяди были среди его членов. Этот орден сплотил венгерское дворянство под знаменем антиосманского крестового похода, воплощая миссию христианского стража."
 hun_crusade_preparations: "Приготовления к крестовому походу"
 hun_crusade_preparations_desc: "Янош Хуньяди был величайшим антиосманским крестоносцем XV века. Его Долгий поход 1442-43 годов отбросил османов, дав христианству надежду. Но битва при Варне в 1444 году уничтожила польско-венгерское крестоносное войско. На сей раз выступи подготовленным."
 hun_battle_of_nicopolis: "Битва при Никополе"
 hun_battle_of_nicopolis_desc: "В 1396 году крестоносное войско под королём Сигизмундом Венгерским было сокрушено в битве при Никополе — бедствии, кое закрепило османское господство над Балканами. Но на сей раз всё иначе — полностью подготовленная Венгрия захватывает Никополь и открывает дверь к отвоеванию Балкан. Имя Хуньяди звучит по всей Европе."
 hun_black_army: "Чёрная армия"
 hun_black_army_desc: "Чёрная армия (Fekete Sereg), созданная королём Матьяшем Корвином около 1458 года, была самой передовой профессиональной военной силой современной ей Европы — слиянием наёмников и постоянных войск в чёрных доспехах, агрессивно принявших огнестрельное оружие. Несмотря на огромные издержки содержания, эта армия страшила и османов, и Габсбургов равно. Она есть ключ к венгерской гегемонии."
 hun_bulwark_of_christendom: "Оплот христианского мира"
 hun_bulwark_of_christendom_desc: "Веками Венгрия сражалась на передовой линии христианства против Османской империи. Ныне, когда османы полностью изгнаны из Европы, папа, император и князья Европы осыпают короля Венгрии высшей честью: Antemurale Christianitatis — Оплотом христианского мира."
 hun_croatian_union: "Уния с Хорватией"
 hun_croatian_union_desc: "Со времён Pacta Conventa 1102 года Хорватия находится в личной унии с Венгрией — хорватские дворяне приняли венгерского короля своим собственным в обмен на широкую автономию. Укрепи эту историческую унию и обеспечь врата Венгрии к Адриатике."
 hun_reclaim_dalmatia: "Верни Далмацию"
 hun_reclaim_dalmatia_desc: "Далматинское побережье было частью венгеро-хорватского королевства, пока Венеция не купила его в 1409 году. Возвращение Сплита и Рагузы (Дубровник) восстанавливает гарантированный доступ к Адриатике и открывает путь в Италию."
 hun_adriatic_supremacy: "Верховенство над Адриатикой"
 hun_adriatic_supremacy_desc: "Настало время положить конец давней монополии Венеции над Адриатикой — «Невестой Адриатики». Венгеро-хорватский флот поднимет свой флаг над Адриатическим морем."
 hun_angevin_naples: "Анжуйское притязание на Неаполь"
 hun_angevin_naples_desc: "Анжуйская династия Венгрии держит притязание на неаполитанский престол. Людовик I занимал Неаполь дважды, в 1347 и 1350 годах. Настало время осуществить анжуйское притязание навсегда — пусть король Венгрии правит Неаполем вечно."
 hun_strengthen_estates: "Укрепи сословия"
 hun_strengthen_estates_desc: "Венгерские дворяне и духовенство обрели обширные привилегии в Золотой булле (Aranybulla) 1222 года. Опираясь на эту традицию сословной политики, завоевание поддержки дворянства и духовенства укрепляет королевскую легитимность. Но остерегайся — чрезмерные уступки причинят проблемы позже. Сохрани верное равновесие."
 hun_tripartitum: "Трипартитум"
 hun_tripartitum_desc: "Трипартитум, составленный Иштваном Вербёци в 1514 году, был систематической кодификацией венгерского обычного права. Он определял дворянские привилегии, крестьянские обязанности и королевскую власть. Этот свод законов стал основой венгерского права — хотя его кодификация крепостничества также способствовала крестьянскому восстанию Дьёрдя Дожи 1514 года."
 hun_matthias_reforms: "Реформы короля Матьяша"
 hun_matthias_reforms_desc: "Король Матьяш Корвин (правил 1458-90), прозванный «Справедливым», был величайшим из венгерских королей. Централизованное налогообложение, профессиональная Чёрная армия и агрессивное принятие культуры Возрождения преобразили Венгрию в сильнейшее государство Центральной Европы."
 hun_buda_renaissance: "Возрождение Буды"
 hun_buda_renaissance_desc: "Двор короля Матьяша ввёз итальянское Возрождение в Венгрию. Bibliotheca Corviniana в Будайском дворце хранила тысячи латинских и греческих рукописей, привлекая учёных и художников со всей Европы. Этот культурный расцвет делает Венгрию культурным центром Центральной Европы."
 hun_great_hungary: "Великая Венгрия"
 hun_great_hungary_desc: "Балканы, Польша, Богемия, Далмация — Королевство Венгрия выросло в великую империю далеко за пределами Карпатской котловины. Чёрная армия, ренессансный двор Буды, дунайская крепостная линия — всё это вместе создало Венгрию более могущественную, чем когда-либо прежде."
 hun_glory_of_st_stephen: "Слава Короны Святого Стефана"
 hun_glory_of_st_stephen_desc: "Королевство Венгрия, основанное Святым Стефаном тысячу лет назад, стало великой империей, господствующей над Центральной Европой и Балканами. От Балтики на севере до Адриатики и Средиземноморья на юге, от Карпат до востока — Корона Святого Стефана сияет невиданным блеском. Прославленная как Оплот христианства, слава Венгрии достигла своей абсолютной вершины."
 hun_events.99.t: "Слава Короны Святого Стефана"
 hun_events.99.d: "Королевство Святого Стефана — некогда заключённое в Карпатской котловине — ныне простирается от Балтики до Адриатики и Средиземноморья. Польша, Богемия и Хорватия объединены под венгерской короной; османы изгнаны с Балкан; анжуйское притязание на Неаполь осуществлено. Ренессансный двор Буды прославлен по всей Европе; Чёрной армии страшится каждый враг. Корона Святого Стефана сияет величайшим блеском за всю тысячелетнюю историю."
 hun_events.99.a: "Святой Стефан, мы осуществили твою мечту!"
 STATIC_MODIFIER_NAME_hun_angevin_prestige_mod: "Анжуйский престиж"
 STATIC_MODIFIER_DESC_hun_angevin_prestige_mod: "В 1308 году анжуйский принц Карл (Кароль Роберт) унаследовал венгерский престол. Родовые узы этой династии связали Венгрию с Неаполем, Сицилией, Провансом и Польшей, вбросив Венгрию в центр европейской дипломатии. Папский двор в Авиньоне и Габсбурги в Вене не могли позволить себе игнорировать этот анжуйский двор."
 STATIC_MODIFIER_NAME_hun_angevin_diplomacy_mod: "Анжуйская дипломатическая сеть"
 STATIC_MODIFIER_DESC_hun_angevin_diplomacy_mod: "Письма от анжуйских принцесс, выданных замуж от Неаполя до Польши, прибывают беспрестанно ко двору в Вишеграде."
 STATIC_MODIFIER_NAME_hun_bohemian_crown_mod: "Корона Богемии"
 STATIC_MODIFIER_DESC_hun_bohemian_crown_mod: "С обеспеченной богемской короной венгеро-польско-богемская тройная монархия образована."
 STATIC_MODIFIER_NAME_hun_northern_lord_mod: "Владыка Севера"
 STATIC_MODIFIER_DESC_hun_northern_lord_mod: "С доступом к Балтике Венгрия стала великой державой, контролирующей ключевую северную и восточноевропейскую торговлю."
 STATIC_MODIFIER_NAME_hun_wallachian_buffer_mod: "Валашское буферное государство"
 STATIC_MODIFIER_DESC_hun_wallachian_buffer_mod: "Валахия действует венгерским буферным государством, обеспечивая восточную границу."
 STATIC_MODIFIER_NAME_hun_moldavian_buffer_mod: "Молдавское буферное государство"
 STATIC_MODIFIER_DESC_hun_moldavian_buffer_mod: "Молдавия под венгерским влиянием даёт двойной слой обеспечения восточной границы."
 STATIC_MODIFIER_NAME_hun_vegvar_system_mod: "Крепостная система вегвар"
 STATIC_MODIFIER_DESC_hun_vegvar_system_mod: "Организованная крепостная сеть вдоль Дуная систематически блокирует османские наступления. Венгрия становится передовым щитом христианства."
 STATIC_MODIFIER_NAME_hun_dragon_order_mod: "Орден Дракона"
 STATIC_MODIFIER_DESC_hun_dragon_order_mod: "Орден Дракона короля Сигизмунда объединяет дворянство и войско в едином деле. Он становится духовным хребтом антиосманского крестового похода."
 STATIC_MODIFIER_NAME_hun_crusade_zeal_mod: "Крестоносный пыл"
 STATIC_MODIFIER_DESC_hun_crusade_zeal_mod: "Пыл крестового похода, собравшегося под знамёнами Яноша Хуньяди, всё ещё горит в сердцах солдат."
 STATIC_MODIFIER_NAME_hun_black_army_mod: "Чёрная армия"
 STATIC_MODIFIER_DESC_hun_black_army_mod: "Fekete Sereg — Чёрная армия — созданная Матьяшем Корвином, была самой современной военной силой современной ей Европы: десятки тысяч наёмников и постоянных войск, облачённых в чёрные доспехи. Построенная вокруг ядра гуситских рыцарей из Богемии, она агрессивно принимала огнестрельное оружие и страшилась равно османами и Габсбургами. Разорительная стоимость напрягала королевскую казну — но без этой армии Венгрия не могла бы выжить среди таких гигантов."
 STATIC_MODIFIER_NAME_hun_christendom_bulwark_mod: "Оплот христианского мира"
 STATIC_MODIFIER_DESC_hun_christendom_bulwark_mod: "Изгнав османов из Европы, Венгрия несёт честь Antemurale Christianitatis."
 STATIC_MODIFIER_NAME_hun_adriatic_coast_mod: "Адриатическое побережье обеспечено"
 STATIC_MODIFIER_DESC_hun_adriatic_coast_mod: "Возвращение Далмации даёт Венгрии прямой доступ к Адриатическому морю."
 STATIC_MODIFIER_NAME_hun_angevin_italy_mod: "Анжуйская Италия"
 STATIC_MODIFIER_DESC_hun_angevin_italy_mod: "Венгерские Анжу господствуют над Южной Италией через Неаполь."
 STATIC_MODIFIER_NAME_hun_golden_bull_mod: "Традиция Золотой буллы"
 STATIC_MODIFIER_DESC_hun_golden_bull_mod: "Сословная система, наследующая дух Золотой буллы 1222 года, поддерживает стабильность царства."
 STATIC_MODIFIER_NAME_hun_tripartitum_mod: "Трипартитум"
 STATIC_MODIFIER_DESC_hun_tripartitum_mod: "Трипартитум, составленный Иштваном Вербёци в 1514 году, был кульминацией венгерского обычного права — три части, охватывающие «единую и ту же свободу» дворянства, закрепощение крестьянства и королевскую власть. Кровавое крестьянское восстание Дожи было его ценой. И всё же этот свод законов оставался основой венгерского общества веками."
 STATIC_MODIFIER_NAME_hun_matthias_admin_mod: "Реформы короля Матьяша"
 STATIC_MODIFIER_DESC_hun_matthias_admin_mod: "Матьяша называли «Справедливым» (Igazságos Mátyás), ибо он держал суд без различия чина и защищал крестьян от баронского угнетения. Он построил централизованную бюрократию, обуздал власть магнатов и распространил королевскую власть прямо на сельские земли. Его правление вспоминается как наиболее совершенное выражение венгерского королевского достоинства в истории."
 STATIC_MODIFIER_NAME_hun_buda_renaissance_mod: "Возрождение Буды"
 STATIC_MODIFIER_DESC_hun_buda_renaissance_mod: "Двор Матьяша привлёк гуманистов, зодчих, скульпторов и музыкантов со всей Италии. Будайский дворец был перестроен в ренессансном стиле — более великолепный, чем Вена — и Bibliotheca Corviniana хранила свыше пяти тысяч рукописей классических греческих и римских текстов. Когда Матьяш умер, гуманист написал: «Матьяш мёртв. Справедливость погибла»."
 STATIC_MODIFIER_NAME_hun_great_hungary_mod: "Великая Венгрия"
 STATIC_MODIFIER_DESC_hun_great_hungary_mod: "Великая венгерская империя, охватывающая Центральную Европу, Балканы и Адриатику, завершена."
 hun_baltic_trade: "Балтийская торговля"
 hun_baltic_trade_desc: "Гданьск — ключевой узел Ганзейского союза — врата между Северным морем и Балтикой. Венгерский контроль над этим портом открывает доступ к торговле балтийским янтарём, мехами и древесиной, обеспечивая прямой путь в Западную Европу. Это переломный момент, когда Венгрия преображается из сухопутного земледельческого государства в морскую торговую державу."
 hun_hre_influence: "Влияние на СРИ"
 hun_hre_influence_desc: "С обеспеченными Польшей и Богемией Венгрия стала могущественнейшим соседом Священной Римской империи. Расширь венгерское влияние на германских князей через дипломатическую репутацию и множество союзов, противостоя габсбургской гегемонии."
 hun_challenge_habsburgs: "Брось вызов Габсбургам"
 hun_challenge_habsburgs_desc: "Габсбургская династия Австрии была вечным соперником Венгрии. Захват Вены переносит дунайскую гегемонию к Венгрии. Величайшее венгерское честолюбие — свергнуть Габсбургов и стать императором СРИ — осуществлено здесь."
 hun_conquer_bulgaria: "Завоюй Болгарию"
 hun_conquer_bulgaria_desc: "Второе Болгарское царство было уничтожено османами в 1396 году. Но с Венгрией, ныне господствующей на Балканах, София и Тырново могут быть возвращены — возрождая болгарское наследие под венгерской короной."
 hun_conquer_greece: "Завоюй Грецию"
 hun_conquer_greece_desc: "Афины и Салоники — два великих города античной греческой цивилизации — падают перед Венгрией. Объедини разделённые греческие княжества после падения Византии и распространи венгерское знамя до южной оконечности Балкан."
 hun_balkan_empire: "Балканская империя"
 hun_balkan_empire_desc: "Сербия, Болгария, Греция, Валахия, Молдавия — весь Балканский полуостров под венгерским владычеством. Гегемония, кою Византия, а затем османы осуществляли над Балканами, ныне полностью принадлежит Венгрии."
 hun_push_into_anatolia: "Продвинься в Анатолию"
 hun_push_into_anatolia_desc: "С обеспеченным Константинополем Венгрия ныне охватывает два континента. Начни крестовый поход, дабы вернуть анатолийские земли, кои утратила Византия, и порази сердце Османской империи."
 hun_hungarian_crusade: "Венгерский крестовый поход"
 hun_hungarian_crusade_desc: "Венгерский король, освободивший Иерусалим, становится героем всего христианства. Мечта со времён Святого Стефана — возвращение Святой земли в христианские руки — наконец осуществлена. Крестоносная победа, о коей мечтал Сигизмунд, основатель Ордена Дракона, вписана здесь."
 hun_mediterranean_fleet: "Средиземноморский флот"
 hun_mediterranean_fleet_desc: "С обеспеченными Неаполем и Сицилией Венгрия стала крупной средиземноморской морской державой. Флот из тридцати или более судов соперничает за контроль над Средиземноморьем. Море, некогда монополизированное Венецией, ныне принадлежит Венгрии."
 hun_conquer_north_africa: "Завоюй Северную Африку"
 hun_conquer_north_africa_desc: "Захват Туниса расширяет венгерскую территорию до южного берега Средиземноморья. Сокруши базы берберийских пиратов и устрани препятствия средиземноморской торговле. Венгерский флаг реет на южном краю Средиземноморья."
 hun_latin_empire: "Восстановление Латинской империи"
 hun_latin_empire_desc: "С обеспеченными Константинополем, Римом и Неаполем король Венгрии может заявить себя наследником Латинской империи. Мечта Четвёртого крестового похода 1204 года ныне осуществлена через законное завоевание. Величайшая христианская империя истории рождается."
 hun_corvinus_library: "Bibliotheca Corviniana"
 hun_corvinus_library_desc: "Bibliotheca Corviniana короля Матьяша была крупнейшим собранием латинских и греческих рукописей современной ему Европы — более пяти тысяч кодексов, хранимых в Будайском дворце, привлекающих учёных и художников из Италии, Франции и Германии. Это культурное вложение преображает Венгрию в культурный центр Центральной Европы."
 hun_hungarian_church: "Венгерская церковь"
 hun_hungarian_church_desc: "Сосредоточенная на Эстергомском архиепископстве, укрепи венгерскую католическую церковь и обеспечь духовную поддержку. Прежде чем нахлынут волны Реформации, твёрдо утверди отношения между Католической церковью и венгерской королевской властью."
 hun_economic_powerhouse: "Золотой Дунай"
 hun_economic_powerhouse_desc: "Венгрия, охватывающая Балканы, север и Адриатику, лежит на перекрёстке множества крупных торговых путей — экономический гигант. Дунайское земледельческое производство, трансильванские серебряные копи и средиземноморские торговые доходы сочетаются, порождая огромное богатство."
 hun_danube_empire: "Дунайская империя"
 hun_danube_empire_desc: "Польша, Богемия, Балканы, Адриатика, Средиземноморье — всё под венгерским владычеством, с утончёнными административными учреждениями и процветающей экономической основой. Венгрия стала «Дунайской империей» с центром на великой реке. Многонациональное составное государство, о коем некогда мечтала Австро-Венгрия, ныне осуществлено под венгерским водительством."
 STATIC_MODIFIER_NAME_hun_baltic_trade_mod: "Балтийская торговля"
 STATIC_MODIFIER_DESC_hun_baltic_trade_mod: "Венгерские купеческие суда, бросившие якорь в порту Гданьска, возвращаются гружёнными янтарём и мехами."
 STATIC_MODIFIER_NAME_hun_habsburg_rival_mod: "Венгрия-Австрия"
 STATIC_MODIFIER_DESC_hun_habsburg_rival_mod: "Падение Вены сокрушает власть Габсбургов, делая Венгрию владыкой Дуная."
 STATIC_MODIFIER_NAME_hun_bulgaria_mod: "Болгарское владычество"
 STATIC_MODIFIER_DESC_hun_bulgaria_mod: "Новые наместники на холме Тырново распространяют венгерскую речь и закон на деревни южных Балкан."
 STATIC_MODIFIER_NAME_hun_greece_mod: "Свет Греции"
 STATIC_MODIFIER_DESC_hun_greece_mod: "Король Венгрии, взирающий на Акрополь Афин, принимает славу античной Греции гордостью своего собственного двора."
 STATIC_MODIFIER_NAME_hun_balkan_empire_mod: "Балканская империя"
 STATIC_MODIFIER_DESC_hun_balkan_empire_mod: "От Дуная до Пелопоннеса знамя Короны Святого Стефана реет с каждой стены Балкан."
 STATIC_MODIFIER_NAME_hun_new_crusade_mod: "Новый крестовый поход"
 STATIC_MODIFIER_DESC_hun_new_crusade_mod: "Солдаты, прошедшие через врата Константинополя, клянутся вновь нести крест ещё далее на восток."
 STATIC_MODIFIER_NAME_hun_crusade_victory_mod: "Крестовый поход свершён"
 STATIC_MODIFIER_DESC_hun_crusade_victory_mod: "Слава освобождения Иерусалима приносит Венгрии невиданный престиж, легитимность и дипломатическую власть."
 STATIC_MODIFIER_NAME_hun_med_fleet_mod: "Средиземноморский флот"
 STATIC_MODIFIER_DESC_hun_med_fleet_mod: "Из портов Адриатики галеры под знаменем венгерского короля выходят одна за другой в Средиземноморье."
 STATIC_MODIFIER_NAME_hun_north_africa_mod: "Северо-африканская база"
 STATIC_MODIFIER_DESC_hun_north_africa_mod: "Вдоль побережья Северной Африки венгерские купцы и эскадры, охотящиеся на корсаров, беспрестанно проходят от порта к порту."
 STATIC_MODIFIER_NAME_hun_latin_empire_mod: "Восстановление Латинской империи"
 STATIC_MODIFIER_DESC_hun_latin_empire_mod: "Имя короля, держащего Константинополь, Рим и Неаполь, произносится с трепетом при каждом дворе."
 STATIC_MODIFIER_NAME_hun_corvinus_library_mod: "Bibliotheca Corviniana"
 STATIC_MODIFIER_DESC_hun_corvinus_library_mod: "В скриптории Корвиновой библиотеки писцы копируют рукописи при свете лампы день и ночь."
 STATIC_MODIFIER_NAME_hun_church_mod: "Венгерская церковь"
 STATIC_MODIFIER_DESC_hun_church_mod: "Сильная венгерская церковь приносит легитимность, законодательную эффективность и религиозную стабильность."
 STATIC_MODIFIER_NAME_hun_economy_mod: "Золотой Дунай"
 STATIC_MODIFIER_DESC_hun_economy_mod: "Баржи, плывущие по Дунаю, и телеги, везущие от копей, держат рынки королевства вечно оживлёнными."
 STATIC_MODIFIER_NAME_hun_danube_empire_mod: "Дунайская империя"
 STATIC_MODIFIER_DESC_hun_danube_empire_mod: "Многонациональная Дунайская империя с центром на великой реке завершена. Налог, население, управление и законодательная эффективность достигают своего пика."
 hun_transylvanian_mines: "Нижневенгерские горняцкие города"
 hun_transylvanian_mines_desc: "Кремница (Кёрмёцбанья) содержит величайший золотой монетный двор Венгрии. Банска-Бистрица (Бестерцебанья) прославлена крупнейшими медными копями Центральной Европы. Обеспечение этих двух городов делает Венгрию первейшим горнодобывающим государством Центральной Европы. Матьяш Корвин реорганизовал этот регион имперским владением в 1467-68 годах, используя горные доходы для финансирования Чёрной армии."
 hun_silver_mines: "Серебряные копи Банска-Штявницы"
 hun_silver_mines_desc: "Область Хонт (охватывающая Банска-Штявницу) — величайший серебродобывающий округ Нижней Венгрии. Серебро этой земли чеканилось в талеры на королевском монетном дворе, поддерживая торговлю по всей Центральной Европе. «Нижневенгерские горняцкие города» — экономическое сердце королевства."
 hun_salt_mines: "Соляные копи Трансильвании"
 hun_salt_mines_desc: "Сигет (Мараморошсигет) и Турда добывали каменную соль с античности. Соль некогда называли «белым золотом» — столь жизненно важным товаром, что королевская соляная монополия Венгрии была критическим столпом финансов короны. Обеспечь эти соляные копи и утверди монополию на соляную торговлю."
 hun_tokaj_wine: "Вина Токая"
 hun_tokaj_wine_desc: "Токайский регион вокруг Шаторальяуйхея производит Токай Асу — «Вино королей, король вин». Столь прославленное, что папа Бенедикт XIV подарил его Людовику XV Французскому, это вино благородной гнили с венгерских холмов — самое известное вино Европы. Разви виноградники и вывози лучшее вино Европы."
 hun_mining_empire: "Горнодобывающая империя"
 hun_mining_empire_desc: "Золото Кремницы, серебро Хонта, медь Банска-Бистрицы и соль Сигета и Турды — всё минеральное богатство Венгрии ныне обеспечено. Как первейшее горнодобывающее государство Центральной Европы, Венгрия обретает огромный доход от вывоза металлов. Это богатство финансировало Чёрную армию Матьяша и славу его ренессансного двора."
 hun_buda_capital: "Развитие Буды и Пешта"
 hun_buda_capital_desc: "Буда и Пешт, стоящие друг против друга через Дунай, — сердце Королевства Венгрия. Королевский дворец и великий рынок Буды, торговая гавань Пешта — когда этот двойной город процветает, вся Венгрия благоденствует. Двор Матьяша был крупнейшим в Европе и прославлен центром центральноевропейского Возрождения."
 hun_upper_hungary_cities: "Города Верхней Венгрии"
 hun_upper_hungary_cities_desc: "Братислава (Пожонь) охраняет западные врата против Габсбургов; Кошице (Кашша) — величайший торговый город Верхней Венгрии; Трнава (Надьсомбат) — епископская резиденция. Развитие этих трёх городов делает Верхнюю Венгрию (нынешнюю Словакию) экономическим и политическим стержнем севера."
 hun_pannonian_cities: "Города Паннонии"
 hun_pannonian_cities_desc: "Дьёр (Раба) охраняет австрийскую границу; Шопрон (Эденбург) — богатый торговый город западной Венгрии; Печ (Фюнфкирхен) содержит один из старейших университетов Центральной Европы, основанный Людовиком I в 1367 году. Разви эти паннонские города, дабы западная Венгрия процветала."
 hun_great_plain_cities: "Города Великой равнины"
 hun_great_plain_cities_desc: "Дебрецен (центр венгерского кальвинизма), Сегед (ключ к реке Тиса), Кечкемет (пастушеский город Великой равнины) — разви главные города венгерской пушты и открой земледельческий потенциал этой обширной степи. Скот, овцы и зерно Великой равнины станут главным вывозом Венгрии."
 hun_transylvania_cities: "Города Трансильвании"
 hun_transylvania_cities_desc: "Клуж (Коложвар) — политическое и культурное сердце Трансильвании; Орадя (Надьварад) — великий город паломничества, хранящий мощи Святого Ласло; Мишкольц — промышленный центр северо-восточной Венгрии. Включи многонациональный трансильванский регион через городское развитие."
 hun_kingdom_of_cities: "Королевство городов"
 hun_kingdom_of_cities_desc: "Золото Кремницы, серебро Хонта, вино Токая, двор Буды, торговля Кошице, университет Печа, земледелие Дебрецена, культура Клужа — каждый город Королевства Венгрия действует органичным согласием. Величайшая экономическая зона Центральной Европы завершена. Городское процветание есть истинный источник венгерской имперской мощи."
 STATIC_MODIFIER_NAME_hun_kremnica_mint_mod: "Кремницкий королевский монетный двор"
 STATIC_MODIFIER_DESC_hun_kremnica_mint_mod: "Кремницкий монетный двор был учреждён Карлом I Венгерским в 1328 году в Кёрмёцбанье. Золотой «флорин» (форинт), чеканенный здесь, считался равным по качеству флорентийскому флорину — и обращался от Балтики до Константинополя. Тщательные стандарты монетного двора сделали его денежным хребтом центральноевропейской торговли."
 STATIC_MODIFIER_NAME_hun_banska_copper_mod: "Медные копи Банска-Бистрицы"
 STATIC_MODIFIER_DESC_hun_banska_copper_mod: "В шахтах Банска-Бистрицы звук молотов, рубящих медь, не смолкает."
 STATIC_MODIFIER_NAME_hun_hont_silver_mod: "Серебряные копи Банска-Штявницы"
 STATIC_MODIFIER_DESC_hun_hont_silver_mod: "Серебро, добытое из копей Хонта, несётся на королевский монетный двор."
 STATIC_MODIFIER_NAME_hun_salt_mine_mod: "Каменносоляная копь"
 STATIC_MODIFIER_DESC_hun_salt_mine_mod: "Каменносоляные галереи, вырытые со времён римлян, всё ещё питают столы королевства."
 STATIC_MODIFIER_NAME_hun_tokaj_wine_mod: "Виноградники Токая Асу"
 STATIC_MODIFIER_DESC_hun_tokaj_wine_mod: "Виноград благородной гнили, вызревший на холмах Токая, путешествует ко дворам многих земель как «вино королей»."
 STATIC_MODIFIER_NAME_hun_buda_capital_mod: "Королевская столица Буда"
 STATIC_MODIFIER_DESC_hun_buda_capital_mod: "Из окон королевского дворца в Буде, глядящего на Дунай, паруса проходящих купеческих судов всегда видны."
 STATIC_MODIFIER_NAME_hun_pest_trade_mod: "Торговый порт Пешт"
 STATIC_MODIFIER_DESC_hun_pest_trade_mod: "На причалах Пешта крики грузчиков разносятся с утра до ночи."
 STATIC_MODIFIER_NAME_hun_bratislava_gateway_mod: "Пожонь — город-врата"
 STATIC_MODIFIER_DESC_hun_bratislava_gateway_mod: "Врата Пожони стали перекрёстком, где телеги, идущие в Австрию, и королевские гонцы проходят бок о бок."
 STATIC_MODIFIER_NAME_hun_kosice_commerce_mod: "Кашша — торговый центр"
 STATIC_MODIFIER_DESC_hun_kosice_commerce_mod: "На рыночной площади Кашши купцы из Польши и Силезии соперничают за товары Верхней Венгрии."
 STATIC_MODIFIER_NAME_hun_pecs_university_mod: "Печский университет"
 STATIC_MODIFIER_DESC_hun_pecs_university_mod: "В кельях университета в Пече студенты, продолжающие наследие Людовика I, внимают лекциям на латыни."
 STATIC_MODIFIER_NAME_hun_gyor_fortress_mod: "Крепость Дьёра"
 STATIC_MODIFIER_DESC_hun_gyor_fortress_mod: "На стенах Дьёра часовые, наблюдающие австрийскую границу, держат факелы высоко всю ночь."
 STATIC_MODIFIER_NAME_hun_debrecen_agri_mod: "Земледельческий город Дебрецен"
 STATIC_MODIFIER_DESC_hun_debrecen_agri_mod: "Стада скота и грузы пшеницы, выращенные на Великой равнине, беспрестанно текут на рынок Дебрецена."
 STATIC_MODIFIER_NAME_hun_szeged_trade_mod: "Торговый порт Сегед"
 STATIC_MODIFIER_DESC_hun_szeged_trade_mod: "Сегед, при слиянии Тисы и Дуная, развит узлом внутренней торговли."
 STATIC_MODIFIER_NAME_hun_cluj_center_mod: "Клуж — сердце Трансильвании"
 STATIC_MODIFIER_DESC_hun_cluj_center_mod: "На рынках и в школах Клужа голоса немцев, венгров и румын смешиваются."
 STATIC_MODIFIER_NAME_hun_oradea_pilgrimage_mod: "Надьварад — город паломничества"
 STATIC_MODIFIER_DESC_hun_oradea_pilgrimage_mod: "Вереницы паломников со всего царства держат путь к собору Надьварада, дому мощей короля Святого Ласло."
 STATIC_MODIFIER_NAME_hun_mining_empire_mod: "Горнодобывающая империя"
 STATIC_MODIFIER_DESC_hun_mining_empire_mod: "Золото, серебро, медь, соль — богатство, извлечённое из копей царства, ныне превосходит любую иную землю Центральной Европы."
 STATIC_MODIFIER_NAME_hun_kingdom_of_cities_mod: "Королевство городов"
 STATIC_MODIFIER_DESC_hun_kingdom_of_cities_mod: "От Буды до Клужа рынки городов царства обмениваются товарами друг друга и дышат единой великой экономической сферой."
 hun_secure_transylvania: "Овладение Трансильванией"
 hun_secure_transylvania_desc: "Трансильвания — давно коренная венгерская территория — сосредоточена на двух великих городах: Клуж и Брашов. Венгры, саксы и валахи (румыны) сосуществуют на этой земле. С достаточными казначейскими ресурсами вложи в серьёзное развитие Трансильвании и возвысь один из двух её великих городов до полного городского статуса."
 hun_events.20.t: "Овладение Трансильванией"
 hun_events.20.d: "С обеспеченными Клужем и Брашовом и вложенными более 1000 дукатов, крупная программа развития Трансильвании начинается. Клуж (по-латински Клаудиополис; по-румынски Клуж) — величайший город Трансильвании; Брашов (по-латински Корона; по-немецки Кронштадт), построенный саксонскими поселенцами, — торговые врата в Валахию. Какой город получит приоритет в развитии — это решение формирует будущее направление Трансильвании."
 hun_events.30.t: "Pacta Conventa — исторический договор с Хорватией"
 hun_events.30.d: "В 1102 году король Коломан Венгерский заключил Pacta Conventa с представителями двенадцати хорватских дворянских родов. Хорватские дворяне приняли венгерского короля своим собственным сувереном; взамен Хорватия сохранила свою автономию и правовые традиции. Более двух веков спустя после этого исторического договора настало время прояснить отношения между Венгрией и Хорватией. Должна ли Хорватия быть формально включена ленным владением, дабы прояснить её правовой статус? Или же нынешнее гибкое устройство должно быть сохранено? Выбор покоится на короле Венгрии."
 hun_events.30.a: "Формально включить Хорватию ленным владением"
 hun_events.30.b: "Сохранить нынешние отношения (+10 престижа)"
 hun_events.20.a: "Возвысить Клуж до городского статуса (стоит 1000 дукатов)"
 hun_events.20.b: "Возвысить Брашов до городского статуса (стоит 1000 дукатов)"
 STATIC_MODIFIER_NAME_hun_eternal_crown_mod: "Вечная Корона Святого Стефана"
 STATIC_MODIFIER_DESC_hun_eternal_crown_mod: "На Рождество в 1000 году папа Сильвестр II послал корону Иштвану, герцогу венгров, сделав его Стефаном I — первым королём Венгрии. Та корона — Священная корона Святого Стефана — стала восприниматься самой сутью венгерского государства: король без неё вовсе не был королём Венгрии. Ныне, спустя века, дипломаты из каждого уголка мира совершают паломничество ко двору Венгрии, дабы признать его верховенство."
