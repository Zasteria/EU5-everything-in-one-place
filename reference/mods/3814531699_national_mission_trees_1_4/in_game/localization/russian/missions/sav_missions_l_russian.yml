l_russian:
 sav_house_of_savoy_mission_pack: "Честолюбия дома Савойского"
 sav_house_of_savoy_mission_pack_DESCRIPTION:0 "Дом Савойский, повелевающий альпийскими перевалами, предназначен возвыситься от малого пьемонтского герцогства, дабы править всей Италией и Южной Францией и основать Королевство Италия. Искусно маневрируй между папой, императором и Францией; завоюй Геную, дабы утвердить морскую мощь; сокруши Ломбардию, Тоскану и Венецию, дабы притязать на Рим. Восстань Сардинией-Пьемонтом и наконец стань знаменосцем объединения Италии."
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION:0 "Как Савойя-Пьемонт, завоюй Италию и Францию и основай Королевство Италия."
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы осуществить честолюбия дома Савойского."
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS:0 "Пересеки Альпы и объедини Италию!"
 sav_the_savoy_ambition: "Честолюбия Савойи"
 sav_the_savoy_ambition_desc: "Дом Савойский занимает своеобразное положение на перекрёстке Альп, с влиянием и на Италию, и на Францию. Через владычество над плодородными землями Пьемонта и альпийскими торговыми путями это малое герцогство начинает свой путь к величию."
 sav_unify_piedmont: "Объедини Пьемонт"
 sav_unify_piedmont_desc: "Включение независимых держав, таких как Салуццо и Монферрат, и объединение всего Пьемонта — первый шаг к великим честолюбиям Савойи."
 sav_glory_of_turin: "Слава Турина"
 sav_glory_of_turin_desc: "Развей Турин, центральный город Пьемонта, в процветающий мегаполис, достойный столицы дома Савойского."
 sav_shroud_of_turin: "Туринская плащаница"
 sav_shroud_of_turin_desc: "Льняное полотно, считаемое погребальным покровом Христа, покоится в Туринском соборе. Вера в эту реликвию приносит царству богатство и престиж."
 sav_alpine_roads: "Альпийские дороги"
 sav_alpine_roads_desc: "Развитие дорожной инфраструктуры вдоль альпийских торговых путей увеличивает прибыль, текущую Савойе, пока купцы проходят между Францией и Италией."
 sav_crossroads_of_europe: "Перекрёсток Европы"
 sav_crossroads_of_europe_desc: "Пьемонт, связующий Геную, Венецию и Францию, становится одним из ведущих торговых узлов Европы."
 sav_order_of_saints_maurice: "Орден Святых Маврикия и Лазаря"
 sav_order_of_saints_maurice_desc: "Орден Святых Маврикия и Лазаря, основанный домом Савойским, становится символом религиозной власти и легитимности в католическом мире."
 sav_savoy_academy: "Академия Савойи"
 sav_savoy_academy_desc: "Принятие духа Возрождения и развитие академических учреждений вокруг Турина утверждает Савойю твёрдым членом итальянского культурного круга."
 sav_alpine_powerhouse: "Альпийская держава"
 sav_alpine_powerhouse_desc: "Через объединение Пьемонта, культурное развитие и растущую экономическую мощь Савойя признана значительной державой вокруг Альп."
 sav_alpine_fortifications: "Альпийские укрепления"
 sav_alpine_fortifications_desc: "Полное использование природной изрезанности Альп и постройка мощных крепостей в стратегических пунктах делает Савойю неприступным горным государством."
 sav_diplomatic_balance: "Дипломатическое равновесие"
 sav_diplomatic_balance_desc: "Для Савойи, зажатой между великими державами, дипломатическое мастерство незаменимо для выживания. Сохранение высокого дипломатического престижа искусно отклоняет давление могучих соседей."
 sav_savoyard_army: "Савойское войско"
 sav_savoyard_army_desc: "Савойские солдаты, закалённые в изрезанной местности Альп, считаются одними из лучших горных воинов Европы. Построение постоянной армии поддерживает военную независимость царства."
 sav_conquer_genoa: "Завоюй Геную"
 sav_conquer_genoa_desc: "Завоевание Генуи, одного из ведущих морских городов Средиземноморья, позволяет Савойе преодолеть своё сухопутное положение и сделать первый шаг к морской державе с прямым доступом к Средиземноморью."
 sav_nice_naval_base: "Морская база Ницца"
 sav_nice_naval_base_desc: "Учреждение морской базы в Ницце на средиземноморском побережье даёт Савойе опорный пункт для владычества над Тирренским морем."
 sav_sardinia_union: "Уния с Сардинией"
 sav_sardinia_union_desc: "Занятие большей части Сардинии и принятие титула «Королевство Сардиния» обретает дому Савойскому признание одним из значительных королевских домов Италии."
 sav_seize_lombardy: "Захвати Ломбардию"
 sav_seize_lombardy_desc: "Приведение Ломбардии вокруг Милана под савойский контроль делает Савойю владыкой Северной Италии."
 sav_push_tuscany: "Продвинься в Тоскану"
 sav_push_tuscany_desc: "Покорение богатых городов-государств Тосканы под водительством Флоренции добавляет к савойской территории коренную землю культуры Возрождения."
 sav_capture_venice: "Захвати Венецию"
 sav_capture_venice_desc: "Завоевание Венеции, Царицы Адриатики, утверждает морскую гегемонию Савойи в Северной Италии."
 sav_emilia_and_beyond: "Эмилия и далее"
 sav_emilia_and_beyond_desc: "Занятие региона Эмилия и владычество над остающимися провинциями Северной Италии делает савойскую гегемонию абсолютной."
 sav_march_on_naples: "Марш на Неаполь"
 sav_march_on_naples_desc: "Завоевание Неаполя, ключевого города Южной Италии, приближает завершение владычества над полуостровом."
 sav_eternal_rome: "Вечный город"
 sav_eternal_rome_desc: "Владычество над Римом означает владычество над Италией. Заняв Вечный город, Савойя показывает миру свою власть законного правителя Италии."
 sav_integrate_geneva: "Включи Женеву"
 sav_integrate_geneva_desc: "Приведение Женевы, с её крепкими узами со Швейцарской конфедерацией, твёрдо под савойский контроль утверждает опорный пункт для расширения на север."
 sav_control_provence: "Овладей Провансом"
 sav_control_provence_desc: "Занятие Прованса вдоль средиземноморского побережья утверждает гегемонию Савойи в Южной Франции и открывает путь к большим честолюбиям."
 sav_against_the_swiss: "Против швейцарцев"
 sav_against_the_swiss_desc: "Подавление упрямо независимой Швейцарской конфедерации и занятие Западной Швейцарии делает Савойю владыкой земель к западу от Рейна."
 sav_conquer_burgundy: "Завоюй Бургундию"
 sav_conquer_burgundy_desc: "Покорение богатых земель, кои некогда правило герцогство Бургундия, открывает путь ко вторжению во Францию."
 sav_savoyard_occitania: "Савойская Окситания"
 sav_savoyard_occitania_desc: "Занятие окситаноязычных земель и включение всей Южной Франции в савойский культурный круг."
 sav_claim_france: "Заяви права на Францию"
 sav_claim_france_desc: "Настало время занять Париж, столицу Королевства Франция, и привести некогда угрожавшую Савойе великую державу под наше правление."
 sav_kingdom_of_italy: "Королевство Италия"
 sav_kingdom_of_italy_desc: "Дом Савойский пересёк Альпы, дабы объединить всю Италию, и как наследник Римской империи основал Королевство Италия. Мечта Рисорджименто здесь осуществлена."
 STATIC_MODIFIER_NAME_sav_unified_piedmont_mod: "Объединение Пьемонта"
 STATIC_MODIFIER_DESC_sav_unified_piedmont_mod: "Пьемонт — «подножие гор» — плодородная равнина, окружённая Альпами и Апеннинами, кою правили лорды Савойи, Монферрата, Салуццо и другие. Лишь через их объединение Савойя может полностью овладеть перекрёстком, связующим Альпы с рекой По."
 STATIC_MODIFIER_NAME_sav_shroud_of_turin_mod: "Благословение Плащаницы"
 STATIC_MODIFIER_DESC_sav_shroud_of_turin_mod: "Туринская плащаница — льняное полотно, кое, как считается, обвивало Христа после распятия, неся тенистый отпечаток человеческого тела. С тех пор как дом Савойский обрёл её в 1353 году, она почитается одной из величайших реликвий католического мира. Дебаты о её подлинности продолжаются, но её религиозное и политическое влияние вне сомнений."
 STATIC_MODIFIER_NAME_sav_alpine_roads_mod: "Альпийские дороги"
 STATIC_MODIFIER_DESC_sav_alpine_roads_mod: "Большой Сен-Бернар, Мон-Сени и Сен-Готард — пути через Альпы были главными артериями Европы с римских времён до Средневековья. Савойя, владыка этих перевалов, стала неимоверно богатой через пошлины и торговлю. Её роль «стража Альп» была корнем её процветания."
 STATIC_MODIFIER_NAME_sav_crossroads_mod: "Перекрёсток Европы"
 STATIC_MODIFIER_DESC_sav_crossroads_mod: "Пьемонт лежит на самом перекрёстке Франции, Швейцарии, Генуи и Милана. Итальянские купцы на пути к шампанским ярмаркам, французские паломники на пути в Рим, наёмники на пути в Швейцарию — люди и товары всех родов проходили через Пьемонт, и надзирая за путём, Савойя монополизировала прибыли от посреднической торговли."
 STATIC_MODIFIER_NAME_sav_order_of_saints_mod: "Орден Святых Маврикия и Лазаря"
 STATIC_MODIFIER_DESC_sav_order_of_saints_mod: "Орден Святых Маврикия и Лазаря объединил два ордена, основанных домом Савойским, в 1434 и 1572 годах соответственно. Святой Маврикий был христианским мучеником римской эпохи; Святой Лазарь почитался покровителем прокажённых. Орден стал символом религиозной власти дома Савойского в католическом мире."
 STATIC_MODIFIER_NAME_sav_savoy_academy_mod: "Влияние Академии Савойи"
 STATIC_MODIFIER_DESC_sav_savoy_academy_mod: "В эпоху Возрождения герцогство Савойя было известно покровительством учёности и искусству. Основанный в 1404 году Туринский университет стал духовным центром Пьемонта, обучая праву, медицине и богословию. Традиция художественного покровительства, кая позже приведёт к Accademia delle Belle Arti при Карле Эммануиле I, также уходила корнями в эту эпоху."
 STATIC_MODIFIER_NAME_sav_alpine_powerhouse_mod: "Альпийская держава"
 STATIC_MODIFIER_DESC_sav_alpine_powerhouse_mod: "«Мал, но силён» — сила Савойи лежала в умном использовании своей географии. Окружённая великими державами Франция, Австрия и Испания, она выжила через искусную дипломатию и военную стратегию, использующую природу земли, и наконец стала «династией судьбы», возглавившей объединение Италии."
 STATIC_MODIFIER_NAME_sav_alpine_fortifications_mod: "Альпийские укрепления"
 STATIC_MODIFIER_DESC_sav_alpine_fortifications_mod: "Расположив группы крепостей, таких как Бриансон, Фенестрелле и Эксий, в природных бастионах Альп, Савойя выковала «щит Альп». В XVII-XVIII веках пришли бастионные крепости в стиле Вобана, дабы охранять эти перевалы, сделав Савойю одним из самых неприступных государств Европы."
 STATIC_MODIFIER_NAME_sav_diplomatic_balance_mod: "Дипломатическое равновесие"
 STATIC_MODIFIER_DESC_sav_diplomatic_balance_mod: "Сутью савойской дипломатии было «всегда быть на стороне сильнейшего». Балансируя на канате между Францией и Австрией, Савойя обрела Сардинию по Утрехтскому миру (1713) и возвысилась до ранга королевства. Виктор Амадей II воплотил вершину этой «уравновешивающей» дипломатии."
 STATIC_MODIFIER_NAME_sav_savoyard_army_mod: "Савойская элита"
 STATIC_MODIFIER_DESC_sav_savoyard_army_mod: "Савойские солдаты были мастерами горной войны, выкованными в суровой местности Альп. Военные реформы Пьемонта XIV-XV веков утвердили «Ordinanza Piemontese», и дисциплинированная пехотная тактика стала силой савойской армии. Даже в позднейшем Рисорджименто они были опорой освобождения Северной Италии."
 STATIC_MODIFIER_NAME_sav_conquer_genoa_mod: "Занятие Генуи"
 STATIC_MODIFIER_DESC_sav_conquer_genoa_mod: "Генуя, соперник Венеции, была одним из крупнейших средневековых морских городов-государств Средиземноморья, раскинувшей огромную торговую сеть по Чёрному морю, Северной Африке и Иберии. Она также колыбель банковского дела (Банк Сан-Джорджо один из старейших в мире) и страхования. Завоевание этой «гордой республики» открывает Савойе дверь Средиземноморья."
 STATIC_MODIFIER_NAME_sav_nice_naval_base_mod: "Морская база Ницца"
 STATIC_MODIFIER_DESC_sav_nice_naval_base_mod: "Ницца (Nizza Marittima) — античный средиземноморский порт, основанный колонией греческой Массалии (Марселя). С тех пор как дом Савойский обрёл её в 1388 году, этот порт на границе Франции и Италии служил единственной морской базой Савойи (он оставался савойским до 1860 года)."
 STATIC_MODIFIER_NAME_sav_sardinia_union_mod: "Уния с Сардинией"
 STATIC_MODIFIER_DESC_sav_sardinia_union_mod: "В 1720 году, в перестройках после Утрехтского мира, дом Савойский обменял Сицилию на Сардинию и возвысился «Королевством Сардиния». Уния этого острова с континентальным Пьемонтом станет основой, от коей Камилло Кавур и Гарибальди достигнут объединения Италии (1861)."
 STATIC_MODIFIER_NAME_sav_seize_lombardy_mod: "Занятие Ломбардии"
 STATIC_MODIFIER_DESC_sav_seize_lombardy_mod: "Ломбардская равнина — одна из плодороднейших пахотных земель Европы, и Милан — её центр промышленности и торговли. Возвращение этой богатой, долго удерживаемой Австрией земли было основной целью Рисорджименто — конкретным воплощением мечты Савойи."
 STATIC_MODIFIER_NAME_sav_push_tuscany_mod: "Продвижение в Тоскану"
 STATIC_MODIFIER_DESC_sav_push_tuscany_mod: "Тоскана, вокруг Флоренции, — колыбель культуры Возрождения, хранящая величайшее художественное наследие в истории человечества. Уффици, собор, стихи Данте — всё покровительствуемое Медичи. Добавление этого культурного сокровища к своей территории придало бы Королевству Савойя духовную власть."
 STATIC_MODIFIER_NAME_sav_capture_venice_mod: "Занятие Венеции"
 STATIC_MODIFIER_DESC_sav_capture_venice_mod: "Венеция, «Царица Адриатики», — чудесный город-государство, сохранявший свою независимость более тысячи лет. Город каналов, построенный на островах лагуны, правил через монополию на восточную торговлю и превосходное кораблестроительное искусство, Арсенале, владыкой Средиземноморья. Завоевать этот непокорённый город было бы великим деянием истории."
 STATIC_MODIFIER_NAME_sav_emilia_and_beyond_mod: "Эмилия и далее"
 STATIC_MODIFIER_DESC_sav_emilia_and_beyond_mod: "Болонья, Парма, Модена и Феррара, выстроенные вдоль Виа Эмилия, были известны со времён Средневековья центрами пищи, культуры и учёности. Болонья хранит старейший университет Европы (основан в 1088 году), и её духовная традиция углубила бы культурную глубину Королевства Савойя."
 STATIC_MODIFIER_NAME_sav_march_on_naples_mod: "Марш на Неаполь"
 STATIC_MODIFIER_DESC_sav_march_on_naples_mod: "Столь прекрасный, что дал повод пословице «Увидеть Неаполь и умереть», этот город процветал со времён древности одним из крупнейших городов Средиземноморья. Неаполь, переживший бурную историю под анжуйским, арагонским, испанским и бурбонским правлением, был последним великим препятствием объединения Италии."
 STATIC_MODIFIER_NAME_sav_eternal_rome_mod: "Вечный город"
 STATIC_MODIFIER_DESC_sav_eternal_rome_mod: "«Все дороги ведут в Рим» — столица античной Римской империи, престол католической церкви, центр культуры Возрождения, Рим — символ западной цивилизации. Колизей, Пантеон, собор Святого Петра — сделать город такого исторического веса своей собственной столицей означает завершение объединения Италии."
 STATIC_MODIFIER_NAME_sav_integrate_geneva_mod: "Включение Женевы"
 STATIC_MODIFIER_DESC_sav_integrate_geneva_mod: "Женева некогда стояла под влиянием графов Савойских, но в 1536 году Жан Кальвин сделал её базой Реформации, и она стала «протестантским Римом». Вновь включить этот озёрный город было бы важным опорным пунктом для савойской экспансии к Швейцарии."
 STATIC_MODIFIER_NAME_sav_control_provence_mod: "Владычество над Провансом"
 STATIC_MODIFIER_DESC_sav_control_provence_mod: "Прованс был некогда владением дома Анжуйского и был присоединён к французской короне после смерти короля Рене (1480). Лавандовые поля, оливковые рощи и виноградники средиземноморского побережья — эта богатая земля Южной Франции была бы ключом к значительному расширению территории Савойи."
 STATIC_MODIFIER_NAME_sav_against_the_swiss_mod: "Против швейцарцев"
 STATIC_MODIFIER_DESC_sav_against_the_swiss_mod: "Швейцарская конфедерация — страна непокорных горных воинов, кои разбили Карла Смелого, герцога Бургундского, в 1476-77 годах при Грансоне и Муртене. Покорить этого мощного соседа — нелёгкая задача, но для Савойи, использовавшей швейцарских наёмников (ландскнехтов) дворцовой стражей, овладение их родиной было бы величайшей военной победой."
 STATIC_MODIFIER_NAME_sav_conquer_burgundy_mod: "Завоевание Бургундии"
 STATIC_MODIFIER_DESC_sav_conquer_burgundy_mod: "Бургундия, побочная ветвь Валуа, на своей вершине правила огромным «Срединным царством», простиравшимся от Нидерландов до Бургундии. Вновь присоединённая к Франции со смертью Карла Смелого (1477), эта богатая, славная вином и кухней провинция стала бы важным опорным пунктом для вторжения во Францию."
 STATIC_MODIFIER_NAME_sav_savoyard_occitania_mod: "Савойская Окситания"
 STATIC_MODIFIER_DESC_sav_savoyard_occitania_mod: "Окситаноязычные народы Южной Франции породили культуру трубадуров, но были опустошены Альбигойским крестовым походом XIII века. Погребённая под преследованием катаров и правлением французской короны, традиция окситанского самоуправления оживает под знаменем Савойи."
 STATIC_MODIFIER_NAME_sav_claim_france_mod: "Притязание на Францию"
 STATIC_MODIFIER_DESC_sav_claim_france_mod: "Франция всегда была для Савойи и угрозой, и соблазном одновременно. В эпоху Наполеона (рождённого корсиканцем, однако соседом Ниццы) Савойя была поглощена Францией. Ныне обратное — великий поворот, в коем Савойя захватывает престол французского короля для себя."
 STATIC_MODIFIER_NAME_sav_kingdom_of_italy_mod: "Королевство Италия"
 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "17 марта 1861 года Виктор Эммануил II (король Сардинии) взошёл первым королём Королевства Италия — так свершилось в действительной истории. Величайшее политическое чудо XIX века, слившее дипломатию Кавура, оружие Гарибальди и идеалы Мадзини, достигнуто здесь на четыре века раньше."
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "Слава Турина"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "Открытый рынок «Балон», холмы Ланге, дающие Бароло и Барбареско, великолепная площадь Сан-Карло — Турин есть столица, кою дом Савойский сформировал в ведущий плановый город Италии. Как наследник решётки римского Augusta Taurinorum, этот город являет тончайший облик к югу от Альп."
 sav_events.1.t: "Честолюбия дома Савойского"
 sav_events.1.d: "Герцогство Савойя повелевает стратегическими перевалами Альп, связующими Северную и Южную Европу. С Францией и Италией по обе стороны, это малое княжество пробуждается к великим честолюбиям. Герб Савойи — белый крест на алом щите — однажды будет реять над всей Италией. Объедини Пьемонт, завоюй Геную, займи Рим и основай Королевство Италия — тысячелетняя мечта дома Савойского готова начаться."
 sav_events.1.a: "Возвысь славу дома Савойского!"
 sav_events.2.t: "Слава Турина"
 sav_events.2.d: "Под правлением дома Савойского Турин быстро развивается. С дворцами и церквями, возносящимися по всему городу, и учёными и художниками, собирающимися здесь, этот город выступает культурным и политическим центром Северной Италии. Расцвет Турина как столицы, достойной дома Савойского, становится основой процветания всего царства."
 sav_events.2.a: "Турин — сияющая столица дома Савойского"
 sav_woolens_of_piedmont: "Шерстяная промышленность Пьемонта"
 sav_woolens_of_piedmont_desc: "Пьемонт известен как один из ведущих производителей шерсти и сукна Италии. Высококачественное шерстяное производство и обработка сукна образуют торговую основу савойского богатства."
 sav_nebbiolo_vineyards: "Виноградники Неббиоло"
 sav_nebbiolo_vineyards_desc: "Виноград Неббиоло, возделываемый на холмах Ланге в Пьемонте, есть источник таких прославленных вин, как Бароло и Барбареско. Пьемонтские вина вывозятся по всей Европе, принося великую прибыль."
 sav_casa_savoia: "Власть дома Савойского"
 sav_casa_savoia_desc: "Правление дома Савойского упрочилось, и его власть ныне широко признана внутри страны и за рубежом. Законное, устойчивое правление есть основа, кая возвышает Савойю до значительной итальянской державы."
 sav_ordinanza_piedmontese: "Ordinanza Piemontese"
 sav_ordinanza_piedmontese_desc: "В XV веке Савойя утвердила самобытную пехотную тактику — Ordinanza Piemontese — выкованную в альпийском высокогорье. Дисциплинированные пикинёрские строи есть хребет военной силы Савойи."
 sav_university_of_turin: "Туринский университет"
 sav_university_of_turin_desc: "Основанный в 1404 году, Туринский университет служит духовным сердцем Пьемонта, обучая праву, медицине и богословию. Духовное наследие Савойи поддерживает расцвет культуры Возрождения."
 sav_corsica_seized: "Корсика занята"
 sav_corsica_seized_desc: "Занятие Корсики, долго правимой Генуей, значительно продвигает правление Савойи над западным Тирренским морем."
 sav_towers_of_sardinia: "Башни Сардинии"
 sav_towers_of_sardinia_desc: "Со времён Средневековья бесчисленные сторожевые башни (Torre Costiera) выстраиваются вдоль сардинского побережья. Развитие и укрепление этих оборонительных сооружений защищает Сардинию от пиратских набегов."
 sav_cagliari_development: "Развитие Кальяри"
 sav_cagliari_development_desc: "Развей Кальяри, столицу Сардинии, в важный портовый город и торговый узел западного Средиземноморья."
 sav_tyrrhenian_sea: "Владыка Тирренского моря"
 sav_tyrrhenian_sea_desc: "Заняв и Корсику, и Сардинию, и построив мощный флот, Савойя утвердила полное владычество над Тирренским морем. Торговля западного Средиземноморья попадает под савойскую защиту."
 sav_languedoc: "Владычество над Лангедоком"
 sav_languedoc_desc: "Занятие Лангедока, ключевого пункта Южной Франции. Занятие двух великих городов Монпелье и Тулузы становится опорным пунктом для владычества над всей Южной Францией."
 sav_gascony: "Гасконь занята"
 sav_gascony_desc: "Гасконь, вокруг Бордо, — богатая виноградарская земля, обращённая к Атлантике. Разорви её долгую историческую связь с Англией и добавь эту землю к савойской территории."
 sav_lyon_gateway: "Врата Лиона"
 sav_lyon_gateway_desc: "Расположенный при слиянии Роны и Соны, Лион — торговый узел, связующий Южную и Северную Францию. Занятие этого города открывает путь во внутреннюю Францию."
 sav_loire_valley: "Долина Луары"
 sav_loire_valley_desc: "Долина Луары — «Сад Франции» — где некогда стояли замки французской королевской семьи. Занятие Нанта и Тура означает завоевание западно-центральной Франции."
 sav_normandy_coast: "Нормандское побережье"
 sav_normandy_coast_desc: "Занятие Нормандии, исторического берега, где некогда высадились норманны. Руан, в сердце этой богатой земли, — ключевой пункт Северной Франции и последний рубеж перед Парижем."
 STATIC_MODIFIER_NAME_sav_woolens_of_piedmont_mod: "Пьемонтская шерстяная промышленность"
 STATIC_MODIFIER_DESC_sav_woolens_of_piedmont_mod: "Пьемонт был превосходным шерстяным регионом, чьи овцы держались на высоких альпийских лугах. Округ Биелла в особенности был известен со Средневековья до наших дней одним из лучших источников Европы шерсти и тонкого сукна, и «пьемонтская шерсть» стояла рядом с английской шерстью знаком высшего качества."
 STATIC_MODIFIER_NAME_sav_nebbiolo_vineyards_mod: "Виноградники Неббиоло"
 STATIC_MODIFIER_DESC_sav_nebbiolo_vineyards_mod: "Из винограда Неббиоло, возделываемого на холмах Ланге в Пьемонте, рождаются Бароло, «король вин», и Барбареско, «вино королевы». Записи о его возделывании восходят к XIII веку, и его ценили даже при савойском дворе — гордость Пьемонта, всё ещё любимая по всему миру вершиной итальянского вина."
 STATIC_MODIFIER_NAME_sav_casa_savoia_mod: "Власть дома Савойского"
 STATIC_MODIFIER_DESC_sav_casa_savoia_mod: "Дом Савойский — одна из наиболее долговечных династий Европы, ведущая своё происхождение от Умберто Белорукого в XI веке. Его более чем семисотлетнее выживание «старейшей династией», наконец ставшей королевским домом Королевства Италия, являет выносливость, редкую в истории европейских королевских домов."
 STATIC_MODIFIER_NAME_sav_ordinanza_piedmontese_mod: "Ordinanza Piemontese"
 STATIC_MODIFIER_DESC_sav_ordinanza_piedmontese_mod: "«Ordinanza Piemontese», организованная герцогством Савойя в XV веке, была дисциплинированной постоянной военной системой, сосредоточенной на пикинёрской пехоте. Опираясь на тактику швейцарских наёмников, добавляя собственные усовершенствования, она стала основой позднейшего сардинской армии и предвестником армий, кои провели войны объединения Рисорджименто."
 STATIC_MODIFIER_NAME_sav_university_of_turin_mod: "Влияние Туринского университета"
 STATIC_MODIFIER_DESC_sav_university_of_turin_mod: "Основанный в 1404 году, Туринский университет — один из старейших университетов Северной Италии. Начав с трёх факультетов — права, медицины и богословия — он позже произвёл значительных умов, таких как Чезаре Беккариа (реформатор уголовного права) и Лагранж (математик), и стал духовным сердцем просвещённого Пьемонта."
 STATIC_MODIFIER_NAME_sav_corsica_seized_mod: "Корсика занята"
 STATIC_MODIFIER_DESC_sav_corsica_seized_mod: "Корсика — ключ к западному Средиземноморью, кою Генуя правила с 1284 года. Когда Генуя продала её Франции в 1768 году, Наполеон Бонапарт родился в следующем году «французом» — ирония истории. Занятие этого острова обеспечило бы владычество над западным Тирренским морем."
 STATIC_MODIFIER_NAME_sav_towers_of_sardinia_mod: "Башни Сардинии"
 STATIC_MODIFIER_DESC_sav_towers_of_sardinia_mod: "Вдоль побережий Сардинии разбросаны «torri costiere» (прибрежные башни), построенные со Средневековья до раннего Нового времени. Эта оборонительная система, воздвигнутая для наблюдения за берберийскими набегами, на своей вершине насчитывала более сотни башен и служила сетью тревоги, предупреждающей островитян об опасности."
 STATIC_MODIFIER_NAME_sav_cagliari_development_mod: "Процветание Кальяри"
 STATIC_MODIFIER_DESC_sav_cagliari_development_mod: "Кальяри (Каралис) — портовый город, основанный финикийцами, и важный административный центр римской эпохи. Как столица Сардинии, в середине Средиземноморья, он стал торговым узлом с Тунисом, Испанией и Италией и оставался ключевым пунктом западносредиземноморской торговли под арагонским правлением."
 STATIC_MODIFIER_NAME_sav_tyrrhenian_sea_mod: "Владыка Тирренского моря"
 STATIC_MODIFIER_DESC_sav_tyrrhenian_sea_mod: "Тирренское море — внутреннее море Средиземноморья, окружённое итальянским полуостровом, Сицилией, Корсикой и Сардинией — историческое море, на коем торговали древние финикийцы, греки и римляне. Владычество над Корсикой и Сардинией позволяет владычествовать над всем этим внутренним морем и обрести опорный пункт для продвижения в восточное Средиземноморье."
 STATIC_MODIFIER_NAME_sav_languedoc_mod: "Владычество над Лангедоком"
 STATIC_MODIFIER_DESC_sav_languedoc_mod: "Лангедок («земля языка ок») обозначает окситаноязычный регион Южной Франции. Этот регион, со столицей Тулузой, гордился собственной культурой, политикой и религией (катаризм), пока не был завоёван французской короной в Альбигойском крестовом походе XIII века. Его тление, вместе с Провансом, ещё тлеет самобытной цивилизацией юга Франции."
 STATIC_MODIFIER_NAME_sav_gascony_mod: "Гасконь занята"
 STATIC_MODIFIER_DESC_sav_gascony_mod: "Гасконь — регион Юго-Западной Франции баскского происхождения, известный атлантическим винным торговым Бордо, портом Байонна и арманьяком. Тесно связанная с Англией со времён брака Элеоноры Аквитанской, она также была последним главным полем битвы Столетней войны."
 STATIC_MODIFIER_NAME_sav_lyon_gateway_mod: "Врата Лиона"
 STATIC_MODIFIER_DESC_sav_lyon_gateway_mod: "Лион (Лугдунум) был основан столицей римской провинции Галлия и есть перекрёсток сообщения. В Средневековье он держал крупнейшие регулярные ярмарки Франции после Шампанских, куда собирались купцы из Италии, Фландрии и Германии. Его положение при слиянии Роны и Соны обеспечило его ранг торгового города географической необходимостью."
 STATIC_MODIFIER_NAME_sav_loire_valley_mod: "Долина Луары"
 STATIC_MODIFIER_DESC_sav_loire_valley_mod: "В долине Луары, «Саду Франции», стоят ренессансные замки, такие как Шамбор, Шенонсо и Амбуаз. Французские короли XV-XVI веков любили этот регион за его более мягкий климат, чем в Париже, богатые запасы и безопасность для обороны. Владычество над этой прекрасной землёй означает удержание центра французской культуры."
 STATIC_MODIFIER_NAME_sav_normandy_coast_mod: "Нормандское побережье"
 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "Нормандия — земля, кою викинги (норманны) получили от французского короля в 911 году. Вторжение Вильгельма Завоевателя в Англию 1066 года, крупнейшее поле битвы Столетней войны, высадка в Нормандии 1944 года — эта земля всегда была поворотом истории. В Руане также была казнена Жанна д’Арк."
 sav_events.3.t: "Образование Сардинии-Пьемонта"
 sav_events.3.d: "Заняв почти всю Сардинию, дом Савойский решил формально принять титул «Король Сардинии». В истории (1720) Савойя обрела Сардинию в результате войны за испанское наследство и основала «Королевство Сардиния». Это двойное королевство Сардиния-Пьемонт станет колыбелью объединения Италии. Через объединение континентального Пьемонта с островом Сардиния это королевство выступит значительной державой Северной Италии."
 sav_events.3.a: "Стань как король Сардинии знаменосцем объединения Италии!"
 sav_franchises: "Савойские вольности"
 sav_franchises_desc: "В средневековом Пьемонте дом Савойский даровал различным городам права городов, известные как «вольности». Через гарантию свободы передвижения, крестьянского освобождения и расширенных торговых прав для купцов эта система оживляет городское соперничество и подъём Пьемонта. Завершение этой миссии позволяет дарование городского права «Савойские вольности» провинциям."
 sav_franchises_unlock_tt: "Городская привилегия «Вольности» становится доступна."
 sav_patria_legis: "Савойя-Валле-д’Аоста"
 sav_patria_legis_desc: "«Patria Legis» сливает унаследованные практики самоуправления Валле-д’Аоста с правительственными идеалами дома Савойского в рациональную правовую структуру, отражающую дух Возрождения. Завершение этой миссии позволяет дарование городского права «Савойя-Валле-д’Аоста» провинциям."
 sav_patria_legis_unlock_tt: "Городская привилегия «Patria Legis» становится доступна."
 franchises: "Вольности"
 franchises_desc: "Городские права, учреждённые домом Савойским, гарантирующие свободу передвижения населения, крестьянское освобождение и расширенные торговые права для купцов."
 patria_legis: "Patria Legis"
 patria_legis_desc: "Городские права, сливающие традиции Валле-д’Аоста с савойскими правовыми принципами, приносящие городское процветание, социальную подвижность и производственную эффективность."
