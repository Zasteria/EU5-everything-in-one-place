l_russian:
 pro_jewel_of_occitania_mission_pack: "Жемчужина Окситании"
 pro_jewel_of_occitania_mission_pack_DESCRIPTION:0 "Как потомки капетингского дома Анжу, графы Прованса держат притязания на Неаполь, Сицилию, Арагон, Венгрию и Иерусалим. Разви Марсель в величайший портовый город Средиземноморья, объедини Окситанию и докажи миру законные наследственные права анжуйской династии. Слава «Царя царей» ждёт."
 pro_jewel_of_occitania_mission_pack_CRITERIA_DESCRIPTION:0 "Как граф Прованса, осуществи наследственные права дома Анжу, объедини Окситанию и завоюй Францию."
 pro_jewel_of_occitania_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы стать Царём царей."
 pro_jewel_of_occitania_mission_pack_BUTTON_DETAILS:0 "Правь миром из Марселя!"
 pro_house_of_anjou: "Честолюбие дома Анжу"
 pro_house_of_anjou_desc: "Капетингский дом Анжу некогда процветал как королевский дом Сицилии, Неаполя и Венгрии, но ныне удерживает лишь графство Прованс на юге Франции. Однако сердце короля Рене хранит мечты о многих королевских притязаниях. Настало время вернуть славу с земли Прованса."
 pro_statutes_of_aix: "Статуты Экса"
 pro_statutes_of_aix_desc: "Экс-ан-Прованс, как столица графства Прованс, развил собственную правовую систему, известную как «Статуты Экса». Утверждение контроля и правовой кодификации открывает два своеобразных учреждения: Генеральные штаты Прованса (Etats de Provence) и Свободный порт Марселя."
 pro_statutes_of_aix_unlock_tt: "Открывает городские привилегии Генеральные штаты Прованса и Свободный порт Марселя."
 pro_sponsor_the_arts: "Покровительствуй искусствам"
 pro_sponsor_the_arts_desc: "Король Рене славится как один из величайших покровителей итальянского Возрождения. Пригласи художников и учёных и сделай Прованс западным центром культуры Возрождения."
 pro_develop_marseille: "Развей Марсель"
 pro_develop_marseille_desc: "Марсель, портовый город, основанный древними греками, — ключевой узел средиземноморской торговли. Развитие этого города знаменует первый шаг Прованса к тому, чтобы стать торговой и морской державой."
 pro_toulon_dockyard: "Верфь Тулона"
 pro_toulon_dockyard_desc: "Тулон, великолепная естественная гавань, — одна из лучших морских позиций Средиземноморья. Возведи здесь великую верфь и арсенал, дабы сделать его домашним портом провансальского флота."
 pro_lords_of_the_rhone: "Владыки Ронского коридора"
 pro_lords_of_the_rhone_desc: "Река Рона — жизненно важный путь сообщения и торговли, связывающий Альпы с Провансом. Полное овладение этим коридором утверждает Прованс неоспоримым владыкой южной Франции."
 pro_avignon_question: "Авиньонский вопрос"
 pro_avignon_question_desc: "Авиньон, престол папства с 1309 по 1377 год, до сих пор существует как папский анклав. Приведи этот город в Прованс дипломатией или завоеванием."
 pro_piqure_de_marseilles: "Пике-де-Марсей"
 pro_piqure_de_marseilles_desc: "«Пике-де-Марсей», искусно простёганная ткань, воплощает утончённое текстильное мастерство Прованса. Расширение производства сукна и тонкой ткани приносит Провансу великое богатство."
 pro_la_marseillaise: "Марсельеза"
 pro_la_marseillaise_desc: "Марш, воспетый добровольцами, отправляющимися из Марселя. Провансальская армия ныне — сильнейшая военная сила Южной Франции."
 pro_claims_of_king_rene: "Притязания короля Рене"
 pro_claims_of_king_rene_desc: "Добрый король Рене был трагически изгнан с неаполитанского престола и отвергнут от арагонской короны. Но законные наследственные права дома Анжу не утрачены. Настало время доказать эти права миру."
 pro_king_of_naples: "Король Неаполя"
 pro_king_of_naples_desc: "Неаполитанский престол — законное наследство дома Анжу. Верни этот престол, вырванный династией Трастамара Арагона, и восстанови анжуйское правление в Южной Италии."
 pro_king_of_sicily: "Король Сицилии"
 pro_king_of_sicily_desc: "Великое Королевство Сицилия, некогда построенное норманнами, также было унаследовано домом Анжу. Верни Сицилию вновь под знамя Прованса."
 pro_king_of_aragon: "Король Арагона"
 pro_king_of_aragon_desc: "Арагонский престол удерживает величайший соперник дома Анжу. Отомсти династии Трастамара, укравшей Неаполь, и захвати господство над Иберийским полуостровом."
 pro_king_of_hungary: "Король Венгрии"
 pro_king_of_hungary_desc: "Дом Анжу некогда правил как королевский дом Венгрии. Верни этот престол, утраченный в конце XIV века, и утверди влияние над Восточной Европой."
 pro_king_of_jerusalem: "Король Иерусалима"
 pro_king_of_jerusalem_desc: "Титул «Король Иерусалима» давно оспаривается домом Анжу. Положи конец этому пустому титулу, действительно завоевав Святой город и став защитником христианского мира."
 pro_integrate_lorraine: "Включи Лотарингию"
 pro_integrate_lorraine_desc: "Герцогство Лотарингия — один из немногих титулов, кои удалось удержать дому Анжу. Объедини различные фракции и приведи Лотарингию полностью под провансальский контроль."
 pro_join_the_empire: "Вступи в Империю"
 pro_join_the_empire_desc: "Вступление в Священную Римскую империю — мудрый дипломатический выбор, дабы укрыть Прованс от угроз великих держав. В качестве альтернативы, возглавить Империю как эрцгерцог также возможно."
 pro_unite_occitania: "Объедини Окситанию"
 pro_unite_occitania_desc: "Окситаноязычный народ Южной Франции истощён Альбигойским крестовым походом и Столетней войной. Объедини Окситанию под знаменем графов Прованса и освободи их от французского владычества."
 pro_gascony: "Гасконь"
 pro_gascony_desc: "Гасконь, сосредоточенная вокруг Бордо, — богатая земля с историческими узами с Англией. Контроль над Тулузой и Бордо захватывает всю Южную Францию."
 pro_king_of_france: "Король Франции"
 pro_king_of_france_desc: "Королевство Франция долго было соперником Прованса, но настало время захватить его престол. Завоюй Париж и подними анжуйское знамя над всей Францией."
 pro_king_of_kings: "Царь царей"
 pro_king_of_kings_desc: "Дом Анжу завоевал Неаполь, Сицилию, Арагон, Венгрию, Иерусалим и Францию. Эта империя, носящая множество корон, правима Царём царей — средневековая мечта, ставшая явью."
 STATIC_MODIFIER_NAME_pro_statutes_of_aix_mod: "Статуты Экса"
 STATIC_MODIFIER_DESC_pro_statutes_of_aix_mod: "Графы Прованса, обосновавшиеся в Экс-ан-Провансе, разработали собственный свод законов, опирающийся на традиции римского права. Этот писаный закон кодифицировал права и обязанности дворянства, духовенства и бюргеров, сделав Прованс одним из самых юридически передовых регионов средневековой Франции."
 STATIC_MODIFIER_NAME_pro_sponsor_the_arts_mod: "Покровительство искусствам"
 STATIC_MODIFIER_DESC_pro_sponsor_the_arts_mod: "Сам король Рене владел кистью и слагал стихи — редкий правитель-художник. Его двор унаследовал трубадурскую традицию Прованса, привлекая художников из Фландрии и Италии. Немалая часть его репутации «доброго короля Рене» покоится на этом необычайном культурном покровительстве."
 STATIC_MODIFIER_NAME_pro_marseille_mod: "Процветание Марселя"
 STATIC_MODIFIER_DESC_pro_marseille_mod: "Основанный как Массалия греческими колонистами из Фокеи около 600 года до н.э., Марсель служит средиземноморским торговым узлом со времён древности. Во время крестовых походов он служил главным пунктом сбора людей и снаряжения, направляемых в Святую землю. Этот древний портовый город — экономическое сердце Прованса."
 STATIC_MODIFIER_NAME_pro_toulon_dockyard_mod: "Верфь Тулона"
 STATIC_MODIFIER_DESC_pro_toulon_dockyard_mod: "Тулонская бухта, великолепная естественная гавань, укрытая холмами, давала пристанище морякам со времён древности. Графы Прованса развили эту природную твердыню как морскую базу в XV веке. Людовик XIV позже построит здесь один из величайших морских арсеналов Европы — наследие, уже пускающее корни."
 STATIC_MODIFIER_NAME_pro_lords_of_the_rhone_mod: "Владыки Ронского коридора"
 STATIC_MODIFIER_DESC_pro_lords_of_the_rhone_mod: "Река Рона служит великой артерией, связующей Средиземноморье с внутренней Францией, со времён Рима. Вдоль этого водного пути стоят Арль, Авиньон и бесчисленные торговые города, через кои века текли товары, армии и паломники. Владеть этим коридором — значит держать стратегическое сердце Прованса."
 STATIC_MODIFIER_NAME_pro_avignon_question_mod: "Авиньон включён"
 STATIC_MODIFIER_DESC_pro_avignon_question_mod: "С 1309 по 1377 год семь пап пребывали в Авиньоне, а не в Риме, в том, что стало известно как «Авиньонское пленение пап». Этот своеобразный эпизод превратил Авиньон в один из величайших дипломатических городов Европы. Память о папском дворе всё ещё живёт в этом городе — захватить его несёт глубокий символический вес для католического мира."
 STATIC_MODIFIER_NAME_pro_piqure_de_marseilles_mod: "Пике-де-Марсей"
 STATIC_MODIFIER_DESC_pro_piqure_de_marseilles_mod: "«Пике-де-Марсей», простёганная ткань с искусными швами на обеих сторонах, прокатилась по Европе в XVII и XVIII веках. Её корни лежат в искусных средневековых текстильщиках Прованса. Тонкая ткань, вывозимая через порт Марселя, давно составляет краеугольный камень торговой репутации Прованса."
 STATIC_MODIFIER_NAME_pro_la_marseillaise_mod: "Марсельеза"
 STATIC_MODIFIER_DESC_pro_la_marseillaise_mod: "Песня, воспетая марсельскими добровольцами, шагавшими к Парижу во время Революции, однажды станет национальным гимном Франции. Но воинский дух Прованса ещё древнее — закалённый в турнирных ареналах Арля, в крестовых походах и бесчисленных походах под анжуйским знаменем по всему Средиземноморью."
 STATIC_MODIFIER_NAME_pro_claims_of_king_rene_mod: "Притязания короля Рене"
 STATIC_MODIFIER_DESC_pro_claims_of_king_rene_mod: "«Добрый король Рене» держал притязания на Неаполь, Сицилию, Арагон, Венгрию и Иерусалим, однако проиграл почти все свои войны. Тем не менее, его упорное отстаивание этих титулов — поддерживаемое десятилетиями дипломатии и художественного покровительства — сохраняло легитимность анжуйской династии живой при дворах Европы."
 STATIC_MODIFIER_NAME_pro_king_of_naples_mod: "Титул Короля Неаполя"
 STATIC_MODIFIER_DESC_pro_king_of_naples_mod: "Анжуйское Королевство Неаполь, основанное Карлом I Анжуйским в 1266 году, было некогда господствующей державой Южной Италии. Хотя Сицилия была утрачена в Сицилийской вечерне, Неаполь оставался жемчужиной французских притязаний в Италии и самым осязаемым символом анжуйской власти на полуострове."
 STATIC_MODIFIER_NAME_pro_king_of_sicily_mod: "Титул Короля Сицилии"
 STATIC_MODIFIER_DESC_pro_king_of_sicily_mod: "Сицилийская вечерня 1282 года — когда островитяне восстали и перебили своих французских правителей под звон церковных колоколов — навсегда изгнала Анжу с Сицилии и привела арагонцев. Но этот остров, где некогда вместе расцвели норманнская, арабская и византийская культуры, остаётся величайшей незавершённой мечтой Анжу."
 STATIC_MODIFIER_NAME_pro_king_of_aragon_mod: "Титул Короля Арагона"
 STATIC_MODIFIER_DESC_pro_king_of_aragon_mod: "Корона Арагона построила средиземноморскую империю, охватывающую Сицилию, Сардинию и Неаполь — и сделала это в основном за счёт Анжу. Более века соперничества между этими двумя династиями формировало политику западного Средиземноморья. Захватить корону Арагона из рук Трастамара — высшая месть."
 STATIC_MODIFIER_NAME_pro_king_of_hungary_mod: "Титул Короля Венгрии"
 STATIC_MODIFIER_DESC_pro_king_of_hungary_mod: "Когда Карл Роберт (Кароберт) Анжуйский стал королём Венгрии в 1310 году, ветвь семьи утвердилась в Центральной Европе как великая держава. Под анжуйской династией Венгрия пережила один из своих самых процветающих периодов, прежде чем Габсбурги и османы перекроили регион."
 STATIC_MODIFIER_NAME_pro_king_of_jerusalem_mod: "Титул Короля Иерусалима"
 STATIC_MODIFIER_DESC_pro_king_of_jerusalem_mod: "Когда Готфрид Бульонский привёл Первый крестовый поход к победе в 1099 году, родилось Королевство Иерусалим. Утраченное Саладином в 1187 году и никогда полностью не возвращённое, титул «Король Иерусалима» стал пустым притязанием, передаваемым между европейскими династиями. Дом Анжу долго держал этот титул — теперь он становится реальностью."
 STATIC_MODIFIER_NAME_pro_integrate_lorraine_mod: "Лотарингия включена"
 STATIC_MODIFIER_DESC_pro_integrate_lorraine_mod: "Лотарингия остаётся спорным пограничьем со времён Верденского договора, разделившего империю Карла Великого. Отец Рене I, Людовик II, держал герцогство Лотарингия, и сам Рене был герцогом Лотарингии прежде, чем унаследовал Прованс. Это древнее герцогство связывает французский и германский миры."
 STATIC_MODIFIER_NAME_pro_join_the_empire_mod: "Имперская дипломатия"
 STATIC_MODIFIER_DESC_pro_join_the_empire_mod: "Священная Римская империя долго граничила с Провансом, и через Лотарингию дом Анжу уже имеет узы с имперским миром. Будь то вступление членом или предводительство эрцгерцогом, встраивание Прованса в сложную сеть союзов Империи значительно расширяет его дипломатическую досягаемость."
 STATIC_MODIFIER_NAME_pro_unite_occitania_mod: "Объединение Окситании"
 STATIC_MODIFIER_DESC_pro_unite_occitania_mod: "Окситаноязычный юг был некогда домом трубадуров — поэтов, изобретших искусство куртуазной любви, чьи песни распространились по Европе. Альбигойский крестовый поход XIII века и Столетняя война разбили этот мир. Объединить Окситанию под Провансом — значит вновь разжечь утраченную цивилизацию."
 STATIC_MODIFIER_NAME_pro_gascony_mod: "Гасконь захвачена"
 STATIC_MODIFIER_DESC_pro_gascony_mod: "Гасконь, сосредоточенная вокруг великого винного порта Бордо, была последним значительным континентальным владением Англии — удерживаемым три века, прежде чем была утрачена в 1453 году. Богатая вином, шерстью и атлантической торговлей, эта область всегда была желанным призом. Вырвать её из английского влияния завершает южную дугу провансальской Франции."
 STATIC_MODIFIER_NAME_pro_king_of_france_mod: "Титул Короля Франции"
 STATIC_MODIFIER_DESC_pro_king_of_france_mod: "Капетингская династия Франции и её анжуйская побочная ветвь разделяют общую кровь — однако их пути разошлись, когда Карл Анжуйский отплыл на юг, дабы завоевать Сицилию. Ныне побочная ветвь захватывает престол главной линии. «Христианнейший король» Франции, старший сын Церкви, носит самую почётную корону католического христианского мира."
 STATIC_MODIFIER_NAME_pro_king_of_kings_mod: "Царь царей"
 STATIC_MODIFIER_DESC_pro_king_of_kings_mod: "Неаполь, Сицилия, Арагон, Венгрия, Иерусалим, Франция — ни одна средневековая династия никогда не носила столько корон одновременно. Дом Анжу возвысился от малого провансальского графства до империи, простирающейся от Средиземноморья до Дуная. Мечта «доброго короля Рене» — отвергнутая как неосуществимая фантазия — ныне исполнена."
 pro_events.2.t: "Притязания короля Рене"
 pro_events.2.d: "Настало время провозгласить законные наследственные права дома Анжу. Королевство Неаполь было некогда анжуйским, но было утрачено при поражении от арагонских сил Альфонсо V. Ныне, во имя короля Рене, мы оспариваем эту несправедливую оккупацию. Получи casus belli против Неаполя и докажи законность дома Анжу силой оружия."
 pro_events.2.a: "Неаполь принадлежит дому Анжу!"
 pro_lorraine_marriage: "Брак с Лотарингией"
 pro_lorraine_marriage_desc: "Герцогство Лотарингия — один из титулов, кои некогда держал дом Анжу. Углуби связи с домом Лотарингия через дипломатический брак и союз, открывая путь к его пожалованию. Утверди отношения с Лотарингией через кровь, брак или союз."
 pro_events.3.t: "Правление Роберта Мудрого"
 pro_events.3.d: "В 1337 году Провансом правит Роберт Анжуйский (Roberto d’Angiò, ок. 1277–1343), прославленный как «Мудрый». Как король Неаполя, титулярный король Иерусалима и граф Прованса, он стоит центральной фигурой итальянской политики. Поборник гвельфской (папской) партии, отразивший имперские вторжения, в 1336 году он изгнал Иоанна Богемского из Италии. Глубокий любитель искусств и учёности, уважаемый и Петраркой, и Боккаччо, Роберт принёс культурный золотой век Неаполю и Провансу. Но последние его годы омрачены неудачей вернуть Сицилию и кризисом престолонаследия. Наследница Роберта, Джованна, молода, и будущее дома Анжу неопределённо. Настало время продолжить волю этого великого короля и восстановить славу дома Анжу."
 pro_events.3.a: "Продолжить волю короля Роберта и восстановить славу Анжу!"
 pro_events.4.t: "Брак с Лотарингией"
 pro_events.4.d: "Через дипломатическое маневрирование и брачную политику наши отношения с герцогством Лотарингия стали крепче, чем когда-либо прежде. По мере того как анжуйская и лотарингская кровь переплетаются, интересы обоих домов глубоко связаны. Настало время принять герцога Лотарингии как вассала Прованса и обратить его средства и военную мощь на службу анжуйскому делу."
 pro_events.4.a: "Принять герцога Лотарингии как вассала"
 pro_events.4.b: "Сохранить независимость, поддерживая союз"
 pro_events.5.t: "Образование Королевства Иерусалим"
 pro_events.5.d: "Святой город Иерусалим наконец пришёл под знамя Прованса. Дом Анжу ныне держит титул «Король Иерусалима» и на словах, и на деле, продолжая крестоносную традицию. Восстанови Королевство Иерусалим (KOJ) в ключевых позициях Леванта и позволь ему управляться как вассалу Прованса. Это священное королевство, впервые основанное Первым крестовым походом в 1099 году, возрождено рукой дома Анжу. Как защитник католической веры, обороняй Святую землю от исламских сил."
 pro_events.5.a: "Восстановить Королевство Иерусалим и позволить ему управляться как анжуйскому вассалу!"
 pro_etats_de_provence_town_rights: "Генеральные штаты Прованса"
 pro_etats_de_provence_town_rights_desc: "Генеральные штаты Прованса, в коих участвуют дворянство, духовенство и бюргеры. Укрепляют три сословия и гарантируют региональную автономию и совещательное правление. Также улучшает эффективность кабинета."
 pro_marseille_free_port_town_rights: "Свободный порт Марселя"
 pro_marseille_free_port_town_rights_desc: "Объявляет Марсель свободным портом. Значительно расширяет торговые права купцов и повышает рост населения, процветание и власть бюргеров. Может быть даровано только Марселю."
 pro_events.6.t: "Разрешение Авиньонского вопроса"
 pro_events.6.d: "Авиньон стоял папским анклавом внутри провансальских земель с тех пор, как папство поселилось там в 1309 году. Когда папа Григорий XI вернулся в Рим в 1377 году, город остался как папский оплот, вбивая клин в провансальские земли, что граф Прованса долго негодовал. Ныне, с урегулированными отношениями с папством, представилась возможность разрешить авиньонский вопрос мирным путём. Папа соглашается уступить Авиньон Провансу в обмен на надлежащую компенсацию."
 pro_events.6.a: "Авиньон принадлежит Провансу"
