l_russian:
 som_ottoman_mission_pack_desc: "От пограничного бейлика до могущественнейшего султаната мира. Объедини Анатолию, перейди в Румелию и заяви права на Константинополь — вечный город, коему быть твоим престолом."
 som_tur_secure_bursa: "Обеспечь Бурсу"
 som_tur_secure_bursa_desc: "Бурса, первый великий город османов, должна твёрдо находиться под контролем династии. Утверди порядок и построй основу прочного государства."
 som_tur_frontier_warriors: "Выкуй пограничных воинов"
 som_tur_frontier_warriors_desc: "Воины-гази, кои выковали наш бейлик, должны быть связаны с династией. Их боевой дух — наше величайшее оружие."
 som_tur_cross_the_straits: "Пересеки проливы"
 som_tur_cross_the_straits_desc: "Обеспечь Чанаккале и открой путь в Европу. В награду будет дарован casus belli для завоевания провинции Галлиполи."
 som_tur_anatolian_heartland: "Объедини Анатолию"
 som_tur_anatolian_heartland_desc: "Обеспечь Анкару и утверди курс её развития как сердца Анатолии. Что произведёт эта земля, определит будущее Империи."
 som_ottoman_events.18.t: "Сердце Анатолии — будущее Анкары"
 som_ottoman_events.18.d: "Анкара, коренной город Анатолии, попала под контроль Империи. Двор спорит, какая отрасль должна определить будущее этого региона: усовершенствовать её долгую традицию ткачества, посадить тутовые деревья для шелководства, или продвигать возделывание ярких красильных культур."
 som_ottoman_events.18.a: "Продолжить развитие ткацкой промышленности"
 som_ottoman_events.18.b: "Посадить тутовые деревья и начать производство шёлка"
 som_ottoman_events.18.c: "Продвигать возделывание красильных культур"
 som_tur_vassalize_beyliks: "Покорение бейликов"
 som_tur_vassalize_beyliks_desc: "Прочие анатолийские бейлики должны склонить колени или быть сокрушены. Лишь объединённая Анатолия может бросить вызов державам востока и запада."
 som_tur_siege_constantinople: "Падение Константинополя"
 som_tur_siege_constantinople_desc: "Вечный город, престол Восточной Римской империи, должен пасть перед османской пушкой и сталью. Его завоевание возвестит миру о нашей империи. Население города будет преображено под османским правлением."
 STATIC_MODIFIER_NAME_som_tur_ghazi_warriors: "Воины-гази"
 STATIC_MODIFIER_DESC_som_tur_ghazi_warriors: "«Гази» — титул того, кто сражается против неверных во имя ислама. От Османа Гази, основателя династии, пограничные воины неуклонно продвигались в ослабевшие приграничья Византии с этим священным чувством миссии. Этот религиозный пыл был духовным двигателем османской экспансии."
 som_ottoman_events.1.t: "Бурса — колыбель османов"
 som_ottoman_events.1.d: "Бурса, Изник и Никомедия пали в османские руки. В Бурсе греческие православные, армянские, еврейские и турецкие мусульманские общины живут бок о бок под новой династией. Двор султана ныне стоит перед вопросом: как следует включить эти разные народы в османское государство?"
 som_ottoman_events.1.a: "Объединить их под знаменем ислама и турецкой традиции"
 som_ottoman_events.1.a.tt: "Многие жители Бурсы обратятся в суннизм и примут турецкую культуру."
 som_ottoman_events.4.t: "Падение Константинополя"
 som_ottoman_events.4.d: "Константинополь пал. Последний император Византии, Константин XI, пал в бою на стенах, и войска Мехмеда II вошли в город. Там, где некогда звонили колокола Святой Софии, ныне звучит призыв к молитве. Султан провозглашает город переименованным в Костантинийе и объявляет его новой имперской столицей."
 som_ottoman_events.4.a: "Преобразить город в османскую столицу"
 som_ottoman_events.4.a.tt: "Большинство жителей Константинополя обратятся в суннизм и примут турецкую культуру."
 som_tur_conquer_bulgaria: "Завоюй Болгарию"
 som_tur_conquer_bulgaria_desc: "Тырново было славной столицей Второго Болгарского царства. Возьми этот город и открой путь на север."
 som_tur_conquer_serbia: "Завоюй Сербию"
 som_tur_conquer_serbia_desc: "Ново-Брдо содержит величайшие серебряные копи Балкан, тогда как Скопье — врата в Македонию. Обеспечь оба города, дабы привести южную Сербию под османский контроль."
 som_tur_conquer_hungary: "Вторгнись в Венгрию"
 som_tur_conquer_hungary_desc: "Разгроми венгерское полевое войско при Мохаче и займи Буду. Дунай станет северной границей Османской империи."
 som_tur_siege_vienna: "Осада Вены"
 som_tur_siege_vienna_desc: "Водрузи османское знамя перед стенами Вены. Мир станет свидетелем мощи Османской империи."
 som_tur_anatolia_unified: "Единство Анатолии"
 som_tur_anatolia_unified_desc: "Завоюй Трапезунд и Эрзурум, дабы привести всю Анатолию под османское правление. Понтийские горы отметят восточную границу империи."
 som_tur_conquer_syria: "В Сирию"
 som_tur_conquer_syria_desc: "Завоюй Алеппо и Дамаск. Сирия — сердце исламской учёности и торговли; её захват поднимает престиж империи."
 som_tur_defeat_mamluks: "Разгроми мамлюков"
 som_tur_defeat_mamluks_desc: "Пока идёт война с мамлюками, займи Каир, дабы вынудить благоприятный мир. С занятым Каиром мамлюков можно принудить принять вассалитет."
 som_tur_holy_cities: "Святые города"
 som_tur_holy_cities_desc: "Обеспечь Иерусалим и провозгласи султана халифом. Как страж двух святых городов, османы стоят на вершине исламского мира."
 som_tur_red_sea_dominance: "Господство над Красным морем"
 som_tur_red_sea_dominance_desc: "Обеспечь Александрию и овладей торговыми путями Красного моря. Богатство торговли Индийского океана наполняет османскую казну."
 som_tur_age_of_suleiman: "Pax Ottomana"
 STATIC_MODIFIER_NAME_som_tur_danube_frontier: "Дунайская граница"
 STATIC_MODIFIER_DESC_som_tur_danube_frontier: "Дунай утверждён северной границей, и уроки османской армии, стоявшей перед вратами Вены, запечатлены в имперской доктрине."
 STATIC_MODIFIER_NAME_som_tur_anatolia_unified_mod: "Анатолия объединена"
 STATIC_MODIFIER_DESC_som_tur_anatolia_unified_mod: "От Трапезунда до Эрзурума вся Анатолия под османским контролем. Восточная основа империи обеспечена, улучшая налоговый доход и легитимность."
 STATIC_MODIFIER_NAME_som_tur_red_sea_trade: "Имперская дорожная сеть"
 STATIC_MODIFIER_DESC_som_tur_red_sea_trade: "Красное море было золотым путём, коим пряности, шелка и краски Индии и Юго-Восточной Азии шли в Европу. Даже после того, как Португалия открыла новый путь вокруг южной оконечности Африки, красноморский путь через Каир и Александрию сохранял свою ценность, и Османская империя стала величайшим бенефициаром этого торгового пути."
 som_tur_fate_of_crimea: "Судьба Крыма"
 som_tur_fate_of_crimea_desc: "Крымский полуостров с генуэзским торговым постом Каффа в его сердце контролирует торговлю вдоль северного Чёрного моря. Обеспечь этот регион и приведи черноморскую торговлю под османский контроль."
 som_tur_black_sea_dominance: "Владычество над Чёрным морем"
 som_tur_black_sea_dominance_desc: "С обеспеченным Крымом, укреплённым Эдирне и объединённой Анатолией, Чёрное море стало османским озером. Разви сырьевой ресурс Константинополя и утверди полную гегемонию над Чёрным морем."
 som_tur_italy_south: "Южная Италия"
 som_tur_italy_south_desc: "Завоюй Неаполь и Сицилию, дабы захватить центр Средиземноморья. Эти древние торговые города наполнят имперскую казну."
 som_tur_italy_north: "Италия завоёвана"
 som_tur_italy_north_desc: "Завоюй Рим, Флоренцию и Милан, дабы завершить завоевание итальянского полуострова. Город папы, город Медичи, город Висконти — все становятся султанскими."
 som_tur_arabia_conquest: "Овладей Аравией"
 som_tur_arabia_conquest_desc: "Обеспечь Мекку, Медину и Суэц, дабы контролировать святые города исламского мира и врата в Индийский океан."
 som_tur_persian_gulf: "Персидский залив"
 som_tur_persian_gulf_desc: "Захвати Ормуз и овладей торговыми путями Персидского залива. Богатство торговли Индийского океана течёт в османскую казну."
 som_tur_north_africa: "Магриб"
 som_tur_north_africa_desc: "Завоюй Тунис, Алжир и Триполи, дабы привести южное средиземноморское побережье под османское правление. Берберийские корсары склоняются перед знаменем султана."
 som_tur_morocco: "Марокко"
 som_tur_morocco_desc: "Завоюй Фес и Марракеш, дабы добавить всю Северную Африку к Османской империи. Берега Атлантики становятся западной границей империи."
 som_tur_age_of_suleiman_desc: "От Вены на севере до Аравии и Марокко на юге — мировая империя, охватывающая три континента, завершена. Требует завершения Осады Вены, Персидского залива и Марокко."
 STATIC_MODIFIER_NAME_som_tur_black_sea_master: "Владыка Чёрного моря"
 STATIC_MODIFIER_DESC_som_tur_black_sea_master: "Чёрное море ныне османское озеро. В свете этого достижения двор обсуждает введение новых правящих учреждений, открывая простор для новой реформы."
 STATIC_MODIFIER_NAME_som_tur_italy_south_mod: "Южно-итальянское владычество"
 STATIC_MODIFIER_DESC_som_tur_italy_south_mod: "Контролируя Неаполь и Сицилию, центральное Средиземноморье перешло в османские руки. Торговый доход и дипломатическая репутация улучшены."
 STATIC_MODIFIER_NAME_som_tur_arabia_mod: "Страж Аравии"
 STATIC_MODIFIER_DESC_som_tur_arabia_mod: "«Хранитель Двух Святых Мечетей» — Мекка и Медина суть две святейшие места ислама. В 1517 году Селим I завоевал Египет и Хиджаз и взял эти места в свои руки, и османский султан стал религиозным защитником всего суннитского мусульманского мира. Долг и честь охраны ежегодного паломничества хаджа возложены были на султана."
 STATIC_MODIFIER_NAME_som_tur_gulf_trade: "Торговое господство в Персидском заливе"
 STATIC_MODIFIER_DESC_som_tur_gulf_trade: "Ормузский пролив — единственные врата, коими пряности и шелка Индии и Юго-Восточной Азии проходят в Персидский залив. Владеть этой «горловиной мира» стало бы решающим козырем против индийского торгового пути, кой Португалия стремилась установить вокруг Африки."
 STATIC_MODIFIER_NAME_som_tur_africa_final_mod: "Африканская гегемония"
 STATIC_MODIFIER_DESC_som_tur_africa_final_mod: "Северная Африка завоёвана. Элитная кавалерия из пустынь и степей присоединяется к османской армии, улучшая мощь и лёгкой, и тяжёлой конницы."
 STATIC_MODIFIER_NAME_som_tur_ankara_fine_cloth: "Ткацкая торговля Анкары"
 STATIC_MODIFIER_DESC_som_tur_ankara_fine_cloth: "В мастерских Анкары традиционные ткацкие приёмы дополнительно совершенствуются, увеличивая производство тонкой ткани."
 STATIC_MODIFIER_NAME_som_tur_ankara_silk: "Шёлковая торговля Анкары"
 STATIC_MODIFIER_DESC_som_tur_ankara_silk: "Тутовые деревья высажены по всем угодьям Анкары, увеличивая производство шёлка."
 STATIC_MODIFIER_NAME_som_tur_ankara_dyes: "Красильная торговля Анкары"
 STATIC_MODIFIER_DESC_som_tur_ankara_dyes: "Возделывание ярких красильных растений распространяется вокруг Анкары, увеличивая производство красителей."
 eyalet: "Эялет"
 eyalet_desc: "Провинциальное вассальное государство Османской империи. Подчинено более строгому контролю, чем вассал, платя двойную дань и подверженное дипломатической аннексии вдвое быстрее."
 eyalet_plural: "Эялеты"
 som_ottoman_events.20.t: "Владычество над Чёрным морем"
 som_ottoman_events.20.d: "Чёрное море было некогда генуэзским озером. Но с падением Каффы в 1475 году и османским контролем над Босфором последний генуэзский оплот исчез. Чёрное море ныне османское озеро. Три века венецианского и генуэзского торгового господства над восточным Средиземноморьем подходят к концу."
 som_ottoman_events.20.a: "Чёрное море — османское озеро"
 som_ottoman_events.30.t: "Врата Вены"
 som_ottoman_events.30.d: "Армия Сулеймана Великолепного достигла Вены. Триста тысяч османских солдат потрясли весь христианский мир. В 1529 году город устоял перед ранней зимой и перерастянутыми линиями снабжения — но на сей раз всё иначе. «Если Вена падёт, Европа наша», — провозглашает султан."
 som_ottoman_events.30.a: "Захватить Вену и стать владыкой Европы"
 som_ottoman_events.99.t: "Эпоха Сулеймана"
 som_ottoman_events.99.d: "Османская империя достигла своей вершины — эпохи Сулеймана Великолепного. От Балкан до Аравии, от Крыма до Северной Африки, владычество, превосходящее даже Рим, склоняется пред волей единого султана. Прозванный «Законодателем» (Кануни) за кодификацию османского права, Сулейман председательствует над величайшим расцветом искусства, архитектуры и военной мощи в истории империи. Мечети, дворцы и базары Стамбула провозглашают славу величайшего города мира. Османская империя стала одной из верховных держав истории."
 som_ottoman_events.99.a: "Начинается золотой век великой Османской империи"
 som_tur_edirne_capital: "Крепость Эдирне"
 som_tur_edirne_capital_desc: "Древний Адрианополь стал Эдирне, когда Мурад I сделал его османской столицей в 1363 году — базой, откуда завоёвывать Балканы. Он оставался имперской столицей почти девяносто лет, пока Константинополь не пал в 1453 году, и здесь родился Мехмед II. Укрепи этот город якорем Румелии и трамплином для завоевания Балкан."
 som_tur_aegean_dominance: "Овладей Эгейским морем"
 som_tur_aegean_dominance_desc: "Эгейское море было полем битвы венецианского и генуэзского торгового соперничества. Захват Смирны краеугольным камнем восточного эгейского побережья и строительство морской силы дают османам плацдарм для всей средиземноморской экспансии. Ранний османский флот должен быть построен с нуля — но вырастет в грозную силу."
 som_tur_janissary_corps: "Корпус янычар"
 som_tur_janissary_corps_desc: "В середине XIV века сын Орхана I, Мурад I, создал янычар — «новых солдат», сформированных из христианских мальчиков, взятых по системе девширме, обращённых в ислам и обученных быть верной постоянной пехотой султана. Регулярно оплачиваемые и строго дисциплинированные, янычары стали хребтом османской армии и сыграли решающую роль в падении Константинополя и бесчисленных других сражениях."
 som_tur_devshirme_system: "Система девширме"
 som_tur_devshirme_system_desc: "Девширме («сбор мальчиков») брала христианскую молодёжь с Балкан, обращала её в ислам и готовила янычарами и дворцовыми чиновниками. Эта система создала класс чиновников, преданных лишь султану, не связанных родовыми или семейными узами. Из этого класса вышли многие величайшие великие визири Империи — люди, поднявшиеся от плена до высшей должности в стране."
 som_tur_elite_guard: "Элитная стража"
 som_tur_elite_guard_desc: "Личная стража султана, отобранная из лучших янычар, была самыми дисциплинированными солдатами империи. Они служили дворцовыми часовыми и несли имперский штандарт в походе. Вложение в строгую подготовку и высокие стандарты создаёт ядро профессиональной боевой силы, кою пронесёт империю к славе."
 som_tur_kanun_i_osmani: "Канун-и Османи"
 som_tur_kanun_i_osmani_desc: "Канун-и Османи («Османский свод законов») был светской правовой системой, развитой наряду с шариатом. Султан «Кануни» (Законодатель) Сулейман I завершил его кодификацию, но основы были заложены в XIV и XV веках. Охватывая налоговое право, уголовное производство и управление, канун дал османскому государству рационализированную правовую структуру, действующую наряду с исламским священным правом — и дополняющую его."
 som_tur_imperial_army: "Имперская армия"
 som_tur_imperial_army_desc: "Янычары, конница сипахи, азапы, лёгкая конница акынджи — османская армия была системой смешанных родов войск, объединяющей несколько типов войск под централизованным командованием. Дисциплинированная, оплачиваемая и всё более вооружённая огнестрельным оружием, османская армия XVI века была одной из грознейших военных машин, кои когда-либо видел мир. Доведи её до полного потенциала."
 som_tur_timar_system: "Система тимаров"
 som_tur_timar_system_desc: "Тимар был основополагающим учреждением землевладения османского государства. Султан жаловал завоёванную землю конникам-сипахи как тимары в обмен на военную службу — сходно с европейским феодализмом, но без наследственных прав. Система тимаров финансировала крупную военную силу, не истощая имперскую казну, делая раннюю османскую экспансию самоокупаемой."
 som_tur_sipahi_cavalry: "Конница сипахи"
 som_tur_sipahi_cavalry_desc: "Сипахи — бронированные конники, финансируемые тимарными земельными пожалованиями — составляли главную ударную силу османской армии в XV и XVI веках. Их громовые атаки страшились по всем Балканам и Анатолии. По мере расширения империи класс сипахи стал могущественной провинциальной аристократией, чьи интересы султан должен был тщательно учитывать."
 som_tur_eyalet_system: "Система эялетов"
 som_tur_eyalet_system_desc: "Эялет («провинция») был крупнейшей административной единицей Османской империи, управляемой бейлербеем, назначаемым прямо султаном. Румелия, Анатолия, Египет, Сирия — каждый эялет был миниатюрной империей со своим воинским контингентом и административным аппаратом. Система распространяла имперскую власть до самых дальних уголков царства, не требуя личного присутствия султана."
 som_tur_grand_vizier: "Великий визирь"
 som_tur_grand_vizier_desc: "Великий визирь (Садразам) был главным управляющим империи, уступающим лишь султану. Его резиденция — «Высокая Порта» (Баб-и Али) — стала синонимом самого османского правительства и была адресом, куда европейские дипломаты представляли свои верительные грамоты. Способный великий визирь мог эффективно управлять империей, позволяя султану сосредоточиться на легитимности и военном командовании."
 som_tur_imperial_bureaucracy: "Имперская бюрократия"
 som_tur_imperial_bureaucracy_desc: "Османская бюрократия — сплав чиновников девширме и традиционных турко-исламских администраторов — была одной из самых утончённых правительственных систем своей эпохи. Документная культура, централизованное делопроизводство и специализированные ведомства (диваны) сделали огромную империю удивительно управляемой. Само количество записей, ведённых османскими писцами, остаётся сокровищницей для историков сегодня."
 som_tur_new_capital: "Развитие Костантинийе"
 som_tur_new_capital_desc: "Мехмед II переименовал завоёванный город в «Костантинийе» и немедленно начал честолюбивую программу перестройки. Принудительное переселение ремесленников и купцов, восстановление инфраструктуры и возрождение рынков преобразили город руин в процветающий мегаполис. Султан потребовал, дабы Костантинийе превзошёл славу византийской столицы, кою он заменил — и направил все ресурсы империи на достижение этого."
 som_tur_new_capital_unlock_tt: "Решение «Перестройка Костантинийе» теперь доступно."
 som_develop_kostantiniyye_decision.title: "Перестройка Костантинийе"
 som_develop_kostantiniyye_decision.desc: "Завоёванная столица выросла, но её кварталы всё ещё несут шрамы осады. Казна султана может оплатить переселение, новые рынки и восстановленные улицы, дабы Костантинийе вновь расцвёл."
 som_develop_kostantiniyye_decision.a: "Вложить средства в восстановление столицы."
 som_expand_kostantiniyye_decision.title: "Привести Костантинийе к великолепию"
 som_expand_kostantiniyye_decision.desc: "Перестройка принесла плоды: новые кварталы заполнили переселенцы и ремесленники. Крупные вложения в мастерские, караван-сараи и земли вокруг города позволят Костантинийе превзойти даже славу византийской столицы."
 som_expand_kostantiniyye_decision.a: "Вложиться в величие города."
 som_tur_grand_bazaar: "Гранд-базар"
 som_tur_grand_bazaar_desc: "Построенный по приказу Мехмеда II между 1455 и 1461 годами, Гранд-базар (Капалычаршы) был одним из первых крытых рынков мира и быстро стал крупнейшим в мире. Четыре тысячи лавок, продающих шёлк, пряности, драгоценности, керамику и оружие, привлекали десятки тысяч покупателей ежедневно. В его центре зал золото- и серебряных купцов — Бедестен — служил торговым сердцем империи."
 som_tur_grand_bazaar_condition_tt: "Использовано решение «Привести Костантинийе к великолепию»"
 som_tur_suleiman_mosque: "Мечеть Сулеймание"
 som_tur_suleiman_mosque_desc: "Спроектированная зодчим-мастером Синаном и завершённая в 1557 году, мечеть Сулеймание — шедевр османской архитектуры. Четыре минарета пронзают горизонт Стамбула; обширный купол господствует над силуэтом города со стороны Босфора. Окружающий комплекс (кюллие) включал коллегии, больницу, лавки и караван-сарай — город внутри города, воплощающий османский идеал имперского покровительства."
 som_tur_topkapi_palace: "Дворец Топкапы"
 som_tur_topkapi_palace_desc: "Дворец Топкапы — стоящий на мысе, повелевающем Босфором, Золотым Рогом и Мраморным морем — служил османским двором четыре века. Покои султана, императорский гарем, казна и зал совета (Диван-и Хумаюн) — все находились внутри его четырёх дворов. Каждый великий визирь назначался и смещался здесь; каждый поход начинался из его тени."
 som_tur_city_of_worlds_desire: "Город мировой мечты"
 som_tur_ulema_authority: "Власть улемов"
 som_tur_ulema_authority_desc: "Улемы — исламские учёные, служившие судьями, правовыми советниками и учителями — придавали османскому государству его религиозную легитимность. Как кадии (судьи), муфтии (правовые консультанты) и профессора медресе, они отправляли правосудие и образование по всей империи. Их одобрение было необходимо для того, дабы любая крупная политика — включая объявления войны — воспринималась мусульманским населением как законная."
 som_tur_millet_system: "Система миллетов"
 som_tur_millet_system_desc: "Система миллетов («нация» или «община») организовала немусульманских подданных Османской империи в полуавтономные религиозные общины. Греческий православный Рум-миллет, армянский миллет и еврейский миллет — каждый имел собственные суды, школы и благотворительные учреждения во главе со своими религиозными главами. Эта замечательная система управляемого плюрализма позволила империи править огромным разнообразием, не требуя принудительного обращения."
 som_tur_kadi_courts: "Суды кадиев"
 som_tur_kadi_courts_desc: "Кадии — судьи, назначаемые прямо султаном — отправляли исламское право по всей империи, от крупных городов до отдалённых деревень. Их судебные записи (сиджиллы) документировали не только правовые споры, но и контракты, земельные акты и общественные взаимоотношения, создавая необычайно подробный портрет османского общества. Система кадиев распространяла верховенство закона — османского закона — до каждого уголка царства."
 som_tur_sufi_culture: "Суфийская культура"
 som_tur_sufi_culture_desc: "Суфийские ордена (тарикаты) были вплетены в ткань османского общества. Орден мевлеви — известный своими кружащимися дервишами — покровительствуемый двором. Орден бекташи — духовный хребет янычар. Орден накшбанди — влиятельный в дворцовой политике. Суфийская мистика формировала османскую поэзию, музыку и искусство, и служила духовным противовесом законническому толкованию ислама."
 som_tur_cultural_synthesis: "Культурный синтез"
 som_tur_cultural_synthesis_desc: "Османская империя поглощала, а не уничтожала культуры, кои завоёвывала. Византийские административные системы, арабская учёность, персидская придворная культура и турецкая воинская традиция слились в самобытную «османскую цивилизацию». Этот культурный синтез не был лишь украшением — он был правящей философией империи, позволяя ей поглощать и использовать энергии десятков покорённых народов."
 som_tur_bursa_silk_industry: "Шёлковая промышленность Бурсы"
 som_tur_bursa_silk_industry_desc: "Бурса, первая османская столица, развилась в шёлковую столицу империи с XIV века и далее. Ремесленники, некогда работавшие под византийским покровительством, нашли новых хозяев при османском дворе, производя роскошные шелка на вывоз по всей Европе и Ближнему Востоку. «Город шёлка» стал самоопределением Бурсы — торговый успех, кой помог финансировать османскую экспансию."
 som_tur_silk_road: "Шёлковый путь"
 som_tur_silk_road_desc: "Трапезунд был западной конечной точкой каспийского торгового пути — каналом, коим шёлк, пряности и предметы роскоши из Средней Азии входили в Анатолию. Контроль над этим портовым городом дал османам мёртвую хватку на сухопутной торговле между Азией и Европой. Одни лишь доходы от торговли, проходящей через Трапезунд, помогали финансировать имперские честолюбия поколениями."
 som_tur_ankara_prosperity: "Процветание Анкары"
 som_tur_ankara_prosperity_desc: "Анкара была центральноанатолийским узлом сухопутной торговли — городом, служившим купцам тысячелетиями. Её ангорская козья шерсть родила роскошное волокно, чьё имя (ангора, позже анкара) стало синонимом мягкости. Красильные растения, обработка шерсти и её положение на пути, связующем Бурсу с Трапезундом, сделали её незаменимым узлом османской торговой сети."
 som_tur_trade_routes: "Имперские торговые пути"
 som_tur_trade_routes_desc: "По мере расширения империи османы вкладывали в караван-сараи (придорожные постоялые дворы), мощёные дороги, мосты и морские патрули против пиратов. Итогом стала торговая инфраструктура, сделавшая сухопутную и морскую торговлю безопаснее и прибыльнее, чем со времён расцвета Римской империи. Константинополь в центре расходящейся торговой сети стал бьющимся экономическим сердцем трёх континентов."
 som_tur_commercial_empire: "Торговая империя"
 som_tur_commercial_empire_desc: "Алеппо, Александрия, Константинополь — три величайших торговых города мира, ныне все османские. Пряности Индии, шелка Китая, серебро Европы — всё проходило через османские руки на пути от производителя к потребителю. Империя брала долю от каждой сделки. Даже когда португальцы открыли морской путь вокруг Африки, османские посредники сохраняли огромный торговый рычаг ещё столетие."
 STATIC_MODIFIER_NAME_som_tur_janissary_mod: "Корпус янычар"
 STATIC_MODIFIER_DESC_som_tur_janissary_mod: "Янычары — элитная постоянная пехота, сформированная из обращённых христианских мальчиков — стали хребтом османской военной силы. Их характерные белые шапки и синие мундиры были самым страшным зрелищем на полях сражений XV века. Их роль в падении Константинополя была решающей."
 STATIC_MODIFIER_NAME_som_tur_devshirme_mod: "Система девширме"
 STATIC_MODIFIER_DESC_som_tur_devshirme_mod: "Девширме создала класс чиновников, преданных лишь султану, не связанных семейными или родовыми узами. Эта меритократическая (по османским меркам) система позволяла людям скромного христианского происхождения подниматься до высших должностей империи — при этом обеспечивая султану всегда альтернативную опору власти против устоявшегося турецкого дворянства."
 STATIC_MODIFIER_NAME_som_tur_elite_guard_mod: "Элитная стража"
 STATIC_MODIFIER_DESC_som_tur_elite_guard_mod: "Отобранная из лучших янычар, личная стража султана была самыми дисциплинированными войсками империи. Они воплощали не только военную мощь, но и символическую власть султаната — их присутствие в походе было заявлением, что особа султана присутствует, даже когда его самого там не было."
 STATIC_MODIFIER_NAME_som_tur_kanun_mod: "Свод законов Кануна"
 STATIC_MODIFIER_DESC_som_tur_kanun_mod: "Канун — светское османское право — действовал наряду с шариатом, создавая двойную правовую систему, охватывающую налоги, уголовное производство и управление. Законодательная власть султана создавать светское право была богословским новшеством, давшим османскому государству гибкость, коей лишены были чисто шариатские государства."
 STATIC_MODIFIER_NAME_som_tur_imperial_army_mod: "Имперская армия"
 STATIC_MODIFIER_DESC_som_tur_imperial_army_mod: "Полностью развитая османская армия — сочетающая янычарскую пехоту, конницу сипахи и самый утончённый артиллерийский обоз в мире — была военным чудом XVI века. Её сочетание дисциплины, огневой мощи и логистической организации делало её способной на походы такого масштаба, кой не могла сравниться ни одна европейская держава."
 STATIC_MODIFIER_NAME_som_tur_timar_mod: "Система тимаров"
 STATIC_MODIFIER_DESC_som_tur_timar_mod: "Жалуя завоёванную землю как ненаследственные тимары конникам-сипахи в обмен на военную службу, османы финансировали свою армию, не истощая казну. Султан сохранял верховное владение всей тимарной землёй, давая ему рычаг над военным сословием, коему европейские монархи могли лишь завидовать."
 STATIC_MODIFIER_NAME_som_tur_sipahi_mod: "Конница сипахи"
 STATIC_MODIFIER_DESC_som_tur_sipahi_mod: "Бронированные конники сипахи, финансируемые тимарными пожалованиями, были главной ударной силой османской армии в XV и XVI веках. Их громовые атаки сокрушали армии от Балкан до персидской границы. По мере созревания империи класс сипахи стал могущественной провинциальной аристократией с собственными политическими интересами."
 STATIC_MODIFIER_NAME_som_tur_eyalet_mod: "Система эялетов"
 STATIC_MODIFIER_DESC_som_tur_eyalet_mod: "Система эялетов — с бейлербеем, назначаемым султаном, управляющим каждой крупной провинцией — распространяла османский административный охват на огромное географическое пространство. Каждый эялет был по сути миниатюрной империей со своим воинским контингентом, казной и двором, питая ресурсами и войсками центр."
 STATIC_MODIFIER_NAME_som_tur_vizier_mod: "Великий визирь"
 STATIC_MODIFIER_DESC_som_tur_vizier_mod: "Резиденция великого визиря — Высокая Порта — стала адресом, по коему европейские послы вели османскую дипломатию. Диван, коим он председательствовал, был органом выработки политики империи. Способный великий визирь мог эффективно править империей десятилетиями; неспособный мог довести её до края краха."
 STATIC_MODIFIER_NAME_som_tur_bureaucracy_mod: "Имперская бюрократия"
 STATIC_MODIFIER_DESC_som_tur_bureaucracy_mod: "Османская писчая культура произвела бумажную запись поразительного количества и детализации. Земельные реестры, налоговые обзоры, судебные записи и имперские указы создали административную инфраструктуру, сделавшую Османскую империю одним из наилучшим образом документированных государств домодернового периода истории."
 STATIC_MODIFIER_NAME_som_tur_mosque_mod: "Мечеть Сулеймание"
 STATIC_MODIFIER_DESC_som_tur_mosque_mod: "Шедевр Синана возвестил миру, что османы были наследниками Рима, Византии и высшей исламской цивилизации одновременно. Её купол соперничал со Святой Софией на горизонте Стамбула — намеренный архитектурный диалог между старой христианской империей и новой мусульманской."
 STATIC_MODIFIER_NAME_som_tur_topkapi_mod: "Дворец Топкапы"
 STATIC_MODIFIER_DESC_som_tur_topkapi_mod: "Топкапы был нервным центром империи, охватывающей три континента. Каждый султан был коронован здесь; каждый поход начинался из его врат; каждый великий визирь служил по его милости. Гарем внутри его стен формировал политику престолонаследия веками."
 STATIC_MODIFIER_NAME_som_tur_ulema_mod: "Власть улемов"
 STATIC_MODIFIER_DESC_som_tur_ulema_mod: "Улемы придавали османскому государству его религиозную легитимность. Их одобрение войн султана как джихада, их управление системой шариатских судов и их укомплектование сети образования медресе делали их незаменимыми партнёрами османского правления."
 STATIC_MODIFIER_NAME_som_tur_millet_mod: "Система миллетов"
 STATIC_MODIFIER_DESC_som_tur_millet_mod: "Организованный религиозный плюрализм — христиане, евреи и мусульмане, живущие под единым имперским зонтиком, каждый управляя своими собственными общинными делами — был османским решением проблемы правления разнообразной империей. Это не было равенством, но это была форма сосуществования, кою поддерживала империю веками."
 STATIC_MODIFIER_NAME_som_tur_kadi_mod: "Суды кадиев"
 STATIC_MODIFIER_DESC_som_tur_kadi_mod: "Суды кадиев распространяли османское верховенство закона до каждого уголка империи, от Стамбула до отдалённых анатолийских деревень. Записи сиджилл, кои они производили, — сокровищница историка: десятки тысяч томов, документирующих имущественные споры, браки, торговые контракты и уголовные дела на протяжении веков."
 STATIC_MODIFIER_NAME_som_tur_sufi_mod: "Суфийская культура"
 STATIC_MODIFIER_DESC_som_tur_sufi_mod: "Суфийские ордена придавали духовную глубину османской религиозной жизни, коей не могло дать формальное законническое понимание ислама. Кружащиеся мевлеви, воинственные бекташи, политически связанные накшбанди — каждый орден занимал самобытную нишу в османском обществе, и вместе они соткали сеть духовной общины по всей империи."
 STATIC_MODIFIER_NAME_som_tur_synthesis_mod: "Культурный синтез"
 STATIC_MODIFIER_DESC_som_tur_synthesis_mod: "Османский талант к поглощению, а не разрушению, сделал империю культурной губкой. Византийская административная умелость, персидская литературная культура, арабская научная традиция и турецкая воинская энергия — всё это слилось воедино в нечто самобытно — и величественно — османское."
 STATIC_MODIFIER_NAME_som_tur_bursa_silk_trade: "Шёлковая промышленность Бурсы"
 STATIC_MODIFIER_DESC_som_tur_bursa_silk_trade: "Бурса стала шёлковой столицей империи — ролью, кою сохраняла веками. Ремесленники города производили роскошные шелка, украшавшие дворы Европы и Ближнего Востока равно, и её доходы помогали финансировать походы, построившие империю."
 STATIC_MODIFIER_NAME_som_tur_trade_empire_mod: "Имперские торговые пути"
 STATIC_MODIFIER_DESC_som_tur_trade_empire_mod: "Караван-сараи, дороги и подавление пиратства оживили торговлю внутри империи. Радиальная торговая сеть с центром в Константинополе принесла экономическую интеграцию."
 STATIC_MODIFIER_NAME_som_tur_istanbul_glory_mod: "Город мировой мечты"
 STATIC_MODIFIER_DESC_som_tur_istanbul_glory_mod: "Стамбул — раскинувшийся на двух континентах, повелевающий единственным проходом между Чёрным морем и Средиземным — был городом, коего желал весь мир. Его население, его торговля, его архитектура и его политическое значение сделали его бесспорной столицей известного мира."
 som_ottoman_events.50.t: "Город мировой мечты"
 som_ottoman_events.50.d: "Константинополь — Стамбул — стал воистину и полностью городом, коего желает весь мир. Его население в полмиллиона делает его крупнейшим городом Европы и Ближнего Востока вместе взятых. Он раскинулся на двух континентах. Он контролирует единственный морской проход между Чёрным морем и Средиземным. Изящный силуэт мечети Сулеймание и повелевающая высота дворца Топкапы отражаются в водах Босфора. В его судах поэты соперничают с философами, и зодчие соревнуются с учёными. Османская цивилизация достигла своей вершины. Этот город будет сиять тысячу лет."
 som_ottoman_events.50.a: "Пусть Стамбул сияет тысячу лет!"
 som_ottoman_events.50.breadbasket_tt: "Городское право «Османская имперская житница» ныне доступно. Его можно даровать районам ранга города или выше с зернохранилищем 5-го уровня или выше."
 STATIC_MODIFIER_NAME_som_tur_constantinople_dev_mod: "Развитие Костантинийе"
 STATIC_MODIFIER_DESC_som_tur_constantinople_dev_mod: "Под командованием Мехмеда II переселение и перестройка продолжаются; голоса новых жителей наполняют рынки, и восстановленная каменная кладка возвращает новый блеск прежней имперской столице."
 STATIC_MODIFIER_NAME_som_tur_constantinople_splendor_mod: "Великолепие Костантинийе"
 STATIC_MODIFIER_DESC_som_tur_constantinople_splendor_mod: "Вокруг Золотого Рога вырастают новые мастерские, караван-сараи и кварталы; переселенцы и ремесленники стекаются в город, а земли за ним приносят больше, чем когда-либо. Столица султана вновь затмевает любой город известного мира."
 STATIC_MODIFIER_NAME_som_tur_trebizond_trade_mod: "Трапезунд — врата Шёлкового пути"
 STATIC_MODIFIER_DESC_som_tur_trebizond_trade_mod: "В порту Трапезунда на южном берегу Чёрного моря грузы караванов, сошедших с Шёлкового пути из Средней Азии и Каспия, сложены высоко, ожидая кораблей, идущих в Средиземноморье."
 STATIC_MODIFIER_NAME_som_tur_commercial_empire_mod: "Торговая империя"
 STATIC_MODIFIER_DESC_som_tur_commercial_empire_mod: "Алеппо, Александрия, Константинополь — богатство трёх континентов ныне течёт через рынки султана."
 STATIC_MODIFIER_NAME_som_tur_grand_bazaar_loc_mod: "Гранд-базар"
 STATIC_MODIFIER_DESC_som_tur_grand_bazaar_loc_mod: "Вдоль крытых улиц Капалычаршы крики золотых дел мастеров и торговцев пряностями не смолкают, и товары всего мира собираются здесь."
 som_ottoman_events.19.t: "Торговая судьба Смирны"
 som_ottoman_events.19.d: "Смирна (Измир) — величайший портовый город восточного эгейского побережья, врата, связующие анатолийское заречье со средиземноморским миром. Греческие колонисты основали его в древности; ныне он принадлежит османам. Султан должен решить будущее направление города: развить его процветающим торговым узлом, притягивающим купцов со всего известного мира, или вложить в кораблестроение, дабы проецировать османскую мощь по всему Эгейскому морю?"
 som_ottoman_events.19.a: "Развить купеческий квартал Смирны и сделать её торговым центром"
 som_ottoman_events.19.b: "Построить верфь в Смирне и использовать её морской базой для эгейской экспансии"
 STATIC_MODIFIER_NAME_som_tur_anatolian_heartland_mod: "Овладение Анатолией"
 STATIC_MODIFIER_DESC_som_tur_anatolian_heartland_mod: "От Коньи до Трапезунда сборщики податей и чиновники султана достигают деревень Анатолии, и имперское правление простирается на каждый уголок плоскогорья."
 STATIC_MODIFIER_NAME_som_tur_crimea_dominance: "Господство над Крымом"
 STATIC_MODIFIER_DESC_som_tur_crimea_dominance: "Глядя через Чёрное море из гавани Каффы, лишь корабли под османским флагом рассекают волны. Чёрное море становится «османским озером»."
 STATIC_MODIFIER_NAME_som_tur_aleppo_learning_mod: "Учёность Алеппо"
 STATIC_MODIFIER_DESC_som_tur_aleppo_learning_mod: "Алеппо был среди великих интеллектуальных центров исламского мира. Знаменитые медресе, библиотеки и учёные, сосредоточенные здесь, приносят приток арабской учёной традиции в Османскую империю."
 STATIC_MODIFIER_NAME_som_tur_damascus_learning_mod: "Учёность Дамаска"
 STATIC_MODIFIER_DESC_som_tur_damascus_learning_mod: "Дамаск несёт накопленное интеллектуальное наследие омейядского, аббасидского и мамлюкского периодов. Под османским правлением это богатое наследие продолжает расти."
 STATIC_MODIFIER_NAME_som_tur_caliph_successor: "Преемник халифата"
 STATIC_MODIFIER_DESC_som_tur_caliph_successor: "Имя султана, ныне стража святых мест, произносится с кафедр как имя халифа."
 STATIC_MODIFIER_NAME_som_tur_aegean_shipbuilding_mod: "Эгейские приёмы кораблестроения"
 STATIC_MODIFIER_DESC_som_tur_aegean_shipbuilding_mod: "Корабельные мастера с эгейских островов приносят ремёсла, передаваемые поколениями, на верфи Стамбула, и киль за килем закладывается."
 som_ottoman_events.61.t: "Битва при Мардж-Дабике"
 som_ottoman_events.61.d: "В 1516 году султан Селим I уничтожил мамлюкскую армию султана Кансуха аль-Гаури на равнинах Мардж-Дабика. Сам Кансух пал на поле; вся Сирия перешла в османские руки. С занятым Каиром судьба Мамлюкского султаната лежит в османских руках."
 som_ottoman_events.61.a: "Поглотить Мамлюкский султанат как эялет через переговорный мир"
 som_ottoman_events.61.b: "Заключить мир и позволить им сохранить независимость"
 STATIC_MODIFIER_NAME_som_tur_edirne_trade_mod: "Эдирне — торговый узел"
 STATIC_MODIFIER_DESC_som_tur_edirne_trade_mod: "Эдирне (Адрианополь) — торговый центр Румелии. Этот город, связующий Балканы и Анатолию, развит узлом производства красителей, шёлка и тонкой ткани, поддерживая раннюю фискальную основу османов."
 STATIC_MODIFIER_NAME_som_tur_novo_brdo_silver_mod: "Серебряные копи Ново-Брдо"
 STATIC_MODIFIER_DESC_som_tur_novo_brdo_silver_mod: "Ново-Брдо («Новый холм») обладает крупнейшими серебряными копями Балкан. Даже после османского завоевания в 1450-х годах его богатые копи продолжали обогащать имперскую казну. Ежемесячное процветание и рост населения также усилены."
 STATIC_MODIFIER_NAME_som_tur_hungarian_march_mod: "Венгерская марка"
 STATIC_MODIFIER_DESC_som_tur_hungarian_march_mod: "С павшей Будой, османские солдаты, продвигающиеся через Дунай к Вене, чувствуют, даже среди отблесков победы, начало долгой войны с Габсбургами."
 STATIC_MODIFIER_NAME_som_tur_italy_north_mod: "Владычество над итальянским полуостровом"
 STATIC_MODIFIER_DESC_som_tur_italy_north_mod: "Знамя полумесяца реет над площадями Рима, Флоренции и Милана, и жители городов Возрождения начинают учить язык своих новых правителей."
 STATIC_MODIFIER_NAME_som_tur_maghreb_mod: "Овладение Магрибом"
 STATIC_MODIFIER_DESC_som_tur_maghreb_mod: "Корабли берберийских корсаров, собранные в гаванях Туниса и Алжира, ныне смотрят на западное Средиземноморье крылом флота султана."
 som_tur_silk_road_revival: "Возрождение Шёлкового пути"
 som_tur_silk_road_revival_desc: "Тебриз был самым западным узлом Шёлкового пути — столицей Ильханата, некогда связующей Персию и Среднюю Азию со средиземноморским миром. Захват этого города даёт Османской империи прямой контроль над потоком шёлка, пряностей и самоцветов из Азии. Обширная торговая сеть, связующая Чёрное море со Средней Азией, возрождается, резко усиливая имперскую торговую мощь."
 STATIC_MODIFIER_NAME_som_tur_silk_road_revival_mod: "Возрождение Шёлкового пути"
 STATIC_MODIFIER_DESC_som_tur_silk_road_revival_mod: "С рынков Тебриза караваны, гружённые китайским шёлком, вновь идут по дороге в Стамбул, и Шёлковый путь вновь обрёл своё оживление."
 som_tur_city_of_worlds_desire_desc: "Стамбул — воистину город мировой мечты. С населением, превышающим полмиллиона, он бесспорный стержень мировой торговли. По мере того как этот великий город достигает своей полной славы, древнее византийское право Императорской житницы становится доступным и Османской империи тоже."
 som_tur_true_rome: "Истинная Римская империя"
 som_tur_true_rome_desc: "Балканы, Анатолия, арабский мир, Египет, Северная Африка, Италия — практически все земли, некогда правимые Римом, ныне несут османское знамя. Мехмед II принял титул Кайзера (Императора) после падения Константинополя. Ныне Османская империя стоит истинным наследником Рима — наследуя его дороги, его законы, его цивилизацию. Возроди Свод законов Юстиниана, расширь систему акведуков и свяжи обширную империю воедино под единым законом и единой культурой."
 STATIC_MODIFIER_NAME_som_tur_true_rome_mod: "Истинная Римская империя"
 STATIC_MODIFIER_DESC_som_tur_true_rome_mod: "Под империей, притязающей на мантию Рима, дороги чинятся, акведуки расширяются, а свод Юстиниана возрождается как закон новой эпохи."
 som_ottoman_mission_pack: "Возвышение Османской империи"
 som_ottoman_mission_pack_DESCRIPTION:0 "В 1337 году османское государство — малый анатолийский бейлик с центром в Бурсе, Изнике и Измите. В течение нескольких поколений он преобразится в империю, простирающуюся от Балкан до Аравии, от Крыма до Северной Африки и Италии. Неси дух гази на Балканы, поставь Константинополь на колени, осуществи золотой век Сулеймана Великолепного — и заяви права на мантию истинного Рима."
 som_ottoman_mission_pack_CRITERIA_DESCRIPTION:0 "Как османы, завоюй Балканы, Анатолию, арабский мир и Средиземноморье; построй прочные внутренние учреждения; и достигни эпохи Сулеймана."
 som_ottoman_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы осуществить Возвышение Османской империи."
 som_ottoman_mission_pack_BUTTON_DETAILS:0 "От малого бейлика в 1337 году до величайшей империи мира!"
