l_russian:
 mos_moscow_mission_pack: "От татарского ига до самодержца всея Руси"
 mos_moscow_mission_pack_DESCRIPTION:0 "В 1337 году Великое княжество Московское — малое княжество под властью Золотой Орды. Благодаря хитрому накоплению богатства и дипломатическому искусству Ивана I Калиты с татарами, Москва неуклонно росла. Но Новгород, Тверь и Литва окружают её, тогда как татарская угроза продолжается с юга. Сбрось татарское иго, объедини русские княжества, провозгласи себя царём, царствуй как Третий Рим и стань самодержцем всея Руси — владыкой до пределов Сибири."
 mos_moscow_mission_pack_CRITERIA_DESCRIPTION:0 "Сбрось татарское иго, завоюй Казань, Астрахань и Новгород, дабы объединить Русь, прими титул царя, стань Третьим Римом и завоюй Сибирь."
 mos_moscow_mission_pack_BUTTON_TOOLTIP:0 "Стань самодержцем всея Руси."
 mos_moscow_mission_pack_BUTTON_DETAILS:0 "От Великого княжества Московского до Российской империи — осуществи историческую судьбу!"
 mos_rally_the_army: "Мобилизуй армию"
 mos_rally_the_army_desc: "В 1337 году Великое княжество Московское неуклонно растёт благодаря хитрому искусству Ивана I Калиты. Подготовь армию и начни расширение московского владычества над русскими княжествами."
 mos_break_tatar_yoke: "Сбрось татарское иго"
 mos_break_tatar_yoke_desc: "С 1237 года татарская дань и покорность угнетают Русь. Память о победе Дмитрия Донского на Куликовом поле живёт. Провозгласи полную независимость и сбрось татарское иго навсегда."
 mos_conquer_kazan: "Завоевание Казани"
 mos_conquer_kazan_desc: "Казанское ханство контролирует волжский торговый путь. Его завоевание даёт Москве владычество над великой рекой — предвосхити победу Ивана Грозного 1552 года."
 mos_subjugate_kazan: "Покори Среднюю Волгу"
 mos_subjugate_kazan_desc: "После завоевания Казани захвати бассейн средней Волги — Самару и Тамбов — дабы открыть путь на юг."
 mos_conquer_astrakhan: "Завоевание Астрахани"
 mos_conquer_astrakhan_desc: "Астраханское ханство контролирует дельту нижней Волги. Завоюй его, дабы утвердить доступ к Каспийскому морю и восточный торговый путь."
 mos_destroy_hordes: "Уничтожение орд"
 mos_destroy_hordes_desc: "Разбери татарские наследственные государства, включая Ногайскую орду, и открой путь в степь."
 mos_claim_steppes: "Заяви права на степи"
 mos_claim_steppes_desc: "Захвати Понтийскую степь северного черноморского побережья, дабы раскрыть облик Москвы как великой континентальной империи."
 mos_black_sea_access: "Доступ к Азовскому морю"
 mos_black_sea_access_desc: "Продвинься к Азовскому морю, дабы утвердить доступ к черноморской торговле — опереди взятие Азова Петром Великим в 1696 году."
 mos_conquer_crimea: "Завоевание Крыма"
 mos_conquer_crimea_desc: "Завоюй Крымское ханство, дабы утвердить владычество над Чёрным морем — предвосхити аннексию Екатерины Великой 1783 года."
 mos_consolidate_russia: "Консолидация Руси"
 mos_consolidate_russia_desc: "С Москвой в центре, консолидируй русские княжества в единую могучую основу государства."
 mos_dev_moscow: "Развитие Кремля"
 mos_dev_moscow_desc: "Разви Московский Кремль — символ русской власти. Великие соборы, наполняющие этот священный удел, становятся сердцем Российской империи."
 mos_conquer_novgorod: "Завоевание Новгорода"
 mos_conquer_novgorod_desc: "Новгород — некогда величайший торговый город-государство Руси. Осуществи решающее завоевание Ивана III 1478 года ещё раньше."
 mos_conquer_tver: "Завоевание Твери"
 mos_conquer_tver_desc: "Тверь, некогда соперник Москвы — её мощь ослабла. Завоюй этот ключевой волжский город, дабы продвинуть объединение Руси."
 mos_conquer_ryazan: "Покорение Рязани"
 mos_conquer_ryazan_desc: "Рязань, впервые опустошённая монголами в 1237 году — завоюй её южную степь и построй оборонительную линию."
 mos_conquer_smolensk: "Завоевание Смоленска"
 mos_conquer_smolensk_desc: "Смоленск, «ключ Руси» — контролируй этот перекрёсток востока и запада, дабы утвердить западное влияние."
 mos_conquer_ruthenia: "Завоевание Рутении"
 mos_conquer_ruthenia_desc: "Белая Русь — завоюй эту контролируемую Литвой область с центром в Минске и утверди общеславянское владычество."
 mos_window_on_west: "Окно на Запад"
 mos_window_on_west_desc: "Захвати Выборг и Карелию, дабы открыть «окно на Запад» — предвосхити мечту Петра Великого о западном доступе."
 mos_baltic_ambition: "Балтийские честолюбия"
 mos_baltic_ambition_desc: "Восточное побережье Балтики, контролируемое Ливонским орденом — покорение этой области позволяет войти в североевропейскую торговлю."
 mos_conquer_riga: "Завоевание Риги"
 mos_conquer_riga_desc: "Рига, опора Ганзейского союза — завоюй этот балтийский торговый центр, дабы получить доступ к североевропейской торговой сети."
 mos_partition_poland: "Раздел Польши"
 mos_partition_poland_desc: "Положи конец долгой борьбе с Польско-Литовской Речью Посполитой за Рутению и Восточную Европу."
 mos_metropolitan_see: "Московская митрополия"
 mos_metropolitan_see_desc: "В 1448 году Москва учредила независимую церковную митрополию. Эта православная власть поддерживает политическую легитимность Москвы."
 mos_land_of_churches: "Земля церквей"
 mos_land_of_churches_desc: "«Святая Русь» — построй православные соборы по всей земле и освяти Русь как царство Божие."
 mos_tsar_title: "Титул царя"
 mos_tsar_title_desc: "«Царь (Император)» — Иван IV формально принял этот титул в 1547 году. Провозгласи власть как наследник Рима и обрети признание как европейская держава."
 mos_russian_patriarchate: "Русский патриархат"
 mos_russian_patriarchate_desc: "Московский патриархат, учреждённый в 1589 году, независимый от Константинополя — упрочи религиозную основу «Третьего Рима»."
 mos_guardian_orthodoxy: "Страж православия"
 mos_guardian_orthodoxy_desc: "После падения Константинополя перед османами в 1453 году Русь становится стражем православной веры. Построй православную сеть по всей земле."
 mos_conquer_constantinople: "Завоевание Константинополя"
 mos_conquer_constantinople_desc: "Верни православную святую столицу Константинополь из османских рук — осуществи миссию «Третьего Рима» и перепиши историю."
 mos_third_rome: "Третий Рим"
 mos_third_rome_desc: "«Москва — Третий Рим, а четвёртому не бывать» — слова монаха Филофея становятся явью. Москва царствует духовным центром христианского мира."
 mos_march_caucasus: "Марш на Кавказ"
 mos_march_caucasus_desc: "Завоюй Грузию, Армению и Азербайджан на Кавказских горах и сделай Россию истинной континентальной империей."
 mos_caspian_sea: "Овладение Каспийским морем"
 mos_caspian_sea_desc: "«Русское внутреннее море» Каспий — захвати торговый путь в Персию и Среднюю Азию."
 mos_beyond_urals: "За Уралом"
 mos_beyond_urals_desc: "Уральские горы отмечают границу Европы и Азии — за ними лежат обширные просторы Сибири. Опереди завоевание Ермака 1582 года и заяви права на царство пушнины."
 mos_conquer_perm: "Завоевание Перми"
 mos_conquer_perm_desc: "Пермь на верхней Каме — завоюй этот источник «камских мехов» и используй его плацдармом для завоевания Сибири."
 mos_west_siberia: "Западная Сибирь"
 mos_west_siberia_desc: "Западная Сибирь с центром в Тобольске — обширная тайга поставляет бесконечные ресурсы пушнины. Разви Тобольск «столицей Сибири»."
 mos_east_siberia: "Восточная Сибирь"
 mos_east_siberia_desc: "До Иркутска — достижение озера Байкал открывает двери в Восточную Сибирь."
 mos_pacific_coast: "Достигни тихоокеанского побережья"
 mos_pacific_coast_desc: "«Казаки достигли Тихого океана» — от Якутска до Охотского моря. Русский флаг реет на краю Тихого океана."
 mos_fur_monopoly: "Монополия на пушнину"
 mos_fur_monopoly_desc: "Сибирские меха — самый ценный товар европейских рынков. Монополизируй их поставку и обрети несметное богатство."
 mos_sudebnik: "Судебник"
 mos_sudebnik_desc: "Судебник 1497 года, первый единый свод законов Руси Ивана III — этот свод, основа крепостничества, становится орудием централизации."
 mos_handle_boyars: "Обуздай бояр"
 mos_handle_boyars_desc: "Бояре контролируют местную власть — сломи это положение и учреди прямых царских наместников, дабы продвинуть централизацию."
 mos_oprichnina: "Опричнина"
 mos_oprichnina_desc: "Тёмная опричнина Ивана IV — чёрные всадники царя очищали мятежных бояр. Используй эту жестокую, но действенную политику, дабы абсолютизировать царскую власть."
 mos_dev_agriculture: "Земледельческое развитие"
 mos_dev_agriculture_desc: "Богатый русский чернозём — развей плодородные угодья, простирающиеся от Украины до Волги, дабы повысить земледельческую производительность."
 mos_dev_agriculture_unlock_tt: "Решение «Развитие сельского хозяйства» теперь доступно."
 mos_agriculture_decision.title: "Развитие сельского хозяйства"
 mos_agriculture_decision.desc: "Чернозём простирается от Украины до Волги, но его урожай зависит от орудий, амбаров и согласия крупных землевладельцев. Казна и влияние государя при дворе могут быть потрачены на то, чтобы всё это организовать."
 mos_agriculture_decision.a: "Организовать сбор урожая."
 mos_agriculture_upgrade_decision.title: "Великое освоение чернозёма"
 mos_agriculture_upgrade_decision.desc: "Когда первые урожаи обеспечены, государство может поднять плугом саму степную границу: новые деревни, новые мельницы и новые дороги для вывоза зерна. Это обойдётся в целое состояние и в немалую долю влияния государя, но чернозём даст урожай, какого не бывало."
 mos_agriculture_upgrade_decision.a: "Поднять плугом степную границу."
 mos_pomestye_system: "Поместная система"
 mos_pomestye_system_desc: "Поместная система — дарование земли в обмен на военную службу — образует основу военной мощи Руси."
 mos_streltsy: "Учреди стрельцов"
 mos_streltsy_desc: "Стрельцы — постоянная огнестрельная пехота, созданная Иваном IV. Это элитное соединение становится хребтом русской армии."
 mos_zasechnaya_cherta: "Засечная черта"
 mos_zasechnaya_cherta_desc: "Построй «засечную черту» из поваленных деревьев и крепостей как оборонительную линию против набегов татарской конницы."
 mos_dev_arkhangelsk: "Возведи Архангельск"
 mos_dev_arkhangelsk_desc: "Архангельск, беломорский порт — единственный заморский торговый порт Руси до Петра Великого. Разви этот порт для прямой торговли с Западной Европой."
 mos_white_sea_trade: "Беломорская торговля"
 mos_white_sea_trade_desc: "Английская Московская компания (1555) вошла в Русь отсюда — опереди её и захвати беломорский торговый путь."
 mos_dev_nizhny: "Развей Нижний Новгород"
 mos_dev_nizhny_desc: "На слиянии Волги и Оки — развей «Нижний Новгород» в центр волжской торговли."
 mos_conquer_pskov: "Завоевание Пскова"
 mos_conquer_pskov_desc: "Псков был присоединён Москвой в 1510 году. Вслед за Новгородом завоюй Псков и полностью подчини Северо-Западную Русь."
 mos_dev_yaroslavl: "Развей Ярославль"
 mos_dev_yaroslavl_desc: "Ярославль «Золотого кольца» — развей этот волжский торговый город в транзитный узел северной торговли."
 mos_conquer_vologda: "Развей Вологду"
 mos_conquer_vologda_desc: "Вологда — захвати этот ключевой перекрёсток северного торгового пути и обеспечь связь с беломорской торговлей."
 mos_amber_road: "Янтарный путь"
 mos_amber_road_desc: "Балтийский янтарь — поставляй этот товар через Ригу на европейские рынки и увеличь торговый доход."
 mos_reform_taxation: "Налоговая реформа"
 mos_reform_taxation_desc: "Учреди единую налоговую систему и укрепи государственные финансы. Централизованный налоговый доход поддерживает русскую армию."
 mos_dev_kazan_city: "Развей город Казань"
 mos_dev_kazan_city_desc: "Разви завоёванную Казань в многонациональный город, где сосуществуют татары, русские и чуваши."
 mos_conquer_vilnius: "Завоевание Вильнюса"
 mos_conquer_vilnius_desc: "Вильнюс, столица Великого княжества Литовского — его завоевание кладёт конец литовскому владычеству и переносит восточноевропейскую гегемонию в Москву."
 mos_develop_moscow_university: "Учреди Московский университет"
 mos_develop_moscow_university_desc: "Построй залы учёности прежде Московского университета (основан в 1755 году). Раннее осуществление мечты Ломоносова способствует интеллектуальному развитию Руси."
 mos_teutonic_order: "Разгроми Тевтонский орден"
 mos_teutonic_order_desc: "Тевтонский орден, наследие балтийских крестовых походов — покорение их территории приводит южную Балтику полностью под русское влияние."
 mos_estonian_coast: "Эстонское побережье"
 mos_estonian_coast_desc: "Таллин — захвати этот ключевой порт Ганзейского союза и достигни полного вхождения в балтийскую торговлю."
 mos_dev_tobolsk_city: "Развей город Тобольск"
 mos_dev_tobolsk_city_desc: "Разви Тобольск всерьёз как «столицу Сибири» — вырасти его административным центром завоевания Сибири."
 mos_streltsy_reform: "Военная реформа"
 mos_streltsy_reform_desc: "Модернизируй стрельцов — прими западные военные технологии, дабы поднять русскую армию до европейских стандартов."
 mos_siberian_ostrog: "Сибирская острожная сеть"
 mos_siberian_ostrog_desc: "Развей сеть крепостей (острогов), связующую Тобольск, Енисейск и Иркутск, кою поддерживает завоевание Сибири."
 mos_absolute_monarchy: "Утверди абсолютную монархию"
 mos_absolute_monarchy_desc: "Утверди абсолютную царскую власть — лиши власти бояр, церковь и местных владык, сосредоточив всю власть в руках императора."
 mos_peter_reforms: "Петровские реформы"
 mos_peter_reforms_desc: "Пётр Великий (1672-1725) преобразил Русь в современное государство через вестернизацию. Военная реформа, создание флота, академия наук. Осуществи дух «прорубания окна на Запад»."
 mos_dev_st_petersburg: "Возведи Санкт-Петербург"
 mos_dev_st_petersburg_desc: "Построенный Петром Великим в 1703 году на болотах Невы — возведи Санкт-Петербург первым западным городом Руси."
 mos_russian_navy: "Учреди русский флот"
 mos_russian_navy_desc: "«России нужен флот» — по убеждению Петра Великого, создай Азовский и Балтийский флоты."
 mos_dev_suzdal: "Развей Суздаль"
 mos_dev_suzdal_desc: "Суздаль «Золотого кольца» — развей этот древний город с многими средневековыми церквями центром религии и культуры."
 mos_dev_vladimir: "Развей Владимир"
 mos_dev_vladimir_desc: "Владимир, некогда столица Великого княжества — развей этот древний город центром земледелия и продовольственного снабжения."
 mos_salt_works: "Соляная промышленность"
 mos_salt_works_desc: "Соль из Вологды и Соликамска — утверди устойчивое снабжение солью, незаменимой для русской консервации пищи."
 mos_beeswax_trade: "Торговля воском"
 mos_beeswax_trade_desc: "Русский пчелиный воск — ключевой товар, в высоком спросе для свечей православной церкви и западноевропейского вывоза."
 mos_iron_works: "Железная промышленность"
 mos_iron_works_desc: "Железная руда Уральского региона — заложи основу уральского железного производства, кое усилится в петровскую эпоху."
 mos_dev_astrakhan_city: "Развей город Астрахань"
 mos_dev_astrakhan_city_desc: "Астрахань, «южные врата» — развей её центром каспийской торговли и захвати торговлю с Персией и Средней Азией."
 mos_cossack_cavalry: "Казачья конница"
 mos_cossack_cavalry_desc: "Донские и запорожские казаки — включи этих лучших степных всадников в русскую армию."
 mos_book_of_royal_degrees: "Степенная книга"
 mos_book_of_royal_degrees_desc: "Степенная книга записывает родословную русских правителей, укрепляя легитимность и административную эффективность Москвы."
 mos_kholmogory: "Развей Холмогоры"
 mos_kholmogory_desc: "Холмогоры на Северной Двине — развей этот беломорский торговый форпост."
 mos_protect_south_slavs: "Защити южных славян"
 mos_protect_south_slavs_desc: "Освободи православных христиан Балкан от османского владычества и построй общеславянскую империю."
 mos_conquer_carpathia: "Завоевание Карпат"
 mos_conquer_carpathia_desc: "Карпатские горы — покорение этих врат в Центральную Европу значительно расширяет западное влияние."
 mos_great_northern_war: "Великая Северная война"
 mos_great_northern_war_desc: "В Великой Северной войне (1700-1721) Пётр Великий разгромил Швецию и утвердил балтийскую гегемонию — осуществи эту победу раньше."
 mos_dev_perm_city: "Развей город Пермь"
 mos_dev_perm_city_desc: "Развей Пермь, узел пушной торговли, в настоящий город — вырасти его центром торговли и сбора пушнины на верхней Каме."
 mos_yakutsk_founded: "Основай Якутск"
 mos_yakutsk_founded_desc: "Якутск, основанный в 1632 году — построй его центром Восточной Сибири и открой путь на Тихий океан."
 mos_dev_irkutsk: "Развей Иркутск"
 mos_dev_irkutsk_desc: "Иркутск на озере Байкал — развей этот город, позднее «Париж Сибири», административным и торговым центром Восточной Сибири."
 mos_dev_minsk: "Развей Минск"
 mos_dev_minsk_desc: "Развей Минск, центр Белоруссии, базой западного правления."
 mos_conquer_warsaw: "Завоевание Варшавы"
 mos_conquer_warsaw_desc: "Варшава, столица Польши — заверши польский раздел и утверди влияние над Центральной Европой."
 mos_iron_ring_defense: "Оборона Железного кольца"
 mos_iron_ring_defense_desc: "Крепостная сеть против вторжения с юга и запада — железная оборонительная система бастионных крепостей защищает русскую территорию."
 mos_form_russia: "Образуй Россию"
 mos_form_russia_desc: "Сбросив татарское иго, завоевав Казань и объединив русские княжества — формально провозгласи государство «Россия» и царствуй над всеми как царь."
 mos_russian_empire: "Российская империя"
 mos_russian_empire_desc: "Пётр Великий провозгласил Россию «империей» Ништадтским договором в 1721 году — осуществи этот миг раньше через пушнину, земледелие и петровские реформы."
 mos_autocrat_of_all_russias: "Самодержец всея Руси"
 mos_autocrat_of_all_russias_desc: "«Божией милостию, Император и Самодержец Всероссийский» — от Балтики до Сибири, от Кавказа до Северного Ледовитого океана, все земли лежат под суверенной милостью царя."
 mos_events.1.t: "Великое княжество Московское — под татарским игом"
 mos_events.1.d: "В 1337 году Москва — малое княжество. Однако благодаря хитрому искусству Ивана I Калиты («Денежный мешок»), сборщика татарской подати, Москва накопила силу.\n\nПреимущество Москвы — география: её лесное положение вглубь земли затрудняет прямой татарский контроль.\n\nПамять о битве на Куликовом поле (1380), где Дмитрий Донской отразил татар, живёт. Сбросить татарское иго совершенно и объединить русские княжества под царской властью — вот судьба Москвы."
 mos_events.1.a: "Во славу Москвы!"
 mos_events.5.t: "Сбрось татарское иго!"
 mos_events.5.d: "Наконец московское войско разбило татар в бою — дань татарам окончена навеки. В этот исторический поворот, сравнимый со «Стоянием на реке Угре (1480)», Москва становится знаменосцем свободной Руси. Русские княжества признают гегемонию Москвы, и путь к единому государству открыт."
 mos_events.5.a: "Русь свободна! Теперь за объединение Руси!"
 mos_events.10.t: "Венчание царя"
 mos_events.10.d: "«Царь и Великий князь всея Руси» — приняв этот титул, Москва утверждает себя законным наследником Византийской империи. Предвосхити исторический обряд коронации Ивана IV 1547 года. Дворы Европы начинают признавать Москву новой великой державой."
 mos_events.10.a: "Да здравствует царь! Да здравствует Москва!"
 mos_events.30.t: "Возвращение Константинополя — завершение Третьего Рима"
 mos_events.30.d: "Православный святой город Константинополь в русских руках! Возвращение этого города, павшего перед османами в 1453 году, означает, что Русь становится духовным вождём православного мира как «Третий Рим». Христианский крест вновь реет над Святой Софией."
 mos_events.30.a: "Да здравствует Третий Рим! Да здравствует русское православие!"
 mos_events.50.t: "Петровские реформы — вестернизация или традиция?"
 mos_events.50.d: "Волна вестернизации готова захлестнуть Русь. Активно ли принять западные технологии, военные системы и науку, дабы развить Русь в современную европейскую державу — или защитить православную традицию и «русский путь», строя самобытную империю?"
 mos_events.50.a: "Продвигать вестернизацию — Россия есть часть Европы"
 mos_events.60.t: "Образование России — рождение новой империи"
 mos_events.60.d: "Украина, Белоруссия и Галиция под одним флагом — единое восточнославянское государство «Рутения» возникает новой великой державой Восточной Европы. Все народы Руси собираются под золотыми куполами Киева."
 mos_events.60.a: "Да здравствует Россия! Да здравствует царь всея Руси!"
 mos_events.99.t: "Самодержец всея Руси — завершение империи"
 mos_events.99.d: "«Божией милостию, Император и Самодержец Всероссийский» — от Балтики до Сибири, от Кавказа до Северного Ледовитого океана — русский флаг реет над величайшей империей мира. От малого Московского княжества 1337 года до величайшей империи мира — этот исторический подвиг будет рассказываться вечно."
 mos_events.99.a: "Да здравствует самодержец всея Руси! Да здравствует Российская империя!"
 mos_events.50.b: "Сохранить традицию"
 STATIC_MODIFIER_NAME_mos_moscow_dev_mod: "Консолидация Руси"
 STATIC_MODIFIER_DESC_mos_moscow_dev_mod: "Русь консолидирована — Москва восходит бесспорной столицей русских земель."
 STATIC_MODIFIER_NAME_mos_kremlin_mod: "Московский Кремль"
 STATIC_MODIFIER_DESC_mos_kremlin_mod: "Московский Кремль построен — вечный престол русской власти и славы."
 STATIC_MODIFIER_NAME_mos_kazan_mod: "Завоевание Казани"
 STATIC_MODIFIER_DESC_mos_kazan_mod: "Казань завоёвана — татарское ханство пало, и Волга открывается русской экспансии."
 STATIC_MODIFIER_NAME_mos_volga_mod: "Средняя Волга"
 STATIC_MODIFIER_DESC_mos_volga_mod: "Средняя Волга обеспечена — великая русская река становится имперским шляхом."
 STATIC_MODIFIER_NAME_mos_astrakhan_mod: "Завоевание Астрахани"
 STATIC_MODIFIER_DESC_mos_astrakhan_mod: "Знамя Москвы реет со стен Астрахани, и течение Волги идёт до каспийских берегов во имя великого князя."
 STATIC_MODIFIER_NAME_mos_steppes_mod: "Поражение татар"
 STATIC_MODIFIER_DESC_mos_steppes_mod: "Татары разбиты — Понтийская степь открывается русскому расселению."
 STATIC_MODIFIER_NAME_mos_pontic_mod: "Овладение Понтийской степью"
 STATIC_MODIFIER_DESC_mos_pontic_mod: "Овладение Понтийской степью — Русь господствует над землями к северу от Чёрного моря."
 STATIC_MODIFIER_NAME_mos_azov_mod: "Продвижение к Азовскому морю"
 STATIC_MODIFIER_DESC_mos_azov_mod: "За Чёрным морем, видимым из гавани Азова, морские пути тянутся к Средиземноморью."
 STATIC_MODIFIER_NAME_mos_crimea_mod: "Завоевание Крыма"
 STATIC_MODIFIER_DESC_mos_crimea_mod: "Крым завоёван — Русь обретает тёплый порт, коего долго искала."
 STATIC_MODIFIER_NAME_mos_novgorod_mod: "Завоевание Новгорода"
 STATIC_MODIFIER_DESC_mos_novgorod_mod: "Новгород завоёван — великая торговая республика поглощена русским государством."
 STATIC_MODIFIER_NAME_mos_tver_mod: "Тверь — волжский торговый город"
 STATIC_MODIFIER_DESC_mos_tver_mod: "Тверь — волжский торговый город — покорена и включена в Москву."
 STATIC_MODIFIER_NAME_mos_ryazan_mod: "Покорение Рязани"
 STATIC_MODIFIER_DESC_mos_ryazan_mod: "Рязань покорена — последнее независимое княжество поглощено Русью."
 STATIC_MODIFIER_NAME_mos_smolensk_mod: "Смоленск — ключ Руси"
 STATIC_MODIFIER_DESC_mos_smolensk_mod: "Смоленск — ключ Руси — возвращён, обеспечивая западную границу."
 STATIC_MODIFIER_NAME_mos_ruthenia_mod: "Завоевание Рутении"
 STATIC_MODIFIER_DESC_mos_ruthenia_mod: "Рутения завоёвана — православные славяне запада приходят под защиту Москвы."
 STATIC_MODIFIER_NAME_mos_vyborg_mod: "Выборг — врата на запад"
 STATIC_MODIFIER_DESC_mos_vyborg_mod: "Выборг — врата на запад — захвачен, даруя доступ к Балтике."
 STATIC_MODIFIER_NAME_mos_baltic_mod: "Балтийские честолюбия"
 STATIC_MODIFIER_DESC_mos_baltic_mod: "Балтийские честолюбия осуществлены — Русь заявляет права на северное море."
 STATIC_MODIFIER_NAME_mos_riga_mod: "Рига — балтийский торговый узел"
 STATIC_MODIFIER_DESC_mos_riga_mod: "Рига — балтийский торговый узел — падает под русский контроль."
 STATIC_MODIFIER_NAME_mos_poland_mod: "Раздел Польши"
 STATIC_MODIFIER_DESC_mos_poland_mod: "Польша разделена — её территория поглощена Российской империей."
 STATIC_MODIFIER_NAME_mos_metropolitan_mod: "Московская митрополия"
 STATIC_MODIFIER_DESC_mos_metropolitan_mod: "Московская митрополия возвышена — церковь укрепляет русскую государственную власть."
 STATIC_MODIFIER_NAME_mos_churches_mod: "Земля церквей"
 STATIC_MODIFIER_DESC_mos_churches_mod: "Земля церквей — православие пронизывает каждый город, местечко и деревню Руси."
 STATIC_MODIFIER_NAME_mos_patriarchate_mod: "Русский патриархат"
 STATIC_MODIFIER_DESC_mos_patriarchate_mod: "Русский патриархат учреждён — церковь Москвы стоит независимо от Константинополя."
 STATIC_MODIFIER_NAME_mos_orthodoxy_mod: "Страж православия"
 STATIC_MODIFIER_DESC_mos_orthodoxy_mod: "Русь признана стражем православия — защитницей веры."
 STATIC_MODIFIER_NAME_mos_third_rome_mod: "Третий Рим"
 STATIC_MODIFIER_DESC_mos_third_rome_mod: "Москва провозглашает себя Третьим Римом — вечным престолом православной цивилизации."
 STATIC_MODIFIER_NAME_mos_caucasus_mod: "Марш на Кавказ"
 STATIC_MODIFIER_DESC_mos_caucasus_mod: "Сторожевые огни русских форпостов горят в кавказских перевалах, и даже горные царства слышали имя императора севера."
 STATIC_MODIFIER_NAME_mos_caspian_mod: "Овладение Каспием"
 STATIC_MODIFIER_DESC_mos_caspian_mod: "Овладение Каспийским морем открывает персидские и среднеазиатские торговые пути."
 STATIC_MODIFIER_NAME_mos_urals_mod: "Переход через Урал"
 STATIC_MODIFIER_DESC_mos_urals_mod: "Урал пересечён — дверь в Сибирь распахивается."
 STATIC_MODIFIER_NAME_mos_perm_mod: "Завоевание Перми"
 STATIC_MODIFIER_DESC_mos_perm_mod: "Пермь завоёвана — врата в Урал и сибирское пограничье обеспечены."
 STATIC_MODIFIER_NAME_mos_tobolsk_mod: "Учреждение сибирской торговли"
 STATIC_MODIFIER_DESC_mos_tobolsk_mod: "Сибирская торговля учреждена через Тобольск — меха и ресурсы текут на запад."
 STATIC_MODIFIER_NAME_mos_east_siberia_mod: "Завоевание Восточной Сибири"
 STATIC_MODIFIER_DESC_mos_east_siberia_mod: "Восточная Сибирь завоёвана — владычество Руси простирается до тихоокеанского горизонта."
 STATIC_MODIFIER_NAME_mos_pacific_mod: "Достижение Тихого океана"
 STATIC_MODIFIER_DESC_mos_pacific_mod: "Тихий океан достигнут — Русь охватывает всю ширь Евразийского континента."
 STATIC_MODIFIER_NAME_mos_fur_monopoly_mod: "Монополия на пушнину"
 STATIC_MODIFIER_DESC_mos_fur_monopoly_mod: "Сибирская пушная монополия обогащает Русь — соболиная шкура ценится на вес серебра."
 STATIC_MODIFIER_NAME_mos_sudebnik_mod: "Судебник"
 STATIC_MODIFIER_DESC_mos_sudebnik_mod: "Свод законов Судебник принят — правовая система Руси объединена и модернизирована."
 STATIC_MODIFIER_NAME_mos_boyar_mod: "Обуздание бояр"
 STATIC_MODIFIER_DESC_mos_boyar_mod: "Бояре более не могут противиться царю в думе и склоняют головы."
 STATIC_MODIFIER_NAME_mos_oprichnina_mod: "Опричнина"
 STATIC_MODIFIER_DESC_mos_oprichnina_mod: "Опричнина учреждена — тайная полиция Ивана принуждает к абсолютной верности."
 STATIC_MODIFIER_NAME_mos_agriculture_mod: "Земледельческое развитие"
 STATIC_MODIFIER_DESC_mos_agriculture_mod: "По обширным равнинам чернозёма золотые колосья пшеницы колышутся до горизонта."
 STATIC_MODIFIER_NAME_mos_black_earth_mod: "Урожаи чернозёма"
 STATIC_MODIFIER_DESC_mos_black_earth_mod: "Новые деревни и мельницы усеяли степную границу, а гружёные зерном телеги катят на север по новым дорогам. Чернозём кормит державу, как никогда прежде."
 STATIC_MODIFIER_NAME_mos_pomestye_mod: "Поместная система"
 STATIC_MODIFIER_DESC_mos_pomestye_mod: "Поместная система даёт землю за военную службу — рождается дворянское войско."
 STATIC_MODIFIER_NAME_mos_streltsy_mod: "Стрельцы"
 STATIC_MODIFIER_DESC_mos_streltsy_mod: "Стрелецкие мушкетёры сформированы — первая профессиональная постоянная пехота Руси."
 STATIC_MODIFIER_NAME_mos_zaseka_mod: "Засечная черта"
 STATIC_MODIFIER_DESC_mos_zaseka_mod: "Засечная черта — великая лесная оборонительная линия — щитит Русь от степных набегов."
 STATIC_MODIFIER_NAME_mos_arkhangelsk_mod: "Архангельск — врата на Белое море"
 STATIC_MODIFIER_DESC_mos_arkhangelsk_mod: "Архангельск открывает окно Руси в Белое море и североевропейскую торговлю."
 STATIC_MODIFIER_NAME_mos_white_sea_mod: "Беломорская торговля"
 STATIC_MODIFIER_DESC_mos_white_sea_mod: "Беломорские торговые пути связуют Русь с английскими и голландскими купцами."
 STATIC_MODIFIER_NAME_mos_nizhny_mod: "Нижний Новгород — слияние Волги и Оки"
 STATIC_MODIFIER_DESC_mos_nizhny_mod: "Нижний Новгород — на слиянии Волги и Оки — становится великой торговой ярмаркой."
 STATIC_MODIFIER_NAME_mos_pskov_mod: "Псков — северо-западный торговый город"
 STATIC_MODIFIER_DESC_mos_pskov_mod: "Псков — северо-западный торговый город — включён в русское государство."
 STATIC_MODIFIER_NAME_mos_yaroslavl_mod: "Золотой город Волги — торговый центр шёлка и льна"
 STATIC_MODIFIER_DESC_mos_yaroslavl_mod: "Ярославль — золотой город Волги — торгует шёлком и льном с востока на запад."
 STATIC_MODIFIER_NAME_mos_vologda_mod: "Вологда — северный торговый перекрёсток"
 STATIC_MODIFIER_DESC_mos_vologda_mod: "Вологда — северный торговый перекрёсток — связует Белое море с бассейном Волги."
 STATIC_MODIFIER_NAME_mos_amber_mod: "Янтарный путь"
 STATIC_MODIFIER_DESC_mos_amber_mod: "Янтарный путь с Балтики течёт через контролируемую Русью территорию."
 STATIC_MODIFIER_NAME_mos_taxation_mod: "Налоговая реформа"
 STATIC_MODIFIER_DESC_mos_taxation_mod: "Сборщики податей по всей земле записывают свою выручку в единой форме бухгалтерских книг, и всё серебро течёт в царскую казну."
 STATIC_MODIFIER_NAME_mos_kazan_city_mod: "Построение многонационального города"
 STATIC_MODIFIER_DESC_mos_kazan_city_mod: "Казань перестроена многонациональным городом — татарская и русская культуры сосуществуют под Москвой."
 STATIC_MODIFIER_NAME_mos_vilnius_mod: "Вильнюс — столица Литвы"
 STATIC_MODIFIER_DESC_mos_vilnius_mod: "Вильнюс — столица Литвы — падает под русское владычество."
 STATIC_MODIFIER_NAME_mos_university_mod: "Московский университет"
 STATIC_MODIFIER_DESC_mos_university_mod: "Аудитории Московского университета звенят голосами студентов со всей Руси, и свет Просвещения достиг и этой земли."
 STATIC_MODIFIER_NAME_mos_teutonic_mod: "Поражение Тевтонского ордена"
 STATIC_MODIFIER_DESC_mos_teutonic_mod: "Тевтонский орден разгромлен — балтийское пограничье обеспечено для Руси."
 STATIC_MODIFIER_NAME_mos_tallinn_mod: "Таллин — ганзейский северный форпост"
 STATIC_MODIFIER_DESC_mos_tallinn_mod: "Таллин — ганзейский северный форпост — захвачен, даруя доступ к балтийской торговле."
 STATIC_MODIFIER_NAME_mos_tobolsk_city_mod: "Торговая столица Сибири"
 STATIC_MODIFIER_DESC_mos_tobolsk_city_mod: "Сибирские меха и дары лесов сложены на рынках Тобольска, и голоса купцов не смолкают."
 STATIC_MODIFIER_NAME_mos_military_reform_mod: "Военная реформа"
 STATIC_MODIFIER_DESC_mos_military_reform_mod: "Солдаты в западных мундирах маршируют по плацу с новыми мушкетами на плечах."
 STATIC_MODIFIER_NAME_mos_ostrog_mod: "Сибирская острожная сеть"
 STATIC_MODIFIER_DESC_mos_ostrog_mod: "Из деревянных фортов, воздвигнутых глубоко в сибирской тайге, чиновники, собирающие пушной ясак, провозглашают народу имя империи."
 STATIC_MODIFIER_NAME_mos_absolutism_mod: "Абсолютная монархия"
 STATIC_MODIFIER_DESC_mos_absolutism_mod: "Абсолютная монархия упрочена — слово царя есть закон от Балтики до Тихого океана."
 STATIC_MODIFIER_NAME_mos_st_petersburg_mod: "Санкт-Петербург — окно в Европу"
 STATIC_MODIFIER_DESC_mos_st_petersburg_mod: "Санкт-Петербург — окно Руси в Европу — построен на невских болотах."
 STATIC_MODIFIER_NAME_mos_navy_mod: "Русский флот"
 STATIC_MODIFIER_DESC_mos_navy_mod: "Русский флот основан — мощная флотилия ходит по Балтике и Чёрному морю."
 STATIC_MODIFIER_NAME_mos_suzdal_mod: "Суздаль — сердце Золотого кольца"
 STATIC_MODIFIER_DESC_mos_suzdal_mod: "Суздаль — сердце Золотого кольца — сияет жемчужиной древнерусской культуры."
 STATIC_MODIFIER_NAME_mos_vladimir_mod: "Владимир — древняя столица Руси"
 STATIC_MODIFIER_DESC_mos_vladimir_mod: "Владимир — древняя столица Руси — возрождён центром русского царства."
 STATIC_MODIFIER_NAME_mos_salt_mod: "Соляная промышленность"
 STATIC_MODIFIER_DESC_mos_salt_mod: "Соль с вологодских промыслов несётся в деревни Руси, дабы сохранить зимние припасы."
 STATIC_MODIFIER_NAME_mos_beeswax_mod: "Торговля воском"
 STATIC_MODIFIER_DESC_mos_beeswax_mod: "Торговля пчелиным воском обогащает Русь — свечи и воск скрепляют торговлю империи."
 STATIC_MODIFIER_NAME_mos_iron_mod: "Железная промышленность"
 STATIC_MODIFIER_DESC_mos_iron_mod: "Домны Урала раскалены докрасна, и мечи, и орала, кованные из их железа, несутся по всей земле."
 STATIC_MODIFIER_NAME_mos_astrakhan_city_mod: "Астрахань — врата на Каспий"
 STATIC_MODIFIER_DESC_mos_astrakhan_city_mod: "На причалах Астрахани корабли, гружённые персидскими коврами и среднеазиатскими пряностями, ждут дня, когда поднимутся по Волге."
 STATIC_MODIFIER_NAME_mos_cossack_mod: "Казачья конница"
 STATIC_MODIFIER_DESC_mos_cossack_mod: "Казачья конница служит царю — вольные всадники степи ныне сражаются за Москву."
 STATIC_MODIFIER_NAME_mos_royal_degrees_mod: "Степенная книга"
 STATIC_MODIFIER_DESC_mos_royal_degrees_mod: "Родословная, изложенная в Степенной книге, показывает царский дом законной линией, избранной Богом."
 STATIC_MODIFIER_NAME_mos_kholmogory_mod: "Беломорский торговый форпост"
 STATIC_MODIFIER_DESC_mos_kholmogory_mod: "Холмогоры служат беломорским торговым форпостом, связующим Русь с севером."
 STATIC_MODIFIER_NAME_mos_grand_duchy_mod: "Великое княжество"
 STATIC_MODIFIER_DESC_mos_grand_duchy_mod: "Великое княжество Московское провозглашено — основа русского государства."
 STATIC_MODIFIER_NAME_mos_balkans_mod: "Защита южных славян"
 STATIC_MODIFIER_DESC_mos_balkans_mod: "Русь провозглашает себя защитницей южных славян против османского угнетения."
 STATIC_MODIFIER_NAME_mos_carpathia_mod: "Завоевание Карпат"
 STATIC_MODIFIER_DESC_mos_carpathia_mod: "Русские солдаты, стоящие в карпатских перевалах, наблюдают, как тень империи удлиняется над равнинами Центральной Европы за горами."
 STATIC_MODIFIER_NAME_mos_western_mod: "Вестернизация"
 STATIC_MODIFIER_DESC_mos_western_mod: "Реформы вестернизации преображают Русь — европейская технология и культура приняты."
 STATIC_MODIFIER_NAME_mos_northern_war_mod: "Великая Северная война"
 STATIC_MODIFIER_DESC_mos_northern_war_mod: "Великая Северная война выиграна — Русь возникает господствующей балтийской державой."
 STATIC_MODIFIER_NAME_mos_perm_city_mod: "Уральский пушной торговый пост"
 STATIC_MODIFIER_DESC_mos_perm_city_mod: "Пермь растёт уральским пушным торговым постом — вратами между Европой и Сибирью."
 STATIC_MODIFIER_NAME_mos_yakutsk_mod: "Дальневосточная передовая база"
 STATIC_MODIFIER_DESC_mos_yakutsk_mod: "Якутск служит дальневосточной передовой базой — присутствием Руси на тихоокеанском побережье."
 STATIC_MODIFIER_NAME_mos_irkutsk_mod: "Город Байкала"
 STATIC_MODIFIER_DESC_mos_irkutsk_mod: "Иркутск — город Байкала — становится административным центром восточной Сибири."
 STATIC_MODIFIER_NAME_mos_minsk_mod: "Минск — центр Белой Руси"
 STATIC_MODIFIER_DESC_mos_minsk_mod: "Минск — центр Белой Руси — поглощён Российской империей."
 STATIC_MODIFIER_NAME_mos_warsaw_mod: "Умиротворение Польши"
 STATIC_MODIFIER_DESC_mos_warsaw_mod: "Варшава умиротворена — столица Польши признаёт русское верховенство."
 STATIC_MODIFIER_NAME_mos_iron_ring_mod: "Оборона Железного кольца"
 STATIC_MODIFIER_DESC_mos_iron_ring_mod: "Оборонительная система Железного кольца щитит сердце Руси от вторжения."
 STATIC_MODIFIER_NAME_mos_great_mod: "Российская империя"
 STATIC_MODIFIER_DESC_mos_great_mod: "Российская империя провозглашена — одна из величайших континентальных держав истории."
 STATIC_MODIFIER_NAME_mos_autocrat_final_mod: "Самодержец всея Руси"
 STATIC_MODIFIER_DESC_mos_autocrat_final_mod: "Самодержец всея Руси — царь царствует верховно от Балтики до Тихого океана."
 mos_great_moscow: "Основание Третьего Рима: Великое расширение Москвы"
 mos_great_moscow_desc: "Расширь Москву в великий город, достойный Третьего Рима. Соборы, дворцы, рынки и крепости выстроятся вдоль этого великолепного города, сделав его сердцем Российской империи. Выполни все три условия развития, построек и населения, дабы заслужить Москве титул Вечного города."
 STATIC_MODIFIER_NAME_mos_great_moscow_mod: "Город Третьего Рима"
 STATIC_MODIFIER_DESC_mos_great_moscow_mod: "Великая Москва, её золотые шпили Кремля сверкают, стала мегаполисом, достойным имени «Третий Рим»."
