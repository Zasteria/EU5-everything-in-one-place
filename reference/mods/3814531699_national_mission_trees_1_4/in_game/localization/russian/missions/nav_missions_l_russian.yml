l_russian:
 nav_crown_mission_pack: "Наследие Королевства Наварра"
 nav_crown_mission_pack_DESCRIPTION:0 "Укоренённое в предгорьях Пиренеев, баскское Королевство Наварра — малая держава, стеснённая тремя великими державами Кастилии, Арагона и Франции. Однако его кровь течёт в королевских домах и Франции, и Арагона, и коль скоро колёса истории совпадут, перед ним ещё может открыться неожиданный путь к величию. Выкуешь ли ты баскское единство, продвинешься ли за Гасконь, дабы вмешаться во Францию, или захватишь господство над Иберийским полуостровом? Судьба этого малого королевства покоится в руках его короля."
 nav_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Заверши миссии как Королевство Наварра и утверди баскское единство вместе с влиянием на Иберию и Францию."
 nav_crown_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы пройти путём наследия Королевства Наварра."
 nav_crown_mission_pack_BUTTON_DETAILS:0 "Выкуй баскское единство, продвинься в Гасконь и заяви права на господство над Иберией!"
 nav_kingdom_of_pamplona: "Королевство Памплона"
 nav_kingdom_of_pamplona_desc: "Основанное Иньиго Аристой, Королевство Памплона — древний род, глубоко укоренённый в баскских землях. Однако, окружённое великими державами Кастилии, Арагона и Франции, его выживание всегда покоилось на хрупком равновесии."
 nav_secure_bayonne: "Обеспечь Байонну"
 nav_secure_bayonne_desc: "Настало время объединить наших соплеменников за морем, французских басков Байонны, под нашей короной. Все баски должны однажды собраться под единым знаменем."
 nav_basque_unity: "Баскское единство"
 nav_basque_unity_desc: "Народ, разделяющий наш язык и обычаи, ныне составляет ядро королевства. Быть баском стало нашей величайшей гордостью."
 nav_fueros_and_privileges: "Гарантируй фуэрос"
 nav_fueros_and_privileges_desc: "Фуэрос, древние привилегии самоуправления, давно удерживаемые баскскими городами. По мере того как знать становится довольнее, гарантия этих привилегий становится твёрдым фундаментом самой короны."
 nav_efficient_administration: "Эффективное управление"
 nav_efficient_administration_desc: "Учреждённые по всему королевству конторы укрепляют нашу налоговую основу. Для малого королевства эффективность правления — жизненная артерия."
 nav_renaissance_of_pamplona: "Возрождение Памплоны"
 nav_renaissance_of_pamplona_desc: "Новые веяния учёности, восходящие из Италии, достигли даже предгорий Пиренеев. Сколь бы мало ни было королевство, дух его шествует во главе эпохи."
 nav_intervene_hundred_years_war: "Вмешайся в Столетнюю войну"
 nav_intervene_hundred_years_war_desc: "Долгая борьба между Францией и Англией продолжает бушевать. Наша королевская кровь течёт в обеих коронах, и Наварра имеет и право, и возможность вмешаться как третья сила."
 nav_foothold_in_france: "Плацдарм во Франции"
 nav_foothold_in_france_desc: "Воспользуйся хаосом Столетней войны, дабы обеспечить часть французской земли. Это расширяет досягаемость королевства далеко в сердце юго-западной Франции."
 nav_secure_gascony: "Обеспечь Гасконь"
 nav_secure_gascony_desc: "Овладение землёй Тюрсан и захват порта Бордо приводит всю Гасконь под нашу власть, открывая врата к Атлантике."
 nav_claims_on_france: "Плацдарм для французской короны"
 nav_claims_on_france_desc: "Ныне, когда обширные земли внутри самой Франции обеспечены, честолюбие, кое наш дом питает к французскому престолу, уже не пустая мечта."
 nav_house_of_evreux: "Честолюбие дома Эврё"
 nav_house_of_evreux_desc: "Будь то через личную унию с Францией или прямой захват самого Парижа, легитимность, кою наш дом держит в отношении французского престола, ныне вне сомнений."
 nav_claim_french_throne: "Заяви права на французский престол"
 nav_claim_french_throne_desc: "Ныне, когда французская королевская линия угасла, наш дом стоит законным наследником её короны. Настало время двум коронам, Наварры и Франции, покоиться на единой главе."
 nav_aragonese_inheritance: "Кровные узы с Арагоном"
 nav_aragonese_inheritance_desc: "Наш дом и королевский дом Арагона разделяют одну и ту же родовую кровь. Судьбы двух держав ещё могут быть связаны воедино."
 nav_castilian_question: "Кастильский вопрос"
 nav_castilian_question_desc: "Кастилия, величайшая держава Иберийского полуострова. Свяжем ли мы себя с нею союзом или встанем против неё соперником — природа этих отношений должна быть прояснена."
 nav_reconquista_legacy: "Наследие Реконкисты"
 nav_reconquista_legacy_desc: "Память о веках борьбы против исламских держав — гордость, разделяемая всеми королевствами Иберии. И наше королевство несёт свою долю этой славы."
 nav_dominate_iberia: "Господство над Иберией"
 nav_dominate_iberia_desc: "То, что было некогда малым королевством, уже нельзя не замечать на Иберийском полуострове. Баскская корона стала достаточно могущественной, дабы вершить судьбу всего полуострова."
 nav_basque_seafarers: "Баскские рыбаки"
 nav_basque_seafarers_desc: "Народ басков издавна известен как бесстрашные рыбаки. Их умение и отвага должны ныне быть использованы как достояние государства."
 nav_fearless_fishermen: "Бесстрашные мореходы"
 nav_fearless_fishermen_desc: "Баскские моряки не страшатся даже бушующих северных морей. Их мореходное мастерство и отвага уже прославлены по всему континенту."
 nav_transatlantic_whalers: "Китобои через Атлантику"
 nav_transatlantic_whalers_desc: "Суда баскских китобоев, преследующих свою добычу, наконец достигли дальнего берега Атлантики. Промысел в этих новых водах сулит королевству огромное богатство."
 nav_basque_in_glory: "Баски во славе"
 nav_basque_in_glory_desc: "Малое королевство, рождённое в предгорьях Пиренеев, расцвело в культуре, захватило престол Франции и правило объединённой Иберией как Испания. Слава басков более не может быть отвергнута никем."
 STATIC_MODIFIER_NAME_nav_secure_bayonne_mod: "Военный опыт Байонны"
 STATIC_MODIFIER_DESC_nav_secure_bayonne_mod: "Включение Байонны дало нашим силам боевой опыт."
 STATIC_MODIFIER_NAME_nav_basque_unity_mod: "Баскское единство"
 STATIC_MODIFIER_DESC_nav_basque_unity_mod: "Баски — один из древнейших народов Европы, неизвестного происхождения, говорящий на языке, не родственном индоевропейской семье. Культурное единство басков, живущих по обе стороны Пиренеев, сохраняло собственную самобытность как под французским, так и под испанским владычеством."
 STATIC_MODIFIER_NAME_nav_fueros_and_privileges_mod: "Фуэрос гарантированы"
 STATIC_MODIFIER_DESC_nav_fueros_and_privileges_mod: "Фуэрос (привилегии и обычное право) — правовая система, гарантирующая традиционную автономию Наварры и Страны Басков. Собственные полномочия в налогообложении, воинской повинности и правосудии всегда пребывали в напряжении с централизующей кастильской короной. Эта самобытная правовая традиция составляет ядро наваррской самобытности."
 STATIC_MODIFIER_NAME_nav_efficient_administration_mod: "Эффективное правление"
 STATIC_MODIFIER_DESC_nav_efficient_administration_mod: "Королевство Наварра учредило «Камара де Комптос», ведомство финансового управления, и переняло административную систему французского образца. Административная утончённость, возникшая из долгих связей с французским королевским домом (наваррский королевский дом часто вступал в браки с французским), отличала его от прочих королевств Иберии."
 STATIC_MODIFIER_NAME_nav_renaissance_of_pamplona_mod: "Новый дух Памплоны"
 STATIC_MODIFIER_DESC_nav_renaissance_of_pamplona_mod: "Дух Возрождения повысил мастерство новых художников, вступающих в ремесло."
 STATIC_MODIFIER_NAME_nav_foothold_in_france_mod: "Плацдарм во Франции"
 STATIC_MODIFIER_DESC_nav_foothold_in_france_mod: "Королевство Наварра также держало земли к северу от Пиренеев, с Нижней Наваррой (нынешней французской Страной Басков) в их центре. Исторически наваррский королевский дом часто вступал в браки с французским, и удержание плацдарма во Франции было основой его дипломатии."
 STATIC_MODIFIER_NAME_nav_secure_gascony_mod: "Корона Гаскони"
 STATIC_MODIFIER_DESC_nav_secure_gascony_mod: "Обеспечение всей Гаскони укрепило блеск короны."
 STATIC_MODIFIER_NAME_nav_house_of_evreux_mod: "Престиж дома Эврё"
 STATIC_MODIFIER_DESC_nav_house_of_evreux_mod: "Твёрдые отношения с французским королевским домом повысили дипломатический вес нашей нации."
 STATIC_MODIFIER_NAME_nav_claim_french_throne_mod: "Двойные короны Наварры и Франции"
 STATIC_MODIFIER_DESC_nav_claim_french_throne_mod: "Ношение двойных корон Наварры и Франции повысило блеск королевства и устойчивость его правления."
 STATIC_MODIFIER_NAME_nav_castilian_question_mod: "Ясные отношения с Кастилией"
 STATIC_MODIFIER_DESC_nav_castilian_question_mod: "Прояснённые отношения с Кастилией повысили дипломатический вес нашей нации."
 STATIC_MODIFIER_NAME_nav_reconquista_legacy_mod: "Гордость Реконкисты"
 STATIC_MODIFIER_DESC_nav_reconquista_legacy_mod: "Память о борьбе против исламских держав повысила терпимость к нашей господствующей религии."
 STATIC_MODIFIER_NAME_nav_dominate_iberia_mod: "Владыка Иберии"
 STATIC_MODIFIER_DESC_nav_dominate_iberia_mod: "То, что Наварра, малое королевство Иберийского полуострова, превзошла великие державы Кастилии и Арагона и стала владыкой полуострова, напоминает мечту, кою на краткий срок осуществил Санчо III Великий (правил 1000–1035). Это историческое деяние, достижимое полным использованием географического преимущества удержания пиренейских перевалов."
 STATIC_MODIFIER_NAME_nav_basque_seafarers_mod: "Баскская рыбацкая традиция"
 STATIC_MODIFIER_DESC_nav_basque_seafarers_mod: "Рост рыбацких деревень постоянно поставляет по 5 моряков в месяц."
 STATIC_MODIFIER_NAME_nav_fearless_fishermen_mod: "Мораль бесстрашных мореходов"
 STATIC_MODIFIER_DESC_nav_fearless_fishermen_mod: "«Баскский моряк не боится бури» — присловье, известное по всей Европе. Мореходное мастерство и мужество, закалённые на бурных водах Бискайского залива («нашего моря» для басков), поставили их во главе атлантической эпохи. Многие моряки Непобедимой армады были басками."
 STATIC_MODIFIER_NAME_nav_transatlantic_whalers_mod: "Мореходное мастерство атлантических китобоев"
 STATIC_MODIFIER_DESC_nav_transatlantic_whalers_mod: "Считается, что баскские китобои с XV века промышляли гладких китов у побережья Лабрадора в Северной Америке. Остатки баскской китобойной станции сохранились в Ред-Бей в Канаде и включены в список Всемирного наследия ЮНЕСКО. Эта первопроходческая трансатлантическая деятельность заложила основу колониальной эпохи."
 STATIC_MODIFIER_NAME_nav_third_faction_mod: "Решимость независимой третьей силы"
 STATIC_MODIFIER_DESC_nav_third_faction_mod: "Решимость не примыкать ни к одной из великих держав повысила мораль армии."
 STATIC_MODIFIER_NAME_nav_basque_in_glory_mod: "Баски во славе"
 STATIC_MODIFIER_DESC_nav_basque_in_glory_mod: "Овладев культурой, дипломатией и правлением равно, баскская корона ныне излучает блеск, далеко превосходящий блеск малого королевства. Также постоянно усилены воинская дисциплина и мощь тяжёлых кораблей."
 nav_events.1.t: "Истоки Королевства Памплона"
 nav_events.1.d: "Королевство Наварра — наследник Королевства Памплона, основанного в IX веке Иньиго Аристой. Сосредоточенный вокруг Страны Басков, этот род родился маркой Каролингской империи и продолжал прокладывать собственный курс между двумя великими державами исламских царств и Франкского королевства. Настало время вновь поднять его знамя в предгорьях Пиренеев."
 nav_events.1.a: "История королевства принята близко к сердцу"
 nav_events.2.t: "Честолюбие в отношении французского престола"
 nav_events.2.d: "Наш дом, дом Эврё, разделяет кровь с самим королевским домом Франции. Ныне, когда обширные земли внутри Франции обеспечены, король Наварры может открыто заявить своё право на её наследование. Эта легитимность должна ныне быть доказана и при дворе, и на поле боя."
 nav_events.2.a: "Дело притязания поднято"
 nav_events.3.t: "Кровные узы с Арагоном"
 nav_events.3.d: "Королевские дома Наварры и Арагона разделяют одну и ту же родовую кровь. Отнюдь не редкость, что наследники обоих престолов — одно и то же лицо. Угасни любая из линий, и обе державы ещё могут быть предназначены объединиться под единой короной."
 nav_events.3.a: "Значение этого родства понято"
 nav_events.4.t: "Вмешательство в Столетнюю войну"
 nav_events.4.d: "Столетняя война между Францией и Англией уже давно не простой конфликт двух наций. Наш дом, дом Эврё, происходит от французской капетингской линии, одновременно держа глубокие узы брака с английским двором. Более того, сама наваррская корона долго служила важным прецедентом в спорах о французских законах наследования.\n\nВ этот бурный век перед Наваррой открыты три пути. Один — поддержать Францию, во имя кровных уз и давней дружбы. Другой — поддержать Англию, ради торговых интересов и как оплот против Кастилии. И последний — не примкнуть ни к одной из великих держав, преследуя собственные интересы как независимая третья сила. Этот выбор ляжет тяжким бременем на судьбу королевства."
 nav_events.4.a: "Поддержать Францию"
 nav_events.4.b: "Поддержать Англию"
 nav_events.4.c: "Вступить в войну как независимая третья сила"
