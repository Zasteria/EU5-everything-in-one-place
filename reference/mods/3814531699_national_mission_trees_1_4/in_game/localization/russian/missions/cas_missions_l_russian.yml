l_russian:
 cas_castile_dev_hub: "Развитие коронных городов"
 cas_castile_dev_hub_desc: "Направь развитие городов, принадлежащих кастильскому коронному домену, и обеспечь экономическую основу королевства."
 cas_granada_dev_hub: "Возрождение Гранады"
 cas_granada_dev_hub_desc: "Принеси новое процветание городам павшего Королевства Гранада — самой Гранаде и Малаге."
 STATIC_MODIFIER_NAME_cas_crown_domains_mod: "Развитие коронных городов"
 STATIC_MODIFIER_DESC_cas_crown_domains_mod: "Сборщики податей короля с гордостью обходят новые рынки и стены, воздвигнутые в коронных городах."
 STATIC_MODIFIER_NAME_cas_granada_dev_mod: "Гранада возрождена"
 STATIC_MODIFIER_DESC_cas_granada_dev_mod: "Из окон Альгамбры звон новых церковных колоколов разносится по всей долине."
 cas_castile_mission_pack: "Слава Королевства Кастилия"
 cas_castile_mission_pack_DESCRIPTION:0 "В 1337 году Кастилия — могущественное королевство под властью Альфонсо XI. Реконкиста почти завершена — остаётся лишь Гранада. Падение Гранады, уния с Арагоном, плавание Колумба, конкистадоры Кортес и Писарро и Империя Филиппа II, над коей никогда не заходит солнце. Пронесись сквозь историю Кастилии."
 cas_castile_mission_pack_CRITERIA_DESCRIPTION:0 "Заверши Реконкисту, образуй Испанию, построй колониальную империю и утверди Империю, над коей никогда не заходит солнце."
 cas_castile_mission_pack_BUTTON_TOOLTIP:0 "Заверши миссии, дабы утвердить Империю, над коей никогда не заходит солнце."
 cas_castile_mission_pack_BUTTON_DETAILS:0 "От падения Гранады до мировой империи Филиппа II!"
 cas_sword_of_castile: "Меч Кастилии"
 cas_sword_of_castile_desc: "1337 год — Альфонсо XI энергично правит Кастилией. В битве при Рио-Саладо в 1340 году он уничтожил объединённые силы Маринидов и Гранады, заложив основу для изгнания последней мусульманской державы с Иберийского полуострова. Подними короны Кастилии и Леона и вновь занеси меч Реконкисты."
 cas_secure_castile: "Расширение Вальядолида"
 cas_secure_castile_desc: "Полностью овладев и Кастилией, и Леоном, утверди центральную базу Реконкисты."
 cas_fall_of_granada: "Падение Гранады"
 cas_fall_of_granada_desc: "2 января 1492 года — последний султан Гранады, Боабдил, передаёт ключи Изабелле Кастильской на «Холме Слёз». Реконкиста, длившаяся 780 лет, наконец завершена."
 cas_conquer_navarre: "Завоюй Наварру"
 cas_conquer_navarre_desc: "Захват Королевства Наварра на пиренейском перекрёстке утверждает границу с Францией и завершает господство над Северной Иберией."
 cas_subdue_aragon: "Уния с Арагоном"
 cas_subdue_aragon_desc: "Брак Изабеллы и Фердинанда (1469) создал личную унию Кастилии и Арагона. Под «Католическими королями» Испания обретает форму."
 cas_form_spain: "Образование Испании"
 cas_form_spain_desc: "Кастилия, объединившая большую часть Иберийского полуострова, формально провозглашает «Королевство Испания». Рождение величайшей державы Европы."
 cas_conquer_portugal: "Включение Португалии"
 cas_conquer_portugal_desc: "В 1580 году Филипп II унаследовал португальский престол — «Иберийская уния». Это дало Испании контроль также и над колониальной империей Португалии."
 cas_iberian_union: "Иберийская уния"
 cas_iberian_union_desc: "Весь Иберийский полуостров попадает под испанское владычество. От Атлантики до Индийского океана испанские и португальские колонии покрывают мир."
 cas_holy_brotherhood: "Санта Эрмандад"
 cas_holy_brotherhood_desc: "Санта Эрмандад (Святое братство), учреждённое королевой Изабеллой, подавляет власть знати и укрепляет королевскую власть как правоохранительная организация."
 cas_inquisition: "Испанская инквизиция"
 cas_inquisition_desc: "В 1478 году папа Сикст IV даровал Изабелле и Фердинанду полномочия учредить инквизицию. Инквизиторы под водительством Торквемады трудятся над сохранением чистоты веры."
 cas_expulsion_of_jews: "Указ об изгнании"
 cas_expulsion_of_jews_desc: "Альгамбрский указ 1492 года — объявляется изгнание из Испании евреев, отказавшихся от обращения. Это решение сохраняет католическую чистоту, но лишает страну многих одарённых купцов и учёных."
 cas_catholic_monarchs: "Католические короли"
 cas_catholic_monarchs_desc: "Папа Александр VI дарует Изабелле и Фердинанду титул «Католические короли» (Reyes Católicos). Испания признана стражем католического мира."
 cas_absolute_crown: "Абсолютная монархия"
 cas_absolute_crown_desc: "Ограничение дворянских привилегий и абсолютизация королевской власти — Испания возникает одним из первых современных абсолютистских государств Европы."
 cas_cortes: "Кастильские кортесы"
 cas_cortes_desc: "Кортесы (парламент) — традиционное сословное собрание Кастилии. Уравновешивание королевской власти и парламента утверждает устойчивую систему правления."
 cas_leyes_de_indias: "Законы Индий"
 cas_leyes_de_indias_desc: "Законы Индий, регулирующие обращение с коренными народами в колониях — учреждены в ответ на гуманитарные доводы Бартоломе де лас Касаса."
 cas_canary_islands: "Канарские острова"
 cas_canary_islands_desc: "Канарские острова в Атлантике — стратегическая точка в соперничестве с Португалией. Контроль над этими островами начинает атлантическую экспансию Испании."
 cas_atlantic_exploration: "Атлантическое исследование"
 cas_atlantic_exploration_desc: "Пока Португалия движется на юг вдоль африканского побережья, Испания обращается на запад через Атлантику. Мечта о «западном пути в Индию» готова стать явью."
 cas_columbus_voyage: "Плавание Колумба"
 cas_columbus_voyage_desc: "3 августа 1492 года — Христофор Колумб отплывает из Палоса. Три корабля — «Санта-Мария», «Пинта» и «Нинья» — пересекают Атлантику и открывают врата в новый мир."
 cas_conquer_caribbean: "Завоюй Карибы"
 cas_conquer_caribbean_desc: "С Эспаньолой (Санто-Доминго) как базой, утверждается испанское владычество на Карибах. Сахар, табак и драгоценные металлы создают поток богатства в Испанию."
 cas_conquer_mexico: "Завоюй Мексику"
 cas_conquer_mexico_desc: "1519-1521 гг. — Эрнан Кортес завоевал ацтекскую столицу Теночтитлан с 500 солдатами. Рождается «Вице-королевство Новая Испания»."
 cas_conquer_peru: "Завоюй Перу"
 cas_conquer_peru_desc: "Франсиско Писарро сверг Империю Инков со 168 людьми — одно из самых поразительных завоеваний истории. Золото и серебро Анд текут в Испанию."
 cas_silver_of_potosi: "Серебро Потоси"
 cas_silver_of_potosi_desc: "Серебряные копи Потоси (открыты в 1545 году, высота 4000 м) — величайшие в европейской истории. Серебро с «Серро-Рико (Богатой горы)» поддерживает финансы Испанской империи."
 cas_colonial_empire: "Колониальная империя"
 cas_colonial_empire_desc: "От Мексики до Перу, от Карибов до южного побережья Северной Америки — испанские колониальные нации покрывают мир. Свершения конквистадоров закладывают основу империи."
 cas_manila_galleon: "Манильский галеон"
 cas_manila_galleon_desc: "После основания Манилы в 1571 году Манильский галеон монополизировал трансокеанскую торговлю между Акапулько и Манилой — первый в мире воистину глобальный торговый путь, связующий азиатский шёлк и фарфор с американским серебром."
 cas_conquer_naples: "Завоюй Королевство Неаполь"
 cas_conquer_naples_desc: "«Эль Гран Капитан» Гонсало де Кордова разбил Францию и захватил Неаполь. Испанское влияние на Италию утверждено."
 cas_conquer_sicily: "Обеспечь Сицилию"
 cas_conquer_sicily_desc: "Сицилия, средиземноморская житница, уже под арагонской короной, включается в Испанскую империю, завершая контроль над средиземноморскими островами."
 cas_conquer_milan: "Покори Милан"
 cas_conquer_milan_desc: "Как окончательный итог Итальянских войн, герцогство Милан попадает под испанское владычество. Весь итальянский полуостров становится испанской сферой влияния."
 cas_mediterranean_mastery: "Господство над Средиземноморьем"
 cas_mediterranean_mastery_desc: "Неаполь, Сицилия, Сардиния, Милан — средиземноморская империя Испании утверждена. Впервые со времён античного Рима Средиземноморьем владеет одна держава."
 cas_battle_of_lepanto: "Битва при Лепанто"
 cas_battle_of_lepanto_desc: "7 октября 1571 года — флот Христианской лиги Испании, Венеции и папы уничтожает османский флот. «Победа Священной лиги». Христианское превосходство в Средиземноморье утверждено."
 cas_secure_ceuta: "Обеспечь Сеуту"
 cas_secure_ceuta_desc: "Сеута, стоящая напротив Иберийского полуострова через Гибралтарский пролив, — врата в Африку. Контроль над ней обеспечивает западный вход в Средиземноморье."
 cas_conquer_oran: "Завоюй Оран"
 cas_conquer_oran_desc: "В 1509 году кардинал Сиснерос завоевал Оран — первый шаг «Африканской Реконкисты». Начинается контрудар против мусульманских сил в Северной Африке."
 cas_conquer_tunis: "Завоюй Тунис"
 cas_conquer_tunis_desc: "В 1535 году испанские силы Карла V завоевали Тунис. Военная мощь Испании, соперничающая с Османской империей за господство в Северной Африке, продемонстрирована миру."
 cas_north_africa_dominion: "Владычество над Северной Африкой"
 cas_north_africa_dominion_desc: "От Сеуты до Орана средиземноморское побережье Северной Африки попадает под испанское владычество. Мусульманское пиратство искоренено, средиземноморская торговля стабилизируется."
 cas_dev_sevilla: "Врата Индий"
 cas_dev_sevilla_desc: "Севилья на Гвадалквивире — древний город процветает как исключительные врата для торговли с Новым Светом. «Каса де Контратасьон» превращает его в величайший торговый город мира."
 cas_casa_de_contratacion: "Каса де Контратасьон"
 cas_casa_de_contratacion_desc: "Учреждённая в Севилье в 1503 году, Каса де Контратасьон (Торговая палата) исключительно управляет испанской колониальной торговлей. Вся торговля с Новым Светом проходит через неё."
 cas_dev_toledo: "Промышленность толедских клинков"
 cas_dev_toledo_desc: "Толедо — историческая столица Кастилии и промышленный город, славный мечами, золотыми изделиями и шёлком. Слава «толедской стали» распространяется по всему миру."
 cas_dev_madrid: "Мадрид как столица"
 cas_dev_madrid_desc: "В 1561 году Филипп II объявил Мадрид постоянной столицей — революционная перемена для Испании, где двор прежде переезжал из города в город. Население Мадрида стремительно растёт."
 cas_dev_burgos: "Город Сида"
 cas_dev_burgos_desc: "Бургос, «Город Сида» — историческая столица Кастилии, процветающая через экспорт шерсти в Северную Европу."
 cas_trade_network: "Имперская торговая сеть"
 cas_trade_network_desc: "От Севильи до Манилы, от Антверпена до Нового Света — имперская торговая сеть Испании охватывает весь земной шар."
 cas_tercio: "Терсио (испанский квадрат)"
 cas_tercio_desc: "Величайшая тактика XVI века — терсио сочетает пикинёров, мушкетёров и мечников в пехотном строю. «Испанская пехота — сильнейшая в мире» доказывается на поле боя."
 cas_military_orders: "Военные ордена"
 cas_military_orders_desc: "Три военных ордена — Сантьяго, Калатрава и Алькантара — в эпоху Католических королей их достояние и власть приведены под королевский контроль, дабы поддержать военную мощь."
 cas_grande_armada: "Испанская Армада"
 cas_grande_armada_desc: "В 1588 году Филипп II отправил великий флот из 130 кораблей «Армаду» для завоевания Англии — символизируя вершину испанской морской мощи."
 cas_conquistadors: "Конквистадоры"
 cas_conquistadors_desc: "Кортес, Писарро, Бальбоа, де Сото — имена завоевателей запечатлены в истории. Завоевав обширные империи малым числом солдат, они продемонстрировали миру превосходство испанских военных технологий."
 cas_salamanca_university: "Университет Саламанки"
 cas_salamanca_university_desc: "Основанный в 1218 году, Университет Саламанки — один из старейших в Европе. Как лучшее учреждение богословия, права и медицины, он готовит чиновников, духовенство и учёных Испанской империи."
 cas_siglo_de_oro: "Золотой век (Siglo de Oro)"
 cas_siglo_de_oro_desc: "Сервантес, Лопе де Вега, Веласкес, Эль Греко — расцветает испанский культурный золотой век XVI-XVII веков. Испания ведёт Европу в литературе, театре и живописи."
 cas_escorial: "Эль-Эскориал"
 cas_escorial_desc: "Дворец-монастырь Эль-Эскориал, строительство коего в 1563 году повелел Филипп II — сочетая дворец, монастырь и усыпальницу, это грандиозное сооружение символизирует вершину Испанской империи."
 cas_dev_granada_city: "Жемчужина Испании"
 cas_dev_granada_city_desc: "Гранада, дом дворца Альгамбра, — город, где дышит мусульманское культурное наследие. Разви эту «жемчужину Испании» как культурный и экономический центр юга."
 cas_dev_cordoba: "Слава кордовской кожи"
 cas_dev_cordoba_desc: "Знаменитая Мескитой, Кордова была некогда столицей Омейядского халифата и крупнейшим городом мира. Используй это наследие, дабы развить её как центр культуры и учёности."
 cas_inherit_flanders: "Унаследуй Фландрию"
 cas_inherit_flanders_desc: "Фландрия была включена в Испанию как часть бургундского наследства. Богатые текстильные города Антверпен, Брюгге и Гент поддерживают финансы Испанской империи."
 cas_revolt_of_flanders: "Умиротвори Фландрию"
 cas_revolt_of_flanders_desc: "Подави фламандское сопротивление и включи этот процветающий регион устойчивой частью Испанской империи."
 cas_greatest_power: "Основание неувядающей империи"
 cas_greatest_power_desc: "Колониальная империя, терсио и Армада — три столпа завершены, и Испания достигла невиданной высоты процветания. Настал миг сделать последний шаг к Империи, над коей никогда не заходит солнце."
 cas_empire_of_the_sun: "Империя, над коей никогда не заходит солнце"
 cas_empire_of_the_sun_desc: "«В моей Империи солнце никогда не заходит» — слова Карла V становятся явью. От Испании до Неаполя, Фландрии до Нового Света, Манилы до Карибов — испанское знамя реет повсюду на Земле."
 cas_battle_rio_salado: "Победа при Рио-Саладо"
 cas_battle_rio_salado_desc: "В битве при Рио-Саладо в 1340 году Альфонсо XI разбил объединённые силы Маринидов и Гранады — открывается занавес последнего акта Реконкисты."
 cas_dev_leon_city: "Слава старого Королевства Леон"
 cas_dev_leon_city_desc: "Леон, прежняя столица Королевства Леон, некогда возглавлявшего Реконкисту, — разви его, опираясь на его историю и традицию."
 cas_church_reform: "Церковная реформа"
 cas_church_reform_desc: "Церковная реформа под водительством кардинала Сиснероса — восстановление монастырской дисциплины, улучшение образования духовенства и искоренение коррупции делают Католическую церковь Испании сильнейшей духовной властью Европы."
 cas_counter_reformation: "Контрреформация"
 cas_counter_reformation_desc: "Орден иезуитов, основанный Игнатием Лойолой — Контрреформация во главе с Испанией противостоит протестантской угрозе. Тридентский собор вновь утверждает католическую доктрину."
 cas_conquer_cuba: "Завоюй Кубу"
 cas_conquer_cuba_desc: "В 1511 году Диего Веласкес завоевал Кубу. Гавана развивается как карибский торговый узел и становится ключевым портом на путях в Новый Свет."
 cas_conquer_florida: "Исследуй Флориду"
 cas_conquer_florida_desc: "Хуан Понсе де Леон открыл «Ла Флориду (Землю цветов)» в 1513 году — преследуя легенду об «Источнике молодости», начинается исследование Северной Америки."
 cas_conquer_philippines: "Завоюй Филиппины"
 cas_conquer_philippines_desc: "В 1565 году Мигель Лопес де Легаспи завоевал Филиппинские острова и основал Манилу. Азиатская экспансия Испании осуществлена, и рождается трансокеанская торговля Манильского галеона."
 cas_gold_fleets: "Золотые и серебряные флоты"
 cas_gold_fleets_desc: "Серебро Потоси и золото инков — ежегодный «Флот Индий (Flota de Indias)», идущий в Испанию, создаёт величайший в мире поток богатства."
 cas_sardinia: "Обеспечь Сардинию"
 cas_sardinia_desc: "Сардиния, уже под арагонской короной, включается в Испанскую империю, завершая контроль над островами западного Средиземноморья."
 cas_conquer_tunis_italy: "Утверди итальянское владычество"
 cas_conquer_tunis_italy_desc: "Неаполь, Сицилия, Сардиния, Милан — главные регионы Итальянского полуострова попадают под испанское владычество, добавляя богатство Возрождения к процветанию Испанской империи."
 cas_garrison_system: "Крепостная оборонная сеть"
 cas_garrison_system_desc: "Крепостная оборонная сеть, защищающая обширную Испанскую империю — терсио во Фландрии, крепости в Неаполе и президии в Северной Африке охраняют границы империи."
 cas_dev_cadiz: "Древний финикийский порт"
 cas_dev_cadiz_desc: "Древний финикийский город Кадис стоит на естественной гавани на атлантическом полуострове. Ему суждено заменить Севилью вратами для индийской торговли."
 cas_dev_malaga: "Развей Малагу"
 cas_dev_malaga_desc: "Малага на средиземноморском побережье — торговый город, известный шёлком, вином и изюмом. Он быстро развивается после завоевания Гранады."
 cas_dev_valencia: "Город Солнца"
 cas_dev_valencia_desc: "Валенсия, «Город Солнца», — средиземноморский торговый узел, производящий шёлк, сахар и рис. Развитие главного города арагонской короны приносит процветание восточному побережью Испании."
 cas_dev_zaragoza: "Столица Арагона"
 cas_dev_zaragoza_desc: "Сарагоса, столица Королевства Арагон, — ключевой транспортный узел на реке Эбро. Её развитие оживляет внутреннюю иберийскую торговлю."
 cas_dev_barcelona: "Царица Средиземноморья"
 cas_dev_barcelona_desc: "Барселона, центр средиземноморской торговли — разви каталонскую столицу, величайший торговый город Арагона, как средиземноморский торговый узел Испанской империи."
 cas_dev_segovia: "Акведук Сеговии"
 cas_dev_segovia_desc: "Сеговия, знаменитая акведуком и королевским замком, развивается как символ кастильской королевской власти."
 cas_west_africa_trade: "Западноафриканская торговля"
 cas_west_africa_trade_desc: "Используя Канарские острова как плацдарм, Испания вступает в западноафриканскую торговлю, соперничая с Португалией за пути слоновой кости, золота и, в конечном счёте, работорговли."
 cas_council_of_trent: "Тридентский собор"
 cas_council_of_trent_desc: "Тридентский собор (1545-1563) — во главе с Испанией, вновь утверждающий католическую доктрину и устанавливающий направления Контрреформации. Иезуиты стоят во главе контрудара против протестантства."
 cas_events.20.t: "Падение Гранады — завершение Реконкисты"
 cas_events.20.d: "2 января 1492 года — врата Альгамбры распахиваются, и последний султан Гранады, Мухаммад XII (Боабдил), передаёт ключи Изабелле и Фердинанду на «Холме Слёз». Реконкиста, длившаяся 780 лет, наконец завершена. «Плачь ныне, ибо ты не смог сражаться, как мужчина» — слова матери Боабдила остаются в истории."
 cas_events.20.a: "Слава Испании! Реконкиста завершена! Слава Богу и Деве Марии!"
 cas_events.30.t: "Католические короли — уния с Арагоном"
 cas_events.30.d: "Десятилетия спустя после брака Изабеллы и Фердинанда — настало время унии Кастилии и Арагона. Папа Александр VI дарует им титул «Католические короли» (Reyes Católicos), и образование Испании как нации становится явью."
 cas_events.30.a: "Слава Католическим королям! Испания едина в единой вере!"
 cas_events.50.t: "Плавание Колумба — открытие Нового Света"
 cas_events.50.d: "12 октября 1492 года — Христофор Колумб высаживается на острове Гуанахани на Багамах. Открывается существование Нового Света, неведомого европейцам. Открытие Колумба, веровавшего, что он достиг «Индий (Азии)», принесёт Испании неисчислимое богатство."
 cas_events.50.a: "Благословение Господне над Новым Светом! Знамя Испании до дальнего берега Атлантики!"
 cas_events.99.t: "Империя, над коей никогда не заходит солнце"
 cas_events.99.d: "«В моей Империи солнце никогда не заходит (En mi Imperio nunca se pone el sol)» — слова Карла V становятся явью. От Испании до Неаполя, Фландрии до Нового Света, Филиппин до Карибов, испанский флаг реет в каждом уголке мира. В правление Филиппа II Испанская империя завершена как первая «мировая империя» человечества."
 cas_events.99.a: "Слава Империи, над коей никогда не заходит солнце! Испания навеки!"
 STATIC_MODIFIER_NAME_cas_reconquista_spirit_mod: "Дух Реконкисты"
 STATIC_MODIFIER_DESC_cas_reconquista_spirit_mod: "Меч Кастилии вдохновляет священную войну против мусульман Иберии."
 STATIC_MODIFIER_NAME_cas_rio_salado_mod: "Победа при Рио-Саладо"
 STATIC_MODIFIER_DESC_cas_rio_salado_mod: "Сокрушение коалиции Маринидов и Гранады при Рио-Саладо открывает последний акт Реконкисты."
 STATIC_MODIFIER_NAME_cas_leon_city_mod: "Слава старого Королевства Леон"
 STATIC_MODIFIER_DESC_cas_leon_city_mod: "Древняя столица Леона развита как символ наследия Реконкисты."
 STATIC_MODIFIER_NAME_cas_church_reform_mod: "Церковная реформа"
 STATIC_MODIFIER_DESC_cas_church_reform_mod: "Реформа Сиснероса делает Католическую церковь Испании самой дисциплинированной и могущественной в Европе."
 STATIC_MODIFIER_NAME_cas_counter_ref_mod: "Контрреформация"
 STATIC_MODIFIER_DESC_cas_counter_ref_mod: "Испания возглавляет католический контрудар против протестантской Реформации."
 STATIC_MODIFIER_NAME_cas_havana_mod: "Гавана — карибский узел"
 STATIC_MODIFIER_DESC_cas_havana_mod: "Гавана развита как величайший торговый и морской узел Карибов."
 STATIC_MODIFIER_NAME_cas_florida_mod: "Ла Флорида"
 STATIC_MODIFIER_DESC_cas_florida_mod: "Испанское исследование Северной Америки утверждает присутствие на юго-востоке континента."
 STATIC_MODIFIER_NAME_cas_philippines_mod: "Филиппинские острова"
 STATIC_MODIFIER_DESC_cas_philippines_mod: "Азиатская экспансия Испании осуществлена — Манила становится узлом трансокеанской торговли."
 STATIC_MODIFIER_NAME_cas_sardinia_mod: "Королевство Сардиния"
 STATIC_MODIFIER_DESC_cas_sardinia_mod: "Средиземноморская житница Сардиния под испанским контролем."
 STATIC_MODIFIER_NAME_cas_italy_dominion_mod: "Итальянское владычество"
 STATIC_MODIFIER_DESC_cas_italy_dominion_mod: "Итальянский полуостров попадает под испанское владычество — богатство Возрождения добавлено к империи."
 STATIC_MODIFIER_NAME_cas_garrison_mod: "Крепостная сеть"
 STATIC_MODIFIER_DESC_cas_garrison_mod: "Стратегическая крепостная сеть охраняет обширные границы Испанской империи."
 STATIC_MODIFIER_NAME_cas_cadiz_mod: "Древний финикийский порт"
 STATIC_MODIFIER_DESC_cas_cadiz_mod: "Естественная гавань Кадиса становится главными атлантическими торговыми вратами."
 STATIC_MODIFIER_NAME_cas_malaga_mod: "Шёлк Малаги"
 STATIC_MODIFIER_DESC_cas_malaga_mod: "После завоевания Гранады тёплый климат и плодородная земля Малаги развиваются как шелкопроизводящий регион. Мастера Альгамбры поддерживают шёлковую промышленность Малаги, торгуемую по высоким ценам по всему Средиземноморью."
 STATIC_MODIFIER_NAME_cas_valencia_mod: "Город Солнца"
 STATIC_MODIFIER_DESC_cas_valencia_mod: "Шёлк и средиземноморская торговля Валенсии делают её восточным экономическим центром Испании."
 STATIC_MODIFIER_NAME_cas_zaragoza_mod: "Столица Арагона"
 STATIC_MODIFIER_DESC_cas_zaragoza_mod: "Сарагоса на Эбро оживляет внутренние иберийские торговые сети."
 STATIC_MODIFIER_NAME_cas_barcelona_mod: "Барселона — средиземноморский узел"
 STATIC_MODIFIER_DESC_cas_barcelona_mod: "Барселона как величайший средиземноморский торговый город Испании."
 STATIC_MODIFIER_NAME_cas_reconquista_done_mod: "Реконкиста завершена"
 STATIC_MODIFIER_DESC_cas_reconquista_done_mod: "780 лет священной войны завершены — Испания объединена под католической верой. Понятие «Испания» сформировано."
 STATIC_MODIFIER_NAME_cas_hermandad_mod: "Святое братство"
 STATIC_MODIFIER_DESC_cas_hermandad_mod: "Стрелки Эрмандад патрулируют дороги, и даже врата дворянских замков открываются перед королевским правосудием."
 STATIC_MODIFIER_NAME_cas_inquisition_mod: "Испанская инквизиция"
 STATIC_MODIFIER_DESC_cas_inquisition_mod: "Инквизиторы Святой службы в чёрных рясах ходят от города к городу, и люди свидетельствуют о своей вере приглушёнными голосами."
 STATIC_MODIFIER_NAME_cas_pure_faith_mod: "Чистота веры"
 STATIC_MODIFIER_DESC_cas_pure_faith_mod: "Изгнание евреев утверждает католическую чистоту Испании."
 STATIC_MODIFIER_NAME_cas_catholic_monarchs_mod: "Наследие Католических королей"
 STATIC_MODIFIER_DESC_cas_catholic_monarchs_mod: "Папски дарованный титул «Католические короли» утверждает власть Испании."
 STATIC_MODIFIER_NAME_cas_absolutism_mod: "Абсолютизм"
 STATIC_MODIFIER_DESC_cas_absolutism_mod: "Королевская власть становится абсолютной, и Испания возникает современным централизованным государством."
 STATIC_MODIFIER_NAME_cas_cortes_mod: "Кортесы"
 STATIC_MODIFIER_DESC_cas_cortes_mod: "В палате кортесов Кастилии король и делегаты городов сидят за одним столом, устанавливая условия правления."
 STATIC_MODIFIER_NAME_cas_colonial_law_mod: "Законы Индий"
 STATIC_MODIFIER_DESC_cas_colonial_law_mod: "Колониальное административное право кодифицировано, стабилизируя управление обширными заморскими территориями."
 STATIC_MODIFIER_NAME_cas_canary_mod: "Плацдарм на Канарах"
 STATIC_MODIFIER_DESC_cas_canary_mod: "Плацдарм для атлантической экспансии учреждён."
 STATIC_MODIFIER_NAME_cas_atlantic_mod: "Дух атлантического исследования"
 STATIC_MODIFIER_DESC_cas_atlantic_mod: "Стремление исследовать неведомые моря делает возможным атлантическое господство Испании."
 STATIC_MODIFIER_NAME_cas_caribbean_mod: "Владычество над Карибами"
 STATIC_MODIFIER_DESC_cas_caribbean_mod: "Карибское море становится «внутренним морем» Испанской империи."
 STATIC_MODIFIER_NAME_cas_mexico_mod: "Вице-королевство Новая Испания"
 STATIC_MODIFIER_DESC_cas_mexico_mod: "Завоевание Ацтекской империи рождает Вице-королевство Новая Испания."
 STATIC_MODIFIER_NAME_cas_peru_mod: "Вице-королевство Перу"
 STATIC_MODIFIER_DESC_cas_peru_mod: "Завоевание Империи Инков рождает Вице-королевство Перу. Богатство Анд течёт в Испанию."
 STATIC_MODIFIER_NAME_cas_potosi_mod: "Серебряные копи Потоси"
 STATIC_MODIFIER_DESC_cas_potosi_mod: "Крупнейший в мире серебряный рудник поддерживает финансы Испанской империи; серебро становится валютой Испании."
 STATIC_MODIFIER_NAME_cas_colonial_empire_mod: "Колониальная империя"
 STATIC_MODIFIER_DESC_cas_colonial_empire_mod: "Глобальная испанская колониальная империя завершена; мечта конквистадоров становится явью."
 STATIC_MODIFIER_NAME_cas_manila_galleon_mod: "Манильская галеонная торговля"
 STATIC_MODIFIER_DESC_cas_manila_galleon_mod: "Манильские галеоны, пересекающие Тихий океан, утверждают первый глобальный торговый путь, связующий Азию и Америку."
 STATIC_MODIFIER_NAME_cas_naples_mod: "Королевство Неаполь"
 STATIC_MODIFIER_DESC_cas_naples_mod: "Королевство Неаполь попадает под испанскую корону, утверждая влияние в Италии."
 STATIC_MODIFIER_NAME_cas_sicily_mod: "Королевство Сицилия"
 STATIC_MODIFIER_DESC_cas_sicily_mod: "Сицилия, житница Средиземноморья, стабилизирована под испанским правлением."
 STATIC_MODIFIER_NAME_cas_milan_mod: "Герцогство Милан"
 STATIC_MODIFIER_DESC_cas_milan_mod: "Как итог Итальянских войн, Милан попадает в сферу влияния Испании."
 STATIC_MODIFIER_NAME_cas_mediterranean_mod: "Гегемон Средиземноморья"
 STATIC_MODIFIER_DESC_cas_mediterranean_mod: "Испания захватывает господство над Средиземноморьем — впервые со времён античного Рима морем владеет одна держава."
 STATIC_MODIFIER_NAME_cas_lepanto_mod: "Герой Лепанто"
 STATIC_MODIFIER_DESC_cas_lepanto_mod: "Битва при Лепанто сокрушает османский флот, утверждая христианское превосходство в Средиземноморье."
 STATIC_MODIFIER_NAME_cas_ceuta_mod: "Крепость Сеута"
 STATIC_MODIFIER_DESC_cas_ceuta_mod: "Сеута, врата Гибралтарского пролива, обеспечена — врата в Африку открыты."
 STATIC_MODIFIER_NAME_cas_oran_mod: "Завоевание Орана"
 STATIC_MODIFIER_DESC_cas_oran_mod: "Реконкиста расширяется в Северную Африку — Оран становится испанским северо-африканским оплотом."
 STATIC_MODIFIER_NAME_cas_tunis_mod: "Покорение Туниса"
 STATIC_MODIFIER_DESC_cas_tunis_mod: "Завоевав Тунис, Испания оспаривает у Османской империи господство в Северной Африке."
 STATIC_MODIFIER_NAME_cas_north_africa_mod: "Владычество над Северной Африкой"
 STATIC_MODIFIER_DESC_cas_north_africa_mod: "Средиземноморское побережье Северной Африки попадает под испанское правление, стабилизируя средиземноморскую торговлю."
 STATIC_MODIFIER_NAME_cas_casa_contratacion_mod: "Каса де Контратасьон"
 STATIC_MODIFIER_DESC_cas_casa_contratacion_mod: "Севильская Каса де Контратасьон монополизирует торговлю с Новым Светом — рождается величайшее в мире торговое учреждение."
 STATIC_MODIFIER_NAME_cas_tercio_mod: "Терсио"
 STATIC_MODIFIER_DESC_cas_tercio_mod: "Терсио, лучший пехотный строй мира, становится основой испанской армии."
 STATIC_MODIFIER_NAME_cas_military_orders_mod: "Военные ордена"
 STATIC_MODIFIER_DESC_cas_military_orders_mod: "Военные ордена Сантьяго, Калатрава и Алькантара присоединяются к испанской армии."
 STATIC_MODIFIER_NAME_cas_armada_mod: "Непобедимая Армада"
 STATIC_MODIFIER_DESC_cas_armada_mod: "Из 130 кораблей, «Непобедимая Армада» воплощает вершину испанской морской мощи."
 STATIC_MODIFIER_NAME_cas_conquistadors_mod: "Конквистадоры"
 STATIC_MODIFIER_DESC_cas_conquistadors_mod: "Легенда о Кортесе и Писарро живёт — испанские конквистадоры проносятся по всему миру."
 STATIC_MODIFIER_NAME_cas_siglo_de_oro_mod: "Золотой век"
 STATIC_MODIFIER_DESC_cas_siglo_de_oro_mod: "Эпоха Сервантеса, Веласкеса и Эль Греко — испанская культура стоит на вершине мира."
 STATIC_MODIFIER_NAME_cas_escorial_mod: "Эль-Эскориал"
 STATIC_MODIFIER_DESC_cas_escorial_mod: "Дворец, монастырь и усыпальница Филиппа II воплощают вершину Испанской империи."
 STATIC_MODIFIER_NAME_cas_segovia_mod: "Акведук Сеговии"
 STATIC_MODIFIER_DESC_cas_segovia_mod: "Великий римский акведук восстановлен и модернизирован, резко улучшая водоснабжение Сеговии. Этот акведук становится образцом для водной инфраструктуры по всей Кастилии."
 STATIC_MODIFIER_NAME_cas_west_africa_mod: "Западноафриканская торговля"
 STATIC_MODIFIER_DESC_cas_west_africa_mod: "Испания вступает в западноафриканскую торговлю, используя Канарские острова плацдармом."
 STATIC_MODIFIER_NAME_cas_trent_mod: "Тридентский собор"
 STATIC_MODIFIER_DESC_cas_trent_mod: "Тридентский собор во главе с Испанией вновь утверждает католическую доктрину и устанавливает направления Контрреформации."
 STATIC_MODIFIER_NAME_cas_navarre_mod: "Наварра завоёвана"
 STATIC_MODIFIER_DESC_cas_navarre_mod: "Пиренейский перекрёсток Наварры обеспечен — Северная Иберия под контролем."
 STATIC_MODIFIER_NAME_cas_salamanca_mod: "Университет Саламанки"
 STATIC_MODIFIER_DESC_cas_salamanca_mod: "Один из старейших университетов Европы готовит элитных учёных и чиновников Испании."
 STATIC_MODIFIER_NAME_cas_toledo_dev_mod: "Толедская сталь"
 STATIC_MODIFIER_DESC_cas_toledo_dev_mod: "Толедская сталь и золотые изделия процветают — историческая столица полностью развита."
 STATIC_MODIFIER_NAME_cas_madrid_mod: "Мадрид — имперская столица"
 STATIC_MODIFIER_DESC_cas_madrid_mod: "Постоянная столица Филиппа II, Мадрид, становится сердцем мировой империи."
 STATIC_MODIFIER_NAME_cas_burgos_mod: "Бургос — международный город Пути пилигримов"
 STATIC_MODIFIER_DESC_cas_burgos_mod: "Бургос развивается как историческая столица Кастилии и центр шерстяной торговли."
 STATIC_MODIFIER_NAME_cas_granada_city_mod: "Жемчужина Испании"
 STATIC_MODIFIER_DESC_cas_granada_city_mod: "Город Альгамбры становится южным культурным и экономическим центром Испании."
 STATIC_MODIFIER_NAME_cas_cordoba_mod: "Производство кордовской кожи"
 STATIC_MODIFIER_DESC_cas_cordoba_mod: "Кордован, козья кожа, дублёная мастерами Кордовы, ценится при дворах Европы, и грузы непрестанно покидают мастерские города."
 STATIC_MODIFIER_NAME_cas_flanders_pacified_mod: "Фландрия умиротворена"
 STATIC_MODIFIER_DESC_cas_flanders_pacified_mod: "Фламандское сопротивление подавлено — этот процветающий регион устойчиво включён в империю."
 STATIC_MODIFIER_NAME_cas_greatest_power_mod: "Основы Империи, над коей никогда не заходит солнце"
 STATIC_MODIFIER_DESC_cas_greatest_power_mod: "Со всеми тремя столпами на месте, Испания стоит на пороге завершения «империи, над коей никогда не заходит солнце»."
 STATIC_MODIFIER_NAME_cas_empire_of_sun_final_mod: "Империя, над коей никогда не заходит солнце"
 STATIC_MODIFIER_DESC_cas_empire_of_sun_final_mod: "Испания завершена как первая в истории глобальная империя — имя «империя, над коей никогда не заходит солнце» навеки высечено в истории."
 STATIC_MODIFIER_NAME_cas_gold_fleet_mod: "Флоты сокровищ"
 STATIC_MODIFIER_DESC_cas_gold_fleet_mod: "Флоты сокровищ, ежегодно плывущие в Испанию, преображают европейскую экономику."
 STATIC_MODIFIER_NAME_cas_portugal_mod: "Уния с Португалией"
 STATIC_MODIFIER_DESC_cas_portugal_mod: "Через Иберийскую унию колониальная империя Португалии присоединяется к Испании тоже."
 STATIC_MODIFIER_NAME_cas_iberian_union_mod: "Иберийская уния"
 STATIC_MODIFIER_DESC_cas_iberian_union_mod: "Весь Иберийский полуостров объединён, завершая основу величайшей империи мира."
 STATIC_MODIFIER_NAME_cas_sevilla_mod: "Севилья процветает"
 STATIC_MODIFIER_DESC_cas_sevilla_mod: "Севилья, врата торговли с Новым Светом, развита как величайший торговый город мира."
 STATIC_MODIFIER_NAME_cas_trade_network_mod: "Имперская торговая сеть"
 STATIC_MODIFIER_DESC_cas_trade_network_mod: "От Севильи до Манилы имперская торговая сеть Испании охватывает весь земной шар."
 STATIC_MODIFIER_NAME_cas_valladolid_dev_mod: "Расширение Вальядолида"
 STATIC_MODIFIER_DESC_cas_valladolid_dev_mod: "Вальядолид, королевский замковый город Кастилии, развит как престол двора, и его рынки и мастерские процветают."
 STATIC_MODIFIER_NAME_cas_form_spain_mod: "Рождение Королевства Испания"
 STATIC_MODIFIER_DESC_cas_form_spain_mod: "Писцы двора в Мадриде составляют указы для каждой провинции именем единого королевства."
