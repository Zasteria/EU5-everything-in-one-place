l_russian:
 hol_holland_mission_pack: "Истинная свобода — от графства Голландия до Соединённых провинций"
 hol_holland_mission_pack_DESCRIPTION:0 "Графство Голландия, управляемое домом Авен — восторжествуй над Ганзейским союзом, поглоти Эно и Брабант, добейся независимости от испанской тирании и построй золотой век как истинная республика без монарха."
 hol_holland_mission_pack_CRITERIA_DESCRIPTION:0 "Объедини графство, добейся независимости и достигни золотого века как республика под суверенитетом Штатов."
 hol_holland_mission_pack_BUTTON_TOOLTIP:0 "От малого графства до единой республики торговли и свободы."
 hol_holland_mission_pack_BUTTON_DETAILS:0 "«Единство даёт силу» — построй истинную республику без монарха по всем Нижним землям!"
 hol_county_of_holland: "Графство Голландия"
 hol_county_of_holland_desc: "Графство Голландия, в самом сердце Нижних земель, благословенное водными путями и торговлей — стареющий граф Вильгельм III из дома Авен приближается к концу своего правления."
 hol_secure_dordrecht: "Развей Дордрехт"
 hol_secure_dordrecht_desc: "Дордрехт, древний торговый город у слияния Рейна и Мааса — опирайся на дарованное ему складочное право и принеси дальнейшее развитие."
 hol_hoekse_kabeljauwse: "Крючки и Трески"
 hol_hoekse_kabeljauwse_desc: "Дворянская партия Крючков и городская партия Трески — усмири эту внутреннюю распрю, разделяющую графство из-за престолонаследия, и утверди устойчивое правление."
 hol_zeeland_unification: "Объедини Зеландию"
 hol_zeeland_unification_desc: "Зеландия, земля островов, рассыпанных по Северному морю — приведи этот край во владения графства."
 hol_frisian_freedom: "Западнофризская свобода"
 hol_frisian_freedom_desc: "Народ Западной Фрисландии, чтящий свою автономию — даруй ему свободу под знаменем графства."
 hol_utrecht_relations: "Отношения с Утрехтом"
 hol_utrecht_relations_desc: "Утрехтское епископство, обладающее огромной светской властью — построй отношения с этим соседом под нашим влиянием."
 hol_wittelsbach_inheritance: "Уния с Эно"
 hol_wittelsbach_inheritance_desc: "Через принцессу Маргариту, обручённую с императором Людовиком IV, углуби связь с соседним графством Эно — через брак, покорение или его угасание, объедини Голландию, Зеландию и Эно под единым знаменем."
 hol_herring_industry: "Развей сельдяной промысел"
 hol_herring_industry_desc: "Сельдяной промысел, известный как «Великий лов» (grote visserij) — развей эту великую отрасль дальше, вместе с искусством засолки."
 hol_hansa_rivalry: "Соперничество с Ганзой"
 hol_hansa_rivalry_desc: "Ганзейский союз, господствующий в балтийской торговле — вооружившись дешёвым фрахтом и эффективными торговыми судами, восторжествуй над этим почтенным союзом."
 hol_amsterdam_rise: "Возвышение Амстердама"
 hol_amsterdam_rise_desc: "Амстердам, малая рыбацкая деревня на реке Эй — развей это место в великий узел североморской торговли."
 hol_moedernegotie: "Материнская торговля (Moedernegotie)"
 hol_moedernegotie_desc: "Балтийская торговля зерном — овладей этой торговлей, зовущейся «матерью всей торговли», и сделай её основой процветания."
 hol_contest_brabant: "Притязания на Брабант"
 hol_contest_brabant_desc: "Герцогство Брабант, другая великая держава Нижних земель — обрати взор честолюбия к этой земле."
 hol_absorb_brabant: "Поглощение Брабанта"
 hol_absorb_brabant_desc: "Аннексируй или покори герцогство Брабант — докажи, что не Брабант, а Голландия — владыка Нижних земель."
 hol_reformation_choice: "Выбор Реформации"
 hol_reformation_choice_desc: "Учения Лютера и Кальвина потрясают Нижние земли — на этом перекрёстке веры, какой путь мы изберём?"
 hol_calvinist_merchants: "Кальвинистские купцы"
 hol_calvinist_merchants_desc: "Кальвинизм, проповедующий скромную и дисциплинированную веру — прими этот символ веры, пленивший сердца купеческого сословия, как государственную религию."
 hol_union_of_utrecht: "Утрехтская уния"
 hol_union_of_utrecht_desc: "Утрехтская уния, образованная северными провинциями Нижних земель — встань её ядром и прими вызов общего врага."
 hol_watergeuzen: "Морские гёзы (Watergeuzen)"
 hol_watergeuzen_desc: "Каперы, именующие себя «морскими гёзами» — их подвиги пробивают бреши в господстве Испании над морями."
 hol_dutch_republic_proper: "Утверди истинную республику"
 hol_dutch_republic_proper_desc: "Федерация семи провинций, стоящих как равные — утверди здесь истинную республику купцов и граждан, без монарха."
 hol_east_india_company: "Основай Ост-Индскую компанию"
 hol_east_india_company_desc: "Основай Соединённую Ост-Индскую компанию (VOC), стремясь к монополии на азиатскую торговлю."
 hol_amsterdam_bank: "Амстердамский банк"
 hol_amsterdam_bank_desc: "Дабы навести порядок в хаосе конкурирующих валют, основай Обменный банк (Wisselbank) и построй устойчивую систему кредита."
 hol_stock_exchange: "Амстердамская фондовая биржа"
 hol_stock_exchange_desc: "Первая в мире фондовая биржа, где покупают и продают акции — сделай это место центром европейских финансов."
 hol_dutch_golden_age: "Голландский золотой век"
 hol_dutch_golden_age_desc: "Рембрандт, Вермеер и процветающая торговля — достигни вершины «Голландского золотого века»."
 hol_estates_of_holland: "Штаты Голландии"
 hol_estates_of_holland_desc: "Штаты Голландии, состоящие из городских представителей — сделай это собрание ядром республиканского правления."
 hol_regent_oligarchy: "Регентская олигархия"
 hol_regent_oligarchy_desc: "«Регенты», богатые купеческие патрицианские семьи — утверди их олигархическое правление как истинную правящую структуру республики."
 hol_stadtholderless_era: "Эпоха без штатгальтера (Истинная свобода)"
 hol_stadtholderless_era_desc: "Эпоха без штатгальтера, когда суверенитет держат Штаты — воплоти «Истинную свободу», провозглашённую Яном де Виттом."
 hol_states_sovereignty: "Утверди суверенитет Штатов"
 hol_states_sovereignty_desc: "Республика без монарха — утверди природу её суверенитета как прочное учреждение."
 hol_anglo_dutch_rivalry: "Англо-голландское соперничество"
 hol_anglo_dutch_rivalry_desc: "Соперничество с Англией за господство в морской торговле — прими этот вызов, символизируемый Навигационными актами."
 hol_navigation_act_response: "Ответь на Навигационный акт"
 hol_navigation_act_response_desc: "Английский Навигационный акт — противостань этому протекционистскому закону и защити наш торговый флот."
 hol_channel_trade_dominance: "Господство в торговле через пролив"
 hol_channel_trade_dominance_desc: "Пролив, связывающий Северное море с Атлантикой — утверди морское и торговое превосходство над этим жизненно важным путём."
 hol_french_relations: "Отношения с Францией"
 hol_french_relations_desc: "Честолюбие Короля-Солнца, Людовика XIV — уделяй пристальное внимание отношениям с этим могущественным соседом."
 hol_rampjaar_survival: "Переживи Год бедствий (Rampjaar)"
 hol_rampjaar_survival_desc: "В 1672 году, поражённая одновременным вторжением Англии и Франции — вынеси этот «Год бедствий», угрожающий самому существованию нации."
 hol_glorious_revolution: "Победа над Королём-Солнцем"
 hol_glorious_revolution_desc: "Пережив Год бедствий, Республика ныне переходит в наступление — продвинь наши войска глубоко на французскую землю и заставь Короля-Солнца, Людовика XIV, заплатить за своё честолюбие."
 hol_united_provinces: "Соединённые провинции Нидерландов"
 hol_united_provinces_desc: "От основ графства, через войну за независимость и золотой век, здесь завершена истинная республика."
 hol_events.2.t: "Провозглашение Соединённых провинций"
 hol_events.2.d: "Федерация семи провинций, стоящих как равные — истинная республика купцов и граждан, без монарха, делает свой первый вдох."
 hol_events.2.a: "Слава Республике!"
 hol_events.3.t: "Год бедствий (Rampjaar)"
 hol_events.3.d: "1672 год — одновременное вторжение Франции, Англии, Мюнстера и Кёльна. Описанный как «народ безрассуден, правительство беспомощно, страна в отчаянии», мы пережили этот кризис."
 hol_events.3.a: "Республика выживает!"
 hol_events.4.t: "Победа над Королём-Солнцем"
 hol_events.4.d: "Продвинувшись глубоко во французские земли, наши войска наконец сломили честолюбие Людовика XIV. Имя Республики отныне будет широко известно как великой державы Европы."
 hol_events.4.a: "Слава Республике!"
 hol_events.5.t: "Судьбоносный выбор для Штатов Голландии"
 hol_events.5.d: "Штаты стоят перед судьбоносным выбором о форме правления республики — склониться ли к монархическому порядку под штатгальтером, или твёрдо держаться истинной республики граждан и купцов."
 hol_events.5.a: "Сосредоточить власть в доме Оранских"
 hol_events.5.b: "Отстоять республику под суверенитетом Штатов"
 hol_events.99.t: "Соединённые провинции завершены"
 hol_events.99.d: "Долгий путь, начавшийся в графстве Голландия, через войну за независимость и золотой век, здесь завершён как истинная республика."
 hol_events.99.a: "Да здравствуют Соединённые провинции!"
 STATIC_MODIFIER_NAME_hol_county_mod: "Графство Голландия"
 STATIC_MODIFIER_DESC_hol_county_mod: "Память о графстве, взращённом водными путями и торговлей, до сих пор живёт как гордость народа."
 STATIC_MODIFIER_NAME_hol_dordrecht_mod: "Дордрехт развит"
 STATIC_MODIFIER_DESC_hol_dordrecht_mod: "На встрече Рейна и Мааса торговые суда Дордрехта беспрестанно грузят и разгружают свой товар."
 STATIC_MODIFIER_NAME_hol_hoekse_mod: "Крючки и Трески"
 STATIC_MODIFIER_DESC_hol_hoekse_mod: "Те, кто некогда развевали знамёна Крючков и Трески, ныне маршируют вместе в рядах графа."
 STATIC_MODIFIER_NAME_hol_zeeland_mod: "Зеландия объединена"
 STATIC_MODIFIER_DESC_hol_zeeland_mod: "На верфях Мидделбурга дерево, собранное с островов, обретает форму корпус за корпусом."
 STATIC_MODIFIER_NAME_hol_frisian_mod: "Западнофризская свобода"
 STATIC_MODIFIER_DESC_hol_frisian_mod: "«У фризов нет господина» — этот гордый дух автономии сплачивает многих в ряды, когда того требует час."
 STATIC_MODIFIER_NAME_hol_utrecht_mod: "Отношения с Утрехтом"
 STATIC_MODIFIER_DESC_hol_utrecht_mod: "Колокола утрехтских башен возвещают тихое, сердечное добрососедство графства и епископства."
 STATIC_MODIFIER_NAME_hol_wittelsbach_mod: "Уния с Эно"
 STATIC_MODIFIER_DESC_hol_wittelsbach_mod: "Новая правящая линия из Баварии приносит порядок землям Голландии, Зеландии и Эно."
 STATIC_MODIFIER_NAME_hol_absorb_brabant_mod: "Брабант поглощён"
 STATIC_MODIFIER_DESC_hol_absorb_brabant_mod: "Голландский герб ныне висит при дворе в Брюсселе, и южное богатство неуклонно течёт в Амстердам."
 STATIC_MODIFIER_NAME_hol_herring_mod: "Сельдяной промысел развит"
 STATIC_MODIFIER_DESC_hol_herring_mod: "Флотилии, гружённые солёной сельдью, одна за другой возвращаются домой сквозь волны Северного моря."
 STATIC_MODIFIER_NAME_hol_hansa_rivalry_mod: "Соперничество с Ганзой"
 STATIC_MODIFIER_DESC_hol_hansa_rivalry_mod: "Пока купцы Любека хмурятся, наши дешёвые фрахтовые ставки покоряют перевозчиков по всей Балтике."
 STATIC_MODIFIER_NAME_hol_amsterdam_rise_mod: "Возвышение Амстердама"
 STATIC_MODIFIER_DESC_hol_amsterdam_rise_mod: "Некогда малая рыбацкая деревня на Эй, Амстердам ныне привлекает парусные суда со всех концов света."
 STATIC_MODIFIER_NAME_hol_moedernegotie_mod: "Материнская торговля"
 STATIC_MODIFIER_DESC_hol_moedernegotie_mod: "Зерно, привозимое с Балтики, наполняет наши столы и нашу казну даже в голодные годы."
 STATIC_MODIFIER_NAME_hol_reformation_mod: "Выбор Реформации"
 STATIC_MODIFIER_DESC_hol_reformation_mod: "Среди церковных колоколов на рыночных площадях не смолкают тихие споры о старой и новой вере."
 STATIC_MODIFIER_NAME_hol_calvinist_mod: "Кальвинистские купцы"
 STATIC_MODIFIER_DESC_hol_calvinist_mod: "Лампы горят допоздна в купеческих домах, где Библию читают и разбирают собственными глазами."
 STATIC_MODIFIER_NAME_hol_union_utrecht_mod: "Утрехтская уния"
 STATIC_MODIFIER_DESC_hol_union_utrecht_mod: "Пакт, подписанный в Утрехте, стал надеждой, за коию цепляется каждая северная провинция."
 STATIC_MODIFIER_NAME_hol_watergeuzen_mod: "Морские гёзы"
 STATIC_MODIFIER_DESC_hol_watergeuzen_mod: "«Лучше нищие, чем королевские люди» — с этим кличем в сердце наши моряки и поныне охотятся за испанским флагом."
 STATIC_MODIFIER_NAME_hol_voc_mod: "Ост-Индская компания"
 STATIC_MODIFIER_DESC_hol_voc_mod: "Аромат пряностей из Батавии наполняет складской квартал Амстердама."
 STATIC_MODIFIER_NAME_hol_wisselbank_mod: "Амстердамский банк"
 STATIC_MODIFIER_DESC_hol_wisselbank_mod: "Доверие, запертое в хранилищах Обменного банка — истиннейшее богатство купцов этого города."
 STATIC_MODIFIER_NAME_hol_wisselbank_capital_mod: "Столица Обменного банка"
 STATIC_MODIFIER_DESC_hol_wisselbank_capital_mod: "С книгами казны и хранилищами Обменного банка под одной крышей дела государства идут ещё глаже."
 STATIC_MODIFIER_NAME_hol_exchange_mod: "Амстердамская фондовая биржа"
 STATIC_MODIFIER_DESC_hol_exchange_mod: "На торговой площадке не смолкают крики маклеров, размахивающих свидетельствами акций."
 STATIC_MODIFIER_NAME_hol_golden_age_mod: "Голландский золотой век"
 STATIC_MODIFIER_DESC_hol_golden_age_mod: "Свет и тень, запечатлённые кистью Рембрандта, будут рассказывать об этой эпохе процветания грядущим поколениям."
 STATIC_MODIFIER_NAME_hol_regent_mod: "Регентская олигархия"
 STATIC_MODIFIER_DESC_hol_regent_mod: "Тихие собрания богатых патрицианских семей — вот где принимаются истинные решения республики."
 STATIC_MODIFIER_NAME_hol_stadtholderless_mod: "Эпоха без штатгальтера"
 STATIC_MODIFIER_DESC_hol_stadtholderless_mod: "Кресло штатгальтера пустует — и всё же дела государства идут глаже, чем когда-либо."
 STATIC_MODIFIER_NAME_hol_anglo_rivalry_mod: "Англо-голландское соперничество"
 STATIC_MODIFIER_DESC_hol_anglo_rivalry_mod: "Повторные обмены пушечным огнём с нашим соперником через пролив закалили наших моряков в опытных ветеранов."
 STATIC_MODIFIER_NAME_hol_navigation_act_mod: "Ответ на Навигационный акт"
 STATIC_MODIFIER_DESC_hol_navigation_act_mod: "Не устрашённые указами Англии, наши торговые флотилии по-прежнему находят лазейки, сохраняющие торговые пути открытыми."
 STATIC_MODIFIER_NAME_hol_channel_dominance_mod: "Господство в торговле через пролив"
 STATIC_MODIFIER_DESC_hol_channel_dominance_mod: "Стало редкостью увидеть в том узком проливе между Северным морем и Атлантикой судно, не несущее наших цветов."
 STATIC_MODIFIER_NAME_hol_french_relations_mod: "Отношения с Францией"
 STATIC_MODIFIER_DESC_hol_french_relations_mod: "Тревожные слухи из двора Короля-Солнца держат наши пограничные гарнизоны в постоянной бдительности."
 STATIC_MODIFIER_NAME_hol_united_provinces_mod: "Соединённые провинции Нидерландов"
 STATIC_MODIFIER_DESC_hol_united_provinces_mod: "Единство семи провинций без монарха сделало наше имя известным на каждом море и рынке мира."
 STATIC_MODIFIER_NAME_hol_rampjaar_mod: "Переживший Год бедствий"
 STATIC_MODIFIER_DESC_hol_rampjaar_mod: "«Народ безрассуден, правительство беспомощно, страна в отчаянии» — стряхнув этот приговор, наши солдаты с гордостью хранят память о нём."
 STATIC_MODIFIER_NAME_hol_glorious_revolution_mod: "Победа над Королём-Солнцем"
 STATIC_MODIFIER_DESC_hol_glorious_revolution_mod: "Рассказы о походе нашей армии вглубь французских земель ныне с гордостью повторяются при каждом дворе Европы."
 STATIC_MODIFIER_NAME_hol_republic_declared_mod: "Республика провозглашена"
 STATIC_MODIFIER_DESC_hol_republic_declared_mod: "Делегаты граждан и купцов ныне с гордостью собираются в палате, не подвластной ни одному монарху."
