l_russian:
 ubv_oberbayern_mission_pack: "Наследие Мюнхена — путь к объединению Баварии"
 ubv_oberbayern_mission_pack_DESCRIPTION:0 "Как дом Мюнхена, потомки императора Людовика IV, объедини раздробленные земли Баварии вновь в единое целое."
 ubv_oberbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Развей Мюнхен и объедини Баварию."
 ubv_oberbayern_mission_pack_BUTTON_TOOLTIP:0 "Развей Мюнхен и объедини Баварию."
 ubv_oberbayern_mission_pack_BUTTON_DETAILS:0 "Возвысься как герцог всей Баварии!"
 ubv_wittelsbach_legacy: "Наследие Виттельсбахов"
 ubv_wittelsbach_legacy_desc: "Герцогство Бавария, разделённое Павийским договором 1329 года — как мюнхенская ветвь, потомки императора Людовика IV, унаследуй это наследие."
 ubv_secure_munich: "Развей Мюнхен"
 ubv_secure_munich_desc: "Мюнхен на Изаре — развей этот город, любимый императором Людовиком IV, как центр герцогства."
 ubv_salt_trade: "Соляная торговля"
 ubv_salt_trade_desc: "Соль, называемая «белым золотом» — захвати соляные копи Райхенхалля и обеспечь богатство этого ценного ресурса."
 ubv_imperial_relations: "Отношения с Империей"
 ubv_imperial_relations_desc: "Императорский трон, некогда занимаемый Людовиком IV — сделай наши отношения со Священной Римской империей достойными этой славной памяти."
 ubv_bavarian_ambition: "Притязание на единую Баварию"
 ubv_bavarian_ambition_desc: "Развитие Мюнхена, соляная торговля и отношения с Империей — построй на этом и взлелей притязание на всю Баварию."
 ubv_reunite_bavaria: "Воссоедини Баварию"
 ubv_reunite_bavaria_desc: "Раздробленное герцогство — верни земли Нижней Баварии и объедини Баварию вновь в единое целое."
 ubv_duke_of_all_bavaria: "Герцог всей Баварии"
 ubv_duke_of_all_bavaria_desc: "Под родословной дома Мюнхена вся Бавария наконец объединена под единым знаменем."
 ubv_events.1.t: "Провозглашение единства Баварии"
 ubv_events.1.d: "Под родословной дома Мюнхена Бавария наконец объединена в единое целое. Эпоха раздробленности подходит к концу."
 ubv_events.1.a: "Слава Баварии!"
 STATIC_MODIFIER_NAME_ubv_legacy_mod: "Наследие Виттельсбахов"
 STATIC_MODIFIER_DESC_ubv_legacy_mod: "Кровь Людовика IV, некогда носившего императорскую корону, остаётся именем, коим с гордостью хранит в сердце каждый придворный."
 STATIC_MODIFIER_NAME_ubv_munich_mod: "Мюнхен развит"
 STATIC_MODIFIER_DESC_ubv_munich_mod: "Город на Изаре процветает как центр герцогства."
 STATIC_MODIFIER_NAME_ubv_salt_mod: "Соляная торговля"
 STATIC_MODIFIER_DESC_ubv_salt_mod: "Телеги, гружённые «белым золотом» из соляных копей Райхенхалля, беспрестанно катятся к рынкам Мюнхена."
 STATIC_MODIFIER_NAME_ubv_imperial_mod: "Отношения с Империей"
 STATIC_MODIFIER_DESC_ubv_imperial_mod: "Связи с императорским двором, над коим некогда председательствовал Людовик IV, до сих пор поддерживают послов, странствующих туда и обратно."
 STATIC_MODIFIER_NAME_ubv_reunite_mod: "Бавария воссоединена"
 STATIC_MODIFIER_DESC_ubv_reunite_mod: "Вассалы двух некогда разделённых ветвей ныне приносят присягу под единым знаменем."
 STATIC_MODIFIER_NAME_ubv_unify_bavaria_mod: "Герцог всей Баварии"
 STATIC_MODIFIER_DESC_ubv_unify_bavaria_mod: "Колокола баварских башен звонят, провозглашая конец раздробленности."
 ubv_unified_duchy: "Объединённое герцогство Бавария"
 ubv_unified_duchy_desc: "Эпоха раздробленности окончена — как единое герцогство Бавария, открой новую эру."
 ubv_bavaria_unified_tt: "Бавария объединена"
 ubv_landrecht: "Баварское земское право"
 ubv_landrecht_desc: "Единый закон для объединённого герцогства — введи баварский свод законов (Ландрехт) и укрепи основу правления."
 ubv_tyrol_ambition: "Притязания на Тироль"
 ubv_tyrol_ambition_desc: "Графство Тироль, укрытое в объятиях Альп — взлелей притязания на эту землю."
 ubv_swabian_expansion: "Экспансия в Швабию"
 ubv_swabian_expansion_desc: "Швабия, простирающаяся на юго-запад — укрепи наше влияние над этим краем."
 ubv_greater_bavaria: "Осуществи Великую Баварию"
 ubv_greater_bavaria_desc: "Свод законов, Тироль и Швабия — построй на этом и осуществи Великую Баварию."
 ubv_counter_reformation_leader: "Вождь Контрреформации"
 ubv_counter_reformation_leader_desc: "Воплоти дух Тридентского собора и встань во главе Контрреформации."
 ubv_electoral_dignity: "Курфюршеское достоинство"
 ubv_electoral_dignity_desc: "В 1623 году Максимилиан I наконец обретает ранг курфюрста — сделай эту честь вечной гордостью Баварии."
 ubv_austrian_rivalry: "Соперничество с Австрией"
 ubv_austrian_rivalry_desc: "Соперничество с домом Габсбургов за гегемонию в Империи — прими этот вызов от нашего великого соперника."
 ubv_war_of_austrian_succession: "Война за австрийское наследство"
 ubv_war_of_austrian_succession_desc: "Война за притязания Карла VII на императорский престол — воспользуйся этой войной за наследство, дабы поднять престиж Баварии."
 ubv_imperial_crown: "Императорская корона"
 ubv_imperial_crown_desc: "В 1742 году Карл VII, герцог Баварский, коронован Императором Священной Римской империи — первым не-Габсбургом, надевшим корону за много веков."
 ubv_enlightened_absolutism: "Просвещённый абсолютизм"
 ubv_enlightened_absolutism_desc: "Эпоха Просвещения, чтящая разум и учёность — привнеси это новое течение мысли в правление Баварии."
 ubv_napoleonic_alliance: "Вызов Франции"
 ubv_napoleonic_alliance_desc: "Европа, потрясённая революцией и честолюбием Наполеона — Бавария закрепляет притязание на трон этого могучего соседа и прокладывает собственный путь."
 ubv_kingdom_of_bavaria: "Провозглашение Королевства Бавария"
 ubv_kingdom_of_bavaria_desc: "В 1806 году курфюрст Максимилиан IV Иосиф провозглашает себя королём Баварии — долгая история дома Виттельсбахов достигает здесь новой вершины."
 ubv_events.3.t: "Императорская корона"
 ubv_events.3.d: "В 1742 году Карл VII, герцог Баварский, был коронован Императором Священной Римской империи во франкфуртском соборе. Прошли века с тех пор, как кто-либо, кроме Габсбурга, надевал императорскую корону."
 ubv_events.3.a: "Слава Его Императорскому Величеству!"
 ubv_events.99.t: "Провозглашение Королевства Бавария"
 ubv_events.99.d: "В 1806 году курфюрст Максимилиан IV Иосиф, под сенью Рейнского союза, провозгласил себя королём Баварии. Долгая история дома Виттельсбахов достигает здесь новой вершины."
 ubv_events.99.a: "Да здравствует Королевство Бавария!"
 STATIC_MODIFIER_NAME_ubv_unified_mod: "Объединённое герцогство Бавария"
 STATIC_MODIFIER_DESC_ubv_unified_mod: "Герцогству более не нужно делить свои дворы, доходы и воинов между соперничающими ветвями."
 STATIC_MODIFIER_NAME_ubv_greater_mod: "Великая Бавария осуществлена"
 STATIC_MODIFIER_DESC_ubv_greater_mod: "От предгорий Альп до холмов Швабии земли под герцогским знаменем расширяются с каждым проходящим сезоном."
 STATIC_MODIFIER_NAME_ubv_counter_reformation_mod: "Вождь Контрреформации"
 STATIC_MODIFIER_DESC_ubv_counter_reformation_mod: "В духе Тридентского собора иезуитские коллегии открываются одна за другой в городах герцогства."
 STATIC_MODIFIER_NAME_ubv_succession_war_mod: "Война за австрийское наследство"
 STATIC_MODIFIER_DESC_ubv_succession_war_mod: "Офицеры и солдаты, закалённые на полях сражений Войны за австрийское наследство, ныне составляют ядро герцогской армии."
 STATIC_MODIFIER_NAME_ubv_imperial_crown_mod: "Императорская корона"
 STATIC_MODIFIER_DESC_ubv_imperial_crown_mod: "Память о дне, когда герцог Баварский был коронован во франкфуртском соборе, с гордостью запечатлена в сердце каждого при дворе."
 STATIC_MODIFIER_NAME_ubv_enlightenment_mod: "Просвещённый абсолютизм"
 STATIC_MODIFIER_DESC_ubv_enlightenment_mod: "При дворе новые книги, прибывающие из Франции, распространяют идеалы Просвещения, а число школ растёт год от года."
 STATIC_MODIFIER_NAME_ubv_electoral_dignity_mod: "Курфюршеское достоинство"
 STATIC_MODIFIER_DESC_ubv_electoral_dignity_mod: "Когда герцог, облачённый в одеяния курфюрста, занимает своё место на имперских выборах, князья со вниманием внимают его словам."
 STATIC_MODIFIER_NAME_ubv_kingdom_mod: "Королевство Бавария"
 STATIC_MODIFIER_DESC_ubv_kingdom_mod: "Во дворце в Мюнхене гремят салюты, празднуя коронацию первого короля Баварии из дома Виттельсбахов."
