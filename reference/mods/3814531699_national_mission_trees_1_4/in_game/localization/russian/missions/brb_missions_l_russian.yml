l_russian:
 brb_brabant_mission_pack: "Наследие Нижней Лотарингии — объединение Нижних земель и поглощение Бургундии"
 brb_brabant_mission_pack_DESCRIPTION:0 "Герцогство Брабант, управляемое независимым герцогским домом — объедини Нижние земли, поглоти самонадеянное герцогство Бургундия прежде истории и построй истинный золотой век."
 brb_brabant_mission_pack_CRITERIA_DESCRIPTION:0 "Объедини Нижние земли, поглоти Бургундию и основай республику, дабы достичь золотого века."
 brb_brabant_mission_pack_BUTTON_TOOLTIP:0 "От малого герцогства до великого герцогства, правящего Нижними землями и Бургундией."
 brb_brabant_mission_pack_BUTTON_DETAILS:0 "«Je Maintiendrai» — обрати историю вспять и водрузи знамя Брабанта над Нижними землями!"
 brb_ducal_authority: "Утверди герцогскую власть"
 brb_ducal_authority_desc: "Как герцог рода Лёвен, пусть твоя власть достигнет каждого уголка герцогства."
 brb_joyous_entry: "Радостный въезд (Blijde Inkomst)"
 brb_joyous_entry_desc: "«Радостный въезд» — церемония, при коей новый герцог проходит через городские врата и подтверждает привилегии городов — утверди эту традицию и даруй городам собственные права."
 brb_joyous_entry_unlock_tt: "Городская привилегия «Город Радостного въезда» становится доступна."
 brb_develop_antwerp: "Развей Антверпен"
 brb_develop_antwerp_desc: "Антверпен, торговый город в устье Шельды — развей его далее и упрочи его статус узла североморской торговли."
 brb_unify_brabant: "Объедини Брабант"
 brb_unify_brabant_desc: "Герцогство Брабант, разделённое на север и юг — объедини его под единым знаменем."
 brb_flemish_rivalry: "Соперничество с Фландрией"
 brb_flemish_rivalry_desc: "Графство Фландрия, известное богатой суконной промышленностью — установи наше влияние над этим давним соперником."
 brb_hainaut_marriage: "Брак с Эно-Голландией"
 brb_hainaut_marriage_desc: "Эно, Голландия и Зеландия, управляемые домом Виттельсбахов — через брак, союз или соперничество равно, обеспечь притязание на этот престол."
 brb_liege_relations: "Отношения с Льежем"
 brb_liege_relations_desc: "Льежское княжество-епископство, обладающее огромной светской властью — через соперничество или брачные узы равно, обеспечь притязание на эту землю."
 brb_utrecht_bishopric: "Утрехтское епископство"
 brb_utrecht_bishopric_desc: "Утрехтское епископство, обладающее огромной светской властью — приведи его под наше влияние как основу для объединения Нижних земель."
 brb_burgundian_ambition: "Притязания в отношении Бургундии"
 brb_burgundian_ambition_desc: "Овладев главными землями Нижних земель, обрати взор честолюбия к недавно возвысившемуся герцогству Бургундия, удерживаемому побочной ветвью французского королевского дома."
 brb_contest_flanders_inheritance: "Оспорь наследство Фландрии"
 brb_contest_flanders_inheritance_desc: "Брак Маргариты, наследницы Фландрии — выиграй этот оспариваемый союз и захвати Фландрию для себя прежде, чем это сделает дом Бургундии."
 brb_absorb_burgundy: "Поглоти Бургундию"
 brb_absorb_burgundy_desc: "Аннексируй или покори самонадеянное герцогство Бургундия — обрати вспять течение истории и докажи, что не Бургундия, а Брабант — владыка Нижних земель."
 brb_valois_brabant: "Великое герцогство Брабант"
 brb_valois_brabant_desc: "Поглотив бургундское наследство, Брабант уже не просто герцогство — восстань великой державой, председательствующей над Нижними землями."
 brb_je_maintiendrai: "Je Maintiendrai"
 brb_je_maintiendrai_desc: "Брабант, Фландрия, Голландия и поглощённое бургундское наследство — как владыка главных земель Нижних земель, удержи это правление."
 brb_hansa_relations: "Отношения с Ганзой"
 brb_hansa_relations_desc: "Ганзейский союз, господствующий в балтийской торговле — восстанови отношения с ним с позиции равенства."
 brb_bulk_trade: "Поддержи массовую торговлю"
 brb_bulk_trade_desc: "Массовая торговля зерном и лесом — подними присутствие нашего торгового флота на Балтике."
 brb_baltic_supremacy: "Господство в балтийской торговле"
 brb_baltic_supremacy_desc: "Владыка северных торговых путей — истинная торговая держава — утверди господство в балтийской торговле."
 brb_land_commercial_empire: "Сухопутная торговая империя"
 brb_land_commercial_empire_desc: "Не только море — овладей великими внутренними торговыми центрами и заяви права на господство и в сухопутной торговле."
 brb_secure_grain: "Обеспечь балтийское зерно"
 brb_secure_grain_desc: "Нижние земли издавна полагались на балтийское зерно — возьми это снабжение в собственные руки."
 brb_reformation_choice: "Выбор Реформации"
 brb_reformation_choice_desc: "Учения Лютера потрясают Нижние земли — на этом перекрёстке веры, какой путь мы изберём?"
 brb_religious_settlement: "Религиозное урегулирование"
 brb_religious_settlement_desc: "Более века спустя после Реформации — ныне, когда государственная вера господствует над огромным большинством населения, принеси устойчивое примирение между враждующими верами."
 brb_spanish_fury: "Испанская ярость"
 brb_spanish_fury_desc: "Гнёт Габсбургов и тяжкие налоги — гнев народа против «Испанской ярости» более не может сдерживаться."
 brb_sea_beggars: "Морские гёзы"
 brb_sea_beggars_desc: "Каперы, именующие себя «морскими гёзами» — их подвиги пробивают бреши в господстве Испании над морями."
 brb_eighty_years_war: "Восьмидесятилетняя война"
 brb_eighty_years_war_desc: "Долгая борьба за независимость — вынеси эту Восьмидесятилетнюю войну и завоюй нашу свободу."
 brb_united_netherlands: "Соединённые Нидерланды"
 brb_united_netherlands_desc: "Федерация семи провинций — утверди здесь княжескую конфедерацию под великим герцогом Брабанта, продолжающую традиции и дворянства, и города равно."
 brb_east_india_charter: "Хартия Ост-Индской компании"
 brb_east_india_charter_desc: "Даруй хартию на основание Ост-Индской компании, стремясь к монополии на азиатскую торговлю."
 brb_voc_trade_empire: "Торговая империя VOC"
 brb_voc_trade_empire_desc: "«Соединённая Ост-Индская компания» (VOC) — первая в мире акционерная компания раскидывает свою торговую сеть от Островов пряностей по всей Азии."
 brb_west_india_company: "Вест-Индская компания"
 brb_west_india_company_desc: "Торговля, связывающая Новый Свет и Африку — основай Вест-Индскую компанию и раздели богатства Атлантики."
 brb_golden_age: "Золотой век"
 brb_golden_age_desc: "Рембрандт, Вермеер и процветающая торговля — достигни вершины «Голландского золотого века»."
 brb_amsterdam_exchange: "Амстердамская биржа"
 brb_amsterdam_exchange_desc: "Первая в мире фондовая биржа — сделай Амстердам центром европейских финансов."
 brb_form_netherlands: "Великое герцогство Нидерланды завершено"
 brb_form_netherlands_desc: "Долгий путь, начавшийся с наследия Нижней Лотарингии и поглощения Бургундии, через независимость и золотой век, здесь завершён как великое герцогство, сохраняющее глубокие традиции и дворянства, и городов."
 brb_wool_staple_calais: "Кале — склад английской шерсти"
 brb_wool_staple_calais_desc: "Английская шерсть, жизненная сила фламандской суконной промышленности — оживи торговлю через складочное право в Кале."
 brb_anglo_dutch_alliance: "Англо-нидерландский союз"
 brb_anglo_dutch_alliance_desc: "Англия, наш сосед через Ла-Манш — среди хаоса Столетней войны, упрочи твёрдые отношения с этой нацией, будь то через союз или соперничество."
 brb_english_channel_trade: "Господство в торговле через Ла-Манш"
 brb_english_channel_trade_desc: "Пролив, связывающий Северное море с Атлантикой — утверди господство в торговле через этот жизненно важный пролив."
 brb_valois_suzerainty_dispute: "Оспаривание сюзеренитета Валуа"
 brb_valois_suzerainty_dispute_desc: "Номинально вассал французской короны — оспорь этот сюзеренитет и потребуй положения равенства."
 brb_hundred_years_war_intervention: "Вмешательство в Столетнюю войну"
 brb_hundred_years_war_intervention_desc: "Долгая война, раздирающая Англию и Францию — воспользуйся этой возможностью, дабы вмешаться ради собственной выгоды."
 brb_somme_towns: "Города Соммы"
 brb_somme_towns_desc: "Богатые города Пикардии — приведи земли вдоль Соммы в наши владения."
 brb_end_french_vassalage: "Положи конец французскому вассалитету"
 brb_end_french_vassalage_desc: "Полностью разорви этот номинальный вассалитет и утверди наш статус истинно независимого великого герцогства."
 brb_events.1.t: "Начало Восьмидесятилетней войны"
 brb_events.1.d: "Через Утрехтскую унию и подвиги морских гёзов началась долгая война с Испанией. Эта борьба решит нашу независимость."
 brb_events.1.a: "Свобода или смерть!"
 brb_events.2.t: "Притязания в отношении Бургундии"
 brb_events.2.d: "Самонадеянное герцогство Бургундия — какой путь мы изберём в отношении его судьбы?"
 brb_events.2.a: "Заплатить золотом и принять их как вассала"
 brb_events.2.b: "Заявить притязание на Дижон и приготовиться взять его силой"
 brb_events.2.c: "Наблюдать и ждать, пока"
 brb_events.3.t: "Оспорь наследство Фландрии"
 brb_events.3.d: "Спор о престолонаследии из-за Маргариты, наследницы Фландрии — как обеспечим мы себе эту богатую землю?"
 brb_events.3.a: "Заплатить золотом и принять их как вассала"
 brb_events.3.b: "Заявить притязание на Брюгге и приготовиться взять его силой"
 brb_events.3.c: "Наблюдать и ждать, пока"
 brb_events.99.t: "Провозглашение Великого герцогства Нидерланды"
 brb_events.99.d: "Малое герцогство, унаследовавшее Нижнюю Лотарингию и поглотившее Бургундию, возродилось, через независимость и золотой век, как великое герцогство под домом Брабант, сохраняющее глубокие традиции и дворянства, и городов."
 brb_events.99.a: "Слава Великому герцогству!"
 STATIC_MODIFIER_NAME_brb_ducal_mod: "Герцогская власть утверждена"
 STATIC_MODIFIER_DESC_brb_ducal_mod: "Герцогское знамя, развевающееся над Лёвеном, провозглашает ту же власть в каждом замковом городе герцогства."
 STATIC_MODIFIER_NAME_brb_antwerp_mod: "Антверпен обеспечен"
 STATIC_MODIFIER_DESC_brb_antwerp_mod: "Торговый город Антверпен процветает."
 STATIC_MODIFIER_NAME_brb_unify_brabant_mod: "Брабант объединён"
 STATIC_MODIFIER_DESC_brb_unify_brabant_mod: "Лорды поместий, некогда разделённые на север и юг, ныне преклоняют колени при одном и том же герцогском дворе."
 STATIC_MODIFIER_NAME_brb_flemish_mod: "Соперничество с Фландрией"
 STATIC_MODIFIER_DESC_brb_flemish_mod: "Даже ткачи Гента и Брюгге ныне ведут свои дела, оглядываясь на волю герцога Брабанта."
 STATIC_MODIFIER_NAME_brb_utrecht_mod: "Утрехтское епископство"
 STATIC_MODIFIER_DESC_brb_utrecht_mod: "Колокола утрехтского собора ныне звонят молитвами, благословляющими правление герцога Брабанта."
 STATIC_MODIFIER_NAME_brb_absorb_burgundy_mod: "Бургундия поглощена"
 STATIC_MODIFIER_DESC_brb_absorb_burgundy_mod: "Ключи от дижонской казны ныне висят при дворе в Брюсселе."
 STATIC_MODIFIER_NAME_brb_maintiendrai_mod: "Je Maintiendrai"
 STATIC_MODIFIER_DESC_brb_maintiendrai_mod: "«Я удержу» — под этим девизом собираются в одном дворе и лорды, и бюргеры Нижних земель равно."
 STATIC_MODIFIER_NAME_brb_hansa_mod: "Отношения с Ганзой"
 STATIC_MODIFIER_DESC_brb_hansa_mod: "Ганзейские купцы из Любека ныне занимают равные места в конторах Антверпена."
 STATIC_MODIFIER_NAME_brb_bulk_trade_mod: "Массовая торговля поддержана"
 STATIC_MODIFIER_DESC_brb_bulk_trade_mod: "Суда, гружённые зерном и лесом, шлют непрерывный поток заказов на верфи в устье Шельды."
 STATIC_MODIFIER_NAME_brb_baltic_supremacy_mod: "Господство в балтийской торговле"
 STATIC_MODIFIER_DESC_brb_baltic_supremacy_mod: "По всей Балтике паруса бесчисленных торговых судов несут львиное знамя Брабанта."
 STATIC_MODIFIER_NAME_brb_land_commercial_empire_mod: "Сухопутная торговая империя"
 STATIC_MODIFIER_DESC_brb_land_commercial_empire_mod: "Повозки из Кёльна и Парижа выстраиваются в очереди на рынках Брюсселя и Лёвена."
 STATIC_MODIFIER_NAME_brb_grain_mod: "Балтийское зерно обеспечено"
 STATIC_MODIFIER_DESC_brb_grain_mod: "С балтийским зерном, вечно наполняющим амбары, солдаты идут по призыву, не страшась голода."
 STATIC_MODIFIER_NAME_brb_reformation_mod: "Выбор Реформации"
 STATIC_MODIFIER_DESC_brb_reformation_mod: "Под кафедрами и в углах рынка люди тихо говорят о новой вере."
 STATIC_MODIFIER_NAME_brb_settlement_mod: "Религиозное урегулирование"
 STATIC_MODIFIER_DESC_brb_settlement_mod: "Соседи, некогда враждовавшие из-за веры, ныне стоят плечом к плечу у одних и тех же рыночных прилавков."
 STATIC_MODIFIER_NAME_brb_spanish_fury_mod: "Испанская ярость"
 STATIC_MODIFIER_DESC_brb_spanish_fury_mod: "Ярость тех, кто видел пепел Антверпена, ещё придаёт силу рукам, сжимающим меч."
 STATIC_MODIFIER_NAME_brb_sea_beggars_mod: "Морские гёзы"
 STATIC_MODIFIER_DESC_brb_sea_beggars_mod: "«Лучше нищие, чем королевские люди» — знамя морских гёзов стало кошмаром в снах испанских моряков."
 STATIC_MODIFIER_NAME_brb_united_netherlands_mod: "Соединённые Нидерланды"
 STATIC_MODIFIER_DESC_brb_united_netherlands_mod: "Знамёна семи провинций стоят бок о бок в одном зале собраний, и новое государство делает первый вдох как княжеская конфедерация."
 STATIC_MODIFIER_NAME_brb_east_india_mod: "Хартия Ост-Индской компании"
 STATIC_MODIFIER_DESC_brb_east_india_mod: "Прежде чем воск на печати хартии успел высохнуть, флотилии, идущие на Восток, начали отплывать."
 STATIC_MODIFIER_NAME_brb_voc_mod: "Торговая империя VOC"
 STATIC_MODIFIER_DESC_brb_voc_mod: "Перец и гвоздика, прибывающие из факторий Батавии, связывают даже далёких колониальных губернаторов с родиной."
 STATIC_MODIFIER_NAME_brb_wic_mod: "Вест-Индская компания"
 STATIC_MODIFIER_DESC_brb_wic_mod: "Слухи о сахаре и серебре за Атлантикой ведут переселенцев, мечтающих о новом мире, к гаваням."
 STATIC_MODIFIER_NAME_brb_golden_age_mod: "Золотой век"
 STATIC_MODIFIER_DESC_brb_golden_age_mod: "В приканальных особняках великих купцов висят картины комнат, залитых светом окон в духе Вермеера."
 STATIC_MODIFIER_NAME_brb_amsterdam_mod: "Амстердамская биржа"
 STATIC_MODIFIER_DESC_brb_amsterdam_mod: "Амстердам, центр финансов, процветает."
 STATIC_MODIFIER_NAME_brb_wool_staple_mod: "Кале — склад английской шерсти"
 STATIC_MODIFIER_DESC_brb_wool_staple_mod: "На складе шерсти в Кале тюки английской шерсти, предназначенной ткачам Фландрии, сложены высокими штабелями."
 STATIC_MODIFIER_NAME_brb_anglo_treaty_mod: "Англо-нидерландский союз"
 STATIC_MODIFIER_DESC_brb_anglo_treaty_mod: "Послы, несущие клятвы союза, вновь и вновь проходят между дворами на обоих берегах Ла-Манша."
 STATIC_MODIFIER_NAME_brb_channel_trade_mod: "Господство в торговле через Ла-Манш"
 STATIC_MODIFIER_DESC_brb_channel_trade_mod: "В узком проливе, ведущем от Северного моря к Атлантике, торговые флаги Брабанта ныне развеваются рядами."
 STATIC_MODIFIER_NAME_brb_suzerainty_dispute_mod: "Оспаривание сюзеренитета Валуа"
 STATIC_MODIFIER_DESC_brb_suzerainty_dispute_mod: "Врата Брюсселя без стыда отвергли герольдов, присланных из Парижа призвать своего вассала."
 STATIC_MODIFIER_NAME_brb_intervention_mod: "Вмешательство в Столетнюю войну"
 STATIC_MODIFIER_DESC_brb_intervention_mod: "Солдаты, сражавшиеся в грязи Столетней войны, вернулись, изучив военное искусство и Франции, и Англии."
 STATIC_MODIFIER_NAME_brb_somme_mod: "Города Соммы"
 STATIC_MODIFIER_DESC_brb_somme_mod: "Захватив стены вдоль Соммы, герцогская армия утвердила твёрдый плацдарм на равнинах Северной Франции."
 STATIC_MODIFIER_NAME_brb_end_vassalage_mod: "Конец французского вассалитета"
 STATIC_MODIFIER_DESC_brb_end_vassalage_mod: "Над вратами, с коих был снят герб французского короля, ныне развевается лишь знамя герцога Брабанта."
 STATIC_MODIFIER_NAME_brb_form_netherlands_mod: "Великое герцогство Нидерланды завершено"
 STATIC_MODIFIER_DESC_brb_form_netherlands_mod: "При дворе великого герцогства, где рядом развеваются и дворянские знамёна, и городские флаги, лорды и бюргеры Нидерландов равно празднуют зарю новой эпохи."
