l_russian:
 bra_brandenburg_mission_pack: "Кровь и железо — от Бранденбурга до Германской империи"
 bra_brandenburg_mission_pack_DESCRIPTION:0 "От малой марки дома Асканиев построй Королевство Пруссия под Гогенцоллернами и достигни объединения Германии кровью и железом."
 bra_brandenburg_mission_pack_CRITERIA_DESCRIPTION:0 "Утверди марку, основай Королевство Пруссия и заверши Германскую империю."
 bra_brandenburg_mission_pack_BUTTON_TOOLTIP:0 "От песочницы Священной Римской империи до гегемона Европы."
 bra_brandenburg_mission_pack_BUTTON_DETAILS:0 "Великие вопросы дня решаются не речами и не большинством голосов, но кровью и железом — объедини Германию!"
 bra_ascanian_legacy: "Наследие Асканиев"
 bra_ascanian_legacy_desc: "Унаследуй маркграфство Бранденбург, построенное домом Асканиев, и начни новую эпоху правления."
 bra_march_authority: "Утверди маркграфскую власть"
 bra_march_authority_desc: "Обуздай раздробленные дворянские земли и пусть власть маркграфа достигнет всей страны."
 bra_turmoil_ended_tt: "Бедствие «Бранденбургская смута» завершилось"
 bra_altmark_secure: "Обеспечь Альтмарк"
 bra_altmark_secure_desc: "Альтмарк, родина марки — сделай его правление несокрушимым."
 bra_neumark_colonization: "Колонизируй Ноймарк"
 bra_neumark_colonization_desc: "Продвинь колонизацию на восток в Ноймарк за Одером и построй новые поселения."
 bra_uckermark_integration: "Включи Уккермарк"
 bra_uckermark_integration_desc: "Полностью включи Уккермарк в маркграфство."
 bra_pomeranian_rivalry: "Соперничество с Померанией"
 bra_pomeranian_rivalry_desc: "Разреши соперничество с герцогством Померания за доступ к Балтийскому морю."
 bra_wendish_lands: "Вендские земли"
 bra_wendish_lands_desc: "Эта земля — дом кашубов, потомков славянских вендов — прими их культуру с терпимостью и углуби их понимание немецких обычаев, показав, что оба народа могут сосуществовать."
 bra_berlin_dev: "Развей Берлин"
 bra_berlin_dev_desc: "Берлин, городок на Шпрее, выросший в сердце марки после унии с Кёльном — развей его дальше."
 bra_electoral_dignity: "Курфюршеское достоинство"
 bra_electoral_dignity_desc: "Утверди свой статус курфюрста Священной Римской империи и подними свой престиж в ней."
 bra_hohenzollern_investiture: "Инвеститура Гогенцоллернов"
 bra_hohenzollern_investiture_desc: "В 1417 году император Сигизмунд даровал курфюршеский титул дому Гогенцоллернов — утверди правление этой новой династии."
 bra_hohenzollern_dynasty: "Династия Гогенцоллернов обеспечена"
 bra_hohenzollern_dynasty_desc: "Сделай гогенцоллернову кровную линию опорой государства и заложи основу для длительного правления."
 bra_imperial_diet: "Голос в Имперском сейме"
 bra_imperial_diet_desc: "Укрепи свой голос в Имперском сейме и займи роль в имперской политике."
 bra_reformation_choice: "Выбор Реформации"
 bra_reformation_choice_desc: "Учение Лютера сотрясает всю Германию — Бранденбургу тоже предстоит избрать свою веру."
 bra_secularize_prussia: "Секуляризуй Пруссию"
 bra_secularize_prussia_desc: "Поощряй секуляризацию государства Тевтонского ордена и приведи Пруссию под влияние Бранденбурга."
 bra_cleves_inheritance: "Наследство Клеве"
 bra_cleves_inheritance_desc: "Выиграй войну за юлихское наследство на Рейне и обеспечь западный эксклав."
 bra_thirty_years_war: "Вынеси Тридцатилетнюю войну"
 bra_thirty_years_war_desc: "Тридцатилетняя война опустошает Германию — вынеси это бедствие и сохрани марку."
 bra_great_elector: "Правление Великого курфюрста"
 bra_great_elector_desc: "Под Фридрихом Вильгельмом, позже прозванным «Великим курфюрстом», восстанови силу государства."
 bra_standing_army: "Учреди постоянную армию"
 bra_standing_army_desc: "Создай постоянную армию, подотчётную прямо курфюрсту, не зависящую от дворянских ополчений."
 bra_absolutism: "Утверди абсолютизм"
 bra_absolutism_desc: "Обуздай власть сословий и построй государство, где воля курфюрста достигает каждого угла."
 bra_sovereign_prussia: "Суверенитет над Пруссией"
 bra_sovereign_prussia_desc: "По Оливскому договору сбрось польский сюзеренитет над герцогством Пруссия."
 bra_king_in_prussia: "Коронован Королём в Пруссии"
 bra_king_in_prussia_desc: "В 1701 году в Кёнигсберге Фридрих I короновал себя «Королём в Пруссии»."
 bra_prussian_administration: "Прусская администрация"
 bra_prussian_administration_desc: "Утверди эффективную и дисциплинированную бюрократию и шествуй путём к современному государству."
 bra_junker_integration: "Включи юнкеров"
 bra_junker_integration_desc: "Приведи землевладельческое дворянство юнкеров к востоку от Эльбы в ядро армии и администрации."
 bra_potsdam_dev: "Развей Потсдам"
 bra_potsdam_dev_desc: "Разви Потсдам, престол королевской резиденции, в центр придворной культуры."
 bra_soldier_king: "Наследие Короля-солдата"
 bra_soldier_king_desc: "Унаследуй бережливое, военизированное наследие Фридриха Вильгельма I, «Короля-солдата»."
 bra_royal_treasury: "Полная королевская казна"
 bra_royal_treasury_desc: "Через бережливое финансовое управление построй одну из самых полных казн Европы."
 bra_silesian_ambition: "Честолюбие в отношении Силезии"
 bra_silesian_ambition_desc: "Заяви законное притязание на богатую Силезию, правимую домом Габсбургов."
 bra_first_silesian_war: "Первая Силезская война"
 bra_first_silesian_war_desc: "Молодой Фридрих II марширует в Силезию молниеносным вторжением."
 bra_silesia_annexed: "Силезия аннексирована"
 bra_silesia_annexed_desc: "Полностью аннексируй богатый горнодобывающий и промышленный регион Силезия как экономическую основу Пруссии."
 bra_prussian_enlightenment: "Прусское Просвещение"
 bra_prussian_enlightenment_desc: "Просвещённая мысль расцветает под Фридрихом Великим — воплоти идеал, что «король — первый слуга государства»."
 bra_seven_years_war: "Вынеси Семилетнюю войну"
 bra_seven_years_war_desc: "Семилетняя война противопоставляет тебе всю Европу — вынеси это испытание и защити свой статус великой державы."
 bra_frederick_the_great: "Наследие Фридриха Великого"
 bra_frederick_the_great_desc: "Неси наследие великого короля, вспоминаемого как «Фридрих Великий», в следующую эпоху."
 bra_partitions_of_poland: "Прими участие в разделах Польши"
 bra_invasion_of_poland: "Вторжение в Польшу"
 bra_invasion_of_poland_desc: "Введи наши силы в Великую Польшу и вырежи территорию у этого ослабевшего соседа."
 bra_partitions_of_poland_desc: "Присоединись к разделу упадающей Польско-Литовской Речи Посполитой и обрети Западную Пруссию."
 bra_prussian_academy: "Прусская академия наук"
 bra_prussian_academy_desc: "Возделай Берлинскую академию наук и стань центром учёности и науки."
 bra_prussian_army_reform: "Реформа прусской армии"
 bra_prussian_army_reform_desc: "Качество или количество — определи характер прусской армии и укорени своеобразную военную доктрину в государстве."
 bra_napoleonic_crisis: "Наполеоновский кризис"
 bra_napoleonic_crisis_desc: "Поражение при Йене-Ауэрштедте — пред Наполеоном Пруссия стоит перед кризисом выживания."
 bra_stein_hardenberg_reforms: "Реформы Штейна-Гарденберга"
 bra_stein_hardenberg_reforms_desc: "Настало время подорвать финансовые основы Франции, всё ещё превосходящей нас — через освобождение крепостных и административную реформу достигни возрождения из кризиса."
 bra_rhineland_acquisition: "Приобрети Рейнланд"
 bra_rhineland_acquisition_desc: "Обрети богатые земли вдоль Рейна и заложи основу для индустриализации."
 bra_show_of_strength: "Демонстрация силы"
 bra_show_of_strength_desc: "Прежде чем протянуть руку к великим просторам Германии, продемонстрируй мощь Пруссии князьям севера."
 bra_lower_saxony_conquest: "Завоюй Нижнюю Саксонию"
 bra_lower_saxony_conquest_desc: "Разбей наших соперников в Люнебурге и Магдебурге, обеспечь порт Эмден в Гольштейне и расширь нашу досягаемость по всей Нижней Саксонии."
 bra_westphalian_conquest: "Вестфальское завоевание"
 bra_westphalian_conquest_desc: "Расширь нашу гегемонию над Северной Германией далее на запад, в земли Вестфалии."
 bra_zollverein: "Таможенный союз"
 bra_zollverein_desc: "Возглавь Таможенный союз (Zollverein), экономически объединяющий германские государства."
 bra_prussian_constitution: "Прусская конституция"
 bra_prussian_constitution_desc: "Утверди основы конституционной монархии через конституцию 1850 года."
 bra_army_reform_1860s: "Военная реформа 1860-х"
 bra_army_reform_1860s_desc: "Военные реформы Роона и Мольтке — усовершенствуй военную доктрину качества или количества, избранную ранее, до ещё больших высот."
 bra_danish_war: "Война против Дании"
 bra_danish_war_desc: "Возьмись за оружие против Дании из-за шлезвиг-гольштейнского вопроса."
 bra_austro_prussian_war: "Австро-прусская война"
 bra_austro_prussian_war_desc: "Разреши вопрос в битве при Кёниггреце и выиграй руководство Германией."
 bra_north_german_confederation: "Северогерманский союз"
 bra_north_german_confederation_desc: "Объедини германские государства к северу от Майна, исключая Австрию, и основай Северогерманский союз."
 bra_south_german_states: "Союз с южногерманскими государствами"
 bra_south_german_states_desc: "Выкуй военные союзы с южногерманскими государствами Баварией, Вюртембергом и другими."
 bra_franco_prussian_war: "Франко-прусская война"
 bra_franco_prussian_war_desc: "Спровоцированная Эмсской депешей, прими решительную войну против Второй Французской империи."
 bra_alsace_lorraine_annexed: "Эльзас-Лотарингия аннексированы"
 bra_alsace_lorraine_annexed_desc: "Аннексируй Эльзас и Лотарингию как военную добычу, запечатлевая вечную вражду с Францией."
 bra_german_empire: "Германская империя основана"
 bra_german_empire_desc: "Утверди Германскую империю с королём Пруссии как императором, новейшей великой державой Европы."
 bra_kulturkampf: "Культуркампф"
 bra_kulturkampf_desc: "Обуздай влияние Католической церкви и переопредели отношения между государством и церковью."
 bra_social_legislation: "Законодательство о социальном страховании"
 bra_social_legislation_desc: "Учреди системы страхования по болезни, несчастным случаям и старости как противодействие социализму."
 bra_colonial_empire: "Колониальная империя"
 bra_colonial_empire_desc: "Ища «место под солнцем», построй колонии в Африке и на Тихом океане."
 bra_high_seas_fleet: "Флот открытого моря"
 bra_high_seas_fleet_desc: "Под водительством адмирала Тирпица построй Флот открытого моря, способный соперничать с Британией."
 bra_weltpolitik: "Мировая политика"
 bra_weltpolitik_desc: "Под знаменем «мировой политики» Вильгельма II займи своё место среди великих держав мира."
 bra_berlin_metropolis: "Великий Берлин завершён"
 bra_berlin_metropolis_desc: "Разви Берлин в мировой город, способный соперничать с Парижем и Лондоном."
 bra_ruhr_industry_complete: "Рурская промышленность завершена"
 bra_ruhr_industry_complete_desc: "Доведи промышленную мощь Рура до предела, став одной из великих тяжёлопромышленных держав мира."
 bra_german_science: "Возвышение германской науки"
 bra_german_science_desc: "Построй золотой век германской науки, ведя мир в физике и химии."
 bra_naval_race: "Морская гонка"
 bra_naval_race_desc: "Выиграй морскую гонку вооружений с Британией и продемонстрируй морскую мощь, способную соперничать с миром."
 bra_balkan_influence: "Влияние на Балканах"
 bra_balkan_influence_desc: "Через нашего австрийского союзника расширь влияние на Балканский полуостров."
 bra_ottoman_partnership: "Партнёрство с османами"
 bra_ottoman_partnership_desc: "Заключи союз с «больным человеком» Европы, Османской империей, как плацдармом на Восток."
 bra_mitteleuropa: "Миттельевропа"
 bra_mitteleuropa_desc: "Продвинь видение «Миттельевропы», объединяющее Центральную Европу в германскую экономическую сферу."
 bra_grossdeutschland: "Великая Германия"
 bra_grossdeutschland_desc: "Наконец осуществи идеал «Великой Германии», охватывающей и Австрию тоже."
 bra_hegemon_of_europe: "Гегемон Европы"
 bra_hegemon_of_europe_desc: "Утверди непревзойдённую гегемонию над Европой равно в экономике, военной силе и дипломатии."
 bra_second_reich_eternal: "Вторая империя вечна"
 bra_second_reich_eternal_desc: "От малой пограничной марки до империи, правящей Европой — история дома Гогенцоллернов достигает своего завершения."
 bra_events.1.t: "Король в Пруссии"
 bra_events.1.d: "18 января 1701 года в Кёнигсберге Фридрих I короновал себя «Королём в Пруссии». Курфюрст Бранденбурга ныне сам по себе король."
 bra_events.1.a: "Слава Королю! Королевство Пруссия основано!"
 bra_events.2.t: "Провозглашение в Версале"
 bra_events.2.d: "18 января 1871 года в Зеркальном зале Версаля король Вильгельм I Прусский был провозглашён Германским императором. Эпоха раздробленности окончена, и объединённая Германская империя рождена."
 bra_events.2.a: "Слава Императору! Слава Германской империи!"
 bra_events.99.t: "Вторая империя вечна"
 bra_events.99.d: "Долгий путь, начавшийся малой маркой дома Асканиев, достиг своего назначения. Под Гогенцоллернами Германия ныне правит империей, коей нет равных в Европе."
 bra_events.99.a: "Слава Германии! Слава Второй империи!"
 STATIC_MODIFIER_NAME_bra_ascanian_mod: "Наследие Асканиев"
 STATIC_MODIFIER_DESC_bra_ascanian_mod: "Память об Асканиях, чей медвежий герб некогда отмечал марки, остаётся высеченной в камнях пограничных замков."
 STATIC_MODIFIER_NAME_bra_march_mod: "Маркграфская власть утверждена"
 STATIC_MODIFIER_DESC_bra_march_mod: "Указы, скреплённые печатью маркграфа, идут от поместья к поместью, и даже лорды ныне подчиняются."
 STATIC_MODIFIER_NAME_bra_altmark_mod: "Альтмарк защищён"
 STATIC_MODIFIER_DESC_bra_altmark_mod: "Обороны Альтмарка, родины марки, укреплены."
 STATIC_MODIFIER_NAME_bra_neumark_mod: "Ноймарк колонизирован"
 STATIC_MODIFIER_DESC_bra_neumark_mod: "За Одером немецкие поселенцы вонзают свои плуги в дикие земли Ноймарка."
 STATIC_MODIFIER_NAME_bra_pomerania_mod: "Соперничество с Померанией"
 STATIC_MODIFIER_DESC_bra_pomerania_mod: "Долгая распря с герцогами Померании научила лордов марок, как править завоёванной землёй."
 STATIC_MODIFIER_NAME_bra_uckermark_mod: "Уккермарк включён"
 STATIC_MODIFIER_DESC_bra_uckermark_mod: "Хлебные земли Уккермарка ныне значатся в книгах сборщиков податей маркграфа."
 STATIC_MODIFIER_NAME_bra_berlin_mod: "Берлин развит"
 STATIC_MODIFIER_DESC_bra_berlin_mod: "Берлин процветает как сердце марки."
 STATIC_MODIFIER_NAME_bra_electoral_mod: "Курфюршеское достоинство"
 STATIC_MODIFIER_DESC_bra_electoral_mod: "Послы, несущие печать курфюрста, ныне занимают места рядом с князьями при дворе императора."
 STATIC_MODIFIER_NAME_bra_hohenzollern_mod: "Инвеститура Гогенцоллернов"
 STATIC_MODIFIER_DESC_bra_hohenzollern_mod: "Семья, рождённая из бургграфов Нюрнберга, ныне поднимает знамя новой династии в замках Бранденбурга."
 STATIC_MODIFIER_NAME_bra_dynasty_mod: "Династия обеспечена"
 STATIC_MODIFIER_DESC_bra_dynasty_mod: "Кровная линия Гогенцоллернов ныне признана неоспоримой властью и в пограничных замках, и при дворе равно."
 STATIC_MODIFIER_NAME_bra_diet_mod: "Голос в сейме"
 STATIC_MODIFIER_DESC_bra_diet_mod: "На Имперском сейме в Регенсбурге князья внимательно слушают, когда говорит посол Бранденбурга."
 STATIC_MODIFIER_NAME_bra_reformation_mod: "Выбор Реформации"
 STATIC_MODIFIER_DESC_bra_reformation_mod: "Под курфюрстом, принявшим учение Лютера, его подданные учатся терпимости к различиям веры."
 STATIC_MODIFIER_NAME_bra_secularize_mod: "Пруссия секуляризована"
 STATIC_MODIFIER_DESC_bra_secularize_mod: "Доходы земель, некогда бывших епископствами, ныне управляются собственными чиновниками курфюрста."
 STATIC_MODIFIER_NAME_bra_cleves_mod: "Наследство Клеве"
 STATIC_MODIFIER_DESC_bra_cleves_mod: "Западный эксклав Клеве приносит новое богатство казне."
 STATIC_MODIFIER_NAME_bra_thirty_years_mod: "Испытание Тридцатилетней войны"
 STATIC_MODIFIER_DESC_bra_thirty_years_mod: "Опыт вынесения войны стал ключом к обороне родины."
 STATIC_MODIFIER_NAME_bra_great_elector_mod: "Правление Великого курфюрста"
 STATIC_MODIFIER_DESC_bra_great_elector_mod: "Имя Великого курфюрста, победителя при Фербеллине, стало самой властью династии."
 STATIC_MODIFIER_NAME_bra_standing_army_mod: "Постоянная армия создана"
 STATIC_MODIFIER_DESC_bra_standing_army_mod: "Солдаты постоянной армии, поклявшиеся одному лишь курфюрсту, день за днём муштруются на плацах Потсдама."
 STATIC_MODIFIER_NAME_bra_absolutism_mod: "Абсолютизм утверждён"
 STATIC_MODIFIER_DESC_bra_absolutism_mod: "Приказы короля ныне идут от двора в Берлине до сельских советов каждого уголка государства."
 STATIC_MODIFIER_NAME_bra_sovereign_mod: "Прусский суверенитет"
 STATIC_MODIFIER_DESC_bra_sovereign_mod: "Герцог Пруссии, сбросивший некогда причитавшуюся польскому королю присягу, ныне принимается при иноземных дворах равным сувереном."
 STATIC_MODIFIER_NAME_bra_administration_mod: "Прусская администрация"
 STATIC_MODIFIER_DESC_bra_administration_mod: "Книги и правила, составленные писцами Генеральной дирекции, поддерживают управление каждым уголком королевства."
 STATIC_MODIFIER_NAME_bra_junker_mod: "Юнкеры включены"
 STATIC_MODIFIER_DESC_bra_junker_mod: "Юнкеры ныне действуют ядром армии и администрации."
 STATIC_MODIFIER_NAME_bra_potsdam_mod: "Потсдам развит"
 STATIC_MODIFIER_DESC_bra_potsdam_mod: "Королевская резиденция Потсдам процветает центром придворной культуры."
 STATIC_MODIFIER_NAME_bra_soldier_king_mod: "Наследие Короля-солдата"
 STATIC_MODIFIER_DESC_bra_soldier_king_mod: "Бережливость и строгая дисциплина, завещанные Королём-солдатом, всё ещё прилипают к самим стенам казарм."
 STATIC_MODIFIER_NAME_bra_treasury_mod: "Полная казна"
 STATIC_MODIFIER_DESC_bra_treasury_mod: "В бережливых королевских хранилищах высоко сложены сундуки серебра для грядущих войн."
 STATIC_MODIFIER_NAME_bra_silesian_ambition_mod: "Честолюбие в отношении Силезии"
 STATIC_MODIFIER_DESC_bra_silesian_ambition_mod: "Офицеры, мечтающие о плодородных долинах Силезии, нетерпеливо ждут приказа выступить."
 STATIC_MODIFIER_NAME_bra_first_silesian_mod: "Первая Силезская война"
 STATIC_MODIFIER_DESC_bra_first_silesian_mod: "Маршируя молнией сквозь снег, армия стояла у врат Бреслау прежде, чем Австрия успела завершить мобилизацию."
 STATIC_MODIFIER_NAME_bra_silesia_mod: "Силезия аннексирована"
 STATIC_MODIFIER_DESC_bra_silesia_mod: "Богатство, рождённое из горнов и станков Силезии, беспрестанно течёт в казну Берлина."
 STATIC_MODIFIER_NAME_bra_enlightenment_mod: "Прусское Просвещение"
 STATIC_MODIFIER_DESC_bra_enlightenment_mod: "Идеалы Просвещения, распространяющиеся из двора Сан-Суси, умножают школы в деревнях."
 STATIC_MODIFIER_NAME_bra_seven_years_mod: "Испытание Семилетней войны"
 STATIC_MODIFIER_DESC_bra_seven_years_mod: "Опыт борьбы против всей Европы выковал военную дисциплину."
 STATIC_MODIFIER_NAME_bra_frederick_mod: "Наследие Фридриха Великого"
 STATIC_MODIFIER_DESC_bra_frederick_mod: "Имя Фридриха Великого передаётся и как гордость солдата, и как слава государства."
 STATIC_MODIFIER_NAME_bra_partitions_mod: "Разделы Польши"
 STATIC_MODIFIER_DESC_bra_partitions_mod: "Прусские чиновники и землемеры один за другим переселяются в деревни Западной Пруссии, обретённые в разделах."
 STATIC_MODIFIER_NAME_bra_academy_mod: "Прусская академия"
 STATIC_MODIFIER_DESC_bra_academy_mod: "Лекции учёных, собранных в академии Берлина, привлекают студентов со всей страны."
 STATIC_MODIFIER_NAME_bra_invasion_poland_mod: "Вторжение в Польшу"
 STATIC_MODIFIER_DESC_bra_invasion_poland_mod: "Немецкие вывески и конторы возникают одна за другой в покорённых городах Великой Польши."
 STATIC_MODIFIER_NAME_bra_napoleonic_mod: "Наполеоновский кризис"
 STATIC_MODIFIER_DESC_bra_napoleonic_mod: "Опыт преодоления кризиса становится основой обороны родины."
 STATIC_MODIFIER_NAME_bra_reforms_mod: "Реформы Штейна-Гарденберга"
 STATIC_MODIFIER_DESC_bra_reforms_mod: "Реформы Штейна и Гарденберга освободили крестьянина от крепостной зависимости и открыли врата государственной службы."
 STATIC_MODIFIER_NAME_bra_rhineland_mod: "Рейнланд приобретён"
 STATIC_MODIFIER_DESC_bra_rhineland_mod: "Налоги, восходящие от богатых городов и угольных копей вдоль Рейна, радуют казначеев Берлина."
 STATIC_MODIFIER_NAME_bra_show_of_strength_mod: "Демонстрация силы"
 STATIC_MODIFIER_DESC_bra_show_of_strength_mod: "Князья Северной Германии, увидев строй войск на берлинском плацу, удалились без лишних слов."
 STATIC_MODIFIER_NAME_bra_lower_saxony_mod: "Нижняя Саксония завоёвана"
 STATIC_MODIFIER_DESC_bra_lower_saxony_mod: "Победа прусской армии на равнинах Ганновера перекроила карту Северной Германии."
 STATIC_MODIFIER_NAME_bra_westphalia_mod: "Вестфалия завоёвана"
 STATIC_MODIFIER_DESC_bra_westphalia_mod: "Бургомистры вестфальских городов начали следовать указаниям чиновников из Берлина."
 STATIC_MODIFIER_NAME_bra_zollverein_mod: "Таможенный союз"
 STATIC_MODIFIER_DESC_bra_zollverein_mod: "На границах таможенного союза повозки проходят, не дожидаясь подъёма шлагбаума."
 STATIC_MODIFIER_NAME_bra_constitution_mod: "Прусская конституция"
 STATIC_MODIFIER_DESC_bra_constitution_mod: "Роли парламента и монарха, установленные в статьях конституции, принесли новый порядок в практику политики."
 STATIC_MODIFIER_NAME_bra_danish_war_mod: "Война против Дании"
 STATIC_MODIFIER_DESC_bra_danish_war_mod: "Триумфальное возвращение прусских солдат, штурмовавших траншеи при Дюппеле, ускорило унию Шлезвига и Гольштейна."
 STATIC_MODIFIER_NAME_bra_austro_prussian_war_mod: "Австро-прусская война"
 STATIC_MODIFIER_DESC_bra_austro_prussian_war_mod: "На поле Кёниггреца казнозарядная винтовка опрокинула всё, что солдаты считали правилами войны."
 STATIC_MODIFIER_NAME_bra_north_confederation_mod: "Северогерманский союз"
 STATIC_MODIFIER_DESC_bra_north_confederation_mod: "В день, когда флаг Северогерманского союза впервые взвился над берлинским дворцом, послы государств узнали, что настала новая эпоха."
 STATIC_MODIFIER_NAME_bra_south_german_mod: "Союз с югом"
 STATIC_MODIFIER_DESC_bra_south_german_mod: "Послы, хранящие пакт с Пруссией, ныне ходят туда и обратно даже при дворах Баварии и Вюртемберга."
 STATIC_MODIFIER_NAME_bra_franco_prussian_mod: "Франко-прусская война"
 STATIC_MODIFIER_DESC_bra_franco_prussian_mod: "В ночь, когда весть о победе при Седане достигла Берлина, каждая улица была окутана ликованием."
 STATIC_MODIFIER_NAME_bra_alsace_mod: "Эльзас-Лотарингия аннексированы"
 STATIC_MODIFIER_DESC_bra_alsace_mod: "Трубы эльзасских текстильных фабрик и железных копей движут промышленность новой Германской империи."
 STATIC_MODIFIER_NAME_bra_kulturkampf_mod: "Культуркампф"
 STATIC_MODIFIER_DESC_bra_kulturkampf_mod: "Новые учреждения, сформированные вслед за борьбой государства с церковью, перечертили границы между конторами государства и приходами."
 STATIC_MODIFIER_NAME_bra_social_mod: "Законодательство о социальном страховании"
 STATIC_MODIFIER_DESC_bra_social_mod: "Рабочие, стоящие в очередях за пособиями по болезни и старости, знают, что государство их не покинет."
 STATIC_MODIFIER_NAME_bra_colonial_mod: "Колониальная империя"
 STATIC_MODIFIER_DESC_bra_colonial_mod: "На палубах пароходов, идущих к колониям Африки и Южных морей, стоят переселенцы, мечтающие о новом мире."
 STATIC_MODIFIER_NAME_bra_fleet_mod: "Флот открытого моря"
 STATIC_MODIFIER_DESC_bra_fleet_mod: "Из труб броненосцев, выстроенных в военной гавани Киля, поднимается дым решимости охранять торговые пути."
 STATIC_MODIFIER_NAME_bra_weltpolitik_mod: "Мировая политика"
 STATIC_MODIFIER_DESC_bra_weltpolitik_mod: "Карты в министерстве иностранных дел Берлина ныне отражают мировую политику, простирающуюся от Африки до Азии."
 STATIC_MODIFIER_NAME_bra_berlin_metropolis_mod: "Великий Берлин завершён"
 STATIC_MODIFIER_DESC_bra_berlin_metropolis_mod: "Мировой город Берлин сияет центром процветания и правления."
 STATIC_MODIFIER_NAME_bra_ruhr_complete_mod: "Рурская промышленность завершена"
 STATIC_MODIFIER_DESC_bra_ruhr_complete_mod: "Домны Рура извергают огонь день и ночь, посылая германскую сталь в мир."
 STATIC_MODIFIER_NAME_bra_science_mod: "Возвышение германской науки"
 STATIC_MODIFIER_DESC_bra_science_mod: "Открытия, рождённые в лабораториях Гёттингена и Берлина, сделали Германию центром мировой науки."
 STATIC_MODIFIER_NAME_bra_naval_race_mod: "Морская гонка"
 STATIC_MODIFIER_DESC_bra_naval_race_mod: "На стапелях Вильгельмсхафена уже заложен киль следующего линкора."
 STATIC_MODIFIER_NAME_bra_balkan_mod: "Влияние на Балканах"
 STATIC_MODIFIER_DESC_bra_balkan_mod: "Балканские дела, ежедневно обсуждаемые дипломатами Вены и Берлина, всё теснее сплетают двух союзников."
 STATIC_MODIFIER_NAME_bra_ottoman_mod: "Партнёрство с османами"
 STATIC_MODIFIER_DESC_bra_ottoman_mod: "С каждой милей проложенной Багдадской железной дороги узы между Берлином и Константинополем углубляются."
 STATIC_MODIFIER_NAME_bra_mitteleuropa_mod: "Миттельевропа"
 STATIC_MODIFIER_DESC_bra_mitteleuropa_mod: "Видение единой экономической сферы в Центральной Европе тихо распространяется даже среди купцов и чиновников соседних земель."
 STATIC_MODIFIER_NAME_bra_grossdeutschland_mod: "Великая Германия"
 STATIC_MODIFIER_DESC_bra_grossdeutschland_mod: "«В чём отчизна немца?» — старый вопрос, певшийся от Вены до Берлина, наконец находит свой ответ."
 STATIC_MODIFIER_NAME_bra_hegemon_mod: "Гегемон Европы"
 STATIC_MODIFIER_DESC_bra_hegemon_mod: "Ни один двор Европы более не может принять важное решение, не узнав прежде воли Берлина."
 STATIC_MODIFIER_NAME_bra_king_in_prussia_mod: "Король в Пруссии"
 STATIC_MODIFIER_DESC_bra_king_in_prussia_mod: "Со дня коронации в замковой церкви Кёнигсберга, прусский двор принялся выковывать церемониал королевства."
 STATIC_MODIFIER_NAME_bra_second_reich_mod: "Вторая империя вечна"
 STATIC_MODIFIER_DESC_bra_second_reich_mod: "От провозглашения, прозвучавшего в Зеркальном зале Версаля, корона Гогенцоллернов взошла сиять на вершине Европы."
