l_russian:
 wal_wallachia_mission_pack: "Орден Дракона — Стражи Дуная"
 wal_wallachia_mission_pack_DESCRIPTION:0 "Валахия, зажатая между Карпатами и Дунаем. Укроти боярскую знать и объедини румынские княжества вместе с Молдавией и Трансильванией, или подними знамя Ордена Дракона и веди войну против Османской империи, дабы возвести Дунайскую империю."
 wal_wallachia_mission_pack_CRITERIA_DESCRIPTION:0 "Укрепи должность воеводы, объедини румынские княжества и разгроми Османскую империю, дабы завершить Дунайскую империю."
 wal_wallachia_mission_pack_BUTTON_TOOLTIP:0 "Продолжи волю Колосажателя и стань Стражем Дуная."
 wal_wallachia_mission_pack_BUTTON_DETAILS:0 "«Мы — дети дракона» — волки Карпат, поднимите крест!"
 wal_voivode_beginnings: "Заря должности воеводы"
 wal_voivode_beginnings_desc: "В 1330 году Басараб I отразил короля Венгрии в битве при Посаде — унаследуй его дух независимости и заложи основы нового княжества между Карпатами и Дунаем."
 wal_voivode_authority: "Власть воеводы"
 wal_voivode_authority_desc: "Престол воеводы, избираемый согласием боярской знати — упрочи эту власть и предотврати хаос оспариваемого престолонаследия."
 wal_boyar_council: "Боярский совет"
 wal_boyar_council_desc: "Собрание великих землевладельцев-бояр — без их поддержки Валахией нельзя править. Упрочи отношения с советом."
 wal_found_bucharest: "Основай Бухарест"
 wal_found_bucharest_desc: "Джурджу, близ Дуная — где воевода держал свой летний двор. Развей это место как «Бухарешть», оплот южной обороны и торговли."
 wal_targoviste_dev: "Развей Тырговиште"
 wal_targoviste_dev_desc: "Тырговиште, древняя столица у подножия Карпат, престол поколений воевод — принеси этому городу дальнейшее процветание."
 wal_fortify_carpathians: "Укрепи Карпаты"
 wal_fortify_carpathians_desc: "Карпаты, простирающиеся с юга на север — покрой этот природный вал рукотворными крепостями и возведи оборонительную линию, кою не сможет прорвать ни один захватчик."
 wal_orthodox_church: "Защити православную церковь"
 wal_orthodox_church_desc: "Православная церковь, наследница византийской веры — встань во главе её автокефального патриархата и придай власти воеводы религиозную легитимность."
 wal_dregatori: "Назначь дрегаторов"
 wal_dregatori_desc: "Тирания наследственной знати — враг государства. Назначь «дрегаторов» — чиновников, избираемых по способностям, а не по происхождению — и построй правление, преданное короне."
 wal_unite_voivodes: "Объедини воеводства"
 wal_unite_voivodes_desc: "Валахия и Молдавия — два румынских княжества, до сих пор разделённые; их соперничество служит лишь нашим врагам. Любая держава, что удержит плацдарм в Молдавии, может теперь заявить законные права на всю страну."
 wal_subdue_moldavia: "Покори Молдавию"
 wal_subdue_moldavia_desc: "Слава Стефана Великого ныне принадлежит прошлому — приведи княжество Молдавия под власть Валахии и заложи основу румынского единства."
 wal_conquer_transylvania: "Завоюй Трансильванию"
 wal_conquer_transylvania_desc: "Трансильвания, долго удерживаемая королями Венгрии и их наследниками — приведи эту землю в сферу влияния Валахии и положи конец вмешательству извне."
 wal_szekely_land: "Земля секеев"
 wal_szekely_land_desc: "Секеи, воинственный народ восточной Трансильвании — почти их автономию и воинскую традицию, и сделай их доблесть силой Валахии."
 wal_saxon_towns: "Включи саксонские города"
 wal_saxon_towns_desc: "Брашов, Сибиу и другие саксонские города Трансильвании — сделай эти процветающие со времён Средневековья города опорой экономики королевства."
 wal_secure_danube: "Обеспечь Дунай"
 wal_secure_danube_desc: "Великая река Дунай, отделяющая Балканы от Карпат — обеспечь её берега как артерию южной обороны и торговли."
 wal_carpathian_hegemony: "Заверши карпатскую гегемонию"
 wal_carpathian_hegemony_desc: "Настало время, чтобы вся земля между Карпатами и Дунаем подчинилась власти воеводы."
 wal_romanian_unity: "Заверши румынское единство"
 wal_romanian_unity_desc: "Валахия, Молдавия, Трансильвания — объедини давно разделённые земли румынского народа наконец под единой короной."
 wal_order_of_dragon_founding: "Вступи в Орден Дракона"
 wal_order_of_dragon_founding_desc: "Император Сигизмунд Священной Римской империи основывает Орден Дракона на идеале крестового похода против османов — пусть наш собственный правитель займёт своё место в этом прославленном сообществе."
 wal_impale_the_sultan: "Посади султана на кол"
 wal_impale_the_sultan_desc: "Султан мнит себя в безопасности, укрывшись за своими стенами и легионами. На поле боя против воинств ислама пусть он на собственной шкуре познает, что никто не может укрыться от Божьего суда."
 wal_drive_out_turks: "Изгони турок"
 wal_drive_out_turks_desc: "Настало время освободить греческий и болгарский народы от угнетения. Отбрось турецких захватчиков к дальнему берегу Босфора."
 wal_liberate_serbia: "Освободи Сербию"
 wal_liberate_serbia_desc: "Наши сербские братья, страдающие под османским игом со времён поражения на Косовом поле — освободи их и стань Стражем православных Балкан."
 wal_reclaim_morea: "Верни Морею"
 wal_reclaim_morea_desc: "Деспотат Морея, где некогда горел последний свет Византии — верни этот уголок Пелопоннеса из рук неверных."
 wal_heir_of_rome: "Наследник Рима"
 wal_heir_of_rome_desc: "То, чего Византийская империя так и не достигла — полное поражение и изгнание неверного из Европы — мы совершили. Никто не достойнее нас носить мантию Рима."
 wal_bulwark_of_christendom: "Оплот христианского мира"
 wal_bulwark_of_christendom_desc: "Румынские княжества суть оплот христианского мира. Укрепление наших границ — наш долг перед Богом."
 wal_ottoman_downfall: "Падение османов"
 wal_ottoman_downfall_desc: "Османская империя, некогда господствовавшая над Балканами и Ближним Востоком — её угроза наконец предана истории."
 wal_reclaim_constantinople: "Верни Константинополь"
 wal_reclaim_constantinople_desc: "Константинополь, давно павший перед неверными — освободи эту императорскую столицу как наследник Ордена Дракона."
 wal_danubian_empire: "Заверши Дунайскую империю"
 wal_danubian_empire_desc: "От Карпат до Балкан и далее до Босфора — эта борьба, начатая местью Колосажателя, завершается созданием великой империи, повелевающей Дунаем."
 wal_danube_trade: "Дунайский торговый путь"
 wal_danube_trade_desc: "Торговый путь, связывающий Западную Европу с Чёрным морем вдоль Дуная — направь этот поток богатства в казну Валахии."
 wal_treasury: "Наполни казну"
 wal_treasury_desc: "Война, дипломатия, содержание двора — каждое государственное дело требует золота. Наполни казну и приготовься к любой нужде."
 wal_manufactories: "Развей мануфактуры"
 wal_manufactories_desc: "Великая перемена свершается в сфере производства — без колебаний вкладывай в мануфактуры и готовься к эпохе индустрии."
 wal_events.2.t: "Константинополь возвращён"
 wal_events.2.d: "Великая императорская столица Константинополь наконец пала в наши руки. Знамя Ордена Дракона ныне развевается над этим городом, некогда удерживаемым неверными."
 wal_events.2.a: "Город Рим — наш!"
 wal_events.99.t: "Провозглашение Дунайской империи"
 wal_events.99.d: "Малое княжество у подножия Карпат возродилось великой империей, повелевающей Дунаем и Балканами. Воля Колосажателя наконец полностью осуществлена."
 wal_events.99.a: "Слава Дунайской империи!"
 STATIC_MODIFIER_NAME_wal_voivode_beginnings_mod: "Заря должности воеводы"
 STATIC_MODIFIER_DESC_wal_voivode_beginnings_mod: "Память о дне, когда Басараб I отказался преклонить колени перед чужеземным сюзереном, есть гордость воинов Валахии."
 STATIC_MODIFIER_NAME_wal_voivode_mod: "Власть воеводы"
 STATIC_MODIFIER_DESC_wal_voivode_mod: "Престол воеводы стабилен, а доверие к престолонаследию возросло."
 STATIC_MODIFIER_NAME_wal_boyar_mod: "Боярский совет"
 STATIC_MODIFIER_DESC_wal_boyar_mod: "Отношения со знатью стабильны и укрепляют основу правления."
 STATIC_MODIFIER_NAME_wal_bucharest_mod: "Бухарест основан"
 STATIC_MODIFIER_DESC_wal_bucharest_mod: "Джурджу развит как «Бухарешть», оплот юга."
 STATIC_MODIFIER_NAME_wal_targoviste_mod: "Тырговиште развит"
 STATIC_MODIFIER_DESC_wal_targoviste_mod: "Древняя столица Тырговиште продолжает процветать."
 STATIC_MODIFIER_NAME_wal_carpathians_mod: "Карпатская крепостная сеть"
 STATIC_MODIFIER_DESC_wal_carpathians_mod: "Сеть крепостей в горах отражает любое вторжение."
 STATIC_MODIFIER_NAME_wal_church_mod: "Защита православной церкви"
 STATIC_MODIFIER_DESC_wal_church_mod: "Валашская православная церковь под защитой государства повышает религиозную легитимность."
 STATIC_MODIFIER_NAME_wal_impale_mod: "Султан посажен на кол"
 STATIC_MODIFIER_DESC_wal_impale_mod: "Слух о ряде кольев, воздвигнутых перед послами султана, до сих пор леденит сердца воинств ислама."
 STATIC_MODIFIER_NAME_wal_dregatori_mod: "Дрегаторы назначены"
 STATIC_MODIFIER_DESC_wal_dregatori_mod: "Чиновники, избираемые по способностям, теперь несут преданное правление."
 STATIC_MODIFIER_NAME_wal_moldavia_mod: "Молдавия покорена"
 STATIC_MODIFIER_DESC_wal_moldavia_mod: "Княжество Молдавия приведено под власть Валахии."
 STATIC_MODIFIER_NAME_wal_transylvania_mod: "Трансильвания завоёвана"
 STATIC_MODIFIER_DESC_wal_transylvania_mod: "Трансильвания приведена в сферу влияния Валахии."
 STATIC_MODIFIER_NAME_wal_szekely_mod: "Доблесть секеев"
 STATIC_MODIFIER_DESC_wal_szekely_mod: "Горные воины Секейской земли выстраивают свои копья в ряд под знамёнами Валахии."
 STATIC_MODIFIER_NAME_wal_saxon_mod: "Процветание саксонских городов"
 STATIC_MODIFIER_DESC_wal_saxon_mod: "Саксонские города Трансильвании стали опорой экономики королевства."
 STATIC_MODIFIER_NAME_wal_danube_mod: "Дунай обеспечен"
 STATIC_MODIFIER_DESC_wal_danube_mod: "Берега Дуная обеспечены, открывая артерию торговли."
 STATIC_MODIFIER_NAME_wal_hegemony_mod: "Карпатская гегемония"
 STATIC_MODIFIER_DESC_wal_hegemony_mod: "Земля между Карпатами и Дунаем полностью подчиняется власти воеводы."
 STATIC_MODIFIER_NAME_wal_unity_mod: "Румынское единство"
 STATIC_MODIFIER_DESC_wal_unity_mod: "Валахия, Молдавия и Трансильвания объединены под единой короной."
 STATIC_MODIFIER_NAME_wal_order_of_dragon_mod: "Член Ордена Дракона"
 STATIC_MODIFIER_DESC_wal_order_of_dragon_mod: "Послы, несущие знак Ордена Дракона, объезжают дворы христианского мира, расширяя круг союза против османов."
 STATIC_MODIFIER_NAME_wal_drive_out_mod: "Турки изгнаны"
 STATIC_MODIFIER_DESC_wal_drive_out_mod: "Война против неверных доказала силу нашей армии."
 STATIC_MODIFIER_NAME_wal_serbia_mod: "Сербия освобождена"
 STATIC_MODIFIER_DESC_wal_serbia_mod: "Наши сербские братья освобождены, что повышает наш престиж на всём православном Балканском полуострове."
 STATIC_MODIFIER_NAME_wal_morea_mod: "Морея возвращена"
 STATIC_MODIFIER_DESC_wal_morea_mod: "Грузы вина и шёлка из портов Пелопоннеса наполняют склады валашских купцов."
 STATIC_MODIFIER_NAME_wal_heir_of_rome_mod: "Наследник Рима"
 STATIC_MODIFIER_DESC_wal_heir_of_rome_mod: "При дворе Валахии, притязающем на наследие византийских императоров, и духовенство, и знать без сомнения преклоняют головы перед его законностью."
 STATIC_MODIFIER_NAME_wal_bulwark_mod: "Оплот христианского мира"
 STATIC_MODIFIER_DESC_wal_bulwark_mod: "Сеть пограничных крепостей ныне служит щитом христианского мира."
 STATIC_MODIFIER_NAME_wal_downfall_mod: "Падение османов"
 STATIC_MODIFIER_DESC_wal_downfall_mod: "На границах, более не терзаемых османскими набегами, солдаты с гордостью показывают выучку, кою они отточили."
 STATIC_MODIFIER_NAME_wal_manufactories_mod: "Мануфактуры развиты"
 STATIC_MODIFIER_DESC_wal_manufactories_mod: "Из труб мастерских Бухареста непрестанно поднимается дым новых тканей и орудий труда, кои создаются здесь."
 STATIC_MODIFIER_NAME_wal_trade_mod: "Дунайский торговый путь"
 STATIC_MODIFIER_DESC_wal_trade_mod: "Торговая сеть вдоль Дуная охраняет богатство государства."
 STATIC_MODIFIER_NAME_wal_treasury_mod: "Полная казна"
 STATIC_MODIFIER_DESC_wal_treasury_mod: "Сундуки, полные серебряных монет, сложены в подвалах дворца, и купцы торгуют, не сомневаясь в весе монеты."
 STATIC_MODIFIER_NAME_wal_danubian_empire_mod: "Сеть власти Дунайской империи"
 STATIC_MODIFIER_DESC_wal_danubian_empire_mod: "Сам Дунай стал артерией империи, его воды без труда несут войска вверх и вниз по течению. Легитимность династии стоит непоколебимо, а власть короны достигает каждого уголка империи."
