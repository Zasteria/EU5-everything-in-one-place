 eng_welsh_principality: "Sprzymierzone księstwo"
 eng_welsh_principality_plural: "Sprzymierzone księstwa"
 eng_welsh_principality_desc: "Szczególny status nadawany królestwu, które wybrało partnerstwo zamiast rywalizacji — suzeren nie może zmusić go do udziału w wojnach ofensywnych, a księstwo to posiada nawet prawo do samodzielnego wypowiadania wojny. W zamian aneksja staje się praktycznie niemożliwa, a oba państwa prosperują razem dzięki tej szczególnej więzi."
