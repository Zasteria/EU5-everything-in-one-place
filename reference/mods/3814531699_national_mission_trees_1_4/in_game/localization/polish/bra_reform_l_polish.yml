l_polish:
 bra_quality_doctrine_reform: "Doktryna elitarnej broni"
 bra_quality_doctrine_reform_desc: "Doktryna wojskowa priorytetująca nieliczną, elitarną armię — doskonali żołnierze i umiejętne wykorzystanie milicji pozwalają mniejszej armii przeciwstawić się większej. Kosztowna w utrzymaniu, lecz niezrównana pod względem siły bojowej."
 bra_quantity_doctrine_reform: "Doktryna powszechnej mobilizacji"
 bra_quantity_doctrine_reform_desc: "„Prusy to nie państwo z armią, lecz armia z państwem” — doktryna liczby, nie jakości, przytłaczająca wroga liczebnością. Tania w utrzymaniu, choć dyscyplina i morale nieco cierpią."
 bra_advanced_quality_doctrine_reform: "Auftragstaktik"
 bra_advanced_quality_doctrine_reform_desc: "„Taktyka zleceniowa” — doktryna powierzająca dowódcom polowym samodzielne decyzje, pozwalająca na szybkie działanie odpowiednie do sytuacji. Armia niezrównanego mistrzostwa w każdym rodzaju wojsk, piechocie i artylerii jednakowo, ustanawia przytłaczającą przewagę poprzez jakość. Kosztowna w utrzymaniu i sile żywej, lecz żadna armia nie dorównuje jej sile bojowej."
 bra_advanced_quantity_doctrine_reform: "Naród pod bronią"
 bra_advanced_quantity_doctrine_reform_desc: "Doktryna powszechnej mobilizacji narodowej, uzbrajająca całą populację — tania w utrzymaniu, obfita siła żywa i ogromna rozciągłość frontu przytłaczają wroga liczebnością. Dyscyplina i morale pozostają słabym punktem."
 bra_german_empire_reform: "Konstytucja cesarska Niemiec"
 bra_german_empire_reform_desc: "Osobliwa niemiecka struktura rządów — federacja państw uwieńczona Cesarzem, łącząca władzę centralną z autonomią federalną. Podnosi legitymizację i prestiż korony, dając zarówno dominację handlową, jak i elastyczność w administracji wewnętrznej."
