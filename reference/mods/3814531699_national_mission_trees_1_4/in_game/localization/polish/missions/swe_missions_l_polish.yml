l_polish:
 swe_stormaktstiden_mission_pack: "Stormaktstiden — era wielkomocarstwowości Szwecji"
 swe_stormaktstiden_mission_pack_DESCRIPTION:0 "W 1337 roku Szwecja jest niezależnym królestwem w unii personalnej z Norwegią pod rządami króla Magnusa Erikssona. Na północy leży potężna Dania, a nadchodząca walka o dominację skandynawską — zapowiedziana przez Unię Kalmarską (1397) — jest nieunikniona. Poprzez miedź z Falun, panowanie nad Bałtykiem i wareskie szlaki wschodnie urzeczywistnij Stormaktstiden (erę wielkomocarstwowości) i zbuduj Imperium Szwedzkie."
 swe_stormaktstiden_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Szwecja, osiągnij dominację skandynawską, zjednoczenie, ekspansję wschodnią i rozwój przemysłowy, by ustanowić Imperium Skandynawskie."
 swe_stormaktstiden_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by zbudować Imperium Szwedzkie."
 swe_stormaktstiden_mission_pack_BUTTON_DETAILS:0 "Od powstania Engelbrekta do Stormaktstiden — wykuj Szwecję w Imperium!"
 swe_kingdom_of_sweden: "Królestwo Szwecji"
 swe_kingdom_of_sweden_desc: "W 1337 roku Szwecja jest niezależnym królestwem w unii personalnej z Norwegią pod rządami króla Magnusa Erikssona. Otoczona przez potężną Danię na północy, księstwa ruskie na wschodzie i Hanzę na południu, Szwecja musi wzmocnić swoją legitymizację i ustabilizować swoje królestwo w przygotowaniu na nadchodzącą walkę o dominację skandynawską."
 swe_norway_union: "Unia personalna z Norwegią"
 swe_norway_union_desc: "Szwecja i Norwegia znajdują się w unii personalnej pod królem Magnusem od 1319 roku. Wzmocnienie tej unii łączy siłę militarną i gospodarczą północno-zachodniej Skandynawii przeciwko Danii."
 swe_break_from_denmark: "Przeciwstaw się Danii"
 swe_break_from_denmark_desc: "Nadchodząca Unia Kalmarska (1397) grozi daniem Danii dominacji nad Skandynawią — przyszłość, której Szwecja musi uniknąć. Aktywnie utwierdź władzę szwedzką przeciwko Danii teraz i zapewnij podstawę do roszczeń o dominację skandynawską. Wyprzedź ducha powstania Engelbrekta (1434) i ustanów szwedzką władzę królewską zanim nadejdzie ten dzień."
 swe_control_skaane: "Opanuj Skanię"
 swe_control_skaane_desc: "Skania — najbardziej południowy region Szwecji, od dawna sporny z Danią. Zdobycie Malmö i Skanii zapewnia cieśninę Sund i daje Szwecji swobodne wyjście na Bałtyk."
 swe_defeat_denmark: "Pokonaj Danię"
 swe_defeat_denmark_desc: "Dania jest największym wrogiem Szwecji. Zajęcie Kopenhagi lub uczynienie Danii szwedzkim wasalem oznacza, że panowanie nad Północą przechodzi na Szwecję. „Szwecja — prawdziwy przywódca Skandynawii” — pozycja, o której marzył Gustaw Waza, jest tu urzeczywistniona."
 swe_integrate_norway: "Włącz Norwegię"
 swe_integrate_norway_desc: "Bezpośrednie posiadanie Oslo, Bergen i Nidaros całkowicie włącza Norwegię częścią Imperium Szwedzkiego. Bogate łowiska ryb Norwegii i wrota do Północnego Atlantyku znacznie rozszerzają szwedzką potęgę."
 swe_unite_scandinavia: "Zjednocz Skandynawię"
 swe_unite_scandinavia_desc: "Dania zmiażdżona, Norwegia włączona — cała Skandynawia jest zjednoczona pod szwedzkim sztandarem. To osiągnięcie — zjednoczenie całej Skandynawii, czego nikomu nie udało się od czasów wikingów — jest tu urzeczywistnione."
 swe_danish_navy_seizure: "Zdobądź flotę duńską"
 swe_danish_navy_seizure_desc: "Po pokonaniu Danii jej potężna flota przechodzi na Szwecję. Najsilniejsza siła morska Bałtyku jest teraz w rękach szwedzkich, otwierając drogę do dominacji nad Morzem Północnym."
 swe_danish_navy_seizure_unlock_tt: "Decyzja „Włączenie floty duńskiej” jest teraz dostępna."
 swe_danish_fleet_decision.title: "Włączenie floty duńskiej"
 swe_danish_fleet_decision.desc: "Zdobyte duńskie okręty bezczynnie stoją w portach pokonanego królestwa. Skompletowanie załóg i przezbrojenie ich słono kosztuje skarbiec i niepokoi państwo, lecz sześć wielkich karak pod szwedzką banderą zmieniłoby układ sił na Bałtyku."
 swe_danish_fleet_decision.a: "Wcielić sześć karak do służby."
 swe_sound_toll: "Cło Sundzkie"
 swe_sound_toll_desc: "Ze zabezpieczoną Skanią Szwecja kontroluje teraz cieśninę Sund od strony szwedzkiej. Pobieranie Cła Sundzkiego zamiast Danii rodzi ogromny dochód."
 swe_control_gotland: "Opanuj Gotlandię"
 swe_control_gotland_desc: "Visby na Gotlandii jest jednym z największych miast handlowych Bałtyku. Zdobycie tej nagrody — spornej z Danią, Hanzą i Zakonem Inflanckim — ustanawia przyczółek Szwecji w handlu bałtyckim."
 swe_baltic_trade: "Handel bałtycki"
 swe_baltic_trade_desc: "Wykorzystując Gotlandię jako bazę, Szwecja poważnie wkracza w handel bałtycki. Warędzy niegdyś nosili towary ze Szwecji aż do Bizancjum. Wskrześ tę tradycję i stwórz erę szwedzkich kupców panujących nad Bałtykiem."
 swe_conquer_estonia: "Podbij Estonię"
 swe_conquer_estonia_desc: "Tallin (Reval) został pierwotnie zbudowany przez Duńczyków, lecz Szwecja zdobędzie Estonię w wojnie inflanckiej (1558-83). Wyprzedź ten historyczny podbój i ustanów przyczółek Szwecji na wschodnim wybrzeżu Bałtyku."
 swe_control_livonia: "Opanuj Inflanty"
 swe_control_livonia_desc: "Zdobycie Rygi i Tartu (Dorpatu) przywodzi całe wschodnie wybrzeże bałtyckie pod kontrolę szwedzką. Wśród rywalizacji z Polską, Rosją i Danią Szwecja staje się najwyższym władcą Inflant."
 swe_varangian_legacy: "Dziedzictwo wareskie"
 swe_varangian_legacy_desc: "W VIII-X wieku Warędzy (wikingowie) zbudowali Nowogród i otworzyli szlaki handlowe przez Dniepr aż do Konstantynopola. Zdobycie Nowogrodu i Pskowa wskrzesza to starożytne dziedzictwo w naszych czasach."
 swe_city_of_rus: "Miasto Rusi"
 swe_city_of_rus_desc: "Moskwa jest stolicą Wielkiego Księstwa Moskiewskiego i centrum świata ruskiego. Jako dziedzice Waregów, Szwecja, kontrolując Moskwę, dopełnia Imperium Szwedzkie, rozciągające się od Bałtyku po całą cywilizację wschodniosłowiańską."
 swe_bane_of_hansa: "Przekleństwo Hanzy"
 swe_bane_of_hansa_desc: "Liga Hanzeatycka zmonopolizowała handel bałtycki, lecz pęknięcia pojawiają się w miarę ekspansji Szwecji. Kontroluj Lubekę (przywódcę Hanzy) lub rozbij Ligę Hanzeatycką całkowicie, by przekazać główną rolę w handlu bałtyckim Szwecji."
 swe_pomeranian_coast: "Wybrzeże pomorskie"
 swe_pomeranian_coast_desc: "Zdobycie Stralsundu i Szczecina umieszcza wybrzeże pomorskie wzdłuż południowego Bałtyku pod kontrolą szwedzką. Wyprzedź to, co Szwecja rzeczywiście zdobyła w Wojnie Trzydziestoletniej (1618-48), i zabezpiecz ten region."
 swe_prussian_ambition: "Ambicje pruskie"
 swe_prussian_ambition_desc: "Prusy, niegdyś rządzone przez rycerzy krzyżackich, są południowo-wschodnim węzłem bałtyckim. Zabezpieczenie Królewca i regionu Prus daje Szwecji pełne panowanie nad Morzem Bałtyckim."
 swe_dominium_maris_baltici: "Dominium Maris Baltici"
 swe_dominium_maris_baltici_desc: "„Dominium Maris Baltici” (Panowanie nad Morzem Bałtyckim) — najwyższy cel strategiczny Szwecji XVII wieku. Dominacja nad całą linią wybrzeża bałtyckiego czyni to morze wewnętrzne szwedzkim „jeziorem”."
 swe_secure_stockholm: "Zabezpiecz Sztokholm"
 swe_secure_stockholm_desc: "Sztokholm — „wyspa pośród wód” — naturalna twierdza-miasto między jeziorem Mälaren a Bałtykiem. Podniesienie jej do rangi miasta z rozwojem 30+ ustanawia je centrum szwedzkiej władzy królewskiej."
 swe_falun_mine: "Kopalnia w Falun"
 swe_falun_mine_desc: "Stora Kopparberget (Wielka Góra Miedziana) — kopalnia miedzi w Falun działa od IX wieku, serce gospodarki szwedzkiej. Gdy Magnus IV nadał spółce górniczej dodatkowe przywileje w 1347 roku, pokrywała dwie trzecie europejskiego zapotrzebowania na miedź. Zmaksymalizuj tę kopalnię."
 swe_iron_industry: "Szwedzki przemysł żelazny"
 swe_iron_industry_desc: "Kopalnie żelaza Svealandu są podstawą szwedzkiego przemysłu obronnego. Wysokiej jakości szwedzkie żelazo pożądały armie całej Europy — działa Wojny Trzydziestoletniej używały szwedzkiego żelaza. Rozszerz tę przewagę przemysłową jeszcze dalej."
 swe_swedish_steel: "Stal szwedzka"
 swe_swedish_steel_desc: "Stal szwedzka — sławiona najlepszą jakością w Europie. Przemysł stalowy, wspierany obfitą produkcją miedzi i żelaza, symbolizuje potęgę gospodarczą Imperium Szwedzkiego zarówno w uzbrojeniu armii szwedzkich, jak i w dochodzie eksportowym."
 swe_riksdag: "Riksdag"
 swe_riksdag_desc: "Riksdag (Parlament) zwołany po raz pierwszy w 1435 roku w Szwecji. To zgromadzenie stanowe szlachty, rycerzy, duchowieństwa i chłopów (osobliwie, szwedzcy chłopi posiadali własne przedstawicielstwo stanowe) musi być wzmocnione, by ustanowić swoistą tradycję polityczną Szwecji."
 swe_absolutism: "Absolutyzm"
 swe_absolutism_desc: "W 1680 roku Karol XI odzyskał ziemie szlacheckie poprzez „redukcję” i ustanowił monarchię absolutną w Szwecji. Wyprzedź tę historyczną transformację i całkowicie umocnij władzę królewską."
 swe_great_power: "Szwecja jako wielka potęga"
 swe_great_power_desc: "Stormaktstiden XVII wieku widziała, jak Szwecja powstała główną potęgą europejską pod Gustawem Adolfem, Karolem X Gustawem i Karolem XII. Wyprzedź tę erę rozległym terytorium, bogatym dochodem i wysokim prestiżem."
 swe_stormakt_economy: "Gospodarka wielkiej potęgi"
 swe_stormakt_economy_desc: "Stal szwedzka, efektywność administracyjna monarchii absolutnej, handel bałtycki — podstawa gospodarcza Stormaktstiden ukończona. Dowiedź szwedzkiej potęgi imperialnej dochodem miesięcznym 400+ i licznymi centrami handlowymi."
 swe_religious_crossroads: "Skrzyżowanie wiary"
 swe_religious_crossroads_desc: "Burza Reformacji przetacza się przez Skandynawię. Dwór szwedzki spiera się zaciekle: zachować wierność papieżowi rzymskiemu — przyjąć rewolucyjną naukę Marcina Lutra — czy powrócić do dawnych bogów, czczonych przez przodków. Decyzja króla szwedzkiego zdecyduje o przyszłości tego północnego królestwa."
 swe_catholic_sweden: "Katolicka Szwecja"
 swe_catholic_sweden_desc: "Królestwo Szwecji zachowuje wierność Kościołowi Rzymskiemu. Bliskie stosunki z papieżem dają Szwecji przewagę dyplomatyczną i uznanie strażniczki północnej cywilizacji katolickiej."
 swe_northern_crusade: "Krucjata Północna"
 swe_northern_crusade_desc: "Szwecja uczestniczy w świętej wojnie jako północna tarcza chrześcijaństwa. Przewodząc krucjatom północnym przeciwko narodom niechrześcijańskim podnosi władzę religijną i prestiż Szwecji."
 swe_church_reform: "Obrońca papieża"
 swe_church_reform_desc: "Głębokie zaufanie z papiestwem i kontrola nad Lubeką — Szwecja ustanowiła niewzruszoną pozycję strażniczki północnej cywilizacji katolickiej."
 swe_reformation: "Reformacja"
 swe_reformation_desc: "W 1527 roku król szwedzki Gustaw Waza ogłosił luteranizm faktyczną religią państwową na sejmie w Västerås. Przekazanie majątku kościelnego koronie znacznie wzmocniło finanse państwowe. Wyprzedź ten decydujący czyn teraz."
 swe_protestant_reform: "Kościół protestancki"
 swe_protestant_reform_desc: "Rozwiń uniwersytety, by kształcić teologów luterańskich i zakorzenić wiarę protestancką w całej Szwecji. Odrębność kościoła szwedzkiego staje się podstawą szwedzkiej kultury i tożsamości."
 swe_protestant_empire: "Imperium protestanckie"
 swe_protestant_empire_desc: "Luteranizm przenika całą Skandynawię. Król szwedzki panuje jako północny obrońca świata protestanckiego, zdolny stawić czoła południowym potęgom katolickim, jak w Wojnie Trzydziestoletniej."
 swe_norse_revival: "Odrodzenie wiary nordyckiej"
 swe_norse_revival_desc: "Bogowie przodków — Odyn, Thor, Freyr — odradzają się. Oblicze Skandynawii sprzed chrystianizacji zostaje odtworzone w naszych czasach. Król szwedzki, panujący jako przedstawiciel bogów nordyckich — ten rewolucyjny wybór wstrząśnie całą Europą."
 swe_berserker_army: "Armia berserków"
 swe_berserker_army_desc: "Duch wojowników-niedźwiedzi epoki wikingów odrodzony. Wojownicy, oddani bogom nordyckim, wypuszczeni jako korsarze, wolni pustoszyć wybrzeża niewiernych."
 swe_yggdrasil_throne: "Tron Yggdrasilu"
 swe_yggdrasil_throne_desc: "Podobnie jak Odyn zasiadający u korzeni Drzewa Świata, cesarz szwedzki panuje w centrum świata północnego. Z rangą cesarską i 300+ prowincjami północne imperium, błogosławione przez bogów nordyckich, jest ukończone."
 swe_finland_integration: "Włącz Finlandię"
 swe_finland_integration_desc: "Finlandia jest nieodłączną częścią Szwecji od XII wieku. Bezpośrednie posiadanie Turku, Wyborga i Uleåborga ustanawia przyczółek Szwecji do Północnego Atlantyku i Morza Barentsa."
 swe_lapland_expansion: "Ekspansja lapońska"
 swe_lapland_expansion_desc: "Rozległe lasy Norrlandii (północnej Szwecji) są domem ludu Saamów. Włączenie ich ziem do królestwa i zabezpieczenie obfitych zasobów drewna, futer i rudy żelaza rozpoczyna poważne zagospodarowanie północnego pogranicza Szwecji."
 swe_arctic_empire: "Imperium arktyczne"
 swe_arctic_empire_desc: "Rozwinięcie się do Morza Norweskiego i Morza Barentsa ze środkiem w Uleåborg — Szwecja staje się imperium północnym, rozciągającym się aż po Koło Podbiegunowe. Namiestnicy morscy są ustanawiani, a obecność morska rozszerzana, by dopełnić północne pogranicze Imperium Szwedzkiego."
 swe_develop_stockholm: "Wielki Sztokholm"
 swe_develop_stockholm_desc: "Sztokholm rozwinął się w wielkie miasto z uniwersytetem. To miasto, łączące Bałtyk i Morze Północne, wyrasta na największe miasto Europy Północnej, kulturalne, handlowe i polityczne centrum Imperium Szwedzkiego."
 swe_develop_goteborg: "Rozwiń Göteborg"
 swe_develop_goteborg_desc: "Göteborg został zbudowany przez Gustawa Adolfa w 1621 roku zachodnim portem morskim Szwecji. Podniesienie go do rangi miasta otwiera bezpośredni szlak handlowy do Danii, Holandii i Anglii."
 swe_peasant_support: "Wsparcie chłopstwa"
 swe_peasant_support_desc: "Stan chłopski Szwecji posiada własne przedstawicielstwo w Riksdagu — swoista cecha. Podniesienie zadowolenia chłopów i rozszerzenie produkcji zboża ustanawia stabilność społeczną i swoistą tradycję demokratyczną Szwecji."
 swe_engelbrekt: "Duch Engelbrekta"
 swe_engelbrekt_desc: "W latach 1434-36 Engelbrekt Engelbrektsson poprowadził górników i chłopów w powstanie przeciwko panowaniu duńskiemu. Został zabity, lecz jego duch stał się wiecznym symbolem szwedzkiego ruchu wyzwoleńczego. Formalnie ucieleśnij tego ducha teraz."
 swe_colonization: "Szwedzkie imperium kolonialne"
 swe_colonization_desc: "Szwecja zbudowała także kolonie w XVII wieku, w tym Nową Szwecję (region rzeki Delaware). Opierając się na rozwoju Finlandii, rozpocznij przedsięwzięcia kolonialne za morzem i rozszerz zasięg Imperium Szwedzkiego na cały świat."
 swe_develop_uppsala: "Uniwersytet w Uppsali prosperuje"
 swe_develop_uppsala_desc: "Uniwersytet w Uppsali (założony 1477), najstarszy w Szwecji, wydał Karola Linneusza (taksonomia) i Andersa Celsjusza (termometr) — najlepszą akademię Europy Północnej. Rozwiń ten uniwersytet i umocnij podstawy szwedzkiej uczoności."
 swe_karoliner: "Karolinerzy"
 swe_karoliner_desc: "Karolinerzy (żołnierze króla Karola) byli elitarną piechotą Imperium Szwedzkiego pod Karolem XII na początku XVIII wieku, znaną jako najsilniejsza piechota swej epoki. Rozwiń wysoką tradycję wojskową i dużą armię, by wyprzedzić ten elitarny korpus."
 swe_amber_trade: "Handel bursztynem"
 swe_amber_trade_desc: "Bałtycki bursztyn, wywożony z terytoriów kontrolowanych przez Szwecję po całej Europie — „Złoto Północy”. Opierając się na podstawie gospodarczej wielkiej potęgi i dalej rozszerzając handel bursztynem, wzmocnij dochód handlowy Imperium Szwedzkiego."
 swe_stormaktstiden: "Stormaktstiden"
 swe_stormaktstiden_desc: "Skandynawia zjednoczona, Bałtyk podbity, gospodarka wielkiej potęgi osiągnięta — trzy filary łączą się, a Szwecja osiąga szczyt Stormaktstiden (ery wielkomocarstwowości). Z 600+ prowincjami, dochodem 600+, prestiżem 80+ zdobądź tę chwałę."
 swe_swedish_empire: "Imperium Szwedzkie"
 swe_swedish_empire_desc: "Od Bałtyku po Moskwę, od Skandynawii po Prusy — Imperium Szwedzkie ukończone. Droga Szwecji, rozpoczęta w 1337 roku unią personalną z Norwegią, kończy się tu przybyciem wielkiego imperium, panującego nad całą Europą Północną. „Szwecja śmieje się ostatnia” — słowa Karola XII są tu urzeczywistnione."
 swe_events.30.t: "Jedność skandynawska — świt Stormaktstiden"
 swe_events.30.d: "Dania zmiażdżona, Norwegia włączona — cała Skandynawia jest zjednoczona pod szwedzkim sztandarem. To osiągnięcie, nieosiągnięte od czasów wikingów, wreszcie urzeczywistnione. Król szwedzki niniejszym ogłasza tytuł „Króla Skandynawii”, a budowa największego państwa Europy Północnej się rozpoczyna. „Marzenie Engelbrekta ziściło się tu dziś” — tak napiszą przyszli historycy."
 swe_events.30.a: "Niech żyje Skandynawia! Jedność Północy na wieki!"
 swe_events.40.t: "Skrzyżowanie wiary — religijny wybór Szwecji"
 swe_events.40.d: "Burza Reformacji przetacza się przez Skandynawię. Dwór szwedzki spiera się zaciekle. Zachować wierność papieżowi w Rzymie — przyjąć rewolucyjną naukę Lutra — czy powrócić do dawnych bogów, czczonych przez przodków? Decyzja króla szwedzkiego zdecyduje o przyszłości tego północnego królestwa."
 swe_events.40.a: "Zachować wierność Rzymowi — katolicyzm jest duszą Szwecji"
 swe_events.40.b: "Przyjąć naukę Lutra — nadeszła era reformy"
 swe_events.40.c: "Powrócić do dawnych bogów — szukać błogosławieństwa Odyna"
 swe_events.99.t: "Narodziny Imperium Szwedzkiego"
 swe_events.99.d: "Od Bałtyku po Moskwę, od Skandynawii po Prusy — Imperium Szwedzkie wreszcie ukończone. Od drogi Szwecji, rozpoczętej w 1337 roku unią personalną z Norwegią, Szwecja przekształciła się z peryferyjnego narodu północnego w wielkie imperium, panujące nad całą Europą Północną. Stormaktstiden (era wielkomocarstwowości) — to była era, gdy Szwecja stała się głównym aktorem historii światowej. „Znów nastał dzień — lecz tym razem to dzień Szwecji”."
 swe_events.99.a: "Niech żyje Cesarz Imperium Szwedzkiego! Niech imperium północne trwa na wieki!"
 STATIC_MODIFIER_NAME_swe_kingdom_mod: "Królestwo Szwecji"
 STATIC_MODIFIER_DESC_swe_kingdom_mod: "Kamień węgielny odbudowy Szwecji za panowania króla Magnusa Erikssona położony."
 STATIC_MODIFIER_NAME_swe_norway_union_mod: "Bonus unii norweskiej"
 STATIC_MODIFIER_DESC_swe_norway_union_mod: "Unia personalna z Norwegią jednoczy siłę militarną północno-zachodniej Skandynawii."
 STATIC_MODIFIER_NAME_swe_skaane_mod: "Skania zabezpieczona"
 STATIC_MODIFIER_DESC_swe_skaane_mod: "Szwedzka strona cieśniny Sund zabezpieczona przez kontrolę nad Skanią."
 STATIC_MODIFIER_NAME_swe_norway_integrated_mod: "Norwegia włączona — dar łowisk"
 STATIC_MODIFIER_DESC_swe_norway_integrated_mod: "Bogate łowiska ryb Norwegii włączone do Imperium Szwedzkiego."
 STATIC_MODIFIER_NAME_swe_scandinavia_united_mod: "Skandynawia zjednoczona"
 STATIC_MODIFIER_DESC_swe_scandinavia_united_mod: "Sztandary trzech królestw stoją obok siebie pod jedną koroną, a rozkazy wydane ze Sztokholmu docierają do mórz północnych."
 STATIC_MODIFIER_NAME_swe_baltic_trade_mod: "Handel bałtycki"
 STATIC_MODIFIER_DESC_swe_baltic_trade_mod: "Szwecja poważnie wkracza w handel bałtycki. Starożytne szlaki handlowe Waregów żyją na nowo."
 STATIC_MODIFIER_NAME_swe_estonia_mod: "Estonia podbita"
 STATIC_MODIFIER_DESC_swe_estonia_mod: "Estonia ze środkiem w Tallinie wchodzi pod kontrolę szwedzką."
 STATIC_MODIFIER_NAME_swe_livonia_mod: "Inflanty podporządkowane"
 STATIC_MODIFIER_DESC_swe_livonia_mod: "Ze zdobytymi Rygą i Tartu całe wschodnie wybrzeże bałtyckie jest pod zarządem szwedzkim."
 STATIC_MODIFIER_NAME_swe_varangian_mod: "Dziedzictwo wareskie"
 STATIC_MODIFIER_DESC_swe_varangian_mod: "Zdobycie Nowogrodu wskrzesza starożytne szlaki handlowe wareskie."
 STATIC_MODIFIER_NAME_swe_eastern_empire_mod: "Panowanie nad Rusią"
 STATIC_MODIFIER_DESC_swe_eastern_empire_mod: "Zdobycie Moskwy czyni Szwecję władcą świata wschodniosłowiańskiego."
 STATIC_MODIFIER_NAME_swe_dominium_baltici_mod: "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_swe_dominium_baltici_mod: "Morze Bałtyckie staje się „jeziorem” Szwecji. Każdy statek handlowy przecinający to morze odpowiada Szwecji."
 STATIC_MODIFIER_NAME_swe_hansa_victory_mod: "Hanza pokonana"
 STATIC_MODIFIER_DESC_swe_hansa_victory_mod: "Szwecja pokonuje Ligę Hanzeatycką i staje się gwiazdą handlu bałtyckiego."
 STATIC_MODIFIER_NAME_swe_pomerania_mod: "Wybrzeże pomorskie"
 STATIC_MODIFIER_DESC_swe_pomerania_mod: "Wyprzedzając to, co Szwecja zdobyła w Wojnie Trzydziestoletniej, południowe wybrzeże bałtyckie pod kontrolą szwedzką."
 STATIC_MODIFIER_NAME_swe_prussia_mod: "Ambicje pruskie"
 STATIC_MODIFIER_DESC_swe_prussia_mod: "Prusy, w tym Królewiec, wchodzą pod kontrolę szwedzką."
 STATIC_MODIFIER_NAME_swe_stockholm_mod: "Sztokholm zabezpieczony"
 STATIC_MODIFIER_DESC_swe_stockholm_mod: "Szwedzka stolica królewska Sztokholm rozwinięta centrum administracyjnym."
 STATIC_MODIFIER_NAME_swe_falun_copper_mod: "Kopalnia miedzi w Falun"
 STATIC_MODIFIER_DESC_swe_falun_copper_mod: "Kopalnia miedzi w Falun, wspierająca europejskie zapotrzebowanie na miedź, działa pełną mocą."
 STATIC_MODIFIER_NAME_swe_iron_industry_mod: "Przemysł żelazny"
 STATIC_MODIFIER_DESC_swe_iron_industry_mod: "Kopalnie żelaza Svealandu w pełni działają, ustanawiając podstawę szwedzkiego przemysłu obronnego."
 STATIC_MODIFIER_NAME_swe_steel_mod: "Stal szwedzka"
 STATIC_MODIFIER_DESC_swe_steel_mod: "Najlepsza w Europie stal szwedzka zaopatruje armie w kraju i za granicą."
 STATIC_MODIFIER_NAME_swe_riksdag_mod: "Riksdag"
 STATIC_MODIFIER_DESC_swe_riksdag_mod: "Parlament Szwecji ustanowiony jako działający organ ustawodawczy. Swoista tradycja polityczna Szwecji — w której uczestniczą chłopi — nabiera kształtu."
 STATIC_MODIFIER_NAME_swe_absolutism_mod: "Absolutyzm"
 STATIC_MODIFIER_DESC_swe_absolutism_mod: "Wyprzedzając redukcję Karola XI, monarchia absolutna ustanowiona w Szwecji."
 STATIC_MODIFIER_NAME_swe_great_power_mod: "Szwecja jako wielka potęga"
 STATIC_MODIFIER_DESC_swe_great_power_mod: "Nadejście Stormaktstiden widzi, jak Szwecja powstaje główną potęgą europejską."
 STATIC_MODIFIER_NAME_swe_stormakt_economy_mod: "Gospodarka wielkiej potęgi"
 STATIC_MODIFIER_DESC_swe_stormakt_economy_mod: "Gospodarka wielkiej potęgi Szwecji — zbudowana na stali szwedzkiej, monarchii absolutnej i handlu bałtyckim — ukończona."
 STATIC_MODIFIER_NAME_swe_catholic_mod: "Katolicka Szwecja"
 STATIC_MODIFIER_DESC_swe_catholic_mod: "Zachowując wierność Kościołowi Rzymskiemu, Szwecja uznana jest strażniczką północnej cywilizacji katolickiej."
 STATIC_MODIFIER_NAME_swe_crusader_glory_mod: "Chwała krzyżowca północnego"
 STATIC_MODIFIER_DESC_swe_crusader_glory_mod: "Szwecja uczestniczy w świętej wojnie, ustanawiając swą reputację strażniczki chrześcijaństwa."
 STATIC_MODIFIER_NAME_swe_lutheran_mod: "Reforma luterańska"
 STATIC_MODIFIER_DESC_swe_lutheran_mod: "Wyprzedzając luterańską proklamację Gustawa Wazy, majątek kościelny przechodzi na koronę."
 STATIC_MODIFIER_NAME_swe_protestant_reform_mod: "Kościół protestancki"
 STATIC_MODIFIER_DESC_swe_protestant_reform_mod: "Przygotowanie teologii luterańskiej zakorzenia wiarę protestancką w całej Szwecji."
 STATIC_MODIFIER_NAME_swe_norse_conversion_mod: "Odrodzenie wiary nordyckiej"
 STATIC_MODIFIER_DESC_swe_norse_conversion_mod: "Wiara w Odyna, Thora i Freyra odrodzona. Duch wojownika epoki wikingów zamieszkuje armie Szwecji."
 STATIC_MODIFIER_NAME_swe_berserker_mod: "Armia berserków"
 STATIC_MODIFIER_DESC_swe_berserker_mod: "Duch wojowników-niedźwiedzi epoki wikingów odrodzony. Korsarstwo wypuszczone, by pustoszyć wybrzeża niewiernych."
 STATIC_MODIFIER_NAME_swe_yggdrasil_mod: "Tron Yggdrasilu"
 STATIC_MODIFIER_DESC_swe_yggdrasil_mod: "Podobnie jak Odyn u korzeni Drzewa Świata, cesarz szwedzki panuje w centrum świata północnego."
 STATIC_MODIFIER_NAME_swe_finland_mod: "Finlandia włączona"
 STATIC_MODIFIER_DESC_swe_finland_mod: "Finlandia włączona częścią Imperium Szwedzkiego. Polityka kolonialna otwiera pogranicze północne."
 STATIC_MODIFIER_NAME_swe_lapland_mod: "Ekspansja lapońska"
 STATIC_MODIFIER_DESC_swe_lapland_mod: "Rozległe lasy Norrlandii włączone do Szwecji."
 STATIC_MODIFIER_NAME_swe_arctic_mod: "Imperium arktyczne"
 STATIC_MODIFIER_DESC_swe_arctic_mod: "Szwedzkie latarnie morskie, stojące na wybrzeżu arktycznym, prowadzą żeglarzy przecinających Północny Atlantyk."
 STATIC_MODIFIER_NAME_swe_stormaktstiden_mod: "Stormaktstiden"
 STATIC_MODIFIER_DESC_swe_stormaktstiden_mod: "Era wielkomocarstwowości Szwecji — osiągnięty szczyt imperium północnego, panującego nad Skandynawią, Bałtykiem i Europą Wschodnią."
 STATIC_MODIFIER_NAME_swe_sound_toll_mod: "Cło Sundzkie"
 STATIC_MODIFIER_DESC_swe_sound_toll_mod: "Pobieranie Cła Sundzkiego wzbogaca skarbiec szwedzki."
 STATIC_MODIFIER_NAME_swe_stockholm_great_mod: "Sztokholm — miasto Północy"
 STATIC_MODIFIER_DESC_swe_stockholm_great_mod: "Sztokholm rozwinął się w wielkie miasto z uniwersytetem, stając się największą stolicą kulturalną i naukową Europy Północnej."
 STATIC_MODIFIER_NAME_swe_peasant_mod: "Wsparcie chłopstwa"
 STATIC_MODIFIER_DESC_swe_peasant_mod: "Wsparcie stanu chłopskiego Szwecji tworzy stabilność społeczną, swoistą dla Szwecji."
 STATIC_MODIFIER_NAME_swe_engelbrekt_mod: "Duch Engelbrekta"
 STATIC_MODIFIER_DESC_swe_engelbrekt_mod: "Duch powstania z 1434 roku inspiruje armie szwedzkie. Walka o wolność jest dumą Szwecji."
 STATIC_MODIFIER_NAME_swe_colonial_mod: "Szwedzkie imperium kolonialne"
 STATIC_MODIFIER_DESC_swe_colonial_mod: "Szwecja rozpoczyna przedsięwzięcia kolonialne za morzem, stając się imperium poza Europą Północną."
 STATIC_MODIFIER_NAME_swe_papal_champion_mod: "Obrońca papieża"
 STATIC_MODIFIER_DESC_swe_papal_champion_mod: "Szwecja ustanawia niewzruszoną pozycję najsilniejszej strażniczki północnej cywilizacji katolickiej."
 STATIC_MODIFIER_NAME_swe_protestant_empire_mod: "Imperium protestanckie"
 STATIC_MODIFIER_DESC_swe_protestant_empire_mod: "Szwecja z całoskandynawskim luteranizmem panuje jako północny obrońca świata protestanckiego."
 STATIC_MODIFIER_NAME_swe_amber_mod: "Handel bursztynem"
 STATIC_MODIFIER_DESC_swe_amber_mod: "Bursztyn, zebrany na wybrzeżach Bałtyku, lśni złotem w witrynach jubilerów Sztokholmu."
 STATIC_MODIFIER_NAME_swe_uppsala_mod: "Uniwersytet w Uppsali"
 STATIC_MODIFIER_DESC_swe_uppsala_mod: "Najstarszy uniwersytet Szwecji prosperuje jako najlepsza instytucja naukowa Europy Północnej."
 STATIC_MODIFIER_NAME_swe_karoliner_mod: "Karolinerzy"
 STATIC_MODIFIER_DESC_swe_karoliner_mod: "Wyprzedzając elitarną piechotę Karola, wysoko wyszkolona armia szwedzka ukończona."
 STATIC_MODIFIER_NAME_swe_scandinavian_empire_final_mod: "Imperium Szwedzkie"
 STATIC_MODIFIER_DESC_swe_scandinavian_empire_final_mod: "Imperium Szwedzkie, rozciągające się od Bałtyku po Europę Wschodnią, ukończone. Stormaktstiden trwa na wieki."
 STATIC_MODIFIER_NAME_swe_faith_steadfast_mod: "Niezłomny w wierze"
 STATIC_MODIFIER_DESC_swe_faith_steadfast_mod: "Niezłomna wiara katolicka ogłasza władzę króla ludowi dzwonami katedry w Uppsali."
 STATIC_MODIFIER_NAME_swe_reform_winds_mod: "Wiatry reformy"
 STATIC_MODIFIER_DESC_swe_reform_winds_mod: "Nauka Lutra rozprzestrzenia się po Szwecji."
 STATIC_MODIFIER_NAME_swe_old_gods_calling_mod: "Wołanie dawnych bogów"
 STATIC_MODIFIER_DESC_swe_old_gods_calling_mod: "Wiara w Odyna i Thora potajemnie się odradza."
 swe_norrkoping_textiles: "Przemysł tekstylny Norrköping"
 swe_norrkoping_textiles_desc: "Norrköping stało się miastem przemysłowym wschodniego wybrzeża Szwecji, centrum produkcji tekstyliów i sukna. Wykorzystując obfitą siłę wodną rzeki Motala, produkcja sukna staje się ważnym filarem szwedzkiego eksportu."
 STATIC_MODIFIER_NAME_swe_norrkoping_textile_mod: "Przemysł tekstylny Norrköping"
 STATIC_MODIFIER_DESC_swe_norrkoping_textile_mod: "Produkcja sukna z siłą wodną w Norrköping działa pełną mocą. Szwedzki eksport sukna na rynki europejskie."
 STATIC_MODIFIER_NAME_swe_goteborg_mod: "Port Varberg rozwinięty"
 STATIC_MODIFIER_DESC_swe_goteborg_mod: "W porcie Varberg nad Kattegatem żaglowce płynące na Morze Północne odbijają jeden po drugim od nabrzeża."
 STATIC_MODIFIER_NAME_swe_visby_mod: "Handel Visby"
 STATIC_MODIFIER_DESC_swe_visby_mod: "Dzielnica magazynowa Visby na Gotlandii znów ożywiona kupcami z całego Bałtyku."
 STATIC_MODIFIER_NAME_swe_denmark_crushed_mod: "Dania zmiażdżona"
 STATIC_MODIFIER_DESC_swe_denmark_crushed_mod: "Gdy flaga Danii, naszego dawnego wroga, została opuszczona, panowie Skandynawii cicho wypowiedzieli imię swego nowego władcy."
