l_polish:
 lit_lithuania_mission_pack: "Od Bałtyku po Morze Czarne"
 lit_lithuania_mission_pack_DESCRIPTION:0 "W 1337 roku Wielkie Księstwo Litewskie pod wielkim księciem Giedyminem jest najdynamiczniejszą potęgą Europy Wschodniej. Rozgrom Zakon Krzyżacki, podbij Ruś, dotrzyj do Morza Czarnego, utwórz z Polską republikę szlachecką — i wybierz swą wiarę, by określić duszę Litwy."
 lit_lithuania_mission_pack_CRITERIA_DESCRIPTION:0 "Podbij od Bałtyku po Morze Czarne i utwórz z Polską republikę szlachecką, by wznieść litewskie wielkie imperium."
 lit_lithuania_mission_pack_BUTTON_TOOLTIP:0 "Rządź jako Litwa Europą Wschodnią od Bałtyku po Morze Czarne."
 lit_lithuania_mission_pack_BUTTON_DETAILS:0 "„Ziemia Litwy, na wieki” — od Giedymina po Witolda, przywróć blask Wielkiego Księstwa!"
 lit_gediminas_legacy: "Dziedzictwo Giedyminowiczów"
 lit_gediminas_legacy_desc: "Odziedzicz podstawy dynastyczne, położone przez wielkiego księcia Giedymina, i przejdź drogę ku wielkiemu imperium, rozciągającemu się od Bałtyku po Morze Czarne."
 lit_teutonic_threat: "Zagrożenie ze strony Zakonu Krzyżackiego"
 lit_teutonic_threat_desc: "Zakon Krzyżacki, maszerujący na wschód pod sztandarem krzyżowym — to religijne państwo wojskowe — jest największym wrogiem Litwy. Powstrzymaj go i zabezpiecz zachodnią granicę."
 lit_black_ruthenia_integration: "Włączenie Rusi Czarnej"
 lit_black_ruthenia_integration_desc: "Ruś Czarna — położona wokół Grodna i Brześcia, przywiedź tę ziemię w sferę rządów Litwy jako podstawę dla ekspansji wschodniej."
 lit_volhynia_podolia: "Wołyń i Podole"
 lit_volhynia_podolia_desc: "Wołyń i Podole — przywiedź bogate równiny Zachodniej Ukrainy pod litewską kontrolę i otwórz drogę do Morza Czarnego."
 lit_smolensk: "Podbój Smoleńska"
 lit_smolensk_desc: "Smoleńsk — strategiczna brama do wschodniej Rusi. Zajmij tę twierdzę i zwiększ presję na Moskwę."
 lit_kyiv: "Podbój Kijowa"
 lit_kyiv_desc: "Kijów — matka wszystkich miast ruskich. Jeśli Litwa zajmie Kijów, otworzy się droga, by zostać „władcą całej Rusi”."
 lit_steppe_frontier: "Granica stepowa"
 lit_steppe_frontier_desc: "Wielki step, gdzie wędrują Tatarzy i Kumanie — wznieś linię obronną na tym niebezpiecznym pograniczu i otwórz drogę na Krym."
 lit_crimea: "Podporządkowanie Krymu"
 lit_crimea_desc: "Półwysep Krymski — klucz do Morza Czarnego. Podporządkuj Chanat Krymski i zabezpiecz wrota do Morza Czarnego."
 lit_black_sea: "Pan Morza Czarnego"
 lit_black_sea_desc: "Morze Czarne — morze Litwy. Od Krymu po Odessę pokryj całe wybrzeże czarnomorskie litewskim sztandarem."
 lit_dominant_in_rus: "Zwierzchność nad Rusią"
 lit_dominant_in_rus_desc: "Moskwa czy Litwa — w walce o zwierzchność nad Europą Wschodnią Litwa triumfuje i rządzi „panem całej Rusi”."
 lit_teutonic_defeat: "Upadek Zakonu Krzyżackiego"
 lit_teutonic_defeat_desc: "Stary wróg od czasów Grunwaldu, Zakon Krzyżacki, wreszcie upadł — panowanie nad Bałtykiem należy do Litwy."
 lit_samogitia: "Żmudź"
 lit_samogitia_desc: "Żmudź — ziemia, długo sporna z Zakonem Krzyżackim. Przywróć Litwie ojczyznę tego upartego ludu bałtyckiego."
 lit_livonia: "Panowanie nad Inflantami"
 lit_livonia_desc: "Ryga i Inflanty — przywiedź serce handlu bałtyckiego pod litewską kontrolę i ustanów wpływ na Hanzę."
 lit_jogaila_union: "Unia Jagiełły"
 lit_jogaila_union_desc: "Unia wielkiego księcia Jagiełły z Królestwem Polskim — przez nawrócenie na katolicyzm i małżeństwo Litwa i Polska są związane."
 lit_jagiellonian_dynasty: "Dynastia Jagiellonów"
 lit_jagiellonian_dynasty_desc: "Dynastia Jagiellonów — rządząc zarówno Litwą, jak i Polską, ten dom powstaje największą potęgą Europy Środkowej."
 lit_lublin_union: "Unia Lubelska"
 lit_lublin_union_desc: "Unia Lubelska z 1569 roku — historyczna chwila, gdy Litwa i Polska jednoczą się w „Rzeczpospolitą Obojga Narodów”."
 lit_polish_sejm: "Sejm polski"
 lit_polish_sejm_desc: "Sejm — to instytucja, przez którą szlachta uczestniczy w decyzjach państwa, staje się sercem republiki szlacheckiej."
 lit_commonwealth: "Ukończenie republiki szlacheckiej"
 lit_commonwealth_desc: "Polsko-Litewska republika szlachecka — największe państwo Europy Środkowej, rozciągające się od Bałtyku po Morze Czarne, ukończone. „Za naszą wolność” — sztandar tej republiki szlacheckiej jaśnieje nad Europą."
 lit_faith_choice: "Wybór wiary"
 lit_faith_choice_desc: "Katolicyzm, prawosławie czy Romuva — jaką wiarę wybierze Litwa? Ta decyzja określi przyszłość narodu."
 lit_catholic_baptism: "Chrzest w wierze katolickiej"
 lit_catholic_baptism_desc: "Chrzest Wilna z 1387 roku — Litwa przyjmuje katolicyzm i staje się częścią chrześcijaństwa europejskiego."
 lit_faith_romuva_chosen_tt: "Wybrano Romuvę"
 lit_faith_orthodox_chosen_tt: "Wybrano prawosławie"
 lit_faith_catholic_chosen_tt: "Wybrano katolicyzm"
 lit_catholic_crusade: "Krucjata katolicka"
 lit_catholic_crusade_desc: "Pod sztandarem katolickim — przez kontratak przeciw pogańskiemu państwu krzyżowemu Zakonu Krzyżackiego Litwa uznana jest za obrończynię świata katolickiego."
 lit_catholic_bishoprics: "Ustanowienie biskupstw"
 lit_catholic_bishoprics_desc: "Biskupstwo wileńskie — zorganizuj strukturę Kościoła katolickiego na Litwie i pozwól wierze zapuścić głębokie korzenie."
 lit_catholic_king: "Koronacja króla katolickiego"
 lit_catholic_king_desc: "Król katolicki Polski-Litwy — prawowita, uznana przez papieża korona jaśnieje teraz nad dynastią Jagiellonów."
 lit_orthodox_metropolis: "Metropolia prawosławna"
 lit_orthodox_metropolis_desc: "Metropolia Kijowska — Litwa bierze centrum prawosławia Rusi pod swoją ochronę. Rządź Europą Wschodnią jako obrońca wiernych prawosławnych."
 lit_orthodox_third_rome: "Trzeci Rzym"
 lit_orthodox_third_rome_desc: "Teraz, gdy Konstantynopol upadł — Kijów staje się nowym centrum prawosławia, „Trzecim Rzymem”."
 lit_orthodox_unity: "Jedność kościoła prawosławnego"
 lit_orthodox_unity_desc: "Jedność wiernych prawosławnych — kościoły prawosławne całej Rusi zbierają się pod ochroną Litwy."
 lit_orthodox_tsar: "Car prawosławny"
 lit_orthodox_tsar_desc: "„Car całej Rusi” — monarcha litewski, łączący władzę prawosławną z rządami nad Rusią, przewyższa samą Moskwę."
 lit_romuva_maintained: "Zachowaj Romuvę"
 lit_romuva_maintained_desc: "Romuva, starożytna wiara bałtycka — wieczny płomień kapłana-żyniasa płonie na nowo, gdy Litwa stoi pod sztandarem pogańskim."
 lit_romuva_sanctuary: "Wznieś sanktuarium"
 lit_romuva_sanctuary_desc: "Święte gaje Litwy — chroń sanktuaria Romuvy i ustanów duchowe centrum wiary bałtyckiej."
 lit_romuva_expansion: "Ekspansja pogańska"
 lit_romuva_expansion_desc: "Rozprzestrzeniaj Romuvę mieczem — nawracaj otaczających prawosławnych, katolików i muzułmanów na Romuvę i wznieś „wielkie państwo pogańskie”."
 lit_romuva_pagan_king: "Król pogański"
 lit_romuva_pagan_king_desc: "„Wielki król pogański” — narodził się litewski monarcha pogański, który podniósł płomień Romuvy i rządzi od Bałtyku po step."
 lit_vilnius_capital: "Rozwój Wilna"
 lit_vilnius_capital_desc: "Wilno — złote miasto Litwy. Rozwiń jego pałace, katedrę i rynki i nadaj mu wspaniałość, godną stolicy imperialnej."
 lit_amber_road: "Szlak bursztynowy"
 lit_amber_road_desc: "Szlak bursztynowy — zajmij ten szlak handlowy, którym bałtycki bursztyn niesiony jest ku Morzu Śródziemnemu, i uczyń Litwę węzłem handlu europejskiego."
 lit_grand_duchy_law: "Statut Litewski"
 lit_grand_duchy_law_desc: "Statut Litewski — wydany w 1529 roku jako najbardziej zaawansowany kodeks praw Europy Środkowej, zmodernizuj rządy Litwy."
 lit_krakow: "Rozwój Krakowa"
 lit_krakow_desc: "Kraków — rozwiń to miasto jagiellońskiego blasku i pozwól mu jaśnieć drugą stolicą Polsko-Litewskiej republiki szlacheckiej."
 lit_red_ruthenia: "Podbój Rusi Czerwonej"
 lit_red_ruthenia_desc: "Ruś Czerwona i Halicz — sporne przez Polskę i Węgry, zajmij tę ziemię dla Litwy i rozszerz jej terytorium aż do Karpat."
 lit_moldavia: "Podporządkowanie Mołdawii"
 lit_moldavia_desc: "Mołdawia — księstwo rumuńskie nad Dunajem. Podporządkuj to państwo i ustanów przyczółek na Bałkanach."
 lit_grand_empire: "Litewskie wielkie imperium"
 lit_grand_empire_desc: "„Od Bałtyku po Morze Czarne” — marzenie wielkiego księcia Witolda spełnione. Wielkie Księstwo Litewskie rządzi największym imperium Europy."
 lit_events.5.t: "Wybór wiary"
 lit_events.5.d: "Litwa stoi na rozdrożu. Nawrócić się na katolicyzm i pogłębić unię z Polską? Bronić prawosławia i stać się obrońcą Rusi? Czy zachować odziedziczoną wiarę Romuvy i stać się wielkim królem pogańskim?"
 lit_events.5.a: "Nawrócić się na katolicyzm — dołączyć do chrześcijaństwa i pogłębić sojusz polski"
 lit_events.5.b: "Wybrać prawosławie — stać się obrońcą Rusi i chrześcijaństwa wschodniego"
 lit_events.5.c: "Zachować Romuvę — nigdy nie pozwolić zgasnąć świętemu płomieniowi żyniasa"
 lit_events.10.t: "Podbój Kijowa"
 lit_events.10.d: "Kijów — matka wszystkich miast ruskich — upadł Litwie. Nie Moskwa, lecz Litwa niesie teraz dziedzictwo Rusi Kijowskiej."
 lit_events.10.a: "Chwała Kijowowi! Chwała obrońcy całej Rusi!"
 lit_events.15.t: "Król katolicki"
 lit_events.15.d: "Pod uznaniem papieskim koronowany został król katolicki Litwy i Polski — Litwa jest teraz formalnie częścią świata katolickiego."
 lit_events.15.a: "Chwała królowi katolickiemu! Niech królestwo trwa na wieki!"
 lit_events.16.t: "Car Litwy"
 lit_events.16.d: "Władca Litwy ogłasza się „Carem całej Rusi” — obrońcą wiary prawosławnej. Nie Moskwa, lecz Wilno musi być Trzecim Rzymem."
 lit_events.16.a: "Chwała carowi! Chwała Trzeciemu Rzymowi!"
 lit_events.17.t: "Król pogański"
 lit_events.17.d: "Wieczny płomień żyniasa płonie jasno — „Wielki król pogański” wstąpił pod sztandarem Romuvy i rządzi od Bałtyku po step."
 lit_events.17.a: "Chwała królowi pogańskiemu! Niech płomień Romuvy płonie wiecznie!"
 lit_events.20.t: "Upadek Zakonu Krzyżackiego"
 lit_events.20.d: "Od Grunwaldu po ostatni rozrachunek — Zakon Krzyżacki wreszcie upadł. Bałtyk należy do Litwy."
 lit_events.20.a: "Zakon Krzyżacki pokonany! Bałtyk nasz!"
 lit_events.99.t: "Litewskie wielkie imperium"
 lit_events.99.d: "Od Bałtyku po Morze Czarne — marzenie Witolda spełnione. Litwa rządzi największym imperium Europy Wschodniej, przewyższając nawet starożytną Ruś."
 lit_events.99.a: "Chwała litewskiemu wielkiemu imperium! Wieczna chwała!"
 STATIC_MODIFIER_NAME_lit_amber_mod: "Panowanie nad szlakiem bursztynowym"
 STATIC_MODIFIER_DESC_lit_amber_mod: "Bałtycki handel bursztynem podwaja bogactwo Litwy."
 STATIC_MODIFIER_NAME_lit_bishopric_mod: "Organizacja biskupstw"
 STATIC_MODIFIER_DESC_lit_bishopric_mod: "Struktura Kościoła katolickiego na Litwie ustanowiona, a wiara zapuściła głębokie korzenie."
 STATIC_MODIFIER_NAME_lit_black_sea_mod: "Panowanie nad Morzem Czarnym"
 STATIC_MODIFIER_DESC_lit_black_sea_mod: "Morze Czarne stało się morzem wewnętrznym Litwy, przynosząc ogromny strumień dochodu handlowego."
 STATIC_MODIFIER_NAME_lit_catholic_king_mod: "Władza króla katolickiego"
 STATIC_MODIFIER_DESC_lit_catholic_king_mod: "Uznana w całej Europie królem katolickim, władza dyplomatyczna Litwy ustanowiona."
 STATIC_MODIFIER_NAME_lit_catholic_mod: "Chrzest w katolicyzmie"
 STATIC_MODIFIER_DESC_lit_catholic_mod: "Litwa nawróciła się na katolicyzm i stała się częścią chrześcijaństwa europejskiego."
 STATIC_MODIFIER_NAME_lit_crimea_mod: "Podporządkowanie Krymu"
 STATIC_MODIFIER_DESC_lit_crimea_mod: "Półwysep Krymski wpadł pod kontrolę litewską, otwierając wrota do Morza Czarnego."
 STATIC_MODIFIER_NAME_lit_crusade_mod: "Duch krucjaty"
 STATIC_MODIFIER_DESC_lit_crusade_mod: "Duch krucjaty katolickiej wykuł armię litewską."
 STATIC_MODIFIER_NAME_lit_dynasty_mod: "Przebudzenie dynastii Giedyminowiczów"
 STATIC_MODIFIER_DESC_lit_dynasty_mod: "Krew Giedyminowiczów rozpala ambicje podbicia Europy Wschodniej."
 STATIC_MODIFIER_NAME_lit_grand_empire_mod: "Ukończenie litewskiego wielkiego imperium"
 STATIC_MODIFIER_DESC_lit_grand_empire_mod: "Od Bałtyku po Morze Czarne — marzenie wielkiego księcia Witolda spełnione."
 STATIC_MODIFIER_NAME_lit_jagiellonian_mod: "Rządy dynastii Jagiellonów"
 STATIC_MODIFIER_DESC_lit_jagiellonian_mod: "Dynastia Jagiellonów wznosi się największym domem królewskim Europy Środkowej."
 STATIC_MODIFIER_NAME_lit_jogaila_mod: "Unia Jagiełły"
 STATIC_MODIFIER_DESC_lit_jogaila_mod: "Woskowa pieczęć na Unii w Krewie całkowicie zmieniła szacunek okazywany litewskim posłom na dworze polskim."
 STATIC_MODIFIER_NAME_lit_krakow_mod: "Dobrobyt Krakowa"
 STATIC_MODIFIER_DESC_lit_krakow_mod: "Kraków jaśnieje miastem jagiellońskiego blasku."
 STATIC_MODIFIER_NAME_lit_livonia_mod: "Panowanie nad Inflantami"
 STATIC_MODIFIER_DESC_lit_livonia_mod: "Inflanty, serce handlu bałtyckiego, są teraz pod sztandarem litewskim."
 STATIC_MODIFIER_NAME_lit_moldavia_mod: "Podporządkowanie Mołdawii"
 STATIC_MODIFIER_DESC_lit_moldavia_mod: "Mołdawia, będąc wasalem litewskim, staje się przyczółkiem do Bałkanów."
 STATIC_MODIFIER_NAME_lit_orthodox_mod: "Ochrona kościoła prawosławnego"
 STATIC_MODIFIER_DESC_lit_orthodox_mod: "Litwa wzięła kościół prawosławny pod swoją ochronę i uznana jest obrońcą Rusi."
 STATIC_MODIFIER_NAME_lit_orthodox_tsar_mod: "Car prawosławny"
 STATIC_MODIFIER_DESC_lit_orthodox_tsar_mod: "Jako car całej Rusi Litwa rządzi przywódcą świata prawosławnego."
 STATIC_MODIFIER_NAME_lit_orthodox_unity_mod: "Jedność kościoła prawosławnego"
 STATIC_MODIFIER_DESC_lit_orthodox_unity_mod: "Kościoły prawosławne całej Rusi zebrały się pod litewskim sztandarem."
 STATIC_MODIFIER_NAME_lit_pagan_empire_mod: "Hegemonia Wielkiego króla pogańskiego"
 STATIC_MODIFIER_DESC_lit_pagan_empire_mod: "Pod sztandarem Romuvy król pogański rządzi od Bałtyku po step."
 STATIC_MODIFIER_NAME_lit_pagan_expansion_mod: "Ekspansja pogańska"
 STATIC_MODIFIER_DESC_lit_pagan_expansion_mod: "Pod sztandarem pogańskim armia litewska przetacza się przez sąsiednie państwa."
 STATIC_MODIFIER_NAME_lit_red_ruthenia_mod: "Podbój Rusi Czerwonej"
 STATIC_MODIFIER_DESC_lit_red_ruthenia_mod: "Ruś Czerwona i Halicz dołączyły do rządów Litwy."
 STATIC_MODIFIER_NAME_lit_romuva_mod: "Odrodzenie Romuvy"
 STATIC_MODIFIER_DESC_lit_romuva_mod: "Romuva, starożytna wiara bałtycka, odrodzona, a Litwa stoi państwem pogańskim."
 STATIC_MODIFIER_NAME_lit_rus_mod: "Władca Rusi"
 STATIC_MODIFIER_DESC_lit_rus_mod: "Litwa stała się władcą całej Rusi i przywódcą Europy Wschodniej."
 STATIC_MODIFIER_NAME_lit_ruthenia_mod: "Podporządkowanie Rusi Czarnej"
 STATIC_MODIFIER_DESC_lit_ruthenia_mod: "Ruś Czarna dołączyła do rządów Litwy, ustanawiając podstawę dla ekspansji wschodniej."
 STATIC_MODIFIER_NAME_lit_sanctuary_mod: "Ustanowienie sanktuarium Romuvy"
 STATIC_MODIFIER_DESC_lit_sanctuary_mod: "Święte gaje Litwy ustanowione, a płomień pogański płonie jasno."
 STATIC_MODIFIER_NAME_lit_sejm_mod: "Ustanowienie sejmu"
 STATIC_MODIFIER_DESC_lit_sejm_mod: "Sejm ustanowiony i modernizuje rządy Litwy."
 STATIC_MODIFIER_NAME_lit_smolensk_mod: "Panowanie nad Smoleńskiem"
 STATIC_MODIFIER_DESC_lit_smolensk_mod: "Smoleńsk działa jako wschodnie wrota Litwy."
 STATIC_MODIFIER_NAME_lit_steppe_mod: "Ustanowienie granicy stepowej"
 STATIC_MODIFIER_DESC_lit_steppe_mod: "Granica stepowa ustanowiona i powstrzymuje najazdy tatarskie."
 STATIC_MODIFIER_NAME_lit_teutonic_mod: "Opór przeciw Zakonowi Krzyżackiemu"
 STATIC_MODIFIER_DESC_lit_teutonic_mod: "Zagrożenie ze strony Zakonu Krzyżackiego wykuło armię litewską."
 STATIC_MODIFIER_NAME_lit_third_rome_mod: "Trzeci Rzym"
 STATIC_MODIFIER_DESC_lit_third_rome_mod: "Kijów stał się „Trzecim Rzymem”, centrum kościoła prawosławnego."
 STATIC_MODIFIER_NAME_lit_volhynia_mod: "Podbój Wołynia i Podola"
 STATIC_MODIFIER_DESC_lit_volhynia_mod: "Równiny Zachodniej Ukrainy zabarwione litewskim sztandarem."
 lit_vilnius_jerusalem: "Jerozolima Północy"
 lit_vilnius_jerusalem_desc: "Wilno — „Jerozolima Północy”. Sztuka i ludność płyną do tego miasta, gdzie współistnieją różnorodne religie i kultury, a ono jaśnieje centrum kulturalnym Litwy w Europie."
 STATIC_MODIFIER_NAME_lit_vilnius_jerusalem_mod: "Jerozolima Północy"
 STATIC_MODIFIER_DESC_lit_vilnius_jerusalem_mod: "Wilno staje się „Jerozolimą Północy” — centrum różnorodnych narodów, religii i kultur."
 STATIC_MODIFIER_NAME_lit_teutonic_victory_mod: "Klęska Zakonu Krzyżackiego"
 STATIC_MODIFIER_DESC_lit_teutonic_victory_mod: "Czarno-krzyżowy sztandar Malborka opuszczony, a litewscy żołnierze maszerują na zachód z pieśniami zwycięstwa."
 STATIC_MODIFIER_NAME_lit_vilnius_capital_mod: "Wilno rozwinięte"
 STATIC_MODIFIER_DESC_lit_vilnius_capital_mod: "Od Wieży Giedymina w Wilnie dachy i mury stolicy imperialnej rozciągają się, jak okiem sięgnąć."
 lit_memel: "Kłajpeda — brama do Bałtyku"
 lit_memel_desc: "Kłajpeda (Memel) — miasto portowe na wybrzeżu bałtyckim. Odzyskane od Zakonu Krzyżackiego, rozwiń to miasto bramą Litwy do morza i centrum handlu bursztynem."
 STATIC_MODIFIER_NAME_lit_memel_mod: "Port Kłajpeda rozwinięty"
 STATIC_MODIFIER_DESC_lit_memel_mod: "Port Kłajpeda rozwinięty bramą handlu bałtyckiego."
 STATIC_MODIFIER_NAME_lit_lublin_union_mod: "Korzyści Unii Lubelskiej"
 STATIC_MODIFIER_DESC_lit_lublin_union_mod: "System parlamentarny i zarządzanie republiki szlacheckiej ustanowione."
 lit_lublin_dev: "Rozwój Lublina"
 lit_lublin_dev_desc: "Lublin — przyszłe miejsce Unii Lubelskiej. Rozwiń to miasto centrum administracyjnym i handlowym południowej Litwy."
 lit_lviv_dev: "Rozwój Lwowa"
 lit_lviv_dev_desc: "Lwów — skrzyżowanie handlu wschodniego. Rozwiń centrum Halicza i wspieraj dobrobyt południowego wschodu królestwa."
 lit_kaunas_dev: "Kowno — strażnik prawa litewskiego"
 lit_kaunas_dev_desc: "Kowno (Kaunas) — położone u zbiegu Niemna i Wilii, to miasto służyło jako siedziba Trybunału Głównego Wielkiego Księstwa Litewskiego (Lietuvos Vyriausiasis Tribunolas) i działało jako najwyższa instancja apelacyjna dla litewskiej strony republiki szlacheckiej. Podobnie jak dwór królewski w Krakowie w Polsce czy Parlament Aix w Prowansji, Kowno służyło jako strażnik prawa regionalnego, łączącego ustawodawstwo centralne z lokalnym zwyczajem. Rozwiń Kowno centrum litewskiego zarządzania prawnego."
 lit_hrodna_dev: "Rozwój Grodna"
 lit_hrodna_dev_desc: "Grodno (Hrodna) — centrum Rusi Czarnej. Rozwiń to ważne zachodnie miasto Wielkiego Księstwa."
 lit_minsk_dev: "Rozwój Mińska"
 lit_minsk_dev_desc: "Mińsk — centrum Białorusi. Rozwiń go wschodnim węzłem administracyjnym imperium litewskiego."
 STATIC_MODIFIER_NAME_lit_commonwealth_final_mod: "Republika szlachecka ukończona"
 STATIC_MODIFIER_DESC_lit_commonwealth_final_mod: "Polsko-Litewska republika szlachecka ukończona — zarządzanie i wojsko zorganizowane we wszystkich prowincjach."
 STATIC_MODIFIER_NAME_lit_lublin_mod: "Lublin prosperuje"
 STATIC_MODIFIER_DESC_lit_lublin_mod: "Lublin rozwinięty centrum administracyjnym i handlowym południowej Litwy."
 STATIC_MODIFIER_NAME_lit_lviv_mod: "Lwów prosperuje"
 STATIC_MODIFIER_DESC_lit_lviv_mod: "Lwów prosperuje skrzyżowaniem handlu wschodniego."
 STATIC_MODIFIER_NAME_lit_kaunas_mod: "Trybunał Główny Wielkiego Księstwa Litewskiego"
 STATIC_MODIFIER_DESC_lit_kaunas_mod: "Kowno rozwinięte wewnętrznym węzłem handlu bałtyckiego."
