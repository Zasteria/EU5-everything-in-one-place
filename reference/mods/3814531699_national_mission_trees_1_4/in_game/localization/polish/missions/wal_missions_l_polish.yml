l_polish:
 wal_wallachia_mission_pack: "Zakon Smoka — Strażnik Dunaju"
 wal_wallachia_mission_pack_DESCRIPTION:0 "Wołoszczyzna, zaklinowana między Karpatami a Dunajem. Ujarzmij szlachtę bojarską i zjednocz księstwa rumuńskie wraz z Mołdawią i Siedmiogrodem, albo podnieś sztandar Zakonu Smoka i wypowiedz wojnę Imperium Osmańskiemu, by zbudować imperium dunajskie."
 wal_wallachia_mission_pack_CRITERIA_DESCRIPTION:0 "Wzmocnij wojewodztwo, zjednocz księstwa rumuńskie i pokonaj Imperium Osmańskie, by dopełnić imperium dunajskie."
 wal_wallachia_mission_pack_BUTTON_TOOLTIP:0 "Kontynuuj wolę Palownika i zostań strażnikiem Dunaju."
 wal_wallachia_mission_pack_BUTTON_DETAILS:0 "„Jesteśmy dziećmi Smoka” — wilki Karpat, podnieście krzyż!"
 wal_voivode_beginnings: "Świt wojewodztwa"
 wal_voivode_beginnings_desc: "W 1330 roku Basarab I odparł króla Węgier w bitwie pod Posadą — odziedzicz jego ducha niepodległości i połóż fundamenty pod nowe księstwo między Karpatami a Dunajem."
 wal_voivode_authority: "Władza wojewody"
 wal_voivode_authority_desc: "Tron wojewody, wybierany przez aklamację szlachty bojarskiej — zabezpiecz tę władzę i zapobiegnij chaosowi spornej sukcesji."
 wal_boyar_council: "Rada Bojarów"
 wal_boyar_council_desc: "Zgromadzenie wielkich bojarów-posiadaczy ziemskich — bez ich poparcia Wołoszczyzna nie może być rządzona. Ustabilizuj stosunki z radą."
 wal_found_bucharest: "Załóż Bukareszt"
 wal_found_bucharest_desc: "Giurgiu, w pobliżu Dunaju — gdzie wojewoda trzymał swój letni dwór. Rozwiń to miejsce jako „Bucureşti”, bastion południowej obrony i handlu."
 wal_targoviste_dev: "Rozwiń Târgovişte"
 wal_targoviste_dev_desc: "Târgovişte, dawna stolica zbudowana u podnóża Karpat, siedziba pokoleń wojewodów — przynieś temu miastu dalszy dobrobyt."
 wal_fortify_carpathians: "Umocnij Karpaty"
 wal_fortify_carpathians_desc: "Góry Karpackie, rozciągające się z południa na północ — nałóż na ten naturalny wał twierdze dzieła rąk ludzkich, budując linię obrony, której żaden najeźdźca nie przełamie."
 wal_orthodox_church: "Chroń Kościół Prawosławny"
 wal_orthodox_church_desc: "Kościół Prawosławny, dziedzic wiary bizantyjskiej — stań na czele jego autokefalicznego patriarchatu i użycz religijnej legitymizacji władzy wojewody."
 wal_dregatori: "Mianuj Dregatori"
 wal_dregatori_desc: "Tyrania dziedzicznych szlachciców jest wrogiem państwa. Mianuj „dregatori” — urzędników wybieranych za umiejętności, a nie za pochodzenie — i zbuduj administrację lojalną koronie."
 wal_unite_voivodes: "Zjednocz wojewodów"
 wal_unite_voivodes_desc: "Wołoszczyzna i Mołdawia — dwa księstwa rumuńskie, a jednak wciąż podzielone, ich rywalizacja służy tylko naszym wrogom. Każda potęga, dzierżąca przyczółek w Mołdawii, może teraz zgłosić prawowite roszczenie do całej tej ziemi."
 wal_subdue_moldavia: "Podporządkuj Mołdawię"
 wal_subdue_moldavia_desc: "Chwała Stefana Wielkiego należy teraz do przeszłości — przywiedź Księstwo Mołdawii pod rządy wołoskie i połóż kamień węgielny jedności rumuńskiej."
 wal_conquer_transylvania: "Podbij Siedmiogród"
 wal_conquer_transylvania_desc: "Siedmiogród, długo rządzony przez królów Węgier i ich następców — przywiedź tę ziemię w domenę Wołoszczyzny i połóż kres obcej ingerencji."
 wal_szekely_land: "Ziemia Székelyów"
 wal_szekely_land_desc: "Székelyowie, lud wojowników wschodniego Siedmiogrodu — szanuj ich autonomię i tradycję wojenną i uczyń ich waleczność siłą Wołoszczyzny."
 wal_saxon_towns: "Włącz miasta saskie"
 wal_saxon_towns_desc: "Braszów, Sybin i inne saskie miasta Siedmiogrodu — uczyń te miasta, prosperujące od czasów średniowiecznych, filarem gospodarki królestwa."
 wal_secure_danube: "Zabezpiecz Dunaj"
 wal_secure_danube_desc: "Wielka rzeka Dunaj, dzieląca Bałkany od Karpat — zabezpiecz jej brzegi jako linię życia południowej obrony i handlu."
 wal_carpathian_hegemony: "Hegemonia karpacka ukończona"
 wal_carpathian_hegemony_desc: "Nadszedł czas, by cała ziemia między Karpatami a Dunajem poddała się władzy wojewody."
 wal_romanian_unity: "Jedność rumuńska ukończona"
 wal_romanian_unity_desc: "Wołoszczyzna, Mołdawia, Siedmiogród — zjednocz wreszcie od dawna podzielone ziemie narodu rumuńskiego pod jedną koroną."
 wal_order_of_dragon_founding: "Dołącz do Zakonu Smoka"
 wal_order_of_dragon_founding_desc: "Cesarz Świętego Cesarstwa Rzymskiego Zygmunt zakłada Zakon Smoka na ideale krucjaty przeciw Osmanom — niech nasz własny władca zajmie miejsce wśród tego znakomitego bractwa."
 wal_impale_the_sultan: "Nadziej sułtana"
 wal_impale_the_sultan_desc: "Sułtan uważa się za bezpiecznego, ukrywając się za swymi murami i swymi legionami. Na polu bitwy przeciw armiom islamu niech pozna na własnym ciele, że nikt nie może się ukryć przed sądem Bożym."
 wal_drive_out_turks: "Wypędź Turków"
 wal_drive_out_turks_desc: "Nadszedł czas, by wyzwolić narody greckie i bułgarskie od ucisku. Zepchnij tureckich najeźdźców z powrotem na daleki brzeg Bosforu."
 wal_liberate_serbia: "Wyzwól Serbię"
 wal_liberate_serbia_desc: "Nasi bracia Serbowie, cierpiący pod jarzmem osmańskim od klęski na Kosowym Polu — wyzwól ich i zostań strażnikiem prawosławnych Bałkanów."
 wal_reclaim_morea: "Odzyskaj Moreę"
 wal_reclaim_morea_desc: "Despotat Morei, gdzie niegdyś płonęło ostatnie światło Bizancjum — odzyskaj ten zakątek Peloponezu z rąk niewiernych."
 wal_heir_of_rome: "Dziedzic Rzymu"
 wal_heir_of_rome_desc: "To, czego Cesarstwo Bizantyjskie nigdy nie osiągnęło — całkowita klęska i wypędzenie niewiernych z Europy — my dokonaliśmy. Nikt nie jest bardziej godzien płaszcza Rzymu niż my."
 wal_bulwark_of_christendom: "Przedmurze chrześcijaństwa"
 wal_bulwark_of_christendom_desc: "Księstwa rumuńskie są przedmurzem chrześcijaństwa. Umacnianie naszych granic jest naszym obowiązkiem przed Bogiem."
 wal_ottoman_downfall: "Upadek Osmanów"
 wal_ottoman_downfall_desc: "Imperium Osmańskie, niegdyś dominujące na Bałkanach i Bliskim Wschodzie — jego zagrożenie zostało wreszcie skazane na karty historii."
 wal_reclaim_constantinople: "Odzyskaj Konstantynopol"
 wal_reclaim_constantinople_desc: "Konstantynopol, od dawna upadły w ręce niewiernych — jako dziedzice Zakonu Smoka wyzwól to miasto imperialne."
 wal_danubian_empire: "Imperium Dunajskie ukończone"
 wal_danubian_empire_desc: "Od Karpat po Bałkany i dalej po Bosfor — ta walka, rozpoczęta zemstą Palownika, kończy się dopełnieniem wielkiego imperium, rządzącego Dunajem."
 wal_danube_trade: "Szlak handlowy Dunaju"
 wal_danube_trade_desc: "Szlak handlowy, łączący Europę Zachodnią i Morze Czarne wzdłuż Dunaju — przyciągnij ten strumień bogactwa do skarbca Wołoszczyzny."
 wal_treasury: "Zbuduj skarbiec"
 wal_treasury_desc: "Wojna, dyplomacja, utrzymanie dworu — każda sprawa państwa wymaga złota. Zbuduj pełny skarbiec i przygotuj się na każdą trudność."
 wal_manufactories: "Rozwiń manufaktury"
 wal_manufactories_desc: "Wielka przemiana postępuje na polu produkcji — inwestuj bez wahania w manufaktury i przygotuj się na erę przemysłu."
 wal_events.2.t: "Konstantynopol odzyskany"
 wal_events.2.d: "Wielkie miasto imperialne Konstantynopol wreszcie wpadło w nasze ręce. Sztandar Zakonu Smoka powiewa teraz nad tym miastem, niegdyś dzierżonym przez niewiernych."
 wal_events.2.a: "Miasto Rzym jest nasze!"
 wal_events.99.t: "Proklamacja Imperium Dunajskiego"
 wal_events.99.d: "Małe księstwo u podnóża Karpat odrodziło się wielkim imperium, rządzącym Dunajem i Bałkanami. Wola Palownika została wreszcie w pełni urzeczywistniona."
 wal_events.99.a: "Chwała Imperium Dunajskiemu!"
 STATIC_MODIFIER_NAME_wal_voivode_beginnings_mod: "Świt wojewodztwa"
 STATIC_MODIFIER_DESC_wal_voivode_beginnings_mod: "Pamięć dnia, gdy Basarab I odmówił uklęknięcia przed obcym suzerenem, jest dumą żołnierzy Wołoszczyzny."
 STATIC_MODIFIER_NAME_wal_voivode_mod: "Władza wojewody"
 STATIC_MODIFIER_DESC_wal_voivode_mod: "Tron wojewody jest stabilny, a zaufanie do sukcesji wzrosło."
 STATIC_MODIFIER_NAME_wal_boyar_mod: "Rada Bojarów"
 STATIC_MODIFIER_DESC_wal_boyar_mod: "Stosunki ze szlachtą bojarską są stabilne, wzmacniając fundament rządzenia."
 STATIC_MODIFIER_NAME_wal_bucharest_mod: "Bukareszt założony"
 STATIC_MODIFIER_DESC_wal_bucharest_mod: "Giurgiu rozwinięte jako „Bucureşti”, bastion południa."
 STATIC_MODIFIER_NAME_wal_targoviste_mod: "Târgovişte rozwinięte"
 STATIC_MODIFIER_DESC_wal_targoviste_mod: "Dawna stolica Târgovişte nadal prosperuje."
 STATIC_MODIFIER_NAME_wal_carpathians_mod: "Karpacka sieć twierdz"
 STATIC_MODIFIER_DESC_wal_carpathians_mod: "Sieć twierdz w górach odpiera każdego najeźdźcę."
 STATIC_MODIFIER_NAME_wal_church_mod: "Ochrona Kościoła Prawosławnego"
 STATIC_MODIFIER_DESC_wal_church_mod: "Wołoski Kościół Prawosławny stoi pod ochroną państwa, podnosząc legitymizację religijną."
 STATIC_MODIFIER_NAME_wal_impale_mod: "Nadziej sułtana"
 STATIC_MODIFIER_DESC_wal_impale_mod: "Pogłoska o rzędzie pali, ustawionych przed posłami sułtana, wciąż mrozi serca armii islamu."
 STATIC_MODIFIER_NAME_wal_dregatori_mod: "Dregatori mianowani"
 STATIC_MODIFIER_DESC_wal_dregatori_mod: "Urzędnicy wybrani za umiejętności podtrzymują teraz lojalną administrację."
 STATIC_MODIFIER_NAME_wal_moldavia_mod: "Mołdawia podporządkowana"
 STATIC_MODIFIER_DESC_wal_moldavia_mod: "Księstwo Mołdawii przywiedzione pod rządy wołoskie."
 STATIC_MODIFIER_NAME_wal_transylvania_mod: "Siedmiogród podbity"
 STATIC_MODIFIER_DESC_wal_transylvania_mod: "Siedmiogród przywiedziony w domenę Wołoszczyzny."
 STATIC_MODIFIER_NAME_wal_szekely_mod: "Waleczność Székelyów"
 STATIC_MODIFIER_DESC_wal_szekely_mod: "Górscy wojownicy z ziem Székelyów ustawiają swe włócznie w szeregu pod sztandarami Wołoszczyzny."
 STATIC_MODIFIER_NAME_wal_saxon_mod: "Dobrobyt miast saskich"
 STATIC_MODIFIER_DESC_wal_saxon_mod: "Saskie miasta Siedmiogrodu stały się filarem gospodarki królestwa."
 STATIC_MODIFIER_NAME_wal_danube_mod: "Dunaj zabezpieczony"
 STATIC_MODIFIER_DESC_wal_danube_mod: "Brzegi Dunaju zabezpieczone, otwierając linię życia handlu."
 STATIC_MODIFIER_NAME_wal_hegemony_mod: "Hegemonia karpacka"
 STATIC_MODIFIER_DESC_wal_hegemony_mod: "Ziemia między Karpatami a Dunajem w pełni poddaje się władzy wojewody."
 STATIC_MODIFIER_NAME_wal_unity_mod: "Jedność rumuńska"
 STATIC_MODIFIER_DESC_wal_unity_mod: "Wołoszczyzna, Mołdawia i Siedmiogród zjednoczone pod jedną koroną."
 STATIC_MODIFIER_NAME_wal_order_of_dragon_mod: "Członek Zakonu Smoka"
 STATIC_MODIFIER_DESC_wal_order_of_dragon_mod: "Posłowie, noszący odznakę Zakonu Smoka, podróżują po dworach chrześcijaństwa, poszerzając krąg sojuszu przeciw Osmanom."
 STATIC_MODIFIER_NAME_wal_drive_out_mod: "Turcy wypędzeni"
 STATIC_MODIFIER_DESC_wal_drive_out_mod: "Wojna przeciw niewiernym dowiodła siły naszej armii."
 STATIC_MODIFIER_NAME_wal_serbia_mod: "Serbia wyzwolona"
 STATIC_MODIFIER_DESC_wal_serbia_mod: "Nasi bracia Serbowie uwolnieni, podnosząc naszą pozycję w prawosławnych Bałkanach."
 STATIC_MODIFIER_NAME_wal_morea_mod: "Morea odzyskana"
 STATIC_MODIFIER_DESC_wal_morea_mod: "Ładunki wina i jedwabiu z portów Peloponezu napełniają magazyny kupców wołoskich."
 STATIC_MODIFIER_NAME_wal_heir_of_rome_mod: "Dziedzic Rzymu"
 STATIC_MODIFIER_DESC_wal_heir_of_rome_mod: "Na dworze wołoskim, który zgłasza sukcesję po cesarzach bizantyjskich, duchowni i szlachta jednakowo pochylają głowy, nie wątpiąc w jego legitymizację."
 STATIC_MODIFIER_NAME_wal_bulwark_mod: "Przedmurze chrześcijaństwa"
 STATIC_MODIFIER_DESC_wal_bulwark_mod: "Sieć twierdz granicznych służy teraz jako tarcza dla chrześcijaństwa."
 STATIC_MODIFIER_NAME_wal_downfall_mod: "Upadek Osmanów"
 STATIC_MODIFIER_DESC_wal_downfall_mod: "Na granicach, nie nawiedzanych już przez najazdy osmańskie, żołnierze z dumą pokazują sobie nawzajem musztrę, którą wyszlifowali."
 STATIC_MODIFIER_NAME_wal_manufactories_mod: "Manufaktury rozwinięte"
 STATIC_MODIFIER_DESC_wal_manufactories_mod: "Z kominów warsztatów Bukaresztu unosi się nieustanny dym nowego sukna i narzędzi w produkcji."
 STATIC_MODIFIER_NAME_wal_trade_mod: "Szlak handlowy Dunaju"
 STATIC_MODIFIER_DESC_wal_trade_mod: "Sieć handlowa wzdłuż Dunaju chroni bogactwo państwa."
 STATIC_MODIFIER_NAME_wal_treasury_mod: "Pełny skarbiec"
 STATIC_MODIFIER_DESC_wal_treasury_mod: "Skrzynie srebrnych monet piętrzą się w skarbcach pałacowych, a kupcy handlują, nie wątpiąc w wagę monety."
 STATIC_MODIFIER_NAME_wal_danubian_empire_mod: "Sieć rządów Imperium Dunajskiego"
 STATIC_MODIFIER_DESC_wal_danubian_empire_mod: "Sam Dunaj stał się krwią życia imperium, jego wody niosą armie w górę i w dół z łatwością. Legitymizacja dynastii stoi niewzruszona, a potęga korony sięga do każdego zakątka królestwa."
