l_polish:
 nav_crown_mission_pack: "Dziedzictwo Królestwa Nawarry"
 nav_crown_mission_pack_DESCRIPTION:0 "Zakorzenione u podnóża Pirenejów, baskijskie Królestwo Nawarry jest małą potęgą, osaczoną przez trzy wielkie królestwa Kastylii, Aragonii i Francji. A jednak jego linia krwi płynie przez domy królewskie zarówno Francji, jak i Aragonii, a gdy koła historii się zgrają, nieoczekiwana ścieżka ku wielkości może się jeszcze przed nim otworzyć. Czy wykujesz jedność baskijską, pchniesz się poza Gaskonię, by zainterweniować we Francji, czy zdobędziesz dominację nad Półwyspem Iberyjskim? Los tego małego królestwa spoczywa w rękach jego króla."
 nav_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Ukończ misje jako Królestwo Nawarry i ustanów jedność baskijską wraz z wpływem nad Iberią i Francją."
 nav_crown_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by pójść drogą dziedzictwa Królestwa Nawarry."
 nav_crown_mission_pack_BUTTON_DETAILS:0 "Wykuj jedność baskijską, pchnij się w Gaskonię i zgłoś roszczenie do dominacji nad Iberią!"
 nav_kingdom_of_pamplona: "Królestwo Pampeluny"
 nav_kingdom_of_pamplona_desc: "Założone przez Eneko Aristę, Królestwo Pampeluny jest starożytną linią, głęboko zakorzenioną w ziemiach baskijskich. Jednak otoczone wielkimi potęgami Kastylii, Aragonii i Francji, jego przetrwanie zawsze spoczywało na kruchej równowadze."
 nav_secure_bayonne: "Zabezpiecz Bajonnę"
 nav_secure_bayonne_desc: "Nadszedł czas, by zjednoczyć naszych rodaków za morzem, francuskich Basków z Bajonny, pod naszą koroną. Wszyscy Baskowie muszą pewnego dnia zgromadzić się pod jednym sztandarem."
 nav_basque_unity: "Jedność baskijska"
 nav_basque_unity_desc: "Lud, dzielący nasz język i obyczaje, tworzy teraz rdzeń królestwa. Być Baskiem stało się naszą największą dumą."
 nav_fueros_and_privileges: "Zagwarantuj Fueros"
 nav_fueros_and_privileges_desc: "Fueros, starożytne przywileje samorządu, od dawna dzierżone przez miasta baskijskie. W miarę jak szlachta staje się bardziej zadowolona, gwarancja tych przywilejów staje się mocną podstawą dla samej korony."
 nav_efficient_administration: "Wydajna administracja"
 nav_efficient_administration_desc: "Kantory rachunkowe, założone po całym królestwie, wzmacniają nasze podstawy fiskalne. Dla małego królestwa efektywność rządzenia jest liną ratunkową."
 nav_renaissance_of_pamplona: "Renesans Pampeluny"
 nav_renaissance_of_pamplona_desc: "Nowe wiatry nauki, wznoszące się z Włoch, dotarły nawet do podnóża Pirenejów. Jakkolwiek małe królestwo, jego duch kroczy w czołówce epoki."
 nav_intervene_hundred_years_war: "Zainterweniuj w Wojnie Stuletniej"
 nav_intervene_hundred_years_war_desc: "Długa walka między Francją a Anglią szaleje nadal. Nasza linia królewska płynie przez obie korony, a Nawarra ma zarówno prawo, jak i okazję, by zainterweniować jako trzecia potęga."
 nav_foothold_in_france: "Przyczółek we Francji"
 nav_foothold_in_france_desc: "Wykorzystując chaos Wojny Stuletniej, zabezpiecz część ziemi francuskiej. To rozszerza zasięg królestwa daleko w serce południowo-zachodniej Francji."
 nav_secure_gascony: "Zabezpiecz Gaskonię"
 nav_secure_gascony_desc: "Opanowanie ziemi Tursan i zdobycie portu Bordeaux przywodzi całą Gaskonię pod nasze rządy, otwierając bramę do Atlantyku."
 nav_claims_on_france: "Przyczółek dla korony francuskiej"
 nav_claims_on_france_desc: "Teraz, gdy rozległe terytoria wewnątrz samej Francji są zabezpieczone, ambicja, którą nasz dom żywi wobec tronu francuskiego, nie jest już zwykłym wymysłem."
 nav_house_of_evreux: "Ambicja domu Évreux"
 nav_house_of_evreux_desc: "Czy to przez unię personalną z Francją, czy całkowite zajęcie samego Paryża, legitymizacja, którą nasz dom dzierży wobec tronu francuskiego, jest teraz poza wątpliwościami."
 nav_claim_french_throne: "Zgłoś roszczenie do tronu francuskiego"
 nav_claim_french_throne_desc: "Teraz, gdy francuska linia królewska wygasła, nasz dom stoi jako prawowity dziedzic jej korony. Nadszedł czas, by dwie korony, Nawarry i Francji, spoczęły na jednej głowie."
 nav_aragonese_inheritance: "Więzy krwi z Aragonią"
 nav_aragonese_inheritance_desc: "Nasz dom i dom królewski Aragonii dzielą tę samą krew przodków. Losy dwóch królestw mogą jeszcze zostać związane w jedno."
 nav_castilian_question: "Kwestia kastylijska"
 nav_castilian_question_desc: "Kastylia, największa potęga Półwyspu Iberyjskiego. Czy związać się z nią sojuszem, czy stanąć przeciwko niej jako rywal, natura tych stosunków musi zostać wyjaśniona."
 nav_reconquista_legacy: "Dziedzictwo Rekonkwisty"
 nav_reconquista_legacy_desc: "Pamięć wieków walki przeciw potęgom islamskim jest dumą, dzieloną przez wszystkie królestwa Iberii. Nasze królestwo również niesie swój udział w tej chwale."
 nav_dominate_iberia: "Dominacja nad Iberią"
 nav_dominate_iberia_desc: "To, co niegdyś było małym królestwem, nie może już być ignorowane na Półwyspie Iberyjskim. Korona baskijska urosła dostatecznie potężna, by kształtować los całego półwyspu."
 nav_basque_seafarers: "Rybacy baskijscy"
 nav_basque_seafarers_desc: "Lud baskijski od dawna znany jest jako nieustraszeni rybacy. Ich umiejętności i odwaga muszą teraz zostać użyte jako atut państwa."
 nav_fearless_fishermen: "Nieustraszeni żeglarze"
 nav_fearless_fishermen_desc: "Baskijscy żeglarze nie lękają się nawet szalejących mórz północnych. Ich umiejętności żeglarskie i odwaga są już znane po całym kontynencie."
 nav_transatlantic_whalers: "Wielorybnicy za Atlantykiem"
 nav_transatlantic_whalers_desc: "Statki baskijskich wielorybników, ścigających swą zdobycz, dotarły wreszcie daleko za Atlantyk. Działalność na tych nowych wodach obiecuje ogromne bogactwo dla królestwa."
 nav_basque_in_glory: "Basków w chwale"
 nav_basque_in_glory_desc: "Małe królestwo, narodzone u podnóża Pirenejów, rozkwitło w kulturze, zajęło tron Francji i rządziło zjednoczoną Iberią jako Hiszpania. Chwała Basków nie może już być przez nikogo negowana."
 STATIC_MODIFIER_NAME_nav_secure_bayonne_mod: "Doświadczenie wojskowe z Bajonny"
 STATIC_MODIFIER_DESC_nav_secure_bayonne_mod: "Włączenie Bajonny dało naszym siłom doświadczenie w bitwie."
 STATIC_MODIFIER_NAME_nav_basque_unity_mod: "Jedność baskijska"
 STATIC_MODIFIER_DESC_nav_basque_unity_mod: "Baskowie są jednym z najstarszych ludów Europy, o nieznanym pochodzeniu, mówiącym językiem niespokrewnionym z rodziną indoeuropejską. Jedność kulturowa Basków, żyjących po obu stronach Pirenejów, zachowała własną tożsamość pod rządami zarówno francuskimi, jak i hiszpańskimi."
 STATIC_MODIFIER_NAME_nav_fueros_and_privileges_mod: "Zagwarantowane Fueros"
 STATIC_MODIFIER_DESC_nav_fueros_and_privileges_mod: "Fueros (przywileje i prawo zwyczajowe) to system prawny, gwarantujący tradycyjną autonomię Nawarry i kraju Basków. Jego własne uprawnienia w zakresie opodatkowania, służby wojskowej i wymiaru sprawiedliwości zawsze były w napięciu z centralizującą koroną kastylijską. Ta swoista tradycja prawna tworzy rdzeń tożsamości Nawarry."
 STATIC_MODIFIER_NAME_nav_efficient_administration_mod: "Wydajne rządy"
 STATIC_MODIFIER_DESC_nav_efficient_administration_mod: "Królestwo Nawarry utworzyło „Cámara de Comptos”, urząd zarządzania finansami, i przyjęło system administracyjny w stylu francuskim. Wyrafinowanie administracyjne, wynikające z jego długich więzów z francuskim domem królewskim (rodzina królewska Nawarry często zawierała małżeństwa z Francuzami), odróżniało je od innych królestw Iberii."
 STATIC_MODIFIER_NAME_nav_renaissance_of_pamplona_mod: "Nowy duch Pampeluny"
 STATIC_MODIFIER_DESC_nav_renaissance_of_pamplona_mod: "Duch renesansu podniósł umiejętności artystów, nowo wstępujących w swój fach."
 STATIC_MODIFIER_NAME_nav_foothold_in_france_mod: "Przyczółek we Francji"
 STATIC_MODIFIER_DESC_nav_foothold_in_france_mod: "Królestwo Nawarry posiadało również ziemie na północ od Pirenejów, z Dolną Nawarrą (dzisiejszym francuskim krajem Basków) w ich centrum. Historycznie dom królewski Nawarry często żenił się z francuskim domem królewskim, a posiadanie przyczółka we Francji było podstawą jego dyplomacji."
 STATIC_MODIFIER_NAME_nav_secure_gascony_mod: "Korona Gaskonii"
 STATIC_MODIFIER_DESC_nav_secure_gascony_mod: "Zabezpieczenie całej Gaskonii wzmocniło wspaniałość korony."
 STATIC_MODIFIER_NAME_nav_house_of_evreux_mod: "Prestiż domu Évreux"
 STATIC_MODIFIER_DESC_nav_house_of_evreux_mod: "Mocne stosunki z francuskim domem królewskim podniosły pozycję dyplomatyczną naszego narodu."
 STATIC_MODIFIER_NAME_nav_claim_french_throne_mod: "Bliźniacze korony Nawarry i Francji"
 STATIC_MODIFIER_DESC_nav_claim_french_throne_mod: "Noszenie bliźniaczych koron Nawarry i Francji podniosło wspaniałość królestwa i stabilność jego rządów."
 STATIC_MODIFIER_NAME_nav_castilian_question_mod: "Jasne stosunki z Kastylią"
 STATIC_MODIFIER_DESC_nav_castilian_question_mod: "Wyjaśnione stosunki z Kastylią podniosły pozycję dyplomatyczną naszego narodu."
 STATIC_MODIFIER_NAME_nav_reconquista_legacy_mod: "Duma Rekonkwisty"
 STATIC_MODIFIER_DESC_nav_reconquista_legacy_mod: "Pamięć walki przeciw potęgom islamskim podniosła tolerancję wobec naszej dominującej religii."
 STATIC_MODIFIER_NAME_nav_dominate_iberia_mod: "Pan Iberii"
 STATIC_MODIFIER_DESC_nav_dominate_iberia_mod: "Dla Nawarry, małego królestwa półwyspu iberyjskiego, przewyższyć wielkie potęgi Kastylii i Aragonii i zostać panem półwyspu przywołuje marzenie, które Sancho III Wielki (panował 1000–1035) krótko urzeczywistnił. Jest to historyczny czyn, osiągalny przez pełne wykorzystanie przewagi geograficznej posiadania przełęczy pirenejskich."
 STATIC_MODIFIER_NAME_nav_basque_seafarers_mod: "Baskijska tradycja rybacka"
 STATIC_MODIFIER_DESC_nav_basque_seafarers_mod: "Wzrost wiosek rybackich stale dostarcza 5 żeglarzy każdego miesiąca."
 STATIC_MODIFIER_NAME_nav_fearless_fishermen_mod: "Morale nieustraszonych żeglarzy"
 STATIC_MODIFIER_DESC_nav_fearless_fishermen_mod: "„Baskijski żeglarz nie lęka się żadnej burzy” było powiedzeniem znanym po całej Europie. Umiejętności żeglarskie i hart ducha, wyszlifowane na wzburzonych wodach Zatoki Biskajskiej („nasze morze” dla Basków), postawiły ich w czołówce epoki atlantyckiej. Wielu żeglarzy Armady hiszpańskiej było Baskami."
 STATIC_MODIFIER_NAME_nav_transatlantic_whalers_mod: "Żeglarstwo wielorybników atlantyckich"
 STATIC_MODIFIER_DESC_nav_transatlantic_whalers_mod: "Uważa się, że baskijscy wielorybnicy polowali na walenie biskajskie u wybrzeży Labradoru w Ameryce Północnej od XV wieku. Pozostałości baskijskiej stacji wielorybniczej przetrwały w Red Bay w Kanadzie i są wpisane na Listę Światowego Dziedzictwa UNESCO. Ta pionierska działalność transatlantycka położyła podwaliny pod epokę kolonialną."
 STATIC_MODIFIER_NAME_nav_third_faction_mod: "Determinacja niezależnej trzeciej frakcji"
 STATIC_MODIFIER_DESC_nav_third_faction_mod: "Determinacja, by nie stawać po stronie żadnej z wielkich potęg, podniosła morale armii."
 STATIC_MODIFIER_NAME_nav_basque_in_glory_mod: "Basków w chwale"
 STATIC_MODIFIER_DESC_nav_basque_in_glory_mod: "Opanowawszy kulturę, dyplomację i rządzenie jednakowo, korona baskijska promieniuje teraz wspaniałością daleko przewyższającą wspaniałość małego królestwa. Dyscyplina wojskowa i siła ciężkich okrętów są również trwale wzmocnione."
 nav_events.1.t: "Początki Królestwa Pampeluny"
 nav_events.1.d: "Królestwo Nawarry jest dziedzicem Królestwa Pampeluny, założonego w IX wieku przez Eneko Aristę. Skupiona na kraju Basków, ta linia narodziła się jako marchia Imperium Karolińskiego i kontynuuje wytyczanie własnej drogi między dwoma wielkimi potęgami: światem islamskim a królestwem Franków. Teraz nadszedł czas, by ponownie wznieść jej sztandar u podnóża Pirenejów."
 nav_events.1.a: "Historia królestwa wzięta do serca"
 nav_events.2.t: "Ambicja wobec tronu francuskiego"
 nav_events.2.d: "Nasz dom, dom Évreux, dzieli krew z samym francuskim domem królewskim. Teraz, gdy rozległe terytoria wewnątrz Francji są zabezpieczone, król Nawarry może otwarcie zgłosić roszczenie do jego sukcesji. Ta legitymizacja musi teraz zostać dowiedziona, zarówno na dworze, jak i na polu bitwy."
 nav_events.2.a: "Sprawa roszczenia podniesiona"
 nav_events.3.t: "Więzy krwi z Aragonią"
 nav_events.3.d: "Domy królewskie Nawarry i Aragonii dzielą tę samą krew przodków. Nie jest wcale rzadkością, że dziedzice obu tronów są jedną i tą samą osobą. Gdyby którakolwiek linia zawiodła, dwa królestwa mogą jeszcze być przeznaczone do zjednoczenia pod jedną koroną."
 nav_events.3.a: "Znaczenie tego pokrewieństwa zrozumiane"
 nav_events.4.t: "Interwencja w Wojnie Stuletniej"
 nav_events.4.d: "Wojna Stuletnia między Francją a Anglią nie jest już prostym konfliktem między dwoma narodami. Nasz dom, dom Évreux, pochodzi z francuskiej linii Kapetyngów, jednocześnie mając głębokie więzy małżeńskie z dworem angielskim. Co więcej, sama korona nawarryjska od dawna służy jako ważny precedens w debatach o francuskim prawie sukcesji.\\n\\nW tej epoce zamętu trzy ścieżki leżą otwarte przed Nawarrą. Jedna to poparcie Francji, z racji więzów krwi i długotrwałej przyjaźni. Inna to poparcie Anglii, dla interesów handlowych i jako przedmurza przeciw Kastylii. Ostatnia to niestawanie po stronie żadnej z wielkich potęg, dążąc do własnych interesów jako niezależna trzecia frakcja. Ten wybór zaważy ciężko na losie królestwa."
 nav_events.4.a: "Poprzeć Francję"
 nav_events.4.b: "Poprzeć Anglię"
 nav_events.4.c: "Wejść w wojnę jako niezależna trzecia frakcja"
