 nov_events.1.t: "Wielki Nowogród — Wielka Republika"
 nov_events.1.d: "W 1337 roku Republika Wielki Nowogród jest największym miastem-państwem handlowym Rusi.\n\nTo miasto, rozciągające się po obu brzegach Wołchowa, dzieli się na „Stronę Sofijską” na zachodnim brzegu i „Stronę Handlową” na wschodnim brzegu. W jego centrum wznosi się symbol Nowogrodu, Sobór Świętej Zofii.\n\nWiec (zgromadzenie ludowe) działa najwyższym organem decyzyjnym, podczas gdy posadnik (burmistrz), tysiacki (dowódca pospolitego ruszenia) i arcybiskup zajmują się zarządzaniem.\n\n„Nowogród należy jedynie do Nowogrodu” — nie książę ani cesarz, lecz wola obywateli kieruje tą republiką.\n\nTu założono kantor hanzeatycki, a handel prosperuje z Lubeką, Brugią, Londynem i Bergen. Futra, wosk, len i ryby dostarczane są przez Nowogród do Europy Zachodniej.\n\nLecz Moskwa nieustannie rośnie w siłę, Litwa napiera z zachodu, a Tatarzy czyhają ze wschodu. Nowogród przetrwał, wykorzystując tę wielowarstwową równowagę sił. Teraz wykorzystaj tę mądrość i siłę kupiecką, by dążyć do panowania nad Rusią."
 nov_events.1.a: "Broń wolności i dobrobytu Nowogrodu!"
