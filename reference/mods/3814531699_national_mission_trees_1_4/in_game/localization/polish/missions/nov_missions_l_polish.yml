l_polish:
 nov_novgorod_mission_pack: "Chwała Nowogrodu — od republiki kupieckiej do władcy Rusi"
 nov_novgorod_mission_pack_DESCRIPTION:0 "W 1337 roku Republika Wielki Nowogród jest największą potęgą handlową Rusi. Wieче (zgromadzenie ludowe) kieruje polityką, a handel z Hanzą przynosi bogactwo. Lecz Moskwa nieustannie rośnie w siłę, a zagrożenie tatarskie wisi ze wschodu. Handel futrami, panowanie na Bałtyku, pokonanie Moskwy — rządź jako Wielki Książę całej Rusi."
 nov_novgorod_mission_pack_CRITERIA_DESCRIPTION:0 "Zbuduj imperium handlowe, pokonaj Moskwę, by zjednoczyć Ruś, opanuj Bałtyk i Syberię i rządź jako Wielki Książę Rusi."
 nov_novgorod_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by zostać Wielkim Księciem Rusi."
 nov_novgorod_mission_pack_BUTTON_DETAILS:0 "Od nowogrodzkiej republiki kupieckiej do założenia Imperium Rosyjskiego!"
 nov_veche_republic: "Republika wiecowa"
 nov_veche_republic_desc: "Wiec Nowogrodu — swoista instytucja demokratyczna, w której uczestniczą jednakowo mieszczanie, szlachta i kupcy. „Nowogród należy jedynie do Nowogrodu” — to wola obywateli, a nie księcia, kieruje tym państwem i odróżnia je od wszystkich innych księstw ruskich. Umocnij tradycję wiecu i umocnij podstawy republiki kupieckiej."
 nov_dev_novgorod: "Rozwiń Wielki Nowogród"
 nov_dev_novgorod_desc: "„Pan Wielki Nowogród” nad Wołchowem to największe miasto handlowe średniowiecznej Rusi. Kupcy hanzeatyccy, bizantyjscy i wschodnio-muzułmańscy zbiegają się tutaj, handlując futrami, woskiem, lnem i rybami. Nowogrodzki „Dwór” (placówka handlowa) posiada oddziały w Lubece, Brugii, Londynie i Bergen."
 nov_birch_bark: "Listy brzozowe"
 nov_birch_bark_desc: "Nowogrodzianie mieli zwyczaj pisać na korze brzozowej — świadectwo najbardziej piśmiennego średniowiecznego miasta świata. Wykorzystaj tę tradycję piśmienności, by rozwinąć naukę, zarządzanie i zapisy handlowe."
 nov_hanseatic_league: "Handel hanzeatycki"
 nov_hanseatic_league_desc: "Nowogród, będąc jednym z największych miast handlowych Europy Północnej, jest głęboko wpleciony w sieć Hanzy. Umocnij szlaki handlowe, prowadzące do Lubeki, Hamburga i Brugii."
 nov_fur_trade: "Handel futrami"
 nov_fur_trade_desc: "Największym towarem handlowym Nowogrodu są futra: skórki wiewiórek, soboli, bobrów i norek, zdobyte w lasach syberyjskich, sprzedawane szlachcie zachodnioeuropejskiej. Handel futrami, zwany „złotem Północy”, jest źródłem bogactwa Nowogrodu."
 nov_dev_pskov: "Rozwiń Psków"
 nov_dev_pskov_desc: "Uparcie niezależny Psków — „młodszy brat” Nowogrodu — staje się kupiecką i kulturalną drugą stolicą. Rozwiń to miasto z murami Kremla Pskowskiego i Soborem Trójcy Świętej."
 nov_trade_empire: "Imperium handlowe"
 nov_trade_empire_desc: "Futra, wosk, sól, ryby — sieć handlowa Nowogrodu obejmuje Europę Północną. Gildie kupieckie rządzą państwem, a placówki handlowe powstają wszędzie. Sława „Wenecji Północy” rozprzestrzenia się po całym świecie."
 nov_dev_staraya_russa: "Rozwiń Starą Russę"
 nov_dev_staraya_russa_desc: "Stara Russa, nosząca imię „Stara Ruś”, słynie z wydobycia soli. Rozwiń warzelnictwo soli tego starożytnego miasta, by wspierać zaopatrzenie w żywność i handel Nowogrodu."
 nov_secure_novgorod_region: "Zabezpiecz Ziemię Nowogrodzką"
 nov_secure_novgorod_region_desc: "Ojczyzna Nowogrodu — pełne panowanie nad regionami Zachodniego i Wschodniego Nowogrodu ustanawia podstawę pod ekspansję."
 nov_conquer_tver: "Podbij Twer"
 nov_conquer_tver_desc: "Księstwo Twerskie, niegdyś rywal Moskwy o zwierzchnictwo — jego siła teraz zgasła. Podbij to ważne miasto nad Wołgą i otwórz drogę na południe."
 nov_conquer_yaroslavl: "Podbij Jarosław"
 nov_conquer_yaroslavl_desc: "Jarosław, miasto „Złotego Pierścienia” nad Wołgą — podbij to miasto handlowe i zajmij północny szlak handlowy."
 nov_conquer_moscow: "Podbij Moskwę"
 nov_conquer_moscow_desc: "Od czasów Iwana I (Kality) Moskwa nieustannie się rozszerzała ze wsparciem tatarskim. „Moskwa albo wojna” — pokonaj największe zagrożenie Nowogrodu i zdobądź przywództwo nad Rusią."
 nov_conquer_suzdal: "Podbij Suzdal i Włodzimierz"
 nov_conquer_suzdal_desc: "Suzdal i Włodzimierz to starożytne miasta, niegdyś kwitnące jako dziedzice Rusi Kijowskiej. Podbij te miasta z wieloma złotokopułowymi cerkwiami i odziedzicz legitymizację starożytnej Rusi."
 nov_defeat_muscovy: "Zniszcz Moskwę"
 nov_defeat_muscovy_desc: "Wielkie Księstwo Moskiewskie zniszczone, a przywództwo nad Rusią przechodzi na Nowogród. Ambicje dynastii Rurykowiczów zmiażdżone — republika wiecowa zadecyduje o losie przyszłości Rusi."
 nov_conquer_smolensk: "Podbij Smoleńsk"
 nov_conquer_smolensk_desc: "Smoleńsk, zwany „kluczem do Rusi” — opanowanie tego węzła komunikacji wschód-zachód ustanawia wpływ zachodni."
 nov_conquer_ryazan: "Podbij Riazań"
 nov_conquer_ryazan_desc: "Księstwo Riazańskie, pierwsze spustoszone przez wojsko mongolskie w 1237 roku — podbij jego południowe ziemie stepowe i wznieś linię obronną przeciw Tatarom."
 nov_form_russia: "Utwórz Ruś"
 nov_form_russia_desc: "Jednolite państwo Rusi ze środkiem w Nowogrodzie nabiera kształtu — nie Moskwa, lecz Nowogród zjednoczył Ruś. Jaką formę przyjmie ta nowa Rosja, zrodzona z tego historycznego zwrotu?"
 nov_vologda_trade: "Handel w Wołogdzie"
 nov_vologda_trade_desc: "Opanowanie Wołogdy i Białego Jeziora — kluczowych punktów północnego szlaku handlowego — ustanawia dostęp do Morza Białego i szlaku handlu futrami."
 nov_found_arkhangelsk: "Załóż Archangielsk"
 nov_found_arkhangelsk_desc: "Wznieś miasto portowe Archangielsk na brzegu Morza Białego — choć zamarza zimą, ten port umożliwia bezpośredni handel z Europą Północną i Brytanią. W nadchodzących epokach kupcy angielscy będą tu przybywać na Ruś."
 nov_white_sea_trade: "Opanuj handel na Morzu Białym"
 nov_white_sea_trade_desc: "Opanuj szlak handlowy Morza Białego i ustanów bezpośredni handel z Europą Północną. Archangielsk rozwija się jako centrum handlu północnego."
 nov_conquer_perm: "Podbij Perm"
 nov_conquer_perm_desc: "Region Permu nad górną Kamą to producent „futer kamskich”, najcieńszych skór. Podbój tego miejsca ustanawia monopol handlu futrami."
 nov_kola_fortress: "Twierdza Kola"
 nov_kola_fortress_desc: "Północny kraniec Półwyspu Kolskiego — zajmij wolny od lodu port Zatoki Murmańskiej i ustanów przyczółek dla północnego szlaku morskiego."
 nov_siberian_frontier: "Pogranicze syberyjskie"
 nov_siberian_frontier_desc: "Przekrocz Góry Uralskie na Syberię — droga „poza ziemię” z bezgranicznymi zasobami futer otwarta. Posuń się na Syberię przed podbojem Jermaka."
 nov_fur_monopoly: "Monopol handlu futrami"
 nov_fur_monopoly_desc: "Od Permu po Syberię — wszystkie szlaki handlu futrami wpadają pod kontrolę Nowogrodu. Zmonopolizuj dostawy luksusowych futer, pożądanych przez królów i szlachtę europejską, i zdobądź ogromne bogactwo."
 nov_secure_karelia: "Zabezpiecz Karelię"
 nov_secure_karelia_desc: "Zajmij region Karelii na północnym brzegu Zatoki Fińskiej, by zapewnić dostęp do Bałtyku — ważny punkt strategiczny, ustanawiający granicę ze Szwecją."
 nov_conquer_viborg: "Podbij Wyborg"
 nov_conquer_viborg_desc: "Twierdza Wyborg, zbudowana przez Szwedów — szturm na ten kluczowy punkt Zatoki Fińskiej otwiera drzwi do Bałtyku."
 nov_baltic_fleet: "Flota bałtycka"
 nov_baltic_fleet_desc: "Zbuduj Flotę Bałtycką Nowogrodu — potęga morska jest niezbędna, by opanować handel północnoeuropejski."
 nov_conquer_riga: "Podbij Rygę"
 nov_conquer_riga_desc: "Ryga w ujściu Dźwiny — podbój tego ważnego miasta hanzeatyckiego zdobywa przywództwo w handlu bałtyckim. Z duchem „Gdańsk albo wojna” weź również Rygę."
 nov_livonia: "Podporządkuj Inflanty"
 nov_livonia_desc: "Wschodnie wybrzeże bałtyckie, rządzone przez Zakon Kawalerów Mieczowych — podporządkowanie tego regionu ustanawia dostęp do ziem nadbałtyckich."
 nov_neva_ports: "Porty na Newie"
 nov_neva_ports_desc: "Rozwiń miasto portowe na Newie — to miejsce, gdzie Piotr Wielki później zbuduje „Petersburg”, staje się bramą do Bałtyku."
 nov_orthodox_archbishop: "Arcybiskupstwo prawosławne"
 nov_orthodox_archbishop_desc: "Arcybiskup Nowogrodu dzierży władzę niezależnie od Moskwy i Konstantynopola — autonomia religijna wspiera samodzielność Nowogrodu. Umocnij tradycję prawosławną Nowogrodu z jego Soborem Świętej Zofii."
 nov_cathedral_cities: "Miasta katedr"
 nov_cathedral_cities_desc: "Wznieś katedry we wszystkich miastach Nowogrodu — urzeczywistnij ideał „Świętej Rusi” i pokryj całą ziemię blaskiem wiary prawosławnej."
 nov_guardian_of_orthodoxy: "Strażnik prawosławia"
 nov_guardian_of_orthodoxy_desc: "Wraz z upadkiem Konstantynopola przed Osmanami misja strażnika prawosławia przechodzi na Nowogród. Zdobądź tytuł „Trzeciego Rzymu” — niech nie Moskwa, lecz Nowogród go dzierży."
 nov_novgorod_chronicle: "Latopis nowogrodzki"
 nov_novgorod_chronicle_desc: "Latopis nowogrodzki (Novgorodskaja Letopis) — to dzieło historyczne, skrupulatnie zapisujące wydarzenia każdego roku, niesie duchowe dziedzictwo Nowogrodu nadchodzącym pokoleniom."
 nov_dev_torzhok: "Rozwiń Torżok"
 nov_dev_torzhok_desc: "Torżok, położony między Nowogrodem a Moskwą — rozwiń go węzłem handlowym i opanuj południowy szlak handlowy."
 nov_kazan_subjugation: "Podporządkuj Kazań"
 nov_kazan_subjugation_desc: "Chanat Kazański — podporządkowanie tego tatarskiego państwa sukcesyjnego, panującego nad środkową Wołgą, otwiera drogę na wschód."
 nov_ushkuiniks: "Uszkujnicy"
 nov_ushkuiniks_desc: "Uszkujnicy — mieszana grupa rzecznych piratów, pionierów i żołnierzy Nowogrodu. Włącz tych twardych ludzi, schodzących w dół Wołgi i atakujących tatarskie statki handlowe, do regularnej armii Nowogrodu i wyszkol ich na oddziały elitarne."
 nov_dev_suzdal: "Rozwiń Suzdal"
 nov_dev_suzdal_desc: "Suzdal ze „Złotego Pierścienia” — rozwiń to starożytne miasto z wieloma średniowiecznymi cerkwiami i klasztorami centrum kulturalnym i religijnym."
 nov_conquer_beloozero: "Podbij Białe Jezioro"
 nov_conquer_beloozero_desc: "Region Białego Jeziora — bogaty w futra i ryby, zajmij tę ziemię i zabezpiecz północny szlak handlowy."
 nov_dev_kholmogory: "Rozwiń Chołmogory"
 nov_dev_kholmogory_desc: "Chołmogory nad Dźwiną — rozwiń to miasto portowe bramą do Morza Białego i połóż fundament pod przyszły dobrobyt Archangielska."
 nov_conquer_vladimir: "Podbij Włodzimierz"
 nov_conquer_vladimir_desc: "Niegdyś stolica Wielkiego Księstwa Włodzimierskiego — to starożytne miasto z wieloma budowlami religijnymi, w tym Soborem Dymitrowskim, upada przed Nowogrodem."
 nov_tatar_wars: "Wojny przeciw Tatarom"
 nov_tatar_wars_desc: "Nowogród był jedynym dużym miastem Rusi, które nie poddało się jarzmu tatarskiemu — nieś teraz tę dumę orężem w walce przeciw Tatarom. Z duchem brzegów Newy rozgrom jeźdźców stepowych."
 nov_golden_horde: "Kontratak na Złotą Ordę"
 nov_golden_horde_desc: "Podnieś sztandar Nowogrodu na ziemi Złotej Ordy (Chanatu Kipczackiego) — kto wyzwoli Ruś spod panowania mongolskiego, ten jest prawdziwym władcą Rusi."
 nov_nizhny_novgorod: "Podbij Niżny Nowogród"
 nov_nizhny_novgorod_desc: "„Niżny Nowogród” — podporządkuj to miasto handlowe u zbiegu Wołgi i Oki i zdobądź handel środkowej Wołgi."
 nov_orthodox_mission: "Misja prawosławna"
 nov_orthodox_mission_desc: "Rozprzestrzeniaj wiarę prawosławną wśród pogan północy i wschodu — działalność misyjna wśród ludów fińskich, rdzennych ludów syberyjskich i Tatarów pomnaża legitymizację Nowogrodu."
 nov_hanseatic_kontors: "Kantory hanzeatyckie"
 nov_hanseatic_kontors_desc: "Wznieś nowogrodzkie placówki handlowe (kantory) w najważniejszych miastach hanzeatyckich — Nowogrodzie, Rydze, Lubece — i opanuj północnoeuropejską sieć handlową bezpośrednio."
 nov_ostrog_system: "System ostrogów"
 nov_ostrog_system_desc: "Zbuduj sieć twierdz (ostrogów), wspierających posuwanie się na Syberię — przyczółki dla podboju Syberii, prowadzące do Tiumenia, Tobolska i Irkucka."
 nov_dev_ryazan: "Rozwiń Riazań"
 nov_dev_ryazan_desc: "Riazań, zniszczony przez Mongołów — nowe miasto Riazań wzniesiono na jego ruinach. Rozwiń to ważne południowe miasto przyczółkiem ku stepowi."
 nov_estonian_coast: "Wybrzeże estońskie"
 nov_estonian_coast_desc: "Podporządkowanie wybrzeża estońskiego dopełnia kontrolę nad południowym brzegiem Bałtyku. Zajmij hanzeatyckie miasto handlowe Rewal (Tallin)."
 nov_conquer_teutonic: "Rozbij Zakon Krzyżacki"
 nov_conquer_teutonic_desc: "Dziedzictwo krucjat bałtyckich się kończy — klęska Zakonu Krzyżackiego przywodzi południowo-wschodnie wybrzeże bałtyckie całkowicie pod kontrolę Nowogrodu."
 nov_moscow_capital: "Rozwiń Moskwę"
 nov_moscow_capital_desc: "Rozwiń podbitą Moskwę ważnym miastem pod nowogrodzkimi rządami — przekształć dawny pałac moskiewskiego wielkiego księcia w rezydencję nowogrodzkiego namiestnika, symbol władzy."
 nov_iron_ring: "Żelazny Pierścień"
 nov_iron_ring_desc: "Pierścień twierdz, chroniący Nowogród — sieć obronna, łącząca Psków, Nowogród, Ładogę i Twer, ukończona. Żelazny system obronny, zdolny odeprzeć inwazje z każdego kierunku."
 nov_kholmogory_trade: "Handel w Chołmogorach"
 nov_kholmogory_trade_desc: "Od węzła handlowego Chołmogory nad Dźwiną po Morze Białe — zdobądź ten północny szlak handlowy przed angielską Kompanią Moskiewską."
 nov_eastern_orthodoxy: "Kościół wschodni ustanowiony"
 nov_eastern_orthodoxy_desc: "Po upadku Konstantynopola Nowogród występuje jako centrum Kościoła wschodniego. Sobór Świętej Zofii jaśnieje dziedzicem Hagia Sophia Konstantynopolitańskiej."
 nov_amber_road: "Szlak bursztynowy"
 nov_amber_road_desc: "Bursztynowy szlak handlowy, idący od Bałtyku na południe — bałtycki bursztyn, nowogrodzkie futra i wschodni jedwab przecinają się na tym teraz kontrolowanym przez Nowogród szlaku."
 nov_great_novgorod: "Wielki Nowogród ukończony"
 nov_great_novgorod_desc: "Imperium handlowe, potęga wojskowa, władza prawosławna — trzy filary ukończone, a Nowogród staje się państwem godnym tytułu „Wielki”. Uczyń ostatni krok ku „Wielkiemu Księciu Rusi”."
 nov_ruler_of_rus: "Wielki Książę Rusi"
 nov_ruler_of_rus_desc: "„Wielki Książę Nowogrodzki i całej Rusi” — ten tytuł rozbrzmiewał nad placem wiecowym Nowogrodu. Od Bałtyku po Syberię, od Morza Białego po południowe stepy — sztandar Nowogrodu powiewa nad całą Rusią. Republika kupiecka wzniosła jedno z największych imperiów świata. Historia przepisana na nowo — Nowogród decyduje o przyszłości Rusi."
 nov_events.10.t: "Moskwa upadła — przywództwo nad Rusią przechodzi na Nowogród"
 nov_events.10.d: "Kreml moskiewski upadł w nowogrodzkie ręce. Ambicje pogardzanej jako „psy tatarskie” rodziny wielkoksiążęcej Moskwy zmiażdżone. Ponieważ przyszłość Rusi jest teraz rozstrzygana przez republikę wiecową Nowogrodu, to zwycięstwo nie jest zwykłym podbojem terytorialnym — to punkt zwrotny, radykalnie zmieniający rosyjską historię."
 nov_events.10.a: "Moskwa upadła! Rozpoczyna się era Nowogrodu!"
 nov_events.20.t: "Utworzenie Rusi — nowe państwo wokół Nowogrodu"
 nov_events.20.d: "Jednolite państwo Rusi ze środkiem w Nowogrodzie narodzone. Jak ma się nazywać? Ogłosić „Wielkie Księstwo Ruś”, by zwiastować nowy początek, czy z dumą zachować imię „Nowogród”?"
 nov_events.20.a: "Ogłosić „Wielkie Księstwo Ruś” — narodziny nowej Rosji"
 nov_events.20.b: "Z dumą zachować imię „Nowogród”"
 nov_events.99.t: "Wielki Książę Rusi — Nowogród rządzi Rosją"
 nov_events.99.d: "„Wielki Książę Nowogrodzki i całej Rusi” — ten tytuł rozbrzmiewał nad placem wiecowym Nowogrodu. Od Bałtyku po Syberię, od Morza Białego po step — sztandar Nowogrodu powiewa nad całą Rusią. Republika kupiecka wzniosła jedno z największych imperiów historii. Historia przepisana na nowo."
 nov_events.99.a: "Niech żyje Wielki Książę Rusi! Nowogród na wieki!"
 STATIC_MODIFIER_NAME_nov_novgorod_city_mod: "Dobrobyt Wielkiego Nowogrodu"
 STATIC_MODIFIER_DESC_nov_novgorod_city_mod: "Jako węzeł hanzeatycki Wielki Nowogród rozwinięty, a handel prosperuje."
 STATIC_MODIFIER_NAME_nov_literacy_mod: "Tradycja brzozowa"
 STATIC_MODIFIER_DESC_nov_literacy_mod: "Tradycja piśmienności wspiera duchową i kupiecką przewagę Nowogrodu."
 STATIC_MODIFIER_NAME_nov_hansa_mod: "Handel hanzeatycki"
 STATIC_MODIFIER_DESC_nov_hansa_mod: "Partnerstwo z największą siecią handlową Europy Północnej ustanowione."
 STATIC_MODIFIER_NAME_nov_fur_mod: "Handel futrami"
 STATIC_MODIFIER_DESC_nov_fur_mod: "Północne futra dostarczane przez Nowogród do Europy Zachodniej."
 STATIC_MODIFIER_NAME_nov_pskov_mod: "Wzrost Pskowa"
 STATIC_MODIFIER_DESC_nov_pskov_mod: "Psków rozwija się jako kupiecka druga stolica Nowogrodu."
 STATIC_MODIFIER_NAME_nov_trade_empire_mod: "Imperium handlowe"
 STATIC_MODIFIER_DESC_nov_trade_empire_mod: "Sieć handlowa Nowogrodu obejmuje Europę Północną."
 STATIC_MODIFIER_NAME_nov_russa_mod: "Sól Starej Russy"
 STATIC_MODIFIER_DESC_nov_russa_mod: "Ośrodek warzelnictwa soli Stara Russa rozwinięty."
 STATIC_MODIFIER_NAME_nov_novgorod_secured_mod: "Ziemia Nowogrodzka zabezpieczona"
 STATIC_MODIFIER_DESC_nov_novgorod_secured_mod: "Ojczyzna Nowogrodu całkowicie podporządkowana — podstawa ekspansji ustanowiona."
 STATIC_MODIFIER_NAME_nov_tver_mod: "Twer podbity"
 STATIC_MODIFIER_DESC_nov_tver_mod: "Twer nad górną Wołgą podbity — szlak południowy otwarty."
 STATIC_MODIFIER_NAME_nov_yaroslavl_mod: "Jarosław prosperuje"
 STATIC_MODIFIER_DESC_nov_yaroslavl_mod: "Miasto handlowe nad Wołgą Jarosław upada przed Nowogrodem."
 STATIC_MODIFIER_NAME_nov_suzdal_mod: "Suzdal-Włodzimierz"
 STATIC_MODIFIER_DESC_nov_suzdal_mod: "Starożytne rdzenne serce Rusi, Suzdal i Włodzimierz, włączone."
 STATIC_MODIFIER_NAME_nov_defeat_muscovy_mod: "Moskwa rozgromiona"
 STATIC_MODIFIER_DESC_nov_defeat_muscovy_mod: "Tatarscy klienci Moskwy zniszczeni — przywództwo nad Rusią przechodzi na Nowogród."
 STATIC_MODIFIER_NAME_nov_smolensk_mod: "Smoleńsk podporządkowany"
 STATIC_MODIFIER_DESC_nov_smolensk_mod: "Klucz Rusi, Smoleńsk, zdobyty — wpływ zachodni ustanowiony."
 STATIC_MODIFIER_NAME_nov_ryazan_mod: "Riazań podbity"
