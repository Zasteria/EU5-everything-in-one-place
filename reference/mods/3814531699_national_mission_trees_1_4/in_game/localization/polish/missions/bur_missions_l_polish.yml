l_polish:
 bur_crown_of_lothair_mission_pack: "Korona Lotara"
 bur_crown_of_lothair_mission_pack_DESCRIPTION:0 "1337: zaczyna się Wojna Stuletnia. Księstwo Burgundii, zaklinowane między Francją a Anglią, posiada przebiegłość i zasoby, by grać po obu stronach — i ostatecznie wskrzesić Lotaryngię, starożytne Królestwo Środkowe spadkobierców Karola Wielkiego. Zabezpiecz dwór w Dijon, zbuduj Order Złotego Runa i zdominuj flamandzki handel suknem; następnie nawiguj w wojnie między Anglią a Francją, by wydobyć maksymalne ustępstwa, zanim zjednoczysz Flandrię, Franche-Comté i Lotaryngię w nowe „Królestwo Lotaryngii”."
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Burgundia nawiguj w Wojnie Stuletniej, umocnij się wewnętrznie i odbuduj Lotaryngię."
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by zgłosić roszczenie do Korony Lotara."
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS:0 "Przetrwaj między Anglią a Francją — a następnie prześcignij obie!"
 bur_duchy_of_burgundy: "Ambicje księstwa"
 bur_duchy_of_burgundy_desc: "1337: dom Valois-Burgundii wznosi się jako młodsza gałąź francuskiego domu królewskiego. Grając Anglią i Francją przeciw sobie, księstwo dąży do ekspansji na Flandrię, Franche-Comté i Lotaryngię. Wojna Stuletnia jest okazją, zdarzającą się raz na pokolenie, by to małe księstwo stało się wielką potęgą."
 bur_court_of_dijon: "Dwór w Dijon"
 bur_court_of_dijon_desc: "Dwór burgundzki w Dijon był jednym z najwspanialszych w Europie XV wieku. Jan van Eyck i Rogier van der Weyden pracowali pod burgundzkim mecenatem, a biblioteka książęca rywalizowała z każdą we Francji. Ten „Renesans Północny” avant la lettre został zbudowany na dochodach z sukna flamandzkiego i ekstrawaganckiej ambicji księcia."
 bur_flemish_cloth: "Flamandzki przemysł sukienniczy"
 bur_flemish_cloth_desc: "Trójkąt Brugii, Gandawy i Ypres był największym regionem przemysłowym średniowiecznej Europy. Wełna angielska była wysyłana do Flandrii, obrabiana w cienkie sukna przez wykwalifikowanych rzemieślników i sprzedawana po całej Europie na jarmarkach szampańskich. Ten łańcuch dostaw był gospodarczym kręgosłupem Burgundii."
 bur_golden_fleece: "Order Złotego Runa"
 bur_golden_fleece_desc: "Założony w Brugii w 1430 roku przez Filipa Dobrego, Order Złotego Runa był najbardziej prestiżowym orderem rycerskim w katolickim chrześcijaństwie — członkostwo zarezerwowane było dla monarchów i wielkich książąt. Oparty na micie o Jazonie i Argonautach, znak orderu (złote runo na zawieszce) pozostawał najwyższym zaszczytem aż do XIX wieku."
 bur_estates_general: "Stany Generalne"
 bur_estates_general_desc: "Jako państwo złożone, rządzące Flandrią, Brabancją i Franche-Comté — każda z własnymi tradycjami prawnymi — Burgundia potrzebowała instytucji przedstawicielskich, by rządzić skutecznie. Stany Generalne zbierały trzy stany z różnych regionów w jednych ramach obradujących."
 bur_feast_of_pheasants: "Uczta Bażanta"
 bur_feast_of_pheasants_desc: "W 1454 roku, wstrząśnięty upadkiem Konstantynopola, Filip Dobry wyprawił „Ucztę Bażanta” w Lille — najwystawniejszy bankiet wieków średnich. Rycerze składali śluby krzyżowe nad żywym bażantem; sam Filip zobowiązał się pójść za swym królem do Ziemi Świętej. Krucjata nigdy nie wypłynęła, lecz uczta utrwaliła reputację Burgundii jako strażniczki chrześcijańskiego rycerstwa."
 bur_balance_of_power: "Między dwoma królestwami"
 bur_balance_of_power_desc: "Dyplomatyczny geniusz Burgundii leżał w jej pozycji jako równoważącego. Wasal Francji z mocy prawa feudalnego, związana z Cesarstwem przez swe wschodnie terytoria i potencjalny sojusznik Anglii — Burgundia mogła przechylić szalę Wojny Stuletniej w którąkolwiek stronę. Ta dźwignia była podstawą potęgi burgundzkiej."
 bur_ally_england: "Sojusz z Anglią"
 bur_ally_england_desc: "Po zamordowaniu Jana Nieustraszonego na moście w Montereau w 1419 roku Burgundia rzuciła swą wagę na stronę Anglii. Wynikający z tego Traktat z Troyes (1420) ogłosił Henryka V dziedzicem korony francuskiej — wynik nie do pomyślenia bez wsparcia burgundzkiego. Sojusz burgundzko-angielski był jednym z decydujących partnerstw wojskowych Wojny Stuletniej."
 bur_treaty_of_troyes: "Traktat z Troyes"
 bur_treaty_of_troyes_desc: "Traktat z Troyes, poparty przez Burgundię, uczynił Henryka V regentem i dziedzicem Francji. Zabezpieczenie Reims (gdzie koronowano królów francuskich) i Paryża (stolicy) czyni Burgundię faktycznym panem Francji — ostateczne uzasadnienie sojuszu angielskiego."
 bur_ally_france: "Pojednanie z Francją"
 bur_ally_france_desc: "Na Kongresie w Arras w 1435 roku Filip Dobry zmienił stronę — porzucając Anglię i pojednując się z Karolem VII. W zamian Burgundia otrzymała formalne zwolnienie z hołdu i cesję strategicznych miast. Ta dyplomatyczna piruet uczyniła Burgundię ostatecznym zwycięzcą Wojny Stuletniej."
 bur_treaty_of_arras: "Duch Arras"
 bur_treaty_of_arras_desc: "Traktat z Arras (1435) był największym dyplomatycznym triumfem Burgundii — Karol VII został upokorzony do publicznych przeprosin, podczas gdy Filip odszedł ze zdobyczami terytorialnymi i zrzeczonym hołdem. Wykorzystując tę swobodę, Burgundia mogła skupić się na umacnianiu Lotaryngii i dopełnieniu Królestwa Środkowego."
 bur_flanders_in_the_war: "Flandria w Wojnie Stuletniej"
 bur_flanders_in_the_war_desc: "Hrabstwo Flandrii było jednym z najzaciekliej spornych terytoriów Wojny Stuletniej. Anglia dostarczała wełnę do flamandzkich miast sukienniczych i miała tam silny wpływ gospodarczy; miasta flamandzkie często opowiadały się po stronie Anglii przeciw Francji. Jednak Francja zgłaszała roszczenie do hrabiego Flandrii jako wasala. Burgundia, zależna od dochodów z sukna flamandzkiego, musiała przyciągnąć ten kluczowy region na swą orbitę."
 bur_integrate_brabant: "Droga do Brukseli"
 bur_integrate_brabant_desc: "Antwerpia, handlowa stolica Brabancji, stanie się największym miastem handlowym Europy Północnej pod koniec XV wieku. Drukarnia Plantina, handel diamentami i wymiana hiszpańskiego srebra — wszystko skupione tutaj. Zabezpieczenie Brabancji dopełnia burgundzkie mistrzostwo nad Niderlandami."
 bur_integrate_franche_comte: "Zdobądź Dole"
 bur_integrate_franche_comte_desc: "Dole, stolica Franche-Comté, była domem Uniwersytetu w Dole (założonego 1422) — wspieranego przez dom książęcy Burgundii. Zabezpieczenie tego miasta oznacza skuteczną kontrolę nad całym Franche-Comté i otwiera drogę ku Lotaryngii."
 bur_expand_into_lorraine: "Rozszerz się na Lotaryngię"
 bur_expand_into_lorraine_desc: "Nancy było stolicą Księstwa Lotaryngii. Karol Śmiały zginął w bitwie pod Nancy w 1477 roku, obsesyjnie dążąc do tego miasta — tutaj gracz pisze inne zakończenie. Zdobycie Nancy otwiera drogę do Luksemburga i zabezpiecza burgundzki korytarz między Niderlandami a rdzeniem."
 bur_crown_of_lothair: "Korona Lotara"
 bur_crown_of_lothair_desc: "W 843 roku Traktat z Verdun stworzył Lotaryngię — Królestwo Środkowe, rozciągające się od Flandrii po Włochy wzdłuż Renu. Pochłonięte przez Francję i Niemcy w Traktacie z Meerssen w 870 roku, to królestwo zniknęło z historii na tysiąc lat. Teraz dom Burgundii je odbudowuje: nie jako Francję, nie jako Niemcy, lecz jako coś nowego — zmartwychwstanie karolińskiego centrum."
 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "Dwór w Dijon"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "Dwór burgundzki w Dijon przyciągnął Jana van Eycka, Rogiera van der Weydena oraz najlepszych muzyków i poetów epoki — czyniąc go kulturalną stolicą Europy Północnej i pionierem flamandzkiej tradycji malarskiej, która przekształci sztukę zachodnią."
 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "Flamandzki przemysł sukienniczy"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "Trójkąt sukienniczy Brugii, Gandawy i Ypres był silnikiem największej gospodarki przemysłowej średniowiecznej Europy. Sukna flamandzkie były wzorcem jakości w całej Europie, a kontrola nad tym przemysłem dawała Burgundii zasoby finansowe, rywalizujące z każdym królestwem."
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "Order Złotego Runa"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "Założony w 1430 roku, Order Złotego Runa był najbardziej ekskluzywnym zaszczytem w chrześcijaństwie — jego lista członków brzmiała jak apel europejskiej rodziny królewskiej. Nadawanie runa dawało Burgundii dźwignię dyplomatyczną wobec królów i cesarzy jednakowo."
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "Stany Generalne"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "Stany Generalne Burgundii zjednoczyły trzy stany z Flandrii, Brabancji i właściwej Burgundii w jedno zgromadzenie obradujące — wczesny model rządów przedstawicielskich, który wpłynął na późniejszą Republikę Holenderską i francuskie ciała rewolucyjne."
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "Ślub Bażanta"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "Na największym bankiecie wieków średnich Filip Dobry przysiągł nad żywym bażantem poprowadzić krucjatę przeciw Osmanom. Ślub nigdy nie został spełniony, lecz widowisko ogłosiło Burgundię największą potęgą rycerską chrześcijaństwa i pogłębiło jej więzy z papiestwem."
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "Między dwoma królestwami"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "Grając równoważącego między Anglią a Francją, Burgundia odmawia pełnego poddania się któremukolwiek suzerenowi i wykorzystuje dwuznaczność swych zobowiązań feudalnych. Chaos Wojny Stuletniej tworzy doskonałą okazję, by zbudować niezależną potęgę wojskową, utrzymując obie strony na dystans."
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "Sojusz angielski"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "Po Montereau Burgundia i Anglia utworzyły najważniejszy sojusz wojskowy Wojny Stuletniej. Razem zajęły Paryż i prawie wygasiły linię Valois — dopiero interwencja Joanny d’Arc odwróciła bieg wypadków."
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "Traktat z Troyes"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "Traktat z Troyes, poparty przez Burgundię, uczynił Henryka V dziedzicem Francji — szczyt potęgi anglo-burgundzkiej. Opierając się na tym triumfie, Burgundia pozycjonuje się jako prawdziwy władca królestwa francuskiego."
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "Sojusz francuski"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "Kongres w Arras (1435) był arcydziełem dyplomatycznym Burgundii — porzucenie Anglii w momencie maksymalnej dźwigni i wydobycie upokarzających ustępstw od zdesperowanego Karola VII. Burgundia wyszła jako niezastąpiony partner ostatecznego zwycięzcy francuskiego."
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "Traktat z Arras"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "W Arras Filip Dobry wydobył formalne przeprosiny od Karola VII i zyskał terytorium, zrzekając się wymogu osobistego hołdu. To uczyniło Burgundię faktycznie niezależną, pozostając nominalnie w porządku feudalnym francuskim — doskonały wynik dyplomatyczny."
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "Korona Lotara"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "Utracone w 870 roku, Królestwo Lotaryngii odradza się po tysiącu lat. Od Flandrii po Franche-Comté, od Lotaryngii po właściwą Burgundię dom Burgundii zgromadził Królestwo Środkowe, którego wnukowie Karola Wielkiego nie zdołali utrzymać. Europa ma nowy środek ciężkości."
 bur_events.1.t: "Ambicje Księstwa Burgundii"
 bur_events.1.d: "1337: pierwsze strzały Wojny Stuletniej mają zabrzmieć. Edward III Angielski forsuje swe roszczenie do tronu francuskiego — lecz Burgundia obserwuje ze swego wyjątkowego punktu obserwacyjnego między dwoma gigantami. Młodsza gałąź francuskiego domu Valois, a jednak posiadająca potężną Flandrię, elitarną tradycję rycerską i dochody dorównujące każdemu królestwu — Burgundia jest punktem podparcia, na którym ta wojna się obróci. Od wspaniałego dworu w Dijon po tętniące życiem hale sukiennicze Brugii i Gandawy księstwo żywi największe ambicje wśród wszystkich potęg Europy. Pytanie brzmi, którą stronę poprzeć — lub czy poprzeć którąkolwiek."
 bur_events.1.a: "Burgundia wybierze własną drogę między Anglią a Francją!"
 bur_events.2.t: "Uczta Bażanta"
 bur_events.2.d: "W Lille w 1454 roku książę Filip wyprawił najbardziej niezwykły bankiet wieków średnich. Żywy bażant został wniesiony do sali, ozdobiony złotym obrożą; przed nim zebrani rycerze Burgundii składali śluby krzyżowe na Boga, Dziewicę i samego bażanta. Filip zobowiązał się pójść za swym królem do Ziemi Świętej. Maszyneria sceniczna wytworzyła kaplicę, statek i zamek na stołach biesiadnych. Żonglerzy, poeci i muzycy rywalizowali o uwagę. Krucjata nigdy nie wypłynęła — lecz nikt w Europie nie wątpił, że Burgundia jest największym strażnikiem cnót rycerskich chrześcijaństwa."
 bur_events.2.a: "Przysięgamy przed Bogiem i Bażantem bronić chrześcijaństwa!"
 bur_events.3.t: "Korona Lotara"
 bur_events.3.d: "W 843 roku Traktat z Verdun podzielił imperium Karola Wielkiego między trzech wnuków. Część środkowa — rozciągająca się od Flandrii po Włochy wzdłuż Renu — przypadła Lotarowi I i stała się „Lotaryngią”. W 870 roku Traktat z Meerssen ją wymazał, dzieląc między Francję i Niemcy. Przez tysiąc lat Królestwo Środkowe było tylko wspomnieniem — duchem, nawiedzającym granice Francji i Cesarstwa. Teraz dom Burgundii, przebiegłością i orężem, odbudował to, czego Karolingowie nie zdołali utrzymać. Niech Korona Lotara przejdzie na swego prawowitego dziedzica."
 bur_council_of_mechelen: "Wielka Rada w Mechelen"
 bur_council_of_mechelen_desc: "Doradcy Filipa Dobrego ustanowili w Mechelen „Wielką Radę” z jurysdykcją nad wszystkimi terytoriami burgundzkimi — sąd najwyższy, stojący ponad odrębnymi tradycjami prawnymi Flandrii, Brabancji i Franche-Comté. Był to instytucjonalny kamień węgielny prawdziwej centralizacji."
 bur_siege_of_calais: "Calais zdobyte"
 bur_siege_of_calais_desc: "Calais było ostatnim przyczółkiem Anglii na lądzie francuskim — dzierżonym od 1347 do 1558 roku. Słynni „Mieszczanie z Calais” Rodina upamiętniają jego bohaterską kapitulację. Zdobycie tego strategicznego portu daje Burgundii kontrolę nad przeprawą przez Kanał i maksymalizuje wartość sojuszu angielskiego."
 bur_hainaut_namur: "Odziedzicz Hainaut i Namur"
 bur_hainaut_namur_desc: "Filip Dobry kupił Namur w 1421 roku i odziedziczył Hainaut w 1433 — dopełniając most lądowy między Flandrią a Brabancją. Te hrabstwa z ich miastami tekstylnymi i strategicznymi przeprawami rzecznymi tworzyły tkankę łączną burgundzkich Niderlandów."
 bur_holland_zeeland: "Holandia i Zelandia"
 bur_holland_zeeland_desc: "Hrabstwa Holandii i Zelandii — z ich łowiskami śledzi, nowymi miastami handlowymi, takimi jak Amsterdam, i doskonałymi portami — zostały zdobyte przez Filipa Dobrego w 1428 roku. Te terytoria staną się sercem Republiki Holenderskiej; pod Burgundią są silnikiem imperium handlowego Morza Północnego."
 bur_luxemburg: "Luksemburg"
 bur_luxemburg_desc: "Filip Dobry podbił Księstwo Luksemburga w 1443 roku po kampanii przeciw Zygmuntowi z linii habsburskiej. Jedna z najsilniejszych twierdz w Cesarstwie, Luksemburg był wschodnią kotwicą burgundzkich Niderlandów — i bramą do Lotaryngii i Alzacji."
 bur_dominate_rhine: "Ren"
 bur_dominate_rhine_desc: "Ren był kręgosłupem cywilizacji europejskiej od Rzymu po dzień dzisiejszy. Zdzierżyć rzekę od Niderlandów po Alzację to zdzierżyć serce Karola Wielkiego — Nadrenię, gdzie zarządzano imperium karolińskim, gdzie wznosiły się miasta katedralne, gdzie zbiegały się największe średniowieczne szlaki handlowe."
 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "Wielka Rada w Mechelen"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "Wielka Rada w Mechelen była odpowiedzią Burgundii na problem rządzenia państwem złożonym z rozbieżnymi tradycjami prawnymi. Tworząc sąd najwyższy ponad prawem flamandzkim, brabanckim i burgundzkim jednakowo, doradcy Filipa zbudowali instytucjonalną podstawę prawdziwej centralizacji."
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "Wolny Port Calais"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "Calais, w najwęższym punkcie Kanału La Manche, od starożytności jest kluczowym węzłem tranzytowym, łączącym handel Morza Północnego, Bałtyku i Morza Śródziemnego. Anglia dzierżyła go przez ponad dwa stulecia właśnie dla tej wartości handlowej. Burgundia rozwija teraz Calais w czołowy skład handlu suknem Europy Północnej."
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "Luksemburg"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "Księstwo-twierdza Luksemburg, jedna z najsilniejszych pozycji w Cesarstwie, dało Burgundii jej wschodnią kotwicę. Jego zdobycie w 1443 roku dopełniło okrążenie doliny Mozy i otworzyło drogę do Lotaryngii i Alzacji."
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "Ren"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "Od delty po winnice Ren jest teraz burgundzki. Największa rzeka karolińskiego serca, szlak handlowy średniowiecznej Europy, granica między cywilizacją a lasem — wszystko pod jedną flagą."
 bur_join_hre: "Dołącz do Świętego Cesarstwa Rzymskiego"
 bur_join_hre_desc: "Burgundia ma możliwość formalnego uznania za księcia Świętego Cesarstwa Rzymskiego. Podwójny status — wasala Francji i księcia cesarskiego — dałby Burgundii wyjątkowo potężną pozycję dyplomatyczną. W 1473 roku Karol Śmiały negocjował z Fryderykiem III w Trewirze o wyniesienie do „Królestwa Burgundii” w ramach Cesarstwa — lecz cesarz wycofał się w ostatniej chwili. Teraz szansa wraca."
 bur_franchecomte_fiefdom: "Małżeństwo z Franche-Comté"
 bur_franchecomte_fiefdom_desc: "W XIII wieku dom Burgundii wykuł głębokie więzy z hrabiami Franche-Comté przez małżeństwo. Książę Otton IV Burgundzki poślubił hrabinę Mahaut z Artois i zabezpieczył wierność Franche-Comté wobec Burgundii. Kopalnie soli, ruda żelaza i Uniwersytet w Dole tego „Wolnego Hrabstwa” czynią je żywotną bramą dla ekspansji wschodniej Burgundii ku Szwajcarii i Lotaryngii."
 bur_events.4.t: "Święte Cesarstwo Rzymskie"
 bur_events.4.d: "Burgundia zawsze zajmowała pozycję graniczną — wasal Francji z mocy prawa feudalnego, a jednak związany z Cesarstwem przez swe wschodnie terytoria. Przychylność cesarza otwiera drogę do formalnego członkostwa. W 1473 roku Karol Śmiały spotkał się z Fryderykiem III w Trewirze i negocjował o status „Królestwa Burgundii” w ramach Cesarstwa — lecz cesarz wsiadł o świcie na swą barkę i odpłynął bez podpisu. Teraz, gdy stosunki są dostatecznie ciepłe, drzwi znów stoją otwarte."
 bur_events.4.a: "Dołączyć do Cesarstwa i zostać księciem cesarskim"
 bur_events.4.b: "Zachować naszą niezależność na razie"
 bur_events.5.t: "Małżeństwo z Franche-Comté"
 bur_events.5.d: "W XIII wieku książę burgundzki Otton IV ożenił się z domem hrabiowskim Franche-Comté, wiążąc to bogate „Wolne Hrabstwo” z Burgundią krwią. Kopalnie soli Jury, kuźnie żelaza, Uniwersytet w Dole i przełęcze górskie, kontrolujące szlaki do Szwajcarii i Lotaryngii — wszystko to przez pokolenia było częścią świata burgundzkiego. Nadszedł czas, by sformalizować to, co małżeństwo już stworzyło."
 bur_events.5.a: "Wykorzystać więzy małżeńskie, by otrzymać Franche-Comté jako poddanego w lenno"
 bur_events.5.b: "Utrzymać więzy małżeńskie, szanując ich autonomię"
 bur_events.6.t: "Flandria w Wojnie Stuletniej"
 bur_events.6.d: "Hrabstwo Flandrii zajmuje wyjątkową pozycję w Wojnie Stuletniej. Flamandzka produkcja sukna nie może funkcjonować bez wełny angielskiej, a bogaci obywatele Brugii, Gandawy i Ypres cenią swe angielskie stosunki handlowe ponad wszystko. Francja zgłasza roszczenie do hrabiego jako wasala, lecz mieszczanie flamandzcy opierają się francuskiej dominacji i wielokrotnie opowiadali się po stronie Anglii. Przyciągając Flandrię na orbitę burgundzką, książę może wykorzystać bogactwo tych miast sukienniczych. Wybór: dać Flandrię w lenno jako poddanego burgundzkiego, czy pogłębić więzy, szanując jej niezależność."
 bur_events.6.a: "Przyjąć Flandrię jako wasala burgundzkiego"
 bur_events.6.b: "Szanować niezależność flamandzką, pogłębiając sojusz"
 bur_nevers_union: "Unia z Nevers"
 bur_nevers_union_desc: "Hrabstwo Nevers leży na południe od Flandrii i ma historyczne więzy z domem książęcym Burgundii. Z Flandrią mocno w ręku ustanowienie roszczenia do Nevers rozszerza sferę wpływów Burgundii na południe. Ziemie między Flandrią a Nevers tworzą korytarz dla przyszłej ekspansji na Francję."
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "Niderlandy zjednoczone"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "Sieć handlowa Niderlandów — łącząca Holandię, Zelandię, Brabancję i Flandrię — została zjednoczona. Potęga handlowa Antwerpii i Amsterdamu, która stanowi podstawę późniejszego Holenderskiego Złotego Wieku."
 bur_events.3.a: "Wznieść się jako odbudowane Królestwo Lotaryngii"
 bur_events.3.b: "Pozostać Burgundią i zgłosić tytuł cesarski (status quo)"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "Lotaryngia odrodzona"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "Królestwo Lotaryngii, następca Środkowej Francji, odrodzone sześć wieków po swym upadku w 869 roku. Dziedzic imperium Karola Wielkiego, to królestwo jest uznane za trzecią potęgę imperialną, stojącą między Świętym Cesarstwem Rzymskim a Królestwem Francji."
