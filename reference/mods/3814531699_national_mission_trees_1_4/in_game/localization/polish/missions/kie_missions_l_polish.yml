l_polish:
 kie_kyiv_mission_pack: "Zjednoczenie Rusi i pan kozaków"
 kie_kyiv_mission_pack_DESCRIPTION:0 "W 1337 roku Księstwo Kijowskie jest małym państwem, zaklinowanym między Litwą a Tatarami. Lecz Kijów niegdyś jaśniał sercem Rusi Kijowskiej — Sobór Świętej Zofii, Ławra Peczerska i Złota Brama wciąż świadczą o jego blasku. Zjednocz lewobrzeżną i prawobrzeżną Ukrainę, podbij Halicz i Wołyń, rozgrom Tatarów kozacką siłą wojskową, utwórz Rutenię i rządź Wielkim Księstwem."
 kie_kyiv_mission_pack_CRITERIA_DESCRIPTION:0 "Zjednocz Ruś, ustanów Hetmanat Kozacki, zostań strażnikiem wiary prawosławnej, utwórz Rutenię i rządź Wielkim Księstwem Kijowskim."
 kie_kyiv_mission_pack_BUTTON_TOOLTIP:0 "Rządź Wielkim Księstwem Kijowskim nad całą Rusią."
 kie_kyiv_mission_pack_BUTTON_DETAILS:0 "Zjednocz rozdrobnioną Ruś pod Kijowem — opanuj step kozackim mieczem!"
 kie_restore_kyiv: "Odbuduj Kijów"
 kie_restore_kyiv_desc: "W 1337 roku Kijów — niegdyś złote miasto Rusi Kijowskiej — jest spustoszony przez inwazję mongolską z 1240 roku. Sobór Świętej Zofii i Ławra Peczerska wciąż świadczą o dawnym blasku. Odbuduj „matkę miast ruskich” wielkim miastem."
 kie_dev_kyiv: "Rozwiń Kijów"
 kie_dev_kyiv_desc: "Kluczowe skrzyżowanie, łączące szlaki handlowe Wołchowa i Dniepru — rozwiń Kijów centrum handlu, kultury i polityki."
 kie_secure_left_bank: "Umocnij kontrolę nad lewobrzeżną Ukrainą"
 kie_secure_left_bank_desc: "Umocnij kontrolę nad lewobrzeżną Ukrainą — zachowaj tradycje kulturowe Rusi i, ze zręczną biurokracją, uczyń tę bogatą ziemię uprawną podstawą Kijowa."
 kie_secure_right_bank: "Umocnij kontrolę nad prawobrzeżną Ukrainą"
 kie_secure_right_bank_desc: "Umocnij kontrolę nad prawobrzeżną Ukrainą — poprzez rozprzestrzenianie kultury ukraińskiej i wzmacnianie władzy korony uczyń prawobrzeżną Ukrainę rdzenną ziemią Kijowa."
 kie_conquer_chernihiv: "Wyprawa na Czernihów"
 kie_conquer_chernihiv_desc: "Podbij Czernihów, starożytne miasto księstwa ruskiego, i umocnij kontrolę nad lewobrzeżną Ukrainą."
 kie_conquer_poltava: "Marsz na Połtawę"
 kie_conquer_poltava_desc: "Podporządkuj kozacki bastion Połtawę i otwórz drzwi do Słobodzczyzny."
 kie_kyiv_metropolitan: "Metropolia Kijowska"
 kie_kyiv_metropolitan_desc: "Wznieś niezależną od Konstantynopola Metropolię Kijowską centrum kościoła prawosławnego Rusi."
 kie_unite_rus: "Zjednoczenie Rusi"
 kie_unite_rus_desc: "Zjednocz rozdrobnione przez inwazję mongolską księstwa ruskie pod Kijowem ponownie. „Matka miast ruskich” znów jaśnieje centrum całej Ukrainy."
 kie_secure_volhynia: "Zabezpiecz Wołyń"
 kie_secure_volhynia_desc: "Zabezpiecz Wołyń na granicy Rusi i Polski, by ustanowić wpływ zachodni."
 kie_conquer_lutsk: "Wyprawa na Łuck"
 kie_conquer_lutsk_desc: "Zajmij wołyńskie kluczowe miasto Łuck i uczyń je przyczółkiem na zachód."
 kie_conquer_galicia: "Najazd na Halicz"
 kie_conquer_galicia_desc: "Najedź Halicz — podbój tego regionu ustanawia pełną kontrolę nad Zachodnią Ukrainą."
 kie_red_ruthenia: "Podporządkuj Ruś Czerwoną"
 kie_red_ruthenia_desc: "Podporządkuj Ruś Czerwoną — podporządkowanie tego regionu wokół Lwowa dopełnia pełną kontrolę nad Zachodnią Ukrainą."
 kie_conquer_lviv: "Zajmij Lwów"
 kie_conquer_lviv_desc: "„Miasto lwa”, Lwów — podbij to miasto handlowe, zbudowane przez księcia Daniela, i zdobądź kontrolę nad handlem zachodnim."
 kie_conquer_podolia: "Posuń się na Podole"
 kie_conquer_podolia_desc: "Posuń się na Podole — podbij ten prawobrzeżny region rolniczy i zabezpiecz drogę do wybrzeża czarnomorskiego."
 kie_conquer_vinnytsia: "Zajęcie Winnicy"
 kie_conquer_vinnytsia_desc: "Zajmij Winnicę i ustanów rolniczy przyczółek prawobrzeżnej Ukrainy."
 kie_conquer_polesia: "Wyprawa na Polesie"
 kie_conquer_polesia_desc: "Podbij bagniste Polesie — wznieś północną linię obronną."
 kie_conquer_minsk: "Zajmij Mińsk"
 kie_conquer_minsk_desc: "Zajmij Mińsk, centrum Rusi Białej, by rozszerzyć wpływ północny."
 kie_cossack_host: "Wznieś wojsko kozackie"
 kie_cossack_host_desc: "Kozacy gromadzą się pod sztandarami Kijowa — włącz zaporoską tradycję kozacką do regularnej armii i zbuduj najlepszą kawalerię Rusi."
 kie_zaporizhzhia: "Sicz Zaporoska"
 kie_zaporizhzhia_desc: "Wznieś twierdzę Siczy Zaporoskiej za dnieprowymi porohami przyczółkiem do obrony stepu."
 kie_tatar_wars: "Wojny przeciw Tatarom"
 kie_tatar_wars_desc: "Prowadź decydującą bitwę przeciw Tatarom krymskim, panującym nad północnym Nadczarnomorzem. Wykorzystaj kawalerię kozacką, by się im przeciwstawić i odzyskać ukraiński step."
 kie_black_sea_steppe: "Podbij step nadczarnomorski"
 kie_black_sea_steppe_desc: "Zajmij step pontyjski — rozległe pastwisko czyni Kijów panem północnego Nadczarnomorza."
 kie_conquer_crimea: "Podbój Krymu"
 kie_conquer_crimea_desc: "Podbij półwysep Chanatu Krymskiego, by ustanowić zwierzchność na Morzu Czarnym. Zajmij genueńską placówkę handlową Kaffa."
 kie_black_sea_coast: "Wznieś flotę czarnomorską"
 kie_black_sea_coast_desc: "Wykorzystaj kozackie czajki (szybkie statki), schodzące Dnieprem ku Morzu Czarnemu — rzuć wyzwanie Osmanom i zdobądź czarnomorski szlak handlowy."
 kie_kyiv_pechersk: "Ławra Kijowsko-Peczerska"
 kie_kyiv_pechersk_desc: "Ławra Kijowsko-Peczerska, założona w 1051 roku — duchowe serce kościoła prawosławnego Rusi. Rozwiń ten klasztor i ogłoś Kijów centrum prawosławnym."
 kie_orthodox_revival: "Odrodzenie prawosławne"
 kie_orthodox_revival_desc: "Odbuduj zniszczony przez inwazję mongolską kościół prawosławny Rusi — wznieś katedry po całej ziemi i wskrześ „Świętą Ruś”."
 kie_grain_breadbasket: "Ukraina — spichlerz Europy"
 kie_grain_breadbasket_desc: "Żyzny czarnoziem — Ukraina, bogata ziemia uprawna, nazywana „spichlerzem Europy”. Zmaksymalizuj tę wydajność i umocnij podstawę żywnościową królestwa."
 kie_trade_routes: "Szlaki handlowe Kijowa"
 kie_trade_routes_desc: "„Droga z Waregów do Greków”, łącząca Bałtyk z Morzem Czarnym — ożyw ten starożytny szlak handlowy, który niósł dobrobyt Kijowowi."
 kie_hetmanate: "Hetmanat Kozacki"
 kie_hetmanate_desc: "Hetman — ustanowienie Hetmanatu Kozackiego pozwala Kijowowi wystąpić państwem z własnym systemem wojskowo-politycznym. Wyprzedź wielkie dokonanie Bohdana Chmielnickiego z 1648 roku."
 kie_literacy_culture: "Wspieraj edukację i kulturę"
 kie_literacy_culture_desc: "Duchowa tradycja Kijowa — jako pionier klasztornej kultury pisma i szkół katedralnych, wspieraj kulturę edukacji."
 kie_conquer_zhytomyr: "Rozwiń Żytomierz"
 kie_conquer_zhytomyr_desc: "Rozwiń Żytomierz, kluczowy punkt prawobrzeżnej Ukrainy, odpowiednimi budowlami w ważne miasto opornikowe."
 kie_salt_of_galicia: "Sól Halicza"
 kie_salt_of_galicia_desc: "Kopalnie soli Halicza — zajmij ten region, produkujący „białe złoto”, i zabezpiecz stałą dostawę tego ważnego towaru."
 kie_dev_poltava: "Rozwiń Połtawę"
 kie_dev_poltava_desc: "Rozwiń Połtawę, kluczowe miasto kozackiej lewobrzeżnej Ukrainy, we wschodni przyczółek."
 kie_beyond_donets: "Za Dońcem"
 kie_beyond_donets_desc: "Słobodzczyzna — osiedlaj kozackich chłopów wzdłuż Dońca i rozwijaj wschodni step."
 kie_conquer_moldavia: "Najazd na Mołdawię"
 kie_conquer_moldavia_desc: "Podbij Mołdawię na wybrzeżu czarnomorskim i osiągnij pełne włączenie w handel czarnomorski."
 kie_amber_route: "Szlak bursztynowy"
 kie_amber_route_desc: "Starożytny bursztynowy szlak handlowy z Bałtyku przez Łuck i Lwów na południe tworzy kręgosłup rusińskiej sieci handlowej."
 kie_fortress_line: "Linia twierdz"
 kie_fortress_line_desc: "Linia twierdz przeciw zagrożeniom ze stepu — system obronny od Zaporoża po Podole chroni ukraińskich chłopów i miasta."
 kie_great_kyiv: "Wielki Kijów"
 kie_great_kyiv_desc: "Przywróć Kijowowi wielkość, którą miał przed inwazją mongolską — odbuduj go wspaniałym miastem, którego złote kopuły odzyskają swój pierwotny blask."
 kie_ruthenian_culture: "Tożsamość kulturowa rusińska"
 kie_ruthenian_culture_desc: "Ustanów swoistą tożsamość ukraińsko-rusińską — swoistą tożsamość, w której łączą się język ukraiński, kultura kozacka i wiara prawosławna."
 kie_dev_chernihiv: "Rozwiń Czernihów"
 kie_dev_chernihiv_desc: "Rozwiń Czernihów centrum kultury i handlu na lewobrzeżnej Ukrainie."
 kie_conquer_wallachia: "Posuń się na Wołoszczyznę"
 kie_conquer_wallachia_desc: "Wołoszczyzna wzdłuż Dunaju — podbij ten region przyczółkiem do Bałkanów i dopełnij kontrolę nad wybrzeżem czarnomorskim."
 kie_cossack_cavalry: "Elita kawalerii kozackiej"
 kie_cossack_cavalry_desc: "Kawaleria kozacka — zarówno lekka, jak i ciężka, wyniesiona do oddziałów elitarnych. Pokonaj Tatarów ich mobilnością i siłą bojową."
 kie_kyiv_academy: "Akademia Kijowsko-Mohylańska"
 kie_kyiv_academy_desc: "Wznieś Akademię Kijowsko-Mohylańską przed jej założeniem w 1632 roku — jeden z najstarszych uniwersytetów Europy Wschodniej. Urzeczywistnij duchowe i kulturalne odrodzenie Rusi."
 kie_conquer_krakow: "Zajmij Kraków"
 kie_conquer_krakow_desc: "Kraków, historyczna stolica Królestwa Polskiego — podbój tego miasta z Wawelem znacznie rozszerza wpływ na Europę Środkową."
 kie_navy_dnipro: "Flota dnieprowa"
 kie_navy_dnipro_desc: "Wykorzystaj kozackie żaglowe czajki od Dniepru po Morze Czarne — Flota dnieprowa strzeże handlu czarnomorskiego."
 kie_protect_orthodoxy: "Obrońca prawosławia"
 kie_protect_orthodoxy_desc: "Po upadku Konstantynopola Kijów występuje strażnikiem świata prawosławnego — ustanów najwyższą władzę kościoła prawosławnego Rusi."
 kie_conquer_vilnius: "Zajęcie Wilna"
 kie_conquer_vilnius_desc: "Wilno, stolica Wielkiego Księstwa Litewskiego — zajęcie tego miasta kończy litewską zwierzchność nad Rusią."
 kie_western_alliance: "Sojusz z Zachodem"
 kie_western_alliance_desc: "Zbuduj stosunki dyplomatyczne z Polską, Węgrami i Świętym Cesarstwem Rzymskim, by ustanowić sojusz zachodni przeciw zagrożeniom ze wschodu."
 kie_silver_route: "Szlak srebrny"
 kie_silver_route_desc: "Wschodnie srebro płynie przez Kijów wzdłuż Dniepru na zachód — ustanów pozycję Kijowa w handlu międzynarodowym."
 kie_ruthenian_army: "Reforma armii rusińskiej"
 kie_ruthenian_army_desc: "Połącz tradycję kozacką z zachodnią technologią wojskową — armia rusińska rządzi najlepszą siłą Europy Wschodniej."
 kie_conquer_warsaw: "Zajęcie Warszawy"
 kie_conquer_warsaw_desc: "Warszawa, stolica Polski — dopełnij długą walkę z Rzeczpospolitą Obojga Narodów."
 kie_beeswax_honey: "Handel woskiem i miodem"
 kie_beeswax_honey_desc: "Ukraiński wosk — kluczowy towar, dostarczany cerkwiom prawosławnym i na rynki zachodnioeuropejskie."
 kie_form_ruthenia: "Utwórz Rutenię"
 kie_form_ruthenia_desc: "Ogłoś utworzenie państwa „Rutenia” — obejmującego Ukrainę, Białoruś i Ruś Zachodnią. Marzenie o jedności Rusi od czasów inwazji mongolskiej wreszcie spełnione."
 kie_grand_principality: "Wielkie Księstwo Kijowskie"
 kie_grand_principality_desc: "„Wielkie Księstwo Kijowskie” — ten tytuł świadczy o blasku starożytnej Rusi Kijowskiej. Kijów, gdzie łączą się kozacka siła wojskowa, władza prawosławna i kultura rusińska, rządzi wielką potęgą Europy Wschodniej."
 kie_events.1.t: "Kijów się budzi — odbudowa matki miast ruskich"
 kie_events.1.d: "Nad wzgórzami wzdłuż Dniepru — złote kopuły Soboru Świętej Zofii jaśnieją na kijowskim niebie.\n\nW 1337 roku Księstwo Kijowskie jest małe, lecz niesie ciężar historii jako serce Rusi Kijowskiej. „Matka wszystkich miast ruskich” — ten tytuł określa misję Kijowa.\n\nLitwa, Polska i Tatarzy napierają ze wszystkich stron, lecz dary Dniepru, żyzny czarnoziem i duch kozacki wspierają Kijów.\n\nMnisi Ławry Peczerskiej modlą się — „Powstań znów, o Rusi”. Odpowiedz na tę modlitwę."
 kie_events.1.a: "Przywróć chwałę Kijowa!"
 kie_events.20.t: "Proklamacja Hetmanatu Kozackiego"
 kie_events.20.d: "Kozacy zaporoscy stoją w szeregu pod sztandarem hetmana — Wielki Książę Kijowski formalnie włącza siłę kozacką do systemu państwowego i ogłasza „Hetmanat Kozacki”. Ten swoisty system wojskowo-państwowy określi przyszłość Rusi."
 kie_events.20.a: "Niech żyje Hetmanat Kozacki! Niech żyje wolna Ukraina!"
 kie_events.60.t: "Utworzenie Rusi — nowa potęga Europy Wschodniej"
 kie_events.60.d: "Ukraina, Białoruś i Halicz pod jednym sztandarem — jednolite państwo wschodniosłowiańskie „Rutenia” występuje nową wielką potęgą Europy Wschodniej. Wszystkie ludy Rusi zbierają się pod złotymi kopułami Kijowa."
 kie_events.60.a: "Niech żyje Rutenia! Niech żyje Kijów!"
 kie_events.99.t: "Wielkie Księstwo Kijowskie — odrodzenie chwały Rusi"
 kie_events.99.d: "„Wielkie Księstwo Kijowskie” — ten tytuł rozbrzmiewa wzdłuż brzegów Dniepru. Królestwo, gdzie łączą się kozacka siła wojskowa, władza prawosławna i kultura rusińska, rządzi panem Europy Wschodniej. Ruś Kijowska, zniszczona przez Mongołów, odrodzona w nowej formie — matka miast ruskich, Kijów, znów jaśnieje."
 kie_events.99.a: "Niech żyje Wielkie Księstwo Kijowskie! Niech żyje chwała Rusi na wieki!"
 STATIC_MODIFIER_NAME_kie_kyiv_dev_mod: "Złote miasto nad Dnieprem"
 STATIC_MODIFIER_DESC_kie_kyiv_dev_mod: "Kijów rozwinięty wielkim miastem, godnym tytułu „matka miast ruskich”."
 STATIC_MODIFIER_NAME_kie_left_bank_mod: "Lewobrzeżna Ukraina zabezpieczona"
 STATIC_MODIFIER_DESC_kie_left_bank_mod: "Lewobrzeżna Ukraina zabezpieczona — wschodni Dniepr pod kijowskimi rządami."
 STATIC_MODIFIER_NAME_kie_right_bank_mod: "Prawobrzeżna Ukraina zabezpieczona"
 STATIC_MODIFIER_DESC_kie_right_bank_mod: "Prawobrzeżna Ukraina zabezpieczona — zachodni Dniepr zjednoczony ze wschodem."
 STATIC_MODIFIER_NAME_kie_poltava_mod: "Kozacki bastion zabezpieczony"
 STATIC_MODIFIER_DESC_kie_poltava_mod: "Kozacki bastion Połtawa zabezpieczony — granica stepowa ustabilizowana."
 STATIC_MODIFIER_NAME_kie_metropolitan_mod: "Serce prawosławia Rusi"
 STATIC_MODIFIER_DESC_kie_metropolitan_mod: "Metropolia Kijowska przywrócona sercem prawosławia Rusi."
 STATIC_MODIFIER_NAME_kie_volhynia_mod: "Spichlerz Wołynia"
 STATIC_MODIFIER_DESC_kie_volhynia_mod: "Żyzne równiny Wołynia stają się spichlerzem państwa kijowskiego."
 STATIC_MODIFIER_NAME_kie_lutsk_mod: "Klucz Rusi Zachodniej"
 STATIC_MODIFIER_DESC_kie_lutsk_mod: "Łuck — klucz Rusi Zachodniej — zabezpieczony i otwiera drogę do Halicza."
 STATIC_MODIFIER_NAME_kie_galicia_mod: "Najazd na Halicz"
 STATIC_MODIFIER_DESC_kie_galicia_mod: "Halicz zdobyty, a dziedzictwo Księstwa Halicko-Wołyńskiego odrodzone."
 STATIC_MODIFIER_NAME_kie_red_ruthenia_mod: "Ruś Czerwona podporządkowana"
 STATIC_MODIFIER_DESC_kie_red_ruthenia_mod: "Ruś Czerwona podporządkowana i zjednoczona z Ukrainą."
 STATIC_MODIFIER_NAME_kie_lviv_mod: "Dobrobyt miasta lwa"
 STATIC_MODIFIER_DESC_kie_lviv_mod: "Lwów — miasto lwa — prosperuje bramą handlu zachodniego."
 STATIC_MODIFIER_NAME_kie_podolia_mod: "Czarnoziemne pola uprawne"
 STATIC_MODIFIER_DESC_kie_podolia_mod: "Czarnoziemne pola uprawne Podola zabezpieczone — rolnicze bogactwo płynie do Kijowa."
 STATIC_MODIFIER_NAME_kie_vinnytsia_mod: "Bastion prawobrzeża"
 STATIC_MODIFIER_DESC_kie_vinnytsia_mod: "Winnica służy jako bastion prawobrzeżnej Ukrainy."
 STATIC_MODIFIER_NAME_kie_polesia_mod: "Bagienny wał obronny"
 STATIC_MODIFIER_DESC_kie_polesia_mod: "Bagna Polesia tworzą naturalny wał obronny przeciw inwazjom z północy."
 STATIC_MODIFIER_NAME_kie_minsk_mod: "Serce Rusi Białej"
 STATIC_MODIFIER_DESC_kie_minsk_mod: "Mińsk — serce Rusi Białej — wpada pod kontrolę kijowską."
 STATIC_MODIFIER_NAME_kie_cossack_mod: "Miecz kozacki"
 STATIC_MODIFIER_DESC_kie_cossack_mod: "Miecz kozacki wykuwa siłę Kijowa w elitarną armię stepową."
 STATIC_MODIFIER_NAME_kie_zaporizhzhia_mod: "Wolność za porohami"
 STATIC_MODIFIER_DESC_kie_zaporizhzhia_mod: "Za dnieprowymi porohami kozacy zaporoscy poświęcają swe miecze Kijowowi."
 STATIC_MODIFIER_NAME_kie_tatar_wars_mod: "Walka przeciw Tatarom"
 STATIC_MODIFIER_DESC_kie_tatar_wars_mod: "Wyprawy przeciw Tatarom hartują kawalerię Kijowa w nieustraszonych wojowników stepowych."
 STATIC_MODIFIER_NAME_kie_steppe_mod: "Zdobywca stepu"
 STATIC_MODIFIER_DESC_kie_steppe_mod: "Step podbity — Kijów rządzi panem pontyjskich pastwisk."
 STATIC_MODIFIER_NAME_kie_crimea_mod: "Zwierzchność nad Morzem Czarnym"
 STATIC_MODIFIER_DESC_kie_crimea_mod: "Zwierzchność nad Morzem Czarnym osiągnięta — Krym pod kijowskimi rządami."
 STATIC_MODIFIER_NAME_kie_black_sea_mod: "Droga do Morza Czarnego"
 STATIC_MODIFIER_DESC_kie_black_sea_mod: "Droga do Morza Czarnego otwarta — Kijów zyskuje dostęp do handlu śródziemnomorskiego."
 STATIC_MODIFIER_NAME_kie_lavra_mod: "Ławra Peczerska"
 STATIC_MODIFIER_DESC_kie_lavra_mod: "Ławra Kijowsko-Peczerska przywrócona duszą prawosławia Rusi."
 STATIC_MODIFIER_NAME_kie_orthodox_mod: "Rusińskie odrodzenie prawosławne"
 STATIC_MODIFIER_DESC_kie_orthodox_mod: "Rusińskie prawosławie odrodzone — Kijów znów pełni swą rolę strażnika wiary."
 STATIC_MODIFIER_NAME_kie_grain_mod: "Spichlerz Europy"
 STATIC_MODIFIER_DESC_kie_grain_mod: "Żyzny czarnoziem Ukrainy czyni Kijów spichlerzem Europy."
 STATIC_MODIFIER_NAME_kie_trade_mod: "Dnieprowy szlak handlowy"
 STATIC_MODIFIER_DESC_kie_trade_mod: "Dnieprowy szlak handlowy od Bałtyku po Morze Czarne płynie przez kijowskie ręce."
 STATIC_MODIFIER_NAME_kie_salt_mod: "Białe złoto Halicza"
 STATIC_MODIFIER_DESC_kie_salt_mod: "Białe złoto Halicza — sól — zmonopolizowane na korzyść królestwa."
 STATIC_MODIFIER_NAME_kie_poltava_city_mod: "Połtawa rozwinięta"
 STATIC_MODIFIER_DESC_kie_poltava_city_mod: "Połtawa rozwinięta w prosperujące miasto ukraińskiego stepu."
 STATIC_MODIFIER_NAME_kie_sloboda_mod: "Wolna Ukraina zagospodarowana"
 STATIC_MODIFIER_DESC_kie_sloboda_mod: "Wolne osady ukraińskie zagospodarowują wschodnie pogranicze pod kijowską ochroną."
 STATIC_MODIFIER_NAME_kie_moldavia_mod: "Mołdawia podbita"
 STATIC_MODIFIER_DESC_kie_moldavia_mod: "Wiatr Morza Czarnego wieje nad twierdzami Mołdawii, a porty wybrzeża są teraz pod sztandarem Kijowa."
 STATIC_MODIFIER_NAME_kie_amber_mod: "Szlak bursztynowy"
 STATIC_MODIFIER_DESC_kie_amber_mod: "Szlak bursztynowy z Bałtyku po Morze Czarne płynie przez Kijów."
 STATIC_MODIFIER_NAME_kie_fortress_mod: "Stepowa linia obronna"
 STATIC_MODIFIER_DESC_kie_fortress_mod: "Łańcuch twierdz stepowych chroni południową granicę przed najazdami tatarskimi."
 STATIC_MODIFIER_NAME_kie_great_kyiv_mod: "Matka miast ruskich"
 STATIC_MODIFIER_DESC_kie_great_kyiv_mod: "Kijów odzyskał swój tytuł matki miast ruskich — wiecznej stolicy Ukrainy."
 STATIC_MODIFIER_NAME_kie_culture_mod: "Rusiński rozkwit kulturalny"
 STATIC_MODIFIER_DESC_kie_culture_mod: "Kultura rusińska rozkwita — Kijów staje się latarnią nauki i sztuki."
 STATIC_MODIFIER_NAME_kie_chernihiv_city_mod: "Czernihów prosperuje"
 STATIC_MODIFIER_DESC_kie_chernihiv_city_mod: "Czernihów prosperuje wiodącym miastem północno-wschodniej Ukrainy."
 STATIC_MODIFIER_NAME_kie_wallachia_mod: "Wołoszczyzna podbita"
 STATIC_MODIFIER_DESC_kie_wallachia_mod: "Wołoszczyzna podbita i przywiedziona pod zwierzchnictwo kijowskie."
 STATIC_MODIFIER_NAME_kie_cavalry_mod: "Elita kawalerii kozackiej"
 STATIC_MODIFIER_DESC_kie_cavalry_mod: "Kawaleria kozacka wykuta w siłę elitarną — dumę oręża kijowskiego."
 STATIC_MODIFIER_NAME_kie_academy_mod: "Sale nauki Rusi"
 STATIC_MODIFIER_DESC_kie_academy_mod: "Akademia Kijowsko-Mohylańska się otwiera — sale nauki Rusi jaśnieją nad Europą Wschodnią."
 STATIC_MODIFIER_NAME_kie_krakow_mod: "Miasto Jagiellonów"
 STATIC_MODIFIER_DESC_kie_krakow_mod: "Sztandar Kijowa powiewa z wieży Wawelu, a miasto Jagiellonów słyszy imię swego nowego władcy."
 STATIC_MODIFIER_NAME_kie_navy_mod: "Flota dnieprowa"
 STATIC_MODIFIER_DESC_kie_navy_mod: "Flota dnieprowa zbudowana — kijowska potęga morska występuje na Morzu Czarnym."
 STATIC_MODIFIER_NAME_kie_protector_mod: "Obrońca prawosławia"
 STATIC_MODIFIER_DESC_kie_protector_mod: "Kijów uznany obrońcą chrześcijan prawosławnych całej Europy Wschodniej."
 STATIC_MODIFIER_NAME_kie_vilnius_mod: "Koniec zwierzchności litewskiej"
 STATIC_MODIFIER_DESC_kie_vilnius_mod: "Zwierzchność litewska nad ziemiami rusińskimi skończona — Kijów odzyskuje wschód."
 STATIC_MODIFIER_NAME_kie_diplomacy_mod: "Więzy z Zachodem"
 STATIC_MODIFIER_DESC_kie_diplomacy_mod: "Posłowie Wielkiego Księcia Kijowskiego stoją w halach zachodnich dworów, a jego imię wpisane jest teraz w księgi zagranicznych pisarzy."
 STATIC_MODIFIER_NAME_kie_silver_route_mod: "Szlak srebrny"
 STATIC_MODIFIER_DESC_kie_silver_route_mod: "Szlak srebrny z zachodu płynie do skarbca Kijowa."
 STATIC_MODIFIER_NAME_kie_ruthenian_army_mod: "Narodziny armii rusińskiej"
 STATIC_MODIFIER_DESC_kie_ruthenian_army_mod: "Armia rusińska narodzona — zdyscyplinowana siła, łącząca kawalerię kozacką i szlachecką."
 STATIC_MODIFIER_NAME_kie_warsaw_mod: "Uspokojenie Polski"
 STATIC_MODIFIER_DESC_kie_warsaw_mod: "Polska uspokojona — Warszawa uznaje zwierzchnictwo Kijowa."
 STATIC_MODIFIER_NAME_kie_beeswax_mod: "Wosk i miód"
 STATIC_MODIFIER_DESC_kie_beeswax_mod: "Wosk i miód z ukraińskich lasów wzbogacają handel kijowski."
 STATIC_MODIFIER_NAME_kie_zhytomyr_mod: "Węzeł handlowy Żytomierz"
 STATIC_MODIFIER_DESC_kie_zhytomyr_mod: "Żytomierz rozwija się prosperującym węzłem handlowym prawobrzeżnej Ukrainy."
 STATIC_MODIFIER_NAME_kie_grand_principality_mod: "Wielkie Księstwo Kijowskie"
 STATIC_MODIFIER_DESC_kie_grand_principality_mod: "Wielkie Księstwo Kijowskie proklamowane — najpotężniejsza siła Europy Wschodniej."
 STATIC_MODIFIER_NAME_kie_literacy_mod: "Piśmienność w Kijowie"
 STATIC_MODIFIER_DESC_kie_literacy_mod: "Rękopisy ze skryptorium Ławry Peczerskiej niesione są do szkół, a dzieci Kijowa uczą się swych liter."
 kie_conquer_smolensk: "Wyprawa na Smoleńsk"
 kie_conquer_smolensk_desc: "Zajmij Smoleńsk, „klucz do Rusi” i skrzyżowanie komunikacji wschód-zachód — ustanów wpływ na Moskwę i Polskę. Wykorzystaj Czernihów jako przyczółek, by opanować cały region Smoleńska."
 STATIC_MODIFIER_NAME_kie_smolensk_mod: "Smoleńsk — skrzyżowanie handlu wschód-zachód"
 STATIC_MODIFIER_DESC_kie_smolensk_mod: "Smoleńsk zabezpieczony ważnym węzłem wschód-zachód."
 STATIC_MODIFIER_NAME_kie_chernihiv_mod: "Czernihów — bastion lewobrzeża"
 STATIC_MODIFIER_DESC_kie_chernihiv_mod: "Poborca podatkowy Kijowa, stojąc na rynku Czernihowa, otwiera księgi zboża lewobrzeża Dniepru."
 kie_build_sevastopol: "Budowa bazy morskiej Sewastopol"
 kie_build_sevastopol_desc: "Zbuduj rusińską bazę morską w naturalnym porcie Teodoro — ten bastion morski, panujący nad Morzem Czarnym, stanie się portem macierzystym floty kozackiej."
 kie_build_odesa: "Budowa portu Odessa"
 kie_build_odesa_desc: "Zbuduj największy port handlowy Rusi na wybrzeżu Chadżibeju — ten port, łączący handel czarnomorski ze Śródziemnym, stanie się żywotną arterią handlu rusińskiego."
 STATIC_MODIFIER_NAME_kie_sevastopol_mod: "Baza morska Sewastopol"
 STATIC_MODIFIER_DESC_kie_sevastopol_mod: "Baza morska Sewastopol, panująca nad Morzem Czarnym, wzniesiona morskim bastionem Rusi."
 STATIC_MODIFIER_NAME_kie_odesa_mod: "Port handlowy Odessa"
 STATIC_MODIFIER_DESC_kie_odesa_mod: "Odessa, centrum handlu czarnomorskiego, zbudowana — handel morski Rusi prosperuje."
 STATIC_MODIFIER_NAME_kie_unite_rus_mod: "Dziedzictwo zjednoczenia"
 STATIC_MODIFIER_DESC_kie_unite_rus_mod: "Książęta Rusi zbierają się na dworze jednego Wielkiego Księcia, a urzędnicy Kijowa wysyłają rozkazy w tej samej formie do pisarzy każdej ziemi."
