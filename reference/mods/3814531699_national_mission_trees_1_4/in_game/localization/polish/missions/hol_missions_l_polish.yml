l_polish:
 hol_holland_mission_pack: "Prawdziwa Wolność — od Hrabstwa Holandii do Zjednoczonych Prowincji"
 hol_holland_mission_pack_DESCRIPTION:0 "Hrabstwo Holandii, rządzone przez dom Avesnes — zatriumfuj nad Ligą Hanzeatycką, wchłoń Hainaut i Brabancję, wywalcz niepodległość od tyranii hiszpańskiej i zbuduj złoty wiek jako prawdziwa republika bez monarchy."
 hol_holland_mission_pack_CRITERIA_DESCRIPTION:0 "Zjednocz hrabstwo, wywalcz niepodległość i osiągnij złoty wiek jako republika pod suwerennością Stanów."
 hol_holland_mission_pack_BUTTON_TOOLTIP:0 "Od małego hrabstwa do zjednoczonej republiki handlu i wolności."
 hol_holland_mission_pack_BUTTON_DETAILS:0 "„Jedność daje siłę” — zbuduj prawdziwą republikę bez monarchy w całych Niderlandach!"
 hol_county_of_holland: "Hrabstwo Holandii"
 hol_county_of_holland_desc: "Hrabstwo Holandii, w sercu Niderlandów, obdarzone drogami wodnymi i handlem — starzejący się hrabia Wilhelm III z domu Avesnes zbliża się do końca swego panowania."
 hol_secure_dordrecht: "Rozwiń Dordrecht"
 hol_secure_dordrecht_desc: "Dordrecht, starożytne miasto handlowe u zbiegu Renu i Mozy — zbuduj na jego nadanym prawie składu i przynieś dalszy rozwój."
 hol_hoekse_kabeljauwse: "Haczyki i Dorsze"
 hol_hoekse_kabeljauwse_desc: "Szlachetna frakcja Haczyków i miejska frakcja Dorszy — stłum ten wewnętrzny spór, dzielący hrabstwo z powodu sukcesji hrabiowskiej, i ustanów stabilne rządy."
 hol_zeeland_unification: "Zjednocz Zelandię"
 hol_zeeland_unification_desc: "Zelandia, kraina wysp, rozsianych po Morzu Północnym — włącz ten region w domenę hrabstwa."
 hol_frisian_freedom: "Wolność Fryzji Zachodniej"
 hol_frisian_freedom_desc: "Lud Fryzji Zachodniej, który ceni swą autonomię — nadaj im wolność pod sztandarem hrabstwa."
 hol_utrecht_relations: "Stosunki z Utrechtem"
 hol_utrecht_relations_desc: "Biskupstwo Utrechtu, dzierżące rozległą władzę świecką — zbuduj stosunki z tym sąsiadem pod naszym wpływem."
 hol_wittelsbach_inheritance: "Unia z Hainaut"
 hol_wittelsbach_inheritance_desc: "Poprzez księżniczkę Małgorzatę, poślubioną cesarzowi Ludwikowi IV, pogłębij więź z sąsiednim Hrabstwem Hainaut — poprzez małżeństwo, podporządkowanie lub jego wygaśnięcie zjednocz Holandię, Zelandię i Hainaut pod jednym sztandarem."
 hol_herring_industry: "Rozwiń przemysł śledziowy"
 hol_herring_industry_desc: "Łowisko śledzi, znane jako „Wielkie Rybołówstwo” (grote visserij) — rozwiń tę wielką gałąź przemysłu dalej, wraz ze sztuką solenia."
 hol_hansa_rivalry: "Rywalizacja z Hanzą"
 hol_hansa_rivalry_desc: "Liga Hanzeatycka, dominująca w handlu bałtyckim — uzbrojony w tani fracht i wydajne statki kupieckie, zatriumfuj nad tą czcigodną ligą."
 hol_amsterdam_rise: "Wzrost Amsterdamu"
 hol_amsterdam_rise_desc: "Amsterdam, mała wioska rybacka nad IJ — rozwiń to miejsce w wielki węzeł handlu północnomorskiego."
 hol_moedernegotie: "Handel Matka (Moedernegotie)"
 hol_moedernegotie_desc: "Bałtycki handel zbożem — opanuj ten handel, zwany „matką wszelkiego handlu”, i uczyń go podstawą dobrobytu."
 hol_contest_brabant: "Ambicje wobec Brabancji"
 hol_contest_brabant_desc: "Księstwo Brabancji, druga wielka potęga Niderlandów — zwróć oko ambicji ku tej ziemi."
 hol_absorb_brabant: "Wchłonięcie Brabancji"
 hol_absorb_brabant_desc: "Zaanektuj lub podporządkuj Księstwo Brabancji — dowiedź, że Holandia, nie Brabancja, jest panem Niderlandów."
 hol_reformation_choice: "Wybór Reformacji"
 hol_reformation_choice_desc: "Nauki Lutra i Kalwina wstrząsają Niderlandami — stojąc na tym rozdrożu wiary, jaką ścieżkę wybierzemy?"
 hol_calvinist_merchants: "Kupcy kalwińscy"
 hol_calvinist_merchants_desc: "Kalwinizm, głoszący wiarę oszczędną i zdyscyplinowaną — przyjmij to wyznanie, które zdobyło serca obywateli-kupców, jako religię państwową."
 hol_union_of_utrecht: "Unia Utrechcka"
 hol_union_of_utrecht_desc: "Unia Utrechcka, utworzona przez północne prowincje Niderlandów — stań jako jej rdzeń i stawić czoła wspólnemu wrogowi."
 hol_watergeuzen: "Żebracy Morscy (Watergeuzen)"
 hol_watergeuzen_desc: "Korsarze, nazywający siebie „Żebrakami Morskimi” — ich wyczyny przebijają dziury w hiszpańskiej dominacji na morzach."
 hol_dutch_republic_proper: "Ustanów prawdziwą republikę"
 hol_dutch_republic_proper_desc: "Federacja siedmiu prowincji, stojących jako równe — ustanów tu prawdziwą republikę kupców i obywateli, bez monarchy."
 hol_east_india_company: "Załóż Kompanię Wschodnioindyjską"
 hol_east_india_company_desc: "Załóż Zjednoczoną Kompanię Wschodnioindyjską (VOC), dążąc do monopolu na handel azjatycki."
 hol_amsterdam_bank: "Bank Amsterdamski"
 hol_amsterdam_bank_desc: "Aby zaprowadzić porządek w chaosie rywalizujących walut, załóż Bank Wymiany (Wisselbank) i zbuduj stabilny system kredytowy."
 hol_stock_exchange: "Giełda Amsterdamska"
 hol_stock_exchange_desc: "Pierwsza na świecie giełda papierów wartościowych, gdzie kupowane i sprzedawane są udziały — uczyń to miejsce centrum finansów europejskich."
 hol_dutch_golden_age: "Holenderski Złoty Wiek"
 hol_dutch_golden_age_desc: "Rembrandt, Vermeer i kwitnący handel — osiągnij zenit „Holenderskiego Złotego Wieku”."
 hol_estates_of_holland: "Stany Holandii"
 hol_estates_of_holland_desc: "Stany Holandii, złożone z przedstawicieli miast — uczyń to zgromadzenie rdzeniem rządów republikańskich."
 hol_regent_oligarchy: "Oligarchia regentów"
 hol_regent_oligarchy_desc: "„Regenten”, bogate rodziny patrycjuszy kupieckich — ustanów ich oligarchiczne rządy jako prawdziwą strukturę rządzącą republiki."
 hol_stadtholderless_era: "Epoka bezstadhouderska (Prawdziwa Wolność)"
 hol_stadtholderless_era_desc: "Epoka bez stadhoudera, gdzie Stany dzierżą suwerenność — ucieleśnij „Prawdziwą Wolność”, ogłoszoną przez Johana de Witta."
 hol_states_sovereignty: "Ustanów suwerenność Stanów"
 hol_states_sovereignty_desc: "Republika bez monarchy — ustanów naturę jej suwerenności jako trwałą instytucję."
 hol_anglo_dutch_rivalry: "Rywalizacja anglo-holenderska"
 hol_anglo_dutch_rivalry_desc: "Rywalizacja z Anglią o zwierzchność w handlu morskim — stawić czoła tej rywalizacji, symbolizowanej przez Akty Nawigacyjne."
 hol_navigation_act_response: "Odpowiedz na Akt Nawigacyjny"
 hol_navigation_act_response_desc: "Angielski Akt Nawigacyjny — przeciwstaw się temu prawu protekcjonistycznemu i broń naszej floty kupieckiej."
 hol_channel_trade_dominance: "Dominacja w handlu kanałowym"
 hol_channel_trade_dominance_desc: "Cieśnina, łącząca Morze Północne i Atlantyk — ustanów zwierzchność morską i handlową nad tą żywotną drogą wodną."
 hol_french_relations: "Stosunki z Francją"
 hol_french_relations_desc: "Ambicje Króla Słońce, Ludwika XIV — zwróć baczną uwagę na stosunki z tym potężnym sąsiadem."
 hol_rampjaar_survival: "Przetrwaj Rok Klęski (Rampjaar)"
 hol_rampjaar_survival_desc: "W 1672 roku, uderzony jednoczesną inwazją z Anglii i Francji — przetrwaj ten „Rok Klęski”, zagrażający samemu istnieniu narodu."
 hol_glorious_revolution: "Zwycięstwo nad Królem Słońce"
 hol_glorious_revolution_desc: "Przetrwawszy Rok Klęski, Republika przechodzi teraz do ofensywy — pchnij nasze armie głęboko w ziemię francuską i zmuś Króla Słońce, Ludwika XIV, zapłacić za swe ambicje."
 hol_united_provinces: "Zjednoczone Prowincje Niderlandów"
 hol_united_provinces_desc: "Od podstaw hrabstwa, przez wojnę o niepodległość i złoty wiek, prawdziwa republika jest tu ukończona."
 hol_events.2.t: "Proklamacja Zjednoczonych Prowincji"
 hol_events.2.d: "Federacja siedmiu prowincji, stojących jako równe — prawdziwa republika kupców i obywateli, bez monarchy, bierze pierwszy oddech."
 hol_events.2.a: "Chwała Republice!"
 hol_events.3.t: "Rok Klęski (Rampjaar)"
 hol_events.3.d: "1672 — jednoczesna inwazja Francji, Anglii, Münsteru i Kolonii. Opisani jako „lud nierozsądny, rząd bezradny, kraj zrozpaczony”, przetrwaliśmy ten kryzys."
 hol_events.3.a: "Republika przetrwała!"
 hol_events.4.t: "Zwycięstwo nad Królem Słońce"
 hol_events.4.d: "Pchnąwszy się głęboko w terytorium francuskie, nasze armie wreszcie złamały ambicje Ludwika XIV. Imię Republiki będzie teraz szeroko znane jako wielka potęga Europy."
 hol_events.4.a: "Chwała Republice!"
 hol_events.5.t: "Rozdroże dla Stanów Holandii"
 hol_events.5.d: "Stany stoją przed brzemiennym w skutki wyborem co do formy rządów republiki — skłonić się ku porządkowi monarchicznemu pod stadhouderem, czy mocno trzymać się prawdziwej republiki obywateli i kupców."
 hol_events.5.a: "Skoncentrować władzę w domu Orańskim"
 hol_events.5.b: "Utrzymać republikę pod suwerennością Stanów"
 hol_events.99.t: "Zjednoczone Prowincje ukończone"
 hol_events.99.d: "Długa droga, rozpoczęta w Hrabstwie Holandii, przez wojnę o niepodległość i złoty wiek, jest tu ukończona jako prawdziwa republika."
 hol_events.99.a: "Niech żyją Zjednoczone Prowincje!"
 STATIC_MODIFIER_NAME_hol_county_mod: "Hrabstwo Holandii"
 STATIC_MODIFIER_DESC_hol_county_mod: "Pamięć o hrabstwie, wychowanym przez drogi wodne i handel, wciąż żyje jako duma ludu."
 STATIC_MODIFIER_NAME_hol_dordrecht_mod: "Dordrecht rozwinięty"
 STATIC_MODIFIER_DESC_hol_dordrecht_mod: "U zbiegu Renu i Mozy statki kupieckie Dordrechtu nigdy nie przestają załadunku i rozładunku swego towaru."
 STATIC_MODIFIER_NAME_hol_hoekse_mod: "Haczyki i Dorsze"
 STATIC_MODIFIER_DESC_hol_hoekse_mod: "Ci, którzy niegdyś wznosili sztandary Haczyków i Dorszy, maszerują teraz razem w szeregach hrabiego."
 STATIC_MODIFIER_NAME_hol_zeeland_mod: "Zelandia zjednoczona"
 STATIC_MODIFIER_DESC_hol_zeeland_mod: "Na pochylniach Middelburga drewno, zebrane z wysp, przybiera kształt kadłub po kadłubie."
 STATIC_MODIFIER_NAME_hol_frisian_mod: "Wolność Fryzji Zachodniej"
 STATIC_MODIFIER_DESC_hol_frisian_mod: "„Fryzowie nie mają pana” — ten dumny duch autonomii zbiera wielu w szeregi, gdy godzina tego wymaga."
 STATIC_MODIFIER_NAME_hol_utrecht_mod: "Stosunki z Utrechtem"
 STATIC_MODIFIER_DESC_hol_utrecht_mod: "Dzwony wież Utrechtu wybijają cichą, serdeczną sąsiedzkość między hrabstwem a biskupstwem."
 STATIC_MODIFIER_NAME_hol_wittelsbach_mod: "Unia z Hainaut"
 STATIC_MODIFIER_DESC_hol_wittelsbach_mod: "Nowa linia władców z Bawarii wprowadza porządek w ziemiach Holandii, Zelandii i Hainaut."
 STATIC_MODIFIER_NAME_hol_absorb_brabant_mod: "Brabancja wchłonięta"
 STATIC_MODIFIER_DESC_hol_absorb_brabant_mod: "Herb Holandii wisi teraz na dworze w Brukseli, a południowe bogactwo płynie stale do Amsterdamu."
 STATIC_MODIFIER_NAME_hol_herring_mod: "Przemysł śledziowy rozwinięty"
 STATIC_MODIFIER_DESC_hol_herring_mod: "Floty, załadowane solonym śledziem, wracają do domu przez fale Morza Północnego, jedna po drugiej."
 STATIC_MODIFIER_NAME_hol_hansa_rivalry_mod: "Rywalizacja z Hanzą"
 STATIC_MODIFIER_DESC_hol_hansa_rivalry_mod: "Podczas gdy kupcy z Lubeki marszczą brwi, nasze tanie stawki frachtowe zdobywają spedytorów po całym Bałtyku."
 STATIC_MODIFIER_NAME_hol_amsterdam_rise_mod: "Wzrost Amsterdamu"
 STATIC_MODIFIER_DESC_hol_amsterdam_rise_mod: "Niegdyś mała wioska rybacka nad IJ, Amsterdam przyciąga teraz żaglowce z każdego zakątka świata."
 STATIC_MODIFIER_NAME_hol_moedernegotie_mod: "Handel Matka"
 STATIC_MODIFIER_DESC_hol_moedernegotie_mod: "Zboże, przywożone z Bałtyku, utrzymuje nasze stoły i nasz skarbiec pełne nawet w latach głodu."
 STATIC_MODIFIER_NAME_hol_reformation_mod: "Wybór Reformacji"
 STATIC_MODIFIER_DESC_hol_reformation_mod: "Pośród dzwonów kościelnych ciche debaty o starej i nowej wierze nigdy nie ustają na placach targowych."
 STATIC_MODIFIER_NAME_hol_calvinist_mod: "Kupcy kalwińscy"
 STATIC_MODIFIER_DESC_hol_calvinist_mod: "Lampy płoną do późna w nocy w domach kupieckich, gdzie Biblia jest czytana i rozważana z pierwszej ręki."
 STATIC_MODIFIER_NAME_hol_union_utrecht_mod: "Unia Utrechcka"
 STATIC_MODIFIER_DESC_hol_union_utrecht_mod: "Pakt, podpisany w Utrechcie, stał się nadzieją, której trzyma się każda prowincja północna."
 STATIC_MODIFIER_NAME_hol_watergeuzen_mod: "Żebracy Morscy"
 STATIC_MODIFIER_DESC_hol_watergeuzen_mod: "„Lepiej żebracy niż ludzie króla” — z tym okrzykiem w pamięci nasi żeglarze wciąż polują na flagę hiszpańską."
 STATIC_MODIFIER_NAME_hol_voc_mod: "Kompania Wschodnioindyjska"
 STATIC_MODIFIER_DESC_hol_voc_mod: "Zapach przypraw z Batawii napełnia dzielnicę magazynów Amsterdamu."
 STATIC_MODIFIER_NAME_hol_wisselbank_mod: "Bank Amsterdamski"
 STATIC_MODIFIER_DESC_hol_wisselbank_mod: "Zaufanie, zamknięte w skarbcach Banku Wymiany, jest najprawdziwszym zabezpieczeniem, jakie posiadają kupcy tego miasta."
 STATIC_MODIFIER_NAME_hol_wisselbank_capital_mod: "Stolica Banku Wymiany"
 STATIC_MODIFIER_DESC_hol_wisselbank_capital_mod: "Z księgami skarbca i skarbcami Banku Wymiany pod jednym dachem sprawy państwa idą tym gładziej."
 STATIC_MODIFIER_NAME_hol_exchange_mod: "Giełda Amsterdamska"
 STATIC_MODIFIER_DESC_hol_exchange_mod: "Na parkiecie giełdy okrzyki maklerów, wymachujących swymi certyfikatami udziałowymi, nigdy nie milkną."
 STATIC_MODIFIER_NAME_hol_golden_age_mod: "Holenderski Złoty Wiek"
 STATIC_MODIFIER_DESC_hol_golden_age_mod: "Światło i cień, uchwycone pędzlem Rembrandta, będą opowiadać o tej epoce dobrobytu przez pokolenia."
 STATIC_MODIFIER_NAME_hol_regent_mod: "Oligarchia regentów"
 STATIC_MODIFIER_DESC_hol_regent_mod: "Ciche zgromadzenia bogatych rodzin patrycjuszy są miejscem, gdzie podejmowane są prawdziwe decyzje republiki."
 STATIC_MODIFIER_NAME_hol_stadtholderless_mod: "Epoka bezstadhouderska"
 STATIC_MODIFIER_DESC_hol_stadtholderless_mod: "Fotel stadhoudera stoi pusty — a jednak sprawy państwa idą gładziej niż kiedykolwiek."
 STATIC_MODIFIER_NAME_hol_anglo_rivalry_mod: "Rywalizacja anglo-holenderska"
 STATIC_MODIFIER_DESC_hol_anglo_rivalry_mod: "Powtarzające się wymiany ognia armatniego z naszym rywalem za Kanałem wykuły naszych żeglarzy w doświadczonych weteranów."
 STATIC_MODIFIER_NAME_hol_navigation_act_mod: "Odpowiedź na Akt Nawigacyjny"
 STATIC_MODIFIER_DESC_hol_navigation_act_mod: "Niezrażone angielskimi rozporządzeniami, nasze floty kupieckie wciąż znajdują luki, które utrzymują szlaki handlowe otwarte."
 STATIC_MODIFIER_NAME_hol_channel_dominance_mod: "Dominacja w handlu kanałowym"
 STATIC_MODIFIER_DESC_hol_channel_dominance_mod: "Rzadkością stało się ujrzeć w tej wąskiej cieśninie między Morzem Północnym a Atlantykiem statek, nie niosący naszych barw."
 STATIC_MODIFIER_NAME_hol_french_relations_mod: "Stosunki z Francją"
 STATIC_MODIFIER_DESC_hol_french_relations_mod: "Niepokojące pogłoski z dworu Króla Słońce utrzymują nasze garnizony graniczne zawsze czujne."
 STATIC_MODIFIER_NAME_hol_united_provinces_mod: "Zjednoczone Prowincje Niderlandów"
 STATIC_MODIFIER_DESC_hol_united_provinces_mod: "Jedność siedmiu prowincji bez monarchy uczyniła nasze imię znanym na każdym morzu i rynku świata."
 STATIC_MODIFIER_NAME_hol_rampjaar_mod: "Przetrwanie Roku Klęski"
 STATIC_MODIFIER_DESC_hol_rampjaar_mod: "„Lud nierozsądny, rząd bezradny, kraj zrozpaczony” — strząsnąwszy ten wyrok, nasi żołnierze niosą tę pamięć z dumą."
 STATIC_MODIFIER_NAME_hol_glorious_revolution_mod: "Zwycięstwo nad Królem Słońce"
 STATIC_MODIFIER_DESC_hol_glorious_revolution_mod: "Opowieści o marszu naszej armii głęboko w ziemię francuską opowiadane są teraz z dumą na każdym dworze Europy."
 STATIC_MODIFIER_NAME_hol_republic_declared_mod: "Republika proklamowana"
 STATIC_MODIFIER_DESC_hol_republic_declared_mod: "Delegaci obywateli i kupców zbierają się teraz z dumą w izbie, niepodlegającej żadnemu monarsze."
