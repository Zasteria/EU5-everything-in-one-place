l_polish:
 mlo_biscione_mission_pack: "Dziedzictwo Biscione"
 mlo_biscione_mission_pack_DESCRIPTION:0 "Biscione, wąż pożerający człowieka, zdobi herb Viscontich. Niegdyś tylko jedno z wielu miast-państw Lombardii, Księstwo Mediolanu wykuwa teraz własną drogę wśród zawiłej walki o zwierzchność nad Północnymi Włochami. Poprzez rozwój rządów i kultury, poprzez wyniesienie do rangi wiodącej potęgi Północy, lub poprzez utrzymanie pozycji między wielkimi potęgami papieża, cesarza i Francji — wybór, jakie dziedzictwo wznieść, leży po stronie księcia."
 mlo_biscione_mission_pack_CRITERIA_DESCRIPTION:0 "Ukończ misje jako Księstwo Mediolanu i ustanów dominującą pozycję w Północnych Włoszech."
 mlo_biscione_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by odziedziczyć dziedzictwo Biscione."
 mlo_biscione_mission_pack_BUTTON_DETAILS:0 "Od miasta-państwa Lombardii do serca Włoch!"
 mlo_expanded_domain: "Rozszerzone władanie"
 mlo_expanded_domain_desc: "Księstwo Mediolanu włączyło miasta Lombardii i znacznie rozszerzyło swe terytorium."
 mlo_curb_della_scala: "Powstrzymaj della Scala"
 mlo_curb_della_scala_desc: "Rosnąca hegemonia della Scala, panów Werony, nad Północnymi Włochami musi zostać powstrzymana."
 mlo_imperial_vicariate: "Wikariat cesarski"
 mlo_imperial_vicariate_desc: "Uhonorowany tytułem wikariusza cesarskiego od cesarza Świętego Cesarstwa Rzymskiego, rząd Mediolanu niesie teraz legitymizację Cesarstwa."
 mlo_serpent_that_devours_men: "Wąż pożerający ludzi"
 mlo_serpent_that_devours_men_desc: "Biscione, wąż pożerający człowieka, zdobi herb Viscontich. Legenda uosabia potęgę rodziny i ogłasza nową erę dla Mediolanu."
 mlo_state_led_enterprises: "Przedsięwzięcia państwowe"
 mlo_state_led_enterprises_desc: "Księstwo Mediolanu promuje pod kierownictwem państwa rozwój swych instytucji i kultury."
 mlo_rigorous_plague_policy: "Surowa polityka przeciw zarazie"
 mlo_rigorous_plague_policy_desc: "W obliczu zarazy musi zostać wzniesiony staranny system kwarantanny i izolacji, by chronić lud księstwa."
 mlo_duomo_di_milano: "Katedra Mediolańska"
 mlo_duomo_di_milano_desc: "Posuń naprzód budowę Katedry Mediolańskiej i pozwól wspaniałości księstwa sięgnąć nieba."
 mlo_road_network_of_the_realm: "Sieć drogowa królestwa"
 mlo_road_network_of_the_realm_desc: "Rozwiń sieć drogową, łączącą całe księstwo, i ożyw ruch ludzi i towarów."
 mlo_expand_administrative_buildings: "Rozszerz budynki administracyjne"
 mlo_expand_administrative_buildings_desc: "Czerpiąc z lekcji polityki przeciw zarazie, rozszerz dalej instytucje administracyjne księstwa."
 mlo_embrace_the_renaissance: "Przyjmij renesans"
 mlo_embrace_the_renaissance_desc: "Obok budowy katedry dwór mediolański przyjmuje nowego ducha renesansu."
 mlo_the_last_supper: "Ostatnia Wieczerza"
 mlo_the_last_supper_desc: "Zleć Leonardowi da Vinci namalowanie Ostatniej Wieczerzy i uczyń Mediolan miastem sztuk."
 mlo_naviglio_grande_renovation: "Odnowa Naviglio Grande"
 mlo_naviglio_grande_renovation_desc: "Odnów Naviglio Grande, kanał, łączący Mediolan z otaczającym regionem, i ożyw handel i rolnictwo."
 mlo_castello_sforzesco: "Castello Sforzesco"
 mlo_castello_sforzesco_desc: "Rozbuduj Castello Sforzesco, symbol wspaniałości książęcej, jako siedzibę rządów mediolańskich."
 mlo_biblioteca_ambrosiana: "Biblioteka Ambrosiana"
 mlo_biblioteca_ambrosiana_desc: "Wznieś Bibliotekę Ambrosiana, by pomieścić nagromadzoną wiedzę wieków i wspierać naukę."
 mlo_heart_of_italy: "Miasto, godne być sercem Włoch"
 mlo_heart_of_italy_desc: "Z rządami, rzemiosłem, sztuką i nauką wszystkimi równie rozkwitającymi, Mediolan stał się miastem, godnym stać sercem Włoch."
 mlo_north_italian_ambitions: "Ambicje północnowłoskie"
 mlo_north_italian_ambitions_desc: "Księstwo Mediolanu wprawia swe armie w ruch, by zapewnić zwierzchność nad całymi Północnymi Włochami."
 mlo_subjugate_lombardy: "Podporządkuj Lombardię"
 mlo_subjugate_lombardy_desc: "Przywiedź miasta Lombardii pod pełną kontrolę i zabezpiecz podstawę księstwa."
 mlo_advance_into_piedmont: "Posuń się do Piemontu"
 mlo_advance_into_piedmont_desc: "Rozszerz wpływ na zachód do Piemontu i przeciwstaw się potędze domu sabaudzkiego."
 mlo_strife_over_veneto: "Spór o Wenecję Euganejską"
 mlo_strife_over_veneto_desc: "Konflikt z Wenecją i innymi potęgami o kontrolę nad Wenecją Euganejską jest nieunikniony."
 mlo_through_emilia_and_beyond: "Przez Emilię i dalej"
 mlo_through_emilia_and_beyond_desc: "Przejdź przez Emilię i otwórz drogę dla dalszej ekspansji na południe."
 mlo_secure_liguria: "Zabezpiecz Ligurię"
 mlo_secure_liguria_desc: "Zabezpiecz Ligurię, w tym Genuę, i zdobądź przyczółek na Morzu Śródziemnym."
 mlo_reach_the_coveted_sea: "Dotrzyj do upragnionego morza"
 mlo_reach_the_coveted_sea_desc: "Mediolan, niegdyś państwo lądowe, wreszcie zapewnia bezpośredni dostęp do Morza Śródziemnego."
 mlo_topple_the_old_rival_florence: "Obal dawnego rywala Florencję"
 mlo_topple_the_old_rival_florence_desc: "Rozgrom dawnego rywala Florencję i ustanów wpływ na Toskanię."
 mlo_between_two_authorities: "Między dwiema władzami"
 mlo_between_two_authorities_desc: "Mediolan szuka własnej drogi, zaklinowany między trzema wielkimi potęgami papieża, cesarza i króla Francji."
 mlo_reconcile_with_the_papacy: "Pojednaj się z papiestwem"
 mlo_reconcile_with_the_papacy_desc: "Popraw stosunki z kurią rzymską i zdobądź jej władzę oparciem."
 mlo_trust_of_the_emperor: "Zdobądź zaufanie cesarza"
 mlo_trust_of_the_emperor_desc: "Zdobądź zaufanie cesarza Świętego Cesarstwa Rzymskiego i podnieś prestiż księstwa wewnątrz Cesarstwa."
 mlo_overture_to_france: "Zbliżenie do Francji"
 mlo_overture_to_france_desc: "Zbuduj więzy dyplomatyczne z Królestwem Francji i zapewnij nowe możliwości."
 mlo_the_italian_wars: "Wojny włoskie"
 mlo_the_italian_wars_desc: "Mediolan wciągnięty w Wojny włoskie, gdzie zderzają się interesy papieża, cesarza i Francji."
 mlo_isolate_papal_authority: "Izoluj władzę papieską"
 mlo_isolate_papal_authority_desc: "Po przetrwanych Wojnach włoskich oddziel świecką władzę papieża od polityki mediolańskiej."
 mlo_deny_imperial_authority: "Odrzuć władzę cesarską"
 mlo_deny_imperial_authority_desc: "Po przetrwanych Wojnach włoskich wybierz drogę zarządzania księstwem bez odwoływania się do władzy cesarskiej."
 mlo_repel_french_authority: "Odeprzyj władzę francuską"
 mlo_repel_french_authority_desc: "Po przetrwanych Wojnach włoskich odeprzyj interwencję francuską i zachowaj niezależność księstwa."
 mlo_italian_independence: "Niezależność włoska"
 mlo_italian_independence_desc: "Mediolan zabezpieczył swą rangę silnej, samodzielnej potęgi we Włoszech, niezależnej od papieża, cesarza czy Francji."
 mlo_who_achieves_all_things: "Ten, który osiąga wszystko"
 mlo_who_achieves_all_things_desc: "Osiągnąwszy szczyt zarówno w rządach, kulturze, terytorium, jak i dyplomacji, książę Mediolanu jest teraz godzien zwać się „tym, który osiąga wszystko”."
 STATIC_MODIFIER_NAME_mlo_expanded_domain_mod: "Rosnące księstwo"
 STATIC_MODIFIER_DESC_mlo_expanded_domain_mod: "Szybki wzrost terytorium księstwa przyspieszył rozprzestrzenianie się rządów i przyspieszył włączanie nowo zdobytych ziem."
 STATIC_MODIFIER_NAME_mlo_curb_della_scala_mod: "Zwierzchność nad della Scala"
 STATIC_MODIFIER_DESC_mlo_curb_della_scala_mod: "Teraz, gdy wpływ della Scala w Północnych Włoszech jest powstrzymany, prestiż dyplomatyczny księstwa wzrósł."
 STATIC_MODIFIER_NAME_mlo_state_led_enterprises_mod: "Wyrafinowany aparat państwowy"
 STATIC_MODIFIER_DESC_mlo_state_led_enterprises_mod: "Viscontiowie i Sforzowie wyróżniali się rozległymi państwowymi budowlami publicznymi. Certosa di Pavia, Castello Sforzesco w Mediolanie, sieć kanałowa Naviglio Grande — wszystko to były duże projekty budowlane, napędzane władzą publiczną."
 STATIC_MODIFIER_NAME_mlo_rigorous_plague_policy_mod: "System kwarantanny ustanowiony"
 STATIC_MODIFIER_DESC_mlo_rigorous_plague_policy_mod: "Szpitale, wzniesione po całym księstwie, umocniły ogólnonarodowy opór wobec choroby."
 STATIC_MODIFIER_NAME_mlo_duomo_di_milano_mod: "Wielkość katedry"
 STATIC_MODIFIER_DESC_mlo_duomo_di_milano_mod: "Ukończona Katedra Mediolańska umocniła tradycję kulturową i wpływ księstwa."
 STATIC_MODIFIER_NAME_mlo_road_network_of_the_realm_mod: "Prosperująca sieć drogowa"
 STATIC_MODIFIER_DESC_mlo_road_network_of_the_realm_mod: "Rozwinięta sieć drogowa ożywiła handel po całym księstwie."
 STATIC_MODIFIER_NAME_mlo_expand_administrative_buildings_mod: "Rozszerzone zarządzanie"
 STATIC_MODIFIER_DESC_mlo_expand_administrative_buildings_mod: "Sforzowie zbudowali potężny system urzędniczy. W centralnej kancelarii Mediolanu (Cancelleria) zbierali się zdolni prawnicy i pisarze, a znana była z najwyrafinowańszego aparatu administracyjnego Północnych Włoch."
 STATIC_MODIFIER_NAME_mlo_embrace_the_renaissance_mod: "Dwór renesansowy"
 STATIC_MODIFIER_DESC_mlo_embrace_the_renaissance_mod: "Dwór Francesca Sforzy i jego syna Ludovica Sforzy (il Moro) stał się wielkim centrum renesansu. Ludovico gościł Leonarda da Vinci przez prawie dwadzieścia lat na dworze i zgromadził artystów i architektów, takich jak Bramante."
 STATIC_MODIFIER_NAME_mlo_the_last_supper_mod: "Nieśmiertelne arcydzieło"
 STATIC_MODIFIER_DESC_mlo_the_last_supper_mod: "Namalowana w latach 1495-1498 przez Leonarda da Vinci na ścianie refektarza klasztoru Santa Maria delle Grazie, „Ostatnia Wieczerza” uważana jest za arcydzieło malarstwa zachodniego za doskonałe użycie perspektywy i psychologiczne przedstawienie każdej postaci. Zamówiona przez Ludovica Sforzę, jest dziedzictwem dworu mediolańskiego na jego szczycie."
 STATIC_MODIFIER_NAME_mlo_naviglio_grande_renovation_mod: "Korzyści sieci kanałowej"
 STATIC_MODIFIER_DESC_mlo_naviglio_grande_renovation_mod: "Odnowiony Naviglio Grande stale przyspieszył rozprzestrzenianie się rządów ze stolicy."
 STATIC_MODIFIER_NAME_mlo_biblioteca_ambrosiana_mod: "Prosperująca nauka"
 STATIC_MODIFIER_DESC_mlo_biblioteca_ambrosiana_mod: "Założenie Biblioteki Ambrosiana podniosło umiejętności nowych artystów."
 STATIC_MODIFIER_NAME_mlo_heart_of_italy_mod: "Serce Włoch"
 STATIC_MODIFIER_DESC_mlo_heart_of_italy_mod: "Jako serce Włoch Mediolan przyciąga ludzi z każdego zakątka, a jego dobrobyt jest teraz stały."
 STATIC_MODIFIER_NAME_mlo_north_italian_ambitions_mod: "Ambicje w Północnych Włoszech"
 STATIC_MODIFIER_DESC_mlo_north_italian_ambitions_mod: "Ambicje na całe Północne Włochy przyspieszyły budowanie sieci szpiegowskich."
 STATIC_MODIFIER_NAME_mlo_subjugate_lombardy_mod: "Najwyższy pan Lombardii"
 STATIC_MODIFIER_DESC_mlo_subjugate_lombardy_mod: "Pełna kontrola nad Lombardią podniosła prestiż dyplomatyczny księstwa."
 STATIC_MODIFIER_NAME_mlo_advance_into_piedmont_mod: "Przyczółek w Piemoncie"
 STATIC_MODIFIER_DESC_mlo_advance_into_piedmont_mod: "Piemont był sferą domu sabaudzkiego i dawnym rywalem Mediolanu. Utrzymanie tego strategicznego korytarza przez Alpy do Francji byłoby tarczą przeciw inwazji z zachodu. Zarówno Viscontiowie, jak i Sforzowie wielokrotnie próbowali posunąć się w region."
 STATIC_MODIFIER_NAME_mlo_strife_over_veneto_mod: "Zaszczyty wojskowe z Wenecji Euganejskiej"
 STATIC_MODIFIER_DESC_mlo_strife_over_veneto_mod: "Zaszczyty wojskowe ze sporu o Wenecję Euganejską podniosły prestiż wojska."
 STATIC_MODIFIER_NAME_mlo_through_emilia_and_beyond_mod: "Droga na południe"
 STATIC_MODIFIER_DESC_mlo_through_emilia_and_beyond_mod: "Droga, otwarta za Emilią, wspiera morale wojska."
 STATIC_MODIFIER_NAME_mlo_secure_liguria_mod: "Handel Ligurii"
 STATIC_MODIFIER_DESC_mlo_secure_liguria_mod: "Zabezpieczenie Ligurii, w tym Genui, ożywiło działalność kupców."
 STATIC_MODIFIER_NAME_mlo_reach_the_coveted_sea_mod: "Wrota do Morza Śródziemnego"
 STATIC_MODIFIER_DESC_mlo_reach_the_coveted_sea_mod: "Teraz, gdy upragnione morze osiągnięte, zdolność zaopatrzeniowa floty poprawiona."
 STATIC_MODIFIER_NAME_mlo_topple_the_old_rival_florence_mod: "Zachód nad Arno"
 STATIC_MODIFIER_DESC_mlo_topple_the_old_rival_florence_mod: "Chwała obalenia dawnego rywala Florencji podniosła wspaniałość księstwa."
 STATIC_MODIFIER_NAME_mlo_between_two_authorities_mod: "Dyplomacja między potęgami"
 STATIC_MODIFIER_DESC_mlo_between_two_authorities_mod: "Mediolan kierował swą dyplomacją, zachowując pewien dystans równo od wszystkich trzech władz: cesarza Świętego Cesarstwa Rzymskiego, papieża i króla Francji. Dyplomaci Sforzów praktykowali koncepcję „równowagi sił” i przynieśli Północnym Włochom długi względny pokój."
 STATIC_MODIFIER_NAME_mlo_reconcile_with_the_papacy_mod: "Pokój z papiestwem"
 STATIC_MODIFIER_DESC_mlo_reconcile_with_the_papacy_mod: "Pojednanie z papiestwem przyniosło stabilność wiary do księstwa."
 STATIC_MODIFIER_NAME_mlo_trust_of_the_emperor_mod: "Zaufanie cesarza"
 STATIC_MODIFIER_DESC_mlo_trust_of_the_emperor_mod: "Zaufanie cesarza podniosło prestiż księstwa wewnątrz Cesarstwa."
 STATIC_MODIFIER_NAME_mlo_overture_to_france_mod: "Przyjaźń z Francją"
 STATIC_MODIFIER_DESC_mlo_overture_to_france_mod: "Więzy dyplomatyczne z Królestwem Francji pogłębiły przyjaźń między dwoma państwami."
 STATIC_MODIFIER_NAME_mlo_the_italian_wars_mod: "Doświadczenie Wojen włoskich"
 STATIC_MODIFIER_DESC_mlo_the_italian_wars_mod: "Przetrwanie Wojen włoskich wsparło tradycję wojska."
 STATIC_MODIFIER_NAME_mlo_isolate_papal_authority_mod: "Niezależność od papieża"
 STATIC_MODIFIER_DESC_mlo_isolate_papal_authority_mod: "Dystans od świeckiej władzy papieża podniósł tolerancję dla heretyków."
 STATIC_MODIFIER_NAME_mlo_deny_imperial_authority_mod: "Niezależność od cesarza"
 STATIC_MODIFIER_DESC_mlo_deny_imperial_authority_mod: "Rządy, wolne od odwoływania się do władzy cesarskiej, przyniosły stabilność do księstwa."
 STATIC_MODIFIER_NAME_mlo_repel_french_authority_mod: "Niezależność od Francji"
 STATIC_MODIFIER_DESC_mlo_repel_french_authority_mod: "Odparcie interwencji francuskiej podniosło morale wojska."
 STATIC_MODIFIER_NAME_mlo_italian_independence_mod: "Samodzielna potęga włoska"
 STATIC_MODIFIER_DESC_mlo_italian_independence_mod: "Stanie niezależnym od jakiejkolwiek wielkiej potęgi podniosło zarówno wspaniałość, jak i legitymizację księcia."
 STATIC_MODIFIER_NAME_mlo_who_achieves_all_things_mod: "Książę, osiągający wszystko"
 STATIC_MODIFIER_DESC_mlo_who_achieves_all_things_mod: "„Ten, który osiąga wszystko” (Chi tutte cose fa) — dewiza Sforzów nie była pustym przechwałkiem, lecz politycznym wyrazem renesansowego ideału „człowieka uniwersalnego”. Wojskowy zdobywca i wielki mecenas sztuk, prawodawca i opiekun handlu — szczyt księstwa Mediolanu uosabia polityczny szczyt włoskiego renesansu."
 mlo_events.1.t: "Legenda Biscione"
 mlo_events.1.d: "Herb Viscontich niesie pojedynczego węża, pożerającego człowieka — Biscione. Niektórzy mówią, że przypomina o czynie w krucjatach; inni twierdzą, że symbolizuje pokonanego niewiernego. Jakakolwiek jest prawda, symbol ogłasza po całych Północnych Włoszech, że potęga rodziny i samo miasto-państwo Mediolan nie są już sprawą zwykłego władcy lokalnego. Przed księciem leży teraz wiele dróg: droga męża stanu, droga zdobywcy i droga dyplomaty, idącego między wielkimi potęgami."
 mlo_events.1.a: "Nowa era przyszła do Mediolanu"
 mlo_events.2.t: "Mediolan w 1337 roku"
 mlo_events.2.d: "W 1337 roku Mediolanem rządzą wspólnie Luchino Visconti i jego brat, arcybiskup Giovanni Visconti. W czasach ich poprzednika Azzone tytuł wikariusza cesarskiego został nadany przez cesarza Ludwika IV, tym samym pożyczając rządom Mediolanu autorytet Cesarstwa. Po całych Północnych Włoszech potężni panowie dzierżą władzę, rywalizując ze sobą — della Scala z Werony, Gonzagowie z Mantui, Este z Ferrary i inni. Z papieżem, siedzącym w Awinionie, i siłą cesarza, skupioną na północ od Alp, ten, kto zdobędzie zwierzchność nad Lombardią, będzie rozstrzygał los Północnych Włoch."
 mlo_events.2.a: "Podstawy Mediolanu zrozumiane"
 mlo_events.3.t: "Historia Castello Sforzesco"
 mlo_events.3.d: "Zamek Mediolanu zaczął się twierdzą, zbudowaną przez Viscontich, znaną jako Corte dell’Arengo. Gdy linia książęca skończyła się ze śmiercią Filippa Marii Viscontiego w 1447 roku, obywatele ogłosili Republikę Ambrozjańską i zburzyli większość zamku, symbolu dawnych władców, których obalili. Lecz w 1450 roku Francesco Sforza, który zakończył chaos republiki i przyjął tytuł książęcy, nakazał odbudować twierdzę na nowo, jeszcze wspanialszą niż poprzednia, by ogłosić własną władzę. Od tego czasu Castello Sforzesco stoi siedzibą władzy książęcej w Mediolanie, a jego blask jest niezmącony."
 mlo_events.3.a: "Ciężar tej historii zrozumiany"
 mlo_castello_sforzesco_building: "Castello Sforzesco"
 mlo_castello_sforzesco_building_desc: "Twierdza odbudowana przez Francesca Sforzę, stojąca symbolem władzy książęcej w Mediolanie. Gdy znajduje się w stolicy, umacnia tradycję kulturową, wpływ kulturowy i władzę korony."
 STATIC_MODIFIER_NAME_mlo_serpent_reward_mod: "Rządy Biscione"
 STATIC_MODIFIER_DESC_mlo_serpent_reward_mod: "Wężowy herb Viscontich (Biscione) — wąż, pożerający człowieka — jest symbolem potęgi i ambicji Mediolanu. Według legendy zdobył go przodek Viscontich w pojedynku z saraceńskim rycerzem. Dopełnienie zjednoczenia Włoch oznacza, że wąż wreszcie pochłonął całą ziemię."
