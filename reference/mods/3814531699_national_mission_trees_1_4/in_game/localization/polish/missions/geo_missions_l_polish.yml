l_polish:
 geo_georgia_mission_pack: "Złote Runo — Królestwo Kaukazu"
 geo_georgia_mission_pack_DESCRIPTION:0 "Pod dynastią Bagrationich Królestwo Gruzji stoi na skrzyżowaniu Kaukazu. Zjednocz królestwo, zgłoś roszczenia do hegemonii nad Kaukazem i stepem, albo maszeruj jako krzyżowiec do Anatolii i Ziemi Świętej — i pozwól, by światło prawosławia jaśniało nad Wschodem."
 geo_georgia_mission_pack_CRITERIA_DESCRIPTION:0 "Zjednocz Gruzję, opanuj Kaukaz i prowadź krucjatę na południe, by urzeczywistnić nowy złoty wiek."
 geo_georgia_mission_pack_BUTTON_TOOLTIP:0 "Z krainy Złotego Runa zostań hegemonem Kaukazu."
 geo_georgia_mission_pack_BUTTON_DETAILS:0 "Przywróć chwałę królowej Tamary — od górskiego królestwa do strażnika świata prawosławnego!"
 geo_bagrationi_legacy: "Dziedzictwo Bagrationich"
 geo_bagrationi_legacy_desc: "Linia krwi domu Bagrationich rządzi Kaukazem. Odziedzicz to dziedzictwo i rozpocznij nową erę rządów."
 geo_royal_succession: "Zabezpiecz sukcesję"
 geo_royal_succession_desc: "Stłum ambicje szlachty i spory o tron i ustanów prawowite rządy."
 geo_reunite_georgia: "Zjednocz Gruzję"
 geo_reunite_georgia_desc: "Tyflis, Kutaisi, Achalciche, Batumi — zjednocz rozdrobnione prowincje Gruzji pod jedną koroną."
 geo_fortify_caucasia: "Umocnij Kaukaz"
 geo_fortify_caucasia_desc: "Utwardź poszarpane góry siecią twierdz i odpieraj najazdy pogan i zdobywców jednakowo."
 geo_church_of_georgia: "Kościół gruziński"
 geo_church_of_georgia_desc: "Uczyń autokefaliczny Gruziński Kościół Prawosławny filarem państwa i wykuj jedność przez wiarę."
 geo_royal_court: "Dwór królewski"
 geo_royal_court_desc: "Ozdób dwór królewski w Tyflisie i uczyń go centrum kultury i władzy, niezrównanym na Kaukazie."
 geo_georgian_army: "Armia gruzińska"
 geo_georgian_army_desc: "Wykuj potężną armię, czerpaną z ludów górskich, i uczyń ją mieczem królestwa."
 geo_recover_strength: "Odzyskaj siły"
 geo_recover_strength_desc: "Przywróć siły, wyczerpane przez powtarzające się trudności, i otwórz nową przyszłość przez sojusz i przezbrojenie."
 geo_queen_tamar_ambition: "Ambicja królowej Tamary"
 geo_queen_tamar_ambition_desc: "Ziemie Armenii, niegdyś część domeny królowej Tamary — wyzwól naszych chrześcijańskich braci spod rządów pogan i przywróć władzę Tyflisu."
 geo_reclaim_shirvan: "Odzyskaj Szyrwan"
 geo_reclaim_shirvan_desc: "Odzyskaj Szyrwan, niegdyś pod zwierzchnictwem gruzińskim, i zdobądź przyczółek nad Morzem Kaspijskim."
 geo_heirs_of_seljuks: "Dziedzice Seldżuków"
 geo_heirs_of_seljuks_desc: "Odzyskaj wschodnie ziemie od potęg, które odziedziczyły dziedzictwo seldżuckie, i przywróć władzę krzyża w tym regionie."
 geo_gates_of_alexander: "Bramy Aleksandra"
 geo_gates_of_alexander_desc: "Przekrocz tak zwane „Bramy Aleksandra” przez Kaukaz i podporządkuj plemiona północy."
 geo_bane_of_khagan: "Zguba Kagana"
 geo_bane_of_khagan_desc: "Potomkowie Mongołów nadal zagrażają światu prawosławnemu. Połóż kres ich rządom i wyeliminuj tę zgubę na zawsze."
 geo_seize_crimea: "Zdobądź Krym"
 geo_seize_crimea_desc: "Podporządkuj Półwysep Krymski, ostatnie schronienie Tatarów, i zabezpiecz nasze panowanie nad Morzem Czarnym."
 geo_control_black_sea: "Opanuj Morze Czarne"
 geo_control_black_sea_desc: "Zdobywszy większość wybrzeża czarnomorskiego, w pełni włącz to morze śródlądowe w sferę handlową Gruzji."
 geo_envoy_to_tsar: "Poseł do cara"
 geo_envoy_to_tsar_desc: "Wyślij posła do cara, wzniesionego na dominującą potęgę Rusi, i szukaj drogi sojuszu."
 geo_caucasus_hegemony: "Hegemonia Kaukazu"
 geo_caucasus_hegemony_desc: "Góry, step i Morze Czarne — dopełnij niewzruszoną hegemonię nad całym Kaukazem."
 geo_deal_with_trebizond: "Rozstrzygnij sprawę Trapezuntu"
 geo_deal_with_trebizond_desc: "Cesarstwo Trapezuntu, założone z pomocą królowej Tamary — odnów więź z tym starym przyjacielem i wybierzcie razem drogę naprzód."
 geo_conquer_jalayirids: "Podporządkuj Sułtanat Dżalairydów"
 geo_conquer_jalayirids_desc: "Pośród chaosu po upadku Ilchanatu Sułtanat Dżalairydów wzniósł się w tej ziemi — podporządkuj tego dziedzica dziedzictwa mongolskiego i otwórz drogę na Wschód."
 geo_encroach_mamluks: "Naciskaj na Mameluków"
 geo_encroach_mamluks_desc: "Ziemia Święta, utracona przez dawnych krzyżowców — posuń się na rządzony przez Mameluków Wschód i przygotuj się do odzyskania światła wiary."
 geo_conquer_cyprus: "Podbij Cypr"
 geo_conquer_cyprus_desc: "Zdobądź Cypr, bastion wschodniego Morza Śródziemnego, i zabezpiecz hegemonię nad regionem obok tamtejszych potęg krzyżowych."
 geo_cradle_of_civilization: "Kolebka cywilizacji"
 geo_cradle_of_civilization_desc: "Wyzwól Mezopotamię, kolebkę ludzkiej cywilizacji, spod rządów muzułmańskich i zgłoś roszczenie do jej bogactw dla Gruzji."
 geo_claim_holy_city: "Zgłoś roszczenie do Świętego Miasta"
 geo_claim_holy_city_desc: "Dopóki Jerozolima leży pod rządami Saracenów, ciemna chmura wisi nad chrześcijaństwem. Odzyskaj Święte Miasto i dowiedź triumfu wiary."
 geo_light_of_east: "Światło Wschodu"
 geo_light_of_east_desc: "Aleksandria, Jerozolima, Antiochia — wyzwól starożytne patriarchaty wschodnie i pokaż światu, że światło Wschodu nie zgasło."
 geo_anatolian_incursion: "Najazd na Anatolię"
 geo_anatolian_incursion_desc: "Od klęski pod Manzikertem Anatolia wpadła w ręce tureckich potęg — pomścij tę klęskę i zostań nowym hegemonem tej ziemi."
 geo_empires_downfall: "Upadek imperium"
 geo_empires_downfall_desc: "Imperium Osmańskie, dominujące na Bałkanach i Bliskim Wschodzie — skaż to zagrożenie dla całego chrześcijaństwa na karty historii."
 geo_throne_of_romans: "Tron Rzymian"
 geo_throne_of_romans_desc: "Wielkie miasto Konstantynopol od dawna leży w rękach pogan. Wyzwól ten klejnot i zajmij tron rzymski jako cesarz gruziński."
 geo_beacon_of_christendom: "Latarnia chrześcijaństwa"
 geo_beacon_of_christendom_desc: "Przywróciwszy potęgę prawosławia, nadszedł czas, by dowieść światu naszej pobożności i danej przez Boga prawości — uczyń nasze królestwo zjednoczonym rajem chrześcijaństwa."
 geo_georgian_crusader_realm: "Gruzińskie królestwo krzyżowców"
 geo_georgian_crusader_realm_desc: "Od Kaukazu po Morze Śródziemne — to wielkie imperium, zbudowane pod krzyżem, jest spełnieniem marzenia królowej Tamary."
 geo_rebuild_tbilisi: "Odbuduj Tyflis"
 geo_rebuild_tbilisi_desc: "Nasza stolica, Tyflis, zniszczona przez powtarzające się obce inwazje — przystąp do przywracania jej dawnej wspaniałości."
 geo_georgian_vineyards: "Winnice gruzińskie"
 geo_georgian_vineyards_desc: "Tradycja winiarska Gruzji, obejmująca ponad tysiąc lat — niech ta dumna gałąź przemysłu stanie się znana światu."
 geo_revive_literature: "Odrodź rodzimą literaturę"
 geo_revive_literature_desc: "Asomtavruli, Nuskhuri, Mkhedruli — trzy pisma, niosące dziedzictwo gruzińskie. Odrodź tę kulturę i rozprzestrzeń jej język i pismo po całym Kaukazie."
 geo_legacy_of_builder: "Dziedzictwo Budowniczego"
 geo_legacy_of_builder_desc: "Idąc za panowaniem Dawida Budowniczego, przynieś sławę, bogactwo i znaczenie naszym miastom."
 geo_svetitskhoveli_cathedral: "Katedra Sweticchoweli"
 geo_svetitskhoveli_cathedral_desc: "Katedra Żywego Filaru, serce Gruzińskiego Kościoła Apostolskiego — odbuduj ją do wspaniałości większej niż kiedykolwiek wcześniej."
 geo_patriarchate_of_georgia: "Patriarchat całej Gruzji"
 geo_patriarchate_of_georgia_desc: "W miarę wzrostu wpływu państwa rośnie wezwanie, by wynieść autokefaliczny Kościół Gruziński do rangi patriarchatu."
 geo_silk_road_trade: "Handel na Jedwabnym Szlaku"
 geo_silk_road_trade_desc: "Jako węzeł, łączący Wschód i Zachód wzdłuż Jedwabnego Szlaku, napełnij miasta Gruzji bogactwem handlu."
 geo_mountain_fortresses: "Twierdze górskie"
 geo_mountain_fortresses_desc: "Wykorzystaj poszarpany teren Kaukazu i dopełnij sieć twierdz, która zdoła zatrzymać każdą armię."
 geo_golden_age: "Złoty Wiek ukończony"
 geo_golden_age_desc: "Złoty wiek, zbudowany przez królową Tamarę i Dawida Budowniczego — podnieś jego chwałę na niespotykane wyżyny."
 geo_events.1.t: "Upadek Saraju"
 geo_events.1.d: "Saraj, stolica mongolskiego państwa sukcesyjnego, wpadł w nasze ręce. Władza Kagana, która niegdyś wstrząsała światem prawosławnym, należy teraz do przeszłości."
 geo_events.1.a: "Zguba Kagana dobiegła końca!"
 geo_events.2.t: "Upadek Konstantynopola"
 geo_events.2.d: "Wielkie miasto imperialne Konstantynopol wreszcie wpadło w nasze ręce. Sztandar gruziński powiewa teraz nad tym miastem, niegdyś dzierżonym przez niewiernych — Król Kaukazu zgłasza roszczenie do tytułu dziedzica Rzymu."
 geo_events.2.a: "Niech żyje Cesarstwo Rzymskie! Niech żyje Cesarz Gruziński!"
 geo_events.99.t: "Proklamacja Złotego Wieku"
 geo_events.99.d: "Od Kaukazu po Morze Śródziemne — złoty wiek, o którym niegdyś marzyła królowa Tamara, jest teraz ukończony. Małe górskie królestwo odrodziło się wielkim imperium, oświetlającym świat prawosławny."
 geo_events.99.a: "Chwała Gruzji! Niech żyje Złoty Wiek!"
 STATIC_MODIFIER_NAME_geo_bagrationi_mod: "Wspaniałość Bagrationich"
 STATIC_MODIFIER_DESC_geo_bagrationi_mod: "Linia królewska nadaje państwu prestiż i legitymizację."
 STATIC_MODIFIER_NAME_geo_succession_mod: "Stabilna sukcesja"
 STATIC_MODIFIER_DESC_geo_succession_mod: "Sukcesja królewska jest stabilna, a niepokoje wewnętrzne ucichły."
 STATIC_MODIFIER_NAME_geo_reunite_mod: "Gruzja zjednoczona"
 STATIC_MODIFIER_DESC_geo_reunite_mod: "Rozdrobnione prowincje są znów zjednoczone pod jedną koroną."
 STATIC_MODIFIER_NAME_geo_fortify_mod: "Kaukaska sieć twierdz"
 STATIC_MODIFIER_DESC_geo_fortify_mod: "Kamienne twierdze, wzniesione na szczytach przełęczy kaukaskich, z daleka czuwają nad cieniem najeźdźcy."
 STATIC_MODIFIER_NAME_geo_church_mod: "Kościół gruziński"
 STATIC_MODIFIER_DESC_geo_church_mod: "Kościół Prawosławny działa teraz jako filar państwa, kując jedność przez wiarę."
 STATIC_MODIFIER_NAME_geo_court_mod: "Wspaniałość dworu królewskiego"
 STATIC_MODIFIER_DESC_geo_court_mod: "Dwór królewski w Tyflisie jaśnieje jako centrum kultury i władzy na Kaukazie."
 STATIC_MODIFIER_NAME_geo_army_mod: "Armia gruzińska"
 STATIC_MODIFIER_DESC_geo_army_mod: "Potężna armia, czerpana z ludów górskich, ukończona, służąc jako miecz królestwa."
 STATIC_MODIFIER_NAME_geo_recover_mod: "Siły odzyskane"
 STATIC_MODIFIER_DESC_geo_recover_mod: "Poprzez sojusz i przezbrojenie królestwo uczyniło krok ku nowej przyszłości."
 STATIC_MODIFIER_NAME_geo_tamar_mod: "Ambicja królowej Tamary"
 STATIC_MODIFIER_DESC_geo_tamar_mod: "Nasi bracia Ormianie zostali wyzwoleni, a władza Tyflisu sięga teraz na wschód."
 STATIC_MODIFIER_NAME_geo_shirvan_mod: "Szyrwan odzyskany"
 STATIC_MODIFIER_DESC_geo_shirvan_mod: "Przyczółek nad Morzem Kaspijskim zabezpieczony, a bogactwo handlu wschodniego płynie."
 STATIC_MODIFIER_NAME_geo_seljuk_mod: "Dziedzice Seldżuków"
 STATIC_MODIFIER_DESC_geo_seljuk_mod: "Potęgi, które odziedziczyły dziedzictwo seldżuckie, zostały odparte, a władza krzyża wróciła na Wschód."
 STATIC_MODIFIER_NAME_geo_gates_mod: "Bramy Aleksandra"
 STATIC_MODIFIER_DESC_geo_gates_mod: "Przekroczywszy północne przełęcze, plemiona na północ od Kaukazu zostały podporządkowane."
 STATIC_MODIFIER_NAME_geo_crimea_mod: "Krym zdobyty"
 STATIC_MODIFIER_DESC_geo_crimea_mod: "Ostatnie schronienie Tatarów podporządkowane, otwierając szlaki handlowe przez Morze Czarne."
 STATIC_MODIFIER_NAME_geo_black_sea_mod: "Panowanie nad Morzem Czarnym"
 STATIC_MODIFIER_DESC_geo_black_sea_mod: "Większość wybrzeża czarnomorskiego jest teraz włączona w sferę handlową Gruzji."
 STATIC_MODIFIER_NAME_geo_tsar_mod: "Sojusz z carem"
 STATIC_MODIFIER_DESC_geo_tsar_mod: "Stosunki z dominującą potęgą Rusi ustanowione, rozszerzając naszą sieć dyplomatyczną."
 STATIC_MODIFIER_NAME_geo_hegemony_mod: "Hegemonia Kaukazu"
 STATIC_MODIFIER_DESC_geo_hegemony_mod: "Góry, step i Morze Czarne — hegemonia nad całym Kaukazem ukończona."
 STATIC_MODIFIER_NAME_geo_trebizond_mod: "Sprawa Trapezuntu"
 STATIC_MODIFIER_DESC_geo_trebizond_mod: "Więź z naszym starym przyjacielem odnowiona, a handel między dwoma królestwami kwitnie."
 STATIC_MODIFIER_NAME_geo_jalayirid_mod: "Sułtanat Dżalairydów podporządkowany"
 STATIC_MODIFIER_DESC_geo_jalayirid_mod: "Zagrożenie dżalairydzkie wyeliminowane, dowodząc siły naszej armii."
 STATIC_MODIFIER_NAME_geo_mamluk_mod: "Nacisk na Mameluków"
 STATIC_MODIFIER_DESC_geo_mamluk_mod: "Sztandar krzyża, posunięty na wschód, powiewa nawet na pustynnym horyzoncie, a królowie innych wiar usłyszeli jego imię."
 STATIC_MODIFIER_NAME_geo_cyprus_mod: "Cypr podbity"
 STATIC_MODIFIER_DESC_geo_cyprus_mod: "Gruzińskie statki handlowe, zakotwiczone w portach Cypru, ładują przyprawy wschodniego Morza Śródziemnego."
 STATIC_MODIFIER_NAME_geo_mesopotamia_mod: "Kolebka cywilizacji"
 STATIC_MODIFIER_DESC_geo_mesopotamia_mod: "Wełna i barwniki z żyznych brzegów Tygrysu i Eufratu niesione są do warsztatów Gruzji."
 STATIC_MODIFIER_NAME_geo_holy_city_mod: "Święte Miasto zdobyte"
 STATIC_MODIFIER_DESC_geo_holy_city_mod: "Odzyskanie Jerozolimy podniosło władzę Kościoła i pobożność ludu."
 STATIC_MODIFIER_NAME_geo_light_east_mod: "Światło Wschodu"
 STATIC_MODIFIER_DESC_geo_light_east_mod: "Wyzwolenie patriarchatów wschodnich podniosło morale i honor armii."
 STATIC_MODIFIER_NAME_geo_anatolia_mod: "Najazd na Anatolię"
 STATIC_MODIFIER_DESC_geo_anatolia_mod: "Żołnierze gruzińscy, którzy ponownie stanęli na polu Manzikertu, maszerują w szeregach, dumni z pomszczenia dawnego upokorzenia."
 STATIC_MODIFIER_NAME_geo_downfall_mod: "Upadek imperium"
 STATIC_MODIFIER_DESC_geo_downfall_mod: "Na dworze w Tyflisie, uwolnionym od zagrożenia osmańskiego, posłowie wielu narodów kłaniają się przed Królem Gruzji."
 STATIC_MODIFIER_NAME_geo_beacon_mod: "Latarnia chrześcijaństwa"
 STATIC_MODIFIER_DESC_geo_beacon_mod: "Imię Króla Gruzji, zwanego strażnikiem wiary, wypowiadane jest z szacunkiem na dworach narodów, niosących ten sam krzyż."
 STATIC_MODIFIER_NAME_geo_tbilisi_mod: "Tyflis odbudowany"
 STATIC_MODIFIER_DESC_geo_tbilisi_mod: "Królewska stolica Tyflis odzyskuje swą dawną wspaniałość."
 STATIC_MODIFIER_NAME_geo_vineyards_mod: "Winnice gruzińskie"
 STATIC_MODIFIER_DESC_geo_vineyards_mod: "Zapach wina, leżakowanego tysiąc lat w glinianych dzbanach kwewri, napełnia doliny Kachetii."
 STATIC_MODIFIER_NAME_geo_literature_mod: "Rodzima literatura odrodzona"
 STATIC_MODIFIER_DESC_geo_literature_mod: "Rozprzestrzenienie pisma Mkhedruli posunęło naprzód naukę i rządzenie."
 STATIC_MODIFIER_NAME_geo_builder_mod: "Dziedzictwo Budowniczego"
 STATIC_MODIFIER_DESC_geo_builder_mod: "Kontynuując wolę Dawida Budowniczego, nasze miasta idą ścieżką ku dobrobytowi."
 STATIC_MODIFIER_NAME_geo_cathedral_mod: "Katedra Sweticchoweli"
 STATIC_MODIFIER_DESC_geo_cathedral_mod: "Katedra Żywego Filaru odbudowana, przywracając swą wspaniałość jako centrum wiary."
 STATIC_MODIFIER_NAME_geo_patriarchate_mod: "Patriarchat całej Gruzji"
 STATIC_MODIFIER_DESC_geo_patriarchate_mod: "Kościół Gruziński wyniesiony do rangi patriarchatu, a jego władza jest szeroko uznawana."
 STATIC_MODIFIER_NAME_geo_silk_road_mod: "Handel na Jedwabnym Szlaku"
 STATIC_MODIFIER_DESC_geo_silk_road_mod: "Jako węzeł handlu Wschód-Zachód miasta Gruzji opływają w bogactwo."
 STATIC_MODIFIER_NAME_geo_mountain_fort_mod: "Górska sieć twierdz"
 STATIC_MODIFIER_DESC_geo_mountain_fort_mod: "Sieć twierdz, zbudowana na terenie Kaukazu, może zatrzymać każdą wielką armię."
 STATIC_MODIFIER_NAME_geo_golden_age_mod: "Złoty Wiek ukończony"
 STATIC_MODIFIER_DESC_geo_golden_age_mod: "Złoty wiek, zbudowany przez królową Tamarę i Dawida Budowniczego, osiągnął nowe wyżyny."
 STATIC_MODIFIER_NAME_geo_constantinople_fall_mod: "Dziedzictwo Bizancjum Imperialnego"
 STATIC_MODIFIER_DESC_geo_constantinople_fall_mod: "Maszyneria dyplomatyczna i administracyjna tysiącletniego miasta została zdobyta. Odziedziczając biurokrację Rzymu i ceremoniał dyplomatyczny, nasi poddani stają się lojalniejsi, a proces aneksji przebiega gładziej."
 STATIC_MODIFIER_NAME_geo_golden_age_declaration_mod: "Sieć rządów Złotego Wieku"
 STATIC_MODIFIER_DESC_geo_golden_age_declaration_mod: "Wielkie imperium, rozciągające się od Kaukazu po Morze Śródziemne, jest spojone drogami królewskimi i siecią lokalnych namiestników. Dobrobyt, zbudowany przez królową Tamarę i Dawida Budowniczego, niesie światło korony do najdalszych prowincji, czyniąc legitymizację i prestiż dynastii niewzruszonymi."
