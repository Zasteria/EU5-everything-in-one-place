l_polish:
 nor_kongedommen_mission_pack: "Kongeriket Norge — chwała Norwegii"
 nor_kongedommen_mission_pack_DESCRIPTION:0 "W 1337 roku Norwegia jest w unii personalnej ze Szwecją pod królem Magnusem Erikssonem, pozostając pod duńskim wpływem. Jako dziedzice wikingów, wyrwij się spod Danii i zjednocz Skandynawię. Poprzez łowiska Bergen, panowanie nad Morzem Północnym, kolonie na Islandii i Grenlandii oraz wielką żeglugę do Vinlandu — i z wyborem wiary (katolickiej, luterańskiej lub nordyckiej) — zbuduj Imperium Norweskie."
 nor_kongedommen_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Norwegia, osiągnij niepodległość, jedność, panowanie nad Północnym Atlantykiem i imperium kolonialne, by ustanowić Imperium Norweskie."
 nor_kongedommen_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by zbudować Imperium Norweskie."
 nor_kongedommen_mission_pack_BUTTON_DETAILS:0 "Z dumą dziedziców wikingów wykuj Norwegię w Imperium!"
 nor_kingdom_of_norway: "Królestwo Norwegii"
 nor_kingdom_of_norway_desc: "W 1337 roku Norwegia jest w unii personalnej ze Szwecją pod królem Magnusem Erikssonem, podczas gdy duński wpływ nieustannie zagraża Północy. Jako dziedzice wikingów, wzmocnij legitymizację królewską i umocnij podstawy niezależnego królestwa norweskiego."
 nor_control_denmark: "Opanuj Danię"
 nor_control_denmark_desc: "Dania jest największym zagrożeniem i historycznym rywalem Norwegii. Zajęcie Kopenhagi lub uczynienie Danii norweskim wasalem przenosi przywództwo w Unii Kalmarskiej na Norwegię."
 nor_sweden_union: "Unia personalna ze Szwecją"
 nor_sweden_union_desc: "Umocnij i zachowaj unię personalną ze Szwecją, by cała siła północnej Skandynawii zebrała się pod Norwegią. Kontynuuj rządy króla Magnusa i uczyń ten sojusz podstawą jedności skandynawskiej."
 nor_unite_scandinavia: "Zjednocz Skandynawię"
 nor_unite_scandinavia_desc: "Dania kontrolowana, Szwecja w unii personalnej — cała Skandynawia zjednoczona pod norweskim sztandarem. Od czasów wikingów historyczna chwila, gdy świat północny jest rządzony pod jednym królem, nastała tutaj."
 nor_sound_toll: "Cło Sundzkie"
 nor_sound_toll_desc: "Z pokonaną Danią cieśnina Sund wpada pod kontrolę norweską. Pobieranie Cła Sundzkiego rodzi ogromny dochód."
 nor_develop_stockholm: "Rozwiń Sztokholm"
 nor_develop_stockholm_desc: "Poprzez unię szwedzką rozwiń Sztokholm wschodnim węzłem administracyjnym Imperium Norweskiego."
 nor_secure_bergen: "Zabezpiecz Bergen"
 nor_fleet_of_norway: "Flota Norwegii"
 nor_fleet_of_norway_desc: "Norwegowie — potomkowie wikingów — są ludem morza. Zbudowanie potężnej floty z bazą w Bergen ustanawia zdolność rozmieszczenia na całym Morzu Północnym, Północnym Atlantyku i Bałtyku."
 nor_north_sea_markets: "Rynki Morza Północnego"
 nor_north_sea_markets_desc: "Norwegia wykorzystuje swą przewagę geograficzną, zwróconą ku Morzu Północnemu, by rozwinąć handel. Ustanów Norwegię głównym graczem w handlu północnomorskim z dochodem miesięcznym 100+ i licznymi centrami handlowymi."
 nor_iceland_colony: "Opanuj Islandię"
 nor_iceland_colony_desc: "Islandia została zasiedlona przez Norwegów w 874 roku — zamorska baza kultury norweskiej. Posiadanie wielu islandzkich prowincji dopełnia przyczółek na Północnym Atlantyku i zbliża Grenlandię i Vinland."
 nor_greenland_expedition: "Wyprawa grenlandzka"
 nor_greenland_expedition_desc: "W 985 roku Eryk Rudy (Eiríkr rauði) założył kolonię na Grenlandii. Uczyń ten pierwszy krok ku zachodniemu kontynentowi i otwórz drogę do legendarnego Vinlandu."
 nor_vinland: "Vinland"
 nor_orkney_shetland: "Orkady i Szetlandy"
 nor_orkney_shetland_desc: "Orkady i Szetlandy są pod wpływem norweskim od czasów wikingów. Zabezpieczenie tych strategicznych wysp znacznie poprawia zdolność rozmieszczenia na Morzu Północnym i ku Wyspom Brytyjskim."
 nor_conquer_scotland: "Podbij Szkocję"
 nor_conquer_scotland_desc: "Zachodnie wybrzeże Szkocji i Hebrydy były niegdyś pod władzą wikingów. Zdobycie Edynburga i Hebrydów otwiera drogę do Yorku — stolicy Danelaw."
 nor_invade_england: "Najedź Anglię"
 nor_invade_england_desc: "York był niegdyś stolicą norweskiego królestwa Jórvík. Siły norweskie zajmujące York wskrzeszają pamięć o Danelaw w naszych czasach."
 nor_kingdom_of_britain: "Królestwo Brytanii"
 nor_master_of_north_sea: "Pan Morza Północnego"
 nor_master_of_north_sea_desc: "Rynki północnomorskie zabezpieczone, Orkady i Szetlandy zdobyte — Norwegia jest niekwestionowanym panem Morza Północnego. Z flotą 50+ i dochodem 200+ sztandar norweski powiewa nad całym Morzem Północnym."
 nor_secure_nidaros: "Zabezpiecz Nidaros"
 nor_fisheries: "Rozwiń rybołówstwo"
 nor_fisheries_desc: "Norwegia jest największą potęgą rybacką Europy. Dorsz, śledź i łosoś napełniają Północny Atlantyk w obfitości. W pełni rozwiń rybołówstwo tego narodu i ustanów system masowego wywozu na Morze Północne i Bałtyk."
 nor_timber_industry: "Przemysł drzewny"
 nor_arctic_trade: "Handel arktyczny"
 nor_develop_oslo: "Rozwiń Oslo"
 nor_absolutism: "Absolutyzm"
 nor_absolutism_desc: "Ustanów monarchię absolutną w Norwegii. Wyniesienie władzy królewskiej i wzmocnienie legitymizacji przygotowuje podstawę pod scentralizowane rządy imperialne."
 nor_northern_economy: "Gospodarka północna"
 nor_northern_economy_desc: "Handel arktyczny i reformy gospodarcze monarchii absolutnej — gospodarka norweska osiąga najwyższy poziom w Europie Północnej. Dowiedź tego dochodem miesięcznym 300+ i licznymi centrami handlowymi."
 nor_religious_question: "Kwestia wiary"
 nor_religious_question_desc: "Burza Reformacji dotarła do Norwegii. Duchowieństwo katedry w Nidaros wzywa do wierności Rzymowi. Lecz coraz więcej odnajduje oddźwięk w nowej nauce Lutra. I — niektórzy marzą o powrocie do dawnych bogów. Wybór króla norweskiego zdecyduje o duszy tego północnego królestwa."
 nor_catholic_norway: "Katolicka Norwegia"
 nor_catholic_norway_desc: "Królestwo Norwegii zachowuje wierność Kościołowi Rzymskiemu. Strzegąc tradycji północnego katolicyzmu, symbolizowanej przez katedrę w Nidaros, uczyń Norwegię strażniczką północnej cywilizacji katolickiej poprzez bliskie więzi z papieżem."
 nor_northern_crusade: "Krucjata Północna"
 nor_northern_crusade_desc: "Norwegia uczestniczy w świętej wojnie jako północna tarcza chrześcijaństwa. Poprzez walkę z niewiernymi norweska władza religijna i prestiż rosną."
 nor_papal_champion: "Obrońca papieża"
 nor_papal_champion_desc: "Głębokie zaufanie z papiestwem i kontrola nad Lubeką — Norwegia ustanowiła niewzruszoną pozycję najsilniejszej strażniczki północnej cywilizacji katolickiej."
 nor_reformation: "Reformacja"
 nor_reformation_desc: "Norwegia przyjmuje luteranizm (lub kalwinizm). Majątek kościelny przechodzi na koronę, wzmacniając finanse państwowe."
 nor_protestant_church: "Kościół protestancki"
 nor_protestant_church_desc: "Rozwiń uniwersytety, by kształcić teologów luterańskich i zakorzenić wiarę protestancką w całej Norwegii."
 nor_protestant_empire: "Imperium protestanckie"
 nor_protestant_empire_desc: "Luteranizm przenika Skandynawię. Król norweski panuje jako północny obrońca świata protestanckiego."
 nor_norse_revival: "Odrodzenie wiary nordyckiej"
 nor_norse_revival_desc: "Bogowie przodków — Odyn, Thor, Freyr — odradzają się. Oblicze Skandynawii sprzed chrystianizacji zostaje odtworzone w naszych czasach. Król norweski panuje jako przedstawiciel bogów nordyckich."
 nor_berserker_fleet: "Flota berserków"
 nor_berserker_fleet_desc: "Duch berserków wikingów zamieszkuje flotę. Wojownicy morscy, oddani bogom nordyckim, wypuszczeni jako korsarze, by pustoszyć wybrzeża niewiernych."
 nor_ragnarok_empire: "Imperium Ragnaröku"
 nor_ragnarok_empire_desc: "Podobnie jak nowy świat przychodzący po Ragnaröku, Norwegia odradza się jako imperium północne pod błogosławieństwem dawnych bogów. Z rangą cesarską i 500+ prowincjami w bezpośrednim posiadaniu zdobądź tę chwałę."
 nor_bane_of_hansa: "Przekleństwo Hanzy"
 nor_bane_of_hansa_desc: "Liga Hanzeatycka panowała nad handlem norweskim przez Bryggen (Niemieckie Nabrzeże) w Bergen. Kontroluj Lubekę lub rozwiąż Ligę Hanzeatycką, by norwescy kupcy odzyskali własne szlaki handlowe."
 nor_baltic_access: "Dostęp do Bałtyku"
 nor_baltic_access_desc: "Zdobycie Stralsundu daje Norwegii bezpośredni dostęp do Morza Bałtyckiego. Norwegia staje się tym samym największą potęgą morską Europy Północnej, kontrolując zarówno Morze Północne, jak i Bałtyk."
 nor_hanseatic_expulsion: "Wypędź kupców hanzeatyckich"
 nor_hanseatic_expulsion_desc: "Z rozwiązaną Ligą Hanzeatycką i rozwiniętym Bergen, Norwegia całkowicie uwolniła Bergen od niemieckiego panowania kupieckiego. Norwescy kupcy są panami własnego portu."
 nor_control_north_sea_trade: "Panuj w handlu Morza Północnego"
 nor_control_north_sea_trade_desc: "Rynki północnomorskie zabezpieczone, a Liga Hanzeatycka zmiażdżona — Norwegia przejmuje inicjatywę nad całym szlakiem handlowym Morza Północnego. Ustanów dominację z dochodem 300+ i flotą 40+."
 nor_north_sea_empire: "Imperium Morza Północnego"
 nor_north_sea_empire_desc: "Norwegia, kontrolująca całe wybrzeże Morza Północnego, w tym Lubekę, zbudowała Imperium Morza Północnego. Imperium Morza Północnego Kanuta Wielkiego odrodzone w naszych czasach."
 nor_develop_stavanger: "Rozwiń Stavanger"
 nor_amber_trade: "Handel bursztynem"
 nor_amber_trade_desc: "Bałtycki bursztyn wywożony jest po całej Europie przez północnomorską sieć handlową Norwegii. „Złoto Północy” dalej rozszerza norweski dochód."
 nor_integrate_finland: "Włącz Finlandię"
 nor_integrate_finland_desc: "Poprzez unię szwedzką włącz Finlandię częścią Imperium Norweskiego. Bezpośrednie posiadanie Turku i Uleåborga rozszerza królestwo od Północnego Atlantyku po Morze Barentsa."
 nor_engelbrekt: "Duch Engelbrekta"
 nor_engelbrekt_desc: "Duch powstania Engelbrekta rozprzestrzenił się na Norwegię. Ze wsparciem chłopstwa i twardą determinacją do niepodległości ucieleśnij tradycję północnych wolnych ludzi."
 nor_develop_hammerfest: "Rozwiń Hammerfest"
 nor_develop_hammerfest_desc: "Hammerfest jest jednym z najbardziej wysuniętych na północ miast świata. Rozwinięcie tej arktycznej placówki handlowej miastem ustanawia stałe centrum handlu arktycznego."
 nor_karoliner: "Norweska elitarna armia"
 nor_karoliner_desc: "Norweska elitarna armia, wspierana wysoką tradycją wojskową, ukończona. Siła militarna Imperium Norweskiego — wykorzystująca teren górski dla obrony i potężnego natarcia — ukazana."
 nor_great_power: "Wielka potęga Północy"
 nor_great_power_desc: "Monarchia absolutna oraz rozwinięte rybołówstwo i przemysł — Norwegia powstaje jako wielka potęga Europy Północnej. Ustanów tę pozycję 200+ prowincjami, dochodem 250+, prestiżem 60+."
 nor_colonization: "Norweskie imperium kolonialne"
 nor_stormakt: "Stormakt — wielka potęga Północy"
 nor_stormakt_desc: "Skandynawia zjednoczona, Imperium Morza Północnego zbudowane, gospodarka północna osiągnięta — trzy filary łączą się, a Norwegia panuje jako Stormakt (wielka potęga) Europy Północnej. Z 600+ prowincjami, dochodem 600+, prestiżem 80+ zdobądź tę chwałę."
 nor_norwegian_empire: "Imperium Norweskie"
 nor_norwegian_empire_desc: "Od Islandii po Vinland, od Nidaros po Brytanię — Imperium Norweskie ukończone. Potomkowie wikingów przewyższyli nawet marzenia swych przodków. Imperium takiej skali, o której nigdy nie marzył nawet Kanut Wielki, narodziło się tutaj. „Morze Północne znów stało się jeziorem Norwegii” — tak napiszą historycy."
 nor_events.30.t: "Jedność skandynawska — świt potęgi norweskiej"
 nor_events.30.d: "Dania kontrolowana, Szwecja zjednoczona — cała Skandynawia zjednoczona pod norweskim sztandarem. Od czasów wikingów to osiągnięcie, któremu nikt nie sprostał, wreszcie urzeczywistnione. Dzwony katedry w Nidaros biją, a król Norwegii niniejszym ogłasza tytuł „Króla Skandynawii”."
 nor_events.30.a: "Niech żyje Skandynawia! Norwegia na wieki!"
 nor_events.40.t: "Skrzyżowanie wiary — religijny wybór Norwegii"
 nor_events.40.d: "Burza Reformacji dotarła do Norwegii. Duchowieństwo katedry w Nidaros wzywa do wierności Rzymowi. Lecz coraz więcej odnajduje oddźwięk w nowej nauce Lutra. I — są tacy, którzy marzą o powrocie do dawnych bogów. Wybór króla norweskiego zdecyduje o przyszłości tego północnego królestwa."
 nor_events.40.a: "Zachować wierność Rzymowi — katolicyzm jest duszą Norwegii"
 nor_events.40.b: "Przyjąć naukę Lutra — nadeszła era reformy"
 nor_events.40.c: "Powrócić do dawnych bogów — szukać błogosławieństwa Odyna"
 nor_events.99.t: "Narodziny Imperium Norweskiego"
 nor_events.99.d: "Od Islandii po Vinland, od Nidaros po Brytanię — Imperium Norweskie wreszcie ukończone. Potomkowie wikingów przewyższyli swych przodków. Imperium takiej skali, o której nigdy nie marzył nawet Kanut Wielki, narodziło się tutaj. „Morze Północne znów stało się morzem wewnętrznym Norwegii” — tak zapiszą historycy."
 nor_events.99.a: "Niech żyje Cesarz Imperium Norweskiego! Dziedzice wikingów na wieki!"
 STATIC_MODIFIER_NAME_nor_kingdom_mod: "Królestwo Norwegii"
 STATIC_MODIFIER_DESC_nor_kingdom_mod: "Kamień węgielny odbudowy Norwegii za panowania króla Magnusa Erikssona położony."
 STATIC_MODIFIER_NAME_nor_denmark_crushed_mod: "Dania zmiażdżona"
 STATIC_MODIFIER_DESC_nor_denmark_crushed_mod: "Największy rywal Norwegii zmiażdżony. Przywództwo nad Skandynawią przechodzi na Norwegię."
 STATIC_MODIFIER_NAME_nor_sweden_union_mod: "Szwedzka unia personalna"
 STATIC_MODIFIER_DESC_nor_sweden_union_mod: "Unia personalna ze Szwecją kładzie podstawę jedności skandynawskiej."
 STATIC_MODIFIER_NAME_nor_scandinavia_united_mod: "Skandynawia zjednoczona"
 STATIC_MODIFIER_DESC_nor_scandinavia_united_mod: "Sztandary trzech królestw stoją obok siebie pod jedną koroną, a rozkazy wydane z Oslo docierają do mórz północnych."
 STATIC_MODIFIER_NAME_nor_bergen_mod: "Węzeł handlowy Bergen"
 STATIC_MODIFIER_DESC_nor_bergen_mod: "Bergen rozwinięte centrum handlu północnoatlantyckiego Norwegii."
 STATIC_MODIFIER_NAME_nor_fleet_mod: "Flota Norwegii"
 STATIC_MODIFIER_DESC_nor_fleet_mod: "Norweska flota z krwią wikingów rozmieszcza się po Morzu Północnym i Północnym Atlantyku."
 STATIC_MODIFIER_NAME_nor_north_sea_mod: "Rynki Morza Północnego"
 STATIC_MODIFIER_DESC_nor_north_sea_mod: "Norwegia ustanowiona głównym graczem w handlu północnomorskim."
 STATIC_MODIFIER_NAME_nor_iceland_mod: "Islandia podbita"
 STATIC_MODIFIER_DESC_nor_iceland_mod: "Islandia zabezpieczona jako przyczółek Norwegii na Północnym Atlantyku."
 STATIC_MODIFIER_NAME_nor_greenland_mod: "Wyprawa grenlandzka"
 STATIC_MODIFIER_DESC_nor_greenland_mod: "Norwescy żeglarze, płynący ku lodowatym morzom Grenlandii, kreślą nowe linie na mapach dalekiej północy."
 STATIC_MODIFIER_NAME_nor_vinland_mod: "Vinland"
 STATIC_MODIFIER_DESC_nor_vinland_mod: "Norwegia staje się pierwszym narodem kolonialnym Europy w Nowym Świecie z osadami w Ameryce Północnej."
 STATIC_MODIFIER_NAME_nor_orkney_mod: "Orkady i Szetlandy"
 STATIC_MODIFIER_DESC_nor_orkney_mod: "Przez fale Morza Północnego, widoczne z portów Orkadów, sylwetki norweskich statków przechodzą nieustannie."
 STATIC_MODIFIER_NAME_nor_scotland_mod: "Szkocja podbita"
 STATIC_MODIFIER_DESC_nor_scotland_mod: "Zdobycie Edynburga otwiera drogę do Brytanii."
 STATIC_MODIFIER_NAME_nor_england_invasion_mod: "Inwazja na Anglię"
 STATIC_MODIFIER_DESC_nor_england_invasion_mod: "Pamięć o Danelaw odrodzona. Siły norweskie przemierzają północną Anglię."
 STATIC_MODIFIER_NAME_nor_britain_mod: "Królestwo Brytanii"
 STATIC_MODIFIER_DESC_nor_britain_mod: "Imperium Morza Północnego Kanuta Wielkiego odrodzone. Cały archipelag brytyjski pod kontrolą norweską."
 STATIC_MODIFIER_NAME_nor_north_sea_master_mod: "Pan Morza Północnego"
 STATIC_MODIFIER_DESC_nor_north_sea_master_mod: "Norwegia staje się niekwestionowanym panem Morza Północnego. Całe Morze Północne pod kontrolą norweską."
 STATIC_MODIFIER_NAME_nor_nidaros_mod: "Nidaros rozwinięte"
 STATIC_MODIFIER_DESC_nor_nidaros_mod: "Historyczna stolica Norwegii rozwinięta jako centrum religijne i kulturalne Północy."
 STATIC_MODIFIER_NAME_nor_fisheries_mod: "Rybołówstwo rozwinięte"
 STATIC_MODIFIER_DESC_nor_fisheries_mod: "Bogate zasoby rybne Północnego Atlantyku w pełni wykorzystane, ustanawiając podstawę gospodarczą Norwegii."
 STATIC_MODIFIER_NAME_nor_oslo_mod: "Oslo rozwinięte"
 STATIC_MODIFIER_DESC_nor_oslo_mod: "Pisarze twierdzy Akershus piszą edykty królewskie od doliny do doliny po całej południowej Norwegii."
 STATIC_MODIFIER_NAME_nor_absolutism_mod: "Absolutyzm"
 STATIC_MODIFIER_DESC_nor_absolutism_mod: "Monarchia absolutna ustanowiona w Norwegii. Podstawa dla scentralizowanych rządów imperialnych położona."
 STATIC_MODIFIER_NAME_nor_catholic_mod: "Katolicka Norwegia"
 STATIC_MODIFIER_DESC_nor_catholic_mod: "Zachowując wierność Kościołowi Rzymskiemu, Norwegia uznana jest strażniczką północnej cywilizacji katolickiej."
 STATIC_MODIFIER_NAME_nor_crusader_mod: "Chwała krzyżowca północnego"
 STATIC_MODIFIER_DESC_nor_crusader_mod: "Norwegia zyskuje rozgłos strażniczki chrześcijaństwa poprzez świętą wojnę."
 STATIC_MODIFIER_NAME_nor_lutheran_mod: "Reforma luterańska"
 STATIC_MODIFIER_DESC_nor_lutheran_mod: "Święte naczynia wyniesione z klasztorów leżą w królewskich skrzyniach, a skarbiec Norwegii jest pełniejszy niż kiedykolwiek."
 STATIC_MODIFIER_NAME_nor_protestant_church_mod: "Kościół protestancki"
 STATIC_MODIFIER_DESC_nor_protestant_church_mod: "Przygotowanie teologii luterańskiej zakorzenia wiarę protestancką w całej Norwegii."
 STATIC_MODIFIER_NAME_nor_norse_conversion_mod: "Odrodzenie wiary nordyckiej"
 STATIC_MODIFIER_DESC_nor_norse_conversion_mod: "Wiara w Odyna, Thora i Freyra odrodzona. Duch wojownika epoki wikingów zamieszkuje norweskie armie."
 STATIC_MODIFIER_NAME_nor_berserker_fleet_mod: "Flota berserków"
 STATIC_MODIFIER_DESC_nor_berserker_fleet_mod: "Duch berserków wikingów zamieszkuje flotę. Korsarze swobodnie pustoszą wybrzeża niewiernych."
 STATIC_MODIFIER_NAME_nor_ragnarok_mod: "Imperium Ragnaröku"
 STATIC_MODIFIER_DESC_nor_ragnarok_mod: "Pod błogosławieństwem dawnych bogów Norwegia odradza się jako imperium północne."
 STATIC_MODIFIER_NAME_nor_hansa_victory_mod: "Hanza pokonana"
 STATIC_MODIFIER_DESC_nor_hansa_victory_mod: "Niemieckie panowanie kupieckie nad Bergen zmiażdżone."
 STATIC_MODIFIER_NAME_nor_baltic_mod: "Dostęp do Bałtyku"
 STATIC_MODIFIER_DESC_nor_baltic_mod: "Norwegia zapewnia bezpośredni dostęp do Bałtyku przez Stralsund."
 STATIC_MODIFIER_NAME_nor_trade_supremacy_mod: "Dominacja w handlu północnomorskim"
 STATIC_MODIFIER_DESC_nor_trade_supremacy_mod: "Norwegia przejmuje inicjatywę nad całym szlakiem handlowym Morza Północnego."
 STATIC_MODIFIER_NAME_nor_stavanger_mod: "Port Stavanger"
 STATIC_MODIFIER_DESC_nor_stavanger_mod: "Stavanger rozwinięte jako węzeł rybacki i handlowy południowo-zachodniej Norwegii."
 STATIC_MODIFIER_NAME_nor_amber_mod: "Handel bursztynem"
 STATIC_MODIFIER_DESC_nor_amber_mod: "Bałtycki bursztyn wywożony przez sieć handlową Norwegii."
 STATIC_MODIFIER_NAME_nor_finland_mod: "Finlandia włączona"
 STATIC_MODIFIER_DESC_nor_finland_mod: "Finlandia włączona częścią Imperium Norweskiego."
 STATIC_MODIFIER_NAME_nor_engelbrekt_mod: "Duch Engelbrekta"
 STATIC_MODIFIER_DESC_nor_engelbrekt_mod: "Tradycja północnych wolnych ludzi ucieleśniona dumą Norwegii."
 STATIC_MODIFIER_NAME_nor_hammerfest_mod: "Hammerfest rozwinięte"
 STATIC_MODIFIER_DESC_nor_hammerfest_mod: "Najbardziej wysunięta na północ placówka handlowa świata ustanowiona stałym centrum handlu arktycznego."
 STATIC_MODIFIER_NAME_nor_military_tradition_mod: "Norweska elitarna armia"
 STATIC_MODIFIER_DESC_nor_military_tradition_mod: "Wysoko wyszkolona norweska armia elitarna, wsparta silną tradycją wojskową, ukończona."
 STATIC_MODIFIER_NAME_nor_great_power_mod: "Wielka potęga Północy"
 STATIC_MODIFIER_DESC_nor_great_power_mod: "Norwegia powstaje jako wielka potęga Europy Północnej."
 STATIC_MODIFIER_NAME_nor_protestant_empire_mod: "Imperium protestanckie"
 STATIC_MODIFIER_DESC_nor_protestant_empire_mod: "Norwegia z całoskandynawskim luteranizmem panuje jako północny obrońca świata protestanckiego."
 STATIC_MODIFIER_NAME_nor_papal_champion_mod: "Obrońca papieża"
 STATIC_MODIFIER_DESC_nor_papal_champion_mod: "Niewzruszona pozycja najsilniejszej strażniczki północnej cywilizacji katolickiej ustanowiona."
 STATIC_MODIFIER_NAME_nor_colonial_empire_mod: "Norweskie imperium kolonialne"
 STATIC_MODIFIER_DESC_nor_colonial_empire_mod: "Norwegia staje się pierwszym prawdziwym imperium kolonialnym Europy z 10+ koloniami, w tym Vinlandem."
 STATIC_MODIFIER_NAME_nor_stormakt_mod: "Stormakt"
 STATIC_MODIFIER_DESC_nor_stormakt_mod: "Era wielkomocarstwowości Norwegii nastała — panując jako największa potęga Europy Północnej."
 STATIC_MODIFIER_NAME_nor_sound_toll_mod: "Cło Sundzkie"
 STATIC_MODIFIER_DESC_nor_sound_toll_mod: "Pobieranie Cła Sundzkiego wzbogaca skarbiec norweski."
 STATIC_MODIFIER_NAME_nor_stockholm_mod: "Sztokholm rozwinięty"
 STATIC_MODIFIER_DESC_nor_stockholm_mod: "Sztokholm rozwinięty jako wschodni węzeł administracyjny Imperium Norweskiego przez unię szwedzką."
 STATIC_MODIFIER_NAME_nor_hanseatic_expulsion_mod: "Kupcy hanzeatyccy wypędzeni"
 STATIC_MODIFIER_DESC_nor_hanseatic_expulsion_mod: "Bergen uwolnione od niemieckiego panowania kupieckiego — norwescy kupcy władają własnym portem."
 STATIC_MODIFIER_NAME_nor_north_sea_empire_mod: "Imperium Morza Północnego"
 STATIC_MODIFIER_DESC_nor_north_sea_empire_mod: "Imperium Morza Północnego Kanuta Wielkiego odrodzone w naszych czasach. Całe wybrzeże Morza Północnego pod kontrolą norweską."
 STATIC_MODIFIER_NAME_nor_norwegian_empire_final_mod: "Imperium Norweskie"
 STATIC_MODIFIER_DESC_nor_norwegian_empire_final_mod: "Imperium Norweskie, rozciągające się od Islandii po Vinland, ukończone. Dziedzice wikingów przewyższyli swych przodków."
 STATIC_MODIFIER_NAME_nor_faith_steadfast_mod: "Niezłomny w wierze"
 STATIC_MODIFIER_DESC_nor_faith_steadfast_mod: "Niezłomna wiara katolicka ogłasza władzę króla ludowi dzwonami katedry w Nidaros."
 STATIC_MODIFIER_NAME_nor_reform_winds_mod: "Wiatry reformy"
 STATIC_MODIFIER_DESC_nor_reform_winds_mod: "Nauka Lutra rozprzestrzenia się po Norwegii."
 STATIC_MODIFIER_NAME_nor_old_gods_calling_mod: "Wołanie dawnych bogów"
 STATIC_MODIFIER_DESC_nor_old_gods_calling_mod: "Wiara w Odyna i Thora potajemnie się odradza."
 nor_expel_danish_nobility: "Przeciwstaw się Danii"
 nor_expel_danish_nobility_desc: "W 1337 roku Norwegia — niezależne królestwo w unii personalnej ze Szwecją pod królem Magnusem Erikssonem — nie jest duńskim wasalem. Dania jest trudnym sąsiadem, a nadchodząca Unia Kalmarska (1397) grozi daniem Danii dominacji nad Skandynawią. Ustanów pozycję Norwegii w Skandynawii poprzez jasne stosunki z Danią teraz — czy to przez rywalizację, sojusz czy przyjaźń."
 nor_secure_bergen_desc: "Bryggen — te kolorowe drewniane magazyny ustawione wzdłuż nabrzeża w Bergen — symbol hanzeatyckiego dobrobytu kupieckiego. Lecz Bergen musi być miastem norweskim. Gdy władza króla rozciągnie się na ten port, bogactwo handlu północnoatlantyckiego popłynie w norweskie ręce."
 nor_develop_stavanger_desc: "Stavanger jest starożytnym miastem biskupim na południowo-zachodnim wybrzeżu Norwegii. Jako serce Rogalandu, gdzie splatają się skały i fiordy, ten port staje się węzłem połowu śledzi i handlu północnomorskiego. Rozwiń go drugim wielkim miastem portowym Norwegii po Bergen."
 nor_develop_oslo_desc: "Oslo, ukryte za murami twierdzy Akershus, jest południową bramą między Danią a Szwecją. Na wschodzie leży Szwecja; na południu — Dania. Rozwinąwszy Oslo w kwitnące miasto, południowa granica Norwegii jest zabezpieczona, a rolnictwo i handel zaczynają prosperować."
 nor_secure_nidaros_desc: "Nidaros — to miasto zbudowane tam, gdzie poniósł śmierć męczeńską Święty Olaf, stoi pod największą gotycką katedrą Skandynawii i niesie tysiącletnią historię duchowego centrum północnego świata chrześcijańskiego. Rozwinąć Nidaros — znaczy zyskać aprobatę władzy króla norweskiego zarówno przez niebo, jak i ziemię."
 nor_vinland_desc: "Tysiąc lat temu Leif, syn Eryka Rudego, stanął na dalekim kontynencie za mgłą — Vinlandzie. Teraz naród kolonialny pod norweskim sztandarem niesie to marzenie dalej. Norwegia wpisana w historię pierwszym narodem europejskim, który zapuścił korzenie w Nowym Świecie."
 nor_colonization_desc: "Od Vinlandu po Grenlandię, od Islandii po arktyczne brzegi — norweskie narody kolonialne rozprzestrzeniają się po Północnym Atlantyku. Duch wikingów eksploracji żyje w naszych czasach, a Norwegia stoi prawdziwym imperium morskim, panującym nad światem za morzami."
 nor_kingdom_of_britain_desc: "Londyn, York, Edynburg — trzy wielkie miasta Wysp Brytyjskich zjednoczone pod norweskim sztandarem. Marzenie Kanuta Wielkiego spełnione ponownie. Pamięć o Danelaw ożywa w naszych czasach, a Morze Północne staje się jeziorem Norwegii."
 nor_arctic_trade_desc: "Półwysep Kolski — zamarznięta ziemia na krańcu Arktyki — jest skarbnicą futer, dziczyzny i kła morsa. Towary arktyczne, przynoszone przez łowców saamskich, przynoszą ogromne bogactwo jako najlepsze futra, jakich szuka szlachta europejska. Zdobywszy Półwysep Kolski, Norwegia staje się absolutnym panem handlu arktycznego."
 nor_timber_industry_desc: "Lasy Norwegii są darem zarówno dla szkutników, jak i budowniczych. Świerk, sosna i brzoza, ścięte z głębokich lasów — w parze z żelaznymi narzędziami, kutymi do ich obróbki — tworzą przemysłowy kręgosłup gospodarki norweskiej. Gdy dym tartaków się unosi, Norwegia staje się największym eksporterem drewna Europy Północnej."
 STATIC_MODIFIER_NAME_nor_timber_mod: "Przemysł drzewny"
 STATIC_MODIFIER_DESC_nor_timber_mod: "Drewno i narzędzia, wykute z bogatych lasów Norwegii, wspierają podstawę przemysłową."
 STATIC_MODIFIER_NAME_nor_arctic_trade_mod: "Handel arktyczny"
 STATIC_MODIFIER_DESC_nor_arctic_trade_mod: "Futra i dziczyzna z Półwyspu Kolskiego płyną przez norweskich kupców po całej Europie."
 STATIC_MODIFIER_NAME_nor_northern_economy_mod: "Gospodarka północna"
 STATIC_MODIFIER_DESC_nor_northern_economy_mod: "Handel norweski, zbudowany na rybołówstwie, drewnie, futrach i handlu arktycznym, osiąga najwyższy poziom w Europie Północnej. Koszty utrzymania kupców obniżone, a więcej placówek handlowych może zostać założonych."
