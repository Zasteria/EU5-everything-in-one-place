l_polish:
 som_ottoman_mission_pack_desc: "Od granicznego beyliku do najpotężniejszego sułtanatu świata. Zjednocz Anatolię, przejdź do Rumelii i zgłoś roszczenia do Konstantynopola — wiecznego miasta, które ma być twoim tronem."
 som_tur_secure_bursa: "Zabezpiecz Bursę"
 som_tur_secure_bursa_desc: "Bursa, pierwsze wielkie miasto Osmanów, musi być mocno pod kontrolą dynastii. Ustanów porządek i zbuduj podstawę trwałego państwa."
 som_tur_frontier_warriors: "Wykuj wojowników granicznych"
 som_tur_frontier_warriors_desc: "Wojownicy-ghazi, którzy wykuli nasz beylik, muszą być związani z dynastią. Ich duch bojowy jest naszą największą bronią."
 som_tur_cross_the_straits: "Przekrocz cieśniny"
 som_tur_cross_the_straits_desc: "Zabezpiecz Çanakkale i otwórz drogę do Europy. W nagrodę zostanie udzielony casus belli do podboju prowincji Gallipoli."
 som_tur_anatolian_heartland: "Zjednocz Anatolię"
 som_tur_anatolian_heartland_desc: "Zabezpiecz Ankarę i ustal kierunek jej rozwoju jako serca Anatolii. To, co ta ziemia wyprodukuje, zdecyduje o przyszłości Imperium."
 som_ottoman_events.18.t: "Serce Anatolii — przyszłość Ankary"
 som_ottoman_events.18.d: "Ankara, rdzenne miasto Anatolii, wpadła pod kontrolę Imperium. Dwór dyskutuje, jaka gałąź przemysłu powinna zdefiniować przyszłość tego regionu: udoskonalić jej długą tradycję tkactwa, zasadzić morwy dla jedwabnictwa, czy promować uprawę jaskrawych roślin barwierskich."
 som_ottoman_events.18.a: "Kontynuować rozwój przemysłu tkackiego"
 som_ottoman_events.18.b: "Zasadzić morwy i rozpocząć produkcję jedwabiu"
 som_ottoman_events.18.c: "Promować uprawę roślin barwierskich"
 som_tur_vassalize_beyliks: "Podporządkowanie beyliktów"
 som_tur_vassalize_beyliks_desc: "Pozostałe beyliki anatolijskie muszą złożyć hołd lub zostać zmiażdżone. Tylko zjednoczona Anatolia może rzucić wyzwanie potęgom wschodu i zachodu."
 som_tur_siege_constantinople: "Upadek Konstantynopola"
 som_tur_siege_constantinople_desc: "Wieczne miasto, siedziba Cesarstwa Wschodniorzymskiego, musi upaść przed osmańskim działem i stalą. Jego podbój obwieści światu nasze imperium. Ludność miasta zostanie przekształcona pod rządami osmańskimi."
 STATIC_MODIFIER_NAME_som_tur_ghazi_warriors: "Wojownicy-ghazi"
 STATIC_MODIFIER_DESC_som_tur_ghazi_warriors: "„Ghazi” — tytuł tego, kto walczy przeciwko niewiernym w imię islamu. Od Osmana Ghazi, założyciela dynastii, wojownicy graniczni nieustannie posuwali się w osłabione pogranicza Bizancjum z tym świętym poczuciem misji. Ten zapał religijny był duchowym silnikiem ekspansji osmańskiej."
 som_ottoman_events.1.t: "Bursa — kolebka Osmanów"
 som_ottoman_events.1.d: "Bursa, Iznik i Nikomedia wpadły w ręce osmańskie. W Bursie greckie społeczności prawosławne, ormiańskie, żydowskie i tureckie muzułmańskie żyją obok siebie pod nową dynastią. Dwór sułtana stoi teraz przed pytaniem: jak włączyć te różne ludy do państwa osmańskiego?"
 som_ottoman_events.1.a: "Zjednoczyć je pod sztandarem islamu i tradycji tureckiej"
 som_ottoman_events.1.a.tt: "Wielu mieszkańców Bursy nawróci się na sunnizm i przyjmie kulturę turecką."
 som_ottoman_events.4.t: "Upadek Konstantynopola"
 som_ottoman_events.4.d: "Konstantynopol upadł. Ostatni cesarz Bizancjum, Konstantyn XI, poległ w walce na murach, a wojska Mehmeda II wkroczyły do miasta. Tam, gdzie niegdyś biły dzwony Hagia Sophia, teraz rozbrzmiewa wezwanie do modlitwy. Sułtan ogłasza miasto przemianowanym na Kostantiniyye i ogłasza je nową stolicą imperialną."
 som_ottoman_events.4.a: "Przekształcić miasto w stolicę osmańską"
 som_ottoman_events.4.a.tt: "Większość mieszkańców Konstantynopola nawróci się na sunnizm i przyjmie kulturę turecką."
 som_tur_conquer_bulgaria: "Podbij Bułgarię"
 som_tur_conquer_bulgaria_desc: "Tyrnowo było chwalebną stolicą Drugiego Carstwa Bułgarskiego. Zdobądź to miasto i otwórz drogę na północ."
 som_tur_conquer_serbia: "Podbij Serbię"
 som_tur_conquer_serbia_desc: "Novo Brdo zawiera największe kopalnie srebra Bałkanów, podczas gdy Skopje jest bramą do Macedonii. Zabezpiecz oba miasta, by przywieść południową Serbię pod kontrolę osmańską."
 som_tur_conquer_hungary: "Najedź Węgry"
 som_tur_conquer_hungary_desc: "Rozgrom węgierskie wojsko polowe pod Mohaczem i zajmij Budę. Dunaj stanie się północną granicą Imperium Osmańskiego."
 som_tur_siege_vienna: "Oblężenie Wiednia"
 som_tur_siege_vienna_desc: "Wznieś sztandar osmański przed murami Wiednia. Świat będzie świadkiem potęgi Imperium Osmańskiego."
 som_tur_anatolia_unified: "Jedność Anatolii"
 som_tur_anatolia_unified_desc: "Podbij Trapezunt i Erzurum, by przywieść całą Anatolię pod panowanie osmańskie. Góry Pontyjskie oznaczą wschodnią granicę imperium."
 som_tur_conquer_syria: "Do Syrii"
 som_tur_conquer_syria_desc: "Podbij Aleppo i Damaszek. Syria jest sercem uczoności i handlu islamskiego; jej zdobycie podnosi prestiż imperium."
 som_tur_defeat_mamluks: "Pokonaj Mameluków"
 som_tur_defeat_mamluks_desc: "Podczas wojny z Mamelukami zajmij Kair, by wymusić korzystny pokój. Z zajętym Kairem Mameluków można zmusić do przyjęcia wasalstwa."
 som_tur_holy_cities: "Święte miasta"
 som_tur_holy_cities_desc: "Zabezpiecz Jerozolimę i ogłoś sułtana kalifem. Jako strażnik dwóch świętych miast, Osmanowie stoją na szczycie świata islamskiego."
 som_tur_red_sea_dominance: "Panowanie nad Morzem Czerwonym"
 som_tur_red_sea_dominance_desc: "Zabezpiecz Aleksandrię i opanuj szlaki handlowe Morza Czerwonego. Bogactwo handlu Oceanu Indyjskiego napełnia osmański skarbiec."
 som_tur_age_of_suleiman: "Pax Ottomana"
 STATIC_MODIFIER_NAME_som_tur_danube_frontier: "Granica dunajska"
 STATIC_MODIFIER_DESC_som_tur_danube_frontier: "Dunaj ustanowiony północną granicą, a lekcje osmańskiej armii stojącej przed bramami Wiednia wpisane są w doktrynę imperialną."
 STATIC_MODIFIER_NAME_som_tur_anatolia_unified_mod: "Anatolia zjednoczona"
 STATIC_MODIFIER_DESC_som_tur_anatolia_unified_mod: "Od Trapezuntu po Erzurum cała Anatolia pod kontrolą osmańską. Wschodnia podstawa imperium zabezpieczona, poprawiając dochód podatkowy i legitymizację."
 STATIC_MODIFIER_NAME_som_tur_red_sea_trade: "Imperialna sieć dróg"
 STATIC_MODIFIER_DESC_som_tur_red_sea_trade: "Morze Czerwone było złotym szlakiem, którym przyprawy, jedwabie i barwniki Indii i Azji Południowo-Wschodniej szły do Europy. Nawet po tym, jak Portugalia otworzyła nowy szlak wokół południowego krańca Afryki, szlak czerwonomorski przez Kair i Aleksandrię zachował swą wartość, a Imperium Osmańskie stało się największym beneficjentem tego szlaku handlowego."
 som_tur_fate_of_crimea: "Los Krymu"
 som_tur_fate_of_crimea_desc: "Półwysep Krymski z genueńską placówką handlową Kaffa w jego sercu kontroluje handel wzdłuż północnego Morza Czarnego. Zabezpiecz ten region i przywiedź handel czarnomorski pod kontrolę osmańską."
 som_tur_black_sea_dominance: "Panowanie nad Morzem Czarnym"
 som_tur_black_sea_dominance_desc: "Z zabezpieczonym Krymem, umocnioną Edirne i zjednoczoną Anatolią Morze Czarne stało się osmańskim jeziorem. Rozwiń surowiec Konstantynopola i ustanów pełną hegemonię nad Morzem Czarnym."
 som_tur_italy_south: "Południowe Włochy"
 som_tur_italy_south_desc: "Podbij Neapol i Sycylię, by zdobyć centrum Morza Śródziemnego. Te starożytne miasta handlowe napełnią skarbiec imperialny."
 som_tur_italy_north: "Włochy podbite"
 som_tur_italy_north_desc: "Podbij Rzym, Florencję i Mediolan, by dopełnić podbój półwyspu włoskiego. Miasto papieża, miasto Medyceuszy, miasto Viscontich — wszystkie stają się sułtańskie."
 som_tur_arabia_conquest: "Opanuj Arabię"
 som_tur_arabia_conquest_desc: "Zabezpiecz Mekkę, Medynę i Suez, by kontrolować święte miasta świata islamskiego i wrota do Oceanu Indyjskiego."
 som_tur_persian_gulf: "Zatoka Perska"
 som_tur_persian_gulf_desc: "Zdobądź Ormuz i opanuj szlaki handlowe Zatoki Perskiej. Bogactwo handlu Oceanu Indyjskiego płynie do osmańskiego skarbca."
 som_tur_north_africa: "Maghreb"
 som_tur_north_africa_desc: "Podbij Tunis, Algier i Trypolis, by przywieść południowe wybrzeże śródziemnomorskie pod panowanie osmańskie. Korsarze berberyjscy skłaniają się przed sztandarem sułtana."
 som_tur_morocco: "Maroko"
 som_tur_morocco_desc: "Podbij Fez i Marrakesz, by dodać całą Afrykę Północną do Imperium Osmańskiego. Brzegi Atlantyku stają się zachodnią granicą imperium."
 som_tur_age_of_suleiman_desc: "Od Wiednia na północy po Arabię i Maroko na południu — imperium światowe obejmujące trzy kontynenty ukończone. Wymaga ukończenia Oblężenia Wiednia, Zatoki Perskiej i Maroka."
 STATIC_MODIFIER_NAME_som_tur_black_sea_master: "Pan Morza Czarnego"
 STATIC_MODIFIER_DESC_som_tur_black_sea_master: "Morze Czarne jest teraz osmańskim jeziorem. W świetle tego osiągnięcia dwór dyskutuje o wprowadzeniu nowych instytucji rządzących, otwierając miejsce na nową reformę."
 STATIC_MODIFIER_NAME_som_tur_italy_south_mod: "Panowanie w południowych Włoszech"
 STATIC_MODIFIER_DESC_som_tur_italy_south_mod: "Kontrolując Neapol i Sycylię, centralne Morze Śródziemne przeszło w ręce osmańskie. Dochód handlowy i reputacja dyplomatyczna poprawione."
 STATIC_MODIFIER_NAME_som_tur_arabia_mod: "Strażnik Arabii"
 STATIC_MODIFIER_DESC_som_tur_arabia_mod: "„Opiekun Dwóch Świętych Meczetów” — Mekka i Medyna to dwa najświętsze miejsca islamu. W 1517 roku Selim I podbił Egipt i Hidżaz i wziął te miejsca w swe ręce, a sułtan osmański stał się religijnym obrońcą całego sunnickiego świata muzułmańskiego. Obowiązek i honor ochrony corocznej pielgrzymki hadżdż spoczęły na sułtanie."
 STATIC_MODIFIER_NAME_som_tur_gulf_trade: "Dominacja handlowa w Zatoce Perskiej"
 STATIC_MODIFIER_DESC_som_tur_gulf_trade: "Cieśnina Ormuz jest jedyną bramą, przez którą przyprawy i jedwabie Indii i Azji Południowo-Wschodniej wchodzą do Zatoki Perskiej. Posiadanie tej „szyi świata” byłoby decydującym atutem przeciw indyjskiemu szlakowi handlowemu, który Portugalia starała się ustanowić wokół Afryki."
 STATIC_MODIFIER_NAME_som_tur_africa_final_mod: "Hegemonia afrykańska"
 STATIC_MODIFIER_DESC_som_tur_africa_final_mod: "Afryka Północna podbita. Elitarna kawaleria z pustyń i stepów dołącza do armii osmańskiej, poprawiając siłę zarówno lekkiej, jak i ciężkiej jazdy."
 STATIC_MODIFIER_NAME_som_tur_ankara_fine_cloth: "Handel tkaninami Ankary"
 STATIC_MODIFIER_DESC_som_tur_ankara_fine_cloth: "W warsztatach Ankary tradycyjne techniki tkackie są dalej doskonalone, zwiększając produkcję cienkiej tkaniny."
 STATIC_MODIFIER_NAME_som_tur_ankara_silk: "Handel jedwabiem Ankary"
 STATIC_MODIFIER_DESC_som_tur_ankara_silk: "Morwy posadzone na wszystkich polach Ankary, zwiększając produkcję jedwabiu."
 STATIC_MODIFIER_NAME_som_tur_ankara_dyes: "Handel barwnikami Ankary"
 STATIC_MODIFIER_DESC_som_tur_ankara_dyes: "Uprawa jaskrawych roślin barwierskich rozprzestrzenia się wokół Ankary, zwiększając produkcję barwników."
 eyalet: "Ejalet"
 eyalet_desc: "Prowincjonalne państwo wasalne Imperium Osmańskiego. Podlega surowszej kontroli niż wasal, płacąc podwójny trybut i podlegając dyplomatycznej aneksji dwukrotnie szybciej."
 eyalet_plural: "Ejalety"
 som_ottoman_events.20.t: "Panowanie nad Morzem Czarnym"
 som_ottoman_events.20.d: "Morze Czarne było niegdyś jeziorem genueńskim. Lecz z upadkiem Kaffy w 1475 roku i osmańską kontrolą nad Bosforem ostatni bastion genueński zniknął. Morze Czarne jest teraz jeziorem osmańskim. Trzy wieki weneckiej i genueńskiej dominacji handlowej nad wschodnim Morzem Śródziemnym dobiegają końca."
 som_ottoman_events.20.a: "Morze Czarne — jezioro osmańskie"
 som_ottoman_events.30.t: "Bramy Wiednia"
 som_ottoman_events.30.d: "Armia Sulejmana Wspaniałego dotarła do Wiednia. Trzysta tysięcy żołnierzy osmańskich wstrząsnęło całym światem chrześcijańskim. W 1529 roku miasto przetrwało dzięki wczesnej zimie i przeciążonym liniom zaopatrzenia — lecz tym razem jest inaczej. „Jeśli Wiedeń upadnie, Europa jest nasza” — oświadcza sułtan."
 som_ottoman_events.30.a: "Zdobyć Wiedeń i stać się władcą Europy"
 som_ottoman_events.99.t: "Era Sulejmana"
 som_ottoman_events.99.d: "Imperium Osmańskie osiągnęło swój szczyt — erę Sulejmana Wspaniałego. Od Bałkanów po Arabię, od Krymu po Afrykę Północną, panowanie przewyższające nawet Rzym skłania się przed wolą jednego sułtana. Nazwany „Prawodawcą” (Kanuni) za kodyfikację prawa osmańskiego, Sulejman przewodzi największemu rozkwitowi sztuki, architektury i potęgi militarnej w historii imperium. Meczety, pałace i bazary Stambułu ogłaszają chwałę największego miasta świata. Imperium Osmańskie stało się jedną z najwyższych potęg historii."
 som_ottoman_events.99.a: "Rozpoczyna się złoty wiek wielkiego Imperium Osmańskiego"
 som_tur_edirne_capital: "Twierdza Edirne"
 som_tur_edirne_capital_desc: "Starożytny Adrianopol stał się Edirne, gdy Murad I uczynił go stolicą osmańską w 1363 roku — bazą, z której podbijano Bałkany. Pozostawał stolicą imperialną przez prawie dziewięćdziesiąt lat, aż Konstantynopol upadł w 1453 roku, i tu urodził się Mehmed II. Umocnij to miasto jako kotwicę Rumelii i trampolinę do podboju Bałkanów."
 som_tur_aegean_dominance: "Opanuj Morze Egejskie"
 som_tur_aegean_dominance_desc: "Morze Egejskie było polem bitwy weneckiej i genueńskiej rywalizacji handlowej. Zdobycie Smyrny kamieniem węgielnym wschodniego wybrzeża egejskiego i budowa siły morskiej dają Osmanom przyczółek dla całej ekspansji śródziemnomorskiej. Wczesna flota osmańska musi być zbudowana od zera — lecz wyrośnie w groźną siłę."
 som_tur_janissary_corps: "Korpus janczarów"
 som_tur_janissary_corps_desc: "W połowie XIV wieku syn Orhana I, Murad I, stworzył janczarów — „nowych żołnierzy”, sformowanych z chrześcijańskich chłopców zabranych systemem devşirme, nawróconych na islam i wyszkolonych na wierną stałą piechotę sułtana. Regularnie opłacani i surowo zdyscyplinowani, janczarzy stali się kręgosłupem armii osmańskiej i odegrali decydującą rolę w upadku Konstantynopola i niezliczonych innych bitwach."
 som_tur_devshirme_system: "System devşirme"
 som_tur_devshirme_system_desc: "Devşirme („zbiór chłopców”) zabierał młodzież chrześcijańską z Bałkanów, nawracał ją na islam i szkolił na janczarów i urzędników pałacowych. System ten stworzył klasę urzędników lojalnych wyłącznie sułtanowi, niezwiązanych więzami rodowymi lub rodzinnymi. Z tej klasy wyszło wielu największych wielkich wezyrów Imperium — ludzi, którzy wznieśli się od niewoli do najwyższego urzędu w kraju."
 som_tur_elite_guard: "Elitarna gwardia"
 som_tur_elite_guard_desc: "Osobista gwardia sułtana, wybrana z najlepszych janczarów, była najbardziej zdyscyplinowanymi żołnierzami imperium. Służyli jako wartownicy pałacowi i nosili sztandar imperialny w kampanii. Inwestycja w surowe szkolenie i wysokie standardy tworzy rdzeń profesjonalnej siły bojowej, która poniesie imperium ku chwale."
 som_tur_kanun_i_osmani: "Kanun-i Osmani"
 som_tur_kanun_i_osmani_desc: "Kanun-i Osmani („Kodeks Osmański”) był świeckim systemem prawnym rozwiniętym obok szariatu. Sułtan „Kanuni” (Prawodawca) Sulejman I ukończył jego kodyfikację, lecz podstawy położono w XIV i XV wieku. Obejmując prawo podatkowe, postępowanie karne i administrację, kanun dał państwu osmańskiemu zracjonalizowaną strukturę prawną, działającą obok islamskiego prawa świętego — i je uzupełniającą."
 som_tur_imperial_army: "Armia imperialna"
 som_tur_imperial_army_desc: "Janczarzy, kawaleria sipahi, azapowie, lekka jazda akıncı — armia osmańska była systemem mieszanych rodzajów wojsk, łączącym kilka typów oddziałów pod scentralizowanym dowództwem. Zdyscyplinowana, opłacana i coraz bardziej uzbrojona w broń palną, armia osmańska XVI wieku była jedną z najgroźniejszych machin wojennych, jakie kiedykolwiek widział świat. Doprowadź ją do pełnego potencjału."
 som_tur_timar_system: "System timarów"
 som_tur_timar_system_desc: "Timar był fundamentalną instytucją posiadania ziemi państwa osmańskiego. Sułtan nadawał podbitą ziemię jeźdźcom sipahi jako timary w zamian za służbę wojskową — podobnie do europejskiego feudalizmu, lecz bez praw dziedzicznych. System timarów finansował dużą siłę wojskową bez wyczerpywania skarbca imperialnego, czyniąc wczesną ekspansję osmańską samofinansującą."
 som_tur_sipahi_cavalry: "Kawaleria sipahi"
 som_tur_sipahi_cavalry_desc: "Sipahi — opancerzeni jeźdźcy finansowani nadaniami timarowymi — stanowili główną siłę uderzeniową armii osmańskiej w XV i XVI wieku. Ich gromowe szarże były obawiane na Bałkanach i w Anatolii. W miarę rozszerzania się imperium klasa sipahi stała się potężną arystokracją prowincjonalną, której interesy sułtan musiał uważnie uwzględniać."
 som_tur_eyalet_system: "System ejaletów"
 som_tur_eyalet_system_desc: "Ejalet („prowincja”) był największą jednostką administracyjną Imperium Osmańskiego, zarządzaną przez beylerbeya, mianowanego bezpośrednio przez sułtana. Rumelia, Anatolia, Egipt, Syria — każdy ejalet był miniaturowym imperium z własnym kontyngentem wojskowym i aparatem administracyjnym. System rozprzestrzeniał władzę imperialną do najdalszych zakątków królestwa, nie wymagając osobistej obecności sułtana."
 som_tur_grand_vizier: "Wielki wezyr"
 som_tur_grand_vizier_desc: "Wielki wezyr (Sadrazam) był głównym zarządcą imperium, ustępującym jedynie sułtanowi. Jego rezydencja — „Wysoka Porta” (Bab-ı Ali) — stała się synonimem samego rządu osmańskiego i adresem, pod którym europejscy dyplomaci przedstawiali swe listy uwierzytelniające. Zdolny wielki wezyr mógł skutecznie rządzić imperium, pozwalając sułtanowi skupić się na legitymizacji i dowodzeniu wojskowym."
 som_tur_imperial_bureaucracy: "Biurokracja imperialna"
 som_tur_imperial_bureaucracy_desc: "Biurokracja osmańska — połączenie urzędników devşirme i tradycyjnych administratorów turecko-islamskich — była jednym z najwyrafinowańszych systemów rządowych swej epoki. Kultura dokumentów, scentralizowane prowadzenie ksiąg i wyspecjalizowane departamenty (dywany) uczyniły ogromne imperium zadziwiająco zarządzalnym. Sama ilość zapisów prowadzonych przez pisarzy osmańskich pozostaje dziś skarbnicą dla historyków."
 som_tur_new_capital: "Rozwój Kostantiniyye"
 som_tur_new_capital_desc: "Mehmed II przemianował zdobyte miasto na „Kostantiniyye” i natychmiast rozpoczął ambitny program odbudowy. Przymusowe przesiedlenie rzemieślników i kupców, odbudowa infrastruktury i odrodzenie rynków przekształciły miasto ruin w kwitnącą metropolię. Sułtan zażądał, by Kostantiniyye przewyższyło chwałę bizantyjskiej stolicy, którą zastąpiło — i skierował wszystkie zasoby imperium na osiągnięcie tego."
 som_tur_new_capital_unlock_tt: "Decyzja „Odbudowa Kostantiniyye” jest teraz dostępna."
 som_develop_kostantiniyye_decision.title: "Odbudowa Kostantiniyye"
 som_develop_kostantiniyye_decision.desc: "Zdobyta stolica urosła w siłę, lecz jej dzielnice wciąż noszą blizny po oblężeniu. Skarbiec sułtana może opłacić osadnictwo, nowe rynki i odbudowane ulice, aby Kostantiniyye znów rozkwitło."
 som_develop_kostantiniyye_decision.a: "Przeznaczyć środki na odbudowę stolicy."
 som_expand_kostantiniyye_decision.title: "Poprowadzić Kostantiniyye ku świetności"
 som_expand_kostantiniyye_decision.desc: "Odbudowa przyniosła owoce: nowe dzielnice wypełniają osadnicy i rzemieślnicy. Większe inwestycje w warsztaty, karawanseraje i ziemie wokół miasta pozwolą Kostantiniyye przewyższyć nawet chwałę bizantyjskiej stolicy."
 som_expand_kostantiniyye_decision.a: "Zainwestować w wielkość miasta."
 som_tur_grand_bazaar: "Wielki Bazar"
 som_tur_grand_bazaar_desc: "Zbudowany z rozkazu Mehmeda II między 1455 a 1461 rokiem, Wielki Bazar (Kapalıçarşı) był jednym z pierwszych krytych rynków świata i szybko stał się największym na świecie. Cztery tysiące sklepów, sprzedających jedwab, przyprawy, klejnoty, ceramikę i broń, przyciągało dziesiątki tysięcy kupujących dziennie. W jego centrum sala handlarzy złota i srebra — Bedesten — służyła jako serce handlowe imperium."
 som_tur_grand_bazaar_condition_tt: "Użyto decyzji „Poprowadzić Kostantiniyye ku świetności”"
 som_tur_suleiman_mosque: "Meczet Sulejmana"
 som_tur_suleiman_mosque_desc: "Zaprojektowany przez mistrza-architekta Sinana i ukończony w 1557 roku, meczet Sulejmana jest arcydziełem architektury osmańskiej. Cztery minarety przebijają horyzont Stambułu; rozległa kopuła dominuje nad sylwetką miasta od strony Bosforu. Otaczający kompleks (külliye) obejmował kolegia, szpital, sklepy i karawanseraj — miasto w mieście, uosabiające osmański ideał imperialnego mecenatu."
 som_tur_topkapi_palace: "Pałac Topkapı"
 som_tur_topkapi_palace_desc: "Pałac Topkapı — stojący na przylądku panującym nad Bosforem, Złotym Rogiem i Morzem Marmara — służył jako dwór osmański przez cztery wieki. Komnaty sułtana, imperialny harem, skarbiec i sala rady (Divan-ı Hümayun) — wszystko znajdowało się w jego czterech dziedzińcach. Każdy wielki wezyr był tu mianowany i odwoływany; każda kampania zaczynała się z jego cienia."
 som_tur_city_of_worlds_desire: "Miasto pożądane przez świat"
 som_tur_ulema_authority: "Władza ulemów"
 som_tur_ulema_authority_desc: "Ulemowie — uczeni islamscy, służący jako sędziowie, doradcy prawni i nauczyciele — nadawali państwu osmańskiemu jego religijną legitymizację. Jako kadi (sędziowie), muftowie (konsultanci prawni) i profesorowie medres, wymierzali sprawiedliwość i edukację w całym imperium. Ich aprobata była niezbędna, by każda większa polityka — w tym wypowiedzenia wojny — była postrzegana przez ludność muzułmańską jako prawowita."
 som_tur_millet_system: "System milletów"
 som_tur_millet_system_desc: "System milletów („naród” lub „wspólnota”) zorganizował niemuzułmańskich poddanych Imperium Osmańskiego w półautonomiczne wspólnoty religijne. Grecki prawosławny Rum millet, ormiański millet i żydowski millet — każdy miał własne sądy, szkoły i instytucje charytatywne pod przewodnictwem swych przywódców religijnych. Ten niezwykły system zarządzanego pluralizmu pozwolił imperium rządzić ogromną różnorodnością, nie wymagając przymusowych nawróceń."
 som_tur_kadi_courts: "Sądy kadich"
 som_tur_kadi_courts_desc: "Kadi — sędziowie mianowani bezpośrednio przez sułtana — wymierzali prawo islamskie w całym imperium, od głównych miast po odległe wsie. Ich zapisy sądowe (sijillat) dokumentowały nie tylko spory prawne, lecz także umowy, akty ziemskie i stosunki społeczne, tworząc niezwykle szczegółowy obraz społeczeństwa osmańskiego. System kadich rozprzestrzeniał rządy prawa — prawa osmańskiego — do każdego zakątka królestwa."
 som_tur_sufi_culture: "Kultura sufi"
 som_tur_sufi_culture_desc: "Zakony sufickie (tarikaty) były wplecione w tkankę społeczeństwa osmańskiego. Zakon Mevlevi — znany z wirujących derwiszów — był otoczony opieką dworu. Zakon Bektaszich — duchowy kręgosłup janczarów. Zakon Nakszbandi — wpływowy w polityce pałacowej. Mistycyzm sufi kształtował osmańską poezję, muzykę i sztukę, i służył jako duchowa przeciwwaga dla legalistycznej interpretacji islamu."
 som_tur_cultural_synthesis: "Synteza kulturowa"
 som_tur_cultural_synthesis_desc: "Imperium Osmańskie wchłaniało, a nie niszczyło kultury, które podbijało. Bizantyjskie systemy administracyjne, arabska uczoność, perska kultura dworska i turecka tradycja wojskowa zlały się w swoistą „cywilizację osmańską”. Ta synteza kulturowa nie była jedynie ozdobą — była filozofią rządzącą imperium, pozwalającą mu wchłaniać i wykorzystywać energie dziesiątek podbitych ludów."
 som_tur_bursa_silk_industry: "Przemysł jedwabniczy Bursy"
 som_tur_bursa_silk_industry_desc: "Bursa, pierwsza stolica osmańska, rozwinęła się w stolicę jedwabiu imperium od XIV wieku. Rzemieślnicy, niegdyś pracujący pod bizantyjskim mecenatem, znaleźli nowych panów na dworze osmańskim, produkując luksusowe jedwabie na wywóz do całej Europy i Bliskiego Wschodu. „Miasto jedwabiu” stało się samookreśleniem Bursy — sukces handlowy, który pomógł sfinansować ekspansję osmańską."
 som_tur_silk_road: "Jedwabny Szlak"
 som_tur_silk_road_desc: "Trapezunt był zachodnim punktem końcowym szlaku kaspijskiego — kanału, którym jedwab, przyprawy i luksusowe towary ze Środkowej Azji wchodziły do Anatolii. Kontrola nad tym portem dała Osmanom śmiertelny uścisk na handel lądowy między Azją a Europą. Same dochody z handlu przechodzącego przez Trapezunt pomagały finansować ambicje imperialne przez pokolenia."
 som_tur_ankara_prosperity: "Dobrobyt Ankary"
 som_tur_ankara_prosperity_desc: "Ankara była centralnoanatolijskim węzłem handlu lądowego — miastem, które służyło kupcom przez tysiąclecia. Jej wełna kozy angorskiej zrodziła luksusowe włókno, którego nazwa (angora, później ankara) stała się synonimem miękkości. Rośliny barwierskie, obróbka wełny i jej położenie na szlaku łączącym Bursę z Trapezuntem uczyniły ją niezastąpionym węzłem osmańskiej sieci handlowej."
 som_tur_trade_routes: "Imperialne szlaki handlowe"
 som_tur_trade_routes_desc: "W miarę rozszerzania się imperium Osmanowie inwestowali w karawanseraje (przydrożne zajazdy), brukowane drogi, mosty i patrole morskie przeciw piratom. Rezultatem była infrastruktura handlowa, która uczyniła handel lądowy i morski bezpieczniejszym i bardziej zyskownym niż od czasów rozkwitu Cesarstwa Rzymskiego. Konstantynopol w centrum rozchodzącej się sieci handlowej stał się bijącym sercem ekonomicznym trzech kontynentów."
 som_tur_commercial_empire: "Imperium handlowe"
 som_tur_commercial_empire_desc: "Aleppo, Aleksandria, Konstantynopol — trzy największe miasta handlowe świata, teraz wszystkie osmańskie. Przyprawy Indii, jedwabie Chin, srebro Europy — wszystko przechodziło przez ręce osmańskie w drodze od producenta do konsumenta. Imperium pobierało udział od każdej transakcji. Nawet gdy Portugalczycy otworzyli morski szlak wokół Afryki, osmańscy pośrednicy zachowali ogromną przewagę handlową przez kolejne stulecie."
 STATIC_MODIFIER_NAME_som_tur_janissary_mod: "Korpus janczarów"
 STATIC_MODIFIER_DESC_som_tur_janissary_mod: "Janczarzy — elitarna stała piechota, sformowana z nawróconych chrześcijańskich chłopców — stali się kręgosłupem osmańskiej siły wojskowej. Ich charakterystyczne białe czapki i niebieskie mundury były najbardziej przerażającym widokiem na polach bitew XV wieku. Ich rola w upadku Konstantynopola była decydująca."
 STATIC_MODIFIER_NAME_som_tur_devshirme_mod: "System devşirme"
 STATIC_MODIFIER_DESC_som_tur_devshirme_mod: "Devşirme stworzyło klasę urzędników lojalnych wyłącznie sułtanowi, niezwiązanych więzami rodzinnymi lub rodowymi. Ten merytokratyczny (jak na standardy osmańskie) system pozwalał ludziom skromnego chrześcijańskiego pochodzenia wznosić się do najwyższych urzędów imperium — jednocześnie zapewniając sułtanowi zawsze alternatywną podporę władzy przeciw ugruntowanej szlachcie tureckiej."
 STATIC_MODIFIER_NAME_som_tur_elite_guard_mod: "Elitarna gwardia"
 STATIC_MODIFIER_DESC_som_tur_elite_guard_mod: "Wybrana z najlepszych janczarów, osobista gwardia sułtana była najbardziej zdyscyplinowanymi wojskami imperium. Uosabiali nie tylko potęgę wojskową, lecz także symboliczną władzę sułtanatu — ich obecność w kampanii była oświadczeniem, że osoba sułtana jest obecna, nawet gdy jego samego tam nie było."
 STATIC_MODIFIER_NAME_som_tur_kanun_mod: "Kodeks Kanun"
 STATIC_MODIFIER_DESC_som_tur_kanun_mod: "Kanun — świeckie prawo osmańskie — działał obok szariatu, tworząc podwójny system prawny obejmujący podatki, postępowanie karne i administrację. Prawodawcza władza sułtana do tworzenia prawa świeckiego była teologiczną innowacją, dającą państwu osmańskiemu elastyczność, której brakowało państwom czysto szariackim."
 STATIC_MODIFIER_NAME_som_tur_imperial_army_mod: "Armia imperialna"
 STATIC_MODIFIER_DESC_som_tur_imperial_army_mod: "W pełni rozwinięta armia osmańska — łącząca piechotę janczarów, kawalerię sipahi i najwyrafinowańszy tabor artyleryjski na świecie — była cudem wojskowym XVI wieku. Jej połączenie dyscypliny, siły ognia i organizacji logistycznej czyniło ją zdolną do kampanii w skali, której żadna potęga europejska nie mogła dorównać."
 STATIC_MODIFIER_NAME_som_tur_timar_mod: "System timarów"
 STATIC_MODIFIER_DESC_som_tur_timar_mod: "Nadając podbitą ziemię jako niedziedziczne timary jeźdźcom sipahi w zamian za służbę wojskową, Osmanowie finansowali swą armię bez wyczerpywania skarbca. Sułtan zachowywał najwyższą własność całej ziemi timarowej, dając mu przewagę nad stanem wojskowym, której europejscy monarchowie mogli tylko zazdrościć."
 STATIC_MODIFIER_NAME_som_tur_sipahi_mod: "Kawaleria sipahi"
 STATIC_MODIFIER_DESC_som_tur_sipahi_mod: "Opancerzeni jeźdźcy sipahi, finansowani nadaniami timarowymi, byli główną siłą uderzeniową armii osmańskiej w XV i XVI wieku. Ich gromowe szarże miażdżyły armie od Bałkanów po granicę perską. W miarę dojrzewania imperium klasa sipahi stała się potężną arystokracją prowincjonalną z własnymi interesami politycznymi."
 STATIC_MODIFIER_NAME_som_tur_eyalet_mod: "System ejaletów"
 STATIC_MODIFIER_DESC_som_tur_eyalet_mod: "System ejaletów — z beylerbeyem mianowanym przez sułtana, zarządzającym każdą główną prowincją — rozprzestrzeniał zasięg administracyjny osmański na ogromną przestrzeń geograficzną. Każdy ejalet był w istocie miniaturowym imperium z własnym kontyngentem wojskowym, skarbcem i dworem, zasilając centrum zasobami i wojskami."
 STATIC_MODIFIER_NAME_som_tur_vizier_mod: "Wielki wezyr"
 STATIC_MODIFIER_DESC_som_tur_vizier_mod: "Rezydencja wielkiego wezyra — Wysoka Porta — stała się adresem, pod którym europejscy posłowie prowadzili dyplomację osmańską. Dywan, któremu przewodniczył, był organem wypracowywania polityki imperium. Zdolny wielki wezyr mógł skutecznie rządzić imperium przez dziesięciolecia; niezdolny mógł doprowadzić je na skraj upadku."
 STATIC_MODIFIER_NAME_som_tur_bureaucracy_mod: "Biurokracja imperialna"
 STATIC_MODIFIER_DESC_som_tur_bureaucracy_mod: "Osmańska kultura pisarska wytworzyła papierowy zapis o zdumiewającej ilości i szczegółowości. Rejestry ziemskie, przeglądy podatkowe, akta sądowe i edykty imperialne stworzyły infrastrukturę administracyjną, która uczyniła Imperium Osmańskie jednym z najlepiej udokumentowanych państw okresu przednowoczesnego."
 STATIC_MODIFIER_NAME_som_tur_mosque_mod: "Meczet Sulejmana"
 STATIC_MODIFIER_DESC_som_tur_mosque_mod: "Arcydzieło Sinana obwieściło światu, że Osmanowie byli dziedzicami Rzymu, Bizancjum i najwyższej cywilizacji islamskiej jednocześnie. Jego kopuła rywalizowała z Hagią Sophią na horyzoncie Stambułu — celowy dialog architektoniczny między starym imperium chrześcijańskim a nowym muzułmańskim."
 STATIC_MODIFIER_NAME_som_tur_topkapi_mod: "Pałac Topkapı"
 STATIC_MODIFIER_DESC_som_tur_topkapi_mod: "Topkapı był centrum nerwowym imperium obejmującego trzy kontynenty. Każdy sułtan był tu koronowany; każda kampania zaczynała się z jego bram; każdy wielki wezyr służył z jego łaski. Harem w jego murach kształtował politykę sukcesji przez wieki."
 STATIC_MODIFIER_NAME_som_tur_ulema_mod: "Władza ulemów"
 STATIC_MODIFIER_DESC_som_tur_ulema_mod: "Ulemowie nadawali państwu osmańskiemu jego religijną legitymizację. Ich aprobata wojen sułtana jako dżihadu, ich zarządzanie systemem sądów szariackich i ich obsada sieci edukacji medres czyniły ich niezastąpionymi partnerami rządów osmańskich."
 STATIC_MODIFIER_NAME_som_tur_millet_mod: "System milletów"
 STATIC_MODIFIER_DESC_som_tur_millet_mod: "Zorganizowany pluralizm religijny — chrześcijanie, Żydzi i muzułmanie żyjący pod jednym parasolem imperialnym, każdy zarządzający własnymi sprawami wspólnotowymi — był osmańskim rozwiązaniem problemu rządzenia zróżnicowanym imperium. Nie była to równość, lecz forma współistnienia, która utrzymywała imperium przez wieki."
 STATIC_MODIFIER_NAME_som_tur_kadi_mod: "Sądy kadich"
 STATIC_MODIFIER_DESC_som_tur_kadi_mod: "Sądy kadich rozprzestrzeniały rządy prawa osmańskiego do każdego zakątka imperium, od Stambułu po odległe anatolijskie wsie. Zapisy sijillat, które produkowały, są skarbnicą historyka: dziesiątki tysięcy tomów dokumentujących spory majątkowe, małżeństwa, umowy handlowe i sprawy karne na przestrzeni wieków."
 STATIC_MODIFIER_NAME_som_tur_sufi_mod: "Kultura sufi"
 STATIC_MODIFIER_DESC_som_tur_sufi_mod: "Zakony sufickie nadawały duchową głębię osmańskiemu życiu religijnemu, której nie mogło dać formalne legalistyczne rozumienie islamu. Wirujący Mevlevi, wojowniczy Bektaszi, politycznie związani Nakszbandi — każdy zakon zajmował swoistą niszę w społeczeństwie osmańskim, a razem utkali sieć wspólnoty duchowej w całym imperium."
 STATIC_MODIFIER_NAME_som_tur_synthesis_mod: "Synteza kulturowa"
 STATIC_MODIFIER_DESC_som_tur_synthesis_mod: "Osmański talent do wchłaniania, a nie niszczenia, uczynił imperium kulturową gąbką. Bizantyjska sprawność administracyjna, perska kultura literacka, arabska tradycja naukowa i turecka energia wojskowa — wszystko to zlało się razem w coś swoiście — i wspaniale — osmańskiego."
 STATIC_MODIFIER_NAME_som_tur_bursa_silk_trade: "Przemysł jedwabniczy Bursy"
 STATIC_MODIFIER_DESC_som_tur_bursa_silk_trade: "Bursa stała się stolicą jedwabiu imperium — rolą, którą zachowała przez wieki. Rzemieślnicy miasta produkowali luksusowe jedwabie zdobiące dwory Europy i Bliskiego Wschodu jednakowo, a jej dochody pomagały finansować kampanie, które zbudowały imperium."
 STATIC_MODIFIER_NAME_som_tur_trade_empire_mod: "Imperialne szlaki handlowe"
 STATIC_MODIFIER_DESC_som_tur_trade_empire_mod: "Karawanseraje, drogi i tłumienie piractwa ożywiły handel wewnątrz imperium. Promienista sieć handlowa ze środkiem w Konstantynopolu przyniosła integrację gospodarczą."
 STATIC_MODIFIER_NAME_som_tur_istanbul_glory_mod: "Miasto pożądane przez świat"
 STATIC_MODIFIER_DESC_som_tur_istanbul_glory_mod: "Stambuł — rozciągający się na dwóch kontynentach, panujący nad jedynym przejściem między Morzem Czarnym a Śródziemnym — był miastem, którego pragnął cały świat. Jego ludność, jego handel, jego architektura i jego znaczenie polityczne uczyniły go niekwestionowaną stolicą znanego świata."
 som_ottoman_events.50.t: "Miasto pożądane przez świat"
 som_ottoman_events.50.d: "Konstantynopol — Stambuł — stał się prawdziwie i w pełni miastem, którego pragnie cały świat. Jego półmilionowa ludność czyni go największym miastem Europy i Bliskiego Wschodu razem wziętych. Rozciąga się na dwóch kontynentach. Kontroluje jedyne przejście morskie między Morzem Czarnym a Śródziemnym. Wyrafinowana sylwetka meczetu Sulejmana i dominująca wysokość pałacu Topkapı odbijają się w wodach Bosforu. W jego sądach poeci rywalizują z filozofami, a architekci współzawodniczą z uczonymi. Cywilizacja osmańska osiągnęła swój szczyt. To miasto będzie jaśnieć tysiąc lat."
 som_ottoman_events.50.a: "Niech Stambuł jaśnieje tysiąc lat!"
 som_ottoman_events.50.breadbasket_tt: "Prawo miejskie „Spichlerz Imperium Osmańskiego” jest teraz dostępne. Można je nadać lokacjom rangi miasta lub wyższej, które mają spichlerz na poziomie 5 lub wyższym."
 STATIC_MODIFIER_NAME_som_tur_constantinople_dev_mod: "Rozwój Kostantiniyye"
 STATIC_MODIFIER_DESC_som_tur_constantinople_dev_mod: "Pod dowództwem Mehmeda II przesiedlenie i odbudowa trwają; głosy nowych mieszkańców wypełniają rynki, a odrestaurowana kamieniarka przywraca nowy blask dawnej stolicy imperialnej."
 STATIC_MODIFIER_NAME_som_tur_constantinople_splendor_mod: "Splendor Kostantiniyye"
 STATIC_MODIFIER_DESC_som_tur_constantinople_splendor_mod: "Wokół Złotego Rogu wyrastają nowe warsztaty, karawanseraje i dzielnice; osadnicy i rzemieślnicy ściągają do miasta, a ziemie za nim dają plony obfitsze niż kiedykolwiek. Stolica sułtana znów przyćmiewa każde miasto znanego świata."
 STATIC_MODIFIER_NAME_som_tur_trebizond_trade_mod: "Trapezunt — brama Jedwabnego Szlaku"
 STATIC_MODIFIER_DESC_som_tur_trebizond_trade_mod: "W porcie Trapezuntu na południowym brzegu Morza Czarnego ładunki karawan, które zeszły z Jedwabnego Szlaku ze Środkowej Azji i Kaspiku, piętrzą się wysoko, czekając na statki płynące na Morze Śródziemne."
 STATIC_MODIFIER_NAME_som_tur_commercial_empire_mod: "Imperium handlowe"
 STATIC_MODIFIER_DESC_som_tur_commercial_empire_mod: "Aleppo, Aleksandria, Konstantynopol — bogactwo trzech kontynentów płynie teraz przez rynki sułtana."
 STATIC_MODIFIER_NAME_som_tur_grand_bazaar_loc_mod: "Wielki Bazar"
 STATIC_MODIFIER_DESC_som_tur_grand_bazaar_loc_mod: "Wzdłuż krytych ulic Kapalıçarşı okrzyki złotników i handlarzy przypraw nie milkną, a towary z całego świata gromadzą się tutaj."
 som_ottoman_events.19.t: "Handlowy los Smyrny"
 som_ottoman_events.19.d: "Smyrna (Izmir) jest największym miastem portowym wschodniego wybrzeża egejskiego, bramą łączącą anatolijskie zaplecze ze światem śródziemnomorskim. Kolonizatorzy greccy założyli ją w starożytności; teraz należy do Osmanów. Sułtan musi zdecydować o przyszłym kierunku miasta: rozwinąć je w kwitnący węzeł handlowy, przyciągający kupców z całego znanego świata, czy zainwestować w budownictwo okrętowe, by projektować potęgę osmańską na całym Morzu Egejskim?"
 som_ottoman_events.19.a: "Rozwinąć dzielnicę kupiecką Smyrny i uczynić ją centrum handlowym"
 som_ottoman_events.19.b: "Zbudować stocznię w Smyrnie i wykorzystać ją jako bazę morską dla ekspansji egejskiej"
 STATIC_MODIFIER_NAME_som_tur_anatolian_heartland_mod: "Opanowanie Anatolii"
 STATIC_MODIFIER_DESC_som_tur_anatolian_heartland_mod: "Od Konyi po Trapezunt poborcy podatkowi i urzędnicy sułtana docierają do wsi Anatolii, a rządy imperialne rozciągają się na każdy zakątek płaskowyżu."
 STATIC_MODIFIER_NAME_som_tur_crimea_dominance: "Dominacja nad Krymem"
 STATIC_MODIFIER_DESC_som_tur_crimea_dominance: "Patrząc przez Morze Czarne z portu Kaffa, tylko statki pod flagą osmańską przecinają fale. Morze Czarne staje się „jeziorem osmańskim”."
 STATIC_MODIFIER_NAME_som_tur_aleppo_learning_mod: "Uczoność Aleppo"
 STATIC_MODIFIER_DESC_som_tur_aleppo_learning_mod: "Aleppo było jednym z wielkich centrów intelektualnych świata islamskiego. Słynne medresy, biblioteki i uczeni skupieni tu przynoszą napływ arabskiej tradycji naukowej do Imperium Osmańskiego."
 STATIC_MODIFIER_NAME_som_tur_damascus_learning_mod: "Uczoność Damaszku"
 STATIC_MODIFIER_DESC_som_tur_damascus_learning_mod: "Damaszek niesie skumulowane dziedzictwo intelektualne okresów Umajjadów, Abbasydów i Mameluków. Pod rządami osmańskimi to bogate dziedzictwo rośnie dalej."
 STATIC_MODIFIER_NAME_som_tur_caliph_successor: "Następca kalifatu"
 STATIC_MODIFIER_DESC_som_tur_caliph_successor: "Imię sułtana, teraz strażnika świętych miejsc, wypowiadane jest z kazalnic jako imię kalifa."
 STATIC_MODIFIER_NAME_som_tur_aegean_shipbuilding_mod: "Egejskie techniki budowy okrętów"
 STATIC_MODIFIER_DESC_som_tur_aegean_shipbuilding_mod: "Mistrzowie okrętowi z wysp egejskich przynoszą rzemiosła przekazywane przez pokolenia do stoczni Stambułu, a stępka po stępce się kładzie."
 som_ottoman_events.61.t: "Bitwa pod Mardż Dabik"
 som_ottoman_events.61.d: "W 1516 roku sułtan Selim I zniszczył armię mameluką sułtana Kansuha al-Ghauriego na równinach Mardż Dabik. Sam Kansuh poległ na polu; cała Syria przeszła w ręce osmańskie. Z zajętym Kairem los Sułtanatu Mameluków spoczywa w rękach osmańskich."
 som_ottoman_events.61.a: "Wchłonąć Sułtanat Mameluków jako ejalet poprzez pokój negocjowany"
 som_ottoman_events.61.b: "Zawrzeć pokój i pozwolić im zachować niezależność"
 STATIC_MODIFIER_NAME_som_tur_edirne_trade_mod: "Edirne — węzeł handlowy"
 STATIC_MODIFIER_DESC_som_tur_edirne_trade_mod: "Edirne (Adrianopol) jest centrum handlowym Rumelii. To miasto, łączące Bałkany i Anatolię, rozwinięte jako węzeł produkcji barwników, jedwabiu i cienkiej tkaniny, wspierając wczesną podstawę fiskalną Osmanów."
 STATIC_MODIFIER_NAME_som_tur_novo_brdo_silver_mod: "Kopalnie srebra Novo Brdo"
 STATIC_MODIFIER_DESC_som_tur_novo_brdo_silver_mod: "Novo Brdo („Nowe Wzgórze”) posiada największe kopalnie srebra Bałkanów. Nawet po podboju osmańskim w latach 50. XV wieku jego bogate kopalnie nadal wzbogacały skarbiec imperialny. Miesięczny dobrobyt i wzrost populacji są również wzmocnione."
 STATIC_MODIFIER_NAME_som_tur_hungarian_march_mod: "Marchia węgierska"
 STATIC_MODIFIER_DESC_som_tur_hungarian_march_mod: "Z upadłą Budą żołnierze osmańscy, posuwający się przez Dunaj ku Wiedniowi, czują, nawet wśród blasku zwycięstwa, początek długiej wojny z Habsburgami."
 STATIC_MODIFIER_NAME_som_tur_italy_north_mod: "Panowanie nad półwyspem włoskim"
 STATIC_MODIFIER_DESC_som_tur_italy_north_mod: "Sztandar półksiężyca powiewa nad placami Rzymu, Florencji i Mediolanu, a mieszkańcy miast renesansu zaczynają uczyć się języka swych nowych władców."
 STATIC_MODIFIER_NAME_som_tur_maghreb_mod: "Opanowanie Maghrebu"
 STATIC_MODIFIER_DESC_som_tur_maghreb_mod: "Statki berberyjskich korsarzy, zgromadzone w portach Tunisu i Algieru, patrzą teraz na zachodnie Morze Śródziemne skrzydłem floty sułtana."
 som_tur_silk_road_revival: "Odrodzenie Jedwabnego Szlaku"
 som_tur_silk_road_revival_desc: "Tebriz był najbardziej zachodnim węzłem Jedwabnego Szlaku — stolicą Ilchanatu, niegdyś łączącą Persję i Azję Środkową ze światem śródziemnomorskim. Zdobycie tego miasta daje Imperium Osmańskiemu bezpośrednią kontrolę nad strumieniem jedwabiu, przypraw i klejnotów z Azji. Rozległa sieć handlowa, łącząca Morze Czarne ze Środkową Azją, odradza się, znacznie wzmacniając imperialną potęgę handlową."
 STATIC_MODIFIER_NAME_som_tur_silk_road_revival_mod: "Odrodzenie Jedwabnego Szlaku"
 STATIC_MODIFIER_DESC_som_tur_silk_road_revival_mod: "Z rynków Tebrizu karawany załadowane chińskim jedwabiem znów podążają drogą do Stambułu, a Jedwabny Szlak odzyskał swe ożywienie."
 som_tur_city_of_worlds_desire_desc: "Stambuł jest prawdziwie miastem pożądanym przez świat. Z populacją przekraczającą pół miliona jest niekwestionowaną osią handlu światowego. W miarę jak to wielkie miasto osiąga pełną chwałę, starożytne bizantyjskie prawo Spichlerza Imperialnego staje się dostępne również dla Imperium Osmańskiego."
 som_tur_true_rome: "Prawdziwe Cesarstwo Rzymskie"
 som_tur_true_rome_desc: "Bałkany, Anatolia, świat arabski, Egipt, Afryka Północna, Włochy — praktycznie wszystkie ziemie niegdyś rządzone przez Rzym niosą teraz sztandar osmański. Mehmed II przyjął tytuł Kayser-i Rum (Cesarza) po upadku Konstantynopola. Teraz Imperium Osmańskie stoi prawdziwym dziedzicem Rzymu — dziedzicząc jego drogi, jego prawa, jego cywilizację. Wskrześ Kodeks Justyniana, rozszerz system akweduktów i połącz rozległe imperium pod jednym prawem i jedną kulturą."
 STATIC_MODIFIER_NAME_som_tur_true_rome_mod: "Prawdziwe Cesarstwo Rzymskie"
 STATIC_MODIFIER_DESC_som_tur_true_rome_mod: "Pod imperium, które zgłasza roszczenia do płaszcza Rzymu, drogi są naprawiane, akwedukty rozszerzane, a kodeks Justyniana wskrzeszany jako prawo nowej epoki."
 som_ottoman_mission_pack: "Wzrost Imperium Osmańskiego"
 som_ottoman_mission_pack_DESCRIPTION:0 "W 1337 roku państwo osmańskie jest małym anatolijskim beyliktem ze stolicą w Bursie, Izniku i Izmicie. W ciągu kilku pokoleń przekształci się w imperium rozciągające się od Bałkanów po Arabię, od Krymu po Afrykę Północną i Włochy. Nieś ducha ghazich na Bałkany, postaw Konstantynopol na kolanach, urzeczywistnij złoty wiek Sulejmana Wspaniałego — i zgłoś roszczenia do płaszcza prawdziwego Rzymu."
 som_ottoman_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Osmanowie, podbij Bałkany, Anatolię, świat arabski i Morze Śródziemne; zbuduj trwałe instytucje wewnętrzne; i osiągnij erę Sulejmana."
 som_ottoman_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by urzeczywistnić Wzrost Imperium Osmańskiego."
 som_ottoman_mission_pack_BUTTON_DETAILS:0 "Od małego beyliku w 1337 roku do największego imperium świata!"
