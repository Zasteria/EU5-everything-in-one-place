l_polish:
 hab_habsburg_mission_pack: "Hegemonia Habsburgów i Imperium Powszechne"
 hab_habsburg_mission_pack_DESCRIPTION:0 "Znad brzegów Dunaju ambicje domu Habsburgów sięgają całej Europy. Zdobądź tron cesarza Świętego Cesarstwa Rzymskiego, podbij Węgry na wschodzie, Francję i Hiszpanię na zachodzie, Włochy na południu. Następnie niech Wiedeń jaśnieje największym miastem świata i urzeczywistnij Imperium Powszechne."
 hab_habsburg_mission_pack_CRITERIA_DESCRIPTION:0 "Panuj w Świętym Cesarstwie, podbij Zachód, Wschód i Włochy i urzeczywistnij Imperium Powszechne."
 hab_habsburg_mission_pack_BUTTON_TOOLTIP:0 "Zjednocz Europę pod hegemonią habsburską."
 hab_habsburg_mission_pack_BUTTON_DETAILS:0 "„Niech inni prowadzą wojny; ty, szczęśliwa Austrio, żeń się!” — stań się panem Europy zarówno przez dyplomację, jak i podbój!"
 hab_habsburg_ascendancy: "Wzrost domu Habsburgów"
 hab_habsburg_ascendancy_desc: "Krew Rudolfa Habsburga pulsuje wzdłuż Dunaju — rozpoczęła się era dyplomacji i podboju."
 hab_secure_electors: "Zabezpiecz elektorów"
 hab_secure_electors_desc: "Tron cesarza Świętego Cesarstwa Rzymskiego rozstrzyga się głosowaniem elektorów. Przez sojusz lub przytłaczającą siłę zabezpiecz nieprzerwane dzierżenie korony cesarskiej przez dom Habsburgów."
 hab_imperial_authority: "Ustanów władzę cesarską"
 hab_imperial_authority_desc: "Władza Świętego Cesarstwa Rzymskiego zbiega się w woli domu Habsburgów — nadszedł czas, by całe Cesarstwo poddało się rozkazowi Wiednia."
 hab_counter_reformation: "Kontrreformacja"
 hab_counter_reformation_desc: "Herezja Marcina Lutra wstrząsa Niemcami — urzeczywistnij dekrety Soboru Trydenckiego i obroń wiarę katolicką."
 hab_charlemagne_legacy: "Dziedzictwo Karola Wielkiego"
 hab_charlemagne_legacy_desc: "Przywróć pod sztandar habsburski południowe Niemcy, które Karol Wielki zjednoczył tysiąc lat temu — podstawa reformy cesarskiej położona."
 hab_imperial_reform: "Reforma cesarska"
 hab_imperial_reform_desc: "Reforma cesarska — uwiecznij rządy habsburskie poprzez reorganizację instytucji rządzących Cesarstwa."
 hab_emperors_of_rome: "Dziedzic cesarzy rzymskich"
 hab_emperors_of_rome_desc: "Marzenie od czasów Karola Wielkiego — z panowaniem nad Wiecznym Miastem Rzymem i Świętym Cesarstwem dom Habsburgów ogłasza się „dziedzicem cesarzy rzymskich”."
 hab_reclaim_burgundy: "Odzyskaj Burgundię"
 hab_reclaim_burgundy_desc: "Lotaryngia i Burgundia — odzyskaj te zachodnie ziemie, które niegdyś należały do domu Habsburgów."
 hab_austrian_netherlands: "Niderlandy Austriackie"
 hab_austrian_netherlands_desc: "Bogate miasta handlowe Flandrii i Brabantu — bogactwo Niderlandów wspiera finanse Imperium Habsburskiego."
 hab_weaken_france: "Osłab Francję"
 hab_weaken_france_desc: "Stary rywal Francja jest największą przeszkodą dla hegemonii europejskiej. Osłab ją i przytnij jej siłę do interwencji w Niemczech i Włoszech."
 hab_defeat_france: "Klęska Francji"
 hab_defeat_france_desc: "„Galia upadła” — stary rywal Francja pokonana przez dom Habsburgów. Hegemonia nad Europą Zachodnią należy do Habsburgów."
 hab_iberian_marriage: "Dyplomacja małżeńska z Iberią"
 hab_iberian_marriage_desc: "„Niech inni prowadzą wojny; ty, szczęśliwa Austrio, żeń się” — małżeństwa z Hiszpanią i Portugalią otwierają drzwi do imperium, w którym słońce nigdy nie zachodzi."
 hab_crown_of_spain: "Korona Hiszpanii"
 hab_crown_of_spain_desc: "Cały Półwysep Iberyjski — z ogłoszeniem domu Habsburgów „Królem Hiszpanii” imperium, w którym słońce nigdy nie zachodzi, zaczyna nabierać kształtu."
 hab_italian_ambition: "Ambicje we Włoszech"
 hab_italian_ambition_desc: "Bogate miasta-państwa Północnych Włoch — przywiedź Mediolan, Wenecję i Neapol pod kontrolę habsburską."
 hab_duchy_of_milan: "Zdobądź Księstwo Mediolanu"
 hab_duchy_of_milan_desc: "Mediolan jest sercem Północnych Włoch. Zdobądź ten ekonomiczny i militarny bastion i ustanów bazę dla podboju Włoch."
 hab_papal_alliance: "Stosunki z papieżem"
 hab_papal_alliance_desc: "Papież — ustanów stosunki z tą duchową władzą świata katolickiego i podnieś legitymizację domu Habsburgów."
 hab_venetian_ports: "Porty Wenecji"
 hab_venetian_ports_desc: "Wenecja, „Królowa Adriatyku” — zdobądź jej porty i flotę i zabezpiecz wejście do handlu śródziemnomorskiego."
 hab_king_of_naples: "Król Neapolu"
 hab_king_of_naples_desc: "Królestwo Neapolu — klucz do Południowych Włoch. Ta korona jest pierwszym krokiem ku panowaniu habsburskiemu nad całymi Włochami."
 hab_king_of_italy: "Król Włoch"
 hab_king_of_italy_desc: "„Żelazna Korona” jaśnieje na czole cesarza habsburskiego — całe Włochy, od Lombardii po Sycylię, zjednoczone."
 hab_eastern_ambitions: "Ambicje na wschodzie"
 hab_eastern_ambitions_desc: "Czechy i Węgry — ustanów roszczenia do tych dwóch wielkich potęg Europy Wschodniej i rozpocznij habsburskie posuwanie się na wschód."
 hab_crown_of_bohemia: "Korona Czeska"
 hab_crown_of_bohemia_desc: "Korona Wacława w Pradze — ta korona staje się podstawą habsburskiej ekspansji na wschód."
 hab_royal_hungary: "Królewskie Węgry"
 hab_royal_hungary_desc: "Buda uwolniona od Osmanów — korona Węgier powraca na czoło cesarza habsburskiego, a rodzą się „Królewskie Węgry”."
 hab_bohemian_union: "Włączenie unii czeskiej"
 hab_bohemian_union_desc: "Unia personalna z Czechami pogłębiła się — teraz wybierz, czy rządzić nią bezpośrednio jako włączoną ziemią koronną, czy zachować status quo."
 hab_secure_croatia: "Zabezpiecz Chorwację"
 hab_secure_croatia_desc: "Ustanów granicę wojskową w Chorwacji, by zatrzymać inwazje osmańskie, i wykorzystaj ją jako przyczółek do podboju Bałkanów."
 hab_ottoman_menace: "Zagrożenie osmańskie"
 hab_ottoman_menace_desc: "Imperium Osmańskie jest największym wrogiem Europy Wschodniej, który powalił Konstantynopol. Niech dom Habsburgów stanie się bastionem, broniącym chrześcijaństwa."
 hab_liberate_balkans: "Wyzwól Bałkany"
 hab_liberate_balkans_desc: "Wyzwól chrześcijan Półwyspu Bałkańskiego spod panowania osmańskiego — głos wiernych prawosławnych wzywa imienia Habsburgów."
 hab_emperors_of_east: "Cesarz Wschodu"
 hab_emperors_of_east_desc: "Konstantynopol — stolica zarówno Wschodniego, jak i Zachodniego Cesarstwa Rzymskiego — upada teraz w ręce habsburskie. Zarówno wschodnia, jak i zachodnia korona cesarska zjednoczone."
 hab_austrian_heartland: "Ustanów austriackie serce"
 hab_austrian_heartland_desc: "Austriackie serce wzdłuż Dunaju — zabezpiecz serce ekspansji imperialnej i ustanów podstawę jego gospodarki i wojska."
 hab_tyrol_styria: "Tyrol i Styria"
 hab_tyrol_styria_desc: "Srebro ze Schwaz i żelazo z Leoben — kopalnie Tyrolu i Styrii wspierają finanse i armie Imperium Habsburskiego."
 hab_dev_vienna: "Rozwój Wiednia"
 hab_dev_vienna_desc: "„Miasto muzyki”, „Biały Wiedeń Habsburgów” — napełnij Wiedeń wspaniałością godną stolicy imperialnej."
 hab_graz_fortress: "Umocnij Graz"
 hab_graz_fortress_desc: "Graz — rozwiń stolicę Styrii w niezdobyte miasto-twierdzę, gotową na inwazję osmańską."
 hab_baroque_vienna: "Barokowy Wiedeń"
 hab_baroque_vienna_desc: "Barokowa muzyka, architektura i malarstwo rozkwitają na dworze wiedeńskim — uniwersytety i akademie sztuk zwiastują złoty wiek kultury habsburskiej."
 hab_great_vienna: "Wielkie miasto Wiedeń"
 hab_great_vienna_desc: "Pałac Schönbrunn, katedra Świętego Szczepana — Wiedeń ukończony największym i najpiękniejszym miastem Europy."
 hab_swiss_lands: "Odzyskaj ziemie szwajcarskie"
 hab_swiss_lands_desc: "Zmyj upokorzenie, symbolizowane przez Wilhelma Tella — odzyskaj ziemię alpejskich chłopów dla domu Habsburgów."
 hab_south_german_cities: "Miasta handlowe Południowych Niemiec"
 hab_south_german_cities_desc: "Augsburg i Frankfurt — zdobądź te bogate miasta, ojczyznę rodzin Fuggerów i Rothschildów."
 hab_unify_germany: "Zjednoczenie Niemiec"
 hab_unify_germany_desc: "Rozdrobnione księstwa niemieckie — teraz wreszcie zjednoczone pod sztandarem habsburskim."
 hab_north_sea_trade: "Handel północnomorski"
 hab_north_sea_trade_desc: "Hamburg i Amsterdam — zdobądź kontrolę nad handlem północnomorskim i zbuduj nowe imperium handlowe, by zastąpić Ligę Hanzeatycką."
 hab_hegemon_of_west: "Hegemon Zachodu"
 hab_hegemon_of_west_desc: "Francja, Hiszpania — każda wielka potęga Zachodu, która niegdyś rzucała wyzwanie domowi Habsburgów, teraz podporządkowana."
 hab_tuscany: "Podbój Toskanii"
 hab_tuscany_desc: "Kultura renesansowa Florencji — weź tę ziemię sztuk, która rozkwitła pod mecenatem Medyceuszy, pod skrzydła Imperium Habsburskiego."
 hab_surpass_poland: "Przewyższ Polskę"
 hab_surpass_poland_desc: "Królestwo Polskie — ustanów habsburską przewagę militarną w konfrontacji z tą wielką potęgą Europy Wschodniej."
 hab_wallachia_moldavia: "Wołoszczyzna i Mołdawia"
 hab_wallachia_moldavia_desc: "Podporządkuj księstwa rumuńskie na północ od Dunaju i dopełnij habsburskie panowanie nad Bałkanami."
 hab_austrian_army: "Zreorganizuj armię austriacką"
 hab_austrian_army_desc: "Wojsko habsburskie — pielęgnuj najsilniejszą armię Europy, wykutą z sojuszu wielonarodowych pułków."
 hab_spanish_tercios: "Hiszpańskie tercio"
 hab_spanish_tercios_desc: "Tercio — wprowadź tę rewolucyjną hiszpańską taktykę wojskową w całej armii habsburskiej i udoskonal najlepszą piechotę Europy."
 hab_multicultural: "Imperium wielonarodowe"
 hab_multicultural_desc: "Niemcy, Czesi, Węgrzy, Chorwaci, Włosi — eksperyment Imperium Habsburskiego zjednoczenia wielu narodów pod jednym sztandarem ukończony."
 hab_alsace_lorraine: "Alzacja-Lotaryngia"
 hab_alsace_lorraine_desc: "Alzacja i Lotaryngia wzdłuż Renu — zabezpiecz tę ziemię zachodnią granicą Imperium Habsburskiego."
 hab_renaissance_court: "Dwór renesansowy"
 hab_renaissance_court_desc: "Światło renesansu jaśnieje na dworze wiedeńskim — włoska sztuka i bizantyjska uczoność łączą się, doprowadzając kulturę habsburską do pełnego rozkwitu."
 hab_carinthia: "Karyntia"
 hab_carinthia_desc: "Karyntia — włącz to alpejskie księstwo do posiadłości habsburskiej i zabezpiecz korytarz do Włoch i na Bałkany."
 hab_colonialism: "Imperium kolonialne"
 hab_colonialism_desc: "Przez Hiszpanię — do Ameryk — zbuduj imperium kolonialne, pod którego sztandarem habsburskim słońce nigdy nie zachodzi."
 hab_universal_empire: "Imperium Powszechne"
 hab_universal_empire_desc: "„Imperium Powszechne — od Lizbony na zachodzie po Konstantynopol na wschodzie, od Hamburga na północy po Palermo na południu” — marzenie od czasów Karola Wielkiego spełnione."
 hab_events.1.t: "Dom Habsburgów, ku tronowi świętego rzymskiego"
 hab_events.1.d: "Elektorzy ogłosili swe poparcie dla domu Habsburgów — tron cesarski należy do Habsburgów."
 hab_events.1.a: "Niech żyje Cesarz Habsburg! Niech żyje Cesarstwo!"
 hab_events.10.t: "Ogłoszenie dziedzicem cesarzy rzymskich"
 hab_events.10.d: "Reforma cesarska ukończona, a Wieczne Miasto Rzym zjednoczone ze Świętym Cesarstwem — dom Habsburgów ogłasza się „dziedzicem cesarzy rzymskich”."
 hab_events.10.a: "Niech żyje reforma cesarska! Niech żyje dziedzic Rzymu!"
 hab_events.15.t: "Proklamacja zjednoczenia Niemiec"
 hab_events.15.d: "Od północy po południe — Niemcy, niegdyś rozdrobnione na niezliczone księstwa, zjednoczone pod sztandarem habsburskim."
 hab_events.15.a: "Niech żyje zjednoczenie Niemiec!"
 hab_events.20.t: "Upadek Francji — droga do tronu"
 hab_events.20.d: "Francja wreszcie ukorzyła się przed domem Habsburgów. Nadszedł czas, by ustanowić formalne roszczenie do tronu francuskiego — ogłoś sześćdziesięcioletnie roszczenie i zwróć wzrok na sukcesję Królestwa Francji."
 hab_events.20.a: "Ogłosić roszczenie do tronu francuskiego (60 lat)"
 hab_events.25.t: "Korona Hiszpanii"
 hab_events.25.d: "„Król Hiszpanii i arcyksiążę Austrii” — Półwysep Iberyjski leży teraz w posiadaniu Imperium Habsburskiego."
 hab_events.25.a: "Niech żyje Hiszpania! Niech żyje Imperium Habsburskie!"
 hab_events.30.t: "Król Włoch"
 hab_events.30.d: "„Żelazna Korona” jaśnieje na czole cesarza habsburskiego — całe Włochy, od Lombardii po Sycylię, zjednoczone."
 hab_events.40.t: "Założenie Królewskich Węgier"
 hab_events.40.d: "Buda uwolniona — „Królewskie Węgry” stają się wschodnim filarem Imperium Habsburskiego."
 hab_events.40.a: "Węgry uwolnione! Niech żyje Buda!"
 hab_events.50.t: "Cesarz Wschodu"
 hab_events.50.d: "Konstantynopol upadł w ręce habsburskie — stolice zarówno Wschodniego, jak i Zachodniego Cesarstwa Rzymskiego są teraz dzierżone jako jedno."
 hab_events.50.a: "Niech żyje Konstantynopol! Niech żyje Cesarz Wschodu!"
 hab_events.55.t: "Wielkie miasto Wiedeń"
 hab_events.55.d: "Pałac Schönbrunn, katedra Świętego Szczepana — Wiedeń ukończony największym i najpiękniejszym miastem Europy."
 hab_events.55.a: "Niech żyje Wielkie Miasto Wiedeń!"
 hab_events.65.t: "Czechy — włączenie ziemią koronną"
 hab_events.65.d: "Unia personalna z Czechami pogłębiła się, a nadszedł czas pełnego włączenia. Rządź nią bezpośrednio jako włączoną ziemią koronną lub zachowaj obecną unię personalną — zdecyduj."
 hab_events.65.a: "Włączyć Czechy jako włączoną ziemię koronną"
 hab_events.99.t: "Proklamacja Imperium Powszechnego"
 hab_events.99.d: "„Imperium Powszechne — cesarz habsburski rządzi od Lizbony na zachodzie po Konstantynopol na wschodzie” — ta proklamacja rozbrzmiewa po całej Europie."
 hab_events.99.a: "Niech żyje Imperium Powszechne! Imperium Habsburskie na wieki!"
 hab_events.65.b: "Zachować obecną unię personalną"
 STATIC_MODIFIER_NAME_hab_army_mod: "Elitarna armia habsburska"
 STATIC_MODIFIER_DESC_hab_army_mod: "Armia habsburska, łącząca różnorodne pułki narodowe, ukończona najsilniejszą siłą lądową Europy."
 STATIC_MODIFIER_NAME_hab_balkans_mod: "Wyzwolenie Bałkanów"
 STATIC_MODIFIER_DESC_hab_balkans_mod: "Chrześcijanie Bałkanów wyzwoleni spod panowania osmańskiego."
 STATIC_MODIFIER_NAME_hab_baroque_mod: "Barokowy Wiedeń"
 STATIC_MODIFIER_DESC_hab_baroque_mod: "Barokowa sztuka rozkwita na dworze wiedeńskim, czyniąc go centrum kultury europejskiej."
 STATIC_MODIFIER_NAME_hab_boh_loyalty_mod: "Opór przeciw włączeniu czeskiemu"
 STATIC_MODIFIER_DESC_hab_boh_loyalty_mod: "W halach Pragi czescy szlachcice szemrają przeciw utracie swych dawnych wolności."
 STATIC_MODIFIER_NAME_hab_bohemia_mod: "Korona Czeska"
 STATIC_MODIFIER_DESC_hab_bohemia_mod: "Złote miasto Praga przyłącza się do Imperium drugą stolicą domu Habsburgów."
 STATIC_MODIFIER_NAME_hab_carinthia_mod: "Podbój Karyntii"
 STATIC_MODIFIER_DESC_hab_carinthia_mod: "Karyntia stała się żywotnym korytarzem alpejskim, łączącym północ i południe dla Imperium Habsburskiego."
 STATIC_MODIFIER_NAME_hab_catholic_mod: "Triumf Kontrreformacji"
 STATIC_MODIFIER_DESC_hab_catholic_mod: "Wiara katolicka obroniona w całym Imperium."
 STATIC_MODIFIER_NAME_hab_charlemagne_mod: "Dziedzictwo Karola Wielkiego"
 STATIC_MODIFIER_DESC_hab_charlemagne_mod: "Dziedzictwo Karola Wielkiego daje Imperium Habsburskiemu nową legitymizację."
 STATIC_MODIFIER_NAME_hab_croatia_mod: "Chorwacka Granica Wojskowa"
 STATIC_MODIFIER_DESC_hab_croatia_mod: "Granica wojskowa ustanowiona w Chorwacji, zatrzymując inwazję osmańską."
 STATIC_MODIFIER_NAME_hab_danubian_mod: "Rozszerzenie Imperium Dunajskiego"
 STATIC_MODIFIER_DESC_hab_danubian_mod: "Dolny Dunaj podporządkowany, dopełniając habsburskie panowanie nad wszystkimi Bałkanami."
 STATIC_MODIFIER_NAME_hab_dynasty_mod: "Przebudzenie domu Habsburgów"
 STATIC_MODIFIER_DESC_hab_dynasty_mod: "Ambicja domu Habsburgów rozpalona — era dyplomacji i podboju się rozpoczyna."
 STATIC_MODIFIER_NAME_hab_france_mod: "Wojna z Francją"
 STATIC_MODIFIER_DESC_hab_france_mod: "Stary rywal Francja osłabiona, otwierając drogę do habsburskiej hegemonii nad Europą."
 STATIC_MODIFIER_NAME_hab_graz_mod: "Umocnienie Grazu"
 STATIC_MODIFIER_DESC_hab_graz_mod: "Graz rozwinięty w niezdobyte miasto-twierdzę, broniące przeciw inwazji osmańskiej."
 STATIC_MODIFIER_NAME_hab_great_vienna_loc_mod: "Wielkie miasto Wiedeń ukończone"
 STATIC_MODIFIER_DESC_hab_great_vienna_loc_mod: "Wiedeń ukończony największym miastem Europy, jaśniejąc wieczną stolicą Imperium."
 STATIC_MODIFIER_NAME_hab_heartland_mod: "Stabilność austriackiego serca"
 STATIC_MODIFIER_DESC_hab_heartland_mod: "Austriackie serce stabilne, ustanawiając podstawę ekspansji imperialnej."
 STATIC_MODIFIER_NAME_hab_hegemon_mod: "Hegemon Zachodu"
 STATIC_MODIFIER_DESC_hab_hegemon_mod: "Żadna potęga Europy Zachodniej nie pozostaje, by rzucić wyzwanie hegemonii habsburskiej."
 STATIC_MODIFIER_NAME_hab_imperial_mod: "Ustanowienie władzy cesarskiej"
 STATIC_MODIFIER_DESC_hab_imperial_mod: "Całe Święte Cesarstwo Rzymskie podporządkowuje się teraz rozkazowi domu Habsburgów."
 STATIC_MODIFIER_NAME_hab_italian_mod: "Owoce wojen włoskich"
 STATIC_MODIFIER_DESC_hab_italian_mod: "Kampanie włoskie wykuły armię habsburską w siłę elitarną."
 STATIC_MODIFIER_NAME_hab_multiethnic_mod: "Ustanowienie imperium wielonarodowego"
 STATIC_MODIFIER_DESC_hab_multiethnic_mod: "Cud współistnienia wielu narodów pod sztandarem habsburskim urzeczywistniony."
 STATIC_MODIFIER_NAME_hab_north_sea_mod: "Hegemonia w handlu północnomorskim"
 STATIC_MODIFIER_DESC_hab_north_sea_mod: "Handel północnomorski wpadł pod kontrolę Imperium Habsburskiego."
 STATIC_MODIFIER_NAME_hab_ottoman_mod: "Wojna z Imperium Osmańskim"
 STATIC_MODIFIER_DESC_hab_ottoman_mod: "Zwycięstwo nad Imperium Osmańskim ustanowiło uznanie Imperium Habsburskiego przedmurzem chrześcijaństwa."
 STATIC_MODIFIER_NAME_hab_papal_mod: "Pojednanie z papieżem"
 STATIC_MODIFIER_DESC_hab_papal_mod: "Stosunki z papieżem ustanowione, a dom Habsburgów uznany strażnikiem świata katolickiego."
 STATIC_MODIFIER_NAME_hab_reform_mod: "Ukończenie reformy cesarskiej"
 STATIC_MODIFIER_DESC_hab_reform_mod: "Reorganizacja instytucji rządzących uwiecznia rządy habsburskie."
 STATIC_MODIFIER_NAME_hab_renaissance_mod: "Renesans Wiednia"
 STATIC_MODIFIER_DESC_hab_renaissance_mod: "Światło renesansu jaśnieje na dworze wiedeńskim, czyniąc Imperium centrum kultury europejskiej."
 STATIC_MODIFIER_NAME_hab_south_german_mod: "Miasta handlowe Południowych Niemiec"
 STATIC_MODIFIER_DESC_hab_south_german_mod: "Bogate wolne miasta Południowych Niemiec stały się rdzeniem gospodarki imperialnej."
 STATIC_MODIFIER_NAME_hab_styria_iron_mod: "Kopalnie żelaza Leoben"
 STATIC_MODIFIER_DESC_hab_styria_iron_mod: "Żelazo Styrii wspiera potęgę wojskową Imperium Habsburskiego."
 STATIC_MODIFIER_NAME_hab_swiss_mod: "Podbój Szwajcarii"
 STATIC_MODIFIER_DESC_hab_swiss_mod: "Alpejskie państwo chłopskie podbite, ustanawiając hegemonię habsburską."
 STATIC_MODIFIER_NAME_hab_tercios_mod: "Hiszpańskie tercio"
 STATIC_MODIFIER_DESC_hab_tercios_mod: "Taktyka tercio wprowadzona w całej armii habsburskiej, rodząc najlepszą piechotę Europy."
 STATIC_MODIFIER_NAME_hab_tuscany_mod: "Dobrobyt Toskanii"
 STATIC_MODIFIER_DESC_hab_tuscany_mod: "Kultura renesansowa Florencji rozkwita pod ochroną Imperium Habsburskiego."
 STATIC_MODIFIER_NAME_hab_tyrol_silver_mod: "Kopalnie srebra Schwaz"
 STATIC_MODIFIER_DESC_hab_tyrol_silver_mod: "Kopalnie srebra Tyrolu wspierają finanse Imperium Habsburskiego."
 STATIC_MODIFIER_NAME_hab_universal_empire_mod: "Proklamacja Imperium Powszechnego"
 STATIC_MODIFIER_DESC_hab_universal_empire_mod: "„Imperium Powszechne” — cała Europa zjednoczona pod sztandarem habsburskim."
 STATIC_MODIFIER_NAME_hab_venetia_mod: "Zdobycie Wenecji"
 STATIC_MODIFIER_DESC_hab_venetia_mod: "„Królowa Adriatyku” teraz wspiera potęgę morską Imperium Habsburskiego."
 STATIC_MODIFIER_NAME_hab_vienna_mod: "Wiedeń — serce Imperium"
 STATIC_MODIFIER_DESC_hab_vienna_mod: "Wiedeń jaśnieje centrum kulturalnym i administracyjnym Imperium."
 hab_events.40.b: "Zachować obecne stosunki"
 STATIC_MODIFIER_NAME_hab_hun_loyalty_mod: "Opór przeciw włączeniu węgierskiemu"
 STATIC_MODIFIER_DESC_hab_hun_loyalty_mod: "W pałacach Budy węgierscy magnaci szemrają przeciw utracie swych starożytnych wolności."
 hab_integrated_crown_desc: "Włączona ziemia koronna to szczególny typ wasala, który dzieli swego władcę z cesarzem habsburskim, ma ograniczoną dyplomację i pozwala suzerenowi budować i rozwijać zasoby bezpośrednio. Nie może być zaanektowana przez 100 lat."
 STATIC_MODIFIER_NAME_hab_spain_crown_mod: "Zdobycie korony hiszpańskiej"
 STATIC_MODIFIER_DESC_hab_spain_crown_mod: "Półwysep Iberyjski stał się częścią posiadłości Imperium Habsburskiego, otwierając drzwi do imperium, w którym słońce nigdy nie zachodzi."
 STATIC_MODIFIER_NAME_hab_alsace_mod: "Zdobycie Alzacji-Lotaryngii"
 STATIC_MODIFIER_DESC_hab_alsace_mod: "Dwugłowy orzeł Habsburgów powiewa z pogranicznych twierdz wzdłuż Renu, a obrona zachodnia stoi niewzruszona."
 hab_events.30.b: "Kontynuować rządzenie Włochami tak jak jest"
 hab_events.15.b: "Niech żyje Cesarstwo Niemieckie!"
 hab_events.30.a: "Zreorganizować Królestwo Włoch włączoną ziemią koronną"
 STATIC_MODIFIER_NAME_hab_hre_unity_mod: "Zjednoczenie Świętego Cesarstwa Rzymskiego"
 STATIC_MODIFIER_DESC_hab_hre_unity_mod: "Święte Cesarstwo Rzymskie zjednoczone, a drogi i armie Cesarstwa połączone w jedno."
 STATIC_MODIFIER_NAME_hab_ger_empire_mod: "Narodziny Cesarstwa Niemieckiego"
 STATIC_MODIFIER_DESC_hab_ger_empire_mod: "Cesarstwo Niemieckie proklamowane, a zdyscyplinowana, potężna armia zwiastuje jego narodziny."
 STATIC_MODIFIER_NAME_hab_rome_legacy_mod: "Dziedzictwo cesarzy rzymskich"
 STATIC_MODIFIER_DESC_hab_rome_legacy_mod: "Sławiony dziedzicem cesarzy rzymskich, dom Habsburgów widzi swój dwór przepełniony duchownymi i uczonymi z całego świata chrześcijańskiego."
 hab_stadtrechtsbriefe: "Wydaj Stadtrechtsbriefe"
 hab_stadtrechtsbriefe_desc: "Stadtrechtsbriefe — „listy prawa miejskiego”. Pod silną władzą królewską cesarza habsburskiego nadaj przywileje miastom w całym królestwie — prawo miejskie wiedeńskie dla Wiednia i prawa landstadt dla miast cesarskich gdzie indziej."
 hab_stadtrechtsbriefe_unlock_tt: "Odblokowuje przywileje miejskie Prawo miejskie Wiednia i Landstadt."
 hab_innsbruck_court: "Dwór Innsbrucka"
 hab_innsbruck_court_desc: "Innsbruck — teraz, gdy to centralne miasto Tyrolu wyrosło w prawdziwe miasto, ustanów tu dwór węzłem kultury alpejskiej Habsburgów."
 hab_swarovski_crystal: "Kryształ Swarovskiego"
 hab_swarovski_crystal_desc: "Od 1737 roku szklarze Innsbrucka udoskonalali sztukę cienkiego szlifu kryształu — na długo przed narodzinami samego Swarovskiego tyrolski kryształ już zdobił dwory Europy."
 STATIC_MODIFIER_NAME_hab_innsbruck_loc_mod: "Rozwój dworu Innsbrucka"
 STATIC_MODIFIER_DESC_hab_innsbruck_loc_mod: "Innsbruck zaczął jaśnieć węzłem kultury alpejskiej Habsburgów."
 STATIC_MODIFIER_NAME_hab_swarovski_mod: "Przemysł kryształowy Tyrolu"
 STATIC_MODIFIER_DESC_hab_swarovski_mod: "Szklarze Innsbrucka udoskonalili sztukę cienkiego szlifu kryształu."
 STATIC_MODIFIER_NAME_wiener_stadtrecht_town_rights: "Prawo miejskie Wiednia"
 STATIC_MODIFIER_DESC_wiener_stadtrecht_town_rights: "Szczególne prawo miejskie, nadawane wyłącznie Wiedniowi — korzyści w handlu i na rynkach wspierają dobrobyt Wiednia."
 STATIC_MODIFIER_NAME_landstadt_town_rights: "Landstadt"
 STATIC_MODIFIER_DESC_landstadt_town_rights: "Prawo miejskie nadawane miastom cesarskim — poprawia sieć drogową, równoważąc władzę korony z wpływem szlacheckim."
