l_polish:
 sic_restoration_mission_pack: "Droga Królestwa Sycylii"
 sic_restoration_mission_pack_DESCRIPTION:0 "Odłączone od Neapolu przez powstanie 1282 roku, Królestwo Sycylii stoi gotowe, by zebrać siłę tej wyspy w sercu Morza Śródziemnego i ponownie zapisać swoje imię w historii. Czy przekroczysz cieśninę i staniesz się znów jednym z Neapolem, czy wykujesz z samej wyspy krainę złota? Wybór należy do ciebie, o królu."
 sic_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Ukończ misje jako Królestwo Sycylii, pracując nad odbudową obu Sycylii lub złotym wiekiem wyspy Sycylii."
 sic_restoration_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by przejść drogą Królestwa Sycylii."
 sic_restoration_mission_pack_BUTTON_DETAILS:0 "Podbij Neapol za cieśniną i wykuj Królestwo Obu Sycylii, albo dopracuj samą wyspę Sycylię do stanu klejnotu Morza Śródziemnego. Na obu ścieżkach czeka dobrobyt nowego królestwa!"
 sic_divided_kingdom: "Poza Cieśniną"
 sic_divided_kingdom_desc: "W 1282 roku, w powstaniu znanym jako Nieszpory Sycylijskie, obaliliśmy panowanie domu Andegawenów. Niezdolny dłużej znosić tyranię francuskich urzędników, lud wyspy powstał jak jeden mąż na dźwięk wieczornych dzwonów i wypędził Francuzów z naszych brzegów. Powitaliśmy Piotra III Aragońskiego jako nowego króla, a Królestwo Sycylii zostało tym samym podzielone na dwoje. Za cieśniną, na kontynencie ze stolicą w Neapolu, król domu Andegawenów wciąż nazywa siebie „królem Sycylii”. Tylko my jesteśmy prawowitymi królami tej wyspy. Rywalizacja między naszymi dwoma królestwami trwa do dziś."
 sic_ambitions_on_naples: "Ambicje wobec Neapolu"
 sic_ambitions_on_naples_desc: "Andegaweński król za cieśniną z prawa stoi jako rywalizujący pretendent do samego tytułu króla Sycylii. Nadszedł czas, by zbudować naszą stałą armię i podnieść słuszną sprawę — pewnego dnia zażądać korony Neapolu dla siebie."
 sic_army_of_the_island: "Flota Wyspy"
 sic_army_of_the_island_desc: "Wyspa Sycylia jest twierdzą, otoczoną ze wszystkich stron morzem. By wysłać nasze wojska przez cieśninę do Neapolu, musimy najpierw zbudować potężną flotę, zapewniającą zarówno obronę wyspy, jak i bezpieczną przeprawę naszych żołnierzy."
 sic_conquest_of_naples: "Podbój Neapolu"
 sic_conquest_of_naples_desc: "Nasze siły w końcu przekroczyły cieśninę i wylądowały na brzegach Neapolu. Jeśli zdołamy złamać armię andegaweńską i zająć koronę Neapolu, królestwo podzielone w 1282 roku znów stanie się jednym, pod naszymi rządami."
 sic_two_sicilies: "Obie Sycylie"
 sic_two_sicilies_desc: "Neapol i Palermo, dwie korony, spoczywają teraz w naszych rękach. Nadszedł czas, by ogłosić założenie nowego królestwa, obejmującego oba brzegi cieśniny — Królestwa Obu Sycylii. Ten historyczny czyn kończy podział z 1282 roku."
 sic_golden_wheat_fields: "Złote pola pszenicy"
 sic_golden_wheat_fields_desc: "Od czasów starożytnych wyspa Sycylia zwana jest spichlerzem Morza Śródziemnego. Rozwijając żyzne równiny wokół Palermo, bogate plony wykarmią całe królestwo, a nadwyżka zboża zostanie wywieziona za granicę jako cenny towar handlowy."
 sic_palermo_resurgent: "Palermo odrodzone"
 sic_palermo_resurgent_desc: "W czasach królestwa normańskiego Palermo było miastem niezrównanego blasku w Morzu Śródziemnym. Wzniesienie tu nowych budowli i odzyskanie choćby cząstki tego dawnego przepychu będzie pierwszym krokiem ku rozwojowi całej wyspy."
 sic_mediterranean_crossroads: "Skrzyżowanie handlu śródziemnomorskiego"
 sic_mediterranean_crossroads_desc: "Wyspa Sycylia leży w samym sercu skrzyżowania Morza Śródziemnego, gdzie spotykają się szlaki handlowe Wschodu i Zachodu. Ustanawiając rynki w portach wyspy, zbierzemy tu kupców ze wszystkich krain, znacznie zwiększając dochód handlowy królestwa."
 sic_sicilian_renaissance: "Sycylijski renesans"
 sic_sicilian_renaissance_desc: "Dwór sycylijski, gdzie spotykają się kultura normańska, arabska, bizantyjska i łacińska, od dawna jest ośrodkiem sztuki i nauki. Liczne dzieła sztuki zgromadzone w Palermo zwiastują świt nowego rozkwitu kulturowego."
 sic_kingdom_resurgent: "Odrodzone królestwo"
 sic_kingdom_resurgent_desc: "Czy to jako królestwo obejmujące oba brzegi cieśniny, czy jako wyspa jaśniejąca kulturą i handlem w sercu Morza Śródziemnego, Sycylia ponownie zapisała swoje imię w historii. Odtąd droga tego królestwa naznaczy świt nowej ery."
 STATIC_MODIFIER_NAME_sic_army_of_the_island_mod: "Flota Wyspy"
 STATIC_MODIFIER_DESC_sic_army_of_the_island_mod: "Zreorganizowana flota wyspy szczyci się wysokim morale i obfitymi rezerwami siły żywej."
 STATIC_MODIFIER_NAME_sic_conquest_of_naples_mod: "Podbój Neapolu"
 STATIC_MODIFIER_DESC_sic_conquest_of_naples_mod: "Przeszedłszy przez kampanię w Neapolu, dyscyplina armii królewskiej wzrosła, a nasza ręka w negocjacjach wojennych stała się silniejsza."
 STATIC_MODIFIER_NAME_sic_two_sicilies_mod: "Obie Sycylie"
 STATIC_MODIFIER_DESC_sic_two_sicilies_mod: "Prestiż i legitymizacja nowego królestwa, obejmującego oba brzegi cieśniny, nigdy nie były wyższe."
 STATIC_MODIFIER_NAME_sic_golden_wheat_fields_mod: "Złote pola pszenicy"
 STATIC_MODIFIER_DESC_sic_golden_wheat_fields_mod: "Starożytny Rzym nazywał Sycylię „spichlerzem Imperium” (Granarium Imperii). Rozległe pola pszenicy we wnętrzu wyspy nieustannie karmiły świat śródziemnomorski. Rolnicza rola Sycylii jako „wyspy pszenicy” pozostawała niezmienna od starożytności aż do XIX wieku i była filarem bezpieczeństwa żywnościowego Morza Śródziemnego."
 STATIC_MODIFIER_NAME_sic_palermo_resurgent_mod: "Palermo odrodzone"
 STATIC_MODIFIER_DESC_sic_palermo_resurgent_mod: "Palermo (po fenicku Panormos — „wszystkie porty”) jest największym miastem Sycylii, gdzie zmieszały się kultura normańska, arabska i bizantyjska. Dwór Rogera II znany był jako jeden z najbardziej wyrafinowanych dworów Europy i ośrodek wielokulturowy, gdzie obok siebie używano arabskiego, greckiego i łaciny."
 STATIC_MODIFIER_NAME_sic_mediterranean_crossroads_mod: "Skrzyżowanie handlu śródziemnomorskiego"
 STATIC_MODIFIER_DESC_sic_mediterranean_crossroads_mod: "Sycylia leży niemal w środku Morza Śródziemnego i była węzłem przeładunkowym handlu Wschód-Zachód od czasów, gdy starożytni Fenicjanie założyli Kartaginę. Syrakuzy, miejsce narodzin greckiego filozofa Archimedesa, i Palermo, pachnące kulturą arabską — ta wyspa jest prawdziwym uosobieniem cywilizacji śródziemnomorskiej."
 STATIC_MODIFIER_NAME_sic_sicilian_renaissance_mod: "Sycylijski renesans"
 STATIC_MODIFIER_DESC_sic_sicilian_renaissance_mod: "Kultura, która rozkwitła w Palermo, podniosła umiejętności nowych artystów wstępujących w służbę królestwa."
 STATIC_MODIFIER_NAME_sic_kingdom_resurgent_mod: "Odrodzone królestwo"
 STATIC_MODIFIER_DESC_sic_kingdom_resurgent_mod: "Blask odrodzonego królestwa podniósł jego prestiż i legitymizację oraz wzmocnił jego rękę w negocjacjach wojennych jak nigdy dotąd."
 sic_events.1.t: "Królestwo podzielone na dwoje"
 sic_events.1.d: "W 1282 roku powstaliśmy przeciwko panowaniu domu Andegawenów. Niezdolny dłużej znosić tyranię urzędników przysłanych z Francji, lud wyspy powstał jak jeden mąż na dźwięk wieczornych dzwonów i wypędził Francuzów z naszych brzegów. Powitaliśmy Piotra III Aragońskiego jako nowego króla, a Królestwo Sycylii zostało tym samym podzielone na dwoje. Za cieśniną, na kontynencie ze stolicą w Neapolu, król domu Andegawenów wciąż nazywa siebie „królem Sycylii”. Tylko my jesteśmy prawdziwymi królami tej wyspy. Rywalizacja między naszymi dwoma królestwami trwa do dziś."
 sic_events.1.a: "Zrozumiano"
