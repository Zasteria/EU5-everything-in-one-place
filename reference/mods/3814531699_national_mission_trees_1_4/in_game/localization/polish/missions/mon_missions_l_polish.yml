l_polish:
 mon_montferrat_mission_pack: "Ambicje Paleologów i pan Włoch"
 mon_montferrat_mission_pack_DESCRIPTION:0 "W 1337 roku Margrabstwem Monferratu rządzi pan, w którego żyłach płynie krew bizantyjskiej dynastii Paleologów. Zgłoś roszczenia do Salonik i maszeruj na wschód ku Konstantynopolowi, albo wykuj imperium w Północnych Włoszech dyplomacją i mieczem kondotiera — dwie ambicje płoną w jednym suwerenie."
 mon_montferrat_mission_pack_CRITERIA_DESCRIPTION:0 "Marzenie wschodnie lub panowanie zachodnie — krew Paleologów otwiera obie ścieżki."
 mon_montferrat_mission_pack_BUTTON_TOOLTIP:0 "Wykorzystaj krew Paleologów, by podbić Włochy i Grecję."
 mon_montferrat_mission_pack_BUTTON_DETAILS:0 "Od Salonik po Ateny pod imieniem Paleologów, od Casale po Genuę stalą i monetą — podbij Wschód i Zachód!"
 mon_palaiologos_ambition: "Ambicje Paleologów"
 mon_palaiologos_ambition_desc: "Władca Monferratu niesie krew Paleologów. Dwie ambicje płoną: na wschód ku Salonikom albo na zachód ku panowaniu włoskiemu."
 mon_claim_thessaloniki: "Roszczenie do Salonik"
 mon_claim_thessaloniki_desc: "Zgłoś roszczenie do Salonik — niegdyś drugiego miasta Bizancjum — jako przyczółka dla ambicji wschodnich."
 mon_seize_thessaloniki: "Zdobądź Saloniki"
 mon_seize_thessaloniki_desc: "Zdobądź Saloniki i zatknij sztandar Paleologów na Białej Wieży."
 mon_conquer_macedonia: "Podbój Macedonii"
 mon_conquer_macedonia_desc: "Podbij Macedonię — bramę do Grecji i ojczyznę Aleksandra Wielkiego."
 mon_northern_greece: "Północna Grecja"
 mon_northern_greece_desc: "Zabezpiecz Północną Grecję jako podstawę dalszej ekspansji."
 mon_conquer_morea: "Podbój Morei"
 mon_conquer_morea_desc: "Podbij Moreę i Ateny — serce starożytnej cywilizacji greckiej."
 mon_aegean_control: "Opanuj Morze Egejskie"
 mon_aegean_control_desc: "Zdobądź wyspy egejskie, by rozszerzyć zasięg morski Monferratu."
 mon_new_byzantium: "Nowe Bizancjum"
 mon_new_byzantium_desc: "Zgłoś roszczenie do dziedzictwa bizantyjskiego i bądź uznany za następcę Rzymu Wschodniego."
 mon_secure_piedmont: "Zabezpiecz Piemont"
 mon_secure_piedmont_desc: "Zabezpiecz Piemont jako podstawę dominacji północnowłoskiej."
 mon_casale_capital: "Casale Monferrato"
 mon_casale_capital_desc: "Rozwiń Casale Monferrato w godną stolicę Margrabstwa."
 mon_rival_savoy: "Rywal Sabaudia"
 mon_rival_savoy_desc: "Przeciwstaw się Sabaudii — rywalowi o dominację piemoncką — i ustanów zwierzchność."
 mon_control_lombardy: "Opanuj Lombardię"
 mon_control_lombardy_desc: "Podbij Lombardię — serce Północnych Włoch."
 mon_seize_genoa: "Zdobądź Genuę"
 mon_seize_genoa_desc: "Zdobądź Genuę — La Superbę — i zyskaj dostęp do handlu śródziemnomorskiego."
 mon_north_italy_trade: "Północnowłoskie imperium handlowe"
 mon_north_italy_trade_desc: "Zbuduj imperium handlowe, obejmujące Lombardię, Ligurię i Wenecję Euganejską."
 mon_emilia: "Podbój Emilii"
 mon_emilia_desc: "Podbij żyzny południowy brzeg doliny Padu — Bolonię, Parmę i Modenę."
 mon_king_of_italy: "Król Włoch"
 mon_king_of_italy_desc: "Ogłoś Króla Włoch po zjednoczeniu Lombardii, Ligurii i Emilii."
 mon_hre_relations: "Stosunki ze Świętym Cesarstwem"
 mon_hre_relations_desc: "Określ stosunki ze Świętym Cesarstwem Rzymskim — sojusznik, rywal lub przywódca."
 mon_dev_casale: "Casale — miasto nauki i bogactwa"
 mon_dev_casale_desc: "Przekształć Casale w miasto nauki i bogactwa, gdzie łączą się renesans i dziedzictwo bizantyjskie."
 mon_renaissance_court: "Dwór renesansowy"
 mon_renaissance_court_desc: "Stwórz dwór renesansowy, gdzie zlewają się bizantyjska wiedza klasyczna i włoska innowacja artystyczna."
 mon_mercenary_tradition: "Tradycja kondotierów"
 mon_mercenary_tradition_desc: "Zbuduj tradycję kondotierów — najemnego dziedzictwa wojskowego Monferratu."
 mon_papal_alliance: "Sojusz papieski"
 mon_papal_alliance_desc: "Sprzymierz się z papieżem, by zalegitymizować ambicje Monferratu we Włoszech."
 mon_tuscany: "Podbój Toskanii"
 mon_tuscany_desc: "Podbij Toskanię — dom kultury renesansowej Medyceuszy — i posuwaj się ku Rzymowi."
 mon_veneto: "Podbój Wenecji Euganejskiej"
 mon_veneto_desc: "Podbij Wenecję Euganejską, w tym Wenecję, by dopełnić mistrzostwo północnowłoskie."
 mon_byzantine_heritage: "Dziedzictwo bizantyjskie"
 mon_byzantine_heritage_desc: "Zgłoś roszczenie do pełnego dziedzictwa bizantyjskiego — w kulturze greckiej i prawosławiu zyskaj większe nagrody."
 mon_navy_adriatic: "Flota adriatycka"
 mon_navy_adriatic_desc: "Zbuduj potężną flotę adriatycką, łączącą potęgę morską genueńską i wenecką."
 mon_southern_italy: "Południowe Włochy"
 mon_southern_italy_desc: "Posuń się w Południowe Włochy i zdobądź Neapol, by zjednoczyć Półwysep Włoski."
 mon_marquis_of_italy: "Wielki Markiz Włoch"
 mon_marquis_of_italy_desc: "Panuj jako Wielki Markiz Włoch — jednocząc Wschód i Zachód, Północ i Południe."
 mon_new_roman_empire: "Nowe Cesarstwo Rzymskie"
 mon_new_roman_empire_desc: "Ogłoś Nowe Cesarstwo Rzymskie — następcę zarówno Rzymu Wschodniego, jak i Zachodniego."
 mon_events.10.t: "Zdobycie Salonik — sztandar Paleologów nad Białą Wieżą"
 mon_events.10.d: "Saloniki — niegdyś drugie miasto Cesarstwa Bizantyjskiego, teraz upadają przed Monferratem. Władca z krwią Paleologów zaczyna urzeczywistniać ambicje wschodnie. Dzwony Białej Wieży biją — nowa era się rozpoczęła."
 mon_events.10.a: "Niech żyją Saloniki! Pod sztandarem Paleologów!"
 mon_events.20.t: "Król Włoch — triumf od Casale po Święte Miasto"
 mon_events.20.d: "„Król Włoch” — Monferrat, zjednoczywszy Lombardię, Ligurię i Emilię, ogłoszony jest nowym panem Półwyspu Włoskiego. Wiwaty rozbrzmiewają na dworze w Casale."
 mon_events.20.a: "Niech żyje Król Włoch!"
 mon_events.50.t: "Narodziny Nowego Bizancjum — marzenie Paleologów spełnione"
 mon_events.50.d: "„Cesarz Paleolog — następca Rzymu i Konstantynopola” — Monferrat dziedziczy imię bizantyjskie. Podróż od małego północnowłoskiego margrabstwa rozpoczęła swą drogę ku mistrzostwu we wschodnim Morzu Śródziemnym."
 mon_events.50.a: "Niech żyje Cesarz Paleolog! Niech żyje Nowe Bizancjum!"
 mon_events.60.t: "Wielki Markiz Włoch — panowanie na rozdrożu Wschodu i Zachodu"
 mon_events.60.d: "Od Casale Monferrato po Genuę, Florencję, Neapol — Imperium Monferratu się narodziło. Sztuka renesansowa, duch bizantyjski, miecz kondotiera — trzy potęgi zlane, by stworzyć pana Włoch."
 mon_events.60.a: "Niech żyje Wielki Markiz Włoch!"
 mon_events.99.t: "Nowe Cesarstwo Rzymskie — zjednoczyciel Wschodu i Zachodu"
 mon_events.99.d: "„Cesarz Paleolog — następca Rzymu Wschodniego i Zachodniego, Król Włoch, Pan Grecji” — ten tytuł odbija się echem po całym świecie śródziemnomorskim. Ambicja, która wykiełkowała na małym dworze w Casale w 1337 roku, osiąga teraz kulminację w budowie imperium światowego. Imię Rzymu przywrócone."
 mon_events.99.a: "Niech żyje Nowe Cesarstwo Rzymskie! Niech żyje wieczna chwała!"
 STATIC_MODIFIER_NAME_mon_palaiologos_mod: "Paleologowie"
 STATIC_MODIFIER_DESC_mon_palaiologos_mod: "Linia krwi Paleologów budzi ambicje Monferratu wobec Wschodu i Zachodu."
 STATIC_MODIFIER_NAME_mon_thessaloniki_claim_mod: "Roszczenie do Salonik"
 STATIC_MODIFIER_DESC_mon_thessaloniki_claim_mod: "Saloniki kuszą — sztandar Paleologów wkrótce zapowiewa nad Morzem Egejskim."
 STATIC_MODIFIER_NAME_mon_macedonia_mod: "Macedonia"
 STATIC_MODIFIER_DESC_mon_macedonia_mod: "Macedonia podbita — brama do Grecji i ojczyzna Aleksandra Wielkiego."
 STATIC_MODIFIER_NAME_mon_northern_greece_mod: "Północna Grecja"
 STATIC_MODIFIER_DESC_mon_northern_greece_mod: "Północna Grecja zabezpieczona jako podstawa dalszej ekspansji na południe."
 STATIC_MODIFIER_NAME_mon_morea_mod: "Morea"
 STATIC_MODIFIER_DESC_mon_morea_mod: "Morea i Ateny podbite — serce starożytnej cywilizacji greckiej przywrócone."
 STATIC_MODIFIER_NAME_mon_aegean_mod: "Morze Egejskie"
 STATIC_MODIFIER_DESC_mon_aegean_mod: "Wyspy egejskie zdobyte, rozszerzając zasięg morski Monferratu na Morze Śródziemne."
 STATIC_MODIFIER_NAME_mon_piedmont_mod: "Piemont"
 STATIC_MODIFIER_DESC_mon_piedmont_mod: "Piemont zabezpieczony — pospolite ruszenie Północnych Włoch maszeruje teraz pod sztandarem Monferratu."
 STATIC_MODIFIER_NAME_mon_casale_mod: "Casale"
 STATIC_MODIFIER_DESC_mon_casale_mod: "Casale Monferrato bije jako handlowe serce Margrabstwa."
 STATIC_MODIFIER_NAME_mon_savoy_mod: "Sabaudia"
 STATIC_MODIFIER_DESC_mon_savoy_mod: "Sabaudia — rywal o dominację piemoncką — przeciwstawiona i stłumiona."
 STATIC_MODIFIER_NAME_mon_lombardy_mod: "Lombardia"
 STATIC_MODIFIER_DESC_mon_lombardy_mod: "Lombardia — serce Północnych Włoch — wpada pod kontrolę Monferratu."
 STATIC_MODIFIER_NAME_mon_genoa_mod: "Genua"
 STATIC_MODIFIER_DESC_mon_genoa_mod: "La Superba Genua zdobyta — drzwi do handlu śródziemnomorskiego się otwierają."
 STATIC_MODIFIER_NAME_mon_trade_mod: "Handel"
 STATIC_MODIFIER_DESC_mon_trade_mod: "Imperium handlowe, obejmujące Lombardię, Ligurię i Wenecję Euganejską, zbudowane."
 STATIC_MODIFIER_NAME_mon_emilia_mod: "Emilia"
 STATIC_MODIFIER_DESC_mon_emilia_mod: "Żyzny południowy brzeg doliny Padu — Bolonia, Parma, Modena — podbity."
 STATIC_MODIFIER_NAME_mon_hre_mod: "Święte Cesarstwo"
 STATIC_MODIFIER_DESC_mon_hre_mod: "Stosunki ze Świętym Cesarstwem Rzymskim określone — Monferrat zyskuje pozycję dyplomatyczną."
 STATIC_MODIFIER_NAME_mon_casale_dev_mod: "Rozwój Casale"
 STATIC_MODIFIER_DESC_mon_casale_dev_mod: "Casale wkracza w swój złoty wiek nauki i bogactwa — kulturalna latarnia Północnych Włoch."
 STATIC_MODIFIER_NAME_mon_renaissance_mod: "Renesans"
 STATIC_MODIFIER_DESC_mon_renaissance_mod: "Dwór renesansowy stworzony — bizantyjska wiedza klasyczna zlewa się z włoską innowacją artystyczną."
 STATIC_MODIFIER_NAME_mon_condottieri_mod: "Kondotierzy"
 STATIC_MODIFIER_DESC_mon_condottieri_mod: "Kondotierzy Monferratu stali się legendą — elitarni żołnierze zbierają się pod ich sztandarami i opanowali pola bitew Włoch."
 STATIC_MODIFIER_NAME_mon_papal_mod: "Papieski"
 STATIC_MODIFIER_DESC_mon_papal_mod: "Błogosławieństwo papieża legitymizuje ambicje Monferratu na całym Półwyspie Włoskim."
 STATIC_MODIFIER_NAME_mon_tuscany_mod: "Toskania"
 STATIC_MODIFIER_DESC_mon_tuscany_mod: "Toskania — dom kultury renesansowej Medyceuszy — podbita i zabezpieczona."
 STATIC_MODIFIER_NAME_mon_veneto_mod: "Wenecja Euganejska"
 STATIC_MODIFIER_DESC_mon_veneto_mod: "Wenecja Euganejska, w tym Wenecja, podbita — mistrzostwo północnowłoskie dopełnione."
 STATIC_MODIFIER_NAME_mon_heritage_mod: "Dziedzictwo"
 STATIC_MODIFIER_DESC_mon_heritage_mod: "Pełne dziedzictwo bizantyjskie zgłoszone — biurokracja, akwedukty i legitymizacja płyną ze starożytnego Rzymu."
 STATIC_MODIFIER_NAME_mon_navy_mod: "Flota"
 STATIC_MODIFIER_DESC_mon_navy_mod: "Potężna flota adriatycka, łącząca potęgę morską genueńską i wenecką, zbudowana."
 STATIC_MODIFIER_NAME_mon_southern_italy_mod: "Południowe Włochy"
 STATIC_MODIFIER_DESC_mon_southern_italy_mod: "Południowe Włochy i Neapol zdobyte — Półwysep Włoski zjednoczony pod jednym sztandarem."
 STATIC_MODIFIER_NAME_mon_marquis_final_mod: "Finał Markiza"
 STATIC_MODIFIER_DESC_mon_marquis_final_mod: "Wielki Markiz Włoch panuje — jednocząc Wschód i Zachód, Północ i Południe."
 STATIC_MODIFIER_NAME_mon_new_roman_mod: "Nowy Rzym"
 STATIC_MODIFIER_DESC_mon_new_roman_mod: "Nowe Cesarstwo Rzymskie proklamowane — następca zarówno Rzymu Wschodniego, jak i Zachodniego."
 mon_carta_di_franchigia: "Carta di Franchigia"
 mon_carta_di_franchigia_desc: "Carta di Franchigia — „Karta Wolności”. Markiz Monferratu nadaje autonomię i przywileje każdemu miastu, tworząc żyzny grunt, by kupcy, chłopi i obywatele prosperowali. Tak jak Casale niegdyś rozkwitło pod taką kartą, całe margrabstwo skorzysta z jej błogosławieństw."
 mon_carta_di_franchigia_unlock_tt: "Przywilej miejski „Carta di Franchigia” staje się dostępny."
 mon_acqui_terme: "Rozwój Acqui Terme"
 mon_acqui_terme_desc: "Acqui Terme — słynne jako „miasto źródeł termalnych” od czasów starożytnego Rzymu. Przywróć jego sławne wody. Lecznicze źródła, niegdyś odwiedzane przez cesarzy rzymskich, staną się nową dumą Monferratu, odrodzone jako miasto zdrowia, przyciągające gości z daleka."
 STATIC_MODIFIER_NAME_mon_acqui_terme_mod: "Acqui Terme odnowione"
 STATIC_MODIFIER_DESC_mon_acqui_terme_mod: "Starożytne rzymskie źródła termalne odnowione — Acqui odrodzone jako miasto zdrowia i dobrobytu."
 STATIC_MODIFIER_NAME_mon_heritage_basic_mod: "Gasnące światło Bizancjum"
 STATIC_MODIFIER_DESC_mon_heritage_basic_mod: "Dziedzictwo bizantyjskie oświetla Monferrat — jego legitymizacja cicho zaczyna rosnąć."
 STATIC_MODIFIER_NAME_mon_new_byzantium_mod: "Majestat Nowego Bizancjum"
 STATIC_MODIFIER_DESC_mon_new_byzantium_mod: "Marzenie Paleologów spełnione — administracja imperialna, potęga morska i sieci drogowe skrystalizowane jako siła Monferratu."
