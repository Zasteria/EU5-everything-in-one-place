l_polish:
 boh_crown_of_bohemia_mission_pack: "Chwała Korony Czeskiej"
 boh_crown_of_bohemia_mission_pack_DESCRIPTION:0 "W 1337 roku Czechy są potężnym środkowoeuropejskim królestwem pod panowaniem Jana I (Ślepego Króla) z domu Luksemburgów. Przemierz burzliwą historię Czech — cesarza Karola IV, założenie Uniwersytetu Karola, Złotą Bullę — i od egzekucji Jana Husa po taktykę wozów obronnych wojen husyckich. Zjednocz Morawy, Śląsk i Słowację, rzuć wyzwanie Habsburgom o panowanie w Świętym Cesarstwie Rzymskim, i ustanów Rzeczpospolitą Czeską."
 boh_crown_of_bohemia_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Czechy, osiągnij panowanie imperialne, rozkwit kulturalny i podbój południowy, by ustanowić Rzeczpospolitą Czeską."
 boh_crown_of_bohemia_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by ustanowić Rzeczpospolitą Czeską."
 boh_crown_of_bohemia_mission_pack_BUTTON_DETAILS:0 "Nieś wolę Ślepego Króla — od Złotej Pragi do Imperium Środkowoeuropejskiego!"
 boh_crown_of_jan: "Korona Ślepego Króla"
 boh_crown_of_jan_desc: "1337 rok — Jan I, Ślepy Król, rządzi Czechami jako jeden z najpotężniejszych władców Europy Środkowej. „Nie widzę, lecz wciąż mogę walczyć” — duch Ślepego Króla jest dumą Czech. Przed swą bohaterską śmiercią w bitwie pod Crécy w 1346 roku wyniósł dom Luksemburgów do rangi jednej z największych dynastii Europy. Ustanów Pragę stolicą królewską i wzmocnij fundamenty królestwa."
 boh_lion_of_empire: "Lew Cesarstwa"
 boh_lion_of_empire_desc: "Król Czech jest najsilniejszym elektorem Świętego Cesarstwa Rzymskiego. Każdy książę Cesarstwa musi skłonić się przed mieczem Czech. Ustanów pozycję „Lwa Cesarstwa” poprzez siłę militarną i prestiż."
 boh_challenge_habsburg: "Rzuć wyzwanie Habsburgom"
 boh_challenge_habsburg_desc: "Dom Habsburgów — największy rywal Czech o panowanie nad Europą Środkową — knuje panowanie imperialne ze swej austriackiej bazy. Czechy muszą jasno okazać swój sprzeciw."
 boh_saxony_ambitions: "Ambicje wobec Saksonii"
 boh_saxony_ambitions_desc: "Saksonia, z Dreznem w jej sercu, jest ważnym centrum handlu i kultury nad Łabą. Przywiedź elektorat saksoński pod kontrolę i rozszerz imperialne wpływy Czech."
 boh_conquer_austria: "Podbij Austrię"
 boh_conquer_austria_desc: "Wiedeń upadł, a austriackie serce Habsburgów zostało zmiażdżone. Pycha „Habsburgów, nad którymi słońce nigdy nie zachodzi”, w końcu złamana. Czechy są prawdziwym władcą Europy Środkowej."
 boh_dominate_hre: "Panuj w Świętym Cesarstwie Rzymskim"
 boh_dominate_hre_desc: "Czechy panują w Świętym Cesarstwie Rzymskim. Oprócz tytułu cesarskiego zrealizowanego przez Karola IV w 1355 roku, Czechy teraz rządzą jako niekwestionowany przywódca całego Cesarstwa."
 boh_develop_prague: "Rozwiń Pragę"
 boh_develop_prague_desc: "Praga, „Miasto Stu Wież” — rozciągając się na obu brzegach Wełtawy, miasto to wkroczyło w swój złoty wiek w XIV wieku jako największe miasto Europy Środkowej. Zamek Praski, Most Karola i Rynek Staromiejski ogłaszają światu chwałę Królestwa Czech."
 boh_charles_university: "Uniwersytet Karola"
 boh_charles_university_desc: "W 1348 roku Karol IV założył Uniwersytet Karola w Pradze — pierwszy uniwersytet Europy Środkowej. Ta instytucja teologii, prawa, medycyny i filozofii wydała takich wielkich reformatorów jak Jan Hus. Zbuduj uniwersytet w Pradze po 1348 roku, by osiągnąć ten historyczny kamień milowy."
 boh_golden_bull: "Złota Bulla"
 boh_golden_bull_desc: "Złota Bulla z 1356 roku, ogłoszona przez Karola IV, skodyfikowała system wyborczy Świętego Cesarstwa Rzymskiego i ustanowiła króla Czech najważniejszym elektorem Cesarstwa. Uczyń prawną i polityczną pozycję Czech nietykalną."
 boh_bohemian_glass: "Szkło czeskie"
 boh_bohemian_glass_desc: "Zrodzone z krystalicznie czystych wód i obfitego piasku kwarcowego Czech, szkło czeskie cenione jest na dworach całej Europy za swą wyszukaną urodę. Rozwiń ten przemysł, by „kryształ czeski” stał się synonimem najwyższej jakości europejskiej."
 boh_silver_mines: "Kopalnie srebra Kutnej Hory"
 boh_silver_mines_desc: "Kopalnie srebra Kutnej Hory były najbardziej produktywne w Europie XIV wieku. To srebro, bite jako grosze praskie, krążyło w całej Europie Środkowej i wspierało gospodarczy złoty wiek Czech."
 boh_develop_moravia: "Rozwiń Morawy"
 boh_develop_moravia_desc: "Morawy, z centrum w Brnie i Ołomuńcu, są ważną częścią Ziem Korony Czeskiej. Rozwiń ten żyzny region rolniczy jako drugie centrum kulturalne i administracyjne Imperium Czeskiego."
 boh_internal_prosperity: "Dobrobyt wewnętrzny"
 boh_internal_prosperity_desc: "Szkło czeskie, srebro Kutnej Hory, rynki handlowe Pragi — razem czynią Czechy największą potęgą ekonomiczną Europy Środkowej."
 boh_jan_hus_question: "Kwestia Jana Husa"
 boh_suppress_heresy: "Stłum herezję"
 boh_suppress_heresy_desc: "Czechy zachowują wierność Kościołowi Rzymskiemu. Tłumiąc husytów jako heretyków i czyniąc wiarę katolicką kamieniem węgielnym państwa, buduje się silny sojusz z papieżem."
 boh_crusade_against_hussites: "Krucjata przeciw husytom"
 boh_crusade_against_hussites_desc: "Papież ogłosił krucjatę przeciw husytom. Przewodząc natarciu na herezję, Czechy ustanawiają swą reputację strażniczki katolickiej Europy Środkowej."
 boh_papal_champion: "Obrońca papieża"
 boh_papal_champion_desc: "Głębokie zaufanie z papiestwem i niezłomna wiara katolicka — Czechy uznane za najsilniejszą strażniczkę katolickiej Europy Środkowej."
 boh_hussite_reformation: "Reformacja husycka"
 boh_hussite_reformation_desc: "„Choć spalona, prawda jaśnieje z płomieni” — duch Jana Husa zakorzenia się w Czechach. Utrakwiści (husyci), symbolizowani przez kielich (kalich), stają się wiarą narodu, zdobywając niezależność religijną od Rzymu."
 boh_wagenburg: "Boží Bojovníci (Wojownicy Boży)"
 boh_wagenburg_desc: "Taktyka wozów obronnych (wagenburg), wynaleziona przez Jana Žižkę — łączenie umocnionych wozów w formację obronną — wielokrotnie rozbiła ciężką jazdę krzyżową. Militarny geniusz Czech rozkwita."
 boh_king_of_heretics: "Król heretyków"
 boh_king_of_heretics_desc: "Jerzy z Podiebradów rządził jako „heretycki król Czech”, mimo ekskomuniki papieskiej. Zachowaj prestiż wśród europejskiej izolacji dyplomatycznej i dowiedź światu prawowitości państwa husyckiego."
 boh_hungarian_succession: "Sukcesja węgierska"
 boh_hungarian_succession_desc: "Czechy i Węgry wielokrotnie tworzyły unie personalne przez Luksemburgów i Jagiellonów. Przywiedź bogate królestwo naddunajskie ze stolicą w Budzie pod czeski zwierzchnictwo i wzmocnij panowanie środkowoeuropejskie."
 boh_control_slovakia: "Opanuj Słowację"
 boh_control_slovakia_desc: "Słowacja — ojczyzna Wielkich Moraw, gdzie żyją bratni naród czeski i słowacki. Zabezpieczenie tej ziemi umacnia słowiańskie podstawy Czech."
 boh_conquer_transylvania: "Podbij Siedmiogród"
 boh_conquer_transylvania_desc: "Siedmiogród — „ziemia za lasem”, gdzie mieszają się Rumuni, Węgrzy i Niemcy — służy jako przednia linia bastionu chrześcijaństwa przeciw Imperium Osmańskiemu. Kontrola nad nim otwiera drogę na Bałkany."
 boh_nicopolis_revenge: "Zemsta za Nikopolis"
 boh_nicopolis_revenge_desc: "W bitwie pod Nikopolis w 1396 roku wojsko krzyżowe pod dowództwem Zygmunta Czeskiego poniosło katastrofalną klęskę z rąk Imperium Osmańskiego. Nadszedł czas, by pomścić to upokorzenie — odzyskaj Nikopolis i wypędź Osmanów z Bałkanów."
 boh_defend_against_turks: "Bastion przeciw Turkom"
 boh_defend_against_turks_desc: "Imperium Osmańskie przemierza Bałkany i zbliża się do bram Europy Środkowej. Wzmocnij obronę Siedmiogrodu i stań się tarczą chrześcijaństwa z potężną armią. Czechy są „Antemurale Christianitatis” — bastionem cywilizacji chrześcijańskiej."
 boh_push_into_balkans: "Posuń się na Bałkany"
 boh_push_into_balkans_desc: "Pomścij Nikopolis i posuń się na południe jako wyzwoliciel chrześcijaństwa. Słowianie, Grecy i Bułgarzy Bałkanów zostają wyzwoleni pod czeskim sztandarem."
 boh_secure_silesia: "Zabezpiecz Śląsk"
 boh_secure_silesia_desc: "Cały Śląsk wchodzi pod bezpośrednie rządy czeskie. Bogata w żelazo i węgiel, ta ziemia staje się rdzeniem czeskiego imperium przemysłowego."
 boh_polish_ambitions: "Ambicje wobec Polski"
 boh_polish_ambitions_desc: "Zajmij Kraków i ustanów stosunki Czech z Królestwem Polskim. Dziedzictwo dynastii Przemyślidów należy do Czech — Polska musi stać się sąsiadem pod czeskim zwierzchnictwem."
 boh_conquer_poland: "Podbij Polskę"
 boh_conquer_poland_desc: "Rozległe równiny ziem polskich wchodzą pod kontrolę czeską. Od Wisły po Odrę, ziemie słowiańskie zjednoczone są pod sztandarem króla Czech."
 boh_baltic_access: "Dostęp do Bałtyku"
 boh_baltic_access_desc: "Ze zdobytym Gdańskiem, Czechy zyskują bezpośredni dostęp do Morza Bałtyckiego. Przekształcone z państwa śródlądowego, Czechy teraz uczestniczą również w handlu północnym."
 boh_bohemian_diet: "Sejm czeski"
 boh_bohemian_diet_desc: "Czeskie zgromadzenie stanowe (sejm ziemski) — w którym uczestniczą szlachta, duchowieństwo i mieszczaństwo — jest instytucją polityczną. Jego wzmocnienie kładzie fundament pod scentralizowane rządy imperialne."
 boh_absolute_monarchy: "Monarchia absolutna"
 boh_absolute_monarchy_desc: "Monarchia absolutna ustanowiona w Czechach. Ograniczając przywileje szlacheckie i całkowicie konsolidując władzę królewską, Czechy przekształcają się w nowoczesne państwo scentralizowane."
 boh_great_power_army: "Armia wielkiej potęgi"
 boh_great_power_army_desc: "Taktyka wagenburg, Czarna Armia, elitarna piechota — militarne innowacje Czech tworzą najsilniejszą armię Europy Środkowej. Ustanów militarną przewagę Czech z wysoką tradycją wojskową i dużą stałą armią."
 boh_dev_brno: "Rozwiń Brno"
 boh_dev_brno_desc: "Brno, stolica Moraw, prosperuje jako miasto przemysłowe i handlowe na skrzyżowaniu szlaków handlowych."
 boh_dev_wroclaw: "Rozwiń Wrocław"
 boh_dev_wroclaw_desc: "Wrocław nad Odrą — serce Śląska. Jego wielokulturowa tradycja handlowa rozszerza bogactwo Imperium Czeskiego."
 boh_amber_road: "Szlak bursztynowy"
 boh_amber_road_desc: "Starożytny Szlak Bursztynowy, rozciągający się od Bałtyku po Morze Śródziemne, przecina Czechy. Kontrolując ten szlak handlowy, Czechy stają się węzłem handlu północ-południe."
 boh_dev_pest: "Rozwiń Peszt"
 boh_dev_pest_desc: "Peszt, stojący naprzeciw Budy przez Dunaj — największe miasto handlowe Węgier. Rozwiń go centrum ekonomicznym południowego Imperium Czeskiego."
 boh_renaissance_court: "Dwór renesansowy"
 boh_renaissance_court_desc: "Praga Karola IV była centrum środkowoeuropejskiego renesansu, gdzie spotykały się kultury włoska, francuska i cesarska. Artyści, uczeni i architekci gromadzą się na dworze praskim, podczas gdy rozkwita złoty wiek kultury."
 boh_great_moravia_restored: "Wielkie Morawy przywrócone"
 boh_great_moravia_restored_desc: "Po raz pierwszy od czasów Wielkich Moraw z IX wieku, całe Czechy, Morawy i Śląsk są zjednoczone. Marzenie Świętopełka i Rościsława odrodzone w naszych czasach, a Czechy jaśnieją centrum cywilizacji słowiańskiej."
 boh_central_european_power: "Potęga środkowoeuropejska"
 boh_central_european_power_desc: "Trzy filary — przywrócone Wielkie Morawy, dobrobyt wewnętrzny i monarchia absolutna — łączą się razem, a Czechy panują jako największa potęga Europy Środkowej. Z 500+ prowincjami, dochodem 500+ i prestiżem 80+, zdobądź tę chwałę."
 boh_bohemian_commonwealth: "Rzeczpospolita Czeska"
 boh_bohemian_commonwealth_desc: "Praga, Wiedeń, Berlin, Kraków, Buda — pięć wielkich miast Europy Środkowej, zjednoczonych pod czeskim sztandarem. Korona, którą zasiał Jan Ślepy w 1337 roku, jaśnieje teraz koroną imperialną. „Bohemia non perit” — Czechy nie giną — te słowa na wieki wyryte w historii."
 boh_krecy_legacy: "Dziedzictwo Crécy"
 boh_krecy_legacy_desc: "W bitwie pod Crécy w 1346 roku Ślepy Król Jan I stał na polu bitwy mimo ślepoty i zginął bohaterską śmiercią. „Nie widzę, lecz wciąż mogę walczyć” — ten duch zapisany jest w wojskowej duszy Czech."
 boh_styria_carinthia: "Styria i Karyntia"
 boh_styria_carinthia_desc: "Podbój Styrii i Karyntii u podnóża Alp ustanawia południowe granice Imperium Czeskiego. Te bogate w minerały i rolnictwo ziemie wspierają dobrobyt imperium."
 boh_kutna_hora_mint: "Mennica Kutnej Hory"
 boh_kutna_hora_mint_desc: "Grosz praski — bity ze srebra Kutnej Hory — był najbardziej zaufaną walutą Europy Środkowej w XIV wieku. Ustanów pieniężną przewagę Czech poprzez masowe wydobycie srebra."
 boh_gothic_architecture: "Miasto architektury gotyckiej"
 boh_gothic_architecture_desc: "Katedra Świętego Wita, Most Karola, Rynek Staromiejski — wspaniała architektura gotycka zbudowana przez Karola IV przekształciła Pragę w „Złote Miasto”. Podnieś rozwój Pragi i zapowiedz tę architektoniczną chwałę."
 boh_bohemian_trade_network: "Czeska sieć handlowa"
 boh_bohemian_trade_network_desc: "Sieć handlowa ze środkiem w Pradze, łącząca Wiedeń, Wrocław, Kraków i Norymbergę, wspiera handlową przewagę Czech."
 boh_compactata: "Kompaktaty praskie"
 boh_compactata_desc: "Kompaktaty z 1436 roku zmusiły Kościół Katolicki do uznania komunii utrakwistycznej pod obiema postaciami jako ustępstwo. Umiarkowana droga utrakwistyczna przynosi Czechom stabilność religijną."
 boh_utraquist_church: "Kościół utrakwistyczny"
 boh_utraquist_church_desc: "„Sub utraque specie” (pod obiema postaciami) — kościół utrakwistyczny, dający komunikantom zarówno chleb, jak i wino, ustanowiony jako religia państwowa Czech."
 boh_protestant_alliance: "Sojusz protestancki"
 boh_protestant_alliance_desc: "Husycka tradycja Czech staje się prekursorem reformacji protestanckiej. Poprzez sojusz z luteranami i kalwinistami Czechy uznane są za filar świata protestanckiego."
 boh_black_army: "Czarna Armia"
 boh_black_army_desc: "Czarna Armia, zorganizowana przez króla Macieja Korwina — jedna z pierwszych stałych profesjonalnych armii średniowiecznej Europy. Gdy ta elitarna siła walczy pod czeskim sztandarem, nic w Europie Środkowej nie może jej się przeciwstawić."
 boh_dev_berlin: "Rozwiń Berlin"
 boh_dev_berlin_desc: "Mały bramburski miasteczko Berlin rośnie jako północny węzeł administracyjny Imperium Czeskiego."
 boh_dev_konigsberg: "Rozwiń Królewiec"
 boh_dev_konigsberg_desc: "Królewiec (Zamek Królewski), zbudowany przez Przemysła Ottokara II, powraca do Czech i staje się węzłem handlu bałtyckiego."
 boh_great_king: "Wielki król"
 boh_great_king_desc: "Wysoki prestiż, wielka legitymizacja, bogaty dochód — imię króla Czech, jednego z największych władców w historii Europy Środkowej, rozbrzmiewa po całej Europie, przewyższając nawet chwałę Karola IV."
 boh_dev_olomouc: "Ołomuniec rozkwita"
 boh_dev_olomouc_desc: "Ołomuniec, starożytne miasto nauki i siedziba biskupia Moraw, jaśnieje węzłem północnej kultury renesansowej."
 boh_upper_austria: "Górna Austria"
 boh_upper_austria_desc: "Górna Austria wzdłuż górnego Dunaju włączona do Imperium Czeskiego, ustanawiając podstawę dla dalszego posuwania się na południe."
 boh_carpathian_defense: "Obrona Karpat"
 boh_carpathian_defense_desc: "Sieć twierdz wzdłuż Gór Karpackich ustanawia solidną linię obronną wschodniej granicy Imperium Czeskiego — tarczę przeciw Imperium Osmańskiemu, Tatarom i innym zagrożeniom wschodnim."
 boh_events.20.t: "Habsburgowie zmiażdżeni — panowanie czeskie"
 boh_events.20.d: "Wiedeń upadł, a duma Habsburgów złamana. „Habsburskie panowanie nad Europą Środkową, trwające od czasów Rudolfa, dobiegło końca” — te słowa rozbrzmiewają na dworze w Pradze. Król Czech jest teraz prawdziwym władcą Europy Środkowej. Historycy napiszą później: „Dom Luksemburgów był prawdziwym dziedzicem Cesarstwa”."
 boh_events.20.a: "Chwała Czechom! Era Habsburgów skończona!"
 boh_events.50.t: "Wielkie Morawy przywrócone"
 boh_events.50.d: "Czechy, Morawy i Śląsk zjednoczone. Czterysta lat po rozpadzie Wielkich Moraw, zbudowanych przez Świętopełka, to dziedzictwo odrodzone jest w naszych czasach. Na dworze w Pradze król Czech ogłasza tytuł „Rex Slavorum” — Króla Słowian."
 boh_events.50.a: "Chwała Wielkim Morawom! Chwała jedności słowiańskiej!"
 boh_events.99.t: "Narodziny Rzeczpospolitej Czeskiej"
 boh_events.99.d: "Praga, Wiedeń, Berlin, Kraków, Buda — pięć wielkich miast Europy Środkowej, zjednoczonych pod czeskim sztandarem. Korona, którą zasiał Jan Ślepy w 1337 roku, jaśnieje teraz koroną imperialną. Gdy iglice gotyckich soborów wznoszą się ponad niebo Pragi, słowa „Bohemia non perit” — Czechy nie giną — są na wieki wyryte w historii."
 boh_events.99.a: "Chwała Rzeczpospolitej Czeskiej! Niech władca Europy Środkowej trwa na wieki!"
 STATIC_MODIFIER_NAME_boh_blind_king_mod: "Dziedzictwo Ślepego Króla"
 STATIC_MODIFIER_DESC_boh_blind_king_mod: "„Nie widzę, lecz wciąż mogę walczyć” — duch Jana I, Ślepego Króla, położył kamień węgielny Królestwa Czech."
 STATIC_MODIFIER_NAME_boh_imperial_power_mod: "Lew Cesarstwa"
 STATIC_MODIFIER_DESC_boh_imperial_power_mod: "Czechy stają na czele jako najsilniejszy elektor Cesarstwa."
 STATIC_MODIFIER_NAME_boh_habsburg_rival_mod: "Wyzwanie dla Habsburgów"
 STATIC_MODIFIER_DESC_boh_habsburg_rival_mod: "Rywalizacja między domem Luksemburgów a Habsburgami o panowanie imperialne narasta."
 STATIC_MODIFIER_NAME_boh_silesia_mod: "Żelazo Śląska"
 STATIC_MODIFIER_DESC_boh_silesia_mod: "Obfita ruda żelaza Śląska wspiera podstawę przemysłu obronnego Czech."
 STATIC_MODIFIER_NAME_boh_hre_master_mod: "Panowanie w Świętym Cesarstwie Rzymskim"
 STATIC_MODIFIER_DESC_boh_hre_master_mod: "Czechy rządzą jako niekwestionowany przywódca Świętego Cesarstwa Rzymskiego, a żaden książę nie odważy się pisać do Pragi inaczej niż ze skłonioną głową."
 STATIC_MODIFIER_NAME_boh_prague_capital_mod: "Praga, Miasto Stu Wież"
 STATIC_MODIFIER_DESC_boh_prague_capital_mod: "Praga nad Wełtawą rozwinięta jako największe miasto Europy Środkowej."
 STATIC_MODIFIER_NAME_boh_charles_university_mod: "Uniwersytet Karola"
 STATIC_MODIFIER_DESC_boh_charles_university_mod: "Pierwszy uniwersytet Europy Środkowej otwiera się w Pradze — jaśniejąc centrum nauki i reformy."
 STATIC_MODIFIER_NAME_boh_golden_bull_mod: "Złota Bulla"
 STATIC_MODIFIER_DESC_boh_golden_bull_mod: "Status elektorski króla Czech ustanowiony Złotą Bullą."
 STATIC_MODIFIER_NAME_boh_glass_industry_mod: "Szkło czeskie"
 STATIC_MODIFIER_DESC_boh_glass_industry_mod: "Kryształ czeski ustanawia swą sławę najlepszego mistrzostwa Europy."
 STATIC_MODIFIER_NAME_boh_kutna_hora_mod: "Srebro Kutnej Hory"
 STATIC_MODIFIER_DESC_boh_kutna_hora_mod: "Największa kopalnia srebra Europy Środkowej wspiera gospodarczy złoty wiek Czech. Grosz praski szeroko krąży."
 STATIC_MODIFIER_NAME_boh_moravia_mod: "Integracja moraw"
 STATIC_MODIFIER_DESC_boh_moravia_mod: "Morawy z centrum w Brnie i Ołomuńcu włączone do Imperium Czeskiego."
 STATIC_MODIFIER_NAME_boh_prosperity_mod: "Dobrobyt wewnętrzny"
 STATIC_MODIFIER_DESC_boh_prosperity_mod: "Szkło czeskie, srebro i rynki handlowe łączą się, tworząc największą potęgę ekonomiczną Europy Środkowej."
 STATIC_MODIFIER_NAME_boh_catholic_reform_mod: "Niezłomna wiara katolicka"
 STATIC_MODIFIER_DESC_boh_catholic_reform_mod: "Czechy, zachowując wierność Kościołowi Rzymskiemu, uznane są za przywódcę środkowoeuropejskiej cywilizacji katolickiej."
 STATIC_MODIFIER_NAME_boh_crusader_glory_mod: "Chwała krzyżowca"
 STATIC_MODIFIER_DESC_boh_crusader_glory_mod: "Przewodząc krucjacie antyhusyckiej, Czechy zyskują reputację obrońcy chrześcijaństwa."
 STATIC_MODIFIER_NAME_boh_papal_ally_mod: "Tarcza papieża"
 STATIC_MODIFIER_DESC_boh_papal_ally_mod: "Głębokie zaufanie z papiestwem czyni Czechy przywódcą katolickiej Europy Środkowej."
 STATIC_MODIFIER_NAME_boh_hussite_church_mod: "Kościół husycki"
 STATIC_MODIFIER_DESC_boh_hussite_church_mod: "Duch Jana Husa zakorzenia się w Czechach — ustanowiona niezależna droga reformy religijnej."
 STATIC_MODIFIER_NAME_boh_wagenburg_mod: "Taktyka wagenburg"
 STATIC_MODIFIER_DESC_boh_wagenburg_mod: "Rewolucyjna taktyka Jana Žižki osiedla się w czeskiej armii. Wozy obronne miażdżą jazdę krzyżową."
 STATIC_MODIFIER_NAME_boh_king_heretic_mod: "Prestiż króla heretyków"
 STATIC_MODIFIER_DESC_boh_king_heretic_mod: "Zachowując prestiż mimo ekskomuniki papieskiej, król czeski przezwycięża izolację dyplomatyczną."
 STATIC_MODIFIER_NAME_boh_slovakia_mod: "Integracja Słowacji"
 STATIC_MODIFIER_DESC_boh_slovakia_mod: "Lwi sztandar Czech reje teraz nad wzgórzami Słowacji, ojczyzną Wielkich Moraw."
 STATIC_MODIFIER_NAME_boh_transylvania_mod: "Siedmiogród"
 STATIC_MODIFIER_DESC_boh_transylvania_mod: "Ziemia za lasem wchodzi pod czeskie rządy — przyczółek dla ekspansji bałkańskiej ustanowiony."
 STATIC_MODIFIER_NAME_boh_nicopolis_glory_mod: "Zemsta za Nikopolis"
 STATIC_MODIFIER_DESC_boh_nicopolis_glory_mod: "Upokorzenie z 1396 roku pomszczone. Czechy stają się awangardą kontrataku przeciw Imperium Osmańskiemu."
 STATIC_MODIFIER_NAME_boh_antemurale_mod: "Tarcza chrześcijaństwa"
 STATIC_MODIFIER_DESC_boh_antemurale_mod: "Twierdze Siedmiogrodu stają się tarczą powstrzymującą postęp osmański."
 STATIC_MODIFIER_NAME_boh_balkan_conqueror_mod: "Wyzwoliciel Bałkanów"
 STATIC_MODIFIER_DESC_boh_balkan_conqueror_mod: "Czechy posuwają się na południe jako wyzwoliciel Słowian i chrześcijan Bałkanów."
 STATIC_MODIFIER_NAME_boh_silesia_secured_mod: "Śląsk w pełni włączony"
 STATIC_MODIFIER_DESC_boh_silesia_secured_mod: "Cały Śląsk pod bezpośrednim panowaniem czeskim — podstawa przemysłu żelaznego i węglowego ustanowiona."
 STATIC_MODIFIER_NAME_boh_poland_subjugated_mod: "Polska podporządkowana"
 STATIC_MODIFIER_DESC_boh_poland_subjugated_mod: "Równiny polskie wchodzą pod kontrolę czeską — podstawa dla ekspansji wschodniej ustanowiona."
 STATIC_MODIFIER_NAME_boh_baltic_access_mod: "Dostęp do Bałtyku"
 STATIC_MODIFIER_DESC_boh_baltic_access_mod: "Ze zdobytym Gdańskiem Czechy mogą bezpośrednio uczestniczyć w handlu bałtyckim."
 STATIC_MODIFIER_NAME_boh_diet_mod: "Sejm czeski"
 STATIC_MODIFIER_DESC_boh_diet_mod: "W izbie sejmu ziemskiego delegaci stanów słuchają teraz uważnie polityki cesarza."
 STATIC_MODIFIER_NAME_boh_absolutism_mod: "Monarchia absolutna"
 STATIC_MODIFIER_DESC_boh_absolutism_mod: "Monarchia absolutna ustanowiona w Czechach — przekształcenie w nowoczesne państwo scentralizowane."
 STATIC_MODIFIER_NAME_boh_military_power_mod: "Armia wielkiej potęgi"
 STATIC_MODIFIER_DESC_boh_military_power_mod: "Elitarna armia Czech, dziedzicząca tradycję Wagenburgu i Czarnej Armii, posiada największą potęgę militarną Europy Środkowej."
 STATIC_MODIFIER_NAME_boh_brno_mod: "Brno prosperuje"
 STATIC_MODIFIER_DESC_boh_brno_mod: "Stolica Moraw Brno rozwija się centrum handlu i przemysłu."
 STATIC_MODIFIER_NAME_boh_wroclaw_mod: "Wrocław prosperuje"
 STATIC_MODIFIER_DESC_boh_wroclaw_mod: "Wrocław nad Odrą działa jako serce gospodarki śląskiej."
 STATIC_MODIFIER_NAME_boh_amber_road_mod: "Szlak bursztynowy"
 STATIC_MODIFIER_DESC_boh_amber_road_mod: "Czechy, kontrolując starożytny Szlak Bursztynowy od Bałtyku po Morze Śródziemne, stają się węzłem handlu północ-południe."
 STATIC_MODIFIER_NAME_boh_pest_mod: "Peszt prosperuje"
 STATIC_MODIFIER_DESC_boh_pest_mod: "Peszt nad Dunajem rozwinięty jako centrum handlowe południowego Imperium Czeskiego."
 STATIC_MODIFIER_NAME_boh_renaissance_mod: "Dwór renesansowy"
 STATIC_MODIFIER_DESC_boh_renaissance_mod: "Praga staje się centrum środkowoeuropejskiego renesansu, gdzie spotykają się kultury włoska, francuska i środkowoeuropejska."
 STATIC_MODIFIER_NAME_boh_great_moravia_mod: "Wielkie Morawy przywrócone"
 STATIC_MODIFIER_DESC_boh_great_moravia_mod: "Po raz pierwszy od czasów Świętopełka, Czechy, Morawy i Śląsk zjednoczone — centrum cywilizacji słowiańskiej odrodzone."
 STATIC_MODIFIER_NAME_boh_central_power_mod: "Potęga środkowoeuropejska"
 STATIC_MODIFIER_DESC_boh_central_power_mod: "Czechy rządzą jako największa potęga Europy Środkowej, ustanawiając przewagę w imperium, kulturze i sile militarnej."
 STATIC_MODIFIER_NAME_boh_krecy_glory_mod: "Dziedzictwo Crécy"
 STATIC_MODIFIER_DESC_boh_krecy_glory_mod: "Bohaterska śmierć Ślepego Króla przekazywana jest jako duma wojskowa Czech."
 STATIC_MODIFIER_NAME_boh_alpine_lands_mod: "Ziemie alpejskie"
 STATIC_MODIFIER_DESC_boh_alpine_lands_mod: "Garnizony noszące czeski sztandar strzegą teraz górskich przełęczy Styrii i Karyntii."
 STATIC_MODIFIER_NAME_boh_silver_currency_mod: "Grosz praski"
 STATIC_MODIFIER_DESC_boh_silver_currency_mod: "Grosz praski, bity ze srebra Kutnej Hory, staje się największą walutą międzynarodową Europy Środkowej."
 STATIC_MODIFIER_NAME_boh_golden_prague_mod: "Złota Praga"
 STATIC_MODIFIER_DESC_boh_golden_prague_mod: "Katedra Świętego Wita, Most Karola, Sto Wież — Praga staje się największym centrum kulturalnym Europy Środkowej jako „Złote Miasto”."
 STATIC_MODIFIER_NAME_boh_trade_network_mod: "Czeska sieć handlowa"
 STATIC_MODIFIER_DESC_boh_trade_network_mod: "Środkowoeuropejska sieć handlowa ze środkiem w Pradze wspiera handlową przewagę Czech."
 STATIC_MODIFIER_NAME_boh_compactata_mod: "Kompaktaty praskie"
 STATIC_MODIFIER_DESC_boh_compactata_mod: "Pojednanie katolików i utrakwistów osiągnięte — stabilność religijna przywrócona Czechom."
 STATIC_MODIFIER_NAME_boh_utraquist_mod: "Kościół utrakwistyczny"
 STATIC_MODIFIER_DESC_boh_utraquist_mod: "Kościół utrakwistyczny komunii pod obiema postaciami ustanowiony jako religia państwowa Czech."
 STATIC_MODIFIER_NAME_boh_protestant_alliance_mod: "Sojusz protestancki"
 STATIC_MODIFIER_DESC_boh_protestant_alliance_mod: "Czechy z ich husycką tradycją uznane są za filar świata protestanckiego."
 STATIC_MODIFIER_NAME_boh_black_army_mod: "Czarna Armia"
 STATIC_MODIFIER_DESC_boh_black_army_mod: "Duch Czarnej Armii osiedla się w Czechach — najsilniejsza profesjonalna armia Europy Środkowej ukończona."
 STATIC_MODIFIER_NAME_boh_berlin_mod: "Berlin rozwinięty"
 STATIC_MODIFIER_DESC_boh_berlin_mod: "Małe północne miasteczko Berlin rośnie jako północny węzeł administracyjny Imperium Czeskiego."
 STATIC_MODIFIER_NAME_boh_konigsberg_mod: "Królewiec odzyskany"
 STATIC_MODIFIER_DESC_boh_konigsberg_mod: "Królewiec, zbudowany przez Przemysła Ottokara II, powraca do Czech i staje się węzłem handlu bałtyckiego."
 STATIC_MODIFIER_NAME_boh_great_king_mod: "Wielki król"
 STATIC_MODIFIER_DESC_boh_great_king_mod: "Imię króla Czech wyryte jest w historii Europy Środkowej jako jej największego władcy, przewyższającego nawet Karola IV."
 STATIC_MODIFIER_NAME_boh_fortress_europe_mod: "Twierdza Europy"
 STATIC_MODIFIER_DESC_boh_fortress_europe_mod: "Sieć twierdz od Alp po Karpaty powstrzymuje postęp osmański."
 STATIC_MODIFIER_NAME_boh_olomouc_mod: "Ołomuniec rozkwita"
 STATIC_MODIFIER_DESC_boh_olomouc_mod: "Ołomuniec, centrum nauki i religii Moraw, jaśnieje węzłem północnej kultury renesansowej."
 STATIC_MODIFIER_NAME_boh_upper_austria_mod: "Górna Austria"
 STATIC_MODIFIER_DESC_boh_upper_austria_mod: "Nad murami Górnej Austrii, w górę Dunaju, reje sztandar Imperium Czeskiego, a drogi na południe leżą otwarte."
 STATIC_MODIFIER_NAME_boh_carpathian_mod: "Obrona Karpat"
 STATIC_MODIFIER_DESC_boh_carpathian_mod: "Sieć twierdz wzdłuż Karpat staje się tarczą chroniącą wschodnią granicę Imperium Czeskiego."
 STATIC_MODIFIER_NAME_boh_bohemian_commonwealth_final_mod: "Chwała Rzeczpospolitej Czeskiej"
 STATIC_MODIFIER_DESC_boh_bohemian_commonwealth_final_mod: "Rzeczpospolita Czeska, kontrolująca pięć wielkich miast Europy Środkowej, ukończona. „Bohemia non perit” — te słowa na wieki wyryte w historii."
 STATIC_MODIFIER_NAME_boh_habsburg_crushed_mod: "Habsburgowie zmiażdżeni"
 STATIC_MODIFIER_DESC_boh_habsburg_crushed_mod: "Wiedeń upadł, a panowanie Habsburgów nad Europą Środkową skończone. Czechy stoją jako prawdziwy władca."
 boh_fortress_of_europe: "Twierdza Europy"
 boh_fortress_of_europe_desc: "Sieć twierdz, rozciągająca się od Alp po Karpaty, powstrzymuje postęp osmański. Czechy działają jako „Tarcza Europy”."
 boh_dev_plzen: "Rozwiń Pilzno"
 boh_dev_plzen_desc: "Pilzno — kluczowe miasto zachodnich Czech i przyszła ojczyzna słynnego na świecie piwa pilzneńskiego. Położone u zbiegu Ohrze i Mže, rozwój tego miasta wspiera handel i przemysł w całych zachodnich Czechach."
 boh_dev_cheb: "Rozwiń Cheb"
 boh_dev_cheb_desc: "Cheb, starożytne miasto nad Ohrze, jest bramą cesarską, gdzie spotykają się kultury niemiecka i czeska. Rozwiń to miasto, panujące nad szlakami handlowymi ze Świętym Cesarstwem Rzymskim, jako przyczółek dla zachodniej dyplomacji."
 boh_dev_kutna_hora_city: "Rozwiń Kutną Horę"
 boh_dev_kutna_hora_city_desc: "Lśniąc bogactwem srebra, Kutna Hora rozwinęła się w drugie miasto Czech po Pradze. Z budowaną katedrą Świętej Barbary, rozwiń to miasto w prawdziwą metropolię i ustanów je gospodarczym sercem Czech."
 boh_bohemian_agriculture: "Rolnictwo czeskie"
 boh_bohemian_agriculture_desc: "Niziny czeskie wzdłuż Łaby są bogatą strefą rolniczą. Pszenica, jęczmień i żyto dojrzewają obficie, a rozwój gospodarstw znacznie podnosi wydajność. Stałe zaopatrzenie w żywność wspiera wzrost populacji w całym Imperium Czeskim."
 boh_moravian_wine: "Wino morawskie"
 boh_moravian_wine_desc: "Południowe Morawy wokół Znojma są największym regionem winiarskim Czech. Ciepły klimat i gleba wapienna hodują wina morawskie, cenione nawet na dworze austriackim w Wiedniu. Ich bogaty smak symbolizuje kulturalne wyrafinowanie Imperium Czeskiego."
 boh_jihlava_silver: "Kopalnie srebra Jihlavy"
 boh_jihlava_silver_desc: "Jihlava, na Wyżynie Czesko-Morawskiej, jest miastem górniczym rywalizującym z Kutną Horą. Przywiedzenie tych kopalni srebra do pełnej pracy dalej rozszerza wydobycie srebra w Czechach i zwiększa bicie groszy praskich."
 boh_opava_iron: "Przemysł żelazny Opawy"
 boh_opava_iron_desc: "Opawa, stolica księstwa śląskiego, znana jest ze złóż rudy żelaza. Rozwój przemysłu stalowego tego miasta dalej wzmacnia podstawę przemysłową Śląska i znacznie poprawia czeskie wyposażenie wojskowe."
 boh_dev_litomerice: "Rozwiń Litomierzyce"
 boh_dev_litomerice_desc: "Litomierzyce nad Łabą są ważnym miastem handlowym północnych Czech. Rozwinięcie ich w węzeł szlaku handlowego, rozciągającego się aż do Hamburga przez Łabę, ożywia handel z Niemcami Północnymi."
 boh_silesian_mines: "Kopalnie śląskie"
 boh_silesian_mines_desc: "Pod glebą Śląska leżą żelazo i węgiel koksujący, które wesprą przyszłe rewolucje przemysłowe. Ustanów pełnoskalowy system wydobycia i znacznie podnieś wydajność przemysłową Imperium Czeskiego."
 boh_silesian_mines_unlock_tt: "Decyzja „Rozwój kopalń Śląska” jest teraz dostępna."
 boh_silesian_mining_decision.title: "Rozwój kopalń Śląska"
 boh_silesian_mining_decision.desc: "Rejony górnicze Śląska są rozległe, a Korona nie może otworzyć ich wszystkich naraz. Każda inwestycja w szyby, huty i drogi wprowadza kolejny rejon do pełnej produkcji, a dzieło można ponawiać co dziesięć lat."
 boh_silesian_mining_decision.a: "Zainwestować w nowy rejon górniczy."
 boh_bohemian_cloth: "Czeski przemysł tekstylny"
 boh_bohemian_cloth_desc: "Obok szkła czeskiego, czeski przemysł tekstylny i sukienniczy ustanawia swą europejską reputację. Północnoczeskie sukno w połączeniu ze szlakami handlowymi Litomierzyc czyni Czechy centrum przemysłu tekstylnego."
 STATIC_MODIFIER_NAME_boh_plzen_mod: "Pilzno rozwinięte"
 STATIC_MODIFIER_DESC_boh_plzen_mod: "Pilzno, kluczowe miasto zachodnich Czech, rozwinięte centrum handlu i przemysłu."
 STATIC_MODIFIER_NAME_boh_cheb_mod: "Cheb rozwinięte"
 STATIC_MODIFIER_DESC_boh_cheb_mod: "Cheb, zachodnia brama, działa jako węzeł handlowy z Cesarstwem."
 STATIC_MODIFIER_NAME_boh_kutna_hora_city_mod: "Miasto Kutna Hora"
 STATIC_MODIFIER_DESC_boh_kutna_hora_city_mod: "Bogate w srebro drugie miasto Czech rozwinęło się w prawdziwą metropolię."
 STATIC_MODIFIER_NAME_boh_agriculture_mod: "Rolnictwo czeskie"
 STATIC_MODIFIER_DESC_boh_agriculture_mod: "Żyzna strefa rolnicza wzdłuż Łaby rozwinięta — stałe zaopatrzenie w żywność zapewnione."
 STATIC_MODIFIER_NAME_boh_znojmo_mod: "Winnice Znojma"
 STATIC_MODIFIER_DESC_boh_znojmo_mod: "Południowomorawskie winiarstwo dojrzewa, produkując wysokiej jakości wino."
 STATIC_MODIFIER_NAME_boh_moravian_wine_mod: "Wino morawskie"
 STATIC_MODIFIER_DESC_boh_moravian_wine_mod: "Wino morawskie staje się cenionym towarem nawet na dworze austriackim w Wiedniu."
 STATIC_MODIFIER_NAME_boh_jihlava_mod: "Kopalnie srebra Jihlavy"
 STATIC_MODIFIER_DESC_boh_jihlava_mod: "Kopalnie srebra Jihlavy pracują pełną mocą — producent srebra rywalizujący z Kutną Horą."
 STATIC_MODIFIER_NAME_boh_opava_mod: "Przemysł stalowy Opawy"
 STATIC_MODIFIER_DESC_boh_opava_mod: "Przemysł stalowy rozwinięty w Opawie, stolicy księstwa śląskiego."
 STATIC_MODIFIER_NAME_boh_litomerice_mod: "Węzeł handlowy Litomierzyc"
 STATIC_MODIFIER_DESC_boh_litomerice_mod: "Litomierzyce nad Łabą rozwijają się węzłem szlaków handlowych z Niemcami Północnymi."
 STATIC_MODIFIER_NAME_boh_silesian_mines_mod: "Kopalnie śląskie"
 STATIC_MODIFIER_DESC_boh_silesian_mines_mod: "Bogate kopalnie żelaza i węgla Śląska pracują pełną mocą — potęga przemysłowa Czech znacznie wzrosła."
 STATIC_MODIFIER_NAME_boh_cloth_industry_mod: "Czeski przemysł tekstylny"
 STATIC_MODIFIER_DESC_boh_cloth_industry_mod: "Przemysł tekstylny i sukienniczy Czech, obok szkła, ustanowiony jako główny towar eksportowy."
 boh_sugar_beet: "Uprawa buraka cukrowego"
 boh_sugar_beet_desc: "Era rewolucji — innowacje naukowe i przemysłowe przekształcają czeskie rolnictwo. Burak cukrowy jest idealną uprawą dla chłodnego klimatu Czech. Produkcja cukru, niegdyś monopol trzciny cukrowej, teraz powstaje również z czeskich pól. Nowe technologie rolnicze Rewolucji Przemysłowej modernizują czeskie rolnictwo."
 boh_porcelain_industry: "Czeski przemysł porcelanowy"
 boh_porcelain_industry_desc: "Era rewolucji — kaolin (glina porcelanowa) zachodnich Czech jest najlepszym materiałem porcelanowym Europy. Porcelana czeska, zrodzona z białej gliny wokół Karlových Var (Karlsbadu), rywalizuje z wyrafinowanym mistrzostwem porcelany miśnieńskiej z Drezna, zdobiąc dwory całej Europy."
 STATIC_MODIFIER_NAME_boh_porcelain_mod: "Porcelana czeska"
 STATIC_MODIFIER_DESC_boh_porcelain_mod: "Porcelana z zachodnioczeskiego kaolinu staje się luksusowym przedmiotem, zdobiącym dwory europejskie."
 boh_jan_hus_question_desc: "Reformatorski duch Jana Husa rozprzestrzenia się po całych Czechach. Pamięć o jego spaleniu na soborze w Konstancji (1415) głęboko zapisana jest w sercach Czechów, a gniew na Kościół Rzymski osiąga swój szczyt. Gdy kwestii wiary nie można już dłużej unikać, Czechy muszą określić swoją własną drogę."
 boh_events.60.t: "Uprawa buraka cukrowego — świt nowego przemysłu"
 boh_events.60.d: "1737 rok — technologia produkcji cukru z buraka cukrowego (Beta vulgaris) opracowana w całej Europie. Żyzne czeskie pola idealnie nadają się do uprawy tej nowej rośliny. Które miejsce przyjmie pierwszą farmę buraka cukrowego — Poděbrady czy Hradec Králové?"
 boh_events.60.a: "Zasadzić burak cukrowy na polach Poděbrad (ojczyźnie „heretyckiego króla” Jerzego)"
 boh_events.60.b: "Zasadzić burak cukrowy na polach Hradec Králové (żyznych ziemiach wzdłuż Łaby)"
 STATIC_MODIFIER_NAME_boh_jan_hus_mod: "Prawda Husa"
 STATIC_MODIFIER_DESC_boh_jan_hus_mod: "Odpisy kazań Jana Husa przechodzą z rąk do rąk nawet w chłopskich domach Czech."
 STATIC_MODIFIER_NAME_boh_sugar_beet_choice_mod: "Farma buraka cukrowego"
 STATIC_MODIFIER_DESC_boh_sugar_beet_choice_mod: "Uprawa buraka cukrowego dojrzewa — czeski cukier wywożony jest na rynki europejskie."
 boh_conquer_silesia: "Włącz Śląsk"
 boh_conquer_silesia_desc: "Śląsk jest częścią Ziem Korony Czeskiej. Włączenie tego regionu, bogatego w rudę żelaza i srebro, znacznie wzmacnia podstawę przemysłową i militarną Czech."
 boh_events.50.b: "Nie, zachować tradycyjne barwy Czech — nie ma potrzeby zmian"
 boh_urban_privileges: "Czeskie przywileje miejskie"
 boh_urban_privileges_desc: "Z rozwiniętym Brnem i Ołomuńcem, Czechy ustanowiły system nadawania szczególnych przywilejów swoim miastom. Miasta feudalne wzmacniają kontrolę szlachty, tłumiąc wyzwolenie chłopów; miasta kościelne promują nawrócenie religijne."
 STATIC_MODIFIER_NAME_boh_ecclesiastical_city_rights: "Prawa miasta kościelnego"
 STATIC_MODIFIER_DESC_boh_ecclesiastical_city_rights: "W tym mieście, gdzie dzwony katedry wybijają każdą godzinę dnia, nawet zasady rynku podporządkowane są godzinom modlitwy."
 boh_urban_privileges_unlock_tt: "Odblokowuje przywileje miejskie Miasto feudalne (Poddanská nebo vrchnostenská města) i Miasto kościelne (Biskupská nebo klášterní města)."
