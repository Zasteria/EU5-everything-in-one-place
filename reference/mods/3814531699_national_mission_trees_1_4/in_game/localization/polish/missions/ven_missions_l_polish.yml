l_polish:
 VEN_DOGES_PALACE_EVENT_OCCURRED: "Wydarzenie „Rozbudowa Pałacu Dożów” miało miejsce"
 ven_mainland_food_crisis: "Kryzys żywnościowy kontynentu"
 ven_mainland_food_crisis_desc: "Wenecja, miasto zbudowane na lagunie, zależy od dostaw zboża z kontynentu. Zbuduj stabilną sieć zaopatrzenia w żywność."
 ven_scaliger_war: "Wojna przeciw della Scala"
 ven_scaliger_war_desc: "Rozgrom dom della Scala, rządzący Weroną, i zabezpiecz Treviso i Vicenzę."
 ven_mainland_consolidation: "Umocnienie kontynentu"
 ven_mainland_consolidation_desc: "Administracyjnie włącz nowo zdobyte ziemie kontynentalne i ustabilizuj stosunki ze szlachtą i instytucjami rządowymi."
 ven_terraferma_expansion: "Ekspansja Terraferma"
 ven_terraferma_expansion_desc: "Podbij Weronę i Bergamo i dalej rozszerz posiadłości kontynentalne Terraferma."
 ven_warehouse_expansion: "Rozbudowa magazynów"
 ven_warehouse_expansion_desc: "Rozbuduj obiekty magazynowe Wenecji, by radzić sobie z rosnącą wielkością handlu."
 ven_piazza_san_marco: "Rozwój Placu Świętego Marka"
 ven_piazza_san_marco_desc: "Rozwiń Plac Świętego Marka, symbol Republiki, by pomnożyć prestiż szlachty."
 ven_canal_administration: "Zarządzanie kanałami"
 ven_canal_administration_desc: "Ulepsz sieć kanałów przebiegających przez Wenecję, by zwiększyć efektywność operacji morskich."
 ven_fondaco: "Fondaco"
 ven_fondaco_desc: "Wznieś sieć domów handlowych (Fondachi) dla kupców zagranicznych i rozszerz placówki handlowe."
 ven_bridge_of_wealth: "Most bogactwa"
 ven_bridge_of_wealth_desc: "Nieprzerwany sznur kupców przekracza most do Fondaco. Rozwiń dzielnicę handlową wokół tego mostu i pozwól, by strumień bogactwa narastał dalej."
 ven_doges_palace: "Odnowa Pałacu Dożów"
 ven_doges_palace_desc: "Rozwiń Pałac Dożów, symbol władzy doży, by wzmocnić strukturę rządów Republiki."
 ven_doges_palace_event_occurred_tt: "Użyto decyzji „Rozbudowa budynku: Pałac dożów”"
 ven_arsenal: "Arsenale di Venezia"
 ven_arsenal_desc: "Rozbuduj państwową stocznię, Arsenale, i podnieś zdolność budowy okrętów Republiki do poziomu światowego."
 ven_marciana_library: "Biblioteka Marciana"
 ven_marciana_library_desc: "Wznieś bibliotekę narodową z biblioteką i uniwersytetem i pomnóż prestiż naukowy Republiki."
 ven_lombardy_hegemony: "Zwierzchność nad Lombardią"
 ven_lombardy_hegemony_desc: "Ze sztandarem Republiki nad rynkami Mediolanu kupcy całej Lombardii uznają nowego władcę."
 ven_settling_with_genoa: "Rozrachunek z Genuą"
 ven_settling_with_genoa_desc: "Doprowadź dawną rywalizację handlową z Genuą do ostatecznego zakończenia. Zajmij jej port macierzysty lub zetrzyj Genuę z mapy całkowicie."
 ven_city_of_water: "Miasto wody"
 ven_city_of_water_desc: "Dopełnij miasto laguny, Wenecję, miastem niezrównanego bogactwa, splecionym drogami wodnymi i handlem."
 ven_secure_ferrara: "Zabezpiecz Ferrarę"
 ven_secure_ferrara_desc: "Zdobądź Ferrarę, rządzoną przez dom Este, i zdobądź przyczółek w Padanii."
 ven_northern_expansion: "Ekspansja na północ"
 ven_northern_expansion_desc: "Zabezpiecz Trydent i Udine i pchnij ekspansję na północ z okiem na przełęcze alpejskie."
 ven_papal_conflict: "Konflikt z Państwem Kościelnym"
 ven_papal_conflict_desc: "Napięcie z Państwem Kościelnym z powodu statusu Ferrary rośnie. Przezwyciężaj ten konflikt."
 ven_alpine_trade: "Handel transalpejski"
 ven_alpine_trade_desc: "Karawany przekraczające przełęcze alpejskie nie są już związane z jednym rynkiem, gdyż wzniesiono rozległą sieć handlową z wielu centrów handlowych."
 ven_render_unto_caesar: "Oddajcie cesarzowi, co cesarskie"
 ven_render_unto_caesar_desc: "Zyskawszy zaufanie zarówno duchowieństwa, jak i mieszczan, władza Republiki pozostaje niekwestionowana nawet w Wiecznym Mieście Rzymie."
 ven_league_of_cambrai: "Rozbij Ligę Kambrejską"
 ven_league_of_cambrai_desc: "Przełam okrążenie Ligi Kambrejskiej, utworzonej przez potęgi Europy, i obroń niepodległość Republiki."
 ven_terraferma_completed: "Ukończenie Terraferma"
 ven_terraferma_completed_desc: "Dopełnij strukturę administracyjną posiadłości kontynentalnych Terraferma i ustanów władzę Republiki nad Północnymi Włochami."
 ven_italian_unity_route: "La Serenissima"
 ven_italian_unity_route_desc: "Stań się wiodącą potęgą wśród państw włoskich i centrum nowego porządku na półwyspie."
 ven_fleet_unification: "Przygotowanie flot"
 ven_fleet_unification_desc: "Zjednocz dowodzenie różnymi flotami Republiki i popraw efektywność utrzymania floty."
 ven_black_sea_insurance: "Zabezpiecz handel czarnomorski"
 ven_black_sea_insurance_desc: "Wznieś z Negroponte bazą system eskortowania szlaków handlowych ku Morzu Czarnemu."
 ven_secure_adriatic: "Zabezpiecz Adriatyk"
 ven_secure_adriatic_desc: "Zabezpiecz Zarę i Polę i przywiedź panowanie nad Adriatykiem w ręce Republiki."
 ven_expel_genoa_black_sea: "Wypędź Genuę z Morza Czarnego"
 ven_expel_genoa_black_sea_desc: "Zabezpiecz Kaffę i Tanę, kluczowe placówki handlu czarnomorskiego, i przejmij interesy Genui, największego rywala Republiki."
 ven_aegean_expansion: "Ekspansja na Morzu Egejskim"
 ven_aegean_expansion_desc: "Zabezpiecz Kretę i Naksos i rozszerz przyczółek Republiki na Morzu Egejskim."
 ven_dalmatian_subjugation: "Podporządkowanie Dalmacji"
 ven_dalmatian_subjugation_desc: "Zabezpiecz całe wybrzeże chorwackie i przywiedź region Dalmacji pod władzę Republiki."
 ven_dominate_eastern_trade: "Opanuj handel wschodni"
 ven_dominate_eastern_trade_desc: "Przywiedź szlaki handlowe Morza Czarnego i wschodniego Morza Śródziemnego pod kontrolę Republiki i zdobądź zwierzchność nad handlem wschodnim."
 ven_greek_bridgehead: "Przyczółek w Grecji"
 ven_greek_bridgehead_desc: "Zabezpiecz Kretę i Modon i ustanów przyczółek w greckim sercu i Morzu Egejskim."
 ven_pearl_of_adriatic: "Odbuduj perłę Adriatyku"
 ven_pearl_of_adriatic_desc: "Przywróć dobrobyt miasta handlowego Raguza i przynieś Republice bogactwo znane jako „perła Adriatyku”."
 ven_protect_corfu: "Chroń Korfu"
 ven_protect_corfu_desc: "Rozmieść garnizon na Korfu, które panuje nad wejściem na Adriatyk, i zabezpiecz jego obronę."
 ven_occupy_cyprus: "Zajęcie Cypru"
 ven_occupy_cyprus_desc: "Zabezpiecz Larnakę i uczyń strategicznie ważną wyspę Cypr prowincją Republiki."
 ven_second_conquest_of_constantinople: "Drugi podbój Konstantynopola"
 ven_second_conquest_of_constantinople_desc: "Przywiedź, jak niegdyś Czwarta Krucjata, Konstantynopol znów pod kontrolę Republiki."
 ven_queen_of_the_adriatic: "Królowa Adriatyku"
 ven_queen_of_the_adriatic_desc: "Dopełnij sieć handlową i obronną nad całym Adriatykiem i wznieś Republikę do rangi „Królowej Adriatyku”."
 ven_pen_not_sword: "Zwróć się ku piórowi, nie ku mieczowi"
 ven_pen_not_sword_desc: "Zabezpiecz interesy Republiki we wschodnim Morzu Śródziemnym dyplomacją i traktatami, a nie siłą militarną, i zapewnij długotrwały dobrobyt."
 ven_latin_empire: "Cesarstwo Łacińskie"
 ven_latin_empire_desc: "Wznieś nowe Cesarstwo Łacińskie ze środkiem w Konstantynopolu i wpisz Republikę w historię władczynią Morza Śródziemnego."
 ven_grand_strategy_mission_pack: "Wielka strategia republiki morskiej"
 ven_grand_strategy_mission_pack_desc: "Mała republika, zbudowana na lagunie, idzie dwiema drogami naraz: ekspansją na kontynent i budową imperium morskiego. Ukończ Terraferma, zostań Królową Adriatyku i wreszcie wpisz swe imię w historię centrum Włoch — lub dziedziczką Cesarstwa Łacińskiego."
 ven_grand_strategy_mission_pack_BUTTON_TOOLTIP:0 "Ustanów zwierzchność Republiki na lądzie i morzu."
 ven_grand_strategy_mission_pack_DESCRIPTION:0 "Mała republika, zbudowana na lagunie, idzie dwiema drogami naraz: ekspansją na kontynent i budową imperium morskiego. Wpisz swe imię w historię Morza Śródziemnego Królową Adriatyku."
 ven_grand_strategy_mission_pack_BUTTON_DETAILS:0 "Ukończ Terraferma, zostań Królową Adriatyku i stań dziedziczką Cesarstwa Łacińskiego — wpisz imię Republiki w historię!"
 ven_grand_strategy_mission_pack_CRITERIA_DESCRIPTION:0 "Ukończ jako Wenecja Terraferma i zostań Królową Adriatyku."
 ven_events.1.t: "Upadek della Scala"
 ven_events.1.d: "Wojna przeciw tyranom della Scala z Werony kończy się weneckim zwycięstwem. Obywatele Treviso i Vicenzy witają swych nowych władców. Pierwszy krok na kontynent uczyniony."
 ven_events.1.a: "Powitać nowe prowincje"
 ven_events.2.t: "Wzrost Terraferma"
 ven_events.2.d: "Werona i Bergamo przechodzą pod sztandar Republiki. Żyzne pola uprawne i miasta handlowe równiny lombardzkiej jeszcze bardziej wzmacniają potęgę gospodarczą Wenecji."
 ven_events.2.a: "Wspierać rozwój gospodarczy nowych prowincji"
 ven_events.3.t: "Wspaniałość Pałacu Dożów"
 ven_events.3.d: "Przebudowany Pałac Dożów stoi ukończony, uosabiając władzę doży i prestiż Republiki. W jego halach szlachta zbiera się, by radzić o przyszłości Republiki."
 ven_events.3.a: "Świętować ukończenie pałacu"
 ven_events.4.t: "Rozbudowa Arsenale"
 ven_events.4.d: "Państwowa stocznia, Arsenale, rozbudowana i teraz produkuje galery i statki handlowe w niespotykanej dotąd skali. Potęga morska Republiki osiąga nowe wyżyny."
 ven_events.4.a: "Odwiedzić rozbudowane Arsenale"
 ven_events.5.t: "Ukończenie Miasta Wody"
 ven_events.5.d: "Kanały, domy handlowe, biblioteki, stocznie — miasto zbudowane na lagunie osiągnęło dobrobyt, któremu nie ma równego na świecie. „Miasto Wody” stało się godne swego imienia."
 ven_events.5.a: "Ogłosić ukończenie Miasta Wody"
 ven_events.6.t: "Wojna o Ferrarę"
 ven_events.6.d: "Stosunki z Państwem Kościelnym napinają się z powodu statusu Ferrary. Duchowieństwo potępia ambicje Republiki, lecz mieszczanie z zadowoleniem przyjmują nabytek terytorialny."
 ven_events.6.a: "Rozwiązać napięcie z Państwem Kościelnym"
 ven_events.7.t: "Oddajcie cesarzowi, co cesarskie"
 ven_events.7.d: "Republika wyjaśniła granicę między prerogatywą kościelną a świecką działalnością handlową. Władza kościoła jest szanowana, lecz handel i rzemiosło pozostają mocno pod kontrolą Republiki."
 ven_events.7.a: "Ogłosić potwierdzenie władzy świeckiej"
 ven_events.8.t: "Upadek Ligi Kambrejskiej"
 ven_events.8.d: "Liga Kambrejska, utworzona przez papieża, cesarza Świętego Cesarstwa Rzymskiego, Francję i Hiszpanię, dążyła do podziału Republiki. Lecz wewnętrzne spory doprowadziły do upadku ligi, a Wenecja zachowała swą niezależność."
 ven_events.8.a: "Zobaczyć upadek ligi"
 ven_events.9.t: "Terraferma ukończona"
 ven_events.9.d: "Rozległe prowincje Północnych Włoch zostały wreszcie włączone do systemu administracyjnego Republiki. Terraferma stoi teraz niewzruszoną podstawą potęgi gospodarczej i militarnej Wenecji."
 ven_events.9.a: "Świętować ukończenie Terraferma"
 ven_events.10.t: "Centrum Włoch"
 ven_events.10.d: "Zebrawszy siłę na lądzie i morzu, Republika nie jest już zwykłą potęgą regionalną na półwyspie włoskim. Inne państwa śledzą każdy krok Wenecji, a nowy porządek na półwyspie zaczyna nabierać kształtu."
 ven_events.10.a: "Ustanowić wiodącą pozycję we Włoszech"
 ven_events.11.t: "Wrota Adriatyku"
 ven_events.11.d: "Z Zarą i Polą pod kontrolą Republiki kluczowe pozycje, panujące nad wejściem na Adriatyk, są zabezpieczone. Floty Republiki mogą teraz żeglować z większą pewnością."
 ven_events.11.a: "Umocnić obronę nowych przyczółków"
 ven_events.12.t: "Odwrót Genui z Morza Czarnego"
 ven_events.12.d: "Genua, dawny rywal Republiki, utraciła swe najważniejsze przyczółki handlu czarnomorskiego. Kupcy weneccy zaczynają przenikać na nowo otwarte rynki."
 ven_events.12.a: "Wspierać ekspansję na nowe rynki"
 ven_events.13.t: "Przyczółek na Morzu Egejskim"
 ven_events.13.d: "Z zabezpieczonymi Kretą i Modonem przyczółek na Morzu Egejskim i w greckim sercu ustanowiony. Statki handlowe Republiki nadal rozszerzają swe wschodnie szlaki, wykorzystując te porty jako stacje pośrednie."
 ven_events.13.a: "Rozwinąć nowe porty pośrednie"
 ven_events.14.t: "Perła Cypru"
 ven_events.14.d: "Famagusta i Nikozja dołączyły do posiadłości Republiki. Strategicznie ważna wyspa Cypr przynosi Republice dalsze bogactwo przez handel przyprawami, cukrem i bawełną."
 ven_events.14.a: "Rozwinąć gospodarkę Cypru"
 ven_events.15.t: "Do Konstantynopola, znów"
 ven_events.15.d: "Po raz pierwszy od czasów Czwartej Krucjaty Wenecja osiągnęła zajęcie Konstantynopola. Pamięć starego podziału ponownie rozpala ambicje Republiki."
 ven_events.15.a: "Zbudować nową strukturę administracyjną"
 ven_events.16.t: "Królowa Adriatyku"
 ven_events.16.d: "Dobrobyt Raguzy, zwanej „perłą Adriatyku”, i twarda obrona Korfu są teraz ukończone. Republika nie jest już zwykłą potęgą Adriatyku — jest samą władczynią morza."
 ven_events.16.a: "Przyjąć tytuł „Królowej Adriatyku”"
 ven_events.17.t: "Triumf pióra"
 ven_events.17.d: "Republika zabezpieczyła swe interesy na Cyprze i w otaczającym regionie nie siłą militarną, lecz dyplomacją i traktatami. „Zwróćmy się ku piórowi, nie ku mieczowi” — to staje się nowym credo Republiki."
 ven_events.17.a: "Świętować triumf dyplomatyczny"
 ven_events.18.t: "Cesarstwo Łacińskie, odrodzone"
 ven_events.18.d: "Nowe Cesarstwo Łacińskie wzniesione ze środkiem w Konstantynopolu. Szlaki handlowe Morza Śródziemnego, spichlerze kontynentu, bogactwo Wschodu — wszystko to jest teraz w rękach Wenecji. Republika wzniosła nowego wasalnego władcę, „Cesarstwo Łacińskie”, ze stolicą Konstantynopolem, by rządzić Tracją, Macedonią, greckim sercem, Moreą i Wyspami Egejskimi — a mała republika Adriatyku sama teraz stoi imperium. Senat ogłasza światu nową rangę imperialną Republiki."
 ven_events.18.a: "Ogłosić ustanowienie Cesarstwa Łacińskiego"
 STATIC_MODIFIER_NAME_ven_grain_reserves: "Zapasy zboża"
 STATIC_MODIFIER_DESC_ven_grain_reserves: "Zboże, sprowadzone z kontynentu, napełnia miasto laguny i przynosi ulgę jego ludowi."
 STATIC_MODIFIER_NAME_ven_scaliger_victory: "Zwycięstwo w wojnie przeciw della Scala"
 STATIC_MODIFIER_DESC_ven_scaliger_victory: "Zmiażdżywszy tyranów Werony, żołnierze niosą nową pewność siebie w nadchodzących kampaniach kontynentalnych."
 STATIC_MODIFIER_NAME_ven_mainland_order: "Porządek na kontynencie"
 STATIC_MODIFIER_DESC_ven_mainland_order: "Nawet w nowo zdobytych prowincjach prawo i administracja Republiki działają teraz gładko."
 STATIC_MODIFIER_NAME_ven_terraferma_growth: "Wzrost Terraferma"
 STATIC_MODIFIER_DESC_ven_terraferma_growth: "Żyzne ziemie Terraferma przynoszą Republice nowe bogactwo."
 STATIC_MODIFIER_NAME_ven_fondaco_supply: "Sieć zaopatrzenia Fondaco"
 STATIC_MODIFIER_DESC_ven_fondaco_supply: "Rozbudowane magazyny nieustannie napełniają się towarami przybywającymi z każdego zakątka sieci handlowej."
 STATIC_MODIFIER_NAME_ven_san_marco_square: "Plac Świętego Marka"
 STATIC_MODIFIER_DESC_ven_san_marco_square: "Odnowiony Plac Świętego Marka ukazuje każdemu odwiedzającemu prestiż Republiki."
 STATIC_MODIFIER_NAME_ven_canal_efficiency: "Efektywność kanałów"
 STATIC_MODIFIER_DESC_ven_canal_efficiency: "Łodzie ślizgają się teraz płynniej przez ulepszone kanały niż kiedykolwiek."
 STATIC_MODIFIER_NAME_ven_fondaco_network: "Fondaco"
 STATIC_MODIFIER_DESC_ven_fondaco_network: "Zagraniczni kupcy, zbierający się w domach handlowych, przynoszą nowe życie rynkom Republiki."
 STATIC_MODIFIER_NAME_ven_bridge_of_wealth_bonus: "Most bogactwa"
 STATIC_MODIFIER_DESC_ven_bridge_of_wealth_bonus: "Karawany przekraczające most przez lagunę niosą swe towary prawie bez zatrzymywania się na komorach celnych po drodze."
 STATIC_MODIFIER_NAME_ven_doges_authority: "Władza doży"
 STATIC_MODIFIER_DESC_ven_doges_authority: "Wspaniałość Pałacu Dożów nadaje wagę każdemu słowu doży."
 STATIC_MODIFIER_NAME_ven_arsenal_production: "Produkcja Arsenale"
 STATIC_MODIFIER_DESC_ven_arsenal_production: "W rozbudowanym Arsenale rzemieślnicy pracują dzień i noc, montując galery."
 STATIC_MODIFIER_NAME_ven_marciana_biblioteca: "Biblioteka Marciana"
 STATIC_MODIFIER_DESC_ven_marciana_biblioteca: "Biblioteka Marciana, zaprojektowana przez Sansovina (rozpoczęta w 1537 roku), jest skarbnicą starożytnych rękopisów, opartą na zbiorze Petrarki. Greckie rękopisy przyniesione przez uczonych, którzy uciekli po upadku Konstantynopola w 1453 roku, zgromadziły się w Wenecji i znacznie przyczyniły się do rozprzestrzenienia renesansu na Zachód."
 STATIC_MODIFIER_NAME_ven_lombardy_dominance: "Zwierzchność nad Lombardią"
 STATIC_MODIFIER_DESC_ven_lombardy_dominance: "Warsztaty i rzemieślnicy Mediolanu produkują pod przewodnictwem Republiki więcej."
 STATIC_MODIFIER_NAME_ven_genoese_settlement: "Rozrachunek z Genuą"
 STATIC_MODIFIER_DESC_ven_genoese_settlement: "Z zakończoną rywalizacją z Genuą kupcy Republiki zyskują coraz więcej doświadczenia w negocjacjach i handlu."
 STATIC_MODIFIER_NAME_ven_queen_of_canals: "Królowa kanałów"
 STATIC_MODIFIER_DESC_ven_queen_of_canals: "Statki wypełniające kanały i pałace ocieniające ich brzegi zachwycają podróżnych z całego świata."
 STATIC_MODIFIER_NAME_ven_ferrara_secured: "Ferrara zabezpieczona"
 STATIC_MODIFIER_DESC_ven_ferrara_secured: "Z zabezpieczoną Ferrarą napięcie z Państwem Kościelnym nie wstrząsa już Republiką, jak niegdyś."
 STATIC_MODIFIER_NAME_ven_alpine_frontier: "Granica alpejska"
 STATIC_MODIFIER_DESC_ven_alpine_frontier: "Karawany przekraczające przełęcze alpejskie nie lękają się już niebezpieczeństw szlaku."
 STATIC_MODIFIER_NAME_ven_papal_tension: "Napięcie z Państwem Kościelnym"
 STATIC_MODIFIER_DESC_ven_papal_tension: "Napięcie z papiestwem trwa, lecz kupcy Republiki kontynuują swój handel niewzruszenie."
 STATIC_MODIFIER_NAME_ven_alpine_trade_routes: "Szlaki handlowe transalpejskie"
 STATIC_MODIFIER_DESC_ven_alpine_trade_routes: "Karawany przekraczające przełęcze alpejskie nie lękają się już stromych dróg górskich, niosąc swe towary."
 STATIC_MODIFIER_NAME_ven_secular_authority: "Władza świecka"
 STATIC_MODIFIER_DESC_ven_secular_authority: "Choć państwo katolickie, Wenecja nie wahała się poddać władzy kościelnej pod kontrolę państwa. Republika nawet ingerowała w mianowanie duchowieństwa, zarządzanie majątkiem kościelnym i dyscyplinę klasztorów, negocjując z papieżem bez lęku przed ekskomuniką. Ten sekularyzm, niemal „święte bluźnierstwo”, nadawał Wenecji swoistą elastyczność."
 STATIC_MODIFIER_NAME_ven_cambrai_survived: "Liga Kambrejska przetrwana"
 STATIC_MODIFIER_DESC_ven_cambrai_survived: "Przetrwawszy oblężenie, żołnierze i dyplomaci Republiki ukazują odrodzoną pewność siebie."
 STATIC_MODIFIER_NAME_ven_terraferma_zenith: "Szczyt Terraferma"
 STATIC_MODIFIER_DESC_ven_terraferma_zenith: "Rozległe prowincje Północnych Włoch podążają teraz za wolą Republiki."
 STATIC_MODIFIER_NAME_ven_italian_unity_unlock: "Ranga centrum Włoch"
 STATIC_MODIFIER_DESC_ven_italian_unity_unlock: "Żadne państwo półwyspu włoskiego nie ośmiela się działać, nie rozważywszy najpierw stanowiska Wenecji."
 STATIC_MODIFIER_NAME_ven_unified_fleet: "Zjednoczona flota"
 STATIC_MODIFIER_DESC_ven_unified_fleet: "Zjednoczona flota gotowa wyruszyć w morze w każdej chwili."
 STATIC_MODIFIER_NAME_ven_black_sea_protection: "Ochrona handlu czarnomorskiego"
 STATIC_MODIFIER_DESC_ven_black_sea_protection: "Eskortowane konwoje żeglują pewnie z portu Negroponte ku Morzu Czarnemu."
 STATIC_MODIFIER_NAME_ven_adriatic_secured: "Adriatyk zabezpieczony"
 STATIC_MODIFIER_DESC_ven_adriatic_secured: "Porty Zary i Poli służą teraz jako bezpieczne schronienia dla statków Republiki."
 STATIC_MODIFIER_NAME_ven_zadar_trade_hub: "Placówka handlowa Zadar"
 STATIC_MODIFIER_DESC_ven_zadar_trade_hub: "Przy przebudowanym porcie Zadaru statki handlowe, przecinające Adriatyk, rozładowują swój ładunek jeden po drugim."
 STATIC_MODIFIER_NAME_ven_genoese_rivalry_won: "Zwycięstwo nad rywalizacją genueńską"
 STATIC_MODIFIER_DESC_ven_genoese_rivalry_won: "Sztandar genueński nie powiewa już nad placówkami handlu czarnomorskiego."
 STATIC_MODIFIER_NAME_ven_aegean_dominance: "Zwierzchność nad Morzem Egejskim"
 STATIC_MODIFIER_DESC_ven_aegean_dominance: "Statki pod flagą Republiki nieustannie przechodzą przez porty Krety i Naksos."
 STATIC_MODIFIER_NAME_ven_dalmatia_subdued: "Dalmacja podporządkowana"
 STATIC_MODIFIER_DESC_ven_dalmatia_subdued: "Wybrzeże dalmatyńskie figuruje teraz na każdej mapie jako posiadłość Republiki."
 STATIC_MODIFIER_NAME_ven_eastern_trade_dominance: "Zwierzchność w handlu wschodnim"
 STATIC_MODIFIER_DESC_ven_eastern_trade_dominance: "Przyprawy i jedwab ze Wschodu teraz bez trudu przechodzą przez rynki Wenecji."
 STATIC_MODIFIER_NAME_ven_greek_bridgehead_secured: "Grecki przyczółek zabezpieczony"
 STATIC_MODIFIER_DESC_ven_greek_bridgehead_secured: "Z Krety i Modonu okręty Republiki posuwają się dalej na wschód w greckie morza."
 STATIC_MODIFIER_NAME_ven_pearl_prosperity: "Dobrobyt perły"
 STATIC_MODIFIER_DESC_ven_pearl_prosperity: "Rynki Raguzy znów rozbrzmiewają głosami kupców, wróciwszy do dawnej siły."
 STATIC_MODIFIER_NAME_ven_corfu_garrison: "Garnizon Korfu"
 STATIC_MODIFIER_DESC_ven_corfu_garrison: "Garnizon na murach Korfu cicho stoi na straży wrót Adriatyku."
 STATIC_MODIFIER_NAME_ven_cyprus_secured: "Cypr zabezpieczony"
 STATIC_MODIFIER_DESC_ven_cyprus_secured: "Cukier i bawełna z portów Cypru napełniają magazyny Republiki."
 STATIC_MODIFIER_NAME_ven_latin_empire_foundation: "Założenie Cesarstwa Łacińskiego"
 STATIC_MODIFIER_DESC_ven_latin_empire_foundation: "Znów sztandar Łacinników powiewa nad pałacami Konstantynopola. Pod władzą Republiki ludzie wielu wiar żyją w cichym pokoju."
 STATIC_MODIFIER_NAME_ven_adriatic_queen: "Królowa Adriatyku"
 STATIC_MODIFIER_DESC_ven_adriatic_queen: "Jako władczyni Adriatyku Republika zyskuje uprawnienie do mianowania kolejnego admirała, by dowodził jej flotami."
 STATIC_MODIFIER_NAME_ven_diplomatic_mastery: "Mistrzostwo dyplomacji"
 STATIC_MODIFIER_DESC_ven_diplomatic_mastery: "Posłowie Republiki zapewniają korzystne warunki, nigdy nie wyciągając miecza. Wrogość wobec Republiki za granicą słabnie, a jej negocjatorzy wykorzystują swą przewagę w wojnie z wielkim mistrzostwem."
 STATIC_MODIFIER_NAME_ven_latin_empire_unlock: "Cesarstwo Łacińskie"
 STATIC_MODIFIER_DESC_ven_latin_empire_unlock: "Szlaki handlowe Morza Śródziemnego, spichlerze kontynentu, bogactwo Wschodu — wszystko to jest teraz w rękach Wenecji."
 ven_italian_unity_unlock_tt: "Wenecja dopełniła założenia jedności włoskiej. La Serenissima jednoczy półwysep włoski od Adriatyku po Alpy — po raz pierwszy od czasów starożytnego Rzymu całe Włochy rządzone są pod jednym sztandarem."
 ven_latin_empire_unlock_tt: "Cesarstwo Łacińskie (LAT), ze stolicą Konstantynopolem, założone jako państwo wasalne pod ochroną wenecką."
