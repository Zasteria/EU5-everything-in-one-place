l_polish:
 pol_jagiellonian_dynasty_mission_pack: "Blask dynastii Jagiellonów"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION:0 "W 1337 roku Królestwem Polskim rządzi Kazimierz III Wielki. Jego następcą zostanie Ludwik I Węgierski (z domu Andegawenów), a córka Ludwika, Jadwiga, wyjdzie za mąż za wielkiego księcia litewskiego Jagiełłę, tworząc polsko-litewską unię personalną. Konflikt z Zakonem Krzyżackim na północy, unia z Węgrami na południu, ekspansja na wschód przez Litwę i ambicje wobec Czech — urzeczywistnij to wszystko i zbuduj największą republikę szlachecką Europy Środkowo-Wschodniej."
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION:0 "Jako Polska rozszerz się we wszystkich kierunkach — reforma wewnętrzna, wschód, północ, południe i zachód — i urzeczywistnij polski złoty wiek."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by urzeczywistnić polski złoty wiek."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS:0 "Od Kazimierza Wielkiego do złotego wieku Jagiellonów — zbuduj republikę szlachecką!"
 pol_kingdom_of_poland: "Królestwo Polskie"
 pol_kingdom_of_poland_desc: "Kazimierz III — „Wielki” — wstąpił na tron w 1333 roku i zjednoczył rozdrobnioną Polskę. „Zastał Polskę drewnianą, a zostawił murowaną”, jak mówiły późniejsze pokolenia. Sprzyjał reformie prawnej, budowie miast i ochronie Żydów, a jego panowanie uważane jest za szczyt średniowiecznego polskiego dobrobytu. Podnieś legitymizację i stabilność i umocnij fundamenty królestwa."
 pol_integrate_mazovia: "Włącz Mazowsze"
 pol_integrate_mazovia_desc: "Księstwo Mazowieckie rządzone jest przez młodszą gałąź dynastii Piastów, położone na żyznej nizinie w sercu Polski. Zabezpieczenie Warszawy i Lublina i całkowite włączenie tej bogatej równiny do Królestwa Polskiego ustanawia polityczny ośrodek Polski Centralnej. Zdobądź wcześniej to, co historia da dopiero w 1526 roku."
 pol_great_sejm: "Wielki Sejm"
 pol_great_sejm_desc: "Sejm polski — parlament — rozwijał się od XIII wieku. To zgromadzenie stanowe magnatów, szlachty i duchowieństwa ustanowiło w XV-XVI wieku pojęcie „Złotej Wolności” (Złota Wolność) i stopniowo przekształciło Polskę w republikę szlachecką. Wzmocnij sejm i zachowaj równowagę między władzą królewską a prawami szlacheckimi."
 pol_krakow_renaissance: "Renesans w Krakowie"
 pol_krakow_renaissance_desc: "Kraków jest stolicą Królestwa Polskiego, a Uniwersytet Jagielloński — alma mater Kopernika — najlepszą akademią Europy Środkowo-Wschodniej. Włoski renesans dociera do Krakowa, a Wawel jest przebudowywany w stylu renesansowym. Rozwiń uniwersytet i pielęgnuj Kraków jako duchowe centrum Europy Środkowo-Wschodniej."
 pol_jagiellonian_university: "Rozkwit Uniwersytetu Jagiellońskiego"
 pol_jagiellonian_university_desc: "Uniwersytet Jagielloński, założony przez Kazimierza III w 1364 roku i odnowiony przez królową Jadwigę w 1400 roku, wydał Mikołaja Kopernika (1473-1543) i wielu innych wielkich umysłów. Rozszerzenie uniwersytetów po całej Polsce rozprzestrzenia światło nauki po całym królestwie."
 pol_polish_golden_age: "Polski złoty wiek"
 pol_polish_golden_age_desc: "Pod dynastią Jagiellonów Polska przeżyła w XV-XVI wieku „Złoty Wiek” (Złoty Wiek). Heliocentryzm Kopernika, poezja Kochanowskiego, sztuka Krakowa — Polska była nie tylko wielką potęgą, lecz także kulturalną awangardą. Dowiedź tego złotego wieku rozległym terytorium, bogatym dochodem i wysokim prestiżem."
 pol_jadwiga_union: "Małżeństwo Jadwigi i Jagiełły"
 pol_jadwiga_union_desc: "Unia w Krewie z 1385 roku umówiła małżeństwo polskiej królowej Jadwigi z wielkim księciem litewskim Jagiełłą (Władysławem II Jagiełłą). Jagiełło przyjął chrześcijaństwo i zgłosił roszczenie do tytułu króla Polski w zamian za katolizację Litwy. To małżeństwo było początkiem polsko-litewskiego państwa unijnego — i zorzą dynastii Jagiellonów, której przeznaczone było trwać ponad dwa wieki."
 pol_develop_ruthenia: "Rozwiń Ruś"
 pol_control_kyiv: "Panowanie nad Kijowem"
 pol_control_kyiv_desc: "Kijów był stolicą Rusi Kijowskiej, kolebki cywilizacji słowiańskiej. Po mongolskim spustoszeniu w 1240 roku miasto wpadło pod panowanie litewskie. Zdobycie Kijowa ustanawia kontrolę nad całym dorzeczem Dniepru i otwiera drogę do Morza Czarnego."
 pol_push_east: "Posunięcie na wschód"
 pol_push_east_desc: "Mińsk jest sercem Litwy; Smoleńsk jest ważnym węzłem świata wschodniosłowiańskiego. Z wyniesieniem Wielkiego Księstwa Moskiewskiego zabezpieczenie tych miast uczyni unię polsko-litewską dominującą potęgą świata wschodniosłowiańskiego. Historyczny spór o Smoleńsk, który prowadził Iwan III — tym razem rozstrzyga się na korzyść Polski."
 pol_eastern_empire: "Imperium wschodnie"
 pol_eastern_empire_desc: "Polsko-Litewska republika szlachecka u swego szczytu (około 1618 roku) stała się największym państwem Europy. Od Bałtyku po step pontyjski (Morze Czarne) cały świat wschodniosłowiański zjednoczył się pod polską flagą. Wznieś wielkie imperium wschodnie, którego równie boją się Rosja, Osmanowie i Habsburgowie."
 pol_prussian_confederation: "Związek Pruski i Zakon Krzyżacki"
 pol_prussian_confederation_desc: "Zakon Krzyżacki, który podbił pogan bałtyckich w XIII wieku, stał się zaprzysięgłym wrogiem Polski. Pod Grunwaldem w 1410 roku wojsko polsko-litewskie rozgromiło go doszczętnie. Ze wsparciem Związku Pruskiego — pruskich mieszczan, szukających polskiej ochrony — rozbij Zakon Krzyżacki i zabezpiecz Polsce dostęp do Bałtyku."
 pol_gdansk_port: "Port Gdańsk"
 pol_gdansk_port_desc: "Gdańsk nazywany jest „bramą Polski” — najważniejszym portem Bałtyku. Położony u ujścia Wisły, to miasto było wiodącym węzłem Hanzy i kluczem do polskiego eksportu zboża. Zabezpieczony dla Polski przez Drugi Pokój Toruński (1466), Gdańsk przez dwa stulecia służył jako serce polskiej gospodarki."
 pol_livonian_expansion: "Ekspansja na Inflanty"
 pol_livonian_expansion_desc: "Inflanty (dzisiejsza Łotwa i Estonia), niegdyś rządzone przez Zakon Kawalerów Mieczowych, stały się w XVI wieku areną sporu między Rosją, Szwecją, Danią i Polską. Zdobycie Rygi i Rewla (Tallina) przywodzi cały Bałtyk pod polską kontrolę."
 pol_master_of_the_north: "Pan Północy"
 pol_master_of_the_north_desc: "Królewiec (dzisiejszy Kaliningrad), niegdyś bastion Zakonu Krzyżackiego, niesie teraz polski sztandar. Z potężną flotą, panującą nad całym Bałtykiem, Polska trzyma Skandynawię, Hanzę i Holendrów w ręku — najwyższy pan Północy."
 pol_hungarian_union: "Unia personalna z Węgrami"
 pol_hungarian_union_desc: "Gdy Kazimierz III zmarł bez dziedzica w 1370 roku, jego siostrzeniec Ludwik I Węgierski (z domu Andegawenów) odziedziczył tron polski. Było to początkiem polsko-węgierskiej unii personalnej. Dwa wielkie królestwa, zjednoczone pod jednym królem — równowaga sił w Europie Środkowo-Wschodniej zmienia się gruntownie."
 pol_moldavia_vassal: "Podporządkuj Mołdawię"
 pol_moldavia_vassal_desc: "Księstwo Mołdawskie (Mołdowa) jest państwem buforowym, spornym przez Polskę, Węgry i Osmanów. Stefan Wielki (panował 1457-1504) zachowywał nominalne zwierzchnictwo polskie, utrzymując faktyczną niezależność. Przywiedź to strategiczne księstwo mocno pod polską ochronę i zdobądź wrota do Morza Czarnego."
 pol_wallachia_control: "Panowanie nad Wołoszczyzną"
 pol_wallachia_control_desc: "Wołoszczyzna, księstwo na północ od Dunaju, jest przednią linią przeciw Imperium Osmańskiemu. Vlad II (ojciec Vlada Palownika) służył Węgrom jako członek Zakonu Smoka. Przywiedzenie Wołoszczyzny pod ochronę unii polsko-węgierskiej ustanawia wpływ na Półwyspie Bałkańskim."
 pol_battle_of_grunwald: "Duch Grunwaldu"
 pol_battle_of_grunwald_desc: "15 lipca 1410 roku wojsko polsko-litewskie doszczętnie rozgromiło Zakon Krzyżacki na polach Grunwaldu (Tannenbergu). Wielki mistrz Ulrich von Jungingen poległ na polu, a Polska umocniła swą reputację „obrończyni chrześcijaństwa”. Dowiedź tego ducha teraz ponownie w wojnie przeciw siłom islamu."
 pol_shield_of_christendom: "Tarcza chrześcijaństwa"
 pol_shield_of_christendom_desc: "Od czasów polityki chrystianizacyjnej Jadwigi Polska stoi na linii frontu wschodnioeuropejskiego katolicyzmu. Po ostatecznym wypędzeniu Imperium Osmańskiego papież, Wenecja i Habsburgowie jednakowo uznają, że Polska jest prawdziwym Antemurale Christianitatis — przedmurzem chrześcijaństwa."
 pol_silesia_integration: "Włączenie Śląska"
 pol_silesia_integration_desc: "Śląsk (Śląsk) jest kolebką dynastii Piastów, lecz wpadł pod kontrolę czeską i habsburską w XIV wieku. Odzyskanie tego bogatego regionu przemysłowego i handlowego wokół Breslau (Wrocławia) jest jednym z najważniejszych narodowych i gospodarczych przykazań Polski."
 pol_bohemian_claim: "Korona Czeska"
 pol_bohemian_claim_desc: "Dynastia Jagiellonów posiada dziedziczne prawa do tronów czeskiego i węgierskiego. Władysław II (Jagiellończyk) został królem Czech w 1471 roku, a następnie królem Węgier w 1490 roku. Zdobycie korony czeskiej w Pradze tworzy polsko-czesko-węgierską potrójną monarchię."
 pol_hre_influence: "Wpływ na Święte Cesarstwo Rzymskie"
 pol_hre_influence_desc: "Król Polski, dzierżący również koronę czeską, może stać się elektorem Świętego Cesarstwa Rzymskiego. Poprzez równowagę dyplomacji z Habsburgami i rozszerzenie wpływu na książąt niemieckich Polska staje się politycznym centrum Europy Środkowej."
 pol_central_european_power: "Potęga środkowoeuropejska"
 pol_central_european_power_desc: "Rozległe królestwo, obejmujące Polskę, Litwę, Czechy i Węgry, z bogatym dochodem — Polska wystąpiła jako największa potęga Europy Środkowo-Wschodniej. Otoczona trzema wielkimi potęgami Świętym Cesarstwem Rzymskim, Imperium Osmańskim i Wielkim Księstwem Moskiewskim, Polska jaśnieje własnym blaskiem."
 pol_grand_commonwealth: "Wielka republika szlachecka"
 pol_grand_commonwealth_desc: "Republika szlachecka, łącząca Polskę, Litwę, Czechy i Węgry — to państwo o swoistym systemie politycznym, godzącym wolność szlachecką z władzą królewską, znane było w XVI-XVII wieku jako „Rzeczpospolita Wielu Narodów” (Rzeczpospolita). Ten niezwykły eksperyment polityczny, obejmujący wiele narodów, wiar i języków, osiągnął swój szczyt."
 pol_events.10.t: "Małżeństwo Jadwigi i Jagiełły"
 pol_events.10.d: "Unia w Krewie przyniosła owoc: polska królowa Jadwiga i wielki książę litewski Jagiełło wzięli ślub. Jagiełło przyjął chrzest chrześcijański i przyjął jako król Polski imię „Władysław II”. Litwa wchodzi z Polską w unię personalną, a największe zjednoczenie polityczne Europy Wschodniej się rozpoczęło. To małżeństwo jest czymś więcej niż politycznym rachunkiem — to historyczny moment, gdy dwa narody, dwie kultury, dwa języki jednoczą się pod jedną dynastią. „Polska i Litwa jednością na wieki”, ogłosiła Unia w Krewie."
 pol_events.10.a: "Niech żyje nowa dynastia Jagiellonów!"
 pol_events.20.t: "Polsko-węgierska unia personalna"
 pol_events.20.d: "Polska i Węgry utworzyły unię personalną. Dwa wielkie królestwa, zjednoczone pod jednym królem — to dyplomatyczny triumf domu Andegawenów i wydarzenie, przekształcające historię Europy Środkowo-Wschodniej. Polscy i węgierscy rycerze stoją teraz ramię w ramię. Od Bałtyku na północy po Adriatyk na południu rozległe królestwo pod jedną dynastią nabiera kształtu. Dla Imperium Osmańskiego ta unia jest największym zagrożeniem, z jakim się mierzy."
 pol_events.20.a: "Polska i Węgry jednością!"
 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "Dziedzictwo Piastów"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "Tysiącletnie dziedzictwo dynastii Piastów — pierwszego polskiego domu królewskiego — wspiera legitymizację korony polskiej."
 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "Włączenie Mazowsza"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "Mazowsze wokół Warszawy w pełni włączone do Polski. Ta żyzna nizina działa jako serce królestwa."
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "Wielki Sejm ustanowiony"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "Sejm Polski ustanowiony instytucją Złotej Wolności. Swoisty system polityczny, godzący autonomię szlachecką z władzą królewską, rodzi się."
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "Kulturalny rozkwit Krakowa"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "Kraków wokół Wawelu kąpie się w świetle renesansu. Jako największe miasto akademickie Europy Środkowo-Wschodniej gromadzą się tu uczeni i artyści z całej Europy."
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "Uniwersytet Jagielloński prosperuje"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "Uniwersytet Jagielloński — alma mater Kopernika — prosperuje jako najlepsza akademia Europy Środkowo-Wschodniej. Wiedza i sztuka rozprzestrzeniają się po całej Polsce."
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "Polski złoty wiek"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "Heliocentryzm Kopernika, poezja Kochanowskiego, architektura Krakowa — pod każdym względem Polska cieszy się swym złotym wiekiem."
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "Więzy unii Jadwigi i Jagiełły"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "Polsko-litewska unia personalna ustanowiona. Rozległe państwo, rozciągające się od Bałtyku po Morze Czarne, nabiera kształtu."
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "Siła sojuszu polsko-węgierskiego"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "Sztandary wojsk królewskich, zebranych znad Wisły i Dunaju, stoją obok siebie na wzgórzach nad granicą osmańską."
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "Rozwój Rusi"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "Pola uprawne Rusi Czerwonej w pełni rozwinięte. Czarnomorski szlak handlowy przez Lwów ożywiony."
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "Brama Kijowa"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "Kijów, kolebka cywilizacji słowiańskiej, przeszedł pod polską kontrolę. Wpływ na całe dorzecze Dniepru ustanowiony."
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "Posunięcie na wschód"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "Z zabezpieczonymi Mińskiem i Smoleńskiem cały świat wschodniosłowiański wchodzi w polską sferę wpływów."
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "Imperium wschodnie"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "Polskie imperium, rozciągające się od Bałtyku po Morze Czarne, ukończone. Wpisane w historię największym państwem Europy Wschodniej."
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "Zwycięstwo nad Zakonem Krzyżackim"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "Duch Grunwaldu inspiruje polską armię. Pamięć zwycięstwa nad krzyżowcami chrześcijaństwa staje się dumą wojska."
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "Miasto handlowe Gdańsk"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "Gdańsk rozwinął się w największy port eksportu zboża Bałtyku. Polskie zboże, płynące Wisłą, karmi całą Europę."
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "Chwała Grunwaldu"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "Duch Grunwaldu inspiruje polską armię. W walce przeciw niewiernym Polska zyskuje coraz większą chwałę."
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "Tarcza chrześcijaństwa"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "Polska wpisana w historię jako Antemurale Christianitatis — przedmurze chrześcijaństwa."
 STATIC_MODIFIER_NAME_pol_silesia_mod: "Włączenie Śląska"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "Orli sztandar powrócił do zamków Śląska, ojczyzny Piastów, a dym jego kopalń i warsztatów znów unosi się w polskie niebo."
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "Korona Czeska"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "Dynastia Jagiellonów zdobyła koronę czeską. Czeski dwór królewski w Pradze staje się sceną polskiej dyplomacji."
 STATIC_MODIFIER_NAME_pol_central_power_mod: "Potęga środkowoeuropejska"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "Polska wystąpiła jako największa potęga Europy Środkowo-Wschodniej. Nawet wśród trzech wielkich potęg jaśnieje własnym blaskiem."
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "Wielka republika szlachecka"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "Rzeczpospolita ukończona — największy eksperyment polityczny Europy, obejmujący wiele narodów, wiar i języków."
 pol_support_merchants: "Wsparcie kupiectwa"
 pol_support_merchants_desc: "Mieszczanie miejscy Polski są ważną podporą finansów królewskich. Poprzez wsparcie sieci handlowej wokół Sukiennic (Sukiennice) w Krakowie poprawiają się zarówno lojalność mieszczan, jak i dochody podatkowe. Zadowól kupiectwo i połóż fundament pod Polskę jako naród handlowy."
 pol_black_sea_access: "Dostęp do Morza Czarnego"
 pol_black_sea_access_desc: "Zstępując Dnieprem, Polska może dotrzeć do Morza Czarnego. Kontrola nad półwyspem Krymskim i północnym brzegiem Pontu Euksyńskiego (Morza Czarnego) oznacza zabezpieczenie szlaku handlowego na Wschód, z pominięciem osmańsko zarządzanego Konstantynopola. Zbuduj flotę czarnomorską i rozszerz panowanie morskie."
 pol_breadbasket_of_europe: "Spichlerz Europy"
 pol_breadbasket_of_europe_desc: "Pod koniec XVI wieku Polska dostarczała większość zboża konsumowanego przez Europę. Kupcy Amsterdamu, Lizbony i Sewilli nie mogli prowadzić interesów bez polskiej pszenicy i żyta. Polska wpisana w historię „Spichlerzem Europy”."
 pol_nieszawa_privileges: "Przywileje nieszawskie"
 pol_nieszawa_privileges_desc: "W 1454 roku Kazimierz IV Jagiellończyk potrzebował pospolitego ruszenia szlacheckiego do wojny przeciw Zakonowi Krzyżackiemu — i zapłacił za to Statutem Nieszawskim, nadającym szlachcie szerokie przywileje. Odtąd król nie mógł ani wprowadzać nowych podatków, ani wydawać nowych praw bez zgody szlachty. Stało się to kamieniem węgielnym polskiej „Złotej Wolności”."
 pol_develop_krakow: "Rozwiń Kraków"
 pol_develop_krakow_desc: "Polska stolica Kraków wyrosła wokół Wawelu. Pełne rozwinięcie tego miasta — podniesienie go do rangi miasta — ustanawia jego rangę największego miasta handlowego Europy Środkowo-Wschodniej."
 pol_baltic_fleet: "Flota bałtycka"
 pol_baltic_fleet_desc: "Ze zabezpieczonym Gdańskiem Polska zapewniła dostęp do Bałtyku. Nadszedł czas, by zbudować flotę i rywalizować o zwierzchność nad Bałtykiem. Podczas gdy Szwecja, Dania i Zakon Kawalerów Mieczowych wszyscy rywalizują o te wody, polska flota staje się najnowszą — i największą — potęgą Bałtyku."
 pol_sea_to_sea: "Od morza do morza"
 pol_sea_to_sea_desc: "Panowanie nad Inflantami na morzu i zdobycie Kijowa i Smoleńska — unia polsko-litewska rozciąga się teraz od Bałtyku po Morze Czarne. Od Rewla na północy po Kijów na południu największe nieprzerwane imperium Europy Wschodniej ukończone. Wielki hetman Jan Zamoyski powie później: „Ta Polska to naród, który zbudował sam Bóg”."
 pol_challenge_habsburg: "Rzuć wyzwanie Habsburgom"
 pol_challenge_habsburg_desc: "W XVI wieku Habsburgowie rządzili Świętym Cesarstwem Rzymskim, Hiszpanią, Czechami i Węgrami — największą dynastią Europy. Lecz jako król Czech i Polski, monarcha jagielloński może rzucić wyzwanie tej hegemonii. Zajmij Wiedeń lub przywiedź Habsburgów pod polski sztandar."
 pol_codify_law: "Skodyfikuj prawo"
 pol_codify_law_desc: "Statuty Wiślickie Kazimierza Wielkiego z 1346/47 roku były pierwszą systematyczną kodyfikacją prawa polskiego. Opierając się na prowadzeniu akt i infrastrukturze administracyjnej skupionej na kantorach, pełniejsza kodyfikacja prawa polskiego znacznie poprawia efektywność administracyjną."
 pol_develop_warsaw: "Rozwiń Warszawę"
 pol_develop_warsaw_desc: "Warszawa wyrosła centrum Księstwa Mazowieckiego. Położona w centrum Polski, stanie się stolicą Rzeczypospolitej Obojga Narodów po Unii Lubelskiej z 1569 roku. Podniesienie jej do rangi miasta ustanawia podstawę administracyjną centrum królestwa."
 pol_amber_road: "Szlak bursztynowy"
 pol_amber_road_desc: "Bałtycki bursztyn — „złoto Północy” — ceniony od czasów starożytnych. Gdańsk był głównym portem wywozu bałtyckiego bursztynu, a eksport do Włoch i Morza Śródziemnego przynosił ogromne bogactwo. Ożyw ten starożytny szlak handlowy i podnieś rangę gospodarczą Polski."
 pol_poznan_commerce: "Handel Poznania"
 pol_poznan_commerce_desc: "Poznań jest miastem handlowym Zachodniej Polski, węzłem handlu z Brandenburgią i Śląskiem. To miasto, mieszczące pierwszą polską stolicę biskupią, było stale centrum handlowym Zachodniej Polski od czasów średniowiecza. Podnieś je do rangi miasta i w pełni uwolnij jego potencjał handlowy."
 pol_vilnius_capital: "Rozwiń Wilno"
 pol_vilnius_capital_desc: "Wilno szybko wyrosło w XIV wieku stolicą Wielkiego Księstwa Litewskiego. Zbudowane przez wielkiego księcia Giedymina, to miasto stało się domem dla wielu Żydów, katolików i prawosławnych chrześcijan, żyjących obok siebie — później znane jako „Jerozolima Północy”. Podnieś je do rangi miasta i rozwiń centrum litewskiej administracji."
 pol_russia_rivalry: "Rywalizacja z Moskwą"
 pol_russia_rivalry_desc: "Iwan III Wielki zaciekle spierał się z Polską-Litwą o Smoleńsk. Wojny smoleńskie między Moskwą a Polską-Litwą trwały przez cały XVI wiek — losowy spór. Ogłoś Moskwę rywalem i ustanów wschodnią hegemonię. Przeciw roszczeniu Moskwy, by być „strażnikiem Świętej Rusi”, stoi Polska jako „strażniczka wolności”."
 pol_malbork_castle: "Zamek Malbork"
 pol_malbork_castle_desc: "Malbork został zbudowany jako główna siedziba Zakonu Krzyżackiego — największy średniowieczny zamek Europy. Przekazany Polsce przez Drugi Pokój Toruński (1457), ta potężna twierdza staje się doskonałym punktem obronnym."
 pol_gniezno_church: "Arcybiskupstwo gnieźnieńskie"
 pol_gniezno_church_desc: "Gniezno jest historyczną stolicą Polski i siedzibą jej pierwszego arcybiskupstwa. Zbudowana około 987 roku katedra w Gnieźnie przechowuje relikwie Świętego Wojciecha i od tego czasu służy jako serce polskiej wiary katolickiej. Umocnij polski Kościół i urzeczywistnij misję obrońcy wschodnioeuropejskiego katolicyzmu."
 pol_hanseatic_ties: "Więzy z Hanzą"
 pol_hanseatic_ties_desc: "Liga Hanzeatycka panowała w handlu Bałtyku i Morza Północnego. Miasta polskie, takie jak Gdańsk, Toruń i Elbląg, miały ścisłe więzy hanzeatyckie. Wznieś rozległą sieć handlową wokół tych miast, a Polska wystąpi jako wiodąca potęga handlowa Bałtyku."
 pol_transylvania_influence: "Wpływ na Siedmiogród"
 pol_transylvania_influence_desc: "Siedmiogród jest bogatym regionem na granicy Królestwa Węgier i polskiej unii personalnej. Ustanowienie wpływu na Siedmiogród — przez unię węgierską lub bezpośrednio — stabilizuje południowo-wschodnią granicę Polski."
 pol_subjugate_serbia: "Podporządkuj Serbię"
 pol_subjugate_serbia_desc: "Królestwo Serbii stało się wasalem osmańskim po Kosowym Polu (1389). Jako część południowej ekspansji unii polsko-węgierskiej zabezpieczenie Belgradu lub uczynienie Serbii wasalem ustanawia solidny przyczółek na północnych Bałkanach."
 pol_varna_revenge: "Zemsta za Warnę"
 pol_varna_revenge_desc: "W bitwie pod Warną w 1444 roku polsko-węgierskie wojsko krzyżowe zostało zmiażdżone przez Osmanów, a król polski Władysław III poległ na polu. Nadszedł wreszcie czas, by pomścić to upokorzenie. Zajmij Warnę, walcząc z narodem muzułmańskim, a ta tragedia zostanie przepisana na zwycięstwo."
 pol_upper_silesia_mines: "Kopalnie Górnego Śląska"
 pol_upper_silesia_mines_desc: "Górny Śląsk znany jest z bogatych kopalni srebra, cynku i ołowiu. Pełny rozwój okręgów górniczych wokół Cieszyna i Gliwic ustanawia podstawę przemysłową Polski. Zdobądź wcześniej bogactwa naturalne tego regionu — później stał się centrum Rewolucji Przemysłowej."
 pol_upper_silesia_mines_unlock_tt: "Decyzja „Rozwój kopalń Górnego Śląska” jest teraz dostępna."
 pol_silesia_mining_decision.title: "Rozwój kopalń Górnego Śląska"
 pol_silesia_mining_decision.desc: "Rejony górnicze Śląska są rozległe, a Korona nie może otworzyć ich wszystkich naraz. Każda inwestycja w szyby, huty i drogi wprowadza kolejny rejon do pełnej produkcji, a dzieło można ponawiać co dziesięć lat."
 pol_silesia_mining_decision.a: "Zainwestować w nowy rejon górniczy."
 pol_pomeranian_coast: "Wybrzeże pomorskie"
 pol_pomeranian_coast_desc: "Pomorze (Pomorze) jest nadbałtyckim regionem wokół Szczecina. Odzyskanie tego historycznie należącego do królestwa polskiego regionu daje Polsce pełną kontrolę nad wybrzeżem bałtyckim."
 pol_prague_university: "Uniwersytet Praski"
 pol_prague_university_desc: "Uniwersytet Karola w Pradze (założony w 1348 roku) jest najstarszym uniwersytetem Europy Środkowo-Wschodniej. Niegdyś siedlisko reformacji husyckiej, ta akademia może być teraz odbudowana i rozwinięta pod polskimi rządami — a Praga znów stanie się centrum nauki katolickiej."
 pol_catholicism_of_lithuania: "Katolizacja Litwy"
 pol_catholicism_of_lithuania_desc: "Gdy Jagiełło został królem Polski, przysiągł nawrócić Litwę na katolicyzm. Wznieś kościoły i klasztory po całej Litwie wokół Wilna i przekształć tę niegdyś pogańską ziemię w całkowicie katolickie państwo. Bez tego nawrócenia nie może być prawdziwej jedności unii polsko-litewskiej. „Litwa, odrodzona w wierze”."
 pol_royal_road: "Droga Królewska"
 pol_royal_road_desc: "„Droga Królewska” (Droga Królewska), prowadząca z Krakowa przez Gniezno i Poznań do Gdańska, jest wielką arterią Królestwa Polskiego. Z włączonym Mazowszem i podbitymi Prusami rozwój tej drogi znacznie poprawia komunikację, handel i administrację w całym królestwie."
 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "Przywileje nieszawskie"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "Szlachta zdobyła prawo weta wobec ustawodawstwa królewskiego. Początek polskiej „Złotej Wolności”."
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "Polski kodeks praw"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "Nowe artykuły, wywodzące się z kodeksu praw Kazimierza Wielkiego, przybliżają dzień, gdy szlachta i mieszczanie będą jednakowo sądzeni jednym i tym samym sądem."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Polityka wsparcia kupiectwa"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "Polityka wsparcia polskiego mieszczaństwa miejskiego podnosi dochód handlowy."
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "Szlak bursztynowy"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "Wozy załadowane bałtyckim bursztynem podążają starożytną drogą ku kupcom szukającym „złota Północy”."
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "Węzeł handlowy Poznań"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "Miasto handlowe Zachodniej Polski, Poznań, przebudowane ważnym węzłem handlowym."
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "Wilno prosperuje"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "Stolica Wielkiego Księstwa Litewskiego, Wilno, prosperuje wielokulturowym miastem."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Dostęp do Morza Czarnego"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "Polska zabezpieczyła dostęp do północnego wybrzeża czarnomorskiego i wkracza w śródziemnomorskie szlaki handlowe."
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "Twierdza Malbork"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "Największy średniowieczny zamek Europy odbudowany bastionami — niezłomną twierdzą."
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "Arcybiskupstwo gnieźnieńskie"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "Katedra w Gnieźnie, dom relikwii Świętego Wojciecha, działa jako duchowe centrum polskiej cywilizacji katolickiej."
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "Zemsta za Warnę"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "Upokarzająca klęska z 1444 roku pomszczona. Polska zyskuje coraz większą chwałę w walce przeciw światu islamskiemu."
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "Wybrzeże pomorskie"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "Wybrzeże pomorskie wokół Szczecina odbudowane jako przyczółek polskiej floty."
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "Uniwersytet Praski prosperuje"
 STATIC_MODIFIER_DESC_pol_prague_learning_mod: "Najstarszy uniwersytet Europy Środkowo-Wschodniej, Uniwersytet Karola, znów prosperuje pod polskimi rządami."
 STATIC_MODIFIER_NAME_pol_habsburg_victory_mod: "Zwycięstwo nad Habsburgami"
 STATIC_MODIFIER_DESC_pol_habsburg_victory_mod: "Wiedeń zajęty lub unia personalna z Habsburgami — Polska stała się panem Europy Środkowej."
 STATIC_MODIFIER_NAME_pol_sea_to_sea_mod: "Od morza do morza"
 STATIC_MODIFIER_DESC_pol_sea_to_sea_mod: "Polska, rozciągająca się od Bałtyku po Morze Czarne, panuje nad całym handlem wschodnioeuropejskim."
 STATIC_MODIFIER_NAME_pol_lithuanian_church_mod: "Kościół litewski"
 STATIC_MODIFIER_DESC_pol_lithuanian_church_mod: "Katolizacja Litwy osiągnęła duchową jedność unii polsko-litewskiej."
 STATIC_MODIFIER_NAME_pol_royal_road_mod: "Droga Królewska"
 STATIC_MODIFIER_DESC_pol_royal_road_mod: "Urzędnicy, kupcy i żołnierze podróżują długim sznurem Drogą Królewską od Krakowa do Gdańska."
 pol_lithuanian_relations: "Stosunki z Litwą"
 pol_lithuanian_relations_desc: "Wielkie Księstwo Litewskie — najważniejszy sąsiad Polski — możliwy sojusznik lub największe zagrożenie. W XIV wieku Litwa była ostatnim pogańskim narodem Europy, a jednak rozległym państwem, rozciągającym się od Bałtyku po Morze Czarne. Aby zapewnić unię personalną z Litwą poprzez politykę małżeńską królowej Jadwigi, najpierw musi być położona podstawa dyplomatyczna. Czy to przez przyjazne stosunki, czy nacisk wojskowy, Polska może zgłosić roszczenie do tronu litewskiego."
 pol_develop_ruthenia_desc: "Halicz (Halicz) i Wołyń to dwa wielkie księstwa Rusi Czerwonej. Lwów, centrum księstwa halickiego, i księstwo wołyńskie zostały podbite przez Polskę w latach 1349-66. Bełz jest również ważnym oporem ruskim. Przywiedzenie zarówno Halicza, jak i Wołynia w unię personalną pod Polską — lub bezpośrednie posiadanie Lwowa i Bełza — ustanawia kontrolę nad całą Rusią Czerwoną. Ta ziemia jest jedną z największych stref rolniczych Europy, a jej bogata gleba niesie polską populację i gospodarkę."
 STATIC_MODIFIER_NAME_pol_silesia_mines_mod: "Kopalnie Górnego Śląska"
 STATIC_MODIFIER_DESC_pol_silesia_mines_mod: "W szybach Górnego Śląska dźwięk kilofów, wydobywających srebro, cynk i ołów, rozbrzmiewa dzień i noc."
 STATIC_MODIFIER_NAME_pol_baltic_fleet_mod: "Polska flota bałtycka"
 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "Polska flota, stojąca w Gdańsku, panuje nad Bałtykiem. Od ujścia Wisły po Morze Północne polski sztandar powiewa na falach."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Panowanie nad Inflantami"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "Pod polską flagą, powiewającą nad portami Rygi i Rewla, ludy wielu języków płacą daninę tym samym poborcom."
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "Więzy z Hanzą"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "W kantorach Gdańska ci, którzy dzielą kielich z kupcami hanzeatyckimi, prowadzą swój handel, ufając ładunkowi jedni drugich."
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "Wpływ na Siedmiogród"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Poprzez unię personalną z Węgrami polscy posłowie są przyjmowani nawet na dworach górskich dolin Siedmiogrodu."
 pol_breadbasket_town_right_tt: "Prawo miejskie „Królewski Spichlerz Polski” jest teraz dostępne. Można je nadać lokacjom rangi miasta lub wyższej, które mają spichlerz na poziomie 5 lub wyższym."
 STATIC_MODIFIER_NAME_pol_warsaw_location_mod: "Stolica królewska Warszawa rozwinięta"
 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "Ulice Warszawy, zbudowanej nad brzegami Wisły, rozszerzają się z dnia na dzień, a karety urzędników z całego królestwa zbierają się tutaj."
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "Kraków prosperuje"
 STATIC_MODIFIER_DESC_pol_krakow_location_mod: "Kraków wokół Wawelu w pełni rozwinięty. Rozszerzenie maksymalnego rozmiaru surowców i miesięcznego wzrostu dobrobytu przekształca go w miasto godne polskiej stolicy królewskiej."
