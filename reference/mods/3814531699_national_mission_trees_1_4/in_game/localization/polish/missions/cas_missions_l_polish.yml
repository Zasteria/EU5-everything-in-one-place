l_polish:
 cas_castile_dev_hub: "Rozwój miast koronnych"
 cas_castile_dev_hub_desc: "Skieruj rozwój miast należących do kastylijskiej domeny koronnej i zapewnij ekonomiczny fundament królestwa."
 cas_granada_dev_hub: "Odrodzenie Grenady"
 cas_granada_dev_hub_desc: "Przynieś nowy dobrobyt miastom upadłego Królestwa Grenady — samej Grenadzie i Maladze."
 STATIC_MODIFIER_NAME_cas_crown_domains_mod: "Rozwój miast koronnych"
 STATIC_MODIFIER_DESC_cas_crown_domains_mod: "Poborcy podatkowi króla z dumą obchodzą nowe rynki i mury wzniesione w miastach koronnych."
 STATIC_MODIFIER_NAME_cas_granada_dev_mod: "Grenada odrodzona"
 STATIC_MODIFIER_DESC_cas_granada_dev_mod: "Z okien Alhambry dźwięk nowych dzwonów kościelnych rozchodzi się po całej dolinie."
 cas_castile_mission_pack: "Chwała Królestwa Kastylii"
 cas_castile_mission_pack_DESCRIPTION:0 "W 1337 roku Kastylia jest potężnym królestwem pod panowaniem Alfonsa XI. Rekonkwista jest niemal zakończona — pozostaje jedynie Grenada. Upadek Grenady, unia z Aragonem, żegluga Kolumba, konkwistadorzy Cortés i Pizarro oraz Imperium Filipa II, w którym słońce nigdy nie zachodzi. Przemierz historię Kastylii."
 cas_castile_mission_pack_CRITERIA_DESCRIPTION:0 "Zakończ Rekonkwistę, utwórz Hiszpanię, zbuduj imperium kolonialne i ustanów Imperium, w którym słońce nigdy nie zachodzi."
 cas_castile_mission_pack_BUTTON_TOOLTIP:0 "Ukończ misje, by ustanowić Imperium, w którym słońce nigdy nie zachodzi."
 cas_castile_mission_pack_BUTTON_DETAILS:0 "Od upadku Grenady do światowego imperium Filipa II!"
 cas_sword_of_castile: "Miecz Kastylii"
 cas_sword_of_castile_desc: "1337 rok — Alfons XI energicznie rządzi Kastylią. W bitwie nad Rio Salado w 1340 roku zniszczył połączone siły Merynidów i Grenady, kładąc fundament pod wypędzenie ostatniej potęgi muzułmańskiej z Półwyspu Iberyjskiego. Podnieś korony Kastylii i Leónu i ponownie unieś miecz Rekonkwisty."
 cas_secure_castile: "Rozbudowa Valladolid"
 cas_secure_castile_desc: "Posiadając całkowicie zarówno Kastylię, jak i León, ustanów centralną bazę Rekonkwisty."
 cas_fall_of_granada: "Upadek Grenady"
 cas_fall_of_granada_desc: "2 stycznia 1492 roku — ostatni sułtan Grenady, Boabdil, przekazuje klucze Izabeli Kastylijskiej na „Wzgórzu Łez”. Rekonkwista, trwająca 780 lat, dobiega wreszcie końca."
 cas_conquer_navarre: "Podbij Nawarrę"
 cas_conquer_navarre_desc: "Podbój Królestwa Nawarry na pirenejskim skrzyżowaniu ustanawia granicę z Francją i dopełnia panowanie nad Iberią Północną."
 cas_subdue_aragon: "Unia z Aragonem"
 cas_subdue_aragon_desc: "Małżeństwo Izabeli i Ferdynanda (1469) stworzyło unię personalną Kastylii i Aragonu. Pod „Królami Katolickimi” Hiszpania nabiera kształtu."
 cas_form_spain: "Utworzenie Hiszpanii"
 cas_form_spain_desc: "Kastylia, zjednoczywszy większość Półwyspu Iberyjskiego, formalnie ogłasza „Królestwo Hiszpanii”. Narodziny największej potęgi Europy."
 cas_conquer_portugal: "Włączenie Portugalii"
 cas_conquer_portugal_desc: "W 1580 roku Filip II odziedziczył tron portugalski — „unia iberyjska”. Dało to Hiszpanii kontrolę również nad imperium kolonialnym Portugalii."
 cas_iberian_union: "Unia iberyjska"
 cas_iberian_union_desc: "Cały Półwysep Iberyjski wchodzi pod panowanie hiszpańskie. Od Atlantyku po Ocean Indyjski kolonie hiszpańskie i portugalskie pokrywają świat."
 cas_holy_brotherhood: "Santa Hermandad"
 cas_holy_brotherhood_desc: "Santa Hermandad (Święte Braterstwo), ustanowione przez królową Izabelę, ogranicza władzę szlachty i wzmacnia władzę królewską jako organizacja porządku publicznego."
 cas_inquisition: "Inkwizycja hiszpańska"
 cas_inquisition_desc: "W 1478 roku papież Sykstus IV udzielił Izabeli i Ferdynandowi uprawnień do ustanowienia inkwizycji. Inkwizytorzy pod przewodnictwem Torquemady trudzą się nad zachowaniem czystości wiary."
 cas_expulsion_of_jews: "Dekret o wygnaniu"
 cas_expulsion_of_jews_desc: "Dekret Alhambry z 1492 roku — ogłasza wygnanie z Hiszpanii Żydów, którzy odmówili nawrócenia. Ta decyzja zachowuje czystość katolicką, lecz pozbawia kraj wielu utalentowanych kupców i uczonych."
 cas_catholic_monarchs: "Katoliccy Monarchowie"
 cas_catholic_monarchs_desc: "Papież Aleksander VI nadaje Izabeli i Ferdynandowi tytuł „Katoliccy Monarchowie” (Reyes Católicos). Hiszpania uznana zostaje strażniczką świata katolickiego."
 cas_absolute_crown: "Monarchia absolutna"
 cas_absolute_crown_desc: "Ograniczenie przywilejów szlacheckich i uczynienie władzy królewskiej absolutną — Hiszpania powstaje jednym z pierwszych nowoczesnych państw absolutystycznych Europy."
 cas_cortes: "Kortezy kastylijskie"
 cas_cortes_desc: "Kortezy (parlament) — tradycyjne zgromadzenie stanowe Kastylii. Zrównoważenie władzy królewskiej i parlamentu ustanawia trwały system rządów."
 cas_leyes_de_indias: "Prawa Indii"
 cas_leyes_de_indias_desc: "Prawa Indii, regulujące traktowanie rdzennych ludów w koloniach — ustanowione w odpowiedzi na humanitarne argumenty Bartolomé de las Casas."
 cas_canary_islands: "Wyspy Kanaryjskie"
 cas_canary_islands_desc: "Wyspy Kanaryjskie na Atlantyku — strategiczny punkt w rywalizacji z Portugalią. Kontrola nad tymi wyspami rozpoczyna atlantycką ekspansję Hiszpanii."
 cas_atlantic_exploration: "Eksploracja atlantycka"
 cas_atlantic_exploration_desc: "Podczas gdy Portugalia posuwa się na południe wzdłuż wybrzeża afrykańskiego, Hiszpania zwraca się na zachód przez Atlantyk. Marzenie o „zachodniej drodze do Indii” gotowe jest stać się rzeczywistością."
 cas_columbus_voyage: "Podróż Kolumba"
 cas_columbus_voyage_desc: "3 sierpnia 1492 roku — Krzysztof Kolumb wypływa z Palos. Trzy statki — „Santa Maria”, „Pinta” i „Niña” — przecinają Atlantyk i otwierają wrota do nowego świata."
 cas_conquer_caribbean: "Podbij Karaiby"
 cas_conquer_caribbean_desc: "Z Hispaniolą (Santo Domingo) jako bazą, ustanawia się hiszpańskie panowanie na Karaibach. Cukier, tytoń i metale szlachetne tworzą strumień bogactwa do Hiszpanii."
 cas_conquer_mexico: "Podbij Meksyk"
 cas_conquer_mexico_desc: "1519-1521 — Hernán Cortés podbił aztecką stolicę Tenochtitlan z 500 żołnierzami. Rodzą się „Wicekrólestwo Nowej Hiszpanii”."
 cas_conquer_peru: "Podbij Peru"
 cas_conquer_peru_desc: "Francisco Pizarro obalił Imperium Inków ze 168 ludźmi — jeden z najbardziej zdumiewających podbojów w historii. Złoto i srebro Andów płynie do Hiszpanii."
 cas_silver_of_potosi: "Srebro Potosí"
 cas_silver_of_potosi_desc: "Kopalnie srebra Potosí (odkryte w 1545 roku, wysokość 4000 m) — największe w historii europejskiej. Srebro z „Cerro Rico (Bogatej Góry)” wspiera finanse Imperium Hiszpańskiego."
 cas_colonial_empire: "Imperium kolonialne"
 cas_colonial_empire_desc: "Od Meksyku po Peru, od Karaibów po południowe wybrzeże Ameryki Północnej — hiszpańskie kolonie pokrywają świat. Czyny konkwistadorów kładą fundament imperium."
 cas_manila_galleon: "Galeon Manilski"
 cas_manila_galleon_desc: "Po założeniu Manili w 1571 roku Galeon Manilski zmonopolizował transoceaniczny handel między Acapulco a Manilą — pierwszy w świecie prawdziwie globalny szlak handlowy, łączący azjatycki jedwab i porcelanę z amerykańskim srebrem."
 cas_conquer_naples: "Podbij Królestwo Neapolu"
 cas_conquer_naples_desc: "„El Gran Capitán” Gonzalo de Córdoba pokonał Francję i zajął Neapol. Wpływ hiszpański na Włochy ustanowiony."
 cas_conquer_sicily: "Zabezpiecz Sycylię"
 cas_conquer_sicily_desc: "Sycylia, śródziemnomorska spichlerz, już pod koroną aragońską, zostaje włączona do Imperium Hiszpańskiego, dopełniając kontrolę nad wyspami śródziemnomorskimi."
 cas_conquer_milan: "Podbij Mediolan"
 cas_conquer_milan_desc: "Jako ostateczny rezultat wojen włoskich, księstwo Mediolanu wchodzi pod panowanie hiszpańskie. Cały półwysep włoski staje się hiszpańską sferą wpływów."
 cas_mediterranean_mastery: "Panowanie nad Morzem Śródziemnym"
 cas_mediterranean_mastery_desc: "Neapol, Sycylia, Sardynia, Mediolan — śródziemnomorskie imperium Hiszpanii ustanowione. Po raz pierwszy od starożytnego Rzymu Morzem Śródziemnym włada jedna potęga."
 cas_battle_of_lepanto: "Bitwa pod Lepanto"
 cas_battle_of_lepanto_desc: "7 października 1571 roku — flota Świętej Ligi Hiszpanii, Wenecji i papieża niszczy flotę osmańską. „Zwycięstwo Świętej Ligi”. Chrześcijańska przewaga na Morzu Śródziemnym ustanowiona."
 cas_secure_ceuta: "Zabezpiecz Ceutę"
 cas_secure_ceuta_desc: "Ceuta, stojąca naprzeciw Półwyspu Iberyjskiego przez Cieśninę Gibraltarską, jest bramą do Afryki. Kontrola nad nią zapewnia zachodnie wejście do Morza Śródziemnego."
 cas_conquer_oran: "Podbij Oran"
 cas_conquer_oran_desc: "W 1509 roku kardynał Cisneros podbił Oran — pierwszy krok „Afrykańskiej Rekonkwisty”. Rozpoczyna się kontratak przeciwko siłom muzułmańskim w Afryce Północnej."
 cas_conquer_tunis: "Podbij Tunis"
 cas_conquer_tunis_desc: "W 1535 roku siły hiszpańskie Karola V podbiły Tunis. Militarna potęga Hiszpanii, rywalizującej z Imperium Osmańskim o panowanie w Afryce Północnej, ukazana światu."
 cas_north_africa_dominion: "Panowanie nad Afryką Północną"
 cas_north_africa_dominion_desc: "Od Ceuty po Oran wybrzeże śródziemnomorskie Afryki Północnej wchodzi pod hiszpańskie panowanie. Muzułmańskie piractwo wykorzenione, handel śródziemnomorski stabilizuje się."
 cas_dev_sevilla: "Brama Indii"
 cas_dev_sevilla_desc: "Sewilla nad Gwadalkiwirem — starożytne miasto rozkwita jako wyjątkowa brama dla handlu z Nowym Światem. „Casa de Contratación” czyni je największym miastem handlowym świata."
 cas_casa_de_contratacion: "Casa de Contratación"
 cas_casa_de_contratacion_desc: "Ustanowiona w Sewilli w 1503 roku, Casa de Contratación (Izba Handlowa) wyłącznie zarządza hiszpańskim handlem kolonialnym. Cały handel z Nowym Światem przechodzi przez nią."
 cas_dev_toledo: "Przemysł stali toledańskiej"
 cas_dev_toledo_desc: "Toledo — historyczna stolica Kastylii i miasto przemysłowe słynne z mieczy, wyrobów złotniczych i jedwabiu. Sława „stali toledańskiej” rozprzestrzenia się po całym świecie."
 cas_dev_madrid: "Madryt jako stolica"
 cas_dev_madrid_desc: "W 1561 roku Filip II ogłosił Madryt stałą stolicą — rewolucyjna zmiana dla Hiszpanii, gdzie dwór wcześniej przenosił się z miasta do miasta. Ludność Madrytu gwałtownie rośnie."
 cas_dev_burgos: "Miasto Cyda"
 cas_dev_burgos_desc: "Burgos, „Miasto Cyda” — historyczna stolica Kastylii, rozkwitająca dzięki eksportowi wełny do Europy Północnej."
 cas_trade_network: "Imperialna sieć handlowa"
 cas_trade_network_desc: "Od Sewilli po Manilę, od Antwerpii po Nowy Świat — imperialna sieć handlowa Hiszpanii obejmuje cały globus."
 cas_tercio: "Tercio (hiszpański czworobok)"
 cas_tercio_desc: "Największa taktyka XVI wieku — tercio łączy pikinierów, muszkieterów i miecznych w formacji piechoty. „Piechota hiszpańska — najsilniejsza na świecie” dowiedziona na polu bitwy."
 cas_military_orders: "Zakony rycerskie"
 cas_military_orders_desc: "Trzy zakony rycerskie — Santiago, Calatrava i Alcántara — w epoce Katolickich Monarchów ich majątek i władza wprowadzone pod kontrolę królewską, by wesprzeć siłę militarną."
 cas_grande_armada: "Wielka Armada"
 cas_grande_armada_desc: "W 1588 roku Filip II wysłał wielką flotę 130 statków „Armadę” dla podboju Anglii — symbolizując szczyt hiszpańskiej potęgi morskiej."
 cas_conquistadors: "Konkwistadorzy"
 cas_conquistadors_desc: "Cortés, Pizarro, Balboa, de Soto — imiona zdobywców zapisane w historii. Podbijając rozległe imperia niewielką liczbą żołnierzy, ukazali światu przewagę hiszpańskiej technologii wojskowej."
 cas_salamanca_university: "Uniwersytet w Salamance"
 cas_salamanca_university_desc: "Założony w 1218 roku, Uniwersytet w Salamance jest jednym z najstarszych w Europie. Jako najlepsza instytucja teologii, prawa i medycyny, kształci urzędników, duchowieństwo i uczonych Imperium Hiszpańskiego."
 cas_siglo_de_oro: "Złoty Wiek (Siglo de Oro)"
 cas_siglo_de_oro_desc: "Cervantes, Lope de Vega, Velázquez, El Greco — rozkwita hiszpański złoty wiek kulturalny XVI-XVII wieku. Hiszpania prowadzi Europę w literaturze, teatrze i malarstwie."
 cas_escorial: "El Escorial"
 cas_escorial_desc: "Pałac-klasztor El Escorial, którego budowę w 1563 roku nakazał Filip II — łącząc pałac, klasztor i mauzoleum, ta monumentalna budowla symbolizuje szczyt Imperium Hiszpańskiego."
 cas_dev_granada_city: "Perła Hiszpanii"
 cas_dev_granada_city_desc: "Grenada, dom pałacu Alhambra — miasto, w którym oddycha muzułmańskie dziedzictwo kulturowe. Rozwiń tę „perłę Hiszpanii” centrum kulturalnym i ekonomicznym południa."
 cas_dev_cordoba: "Chwała skóry kordobańskiej"
 cas_dev_cordoba_desc: "Znana z Meczetu-Katedry, Kordoba była niegdyś stolicą kalifatu Umajjadów i największym miastem świata. Wykorzystaj to dziedzictwo, by rozwinąć ją centrum kultury i nauki."
 cas_inherit_flanders: "Odziedzicz Flandrię"
 cas_inherit_flanders_desc: "Flandria została włączona do Hiszpanii jako część dziedzictwa burgundzkiego. Bogate miasta tekstylne Antwerpia, Brugia i Gandawa wspierają finanse Imperium Hiszpańskiego."
 cas_revolt_of_flanders: "Uspokój Flandrię"
 cas_revolt_of_flanders_desc: "Stłum opór flamandzki i włącz ten dostatni region trwałą częścią Imperium Hiszpańskiego."
 cas_greatest_power: "Fundamenty niegasnącego imperium"
 cas_greatest_power_desc: "Imperium kolonialne, tercio i Armada — trzy filary ukończone, a Hiszpania osiągnęła niespotykaną wysokość dobrobytu. Nadszedł moment, by uczynić ostatni krok ku Imperium, w którym słońce nigdy nie zachodzi."
 cas_empire_of_the_sun: "Imperium, w którym słońce nigdy nie zachodzi"
 cas_empire_of_the_sun_desc: "„W moim Imperium słońce nigdy nie zachodzi (En mi Imperio nunca se pone el sol)” — słowa Karola V stają się rzeczywistością. Od Hiszpanii po Neapol, Flandrię po Nowy Świat, Manilę po Karaiby — hiszpańska flaga powiewa w każdym zakątku ziemi."
 cas_battle_rio_salado: "Zwycięstwo nad Rio Salado"
 cas_battle_rio_salado_desc: "W bitwie nad Rio Salado w 1340 roku Alfons XI rozbił połączone siły Merynidów i Grenady — otwiera się kurtyna ostatniego aktu Rekonkwisty."
 cas_dev_leon_city: "Chwała dawnego Królestwa Leónu"
 cas_dev_leon_city_desc: "León, dawna stolica Królestwa Leónu, które niegdyś przewodziło Rekonkwiście — rozwiń je, opierając się na jego historii i tradycji."
 cas_church_reform: "Reforma kościelna"
 cas_church_reform_desc: "Reforma kościelna pod przewodnictwem kardynała Cisnerosa — przywrócenie dyscypliny klasztornej, poprawa edukacji duchowieństwa i wykorzenienie korupcji czynią Kościół Katolicki Hiszpanii najsilniejszą władzą duchową Europy."
 cas_counter_reformation: "Kontrreformacja"
 cas_counter_reformation_desc: "Zakon jezuitów, założony przez Ignacego Loyolę — Kontrreformacja pod przewodnictwem Hiszpanii przeciwstawia się zagrożeniu protestanckiemu. Sobór Trydencki ponownie potwierdza doktrynę katolicką."
 cas_conquer_cuba: "Podbij Kubę"
 cas_conquer_cuba_desc: "W 1511 roku Diego Velázquez podbił Kubę. Hawana rozwija się jako karaibski węzeł handlowy i staje się kluczowym portem na szlakach do Nowego Świata."
 cas_conquer_florida: "Eksploruj Florydę"
 cas_conquer_florida_desc: "Juan Ponce de León odkrył „La Florida (Ziemię Kwiatów)” w 1513 roku — ścigając legendę o „Źródle Młodości”, rozpoczyna się eksploracja Ameryki Północnej."
 cas_conquer_philippines: "Podbij Filipiny"
 cas_conquer_philippines_desc: "W 1565 roku Miguel López de Legazpi podbił Wyspy Filipińskie i założył Manilę. Azjatycka ekspansja Hiszpanii dokonana, a transoceaniczny handel Galeonu Manilskiego się rodzi."
 cas_gold_fleets: "Floty złota i srebra"
 cas_gold_fleets_desc: "Srebro Potosí i złoto Inków — coroczna „Flota Indii (Flota de Indias)”, płynąca do Hiszpanii, tworzy największy na świecie strumień bogactwa."
 cas_sardinia: "Zabezpiecz Sardynię"
 cas_sardinia_desc: "Sardynia, już pod koroną aragońską, zostaje włączona do Imperium Hiszpańskiego, dopełniając kontrolę nad wyspami zachodniego Morza Śródziemnego."
 cas_conquer_tunis_italy: "Ustanów panowanie włoskie"
 cas_conquer_tunis_italy_desc: "Neapol, Sycylia, Sardynia, Mediolan — główne regiony Półwyspu Włoskiego wchodzą pod hiszpańskie panowanie, dodając bogactwo renesansu do dobrobytu Imperium Hiszpańskiego."
 cas_garrison_system: "Sieć obronna garnizonów"
 cas_garrison_system_desc: "Sieć obronna garnizonów, chroniąca rozległe Imperium Hiszpańskie — tercio we Flandrii, twierdze w Neapolu i presidios w Afryce Północnej strzegą granic imperium."
 cas_dev_cadiz: "Starożytny port fenicki"
 cas_dev_cadiz_desc: "Starożytne fenickie miasto Kadyks stoi w naturalnym porcie na atlantyckim półwyspie. Przeznaczone jest zastąpić Sewillę bramą do handlu indyjskiego."
 cas_dev_malaga: "Rozwiń Malagę"
 cas_dev_malaga_desc: "Malaga na wybrzeżu śródziemnomorskim — miasto handlowe znane z jedwabiu, wina i rodzynek. Rozwija się szybko po podboju Grenady."
 cas_dev_valencia: "Miasto Słońca"
 cas_dev_valencia_desc: "Walencja, „Miasto Słońca”, jest śródziemnomorskim węzłem handlowym, produkującym jedwab, cukier i ryż. Rozwój głównego miasta korony aragońskiej przynosi dobrobyt wschodniemu wybrzeżu Hiszpanii."
 cas_dev_zaragoza: "Stolica Aragonu"
 cas_dev_zaragoza_desc: "Saragossa, stolica Królestwa Aragonu, jest kluczowym węzłem transportowym nad Ebro. Jej rozwój ożywia wewnętrzny handel iberyjski."
 cas_dev_barcelona: "Królowa Morza Śródziemnego"
 cas_dev_barcelona_desc: "Barcelona, centrum handlu śródziemnomorskiego — rozwiń katalońską stolicę, największe miasto handlowe Aragonu, jako śródziemnomorski węzeł handlowy Imperium Hiszpańskiego."
 cas_dev_segovia: "Akwedukt w Segowii"
 cas_dev_segovia_desc: "Segowia, słynna z akweduktu i zamku królewskiego, rozwija się jako symbol władzy królewskiej Kastylii."
 cas_west_africa_trade: "Handel z Afryką Zachodnią"
 cas_west_africa_trade_desc: "Wykorzystując Wyspy Kanaryjskie jako przyczółek, Hiszpania wkracza w handel z Afryką Zachodnią, rywalizując z Portugalią o szlaki kości słoniowej, złota i, ostatecznie, handlu niewolnikami."
 cas_council_of_trent: "Sobór Trydencki"
 cas_council_of_trent_desc: "Sobór Trydencki (1545-1563) — pod przewodnictwem Hiszpanii, ponownie potwierdzający doktrynę katolicką i ustalający kierunki Kontrreformacji. Jezuici stoją na czele kontrataku przeciwko protestantyzmowi."
 cas_events.20.t: "Upadek Grenady — zakończenie Rekonkwisty"
 cas_events.20.d: "2 stycznia 1492 roku — wrota Alhambry otwierają się, a ostatni sułtan Grenady, Muhammad XII (Boabdil), przekazuje klucze Izabeli i Ferdynandowi na „Wzgórzu Łez”. Rekonkwista, trwająca 780 lat, dobiega wreszcie końca. „Płacz teraz, boś nie umiał walczyć jak mężczyzna” — słowa matki Boabdila pozostają w historii."
 cas_events.20.a: "Chwała Hiszpanii! Rekonkwista zakończona! Chwała Bogu i Matce Bożej!"
 cas_events.30.t: "Katoliccy Monarchowie — unia z Aragonem"
 cas_events.30.d: "Dekady po małżeństwie Izabeli i Ferdynanda — nadszedł czas unii Kastylii i Aragonu. Papież Aleksander VI nadaje im tytuł „Katoliccy Monarchowie” (Reyes Católicos), a utworzenie Hiszpanii jako narodu staje się rzeczywistością."
 cas_events.30.a: "Chwała Katolickim Monarchom! Hiszpania jednoczy się w jednej wierze!"
 cas_events.50.t: "Podróż Kolumba — odkrycie Nowego Świata"
 cas_events.50.d: "12 października 1492 roku — Krzysztof Kolumb ląduje na wyspie Guanahani na Bahamach. Ujawnia się istnienie Nowego Świata, nieznanego Europejczykom. Odkrycie Kolumba, wierzącego, że dotarł do „Indii (Azji)”, przyniesie Hiszpanii niezmierzone bogactwo."
 cas_events.50.a: "Błogosławieństwo Boże nad Nowym Światem! Sztandar Hiszpanii aż po daleki brzeg Atlantyku!"
 cas_events.99.t: "Imperium, w którym słońce nigdy nie zachodzi"
 cas_events.99.d: "„W moim Imperium słońce nigdy nie zachodzi (En mi Imperio nunca se pone el sol)” — słowa Karola V stają się rzeczywistością. Od Hiszpanii po Neapol, Flandrię po Nowy Świat, Filipiny po Karaiby, flaga hiszpańska powiewa w każdym zakątku świata. Za panowania Filipa II Imperium Hiszpańskie zostaje ukończone jako pierwsze „imperium światowe” ludzkości."
 cas_events.99.a: "Chwała Imperium, w którym słońce nigdy nie zachodzi! Hiszpania na wieki!"
 STATIC_MODIFIER_NAME_cas_reconquista_spirit_mod: "Duch Rekonkwisty"
 STATIC_MODIFIER_DESC_cas_reconquista_spirit_mod: "Miecz Kastylii natchnie świętą wojnę przeciwko muzułmanom Iberii."
 STATIC_MODIFIER_NAME_cas_rio_salado_mod: "Zwycięstwo nad Rio Salado"
 STATIC_MODIFIER_DESC_cas_rio_salado_mod: "Zmiażdżenie koalicji Merynidów i Grenady nad Rio Salado otwiera ostatni akt Rekonkwisty."
 STATIC_MODIFIER_NAME_cas_leon_city_mod: "Chwała dawnego Królestwa Leónu"
 STATIC_MODIFIER_DESC_cas_leon_city_mod: "Dawna stolica Leónu rozwinięta jako symbol dziedzictwa Rekonkwisty."
 STATIC_MODIFIER_NAME_cas_church_reform_mod: "Reforma kościelna"
 STATIC_MODIFIER_DESC_cas_church_reform_mod: "Reforma Cisnerosa czyni Kościół Katolicki Hiszpanii najbardziej zdyscyplinowanym i potężnym w Europie."
 STATIC_MODIFIER_NAME_cas_counter_ref_mod: "Kontrreformacja"
 STATIC_MODIFIER_DESC_cas_counter_ref_mod: "Hiszpania przewodzi katolickiemu kontratakowi przeciwko reformacji protestanckiej."
 STATIC_MODIFIER_NAME_cas_havana_mod: "Hawana — karaibski węzeł"
 STATIC_MODIFIER_DESC_cas_havana_mod: "Hawana rozwinięta jako największy węzeł handlowy i morski Karaibów."
 STATIC_MODIFIER_NAME_cas_florida_mod: "La Florida"
 STATIC_MODIFIER_DESC_cas_florida_mod: "Hiszpańska eksploracja Ameryki Północnej ustanawia obecność w południowo-wschodniej części kontynentu."
 STATIC_MODIFIER_NAME_cas_philippines_mod: "Wyspy Filipińskie"
 STATIC_MODIFIER_DESC_cas_philippines_mod: "Azjatycka ekspansja Hiszpanii dokonana — Manila staje się węzłem handlu transoceanicznego."
 STATIC_MODIFIER_NAME_cas_sardinia_mod: "Królestwo Sardynii"
 STATIC_MODIFIER_DESC_cas_sardinia_mod: "Śródziemnomorska spichlerz Sardynia pod hiszpańską kontrolą."
 STATIC_MODIFIER_NAME_cas_italy_dominion_mod: "Panowanie włoskie"
 STATIC_MODIFIER_DESC_cas_italy_dominion_mod: "Półwysep Włoski wchodzi pod hiszpańskie panowanie — bogactwo renesansu dodane do imperium."
 STATIC_MODIFIER_NAME_cas_garrison_mod: "Sieć garnizonów"
 STATIC_MODIFIER_DESC_cas_garrison_mod: "Strategiczna sieć garnizonów strzeże rozległych granic Imperium Hiszpańskiego."
 STATIC_MODIFIER_NAME_cas_cadiz_mod: "Starożytny port fenicki"
 STATIC_MODIFIER_DESC_cas_cadiz_mod: "Naturalny port Kadyksu staje się główną atlantycką bramą handlową."
 STATIC_MODIFIER_NAME_cas_malaga_mod: "Jedwab Malagi"
 STATIC_MODIFIER_DESC_cas_malaga_mod: "Po podboju Grenady ciepły klimat i żyzna ziemia Malagi rozwijają się jako region produkcji jedwabiu. Rzemieślnicy Alhambry wspierają przemysł jedwabny Malagi, handlowany po wysokich cenach w całym Morzu Śródziemnym."
 STATIC_MODIFIER_NAME_cas_valencia_mod: "Miasto Słońca"
 STATIC_MODIFIER_DESC_cas_valencia_mod: "Jedwab i handel śródziemnomorski Walencji czynią ją wschodnim centrum ekonomicznym Hiszpanii."
 STATIC_MODIFIER_NAME_cas_zaragoza_mod: "Stolica Aragonu"
 STATIC_MODIFIER_DESC_cas_zaragoza_mod: "Saragossa nad Ebro ożywia wewnętrzne sieci handlowe Iberii."
 STATIC_MODIFIER_NAME_cas_barcelona_mod: "Barcelona — węzeł śródziemnomorski"
 STATIC_MODIFIER_DESC_cas_barcelona_mod: "Barcelona jako największy śródziemnomorski węzeł handlowy Hiszpanii."
 STATIC_MODIFIER_NAME_cas_reconquista_done_mod: "Rekonkwista zakończona"
 STATIC_MODIFIER_DESC_cas_reconquista_done_mod: "780 lat świętej wojny zakończonych — Hiszpania zjednoczona pod wiarą katolicką. Pojęcie „Hiszpanii” uformowane."
 STATIC_MODIFIER_NAME_cas_hermandad_mod: "Święte Braterstwo"
 STATIC_MODIFIER_DESC_cas_hermandad_mod: "Strzelcy Hermandad patrolują drogi, a nawet wrota szlacheckich zamków otwierają się przed sprawiedliwością królewską."
 STATIC_MODIFIER_NAME_cas_inquisition_mod: "Inkwizycja hiszpańska"
 STATIC_MODIFIER_DESC_cas_inquisition_mod: "Inkwizytorzy Świętego Urzędu w czarnych habitach chodzą od miasta do miasta, a ludzie świadczą o swojej wierze przyciszonymi głosami."
 STATIC_MODIFIER_NAME_cas_pure_faith_mod: "Czystość wiary"
 STATIC_MODIFIER_DESC_cas_pure_faith_mod: "Wygnanie Żydów ustanawia katolicką czystość Hiszpanii."
 STATIC_MODIFIER_NAME_cas_catholic_monarchs_mod: "Dziedzictwo Katolickich Monarchów"
 STATIC_MODIFIER_DESC_cas_catholic_monarchs_mod: "Papieski tytuł „Katoliccy Monarchowie” ustanawia władzę Hiszpanii."
 STATIC_MODIFIER_NAME_cas_absolutism_mod: "Absolutyzm"
 STATIC_MODIFIER_DESC_cas_absolutism_mod: "Władza królewska staje się absolutna, a Hiszpania powstaje jako nowoczesne państwo scentralizowane."
 STATIC_MODIFIER_NAME_cas_cortes_mod: "Kortezy"
 STATIC_MODIFIER_DESC_cas_cortes_mod: "W izbie kortezów Kastylii król i delegaci miast zasiadają przy jednym stole, ustalając warunki rządów."
 STATIC_MODIFIER_NAME_cas_colonial_law_mod: "Prawa Indii"
 STATIC_MODIFIER_DESC_cas_colonial_law_mod: "Prawo administracji kolonialnej skodyfikowane, stabilizujące zarządzanie rozległymi terytoriami zamorskimi."
 STATIC_MODIFIER_NAME_cas_canary_mod: "Przyczółek na Kanarach"
 STATIC_MODIFIER_DESC_cas_canary_mod: "Przyczółek dla ekspansji atlantyckiej ustanowiony."
 STATIC_MODIFIER_NAME_cas_atlantic_mod: "Duch eksploracji atlantyckiej"
 STATIC_MODIFIER_DESC_cas_atlantic_mod: "Pragnienie zbadania nieznanych mórz czyni możliwym panowanie atlantyckie Hiszpanii."
 STATIC_MODIFIER_NAME_cas_caribbean_mod: "Panowanie na Karaibach"
 STATIC_MODIFIER_DESC_cas_caribbean_mod: "Morze Karaibskie staje się „morzem wewnętrznym” Imperium Hiszpańskiego."
 STATIC_MODIFIER_NAME_cas_mexico_mod: "Wicekrólestwo Nowej Hiszpanii"
 STATIC_MODIFIER_DESC_cas_mexico_mod: "Podbój Imperium Azteków rodzi Wicekrólestwo Nowej Hiszpanii."
 STATIC_MODIFIER_NAME_cas_peru_mod: "Wicekrólestwo Peru"
 STATIC_MODIFIER_DESC_cas_peru_mod: "Podbój Imperium Inków rodzi Wicekrólestwo Peru. Bogactwo Andów płynie do Hiszpanii."
 STATIC_MODIFIER_NAME_cas_potosi_mod: "Kopalnie srebra Potosí"
 STATIC_MODIFIER_DESC_cas_potosi_mod: "Największa na świecie kopalnia srebra wspiera finanse Imperium Hiszpańskiego; srebro staje się walutą Hiszpanii."
 STATIC_MODIFIER_NAME_cas_colonial_empire_mod: "Imperium kolonialne"
 STATIC_MODIFIER_DESC_cas_colonial_empire_mod: "Globalne hiszpańskie imperium kolonialne ukończone; marzenie konkwistadorów staje się rzeczywistością."
 STATIC_MODIFIER_NAME_cas_manila_galleon_mod: "Handel Galeonu Manilskiego"
 STATIC_MODIFIER_DESC_cas_manila_galleon_mod: "Galeony Manilskie, przecinające Pacyfik, ustanawiają pierwszy globalny szlak handlowy, łączący Azję i Amerykę."
 STATIC_MODIFIER_NAME_cas_naples_mod: "Królestwo Neapolu"
 STATIC_MODIFIER_DESC_cas_naples_mod: "Królestwo Neapolu wchodzi pod hiszpańską koronę, ustanawiając wpływ we Włoszech."
 STATIC_MODIFIER_NAME_cas_sicily_mod: "Królestwo Sycylii"
 STATIC_MODIFIER_DESC_cas_sicily_mod: "Sycylia, spichlerz Morza Śródziemnego, ustabilizowana pod rządami hiszpańskimi."
 STATIC_MODIFIER_NAME_cas_milan_mod: "Księstwo Mediolanu"
 STATIC_MODIFIER_DESC_cas_milan_mod: "Jako rezultat wojen włoskich, Mediolan wchodzi w sferę wpływów Hiszpanii."
 STATIC_MODIFIER_NAME_cas_mediterranean_mod: "Hegemon Morza Śródziemnego"
 STATIC_MODIFIER_DESC_cas_mediterranean_mod: "Hiszpania zdobywa panowanie nad Morzem Śródziemnym — po raz pierwszy od starożytnego Rzymu morzem włada jedna potęga."
 STATIC_MODIFIER_NAME_cas_lepanto_mod: "Bohater Lepanto"
 STATIC_MODIFIER_DESC_cas_lepanto_mod: "Bitwa pod Lepanto niszczy flotę osmańską, ustanawiając chrześcijańską przewagę na Morzu Śródziemnym."
 STATIC_MODIFIER_NAME_cas_ceuta_mod: "Twierdza Ceuta"
 STATIC_MODIFIER_DESC_cas_ceuta_mod: "Ceuta, brama Cieśniny Gibraltarskiej, zapewniona — wrota do Afryki otwarte."
 STATIC_MODIFIER_NAME_cas_oran_mod: "Podbój Oranu"
 STATIC_MODIFIER_DESC_cas_oran_mod: "Rekonkwista rozszerza się na Afrykę Północną — Oran staje się hiszpańskim bastionem północnoafrykańskim."
 STATIC_MODIFIER_NAME_cas_tunis_mod: "Podbicie Tunisu"
 STATIC_MODIFIER_DESC_cas_tunis_mod: "Podbiwszy Tunis, Hiszpania rywalizuje z Imperium Osmańskim o panowanie w Afryce Północnej."
 STATIC_MODIFIER_NAME_cas_north_africa_mod: "Panowanie nad Afryką Północną"
 STATIC_MODIFIER_DESC_cas_north_africa_mod: "Wybrzeże śródziemnomorskie Afryki Północnej wchodzi pod hiszpańskie rządy, stabilizując handel śródziemnomorski."
 STATIC_MODIFIER_NAME_cas_casa_contratacion_mod: "Casa de Contratación"
 STATIC_MODIFIER_DESC_cas_casa_contratacion_mod: "Sewilska Casa de Contratación monopolizuje handel z Nowym Światem — rodzi się największa na świecie instytucja handlowa."
 STATIC_MODIFIER_NAME_cas_tercio_mod: "Tercio"
 STATIC_MODIFIER_DESC_cas_tercio_mod: "Tercio, najlepsza formacja piechoty świata, staje się podstawą armii hiszpańskiej."
 STATIC_MODIFIER_NAME_cas_military_orders_mod: "Zakony rycerskie"
 STATIC_MODIFIER_DESC_cas_military_orders_mod: "Zakony rycerskie Santiago, Calatrava i Alcántara dołączają do armii hiszpańskiej."
 STATIC_MODIFIER_NAME_cas_armada_mod: "Niezwyciężona Armada"
 STATIC_MODIFIER_DESC_cas_armada_mod: "Z 130 statków, „Niezwyciężona Armada” uosabia szczyt hiszpańskiej potęgi morskiej."
 STATIC_MODIFIER_NAME_cas_conquistadors_mod: "Konkwistadorzy"
 STATIC_MODIFIER_DESC_cas_conquistadors_mod: "Legenda Cortésa i Pizarra żyje — hiszpańscy konkwistadorzy przemierzają cały świat."
 STATIC_MODIFIER_NAME_cas_siglo_de_oro_mod: "Złoty Wiek"
 STATIC_MODIFIER_DESC_cas_siglo_de_oro_mod: "Epoka Cervantesa, Velázqueza i El Greco — kultura hiszpańska stoi na szczycie świata."
 STATIC_MODIFIER_NAME_cas_escorial_mod: "El Escorial"
 STATIC_MODIFIER_DESC_cas_escorial_mod: "Pałac, klasztor i mauzoleum Filipa II uosabiają szczyt Imperium Hiszpańskiego."
 STATIC_MODIFIER_NAME_cas_segovia_mod: "Akwedukt w Segowii"
 STATIC_MODIFIER_DESC_cas_segovia_mod: "Wielki rzymski akwedukt odrestaurowany i zmodernizowany, znacznie poprawiając zaopatrzenie Segowii w wodę. Ten akwedukt staje się wzorem dla infrastruktury wodnej w całej Kastylii."
 STATIC_MODIFIER_NAME_cas_west_africa_mod: "Handel z Afryką Zachodnią"
 STATIC_MODIFIER_DESC_cas_west_africa_mod: "Hiszpania wkracza w handel z Afryką Zachodnią, wykorzystując Wyspy Kanaryjskie jako przyczółek."
 STATIC_MODIFIER_NAME_cas_trent_mod: "Sobór Trydencki"
 STATIC_MODIFIER_DESC_cas_trent_mod: "Sobór Trydencki pod przewodnictwem Hiszpanii ponownie potwierdza doktrynę katolicką i ustala kierunki Kontrreformacji."
 STATIC_MODIFIER_NAME_cas_navarre_mod: "Nawarra podbita"
 STATIC_MODIFIER_DESC_cas_navarre_mod: "Pirenejskie skrzyżowanie Nawarry zapewnione — Iberia Północna pod kontrolą."
 STATIC_MODIFIER_NAME_cas_salamanca_mod: "Uniwersytet w Salamance"
 STATIC_MODIFIER_DESC_cas_salamanca_mod: "Jeden z najstarszych uniwersytetów Europy kształci elitarnych uczonych i urzędników Hiszpanii."
 STATIC_MODIFIER_NAME_cas_toledo_dev_mod: "Stal toledańska"
 STATIC_MODIFIER_DESC_cas_toledo_dev_mod: "Stal toledańska i wyroby złotnicze rozkwitają — historyczna stolica w pełni rozwinięta."
 STATIC_MODIFIER_NAME_cas_madrid_mod: "Madryt — stolica imperialna"
 STATIC_MODIFIER_DESC_cas_madrid_mod: "Stała stolica Filipa II, Madryt, staje się sercem światowego imperium."
 STATIC_MODIFIER_NAME_cas_burgos_mod: "Burgos — międzynarodowe miasto Drogi Pielgrzymów"
 STATIC_MODIFIER_DESC_cas_burgos_mod: "Burgos rozwija się jako historyczna stolica Kastylii i centrum handlu wełną."
 STATIC_MODIFIER_NAME_cas_granada_city_mod: "Perła Hiszpanii"
 STATIC_MODIFIER_DESC_cas_granada_city_mod: "Miasto Alhambry staje się południowym centrum kulturalnym i ekonomicznym Hiszpanii."
 STATIC_MODIFIER_NAME_cas_cordoba_mod: "Produkcja skóry kordobańskiej"
 STATIC_MODIFIER_DESC_cas_cordoba_mod: "Kordoban, skóra kozia wygarbowana przez rzemieślników Kordoby, ceniona jest na dworach Europy, a ładunki nieustannie opuszczają warsztaty miasta."
 STATIC_MODIFIER_NAME_cas_flanders_pacified_mod: "Flandria uspokojona"
 STATIC_MODIFIER_DESC_cas_flanders_pacified_mod: "Opór flamandzki stłumiony — ten dostatni region trwale włączony do imperium."
 STATIC_MODIFIER_NAME_cas_greatest_power_mod: "Fundamenty Imperium, w którym słońce nigdy nie zachodzi"
 STATIC_MODIFIER_DESC_cas_greatest_power_mod: "Ze wszystkimi trzema filarami na miejscu, Hiszpania stoi u progu ukończenia „imperium, w którym słońce nigdy nie zachodzi”."
 STATIC_MODIFIER_NAME_cas_empire_of_sun_final_mod: "Imperium, w którym słońce nigdy nie zachodzi"
 STATIC_MODIFIER_DESC_cas_empire_of_sun_final_mod: "Hiszpania ukończona jako pierwsze w historii globalne imperium — imię „imperium, w którym słońce nigdy nie zachodzi” na wieki wyryte w historii."
 STATIC_MODIFIER_NAME_cas_gold_fleet_mod: "Floty skarbów"
 STATIC_MODIFIER_DESC_cas_gold_fleet_mod: "Floty skarbów, płynące co roku do Hiszpanii, przekształcają gospodarkę europejską."
 STATIC_MODIFIER_NAME_cas_portugal_mod: "Unia z Portugalią"
 STATIC_MODIFIER_DESC_cas_portugal_mod: "Poprzez unię iberyjską, imperium kolonialne Portugalii dołącza do Hiszpanii również."
 STATIC_MODIFIER_NAME_cas_iberian_union_mod: "Unia iberyjska"
 STATIC_MODIFIER_DESC_cas_iberian_union_mod: "Cały Półwysep Iberyjski zjednoczony, dopełniając fundament największego imperium świata."
 STATIC_MODIFIER_NAME_cas_sevilla_mod: "Sewilla prosperuje"
 STATIC_MODIFIER_DESC_cas_sevilla_mod: "Sewilla, brama handlu z Nowym Światem, rozwinięta jako największe miasto handlowe świata."
 STATIC_MODIFIER_NAME_cas_trade_network_mod: "Imperialna sieć handlowa"
 STATIC_MODIFIER_DESC_cas_trade_network_mod: "Od Sewilli po Manilę imperialna sieć handlowa Hiszpanii obejmuje cały glob."
 STATIC_MODIFIER_NAME_cas_valladolid_dev_mod: "Rozbudowa Valladolid"
 STATIC_MODIFIER_DESC_cas_valladolid_dev_mod: "Valladolid, miasto zamkowe Kastylii, rozwinięte jako siedziba dworu, a jego rynki i warsztaty prosperują."
 STATIC_MODIFIER_NAME_cas_form_spain_mod: "Narodziny Królestwa Hiszpanii"
 STATIC_MODIFIER_DESC_cas_form_spain_mod: "Pisarze dworscy w Madrycie sporządzają dekrety dla każdej prowincji w imieniu jednego królestwa."
