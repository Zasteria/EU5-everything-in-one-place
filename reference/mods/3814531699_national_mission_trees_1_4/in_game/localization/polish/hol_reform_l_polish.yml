l_polish:
 hol_republican_reform: "Republika pod suwerennością stanów"
 hol_republican_reform_desc: "Osobliwa forma rządów bez namiestnika, gdzie suwerenność spoczywa na zgromadzeniach siedmiu prowincji — sprzyja handlowi i interesom stanu mieszczańskiego, choć utrzymanie stałej armii okazuje się nieco utrudnione."
