l_polish:
 som_imperial_breadbasket_town_rights: "Spichlerz Imperium Osmańskiego"
 som_imperial_breadbasket_town_rights_desc: "Tej lokacji powierzono zaopatrywanie stolicy cesarstwa i armii sułtana; jej spichlerze rozbudowano, by wyżywić wielkie miasto. Zboże napływa pod nadzorem państwa, żywiąc zarówno mieszczan, jak i żołnierzy."
