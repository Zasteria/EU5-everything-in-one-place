l_polish:
 bul_chitalishte_rights: "Miasto czytelni"
 bul_chitalishte_rights_desc: "Miasto, w którym zakorzeniło się ruch kulturalny skupiony wokół „czytelni” (chitalishte). Rozprzestrzenia się świadomość narodowa i piśmienność, choć uwaga mieszczan zwraca się bardziej ku nauce i oświacie niż ku produkcji."
