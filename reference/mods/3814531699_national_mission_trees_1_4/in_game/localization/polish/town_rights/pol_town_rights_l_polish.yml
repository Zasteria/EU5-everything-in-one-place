l_polish:
 pol_royal_breadbasket_town_rights: "Królewski Spichlerz Polski"
 pol_royal_breadbasket_town_rights_desc: "Tej lokacji powierzono gromadzenie zboża królestwa na eksport Wisłą; jej spichlerze rozbudowano z myślą o tym zadaniu. Zboże napływa z dóbr szlachty i odpływa do portów bałtyckich, żywiąc zarówno mieszczan, jak i kupców."
