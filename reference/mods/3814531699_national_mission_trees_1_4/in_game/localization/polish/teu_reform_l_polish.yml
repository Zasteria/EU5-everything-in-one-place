l_polish:
 teu_crusade_path_reform: "Dyscyplina Zakonu Krzyżowego"
 teu_crusade_path_reform_desc: "Ślub dyscypliny, nałożony przez Wielkiego Mistrza na wszystkich rycerzy-mnichów na początku Krucjaty Wschodniej. Grabież zostaje obrócona w narzędzie zorganizowanej wyprawy, a wojsko prowadzone jest pod sztandarem świętej wojny."
 teu_northern_crusade_reform: "Żelaznokrzyżowy reżim grabieży"
 teu_northern_crusade_reform_desc: "Panowanie terroru wzniesione pod cieniem krzyża. Bogactwo bezlitośnie wydobywane jest z podbitych ziem, a opornych sprzedaje się w niewolę. Dawne ideały świętej wojny wyblakły; Zakon nie jest już zwykłym bractwem krzyżowym, lecz państwem wojskowym zbudowanym na podboju i wyzysku."
 teu_northern_crusade_reform_loot_tt: "Zadaje szkody z grabieży zajętym prowincjom (z czasem zanika)"
