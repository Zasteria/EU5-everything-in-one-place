l_turkish:
 eth_mobile_court_reform_tooltip: "Başkent her taşındığında yeni başkent konumu geçici bir fayda kazanır"
 eth_mobile_court_reform: "Gezici Ordugâh (Ketema)"
 eth_mobile_court_reform_desc: "Sabit bir başkent olmadan, İmparator’un, ordusunun, sarayının ve kilisesinin diyarı durmaksızın dolaştığı eşsiz bir yönetim tarzı: başkent taşıma yükünü hafifletir ve İmparator’un ziyaret ettiği her toprağa bereket getirir."
 STATIC_MODIFIER_NAME_eth_mobile_court_mod: "İmparatorluk Ordugâhının (Ketema) Bereketi"
 STATIC_MODIFIER_DESC_eth_mobile_court_mod: "İmparator’un sarayı burada konakladı ve bu topraklara kalabalık ve refah getirdi (zamanla azalır)."
