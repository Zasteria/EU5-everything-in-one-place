 eng_welsh_principality: "Müttefik Prenslik"
 eng_welsh_principality_plural: "Müttefik Prenslikler"
 eng_welsh_principality_desc: "Rekabet yerine ortaklığı seçmiş bir krallığa verilen özel statü: hükümdar onu saldırı savaşlarına katılmaya zorlayamaz ve bu prenslik kendi başına savaş ilan etme hakkına bile sahiptir. Karşılığında ilhak fiilen imkânsızdır ve iki diyar bu eşsiz bağ altında birlikte gelişir."
