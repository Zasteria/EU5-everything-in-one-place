l_turkish:
 boh_feudal_city_rights: "Feodal Şehir"
 boh_feudal_city_rights_desc: "Güçlü soylu egemenliği altında bir feodal şehir. Köylü özgürlüklerinin kısıtlanması bölgesel denetim ve toplumsal istikrar getirir."
 boh_ecclesiastical_city_rights: "Kilise Şehri"
 boh_ecclesiastical_city_rights_desc: "Din adamlarınca yönetilen dinî bir şehir. Din değiştirmenin teşviki ve manevi otorite bölgesel dinî birliği ilerletir."
