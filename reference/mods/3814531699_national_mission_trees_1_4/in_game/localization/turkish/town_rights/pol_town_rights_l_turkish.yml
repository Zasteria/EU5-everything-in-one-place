l_turkish:
 pol_royal_breadbasket_town_rights: "Polonya Krallığı Tarım Merkezi"
 pol_royal_breadbasket_town_rights_desc: "Bu konum, krallığın tahılını Vistül boyunca ihraç edilmek üzere toplamakla görevlendirildi; ambarları bu iş için genişletildi. Tahıl soyluların topraklarından akıp Baltık limanlarına gider ve hem halkı hem tüccarları besler."
