 som_imperial_breadbasket_town_rights: "Osmanlı İmparatorluk Tarım Merkezi"
 som_imperial_breadbasket_town_rights_desc: "Bu konum, imparatorluk başkentinin ve sultanın ordularının erzakını sağlamakla görevlendirildi; ambarları büyük şehri doyurmak üzere genişletildi. Tahıl devlet gözetiminde akarak hem halkı hem askerleri besler."
