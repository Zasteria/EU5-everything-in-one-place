l_turkish:
 teu_crusade_path_reform: "Haçlı Tarikatı’nın Disiplini"
 teu_crusade_path_reform_desc: "Büyük Üstat’ın Doğu Haçlı Seferi’nin başında tüm şövalye keşişlere yüklediği disiplin yemini. Yağma, düzenli bir seferin aracı kılınır ve ordu kutsal savaşın sancağı altında komuta edilir."
 teu_northern_crusade_reform: "Demir Haç Yağma Rejimi"
 teu_northern_crusade_reform_desc: "Haçın gölgesinde kurulmuş bir terör saltanatı. Fethedilen topraklardan zenginlik acımasızca sökülür, direnenler köle olarak satılır. Kutsal savaşın eski ideallerinin rengi solmuştur; Tarikat artık salt bir haçlı kardeşliği değil, fetih ve sömürü üzerine kurulu askeri bir devlettir."
 teu_northern_crusade_reform_loot_tt: "İşgal altındaki konumlarda yağma hasarı verir (zamanla azalır)"
