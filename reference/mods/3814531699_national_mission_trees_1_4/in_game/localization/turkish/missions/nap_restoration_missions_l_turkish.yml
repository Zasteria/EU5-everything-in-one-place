 nap_restoration_mission_pack: "Napoli Krallığı’nın Yolu"
 nap_restoration_mission_pack_DESCRIPTION:0 "Sicilya’yı kaybeden krallık Akdeniz’de yeniden birleşmeyi ve gücünün yeniden kurulmasını arıyor. Anjou Hanedanı’nın kanı ve görkemi altında Napoli merkezli yeni bir altın çağ inşa et."
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Napoli Krallığı olarak görevleri tamamla ve Sicilya’nın yeniden birleşmesi ve Latin İmparatorluğu’nun yeniden kuruluşu için çalış."
 nap_restoration_mission_pack_BUTTON_TOOLTIP:0 "Napoli Krallığı’nın yolunda yürümek için görevleri tamamla."
 nap_restoration_mission_pack_BUTTON_DETAILS:0 "İkiye bölünmüş Sicilya Krallığı’nı yeniden birleştir ve adını batı Akdeniz’in efendisi ve eski Latin İmparatorluğu’nun varisi olarak tarihe kazı!"
