 nap_charles_dream: "I. Charles’ın Hayali"
 nap_never_die_without_seeing_naples: "Napoli’yi Gör ve Öl"
 nap_latin_empire: "Latin İmparatorluğu"
 nap_new_capital_of_sicily_desc: "Sicilya’yı kaybettiğimiz için Palermo yerine Napoli’yi yeni başkentimiz seçtik. Bu şehir krallığa layık bir makama dönüştürülmelidir."
 nap_apulian_granary_desc: "Apulia’nın bereketli ovaları uzun süredir tahıl kaynağı olarak ünlüdür. Hasadı halkımızı besler ve krallığın başlıca ihraç malını oluşturur. Apulia ayrıca Otranto Boğazı’nın karşısında Yunanistan’a bakar ve onu hayati bir ileri üs yapar."
 nap_control_of_transumanza_desc: "Abruzzo ve Molise’de uygulanan geleneksel hayvancılık göçü olan trashumansa bu bölgelerin ekonomik belkemiğini oluşturur. Devlet tratturi’leri yönetir ve çobanları korursa yün, peynir ve diğer malların üretimi gelişecektir."
 nap_patronage_of_diverse_arts_desc: "Sicilya Yunanlılar, Kartacalılar, Romalılar, Almanlar, Araplar, Normanlar ve Fransızlar tarafından geçildi ve kültürleri burada karıştı. Bu kültürel çeşitliliğe kök salmış sanat Sicilya’nın gerçek sanatıdır."
 nap_dynastic_stability_desc: "Sicilya’da hiçbir istikrarlı hanedan hiç kök salmadı ve bu defalarca yabancı istilayı davet etti. Hanedanı istikrara kavuşturmak Sicilya’nın kendisinin istikrarına giden en kesin yoldur."
 nap_southern_renaissance_desc: "İstikrarlı ve itibarlı bir saraya çekilen diyarın dört bir yanından sanatçılar ve bilginler Napoli’ye de bir rönesans getirdi: kuzey İtalya’nınkinden farklı, saray öncülüğünde bir kültür burada şimdi çiçek açıyor."
 STATIC_MODIFIER_NAME_nap_new_capital_mod: "Yeni Bir Başkent"
 STATIC_MODIFIER_DESC_nap_new_capital_mod: "Napoli krallığa layık bir makama dönüştürüldü ve şehrin büyümesini ve üretkenliğini teşvik ediyor."
 STATIC_MODIFIER_NAME_nap_apulian_granary_mod: "Apulia’nın Tahıl Ambarı"
 STATIC_MODIFIER_DESC_nap_apulian_granary_mod: "Apulia’nın bereketli toprakları burada ham madde üretimini kalıcı olarak destekliyor."
 STATIC_MODIFIER_NAME_nap_control_of_transumanza_mod: "Trashumansa’nın Denetimi"
 STATIC_MODIFIER_DESC_nap_control_of_transumanza_mod: "Çobanların korunması ve tratturi’lerin yönetimi burada ham madde üretimini kalıcı olarak artırdı."
 STATIC_MODIFIER_NAME_nap_patronage_of_diverse_arts_mod: "Çeşitli Sanatların Himayesi"
 STATIC_MODIFIER_DESC_nap_patronage_of_diverse_arts_mod: "Birçok kültüre kök salmış sanatçılar sarayda toplandı ve krallığın prestijini ve diğer inançlara hoşgörüsünü artırdı."
 STATIC_MODIFIER_NAME_nap_dynastic_stability_mod: "Hanedan İstikrarı"
 STATIC_MODIFIER_DESC_nap_dynastic_stability_mod: "İstikrarlı bir hanedan altında tacın meşruiyeti büyür ve iç huzursuzluk hafifler."
 STATIC_MODIFIER_NAME_nap_southern_renaissance_mod: "Güney Rönesansı"
 STATIC_MODIFIER_DESC_nap_southern_renaissance_mod: "Napoli’de toplanan sanatçılar zanaatlarını ilerletti ve krallığın hizmetine giren yeni sanatçıların becerisi arttı."
 nap_divided_kingdom_desc: "1282’de Sicilya halkı Anjou Hanedanımızın yönetimine karşı ayaklandı ve Aragon Hanedanı’nı yeni kralları olarak karşıladı. O zamandan beri Sicilya Krallığı ikiye bölündü. Biz Napoli merkezli anakarayı yönetiyoruz, ama Sicilya adasını geri almak hanedanımıza emanet edilen tarihî görev olmayı sürdürüyor."
 nap_papal_blessing_desc: "I. Charles Sicilya Krallığı’nı Papa’nın daveti üzerine fethettiğinden beri hanedanımız Papalıkla yakın bağlar sürdürdü. Papa’nın güvenini korumak yönetimimizin meşruiyetini sürdürmek için esastır."
 nap_army_buildup_desc: "Sicilya’yı geri alma mücadelesine hazırlanmak için krallığın daimi ordusunu güçlendir. Güçlü bir ordu kuzey İtalya’daki herhangi bir müdahale veya anakaradaki isyanı bastırmak için de gerekli olacak."
 nap_match_aragon_navy_desc: "Sicilya Boğazı’na komuta eden Aragon filosuna karşı koymak için krallığımızın da güçlü bir donanmaya sahip olması gerekir. Denize hükmeden zamanla Sicilya’ya da hükmeder."
 nap_sword_of_the_guelphs_desc: "Güelfler (papalık yanlısı hizip) ile Gibeller (imparatorluk yanlısı hizip) arasındaki mücadele tüm kuzey İtalya’yı sarsıyor. Papa’nın müttefiki olarak krallığımız Güelflerin Kılıcı olarak bu mücadeleye katılıp nüfuzumuzu kuzeye genişletme fırsatını değerlendirebilir."
 nap_sicilian_reunification_war_desc: "Nihayet ordularımızı Sicilya adasına gönderme vakti geldi. Aragon garnizonunu kırıp Palermo’yu ele geçirebilirsek ikiye yırtılan krallığı yeniden birleştirmenin yolu açılacak."
 nap_invest_in_provence_desc: "Anjou Hanedanı’nın doğum yeri Provence Kontluğu hanedanımızla hâlâ derin bağlara sahip. Buraya yapılacak yatırım batıda bir tutunak kurarken ata yurduyla bağımızı da güçlendirecek."
 STATIC_MODIFIER_NAME_nap_papal_blessing_mod: "Papalık Desteği"
 STATIC_MODIFIER_DESC_nap_papal_blessing_mod: "Papalıkla yakın bağlarımız sayesinde dinî nüfuzumuz istikrarla büyüyor."
 STATIC_MODIFIER_NAME_nap_army_buildup_mod: "Yeniden Düzenlenen Kraliyet Ordusu"
 STATIC_MODIFIER_DESC_nap_army_buildup_mod: "Yeni yeniden düzenlenen kraliyet ordusu yüksek moral ve bol insan gücü yedeklerine sahiptir."
 STATIC_MODIFIER_NAME_nap_match_aragon_navy_mod: "Aragon Karşıtı Filo"
 STATIC_MODIFIER_DESC_nap_match_aragon_navy_mod: "Aragon’a karşı koymak için inşa edilen kraliyet filosu yüksek moral ve hızlı hareket kabiliyetine sahiptir."
 STATIC_MODIFIER_NAME_nap_sword_of_the_guelphs_mod: "Güelflerin Kılıcı"
 STATIC_MODIFIER_DESC_nap_sword_of_the_guelphs_mod: "Papalığın kılıcı olarak kuzey İtalya çekişmesine müdahale eden ordumuz kuşatma sanatında ve disiplinde ustalaştı."
 STATIC_MODIFIER_NAME_nap_sicilian_reunification_war_mod: "Sicilya’nın Yeniden Birleşme Savaşı"
 STATIC_MODIFIER_DESC_nap_sicilian_reunification_war_mod: "Sicilya için şiddetli savaşı atlatan kraliyet ordusu daha fazla asker çıkarabilir ve savaşın yükü diyarın üzerine daha hafif biner."
 STATIC_MODIFIER_NAME_nap_invest_in_provence_mod: "Provence’a Yatırım"
 STATIC_MODIFIER_DESC_nap_invest_in_provence_mod: "Anjou Hanedanı için Provence “yuva”ydı. Napoli’yi kaybettikten sonra Kral René hayatının geri kalanını Provence’ta geçirdi ve Aix-en-Provence’ı bir kültür merkezine dönüştürdü. Napoli ile Provence arasındaki bağ derin; Anjou Hanedanı’nın kanı ve tarihiyle bağlanmıştır."
 nap_events.1.t: "İkiye Bölünmüş Bir Krallık"
 nap_events.1.d: "1282’de Sicilya halkı Sicilya Vespers olarak bilinen ayaklanmada Anjou Hanedanı’nın yönetimini devirdi. Fransa’dan gönderilen memurların zulmüne artık dayanamayan adanın halkı akşam çanlarının sesiyle tek vücut olarak ayağa kalktı ve Fransızları kıyılarımızdan kovdu. Aragon Kralı III. Pedro’yu yeni hükümdarları olarak karşıladılar ve Sicilya Krallığı böylece ikiye bölündü. Biz Napoli’den anakarayı yönetirken hâlâ Sicilya’nın meşru kralıyız, ama boğazın ötesinde Aragon Hanedanı’nın bir kolu adanın kendisini aynı unvanla elinde tutuyor. İki diyar arasındaki rekabet bugüne kadar sürüyor."
 nap_events.1.a: "Anlaşıldı"
 nap_cross_the_strait_of_otranto_desc: "Yalnızca 70 kilometre genişliğindeki Otranto Boğazı İtalya ile Balkan yarımadaları arasındaki deniz kapısıdır. Onu geçip Arnavutluk’ta bir tutunak kurabilirsek filolarımız ve ticaret gemilerimiz Doğu’ya doğru daha fazla yol kazanacak."
 nap_influence_over_the_papacy_desc: "İç istikrarı korurken Papalıkla bağlarımızı daha da derinleştirirsek hanedanımız Kutsal Makam üzerinde göz ardı edilemeyecek bir nüfuz kullanır hale gelecek."
 nap_the_bells_fall_silent_desc: "Sicilya adası yeniden bizim ve ikiye yırtılmış krallık bütün hâle getirildi. Bir zamanlar krallığı parçalayan “çanlar”ın bir daha asla çalmaması için yönetimimizi özenle pekiştirmeliyiz."
 nap_defeat_of_aragon_desc: "Sicilya’sını elinden alınan Aragon Hanedanı artık krallığımıza eskiden olduğu gibi bir tehdit değil. Aragon’un kendisi yıkılabilirse ya da tacı hükümranlığımız altına alınabilirse Akdeniz’in karşı yakasındaki uzun rekabet nihayet sona erdirilebilir."
 nap_expand_influence_in_southern_france_desc: "Provence’taki tutunağımızdan nüfuzumuz artık Rhône boyunca Lyon’a kadar uzanıyor. Güney Fransa genelindeki varlığımız büyümeyi sürdürüyor."
 nap_western_mediterranean_hegemony_desc: "Batı Akdeniz’in iki büyük kalesi Sardinya’yı ve Balear Adaları’nı ele geçirebilirsek filolarımız Cenova’dan İberya’ya sulara komuta edecek ve bizi batı denizinin rakipsiz efendileri yapacak."
 STATIC_MODIFIER_NAME_nap_cross_the_strait_of_otranto_mod: "Otranto’nun Ötesinde Bir Tutunak"
 STATIC_MODIFIER_DESC_nap_cross_the_strait_of_otranto_mod: "Arnavutluk’taki tutunağımız filolarımızın ve ticaret gemilerimizin daha uzağa yelken açmasına izin veriyor."
 STATIC_MODIFIER_NAME_nap_influence_over_the_papacy_mod: "Papalık Üzerinde Nüfuz"
 STATIC_MODIFIER_DESC_nap_influence_over_the_papacy_mod: "Papalıkla bağlarımız derinleşti ve yönetimimizin meşruiyetini ve sapkınlara hoşgörümüzü güçlendiriyor."
 STATIC_MODIFIER_NAME_nap_the_bells_fall_silent_mod: "Sessiz Çanlar"
 STATIC_MODIFIER_DESC_nap_the_bells_fall_silent_mod: "Yeniden birleşen krallığın yönetimi istikrara kavuştu; halkın hoşnutsuzluğu yatıştı ve tacın meşruiyeti arttı."
 STATIC_MODIFIER_NAME_nap_defeat_of_aragon_mod: "Aragon’un Yenilgisi"
 STATIC_MODIFIER_DESC_nap_defeat_of_aragon_mod: "Aragon ile Anjou Hanedanı arasındaki çatışma 1282 Sicilya Vespers’ıyla başladı ve V. Alfonso’nun 1442’de Napoli’yi fethine kadar 160 yılı aşkın sürdü. Bu eski düşmanı nihayet yenmek Napoli Krallığı tarihinin en büyük intikamının tamamlanması demek olurdu."
 STATIC_MODIFIER_NAME_nap_expand_influence_in_southern_france_mod: "Güney Fransa’da Nüfuz"
 STATIC_MODIFIER_DESC_nap_expand_influence_in_southern_france_mod: "Krallığın güney Fransa genelindeki ticari ve diplomatik varlığı büyümeyi sürdürüyor."
 STATIC_MODIFIER_NAME_nap_western_mediterranean_hegemony_mod: "Batı Akdeniz Hegemonyası"
 STATIC_MODIFIER_DESC_nap_western_mediterranean_hegemony_mod: "Sardinya’yı ve Balear Adaları’nı fetheden filomuz tüm batı Akdeniz’e komuta ediyor ve morali yüksek."
 nap_anjou_hungary_desc: "Anjou Hanedanımızın yalnızca Napoli’de değil Macaristan’da da yan kolları vardır. Ortak kanlı iki diyarımız arasındaki bağlar derinleşirse Macar tacı üzerinde hak iddia etmek için haklı bir gerekçe bulabiliriz."
 nap_foothold_in_northern_italy_desc: "Toskana’da bir tutunak güvenceye alabilirsek Floransa ve Piza gibi kuzey İtalya’nın zengin şehir devletleriyle bağlarımızı derinleştirebilir ve yarımada genelindeki her askerî seferde avantaj kazanabiliriz."
 nap_crossroads_of_civilizations_desc: "Sicilya Krallığı uzun süredir Yunan, Roma, Arap ve Norman medeniyetlerinin kavşağında durdu. Sarayımızda toplanan geniş sanat koleksiyonu krallığımızın gerçekten bir medeniyetler kavşağı olduğunun kanıtıdır."
 nap_anjou_homeland_desc: "Angers güvence altına alındığında nüfuzumuz artık Anjou Hanedanımızın ata yurduna uzanıyor. Atalarımızın topraklarıyla bu bağ bize Fransız tahtının kendisi üzerinde bir hak iddiası bile getirebilir."
 nap_french_throne_claim_desc: "Anjou Hanedanı Fransız kraliyet hattının bir yan kolu olarak doğdu. Paris’in kendisini güvenceye alabilirsek ya da Fransız tacıyla şahsi birlik kurabilirsek kralımız hem Fransa’nın hem Napoli’nin tacını takacak."
 STATIC_MODIFIER_NAME_nap_foothold_in_northern_italy_mod: "Kuzey İtalya’da Bir Tutunak"
 STATIC_MODIFIER_DESC_nap_foothold_in_northern_italy_mod: "Toskana şehirleriyle bağlarımız askerî kazanımları yarımada genelinde daha verimli biçimde savaş puanına çevirmemize imkân veriyor."
 STATIC_MODIFIER_NAME_nap_crossroads_of_civilizations_mod: "Medeniyetlerin Kavşağı"
 STATIC_MODIFIER_DESC_nap_crossroads_of_civilizations_mod: "Sarayımızda toplanan geniş sanat koleksiyonu krallığın kültürel nüfuzunu komşu topraklara yaymayı sürdürüyor."
 STATIC_MODIFIER_NAME_nap_anjou_homeland_mod: "Anjou’nun Ata Toprakları"
 STATIC_MODIFIER_DESC_nap_anjou_homeland_mod: "Anjou Hanedanı’nın adı Loire üzerindeki bir şehir olan Fransa’daki Angers’den gelir. Plantagenet İngiltere’sini kuran II. Henry aynı zamanda Anjou Kontuydu. Ata yurdu Angers ile bağı yeniden kurmak tüm Avrupa’daki Anjou ağını yeniden canlandırır."
 STATIC_MODIFIER_NAME_nap_king_of_france_mod: "Fransa Kralı"
 STATIC_MODIFIER_DESC_nap_king_of_france_mod: "Capetler’in torunları olan Anjou Hanedanı Capet hükümdarının tacını alıyor: tarihin tersine dönüşü. Fransa’nın “En Hıristiyan Kral” unvanı Avrupa’nın en otoriter unvanlarından biridir ve onu kazanmakla güney İtalya’nın bir hanedanı tüm Hıristiyan dünyasının siyasi zirvesine yükselir."
 nap_mediterranean_greatest_city_desc: "Napoli’nin nüfusu artık Akdeniz’de bile nadir bir ölçeğe ulaştı. Antik Roma’dan beri bu denizdeki hiçbir şehir böyle bir refah bilmedi."
 nap_university_of_frederick_ii_desc: "II. Friedrich’in kurduğu Napoli Üniversitesi krallığın ilim merkezidir. Onu sanat ve ilim salonlarıyla donatarak şöhreti tüm Avrupa’ya yayılacak."
 nap_magnificent_royal_palace_desc: "Kraliyet sarayında bahçeler düzenlemek tacın görkemini hem tebaaya hem yabancılara sergilemek için esaslı bir girişimdir. Muhteşem bahçeler ziyaret eden herkese krallığın refahını anlatacak."
 nap_expansion_of_naples_port_desc: "Napoli limanında bir rıhtım inşa ederek gemiler daha verimli biçimde onarılıp inşa edilebilir ve bu kraliyet filosunun bakımına ve büyümesine büyük ölçüde yardım eder."
 nap_subjugation_of_epirus_desc: "Otranto Boğazı’nı geçip bir tutunak kuran kuvvetlerimiz nihayet tüm Epiros’a boyun eğdirdi. Arnavutluk kıyısı artık krallığın yönetimi altında."
 nap_caserta_palace_desc: "Caserta’da yeni bir saray yükseltmek tacın görkemini sergilerken kraliyet ailesine Napoli sarayından uzakta sessiz bir yönetim makamı verecek."
 nap_charles_dream_desc: "I. Charles bir zamanlar doğu Akdeniz’de haçlı ruhunun bir uzantısı olan büyük bir imparatorluk kurmayı hayal etti. Şimdi Mora’da bir tutunakla bu hayal bir kez daha şekillenmeye başlıyor."
 nap_never_die_without_seeing_naples_desc: "Eski sözün dediği gibi “Napoli’yi gör ve öl”: Napoli dünyanın dört bir yanından yolcuların görmeyi özlediği bir şehir oldu. Güzelliği ve refahı nesiller boyu anılacak."
 nap_latin_empire_desc: "Sicilya Krallığı artık salt bölgesel bir güç değil. Batıda Akdeniz’e komuta ediyor; doğuda Mora’dan İstanbul’a giden yol önünde açık duruyor. Şimdi dünyanın önünde kendini eski Latin İmparatorluğu’nun varisi ilan etme vakti."
 STATIC_MODIFIER_NAME_nap_mediterranean_greatest_city_mod: "Akdeniz’in En Büyük Şehri"
 STATIC_MODIFIER_DESC_nap_mediterranean_greatest_city_mod: "Napoli Akdeniz’in büyük şehirlerinden biri oldu ve üretkenliği ve büyümesi komşularını çok geride bırakıyor."
 STATIC_MODIFIER_NAME_nap_university_of_frederick_ii_mod: "II. Friedrich Üniversitesi"
 STATIC_MODIFIER_DESC_nap_university_of_frederick_ii_mod: "Napoli Üniversitesi’nde toplanan bilginler krallığa yeni bilgi ve yenilik getiriyor."
 STATIC_MODIFIER_NAME_nap_magnificent_royal_palace_mod: "Muhteşem Kraliyet Sarayı"
 STATIC_MODIFIER_DESC_nap_magnificent_royal_palace_mod: "Kraliyet sarayının görkemli bahçeleri krallığın prestijini ve tacın meşruiyetini herkese gösteriyor."
 STATIC_MODIFIER_NAME_nap_expansion_of_naples_port_mod: "Napoli Limanı’nın Genişlemesi"
 STATIC_MODIFIER_DESC_nap_expansion_of_naples_port_mod: "Vezüv Dağı’nı arka plan alan Napoli Körfezi antik çağdan beri doğal bir liman olarak işlev gördü. Anjou ve Aragon dönemlerinde inşa edilen liman tesisleri Doğu baharatlarının, Kuzey Afrika tahılının ve İber yününün geçtiği büyük bir Akdeniz ticaret merkezi oldu."
 STATIC_MODIFIER_NAME_nap_subjugation_of_epirus_mod: "Epiros’a Boyun Eğdirme"
 STATIC_MODIFIER_DESC_nap_subjugation_of_epirus_mod: "Epiros seferini atlatan kraliyet ordusu daha fazla asker çıkarabilir ve savaşın yükü diyarın üzerine daha hafif biner."
 STATIC_MODIFIER_NAME_nap_caserta_palace_mod: "Caserta Sarayı"
 STATIC_MODIFIER_DESC_nap_caserta_palace_mod: "Vanvitelli’nin tasarladığı (1752’de başlandı) Caserta Sarayı Versay ile boy ölçüşen bir ölçeğe sahipti ve Burbon Napoli Krallığı’nın prestijini simgeledi. 1.200’den fazla oda, üç kilometre uzunluğunda bahçeler, bir su kemeriyle beslenen çeşmeler: bu muhteşem sarayın var olmasından önce zemini hazırlamak bu görevin amacıdır."
 STATIC_MODIFIER_NAME_nap_charles_dream_mod: "I. Charles’ın Hayali"
 STATIC_MODIFIER_DESC_nap_charles_dream_mod: "Doğuya yönelik eski emel yeniden yanıyor ve krallığın prestijini ve ordularının moralini yükseltiyor."
 STATIC_MODIFIER_NAME_nap_never_die_without_seeing_naples_mod: "Napoli’yi Gör ve Öl"
 STATIC_MODIFIER_DESC_nap_never_die_without_seeing_naples_mod: "“Napoli’yi gör ve öl” (Vedi Napoli e poi muori): 18. yüzyıl Avrupalı gezginleri bunu böyle sözle bıraktı, çünkü Napoli, Vezüv Dağı’yla, körfezin görkemli manzarasıyla, antik kalıntılarıyla ve canlı sokaklarıyla ziyaret eden herkesi bunalttı."
 STATIC_MODIFIER_NAME_nap_latin_empire_mod: "Latin İmparatorluğu"
 STATIC_MODIFIER_DESC_nap_latin_empire_mod: "Yeniden kurulan Latin İmparatorluğu’nun görkemi Akdeniz’e yayılıyor, krallığın prestijini ve meşruiyetini yükseltiyor ve savaş müzakerelerindeki elini hiç olmadığı kadar güçlendiriyor."
