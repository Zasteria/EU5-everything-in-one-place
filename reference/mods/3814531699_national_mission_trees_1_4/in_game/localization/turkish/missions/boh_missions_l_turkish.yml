l_turkish:
 boh_crown_of_bohemia_mission_pack: "Bohemya Tacı’nın Şanı"
 boh_crown_of_bohemia_mission_pack_DESCRIPTION:0 "1337’de Bohemya, Lüksemburg Hanedanı’ndan I. Jan’ın (Kör Kral) yönettiği güçlü bir Orta Avrupa krallığıdır. Bohemya’nın çalkantılı tarihinde at koştur: Kutsal Roma İmparatoru IV. Karl, Charles Üniversitesi’nin kuruluşu, Altın Bula; Jan Hus’un idamından Hus Savaşları’nın Wagenburg taktiklerine. Moravya’yı, Silezya’yı ve Slovakya’yı birleştir, Kutsal Roma İmparatorluğu’nun hâkimiyeti için Habsburglara meydan oku ve Bohemya Ortak Devleti’ni kur."
 boh_crown_of_bohemia_mission_pack_CRITERIA_DESCRIPTION:0 "Bohemya olarak imparatorluk hâkimiyetini, kültürel çiçeklenmeyi ve güney fethini başararak Bohemya Ortak Devleti’ni kur."
 boh_crown_of_bohemia_mission_pack_BUTTON_TOOLTIP:0 "Bohemya Ortak Devleti’ni kurmak için görevleri tamamla."
 boh_crown_of_bohemia_mission_pack_BUTTON_DETAILS:0 "Kör Kral’ın iradesini sürdür: Altın Prag’dan bir Orta Avrupa İmparatorluğu’na!"
 boh_crown_of_jan: "Kör Kral’ın Tacı"
 boh_crown_of_jan_desc: "1337: Kör Kral I. Jan, Orta Avrupa’nın en güçlü hükümdarlarından biri olarak Bohemya’yı yönetiyor. “Göremiyorum ama hâlâ savaşabilirim”: Kör Kral’ın ruhu Bohemya’nın gururudur. 1346’daki Crécy Muharebesi’ndeki kahramanca ölümünden önce Lüksemburg Hanedanı’nı Avrupa’nın en büyük hanedanlarından birine yükseltti. Prag’ı kraliyet başkenti olarak kur ve krallığın temellerini pekiştir."
 boh_lion_of_empire: "İmparatorluğun Aslanı"
 boh_lion_of_empire_desc: "Bohemya Kralı, Kutsal Roma İmparatorluğu’nun en güçlü seçici prensidir. İmparatorluktaki her prens Bohemya’nın kılıcı önünde eğilmelidir. Askerî güç ve prestij yoluyla “İmparatorluğun Aslanı” konumunu kur."
 boh_challenge_habsburg: "Habsburglara Meydan Oku"
 boh_challenge_habsburg_desc: "Orta Avrupa’nın denetimi için Bohemya’nın en büyük rakibi olan Habsburg Hanedanı, Avusturya üssünden imparatorluk hâkimiyeti peşinde. Bohemya muhalefetini açıkça ortaya koymalıdır."
 boh_saxony_ambitions: "Saksonya Emelleri"
 boh_saxony_ambitions_desc: "Kalbinde Dresden olan Saksonya, Elbe boyunca önemli bir ticaret ve kültür merkezidir. Saksonya seçici prensliğini denetim altına al ve Bohemya’nın imparatorluk nüfuzunu daha da genişlet."
 boh_conquer_austria: "Avusturya’yı Fethet"
 boh_conquer_austria_desc: "Viyana düşer ve Habsburg’un Avusturya merkez toprakları ezilir. “Güneşi batmayan Habsburglar”ın kibri sonunda paramparça olur. Bohemya Orta Avrupa’nın gerçek efendisidir."
 boh_dominate_hre: "Kutsal Roma İmparatorluğu’na Hâkim Ol"
 boh_dominate_hre_desc: "Bohemya Kutsal Roma İmparatorluğu’na hâkim olur. IV. Karl’ın 1355’te gerçekleştirdiği imparatorluk unvanının ötesinde, Bohemya artık tüm İmparatorluğun tartışmasız lideri olarak hüküm sürer."
 boh_develop_prague: "Prag’ı Geliştir"
 boh_develop_prague_desc: "“Yüz Kulenin Şehri” Prag: Vltava’nın iki yakasına yayılan bu şehir 14. yüzyılda Orta Avrupa’nın en büyük şehri olarak altın çağına girdi. Prag Kalesi, Karl Köprüsü ve Eski Şehir Meydanı Bohemya krallığının görkemini dünyaya ilan eder."
 boh_charles_university: "Charles Üniversitesi"
 boh_charles_university_desc: "1348’de IV. Karl Prag’da Charles Üniversitesi’ni kurdu: Orta Avrupa’nın ilk üniversitesi. İlahiyat, hukuk, tıp ve felsefe kurumu Jan Hus gibi büyük reformcular yetiştirdi. Bu tarihî dönüm noktasına ulaşmak için 1348’den sonra Prag’da bir üniversite inşa et."
 boh_golden_bull: "Altın Bula"
 boh_golden_bull_desc: "IV. Karl’ın 1356’da yayımladığı Altın Bula, Kutsal Roma İmparatorluğu’nun seçim sistemini kodifiye etti ve Bohemya Kralı’nı İmparatorluğun en önemli seçici prensi olarak belirledi. Bohemya’nın hukukî ve siyasi konumunu sarsılmaz kıl."
 boh_bohemian_glass: "Bohemya Camı"
 boh_bohemian_glass_desc: "Bohemya’nın kristal berraklığındaki sularından ve bol kuvars kumundan doğan Bohemya camı, nefis güzelliğiyle Avrupa’nın saraylarında kıymetlidir. “Bohemya kristali” Avrupa’nın en seçkin kalitesiyle eş anlamlı hâle gelsin diye bu sanayiyi geliştir."
 boh_silver_mines: "Kutná Hora Gümüş Madenleri"
 boh_silver_mines_desc: "Kutná Hora gümüş madenleri 14. yüzyıl Avrupa’sının en üretken madenleriydi. Prag Groşeni olarak basılan bu gümüş Orta Avrupa’da dolaştı ve Bohemya’nın ekonomik altın çağını ayakta tuttu."
 boh_develop_moravia: "Moravya’yı Geliştir"
 boh_develop_moravia_desc: "Brno ve Olomouc merkezli Moravya, Bohemya Taç Toprakları’nın önemli bir parçasıdır. Bu verimli tarım bölgesini Bohemya İmparatorluğu’nun ikinci kültürel ve idari merkezi olarak geliştir."
 boh_internal_prosperity: "İç Refah"
 boh_internal_prosperity_desc: "Bohemya camı, Kutná Hora gümüşü ve Prag’ın ticaret pazarları: bir araya geldiklerinde Bohemya’yı Orta Avrupa’nın en büyük ekonomik gücü yapar."
 boh_jan_hus_question: "Jan Hus Meselesi"
 boh_suppress_heresy: "Sapkınlığı Bastır"
 boh_suppress_heresy_desc: "Bohemya Roma Kilisesi’ne bağlılığını sürdürür. Husçuları sapkın olarak bastırarak ve Katolik inancı devletin temel taşı kılarak Papa ile sağlam bir ittifak kurulur."
 boh_crusade_against_hussites: "Husçulara Karşı Haçlı Seferi"
 boh_crusade_against_hussites_desc: "Papa Husçulara karşı bir haçlı seferi ilan etti. Sapkınlığa karşı saldırıya öncülük eden Bohemya, Katolik Orta Avrupa’nın koruyucusu olarak itibarını kurar."
 boh_papal_champion: "Papa’nın Şampiyonu"
 boh_papal_champion_desc: "Papalıkla derin güven ve sarsılmaz Katolik inanç: Bohemya Katolik Orta Avrupa’nın en güçlü koruyucusu olarak tanınır."
 boh_hussite_reformation: "Hus Reformu"
 boh_hussite_reformation_desc: "“Yakılsa da hakikat alevlerin içinden parlar”: Jan Hus’un ruhu Bohemya’da kök salar. Kadeh (kalich) ile simgelenen Utrakvistler (Husçular) ulusun inancı olur ve Roma’dan dinî bağımsızlık kazanır."
 boh_wagenburg: "Boží Bojovníci (Tanrı’nın Savaşçıları)"
 boh_wagenburg_desc: "Jan Žižka’nın geliştirdiği Wagenburg (araba kalesi) taktiği, tahkim edilmiş arabaları savunma düzeninde birleştirerek haçlı ağır süvarisini defalarca yendi. Bohemya’nın askerî dehası çiçek açar."
 boh_king_of_heretics: "Sapkınların Kralı"
 boh_king_of_heretics_desc: "Jiří z Poděbrad, Papa tarafından aforoz edilmesine rağmen “Bohemya’nın sapkın kralı” olarak hüküm sürdü. Avrupa’nın diplomatik izolasyonu içinde prestiji koru ve Husçu devletin meşruiyetini dünyaya kanıtla."
 boh_hungarian_succession: "Macar Mirası"
 boh_hungarian_succession_desc: "Bohemya ve Macaristan, Lüksemburglar ve Jagiellonlar aracılığıyla birkaç kez şahsi birlik kurmuştur. Buda merkezli zengin Tuna krallığını Bohemya’nın üstünlüğü altına al ve Orta Avrupa hâkimiyetini pekiştir."
 boh_control_slovakia: "Slovakya’yı Denetle"
 boh_control_slovakia_desc: "Slovakya, Çek ve Slovak kardeş halklarının yaşadığı Büyük Moravya İmparatorluğu’nun atalarının yurdudur. Bu toprağı güvence altına almak Bohemya’nın Slav temellerini güçlendirir."
 boh_conquer_transylvania: "Transilvanya’yı Fethet"
 boh_conquer_transylvania_desc: "Romenlerin, Macarların ve Almanların iç içe yaşadığı “ormanın ötesindeki diyar” Transilvanya, Hıristiyan dünyasının Osmanlı İmparatorluğu’na karşı ileri kalesi olarak hizmet eder. Onu denetlemek Balkanlar’a giden yolu açar."
 boh_nicopolis_revenge: "Niğbolu’nun İntikamı"
 boh_nicopolis_revenge_desc: "1396’daki Niğbolu Muharebesi’nde Bohemyalı Sigismund’un komuta ettiği haçlı ordusu Osmanlı İmparatorluğu karşısında yıkıcı bir yenilgi aldı. O aşağılanmanın öcünü alma vakti geldi: Niğbolu’yu geri al ve Osmanlıları Balkanlar’dan kov."
 boh_defend_against_turks: "Türklere Karşı Kale"
 boh_defend_against_turks_desc: "Osmanlı İmparatorluğu Balkanlar’ı süpürüyor ve Orta Avrupa’nın kapılarına yaklaşıyor. Transilvanya’nın tahkimatını güçlendir ve güçlü bir orduyla Hıristiyan dünyasının kalkanı ol. Bohemya, Hıristiyan uygarlığının kalesi “Antemurale Christianitatis”tir."
 boh_push_into_balkans: "Balkanlar’a Doğru İlerle"
 boh_push_into_balkans_desc: "Niğbolu’nun öcünü al ve Hıristiyan dünyasının kurtarıcısı olarak güneye ilerle. Balkanlar’ın Slavları, Rumları ve Bulgarları Bohemya sancağı altında özgürleşir."
 boh_secure_silesia: "Silezya’yı Güvenceye Al"
 boh_secure_silesia_desc: "Tüm Silezya Bohemya’nın doğrudan yönetimi altına girer. Demir ve kömürle zengin bu toprak Bohemya sanayi imparatorluğunun çekirdeği olur."
 boh_polish_ambitions: "Polonya Emelleri"
 boh_polish_ambitions_desc: "Krakov’u ele geçir ve Bohemya’nın Polonya krallığıyla ilişkisini kur. Přemyslid hanedanının mirası Bohemya’ya aittir: Polonya Bohemya’nın üstünlüğü altında bir komşu olmalıdır."
 boh_conquer_poland: "Polonya’yı Fethet"
 boh_conquer_poland_desc: "Polonya topraklarının geniş ovaları Bohemya denetimine girer. Vistula’dan Oder’e Slav toprakları Bohemya kralının sancağı altında birleşir."
 boh_baltic_access: "Baltık’a Erişim"
 boh_baltic_access_desc: "Gdańsk ele geçirilince Bohemya Baltık Denizi’ne doğrudan erişim kazanır. Denize kıyısı olmayan bir ulustan dönüşen Bohemya artık kuzey ticaretine de katılır."
 boh_bohemian_diet: "Bohemya Diyeti"
 boh_bohemian_diet_desc: "Soyluların, din adamlarının ve burjuvaların katıldığı Bohemya zümreler meclisi (Zemský Sněm) siyasi bir kurumdur. Onu güçlendirmek merkezi imparatorluk yönetiminin zeminini hazırlar."
 boh_absolute_monarchy: "Mutlak Monarşi"
 boh_absolute_monarchy_desc: "Bohemya’da mutlak monarşi kurulur. Soylu ayrıcalıklarını sınırlayarak ve kraliyet gücünü tamamen pekiştirerek Bohemya modern, merkezî bir devlete dönüşür."
 boh_great_power_army: "Büyük Gücün Ordusu"
 boh_great_power_army_desc: "Wagenburg taktikleri, Kara Ordu, seçkin piyade: Bohemya’nın askerî yenilikleri Orta Avrupa’nın en güçlü ordusunu doğurur. Yüksek ordu geleneği ve büyük bir daimi güçle Bohemya’nın askerî üstünlüğünü kur."
 boh_dev_brno: "Brno’yu Geliştir"
 boh_dev_brno_desc: "Moravya’nın başkenti Brno, ticaret yollarının kavşağında bir sanayi ve ticaret şehri olarak çiçek açar."
 boh_dev_wroclaw: "Wrocław’ı Geliştir"
 boh_dev_wroclaw_desc: "Oder üzerindeki Wrocław Silezya’nın kalbidir. Çok kültürlü ticaret geleneği Bohemya İmparatorluğu’nun servetini genişletir."
 boh_amber_road: "Kehribar Yolu"
 boh_amber_road_desc: "Baltık’tan Akdeniz’e uzanan kadim Kehribar Yolu Bohemya’yı keser. Bu ticaret yolunu denetleyerek Bohemya kuzey-güney ticaretinin merkezi olur."
 boh_dev_pest: "Pest’i Geliştir"
 boh_dev_pest_desc: "Tuna’nın karşı yakasında Buda’ya bakan Pest, Macaristan’ın en büyük ticaret şehridir. Onu güneydeki Bohemya İmparatorluğu’nun ekonomi merkezi olarak geliştir."
 boh_renaissance_court: "Rönesans Sarayı"
 boh_renaissance_court_desc: "IV. Karl’ın Prag’ı İtalyan, Fransız ve Kutsal Roma kültürlerinin buluştuğu Orta Avrupa Rönesansı’nın merkeziydi. Kültürün altın çağı çiçek açarken sanatçılar, bilginler ve mimarlar Prag sarayında toplanır."
 boh_great_moravia_restored: "Büyük Moravya Yeniden Kuruldu"
 boh_great_moravia_restored_desc: "9. yüzyıl Büyük Moravya İmparatorluğu’ndan beri ilk kez tüm Bohemya, Moravya ve Silezya birleşiyor. Svatopluk ve Rastislav’ın hayali modern çağda yeniden doğuyor ve Bohemya Slav uygarlığının merkezi olarak parlıyor."
 boh_central_european_power: "Orta Avrupa Gücü"
 boh_central_european_power_desc: "Üç sütun, yani yeniden kurulan Büyük Moravya, iç refah ve mutlak monarşi bir araya gelir ve Bohemya Orta Avrupa’nın en büyük gücü olarak hüküm sürer. 500+ konum, 500+ gelir ve 80+ prestijle bu şanı ele geçir."
 boh_bohemian_commonwealth: "Bohemya Ortak Devleti"
 boh_bohemian_commonwealth_desc: "Prag, Viyana, Berlin, Krakov, Buda: Orta Avrupa’nın beş büyük şehri Bohemya sancağı altında birleşti. Kör Jan’ın 1337’de ektiği taç şimdi bir imparatorluk tacı olarak parlıyor. “Bohemia non perit”: Bohemya yok olmaz. Bu sözler tarihe sonsuza dek kazınmıştır."
 boh_krecy_legacy: "Crécy Mirası"
 boh_krecy_legacy_desc: "1346’daki Crécy Muharebesi’nde Kör Kral I. Jan körlüğüne rağmen savaş alanında durdu ve bir kahraman ölümü öldü. “Göremiyorum ama hâlâ savaşabilirim”: bu ruh Bohemya’nın savaşçı ruhuna kazınmıştır."
 boh_styria_carinthia: "Steiermark ve Karintiya"
 boh_styria_carinthia_desc: "Alpler’in eteğindeki Steiermark’a ve Karintiya’ya boyun eğdirmek Bohemya İmparatorluğu’nun güney sınırlarını belirler. Mineral ve tarım açısından zengin bu topraklar imparatorluk refahını destekler."
 boh_kutna_hora_mint: "Kutná Hora Darphanesi"
 boh_kutna_hora_mint_desc: "Kutná Hora gümüşünden basılan Prag Groşeni, 14. yüzyılda Orta Avrupa’nın en güvenilir para birimiydi. Büyük ölçekli gümüş madenciliği yoluyla Bohemya’nın parasal üstünlüğünü kur."
 boh_gothic_architecture: "Gotik Mimari Şehri"
 boh_gothic_architecture_desc: "Aziz Vitus Katedrali, Karl Köprüsü, Eski Şehir Meydanı: IV. Karl’ın inşa ettirdiği muhteşem Gotik mimari Prag’ı “Altın Şehir”e dönüştürdü. Prag’ın gelişimini yükselt ve bu mimari şanı önceden gerçekleştir."
 boh_bohemian_trade_network: "Bohemya Ticaret Ağı"
 boh_bohemian_trade_network_desc: "Viyana, Wrocław, Krakov ve Nürnberg’i birbirine bağlayan, Prag merkezli bir ticaret ağı Bohemya’nın ticari üstünlüğünü ayakta tutar."
 boh_compactata: "Prag Compactata’sı"
 boh_compactata_desc: "1436 Compactata’sı Katolik Kilisesi’ne kadehle Utrakvist komünyonunu bir taviz olarak tanıttı. Ölçülü Utrakvist yol Bohemya’ya dinî istikrar getirir."
 boh_utraquist_church: "Utrakvist Kilisesi"
 boh_utraquist_church_desc: "“Sub utraque specie” (iki türün altında): komünyon alanlara hem ekmek hem şarap veren Utrakvist Kilisesi, Bohemya’nın devlet dini olarak kurulur."
 boh_protestant_alliance: "Protestan İttifakı"
 boh_protestant_alliance_desc: "Bohemya’nın Husçu geleneği Protestan reformunun öncüsü olur. Lutherciler ve Kalvinistlerle ittifak yoluyla Bohemya Protestan dünyasının bir sütunu olarak tanınır."
 boh_black_army: "Kara Ordu"
 boh_black_army_desc: "Kral Matthias Corvinus’un örgütlediği Kara Ordu, ortaçağ Avrupası’nın ilk daimi profesyonel ordularından biridir. Bu seçkin güç Bohemya sancağı altında savaştığında Orta Avrupa’da hiçbir şey ona karşı duramaz."
 boh_dev_berlin: "Berlin’i Geliştir"
 boh_dev_berlin_desc: "Brandenburg’un küçük kasabası Berlin, Bohemya İmparatorluğu’nun kuzey idari merkezi olarak büyür."
 boh_dev_konigsberg: "Königsberg’i Geliştir"
 boh_dev_konigsberg_desc: "II. Otakar’ın kurduğu Königsberg (Kral Kalesi) Bohemya’ya döner ve Baltık ticaretinin merkezi olur."
 boh_great_king: "Büyük Kral"
 boh_great_king_desc: "Yüksek prestij, büyük meşruiyet, zengin gelir: Orta Avrupa tarihinin en büyük hükümdarlarından biri olarak Bohemya Kralı’nın adı, IV. Karl’ın şanını bile aşarak tüm Avrupa’da yankılanır."
 boh_dev_olomouc: "Olomouc Çiçek Açıyor"
 boh_dev_olomouc_desc: "Moravya’nın kadim ilim şehri ve piskoposluk merkezi Olomouc, kuzey Rönesans kültürünün merkezi olarak parlar."
 boh_upper_austria: "Yukarı Avusturya"
 boh_upper_austria_desc: "Yukarı Tuna boyunca uzanan Yukarı Avusturya Bohemya İmparatorluğu’na katılır ve güneye doğru daha fazla ilerlemenin temelini atar."
 boh_carpathian_defense: "Karpat Savunması"
 boh_carpathian_defense_desc: "Karpat Dağları boyunca bir kale ağı, Bohemya İmparatorluğu için sağlam bir doğu savunma hattı kurar: Osmanlı İmparatorluğu’na, Tatarlara ve diğer doğu tehditlerine karşı bir kalkan."
 boh_events.20.t: "Habsburg Ezildi: Bohemya Üstünlüğü"
 boh_events.20.d: "Viyana düşer ve Habsburg gururu paramparça olur. “Rudolf’tan beri süren Habsburg’un Orta Avrupa hâkimiyeti sona erdi”: bu sözler Prag sarayında yankılanıyor. Bohemya Kralı şimdi Orta Avrupa’nın gerçek efendisidir. Tarihçiler sonradan şöyle yazacak: “Lüksemburg Hanedanı İmparatorluğun gerçek varisiydi.”"
 boh_events.20.a: "Bohemya çok yaşasın! Habsburgların çağı bitti!"
 boh_events.50.t: "Büyük Moravya Yeniden Kuruldu"
 boh_events.50.d: "Bohemya, Moravya ve Silezya birleşti. Svatopluk’un kurduğu Büyük Moravya İmparatorluğu’nun çöküşünden dört yüzyıl sonra bu miras modern çağda yeniden doğuyor. Prag sarayında Bohemya Kralı “Rex Slavorum” unvanını ilan ediyor: Slavların Kralı."
 boh_events.50.a: "Büyük Moravya çok yaşasın! Slav birliğine şeref!"
 boh_events.99.t: "Bohemya Ortak Devleti’nin Doğuşu"
 boh_events.99.d: "Prag, Viyana, Berlin, Krakov, Buda: Orta Avrupa’nın beş büyük şehri Bohemya sancağı altında birleşti. Kör Jan’ın 1337’de ektiği taç şimdi bir imparatorluk tacı olarak parlıyor. Gotik katedrallerin kuleleri Prag’ın göğüne yükselirken “Bohemia non perit”, Bohemya yok olmaz, sözleri tarihe sonsuza dek kazınıyor."
 boh_events.99.a: "Bohemya Ortak Devleti çok yaşasın! Orta Avrupa’nın efendisi ilelebet payidar olsun!"
 STATIC_MODIFIER_NAME_boh_blind_king_mod: "Kör Kral’ın Mirası"
 STATIC_MODIFIER_DESC_boh_blind_king_mod: "“Göremiyorum ama hâlâ savaşabilirim”: Kör Kral I. Jan’ın ruhu Bohemya krallığının temel taşını koydu."
 STATIC_MODIFIER_NAME_boh_imperial_power_mod: "İmparatorluğun Aslanı"
 STATIC_MODIFIER_DESC_boh_imperial_power_mod: "Bohemya İmparatorluğun en güçlü seçici prensi olarak öne çıkar."
 STATIC_MODIFIER_NAME_boh_habsburg_rival_mod: "Habsburglara Meydan Okuma"
 STATIC_MODIFIER_DESC_boh_habsburg_rival_mod: "Lüksemburg Hanedanı ile Habsburglar arasındaki imparatorluk hâkimiyeti rekabeti kızışır."
 STATIC_MODIFIER_NAME_boh_silesia_mod: "Silezya Demiri"
 STATIC_MODIFIER_DESC_boh_silesia_mod: "Silezya’nın bol demir cevheri Bohemya’nın savunma sanayisinin temelini destekler."
 STATIC_MODIFIER_NAME_boh_hre_master_mod: "Kutsal Roma İmparatorluğu’nun Efendisi"
 STATIC_MODIFIER_DESC_boh_hre_master_mod: "Bohemya Kutsal Roma İmparatorluğu’nun tartışmasız lideri olarak hüküm sürer ve hiçbir prens Prag’a başı eğik olmadan yazmaya cesaret edemez."
 STATIC_MODIFIER_NAME_boh_prague_capital_mod: "Prag, Yüz Kulenin Şehri"
 STATIC_MODIFIER_DESC_boh_prague_capital_mod: "Vltava üzerindeki Prag, Orta Avrupa’nın en büyük şehri olarak geliştirildi."
 STATIC_MODIFIER_NAME_boh_charles_university_mod: "Charles Üniversitesi"
 STATIC_MODIFIER_DESC_boh_charles_university_mod: "Orta Avrupa’nın ilk üniversitesi Prag’da açılır ve ilim ile reformun merkezi olarak parlar."
 STATIC_MODIFIER_NAME_boh_golden_bull_mod: "Altın Bula"
 STATIC_MODIFIER_DESC_boh_golden_bull_mod: "Bohemya Kralı’nın seçici prens statüsü Altın Bula ile kurulur."
 STATIC_MODIFIER_NAME_boh_glass_industry_mod: "Bohemya Camı"
 STATIC_MODIFIER_DESC_boh_glass_industry_mod: "Bohemya kristali Avrupa’nın en seçkin işçiliği olarak itibarını kurar."
 STATIC_MODIFIER_NAME_boh_kutna_hora_mod: "Kutná Hora Gümüşü"
 STATIC_MODIFIER_DESC_boh_kutna_hora_mod: "Orta Avrupa’nın en büyük gümüş madeni Bohemya’nın ekonomik altın çağını ayakta tutar. Prag Groşeni geniş çapta dolaşır."
 STATIC_MODIFIER_NAME_boh_moravia_mod: "Moravya’nın Katılımı"
 STATIC_MODIFIER_DESC_boh_moravia_mod: "Brno ve Olomouc merkezli Moravya Bohemya İmparatorluğu’na katılır."
 STATIC_MODIFIER_NAME_boh_prosperity_mod: "İç Refah"
 STATIC_MODIFIER_DESC_boh_prosperity_mod: "Bohemya camı, gümüşü ve ticaret pazarları bir araya gelerek Orta Avrupa’nın en büyük ekonomik gücünü yaratır."
 STATIC_MODIFIER_NAME_boh_catholic_reform_mod: "Sarsılmaz Katolik İnanç"
 STATIC_MODIFIER_DESC_boh_catholic_reform_mod: "Roma Kilisesi’ne bağlılığını koruyan Bohemya, Orta Avrupa Katolik uygarlığının koruyucusu olarak tanınır."
 STATIC_MODIFIER_NAME_boh_crusader_glory_mod: "Haçlı Şanı"
 STATIC_MODIFIER_DESC_boh_crusader_glory_mod: "Husçu karşıtı haçlı seferine önderlik eden Bohemya, Hıristiyan dünyasının savunucusu olarak ün kazanır."
 STATIC_MODIFIER_NAME_boh_papal_ally_mod: "Papa’nın Kalkanı"
 STATIC_MODIFIER_DESC_boh_papal_ally_mod: "Papalıkla derin güven Bohemya’yı Katolik Orta Avrupa’nın lideri yapar."
 STATIC_MODIFIER_NAME_boh_hussite_church_mod: "Husçu Kilise"
 STATIC_MODIFIER_DESC_boh_hussite_church_mod: "Jan Hus’un ruhu Bohemya’da kök salar: bağımsız bir dinî reform yolu kurulur."
 STATIC_MODIFIER_NAME_boh_wagenburg_mod: "Wagenburg Taktikleri"
 STATIC_MODIFIER_DESC_boh_wagenburg_mod: "Jan Žižka’nın devrimci taktikleri Bohemya ordusuna yerleşir. Araba kaleleri haçlı süvarisini ezer."
 STATIC_MODIFIER_NAME_boh_king_heretic_mod: "Sapkın Kral’ın Prestiji"
 STATIC_MODIFIER_DESC_boh_king_heretic_mod: "Papa’nın aforozuna rağmen prestijini koruyan Bohemya kralı diplomatik izolasyonu aşar."
 STATIC_MODIFIER_NAME_boh_slovakia_mod: "Slovakya’nın Katılımı"
 STATIC_MODIFIER_DESC_boh_slovakia_mod: "Bohemya’nın aslan sancağı artık Büyük Moravya İmparatorluğu’nun atalarının yurdu Slovakya’nın tepeleri üzerinde dalgalanıyor."
 STATIC_MODIFIER_NAME_boh_transylvania_mod: "Transilvanya"
 STATIC_MODIFIER_DESC_boh_transylvania_mod: "Ormanın ötesindeki diyar Bohemya yönetimine girer: Balkan genişlemesi için bir tutunak kuruldu."
 STATIC_MODIFIER_NAME_boh_nicopolis_glory_mod: "Niğbolu’nun İntikamı"
 STATIC_MODIFIER_DESC_boh_nicopolis_glory_mod: "1396 aşağılanmasının öcü alındı. Bohemya Osmanlı İmparatorluğu’na karşı karşı taarruzun öncüsü olur."
 STATIC_MODIFIER_NAME_boh_antemurale_mod: "Hıristiyan Dünyasının Kalkanı"
 STATIC_MODIFIER_DESC_boh_antemurale_mod: "Transilvanya’nın kaleleri Osmanlı ilerleyişini durduran kalkan olur."
 STATIC_MODIFIER_NAME_boh_balkan_conqueror_mod: "Balkanlar’ın Kurtarıcısı"
 STATIC_MODIFIER_DESC_boh_balkan_conqueror_mod: "Bohemya, Balkanlar’ın Slavlarının ve Hıristiyanlarının kurtarıcısı olarak güneye ilerler."
 STATIC_MODIFIER_NAME_boh_silesia_secured_mod: "Silezya Tamamen Bütünleşti"
 STATIC_MODIFIER_DESC_boh_silesia_secured_mod: "Tüm Silezya Bohemya’nın doğrudan yönetimi altında: demir ve kömür sanayi temelleri kuruldu."
 STATIC_MODIFIER_NAME_boh_poland_subjugated_mod: "Polonya’ya Boyun Eğdirildi"
 STATIC_MODIFIER_DESC_boh_poland_subjugated_mod: "Polonya ovaları Bohemya denetimine girer: doğu genişlemesinin temeli kuruldu."
 STATIC_MODIFIER_NAME_boh_baltic_access_mod: "Baltık’a Erişim"
 STATIC_MODIFIER_DESC_boh_baltic_access_mod: "Gdańsk ele geçirilince Bohemya Baltık ticaretine doğrudan katılabilir."
 STATIC_MODIFIER_NAME_boh_diet_mod: "Bohemya Diyeti"
 STATIC_MODIFIER_DESC_boh_diet_mod: "Zemský Sněm salonunda zümre delegeleri artık imparatorun politikalarını dinliyor."
 STATIC_MODIFIER_NAME_boh_absolutism_mod: "Mutlak Monarşi"
 STATIC_MODIFIER_DESC_boh_absolutism_mod: "Bohemya’da mutlak monarşi kuruldu: modern merkezî bir devlete dönüştü."
 STATIC_MODIFIER_NAME_boh_military_power_mod: "Büyük Gücün Ordusu"
 STATIC_MODIFIER_DESC_boh_military_power_mod: "Wagenburg ve Kara Ordu geleneklerinin varisi olan Bohemya’nın seçkin ordusu Orta Avrupa’nın en büyük askerî gücüne sahiptir."
 STATIC_MODIFIER_NAME_boh_brno_mod: "Brno Çiçek Açıyor"
 STATIC_MODIFIER_DESC_boh_brno_mod: "Moravya’nın başkenti Brno bir ticaret ve sanayi merkezi olarak gelişir."
 STATIC_MODIFIER_NAME_boh_wroclaw_mod: "Wrocław Çiçek Açıyor"
 STATIC_MODIFIER_DESC_boh_wroclaw_mod: "Oder üzerindeki Wrocław Silezya ekonomisinin kalbi olarak işlev görür."
 STATIC_MODIFIER_NAME_boh_amber_road_mod: "Kehribar Yolu"
 STATIC_MODIFIER_DESC_boh_amber_road_mod: "Baltık’tan Akdeniz’e uzanan kadim Kehribar Yolu’nu denetleyen Bohemya, kuzey-güney ticaretinin merkezi olur."
 STATIC_MODIFIER_NAME_boh_pest_mod: "Pest Çiçek Açıyor"
 STATIC_MODIFIER_DESC_boh_pest_mod: "Tuna üzerindeki Pest, güneydeki Bohemya İmparatorluğu’nun ticaret merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_boh_renaissance_mod: "Rönesans Sarayı"
 STATIC_MODIFIER_DESC_boh_renaissance_mod: "Prag, İtalyan, Fransız ve Orta Avrupa kültürlerinin buluştuğu Orta Avrupa Rönesansı’nın merkezi olur."
 STATIC_MODIFIER_NAME_boh_great_moravia_mod: "Büyük Moravya Yeniden Kuruldu"
 STATIC_MODIFIER_DESC_boh_great_moravia_mod: "Svatopluk’tan beri ilk kez Bohemya, Moravya ve Silezya birleşti: Slav uygarlığının merkezi yeniden doğdu."
 STATIC_MODIFIER_NAME_boh_central_power_mod: "Orta Avrupa Gücü"
 STATIC_MODIFIER_DESC_boh_central_power_mod: "Bohemya Orta Avrupa’nın en büyük gücü olarak hüküm sürer ve imparatorlukta, kültürde ve askerî alanda üstünlük kurar."
 STATIC_MODIFIER_NAME_boh_krecy_glory_mod: "Crécy Mirası"
 STATIC_MODIFIER_DESC_boh_krecy_glory_mod: "Kör Kral’ın kahramanca ölümü Bohemya’nın askerî gururu olarak aktarılır."
 STATIC_MODIFIER_NAME_boh_alpine_lands_mod: "Alp Toprakları"
 STATIC_MODIFIER_DESC_boh_alpine_lands_mod: "Bohemya sancağı taşıyan garnizonlar artık Steiermark ve Karintiya’nın dağ geçitlerini tutuyor."
 STATIC_MODIFIER_NAME_boh_silver_currency_mod: "Prag Groşeni"
 STATIC_MODIFIER_DESC_boh_silver_currency_mod: "Kutná Hora gümüşünden basılan Prag Groşeni Orta Avrupa’nın en büyük uluslararası para birimi olur."
 STATIC_MODIFIER_NAME_boh_golden_prague_mod: "Altın Prag"
 STATIC_MODIFIER_DESC_boh_golden_prague_mod: "Aziz Vitus, Karl Köprüsü, Yüz Kule: Prag “Altın Şehir” olarak Orta Avrupa’nın en büyük kültür merkezi olur."
 STATIC_MODIFIER_NAME_boh_trade_network_mod: "Bohemya Ticaret Ağı"
 STATIC_MODIFIER_DESC_boh_trade_network_mod: "Prag merkezli bir Orta Avrupa ticaret ağı Bohemya’nın ticari üstünlüğünü ayakta tutar."
 STATIC_MODIFIER_NAME_boh_compactata_mod: "Prag Compactata’sı"
 STATIC_MODIFIER_DESC_boh_compactata_mod: "Katolik-Utrakvist uzlaşması sağlandı: Bohemya’ya dinî istikrar geri geldi."
 STATIC_MODIFIER_NAME_boh_utraquist_mod: "Utrakvist Kilisesi"
 STATIC_MODIFIER_DESC_boh_utraquist_mod: "İki türün altında komünyon veren Utrakvist Kilisesi Bohemya’nın devlet dini olarak kuruldu."
 STATIC_MODIFIER_NAME_boh_protestant_alliance_mod: "Protestan İttifakı"
 STATIC_MODIFIER_DESC_boh_protestant_alliance_mod: "Husçu geleneğiyle Bohemya Protestan dünyasının bir sütunu olarak tanındı."
 STATIC_MODIFIER_NAME_boh_black_army_mod: "Kara Ordu"
 STATIC_MODIFIER_DESC_boh_black_army_mod: "Kara Ordu ruhu Bohemya’ya yerleşir: Orta Avrupa’nın en güçlü profesyonel ordusu tamamlanır."
 STATIC_MODIFIER_NAME_boh_berlin_mod: "Berlin Geliştirildi"
 STATIC_MODIFIER_DESC_boh_berlin_mod: "Kuzeydeki küçük Berlin kasabası Bohemya İmparatorluğu’nun kuzey idari merkezi olarak büyür."
 STATIC_MODIFIER_NAME_boh_konigsberg_mod: "Königsberg Geri Döndü"
 STATIC_MODIFIER_DESC_boh_konigsberg_mod: "II. Otakar’ın kurduğu Königsberg Bohemya’ya döner ve Baltık ticaret merkezi olur."
 STATIC_MODIFIER_NAME_boh_great_king_mod: "Büyük Kral"
 STATIC_MODIFIER_DESC_boh_great_king_mod: "Bohemya kralının adı, IV. Karl’ı bile aşarak Orta Avrupa tarihine en büyük hükümdarı olarak kazınır."
 STATIC_MODIFIER_NAME_boh_fortress_europe_mod: "Avrupa’nın Kalesi"
 STATIC_MODIFIER_DESC_boh_fortress_europe_mod: "Alpler’den Karpatlar’a uzanan bir kale ağı Osmanlı ilerleyişini durdurur."
 STATIC_MODIFIER_NAME_boh_olomouc_mod: "Olomouc Çiçek Açıyor"
 STATIC_MODIFIER_DESC_boh_olomouc_mod: "Moravya’nın ilim ve din merkezi Olomouc, kuzey Rönesans kültürünün merkezi olarak parlar."
 STATIC_MODIFIER_NAME_boh_upper_austria_mod: "Yukarı Avusturya"
 STATIC_MODIFIER_DESC_boh_upper_austria_mod: "Tuna’nın yukarı kesimindeki Yukarı Avusturya surlarının üzerinde Bohemya İmparatorluğu’nun sancağı dalgalanıyor ve güneye giden yollar açık."
 STATIC_MODIFIER_NAME_boh_carpathian_mod: "Karpat Savunması"
 STATIC_MODIFIER_DESC_boh_carpathian_mod: "Karpatlar boyunca bir kale ağı Bohemya İmparatorluğu’nun doğu sınırını koruyan kalkan olur."
 STATIC_MODIFIER_NAME_boh_bohemian_commonwealth_final_mod: "Bohemya Ortak Devleti’nin Şanı"
 STATIC_MODIFIER_DESC_boh_bohemian_commonwealth_final_mod: "Orta Avrupa’nın beş büyük şehrini denetleyen Bohemya Ortak Devleti tamamlandı. “Bohemia non perit”: bu sözler tarihe sonsuza dek kazınmıştır."
 STATIC_MODIFIER_NAME_boh_habsburg_crushed_mod: "Habsburg Ezildi"
 STATIC_MODIFIER_DESC_boh_habsburg_crushed_mod: "Viyana düşer ve Habsburg’un Orta Avrupa hâkimiyeti sona erer. Bohemya gerçek efendi olarak yükselir."
 boh_fortress_of_europe: "Avrupa’nın Kalesi"
 boh_fortress_of_europe_desc: "Alpler’den Karpatlar’a uzanan bir kale ağı Osmanlı ilerleyişini durdurur. Bohemya “Avrupa’nın Kalkanı” olarak işlev görür."
 boh_dev_plzen: "Plzeň’i Geliştir"
 boh_dev_plzen_desc: "Plzeň: batı Bohemya’nın kilit şehri ve dünyaca ünlü Pilsner birasının gelecekteki doğum yeri. Ohře ve Mže nehirlerinin birleştiği yerde bulunan bu şehri geliştirmek tüm batı Bohemya’da ticareti ve sanayiyi teşvik eder."
 boh_dev_cheb: "Cheb’i Geliştir"
 boh_dev_cheb_desc: "Ohře üzerindeki kadim şehir Cheb, Alman ve Bohemya kültürlerinin kesiştiği imparatorluk kapısıdır. Kutsal Roma İmparatorluğu ile ticaret yollarına hâkim bu şehri batı diplomasisi için bir köprübaşı olarak geliştir."
 boh_dev_kutna_hora_city: "Kutná Hora’yı Geliştir"
 boh_dev_kutna_hora_city_desc: "Gümüş serveti ile parıldayan Kutná Hora, Prag’dan sonra Bohemya’nın ikinci şehri olarak gelişti. Aziz Barbara Katedrali yapım aşamasındayken bu şehri gerçek bir metropole dönüştür ve Bohemya’nın ekonomik kalbi olarak kur."
 boh_bohemian_agriculture: "Bohemya Tarımı"
 boh_bohemian_agriculture_desc: "Elbe boyunca uzanan Bohemya ovaları zengin bir tarım bölgesidir. Buğday, arpa ve çavdar bolca olgunlaşır ve çiftlik gelişimi verimliliği büyük ölçüde artırır. İstikrarlı gıda arzı Bohemya İmparatorluğu genelinde nüfus artışını destekler."
 boh_moravian_wine: "Moravya Şarabı"
 boh_moravian_wine_desc: "Znojmo çevresindeki güney Moravya, Bohemya’nın en büyük bağcılık bölgesidir. Sıcak iklim ve kireçtaşı toprak, Avusturya’nın ve Viyana’nın saraylarında bile kıymetli Moravya şaraplarını besler. Zengin lezzeti Bohemya İmparatorluğu’nun kültürel inceliğini simgeler."
 boh_jihlava_silver: "Jihlava Gümüş Madenleri"
 boh_jihlava_silver_desc: "Bohemya-Moravya Yaylaları’ndaki Jihlava, Kutná Hora ile boy ölçüşen bir gümüş madenciliği şehridir. Bu gümüş madenlerini tam işletmeye almak Bohemya’nın gümüş üretimini daha da genişletir ve Prag Groşeni basımını artırır."
 boh_opava_iron: "Opava Demir Sanayisi"
 boh_opava_iron_desc: "Silezya Dukalığı’nın başkenti Opava demir cevheri yataklarıyla bilinir. Bu şehrin çelik sanayisini geliştirmek Silezya’nın sanayi temelini daha da güçlendirir ve Bohemya askerî teçhizatını çarpıcı biçimde iyileştirir."
 boh_dev_litomerice: "Litoměřice’yi Geliştir"
 boh_dev_litomerice_desc: "Elbe üzerindeki Litoměřice, kuzey Bohemya’nın önemli bir ticaret şehridir. Onu Elbe aracılığıyla Hamburg’a uzanan ticaret yolunun merkezi olarak geliştirmek kuzey Almanya ile ticareti canlandırır."
 boh_silesian_mines: "Silezya Madenleri"
 boh_silesian_mines_desc: "Silezya’nın toprağı altında gelecekteki sanayi devrimlerini destekleyecek demir ve kok kömürü yatar. Tam ölçekli bir madencilik sistemi kur ve Bohemya İmparatorluğu’nun sanayi üretim kapasitesini çarpıcı biçimde artır."
 boh_silesian_mines_unlock_tt: "“Silezya Madenlerinin Geliştirilmesi” kararı artık kullanılabilir."
 boh_silesian_mining_decision.title: "Silezya Madenlerinin Geliştirilmesi"
 boh_silesian_mining_decision.desc: "Silezya’nın madencilik bölgeleri geniştir ve Taç hepsini bir anda açamaz. Ocaklara, dökümhanelere ve yollara yapılan her yatırım bir bölgeyi daha tam üretime geçirir; bu iş her on yılda bir yenilenebilir."
 boh_silesian_mining_decision.a: "Yeni bir madencilik bölgesine yatırım yap."
 boh_bohemian_cloth: "Bohemya Kumaş Sanayisi"
 boh_bohemian_cloth_desc: "Bohemya camının yanı sıra Bohemya’nın tekstil ve kumaş sanayisi de Avrupa’daki itibarını kuruyor. Kuzey Bohemya kumaşı ile Litoměřice’nin ticaret yollarının birleşimi Bohemya’yı tekstil sanayisinin merkezi yapar."
 STATIC_MODIFIER_NAME_boh_plzen_mod: "Plzeň Geliştirildi"
 STATIC_MODIFIER_DESC_boh_plzen_mod: "Batı Bohemya’nın kilit şehri Plzeň ticaret ve sanayi merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_boh_cheb_mod: "Cheb Geliştirildi"
 STATIC_MODIFIER_DESC_boh_cheb_mod: "Batı kapısı Cheb, İmparatorlukla ticaret merkezi olarak işlev görür."
 STATIC_MODIFIER_NAME_boh_kutna_hora_city_mod: "Kutná Hora Şehri"
 STATIC_MODIFIER_DESC_boh_kutna_hora_city_mod: "Bohemya’nın gümüşle zengin ikinci şehri tam bir metropole dönüştü."
 STATIC_MODIFIER_NAME_boh_agriculture_mod: "Bohemya Tarımı"
 STATIC_MODIFIER_DESC_boh_agriculture_mod: "Bereketli Elbe tarım bölgesi geliştirildi: istikrarlı gıda arzı güvence altında."
 STATIC_MODIFIER_NAME_boh_znojmo_mod: "Znojmo Bağları"
 STATIC_MODIFIER_DESC_boh_znojmo_mod: "Güney Moravya bağcılığı olgunlaşır ve yüksek kaliteli şarap üretir."
 STATIC_MODIFIER_NAME_boh_moravian_wine_mod: "Moravya Şarabı"
 STATIC_MODIFIER_DESC_boh_moravian_wine_mod: "Moravya şarabı, Viyana’daki Avusturya sarayında bile kıymetli bir ürün olur."
 STATIC_MODIFIER_NAME_boh_jihlava_mod: "Jihlava Gümüş Madeni"
 STATIC_MODIFIER_DESC_boh_jihlava_mod: "Jihlava gümüş madenleri tam kapasiteyle işliyor: Kutná Hora ile boy ölçüşen bir gümüş üreticisi."
 STATIC_MODIFIER_NAME_boh_opava_mod: "Opava Çelik Sanayisi"
 STATIC_MODIFIER_DESC_boh_opava_mod: "Silezya Dukalığı’nın başkenti Opava’da çelik sanayisi geliştirildi."
 STATIC_MODIFIER_NAME_boh_litomerice_mod: "Litoměřice Ticaret Merkezi"
 STATIC_MODIFIER_DESC_boh_litomerice_mod: "Elbe üzerindeki Litoměřice, kuzey Almanya ticaret yollarının merkezi olarak gelişir."
 STATIC_MODIFIER_NAME_boh_silesian_mines_mod: "Silezya Madenleri"
 STATIC_MODIFIER_DESC_boh_silesian_mines_mod: "Silezya’nın zengin demir ve kömür madenleri tam kapasiteyle işliyor: Bohemya’nın sanayi gücü çarpıcı biçimde arttı."
 STATIC_MODIFIER_NAME_boh_cloth_industry_mod: "Bohemya Kumaş Sanayisi"
 STATIC_MODIFIER_DESC_boh_cloth_industry_mod: "Bohemya’nın tekstil ve kumaş sanayisi camın yanında başlıca ihraç malı olarak kuruldu."
 boh_sugar_beet: "Şeker Pancarı Yetiştiriciliği"
 boh_sugar_beet_desc: "Devrimler Çağı: bilimsel ve sanayi yenilikleri Bohemya tarımını dönüştürür. Şeker pancarı Bohemya’nın serin iklimi için ideal bir üründür. Bir zamanlar şeker kamışının tekeli olan şeker üretimi şimdi Bohemya tarlalarından çıkıyor. Sanayi Devrimi’nin yeni tarım teknikleri Bohemya çiftçiliğini modernleştirir."
 boh_porcelain_industry: "Bohemya Porselen Sanayisi"
 boh_porcelain_industry_desc: "Devrimler Çağı: batı Bohemya’nın kaolini (porselen kili) Avrupa’nın en iyi porselen malzemesidir. Karlsbad (Karlovy Vary) çevresindeki beyaz kilden doğan Bohemya porseleni, Dresden’deki Meissen porselenin nefis işçiliğiyle boy ölçüşür ve Avrupa saraylarını süsler."
 STATIC_MODIFIER_NAME_boh_porcelain_mod: "Bohemya Porseleni"
 STATIC_MODIFIER_DESC_boh_porcelain_mod: "Batı Bohemya kaolininden yapılan porselen, Avrupa saraylarını süsleyen bir lüks ürün olur."
 boh_jan_hus_question_desc: "Jan Hus’un reformcu ruhu tüm Bohemya’ya yayılıyor. Konstanz Konsili’nde (1415) yakılışının anısı Bohemyalıların yüreklerine derin işlenmiş durumda ve Roma Kilisesi’ne duyulan öfke kopma noktasında. İnanç meselesi artık göz ardı edilemediğinde Bohemya kendi yolunu belirlemelidir."
 boh_events.60.t: "Şeker Pancarı Yetiştirme Yeri: Yeni Bir Sanayinin Şafağı"
 boh_events.60.d: "1737: şeker pancarından (Beta vulgaris) şeker üretme teknolojisi Avrupa genelinde geliştirildi. Bohemya’nın bereketli tarım arazileri bu yeni ürünü yetiştirmek için idealdir. İlk şeker pancarı çiftliğine hangi yer ev sahipliği yapacak: Poděbrady mi, Hradec Králové mi?"
 boh_events.60.a: "Şeker pancarını Poděbrady’nin tarlalarına ek (“Sapkın Kral” Jiří’nin doğum yeri)"
 boh_events.60.b: "Şeker pancarını Hradec Králové’nin tarlalarına ek (Elbe boyunca bereketli topraklar)"
 STATIC_MODIFIER_NAME_boh_jan_hus_mod: "Hus’un Hakikati"
 STATIC_MODIFIER_DESC_boh_jan_hus_mod: "Jan Hus’un vaazlarının el yazmaları Bohemya’nın çiftlik evlerinde bile elden ele dolaşır."
 STATIC_MODIFIER_NAME_boh_sugar_beet_choice_mod: "Şeker Pancarı Çiftliği"
 STATIC_MODIFIER_DESC_boh_sugar_beet_choice_mod: "Şeker pancarı yetiştiriciliği olgunlaşıyor: Bohemya’da üretilen şeker Avrupa pazarlarına ihraç ediliyor."
 boh_conquer_silesia: "Silezya’yı Bütünleştir"
 boh_conquer_silesia_desc: "Silezya Bohemya Taç Toprakları’nın bir parçasıdır. Demir cevheri ve gümüşle zengin bu bölgeyi bütünleştirmek Bohemya’nın sanayi ve askerî temelini çarpıcı biçimde güçlendirir."
 boh_events.50.b: "Hayır, Bohemya’nın geleneksel renklerini koru: değişmeye gerek yok"
 boh_urban_privileges: "Bohemya Şehir Ayrıcalıkları"
 boh_urban_privileges_desc: "Brno ve Olomouc geliştirildiğinde Bohemya, şehirlerine eşsiz ayrıcalıklar tanıyan bir sistem kurdu. Feodal şehirler soylu denetimini güçlendirirken köylü özgürleşmesini bastırır; kilise şehirleri din değiştirmeyi teşvik eder."
 STATIC_MODIFIER_NAME_boh_ecclesiastical_city_rights: "Kilise Şehri Hakları"
 STATIC_MODIFIER_DESC_boh_ecclesiastical_city_rights: "Katedral çanlarının günün her saatini belirlediği bu kasabada pazarın kuralları bile dua vakitlerine göre ayarlanır."
 boh_urban_privileges_unlock_tt: "Feodal Şehir (Poddanská nebo vrchnostenská města) ve Kilise Şehri (Biskupská nebo klášterní města) şehir ayrıcalıklarının kilidini açar."
