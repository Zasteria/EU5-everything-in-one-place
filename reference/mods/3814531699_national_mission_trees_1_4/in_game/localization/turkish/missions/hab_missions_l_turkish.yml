 STATIC_MODIFIER_DESC_hab_bohemia_mod: "Prag’ın altın şehri Habsburg Hanedanı’nın ikinci başkenti olarak İmparatorluğa katılır."
 STATIC_MODIFIER_NAME_hab_carinthia_mod: "Karintiya’ya Boyun Eğdirme"
 STATIC_MODIFIER_DESC_hab_carinthia_mod: "Karintiya Habsburg İmparatorluğu için kuzey ile güneyi bağlayan hayati bir Alp koridoru oldu."
 STATIC_MODIFIER_NAME_hab_catholic_mod: "Karşı-Reform’un Zaferi"
 STATIC_MODIFIER_DESC_hab_catholic_mod: "Katolik inanç İmparatorluk genelinde korunuyor."
 STATIC_MODIFIER_NAME_hab_charlemagne_mod: "Büyük Karl’ın Mirası"
 STATIC_MODIFIER_DESC_hab_charlemagne_mod: "Büyük Karl’ın mirası Habsburg İmparatorluğu’na yeni meşruiyet kazandırır."
 STATIC_MODIFIER_NAME_hab_croatia_mod: "Hırvat Askerî Sınırı"
 STATIC_MODIFIER_DESC_hab_croatia_mod: "Hırvatistan’da bir askerî sınır kuruldu ve Osmanlı akınını durduruyor."
 STATIC_MODIFIER_NAME_hab_danubian_mod: "Tuna İmparatorluğu’nun Genişlemesi"
 STATIC_MODIFIER_DESC_hab_danubian_mod: "Aşağı Tuna’ya boyun eğdirildi ve tüm Balkanlar üzerindeki Habsburg egemenliği tamamlandı."
 STATIC_MODIFIER_NAME_hab_dynasty_mod: "Habsburg Hanedanı’nın Uyanışı"
 STATIC_MODIFIER_DESC_hab_dynasty_mod: "Habsburg Hanedanı’nın emeli ateşlendi: bir diplomasi ve fetih çağı başlıyor."
 STATIC_MODIFIER_NAME_hab_france_mod: "Fransa ile Savaş"
 STATIC_MODIFIER_DESC_hab_france_mod: "Eski rakip Fransa zayıflatıldı ve Avrupa üzerindeki Habsburg hegemonyasına giden yol açıldı."
 STATIC_MODIFIER_NAME_hab_graz_mod: "Graz’ın Tahkimi"
 STATIC_MODIFIER_DESC_hab_graz_mod: "Graz Osmanlı akınına karşı savunan aşılmaz bir kale şehrine dönüştürüldü."
 STATIC_MODIFIER_NAME_hab_great_vienna_loc_mod: "Büyük Viyana Şehri Tamam"
 STATIC_MODIFIER_DESC_hab_great_vienna_loc_mod: "Viyana Avrupa’nın en büyük şehri olarak tamamlandı ve İmparatorluğun ebedî başkenti olarak parlıyor."
 STATIC_MODIFIER_NAME_hab_heartland_mod: "Avusturya Merkez Topraklarının İstikrarı"
 STATIC_MODIFIER_DESC_hab_heartland_mod: "Avusturya merkez toprakları istikrarlı ve imparatorluk genişlemesi için temel kuruyor."
 STATIC_MODIFIER_NAME_hab_hegemon_mod: "Batı’nın Hegemonu"
 STATIC_MODIFIER_DESC_hab_hegemon_mod: "Batı Avrupa’da Habsburg hegemonyasına meydan okuyacak güç kalmadı."
 STATIC_MODIFIER_NAME_hab_imperial_mod: "İmparatorluk Otoritesinin Kuruluşu"
 STATIC_MODIFIER_DESC_hab_imperial_mod: "Kutsal Roma İmparatorluğu’nun tamamı artık Habsburg Hanedanı’nın emrine itaat ediyor."
 STATIC_MODIFIER_NAME_hab_italian_mod: "İtalya Savaşları’nın Yararları"
 STATIC_MODIFIER_DESC_hab_italian_mod: "İtalya seferleri Habsburg ordusunu seçkin bir güce dönüştürdü."
 STATIC_MODIFIER_NAME_hab_multiethnic_mod: "Çok Etnikli İmparatorluğun Kuruluşu"
 STATIC_MODIFIER_DESC_hab_multiethnic_mod: "Habsburg sancağı altında birçok halkın bir arada yaşama mucizesi gerçekleşti."
 STATIC_MODIFIER_NAME_hab_north_sea_mod: "Kuzey Denizi Ticaret Hegemonyası"
 STATIC_MODIFIER_DESC_hab_north_sea_mod: "Kuzey Denizi ticareti Habsburg İmparatorluğu’nun denetimine girdi."
 STATIC_MODIFIER_NAME_hab_ottoman_mod: "Osmanlı İmparatorluğu ile Savaş"
 STATIC_MODIFIER_DESC_hab_ottoman_mod: "Osmanlı İmparatorluğu üzerindeki zafer Habsburg İmparatorluğu’nun Hıristiyan dünyasının kalesi olarak tanınmasını sağladı."
 STATIC_MODIFIER_NAME_hab_papal_mod: "Papa ile Uzlaşma"
 STATIC_MODIFIER_DESC_hab_papal_mod: "Papa ile ilişkiler kuruldu ve Habsburg Hanedanı Katolik dünyanın koruyucusu olarak tanınıyor."
 STATIC_MODIFIER_NAME_hab_reform_mod: "İmparatorluk Reformunun Tamamlanması"
