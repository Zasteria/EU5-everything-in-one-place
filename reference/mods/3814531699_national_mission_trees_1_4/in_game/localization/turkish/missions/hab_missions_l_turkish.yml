 hab_integrated_crown_desc: "Bütünleşmiş Taç Toprağı, hükümdarını Habsburg İmparatoru ile paylaşan, sınırlı diplomasiye sahip ve hükümdarın kaynakları doğrudan inşa etmesine ve geliştirmesine izin veren özel bir tabi türüdür. 100 yıl boyunca ilhak edilemez."
 STATIC_MODIFIER_NAME_hab_spain_crown_mod: "İspanya Tacı’nın Edinilmesi"
 STATIC_MODIFIER_DESC_hab_spain_crown_mod: "İber Yarımadası Habsburg İmparatorluğu’nun egemenlik alanının bir parçası oldu ve güneşin batmadığı bir imparatorluğun kapısını açıyor."
