l_turkish:
 hab_habsburg_mission_pack: "Habsburg Hegemonyası ve Evrensel İmparatorluk"
 hab_habsburg_mission_pack_DESCRIPTION:0 "Tuna kıyılarından Habsburg Hanedanı’nın emeli tüm Avrupa’ya uzanır. Kutsal Roma İmparatoru tahtını güvenceye al; doğuda Macaristan’ı, batıda Fransa’yı ve İspanya’yı, güneyde İtalya’yı fethet. Sonra Viyana’yı dünyanın en büyük şehri olarak parlat ve Evrensel İmparatorluk’u gerçekleştir."
 hab_habsburg_mission_pack_CRITERIA_DESCRIPTION:0 "KRİ’ye hükmet, Batı’yı, Doğu’yu ve İtalya’yı fethet ve Evrensel İmparatorluk’u gerçekleştir."
 hab_habsburg_mission_pack_BUTTON_TOOLTIP:0 "Avrupa’yı Habsburg hegemonyası altında birleştir."
 hab_habsburg_mission_pack_BUTTON_DETAILS:0 "“Başkaları savaşsın; sen, mutlu Avusturya, evlen!”: hem diplomasi hem fetihle Avrupa’nın efendisi ol!"
 hab_habsburg_ascendancy: "Habsburg Hanedanı’nın Yükselişi"
 hab_habsburg_ascendancy_desc: "Habsburglu Rudolf’un kanı Tuna boyunca atıyor: bir diplomasi ve fetih çağı başladı."
 hab_secure_electors: "Seçici Prensleri Güvenceye Al"
 hab_secure_electors_desc: "Kutsal Roma İmparatoru’nun tahtı seçici prenslerin oyuyla belirlenir. İttifak veya ezici güç yoluyla Habsburg Hanedanı’nın imparatorluk tacı üzerindeki hâkimiyetini güvenceye al."
 hab_imperial_authority: "İmparatorluk Otoritesini Kur"
 hab_imperial_authority_desc: "Kutsal Roma İmparatorluğu’nun otoritesi Habsburg Hanedanı’nın iradesinde birleşir: tüm İmparatorluğun Viyana’nın emrine itaat etme vakti geldi."
 hab_counter_reformation: "Karşı-Reform"
 hab_counter_reformation_desc: "Martin Luther’in sapkınlığı Almanya’yı sarsıyor: Trento Konsili’nin kararlarını uygula ve Katolik inancı savun."
 hab_charlemagne_legacy: "Büyük Karl’ın Mirası"
 hab_charlemagne_legacy_desc: "Büyük Karl’ın bin yıl önce birleştirdiği güney Almanya’yı Habsburg sancağı altında geri al: imparatorluk reformunun temeli atılır."
 hab_imperial_reform: "İmparatorluk Reformu"
 hab_imperial_reform_desc: "İmparatorluk Reformu: İmparatorluğun yönetim kurumlarını yeniden düzenleyerek Habsburg yönetimini kalıcı kıl."
 hab_emperors_of_rome: "Roma İmparatorlarının Varisi"
 hab_emperors_of_rome_desc: "Büyük Karl’dan beri süren bir hayal: Ebedî Şehir Roma’ya ve KRİ’ye hâkim olan Habsburg Hanedanı kendini “Roma İmparatorlarının varisi” ilan eder."
 hab_reclaim_burgundy: "Burgonya’yı Geri Al"
 hab_reclaim_burgundy_desc: "Loren ve Burgonya: bir zamanlar Habsburg Hanedanı’na ait olan bu batı topraklarını geri al."
 hab_austrian_netherlands: "Avusturya Hollandası"
 hab_austrian_netherlands_desc: "Flandre ve Brabant’ın zengin ticaret şehirleri: Düşük Ülkeler’in serveti Habsburg İmparatorluğu’nun maliyesini ayakta tutar."
 hab_weaken_france: "Fransa’yı Zayıflat"
 hab_weaken_france_desc: "Eski rakip Fransa, Avrupa hegemonyasının önündeki en büyük engel. Onu zayıflat ve Almanya ile İtalya’ya müdahale gücünü kes."
 hab_defeat_france: "Fransa’nın Yenilgisi"
 hab_defeat_france_desc: "“Galya düştü”: eski rakip Fransa Habsburg Hanedanı tarafından yenildi. Batı Avrupa üzerindeki hegemonya Habsburglar’a aittir."
 hab_iberian_marriage: "İberya ile Evlilik Diplomasisi"
 hab_iberian_marriage_desc: "“Başkaları savaşsın; sen, mutlu Avusturya, evlen”: İspanya ve Portekiz ile evlilikler güneşin batmadığı bir imparatorluğun kapısını açar."
 hab_crown_of_spain: "İspanya Tacı"
 hab_crown_of_spain_desc: "Tüm İber Yarımadası: Habsburg Hanedanı’nın “İspanya Kralı” ilanıyla güneşin batmadığı imparatorluk şekillenmeye başlar."
 hab_italian_ambition: "İtalya Emelleri"
 hab_italian_ambition_desc: "Kuzey İtalya’nın zengin şehir devletleri: Milano’yu, Venedik’i ve Napoli’yi Habsburg denetimine al."
 hab_duchy_of_milan: "Milano Dukalığı’nı Ele Geçir"
 hab_duchy_of_milan_desc: "Milano, kuzey İtalya’nın kalbi. Bu ekonomik ve askerî kaleyi ele geçir ve İtalya’nın fethi için bir üs kur."
 hab_papal_alliance: "Papa ile İlişkiler"
 hab_papal_alliance_desc: "Papa: Katolik dünyanın bu manevi otoritesiyle ilişki kur ve Habsburg Hanedanı’nın meşruiyetini yükselt."
 hab_venetian_ports: "Venedik Limanları"
 hab_venetian_ports_desc: "Venedik, “Adriyatik’in Kraliçesi”: limanlarını ve filosunu ele geçir ve Akdeniz ticaretine girişi güvenceye al."
 hab_king_of_naples: "Napoli Kralı"
 hab_king_of_naples_desc: "Napoli Krallığı: güney İtalya’nın anahtarı. Bu taç Habsburg’un tüm İtalya üzerindeki egemenliğine giden ilk adımdır."
 hab_king_of_italy: "İtalya Kralı"
 hab_king_of_italy_desc: "“Demir Taç” Habsburg imparatorunun alnında parlıyor: Lombardiya’dan Sicilya’ya tüm İtalya birleşti."
 hab_eastern_ambitions: "Doğu Emelleri"
 hab_eastern_ambitions_desc: "Bohemya ve Macaristan: Doğu Avrupa’nın bu iki büyük gücüne karşı hak iddiaları kur ve Habsburg’un doğuya ilerleyişini başlat."
 hab_crown_of_bohemia: "Bohemya Tacı"
 hab_crown_of_bohemia_desc: "Prag’daki Wenceslas Tacı: bu taç Habsburg’un doğuya genişlemesinin temeli olur."
 hab_royal_hungary: "Kraliyet Macaristan’ı"
 hab_royal_hungary_desc: "Buda Osmanlılardan kurtarıldı: Macaristan Tacı Habsburg imparatorunun alnına döner ve “Kraliyet Macaristan’ı” doğar."
 hab_bohemian_union: "Bohemya Birliği’nin Bütünleşmesi"
 hab_bohemian_union_desc: "Bohemya ile şahsi birlik derinleşti: şimdi onu bütünleşmiş bir taç toprağı olarak doğrudan yönetmeyi mi, yoksa mevcut durumu mu koruyacağını seç."
 hab_secure_croatia: "Hırvatistan’ı Güvenceye Al"
 hab_secure_croatia_desc: "Osmanlı akınlarını durdurmak için Hırvatistan’da bir askerî sınır kur ve onu Balkanlar’ın fethi için bir tutunak olarak kullan."
 hab_ottoman_menace: "Osmanlı Tehdidi"
 hab_ottoman_menace_desc: "İstanbul’u yıkan Doğu Avrupa’nın en büyük düşmanı Osmanlı İmparatorluğu. Habsburg Hanedanı Hıristiyan dünyasını savunan kale olsun."
 hab_liberate_balkans: "Balkanlar’ı Özgürleştir"
 hab_liberate_balkans_desc: "Balkan Yarımadası’nın Hıristiyanlarını Osmanlı yönetiminden kurtar: Ortodoks müminlerin sesi Habsburg’un adını çağırıyor."
 hab_emperors_of_east: "Doğu İmparatoru"
 hab_emperors_of_east_desc: "Hem Doğu hem Batı Roma İmparatorluklarının başkenti İstanbul artık Habsburg ellerine düşüyor. Hem doğu hem batı imparatorluk tacı birleşir."
 hab_austrian_heartland: "Avusturya Merkez Topraklarını Kur"
 hab_austrian_heartland_desc: "Tuna boyunca Avusturya merkez toprakları: imparatorluk genişlemesinin kalbini güvenceye al ve ekonominin ve ordunun temelini kur."
 hab_tyrol_styria: "Tirol ve Steiermark"
 hab_tyrol_styria_desc: "Schwaz’ın gümüşü ve Leoben’in demiri: Tirol ve Steiermark madenleri Habsburg İmparatorluğu’nun maliyesini ve ordularını ayakta tutar."
 hab_dev_vienna: "Viyana’nın Gelişimi"
 hab_dev_vienna_desc: "“Müzik Şehri”, “Habsburgların Beyaz Şehri”: Viyana’yı bir imparatorluk başkentine layık bir görkemle doldur."
 hab_graz_fortress: "Graz’ı Tahkim Et"
 hab_graz_fortress_desc: "Graz: Steiermark’ın başkentini Osmanlı akınına karşı hazırlanmış aşılmaz bir kale şehrine dönüştür."
 hab_baroque_vienna: "Barok Viyana"
 hab_baroque_vienna_desc: "Viyana sarayında Barok müzik, mimari ve resim çiçek açar: üniversiteler ve sanat akademileri Habsburg kültürünün altın çağını müjdeler."
 hab_great_vienna: "Büyük Viyana Şehri"
 hab_great_vienna_desc: "Schönbrunn Sarayı, Aziz Stephan Katedrali: Viyana Avrupa’nın en büyük ve en güzel şehri olarak tamamlanır."
 hab_swiss_lands: "İsviçre Topraklarını Geri Al"
 hab_swiss_lands_desc: "Wilhelm Tell ile simgelenen aşağılanmayı yıka: Alp köylülerinin toprağını Habsburg Hanedanı için geri al."
 hab_south_german_cities: "Güney Almanya’nın Ticaret Şehirleri"
 hab_south_german_cities_desc: "Augsburg ve Frankfurt: Fugger ve Rothschild ailelerinin doğum yeri olan bu zengin şehirleri ele geçir."
 hab_unify_germany: "Almanya’nın Birleşmesi"
 hab_unify_germany_desc: "Dağınık Alman prenslikleri artık sonunda Habsburg sancağı altında birleşti."
 hab_north_sea_trade: "Kuzey Denizi Ticareti"
 hab_north_sea_trade_desc: "Hamburg ve Amsterdam: Kuzey Denizi ticaretinin denetimini ele geçir ve Hansa Birliği’nin yerini alacak yeni bir ticaret imparatorluğu inşa et."
 hab_hegemon_of_west: "Batı’nın Hegemonu"
 hab_hegemon_of_west_desc: "Fransa, İspanya: bir zamanlar Habsburg Hanedanı’na meydan okuyan Batı’nın her büyük gücü artık boyun eğdirildi."
 hab_tuscany: "Toskana’nın Fethi"
 hab_tuscany_desc: "Floransa’nın Rönesans kültürü: Medici himayesi altında çiçek açmış bu sanat topraklarını Habsburg İmparatorluğu’nun kanadı altına al."
 hab_surpass_poland: "Polonya’yı Geç"
 hab_surpass_poland_desc: "Polonya Krallığı: Doğu Avrupa’nın bu büyük gücüyle yüzleşmede Habsburg askerî üstünlüğünü kur."
 hab_wallachia_moldavia: "Eflak ve Moldavya"
 hab_wallachia_moldavia_desc: "Tuna’nın kuzeyindeki Romen prensliklerine boyun eğdir ve Balkanlar üzerindeki Habsburg egemenliğini tamamla."
 hab_austrian_army: "Avusturya Ordusunu Yeniden Düzenle"
 hab_austrian_army_desc: "Habsburg ordusu: çok etnikli alayların birleşiminden dövülmüş Avrupa’nın en güçlü ordusunu yetiştir."
 hab_spanish_tercios: "İspanyol Tercio’su"
 hab_spanish_tercios_desc: "Tercio: bu devrimci İspanyol askerî taktiğini tüm Habsburg ordusuna yay ve Avrupa’nın en iyi piyadesini mükemmelleştir."
 hab_multicultural: "Çok Etnikli İmparatorluk"
 hab_multicultural_desc: "Almanlar, Çekler, Macarlar, Hırvatlar, İtalyanlar: Habsburg İmparatorluğu’nun birçok halkı tek bir sancak altında birleştirme deneyi tamam."
 hab_alsace_lorraine: "Alsas-Loren"
 hab_alsace_lorraine_desc: "Ren boyundaki Alsas ve Loren: bu toprağı Habsburg İmparatorluğu’nun batı sınırı olarak güvenceye al."
 hab_renaissance_court: "Rönesans Sarayı"
 hab_renaissance_court_desc: "Rönesans’ın ışığı Viyana sarayında parlıyor: İtalyan sanatı ve Bizans ilmi kaynaşarak Habsburg kültürünü tam çiçeklenmeye getirir."
 hab_carinthia: "Karintiya"
 hab_carinthia_desc: "Karintiya: bu Alp dukalığını Habsburg egemenlik alanına kat ve İtalya’ya ve Balkanlar’a giden koridoru güvenceye al."
 hab_colonialism: "Sömürge İmparatorluğu"
 hab_colonialism_desc: "İspanya aracılığıyla Amerika’ya: Habsburg sancağı altında güneşin hiç batmadığı bir sömürge imparatorluğu inşa et."
 hab_universal_empire: "Evrensel İmparatorluk"
 hab_universal_empire_desc: "“Evrensel İmparatorluk: batıda Lizbon’dan doğuda İstanbul’a, kuzeyde Hamburg’dan güneyde Palermo’ya”: Büyük Karl’dan beri süren hayal gerçekleşir."
 hab_events.1.t: "Habsburg Hanedanı, Kutsal Roma Tahtına"
 hab_events.1.d: "Seçici prensler Habsburg Hanedanı’na desteklerini ilan etti: imparatorluk tahtı Habsburglar’a aittir."
 hab_events.1.a: "Habsburg İmparatoru çok yaşasın! İmparatorluk çok yaşasın!"
 hab_events.10.t: "Roma İmparatorlarının Varisi İlanı"
 hab_events.10.d: "İmparatorluk reformu tamam ve Ebedî Şehir Roma KRİ ile birleşti: Habsburg Hanedanı kendini “Roma İmparatorlarının varisi” ilan eder."
 hab_events.10.a: "İmparatorluk reformu çok yaşasın! Roma’nın varisi çok yaşasın!"
 hab_events.15.t: "Alman Birliği’nin İlanı"
 hab_events.15.d: "Kuzeyden güneye: bir zamanlar sayısız prenslik hâlinde parçalanmış Almanya Habsburg sancağı altında birleşti."
 hab_events.15.a: "Alman birliği çok yaşasın!"
 hab_events.20.t: "Fransa’nın Çöküşü: Tahta Giden Yol"
 hab_events.20.d: "Fransa nihayet Habsburg Hanedanı’na diz çöktü. Fransız tahtı üzerinde resmî bir hak iddiası kurma vakti geldi: altmış yıllık bir hak iddiası ilan et ve gözünü Fransa Krallığı’nın mirasına dik."
 hab_events.20.a: "Fransız tahtı üzerinde hak iddiası ilan et (60 yıl)"
 hab_events.25.t: "İspanya Tacı"
 hab_events.25.d: "“İspanya Kralı ve Avusturya Arşidükü”: İber Yarımadası artık Habsburg İmparatorluğu’nun egemenlik alanının içinde."
 hab_events.25.a: "İspanya çok yaşasın! Habsburg İmparatorluğu çok yaşasın!"
 hab_events.30.t: "İtalya Kralı"
 hab_events.30.d: "“Demir Taç” Habsburg imparatorunun alnında parlıyor: Lombardiya’dan Sicilya’ya tüm İtalya birleşti."
 hab_events.40.t: "Kraliyet Macaristan’ının Kuruluşu"
 hab_events.40.d: "Buda kurtarıldı: “Kraliyet Macaristan’ı” Habsburg İmparatorluğu’nun doğu sütunu olur."
 hab_events.40.a: "Macaristan kurtarıldı! Buda çok yaşasın!"
 hab_events.50.t: "Doğu İmparatoru"
 hab_events.50.d: "İstanbul Habsburg ellerine düştü: hem Doğu hem Batı Roma İmparatorluklarının başkentleri artık tek olarak tutuluyor."
 hab_events.50.a: "İstanbul çok yaşasın! Doğu İmparatoru çok yaşasın!"
 hab_events.55.t: "Büyük Viyana Şehri"
 hab_events.55.d: "Schönbrunn Sarayı, Aziz Stephan Katedrali: Viyana Avrupa’nın en büyük ve en güzel şehri olarak tamamlanır."
 hab_events.55.a: "Büyük Viyana Şehri çok yaşasın!"
 hab_events.65.t: "Bohemya: Taç Toprağı Olarak Katılım"
 hab_events.65.d: "Bohemya ile şahsi birlik derinleşti ve tam bütünleşme zamanı geldi. Onu bütünleşmiş bir taç toprağı olarak doğrudan yönet ya da mevcut şahsi birliği koru: karar ver."
 hab_events.65.a: "Bohemya’yı bütünleşmiş bir taç toprağı olarak kat"
 hab_events.99.t: "Evrensel İmparatorluk’un İlanı"
 hab_events.99.d: "“Evrensel İmparatorluk: Habsburg İmparatoru batıda Lizbon’dan doğuda İstanbul’a hüküm sürer”: bu ilan tüm Avrupa’da yankılanıyor."
 hab_events.99.a: "Evrensel İmparatorluk çok yaşasın! Habsburg İmparatorluğu ilelebet!"
 hab_events.65.b: "Mevcut şahsi birliği koru"
 STATIC_MODIFIER_NAME_hab_army_mod: "Seçkin Habsburg Ordusu"
 STATIC_MODIFIER_DESC_hab_army_mod: "Çeşitli etnik alayları birleştiren bir Habsburg ordusu Avrupa’nın en güçlü kara gücü olarak tamamlandı."
 STATIC_MODIFIER_NAME_hab_balkans_mod: "Balkanlar’ın Kurtuluşu"
 STATIC_MODIFIER_DESC_hab_balkans_mod: "Balkanlar’ın Hıristiyanları Osmanlı yönetiminden kurtarıldı."
 STATIC_MODIFIER_NAME_hab_baroque_mod: "Barok Viyana"
 STATIC_MODIFIER_DESC_hab_baroque_mod: "Barok sanat Viyana sarayında çiçek açar ve onu Avrupa kültürünün merkezi yapar."
 STATIC_MODIFIER_NAME_hab_boh_loyalty_mod: "Bohemya Bütünleşmesine Direniş"
 STATIC_MODIFIER_DESC_hab_boh_loyalty_mod: "Prag salonlarında Bohemyalı soylular eski özgürlüklerinin kaybına karşı mırıldanıyor."
