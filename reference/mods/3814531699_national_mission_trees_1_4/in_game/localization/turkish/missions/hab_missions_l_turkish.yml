 hab_stadtrechtsbriefe: "Stadtrechtsbriefe’yi Çıkar"
 hab_stadtrechtsbriefe_desc: "Stadtrechtsbriefe: “şehir hukuku fermanları”. Habsburg İmparatoru’nun güçlü kraliyet otoritesi altında diyar genelindeki şehirlere ayrıcalıklar tanı: Viyana için Wiener Stadtrecht, başka yerlerdeki imparatorluk kasabaları için Landstadt hakları."
 hab_stadtrechtsbriefe_unlock_tt: "Viyana Şehir Hukuku ve Landstadt şehir ayrıcalıklarının kilidini açar."
 hab_innsbruck_court: "Innsbruck Sarayı"
 hab_innsbruck_court_desc: "Innsbruck: Tirol’un bu merkez şehri gerçek bir şehre olgunlaştığına göre burada Habsburg Alp kültürünün merkezi olarak bir saray kur."
 hab_swarovski_crystal: "Swarovski Kristali"
 hab_swarovski_crystal_desc: "1737’den itibaren Innsbruck cam ustaları ince kristal kesme sanatını mükemmelleştirdi: Swarovski’nin kendisi doğmadan çok önce Tirol kristali zaten Avrupa saraylarını süslüyordu."
 STATIC_MODIFIER_NAME_hab_innsbruck_loc_mod: "Innsbruck Sarayı’nın Gelişimi"
 STATIC_MODIFIER_DESC_hab_innsbruck_loc_mod: "Innsbruck Habsburg Alp kültürünün merkezi olarak parlamaya başladı."
 STATIC_MODIFIER_NAME_hab_swarovski_mod: "Tirol’ün Kristal Sanayisi"
 STATIC_MODIFIER_DESC_hab_swarovski_mod: "Innsbruck cam ustaları ince kristal kesme sanatını mükemmelleştirdi."
 STATIC_MODIFIER_NAME_wiener_stadtrecht_town_rights: "Viyana Şehir Hukuku"
 STATIC_MODIFIER_DESC_wiener_stadtrecht_town_rights: "Yalnızca Viyana’ya verilen özel bir şehir hakkı: ticaret ve pazarlardaki avantajlar Viyana’nın refahını ayakta tutar."
 STATIC_MODIFIER_NAME_landstadt_town_rights: "Landstadt"
 STATIC_MODIFIER_DESC_landstadt_town_rights: "İmparatorluk şehirlerine verilen şehir hakları: yol ağını iyileştirirken taç gücünü soylu nüfuzuna karşı dengeler."
