l_turkish:
 brb_brabant_mission_pack: "Aşağı Lotaringya’nın Mirası: Düşük Ülkeler’i Birleştirmek ve Burgonya’yı Özümsemek"
 brb_brabant_mission_pack_DESCRIPTION:0 "Bağımsız bir dükalık evi tarafından yönetilen Brabant Dukalığı: Düşük Ülkeler’i birleştir, yeni türemiş Burgonya Dukalığı’nı tarihin önüne geçerek özümse ve gerçek bir altın çağ inşa et."
 brb_brabant_mission_pack_CRITERIA_DESCRIPTION:0 "Düşük Ülkeler’i birleştir, Burgonya’yı özümse ve bir altın çağa ulaşmak için bir cumhuriyet kur."
 brb_brabant_mission_pack_BUTTON_TOOLTIP:0 "Küçük bir dukalıktan Düşük Ülkeler’e ve Burgonya’ya hükmeden bir büyük dukalığa."
 brb_brabant_mission_pack_BUTTON_DETAILS:0 "“Je Maintiendrai”: tarihi tersine çevir ve Brabant’ın sancağını Düşük Ülkeler’e dik!"
 brb_ducal_authority: "Dükalık Otoritesini Kur"
 brb_ducal_authority_desc: "Leuven soyunun Dükü olarak otoritenin dukalığın her köşesine ulaşmasını sağla."
 brb_joyous_entry: "Neşeli Giriş (Blijde Inkomst)"
 brb_joyous_entry_desc: "“Neşeli Giriş”: yeni bir Dükün şehir kapılarından geçip kasabaların ayrıcalıklarını doğruladığı tören. Bu geleneği kur ve şehirlere kendi haklarını ver."
 brb_joyous_entry_unlock_tt: "“Neşeli Giriş Şehri” şehir ayrıcalığı kullanılabilir olur."
 brb_develop_antwerp: "Anvers’i Geliştir"
 brb_develop_antwerp_desc: "Schelde’nin ağzındaki ticaret şehri Anvers: onu daha da geliştir ve Kuzey Denizi ticaretinin merkezi olarak statüsünü sağlamlaştır."
 brb_unify_brabant: "Brabant’ı Birleştir"
 brb_unify_brabant_desc: "Kuzey ile güney arasında bölünmüş Brabant Dukalığı: onu tek bir sancak altında birleştir."
 brb_flemish_rivalry: "Flandre ile Rekabet"
 brb_flemish_rivalry_desc: "Zengin kumaş sanayisiyle bilinen Flandre Kontluğu: bu eski rakip üzerinde nüfuzumuzu kur."
 brb_hainaut_marriage: "Hainaut-Hollanda ile Evlilik"
 brb_hainaut_marriage_desc: "Wittelsbach Hanedanı’nca yönetilen Hainaut, Hollanda ve Zelanda: evlilik, ittifak ya da rekabet yoluyla bu tahta hak iddiasını güvenceye al."
 brb_liege_relations: "Liège ile İlişkiler"
 brb_liege_relations_desc: "Geniş dünyevî güç kullanan Liège Prens-Piskoposluğu: rekabet ya da evlilik bağları yoluyla bu toprak üzerinde bir hak iddiasını güvenceye al."
 brb_utrecht_bishopric: "Utrecht Piskoposluğu"
 brb_utrecht_bishopric_desc: "Geniş dünyevî güç kullanan Utrecht Piskoposluğu: onu Düşük Ülkeler’i birleştirmenin temeli olarak nüfuzumuz altına al."
 brb_burgundian_ambition: "Burgonya’ya Yönelik Emeller"
 brb_burgundian_ambition_desc: "Düşük Ülkeler’in başlıca topraklarına hâkim olduktan sonra emelin gözünü Fransız kraliyet evinin bir yan koluna ait yeni yükselen Burgonya Dukalığı’na çevir."
 brb_contest_flanders_inheritance: "Flandre Mirasına Karşı Mücadele"
 brb_contest_flanders_inheritance_desc: "Flandre’ın varisi Margaret’in evliliği: bu çekişmeli eşleşmeyi kazan ve Burgonya Hanedanı’ndan önce Flandre’ı kendimiz için ele geçir."
 brb_absorb_burgundy: "Burgonya’yı Özümse"
 brb_absorb_burgundy_desc: "Yeni türemiş Burgonya Dukalığı’nı ilhak et ya da boyun eğdir: tarihin akışını tersine çevir ve Düşük Ülkeler’in efendisinin Burgonya değil Brabant olduğunu kanıtla."
 brb_valois_brabant: "Brabant Büyük Dukalığı"
 brb_valois_brabant_desc: "Burgonya mirasını özümseyen Brabant artık salt bir dukalık değil: Düşük Ülkeler’e başkanlık eden büyük güç olarak yüksel."
 brb_je_maintiendrai: "Je Maintiendrai"
 brb_je_maintiendrai_desc: "Brabant, Flandre, Hollanda ve özümsenen Burgonya mirası: Düşük Ülkeler’in başlıca topraklarının efendisi olarak bu yönetimi sürdür."
 brb_hansa_relations: "Hansa İlişkileri"
 brb_hansa_relations_desc: "Baltık ticaretine hâkim olan Hansa Birliği: onlarla ilişkileri eşitlik konumundan yeniden kur."
 brb_bulk_trade: "Toplu Ticareti Destekle"
 brb_bulk_trade_desc: "Tahıl ve kereste toplu ticareti: ticaret filomuzun Baltık’taki varlığını artır."
 brb_baltic_supremacy: "Baltık Ticaret Üstünlüğü"
 brb_baltic_supremacy_desc: "Kuzey ticaret yollarının efendisi gerçek bir ticaret gücüdür: Baltık ticaretinde üstünlük kur."
 brb_land_commercial_empire: "Kara Ticaret İmparatorluğu"
 brb_land_commercial_empire_desc: "Yalnızca deniz değil: büyük iç pazar merkezlerine hâkim ol ve kara ticaretinde de hâkimiyet iddia et."
 brb_secure_grain: "Baltık Tahılını Güvenceye Al"
 brb_secure_grain_desc: "Düşük Ülkeler uzun süredir Baltık tahılına güvendi: bu arzı kendi ellerimize al."
 brb_reformation_choice: "Reform Tercihi"
 brb_reformation_choice_desc: "Luther’in öğretileri Düşük Ülkeler’i sarsıyor: inancın bu kavşağında hangi yolu seçeceğiz?"
 brb_religious_settlement: "Dinî Uzlaşma"
 brb_religious_settlement_desc: "Reform’dan bir yüzyıldan fazla sonra devlet inancı halkın büyük çoğunluğu üzerinde hâkim olduğuna göre çatışan inançlar arasında istikrarlı bir uzlaşma getir."
 brb_spanish_fury: "İspanyol Öfkesi"
 brb_spanish_fury_desc: "Habsburg baskısı ve ağır vergilendirme: halkın “İspanyol Öfkesi”ne karşı öfkesi artık dizginlenemez."
 brb_sea_beggars: "Deniz Dilencileri"
 brb_sea_beggars_desc: "Kendilerine “Deniz Dilencileri” diyen korsanlar: kahramanlıkları İspanya’nın denizlere hâkimiyetinde delikler açıyor."
 brb_eighty_years_war: "Seksen Yıl Savaşları"
 brb_eighty_years_war_desc: "Bağımsızlık için uzun bir mücadele: bu Seksen Yıl Savaşları’na dayan ve özgürlüğümüzü kazan."
 brb_united_netherlands: "Birleşik Hollanda"
 brb_united_netherlands_desc: "Yedi eyaletin federasyonu: burada Brabant Büyük Dükü altında hem soylu hem şehir geleneklerini sürdüren bir prenslik konfederasyonu kur."
 brb_east_india_charter: "Doğu Hindistan Beratı"
 brb_east_india_charter_desc: "Asya ticaretinde tekel hedefleyen bir Doğu Hindistan Şirketi kurma beratını ver."
 brb_voc_trade_empire: "VOC Ticaret İmparatorluğu"
 brb_voc_trade_empire_desc: "“Birleşik Doğu Hindistan Şirketi” (VOC): dünyanın ilk anonim şirketi ticaret ağını Baharat Adaları’ndan Asya’ya yayar."
 brb_west_india_company: "Batı Hindistan Şirketi"
 brb_west_india_company_desc: "Yeni Dünya’yı ve Afrika’yı birbirine bağlayan ticaret: Batı Hindistan Şirketi’ni kur ve Atlantik’in servetinden pay al."
 brb_golden_age: "Altın Çağ"
 brb_golden_age_desc: "Rembrandt, Vermeer ve gelişen ticaret: “Hollanda Altın Çağı”nın zirvesine ulaş."
 brb_amsterdam_exchange: "Amsterdam Borsası"
 brb_amsterdam_exchange_desc: "Dünyanın ilk borsası: Amsterdam’ı Avrupa maliyesinin merkezi yap."
 brb_form_netherlands: "Hollanda Büyük Dukalığı Tamamlandı"
 brb_form_netherlands_desc: "Aşağı Lotaringya’nın mirasıyla ve Burgonya’nın özümsenmesiyle başlayan, bağımsızlık ve altın çağdan geçen uzun yol, soylu ve şehir geleneklerinin derin köklerini koruyan bir büyük dukalık olarak burada tamamlanır."
 brb_wool_staple_calais: "Calais Yün Antreposu"
 brb_wool_staple_calais_desc: "Flandre kumaş sanayisinin can damarı olan İngiliz yünü: Calais’deki yün antreposu aracılığıyla ticareti canlandır."
 brb_anglo_dutch_alliance: "İngiliz-Hollanda İttifakı"
 brb_anglo_dutch_alliance_desc: "Manş’ın karşısındaki komşumuz İngiltere: Yüz Yıl Savaşları’nın kaosu içinde ittifak ya da rekabet yoluyla bu ulusla sağlam bir ilişki kur."
 brb_english_channel_trade: "Manş Ticaretine Hâkimiyet"
 brb_english_channel_trade_desc: "Kuzey Denizi’ni Atlantik’e bağlayan Manş: bu hayati boğaz boyunca ticarette üstünlük kur."
 brb_valois_suzerainty_dispute: "Valois Üstünlüğüne İtiraz"
 brb_valois_suzerainty_dispute_desc: "Nominal olarak Fransız tacının bir vasalı: bu üstünlüğe itiraz et ve eşitlik konumu talep et."
 brb_hundred_years_war_intervention: "Yüz Yıl Savaşları’na Müdahale"
 brb_hundred_years_war_intervention_desc: "İngiltere’yi ve Fransa’yı parçalayan uzun savaş: bu fırsatı kendi çıkarımız için müdahale etmek üzere değerlendir."
 brb_somme_towns: "Somme Kasabaları"
 brb_somme_towns_desc: "Picardie’nin zengin kasabaları: Somme boyunca uzanan toprakları egemenlik alanımıza kat."
 brb_end_french_vassalage: "Fransız Vasallığına Son Ver"
 brb_end_french_vassalage_desc: "Bu nominal vasallığı tamamen kes ve gerçekten bağımsız bir büyük dukalık olarak statümüzü kur."
 brb_events.1.t: "Seksen Yıl Savaşları Başlıyor"
 brb_events.1.d: "Utrecht Birliği ve Deniz Dilencileri’nin kahramanlıkları yoluyla İspanya ile uzun savaş başladı. Bu mücadele bağımsızlığımıza karar verecek."
 brb_events.1.a: "Özgürlük ya da ölüm!"
 brb_events.2.t: "Burgonya’ya Yönelik Emeller"
 brb_events.2.d: "Yeni türemiş Burgonya Dukalığı: kaderi hakkında hangi yolu seçeceğiz?"
 brb_events.2.a: "Altın öde ve onları vasal olarak karşıla"
 brb_events.2.b: "Dijon üzerinde hak iddia et ve kuvvetle almaya hazırlan"
 brb_events.2.c: "Şimdilik izle ve bekle"
 brb_events.3.t: "Flandre Mirasına Karşı Mücadele"
 brb_events.3.d: "Flandre’ın varisi Margaret üzerindeki veraset anlaşmazlığı: bu zengin toprağı kendimiz için nasıl güvenceye alacağız?"
 brb_events.3.a: "Altın öde ve onları vasal olarak karşıla"
 brb_events.3.b: "Brugge üzerinde hak iddia et ve kuvvetle almaya hazırlan"
 brb_events.3.c: "Şimdilik izle ve bekle"
 brb_events.99.t: "Hollanda Büyük Dukalığı’nın İlanı"
 brb_events.99.d: "Aşağı Lotaringya’yı miras alan ve Burgonya’yı özümseyen küçük dukalık, bağımsızlık ve altın çağdan geçerek soylu ve şehir geleneklerinin derin köklerini koruyan Brabant Hanedanı altında bir büyük dukalık olarak yeniden doğdu."
 brb_events.99.a: "Büyük Dukalığa şeref!"
 STATIC_MODIFIER_NAME_brb_ducal_mod: "Dükalık Otoritesi Kuruldu"
 STATIC_MODIFIER_DESC_brb_ducal_mod: "Leuven üzerinde dalgalanan dükalık sancağı dukalığın her kale kasabasında aynı otoriteyi ilan ediyor."
 STATIC_MODIFIER_NAME_brb_antwerp_mod: "Anvers Güvence Altında"
 STATIC_MODIFIER_DESC_brb_antwerp_mod: "Anvers ticaret şehri gelişiyor."
 STATIC_MODIFIER_NAME_brb_unify_brabant_mod: "Brabant Birleşti"
 STATIC_MODIFIER_DESC_brb_unify_brabant_mod: "Bir zamanlar kuzey ile güney arasında bölünmüş malikâne lordları artık aynı dükalık sarayında diz çöküyor."
 STATIC_MODIFIER_NAME_brb_flemish_mod: "Flandre ile Rekabet"
 STATIC_MODIFIER_DESC_brb_flemish_mod: "Gent’in ve Brugge’ün dokumacıları bile artık işlerini Brabant Dükü’nün isteklerini gözeterek yürütüyor."
 STATIC_MODIFIER_NAME_brb_utrecht_mod: "Utrecht Piskoposluğu"
 STATIC_MODIFIER_DESC_brb_utrecht_mod: "Utrecht katedralinin çanları artık Brabant Dükü’nün saltanatını kutsayan dualarla çalıyor."
 STATIC_MODIFIER_NAME_brb_absorb_burgundy_mod: "Burgonya Özümsendi"
 STATIC_MODIFIER_DESC_brb_absorb_burgundy_mod: "Dijon hazinesinin anahtarları artık Brüksel sarayında asılı duruyor."
 STATIC_MODIFIER_NAME_brb_maintiendrai_mod: "Je Maintiendrai"
 STATIC_MODIFIER_DESC_brb_maintiendrai_mod: "“Sürdüreceğim”: Düşük Ülkeler’in lordları ve burjuvaları bu slogan altında aynı sarayda toplanıyor."
 STATIC_MODIFIER_NAME_brb_hansa_mod: "Hansa İlişkileri"
 STATIC_MODIFIER_DESC_brb_hansa_mod: "Lübeck’ten Hansa tüccarları artık Anvers’in muhasebe evlerinde eşit olarak yerlerini alıyor."
 STATIC_MODIFIER_NAME_brb_bulk_trade_mod: "Toplu Ticaret Destekleniyor"
 STATIC_MODIFIER_DESC_brb_bulk_trade_mod: "Tahıl ve kerestenin yığıldığı gemiler Schelde ağzındaki tersanelere durmaksızın sipariş gönderiyor."
 STATIC_MODIFIER_NAME_brb_baltic_supremacy_mod: "Baltık Ticaret Üstünlüğü"
 STATIC_MODIFIER_DESC_brb_baltic_supremacy_mod: "Baltık boyunca sayısız ticaret gemisinin yelkenleri Brabant’ın aslan sancağını taşıyor."
 STATIC_MODIFIER_NAME_brb_land_commercial_empire_mod: "Kara Ticaret İmparatorluğu"
 STATIC_MODIFIER_DESC_brb_land_commercial_empire_mod: "Köln’den ve Paris’ten gelen arabalar Brüksel’in ve Leuven’in pazarlarında sıra sıra bekliyor."
 STATIC_MODIFIER_NAME_brb_grain_mod: "Baltık Tahılı Güvence Altında"
 STATIC_MODIFIER_DESC_brb_grain_mod: "Baltık tahılı ambarları sürekli doldurduğundan askerler açlık korkusu olmadan çağrıya yürüyor."
 STATIC_MODIFIER_NAME_brb_reformation_mod: "Reform Tercihi"
 STATIC_MODIFIER_DESC_brb_reformation_mod: "Minberlerin altında ve pazarın köşelerinde insanlar yeni inançtan alçak sesle söz ediyor."
 STATIC_MODIFIER_NAME_brb_settlement_mod: "Dinî Uzlaşma"
 STATIC_MODIFIER_DESC_brb_settlement_mod: "Bir zamanlar inanç yüzünden savaşan komşular artık aynı pazar tezgâhlarında omuz omuza duruyor."
 STATIC_MODIFIER_NAME_brb_spanish_fury_mod: "İspanyol Öfkesi"
 STATIC_MODIFIER_DESC_brb_spanish_fury_mod: "Anvers’in küllerini gören insanların öfkesi hâlâ kılıcı kavrayan ellere güç veriyor."
 STATIC_MODIFIER_NAME_brb_sea_beggars_mod: "Deniz Dilencileri"
 STATIC_MODIFIER_DESC_brb_sea_beggars_mod: "“Kralın adamlarından dilenci olmak yeğdir”: Deniz Dilencileri’nin bayrağı İspanyol denizcilerin rüyalarında kâbus oldu."
 STATIC_MODIFIER_NAME_brb_united_netherlands_mod: "Birleşik Hollanda"
 STATIC_MODIFIER_DESC_brb_united_netherlands_mod: "Yedi eyaletin sancakları tek bir meclis salonunda yan yana duruyor ve yeni bir devlet bir prenslik konfederasyonu olarak ilk nefesini alıyor."
 STATIC_MODIFIER_NAME_brb_east_india_mod: "Doğu Hindistan Beratı"
 STATIC_MODIFIER_DESC_brb_east_india_mod: "Beratın üzerindeki balmumu mühür kurumadan Doğu’ya giden filolar yelken açmaya başladı."
 STATIC_MODIFIER_NAME_brb_voc_mod: "VOC Ticaret İmparatorluğu"
 STATIC_MODIFIER_DESC_brb_voc_mod: "Batavia ticaret karakollarından gelen karabiber ve karanfil uzaktaki sömürge valilerini bile anavatana bağlıyor."
 STATIC_MODIFIER_NAME_brb_wic_mod: "Batı Hindistan Şirketi"
 STATIC_MODIFIER_DESC_brb_wic_mod: "Atlantik’in ötesindeki şeker ve gümüş söylentileri yeni bir dünya hayal eden göçmenleri limanlara sürüklüyor."
 STATIC_MODIFIER_NAME_brb_golden_age_mod: "Altın Çağ"
 STATIC_MODIFIER_DESC_brb_golden_age_mod: "Büyük tüccarların kanalbaşı konaklarında Vermeer’in ışığına bulanmış pencere aydınlatmalı odaların resimleri asılı duruyor."
 STATIC_MODIFIER_NAME_brb_amsterdam_mod: "Amsterdam Borsası"
 STATIC_MODIFIER_DESC_brb_amsterdam_mod: "Maliyenin merkezi Amsterdam gelişiyor."
 STATIC_MODIFIER_NAME_brb_wool_staple_mod: "Calais Yün Antreposu"
 STATIC_MODIFIER_DESC_brb_wool_staple_mod: "Calais’deki yün antreposunda Flandre’ın dokumacılarına giden İngiliz yünü balyaları yüksekçe yığılmış."
 STATIC_MODIFIER_NAME_brb_anglo_treaty_mod: "İngiliz-Hollanda İttifakı"
 STATIC_MODIFIER_DESC_brb_anglo_treaty_mod: "İttifak sözleri taşıyan elçiler Manş’ın iki yakasındaki saraylar arasında tekrar tekrar gidip geliyor."
 STATIC_MODIFIER_NAME_brb_channel_trade_mod: "Manş Ticaretine Hâkimiyet"
 STATIC_MODIFIER_DESC_brb_channel_trade_mod: "Kuzey Denizi’ni Atlantik’e götüren dar boğazda Brabant’ın ticaret bayrakları artık sıra sıra dalgalanıyor."
 STATIC_MODIFIER_NAME_brb_suzerainty_dispute_mod: "Valois Üstünlüğüne İtiraz"
 STATIC_MODIFIER_DESC_brb_suzerainty_dispute_mod: "Brüksel’in kapıları vasallarını çağırmak için Paris’ten gönderilen ulakları utanmadan geri çevirdi."
 STATIC_MODIFIER_NAME_brb_intervention_mod: "Yüz Yıl Savaşları’na Müdahale"
 STATIC_MODIFIER_DESC_brb_intervention_mod: "Yüz Yıl Savaşları’nın çamurunda savaşan askerler hem Fransa’nın hem İngiltere’nin savaş yollarını öğrenmiş olarak döndü."
 STATIC_MODIFIER_NAME_brb_somme_mod: "Somme Kasabaları"
 STATIC_MODIFIER_DESC_brb_somme_mod: "Somme boyunca surları ele geçiren dükalık ordusu kuzey Fransa ovalarına sağlam bir tutunak dikti."
 STATIC_MODIFIER_NAME_brb_end_vassalage_mod: "Fransız Vasallığının Sonu"
 STATIC_MODIFIER_DESC_brb_end_vassalage_mod: "Fransa kralının armalarının söküldüğü kapıların üzerinde artık yalnızca Brabant Dükü’nün sancağı dalgalanıyor."
 STATIC_MODIFIER_NAME_brb_form_netherlands_mod: "Hollanda Büyük Dukalığı Tamamlandı"
 STATIC_MODIFIER_DESC_brb_form_netherlands_mod: "Soylu sancakların ve şehir bayraklarının yan yana dalgalandığı büyük dukalığın sarayında Hollanda’nın lordları ve burjuvaları yeni bir çağın şafağını birlikte kutluyor."
