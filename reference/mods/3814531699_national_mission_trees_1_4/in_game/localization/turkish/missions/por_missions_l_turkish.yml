l_turkish:
 por_portuguese_mission_pack: "Keşifler Çağı: Portekiz’in Deniz İmparatorluğu"
 por_portuguese_mission_pack_DESCRIPTION:0 "1337’de Portekiz İber Yarımadası’nın batı ucunda küçük bir krallıktır. Ama Denizci Prens Henrique’nin (1394-1460) düzenlediği seferler dünyayı değiştirecek: Madeira, Azorlar, Batı Afrika, Ümit Burnu, Hindistan, Malakka, Brezilya. Atlantik’ten Hint Okyanusu’na Portekizli denizcilerin denizlere hükmettiği “Estado da Índia”yı kur."
 por_portuguese_mission_pack_CRITERIA_DESCRIPTION:0 "Ana yurdu geliştir, Hint Okyanusu’na ulaşmak için Afrika’yı dolaş, Brezilya’yı kolonileştir ve Denizlerin Efendisi olarak hüküm sür."
 por_portuguese_mission_pack_BUTTON_TOOLTIP:0 "Portekiz’in Keşifler Çağı imparatorluğunu gerçekleştirmek için görevleri tamamla."
 por_portuguese_mission_pack_BUTTON_DETAILS:0 "Denizci Prens Henrique’den II. Felipe’nin Portekiz’ine!"
 por_infante_henrique: "Portekiz’in Denizcilik Geleneği"
 por_infante_henrique_desc: "1337’de Portekiz İber Yarımadası’nın batı ucunda küçük bir krallıktır. IV. Afonso’nun yönetiminde Portekiz Río Salado Muharebesi’nde (1340) Kastilya’yı destekledi ve bir deniz gücü olarak Merinileri püskürttü. Atlantik’e bakan bu krallığın denize uzun süredir bir yakınlığı vardır. Lizbon limanı, Algarve balıkçıları, Atlantik rüzgârları: bu denizcilik geleneği gelecek nesiller için Keşifler Çağı’nı doğuracak temeldir."
 por_dev_lisbon: "Lizbon’u Geliştir"
 por_dev_lisbon_desc: "Tejo’nun ağzındaki Lizbon doğal bir limanla kutsanmıştır. Kadim Fenikelilerce kurulan bu şehri Portekiz İmparatorluğu’nun başkenti olarak geliştirmek onu dünya ticaretinin merkezi yapar."
 por_dev_porto: "Porto’yu Geliştir"
 por_dev_porto_desc: "Douro Nehri üzerindeki Porto şarap ve balıkçılık şehridir. Gelecek nesiller için “Portekiz (Porto’nun limanı)” adına adını verecek bu kadim şehri geliştir."
 por_university_coimbra: "Coimbra Üniversitesi"
 por_university_coimbra_desc: "1290’da kurulan Coimbra Üniversitesi Portekiz’in en eski üniversitesidir: denizciler, hukukçular ve din adamları yetiştirir. Prens Henrique’nin hizmetindeki birçok bilgin burada okudu."
 por_lisbon_entrepot_nmt: "Ticaret Antreposu Olarak Lizbon"
 por_lisbon_entrepot_nmt_desc: "Doğu mallarının buradan tüm Avrupa’ya dağıtılması için Lizbon’un liman idaresini geliştir. Karabiber, baharat, ipek: Lizbon Avrupa’nın en büyük baharat pazarı olur."
 por_avis_dynasty: "Aviz Hanedanı’nı Güçlendirmek"
 por_avis_dynasty_desc: "1385 hanedan krizinden sağ çıkan Aviz Hanedanı: I. João’nun zaferi istikrarlı yönetim temeline sahip bir Portekiz hanedanı kurdu."
 por_ordenacoes_afonsinas: "Ordenações Afonsinas"
 por_ordenacoes_afonsinas_desc: "1446’da derlenen Ordenações Afonsinas Portekiz’in ilk sistematik hukuk kanunnamesidir. Sonraki Manueline ve Philippine kanunnamelerinin prototipi olarak Portekiz’in hukuk geleneğini kurar."
 por_dev_evora: "Évora’yı Geliştir"
 por_dev_evora_desc: "Alentejo bölgesinin başlıca şehri Évora: Roma tapınaklarını koruyan bu kadim şehir bir tarım ve kültür merkezi olarak geliştirilir."
 por_algarve_fisheries: "Algarve Balıkçılığı"
 por_algarve_fisheries_desc: "Güney Portekiz’in Algarve bölgesi Atlantik balıkçılık sahalarına komşudur. Morina, sardalya ve ton balığının zengin balıkçılığı Keşifler Çağı’nın temeli olacak Portekiz’in denize yakınlığını besler."
 por_ceuta_gateway: "Septe: Afrika’ya Açılan Kapı"
 por_ceuta_gateway_desc: "1415’te I. João’nun Portekiz kuvvetleri Septe’yi fethetti: Portekiz’in denizaşırı genişlemesinin başlangıcı. Prens Henrique burada Müslüman tüccarlardan Sahra ticaret yolları hakkında bilgi edindi ve Afrika boyunca güneye yelken açma emelini besledi."
 por_conquer_tangier: "Tanca’yı Fethet"
 por_conquer_tangier_desc: "Cebelitarık Boğazı’nın karşısında Septe’ye bakan Tanca: Kuzey Afrika Müslüman güçleri üzerindeki baskıyı artır ve Atlantik çıkışını güvenceye al."
 por_moroccan_fortress: "Fas Kaleleri"
 por_moroccan_fortress_desc: "Agadir dahil Fas ticaret şehirlerini denetleyerek Sahra ötesi ticaretin sonuna hâkim ol ve altın, fildişi ve tuz kârlarını tekelleştir."
 por_madeira_settlement: "Madeira’yı İskân Et"
 por_madeira_settlement_desc: "Portekizlilerin 1419’da ulaştığı Madeira: ilk Atlantik kolonisi. Bu ıssız adaya şeker getirmek sonradan Brezilya’da ve Batı Hint Adaları’nda kullanılacak şeker plantasyonu modelini kurdu."
 por_azores_settlement: "Azorlar’ı İskân Et"
 por_azores_settlement_desc: "Atlantik’in ortasındaki Azorlar’ı kolonileştirmek Atlantik aşırı yollarda bir mola noktası güvenceye alır. Bunu üs olarak kullanmak batıya doğru daha fazla keşfi mümkün kılar."
 por_guinea_trade: "Gine Ticareti"
 por_guinea_trade_desc: "Portekizlilerin Batı Afrika kıyısı boyunca güneye yelken açarak ulaştığı Gine Körfezi: altın, fildişi ve sonradan köle ticareti başlar. Prens Henrique’nin hayali gerçeğe dönüşüyor."
 por_gold_coast: "Altın Sahil"
 por_gold_coast_desc: "Elmina (1482): Portekiz’in Afrika’da inşa ettiği ilk kalıcı ticaret kalesi. Bu “Altın Sahil” bölgesinden Portekiz’e büyük miktarlarda altın akar."
 por_sao_tome_sugar: "São Tomé Şekeri"
 por_sao_tome_sugar_desc: "Ekvator yakınlarındaki São Tomé Adası şeker plantasyonları için idealdir. Afrika anakarasından gelen zorla çalıştırılan emekle São Tomé Avrupa’nın en büyük şeker tedarikçisi olur."
 por_angola_colony: "Angola Kolonisi"
 por_angola_colony_desc: "São Tomé’den sonraki bir sonraki üs olarak Angola önemli bir Portekiz kolonisi olur. Kongo Krallığı ile ticaret ilişkileri kur ve orta-batı Afrika’ya nüfuzu genişlet."
 por_cape_of_good_hope: "Ümit Burnu"
 por_cape_of_good_hope_desc: "1488’de Bartolomeu Dias Afrika’nın en güney ucuna, “Fırtınalar Burnu”na ulaştı. II. João onu “Ümit Burnu” olarak yeniden adlandırdı, çünkü Hindistan’a giden yol artık açıktı."
 por_east_africa_trading_posts: "Doğu Afrika Ticaret Karakolları"
 por_east_africa_trading_posts_desc: "Mozambik, Sofala: Svahili kıyısının altın ve fildişi ticaret karakollarını ele geçirmek Hint Okyanusu ticaret ağına girişi sağlar."
 por_mombasa_fort: "Mombasa Kalesi"
 por_mombasa_fort_desc: "Mombasa ve Malindi: Doğu Afrika’nın en büyük ticaret şehirlerine boyun eğdirmek Hint Okyanusu’nun denetimini kurar. 1498’de Vasco da Gama Malindi’den Hindistan’a bir seyir rehberi edindi."
 por_vasco_da_gama: "Vasco da Gama Hindistan’a Ulaşıyor"
 por_vasco_da_gama_desc: "20 Mayıs 1498: Vasco da Gama Kalküt’e (Kozhikode) ayak bastı. Bu anda Avrupa ile Asya’yı bağlayan deniz yolu açıldı ve Arap tüccarların ve Venedik’in tekelindeki baharat ticaretinin yapısı kökten değişti."
 por_conquer_goa: "Goa’yı Fethet"
 por_conquer_goa_desc: "1510’da Albuquerque Goa’yı fethetti: Portekiz’in “Doğu Başkenti”nin doğuşu. Hindistan’ın batı kıyısındaki Goa’nın doğal limanı Estado da Índia’nın (Portekiz Hindistan’ı) merkezi olarak gelişir."
 por_malabar_trade: "Malabar Kıyısı Baharatları"
 por_malabar_trade_desc: "Kochi, Kalküt, Kollam: Malabar kıyısı karabiber, kakule ve zencefil üretir. Burada baharatları tekelleştirerek Portekiz Avrupa baharat fiyatlarını denetler."
 por_hormuz_control: "Hürmüz’ü Denetle"
 por_hormuz_control_desc: "1515’te Albuquerque Basra Körfezi’nin girişindeki Hürmüz’ü fethetti. Bu noktayı denetlemek İran-Hindistan ticaretine hâkim olmak ve İslam dünyasının ticaretini kesmek demektir."
 por_conquer_malacca: "Malakka’yı Fethet"
 por_conquer_malacca_desc: "Temmuz 1511’de Afonso de Albuquerque 1.200 Portekizli askerle Malakka’yı fethetti: Keşifler Çağı’nın en büyük stratejik zaferi. “Doğu ticaretinin boğazını” denetleyerek baharat, ipek ve porselenin tüm ticaret yolları ele geçirilir."
 por_spice_monopoly: "Baharat Ticareti Tekeli"
 por_spice_monopoly_desc: "Goa, Hürmüz ve Malakka güvence altındayken Hint Okyanusu baharat ticaret yolları tamamen Portekiz denetiminde. Karabiber, hindistan cevizi ve karanfil Lizbon üzerinden Avrupa’ya sunulur."
 por_indian_ocean_empire: "Hint Okyanusu İmparatorluğu"
 por_indian_ocean_empire_desc: "Doğu Afrika’dan Malakka’ya Portekiz donanması Hint Okyanusu’nu denetler. Lizbon’daki Casa da Índia (Hindistan Evi) tüm baharat ticaretini yönetir ve muazzam servet Portekiz’e akar."
 por_brazil_discovery: "Brezilya’nın Keşfi"
 por_brazil_discovery_desc: "22 Nisan 1500: 13 gemiyle Hindistan’a yelken açan Pedro Álvares Cabral bir fırtınadan kaçınmak için çok batıya sapıp bilinmeyen bir toprak keşfetti. “Ilha de Vera Cruz (Gerçek Haç Adası)”: sonradan “Brezilya” (pau-brasil boya ağacından) adı verildi. Tordesillas Antlaşması uyarınca bu toprak Portekiz toprağı olur ve sonradan Portekiz’in en büyük kolonisi olacak."
 por_brazil_colony: "Brezilya’yı Kolonileştir"
 por_brazil_colony_desc: "1532’de Martim Afonso de Sousa Brezilya’nın ilk kalıcı kolonisi “São Vicente”yi kurdu. Portekizli yerleşimcilerin ve yerli halkların iç içe geçtiği yeni bir toplum ortaya çıkıyor."
 por_brazil_sugar: "Brezilya’nın Şeker Sanayisi"
 por_brazil_sugar_desc: "16. yüzyılın ortalarına gelindiğinde Brezilya Avrupa’nın en büyük şeker tedarikçisi olmuştu. Pernambuco ve Bahia’nın engenho’ları (şeker değirmenleri) Afrika’dan zorla çalıştırılan emekle işler ve muazzam servet yaratır."
 por_brazil_empire: "Brezilya İmparatorluğu"
 por_brazil_empire_desc: "Bahia, Pernambuco, Rio de Janeiro: Brezilya’nın koloniler imparatorluk ölçeğine büyüdü. Şeker, boya ağacı ve sonradan altın ve mücevherler Portekiz’e servet akışları yaratır."
 por_naval_supremacy: "Deniz Üstünlüğü"
 por_naval_supremacy_desc: "Hem Atlantik’i hem Hint Okyanusu’nu denetleyen Portekiz donanması: karavelanın üstün manevra kabiliyeti ve top ateş gücü Arap, Hint ve Çin ticaret gemilerini bunaltır."
 por_caravel: "Karavela"
 por_caravel_desc: "Prens Henrique çağında geliştirilen karavela (Caravela), rüzgâra karşı yelken açabilen lateen yelkenli bu küçük hızlı gemi Keşifler Çağı’nı mümkün kıldı. Santa María da bir karavelaydı."
 por_padroes: "Padrões (Taş Sütunlar)"
 por_padroes_desc: "Portekizli kâşifler Afrika’nın çeşitli yerlerine taş sütunlar (padrões) dikti ve üzerlerine Portekiz kralının adını ve Hıristiyan haçını kazıdı. Bu bir keşif ve egemenlik ilanıydı: Portekiz’in erişim noktaları taşa kazındı."
 por_royal_navy: "Kraliyet Donanması"
 por_royal_navy_desc: "Dünyanın en güçlü donanması Portekiz üstünlüğünü destekler: kalyonlar, karaklar ve karavelalar Hint Okyanusu’ndan Brezilya’ya kadar her şeyi korur."
 por_dev_setubal: "Setúbal’ı Geliştir"
 por_dev_setubal_desc: "Lizbon’un güneyindeki Setúbal Körfezi doğal bir limandır. Onu Lizbon’u tamamlayan, tuz, balık ve şarap üreten bir liman şehri olarak geliştir."
 por_order_of_christ: "Mesih Tarikatı"
 por_order_of_christ_desc: "1319’da kurulan Mesih Tarikatı (Ordem de Cristo): Portekiz’de Tapınak Şövalyeleri’nin halefi olarak kurulan bu askerî tarikat Prens Henrique’nin keşiflerini maddi olarak destekledi. Tarikatın kırmızı haçı Portekiz yelkenlerine boyandı."
 por_treaty_tordesillas: "Tordesillas Antlaşması"
 por_treaty_tordesillas_desc: "1494’te İspanya ve Portekiz, Papa VI. Alexander’in arabuluculuğuyla Tordesillas Antlaşması’nı akdetti: Atlantik’i dikey olarak bölerek batıyı İspanya’ya, doğuyu Portekiz’e verdi. Bu antlaşma Brezilya’yı Portekiz toprağı olarak doğruladı."
 por_colonial_administration: "Sömürge İdaresi"
 por_colonial_administration_desc: "Afrika’ya, Hindistan’a ve Brezilya’ya yayılan Portekiz İmparatorluğu’nu yönetmek için idari mekanizma: valiler ve genel valiler Lizbon’daki krala rapor verir ve ticaret gelirlerini anavatana gönderir."
 por_estado_da_india_nmt: "Estado da Índia"
 por_estado_da_india_nmt_desc: "“Estado da Índia (Hindistan Devleti)”: Portekiz’in tüm Asya imparatorluğunu ifade eden kavram. Başkent Goa ve Doğu Afrika’dan Malakka’ya deniz ticaret yollarının denetimiyle bu “imparatorluk” tarihin ilk gerçek anlamda küresel deniz imparatorluğudur."
 por_dev_tomar: "Tomar’ı Geliştir"
 por_dev_tomar_desc: "Mesih Tarikatı’nın karargâhı Tomar: Mesih Manastırı (Convento de Cristo) Portekiz Manueline mimarisinin en ince örneği olarak bilinir. Tarikatın mali kaynaklarıyla onu geliştir."
 por_wine_trade: "Portekiz Şarap Ticareti"
 por_wine_trade_desc: "Douro Vadisi şarapları, yani “Porto şarabı”nın prototipi, İngiltere’ye ve Flandre’a büyük bir ihraç malıdır. Methuen Antlaşması’ndan (1703) önce gelen İngiliz-Portekiz ticaret ilişkisini kur."
 por_dev_faro: "Faro’yu Geliştir"
 por_dev_faro_desc: "Algarve bölgesinin başlıca şehri Faro, 1249’da Hıristiyan Reconquista’sıyla Portekiz’e katıldı: bu güney şehrini balıkçılık ve ticaret merkezi olarak geliştir."
 por_cape_verde: "Yeşil Burun Adaları"
 por_cape_verde_desc: "1456’da keşfedilen Yeşil Burun Adaları Afrika ile Amerika arasındaki yolda stratejik bir konum işgal eder. Atlantik aşırı ticaret için bir aktarma noktası olarak sonraki Brezilya kolonizasyonu için bir tedarik üssü olurlar."
 por_lisbon_megalopolis: "Lizbon: Dünya Şehri"
 por_lisbon_megalopolis_desc: "16. yüzyılda Lizbon 100.000’i aşan nüfusuyla Avrupa’nın en büyük şehirlerinden biri oldu. Doğu baharatları, Afrika altını ve Brezilya şekeri burada buluşarak ona “dünyanın başkenti” lakabını kazandırdı."
 por_casa_india: "Casa da Índia"
 por_casa_india_desc: "Lizbon’da kurulan Casa da Índia (Hindistan Evi) bir devlet kurumu olarak Portekiz’in Doğu ticaretini münhasıran yönetir. Tüm baharat ithalatı buradan geçer ve muazzam gümrük geliri yaratır."
 por_brazil_wood: "Pau-Brasil (Brezilya Ağacı)"
 por_brazil_wood_desc: "Brezilya’ya adını veren pau-brasil (Brezilya ağacı): bu kırmızı boya ağacı Avrupa’nın yün boyama sanayisi için vazgeçilmez bir mal olarak büyük miktarlarda ihraç edilir. Brezilya ticaretinin ilk ürünüdür."
 por_atlantic_domination: "Atlantik Hâkimiyeti"
 por_atlantic_domination_desc: "Lizbon’dan Azorlar’a, Madeira’ya, Yeşil Burun’a ve Brezilya’ya: Portekiz tüm Atlantik’i denetler. İspanya’nın rekabetini yenerek Portekiz Atlantik ticaretinin kahramanı olarak hüküm sürer."
 por_empire_of_seas: "Denizlerin Efendisi"
 por_empire_of_seas_desc: "“Portekiz küçük bir ülkedir, ama dünyanın yarısına hükmeder”: bir tarihçinin sözleri gerçek oluyor. Atlantik’ten Hint Okyanusu’na, Brezilya’dan Malakka’ya Portekiz’in imparatorluğu dünyanın denizlerine hâkim. Estado da Índia tamam."
 por_events.10.t: "Ümit Burnu: Hindistan’a Giden Yol Açılıyor"
 por_events.10.d: "1488’de Bartolomeu Dias’ın filosu Afrika’nın en güneyindeki “Fırtınalar Burnu”nu döndü ve Hint Okyanusu’na ulaştı. II. João bu haberle titredi: 15 yıl sonra Vasco da Gama Hindistan’a doğrudan yolu açacaktı. Arap tüccarların baharat ticaretini tekelleştirdiği çağ sona ermek üzere."
 por_events.10.a: "Tanrı’ya ve Portekiz’e şeref! Hindistan’a giden yol açık!"
 por_events.20.t: "Vasco da Gama Hindistan’a Ulaşıyor"
 por_events.20.d: "20 Mayıs 1498: Lizbon’dan dört gemiyle ayrıldıktan 10 ay sonra Vasco da Gama Kalküt’e ayak bastı. Yerel hükümdar (Zamorin) şüpheciydi, ama Portekiz baharat ticaretine girişi güvence altına aldı. Arap tüccarlar öfkeyle köpürürken Portekiz’in Doğu ticareti çağı başladı."
 por_events.20.a: "Karabiber ve baharatlar: Portekiz Hindistan’ın servetini ele geçirdi!"
 por_events.30.t: "Malakka’nın Fethi: Baharat Ticaretinin Boğazını Ele Geçirmek"
 por_events.30.d: "Temmuz 1511’de Afonso de Albuquerque 1.200 Portekiz kuvvetiyle Malakka’yı fethetti. “Doğunun en önemli yeri”: Malakka’yı denetlemek Çin’in, Hindistan’ın ve Baharat Adaları’nın tüm ticaret yollarını ele geçirir. Albuquerque Malakka’yı Goa ve Hürmüz ile birlikte Portekiz İmparatorluğu’nun üç sütunundan biri olarak konumlandırdı."
 por_events.30.a: "Malakka bizim! Doğu ticareti Portekiz’in tekelidir!"
 por_events.40.t: "Cabral’ın Brezilya’yı Keşfi"
 por_events.40.d: "22 Nisan 1500: 13 gemilik bir filoyla Hindistan’a giden Pedro Álvares Cabral bir fırtınadan kaçınmak için çok batıya sapıp bilinmeyen bir toprak keşfetti. “Ilha de Vera Cruz”: sonradan “Brezilya” denen Güney Amerika kıtasının bir parçası. Tordesillas Antlaşması uyarınca bu Portekiz toprağı olur ve bu toprak sonradan Portekiz’in en büyük kolonisi olacak."
 por_events.40.a: "Tanrı’nın rehberliğiyle bir keşif! Brezilya Portekiz’e aittir!"
 por_events.99.t: "Denizlerin Efendisi: Portekiz’in İmparatorluğu Tamam"
 por_events.99.d: "Lizbon’dan Goa’ya, Malakka’dan Brezilya’ya Portekiz’in imparatorluğu dünyanın denizlerine hükmediyor. Prens Henrique’nin hayal ettiği “Deniz İpek Yolu” gerçek oldu ve baharatlar, altın, şeker ve fildişi Lizbon’da buluşuyor. Portekiz 92.000 kilometrekarelik küçük bir ulustan dünyanın ilk “küresel deniz imparatorluğuna” dönüştü."
 por_events.99.a: "Portekiz ilelebet! Denizlerin Efendisi olarak hüküm sür!"
