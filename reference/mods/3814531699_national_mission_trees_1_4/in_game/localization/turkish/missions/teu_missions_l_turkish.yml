 STATIC_MODIFIER_DESC_teu_danzig_mod: "“Baltık’ın Kraliçesi” Danzig Tarikat’ın deniz ticaretinin merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_teu_duchy_mod: "Prusya Dukalığı’nın Kuruluşu"
 STATIC_MODIFIER_DESC_teu_duchy_mod: "Laikleşmiş Prusya Dukalığı modern bir idari devlet olarak örgütlendi."
 STATIC_MODIFIER_NAME_teu_east_crusade_mod: "Doğu’ya Haçlı Seferi"
 STATIC_MODIFIER_DESC_teu_east_crusade_mod: "Pagan topraklara yapılan her seferde şövalye kardeşler kara haçı beyaz pelerinlerine diker ve kutsal savaş yeminlerini yeniler."
 STATIC_MODIFIER_NAME_teu_hanseatic_mod: "Hansa Birliği ile Bağlar"
 STATIC_MODIFIER_DESC_teu_hanseatic_mod: "Hansa kogları Danzig ve Thorn limanlarında kehribar ve tahıl arayarak durmaksızın demir atıyor."
 STATIC_MODIFIER_NAME_teu_hre_mod: "KRİ İçinde Yükseliş"
 STATIC_MODIFIER_DESC_teu_hre_mod: "Prusya Kutsal Roma İmparatorluğu içinde merkezi bir güç olarak yükseldi."
 STATIC_MODIFIER_NAME_teu_konigsberg_mod: "Königsberg’in Refahı"
 STATIC_MODIFIER_DESC_teu_konigsberg_mod: "Prusya’nın kalbi Königsberg ticaret ve ilim şehri olarak çiçek açıyor."
 STATIC_MODIFIER_NAME_teu_law_mod: "Töton Hukuk Kanunnamesi"
 STATIC_MODIFIER_DESC_teu_law_mod: "Kulm hukuku üzerine kurulu Tarikat kanunnamesi kasabayı ve kırsalı aynı ölçüyle yargılamakla ün kazandı."
 STATIC_MODIFIER_NAME_teu_legacy_mod: "Töton Tarikatı’nın Mirası"
 STATIC_MODIFIER_DESC_teu_legacy_mod: "Marienburg’un büyük salonundaki Büyük Üstatların portreleri Tarikat’ın geleneğini yeni kazanılmış topraklarının her köşesine taşıyor."
 STATIC_MODIFIER_NAME_teu_lithuania_mod: "Litvanya’ya Boyun Eğdirme"
 STATIC_MODIFIER_DESC_teu_lithuania_mod: "Samogitya ormanlarında yükseltilen bir kale hattı Litvanya Büyük Dükü’nün ordularına karşı bir bariyer olarak duruyor."
 STATIC_MODIFIER_NAME_teu_livonia_mod: "Livonya Hâkimiyeti"
 STATIC_MODIFIER_DESC_teu_livonia_mod: "Livonya Tarikatı ile ittifak doğu Baltık kıyısının denetimini güvenceye aldı."
 STATIC_MODIFIER_NAME_teu_malbork_mod: "Malbork’un Tahkimi"
 STATIC_MODIFIER_DESC_teu_malbork_mod: "Malbork Tarikat’ın savunmasının temel taşı olan aşılmaz bir kaleye tahkim edildi."
 STATIC_MODIFIER_NAME_teu_memel_mod: "Memel’in Tahkimi"
 STATIC_MODIFIER_DESC_teu_memel_mod: "Memel tahkim edilmiş bir liman şehrine dönüştürüldü ve Litvanya’ya karşı sınırı güvenceye alıyor."
 STATIC_MODIFIER_NAME_teu_orthodox_march_mod: "Ortodoksluğa Yürüyüş"
 STATIC_MODIFIER_DESC_teu_orthodox_march_mod: "Ortodoks prenslerle birçok savaştan sonra Tarikat’ın askerleri doğu sınır savaşının yollarını iyi biliyor."
 STATIC_MODIFIER_NAME_teu_poland_mod: "Polonya’ya Boyun Eğdirme"
 STATIC_MODIFIER_DESC_teu_poland_mod: "Grunwald yenilgisinde kaybedilen gurur intikam zaferiyle nihayet geri kazanıldı."
 STATIC_MODIFIER_NAME_teu_pomerania_mod: "Pomeranya’nın Denetimi"
 STATIC_MODIFIER_DESC_teu_pomerania_mod: "Pomeranya limanları elde olduğundan Baltık kıyısındaki hiçbir kasaba Tarikat’ın sancağına saygı göstermeden duramaz."
 STATIC_MODIFIER_NAME_teu_protestant_mod: "Protestan Reformu"
 STATIC_MODIFIER_DESC_teu_protestant_mod: "Luther’in öğretisini kucaklayan Prusya’da bilginler Königsberg kolejlerinde uzaktan ve yakından toplanıyor."
 STATIC_MODIFIER_NAME_teu_prussia_mod: "Prusya Fethi Tarikatı"
 STATIC_MODIFIER_DESC_teu_prussia_mod: "Prusya’nın tamamen boyun eğdirilmesi isyan tohumlarını söndürdü."
 STATIC_MODIFIER_NAME_teu_prussian_kingdom_mod: "Prusya Krallığı"
 STATIC_MODIFIER_DESC_teu_prussian_kingdom_mod: "Modern Prusya Krallığı kuzey Almanya’nın efendisi olarak kuruldu."
 STATIC_MODIFIER_NAME_teu_constantinople_reclaimed_mod: "İstanbul’un Geri Alınışı"
 STATIC_MODIFIER_DESC_teu_constantinople_reclaimed_mod: "Haç İstanbul’un büyük kilisesinin üzerinde bir kez daha yükseltildi ve ışığı tüm Doğu’ya ulaşıyor."
 STATIC_MODIFIER_NAME_teu_jerusalem_ruler_mod: "Kudüs’ü Geri Alan"
 STATIC_MODIFIER_DESC_teu_jerusalem_ruler_mod: "Kutsal Kabir’in önünde diz çöken Büyük Üstat halk tarafından yaşayan bir aziz olarak saygı görüyor ve adı orduları yöneten bir sancak oldu."
 STATIC_MODIFIER_NAME_teu_riga_mod: "Riga, Haçlı Kalesi"
 STATIC_MODIFIER_DESC_teu_riga_mod: "Riga doğu Baltık kıyısının ticari, askerî ve haçlı merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_teu_secular_start_mod: "Laikleşmenin İlk Adımı"
 STATIC_MODIFIER_DESC_teu_secular_start_mod: "Büyük Üstat dük tacını kuşandığı günden beri modern devletin yeni havası Prusya meclislerinde kıpırdadı."
 STATIC_MODIFIER_NAME_teu_torun_mod: "Toruń’un Refahı"
 STATIC_MODIFIER_DESC_teu_torun_mod: "Kopernik’in doğum yeri Toruń Vistula nehir ticaretinin merkezi olarak çiçek açıyor."
 teu_mazovia_subjugation: "Mazovya’ya Boyun Eğdirme"
 teu_mazovia_subjugation_desc: "Orta Vistula boyunca yayılan Polonya ana toprağı Mazovya. Sonradan Varşova’nın inşa edileceği bu toprak Polonya’nın doğuya açılan kapısı ve Prusya’ya giden başlıca istila yoludur. Mazovya Dukalığı, yöneten hat soyu tükendiğinde 1526’da Polonya Krallığı’na özümsenene kadar Polonya Piast hanedanının bir yan koluyla yönetildi. Bu toprağı denetlemek güneyden gelen tehdidi ortadan kaldırır ve Prusya’nın güvenliğini sağlar. Vistula havzasının zengin tarım arazisini Töton Tarikatı’nın tahıl ambarı yap."
 teu_narva_fortress: "Narva Kalesi"
 teu_narva_fortress_desc: "Estonya’nın kuzey kıyısındaki Narva nehri üzerindeki bu kale kasabası Livonya ile Rusya arasındaki stratejik sınırı işaretler. Nehrin karşısında Rusya’nın Ivangorod kalesi durur: gerçek bir medeniyet çarpışma noktası. 1346’da Danimarka tarafından Estonya’nın kuzey ucuyla birlikte Töton Tarikatı’na satılan Narva, doğu haçlı seferi için bir ileri üs olarak hizmet eder. 1558’de Korkunç İvan’ın kuvvetlerine kısa süreliğine düşmesi mukadderdir, ama bu kaderi burada ve şimdi değiştir. Narva’yı aşılmaz bir kaleye tahkim et ve Ortodoks Rusya üzerindeki baskıyı sürdür."
 teu_berlin_dev: "Berlin’in Gelişimi"
 teu_berlin_dev_desc: "Spree ve Havel nehirlerinin birleştiği yerdeki bu küçük kasaba Berlin, 13. yüzyılda Brandenburg Markgrafı tarafından ikiz kasabalar (Berlin ve Cölln) olarak kuruldu. Şimdilik yalnızca Brandenburg Hohenzollern Seçici Prensleri’nin küçük bir makamıdır, ama Prusya Brandenburg ile birleştiğinde bu yer bir imparatorluk başkenti olmaya mukadderdir. 1618’de Brandenburg-Prusya şahsi birliğiyle ve 1701’de Prusya Krallığı’nın kuruluşuyla Berlin kuzey Almanya’nın kalbi oldu. Bu temeli şimdi at: Berlin’in gelişimi kuzey Almanya’nın birleşmesini simgeleyen şehri doğuracak."
 teu_junker_system: "Junker Sisteminin Kuruluşu"
 teu_junker_system_desc: "Junker: Almanca “genç lord”; bu terim Prusya’nın militarize edilmiş toprak soylularını ifade eder. Elbe’nin doğusunda geniş mülklere (Gutsherrschaft) sahip olan Junkerler, Baltık yoluyla Batı Avrupa’ya ihraç etmek için tahıl üretmede serf emeği kullandı. Ama gerçek rolleri askerîydi: Junkerler Prusya ordusundaki subay görevlerinin çoğunluğunu doldurarak “askerî bir devlet olarak Prusya”nın çekirdeğini oluşturdu. I. Friedrich Wilhelm (“Asker Kral”) Junkerleri askerî akademilere zorla gönderdi ve askerî yükümlülüklerini kurumsallaştırdı. Junker sistemini şimdi kur ve nesiller boyu sürecek “Prusya askerî kültürü”nün temelini at."
 teu_silesia_claim: "Silezya’nın Denetimi"
 teu_silesia_claim_desc: "Yukarı Oder boyunca yayılan Silezya, kömür, demir cevheri ve çinkoyla zengin olarak Orta Avrupa’nın en büyük sanayi bölgesi olma potansiyeline sahiptir. Bir zamanlar Polonya Piast egemenlik alanlarının parçası olan bölge 1335’ten sonra Bohemya Krallığı’na geçti ve 1526’da Habsburglar’ın Bohemya mirasıyla Avusturya’nın parçası oldu. Ama 1740’ta Büyük Friedrich Avusturya Veraset Savaşı’nın hemen başında Silezya’ya bir yıldırım istilası başlattı ve bu zengin toprağı “kuvvetle” ele geçirdi. Silezya’yı şimdi Prusya için al: sanayi gücü Prusya imparatorluğunun ekonomik temeli olacak."
 teu_cathedral_network: "Katedral Ağı"
 teu_cathedral_network_desc: "Tüm Prusya genelinde bir katedral ağı: Töton Tarikatı fethedilen topraklarda daima kiliseler inşa etti. Königsberg Katedrali, Marienburg’un şato şapeli, Toruń’daki Aziz Yuhanna Kilisesi: hepsi Katolik inancı pagan toprağa dikmenin araçlarıydı. Cemaat sistemini örgütlemek, piskoposluklar kurmak, manastırlar inşa etmek: bunlar “barbar toprakların” Hıristiyan medeniyetine çekildiği kurumsal araçlardır. Bir katedral hem Tanrı’ya hizmet eylemi hem sömürge yönetiminin simgesidir. Prusya genelinde bir katedral ağı kur ve Töton Tarikatı’nın dinî otoritesini ve yönetim meşruiyetini güçlendir."
 teu_elbing_dev: "Elbing’in Gelişimi"
 teu_elbing_dev_desc: "1237’de Vistula deltasının doğu ucunda kurulan Elbing (Elbląg), Danzig ile birlikte Prusya’nın en önemli limanlarından biri ve Hansa Birliği’nin önemli bir üyesidir. İç su yollarıyla Königsberg’e bağlı olarak tahıl, kereste ve kehribar için bir ihracat limanı olarak çiçek açtı. Danzig gibi İkinci Thorn Barışı’ndan (1466) sonra Polonya denetimine girdi, ama Prusya için Vistula deltasının tam denetimi denize bir çıkış olarak vazgeçilmezdir. Elbing’i geliştir ve Danzig’in yanında büyük Baltık limanlarından oluşan ikili bir sistem kur."
 STATIC_MODIFIER_NAME_teu_mazovia_mod: "Mazovya’ya Boyun Eğdirildi"
 STATIC_MODIFIER_DESC_teu_mazovia_mod: "Mazovya’ya boyun eğdirildi ve güney sınırı güvenceye alındı."
 STATIC_MODIFIER_NAME_teu_narva_mod: "Narva Kalesi"
 STATIC_MODIFIER_DESC_teu_narva_mod: "Narva doğuda aşılmaz bir kaleye tahkim edildi."
 STATIC_MODIFIER_NAME_teu_berlin_mod: "Berlin’in Gelişimi"
 STATIC_MODIFIER_DESC_teu_berlin_mod: "Berlin Prusya’nın başkenti olarak geliştirildi."
 STATIC_MODIFIER_NAME_teu_junker_mod: "Junker Sistemi"
 STATIC_MODIFIER_DESC_teu_junker_mod: "Elbe’nin doğusundaki mülklerine kök salmış Junkerler krallığı hem subay hem memur olarak ayakta tutuyor."
 STATIC_MODIFIER_NAME_teu_silesia_mod: "Silezya Fethedildi"
 STATIC_MODIFIER_DESC_teu_silesia_mod: "Silezya’nın tezgâhları ve madenleri Prusya’nın maliyesine yeni bir nabız veriyor."
 STATIC_MODIFIER_NAME_teu_cathedral_mod: "Katedral Ağı"
 STATIC_MODIFIER_DESC_teu_cathedral_mod: "Prusya genelinde katedraller inşa edildi ve Katolik inanç kök saldı."
 STATIC_MODIFIER_NAME_teu_elbing_mod: "Elbing Limanı’nın Refahı"
 STATIC_MODIFIER_DESC_teu_elbing_mod: "Elbing büyük bir Baltık liman şehri olarak geliştirildi."
 teu_mongol_empire: "Moğol Kalesi Düştü"
 teu_mongol_empire_desc: "Sarai, Kazan, Semerkant, Kefe, Dadu, Karakurum: bir zamanlar dünyayı sarsan Moğol İmparatorluğu’nun büyük başkentleri birer birer kara haç sancağı altında düştü. 1206’da Cengiz Han’ın kurduğu “Büyük Moğol Ulusu” 13. yüzyılın sonunda parçalandı ve eski şanı çoktan geçti. Egemenlik alanının kalıntılarına Töton Tarikatı’nın demir orduları doğudan ve batıdan yürüyor ve bozkırın efendilerine boyun eğdiriyor. Doğudaki Pasifik’ten batıdaki Baltık’a: tüm Moğol mirası haç imparatorluğu tarafından ele geçirildi."
 teu_sacred_nomads: "Büyük Han’ın Tahtı Gasp Edildi"
 teu_sacred_nomads_desc: "Moğol İmparatorluğu’nun tamamı fethedildiğinde Büyük Üstat bozkır halklarının her şeyden çok korktuğu unvanı, “Han”ı, savaş ganimeti olarak kendine talep eder. Bu ne kaynaşma ne bir arada yaşamadır; salt fatihin kaybedenin tahtına oturmasıdır. Haç taşıyan ağır süvari bir zamanlar yeryüzünün en korkulan ordusunun efendisi olmuştur. Doğu ve Batı imparatorluklarını Tanrı’nın iradesiyle birleştir: bu Töton Tarikatı’nın nihai zaferidir."
 teu_events.70.t: "Moğol Başkentleri Bizim"
 teu_events.70.d: "Sarai, Kazan, Semerkant, Kefe, Dadu, Karakurum: Moğol İmparatorluğu’nun her başkenti düştü. Bu günden itibaren Büyük Üstat kendini “Alman Büyük Hanı” olarak adlandırır, ama Moğol kanının veya kültürünün varisi olarak değil. Kendi otoritesinin bir işareti olarak kaybedenin unvanını ele geçiren bir fatihten başka bir şey değildir. Pax Deus, yani Tanrı’nın barışı, bir zamanlar bozkırın egemenliği olanın yerini şimdi alır."
 teu_events.70.a: "Moğol egemenlik alanları nihayet bizim!"
 teu_events.80.t: "Demir Haç Dünyaya Hükmediyor"
 teu_events.80.d: "Moğol İmparatorluğu’nun fethinin son perdesi olarak Töton Tarikatı hem doğu hem batı imparatorluklarını tamamen kendi yönetimi altına aldı. Bozkır halkları teslim oluyor ve haçın otoritesi altında yeni bir düzen dayatılıyor. Bu kaynaşma değil, fethin saf tamamlanması: Tarikat Tarikat olarak kalıyor ve yeryüzünün en büyük imparatorluğunun efendisi oldu."
 teu_events.80.a: "Tanrı’nın iradesiyle dünya bizim!"
 STATIC_MODIFIER_NAME_teu_mongol_empire_mod: "Moğolların Fethi"
 STATIC_MODIFIER_DESC_teu_mongol_empire_mod: "Moğol İmparatorluğu’nun savaş makinesi ele geçirildi: bozkırın atlıları artık Töton komutası altında hizmet ediyor."
 STATIC_MODIFIER_NAME_teu_sacred_nomads_mod: "Büyük Han’ın Tahtı"
 STATIC_MODIFIER_DESC_teu_sacred_nomads_mod: "Bir zamanlar dünya imparatorluğu olanın efendisi olarak hüküm sürmek: Moğollar Töton Tarikatı tarafından tamamen fethedildi."
 teu_great_khan_name: "Alman Büyük Hanlığı"
 teu_events.11.t: "Kuzey Haçlı Seferi Yemini"
 teu_events.11.d: "Doğu’ya açılan kapılar açık: Litvanya ve Polonya’ya boyun eğdirildiğine göre Töton Tarikatı’nın tarihî bir karar verme zamanı geldi. Her şövalye Büyük Üstat’ın otoritesi önünde yemin eder: “Tanrı’nın iradesiyle Doğu’nun paganlarını ve Ortodokslarını yok edecek ve Kuzey Haçlı Seferi’ni tamamlayacağız.” Bu yemin Töton Tarikatı devletinin yönetici ilkesi olur ve meşruiyeti ne kadar yüksekse disiplini ve düzeni de o kadar büyük olur."
 teu_events.11.a: "Yemin ederiz: Tanrı’nın iradesiyle Kuzey Haçlı Seferi’ni tamamlayacağız!"
 teu_steppe_crusade: "Bozkır Haçlı Seferi"
 teu_steppe_crusade_desc: "Pontus Bozkırı: bir zamanlar Moğol İmparatorluğu’nun kalbi, Tatarların yönettiği sonsuz bir çayır. Şimdi Töton Tarikatı’nın ağır süvarisi Moğol tarzı hafif atlılarla kaynaştığında bu bozkırı fethet ve tüm Doğu Avrupa üzerinde üstünlük kur. Bozkıra hükmeden Doğu Avrupa’ya hükmeder: bu gerçeği Töton Tarikatı’nın gücüyle kanıtla."
 STATIC_MODIFIER_NAME_teu_steppe_crusade_mod: "Bozkır Haçlı Seferi"
 STATIC_MODIFIER_DESC_teu_steppe_crusade_mod: "Bozkırın rüzgârları arasında at süren atlı şövalye kardeşler göçebelerin savaş yollarını bile kendilerine mal etti."
 STATIC_MODIFIER_NAME_teu_crusade_loot_mod: "Haçlı Yağması"
 STATIC_MODIFIER_DESC_teu_crusade_loot_mod: "Haçlı seferinin yağması toprağı tüketti: tarlalar nadasa bırakıldı, köyler boş duruyor ve halk daha iyi günleri bekliyor."
