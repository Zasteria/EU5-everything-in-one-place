l_turkish:
 teu_teutonic_mission_pack: "Töton Tarikatı: Kılıç ve Haç"
 teu_teutonic_mission_pack_DESCRIPTION:0 "Tanrı adına Baltık’ı fetheden Töton Tarikatı. Haçlı sancağını yükselt ve Kuzey Haçlı Seferi’ni tamamlamak için Doğu’nun paganlarını ve Ortodokslarını yok et ya da laikleş ve Prusya Krallığı olarak modern Almanya’nın temellerini at. Seçim zamanı geldi."
 teu_teutonic_mission_pack_CRITERIA_DESCRIPTION:0 "Haçlı yolunda Kuzey Haçlı Seferi’ni tamamla ya da laikleşme yolunda Prusya Krallığı’nı inşa et."
 teu_teutonic_mission_pack_BUTTON_TOOLTIP:0 "Baltık’ı ve Doğu Avrupa’yı kılıç ve haçla fethet."
 teu_teutonic_mission_pack_BUTTON_DETAILS:0 "“İsteyene her yardım, düşmana merhamet yok”: Baltık’a Büyük Üstat adına hükmet!"
 teu_crusaders_legacy: "Haçlı Tarikatı’nın Mirası"
 teu_crusaders_legacy_desc: "1190’da Üçüncü Haçlı Seferi sırasında Akka’da kurulan Töton Tarikatı Kutsal Topraklar’da bir hastane tarikatı olarak başladı. 1226’da II. Friedrich’in Rimini Altın Bulası Tarikat’a pagan Prusya’ya karşı sefer yapma hakkını verdi ve o zamandan beri güney Baltık kıyısını haçlı kılıcıyla fethetti. Başkenti Marienburg olan bu “manastırlı şövalye devleti” fetih ve kolonizasyon savaşlarını sürdüren Avrupa’nın son haçlı devleti olmayı sürdürür. Şimdi Gediminasoğulları Litvanya’sının ve Jagiellon Polonya’sının güçlü rakipleriyle çevrili Tarikat’ın gerçek değeri sınanacak."
 teu_secure_prussia: "Prusya’yı Güvenceye Al"
 teu_secure_prussia_desc: "Bir zamanlar Baltık Prusya halklarının yurdu olan Prusya, 1230’lardan başlayan Töton Tarikatı’nın elli yılı aşkın fetihleriyle kazanıldı. 1283 “Büyük İsyan”ın bastırılmasından sonra yerli nüfus fiilen yok edildi ve toprak Alman yerleşimcilerin bir kolonisi olarak yeniden inşa edildi. Yine de dağlarda ve ormanlarda direniş közleri hâlâ için için yanıyor. Prusya genelinde kale ağını tamamla ve Tarikat’ın hâkimiyetini sarsılmaz kıl: çünkü Prusya olmadan Töton Tarikatı olmaz."
 teu_christianize_prussia: "Prusya’yı Hıristiyanlaştır"
 teu_christianize_prussia_desc: "Töton Tarikatı’nın beyan ettiği varoluş nedeni “paganların din değiştirmesi”dir. Gerçekte fethedilen Prusyalıların çoğu zorla din değiştirdi ve direnenler katledildi. 1249 Christburg Antlaşması Prusyalı soylulara vaftiz karşılığında haklar tanıdı, ama sonraki isyanlar bu sözün çiğnenmesine yol açtı. Şimdi gerçek bir Katolikleştirmeyi sürdür ve Tarikat’ın dinî meşruiyetini kurmak için bir kilise ağı inşa et: ancak Papa’nın desteğiyle bu devlet gerçekten meşru olabilir."
 teu_subdue_lithuania: "Litvanya’ya Boyun Eğdir"
 teu_subdue_lithuania_desc: "Gediminasoğulları hanedanı altında Baltık’tan Ukrayna’ya uzanan geniş bir pagan devlet olan Litvanya Büyük Dukalığı, hem Töton Tarikatı’nın en büyük tehdidi hem en büyük haçlı hedefiydi. 1260’taki Durbe Muharebesi’nde yenilgi, 1410’da Grunwald’da felaket: Litvanya Tarikat’ı defalarca yendi. Yine de Jogaila’nın 1387’de Katolikliğe geçişiyle Litvanya nominal olarak artık bir “pagan devlet” değildi ve bu haçlı seferinin gerekçesini bulandırdı. Öyle olsa da yalnızca Litvanya’ya karşı üstünlük mücadelesini kazanarak Tarikat Baltık’a gerçekten hükmedebilir."
 teu_subdue_poland: "Polonya’ya Boyun Eğdir"
 teu_subdue_poland_desc: "15 Temmuz 1410, Tannenberg (Grunwald) Muharebesi: Töton Tarikatı tarihinin en büyük yenilgisi. Büyük Üstat Ulrich von Jungingen ve Tarikat şövalyeliğinin çiçeği düştü ve Marienburg’un kendisi kuşatıldı. 1466 İkinci Thorn Barışı Batı Prusya’yı Polonya’ya devrederek Tarikat’ı bir vasaldan biraz fazlasına indirdi. Bu aşağılanmanın öcünü al: Polonya’yı yen, kayıp toprakları geri al ve Tannenberg’in utancını yıka."
 teu_order_or_prussia: "Seçim: Haçlı Seferi mi Laikleşme mi"
 teu_order_or_prussia_desc: "1511’de Hohenzollern’li Albert Büyük Üstat olduğunda Tarikat bir hayatta kalma kavşağında duruyordu. Luther’in 1517 Reformu Avrupa’yı sarsarken Albert bizzat Luther ile buluştu ve Tarikat’ı laikleştirmeyi seçti: 1525’te Prusya Dukalığı’nı kurdu. Ama ya Tarikat bunun yerine haçlı misyonunu sürdürseydi? Doğu’nun Ortodokslarına, paganlarına ve Müslümanlarına boyun eğdirerek “Kuzey Haçlı Seferi”ni tamamla ya da modern Prusya’nın temellerini laik bir prenslik olarak at: seçim senin."
 teu_crusade_path: "Kuzey Haçlı Seferi Yolu"
 teu_crusade_path_desc: "Haçlı seferinin yolu: Tanrı adına kılıcı kuşan. Töton Tarikatı’nın gerçek çağrısı paganların din değiştirmesi ve fethidir. Doğuda Rus’un Ortodoks toprakları bekliyor; Baltık kıyısında Livonya Tarikatı ile bir ittifak çağırıyor. Önceki Prusya fethinde olduğu gibi haçlı sancağını doğu Baltık kıyısından kuzey Rusya’ya kadar dik. IX. Gregorius’un verdiği haçlı affı ebediyen geçerli kalır: Kuzey Haçlı Seferi’ni Tanrı adına tamamla ve Büyük Üstat’ın adını tarihe kazı."
 teu_path_crusade_chosen_tt: "Haçlı yolu seçildi"
 teu_path_secular_chosen_tt: "Sekülerleşme yolu seçildi"
 teu_livonian_alliance: "Livonya Tarikatı ile İttifak"
 teu_livonian_alliance_desc: "Kılıç Kardeşleri’nin halefi, 1237’de Töton Tarikatı’na özümsenen Livonya Tarikatı. Riga merkezli bu tarikat doğu Baltık kıyısını denetler ama Litvanya’dan ve Rus’tan sürekli baskı altındadır. 1242’de Peipus Gölü Muharebesi’nde Aleksandr Nevski’ye yenildi ve 1260’ta Durbe’de Litvanya’dan yıkıcı bir darbe aldı. Şimdi Livonya Tarikatı ile bir ittifak kur ve doğu Baltık’a birlikte hükmetmek için ortak bir sistem inşa et: Doğu’nun düşmanlarını yenmek için kardeş tarikatın gücünden yararlan."
 teu_crusade_east: "Doğu’ya Haçlı Seferi"
 teu_crusade_east_desc: "Haçlı kılıcını doğuya çevir: Ortodoks “bölücüler”, Romuva “paganları”, Müslüman “kâfirler”. Bunların hepsi Katolik inancın düşmanları ve haçlı seferinin hedefleridir. 1230’lardan beri Töton Tarikatı Baltların toprakları boyunca “Kuzey Haçlı Seferi”ni yürüttü. Şimdi ufku daha da doğuya genişlet ve Doğu Ortodoksluğunun kalbine ve Baltların son kalelerine karşı kutsal savaş yürüt. Litvanya’nın 1386’da Katolikliğe geçişi “meşru” haçlı hedeflerinin sayısını azalttı, ama Rusya’nın Ortodoks devletleri hâlâ duruyor."
 teu_riga_crusade: "Riga, Haçlı Kalesi"
 teu_riga_crusade_desc: "1201’de Piskopos Albert von Buxhoeveden tarafından kurulan Riga, doğu Baltık kıyısındaki en önemli kaledir. Livonya Tarikatı ile Riga Başpiskoposu arasında uzun bir iktidar mücadelesi sürdü, ama Töton Tarikatı şehri birleştirip doğu haçlı seferi için bir ileri üs olarak geliştirebilirse, Rus’la yüzleşmek için bir tutunak olur. Daugava’nın ağzında oturan Riga hem ticaret hem savaş için hayati önemde: onu güvenceye almak doğuya ilerleyiş için bir ikmal hattı kurar."
 teu_march_to_orthodox: "Ortodoksluğa Yürüyüş"
 teu_march_to_orthodox_desc: "“Sapkın” Ortodoks Kilisesi: Roma Katoliği gözünde Bizans ve Rus kiliseleri 1054 Büyük Ayrılığı’ndan beri “yanlış inancı” taşıdı. Novgorod Cumhuriyeti, Pskov, Rus prenslikleri: bu Ortodoks devletler Kuzey Haçlı Seferi’nin gerçek hedefidir. 1242’de Aleksandr Nevski Livonya Tarikatı’nı Peipus Gölü’nün buzu üzerinde yendi ve bugün hâlâ “haçlıları yenen kahraman” olarak kutlanıyor. O yenilginin öcünü al ve Katolik sancağı Ortodoks toprağına dik: bu Töton Tarikatı’nın nihai misyonudur."
 teu_northern_crusade_final: "Kuzey Haçlı Seferi Tamamlandı"
 teu_northern_crusade_final_desc: "Prusya’nın fethiyle başlayan ve doğu Baltık kıyısı boyunca Rus’un derinliklerine uzanan Kuzey Haçlı Seferi nihayet tamamlanmaya yaklaşıyor. Daha önceki Prusyalılar gibi Ortodokslar da din değiştirmeli ya da fethedilmeli. Baltık Töton Tarikatı’nın iç denizi olur ve Büyük Üstat’ın sancağı dünyanın doğu ucuna kadar dalgalanır. 13. yüzyıl Kılıç Kardeşleri’nden devralınan “Kuzey Haçlı Seferi” hayali, yani Baltların, Slavların ve Finlerin topraklarını kutsal bir imparatorlukta birleştirmek, artık gerçekleşiyor."
 teu_secularize_path: "Laikleşme Yolu"
 teu_secularize_path_desc: "10 Nisan 1525’te Krakov’da Hohenzollern’li Albert Prusya Dukalığı’nın Polonya Kralı I. Sigismund’un bir vasalı olarak kuruluşunu ilan etti: Töton Tarikatı’nın laikleşmesi. Lutherciliğe geçiş karşılığında Tarikat’ın toprakları laik bir dukalık olarak varlığını sürdürecekti. Katolik devletler bu “ihanete” öfkelendi, ama yükselen Protestanlık dalgası Tarikat’a ileriye yeni bir yol verdi. Reform dalgasına bin ve laik bir prens olarak modern Prusya’nın temellerini at: bu Tarikat’ın yeni bir çağdaki yeni yaşam biçimidir."
 teu_prussian_duchy: "Prusya Dukalığı"
 teu_prussian_duchy_desc: "1525’te laikleşmeden doğan Prusya Dukalığı Hohenzollern yönetiminde hızla gelişti. Başkenti Königsberg olarak Lutherci Reform’u aktif biçimde destekledi ve Königsberg Üniversitesi (1544’te kuruldu) aracılığıyla kendini “ilmin Prusya’sı” olarak nitelendirdi. Eski bir haçlı devleti şimdi modern bir dukalığa dönüşüyor. İdareyi kur, soylu Junkerler ile iş birliği oluştur ve askerî devletin temellerini at: gelecekteki Prusya Krallığı’na ve sonra Alman İmparatorluğu’na giden ilk adım."
 teu_control_pomerania: "Pomeranya’yı Denetle"
 teu_control_pomerania_desc: "Vistula’nın batısında güney Baltık kıyısı boyunca uzanan Pomeranya, Alman prenslerinin, Danimarka’nın ve Polonya’nın uzun süredir çekiştiği bir bölgedir. Grifon hanedanının Pomeranya Dukalığı Prusya ile Brandenburg arasında sıkışmış küçük bir devlettir, ama Baltık’a erişimi onu stratejik açıdan hayati yapar. Pomeranya’yı ele geçirerek Prusya Baltık’ın gerçek efendisi olur. Stettin (Szczecin) limanını ve Oder’in su yollarını denetle ve Brandenburg ile Pomeranya’yı bağlayan “kuzey Alman eksenini” kur."
 teu_protestant_reformation: "Protestan Reformu"
 teu_protestant_reformation_desc: "1517’de Martin Luther Doksan Beş Tezi’ni Wittenberg kilise kapısına çiviledi ve Reform dalgası doğrudan Prusya’yı vurdu. Büyük Üstat Albert bizzat Luther ile buluştu ve Tarikat’ı laikleştirmeyi seçti. Prusya’nın Lutherciliği kucaklaması Katolik Habsburglara karşı bir “Protestan birliği”nin temeli oldu. Reform’u aktif biçimde ilerlet, eğitimi ve idareyi modernleştir: Königsberg Üniversitesi’nin akademik geleneği ve Prusya’nın disiplinli bürokrasisi nesiller boyu Prusya kültürünün temel taşı olacak."
 teu_dominate_hre: "Kutsal Roma İmparatorluğu İçinde Yüksel"
 teu_dominate_hre_desc: "“Ne kutsal, ne Roma, ne de imparatorluk” diye alay edilen Kutsal Roma İmparatorluğu karmaşık bir siyasi düzendir. Prusya bunun içinde nasıl yol bulacak? Habsburg imparatorlarının gücü, seçici prenslerin rekabetleri, Reform’un yarattığı çatlaklar: bunların hepsi Prusya’nın yükselişi için fırsatlar yaratır. Hohenzollern mirasıyla 1618’de Brandenburg ve Prusya’nın birleşmesi sonraki birleşik Almanya’nın temeli olacak. Seçici prens statünü kur, İmparatorluk içindeki nüfuzunu genişlet ve Prusya’yı Habsburglara rakip ve kuzey Almanya’nın lideri olarak yükselt."
 teu_north_german_empire: "Kuzey Alman Konfederasyonu"
 teu_north_german_empire_desc: "Kuzey Alman İmparatorluğu: Bismarck’ın hayali, Hohenzollern Hanedanı’nın emeli. 18. yüzyılda Büyük Friedrich Yedi Yıl Savaşları’nda Avusturya’ya karşı Prusya’nın gücünü kanıtladı; 19. yüzyılda Bismarck Almanya’yı “kan ve demirle” birleştirdi. Ama bundan çok önce Töton Tarikatı’nın halef devleti olarak Prusya’nın tüm kuzey Almanya’yı birleştirme hayalinin zaten uzun bir tarihi vardı. Brandenburg, Pomeranya, Mecklenburg, Hannover: kuzey Almanya’nın prenslerini topla ve modern Alman devletinin öncüsü olacak Kuzey Alman Konfederasyonu’nu burada ve şimdi gerçekleştir."
 teu_malbork_citadel: "Malbork Kalesi’ni Güçlendir"
 teu_malbork_citadel_desc: "Malbork Kalesi (Marienburg): Vistula deltasındaki bu geniş tuğla kale Töton Tarikatı’nın karargâhıdır. 1309’da Venedik’ten taşınan kale Avrupa’nın en büyük ortaçağ tuğla kalesi olarak durur. 1410’daki Grunwald yenilgisinden sonra Polonya kuvvetlerince kuşatıldı ama vekil Büyük Üstat Heinrich von Plauen’in komutası altında dayandı. Malbork’un surları Tarikat devletinin tam simgesidir: onu aşılmaz bir kaleye tahkim etmek her savunma stratejisinin temelidir."
 teu_konigsberg_dev: "Königsberg’i Geliştir"
 teu_konigsberg_dev_desc: "Königsberg (günümüz Kaliningrad): 1255’te Bohemya Kralı II. Otakar’ın desteğiyle kurulan bu şehir Prusya kolonisinin merkezi olarak büyüdü. 1544’te burada bir üniversite kuruldu ve sonradan filozof Immanuel Kant’ın yuvası oldu. Pregel’in ağzında oturan bu şehir hayati bir Baltık ticaret merkezidir ve Tarikat devletinin fiilî başkenti olarak hizmet etti. Kentsel altyapısını geliştir, katedralini ve pazarlarını genişlet ve onu kuzey ve Doğu Avrupa ticaretinin bir aktarma noktası olarak çiçek açtır: Prusya’nın kalbini güçlendirmek ulusal gücün kaynağıdır."
 teu_danzig_port: "Danzig Limanı’nı Geliştir"
 teu_danzig_port_desc: "Vistula’nın ağzında oturan Danzig (Gdańsk), Baltık’ın en büyük liman şehridir. 1308’de Töton Tarikatı Danzig’i Polonyalı müttefiklerinden “ele geçirdi” ve o zamandan beri onu Baltık ticaretinin merkezi olarak çiçek açtırdı. Ama 1466 İkinci Thorn Barışı şehri “Kraliyet Prusya”sının kalbi olarak değer veren Polonya’ya devretti. Danzig’i geri al, onu Hansa ticaret ağına bütünleştir ve Baltık tahıl ticaretinin kârlarını azamiye çıkar: “Baltık’ın Kraliçesi” denen bu şehir Tarikat’ın mali can damarıdır."
 teu_teutonic_law: "Töton Hukuk Kanunnamesi"
 teu_teutonic_law_desc: "1230’lardaki Kulm hukuku (Kulmer Handfeste): Töton Tarikatı’nın sömürge kasabalarına verdiği ilk hukuk kanunnamesi. Bunun üzerine inşa edilen Prusya hukuk sistemi gelişti ve Alman doğu kolonizasyonunun hukuki temeli oldu. 1489 başpiskoposluk fermanı, 1529 Prusya hukuk kanunnamesi: hukuki gelişme Tarikat devletinin “barbar fatih”ten “medeniyet taşıyıcısı”na dönüşme aracıdır. İdareyi sadeleştir, köylü haklarını koru ve ticaret hukukunu geliştir: Prusya’yı hukukla yönetilen bir devlet olarak kur."
 teu_amber_trade: "Kehribar Ticaretini Ele Geçir"
 teu_amber_trade_desc: "Baltık’ın altını kehribar. Antik çağdan beri “Kuzey’in altını” denen bu mücevher yalnızca Baltık kıyısı boyunca bulunur ve bir zamanlar Akdeniz dünyasına kadar taşınırdı. Prusya’yı fethettikten sonra Töton Tarikatı kehribar üzerinde tekel iddia etti ve kaçakçıları ölümle cezalandırdı. Bu “kehribar tekeli” Tarikat’ın en hayati gelir kaynaklarından biridir. Baltık’ın kehribar üreten bölgelerinin tam denetimini al ve Orta Avrupa’ya giden ticaret yollarına hâkim ol: çünkü kılıcın yanında kehribar zenginliği Tarikat’ın gücünün bir başka kaynağıdır."
 teu_hanseatic_ties: "Hansa Birliği ile Bağlar"
 teu_hanseatic_ties_desc: "Lübeck önderliğindeki Alman ticaret şehirlerinin bu birliği Hansa Birliği, Baltık ve Kuzey Denizleri boyunca ticarete hâkimdir. Danzig, Riga, Reval (Tallinn): bunların hepsi büyük Hansa merkezleridir ve toprakları Töton Tarikatı’nın kendi egemenlik alanıyla kesişir. Hansa tüccarları Prusya tahılını, kerestesini ve kehribarını Batı Avrupa’ya taşıdı ve karşılığında kumaş, şarap ve tuz getirdi. Hansa Birliği ile yakın bağlar kur ve Baltık ticaret ağının fiilî efendisi ol: Tarikat’ın refahını hem kılıç hem ticaretle güvenceye al."
 teu_colonize_prussia: "Prusya’yı Kolonileştir"
 teu_colonize_prussia_desc: "Ostsiedlung: Almanların 11. yüzyıldan 14. yüzyıla Elbe’nin doğusuna yerleştiği büyük tarihî göç. Töton Tarikatı bu hareketin ön saflarında durdu ve Alman çiftçileri, zanaatkârları ve tüccarları fethedilen Prusya’ya çekti. Yerli Prusya halklarının yok olmasına karşılık bu toprak “Alman doğu sınırı” olarak kolonileştirildi. Planlı şehir inşası, tarımsal gelişme, yol yapımı: bunlar bir “barbar toprağın” Avrupa medeniyet alanına çekilme araçlarıdır. Prusya’nın kolonizasyonunu tamamla ve onu sağlam biçimde Alman toprağı olarak kur."
 teu_torun_city: "Toruń’u Geliştir"
 teu_torun_city_desc: "Vistula boyunca inşa edilen Toruń, 1231’de kurulan Töton Tarikatı’nın ilk kalesiydi. 1454 ve 1466 “Thorn Antlaşmaları” Polonya ile ilişkisini tanımladı: birincisi barış getirdi, ikincisi Tarikat’ın aşağılayıcı toprak devrini. 1473’te Kopernik burada doğdu: güneş merkezli teoriyi öneren astronom. Tarikat tarihinin doğum yeri Toruń’u geliştir ve Vistula nehir ticaretinin merkezi olarak yeniden inşa et."
 teu_memel_fortress: "Memel’i Tahkim Et"
 teu_memel_fortress_desc: "Litvanya-Prusya sınırında Neman’ın ağzındaki Memel (Klaipėda), Töton Tarikatı tarafından Litvanya’ya karşı savunmanın ön hattı olarak inşa edilen bir kale kasabasıdır. 1252’de kurulan Memel Kalesi Litvanya ile sayısız muharebeye dayandı. Bu kale düşerse Prusya’ya giden kapılar açık kalır; tersine Memel’i sağlam tutmak Litvanya akınını durdurmanın anahtarıdır. Baltık’a açılan bu kapıyı tahkim et ve kehribar ticareti için bir iç merkez olarak hizmet etmesine izin ver."
 teu_grand_master: "Büyük Üstat’ın Hegemonyası"
 teu_grand_master_desc: "Büyük Üstat (Hochmeister), Töton Tarikatı’nın en yüce lideridir. Mesih’in vekili olarak Baltık’tan tüm Doğu Avrupa’ya uzanan bir haçlı imparatorluğunu yöneten şövalye keşişlere önderlik eder. Hermann von Salza (1209-1239) II. Friedrich ile diplomasi yoluyla Tarikat’ın siyasi temellerini attı ve Winrich von Kniprode’nin (1351-1382) saltanatı Tarikat’ın altın çağını işaretledi. Şimdi her düşman fethedildi ve Kuzey Haçlı Seferi tamamlandı: Büyük Üstat’ın otoritesi Baltık’tan Ortodoksların topraklarına uzanıyor. Adı tarihe kazınacak bir Büyük Üstat olarak Tanrı’nın iradesini Doğu’nun uçlarına kadar taşı."
 teu_prussian_king: "Prusya Kralı’nın İlanı"
 teu_prussian_king_desc: "Prusya Kralı: 18 Ocak 1701’de III. Friedrich Königsberg’de kendini Prusya Kralı I. Friedrich olarak taçlandırdı. Kendini Kutsal Roma İmparatoru’nun yargı yetkisi dışında kalan Prusya’da (Töton Tarikatı’nın eski topraklarında) taçlandırarak Habsburg onayı olmadan kraliyet unvanı iddia etmenin zekice bir yolunu buldu. “Büyük Friedrich”, yani II. Friedrich, Silezya’yı ele geçirdi ve Yedi Yıl Savaşları’nı kazandı ve Prusya’yı büyük bir Avrupa gücüne yükseltti. “Prusya ordusu olan bir ülke değil, ülkesi olan bir ordudur”: bu ulusal felsefe altında modern Almanya’nın temellerini burada ve şimdi at."
 teu_events.10.t: "Tarikat’ın Geleceği: Haçlı Seferi mi Laikleşme mi"
 teu_events.10.d: "Litvanya ve Polonya’ya boyun eğdirildiğine göre Töton Tarikatı artık tarihî bir seçimle karşı karşıya. Haçlı sancağı altında devam edip Doğu’nun paganlarını ve Ortodokslarını mı yıkacak, yoksa laik bir prenslik olup Prusya Krallığı’na mı dönüşecek."
 teu_events.10.a: "Haçlı Seferi yolu: Doğu’nun paganlarını ve Ortodokslarını yen ve Kuzey Haçlı Seferi’ni tamamla"
 teu_events.10.b: "Laikleşme yolu: Prusya Dukalığı’nı inşa et ve modern Almanya’nın temellerini at"
 teu_events.50.t: "Kuzey Haçlı Seferi Tamamlandı"
 teu_events.50.d: "“Bu Tanrı’nın iradesidir”: Baltık’tan Rus’un uzak köşelerine Töton Tarikatı’nın haçlı seferi tamamlandı. Haç kuzey topraklarında parlak ışıldıyor."
 teu_events.50.a: "Haçlı seferi çok yaşasın! Büyük Üstat’ın hegemonyası kuruldu!"
 teu_constantinople_fall: "İstanbul’un Düşüşü"
 teu_constantinople_fall_desc: "Kuzey Haçlı Seferi artık tamamlandığına göre Töton Tarikatı bakışını güneye çevirir. Bir zamanlar Hıristiyan dünyasının doğu kalesi olan İstanbul uzun zaman önce sapkınların ve kâfirlerin eline düştü. Bu kadim imparatorluk şehrini geri al ve gerçek inancın sancağını Haliç’in üzerinde bir kez daha yükselt. Kudüs Kutsal Topraklar’ına giden yol bu şehrin kurtarılmasıyla başlar."
 teu_jerusalem_reclaimed: "Kudüs’ün Geri Alınışı"
 teu_jerusalem_reclaimed_desc: "İstanbul geri alındığında haçlı seferinin son hedefi artık tek: Kudüs Kutsal Topraklar’ın kendisi. Sayısız haçlı denedi ve sayısız haçlı bu toprakta düştü; şimdi Töton Tarikatı’nın kara haçının burada dalgalanma zamanı geldi. Kutsal Kabir Kilisesi’nde dualar sun ve Hıristiyan dünyasının kadim hayalini gerçekleştir."
 teu_events.55.t: "İstanbul Nihayet Bizim"
 teu_events.55.d: "Kuzey Haçlı Seferi’ni tamamlayan Töton Tarikatı mızrağını güneye çevirdi. Bir zamanlar Bizans şanının simgesi olan İstanbul sapkınlar ve kâfirler tarafından çiğnenen bir harabeden biraz fazlası olmuştu. Ama Tarikat’ın orduları şehri kurtardı ve Ayasofya’nın üzerinde haçı bir kez daha yükseltti. Bir sonraki hedef belli: Kudüs Kutsal Topraklar’ını geri almak."
 teu_events.55.a: "Kutsal Topraklar’a giden yol açık: Kudüs’e ileri!"
 teu_events.56.t: "Kudüs Kurtarıldı"
 teu_events.56.d: "Haçlıların yüzyıllar boyunca peşinden koştuğu bir hayal ve defalarca yıkılan bir umut: Kudüs Kutsal Topraklar’ının geri alınışı nihayet gerçekleşti. Töton Tarikatı’nın sancağı Kutsal Kabir Kilisesi’nin üzerinde dalgalanırken tüm Hıristiyan dünyası bu zafere sevinir. Büyük Üstat’ın adı geçmişin büyük haçlı liderlerinin adlarıyla birlikte ilelebet anılacak. Bu kutsal zafer sayesinde hükümdarın yiğitliği ve şanı ölümsüz oldu."
 teu_events.56.a: "Tanrı bizimle! Kutsal Topraklar kurtarıldı!"
 teu_events.60.t: "Kuzey Alman Konfederasyonu İlan Edildi"
 teu_events.60.d: "Prusya’dan Pomeranya’ya ve Brandenburg’a: tüm kuzey Almanya Prusya sancağı altında birleşti. Modern Alman devletinin şafağı."
 teu_events.60.a: "Prusya çok yaşasın! Kuzey Alman Konfederasyonu çok yaşasın!"
 teu_events.99.t: "Tarikat’ın Nihai Hedefi"
 teu_events.99.d: "Töton Tarikatı’nın misyonu yerine geldi: adı Baltık’a hükmeden büyük bir imparatorluk olarak tarihe kazındı."
 teu_events.99.a: "Töton Tarikatı çok yaşasın!"
