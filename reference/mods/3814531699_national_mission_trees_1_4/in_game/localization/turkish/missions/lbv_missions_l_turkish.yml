l_turkish:
 lbv_niederbayern_mission_pack: "Landshut Mirası: Bavyera’nın Yeniden Birleşmesine Giden Yol"
 lbv_niederbayern_mission_pack_DESCRIPTION:0 "Düşük Ülkeler’e kadar uzanan I. Albert’in mirasının varisi Landshut Hanedanı olarak, parçalanmış Bavyera topraklarını yeniden bir bütün hâlinde birleştir."
 lbv_niederbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Landshut’u geliştir ve Bavyera’yı yeniden birleştir."
 lbv_niederbayern_mission_pack_BUTTON_TOOLTIP:0 "Landshut’u geliştir ve Bavyera’yı yeniden birleştir."
 lbv_niederbayern_mission_pack_BUTTON_DETAILS:0 "Tüm Bavyera’nın Dükü olarak yüksel!"
 lbv_straubing_holland_legacy: "Straubing-Holland Mirası"
 lbv_straubing_holland_legacy_desc: "Düşük Ülkeler’e kadar uzanan I. Albert’in mirası: Landshut Hanedanı olarak bu geniş mirasın hatırasını devral."
 lbv_secure_landshut: "Landshut’u Geliştir"
 lbv_secure_landshut_desc: "Isar nehri yukarısındaki Landshut: muhteşem Gotik mimarisiyle bu şehri dukalığın merkezi olarak geliştir."
 lbv_danube_trade: "Tuna Ticareti"
 lbv_danube_trade_desc: "Tuna’yı kat eden tüccar gemileri: bu hayati su yolundan yararlan ve ticaretin servetini güvence altına al."
 lbv_low_countries_ties: "Düşük Ülkeler Bağları"
 lbv_low_countries_ties_desc: "Bir zamanlar Hollanda, Zeeland ve Hainaut’yu yöneten I. Albert’in mirası: Düşük Ülkeler’le bağlarımızı bugün de besle."
 lbv_bavarian_ambition: "Birleşik Bavyera Emeli"
 lbv_bavarian_ambition_desc: "Landshut’un gelişimi, Tuna ticareti ve Düşük Ülkeler’le bağlar: bunların üzerine inşa et ve tüm Bavyera için emel besle."
 lbv_reunite_bavaria: "Bavyera’yı Yeniden Birleştir"
 lbv_reunite_bavaria_desc: "Parçalanmış dukalık: Yukarı Bavyera topraklarını geri al ve Bavyera’yı yeniden bir bütün hâlinde birleştir."
 lbv_duke_of_all_bavaria: "Tüm Bavyera’nın Dükü"
 lbv_duke_of_all_bavaria_desc: "Landshut Hanedanı’nın soyu altında, tüm Bavyera nihayet tek bir sancak altında birleşti."
 lbv_events.1.t: "Bavyera Birliği’nin İlanı"
 lbv_events.1.d: "Landshut Hanedanı’nın soyu altında Bavyera nihayet bir bütün olarak birleşti. Bölünme çağı sona eriyor."
 lbv_events.1.a: "Bavyera’ya şeref!"
 STATIC_MODIFIER_NAME_lbv_legacy_mod: "Straubing-Holland Mirası"
 STATIC_MODIFIER_DESC_lbv_legacy_mod: "Krallığı bir zamanlar Hollanda ve Hainaut’yu kucaklayan I. Albert’in görkemi Landshut sarayında hâlâ gururla anlatılır."
 STATIC_MODIFIER_NAME_lbv_landshut_mod: "Landshut Gelişti"
 STATIC_MODIFIER_DESC_lbv_landshut_mod: "Gotik mimarili şehir, dukalığın merkezi olarak çiçekleniyor."
 STATIC_MODIFIER_NAME_lbv_danube_mod: "Tuna Ticareti"
 STATIC_MODIFIER_DESC_lbv_danube_mod: "Tuna vadisini kat eden mavnalar, Aşağı Bavyera’nın nehir kıyılarına durmaksızın tuz ve tahıl boşaltıyor."
 STATIC_MODIFIER_NAME_lbv_low_countries_mod: "Düşük Ülkeler Bağları"
 STATIC_MODIFIER_DESC_lbv_low_countries_mod: "Kuzey denizinin ötesindeki Düşük Ülkeler’den elçiler ve kumaş tüccarları Landshut sarayında bile sıcak karşılanıyor."
 STATIC_MODIFIER_NAME_lbv_reunite_mod: "Bavyera Yeniden Birleşti"
 STATIC_MODIFIER_DESC_lbv_reunite_mod: "Bir zamanlar bölünmüş iki kolun vasalları artık tek bir sancak altında yemin ediyor."
 STATIC_MODIFIER_NAME_lbv_unify_bavaria_mod: "Tüm Bavyera’nın Dükü"
 STATIC_MODIFIER_DESC_lbv_unify_bavaria_mod: "Bavyera’nın kulelerindeki çanlar bölünmenin sonunu ilan ediyor."
 lbv_unified_duchy: "Birleşik Bavyera Dukalığı"
 lbv_unified_duchy_desc: "Bölünme çağı sona erdi: birleşik bir Bavyera Dukalığı olarak yeni bir çağ aç."
 lbv_bavaria_unified_tt: "Bavyera birleştirildi"
 lbv_landrecht: "Bavyera Landrecht’i"
 lbv_landrecht_desc: "Birleşik bir dukalık için tek bir hukuk: Bavyera hukuk kanununu (Landrecht) yürürlüğe koy ve yönetimin temelini güçlendir."
 lbv_tyrol_ambition: "Tirol Emeli"
 lbv_tyrol_ambition_desc: "Alpler’in kucağındaki Tirol Kontluğu: bu toprağa göz dik."
 lbv_swabian_expansion: "Svabya’ya Genişleme"
 lbv_swabian_expansion_desc: "Güneybatıya uzanan Svabya: bu bölge üzerindeki nüfuzumuzu güçlendir."
 lbv_greater_bavaria: "Büyük Bavyera’yı Gerçekleştir"
 lbv_greater_bavaria_desc: "Hukuk kanunu, Tirol ve Svabya: bunların üzerine inşa et ve Büyük Bavyera’yı gerçekleştir."
 lbv_counter_reformation_leader: "Karşı-Reform’un Öncüsü"
 lbv_counter_reformation_leader_desc: "Trento Konsili’nin ruhunu bünyende topla ve Karşı-Reform’un ön saflarında yer al."
 lbv_electoral_dignity: "Seçici Prens Unvanı"
 lbv_electoral_dignity_desc: "1623’te I. Maximilian nihayet Seçici Prens rütbesini güvence altına alıyor: bu şerefi Bavyera’nın ebedî gururu kıl."
 lbv_austrian_rivalry: "Avusturya ile Rekabet"
 lbv_austrian_rivalry_desc: "İmparatorluk içindeki hegemonya konusunda Habsburg Hanedanı ile rekabet: büyük rakibimizle bu çekişmeyle yüzleş."
 lbv_war_of_austrian_succession: "Avusturya Veraset Savaşı"
 lbv_war_of_austrian_succession_desc: "VII. Charles’ın imparatorluk tahtı üzerindeki hak iddiası yüzünden çıkan savaş: Bavyera’nın prestijini yükseltmek için bu veraset savaşını değerlendir."
 lbv_imperial_crown: "İmparatorluk Tacı"
 lbv_imperial_crown_desc: "1742’de Bavyera Dükü VII. Charles Kutsal Roma İmparatoru olarak taçlanıyor: yüzyıllardır tacı giyen ilk Habsburg olmayan kişi."
 lbv_enlightened_absolutism: "Aydınlanmış Mutlakiyet"
 lbv_enlightened_absolutism_desc: "Aklı ve ilmi değerli kılan bir aydınlanma çağı: bu yeni düşünce akımını Bavyera’nın yönetimine taşı."
 lbv_napoleonic_alliance: "Fransa’ya Meydan Okuma"
 lbv_napoleonic_alliance_desc: "Devrim ve Napolyon’un emelleriyle sarsılan Avrupa: Bavyera bu güçlü komşunun tahtı üzerinde bir hak iddiası edinir ve kendi rotasını çizer."
 lbv_kingdom_of_bavaria: "Bavyera Krallığı İlan Edildi"
 lbv_kingdom_of_bavaria_desc: "1806’da Seçici Prens IV. Maximilian Joseph kendini Bavyera Kralı ilan ediyor: Wittelsbach Hanedanı’nın uzun tarihi burada yeni bir zirveye ulaşıyor."
 lbv_events.3.t: "İmparatorluk Tacı"
 lbv_events.3.d: "1742’de Bavyera Dükü VII. Charles, Frankfurt katedralinde Kutsal Roma İmparatoru olarak taçlandı. Bir Habsburg dışında hiç kimsenin imparatorluk tacını giymesinin üzerinden yüzyıllar geçmişti."
 lbv_events.3.a: "Majesteleri İmparator’a şeref!"
 lbv_events.99.t: "Bavyera Krallığı’nın İlanı"
 lbv_events.99.d: "1806’da Seçici Prens IV. Maximilian Joseph, Ren Konfederasyonu çatısı altında kendini Bavyera Kralı ilan etti. Wittelsbach Hanedanı’nın uzun tarihi burada yeni bir zirveye ulaşıyor."
 lbv_events.99.a: "Yaşasın Bavyera Krallığı!"
 STATIC_MODIFIER_NAME_lbv_unified_mod: "Birleşik Bavyera Dukalığı"
 STATIC_MODIFIER_DESC_lbv_unified_mod: "Dukalık artık saraylarını, gelirlerini ve askerlerini rakip kollar arasında bölmek zorunda değil."
 STATIC_MODIFIER_NAME_lbv_greater_mod: "Büyük Bavyera Gerçekleşti"
 STATIC_MODIFIER_DESC_lbv_greater_mod: "Alp eteklerinden Svabya tepelerine, dük sancağı altındaki topraklar her mevsim genişliyor."
 STATIC_MODIFIER_NAME_lbv_counter_reformation_mod: "Karşı-Reform’un Öncüsü"
 STATIC_MODIFIER_DESC_lbv_counter_reformation_mod: "Trento Konsili ruhuyla dukalığın kasabalarında Cizvit kolejleri birbiri ardına açılıyor."
 STATIC_MODIFIER_NAME_lbv_succession_war_mod: "Avusturya Veraset Savaşı"
 STATIC_MODIFIER_DESC_lbv_succession_war_mod: "Avusturya Veraset Savaşı’nın savaş alanlarında pişen subaylar ve erler artık dük ordusunun çekirdeğini oluşturuyor."
 STATIC_MODIFIER_NAME_lbv_imperial_crown_mod: "İmparatorluk Tacı"
 STATIC_MODIFIER_DESC_lbv_imperial_crown_mod: "Bavyera Dükü’nün Frankfurt Katedrali’nde taçlandığı günün anısı, sarayda her yüreğe gururla kazınmıştır."
 STATIC_MODIFIER_NAME_lbv_enlightenment_mod: "Aydınlanmış Mutlakiyet"
 STATIC_MODIFIER_DESC_lbv_enlightenment_mod: "Sarayda Fransa’dan gelen yeni kitaplar Aydınlanma ideallerini yayıyor ve okul sayısı yıldan yıla artıyor."
 STATIC_MODIFIER_NAME_lbv_electoral_dignity_mod: "Seçici Prens Unvanı"
 STATIC_MODIFIER_DESC_lbv_electoral_dignity_mod: "Seçici Prens cübbesiyle donanmış Dük bir imparatorluk seçiminde yerini aldığında prensler sözlerini saygıyla dinler."
 STATIC_MODIFIER_NAME_lbv_kingdom_mod: "Bavyera Krallığı"
 STATIC_MODIFIER_DESC_lbv_kingdom_mod: "Münih’teki sarayda, Wittelsbach Hanedanı’ndan ilk Bavyera Kralı’nın taçlanışını kutlayan top salvoları gürlüyor."
