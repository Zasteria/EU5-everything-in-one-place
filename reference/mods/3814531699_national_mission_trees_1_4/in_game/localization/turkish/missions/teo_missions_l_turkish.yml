 teo_events.1.b: "Got gururunu canlandır: biz Gotya’nın gerçek halefleriyiz"
 teo_events.5.t: "Gazarya: Satın Al mı Reddet mi?"
 teo_events.5.d: "Cenova Cumhuriyeti Kırım ticaret kolonisi “Gazarya’yı (GAZ)” yönetiyor. 300 düka karşılığında Cenova Gazarya’yı Theodoro’ya vasal olarak devretmeyi öneriyor.\n\nBu Kırım üzerindeki denetimi barışçıl biçimde kurmak için bir fırsat, ama 300 düka yüksek bir fiyat. Satın alacak mısın?"
 teo_events.5.a: "Gazarya’yı satın almak için 300 düka öde: Kırım bizim olacak"
 teo_events.5.b: "Reddet: şimdilik hazineyi koru"
 STATIC_MODIFIER_NAME_teo_gothic_penalty_mod: "Got Dönüşümünün Acısı"
 STATIC_MODIFIER_DESC_teo_gothic_penalty_mod: "Got diline ve âdetlerine alışamayan Pontuslu Yunanlılar köylerde için için yanan şikâyetleri besliyor; ama herkes Got diyarı tamamlandığında daha büyük ödüllerin kendilerini beklediğini biliyor."
 STATIC_MODIFIER_NAME_teo_gothic_bonus_mod: "Gotya’nın Gerçek Halefi"
 STATIC_MODIFIER_DESC_teo_gothic_bonus_mod: "Got kültürü korunarak tamamlanan Got İmparatorluğu: kadim Gotların ruhu yeniden canlandı ve Got İmparatorluğu’na ebedî şan getiriyor."
 teo_events.10.b: "İttifakı sürdür: Komnenosların gururuna saygı göster"
 STATIC_MODIFIER_NAME_teo_russian_alliance_mod: "Rusya ile İttifak"
 STATIC_MODIFIER_DESC_teo_russian_alliance_mod: "Rus prenslikleriyle dostane ittifak Gotya’nın diplomatik nüfuzunu yükseltti."
