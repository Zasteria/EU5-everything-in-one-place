l_turkish:
 teo_theodoro_mission_pack: "Theodoro Prensliği: Yeniden Doğan Gotya ve Karadeniz’in Efendisi"
 teo_theodoro_mission_pack_DESCRIPTION:0 "1337’de Theodoro Prensliği Kırım Yarımadası’ndaki Mangup dağ kalesine tutunuyor. Bir zamanlar Bizans İmparatorluğu’nun parçası olan bu Yunan prensliği Tatarlar, Cenevizliler ve yükselen Osmanlılarla çevrili. Gavras ailesinin ticari dehasını ve askerî yiğitliğini kullanarak Karadeniz ticaretini ele geçir, Gotya’nın adını canlandır, İstanbul’u geri al ve Doğu Akdeniz’e Got İmparatorluğu olarak hüküm sür."
 teo_theodoro_mission_pack_CRITERIA_DESCRIPTION:0 "Karadeniz’e hâkim ol, Cenevizlileri kov, İstanbul’u geri al ve Doğu Akdeniz’e, Karadeniz’e ve Bozkırlar’a Got İmparatorluğu olarak hükmet."
 teo_theodoro_mission_pack_BUTTON_TOOLTIP:0 "Doğu Akdeniz’e Got İmparatorluğu olarak hüküm sür."
 teo_theodoro_mission_pack_BUTTON_DETAILS:0 "Mangup dağ kalesinden Karadeniz ticareti, Bizans mirası ve bozkır fethi yoluyla Got İmparatorluğu’nu inşa et!"
 teo_rise_of_theodoro: "Theodoro’nun Yükselişi"
 teo_rise_of_theodoro_desc: "Mangup’un dağ kalesinden Theodoro Prensliği yükselişine başlıyor. Tatarlar, Cenevizliler ve Osmanlılarla çevrili Gavras ailesinin dehası krizi fırsata dönüştürecek."
 teo_black_sea_fleet: "Karadeniz Filosu"
 teo_black_sea_fleet_desc: "Karadeniz Cenova’nın, Venedik’in, Tatarların ve Osmanlıların çekişme alanıdır. Bu hayati sularda Theodoro gücünü ortaya koymak için bir filo inşa et."
 teo_build_theodoro_harbor: "Theodoro Limanı"
 teo_build_theodoro_harbor_desc: "Mangup’un eteğindeki Theodoro limanını geliştir ve onu bir Karadeniz deniz gücü olarak kur."
 teo_genoese_question: "Ceneviz Meselesi"
 teo_genoese_question_desc: "Cenova’nın Gazarya kolonisi Kefe’den Karadeniz ticaretine hâkimdir. Gazarya’yı vasal olarak satın al ya da hazineyi koru."
 teo_expel_genoese: "Cenevizlileri Kov"
 teo_expel_genoese_desc: "Cenevizlileri Kırım’dan kov ve Theodoro üstünlüğünü kurmak için kolonilerini ele geçir."
 teo_dominate_crimea: "Kırım’a Hâkim Ol"
 teo_dominate_crimea_desc: "Tüm rakipleri Kırım’dan kov ve onun tek efendisi olarak hüküm sür."
 teo_tana_trade: "Tana Ticareti"
 teo_tana_trade_desc: "Doğu ticaret yollarını denetlemek için Don Nehri ağzındaki Tana ticaret merkezini ele geçir."
 teo_black_sea_domination: "Karadeniz Hâkimiyeti"
 teo_black_sea_domination_desc: "Theodoro üstünlüğüne meydan okuyacak rakip bırakmayarak Karadeniz üzerinde tam hâkimiyeti ortaya koy."
 teo_greek_heritage: "Yunan Mirası"
 teo_greek_heritage_desc: "Theodoro’nun meşruiyetini destekleyen Ortodoks inancını ve Bizans kültürel mirasını güçlendir."
 teo_trebizond_relations: "Trabzon İlişkileri"
 teo_trebizond_relations_desc: "Trabzon Komnenos İmparatorluğu ile ilişkiyi tanımla: vasallık teklif et ya da ittifakı sürdür."
 teo_restore_pontus: "Pontus’u Yeniden Kur"
 teo_restore_pontus_desc: "Pontus kıyı şeridini fethet ve kadim Pontus krallığını yeniden kur."
 teo_constantinople: "İstanbul’u Geri Al"
 teo_constantinople_desc: "İkinci Roma’yı Osmanlılardan geri al ve Ortodoks haçını Ayasofya’nın üzerine geri koy."
 teo_gothia_ascendant: "Gotya Yükseliyor"
 teo_gothia_ascendant_desc: "Gotya’nın canlanışını ilan et ve Bizans’ın meşru halefi olarak tanın."
 teo_aegean_supremacy: "Ege Üstünlüğü"
 teo_aegean_supremacy_desc: "Theodoro deniz gücünü Akdeniz’e uzatmak için Ege adalarını ve kıyı şeridini ele geçir."
 teo_balkans: "Balkanlar’ı Fethet"
 teo_balkans_desc: "Got İmparatorluğu’nu sağlamlaştırmak için eski Bizans İmparatorluğu’nun ana toprakları Balkanlar’ı fethet."
 teo_azov_gateway: "Azak’a Açılan Kapı"
 teo_azov_gateway_desc: "Don ve İdil nehirleri aracılığıyla iç ticaret yollarını açmak için Azak Denizi’ni denetle."
 teo_pryazovia: "Azak Çevresi"
 teo_pryazovia_desc: "Azak Denizi’nin kuzeyindeki Azak Çevresi bölgesini güvenceye al ve bozkırlara giden yolu aç."
 teo_tatar_wars: "Tatarlara Karşı Savaşlar"
 teo_tatar_wars_desc: "Theodoro süvarisini seçkin bozkır savaşçılarına dönüştürmek için Kırım Tatarları ile savaş."
 teo_into_steppes: "Bozkırlara Doğru"
 teo_into_steppes_desc: "Uçsuz bucaksız Pontus Bozkırı’nı fethet ve Theodoro’yu kıtasal bir imparatorluğa dönüştür."
 teo_caucasus_gateway: "Kafkasya’ya Açılan Kapı"
 teo_caucasus_gateway_desc: "Gürcistan’ın, Ermenistan’ın ve Azerbaycan’ın Kafkas Dağları’na ilerle."
 teo_caspian_reach: "Hazar’a Ulaş"
 teo_caspian_reach_desc: "İran ve Orta Asya ticaret yollarına erişim kazanmak için Hazar Denizi’ne ulaş."
 teo_russian_question: "Rus Meselesi"
 teo_russian_question_desc: "Moskova ve Novgorod ile ilişkiyi tanımla: ittifak kur ya da fetih peşinde koş."
 teo_russian_claim: "Rus’u Sahiplen"
 teo_russian_claim_desc: "Theodoro nüfuzunu Rus prenslikleri üzerine uzat."
 teo_ruthenia_conquest: "Rutenya’nın Fethi"
 teo_ruthenia_conquest_desc: "Kiev dahil Rutenya’yı fethet ve hem Bizans’ın hem Rus’un mirasını üstlen."
 teo_dev_theodoro: "Theodoro’yu Geliştir"
 teo_dev_theodoro_desc: "Theodoro kale şehrini Got İmparatorluğu’nun layık bir başkentine dönüştür."
 teo_trade_empire: "Ticaret İmparatorluğu"
 teo_trade_empire_desc: "Karadeniz’in, Akdeniz’in ve İpek Yolu’nun kavşağında bir ticaret imparatorluğu inşa et."
 teo_silk_road: "İpek Yolu Ticareti"
 teo_silk_road_desc: "İpek Yolu’nu denetle ve Orta Asya’dan Batı pazarlarına ipek akışını tekelleştir."
 teo_gothic_culture: "Got Kültürü"
 teo_gothic_culture_desc: "Yunan, Got ve Tatar mirasını harmanlayan eşsiz bir Gotya kültürü besle."
 teo_orthodox_fortress: "Ortodoks Kalesi"
 teo_orthodox_fortress_desc: "İnancı savunmak için bir Ortodoks manastırları ve askerî kaleler ağı kur."
 teo_great_theodoro: "Büyük Theodoro"
 teo_great_theodoro_desc: "Mangup’u Got İmparatorluğu’nun ebedî başkentine, bir medeniyet fenerine dönüştür."
 teo_crimean_wine: "Kırım Şarabı"
 teo_crimean_wine_desc: "Kırım bağcılığının kadim Yunan geleneğini canlandır ve Akdeniz pazarlarına şarap tedarik et."
 teo_fortress_mangup: "Mangup Kalesi"
 teo_fortress_mangup_desc: "Mangup’u tahkim et: Osmanlıların bile almakta zorlandığı doğal yayla kalesi."
 teo_anatolian_coast: "Anadolu Kıyısı"
 teo_anatolian_coast_desc: "Karadeniz’i bir Theodoro gölü yapmak için Anadolu’nun Karadeniz güney kıyısını fethet."
 teo_orthodox_patriarch: "Ortodoks Patrikhanesi"
 teo_orthodox_patriarch_desc: "İstanbul’da bir patrikhane kur ve Theodoro’yu tüm Ortodoks Hıristiyanların koruyucusu yap."
 teo_merchant_republic: "Tüccar Cumhuriyeti"
 teo_merchant_republic_desc: "Ticaret ve fetih yoluyla Akdeniz’in en büyük ticaret imparatorluğunu inşa et."
 teo_dev_trebizond_city: "Trabzon’u Geliştir"
 teo_dev_trebizond_city_desc: "Trabzon’u Karadeniz güney kıyısında önemli bir ticaret merkezi olarak geliştir."
 teo_gavras_triumphant: "Gavras’ın Zaferi"
 teo_gavras_triumphant_desc: "Gavras ailesinin ticari dehası ve askerî cesareti bir dağ kalesinden büyük bir imparatorluk yarattı."
 teo_gothia_empire: "Got İmparatorluğu"
 teo_gothia_empire_desc: "Gotya İmparatoru olarak hüküm sür: Karadeniz’in, Akdeniz’in ve Bozkırlar’ın efendisi."
 teo_events.1.t: "Theodoro Yükseliyor: Yunan Geleneği mi Got Gururu mu?"
 teo_events.1.d: "1337’de Mangup’un yayla kalesinden Theodoro Prensliği yükselişine başlıyor. Tatarlar, Cenevizliler ve Osmanlılarla çevrili Gavras ailesinin ticari dehası ve askerî cesareti bu krizi fırsata dönüştürecek. Karadeniz ticaretini ele geçir, Gotya’yı canlandır ve İstanbul’u geri al."
 teo_events.1.a: "Pontus Yunan geleneğini koru: biz Bizans’ın mirasçılarıyız"
 teo_events.10.t: "Trabzon ile Yeniden Birleşme: Komnenos Bağlantısı"
 teo_events.10.d: "Komnenos hanedanının Trabzon İmparatorluğu Osmanlı baskısı altında geriliyor. Hemşehri Yunanlılar olarak Trabzon’a yardım mı etmeliyiz, yoksa onu Gotya’ya mı katmalıyız?"
 teo_events.10.a: "Trabzon’u vasal yap: Pontus mirasını Gotya altında koru"
 teo_events.20.t: "İstanbul Geri Alındı: Got Kralı’nın Taç Giyişi"
 teo_events.20.d: "İstanbul Gotya’nın elinde! Ortodoks kutsal şehrini Osmanlılardan geri almak, “Üçüncü Roma” olarak Rusya’nın Ortodoks dünyasının manevi lideri olması demektir. Hıristiyan haçı bir kez daha Ayasofya’nın üzerinde dalgalanıyor."
 teo_events.20.a: "Got Kralı çok yaşasın! İstanbul çok yaşasın!"
 teo_events.30.t: "Rus Meselesi: İttifak mı Fetih mi?"
 teo_events.30.d: "Gavras ailesinin Rus soylu evleriyle derin bağları var. Moskova ve Novgorod ile ilişkimizi nasıl tanımlayacağız: karşılıklı çıkarları koruyan bir ittifak mı kuracağız, yoksa Rus’u Gotya’nın egemenliği altına mı alacağız?"
 teo_events.30.a: "Rusya ile ittifak kur: Ortodoks kardeşler olarak iş birliği yap"
 teo_events.30.b: "Rus’un fethini hedefle: Gotya Rus’un gerçek efendisi olacak"
 teo_events.60.t: "Gavras’ın Zaferi: Got İmparatorluğu’nun Doğuşu"
 teo_events.60.d: "Karadeniz hâkimiyeti, İstanbul geri alındı, bozkırlar fethedildi: Gavras ailesi artık Doğu Akdeniz’e “Got İmparatorluğu İmparatoru” olarak hüküm sürüyor. Mangup’un dağ kalesinden başlayan yolculuk bir dünya imparatorluğunun kuruluşuyla sona eriyor."
 teo_events.60.a: "Got İmparatorluğu çok yaşasın! Gavras ailesi çok yaşasın!"
 teo_events.99.t: "Got İmparatorluğu: Ebedî Şan"
 teo_events.99.d: "“Gotya İmparatoru: Karadeniz’in, Akdeniz’in ve Bozkır’ın Efendisi”: Doğu ve Batı uygarlığının kavşağındaki bu imparatorluk en yüce olarak hüküm sürüyor. 1337’de Mangup’un küçük kalesinden başlayan mucizevi hikâye burada sonuçlanıyor."
 teo_events.99.a: "Got İmparatorluğu çok yaşasın! Ebedî şan çok yaşasın!"
