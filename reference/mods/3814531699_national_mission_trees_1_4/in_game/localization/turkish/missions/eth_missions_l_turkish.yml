l_turkish:
 eth_ethiopia_mission_pack: "Yeni Süleymani İmparatorluk: Afrika Boynuzu’nda Parlayan Bir Haç"
 eth_ethiopia_mission_pack_DESCRIPTION:0 "Saba Kraliçesi ve Kral Süleyman’ın soyundan geldiği söylenen bir hanedan altında Kıptilerin koruyucusu olarak Memlüklerle çekiş, Adal ile ölüm kalım mücadelesinde galip gel ve yeni bir imparatorluk kurmak için Aksum’un şanını canlandır."
 eth_ethiopia_mission_pack_CRITERIA_DESCRIPTION:0 "İmparatorluğu kur, Afrika Boynuzu üzerinde hegemonya iddia et, Kıptileri koru ve Aksum’un şanını canlandır."
 eth_ethiopia_mission_pack_BUTTON_TOOLTIP:0 "Bir yayla kalesinden Kızıldeniz’de parlayan bir imparatorluğa."
 eth_ethiopia_mission_pack_BUTTON_DETAILS:0 "“Kralların Kralı, Yahuda’nın Aslanı”: Saba Kraliçesi’nin varisi olarak yeni bir Süleymani İmparatorluk inşa et!"
 eth_negus_authority: "Negus Negest’in Otoritesini Kur"
 eth_negus_authority_desc: "“Kralların Kralı”: Negus Negest unvanı. Bu otoritenin diyarın her köşesine ulaşmasını sağla."
 eth_amba_geshen: "Amba Geshen Hapishanesi"
 eth_amba_geshen_desc: "Veraset anlaşmazlıklarını önlemek için kraliyet prensleri Amba Geshen’in doğal kalesine hapsedilir: bu geleneği bir kurum olarak kur."
 eth_mobile_court: "Etiyopya’nın Gezici Sarayı"
 eth_mobile_court_desc: "Sabit bir başkent olmaksızın İmparator ve ordusu diyarı gezici bir kampla (ketema) dolaşır: bu eşsiz yönetim tarzını bir devlet kurumu olarak kur."
 eth_coptic_church: "Etiyopya Ortodoks Kilisesi’ni Koru"
 eth_coptic_church_desc: "İskenderiye’nin otoritesi altındaki Etiyopya Ortodoks Kilisesi: inancını devletin bir sütunu yap ve Kıptilerin koruyucusu ol."
 eth_gondar_founding: "Gondar’ı Geliştir"
 eth_gondar_founding_desc: "“Afrika’nın Camelot’u” denen Gondar: onu taştan büyük bir surlu şehre dönüştür."
 eth_royal_chronicle: "Kraliyet Vakayinamelerini Derle"
 eth_royal_chronicle_desc: "Geçmiş imparatorların eylemlerini kaydeden vakayiname “Kebra Nagast”ın ruhunu devral ve ilim ve kayıt tutma geleneğini besle."
 eth_feudal_levies: "Feodal Seferberlik Sistemi"
 eth_feudal_levies_desc: "Bölgesel lordların İmparator’un çağrısıyla birlikleri yönettiği Etiyopya’nın eşsiz feodal askerî sistemini kur."
 eth_negus_dynasty: "Süleymani Hanedanı Güvence Altında"
 eth_negus_dynasty_desc: "Kilise, vakayinameler, askerî sistem ve başkent yerli yerinde olduğunda Süleymani hanedanının yönetimini sarsılmaz kıl."
 eth_oromo_migration: "Oromo Göçleri"
 eth_oromo_migration_desc: "16. yüzyılda Oromo halkları büyük bir göç başlatır: bu tarihî halk hareketine karşılık ver."
 eth_agaw_people: "Agaw’ları Yönet"
 eth_agaw_people_desc: "Etiyopya yaylalarının kadim sakinleri Agaw’lar: onları kültürlerine saygı göstererek imparatorluğun tebaası olarak yönet."
 eth_beta_israel: "Beta Israel ile Bir Arada Yaşam"
 eth_beta_israel_desc: "“Falaşa” olarak da bilinen Etiyopyalı Yahudiler Beta Israel: onlarla bir arada yaşam yolu inşa et."
 eth_horn_hegemony: "Afrika Boynuzu Üzerinde Hegemonya"
 eth_horn_hegemony_desc: "Sidama’ları, Oromo’ları, Agaw’ları ve Beta Israel’i birleştiren bir imparatorluk olarak Afrika Boynuzu üzerinde hegemonya iddia et."
 eth_nubian_alliance: "Nubia ile İttifak"
 eth_nubian_alliance_desc: "Kuzeydeki Kıpti devletler Makuria ve Alodia: bu aynı inançtan kardeşlerle ittifaklar kur."
 eth_conquer_makuria: "Makuria’yı İlhak Et"
 eth_conquer_makuria_desc: "Bir zamanlar Nil boyunca çiçek açan Kıpti krallık Makuria: bu şimdi gerileyen devleti koru ya da ilhak et."
 eth_conquer_alodia: "Alodia’yı İlhak Et"
 eth_conquer_alodia_desc: "Güney Nubia’nın Kıpti krallığı Alodia: bu toprağı Etiyopya’nın egemenlik alanına kat."
 eth_sudan_dominion: "Sudan Üzerinde Egemenlik Kur"
 eth_sudan_dominion_desc: "Nil vadisinden Nubia çölüne: bu geniş toprak üzerinde Etiyopya egemenliğini kur."
 eth_mamluk_rivalry: "Memlüklerle Rekabet"
 eth_mamluk_rivalry_desc: "Mısır’ı yöneten Memlük Sultanlığı: Kıptilerin koruyucusu olarak onlarla rekabeti çöz."
 eth_liberate_jerusalem: "Kudüs’ü Kurtar"
 eth_liberate_jerusalem_desc: "Kutsal Şehir Kudüs: Kıptilerin ibadet haklarını korumak için bu toprağı kurtar."
 eth_coptic_patriarchate: "Kıpti Patrikhanesi’ne Komuta Et"
 eth_coptic_patriarchate_desc: "İskenderiye Kıpti Patrikhanesi: otoritesini Etiyopya denetimi altına al."
 eth_protector_of_copts: "Kıptilerin Koruyucusu"
 eth_protector_of_copts_desc: "Dünyaya dağılmış Kıptiler için Etiyopya İmparatoru son koruyucularıdır: bu rolü yerine getir."
 eth_adal_wars: "Adal Savaşları"
 eth_adal_wars_desc: "Kızıldeniz kıyısındaki İslam devleti Adal Sultanlığı: bu uzun süreli rakiple savaşla yüzleş."
 eth_conquer_zeila: "Zeyla’yı Fethet"
 eth_conquer_zeila_desc: "Adal’ın hayati liman şehri Zeyla: onu fethet ve Kızıldeniz ticaretinde bir tutunak kazan."
 eth_conquer_harar: "Harar’ı Fethet"
 eth_conquer_harar_desc: "İslam ilminin merkezi Harar: bu kutsal şehri fethet."
 eth_conquer_adal: "Adal’ı Fethet"
 eth_conquer_adal_desc: "“Solak Ahmed” (Gran) tehdidine son ver ve uzun süreli rakip Adal Sultanlığı’nı fethet."
 eth_somali_coast: "Somali Kıyısını Güvenceye Al"
 eth_somali_coast_desc: "Somali kıyı şeridi: Adal’ın kalıntılarını süpür ve bu toprağı güvenceye al."
 eth_red_sea_access: "Kızıldeniz’e Erişim"
 eth_red_sea_access_desc: "Masavva limanını güvenceye al ve denize kıyısı olmayan Etiyopya için uzun süredir beklenen deniz yolunu aç."
 eth_portuguese_contact: "Portekizlilerle Temas"
 eth_portuguese_contact_desc: "Efsanevi “Rahip Yuhanna” diyarını arayan Portekizliler: onlarla temas Etiyopya’ya yeni bir çağ getirir."
 eth_massawa_port: "Masavva Limanı’nı Geliştir"
 eth_massawa_port_desc: "Kızıldeniz’deki liman şehri Masavva: onu dış ticaret için bir kapı olarak geliştir."
 eth_firearms_adoption: "Ateşli Silahları Benimse"
 eth_firearms_adoption_desc: "Portekiz desteğiyle Etiyopya ordusuna tüfek ve top getir."
 eth_european_trade: "Avrupa ile Ticaret"
 eth_european_trade_desc: "Masavva aracılığıyla Avrupa ulusları ile ticareti canlandır."
 eth_modernize_army: "Orduyu Modernleştir"
 eth_modernize_army_desc: "Ateşli silahlar ve Avrupa ticareti üzerine inşa ederek Etiyopya ordusunu modern bir askerî güce dönüştür."
 eth_aksum_heritage: "Aksum’un Mirası"
 eth_aksum_heritage_desc: "Bir zamanlar Kızıldeniz ticaretiyle çiçek açan Aksum İmparatorluğu: kutsal şehrini güvenceye al ve şanının hatırasını miras al."
 eth_reclaim_aksum: "Tigray’ı Canlandır"
 eth_reclaim_aksum_desc: "Aksum İmparatorluğu’nun doğum yeri Tigray: bu bölgeyi imparatorluğun çekirdek toprağı olarak canlandır."
 eth_red_sea_empire: "Kızıldeniz İmparatorluğu’nu Yeniden İnşa Et"
 eth_red_sea_empire_desc: "Aksum’un bir zamanlar kurduğu Kızıldeniz ticaret imparatorluğu: onu bugünün çağında canlandır."
 eth_horn_unification: "Afrika Boynuzu’nu Birleştir"
 eth_horn_unification_desc: "Kuşit halkların bütünleşmesi ve Kızıldeniz imparatorluğunun canlanışı yoluyla tüm Afrika Boynuzu’nu Etiyopya sancağı altında birleştir."
 eth_new_solomonic_empire: "Yeni Süleymani İmparatorluk"
 eth_new_solomonic_empire_desc: "Kıptilerin koruyucusu, modernleşmiş bir ordu ve birleşik bir Afrika Boynuzu: Saba Kraliçesi ve Kral Süleyman’ın soyu burada yeni bir imparatorluk olarak tamamlanır."
 eth_events.1.t: "Kudüs Kurtarıldı"
 eth_events.1.d: "Kutsal Şehir Kudüs Kıpti ellerine döndü. Dünyaya dağılmış kardeşler için bu gün ebediyen hatırlanacak."
 eth_events.1.a: "Tanrı’ya şeref!"
 eth_events.99.t: "Yeni Süleymani İmparatorluğun İlanı"
 eth_events.99.d: "Küçük bir yayla krallığı büyük bir imparatorluk olarak yeniden doğdu: Kıptilerin koruyucusu, Kızıldeniz’in efendisi, Afrika Boynuzu’nun hükümdarı. Saba Kraliçesi ve Kral Süleyman’ın soyu burada tamamlanır."
 eth_events.99.a: "Etiyopya’ya şeref! Yeni Süleymani İmparatorluk çok yaşasın!"
 STATIC_MODIFIER_NAME_eth_negus_mod: "Negus’un Otoritesi Kuruldu"
 STATIC_MODIFIER_DESC_eth_negus_mod: "İmparator’un otoritesi diyara ulaşıyor ve yönetimin meşruiyetini yükseltiyor."
 STATIC_MODIFIER_NAME_eth_amba_geshen_mod: "Amba Geshen Hapishanesi"
 STATIC_MODIFIER_DESC_eth_amba_geshen_mod: "Amba Geshen’in uçurumlarının tepesinde kraliyet kanından genç prensler tahta göz dikmelerine asla izin verilmeden sessizce yaşlanıyor."
 STATIC_MODIFIER_NAME_eth_coptic_church_mod: "Ortodoks Kilisesi Korundu"
 STATIC_MODIFIER_DESC_eth_coptic_church_mod: "Tewahedo Kilisesi’nin çanları yayla boyunca vadiden vadiye çalıyor ve başka inançtan halklar bile dinlemek için duruyor."
 STATIC_MODIFIER_NAME_eth_gondar_mod: "Gondar Geliştirildi"
 STATIC_MODIFIER_DESC_eth_gondar_mod: "Taş duvarlı şehir krallığın refahının simgesi oldu."
 STATIC_MODIFIER_NAME_eth_chronicle_mod: "Kraliyet Vakayinameleri Derlendi"
 STATIC_MODIFIER_DESC_eth_chronicle_mod: "Manastırların loş yazıhanelerinde Ge’ez vakayinamelerini kopyalayan katiplerin kalemleri hiç dinlenmiyor."
 STATIC_MODIFIER_NAME_eth_levies_mod: "Feodal Seferberlik Sistemi"
 STATIC_MODIFIER_DESC_eth_levies_mod: "Davulların sesiyle yayla lordları toplanıyor ve her biri adamlarını kendi sancağı altında yönetiyor."
 STATIC_MODIFIER_NAME_eth_dynasty_mod: "Hanedan Güvence Altında"
 STATIC_MODIFIER_DESC_eth_dynasty_mod: "Kral Süleyman’ın ve Saba Kraliçesi’nin soyundan gelme gururu hanedanın adını tüm halklar arasında saygıya layık kılıyor."
 STATIC_MODIFIER_NAME_eth_horn_hegemony_mod: "Boynuz Üzerinde Hegemonya"
 STATIC_MODIFIER_DESC_eth_horn_hegemony_mod: "Habeş yaylalarından Boynuz’un ovalarına sayısız dil konuşan halklar tek bir kralın adıyla haraç ödüyor."
 STATIC_MODIFIER_NAME_eth_nubian_mod: "Nubia ile İttifak"
 STATIC_MODIFIER_DESC_eth_nubian_mod: "Kuzey Nubia’daki kardeşlerimizden gelen elçiler aynı haç inancını paylaşanlar olarak sıcak biçimde karşılanıyor."
 STATIC_MODIFIER_NAME_eth_makuria_mod: "Makuria İlhak Edildi"
 STATIC_MODIFIER_DESC_eth_makuria_mod: "İlhak edilen Makuria’nın bütünleşmesi ilerliyor."
 STATIC_MODIFIER_NAME_eth_alodia_mod: "Alodia İlhak Edildi"
 STATIC_MODIFIER_DESC_eth_alodia_mod: "İlhak edilen Alodia’nın bütünleşmesi ilerliyor."
 STATIC_MODIFIER_NAME_eth_sudan_mod: "Sudan Üzerinde Egemenlik"
 STATIC_MODIFIER_DESC_eth_sudan_mod: "Tahıl ve altın yüklü kervanlar Sudan ovalarından Nil boyunca durmaksızın tırmanıyor."
 STATIC_MODIFIER_NAME_eth_mamluk_rivalry_mod: "Memlüklerle Rekabet"
 STATIC_MODIFIER_DESC_eth_mamluk_rivalry_mod: "Memlük süvarisiyle kılıç çarpıştıran yayla askerleri gazi savaşçılara dönüştürüldü."
 STATIC_MODIFIER_NAME_eth_patriarchate_mod: "Kıpti Patrikhanesi"
 STATIC_MODIFIER_DESC_eth_patriarchate_mod: "Yayla rahipleri kendi patriklerinin bereket vereceği günü uzun süre beklemişti."
 STATIC_MODIFIER_NAME_eth_protector_mod: "Kıptilerin Koruyucusu"
 STATIC_MODIFIER_DESC_eth_protector_mod: "Koruyucu olarak ün diplomatik ilişkileri iyileştirmeye yardım eder."
 STATIC_MODIFIER_NAME_eth_adal_wars_mod: "Adal Savaşları"
 STATIC_MODIFIER_DESC_eth_adal_wars_mod: "Adal ile sonsuz savaşlardan sağ kalan askerler yaralarını onur madalyaları gibi taşıyor."
 STATIC_MODIFIER_NAME_eth_zeila_mod: "Zeyla Fethedildi"
 STATIC_MODIFIER_DESC_eth_zeila_mod: "Zeyla limanının depolarından Kızıldeniz’in baharatları ve incileri yayla sarayına taşınıyor."
 STATIC_MODIFIER_NAME_eth_harar_mod: "Harar Fethedildi"
 STATIC_MODIFIER_DESC_eth_harar_mod: "Kralın sancağı Harar surlarının üzerinde yükseltildiğinde yayla askerleri kutsal bir şehri kazanan zaferden tek ses olarak söz etti."
 STATIC_MODIFIER_NAME_eth_conquer_adal_mod: "Adal Fethedildi"
 STATIC_MODIFIER_DESC_eth_conquer_adal_mod: "Eski rakibimiz Adal’ın köylerinde bile kralın memurları vergi defterlerini açmaya başladı."
 STATIC_MODIFIER_NAME_eth_somali_coast_mod: "Somali Kıyısı Güvence Altında"
 STATIC_MODIFIER_DESC_eth_somali_coast_mod: "Somali kıyısının limanlarında günlük ve fildişi yüklü gemiler durmaksızın demir atıyor."
 STATIC_MODIFIER_NAME_eth_red_sea_access_mod: "Kızıldeniz’e Erişim"
 STATIC_MODIFIER_DESC_eth_red_sea_access_mod: "Kızıldeniz’e giden uzun süredir kapalı yol artık açık olduğundan yayla tüccarlarının gözleri ufka dönüyor."
 STATIC_MODIFIER_NAME_eth_portuguese_mod: "Portekizlilerle Temas"
 STATIC_MODIFIER_DESC_eth_portuguese_mod: "Goa’dan Portekiz elçileri nadir hediyeler taşıyarak yayla sarayında onurla karşılanıyor."
 STATIC_MODIFIER_NAME_eth_massawa_mod: "Masavva Geliştirildi"
 STATIC_MODIFIER_DESC_eth_massawa_mod: "Masavva limanı ticaret kapısı olarak gelişiyor."
 STATIC_MODIFIER_NAME_eth_firearms_mod: "Ateşli Silahlar Benimsendi"
 STATIC_MODIFIER_DESC_eth_firearms_mod: "Vadilerdeki tüfeklerin ve topların gümbürtüsü mızrak ve kalkan çağının sona erdiğini ilan ediyor."
 STATIC_MODIFIER_NAME_eth_european_trade_mod: "Avrupa ile Ticaret"
 STATIC_MODIFIER_DESC_eth_european_trade_mod: "Masavva limanına çıkan Avrupalı tüccarlar yaylanın altınını ve miskini gümüş sikke karşılığında satın alıyor."
 STATIC_MODIFIER_NAME_eth_modernize_mod: "Ordu Modernleştirildi"
 STATIC_MODIFIER_DESC_eth_modernize_mod: "Yeni tarz üniformalı askerler eski savaş şarkılarını söyleyerek yürüyor."
 STATIC_MODIFIER_NAME_eth_aksum_heritage_mod: "Aksum’un Mirası"
 STATIC_MODIFIER_DESC_eth_aksum_heritage_mod: "Aksum’un dikilitaşlarının önünde duranlar bin yıllık kralların adlarının hâlâ kendi damarlarında aktığını hatırlıyor."
 STATIC_MODIFIER_NAME_eth_reclaim_aksum_mod: "Tigray Canlandırıldı"
 STATIC_MODIFIER_DESC_eth_reclaim_aksum_mod: "Aksum’un eski tarlaları ve pazarları yeniden nefes aldı ve kralın memurları bir kez daha hasadı sayıyor."
 STATIC_MODIFIER_NAME_eth_red_sea_empire_mod: "Kızıldeniz İmparatorluğu Yeniden İnşa Edildi"
 STATIC_MODIFIER_DESC_eth_red_sea_empire_mod: "Kızıldeniz limanlarını birbirine bağlayan ticaret imparatorluğunun yeniden inşasıyla kralın filoları kıyı boyunca yelkenlerini açıyor."
 STATIC_MODIFIER_NAME_eth_horn_unification_mod: "Afrika Boynuzu Birleşti"
 STATIC_MODIFIER_DESC_eth_horn_unification_mod: "Afrika Boynuzu’nun her prensi artık tek bir sarayın törenine göre diz çöküyor."
 STATIC_MODIFIER_NAME_eth_new_solomonic_empire_mod: "Yeni Süleymani İmparatorluk"
 STATIC_MODIFIER_DESC_eth_new_solomonic_empire_mod: "Yeni imparatorluğun tamamlanması ulusal gücü zirvesine taşıdı."
 STATIC_MODIFIER_NAME_eth_jerusalem_mod: "Kudüs Kurtarıldı"
 STATIC_MODIFIER_DESC_eth_jerusalem_mod: "Kudüs’teki Kutsal Kabir’in önünde Etiyopyalı rahipler uzun hac yolculuklarının sonunda ağlıyor."
