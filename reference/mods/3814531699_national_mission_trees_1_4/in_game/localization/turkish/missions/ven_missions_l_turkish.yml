l_turkish:
 VEN_DOGES_PALACE_EVENT_OCCURRED: "“Doge Sarayı’nın Genişletilmesi” olayı gerçekleşti"
 ven_mainland_food_crisis: "Anakara Gıda Krizi"
 ven_mainland_food_crisis_desc: "Bir lagün üzerine kurulan Venedik tahıl tedarikinde anakaraya bağımlıdır. İstikrarlı bir gıda tedarik ağı kur."
 ven_scaliger_war: "Scaligeri Savaşı"
 ven_scaliger_war_desc: "Verona’yı yöneten della Scala ailesini yen ve Treviso ile Vicenza’yı güvenceye al."
 ven_mainland_consolidation: "Anakara Pekiştirmesi"
 ven_mainland_consolidation_desc: "Yeni edinilen anakara topraklarını idari olarak bütünleştir ve soylularla ve yönetim kurumlarıyla ilişkileri istikrara kavuştur."
 ven_terraferma_expansion: "Terraferma’nın Genişlemesi"
 ven_terraferma_expansion_desc: "Verona’yı ve Bergamo’yu fethet ve Terraferma anakara egemenlik alanını daha da genişlet."
 ven_warehouse_expansion: "Depo Genişlemesi"
 ven_warehouse_expansion_desc: "Artan ticaret hacmine uyum sağlamak için Venedik’in depo tesislerini genişlet."
 ven_piazza_san_marco: "San Marco Meydanı’nın Gelişimi"
 ven_piazza_san_marco_desc: "Cumhuriyet’in simgesi San Marco Meydanı’nı soyluların prestijini artırmak için geliştir."
 ven_canal_administration: "Kanal İdaresi"
 ven_canal_administration_desc: "Deniz harekâtının verimliliğini artırmak için Venedik’ten geçen kanal ağını iyileştir."
 ven_fondaco: "Fondaco"
 ven_fondaco_desc: "Yabancı tüccarlar için bir ticaret evleri (fondaco) ağı kur ve ticaret karakollarını genişlet."
 ven_bridge_of_wealth: "Servet Köprüsü"
 ven_bridge_of_wealth_desc: "Kesintisiz bir tüccar dizisi köprüden fondaco’ya doğru geçer. Bu köprünün çevresindeki ticaret mahallesini geliştir ve servet akışını daha da kabart."
 ven_doges_palace: "Doge Sarayı’nın Yenilenmesi"
 ven_doges_palace_desc: "Cumhuriyet’in yönetim sistemini güçlendirmek için Doge’un otoritesinin simgesi Doge Sarayı’nı geliştir."
 ven_doges_palace_event_occurred_tt: "“Doç Sarayı Genişlemesi” kararı kullanıldı"
 ven_arsenal: "Arsenale di Venezia"
 ven_arsenal_desc: "Devlete ait Arsenale tersanesini genişlet ve Cumhuriyet’in deniz üretim kapasitesini dünya lideri düzeylere çıkar."
 ven_marciana_library: "Biblioteca Marciana"
 ven_marciana_library_desc: "Bir kütüphane ve bir üniversiteyle ulusal bir kütüphane kur ve Cumhuriyet’in ilmî prestijini artır."
 ven_lombardy_hegemony: "Lombardiya Üzerinde Hegemonya"
 ven_lombardy_hegemony_desc: "Cumhuriyet sancağı Milano pazarları üzerinde yükselirken tüm Lombardiya’nın tüccarları yeni bir efendi tanıyor."
 ven_settling_with_genoa: "Cenova ile Hesaplaşma"
 ven_settling_with_genoa_desc: "Cenova ile uzun süredir devam eden ticari rekabeti nihai sonucuna ulaştır. Ana limanını ele geçir ya da Cenova’yı haritadan tamamen sil."
 ven_city_of_water: "Suyun Şehri"
 ven_city_of_water_desc: "Venedik lagün şehrini su yolları ve ticaretle örülü, eşsiz refaha sahip bir şehir olarak tamamla."
 ven_secure_ferrara: "Ferrara’yı Güvenceye Alma"
 ven_secure_ferrara_desc: "Este Hanedanı’nın yönettiği Ferrara’yı edin ve Po Nehri vadisinde bir tutunak kazan."
 ven_northern_expansion: "Kuzeye Genişleme"
 ven_northern_expansion_desc: "Alp geçitlerine gözünü dikerek kuzeye genişlemeyi ilerletmek için Trento’yu ve Udine’yi güvenceye al."
 ven_papal_conflict: "Papalık Devletleri ile Çatışma"
 ven_papal_conflict_desc: "Ferrara’nın statüsü yüzünden Papalık Devletleri ile gerilim artıyor. Bu çatışmanın üstesinden gel."
 ven_alpine_trade: "Alpler Aşırı Ticaret"
 ven_alpine_trade_desc: "Alp geçitlerini aşan kervanlar artık tek bir pazara bağlı değil: birden fazla pazar merkezini bağlayan geniş bir ticaret ağı kurmuşlar."
 ven_render_unto_caesar: "Sezar’ın Hakkını Sezar’a Ver"
 ven_render_unto_caesar_desc: "Hem din adamlarının hem burjuvaların güvenini kazanan Cumhuriyet’in otoritesi Ebedî Şehir Roma’da bile sorgulanmaz."
 ven_league_of_cambrai: "Cambrai Birliği’ni Boz"
 ven_league_of_cambrai_desc: "Avrupa güçlerinin oluşturduğu Cambrai Birliği’nin kuşatmasını kır ve Cumhuriyet’in bağımsızlığını savun."
 ven_terraferma_completed: "Terraferma’nın Tamamlanması"
 ven_terraferma_completed_desc: "Terraferma anakara egemenlik alanının yönetim yapısını tamamla ve Cumhuriyet’in otoritesini kuzey İtalya’ya kur."
 ven_italian_unity_route: "La Serenissima"
 ven_italian_unity_route_desc: "İtalyan devletleri arasında önde gelen güç olarak yarımadada yeni bir düzenin merkezi ol."
 ven_fleet_unification: "Filoları Hazırlamak"
 ven_fleet_unification_desc: "Cumhuriyet’in çeşitli filolarının işleyişini bütünleştir ve donanma bakım verimliliğini iyileştir."
 ven_black_sea_insurance: "Karadeniz Ticaretini Sigortalamak"
 ven_black_sea_insurance_desc: "Negroponte’yi üs alarak Karadeniz’e doğru ticaret yollarını eskort altına alan bir sistem kur."
 ven_secure_adriatic: "Adriyatik’i Güvenceye Almak"
 ven_secure_adriatic_desc: "Zara’yı ve Pola’yı güvenceye al ve Adriyatik Denizi’nin denetimini Cumhuriyet’in eline ver."
 ven_expel_genoa_black_sea: "Cenova’yı Karadeniz’den Kovmak"
 ven_expel_genoa_black_sea_desc: "Karadeniz ticaretinin kilit karakolları Kefe’yi ve Tana’yı güvenceye al ve Cumhuriyet’in en büyük rakibi Cenova’nın çıkarlarına el koy."
 ven_aegean_expansion: "Ege’de Genişleme"
 ven_aegean_expansion_desc: "Girit’i ve Naksos’u güvenceye al ve Cumhuriyet’in Ege Denizi’ndeki tutunağını genişlet."
 ven_dalmatian_subjugation: "Dalmaçya’ya Boyun Eğdirme"
 ven_dalmatian_subjugation_desc: "Tüm Hırvat kıyısını güvenceye al ve Dalmaçya bölgesini Cumhuriyet’in yönetimi altına al."
 ven_dominate_eastern_trade: "Doğu Ticaretine Hâkim Ol"
 ven_dominate_eastern_trade_desc: "Karadeniz’in ve doğu Akdeniz’in ticaret yollarını Cumhuriyet’in denetimi altına al ve doğu ticareti üzerinde hâkimiyeti ele geçir."
 ven_greek_bridgehead: "Yunanistan’da Köprübaşı"
 ven_greek_bridgehead_desc: "Girit’i ve Modon’u güvenceye al ve anakara Yunanistan’a ve Ege’ye bir köprübaşı kur."
 ven_pearl_of_adriatic: "Adriyatik’in İncisi’ni Geri Almak"
 ven_pearl_of_adriatic_desc: "Ragusa ticaret şehrinin refahını yeniden kur ve “Adriyatik’in İncisi” olarak bilinen serveti Cumhuriyet’e getir."
 ven_protect_corfu: "Korfu’yu Korumak"
 ven_protect_corfu_desc: "Adriyatik’in girişine hâkim Korfu’ya bir garnizon yerleştir ve güvenliğini sağla."
 ven_occupy_cyprus: "Kıbrıs’ın İşgali"
 ven_occupy_cyprus_desc: "Larnaka’yı güvenceye al ve stratejik açıdan hayati Kıbrıs adasını Cumhuriyet’in toprağı yap."
 ven_second_conquest_of_constantinople: "İstanbul’un İkinci Fethi"
 ven_second_conquest_of_constantinople_desc: "Dördüncü Haçlı Seferi’nin bir zamanlar başardığı gibi İstanbul’u bir kez daha Cumhuriyet’in denetimine al."
 ven_queen_of_the_adriatic: "Adriyatik’in Kraliçesi"
 ven_queen_of_the_adriatic_desc: "Adriyatik boyunca ticaret ve savunma ağını tamamla ve Cumhuriyet’i “Adriyatik’in Kraliçesi” olarak bilinen statüye yükselt."
 ven_pen_not_sword: "Kılıcı Değil, Kalemi Al"
 ven_pen_not_sword_desc: "Cumhuriyet’in doğu Akdeniz’deki çıkarlarını askerî güçle değil diplomasi ve antlaşmalarla güvenceye al ve kalıcı refahı sağla."
 ven_latin_empire: "Latinler İmparatorluğu"
 ven_latin_empire_desc: "İstanbul merkezli yeni bir Latinler İmparatorluğu kur ve Cumhuriyet’in tarihteki yerini Akdeniz’in efendisi olarak işaretle."
 ven_grand_strategy_mission_pack: "Deniz Cumhuriyeti’nin Büyük Stratejisi"
 ven_grand_strategy_mission_pack_desc: "Lagün üzerine kurulan küçük cumhuriyet iki yolda birden yürür: anakaraya genişleme ve bir deniz imparatorluğunun inşası. Terraferma’yı tamamla, Adriyatik’in Kraliçesi ol ve sonunda adını İtalya’nın merkezi olarak ya da Latinler İmparatorluğu’nun varisi olarak tarihe kazı."
 ven_grand_strategy_mission_pack_BUTTON_TOOLTIP:0 "Cumhuriyet’in hegemonyasını hem karada hem denizde kur."
 ven_grand_strategy_mission_pack_DESCRIPTION:0 "Lagün üzerine kurulan küçük cumhuriyet iki yolda birden yürür: anakaraya genişleme ve bir deniz imparatorluğunun inşası. Adriyatik’in Kraliçesi olarak adını Akdeniz tarihine kazı."
 ven_grand_strategy_mission_pack_BUTTON_DETAILS:0 "Terraferma’yı tamamla, Adriyatik’in Kraliçesi ol ve Latinler İmparatorluğu’nun varisi olarak dur: Cumhuriyet’in adını tarihe kazı!"
 ven_grand_strategy_mission_pack_CRITERIA_DESCRIPTION:0 "Venedik olarak Terraferma’yı tamamla ve Adriyatik’in Kraliçesi ol."
 ven_events.1.t: "della Scala’nın Düşüşü"
 ven_events.1.d: "Verona’nın della Scala tiranlarına karşı savaş Venedik zaferiyle sona erer. Treviso ve Vicenza halkı yeni hükümdarlarını karşılar. Anakaraya ilk adım atıldı."
 ven_events.1.a: "Yeni topraklara hoş geldin de"
 ven_events.2.t: "Terraferma’nın Yükselişi"
 ven_events.2.d: "Verona ve Bergamo Cumhuriyet sancağı altında katılır. Lombardiya ovasının zengin tarım arazileri ve ticaret şehirleri Venedik’in ekonomik gücünü daha da güçlendirir."
 ven_events.2.a: "Yeni toprakların ekonomik gelişimini destekle"
 ven_events.3.t: "Doge Sarayı’nın Görkemi"
 ven_events.3.d: "Yeniden inşa edilen Doge Sarayı tamamlandı ve Doge’un otoritesini ve Cumhuriyet’in prestijini somutlaştırıyor. Salonlarında soylular Cumhuriyet’in geleceğini tartışmak için toplanır."
 ven_events.3.a: "Sarayın tamamlanışını kutla"
 ven_events.4.t: "Arsenale’nin Genişlemesi"
 ven_events.4.d: "Devlet tersanesi Arsenale genişletildi ve artık benzeri görülmemiş ölçekte kadırga ve ticaret gemisi üretiyor. Cumhuriyet’in deniz gücü yeni zirvelere ulaşır."
 ven_events.4.a: "Genişleyen Arsenale’yi denetle"
 ven_events.5.t: "Suyun Şehri’nin Tamamlanışı"
 ven_events.5.d: "Kanallar, ticaret evleri, kütüphaneler, tersaneler: lagün üzerine kurulan şehir dünyada eşi görülmemiş bir refaha ulaştı. “Suyun Şehri” adına layık oldu."
 ven_events.5.a: "Suyun Şehri’nin tamamlanışını ilan et"
 ven_events.6.t: "Ferrara Savaşı"
 ven_events.6.d: "Ferrara’nın statüsü yüzünden Papalık Devletleri ile ilişkiler geriliyor. Din adamları Cumhuriyet’in emellerini kınıyor, ama vatandaşlar yeni toprak edinimini memnuniyetle karşılıyor."
 ven_events.6.a: "Papalık Devletleri ile gerilimi ele al"
 ven_events.7.t: "Sezar’ın Hakkını Sezar’a Ver"
 ven_events.7.d: "Cumhuriyet, din adamı ayrıcalığı ile laik ticari faaliyet arasındaki sınırı netleştirdi. Kilise’nin otoritesine saygı gösterilir, ama ticaret ve alışveriş sağlam biçimde Cumhuriyet’in denetiminde kalır."
 ven_events.7.a: "Laik otoritenin kuruluşunu ilan et"
 ven_events.8.t: "Cambrai Birliği’nin Çöküşü"
 ven_events.8.d: "Papa’nın, Kutsal Roma İmparatoru’nun, Fransa’nın ve İspanya’nın oluşturduğu Cambrai Birliği Cumhuriyet’i paylaşmaya çalıştı. Ama iç bölünmeler birliğin çökmesine yol açtı ve Venedik bağımsızlığını korudu."
 ven_events.8.a: "Birliğin çöküşüne tanık ol"
 ven_events.9.t: "Terraferma, Tamamlandı"
 ven_events.9.d: "Kuzey İtalya’nın geniş toprakları nihayet Cumhuriyet’in yönetim sistemine bütünleştirildi. Terraferma şimdi Venedik’in ekonomik ve askerî gücünün sarsılmaz temeli olarak duruyor."
 ven_events.9.a: "Terraferma’nın tamamlanışını kutla"
 ven_events.10.t: "İtalya’nın Merkezi"
 ven_events.10.d: "Hem karada hem denizde güç biriktiren Cumhuriyet artık İtalya yarımadasında salt bölgesel bir güç değil. Diğer devletler Venedik’in her hamlesini izliyor ve yarımadada yeni bir düzen şekillenmeye başlıyor."
 ven_events.10.a: "İtalya’da öncü bir konum kur"
 ven_events.11.t: "Adriyatik’e Açılan Kapı"
 ven_events.11.d: "Zara ve Pola Cumhuriyet’in denetiminde olduğundan Adriyatik’in girişine hâkim kilit konumlar güvence altına alındı. Cumhuriyet’in filoları artık daha güvenli yelken açabilir."
 ven_events.11.a: "Yeni karakolların savunmasını güçlendir"
 ven_events.12.t: "Cenova’nın Karadeniz’den Çekilişi"
 ven_events.12.d: "Cumhuriyet’in uzun süreli rakibi Cenova, Karadeniz ticaretindeki başlıca tutunaklarını kaybetti. Venedikli tüccarlar yeni açılan pazarlara taşınmaya başlıyor."
 ven_events.12.a: "Yeni pazarlara genişlemeyi destekle"
 ven_events.13.t: "Ege’de Bir Tutunak"
 ven_events.13.d: "Girit ve Modon güvence altındayken Ege’ye ve anakara Yunanistan’a bir tutunak kuruldu. Cumhuriyet’in ticaret gemileri bu limanları yol noktası olarak kullanarak doğu yollarını daha da genişletiyor."
 ven_events.13.a: "Yeni yol noktası limanlarını geliştir"
 ven_events.14.t: "Kıbrıs’ın İncisi"
 ven_events.14.d: "Magosa ve Lefkoşa Cumhuriyet’in egemenlik alanına katıldı. Stratejik açıdan hayati Kıbrıs adası baharat, şeker ve pamuk ticaretiyle Cumhuriyet’e daha fazla servet getirir."
 ven_events.14.a: "Kıbrıs’ın ekonomisini geliştir"
 ven_events.15.t: "Bir Kez Daha İstanbul’a"
 ven_events.15.d: "Dördüncü Haçlı Seferi’nden beri ilk kez Venedik İstanbul’un işgalini başardı. Eski paylaşımın hatırası Cumhuriyet’in emellerini bir kez daha harekete geçiriyor."
 ven_events.15.a: "Yeni bir yönetim sistemi kur"
 ven_events.16.t: "Adriyatik’in Kraliçesi"
 ven_events.16.d: "“Adriyatik’in İncisi” denen Ragusa’nın refahı ve Korfu’nun sağlam savunması artık tamam. Cumhuriyet artık Adriyatik’te salt bir güç değil: denizin bizzat efendisi."
 ven_events.16.a: "“Adriyatik’in Kraliçesi” unvanını kabul et"
 ven_events.17.t: "Kalemin Zaferi"
 ven_events.17.d: "Cumhuriyet, Kıbrıs’taki ve çevre bölgedeki çıkarlarını askerî güçle değil diplomasi ve antlaşmalarla güvenceye aldı. “Kılıcı değil, kalemi al”: bu Cumhuriyet’in yeni inancı olur."
 ven_events.17.a: "Diplomatik zaferi kutla"
 ven_events.18.t: "Latinler İmparatorluğu, Yeniden Doğdu"
 ven_events.18.d: "İstanbul merkezli yeni bir Latinler İmparatorluğu kuruldu. Akdeniz’in ticaret yolları, anakaranın tahıl ambarları ve Doğu’nun serveti: hepsi artık Venedik’in elinde. Cumhuriyet, Trakya’yı, Makedonya’yı, Yunan anakarasını, Mora’yı ve Ege adalarını yönetmek üzere başkenti İstanbul olan yeni bir vasal devlet, “Latin İmparatorluğu”, yükseltti ve Adriyatik’in küçük cumhuriyeti artık kendi başına bir imparatorluk olarak duruyor. Senato Cumhuriyet’in yeni imparatorluk statüsünü dünyaya ilan ediyor."
 ven_events.18.a: "Latinler İmparatorluğu’nun kuruluşunu ilan et"
 STATIC_MODIFIER_NAME_ven_grain_reserves: "Tahıl Rezervleri"
 STATIC_MODIFIER_DESC_ven_grain_reserves: "Anakaradan taşınan tahıl lagün şehrini dolduruyor ve halkına rahatlık getiriyor."
 STATIC_MODIFIER_NAME_ven_scaliger_victory: "Scaligeri Savaşı’nda Zafer"
 STATIC_MODIFIER_DESC_ven_scaliger_victory: "Verona’nın tiranlarını kıran askerler önlerindeki anakara seferlerine yeni bir güvenle girer."
 STATIC_MODIFIER_NAME_ven_mainland_order: "Anakarada Düzen"
 STATIC_MODIFIER_DESC_ven_mainland_order: "Yeni edinilen topraklarda bile Cumhuriyet’in yasaları ve idaresi artık sorunsuz işliyor."
 STATIC_MODIFIER_NAME_ven_terraferma_growth: "Terraferma’nın Büyümesi"
 STATIC_MODIFIER_DESC_ven_terraferma_growth: "Terraferma’nın bereketli toprakları Cumhuriyet’e yeni servet getirir."
 STATIC_MODIFIER_NAME_ven_fondaco_supply: "Fondaco Tedarik Ağı"
 STATIC_MODIFIER_DESC_ven_fondaco_supply: "Genişletilen depolar ticaret ağının her köşesinden gelen mallarla sürekli doluyor."
 STATIC_MODIFIER_NAME_ven_san_marco_square: "San Marco Meydanı"
 STATIC_MODIFIER_DESC_ven_san_marco_square: "Yenilenen San Marco Meydanı Cumhuriyet’in prestijini her ziyaretçiye gösterir."
 STATIC_MODIFIER_NAME_ven_canal_efficiency: "Kanal Verimliliği"
 STATIC_MODIFIER_DESC_ven_canal_efficiency: "Tekneler artık iyileştirilen kanallarda her zamankinden daha pürüzsüz süzülüyor."
 STATIC_MODIFIER_NAME_ven_fondaco_network: "Fondaco"
 STATIC_MODIFIER_DESC_ven_fondaco_network: "Ticaret evlerinde toplanan yabancı tüccarlar Cumhuriyet’in pazarlarına yeni bir hayat getirir."
 STATIC_MODIFIER_NAME_ven_bridge_of_wealth_bonus: "Servet Köprüsü"
 STATIC_MODIFIER_DESC_ven_bridge_of_wealth_bonus: "Lagün üzerindeki köprüyü geçen kervanlar yol boyundaki gümrük kapılarında neredeyse hiç durmadan mallarını taşıyor."
 STATIC_MODIFIER_NAME_ven_doges_authority: "Doge’un Otoritesi"
 STATIC_MODIFIER_DESC_ven_doges_authority: "Doge Sarayı’nın görkemi Doge’un söylediği her söze ağırlık verir."
 STATIC_MODIFIER_NAME_ven_arsenal_production: "Arsenale’nin Üretimi"
 STATIC_MODIFIER_DESC_ven_arsenal_production: "Genişletilen Arsenale’de zanaatkârlar gece gündüz kadırga birleştiriyor."
 STATIC_MODIFIER_NAME_ven_marciana_biblioteca: "Biblioteca Marciana"
 STATIC_MODIFIER_DESC_ven_marciana_biblioteca: "Sansovino’nun tasarladığı (1537’de başlandı) Biblioteca Marciana, Petrarca’nın koleksiyonu üzerine kurulu kadim el yazmaları hazinesidir. 1453’te İstanbul’un düşüşünden sonra kaçan bilginlerin getirdiği Yunanca el yazmaları Venedik’te toplandı ve Rönesans’ın batıya yayılmasına büyük katkıda bulundu."
 STATIC_MODIFIER_NAME_ven_lombardy_dominance: "Lombardiya Üzerinde Hâkimiyet"
 STATIC_MODIFIER_DESC_ven_lombardy_dominance: "Milano’nun atölyeleri ve zanaatkârları Cumhuriyet’in yönlendirmesiyle daha çok üretiyor."
 STATIC_MODIFIER_NAME_ven_genoese_settlement: "Cenova ile Hesaplaşma"
 STATIC_MODIFIER_DESC_ven_genoese_settlement: "Cenova’ya karşı rekabet sona erdiğinde Cumhuriyet’in tüccarları müzakerede ve ticarette giderek daha çok tecrübe kazanıyor."
 STATIC_MODIFIER_NAME_ven_queen_of_canals: "Kanalların Kraliçesi"
 STATIC_MODIFIER_DESC_ven_queen_of_canals: "Kanalları dolduran gemiler ve kıyılarını dizen saraylar dünyanın dört bir yanından gelen yolcuları büyülüyor."
 STATIC_MODIFIER_NAME_ven_ferrara_secured: "Ferrara Güvence Altında"
 STATIC_MODIFIER_DESC_ven_ferrara_secured: "Ferrara güvence altındayken Papalık Devletleri ile gerilimler artık Cumhuriyet’i eskisi gibi sarsmıyor."
 STATIC_MODIFIER_NAME_ven_alpine_frontier: "Alp Sınırı"
 STATIC_MODIFIER_DESC_ven_alpine_frontier: "Alp geçitlerini aşan kervanlar artık yolun tehlikelerinden korkmuyor."
 STATIC_MODIFIER_NAME_ven_papal_tension: "Papalık Devletleri ile Gerilim"
 STATIC_MODIFIER_DESC_ven_papal_tension: "Papalıkla gerilim sürüyor, ama Cumhuriyet’in tüccarları yılmadan ticaretlerine devam ediyor."
 STATIC_MODIFIER_NAME_ven_alpine_trade_routes: "Alpler Aşırı Ticaret Yolları"
 STATIC_MODIFIER_DESC_ven_alpine_trade_routes: "Alp geçitlerini aşan kervanlar mallarını taşırken dik dağ yollarından artık korkmuyor."
 STATIC_MODIFIER_NAME_ven_secular_authority: "Laik Otorite"
 STATIC_MODIFIER_DESC_ven_secular_authority: "Katolik bir devlet olmasına rağmen Venedik kilise otoritesini devletin denetimi altına koymaktan çekinmedi. Cumhuriyet din adamlarının atanmasına, kilise mallarının yönetimine ve manastırların disiplinine bile müdahale etti ve aforoz korkusu olmadan Papa ile müzakere etti. Neredeyse bir “kutsal küfür” olan bu laiklik Venedik’e kendine özgü bir esneklik kazandırdı."
 STATIC_MODIFIER_NAME_ven_cambrai_survived: "Cambrai Birliği’nden Sağ Çıkıldı"
 STATIC_MODIFIER_DESC_ven_cambrai_survived: "Kuşatmaya dayanan Cumhuriyet’in askerleri ve diplomatları yenilenmiş bir güvenle duruyor."
 STATIC_MODIFIER_NAME_ven_terraferma_zenith: "Terraferma’nın Zirvesi"
 STATIC_MODIFIER_DESC_ven_terraferma_zenith: "Kuzey İtalya’nın geniş toprakları artık Cumhuriyet’in iradesiyle hareket ediyor."
 STATIC_MODIFIER_NAME_ven_italian_unity_unlock: "İtalya’nın Merkezi Statüsü"
 STATIC_MODIFIER_DESC_ven_italian_unity_unlock: "İtalya yarımadasındaki hiçbir devlet önce Venedik’in tutumunu düşünmeden hareket edemez."
 STATIC_MODIFIER_NAME_ven_unified_fleet: "Birleşik Filo"
 STATIC_MODIFIER_DESC_ven_unified_fleet: "Birleşik filo bir anda yelken açmaya hazır duruyor."
 STATIC_MODIFIER_NAME_ven_black_sea_protection: "Karadeniz Ticaretinin Korunması"
 STATIC_MODIFIER_DESC_ven_black_sea_protection: "Eskortlu konvoylar Negroponte limanından Karadeniz’e doğru güvenle yelken açıyor."
 STATIC_MODIFIER_NAME_ven_adriatic_secured: "Adriyatik Güvence Altında"
 STATIC_MODIFIER_DESC_ven_adriatic_secured: "Zara ve Pola limanları artık Cumhuriyet’in gemileri için güvenli sığınaklar olarak hizmet ediyor."
 STATIC_MODIFIER_NAME_ven_zadar_trade_hub: "Zadar Ticaret Karakolu"
 STATIC_MODIFIER_DESC_ven_zadar_trade_hub: "Yeniden inşa edilen Zadar limanında Adriyatik’i geçen ticaret gemileri yüklerini birbiri ardına boşaltıyor."
 STATIC_MODIFIER_NAME_ven_genoese_rivalry_won: "Cenova Rekabetinde Zafer"
 STATIC_MODIFIER_DESC_ven_genoese_rivalry_won: "Cenova sancağı artık Karadeniz ticaret karakolları üzerinde dalgalanmıyor."
 STATIC_MODIFIER_NAME_ven_aegean_dominance: "Ege Hâkimiyeti"
 STATIC_MODIFIER_DESC_ven_aegean_dominance: "Cumhuriyet’in bayrağını taşıyan gemiler Girit ve Naksos limanlarından sürekli geçiyor."
 STATIC_MODIFIER_NAME_ven_dalmatia_subdued: "Dalmaçya’ya Boyun Eğdirildi"
 STATIC_MODIFIER_DESC_ven_dalmatia_subdued: "Dalmaçya kıyı şeridi artık her haritada Cumhuriyet’in kendi toprağı olarak çiziliyor."
 STATIC_MODIFIER_NAME_ven_eastern_trade_dominance: "Doğu Ticaretine Hâkimiyet"
 STATIC_MODIFIER_DESC_ven_eastern_trade_dominance: "Doğunun baharatları ve ipeği artık doğal olarak Venedik pazarlarından geçiyor."
 STATIC_MODIFIER_NAME_ven_greek_bridgehead_secured: "Yunan Köprübaşı Güvence Altında"
 STATIC_MODIFIER_DESC_ven_greek_bridgehead_secured: "Girit’ten ve Modon’dan Cumhuriyet’in gemileri Yunan denizlerinde daha da doğuya ilerliyor."
 STATIC_MODIFIER_NAME_ven_pearl_prosperity: "İncinin Refahı"
 STATIC_MODIFIER_DESC_ven_pearl_prosperity: "Ragusa pazarları eski canlılığına kavuşmuş olarak yeniden tüccarların sesleriyle yankılanıyor."
 STATIC_MODIFIER_NAME_ven_corfu_garrison: "Korfu Garnizonu"
 STATIC_MODIFIER_DESC_ven_corfu_garrison: "Korfu surlarının tepesindeki garnizon Adriyatik’in kapısını sessizce gözetliyor."
 STATIC_MODIFIER_NAME_ven_cyprus_secured: "Kıbrıs Güvence Altında"
 STATIC_MODIFIER_DESC_ven_cyprus_secured: "Kıbrıs limanlarından gelen şeker ve pamuk Cumhuriyet’in depolarını dolduruyor."
 STATIC_MODIFIER_NAME_ven_latin_empire_foundation: "Latin İmparatorluğu’nun Kuruluşu"
 STATIC_MODIFIER_DESC_ven_latin_empire_foundation: "Latinlerin sancağı bir kez daha İstanbul’un sarayları üzerinde dalgalanıyor. Cumhuriyet’in yönetimi altında birçok inançtan insan sessiz bir barış içinde yaşıyor."
 STATIC_MODIFIER_NAME_ven_adriatic_queen: "Adriyatik’in Kraliçesi"
 STATIC_MODIFIER_DESC_ven_adriatic_queen: "Adriyatik’in hâkimi olarak Cumhuriyet filolarına komuta etmek üzere bir amiral daha atama yetkisi kazanır."
 STATIC_MODIFIER_NAME_ven_diplomatic_mastery: "Diplomasi Ustalığı"
 STATIC_MODIFIER_DESC_ven_diplomatic_mastery: "Cumhuriyet’in elçileri kılıç çekmeden elverişli şartlar elde eder. Cumhuriyet’e karşı yabancı düşmanlık yatışır ve müzakerecileri savaşta avantajlarını büyük bir ustalıkla zorlar."
 STATIC_MODIFIER_NAME_ven_latin_empire_unlock: "Latinler İmparatorluğu"
 STATIC_MODIFIER_DESC_ven_latin_empire_unlock: "Akdeniz’in ticaret yolları, anakaranın tahıl ambarları ve Doğu’nun serveti: hepsi artık Venedik’in elinde."
 ven_italian_unity_unlock_tt: "Venedik İtalyan birliğinin temelini tamamladı. La Serenissima İtalya yarımadasını Adriyatik’ten Alpler’e birleştirir: antik Roma’dan beri ilk kez tüm İtalya tek bir sancak altında yönetiliyor."
 ven_latin_empire_unlock_tt: "Başkenti İstanbul olan Latin İmparatorluğu (LAT), Venedik himayesi altında bir tabi devlet olarak kuruldu."
