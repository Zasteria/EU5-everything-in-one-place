l_turkish:
 geo_georgia_mission_pack: "Altın Post: Kafkasya Krallığı"
 geo_georgia_mission_pack_DESCRIPTION:0 "Bagrationi hanedanı altında Gürcistan Krallığı Kafkasya’nın kavşağında durur. Diyarı birleştir, Kafkasya ve bozkır üzerinde hegemonya iddia et ya da haçlılar olarak Anadolu’ya ve Kutsal Topraklar’a yürü: ve Ortodoksluğun ışığı Doğu’yu aydınlatsın."
 geo_georgia_mission_pack_CRITERIA_DESCRIPTION:0 "Gürcistan’ı yeniden birleştir, Kafkasya’ya hâkim ol ve yeni bir altın çağı gerçekleştirmek için güneye haçlı seferi yap."
 geo_georgia_mission_pack_BUTTON_TOOLTIP:0 "Altın Post’un diyarından Kafkasya’nın hegemonu ol."
 geo_georgia_mission_pack_BUTTON_DETAILS:0 "Kraliçe Tamar’ın şanını yeniden kur: bir dağ krallığından Ortodoks dünyasının koruyucusuna!"
 geo_bagrationi_legacy: "Bagrationi’lerin Mirası"
 geo_bagrationi_legacy_desc: "Bagrationi Hanedanı’nın soyu Kafkasya’ya hükmeder. Bu mirası devral ve yeni bir yönetim çağı başlat."
 geo_royal_succession: "Veraseti Güvenceye Al"
 geo_royal_succession_desc: "Soyluların emellerini ve taht üzerindeki anlaşmazlıkları bastır ve meşru bir yönetim kur."
 geo_reunite_georgia: "Gürcistan’ı Yeniden Birleştir"
 geo_reunite_georgia_desc: "Tiflis, Kutaisi, Ahıska, Batum: Gürcistan’ın parçalanmış eyaletlerini tek bir taç altında birleştir."
 geo_fortify_caucasia: "Kafkasya’yı Tahkim Et"
 geo_fortify_caucasia_desc: "Engebeli dağları bir kale ağıyla sertleştir ve putperestlerin ve fatihlerin akınlarını eşit biçimde püskürt."
 geo_church_of_georgia: "Gürcü Kilisesi"
 geo_church_of_georgia_desc: "Otosefal Gürcü Ortodoks Kilisesi’ni devletin bir sütunu yap ve inanç yoluyla birlik kur."
 geo_royal_court: "Kraliyet Sarayı"
 geo_royal_court_desc: "Tiflis kraliyet sarayını süsle ve onu Kafkasya’da eşsiz bir kültür ve otorite merkezi yap."
 geo_georgian_army: "Gürcü Ordusu"
 geo_georgian_army_desc: "Dağ halklarından toplanmış güçlü bir ordu dövüp onu krallığın kılıcı yap."
 geo_recover_strength: "Gücü Geri Kazan"
 geo_recover_strength_desc: "Tekrarlayan zorluklarla tükenen gücü yeniden kur ve ittifak ve yeniden silahlanma yoluyla yeni bir gelecek aç."
 geo_queen_tamar_ambition: "Kraliçe Tamar’ın Emeli"
 geo_queen_tamar_ambition_desc: "Bir zamanlar Kraliçe Tamar’ın egemenlik alanının parçası olan Ermenistan toprakları: Hıristiyan kardeşlerimizi putperest yönetiminden kurtar ve Tiflis’in otoritesini yeniden kur."
 geo_reclaim_shirvan: "Şirvan’ı Geri Al"
 geo_reclaim_shirvan_desc: "Bir zamanlar Gürcü üstünlüğü altında olan Şirvan’ı geri al ve Hazar Denizi’nde bir tutunak kazan."
 geo_heirs_of_seljuks: "Selçukluların Mirasçıları"
 geo_heirs_of_seljuks_desc: "Doğu topraklarını Selçuklu mirasını devralan güçlerden geri al ve haçın otoritesini bu bölgeye yeniden kur."
 geo_gates_of_alexander: "İskender’in Kapıları"
 geo_gates_of_alexander_desc: "Kafkasya içinden “İskender’in Kapıları” denen geçidi aş ve kuzeyin kabilelerine boyun eğdir."
 geo_bane_of_khagan: "Kağan’ın Belası"
 geo_bane_of_khagan_desc: "Moğolların torunları Ortodoks dünyasını tehdit etmeyi sürdürüyor. Hâkimiyetlerine son ver ve bu belayı ebediyen ortadan kaldır."
 geo_seize_crimea: "Kırım’ı Ele Geçir"
 geo_seize_crimea_desc: "Tatarların son sığınağı Kırım Yarımadası’na boyun eğdir ve Karadeniz üzerindeki egemenliğimizi güvenceye al."
 geo_control_black_sea: "Karadeniz’i Denetle"
 geo_control_black_sea_desc: "Karadeniz kıyısının çoğunu ele geçirdikten sonra bu iç denizi Gürcistan’ın ticaret alanına tamamen bütünleştir."
 geo_envoy_to_tsar: "Çar’a Bir Elçi"
 geo_envoy_to_tsar_desc: "Rus’un hâkim gücü olarak yükselen Çar’a bir elçi gönder ve ittifak yolunu ara."
 geo_caucasus_hegemony: "Kafkasya Hegemonyası"
 geo_caucasus_hegemony_desc: "Dağlar, bozkır ve Karadeniz: tüm Kafkasya üzerinde sarsılmaz bir hegemonyayı tamamla."
 geo_deal_with_trebizond: "Trabzon ile Anlaş"
 geo_deal_with_trebizond_desc: "Kraliçe Tamar’ın yardımıyla kurulan Trabzon İmparatorluğu: bu eski dostla bağı yenile ve birlikte ileriye bir yol seç."
 geo_conquer_jalayirids: "Celayirli Sultanlığı’na Boyun Eğdir"
 geo_conquer_jalayirids_desc: "İlhanlılar’ın çöküşünü izleyen kaosta Celayirli Sultanlığı bu toprakta yükseldi: Moğol mirasının bu mirasçısına boyun eğdir ve Doğu’ya giden yolu aç."
 geo_encroach_mamluks: "Memlüklere Tecavüz Et"
 geo_encroach_mamluks_desc: "Eski haçlıların kaybettiği Kutsal Topraklar: Memlük yönetimindeki Doğu’ya ilerle ve inancın ışığını geri almaya hazırlan."
 geo_conquer_cyprus: "Kıbrıs’ı Fethet"
 geo_conquer_cyprus_desc: "Doğu Akdeniz’in kalesi Kıbrıs’ı ele geçir ve yerel Haçlı güçleriyle birlikte bölge üzerinde hegemonyayı güvenceye al."
 geo_cradle_of_civilization: "Medeniyetin Beşiği"
 geo_cradle_of_civilization_desc: "İnsan medeniyetinin beşiği Mezopotamya’yı Müslüman yönetiminden kurtar ve zenginliklerini Gürcistan için talep et."
 geo_claim_holy_city: "Kutsal Şehir’i Sahiplen"
 geo_claim_holy_city_desc: "Kudüs Sarazen yönetiminde durduğu sürece Hıristiyan dünyasının üzerinde kara bir bulut asılı kalır. Kutsal Şehir’i geri al ve inancın zaferini kanıtla."
 geo_light_of_east: "Doğu’nun Işığı"
 geo_light_of_east_desc: "İskenderiye, Kudüs, Antakya: kadim Doğu patrikhanelerini kurtar ve dünyaya Doğu’nun ışığının sönmediğini göster."
 geo_anatolian_incursion: "Anadolu Akını"
 geo_anatolian_incursion_desc: "Malazgirt’teki yenilgiden beri Anadolu Türk güçlerine düştü: o yenilginin öcünü al ve bu toprağın yeni hegemonu ol."
 geo_empires_downfall: "İmparatorluğun Çöküşü"
 geo_empires_downfall_desc: "Balkanlar’a ve Orta Doğu’ya hâkim olan Osmanlı İmparatorluğu: tüm Hıristiyan dünyasına yönelik bu tehdidi tarih sayfalarına gönder."
 geo_throne_of_romans: "Romalılar’ın Tahtı"
 geo_throne_of_romans_desc: "Büyük İstanbul şehri uzun süredir putperest ellerde yatıyor. Bu mücevheri kurtar ve Roma tahtını bir Gürcü İmparator olarak al."
 geo_beacon_of_christendom: "Hıristiyan Dünyasının Feneri"
 geo_beacon_of_christendom_desc: "Ortodoksluğun gücünü yeniden kuran diyarımız, takvamızı ve Tanrı’nın verdiği doğruluğumuzu dünyaya kanıtlama vakti geldi: krallığımızı Hıristiyan dünyasının birleşik cenneti yap."
 geo_georgian_crusader_realm: "Gürcü Haçlı Diyarı"
 geo_georgian_crusader_realm_desc: "Kafkasya’dan Akdeniz’e: haçın altında inşa edilen bu büyük imparatorluk Kraliçe Tamar’ın hayalinin gerçekleşmesidir."
 geo_rebuild_tbilisi: "Tiflis’i Yeniden İnşa Et"
 geo_rebuild_tbilisi_desc: "Tekrarlayan yabancı istilalarıyla yıpranmış başkentimiz Tiflis: eski görkemini yeniden kurmaya koyul."
 geo_georgian_vineyards: "Gürcü Bağları"
 geo_georgian_vineyards_desc: "Binlerce yıla yayılan Gürcistan’ın şarap yapma geleneği: bu gururlu sanayinin dünyaca tanınmasını sağla."
 geo_revive_literature: "Yerli Edebiyatı Canlandır"
 geo_revive_literature_desc: "Asomtavruli, Nuskhuri, Mkhedruli: Gürcü mirasını taşıyan üç yazı. Bu kültürü canlandır ve dilini ve yazısını tüm Kafkasya’ya yay."
 geo_legacy_of_builder: "İnşaatçı’nın Mirası"
 geo_legacy_of_builder_desc: "İnşaatçı David’in saltanatını izleyerek şehirlerimize şöhret, servet ve önem kazandır."
 geo_svetitskhoveli_cathedral: "Svetitskhoveli Katedrali"
 geo_svetitskhoveli_cathedral_desc: "Canlı Sütun Katedrali, Gürcü Apostolik Kilisesi’nin kalbi: onu hiç olmadığı kadar büyük bir görkemle yeniden inşa et."
 geo_patriarchate_of_georgia: "Tüm Gürcistan Patrikhanesi"
 geo_patriarchate_of_georgia_desc: "Devletin nüfuzu büyüdükçe otosefal Gürcü Kilisesi’ni bir patrikhane statüsüne yükseltme çağrısı da büyür."
 geo_silk_road_trade: "İpek Yolu Ticareti"
 geo_silk_road_trade_desc: "İpek Yolu boyunca Doğu ile Batı’yı bağlayan bir kavşak olarak Gürcistan’ın şehirlerini ticaret servetiyle doldur."
 geo_mountain_fortresses: "Dağ Kaleleri"
 geo_mountain_fortresses_desc: "Kafkasya’nın engebeli arazisinden yararlan ve her orduyu durdurabilecek bir kale ağını tamamla."
 geo_golden_age: "Altın Çağın Tamamlanışı"
 geo_golden_age_desc: "Kraliçe Tamar ve İnşaatçı David’in inşa ettiği altın çağ: şanını benzeri görülmemiş yüksekliklere çıkar."
 geo_events.1.t: "Sarai’nin Düşüşü"
 geo_events.1.d: "Moğol ardıl devletinin başkenti Sarai elimize düştü. Bir zamanlar Ortodoks dünyasını sarsan Kağan’ın otoritesi artık geçmişe ait."
 geo_events.1.a: "Kağan’ın Belası sona erdi!"
 geo_events.2.t: "İstanbul’un Düşüşü"
 geo_events.2.d: "Büyük imparatorluk şehri İstanbul nihayet elimize düştü. Gürcü sancağı artık bir zamanlar kâfirin elinde olan bu şehrin üzerinde dalgalanıyor: Kafkasya Kralı Roma’nın varisi unvanını iddia ediyor."
 geo_events.2.a: "Roma İmparatorluğu çok yaşasın! Gürcü İmparator çok yaşasın!"
 geo_events.99.t: "Altın Çağın İlanı"
 geo_events.99.d: "Kafkasya’dan Akdeniz’e: Kraliçe Tamar’ın bir zamanlar hayal ettiği altın çağ artık tamam. Küçük bir dağ krallığı Ortodoks dünyasını aydınlatan büyük bir imparatorluk olarak yeniden doğdu."
 geo_events.99.a: "Gürcistan’a şeref! Altın Çağ çok yaşasın!"
 STATIC_MODIFIER_NAME_geo_bagrationi_mod: "Bagrationi’lerin Görkemi"
 STATIC_MODIFIER_DESC_geo_bagrationi_mod: "Kraliyet soyu devlete prestij ve meşruiyet kazandırır."
 STATIC_MODIFIER_NAME_geo_succession_mod: "İstikrarlı Veraset"
 STATIC_MODIFIER_DESC_geo_succession_mod: "Kraliyet veraseti istikrarlı ve iç huzursuzluk yatıştı."
 STATIC_MODIFIER_NAME_geo_reunite_mod: "Gürcistan Yeniden Birleşti"
 STATIC_MODIFIER_DESC_geo_reunite_mod: "Parçalanmış eyaletler bir kez daha tek bir taç altında birleşti."
 STATIC_MODIFIER_NAME_geo_fortify_mod: "Kafkas Kale Ağı"
 STATIC_MODIFIER_DESC_geo_fortify_mod: "Kafkas geçitlerinin zirvelerinde yükseltilen taş kaleler istilacının gölgesini uzaktan gözetliyor."
 STATIC_MODIFIER_NAME_geo_church_mod: "Gürcü Kilisesi"
 STATIC_MODIFIER_DESC_geo_church_mod: "Ortodoks Kilisesi artık devletin bir sütunu olarak işlev görüyor ve inanç yoluyla birlik kuruyor."
 STATIC_MODIFIER_NAME_geo_court_mod: "Kraliyet Sarayının Görkemi"
 STATIC_MODIFIER_DESC_geo_court_mod: "Tiflis kraliyet sarayı Kafkasya’da kültürün ve otoritenin merkezi olarak parlıyor."
 STATIC_MODIFIER_NAME_geo_army_mod: "Gürcü Ordusu"
 STATIC_MODIFIER_DESC_geo_army_mod: "Dağ halklarından toplanmış güçlü bir ordu tamam ve krallığın kılıcı olarak hizmet ediyor."
 STATIC_MODIFIER_NAME_geo_recover_mod: "Güç Geri Kazanıldı"
 STATIC_MODIFIER_DESC_geo_recover_mod: "İttifak ve yeniden silahlanma yoluyla krallık yeni bir geleceğe doğru adım attı."
 STATIC_MODIFIER_NAME_geo_tamar_mod: "Kraliçe Tamar’ın Emeli"
 STATIC_MODIFIER_DESC_geo_tamar_mod: "Ermeni kardeşlerimiz kurtarıldı ve Tiflis’in otoritesi artık doğuya uzanıyor."
 STATIC_MODIFIER_NAME_geo_shirvan_mod: "Şirvan Geri Alındı"
 STATIC_MODIFIER_DESC_geo_shirvan_mod: "Hazar Denizi’nde bir tutunak güvence altına alındı ve doğu ticaretinin serveti akıyor."
 STATIC_MODIFIER_NAME_geo_seljuk_mod: "Selçukluların Mirasçıları"
 STATIC_MODIFIER_DESC_geo_seljuk_mod: "Selçuklu mirasını devralan güçler geri püskürtüldü ve haçın otoritesi Doğu’ya döndü."
 STATIC_MODIFIER_NAME_geo_gates_mod: "İskender’in Kapıları"
 STATIC_MODIFIER_DESC_geo_gates_mod: "Kuzey geçitlerini aşan kuvvetler Kafkasya’nın kuzeyindeki kabilelere boyun eğdirdi."
 STATIC_MODIFIER_NAME_geo_crimea_mod: "Kırım Ele Geçirildi"
 STATIC_MODIFIER_DESC_geo_crimea_mod: "Tatarların son sığınağına boyun eğdirildi ve Karadeniz boyunca ticaret yolları açıldı."
 STATIC_MODIFIER_NAME_geo_black_sea_mod: "Karadeniz’in Denetimi"
 STATIC_MODIFIER_DESC_geo_black_sea_mod: "Karadeniz kıyısının çoğu artık Gürcistan’ın ticaret alanına bütünleşti."
 STATIC_MODIFIER_NAME_geo_tsar_mod: "Çar ile İttifak"
 STATIC_MODIFIER_DESC_geo_tsar_mod: "Rus’un hâkim gücüyle ilişkiler kuruldu ve diplomatik ağımızı genişletti."
 STATIC_MODIFIER_NAME_geo_hegemony_mod: "Kafkasya Hegemonyası"
 STATIC_MODIFIER_DESC_geo_hegemony_mod: "Dağlar, bozkır ve Karadeniz: tüm Kafkasya üzerinde hegemonya tamam."
 STATIC_MODIFIER_NAME_geo_trebizond_mod: "Trabzon ile Anlaşma"
 STATIC_MODIFIER_DESC_geo_trebizond_mod: "Eski dostumuzla bağ yenilendi ve iki diyar arasındaki ticaret gelişiyor."
 STATIC_MODIFIER_NAME_geo_jalayirid_mod: "Celayirli Sultanlığı’na Boyun Eğdirildi"
 STATIC_MODIFIER_DESC_geo_jalayirid_mod: "Celayirli tehdidi ortadan kaldırıldı ve ordumuzun gücünü kanıtladı."
 STATIC_MODIFIER_NAME_geo_mamluk_mod: "Memlüklere Tecavüz"
 STATIC_MODIFIER_DESC_geo_mamluk_mod: "Doğuya ilerletilen haç sancağı çöl ufkunda bile dalgalanıyor ve diğer inançların kralları adını duydu."
 STATIC_MODIFIER_NAME_geo_cyprus_mod: "Kıbrıs Fethedildi"
 STATIC_MODIFIER_DESC_geo_cyprus_mod: "Kıbrıs limanlarına demirleyen Gürcü ticaret gemileri doğu Akdeniz’in baharatlarını yüklüyor."
 STATIC_MODIFIER_NAME_geo_mesopotamia_mod: "Medeniyetin Beşiği"
 STATIC_MODIFIER_DESC_geo_mesopotamia_mod: "Dicle ile Fırat’ın bereketli kıyılarından yün ve boyalar Gürcistan’ın atölyelerine taşınıyor."
 STATIC_MODIFIER_NAME_geo_holy_city_mod: "Kutsal Şehir Sahiplenildi"
 STATIC_MODIFIER_DESC_geo_holy_city_mod: "Kudüs’ün geri alınması Kilise’nin otoritesini ve halkın bağlılığını yükseltti."
 STATIC_MODIFIER_NAME_geo_light_east_mod: "Doğu’nun Işığı"
 STATIC_MODIFIER_DESC_geo_light_east_mod: "Doğu patrikhanelerinin kurtarılması ordunun morali ve onurunu yükseltti."
 STATIC_MODIFIER_NAME_geo_anatolia_mod: "Anadolu Akını"
 STATIC_MODIFIER_DESC_geo_anatolia_mod: "Bir kez daha Malazgirt sahasında duran Gürcü askerleri eski aşağılanmanın öcünü almış olmanın gururuyla saf hâlinde yürüyor."
 STATIC_MODIFIER_NAME_geo_downfall_mod: "İmparatorluğun Çöküşü"
 STATIC_MODIFIER_DESC_geo_downfall_mod: "Osmanlı tehdidinden kurtulan Tiflis sarayında birçok ulusun elçileri Gürcistan Kralı’nın önünde eğiliyor."
 STATIC_MODIFIER_NAME_geo_beacon_mod: "Hıristiyan Dünyasının Feneri"
 STATIC_MODIFIER_DESC_geo_beacon_mod: "İnancın koruyucusu denen Gürcistan Kralı’nın adı aynı haçı taşıyan ulusların saraylarında saygıyla anılıyor."
 STATIC_MODIFIER_NAME_geo_tbilisi_mod: "Tiflis Yeniden İnşa Edildi"
 STATIC_MODIFIER_DESC_geo_tbilisi_mod: "Kraliyet başkenti Tiflis eski görkemini geri kazanıyor."
 STATIC_MODIFIER_NAME_geo_vineyards_mod: "Gürcü Bağları"
 STATIC_MODIFIER_DESC_geo_vineyards_mod: "Kakheti vadilerini bin yıl boyunca kil qvevri küplerinde yaşlandırılan şarabın kokusu dolduruyor."
 STATIC_MODIFIER_NAME_geo_literature_mod: "Yerli Edebiyat Canlandı"
 STATIC_MODIFIER_DESC_geo_literature_mod: "Mkhedruli yazısının yayılması ilmi ve yönetimi ilerletti."
 STATIC_MODIFIER_NAME_geo_builder_mod: "İnşaatçı’nın Mirası"
 STATIC_MODIFIER_DESC_geo_builder_mod: "İnşaatçı David’in iradesini sürdüren şehirlerimiz refaha giden yolda yürüyor."
 STATIC_MODIFIER_NAME_geo_cathedral_mod: "Svetitskhoveli Katedrali"
 STATIC_MODIFIER_DESC_geo_cathedral_mod: "Canlı Sütun Katedrali yeniden inşa edildi ve bir inanç merkezi olarak görkemini geri kazandı."
 STATIC_MODIFIER_NAME_geo_patriarchate_mod: "Tüm Gürcistan Patrikhanesi"
 STATIC_MODIFIER_DESC_geo_patriarchate_mod: "Gürcü Kilisesi bir patrikhaneye yükseltildi ve otoritesi geniş çapta tanınıyor."
 STATIC_MODIFIER_NAME_geo_silk_road_mod: "İpek Yolu Ticareti"
 STATIC_MODIFIER_DESC_geo_silk_road_mod: "Doğu-Batı ticaretinin bir kavşağı olarak Gürcistan’ın şehirleri servetle taşıyor."
 STATIC_MODIFIER_NAME_geo_mountain_fort_mod: "Dağ Kale Ağı"
 STATIC_MODIFIER_DESC_geo_mountain_fort_mod: "Kafkasya’nın arazisi üzerine kurulan bir kale ağı her büyük orduyu durdurabilir."
 STATIC_MODIFIER_NAME_geo_golden_age_mod: "Altın Çağın Tamamlanışı"
 STATIC_MODIFIER_DESC_geo_golden_age_mod: "Kraliçe Tamar ve İnşaatçı David’in inşa ettiği altın çağ yeni zirvelere ulaştı."
 STATIC_MODIFIER_NAME_geo_constantinople_fall_mod: "İmparatorluk Bizans’ın Mirası"
 STATIC_MODIFIER_DESC_geo_constantinople_fall_mod: "Bin yıllık şehrin diplomatik ve idari mekanizması ele geçirildi. Roma’nın bürokrasisini ve diplomatik törenini devralarak tebaamız daha sadık hâle geliyor ve ilhak süreci daha sorunsuz ilerliyor."
 STATIC_MODIFIER_NAME_geo_golden_age_declaration_mod: "Altın Çağın Yönetim Ağı"
 STATIC_MODIFIER_DESC_geo_golden_age_declaration_mod: "Kafkasya’dan Akdeniz’e uzanan büyük bir imparatorluk kraliyet yolları ve yerel valiler ağıyla birbirine bağlı. Kraliçe Tamar ve İnşaatçı David’in kurduğu refah tacın ışığını en uzak eyaletlere taşıyor ve hanedanın meşruiyetini ve prestijini sarsılmaz kılıyor."
