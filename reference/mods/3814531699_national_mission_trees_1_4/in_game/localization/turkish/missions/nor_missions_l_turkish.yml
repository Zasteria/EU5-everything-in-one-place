l_turkish:
 nor_kongedommen_mission_pack: "Kongeriket Norge: Norveç’in Şanı"
 nor_kongedommen_mission_pack_DESCRIPTION:0 "1337’de Norveç, Danimarka’nın nüfuzu altında kalmaya devam ederken Kral Magnus Eriksson yönetiminde İsveç ile şahsi birliktedir. Vikinglerin mirasçıları olarak Danimarka’dan kurtul ve İskandinavya’yı birleştir. Bergen’in balıkçılığı, Kuzey Denizi hâkimiyeti, İzlanda ve Grönland’daki koloniler ve Vinland’a büyük sefer aracılığıyla, ve inanç tercihiyle (Katolik, Lutherci veya Norse), Norveç İmparatorluğu’nu inşa et."
 nor_kongedommen_mission_pack_CRITERIA_DESCRIPTION:0 "Norveç olarak bağımsızlığı, birliği, Kuzey Atlantik hâkimiyetini ve sömürge imparatorluğunu başararak Norveç İmparatorluğu’nu kur."
 nor_kongedommen_mission_pack_BUTTON_TOOLTIP:0 "Norveç İmparatorluğu’nu inşa etmek için görevleri tamamla."
 nor_kongedommen_mission_pack_BUTTON_DETAILS:0 "Viking mirasçılarının gururuyla Norveç’i bir İmparatorluğa dönüştür!"
 nor_kingdom_of_norway: "Norveç Krallığı"
 nor_kingdom_of_norway_desc: "1337’de Norveç, Kral Magnus Eriksson yönetiminde İsveç ile şahsi birliktedir; Danimarka nüfuzu ise Kuzey’i sürekli tehdit eder. Vikinglerin mirasçıları olarak kraliyet meşruiyetini güçlendir ve bağımsız bir Norveç krallığının temellerini pekiştir."
 nor_control_denmark: "Danimarka’yı Denetle"
 nor_control_denmark_desc: "Danimarka Norveç’in en büyük tehdidi ve tarihî rakibidir. Kopenhag’ı işgal etmek ya da Danimarka’yı bir Norveç tabisi yapmak Kalmar Birliği’nin liderliğini Norveç’e aktarır."
 nor_sweden_union: "İsveç ile Şahsi Birlik"
 nor_sweden_union_desc: "Kuzey İskandinavya’nın tüm gücünün Norveç altında toplanması için İsveç ile şahsi birliği güçlendir ve sürdür. Kral Magnus’un saltanatını sürdür ve bu ittifakı İskandinav birliğinin temeli yap."
 nor_unite_scandinavia: "İskandinavya’yı Birleştir"
 nor_unite_scandinavia_desc: "Danimarka denetlendi, İsveç şahsi birlikte: tüm İskandinavya Norveç sancağı altında birleşti. Viking çağından beri kuzey dünyasının tek bir kral altında yönetildiği tarihî an burada."
 nor_sound_toll: "Sound Geçiş Ücreti"
 nor_sound_toll_desc: "Danimarka yenilince Öresund Boğazı Norveç denetimine girer. Sound Geçiş Ücreti toplamak muazzam gelir sağlar."
 nor_develop_stockholm: "Stokholm’ü Geliştir"
 nor_develop_stockholm_desc: "İsveç şahsi birliği aracılığıyla Stokholm’ü Norveç İmparatorluğu’nun doğu idari merkezi olarak geliştir."
 nor_secure_bergen: "Bergen’i Güvenceye Al"
 nor_fleet_of_norway: "Norveç Filosu"
 nor_fleet_of_norway_desc: "Vikinglerin torunları olan Norveçliler bir deniz halkıdır. Bergen merkezli güçlü bir filo inşa etmek Kuzey Denizi’nde, Kuzey Atlantik’te ve Baltık’ta konuşlanma kapasitesi kurar."
 nor_north_sea_markets: "Kuzey Denizi Pazarları"
 nor_north_sea_markets_desc: "Norveç, Kuzey Denizi’ne bakan coğrafi avantajından yararlanarak ticareti geliştirir. Aylık gelir 100+ ve birden fazla pazar merkeziyle Norveç’i Kuzey Denizi ticaretinde büyük bir aktör olarak kur."
 nor_iceland_colony: "İzlanda’yı Denetle"
 nor_iceland_colony_desc: "İzlanda 874’te Norveçliler tarafından iskân edildi: Norveç kültürünün denizaşırı üssü. Birden fazla İzlanda konumuna sahip olmak Kuzey Atlantik köprübaşını tamamlar ve Grönland’ı ve Vinland’ı erişim içine sokar."
 nor_greenland_expedition: "Grönland Seferi"
 nor_greenland_expedition_desc: "985’te Kızıl Erik (Eiríkr rauði) Grönland’da bir koloni kurdu. Batı kıtasına doğru ilk adımı at ve efsanevi Vinland’a giden yolu aç."
 nor_vinland: "Vinland"
 nor_orkney_shetland: "Orkney ve Shetland"
 nor_orkney_shetland_desc: "Orkney ve Shetland adaları Viking çağından beri Norveç nüfuzu altındadır. Bu stratejik adaları güvenceye almak Kuzey Denizi’ne ve Britanya Adaları’na doğru konuşlanma kapasitesini çarpıcı biçimde iyileştirir."
 nor_conquer_scotland: "İskoçya’yı Fethet"
 nor_conquer_scotland_desc: "İskoçya’nın batı kıyısı ve Hebridler bir zamanlar Vikinglerin hâkimiyetindeydi. Edinburgh’u ve Hebridler’i ele geçirmek Danelaw’ın başkenti York’a giden yolu açar."
 nor_invade_england: "İngiltere’yi İstila Et"
 nor_invade_england_desc: "York bir zamanlar Jórvík Viking krallığının başkentiydi. York’u işgal eden Norveç kuvvetleri Danelaw’ın hatırasını modern çağda canlandırır."
 nor_kingdom_of_britain: "Britanya Krallığı"
 nor_master_of_north_sea: "Kuzey Denizi’nin Efendisi"
 nor_master_of_north_sea_desc: "Kuzey Denizi pazarları güvence altında, Orkney ve Shetland ele geçirildi: Norveç Kuzey Denizi’nin tartışmasız efendisidir. Filo 50+ ve gelir 200+ ile Norveç sancağı tüm Kuzey Denizi’nde dalgalanır."
 nor_secure_nidaros: "Nidaros’u Güvenceye Al"
 nor_fisheries: "Balıkçılığı Geliştir"
 nor_fisheries_desc: "Norveç Avrupa’nın en büyük balıkçı ulusudur. Morina, ringa ve somon Kuzey Atlantik’i bolca doldurur. Bu ulusun balıkçılığını tamamen geliştir ve Kuzey Denizi’ne ve Baltık’a toplu ihracat için bir sistem kur."
 nor_timber_industry: "Kereste Sanayisi"
 nor_arctic_trade: "Arktik Ticaret"
 nor_develop_oslo: "Oslo’yu Geliştir"
 nor_absolutism: "Mutlakiyet"
 nor_absolutism_desc: "Norveç’te mutlak monarşiyi kur. Kraliyet otoritesini yükseltmek ve meşruiyeti güçlendirmek merkezi imparatorluk yönetiminin temelini hazırlar."
 nor_northern_economy: "Kuzey Ekonomisi"
 nor_northern_economy_desc: "Arktik ticaret ve mutlak monarşinin ekonomik reformları: Norveç ekonomisi Kuzey Avrupa’nın en yüksek seviyesine ulaşır. Bunu aylık gelir 300+ ve birden fazla pazar merkeziyle kanıtla."
 nor_religious_question: "İnanç Meselesi"
 nor_religious_question_desc: "Reform fırtınası Norveç’e girdi. Nidaros Katedrali’nin din adamları Roma’ya bağlılık için haykırıyor. Ama giderek daha çok kişi Luther’in yeni öğretileriyle yankılanıyor. Ve bazıları kadim tanrılara dönmeyi düşlüyor. Norveç kralının seçimi bu kuzey krallığının ruhunu belirleyecek."
 nor_catholic_norway: "Katolik Norveç"
 nor_catholic_norway_desc: "Norveç Krallığı Roma Kilisesi’ne bağlılığını sürdürür. Nidaros Katedrali ile simgelenen kuzey Katolikliği geleneğini koruyarak Papa ile yakın bağlar yoluyla Norveç’i kuzey Katolik uygarlığının koruyucusu yap."
 nor_northern_crusade: "Kuzey Haçlı Seferi"
 nor_northern_crusade_desc: "Norveç, Hıristiyan dünyasının kuzey kalkanı olarak kutsal savaşa katılır. İnançsızla savaş aracılığıyla Norveç’in dinî otoritesi ve prestiji büyür."
 nor_papal_champion: "Papa’nın Şampiyonu"
 nor_papal_champion_desc: "Papalıkla derin güven ve Lübeck’in denetimi: Norveç kuzey Katolik uygarlığının en güçlü koruyucusu olarak sarsılmaz bir konum kurdu."
 nor_reformation: "Reform"
 nor_reformation_desc: "Norveç Lutherciliği (ya da Kalvinizmi) kabul eder. Kilise malları tacı geçer ve devlet maliyesini güçlendirir."
 nor_protestant_church: "Protestan Kilisesi"
 nor_protestant_church_desc: "Lutherci ilahiyatçılar yetiştirmek için üniversiteler geliştir ve Protestan inancını tüm Norveç’e yerleştir."
 nor_protestant_empire: "Protestan İmparatorluk"
 nor_protestant_empire_desc: "Lutherçilik İskandinavya’ya nüfuz eder. Norveç kralı Protestan dünyasının kuzey şampiyonu olarak hüküm sürer."
 nor_norse_revival: "Norse Canlanışı"
 nor_norse_revival_desc: "Atalarının tanrıları, Odin, Thor, Freyr, yeniden doğuyor. Hıristiyanlaşmadan önceki İskandinavya’nın biçimi modern çağda yeniden yaratılıyor. Norveç kralı Norse tanrılarının temsilcisi olarak hüküm sürer."
 nor_berserker_fleet: "Berserker Filosu"
 nor_berserker_fleet_desc: "Viking çağının berserker ruhu donanmaya yerleşir. Norse tanrılarına adanmış deniz savaşçıları gayrimüslimlerin kıyılarını yağmalamak için korsan olarak salıverilir."
 nor_ragnarok_empire: "Ragnarök İmparatorluğu"
 nor_ragnarok_empire_desc: "Ragnarök’ten sonra gelen yeni dünya gibi Norveç, kadim tanrıların lütfuyla bir kuzey imparatorluğu olarak yeniden doğar. İmparatorluk rütbesi ve doğrudan 500+ konumla bu şanı ele geçir."
 nor_bane_of_hansa: "Hansa’nın Belası"
 nor_bane_of_hansa_desc: "Hansa Birliği Bergen’deki Bryggen (Alman Rıhtımı) aracılığıyla Norveç ticaretine hâkim olmuştur. Norveçli tüccarlar kendi ticaret yollarını geri alabilsin diye Lübeck’i denetle ya da Hansa Birliği’ni dağıt."
 nor_baltic_access: "Baltık’a Erişim"
 nor_baltic_access_desc: "Stralsund’u ele geçirmek Norveç’e Baltık Denizi’ne doğrudan erişim verir. Böylece Norveç hem Kuzey Denizi’ni hem Baltık’ı denetleyen Kuzey Avrupa’nın en büyük deniz ulusu olur."
 nor_hanseatic_expulsion: "Hansa Tüccarlarını Kov"
 nor_hanseatic_expulsion_desc: "Hansa Birliği dağıldığında ve Bergen geliştirildiğinde Norveç, Bergen’i Alman tüccar hâkimiyetinden tamamen kurtardı. Norveçli tüccarlar kendi limanlarının efendisidir."
 nor_control_north_sea_trade: "Kuzey Denizi Ticaretine Hâkim Ol"
 nor_control_north_sea_trade_desc: "Kuzey Denizi pazarları güvence altında ve Hansa Birliği ezilmiş: Norveç tüm Kuzey Denizi ticaret yolunda inisiyatifi ele geçirir. Gelir 300+ ve filo 40+ ile hâkimiyeti kur."
 nor_north_sea_empire: "Kuzey Denizi İmparatorluğu"
 nor_north_sea_empire_desc: "Lübeck dahil tüm Kuzey Denizi kıyısını denetleyen Norveç Kuzey Denizi İmparatorluğu’nu inşa etti. Büyük Knut’un Kuzey Denizi İmparatorluğu modern çağda yeniden doğar."
 nor_develop_stavanger: "Stavanger’ı Geliştir"
 nor_amber_trade: "Kehribar Ticareti"
 nor_amber_trade_desc: "Baltık kehribarı Norveç’in Kuzey Denizi ticaret ağı aracılığıyla tüm Avrupa’ya ihraç edilir. “Kuzey’in Altını” Norveç gelirini daha da genişletir."
 nor_integrate_finland: "Finlandiya’yı Bütünleştir"
 nor_integrate_finland_desc: "İsveç şahsi birliği aracılığıyla Finlandiya’yı Norveç İmparatorluğu’nun bir parçası olarak bütünleştir. Åbo’ya ve Uleåborg’a doğrudan sahip olmak diyarı Kuzey Atlantik’ten Barents Denizi’ne uzatır."
 nor_engelbrekt: "Engelbrekt’in Ruhu"
 nor_engelbrekt_desc: "Engelbrekt isyanının ruhu Norveç’e yayıldı. Köylülerin desteği ve bağımsızlık için sağlam kararlılıkla kuzeyin özgür adamları geleneğini bünyende topla."
 nor_develop_hammerfest: "Hammerfest’i Geliştir"
 nor_develop_hammerfest_desc: "Hammerfest dünyanın en kuzeydeki şehirlerinden biridir. Bu Arktik ticaret karakolunu bir şehir olarak geliştirmek kalıcı bir Arktik ticaret merkezi kurar."
 nor_karoliner: "Norveç Seçkin Ordusu"
 nor_karoliner_desc: "Yüksek askerî gelenekle desteklenen bir Norveç seçkin ordusu tamamlandı. Norveç İmparatorluğu’nun askerî gücü, savunma için dağlık araziden ve güçlü bir saldırıdan yararlanarak, kendini gösterir."
 nor_great_power: "Kuzey’in Büyük Gücü"
 nor_great_power_desc: "Mutlak monarşi ve gelişmiş balıkçılık ile sanayi: Norveç Kuzey Avrupa’da büyük bir güç olarak ortaya çıkar. Bu konumu 200+ konum, gelir 250+ ve prestij 60+ ile kur."
 nor_colonization: "Norveç Sömürge İmparatorluğu"
 nor_stormakt: "Stormakt: Kuzey’in Büyük Gücü"
 nor_stormakt_desc: "İskandinavya birleşti, Kuzey Denizi İmparatorluğu inşa edildi, Kuzey Ekonomisi başarıldı: üç sütun hizalanır ve Norveç Kuzey Avrupa’nın Stormakt’ı (Büyük Gücü) olarak hüküm sürer. 600+ konum, 600+ gelir ve 80+ prestijle bu şanı ele geçir."
 nor_norwegian_empire: "Norveç İmparatorluğu"
 nor_norwegian_empire_desc: "İzlanda’dan Vinland’a, Nidaros’tan Britanya’ya: Norveç İmparatorluğu tamam. Vikinglerin torunları atalarının hayallerini bile aştı. Büyük Knut’un bile hayal etmediği ölçekte bir imparatorluk burada doğuyor. “Kuzey Denizi bir kez daha Norveç’in gölü”: tarihçiler böyle yazacak."
 nor_events.30.t: "İskandinav Birliği: Norveç Gücünün Şafağı"
 nor_events.30.d: "Danimarka denetlendi, İsveç birleşti: tüm İskandinavya Norveç sancağı altında birleşti. Viking çağından beri kimsenin başaramadığı bu başarı nihayet gerçekleşti. Nidaros Katedrali’nin çanları çalıyor ve Norveç Kralı burada “İskandinavya Kralı” unvanını ilan ediyor."
 nor_events.30.a: "İskandinavya çok yaşasın! Norveç ilelebet!"
 nor_events.40.t: "İnancın Kavşağı: Norveç’in Dinî Tercihi"
 nor_events.40.d: "Reform fırtınası Norveç’i süpürdü. Nidaros Katedrali’nin din adamları Roma’ya bağlılık için haykırıyor. Ama giderek daha çok kişi Luther’in yeni öğretileriyle yankılanıyor. Ve eski tanrılara dönmeyi düşleyenler var. Norveç kralının seçimi bu kuzey krallığının geleceğini belirleyecek."
 nor_events.40.a: "Roma’ya bağlılığı koru: Katoliklik Norveç’in ruhudur"
 nor_events.40.b: "Luther’in öğretilerini kabul et: reform çağı geldi"
 nor_events.40.c: "Kadim tanrılara dön: Odin’in lütfunu ara"
 nor_events.99.t: "Norveç İmparatorluğu’nun Doğuşu"
 nor_events.99.d: "İzlanda’dan Vinland’a, Nidaros’tan Britanya’ya: Norveç İmparatorluğu nihayet tamamlandı. Vikinglerin torunları atalarını aştı. Büyük Knut’un bile hayal etmediği ölçekte bir imparatorluk burada doğuyor. “Kuzey Denizi bir kez daha Norveç’in iç denizi”: tarihçiler bunu kaydedecek."
 nor_events.99.a: "Norveç İmparatorluğu’nun İmparatoru çok yaşasın! Vikinglerin mirasçıları ilelebet!"
 STATIC_MODIFIER_NAME_nor_kingdom_mod: "Norveç Krallığı"
 STATIC_MODIFIER_DESC_nor_kingdom_mod: "Kral Magnus Eriksson’un saltanatı altında Norveç’in yeniden inşasının temel taşı atıldı."
 STATIC_MODIFIER_NAME_nor_denmark_crushed_mod: "Danimarka Ezildi"
 STATIC_MODIFIER_DESC_nor_denmark_crushed_mod: "Norveç’in en büyük rakibi ezildi. İskandinavya’nın liderliği Norveç’e geçer."
 STATIC_MODIFIER_NAME_nor_sweden_union_mod: "İsveç Şahsi Birliği"
 STATIC_MODIFIER_DESC_nor_sweden_union_mod: "İsveç ile şahsi birlik İskandinav birliğinin temelini atar."
 STATIC_MODIFIER_NAME_nor_scandinavia_united_mod: "İskandinavya Birleşti"
 STATIC_MODIFIER_DESC_nor_scandinavia_united_mod: "Üç krallığın sancakları tek bir taç altında yan yana duruyor ve Oslo’dan çıkan emirler kuzey denizlerinin ötesine ulaşıyor."
 STATIC_MODIFIER_NAME_nor_bergen_mod: "Bergen Ticaret Merkezi"
 STATIC_MODIFIER_DESC_nor_bergen_mod: "Bergen, Norveç’in Kuzey Atlantik ticaret merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_nor_fleet_mod: "Norveç Filosu"
 STATIC_MODIFIER_DESC_nor_fleet_mod: "Viking kanı taşıyan bir Norveç filosu Kuzey Denizi’nde ve Kuzey Atlantik’te konuşlanıyor."
 STATIC_MODIFIER_NAME_nor_north_sea_mod: "Kuzey Denizi Pazarları"
 STATIC_MODIFIER_DESC_nor_north_sea_mod: "Norveç, Kuzey Denizi ticaretinde büyük bir aktör olarak kuruldu."
