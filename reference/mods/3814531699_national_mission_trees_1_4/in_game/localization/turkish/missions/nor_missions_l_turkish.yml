 STATIC_MODIFIER_NAME_nor_greenland_mod: "Grönland Seferi"
 STATIC_MODIFIER_DESC_nor_greenland_mod: "Grönland’ın buzlu denizlerine doğru yelken açan Norveçli denizciler uzak kuzeyin haritalarına yeni çizgiler çiziyor."
 STATIC_MODIFIER_NAME_nor_vinland_mod: "Vinland"
 STATIC_MODIFIER_DESC_nor_vinland_mod: "Norveç, Kuzey Amerika’da yerleşimleriyle Avrupa’nın ilk Yeni Dünya sömürge ulusu olur."
 STATIC_MODIFIER_NAME_nor_orkney_mod: "Orkney ve Shetland"
 STATIC_MODIFIER_DESC_nor_orkney_mod: "Orkney limanlarından görülen Kuzey Denizi dalgalarının üzerinden Norveç gemilerinin siluetleri durmaksızın geçiyor."
 STATIC_MODIFIER_NAME_nor_scotland_mod: "İskoçya Fethedildi"
 STATIC_MODIFIER_DESC_nor_scotland_mod: "Edinburgh’u ele geçirmek Britanya’ya giden yolu açar."
 STATIC_MODIFIER_NAME_nor_england_invasion_mod: "İngiltere’nin İstilası"
 STATIC_MODIFIER_DESC_nor_england_invasion_mod: "Danelaw’ın hatırası canlanıyor. Norveç kuvvetleri kuzey İngiltere’yi süpürüyor."
 STATIC_MODIFIER_NAME_nor_britain_mod: "Britanya Krallığı"
 STATIC_MODIFIER_DESC_nor_britain_mod: "Büyük Knut’un Kuzey Denizi İmparatorluğu yeniden doğar. Tüm Britanya Adaları Norveç denetiminde."
 STATIC_MODIFIER_NAME_nor_north_sea_master_mod: "Kuzey Denizi’nin Efendisi"
 STATIC_MODIFIER_DESC_nor_north_sea_master_mod: "Norveç Kuzey Denizi’nin tartışmasız efendisi olur. Tüm Kuzey Denizi Norveç denetimindedir."
