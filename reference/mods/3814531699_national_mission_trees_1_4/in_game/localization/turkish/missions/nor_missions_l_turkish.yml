 STATIC_MODIFIER_DESC_nor_nidaros_mod: "Norveç’in tarihî başkenti Kuzey’in dinî ve kültürel merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_nor_fisheries_mod: "Balıkçılık Geliştirildi"
 STATIC_MODIFIER_DESC_nor_fisheries_mod: "Kuzey Atlantik’in zengin balıkçılık kaynakları tamamen kullanılıyor ve Norveç’in ekonomik temelini kuruyor."
 STATIC_MODIFIER_NAME_nor_oslo_mod: "Oslo Geliştirildi"
 STATIC_MODIFIER_DESC_nor_oslo_mod: "Oslo Kalesi’nin katipleri kralın fermanlarını güney Norveç’te vadiden vadiye yazıp dağıtıyor."
 STATIC_MODIFIER_NAME_nor_absolutism_mod: "Mutlakiyet"
 STATIC_MODIFIER_DESC_nor_absolutism_mod: "Norveç’te mutlak monarşi kuruldu. Merkezî imparatorluk yönetiminin temeli atıldı."
 STATIC_MODIFIER_NAME_nor_catholic_mod: "Katolik Norveç"
 STATIC_MODIFIER_DESC_nor_catholic_mod: "Roma Kilisesi’ne bağlılığını koruyan Norveç, kuzey Katolik uygarlığının koruyucusu olarak tanınır."
 STATIC_MODIFIER_NAME_nor_crusader_mod: "Kuzey Haçlı Şanı"
 STATIC_MODIFIER_DESC_nor_crusader_mod: "Norveç kutsal savaş yoluyla Hıristiyan dünyasının koruyucusu olarak ün kazanır."
 STATIC_MODIFIER_NAME_nor_lutheran_mod: "Lutherci Reform"
 STATIC_MODIFIER_DESC_nor_lutheran_mod: "Manastırlardan çıkarılan kutsal kaplar kralın kasalarına konuyor ve Norveç hazinesi hiç olmadığı kadar dolu."
 STATIC_MODIFIER_NAME_nor_protestant_church_mod: "Protestan Kilisesi"
 STATIC_MODIFIER_DESC_nor_protestant_church_mod: "Lutherci ilahiyat eğitimi Protestan inancını tüm Norveç’e yerleştirir."
 STATIC_MODIFIER_NAME_nor_norse_conversion_mod: "Norse Canlanışı"
 STATIC_MODIFIER_DESC_nor_norse_conversion_mod: "Odin’e, Thor’a ve Freyr’e inanç yeniden canlandı. Viking çağı savaşçı ruhu Norveç ordularına yerleşiyor."
 STATIC_MODIFIER_NAME_nor_berserker_fleet_mod: "Berserker Filosu"
 STATIC_MODIFIER_DESC_nor_berserker_fleet_mod: "Viking berserker ruhu filoya yerleşir. Korsanlar gayrimüslim kıyılarını serbestçe yağmalar."
 STATIC_MODIFIER_NAME_nor_ragnarok_mod: "Ragnarök İmparatorluğu"
 STATIC_MODIFIER_DESC_nor_ragnarok_mod: "Kadim tanrıların lütfuyla Norveç bir kuzey imparatorluğu olarak yeniden doğar."
 STATIC_MODIFIER_NAME_nor_hansa_victory_mod: "Hansa Yenildi"
 STATIC_MODIFIER_DESC_nor_hansa_victory_mod: "Alman tüccarların Bergen üzerindeki hâkimiyeti ezildi."
 STATIC_MODIFIER_NAME_nor_baltic_mod: "Baltık’a Erişim"
 STATIC_MODIFIER_DESC_nor_baltic_mod: "Norveç Stralsund aracılığıyla Baltık’a doğrudan erişim güvence altına alır."
 STATIC_MODIFIER_NAME_nor_trade_supremacy_mod: "Kuzey Denizi Ticaret Hâkimiyeti"
 STATIC_MODIFIER_DESC_nor_trade_supremacy_mod: "Norveç tüm Kuzey Denizi ticaret yolunda inisiyatifi ele geçirir."
 STATIC_MODIFIER_NAME_nor_stavanger_mod: "Stavanger Limanı"
 STATIC_MODIFIER_DESC_nor_stavanger_mod: "Stavanger güneybatı Norveç’in balıkçılık ve ticaret merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_nor_amber_mod: "Kehribar Ticareti"
 STATIC_MODIFIER_DESC_nor_amber_mod: "Baltık kehribarı Norveç’in ticaret ağı aracılığıyla ihraç ediliyor."
 STATIC_MODIFIER_NAME_nor_finland_mod: "Finlandiya Bütünleşti"
 STATIC_MODIFIER_DESC_nor_finland_mod: "Finlandiya Norveç İmparatorluğu’nun bir parçası olarak bütünleşti."
 STATIC_MODIFIER_NAME_nor_engelbrekt_mod: "Engelbrekt’in Ruhu"
 STATIC_MODIFIER_DESC_nor_engelbrekt_mod: "Kuzeyin özgür adamları geleneği Norveç’in gururu olarak somutlaştı."
 STATIC_MODIFIER_NAME_nor_hammerfest_mod: "Hammerfest Geliştirildi"
 STATIC_MODIFIER_DESC_nor_hammerfest_mod: "Dünyanın en kuzeydeki ticaret karakolu kalıcı bir Arktik ticaret merkezi olarak kuruldu."
 STATIC_MODIFIER_NAME_nor_military_tradition_mod: "Norveç Seçkin Ordusu"
 STATIC_MODIFIER_DESC_nor_military_tradition_mod: "Güçlü askerî gelenekle desteklenen yüksek eğitimli bir Norveç seçkin ordusu tamamlandı."
 STATIC_MODIFIER_NAME_nor_great_power_mod: "Kuzey’in Büyük Gücü"
 STATIC_MODIFIER_DESC_nor_great_power_mod: "Norveç Kuzey Avrupa’da büyük bir güç olarak ortaya çıkar."
 STATIC_MODIFIER_NAME_nor_protestant_empire_mod: "Protestan İmparatorluk"
 STATIC_MODIFIER_DESC_nor_protestant_empire_mod: "Tüm İskandinav Lutherçiliğiyle Norveç Protestan dünyasının kuzey şampiyonu olarak hüküm sürer."
 STATIC_MODIFIER_NAME_nor_papal_champion_mod: "Papa’nın Şampiyonu"
 STATIC_MODIFIER_DESC_nor_papal_champion_mod: "Kuzey Katolik uygarlığının en güçlü koruyucusu olarak sarsılmaz bir konum kuruldu."
 STATIC_MODIFIER_NAME_nor_colonial_empire_mod: "Norveç Sömürge İmparatorluğu"
 STATIC_MODIFIER_DESC_nor_colonial_empire_mod: "Norveç, Vinland dahil 10+ koloniyle Avrupa’nın ilk gerçek sömürge imparatorluğu olur."
 STATIC_MODIFIER_NAME_nor_stormakt_mod: "Stormakt"
 STATIC_MODIFIER_DESC_nor_stormakt_mod: "Norveç’in büyük güç çağı geldi: Kuzey Avrupa’nın en büyük gücü olarak hüküm sürüyor."
 STATIC_MODIFIER_NAME_nor_sound_toll_mod: "Sound Geçiş Ücreti"
 STATIC_MODIFIER_DESC_nor_sound_toll_mod: "Sound Geçiş Ücreti toplamak Norveç hazinesini zenginleştirir."
 STATIC_MODIFIER_NAME_nor_stockholm_mod: "Stokholm Geliştirildi"
 STATIC_MODIFIER_DESC_nor_stockholm_mod: "Stokholm, İsveç birliği aracılığıyla Norveç İmparatorluğu’nun doğu idari merkezi olarak geliştirildi."
 STATIC_MODIFIER_NAME_nor_hanseatic_expulsion_mod: "Hansa Tüccarları Kovuldu"
 STATIC_MODIFIER_DESC_nor_hanseatic_expulsion_mod: "Bergen Alman tüccar hâkimiyetinden kurtuldu: Norveçli tüccarlar kendi limanlarının efendisi."
 STATIC_MODIFIER_NAME_nor_north_sea_empire_mod: "Kuzey Denizi İmparatorluğu"
 STATIC_MODIFIER_DESC_nor_north_sea_empire_mod: "Büyük Knut’un Kuzey Denizi İmparatorluğu modern çağda yeniden doğdu. Tüm Kuzey Denizi kıyısı Norveç denetiminde."
 STATIC_MODIFIER_NAME_nor_norwegian_empire_final_mod: "Norveç İmparatorluğu"
 STATIC_MODIFIER_DESC_nor_norwegian_empire_final_mod: "İzlanda’dan Vinland’a uzanan Norveç İmparatorluğu tamam. Viking mirasçıları atalarını aşıyor."
 STATIC_MODIFIER_NAME_nor_faith_steadfast_mod: "İnançta Sarsılmaz"
 STATIC_MODIFIER_DESC_nor_faith_steadfast_mod: "Sarsılmaz Katolik inancı, Nidaros Katedrali’nin çanlarının çalmasıyla kralın otoritesini halka ilan eder."
 STATIC_MODIFIER_NAME_nor_reform_winds_mod: "Reform Rüzgârları"
 STATIC_MODIFIER_DESC_nor_reform_winds_mod: "Luther’in öğretileri Norveç’e yayılıyor."
 STATIC_MODIFIER_NAME_nor_old_gods_calling_mod: "Kadim Tanrıların Çağrısı"
 STATIC_MODIFIER_DESC_nor_old_gods_calling_mod: "Odin’e ve Thor’a inanç gizlice yeniden canlanıyor."
 nor_expel_danish_nobility: "Danimarka’ya Karşı Koy"
 nor_expel_danish_nobility_desc: "1337’de Norveç, Kral Magnus Eriksson yönetiminde İsveç ile şahsi birlikte bağımsız bir krallıktır: bir Danimarka tabisi değil. Danimarka karmaşık bir komşudur ve gelmekte olan Kalmar Birliği (1397), Danimarka’ya İskandinavya üzerinde hâkimiyet verme riskini taşır. Norveç’in İskandinavya’daki konumunu şimdi Danimarka ile açık bir ilişkiyle kur: ister rekabet, ister ittifak, ister dostluk yoluyla."
 nor_secure_bergen_desc: "Bryggen, yani Bergen rıhtımını dizen o renkli ahşap depolar, Hansa tüccarlarının refahının simgesidir. Ama Bergen bir Norveç şehri olmalıdır. Kralın otoritesi bu limana uzandığında Kuzey Atlantik ticaretinin serveti Norveç ellerine akar."
 nor_develop_stavanger_desc: "Stavanger, Norveç’in güneybatı kıyısında kadim bir piskopos şehridir. Kayalıkların ve fiyortların iç içe geçtiği Rogaland’ın kalbi olarak bu liman ringa balıkçılığının ve Kuzey Denizi ticaretinin merkezi olur. Onu Bergen’den sonra Norveç’in ikinci büyük liman şehri olarak geliştir."
 nor_develop_oslo_desc: "Akershus Kalesi’nin surlarının ardında korunan Oslo, Danimarka ile İsveç arasındaki güney kapısıdır. Doğuda İsveç, güneyde Danimarka yer alır. Oslo’yu müreffeh bir şehre dönüştürerek Norveç’in güney sınırı güvence altına alınır ve tarım ile ticaret gelişmeye başlar."
 nor_secure_nidaros_desc: "Nidaros, Aziz Olaf’ın şehit düştüğü yerde kurulan bu şehir, İskandinavya’nın en büyük Gotik katedralinin altında durur ve kuzey Hıristiyan dünyasının manevi merkezi olarak bin yıllık tarih taşır. Nidaros’u geliştirmek, Norveç kralının otoritesinin hem gökte hem yerde onaylanması demektir."
 nor_vinland_desc: "Bin yıl önce Kızıl Erik’in oğlu Leif sisin ötesindeki uzak bir kıtaya, Vinland’a ayak bastı. Şimdi Norveç sancağı taşıyan bir sömürge ulusu bu hayali sürdürüyor. Norveç, Yeni Dünya’da kök salan ilk Avrupa ulusu olarak tarihe geçer."
 nor_colonization_desc: "Vinland’dan Grönland’a, İzlanda’dan arktik kıyılara: Norveç sömürge ulusları Kuzey Atlantik’e yayılır. Viking keşif ruhu modern çağda yaşıyor ve Norveç denizlerin ötesindeki dünyaya hükmeden gerçek bir deniz imparatorluğu olarak duruyor."
 nor_kingdom_of_britain_desc: "Londra, York, Edinburgh: Britanya Adaları’nın üç büyük şehri Norveç sancağı altında birleşti. Büyük Knut’un hayali bir kez daha gerçekleşti. Danelaw’ın hatırası modern çağda canlanıyor ve Kuzey Denizi Norveç’in gölü oluyor."
 nor_arctic_trade_desc: "Arktik’in kenarındaki donmuş ıssızlık olan Kola Yarımadası, kürklerin, av hayvanlarının ve mors dişinin hazinesidir. Sami avcıların getirdiği arktik ürünler, Avrupa soylularının aradığı en iyi kürkler olarak muazzam servet getirir. Kola Yarımadası’nı ele geçirerek Norveç Arktik ticaretin mutlak efendisi olur."
 nor_timber_industry_desc: "Norveç’in ormanları gemi ustalarına ve inşaatçılara bir armağandır. Derin ormandan kesilen ladin, çam ve huş; onları işlemek için dövülen demir aletlerle eşleşerek Norveç ekonomisinin sanayi belkemiğini oluşturur. Kereste fabrikalarının dumanı yükseldiğinde Norveç Kuzey Avrupa’nın en büyük kereste ihracatçısı olur."
 STATIC_MODIFIER_NAME_nor_timber_mod: "Kereste Sanayisi"
 STATIC_MODIFIER_DESC_nor_timber_mod: "Norveç’in zengin ormanlarından kesilen kereste ve aletler sanayi temelini destekler."
 STATIC_MODIFIER_NAME_nor_arctic_trade_mod: "Arktik Ticaret"
 STATIC_MODIFIER_DESC_nor_arctic_trade_mod: "Kola Yarımadası’ndan gelen kürkler ve av hayvanları Norveçli tüccarlar aracılığıyla tüm Avrupa’ya akıyor."
 STATIC_MODIFIER_NAME_nor_northern_economy_mod: "Kuzey Ekonomisi"
 STATIC_MODIFIER_DESC_nor_northern_economy_mod: "Balıkçılık, kereste, kürk ve Arktik ticaret üzerine kurulu Norveç ticareti Kuzey Avrupa’nın en yüksek seviyesine ulaşır. Tüccar bakım maliyetleri düşer ve daha fazla ticaret karakolu kurulabilir."
