l_turkish:
 wal_wallachia_mission_pack: "Ejder Tarikatı: Tuna’nın Koruyucusu"
 wal_wallachia_mission_pack_DESCRIPTION:0 "Karpat Dağları ile Tuna arasına sıkışan Eflak. Boyar soylularını dizginle ve Romen prensliklerini Moldavya ve Transilvanya ile birlikte birleştir ya da Ejder Tarikatı’nın sancağını kuşan ve bir Tuna imparatorluğu kurmak için Osmanlı İmparatorluğu’na savaş aç."
 wal_wallachia_mission_pack_CRITERIA_DESCRIPTION:0 "Voyvodalığı güçlendir, Romen prensliklerini birleştir ve bir Tuna imparatorluğunu tamamlamak için Osmanlı İmparatorluğu’nu yen."
 wal_wallachia_mission_pack_BUTTON_TOOLTIP:0 "Kazıklı’nın iradesini sürdür ve Tuna’nın koruyucusu ol."
 wal_wallachia_mission_pack_BUTTON_DETAILS:0 "“Biz Ejder’in çocuklarıyız”: Karpatların kurtları, haçı yükseltin!"
 wal_voivode_beginnings: "Voyvodalığın Şafağı"
 wal_voivode_beginnings_desc: "1330’da I. Basarab Posada Muharebesi’nde Macaristan Kralı’nı geri püskürttü: onun bağımsızlık ruhunu miras al ve Karpatlar ile Tuna arasında yeni bir prensliğin temellerini at."
 wal_voivode_authority: "Voyvoda’nın Otoritesi"
 wal_voivode_authority_desc: "Boyar soylularının alkışla seçtiği Voyvoda’nın tahtı: bu otoriteyi güvenceye al ve çekişmeli veraset kaosunu önle."
 wal_boyar_council: "Boyar Konseyi"
 wal_boyar_council_desc: "Büyük toprak sahibi boyarların meclisi: onların desteği olmadan Eflak yönetilemez. Konseyle ilişkileri istikrara kavuştur."
 wal_found_bucharest: "Bükreş’i Kur"
 wal_found_bucharest_desc: "Tuna yakınındaki Giurgiu: Voyvoda’nın yazlık sarayını tuttuğu yer. Bu yeri güney savunmasının ve ticaretin kalesi olan “Bucureşti” olarak geliştir."
 wal_targoviste_dev: "Târgovişte’yi Geliştir"
 wal_targoviste_dev_desc: "Karpatların eteğinde inşa edilen, nesiller boyu Voyvodaların makamı olan eski başkent Târgovişte: bu şehre daha fazla refah getir."
 wal_fortify_carpathians: "Karpatları Tahkim Et"
 wal_fortify_carpathians_desc: "Güneyden kuzeye uzanan Karpat Dağları: bu doğal surları insan yapımı kalelerle katmanlaştır ve hiçbir istilacının aşamayacağı bir savunma hattı inşa et."
 wal_orthodox_church: "Ortodoks Kilisesi’ni Koru"
 wal_orthodox_church_desc: "Bizans inancının mirasçısı Ortodoks Kilisesi: otosefal patrikhanesinin başında dur ve Voyvoda’nın otoritesine dinî meşruiyet ver."
 wal_dregatori: "Dregatori Ata"
 wal_dregatori_desc: "Kalıtsal soyluların zorbalığı devletin düşmanıdır. Soyla değil beceriyle seçilen memurlar olan “dregatori”leri ata ve tacın sadık bir idaresini inşa et."
 wal_unite_voivodes: "Voyvodaları Birleştir"
 wal_unite_voivodes_desc: "Eflak ve Moldavya: iki Romen prensliği, yine de bölünmüş ve rekabetleri düşmanlarımızdan başkasına hizmet etmiyor. Moldavya’da bir tutunağı olan herhangi bir güç artık o toprağın tamamı üzerinde meşru bir hak iddia edebilir."
 wal_subdue_moldavia: "Moldavya’ya Boyun Eğdir"
 wal_subdue_moldavia_desc: "Büyük Stefan’ın şanı artık geçmişe ait: Moldavya Prensliği’ni Eflak yönetimi altına al ve Romen birliğinin temel taşını at."
 wal_conquer_transylvania: "Transilvanya’yı Fethet"
 wal_conquer_transylvania_desc: "Uzun süre Macaristan krallarının ve halefleri tarafından yönetilen Transilvanya: bu toprağı Eflak’ın egemenlik alanına kat ve dış müdahaleye son ver."
 wal_szekely_land: "Sekeylerin Diyarı"
 wal_szekely_land_desc: "Doğu Transilvanya’nın savaşçı halkı Sekeyler: özerkliklerine ve savaş geleneklerine saygı göster ve yiğitliklerini Eflak’ın gücü yap."
 wal_saxon_towns: "Sakson Kasabalarını Bütünleştir"
 wal_saxon_towns_desc: "Braşov, Sibiu ve Transilvanya’nın diğer Sakson kasabaları: ortaçağdan beri müreffeh olan bu şehirleri krallığın ekonomisinin sütunu yap."
 wal_secure_danube: "Tuna’yı Güvenceye Al"
 wal_secure_danube_desc: "Balkanlar’ı Karpatlardan ayıran büyük Tuna Nehri: kıyılarını güney savunmasının ve ticaretinin can damarı olarak güvenceye al."
 wal_carpathian_hegemony: "Karpat Hegemonyası Tamam"
 wal_carpathian_hegemony_desc: "Karpatlar ile Tuna arasındaki tüm toprağın Voyvoda’nın otoritesine boyun eğme vakti geldi."
 wal_romanian_unity: "Romen Birliği Tamam"
 wal_romanian_unity_desc: "Eflak, Moldavya, Transilvanya: Romen halkının uzun süre bölünmüş topraklarını nihayet tek bir taç altında birleştir."
 wal_order_of_dragon_founding: "Ejder Tarikatı’na Katıl"
 wal_order_of_dragon_founding_desc: "Kutsal Roma İmparatoru Sigismund Osmanlılara karşı haçlı seferi idealine dayanan Ejder Tarikatı’nı kuruyor: kendi hükümdarımızın bu seçkin topluluk arasında yerini almasına izin ver."
 wal_impale_the_sultan: "Sultan’ı Kazığa Oturt"
 wal_impale_the_sultan_desc: "Sultan kendini surlarının ve lejyonlarının ardına saklanarak güvende sanıyor. İslam ordularına karşı savaş alanında kendi etinde öğrensin ki hiç kimse ilahî yargıdan saklanamaz."
 wal_drive_out_turks: "Türkleri Kov"
 wal_drive_out_turks_desc: "Yunan ve Bulgar halklarını baskıdan kurtarma vakti geldi. Türk istilacıları Boğaz’ın öte kıyısına geri sür."
 wal_liberate_serbia: "Sırbistan’ı Kurtar"
 wal_liberate_serbia_desc: "Kosova yenilgisinden beri Osmanlı boyunduruğu altında acı çeken Sırp kardeşlerimiz: onları kurtar ve Ortodoks Balkanlar’ın koruyucusu ol."
 wal_reclaim_morea: "Mora’yı Geri Al"
 wal_reclaim_morea_desc: "Bizans’ın son ışığının yandığı Mora Despotluğu: Mora Yarımadası’nın bu köşesini kâfir ellerinden geri al."
 wal_heir_of_rome: "Roma’nın Varisi"
 wal_heir_of_rome_desc: "Bizans İmparatorluğu’nun hiçbir zaman başaramadığı şeyi, kâfirin Avrupa’dan tamamen yenilgisini ve kovulmasını, biz başardık. Hiç kimse Roma’nın mirasına bizden daha layık değil."
 wal_bulwark_of_christendom: "Hıristiyan Dünyasının Kalesi"
 wal_bulwark_of_christendom_desc: "Romen prenslikleri Hıristiyan dünyasının kalesidir. Sınırlarımızı tahkim etmek Tanrı önünde görevimizdir."
 wal_ottoman_downfall: "Osmanlıların Çöküşü"
 wal_ottoman_downfall_desc: "Bir zamanlar Balkanlar’a ve Orta Doğu’ya hâkim olan Osmanlı İmparatorluğu: tehdidi nihayet tarihe gönderildi."
 wal_reclaim_constantinople: "İstanbul’u Geri Al"
 wal_reclaim_constantinople_desc: "Uzun süre kâfire düşen İstanbul: Ejder Tarikatı’nın mirasçıları olarak bu imparatorluk şehrini kurtar."
 wal_danubian_empire: "Tuna İmparatorluğu Tamam"
 wal_danubian_empire_desc: "Karpatlardan Balkanlara ve Boğaz’a kadar: Kazıklı’nın intikamıyla başlayan bu mücadele Tuna’ya hükmeden büyük bir imparatorluğun tamamlanmasıyla sona eriyor."
 wal_danube_trade: "Tuna Ticaret Yolu"
 wal_danube_trade_desc: "Tuna boyunca Batı Avrupa’yı ve Karadeniz’i birbirine bağlayan ticaret yolu: bu servet akışını Eflak’ın hazinesine çek."
 wal_treasury: "Bir Hazine İnşa Et"
 wal_treasury_desc: "Savaş, diplomasi, sarayın bakımı: her devlet işi altın gerektirir. Dolu bir hazine inşa et ve her zorluğa hazırlan."
 wal_manufactories: "Manifaktürleri Geliştir"
 wal_manufactories_desc: "Üretim alanında büyük bir dönüşüm sürüyor: tereddüt etmeden manifaktürlere yatırım yap ve bir sanayi çağına hazırlan."
 wal_events.2.t: "İstanbul Geri Alındı"
 wal_events.2.d: "Büyük imparatorluk şehri İstanbul nihayet elimize düştü. Ejder Tarikatı’nın sancağı artık bir zamanlar kâfirin elinde olan bu şehrin üzerinde dalgalanıyor."
 wal_events.2.a: "Roma şehri bizim!"
 wal_events.99.t: "Tuna İmparatorluğu’nun İlanı"
 wal_events.99.d: "Karpatların eteğindeki küçük bir prenslik Tuna’ya ve Balkanlar’a hükmeden büyük bir imparatorluk olarak yeniden doğdu. Kazıklı’nın iradesi nihayet tamamen gerçekleşti."
 wal_events.99.a: "Tuna İmparatorluğu’na şeref!"
 STATIC_MODIFIER_NAME_wal_voivode_beginnings_mod: "Voyvodalığın Şafağı"
 STATIC_MODIFIER_DESC_wal_voivode_beginnings_mod: "I. Basarab’ın yabancı bir hükümdarın önünde diz çökmeyi reddettiği günün hatırası Eflak askerlerinin gururudur."
 STATIC_MODIFIER_NAME_wal_voivode_mod: "Voyvoda’nın Otoritesi"
 STATIC_MODIFIER_DESC_wal_voivode_mod: "Voyvoda’nın tahtı istikrarlı ve verasete güven arttı."
 STATIC_MODIFIER_NAME_wal_boyar_mod: "Boyar Konseyi"
 STATIC_MODIFIER_DESC_wal_boyar_mod: "Boyar soylularıyla ilişkiler istikrarlı ve yönetimin temelini güçlendiriyor."
 STATIC_MODIFIER_NAME_wal_bucharest_mod: "Bükreş Kuruldu"
 STATIC_MODIFIER_DESC_wal_bucharest_mod: "Giurgiu güneyin kalesi “Bucureşti” olarak geliştirildi."
 STATIC_MODIFIER_NAME_wal_targoviste_mod: "Târgovişte Geliştirildi"
 STATIC_MODIFIER_DESC_wal_targoviste_mod: "Târgovişte’nin eski başkenti gelişmeyi sürdürüyor."
 STATIC_MODIFIER_NAME_wal_carpathians_mod: "Karpat Kale Ağı"
 STATIC_MODIFIER_DESC_wal_carpathians_mod: "Dağlardaki bir kale ağı her istilacıyı püskürtüyor."
 STATIC_MODIFIER_NAME_wal_church_mod: "Ortodoks Kilisesi’nin Korunması"
 STATIC_MODIFIER_DESC_wal_church_mod: "Eflak Ortodoks Kilisesi devlet koruması altında duruyor ve dinî meşruiyeti yükseltiyor."
 STATIC_MODIFIER_NAME_wal_impale_mod: "Sultan’ı Kazığa Oturt"
 STATIC_MODIFIER_DESC_wal_impale_mod: "Sultan’ın elçilerinin önüne dikilen kazık sırasının söylentisi hâlâ İslam ordularının yüreklerini ürpertiyor."
 STATIC_MODIFIER_NAME_wal_dregatori_mod: "Dregatori Atandı"
 STATIC_MODIFIER_DESC_wal_dregatori_mod: "Beceriyle seçilen memurlar artık sadık bir idareyi ayakta tutuyor."
 STATIC_MODIFIER_NAME_wal_moldavia_mod: "Moldavya’ya Boyun Eğdirildi"
 STATIC_MODIFIER_DESC_wal_moldavia_mod: "Moldavya Prensliği Eflak yönetimi altına alındı."
 STATIC_MODIFIER_NAME_wal_transylvania_mod: "Transilvanya Fethedildi"
 STATIC_MODIFIER_DESC_wal_transylvania_mod: "Transilvanya Eflak’ın egemenlik alanına katıldı."
 STATIC_MODIFIER_NAME_wal_szekely_mod: "Sekey Yiğitliği"
 STATIC_MODIFIER_DESC_wal_szekely_mod: "Sekey topraklarının dağ savaşçıları mızraklarını Eflak sancaklarının altında hizaya diziyor."
 STATIC_MODIFIER_NAME_wal_saxon_mod: "Sakson Kasabalarının Refahı"
 STATIC_MODIFIER_DESC_wal_saxon_mod: "Transilvanya’nın Sakson kasabaları krallığın ekonomisinin sütunu oldu."
 STATIC_MODIFIER_NAME_wal_danube_mod: "Tuna Güvence Altında"
 STATIC_MODIFIER_DESC_wal_danube_mod: "Tuna kıyıları güvence altına alındı ve bir ticaret can damarı açtı."
 STATIC_MODIFIER_NAME_wal_hegemony_mod: "Karpat Hegemonyası"
 STATIC_MODIFIER_DESC_wal_hegemony_mod: "Karpatlar ile Tuna arasındaki toprak Voyvoda’nın otoritesine tamamen boyun eğiyor."
 STATIC_MODIFIER_NAME_wal_unity_mod: "Romen Birliği"
 STATIC_MODIFIER_DESC_wal_unity_mod: "Eflak, Moldavya ve Transilvanya tek bir taç altında birleşti."
 STATIC_MODIFIER_NAME_wal_order_of_dragon_mod: "Ejder Tarikatı Üyesi"
 STATIC_MODIFIER_DESC_wal_order_of_dragon_mod: "Ejder Tarikatı’nın nişanını taşıyan elçiler Hıristiyan dünyasının saraylarını dolaşıyor ve Osmanlılara karşı ittifak çemberini genişletiyor."
 STATIC_MODIFIER_NAME_wal_drive_out_mod: "Türkler Kovuldu"
 STATIC_MODIFIER_DESC_wal_drive_out_mod: "Kâfire karşı savaş ordumuzun gücünü kanıtladı."
 STATIC_MODIFIER_NAME_wal_serbia_mod: "Sırbistan Kurtarıldı"
 STATIC_MODIFIER_DESC_wal_serbia_mod: "Sırp kardeşlerimiz özgürleşti ve Ortodoks Balkanlar genelinde itibarımızı yükseltti."
 STATIC_MODIFIER_NAME_wal_morea_mod: "Mora Geri Alındı"
 STATIC_MODIFIER_DESC_wal_morea_mod: "Mora limanlarından şarap ve ipek yükleri Eflaklı tüccarların depolarını dolduruyor."
 STATIC_MODIFIER_NAME_wal_heir_of_rome_mod: "Roma’nın Varisi"
 STATIC_MODIFIER_DESC_wal_heir_of_rome_mod: "Bizans imparatorlarının halefiyetini iddia eden Eflak sarayında din adamları ve soylular başlarını eğiyor ve meşruiyetinden şüphe etmiyor."
 STATIC_MODIFIER_NAME_wal_bulwark_mod: "Hıristiyan Dünyasının Kalesi"
 STATIC_MODIFIER_DESC_wal_bulwark_mod: "Bir sınır kaleleri ağı artık Hıristiyan dünyası için bir kalkan olarak hizmet ediyor."
 STATIC_MODIFIER_NAME_wal_downfall_mod: "Osmanlıların Çöküşü"
 STATIC_MODIFIER_DESC_wal_downfall_mod: "Artık Osmanlı akınlarıyla perişan olmayan sınırlarda askerler birbirlerine bileyledikleri talimi gururla gösteriyor."
 STATIC_MODIFIER_NAME_wal_manufactories_mod: "Manifaktürler Geliştirildi"
 STATIC_MODIFIER_DESC_wal_manufactories_mod: "Bükreş atölyelerinin bacalarından yeni kumaşın ve aletlerin yapımından kaynaklanan durmayan duman yükseliyor."
 STATIC_MODIFIER_NAME_wal_trade_mod: "Tuna Ticaret Yolu"
 STATIC_MODIFIER_DESC_wal_trade_mod: "Tuna boyunca bir ticaret ağı devletin servetini koruyor."
 STATIC_MODIFIER_NAME_wal_treasury_mod: "Dolu Bir Hazine"
 STATIC_MODIFIER_DESC_wal_treasury_mod: "Gümüş sikke sandıkları saray kasalarında yığılı ve tüccarlar sikkenin ağırlığından şüphe etmeden ticaret yapıyor."
 STATIC_MODIFIER_NAME_wal_danubian_empire_mod: "Tuna İmparatorluğu’nun Yönetim Ağı"
 STATIC_MODIFIER_DESC_wal_danubian_empire_mod: "Tuna’nın kendisi imparatorluğun can damarı oldu: suları orduları kolayca yukarı ve aşağı taşıyor. Hanedanın meşruiyeti sarsılmaz duruyor ve tacın gücü diyarın her köşesine ulaşıyor."
