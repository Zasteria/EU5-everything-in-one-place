l_turkish:
 sic_restoration_mission_pack: "Sicilya Krallığı’nın Yolu"
 sic_restoration_mission_pack_DESCRIPTION:0 "1282 ayaklanmasıyla Napoli’den koparılan Sicilya Krallığı, Akdeniz’in kalbindeki bu adanın gücünü toplayıp adını bir kez daha tarihe kazımaya hazır. Boğazı geçip Napoli ile yeniden bir olacak mısın, yoksa adanın kendisini altın bir diyara mı dönüştüreceksin? Seçim senin, ey Kral."
 sic_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Sicilya Krallığı olarak görevleri tamamla; İki Sicilya’nın yeniden kuruluşu veya Sicilya adası için bir altın çağ yolunda ilerle."
 sic_restoration_mission_pack_BUTTON_TOOLTIP:0 "Sicilya Krallığı’nın yolunda yürümek için görevleri tamamla."
 sic_restoration_mission_pack_BUTTON_DETAILS:0 "Boğazın ötesindeki Napoli’yi fethedip İki Sicilya Krallığı’nı kur ya da Sicilya adasını Akdeniz’in mücevheri olacak şekilde işle. Hangi yolda olursa olsun, yeni bir krallığın refahı seni bekliyor!"
 sic_divided_kingdom: "Boğazın Ötesinde"
 sic_divided_kingdom_desc: "1282’de Sicilya Vespers adıyla bilinen ayaklanmada Anjou Hanedanı’nın egemenliğini yıktık. Fransız memurların zulmüne daha fazla dayanamayan adanın halkı, akşam çanlarının sesiyle tek vücut olarak ayağa kalktı ve Fransızları kıyılarımızdan kovdu. Aragon Kralı III. Pedro’yu yeni kralımız olarak karşıladık ve Sicilya Krallığı böylece ikiye bölündü. Boğazın ötesinde, Napoli merkezli anakarada, Anjou Hanedanı’ndan bir kral hâlâ kendini “Sicilya Kralı” diye adlandırıyor. Bu adanın meşru kralları yalnızca biziz. İki diyarımız arasındaki rekabet bugün de sürüyor."
 sic_ambitions_on_naples: "Napoli Üzerindeki Emeller"
 sic_ambitions_on_naples_desc: "Boğazın ötesindeki Anjou kralı, haklı olarak Sicilya Kralı unvanının rakip iddiacısıdır. Daimi ordumuzu güçlendirmenin ve bir gün Napoli tacını kendimize almak için haklı davayı yükseltmenin zamanı geldi."
 sic_army_of_the_island: "Adanın Filosu"
 sic_army_of_the_island_desc: "Sicilya adası, dört bir yanı denizle çevrili bir kaledir. Ordularımızı boğazın ötesine, Napoli’ye göndermek için önce hem adanın savunmasını hem de askerlerimizin güvenli geçişini sağlayacak güçlü bir filo inşa etmeliyiz."
 sic_conquest_of_naples: "Napoli’nin Fethi"
 sic_conquest_of_naples_desc: "Kuvvetlerimiz sonunda boğazı geçti ve Napoli kıyılarına çıktı. Anjou ordusunu kırıp Napoli tacını ele geçirebilirsek, 1282’de ikiye yırtılan krallık bizim egemenliğimiz altında yeniden bütün olacak."
 sic_two_sicilies: "İki Sicilya"
 sic_two_sicilies_desc: "Napoli ve Palermo, iki taç, artık ellerimizde. Boğazın her iki yakasını kapsayan yeni bir krallığın, İki Sicilya Krallığı’nın kuruluşunu ilan etme vakti geldi. Bu, 1282’deki bölünmeye son veren tarihî eylemdir."
 sic_golden_wheat_fields: "Altın Buğday Tarlaları"
 sic_golden_wheat_fields_desc: "Antik çağlardan beri Sicilya adına Akdeniz’in ambarı denir. Palermo çevresindeki bereketli ovaları geliştirirsek bol hasadı tüm krallığı doyuracak, fazla tahıl ise değerli bir ticaret malı olarak yurt dışına taşınacak."
 sic_palermo_resurgent: "Yeniden Doğan Palermo"
 sic_palermo_resurgent_desc: "Norman krallığı günlerinde Palermo, Akdeniz’de eşsiz bir görkeme sahip bir şehirdi. Burada yeniden yeni yapılar yükseltmek ve o eski parlaklıktan bir kısmını geri kazanmak, tüm adanın gelişimine giden ilk adım olacak."
 sic_mediterranean_crossroads: "Akdeniz Ticaretinin Kavşağı"
 sic_mediterranean_crossroads_desc: "Sicilya adası, Doğu ve Batı ticaret yollarının buluştuğu Akdeniz’in tam kavşağında yer alır. Adanın limanlarında pazarlar kurarak her diyardan tüccarı buraya toplayabilir, krallığın ticaret gelirini büyük ölçüde artırabiliriz."
 sic_sicilian_renaissance: "Sicilya Rönesansı"
 sic_sicilian_renaissance_desc: "Norman, Arap, Bizans ve Latin kültürlerinin buluştuğu Sicilya sarayı, uzun zamandır sanat ve bilgi merkezidir. Palermo’da toplanan çok sayıda sanat eseri, yeni bir kültürel çiçeklenmenin şafağını müjdeliyor."
 sic_kingdom_resurgent: "Yeniden Doğan Krallık"
 sic_kingdom_resurgent_desc: "İster boğazın iki yakasını kapsayan bir krallık, ister Akdeniz’in kalbinde kültür ve ticaretle parlayan bir ada olarak, Sicilya adını bir kez daha tarihe kazıdı. Bundan sonra bu krallığın yolu yeni bir çağın şafağını işaretleyecek."
 STATIC_MODIFIER_NAME_sic_army_of_the_island_mod: "Adanın Filosu"
 STATIC_MODIFIER_DESC_sic_army_of_the_island_mod: "Yeniden düzenlenen ada filosu yüksek moral ve bol insan gücü yedeğine sahiptir."
 STATIC_MODIFIER_NAME_sic_conquest_of_naples_mod: "Napoli’nin Fethi"
 STATIC_MODIFIER_DESC_sic_conquest_of_naples_mod: "Napoli seferini atlatan kraliyet ordusunun disiplini arttı ve savaş müzakerelerinde elimiz daha güçlü."
 STATIC_MODIFIER_NAME_sic_two_sicilies_mod: "İki Sicilya"
 STATIC_MODIFIER_DESC_sic_two_sicilies_mod: "Boğazın iki yakasını kapsayan yeni krallığın prestiji ve meşruiyeti hiç bu kadar yüksek olmamıştı."
 STATIC_MODIFIER_NAME_sic_golden_wheat_fields_mod: "Altın Buğday Tarlaları"
 STATIC_MODIFIER_DESC_sic_golden_wheat_fields_mod: "Antik Roma, Sicilya’ya “imparatorluğun ambarı” (Granarium Imperii) derdi. Adanın iç kesimindeki uçsuz bucaksız buğday tarlaları Akdeniz dünyasını beslemeyi sürdürdü. Sicilya’nın “buğday adası” olarak tarımsal rolü antik çağdan 19. yüzyıla kadar değişmeden kaldı ve Akdeniz’in gıda güvenliğinin dayanaklarından biri oldu."
 STATIC_MODIFIER_NAME_sic_palermo_resurgent_mod: "Yeniden Doğan Palermo"
 STATIC_MODIFIER_DESC_sic_palermo_resurgent_mod: "Palermo (Fenikece Panormos, “tüm limanlar”), Norman, Arap ve Bizans kültürlerinin kaynaştığı Sicilya’nın en büyük şehridir. II. Roger’ın sarayı Avrupa’nın en rafine saraylarından biri olarak bilinirdi; Arapça, Yunanca ve Latincenin yan yana kullanıldığı çok kültürlü bir merkezdi."
 STATIC_MODIFIER_NAME_sic_mediterranean_crossroads_mod: "Akdeniz Ticaretinin Kavşağı"
 STATIC_MODIFIER_DESC_sic_mediterranean_crossroads_mod: "Sicilya, Akdeniz’in neredeyse tam ortasında yer alır ve antik Fenikelilerin Kartaca’yı kurduğu çağdan beri doğu-batı ticaretinin aktarma noktası olmuştur. Yunan filozof Arşimet’in doğum yeri Siraküza ve Arap kültürünün kokusunu taşıyan Palermo: bu ada, Akdeniz uygarlığının tam bir özeti."
 STATIC_MODIFIER_NAME_sic_sicilian_renaissance_mod: "Sicilya Rönesansı"
 STATIC_MODIFIER_DESC_sic_sicilian_renaissance_mod: "Palermo’da çiçeklenen kültür, krallığın hizmetine giren yeni sanatçıların becerisini yükseltti."
 STATIC_MODIFIER_NAME_sic_kingdom_resurgent_mod: "Yeniden Doğan Krallık"
 STATIC_MODIFIER_DESC_sic_kingdom_resurgent_mod: "Yeniden doğan krallığın görkemi, prestijini ve meşruiyetini yükseltti ve savaş müzakerelerindeki elini eskisinden hiç olmadığı kadar güçlendirdi."
 sic_events.1.t: "İkiye Bölünmüş Bir Krallık"
 sic_events.1.d: "1282’de Anjou Hanedanı’nın egemenliğine karşı ayaklandık. Fransa’dan gönderilen memurların zulmüne artık dayanamayan adanın halkı, akşam çanlarının sesiyle tek vücut olarak ayağa kalktı ve Fransızları kıyılarımızdan kovdu. Aragon Kralı III. Pedro’yu yeni kralımız olarak karşıladık ve Sicilya Krallığı böylece ikiye bölündü. Boğazın ötesinde, Napoli merkezli anakarada, Anjou Hanedanı’ndan bir kral hâlâ kendini “Sicilya Kralı” diye adlandırıyor. Bu adanın gerçek kralları yalnızca biziz. İki diyarımız arasındaki rekabet bugün de sürüyor."
 sic_events.1.a: "Anlaşıldı"
