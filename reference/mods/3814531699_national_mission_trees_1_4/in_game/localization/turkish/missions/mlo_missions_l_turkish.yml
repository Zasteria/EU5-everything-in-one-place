l_turkish:
 mlo_biscione_mission_pack: "Biscione’nin Mirası"
 mlo_biscione_mission_pack_DESCRIPTION:0 "Biscione, bir adamı yutan yılan, Visconti arması üzerinde parlıyor. Bir zamanlar Lombardiya’daki birçok şehir devletinden yalnızca biri olan Milano Dukalığı şimdi kuzey İtalya üzerindeki üstünlük için yürüyen karmaşık mücadele içinde kendi yolunu çiziyor. İster yönetimi ve kültürü geliştirerek, ister kuzeyin başlıca gücü olarak yükselerek, ister Papa’nın, İmparator’un ve Fransa’nın büyük güçleri arasında kendi yerini koruyarak, hangi mirasın inşa edileceği seçimi Dük’e aittir."
 mlo_biscione_mission_pack_CRITERIA_DESCRIPTION:0 "Milano Dukalığı olarak görevleri tamamla ve kuzey İtalya’da hâkim bir konum kur."
 mlo_biscione_mission_pack_BUTTON_TOOLTIP:0 "Biscione’nin Mirası’nı devralmak için görevleri tamamla."
 mlo_biscione_mission_pack_BUTTON_DETAILS:0 "Lombardiya’nın bir şehir devletinden İtalya’nın kalbine!"
 mlo_expanded_domain: "Genişleyen Egemenlik Alanı"
 mlo_expanded_domain_desc: "Milano Dukalığı Lombardiya’nın şehirlerini özümsedi ve topraklarını büyük ölçüde genişletti."
 mlo_curb_della_scala: "della Scala’yı Dizginlemek"
 mlo_curb_della_scala_desc: "Verona lordları della Scala ailesinin kuzey İtalya üzerindeki büyüyen hegemonyası durdurulmalı."
 mlo_imperial_vicariate: "İmparatorluk Vikaryası"
 mlo_imperial_vicariate_desc: "Kutsal Roma İmparatoru’ndan İmparatorluk Vekili unvanını alan Milano’nun yönetimi artık İmparatorluğun meşruiyetini taşıyor."
 mlo_serpent_that_devours_men: "İnsanları Yutan Yılan"
 mlo_serpent_that_devours_men_desc: "Biscione, bir adamı yutan yılan, Visconti arması üzerinde parlıyor. Efsane ailenin gücünü somutlaştırır ve Milano için yeni bir çağı müjdeler."
 mlo_state_led_enterprises: "Devlet Öncülüğünde Girişimler"
 mlo_state_led_enterprises_desc: "Milano Dukalığı devlet yönlendirmesi altında kurumlarının ve kültürünün gelişimini ilerletir."
 mlo_rigorous_plague_policy: "Titiz Veba Politikası"
 mlo_rigorous_plague_policy_desc: "Veba karşısında dukalığın halkını korumak için kapsamlı bir karantina ve tecrit sistemi kurulmalı."
 mlo_duomo_di_milano: "Duomo di Milano"
 mlo_duomo_di_milano_desc: "Milano Katedrali’nin inşasını ilerlet ve dukalığın görkeminin göklere ulaşmasına izin ver."
 mlo_road_network_of_the_realm: "Diyar İçin Yol Ağı"
 mlo_road_network_of_the_realm_desc: "Tüm dukalığı birbirine bağlayan bir yol ağı geliştir ve insan ve mal hareketini canlandır."
 mlo_expand_administrative_buildings: "İdari Binaları Genişletmek"
 mlo_expand_administrative_buildings_desc: "Veba politikasının derslerinden yararlanarak dukalığın idari kurumlarını daha da genişlet."
 mlo_embrace_the_renaissance: "Rönesans’ı Kucaklamak"
 mlo_embrace_the_renaissance_desc: "Duomo’nun inşasıyla birlikte Milano sarayı Rönesans’ın yeni ruhunu kucaklıyor."
 mlo_the_last_supper: "Son Akşam Yemeği"
 mlo_the_last_supper_desc: "Leonardo da Vinci’ye Son Akşam Yemeği’ni yapmasını emanet et ve Milano’yu sanatın şehri yap."
 mlo_naviglio_grande_renovation: "Naviglio Grande’nin Yenilenmesi"
 mlo_naviglio_grande_renovation_desc: "Milano’yu çevre bölgeyle bağlayan kanal Naviglio Grande’yi yenile ve ticareti ve tarımı teşvik et."
 mlo_castello_sforzesco: "Castello Sforzesco"
 mlo_castello_sforzesco_desc: "Dükalık görkeminin simgesi Castello Sforzesco’yu Milano hükümetinin makamı olarak genişlet."
 mlo_biblioteca_ambrosiana: "Biblioteca Ambrosiana"
 mlo_biblioteca_ambrosiana_desc: "Çağların biriken bilgisini barındırmak ve ilmi beslemek için Biblioteca Ambrosiana’yı kur."
 mlo_heart_of_italy: "İtalya’nın Kalbi Olmaya Layık Bir Şehir"
 mlo_heart_of_italy_desc: "Yönetim, sanayi, sanat ve ilim hep çiçek açarken Milano İtalya’nın kalbi olarak durmaya layık bir şehir oldu."
 mlo_north_italian_ambitions: "Kuzey İtalya Emelleri"
 mlo_north_italian_ambitions_desc: "Milano Dukalığı tüm kuzey İtalya üzerinde hâkimiyeti güvenceye almak için ordularını harekete geçirir."
 mlo_subjugate_lombardy: "Lombardiya’ya Boyun Eğdirmek"
 mlo_subjugate_lombardy_desc: "Lombardiya’nın şehirlerini tam denetim altına al ve dukalığın temelini güvenceye al."
 mlo_advance_into_piedmont: "Piyemonte’ye İlerlemek"
 mlo_advance_into_piedmont_desc: "Savoya Hanedanı’nın gücüne karşı koyarak nüfuzu batıya, Piyemonte’ye doğru uzat."
 mlo_strife_over_veneto: "Veneto Üzerindeki Çekişme"
 mlo_strife_over_veneto_desc: "Veneto’nun denetimi için Venedik ve diğer güçlerle çatışma kaçınılmazdır."
 mlo_through_emilia_and_beyond: "Emilia Üzerinden ve Ötesine"
 mlo_through_emilia_and_beyond_desc: "Emilia’dan geç ve güneye doğru daha fazla genişleme için bir yol aç."
 mlo_secure_liguria: "Liguria’yı Güvenceye Almak"
 mlo_secure_liguria_desc: "Cenova dahil Liguria’yı güvenceye al ve Akdeniz’de bir tutunak kazan."
 mlo_reach_the_coveted_sea: "Arzulanan Denize Ulaşmak"
 mlo_reach_the_coveted_sea_desc: "Bir zamanlar denize kıyısı olmayan bir devlet olan Milano nihayet Akdeniz’e doğrudan erişimi güvenceye alıyor."
 mlo_topple_the_old_rival_florence: "Eski Rakip Floransa’yı Yıkmak"
 mlo_topple_the_old_rival_florence_desc: "Uzun süreli rakip Floransa’yı yen ve Toskana üzerinde nüfuz kur."
 mlo_between_two_authorities: "İki Otorite Arasında"
 mlo_between_two_authorities_desc: "Papa’nın, İmparator’un ve Fransa Kralı’nın üç büyük otoritesi arasında sıkışan Milano kendi yolunu arıyor."
 mlo_reconcile_with_the_papacy: "Papalıkla Uzlaşmak"
 mlo_reconcile_with_the_papacy_desc: "Roma Curia’sıyla ilişkileri iyileştir ve otoritesini bir destek olarak kazan."
 mlo_trust_of_the_emperor: "İmparator’un Güveni"
 mlo_trust_of_the_emperor_desc: "Kutsal Roma İmparatoru’nun güvenini kazan ve dukalığın İmparatorluk içindeki konumunu yükselt."
 mlo_overture_to_france: "Fransa’ya Yaklaşma"
 mlo_overture_to_france_desc: "Fransa Krallığı ile diplomatik bağlar kur ve yeni seçenekler güvenceye al."
 mlo_the_italian_wars: "İtalya Savaşları"
 mlo_the_italian_wars_desc: "Milano Papa’nın, İmparator’un ve Fransa’nın çıkarlarının çarpıştığı İtalya Savaşları’na çekiliyor."
 mlo_isolate_papal_authority: "Papalık Otoritesini Yalıtmak"
 mlo_isolate_papal_authority_desc: "İtalya Savaşları’ndan sağ çıktıktan sonra Papa’nın dünyevî otoritesini Milano siyasetinden ayır."
 mlo_deny_imperial_authority: "İmparatorluk Otoritesini Reddetmek"
 mlo_deny_imperial_authority_desc: "İtalya Savaşları’ndan sağ çıktıktan sonra dukalığı İmparatorluk otoritesine güvenmeden yönetme yolunu seç."
 mlo_repel_french_authority: "Fransız Otoritesini Püskürtmek"
 mlo_repel_french_authority_desc: "İtalya Savaşları’ndan sağ çıktıktan sonra Fransız müdahalesini püskürt ve dukalığın bağımsızlığını koru."
 mlo_italian_independence: "İtalyan Bağımsızlığı"
 mlo_italian_independence_desc: "Milano Papa’ya, İmparator’a ve Fransa’ya bağımlı olmayan, İtalya’da güçlü ve kendine güvenen bir güç olarak konumunu güvenceye aldı."
 mlo_who_achieves_all_things: "Her Şeyi Başaran"
 mlo_who_achieves_all_things_desc: "Yönetimde, kültürde, toprakta ve diplomaside zirveye ulaşan Milano Dükü artık her şeyi başaran olarak anılmaya layık."
 STATIC_MODIFIER_NAME_mlo_expanded_domain_mod: "Genişleyen Dukalık"
 STATIC_MODIFIER_DESC_mlo_expanded_domain_mod: "Dukalığın topraklarının hızlı büyümesi idarenin yayılmasını teşvik etti ve yeni edinilen toprakların bütünleşmesini hızlandırdı."
 STATIC_MODIFIER_NAME_mlo_curb_della_scala_mod: "della Scala Üzerinde Üstünlük"
 STATIC_MODIFIER_DESC_mlo_curb_della_scala_mod: "della Scala’nın kuzey İtalya’daki nüfuzunu dizginleyen dukalığın diplomatik konumu yükseldi."
 STATIC_MODIFIER_NAME_mlo_state_led_enterprises_mod: "Rafine Devlet Aygıtı"
 STATIC_MODIFIER_DESC_mlo_state_led_enterprises_mod: "Visconti’ler ve Sforza’lar büyük ölçekli devlet öncülüğündeki kamu işlerinde mükemmeldi. Pavia Certosa’sı, Milano’daki Castello Sforzesco, Naviglio Grande kanal ağı: hepsi kamu otoritesince yürütülen büyük inşa projeleriydi."
 STATIC_MODIFIER_NAME_mlo_rigorous_plague_policy_mod: "Kurulu Karantina Sistemi"
 STATIC_MODIFIER_DESC_mlo_rigorous_plague_policy_mod: "Dukalık genelinde kurulan hastaneler ülke çapında hastalığa karşı direnci güçlendirdi."
 STATIC_MODIFIER_NAME_mlo_duomo_di_milano_mod: "Duomo’nun Görkemi"
 STATIC_MODIFIER_DESC_mlo_duomo_di_milano_mod: "Tamamlanan Milano Katedrali dukalığın kültürel geleneğini ve nüfuzunu güçlendirdi."
 STATIC_MODIFIER_NAME_mlo_road_network_of_the_realm_mod: "Gelişen Yol Ağı"
 STATIC_MODIFIER_DESC_mlo_road_network_of_the_realm_mod: "Geliştirilen yol ağı dukalık genelinde ticareti canlandırdı."
 STATIC_MODIFIER_NAME_mlo_expand_administrative_buildings_mod: "Genişletilmiş İdare"
 STATIC_MODIFIER_DESC_mlo_expand_administrative_buildings_mod: "Sforza’lar güçlü bir bürokratik sistem kurdu. Milano’nun merkezî kançılaryasında (Cancelleria) yetenekli hukukçular ve katipler toplandı ve kuzey İtalya’nın en rafine idari aygıtı olarak biliniyordu."
 STATIC_MODIFIER_NAME_mlo_embrace_the_renaissance_mod: "Rönesans Sarayı"
 STATIC_MODIFIER_DESC_mlo_embrace_the_renaissance_mod: "Francesco Sforza’nın ve oğlu Ludovico Sforza’nın (il Moro) sarayı Rönesans’ın büyük bir merkezi oldu. Ludovico Leonardo da Vinci’yi neredeyse yirmi yıl sarayında ağırladı ve Bramante gibi sanatçıları ve mimarları topladı."
 STATIC_MODIFIER_NAME_mlo_the_last_supper_mod: "Ölümsüz Bir Başyapıt"
 STATIC_MODIFIER_DESC_mlo_the_last_supper_mod: "1495-1498’de Leonardo da Vinci tarafından Santa Maria delle Grazie manastırının yemekhane duvarına yapılan “Son Akşam Yemeği”, mükemmel perspektif kullanımı ve her figürün psikolojik tasviri nedeniyle Batı resminin bir başyapıtı sayılır. Ludovico Sforza’nın sipariş ettiği eser, Milano sarayının zirvedeki mirasıdır."
 STATIC_MODIFIER_NAME_mlo_naviglio_grande_renovation_mod: "Kanal Ağının Yararları"
 STATIC_MODIFIER_DESC_mlo_naviglio_grande_renovation_mod: "Yenilenen Naviglio Grande yönetimin başkentten yayılmasını kalıcı olarak hızlandırdı."
 STATIC_MODIFIER_NAME_mlo_biblioteca_ambrosiana_mod: "İlmin Çiçeklenmesi"
 STATIC_MODIFIER_DESC_mlo_biblioteca_ambrosiana_mod: "Biblioteca Ambrosiana’nın kuruluşu zanaatlarına yeni giren sanatçıların becerisini yükseltti."
 STATIC_MODIFIER_NAME_mlo_heart_of_italy_mod: "İtalya’nın Kalbi"
 STATIC_MODIFIER_DESC_mlo_heart_of_italy_mod: "İtalya’nın kalbi olarak Milano her köşeden insanları çekiyor ve refahı artık kalıcı."
 STATIC_MODIFIER_NAME_mlo_north_italian_ambitions_mod: "Kuzey İtalya’da Emeller"
 STATIC_MODIFIER_DESC_mlo_north_italian_ambitions_mod: "Tüm kuzey İtalya üzerindeki emeller casus ağlarının inşasını hızlandırdı."
 STATIC_MODIFIER_NAME_mlo_subjugate_lombardy_mod: "Lombardiya’nın Hükümdarı"
 STATIC_MODIFIER_DESC_mlo_subjugate_lombardy_mod: "Lombardiya’nın tam denetimi dukalığın diplomatik konumunu yükseltti."
 STATIC_MODIFIER_NAME_mlo_advance_into_piedmont_mod: "Piyemonte’de Tutunak"
 STATIC_MODIFIER_DESC_mlo_advance_into_piedmont_mod: "Piyemonte Savoya Hanedanı’nın alanıydı ve Milano’nun uzun süreli rakibiydi. Fransa’ya Alpler’i aşan bu stratejik koridoru elde tutmak batıdan gelecek istilaya karşı bir kalkan olurdu. Hem Visconti’ler hem Sforza’lar bölgeye defalarca ilerlemeye çalıştı."
 STATIC_MODIFIER_NAME_mlo_strife_over_veneto_mod: "Veneto’dan Muharebe Onurları"
 STATIC_MODIFIER_DESC_mlo_strife_over_veneto_mod: "Veneto üzerindeki çekişmeden gelen muharebe onurları ordunun şöhretini yükseltti."
 STATIC_MODIFIER_NAME_mlo_through_emilia_and_beyond_mod: "Güneye Giden Yol"
 STATIC_MODIFIER_DESC_mlo_through_emilia_and_beyond_mod: "Emilia’nın ötesinde açılan yol ordunun moralini destekliyor."
 STATIC_MODIFIER_NAME_mlo_secure_liguria_mod: "Liguria Ticareti"
 STATIC_MODIFIER_DESC_mlo_secure_liguria_mod: "Cenova dahil Liguria’nın güvenceye alınması tüccarların faaliyetini teşvik etti."
 STATIC_MODIFIER_NAME_mlo_reach_the_coveted_sea_mod: "Akdeniz’e Açılan Kapı"
 STATIC_MODIFIER_DESC_mlo_reach_the_coveted_sea_mod: "Arzulanan denize ulaşıldığında donanmanın ikmal kapasitesi iyileşti."
 STATIC_MODIFIER_NAME_mlo_topple_the_old_rival_florence_mod: "Arno Üzerinde Gün Batımı"
 STATIC_MODIFIER_DESC_mlo_topple_the_old_rival_florence_mod: "Uzun süreli rakip Floransa’yı yenmenin şanı dukalığın görkemini yükseltti."
 STATIC_MODIFIER_NAME_mlo_between_two_authorities_mod: "Güçler Arasında Diplomasi"
 STATIC_MODIFIER_DESC_mlo_between_two_authorities_mod: "Milano diplomasisini, Kutsal Roma İmparatoru, Papa ve Fransa Kralı olmak üzere üç otoriteden de eşit mesafeyi koruyarak yönlendirdi. Sforza diplomatları “güç dengesi” kavramını uyguladı ve kuzey İtalya’ya uzun bir göreli barış getirdi."
 STATIC_MODIFIER_NAME_mlo_reconcile_with_the_papacy_mod: "Papalıkla Barış"
 STATIC_MODIFIER_DESC_mlo_reconcile_with_the_papacy_mod: "Papalıkla uzlaşma dukalık içinde inanç istikrarı getirdi."
 STATIC_MODIFIER_NAME_mlo_trust_of_the_emperor_mod: "İmparator’un Güveni"
 STATIC_MODIFIER_DESC_mlo_trust_of_the_emperor_mod: "İmparator’un güveni dukalığın İmparatorluk içindeki konumunu yükseltti."
 STATIC_MODIFIER_NAME_mlo_overture_to_france_mod: "Fransa ile Dostluk"
 STATIC_MODIFIER_DESC_mlo_overture_to_france_mod: "Fransa Krallığı ile diplomatik bağlar iki devlet arasındaki dostluğu derinleştirdi."
 STATIC_MODIFIER_NAME_mlo_the_italian_wars_mod: "İtalya Savaşları Deneyimi"
 STATIC_MODIFIER_DESC_mlo_the_italian_wars_mod: "İtalya Savaşları’ndan sağ çıkmak ordunun geleneğini besledi."
 STATIC_MODIFIER_NAME_mlo_isolate_papal_authority_mod: "Papa’dan Bağımsızlık"
 STATIC_MODIFIER_DESC_mlo_isolate_papal_authority_mod: "Papa’nın dünyevî otoritesinden uzaklık sapkınlara hoşgörüyü artırdı."
 STATIC_MODIFIER_NAME_mlo_deny_imperial_authority_mod: "İmparator’dan Bağımsızlık"
 STATIC_MODIFIER_DESC_mlo_deny_imperial_authority_mod: "İmparatorluk otoritesine güvenmeyen yönetim dukalık içinde istikrar getirdi."
 STATIC_MODIFIER_NAME_mlo_repel_french_authority_mod: "Fransa’dan Bağımsızlık"
 STATIC_MODIFIER_DESC_mlo_repel_french_authority_mod: "Fransız müdahalesinin püskürtülmesi ordunun morali yükseltti."
 STATIC_MODIFIER_NAME_mlo_italian_independence_mod: "Kendine Güvenen İtalyan Gücü"
 STATIC_MODIFIER_DESC_mlo_italian_independence_mod: "Hiçbir büyük güce bağımlı olmadan durmak hem Dük’ün görkemini hem meşruiyetini yükseltti."
 STATIC_MODIFIER_NAME_mlo_who_achieves_all_things_mod: "Her Şeyi Başaran Dük"
 STATIC_MODIFIER_DESC_mlo_who_achieves_all_things_mod: "“Her şeyi yapan” (Chi tutte cose fa): Sforza’ların sloganı salt bir övünme değil, Rönesans’ın “evrensel insan” idealinin siyasi ifadesiydi. Askerî fatih ve sanatın büyük hamisi, kanun koyucu ve ticaretin yetiştiricisi: Milano Dukalığı’nın zirvesi İtalyan Rönesansı’nın siyasi doruğunu somutlaştırır."
 mlo_events.1.t: "Biscione Efsanesi"
 mlo_events.1.d: "Visconti arması bir adamı yutan tek bir yılan taşır: biscione. Bazıları bunun Haçlı Seferleri’ndeki bir yiğitlik eylemini andırdığını söyler; diğerleri fethedilmiş bir kâfiri simgelediğini iddia eder. Gerçek ne olursa olsun, amblem kuzey İtalya’nın dört bir yanına ailenin gücünün ve Milano şehir devletinin artık yalnızca yerel bir lordun meselesi olmadığını ilan eder. Dük’ün önünde şimdi birçok yol uzanıyor: devlet adamının yolu, fatihin yolu ve büyük güçler arasında yürüyen diplomatın yolu."
 mlo_events.1.a: "Milano’ya yeni bir çağ geldi"
 mlo_events.2.t: "1337’de Milano"
 mlo_events.2.d: "1337 itibarıyla Milano Luchino Visconti ile kardeşi Başpiskopos Giovanni Visconti’nin ortak yönetimi altında duruyor. Selefleri Azzone zamanında İmparator IV. Ludwig tarafından İmparatorluk Vekili unvanı verildi ve Milano’nun yönetimine İmparatorluğun otoritesini kazandırdı. Kuzey İtalya genelinde güçlü lordlar hüküm sürüyor ve birbirleriyle yarışıyor: Verona’nın della Scala’ları, Mantova’nın Gonzaga’ları, Ferrara’nın Este’leri ve daha fazlası. Papa Avignon’da otururken ve İmparator’un gücü Alpler’in kuzeyinde yoğunlaşmışken kuzey İtalya’nın kaderine karar verecek olan Lombardiya üzerindeki üstünlüğü ele geçiren olacak."
 mlo_events.2.a: "Milano’nun temelleri anlaşıldı"
 mlo_events.3.t: "Castello Sforzesco’nun Tarihi"
 mlo_events.3.d: "Milano’nun kalesi Corte dell’Arengo olarak bilinen Visconti’lerin inşa ettiği bir kaleyle başladı. Dükalık hattı 1447’de Filippo Maria Visconti’nin ölümüyle sona erdiğinde vatandaşlar Ambrosian Cumhuriyeti’ni ilan etti ve devirdikleri eski hükümdarların simgesi olan kalenin çoğunu yıktı. Ama 1450’de cumhuriyetin kaosuna son veren ve dük unvanını üstlenen Francesco Sforza kendi otoritesini ilan etmek için kalenin eskisinden daha görkemli biçimde yeniden inşa edilmesini emretti. O zamandan beri Castello Sforzesco Milano’da dükalık gücünün makamı olarak durdu ve görkemi hiç sönmedi."
 mlo_events.3.a: "Bu tarihin ağırlığı anlaşıldı"
 mlo_castello_sforzesco_building: "Castello Sforzesco"
 mlo_castello_sforzesco_building_desc: "Francesco Sforza’nın yeniden inşa ettiği, Milano’da dükalık gücünün simgesi olarak duran bir kale. Başkentte bulunduğunda kültürel geleneği, kültürel nüfuzu ve tacın gücünü pekiştirir."
 STATIC_MODIFIER_NAME_mlo_serpent_reward_mod: "Biscione’nin Yönetimi"
 STATIC_MODIFIER_DESC_mlo_serpent_reward_mod: "Visconti yılan amblemi (Biscione), bir adamı yutan yılan, Milano’nun gücünün ve emelinin simgesidir. Efsaneye göre Visconti’lerin bir atası onu bir Sarazen şövalyesiyle düelloda kazanmıştı. İtalyan birliğinin tamamlanması yılanın nihayet tüm toprağı yuttuğu anlamına gelir."
