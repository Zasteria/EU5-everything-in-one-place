l_turkish:
 mon_montferrat_mission_pack: "Paleologos Emeli ve İtalya’nın Efendisi"
 mon_montferrat_mission_pack_DESCRIPTION:0 "1337’de Monferrato Markgrafilik’i damarlarında Bizans’ın Paleologos hanedanının kanını taşıyan bir lord tarafından yönetiliyor. Selanik’i sahiplen ve İstanbul’a doğru doğuya yürü ya da diplomasi ve kondotyerin kılıcıyla kuzey İtalya’da bir imparatorluk dök: tek bir hükümdarda iki emel yanıyor."
 mon_montferrat_mission_pack_CRITERIA_DESCRIPTION:0 "Doğu hayali ya da batı egemenliği: Paleologos kanı iki yolu da açar."
 mon_montferrat_mission_pack_BUTTON_TOOLTIP:0 "İtalya’yı ve Yunanistan’ı fethetmek için Paleologos kanını kullan."
 mon_montferrat_mission_pack_BUTTON_DETAILS:0 "Paleologos adı altında Selanik’ten Atina’ya, çelik ve parayla Casale’den Cenova’ya: Doğu’yu ve Batı’yı fethet!"
 mon_palaiologos_ambition: "Paleologos Emeli"
 mon_palaiologos_ambition_desc: "Monferrato’nun hükümdarı Paleologos kanını taşıyor. İki emel yanıyor: doğuya Selanik’e doğru ya da batıya İtalyan egemenliğine doğru."
 mon_claim_thessaloniki: "Selanik Üzerinde Hak İddiası"
 mon_claim_thessaloniki_desc: "Bir zamanlar Bizans’ın ikinci şehri olan Selanik’i doğu emelleri için bir tutunak olarak sahiplen."
 mon_seize_thessaloniki: "Selanik’i Ele Geçir"
 mon_seize_thessaloniki_desc: "Selanik’i ele geçir ve Paleologos sancağını Beyaz Kule’ye dik."
 mon_conquer_macedonia: "Makedonya’nın Fethi"
 mon_conquer_macedonia_desc: "Yunanistan’a açılan kapı ve Büyük İskender’in doğum yeri Makedonya’yı fethet."
 mon_northern_greece: "Kuzey Yunanistan"
 mon_northern_greece_desc: "Daha fazla genişleme için temel olarak kuzey Yunanistan’ı güvenceye al."
 mon_conquer_morea: "Mora’nın Fethi"
 mon_conquer_morea_desc: "Mora’yı ve Atina’yı, kadim Yunan medeniyetinin kalbini fethet."
 mon_aegean_control: "Ege’yi Denetle"
 mon_aegean_control_desc: "Monferrato’nun deniz erişimini genişletmek için Ege adalarını ele geçir."
 mon_new_byzantium: "Yeni Bizans"
 mon_new_byzantium_desc: "Bizans mirasını sahiplen ve Doğu Roma’nın halefi olarak tanın."
 mon_secure_piedmont: "Piyemonte’yi Güvenceye Al"
 mon_secure_piedmont_desc: "Kuzey İtalya hâkimiyetinin temeli olarak Piyemonte’yi güvenceye al."
 mon_casale_capital: "Casale Monferrato"
 mon_casale_capital_desc: "Casale Monferrato’yu Markgrafilik’in layık bir başkentine dönüştür."
 mon_rival_savoy: "Rakip Savoya"
 mon_rival_savoy_desc: "Piyemonte hâkimiyeti için rakip Savoya’ya karşı koy ve üstünlük kur."
 mon_control_lombardy: "Lombardiya’yı Denetle"
 mon_control_lombardy_desc: "Kuzey İtalya’nın kalbi Lombardiya’yı fethet."
 mon_seize_genoa: "Cenova’yı Ele Geçir"
 mon_seize_genoa_desc: "La Superba Cenova’yı ele geçir ve Akdeniz ticaretine erişim kazan."
 mon_north_italy_trade: "Kuzey İtalya Ticaret İmparatorluğu"
 mon_north_italy_trade_desc: "Lombardiya’yı, Liguria’yı ve Veneto’yu kapsayan bir ticaret imparatorluğu inşa et."
 mon_emilia: "Emilia’nın Fethi"
 mon_emilia_desc: "Po Vadisi’nin bereketli güney yakasını fethet: Bologna, Parma ve Modena."
 mon_king_of_italy: "İtalya Kralı"
 mon_king_of_italy_desc: "Lombardiya’yı, Liguria’yı ve Emilia’yı birleştirdikten sonra İtalya Kralı’nı ilan et."
 mon_hre_relations: "KRİ İlişkileri"
 mon_hre_relations_desc: "Kutsal Roma İmparatorluğu ile ilişkiyi tanımla: müttefik, rakip ya da lider."
 mon_dev_casale: "Casale: İlim ve Servet Şehri"
 mon_dev_casale_desc: "Casale’yi Rönesans ile Bizans mirasının birleştiği bir ilim ve servet şehrine dönüştür."
 mon_renaissance_court: "Rönesans Sarayı"
 mon_renaissance_court_desc: "Bizans klasik bilgisi ile İtalyan sanatsal yeniliğinin kaynaştığı bir Rönesans sarayı yarat."
 mon_mercenary_tradition: "Kondotyer Geleneği"
 mon_mercenary_tradition_desc: "Kondotyer geleneğini inşa et: Monferrato’nun paralı askerî mirası."
 mon_papal_alliance: "Papalık İttifakı"
 mon_papal_alliance_desc: "Monferrato’nun İtalya genelindeki emellerini meşrulaştırmak için Papa ile ittifak kur."
 mon_tuscany: "Toskana’nın Fethi"
 mon_tuscany_desc: "Medici Rönesans kültürünün yurdu Toskana’yı fethet ve Roma’ya doğru ilerle."
 mon_veneto: "Veneto’nun Fethi"
 mon_veneto_desc: "Kuzey İtalya hâkimiyetini tamamlamak için Venedik dahil Veneto’yu fethet."
 mon_byzantine_heritage: "Bizans Mirası"
 mon_byzantine_heritage_desc: "Tüm Bizans mirasını sahiplen: Yunan kültüründe ve Ortodoksluk’ta daha büyük ödüller kazan."
 mon_navy_adriatic: "Adriyatik Filosu"
 mon_navy_adriatic_desc: "Ceneviz ve Venedik deniz gücünü birleştiren güçlü bir Adriyatik filosu inşa et."
 mon_southern_italy: "Güney İtalya"
 mon_southern_italy_desc: "İtalya Yarımadası’nı birleştirmek için güney İtalya’ya ilerle ve Napoli’yi ele geçir."
 mon_marquis_of_italy: "İtalya Büyük Markisi"
 mon_marquis_of_italy_desc: "İtalya Büyük Markisi olarak hüküm sür: Doğu’yu ve Batı’yı, Kuzey’i ve Güney’i birleştirerek."
 mon_new_roman_empire: "Yeni Roma İmparatorluğu"
 mon_new_roman_empire_desc: "Hem Doğu hem Batı Roma’sının halefi olan Yeni Roma İmparatorluğu’nu ilan et."
 mon_events.10.t: "Selanik’i Ele Geçir: Beyaz Kule Üzerinde Paleologos Sancağı"
 mon_events.10.d: "Bir zamanlar Bizans İmparatorluğu’nun ikinci şehri olan Selanik şimdi Monferrato’ya düşüyor. Paleologos kanlı hükümdar doğu emellerini gerçeğe dönüştürmeye başlıyor. Beyaz Kule’nin çanları çalıyor: yeni bir çağ başladı."
 mon_events.10.a: "Selanik çok yaşasın! Paleologos sancağı altında!"
 mon_events.20.t: "İtalya Kralı: Casale’den Kutsal Şehir’e Zafer"
 mon_events.20.d: "“İtalya Kralı”: Lombardiya’yı, Liguria’yı ve Emilia’yı birleştiren Monferrato İtalya Yarımadası’nın yeni efendisi ilan edildi. Casale sarayında tezahüratlar yankılanıyor."
 mon_events.20.a: "İtalya Kralı çok yaşasın!"
 mon_events.50.t: "Yeni Bizans’ın Doğuşu: Paleologos Hayali Gerçekleşti"
 mon_events.50.d: "“Paleologos İmparatoru: Roma’nın ve İstanbul’un halefi”: Monferrato Bizans adını miras alıyor. Küçük bir kuzey İtalyan markgrafilik’ten başlayan yolculuk Doğu Akdeniz’e hâkim olma yoluna girdi."
 mon_events.50.a: "Paleologos İmparatoru çok yaşasın! Yeni Bizans çok yaşasın!"
 mon_events.60.t: "İtalya Büyük Markisi: Doğu ile Batı’nın Kavşağında Hüküm Sürmek"
 mon_events.60.d: "Casale Monferrato’dan Cenova’ya, Floransa’ya, Napoli’ye: Monferrato İmparatorluğu doğuyor. Rönesans sanatı, Bizans ruhu, kondotyer kılıcı: üç güç İtalya’nın efendisini yaratmak için kaynaştı."
 mon_events.60.a: "İtalya Büyük Markisi çok yaşasın!"
 mon_events.99.t: "Yeni Roma İmparatorluğu: Doğu ile Batı’nın Birleştiricisi"
 mon_events.99.d: "“Paleologos İmparatoru: Doğu ve Batı Roma’sının halefi, İtalya Kralı, Yunanistan Lordu”: bu unvan Akdeniz dünyasında yankılanıyor. 1337’de Casale’nin küçük sarayında filizlenen emel şimdi bir dünya imparatorluğunun inşasında doruğa ulaşıyor. Roma’nın adı yeniden kuruldu."
 mon_events.99.a: "Yeni Roma İmparatorluğu çok yaşasın! Ebedî şan çok yaşasın!"
 STATIC_MODIFIER_NAME_mon_palaiologos_mod: "Paleologos"
 STATIC_MODIFIER_DESC_mon_palaiologos_mod: "Paleologos soyu Monferrato’nun Doğu’ya ve Batı’ya yönelik emellerini uyandırıyor."
 STATIC_MODIFIER_NAME_mon_thessaloniki_claim_mod: "Selanik Üzerinde Hak İddiası"
 STATIC_MODIFIER_DESC_mon_thessaloniki_claim_mod: "Selanik çağırıyor: Paleologos sancağı yakında Ege üzerinde dalgalanacak."
 STATIC_MODIFIER_NAME_mon_macedonia_mod: "Makedonya"
 STATIC_MODIFIER_DESC_mon_macedonia_mod: "Makedonya fethedildi: Yunanistan’a açılan kapı ve Büyük İskender’in doğum yeri."
 STATIC_MODIFIER_NAME_mon_northern_greece_mod: "Kuzey Yunanistan"
 STATIC_MODIFIER_DESC_mon_northern_greece_mod: "Kuzey Yunanistan güneye daha fazla genişleme için temel olarak güvenceye alındı."
 STATIC_MODIFIER_NAME_mon_morea_mod: "Mora"
 STATIC_MODIFIER_DESC_mon_morea_mod: "Mora ve Atina fethedildi: kadim Yunan medeniyetinin kalbi yeniden kuruldu."
 STATIC_MODIFIER_NAME_mon_aegean_mod: "Ege"
 STATIC_MODIFIER_DESC_mon_aegean_mod: "Ege adaları ele geçirildi ve Monferrato’nun deniz erişimini Akdeniz’e uzattı."
 STATIC_MODIFIER_NAME_mon_piedmont_mod: "Piyemonte"
 STATIC_MODIFIER_DESC_mon_piedmont_mod: "Piyemonte güvence altına alındı: kuzey İtalya’nın seferberlik kuvvetleri artık Monferrato sancağı altında yürüyor."
 STATIC_MODIFIER_NAME_mon_casale_mod: "Casale"
 STATIC_MODIFIER_DESC_mon_casale_mod: "Casale Monferrato Markgrafilik’in ticaret kalbi olarak atıyor."
 STATIC_MODIFIER_NAME_mon_savoy_mod: "Savoya"
 STATIC_MODIFIER_DESC_mon_savoy_mod: "Piyemonte hâkimiyeti için rakip Savoya karşılandı ve bastırıldı."
 STATIC_MODIFIER_NAME_mon_lombardy_mod: "Lombardiya"
 STATIC_MODIFIER_DESC_mon_lombardy_mod: "Kuzey İtalya’nın kalbi Lombardiya Monferrato’nun denetimine düşüyor."
 STATIC_MODIFIER_NAME_mon_genoa_mod: "Cenova"
 STATIC_MODIFIER_DESC_mon_genoa_mod: "La Superba Cenova ele geçirildi: Akdeniz ticaretine açılan kapı ardına kadar açılıyor."
 STATIC_MODIFIER_NAME_mon_trade_mod: "Ticaret"
 STATIC_MODIFIER_DESC_mon_trade_mod: "Lombardiya’yı, Liguria’yı ve Veneto’yu kapsayan bir ticaret imparatorluğu inşa edildi."
 STATIC_MODIFIER_NAME_mon_emilia_mod: "Emilia"
 STATIC_MODIFIER_DESC_mon_emilia_mod: "Po Vadisi’nin bereketli güney yakası, Bologna, Parma, Modena, fethedildi."
 STATIC_MODIFIER_NAME_mon_hre_mod: "KRİ"
 STATIC_MODIFIER_DESC_mon_hre_mod: "Kutsal Roma İmparatorluğu ile ilişki tanımlandı: Monferrato diplomatik itibar kazanıyor."
 STATIC_MODIFIER_NAME_mon_casale_dev_mod: "Casale Gelişimi"
 STATIC_MODIFIER_DESC_mon_casale_dev_mod: "Casale ilmin ve servetin altın çağına giriyor: kuzey İtalya’nın kültür feneri."
 STATIC_MODIFIER_NAME_mon_renaissance_mod: "Rönesans"
 STATIC_MODIFIER_DESC_mon_renaissance_mod: "Bir Rönesans sarayı yaratıldı: Bizans klasik bilgisi İtalyan sanatsal yeniliğiyle kaynaşıyor."
 STATIC_MODIFIER_NAME_mon_condottieri_mod: "Kondotyerler"
 STATIC_MODIFIER_DESC_mon_condottieri_mod: "Monferrato’nun kondotyerleri efsane oldu: seçkin askerler sancaklarının altında toplanıyor ve İtalya’nın savaş alanlarına hâkim oldu."
 STATIC_MODIFIER_NAME_mon_papal_mod: "Papalık"
 STATIC_MODIFIER_DESC_mon_papal_mod: "Papa’nın duası Monferrato’nun İtalya Yarımadası genelindeki emellerini meşrulaştırıyor."
 STATIC_MODIFIER_NAME_mon_tuscany_mod: "Toskana"
 STATIC_MODIFIER_DESC_mon_tuscany_mod: "Medici Rönesans kültürünün yurdu Toskana fethedildi ve güvenceye alındı."
 STATIC_MODIFIER_NAME_mon_veneto_mod: "Veneto"
 STATIC_MODIFIER_DESC_mon_veneto_mod: "Venedik dahil Veneto fethedildi: kuzey İtalya hâkimiyeti tamam."
 STATIC_MODIFIER_NAME_mon_heritage_mod: "Miras"
 STATIC_MODIFIER_DESC_mon_heritage_mod: "Tüm Bizans mirası sahiplenildi: bürokrasi, su kemerleri ve meşruiyet antik Roma’dan akıyor."
 STATIC_MODIFIER_NAME_mon_navy_mod: "Donanma"
 STATIC_MODIFIER_DESC_mon_navy_mod: "Ceneviz ve Venedik deniz gücünü birleştiren güçlü bir Adriyatik filosu inşa edildi."
 STATIC_MODIFIER_NAME_mon_southern_italy_mod: "Güney İtalya"
 STATIC_MODIFIER_DESC_mon_southern_italy_mod: "Güney İtalya ve Napoli ele geçirildi: İtalya Yarımadası tek bir sancak altında birleşti."
 STATIC_MODIFIER_NAME_mon_marquis_final_mod: "Büyük Markis"
 STATIC_MODIFIER_DESC_mon_marquis_final_mod: "İtalya Büyük Markisi hüküm sürüyor: Doğu’yu ve Batı’yı, Kuzey’i ve Güney’i birleştirerek."
 STATIC_MODIFIER_NAME_mon_new_roman_mod: "Yeni Roma"
 STATIC_MODIFIER_DESC_mon_new_roman_mod: "Hem Doğu hem Batı Roma’sının halefi olan Yeni Roma İmparatorluğu ilan edildi."
 mon_carta_di_franchigia: "Carta di Franchigia"
 mon_carta_di_franchigia_desc: "Carta di Franchigia: “Özgürlük Fermanı”. Monferrato Markisi her şehre özerklik ve ayrıcalıklar vererek tüccarların, köylülerin ve vatandaşların gelişmesi için verimli bir zemin yaratır. Casale’nin bir zamanlar böyle bir fermanla çiçek açması gibi tüm markgrafilik bu nimetlerden yararlanacak."
 mon_carta_di_franchigia_unlock_tt: "“Carta di Franchigia” şehir ayrıcalığı kullanılabilir olur."
 mon_acqui_terme: "Acqui Terme’nin Gelişimi"
 mon_acqui_terme_desc: "Acqui Terme: antik Roma zamanlarından beri “kaplıca şehri” olarak ünlüdür. Ünlü sularını yeniden kur. Bir zamanlar Roma imparatorlarının ziyaret ettiği şifalı kaynaklar Monferrato’nun yeni gururu olacak ve uzaklardan ziyaretçileri çeken bir sağlık şehri olarak yeniden doğacak."
 STATIC_MODIFIER_NAME_mon_acqui_terme_mod: "Acqui Terme Yeniden Kuruldu"
 STATIC_MODIFIER_DESC_mon_acqui_terme_mod: "Antik Roma kaplıcaları yeniden kuruldu: Acqui bir sağlık ve refah şehri olarak yeniden doğdu."
 STATIC_MODIFIER_NAME_mon_heritage_basic_mod: "Bizans’ın Solan Işığı"
 STATIC_MODIFIER_DESC_mon_heritage_basic_mod: "Bizans mirası Monferrato’yu aydınlatıyor: meşruiyeti sessizce yükselmeye başlıyor."
 STATIC_MODIFIER_NAME_mon_new_byzantium_mod: "Yeni Bizans’ın Ihtişamı"
 STATIC_MODIFIER_DESC_mon_new_byzantium_mod: "Paleologos hayali gerçekleşti: imparatorluk idaresi, deniz gücü ve yol ağları Monferrato’nun gücü olarak billurlaştı."
