l_turkish:
 hol_holland_mission_pack: "Gerçek Özgürlük: Hollanda Kontluğu’ndan Birleşik Eyaletler’e"
 hol_holland_mission_pack_DESCRIPTION:0 "Avesnes Hanedanı’nca yönetilen Hollanda Kontluğu: Hansa Birliği’ne karşı zafer kazan, Hainaut’yu ve Brabant’ı özümse, İspanyol zulmünden bağımsızlık kazan ve monarşisiz gerçek bir cumhuriyet olarak bir altın çağ inşa et."
 hol_holland_mission_pack_CRITERIA_DESCRIPTION:0 "Kontluğu birleştir, bağımsızlık kazan ve Eyalet Meclisi egemenliği altında bir cumhuriyet olarak altın çağa ulaş."
 hol_holland_mission_pack_BUTTON_TOOLTIP:0 "Küçük bir kontluktan ticaretin ve özgürlüğün birleşik bir cumhuriyetine."
 hol_holland_mission_pack_BUTTON_DETAILS:0 "“Birlikten kuvvet doğar”: Düşük Ülkeler genelinde monarşisiz gerçek bir cumhuriyet inşa et!"
 hol_county_of_holland: "Hollanda Kontluğu"
 hol_county_of_holland_desc: "Düşük Ülkeler’in kalbindeki, su yolları ve ticaretle kutsanmış Hollanda Kontluğu: Avesnes Hanedanı’ndan yaşlanan Kont III. Willem saltanatının sonuna yaklaşıyor."
 hol_secure_dordrecht: "Dordrecht’i Geliştir"
 hol_secure_dordrecht_desc: "Ren ile Meuse’un birleştiği yerdeki kadim ticaret şehri Dordrecht: verilen antrepo hakkı üzerine inşa et ve daha fazla gelişim getir."
 hol_hoekse_kabeljauwse: "Çengeller ve Morinalar"
 hol_hoekse_kabeljauwse_desc: "Soylu Çengel hizbi ve şehirli Morina hizbi: kontluğu kont veraseti üzerinden bölen bu iç çekişmeyi bastır ve istikrarlı bir yönetim kur."
 hol_zeeland_unification: "Zelanda’yı Birleştir"
 hol_zeeland_unification_desc: "Kuzey Denizi’ne dağılmış adalar diyarı Zelanda: bu bölgeyi kontluğun egemenlik alanına kat."
 hol_frisian_freedom: "Batı Frizya Özgürlüğü"
 hol_frisian_freedom_desc: "Özerkliğine değer veren Batı Frizya halkı: onlara kontluğun sancağı altında özgürlük ver."
 hol_utrecht_relations: "Utrecht ile İlişkiler"
 hol_utrecht_relations_desc: "Geniş dünyevî güç kullanan Utrecht Piskoposluğu: bu komşuyla ilişkileri nüfuzumuz altında kur."
 hol_wittelsbach_inheritance: "Hainaut ile Birlik"
 hol_wittelsbach_inheritance_desc: "İmparator IV. Ludwig ile evli Prenses Margaret aracılığıyla komşu Hainaut Kontluğu ile bağı derinleştir: evlilik, boyun eğdirme ya da soyunun tükenmesi yoluyla Hollanda’yı, Zelanda’yı ve Hainaut’yu tek bir sancak altında birleştir."
 hol_herring_industry: "Ringa Sanayisini Geliştir"
 hol_herring_industry_desc: "“Büyük Balıkçılık” (grote visserij) olarak bilinen ringa avcılığı: bu büyük sanayiyi tuzlama sanatıyla birlikte daha da geliştir."
 hol_hansa_rivalry: "Hansa ile Rekabet"
 hol_hansa_rivalry_desc: "Baltık ticaretine hâkim olan Hansa Birliği: ucuz navlun ve verimli ticaret gemileriyle donanmış olarak bu köklü birliğe karşı zafer kazan."
 hol_amsterdam_rise: "Amsterdam’ın Yükselişi"
 hol_amsterdam_rise_desc: "IJ üzerindeki küçük bir balıkçı köyü Amsterdam: bu yeri Kuzey Denizi ticaretinin büyük bir merkezi olarak geliştir."
 hol_moedernegotie: "Ana Ticaret (Moedernegotie)"
 hol_moedernegotie_desc: "Baltık tahıl ticareti: “tüm ticaretin anası” denen bu ticarete hâkim ol ve onu refahın temeli yap."
 hol_contest_brabant: "Brabant’a Yönelik Emeller"
 hol_contest_brabant_desc: "Düşük Ülkeler’in diğer büyük gücü Brabant Dukalığı: emelin gözünü bu topraklara çevir."
 hol_absorb_brabant: "Brabant’ın Özümsenmesi"
 hol_absorb_brabant_desc: "Brabant Dukalığı’nı ilhak et ya da boyun eğdir: Düşük Ülkeler’in efendisinin Brabant değil Hollanda olduğunu kanıtla."
 hol_reformation_choice: "Reform Tercihi"
 hol_reformation_choice_desc: "Luther’in ve Kalvin’in öğretileri Düşük Ülkeler’i sarsıyor: inancın bu kavşağında hangi yolu seçeceğiz?"
 hol_calvinist_merchants: "Kalvinist Tüccarlar"
 hol_calvinist_merchants_desc: "Tutumlu ve disiplinli bir inancı vaaz eden Kalvinizm: tüccar burjuvazisinin gönlünü kazanan bu inancı devlet dini olarak kabul et."
 hol_union_of_utrecht: "Utrecht Birliği"
 hol_union_of_utrecht_desc: "Düşük Ülkeler’in kuzey eyaletlerinin oluşturduğu Utrecht Birliği: onun çekirdeği olarak dur ve ortak düşmanla yüzleş."
 hol_watergeuzen: "Deniz Dilencileri (Watergeuzen)"
 hol_watergeuzen_desc: "Kendilerine “Deniz Dilencileri” diyen korsanlar: kahramanlıkları İspanya’nın denizlere hâkimiyetinde delikler açıyor."
 hol_dutch_republic_proper: "Gerçek Cumhuriyeti Kur"
 hol_dutch_republic_proper_desc: "Eşit olarak duran yedi eyaletin federasyonu: burada monarşisiz, tüccarların ve vatandaşların gerçek bir cumhuriyetini kur."
 hol_east_india_company: "Doğu Hindistan Şirketi’ni Kur"
 hol_east_india_company_desc: "Asya ticaretinde tekel hedefleyen Birleşik Doğu Hindistan Şirketi’ni (VOC) kur."
 hol_amsterdam_bank: "Amsterdam Bankası"
 hol_amsterdam_bank_desc: "Rakip para birimlerinin kaosuna düzen getirmek için Takas Bankası’nı (Wisselbank) kur ve istikrarlı bir kredi sistemi inşa et."
 hol_stock_exchange: "Amsterdam Borsası"
 hol_stock_exchange_desc: "Hisselerin alınıp satıldığı dünyanın ilk borsası: bu yeri Avrupa maliyesinin merkezi yap."
 hol_dutch_golden_age: "Hollanda Altın Çağı"
 hol_dutch_golden_age_desc: "Rembrandt, Vermeer ve gelişen ticaret: “Hollanda Altın Çağı”nın zirvesine ulaş."
 hol_estates_of_holland: "Hollanda Eyalet Meclisi"
 hol_estates_of_holland_desc: "Şehir temsilcilerinden oluşan Hollanda Eyalet Meclisi: bu meclisi cumhuriyetçi yönetimin çekirdeği yap."
 hol_regent_oligarchy: "Regent Oligarşisi"
 hol_regent_oligarchy_desc: "“Regenten”, yani zengin tüccar patrisyen aileler: oligarşik yönetimlerini cumhuriyetin gerçek yönetim yapısı olarak kur."
 hol_stadtholderless_era: "Stadtholder’sız Dönem (Gerçek Özgürlük)"
 hol_stadtholderless_era_desc: "Eyalet Meclisi’nin egemenliği elinde tuttuğu Stadtholder’sız bir dönem: Johan de Witt’in ilan ettiği “Gerçek Özgürlük”ü somutlaştır."
 hol_states_sovereignty: "Eyalet Meclisi Egemenliğini Kur"
 hol_states_sovereignty_desc: "Monarşisiz bir cumhuriyet: egemenliğinin doğasını kalıcı bir kurum olarak kur."
 hol_anglo_dutch_rivalry: "İngiliz-Hollanda Rekabeti"
 hol_anglo_dutch_rivalry_desc: "Denizcilik ticaretinde hâkimiyet için İngiltere ile rekabet: Seyrüsefer Yasaları’yla simgelenen bu mücadeleyle yüzleş."
 hol_navigation_act_response: "Seyrüsefer Yasası’na Karşılık Ver"
 hol_navigation_act_response_desc: "İngiliz Seyrüsefer Yasası: bu korumacı yasaya karşı koy ve ticaret filomuzu savun."
 hol_channel_trade_dominance: "Manş Ticaretine Hâkimiyet"
 hol_channel_trade_dominance_desc: "Kuzey Denizi’ni Atlantik’e bağlayan boğaz: bu hayati su yolu üzerinde deniz ve ticaret üstünlüğü kur."
 hol_french_relations: "Fransa ile İlişkiler"
 hol_french_relations_desc: "Güneş Kral XIV. Louis’nin emelleri: bu güçlü komşuyla ilişkilere dikkatle özen göster."
 hol_rampjaar_survival: "Felaket Yılı’ndan (Rampjaar) Sağ Çık"
 hol_rampjaar_survival_desc: "1672’de İngiltere ve Fransa’nın eşzamanlı istilasıyla vurulan: ulusun varlığını tehdit eden bu “Felaket Yılı”na dayan."
 hol_glorious_revolution: "Güneş Kral’a Karşı Zafer"
 hol_glorious_revolution_desc: "Felaket Yılı’na dayanan Cumhuriyet artık saldırıya geçiyor: ordularımızı Fransız topraklarının derinliklerine it ve Güneş Kral XIV. Louis’ye emellerinin bedelini ödet."
 hol_united_provinces: "Hollanda Birleşik Eyaletleri"
 hol_united_provinces_desc: "Kontluğun temellerinden bağımsızlık savaşından ve bir altın çağdan geçerek burada gerçek bir cumhuriyet tamamlanır."
 hol_events.2.t: "Birleşik Eyaletler’in İlanı"
 hol_events.2.d: "Eşit olarak duran yedi eyaletin federasyonu: monarşisiz, tüccarların ve vatandaşların gerçek bir cumhuriyeti ilk nefesini alıyor."
 hol_events.2.a: "Cumhuriyete şeref!"
 hol_events.3.t: "Felaket Yılı (Rampjaar)"
 hol_events.3.d: "1672: Fransa’nın, İngiltere’nin, Münster’in ve Köln’ün eşzamanlı istilası. “Halk mantıksız, hükümet çaresiz, ülke umutsuz” diye anılan bu krize dayandık."
 hol_events.3.a: "Cumhuriyet ayakta kaldı!"
 hol_events.4.t: "Güneş Kral’a Karşı Zafer"
 hol_events.4.d: "Fransız topraklarının derinliklerine ilerleyen ordularımız nihayet XIV. Louis’nin emellerini kırdı. Cumhuriyet’in adı artık Avrupa’nın büyük bir gücü olarak geniş çapta bilinecek."
 hol_events.4.a: "Cumhuriyete şeref!"
 hol_events.5.t: "Hollanda Eyalet Meclisi İçin Bir Kavşak"
 hol_events.5.d: "Eyalet Meclisi cumhuriyetin yönetim biçimi üzerinde kaderî bir seçimle karşı karşıya: bir Stadtholder altında monarşik bir düzene mi yönelecek, yoksa vatandaşların ve tüccarların gerçek cumhuriyetine mi sıkı sıkıya bağlı kalacak."
 hol_events.5.a: "Otoriteyi Orange Hanedanı’nda topla"
 hol_events.5.b: "Cumhuriyeti Eyalet Meclisi egemenliği altında savun"
 hol_events.99.t: "Birleşik Eyaletler Tamam"
 hol_events.99.d: "Hollanda Kontluğu’nda başlayıp bağımsızlık savaşından ve altın çağdan geçen uzun yol burada gerçek bir cumhuriyet olarak tamamlanıyor."
 hol_events.99.a: "Birleşik Eyaletler çok yaşasın!"
 STATIC_MODIFIER_NAME_hol_county_mod: "Hollanda Kontluğu"
 STATIC_MODIFIER_DESC_hol_county_mod: "Su yolları ve ticaretle beslenen bir kontluğun hatırası halkın gururu olarak yaşamayı sürdürüyor."
 STATIC_MODIFIER_NAME_hol_dordrecht_mod: "Dordrecht Geliştirildi"
 STATIC_MODIFIER_DESC_hol_dordrecht_mod: "Ren ile Meuse’un buluştuğu yerde Dordrecht’in ticaret gemileri yüklerini yükleyip boşaltmayı hiç bırakmıyor."
 STATIC_MODIFIER_NAME_hol_hoekse_mod: "Çengeller ve Morinalar"
 STATIC_MODIFIER_DESC_hol_hoekse_mod: "Bir zamanlar Çengel ve Morina sancaklarını taşıyanlar artık Kont’un safında birlikte yürüyor."
 STATIC_MODIFIER_NAME_hol_zeeland_mod: "Zelanda Birleşti"
 STATIC_MODIFIER_DESC_hol_zeeland_mod: "Middelburg’un kızaklarında adalardan toplanan kereste gemi gövdesi gemi gövdesi şekilleniyor."
 STATIC_MODIFIER_NAME_hol_frisian_mod: "Batı Frizya Özgürlüğü"
 STATIC_MODIFIER_DESC_hol_frisian_mod: "“Frizyalıların lordu yoktur”: saat gerektirdiğinde bu gururlu özerklik ruhu birçok kişiyi saflara toplar."
 STATIC_MODIFIER_NAME_hol_utrecht_mod: "Utrecht ile İlişkiler"
 STATIC_MODIFIER_DESC_hol_utrecht_mod: "Utrecht kulelerinin çanları kontluk ile piskoposluk arasında sessiz, samimi bir komşuluğu çalıyor."
 STATIC_MODIFIER_NAME_hol_wittelsbach_mod: "Hainaut ile Birlik"
 STATIC_MODIFIER_DESC_hol_wittelsbach_mod: "Bavyera’dan yeni bir hükümdar hattı Hollanda’nın, Zelanda’nın ve Hainaut’nun topraklarına düzen getiriyor."
 STATIC_MODIFIER_NAME_hol_absorb_brabant_mod: "Brabant Özümsendi"
 STATIC_MODIFIER_DESC_hol_absorb_brabant_mod: "Hollanda’nın armaları artık Brüksel sarayında asılı duruyor ve güney serveti Amsterdam’a istikrarla akıyor."
 STATIC_MODIFIER_NAME_hol_herring_mod: "Ringa Sanayisi Geliştirildi"
 STATIC_MODIFIER_DESC_hol_herring_mod: "Tuzlanmış ringa yüklü filolar Kuzey Denizi’nin dalgaları arasından birbiri ardına yollarını bularak eve dönüyor."
 STATIC_MODIFIER_NAME_hol_hansa_rivalry_mod: "Hansa ile Rekabet"
 STATIC_MODIFIER_DESC_hol_hansa_rivalry_mod: "Lübeck tüccarları kaş çatarken ucuz navlun ücretlerimiz Baltık genelindeki yük sahiplerini kazanıyor."
 STATIC_MODIFIER_NAME_hol_amsterdam_rise_mod: "Amsterdam’ın Yükselişi"
 STATIC_MODIFIER_DESC_hol_amsterdam_rise_mod: "Bir zamanlar IJ üzerinde küçük bir balıkçı köyü olan Amsterdam artık dünyanın her köşesinden yelkenli gemileri çekiyor."
 STATIC_MODIFIER_NAME_hol_moedernegotie_mod: "Ana Ticaret"
 STATIC_MODIFIER_DESC_hol_moedernegotie_mod: "Baltık’tan taşınan tahıl kıtlık yıllarında bile sofralarımızı ve hazinemizi dolu tutuyor."
 STATIC_MODIFIER_NAME_hol_reformation_mod: "Reform Tercihi"
 STATIC_MODIFIER_DESC_hol_reformation_mod: "Kilise çanlarının arasında eski ve yeni inançlar üzerine sessiz tartışmalar pazar meydanlarında hiç dinmiyor."
 STATIC_MODIFIER_NAME_hol_calvinist_mod: "Kalvinist Tüccarlar"
 STATIC_MODIFIER_DESC_hol_calvinist_mod: "İncil’in ilk elden okunup üzerinde düşünüldüğü tüccar evlerinde lambalar gece geç saatlere kadar yanıyor."
 STATIC_MODIFIER_NAME_hol_union_utrecht_mod: "Utrecht Birliği"
 STATIC_MODIFIER_DESC_hol_union_utrecht_mod: "Utrecht’te imzalanan pakt her kuzey eyaletinin sarıldığı umut oldu."
 STATIC_MODIFIER_NAME_hol_watergeuzen_mod: "Deniz Dilencileri"
 STATIC_MODIFIER_DESC_hol_watergeuzen_mod: "“Kralın adamlarından dilenci olmak yeğdir”: bu çığlığı akıllarında taşıyan denizcilerimiz bugün hâlâ İspanyol bayrağını avlıyor."
 STATIC_MODIFIER_NAME_hol_voc_mod: "Doğu Hindistan Şirketi"
 STATIC_MODIFIER_DESC_hol_voc_mod: "Batavia’dan gelen baharat kokusu Amsterdam’ın depo mahallesini dolduruyor."
 STATIC_MODIFIER_NAME_hol_wisselbank_mod: "Amsterdam Bankası"
 STATIC_MODIFIER_DESC_hol_wisselbank_mod: "Takas Bankası’nın kasalarında kilitli güven, bu şehrin tüccarlarının sahip olduğu en gerçek güvencedir."
 STATIC_MODIFIER_NAME_hol_wisselbank_capital_mod: "Takas Bankası’nın Başkenti"
 STATIC_MODIFIER_DESC_hol_wisselbank_capital_mod: "Hazinenin defterleri ve Takas Bankası’nın kasaları tek bir çatı altındayken devlet işleri daha da sorunsuz yürüyor."
 STATIC_MODIFIER_NAME_hol_exchange_mod: "Amsterdam Borsası"
 STATIC_MODIFIER_DESC_hol_exchange_mod: "Borsa zemininde hisse senetlerini sallayan simsarların çığlıkları hiç dinmiyor."
 STATIC_MODIFIER_NAME_hol_golden_age_mod: "Hollanda Altın Çağı"
 STATIC_MODIFIER_DESC_hol_golden_age_mod: "Rembrandt’ın fırçasının yakaladığı ışık ve gölge bu refah çağını gelecek nesillere anlatacak."
 STATIC_MODIFIER_NAME_hol_regent_mod: "Regent Oligarşisi"
 STATIC_MODIFIER_DESC_hol_regent_mod: "Zengin patrisyen ailelerin sessiz toplantıları cumhuriyetin gerçek kararlarının alındığı yerdir."
 STATIC_MODIFIER_NAME_hol_stadtholderless_mod: "Stadtholder’sız Dönem"
 STATIC_MODIFIER_DESC_hol_stadtholderless_mod: "Stadtholder’ın makamı boş duruyor: ve yine de devlet işleri her zamankinden daha sorunsuz yürüyor."
 STATIC_MODIFIER_NAME_hol_anglo_rivalry_mod: "İngiliz-Hollanda Rekabeti"
 STATIC_MODIFIER_DESC_hol_anglo_rivalry_mod: "Manş’ın karşısındaki rakibimizle tekrarlanan top ateşi alışverişleri denizcilerimizi pişmiş gazilere dönüştürdü."
 STATIC_MODIFIER_NAME_hol_navigation_act_mod: "Seyrüsefer Yasası’na Karşılık"
 STATIC_MODIFIER_DESC_hol_navigation_act_mod: "İngiltere’nin kararnamelerinden yılmayan ticaret filolarımız hâlâ ticaret yollarını açık tutan boşlukları buluyor."
 STATIC_MODIFIER_NAME_hol_channel_dominance_mod: "Manş Ticaretine Hâkimiyet"
 STATIC_MODIFIER_DESC_hol_channel_dominance_mod: "Kuzey Denizi ile Atlantik arasındaki dar boğazda bizim renklerimizi taşımayan bir gemi görmek nadir hâle geldi."
 STATIC_MODIFIER_NAME_hol_french_relations_mod: "Fransa ile İlişkiler"
 STATIC_MODIFIER_DESC_hol_french_relations_mod: "Güneş Kral’ın sarayından gelen tedirgin edici söylentiler sınır garnizonlarımızı daima tetikte tutuyor."
 STATIC_MODIFIER_NAME_hol_united_provinces_mod: "Hollanda Birleşik Eyaletleri"
 STATIC_MODIFIER_DESC_hol_united_provinces_mod: "Monarşisiz yedi eyaletin birliği adımızı dünyanın her denizinde ve pazarında tanıttı."
 STATIC_MODIFIER_NAME_hol_rampjaar_mod: "Felaket Yılı’ndan Sağ Çıkış"
 STATIC_MODIFIER_DESC_hol_rampjaar_mod: "“Halk mantıksız, hükümet çaresiz, ülke umutsuz”: bu hükmü silkeleyen askerlerimiz hatırayı gururla taşıyor."
 STATIC_MODIFIER_NAME_hol_glorious_revolution_mod: "Güneş Kral’a Karşı Zafer"
 STATIC_MODIFIER_DESC_hol_glorious_revolution_mod: "Ordumuzun Fransız topraklarının derinliklerine yürüyüşü hikâyeleri artık Avrupa’nın her sarayında gururla anlatılıyor."
 STATIC_MODIFIER_NAME_hol_republic_declared_mod: "Cumhuriyet İlan Edildi"
 STATIC_MODIFIER_DESC_hol_republic_declared_mod: "Vatandaşların ve tüccarların delegeleri artık hiçbir monarşiye hesap vermeyen bir salonda gururla toplanıyor."
