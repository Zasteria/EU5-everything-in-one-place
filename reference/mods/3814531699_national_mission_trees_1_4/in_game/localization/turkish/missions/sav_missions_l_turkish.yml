l_turkish:
 sav_house_of_savoy_mission_pack: "Savoya Hanedanı’nın Emelleri"
 sav_house_of_savoy_mission_pack_DESCRIPTION:0 "Alp geçitlerine komuta eden Savoya Hanedanı, küçük bir Piyemonte dukalığından tüm İtalya’nın ve güney Fransa’nın efendisi olmaya, İtalya Krallığı’nı kurmaya mukadderdir. Papa, İmparator ve Fransa arasında ustaca yön bul; deniz gücü kurmak için Cenova’yı fethet; Roma’yı sahiplenmek için Lombardiya’yı, Toskana’yı ve Venedik’i ez. Sardinya-Piyemonte olarak yüksel ve nihayet İtalyan birliğinin sancaktarı ol."
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION:0 "Savoya olarak Piyemonte’yi birleştir, İtalya’yı ve Fransa’yı fethet ve İtalya Krallığı’nı kur."
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP:0 "Savoya Hanedanı’nın emellerini gerçekleştirmek için görevleri tamamla."
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS:0 "Alpler’i aş ve İtalya’yı birleştir!"
 sav_the_savoy_ambition: "Savoya’nın Emelleri"
 sav_the_savoy_ambition_desc: "Savoya Hanedanı Alpler’in kavşağında hem İtalya’ya hem Fransa’ya nüfuz eden eşsiz bir konumu işgal eder. Piyemonte’nin bereketli topraklarını ve Alp ticaret yollarını denetleyerek bu küçük dukalık büyüklüğe giden yoluna başlar."
 sav_unify_piedmont: "Piyemonte’yi Birleştir"
 sav_unify_piedmont_desc: "Saluzzo ve Monferrato gibi bağımsız güçleri katmak ve tüm Piyemonte’yi birleştirmek Savoya’nın büyük emellerine giden ilk adımdır."
 sav_glory_of_turin: "Torino’nun Şanı"
 sav_glory_of_turin_desc: "Piyemonte’nin merkez şehri Torino’yu Savoya Hanedanı’nın başkentine yakışır gelişen bir metropole dönüştür."
 sav_shroud_of_turin: "Torino Kefeni"
 sav_shroud_of_turin_desc: "İsa’nın gömü kefeni olduğuna inanılan keten kumaş Torino Katedrali’nde durur. Bu kutsal emanete duyulan inanç diyara refah ve prestij getirir."
 sav_alpine_roads: "Alp Yolları"
 sav_alpine_roads_desc: "Alp ticaret yolları boyunca yol altyapısını geliştirmek, Fransa ile İtalya arasında geçen tüccarlar oradan geçtikçe Savoya’ya akan kârları artırır."
 sav_crossroads_of_europe: "Avrupa’nın Kavşağı"
 sav_crossroads_of_europe_desc: "Cenova’yı, Venedik’i ve Fransa’yı birbirine bağlayan Piyemonte Avrupa’nın başlıca ticaret merkezlerinden biri oluyor."
 sav_order_of_saints_maurice: "Aziz Maurice ve Lazarus Tarikatı"
 sav_order_of_saints_maurice_desc: "Savoya Hanedanı’nın kurduğu Aziz Maurice ve Lazarus Tarikatı Katolik dünyada dinî otoritenin ve meşruiyetin simgesi olur."
 sav_savoy_academy: "Savoya Akademisi"
 sav_savoy_academy_desc: "Rönesans ruhunu kucaklamak ve Torino merkezli akademik kurumları geliştirmek Savoya’yı İtalyan kültürel alanının sağlam bir üyesi olarak kurar."
 sav_alpine_powerhouse: "Alp Güç Merkezi"
 sav_alpine_powerhouse_desc: "Piyemonte’nin birleşmesi, kültürel gelişim ve artan ekonomik güç sayesinde Savoya Alpler merkezli büyük bir güç olarak tanındı."
 sav_alpine_fortifications: "Alp Tahkimatları"
 sav_alpine_fortifications_desc: "Alpler’in doğal engebesinden tam yararlanmak ve stratejik konumlarda müthiş kaleler inşa etmek Savoya’yı aşılmaz bir dağ devleti yapar."
 sav_diplomatic_balance: "Diplomatik Denge"
 sav_diplomatic_balance_desc: "Büyük güçler arasında sıkışan Savoya için hayatta kalmak adına diplomatik beceri vazgeçilmezdir. Yüksek diplomatik itibarı korumak güçlü komşuların baskısını ustaca savuşturur."
 sav_savoyard_army: "Savoya Ordusu"
 sav_savoyard_army_desc: "Alpler’in engebeli arazisinde pişen Savoyalı askerler Avrupa’nın en iyi dağ savaşçıları arasında ünlüdür. Daimi bir ordu kurmak diyarın askerî bağımsızlığını destekler."
 sav_conquer_genoa: "Cenova’yı Fethet"
 sav_conquer_genoa_desc: "Akdeniz’in başlıca denizci şehirlerinden Cenova’yı fethetmek Savoya’nın denize kıyısız statüsünü aşmasına ve doğrudan Akdeniz erişimli bir deniz gücü olmaya ilk adımı atmasına imkân verir."
 sav_nice_naval_base: "Nice Deniz Üssü"
 sav_nice_naval_base_desc: "Akdeniz kıyısındaki Nice’te bir deniz üssü kurmak Savoya’ya Tiren Denizi’ni denetlemek için bir tutunak verir."
 sav_sardinia_union: "Sardinya ile Birlik"
 sav_sardinia_union_desc: "Sardinya’nın çoğunu ele geçirmek ve “Sardinya Krallığı” unvanını iddia etmek Savoya Hanedanı’na İtalya’nın büyük kraliyet evlerinden biri olarak tanınma kazandırır."
 sav_seize_lombardy: "Lombardiya’yı Ele Geçir"
 sav_seize_lombardy_desc: "Milano merkezli Lombardiya’yı Savoya denetimi altına almak Savoya’yı kuzey İtalya’nın efendisi yapar."
 sav_push_tuscany: "Toskana’ya İlerle"
 sav_push_tuscany_desc: "Floransa önderliğindeki Toskana’nın zengin şehir devletlerine boyun eğdirmek Rönesans kültürünün kalbini Savoya topraklarına ekler."
 sav_capture_venice: "Venedik’i Ele Geçir"
 sav_capture_venice_desc: "Adriyatik’in Kraliçesi Venedik’i fethetmek Savoya’nın kuzey İtalya’daki deniz hegemonyasını kurar."
 sav_emilia_and_beyond: "Emilia ve Ötesi"
 sav_emilia_and_beyond_desc: "Emilia bölgesini ele geçirmek ve kuzey İtalya’nın kalan topraklarını denetim altına almak Savoya hegemonyasını mutlak kılar."
 sav_march_on_naples: "Napoli’ye Yürüyüş"
 sav_march_on_naples_desc: "Güney İtalya’nın kilit şehri Napoli’yi fethetmek yarımada denetiminin tamamlanmasını erişim içine sokar."
 sav_eternal_rome: "Ebedî Şehir"
 sav_eternal_rome_desc: "Roma’yı denetlemek İtalya’yı denetlemektir. Ebedî Şehir’i ele geçiren Savoya, İtalya’nın meşru hükümdarı olarak otoritesini dünyaya gösterir."
 sav_integrate_geneva: "Cenevre’yi Bütünleştir"
 sav_integrate_geneva_desc: "İsviçre Konfederasyonu ile güçlü bağları olan Cenevre’yi sağlamca Savoya denetimi altına almak kuzeye genişleme için bir tutunak kurar."
 sav_control_provence: "Provence’ı Denetle"
 sav_control_provence_desc: "Akdeniz kıyısı boyunca Provence’ı ele geçirmek Savoya’nın güney Fransa’daki hegemonyasını kurar ve daha büyük emellere yol açar."
 sav_against_the_swiss: "İsviçreliler’e Karşı"
 sav_against_the_swiss_desc: "Şiddetle bağımsız İsviçre Konfederasyonu’nu bastırmak ve batı İsviçre’yi ele geçirmek Savoya’yı Ren’in batısının efendisi yapar."
 sav_conquer_burgundy: "Burgonya’yı Fethet"
 sav_conquer_burgundy_desc: "Bir zamanlar Burgonya Dukalığı’nın denetlediği zengin topraklara boyun eğdirmek Fransa’nın istilasına giden yolu açar."
 sav_savoyard_occitania: "Savoya Oksitanyası"
 sav_savoyard_occitania_desc: "Oksitanca konuşulan toprakları ele geçirmek ve tüm güney Fransa’yı Savoya kültürel alanına çekmek."
 sav_claim_france: "Fransa’yı Sahiplen"
 sav_claim_france_desc: "Fransa Krallığı’nın başkenti Paris’i ele geçirme ve bir zamanlar Savoya’yı tehdit eden büyük gücü hükümranlığımız altına alma vakti geldi."
 sav_kingdom_of_italy: "İtalya Krallığı"
 sav_kingdom_of_italy_desc: "Savoya Hanedanı Alpler’i aştı, tüm İtalya’yı birleştirdi ve Roma İmparatorluğu’nun varisi olarak İtalya Krallığı’nı kurdu. Risorgimento’nun hayali burada gerçekleşti."
 STATIC_MODIFIER_NAME_sav_unified_piedmont_mod: "Piyemonte’nin Birleşmesi"
 STATIC_MODIFIER_DESC_sav_unified_piedmont_mod: "“Dağların eteği” Piyemonte, Alpler ve Apenninler ile çevrili bereketli bir ova, Savoya, Monferrato, Saluzzo ve diğer lordların hüküm sürdüğü yer. Ancak onları birleştirerek Savoya Alpler’i Po Nehri’ne bağlayan kavşağa tam hâkim olabilir."
 STATIC_MODIFIER_NAME_sav_shroud_of_turin_mod: "Kefenin Bereketi"
 STATIC_MODIFIER_DESC_sav_shroud_of_turin_mod: "Torino Kefeni, çarmıha gerilmeden sonra İsa’yı sardığı söylenen ve insan bedeninin gölgeli izini taşıyan bir keten kumaştır. Savoya Hanedanı 1353’te edindiğinden beri Katolik dünyanın en büyük kutsal emanetlerinden biri olarak saygı görmüştür. Özgünlüğü üzerindeki tartışma sürüyor, ama dinî ve siyasi etkisi şüphesizdir."
 STATIC_MODIFIER_NAME_sav_alpine_roads_mod: "Alp Yolları"
 STATIC_MODIFIER_DESC_sav_alpine_roads_mod: "Büyük Saint Bernard, Mont Cenis ve Saint Gotthard: Alpler’i aşan yollar Roma zamanlarından ortaçağ boyunca Avrupa’nın en önemli damarlarıydı. Bu geçitlerin efendisi Savoya geçiş ücretlerinden ve ticaretten muazzam zenginleşti. “Alpler’in kapıcısı” rolü refahının köküydü."
 STATIC_MODIFIER_NAME_sav_crossroads_mod: "Avrupa’nın Kavşağı"
 STATIC_MODIFIER_DESC_sav_crossroads_mod: "Piyemonte Fransa’nın, İsviçre’nin, Cenova’nın ve Milano’nun kesiştiği yerde uzanır. Champagne fuarlarına giden İtalyan tüccarlar, Roma’ya giden Fransız hacılar, İsviçre’ye giden paralı askerler: her türlü insan ve mal Piyemonte’den geçti ve Savoya yolu denetleyerek aracının kârlarını tekeline aldı."
 STATIC_MODIFIER_NAME_sav_order_of_saints_mod: "Aziz Maurice ve Lazarus Tarikatı"
 STATIC_MODIFIER_DESC_sav_order_of_saints_mod: "Aziz Maurice ve Lazarus Tarikatı, Savoya Hanedanı’nın sırasıyla 1434’te ve 1572’de kurduğu iki tarikatı birleştirdi. Aziz Maurice Roma zamanlarının Hıristiyan şehidiydi; Aziz Lazarus cüzzamlıların hamisi olarak saygı görürdü. Tarikat Savoya Hanedanı’nın Katolik dünyadaki dinî otoritesinin simgesi oldu."
 STATIC_MODIFIER_NAME_sav_savoy_academy_mod: "Savoya Akademisi’nin Etkisi"
 STATIC_MODIFIER_DESC_sav_savoy_academy_mod: "Rönesans’ta Savoya Dukalığı ilmin ve sanatın hamisi olarak biliniyordu. 1404’te kurulan Torino Üniversitesi hukuk, tıp ve ilahiyat öğreterek Piyemonte’nin entelektüel merkezi oldu. Sonradan I. Charles Emmanuel döneminde Accademia delle Belle Arti’yi doğuracak sanat himayesi geleneği de bu çağda kök saldı."
 STATIC_MODIFIER_NAME_sav_alpine_powerhouse_mod: "Alp Güç Merkezi"
 STATIC_MODIFIER_DESC_sav_alpine_powerhouse_mod: "“Küçük ama güçlü”: Savoya’nın gücü coğrafyasını kurnazca kullanmasında yatıyordu. Fransa’nın, Avusturya’nın ve İspanya’nın büyük güçleriyle çevrili olarak ustaca diplomasi ve arazinin yapısından yararlanan askerî strateji sayesinde hayatta kaldı ve sonunda İtalyan birliğine öncülük eden “kader hanedanı” oldu."
 STATIC_MODIFIER_NAME_sav_alpine_fortifications_mod: "Alp Tahkimatları"
 STATIC_MODIFIER_DESC_sav_alpine_fortifications_mod: "Briançon, Fenestrelle ve Exilles gibi kale gruplarını Alpler’in doğal kalelerine yerleştirerek Savoya bir “Alp kalkanı” dövdü. 17. ve 18. yüzyıllarda Vauban tarzı tabyalı kaleler bu geçitleri koruyarak Savoya’yı Avrupa’nın en aşılmaz devletlerinden biri yaptı."
 STATIC_MODIFIER_NAME_sav_diplomatic_balance_mod: "Diplomatik Denge"
 STATIC_MODIFIER_DESC_sav_diplomatic_balance_mod: "Savoya diplomasisinin özü “daima güçlünün yanında yer almak” idi. Fransa ile Avusturya arasında ip cambazlığı yaparak Savoya Utrecht Antlaşması’nda (1713) Sardinya’yı kazandı ve krallık rütbesine yükseldi. II. Victor Amadeus bu “dengeleyici” diplomasinin zirvesini somutlaştırdı."
 STATIC_MODIFIER_NAME_sav_savoyard_army_mod: "Savoya Seçkinleri"
 STATIC_MODIFIER_DESC_sav_savoyard_army_mod: "Savoyalı askerler Alpler’in sert arazisinde dövülmüş dağ savaşı ustalarıydı. 14. ve 15. yüzyılların Piyemonte askerî reformları “Ordinanza Piedmontese”yi kurdu ve disiplinli piyade taktikleri Savoya ordusunun gücü oldu. Sonraki Risorgimento’da da kuzey İtalya’nın kurtuluşunun dayanağı onlardı."
 STATIC_MODIFIER_NAME_sav_conquer_genoa_mod: "Cenova’nın Ele Geçirilmesi"
 STATIC_MODIFIER_DESC_sav_conquer_genoa_mod: "Venedik’in rakibi Cenova, ortaçağ Akdeniz’inin en büyük denizci şehir devletlerinden biriydi ve Karadeniz’e, Kuzey Afrika’ya ve İberya’ya yayılan geniş bir ticaret ağı ördü. Aynı zamanda bankacılığın (Aziz George Bankası dünyanın en eskilerindendir) ve sigortacılığın doğum yeridir. Bu “gururlu cumhuriyeti” fethetmek Savoya’ya Akdeniz’in kapısını açar."
 STATIC_MODIFIER_NAME_sav_nice_naval_base_mod: "Nice Deniz Üssü"
 STATIC_MODIFIER_DESC_sav_nice_naval_base_mod: "Nice (Nizza Marittima), Yunan Massalia’nın (Marsilya) bir kolonisi olarak kurulmuş kadim bir Akdeniz limanıdır. Savoya Hanedanı 1388’de edindiğinden beri Fransa ile İtalya arasındaki sınırdaki bu liman Savoya’nın tek deniz üssü olarak hizmet etti (1860’a kadar Savoya’da kaldı)."
 STATIC_MODIFIER_NAME_sav_sardinia_union_mod: "Sardinya ile Birlik"
 STATIC_MODIFIER_DESC_sav_sardinia_union_mod: "1720’de Utrecht Antlaşması’nın ardından yapılan düzenlemelerde Savoya Hanedanı Sicilya’yı Sardinya ile değiş tokuş etti ve “Sardinya Krallığı” olarak yükseldi. Bu adanın anakara Piyemonte ile birliği, Camillo Cavour ve Garibaldi’nin İtalya’nın birleşmesini (1861) başaracağı temel oldu."
 STATIC_MODIFIER_NAME_sav_seize_lombardy_mod: "Lombardiya’nın Ele Geçirilmesi"
 STATIC_MODIFIER_DESC_sav_seize_lombardy_mod: "Lombardiya ovası Avrupa’nın en bereketli tarım arazilerindendir ve Milano onun sanayi ve ticaret merkezidir. Uzun süre Avusturya’nın elinde olan bu zengin toprağı geri almak Risorgimento’nun özüydü: Savoya’nın hayalinin somut biçimi."
 STATIC_MODIFIER_NAME_sav_push_tuscany_mod: "Toskana’ya İlerleyiş"
 STATIC_MODIFIER_DESC_sav_push_tuscany_mod: "Floransa merkezli Toskana, Rönesans kültürünün doğum yeridir ve insanlık tarihinin en büyük sanatsal mirasına sahiptir. Uffizi, Duomo, Dante’nin dizeleri: hepsini Medici’ler besledi. Bu kültür hazinesini topraklarına eklemek Savoya Krallığı’na manevi bir otorite kazandırır."
 STATIC_MODIFIER_NAME_sav_capture_venice_mod: "Venedik’in Ele Geçirilmesi"
 STATIC_MODIFIER_DESC_sav_capture_venice_mod: "“Adriyatik’in Kraliçesi” Venedik, bin yılı aşkın süre bağımsızlığını koruyan mucizevi bir şehir devletidir. Bir lagünün adaları üzerine kurulu bir kanallar şehri olarak doğu ticaretindeki tekeli ve Arsenale gibi üstün gemi inşa becerisi sayesinde Akdeniz’in efendisi olarak hüküm sürdü. Bu fethedilmemiş şehri fethetmek tarihî bir başarı olur."
 STATIC_MODIFIER_NAME_sav_emilia_and_beyond_mod: "Emilia ve Ötesi"
 STATIC_MODIFIER_DESC_sav_emilia_and_beyond_mod: "Via Emilia boyunca dizilmiş Bologna, Parma, Modena ve Ferrara, ortaçağdan beri yemek, kültür ve ilim merkezleri olarak bilinirdi. Bologna Avrupa’nın en eski üniversitesine (1088’de kuruldu) ev sahipliği yapar ve entelektüel geleneği Savoya Krallığı’nın kültürel derinliğini artıracaktır."
 STATIC_MODIFIER_NAME_sav_march_on_naples_mod: "Napoli’ye Yürüyüş"
 STATIC_MODIFIER_DESC_sav_march_on_naples_mod: "“Napoli’yi gör ve öl” sözünü doğuracak kadar güzel olan bu şehir antik çağdan beri Akdeniz’in en büyük şehirlerinden biri olarak çiçek açtı. Anjou, Aragon, İspanyol ve Burbon yönetimleri altında çalkantılı bir tarihten geçen Napoli, İtalyan birliğinin önündeki son büyük engeldi."
 STATIC_MODIFIER_NAME_sav_eternal_rome_mod: "Ebedî Şehir"
 STATIC_MODIFIER_DESC_sav_eternal_rome_mod: "“Tüm yollar Roma’ya çıkar”: antik Roma İmparatorluğu’nun başkenti, Katolik Kilisesi’nin makamı, Rönesans kültürünün merkezi olan Roma Batı uygarlığının simgesidir. Kolezyum, Pantheon, Aziz Petrus Bazilikası: böylesine tarihî ağırlığa sahip bir şehri başkent yapmak İtalyan birliğinin tamamlanması demektir."
 STATIC_MODIFIER_NAME_sav_integrate_geneva_mod: "Cenevre’nin Bütünleştirilmesi"
 STATIC_MODIFIER_DESC_sav_integrate_geneva_mod: "Cenevre bir zamanlar Savoya kontlarının nüfuzu altındaydı, ama 1536’da John Calvin onu Reform’un üssü yaptı ve “Protestan Roma’sı” oldu. Bu göl kıyısı şehrini yeniden bütünleştirmek Savoya’nın İsviçre’ye doğru genişlemesi için önemli bir tutunak olur."
 STATIC_MODIFIER_NAME_sav_control_provence_mod: "Provence’ın Denetimi"
 STATIC_MODIFIER_DESC_sav_control_provence_mod: "Provence bir zamanlar Anjou Hanedanı’nın egemenlik alanıydı ve Kral René’nin ölümünden (1480) sonra Fransız tacına katıldı. Akdeniz kıyısının lavanta tarlaları, zeytinlikleri ve bağları: güney Fransa’nın bu zengin toprağı Savoya’nın egemenlik alanını büyük ölçüde genişletmenin anahtarı olur."
 STATIC_MODIFIER_NAME_sav_against_the_swiss_mod: "İsviçreliler’e Karşı"
 STATIC_MODIFIER_DESC_sav_against_the_swiss_mod: "İsviçre Konfederasyonu 1476-1477’de Grandson’da ve Murten’de Burgonya Dükü Cüretkâr Charles’ı yenen yenilmez dağ savaşçılarının diyarıdır. Bu güçlü komşuya boyun eğdirmek kolay bir başarı değil, ama İsviçreli paralı askerleri (Landsknecht) saray muhafızı olarak kullanan Savoya için onların vatanını yönetmek askerî zaferlerin en büyüğü olurdu."
 STATIC_MODIFIER_NAME_sav_conquer_burgundy_mod: "Burgonya’nın Fethi"
 STATIC_MODIFIER_DESC_sav_conquer_burgundy_mod: "Valois’nın bir yan kolu olan Burgonya, zirvesinde Düşük Ülkeler’den Burgonya’ya uzanan geniş bir “orta krallığı” yönetti. Cüretkâr Charles’ın ölümüyle (1477) Fransa tarafından yeniden özümsenen bu şarabı ve mutfağıyla ünlü zengin eyalet Fransa’nın istilası için önemli bir üs olur."
 STATIC_MODIFIER_NAME_sav_savoyard_occitania_mod: "Savoya Oksitanyası"
 STATIC_MODIFIER_DESC_sav_savoyard_occitania_mod: "Güney Fransa’nın Oksitanca konuşan halkları trubadur kültürünü doğurdu, ama 13. yüzyılın Albigeois Haçlı Seferi’yle harap oldu. Katarların zulmü ve Fransız tacının yönetimi altında gömülen Oksitan özerkliği geleneği Savoya sancağı altında yeniden canlanır."
 STATIC_MODIFIER_NAME_sav_claim_france_mod: "Fransa Üzerinde Hak İddiası"
 STATIC_MODIFIER_DESC_sav_claim_france_mod: "Fransa Savoya için daima hem bir tehdit hem bir cazibeydi. Napolyon çağında (bir Korsikalı olarak doğmuş, ancak Nice’in komşusu) Savoya Fransa tarafından yutuldu. Şimdi tersi: Savoya’nın Fransa kralının tahtını ele geçirdiği büyük bir tersine dönüş."
 STATIC_MODIFIER_NAME_sav_kingdom_of_italy_mod: "İtalya Krallığı"
 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "17 Mart 1861’de II. Victor Emmanuel (Sardinya Kralı) İtalya Krallığı’nın ilk Kralı olarak tahta çıktı: gerçek tarihte böyle oldu. Cavour’un diplomasisini, Garibaldi’nin silahlarını ve Mazzini’nin ideallerini kaynaştıran 19. yüzyılın en büyük siyasi mucizesi burada dört yüz yıl erken başarılıyor."
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "Torino’nun Şanı"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "“Il Balon” açık hava pazarı, Barolo ve Barbaresco üreten Langhe tepeleri, muhteşem Piazza San Carlo: Torino, Savoya Hanedanı’nın İtalya’nın en önde gelen planlı şehri olarak şekillendirdiği başkenttir. Roma Augusta Taurinorum’un ızgara planını miras alan bu şehir Alpler’in güneyindeki en rafine görünüme sahiptir."
 sav_events.1.t: "Savoya Hanedanı’nın Emelleri"
 sav_events.1.d: "Savoya Dukalığı, kuzey ve güney Avrupa’yı bağlayan Alp’lerin stratejik geçitlerini işgal eder. İki yanında Fransa ve İtalya varken bu küçük prenslik büyük emellere uyanıyor. Kırmızı bir kalkan üzerinde beyaz bir haç olan Savoya arması bir gün tüm İtalya’da dalgalanacak. Piyemonte’yi birleştir, Cenova’yı fethet, Roma’yı ele geçir ve İtalya Krallığı’nı kur: Savoya Hanedanı’nın bin yıllık hayali başlamak üzere."
 sav_events.1.a: "Savoya Hanedanı’nın şanını yükselt!"
 sav_events.2.t: "Torino’nun Şanı"
 sav_events.2.d: "Savoya Hanedanı’nın yönetimi altında Torino hızla gelişiyor. Şehrin her yerinde saraylar ve kiliseler yükselirken ve bilginler ile sanatçılar burada toplanırken bu şehir kuzey İtalya’nın kültürel ve siyasi merkezi olarak öne çıkıyor. Torino’nun Savoya Hanedanı’na yaraşır bir başkent olarak çiçeklenmesi tüm diyarın refahının temeli olacak."
 sav_events.2.a: "Torino Savoya Hanedanı’nın parlayan başkentidir"
 sav_woolens_of_piedmont: "Piyemonte Yünlüleri"
 sav_woolens_of_piedmont_desc: "Piyemonte İtalya’nın başlıca yün ve kumaş üreticilerinden biri olarak bilinir. Kaliteli yün üretimi ve kumaş işleme Savoya servetinin ticari temelini oluşturur."
 sav_nebbiolo_vineyards: "Nebbiolo Bağları"
 sav_nebbiolo_vineyards_desc: "Piyemonte’nin Langhe tepelerinde yetişen Nebbiolo üzümü Barolo ve Barbaresco gibi ünlü şarapların kaynağıdır. Piyemonte şarapları tüm Avrupa’ya ihraç edilir ve büyük kâr sağlar."
 sav_casa_savoia: "Savoya Hanedanı’nın Otoritesi"
 sav_casa_savoia_desc: "Savoya Hanedanı’nın yönetimi istikrara kavuştu ve otoritesi artık yurt içinde ve dışında geniş çapta tanınıyor. Meşru, istikrarlı yönetim Savoya’yı büyük bir İtalyan gücüne yükselten temeldir."
 sav_ordinanza_piedmontese: "Ordinanza Piedmontese"
 sav_ordinanza_piedmontese_desc: "15. yüzyılda Savoya, Alp yaylalarında dövülmüş eşsiz bir piyade taktik doktrini kurdu: Ordinanza Piedmontese. Disiplinli mızraklı düzenler Savoya askerî gücünün belkemiğidir."
 sav_university_of_turin: "Torino Üniversitesi"
 sav_university_of_turin_desc: "1404’te kurulan Torino Üniversitesi, hukuk, tıp ve ilahiyat öğreterek Piyemonte’nin akademik kalbi olarak hizmet eder. Savoya’nın entelektüel mirası Rönesans kültürünün çiçeklenmesini destekler."
 sav_corsica_seized: "Korsika Ele Geçirildi"
 sav_corsica_seized_desc: "Uzun süre Cenova tarafından denetlenen Korsika’yı almak Savoya’nın batı Tiren Denizi’ne komutasını büyük ölçüde ilerletir."
 sav_towers_of_sardinia: "Sardinya Kuleleri"
 sav_towers_of_sardinia_desc: "Ortaçağdan beri sayısız gözetleme kulesi (Torre Costiera) Sardinya kıyısını dizmiştir. Bu savunmaları geliştirmek ve güçlendirmek Sardinya’yı korsan akınlarından korur."
 sav_cagliari_development: "Cagliari’nin Gelişimi"
 sav_cagliari_development_desc: "Sardinya’nın başkenti Cagliari’yi batı Akdeniz’de önemli bir liman şehrine ve ticaret merkezine dönüştür."
 sav_tyrrhenian_sea: "Tiren Denizi’nin Efendisi"
 sav_tyrrhenian_sea_desc: "Hem Korsika’yı hem Sardinya’yı ele geçiren ve güçlü bir filo inşa eden Savoya, Tiren Denizi üzerinde tam hâkimiyet kurdu. Batı Akdeniz ticareti Savoya korumasına girer."
 sav_languedoc: "Languedoc’un Denetimi"
 sav_languedoc_desc: "Güney Fransa’nın kilit konumu Languedoc’u ele geçir. Montpellier ve Toulouse gibi iki büyük şehri almak tüm güney Fransa’yı denetlemek için bir tutunak olur."
 sav_gascony: "Gaskonya Ele Geçirildi"
 sav_gascony_desc: "Bordeaux merkezli Gaskonya, Atlantik’e bakan zengin bir şarap üreten topraktır. İngiltere ile uzun tarihî ilişkisini kes ve bu toprağı Savoya topraklarına kat."
 sav_lyon_gateway: "Lyon Kapısı"
 sav_lyon_gateway_desc: "Rhône ve Saône nehirlerinin birleştiği yerde yer alan Lyon, güney ve kuzey Fransa’yı bağlayan ticaret merkezidir. Bu şehri ele geçirmek Fransa’nın iç kesimlerine giden yolu açar."
 sav_loire_valley: "Loire Vadisi"
 sav_loire_valley_desc: "“Fransa’nın Bahçesi” Loire Vadisi, bir zamanlar Fransız kraliyet ailesinin şatolarının yükseldiği yer. Nantes’ı ve Tours’u ele geçirmek orta batı Fransa’nın fethi anlamına gelir."
 sav_normandy_coast: "Normandiya Kıyısı"
 sav_normandy_coast_desc: "Normanların bir zamanlar çıkarma yaptığı tarihî kıyı Normandiya’yı ele geçir. Bu zengin toprağın kalbindeki Rouen kuzey Fransa’da kilit bir konum ve Paris’ten önceki son engeldir."
 STATIC_MODIFIER_NAME_sav_woolens_of_piedmont_mod: "Piyemonte Yün Sanayisi"
 STATIC_MODIFIER_DESC_sav_woolens_of_piedmont_mod: "Piyemonte, koyunlarının yüksek Alp otlaklarında beslendiği muhteşem bir yün üreten bölgeydi. Özellikle Biella bölgesi ortaçağdan günümüze Avrupa’nın en iyi yün ve ince kumaş kaynaklarından biri olarak bilinirdi ve “Piyemonte yünü” İngiliz yünüyle birlikte en yüksek kalitenin simgesi olarak durdu."
 STATIC_MODIFIER_NAME_sav_nebbiolo_vineyards_mod: "Nebbiolo Bağları"
 STATIC_MODIFIER_DESC_sav_nebbiolo_vineyards_mod: "Piyemonte’nin Langhe tepelerinde yetişen Nebbiolo üzümünden “şarapların kralı” Barolo ve “kraliçenin şarabı” Barbaresco çıkar. Yetiştirildiğine dair kayıtlar 13. yüzyıla uzanır ve Savoya sarayında bile değerliydi: Piyemonte’nin gururu, İtalyan şarabının zirvesi olarak hâlâ dünya çapında sevilir."
 STATIC_MODIFIER_NAME_sav_casa_savoia_mod: "Savoya Hanedanı’nın Otoritesi"
 STATIC_MODIFIER_DESC_sav_casa_savoia_mod: "Savoya Hanedanı kökenini 11. yüzyılda Beyaz Elli Humbert’e dayandıran Avrupa’nın en uzun ömürlü hanedanlarından biridir. “En eski hanedan” olarak yedi yüz yılı aşkın süre hayatta kalması ve sonunda İtalya Krallığı’nın kraliyet evi olması, Avrupa kraliyet evleri tarihinde ender görülen bir dayanıklılık gösterir."
 STATIC_MODIFIER_NAME_sav_ordinanza_piedmontese_mod: "Ordinanza Piedmontese"
 STATIC_MODIFIER_DESC_sav_ordinanza_piedmontese_mod: "Savoya Dukalığı’nın 15. yüzyılda örgütlediği “Ordinanza Piemontese”, mızraklı piyade merkezli disiplinli bir daimi ordu sistemiydi. İsviçreli paralı askerlerin taktiklerinden yararlanıp kendi inceliklerini ekleyerek sonraki Sardinya ordusunun temeli ve Risorgimento’da birleşme savaşlarını veren orduların öncüsü oldu."
 STATIC_MODIFIER_NAME_sav_university_of_turin_mod: "Torino Üniversitesi’nin Etkisi"
 STATIC_MODIFIER_DESC_sav_university_of_turin_mod: "1404’te kurulan Torino Üniversitesi kuzey İtalya’nın en eski üniversitelerinden biridir. Hukuk, tıp ve ilahiyat olmak üzere üç fakülteyle başlayarak Cesare Beccaria (ceza reformcusu) ve Lagrange (matematikçi) gibi seçkin zihinler yetiştirdi ve Aydınlanma Piyemonte’sinin entelektüel kalbi oldu."
 STATIC_MODIFIER_NAME_sav_corsica_seized_mod: "Korsika Ele Geçirildi"
 STATIC_MODIFIER_DESC_sav_corsica_seized_mod: "Korsika, Cenova’nın 1284’ten beri yönettiği batı Akdeniz’in anahtarıdır. Cenova onu 1768’de Fransa’ya sattığında Napolyon Bonaparte ertesi yıl bir “Fransız” olarak doğdu: tarihin ironisi. Bu adayı ele geçirmek batı Tiren Denizi’ne komutayı güvenceye alır."
 STATIC_MODIFIER_NAME_sav_towers_of_sardinia_mod: "Sardinya Kuleleri"
 STATIC_MODIFIER_DESC_sav_towers_of_sardinia_mod: "Sardinya kıyıları boyunca ortaçağdan erken modern döneme kadar inşa edilen “torri costiere” (kıyı kuleleri) dağınık biçimde durur. Berberi korsan akınlarına karşı gözetlemek için yükseltilen bu savunma sistemi zirvesinde yüzden fazla kuleye ulaştı ve ada halkını tehlikeye karşı uyaran bir alarm ağı olarak hizmet etti."
 STATIC_MODIFIER_NAME_sav_cagliari_development_mod: "Cagliari’nin Refahı"
 STATIC_MODIFIER_DESC_sav_cagliari_development_mod: "Cagliari (Karalis), Fenikeliler tarafından kurulan bir liman şehri ve Roma zamanlarında önemli bir idari merkezdi. Akdeniz’in ortasında Sardinya’nın başkenti olarak Tunus’la, İspanya’yla ve İtalya’yla bir ticaret merkezi oldu ve Aragon yönetimi altında batı Akdeniz ticaretinin kilit noktası olarak sürdü."
 STATIC_MODIFIER_NAME_sav_tyrrhenian_sea_mod: "Tiren Denizi’nin Efendisi"
 STATIC_MODIFIER_DESC_sav_tyrrhenian_sea_mod: "Tiren Denizi, İtalya yarımadası, Sicilya, Korsika ve Sardinya ile çevrili Akdeniz’in bir iç denizidir: antik Fenikelilerin, Yunanlıların ve Romalıların ticaret yaptığı bir tarih denizi. Korsika’ya ve Sardinya’ya hâkim olarak bu iç denizin tamamına komuta edilebilir ve doğu Akdeniz’e ilerleyiş için bir üs elde edilebilir."
 STATIC_MODIFIER_NAME_sav_languedoc_mod: "Languedoc’un Denetimi"
 STATIC_MODIFIER_DESC_sav_languedoc_mod: "Languedoc (“Oc dilinin toprağı”), güney Fransa’nın Oksitanca konuşan bölgesini ifade eder. Başkenti Toulouse olan bu bölge 13. yüzyılın Albigeois Haçlı Seferi’nde Fransız tacı tarafından fethedilene kadar kendi kültürü, siyaseti ve dini (Katarlık) ile övünüyordu. Közleri, Provence ile birlikte, güney Fransa’ya özgü bir uygarlık olarak hâlâ ışıldar."
 STATIC_MODIFIER_NAME_sav_gascony_mod: "Gaskonya Ele Geçirildi"
 STATIC_MODIFIER_DESC_sav_gascony_mod: "Gaskonya, Basklı kökenli güneybatı Fransa’da bir bölgedir ve Bordeaux’nun Atlantik şarap ticareti, Bayonne limanı ve Armagnac brendisiyle bilinir. Akitanyalı Eleonore’un evliliğinden beri İngiltere’ye yakından bağlı olup Yüz Yıl Savaşları’nın son ana savaş alanıydı."
 STATIC_MODIFIER_NAME_sav_lyon_gateway_mod: "Lyon Kapısı"
 STATIC_MODIFIER_DESC_sav_lyon_gateway_mod: "Lyon (Lugdunum), Roma Galya eyaletinin başkenti olarak kuruldu ve bir iletişim kavşağıdır. Ortaçağda Champagne fuarlarından sonra Fransa’nın en büyük periyodik fuarlarına ev sahipliği yaptı ve İtalya’nın, Flandre’ın ve Almanya’nın tüccarları burada toplandı. Rhône ile Saône’un birleştiği yerdeki konumu coğrafi zorunlulukla ticaret şehri olarak itibarını güvence altına aldı."
 STATIC_MODIFIER_NAME_sav_loire_valley_mod: "Loire Vadisi"
 STATIC_MODIFIER_DESC_sav_loire_valley_mod: "“Fransa’nın Bahçesi” denen Loire Vadisi’nde Chambord, Chenonceau ve Amboise gibi Rönesans şatoları yükselir. 15. ve 16. yüzyıl Fransız kralları bölgeyi Paris’ten daha ılıman iklimi, zengin erzakı ve savunma güvenliği için sevdi. Bu güzel topraklara komuta etmek Fransız kültürünün merkezini elinde tutmak demektir."
 STATIC_MODIFIER_NAME_sav_normandy_coast_mod: "Normandiya Kıyısı"
 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "Normandiya, Vikinglerin (Kuzeyliler, Normanlar) 911’de Fransa kralı tarafından kendilerine verilen topraktır. Fatih William’ın 1066’daki İngiltere istilası, Yüz Yıl Savaşları’nın en büyük savaş alanı, 1944 D-Day çıkarması: bu toprak daima tarihin bir dönüm noktası olmuştur. Rouen aynı zamanda Jeanne d’Arc’ın idam edildiği yerdir."
 sav_events.3.t: "Sardinya-Piyemonte’nin Oluşumu"
 sav_events.3.d: "Sardinya’nın neredeyse tamamını ele geçiren Savoya Hanedanı resmen “Sardinya Kralı” unvanını benimsemeye karar verdi. Tarihte (1720) Savoya, İspanya Veraset Savaşı’nın sonucunda Sardinya’yı edinerek “Sardinya Krallığı”nı kurdu. Sardinya-Piyemonte’nin bu çifte krallığı İtalyan birliğinin beşiği olacaktı. Anakara Piyemonte’yi Sardinya adasıyla birleştiren bu krallık kuzey İtalya’da büyük bir güç olarak ortaya çıkacak."
 sav_events.3.a: "Sardinya Kralı olarak İtalyan birliğinin sancaktarı ol!"
 sav_franchises: "Savoya Franchise’leri"
 sav_franchises_desc: "Ortaçağ Piyemonte’sinde Savoya Hanedanı çeşitli kasabalara “franchise” denen şehir hakları verdi. Göç özgürlüğünü, köylü özgürleşmesini ve genişletilmiş tüccar ticaret haklarını güvence altına alan bu sistem şehir rekabetini teşvik eder ve Piyemonte’yi canlandırır. Bu görevi tamamlamak konumlara “Savoya Franchise’leri” şehir haklarını vermeye izin verir."
 sav_franchises_unlock_tt: "“Franchise’ler” şehir ayrıcalığı kullanılabilir olur."
 sav_patria_legis: "Savoie-Val d’Aoste"
 sav_patria_legis_desc: "“Patria Legis”, Val d’Aoste bölgesinin geleneksel özyönetim uygulamalarını Savoya Hanedanı’nın yönetim idealleriyle Rönesans ruhunu yansıtan rasyonel bir hukuk çerçevesinde birleştirir. Bu görevi tamamlamak konumlara “Savoie-Val d’Aoste” şehir haklarını vermeye izin verir."
 sav_patria_legis_unlock_tt: "“Patria Legis” şehir ayrıcalığı kullanılabilir olur."
 franchises: "Franchise’ler"
 franchises_desc: "Savoya Hanedanı’nın kurduğu, nüfus göç özgürlüğünü, köylü özgürleşmesini ve genişletilmiş tüccar ticaret haklarını güvence altına alan şehir hakları."
 patria_legis: "Patria Legis"
 patria_legis_desc: "Val d’Aoste geleneklerini Savoya hukuk ilkeleriyle birleştiren, şehir refahı, toplumsal hareketlilik ve üretim verimliliği getiren şehir hakları."
