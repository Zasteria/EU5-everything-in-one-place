 kie_conquer_smolensk: "Smolensk Seferi"
 kie_conquer_smolensk_desc: "“Rusya’nın Anahtarı” ve doğu-batı trafiğinin kavşağı Smolensk’i ele geçir: Moskova ve Polonya üzerinde nüfuz kur. Çernihiv’i tutunak olarak kullanarak tüm Smolensk bölgesinin denetimini ele al."
