l_turkish:
 kie_kyiv_mission_pack: "Rus’un Yeniden Birleşmesi ve Kazakların Hükümdarı"
 kie_kyiv_mission_pack_DESCRIPTION:0 "1337’de Kiev Prensliği, Litvanya ile Tatarlar arasında sıkışmış küçük bir devlettir. Yine de Kiev bir zamanlar Kiev Rusyası’nın kalbi olarak parlamıştı: Aya Sofya Katedrali, Peçersk Lavra ve Altın Kapı hâlâ onun şanını anlatır. Sol ve Sağ Yaka Ukrayna’sını birleştir, Halyç’ı ve Volinya’yı fethet, Tatarları Kazak askerî gücüyle yen, Rutenya’yı kur ve Büyük Prenslik olarak hüküm sür."
 kie_kyiv_mission_pack_CRITERIA_DESCRIPTION:0 "Rus’u yeniden birleştir, Kazak Hetmanlığı’nı kur, Ortodoks inancının koruyucusu ol, Rutenya’yı kur ve Kiev Büyük Prensliği olarak hüküm sür."
 kie_kyiv_mission_pack_BUTTON_TOOLTIP:0 "Tüm Rus üzerinde Kiev Büyük Prensliği olarak hüküm sür."
 kie_kyiv_mission_pack_BUTTON_DETAILS:0 "Parçalanmış Rus’u Kiev altında yeniden birleştir: bozkırı Kazak kılıcıyla ele geçir!"
 kie_restore_kyiv: "Kiev’i Yeniden Kur"
 kie_restore_kyiv_desc: "1337’de Kiev, bir zamanlar Kiev Rusyası’nın altın şehri, 1240’taki Moğol istilasıyla yıkıldı. Aya Sofya Katedrali ve Peçersk Lavra hâlâ geçmiş şanı anlatıyor. “Rus Şehirlerinin Anası”nı bir kez daha büyük bir şehir olarak yeniden kur."
 kie_dev_kyiv: "Kiev’i Geliştir"
 kie_dev_kyiv_desc: "Volhov ve Dinyeper ticaret yollarını birbirine bağlayan kilit kavşak: Kiev’i bir ticaret, kültür ve siyaset merkezi olarak geliştir."
 kie_secure_left_bank: "Sol Yaka Ukrayna’sı Üzerinde Denetimi Güçlendir"
 kie_secure_left_bank_desc: "Sol Yaka Ukrayna’sı üzerindeki denetimi güçlendir: Rus kültürel geleneklerini koru ve yetenekli bir bürokrasiyle bu zengin tarım toprağını Kiev’in temeli yap."
 kie_secure_right_bank: "Sağ Yaka Ukrayna’sı Üzerinde Denetimi Güçlendir"
 kie_secure_right_bank_desc: "Sağ Yaka Ukrayna’sı üzerindeki denetimi güçlendir: Ukrayna kültürünün yayılması ve taç gücünün güçlendirilmesiyle Sağ Yaka Ukrayna’sını Kiev’in çekirdek toprağı yap."
 kie_conquer_chernihiv: "Çernihiv Seferi"
 kie_conquer_chernihiv_desc: "Kadim Rus prenslik şehri Çernihiv’i fethet ve Sol Yaka Ukrayna’sı üzerindeki denetimi sağlamlaştır."
 kie_conquer_poltava: "Poltava’ya Yürüyüş"
 kie_conquer_poltava_desc: "Kazak kalesi Poltava’ya boyun eğdir ve Sloboda Ukrayna’sının kapısını aç."
 kie_kyiv_metropolitan: "Kiev Metropolitlik Makamı"
 kie_kyiv_metropolitan_desc: "İstanbul’dan bağımsız Kiev metropolitliğini Rus Ortodoks Kilisesi’nin merkezi olarak kur."
 kie_unite_rus: "Rus’un Yeniden Birleşmesi"
 kie_unite_rus_desc: "Moğol istilasıyla parçalanan Rus prensliklerini Kiev altında yeniden birleştir. “Rus Şehirlerinin Anası” bir kez daha tüm Ukrayna’nın merkezi olarak parlar."
 kie_secure_volhynia: "Volinya’yı Güvenceye Al"
 kie_secure_volhynia_desc: "Batı nüfuzunu kurmak için Rus ile Polonya’nın sınırındaki Volinya’yı güvenceye al."
 kie_conquer_lutsk: "Lutsk Seferi"
 kie_conquer_lutsk_desc: "Volinya’nın kilit şehri Lutsk’u ele geçir ve onu batıya bir köprübaşı yap."
 kie_conquer_galicia: "Halyç’ın İstilası"
 kie_conquer_galicia_desc: "Halyç’ı istila et: bu bölgeyi fethetmek batı Ukrayna’nın tam denetimini kurar."
 kie_red_ruthenia: "Kızıl Rus’a Boyun Eğdir"
 kie_red_ruthenia_desc: "Kızıl Rus’a boyun eğdir: Lviv merkezli bu bölgeye boyun eğdirmek batı Ukrayna’nın tam denetimini tamamlar."
 kie_conquer_lviv: "Lviv’i Ele Geçir"
 kie_conquer_lviv_desc: "“Aslan Şehri” Lviv: Prens Danylo’nun inşa ettiği bu ticaret şehrini fethet ve batı ticaretinin denetimini ele geçir."
 kie_conquer_podolia: "Podolya’ya İlerle"
 kie_conquer_podolia_desc: "Podolya’ya ilerle: bu Sağ Yaka tarım bölgesini fethet ve Karadeniz kıyısına giden yolu güvenceye al."
 kie_conquer_vinnytsia: "Vinnitsa’nın İşgali"
 kie_conquer_vinnytsia_desc: "Vinnitsa’yı ele geçir ve Sağ Yaka Ukrayna’sının tarım üssünü kur."
 kie_conquer_polesia: "Polissya Seferi"
 kie_conquer_polesia_desc: "Sulak Polissya’yı fethet: bir kuzey savunma hattı kur."
 kie_conquer_minsk: "Minsk’i Ele Geçir"
 kie_conquer_minsk_desc: "Kuzey nüfuzunu genişletmek için Beyaz Rutenya’nın merkezi Minsk’i ele geçir."
 kie_cossack_host: "Kazak Ordusunu Kur"
 kie_cossack_host_desc: "Kazaklar Kiev’in sancağı altında toplanır: Zaporijya Kazak askerî geleneğini düzenli orduya kat ve Rus’un en seçkin süvari gücünü inşa et."
 kie_zaporizhzhia: "Zaporijya Seç’i"
 kie_zaporizhzhia_desc: "Bozkır savunması için bir üs olarak Dinyeper şelalelerinin ötesinde Zaporijya Seç kalesini inşa et."
 kie_tatar_wars: "Tatarlara Karşı Savaşlar"
 kie_tatar_wars_desc: "Kuzey Karadeniz’i denetleyen Kırım Tatarları’na karşı belirleyici bir savaş ver. Onlara karşı Kazak süvarisini kullan ve Ukrayna bozkırını geri al."
 kie_black_sea_steppe: "Karadeniz Bozkırını Fethet"
 kie_black_sea_steppe_desc: "Pontus Bozkırı’nı ele geçir: uçsuz bucaksız çayır Kiev’i kuzey Karadeniz’in efendisi yapar."
 kie_conquer_crimea: "Kırım’ın Fethi"
 kie_conquer_crimea_desc: "Karadeniz hâkimiyetini kurmak için Kırım Hanlığı’nın yarımadasını fethet. Ceneviz ticaret karakolu Kefe’yi ele geçir."
 kie_black_sea_coast: "Karadeniz Filosu Kur"
 kie_black_sea_coast_desc: "Dinyeper’den Karadeniz’e Kazak “Çayka” hızlı gemilerini kullan: Osmanlılara meydan oku ve Karadeniz ticaret yolunu ele geçir."
 kie_kyiv_pechersk: "Kiev-Peçersk Lavra’sı"
 kie_kyiv_pechersk_desc: "1051’de kurulan Kiev-Peçersk Lavra’sı (Mağara Manastırı), Rus Ortodoks Kilisesi’nin manevi kalbi. Bu manastırı geliştir ve Kiev’i Ortodoks merkezi ilan et."
 kie_orthodox_revival: "Ortodoks Canlanışı"
 kie_orthodox_revival_desc: "Moğol istilasıyla yıkılan Rus Ortodoks Kilisesi’ni yeniden inşa et: tüm diyarda katedraller yap ve “Kutsal Rus”u canlandır."
 kie_grain_breadbasket: "Ukrayna: Avrupa’nın Tahıl Ambarı"
 kie_grain_breadbasket_desc: "Bereketli çernozem, yani Ukrayna’nın “Avrupa’nın Tahıl Ambarı” denen zengin tarım toprağı. Bu verimliliği azamiye çıkar ve imparatorluğun gıda temelini sağlamlaştır."
 kie_trade_routes: "Kiev’in Ticaret Yolları"
 kie_trade_routes_desc: "Baltık’ı Karadeniz’e bağlayan “Vareglerden Rumlara Giden Yol”: Kiev’in refahını destekleyen bu kadim ticaret yolunu canlandır."
 kie_hetmanate: "Kazak Hetmanlığı"
 kie_hetmanate_desc: "Hetman: Kazak Hetmanlığı’nı kurmak Kiev’in kendi askerî-siyasi sistemine sahip bir devlet olarak ortaya çıkmasına imkân verir. Bohdan Hmelnitski’nin 1648’deki büyük başarısını önceden gerçekleştir."
 kie_literacy_culture: "Okuryazarlığı ve Kültürü Teşvik Et"
 kie_literacy_culture_desc: "Kiev’in entelektüel geleneği: manastır el yazması kültürünün ve katedral okullarının öncüsü olarak eğitim kültürünü teşvik et."
 kie_conquer_zhytomyr: "Jitomir’i Geliştir"
 kie_conquer_zhytomyr_desc: "Sağ Yaka Ukrayna’sının kilit noktası Jitomir’i uygun binalarla önemli bir üs şehrine dönüştür."
 kie_salt_of_galicia: "Halyç Tuzu"
 kie_salt_of_galicia_desc: "Halyç’ın kaya tuzu madenleri: “beyaz altın” üreten bu bölgeyi ele geçir ve bu önemli ticaret kaynağının istikrarlı arzını güvenceye al."
 kie_dev_poltava: "Poltava’yı Geliştir"
 kie_dev_poltava_desc: "Kazak Sol Yaka Ukrayna’sının kilit şehri Poltava’yı doğu ileri üssü olarak geliştir."
 kie_beyond_donets: "Donets Nehri’nin Ötesi"
 kie_beyond_donets_desc: "Sloboda Ukrayna’sı: Donets Nehri boyunca Kazak çiftçileri yerleştir ve doğu bozkırını geliştir."
 kie_conquer_moldavia: "Moldavya’nın İstilası"
 kie_conquer_moldavia_desc: "Karadeniz kıyısındaki Moldavya’yı fethet ve Karadeniz ticaretine tam giriş sağla."
 kie_amber_route: "Kehribar Yolu"
 kie_amber_route_desc: "Baltık’tan Lutsk ve Lviv üzerinden güneye giden kadim kehribar ticaret yolu Rutenya ticaret ağının belkemiğini oluşturur."
 kie_fortress_line: "Kale Hattı"
 kie_fortress_line_desc: "Bozkır tehditlerine karşı bir kale hattı: Zaporijya’dan Podolya’ya uzanan bir savunma sistemi Ukraynalı çiftçileri ve şehirleri korur."
 kie_great_kyiv: "Büyük Kiev"
 kie_great_kyiv_desc: "Kiev’i Moğol istilasından önceki büyüklüğüne kavuştur: altın kubbeleri özgün şanlarıyla geri kazanılmış muhteşem bir şehir olarak yeniden inşa et."
 kie_ruthenian_culture: "Rutenya Kültürel Kimliği"
 kie_ruthenian_culture_desc: "Ukrayna Rutenya’sının eşsiz kültürünü kur: Ukrayna dilinin, Kazak kültürünün ve Ortodoks inancının kaynaştığı eşsiz bir kimlik."
 kie_dev_chernihiv: "Çernihiv’i Geliştir"
 kie_dev_chernihiv_desc: "Çernihiv’i Sol Yaka Ukrayna’sında bir kültür ve ticaret merkezi olarak geliştir."
 kie_conquer_wallachia: "Eflak’a İlerle"
 kie_conquer_wallachia_desc: "Tuna boyundaki Eflak: bu bölgeyi Balkanlar’a doğru bir tutunak olarak fethet ve Karadeniz kıyı denetimini tamamla."
 kie_cossack_cavalry: "Kazak Süvari Seçkinleri"
 kie_cossack_cavalry_desc: "Kazak süvarisi: hafif ve ağır süvari seçkin birliklere yükseltildi. Hareketliliği ve savaş gücüyle Tatarları ez."
 kie_kyiv_academy: "Kiev-Mohyla Akademisi"
 kie_kyiv_academy_desc: "Doğu Avrupa’nın en eski üniversitelerinden biri olan Kiev-Mohyla Akademisi’ni 1632’deki kuruluşundan önce kur. Rus entelektüel ve kültürel rönesansını gerçekleştir."
 kie_conquer_krakow: "Krakiv’i Ele Geçir"
 kie_conquer_krakow_desc: "Polonya Krallığı’nın tarihî başkenti Krakiv: Wawel Kalesi’ne sahip bu şehri fethetmek Orta Avrupa üzerindeki nüfuzu büyük ölçüde genişletir."
 kie_navy_dnipro: "Dinyeper Filosu"
 kie_navy_dnipro_desc: "Dinyeper Nehri’nden Karadeniz’e Kazak “Çayka” yelkenlilerini kullan: Dinyeper filosu Karadeniz ticaretini korur."
 kie_protect_orthodoxy: "Ortodoksluğun Koruyucusu"
 kie_protect_orthodoxy_desc: "İstanbul’un düşüşünden sonra Kiev Ortodoks dünyasının koruyucusu olarak ortaya çıkar: Rus Ortodoks Kilisesi’nin en yüce otoritesini kur."
 kie_conquer_vilnius: "Vilnius’un İşgali"
 kie_conquer_vilnius_desc: "Litvanya Büyük Dukalığı’nın başkenti Vilnius: bu şehri işgal etmek Litvanya’nın Rus üzerindeki hâkimiyetine son verir."
 kie_western_alliance: "Batı ile İttifak"
 kie_western_alliance_desc: "Doğu tehditlerine karşı bir batı ittifakı kurmak için Polonya, Macaristan ve Kutsal Roma İmparatorluğu ile diplomatik ilişkiler kur."
 kie_silver_route: "Gümüş Yolu"
 kie_silver_route_desc: "Doğu gümüşü Dinyeper boyunca Kiev üzerinden batıya akar: Kiev’in uluslararası ticaretteki konumunu kur."
 kie_ruthenian_army: "Rutenya Ordu Reformu"
 kie_ruthenian_army_desc: "Kazak geleneğini Batı askerî teknolojisiyle birleştir: Rutenya ordusu Doğu Avrupa’nın en seçkin askerî gücü olarak hüküm sürer."
 kie_conquer_warsaw: "Varşova’yı Ele Geçir"
 kie_conquer_warsaw_desc: "Polonya’nın başkenti Varşova: Polonya-Litvanya Ortak Devleti ile uzun mücadeleyi sonlandır."
 kie_beeswax_honey: "Balmumu ve Bal Ticareti"
 kie_beeswax_honey_desc: "Ukrayna balmumu: Ortodoks kiliselerine ve Batı Avrupa pazarlarına sunulan kilit bir mal."
 kie_form_ruthenia: "Rutenya’yı Kur"
 kie_form_ruthenia_desc: "Ukrayna’yı, Belarus’u ve batı Rusya’yı kapsayan “Rutenya” devletinin kuruluşunu ilan et. Moğol istilasından beri süren Rus birliği hayali nihayet gerçekleşir."
 kie_grand_principality: "Kiev Büyük Prensliği"
 kie_grand_principality_desc: "“Kiev Büyük Prensliği”: bu unvan kadim Kiev Rusyası’nın şanını gösterir. Kazak askerî gücünün, Ortodoks otoritesinin ve Rutenya kültürünün kaynaştığı Kiev Doğu Avrupa’nın büyük gücü olarak hüküm sürer."
 kie_events.1.t: "Kiev Uyanıyor: Rus Şehirlerinin Anası’nın Yeniden Kuruluşu"
 kie_events.1.d: "Dinyeper Nehri boyunca tepelerin üzerinde: Aya Sofya Katedrali’nin altın kubbeleri Kiev göğünde parlıyor.\n\n1337’de Kiev Prensliği küçük, ama Kiev Rusyası’nın kalbi olarak tarihin yükünü taşıyor. “Tüm Rus şehirlerinin anası”: bu unvan Kiev’in görevini tanımlar.\n\nLitvanya, Polonya ve Tatarlar her yandan baskı yapıyor, ama Dinyeper’in cömertliği, bereketli çernozem ve Kazak ruhu Kiev’i destekliyor.\n\nPeçersk Lavra’nın keşişleri dua ediyor: “Yeniden yüksel, ey Rus.” O duaya cevap ver."
 kie_events.1.a: "Kiev’in şanını geri al!"
 kie_events.20.t: "Kazak Hetmanlığı’nın İlanı"
 kie_events.20.d: "Zaporijya Kazakları Hetman’ın sancağı altında saf tutuyor: Kiev Büyük Prensi Kazak gücünü resmen devlet sistemine kat ve “Kazak Hetmanlığı”nı ilan eder. Bu eşsiz askerî-devlet sistemi Rutenya’nın geleceğini belirleyecek."
 kie_events.20.a: "Kazak Hetmanlığı çok yaşasın! Özgür Ukrayna çok yaşasın!"
 kie_events.60.t: "Rutenya’nın Oluşumu: Doğu Avrupa’nın Yeni Bir Gücü"
 kie_events.60.d: "Ukrayna, Belarus ve Halyç tek bir sancak altında: birleşik Doğu Slav devleti “Rutenya” Doğu Avrupa’nın yeni bir büyük gücü olarak ortaya çıkıyor. Tüm Rus halkları Kiev’in altın kubbeleri altında toplanıyor."
 kie_events.60.a: "Rutenya çok yaşasın! Kiev çok yaşasın!"
 kie_events.99.t: "Kiev Büyük Prensliği: Rus Şanının Yeniden Doğuşu"
 kie_events.99.d: "“Kiev Büyük Prensliği”: bu unvan Dinyeper kıyılarında yankılanıyor. Kazak askerî gücünün, Ortodoks otoritesinin ve Rutenya kültürünün kaynaştığı bir imparatorluk Doğu Avrupa’nın efendisi olarak hüküm sürüyor. Moğolların yıktığı Kiev Rusyası yeni bir biçimde yeniden doğdu: Rus Şehirlerinin Anası Kiev bir kez daha parlıyor."
 kie_events.99.a: "Kiev Büyük Prensliği çok yaşasın! Rus’un şanı ilelebet yaşasın!"
 STATIC_MODIFIER_NAME_kie_kyiv_dev_mod: "Dinyeper’in Altın Şehri"
 STATIC_MODIFIER_DESC_kie_kyiv_dev_mod: "Kiev, “Rus Şehirlerinin Anası” unvanına layık büyük bir şehre geliştirildi."
 STATIC_MODIFIER_NAME_kie_left_bank_mod: "Sol Yaka Ukrayna’sı Güvence Altında"
 STATIC_MODIFIER_DESC_kie_left_bank_mod: "Sol Yaka Ukrayna’sı güvence altına alındı: doğu Dinyeper Kiev yönetiminde."
 STATIC_MODIFIER_NAME_kie_right_bank_mod: "Sağ Yaka Ukrayna’sı Güvence Altında"
 STATIC_MODIFIER_DESC_kie_right_bank_mod: "Sağ Yaka Ukrayna’sı güvence altına alındı: batı Dinyeper doğuyla birleşti."
 STATIC_MODIFIER_NAME_kie_poltava_mod: "Kazak Kalesi Güvence Altında"
 STATIC_MODIFIER_DESC_kie_poltava_mod: "Kazak kalesi Poltava güvence altına alındı: bozkır sınırı istikrara kavuştu."
 STATIC_MODIFIER_NAME_kie_metropolitan_mod: "Rus Ortodoksluğunun Kalbi"
 STATIC_MODIFIER_DESC_kie_metropolitan_mod: "Kiev’in metropolitlik makamı Rus Ortodoksluğunun kalbi olarak yeniden kuruldu."
 STATIC_MODIFIER_NAME_kie_volhynia_mod: "Volinya Tahıl Ambarı"
 STATIC_MODIFIER_DESC_kie_volhynia_mod: "Volinya’nın bereketli ovaları Kiev devletinin tahıl ambarı olur."
 STATIC_MODIFIER_NAME_kie_lutsk_mod: "Batı Rus’un Anahtarı"
 STATIC_MODIFIER_DESC_kie_lutsk_mod: "Batı Rus’un anahtarı Lutsk güvence altına alındı ve Halyç’a giden yolu açtı."
 STATIC_MODIFIER_NAME_kie_galicia_mod: "Halyç İstila Edildi"
 STATIC_MODIFIER_DESC_kie_galicia_mod: "Halyç istila edildi ve Halyç-Volinya mirası canlandırıldı."
 STATIC_MODIFIER_NAME_kie_red_ruthenia_mod: "Kızıl Rus’a Boyun Eğdirildi"
 STATIC_MODIFIER_DESC_kie_red_ruthenia_mod: "Kızıl Rus, yani Kızıl Rutenya, boyun eğdirildi ve Ukrayna ile birleşti."
 STATIC_MODIFIER_NAME_kie_lviv_mod: "Aslan Şehri’nin Refahı"
 STATIC_MODIFIER_DESC_kie_lviv_mod: "Aslan Şehri Lviv, batı ticaretinin kapısı olarak gelişiyor."
 STATIC_MODIFIER_NAME_kie_podolia_mod: "Kara Toprak Tarım Arazileri"
 STATIC_MODIFIER_DESC_kie_podolia_mod: "Podolya’nın kara toprak tarım arazileri güvence altına alındı: tarımsal servet Kiev’e akar."
 STATIC_MODIFIER_NAME_kie_vinnytsia_mod: "Sağ Yaka Kalesi"
 STATIC_MODIFIER_DESC_kie_vinnytsia_mod: "Vinnitsa Sağ Yaka Ukrayna’sının kalesi olarak hizmet eder."
 STATIC_MODIFIER_NAME_kie_polesia_mod: "Bataklık Savunma Duvarı"
 STATIC_MODIFIER_DESC_kie_polesia_mod: "Polissya’nın bataklıkları kuzeyden gelecek istilacılara karşı doğal bir savunma duvarı oluşturur."
 STATIC_MODIFIER_NAME_kie_minsk_mod: "Beyaz Rutenya’nın Kalbi"
 STATIC_MODIFIER_DESC_kie_minsk_mod: "Beyaz Rutenya’nın kalbi Minsk Kiev denetimine giriyor."
 STATIC_MODIFIER_NAME_kie_cossack_mod: "Kazak Kılıcı"
 STATIC_MODIFIER_DESC_kie_cossack_mod: "Kazak kılıcı Kiev’in savaş gücünü seçkin bir bozkır ordusuna dönüştürür."
 STATIC_MODIFIER_NAME_kie_zaporizhzhia_mod: "Şelalelerin Ötesinde Özgürlük"
 STATIC_MODIFIER_DESC_kie_zaporizhzhia_mod: "Dinyeper şelalelerinin ötesinde Zaporijya Kazakları kılıçlarını Kiev’e adıyor."
 STATIC_MODIFIER_NAME_kie_tatar_wars_mod: "Tatarlara Karşı Mücadele"
 STATIC_MODIFIER_DESC_kie_tatar_wars_mod: "Tatarlara karşı seferler Kiev süvarisini korkusuz bozkır savaşçılarına dönüştürüyor."
 STATIC_MODIFIER_NAME_kie_steppe_mod: "Bozkırın Fatihi"
 STATIC_MODIFIER_DESC_kie_steppe_mod: "Bozkır fethedildi: Kiev Pontus çayırlarının efendisi olarak hüküm sürüyor."
 STATIC_MODIFIER_NAME_kie_crimea_mod: "Karadeniz Hâkimiyeti"
 STATIC_MODIFIER_DESC_kie_crimea_mod: "Karadeniz hâkimiyeti sağlandı: Kırım Kiev egemenliği altında."
 STATIC_MODIFIER_NAME_kie_black_sea_mod: "Karadeniz’e Giden Yol"
 STATIC_MODIFIER_DESC_kie_black_sea_mod: "Karadeniz’e giden yol açıldı: Kiev Akdeniz ticaretine erişim kazanıyor."
 STATIC_MODIFIER_NAME_kie_lavra_mod: "Mağara Manastırı"
 STATIC_MODIFIER_DESC_kie_lavra_mod: "Kiev-Peçersk Lavra’sı, yani Mağara Manastırı, Rus Ortodoksluğunun ruhu olarak yeniden kuruldu."
 STATIC_MODIFIER_NAME_kie_orthodox_mod: "Rutenya Ortodoks Canlanışı"
 STATIC_MODIFIER_DESC_kie_orthodox_mod: "Rutenya Ortodoksluğu canlandı: Kiev inancın koruyucusu rolünü yeniden ortaya koyar."
 STATIC_MODIFIER_NAME_kie_grain_mod: "Avrupa’nın Tahıl Ambarı"
 STATIC_MODIFIER_DESC_kie_grain_mod: "Ukrayna’nın bereketli kara toprağı Kiev’i Avrupa’nın tahıl ambarı yapar."
