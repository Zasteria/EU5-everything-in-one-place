 STATIC_MODIFIER_DESC_lit_crimea_mod: "Kırım Yarımadası Litvanya denetimine girdi ve Karadeniz’e açılan kapıyı açtı."
 STATIC_MODIFIER_NAME_lit_crusade_mod: "Haçlı Ruhu"
 STATIC_MODIFIER_DESC_lit_crusade_mod: "Katolik haçlı ruhu Litvanya ordusunu dövdü."
