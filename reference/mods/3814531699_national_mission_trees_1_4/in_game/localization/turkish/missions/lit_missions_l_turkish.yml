 STATIC_MODIFIER_DESC_lit_romuva_mod: "Kadim Baltık inancı Romuva canlandı ve Litvanya pagan bir devlet olarak duruyor."
 STATIC_MODIFIER_NAME_lit_rus_mod: "Rus’un Hükümdarı"
 STATIC_MODIFIER_DESC_lit_rus_mod: "Litvanya tüm Rus’un hükümdarı ve Doğu Avrupa’nın lideri oldu."
 STATIC_MODIFIER_NAME_lit_ruthenia_mod: "Kara Rutenya’ya Boyun Eğdirme"
 STATIC_MODIFIER_DESC_lit_ruthenia_mod: "Kara Rutenya Litvanya’nın egemenlik alanına katıldı ve doğuya genişleme için temel kurdu."
 STATIC_MODIFIER_NAME_lit_sanctuary_mod: "Romuva Kutsal Alanının Kuruluşu"
 STATIC_MODIFIER_DESC_lit_sanctuary_mod: "Litvanya’nın kutsal koruları kuruldu ve pagan alevi parlak yanıyor."
 STATIC_MODIFIER_NAME_lit_sejm_mod: "Sejm’in Kuruluşu"
 STATIC_MODIFIER_DESC_lit_sejm_mod: "Sejm kuruldu ve Litvanya’nın yönetimini modernleştirdi."
 STATIC_MODIFIER_NAME_lit_smolensk_mod: "Smolensk Hâkimiyeti"
 STATIC_MODIFIER_DESC_lit_smolensk_mod: "Smolensk Litvanya’nın doğu kapıcısı olarak işlev görür."
 STATIC_MODIFIER_NAME_lit_steppe_mod: "Bozkır Sınırının Kuruluşu"
 STATIC_MODIFIER_DESC_lit_steppe_mod: "Bozkır sınırı kuruldu ve Tatar akınlarını durduruyor."
 STATIC_MODIFIER_NAME_lit_teutonic_mod: "Töton Tarikatı’na Direniş"
 STATIC_MODIFIER_DESC_lit_teutonic_mod: "Töton Tarikatı’nın tehdidi Litvanya ordusunu dövdü."
 STATIC_MODIFIER_NAME_lit_third_rome_mod: "Üçüncü Roma"
 STATIC_MODIFIER_DESC_lit_third_rome_mod: "Kiev Ortodoks Kilisesi’nin merkezi “Üçüncü Roma” oldu."
 STATIC_MODIFIER_NAME_lit_volhynia_mod: "Volinya ve Podolya’nın Fethi"
 STATIC_MODIFIER_DESC_lit_volhynia_mod: "Batı Ukrayna ovaları Litvanya sancağıyla boyandı."
 lit_vilnius_jerusalem: "Kuzey’in Kudüs’ü"
 lit_vilnius_jerusalem_desc: "Vilnius: “Kuzey’in Kudüs’ü.” Çeşitli dinlerin ve kültürlerin bir arada yaşadığı bu şehre sanat ve nüfus akın eder ve Avrupa’da Litvanya’nın kültür merkezi olarak parlar."
 STATIC_MODIFIER_NAME_lit_vilnius_jerusalem_mod: "Kuzey’in Kudüs’ü"
 STATIC_MODIFIER_DESC_lit_vilnius_jerusalem_mod: "Vilnius “Kuzey’in Kudüs’ü” olur: çeşitli halkların, dinlerin ve kültürlerin merkezi."
 STATIC_MODIFIER_NAME_lit_teutonic_victory_mod: "Töton Tarikatı’nın Yenilgisi"
 STATIC_MODIFIER_DESC_lit_teutonic_victory_mod: "Marienburg’un siyah haçlı sancağı indirildi ve Litvanyalı askerler zafer şarkılarıyla batıya yürüyor."
 STATIC_MODIFIER_NAME_lit_vilnius_capital_mod: "Vilnius Geliştirildi"
 STATIC_MODIFIER_DESC_lit_vilnius_capital_mod: "Vilnius’taki Gediminas Kulesi’nden imparatorluk başkentinin çatıları ve surları gözlerin önüne seriliyor."
 lit_memel: "Klaipėda: Baltık’ın Kapısı"
 lit_memel_desc: "Klaipėda (Memel): Baltık kıyısında bir liman şehri. Töton Tarikatı’ndan geri alınan bu şehri Litvanya’nın denize açılan kapısı ve kehribar ticaretinin merkezi olarak geliştir."
 STATIC_MODIFIER_NAME_lit_memel_mod: "Klaipėda Limanı Geliştirildi"
 STATIC_MODIFIER_DESC_lit_memel_mod: "Klaipėda limanı Baltık ticaretinin kapısı olarak geliştirildi."
 STATIC_MODIFIER_NAME_lit_lublin_union_mod: "Lublin Birliği’nin Yararları"
 STATIC_MODIFIER_DESC_lit_lublin_union_mod: "Ortak Devlet’in parlamento sistemi ve idaresi kuruldu."
 lit_lublin_dev: "Lublin’in Gelişimi"
 lit_lublin_dev_desc: "Lublin, Lublin Birliği’nin gelecekteki yeri. Bu şehri güney Litvanya’nın idari ve ticaret merkezi olarak geliştir."
 lit_lviv_dev: "Lviv’in Gelişimi"
 lit_lviv_dev_desc: "Lviv (Lemberg): doğu ticaretinin bir kavşağı. Galiçya’nın merkezini geliştir ve imparatorluğun güneydoğusunda refahı teşvik et."
 lit_kaunas_dev: "Kaunas: Litvanya Hukukunun Koruyucusu"
 lit_kaunas_dev_desc: "Neris ve Nemunas nehirlerinin birleştiği yerdeki Kaunas (Kowno), Litvanya Büyük Dukalığı Tribünalı’nın (Lietuvos Vyriausiasis Tribunolas) makamı olarak hizmet etti ve Ortak Devlet’in Litvanya tarafı için en yüksek istinaf mahkemesi olarak işlev gördü. Polonya’daki Krakov Kraliyet Mahkemesi veya Provence’taki Aix Parlamentosu gibi Kaunas, merkezî mevzuat ile yerel gelenekler arasında köprü kurarak bölgesel hukukun koruyucusu olarak hizmet etti. Kaunas’ı Litvanya yargı idaresinin merkezi olarak geliştir."
 lit_hrodna_dev: "Grodno’nun Gelişimi"
 lit_hrodna_dev_desc: "Grodno (Hrodna): Kara Rutenya’nın merkezi. Büyük Dukalığın bu kilit batı şehrini geliştir."
 lit_minsk_dev: "Minsk’in Gelişimi"
 lit_minsk_dev_desc: "Minsk: Belarus’un merkezi. Onu Litvanya İmparatorluğu’nun doğu idari merkezi olarak geliştir."
