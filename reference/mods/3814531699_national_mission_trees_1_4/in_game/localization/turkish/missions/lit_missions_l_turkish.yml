 STATIC_MODIFIER_DESC_lit_moldavia_mod: "Litvanya’nın vasalı olarak Moldavya Balkanlar’a bir tutunak olur."
 STATIC_MODIFIER_NAME_lit_orthodox_mod: "Ortodoks Kilisesi’nin Korunması"
 STATIC_MODIFIER_DESC_lit_orthodox_mod: "Litvanya Ortodoks Kilisesi’ni himayesine aldı ve Rus’un koruyucusu olarak tanınıyor."
