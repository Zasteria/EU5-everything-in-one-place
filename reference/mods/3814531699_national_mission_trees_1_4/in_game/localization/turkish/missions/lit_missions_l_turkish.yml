 STATIC_MODIFIER_DESC_lit_krakow_mod: "Krakov Jagiellon şanının şehri olarak parlıyor."
 STATIC_MODIFIER_NAME_lit_livonia_mod: "Livonya Hâkimiyeti"
 STATIC_MODIFIER_DESC_lit_livonia_mod: "Baltık ticaretinin kalbi Livonya artık Litvanya sancağı altında duruyor."
