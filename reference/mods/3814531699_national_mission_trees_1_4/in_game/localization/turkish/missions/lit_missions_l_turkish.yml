l_turkish:
 lit_lithuania_mission_pack: "Baltık’tan Karadeniz’e"
 lit_lithuania_mission_pack_DESCRIPTION:0 "1337’de Büyük Dük Gediminas yönetimindeki Litvanya Büyük Dukalığı Doğu Avrupa’nın en dinamik gücüdür. Töton Şövalyeleri’ni yen, Rutenya’yı fethet, Karadeniz’e ulaş, Polonya ile bir Ortak Devlet kur ve inancını seçerek Litvanya’nın ruhunu tanımla."
 lit_lithuania_mission_pack_CRITERIA_DESCRIPTION:0 "Baltık’tan Karadeniz’e fethet ve Litvanya Büyük İmparatorluğu’nu inşa etmek için Polonya ile bir Ortak Devlet kur."
 lit_lithuania_mission_pack_BUTTON_TOOLTIP:0 "Litvanya olarak Baltık’tan Karadeniz’e Doğu Avrupa’ya hâkim ol."
 lit_lithuania_mission_pack_BUTTON_DETAILS:0 "“Litvanya’nın toprağı ilelebet”: Gediminas’tan Vytautas’a Büyük Dukalığın şanını yeniden kur!"
 lit_gediminas_legacy: "Gediminasoğulları’nın Mirası"
 lit_gediminas_legacy_desc: "Büyük Dük Gediminas’ın attığı hanedan temellerini miras al ve Baltık’tan Karadeniz’e uzanan büyük bir imparatorluğa giden yolda yürü."
 lit_teutonic_threat: "Töton Tehdidi"
 lit_teutonic_threat_desc: "Haçlı sancağı altında doğuya yürüyen Töton Tarikatı: bu dinî askerî devlet Litvanya’nın en büyük düşmanıdır. Onları kuşat ve batı sınırını güvenceye al."
 lit_black_ruthenia_integration: "Kara Rutenya’nın Bütünleştirilmesi"
 lit_black_ruthenia_integration_desc: "Grodno ve Brest merkezli Kara Rutenya: bu toprağı doğuya genişleme için bir temel olarak Litvanya’nın egemenlik alanına kat."
 lit_volhynia_podolia: "Volinya ve Podolya"
 lit_volhynia_podolia_desc: "Volinya ve Podolya: batı Ukrayna’nın zengin ovalarını Litvanya denetimi altına al ve Karadeniz’e giden yolu aç."
 lit_smolensk: "Smolensk’in Fethi"
 lit_smolensk_desc: "Smolensk, doğu Rus’a stratejik bir kapı. Bu kale şehrini ele geçir ve Moskova üzerindeki baskıyı artır."
 lit_kyiv: "Kiev’in Fethi"
 lit_kyiv_desc: "Kiev, tüm Rus şehirlerinin anası. Litvanya Kiev’i ele geçirdiğinde “tüm Rus’un hükümdarı” olmaya giden yol açılır."
 lit_steppe_frontier: "Bozkır Sınırı"
 lit_steppe_frontier_desc: "Tatarların ve Kumanların dolaştığı büyük bozkır: bu tehlikeli sınır bölgesinde bir savunma hattı kur ve Kırım’a giden yolu aç."
 lit_crimea: "Kırım’a Boyun Eğdirme"
 lit_crimea_desc: "Kırım Yarımadası, Karadeniz’in anahtarı. Kırım Tatar Hanlığı’na boyun eğdir ve Karadeniz’e açılan kapıyı güvenceye al."
 lit_black_sea: "Karadeniz’in Efendisi"
 lit_black_sea_desc: "Karadeniz, Litvanya’nın denizi. Kırım’dan Odessa’ya tüm Karadeniz kıyısını Litvanya sancağıyla boya."
 lit_dominant_in_rus: "Rus’ta Hâkim"
 lit_dominant_in_rus_desc: "Moskova ya da Litvanya: Doğu Avrupa üzerindeki üstünlük mücadelesinde Litvanya zafer kazanır ve “tüm Rus’un hükümdarı” olarak hüküm sürer."
 lit_teutonic_defeat: "Töton Şövalyeleri’nin Düşüşü"
 lit_teutonic_defeat_desc: "Grunwald’dan beri eski düşman Töton Tarikatı nihayet düştü: Baltık’ın hâkimiyeti Litvanya’ya ait."
 lit_samogitia: "Samogitya"
 lit_samogitia_desc: "Samogitya: Töton Tarikatı ile uzun süredir çekişilen bir toprak. Bu inatçı Baltık halkının yurdunu Litvanya için geri al."
 lit_livonia: "Livonya Hâkimiyeti"
 lit_livonia_desc: "Riga ve Livonya: Baltık ticaretinin kalbini Litvanya denetimi altına al ve Hansa Birliği üzerinde nüfuz kur."
 lit_jogaila_union: "Jogaila Birliği"
 lit_jogaila_union_desc: "Büyük Dük Jogaila’nın Polonya Krallığı ile birliği: Katolikliğe geçiş ve evlilik yoluyla Litvanya ve Polonya birbirine bağlanır."
 lit_jagiellonian_dynasty: "Jagiellon Hanedanı"
 lit_jagiellonian_dynasty_desc: "Jagiellon hanedanı: hem Litvanya’ya hem Polonya’ya hükmeden bu hane Orta Avrupa’nın en büyük gücü olarak yükselir."
 lit_lublin_union: "Lublin Birliği"
 lit_lublin_union_desc: "1569 Lublin Birliği: Litvanya ve Polonya’nın “Polonya-Litvanya Ortak Devleti” olarak birleştiği tarihî an."
 lit_polish_sejm: "Polonya Sejm’i"
 lit_polish_sejm_desc: "Szlachta’nın devlet kararlarına katıldığı kurum olan Sejm Ortak Devlet’in kalbi olur."
 lit_commonwealth: "Ortak Devlet’in Tamamlanması"
 lit_commonwealth_desc: "Polonya-Litvanya Ortak Devleti, Baltık’tan Karadeniz’e uzanan Orta Avrupa’nın en büyük devleti, tamam. “Bizim özgürlüğümüz için”: bu Ortak Devlet’in sancağı tüm Avrupa’da parlıyor."
 lit_faith_choice: "İnanç Tercihi"
 lit_faith_choice_desc: "Katolik, Ortodoks ya da Romuva: Litvanya hangi inancı seçecek? Bu karar ulusun geleceğini belirleyecek."
 lit_catholic_baptism: "Katolik İnancına Vaftiz"
 lit_catholic_baptism_desc: "1387’deki Vilnius vaftizi: Litvanya Katolikliği kucaklar ve Avrupa Hıristiyan dünyasının parçası olur."
 lit_faith_romuva_chosen_tt: "Romuva seçildi"
 lit_faith_orthodox_chosen_tt: "Ortodoksluk seçildi"
 lit_faith_catholic_chosen_tt: "Katoliklik seçildi"
 lit_catholic_crusade: "Katolik Haçlı Seferi"
 lit_catholic_crusade_desc: "Katolik sancağı altında, Töton Tarikatı’nın pagan haçlı devletine karşı saldırarak Litvanya Katolik dünyanın koruyucusu olarak tanınır."
 lit_catholic_bishoprics: "Piskoposlukların Kuruluşu"
 lit_catholic_bishoprics_desc: "Vilnius Piskoposluğu: Litvanya’da Katolik Kilisesi’nin yapısını örgütle ve inancın derin kök salmasını sağla."
 lit_catholic_king: "Katolik Kralın Taç Giyişi"
 lit_catholic_king_desc: "Polonya-Litvanya’nın Katolik Kralı: Papa’nın tanıdığı meşru bir taç artık Jagiellon hanedanı üzerinde parlıyor."
 lit_orthodox_metropolis: "Ortodoks Metropolitliği"
 lit_orthodox_metropolis_desc: "Kiev Metropolitliği: Litvanya Rus Ortodoksluğunun merkezini himayesine alır. Ortodoks müminlerin koruyucusu olarak Doğu Avrupa’ya hükmet."
 lit_orthodox_third_rome: "Üçüncü Roma"
 lit_orthodox_third_rome_desc: "İstanbul düştüğüne göre Kiev Ortodoksluğun yeni merkezi, “Üçüncü Roma” olur."
 lit_orthodox_unity: "Ortodoks Kilisesi’nin Birliği"
 lit_orthodox_unity_desc: "Ortodoks müminlerin birliği: tüm Rus’un Ortodoks kiliseleri Litvanya’nın himayesi altında toplanır."
 lit_orthodox_tsar: "Ortodoks Çar"
 lit_orthodox_tsar_desc: "“Tüm Rus’un Çarı”: Ortodoks otoritesini Rus üzerindeki egemenlikle birleştiren bir Litvanya hükümdarı Moskova’nın kendisini aşar."
 lit_romuva_maintained: "Romuva’yı Korumak"
 lit_romuva_maintained_desc: "Kadim Baltık inancı Romuva: Litvanya pagan sancak altında dururken Znich’in ebedî alevi yeniden yanar."
 lit_romuva_sanctuary: "Kutsal Alanı Kurmak"
 lit_romuva_sanctuary_desc: "Litvanya’nın kutsal koruları: Romuva’nın kutsal alanlarını koru ve Baltık inancının manevi merkezini kur."
 lit_romuva_expansion: "Pagan Genişlemesi"
 lit_romuva_expansion_desc: "Romuva’yı kılıçla yay: çevredeki Ortodoksları, Katolikleri ve Müslümanları Romuva’ya döndür ve bir “büyük pagan devleti” inşa et."
 lit_romuva_pagan_king: "Pagan Kral"
 lit_romuva_pagan_king_desc: "“Büyük Pagan Kral”: bir Litvanyalı pagan hükümdar doğuyor, Romuva’nın alevini yükseltiyor ve Baltık’tan Bozkır’a hüküm sürüyor."
 lit_vilnius_capital: "Vilnius’un Gelişimi"
 lit_vilnius_capital_desc: "Vilnius, Litvanya’nın altın şehri. Saraylarını, katedralini ve pazarlarını geliştir ve ona bir imparatorluk başkentine yaraşır bir görkem ver."
 lit_amber_road: "Kehribar Yolu"
 lit_amber_road_desc: "Kehribar Yolu: Baltık kehribarının Akdeniz’e taşındığı bu ticaret yolunu ele geçir ve Litvanya’yı Avrupa ticaretinin bir merkezi yap."
 lit_grand_duchy_law: "Büyük Dukalık Statüsü"
 lit_grand_duchy_law_desc: "1529’da Orta Avrupa’nın en ileri hukuk kanunnamesi olarak çıkarılan Litvanya Statüsü: Litvanya’nın yönetimini modernleştir."
 lit_krakow: "Krakov’un Gelişimi"
 lit_krakow_desc: "Krakov: Jagiellon şanının bu şehrini geliştir ve Polonya-Litvanya Ortak Devleti’nin ikinci başkenti olarak parlamasını sağla."
 lit_red_ruthenia: "Kızıl Rutenya’nın Fethi"
 lit_red_ruthenia_desc: "Polonya ve Macaristan’ın çekiştiği Kızıl Rutenya ve Galiçya: bu toprağı Litvanya için ele geçir ve egemenlik alanını Karpatlar’a uzat."
 lit_moldavia: "Moldavya’ya Boyun Eğdirme"
 lit_moldavia_desc: "Tuna boyunca bir Romen prensliği olan Moldavya: bu devlete boyun eğdir ve Balkanlar’a bir tutunak kur."
 lit_grand_empire: "Litvanya Büyük İmparatorluğu"
 lit_grand_empire_desc: "“Baltık’tan Karadeniz’e”: Büyük Dük Vytautas’ın hayali gerçekleşti. Litvanya Büyük Dukalığı Avrupa’nın en büyük imparatorluğu olarak hüküm sürüyor."
 lit_events.5.t: "İnanç Tercihi"
 lit_events.5.d: "Litvanya bir kavşakta duruyor. Katolikliğe geçip Polonya ile ittifakı derinleştirmeli mi? Ortodoksluğu koruyup Rus’un koruyucusu mu olmalı? Yoksa ata inancı Romuva’yı koruyup büyük bir pagan kral olarak mı durmalı?"
 lit_events.5.a: "Katolikliğe geç: Hıristiyan dünyasına katıl ve Polonya ittifakını derinleştir"
 lit_events.5.b: "Ortodoksluğu seç: Rus’un ve Doğu Hıristiyanlığının koruyucusu ol"
 lit_events.5.c: "Romuva’yı koru: Znich’in kutsal alevinin sönmesine asla izin verme"
 lit_events.10.t: "Kiev’in Fethi"
 lit_events.10.d: "Tüm Rus şehirlerinin anası Kiev Litvanya’ya düştü. Kiev Rusyası’nın mirasını artık Moskova değil Litvanya taşıyor."
 lit_events.10.a: "Kiev çok yaşasın! Tüm Rus’un koruyucusu çok yaşasın!"
 lit_events.15.t: "Katolik Kral"
 lit_events.15.d: "Papalığın tanımasıyla Litvanya ve Polonya’nın Katolik Kralı taç giydi: Litvanya artık resmen Katolik dünyanın parçası."
 lit_events.15.a: "Katolik Kral çok yaşasın! Krallık ilelebet payidar olsun!"
 lit_events.16.t: "Litvanya Çarı"
 lit_events.16.d: "Litvanya’nın hükümdarı kendini Ortodoks inancın koruyucusu “tüm Rus’un Çarı” ilan eder. Üçüncü Roma Moskova değil Vilnius olacak."
 lit_events.16.a: "Çar çok yaşasın! Üçüncü Roma çok yaşasın!"
 lit_events.17.t: "Pagan Kral"
 lit_events.17.d: "Znich’in ebedî alevi parlak yanıyor: Romuva sancağı altında Baltık’tan Bozkır’a hüküm süren bir “Büyük Pagan Kral” yükseldi."
 lit_events.17.a: "Pagan Kral çok yaşasın! Romuva’nın alevi ebediyen yansın!"
 lit_events.20.t: "Töton Tarikatı’nın Düşüşü"
 lit_events.20.d: "Grunwald’dan nihai hesaplaşmaya: Töton Tarikatı nihayet düştü. Baltık Denizi Litvanya’ya ait."
 lit_events.20.a: "Töton Tarikatı yenildi! Baltık Denizi bizim!"
 lit_events.99.t: "Litvanya Büyük İmparatorluğu"
 lit_events.99.d: "Baltık’tan Karadeniz’e: Vytautas’ın hayali yerine geldi. Litvanya eski Rus’u bile aşarak Doğu Avrupa’nın en büyük imparatorluğu olarak hüküm sürüyor."
 lit_events.99.a: "Litvanya Büyük İmparatorluğu çok yaşasın! Şan ebedî!"
