l_turkish:
 ubv_oberbayern_mission_pack: "Münih Mirası: Bavyera’nın Yeniden Birleşmesine Giden Yol"
 ubv_oberbayern_mission_pack_DESCRIPTION:0 "İmparator IV. Ludwig’in soyundan gelen Münih Hanedanı olarak, parçalanmış Bavyera topraklarını yeniden bir bütün hâlinde birleştir."
 ubv_oberbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Münih’i geliştir ve Bavyera’yı yeniden birleştir."
 ubv_oberbayern_mission_pack_BUTTON_TOOLTIP:0 "Münih’i geliştir ve Bavyera’yı yeniden birleştir."
 ubv_oberbayern_mission_pack_BUTTON_DETAILS:0 "Tüm Bavyera’nın Dükü olarak yüksel!"
 ubv_wittelsbach_legacy: "Wittelsbach Mirası"
 ubv_wittelsbach_legacy_desc: "1329 Pavia Antlaşması’yla bölünen Bavyera Dukalığı: İmparator IV. Ludwig’in soyundan gelen Münih kolu olarak bu mirası devral."
 ubv_secure_munich: "Münih’i Geliştir"
 ubv_secure_munich_desc: "Isar üzerindeki Münih: İmparator IV. Ludwig’in sevdiği bu şehri dukalığın merkezi olarak geliştir."
 ubv_salt_trade: "Tuz Ticareti"
 ubv_salt_trade_desc: "“Beyaz altın” denen tuz: Reichenhall tuz madenlerini ele geçir ve bu değerli kaynağın servetini güvence altına al."
 ubv_imperial_relations: "İmparatorlukla İlişkiler"
 ubv_imperial_relations_desc: "Bir zamanlar IV. Ludwig’in elinde olan imparatorluk tahtı: Kutsal Roma İmparatorluğu ile ilişkilerimizi bu şanlı anıya layık kıl."
 ubv_bavarian_ambition: "Birleşik Bavyera Emeli"
 ubv_bavarian_ambition_desc: "Münih’in gelişimi, tuz ticareti ve imparatorluk ilişkileri: bunların üzerine inşa et ve tüm Bavyera için emel besle."
 ubv_reunite_bavaria: "Bavyera’yı Yeniden Birleştir"
 ubv_reunite_bavaria_desc: "Parçalanmış dukalık: Aşağı Bavyera topraklarını geri al ve Bavyera’yı yeniden bir bütün hâlinde birleştir."
 ubv_duke_of_all_bavaria: "Tüm Bavyera’nın Dükü"
 ubv_duke_of_all_bavaria_desc: "Münih Hanedanı’nın soyu altında, tüm Bavyera nihayet tek bir sancak altında birleşti."
 ubv_events.1.t: "Bavyera Birliği’nin İlanı"
 ubv_events.1.d: "Münih Hanedanı’nın soyu altında Bavyera nihayet bir bütün olarak birleşti. Bölünme çağı sona eriyor."
 ubv_events.1.a: "Bavyera’ya şeref!"
 STATIC_MODIFIER_NAME_ubv_legacy_mod: "Wittelsbach Mirası"
 STATIC_MODIFIER_DESC_ubv_legacy_mod: "Bir zamanlar imparatorluk tacını giyen IV. Ludwig’in kanı, her saray mensubunun gururla andığı bir isim olmayı sürdürüyor."
 STATIC_MODIFIER_NAME_ubv_munich_mod: "Münih Gelişti"
 STATIC_MODIFIER_DESC_ubv_munich_mod: "Isar kıyısındaki şehir, dukalığın merkezi olarak çiçekleniyor."
 STATIC_MODIFIER_NAME_ubv_salt_mod: "Tuz Ticareti"
 STATIC_MODIFIER_DESC_ubv_salt_mod: "Reichenhall tuz madenlerinden “beyaz altın” yüklü arabalar, Münih pazarlarına doğru durmaksızın yuvarlanıyor."
 STATIC_MODIFIER_NAME_ubv_imperial_mod: "İmparatorlukla İlişkiler"
 STATIC_MODIFIER_DESC_ubv_imperial_mod: "Bir zamanlar IV. Ludwig’in başkanlık ettiği imparatorluk sarayıyla bağlar, elçilerin gidip gelmesini sürdürüyor."
 STATIC_MODIFIER_NAME_ubv_reunite_mod: "Bavyera Yeniden Birleşti"
 STATIC_MODIFIER_DESC_ubv_reunite_mod: "Bir zamanlar bölünmüş iki kolun vasalları artık tek bir sancak altında yemin ediyor."
 STATIC_MODIFIER_NAME_ubv_unify_bavaria_mod: "Tüm Bavyera’nın Dükü"
 STATIC_MODIFIER_DESC_ubv_unify_bavaria_mod: "Bavyera’nın kulelerindeki çanlar bölünmenin sonunu ilan ediyor."
 ubv_unified_duchy: "Birleşik Bavyera Dukalığı"
 ubv_unified_duchy_desc: "Bölünme çağı sona erdi: birleşik bir Bavyera Dukalığı olarak yeni bir çağ aç."
 ubv_bavaria_unified_tt: "Bavyera birleştirildi"
 ubv_landrecht: "Bavyera Landrecht’i"
 ubv_landrecht_desc: "Birleşik bir dukalık için tek bir hukuk: Bavyera hukuk kanununu (Landrecht) yürürlüğe koy ve yönetimin temelini güçlendir."
 ubv_tyrol_ambition: "Tirol Emeli"
 ubv_tyrol_ambition_desc: "Alpler’in kucağındaki Tirol Kontluğu: bu toprağa göz dik."
 ubv_swabian_expansion: "Svabya’ya Genişleme"
 ubv_swabian_expansion_desc: "Güneybatıya uzanan Svabya: bu bölge üzerindeki nüfuzumuzu güçlendir."
 ubv_greater_bavaria: "Büyük Bavyera’yı Gerçekleştir"
 ubv_greater_bavaria_desc: "Hukuk kanunu, Tirol ve Svabya: bunların üzerine inşa et ve Büyük Bavyera’yı gerçekleştir."
 ubv_counter_reformation_leader: "Karşı-Reform’un Öncüsü"
 ubv_counter_reformation_leader_desc: "Trento Konsili’nin ruhunu bünyende topla ve Karşı-Reform’un ön saflarında yer al."
 ubv_electoral_dignity: "Seçici Prens Unvanı"
 ubv_electoral_dignity_desc: "1623’te I. Maximilian nihayet Seçici Prens rütbesini güvence altına alıyor: bu şerefi Bavyera’nın ebedî gururu kıl."
 ubv_austrian_rivalry: "Avusturya ile Rekabet"
 ubv_austrian_rivalry_desc: "İmparatorluk içindeki hegemonya konusunda Habsburg Hanedanı ile rekabet: büyük rakibimizle bu çekişmeyle yüzleş."
 ubv_war_of_austrian_succession: "Avusturya Veraset Savaşı"
 ubv_war_of_austrian_succession_desc: "VII. Charles’ın imparatorluk tahtı üzerindeki hak iddiası yüzünden çıkan savaş: Bavyera’nın prestijini yükseltmek için bu veraset savaşını değerlendir."
 ubv_imperial_crown: "İmparatorluk Tacı"
 ubv_imperial_crown_desc: "1742’de Bavyera Dükü VII. Charles Kutsal Roma İmparatoru olarak taçlanıyor: yüzyıllardır tacı giyen ilk Habsburg olmayan kişi."
 ubv_enlightened_absolutism: "Aydınlanmış Mutlakiyet"
 ubv_enlightened_absolutism_desc: "Aklı ve ilmi değerli kılan bir aydınlanma çağı: bu yeni düşünce akımını Bavyera’nın yönetimine taşı."
 ubv_napoleonic_alliance: "Fransa’ya Meydan Okuma"
 ubv_napoleonic_alliance_desc: "Devrim ve Napolyon’un emelleriyle sarsılan Avrupa: Bavyera bu güçlü komşunun tahtı üzerinde bir hak iddiası edinir ve kendi rotasını çizer."
 ubv_kingdom_of_bavaria: "Bavyera Krallığı İlan Edildi"
 ubv_kingdom_of_bavaria_desc: "1806’da Seçici Prens IV. Maximilian Joseph kendini Bavyera Kralı ilan ediyor: Wittelsbach Hanedanı’nın uzun tarihi burada yeni bir zirveye ulaşıyor."
 ubv_events.3.t: "İmparatorluk Tacı"
 ubv_events.3.d: "1742’de Bavyera Dükü VII. Charles, Frankfurt katedralinde Kutsal Roma İmparatoru olarak taçlandı. Bir Habsburg dışında hiç kimsenin imparatorluk tacını giymesinin üzerinden yüzyıllar geçmişti."
 ubv_events.3.a: "Majesteleri İmparator’a şeref!"
 ubv_events.99.t: "Bavyera Krallığı’nın İlanı"
 ubv_events.99.d: "1806’da Seçici Prens IV. Maximilian Joseph, Ren Konfederasyonu çatısı altında kendini Bavyera Kralı ilan etti. Wittelsbach Hanedanı’nın uzun tarihi burada yeni bir zirveye ulaşıyor."
 ubv_events.99.a: "Yaşasın Bavyera Krallığı!"
 STATIC_MODIFIER_NAME_ubv_unified_mod: "Birleşik Bavyera Dukalığı"
 STATIC_MODIFIER_DESC_ubv_unified_mod: "Dukalık artık saraylarını, gelirlerini ve askerlerini rakip kollar arasında bölmek zorunda değil."
 STATIC_MODIFIER_NAME_ubv_greater_mod: "Büyük Bavyera Gerçekleşti"
 STATIC_MODIFIER_DESC_ubv_greater_mod: "Alp eteklerinden Svabya tepelerine, dük sancağı altındaki topraklar her mevsim genişliyor."
 STATIC_MODIFIER_NAME_ubv_counter_reformation_mod: "Karşı-Reform’un Öncüsü"
 STATIC_MODIFIER_DESC_ubv_counter_reformation_mod: "Trento Konsili ruhuyla dukalığın kasabalarında Cizvit kolejleri birbiri ardına açılıyor."
 STATIC_MODIFIER_NAME_ubv_succession_war_mod: "Avusturya Veraset Savaşı"
 STATIC_MODIFIER_DESC_ubv_succession_war_mod: "Avusturya Veraset Savaşı’nın savaş alanlarında pişen subaylar ve erler artık dük ordusunun çekirdeğini oluşturuyor."
 STATIC_MODIFIER_NAME_ubv_imperial_crown_mod: "İmparatorluk Tacı"
 STATIC_MODIFIER_DESC_ubv_imperial_crown_mod: "Bavyera Dükü’nün Frankfurt Katedrali’nde taçlandığı günün anısı, sarayda her yüreğe gururla kazınmıştır."
 STATIC_MODIFIER_NAME_ubv_enlightenment_mod: "Aydınlanmış Mutlakiyet"
 STATIC_MODIFIER_DESC_ubv_enlightenment_mod: "Sarayda Fransa’dan gelen yeni kitaplar Aydınlanma ideallerini yayıyor ve okul sayısı yıldan yıla artıyor."
 STATIC_MODIFIER_NAME_ubv_electoral_dignity_mod: "Seçici Prens Unvanı"
 STATIC_MODIFIER_DESC_ubv_electoral_dignity_mod: "Seçici Prens cübbesiyle donanmış Dük bir imparatorluk seçiminde yerini aldığında prensler sözlerini saygıyla dinler."
 STATIC_MODIFIER_NAME_ubv_kingdom_mod: "Bavyera Krallığı"
 STATIC_MODIFIER_DESC_ubv_kingdom_mod: "Münih’teki sarayda, Wittelsbach Hanedanı’ndan ilk Bavyera Kralı’nın taçlanışını kutlayan top salvoları gürlüyor."
