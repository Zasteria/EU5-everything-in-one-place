l_turkish:
 ple_english_pale_mission_pack: "Pale: Tacın Köprübaşından İrlanda Krallığı’na"
 ple_english_pale_mission_pack_DESCRIPTION:0 "Dublin merkezli dar İngiliz Pale’i: İrlanda-Norman lordlarıyla el ele ver, Gal topraklarını fethet ve tüm İrlanda’ya hükmeden bir krallık kur."
 ple_english_pale_mission_pack_CRITERIA_DESCRIPTION:0 "Pale’i pekiştir, tüm İrlanda’yı fethet ve bir krallık kur."
 ple_english_pale_mission_pack_BUTTON_TOOLTIP:0 "Küçük bir köprübaşından tüm Zümrüt Ada’ya hükmeden bir krallığa."
 ple_english_pale_mission_pack_BUTTON_DETAILS:0 "“Kralın kendisinden daha İrlandalı”: Pale’in sancağını tüm İrlanda’ya dik!"
 ple_english_pale: "İngiliz Pale’i"
 ple_english_pale_desc: "Dublin merkezli dar bir kıyı şeridi: bu, geniş bir Gal denizinin ortasında İngiliz kraliyet otoritesinin son köprübaşıdır."
 ple_dublin_castle: "Dublin Kalesi’ni Geliştir"
 ple_dublin_castle_desc: "1204’te inşa edilen Dublin Kalesi: İrlanda’daki İngiliz yönetiminin bu merkezini daha da güçlendir."
 ple_pale_defense: "Pale’i Tahkim Et"
 ple_pale_defense_desc: "Pale’i Gal akınlarından koruyan toprak surlar ve hendekler: “Hendek” olarak bilinen bu savunma hattını güçlendir."
 ple_lord_deputy: "İrlanda Lord Vekili"
 ple_lord_deputy_desc: "İngiliz Kralı’nın temsilcisi olarak İrlanda’yı yöneten Lord Vekili: bu makamı sarsılmaz kıl."
 ple_anglo_irish_parliament: "İngiliz-İrlanda Parlamentosu"
 ple_anglo_irish_parliament_desc: "Drogheda’da veya Dublin’de toplanan İrlanda Parlamentosu: bu İngiliz-İrlandalı lordlar ve şehir temsilcileri meclisini işlevsel kıl."
 ple_pale_consolidated: "Pale Pekiştirildi"
 ple_pale_consolidated_desc: "Tahkimatlar, Lord Vekili, hukuk ve Parlamento: bunların hepsi üzerine inşa et ve Pale’in yönetimini sarsılmaz kıl."
 ple_hiberno_norman_lords: "İrlanda-Norman Lordları"
 ple_hiberno_norman_lords_desc: "“İngilizlerin kendilerinden daha İngiliz” denen Anglo-Norman lordlar: onlarla ilişkiler kur."
 ple_fitzgerald_kildare: "Kildare’nin FitzGerald’ları"
 ple_fitzgerald_kildare_desc: "“Tüm İrlanda Kildare Kontu’nu yönetemez”: böyle denirdi. Bu heybetli evle ilişkiler kur."
 ple_butler_ormond: "Ormond’un Butler’ları"
 ple_butler_ormond_desc: "Kildare’lerin rakipleri olan Ormond’un Butler’ları: tacına sıkı sıkıya sadık bu evle ilişkiler kur."
 ple_statutes_of_kilkenny: "Kilkenny Statüleri"
 ple_statutes_of_kilkenny_desc: "1367’de çıkarılan Kilkenny Statüleri: İngiliz yerleşimcilerin “Galleşmesini” yasaklayan bu yasayı uygula."
 ple_gaelic_frontier_wars: "Gal Sınır Savaşları"
 ple_gaelic_frontier_wars_desc: "Pale’i çevreleyen Gal lordları: bu sınırın durmayan savaşıyla yüzleş."
 ple_conquer_leinster: "Leinster’i Fethet"
 ple_conquer_leinster_desc: "Pale’in güneyine yayılan Leinster: bu bölgeyi egemenlik alanımıza kat."
 ple_conquer_munster: "Munster’i Fethet"
 ple_conquer_munster_desc: "Desmond Kontu’nun nüfuz alanı Munster: bu zengin bölgeyi fethet."
 ple_conquer_connacht: "Connacht’ı Fethet"
 ple_conquer_connacht_desc: "Batı uçlarına yayılan Connacht: bu sınırı denetimimiz altına al."
 ple_conquer_ulster: "Ulster’i Fethet"
 ple_conquer_ulster_desc: "En inatçı Gal direnişinin kuzey toprağı Ulster: bu bölgeyi fethet."
 ple_master_of_ireland: "İrlanda’nın Efendisi"
 ple_master_of_ireland_desc: "Leinster, Munster, Connacht ve Ulster: bunların hepsine hükmet ve İrlanda’nın gerçek efendisi olarak dur."
 ple_reformation_choice: "Reform Tercihi"
 ple_reformation_choice_desc: "Luther’in ve Kalvin’in öğretileri denizi aşıyor: inancın bu kavşağında hangi yolu seçeceğiz?"
 ple_church_of_ireland: "İrlanda Kilisesi"
 ple_church_of_ireland_desc: "İngiltere Kilisesi ile hizalanmış İrlanda Kilisesi: bu yeni inancı bir yönetim aracı olarak kur."
 ple_recusant_catholics: "Direnişçi Katolikler"
 ple_recusant_catholics_desc: "Roma’ya bağlılıklarını bırakmayı reddeden “direnişçiler”: inançlarını yönetimin bir sütunu olarak kabul et."
 ple_dublin_university: "Dublin Üniversitesi"
 ple_dublin_university_desc: "Trinity College ile simgelenen Dublin’in ilim makamı: bu yeri bir ilim merkezi olarak geliştir."
 ple_english_crown_relations: "İngiliz Tacı ile İlişkiler"
 ple_english_crown_relations_desc: "Denizin ötesindeki İngiliz Tacı: bu üstün hükümdarla ilişkilerimizi tart, çünkü geleceğimize onlar karar verecek."
 ple_kingdom_of_ireland: "İrlanda Krallığı İlan Edildi"
 ple_kingdom_of_ireland_desc: "Pale’in küçük köprübaşında başlayan yol burada tüm İrlanda’ya hükmeden bir krallık olarak meyvesini veriyor: ama bu yeni krallığın izleyeceği yol henüz belirsiz."
 ple_events.99.t: "İrlanda Krallığı’nın İlanı"
 ple_events.99.d: "Dublin’in küçük köprübaşında başlayan uzun tarih burada tüm İrlanda’ya hükmeden bir krallık olarak yeni bir çağa giriyor."
 ple_events.99.a: "İrlanda’ya şeref!"
 ple_defy_the_crown: "Taca Meydan Okuma"
 ple_defy_the_crown_desc: "İrlanda Krallığı artık salt İngiltere’nin hizmetkârı değil: bu çatlağı gerçek egemenliğe giden ilk adım yap."
 ple_war_of_irish_independence: "İrlanda Bağımsızlık Savaşı"
 ple_war_of_irish_independence_desc: "Denizin ötesindeki tacla kaçınılmaz bir savaş: bu bağımsızlık savaşını kazan ve zincirleri kır."
 ple_sovereign_kingdom_of_ireland: "Egemen İrlanda"
 ple_sovereign_kingdom_of_ireland_desc: "Hiçbir taca tabi olmayan gerçekten bağımsız bir İrlanda Krallığı: Zümrüt Ada nihayet kendi kaderinin efendisi oluyor."
 ple_loyal_crown_partnership: "Taçla Ortaklık"
 ple_loyal_crown_partnership_desc: "Rekabet değil ortaklık: İrlanda Krallığı İngiliz tacıyla eşitlerin ittifakını seçiyor."
 ple_anglo_irish_union: "İngiliz-İrlanda Birliği"
 ple_anglo_irish_union_desc: "Yakın siyasi bağlar sayesinde iki krallık daha derin bir birliğe doğru adım atıyor."
 ple_united_kingdoms: "Birlikte Bir Ortak"
 ple_united_kingdoms_desc: "Rekabet yerine ortaklığı seçen İrlanda Krallığı ortak bir refah çağı inşa ederek birlikte bir ortak olarak İngiltere’nin yanında duruyor."
 STATIC_MODIFIER_NAME_ple_pale_mod: "İngiliz Pale’i"
 STATIC_MODIFIER_DESC_ple_pale_mod: "II. Henry’nin zamanından beri bu toprak İngiliz tacının anakaranın ötesindeki tek tutunağı olarak kaldı."
 STATIC_MODIFIER_NAME_ple_dublin_mod: "Dublin Kalesi Geliştirildi"
 STATIC_MODIFIER_DESC_ple_dublin_mod: "Eski Viking limanı artık İrlanda’da yönetimin ve ticaretin makamı olarak canlı."
 STATIC_MODIFIER_NAME_ple_defense_mod: "Pale Tahkim Edildi"
 STATIC_MODIFIER_DESC_ple_defense_mod: "“Pale”in toprak surları ve hendekleri içinde çiftçiler ani Gal akınlarından korkmadan tarlalarını sürüyor."
 STATIC_MODIFIER_NAME_ple_lord_deputy_mod: "Lord Vekili"
 STATIC_MODIFIER_DESC_ple_lord_deputy_mod: "Denizin ötesindeki Kral’ın yerine Dublin Kalesi’nde oturan Vekil büyük lordlar arasında bile saygı görüyor."
 STATIC_MODIFIER_NAME_ple_parliament_mod: "İngiliz-İrlanda Parlamentosu"
 STATIC_MODIFIER_DESC_ple_parliament_mod: "Kale surları içinde toplanan burjuvaların sesi artık devlet meselelerinde daha uzağa ulaşıyor."
 STATIC_MODIFIER_NAME_ple_consolidated_mod: "Pale Pekiştirildi"
 STATIC_MODIFIER_DESC_ple_consolidated_mod: "Dublin artık yabancı bir enklav değil, tacın kendi defterlerinde kayıtlı gerçek bir çekirdek toprak."
 STATIC_MODIFIER_NAME_ple_norman_lords_mod: "İrlanda-Norman Lordları"
 STATIC_MODIFIER_DESC_ple_norman_lords_mod: "Kalelerindeki Norman lordlar bu toprağa o kadar kök saldı ki “İrlandalıların kendilerinden daha İrlandalı” denir."
 STATIC_MODIFIER_NAME_ple_kilkenny_mod: "Kilkenny Statüleri"
 STATIC_MODIFIER_DESC_ple_kilkenny_mod: "1367’de çıkarılan bu yasa yerleşimcilerin İrlanda dilini ya da Galların âdetlerini benimsemesini yasaklar."
 STATIC_MODIFIER_NAME_ple_frontier_wars_mod: "Gal Sınır Savaşları"
 STATIC_MODIFIER_DESC_ple_frontier_wars_mod: "Pale hendeğinin ötesindeki sayısız çatışma askerleri sınır savaşlarına pişirdi."
 STATIC_MODIFIER_NAME_ple_leinster_mod: "Leinster Fethedildi"
 STATIC_MODIFIER_DESC_ple_leinster_mod: "Pale’e komşu Leinster’in ambarları artık tacın kendi vergi kütüklerine giriyor."
 STATIC_MODIFIER_NAME_ple_munster_mod: "Munster Fethedildi"
 STATIC_MODIFIER_DESC_ple_munster_mod: "Bir zamanlar Desmond Kontu’nun egemenlik alanı olan Munster limanlarından yün ve deri yüklü gemiler sonsuza dek yelken açıyor."
 STATIC_MODIFIER_NAME_ple_connacht_mod: "Connacht Fethedildi"
 STATIC_MODIFIER_DESC_ple_connacht_mod: "Vahşi Connacht’ın klanları bile artık tacın silah çağrısına cevap veriyor."
 STATIC_MODIFIER_NAME_ple_ulster_mod: "Ulster Fethedildi"
 STATIC_MODIFIER_DESC_ple_ulster_mod: "Uzun süre O’Neill’lerin ve O’Donnell’lerin elinde tutulan inatçı kuzey nihayet kraliyet sancağına boyun eğdi."
 STATIC_MODIFIER_NAME_ple_master_ireland_mod: "İrlanda’nın Efendisi"
 STATIC_MODIFIER_DESC_ple_master_ireland_mod: "Leinster’dan Ulster’a tüm Zümrüt Ada artık tek bir sancağın altında yatıyor."
 STATIC_MODIFIER_NAME_ple_reformation_mod: "Reform Tercihi"
 STATIC_MODIFIER_DESC_ple_reformation_mod: "Luther’in ve Kalvin’in denizi aşan öğretileri bu adanın kiliselerinde sessiz dalgalar yaratıyor."
 STATIC_MODIFIER_NAME_ple_church_ireland_mod: "İrlanda Kilisesi"
 STATIC_MODIFIER_DESC_ple_church_ireland_mod: "Canterbury ile hizalanan yeni kilisenin şapellerinde İngilizce İncil artık yüksek sesle okunuyor."
 STATIC_MODIFIER_NAME_ple_recusant_mod: "Direnişçi Katolikler"
 STATIC_MODIFIER_DESC_ple_recusant_mod: "Cezalandırılan ama boyun eğmeyen “direnişçiler” Roma’ya sessiz dualarını sürdürüyor."
 STATIC_MODIFIER_NAME_ple_university_mod: "Dublin Üniversitesi"
 STATIC_MODIFIER_DESC_ple_university_mod: "Trinity College’in manastır revaklarında yeni bir bilgin neslinin ayak sesleri artık yankılanıyor."
 STATIC_MODIFIER_NAME_ple_crown_relations_mod: "İngiliz Tacı ile İlişkiler"
 STATIC_MODIFIER_DESC_ple_crown_relations_mod: "Denizin ötesindeki saraydan gelen her mektup bu krallığın kaderini sessizce şekillendiriyor."
 STATIC_MODIFIER_NAME_ple_kingdom_ireland_mod: "İrlanda Krallığı"
 STATIC_MODIFIER_DESC_ple_kingdom_ireland_mod: "Yeni taç giymiş bir İrlanda Kralı artık Dublin Kalesi içindeki tahtta oturuyor."
 STATIC_MODIFIER_NAME_ple_defy_crown_mod: "Taca Meydan Okuma"
 STATIC_MODIFIER_DESC_ple_defy_crown_mod: "Denizin ötesindeki taca bağlılığı atanlar arasında bastırılamaz bir coşku yayılıyor."
 STATIC_MODIFIER_NAME_ple_irish_independence_war_mod: "İrlanda Bağımsızlık Savaşı"
 STATIC_MODIFIER_DESC_ple_irish_independence_war_mod: "Denizin ötesinden gönderilen orduyla sayısız çatışma bu adanın askerlerini pişmiş taktisyenlere dönüştürdü."
 STATIC_MODIFIER_NAME_ple_sovereign_ireland_mod: "Egemen İrlanda"
 STATIC_MODIFIER_DESC_ple_sovereign_ireland_mod: "Hiçbir taca borçlu olmayan gerçekten özgür bir İrlanda’nın sancağı artık Dublin Kalesi’nin kulelerinden dalgalanıyor. Diyarın her köşesine gönderilen valiler egemen bir devletin idari sinirlerini inşa ediyor."
 STATIC_MODIFIER_NAME_ple_loyal_partnership_mod: "Taçla Ortaklık"
 STATIC_MODIFIER_DESC_ple_loyal_partnership_mod: "Rekabet yerine güveni seçen iki tacın elçileri artık denizi her zamankinden daha sık geçiyor."
 STATIC_MODIFIER_NAME_ple_anglo_irish_union_mod: "İngiliz-İrlanda Birliği"
 STATIC_MODIFIER_DESC_ple_anglo_irish_union_mod: "Denizin ötesindeki saraya hizmet eden elçilerin yorulmak bilmez çalışmasıyla iki taç her zamankinden daha sıkı bağlı."
