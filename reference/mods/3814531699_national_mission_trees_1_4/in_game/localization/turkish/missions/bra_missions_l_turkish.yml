l_turkish:
 bra_brandenburg_mission_pack: "Kan ve Demir: Brandenburg’dan Alman İmparatorluğu’na"
 bra_brandenburg_mission_pack_DESCRIPTION:0 "Askanya Hanedanı’nın küçük Markgrafilik’inden yola çıkarak Hohenzollernler yönetiminde Prusya Krallığı’nı kur ve kan ve demir yoluyla Alman birliğini sağla."
 bra_brandenburg_mission_pack_CRITERIA_DESCRIPTION:0 "Markgrafilik’i kur, Prusya Krallığı’nı tesis et ve Alman İmparatorluğu’nu tamamla."
 bra_brandenburg_mission_pack_BUTTON_TOOLTIP:0 "Kutsal Roma İmparatorluğu’nun kum havuzundan Avrupa’nın hegemonuna."
 bra_brandenburg_mission_pack_BUTTON_DETAILS:0 "Günün büyük meseleleri konuşmalarla veya oy çokluğuyla değil, kan ve demirle çözülecek: Almanya’yı birleştir!"
 bra_ascanian_legacy: "Askanya Mirası"
 bra_ascanian_legacy_desc: "Askanya Hanedanı’nın kurduğu Brandenburg Markgrafilik’ini devral ve yeni bir hükümranlık çağı başlat."
 bra_march_authority: "Markgraf Otoritesini Kur"
 bra_march_authority_desc: "Parçalanmış soylu topraklarını dizginle ve Markgraf’ın otoritesinin diyarın her yanına ulaşmasını sağla."
 bra_turmoil_ended_tt: "“Brandenburg Kargaşası” felaketi sona erdi"
 bra_altmark_secure: "Altmark’ı Güvenceye Al"
 bra_altmark_secure_desc: "Markgrafilik’in doğum yeri Altmark: egemenliğini sarsılmaz kıl."
 bra_neumark_colonization: "Neumark’ı Kolonileştir"
 bra_neumark_colonization_desc: "Oder’in ötesindeki Neumark’a doğu kolonizasyonunu ilerlet ve yeni yerleşimler kur."
 bra_uckermark_integration: "Uckermark’ı Bütünleştir"
 bra_uckermark_integration_desc: "Uckermark’ı Markgrafilik’e tamamen kat."
 bra_pomeranian_rivalry: "Pomeranya ile Rekabet"
 bra_pomeranian_rivalry_desc: "Baltık Denizi’ne erişim konusunda Pomeranya Dukalığı ile rekabeti çöz."
 bra_wendish_lands: "Vend Toprakları"
 bra_wendish_lands_desc: "Bu toprak, Slav Vendlerinin torunları olan Kaşubyalıların yurdudur: kültürlerine hoşgörüyle sarıl ve Alman yollarını anlamalarını derinleştirerek iki halkın bir arada yaşayabileceğini göster."
 bra_berlin_dev: "Berlin’i Geliştir"
 bra_berlin_dev_desc: "Cölln ile birleştikten sonra Markgrafilik’in kalbine dönüşen Spree kıyısındaki kasaba Berlin: onu daha da geliştir."
 bra_electoral_dignity: "Seçici Prens Unvanı"
 bra_electoral_dignity_desc: "Kutsal Roma İmparatorluğu’nun Seçici Prensi statünü kur ve içindeki prestijini yükselt."
 bra_hohenzollern_investiture: "Hohenzollern Tevcihi"
 bra_hohenzollern_investiture_desc: "1417’de İmparator Sigismund Seçici Prens unvanını Hohenzollern Hanedanı’na verdi: bu yeni hanedanın yönetimini tesis et."
 bra_hohenzollern_dynasty: "Hohenzollern Hanedanı Güvence Altında"
 bra_hohenzollern_dynasty_desc: "Hohenzollern soyunu devletin sütunu yap ve kalıcı yönetimin temelini at."
 bra_imperial_diet: "İmparatorluk Diyeti’nde Söz"
 bra_imperial_diet_desc: "İmparatorluk Diyeti’ndeki sesini güçlendir ve imparatorluk siyasetinde rol al."
 bra_reformation_choice: "Reform Tercihi"
 bra_reformation_choice_desc: "Luther’in öğretileri tüm Almanya’yı sarsıyor: Brandenburg da inancını seçmelidir."
 bra_secularize_prussia: "Prusya’yı Laikleştir"
 bra_secularize_prussia_desc: "Töton Tarikatı devletinin laikleşmesini teşvik et ve Prusya’yı Brandenburg’un nüfuzu altına sok."
 bra_cleves_inheritance: "Cleves Mirası"
 bra_cleves_inheritance_desc: "Ren üzerindeki Jülich Veraset Savaşı’nı kazan ve batıda bir ek toprak güvence altına al."
 bra_thirty_years_war: "Otuz Yıl Savaşları’na Dayan"
 bra_thirty_years_war_desc: "Otuz Yıl Savaşları Almanya’yı kasıp kavuruyor: bu felakete dayan ve Markgrafilik’i koru."
 bra_great_elector: "Büyük Seçici Prens’in Saltanatı"
 bra_great_elector_desc: "Sonradan “Büyük Seçici Prens” olarak anılacak Friedrich Wilhelm yönetiminde devletin gücünü yeniden inşa et."
 bra_standing_army: "Daimi Ordu Kur"
 bra_standing_army_desc: "Soylu seferberliklerine bağlı kalmayan, doğrudan Seçici Prens’e hesap veren bir daimi ordu oluştur."
 bra_absolutism: "Mutlakiyeti Kur"
 bra_absolutism_desc: "Zümrelerin gücünü dizginle ve Seçici Prens’in iradesinin her köşeye ulaştığı bir devlet kur."
 bra_sovereign_prussia: "Prusya Üzerinde Egemenlik"
 bra_sovereign_prussia_desc: "Oliva Antlaşması ile Prusya Dukalığı üzerindeki Polonya üstünlüğünü at."
 bra_king_in_prussia: "Prusya’da Kral Olarak Taç Giy"
 bra_king_in_prussia_desc: "1701’de Königsberg’de I. Friedrich kendini “Prusya’da Kral” olarak taçlandırdı."
 bra_prussian_administration: "Prusya İdaresi"
 bra_prussian_administration_desc: "Verimli ve disiplinli bir bürokrasi kur ve modern bir devlete giden yolda yürü."
 bra_junker_integration: "Junkerleri Bütünleştir"
 bra_junker_integration_desc: "Elbe’nin doğusundaki Junker toprak soylularını ordunun ve idarenin çekirdeğine getir."
 bra_potsdam_dev: "Potsdam’ı Geliştir"
 bra_potsdam_dev_desc: "Kraliyet konutunun yeri Potsdam’ı saray kültürünün merkezi olarak geliştir."
 bra_soldier_king: "Asker Kral’ın Mirası"
 bra_soldier_king_desc: "“Asker Kral” I. Friedrich Wilhelm’in tutumlu ve militarist mirasını devral."
 bra_royal_treasury: "Dolu Bir Kraliyet Hazinesi"
 bra_royal_treasury_desc: "Tutumlu mali yönetimle Avrupa’nın en dolu hazinelerinden birini inşa et."
 bra_silesian_ambition: "Silezya Emelleri"
 bra_silesian_ambition_desc: "Habsburg Hanedanı’nın yönettiği zengin Silezya üzerinde meşru bir hak iddia et."
 bra_first_silesian_war: "Birinci Silezya Savaşı"
 bra_first_silesian_war_desc: "Genç II. Friedrich yıldırım istilasıyla Silezya’ya yürüyor."
 bra_silesia_annexed: "Silezya İlhak Edildi"
 bra_silesia_annexed_desc: "Silezya’nın zengin madencilik ve sanayi bölgesini Prusya’nın ekonomik temeli olarak tamamen ilhak et."
 bra_prussian_enlightenment: "Prusya Aydınlanması"
 bra_prussian_enlightenment_desc: "Büyük Friedrich yönetiminde Aydınlanma düşüncesi çiçek açıyor: “kral devletin ilk hizmetkârıdır” idealini bünyende topla."
 bra_seven_years_war: "Yedi Yıl Savaşları’na Dayan"
 bra_seven_years_war_desc: "Yedi Yıl Savaşları tüm Avrupa’yı sana karşı seferber ediyor: bu sınavı atlat ve büyük güç statünü savun."
 bra_frederick_the_great: "Büyük Friedrich’in Mirası"
 bra_frederick_the_great_desc: "“Büyük Friedrich” olarak anılan büyük kralın mirasını bir sonraki çağa taşı."
 bra_partitions_of_poland: "Polonya’nın Paylaşımlarına Katıl"
 bra_invasion_of_poland: "Polonya’yı İstila"
 bra_invasion_of_poland_desc: "Kuvvetlerimizi Büyük Polonya’ya yürüt ve bu zayıflamış komşunun topraklarından pay kopar."
 bra_partitions_of_poland_desc: "Gerileyen Polonya-Litvanya Ortak Devleti’nin paylaşımına katıl ve Batı Prusya’yı kazan."
 bra_prussian_academy: "Prusya Bilimler Akademisi"
 bra_prussian_academy_desc: "Berlin Bilimler Akademisi’ni geliştir ve ilim ve bilimin merkezi ol."
 bra_prussian_army_reform: "Prusya Ordu Reformu"
 bra_prussian_army_reform_desc: "Kalite mi nicelik mi: Prusya ordusunun karakterini belirle ve devlete kendine özgü bir askerî doktrin yerleştir."
 bra_napoleonic_crisis: "Napolyon Krizi"
 bra_napoleonic_crisis_desc: "Jena-Auerstedt’teki yenilgi: Napolyon karşısında Prusya bir varlık krizi yaşıyor."
 bra_stein_hardenberg_reforms: "Stein-Hardenberg Reformları"
 bra_stein_hardenberg_reforms_desc: "Hâlâ bizden ağır basan Fransa’nın mali temellerini sarsma vakti geldi: serflerin özgürleştirilmesi ve idari reformla krizden yeniden doğuş sağla."
 bra_rhineland_acquisition: "Rheinland’ı Edin"
 bra_rhineland_acquisition_desc: "Ren boyundaki zengin toprakları kazan ve sanayileşmenin temelini at."
 bra_show_of_strength: "Güç Gösterisi"
 bra_show_of_strength_desc: "Almanya’nın geniş alanlarına uzanmadan önce Prusya’nın gücünü kuzeyin prenslerine göster."
 bra_lower_saxony_conquest: "Aşağı Saksonya’yı Fethet"
 bra_lower_saxony_conquest_desc: "Lüneburg’daki ve Magdeburg’daki rakiplerimizi yen, Holstein’daki Emden limanını güvenceye al ve erişimimizi Aşağı Saksonya’ya yay."
 bra_westphalian_conquest: "Vestfalya Fethi"
 bra_westphalian_conquest_desc: "Kuzey Almanya üzerindeki hegemonyamızı daha da batıya, Vestfalya topraklarına yay."
 bra_zollverein: "Zollverein"
 bra_zollverein_desc: "Alman devletlerini ekonomik olarak birleştiren gümrük birliği Zollverein’e önderlik et."
 bra_prussian_constitution: "Prusya Anayasası"
 bra_prussian_constitution_desc: "1850 anayasasıyla anayasal monarşinin çerçevesini kur."
 bra_army_reform_1860s: "1860’ların Ordu Reformu"
 bra_army_reform_1860s_desc: "Roon ve Moltke’nin askerî reformları: daha önce seçtiğin kalite veya nicelik askerî doktrinini daha da yüksek zirvelere taşı."
 bra_danish_war: "Danimarka’ya Savaş"
 bra_danish_war_desc: "Schleswig-Holstein meselesi yüzünden Danimarka’ya karşı silaha sarıl."
 bra_austro_prussian_war: "Avusturya-Prusya Savaşı"
 bra_austro_prussian_war_desc: "Meseleyi Königgrätz Muharebesi’nde çöz ve Almanya’nın liderliğini kazan."
 bra_north_german_confederation: "Kuzey Alman Konfederasyonu"
 bra_north_german_confederation_desc: "Main’in kuzeyindeki Alman devletlerini, Avusturya hariç, birleştir ve Kuzey Alman Konfederasyonu’nu kur."
 bra_south_german_states: "Güney Alman Devletleriyle İttifak"
 bra_south_german_states_desc: "Bavyera, Württemberg ve diğer güney Alman devletleriyle askerî ittifaklar kur."
 bra_franco_prussian_war: "Fransa-Prusya Savaşı"
 bra_franco_prussian_war_desc: "Ems Telgrafı’nın kışkırttığı, İkinci Fransız İmparatorluğu’na karşı belirleyici savaşla yüzleş."
 bra_alsace_lorraine_annexed: "Alsas-Loren İlhak Edildi"
 bra_alsace_lorraine_annexed_desc: "Alsas’ı ve Loren’i savaş ganimeti olarak ilhak et ve Fransa ile kalıcı bir düşmanlık kazı."
 bra_german_empire: "Alman İmparatorluğu Kuruldu"
 bra_german_empire_desc: "Prusya Kralı’nın İmparator olduğu Alman İmparatorluğu’nu Avrupa’nın en yeni büyük gücü olarak kur."
 bra_kulturkampf: "Kulturkampf"
 bra_kulturkampf_desc: "Katolik Kilisesi’nin nüfuzunu dizginle ve devlet ile kilise arasındaki ilişkiyi yeniden tanımla."
 bra_social_legislation: "Sosyal Sigorta Mevzuatı"
 bra_social_legislation_desc: "Sosyalizme karşı bir önlem olarak hastalık, kaza ve yaşlılık sigortası sistemleri kur."
 bra_colonial_empire: "Bir Sömürge İmparatorluğu"
 bra_colonial_empire_desc: "“Güneşte bir yer” arayarak Afrika’da ve Pasifik’te koloniler kur."
 bra_high_seas_fleet: "Açık Deniz Filosu"
 bra_high_seas_fleet_desc: "Amiral Tirpitz’in yönetiminde Britanya ile boy ölçüşebilecek bir Açık Deniz Filosu inşa et."
 bra_weltpolitik: "Weltpolitik"
 bra_weltpolitik_desc: "II. Wilhelm’in “dünya politikası” sancağı altında dünyanın büyük güçleri arasındaki yerini al."
 bra_berlin_metropolis: "Büyük Berlin Tamam"
 bra_berlin_metropolis_desc: "Berlin’i Paris ve Londra ile boy ölçüşecek bir dünya şehrine dönüştür."
 bra_ruhr_industry_complete: "Ruhr Sanayisi Tamam"
 bra_ruhr_industry_complete_desc: "Ruhr’un sanayi gücünü sınırlarına kadar zorla ve dünyanın büyük ağır sanayi güçlerinden biri ol."
 bra_german_science: "Alman Biliminin Yükselişi"
 bra_german_science_desc: "Fizikte ve kimyada dünyaya öncülük eden bir Alman bilimi altın çağı inşa et."
 bra_naval_race: "Deniz Yarışı"
 bra_naval_race_desc: "Britanya ile deniz silahlanma yarışını kazan ve dünyayla rekabet edecek deniz gücünü göster."
 bra_balkan_influence: "Balkanlar’da Nüfuz"
 bra_balkan_influence_desc: "Avusturyalı müttefikin aracılığıyla Balkan Yarımadası üzerindeki nüfuzunu genişlet."
 bra_ottoman_partnership: "Osmanlılarla Ortaklık"
 bra_ottoman_partnership_desc: "Avrupa’nın “hasta adamı” Osmanlı İmparatorluğu ile Doğu’ya bir tutunak olarak ittifak kur."
 bra_mitteleuropa: "Mitteleuropa"
 bra_mitteleuropa_desc: "Orta Avrupa’yı bir Alman ekonomik alanına bütünleştiren “Mitteleuropa” vizyonunu ilerlet."
 bra_grossdeutschland: "Grossdeutschland"
 bra_grossdeutschland_desc: "Avusturya’yı da kapsayan “Büyük Almanya” idealini nihayet gerçekleştir."
 bra_hegemon_of_europe: "Avrupa’nın Hegemonu"
 bra_hegemon_of_europe_desc: "Ekonomide, askerî alanda ve diplomaside eşsiz bir Avrupa hegemonyası kur."
 bra_second_reich_eternal: "İkinci Reich, Ebedî"
 bra_second_reich_eternal_desc: "Küçük bir sınır markından Avrupa’ya hükmeden bir imparatorluğa: Hohenzollern Hanedanı’nın hikâyesi tamamlanıyor."
 bra_events.1.t: "Prusya’da Kral"
 bra_events.1.d: "18 Ocak 1701’de Königsberg’de I. Friedrich kendini “Prusya’da Kral” olarak taçlandırdı. Brandenburg Seçici Prensi artık kendi başına bir kral."
 bra_events.1.a: "Kral çok yaşasın! Prusya Krallığı kuruldu!"
 bra_events.2.t: "Versailles’da İlan"
 bra_events.2.d: "18 Ocak 1871’de Versailles’ın Aynalar Salonu’nda Prusya Kralı I. Wilhelm Alman İmparatoru ilan edildi. Bölünme çağı sona erdi ve birleşik bir Alman İmparatorluğu doğdu."
 bra_events.2.a: "İmparator çok yaşasın! Alman İmparatorluğu çok yaşasın!"
 bra_events.99.t: "İkinci Reich, Ebedî"
 bra_events.99.d: "Askanya Hanedanı’nın küçük Markgrafilik’iyle başlayan uzun yol varış noktasına ulaştı. Hohenzollernler altında Almanya şimdi Avrupa’da rakipsiz bir imparatorluk olarak hüküm sürüyor."
 bra_events.99.a: "Almanya’ya şeref! İkinci Reich çok yaşasın!"
 STATIC_MODIFIER_NAME_bra_ascanian_mod: "Askanya Mirası"
 STATIC_MODIFIER_DESC_bra_ascanian_mod: "Ayı armasıyla bir zamanlar sınırları işaretleyen Askanyalıların anısı sınır kalelerinin taşlarına kazılı kalıyor."
 STATIC_MODIFIER_NAME_bra_march_mod: "Markgraf Otoritesi Kuruldu"
 STATIC_MODIFIER_DESC_bra_march_mod: "Markgraf’ın mührüyle damgalanmış bildiriler malikâneden malikâneye dolaşıyor ve lordlar bile artık itaat ediyor."
 STATIC_MODIFIER_NAME_bra_altmark_mod: "Altmark Savunuldu"
 STATIC_MODIFIER_DESC_bra_altmark_mod: "Markgrafilik’in doğum yeri Altmark’ın savunmaları güçlendirildi."
 STATIC_MODIFIER_NAME_bra_neumark_mod: "Neumark Kolonileştirildi"
 STATIC_MODIFIER_DESC_bra_neumark_mod: "Oder’in ötesinde Alman yerleşimciler sabanlarını Neumark’ın yabanıllığına sürüyor."
 STATIC_MODIFIER_NAME_bra_pomerania_mod: "Pomeranya ile Rekabet"
 STATIC_MODIFIER_DESC_bra_pomerania_mod: "Pomeranya dükleriyle uzun süren kan davası mark lordlarına fethedilen toprağın nasıl yönetileceğini öğretti."
 STATIC_MODIFIER_NAME_bra_uckermark_mod: "Uckermark Bütünleştirildi"
 STATIC_MODIFIER_DESC_bra_uckermark_mod: "Uckermark’ın tahıl toprakları artık Markgraf’ın vergi tahsildarlarının defterlerinde görünüyor."
 STATIC_MODIFIER_NAME_bra_berlin_mod: "Berlin Geliştirildi"
 STATIC_MODIFIER_DESC_bra_berlin_mod: "Berlin, Markgrafilik’in kalbi olarak çiçek açıyor."
 STATIC_MODIFIER_NAME_bra_electoral_mod: "Seçici Prens Unvanı"
 STATIC_MODIFIER_DESC_bra_electoral_mod: "Seçici Prens mührü taşıyan elçiler artık imparatorun sarayında prenslerin yanında yerlerini alıyor."
 STATIC_MODIFIER_NAME_bra_hohenzollern_mod: "Hohenzollern Tevcihi"
 STATIC_MODIFIER_DESC_bra_hohenzollern_mod: "Nürnberg Burggraf’larından doğan bir aile, şimdi Brandenburg kalelerinde yeni bir hanedanın sancağını yükseltiyor."
 STATIC_MODIFIER_NAME_bra_dynasty_mod: "Hanedan Güvence Altında"
 STATIC_MODIFIER_DESC_bra_dynasty_mod: "Hohenzollern soyu artık hem sınır kalelerinde hem sarayda sorgulanmaz bir otorite olarak kabul ediliyor."
 STATIC_MODIFIER_NAME_bra_diet_mod: "Diyet’te Söz"
 STATIC_MODIFIER_DESC_bra_diet_mod: "Regensburg’daki İmparatorluk Diyeti’nde Brandenburg elçisi konuştuğunda prensler yakından dinliyor."
 STATIC_MODIFIER_NAME_bra_reformation_mod: "Reform Tercihi"
 STATIC_MODIFIER_DESC_bra_reformation_mod: "Luther’in öğretisini benimseyen bir Seçici Prens’in altında tebaası inanç farklılıklarına hoşgörüyü öğreniyor."
 STATIC_MODIFIER_NAME_bra_secularize_mod: "Prusya Laikleştirildi"
 STATIC_MODIFIER_DESC_bra_secularize_mod: "Bir zamanlar piskoposluk olan toprakların gelirleri artık Seçici Prens’in kendi memurlarınca yönetiliyor."
 STATIC_MODIFIER_NAME_bra_cleves_mod: "Cleves Mirası"
 STATIC_MODIFIER_DESC_bra_cleves_mod: "Batıdaki Cleves ek toprağı hazineye yeni servet getiriyor."
 STATIC_MODIFIER_NAME_bra_thirty_years_mod: "Otuz Yıl Savaşları’nın Sınavı"
 STATIC_MODIFIER_DESC_bra_thirty_years_mod: "Savaşa dayanma deneyimi vatan savunmasının anahtarı oldu."
 STATIC_MODIFIER_NAME_bra_great_elector_mod: "Büyük Seçici Prens’in Saltanatı"
 STATIC_MODIFIER_DESC_bra_great_elector_mod: "Fehrbellin’in galibi Büyük Seçici Prens’in adı hanedanın bizzat otoritesi hâline geldi."
 STATIC_MODIFIER_NAME_bra_standing_army_mod: "Daimi Ordu Kuruldu"
 STATIC_MODIFIER_DESC_bra_standing_army_mod: "Yalnızca Seçici Prens’e yemin etmiş daimi ordunun askerleri Potsdam’ın geçit alanlarında günbegün talim yapıyor."
 STATIC_MODIFIER_NAME_bra_absolutism_mod: "Mutlakiyet Kuruldu"
 STATIC_MODIFIER_DESC_bra_absolutism_mod: "Kralın emirleri artık Berlin sarayından devletin her köşesinin köy salonlarına yol alıyor."
 STATIC_MODIFIER_NAME_bra_sovereign_mod: "Prusya Egemenliği"
 STATIC_MODIFIER_DESC_bra_sovereign_mod: "Bir zamanlar Polonya kralına borçlu olunan biat’ı atan Prusya Dükü artık yabancı saraylarda eşit bir egemen olarak karşılanıyor."
 STATIC_MODIFIER_NAME_bra_administration_mod: "Prusya İdaresi"
 STATIC_MODIFIER_DESC_bra_administration_mod: "Genel Direktörlük katiplerinin hazırladığı defterler ve nizamlar krallığın her köşesindeki idareyi ayakta tutuyor."
 STATIC_MODIFIER_NAME_bra_junker_mod: "Junkerler Bütünleştirildi"
 STATIC_MODIFIER_DESC_bra_junker_mod: "Junkerler artık ordunun ve idarenin çekirdeği olarak işlev görüyor."
 STATIC_MODIFIER_NAME_bra_potsdam_mod: "Potsdam Geliştirildi"
 STATIC_MODIFIER_DESC_bra_potsdam_mod: "Kraliyet konutu Potsdam saray kültürünün merkezi olarak çiçek açıyor."
 STATIC_MODIFIER_NAME_bra_soldier_king_mod: "Asker Kral’ın Mirası"
 STATIC_MODIFIER_DESC_bra_soldier_king_mod: "Asker Kral’ın bıraktığı tutumluluk ve sıkı disiplin hâlâ kışlaların duvarlarına yapışık duruyor."
 STATIC_MODIFIER_NAME_bra_treasury_mod: "Dolu Bir Hazine"
 STATIC_MODIFIER_DESC_bra_treasury_mod: "Tutumlu kraliyet kasalarında önümüzdeki savaşlar için gümüş sandıkları yüksekçe yığılmış."
 STATIC_MODIFIER_NAME_bra_silesian_ambition_mod: "Silezya Emelleri"
