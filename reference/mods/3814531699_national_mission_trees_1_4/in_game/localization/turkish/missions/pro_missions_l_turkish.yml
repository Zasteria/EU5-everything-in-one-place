l_turkish:
 pro_jewel_of_occitania_mission_pack: "Oksitanya’nın Mücevheri"
 pro_jewel_of_occitania_mission_pack_DESCRIPTION:0 "Capet Anjou Hanedanı’nın torunları olarak Provence Kontları Napoli, Sicilya, Aragon, Macaristan ve Kudüs üzerinde hak iddialarına sahiptir. Marsilya’yı Akdeniz’in en büyük liman şehrine dönüştür, Oksitanya’yı birleştir ve Anjou hanedanının meşru miras haklarını dünyaya göster. “Kralların Kralı”nın şanı seni bekliyor."
 pro_jewel_of_occitania_mission_pack_CRITERIA_DESCRIPTION:0 "Provence Kontu olarak Anjou Hanedanı’nın miras haklarını gerçekleştir, Oksitanya’yı birleştir ve Fransa’yı fethet."
 pro_jewel_of_occitania_mission_pack_BUTTON_TOOLTIP:0 "Kralların Kralı olmak için görevleri tamamla."
 pro_jewel_of_occitania_mission_pack_BUTTON_DETAILS:0 "Dünyaya Marsilya’dan hükmet!"
 pro_house_of_anjou: "Anjou Hanedanı’nın Emelleri"
 pro_house_of_anjou_desc: "Capet Anjou Hanedanı bir zamanlar Sicilya’nın, Napoli’nin ve Macaristan’ın kraliyet evi olarak çiçek açtı, ama şimdi yalnızca güney Fransa’daki Provence Kontluğu’nu elinde tutuyor. Yine de Kral René’nin yüreği birçok kraliyet hakkı hayali barındırıyor. Provence toprağından şanı geri alma vakti geldi."
 pro_statutes_of_aix: "Aix Statüleri"
 pro_statutes_of_aix_desc: "Provence Kontluğu’nun başkenti olarak Aix-en-Provence “Aix Statüleri” denen kendi hukuk sistemini geliştirdi. Denetimin ve hukuki kodlamanın kurulması iki eşsiz kurumun kilidini açar: Etats de Provence (Genel Meclis) ve Marsilya Serbest Limanı."
 pro_statutes_of_aix_unlock_tt: "Provence Devletleri (Etats de Provence) ve Marsilya Serbest Limanı şehir ayrıcalıklarının kilidini açar."
 pro_sponsor_the_arts: "Sanatları Destekle"
 pro_sponsor_the_arts_desc: "Kral René İtalyan Rönesansı’nın en büyük hamilerinden biri olarak ünlüdür. Sanatçıları ve bilginleri davet et ve Provence’ı Rönesans kültürünün batı merkezi yap."
 pro_develop_marseille: "Marsilya’yı Geliştir"
 pro_develop_marseille_desc: "Antik Yunanlıların kurduğu liman şehri Marsilya, Akdeniz ticaretinin kilit merkezidir. Bu şehri geliştirmek Provence’ın ticaret ve deniz gücü olma yolundaki ilk adımını işaretler."
 pro_toulon_dockyard: "Toulon Tersanesi"
 pro_toulon_dockyard_desc: "Muhteşem bir doğal liman olan Toulon Akdeniz’deki en iyi deniz konumlarından biridir. Burada büyük bir tersane ve cephanelik inşa et ve onu Provence filosunun ana limanı yap."
 pro_lords_of_the_rhone: "Rhône Koridoru’nun Lordları"
 pro_lords_of_the_rhone_desc: "Rhône Nehri Alpler’i Provence’a bağlayan hayati bir ulaşım ve ticaret yoludur. Bu koridora tam hâkim olmak Provence’ı güney Fransa’nın tartışmasız hükümdarı olarak kurar."
 pro_avignon_question: "Avignon Meselesi"
 pro_avignon_question_desc: "1309’dan 1377’ye kadar Papalığın makamı olan Avignon hâlâ bir Papalık enklavı olarak var. Bu şehri diplomasi ya da fetih yoluyla Provence’a kat."
 pro_piqure_de_marseilles: "Piqure de Marseilles"
 pro_piqure_de_marseilles_desc: "“Piqué de Marseille”, karmaşık bir kapitone kumaş, Provence’ın sofistike tekstil zanaatkârlığını temsil eder. Kumaş ve ince kumaş üretimini genişletmek Provence’a büyük servet getirir."
 pro_la_marseillaise: "La Marseillaise"
 pro_la_marseillaise_desc: "Marsilya’dan ayrılan gönüllülerin söylediği marş. Provence ordusu artık güney Fransa’nın en güçlü askerî gücüdür."
 pro_claims_of_king_rene: "Kral René’nin Hak İddiaları"
 pro_claims_of_king_rene_desc: "İyi Kral René trajik biçimde Napoli tahtından atıldı ve Aragon tacından mahrum bırakıldı. Ama Anjou Hanedanı’nın meşru miras hakları kaybolmadı. Bu hakları dünyaya gösterme vakti geldi."
 pro_king_of_naples: "Napoli Kralı"
 pro_king_of_naples_desc: "Napoli tahtı Anjou Hanedanı’nın meşru mirasıdır. Aragon’un Trastamara hanedanının elinden alınan bu makamı geri al ve güney İtalya’da Anjou yönetimini yeniden kur."
 pro_king_of_sicily: "Sicilya Kralı"
 pro_king_of_sicily_desc: "Bir zamanlar Normanların kurduğu büyük Sicilya Krallığı da Anjou Hanedanı’na miras kaldı. Sicilya’yı bir kez daha Provence sancağı altına al."
 pro_king_of_aragon: "Aragon Kralı"
 pro_king_of_aragon_desc: "Aragon tahtı Anjou Hanedanı’nın en büyük rakibinin elinde. Napoli’yi çalan Trastamara hanedanından intikam al ve İber Yarımadası üzerinde hâkimiyeti ele geçir."
 pro_king_of_hungary: "Macaristan Kralı"
 pro_king_of_hungary_desc: "Anjou Hanedanı bir zamanlar Macaristan’ın kraliyet evi olarak hüküm sürdü. 14. yüzyılın sonunda kaybedilen bu tahtı geri al ve Doğu Avrupa üzerinde nüfuz kur."
 pro_king_of_jerusalem: "Kudüs Kralı"
 pro_king_of_jerusalem_desc: "“Kudüs Kralı” unvanı uzun süredir Anjou Hanedanı tarafından iddia edildi. Kutsal Şehir’i gerçekten fethederek ve Hıristiyan dünyasının koruyucusu olarak bu boş unvana son ver."
 pro_integrate_lorraine: "Loren’i Bütünleştir"
 pro_integrate_lorraine_desc: "Loren Dukalığı Anjou Hanedanı’nın elde tutmayı başardığı birkaç unvandan biridir. Çeşitli hizipleri bütünleştir ve Loren’i tamamen Provence denetimine al."
 pro_join_the_empire: "İmparatorluğa Katıl"
 pro_join_the_empire_desc: "Kutsal Roma İmparatorluğu’na katılmak Provence’ı büyük güçlerin tehditlerinden korumak için akıllıca bir diplomatik seçimdir. Alternatif olarak İmparatorluğu Arşidük olarak yönetmek de bir seçenektir."
 pro_unite_occitania: "Oksitanya’yı Birleştir"
 pro_unite_occitania_desc: "Güney Fransa’nın Oksitanca konuşan halkı Albigeois Haçlı Seferi’nden ve Yüz Yıl Savaşları’ndan bitkin düştü. Oksitanya’yı Provence Kontları’nın sancağı altında birleştir ve onları Fransız yönetiminden kurtar."
 pro_gascony: "Gaskonya"
 pro_gascony_desc: "Bordeaux merkezli Gaskonya İngiltere ile tarihî bağları olan zengin bir topraktır. Toulouse’u ve Bordeaux’yu denetlemek tüm güney Fransa’yı ele geçirir."
 pro_king_of_france: "Fransa Kralı"
 pro_king_of_france_desc: "Fransa Krallığı uzun süredir Provence’ın rakibi oldu, ama tahtını ele geçirme vakti geldi. Paris’i fethet ve Anjou sancağını tüm Fransa’ya dik."
 pro_king_of_kings: "Kralların Kralı"
 pro_king_of_kings_desc: "Anjou Hanedanı Napoli’yi, Sicilya’yı, Aragon’u, Macaristan’ı, Kudüs’ü ve Fransa’yı fethetti. Birçok taç taşıyan bu imparatorluğu Kralların Kralı yönetiyor: gerçeğe dönüşen bir ortaçağ hayali."
 STATIC_MODIFIER_NAME_pro_statutes_of_aix_mod: "Aix Statüleri"
 STATIC_MODIFIER_DESC_pro_statutes_of_aix_mod: "Aix-en-Provence merkezli Provence Kontları Roma hukuku geleneklerinden yararlanan kendi hukuk kanunnamelerini geliştirdi. Bu yazılı hukuk soyluların, din adamlarının ve burjuvaların haklarını ve görevlerini kodlayarak Provence’ı ortaçağ Fransası’nın hukuken en gelişmiş bölgelerinden biri yaptı."
 STATIC_MODIFIER_NAME_pro_sponsor_the_arts_mod: "Sanatın Himayesi"
 STATIC_MODIFIER_DESC_pro_sponsor_the_arts_mod: "Kral René bizzat fırça tutardı ve şiir yazardı: ender bir hükümdar-sanatçı. Sarayı Provence’ın trubadur geleneğini miras alırken Flandre’dan ve İtalya’dan sanatçıları çekti. “İyi Kral René” olarak itibarının büyük bölümü bu olağanüstü kültürel himayeye dayanır."
 STATIC_MODIFIER_NAME_pro_marseille_mod: "Marsilya’nın Refahı"
 STATIC_MODIFIER_DESC_pro_marseille_mod: "M.Ö. 600 civarında Phokaia’lı Yunan kolonistlerce Massalia olarak kurulan Marsilya antik çağdan beri bir Akdeniz ticaret merkezidir. Haçlı Seferleri sırasında Kutsal Topraklar’a giden adamlar ve malzeme için başlıca toplanma noktası olarak hizmet etti. Bu antik liman şehri Provence’ın ekonomik kalbidir."
 STATIC_MODIFIER_NAME_pro_toulon_dockyard_mod: "Toulon Tersanesi"
 STATIC_MODIFIER_DESC_pro_toulon_dockyard_mod: "Tepelerle korunan muhteşem bir doğal liman olan Toulon Körfezi antik çağdan beri denizcilere sığınak sundu. Provence Kontları bu doğal kaleyi 15. yüzyılda bir deniz üssü olarak geliştirdi. XIV. Louis sonradan burada Avrupa’nın en büyük deniz cephaneliklerinden birini inşa edecekti: zaten kök salan bir miras."
 STATIC_MODIFIER_NAME_pro_lords_of_the_rhone_mod: "Rhône Koridoru’nun Lordları"
 STATIC_MODIFIER_DESC_pro_lords_of_the_rhone_mod: "Rhône Nehri Roma zamanlarından beri Akdeniz’i iç Fransa’ya bağlayan büyük damar oldu. Bu su yolu boyunca Arles, Avignon ve yüzyıllardır mal, ordu ve hacının aktığı sayısız ticaret kasabası durur. Bu koridoru denetlemek Provence’ın stratejik kalbini elde tutmaktır."
 STATIC_MODIFIER_NAME_pro_avignon_question_mod: "Avignon Bütünleşti"
 STATIC_MODIFIER_DESC_pro_avignon_question_mod: "1309’dan 1377’ye kadar yedi papa Roma yerine Avignon’da ikamet etti: “Avignon Papalığı” olarak bilinen bu olay. Bu tuhaf dönem Avignon’u Avrupa’nın en büyük diplomatik şehirlerinden biri yaptı. Papalık sarayının hatırası hâlâ bu şehirde dolaşıyor: onu ele geçirmek Katolik dünya için derin simgesel ağırlık taşır."
 STATIC_MODIFIER_NAME_pro_piqure_de_marseilles_mod: "Piqure de Marseilles"
 STATIC_MODIFIER_DESC_pro_piqure_de_marseilles_mod: "Her iki yüzü de karmaşık dikişli kapitone kumaş “piqué de Marseille” 17. ve 18. yüzyıllarda Avrupa’yı kasıp kavurdu. Kökleri Provence’ın usta ortaçağ tekstil işçilerine uzanır. Marsilya limanından ihraç edilen ince kumaş uzun süredir Provence’ın ticari itibarının bir köşe taşını oluşturdu."
 STATIC_MODIFIER_NAME_pro_la_marseillaise_mod: "La Marseillaise"
 STATIC_MODIFIER_DESC_pro_la_marseillaise_mod: "Devrim sırasında Paris’e yürüyen Marsilyalı gönüllülerin söylediği şarkı bir gün Fransa’nın ulusal marşı olacaktı. Ama Provence’ın savaşçı ruhu daha da eskidir: Arles’in mızrak dövüşü arenalarında, Haçlı Seferleri’nde ve Akdeniz boyunca Anjou sancağı altındaki sayısız seferde dövülmüştür."
 STATIC_MODIFIER_NAME_pro_claims_of_king_rene_mod: "Kral René’nin Hak İddiaları"
 STATIC_MODIFIER_DESC_pro_claims_of_king_rene_mod: "“İyi Kral René” Napoli, Sicilya, Aragon, Macaristan ve Kudüs üzerinde hak iddialarına sahipti, ama neredeyse tüm savaşlarını kaybetti. Yine de bu unvanlar üzerindeki inatçı ısrarı, onlarca yıllık diplomasi ve sanat himayesi yoluyla sürdürüldü ve Anjou hanedanının meşruiyetini Avrupa saraylarında canlı tuttu."
 STATIC_MODIFIER_NAME_pro_king_of_naples_mod: "Napoli Kralı Unvanı"
 STATIC_MODIFIER_DESC_pro_king_of_naples_mod: "1266’da Anjoulu I. Charles tarafından kurulan Anjou Napoli Krallığı bir zamanlar güney İtalya’nın hâkim gücüydü. Sicilya Vespers’ta kaybedilmiş olsa da Napoli İtalya’daki Fransız emellerinin taç mücevheri ve yarımadadaki Anjou otoritesinin en somut simgesi olarak kaldı."
 STATIC_MODIFIER_NAME_pro_king_of_sicily_mod: "Sicilya Kralı Unvanı"
 STATIC_MODIFIER_DESC_pro_king_of_sicily_mod: "1282 Sicilya Vespers’ı, yani adalıların ayaklanıp Fransız hükümdarlarını kilise çanlarının çalmasıyla katlettiği olay, Anjouları Sicilya’dan ebediyen kovdu ve Aragonluları getirdi. Ama Norman, Arap ve Bizans kültürlerinin bir zamanlar birlikte çiçek açtığı bu ada Anjouların en büyük tamamlanmamış hayali olarak kalır."
 STATIC_MODIFIER_NAME_pro_king_of_aragon_mod: "Aragon Kralı Unvanı"
 STATIC_MODIFIER_DESC_pro_king_of_aragon_mod: "Aragon Tacı Sicilya’yı, Sardinya’yı ve Napoli’yi kapsayan bir Akdeniz imparatorluğu inşa etti: ve bunu büyük ölçüde Anjou hesabına yaptı. Bu iki hanedan arasındaki yüzyılı aşkın rekabet batı Akdeniz siyasetini şekillendirdi. Aragon’un tacını Trastamaraların elinden almak nihai intikamdır."
 STATIC_MODIFIER_NAME_pro_king_of_hungary_mod: "Macaristan Kralı Unvanı"
 STATIC_MODIFIER_DESC_pro_king_of_hungary_mod: "Anjoulu Károly Róbert (Carobert) 1310’da Macaristan Kralı olduğunda ailenin bir kolu Orta Avrupa’da büyük bir güç olarak yerleşti. Anjou hanedanı altında Macaristan Habsburglar ve Osmanlılar bölgeyi yeniden şekillendirmeden önce en müreffeh çağlarından birini yaşadı."
 STATIC_MODIFIER_NAME_pro_king_of_jerusalem_mod: "Kudüs Kralı Unvanı"
 STATIC_MODIFIER_DESC_pro_king_of_jerusalem_mod: "Bouillonlu Godefroy 1099’da Birinci Haçlı Seferi’ni zafere taşıdığında Kudüs Krallığı doğdu. 1187’de Selahaddin’e kaybedilen ve hiçbir zaman tamamen toparlanmayan “Kudüs Kralı” unvanı Avrupa hanedanları arasında dolaşan boş bir hak iddiası hâline geldi. Anjou Hanedanı bu unvanı uzun süredir elinde tutuyor: şimdi gerçek oluyor."
 STATIC_MODIFIER_NAME_pro_integrate_lorraine_mod: "Loren Bütünleşti"
 STATIC_MODIFIER_DESC_pro_integrate_lorraine_mod: "Loren (Lothringen) Verdun Antlaşması Büyük Karl’ın imparatorluğunu böldüğünden beri çekişmeli bir sınır bölgesidir. I. René’nin babası II. Louis Loren Dukalığı’nı elinde tutuyordu ve René bizzat Provence’ı miras almadan önce Loren Dükü’ydü. Bu kadim dukalık Fransız ve Alman dünyalarını köprüler."
 STATIC_MODIFIER_NAME_pro_join_the_empire_mod: "İmparatorluk Diplomasisi"
 STATIC_MODIFIER_DESC_pro_join_the_empire_mod: "Kutsal Roma İmparatorluğu uzun süredir Provence ile sınırdaştı ve Loren aracılığıyla Anjou Hanedanı İmparatorluk dünyasıyla zaten bağlara sahip. Üye olarak katılmak ya da Arşidük olarak yönetmek, Provence’ı İmparatorluğun karmaşık ittifaklar ağının içine yerleştirmek diplomatik erişimini büyük ölçüde genişletir."
 STATIC_MODIFIER_NAME_pro_unite_occitania_mod: "Oksitanya’nın Birliği"
 STATIC_MODIFIER_DESC_pro_unite_occitania_mod: "Oksitanca konuşan güney bir zamanlar saray aşkı sanatını icat eden ve şarkıları Avrupa’ya yayılan şairler olan trubadurların yurduydu. 13. yüzyılın Albigeois Haçlı Seferi ve Yüz Yıl Savaşları bu dünyayı parçaladı. Oksitanya’yı Provence altında birleştirmek kayıp bir medeniyeti yeniden tutuşturmaktır."
 STATIC_MODIFIER_NAME_pro_gascony_mod: "Gaskonya Ele Geçirildi"
 STATIC_MODIFIER_DESC_pro_gascony_mod: "Büyük şarap limanı Bordeaux merkezli Gaskonya İngiltere’nin kıtadaki son önemli mülküydü: 1453’te kaybedilmeden önce üç yüzyıl elde tutuldu. Şarapla, yünle ve Atlantik ticaretiyle zengin bu bölge daima bir ödüldü. Onu İngiliz nüfuzundan koparmak Provence Fransası’nın güney yayını tamamlar."
 STATIC_MODIFIER_NAME_pro_king_of_france_mod: "Fransa Kralı Unvanı"
 STATIC_MODIFIER_DESC_pro_king_of_france_mod: "Fransa’nın Capet hanedanı ve Anjou yan kolu ortak kan paylaşır: ama yolları Anjoulu Charles Sicilya’yı fethetmek için güneye yelken açtığında ayrıldı. Şimdi yan kol ana hattın tahtını ele geçiriyor. Fransa’nın Kilise’nin en büyük oğlu “En Hıristiyan Kral”ı Katolik Hıristiyan dünyasının en prestijli tacını takıyor."
 STATIC_MODIFIER_NAME_pro_king_of_kings_mod: "Kralların Kralı"
 STATIC_MODIFIER_DESC_pro_king_of_kings_mod: "Napoli, Sicilya, Aragon, Macaristan, Kudüs, Fransa: hiçbir ortaçağ hanedanı aynı anda bu kadar çok taç takmadı. Anjou Hanedanı küçük bir Provence kontluğundan Akdeniz’den Tuna’ya uzanan bir imparatorluğa yükseldi. İmkânsız bir hayal diye reddedilen “İyi Kral René”nin hayali gerçekleşti."
 pro_events.2.t: "Kral René’nin Hak İddiaları"
 pro_events.2.d: "Anjou Hanedanı’nın meşru miras haklarını ilan etme vakti geldi. Napoli Krallığı bir zamanlar Anjou’ydu, ama V. Alfonso’nun Aragon kuvvetlerine yenilerek kaybedildi. Şimdi Kral René adına bu haksız işgale itiraz ediyoruz. Napoli’ye karşı casus belli’yi elde et ve silah gücüyle Anjou Hanedanı’nın meşruiyetini kanıtla."
 pro_events.2.a: "Napoli Anjou Hanedanı’na aittir!"
 pro_lorraine_marriage: "Loren ile Evlilik"
 pro_lorraine_marriage_desc: "Loren Dukalığı Anjou Hanedanı’nın bir zamanlar elinde tuttuğu unvanlardan biridir. Diplomatik evlilik ve ittifak yoluyla Loren Hanedanı ile bağları derinleştir ve tımara giden yolu aç. Loren ile ilişkileri kan bağı, evlilik veya ittifak yoluyla kur."
 pro_events.3.t: "Bilge Robert’in Saltanatı"
 pro_events.3.d: "1337 itibarıyla Provence “Bilge” olarak anılan Anjoulu Robert (Roberto d’Angiò, yaklaşık 1277-1343) tarafından yönetiliyor. Napoli Kralı, unvan olarak Kudüs Kralı ve Provence Kontu olarak İtalyan siyasetinin merkezî figürüdür. İmparatorluk istilalarını püskürten Güelf (papalık yanlısı) partisinin şampiyonu olarak 1336’da Bohemyalı Jan’ı İtalya’dan kovdu. Sanatın ve ilmin derin bir hayranı, hem Petrarca hem Boccaccio tarafından saygı gören Robert Napoli’ye ve Provence’a kültürel bir altın çağ getirdi. Ama son yılları Sicilya’yı geri alma başarısızlığı ve bir veraset krizi ile sıkıntılı. Robert’in varisi Joanna genç ve Anjou Hanedanı’nın geleceği belirsiz. Bu büyük kralın iradesini sürdürme ve Anjou Hanedanı’nın şanını yeniden kurma vakti geldi."
 pro_events.3.a: "Kral Robert’in iradesini sürdür ve Anjou’nun şanını yeniden kur!"
 pro_events.4.t: "Loren ile Evlilik"
 pro_events.4.d: "Diplomatik manevralar ve evlilik politikası yoluyla Loren Dukalığı ile ilişkimiz her zamankinden güçlü hâle geldi. Anjou ve Loren kanları iç içe geçince iki evin çıkarları derinden bağlandı. Loren Dükü’nü Provence’ın bir vasalı olarak karşılama ve kaynaklarını ve askerî gücünü Anjou davasında kullanma vakti geldi."
 pro_events.4.a: "Loren Dükü’nü vasal olarak karşıla"
 pro_events.4.b: "İttifakı korurken bağımsızlığı sürdür"
 pro_events.5.t: "Kudüs Krallığı’nın Kuruluşu"
 pro_events.5.d: "Kutsal Şehir Kudüs nihayet Provence sancağı altına girdi. Anjou Hanedanı artık haçlı geleneğini sürdürerek “Kudüs Kralı” unvanını hem adıyla hem fiiliyle elinde tutuyor. Levant’ın kilit konumlarında Kudüs Krallığı’nı (KOJ) yeniden kur ve onu Provence’ın bir vasalı olarak yönettir. 1099’da Birinci Haçlı Seferi’yle kurulan bu kutsal krallık Anjou Hanedanı’nın eliyle yeniden doğuyor. Katolik inancın koruyucusu olarak Kutsal Topraklar’ı İslam güçlerine karşı savun."
 pro_events.5.a: "Kudüs Krallığı’nı yeniden kur ve onu bir Anjou vasalı olarak yönettir!"
 pro_etats_de_provence_town_rights: "Etats de Provence"
 pro_etats_de_provence_town_rights_desc: "Soyluların, din adamlarının ve burjuvaların katıldığı Provence Genel Meclisi. Üç zümreyi güçlendirir ve bölgesel özerkliği ve istişareli yönetimi güvence altına alır. Ayrıca kabine verimliliğini iyileştirir."
 pro_marseille_free_port_town_rights: "Marsilya Serbest Limanı"
 pro_marseille_free_port_town_rights_desc: "Marsilya’yı serbest liman ilan eder. Tüccar ticaret haklarını büyük ölçüde genişletir ve nüfus büyümesini, refahı ve burjuva gücünü artırır. Yalnızca Marsilya’ya verilebilir."
 pro_events.6.t: "Avignon Meselesinin Çözümü"
 pro_events.6.d: "Avignon, Papalık 1309’da orada ikamet etmeye başladığından beri Provence topraklarının içinde bir papalık enklavı olarak durdu. Papa XI. Gregorius 1377’de Roma’ya döndüğünde şehir papalık dayanağı olarak kaldı ve Provence Kontu’nun uzun süredir içerlediği Provence topraklarına bir kama soktu. Şimdi Papalıkla ilişkiler düzenli iken Avignon meselesini barışçıl biçimde çözme fırsatı geldi. Papa uygun bir tazminat karşılığında Avignon’u Provence’a devretmeyi kabul ediyor."
 pro_events.6.a: "Avignon Provence’a aittir"
