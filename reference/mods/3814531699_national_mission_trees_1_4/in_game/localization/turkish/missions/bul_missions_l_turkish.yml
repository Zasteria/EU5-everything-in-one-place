l_turkish:
 bul_bulgaria_mission_pack: "Yeni Bizans: İkinci İmparatorluk’un Mirası ve Balkan Hegemonyası"
 bul_bulgaria_mission_pack_DESCRIPTION:0 "İkinci Bulgar İmparatorluğu’nun mirasçısı olarak bağımsızlığı kur, Balkan yarımadası üzerinde hegemonya iddia et, Osmanlı tehdidini püskürt ve İstanbul’da yeni bir Bizans yükselt."
 bul_bulgaria_mission_pack_CRITERIA_DESCRIPTION:0 "Bağımsızlığı kur, Balkan imparatorluğunu canlandır, Osmanlıları püskürt ve Yeni Bizans’ı kur."
 bul_bulgaria_mission_pack_BUTTON_TOOLTIP:0 "Kadim Tırnova şehrinden Balkanlar’ın üzerinde parlayan yeni bir imparatorluğa."
 bul_bulgaria_mission_pack_BUTTON_DETAILS:0 "“Çarigrad’ın Efendisi”: İkinci İmparatorluk’un şanını miras al ve Üçüncü Bulgar İmparatorluğu’nu kur!"
 bul_second_bulgarian_legacy: "Parçalanan Bir İmparatorluk"
 bul_second_bulgarian_legacy_desc: "I. İvan Asen ve II. İvan Asen’in inşa ettiği görkemli imparatorluk şimdi soyluların emelleri altında Tırnova’ya, Vidin’e ve Dobruca’ya parçalanıyor: bu gerilemeyi durdur."
 bul_assert_independence: "Çarigrad’ın Otoritesi"
 bul_assert_independence_desc: "Parçalanma eşiğindeki bir imparatorluk: Tırnova Çarı olarak hiçbir rakip güce boyun eğmeyen bir otorite kur."
 bul_tarnovo_capital: "Tırnova’yı Geliştir"
 bul_tarnovo_capital_desc: "Bir zamanlar “İkinci Çarigrad” denen Tırnova: eski imparatorluk başkentinin şanını bu toprakta bir kez daha canlandır."
 bul_bulgarian_patriarchate: "Bulgar Patrikhanesi"
 bul_bulgarian_patriarchate_desc: "İstanbul’dan bağımsız otosefal bir kilise: Bulgar Ortodoks Kilisesi’nin otoritesini sarsılmaz kıl."
 bul_boyar_council: "Boyar Konseyi"
 bul_boyar_council_desc: "Bulgaristan’ı uzun süredir destekleyen soylular olan Boyarlar: konseylerini yönetimin bir sütunu olarak kullan."
 bul_reunite_bulgaria: "Bulgaristan’ı Yeniden Birleştir"
 bul_reunite_bulgaria_desc: "Bulgaristan ve Silistre: bu tarihî çekirdek toprakları tek bir sancak altında yeniden birleştir."
 bul_bulgarian_independence: "İmparatorluğun Yeniden Birleşmesi"
 bul_bulgarian_independence_desc: "İmparatorluk Vidin’e ve Dobruca’ya parçalandı: bu toprakları tek bir taç altına geri getir ve imparatorluğu Tırnova merkezli yeniden birleştir."
 bul_sofia: "Kutsal Bilgelik Şehri"
 bul_sofia_desc: "Serdica, Sredets, Triaditsa: bu şehir çağlar boyunca birçok ad taşıdı. Ona yeni bir çağa yaraşır bir unvanla yeniden ad ver."
 bul_conquer_macedonia: "Makedonya’yı Fethet"
 bul_conquer_macedonia_desc: "Antik çağlardan beri Bulgar kültürünün merkezi olan Makedonya: bu toprağı egemenlik alanımıza geri kat."
 bul_conquer_serbia: "Sırbistan’ı Fethet"
 bul_conquer_serbia_desc: "Komşu Sırbistan toprakları: Balkan hegemonyası mücadelesinde bu rakibe boyun eğdir."
 bul_bulgarian_empire: "Bulgar İmparatorluğu"
 bul_bulgarian_empire_desc: "Bulgaristan bir zamanlar Balkanların büyük bölümüne yayılan büyük bir İmparatorluğa hükmetti. Bu toprakları egemenlik alanımıza geri vereceğiz!"
 bul_conquer_wallachia: "Eflak’ı Fethet"
 bul_conquer_wallachia_desc: "Tuna’nın kuzey kıyısındaki Eflak: bu toprak üzerinde nüfuzumuzu kur."
 bul_conquer_moldavia: "Moldavya’yı Fethet"
 bul_conquer_moldavia_desc: "Karpat Dağları’nın doğusundaki Moldavya: bu zengin toprağı egemenlik alanımıza kat."
 bul_conquer_transylvania: "Transilvanya’yı Fethet"
 bul_conquer_transylvania_desc: "Dağlarla çevrili Transilvanya: bu bölgeyi imparatorluğumuzun bir parçası yap."
 bul_conquer_thrace_greece: "Trakya’yı ve Kuzey Yunanistan’ı Fethet"
 bul_conquer_thrace_greece_desc: "Antik Trakyalıların toprağı ve kuzey Yunanistan: bu bölgeyi imparatorluğumuza kat."
 bul_extend_the_empire: "İmparatorluğu Genişlet"
 bul_extend_the_empire_desc: "İmparatorluğun sınırları daha da ileriye itilmeli. Yunanistan’a ve Karpatlar’a doğru seferimizi sürdürelim."
 bul_chitalishte_movement: "Çitalişte Hareketi"
 bul_chitalishte_movement_desc: "“Okuma odaları” olarak bilinen çitalişteler, yani kültür toplum merkezleri: bunların tüm diyarda kök salmasına izin ver ve kasabalılar arasında okuryazarlığı ve ulusal bilinci besle. Bulgar Ulusal Uyanışı burada başlıyor."
 bul_chitalishte_unlock_tt: "“Çitalişte Kasabası” şehir ayrıcalığı kullanılabilir olur."
 bul_ottoman_wars: "Osmanlı Savaşları"
 bul_ottoman_wars_desc: "Yükselen Osmanlı İmparatorluğu: bu yeni tehdide karşı mücadeleyle yüzleş."
 bul_varna_crusade: "Varna Haçlı Seferi"
 bul_varna_crusade_desc: "Macaristan’ın yanında yüksel ve Osmanlılara karşı bir haçlı seferine önderlik et. 1444’te tarih Varna’da dönüyor."
 bul_end_ottoman_threat: "Osmanlı Tehdidine Son Ver"
 bul_end_ottoman_threat_desc: "Bir zamanlar korkulan Osmanlı tehdidi: ona son ver ve Balkanlar’daki konumumuzu güvenceye al."
 bul_constantinople_ambition: "İstanbul’a Yönelik Emel"
 bul_constantinople_ambition_desc: "Bir zamanlar Ortodoks dünyasının merkezi olan şehir: bu şehir için emel besle."
 bul_new_byzantium: "İstanbul’un ve Roma’nın Mülkiyeti"
 bul_new_byzantium_desc: "Ortodoks dünyasının merkezi İstanbul ve Batı Kilisesi’nin makamı Roma: her iki şehri birlikte ele geçir ve Bulgaristan’ın Hıristiyan dünyasının her iki yarısına başkanlık eden yeni bir imparatorluk olarak yükselmesine izin ver."
 bul_black_sea_trade: "Karadeniz Ticareti"
 bul_black_sea_trade_desc: "Karadeniz’deki liman şehri Varna: onu Karadeniz ticareti için bir tutunak olarak geliştir."
 bul_black_sea_dominion: "Karadeniz Üzerinde Egemenlik"
 bul_black_sea_dominion_desc: "Karadeniz’in geniş kıyı şeridi: bu sular boyunca ticarette üstünlük kur."
 bul_third_bulgarian_empire: "Üçüncü Bulgar İmparatorluğu"
 bul_third_bulgarian_empire_desc: "Bağımsızlık, Balkanların birleşmesi, Osmanlıların yenilgisi ve Yeni Bizans’ın kuruluşu: burada Üçüncü Bulgar İmparatorluğu tamamlanıyor."
 bul_events.1.t: "İmparatorluk Yeniden Birleşmesinin İlanı"
 bul_events.1.d: "Bir zamanlar parçalanmış olan Tırnova, Vidin ve Dobruca tek bir imparatorluk olarak yeniden birleşti. İkinci Bulgar İmparatorluğu yeni bir güç buluyor."
 bul_events.1.a: "Bulgaristan’a şeref!"
 bul_events.4.t: "Sofya’nın Tarihi"
 bul_events.4.d: "Romalıların Serdica, sonra Slavların Sredets dediği bu kadim şehir şimdi Kutsal Bilgelik Kilisesi’nin (Sophia) onuruna yeni bir ad alacak. Trakyalılar, Romalılar, Bizanslılar ve Bulgarlar: bu havzadan geçen birçok medeniyetin ağırlığı hafızaya kazınsın."
 bul_events.4.a: "Adını Sofya koy"
 bul_events.4.b: "Adını Sofya koy ve onu yeni imparatorluk başkenti yap"
 bul_events.2.t: "Bulgar İmparatorluğu’nun İlanı"
 bul_events.2.d: "Makedonya’nın ve Sırbistan’ın hükümdarı olarak Bulgaristan burada kendini imparatorluk ilan ediyor."
 bul_events.2.a: "İmparator çok yaşasın!"
 bul_events.3.t: "Yeni Bizans Hayali"
 bul_events.3.d: "İstanbul’un surları içinde ve ebedî Roma’nın tepelerinde Bulgaristan’ın sancağı artık dalgalanıyor. Ortodoks dünyasının yeni merkezi ve Batı Kilisesi’nin makamı olarak bu iki şehir burada yeni bir imparatorluğun ikiz sütunları olarak yeniden doğuyor."
 bul_events.3.a: "Tanrı bizimle!"
 bul_events.99.t: "Üçüncü Bulgar İmparatorluğu’nun İlanı"
 bul_events.99.d: "Kadim Tırnova şehrinde başlayıp Balkanların birleşmesinden, Osmanlıların yenilgisinden ve Yeni Bizans’ın kuruluşundan geçen uzun yol burada gerçek tamamlanışına ulaştı."
 bul_events.99.a: "Üçüncü Bulgar İmparatorluğu çok yaşasın!"
 bul_hagia_sophia_sofia: "Aziz Sophia Kilisesi"
 bul_hagia_sophia_sofia_desc: "6. yüzyılda İmparator Justinianus’un saltanatında yükseltilen bir bazilika: “Kutsal Bilgelik” anlamına gelen adı zamanla çevresinde büyüyen şehre ödünç verecekti. Sayısız çağa dayanan bu kilise Bulgaristan’ın kalbine yerleştirilmiş yeni bir başkentin ruhu olarak tarihine sessizce tanıklık ediyor."
 STATIC_MODIFIER_NAME_bul_legacy_mod: "İkinci Bulgar İmparatorluğu’nun Mirası"
 STATIC_MODIFIER_DESC_bul_legacy_mod: "İç çekişme fırtınası içinde bile hukukun mekanizması ve sarayda katiplerin zanaatı güçlükle bir arada duruyor."
 STATIC_MODIFIER_NAME_bul_independence_mod: "Bağımsızlık Kuruldu"
 STATIC_MODIFIER_DESC_bul_independence_mod: "Artık hiç kimse Tırnova tahtında oturanın otoritesini sorgulamaya cesaret edemiyor."
 STATIC_MODIFIER_NAME_bul_tarnovo_mod: "Veliko Tırnovo"
 STATIC_MODIFIER_DESC_bul_tarnovo_mod: "Çarevets tepesinde yükseltilen saraylar ve kiliseler bir imparatorluk başkentinin ihtişamını geri kazanıyor."
 STATIC_MODIFIER_NAME_bul_patriarchate_mod: "Bulgar Patrikhanesi"
 STATIC_MODIFIER_DESC_bul_patriarchate_mod: "Patrik’in duası nerede yaşarlarsa yaşasınlar müminlerin yüreklerine huzur getirir."
 STATIC_MODIFIER_NAME_bul_boyar_mod: "Boyar Konseyi"
 STATIC_MODIFIER_DESC_bul_boyar_mod: "Boyarlar tahta sadakat yeminlerini yeniledi."
 STATIC_MODIFIER_NAME_bul_reunite_mod: "Bulgaristan Yeniden Birleşti"
 STATIC_MODIFIER_DESC_bul_reunite_mod: "Bir zamanlar parçalanmış topraklar üzerinde artık yeniden tek bir sancak dalgalanıyor."
 STATIC_MODIFIER_NAME_bul_macedonia_mod: "Makedonya Fethedildi"
 STATIC_MODIFIER_DESC_bul_macedonia_mod: "Bir zamanlar Samuil’in şanına tanıklık eden dağlar Çar’ın egemenlik alanına döndü."
 STATIC_MODIFIER_NAME_bul_extend_empire_mod: "İmparatorluk Genişletildi"
 STATIC_MODIFIER_DESC_bul_extend_empire_mod: "Genişleyen sınırlarımız gücümüzü her komşu diyara duyuruyor."
 STATIC_MODIFIER_NAME_bul_ottoman_wars_mod: "Osmanlı Savaşları"
 STATIC_MODIFIER_DESC_bul_ottoman_wars_mod: "Türk tehdidiyle sayısız çatışma askerlerimizi pişirdi."
 STATIC_MODIFIER_NAME_bul_varna_mod: "Varna Haçlı Seferi"
 STATIC_MODIFIER_DESC_bul_varna_mod: "Varna tepelerinde düşenlerin hatırası bugüne kadar anlatılıyor."
 STATIC_MODIFIER_NAME_bul_end_ottoman_mod: "Osmanlı Tehdidi Sona Erdi"
 STATIC_MODIFIER_DESC_bul_end_ottoman_mod: "Uzun süredir korkulan bir tehdit ayrılırken Balkanlar’ın üzerinden bir rahatlama iç çekişi geçiyor."
 STATIC_MODIFIER_NAME_bul_constantinople_ambition_mod: "İstanbul’a Yönelik Emel"
 STATIC_MODIFIER_DESC_bul_constantinople_ambition_mod: "Savaş gemilerimizin gölgesi artık Karadeniz’i Akdeniz’e bağlayan deniz yolunun üzerine düşüyor."
 STATIC_MODIFIER_NAME_bul_varna_port_mod: "Karadeniz Ticareti"
 STATIC_MODIFIER_DESC_bul_varna_port_mod: "Yabancı ticaret gemileri Varna limanına durmaksızın gidip geliyor."
 STATIC_MODIFIER_NAME_bul_black_sea_dominion_mod: "Karadeniz Üzerinde Egemenlik"
 STATIC_MODIFIER_DESC_bul_black_sea_dominion_mod: "Bulgar ticaret gemileri artık Karadeniz’in dalgalarını sanki kendilerininmiş gibi sürüyor."
 STATIC_MODIFIER_NAME_bul_third_bulgarian_empire_mod: "Üçüncü Bulgar İmparatorluğu"
 STATIC_MODIFIER_DESC_bul_third_bulgarian_empire_mod: "Bir zamanlar Tırnova’dan yayılan ışık şimdi tüm Balkanları aydınlatıyor."
 STATIC_MODIFIER_NAME_bul_bulgarian_independence_mod: "Bulgar Bağımsızlığı İlan Edildi"
 STATIC_MODIFIER_DESC_bul_bulgarian_independence_mod: "Parçalanmış topraklar bir kez daha bir ve her ulus bu canlanışla hesaplaşmak zorunda."
 STATIC_MODIFIER_NAME_bul_new_byzantium_mod: "Yeni Bizans"
 STATIC_MODIFIER_DESC_bul_new_byzantium_mod: "İstanbul kiliselerinde artık yeni dua sesleri yankılanıyor."
