l_braz_por:
 eth_ethiopia_mission_pack: "O Novo Império Salomônico — A Cruz que Brilha sobre o Chifre da África"
 eth_ethiopia_mission_pack_DESCRIPTION:0 "Sob uma dinastia que, segundo se diz, descende da Rainha de Sabá e do rei Salomão, rivalize com os mamelucos como protetor dos coptas, triunfe na luta mortal contra Adal e restaure a glória de Axum, para erguer um novo império."
 eth_ethiopia_mission_pack_CRITERIA_DESCRIPTION:0 "Erga um império, reivindique a hegemonia sobre o Chifre da África, defenda os coptas e restaure a glória de Axum."
 eth_ethiopia_mission_pack_BUTTON_TOOLTIP:0 "De fortaleza montanhosa a império, que brilha sobre o Mar Vermelho."
 eth_ethiopia_mission_pack_BUTTON_DETAILS:0 "“Rei dos Reis, Leão de Judá” — como herdeiro da Rainha de Sabá, erga o novo Império Salomônico!"
 eth_negus_authority: "Estabeleça a Autoridade do Negus Negest"
 eth_negus_authority_desc: "“Rei dos Reis” — o título do Negus Negest. Que essa autoridade alcance todos os cantos do império."
 eth_amba_geshen: "A Prisão de Amba Geshen"
 eth_amba_geshen_desc: "Para impedir disputas sucessórias, os príncipes reais são encerrados na fortaleza natural de Amba Geshen — faça desse costume uma instituição."
 eth_mobile_court: "A Corte Itinerante da Etiópia"
 eth_mobile_court_desc: "Sem capital fixa, o imperador e seu exército percorrem o império num acampamento móvel (Ketema) — estabeleça esse singular estilo de governo como instituição do Estado."
 eth_coptic_church: "Defenda a Igreja Ortodoxa Etíope"
 eth_coptic_church_desc: "A Igreja Ortodoxa Etíope, sob a autoridade de Alexandria — faça de sua fé um pilar do Estado e torne-se protetor dos coptas."
 eth_gondar_founding: "Desenvolva Gondar"
 eth_gondar_founding_desc: "Gondar, chamada “Camelot da África” — desenvolva-a numa grande cidade de pedra."
 eth_royal_chronicle: "Compile as Crônicas Reais"
 eth_royal_chronicle_desc: "Herde o espírito do “Kebra Nagast”, a crônica que registra os feitos dos antigos imperadores, e cultive a tradição do saber e do registro."
 eth_feudal_levies: "O Sistema Feudal de Levas"
 eth_feudal_levies_desc: "Estabeleça o singular sistema militar feudal da Etiópia, em que os senhores locais conduzem tropas ao chamado do imperador."
 eth_negus_dynasty: "Dinastia Salomônica Assegurada"
 eth_negus_dynasty_desc: "Com a igreja, as crônicas, o sistema militar e a capital, todos nos seus lugares, torne inabalável o governo da dinastia salomônica."
 eth_oromo_migration: "As Migrações Oromo"
 eth_oromo_migration_desc: "No século XVI, os povos Oromo iniciam uma grande migração — responda a esse movimento histórico de povos."
 eth_agaw_people: "Governe os Agaw"
 eth_agaw_people_desc: "Os Agaw, antigos habitantes do planalto etíope — governe-os como súditos do império, respeitando sua cultura."
 eth_beta_israel: "Coexistência com o Beta Israel"
 eth_beta_israel_desc: "O Beta Israel, judeus etíopes, também chamados “Falashas” — estabeleça um caminho de coexistência com eles."
 eth_horn_hegemony: "Hegemonia sobre o Chifre da África"
 eth_horn_hegemony_desc: "Como império que une os Sidama, os Oromo, os Agaw e o Beta Israel, reivindique a hegemonia sobre o Chifre da África."
 eth_nubian_alliance: "Aliança com a Núbia"
 eth_nubian_alliance_desc: "Makúria e Alódia, Estados coptas do norte — forje alianças com esses irmãos na fé."
 eth_conquer_makuria: "Incorpore a Makúria"
 eth_conquer_makuria_desc: "A Makúria, reino copta, outrora florescente ao longo do Nilo — proteja ou incorpore esse Estado agora em declínio."
 eth_conquer_alodia: "Incorpore a Alódia"
 eth_conquer_alodia_desc: "A Alódia, reino copta da Núbia meridional — traga essa terra à esfera de governo da Etiópia."
 eth_sudan_dominion: "Estabeleça o Domínio sobre o Sudão"
 eth_sudan_dominion_desc: "Do vale do Nilo ao deserto núbio — estabeleça o governo etíope sobre essa vasta terra."
 eth_mamluk_rivalry: "Rivalidade com os Mamelucos"
 eth_mamluk_rivalry_desc: "O Sultanato Mameluco, que governa o Egito — como protetor dos coptas, resolva a rivalidade com eles."
 eth_liberate_jerusalem: "Liberte Jerusalém"
 eth_liberate_jerusalem_desc: "A Cidade Santa, Jerusalém — liberte essa terra para proteger o direito dos coptas à oração."
 eth_coptic_patriarchate: "Comande o Patriarcado Copta"
 eth_coptic_patriarchate_desc: "O Patriarcado Copta de Alexandria — traga sua autoridade ao controle etíope."
 eth_protector_of_copts: "Protetor dos Coptas"
 eth_protector_of_copts_desc: "Para os coptas, espalhados pelo mundo, o imperador etíope é seu último protetor — cumpra esse papel."
 eth_adal_wars: "As Guerras de Adal"
 eth_adal_wars_desc: "O Sultanato de Adal, Estado islâmico no litoral do Mar Vermelho — aceite o desafio da guerra contra esse antigo rival."
 eth_conquer_zeila: "Conquiste Zeila"
 eth_conquer_zeila_desc: "Zeila, importante cidade portuária de Adal — conquiste-a e obtenha uma cabeça de ponte no comércio do Mar Vermelho."
 eth_conquer_harar: "Conquiste Harar"
 eth_conquer_harar_desc: "Harar, centro do saber islâmico — conquiste essa cidade santa."
 eth_conquer_adal: "Conquiste Adal"
 eth_conquer_adal_desc: "Ponha fim à ameaça de “Ahmad Gragn” (o Canhoto) e conquiste o antigo rival, o Sultanato de Adal."
 eth_somali_coast: "Assegure o Litoral Somali"
 eth_somali_coast_desc: "O litoral somali — varra os remanescentes de Adal e assegure essa terra."
 eth_red_sea_access: "Acesso ao Mar Vermelho"
 eth_red_sea_access_desc: "Assegure o porto de Massauá e abra à Etiópia interiorana o longamente cobiçado caminho ao mar."
 eth_portuguese_contact: "Contato com os Portugueses"
 eth_portuguese_contact_desc: "Os portugueses, que buscam a lendária terra do “rei Preste João” — o contato com eles trará à Etiópia uma nova era."
 eth_massawa_port: "Desenvolva o Porto de Massauá"
 eth_massawa_port_desc: "Massauá, cidade portuária no Mar Vermelho — desenvolva-a como porta para o comércio exterior."
 eth_firearms_adoption: "Adote Armas de Fogo"
 eth_firearms_adoption_desc: "Com o apoio português, introduza mosquetes e canhões no exército etíope."
 eth_european_trade: "Comércio com a Europa"
 eth_european_trade_desc: "Reanime o comércio com as nações europeias por meio de Massauá."
 eth_modernize_army: "Modernize o Exército"
 eth_modernize_army_desc: "Apoiando-se nas armas de fogo e no comércio europeu, transforme o exército etíope numa força moderna."
 eth_aksum_heritage: "O Legado de Axum"
 eth_aksum_heritage_desc: "O Império Axumita, outrora florescente pelo comércio do Mar Vermelho — assegure sua cidade sagrada e herde a memória de sua glória."
 eth_reclaim_aksum: "Reviva o Tigré"
 eth_reclaim_aksum_desc: "O Tigré, berço do Império Axumita — reviva essa região como terra-núcleo do império."
 eth_red_sea_empire: "Reconstrua o Império do Mar Vermelho"
 eth_red_sea_empire_desc: "O império comercial do Mar Vermelho, outrora erguido por Axum — reviva-o em nossos dias."
 eth_horn_unification: "Unifique o Chifre da África"
 eth_horn_unification_desc: "Pela incorporação dos povos cuxitas e pelo renascimento do Império do Mar Vermelho — una todo o Chifre da África sob o estandarte da Etiópia."
 eth_new_solomonic_empire: "O Novo Império Salomônico"
 eth_new_solomonic_empire_desc: "Protetor dos coptas, exército modernizado e Chifre da África unificado — a linhagem da Rainha de Sabá e do rei Salomão aqui concluída com um novo império."
 eth_events.1.t: "Jerusalém Libertada"
 eth_events.1.d: "A Cidade Santa, Jerusalém, voltou a mãos coptas. Para os irmãos, espalhados pelo mundo, esse dia será lembrado para sempre."
 eth_events.1.a: "Glória a Deus!"
 eth_events.99.t: "Proclamação do Novo Império Salomônico"
 eth_events.99.d: "O pequeno reino montanhês renasceu como grande império — protetor dos coptas, senhor do Mar Vermelho, governante do Chifre da África. A linhagem da Rainha de Sabá e do rei Salomão aqui concluída."
 eth_events.99.a: "Glória à Etiópia! Glória ao Novo Império Salomônico!"
 STATIC_MODIFIER_NAME_eth_negus_mod: "Autoridade do Negus Estabelecida"
 STATIC_MODIFIER_DESC_eth_negus_mod: "A autoridade do imperador alcança o império, elevando a legitimidade do governo."
 STATIC_MODIFIER_NAME_eth_amba_geshen_mod: "A Prisão de Amba Geshen"
 STATIC_MODIFIER_DESC_eth_amba_geshen_mod: "Nos penhascos de Amba Geshen, jovens príncipes de sangue envelhecem calados, sem jamais ousar aspirar ao trono."
 STATIC_MODIFIER_NAME_eth_coptic_church_mod: "Igreja Ortodoxa Defendida"
 STATIC_MODIFIER_DESC_eth_coptic_church_mod: "Os sinos da igreja Tewahedo dobram de vale em vale por todo o planalto, e até povos de outras fés param para escutar."
 STATIC_MODIFIER_NAME_eth_gondar_mod: "Gondar Desenvolvida"
 STATIC_MODIFIER_DESC_eth_gondar_mod: "A cidade de pedra tornou-se símbolo da prosperidade do reino."
 STATIC_MODIFIER_NAME_eth_chronicle_mod: "Crônicas Reais Compiladas"
 STATIC_MODIFIER_DESC_eth_chronicle_mod: "Nos escuros scriptoria dos mosteiros, as penas dos escribas, que copiam as crônicas em língua Ge’ez, jamais descansam."
 STATIC_MODIFIER_NAME_eth_levies_mod: "Sistema Feudal de Levas"
 STATIC_MODIFIER_DESC_eth_levies_mod: "Ao som dos tambores, os senhores do planalto reúnem-se, cada um conduzindo seus homens sob seu próprio estandarte."
 STATIC_MODIFIER_NAME_eth_dynasty_mod: "Dinastia Assegurada"
 STATIC_MODIFIER_DESC_eth_dynasty_mod: "O orgulho da descendência do rei Salomão e da Rainha de Sabá faz o nome da dinastia ser reverenciado entre todos os povos."
 STATIC_MODIFIER_NAME_eth_horn_hegemony_mod: "Hegemonia sobre o Chifre"
 STATIC_MODIFIER_DESC_eth_horn_hegemony_mod: "Do planalto abissínio às terras baixas do Chifre, povos de incontáveis línguas pagam tributo em nome de um só rei."
 STATIC_MODIFIER_NAME_eth_nubian_mod: "Aliança com a Núbia"
 STATIC_MODIFIER_DESC_eth_nubian_mod: "Enviados de nossos irmãos da Núbia setentrional são calorosamente recebidos como partícipes da mesma fé da cruz."
 STATIC_MODIFIER_NAME_eth_makuria_mod: "Makúria Incorporada"
 STATIC_MODIFIER_DESC_eth_makuria_mod: "A incorporação da Makúria anexada avança."
 STATIC_MODIFIER_NAME_eth_alodia_mod: "Alódia Incorporada"
 STATIC_MODIFIER_DESC_eth_alodia_mod: "A incorporação da Alódia anexada avança."
 STATIC_MODIFIER_NAME_eth_sudan_mod: "Domínio sobre o Sudão"
 STATIC_MODIFIER_DESC_eth_sudan_mod: "Caravanas, carregadas de grãos e ouro, sobem sem cessar das planícies do Sudão ao longo do Nilo."
 STATIC_MODIFIER_NAME_eth_mamluk_rivalry_mod: "Rivalidade com os Mamelucos"
 STATIC_MODIFIER_DESC_eth_mamluk_rivalry_mod: "Tendo cruzado lâminas com a cavalaria mameluca, os soldados do planalto temperaram-se em guerreiros experimentados."
 STATIC_MODIFIER_NAME_eth_patriarchate_mod: "O Patriarcado Copta"
 STATIC_MODIFIER_DESC_eth_patriarchate_mod: "O clero do planalto há muito aguardava o dia em que um patriarca próprio concedesse a bênção."
 STATIC_MODIFIER_NAME_eth_protector_mod: "Protetor dos Coptas"
 STATIC_MODIFIER_DESC_eth_protector_mod: "A fama de protetor ajuda a melhorar as relações diplomáticas."
 STATIC_MODIFIER_NAME_eth_adal_wars_mod: "As Guerras de Adal"
 STATIC_MODIFIER_DESC_eth_adal_wars_mod: "Os soldados que sobreviveram às intermináveis guerras contra Adal carregam suas cicatrizes como insígnias de honra."
 STATIC_MODIFIER_NAME_eth_zeila_mod: "Zeila Conquistada"
 STATIC_MODIFIER_DESC_eth_zeila_mod: "Dos armazéns do porto de Zeila, as especiarias e as pérolas do Mar Vermelho são levadas planalto acima até a corte."
 STATIC_MODIFIER_NAME_eth_harar_mod: "Harar Conquistada"
 STATIC_MODIFIER_DESC_eth_harar_mod: "Quando o estandarte do rei foi erguido sobre as muralhas de Harar, os soldados do planalto falaram unânimes da vitória que tomou a cidade santa."
 STATIC_MODIFIER_NAME_eth_conquer_adal_mod: "Adal Conquistada"
 STATIC_MODIFIER_DESC_eth_conquer_adal_mod: "Até nas aldeias de Adal, nossa antiga rival, os funcionários do rei começaram a abrir seus livros de impostos."
 STATIC_MODIFIER_NAME_eth_somali_coast_mod: "Litoral Somali Assegurado"
 STATIC_MODIFIER_DESC_eth_somali_coast_mod: "Nos portos do litoral somali, navios carregados de incenso e marfim fundeiam sem cessar."
 STATIC_MODIFIER_NAME_eth_red_sea_access_mod: "Acesso ao Mar Vermelho"
 STATIC_MODIFIER_DESC_eth_red_sea_access_mod: "Com o caminho, há muito fechado, ao Mar Vermelho agora aberto, os olhares dos mercadores do planalto voltam-se para o horizonte."
 STATIC_MODIFIER_NAME_eth_portuguese_mod: "Contato com os Portugueses"
 STATIC_MODIFIER_DESC_eth_portuguese_mod: "Enviados portugueses de Goa são recebidos com honras na corte do planalto, trazendo raros presentes."
 STATIC_MODIFIER_NAME_eth_massawa_mod: "Massauá Desenvolvida"
 STATIC_MODIFIER_DESC_eth_massawa_mod: "O porto de Massauá prospera como porta do comércio."
 STATIC_MODIFIER_NAME_eth_firearms_mod: "Armas de Fogo Adotadas"
 STATIC_MODIFIER_DESC_eth_firearms_mod: "O trovão de mosquetes e canhões nos vales anuncia que a era das lanças e dos escudos acabou."
 STATIC_MODIFIER_NAME_eth_european_trade_mod: "Comércio com a Europa"
 STATIC_MODIFIER_DESC_eth_european_trade_mod: "Mercadores europeus, que desembarcam no porto de Massauá, compram o ouro e o almíscar do planalto em troca de moedas de prata."
 STATIC_MODIFIER_NAME_eth_modernize_mod: "Exército Modernizado"
 STATIC_MODIFIER_DESC_eth_modernize_mod: "Soldados em uniformes de novo modelo marcham, cantando velhas canções de guerra."
 STATIC_MODIFIER_NAME_eth_aksum_heritage_mod: "O Legado de Axum"
 STATIC_MODIFIER_DESC_eth_aksum_heritage_mod: "Os que estão diante das estelas de Axum lembram que os nomes dos reis de mil anos ainda correm em seu próprio sangue."
 STATIC_MODIFIER_NAME_eth_reclaim_aksum_mod: "Tigré Revivido"
 STATIC_MODIFIER_DESC_eth_reclaim_aksum_mod: "Os antigos campos e mercados de Axum recobraram o fôlego, e os funcionários do rei contam de novo a colheita."
 STATIC_MODIFIER_NAME_eth_red_sea_empire_mod: "Império do Mar Vermelho Reconstruído"
 STATIC_MODIFIER_DESC_eth_red_sea_empire_mod: "Com o império comercial reconstruído, que liga os portos do Mar Vermelho, as frotas do rei abrem velas ao longo de todo o litoral."
 STATIC_MODIFIER_NAME_eth_horn_unification_mod: "Chifre da África Unificado"
 STATIC_MODIFIER_DESC_eth_horn_unification_mod: "Todo governante do Chifre da África ajoelha-se agora segundo o cerimonial de uma só corte."
 STATIC_MODIFIER_NAME_eth_new_solomonic_empire_mod: "O Novo Império Salomônico"
 STATIC_MODIFIER_DESC_eth_new_solomonic_empire_mod: "A conclusão do novo império elevou o poder do Estado a seu auge."
 STATIC_MODIFIER_NAME_eth_jerusalem_mod: "Jerusalém Libertada"
 STATIC_MODIFIER_DESC_eth_jerusalem_mod: "Diante do Santo Sepulcro, em Jerusalém, clérigos etíopes choram pelo fim de sua longa peregrinação."
