l_braz_por:
 aac_carolingian_legacy_mission_pack: "O Legado Carolíngio — A Reconstrução do Reino dos Francos"
 aac_carolingian_legacy_mission_pack_DESCRIPTION:0 "Em 1337, Aachen é uma cidade livre do Sacro Império Romano, cujo burgomestre é descendente da dinastia carolíngia. Dessa cidade, outrora lar da corte de Carlos Magno (742–814), recupere a glória do Reino dos Francos. Una o Reno, a Gália e Flandres e governe como “Imperador do Ocidente” com coroação papal."
 aac_carolingian_legacy_mission_pack_CRITERIA_DESCRIPTION:0 "Como Aachen, una o Reno, a Gália e a Itália para reconstruir o Império Romano do Ocidente."
 aac_carolingian_legacy_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para reconstruir o Reino dos Francos."
 aac_carolingian_legacy_mission_pack_BUTTON_DETAILS:0 "Do trono de Carlos Magno ao Império Romano do Ocidente!"
 aac_throne_of_charlemagne: "O Trono de Carlos Magno"
 aac_throne_of_charlemagne_desc: "A Catedral de Aachen — construída por ordem de Carlos Magno e local de sua coroação como Imperador Romano do Ocidente em 800 — voltou a mãos carolíngias. Governe Aachen, outrora centro da civilização ocidental, e dê o primeiro passo rumo à reconstrução do Reino dos Francos."
 aac_control_rhineland: "Domine o Reno"
 aac_control_rhineland_desc: "Colônia, Trèves, Mogúncia — as três grandes cidades arquiepiscopais ao longo do Reno eram o centro econômico, religioso e político do Reino dos Francos. Tomá-las devolve todo o Reno a mãos carolíngias."
 aac_integrate_lorraine: "Incorpore a Lorena"
 aac_integrate_lorraine_desc: "A Lorena (Lotharingia) nasceu como zona central quando o Tratado de Verdun (843) dividiu o Império Franco entre os netos de Carlos Magno. Recuperar Metz e Verdun reincorpora o núcleo do Império Franco, como era antes da divisão."
 aac_conquer_hre: "Senhor do Sacro Império Romano"
 aac_conquer_hre_desc: "Aachen foi outrora local de coroação dos imperadores do Sacro Império Romano. Erguendo-se como senhor do Império, o legado imperial de Carlos Magno é reivindicado da forma mais legítima."
 aac_control_flanders: "Domine Flandres"
 aac_control_flanders_desc: "Flandres é o centro da maior indústria têxtil de lã da Europa. Tome Bruxelas e Liège e use a rica potência comercial e industrial de Flandres para reconstruir o Reino dos Francos."
 aac_brabant_trade: "Comércio de Brabante"
 aac_brabant_trade_desc: "A maior rede comercial dos Países Baixos espalha-se a partir da cidade mercantil de Bruxelas, no Ducado de Brabante. O controle dessa rede comercial reforça drasticamente a base financeira do Reino dos Francos."
 aac_push_into_france: "Marcha sobre Paris"
 aac_push_into_france_desc: "Carlos Magno governou toda a Gália, incluindo Paris, como rei dos francos. Recuperar Paris vinga a dinastia dos Valois e ressuscita o governo carolíngio sobre a Gália."
 aac_conquer_northern_france: "Conquiste o Norte da França"
 aac_conquer_northern_france_desc: "Reims é o local de coroação do Reino dos Francos — continuando a tradição de Clóvis I, batizado aqui, subjugue a Normandia e a Picardia para estabelecer pleno domínio sobre a Gália setentrional."
 aac_conquer_burgundy: "Conquiste a Borgonha"
 aac_conquer_burgundy_desc: "A Borgonha desempenhou papel importante no Império Franco como terra rica em vinho e agricultura. Sua subjugação abre o caminho para o sul da França."
 aac_conquer_southern_france: "Conquiste o Sul da França"
 aac_conquer_southern_france_desc: "Subjugue o Languedoc e a Gasconha, e a Gália meridional volta a mãos carolíngias. A extensão do reino até os Pireneus realiza o pleno domínio da Gália a que aspirou Carlos Magno."
 aac_reunite_gaul: "Reunifique a Gália"
 aac_reunite_gaul_desc: "Toda a Gália — terras outrora governadas por Carlos Magno — unida sob o estandarte do Reino dos Francos. O Império, dividido em três pelo Tratado de Verdun, está unificado pela primeira vez em 500 anos."
 aac_develop_aachen: "Desenvolva Aachen"
 aac_develop_aachen_desc: "Desenvolva essa antiga cidade, centrada na Catedral de Aachen, e faça-a funcionar como nova capital do Império Franco. Desse lugar, onde habita o legado de Carlos Magno, a luz irradia rumo à reconstrução da Europa Ocidental."
 aac_frankish_law: "O Código de Leis Franco"
 aac_frankish_law_desc: "Carlos Magno desenvolveu o sistema jurídico do Império Franco por meio dos Capitulares (coleção de decretos). Continuando essa tradição e estabelecendo um novo Código de Leis Franco, assenta-se a base jurídica do Império."
 aac_missi_dominici: "Os Missi Dominici"
 aac_missi_dominici_desc: "O sistema dos Missi Dominici (enviados do senhor), estabelecido por Carlos Magno — representantes reais, enviados por todo o Império, que supervisionam o governo local. A ressurreição desse sistema permite o governo centralizado de um vasto império."
 aac_carolingian_renaissance: "O Renascimento Carolíngio"
 aac_carolingian_renaissance_desc: "Carlos Magno promoveu o “Renascimento Carolíngio”, convidando eruditos como Alcuíno e Eginhardo. Reviva a corte de Aachen como centro de cultura e saber e conduza a reconstrução da civilização ocidental."
 aac_trade_empire: "O Império Comercial"
 aac_trade_empire_desc: "O Império Franco, que domina as rotas comerciais do Reno, do Mosa e do Escalda, torna-se a maior nação comercial da Europa Ocidental. Estabeleça supremacia comercial com muitos centros de mercado e rica renda."
 aac_frankish_levy: "O Sistema Franco de Levas"
 aac_frankish_levy_desc: "O exército franco de Carlos Magno era o mais forte da Europa. Ressuscite o sistema de levas (sistema do host) e reconstrua o poder militar do Império Franco com ampla organização militar, dos soldados-camponeses aos cavaleiros."
 aac_palatine_guard: "A Guarda Palatina"
 aac_palatine_guard_desc: "A Guarda Palatina, que protege o flanco do imperador — força de elite, que continua a tradição da guarda palaciana de Carlos Magno, encarna a glória militar do Império Franco."
 aac_carolingian_cavalry: "A Cavalaria Carolíngia"
 aac_carolingian_cavalry_desc: "O coração do sucesso militar de Carlos Magno era a poderosa cavalaria. Reconstrua a lendária força montada, em que cavaleiros fortemente encouraçados (chevaliers) dominavam o campo de batalha e derrotaram saxões, ávaros e muçulmanos."
 aac_kingdom_of_franks: "O Reino dos Francos Reconstruído"
 aac_kingdom_of_franks_desc: "Gália unificada, Lorena incorporada, Missi Dominici estabelecidos — três pilares convergem, e o Reino dos Francos é enfim reconstruído. Pela primeira vez desde 800, o estandarte carolíngio tremula do Reno aos Pireneus."
 aac_papal_alliance: "Aliança Papal"
 aac_papal_alliance_desc: "No Natal de 800, na Basílica de São Pedro, em Roma, o papa Leão III colocou a coroa de Imperador Romano do Ocidente sobre Carlos Magno. Continue essa tradição, construa uma sólida aliança com o papa e estabeleça a legitimidade como “representante de Deus”."
 aac_conquer_italy: "Conquiste a Itália"
 aac_conquer_italy_desc: "Carlos Magno conquistou o Reino dos Lombardos em 774 e obteve o título de Rei da Itália. A tomada de Roma completa o caminho para o renascimento do “Imperador Romano do Ocidente” com aprovação papal."
 aac_western_roman_empire: "Reconstrução do Império Romano do Ocidente"
 aac_western_roman_empire_desc: "Aachen, Paris, Roma — três cidades do Império Romano do Ocidente unidas sob o estandarte carolíngio. O império que Carlos Magno construiu em 800 renasce na era moderna, e a “Renovatio Imperii Romani (Restauração do Império Romano)” está cumprida."
 aac_alsace_swabia: "Alsácia e Suábia"
 aac_alsace_swabia_desc: "A Alsácia e a Suábia, na margem oriental do Reno, são parte importante do Império Franco. Tomar essa terra, que se estende dos Vosges aos Alpes, completa o domínio sobre o Reno."
 aac_champagne_fairs: "As Feiras de Champagne"
 aac_champagne_fairs_desc: "As feiras periódicas (foires) da região de Champagne foram as maiores reuniões comerciais da Europa. O controle desse ponto de encontro de mercadores italianos, flamengos e alemães estabelece a supremacia comercial franca."
 aac_conquer_brittany: "Conquiste a Bretanha"
 aac_conquer_brittany_desc: "A Bretanha é a terra dos bretões celtas — nem Carlos Magno conseguiu subjugar por completo essa teimosa região. A conquista desse extremo ocidental traz a Gália ocidental inteiramente ao controle franco e assegura a saída atlântica."
 aac_holy_crown: "A Coroa Sagrada"
 aac_holy_crown_desc: "Profunda confiança com o papado e alta legitimidade — como “vigário de Cristo”, o papa aprova a autoridade do rei dos francos. Governo reconhecido tanto por Deus quanto pelo homem estabelecido."
 aac_dev_reims: "Desenvolva Reims"
 aac_dev_reims_desc: "Reims é o local do batismo da nação franca — Clóvis I recebeu aqui o batismo cristão, e as coroações francesas ocorrem aqui desde então. O maior desenvolvimento dessa cidade santa reforça a legitimidade carolíngia."
 aac_dev_paris: "Desenvolva Paris"
 aac_dev_paris_desc: "Paris, centrada numa ilha do Sena (Île de la Cité), é a maior cidade da Gália. Desenvolvê-la como capital ocidental do Império Franco cria um sistema de duas capitais, Aachen e Paris, sustentando o Império Franco."
 aac_bretagne_fleet: "A Frota Bretã"
 aac_bretagne_fleet_desc: "As tradições marítimas da Bretanha e de Flandres combinam-se, de modo que o Império Franco possui agora uma poderosa frota, que controla tanto o Atlântico quanto o Mar do Norte."
 aac_events.20.t: "Paris Cai — O Retorno dos Carolíngios"
 aac_events.20.d: "O estandarte dos Valois retirado das muralhas de Paris, substituído pela águia do Reino dos Francos. Enquanto os sinos de Notre-Dame dobram, o descendente do burgomestre carolíngio entra em Paris. “O herdeiro de Carlos Magno voltou” — escreverão os historiadores."
 aac_events.20.a: "Viva Paris! Ergam bem alto o estandarte carolíngio!"
 aac_events.40.t: "Gália Unificada — O Retorno do Rei dos Francos"
 aac_events.40.d: "Do Reno aos Pireneus, de Flandres à Provença — toda a Gália unida sob o estandarte do Reino dos Francos. O Império, dividido em três pelo Tratado de Verdun em 843, unificado após 500 anos. “Dieu le veut (Deus assim o quer)” — clama o povo, reunido na catedral."
 aac_events.40.a: "Viva a Gália! O Reino dos Francos é eterno!"
 aac_events.50.t: "Proclamação da Reconstrução do Reino dos Francos"
 aac_events.50.d: "Gália unificada, Lorena incorporada, Missi Dominici estabelecidos — os três pilares do Reino dos Francos concluídos. A coroação do rei dos francos realiza-se na Catedral de Aachen, e pela primeira vez desde Carlos Magno nasce um Imperador dos Francos. “Em nome de Carolus Magnus Rex Francorum (Carlos Magno, rei dos francos), proclamamos o Império”."
 aac_events.50.a: "Viva o Reino dos Francos! Glória carolíngia renascida — tinjamos nossas cores com o azul da França!"
 aac_events.99.t: "Reconstrução do Império Romano do Ocidente"
 aac_events.99.d: "Aachen, Paris, Roma — três cidades unidas sob o estandarte carolíngio. O lendário momento em que o papa Leão III colocou a coroa sobre Carlos Magno no Natal de 800, recriado na era moderna. “Renovatio Imperii Romani” — essas palavras gravadas para sempre na história. Você mudará a cor do Império para o carmesim carolíngio?"
 STATIC_MODIFIER_NAME_aac_rhineland_mod: "Domínio do Reno"
 STATIC_MODIFIER_DESC_aac_rhineland_mod: "As três grandes cidades arquiepiscopais ao longo do Reno tomadas — centro econômico e religioso do Império Franco renascido."
 STATIC_MODIFIER_NAME_aac_lorraine_mod: "Lorena Incorporada"
 STATIC_MODIFIER_DESC_aac_lorraine_mod: "A Lorena, dividida pelo Tratado de Verdun, reincorporada. Símbolo da divisão imperial franca dissolvido."
 STATIC_MODIFIER_NAME_aac_hre_master_mod: "Senhor do Sacro Império Romano"
 STATIC_MODIFIER_DESC_aac_hre_master_mod: "Como senhor do Império, o legado imperial de Carlos Magno reivindicado legitimamente."
 STATIC_MODIFIER_NAME_aac_flanders_mod: "Domínio de Flandres"
 STATIC_MODIFIER_DESC_aac_flanders_mod: "O maior centro da indústria têxtil de lã da Europa, Flandres, cai em mãos francas."
 STATIC_MODIFIER_NAME_aac_brabant_mod: "Comércio de Brabante"
 STATIC_MODIFIER_DESC_aac_brabant_mod: "A rede comercial dos Países Baixos enriquece as finanças do Reino dos Francos."
 STATIC_MODIFIER_NAME_aac_northern_france_mod: "Norte da França Conquistado"
 STATIC_MODIFIER_DESC_aac_northern_france_mod: "Normandia e Picardia subjugadas — pleno domínio sobre a Gália setentrional estabelecido."
 STATIC_MODIFIER_NAME_aac_burgundy_mod: "Borgonha Conquistada"
 STATIC_MODIFIER_DESC_aac_burgundy_mod: "A Borgonha, rica em vinho, incorporada ao Reino dos Francos."
 STATIC_MODIFIER_NAME_aac_southern_france_mod: "Sul da França Conquistado"
 STATIC_MODIFIER_DESC_aac_southern_france_mod: "Languedoc e Gasconha subjugados — a Gália meridional volta a mãos carolíngias."
 STATIC_MODIFIER_NAME_aac_gaul_unified_mod: "Gália Unificada"
 STATIC_MODIFIER_DESC_aac_gaul_unified_mod: "Pela primeira vez desde 843, toda a Gália unida sob o estandarte do Reino dos Francos."
 STATIC_MODIFIER_NAME_aac_aachen_capital_mod: "Aachen — Capital Imperial"
 STATIC_MODIFIER_DESC_aac_aachen_capital_mod: "A cidade da corte de Carlos Magno, Aachen, desenvolvida como capital do Império Franco."
 STATIC_MODIFIER_NAME_aac_frankish_law_mod: "Código de Leis Franco"
 STATIC_MODIFIER_DESC_aac_frankish_law_mod: "O Código de Leis Franco, que continua a tradição dos Capitulares, assenta a base jurídica do Império."
 STATIC_MODIFIER_NAME_aac_missi_dominici_mod: "Missi Dominici"
 STATIC_MODIFIER_DESC_aac_missi_dominici_mod: "Enviados reais, despachados por todo o Império, supervisionam o governo local — governo centralizado realizado."
 STATIC_MODIFIER_NAME_aac_renaissance_mod: "Renascimento Carolíngio"
 STATIC_MODIFIER_DESC_aac_renaissance_mod: "A corte de Aachen renascida como centro do saber e da cultura da civilização ocidental."
 STATIC_MODIFIER_NAME_aac_trade_empire_mod: "Império Comercial"
 STATIC_MODIFIER_DESC_aac_trade_empire_mod: "O Império Franco, que controla as rotas comerciais Reno-Mosa-Escalda, torna-se a maior nação comercial da Europa Ocidental."
 STATIC_MODIFIER_NAME_aac_frankish_levy_mod: "Sistema Franco de Levas"
 STATIC_MODIFIER_DESC_aac_frankish_levy_mod: "O sistema do host de Carlos Magno ressuscitado — poder militar do Império Franco reconstruído."
 STATIC_MODIFIER_NAME_aac_palatine_mod: "Guarda Palatina"
 STATIC_MODIFIER_DESC_aac_palatine_mod: "A guarda de elite do imperador encarna a glória militar do Império Franco."
 STATIC_MODIFIER_NAME_aac_cavalry_mod: "Cavalaria Carolíngia"
 STATIC_MODIFIER_DESC_aac_cavalry_mod: "Cavaleiros fortemente encouraçados dominam o campo de batalha franco. A lendária força montada de Carlos Magno renascida."
 STATIC_MODIFIER_NAME_aac_kingdom_of_franks_mod: "Reino dos Francos Reconstruído"
 STATIC_MODIFIER_DESC_aac_kingdom_of_franks_mod: "A glória do ano 800 renascida na era moderna. O Reino dos Francos carolíngio oficialmente reconstruído."
 STATIC_MODIFIER_NAME_aac_papal_mod: "Aliança Papal"
 STATIC_MODIFIER_DESC_aac_papal_mod: "O papa aprova a autoridade do rei dos francos. Governo reconhecido tanto por Deus quanto pelo homem estabelecido."
 STATIC_MODIFIER_NAME_aac_italy_mod: "Itália Conquistada"
 STATIC_MODIFIER_DESC_aac_italy_mod: "A conquista dos lombardos por Carlos Magno recriada. A Itália, incluindo Roma, cai sob domínio franco."
 STATIC_MODIFIER_NAME_aac_western_roman_empire_final_mod: "Império Romano do Ocidente Reconstruído"
 STATIC_MODIFIER_DESC_aac_western_roman_empire_final_mod: "Renovatio Imperii Romani cumprida. Aachen, Paris e Roma unidas sob o estandarte carolíngio."
 STATIC_MODIFIER_NAME_aac_alsace_mod: "Alsácia e Suábia"
 STATIC_MODIFIER_DESC_aac_alsace_mod: "Alsácia e Suábia, na margem oriental do Reno, incorporadas ao Império Franco."
 STATIC_MODIFIER_NAME_aac_champagne_mod: "Feiras de Champagne"
 STATIC_MODIFIER_DESC_aac_champagne_mod: "A maior feira periódica da Europa sustenta a supremacia comercial franca."
 STATIC_MODIFIER_NAME_aac_brittany_mod: "Bretanha Conquistada"
 STATIC_MODIFIER_DESC_aac_brittany_mod: "A teimosa terra celta bretã conquistada — saída atlântica assegurada."
 STATIC_MODIFIER_NAME_aac_holy_crown_mod: "A Coroa Sagrada"
 STATIC_MODIFIER_DESC_aac_holy_crown_mod: "A “Coroa Sagrada”, aprovada tanto pelo papa quanto por Deus, brilha sobre o rei dos francos."
 STATIC_MODIFIER_NAME_aac_reims_mod: "Reims Desenvolvida"
 STATIC_MODIFIER_DESC_aac_reims_mod: "O local do batismo dos francos, Reims, desenvolvido como capital religiosa."
 STATIC_MODIFIER_NAME_aac_paris_mod: "Paris Desenvolvida"
 STATIC_MODIFIER_DESC_aac_paris_mod: "A maior cidade da Gália, Paris, desenvolvida como capital ocidental do Império Franco."
 STATIC_MODIFIER_NAME_aac_fleet_mod: "A Frota Bretã"
 STATIC_MODIFIER_DESC_aac_fleet_mod: "As tradições marítimas da Bretanha e de Flandres se combinam — o Império Franco controla tanto o Atlântico quanto o Mar do Norte."
 aac_aachen_megalopolis: "Aachen — A Maior Cidade da Europa Central"
 aac_aachen_megalopolis_desc: "A cidade da corte de Carlos Magno, Aachen, está enfim concluída como a maior metrópole da Europa Central. Com população de 200000, desenvolvimento urbano avançado e magnífica arquitetura, Aachen está estabelecida como centro da civilização europeia."
 aac_events.10.t: "O Trono de Carlos Magno — O Despertar Carolíngio"
 aac_events.10.d: "Aachen — essa cidade, onde Carlos Magno (742–814) outrora manteve sua corte e foi coroado Imperador Romano do Ocidente em 800 — voltou a mãos carolíngias. Sob a solene cúpula da Catedral de Aachen, o trono de mármore aguarda o retorno de seu senhor.\n\nO sonho de Carlos Magno, chamado “Pai da Europa (Pater Europae)” — um império cristão unificado, do Reno aos Pireneus, de Roma ao Báltico — chegou a hora de realizá-lo. Proclame a restauração carolíngia e dê o primeiro passo rumo à reconstrução do Reino dos Francos."
 aac_events.10.a: "Governar como rei da dinastia carolíngia — proclamar a monarquia"
 aac_events.10.b: "O tempo ainda não amadureceu — construir força sob o sistema atual de governo"
 STATIC_MODIFIER_NAME_aac_aachen_megalopolis_mod: "Megalópole Aachen"
 STATIC_MODIFIER_DESC_aac_aachen_megalopolis_mod: "Até onde chega o dobrar dos sinos da catedral, as ruas estão cheias de casas de artesãos, eruditos e mercadores — Aachen tornou-se a principal cidade do Ocidente."
 aac_events.50.b: "Viva o Reino dos Francos! Glória carolíngia renascida — mantenhamos nossas cores tradicionais"
 aac_events.99.a: "Adotar o nome e as cores do Império Romano do Ocidente (map_ROM) — proclamar ao mundo o renascimento de Roma"
 aac_events.99.b: "Proclamar o nome do Império Romano do Ocidente — mas manter nossas cores atuais"
