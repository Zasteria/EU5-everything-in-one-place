l_braz_por:
 byz_restoration_mission_pack: "A Restauração do Império Romano"
 byz_restoration_mission_pack_desc: "Recupere Constantinopla, reocupe a Anatólia e os Bálcãs, una os quatro patriarcados, triunfe em Roma e restaure a maior extensão do antigo Império Romano."
 byz_restoration_mission_pack_BUTTON_TOOLTIP:0 "Restaure as terras do Império Romano."
 byz_restoration_mission_pack_DESCRIPTION:0 "Salve o império cambaleante e restaure seu antigo esplendor. Como herdeiro do legado de Roma, traga de volta ao estandarte imperial as antigas terras do Oriente e do Ocidente."
 byz_restoration_mission_pack_BUTTON_DETAILS:0 "Restaure o Império Bizantino da beira do colapso e traga de volta a seu reino o mundo mediterrâneo que Roma outrora governou. Realize o sonho da Renovatio Imperii!"
 byz_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Recupere, como Bizâncio, as antigas terras romanas e alcance a Renovatio Imperii."
 byz_retake_anatolia_west: "Recupere a Anatólia Ocidental"
 byz_retake_anatolia_west_desc: "Recupere Esmirna para restaurar a autoridade imperial na Anatólia Ocidental."
 byz_retake_anatolia_east: "Recupere a Anatólia Oriental"
 byz_retake_anatolia_east_desc: "Conquiste Ancara, Konya e Sivas para trazer toda a Anatólia ao controle imperial. Governar os povos de cultura grega que aqui vivem exigirá uma nova abordagem administrativa."
 byz_secure_greece: "Reconstrua a Grécia"
 byz_secure_greece_desc: "Recupere Atenas e Corinto e ressuscite a ortodoxia e a cultura gregas na Hélade."
 byz_balkan_dominance: "Domínio dos Bálcãs"
 byz_balkan_dominance_desc: "Conquiste Belgrado e Tarnovo para restaurar a ordem imperial em todos os Bálcãs."
 byz_invasion_of_syria: "Invasão da Síria"
 byz_invasion_of_syria_desc: "Conquiste as terras da Síria, incluindo Antioquia, um dos cinco grandes patriarcados. As antigas rotas comerciais e os ricos centros de produção trarão ao império nova prosperidade."
 byz_protect_jerusalem: "Defesa de Jerusalém"
 byz_protect_jerusalem_desc: "Recupere a Terra Santa, onde Cristo sofreu. O imperador romano tem o dever de guardião dos lugares santos. Estabeleça um governo tolerante, para que os povos de muitas fés possam viver em paz nessa terra."
 byz_dominion_of_aegyptus: "Domínio do Egito"
 byz_dominion_of_aegyptus_desc: "Assegure Alexandria e o Cairo, grandes sedes do saber egípcio. As terras férteis do Nilo alimentarão muitos povos do império."
 byz_control_aegean: "Domine o Mar Egeu"
 byz_control_aegean_desc: "Assegure Creta e construa uma poderosa frota para manter o pleno domínio do Mar Egeu."
 byz_retake_italy_south: "Recupere o Sul da Itália"
 byz_retake_italy_south_desc: "Recupere Nápoles e a Sicília para estabelecer uma cabeça de ponte na península itálica."
 byz_reclaim_rome: "Recupere a Cidade Eterna"
 byz_reclaim_rome_desc: "Recupere a Cidade Eterna, Roma. Chegou a hora de o legítimo herdeiro do Império Romano recuperar a capital ocidental."
 byz_iberian_conquest: "Conquiste a Ibéria"
 byz_iberian_conquest_desc: "Conquiste Toledo e Córdoba para restaurar ao império a antiga província da Hispânia."
 byz_north_africa: "Recupere o Norte da África"
 byz_north_africa_desc: "Conquiste Túnis, Trípoli e Argel para restaurar ao império a antiga província da África."
 byz_north_italy: "Norte da Itália"
 byz_north_italy_desc: "Conquiste Veneza, Gênova, Milão e Florença para unir a península itálica sob o nome romano."
 byz_invasion_of_france: "Invasão da França"
 byz_invasion_of_france_desc: "Com o norte da Itália e a Ibéria asseguradas, o olhar do império volta-se para a Gália. Conquiste toda a região da França e complete o território imperial no oeste."
 byz_renovatio_imperii: "Renovatio Imperii"
 byz_renovatio_imperii_desc: "A restauração do império. Da Ibéria à Gália, do norte da África à Itália, da Ásia Menor aos Bálcãs e à Terra Santa. Exige 1000+ províncias e 2000+ de renda mensal."
 byz_events.2.t: "Prosperidade de Esmirna"
 byz_events.2.d: "Esmirna e os portos da Anatólia Ocidental recuperados. Essas antigas cidades comerciais voltam a ser posse dos mercadores bizantinos, e o comércio no Mar Egeu revive."
 byz_events.2.a: "Apoiar o comércio em Esmirna"
 byz_events.3.t: "Atenas — A Reconstrução da Hélade"
 byz_events.3.d: "Atenas e Corinto recuperadas. A cidade de Sócrates e Platão, a colina em que se ergue o Partenon, de novo bizantinas. Mosteiros ortodoxos são reconstruídos, e o saber grego revive."
 byz_events.3.a: "Restaurar a ortodoxia e a cultura gregas na Hélade"
 byz_events.7.t: "Sul da Itália Recuperado"
 byz_events.7.d: "Nápoles e Palermo recuperadas. Essas terras, outrora florescentes como Magna Grécia, são de novo parte do Império Romano. A riqueza do comércio mediterrâneo flui ao tesouro imperial."
 byz_events.7.a: "Incorporar o Sul da Itália ao império"
 byz_events.8.t: "A Cidade Eterna — Entrada em Roma"
 byz_events.8.d: "Roma — a cidade das sete colinas, local do martírio de Pedro e Paulo — recuperada. Como outrora Constantino, o Grande, governava o império deste lugar, assim de novo o imperador romano senta-se em Roma. A história se cumpriu."
 byz_events.8.a: "Fazer da Cidade Eterna a capital ocidental"
 byz_events.10.t: "Renovatio Imperii"
 byz_events.10.d: "A restauração do Império Romano. Da Ibéria à Ásia Menor, do norte da África aos Bálcãs, da Itália à Terra Santa. O que Justiniano, o Grande, almejou em 527-565, o que se sonhou ao longo de toda a Idade Média — a restauração do Império Romano tornou-se enfim realidade. O Mediterrâneo é de novo Mare Nostrum."
 byz_events.10.a: "Proclamar ao mundo a Renovatio Imperii"
 byz_renovatio_unlock_tt: "Renovatio Imperii alcançada."
 byz_reclaim_bursa: "Recupere Bursa"
 byz_reclaim_bursa_desc: "Recupere Bursa, outrora importante cidade bizantina. Situada num ponto-chave da Rota da Seda, o futuro rumo do ofício dessa cidade fica à decisão do império."
 byz_avoid_collapse: "Evite o Colapso"
 byz_avoid_collapse_desc: "O império vacila à beira do colapso. Mas, se a legitimidade e a estabilidade interna puderem ser preservadas, o caminho para a restauração ainda não está fechado."
 byz_events.20.t: "O Futuro de Bursa"
 byz_events.20.d: "Nas oficinas de Bursa, os artesãos discutem um novo caminho de produção. Construir sobre a longa tradição da cidade na tecelagem da seda, ou concentrar-se na produção de tecido mais fino? A decisão do império moldará o futuro da cidade."
 byz_events.20.a: "Apoiar a produção de seda"
 byz_events.20.b: "Concentrar-se na produção de tecido fino"
 byz_events.21.t: "O Futuro de Nicomédia"
 byz_events.21.d: "Nicomédia, cidade-chave na margem sul do Mar de Mármara, voltou ao império. A corte debate qual ofício definirá o futuro dessa cidade: apoiar a produção de armamentos ou plantar amoreiras e iniciar a produção de seda."
 byz_events.21.a: "Apoiar a produção de armamentos"
 byz_events.21.b: "Plantar amoreiras e iniciar a produção de seda"
 byz_reclaim_nicomedia: "Recupere Nicomédia"
 byz_reclaim_nicomedia_desc: "Nicomédia (Izmit) — cidade-chave na margem sul do Mar de Mármara. Transforme sua produção de recursos em seda e reconstrua a economia da seda do império. Assegurar 50%+ de controle marca o primeiro passo rumo à restauração do Império Romano."
 byz_orthodox_antioch: "Converta Antioquia à Ortodoxia"
 byz_orthodox_antioch_desc: "Confirme que a maioria da população de Antioquia se converteu à ortodoxia. Que a cidade em que primeiro soou o nome “cristão” se encha de novo da luz da ortodoxia."
 byz_orthodox_jerusalem: "Converta Jerusalém à Ortodoxia"
 byz_orthodox_jerusalem_desc: "Confirme que a maioria da população de Jerusalém se converteu à ortodoxia. Os sinos da Basílica do Santo Sepulcro soam com a liturgia ortodoxa."
 byz_orthodox_alexandria: "Converta Alexandria à Ortodoxia"
 byz_orthodox_alexandria_desc: "Confirme que a maioria da população de Alexandria se converteu à ortodoxia. As tradições da Igreja Copta são incorporadas à corrente ortodoxa."
 byz_orthodox_rome: "O Fim do Grande Cisma"
 byz_orthodox_rome_desc: "Confirme que a maioria da população de Roma se converteu à ortodoxia. O cisma de 1054 termina — não pela reconciliação, mas pelo triunfo da ortodoxia sobre Roma."
 byz_hellenic_athens: "Renascimento do Partenon"
 byz_hellenic_athens_desc: "Atenas — a cidade de Atena. Aos deuses olímpicos oferecem-se de novo sacrifícios na Acrópole, e o renascimento da fé helênica começa aqui."
 byz_hellenic_corinth: "Santuário de Posêidon em Corinto"
 byz_hellenic_corinth_desc: "No Istmo de Corinto, Posêidon — guardião dos dois mares — outrora possuiu um grande templo. Reconstrua esse santuário e atraia a bênção do deus do mar ao império."
 byz_hellenic_mystras: "Santuário de Apolo em Mistra"
 byz_hellenic_mystras_desc: "Mistra, perto de Esparta — coração espiritual do Peloponeso. Reconstrua aqui o santuário de Apolo e desperte o espírito valente de Esparta, que carrega a memória do oráculo de Delfos."
 byz_hellenic_alexandria: "Reconstrução do Serapeu"
 byz_hellenic_alexandria_desc: "O Serapeu de Alexandria foi outrora um dos maiores templos do mundo antigo. Dedicado a Serápis — nascido da fusão das religiões grega e egípcia —, sua reconstrução estabelece a religião helênica no Egito e reúne de novo a sabedoria do mundo antigo."
 byz_events.11.t: "Antioquia — O Retorno à Primeira Igreja"
 byz_events.11.d: "Antioquia, onde primeiro soou o nome “cristão”, está agora cheia da luz da ortodoxia. A memória das obras de Pedro e Paulo renasce aqui, e a cidade assume a nova missão de centro espiritual da ortodoxia."
 byz_events.11.a: "Pôr Antioquia sob proteção ortodoxa"
 byz_events.12.t: "Jerusalém — Sinos Ortodoxos na Cidade Santa"
 byz_events.12.d: "A Cidade Santa, Jerusalém, desejada por todos os fiéis ortodoxos, tornou-se uma cidade ortodoxa. A Basílica do Santo Sepulcro soa de novo com a liturgia oriental. Não é apenas conquista — é triunfo da fé."
 byz_events.12.a: "Guardar a Terra Santa para sempre"
 byz_events.13.t: "Alexandria — A Ortodoxização da Cidade do Saber"
 byz_events.13.d: "Alexandria, tesouro do saber antigo, tornou-se cidade ortodoxa. As antigas tradições da Igreja Copta fundem-se com a corrente ortodoxa mais ampla, e o diálogo entre a filosofia neoplatônica e a teologia começa a florescer de novo."
 byz_events.13.a: "Desenvolver Alexandria como cidade do saber ortodoxo"
 byz_events.14.t: "O Fim do Grande Cisma — Unidade das Igrejas"
 byz_events.14.d: "Desde 1054, quando o papa Leão IX e o patriarca Cerulário se excomungaram mutuamente, passaram-se séculos. Não pela reconciliação, mas pela conquista ortodoxa de Roma — o Grande Cisma termina. A maioria dos cidadãos de Roma converteu-se à ortodoxia. A Cidade Eterna torna-se o pilar ocidental da Igreja do Oriente. A história escolheu a fé bizantina."
 byz_events.14.a: "Proclamar ao mundo o fim do Grande Cisma"
 byz_events.15.t: "O Partenon — O Despertar de Atena"
 byz_events.15.d: "De novo oferecem-se sacrifícios a Atena na Acrópole. O Partenon, que se tornara igreja cristã, reconstruído como templo dos antigos deuses. O povo de Atenas invoca os deuses olímpicos pelo nome, e a chama do helenismo se reacende."
 byz_events.15.a: "Guiar o império sob a proteção de Atena"
 byz_events.16.t: "Corinto — Posêidon dos Estreitos"
 byz_events.16.d: "Na colina de Corinto, que contempla os dois mares, reconstrói-se o templo de Posêidon. O deus do istmo protegeu longamente mercadores e marinheiros. Com a restauração de seus ritos, Corinto torna-se de novo centro espiritual do comércio mediterrâneo."
 byz_events.16.a: "Deixar o comércio prosperar sob a bênção de Posêidon"
 byz_events.17.t: "Delos — Pátria do Deus da Luz"
 byz_events.17.d: "Na ilha sagrada do Egeu, Delos, venerada como pátria de Apolo e Ártemis, reconstrói-se o antigo templo. Peregrinos e sacerdotes reúnem-se de todo o Mar Egeu, e o espírito da razão e da beleza gregas antigas renasce. O império neoplatônico com que sonhou Pletão começa a tomar forma."
 byz_events.17.a: "Iluminar o império com a luz de Delos"
 byz_events.18.t: "O Serapeu — A Conclusão do Renascimento Helênico"
 byz_events.18.d: "Alexandria — nesta terra, onde outrora se erguia o Serapeu, a fé nos deuses helênicos voltou.\n\nCom a reconstrução do templo concluída, os deuses do Olimpo descem de novo sobre a grande terra do Nilo. Os cidadãos de Alexandria realizam de novo os antigos ritos, e as orações a Serápis ecoam pelo céu da manhã.\n\nEsse sagrado renascimento envia ondas de fé helênica por todo o Império Bizantino — novos convertidos surgem um após o outro, o poder dos sinais cresce e a influência religiosa aumenta. Zeus, Apolo, Atena — todos os deuses abençoam a restauração do império."
 byz_events.18.a: "Fazer do Serapeu a cidade sagrada do mundo helênico"
 byz_faith_choice: "A Escolha da Fé"
 byz_faith_choice_desc: "Uma nova era de ideias começa. Na corte de Mistra, discute-se a doutrina neoplatônica, enquanto em Constantinopla a autoridade da igreja ortodoxa é questionada. O império está numa encruzilhada espiritual."
 byz_faith_orthodox_chosen_tt: "Escolheu a Ortodoxia"
 byz_faith_hellenic_chosen_tt: "Escolheu o Helenismo"
 byz_events.19.t: "Encruzilhada da Fé — Ortodoxia ou Helenismo"
 byz_events.19.d: "Grécia recuperada. Da Acrópole de Atenas, avista-se ao longe Constantinopla, e as ruínas de antigos templos dormem nos cumes do Peloponeso. A restauração do Império Bizantino não é apenas recuperar território — é reconstruir uma alma. Duas vozes disputam na corte imperial. Uma é a do clero: “Somos o povo de Cristo. Devemos reconstruir o império como guardião da igreja ortodoxa”. A outra é a dos filósofos helenistas: “Por que adorar um deus estrangeiro na terra de Platão e Aristóteles? Os antigos deuses gregos são o verdadeiro lar de nossas almas”."
 byz_events.19.a: "Preservar a igreja ortodoxa — proteger a tradição oriental"
 byz_events.19.a.tt: "Ramo ortodoxo da fé desbloqueado. Prossiga para as missões de ortodoxização de Antioquia, Jerusalém, Alexandria e Roma."
 byz_events.19.b: "Ressuscitar os antigos deuses — reacender a chama helênica"
 byz_events.19.b.tt: "Ramo helênico desbloqueado. O império volta-se ao helenismo, e tornam-se disponíveis as missões de reconstrução dos santuários de Atenas, Corinto, Mistra e Alexandria."
 byz_orthodox_path_start: "O Caminho Ortodoxo"
 byz_orthodox_path_start_desc: "O caminho do guardião ortodoxo aberto. Continue a recuperar e ortodoxizar as cidades santas."
 byz_hellenic_path_start: "O Caminho Helênico"
 byz_hellenic_path_start_desc: "O caminho dos antigos deuses aberto. Reconstrua os santuários da Hélade e reconstrua a antiga civilização grega."
 byz_recovery_from_decline: "Recuperação do Declínio"
 byz_recovery_from_decline_desc: "Subjugue o poder da nobreza cortesã e reconstrua a autoridade da coroa. À medida que o poder imperial for reconstruído, a estabilidade no governo advirá."
 byz_city_the_world_desires: "A Cidade Desejada pelo Mundo"
 byz_city_the_world_desires_desc: "Constantinopla cresceu de novo até ser a grande cidade que gente de todo o mundo deseja ver. Que essa prosperidade se torne eterna."
 byz_islamic_heartland: "O Coração do Islã"
 byz_islamic_heartland_desc: "Meca e Medina, as duas cidades mais sagradas do islã, caíram em nossas mãos. O império deve agora decidir o destino desses lugares santos."
 byz_events.22.t: "Os Lugares Santos do Islã"
 byz_events.22.d: "A Caaba em Meca e a Mesquita do Profeta em Medina — os lugares mais sagrados do mundo islâmico — estão agora sob controle imperial. Destruí-los para mostrar a supremacia da ortodoxia, ou acolhê-los para que o império se beneficie da riqueza dos peregrinos?"
 byz_events.22.a: "Destruir os lugares santos"
 byz_events.22.b: "Acolher os lugares santos"
 STATIC_MODIFIER_NAME_byz_anatolia_west: "Anatólia Ocidental Restaurada"
 STATIC_MODIFIER_DESC_byz_anatolia_west: "Os diversos povos da Anatólia Ocidental são gradualmente incorporados à cultura do império."
 STATIC_MODIFIER_NAME_byz_anatolia_east: "Anatólia Oriental"
 STATIC_MODIFIER_DESC_byz_anatolia_east: "Os diversos povos da Anatólia Oriental são gradualmente incorporados à cultura do império."
 STATIC_MODIFIER_NAME_byz_greece_restored: "Hélade Restaurada"
 STATIC_MODIFIER_DESC_byz_greece_restored: "Atenas, Salonica, Peloponeso — o coração da antiga civilização grega e da cultura greco-bizantina. A recuperação dessas terras, após o domínio latino (o Ducado franco de Atenas e outros), a pilhagem da Companhia Catalã e a conquista pelos otomanos, é o cumprimento de um sonho milenar do “helenismo” renascido."
 STATIC_MODIFIER_NAME_byz_balkan_order: "Ordem Balcânica"
 STATIC_MODIFIER_DESC_byz_balkan_order: "Os efetivos e o poderio militar dos Bálcãs reforçados."
 STATIC_MODIFIER_NAME_byz_syria_province: "Província da Síria"
 STATIC_MODIFIER_DESC_byz_syria_province: "A Síria foi, desde a Antiguidade, centro de comércio e artesanato como extremo ocidental da Rota da Seda. O aço de Damasco, o sabão de Alepo, o vidro sírio — essas famosas mercadorias eram exportadas para o mundo todo. Nos séculos IV-VII, foi também a província mais rica do Império Bizantino, trazendo enormes receitas fiscais."
 STATIC_MODIFIER_NAME_byz_judaea_province: "Província da Judeia"
 STATIC_MODIFIER_DESC_byz_judaea_province: "Administrar a Judeia, lar da Terra Santa, favorece maior tolerância às muitas fés do império."
 STATIC_MODIFIER_NAME_byz_aegyptus_province: "Província do Egito"
 STATIC_MODIFIER_DESC_byz_aegyptus_province: "As terras férteis do Nilo permitem ao império sustentar maior população em todas as suas províncias."
 STATIC_MODIFIER_NAME_byz_aegean_mastery: "Domínio do Mar Egeu"
 STATIC_MODIFIER_DESC_byz_aegean_mastery: "Nos portos das Ilhas Egeias, atracam sem cessar os navios de guerra e mercantes do império, e o mar voltou a ser “nosso mar”."
 STATIC_MODIFIER_NAME_byz_rome_restored: "Cidade Eterna Restaurada"
 STATIC_MODIFIER_DESC_byz_rome_restored: "Quando o estandarte de Bizâncio tremulou de novo sobre as sete colinas, a corte em Constantinopla soube que o império havia enfim alcançado seu auge."
 STATIC_MODIFIER_NAME_byz_hispania_province: "Província da Hispânia"
 STATIC_MODIFIER_DESC_byz_hispania_province: "As vastas terras da Espanha enviam muitos soldados para engrossar as fileiras do exército imperial."
 STATIC_MODIFIER_NAME_byz_gallia_province: "Província da Gália"
 STATIC_MODIFIER_DESC_byz_gallia_province: "As águias romanas voam de novo sobre as planícies da Gália, e os soldados às margens do Loire marcham com orgulho pelo imperador, distante no leste."
 STATIC_MODIFIER_NAME_byz_true_rome: "A Verdadeira Roma"
 STATIC_MODIFIER_DESC_byz_true_rome: "As velas e carroças dos mercadores de Veneza, Gênova e Milão conduzem agora seu comércio sob o estandarte do imperador. A península itálica já não é um ramo de Roma, mas seu tronco."
 STATIC_MODIFIER_NAME_byz_renovatio_imperii_mod: "Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_imperii_mod: "O Império Romano plenamente restaurado — as estradas com que sonhou Justiniano ligam de novo todos os cantos do império, e os mensageiros do imperador cavalgam sem obstáculos até as distantes margens do Mediterrâneo."
 STATIC_MODIFIER_NAME_byz_collapse_averted: "Colapso Evitado"
 STATIC_MODIFIER_DESC_byz_collapse_averted: "O império ainda não caiu. Tendo sobrevivido à crise, a corte alivia o peso de privar os poderosos de privilégios e enfraquece a resistência a tais reformas."
 STATIC_MODIFIER_NAME_byz_bursa_silk: "Comércio de Seda de Bursa"
 STATIC_MODIFIER_DESC_byz_bursa_silk: "Nos bosques de amoreiras de Bursa, o som dos bichos-da-seda a fiar nunca silencia nas noites de primavera."
 STATIC_MODIFIER_NAME_byz_bursa_fine_cloth: "Comércio de Tecidos Finos de Bursa"
 STATIC_MODIFIER_DESC_byz_bursa_fine_cloth: "Dos teares das oficinas de Bursa saem, um após o outro, tecidos finos, disputados pelos cortesãos."
 STATIC_MODIFIER_NAME_byz_nicomedia_weaponry: "Comércio de Armamentos de Nicomédia"
 STATIC_MODIFIER_DESC_byz_nicomedia_weaponry: "Nas forjas de Nicomédia soam os martelos dia e noite, e espadas e armaduras para o exército imperial empilham-se alto."
 STATIC_MODIFIER_NAME_byz_nicomedia_silk: "Comércio de Seda de Nicomédia"
 STATIC_MODIFIER_DESC_byz_nicomedia_silk: "Jovens amoreiras plantadas nas colinas em torno de Nicomédia, aguardando o dia em que a cidade será famosa como lar da seda."
 STATIC_MODIFIER_NAME_byz_hellenic_sanctuary: "Santuário Helênico"
 STATIC_MODIFIER_DESC_byz_hellenic_sanctuary: "De novo no santuário dos antigos deuses se oferecem sacrifícios, e os passos dos peregrinos desgastam as pedras do calçamento."
 STATIC_MODIFIER_NAME_byz_hellenic_serapeum: "O Serapeu"
 STATIC_MODIFIER_DESC_byz_hellenic_serapeum: "Com a reconstrução do Serapeu, Alexandria tornou-se o centro espiritual do mundo antigo, e tanto eruditos quanto peregrinos se reúnem a suas portas."
 STATIC_MODIFIER_NAME_byz_schism_ended: "O Fim do Grande Cisma"
 STATIC_MODIFIER_DESC_byz_schism_ended: "Após séculos de excomunhões mútuas de 1054, as igrejas do Oriente e do Ocidente reuniram-se enfim junto a um só altar pelo triunfo da ortodoxia."
 STATIC_MODIFIER_NAME_byz_islamic_sites_destroyed: "Lugares Santos Destruídos"
 STATIC_MODIFIER_DESC_byz_islamic_sites_destroyed: "A destruição dos lugares santos islâmicos provou poderosamente a supremacia da ortodoxia e reforçou a fé na religião de Estado e o prestígio do império."
 STATIC_MODIFIER_NAME_byz_islamic_sites_accepted: "Lugares Santos Acolhidos"
 STATIC_MODIFIER_DESC_byz_islamic_sites_accepted: "Acolher os lugares santos islâmicos multiplicou a tolerância a hereges e pagãos, e a atividade comercial floresceu com o afluxo de peregrinos."
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "Recuperação do Declínio"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "O tempo sombrio do declínio passou, e a luz da manhã brilha de novo sobre a corte do imperador e os campos do império."
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "A Cidade Desejada pelo Mundo"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "Constantinopla reconstruída como centro administrativo do império."
 STATIC_MODIFIER_NAME_byz_africa_province_mod: "Província da África"
 STATIC_MODIFIER_DESC_byz_africa_province_mod: "A frota imperial voltou ao porto de Cartago, e o sonho da era de Justiniano se desenha de novo no mar."
 STATIC_MODIFIER_NAME_byz_renovatio_bonus_mod: "A Glória da Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_bonus_mod: "A restauração do Império Romano reconheceu Bizâncio como senhora do império mundial."
 STATIC_MODIFIER_NAME_byz_antioch_orthodox_mod: "Ortodoxia de Antioquia"
 STATIC_MODIFIER_DESC_byz_antioch_orthodox_mod: "Antioquia reconstruída como templo ortodoxo, o que eleva a autoridade religiosa do império."
 STATIC_MODIFIER_NAME_byz_jerusalem_orthodox_mod: "Ortodoxia de Jerusalém"
 STATIC_MODIFIER_DESC_byz_jerusalem_orthodox_mod: "A Cidade Santa, Jerusalém, ortodoxizada, o que dá vantagens na luta contra os pagãos."
 STATIC_MODIFIER_NAME_byz_alexandria_orthodox_mod: "Ortodoxia de Alexandria"
 STATIC_MODIFIER_DESC_byz_alexandria_orthodox_mod: "O canto ortodoxo ressoa nas igrejas de Alexandria, e os mercados enchem-se de famílias de fiéis."
 STATIC_MODIFIER_NAME_byz_serapeum_restored_mod: "Serapeu Reconstruído"
 STATIC_MODIFIER_DESC_byz_serapeum_restored_mod: "O Serapeu de Alexandria reconstruído, e os deuses do Olimpo descem de novo à terra do Egito."
