l_braz_por:
 pol_jagiellonian_dynasty_mission_pack: "O Esplendor da Dinastia Jagielônica"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION:0 "Em 1337, o Reino da Polônia é governado por Casimiro III, o Grande. Seu sucessor será Luís I da Hungria (da casa de Anjou), e a filha de Luís, Edviges, casará com o grão-duque da Lituânia, Jagelão, criando a união pessoal polaco-lituana. O conflito com a Ordem Teutônica ao norte, a união com a Hungria ao sul, a expansão para o leste pela Lituânia e as ambições sobre a Boêmia — realize tudo isso e construa a maior república nobiliárquica da Europa Centro-Oriental."
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION:0 "Como Polônia, expanda-se em todas as direções — reforma interna, leste, norte, sul e oeste — e realize a era de ouro polonesa."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para realizar a era de ouro polonesa."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS:0 "De Casimiro, o Grande, à era de ouro dos Jagelões — construa a república nobiliárquica!"
 pol_kingdom_of_poland: "O Reino da Polônia"
 pol_kingdom_of_poland_desc: "Casimiro III — o “Grande” — subiu ao trono em 1333 e unificou a Polônia fragmentada. “Encontrou uma Polônia de madeira e deixou uma de pedra”, diziam as gerações posteriores. Favoreceu a reforma jurídica, a construção de cidades e a proteção dos judeus, e seu reinado é considerado o auge da prosperidade polonesa medieval. Eleve a legitimidade e a estabilidade e firme os alicerces do reino."
 pol_integrate_mazovia: "Integre a Masóvia"
 pol_integrate_mazovia_desc: "O Ducado da Masóvia é governado por um ramo mais jovem da dinastia Piasta, situado na fértil planície do coração da Polônia. Assegurar Varsóvia e Lublin e integrar por completo essa rica planície ao Reino da Polônia estabelece o centro político da Polônia Central. Obtenha antes o que a história só dará em 1526."
 pol_great_sejm: "O Grande Sejm"
 pol_great_sejm_desc: "O Sejm polonês — parlamento — desenvolveu-se desde o século XIII. Essa assembleia de estamentos de magnatas, nobres e clero estabeleceu nos séculos XV-XVI o conceito de “Liberdade Dourada” (Złota Wolność) e transformou gradualmente a Polônia numa república nobiliárquica. Fortaleça o Sejm e mantenha o equilíbrio entre o poder real e os direitos da nobreza."
 pol_krakow_renaissance: "O Renascimento em Cracóvia"
 pol_krakow_renaissance_desc: "Cracóvia é a capital do Reino da Polônia, e a Universidade Jagielônica — alma mater de Copérnico — é a melhor academia da Europa Centro-Oriental. O Renascimento italiano chega a Cracóvia, e Wawel é reconstruído em estilo renascentista. Desenvolva a universidade e cultive Cracóvia como centro espiritual da Europa Centro-Oriental."
 pol_jagiellonian_university: "A Universidade Jagielônica Floresce"
 pol_jagiellonian_university_desc: "A Universidade Jagielônica, fundada por Casimiro III em 1364 e renovada pela rainha Edviges em 1400, produziu Nicolau Copérnico (1473-1543) e muitas outras grandes mentes. A ampliação das universidades por toda a Polônia espalha a luz do saber pelo reino."
 pol_polish_golden_age: "A Era de Ouro Polonesa"
 pol_polish_golden_age_desc: "Sob a dinastia jagielônica, a Polônia viveu nos séculos XV-XVI a “Era de Ouro” (Złoty Wiek). O heliocentrismo de Copérnico, a poesia de Kochanowski, a arte de Cracóvia — a Polônia era não só uma grande potência, mas também a vanguarda cultural. Demonstre essa era de ouro com vasto território, rica renda e alto prestígio."
 pol_jadwiga_union: "O Casamento de Edviges e Jagelão"
 pol_jadwiga_union_desc: "A União de Krewo de 1385 arranjou o casamento da rainha polonesa Edviges com o grão-duque lituano Jagelão (Ladislau II Jagelão). Jagelão converteu-se ao cristianismo e reivindicou o título de rei da Polônia em troca da catolicização da Lituânia. Esse casamento foi o começo do Estado unido polaco-lituano — e a aurora da dinastia jagielônica, destinada a durar mais de dois séculos."
 pol_develop_ruthenia: "Desenvolva a Rutênia"
 pol_control_kyiv: "Domínio de Kiev"
 pol_control_kyiv_desc: "Kiev foi a capital da Rus de Kiev, berço da civilização eslava. Após a devastação mongol de 1240, a cidade caiu sob domínio lituano. Tomar Kiev estabelece o controle sobre toda a bacia do Dnieper e abre o caminho para o Mar Negro."
 pol_push_east: "Avanço para o Leste"
 pol_push_east_desc: "Minsk é o coração da Lituânia; Smolensk é importante nó do mundo eslavo oriental. Com a ascensão do Grão-Principado de Moscou, assegurar essas cidades fará da união polaco-lituana a potência dominante do mundo eslavo oriental. A disputa histórica por Smolensk, que Ivan III travou — desta vez se decide a favor da Polônia."
 pol_eastern_empire: "O Império Oriental"
 pol_eastern_empire_desc: "A república nobiliárquica polaco-lituana em seu auge (por volta de 1618) tornou-se o maior Estado da Europa. Do Báltico à estepe pôntica (Mar Negro), todo o mundo eslavo oriental uniu-se sob a bandeira polonesa. Erga o grande império oriental, temido igualmente pela Rússia, pelos otomanos e pelos Habsburgo."
 pol_prussian_confederation: "A Confederação Prussiana e a Ordem Teutônica"
 pol_prussian_confederation_desc: "A Ordem Teutônica, que conquistou os pagãos bálticos no século XIII, tornou-se inimiga jurada da Polônia. Em Grunwald, em 1410, o exército polaco-lituano a derrotou por completo. Com o apoio da Confederação Prussiana — burgueses prussianos que buscavam a proteção polonesa — esmague a Ordem Teutônica e assegure à Polônia o acesso ao Báltico."
 pol_gdansk_port: "O Porto de Gdansk"
 pol_gdansk_port_desc: "Gdansk é chamada de “porta da Polônia” — o mais importante porto do Báltico. Situada na foz do Vístula, essa cidade era o principal nó da Hansa e a chave da exportação de grãos da Polônia. Assegurada à Polônia pela Segunda Paz de Toruń (1466), Gdansk serviu por dois séculos como coração da economia polonesa."
 pol_livonian_expansion: "Expansão na Livônia"
 pol_livonian_expansion_desc: "A Livônia (atuais Letônia e Estônia), outrora governada pela Ordem dos Irmãos da Espada, tornou-se no século XVI palco de disputa entre Rússia, Suécia, Dinamarca e Polônia. Tomar Riga e Reval (Tallinn) traz todo o Báltico ao controle polonês."
 pol_master_of_the_north: "Senhor do Norte"
 pol_master_of_the_north_desc: "Königsberg (atual Kaliningrado), outrora bastião da Ordem Teutônica, leva agora o estandarte polonês. Com uma poderosa frota que domina todo o Báltico, a Polônia tem na mão a Escandinávia, a Hansa e os holandeses — o supremo senhor do Norte."
 pol_hungarian_union: "União Pessoal com a Hungria"
 pol_hungarian_union_desc: "Quando Casimiro III morreu sem herdeiro em 1370, seu sobrinho Luís I da Hungria (da casa de Anjou) herdou o trono polonês. Foi o começo da união pessoal polaco-húngara. Dois grandes reinos, unidos sob um só rei — o equilíbrio de poder na Europa Centro-Oriental muda por completo."
 pol_moldavia_vassal: "Subjugue a Moldávia"
 pol_moldavia_vassal_desc: "O Principado da Moldávia (Moldova) é um Estado-tampão, disputado por Polônia, Hungria e otomanos. Estêvão, o Grande (reinou 1457-1504), manteve a suserania polonesa nominal, conservando a independência de fato. Traga esse principado estratégico com firmeza sob proteção polonesa e conquiste a porta para o Mar Negro."
 pol_wallachia_control: "Domínio da Valáquia"
 pol_wallachia_control_desc: "A Valáquia, principado ao norte do Danúbio, é a linha de frente contra o Império Otomano. Vlad II (pai de Vlad, o Empalador) serviu à Hungria como membro da Ordem do Dragão. Trazer a Valáquia à proteção da união polaco-húngara estabelece influência na Península Balcânica."
 pol_battle_of_grunwald: "O Espírito de Grunwald"
 pol_battle_of_grunwald_desc: "Em 15 de julho de 1410, o exército polaco-lituano derrotou por completo a Ordem Teutônica nos campos de Grunwald (Tannenberg). O grão-mestre Ulrich von Jungingen tombou no campo, e a Polônia consolidou sua reputação de “defensora da cristandade”. Prove esse espírito agora de novo na guerra contra as forças do islã."
 pol_shield_of_christendom: "Escudo da Cristandade"
 pol_shield_of_christendom_desc: "Desde a política de cristianização de Edviges, a Polônia está na linha de frente do catolicismo da Europa Oriental. Depois da expulsão definitiva do Império Otomano, o papa, Veneza e os Habsburgo reconhecem por igual que a Polônia é o verdadeiro Antemurale Christianitatis — o baluarte da cristandade."
 pol_silesia_integration: "Incorporação da Silésia"
 pol_silesia_integration_desc: "A Silésia (Śląsk) é o berço da dinastia Piasta, mas caiu sob controle boêmio e habsburgo no século XIV. Recuperar essa rica região industrial e comercial em torno de Breslau (Breslávia) é um dos mais importantes mandamentos nacionais e econômicos da Polônia."
 pol_bohemian_claim: "A Coroa da Boêmia"
 pol_bohemian_claim_desc: "A dinastia jagielônica tem direitos hereditários aos tronos boêmio e húngaro. Ladislau II (Jagelão) tornou-se rei da Boêmia em 1471 e depois rei da Hungria em 1490. Tomar a coroa boêmia em Praga cria uma tríplice monarquia polaco-boêmio-húngara."
 pol_hre_influence: "Influência sobre o Sacro Império Romano"
 pol_hre_influence_desc: "O rei da Polônia, que porta também a coroa boêmia, pode tornar-se eleitor do Sacro Império Romano. Equilibrando a diplomacia com os Habsburgo e ampliando a influência sobre os príncipes alemães, a Polônia torna-se o centro político da Europa Central."
 pol_central_european_power: "Potência da Europa Central"
 pol_central_european_power_desc: "Um vasto reino, que abrange a Polônia, a Lituânia, a Boêmia e a Hungria, com rica renda — a Polônia emergiu como a maior potência da Europa Centro-Oriental. Cercada pelas três grandes potências, o Sacro Império Romano, o Império Otomano e o Grão-Principado de Moscou, a Polônia brilha com luz própria."
 pol_grand_commonwealth: "A Grande República Nobiliárquica"
 pol_grand_commonwealth_desc: "A república nobiliárquica que une Polônia, Lituânia, Boêmia e Hungria — esse Estado de singular sistema político, que concilia a liberdade nobre com a autoridade real, era conhecido nos séculos XVI-XVII como a “República de Muitas Nações” (Rzeczpospolita). Esse extraordinário experimento político, que abarca muitas nações, fés e línguas, alcançou seu auge."
 pol_events.10.t: "O Casamento de Edviges e Jagelão"
 pol_events.10.d: "A União de Krewo deu frutos: a rainha polonesa Edviges e o grão-duque lituano Jagelão casaram-se. Jagelão recebeu o batismo cristão e assumiu, como rei da Polônia, o nome “Ladislau II”. A Lituânia entra com a Polônia em união pessoal, e a maior união política da Europa Oriental começou. Esse casamento é mais que um cálculo político — é o momento histórico em que duas nações, duas culturas, duas línguas se unem sob uma só dinastia. “Polônia e Lituânia, unidas para sempre”, proclamou a União de Krewo."
 pol_events.10.a: "Viva a nova dinastia jagielônica!"
 pol_events.20.t: "União Pessoal Polaco-Húngara"
 pol_events.20.d: "A Polônia e a Hungria formaram uma união pessoal. Dois grandes reinos, unidos sob um só rei — é um triunfo diplomático da casa de Anjou e um evento que transforma a história da Europa Centro-Oriental. Cavaleiros poloneses e húngaros estão agora lado a lado. Do Báltico, ao norte, ao Adriático, ao sul, um vasto reino sob uma só dinastia ganha forma. Para o Império Otomano, essa união é a maior ameaça que enfrenta."
 pol_events.20.a: "Polônia e Hungria unidas!"
 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "O Legado dos Piastas"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "O legado milenar da dinastia Piasta — a primeira casa real polonesa — sustenta a legitimidade da coroa polonesa."
 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "Integração da Masóvia"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "A Masóvia, em torno de Varsóvia, plenamente integrada à Polônia. Essa fértil planície funciona como coração do reino."
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "O Grande Sejm Estabelecido"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "O Sejm polonês estabelecido como instituição da Liberdade Dourada. Nasce um singular sistema político, que concilia a autonomia nobre com a autoridade real."
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "Florescimento Cultural de Cracóvia"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "Cracóvia, em torno de Wawel, banha-se na luz do Renascimento. Como maior cidade acadêmica da Europa Centro-Oriental, reúne aqui eruditos e artistas de toda a Europa."
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "A Universidade Jagielônica Prospera"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "A Universidade Jagielônica — alma mater de Copérnico — prospera como a melhor academia da Europa Centro-Oriental. O saber e as artes espalham-se por toda a Polônia."
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "A Era de Ouro Polonesa"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "O heliocentrismo de Copérnico, a poesia de Kochanowski, a arquitetura de Cracóvia — em todos os aspectos a Polônia desfruta sua era de ouro."
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "Laços da União de Edviges e Jagelão"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "A união pessoal polaco-lituana estabelecida. Um vasto Estado, que se estende do Báltico ao Mar Negro, ganha forma."
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "A Força da Aliança Polaco-Húngara"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "Os estandartes dos exércitos reais, reunidos das margens do Vístula e do Danúbio, estão lado a lado nas colinas junto à fronteira otomana."
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "Desenvolvimento da Rutênia"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "Os campos cultivados da Rutênia Vermelha plenamente desenvolvidos. A rota comercial do Mar Negro por Lviv reanimada."
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "A Porta de Kiev"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "Kiev, berço da civilização eslava, passou ao controle polonês. Estabelecida a influência sobre toda a bacia do Dnieper."
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "Avanço para o Leste"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "Com Minsk e Smolensk asseguradas, todo o mundo eslavo oriental entra na esfera de influência polonesa."
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "O Império Oriental"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "O império polonês, que se estende do Báltico ao Mar Negro, concluído. Inscrito na história como o maior Estado da Europa Oriental."
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "Vitória sobre a Ordem Teutônica"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "O espírito de Grunwald inspira o exército polonês. A memória da vitória sobre os cruzados da cristandade torna-se orgulho do exército."
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "Cidade Comercial de Gdansk"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "Gdansk desenvolveu-se como o maior porto de exportação de grãos do Báltico. O grão polonês, que desce o Vístula, alimenta toda a Europa."
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "A Glória de Grunwald"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "O espírito de Grunwald inspira o exército polonês. Na luta contra os infiéis, a Polônia conquista glória cada vez maior."
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "Escudo da Cristandade"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "A Polônia inscrita na história como Antemurale Christianitatis — baluarte da cristandade."
 STATIC_MODIFIER_NAME_pol_silesia_mod: "Incorporação da Silésia"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "A bandeira da águia retornou aos castelos da Silésia, pátria dos Piastas, e a fumaça de suas minas e oficinas sobe de novo ao céu polonês."
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "A Coroa da Boêmia"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "A dinastia jagielônica conquistou a coroa boêmia. A corte real boêmia em Praga torna-se palco da diplomacia polonesa."
 STATIC_MODIFIER_NAME_pol_central_power_mod: "Potência da Europa Central"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "A Polônia emergiu como a maior potência da Europa Centro-Oriental. Mesmo entre as três grandes potências, brilha com luz própria."
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "A Grande República Nobiliárquica"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "A Rzeczpospolita concluída — o maior experimento político da Europa, que abarca muitas nações, fés e línguas."
 pol_support_merchants: "Apoio aos Mercadores"
 pol_support_merchants_desc: "A burguesia urbana da Polônia é um importante pilar das finanças reais. Apoiando a rede comercial em torno do Sukiennice (Mercado dos Tecidos) de Cracóvia, melhoram tanto a lealdade dos burgueses quanto a receita fiscal. Satisfaça os mercadores e lance a base da Polônia como nação comercial."
 pol_black_sea_access: "Acesso ao Mar Negro"
 pol_black_sea_access_desc: "Descendo o Dnieper, a Polônia pode alcançar o Mar Negro. Controlar a península da Crimeia e a costa norte do Ponto Euxino (Mar Negro) significa assegurar a rota comercial para o Oriente, contornando Constantinopla, administrada pelos otomanos. Construa uma frota do Mar Negro e amplie o domínio marítimo."
 pol_breadbasket_of_europe: "O Celeiro da Europa"
 pol_breadbasket_of_europe_desc: "No final do século XVI, a Polônia fornecia a maior parte dos grãos consumidos pela Europa. Mercadores de Amsterdã, Lisboa e Sevilha não podiam fazer negócios sem o trigo e o centeio poloneses. A Polônia está inscrita na história como o “Celeiro da Europa”."
 pol_nieszawa_privileges: "Os Privilégios de Nieszawa"
 pol_nieszawa_privileges_desc: "Em 1454, Casimiro IV Jagelão precisou da leva geral da nobreza para a guerra contra a Ordem Teutônica — e pagou por isso com o Estatuto de Nieszawa, que concedia amplos privilégios à nobreza. Daí em diante o rei não podia nem introduzir novos impostos nem emitir novas leis sem o consentimento da nobreza. Tornou-se a pedra angular da “Liberdade Dourada” polonesa."
 pol_develop_krakow: "Desenvolva Cracóvia"
 pol_develop_krakow_desc: "A capital polonesa, Cracóvia, cresceu em torno de Wawel. Desenvolver por completo essa cidade — elevá-la ao posto de cidade — estabelece seu posto de maior cidade comercial da Europa Centro-Oriental."
 pol_baltic_fleet: "A Frota Báltica"
 pol_baltic_fleet_desc: "Com Gdansk assegurada, a Polônia garantiu acesso ao Báltico. Chegou a hora de construir uma frota e disputar a supremacia sobre o Báltico. Enquanto Suécia, Dinamarca e a Ordem dos Irmãos da Espada disputam essas águas, a frota polonesa torna-se a mais nova — e a maior — potência do Báltico."
 pol_sea_to_sea: "De Mar a Mar"
 pol_sea_to_sea_desc: "O domínio da Livônia no mar e a tomada de Kiev e Smolensk — a união polaco-lituana estende-se agora do Báltico ao Mar Negro. De Reval, ao norte, a Kiev, ao sul, o maior império ininterrupto da Europa Oriental concluído. O grande hetman Jan Zamoyski dirá mais tarde: “Esta Polônia é a nação que o próprio Deus construiu”."
 pol_challenge_habsburg: "Desafie os Habsburgo"
 pol_challenge_habsburg_desc: "No século XVI, os Habsburgo governavam o Sacro Império Romano, a Espanha, a Boêmia e a Hungria — a maior dinastia da Europa. Mas, como rei da Boêmia e da Polônia, o monarca jagielônico pode desafiar essa hegemonia. Tome Viena ou traga os Habsburgo sob o estandarte polonês."
 pol_codify_law: "Codifique o Direito"
 pol_codify_law_desc: "Os Estatutos de Wiślica de Casimiro, o Grande, de 1346/47, foram a primeira codificação sistemática do direito polonês. Apoiando-se na manutenção de registros e na infraestrutura administrativa centrada nos escritórios, uma codificação mais completa do direito polonês melhora muito a eficiência administrativa."
 pol_develop_warsaw: "Desenvolva Varsóvia"
 pol_develop_warsaw_desc: "Varsóvia cresceu como centro do Ducado da Masóvia. Situada no centro da Polônia, tornar-se-á capital da República das Duas Nações após a União de Lublin de 1569. Elevá-la ao posto de cidade estabelece a base administrativa do centro do reino."
 pol_amber_road: "A Rota do Âmbar"
 pol_amber_road_desc: "O âmbar do Báltico — “ouro do Norte” — é valorizado desde a Antiguidade. Gdansk era o principal porto de exportação do âmbar do Báltico, e a exportação para a Itália e o Mediterrâneo trazia enorme riqueza. Reanime essa antiga rota comercial e eleve a posição econômica da Polônia."
 pol_poznan_commerce: "O Comércio de Poznań"
 pol_poznan_commerce_desc: "Poznań é a cidade comercial da Polônia Ocidental, nó do comércio com Brandemburgo e a Silésia. Essa cidade, que abriga a primeira sede episcopal polonesa, foi continuamente o centro comercial da Polônia Ocidental desde a Idade Média. Eleve-a ao posto de cidade e libere plenamente seu potencial comercial."
 pol_vilnius_capital: "Desenvolva Vilnius"
 pol_vilnius_capital_desc: "Vilnius cresceu rapidamente no século XIV como capital do Grão-Ducado da Lituânia. Construída pelo grão-duque Gediminas, essa cidade tornou-se lar de muitos judeus, católicos e cristãos ortodoxos, vivendo lado a lado — mais tarde conhecida como a “Jerusalém do Norte”. Eleve-a ao posto de cidade e desenvolva o centro da administração lituana."
 pol_russia_rivalry: "Rivalidade com Moscou"
 pol_russia_rivalry_desc: "Ivan III, o Grande, disputou ferozmente com a Polônia-Lituânia por Smolensk. As guerras de Smolensk entre Moscou e a Polônia-Lituânia duraram todo o século XVI — uma disputa de sorte. Declare Moscou rival e estabeleça a hegemonia oriental. Contra a reivindicação de Moscou de ser “guardiã da Santa Rus”, está a Polônia como “guardiã da liberdade”."
 pol_malbork_castle: "O Castelo de Malbork"
 pol_malbork_castle_desc: "Malbork foi construído como sede principal da Ordem Teutônica — o maior castelo medieval da Europa. Entregue à Polônia pela Segunda Paz de Toruń (1457), essa poderosa fortaleza torna-se um excelente ponto defensivo."
 pol_gniezno_church: "O Arcebispado de Gniezno"
 pol_gniezno_church_desc: "Gniezno é a capital histórica da Polônia e sede de seu primeiro arcebispado. Construída por volta de 987, a catedral de Gniezno guarda as relíquias de Santo Adalberto e desde então serve de coração da fé católica polonesa. Reforce a Igreja polonesa e realize a missão de defensora do catolicismo da Europa Oriental."
 pol_hanseatic_ties: "Laços com a Hansa"
 pol_hanseatic_ties_desc: "A Liga Hanseática dominava o comércio do Báltico e do Mar do Norte. Cidades polonesas, como Gdansk, Toruń e Elbląg, tinham estreitos laços hanseáticos. Erga uma vasta rede comercial em torno dessas cidades, e a Polônia ascenderá como principal potência comercial do Báltico."
 pol_transylvania_influence: "Influência sobre a Transilvânia"
 pol_transylvania_influence_desc: "A Transilvânia é uma região rica na fronteira do Reino da Hungria e da união pessoal polonesa. Estabelecer influência sobre a Transilvânia — por meio da união húngara ou diretamente — estabiliza a fronteira sudeste da Polônia."
 pol_subjugate_serbia: "Subjugue a Sérvia"
 pol_subjugate_serbia_desc: "O Reino da Sérvia tornou-se vassalo otomano após Kosovo (1389). Como parte da expansão meridional da união polaco-húngara, assegurar Belgrado ou tornar a Sérvia vassala estabelece uma sólida cabeça de ponte nos Bálcãs setentrionais."
 pol_varna_revenge: "A Vingança de Varna"
 pol_varna_revenge_desc: "Na batalha de Varna, em 1444, o exército cruzado polaco-húngaro foi esmagado pelos otomanos, e o rei polonês Ladislau III tombou no campo. Chegou enfim a hora de vingar essa humilhação. Tome Varna lutando contra uma nação muçulmana, e essa tragédia será reescrita como vitória."
 pol_upper_silesia_mines: "As Minas da Alta Silésia"
 pol_upper_silesia_mines_desc: "A Alta Silésia é conhecida por suas ricas minas de prata, zinco e chumbo. O pleno desenvolvimento dos distritos mineiros em torno de Cieszyn e Gliwice estabelece a base industrial da Polônia. Obtenha antes as riquezas naturais dessa região — mais tarde tornou-se o centro da Revolução Industrial."
 pol_upper_silesia_mines_unlock_tt: "A decisão “Desenvolver as minas da Alta Silésia” está agora disponível."
 pol_silesia_mining_decision.title: "Desenvolver as minas da Alta Silésia"
 pol_silesia_mining_decision.desc: "Os distritos mineiros da Silésia são vastos, e a Coroa não pode abri-los todos de uma vez. Cada investimento em poços, fundições e estradas leva mais um distrito à produção plena, e a obra pode ser renovada a cada década."
 pol_silesia_mining_decision.a: "Investir em um novo distrito mineiro."
 pol_pomeranian_coast: "A Costa da Pomerânia"
 pol_pomeranian_coast_desc: "A Pomerânia (Pomorze) é uma região báltica em torno de Stettin. Recuperar essa região historicamente pertencente ao reino polonês dá à Polônia pleno controle do litoral báltico."
 pol_prague_university: "A Universidade de Praga"
 pol_prague_university_desc: "A Universidade Carolina de Praga (fundada em 1348) é a mais antiga da Europa Centro-Oriental. Outrora sede da Reforma hussita, essa academia pode agora ser reconstruída e desenvolvida sob domínio polonês — e Praga tornar-se-á de novo centro do saber católico."
 pol_catholicism_of_lithuania: "A Catolicização da Lituânia"
 pol_catholicism_of_lithuania_desc: "Quando Jagelão se tornou rei da Polônia, jurou converter a Lituânia ao catolicismo. Erga igrejas e mosteiros por toda a Lituânia em torno de Vilnius e transforme essa terra outrora pagã num Estado plenamente católico. Sem essa conversão, não pode haver verdadeira unidade da união polaco-lituana. “A Lituânia, renascida na fé”."
 pol_royal_road: "A Estrada Real"
 pol_royal_road_desc: "A “Estrada Real” (Droga Królewska), que vai de Cracóvia por Gniezno e Poznań até Gdansk, é a grande artéria do Reino da Polônia. Com a Masóvia incorporada e a Prússia conquistada, o desenvolvimento dessa estrada melhora muito as comunicações, o comércio e a administração por todo o reino."
 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "Os Privilégios de Nieszawa"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "A nobreza conquistou o direito de veto à legislação real. Começa a “Liberdade Dourada” polonesa."
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "O Código de Leis Polonês"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "Novos artigos, derivados do código de leis de Casimiro, o Grande, aproximam o dia em que nobres e burgueses serão julgados igualmente pelo mesmo tribunal."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Política de Apoio aos Mercadores"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "A política de apoio à burguesia urbana polonesa eleva a renda comercial."
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "A Rota do Âmbar"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "Carroças carregadas de âmbar do Báltico seguem a antiga estrada rumo a mercadores que buscam o “ouro do Norte”."
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "Nó Comercial de Poznań"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "A cidade comercial da Polônia Ocidental, Poznań, reconstruída como importante nó comercial."
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "Vilnius Prospera"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "A capital do Grão-Ducado da Lituânia, Vilnius, prospera como cidade multicultural."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Acesso ao Mar Negro"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "A Polônia assegurou acesso ao litoral norte do Mar Negro e entra nas rotas comerciais mediterrâneas."
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "A Fortaleza de Malbork"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "O maior castelo medieval da Europa reconstruído com bastiões — uma fortaleza inabalável."
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "O Arcebispado de Gniezno"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "A catedral de Gniezno, lar das relíquias de Santo Adalberto, funciona como centro espiritual da civilização católica polonesa."
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "A Vingança de Varna"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "A humilhante derrota de 1444 vingada. A Polônia conquista glória cada vez maior na luta contra o mundo islâmico."
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "A Costa da Pomerânia"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "A costa pomerana em torno de Stettin reconstruída como cabeça de ponte da frota polonesa."
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "A Universidade de Praga Prospera"
 STATIC_MODIFIER_DESC_pol_prague_learning_mod: "A mais antiga universidade da Europa Centro-Oriental, a Universidade Carolina, prospera de novo sob domínio polonês."
 STATIC_MODIFIER_NAME_pol_habsburg_victory_mod: "Vitória sobre os Habsburgo"
 STATIC_MODIFIER_DESC_pol_habsburg_victory_mod: "Viena ocupada ou união pessoal com os Habsburgo — a Polônia tornou-se senhora da Europa Central."
 STATIC_MODIFIER_NAME_pol_sea_to_sea_mod: "De Mar a Mar"
 STATIC_MODIFIER_DESC_pol_sea_to_sea_mod: "A Polônia, que se estende do Báltico ao Mar Negro, domina todo o comércio do Leste Europeu."
 STATIC_MODIFIER_NAME_pol_lithuanian_church_mod: "A Igreja Lituana"
 STATIC_MODIFIER_DESC_pol_lithuanian_church_mod: "A catolicização da Lituânia alcançou a unidade espiritual da união polaco-lituana."
 STATIC_MODIFIER_NAME_pol_royal_road_mod: "A Estrada Real"
 STATIC_MODIFIER_DESC_pol_royal_road_mod: "Funcionários, mercadores e soldados viajam em longa fila pela Estrada Real, de Cracóvia a Gdansk."
 pol_lithuanian_relations: "Relações com a Lituânia"
 pol_lithuanian_relations_desc: "O Grão-Ducado da Lituânia — o mais importante vizinho da Polônia — pode ser um aliado ou a maior ameaça. No século XIV, a Lituânia era a última nação pagã da Europa, mas ainda um vasto Estado, que se estendia do Báltico ao Mar Negro. Para assegurar a união pessoal com a Lituânia por meio da política matrimonial da rainha Edviges, é preciso primeiro assentar a base diplomática. Seja por relações amistosas ou por pressão militar, a Polônia pode reivindicar o trono lituano."
 pol_develop_ruthenia_desc: "Halych (Halicz) e Volínia são os dois grandes principados da Rutênia Vermelha. Lviv, centro do principado de Halych, e o principado de Volínia foram conquistados pela Polônia em 1349-66. Bełz é também um importante bastião rutênio. Trazer tanto Halych quanto Volínia em união pessoal sob a Polônia — ou possuir diretamente Lviv e Bełz — estabelece o controle sobre toda a Rutênia Vermelha. Essa terra é uma das maiores zonas agrícolas da Europa, e seu solo rico sustenta a população e a economia polonesas."
 STATIC_MODIFIER_NAME_pol_silesia_mines_mod: "As Minas da Alta Silésia"
 STATIC_MODIFIER_DESC_pol_silesia_mines_mod: "Nos poços da Alta Silésia, o som das picaretas que extraem prata, zinco e chumbo ressoa dia e noite."
 STATIC_MODIFIER_NAME_pol_baltic_fleet_mod: "A Frota Báltica Polonesa"
 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "A frota polonesa, estacionada em Gdansk, domina o Báltico. Da foz do Vístula ao Mar do Norte, a bandeira polonesa tremula sobre as ondas."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Domínio da Livônia"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "Sob a bandeira polonesa, que tremula sobre os portos de Riga e Reval, povos de muitas línguas pagam tributo aos mesmos coletores."
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "Laços com a Hansa"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "Nos kontors de Gdansk, os que partilham a taça com os mercadores hanseáticos conduzem seu comércio, confiando na carga uns dos outros."
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "Influência sobre a Transilvânia"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Por meio da união pessoal com a Hungria, os enviados poloneses são recebidos até nas cortes dos vales montanhosos da Transilvânia."
 pol_breadbasket_town_right_tt: "O direito urbano “Celeiro Real Polonês” está agora disponível. Pode ser concedido a locais de posto cidade ou superior que tenham um celeiro de nível 5 ou maior."
 STATIC_MODIFIER_NAME_pol_warsaw_location_mod: "Capital Real Varsóvia Desenvolvida"
 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "As ruas de Varsóvia, construída às margens do Vístula, ampliam-se de dia em dia, e as carruagens dos funcionários de todo o reino reúnem-se aqui."
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "Cracóvia Prospera"
 STATIC_MODIFIER_DESC_pol_krakow_location_mod: "Cracóvia, em torno de Wawel, plenamente desenvolvida. A ampliação do tamanho máximo de recursos e do crescimento mensal de prosperidade a transforma numa cidade digna de capital real polonesa."
