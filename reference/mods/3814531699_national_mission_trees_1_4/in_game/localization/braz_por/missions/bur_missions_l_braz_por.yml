l_braz_por:
 bur_crown_of_lothair_mission_pack: "A Coroa de Lotário"
 bur_crown_of_lothair_mission_pack_DESCRIPTION:0 "1337: começa a Guerra dos Cem Anos. O Ducado da Borgonha, encravado entre a França e a Inglaterra, possui a astúcia e os recursos para jogar dos dois lados — e, por fim, ressuscitar a Lotaríngia, o antigo Reino do Meio dos herdeiros de Carlos Magno. Assegure a corte de Dijon, construa a Ordem do Tosão de Ouro e domine o comércio de tecidos flamengo; em seguida, navegue na guerra entre a Inglaterra e a França para extrair as máximas concessões, antes de unir Flandres, a Franche-Comté e a Lotaríngia no novo “Reino da Lotaríngia”."
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION:0 "Como Borgonha, navegue na Guerra dos Cem Anos, fortaleça-se internamente e reconstrua a Lotaríngia."
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para reivindicar a Coroa de Lotário."
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS:0 "Sobreviva entre a Inglaterra e a França — e depois supere as duas!"
 bur_duchy_of_burgundy: "As Ambições do Ducado"
 bur_duchy_of_burgundy_desc: "1337: a casa Valois-Borgonha ergue-se como ramo mais jovem da casa real francesa. Jogando a Inglaterra e a França uma contra a outra, o ducado aspira a expandir-se sobre Flandres, a Franche-Comté e a Lotaríngia. A Guerra dos Cem Anos é uma oportunidade, que só ocorre uma vez por geração, para que esse pequeno ducado se torne grande potência."
 bur_court_of_dijon: "A Corte de Dijon"
 bur_court_of_dijon_desc: "A corte borgonhesa, em Dijon, foi uma das mais magníficas da Europa do século XV. Jan van Eyck e Rogier van der Weyden trabalharam sob o mecenato borgonhês, e a biblioteca ducal rivalizava com qualquer outra da França. Esse “Renascimento Setentrional” avant la lettre foi construído sobre a renda do tecido flamengo e sobre a extravagante ambição do duque."
 bur_flemish_cloth: "A Indústria Têxtil Flamenga"
 bur_flemish_cloth_desc: "O triângulo de Bruges, Gante e Ypres era a maior região industrial da Europa medieval. A lã inglesa era enviada a Flandres, processada em tecidos finos por artesãos qualificados e vendida por toda a Europa nas feiras de Champagne. Essa cadeia de suprimentos era a espinha dorsal econômica da Borgonha."
 bur_golden_fleece: "A Ordem do Tosão de Ouro"
 bur_golden_fleece_desc: "Fundada em Bruges em 1430 por Filipe, o Bom, a Ordem do Tosão de Ouro era a mais prestigiosa ordem de cavalaria da cristandade católica — a filiação era reservada a monarcas e grandes príncipes. Baseada no mito de Jasão e dos Argonautas, a insígnia da ordem (o tosão de ouro num pendente) permaneceu a mais alta honra até o século XIX."
 bur_estates_general: "Os Estados Gerais"
 bur_estates_general_desc: "Como Estado composto, que governa Flandres, Brabante e a Franche-Comté — cada qual com suas tradições jurídicas —, a Borgonha precisava de instituições representativas para governar com eficácia. Os Estados Gerais reuniam os três estamentos de diversas regiões num mesmo quadro deliberativo."
 bur_feast_of_pheasants: "O Banquete do Faisão"
 bur_feast_of_pheasants_desc: "Em 1454, abalado pela queda de Constantinopla, Filipe, o Bom, promoveu o “Banquete do Faisão” em Lille — o mais suntuoso banquete da Idade Média. Cavaleiros fizeram votos de cruzada sobre um faisão vivo; o próprio Filipe comprometeu-se a seguir seu rei à Terra Santa. A cruzada jamais zarpou, mas o banquete consolidou a reputação da Borgonha como guardiã da cavalaria cristã."
 bur_balance_of_power: "Entre Dois Reinos"
 bur_balance_of_power_desc: "O gênio diplomático da Borgonha estava em sua posição como fiel da balança. Vassala da França por direito feudal, ligada ao Império por seus territórios orientais e potencial aliada da Inglaterra — a Borgonha podia inclinar a balança da Guerra dos Cem Anos para qualquer lado. Essa alavanca era a base do poder borgonhês."
 bur_ally_england: "Aliança com a Inglaterra"
 bur_ally_england_desc: "Depois do assassinato de João Sem Medo na ponte de Montereau em 1419, a Borgonha lançou seu peso ao lado da Inglaterra. O resultante Tratado de Troyes (1420) proclamou Henrique V herdeiro da coroa francesa — resultado impensável sem o apoio borgonhês. A aliança borgonhês-inglesa foi uma das parcerias militares decisivas da Guerra dos Cem Anos."
 bur_treaty_of_troyes: "O Tratado de Troyes"
 bur_treaty_of_troyes_desc: "O Tratado de Troyes, apoiado pela Borgonha, fez de Henrique V regente e herdeiro da França. Assegurar Reims (onde se coroavam os reis franceses) e Paris (a capital) faz da Borgonha a governante de fato da França — a justificação final da aliança inglesa."
 bur_ally_france: "Reconciliação com a França"
 bur_ally_france_desc: "No Congresso de Arras de 1435, Filipe, o Bom, mudou de lado — abandonando a Inglaterra e reconciliando-se com Carlos VII. Em troca, a Borgonha recebeu formal isenção de homenagem e cessão de cidades estratégicas. Essa pirueta diplomática fez da Borgonha a vencedora final da Guerra dos Cem Anos."
 bur_treaty_of_arras: "O Espírito de Arras"
 bur_treaty_of_arras_desc: "O Tratado de Arras (1435) foi o maior triunfo diplomático da Borgonha — Carlos VII foi humilhado a um pedido público de desculpas, enquanto Filipe saiu com ganhos territoriais e a homenagem dispensada. Usando essa liberdade, a Borgonha pôde concentrar-se em consolidar a Lotaríngia e completar o Reino do Meio."
 bur_flanders_in_the_war: "Flandres na Guerra dos Cem Anos"
 bur_flanders_in_the_war_desc: "O Condado de Flandres foi um dos territórios mais ferozmente disputados da Guerra dos Cem Anos. A Inglaterra fornecia lã às cidades têxteis flamengas e tinha ali forte influência econômica; as cidades flamengas muitas vezes tomavam o partido da Inglaterra contra a França. Contudo, a França reivindicava o conde de Flandres como vassalo. A Borgonha, dependente da renda do tecido flamengo, devia atrair essa região-chave à sua órbita."
 bur_integrate_brabant: "O Caminho a Bruxelas"
 bur_integrate_brabant_desc: "Antuérpia, capital comercial de Brabante, tornar-se-á a maior cidade comercial da Europa setentrional no fim do século XV. A prensa de Plantin, o comércio de diamantes e a troca de prata espanhola — tudo concentrado aqui. Assegurar Brabante completa o domínio borgonhês sobre os Países Baixos."
 bur_integrate_franche_comte: "Tome Dole"
 bur_integrate_franche_comte_desc: "Dole, capital da Franche-Comté, era lar da Universidade de Dole (fundada em 1422) — apoiada pela casa ducal da Borgonha. Assegurar essa cidade significa controle efetivo sobre toda a Franche-Comté e abre o caminho rumo à Lotaríngia."
 bur_expand_into_lorraine: "Expanda-se rumo à Lorena"
 bur_expand_into_lorraine_desc: "Nancy era a capital do Ducado da Lorena. Carlos, o Temerário, morreu na batalha de Nancy em 1477, obsessivo por essa cidade — aqui o jogador escreve outro desfecho. A tomada de Nancy abre o caminho para Luxemburgo e assegura o corredor borgonhês entre os Países Baixos e o núcleo."
 bur_crown_of_lothair: "A Coroa de Lotário"
 bur_crown_of_lothair_desc: "Em 843, o Tratado de Verdun criou a Lotaríngia — o Reino do Meio, que se estendia de Flandres à Itália ao longo do Reno. Engolido pela França e pela Alemanha no Tratado de Meerssen em 870, esse reino desapareceu da história por mil anos. Agora a casa da Borgonha o reconstrói: não como França, não como Alemanha, mas como algo novo — a ressurreição do centro carolíngio."
 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "A Corte de Dijon"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "A corte borgonhesa de Dijon atraiu Jan van Eyck, Rogier van der Weyden e os melhores músicos e poetas da época — tornando-a capital cultural da Europa setentrional e pioneira da tradição pictórica flamenga, que transformará a arte ocidental."
 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "A Indústria Têxtil Flamenga"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "O triângulo têxtil de Bruges, Gante e Ypres era o motor da maior economia industrial da Europa medieval. Os tecidos flamengos eram padrão de qualidade em toda a Europa, e o controle dessa indústria dava à Borgonha recursos financeiros que rivalizavam com os de qualquer reino."
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "A Ordem do Tosão de Ouro"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "Fundada em 1430, a Ordem do Tosão de Ouro era a mais exclusiva honra da cristandade — sua lista de membros soava como chamada da realeza europeia. A concessão do tosão dava à Borgonha alavanca diplomática sobre reis e imperadores por igual."
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "Os Estados Gerais"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "Os Estados Gerais da Borgonha uniram os três estamentos de Flandres, Brabante e da própria Borgonha numa assembleia deliberativa — modelo inicial de governo representativo, que influenciou a posterior República Holandesa e os corpos revolucionários franceses."
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "O Voto do Faisão"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "No maior banquete da Idade Média, Filipe, o Bom, jurou sobre um faisão vivo conduzir uma cruzada contra os otomanos. O voto jamais foi cumprido, mas o espetáculo proclamou a Borgonha como maior potência cavaleiresca da cristandade e aprofundou seus laços com o papado."
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "Entre Dois Reinos"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "Jogando de fiel da balança entre a Inglaterra e a França, a Borgonha recusa submeter-se por completo a qualquer um dos suseranos e explora a ambiguidade de suas obrigações feudais. O caos da Guerra dos Cem Anos cria uma oportunidade perfeita para construir poder militar independente, mantendo ambos os lados à distância."
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "Aliança Inglesa"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "Depois de Montereau, a Borgonha e a Inglaterra formaram a mais importante aliança militar da Guerra dos Cem Anos. Juntas, tomaram Paris e quase extinguiram a linha dos Valois — só a intervenção de Joana d’Arc inverteu o curso dos acontecimentos."
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "O Tratado de Troyes"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "O Tratado de Troyes, apoiado pela Borgonha, fez de Henrique V herdeiro da França — auge do poder anglo-borgonhês. Apoiando-se nesse triunfo, a Borgonha posiciona-se como verdadeira governante do reino francês."
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "Aliança Francesa"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "O Congresso de Arras (1435) foi obra-prima diplomática da Borgonha — abandonar a Inglaterra no momento de máxima alavanca e arrancar humilhantes concessões do desesperado Carlos VII. A Borgonha emergiu como parceira insubstituível do vencedor francês final."
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "O Tratado de Arras"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "Em Arras, Filipe, o Bom, arrancou formal pedido de desculpas de Carlos VII e obteve território, dispensado da exigência de homenagem pessoal. Isso tornou a Borgonha efetivamente independente, permanecendo nominalmente na ordem feudal francesa — um resultado diplomático perfeito."
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "A Coroa de Lotário"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "Perdido em 870, o Reino da Lotaríngia renasce após mil anos. De Flandres à Franche-Comté, da Lorena à própria Borgonha, a casa da Borgonha reuniu o Reino do Meio que os netos de Carlos Magno não conseguiram manter. A Europa tem um novo centro de gravidade."
 bur_events.1.t: "As Ambições do Ducado da Borgonha"
 bur_events.1.d: "1337: os primeiros tiros da Guerra dos Cem Anos estão prestes a soar. Eduardo III da Inglaterra defende sua reivindicação ao trono francês — mas a Borgonha observa de seu singular ponto de vista entre os dois gigantes. Ramo mais jovem da casa de Valois da França e, no entanto, dona de uma poderosa Flandres, de uma elitista tradição cavaleiresca e de renda que iguala a de qualquer reino — a Borgonha é o ponto de apoio sobre o qual essa guerra girará. Da magnífica corte de Dijon aos animados salões de tecidos de Bruges e Gante, o ducado nutre as maiores ambições entre todas as potências da Europa. A questão é que lado apoiar — ou se apoiar algum."
 bur_events.1.a: "A Borgonha escolherá seu próprio caminho entre a Inglaterra e a França!"
 bur_events.2.t: "O Banquete do Faisão"
 bur_events.2.d: "Em Lille, em 1454, o duque Filipe promoveu o mais extraordinário banquete da Idade Média. Um faisão vivo foi trazido ao salão, adornado com uma coleira de ouro; diante dele, cavaleiros reunidos da Borgonha fizeram votos de cruzada por Deus, pela Virgem e pelo próprio faisão. Filipe comprometeu-se a seguir seu rei à Terra Santa. A maquinaria cênica produziu uma capela, um navio e um castelo sobre as mesas do banquete. Malabaristas, poetas e músicos disputaram a atenção. A cruzada jamais zarpou — mas ninguém na Europa duvidou de que a Borgonha era a maior guardiã das virtudes cavaleirescas da cristandade."
 bur_events.2.a: "Juramos diante de Deus e do Faisão defender a cristandade!"
 bur_events.3.t: "A Coroa de Lotário"
 bur_events.3.d: "Em 843, o Tratado de Verdun dividiu o império de Carlos Magno entre três netos. A parte central — que se estendia de Flandres à Itália ao longo do Reno — coube a Lotário I e tornou-se a “Lotaríngia”. Em 870, o Tratado de Meerssen apagou-a, dividindo-a entre a França e a Alemanha. Por mil anos, o Reino do Meio foi apenas memória — fantasma, que assombrava as fronteiras da França e do Império. Agora a casa da Borgonha, por astúcia e por armas, reconstruiu o que os carolíngios não conseguiram manter. Que a Coroa de Lotário passe a seu legítimo herdeiro."
 bur_council_of_mechelen: "O Grande Conselho de Mechelen"
 bur_council_of_mechelen_desc: "Os conselheiros de Filipe, o Bom, estabeleceram em Mechelen um “Grande Conselho” com jurisdição sobre todos os territórios borgonheses — tribunal supremo, acima das distintas tradições jurídicas de Flandres, Brabante e da Franche-Comté. Foi pedra angular institucional da verdadeira centralização."
 bur_siege_of_calais: "Calais Tomada"
 bur_siege_of_calais_desc: "Calais foi o último ponto de apoio da Inglaterra em solo francês — detida de 1347 a 1558. Os célebres “Burgueses de Calais”, de Rodin, comemoram sua heroica capitulação. A tomada desse porto estratégico dá à Borgonha o controle da travessia do Canal e maximiza o valor da aliança inglesa."
 bur_hainaut_namur: "Herde Hainaut e Namur"
 bur_hainaut_namur_desc: "Filipe, o Bom, comprou Namur em 1421 e herdou Hainaut em 1433 — completando a ponte terrestre entre Flandres e Brabante. Esses condados, com suas cidades têxteis e estratégicas travessias fluviais, formaram o tecido conjuntivo dos Países Baixos borgonheses."
 bur_holland_zeeland: "Holanda e Zelândia"
 bur_holland_zeeland_desc: "Os condados da Holanda e da Zelândia — com suas pescarias de arenque, novas cidades comerciais, como Amsterdã, e excelentes portos — foram tomados por Filipe, o Bom, em 1428. Esses territórios tornar-se-ão o coração da República Holandesa; sob a Borgonha, são o motor do império comercial do Mar do Norte."
 bur_luxemburg: "Luxemburgo"
 bur_luxemburg_desc: "Filipe, o Bom, conquistou o Ducado de Luxemburgo em 1443 após uma campanha contra Sigismundo da linha habsburga. Uma das mais fortes fortalezas do Império, Luxemburgo era a âncora oriental dos Países Baixos borgonheses — e a porta para a Lorena e a Alsácia."
 bur_dominate_rhine: "O Reno"
 bur_dominate_rhine_desc: "O Reno foi a espinha dorsal da civilização europeia de Roma até hoje. Dominar o rio dos Países Baixos à Alsácia é dominar o coração de Carlos Magno — a Renânia, onde se administrava o império carolíngio, onde se erguiam as cidades-catedral, onde se reuniam as maiores rotas comerciais medievais."
 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "O Grande Conselho de Mechelen"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "O Grande Conselho de Mechelen foi a resposta da Borgonha ao problema de governar um Estado composto de tradições jurídicas divergentes. Criando um tribunal supremo acima do direito flamengo, brabantino e borgonhês por igual, os conselheiros de Filipe construíram a base institucional da verdadeira centralização."
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "Porto Livre de Calais"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "Calais, no ponto mais estreito do Canal da Mancha, é desde a Antiguidade um nó-chave de trânsito, que liga o comércio do Mar do Norte, do Báltico e do Mediterrâneo. A Inglaterra a deteve por mais de dois séculos justamente por esse valor comercial. A Borgonha desenvolve agora Calais num principal entreposto do comércio de tecidos da Europa setentrional."
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "Luxemburgo"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "O ducado-fortaleza de Luxemburgo, uma das mais fortes posições do Império, deu à Borgonha sua âncora oriental. Sua conquista em 1443 completou o cerco do vale do Mosa e abriu o caminho à Lorena e à Alsácia."
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "O Reno"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "Do delta aos vinhedos, o Reno é agora borgonhês. O maior rio do coração carolíngio, rota comercial da Europa medieval, fronteira entre a civilização e a floresta — tudo sob uma só bandeira."
 bur_join_hre: "Junte-se ao Sacro Império Romano"
 bur_join_hre_desc: "A Borgonha tem a oportunidade de ser formalmente reconhecida como príncipe do Sacro Império Romano. O duplo status — vassalo da França e príncipe imperial — daria à Borgonha uma posição diplomática excepcionalmente poderosa. Em 1473, Carlos, o Temerário, negociou com Frederico III em Trèves a elevação ao “Reino da Borgonha” dentro do Império — mas o imperador recuou no último momento. Agora a oportunidade volta."
 bur_franchecomte_fiefdom: "Casamento com a Franche-Comté"
 bur_franchecomte_fiefdom_desc: "No século XIII, a casa da Borgonha forjou profundos laços com os condes da Franche-Comté por casamento. O duque Otão IV da Borgonha casou com a condessa Maud de Artois e assegurou a lealdade da Franche-Comté à Borgonha. As minas de sal, o minério de ferro e a Universidade de Dole desse “Condado Livre” fazem dele uma porta vital para a expansão oriental da Borgonha rumo à Suíça e à Lotaríngia."
 bur_events.4.t: "O Sacro Império Romano"
 bur_events.4.d: "A Borgonha sempre ocupou uma posição de fronteira — vassala da França por direito feudal, mas ligada ao Império por seus territórios orientais. O favor do imperador abre o caminho à filiação formal. Em 1473, Carlos, o Temerário, encontrou-se com Frederico III em Trèves e negociou o status de “Reino da Borgonha” dentro do Império — mas o imperador embarcou ao amanhecer em sua barcaça e partiu sem assinatura. Agora, com as relações suficientemente cálidas, a porta está de novo aberta."
 bur_events.4.a: "Juntar-se ao Império e tornar-se príncipe imperial"
 bur_events.4.b: "Preservar nossa independência por ora"
 bur_events.5.t: "Casamento com a Franche-Comté"
 bur_events.5.d: "No século XIII, o duque borgonhês Otão IV casou com a casa condal da Franche-Comté, ligando esse rico “Condado Livre” à Borgonha pelo sangue. As minas de sal do Jura, as forjas de ferro, a Universidade de Dole e as passagens montanhosas, que controlam as rotas para a Suíça e a Lotaríngia — tudo isso foi, por gerações, parte do mundo borgonhês. Chegou a hora de formalizar o que o casamento já criou."
 bur_events.5.a: "Usar o vínculo matrimonial para receber a Franche-Comté como súdita em feudo"
 bur_events.5.b: "Manter o vínculo matrimonial, respeitando sua autonomia"
 bur_events.6.t: "Flandres na Guerra dos Cem Anos"
 bur_events.6.d: "O Condado de Flandres ocupa uma posição singular na Guerra dos Cem Anos. A produção flamenga de tecido não pode funcionar sem lã inglesa, e os ricos cidadãos de Bruges, Gante e Ypres estimam suas relações comerciais inglesas acima de tudo. A França reivindica o conde como vassalo, mas os burgueses flamengos resistem ao domínio francês e repetidamente tomaram o partido da Inglaterra. Atraindo Flandres à órbita borgonhesa, o duque pode aproveitar a riqueza dessas cidades têxteis. A escolha: dar Flandres em feudo como súdita borgonhesa, ou aprofundar os laços, respeitando sua independência."
 bur_events.6.a: "Aceitar Flandres como vassala borgonhesa"
 bur_events.6.b: "Respeitar a independência flamenga, aprofundando a aliança"
 bur_nevers_union: "União com Nevers"
 bur_nevers_union_desc: "O Condado de Nevers fica ao sul de Flandres e tem históricos laços com a casa ducal da Borgonha. Com Flandres firmemente em mãos, estabelecer uma reivindicação a Nevers amplia a esfera de influência da Borgonha para o sul. As terras entre Flandres e Nevers formam um corredor para a futura expansão sobre a França."
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "Países Baixos Unificados"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "A rede comercial dos Países Baixos — que liga a Holanda, a Zelândia, Brabante e Flandres — foi unificada. O poder comercial de Antuérpia e Amsterdã, que forma a base da posterior Era de Ouro Holandesa."
 bur_events.3.a: "Erguer-se como o Reino da Lotaríngia restaurado"
 bur_events.3.b: "Permanecer como Borgonha e reivindicar o título imperial (status quo)"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "Lotaríngia Renascida"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "O Reino da Lotaríngia, sucessor da França Média, renascido seis séculos depois de sua queda em 869. Herdeiro do império de Carlos Magno, esse reino é reconhecido como terceira potência imperial, que se interpõe entre o Sacro Império Romano e o Reino da França."
