l_braz_por:
 hun_crown_of_saint_stephen_mission_pack: "A Coroa de Santo Estêvão"
 hun_crown_of_saint_stephen_mission_pack_DESCRIPTION:0 "Em 1337, o Reino da Hungria é governado pelo rei Carlos I (Carlos Roberto) da dinastia angevina. Seu sucessor, o magnífico Luís — mais tarde conhecido como Luís, o Grande — espera sua hora, com a união pessoal com a Polônia a chegar na próxima geração. Este reino, centrado na Bacia dos Cárpatos, nutre ambições em todas as direções: ao norte, pela Polônia e pela Boêmia; ao sul, rumo aos Bálcãs; a leste, contra os otomanos; e a oeste, rumo ao Adriático. Construa o Exército Negro, traga o Renascimento a Buda e torne-se o Baluarte da cristandade."
 hun_crown_of_saint_stephen_mission_pack_CRITERIA_DESCRIPTION:0 "Como Hungria, expanda-se ao norte pela Polônia e pela Boêmia, assegure os Bálcãs, derrote os otomanos, alcance o Adriático e conclua as reformas internas."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para reconstruir a glória da Coroa de Santo Estêvão."
 hun_crown_of_saint_stephen_mission_pack_BUTTON_DETAILS:0 "Da dinastia angevina à era de Matias Corvino — os maiores dias da Hungria aguardam!"
 hun_crown_of_st_stephen: "A Coroa de Santo Estêvão"
 hun_crown_of_st_stephen_desc: "Santo Estêvão I fundou o Reino da Hungria no ano 1000 d.C., conduzindo a conversão ao cristianismo. A Coroa de Santo Estêvão — a Santa Coroa — permanece até hoje como símbolo sagrado da dignidade real húngara. Em 1337, a dinastia angevina porta essa coroa e governa o maior reino da Europa Central. Assegure Buda e Esztergom e reforce os alicerces do reino."
 hun_angevin_diplomacy: "Diplomacia Angevina"
 hun_angevin_diplomacy_desc: "A dinastia angevina da Hungria tem complexos laços dinásticos com Nápoles, a Polônia e a Boêmia. A mãe de Luís I, Isabel, era irmã do rei polonês Casimiro III, abrindo a perspectiva de herdar a coroa polonesa. Construa uma rede de alianças e eleve a influência diplomática angevina em toda a Europa Central."
 hun_polish_union: "União Pessoal com a Polônia"
 hun_polish_union_desc: "Quando Casimiro III, o Grande, morreu sem herdeiro homem em 1370, seu sobrinho Luís I da Hungria (da casa de Anjou) herdou o trono polonês. Foi o começo da união pessoal húngaro-polonesa. Dois grandes reinos, unidos sob um só rei — o equilíbrio de poder na Europa Central muda por completo."
 hun_bohemian_ambitions: "Ambições sobre a Boêmia"
 hun_bohemian_ambitions_desc: "O Reino da Boêmia, sede da heresia hussita, está dividido por convulsões religiosas. Enquanto angevinos, luxemburgueses e Habsburgo disputam a coroa boêmia, a Hungria também tem uma reivindicação legítima. Tomar Praga cria uma monarquia dupla húngaro-boêmia no coração da Europa Central."
 hun_lord_of_the_north: "Senhor do Norte"
 hun_lord_of_the_north_desc: "Tomar Cracóvia e Gdansk estende o domínio húngaro até o Mar Báltico, criando um vasto império da Europa Central, do Adriático ao Báltico. A glória das dinastias piasta e angevina da Polônia renasce sob a coroa húngara."
 hun_conquer_serbia: "Conquiste a Sérvia"
 hun_conquer_serbia_desc: "O Reino da Sérvia tornou-se vassalo otomano após a batalha do Kosovo (1389). Mas, para a Hungria, Belgrado (Nándorfehérvár) é a chave insubstituível da defesa do Danúbio. Em 1440, a lendária defesa de Belgrado por Escandérbeg e Hunyadi János contra os otomanos — que essa batalha se dê aqui."
 hun_subjugate_wallachia: "Subjugue a Valáquia"
 hun_subjugate_wallachia_desc: "A Valáquia (Havasalföld) historicamente reconheceu a suserania húngara. Vlad II — pai de Vlad, o Empalador — recebeu a Ordem do Dragão do rei húngaro Sigismundo. Estabeleça com firmeza esse Estado-tampão sob influência húngara."
 hun_subjugate_moldavia: "Subjugue a Moldávia"
 hun_subjugate_moldavia_desc: "A Moldávia fica entre o delta do Danúbio e a Polônia, disputada entre Hungria, Polônia e otomanos. Trazer esse principado com firmeza à suserania húngara assegura a fronteira oriental."
 hun_danube_fortress_line: "A Linha de Fortalezas do Danúbio"
 hun_danube_fortress_line_desc: "O sistema végvár — a rede de fortalezas de fronteira da Hungria — foi a mais sofisticada estrutura defensiva antiotomana da Europa do século XV. Dezenas de fortalezas ao longo do Danúbio comunicavam-se entre si, formando uma linha de alerta precoce e defesa que detinha as ofensivas otomanas até a morte. O sistema fez da Hungria o verdadeiro primeiro escudo da cristandade."
 hun_order_of_the_dragon: "A Ordem do Dragão"
 hun_order_of_the_dragon_desc: "A Ordem do Dragão foi uma ordem de cavalaria fundada pelo rei Sigismundo da Hungria em 1408. Vlad II, Escandérbeg e Hunyadi János estavam entre seus membros. Essa ordem uniu a nobreza húngara sob a bandeira da cruzada antiotomana, encarnando a missão de guardiã da cristandade."
 hun_crusade_preparations: "Preparativos para a Cruzada"
 hun_crusade_preparations_desc: "Hunyadi János foi o maior cruzado antiotomano do século XV. Sua Longa Campanha de 1442-43 repeliu os otomanos, dando esperança à cristandade. Mas a batalha de Varna, em 1444, destruiu o exército cruzado polaco-húngaro. Desta vez, entre preparado."
 hun_battle_of_nicopolis: "A Batalha de Nicópolis"
 hun_battle_of_nicopolis_desc: "Em 1396, o exército cruzado sob o rei Sigismundo da Hungria foi esmagado na batalha de Nicópolis — derrota que consolidou o domínio otomano sobre os Bálcãs. Mas desta vez é diferente — uma Hungria plenamente preparada toma Nicópolis e abre a porta à recuperação dos Bálcãs. O nome de Hunyadi ressoa por toda a Europa."
 hun_black_army: "O Exército Negro"
 hun_black_army_desc: "O Exército Negro (Fekete Sereg), criado pelo rei Matias Corvino por volta de 1458, foi a mais avançada força militar profissional da Europa contemporânea — uma combinação de mercenários e tropas permanentes em armaduras negras, que adotou com ousadia as armas de fogo. Apesar do enorme custo de manutenção, esse exército era temido tanto por otomanos quanto por Habsburgo. É a chave da hegemonia húngara."
 hun_bulwark_of_christendom: "Baluarte da Cristandade"
 hun_bulwark_of_christendom_desc: "Por séculos a Hungria lutou na linha de frente da cristandade contra o Império Otomano. Agora, tendo os otomanos sido totalmente expulsos da Europa, o papa, o imperador e os príncipes da Europa cumulam o rei da Hungria da mais alta honra: Antemurale Christianitatis — Baluarte da cristandade."
 hun_croatian_union: "União com a Croácia"
 hun_croatian_union_desc: "Desde o Pacta Conventa de 1102, a Croácia está em união pessoal com a Hungria — os nobres croatas aceitaram o rei húngaro como seu em troca de ampla autonomia. Reforce essa histórica união e assegure a porta da Hungria para o Adriático."
 hun_reclaim_dalmatia: "Recupere a Dalmácia"
 hun_reclaim_dalmatia_desc: "O litoral dálmata fez parte do reino húngaro-croata até que Veneza o comprou em 1409. Recuperar Split e Ragusa (Dubrovnik) restaura o acesso garantido ao Adriático e abre o caminho para a Itália."
 hun_adriatic_supremacy: "Supremacia no Adriático"
 hun_adriatic_supremacy_desc: "Chegou a hora de pôr fim ao antigo monopólio de Veneza sobre o Adriático — a “Noiva do Adriático”. A frota húngaro-croata erguerá sua bandeira sobre o Mar Adriático."
 hun_angevin_naples: "A Reivindicação Angevina a Nápoles"
 hun_angevin_naples_desc: "A dinastia angevina da Hungria reivindica o trono napolitano. Luís I ocupou Nápoles duas vezes, em 1347 e 1350. Chegou a hora de concretizar para sempre a reivindicação angevina — que o rei da Hungria governe Nápoles para sempre."
 hun_strengthen_estates: "Fortaleça os Estamentos"
 hun_strengthen_estates_desc: "A nobreza e o clero húngaros conquistaram amplos privilégios na Bula de Ouro (Aranybulla) de 1222. Apoiando-se nessa tradição de política estamental, obter o apoio da nobreza e do clero reforça a legitimidade real. Mas cuidado — concessões excessivas trarão problemas depois. Mantenha o equilíbrio certo."
 hun_tripartitum: "O Tripartitum"
 hun_tripartitum_desc: "O Tripartitum, redigido por István Werbőczy em 1514, foi uma codificação sistemática do direito consuetudinário húngaro. Definia os privilégios nobres, as obrigações camponesas e o poder real. Esse código tornou-se a base do direito húngaro — embora sua codificação da servidão também tenha contribuído para a revolta camponesa de György Dózsa em 1514."
 hun_matthias_reforms: "As Reformas do Rei Matias"
 hun_matthias_reforms_desc: "O rei Matias Corvino (reinou 1458-90), chamado “o Justo”, foi o maior dos reis húngaros. A tributação centralizada, o Exército Negro profissional e a adoção agressiva da cultura renascentista transformaram a Hungria no Estado mais forte da Europa Central."
 hun_buda_renaissance: "O Renascimento em Buda"
 hun_buda_renaissance_desc: "A corte do rei Matias trouxe o Renascimento italiano à Hungria. A Bibliotheca Corviniana, no palácio de Buda, abrigava milhares de manuscritos latinos e gregos, atraindo eruditos e artistas de toda a Europa. Esse florescimento cultural faz da Hungria o centro cultural da Europa Central."
 hun_great_hungary: "A Grande Hungria"
 hun_great_hungary_desc: "Bálcãs, Polônia, Boêmia, Dalmácia — o Reino da Hungria cresceu como grande império muito além da Bacia dos Cárpatos. O Exército Negro, a corte renascentista de Buda, a linha de fortalezas do Danúbio — tudo isso juntos criou uma Hungria mais poderosa que nunca."
 hun_glory_of_st_stephen: "A Glória da Coroa de Santo Estêvão"
 hun_glory_of_st_stephen_desc: "O Reino de Santo Estêvão, fundado há mil anos, tornou-se um grande império, que domina a Europa Central e os Bálcãs. Do Báltico ao norte ao Adriático e ao Mediterrâneo ao sul, dos Cárpatos ao leste — a Coroa de Santo Estêvão brilha com esplendor inaudito. Aclamado como Baluarte da cristandade, a glória da Hungria alcançou seu absoluto auge."
 hun_events.99.t: "A Glória da Coroa de Santo Estêvão"
 hun_events.99.d: "O reino de Santo Estêvão — outrora confinado à Bacia dos Cárpatos — estende-se agora do Báltico ao Adriático e ao Mediterrâneo. Polônia, Boêmia e Croácia unidas sob a coroa húngara; os otomanos expulsos dos Bálcãs; a reivindicação angevina a Nápoles realizada. A corte renascentista de Buda é celebrada em toda a Europa; o Exército Negro é temido por todo inimigo. A Coroa de Santo Estêvão brilha com o maior esplendor de toda a sua história milenar."
 hun_events.99.a: "Santo Estêvão, cumprimos seu sonho!"
 STATIC_MODIFIER_NAME_hun_angevin_prestige_mod: "Prestígio Angevino"
 STATIC_MODIFIER_DESC_hun_angevin_prestige_mod: "Em 1308, o príncipe angevino Carlos (Carlos Roberto) herdou o trono húngaro. Os laços dinásticos dessa dinastia ligaram a Hungria a Nápoles, à Sicília, à Provença e à Polônia, lançando a Hungria ao centro da diplomacia europeia. A corte papal em Avignon e os Habsburgo em Viena não podiam dar-se ao luxo de ignorar essa corte angevina."
 STATIC_MODIFIER_NAME_hun_angevin_diplomacy_mod: "Rede Diplomática Angevina"
 STATIC_MODIFIER_DESC_hun_angevin_diplomacy_mod: "Cartas das princesas angevinas, casadas de Nápoles à Polônia, chegam sem cessar à corte de Visegrád."
 STATIC_MODIFIER_NAME_hun_bohemian_crown_mod: "A Coroa da Boêmia"
 STATIC_MODIFIER_DESC_hun_bohemian_crown_mod: "Com a coroa boêmia assegurada, forma-se a trimonarquia húngaro-polaco-boêmia."
 STATIC_MODIFIER_NAME_hun_northern_lord_mod: "Senhor do Norte"
 STATIC_MODIFIER_DESC_hun_northern_lord_mod: "Com acesso ao Báltico, a Hungria tornou-se uma grande potência que controla o importante comércio do norte e da Europa Oriental."
 STATIC_MODIFIER_NAME_hun_wallachian_buffer_mod: "Estado-Tampão Valáquio"
 STATIC_MODIFIER_DESC_hun_wallachian_buffer_mod: "A Valáquia atua como Estado-tampão húngaro, assegurando a fronteira oriental."
 STATIC_MODIFIER_NAME_hun_moldavian_buffer_mod: "Estado-Tampão Moldavo"
 STATIC_MODIFIER_DESC_hun_moldavian_buffer_mod: "A Moldávia sob influência húngara dá uma camada dupla de segurança à fronteira oriental."
 STATIC_MODIFIER_NAME_hun_vegvar_system_mod: "O Sistema de Fortalezas Végvár"
 STATIC_MODIFIER_DESC_hun_vegvar_system_mod: "Uma rede organizada de fortalezas ao longo do Danúbio bloqueia sistematicamente os avanços otomanos. A Hungria torna-se o escudo dianteiro da cristandade."
 STATIC_MODIFIER_NAME_hun_dragon_order_mod: "A Ordem do Dragão"
 STATIC_MODIFIER_DESC_hun_dragon_order_mod: "A Ordem do Dragão do rei Sigismundo une a nobreza e o exército numa só causa. Torna-se a espinha dorsal espiritual da cruzada antiotomana."
 STATIC_MODIFIER_NAME_hun_crusade_zeal_mod: "Zelo de Cruzada"
 STATIC_MODIFIER_DESC_hun_crusade_zeal_mod: "O zelo de cruzada, reunido sob as bandeiras de Hunyadi János, ainda arde nos corações dos soldados."
 STATIC_MODIFIER_NAME_hun_black_army_mod: "O Exército Negro"
 STATIC_MODIFIER_DESC_hun_black_army_mod: "O Fekete Sereg — o Exército Negro — criado por Matias Corvino, foi a mais moderna força militar da Europa contemporânea: dezenas de milhares de mercenários e tropas permanentes, em armaduras negras. Construído em torno de um núcleo de cavaleiros hussitas da Boêmia, adotava com ousadia as armas de fogo e infundia medo tanto nos otomanos quanto nos Habsburgo. O custo mortal pesava sobre o tesouro real — mas sem esse exército a Hungria não teria sobrevivido entre tais gigantes."
 STATIC_MODIFIER_NAME_hun_christendom_bulwark_mod: "Baluarte da Cristandade"
 STATIC_MODIFIER_DESC_hun_christendom_bulwark_mod: "Tendo expulsado os otomanos da Europa, a Hungria carrega a honra de Antemurale Christianitatis."
 STATIC_MODIFIER_NAME_hun_adriatic_coast_mod: "Litoral Adriático Assegurado"
 STATIC_MODIFIER_DESC_hun_adriatic_coast_mod: "A recuperação da Dalmácia dá à Hungria acesso direto ao Mar Adriático."
 STATIC_MODIFIER_NAME_hun_angevin_italy_mod: "A Itália Angevina"
 STATIC_MODIFIER_DESC_hun_angevin_italy_mod: "Os angevinos húngaros governam o sul da Itália por meio de Nápoles."
 STATIC_MODIFIER_NAME_hun_golden_bull_mod: "A Tradição da Bula de Ouro"
 STATIC_MODIFIER_DESC_hun_golden_bull_mod: "O sistema estamental, herdeiro do espírito da Bula de Ouro de 1222, sustenta a estabilidade do reino."
 STATIC_MODIFIER_NAME_hun_tripartitum_mod: "O Tripartitum"
 STATIC_MODIFIER_DESC_hun_tripartitum_mod: "O Tripartitum, redigido por István Werbőczy em 1514, foi o ápice do direito consuetudinário húngaro — três partes, que abrangem a “mesma e única liberdade” da nobreza, a servidão do campesinato e o poder real. A sangrenta revolta camponesa de Dózsa foi o seu preço. E, no entanto, esse código permaneceu a base da sociedade húngara por séculos."
 STATIC_MODIFIER_NAME_hun_matthias_admin_mod: "As Reformas do Rei Matias"
 STATIC_MODIFIER_DESC_hun_matthias_admin_mod: "Matias era chamado de “o Justo” (Igazságos Mátyás), pois julgava sem distinção de estamento e protegia os camponeses da opressão dos barões. Construiu uma burocracia centralizada, domou o poder dos magnatas e estendeu a autoridade real diretamente às terras rurais. Seu reinado é lembrado como a mais perfeita expressão da realeza húngara na história."
 STATIC_MODIFIER_NAME_hun_buda_renaissance_mod: "O Renascimento em Buda"
 STATIC_MODIFIER_DESC_hun_buda_renaissance_mod: "A corte de Matias atraiu humanistas, arquitetos, escultores e músicos de toda a Itália. O palácio de Buda foi reconstruído em estilo renascentista — mais esplêndido que Viena — e a Bibliotheca Corviniana abrigava mais de cinco mil manuscritos de textos clássicos gregos e romanos. Quando Matias morreu, um humanista escreveu: “Matias está morto. A justiça morreu”."
 STATIC_MODIFIER_NAME_hun_great_hungary_mod: "A Grande Hungria"
 STATIC_MODIFIER_DESC_hun_great_hungary_mod: "O grande império húngaro, que abarca a Europa Central, os Bálcãs e o Adriático, concluído."
 hun_baltic_trade: "Comércio Báltico"
 hun_baltic_trade_desc: "Gdansk — nó-chave da Liga Hanseática — é a porta entre o Mar do Norte e o Báltico. O controle húngaro desse porto abre acesso ao comércio báltico de âmbar, peles e madeira, garantindo uma rota direta à Europa Ocidental. É o ponto de virada em que a Hungria se transforma de Estado agrário interior em potência comercial marítima."
 hun_hre_influence: "Influência sobre o Sacro Império Romano"
 hun_hre_influence_desc: "Com a Polônia e a Boêmia asseguradas, a Hungria tornou-se a mais poderosa vizinha do Sacro Império Romano. Amplie a influência húngara sobre os príncipes alemães por meio de reputação diplomática e múltiplas alianças, contrapondo-se à hegemonia habsburga."
 hun_challenge_habsburgs: "Desafie os Habsburgo"
 hun_challenge_habsburgs_desc: "A dinastia Habsburgo da Áustria foi a rival perene da Hungria. Tomar Viena transfere a hegemonia do Danúbio à Hungria. A maior ambição húngara — derrubar os Habsburgo e tornar-se imperador do Sacro Império — é aqui realizada."
 hun_conquer_bulgaria: "Conquiste a Bulgária"
 hun_conquer_bulgaria_desc: "O Segundo Império Búlgaro foi destruído pelos otomanos em 1396. Mas com a Hungria agora dominando os Bálcãs, Sófia e Tarnovo podem ser recuperadas — ressuscitando o legado búlgaro sob a coroa húngara."
 hun_conquer_greece: "Conquiste a Grécia"
 hun_conquer_greece_desc: "Atenas e Salonica — duas grandes cidades da antiga civilização grega — caem diante da Hungria. Una os principados gregos divididos após a queda de Bizâncio e estenda o estandarte húngaro até a extremidade meridional dos Bálcãs."
 hun_balkan_empire: "O Império Balcânico"
 hun_balkan_empire_desc: "Sérvia, Bulgária, Grécia, Valáquia, Moldávia — toda a Península Balcânica sob domínio húngaro. A hegemonia que Bizâncio e, depois, os otomanos exerceram sobre os Bálcãs pertence agora plenamente à Hungria."
 hun_push_into_anatolia: "Avance sobre a Anatólia"
 hun_push_into_anatolia_desc: "Com Constantinopla assegurada, a Hungria abarca agora dois continentes. Inicie uma cruzada para recuperar as terras anatólias que Bizâncio perdeu e golpeie o coração do Império Otomano."
 hun_hungarian_crusade: "A Cruzada Húngara"
 hun_hungarian_crusade_desc: "O rei húngaro que libertou Jerusalém torna-se herói de toda a cristandade. O sonho desde Santo Estêvão — o retorno da Terra Santa a mãos cristãs — é enfim realizado. A vitória cruzada com que sonhou Sigismundo, fundador da Ordem do Dragão, está aqui inscrita."
 hun_mediterranean_fleet: "A Frota Mediterrânea"
 hun_mediterranean_fleet_desc: "Com Nápoles e a Sicília asseguradas, a Hungria tornou-se grande potência naval mediterrânea. Uma frota de trinta ou mais navios disputa o controle do Mediterrâneo. O mar, outrora monopolizado por Veneza, pertence agora à Hungria."
 hun_conquer_north_africa: "Conquiste o Norte da África"
 hun_conquer_north_africa_desc: "A tomada de Túnis estende o território húngaro à margem sul do Mediterrâneo. Esmague as bases dos piratas berberes e remova obstáculos ao comércio mediterrâneo. O estandarte húngaro tremula no extremo sul do Mediterrâneo."
 hun_latin_empire: "Restauração do Império Latino"
 hun_latin_empire_desc: "Com Constantinopla, Roma e Nápoles asseguradas, o rei da Hungria pode proclamar-se herdeiro do Império Latino. O sonho da Quarta Cruzada de 1204 realiza-se agora por meio de conquista legítima. Nasce o maior império cristão da história."
 hun_corvinus_library: "Bibliotheca Corviniana"
 hun_corvinus_library_desc: "A Bibliotheca Corviniana do rei Matias foi a maior coleção de manuscritos latinos e gregos da Europa contemporânea — mais de cinco mil códices, guardados no palácio de Buda, que atraíam eruditos e artistas da Itália, da França e da Alemanha. Esse investimento cultural transforma a Hungria no centro cultural da Europa Central."
 hun_hungarian_church: "A Igreja Húngara"
 hun_hungarian_church_desc: "Centrada na arquidiocese de Esztergom, reforce a Igreja Católica húngara e assegure o apoio espiritual. Antes que cheguem as ondas da Reforma, estabeleça com firmeza as relações entre a Igreja Católica e a autoridade real da Hungria."
 hun_economic_powerhouse: "O Danúbio Dourado"
 hun_economic_powerhouse_desc: "A Hungria, que abarca os Bálcãs, o norte e o Adriático, está na encruzilhada de várias grandes rotas comerciais — um gigante econômico. A produção agrícola do Danúbio, as minas de prata da Transilvânia e a renda do comércio mediterrâneo juntam-se para gerar enorme riqueza."
 hun_danube_empire: "O Império Danubiano"
 hun_danube_empire_desc: "Polônia, Boêmia, Bálcãs, Adriático, Mediterrâneo — tudo sob domínio húngaro, com sofisticadas instituições administrativas e uma florescente base econômica. A Hungria tornou-se o “Império Danubiano” com centro no grande rio. O Estado composto multinacional com que outrora sonharam os austro-húngaros, agora realizado sob liderança húngara."
 STATIC_MODIFIER_NAME_hun_baltic_trade_mod: "Comércio Báltico"
 STATIC_MODIFIER_DESC_hun_baltic_trade_mod: "Navios mercantes húngaros, ancorados no porto de Gdansk, voltam carregados de âmbar e peles."
 STATIC_MODIFIER_NAME_hun_habsburg_rival_mod: "Hungria-Áustria"
 STATIC_MODIFIER_DESC_hun_habsburg_rival_mod: "A queda de Viena esmaga o poder dos Habsburgo, fazendo da Hungria senhora do Danúbio."
 STATIC_MODIFIER_NAME_hun_bulgaria_mod: "Domínio Búlgaro"
 STATIC_MODIFIER_DESC_hun_bulgaria_mod: "Novos governadores na colina de Tarnovo difundem a língua e o direito húngaros pelas aldeias dos Bálcãs meridionais."
 STATIC_MODIFIER_NAME_hun_greece_mod: "A Luz da Grécia"
 STATIC_MODIFIER_DESC_hun_greece_mod: "O rei da Hungria, contemplando a Acrópole de Atenas, adota a glória da antiga Grécia como orgulho de sua própria corte."
 STATIC_MODIFIER_NAME_hun_balkan_empire_mod: "O Império Balcânico"
 STATIC_MODIFIER_DESC_hun_balkan_empire_mod: "Do Danúbio ao Peloponeso, o estandarte da Coroa de Santo Estêvão tremula de cada muralha dos Bálcãs."
 STATIC_MODIFIER_NAME_hun_new_crusade_mod: "A Nova Cruzada"
 STATIC_MODIFIER_DESC_hun_new_crusade_mod: "Os soldados que passaram pelos portões de Constantinopla juram levar de novo a cruz ainda mais ao leste."
 STATIC_MODIFIER_NAME_hun_crusade_victory_mod: "Cruzada Concluída"
 STATIC_MODIFIER_DESC_hun_crusade_victory_mod: "A glória da libertação de Jerusalém traz à Hungria prestígio, legitimidade e poder diplomático inéditos."
 STATIC_MODIFIER_NAME_hun_med_fleet_mod: "A Frota Mediterrânea"
 STATIC_MODIFIER_DESC_hun_med_fleet_mod: "Dos portos do Adriático, galés sob o estandarte do rei húngaro saem uma após outra rumo ao Mediterrâneo."
 STATIC_MODIFIER_NAME_hun_north_africa_mod: "Base Norte-Africana"
 STATIC_MODIFIER_DESC_hun_north_africa_mod: "Ao longo da costa do norte da África, mercadores húngaros e esquadras caçadoras de corsários passam sem cessar de porto em porto."
 STATIC_MODIFIER_NAME_hun_latin_empire_mod: "Restauração do Império Latino"
 STATIC_MODIFIER_DESC_hun_latin_empire_mod: "O nome do rei que detém Constantinopla, Roma e Nápoles é pronunciado com temor em todas as cortes."
 STATIC_MODIFIER_NAME_hun_corvinus_library_mod: "Bibliotheca Corviniana"
 STATIC_MODIFIER_DESC_hun_corvinus_library_mod: "No scriptorium da Biblioteca Corviniana, os escribas copiam manuscritos à luz de lamparina, dia e noite."
 STATIC_MODIFIER_NAME_hun_church_mod: "A Igreja Húngara"
 STATIC_MODIFIER_DESC_hun_church_mod: "Uma forte Igreja húngara traz legitimidade, eficiência legislativa e estabilidade religiosa."
 STATIC_MODIFIER_NAME_hun_economy_mod: "O Danúbio Dourado"
 STATIC_MODIFIER_DESC_hun_economy_mod: "As barcaças que sobem o Danúbio e as carroças das minas mantêm os mercados do reino sempre animados."
 STATIC_MODIFIER_NAME_hun_danube_empire_mod: "O Império Danubiano"
 STATIC_MODIFIER_DESC_hun_danube_empire_mod: "O Império Danubiano multinacional, centrado no grande rio, concluído. Impostos, população, administração e eficiência legislativa alcançam seu auge."
 hun_transylvanian_mines: "As Cidades Mineiras da Alta Hungria"
 hun_transylvanian_mines_desc: "Kremnica (Körmöcbánya) contém a maior casa da moeda de ouro da Hungria. Banská Bystrica (Besztercebánya) é famosa pelas maiores minas de cobre da Europa Central. Assegurar essas duas cidades faz da Hungria o primeiro Estado mineiro da Europa Central. Matias Corvino reorganizou essa região com posse imperial em 1467-68, usando a renda mineira para financiar o Exército Negro."
 hun_silver_mines: "As Minas de Prata de Banská Štiavnica"
 hun_silver_mines_desc: "A região de Hont (que inclui Banská Štiavnica) é o maior distrito de mineração de prata da Alta Hungria. A prata dessa terra era cunhada em táleres na casa da moeda real, sustentando o comércio por toda a Europa Central. As “cidades mineiras da Alta Hungria” são o coração econômico do reino."
 hun_salt_mines: "As Minas de Sal da Transilvânia"
 hun_salt_mines_desc: "Sighet (Máramarossziget) e Turda extraem sal-gema desde a Antiguidade. O sal já foi chamado de “ouro branco” — mercadoria tão vital que o monopólio real do sal da Hungria era um pilar crítico das finanças da coroa. Assegure essas minas de sal e estabeleça o monopólio do comércio de sal."
 hun_tokaj_wine: "Os Vinhos de Tokaj"
 hun_tokaj_wine_desc: "A região de Tokaj, em torno de Sátoraljaújhely, produz o Tokaji Aszú — “Vinho dos reis, rei dos vinhos”. Tão celebrado que o papa Bento XIV o presenteou a Luís XV da França, esse vinho de podridão nobre das colinas húngaras é o mais famoso da Europa. Desenvolva os vinhedos e exporte o melhor vinho da Europa."
 hun_mining_empire: "O Império Mineiro"
 hun_mining_empire_desc: "O ouro de Kremnica, a prata de Hont, o cobre de Banská Bystrica e o sal de Sighet e Turda — toda a riqueza mineral da Hungria está agora assegurada. Como primeiro Estado mineiro da Europa Central, a Hungria obtém enorme renda da exportação de metais. Essa riqueza financiou o Exército Negro de Matias e a glória de sua corte renascentista."
 hun_buda_capital: "Desenvolva Buda e Peste"
 hun_buda_capital_desc: "Buda e Peste, que se defrontam pelo Danúbio, são o coração do Reino da Hungria. O palácio real e o grande mercado de Buda, o porto comercial de Peste — quando essa cidade dupla prospera, toda a Hungria floresce. A corte de Matias era a maior da Europa e celebrada como centro do Renascimento da Europa Central."
 hun_upper_hungary_cities: "As Cidades da Alta Hungria"
 hun_upper_hungary_cities_desc: "Bratislava (Pozsony) guarda os portões ocidentais contra os Habsburgo; Košice (Kassa) é a maior cidade comercial da Alta Hungria; Trnava (Nagyszombat) é sede episcopal. O desenvolvimento dessas três cidades faz da Alta Hungria (a atual Eslováquia) o eixo econômico e político do norte."
 hun_pannonian_cities: "As Cidades da Panônia"
 hun_pannonian_cities_desc: "Győr (Rába) guarda a fronteira austríaca; Sopron (Ödenburg) é uma rica cidade comercial da Hungria ocidental; Pécs (Fünfkirchen) abriga uma das mais antigas universidades da Europa Central, fundada por Luís I em 1367. Desenvolva essas cidades panônias para que a Hungria ocidental prospere."
 hun_great_plain_cities: "As Cidades da Grande Planície"
 hun_great_plain_cities_desc: "Debrecen (centro do calvinismo húngaro), Szeged (chave do rio Tisza), Kecskemét (cidade pastoril da Grande Planície) — desenvolva as principais cidades da púszta húngara e abra o potencial agrícola dessa vasta estepe. O gado, as ovelhas e os grãos da Grande Planície tornar-se-ão a principal exportação da Hungria."
 hun_transylvania_cities: "As Cidades da Transilvânia"
 hun_transylvania_cities_desc: "Cluj (Kolozsvár) é o coração político e cultural da Transilvânia; Oradea (Nagyvárad) é grande cidade de peregrinação, que guarda as relíquias de São Ladislau; Miskolc é centro industrial do nordeste da Hungria. Integre a região multiétnica da Transilvânia por meio do desenvolvimento urbano."
 hun_kingdom_of_cities: "O Reino das Cidades"
 hun_kingdom_of_cities_desc: "O ouro de Kremnica, a prata de Hont, o vinho de Tokaj, a corte de Buda, o comércio de Košice, a universidade de Pécs, a agricultura de Debrecen, a cultura de Cluj — cada cidade do Reino da Hungria opera em harmonia orgânica. A maior zona econômica da Europa Central concluída. A prosperidade urbana é a verdadeira fonte do poder imperial húngaro."
 STATIC_MODIFIER_NAME_hun_kremnica_mint_mod: "A Casa da Moeda Real de Kremnica"
 STATIC_MODIFIER_DESC_hun_kremnica_mint_mod: "A casa da moeda de Kremnica foi fundada por Carlos I da Hungria em 1328, em Körmöcbánya. O “florim” de ouro (forint) cunhado aqui era considerado de qualidade igual ao florim florentino — e circulava do Báltico a Constantinopla. Os cuidadosos padrões da casa da moeda fizeram dela a espinha dorsal monetária do comércio da Europa Central."
 STATIC_MODIFIER_NAME_hun_banska_copper_mod: "As Minas de Cobre de Banská Bystrica"
 STATIC_MODIFIER_DESC_hun_banska_copper_mod: "Nos poços de Banská Bystrica, o som dos martelos que cortam o cobre não cessa."
 STATIC_MODIFIER_NAME_hun_hont_silver_mod: "As Minas de Prata de Banská Štiavnica"
 STATIC_MODIFIER_DESC_hun_hont_silver_mod: "A prata extraída das minas de Hont é levada à casa da moeda real."
 STATIC_MODIFIER_NAME_hun_salt_mine_mod: "A Mina de Sal-Gema"
 STATIC_MODIFIER_DESC_hun_salt_mine_mod: "As galerias de sal-gema, escavadas desde os tempos romanos, ainda abastecem as mesas do reino."
 STATIC_MODIFIER_NAME_hun_tokaj_wine_mod: "Os Vinhedos do Tokaji Aszú"
 STATIC_MODIFIER_DESC_hun_tokaj_wine_mod: "As uvas de podridão nobre, maduras nas colinas de Tokaj, viajam às cortes de muitas terras como “vinho dos reis”."
 STATIC_MODIFIER_NAME_hun_buda_capital_mod: "Capital Real Buda"
 STATIC_MODIFIER_DESC_hun_buda_capital_mod: "Das janelas do palácio real de Buda, que contempla o Danúbio, as velas dos mercantes que passam são sempre visíveis."
 STATIC_MODIFIER_NAME_hun_pest_trade_mod: "Porto Comercial de Peste"
 STATIC_MODIFIER_DESC_hun_pest_trade_mod: "Nos cais de Peste, os gritos dos carregadores ecoam da manhã à noite."
 STATIC_MODIFIER_NAME_hun_bratislava_gateway_mod: "Pozsony — Cidade-Porta"
 STATIC_MODIFIER_DESC_hun_bratislava_gateway_mod: "Os portões de Pozsony tornaram-se a encruzilhada onde carroças rumo à Áustria e mensageiros reais se cruzam."
 STATIC_MODIFIER_NAME_hun_kosice_commerce_mod: "Kassa — Centro Comercial"
 STATIC_MODIFIER_DESC_hun_kosice_commerce_mod: "No mercado de Kassa, mercadores da Polônia e da Silésia disputam as mercadorias da Alta Hungria."
 STATIC_MODIFIER_NAME_hun_pecs_university_mod: "A Universidade de Pécs"
 STATIC_MODIFIER_DESC_hun_pecs_university_mod: "Nas celas da universidade de Pécs, os estudantes, que continuam o legado de Luís I, escutam aulas em latim."
 STATIC_MODIFIER_NAME_hun_gyor_fortress_mod: "A Fortaleza de Győr"
 STATIC_MODIFIER_DESC_hun_gyor_fortress_mod: "Nas muralhas de Győr, as sentinelas, que vigiam a fronteira austríaca, mantêm as tochas altas a noite inteira."
 STATIC_MODIFIER_NAME_hun_debrecen_agri_mod: "Cidade Agrícola de Debrecen"
 STATIC_MODIFIER_DESC_hun_debrecen_agri_mod: "Rebanhos de gado e carregamentos de trigo, criados na Grande Planície, fluem sem cessar ao mercado de Debrecen."
 STATIC_MODIFIER_NAME_hun_szeged_trade_mod: "Porto Comercial de Szeged"
 STATIC_MODIFIER_DESC_hun_szeged_trade_mod: "Szeged, na confluência do Tisza e do Danúbio, desenvolvida como nó do comércio interno."
 STATIC_MODIFIER_NAME_hun_cluj_center_mod: "Cluj — Coração da Transilvânia"
 STATIC_MODIFIER_DESC_hun_cluj_center_mod: "Nos mercados e escolas de Cluj, as vozes de alemães, húngaros e romenos se misturam."
 STATIC_MODIFIER_NAME_hun_oradea_pilgrimage_mod: "Nagyvárad — Cidade de Peregrinação"
 STATIC_MODIFIER_DESC_hun_oradea_pilgrimage_mod: "Multidões de peregrinos de todo o reino dirigem-se à catedral de Nagyvárad, lar das relíquias do rei São Ladislau."
 STATIC_MODIFIER_NAME_hun_mining_empire_mod: "O Império Mineiro"
 STATIC_MODIFIER_DESC_hun_mining_empire_mod: "Ouro, prata, cobre, sal — a riqueza extraída das minas do reino supera agora qualquer outra terra da Europa Central."
 STATIC_MODIFIER_NAME_hun_kingdom_of_cities_mod: "O Reino das Cidades"
 STATIC_MODIFIER_DESC_hun_kingdom_of_cities_mod: "De Buda a Cluj, os mercados das cidades do reino trocam mercadorias uns com os outros e respiram como uma só grande esfera econômica."
 hun_secure_transylvania: "Domínio da Transilvânia"
 hun_secure_transylvania_desc: "A Transilvânia — há muito território-núcleo húngaro — está centrada em duas grandes cidades: Cluj e Brașov. Húngaros, saxões e valacos (romenos) coexistem nessa terra. Com recursos tesoureiros suficientes, invista no desenvolvimento sério da Transilvânia e eleve uma de suas duas grandes cidades ao pleno status urbano."
 hun_events.20.t: "Domínio da Transilvânia"
 hun_events.20.d: "Com Cluj e Brașov assegurados e mais de 1000 ducados investidos, começa um sério programa de desenvolvimento da Transilvânia. Cluj (em latim Claudiopolis; em romeno Cluj) é a maior cidade da Transilvânia; Brașov (em latim Corona; em alemão Kronstadt), construída por colonos saxões, é a porta comercial para a Valáquia. Qual cidade terá prioridade de desenvolvimento — essa decisão molda o rumo futuro da Transilvânia."
 hun_events.30.t: "O Pacta Conventa — Tratado Histórico com a Croácia"
 hun_events.30.d: "Em 1102, o rei Colomano da Hungria celebrou o Pacta Conventa com representantes de doze famílias nobres croatas. A nobreza croata aceitou o rei húngaro como seu soberano; em troca, a Croácia manteve sua autonomia e suas tradições jurídicas. Mais de dois séculos depois desse tratado histórico, chegou a hora de esclarecer as relações entre a Hungria e a Croácia. A Croácia deve ser formalmente incorporada como feudo, para esclarecer seu status jurídico? Ou o arranjo flexível atual deve ser mantido? A escolha cabe ao rei da Hungria."
 hun_events.30.a: "Incorporar formalmente a Croácia como feudo"
 hun_events.30.b: "Manter as relações atuais (+10 de prestígio)"
 hun_events.20.a: "Elevar Cluj a cidade (custa 1000 ducados)"
 hun_events.20.b: "Elevar Brașov a cidade (custa 1000 ducados)"
 STATIC_MODIFIER_NAME_hun_eternal_crown_mod: "A Eterna Coroa de Santo Estêvão"
 STATIC_MODIFIER_DESC_hun_eternal_crown_mod: "No Natal do ano 1000, o papa Silvestre II enviou uma coroa a István, príncipe dos húngaros, tornando-o Estêvão I — primeiro rei da Hungria. Essa coroa — a Santa Coroa de Santo Estêvão — passou a ser vista como a própria essência do Estado húngaro: um rei sem ela não era de modo algum rei da Hungria. Agora, passados séculos, diplomatas de todos os cantos do mundo fazem peregrinação à corte da Hungria para reconhecer sua suserania."
