l_braz_por:
 por_portuguese_mission_pack: "A Era dos Descobrimentos — O Poder Marítimo de Portugal"
 por_portuguese_mission_pack_DESCRIPTION:0 "Em 1337, Portugal é um pequeno reino no extremo ocidental da Península Ibérica. Mas as expedições organizadas pelo infante Dom Henrique, o Navegador (1394-1460), mudarão o mundo — Madeira, Açores, África Ocidental, Cabo da Boa Esperança, Índia, Malaca, Brasil. Do Atlântico ao Oceano Índico, erga o “Estado da Índia”, onde os navegantes portugueses governam os mares."
 por_portuguese_mission_pack_CRITERIA_DESCRIPTION:0 "Desenvolva a metrópole, contorne a África para alcançar o Oceano Índico, colonize o Brasil e governe como senhor dos mares."
 por_portuguese_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para realizar o império da era dos descobrimentos de Portugal."
 por_portuguese_mission_pack_BUTTON_DETAILS:0 "Do infante Dom Henrique ao Portugal de Filipe II!"
 por_infante_henrique: "A Tradição Marítima de Portugal"
 por_infante_henrique_desc: "Em 1337, Portugal é um pequeno reino no extremo ocidental da Península Ibérica. Sob Afonso IV, Portugal apoiou Castela na batalha do Salado (1340) e repeliu os merínidas como potência marítima. Esse reino, voltado para o Atlântico, nutre há muito afinidade com o mar. O porto de Lisboa, os pescadores do Algarve, os ventos atlânticos — essa tradição marítima é a base que gerará a próxima geração da era dos descobrimentos."
 por_dev_lisbon: "Desenvolva Lisboa"
 por_dev_lisbon_desc: "Lisboa, na foz do Tejo, é dotada de um porto natural. O desenvolvimento dessa cidade, fundada pelos antigos fenícios, como capital do império português a faz centro do comércio mundial."
 por_dev_porto: "Desenvolva o Porto"
 por_dev_porto_desc: "O Porto, no Douro, é a cidade do vinho e da pesca. Desenvolva essa antiga cidade, que emprestará seu nome às gerações vindouras para “Portugal (porto do Porto)”."
 por_university_coimbra: "A Universidade de Coimbra"
 por_university_coimbra_desc: "A Universidade de Coimbra, fundada em 1290 — a mais antiga de Portugal — forma navegantes, juristas e clérigos. Muitos eruditos que serviram ao infante Dom Henrique estudaram aqui."
 por_lisbon_entrepot_nmt: "Lisboa como Entreposto Comercial"
 por_lisbon_entrepot_nmt_desc: "Desenvolva a gestão portuária de Lisboa para que as mercadorias orientais sejam daqui distribuídas por toda a Europa. Pimenta, especiarias, seda — Lisboa torna-se o maior mercado de especiarias da Europa."
 por_avis_dynasty: "Consolide a Casa de Avis"
 por_avis_dynasty_desc: "A casa de Avis, que sobreviveu à crise dinástica de 1385 — a vitória de João I estabeleceu a dinastia portuguesa com uma base estável de governo."
 por_ordenacoes_afonsinas: "As Ordenações Afonsinas"
 por_ordenacoes_afonsinas_desc: "As Ordenações Afonsinas, compiladas em 1446, são o primeiro código sistemático de leis de Portugal. Servindo de modelo aos posteriores códigos manuelinos e filipinos, estabelecem a tradição jurídica de Portugal."
 por_dev_evora: "Desenvolva Évora"
 por_dev_evora_desc: "Évora, capital da região do Alentejo — desenvolva essa antiga cidade, que preserva templos romanos, como centro agrícola e cultural."
 por_algarve_fisheries: "Pescarias do Algarve"
 por_algarve_fisheries_desc: "A região do Algarve, no sul de Portugal, é vizinha de pesqueiros atlânticos. As ricas pescarias de bacalhau, sardinha e atum alimentam a afinidade portuguesa com o mar, que se tornará a base da era dos descobrimentos."
 por_ceuta_gateway: "Ceuta — Porta da África"
 por_ceuta_gateway_desc: "Em 1415, as tropas de João I conquistaram Ceuta — começo da expansão ultramarina de Portugal. Aqui o infante Dom Henrique recebeu de mercadores muçulmanos informações sobre as rotas do Saara, o que alimentou sua ambição de navegar para o sul ao longo da África."
 por_conquer_tangier: "Conquiste Tânger"
 por_conquer_tangier_desc: "Tânger, situada em frente a Ceuta através do Estreito de Gibraltar — aumente a pressão sobre as forças muçulmanas do norte da África e assegure a saída atlântica."
 por_moroccan_fortress: "Fortalezas Marroquinas"
 por_moroccan_fortress_desc: "Pelo domínio das cidades comerciais marroquinas, incluindo Agadir, domine o ponto final do comércio transaariano e monopolize os lucros do ouro, do marfim e do sal."
 por_madeira_settlement: "Povoamento da Madeira"
 por_madeira_settlement_desc: "A Madeira, alcançada pelos portugueses em 1419, é a primeira colônia atlântica. A introdução do açúcar nessa ilha desabitada estabeleceu o modelo de plantações açucareiras que mais tarde seria usado no Brasil e nas Índias Ocidentais."
 por_azores_settlement: "Povoamento dos Açores"
 por_azores_settlement_desc: "A colonização dos Açores, no meio do Atlântico, assegura uma estação intermediária nas rotas transatlânticas. Usando-a como base, permite-se prosseguir na exploração rumo ao oeste."
 por_guinea_trade: "Comércio com a Guiné"
 por_guinea_trade_desc: "O Golfo da Guiné, alcançado pelos portugueses durante sua navegação para o sul ao longo da costa da África Ocidental — começa o comércio de ouro, marfim e, mais tarde, escravos. O sonho do infante Dom Henrique torna-se realidade."
 por_gold_coast: "A Costa do Ouro"
 por_gold_coast_desc: "Elmina (1482) — a primeira fortaleza comercial permanente que Portugal ergueu na África. Enormes quantidades de ouro fluem dessa “Costa do Ouro” para Portugal."
 por_sao_tome_sugar: "O Açúcar de São Tomé"
 por_sao_tome_sugar_desc: "A ilha de São Tomé, perto do equador, é ideal para plantações de açúcar. Com trabalho forçado do continente africano, São Tomé torna-se o maior fornecedor de açúcar à Europa."
 por_angola_colony: "A Colônia de Angola"
 por_angola_colony_desc: "Angola, outra cabeça de ponte após São Tomé, torna-se importante colônia portuguesa. Estabeleça relações comerciais com o Reino do Congo e amplie a influência na África centro-ocidental."
 por_cape_of_good_hope: "O Cabo da Boa Esperança"
 por_cape_of_good_hope_desc: "Em 1488, Bartolomeu Dias alcançou a extremidade sul da África, o “Cabo das Tormentas”. João II rebatizou-o “Cabo da Boa Esperança” — pois o caminho para as Índias estava agora aberto."
 por_east_africa_trading_posts: "Postos Comerciais da África Oriental"
 por_east_africa_trading_posts_desc: "Moçambique, Sofala — a tomada dos postos do comércio de ouro e marfim da costa suaíli alcança a entrada na rede comercial do Oceano Índico."
 por_mombasa_fort: "O Forte de Mombaça"
 por_mombasa_fort_desc: "Mombaça e Melinde — a subjugação das maiores cidades comerciais da África Oriental estabelece o controle sobre o Oceano Índico. Em 1498, Vasco da Gama recebeu em Melinde indicações de navegação para a Índia."
 por_vasco_da_gama: "Vasco da Gama Chega à Índia"
 por_vasco_da_gama_desc: "Em 20 de maio de 1498, Vasco da Gama desembarcou em Calecute (Kozhikode). Nesse momento abriu-se a rota marítima entre a Europa e a Ásia, e a estrutura do comércio de especiarias, monopolizado por mercadores árabes e Veneza, mudou radicalmente."
 por_conquer_goa: "Conquiste Goa"
 por_conquer_goa_desc: "Em 1510, Albuquerque conquistou Goa — nascimento da “capital oriental” de Portugal. O porto natural de Goa, na costa ocidental da Índia, prospera como centro do Estado da Índia (Índia Portuguesa)."
 por_malabar_trade: "As Especiarias da Costa do Malabar"
 por_malabar_trade_desc: "Cochim, Calecute, Quilon — a Costa do Malabar produz pimenta, cardamomo e gengibre. Monopolizando aqui as especiarias, Portugal domina os preços europeus das especiarias."
 por_hormuz_control: "Domine Ormuz"
 por_hormuz_control_desc: "Em 1515, Albuquerque conquistou Ormuz, na entrada do Golfo Pérsico. Dominar esse ponto significa dominar o comércio persa-indiano e cortar o comércio do mundo islâmico."
 por_conquer_malacca: "Conquiste Malaca"
 por_conquer_malacca_desc: "Em julho de 1511, Afonso de Albuquerque, com 1200 soldados portugueses, conquistou Malaca — a maior vitória estratégica da era dos descobrimentos. O domínio sobre o “pescoço do comércio oriental” conquista todas as rotas comerciais de especiarias, seda e porcelana."
 por_spice_monopoly: "O Monopólio das Especiarias"
 por_spice_monopoly_desc: "Com Goa, Ormuz e Malaca asseguradas, as rotas comerciais de especiarias do Oceano Índico estão inteiramente sob controle português. Pimenta, noz-moscada e cravo são levados por Lisboa à Europa."
 por_indian_ocean_empire: "O Império do Oceano Índico"
 por_indian_ocean_empire_desc: "Da África Oriental a Malaca, a frota portuguesa domina o Oceano Índico. A Casa da Índia, em Lisboa, administra todo o comércio de especiarias, e enorme riqueza flui para Portugal."
 por_brazil_discovery: "A Descoberta do Brasil"
 por_brazil_discovery_desc: "Em 22 de abril de 1500 — a caminho da Índia com uma frota de 13 navios, Pedro Álvares Cabral desviou-se muito para o oeste para evitar uma tempestade e descobriu uma terra desconhecida. “Ilha de Vera Cruz” — mais tarde chamada “Brasil” (da árvore pau-brasil). Pelo Tratado de Tordesilhas, essa terra passa a ser território português e tornar-se-á mais tarde a maior colônia de Portugal."
 por_brazil_colony: "Colonize o Brasil"
 por_brazil_colony_desc: "Em 1532, Martim Afonso de Sousa fundou a primeira colônia permanente do Brasil, “São Vicente”. Nasce uma nova sociedade, em que se misturam colonos portugueses e povos nativos."
 por_brazil_sugar: "A Indústria Açucareira do Brasil"
 por_brazil_sugar_desc: "Em meados do século XVI, o Brasil tornou-se o maior fornecedor de açúcar à Europa. Os engenhos (moinhos de açúcar) de Pernambuco e da Bahia operam com trabalho forçado da África, produzindo enorme riqueza."
 por_brazil_empire: "O Império Brasileiro"
 por_brazil_empire_desc: "Bahia, Pernambuco, Rio de Janeiro — as colônias do Brasil cresceram até a escala imperial. Açúcar, pau-brasil e, mais tarde, ouro e gemas criam correntes de riqueza para Portugal."
 por_naval_supremacy: "Supremacia Naval"
 por_naval_supremacy_desc: "A frota portuguesa, que domina tanto o Atlântico quanto o Oceano Índico — a manobrabilidade da caravela e o poder de fogo dos canhões superam os navios mercantes árabes, indianos e chineses."
 por_caravel: "A Caravela"
 por_caravel_desc: "A caravela, desenvolvida na era do infante Dom Henrique — é um navio pequeno e rápido, de velas latinas, capaz de navegar contra o vento, tornou possível a era dos descobrimentos. A Santa Maria também era uma caravela."
 por_padroes: "Os Padrões (Colunas de Pedra)"
 por_padroes_desc: "Os exploradores portugueses erguiam em vários lugares da África colunas de pedra (padrões), que levavam o nome do rei português e a cruz cristã. Era uma declaração de descoberta e domínio — o alcance de Portugal, gravado em pedra."
 por_royal_navy: "A Armada Real"
 por_royal_navy_desc: "A mais forte frota do mundo sustenta a supremacia portuguesa — galeões, naus e caravelas protegem tudo, do Oceano Índico ao Brasil."
 por_dev_setubal: "Desenvolva Setúbal"
 por_dev_setubal_desc: "A baía de Setúbal, ao sul de Lisboa, é um porto natural. Desenvolva-a como cidade portuária que complementa Lisboa e produz sal, peixe e vinho."
 por_order_of_christ: "A Ordem de Cristo"
 por_order_of_christ_desc: "A Ordem de Cristo (Ordem de Cristo), fundada em 1319 — essa ordem militar, estabelecida em Portugal como herdeira dos templários, financiou as expedições de Dom Henrique. A cruz escarlate da ordem estava gravada nas velas portuguesas."
 por_treaty_tordesillas: "O Tratado de Tordesilhas"
 por_treaty_tordesillas_desc: "Em 1494, Espanha e Portugal, por mediação do papa Alexandre VI, firmaram o Tratado de Tordesilhas — dividindo o Atlântico verticalmente, o oeste para a Espanha, o leste para Portugal. Esse tratado confirmou o Brasil como território português."
 por_colonial_administration: "Administração Colonial"
 por_colonial_administration_desc: "O aparato administrativo para dirigir o império de Portugal, que abarca a África, a Índia e o Brasil — governadores e vice-reis reportam ao rei em Lisboa e enviam a renda comercial à metrópole."
 por_estado_da_india_nmt: "O Estado da Índia"
 por_estado_da_india_nmt_desc: "“Estado da Índia” — termo que se refere a todo o império asiático de Portugal. Com Goa como capital e o domínio das rotas comerciais marítimas da África Oriental a Malaca, esse “império” é o primeiro império marítimo verdadeiramente global da história."
 por_dev_tomar: "Desenvolva Tomar"
 por_dev_tomar_desc: "Tomar, residência principal da Ordem de Cristo — o Convento de Cristo é considerado o melhor exemplo da arquitetura manuelina portuguesa. Desenvolva-a com os meios da ordem."
 por_wine_trade: "O Comércio de Vinho Português"
 por_wine_trade_desc: "Os vinhos do vale do Douro — protótipo do “vinho do Porto” — importante mercadoria de exportação para a Inglaterra e Flandres. Estabeleça relações comerciais anglo-portuguesas, antecipando-se ao Tratado de Methuen (1703)."
 por_dev_faro: "Desenvolva Faro"
 por_dev_faro_desc: "Faro, capital da região do Algarve — incorporada a Portugal pela Reconquista cristã em 1249, desenvolva essa cidade meridional como nó de pesca e comércio."
 por_cape_verde: "As Ilhas de Cabo Verde"
 por_cape_verde_desc: "As Ilhas de Cabo Verde, descobertas em 1456, ocupam posição estratégica a meio caminho entre a África e a América. Como ponto de transbordo do comércio transatlântico, tornar-se-ão base de abastecimento para a posterior colonização do Brasil."
 por_lisbon_megalopolis: "Lisboa — Cidade Mundial"
 por_lisbon_megalopolis_desc: "No século XVI, Lisboa tornou-se uma das maiores cidades da Europa, com população superior a 100000. Especiarias orientais, ouro africano e açúcar brasileiro convergem aqui, valendo-lhe o apelido de “capital do mundo”."
 por_casa_india: "A Casa da Índia"
 por_casa_india_desc: "A Casa da Índia, fundada em Lisboa, administra o comércio oriental de Portugal exclusivamente como instituição estatal. Toda a importação de especiarias passa por aqui, gerando enormes receitas aduaneiras."
 por_brazil_wood: "Pau-Brasil"
 por_brazil_wood_desc: "O pau-brasil, de que o Brasil tirou seu nome — essa madeira tintorial vermelha é exportada em enormes quantidades, mercadoria insubstituível da indústria tintureira de lã europeia. É o primeiro produto do comércio brasileiro."
 por_atlantic_domination: "Domínio do Atlântico"
 por_atlantic_domination_desc: "De Lisboa aos Açores, à Madeira, a Cabo Verde e ao Brasil — Portugal domina todo o Atlântico. Tendo superado a rivalidade com a Espanha, Portugal governa o principal ator do comércio atlântico."
 por_empire_of_seas: "Senhor dos Mares"
 por_empire_of_seas_desc: "“Portugal — pequeno país, mas governa metade do mundo” — as palavras do historiador cumprem-se. Do Atlântico ao Oceano Índico, do Brasil a Malaca, o império de Portugal domina os mares do mundo. O Estado da Índia concluído."
 por_events.10.t: "Cabo da Boa Esperança — A Rota das Índias se Abre"
 por_events.10.d: "Em 1488, a frota de Bartolomeu Dias contornou o “Cabo das Tormentas” meridional da África e alcançou o Oceano Índico. João II estremeceu com a notícia — quinze anos depois, Vasco da Gama abrirá a rota direta para as Índias. A era em que mercadores árabes monopolizavam o comércio de especiarias aproxima-se do fim."
 por_events.10.a: "Glória a Deus e a Portugal! A rota das Índias aberta!"
 por_events.20.t: "Vasco da Gama Chega à Índia"
 por_events.20.d: "Em 20 de maio de 1498 — dez meses depois de zarpar de Lisboa com quatro navios, Vasco da Gama desembarcou em Calecute. O governante local (o samorim) era desconfiado, mas Portugal assegurou a entrada no comércio de especiarias. Enquanto os mercadores árabes fervilhavam de ira, começou a era do comércio oriental de Portugal."
 por_events.20.a: "Pimenta e especiarias — Portugal conquistou a riqueza da Índia!"
 por_events.30.t: "Conquista de Malaca — A Tomada do Pescoço do Comércio de Especiarias"
 por_events.30.d: "Em julho de 1511, Afonso de Albuquerque, com 1200 forças portuguesas, conquistou Malaca. “O lugar mais importante do Oriente” — o domínio sobre Malaca conquista todas as rotas comerciais da China, da Índia e das Ilhas das Especiarias. Albuquerque pôs Malaca ao lado de Goa e Ormuz como um dos três pilares do império português."
 por_events.30.a: "Malaca é nossa! O comércio oriental — monopólio de Portugal!"
 por_events.40.t: "A Descoberta do Brasil por Cabral"
 por_events.40.d: "Em 22 de abril de 1500 — a caminho da Índia com uma flotilha de 13 navios, Pedro Álvares Cabral desviou-se muito para o oeste para evitar uma tempestade e descobriu uma terra desconhecida. “Ilha de Vera Cruz” — parte do continente sul-americano, mais tarde chamada “Brasil”. Pelo Tratado de Tordesilhas, essa terra passa a ser território português, e essa terra tornar-se-á mais tarde a maior colônia de Portugal."
 por_events.40.a: "Descoberta por orientação divina! O Brasil pertence a Portugal!"
 por_events.99.t: "Senhor dos Mares — O Império de Portugal Concluído"
 por_events.99.d: "De Lisboa a Goa, de Malaca ao Brasil — o império de Portugal domina os mares do mundo. A “Rota da Seda Marítima” com que sonhou o infante Dom Henrique tornou-se realidade, e as especiarias, o ouro, o açúcar e o marfim se encontram em Lisboa. Portugal transformou-se de uma pequena nação de 92000 quilômetros quadrados no primeiro “império marítimo global” do mundo."
 por_events.99.a: "Portugal para sempre! Governe como senhor dos mares!"
 STATIC_MODIFIER_NAME_por_henrique_mod: "A Tradição Marítima de Portugal"
 STATIC_MODIFIER_DESC_por_henrique_mod: "O Portugal de Afonso IV cultiva sua tradição marítima — a pesca atlântica, o comércio e a arte da navegação formam a base desse reino."
 STATIC_MODIFIER_NAME_por_lisbon_mod: "Prosperidade de Lisboa"
 STATIC_MODIFIER_DESC_por_lisbon_mod: "Lisboa, na foz do Tejo, desenvolvida como centro do comércio mundial."
 STATIC_MODIFIER_NAME_por_porto_mod: "Crescimento do Porto"
 STATIC_MODIFIER_DESC_por_porto_mod: "O Porto, no Douro, desenvolvido como cidade do vinho e da pesca."
 STATIC_MODIFIER_NAME_por_coimbra_mod: "A Universidade de Coimbra"
 STATIC_MODIFIER_DESC_por_coimbra_mod: "A mais antiga universidade de Portugal forma navegantes, juristas e clérigos."
 STATIC_MODIFIER_NAME_por_lisbon_trade_mod: "Lisboa como Entreposto Comercial"
 STATIC_MODIFIER_DESC_por_lisbon_trade_mod: "Lisboa estabelecida como o maior entreposto de especiarias orientais da Europa."
 STATIC_MODIFIER_NAME_por_avis_mod: "Autoridade da Casa de Avis"
 STATIC_MODIFIER_DESC_por_avis_mod: "Governo da dinastia de Avis estabilizado, base para a era dos descobrimentos assentada."
 STATIC_MODIFIER_NAME_por_ordenacoes_mod: "As Ordenações Afonsinas"
 STATIC_MODIFIER_DESC_por_ordenacoes_mod: "O primeiro código sistemático de leis, compilado pelos escribas de Lisboa, leva os mesmos princípios aos tribunais de todos os cantos do reino."
 STATIC_MODIFIER_NAME_por_evora_mod: "Crescimento de Évora"
 STATIC_MODIFIER_DESC_por_evora_mod: "A antiga cidade do Alentejo, Évora, desenvolvida como centro agrícola e cultural."
 STATIC_MODIFIER_NAME_por_fisheries_mod: "Pescarias do Algarve"
 STATIC_MODIFIER_DESC_por_fisheries_mod: "Os pesqueiros atlânticos alimentaram a afinidade portuguesa com o mar."
 STATIC_MODIFIER_NAME_por_ceuta_mod: "Cabeça de Ponte de Ceuta"
 STATIC_MODIFIER_DESC_por_ceuta_mod: "A porta africana Ceuta tornou-se ponto de partida da expansão ultramarina de Portugal."
 STATIC_MODIFIER_NAME_por_tangier_mod: "Tânger Conquistada"
 STATIC_MODIFIER_DESC_por_tangier_mod: "O Estreito de Gibraltar tomado, controle da travessia africana estabelecido."
 STATIC_MODIFIER_NAME_por_morocco_mod: "Fortalezas Marroquinas"
 STATIC_MODIFIER_DESC_por_morocco_mod: "Pontos finais do Saara subjugados — a influência portuguesa espalha-se pelo norte da África."
 STATIC_MODIFIER_NAME_por_madeira_mod: "Madeira Desenvolvida"
 STATIC_MODIFIER_DESC_por_madeira_mod: "A primeira colônia do Atlântico, a Madeira, estabeleceu o modelo de plantações açucareiras."
 STATIC_MODIFIER_NAME_por_azores_mod: "Os Açores"
 STATIC_MODIFIER_DESC_por_azores_mod: "Os Açores, no meio do Atlântico, assegurados como base de transbordo transatlântica."
 STATIC_MODIFIER_NAME_por_guinea_trade_mod: "Comércio com a Guiné"
 STATIC_MODIFIER_DESC_por_guinea_trade_mod: "Sacos de ouro em pó e marfim, chegando dos portos da Guiné, enchem a cada dia os livros da câmara comercial real de Lisboa."
 STATIC_MODIFIER_NAME_por_gold_coast_mod: "A Costa do Ouro"
 STATIC_MODIFIER_DESC_por_gold_coast_mod: "O ouro da fortaleza de Elmina enriqueceu a economia portuguesa."
 STATIC_MODIFIER_NAME_por_sao_tome_mod: "O Açúcar de São Tomé"
 STATIC_MODIFIER_DESC_por_sao_tome_mod: "A equatorial São Tomé tornou-se o maior fornecedor de açúcar à Europa."
 STATIC_MODIFIER_NAME_por_angola_mod: "A Colônia de Angola"
 STATIC_MODIFIER_DESC_por_angola_mod: "Angola estabelecida como cabeça de ponte centro-ocidental africana de Portugal."
 STATIC_MODIFIER_NAME_por_east_africa_mod: "Postos Comerciais da África Oriental"
 STATIC_MODIFIER_DESC_por_east_africa_mod: "A rede do comércio de ouro e marfim da costa suaíli tomada por Portugal."
 STATIC_MODIFIER_NAME_por_mombasa_mod: "O Forte de Mombaça"
 STATIC_MODIFIER_DESC_por_mombasa_mod: "A maior cidade comercial da África Oriental, Mombaça, caiu sob controle português."
 STATIC_MODIFIER_NAME_por_goa_mod: "Goa — Capital Oriental"
 STATIC_MODIFIER_DESC_por_goa_mod: "A capital do Estado da Índia, Goa, tornou-se o centro do comércio do Oceano Índico."
 STATIC_MODIFIER_NAME_por_malabar_mod: "As Especiarias da Costa do Malabar"
 STATIC_MODIFIER_DESC_por_malabar_mod: "A Costa do Malabar, que produz pimenta, cardamomo e gengibre, sob controle português."
 STATIC_MODIFIER_NAME_por_hormuz_mod: "Ormuz Subjugada"
