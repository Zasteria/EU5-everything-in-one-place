l_braz_por:
 hab_habsburg_mission_pack: "A Hegemonia dos Habsburgo e o Império Universal"
 hab_habsburg_mission_pack_DESCRIPTION:0 "Das margens do Danúbio, as ambições da casa de Habsburgo alcançam toda a Europa. Conquiste o trono de imperador do Sacro Império Romano, tome a Hungria a leste, a França e a Espanha a oeste, a Itália ao sul. Depois, faça de Viena a maior cidade do mundo e realize o Império Universal."
 hab_habsburg_mission_pack_CRITERIA_DESCRIPTION:0 "Domine o Sacro Império, conquiste o Ocidente, o Oriente e a Itália e realize o Império Universal."
 hab_habsburg_mission_pack_BUTTON_TOOLTIP:0 "Una a Europa sob a hegemonia dos Habsburgo."
 hab_habsburg_mission_pack_BUTTON_DETAILS:0 "“Que os outros façam a guerra; tu, feliz Áustria, casa-te!” — torne-se senhora da Europa tanto pela diplomacia quanto pela conquista!"
 hab_habsburg_ascendancy: "A Ascensão da Casa de Habsburgo"
 hab_habsburg_ascendancy_desc: "O sangue de Rodolfo de Habsburgo pulsa ao longo do Danúbio — começou a era da diplomacia e da conquista."
 hab_secure_electors: "Assegure os Eleitores"
 hab_secure_electors_desc: "O trono do imperador do Sacro Império Romano é decidido pelo voto dos eleitores. Por aliança ou por força esmagadora, assegure que a coroa imperial permaneça ininterruptamente nas mãos da casa de Habsburgo."
 hab_imperial_authority: "Estabeleça a Autoridade Imperial"
 hab_imperial_authority_desc: "A autoridade do Sacro Império Romano converge na vontade da casa de Habsburgo — chegou a hora de todo o Império se submeter à ordem de Viena."
 hab_counter_reformation: "A Contrarreforma"
 hab_counter_reformation_desc: "A heresia de Martinho Lutero abala a Alemanha — realize os decretos do Concílio de Trento e defenda a fé católica."
 hab_charlemagne_legacy: "O Legado de Carlos Magno"
 hab_charlemagne_legacy_desc: "Traga de volta ao estandarte habsburgo a Alemanha meridional que Carlos Magno unificou há mil anos — base da reforma imperial assentada."
 hab_imperial_reform: "Reforma Imperial"
 hab_imperial_reform_desc: "A reforma imperial — perpetue o governo dos Habsburgo por meio da reorganização das instituições de governo do Império."
 hab_emperors_of_rome: "Herdeira dos Imperadores Romanos"
 hab_emperors_of_rome_desc: "O sonho desde Carlos Magno — com o domínio sobre a Cidade Eterna, Roma, e sobre o Sacro Império, a casa de Habsburgo proclama-se “herdeira dos imperadores romanos”."
 hab_reclaim_burgundy: "Recupere a Borgonha"
 hab_reclaim_burgundy_desc: "A Lotaríngia e a Borgonha — recupere essas terras ocidentais que outrora pertenceram à casa de Habsburgo."
 hab_austrian_netherlands: "Países Baixos Austríacos"
 hab_austrian_netherlands_desc: "As ricas cidades comerciais de Flandres e Brabante — a riqueza dos Países Baixos sustenta as finanças do Império Habsburgo."
 hab_weaken_france: "Enfraqueça a França"
 hab_weaken_france_desc: "A velha rival França é o maior obstáculo à hegemonia europeia. Enfraqueça-a e corte seu poder de intervir na Alemanha e na Itália."
 hab_defeat_france: "A Derrota da França"
 hab_defeat_france_desc: "“A Gália caiu” — a velha rival França derrotada pela casa de Habsburgo. A hegemonia sobre a Europa Ocidental pertence aos Habsburgo."
 hab_iberian_marriage: "Diplomacia Matrimonial com a Ibéria"
 hab_iberian_marriage_desc: "“Que os outros façam a guerra; tu, feliz Áustria, casa-te” — os casamentos com a Espanha e Portugal abrem a porta para o império em que o sol nunca se põe."
 hab_crown_of_spain: "A Coroa da Espanha"
 hab_crown_of_spain_desc: "Toda a Península Ibérica — com a proclamação da casa de Habsburgo como “Rei da Espanha”, o império em que o sol nunca se põe começa a tomar forma."
 hab_italian_ambition: "Ambições na Itália"
 hab_italian_ambition_desc: "As ricas cidades-Estado do norte da Itália — traga Milão, Veneza e Nápoles ao controle habsburgo."
 hab_duchy_of_milan: "Conquiste o Ducado de Milão"
 hab_duchy_of_milan_desc: "Milão é o coração do norte da Itália. Tome esse bastião econômico e militar e estabeleça a base para a conquista da Itália."
 hab_papal_alliance: "Relações com o Papa"
 hab_papal_alliance_desc: "O papa — estabeleça relações com essa autoridade espiritual do mundo católico e eleve a legitimidade da casa de Habsburgo."
 hab_venetian_ports: "Os Portos de Veneza"
 hab_venetian_ports_desc: "Veneza, a “Rainha do Adriático” — tome seus portos e sua frota e assegure a entrada no comércio mediterrâneo."
 hab_king_of_naples: "Rei de Nápoles"
 hab_king_of_naples_desc: "O Reino de Nápoles — chave do sul da Itália. Essa coroa é o primeiro passo rumo ao domínio habsburgo sobre toda a Itália."
 hab_king_of_italy: "Rei da Itália"
 hab_king_of_italy_desc: "A “Coroa de Ferro” brilha na fronte do imperador habsburgo — toda a Itália, da Lombardia à Sicília, unida."
 hab_eastern_ambitions: "Ambições no Leste"
 hab_eastern_ambitions_desc: "Boêmia e Hungria — estabeleça reivindicações sobre essas duas grandes potências da Europa Oriental e inicie o avanço habsburgo para o leste."
 hab_crown_of_bohemia: "A Coroa da Boêmia"
 hab_crown_of_bohemia_desc: "A coroa de Venceslau em Praga — essa coroa torna-se a base da expansão habsburga para o leste."
 hab_royal_hungary: "A Hungria Real"
 hab_royal_hungary_desc: "Buda libertada dos otomanos — a coroa da Hungria volta à fronte do imperador habsburgo, e nasce a “Hungria Real”."
 hab_bohemian_union: "Incorporação da União Boêmia"
 hab_bohemian_union_desc: "A união pessoal com a Boêmia aprofundou-se — agora escolha entre governá-la diretamente como terra da coroa incorporada ou manter o status quo."
 hab_secure_croatia: "Assegure a Croácia"
 hab_secure_croatia_desc: "Estabeleça a fronteira militar na Croácia para deter invasões otomanas e use-a como cabeça de ponte para a conquista dos Bálcãs."
 hab_ottoman_menace: "A Ameaça Otomana"
 hab_ottoman_menace_desc: "O Império Otomano é o maior inimigo da Europa Oriental, que derrubou Constantinopla. Que a casa de Habsburgo se torne baluarte, defendendo a cristandade."
 hab_liberate_balkans: "Liberte os Bálcãs"
 hab_liberate_balkans_desc: "Liberte os cristãos da Península Balcânica do domínio otomano — a voz dos fiéis ortodoxos clama o nome dos Habsburgo."
 hab_emperors_of_east: "Imperador do Oriente"
 hab_emperors_of_east_desc: "Constantinopla — capital tanto do Império Romano do Oriente quanto do Ocidente — cai agora em mãos habsburgas. Tanto a coroa imperial oriental quanto a ocidental unidas."
 hab_austrian_heartland: "Estabeleça o Coração Austríaco"
 hab_austrian_heartland_desc: "O coração austríaco ao longo do Danúbio — assegure o coração da expansão imperial e estabeleça a base de sua economia e exército."
 hab_tyrol_styria: "Tirol e Estíria"
 hab_tyrol_styria_desc: "A prata de Schwaz e o ferro de Leoben — as minas do Tirol e da Estíria sustentam as finanças e os exércitos do Império Habsburgo."
 hab_dev_vienna: "Desenvolvimento de Viena"
 hab_dev_vienna_desc: "“Cidade da música”, “Viena Branca dos Habsburgo” — encha Viena de um esplendor digno de capital imperial."
 hab_graz_fortress: "Fortifique Graz"
 hab_graz_fortress_desc: "Graz — desenvolva a capital da Estíria numa cidade-fortaleza inexpugnável, pronta para a invasão otomana."
 hab_baroque_vienna: "Viena Barroca"
 hab_baroque_vienna_desc: "A música, a arquitetura e a pintura barrocas florescem na corte vienense — universidades e academias de artes anunciam a era de ouro da cultura habsburga."
 hab_great_vienna: "A Grande Cidade de Viena"
 hab_great_vienna_desc: "O Palácio de Schönbrunn, a Catedral de Santo Estêvão — Viena concluída como a maior e mais bela cidade da Europa."
 hab_swiss_lands: "Recupere as Terras Suíças"
 hab_swiss_lands_desc: "Lave a humilhação simbolizada por Guilherme Tell — recupere a terra dos camponeses alpinos para a casa de Habsburgo."
 hab_south_german_cities: "Cidades Comerciais da Alemanha do Sul"
 hab_south_german_cities_desc: "Augsburgo e Frankfurt — tome essas ricas cidades, pátria das famílias Fugger e Rothschild."
 hab_unify_germany: "Unificação da Alemanha"
 hab_unify_germany_desc: "Os principados alemães fragmentados — agora finalmente unidos sob o estandarte habsburgo."
 hab_north_sea_trade: "Comércio do Mar do Norte"
 hab_north_sea_trade_desc: "Hamburgo e Amsterdã — tome o controle do comércio do Mar do Norte e construa um novo império comercial para substituir a Liga Hanseática."
 hab_hegemon_of_west: "Hegemon do Ocidente"
 hab_hegemon_of_west_desc: "França, Espanha — toda grande potência do Ocidente que outrora desafiou a casa de Habsburgo, agora subjugada."
 hab_tuscany: "Conquista da Toscana"
 hab_tuscany_desc: "A cultura renascentista de Florença — tome essa terra das artes, que floresceu sob o mecenato dos Médici, sob as asas do Império Habsburgo."
 hab_surpass_poland: "Supere a Polônia"
 hab_surpass_poland_desc: "O Reino da Polônia — estabeleça a superioridade militar habsburga no confronto com essa grande potência da Europa Oriental."
 hab_wallachia_moldavia: "Valáquia e Moldávia"
 hab_wallachia_moldavia_desc: "Subjugue os principados romenos ao norte do Danúbio e complete o domínio habsburgo sobre os Bálcãs."
 hab_austrian_army: "Reorganize o Exército Austríaco"
 hab_austrian_army_desc: "O exército habsburgo — cultive o mais forte exército da Europa, forjado numa aliança de regimentos multinacionais."
 hab_spanish_tercios: "Os Tercios Espanhóis"
 hab_spanish_tercios_desc: "O tercio — introduza essa revolucionária tática militar espanhola em todo o exército habsburgo e aprimore a melhor infantaria da Europa."
 hab_multicultural: "Império Multinacional"
 hab_multicultural_desc: "Alemães, tchecos, húngaros, croatas, italianos — o experimento do Império Habsburgo de unir muitas nações sob um só estandarte concluído."
 hab_alsace_lorraine: "Alsácia-Lorena"
 hab_alsace_lorraine_desc: "Alsácia e Lorena, ao longo do Reno — assegure essa terra como fronteira ocidental do Império Habsburgo."
 hab_renaissance_court: "A Corte Renascentista"
 hab_renaissance_court_desc: "A luz do Renascimento brilha na corte vienense — a arte italiana e o saber bizantino se fundem, levando a cultura habsburga ao pleno florescimento."
 hab_carinthia: "Caríntia"
 hab_carinthia_desc: "Caríntia — incorpore esse ducado alpino às posses habsburgas e assegure o corredor para a Itália e os Bálcãs."
 hab_colonialism: "O Império Colonial"
 hab_colonialism_desc: "Por meio da Espanha — até as Américas — construa um império colonial sob cuja bandeira habsburga o sol nunca se põe."
 hab_universal_empire: "O Império Universal"
 hab_universal_empire_desc: "“O Império Universal — de Lisboa, a oeste, a Constantinopla, a leste, de Hamburgo, ao norte, a Palermo, ao sul” — o sonho desde Carlos Magno realizado."
 hab_events.1.t: "A Casa de Habsburgo, rumo ao Trono do Sacro Império"
 hab_events.1.d: "Os eleitores declararam seu apoio à casa de Habsburgo — o trono imperial pertence aos Habsburgo."
 hab_events.1.a: "Viva o Imperador Habsburgo! Viva o Império!"
 hab_events.10.t: "Proclamação como Herdeira dos Imperadores Romanos"
 hab_events.10.d: "A reforma imperial concluída e a Cidade Eterna, Roma, unida ao Sacro Império — a casa de Habsburgo proclama-se “herdeira dos imperadores romanos”."
 hab_events.10.a: "Viva a reforma imperial! Viva a herdeira de Roma!"
 hab_events.15.t: "Proclamação da Unificação da Alemanha"
 hab_events.15.d: "Do norte ao sul — a Alemanha, outrora fragmentada em incontáveis principados, unida sob o estandarte habsburgo."
 hab_events.15.a: "Viva a unificação da Alemanha!"
 hab_events.20.t: "A Queda da França — O Caminho ao Trono"
 hab_events.20.d: "A França enfim se curvou diante da casa de Habsburgo. Chegou a hora de estabelecer a reivindicação formal ao trono francês — proclame a reivindicação de sessenta anos e volte o olhar para a sucessão do Reino da França."
 hab_events.20.a: "Proclamar a reivindicação ao trono francês (60 anos)"
 hab_events.25.t: "A Coroa da Espanha"
 hab_events.25.d: "“Rei da Espanha e arquiduque da Áustria” — a Península Ibérica está agora em posse do Império Habsburgo."
 hab_events.25.a: "Viva a Espanha! Viva o Império Habsburgo!"
 hab_events.30.t: "Rei da Itália"
 hab_events.30.d: "A “Coroa de Ferro” brilha na fronte do imperador habsburgo — toda a Itália, da Lombardia à Sicília, unida."
 hab_events.40.t: "Fundação da Hungria Real"
 hab_events.40.d: "Buda libertada — a “Hungria Real” torna-se o pilar oriental do Império Habsburgo."
 hab_events.40.a: "Hungria libertada! Viva Buda!"
 hab_events.50.t: "Imperador do Oriente"
 hab_events.50.d: "Constantinopla caiu em mãos habsburgas — as capitais tanto do Império Romano do Oriente quanto do Ocidente são agora detidas como uma só."
 hab_events.50.a: "Viva Constantinopla! Viva o Imperador do Oriente!"
 hab_events.55.t: "A Grande Cidade de Viena"
 hab_events.55.d: "O Palácio de Schönbrunn, a Catedral de Santo Estêvão — Viena concluída como a maior e mais bela cidade da Europa."
 hab_events.55.a: "Viva a Grande Cidade de Viena!"
 hab_events.65.t: "Boêmia — Incorporação como Terra da Coroa"
 hab_events.65.d: "A união pessoal com a Boêmia aprofundou-se, e chegou a hora da plena incorporação. Governe-a diretamente como terra da coroa incorporada ou mantenha a atual união pessoal — decida."
 hab_events.65.a: "Incorporar a Boêmia como terra da coroa incorporada"
 hab_events.99.t: "Proclamação do Império Universal"
 hab_events.99.d: "“O Império Universal — o imperador habsburgo governa de Lisboa, a oeste, a Constantinopla, a leste” — essa proclamação ecoa por toda a Europa."
 hab_events.99.a: "Viva o Império Universal! O Império Habsburgo para sempre!"
 hab_events.65.b: "Manter a atual união pessoal"
 STATIC_MODIFIER_NAME_hab_army_mod: "Exército de Elite Habsburgo"
 STATIC_MODIFIER_DESC_hab_army_mod: "O exército habsburgo, que combina diversos regimentos nacionais, concluído como a mais forte força terrestre da Europa."
 STATIC_MODIFIER_NAME_hab_balkans_mod: "Libertação dos Bálcãs"
 STATIC_MODIFIER_DESC_hab_balkans_mod: "Os cristãos dos Bálcãs libertados do domínio otomano."
 STATIC_MODIFIER_NAME_hab_baroque_mod: "Viena Barroca"
 STATIC_MODIFIER_DESC_hab_baroque_mod: "A arte barroca floresce na corte vienense, fazendo dela o centro da cultura europeia."
 STATIC_MODIFIER_NAME_hab_boh_loyalty_mod: "Resistência à Incorporação Boêmia"
 STATIC_MODIFIER_DESC_hab_boh_loyalty_mod: "Nos salões de Praga, nobres tchecos murmuram contra a perda de suas antigas liberdades."
 STATIC_MODIFIER_NAME_hab_bohemia_mod: "A Coroa da Boêmia"
 STATIC_MODIFIER_DESC_hab_bohemia_mod: "A cidade dourada de Praga junta-se ao Império como segunda capital da casa de Habsburgo."
 STATIC_MODIFIER_NAME_hab_carinthia_mod: "Conquista da Caríntia"
 STATIC_MODIFIER_DESC_hab_carinthia_mod: "A Caríntia tornou-se um corredor alpino vital, ligando norte e sul para o Império Habsburgo."
 STATIC_MODIFIER_NAME_hab_catholic_mod: "Triunfo da Contrarreforma"
 STATIC_MODIFIER_DESC_hab_catholic_mod: "Fé católica defendida em todo o Império."
 STATIC_MODIFIER_NAME_hab_charlemagne_mod: "O Legado de Carlos Magno"
 STATIC_MODIFIER_DESC_hab_charlemagne_mod: "O legado imperial de Carlos Magno dá ao Império Habsburgo nova legitimidade."
 STATIC_MODIFIER_NAME_hab_croatia_mod: "A Fronteira Militar Croata"
 STATIC_MODIFIER_DESC_hab_croatia_mod: "Fronteira militar estabelecida na Croácia, detendo a invasão otomana."
 STATIC_MODIFIER_NAME_hab_danubian_mod: "Expansão do Império Danubiano"
 STATIC_MODIFIER_DESC_hab_danubian_mod: "Baixo Danúbio subjugado, completando o domínio habsburgo sobre todos os Bálcãs."
 STATIC_MODIFIER_NAME_hab_dynasty_mod: "O Despertar da Casa de Habsburgo"
 STATIC_MODIFIER_DESC_hab_dynasty_mod: "A ambição da casa de Habsburgo atiçada — começa a era da diplomacia e da conquista."
 STATIC_MODIFIER_NAME_hab_france_mod: "Guerra com a França"
 STATIC_MODIFIER_DESC_hab_france_mod: "A velha rival França enfraquecida, abrindo caminho para a hegemonia habsburga sobre a Europa."
 STATIC_MODIFIER_NAME_hab_graz_mod: "Fortificação de Graz"
 STATIC_MODIFIER_DESC_hab_graz_mod: "Graz desenvolvida como cidade-fortaleza inexpugnável, defendendo contra a invasão otomana."
 STATIC_MODIFIER_NAME_hab_great_vienna_loc_mod: "A Grande Cidade de Viena Concluída"
 STATIC_MODIFIER_DESC_hab_great_vienna_loc_mod: "Viena concluída como a maior cidade da Europa, brilhando como capital eterna do Império."
 STATIC_MODIFIER_NAME_hab_heartland_mod: "Estabilidade do Coração Austríaco"
 STATIC_MODIFIER_DESC_hab_heartland_mod: "O coração austríaco estável, estabelecendo a base da expansão imperial."
 STATIC_MODIFIER_NAME_hab_hegemon_mod: "Hegemon do Ocidente"
 STATIC_MODIFIER_DESC_hab_hegemon_mod: "Nenhuma potência da Europa Ocidental resta para desafiar a hegemonia habsburga."
 STATIC_MODIFIER_NAME_hab_imperial_mod: "Estabelecimento da Autoridade Imperial"
 STATIC_MODIFIER_DESC_hab_imperial_mod: "Todo o Sacro Império Romano submete-se agora à ordem da casa de Habsburgo."
 STATIC_MODIFIER_NAME_hab_italian_mod: "Frutos das Guerras Italianas"
 STATIC_MODIFIER_DESC_hab_italian_mod: "As campanhas italianas forjaram o exército habsburgo numa força de elite."
 STATIC_MODIFIER_NAME_hab_multiethnic_mod: "Estabelecimento do Império Multinacional"
 STATIC_MODIFIER_DESC_hab_multiethnic_mod: "O milagre da coexistência de muitas nações sob o estandarte habsburgo realizado."
 STATIC_MODIFIER_NAME_hab_north_sea_mod: "Hegemonia no Comércio do Mar do Norte"
 STATIC_MODIFIER_DESC_hab_north_sea_mod: "O comércio do Mar do Norte caiu sob controle do Império Habsburgo."
 STATIC_MODIFIER_NAME_hab_ottoman_mod: "Guerra com o Império Otomano"
 STATIC_MODIFIER_DESC_hab_ottoman_mod: "A vitória sobre o Império Otomano estabeleceu o reconhecimento do Império Habsburgo como baluarte da cristandade."
 STATIC_MODIFIER_NAME_hab_papal_mod: "Reconciliação com o Papa"
 STATIC_MODIFIER_DESC_hab_papal_mod: "Relações com o papa estabelecidas, e a casa de Habsburgo reconhecida como guardiã do mundo católico."
 STATIC_MODIFIER_NAME_hab_reform_mod: "Conclusão da Reforma Imperial"
 STATIC_MODIFIER_DESC_hab_reform_mod: "A reorganização das instituições de governo perpetua o governo habsburgo."
 STATIC_MODIFIER_NAME_hab_renaissance_mod: "O Renascimento de Viena"
 STATIC_MODIFIER_DESC_hab_renaissance_mod: "A luz do Renascimento brilha na corte vienense, fazendo do Império o centro da cultura europeia."
 STATIC_MODIFIER_NAME_hab_south_german_mod: "Cidades Comerciais da Alemanha do Sul"
 STATIC_MODIFIER_DESC_hab_south_german_mod: "As ricas cidades livres da Alemanha meridional tornaram-se o núcleo da economia imperial."
 STATIC_MODIFIER_NAME_hab_styria_iron_mod: "As Minas de Ferro de Leoben"
 STATIC_MODIFIER_DESC_hab_styria_iron_mod: "O ferro da Estíria sustenta o poderio militar do Império Habsburgo."
 STATIC_MODIFIER_NAME_hab_swiss_mod: "Conquista da Suíça"
 STATIC_MODIFIER_DESC_hab_swiss_mod: "O Estado camponês alpino conquistado, estabelecendo a hegemonia habsburga."
 STATIC_MODIFIER_NAME_hab_tercios_mod: "Os Tercios Espanhóis"
 STATIC_MODIFIER_DESC_hab_tercios_mod: "A tática do tercio introduzida em todo o exército habsburgo, dando origem à melhor infantaria da Europa."
 STATIC_MODIFIER_NAME_hab_tuscany_mod: "Prosperidade da Toscana"
 STATIC_MODIFIER_DESC_hab_tuscany_mod: "A cultura renascentista de Florença floresce sob a proteção do Império Habsburgo."
 STATIC_MODIFIER_NAME_hab_tyrol_silver_mod: "As Minas de Prata de Schwaz"
 STATIC_MODIFIER_DESC_hab_tyrol_silver_mod: "As minas de prata do Tirol sustentam as finanças do Império Habsburgo."
 STATIC_MODIFIER_NAME_hab_universal_empire_mod: "Proclamação do Império Universal"
 STATIC_MODIFIER_DESC_hab_universal_empire_mod: "“Império Universal” — toda a Europa unida sob o estandarte habsburgo."
 STATIC_MODIFIER_NAME_hab_venetia_mod: "A Conquista de Veneza"
 STATIC_MODIFIER_DESC_hab_venetia_mod: "A “Rainha do Adriático” sustenta agora o poderio naval do Império Habsburgo."
 STATIC_MODIFIER_NAME_hab_vienna_mod: "Viena — Coração do Império"
 STATIC_MODIFIER_DESC_hab_vienna_mod: "Viena brilha como centro cultural e administrativo do Império."
 hab_events.40.b: "Manter as relações atuais"
 STATIC_MODIFIER_NAME_hab_hun_loyalty_mod: "Resistência à Incorporação Húngara"
 STATIC_MODIFIER_DESC_hab_hun_loyalty_mod: "Nos palácios de Buda, magnatas húngaros murmuram contra a perda de suas antigas liberdades."
 hab_integrated_crown_desc: "Uma terra da coroa integrada é um tipo especial de vassalo que partilha seu governante com o imperador habsburgo, tem diplomacia limitada e permite ao suserano construir e desenvolver recursos diretamente. Não pode ser anexada por 100 anos."
 STATIC_MODIFIER_NAME_hab_spain_crown_mod: "A Conquista da Coroa Espanhola"
 STATIC_MODIFIER_DESC_hab_spain_crown_mod: "A Península Ibérica tornou-se parte das posses do Império Habsburgo, abrindo a porta para o império em que o sol nunca se põe."
 STATIC_MODIFIER_NAME_hab_alsace_mod: "A Conquista da Alsácia-Lorena"
 STATIC_MODIFIER_DESC_hab_alsace_mod: "A águia bicéfala dos Habsburgo tremula nas fortalezas de fronteira ao longo do Reno, e a defesa ocidental está inabalável."
 hab_events.30.b: "Continuar governando a Itália como está"
 hab_events.15.b: "Viva o Império Alemão!"
 hab_events.30.a: "Reorganizar o Reino da Itália como terra da coroa integrada"
 STATIC_MODIFIER_NAME_hab_hre_unity_mod: "Unificação do Sacro Império Romano"
 STATIC_MODIFIER_DESC_hab_hre_unity_mod: "O Sacro Império Romano unificado, e as estradas e exércitos do Império ligados num só."
 STATIC_MODIFIER_NAME_hab_ger_empire_mod: "Nascimento do Império Alemão"
 STATIC_MODIFIER_DESC_hab_ger_empire_mod: "O Império Alemão proclamado, e o exército disciplinado e poderoso anuncia seu nascimento."
 STATIC_MODIFIER_NAME_hab_rome_legacy_mod: "O Legado dos Imperadores Romanos"
 STATIC_MODIFIER_DESC_hab_rome_legacy_mod: "Aclamada herdeira dos imperadores romanos, a casa de Habsburgo vê sua corte cheia de clérigos e eruditos de todo o mundo cristão."
 hab_stadtrechtsbriefe: "Emita as Stadtrechtsbriefe"
 hab_stadtrechtsbriefe_desc: "Stadtrechtsbriefe — “cartas de direito urbano”. Sob a forte autoridade real do imperador habsburgo, conceda privilégios às cidades de todo o reino — o direito urbano de Viena para Viena e os direitos landstadt às cidades imperiais em outros lugares."
 hab_stadtrechtsbriefe_unlock_tt: "Desbloqueia os privilégios urbanos Direito urbano de Viena e Landstadt."
 hab_innsbruck_court: "A Corte de Innsbruck"
 hab_innsbruck_court_desc: "Innsbruck — agora que essa cidade central do Tirol se tornou uma verdadeira cidade, estabeleça aqui uma corte como nó da cultura alpina dos Habsburgo."
 hab_swarovski_crystal: "O Cristal Swarovski"
 hab_swarovski_crystal_desc: "Desde 1737, os vidreiros de Innsbruck aperfeiçoavam a arte do corte fino do cristal — muito antes do nascimento do próprio Swarovski, o cristal tirolês já adornava as cortes da Europa."
 STATIC_MODIFIER_NAME_hab_innsbruck_loc_mod: "Desenvolvimento da Corte de Innsbruck"
 STATIC_MODIFIER_DESC_hab_innsbruck_loc_mod: "Innsbruck começou a brilhar como nó da cultura alpina dos Habsburgo."
 STATIC_MODIFIER_NAME_hab_swarovski_mod: "Indústria do Cristal do Tirol"
 STATIC_MODIFIER_DESC_hab_swarovski_mod: "Os vidreiros de Innsbruck aperfeiçoaram a arte do corte fino do cristal."
 STATIC_MODIFIER_NAME_wiener_stadtrecht_town_rights: "Direito Urbano de Viena"
 STATIC_MODIFIER_DESC_wiener_stadtrecht_town_rights: "Direito urbano especial, concedido apenas a Viena — os benefícios no comércio e nos mercados sustentam a prosperidade de Viena."
 STATIC_MODIFIER_NAME_landstadt_town_rights: "Landstadt"
 STATIC_MODIFIER_DESC_landstadt_town_rights: "Direito urbano concedido às cidades imperiais — melhora a rede viária, equilibrando o poder da coroa e a influência nobre."
