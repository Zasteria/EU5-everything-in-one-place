l_braz_por:
 gae_gaelic_ireland_mission_pack: "O Contra-ataque Gaélico da Irlanda"
 gae_gaelic_ireland_mission_pack_DESCRIPTION:0 "O domínio inglês vacila em meio à peste e à invasão de Bruce — como chefe gaélico, conduza o ressurgimento, reivindique o trono do Alto Rei para unir a Irlanda e, por fim, cruze o mar para conquistar a própria Inglaterra."
 gae_gaelic_ireland_mission_pack_CRITERIA_DESCRIPTION:0 "Una o clã, torne-se Alto Rei de toda a Irlanda e conquiste a Inglaterra."
 gae_gaelic_ireland_mission_pack_BUTTON_TOOLTIP:0 "De clã dividido a Alto Rei que conquistou a Inglaterra."
 gae_gaelic_ireland_mission_pack_BUTTON_DETAILS:0 "Erga o estandarte gaélico sobre a Ilha Esmeralda — e também além do mar!"
 gae_gaelic_resurgence: "Ressurgimento Gaélico"
 gae_gaelic_resurgence_desc: "No caos da Peste Negra e da invasão de Bruce, o domínio colonial inglês vacila — a era dos senhores gaélicos volta a esta ilha."
 gae_brehon_law: "Preserve a Lei Brehon"
 gae_brehon_law_desc: "A Lei Brehon, uma tradição jurídica independente do costume romano ou inglês — preserve esse sistema ancestral como alicerce do governo."
 gae_fili_and_bards: "Os Fili e os Bardos"
 gae_fili_and_bards_desc: "Os fili, poetas eruditos que guardam a história e a genealogia do clã — proteja sua arte e deixe que a honra do clã seja cantada por gerações."
 gae_gallowglass_recruitment: "Recrute os Gallóglaigh"
 gae_gallowglass_recruitment_desc: "Guerreiros temíveis das ilhas escocesas — receba esses “Gallóglaigh” em suas fileiras e fortaleça o poder do clã."
 gae_clan_unification: "Una o Clã"
 gae_clan_unification_desc: "Ramos laterais divididos e terras em disputa — reúna-os e estabeleça sua autoridade como chefe."
 gae_lord_of_the_clan: "Senhor do Clã"
 gae_lord_of_the_clan_desc: "Lei, poesia, armas e linhagem unida — construa sobre tudo isso e torne-se o verdadeiro senhor do clã."
 gae_rout_the_settlers: "Expulse os Colonos"
 gae_rout_the_settlers_desc: "Os colonos ingleses, com as fileiras reduzidas pela peste — aproveite a oportunidade e expulse-os desta terra."
 gae_ostmen_towns: "As Cidades dos Ostmen"
 gae_ostmen_towns_desc: "Cidades portuárias fundadas há muito pelos descendentes dos vikings, os Ostmen — tome cidades como Dublin e Waterford."
 gae_resurgence_triumphant: "Ressurgimento Triunfante"
 gae_resurgence_triumphant_desc: "A expulsão dos colonos e a tomada das cidades dos Ostmen — o ressurgimento gaélico alcança aqui seu primeiro triunfo."
 gae_ulster_hegemony: "Hegemonia sobre Ulster"
 gae_ulster_hegemony_desc: "Ulster, a terra setentrional dos O’Neill e dos O’Donnell — estabeleça hegemonia sobre essa região."
 gae_connaught_hegemony: "Hegemonia sobre Connacht"
 gae_connaught_hegemony_desc: "Connacht, a terra selvagem do oeste — como herdeiro da glória dos O’Connor, governe essa região."
 gae_munster_hegemony: "Hegemonia sobre Munster"
 gae_munster_hegemony_desc: "Munster, no sul, terra dos MacCarthy e dos O’Brien — conquiste hegemonia sobre essa rica região."
 gae_leinster_hegemony: "Hegemonia sobre Leinster"
 gae_leinster_hegemony_desc: "Leinster, que faz fronteira com o próprio Pale — estabeleça hegemonia sobre essa região estratégica."
 gae_high_king_of_ireland: "Alto Rei da Irlanda"
 gae_high_king_of_ireland_desc: "O antigo título de Ard Rí, o Alto Rei, adormecido na colina de Tara — supere a era das divisões e faça ressurgir esse posto honrosíssimo."
 gae_conquer_the_pale: "Conquiste o Pale"
 gae_conquer_the_pale_desc: "O Pale, último reduto da Inglaterra em torno de Dublin — devolva essa terra às mãos gaélicas."
 gae_expel_the_english: "Expulse os Ingleses"
 gae_expel_the_english_desc: "Os últimos vestígios do poder inglês, ainda agarrados a esta ilha — varra-os por completo."
 gae_master_of_the_emerald_isle: "Senhor da Ilha Esmeralda"
 gae_master_of_the_emerald_isle_desc: "O trono do Alto Rei, a conquista do Pale e a expulsão total dos ingleses — a Irlanda voltou a ser verdadeiramente gaélica."
 gae_gaelic_fleet: "Construa uma Frota Gaélica"
 gae_gaelic_fleet_desc: "Para cruzar o mar até a própria Inglaterra — construa uma poderosa frota e volte o olhar para a pátria dos antigos invasores."
 gae_invade_wales: "Invada o País de Gales"
 gae_invade_wales_desc: "O País de Gales, terra de sangue celta aparentado — desembarque nessas praias e garanta uma cabeça de ponte contra a Inglaterra."
 gae_war_on_england: "Guerra contra a Inglaterra"
 gae_war_on_england_desc: "Chegou a hora de inverter o curso da história — desafie a Inglaterra, o antigo invasor, cara a cara."
 gae_conquest_of_england: "A Conquista da Inglaterra Realizada"
 gae_conquest_of_england_desc: "A pátria dos que um dia pisaram esta ilha jaz agora sob o domínio de um rei gaélico. A história está aqui completamente invertida."
 gae_events.1.t: "O Alto Rei Ascende ao Trono"
 gae_events.1.d: "Na colina de Tara, segundo o antigo costume, foi proclamado um novo Alto Rei. A era das divisões chega aqui ao fim."
 gae_events.1.a: "Glória ao Alto Rei!"
 gae_events.2.t: "Senhor da Ilha Esmeralda"
 gae_events.2.d: "Com a queda do Pale e a expulsão total dos ingleses, esta ilha finalmente voltou a ser verdadeiramente gaélica."
 gae_events.2.a: "Glória à Irlanda!"
 gae_events.99.t: "A Conquista da Inglaterra Realizada"
 gae_events.99.d: "A pátria da Inglaterra, que um dia pisou esta ilha, ajoelha-se agora diante do trono de um rei gaélico. A história está completamente invertida."
 gae_events.99.a: "História invertida!"
 STATIC_MODIFIER_NAME_gae_resurgence_mod: "Ressurgimento Gaélico"
 STATIC_MODIFIER_DESC_gae_resurgence_mod: "Desde que a peste reduziu a população de colonos, a língua e os costumes desta terra voltam a se espalhar pelo país."
 STATIC_MODIFIER_NAME_gae_brehon_mod: "Lei Brehon Preservada"
 STATIC_MODIFIER_DESC_gae_brehon_mod: "A memória dos precedentes, transmitida por gerações de juristas brehon, inspira mais confiança do que qualquer código escrito."
 STATIC_MODIFIER_NAME_gae_bards_mod: "Os Fili e os Bardos"
 STATIC_MODIFIER_DESC_gae_bards_mod: "Os aprendizes de fili ainda passam sete anos memorizando a genealogia e os feitos do clã."
 STATIC_MODIFIER_NAME_gae_gallowglass_mod: "Gallóglaigh Recrutados"
 STATIC_MODIFIER_DESC_gae_gallowglass_mod: "Os guerreiros de machado que chegaram por mar das Hébridas formam agora o núcleo da força permanente do clã."
 STATIC_MODIFIER_NAME_gae_clan_mod: "Clã Unido"
 STATIC_MODIFIER_DESC_gae_clan_mod: "Chefes vizinhos, unidos por casamento e por pacto, olham agora para além das velhas rixas, rumo ao inimigo comum."
 STATIC_MODIFIER_NAME_gae_lord_clan_mod: "Senhor do Clã"
 STATIC_MODIFIER_DESC_gae_lord_clan_mod: "Eleito segundo o antigo costume da tanistry, este chefe comanda agora as espadas de todos os ramos laterais."
 STATIC_MODIFIER_NAME_gae_rout_settlers_mod: "Colonos Expulsos"
 STATIC_MODIFIER_DESC_gae_rout_settlers_mod: "As mansões dos colonos, reduzidos pela peste, jazem vazias, voltando uma a uma ao estado selvagem."
 STATIC_MODIFIER_NAME_gae_ostmen_mod: "As Cidades dos Ostmen"
 STATIC_MODIFIER_DESC_gae_ostmen_mod: "Dos cais onde trabalham descendentes do sangue normando partem sem cessar navios carregados de peles e lã."
 STATIC_MODIFIER_NAME_gae_triumphant_mod: "Ressurgimento Triunfante"
 STATIC_MODIFIER_DESC_gae_triumphant_mod: "Depois de meio século de recuo, a colônia inglesa foi empurrada para uma mera faixa litorânea."
 STATIC_MODIFIER_NAME_gae_ulster_mod: "Hegemonia sobre Ulster"
 STATIC_MODIFIER_DESC_gae_ulster_mod: "Sob o nome O’Neill estão agora reunidos os guerreiros dos nove condados do norte."
 STATIC_MODIFIER_NAME_gae_connaught_hegemony_mod: "Hegemonia sobre Connacht"
 STATIC_MODIFIER_DESC_gae_connaught_hegemony_mod: "Como herdeiros do sangue dos O’Connor, as levas dos clãs que habitam os ermos do oeste são aceitas como coisa natural."
 STATIC_MODIFIER_NAME_gae_munster_mod: "Hegemonia sobre Munster"
 STATIC_MODIFIER_DESC_gae_munster_mod: "Das colinas de Decies ao porto de Cork, a riqueza do sul abundante enche o tesouro."
 STATIC_MODIFIER_NAME_gae_leinster_mod: "Hegemonia sobre Leinster"
 STATIC_MODIFIER_DESC_gae_leinster_mod: "Os coletores de impostos gaélicos chegam agora até o próprio fosso do Pale."
 STATIC_MODIFIER_NAME_gae_conquer_pale_mod: "Pale Conquistado"
 STATIC_MODIFIER_DESC_gae_conquer_pale_mod: "O estandarte inglês que um dia ondeou nas torres do Castelo de Dublin foi finalmente arriado."
 STATIC_MODIFIER_NAME_gae_expel_english_mod: "Ingleses Expulsos"
 STATIC_MODIFIER_DESC_gae_expel_english_mod: "O domínio estrangeiro sobre esta ilha, iniciado nos tempos de Henrique II, chegou por fim a um fim completo."
 STATIC_MODIFIER_NAME_gae_fleet_mod: "Frota Gaélica Construída"
 STATIC_MODIFIER_DESC_gae_fleet_mod: "Os marinheiros gaélicos, antes temidos apenas como saqueadores, comandam agora uma verdadeira frota própria."
 STATIC_MODIFIER_NAME_gae_war_england_mod: "Guerra contra a Inglaterra"
 STATIC_MODIFIER_DESC_gae_war_england_mod: "A guerra que trouxeram a esta ilha há século e meio cai agora sobre sua própria terra."
 STATIC_MODIFIER_NAME_gae_high_king_mod: "Alto Rei da Irlanda"
 STATIC_MODIFIER_DESC_gae_high_king_mod: "A sede do Ard Rí, abandonada desde os tempos de Brian Boru, encontrou de novo seu senhor na colina de Tara."
 STATIC_MODIFIER_NAME_gae_emerald_isle_mod: "Senhor da Ilha Esmeralda"
 STATIC_MODIFIER_DESC_gae_emerald_isle_mod: "De costa a costa, não resta mais nenhum funcionário estrangeiro nesta ilha."
 STATIC_MODIFIER_NAME_gae_conquest_england_mod: "História Invertida"
 STATIC_MODIFIER_DESC_gae_conquest_england_mod: "No trono antes ocupado por autoproclamados conquistadores, senta-se agora um rei gaélico."
