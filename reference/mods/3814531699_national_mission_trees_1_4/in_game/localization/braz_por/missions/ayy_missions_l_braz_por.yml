l_braz_por:
 ayy_ayyubid_mission_pack: "O Novo Saladino e o Senhor do Oriente Médio"
 ayy_ayyubid_mission_pack_DESCRIPTION:0 "Em 1337, a dinastia aiúbida sobrevive como um pequeno Estado no norte da Síria. Restaure a glória de Saladino (1138-1193), que unificou o Egito, a Síria e a Mesopotâmia e expulsou os cruzados de Jerusalém. Conquiste o Egito, liberte Jerusalém, tome Bagdá e torne-se guardião de Meca e Medina, para governar como Novo Saladino."
 ayy_ayyubid_mission_pack_CRITERIA_DESCRIPTION:0 "Conquiste o Egito, o Levante, a Mesopotâmia e a Arábia e governe como senhor do Oriente Médio e guardião do islã sunita."
 ayy_ayyubid_mission_pack_BUTTON_TOOLTIP:0 "Governe como Novo Saladino sobre o Oriente Médio."
 ayy_ayyubid_mission_pack_BUTTON_DETAILS:0 "De um pequeno Estado no norte da Síria, derrote os cruzados, recupere Jerusalém e erga um grande império do Oriente Médio!"
 ayy_rise_of_ayyubids: "A Ascensão dos Aiúbidas"
 ayy_rise_of_ayyubids_desc: "A dinastia aiúbida, herdeira de Saladino, inicia sua reconstrução a partir de um pequeno Estado no norte da Síria."
 ayy_secure_sinai: "Assegure o Sinai"
 ayy_secure_sinai_desc: "Assegure a Península do Sinai como porta entre o Egito e o Levante."
 ayy_conquer_lower_egypt: "Conquiste o Baixo Egito"
 ayy_conquer_lower_egypt_desc: "Conquiste o delta do Nilo e Alexandria para tomar o rico coração do Egito."
 ayy_seize_cairo: "Tome o Cairo"
 ayy_seize_cairo_desc: "Tome o Cairo — cidade dos mil minaretes — como capital aiúbida."
 ayy_upper_egypt: "Conquiste o Alto Egito"
 ayy_upper_egypt_desc: "Conquiste o Alto Egito até as cataratas de Assuã e complete o domínio sobre o Nilo."
 ayy_nile_breadbasket: "O Celeiro do Nilo"
 ayy_nile_breadbasket_desc: "Aproveite as férteis planícies aluviais do Nilo para alimentar o império."
 ayy_dev_cairo: "Construa a Capital Imperial, o Cairo"
 ayy_dev_cairo_desc: "Reconstrua o Cairo como a maior cidade do mundo islâmico — a capital imperial do Império Aiúbida."
 ayy_secure_levant: "Assegure o Levante"
 ayy_secure_levant_desc: "Assegure o Levante em torno de Damasco e expulse os cruzados."
 ayy_seize_aleppo: "Tome Alepo"
 ayy_seize_aleppo_desc: "Tome Alepo — coroa do norte da Síria."
 ayy_reclaim_jerusalem: "Recupere Jerusalém"
 ayy_reclaim_jerusalem_desc: "Recupere Jerusalém dos cruzados, como outrora fez Saladino em 1187."
 ayy_coastal_levant: "O Levante Costeiro"
 ayy_coastal_levant_desc: "Tome as cidades costeiras mediterrâneas do Levante para dominar o comércio marítimo."
 ayy_antioch: "Subjugue Antioquia"
 ayy_antioch_desc: "Subjugue a antiga grande cidade de Antioquia para ampliar a influência setentrional."
 ayy_jazira: "Independência do Ilcanato"
 ayy_jazira_desc: "A região de Jazira, entre o Tigre e o Eufrates, caiu sob influência mongol do Ilcanato. Traga essa rica terra ao controle aiúbida ou de vassalos e liberte-se do jugo mongol. A elevação ao posto de principado elevará a legitimidade aiúbida."
 ayy_kurdish_highlands: "As Terras Altas Curdas"
 ayy_kurdish_highlands_desc: "Incorpore as tribos montanhesas curdas — o próprio povo de Saladino — ao exército aiúbida."
 ayy_iraq_arabi: "Conquista do Iraque Árabe"
 ayy_iraq_arabi_desc: "Conquiste o Iraque Árabe para dominar o coração mesopotâmico."
 ayy_seize_baghdad: "Tome Bagdá"
 ayy_seize_baghdad_desc: "Tome Bagdá — cidade da paz — e proclame a supremacia aiúbida."
 ayy_mesopotamia_trade: "Comércio Mesopotâmico"
 ayy_mesopotamia_trade_desc: "Domine a rede comercial mesopotâmica em torno de Bagdá."
 ayy_hejaz: "Avanço sobre o Hejaz"
 ayy_hejaz_desc: "Avance sobre o Hejaz e aproxime-se das cidades santas de Meca e Medina."
 ayy_holy_cities: "Guardião das Cidades Santas"
 ayy_holy_cities_desc: "Torne-se guardião das duas Cidades Santas — Meca e Medina."
 ayy_north_yemen: "O Iêmen Setentrional"
 ayy_north_yemen_desc: "Conquiste o Iêmen setentrional e obtenha acesso ao comércio do Mar Vermelho."
 ayy_south_yemen: "Tome o Porto de Áden"
 ayy_south_yemen_desc: "Tome o porto de Áden — porta para o Mar Arábico."
 ayy_arabian_trade: "Comércio Marítimo Árabe"
 ayy_arabian_trade_desc: "Monopolize as rotas comerciais árabes, que ligam o Oceano Índico ao Mediterrâneo."
 ayy_madrasa: "Erga a Madrassa"
 ayy_madrasa_desc: "Erga madrassas por todo o império para reviver o saber islâmico."
 ayy_crusader_wars: "Guerra Santa contra os Cruzados"
 ayy_crusader_wars_desc: "Conduza a guerra santa contra os cruzados para forjar o exército aiúbida em guerreiros de elite."
 ayy_dev_damascus: "Prosperidade de Damasco"
 ayy_dev_damascus_desc: "Desenvolva Damasco — paraíso terrestre — como capital cultural aiúbida."
 ayy_spice_trade: "Comércio de Especiarias"
 ayy_spice_trade_desc: "Monopolize o comércio de especiarias do Oceano Índico, por Áden, aos mercados europeus."
 ayy_silk_road_control: "Domine a Rota da Seda"
 ayy_silk_road_control_desc: "Domine a Rota da Seda por Bagdá para dominar o comércio terrestre Leste-Oeste."
 ayy_kurdish_cavalry: "Elite da Cavalaria Curda"
 ayy_kurdish_cavalry_desc: "Forje a cavalaria curda na melhor força de combate aiúbida."
 ayy_nile_fleet: "A Frota do Nilo"
 ayy_nile_fleet_desc: "Construa uma frota no Nilo e no Mediterrâneo para cortar as linhas de suprimento dos cruzados."
 ayy_defeat_crusaders: "Derrote os Cruzados"
 ayy_defeat_crusaders_desc: "Repita a destruição do exército cruzado por Saladino em Hattin."
 ayy_egypt_navy: "Poder Naval Egípcio"
 ayy_egypt_navy_desc: "Construa um poderoso poder naval egípcio para dominar o Mediterrâneo e o Mar Vermelho."
 ayy_sugar_egypt: "O Açúcar do Egito"
 ayy_sugar_egypt_desc: "Monopolize a produção de açúcar do Egito — o ouro doce do comércio medieval."
 ayy_iraq_ajam: "Avanço sobre o Iraque Persa"
 ayy_iraq_ajam_desc: "Avance sobre o Iraque persa (Iraq-i Ajam) para ampliar a influência aiúbida na Pérsia."
 ayy_build_mosques: "Erga Mesquitas por Toda Parte"
 ayy_build_mosques_desc: "Erga mesquitas por todo o império para unir todos os súditos sob o islã sunita."
 ayy_sultan_of_egypt_syria: "Sultão do Egito e da Síria"
 ayy_sultan_of_egypt_syria_desc: "Proclame-se sultão do Egito, da Síria, do Iraque e do Hejaz — senhor do Oriente Médio."
 ayy_new_saladin: "O Novo Saladino"
 ayy_new_saladin_desc: "Governe como Novo Saladino — senhor do Oriente Médio, herdeiro do legado de Saladino."
 ayy_events.1.t: "A Ascensão dos Aiúbidas — O Juramento de Saladino"
 ayy_events.1.d: "Em nome de Deus — em 1337, a dinastia aiúbida sobrevive como um pequeno Estado, mas o espírito de Saladino corre em suas veias. A memória da batalha de Hattin (1187) e da libertação de Jerusalém move o sultão aiúbida. Conquiste o Egito, liberte a cidade santa, defenda Meca — torne-se o Novo Saladino, senhor do Oriente Médio."
 ayy_events.1.a: "No caminho de Deus — erguei-vos, aiúbidas!"
 ayy_events.10.t: "Libertação de Jerusalém — A Cidade Santa Volta ao Islã"
 ayy_events.10.d: "Allahu akbar! — o grande feito de Saladino de 1187 repetiu-se. Jerusalém voltou a mãos muçulmanas. A Cúpula da Rocha e a Mesquita Santa ressoam de novo com a oração islâmica. O mundo islâmico se regozija."
 ayy_events.10.a: "Glória a Jerusalém! Em nome de Deus!"
 ayy_events.20.t: "Entrada em Bagdá — Rumo ao Coração do Mundo Islâmico"
 ayy_events.20.d: "A cidade da paz, Bagdá — as forças aiúbidas entraram na cidade onde outrora governaram os califas abássidas. O povo clama: “Chegou o herdeiro de Saladino!” A cultura e o saber de Bagdá prosperam sob o mecenato aiúbida."
 ayy_events.20.a: "Glória a Bagdá! Glória à glória do islã!"
 ayy_events.30.t: "Guardião das Duas Cidades Santas — Defenda Meca e Medina"
 ayy_events.30.d: "Meca e Medina — lugares santos do profeta Maomé — passaram à proteção aiúbida. “Khadim al-Haramain ash-Sharifain” — esse título é concedido ao sultão aiúbida e reconhecido por todo o mundo islâmico."
 ayy_events.30.a: "Como guardião das duas Cidades Santas — em nome de Deus!"
 ayy_events.60.t: "Sultão do Egito e da Síria — Senhor do Oriente Médio"
 ayy_events.60.d: "Proclamado na corte do Cairo — “Sultão do Egito, da Síria, do Iraque e do Hejaz, senhor da dinastia aiúbida”. Jerusalém, Bagdá, Meca e o Cairo, todas unidas sob o estandarte aiúbida. O sonho desde os tempos de Saladino realizado."
 ayy_events.60.a: "Glória ao sultão! Glória aos aiúbidas!"
 ayy_events.99.t: "O Novo Saladino — Eterno Senhor do Oriente Médio"
 ayy_events.99.d: "“Salah ad-Din Ayyubi — retidão da fé, senhor do Oriente Médio” — esse título inscrito na história. Do Nilo, no Egito, ao Tigre, na Mesopotâmia, do deserto árabe às montanhas anatólias — todas as terras unidas sob o estandarte aiúbida."
 ayy_events.99.a: "Glória ao Novo Saladino! Glória ao Império Aiúbida!"
 STATIC_MODIFIER_NAME_ayy_sinai_mod: "Sinai"
 STATIC_MODIFIER_DESC_ayy_sinai_mod: "Península do Sinai assegurada, abrindo a porta entre o Egito e o Levante."
 STATIC_MODIFIER_NAME_ayy_lower_egypt_mod: "Baixo Egito"
 STATIC_MODIFIER_DESC_ayy_lower_egypt_mod: "Delta do Nilo e Alexandria conquistados — o rico coração do Egito assegurado."
 STATIC_MODIFIER_NAME_ayy_cairo_mod: "Cairo"
 STATIC_MODIFIER_DESC_ayy_cairo_mod: "O Cairo — cidade dos mil minaretes — tomado como capital aiúbida."
 STATIC_MODIFIER_NAME_ayy_upper_egypt_mod: "Alto Egito"
 STATIC_MODIFIER_DESC_ayy_upper_egypt_mod: "Alto Egito até Assuã conquistado, completando o domínio sobre o Nilo."
 STATIC_MODIFIER_NAME_ayy_nile_mod: "Nilo"
 STATIC_MODIFIER_DESC_ayy_nile_mod: "Sobre o lodo negro, trazido pela cheia do Nilo, os camponeses aguardam a estação em que as espigas de trigo ondularão ao vento."
 STATIC_MODIFIER_NAME_ayy_cairo_great_mod: "O Grande Cairo"
 STATIC_MODIFIER_DESC_ayy_cairo_great_mod: "O Cairo torna-se a maior cidade do mundo islâmico — a capital imperial."
 STATIC_MODIFIER_NAME_ayy_aleppo_mod: "Alepo"
 STATIC_MODIFIER_DESC_ayy_aleppo_mod: "Alepo — coroa do norte da Síria — tomada para dominar a região."
 STATIC_MODIFIER_NAME_ayy_coastal_mod: "Região Costeira"
 STATIC_MODIFIER_DESC_ayy_coastal_mod: "Cidades costeiras mediterrâneas do Levante tomadas, dominando o comércio marítimo."
 STATIC_MODIFIER_NAME_ayy_antioch_mod: "Antioquia"
 STATIC_MODIFIER_DESC_ayy_antioch_mod: "A antiga cidade de Antioquia subjugada, ampliando a influência setentrional."
 STATIC_MODIFIER_NAME_ayy_jazira_mod: "Independência do Ilcanato"
 STATIC_MODIFIER_DESC_ayy_jazira_mod: "Influência do Ilcanato expulsa — principado aiúbida reconhecido pela comunidade internacional."
 STATIC_MODIFIER_NAME_ayy_kurdish_mod: "Curdos"
 STATIC_MODIFIER_DESC_ayy_kurdish_mod: "Tribos montanhesas curdas — o próprio povo de Saladino — incorporadas ao exército aiúbida."
 STATIC_MODIFIER_NAME_ayy_iraq_mod: "Iraque"
 STATIC_MODIFIER_DESC_ayy_iraq_mod: "Iraque Árabe conquistado, dominando o coração mesopotâmico."
 STATIC_MODIFIER_NAME_ayy_mesopotamia_trade_mod: "Comércio Mesopotâmico"
 STATIC_MODIFIER_DESC_ayy_mesopotamia_trade_mod: "Rede comercial mesopotâmica em torno de Bagdá dominada."
 STATIC_MODIFIER_NAME_ayy_hejaz_mod: "Hejaz"
 STATIC_MODIFIER_DESC_ayy_hejaz_mod: "Ao longo das trilhas arenosas do Hejaz, caravanas de peregrinos vão a Meca e Medina sob os atentos estandartes aiúbidas."
 STATIC_MODIFIER_NAME_ayy_yemen_mod: "Iêmen"
 STATIC_MODIFIER_DESC_ayy_yemen_mod: "Iêmen setentrional conquistado, obtendo acesso ao comércio do Mar Vermelho."
 STATIC_MODIFIER_NAME_ayy_aden_mod: "Áden"
 STATIC_MODIFIER_DESC_ayy_aden_mod: "O porto de Áden — porta para o Mar Arábico — cai sob controle aiúbida."
 STATIC_MODIFIER_NAME_ayy_arabian_trade_mod: "Comércio Árabe"
 STATIC_MODIFIER_DESC_ayy_arabian_trade_mod: "Rotas comerciais árabes, que ligam o Oceano Índico ao Mediterrâneo, monopolizadas."
 STATIC_MODIFIER_NAME_ayy_madrasa_mod: "Madrassa"
 STATIC_MODIFIER_DESC_ayy_madrasa_mod: "Madrassas por todo o império reavivam o saber e a jurisprudência islâmicos."
 STATIC_MODIFIER_NAME_ayy_jihad_mod: "Jihad"
 STATIC_MODIFIER_DESC_ayy_jihad_mod: "A guerra santa contra os cruzados forja o exército aiúbida em guerreiros de elite."
 STATIC_MODIFIER_NAME_ayy_damascus_dev_mod: "Damasco Desenvolvida"
 STATIC_MODIFIER_DESC_ayy_damascus_dev_mod: "Damasco desenvolvida como importante nó comercial e cultural."
 STATIC_MODIFIER_NAME_ayy_spice_mod: "Especiarias"
 STATIC_MODIFIER_DESC_ayy_spice_mod: "Comércio de especiarias do Oceano Índico, por Áden, à Europa monopolizado."
 STATIC_MODIFIER_NAME_ayy_silk_mod: "Seda"
 STATIC_MODIFIER_DESC_ayy_silk_mod: "Rota da Seda por Bagdá dominada, controlando o comércio terrestre Leste-Oeste."
 STATIC_MODIFIER_NAME_ayy_cavalry_mod: "Cavalaria"
 STATIC_MODIFIER_DESC_ayy_cavalry_mod: "Cavalaria curda — a elite de Saladino — forjada na melhor força aiúbida."
 STATIC_MODIFIER_NAME_ayy_fleet_mod: "Frota"
 STATIC_MODIFIER_DESC_ayy_fleet_mod: "A frota no Nilo e no Mediterrâneo corta as linhas de suprimento dos cruzados."
 STATIC_MODIFIER_NAME_ayy_crusader_mod: "Cruzados"
 STATIC_MODIFIER_DESC_ayy_crusader_mod: "A destruição do exército cruzado por Saladino em Hattin repetida — o prestígio sobe de modo vertiginoso."
 STATIC_MODIFIER_NAME_ayy_navy_mod: "Poder Naval"
 STATIC_MODIFIER_DESC_ayy_navy_mod: "O poderoso poder naval egípcio domina o Mediterrâneo e o Mar Vermelho."
 STATIC_MODIFIER_NAME_ayy_sugar_mod: "Açúcar"
 STATIC_MODIFIER_DESC_ayy_sugar_mod: "A produção de açúcar do Egito — o ouro doce do comércio medieval — monopolizada."
 STATIC_MODIFIER_NAME_ayy_iraq_ajam_mod: "Iraque Persa"
 STATIC_MODIFIER_DESC_ayy_iraq_ajam_mod: "Os cavalos dos enviados aiúbidas são agora vistos repetidamente nas cidades montanhosas da Pérsia Ocidental."
 STATIC_MODIFIER_NAME_ayy_mosque_mod: "Mesquita"
 STATIC_MODIFIER_DESC_ayy_mosque_mod: "Mesquitas por todo o império unem todos os súditos sob o islã sunita."
 STATIC_MODIFIER_NAME_ayy_sultan_mod: "Sultão"
 STATIC_MODIFIER_DESC_ayy_sultan_mod: "Sultão do Egito, da Síria, do Iraque e do Hejaz — senhor do Oriente Médio."
 STATIC_MODIFIER_NAME_ayy_saladin_mod: "Saladino"
 STATIC_MODIFIER_DESC_ayy_saladin_mod: "O Novo Saladino governa — senhor do Oriente Médio, herdeiro do legado de Saladino."
 STATIC_MODIFIER_NAME_ayy_rise_mod: "Ascensão dos Aiúbidas"
 STATIC_MODIFIER_DESC_ayy_rise_mod: "Com o nome de Saladino nos lábios, os guerreiros das tribos reúnem-se um a um sob os estandartes."
 ayy_mamluk_rivalry: "Confronto com os Mamelucos"
 ayy_mamluk_rivalry_desc: "O Sultanato Mameluco — originalmente escravos-soldados turcos, elevados pelos aiúbidas, que derrubaram a dinastia em 1250 — é nosso inimigo jurado. Contenha os mamelucos e estabeleça a reivindicação a Alepo como cabeça de ponte para recuperar a Síria."
 STATIC_MODIFIER_NAME_ayy_baghdad_city_mod: "Cidade do Califa"
 STATIC_MODIFIER_DESC_ayy_baghdad_city_mod: "Bagdá renascida como centro do comércio e da cultura da civilização islâmica."
 STATIC_MODIFIER_NAME_ayy_levant_control_mod: "Controle do Levante Estabelecido"
 STATIC_MODIFIER_DESC_ayy_levant_control_mod: "Estrutura administrativa no Levante estabelecida, melhorando a eficiência da incorporação e da anexação."
 STATIC_MODIFIER_NAME_ayy_holy_cities_mod: "Guardião das Duas Cidades Santas"
 STATIC_MODIFIER_DESC_ayy_holy_cities_mod: "Aclamada guardiã de Meca e Medina, a corte aiúbida atrai eruditos, juristas e convertidos de todo o mundo."
 STATIC_MODIFIER_NAME_ayy_jerusalem_mod: "Guerra Santa pela Libertação de Jerusalém"
 STATIC_MODIFIER_DESC_ayy_jerusalem_mod: "A glória da libertação de Jerusalém dá às forças aiúbidas uma vantagem constante na luta contra outras fés."
