l_braz_por:
 lbv_niederbayern_mission_pack: "Legado de Landshut — o caminho da unificação da Baviera"
 lbv_niederbayern_mission_pack_DESCRIPTION:0 "Como casa de Landshut, herdeira das posses de Alberto I que chegavam até os Países Baixos, reunifique as terras divididas da Baviera num só todo."
 lbv_niederbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Desenvolva Landshut e una a Baviera."
 lbv_niederbayern_mission_pack_BUTTON_TOOLTIP:0 "Desenvolva Landshut e una a Baviera."
 lbv_niederbayern_mission_pack_BUTTON_DETAILS:0 "Erga-se como duque de toda a Baviera!"
 lbv_straubing_holland_legacy: "Legado de Straubing-Holanda"
 lbv_straubing_holland_legacy_desc: "O legado de Alberto I, cujas posses chegavam aos Países Baixos — como casa de Landshut, herde a memória dessa vasta herança."
 lbv_secure_landshut: "Desenvolva Landshut"
 lbv_secure_landshut_desc: "Landshut, rio acima no Isar — desenvolva essa cidade de magnífica arquitetura gótica como centro do ducado."
 lbv_danube_trade: "Comércio do Danúbio"
 lbv_danube_trade_desc: "Navios mercantes que singram o Danúbio — aproveite essa via fluvial vital e garanta a riqueza do comércio."
 lbv_low_countries_ties: "Laços com os Países Baixos"
 lbv_low_countries_ties_desc: "O legado de Alberto I, que um dia governou a Holanda, a Zelândia e o Hainaut — cultive nossos laços com os Países Baixos até hoje."
 lbv_bavarian_ambition: "Reivindicação de uma Só Baviera"
 lbv_bavarian_ambition_desc: "Desenvolvimento de Landshut, comércio do Danúbio e laços com os Países Baixos — construa sobre isso e cultive a reivindicação a toda a Baviera."
 lbv_reunite_bavaria: "Reunifique a Baviera"
 lbv_reunite_bavaria_desc: "O ducado dividido — recupere as terras da Alta Baviera e reunifique a Baviera num só todo."
 lbv_duke_of_all_bavaria: "Duque de Toda a Baviera"
 lbv_duke_of_all_bavaria_desc: "Sob a casa de Landshut, toda a Baviera está finalmente unida sob um só estandarte."
 lbv_events.1.t: "Proclamação da Unidade da Baviera"
 lbv_events.1.d: "Sob a casa de Landshut, a Baviera está finalmente unida num só todo. A era das divisões chega ao fim."
 lbv_events.1.a: "Glória à Baviera!"
 STATIC_MODIFIER_NAME_lbv_legacy_mod: "Legado de Straubing-Holanda"
 STATIC_MODIFIER_DESC_lbv_legacy_mod: "A glória de Alberto I, cujas posses abarcaram a Holanda e o Hainaut, ainda é lembrada com orgulho na corte de Landshut."
 STATIC_MODIFIER_NAME_lbv_landshut_mod: "Landshut Desenvolvida"
 STATIC_MODIFIER_DESC_lbv_landshut_mod: "A cidade de arquitetura gótica floresce como centro do ducado."
 STATIC_MODIFIER_NAME_lbv_danube_mod: "Comércio do Danúbio"
 STATIC_MODIFIER_DESC_lbv_danube_mod: "As barcaças que sobem e descem o vale do Danúbio descarregam sem cessar sal e grãos ao longo das margens da Baixa Baviera."
 STATIC_MODIFIER_NAME_lbv_low_countries_mod: "Laços com os Países Baixos"
 STATIC_MODIFIER_DESC_lbv_low_countries_mod: "Enviados e mercadores de tecidos dos Países Baixos, do outro lado do Mar do Norte, são calorosamente recebidos até na corte de Landshut."
 STATIC_MODIFIER_NAME_lbv_reunite_mod: "Baviera Reunificada"
 STATIC_MODIFIER_DESC_lbv_reunite_mod: "Os vassalos dos dois ramos antes divididos prestam agora juramento sob um único estandarte."
 STATIC_MODIFIER_NAME_lbv_unify_bavaria_mod: "Duque de Toda a Baviera"
 STATIC_MODIFIER_DESC_lbv_unify_bavaria_mod: "Os sinos das torres bávaras repicam, proclamando o fim das divisões."
 lbv_unified_duchy: "Ducado Unificado da Baviera"
 lbv_unified_duchy_desc: "A era das divisões acabou — como ducado unificado da Baviera, abra uma nova era."
 lbv_bavaria_unified_tt: "Unificou a Baviera"
 lbv_landrecht: "Direito Territorial da Baviera"
 lbv_landrecht_desc: "Uma lei uniforme para o ducado unificado — introduza o código de leis bávaro (Landrecht) e fortaleça o alicerce do governo."
 lbv_tyrol_ambition: "Ambições sobre o Tirol"
 lbv_tyrol_ambition_desc: "O condado do Tirol, escondido no abraço dos Alpes — nutra ambições sobre essa terra."
 lbv_swabian_expansion: "Expansão na Suábia"
 lbv_swabian_expansion_desc: "A Suábia, que se estende ao sudoeste — reforce nossa influência sobre essa região."
 lbv_greater_bavaria: "Realize a Grande Baviera"
 lbv_greater_bavaria_desc: "Código de leis, Tirol e Suábia — construa sobre isso e realize a Grande Baviera."
 lbv_counter_reformation_leader: "Líder da Contrarreforma"
 lbv_counter_reformation_leader_desc: "Encarne o espírito do Concílio de Trento e assuma a liderança da Contrarreforma."
 lbv_electoral_dignity: "Dignidade Eleitoral"
 lbv_electoral_dignity_desc: "Em 1623 Maximiliano I conquista enfim o posto de eleitor — faça dessa honra o orgulho eterno da Baviera."
 lbv_austrian_rivalry: "Rivalidade com a Áustria"
 lbv_austrian_rivalry_desc: "A rivalidade com a casa de Habsburgo pela hegemonia no Império — aceite esse desafio de nosso grande rival."
 lbv_war_of_austrian_succession: "Guerra de Sucessão Austríaca"
 lbv_war_of_austrian_succession_desc: "A guerra pela reivindicação de Carlos VII ao trono imperial — aproveite essa guerra de sucessão para elevar o prestígio da Baviera."
 lbv_imperial_crown: "Coroa Imperial"
 lbv_imperial_crown_desc: "Em 1742 Carlos VII, duque da Baviera, é coroado Imperador do Sacro Império Romano — o primeiro não Habsburgo a portar a coroa em séculos."
 lbv_enlightened_absolutism: "Absolutismo Esclarecido"
 lbv_enlightened_absolutism_desc: "A era do Iluminismo, que venera a razão e a ciência — introduza essa nova corrente de pensamento no governo da Baviera."
 lbv_napoleonic_alliance: "Desafio à França"
 lbv_napoleonic_alliance_desc: "A Europa, abalada pela revolução e pela ambição de Napoleão — a Baviera reforça sua reivindicação ao trono desse poderoso vizinho e abre o próprio caminho."
 lbv_kingdom_of_bavaria: "Proclamação do Reino da Baviera"
 lbv_kingdom_of_bavaria_desc: "Em 1806 o eleitor Maximiliano IV José se proclama rei da Baviera — a longa história da casa de Wittelsbach atinge aqui um novo auge."
 lbv_events.3.t: "Coroa Imperial"
 lbv_events.3.d: "Em 1742 Carlos VII, duque da Baviera, foi coroado Imperador do Sacro Império Romano na catedral de Frankfurt. Haviam-se passado séculos desde que alguém que não fosse Habsburgo portara a coroa imperial."
 lbv_events.3.a: "Glória à Sua Majestade Imperial!"
 lbv_events.99.t: "Proclamação do Reino da Baviera"
 lbv_events.99.d: "Em 1806 o eleitor Maximiliano IV José, sob o abrigo da Confederação do Reno, proclamou-se rei da Baviera. A longa história da casa de Wittelsbach atinge aqui um novo auge."
 lbv_events.99.a: "Viva o Reino da Baviera!"
 STATIC_MODIFIER_NAME_lbv_unified_mod: "Ducado Unificado da Baviera"
 STATIC_MODIFIER_DESC_lbv_unified_mod: "O ducado já não precisa dividir suas cortes, rendas e guerreiros entre ramos rivais."
 STATIC_MODIFIER_NAME_lbv_greater_mod: "A Grande Baviera Realizada"
 STATIC_MODIFIER_DESC_lbv_greater_mod: "Do sopé dos Alpes às colinas da Suábia, as terras sob o estandarte ducal se ampliam a cada estação."
 STATIC_MODIFIER_NAME_lbv_counter_reformation_mod: "Líder da Contrarreforma"
 STATIC_MODIFIER_DESC_lbv_counter_reformation_mod: "No espírito do Concílio de Trento, os colégios jesuítas se abrem um após o outro nas cidades do ducado."
 STATIC_MODIFIER_NAME_lbv_succession_war_mod: "Guerra de Sucessão Austríaca"
 STATIC_MODIFIER_DESC_lbv_succession_war_mod: "Oficiais e soldados temperados nos campos de batalha da Guerra de Sucessão Austríaca formam agora o núcleo do exército ducal."
 STATIC_MODIFIER_NAME_lbv_imperial_crown_mod: "Coroa Imperial"
 STATIC_MODIFIER_DESC_lbv_imperial_crown_mod: "A memória do dia em que o duque da Baviera foi coroado na catedral de Frankfurt é guardada com orgulho no coração de cada cortesão."
 STATIC_MODIFIER_NAME_lbv_enlightenment_mod: "Absolutismo Esclarecido"
 STATIC_MODIFIER_DESC_lbv_enlightenment_mod: "Na corte, os novos livros que chegam da França difundem os ideais do Iluminismo, e o número de escolas cresce a cada ano."
 STATIC_MODIFIER_NAME_lbv_electoral_dignity_mod: "Dignidade Eleitoral"
 STATIC_MODIFIER_DESC_lbv_electoral_dignity_mod: "Quando o duque, vestido com o manto de eleitor, toma seu lugar nas eleições imperiais, os príncipes escutam com atenção suas palavras."
 STATIC_MODIFIER_NAME_lbv_kingdom_mod: "Reino da Baviera"
 STATIC_MODIFIER_DESC_lbv_kingdom_mod: "No palácio de Munique troam as salvas que celebram a coroação do primeiro rei da Baviera da casa de Wittelsbach."
