l_braz_por:
 sav_house_of_savoy_mission_pack: "As Ambições da Casa de Saboia"
 sav_house_of_savoy_mission_pack_DESCRIPTION:0 "A casa de Saboia, senhora das passagens alpinas, está destinada a erguer-se de um pequeno ducado piemontês para governar toda a Itália e o sul da França e fundar o Reino da Itália. Manobre com astúcia entre o papa, o imperador e a França; tome Gênova para estabelecer poder naval; esmague a Lombardia, a Toscana e o Vêneto para reivindicar Roma. Surja como Sardenha-Piemonte e torne-se enfim o porta-estandarte da unificação da Itália."
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION:0 "Como Saboia-Piemonte, conquiste a Itália e a França e funde o Reino da Itália."
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para realizar as ambições da casa de Saboia."
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS:0 "Cruze os Alpes e una a Itália!"
 sav_the_savoy_ambition: "A Ambição de Saboia"
 sav_the_savoy_ambition_desc: "A casa de Saboia ocupa um lugar singular na encruzilhada dos Alpes, com influência tanto sobre a Itália quanto sobre a França. Pelo domínio das férteis terras do Piemonte e das rotas comerciais alpinas, esse pequeno ducado inicia seu caminho rumo à grandeza."
 sav_unify_piedmont: "Una o Piemonte"
 sav_unify_piedmont_desc: "Incorporar potências independentes, como Saluzzo e Monferrato, e unir todo o Piemonte — o primeiro passo rumo às grandes ambições de Saboia."
 sav_glory_of_turin: "A Glória de Turim"
 sav_glory_of_turin_desc: "Desenvolva Turim, a cidade central do Piemonte, numa metrópole florescente, digna de ser a capital da casa de Saboia."
 sav_shroud_of_turin: "O Sudário de Turim"
 sav_shroud_of_turin_desc: "O pano de linho, tido como o sudário de Cristo, repousa na catedral de Turim. A fé nessa relíquia traz riqueza e prestígio ao reino."
 sav_alpine_roads: "As Estradas Alpinas"
 sav_alpine_roads_desc: "O desenvolvimento da infraestrutura viária ao longo das rotas comerciais alpinas aumenta o lucro que flui a Saboia à medida que os mercadores passam entre a França e a Itália."
 sav_crossroads_of_europe: "Encruzilhada da Europa"
 sav_crossroads_of_europe_desc: "O Piemonte, que liga Gênova, Veneza e a França, torna-se um dos principais nós comerciais da Europa."
 sav_order_of_saints_maurice: "A Ordem dos Santos Maurício e Lázaro"
 sav_order_of_saints_maurice_desc: "A Ordem dos Santos Maurício e Lázaro, fundada pela casa de Saboia, torna-se símbolo de autoridade religiosa e legitimidade no mundo católico."
 sav_savoy_academy: "A Academia de Saboia"
 sav_savoy_academy_desc: "Adotar o espírito do Renascimento e desenvolver instituições acadêmicas em torno de Turim estabelece Saboia como membro seguro do círculo cultural italiano."
 sav_alpine_powerhouse: "A Potência Alpina"
 sav_alpine_powerhouse_desc: "Por meio da unificação do Piemonte, do desenvolvimento cultural e do crescente poder econômico, Saboia é reconhecida como potência significativa em torno dos Alpes."
 sav_alpine_fortifications: "Fortificações Alpinas"
 sav_alpine_fortifications_desc: "Aproveitar plenamente o relevo natural dos Alpes e construir poderosas fortalezas em pontos estratégicos faz de Saboia um Estado montanhês inexpugnável."
 sav_diplomatic_balance: "Equilíbrio Diplomático"
 sav_diplomatic_balance_desc: "Para Saboia, encravada entre grandes potências, a maestria diplomática é indispensável à sobrevivência. Manter alto prestígio diplomático desvia habilmente a pressão dos vizinhos poderosos."
 sav_savoyard_army: "O Exército Saboiano"
 sav_savoyard_army_desc: "Os soldados saboianos, temperados no terreno acidentado dos Alpes, são considerados entre os melhores guerreiros de montanha da Europa. Construir um exército permanente sustenta a independência militar do reino."
 sav_conquer_genoa: "Conquiste Gênova"
 sav_conquer_genoa_desc: "A conquista de Gênova, uma das principais cidades marítimas do Mediterrâneo, permite que Saboia supere sua posição terrestre e dê o primeiro passo rumo ao poder naval, com acesso direto ao Mediterrâneo."
 sav_nice_naval_base: "Base Naval de Nice"
 sav_nice_naval_base_desc: "Estabelecer uma base naval em Nice, na costa mediterrânea, dá a Saboia uma cabeça de ponte para dominar o Mar Tirreno."
 sav_sardinia_union: "União com a Sardenha"
 sav_sardinia_union_desc: "Tomar a maior parte da Sardenha e assumir o título de “Reino da Sardenha” faz a casa de Saboia ser reconhecida como uma das casas reais significativas da Itália."
 sav_seize_lombardy: "Tome a Lombardia"
 sav_seize_lombardy_desc: "Trazer a Lombardia, em torno de Milão, ao controle saboiano faz de Saboia a senhora do norte da Itália."
 sav_push_tuscany: "Avance sobre a Toscana"
 sav_push_tuscany_desc: "Subjugar as ricas cidades-Estado da Toscana, lideradas por Florença, acrescenta ao território saboiano uma terra-núcleo da cultura renascentista."
 sav_capture_venice: "Tome Veneza"
 sav_capture_venice_desc: "A conquista de Veneza, a Rainha do Adriático, estabelece a hegemonia marítima de Saboia no norte da Itália."
 sav_emilia_and_beyond: "Emília e Além"
 sav_emilia_and_beyond_desc: "Tomar a região da Emília e dominar as demais províncias do norte da Itália torna absoluta a hegemonia saboiana."
 sav_march_on_naples: "Marcha sobre Nápoles"
 sav_march_on_naples_desc: "A conquista de Nápoles, cidade-chave do sul da Itália, aproxima a conclusão do domínio sobre a península."
 sav_eternal_rome: "A Cidade Eterna"
 sav_eternal_rome_desc: "Dominar Roma significa dominar a Itália. Tendo tomado a Cidade Eterna, Saboia mostra ao mundo sua autoridade de legítima governante da Itália."
 sav_integrate_geneva: "Integre Genebra"
 sav_integrate_geneva_desc: "Trazer Genebra, com seus fortes laços com a Confederação Suíça, com firmeza ao controle saboiano estabelece uma cabeça de ponte para a expansão rumo ao norte."
 sav_control_provence: "Domine a Provença"
 sav_control_provence_desc: "Tomar a Provença, ao longo da costa mediterrânea, estabelece a hegemonia de Saboia no sul da França e abre o caminho para ambições maiores."
 sav_against_the_swiss: "Contra os Suíços"
 sav_against_the_swiss_desc: "Suprimir a Confederação Suíça, teimosamente independente, e tomar a Suíça Ocidental faz de Saboia senhora das terras a oeste do Reno."
 sav_conquer_burgundy: "Conquiste a Borgonha"
 sav_conquer_burgundy_desc: "Subjugar as ricas terras que outrora o ducado da Borgonha governou abre o caminho para a invasão da França."
 sav_savoyard_occitania: "A Occitânia Saboiana"
 sav_savoyard_occitania_desc: "Tomar as terras de língua occitana e incorporar todo o sul da França ao círculo cultural saboiano."
 sav_claim_france: "Reivindique a França"
 sav_claim_france_desc: "Chegou a hora de tomar Paris, capital do Reino da França, e trazer sob nosso governo a grande potência que outrora ameaçou Saboia."
 sav_kingdom_of_italy: "O Reino da Itália"
 sav_kingdom_of_italy_desc: "A casa de Saboia cruzou os Alpes para unificar toda a Itália e, como herdeira do Império Romano, fundou o Reino da Itália. O sonho do Risorgimento aqui realizado."
 STATIC_MODIFIER_NAME_sav_unified_piedmont_mod: "Unificação do Piemonte"
 STATIC_MODIFIER_DESC_sav_unified_piedmont_mod: "O Piemonte — “pé da montanha” — fértil planície, cercada pelos Alpes e pelos Apeninos, governada pelos senhores de Saboia, Monferrato, Saluzzo e outros. Só pela sua unificação Saboia pode dominar plenamente a encruzilhada que liga os Alpes ao rio Pó."
 STATIC_MODIFIER_NAME_sav_shroud_of_turin_mod: "A Bênção do Sudário"
 STATIC_MODIFIER_DESC_sav_shroud_of_turin_mod: "O Sudário de Turim — pano de linho que, segundo se crê, envolveu Cristo após a crucificação, trazendo a impressão sombreada de um corpo humano. Desde que a casa de Saboia o obteve em 1353, é venerado como uma das maiores relíquias do mundo católico. Os debates sobre sua autenticidade continuam, mas seu impacto religioso e político é inegável."
 STATIC_MODIFIER_NAME_sav_alpine_roads_mod: "As Estradas Alpinas"
 STATIC_MODIFIER_DESC_sav_alpine_roads_mod: "O Grande São Bernardo, o Monte Cenis e o São Gotardo — as estradas alpinas foram as principais artérias da Europa dos tempos romanos à Idade Média. Saboia, senhora dessas passagens, tornou-se imensamente rica por pedágios e comércio. Seu papel de “guardiã dos Alpes” foi a raiz de sua prosperidade."
 STATIC_MODIFIER_NAME_sav_crossroads_mod: "Encruzilhada da Europa"
 STATIC_MODIFIER_DESC_sav_crossroads_mod: "O Piemonte fica bem na encruzilhada da França, da Suíça, de Gênova e de Milão. Mercadores italianos a caminho das feiras de Champagne, peregrinos franceses a caminho de Roma, mercenários rumo à Suíça — gente e mercadorias de todo tipo passavam pelo Piemonte, e, supervisionando a estrada, Saboia monopolizava os lucros do comércio de intermediação."
 STATIC_MODIFIER_NAME_sav_order_of_saints_mod: "A Ordem dos Santos Maurício e Lázaro"
 STATIC_MODIFIER_DESC_sav_order_of_saints_mod: "A Ordem dos Santos Maurício e Lázaro combinou duas ordens fundadas pela casa de Saboia em 1434 e 1572, respectivamente. São Maurício foi um mártir cristão da era romana; São Lázaro era venerado como patrono dos leprosos. A ordem tornou-se símbolo da autoridade religiosa da casa de Saboia no mundo católico."
 STATIC_MODIFIER_NAME_sav_savoy_academy_mod: "A Influência da Academia de Saboia"
 STATIC_MODIFIER_DESC_sav_savoy_academy_mod: "Na era do Renascimento, o ducado de Saboia era conhecido por seu mecenato do saber e das artes. A Universidade de Turim, fundada em 1404, tornou-se o centro espiritual do Piemonte, ensinando direito, medicina e teologia. A tradição de mecenato artístico, que mais tarde levaria à Accademia delle Belle Arti sob Carlos Emanuel I, também se enraizou nessa era."
 STATIC_MODIFIER_NAME_sav_alpine_powerhouse_mod: "A Potência Alpina"
 STATIC_MODIFIER_DESC_sav_alpine_powerhouse_mod: "“Pequena, mas forte” — a força de Saboia estava no sábio uso de sua geografia. Cercada pelas grandes potências França, Áustria e Espanha, sobreviveu graças à diplomacia habilidosa e a uma estratégia militar que explorava a natureza da terra, e tornou-se por fim a “dinastia do destino” que conduziu a unificação da Itália."
 STATIC_MODIFIER_NAME_sav_alpine_fortifications_mod: "Fortificações Alpinas"
 STATIC_MODIFIER_DESC_sav_alpine_fortifications_mod: "Implantando grupos de fortalezas, como Briançon, Fenestrelle e Exilles, nos bastiões naturais dos Alpes, Saboia forjou o “escudo dos Alpes”. Nos séculos XVII-XVIII, vieram as fortalezas-bastião ao estilo de Vauban para guardar essas passagens, fazendo de Saboia um dos Estados mais inexpugnáveis da Europa."
 STATIC_MODIFIER_NAME_sav_diplomatic_balance_mod: "Equilíbrio Diplomático"
 STATIC_MODIFIER_DESC_sav_diplomatic_balance_mod: "A essência da diplomacia saboiana era “estar sempre ao lado do mais forte”. Equilibrando-se na corda bamba entre a França e a Áustria, Saboia obteve a Sardenha pelo Tratado de Utrecht (1713) e elevou-se ao posto de reino. Vítor Amadeu II encarnou o auge dessa diplomacia “de equilíbrio”."
 STATIC_MODIFIER_NAME_sav_savoyard_army_mod: "Elite Saboiana"
 STATIC_MODIFIER_DESC_sav_savoyard_army_mod: "Os soldados saboianos eram mestres da guerra de montanha, forjados no rude terreno dos Alpes. As reformas militares do Piemonte nos séculos XIV-XV estabeleceram a “Ordinanza Piemontese”, e a tática de infantaria disciplinada tornou-se a força do exército saboiano. Mesmo no Risorgimento posterior, foram o esteio da libertação do norte da Itália."
 STATIC_MODIFIER_NAME_sav_conquer_genoa_mod: "A Tomada de Gênova"
 STATIC_MODIFIER_DESC_sav_conquer_genoa_mod: "Gênova, rival de Veneza, era uma das maiores cidades-Estado marítimas medievais do Mediterrâneo, estendendo uma enorme rede comercial pelo Mar Negro, pelo norte da África e pela Ibéria. Foi também berço da banca (o Banco de São Jorge é um dos mais antigos do mundo) e dos seguros. A conquista dessa “orgulhosa república” abre a Saboia as portas do Mediterrâneo."
 STATIC_MODIFIER_NAME_sav_nice_naval_base_mod: "Base Naval de Nice"
 STATIC_MODIFIER_DESC_sav_nice_naval_base_mod: "Nice (Nizza Marittima) — antigo porto mediterrâneo, fundado por uma colônia da grega Massália (Marselha). Desde que a casa de Saboia a obteve em 1388, esse porto, na fronteira da França e da Itália, serviu de única base naval de Saboia (permaneceu saboiano até 1860)."
 STATIC_MODIFIER_NAME_sav_sardinia_union_mod: "União com a Sardenha"
 STATIC_MODIFIER_DESC_sav_sardinia_union_mod: "Em 1720, nas reconfigurações após o Tratado de Utrecht, a casa de Saboia trocou a Sicília pela Sardenha e ergueu-se como “Reino da Sardenha”. A união dessa ilha com o Piemonte continental tornar-se-á a base a partir da qual Camillo Cavour e Garibaldi alcançarão a unificação da Itália (1861)."
 STATIC_MODIFIER_NAME_sav_seize_lombardy_mod: "A Tomada da Lombardia"
 STATIC_MODIFIER_DESC_sav_seize_lombardy_mod: "A planície lombarda é uma das terras agrícolas mais férteis da Europa, e Milão é seu centro de indústria e comércio. Recuperar essa rica terra, há muito detida pela Áustria, era objetivo principal do Risorgimento — a encarnação concreta do sonho de Saboia."
 STATIC_MODIFIER_NAME_sav_push_tuscany_mod: "Avanço sobre a Toscana"
 STATIC_MODIFIER_DESC_sav_push_tuscany_mod: "A Toscana, em torno de Florença, é o berço da cultura renascentista, que guarda o maior legado artístico da história da humanidade. Os Uffizi, a catedral, os poemas de Dante — tudo apoiado pelos Médici. Acrescentar esse tesouro cultural a seu território daria ao Reino de Saboia autoridade espiritual."
 STATIC_MODIFIER_NAME_sav_capture_venice_mod: "A Tomada de Veneza"
 STATIC_MODIFIER_DESC_sav_capture_venice_mod: "Veneza, a “Rainha do Adriático”, é uma maravilhosa cidade-Estado que manteve sua independência por mais de mil anos. Cidade de canais, construída sobre ilhas da lagoa, governou por meio do monopólio do comércio oriental e da excelente construção naval do Arsenale, como senhora do Mediterrâneo. Conquistar essa cidade inexpugnável seria um grande feito da história."
 STATIC_MODIFIER_NAME_sav_emilia_and_beyond_mod: "Emília e Além"
 STATIC_MODIFIER_DESC_sav_emilia_and_beyond_mod: "Bolonha, Parma, Módena e Ferrara, dispostas ao longo da Via Emília, eram conhecidas desde a Idade Média como centros de gastronomia, cultura e saber. Bolonha abriga a mais antiga universidade da Europa (fundada em 1088), e sua tradição espiritual aprofundaria a profundidade cultural do Reino de Saboia."
 STATIC_MODIFIER_NAME_sav_march_on_naples_mod: "Marcha sobre Nápoles"
 STATIC_MODIFIER_DESC_sav_march_on_naples_mod: "Tão bela que deu origem ao provérbio “Ver Nápoles e depois morrer”, essa cidade prosperou desde a Antiguidade como uma das grandes cidades do Mediterrâneo. Nápoles, que viveu uma história turbulenta sob os domínios angevino, aragonês, espanhol e bourbônico, foi o último grande obstáculo da unificação da Itália."
 STATIC_MODIFIER_NAME_sav_eternal_rome_mod: "A Cidade Eterna"
 STATIC_MODIFIER_DESC_sav_eternal_rome_mod: "“Todos os caminhos levam a Roma” — capital do antigo Império Romano, sede da Igreja Católica, centro da cultura renascentista, Roma é símbolo da civilização ocidental. O Coliseu, o Panteão, a basílica de São Pedro — fazer de uma cidade de tal peso histórico a própria capital significa completar a unificação da Itália."
 STATIC_MODIFIER_NAME_sav_integrate_geneva_mod: "Integração de Genebra"
 STATIC_MODIFIER_DESC_sav_integrate_geneva_mod: "Genebra esteve outrora sob influência dos condes de Saboia, mas, em 1536, João Calvino fez dela base da Reforma e ela se tornou a “Roma protestante”. Reincorporar essa cidade lacustre seria uma importante cabeça de ponte para a expansão saboiana rumo à Suíça."
 STATIC_MODIFIER_NAME_sav_control_provence_mod: "Domínio da Provença"
 STATIC_MODIFIER_DESC_sav_control_provence_mod: "A Provença foi outrora posse da casa de Anjou e foi anexada à coroa francesa após a morte do rei René (1480). Os campos de lavanda, os olivais e os vinhedos da costa mediterrânea — essa rica terra do sul da França seria chave para uma expansão territorial significativa de Saboia."
 STATIC_MODIFIER_NAME_sav_against_the_swiss_mod: "Contra os Suíços"
 STATIC_MODIFIER_DESC_sav_against_the_swiss_mod: "A Confederação Suíça é um país de guerreiros de montanha indomáveis, que derrotaram Carlos, o Temerário, duque da Borgonha, em 1476-77 em Grandson e Morat. Subjugar esse poderoso vizinho não é tarefa fácil, mas, para Saboia, que usava mercenários suíços (lansquenetes) como guarda palaciana, dominar sua pátria seria a maior vitória militar."
 STATIC_MODIFIER_NAME_sav_conquer_burgundy_mod: "Conquista da Borgonha"
 STATIC_MODIFIER_DESC_sav_conquer_burgundy_mod: "A Borgonha, ramo mais jovem dos Valois, governou em seu auge um imenso “Reino do Meio”, que se estendia dos Países Baixos à Borgonha. Reanexada à França com a morte de Carlos, o Temerário (1477), essa província rica, famosa por seu vinho e sua culinária, tornar-se-ia importante cabeça de ponte para a invasão da França."
 STATIC_MODIFIER_NAME_sav_savoyard_occitania_mod: "A Occitânia Saboiana"
 STATIC_MODIFIER_DESC_sav_savoyard_occitania_mod: "Os povos de língua occitana do sul da França geraram a cultura dos trovadores, mas foram devastados pela Cruzada Albigense do século XIII. Soterrada sob a perseguição aos cátaros e o governo da coroa francesa, a tradição occitana de autogoverno revive sob o estandarte de Saboia."
 STATIC_MODIFIER_NAME_sav_claim_france_mod: "A Reivindicação à França"
 STATIC_MODIFIER_DESC_sav_claim_france_mod: "A França sempre foi, para Saboia, tanto uma ameaça quanto uma tentação. Na era de Napoleão (nascido corso, mas vizinho de Nice), Saboia foi absorvida pela França. Agora é o contrário — uma grande virada em que Saboia conquista o trono do rei francês para si."
 STATIC_MODIFIER_NAME_sav_kingdom_of_italy_mod: "O Reino da Itália"
 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "Em 17 de março de 1861, Vítor Emanuel II (rei da Sardenha) ascendeu como primeiro rei do Reino da Itália — assim ocorreu na história real. O maior milagre político do século XIX, que combinou a diplomacia de Cavour, as armas de Garibaldi e os ideais de Mazzini, alcançado aqui quatro séculos antes."
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "A Glória de Turim"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "O mercado aberto “Balon”, as colinas de Langhe, que dão o Barolo e o Barbaresco, a magnífica Piazza San Carlo — Turim é a capital que a casa de Saboia moldou como principal cidade planejada da Itália. Como herdeira da grade romana de Augusta Taurinorum, essa cidade exibe o rosto mais delicado ao sul dos Alpes."
 sav_events.1.t: "As Ambições da Casa de Saboia"
 sav_events.1.d: "O ducado de Saboia domina as passagens estratégicas dos Alpes, que ligam a Europa do Norte e a do Sul. Com a França e a Itália de ambos os lados, esse pequeno ducado desperta para grandes ambições. O brasão de Saboia — uma cruz branca sobre escudo escarlate — tremulará um dia sobre toda a Itália. Una o Piemonte, tome Gênova, ocupe Roma e funde o Reino da Itália — o sonho milenar da casa de Saboia está pronto para começar."
 sav_events.1.a: "Erguer a glória da casa de Saboia!"
 sav_events.2.t: "A Glória de Turim"
 sav_events.2.d: "Sob o governo da casa de Saboia, Turim se desenvolve rapidamente. Com palácios e igrejas se erguendo por toda a cidade e eruditos e artistas reunidos aqui, essa cidade emerge como centro cultural e político do norte da Itália. O florescimento de Turim como capital digna da casa de Saboia torna-se a base da prosperidade de todo o reino."
 sav_events.2.a: "Turim — a capital resplandecente da casa de Saboia"
 sav_woolens_of_piedmont: "A Indústria da Lã do Piemonte"
 sav_woolens_of_piedmont_desc: "O Piemonte é conhecido como um dos principais produtores de lã e tecidos da Itália. A produção de lã de alta qualidade e o processamento de tecidos criam a base comercial da riqueza saboiana."
 sav_nebbiolo_vineyards: "Os Vinhedos de Nebbiolo"
 sav_nebbiolo_vineyards_desc: "As uvas Nebbiolo, cultivadas nas colinas de Langhe, no Piemonte, são a fonte de vinhos famosos como o Barolo e o Barbaresco. Os vinhos piemonteses são exportados por toda a Europa, trazendo grande lucro."
 sav_casa_savoia: "A Autoridade da Casa de Saboia"
 sav_casa_savoia_desc: "O governo da casa de Saboia se consolidou, e sua autoridade é agora amplamente reconhecida dentro e fora do país. Um governo legítimo e estável é a base que eleva Saboia ao posto de potência italiana significativa."
 sav_ordinanza_piedmontese: "A Ordinanza Piemontese"
 sav_ordinanza_piedmontese_desc: "No século XV, Saboia estabeleceu uma tática de infantaria singular — a Ordinanza Piemontese — forjada nos Alpes elevados. As formações disciplinadas de piqueiros são a espinha dorsal da força militar de Saboia."
 sav_university_of_turin: "A Universidade de Turim"
 sav_university_of_turin_desc: "Fundada em 1404, a Universidade de Turim serve de coração espiritual do Piemonte, ensinando direito, medicina e teologia. O legado espiritual de Saboia sustenta o florescimento da cultura renascentista."
 sav_corsica_seized: "Córsega Tomada"
 sav_corsica_seized_desc: "Tomar a Córsega, há muito governada por Gênova, avança muito o domínio de Saboia sobre o Mar Tirreno ocidental."
 sav_towers_of_sardinia: "As Torres da Sardenha"
 sav_towers_of_sardinia_desc: "Desde a Idade Média, incontáveis torres de vigia (Torre Costiera) alinham-se ao longo do litoral sardo. Desenvolver e fortificar essas instalações defensivas protege a Sardenha de incursões de piratas."
 sav_cagliari_development: "Desenvolvimento de Cagliari"
 sav_cagliari_development_desc: "Desenvolva Cagliari, capital da Sardenha, como importante cidade portuária e nó comercial do Mediterrâneo ocidental."
 sav_tyrrhenian_sea: "Senhor do Mar Tirreno"
 sav_tyrrhenian_sea_desc: "Tendo tomado tanto a Córsega quanto a Sardenha, e construído uma poderosa frota, Saboia estabeleceu pleno domínio sobre o Mar Tirreno. O comércio do Mediterrâneo ocidental passa à proteção saboiana."
 sav_languedoc: "Domínio do Languedoc"
 sav_languedoc_desc: "Tomar o Languedoc, ponto-chave do sul da França. Ocupar as duas grandes cidades de Montpellier e Toulouse torna-se cabeça de ponte para dominar todo o sul da França."
 sav_gascony: "Gasconha Tomada"
 sav_gascony_desc: "A Gasconha, em torno de Bordeaux, é uma rica terra de vinhedos voltada para o Atlântico. Rompa seu longo vínculo histórico com a Inglaterra e acrescente essa terra ao território saboiano."
 sav_lyon_gateway: "A Porta de Lyon"
 sav_lyon_gateway_desc: "Situada na confluência do Ródano e do Saône, Lyon é nó comercial que liga o sul e o norte da França. Tomar essa cidade abre o caminho ao interior da França."
 sav_loire_valley: "O Vale do Loire"
 sav_loire_valley_desc: "O Vale do Loire — “Jardim da França” — onde outrora ergueram-se os castelos da família real francesa. Tomar Nantes e Tours significa a conquista do centro-oeste da França."
 sav_normandy_coast: "A Costa da Normandia"
 sav_normandy_coast_desc: "Tomar a Normandia, costa histórica onde outrora desembarcaram os normandos. Ruão, no coração dessa rica terra, é ponto-chave do norte da França e a última barreira antes de Paris."
 STATIC_MODIFIER_NAME_sav_woolens_of_piedmont_mod: "A Indústria da Lã do Piemonte"
 STATIC_MODIFIER_DESC_sav_woolens_of_piedmont_mod: "O Piemonte foi uma região lanífera de destaque, cujos carneiros se mantinham nos pastos alpinos altos. O distrito de Biella, em particular, era conhecido desde a Idade Média até hoje como uma das melhores fontes de lã e tecido fino da Europa, e a “lã piemontesa” ficava ao lado da lã inglesa como marca de máxima qualidade."
 STATIC_MODIFIER_NAME_sav_nebbiolo_vineyards_mod: "Os Vinhedos de Nebbiolo"
 STATIC_MODIFIER_DESC_sav_nebbiolo_vineyards_mod: "Das uvas Nebbiolo, cultivadas nas colinas de Langhe, no Piemonte, nascem o Barolo, “rei dos vinhos”, e o Barbaresco, “vinho da rainha”. Os registros de seu cultivo remontam ao século XIII, e era apreciado até na corte saboiana — orgulho do Piemonte, ainda amado no mundo todo como o ápice dos vinhos italianos."
 STATIC_MODIFIER_NAME_sav_casa_savoia_mod: "A Autoridade da Casa de Saboia"
 STATIC_MODIFIER_DESC_sav_casa_savoia_mod: "A casa de Saboia é uma das dinastias mais duradouras da Europa, com origem em Humberto Mão-Branca, no século XI. Sua sobrevivência por mais de setecentos anos como “a mais antiga dinastia”, que acabou por tornar-se a casa real do Reino da Itália, mostra uma resistência rara na história das casas reais europeias."
 STATIC_MODIFIER_NAME_sav_ordinanza_piedmontese_mod: "A Ordinanza Piemontese"
 STATIC_MODIFIER_DESC_sav_ordinanza_piedmontese_mod: "A “Ordinanza Piemontese”, organizada pelo ducado de Saboia no século XV, foi um sistema militar permanente disciplinado, centrado na infantaria de piqueiros. Apoiando-se na tática dos mercenários suíços, acrescentando seus próprios refinamentos, tornou-se a base do posterior exército sardo e prenúncio dos exércitos que conduziram as guerras de unificação do Risorgimento."
 STATIC_MODIFIER_NAME_sav_university_of_turin_mod: "A Influência da Universidade de Turim"
 STATIC_MODIFIER_DESC_sav_university_of_turin_mod: "Fundada em 1404, a Universidade de Turim é uma das mais antigas do norte da Itália. Começando com três faculdades — direito, medicina e teologia —, produziu mais tarde mentes notáveis, como Cesare Beccaria (reformador do direito penal) e Lagrange (matemático), e tornou-se o coração espiritual do Piemonte iluminista."
 STATIC_MODIFIER_NAME_sav_corsica_seized_mod: "Córsega Tomada"
 STATIC_MODIFIER_DESC_sav_corsica_seized_mod: "A Córsega é a chave do Mediterrâneo ocidental, que Gênova governou desde 1284. Quando Gênova a vendeu à França em 1768, Napoleão Bonaparte nasceu, no ano seguinte, “francês” — ironia da história. Tomar essa ilha garantiria o domínio do Mar Tirreno ocidental."
 STATIC_MODIFIER_NAME_sav_towers_of_sardinia_mod: "As Torres da Sardenha"
 STATIC_MODIFIER_DESC_sav_towers_of_sardinia_mod: "Ao longo das costas da Sardenha acham-se espalhadas as “torri costiere” (torres costeiras), construídas desde a Idade Média até o início da era moderna. Esse sistema defensivo, erguido para observar incursões berberes, chegou a contar mais de uma centena de torres em seu auge e serviu de rede de alarme, avisando os habitantes da ilha do perigo."
 STATIC_MODIFIER_NAME_sav_cagliari_development_mod: "Prosperidade de Cagliari"
 STATIC_MODIFIER_DESC_sav_cagliari_development_mod: "Cagliari (Karalis) é uma cidade portuária fundada pelos fenícios e importante centro administrativo da era romana. Como capital da Sardenha, no meio do Mediterrâneo, tornou-se nó comercial com Túnis, Espanha e Itália e permaneceu ponto-chave do comércio do Mediterrâneo ocidental sob o domínio aragonês."
 STATIC_MODIFIER_NAME_sav_tyrrhenian_sea_mod: "Senhor do Mar Tirreno"
 STATIC_MODIFIER_DESC_sav_tyrrhenian_sea_mod: "O Mar Tirreno é o mar interior do Mediterrâneo, cercado pela península itálica, a Sicília, a Córsega e a Sardenha — um mar histórico, onde comerciaram os antigos fenícios, gregos e romanos. Dominar a Córsega e a Sardenha permite dominar todo esse mar interior e obter uma cabeça de ponte para avançar sobre o Mediterrâneo oriental."
 STATIC_MODIFIER_NAME_sav_languedoc_mod: "Domínio do Languedoc"
 STATIC_MODIFIER_DESC_sav_languedoc_mod: "O Languedoc (“terra da língua oc”) designa a região do sul da França de língua occitana. Essa região, com capital em Toulouse, ostentava cultura, política e religião próprias (os cátaros), até ser conquistada pela coroa francesa na Cruzada Albigense do século XIII. Seu rescaldo, junto com a Provença, ainda arde numa singular civilização do sul da França."
 STATIC_MODIFIER_NAME_sav_gascony_mod: "Gasconha Tomada"
 STATIC_MODIFIER_DESC_sav_gascony_mod: "A Gasconha é uma região do sudoeste da França de origem basca, conhecida pelo atlântico Bordeaux vinícola, pelo porto de Bayonne e pelo armagnac. Estreitamente ligada à Inglaterra desde o casamento de Leonor da Aquitânia, foi também o último grande campo de batalha da Guerra dos Cem Anos."
 STATIC_MODIFIER_NAME_sav_lyon_gateway_mod: "A Porta de Lyon"
 STATIC_MODIFIER_DESC_sav_lyon_gateway_mod: "Lyon (Lugdunum) foi fundada como capital da província romana da Gália e é uma encruzilhada de comunicações. Na Idade Média, abrigava as maiores feiras regulares da França depois das de Champagne, onde se reuniam mercadores da Itália, de Flandres e da Alemanha. Sua posição na confluência do Ródano e do Saône garantiu-lhe o posto de cidade mercantil por necessidade geográfica."
 STATIC_MODIFIER_NAME_sav_loire_valley_mod: "O Vale do Loire"
 STATIC_MODIFIER_DESC_sav_loire_valley_mod: "No vale do Loire, o “Jardim da França”, erguem-se castelos renascentistas, como Chambord, Chenonceau e Amboise. Os reis franceses dos séculos XV-XVI amavam essa região por seu clima mais ameno que o de Paris, seu rico abastecimento e a segurança da defesa. Dominar essa bela terra significa manter o centro da cultura francesa."
 STATIC_MODIFIER_NAME_sav_normandy_coast_mod: "A Costa da Normandia"
 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "A Normandia é a terra que os vikings (normandos) receberam do rei francês em 911. A invasão da Inglaterra por Guilherme, o Conquistador, em 1066, o maior campo de batalha da Guerra dos Cem Anos, o desembarque na Normandia em 1944 — essa terra foi sempre um ponto de virada da história. Em Ruão também foi executada Joana d’Arc."
 sav_events.3.t: "Formação da Sardenha-Piemonte"
 sav_events.3.d: "Tendo tomado quase toda a Sardenha, a casa de Saboia decidiu assumir formalmente o título de “Rei da Sardenha”. Na história (1720), Saboia obteve a Sardenha na guerra de sucessão espanhola e fundou o “Reino da Sardenha”. Esse reino duplo, Sardenha-Piemonte, tornar-se-á o berço da unificação da Itália. Ao unir o Piemonte continental à ilha da Sardenha, esse reino surgirá como potência significativa do norte da Itália."
 sav_events.3.a: "Tornar-se, como rei da Sardenha, porta-estandarte da unificação da Itália!"
 sav_franchises: "As Franquias Saboianas"
 sav_franchises_desc: "No Piemonte medieval, a casa de Saboia concedeu a várias cidades direitos urbanos, conhecidos como “franquias”. Ao garantir liberdade de movimento, libertação dos camponeses e direitos comerciais ampliados aos mercadores, esse sistema anima a rivalidade urbana e o crescimento do Piemonte. Concluir esta missão permite conceder às províncias o direito urbano “Franquias Saboianas”."
 sav_franchises_unlock_tt: "O privilégio urbano “Franquias” torna-se disponível."
 sav_patria_legis: "Saboia-Vale de Aosta"
 sav_patria_legis_desc: "A “Patria Legis” combina as práticas de autogoverno herdadas do Vale de Aosta com os ideais de governo da casa de Saboia numa estrutura jurídica racional, que reflete o espírito do Renascimento. Concluir esta missão permite conceder às províncias o direito urbano “Saboia-Vale de Aosta”."
 sav_patria_legis_unlock_tt: "O privilégio urbano “Patria Legis” torna-se disponível."
 franchises: "Franquias"
 franchises_desc: "Direitos urbanos, estabelecidos pela casa de Saboia, que garantem liberdade de movimento à população, libertação dos camponeses e direitos comerciais ampliados aos mercadores."
 patria_legis: "Patria Legis"
 patria_legis_desc: "Direitos urbanos que combinam as tradições do Vale de Aosta com os princípios jurídicos saboianos, trazendo prosperidade urbana, mobilidade social e eficiência produtiva."
