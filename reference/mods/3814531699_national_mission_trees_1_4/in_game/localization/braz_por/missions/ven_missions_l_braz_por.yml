l_braz_por:
 VEN_DOGES_PALACE_EVENT_OCCURRED: "O evento “Ampliação do Palácio Ducal” ocorreu"
 ven_mainland_food_crisis: "Crise Alimentar do Continente"
 ven_mainland_food_crisis_desc: "Veneza, cidade construída sobre a lagoa, depende do suprimento de grãos do continente. Construa uma rede estável de abastecimento de alimentos."
 ven_scaliger_war: "Guerra contra os della Scala"
 ven_scaliger_war_desc: "Derrote a casa della Scala, que governa Verona, e assegure Treviso e Vicenza."
 ven_mainland_consolidation: "Consolidação do Continente"
 ven_mainland_consolidation_desc: "Incorpore administrativamente as terras continentais recém-conquistadas e estabilize as relações com a nobreza e as instituições de governo."
 ven_terraferma_expansion: "Expansão da Terraferma"
 ven_terraferma_expansion_desc: "Conquiste Verona e Bérgamo e amplie ainda mais as posses continentais da Terraferma."
 ven_warehouse_expansion: "Ampliação dos Armazéns"
 ven_warehouse_expansion_desc: "Amplie as instalações de armazenagem de Veneza para dar conta do volume crescente do comércio."
 ven_piazza_san_marco: "Desenvolvimento da Praça de São Marcos"
 ven_piazza_san_marco_desc: "Desenvolva a Praça de São Marcos, símbolo da República, para multiplicar o prestígio da nobreza."
 ven_canal_administration: "Administração dos Canais"
 ven_canal_administration_desc: "Melhore a rede de canais que atravessa Veneza para aumentar a eficiência das operações marítimas."
 ven_fondaco: "O Fondaco"
 ven_fondaco_desc: "Erga uma rede de casas comerciais (Fondaci) para mercadores estrangeiros e amplie os postos comerciais."
 ven_bridge_of_wealth: "A Ponte da Riqueza"
 ven_bridge_of_wealth_desc: "Um fluxo ininterrupto de mercadores cruza a ponte até o Fondaco. Desenvolva o distrito comercial em torno dessa ponte e deixe que a corrente de riqueza continue crescendo."
 ven_doges_palace: "Renovação do Palácio Ducal"
 ven_doges_palace_desc: "Desenvolva o Palácio Ducal, símbolo da autoridade do doge, para reforçar a estrutura de governo da República."
 ven_doges_palace_event_occurred_tt: "A decisão “Expandindo o Palácio do Doge” foi usada"
 ven_arsenal: "O Arsenale di Venezia"
 ven_arsenal_desc: "Amplie o estaleiro estatal, o Arsenale, e eleve a capacidade de construção naval da República a nível mundial."
 ven_marciana_library: "A Biblioteca Marciana"
 ven_marciana_library_desc: "Erga uma biblioteca nacional, com biblioteca e universidade, e multiplique o prestígio acadêmico da República."
 ven_lombardy_hegemony: "Hegemonia sobre a Lombardia"
 ven_lombardy_hegemony_desc: "Com o estandarte da República sobre os mercados de Milão, os mercadores de toda a Lombardia reconhecem o novo senhor."
 ven_settling_with_genoa: "Ajuste de Contas com Gênova"
 ven_settling_with_genoa_desc: "Leve a antiga rivalidade comercial com Gênova a um desfecho definitivo. Tome seu porto de origem ou apague Gênova do mapa por completo."
 ven_city_of_water: "A Cidade da Água"
 ven_city_of_water_desc: "Conclua a cidade da lagoa, Veneza, como cidade de riqueza inigualável, entretecida de vias d’água e comércio."
 ven_secure_ferrara: "Assegure Ferrara"
 ven_secure_ferrara_desc: "Tome Ferrara, governada pela casa d’Este, e obtenha uma cabeça de ponte na Padânia."
 ven_northern_expansion: "Expansão para o Norte"
 ven_northern_expansion_desc: "Assegure Trento e Údine e impulsione a expansão rumo ao norte, de olho nas passagens alpinas."
 ven_papal_conflict: "Conflito com os Estados Pontifícios"
 ven_papal_conflict_desc: "Cresce a tensão com os Estados Pontifícios pelo status de Ferrara. Supere esse conflito."
 ven_alpine_trade: "Comércio Transalpino"
 ven_alpine_trade_desc: "As caravanas que cruzam as passagens alpinas já não estão ligadas a um único mercado, pois se ergueu uma vasta rede comercial de múltiplos centros."
 ven_render_unto_caesar: "Dai a César o que é de César"
 ven_render_unto_caesar_desc: "Tendo conquistado a confiança tanto do clero quanto dos burgueses, a autoridade da República permanece incontestada até na Cidade Eterna, Roma."
 ven_league_of_cambrai: "Quebre a Liga de Cambrai"
 ven_league_of_cambrai_desc: "Rompa o cerco da Liga de Cambrai, formada pelas potências da Europa, e defenda a independência da República."
 ven_terraferma_completed: "Conclusão da Terraferma"
 ven_terraferma_completed_desc: "Complete a estrutura administrativa das posses continentais da Terraferma e estabeleça a autoridade da República sobre o norte da Itália."
 ven_italian_unity_route: "A Sereníssima"
 ven_italian_unity_route_desc: "Torne-se a principal potência entre os Estados italianos e o centro de uma nova ordem na península."
 ven_fleet_unification: "Preparação das Frotas"
 ven_fleet_unification_desc: "Unifique o comando das diversas frotas da República e melhore a eficiência da manutenção da frota."
 ven_black_sea_insurance: "Assegure o Comércio do Mar Negro"
 ven_black_sea_insurance_desc: "Erga, com Negroponte como base, um sistema de escolta das rotas comerciais rumo ao Mar Negro."
 ven_secure_adriatic: "Assegure o Adriático"
 ven_secure_adriatic_desc: "Assegure Zara e Pola e traga o domínio do Adriático às mãos da República."
 ven_expel_genoa_black_sea: "Expulse Gênova do Mar Negro"
 ven_expel_genoa_black_sea_desc: "Assegure Caffa e Tana, postos-chave do comércio do Mar Negro, e tome os interesses de Gênova, a maior rival da República."
 ven_aegean_expansion: "Expansão no Mar Egeu"
 ven_aegean_expansion_desc: "Assegure Creta e Naxos e amplie a cabeça de ponte da República no Mar Egeu."
 ven_dalmatian_subjugation: "Subjugação da Dalmácia"
 ven_dalmatian_subjugation_desc: "Assegure todo o litoral croata e traga a região da Dalmácia ao domínio da República."
 ven_dominate_eastern_trade: "Domine o Comércio Oriental"
 ven_dominate_eastern_trade_desc: "Traga as rotas comerciais do Mar Negro e do Mediterrâneo oriental ao controle da República e conquiste a supremacia no comércio oriental."
 ven_greek_bridgehead: "Cabeça de Ponte na Grécia"
 ven_greek_bridgehead_desc: "Assegure Creta e Modon e estabeleça uma cabeça de ponte no coração grego e no Mar Egeu."
 ven_pearl_of_adriatic: "Reconstrua a Pérola do Adriático"
 ven_pearl_of_adriatic_desc: "Restaure a prosperidade da cidade comercial de Ragusa e traga à República a riqueza conhecida como “pérola do Adriático”."
 ven_protect_corfu: "Proteja Corfu"
 ven_protect_corfu_desc: "Posicione uma guarnição em Corfu, que domina a entrada do Adriático, e assegure sua defesa."
 ven_occupy_cyprus: "Ocupação de Chipre"
 ven_occupy_cyprus_desc: "Assegure Larnaca e faça da estrategicamente importante ilha de Chipre uma província da República."
 ven_second_conquest_of_constantinople: "A Segunda Conquista de Constantinopla"
 ven_second_conquest_of_constantinople_desc: "Traga, como outrora a Quarta Cruzada, Constantinopla de novo ao controle da República."
 ven_queen_of_the_adriatic: "A Rainha do Adriático"
 ven_queen_of_the_adriatic_desc: "Complete a rede comercial e defensiva sobre todo o Adriático e eleve a República ao posto de “Rainha do Adriático”."
 ven_pen_not_sword: "Volte-se à Pena, Não à Espada"
 ven_pen_not_sword_desc: "Assegure os interesses da República no Mediterrâneo oriental por diplomacia e tratados, e não por força militar, e garanta prosperidade duradoura."
 ven_latin_empire: "O Império Latino"
 ven_latin_empire_desc: "Erga o novo Império Latino com centro em Constantinopla e inscreva a República na história como senhora do Mediterrâneo."
 ven_grand_strategy_mission_pack: "A Grande Estratégia da República Marítima"
 ven_grand_strategy_mission_pack_desc: "Uma pequena república, construída sobre a lagoa, segue dois caminhos ao mesmo tempo: a expansão para o continente e a construção de um império marítimo. Conclua a Terraferma, torne-se Rainha do Adriático e, por fim, inscreva seu nome na história como centro da Itália — ou herdeira do Império Latino."
 ven_grand_strategy_mission_pack_BUTTON_TOOLTIP:0 "Estabeleça a supremacia da República em terra e mar."
 ven_grand_strategy_mission_pack_DESCRIPTION:0 "Uma pequena república, construída sobre a lagoa, segue dois caminhos ao mesmo tempo: a expansão para o continente e a construção de um império marítimo. Inscreva seu nome na história do Mediterrâneo como Rainha do Adriático."
 ven_grand_strategy_mission_pack_BUTTON_DETAILS:0 "Conclua a Terraferma, torne-se Rainha do Adriático e herdeira do Império Latino — inscreva o nome da República na história!"
 ven_grand_strategy_mission_pack_CRITERIA_DESCRIPTION:0 "Conclua, como Veneza, a Terraferma e torne-se Rainha do Adriático."
 ven_events.1.t: "A Queda dos della Scala"
 ven_events.1.d: "A guerra contra os tiranos della Scala, de Verona, termina com a vitória veneziana. Os cidadãos de Treviso e Vicenza saúdam seus novos senhores. O primeiro passo ao continente foi dado."
 ven_events.1.a: "Saudar as novas províncias"
 ven_events.2.t: "A Ascensão da Terraferma"
 ven_events.2.d: "Verona e Bérgamo passam ao estandarte da República. Os férteis campos e as cidades comerciais da planície lombarda reforçam ainda mais o poder econômico de Veneza."
 ven_events.2.a: "Apoiar o desenvolvimento econômico das novas províncias"
 ven_events.3.t: "A Magnificência do Palácio Ducal"
 ven_events.3.d: "O reconstruído Palácio Ducal está concluído, encarnando a autoridade do doge e o prestígio da República. Em seus salões, a nobreza se reúne para deliberar sobre o futuro da República."
 ven_events.3.a: "Celebrar a conclusão do palácio"
 ven_events.4.t: "Ampliação do Arsenale"
 ven_events.4.d: "O estaleiro estatal, o Arsenale, ampliado, produz agora galés e navios mercantes numa escala sem precedentes. O poder naval da República alcança novas alturas."
 ven_events.4.a: "Visitar o Arsenale ampliado"
 ven_events.5.t: "Conclusão da Cidade da Água"
 ven_events.5.d: "Canais, casas comerciais, bibliotecas, estaleiros — a cidade construída sobre a lagoa alcançou uma prosperidade sem igual no mundo. A “Cidade da Água” tornou-se digna de seu nome."
 ven_events.5.a: "Proclamar a conclusão da Cidade da Água"
 ven_events.6.t: "A Guerra por Ferrara"
 ven_events.6.d: "As relações com os Estados Pontifícios se tensionam pelo status de Ferrara. O clero condena as ambições da República, mas os burgueses acolhem com satisfação a aquisição territorial."
 ven_events.6.a: "Resolver a tensão com os Estados Pontifícios"
 ven_events.7.t: "Dai a César o que é de César"
 ven_events.7.d: "A República esclareceu a fronteira entre a prerrogativa eclesiástica e a atividade comercial secular. A autoridade da igreja é respeitada, mas o comércio e o ofício permanecem firmemente sob controle da República."
 ven_events.7.a: "Proclamar a confirmação da autoridade secular"
 ven_events.8.t: "A Queda da Liga de Cambrai"
 ven_events.8.d: "A Liga de Cambrai, formada pelo papa, o imperador do Sacro Império Romano, a França e a Espanha, buscava dividir a República. Mas disputas internas levaram ao colapso da liga, e Veneza preservou sua independência."
 ven_events.8.a: "Ver a liga ruir"
 ven_events.9.t: "Terraferma Concluída"
 ven_events.9.d: "As vastas províncias do norte da Itália foram enfim incorporadas ao sistema administrativo da República. A Terraferma ergue-se agora como base inabalável do poder econômico e militar de Veneza."
 ven_events.9.a: "Celebrar a conclusão da Terraferma"
 ven_events.10.t: "O Centro da Itália"
 ven_events.10.d: "Tendo reunido força em terra e mar, a República já não é uma mera potência regional da península itálica. Os demais Estados acompanham cada passo de Veneza, e a nova ordem da península começa a tomar forma."
 ven_events.10.a: "Estabelecer a posição de liderança na Itália"
 ven_events.11.t: "As Portas do Adriático"
 ven_events.11.d: "Com Zara e Pola sob controle da República, as posições-chave que dominam a entrada do Adriático estão asseguradas. As frotas da República podem agora navegar com mais confiança."
 ven_events.11.a: "Reforçar a defesa das novas cabeças de ponte"
 ven_events.12.t: "A Retirada de Gênova do Mar Negro"
 ven_events.12.d: "Gênova, antiga rival da República, perdeu suas mais importantes cabeças de ponte do comércio do Mar Negro. Mercadores venezianos começam a penetrar nos mercados recém-abertos."
 ven_events.12.a: "Apoiar a expansão para os novos mercados"
 ven_events.13.t: "Cabeça de Ponte no Egeu"
 ven_events.13.d: "Com Creta e Modon asseguradas, estabelece-se uma cabeça de ponte no Mar Egeu e no coração grego. Os navios mercantes da República continuam a ampliar suas rotas orientais, usando esses portos como estações intermediárias."
 ven_events.13.a: "Desenvolver os novos portos intermediários"
 ven_events.14.t: "A Pérola de Chipre"
 ven_events.14.d: "Famagusta e Nicósia juntaram-se às posses da República. A estrategicamente importante ilha de Chipre traz à República mais riqueza com o comércio de especiarias, açúcar e algodão."
 ven_events.14.a: "Desenvolver a economia de Chipre"
 ven_events.15.t: "A Constantinopla, de Novo"
 ven_events.15.d: "Pela primeira vez desde a Quarta Cruzada, Veneza alcançou a ocupação de Constantinopla. A memória da antiga divisão reacende as ambições da República."
 ven_events.15.a: "Construir uma nova estrutura administrativa"
 ven_events.16.t: "A Rainha do Adriático"
 ven_events.16.d: "A prosperidade de Ragusa, chamada “pérola do Adriático”, e a firme defesa de Corfu estão agora concluídas. A República já não é uma mera potência do Adriático — é a própria senhora do mar."
 ven_events.16.a: "Assumir o título de “Rainha do Adriático”"
 ven_events.17.t: "O Triunfo da Pena"
 ven_events.17.d: "A República assegurou seus interesses em Chipre e na região circundante não por força militar, mas por diplomacia e tratados. “Voltemo-nos à pena, não à espada” — esse torna-se o novo credo da República."
 ven_events.17.a: "Celebrar o triunfo diplomático"
 ven_events.18.t: "O Império Latino, Renascido"
 ven_events.18.d: "O novo Império Latino erguido com centro em Constantinopla. As rotas comerciais do Mediterrâneo, os celeiros do continente, a riqueza do Oriente — tudo isso está agora nas mãos de Veneza. A República ergueu um novo soberano vassalo, o “Império Latino”, com capital em Constantinopla, para governar a Trácia, a Macedônia, o coração grego, a Moreia e as Ilhas Egeias — e a pequena república do Adriático ergue-se agora ela própria como império. O Senado proclama ao mundo o novo posto imperial da República."
 ven_events.18.a: "Proclamar o estabelecimento do Império Latino"
 STATIC_MODIFIER_NAME_ven_grain_reserves: "Reservas de Grãos"
 STATIC_MODIFIER_DESC_ven_grain_reserves: "Grãos trazidos do continente enchem a cidade da lagoa e trazem alívio a seu povo."
 STATIC_MODIFIER_NAME_ven_scaliger_victory: "Vitória na Guerra contra os della Scala"
 STATIC_MODIFIER_DESC_ven_scaliger_victory: "Tendo esmagado os tiranos de Verona, os soldados levam nova confiança às campanhas continentais que virão."
 STATIC_MODIFIER_NAME_ven_mainland_order: "Ordem no Continente"
 STATIC_MODIFIER_DESC_ven_mainland_order: "Mesmo nas províncias recém-conquistadas, o direito e a administração da República funcionam agora com suavidade."
 STATIC_MODIFIER_NAME_ven_terraferma_growth: "Crescimento da Terraferma"
 STATIC_MODIFIER_DESC_ven_terraferma_growth: "As férteis terras da Terraferma trazem nova riqueza à República."
 STATIC_MODIFIER_NAME_ven_fondaco_supply: "Rede de Abastecimento do Fondaco"
 STATIC_MODIFIER_DESC_ven_fondaco_supply: "Os armazéns ampliados enchem-se sem cessar com as mercadorias que chegam de todos os cantos da rede comercial."
 STATIC_MODIFIER_NAME_ven_san_marco_square: "A Praça de São Marcos"
 STATIC_MODIFIER_DESC_ven_san_marco_square: "A Praça de São Marcos renovada mostra a cada visitante o prestígio da República."
 STATIC_MODIFIER_NAME_ven_canal_efficiency: "Eficiência dos Canais"
 STATIC_MODIFIER_DESC_ven_canal_efficiency: "As embarcações deslizam agora com mais fluidez pelos canais melhorados do que nunca."
 STATIC_MODIFIER_NAME_ven_fondaco_network: "O Fondaco"
 STATIC_MODIFIER_DESC_ven_fondaco_network: "Mercadores estrangeiros, reunidos nas casas comerciais, trazem nova vida aos mercados da República."
 STATIC_MODIFIER_NAME_ven_bridge_of_wealth_bonus: "A Ponte da Riqueza"
 STATIC_MODIFIER_DESC_ven_bridge_of_wealth_bonus: "As caravanas que cruzam a ponte pela lagoa levam suas mercadorias quase sem parar nas alfândegas do caminho."
 STATIC_MODIFIER_NAME_ven_doges_authority: "Autoridade do Doge"
 STATIC_MODIFIER_DESC_ven_doges_authority: "A magnificência do Palácio Ducal dá peso a cada palavra do doge."
 STATIC_MODIFIER_NAME_ven_arsenal_production: "Produção do Arsenale"
 STATIC_MODIFIER_DESC_ven_arsenal_production: "No Arsenale ampliado, os artesãos trabalham dia e noite, montando galés."
 STATIC_MODIFIER_NAME_ven_marciana_biblioteca: "A Biblioteca Marciana"
 STATIC_MODIFIER_DESC_ven_marciana_biblioteca: "A Biblioteca Marciana, projetada por Sansovino (iniciada em 1537), é um tesouro de manuscritos antigos, tendo por base o acervo de Petrarca. Manuscritos gregos trazidos por eruditos que fugiram após a queda de Constantinopla, em 1453, reuniram-se em Veneza e contribuíram muito para espalhar o Renascimento ao Ocidente."
 STATIC_MODIFIER_NAME_ven_lombardy_dominance: "Hegemonia sobre a Lombardia"
 STATIC_MODIFIER_DESC_ven_lombardy_dominance: "As oficinas e artesãos de Milão produzem mais sob a liderança da República."
 STATIC_MODIFIER_NAME_ven_genoese_settlement: "Ajuste de Contas com Gênova"
 STATIC_MODIFIER_DESC_ven_genoese_settlement: "Com a rivalidade com Gênova encerrada, os mercadores da República ganham cada vez mais experiência em negociação e comércio."
 STATIC_MODIFIER_NAME_ven_queen_of_canals: "Rainha dos Canais"
 STATIC_MODIFIER_DESC_ven_queen_of_canals: "Os navios que enchem os canais e os palácios que sombreiam suas margens encantam viajantes de todo o mundo."
 STATIC_MODIFIER_NAME_ven_ferrara_secured: "Ferrara Assegurada"
 STATIC_MODIFIER_DESC_ven_ferrara_secured: "Com Ferrara assegurada, a tensão com os Estados Pontifícios já não abala a República como antes."
 STATIC_MODIFIER_NAME_ven_alpine_frontier: "Fronteira Alpina"
 STATIC_MODIFIER_DESC_ven_alpine_frontier: "As caravanas que cruzam as passagens alpinas já não temem os perigos do caminho."
 STATIC_MODIFIER_NAME_ven_papal_tension: "Tensão com os Estados Pontifícios"
 STATIC_MODIFIER_DESC_ven_papal_tension: "A tensão com o papado persiste, mas os mercadores da República continuam seu comércio sem se abalar."
 STATIC_MODIFIER_NAME_ven_alpine_trade_routes: "Rotas Comerciais Transalpinas"
 STATIC_MODIFIER_DESC_ven_alpine_trade_routes: "As caravanas que cruzam as passagens alpinas já não temem as íngremes estradas montanhosas, levando suas mercadorias."
 STATIC_MODIFIER_NAME_ven_secular_authority: "Autoridade Secular"
 STATIC_MODIFIER_DESC_ven_secular_authority: "Embora Estado católico, Veneza não hesitou em submeter a autoridade eclesiástica ao controle do Estado. A República chegou a interferir na nomeação do clero, na gestão dos bens da igreja e na disciplina dos mosteiros, negociando com o papa sem temor de excomunhão. Esse secularismo, quase uma “blasfêmia sagrada”, dava a Veneza uma flexibilidade singular."
 STATIC_MODIFIER_NAME_ven_cambrai_survived: "Liga de Cambrai Superada"
 STATIC_MODIFIER_DESC_ven_cambrai_survived: "Tendo sobrevivido ao cerco, os soldados e diplomatas da República demonstram uma confiança renovada."
 STATIC_MODIFIER_NAME_ven_terraferma_zenith: "O Auge da Terraferma"
 STATIC_MODIFIER_DESC_ven_terraferma_zenith: "As vastas províncias do norte da Itália seguem agora a vontade da República."
 STATIC_MODIFIER_NAME_ven_italian_unity_unlock: "Posto de Centro da Itália"
 STATIC_MODIFIER_DESC_ven_italian_unity_unlock: "Nenhum Estado da península itálica ousa agir sem antes considerar a posição de Veneza."
 STATIC_MODIFIER_NAME_ven_unified_fleet: "Frota Unificada"
 STATIC_MODIFIER_DESC_ven_unified_fleet: "A frota unificada está pronta para zarpar a qualquer momento."
 STATIC_MODIFIER_NAME_ven_black_sea_protection: "Proteção do Comércio do Mar Negro"
 STATIC_MODIFIER_DESC_ven_black_sea_protection: "Comboios escoltados navegam com confiança do porto de Negroponte ao Mar Negro."
 STATIC_MODIFIER_NAME_ven_adriatic_secured: "Adriático Assegurado"
 STATIC_MODIFIER_DESC_ven_adriatic_secured: "Os portos de Zara e Pola servem agora de abrigos seguros aos navios da República."
 STATIC_MODIFIER_NAME_ven_zadar_trade_hub: "Posto Comercial de Zadar"
 STATIC_MODIFIER_DESC_ven_zadar_trade_hub: "No porto reconstruído de Zadar, os navios mercantes que cruzam o Adriático descarregam sua carga um após o outro."
 STATIC_MODIFIER_NAME_ven_genoese_rivalry_won: "Vitória sobre a Rivalidade Genovesa"
 STATIC_MODIFIER_DESC_ven_genoese_rivalry_won: "O estandarte genovês já não tremula sobre os postos do comércio do Mar Negro."
 STATIC_MODIFIER_NAME_ven_aegean_dominance: "Supremacia no Egeu"
 STATIC_MODIFIER_DESC_ven_aegean_dominance: "Navios sob a bandeira da República passam sem cessar pelos portos de Creta e Naxos."
 STATIC_MODIFIER_NAME_ven_dalmatia_subdued: "Dalmácia Subjugada"
 STATIC_MODIFIER_DESC_ven_dalmatia_subdued: "O litoral dálmata figura agora em todos os mapas como posse da República."
 STATIC_MODIFIER_NAME_ven_eastern_trade_dominance: "Supremacia no Comércio Oriental"
 STATIC_MODIFIER_DESC_ven_eastern_trade_dominance: "As especiarias e sedas do Oriente passam agora sem esforço pelos mercados de Veneza."
 STATIC_MODIFIER_NAME_ven_greek_bridgehead_secured: "Cabeça de Ponte Grega Assegurada"
 STATIC_MODIFIER_DESC_ven_greek_bridgehead_secured: "De Creta e Modon, os navios da República avançam mais ao leste, rumo aos mares gregos."
 STATIC_MODIFIER_NAME_ven_pearl_prosperity: "Prosperidade da Pérola"
 STATIC_MODIFIER_DESC_ven_pearl_prosperity: "Os mercados de Ragusa voltam a ressoar com as vozes de mercadores, tendo recuperado a antiga vitalidade."
 STATIC_MODIFIER_NAME_ven_corfu_garrison: "Guarnição de Corfu"
 STATIC_MODIFIER_DESC_ven_corfu_garrison: "A guarnição nas muralhas de Corfu guarda em silêncio as portas do Adriático."
 STATIC_MODIFIER_NAME_ven_cyprus_secured: "Chipre Assegurado"
 STATIC_MODIFIER_DESC_ven_cyprus_secured: "O açúcar e o algodão dos portos de Chipre enchem os armazéns da República."
 STATIC_MODIFIER_NAME_ven_latin_empire_foundation: "Fundação do Império Latino"
 STATIC_MODIFIER_DESC_ven_latin_empire_foundation: "De novo o estandarte dos latinos tremula sobre os palácios de Constantinopla. Sob o domínio da República, gentes de muitas fés vivem em paz silenciosa."
 STATIC_MODIFIER_NAME_ven_adriatic_queen: "Rainha do Adriático"
 STATIC_MODIFIER_DESC_ven_adriatic_queen: "Como senhora do Adriático, a República ganha o direito de nomear mais um almirante para comandar suas frotas."
 STATIC_MODIFIER_NAME_ven_diplomatic_mastery: "Maestria Diplomática"
 STATIC_MODIFIER_DESC_ven_diplomatic_mastery: "Os enviados da República conseguem condições favoráveis sem jamais desembainhar a espada. A hostilidade contra a República no exterior diminui, e seus negociadores aproveitam sua vantagem na guerra com grande maestria."
 STATIC_MODIFIER_NAME_ven_latin_empire_unlock: "O Império Latino"
 STATIC_MODIFIER_DESC_ven_latin_empire_unlock: "As rotas comerciais do Mediterrâneo, os celeiros do continente, a riqueza do Oriente — tudo isso está agora nas mãos de Veneza."
 ven_italian_unity_unlock_tt: "Veneza concluiu a fundação da unidade italiana. A Sereníssima une a península itálica do Adriático aos Alpes — pela primeira vez desde a Roma antiga, toda a Itália é governada sob um só estandarte."
 ven_latin_empire_unlock_tt: "O Império Latino (LAT), com capital em Constantinopla, fundado como Estado vassalo sob proteção veneziana."
