l_braz_por:
 nor_kongedommen_mission_pack: "Kongeriket Norge — A Glória da Noruega"
 nor_kongedommen_mission_pack_DESCRIPTION:0 "Em 1337, a Noruega está em união pessoal com a Suécia sob o rei Magno Eriksson, ainda sob influência dinamarquesa. Como herdeiros dos vikings, liberte-se da Dinamarca e una a Escandinávia. Por meio dos pesqueiros de Bergen, do domínio do Mar do Norte, das colônias na Islândia e na Groenlândia e da grande navegação rumo a Vinland — e com a escolha da fé (católica, luterana ou nórdica) — construa o Império Norueguês."
 nor_kongedommen_mission_pack_CRITERIA_DESCRIPTION:0 "Como Noruega, alcance independência, unidade, domínio do Atlântico Norte e um império colonial, para estabelecer o Império Norueguês."
 nor_kongedommen_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para construir o Império Norueguês."
 nor_kongedommen_mission_pack_BUTTON_DETAILS:0 "Com o orgulho dos herdeiros dos vikings, forje a Noruega num Império!"
 nor_kingdom_of_norway: "O Reino da Noruega"
 nor_kingdom_of_norway_desc: "Em 1337, a Noruega está em união pessoal com a Suécia sob o rei Magno Eriksson, enquanto a influência dinamarquesa ameaça sem cessar o Norte. Como herdeiros dos vikings, reforce a legitimidade real e firme os alicerces de um reino norueguês independente."
 nor_control_denmark: "Controle a Dinamarca"
 nor_control_denmark_desc: "A Dinamarca é a maior ameaça e rival histórica da Noruega. Tomar Copenhague ou tornar a Dinamarca vassala norueguesa transfere à Noruega a liderança na União de Kalmar."
 nor_sweden_union: "União Pessoal com a Suécia"
 nor_sweden_union_desc: "Reforce e preserve a união pessoal com a Suécia, para que toda a força do norte da Escandinávia se reúna sob a Noruega. Continue o governo do rei Magno e faça dessa aliança a base da unidade escandinava."
 nor_unite_scandinavia: "Una a Escandinávia"
 nor_unite_scandinavia_desc: "Dinamarca controlada, Suécia em união pessoal — toda a Escandinávia unida sob o estandarte norueguês. Desde os tempos vikings, o momento histórico em que o mundo do norte é governado sob um só rei chegou aqui."
 nor_sound_toll: "A Taxa do Öresund"
 nor_sound_toll_desc: "Com a Dinamarca derrotada, o estreito de Öresund cai sob controle norueguês. Cobrar a Taxa do Öresund gera enorme renda."
 nor_develop_stockholm: "Desenvolva Estocolmo"
 nor_develop_stockholm_desc: "Por meio da união sueca, desenvolva Estocolmo como nó administrativo oriental do Império Norueguês."
 nor_secure_bergen: "Assegure Bergen"
 nor_fleet_of_norway: "A Frota da Noruega"
 nor_fleet_of_norway_desc: "Os noruegueses — descendentes dos vikings — são um povo do mar. Construir uma poderosa frota com base em Bergen estabelece capacidade de emprego em todo o Mar do Norte, o Atlântico Norte e o Báltico."
 nor_north_sea_markets: "Mercados do Mar do Norte"
 nor_north_sea_markets_desc: "A Noruega usa sua vantagem geográfica voltada para o Mar do Norte para desenvolver o comércio. Estabeleça a Noruega como protagonista do comércio do Mar do Norte, com renda mensal 100+ e vários centros comerciais."
 nor_iceland_colony: "Controle a Islândia"
 nor_iceland_colony_desc: "A Islândia foi povoada por noruegueses em 874 — uma base ultramarina da cultura norueguesa. Possuir várias províncias islandesas completa a cabeça de ponte no Atlântico Norte e aproxima a Groenlândia e Vinland."
 nor_greenland_expedition: "A Expedição à Groenlândia"
 nor_greenland_expedition_desc: "Em 985, Érico, o Vermelho (Eiríkr rauði), fundou uma colônia na Groenlândia. Dê esse primeiro passo rumo ao continente ocidental e abra o caminho para a lendária Vinland."
 nor_vinland: "Vinland"
 nor_orkney_shetland: "Orkney e Shetland"
 nor_orkney_shetland_desc: "Orkney e Shetland estão sob influência norueguesa desde os tempos vikings. Assegurar essas ilhas estratégicas melhora muito a capacidade de emprego no Mar do Norte e rumo às Ilhas Britânicas."
 nor_conquer_scotland: "Conquiste a Escócia"
 nor_conquer_scotland_desc: "A costa ocidental da Escócia e as Hébridas foram outrora sob domínio viking. Tomar Edimburgo e as Hébridas abre o caminho para York — capital do Danelaw."
 nor_invade_england: "Invada a Inglaterra"
 nor_invade_england_desc: "York foi outrora capital do reino norueguês de Jórvík. Forças norueguesas que ocupam York ressuscitam a memória do Danelaw em nossos dias."
 nor_kingdom_of_britain: "O Reino da Grã-Bretanha"
 nor_master_of_north_sea: "Senhor do Mar do Norte"
 nor_master_of_north_sea_desc: "Mercados do Mar do Norte assegurados, Orkney e Shetland tomadas — a Noruega é a incontestada senhora do Mar do Norte. Com frota 50+ e renda 200+, o estandarte norueguês tremula sobre todo o Mar do Norte."
 nor_secure_nidaros: "Assegure Nidaros"
 nor_fisheries: "Desenvolva a Pesca"
 nor_fisheries_desc: "A Noruega é a maior potência pesqueira da Europa. Bacalhau, arenque e salmão enchem o Atlântico Norte em abundância. Desenvolva plenamente a pesca dessa nação e estabeleça um sistema de exportação em massa ao Mar do Norte e ao Báltico."
 nor_timber_industry: "A Indústria Madeireira"
 nor_arctic_trade: "Comércio Ártico"
 nor_develop_oslo: "Desenvolva Oslo"
 nor_absolutism: "Absolutismo"
 nor_absolutism_desc: "Estabeleça a monarquia absoluta na Noruega. Elevar o poder real e fortalecer a legitimidade prepara a base para um governo imperial centralizado."
 nor_northern_economy: "A Economia do Norte"
 nor_northern_economy_desc: "O comércio ártico e as reformas econômicas da monarquia absoluta — a economia norueguesa alcança o mais alto nível da Europa setentrional. Demonstre-o com renda mensal 300+ e vários centros comerciais."
 nor_religious_question: "A Questão da Fé"
 nor_religious_question_desc: "A tempestade da Reforma chegou à Noruega. O clero da catedral de Nidaros pede lealdade a Roma. Mas cada vez mais gente encontra eco na nova doutrina de Lutero. E — alguns sonham com um retorno aos antigos deuses. A escolha do rei norueguês decidirá a alma desse reino setentrional."
 nor_catholic_norway: "A Noruega Católica"
 nor_catholic_norway_desc: "O Reino da Noruega mantém fidelidade à Igreja de Roma. Guardando a tradição do catolicismo setentrional, simbolizada pela catedral de Nidaros, faça da Noruega guardiã da civilização católica do norte por meio de estreitos laços com o papa."
 nor_northern_crusade: "A Cruzada do Norte"
 nor_northern_crusade_desc: "A Noruega participa da guerra santa como escudo setentrional da cristandade. Lutando contra os infiéis, a autoridade religiosa e o prestígio norueguês crescem."
 nor_papal_champion: "Campeã do Papa"
 nor_papal_champion_desc: "Profunda confiança com o papado e controle de Lübeck — a Noruega estabeleceu a posição inabalável de mais forte guardiã da civilização católica do norte."
 nor_reformation: "A Reforma"
 nor_reformation_desc: "A Noruega adota o luteranismo (ou o calvinismo). Os bens da igreja passam à coroa, fortalecendo as finanças do Estado."
 nor_protestant_church: "A Igreja Protestante"
 nor_protestant_church_desc: "Desenvolva universidades para formar teólogos luteranos e enraizar a fé protestante em toda a Noruega."
 nor_protestant_empire: "O Império Protestante"
 nor_protestant_empire_desc: "O luteranismo permeia a Escandinávia. O rei norueguês reina como defensor setentrional do mundo protestante."
 nor_norse_revival: "O Renascimento da Fé Nórdica"
 nor_norse_revival_desc: "Os deuses dos ancestrais — Odin, Thor, Freyr — renascem. O rosto da Escandinávia antes da cristianização é recriado em nossos dias. O rei norueguês reina como representante dos deuses nórdicos."
 nor_berserker_fleet: "A Frota Berserker"
 nor_berserker_fleet_desc: "O espírito dos berserkers vikings habita a frota. Guerreiros marinhos, devotos dos deuses nórdicos, soltos como corsários para devastar as costas dos infiéis."
 nor_ragnarok_empire: "O Império do Ragnarök"
 nor_ragnarok_empire_desc: "Como o novo mundo que vem depois do Ragnarök, a Noruega renasce como império setentrional sob a bênção dos antigos deuses. Com posto imperial e 500+ províncias em posse direta, conquiste essa glória."
 nor_bane_of_hansa: "O Flagelo da Hansa"
 nor_bane_of_hansa_desc: "A Liga Hanseática dominou o comércio norueguês por meio do Bryggen (Cais Alemão) em Bergen. Controle Lübeck ou dissolva a Liga Hanseática para que os mercadores noruegueses reavejam suas próprias rotas comerciais."
 nor_baltic_access: "Acesso ao Báltico"
 nor_baltic_access_desc: "Tomar Stralsund dá à Noruega acesso direto ao Mar Báltico. A Noruega torna-se assim a maior potência naval da Europa setentrional, controlando tanto o Mar do Norte quanto o Báltico."
 nor_hanseatic_expulsion: "Expulse os Mercadores Hanseáticos"
 nor_hanseatic_expulsion_desc: "Com a Liga Hanseática dissolvida e Bergen desenvolvida, a Noruega libertou por completo Bergen do domínio mercantil alemão. Os mercadores noruegueses são senhores de seu próprio porto."
 nor_control_north_sea_trade: "Domine o Comércio do Mar do Norte"
 nor_control_north_sea_trade_desc: "Mercados do Mar do Norte assegurados e a Liga Hanseática esmagada — a Noruega toma a iniciativa sobre toda a rota comercial do Mar do Norte. Estabeleça o domínio com renda 300+ e frota 40+."
 nor_north_sea_empire: "O Império do Mar do Norte"
 nor_north_sea_empire_desc: "A Noruega, que controla toda a costa do Mar do Norte, incluindo Lübeck, construiu o Império do Mar do Norte. O Império do Mar do Norte de Canuto, o Grande, renasce em nossos dias."
 nor_develop_stavanger: "Desenvolva Stavanger"
 nor_amber_trade: "Comércio de Âmbar"
 nor_amber_trade_desc: "O âmbar do Báltico, exportado a toda a Europa pela rede comercial do Mar do Norte da Noruega. O “Ouro do Norte” amplia ainda mais a renda norueguesa."
 nor_integrate_finland: "Integre a Finlândia"
 nor_integrate_finland_desc: "Por meio da união sueca, integre a Finlândia como parte do Império Norueguês. Possuir diretamente Turku e Uleåborg estende o reino do Atlântico Norte ao Mar de Barents."
 nor_engelbrekt: "O Espírito de Engelbrekt"
 nor_engelbrekt_desc: "O espírito da revolta de Engelbrekt se espalhou à Noruega. Com o apoio do campesinato e uma dura determinação pela independência, encarne a tradição dos homens livres do norte."
 nor_develop_hammerfest: "Desenvolva Hammerfest"
 nor_develop_hammerfest_desc: "Hammerfest é uma das cidades mais setentrionais do mundo. Desenvolver esse posto comercial ártico em cidade estabelece um centro permanente do comércio ártico."
 nor_karoliner: "O Exército de Elite Norueguês"
 nor_karoliner_desc: "O exército de elite norueguês, sustentado por alta tradição militar, concluído. Demonstrada a força militar do Império Norueguês — que explora o terreno montanhoso para a defesa e um ataque poderoso."
 nor_great_power: "Grande Potência do Norte"
 nor_great_power_desc: "A monarquia absoluta e a pesca e a indústria desenvolvidas — a Noruega surge como grande potência da Europa setentrional. Estabeleça essa posição com 200+ províncias, renda 250+ e prestígio 60+."
 nor_colonization: "O Império Colonial Norueguês"
 nor_stormakt: "Stormakt — Grande Potência do Norte"
 nor_stormakt_desc: "Escandinávia unida, Império do Mar do Norte construído, economia do norte alcançada — três pilares se juntam, e a Noruega reina como Stormakt (grande potência) da Europa setentrional. Com 600+ províncias, renda 600+ e prestígio 80+, conquiste essa glória."
 nor_norwegian_empire: "O Império Norueguês"
 nor_norwegian_empire_desc: "Da Islândia a Vinland, de Nidaros à Grã-Bretanha — o Império Norueguês está concluído. Os descendentes dos vikings superaram até os sonhos de seus ancestrais. Um império de tal escala, com que nem Canuto, o Grande, sonhou, nasceu aqui. “O Mar do Norte voltou a ser o lago da Noruega” — escreverão os historiadores."
 nor_events.30.t: "Unidade Escandinava — Aurora do Poder Norueguês"
 nor_events.30.d: "Dinamarca controlada, Suécia unida — toda a Escandinávia unida sob o estandarte norueguês. Desde os tempos vikings, esse feito, a que ninguém se igualou, é enfim realizado. Os sinos da catedral de Nidaros dobram, e o rei da Noruega proclama agora o título de “Rei da Escandinávia”."
 nor_events.30.a: "Viva a Escandinávia! A Noruega para sempre!"
 nor_events.40.t: "A Encruzilhada da Fé — A Escolha Religiosa da Noruega"
 nor_events.40.d: "A tempestade da Reforma chegou à Noruega. O clero da catedral de Nidaros pede lealdade a Roma. Mas cada vez mais gente encontra eco na nova doutrina de Lutero. E há os que sonham com um retorno aos antigos deuses. A escolha do rei norueguês decidirá o futuro desse reino setentrional."
 nor_events.40.a: "Manter a fidelidade a Roma — o catolicismo é a alma da Noruega"
 nor_events.40.b: "Adotar a doutrina de Lutero — chegou a era da reforma"
 nor_events.40.c: "Retornar aos antigos deuses — buscar a bênção de Odin"
 nor_events.99.t: "Nasce o Império Norueguês"
 nor_events.99.d: "Da Islândia a Vinland, de Nidaros à Grã-Bretanha — o Império Norueguês está enfim concluído. Os descendentes dos vikings superaram seus ancestrais. Um império de tal escala, com que nem Canuto, o Grande, sonhou, nasceu aqui. “O Mar do Norte voltou a ser o mar interior da Noruega” — registrarão os historiadores."
 nor_events.99.a: "Viva o Imperador do Império Norueguês! Herdeiros dos vikings para sempre!"
 STATIC_MODIFIER_NAME_nor_kingdom_mod: "O Reino da Noruega"
 STATIC_MODIFIER_DESC_nor_kingdom_mod: "Lançada a pedra angular da reconstrução da Noruega no reinado do rei Magno Eriksson."
 STATIC_MODIFIER_NAME_nor_denmark_crushed_mod: "Dinamarca Esmagada"
 STATIC_MODIFIER_DESC_nor_denmark_crushed_mod: "A maior rival da Noruega esmagada. A liderança sobre a Escandinávia passa à Noruega."
 STATIC_MODIFIER_NAME_nor_sweden_union_mod: "União Pessoal Sueca"
 STATIC_MODIFIER_DESC_nor_sweden_union_mod: "A união pessoal com a Suécia lança a base da unidade escandinava."
 STATIC_MODIFIER_NAME_nor_scandinavia_united_mod: "Escandinávia Unida"
 STATIC_MODIFIER_DESC_nor_scandinavia_united_mod: "Os estandartes de três reinos pairam lado a lado sob uma só coroa, e as ordens emitidas de Oslo alcançam os mares do norte."
 STATIC_MODIFIER_NAME_nor_bergen_mod: "Nó Comercial de Bergen"
 STATIC_MODIFIER_DESC_nor_bergen_mod: "Bergen desenvolvida como centro do comércio do Atlântico Norte da Noruega."
 STATIC_MODIFIER_NAME_nor_fleet_mod: "A Frota da Noruega"
 STATIC_MODIFIER_DESC_nor_fleet_mod: "A frota norueguesa, de sangue viking, emprega-se pelo Mar do Norte e pelo Atlântico Norte."
 STATIC_MODIFIER_NAME_nor_north_sea_mod: "Mercados do Mar do Norte"
 STATIC_MODIFIER_DESC_nor_north_sea_mod: "A Noruega estabelecida como protagonista do comércio do Mar do Norte."
 STATIC_MODIFIER_NAME_nor_iceland_mod: "Islândia Conquistada"
 STATIC_MODIFIER_DESC_nor_iceland_mod: "A Islândia assegurada como cabeça de ponte da Noruega no Atlântico Norte."
 STATIC_MODIFIER_NAME_nor_greenland_mod: "A Expedição à Groenlândia"
 STATIC_MODIFIER_DESC_nor_greenland_mod: "Navegantes noruegueses, que rumam aos mares gelados da Groenlândia, traçam novas linhas nos mapas do extremo norte."
 STATIC_MODIFIER_NAME_nor_vinland_mod: "Vinland"
 STATIC_MODIFIER_DESC_nor_vinland_mod: "A Noruega torna-se a primeira nação colonial da Europa no Novo Mundo, com assentamentos na América do Norte."
 STATIC_MODIFIER_NAME_nor_orkney_mod: "Orkney e Shetland"
 STATIC_MODIFIER_DESC_nor_orkney_mod: "Sobre as ondas do Mar do Norte, visíveis dos portos de Orkney, as silhuetas de navios noruegueses passam sem cessar."
 STATIC_MODIFIER_NAME_nor_scotland_mod: "Escócia Conquistada"
 STATIC_MODIFIER_DESC_nor_scotland_mod: "A tomada de Edimburgo abre o caminho para a Grã-Bretanha."
 STATIC_MODIFIER_NAME_nor_england_invasion_mod: "Invasão da Inglaterra"
 STATIC_MODIFIER_DESC_nor_england_invasion_mod: "A memória do Danelaw revive. Forças norueguesas percorrem o norte da Inglaterra."
 STATIC_MODIFIER_NAME_nor_britain_mod: "O Reino da Grã-Bretanha"
 STATIC_MODIFIER_DESC_nor_britain_mod: "O Império do Mar do Norte de Canuto, o Grande, revive. Todo o arquipélago britânico sob controle norueguês."
 STATIC_MODIFIER_NAME_nor_north_sea_master_mod: "Senhor do Mar do Norte"
 STATIC_MODIFIER_DESC_nor_north_sea_master_mod: "A Noruega torna-se a incontestada senhora do Mar do Norte. Todo o Mar do Norte sob controle norueguês."
 STATIC_MODIFIER_NAME_nor_nidaros_mod: "Nidaros Desenvolvida"
 STATIC_MODIFIER_DESC_nor_nidaros_mod: "A capital histórica da Noruega desenvolvida como centro religioso e cultural do Norte."
 STATIC_MODIFIER_NAME_nor_fisheries_mod: "Pesca Desenvolvida"
 STATIC_MODIFIER_DESC_nor_fisheries_mod: "Os ricos recursos pesqueiros do Atlântico Norte plenamente aproveitados, estabelecendo a base econômica da Noruega."
 STATIC_MODIFIER_NAME_nor_oslo_mod: "Oslo Desenvolvida"
 STATIC_MODIFIER_DESC_nor_oslo_mod: "Os escribas da fortaleza de Akershus redigem os éditos reais de vale em vale por toda a Noruega meridional."
 STATIC_MODIFIER_NAME_nor_absolutism_mod: "Absolutismo"
 STATIC_MODIFIER_DESC_nor_absolutism_mod: "Monarquia absoluta estabelecida na Noruega. Lançada a base de um governo imperial centralizado."
 STATIC_MODIFIER_NAME_nor_catholic_mod: "A Noruega Católica"
 STATIC_MODIFIER_DESC_nor_catholic_mod: "Mantendo a fidelidade à Igreja de Roma, a Noruega é reconhecida como guardiã da civilização católica do norte."
 STATIC_MODIFIER_NAME_nor_crusader_mod: "Glória do Cruzado do Norte"
 STATIC_MODIFIER_DESC_nor_crusader_mod: "A Noruega ganha fama de guardiã da cristandade por meio da guerra santa."
 STATIC_MODIFIER_NAME_nor_lutheran_mod: "Reforma Luterana"
 STATIC_MODIFIER_DESC_nor_lutheran_mod: "Os vasos sagrados retirados dos mosteiros jazem nos cofres reais, e o tesouro da Noruega está mais cheio que nunca."
 STATIC_MODIFIER_NAME_nor_protestant_church_mod: "A Igreja Protestante"
 STATIC_MODIFIER_DESC_nor_protestant_church_mod: "A formação de teologia luterana enraíza a fé protestante em toda a Noruega."
 STATIC_MODIFIER_NAME_nor_norse_conversion_mod: "Renascimento da Fé Nórdica"
 STATIC_MODIFIER_DESC_nor_norse_conversion_mod: "A fé em Odin, Thor e Freyr renasce. O espírito guerreiro da era viking habita os exércitos noruegueses."
 STATIC_MODIFIER_NAME_nor_berserker_fleet_mod: "A Frota Berserker"
 STATIC_MODIFIER_DESC_nor_berserker_fleet_mod: "O espírito dos berserkers vikings habita a frota. Os corsários devastam livremente as costas dos infiéis."
 STATIC_MODIFIER_NAME_nor_ragnarok_mod: "O Império do Ragnarök"
 STATIC_MODIFIER_DESC_nor_ragnarok_mod: "Sob a bênção dos antigos deuses, a Noruega renasce como império setentrional."
 STATIC_MODIFIER_NAME_nor_hansa_victory_mod: "Hansa Derrotada"
 STATIC_MODIFIER_DESC_nor_hansa_victory_mod: "O domínio mercantil alemão sobre Bergen esmagado."
 STATIC_MODIFIER_NAME_nor_baltic_mod: "Acesso ao Báltico"
 STATIC_MODIFIER_DESC_nor_baltic_mod: "A Noruega assegura acesso direto ao Báltico por Stralsund."
 STATIC_MODIFIER_NAME_nor_trade_supremacy_mod: "Domínio do Comércio do Mar do Norte"
 STATIC_MODIFIER_DESC_nor_trade_supremacy_mod: "A Noruega toma a iniciativa sobre toda a rota comercial do Mar do Norte."
 STATIC_MODIFIER_NAME_nor_stavanger_mod: "Porto de Stavanger"
 STATIC_MODIFIER_DESC_nor_stavanger_mod: "Stavanger desenvolvida como nó pesqueiro e comercial do sudoeste da Noruega."
 STATIC_MODIFIER_NAME_nor_amber_mod: "Comércio de Âmbar"
 STATIC_MODIFIER_DESC_nor_amber_mod: "O âmbar do Báltico exportado pela rede comercial da Noruega."
 STATIC_MODIFIER_NAME_nor_finland_mod: "Finlândia Integrada"
 STATIC_MODIFIER_DESC_nor_finland_mod: "A Finlândia integrada como parte do Império Norueguês."
 STATIC_MODIFIER_NAME_nor_engelbrekt_mod: "O Espírito de Engelbrekt"
 STATIC_MODIFIER_DESC_nor_engelbrekt_mod: "A tradição dos homens livres do norte encarnada no orgulho da Noruega."
 STATIC_MODIFIER_NAME_nor_hammerfest_mod: "Hammerfest Desenvolvida"
 STATIC_MODIFIER_DESC_nor_hammerfest_mod: "O posto comercial mais setentrional do mundo estabelecido como centro permanente do comércio ártico."
 STATIC_MODIFIER_NAME_nor_military_tradition_mod: "O Exército de Elite Norueguês"
 STATIC_MODIFIER_DESC_nor_military_tradition_mod: "O exército de elite norueguês altamente treinado, sustentado por forte tradição militar, concluído."
 STATIC_MODIFIER_NAME_nor_great_power_mod: "Grande Potência do Norte"
 STATIC_MODIFIER_DESC_nor_great_power_mod: "A Noruega surge como grande potência da Europa setentrional."
 STATIC_MODIFIER_NAME_nor_protestant_empire_mod: "O Império Protestante"
 STATIC_MODIFIER_DESC_nor_protestant_empire_mod: "A Noruega, com luteranismo por toda a Escandinávia, reina como defensora setentrional do mundo protestante."
 STATIC_MODIFIER_NAME_nor_papal_champion_mod: "Campeã do Papa"
 STATIC_MODIFIER_DESC_nor_papal_champion_mod: "Posição inabalável de mais forte guardiã da civilização católica do norte estabelecida."
 STATIC_MODIFIER_NAME_nor_colonial_empire_mod: "O Império Colonial Norueguês"
 STATIC_MODIFIER_DESC_nor_colonial_empire_mod: "A Noruega torna-se o primeiro verdadeiro império colonial da Europa, com 10+ colônias, incluindo Vinland."
 STATIC_MODIFIER_NAME_nor_stormakt_mod: "Stormakt"
 STATIC_MODIFIER_DESC_nor_stormakt_mod: "A era das grandes potências da Noruega chegou — reina como maior potência da Europa setentrional."
 STATIC_MODIFIER_NAME_nor_sound_toll_mod: "A Taxa do Öresund"
 STATIC_MODIFIER_DESC_nor_sound_toll_mod: "A cobrança da Taxa do Öresund enriquece o tesouro norueguês."
 STATIC_MODIFIER_NAME_nor_stockholm_mod: "Estocolmo Desenvolvida"
 STATIC_MODIFIER_DESC_nor_stockholm_mod: "Estocolmo desenvolvida como nó administrativo oriental do Império Norueguês por meio da união sueca."
 STATIC_MODIFIER_NAME_nor_hanseatic_expulsion_mod: "Mercadores Hanseáticos Expulsos"
 STATIC_MODIFIER_DESC_nor_hanseatic_expulsion_mod: "Bergen libertada do domínio mercantil alemão — os mercadores noruegueses governam seu próprio porto."
 STATIC_MODIFIER_NAME_nor_north_sea_empire_mod: "O Império do Mar do Norte"
 STATIC_MODIFIER_DESC_nor_north_sea_empire_mod: "O Império do Mar do Norte de Canuto, o Grande, renasce em nossos dias. Toda a costa do Mar do Norte sob controle norueguês."
 STATIC_MODIFIER_NAME_nor_norwegian_empire_final_mod: "O Império Norueguês"
 STATIC_MODIFIER_DESC_nor_norwegian_empire_final_mod: "O Império Norueguês, que se estende da Islândia a Vinland, concluído. Os herdeiros dos vikings superaram seus ancestrais."
 STATIC_MODIFIER_NAME_nor_faith_steadfast_mod: "Firme na Fé"
 STATIC_MODIFIER_DESC_nor_faith_steadfast_mod: "A inabalável fé católica proclama a autoridade do rei ao povo com os sinos da catedral de Nidaros."
 STATIC_MODIFIER_NAME_nor_reform_winds_mod: "Ventos de Reforma"
 STATIC_MODIFIER_DESC_nor_reform_winds_mod: "O ensinamento de Lutero se espalha pela Noruega."
 STATIC_MODIFIER_NAME_nor_old_gods_calling_mod: "O Chamado dos Antigos Deuses"
 STATIC_MODIFIER_DESC_nor_old_gods_calling_mod: "A fé em Odin e Thor renasce em segredo."
 nor_expel_danish_nobility: "Oponha-se à Dinamarca"
 nor_expel_danish_nobility_desc: "Em 1337, a Noruega — reino independente em união pessoal com a Suécia sob o rei Magno Eriksson — não é vassala da Dinamarca. A Dinamarca é uma vizinha difícil, e a vindoura União de Kalmar (1397) ameaça dar à Dinamarca a dominação da Escandinávia. Estabeleça a posição da Noruega na Escandinávia por meio de relações claras com a Dinamarca agora — seja por rivalidade, aliança ou amizade."
 nor_secure_bergen_desc: "O Bryggen — esses coloridos armazéns de madeira alinhados ao longo do cais de Bergen — símbolo da prosperidade mercantil hanseática. Mas Bergen deve ser uma cidade norueguesa. Quando a autoridade do rei se estender a esse porto, a riqueza do comércio do Atlântico Norte fluirá a mãos norueguesas."
 nor_develop_stavanger_desc: "Stavanger é uma antiga cidade episcopal na costa sudoeste da Noruega. Como coração de Rogaland, onde se entrelaçam rochas e fiordes, esse porto torna-se nó da pesca do arenque e do comércio do Mar do Norte. Desenvolva-a como a segunda grande cidade portuária da Noruega, depois de Bergen."
 nor_develop_oslo_desc: "Oslo, abrigada atrás das muralhas da fortaleza de Akershus, é a porta meridional entre a Dinamarca e a Suécia. A leste está a Suécia; ao sul, a Dinamarca. Desenvolvendo Oslo numa cidade florescente, a fronteira sul da Noruega fica assegurada, e a agricultura e o comércio começam a prosperar."
 nor_secure_nidaros_desc: "Nidaros — esta cidade, construída onde sofreu o martírio São Olavo, ergue-se sob a maior catedral gótica da Escandinávia e carrega a história milenar do centro espiritual do mundo cristão do norte. Desenvolver Nidaros é ganhar a aprovação da autoridade do rei norueguês tanto pelo céu quanto pela terra."
 nor_vinland_desc: "Há mil anos, Leif, filho de Érico, o Vermelho, pisou num distante continente além da névoa — Vinland. Agora, uma nação colonial sob o estandarte norueguês leva adiante esse sonho. A Noruega é inscrita na história como a primeira nação europeia a lançar raízes no Novo Mundo."
 nor_colonization_desc: "De Vinland à Groenlândia, da Islândia às costas árticas — as nações coloniais norueguesas se espalham pelo Atlântico Norte. O espírito viking de exploração vive em nossos dias, e a Noruega ergue-se como verdadeiro império marítimo, dominando o mundo além dos mares."
 nor_kingdom_of_britain_desc: "Londres, York, Edimburgo — três grandes cidades das Ilhas Britânicas unidas sob o estandarte norueguês. O sonho de Canuto, o Grande, realizado de novo. A memória do Danelaw revive em nossos dias, e o Mar do Norte torna-se o lago da Noruega."
 nor_arctic_trade_desc: "A Península de Kola — terra congelada no extremo do Ártico — é um tesouro de peles, caça e marfim de morsa. Os produtos árticos, trazidos por caçadores sami, geram enorme riqueza como as melhores peles que a nobreza europeia procura. Tomando a Península de Kola, a Noruega torna-se absoluta senhora do comércio ártico."
 nor_timber_industry_desc: "As florestas da Noruega são uma dádiva tanto para construtores navais quanto para construtores. Abeto, pinheiro e bétula, cortados das florestas profundas — junto com as ferramentas de ferro forjadas para trabalhá-los — formam a espinha dorsal industrial da economia norueguesa. Quando a fumaça das serrarias se ergue, a Noruega torna-se o maior exportador de madeira da Europa setentrional."
 STATIC_MODIFIER_NAME_nor_timber_mod: "A Indústria Madeireira"
 STATIC_MODIFIER_DESC_nor_timber_mod: "Madeira e ferramentas, forjadas nas ricas florestas da Noruega, sustentam a base industrial."
 STATIC_MODIFIER_NAME_nor_arctic_trade_mod: "Comércio Ártico"
 STATIC_MODIFIER_DESC_nor_arctic_trade_mod: "Peles e caça da Península de Kola fluem por toda a Europa por meio dos mercadores noruegueses."
 STATIC_MODIFIER_NAME_nor_northern_economy_mod: "A Economia do Norte"
 STATIC_MODIFIER_DESC_nor_northern_economy_mod: "O comércio norueguês, construído sobre a pesca, a madeira, as peles e o comércio ártico, alcança o mais alto nível da Europa setentrional. Os custos de manutenção dos mercadores diminuem, e mais postos comerciais podem ser estabelecidos."
