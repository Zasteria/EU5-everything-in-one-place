l_braz_por:
 brb_brabant_mission_pack: "O Legado da Baixa Lotaríngia — Unificar os Países Baixos e Absorver a Borgonha"
 brb_brabant_mission_pack_DESCRIPTION:0 "O Ducado de Brabante, governado por uma casa ducal independente — una os Países Baixos, absorva o recém-erguido Ducado da Borgonha antes da história e construa uma verdadeira era de ouro."
 brb_brabant_mission_pack_CRITERIA_DESCRIPTION:0 "Una os Países Baixos, absorva a Borgonha e estabeleça uma república para alcançar a era de ouro."
 brb_brabant_mission_pack_BUTTON_TOOLTIP:0 "De pequeno ducado a grão-ducado, que governa os Países Baixos e a Borgonha."
 brb_brabant_mission_pack_BUTTON_DETAILS:0 "“Je Maintiendrai” — inverta a história e ergue o estandarte de Brabante sobre todos os Países Baixos!"
 brb_ducal_authority: "Estabeleça a Autoridade Ducal"
 brb_ducal_authority_desc: "Como duque da linha de Lovaina, deixe que sua autoridade alcance todos os cantos do ducado."
 brb_joyous_entry: "A Entrada Jubilosa (Blijde Inkomst)"
 brb_joyous_entry_desc: "A “Entrada Jubilosa” — cerimônia em que o novo duque passa pelas portas da cidade e confirma os privilégios das cidades — estabeleça essa tradição e conceda às cidades seus próprios direitos."
 brb_joyous_entry_unlock_tt: "O privilégio urbano “Cidade da Entrada Jubilosa” torna-se disponível."
 brb_develop_antwerp: "Desenvolva Antuérpia"
 brb_develop_antwerp_desc: "Antuérpia, cidade comercial na foz do Escalda — desenvolva-a ainda mais e consolide seu status de nó do comércio do Mar do Norte."
 brb_unify_brabant: "Unifique Brabante"
 brb_unify_brabant_desc: "O Ducado de Brabante, dividido entre norte e sul — una-o sob um só estandarte."
 brb_flemish_rivalry: "Rivalidade com Flandres"
 brb_flemish_rivalry_desc: "O Condado de Flandres, conhecido por sua rica indústria têxtil — estabeleça nossa influência sobre essa antiga rival."
 brb_hainaut_marriage: "Casamento com Hainaut-Holanda"
 brb_hainaut_marriage_desc: "Hainaut, Holanda e Zelândia, governadas pela casa de Wittelsbach — por casamento, aliança ou rivalidade, assegure a reivindicação a esse trono."
 brb_liege_relations: "Relações com Liège"
 brb_liege_relations_desc: "O Principado-Bispado de Liège, que detém vasto poder secular — por rivalidade ou laços matrimoniais, assegure a reivindicação a essa terra."
 brb_utrecht_bishopric: "O Bispado de Utrecht"
 brb_utrecht_bishopric_desc: "O Bispado de Utrecht, que detém vasto poder secular — traga-o à nossa influência como base da unificação dos Países Baixos."
 brb_burgundian_ambition: "Ambições sobre a Borgonha"
 brb_burgundian_ambition_desc: "Tendo dominado as principais terras dos Países Baixos, volte o olhar da ambição para o recém-erguido Ducado da Borgonha, detido por um ramo mais jovem da casa real francesa."
 brb_contest_flanders_inheritance: "Dispute a Herança de Flandres"
 brb_contest_flanders_inheritance_desc: "O casamento de Margarida, herdeira de Flandres — vença essa disputada união e obtenha Flandres para si, antes que o faça a casa da Borgonha."
 brb_absorb_burgundy: "Absorva a Borgonha"
 brb_absorb_burgundy_desc: "Anexe ou subjugue o recém-erguido Ducado da Borgonha — inverta o curso da história e prove que Brabante, e não a Borgonha, é senhora dos Países Baixos."
 brb_valois_brabant: "O Grão-Ducado de Brabante"
 brb_valois_brabant_desc: "Tendo absorvido a herança borgonhesa, Brabante já não é mero ducado — erga-se como grande potência, que lidera os Países Baixos."
 brb_je_maintiendrai: "Je Maintiendrai"
 brb_je_maintiendrai_desc: "Brabante, Flandres, Holanda e a herança borgonhesa absorvida — como senhora das principais terras dos Países Baixos, mantenha esse governo."
 brb_hansa_relations: "Relações com a Hansa"
 brb_hansa_relations_desc: "A Liga Hanseática, que domina o comércio do Báltico — reconstrua com ela as relações em posição de igualdade."
 brb_bulk_trade: "Apoie o Comércio a Granel"
 brb_bulk_trade_desc: "O comércio a granel de grãos e madeira — aumente a presença de nossa frota mercante no Báltico."
 brb_baltic_supremacy: "Supremacia no Comércio Báltico"
 brb_baltic_supremacy_desc: "O senhor das rotas comerciais do norte é verdadeira potência comercial — estabeleça a supremacia no comércio báltico."
 brb_land_commercial_empire: "O Império Comercial Terrestre"
 brb_land_commercial_empire_desc: "Não só o mar — domine os grandes centros de mercado do interior e reivindique a maestria também no comércio terrestre."
 brb_secure_grain: "Assegure os Grãos do Báltico"
 brb_secure_grain_desc: "Os Países Baixos há muito dependem dos grãos do Báltico — tome esses suprimentos em suas próprias mãos."
 brb_reformation_choice: "A Escolha da Reforma"
 brb_reformation_choice_desc: "Os ensinamentos de Lutero abalam os Países Baixos — nessa encruzilhada da fé, que caminho escolheremos?"
 brb_religious_settlement: "Acordo Religioso"
 brb_religious_settlement_desc: "Mais de cem anos após a Reforma — agora que a fé do Estado domina a esmagadora maioria da população, traga uma reconciliação estável entre as confissões em conflito."
 brb_spanish_fury: "A Fúria Espanhola"
 brb_spanish_fury_desc: "A opressão habsburga e a pesada tributação — a fúria do povo contra a “Fúria Espanhola” já não pode ser contida."
 brb_sea_beggars: "Os Mendigos do Mar"
 brb_sea_beggars_desc: "Corsários que se chamam “Mendigos do Mar” — suas façanhas abrem brechas na dominação espanhola nos mares."
 brb_eighty_years_war: "A Guerra dos Oitenta Anos"
 brb_eighty_years_war_desc: "A longa luta pela independência — sobreviva a essa Guerra dos Oitenta Anos e vença nossa liberdade."
 brb_united_netherlands: "Os Países Baixos Unidos"
 brb_united_netherlands_desc: "A federação das sete províncias — estabeleça aqui uma confederação ducal sob o Grão-Duque de Brabante, que leva adiante as tradições tanto da nobreza quanto das cidades."
 brb_east_india_charter: "A Carta da Companhia das Índias Orientais"
 brb_east_india_charter_desc: "Conceda uma carta para a fundação da Companhia das Índias Orientais, buscando o monopólio do comércio asiático."
 brb_voc_trade_empire: "O Império Comercial da VOC"
 brb_voc_trade_empire_desc: "A “Companhia Unida das Índias Orientais” (VOC) — a primeira sociedade por ações do mundo — espalha sua rede comercial das Ilhas das Especiarias por toda a Ásia."
 brb_west_india_company: "A Companhia das Índias Ocidentais"
 brb_west_india_company_desc: "O comércio que liga o Novo Mundo e a África — funde a Companhia das Índias Ocidentais e partilhe a riqueza do Atlântico."
 brb_golden_age: "A Era de Ouro"
 brb_golden_age_desc: "Rembrandt, Vermeer e o comércio florescente — alcance o zênite da “Era de Ouro Holandesa”."
 brb_amsterdam_exchange: "A Bolsa de Amsterdã"
 brb_amsterdam_exchange_desc: "A primeira bolsa de valores do mundo — faça de Amsterdã o centro das finanças europeias."
 brb_form_netherlands: "O Grão-Ducado dos Países Baixos Concluído"
 brb_form_netherlands_desc: "O longo caminho que começou com a herança da Baixa Lotaríngia e a absorção da Borgonha, passando pela independência e pela era de ouro, chega aqui à conclusão como grão-ducado, que preserva as profundas tradições da nobreza e das cidades."
 brb_wool_staple_calais: "O Entreposto de Lã de Calais"
 brb_wool_staple_calais_desc: "A lã inglesa, sangue vital da indústria têxtil flamenga — reanime o comércio por meio do entreposto de lã de Calais."
 brb_anglo_dutch_alliance: "A Aliança Anglo-Holandesa"
 brb_anglo_dutch_alliance_desc: "A Inglaterra, nossa vizinha do outro lado do Canal — em meio ao caos da Guerra dos Cem Anos, fortaleça relações duradouras com essa nação, seja por aliança, seja por rivalidade."
 brb_english_channel_trade: "Maestria no Comércio do Canal"
 brb_english_channel_trade_desc: "O Canal, que liga o Mar do Norte e o Atlântico — estabeleça a supremacia no comércio por esse vital estreito."
 brb_valois_suzerainty_dispute: "Dispute a Suserania dos Valois"
 brb_valois_suzerainty_dispute_desc: "Nominalmente vassalo da coroa francesa — dispute essa suserania e exija posição de igualdade."
 brb_hundred_years_war_intervention: "Intervenção na Guerra dos Cem Anos"
 brb_hundred_years_war_intervention_desc: "A longa guerra que dilacera a Inglaterra e a França — aproveite essa oportunidade para intervir em seu próprio benefício."
 brb_somme_towns: "As Cidades do Somme"
 brb_somme_towns_desc: "As ricas cidades da Picardia — incorpore as terras ao longo do Somme ao nosso domínio."
 brb_end_french_vassalage: "Ponha Fim à Vassalagem Francesa"
 brb_end_french_vassalage_desc: "Rompa por completo essa vassalagem nominal e estabeleça nosso status de grão-ducado verdadeiramente independente."
 brb_events.1.t: "Começa a Guerra dos Oitenta Anos"
 brb_events.1.d: "Pela União de Utrecht e pelas façanhas dos Mendigos do Mar, começou a longa guerra contra a Espanha. Essa luta decidirá nossa independência."
 brb_events.1.a: "Liberdade ou morte!"
 brb_events.2.t: "Ambições sobre a Borgonha"
 brb_events.2.d: "O recém-erguido Ducado da Borgonha — que caminho escolheremos quanto ao seu destino?"
 brb_events.2.a: "Pagar em ouro e aceitá-lo como vassalo"
 brb_events.2.b: "Reivindicar Dijon e preparar-se para tomá-la pela força"
 brb_events.2.c: "Observar e esperar por ora"
 brb_events.3.t: "Dispute a Herança de Flandres"
 brb_events.3.d: "A disputa sucessória por Margarida, herdeira de Flandres — como asseguraremos essa rica terra para nós?"
 brb_events.3.a: "Pagar em ouro e aceitá-la como vassala"
 brb_events.3.b: "Reivindicar Bruges e preparar-se para tomá-la pela força"
 brb_events.3.c: "Observar e esperar por ora"
 brb_events.99.t: "Proclamação do Grão-Ducado dos Países Baixos"
 brb_events.99.d: "O pequeno ducado que herdou a Baixa Lotaríngia e absorveu a Borgonha renasceu, pela independência e pela era de ouro, como grão-ducado sob a casa de Brabante, que preserva as profundas tradições da nobreza e das cidades."
 brb_events.99.a: "Glória ao Grão-Ducado!"
 STATIC_MODIFIER_NAME_brb_ducal_mod: "Autoridade Ducal Estabelecida"
 STATIC_MODIFIER_DESC_brb_ducal_mod: "O estandarte ducal, que tremula sobre Lovaina, proclama a mesma autoridade em todas as cidades-castelo do ducado."
 STATIC_MODIFIER_NAME_brb_antwerp_mod: "Antuérpia Assegurada"
 STATIC_MODIFIER_DESC_brb_antwerp_mod: "A cidade comercial Antuérpia floresce."
 STATIC_MODIFIER_NAME_brb_unify_brabant_mod: "Brabante Unificada"
 STATIC_MODIFIER_DESC_brb_unify_brabant_mod: "Os senhores das cortes, outrora divididos entre norte e sul, ajoelham-se agora na mesma corte ducal."
 STATIC_MODIFIER_NAME_brb_flemish_mod: "Rivalidade com Flandres"
 STATIC_MODIFIER_DESC_brb_flemish_mod: "Até os tecelões de Gante e Bruges conduzem agora seus negócios de olhos postos nos desejos do duque de Brabante."
 STATIC_MODIFIER_NAME_brb_utrecht_mod: "O Bispado de Utrecht"
 STATIC_MODIFIER_DESC_brb_utrecht_mod: "Os sinos da catedral de Utrecht dobram agora orações que abençoam o governo do duque de Brabante."
 STATIC_MODIFIER_NAME_brb_absorb_burgundy_mod: "Borgonha Absorvida"
 STATIC_MODIFIER_DESC_brb_absorb_burgundy_mod: "As chaves do tesouro de Dijon pendem agora na corte de Bruxelas."
 STATIC_MODIFIER_NAME_brb_maintiendrai_mod: "Je Maintiendrai"
 STATIC_MODIFIER_DESC_brb_maintiendrai_mod: "“Manterei” — os senhores e burgueses dos Países Baixos reúnem-se numa só corte sob esse lema."
 STATIC_MODIFIER_NAME_brb_hansa_mod: "Relações com a Hansa"
 STATIC_MODIFIER_DESC_brb_hansa_mod: "Mercadores hanseáticos de Lübeck ocupam agora seus lugares como iguais nos escritórios de Antuérpia."
 STATIC_MODIFIER_NAME_brb_bulk_trade_mod: "Comércio a Granel Apoiado"
 STATIC_MODIFIER_DESC_brb_bulk_trade_mod: "Navios carregados de grãos e madeira enviam um fluxo constante de encomendas aos estaleiros na foz do Escalda."
 STATIC_MODIFIER_NAME_brb_baltic_supremacy_mod: "Supremacia no Comércio Báltico"
 STATIC_MODIFIER_DESC_brb_baltic_supremacy_mod: "Por todo o Báltico, as velas de incontáveis navios mercantes levam o estandarte do leão de Brabante."
 STATIC_MODIFIER_NAME_brb_land_commercial_empire_mod: "O Império Comercial Terrestre"
 STATIC_MODIFIER_DESC_brb_land_commercial_empire_mod: "Carroças de Colônia e Paris formam filas nos mercados de Bruxelas e Lovaina."
 STATIC_MODIFIER_NAME_brb_grain_mod: "Grãos do Báltico Assegurados"
 STATIC_MODIFIER_DESC_brb_grain_mod: "Com os grãos do Báltico enchendo para sempre os celeiros, os soldados marcham ao chamado sem temer a fome."
 STATIC_MODIFIER_NAME_brb_reformation_mod: "A Escolha da Reforma"
 STATIC_MODIFIER_DESC_brb_reformation_mod: "Sob os púlpitos e nos cantos do mercado, as pessoas falam em vozes baixas sobre a nova fé."
 STATIC_MODIFIER_NAME_brb_settlement_mod: "Acordo Religioso"
 STATIC_MODIFIER_DESC_brb_settlement_mod: "Vizinhos que outrora lutaram pela fé estão agora ombro a ombro junto às mesmas barracas."
 STATIC_MODIFIER_NAME_brb_spanish_fury_mod: "A Fúria Espanhola"
 STATIC_MODIFIER_DESC_brb_spanish_fury_mod: "A fúria dos que viram as cinzas de Antuérpia ainda dá forças às mãos que empunham a espada."
 STATIC_MODIFIER_NAME_brb_sea_beggars_mod: "Os Mendigos do Mar"
 STATIC_MODIFIER_DESC_brb_sea_beggars_mod: "“Melhor mendigos que homens do rei” — a bandeira dos Mendigos do Mar tornou-se pesadelo nos sonhos dos marinheiros espanhóis."
 STATIC_MODIFIER_NAME_brb_united_netherlands_mod: "Países Baixos Unidos"
 STATIC_MODIFIER_DESC_brb_united_netherlands_mod: "Os estandartes das sete províncias estão lado a lado numa mesma sala de assembleia, e o novo Estado respira pela primeira vez como confederação ducal."
 STATIC_MODIFIER_NAME_brb_east_india_mod: "Carta da Companhia das Índias Orientais"
 STATIC_MODIFIER_DESC_brb_east_india_mod: "Antes que o selo de cera da carta tivesse tempo de secar, frotas rumo ao Oriente começaram a içar velas."
 STATIC_MODIFIER_NAME_brb_voc_mod: "O Império Comercial da VOC"
 STATIC_MODIFIER_DESC_brb_voc_mod: "Pimenta e cravo, que chegam das feitorias de Batávia, ligam até governadores coloniais distantes à pátria."
 STATIC_MODIFIER_NAME_brb_wic_mod: "A Companhia das Índias Ocidentais"
 STATIC_MODIFIER_DESC_brb_wic_mod: "Rumores de açúcar e prata do outro lado do Atlântico impelem emigrantes, que sonham com um novo mundo, aos portos."
 STATIC_MODIFIER_NAME_brb_golden_age_mod: "A Era de Ouro"
 STATIC_MODIFIER_DESC_brb_golden_age_mod: "Nas casas dos grandes mercadores junto aos canais penduram-se quadros de salas iluminadas por janelas, impregnadas da luz de Vermeer."
 STATIC_MODIFIER_NAME_brb_amsterdam_mod: "A Bolsa de Amsterdã"
 STATIC_MODIFIER_DESC_brb_amsterdam_mod: "Amsterdã, centro das finanças, floresce."
 STATIC_MODIFIER_NAME_brb_wool_staple_mod: "O Entreposto de Lã de Calais"
 STATIC_MODIFIER_DESC_brb_wool_staple_mod: "No entreposto de lã de Calais, fardos de lã inglesa empilham-se alto, destinados aos tecelões de Flandres."
 STATIC_MODIFIER_NAME_brb_anglo_treaty_mod: "A Aliança Anglo-Holandesa"
 STATIC_MODIFIER_DESC_brb_anglo_treaty_mod: "Enviados, que levam os compromissos da aliança, cruzam repetidas vezes entre as cortes de ambos os lados do Canal."
 STATIC_MODIFIER_NAME_brb_channel_trade_mod: "Maestria no Comércio do Canal"
 STATIC_MODIFIER_DESC_brb_channel_trade_mod: "No estreito que conduz do Mar do Norte ao Atlântico, as bandeiras mercantes de Brabante tremulam agora em fileiras."
 STATIC_MODIFIER_NAME_brb_suzerainty_dispute_mod: "Disputa da Suserania dos Valois"
 STATIC_MODIFIER_DESC_brb_suzerainty_dispute_mod: "Os portões de Bruxelas despediram sem pudor os arautos enviados de Paris para convocar seu vassalo."
 STATIC_MODIFIER_NAME_brb_intervention_mod: "Intervenção na Guerra dos Cem Anos"
 STATIC_MODIFIER_DESC_brb_intervention_mod: "Soldados que lutaram no lamaçal da Guerra dos Cem Anos voltaram, tendo aprendido os métodos de guerra tanto da França quanto da Inglaterra."
 STATIC_MODIFIER_NAME_brb_somme_mod: "As Cidades do Somme"
 STATIC_MODIFIER_DESC_brb_somme_mod: "Tendo tomado as muralhas ao longo do Somme, o exército ducal fincou uma cabeça de ponte duradoura nas planícies do norte da França."
 STATIC_MODIFIER_NAME_brb_end_vassalage_mod: "Fim da Vassalagem Francesa"
 STATIC_MODIFIER_DESC_brb_end_vassalage_mod: "Sobre os portões, dos quais se retirou o brasão do rei francês, tremula agora apenas o estandarte do duque de Brabante."
 STATIC_MODIFIER_NAME_brb_form_netherlands_mod: "Grão-Ducado dos Países Baixos Concluído"
 STATIC_MODIFIER_DESC_brb_form_netherlands_mod: "Na corte do grão-ducado, onde estandartes nobres e bandeiras urbanas tremulam lado a lado, senhores e burgueses dos Países Baixos celebram por igual a aurora de uma nova era."
