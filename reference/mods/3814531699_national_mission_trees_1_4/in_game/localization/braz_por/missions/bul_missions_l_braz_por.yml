l_braz_por:
 bul_bulgaria_mission_pack: "O Novo Bizâncio — O Legado do Segundo Império e a Hegemonia Balcânica"
 bul_bulgaria_mission_pack_DESCRIPTION:0 "Como herdeiro do legado do Segundo Império Búlgaro, estabeleça a independência, reivindique a hegemonia sobre a Península Balcânica, repila a ameaça otomana e erga o novo Bizâncio em Constantinopla."
 bul_bulgaria_mission_pack_CRITERIA_DESCRIPTION:0 "Estabeleça a independência, reviva o império balcânico, repila os otomanos e funde o Novo Bizâncio."
 bul_bulgaria_mission_pack_BUTTON_TOOLTIP:0 "Da antiga cidade de Tarnovo a um novo império, que brilha sobre os Bálcãs."
 bul_bulgaria_mission_pack_BUTTON_DETAILS:0 "“Senhor de Tsargrad” — herde a glória do Segundo Império e funde o Terceiro Império Búlgaro!"
 bul_second_bulgarian_legacy: "O Império em Esfacelamento"
 bul_second_bulgarian_legacy_desc: "O glorioso império, construído por Ivan Asen I e Ivan Asen II, esfacela-se agora sob a ambição da nobreza de Tarnovo, Vidin e Dobruja — detenha esse declínio."
 bul_assert_independence: "A Autoridade de Tsargrad"
 bul_assert_independence_desc: "O império à beira da desintegração — como tsar de Tarnovo, estabeleça uma autoridade que não se curve a qualquer potência rival."
 bul_tarnovo_capital: "Desenvolva Tarnovo"
 bul_tarnovo_capital_desc: "Tarnovo, outrora chamada “Segundo Constantinopla” — restaure a glória da antiga capital imperial nessa terra de novo."
 bul_bulgarian_patriarchate: "O Patriarcado Búlgaro"
 bul_bulgarian_patriarchate_desc: "Uma igreja autocéfala, independente de Constantinopla — torne inabalável a autoridade da Igreja Ortodoxa Búlgara."
 bul_boyar_council: "O Conselho dos Boiardos"
 bul_boyar_council_desc: "Os boiardos, a nobreza que há muito sustentou a Bulgária — use seu conselho como pilar do governo."
 bul_reunite_bulgaria: "Reunifique a Bulgária"
 bul_reunite_bulgaria_desc: "Bulgária e Silistra — una essas terras-núcleo históricas sob um só estandarte."
 bul_bulgarian_independence: "Unificação do Império"
 bul_bulgarian_independence_desc: "O império esfacelou-se em Vidin e Dobruja — traga essas terras de volta sob uma só coroa e unifique o império com centro em Tarnovo."
 bul_sofia: "A Cidade da Santa Sabedoria"
 bul_sofia_desc: "Serdica, Sredets, Triaditsa — essa cidade teve muitos nomes ao longo dos séculos. Dê-lhe um título condizente com a nova era."
 bul_conquer_macedonia: "Conquiste a Macedônia"
 bul_conquer_macedonia_desc: "A Macedônia, há muito centro da cultura búlgara desde os tempos antigos — recupere essa terra ao nosso domínio."
 bul_conquer_serbia: "Conquiste a Sérvia"
 bul_conquer_serbia_desc: "As terras vizinhas da Sérvia — subjugue essa rival na disputa pela hegemonia balcânica."
 bul_bulgarian_empire: "O Império Búlgaro"
 bul_bulgarian_empire_desc: "A Bulgária outrora governou um grande Império, que abarcava boa parte dos Bálcãs. Restauremos essas terras ao nosso domínio!"
 bul_conquer_wallachia: "Conquiste a Valáquia"
 bul_conquer_wallachia_desc: "A Valáquia, na margem norte do Danúbio — estabeleça nossa influência sobre essa terra."
 bul_conquer_moldavia: "Conquiste a Moldávia"
 bul_conquer_moldavia_desc: "A Moldávia, a leste dos Montes Cárpatos — traga essa rica terra ao nosso domínio."
 bul_conquer_transylvania: "Conquiste a Transilvânia"
 bul_conquer_transylvania_desc: "A Transilvânia, cercada de montanhas — faça dessa região parte de nosso império."
 bul_conquer_thrace_greece: "Conquiste a Trácia e o Norte da Grécia"
 bul_conquer_thrace_greece_desc: "A terra dos antigos trácios e o norte da Grécia — incorpore essa região a nosso império."
 bul_extend_the_empire: "Amplie o Império"
 bul_extend_the_empire_desc: "As fronteiras do Império devem ser empurradas ainda mais longe. Continuemos nossa campanha na Grécia e nos Cárpatos."
 bul_chitalishte_movement: "O Movimento das Salas de Leitura (Chitalishte)"
 bul_chitalishte_movement_desc: "As “salas de leitura”, conhecidas como chitalishte — centros culturais da comunidade — que lancem raízes por toda a terra, cultivando a alfabetização e a consciência nacional entre os burgueses. Aqui começa o Renascimento Nacional Búlgaro."
 bul_chitalishte_unlock_tt: "O privilégio urbano “Cidade da Sala de Leitura” torna-se disponível."
 bul_ottoman_wars: "As Guerras Otomanas"
 bul_ottoman_wars_desc: "O crescente Império Otomano — enfrente a luta contra essa nova ameaça."
 bul_varna_crusade: "A Cruzada de Varna"
 bul_varna_crusade_desc: "Erga-se ao lado da Hungria e conduza uma cruzada contra os otomanos. Em 1444, a história volta-se em Varna."
 bul_end_ottoman_threat: "Ponha Fim à Ameaça Otomana"
 bul_end_ottoman_threat_desc: "A outrora temida ameaça otomana — ponha-lhe fim e assegure nossa posição nos Bálcãs."
 bul_constantinople_ambition: "Ambição sobre Constantinopla"
 bul_constantinople_ambition_desc: "A cidade que outrora foi o centro do mundo ortodoxo — nutra ambição sobre essa cidade."
 bul_new_byzantium: "Posse de Constantinopla e Roma"
 bul_new_byzantium_desc: "Constantinopla, centro do mundo ortodoxo, e Roma, sede da Igreja Ocidental — tome ambas as cidades juntas e deixe que a Bulgária se erga como novo império, que lidera ambas as metades da cristandade."
 bul_black_sea_trade: "Comércio do Mar Negro"
 bul_black_sea_trade_desc: "Varna, cidade portuária no Mar Negro — desenvolva-a como cabeça de ponte do comércio do Mar Negro."
 bul_black_sea_dominion: "Domínio do Mar Negro"
 bul_black_sea_dominion_desc: "A vasta linha costeira do Mar Negro — estabeleça a supremacia no comércio dessas águas."
 bul_third_bulgarian_empire: "O Terceiro Império Búlgaro"
 bul_third_bulgarian_empire_desc: "Independência, unificação dos Bálcãs, derrota dos otomanos e fundação do Novo Bizâncio — aqui o Terceiro Império Búlgaro está concluído."
 bul_events.1.t: "Proclamação da Unificação Imperial"
 bul_events.1.d: "Tarnovo, Vidin e Dobruja, outrora fragmentadas, estão de novo unidas como um só império. O Segundo Império Búlgaro encontra nova força."
 bul_events.1.a: "Glória à Bulgária!"
 bul_events.4.t: "A História de Sófia"
 bul_events.4.d: "Essa antiga cidade, chamada pelos romanos de Serdica e, mais tarde, pelos eslavos de Sredets, assumirá agora um novo nome em honra à Igreja da Santa Sabedoria (Sofia). Trácios, romanos, bizantinos e búlgaros — que o peso das muitas civilizações que passaram por essa bacia seja gravado na memória."
 bul_events.4.a: "Chamá-la Sófia"
 bul_events.4.b: "Chamá-la Sófia e fazer dela a nova capital imperial"
 bul_events.2.t: "Proclamação do Império Búlgaro"
 bul_events.2.d: "Como governante da Macedônia e da Sérvia, a Bulgária aqui se proclama império."
 bul_events.2.a: "Viva o Imperador!"
 bul_events.3.t: "O Sonho do Novo Bizâncio"
 bul_events.3.d: "Por trás das muralhas de Constantinopla e nas colinas da eterna Roma por igual, o estandarte da Bulgária tremula agora. Como novo centro do mundo ortodoxo e sede da Igreja Ocidental, essas duas cidades renascem aqui como pilares gêmeos do novo império."
 bul_events.3.a: "Deus está conosco!"
 bul_events.99.t: "Proclamação do Terceiro Império Búlgaro"
 bul_events.99.d: "O longo caminho, iniciado na antiga cidade de Tarnovo, pela unificação dos Bálcãs, pela derrota dos otomanos e pela fundação do Novo Bizâncio, alcançou aqui seu verdadeiro cumprimento."
 bul_events.99.a: "Viva o Terceiro Império Búlgaro!"
 bul_hagia_sophia_sofia: "A Igreja de Santa Sofia"
 bul_hagia_sophia_sofia_desc: "A basílica erguida no século VI no reinado do imperador Justiniano — seu nome, que significa “Santa Sabedoria”, emprestar-se-á com o tempo à cidade que cresceu em torno dela. Tendo sobrevivido a incontáveis séculos, essa igreja dá em silêncio testemunho de sua história como alma da nova capital, assentada no coração da Bulgária."
 STATIC_MODIFIER_NAME_bul_legacy_mod: "O Legado do Segundo Império Búlgaro"
 STATIC_MODIFIER_DESC_bul_legacy_mod: "Mesmo em meio à tempestade das lutas internas, a máquina do direito e o ofício dos escribas na corte mal se sustentam."
 STATIC_MODIFIER_NAME_bul_independence_mod: "Independência Estabelecida"
 STATIC_MODIFIER_DESC_bul_independence_mod: "Ninguém ousa mais questionar a autoridade de quem se senta no trono de Tarnovo."
 STATIC_MODIFIER_NAME_bul_tarnovo_mod: "A Grande Tarnovo"
 STATIC_MODIFIER_DESC_bul_tarnovo_mod: "Os palácios e igrejas, erguidos na colina de Tsarevets, recuperam a grandeza de capital imperial."
 STATIC_MODIFIER_NAME_bul_patriarchate_mod: "O Patriarcado Búlgaro"
 STATIC_MODIFIER_DESC_bul_patriarchate_mod: "A bênção do Patriarca traz paz ao coração dos fiéis, onde quer que vivam."
 STATIC_MODIFIER_NAME_bul_boyar_mod: "O Conselho dos Boiardos"
 STATIC_MODIFIER_DESC_bul_boyar_mod: "Os boiardos renovaram seu juramento de lealdade ao trono."
 STATIC_MODIFIER_NAME_bul_reunite_mod: "Bulgária Unificada"
 STATIC_MODIFIER_DESC_bul_reunite_mod: "Sobre as terras, outrora rasgadas, um só estandarte tremula de novo."
 STATIC_MODIFIER_NAME_bul_macedonia_mod: "Macedônia Conquistada"
 STATIC_MODIFIER_DESC_bul_macedonia_mod: "As montanhas, que outrora testemunharam a glória de Samuel, voltaram ao domínio do tsar."
 STATIC_MODIFIER_NAME_bul_extend_empire_mod: "Império Ampliado"
 STATIC_MODIFIER_DESC_bul_extend_empire_mod: "Nossas crescentes fronteiras mostram nossa força a todo reino vizinho."
 STATIC_MODIFIER_NAME_bul_ottoman_wars_mod: "As Guerras Otomanas"
 STATIC_MODIFIER_DESC_bul_ottoman_wars_mod: "Incontáveis choques com a ameaça turca temperaram nossos soldados."
 STATIC_MODIFIER_NAME_bul_varna_mod: "A Cruzada de Varna"
 STATIC_MODIFIER_DESC_bul_varna_mod: "A memória dos que tombaram nas colinas de Varna é contada até hoje."
 STATIC_MODIFIER_NAME_bul_end_ottoman_mod: "Ameaça Otomana Encerrada"
 STATIC_MODIFIER_DESC_bul_end_ottoman_mod: "Um suspiro de alívio atravessa os Bálcãs quando a há muito temida ameaça se afasta."
 STATIC_MODIFIER_NAME_bul_constantinople_ambition_mod: "Ambição sobre Constantinopla"
 STATIC_MODIFIER_DESC_bul_constantinople_ambition_mod: "A sombra de nossos navios de guerra cai agora sobre a rota marítima que liga o Mar Negro ao Mediterrâneo."
 STATIC_MODIFIER_NAME_bul_varna_port_mod: "Comércio do Mar Negro"
 STATIC_MODIFIER_DESC_bul_varna_port_mod: "Navios mercantes estrangeiros chegam e partem sem cessar do porto de Varna."
 STATIC_MODIFIER_NAME_bul_black_sea_dominion_mod: "Domínio do Mar Negro"
 STATIC_MODIFIER_DESC_bul_black_sea_dominion_mod: "Os navios mercantes búlgaros navegam agora pelas ondas do Mar Negro como se fossem seu próprio mar."
 STATIC_MODIFIER_NAME_bul_third_bulgarian_empire_mod: "O Terceiro Império Búlgaro"
 STATIC_MODIFIER_DESC_bul_third_bulgarian_empire_mod: "A luz que outrora brilhou de Tarnovo ilumina agora todos os Bálcãs."
 STATIC_MODIFIER_NAME_bul_bulgarian_independence_mod: "Independência da Bulgária Proclamada"
 STATIC_MODIFIER_DESC_bul_bulgarian_independence_mod: "As terras fragmentadas são de novo uma só, e toda nação deve contar com esse renascimento."
 STATIC_MODIFIER_NAME_bul_new_byzantium_mod: "O Novo Bizâncio"
 STATIC_MODIFIER_DESC_bul_new_byzantium_mod: "Novas vozes de oração ressoam agora pelas igrejas de Constantinopla."
