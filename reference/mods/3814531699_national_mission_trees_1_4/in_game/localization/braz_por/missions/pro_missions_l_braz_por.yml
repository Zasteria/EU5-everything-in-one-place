l_braz_por:
 pro_jewel_of_occitania_mission_pack: "A Joia da Occitânia"
 pro_jewel_of_occitania_mission_pack_DESCRIPTION:0 "Como descendentes da casa capetíngia de Anjou, os condes da Provença detêm reivindicações a Nápoles, à Sicília, a Aragão, à Hungria e a Jerusalém. Desenvolva Marselha como a maior cidade portuária do Mediterrâneo, una a Occitânia e mostre ao mundo os legítimos direitos hereditários da dinastia angevina. A glória de “Rei dos Reis” aguarda."
 pro_jewel_of_occitania_mission_pack_CRITERIA_DESCRIPTION:0 "Como conde da Provença, realize os direitos hereditários da casa de Anjou, una a Occitânia e conquiste a França."
 pro_jewel_of_occitania_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para tornar-se o Rei dos Reis."
 pro_jewel_of_occitania_mission_pack_BUTTON_DETAILS:0 "Governe o mundo a partir de Marselha!"
 pro_house_of_anjou: "As Ambições da Casa de Anjou"
 pro_house_of_anjou_desc: "A casa capetíngia de Anjou outrora floresceu como casa real da Sicília, de Nápoles e da Hungria, mas agora conserva apenas o Condado da Provença no sul da França. E, no entanto, o coração do rei René nutre sonhos de muitas reivindicações reais. Chegou a hora de recuperar a glória do solo da Provença."
 pro_statutes_of_aix: "Os Estatutos de Aix"
 pro_statutes_of_aix_desc: "Aix-en-Provence, como capital do Condado da Provença, desenvolveu seu próprio sistema jurídico, conhecido como “Estatutos de Aix”. O estabelecimento do controle e da codificação jurídica desbloqueia duas instituições singulares: os Etats de Provence (Estados Gerais) e o Porto Livre de Marselha."
 pro_statutes_of_aix_unlock_tt: "Desbloqueia os privilégios urbanos Estados Gerais da Provença e Porto Livre de Marselha."
 pro_sponsor_the_arts: "Patrocine as Artes"
 pro_sponsor_the_arts_desc: "O rei René é conhecido como um dos maiores mecenas do Renascimento italiano. Convide artistas e eruditos e faça da Provença o centro ocidental da cultura renascentista."
 pro_develop_marseille: "Desenvolva Marselha"
 pro_develop_marseille_desc: "Marselha, cidade portuária fundada pelos antigos gregos, é nó-chave do comércio mediterrâneo. O desenvolvimento dessa cidade marca o primeiro passo da Provença rumo a tornar-se potência comercial e marítima."
 pro_toulon_dockyard: "O Estaleiro de Toulon"
 pro_toulon_dockyard_desc: "Toulon, magnífico porto natural, é uma das melhores posições navais do Mediterrâneo. Construa aqui um grande estaleiro e arsenal para fazer dela o porto de origem da frota provençal."
 pro_lords_of_the_rhone: "Senhores do Corredor do Ródano"
 pro_lords_of_the_rhone_desc: "O rio Ródano é vital rota de transporte e comércio, que liga os Alpes à Provença. O pleno domínio desse corredor estabelece a Provença como incontestada senhora do sul da França."
 pro_avignon_question: "A Questão de Avignon"
 pro_avignon_question_desc: "Avignon, sede do papado de 1309 a 1377, ainda existe como enclave papal. Traga essa cidade à Provença por diplomacia ou por conquista."
 pro_piqure_de_marseilles: "O Piqué de Marselha"
 pro_piqure_de_marseilles_desc: "O “piqué de Marselha”, intrincado tecido acolchoado, representa o refinado ofício têxtil da Provença. A ampliação da produção de tecido e de tecido fino traz à Provença grande riqueza."
 pro_la_marseillaise: "La Marseillaise"
 pro_la_marseillaise_desc: "A marcha, entoada por voluntários que partem de Marselha. O exército provençal é agora a mais forte força militar do sul da França."
 pro_claims_of_king_rene: "As Reivindicações do Rei René"
 pro_claims_of_king_rene_desc: "O Bom Rei René foi tragicamente expulso do trono napolitano e privado da coroa de Aragão. Mas os legítimos direitos hereditários da casa de Anjou não estão perdidos. Chegou a hora de mostrar esses direitos ao mundo."
 pro_king_of_naples: "Rei de Nápoles"
 pro_king_of_naples_desc: "O trono napolitano é a legítima herança da casa de Anjou. Recupere essa sede, arrancada pela dinastia Trastâmara de Aragão, e reconstrua o governo angevino no sul da Itália."
 pro_king_of_sicily: "Rei da Sicília"
 pro_king_of_sicily_desc: "O grande Reino da Sicília, outrora construído pelos normandos, foi também herdado pela casa de Anjou. Traga a Sicília de novo ao estandarte da Provença."
 pro_king_of_aragon: "Rei de Aragão"
 pro_king_of_aragon_desc: "O trono aragonês é detido pelo maior rival da casa de Anjou. Vingue-se da dinastia Trastâmara, que roubou Nápoles, e obtenha o domínio sobre a Península Ibérica."
 pro_king_of_hungary: "Rei da Hungria"
 pro_king_of_hungary_desc: "A casa de Anjou outrora governou como casa real da Hungria. Recupere esse trono, perdido no fim do século XIV, e estabeleça influência sobre a Europa Oriental."
 pro_king_of_jerusalem: "Rei de Jerusalém"
 pro_king_of_jerusalem_desc: "O título de “Rei de Jerusalém” é há muito reivindicado pela casa de Anjou. Ponha fim a esse título vazio conquistando de fato a Cidade Santa e tornando-se guardião do mundo cristão."
 pro_integrate_lorraine: "Incorpore a Lorena"
 pro_integrate_lorraine_desc: "O Ducado da Lorena é um dos poucos títulos que a casa de Anjou conseguiu preservar. Integre as diversas facções e traga a Lorena ao pleno controle provençal."
 pro_join_the_empire: "Junte-se ao Império"
 pro_join_the_empire_desc: "Juntar-se ao Sacro Império Romano é uma escolha diplomática sábia para proteger a Provença das ameaças das grandes potências. Alternativamente, liderar o Império como seu Arquiduque também é opção."
 pro_unite_occitania: "Una a Occitânia"
 pro_unite_occitania_desc: "O povo do sul da França, que fala occitano, está exausto da Cruzada Albigense e da Guerra dos Cem Anos. Una a Occitânia sob o estandarte dos condes da Provença e liberte-os do domínio francês."
 pro_gascony: "Gasconha"
 pro_gascony_desc: "A Gasconha, centrada em Bordeaux, é uma terra rica, com laços históricos com a Inglaterra. O controle de Toulouse e Bordeaux conquista todo o sul da França."
 pro_king_of_france: "Rei da França"
 pro_king_of_france_desc: "O Reino da França é há muito rival da Provença, mas chegou a hora de ocupar seu trono. Conquiste Paris e erga o estandarte angevino sobre toda a França."
 pro_king_of_kings: "Rei dos Reis"
 pro_king_of_kings_desc: "A casa de Anjou conquistou Nápoles, a Sicília, Aragão, a Hungria, Jerusalém e a França. Esse império, que porta muitas coroas, é governado pelo Rei dos Reis — sonho medieval realizado."
 STATIC_MODIFIER_NAME_pro_statutes_of_aix_mod: "Os Estatutos de Aix"
 STATIC_MODIFIER_DESC_pro_statutes_of_aix_mod: "Os condes da Provença, residentes em Aix-en-Provence, desenvolveram seu próprio código jurídico, que se baseava na tradição do direito romano. Essa lei escrita codificou os direitos e deveres de nobres, clero e burgueses, fazendo da Provença uma das regiões mais avançadas juridicamente da França medieval."
 STATIC_MODIFIER_NAME_pro_sponsor_the_arts_mod: "Mecenato das Artes"
 STATIC_MODIFIER_DESC_pro_sponsor_the_arts_mod: "O próprio rei René manejava o pincel e compunha poesia — raro governante-artista. Sua corte herdou a tradição dos trovadores da Provença, atraindo ao mesmo tempo artistas de Flandres e da Itália. Grande parte de sua reputação de “Bom Rei René” baseia-se nesse extraordinário mecenato cultural."
 STATIC_MODIFIER_NAME_pro_marseille_mod: "Prosperidade de Marselha"
 STATIC_MODIFIER_DESC_pro_marseille_mod: "Fundada como Massália por colonos gregos de Foceia por volta de 600 a.C., Marselha é desde a Antiguidade nó do comércio mediterrâneo. Na época das cruzadas, serviu de principal ponto de reunião de gente e materiais rumo à Terra Santa. Essa antiga cidade portuária é o coração econômico da Provença."
 STATIC_MODIFIER_NAME_pro_toulon_dockyard_mod: "O Estaleiro de Toulon"
 STATIC_MODIFIER_DESC_pro_toulon_dockyard_mod: "A baía de Toulon, magnífico porto natural, abrigada por colinas, oferece refúgio a navegantes desde a Antiguidade. Os condes da Provença desenvolveram essa fortaleza natural como base naval no século XV. Luís XIV construirá mais tarde aqui um dos maiores arsenais navais da Europa — legado que já lança raízes."
 STATIC_MODIFIER_NAME_pro_lords_of_the_rhone_mod: "Senhores do Corredor do Ródano"
 STATIC_MODIFIER_DESC_pro_lords_of_the_rhone_mod: "O rio Ródano é, desde os tempos romanos, a grande artéria que liga o Mediterrâneo ao interior da França. Ao longo dessa via d’água ficam Arles, Avignon e incontáveis cidades comerciais, pelas quais há séculos fluem mercadorias, exércitos e peregrinos. Controlar esse corredor é deter o coração estratégico da Provença."
 STATIC_MODIFIER_NAME_pro_avignon_question_mod: "Avignon Incorporada"
 STATIC_MODIFIER_DESC_pro_avignon_question_mod: "De 1309 a 1377, sete papas residiram em Avignon, em vez de Roma, no que ficou conhecido como “Papado de Avignon”. Esse singular episódio transformou Avignon numa das maiores cidades diplomáticas da Europa. A memória da corte papal ainda persiste nessa cidade — sua tomada tem profundo peso simbólico para o mundo católico."
 STATIC_MODIFIER_NAME_pro_piqure_de_marseilles_mod: "O Piqué de Marselha"
 STATIC_MODIFIER_DESC_pro_piqure_de_marseilles_mod: "O “piqué de Marselha”, tecido acolchoado de intrincada costura em ambos os lados, conquistou a Europa nos séculos XVII e XVIII. Suas raízes estão nos hábeis tecelões medievais da Provença. O tecido fino, exportado pelo porto de Marselha, há muito constitui a pedra angular da reputação comercial da Provença."
 STATIC_MODIFIER_NAME_pro_la_marseillaise_mod: "La Marseillaise"
 STATIC_MODIFIER_DESC_pro_la_marseillaise_mod: "A canção, entoada por voluntários marselheses que marchavam para Paris durante a Revolução, tornar-se-á um dia hino nacional da França. Mas o espírito guerreiro da Provença é ainda mais antigo — temperado nas arenas de torneio de Arles, nas cruzadas e em incontáveis campanhas sob o estandarte angevino por todo o Mediterrâneo."
 STATIC_MODIFIER_NAME_pro_claims_of_king_rene_mod: "As Reivindicações do Rei René"
 STATIC_MODIFIER_DESC_pro_claims_of_king_rene_mod: "O “Bom Rei René” detinha reivindicações a Nápoles, à Sicília, a Aragão, à Hungria e a Jerusalém e, no entanto, perdeu quase todas as suas guerras. Ainda assim, sua obstinada manutenção desses títulos — mantidos por décadas de diplomacia e mecenato artístico — manteve viva a legitimidade da dinastia angevina nas cortes da Europa."
 STATIC_MODIFIER_NAME_pro_king_of_naples_mod: "Título de Rei de Nápoles"
 STATIC_MODIFIER_DESC_pro_king_of_naples_mod: "O Reino angevino de Nápoles, fundado por Carlos I de Anjou em 1266, foi outrora a potência dominante do sul da Itália. Embora a Sicília tenha sido perdida nas Vésperas Sicilianas, Nápoles permaneceu como joia da coroa das ambições francesas na Itália e o mais tangível símbolo do poder angevino na península."
 STATIC_MODIFIER_NAME_pro_king_of_sicily_mod: "Título de Rei da Sicília"
 STATIC_MODIFIER_DESC_pro_king_of_sicily_mod: "As Vésperas Sicilianas de 1282 — quando os ilhéus se ergueram e massacraram seus governantes franceses ao som dos sinos das igrejas — expulsaram a casa de Anjou da Sicília para sempre e trouxeram os aragoneses. Mas essa ilha, onde outrora floresceram juntas as culturas normanda, árabe e bizantina, permanece o maior sonho inacabado dos Anjou."
 STATIC_MODIFIER_NAME_pro_king_of_aragon_mod: "Título de Rei de Aragão"
 STATIC_MODIFIER_DESC_pro_king_of_aragon_mod: "A Coroa de Aragão construiu um império mediterrâneo, que abarcava a Sicília, a Sardenha e Nápoles — e o fez em grande parte à custa da casa de Anjou. Mais de um século de rivalidade entre essas duas dinastias moldou a política do Mediterrâneo ocidental. Arrancar a coroa de Aragão das mãos dos Trastâmara é a vingança suprema."
 STATIC_MODIFIER_NAME_pro_king_of_hungary_mod: "Título de Rei da Hungria"
 STATIC_MODIFIER_DESC_pro_king_of_hungary_mod: "Quando Carlos Roberto (Carobert) de Anjou se tornou rei da Hungria em 1310, um ramo da família estabeleceu-se na Europa Central como grande potência. Sob a dinastia angevina, a Hungria viveu uma de suas mais prósperas épocas, antes que os Habsburgo e os otomanos transformassem a região."
 STATIC_MODIFIER_NAME_pro_king_of_jerusalem_mod: "Título de Rei de Jerusalém"
 STATIC_MODIFIER_DESC_pro_king_of_jerusalem_mod: "Quando Godofredo de Bulhão conduziu a Primeira Cruzada à vitória em 1099, nasceu o Reino de Jerusalém. Perdido para Saladino em 1187 e jamais plenamente recuperado, o título de “Rei de Jerusalém” tornou-se reivindicação vazia, transmitida entre dinastias europeias. A casa de Anjou há muito detém esse título — agora ele se torna real."
 STATIC_MODIFIER_NAME_pro_integrate_lorraine_mod: "Lorena Incorporada"
 STATIC_MODIFIER_DESC_pro_integrate_lorraine_mod: "A Lorena (Lothringen) é fronteira disputada desde que o Tratado de Verdun dividiu o império de Carlos Magno. O pai de René I, Luís II, detinha o Ducado da Lorena, e o próprio René foi duque da Lorena antes de herdar a Provença. Esse antigo ducado liga o mundo francês e o alemão."
 STATIC_MODIFIER_NAME_pro_join_the_empire_mod: "Diplomacia Imperial"
 STATIC_MODIFIER_DESC_pro_join_the_empire_mod: "O Sacro Império Romano faz fronteira com a Provença há muito, e, pela Lorena, a casa de Anjou já tem laços com o mundo imperial. Seja juntando-se como membro, seja liderando como Arquiduque, inserir a Provença na complexa rede de alianças do Império amplia muito seu alcance diplomático."
 STATIC_MODIFIER_NAME_pro_unite_occitania_mod: "União da Occitânia"
 STATIC_MODIFIER_DESC_pro_unite_occitania_mod: "O sul de língua occitana foi outrora lar dos trovadores — poetas que inventaram a arte do amor cortês e cujas canções se espalharam pela Europa. A Cruzada Albigense do século XIII e a Guerra dos Cem Anos destruíram esse mundo. Unir a Occitânia sob a Provença é reacender uma civilização perdida."
 STATIC_MODIFIER_NAME_pro_gascony_mod: "Gasconha Tomada"
 STATIC_MODIFIER_DESC_pro_gascony_mod: "A Gasconha, centrada no grande porto vinícola de Bordeaux, foi a última posse continental significativa da Inglaterra — detida por três séculos, antes de ser perdida em 1453. Rica em vinho, lã e comércio atlântico, essa região sempre foi um prêmio. Arrancá-la da influência inglesa completa o arco meridional da França provençal."
 STATIC_MODIFIER_NAME_pro_king_of_france_mod: "Título de Rei da França"
 STATIC_MODIFIER_DESC_pro_king_of_france_mod: "A dinastia capetíngia da França e seu ramo mais jovem angevino compartilham sangue comum — e, no entanto, seus caminhos divergiram quando Carlos de Anjou zarpou para o sul para conquistar a Sicília. Agora o ramo mais jovem ocupa o trono da linha principal. O “Rei Cristianíssimo” da França, filho primogênito da Igreja, porta a coroa mais prestigiosa da cristandade católica."
 STATIC_MODIFIER_NAME_pro_king_of_kings_mod: "Rei dos Reis"
 STATIC_MODIFIER_DESC_pro_king_of_kings_mod: "Nápoles, Sicília, Aragão, Hungria, Jerusalém, França — nenhuma dinastia medieval jamais portou simultaneamente tantas coroas. A casa de Anjou elevou-se de um minúsculo condado provençal a um império, que se estende do Mediterrâneo ao Danúbio. O sonho do “Bom Rei René” — descartado como fantasia impossível — está realizado."
 pro_events.2.t: "As Reivindicações do Rei René"
 pro_events.2.d: "Chegou a hora de proclamar os legítimos direitos hereditários da casa de Anjou. O Reino de Nápoles foi outrora angevino, mas foi perdido na derrota diante das forças aragonesas de Afonso V. Agora, em nome do rei René, contestamos essa injusta ocupação. Obtenha casus belli contra Nápoles e prove a legitimidade da casa de Anjou pela força das armas."
 pro_events.2.a: "Nápoles pertence à casa de Anjou!"
 pro_lorraine_marriage: "Casamento com a Lorena"
 pro_lorraine_marriage_desc: "O Ducado da Lorena é um dos títulos que a casa de Anjou outrora deteve. Aprofunde os laços com a casa da Lorena por casamento diplomático e aliança, abrindo o caminho para sua concessão em feudo. Estabeleça relações com a Lorena por parentesco, casamento ou aliança."
 pro_events.3.t: "O Governo de Roberto, o Sábio"
 pro_events.3.d: "Em 1337, a Provença é governada por Roberto de Anjou (Roberto d’Angiò, c. 1277–1343), celebrado como “o Sábio”. Como rei de Nápoles, rei titular de Jerusalém e conde da Provença, ergue-se como figura central da política italiana. Campeão do partido guelfo (pró-papal), que repeliu invasões imperiais, em 1336 expulsou João da Boêmia da Itália. Profundo amante das artes e do saber, respeitado por Petrarca e Boccaccio por igual, Roberto trouxe uma era de ouro da cultura a Nápoles e à Provença. Mas seus últimos anos são perturbados pelo fracasso na recuperação da Sicília e pela crise sucessória. A herdeira de Roberto, Joana, é jovem, e o futuro da casa de Anjou, incerto. Chegou a hora de continuar a vontade desse grande rei e reconstruir a glória da casa de Anjou."
 pro_events.3.a: "Continuar a vontade do rei Roberto e reconstruir a glória dos Anjou!"
 pro_events.4.t: "Casamento com a Lorena"
 pro_events.4.d: "Por meio de manobras diplomáticas e política matrimonial, nossas relações com o Ducado da Lorena tornaram-se mais fortes que nunca. Com sangue angevino e lorenês entrelaçados, os interesses das duas casas estão profundamente ligados. Chegou a hora de acolher o duque da Lorena como vassalo da Provença e usar seus recursos e poder militar pela causa angevina."
 pro_events.4.a: "Acolher o duque da Lorena como vassalo"
 pro_events.4.b: "Preservar a independência, mantendo a aliança"
 pro_events.5.t: "Formação do Reino de Jerusalém"
 pro_events.5.d: "A Cidade Santa, Jerusalém, caiu enfim sob o estandarte da Provença. A casa de Anjou detém agora o título de “Rei de Jerusalém” tanto em nome quanto em ato, continuando a tradição cruzada. Reconstrua o Reino de Jerusalém (KOJ) nas posições-chave do Levante e deixe-o ser governado como vassalo da Provença. Esse reino sagrado, fundado pela primeira vez pela Primeira Cruzada em 1099, renasce pela mão da casa de Anjou. Como guardião da fé católica, defenda a Terra Santa das forças islâmicas."
 pro_events.5.a: "Reconstruir o Reino de Jerusalém e deixá-lo ser governado como vassalo angevino!"
 pro_etats_de_provence_town_rights: "Etats de Provence"
 pro_etats_de_provence_town_rights_desc: "Os Estados Gerais da Provença, dos quais participam nobreza, clero e burgueses. Reforçam os três estamentos e garantem a autonomia regional e o governo consultivo. Melhoram também a eficiência do gabinete."
 pro_marseille_free_port_town_rights: "Porto Livre de Marselha"
 pro_marseille_free_port_town_rights_desc: "Declara Marselha porto livre. Amplia muito os direitos comerciais dos mercadores e eleva o crescimento populacional, a prosperidade e o poder dos burgueses. Só pode ser concedido a Marselha."
 pro_events.6.t: "Resolução da Questão de Avignon"
 pro_events.6.d: "Avignon ergue-se como enclave papal em território provençal desde que o papado ali residiu em 1309. Quando o papa Gregório XI voltou a Roma em 1377, a cidade permaneceu como ponto de resistência papal, cravando uma cunha nas terras provençais que o conde da Provença há muito não suportava. Agora, com as relações com o papado em ordem, surgiu a oportunidade de resolver pacificamente a questão de Avignon. O papa concorda em ceder Avignon à Provença em troca de compensação adequada."
 pro_events.6.a: "Avignon pertence à Provença"
