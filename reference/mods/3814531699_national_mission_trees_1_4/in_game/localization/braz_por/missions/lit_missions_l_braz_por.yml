l_braz_por:
 lit_lithuania_mission_pack: "Do Báltico ao Mar Negro"
 lit_lithuania_mission_pack_DESCRIPTION:0 "Em 1337, o Grão-Ducado da Lituânia, sob o grão-duque Gediminas, é a mais dinâmica potência da Europa Oriental. Derrote a Ordem Teutônica, conquiste a Rus, alcance o Mar Negro, forme com a Polônia uma república nobiliárquica — e escolha sua fé, para definir a alma da Lituânia."
 lit_lithuania_mission_pack_CRITERIA_DESCRIPTION:0 "Conquiste do Báltico ao Mar Negro e forme com a Polônia uma república nobiliárquica, para erguer o grande império lituano."
 lit_lithuania_mission_pack_BUTTON_TOOLTIP:0 "Governe, como Lituânia, a Europa Oriental do Báltico ao Mar Negro."
 lit_lithuania_mission_pack_BUTTON_DETAILS:0 "“Terra da Lituânia, para sempre” — de Gediminas a Vytautas, restaure o brilho do Grão-Ducado!"
 lit_gediminas_legacy: "O Legado dos Gediminaitis"
 lit_gediminas_legacy_desc: "Herde as bases dinásticas lançadas pelo grão-duque Gediminas e percorra o caminho rumo ao grande império, que se estende do Báltico ao Mar Negro."
 lit_teutonic_threat: "A Ameaça da Ordem Teutônica"
 lit_teutonic_threat_desc: "A Ordem Teutônica, que marcha para o leste sob a bandeira da cruzada — esse Estado militar religioso — é a maior inimiga da Lituânia. Detenha-a e assegure a fronteira ocidental."
 lit_black_ruthenia_integration: "Integre a Rutênia Negra"
 lit_black_ruthenia_integration_desc: "A Rutênia Negra — situada em torno de Grodno e Brest — traga essa terra à esfera de governo da Lituânia como base para a expansão oriental."
 lit_volhynia_podolia: "Volínia e Podólia"
 lit_volhynia_podolia_desc: "Volínia e Podólia — traga as ricas planícies da Ucrânia Ocidental ao controle lituano e abra o caminho para o Mar Negro."
 lit_smolensk: "A Conquista de Smolensk"
 lit_smolensk_desc: "Smolensk — estratégica porta para a Rus oriental. Tome essa fortaleza e aumente a pressão sobre Moscou."
 lit_kyiv: "A Conquista de Kiev"
 lit_kyiv_desc: "Kiev — mãe de todas as cidades russas. Se a Lituânia tomar Kiev, abre-se o caminho para tornar-se “senhora de toda a Rus”."
 lit_steppe_frontier: "A Fronteira da Estepe"
 lit_steppe_frontier_desc: "A grande estepe, onde vagam tártaros e cumanos — erga uma linha de defesa nessa perigosa fronteira e abra o caminho para a Crimeia."
 lit_crimea: "Subjugação da Crimeia"
 lit_crimea_desc: "A península da Crimeia — chave do Mar Negro. Subjugue o Canato da Crimeia e assegure a porta para o Mar Negro."
 lit_black_sea: "Senhor do Mar Negro"
 lit_black_sea_desc: "O Mar Negro — o mar da Lituânia. Da Crimeia a Odessa, cubra toda a costa do Mar Negro com o estandarte lituano."
 lit_dominant_in_rus: "Supremacia sobre a Rus"
 lit_dominant_in_rus_desc: "Moscou ou Lituânia — na luta pela supremacia sobre a Europa Oriental, a Lituânia triunfa e governa como “senhora de toda a Rus”."
 lit_teutonic_defeat: "A Queda da Ordem Teutônica"
 lit_teutonic_defeat_desc: "O velho inimigo desde os tempos de Grunwald, a Ordem Teutônica, enfim caiu — o domínio do Báltico pertence à Lituânia."
 lit_samogitia: "A Samogícia"
 lit_samogitia_desc: "A Samogícia — terra há muito disputada com a Ordem Teutônica. Restitua à Lituânia a pátria desse teimoso povo báltico."
 lit_livonia: "Domínio da Livônia"
 lit_livonia_desc: "Riga e a Livônia — traga o coração do comércio báltico ao controle lituano e estabeleça influência sobre a Hansa."
 lit_jogaila_union: "A União de Jagelão"
 lit_jogaila_union_desc: "A união do grão-duque Jagelão com o Reino da Polônia — pela conversão ao catolicismo e pelo casamento, Lituânia e Polônia estão ligadas."
 lit_jagiellonian_dynasty: "A Dinastia Jagielônica"
 lit_jagiellonian_dynasty_desc: "A dinastia jagielônica — governando tanto a Lituânia quanto a Polônia, essa casa surge como a maior potência da Europa Central."
 lit_lublin_union: "A União de Lublin"
 lit_lublin_union_desc: "A União de Lublin de 1569 — momento histórico em que Lituânia e Polônia se unem na “República das Duas Nações”."
 lit_polish_sejm: "O Sejm Polonês"
 lit_polish_sejm_desc: "O Sejm — essa instituição, pela qual a nobreza participa das decisões do Estado, torna-se coração da república nobiliárquica."
 lit_commonwealth: "Conclusão da República Nobiliárquica"
 lit_commonwealth_desc: "A república nobiliárquica polaco-lituana — o maior Estado da Europa Central, que se estende do Báltico ao Mar Negro, concluída. “Por nossa liberdade” — o estandarte dessa república nobiliárquica brilha sobre a Europa."
 lit_faith_choice: "A Escolha da Fé"
 lit_faith_choice_desc: "Catolicismo, ortodoxia ou Romuva — que fé escolherá a Lituânia? Essa decisão definirá o futuro da nação."
 lit_catholic_baptism: "Batismo na Fé Católica"
 lit_catholic_baptism_desc: "O batismo de Vilnius de 1387 — a Lituânia aceita o catolicismo e torna-se parte da cristandade europeia."
 lit_faith_romuva_chosen_tt: "Escolheu a Romuva"
 lit_faith_orthodox_chosen_tt: "Escolheu a Ortodoxia"
 lit_faith_catholic_chosen_tt: "Escolheu o Catolicismo"
 lit_catholic_crusade: "A Cruzada Católica"
 lit_catholic_crusade_desc: "Sob o estandarte católico — pelo contra-ataque ao Estado cruzado pagão da Ordem Teutônica, a Lituânia é reconhecida como defensora do mundo católico."
 lit_catholic_bishoprics: "Estabelecimento de Bispados"
 lit_catholic_bishoprics_desc: "O bispado de Vilnius — organize a estrutura da Igreja Católica na Lituânia e deixe que a fé lance raízes profundas."
 lit_catholic_king: "Coroação do Rei Católico"
 lit_catholic_king_desc: "O rei católico da Polônia-Lituânia — a legítima coroa, reconhecida pelo papa, brilha agora sobre a dinastia jagielônica."
 lit_orthodox_metropolis: "A Metrópole Ortodoxa"
 lit_orthodox_metropolis_desc: "A Metrópole de Kiev — a Lituânia toma sob sua proteção o centro da ortodoxia da Rus. Governe a Europa Oriental como protetora dos fiéis ortodoxos."
 lit_orthodox_third_rome: "A Terceira Roma"
 lit_orthodox_third_rome_desc: "Agora que Constantinopla caiu — Kiev torna-se o novo centro da ortodoxia, a “Terceira Roma”."
 lit_orthodox_unity: "Unidade da Igreja Ortodoxa"
 lit_orthodox_unity_desc: "A unidade dos fiéis ortodoxos — as igrejas ortodoxas de toda a Rus reúnem-se sob a proteção da Lituânia."
 lit_orthodox_tsar: "O Tsar Ortodoxo"
 lit_orthodox_tsar_desc: "“Tsar de toda a Rus” — o monarca lituano, que une a autoridade ortodoxa ao governo sobre a Rus, supera até o próprio Moscou."
 lit_romuva_maintained: "Preserve a Romuva"
 lit_romuva_maintained_desc: "A Romuva, antiga fé báltica — a chama eterna do sacerdote-žynys arde de novo, e a Lituânia está sob a bandeira pagã."
 lit_romuva_sanctuary: "Erga o Santuário"
 lit_romuva_sanctuary_desc: "Os bosques sagrados da Lituânia — proteja os santuários da Romuva e estabeleça o centro espiritual da fé báltica."
 lit_romuva_expansion: "Expansão Pagã"
 lit_romuva_expansion_desc: "Difunda a Romuva pela espada — converta os ortodoxos, católicos e muçulmanos circundantes à Romuva e erga o “grande Estado pagão”."
 lit_romuva_pagan_king: "O Rei Pagão"
 lit_romuva_pagan_king_desc: "“O Grande Rei Pagão” — nasceu o monarca lituano pagão, que ergueu a chama da Romuva e governa do Báltico à estepe."
 lit_vilnius_capital: "Desenvolva Vilnius"
 lit_vilnius_capital_desc: "Vilnius — a cidade dourada da Lituânia. Desenvolva seus palácios, sua catedral e seus mercados e dê-lhe um esplendor digno de capital imperial."
 lit_amber_road: "A Rota do Âmbar"
 lit_amber_road_desc: "A Rota do Âmbar — tome essa rota comercial, por onde o âmbar do Báltico é levado ao Mediterrâneo, e faça da Lituânia um nó do comércio europeu."
 lit_grand_duchy_law: "O Estatuto Lituano"
 lit_grand_duchy_law_desc: "O Estatuto Lituano — emitido em 1529 como o mais avançado código de leis da Europa Central, modernize o governo da Lituânia."
 lit_krakow: "Desenvolva Cracóvia"
 lit_krakow_desc: "Cracóvia — desenvolva essa cidade do brilho jagielônico e deixe-a brilhar como segunda capital da república nobiliárquica polaco-lituana."
 lit_red_ruthenia: "Conquista da Rutênia Vermelha"
 lit_red_ruthenia_desc: "A Rutênia Vermelha e Halych — disputadas pela Polônia e pela Hungria, tome essa terra para a Lituânia e amplie seu território até os Cárpatos."
 lit_moldavia: "Subjugação da Moldávia"
 lit_moldavia_desc: "A Moldávia — principado romeno junto ao Danúbio. Subjugue esse Estado e estabeleça uma cabeça de ponte nos Bálcãs."
 lit_grand_empire: "O Grande Império Lituano"
 lit_grand_empire_desc: "“Do Báltico ao Mar Negro” — o sonho do grão-duque Vytautas realizado. O Grão-Ducado da Lituânia governa o maior império da Europa."
 lit_events.5.t: "A Escolha da Fé"
 lit_events.5.d: "A Lituânia está numa encruzilhada. Converter-se ao catolicismo e aprofundar a união com a Polônia? Defender a ortodoxia e tornar-se protetora da Rus? Ou preservar a fé herdada da Romuva e tornar-se grande rei pagão?"
 lit_events.5.a: "Converter-se ao catolicismo — juntar-se à cristandade e aprofundar a aliança polonesa"
 lit_events.5.b: "Escolher a ortodoxia — tornar-se protetora da Rus e da cristandade oriental"
 lit_events.5.c: "Preservar a Romuva — nunca deixar apagar a chama sagrada do žynys"
 lit_events.10.t: "A Conquista de Kiev"
 lit_events.10.d: "Kiev — mãe de todas as cidades russas — caiu para a Lituânia. Não Moscou, mas a Lituânia leva agora o legado da Rus de Kiev."
 lit_events.10.a: "Glória a Kiev! Glória à protetora de toda a Rus!"
 lit_events.15.t: "O Rei Católico"
 lit_events.15.d: "Sob o reconhecimento papal, foi coroado o rei católico da Lituânia e da Polônia — a Lituânia é agora formalmente parte do mundo católico."
 lit_events.15.a: "Glória ao rei católico! Que o reino dure para sempre!"
 lit_events.16.t: "O Tsar da Lituânia"
 lit_events.16.d: "O governante da Lituânia proclama-se “Tsar de toda a Rus” — protetor da fé ortodoxa. Não Moscou, mas Vilnius deve ser a Terceira Roma."
 lit_events.16.a: "Glória ao tsar! Glória à Terceira Roma!"
 lit_events.17.t: "O Rei Pagão"
 lit_events.17.d: "A chama eterna do žynys arde clara — “o Grande Rei Pagão” ascendeu sob o estandarte da Romuva e governa do Báltico à estepe."
 lit_events.17.a: "Glória ao rei pagão! Que a chama da Romuva arda para sempre!"
 lit_events.20.t: "A Queda da Ordem Teutônica"
 lit_events.20.d: "De Grunwald ao ajuste de contas final — a Ordem Teutônica enfim caiu. O Báltico pertence à Lituânia."
 lit_events.20.a: "Ordem Teutônica derrotada! O Báltico é nosso!"
 lit_events.99.t: "O Grande Império Lituano"
 lit_events.99.d: "Do Báltico ao Mar Negro — o sonho de Vytautas realizado. A Lituânia governa o maior império da Europa Oriental, superando até a antiga Rus."
 lit_events.99.a: "Glória ao grande império lituano! Glória eterna!"
 STATIC_MODIFIER_NAME_lit_amber_mod: "Domínio da Rota do Âmbar"
 STATIC_MODIFIER_DESC_lit_amber_mod: "O comércio do âmbar do Báltico duplica a riqueza da Lituânia."
 STATIC_MODIFIER_NAME_lit_bishopric_mod: "Organização dos Bispados"
 STATIC_MODIFIER_DESC_lit_bishopric_mod: "Estrutura da Igreja Católica na Lituânia estabelecida, e a fé lançou raízes profundas."
 STATIC_MODIFIER_NAME_lit_black_sea_mod: "Domínio do Mar Negro"
 STATIC_MODIFIER_DESC_lit_black_sea_mod: "O Mar Negro tornou-se o mar interior da Lituânia, trazendo enorme fluxo de renda comercial."
 STATIC_MODIFIER_NAME_lit_catholic_king_mod: "Autoridade do Rei Católico"
 STATIC_MODIFIER_DESC_lit_catholic_king_mod: "Reconhecida em toda a Europa como rei católico, a autoridade diplomática da Lituânia estabelecida."
 STATIC_MODIFIER_NAME_lit_catholic_mod: "Batismo no Catolicismo"
 STATIC_MODIFIER_DESC_lit_catholic_mod: "A Lituânia converteu-se ao catolicismo e tornou-se parte da cristandade europeia."
 STATIC_MODIFIER_NAME_lit_crimea_mod: "Subjugação da Crimeia"
 STATIC_MODIFIER_DESC_lit_crimea_mod: "A península da Crimeia passou ao controle lituano, abrindo a porta para o Mar Negro."
 STATIC_MODIFIER_NAME_lit_crusade_mod: "Espírito de Cruzada"
 STATIC_MODIFIER_DESC_lit_crusade_mod: "O espírito da cruzada católica forjou o exército lituano."
 STATIC_MODIFIER_NAME_lit_dynasty_mod: "O Despertar da Dinastia dos Gediminaitis"
 STATIC_MODIFIER_DESC_lit_dynasty_mod: "O sangue dos Gediminaitis acende a ambição de conquistar a Europa Oriental."
 STATIC_MODIFIER_NAME_lit_grand_empire_mod: "Conclusão do Grande Império Lituano"
 STATIC_MODIFIER_DESC_lit_grand_empire_mod: "Do Báltico ao Mar Negro — o sonho do grão-duque Vytautas realizado."
 STATIC_MODIFIER_NAME_lit_jagiellonian_mod: "Governo da Dinastia Jagielônica"
 STATIC_MODIFIER_DESC_lit_jagiellonian_mod: "A dinastia jagielônica ergue-se como a maior casa real da Europa Central."
 STATIC_MODIFIER_NAME_lit_jogaila_mod: "A União de Jagelão"
 STATIC_MODIFIER_DESC_lit_jogaila_mod: "O selo de cera na União de Krewo mudou por completo o respeito dado aos enviados lituanos na corte polonesa."
 STATIC_MODIFIER_NAME_lit_krakow_mod: "Prosperidade de Cracóvia"
 STATIC_MODIFIER_DESC_lit_krakow_mod: "Cracóvia brilha como cidade do esplendor jagielônico."
 STATIC_MODIFIER_NAME_lit_livonia_mod: "Domínio da Livônia"
 STATIC_MODIFIER_DESC_lit_livonia_mod: "A Livônia, coração do comércio báltico, está agora sob o estandarte lituano."
 STATIC_MODIFIER_NAME_lit_moldavia_mod: "Subjugação da Moldávia"
 STATIC_MODIFIER_DESC_lit_moldavia_mod: "A Moldávia, sendo vassala lituana, torna-se cabeça de ponte para os Bálcãs."
 STATIC_MODIFIER_NAME_lit_orthodox_mod: "Proteção da Igreja Ortodoxa"
 STATIC_MODIFIER_DESC_lit_orthodox_mod: "A Lituânia tomou a igreja ortodoxa sob sua proteção e é reconhecida como protetora da Rus."
 STATIC_MODIFIER_NAME_lit_orthodox_tsar_mod: "O Tsar Ortodoxo"
 STATIC_MODIFIER_DESC_lit_orthodox_tsar_mod: "Como tsar de toda a Rus, a Lituânia governa como líder do mundo ortodoxo."
 STATIC_MODIFIER_NAME_lit_orthodox_unity_mod: "Unidade da Igreja Ortodoxa"
 STATIC_MODIFIER_DESC_lit_orthodox_unity_mod: "As igrejas ortodoxas de toda a Rus reuniram-se sob o estandarte lituano."
 STATIC_MODIFIER_NAME_lit_pagan_empire_mod: "Hegemonia do Grande Rei Pagão"
 STATIC_MODIFIER_DESC_lit_pagan_empire_mod: "Sob o estandarte da Romuva, o rei pagão governa do Báltico à estepe."
 STATIC_MODIFIER_NAME_lit_pagan_expansion_mod: "Expansão Pagã"
 STATIC_MODIFIER_DESC_lit_pagan_expansion_mod: "Sob o estandarte pagão, o exército lituano arrasa os Estados vizinhos."
 STATIC_MODIFIER_NAME_lit_red_ruthenia_mod: "Conquista da Rutênia Vermelha"
 STATIC_MODIFIER_DESC_lit_red_ruthenia_mod: "A Rutênia Vermelha e Halych juntaram-se ao governo da Lituânia."
 STATIC_MODIFIER_NAME_lit_romuva_mod: "Renascimento da Romuva"
 STATIC_MODIFIER_DESC_lit_romuva_mod: "A Romuva, antiga fé báltica, renascida, e a Lituânia é um Estado pagão."
 STATIC_MODIFIER_NAME_lit_rus_mod: "Senhora da Rus"
 STATIC_MODIFIER_DESC_lit_rus_mod: "A Lituânia tornou-se senhora de toda a Rus e líder da Europa Oriental."
 STATIC_MODIFIER_NAME_lit_ruthenia_mod: "Subjugação da Rutênia Negra"
 STATIC_MODIFIER_DESC_lit_ruthenia_mod: "A Rutênia Negra juntou-se ao governo da Lituânia, estabelecendo a base para a expansão oriental."
 STATIC_MODIFIER_NAME_lit_sanctuary_mod: "Estabelecimento do Santuário da Romuva"
 STATIC_MODIFIER_DESC_lit_sanctuary_mod: "Os bosques sagrados da Lituânia estabelecidos, e a chama pagã arde clara."
 STATIC_MODIFIER_NAME_lit_sejm_mod: "Estabelecimento do Sejm"
 STATIC_MODIFIER_DESC_lit_sejm_mod: "O Sejm estabelecido e moderniza o governo da Lituânia."
 STATIC_MODIFIER_NAME_lit_smolensk_mod: "Domínio de Smolensk"
 STATIC_MODIFIER_DESC_lit_smolensk_mod: "Smolensk funciona como porta oriental da Lituânia."
 STATIC_MODIFIER_NAME_lit_steppe_mod: "Estabelecimento da Fronteira da Estepe"
 STATIC_MODIFIER_DESC_lit_steppe_mod: "A fronteira da estepe estabelecida e detém as incursões tártaras."
 STATIC_MODIFIER_NAME_lit_teutonic_mod: "Resistência à Ordem Teutônica"
 STATIC_MODIFIER_DESC_lit_teutonic_mod: "A ameaça da Ordem Teutônica forjou o exército lituano."
 STATIC_MODIFIER_NAME_lit_third_rome_mod: "A Terceira Roma"
 STATIC_MODIFIER_DESC_lit_third_rome_mod: "Kiev tornou-se a “Terceira Roma”, centro da igreja ortodoxa."
 STATIC_MODIFIER_NAME_lit_volhynia_mod: "Conquista da Volínia e da Podólia"
 STATIC_MODIFIER_DESC_lit_volhynia_mod: "As planícies da Ucrânia Ocidental tingidas com o estandarte lituano."
 lit_vilnius_jerusalem: "A Jerusalém do Norte"
 lit_vilnius_jerusalem_desc: "Vilnius — a “Jerusalém do Norte”. A arte e a população fluem a essa cidade, onde coexistem diversas religiões e culturas, e ela brilha como centro cultural da Lituânia na Europa."
 STATIC_MODIFIER_NAME_lit_vilnius_jerusalem_mod: "A Jerusalém do Norte"
 STATIC_MODIFIER_DESC_lit_vilnius_jerusalem_mod: "Vilnius torna-se a “Jerusalém do Norte” — centro de diversas nações, religiões e culturas."
 STATIC_MODIFIER_NAME_lit_teutonic_victory_mod: "Derrota da Ordem Teutônica"
 STATIC_MODIFIER_DESC_lit_teutonic_victory_mod: "O estandarte preto e cruzado de Malbork arriado, e soldados lituanos marcham para o oeste com canções de vitória."
 STATIC_MODIFIER_NAME_lit_vilnius_capital_mod: "Vilnius Desenvolvida"
 STATIC_MODIFIER_DESC_lit_vilnius_capital_mod: "Da Torre de Gediminas, em Vilnius, os telhados e muralhas da capital imperial estendem-se a perder de vista."
 lit_memel: "Klaipėda — Porta do Báltico"
 lit_memel_desc: "Klaipėda (Memel) — cidade portuária na costa do Báltico. Recuperada da Ordem Teutônica, desenvolva essa cidade como porta da Lituânia para o mar e centro do comércio de âmbar."
 STATIC_MODIFIER_NAME_lit_memel_mod: "Porto de Klaipėda Desenvolvido"
 STATIC_MODIFIER_DESC_lit_memel_mod: "O porto de Klaipėda desenvolvido como porta do comércio báltico."
 STATIC_MODIFIER_NAME_lit_lublin_union_mod: "Benefícios da União de Lublin"
 STATIC_MODIFIER_DESC_lit_lublin_union_mod: "Sistema parlamentar e governo da república nobiliárquica estabelecidos."
 lit_lublin_dev: "Desenvolva Lublin"
 lit_lublin_dev_desc: "Lublin — futuro local da União de Lublin. Desenvolva essa cidade como centro administrativo e comercial do sul da Lituânia."
 lit_lviv_dev: "Desenvolva Lviv"
 lit_lviv_dev_desc: "Lviv — encruzilhada do comércio oriental. Desenvolva o centro de Halych e sustente a prosperidade do sudeste do reino."
 lit_kaunas_dev: "Kaunas — Guardiã do Direito Lituano"
 lit_kaunas_dev_desc: "Kaunas — situada na confluência do Nemunas e do Neris, essa cidade serviu de sede do Tribunal Principal do Grão-Ducado da Lituânia (Lietuvos Vyriausiasis Tribunolas) e funcionou como instância suprema de apelação para o lado lituano da república nobiliárquica. Como a corte real de Cracóvia, na Polônia, ou o Parlamento de Aix, na Provença, Kaunas serviu de guardiã do direito regional, ligando a legislação central ao costume local. Desenvolva Kaunas como centro da administração jurídica lituana."
 lit_hrodna_dev: "Desenvolva Grodno"
 lit_hrodna_dev_desc: "Grodno (Hrodna) — centro da Rutênia Negra. Desenvolva essa importante cidade ocidental do Grão-Ducado."
 lit_minsk_dev: "Desenvolva Minsk"
 lit_minsk_dev_desc: "Minsk — centro da Bielorrússia. Desenvolva-a como nó administrativo oriental do império lituano."
 STATIC_MODIFIER_NAME_lit_commonwealth_final_mod: "República Nobiliárquica Concluída"
 STATIC_MODIFIER_DESC_lit_commonwealth_final_mod: "A república nobiliárquica polaco-lituana concluída — governo e exército organizados em todas as províncias."
 STATIC_MODIFIER_NAME_lit_lublin_mod: "Lublin Prospera"
 STATIC_MODIFIER_DESC_lit_lublin_mod: "Lublin desenvolvida como centro administrativo e comercial do sul da Lituânia."
 STATIC_MODIFIER_NAME_lit_lviv_mod: "Lviv Prospera"
 STATIC_MODIFIER_DESC_lit_lviv_mod: "Lviv prospera como encruzilhada do comércio oriental."
 STATIC_MODIFIER_NAME_lit_kaunas_mod: "Tribunal Principal do Grão-Ducado da Lituânia"
 STATIC_MODIFIER_DESC_lit_kaunas_mod: "Kaunas desenvolvida como nó interno do comércio báltico."
 STATIC_MODIFIER_NAME_lit_hrodna_mod: "Reforço Administrativo de Grodno"
 STATIC_MODIFIER_DESC_lit_hrodna_mod: "Dos portões de Grodno, os cavalos dos mensageiros galopam da manhã à noite rumo à capital, Vilnius."
 STATIC_MODIFIER_NAME_lit_minsk_mod: "Minsk Prospera"
 STATIC_MODIFIER_DESC_lit_minsk_mod: "Minsk desenvolvida como nó administrativo oriental do império lituano."
