l_braz_por:
 swe_stormaktstiden_mission_pack: "Stormaktstiden — A Era das Grandes Potências da Suécia"
 swe_stormaktstiden_mission_pack_DESCRIPTION:0 "Em 1337, a Suécia é um reino independente em união pessoal com a Noruega sob o rei Magno Eriksson. Ao norte está a poderosa Dinamarca, e a luta pela dominação escandinava — prenunciada pela União de Kalmar (1397) — é inevitável. Por meio do cobre de Falun, do domínio do Báltico e das rotas orientais varegues, realize a Stormaktstiden (era das grandes potências) e construa o Império Sueco."
 swe_stormaktstiden_mission_pack_CRITERIA_DESCRIPTION:0 "Como Suécia, alcance dominação escandinava, unificação, expansão oriental e desenvolvimento industrial, para estabelecer o Império Escandinavo."
 swe_stormaktstiden_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para construir o Império Sueco."
 swe_stormaktstiden_mission_pack_BUTTON_DETAILS:0 "Da revolta de Engelbrekt à Stormaktstiden — forje a Suécia num Império!"
 swe_kingdom_of_sweden: "O Reino da Suécia"
 swe_kingdom_of_sweden_desc: "Em 1337, a Suécia é um reino independente em união pessoal com a Noruega sob o rei Magno Eriksson. Cercada pela poderosa Dinamarca ao norte, pelos principados russos a leste e pela Hansa ao sul, a Suécia deve reforçar sua legitimidade e estabilizar seu reino, preparando-se para a luta que virá pela dominação escandinava."
 swe_norway_union: "União Pessoal com a Noruega"
 swe_norway_union_desc: "A Suécia e a Noruega estão em união pessoal sob o rei Magno desde 1319. Reforçar essa união combina a força militar e econômica do noroeste da Escandinávia contra a Dinamarca."
 swe_break_from_denmark: "Oponha-se à Dinamarca"
 swe_break_from_denmark_desc: "A vindoura União de Kalmar (1397) ameaça dar à Dinamarca a dominação da Escandinávia — um futuro que a Suécia deve evitar. Afirme ativamente a autoridade sueca contra a Dinamarca agora e assegure a base para reivindicar a dominação escandinava. Antecipe o espírito da revolta de Engelbrekt (1434) e estabeleça a autoridade real sueca antes que chegue esse dia."
 swe_control_skaane: "Controle a Escânia"
 swe_control_skaane_desc: "A Escânia — a região mais meridional da Suécia, há muito disputada com a Dinamarca. Tomar Malmö e a Escânia garante o estreito de Öresund e dá à Suécia livre saída ao Báltico."
 swe_defeat_denmark: "Derrote a Dinamarca"
 swe_defeat_denmark_desc: "A Dinamarca é a maior inimiga da Suécia. Tomar Copenhague ou tornar a Dinamarca vassala sueca significa que o domínio do Norte passa à Suécia. “A Suécia — verdadeira líder da Escandinávia” — a posição com que sonhou Gustavo Vasa está aqui realizada."
 swe_integrate_norway: "Integre a Noruega"
 swe_integrate_norway_desc: "Possuir diretamente Oslo, Bergen e Nidaros integra a Noruega por completo como parte do Império Sueco. Os ricos pesqueiros da Noruega e a porta para o Atlântico Norte ampliam muito o poder sueco."
 swe_unite_scandinavia: "Una a Escandinávia"
 swe_unite_scandinavia_desc: "Dinamarca esmagada, Noruega integrada — toda a Escandinávia está unida sob o estandarte sueco. Esse feito — unir toda a Escandinávia, o que ninguém conseguira desde os vikings — é aqui realizado."
 swe_danish_navy_seizure: "Capture a Frota Dinamarquesa"
 swe_danish_navy_seizure_desc: "Com a Dinamarca derrotada, sua poderosa frota passa à Suécia. A mais forte força naval do Báltico está agora em mãos suecas, abrindo o caminho para a dominação do Mar do Norte."
 swe_danish_navy_seizure_unlock_tt: "A decisão “Incorporar a frota dinamarquesa” está agora disponível."
 swe_danish_fleet_decision.title: "Incorporar a frota dinamarquesa"
 swe_danish_fleet_decision.desc: "Os navios dinamarqueses capturados jazem ociosos nos portos do reino derrotado. Tripulá-los e reequipá-los custará caro ao tesouro e inquietará o reino, mas seis grandes carracas sob a bandeira sueca mudariam o equilíbrio do Báltico."
 swe_danish_fleet_decision.a: "Comissionar as seis carracas."
 swe_sound_toll: "A Taxa do Öresund"
 swe_sound_toll_desc: "Com a Escânia assegurada, a Suécia controla agora o estreito de Öresund pelo lado sueco. Cobrar a Taxa do Öresund no lugar da Dinamarca gera enorme renda."
 swe_control_gotland: "Controle Gotlândia"
 swe_control_gotland_desc: "Visby, em Gotlândia, é uma das maiores cidades comerciais do Báltico. Tomar esse prêmio — disputado com a Dinamarca, a Hansa e a Ordem Livônia — estabelece a cabeça de ponte da Suécia no comércio báltico."
 swe_baltic_trade: "Comércio Báltico"
 swe_baltic_trade_desc: "Usando Gotlândia como base, a Suécia entra seriamente no comércio báltico. Os varegues já levaram mercadorias da Suécia até Bizâncio. Ressuscite essa tradição e crie uma era de mercadores suecos que dominam o Báltico."
 swe_conquer_estonia: "Conquiste a Estônia"
 swe_conquer_estonia_desc: "Tallinn (Reval) foi originalmente construída pelos dinamarqueses, mas a Suécia conquistará a Estônia na guerra da Livônia (1558-83). Antecipe essa conquista histórica e estabeleça a cabeça de ponte da Suécia na costa leste do Báltico."
 swe_control_livonia: "Controle a Livônia"
 swe_control_livonia_desc: "Tomar Riga e Tartu (Dorpat) põe toda a costa leste do Báltico sob controle sueco. Em meio à rivalidade com a Polônia, a Rússia e a Dinamarca, a Suécia torna-se o supremo senhor da Livônia."
 swe_varangian_legacy: "O Legado Varegue"
 swe_varangian_legacy_desc: "Nos séculos VIII-X, os varegues (vikings) construíram Novgorod e abriram rotas comerciais pelo Dnieper até Constantinopla. Tomar Novgorod e Pskov ressuscita esse antigo legado em nossos dias."
 swe_city_of_rus: "A Cidade da Rus"
 swe_city_of_rus_desc: "Moscou é a capital do Grão-Principado de Moscou e o centro do mundo russo. Como herdeira dos varegues, a Suécia, controlando Moscou, completa o Império Sueco, que se estende do Báltico a toda a civilização eslava oriental."
 swe_bane_of_hansa: "O Flagelo da Hansa"
 swe_bane_of_hansa_desc: "A Liga Hanseática monopolizou o comércio báltico, mas surgem rachaduras à medida que a Suécia se expande. Controle Lübeck (líder da Hansa) ou desfaça por completo a Liga Hanseática, para transferir à Suécia o papel principal no comércio báltico."
 swe_pomeranian_coast: "A Costa da Pomerânia"
 swe_pomeranian_coast_desc: "Tomar Stralsund e Stettin põe a costa da Pomerânia, ao longo do Báltico meridional, sob controle sueco. Antecipe o que a Suécia realmente conquistou na Guerra dos Trinta Anos (1618-48) e assegure essa região."
 swe_prussian_ambition: "Ambições Prussianas"
 swe_prussian_ambition_desc: "A Prússia, outrora governada pelos cavaleiros teutônicos, é o nó báltico sudeste. Assegurar Königsberg e a região da Prússia dá à Suécia pleno domínio do Mar Báltico."
 swe_dominium_maris_baltici: "Dominium Maris Baltici"
 swe_dominium_maris_baltici_desc: "“Dominium Maris Baltici” (Domínio do Mar Báltico) — o supremo objetivo estratégico da Suécia no século XVII. Dominar toda a linha costeira báltica faz desse mar interior um “lago” sueco."
 swe_secure_stockholm: "Assegure Estocolmo"
 swe_secure_stockholm_desc: "Estocolmo — “ilha entre as águas” — cidade-fortaleza natural entre o lago Mälaren e o Báltico. Elevá-la ao posto de cidade com desenvolvimento 30+ estabelece-a como centro do poder real sueco."
 swe_falun_mine: "A Mina de Falun"
 swe_falun_mine_desc: "Stora Kopparberget (Grande Montanha de Cobre) — a mina de cobre de Falun opera desde o século IX, coração da economia sueca. Quando Magno IV concedeu privilégios adicionais à companhia mineira em 1347, ela cobria dois terços da demanda europeia por cobre. Maximize essa mina."
 swe_iron_industry: "A Indústria Sueca do Ferro"
 swe_iron_industry_desc: "As minas de ferro de Svealand são a base da indústria de defesa sueca. O ferro sueco de alta qualidade era cobiçado pelos exércitos de toda a Europa — os canhões da Guerra dos Trinta Anos usaram ferro sueco. Amplie ainda mais essa vantagem industrial."
 swe_swedish_steel: "O Aço Sueco"
 swe_swedish_steel_desc: "O aço sueco — aclamado como o de melhor qualidade da Europa. A indústria do aço, sustentada pela abundante produção de cobre e ferro, simboliza o poder econômico do Império Sueco, tanto no armamento dos exércitos suecos quanto na renda de exportação."
 swe_riksdag: "O Riksdag"
 swe_riksdag_desc: "O Riksdag (Parlamento), convocado pela primeira vez em 1435 na Suécia. Essa assembleia de estamentos de nobres, cavaleiros, clero e camponeses (peculiarmente, os camponeses suecos tinham sua própria representação estamental) deve ser fortalecida para estabelecer a singular tradição política da Suécia."
 swe_absolutism: "Absolutismo"
 swe_absolutism_desc: "Em 1680, Carlos XI recuperou as terras nobres por meio da “redução” e estabeleceu a monarquia absoluta na Suécia. Antecipe essa transformação histórica e consolide por completo a autoridade real."
 swe_great_power: "A Suécia como Grande Potência"
 swe_great_power_desc: "A Stormaktstiden do século XVII viu a Suécia erguer-se como principal potência europeia sob Gustavo Adolfo, Carlos X Gustavo e Carlos XII. Antecipe essa era com vasto território, rica renda e alto prestígio."
 swe_stormakt_economy: "A Economia da Grande Potência"
 swe_stormakt_economy_desc: "Aço sueco, eficiência administrativa da monarquia absoluta, comércio báltico — a base econômica da Stormaktstiden concluída. Demonstre o poder imperial sueco com renda mensal de 400+ e numerosos centros comerciais."
 swe_religious_crossroads: "A Encruzilhada da Fé"
 swe_religious_crossroads_desc: "A tempestade da Reforma varre a Escandinávia. A corte sueca debate com ardor: manter a fidelidade ao papa de Roma — adotar a revolucionária doutrina de Martinho Lutero — ou retornar aos antigos deuses cultuados pelos ancestrais. A decisão do rei sueco decidirá o futuro desse reino nórdico."
 swe_catholic_sweden: "A Suécia Católica"
 swe_catholic_sweden_desc: "O Reino da Suécia mantém fidelidade à Igreja de Roma. Relações estreitas com o papa dão à Suécia vantagem diplomática e o reconhecimento de guardiã da civilização católica do norte."
 swe_northern_crusade: "A Cruzada do Norte"
 swe_northern_crusade_desc: "A Suécia participa da guerra santa como escudo setentrional da cristandade. Liderar as cruzadas do norte contra nações não cristãs eleva a autoridade religiosa e o prestígio da Suécia."
 swe_church_reform: "Campeã do Papa"
 swe_church_reform_desc: "Profunda confiança com o papado e controle de Lübeck — a Suécia estabeleceu a posição inabalável de guardiã da civilização católica do norte."
 swe_reformation: "A Reforma"
 swe_reformation_desc: "Em 1527, o rei sueco Gustavo Vasa declarou o luteranismo religião de Estado de fato na dieta de Västerås. A transferência dos bens da igreja à coroa fortaleceu muito as finanças do Estado. Antecipe agora esse ato decisivo."
 swe_protestant_reform: "A Igreja Protestante"
 swe_protestant_reform_desc: "Desenvolva universidades para formar teólogos luteranos e enraizar a fé protestante em toda a Suécia. A distinção da igreja sueca torna-se a base da cultura e da identidade suecas."
 swe_protestant_empire: "O Império Protestante"
 swe_protestant_empire_desc: "O luteranismo permeia toda a Escandinávia. O rei sueco reina como defensor setentrional do mundo protestante, capaz de enfrentar as potências católicas do sul, como na Guerra dos Trinta Anos."
 swe_norse_revival: "O Renascimento da Fé Nórdica"
 swe_norse_revival_desc: "Os deuses dos ancestrais — Odin, Thor, Freyr — renascem. O rosto da Escandinávia antes da cristianização é recriado em nossos dias. O rei sueco, reinando como representante dos deuses nórdicos — essa escolha revolucionária abalará toda a Europa."
 swe_berserker_army: "O Exército Berserker"
 swe_berserker_army_desc: "O espírito dos guerreiros-urso da era viking renasce. Guerreiros devotos dos deuses nórdicos, soltos como corsários, livres para devastar as costas dos infiéis."
 swe_yggdrasil_throne: "O Trono de Yggdrasil"
 swe_yggdrasil_throne_desc: "Como Odin sentado nas raízes da Árvore do Mundo, o imperador sueco reina no centro do mundo do norte. Com posto imperial e 300+ províncias, o império setentrional, abençoado pelos deuses nórdicos, está completo."
 swe_finland_integration: "Integre a Finlândia"
 swe_finland_integration_desc: "A Finlândia faz parte da Suécia desde o século XII. Possuir diretamente Turku, Vyborg e Uleåborg estabelece a cabeça de ponte da Suécia rumo ao Atlântico Norte e ao Mar de Barents."
 swe_lapland_expansion: "Expansão Lapônica"
 swe_lapland_expansion_desc: "As vastas florestas da Norrland (norte da Suécia) são a casa do povo sami. Incorporar suas terras ao reino e assegurar abundantes recursos de madeira, peles e minério de ferro inicia o desenvolvimento sério da fronteira setentrional da Suécia."
 swe_arctic_empire: "O Império Ártico"
 swe_arctic_empire_desc: "Expandir-se rumo ao Mar da Noruega e ao Mar de Barents, com Uleåborg como centro — a Suécia torna-se um império setentrional que se estende até o Círculo Polar Ártico. Estabelecem-se governadores marítimos e amplia-se a presença naval para completar a fronteira norte do Império Sueco."
 swe_develop_stockholm: "A Grande Estocolmo"
 swe_develop_stockholm_desc: "Estocolmo desenvolveu-se numa grande cidade com universidade. Essa cidade, que liga o Báltico e o Mar do Norte, ergue-se como a maior cidade da Europa setentrional, centro cultural, comercial e político do Império Sueco."
 swe_develop_goteborg: "Desenvolva Gotemburgo"
 swe_develop_goteborg_desc: "Gotemburgo foi construída por Gustavo Adolfo em 1621 como porto marítimo ocidental da Suécia. Elevá-la ao posto de cidade abre uma rota comercial direta com a Dinamarca, os Países Baixos e a Inglaterra."
 swe_peasant_support: "Apoio do Campesinato"
 swe_peasant_support_desc: "O estamento camponês da Suécia tem sua própria representação no Riksdag — traço singular. Elevar a satisfação dos camponeses e ampliar a produção de grãos estabelece a estabilidade social e a singular tradição democrática da Suécia."
 swe_engelbrekt: "O Espírito de Engelbrekt"
 swe_engelbrekt_desc: "Em 1434-36, Engelbrekt Engelbrektsson liderou mineiros e camponeses na revolta contra o domínio dinamarquês. Foi morto, mas seu espírito tornou-se símbolo eterno do movimento de libertação sueco. Encarne formalmente esse espírito agora."
 swe_colonization: "O Império Colonial Sueco"
 swe_colonization_desc: "A Suécia também construiu colônias no século XVII, incluindo a Nova Suécia (região do rio Delaware). Apoiando-se no desenvolvimento da Finlândia, inicie empreendimentos coloniais além-mar e amplie o alcance do Império Sueco ao mundo todo."
 swe_develop_uppsala: "A Universidade de Uppsala Prospera"
 swe_develop_uppsala_desc: "A Universidade de Uppsala (fundada em 1477), a mais antiga da Suécia, produziu Carl Linnaeus (taxonomia) e Anders Celsius (termômetro) — a melhor academia da Europa setentrional. Desenvolva essa universidade e reforce a base do saber sueco."
 swe_karoliner: "Os Karoliner"
 swe_karoliner_desc: "Os Karoliner (soldados do rei Carlos) eram a infantaria de elite do Império Sueco sob Carlos XII no início do século XVIII, conhecida como a mais forte infantaria de sua época. Desenvolva alta tradição militar e grande exército para antecipar esse corpo de elite."
 swe_amber_trade: "Comércio de Âmbar"
 swe_amber_trade_desc: "O âmbar do Báltico, exportado de territórios controlados pela Suécia a toda a Europa — o “Ouro do Norte”. Apoiando-se na base econômica da grande potência e ampliando mais o comércio de âmbar, reforce a renda comercial do Império Sueco."
 swe_stormaktstiden: "Stormaktstiden"
 swe_stormaktstiden_desc: "Escandinávia unida, Báltico conquistado, economia de grande potência alcançada — três pilares se juntam, e a Suécia atinge o auge da Stormaktstiden (era das grandes potências). Com 600+ províncias, renda de 600+ e prestígio de 80+, conquiste essa glória."
 swe_swedish_empire: "O Império Sueco"
 swe_swedish_empire_desc: "Do Báltico a Moscou, da Escandinávia à Prússia — o Império Sueco está concluído. O caminho da Suécia, iniciado em 1337 com a união pessoal com a Noruega, termina aqui com a chegada de um grande império que domina toda a Europa setentrional. “A Suécia ri por último” — as palavras de Carlos XII estão aqui realizadas."
 swe_events.30.t: "Unidade Escandinava — Aurora da Stormaktstiden"
 swe_events.30.d: "Dinamarca esmagada, Noruega integrada — toda a Escandinávia está unida sob o estandarte sueco. Esse feito, não alcançado desde os vikings, é enfim realizado. O rei sueco proclama agora o título de “Rei da Escandinávia”, e começa a construção do maior Estado da Europa setentrional. “O sonho de Engelbrekt realizou-se hoje aqui” — escreverão os futuros historiadores."
 swe_events.30.a: "Viva a Escandinávia! A unidade do Norte para sempre!"
 swe_events.40.t: "A Encruzilhada da Fé — A Escolha Religiosa da Suécia"
 swe_events.40.d: "A tempestade da Reforma varre a Escandinávia. A corte sueca debate com ardor. Manter a fidelidade ao papa em Roma — adotar a revolucionária doutrina de Lutero — ou retornar aos antigos deuses cultuados pelos ancestrais? A decisão do rei sueco decidirá o futuro desse reino nórdico."
 swe_events.40.a: "Manter a fidelidade a Roma — o catolicismo é a alma da Suécia"
 swe_events.40.b: "Adotar a doutrina de Lutero — chegou a era da reforma"
 swe_events.40.c: "Retornar aos antigos deuses — buscar a bênção de Odin"
 swe_events.99.t: "Nasce o Império Sueco"
 swe_events.99.d: "Do Báltico a Moscou, da Escandinávia à Prússia — o Império Sueco está enfim concluído. Desde o caminho da Suécia, iniciado em 1337 com a união pessoal com a Noruega, a Suécia transformou-se de nação periférica do norte num grande império que domina toda a Europa setentrional. A Stormaktstiden (era das grandes potências) — foi a era em que a Suécia se tornou protagonista da história mundial. “De novo amanheceu — mas desta vez é o dia da Suécia”."
 swe_events.99.a: "Viva o Imperador do Império Sueco! Que o império do norte dure para sempre!"
 STATIC_MODIFIER_NAME_swe_kingdom_mod: "O Reino da Suécia"
 STATIC_MODIFIER_DESC_swe_kingdom_mod: "Lançada a pedra angular da reconstrução da Suécia no reinado do rei Magno Eriksson."
 STATIC_MODIFIER_NAME_swe_norway_union_mod: "Bônus da União Norueguesa"
 STATIC_MODIFIER_DESC_swe_norway_union_mod: "A união pessoal com a Noruega combina a força militar do noroeste da Escandinávia."
 STATIC_MODIFIER_NAME_swe_skaane_mod: "Escânia Assegurada"
 STATIC_MODIFIER_DESC_swe_skaane_mod: "O lado sueco do estreito de Öresund assegurado pelo controle da Escânia."
 STATIC_MODIFIER_NAME_swe_norway_integrated_mod: "Noruega Integrada — Dádiva dos Pesqueiros"
 STATIC_MODIFIER_DESC_swe_norway_integrated_mod: "Os ricos pesqueiros da Noruega incorporados ao Império Sueco."
 STATIC_MODIFIER_NAME_swe_scandinavia_united_mod: "Escandinávia Unida"
 STATIC_MODIFIER_DESC_swe_scandinavia_united_mod: "Os estandartes de três reinos pairam lado a lado sob uma só coroa, e as ordens emitidas de Estocolmo alcançam os mares do norte."
 STATIC_MODIFIER_NAME_swe_baltic_trade_mod: "Comércio Báltico"
 STATIC_MODIFIER_DESC_swe_baltic_trade_mod: "A Suécia entra a sério no comércio báltico. As antigas rotas comerciais varegues revivem."
 STATIC_MODIFIER_NAME_swe_estonia_mod: "Estônia Conquistada"
 STATIC_MODIFIER_DESC_swe_estonia_mod: "A Estônia, com centro em Tallinn, passa ao controle sueco."
 STATIC_MODIFIER_NAME_swe_livonia_mod: "Livônia Subjugada"
 STATIC_MODIFIER_DESC_swe_livonia_mod: "Com Riga e Tartu tomadas, toda a costa leste do Báltico fica sob administração sueca."
 STATIC_MODIFIER_NAME_swe_varangian_mod: "O Legado Varegue"
 STATIC_MODIFIER_DESC_swe_varangian_mod: "A tomada de Novgorod ressuscita as antigas rotas comerciais varegues."
 STATIC_MODIFIER_NAME_swe_eastern_empire_mod: "Domínio sobre a Rus"
 STATIC_MODIFIER_DESC_swe_eastern_empire_mod: "A tomada de Moscou faz da Suécia a senhora do mundo eslavo oriental."
 STATIC_MODIFIER_NAME_swe_dominium_baltici_mod: "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_swe_dominium_baltici_mod: "O Mar Báltico torna-se “lago” da Suécia. Todo navio mercante que cruza esse mar responde à Suécia."
 STATIC_MODIFIER_NAME_swe_hansa_victory_mod: "Hansa Derrotada"
 STATIC_MODIFIER_DESC_swe_hansa_victory_mod: "A Suécia derrota a Liga Hanseática e torna-se a estrela do comércio báltico."
 STATIC_MODIFIER_NAME_swe_pomerania_mod: "A Costa da Pomerânia"
 STATIC_MODIFIER_DESC_swe_pomerania_mod: "Antecipando o que a Suécia conquistou na Guerra dos Trinta Anos, a costa sul do Báltico sob controle sueco."
 STATIC_MODIFIER_NAME_swe_prussia_mod: "Ambições Prussianas"
 STATIC_MODIFIER_DESC_swe_prussia_mod: "A Prússia, incluindo Königsberg, passa ao controle sueco."
 STATIC_MODIFIER_NAME_swe_stockholm_mod: "Estocolmo Assegurada"
 STATIC_MODIFIER_DESC_swe_stockholm_mod: "A capital real sueca, Estocolmo, desenvolvida como centro administrativo."
 STATIC_MODIFIER_NAME_swe_falun_copper_mod: "A Mina de Cobre de Falun"
 STATIC_MODIFIER_DESC_swe_falun_copper_mod: "A mina de cobre de Falun, que sustenta a demanda europeia de cobre, opera a plena capacidade."
 STATIC_MODIFIER_NAME_swe_iron_industry_mod: "A Indústria do Ferro"
 STATIC_MODIFIER_DESC_swe_iron_industry_mod: "As minas de ferro de Svealand operam plenamente, estabelecendo a base da indústria de defesa sueca."
 STATIC_MODIFIER_NAME_swe_steel_mod: "O Aço Sueco"
 STATIC_MODIFIER_DESC_swe_steel_mod: "O melhor aço da Europa, o sueco, abastece exércitos dentro e fora do país."
 STATIC_MODIFIER_NAME_swe_riksdag_mod: "O Riksdag"
 STATIC_MODIFIER_DESC_swe_riksdag_mod: "O Parlamento da Suécia estabelecido como órgão legislativo em funcionamento. A singular tradição política da Suécia — da qual participam os camponeses — ganha forma."
 STATIC_MODIFIER_NAME_swe_absolutism_mod: "Absolutismo"
 STATIC_MODIFIER_DESC_swe_absolutism_mod: "Antecipando a redução de Carlos XI, estabelecida a monarquia absoluta na Suécia."
 STATIC_MODIFIER_NAME_swe_great_power_mod: "A Suécia como Grande Potência"
 STATIC_MODIFIER_DESC_swe_great_power_mod: "A chegada da Stormaktstiden vê a Suécia erguer-se como principal potência europeia."
 STATIC_MODIFIER_NAME_swe_stormakt_economy_mod: "A Economia da Grande Potência"
 STATIC_MODIFIER_DESC_swe_stormakt_economy_mod: "A economia de grande potência da Suécia — construída sobre o aço sueco, a monarquia absoluta e o comércio báltico — concluída."
 STATIC_MODIFIER_NAME_swe_catholic_mod: "A Suécia Católica"
 STATIC_MODIFIER_DESC_swe_catholic_mod: "Mantendo a fidelidade à Igreja de Roma, a Suécia é reconhecida como guardiã da civilização católica do norte."
 STATIC_MODIFIER_NAME_swe_crusader_glory_mod: "Glória do Cruzado do Norte"
 STATIC_MODIFIER_DESC_swe_crusader_glory_mod: "A Suécia participa da guerra santa, estabelecendo sua reputação de guardiã da cristandade."
 STATIC_MODIFIER_NAME_swe_lutheran_mod: "Reforma Luterana"
 STATIC_MODIFIER_DESC_swe_lutheran_mod: "Antecipando a proclamação luterana de Gustavo Vasa, os bens da igreja passam à coroa."
 STATIC_MODIFIER_NAME_swe_protestant_reform_mod: "A Igreja Protestante"
 STATIC_MODIFIER_DESC_swe_protestant_reform_mod: "A formação de teologia luterana enraíza a fé protestante em toda a Suécia."
 STATIC_MODIFIER_NAME_swe_norse_conversion_mod: "Renascimento da Fé Nórdica"
 STATIC_MODIFIER_DESC_swe_norse_conversion_mod: "A fé em Odin, Thor e Freyr renasce. O espírito guerreiro da era viking habita os exércitos da Suécia."
 STATIC_MODIFIER_NAME_swe_berserker_mod: "O Exército Berserker"
 STATIC_MODIFIER_DESC_swe_berserker_mod: "O espírito dos guerreiros-urso da era viking renasce. A pirataria é solta para devastar as costas dos infiéis."
 STATIC_MODIFIER_NAME_swe_yggdrasil_mod: "O Trono de Yggdrasil"
 STATIC_MODIFIER_DESC_swe_yggdrasil_mod: "Como Odin nas raízes da Árvore do Mundo, o imperador sueco reina no centro do mundo do norte."
 STATIC_MODIFIER_NAME_swe_finland_mod: "Finlândia Integrada"
 STATIC_MODIFIER_DESC_swe_finland_mod: "A Finlândia integrada como parte do Império Sueco. A política colonial abre a fronteira norte."
 STATIC_MODIFIER_NAME_swe_lapland_mod: "Expansão Lapônica"
 STATIC_MODIFIER_DESC_swe_lapland_mod: "As vastas florestas da Norrland incorporadas à Suécia."
 STATIC_MODIFIER_NAME_swe_arctic_mod: "O Império Ártico"
 STATIC_MODIFIER_DESC_swe_arctic_mod: "Os faróis suecos erguidos na costa ártica guiam os navegantes que cruzam o Atlântico Norte."
 STATIC_MODIFIER_NAME_swe_stormaktstiden_mod: "Stormaktstiden"
 STATIC_MODIFIER_DESC_swe_stormaktstiden_mod: "A era das grandes potências da Suécia — alcançado o auge do império setentrional que domina a Escandinávia, o Báltico e a Europa Oriental."
 STATIC_MODIFIER_NAME_swe_sound_toll_mod: "A Taxa do Öresund"
 STATIC_MODIFIER_DESC_swe_sound_toll_mod: "A cobrança da Taxa do Öresund enriquece o tesouro sueco."
 STATIC_MODIFIER_NAME_swe_stockholm_great_mod: "Estocolmo — Cidade do Norte"
 STATIC_MODIFIER_DESC_swe_stockholm_great_mod: "Estocolmo desenvolveu-se numa grande cidade com universidade, tornando-se a maior capital cultural e científica da Europa setentrional."
 STATIC_MODIFIER_NAME_swe_peasant_mod: "Apoio do Campesinato"
 STATIC_MODIFIER_DESC_swe_peasant_mod: "O apoio do estamento camponês da Suécia cria uma estabilidade social própria da Suécia."
 STATIC_MODIFIER_NAME_swe_engelbrekt_mod: "O Espírito de Engelbrekt"
 STATIC_MODIFIER_DESC_swe_engelbrekt_mod: "O espírito da revolta de 1434 inspira os exércitos suecos. A luta pela liberdade é o orgulho da Suécia."
 STATIC_MODIFIER_NAME_swe_colonial_mod: "O Império Colonial Sueco"
 STATIC_MODIFIER_DESC_swe_colonial_mod: "A Suécia inicia empreendimentos coloniais além-mar, tornando-se um império para além da Europa setentrional."
 STATIC_MODIFIER_NAME_swe_papal_champion_mod: "Campeã do Papa"
 STATIC_MODIFIER_DESC_swe_papal_champion_mod: "Posição inabalável de mais forte guardiã da civilização católica do norte estabelecida."
 STATIC_MODIFIER_NAME_swe_protestant_empire_mod: "O Império Protestante"
 STATIC_MODIFIER_DESC_swe_protestant_empire_mod: "A Suécia, com luteranismo por toda a Escandinávia, reina como defensora setentrional do mundo protestante."
 STATIC_MODIFIER_NAME_swe_amber_mod: "Comércio de Âmbar"
 STATIC_MODIFIER_DESC_swe_amber_mod: "O âmbar, colhido nas costas do Báltico, reluz como ouro nas vitrines dos joalheiros de Estocolmo."
 STATIC_MODIFIER_NAME_swe_uppsala_mod: "A Universidade de Uppsala"
 STATIC_MODIFIER_DESC_swe_uppsala_mod: "A mais antiga universidade da Suécia prospera como a melhor instituição científica da Europa setentrional."
 STATIC_MODIFIER_NAME_swe_karoliner_mod: "Os Karoliner"
 STATIC_MODIFIER_DESC_swe_karoliner_mod: "Antecipando a infantaria de elite de Carlos, um exército sueco altamente treinado concluído."
 STATIC_MODIFIER_NAME_swe_scandinavian_empire_final_mod: "O Império Sueco"
 STATIC_MODIFIER_DESC_swe_scandinavian_empire_final_mod: "O Império Sueco, que se estende do Báltico à Europa Oriental, concluído. A Stormaktstiden perdura."
 STATIC_MODIFIER_NAME_swe_faith_steadfast_mod: "Firme na Fé"
 STATIC_MODIFIER_DESC_swe_faith_steadfast_mod: "A inabalável fé católica proclama a autoridade do rei ao povo com os sinos da catedral de Uppsala."
 STATIC_MODIFIER_NAME_swe_reform_winds_mod: "Ventos de Reforma"
 STATIC_MODIFIER_DESC_swe_reform_winds_mod: "O ensinamento de Lutero se espalha pela Suécia."
 STATIC_MODIFIER_NAME_swe_old_gods_calling_mod: "O Chamado dos Antigos Deuses"
 STATIC_MODIFIER_DESC_swe_old_gods_calling_mod: "A fé em Odin e Thor renasce em segredo."
 swe_norrkoping_textiles: "A Indústria Têxtil de Norrköping"
 swe_norrkoping_textiles_desc: "Norrköping tornou-se a cidade industrial da costa leste da Suécia, centro de produção de têxteis e tecidos. Aproveitando a abundante energia hidráulica do rio Motala, a produção de tecidos torna-se importante pilar da exportação sueca."
 STATIC_MODIFIER_NAME_swe_norrkoping_textile_mod: "Indústria Têxtil de Norrköping"
 STATIC_MODIFIER_DESC_swe_norrkoping_textile_mod: "A produção de tecidos com energia hidráulica em Norrköping opera a plena capacidade. A exportação sueca de tecidos aos mercados europeus."
 STATIC_MODIFIER_NAME_swe_goteborg_mod: "Porto de Varberg Desenvolvido"
 STATIC_MODIFIER_DESC_swe_goteborg_mod: "No porto de Varberg, no Kattegat, os veleiros rumo ao Mar do Norte afastam-se do cais um após o outro."
 STATIC_MODIFIER_NAME_swe_visby_mod: "Comércio de Visby"
 STATIC_MODIFIER_DESC_swe_visby_mod: "O bairro de armazéns de Visby, em Gotlândia, volta a animar-se com mercadores de todo o Báltico."
 STATIC_MODIFIER_NAME_swe_denmark_crushed_mod: "Dinamarca Esmagada"
 STATIC_MODIFIER_DESC_swe_denmark_crushed_mod: "Quando a bandeira da Dinamarca, nossa antiga inimiga, foi arriada, os senhores da Escandinávia pronunciaram em silêncio o nome de seu novo soberano."
