 nap_subjugation_of_epirus: "Subjugação do Epiro"
 nap_southern_renaissance: "O Renascimento do Sul"
 nap_caserta_palace: "O Palácio de Caserta"
 nap_charles_dream: "O Sonho de Carlos I"
 nap_never_die_without_seeing_naples: "Ver Nápoles e Depois Morrer"
 nap_latin_empire: "O Império Latino"
 nap_new_capital_of_sicily_desc: "Tendo perdido a Sicília, escolhemos Nápoles como nossa nova capital, em vez de Palermo. Essa cidade deve ser desenvolvida numa sede digna de um reino."
 nap_apulian_granary_desc: "As férteis planícies da Apúlia são há muito famosas como fonte de grãos. Suas colheitas alimentam nosso povo e criam importante mercadoria de exportação do reino. A Apúlia fica também em frente à Grécia, através do Estreito de Otranto, o que a torna vital cabeça de ponte."
 nap_control_of_transumanza_desc: "A transumância, pastoreio itinerante herdado, praticado nos Abruzos e em Molise, cria a espinha dorsal econômica dessas regiões. Quando o Estado administra os tratturi e protege os pastores, a produção de lã, queijo e outras mercadorias prosperará."
 nap_patronage_of_diverse_arts_desc: "A Sicília foi percorrida por gregos, cartagineses, romanos, germanos, árabes, normandos e franceses, e suas culturas misturaram-se aqui. A arte enraizada nessa diversidade cultural é a verdadeira arte da Sicília."
 nap_dynastic_stability_desc: "Nunca uma dinastia duradoura lançou raízes na Sicília, o que repetidamente convidou à invasão estrangeira. Estabilizar a dinastia é o caminho mais seguro para a estabilidade da própria Sicília."
 nap_southern_renaissance_desc: "Artistas e eruditos de todo o país, atraídos por uma corte estável e digna, trouxeram também a Nápoles o Renascimento — uma cultura administrada pela corte, diferente da do norte da Itália, floresce agora aqui."
 STATIC_MODIFIER_NAME_nap_new_capital_mod: "Nova Capital"
 STATIC_MODIFIER_DESC_nap_new_capital_mod: "Nápoles desenvolvida numa sede digna de um reino, sustentando o crescimento e a produtividade da cidade."
 STATIC_MODIFIER_NAME_nap_apulian_granary_mod: "O Celeiro da Apúlia"
 STATIC_MODIFIER_DESC_nap_apulian_granary_mod: "As férteis terras da Apúlia sustentam de forma constante a produção de recursos aqui."
 STATIC_MODIFIER_NAME_nap_control_of_transumanza_mod: "Controle da Transumância"
 STATIC_MODIFIER_DESC_nap_control_of_transumanza_mod: "A proteção dos pastores e a gestão dos tratturi elevaram de forma constante a produção de recursos aqui."
 STATIC_MODIFIER_NAME_nap_patronage_of_diverse_arts_mod: "Mecenato das Artes Diversas"
 STATIC_MODIFIER_DESC_nap_patronage_of_diverse_arts_mod: "Artistas enraizados em muitas culturas reuniram-se na corte, elevando o prestígio do reino e a tolerância a outras fés."
 STATIC_MODIFIER_NAME_nap_dynastic_stability_mod: "Estabilidade Dinástica"
 STATIC_MODIFIER_DESC_nap_dynastic_stability_mod: "Sob uma dinastia duradoura, a legitimidade da coroa cresce, e os distúrbios internos enfraquecem."
 STATIC_MODIFIER_NAME_nap_southern_renaissance_mod: "O Renascimento do Sul"
 STATIC_MODIFIER_DESC_nap_southern_renaissance_mod: "Os artistas, reunidos em Nápoles, aperfeiçoaram sua arte, e a habilidade dos novos artistas, que ingressam ao serviço do reino, aumentou."
 nap_divided_kingdom_desc: "Em 1282, o povo da Sicília ergueu-se contra o governo de nossa casa de Anjou e saudou a casa de Aragão como novo rei. Desde então, o Reino da Sicília está dividido em dois. Governamos o continente em torno de Nápoles, mas a recuperação da ilha da Sicília permanece como missão histórica confiada à nossa dinastia."
 nap_papal_blessing_desc: "Desde que Carlos I conquistou o Reino da Sicília a convite do papa, nossa dinastia mantém estreitos laços com o papado. Preservar a confiança do papa é essencial para manter a legitimidade de nosso governo."
 nap_army_buildup_desc: "Reforce o exército permanente do reino na preparação da luta pela recuperação da Sicília. Um exército forte será necessário também para qualquer intervenção no norte da Itália ou para reprimir revoltas no continente."
 nap_match_aragon_navy_desc: "Para opor-se à frota aragonesa, que domina o Estreito da Sicília, nosso reino deve também possuir uma poderosa força naval. Quem domina o mar, com o tempo dominará a Sicília."
 nap_sword_of_the_guelphs_desc: "A luta entre guelfos (partido papal) e gibelinos (partido imperial) abala todo o norte da Itália. Como aliado do papa, nosso reino pode juntar-se a essa luta com a espada dos guelfos e aproveitar a oportunidade para ampliar nossa influência rumo ao norte."
 nap_sicilian_reunification_war_desc: "Chegou enfim a hora de enviar nossas tropas à ilha da Sicília. Se conseguirmos quebrar a guarnição aragonesa e tomar Palermo, o caminho para a unificação do reino dividido se abrirá."
 nap_invest_in_provence_desc: "O Condado da Provença, pátria da casa de Anjou, ainda mantém profundos laços com nossa dinastia. Investir aqui criará uma cabeça de ponte no oeste, ao mesmo tempo que reforça nossos laços com a pátria dos antepassados."
 STATIC_MODIFIER_NAME_nap_papal_blessing_mod: "Apoio Papal"
 STATIC_MODIFIER_DESC_nap_papal_blessing_mod: "Por meio de nossos estreitos laços com o papado, nossa influência religiosa cresce continuamente."
 STATIC_MODIFIER_NAME_nap_army_buildup_mod: "Exército Real Reorganizado"
 STATIC_MODIFIER_DESC_nap_army_buildup_mod: "O exército real reorganizado ostenta alto moral e abundantes reservas de efetivos."
 STATIC_MODIFIER_NAME_nap_match_aragon_navy_mod: "Frota Antiaragonesa"
 STATIC_MODIFIER_DESC_nap_match_aragon_navy_mod: "A frota real, construída para opor-se a Aragão, ostenta alto moral e rápido movimento."
 STATIC_MODIFIER_NAME_nap_sword_of_the_guelphs_mod: "A Espada dos Guelfos"
 STATIC_MODIFIER_DESC_nap_sword_of_the_guelphs_mod: "Tendo se envolvido na disputa do norte da Itália com a espada do papado, nosso exército ganhou proficiência em cercos e disciplina."
 STATIC_MODIFIER_NAME_nap_sicilian_reunification_war_mod: "A Guerra de Unificação da Sicília"
 STATIC_MODIFIER_DESC_nap_sicilian_reunification_war_mod: "Tendo passado pela feroz guerra pela Sicília, o exército real pode levantar mais efetivos, e o peso da guerra recai mais leve sobre o reino."
 STATIC_MODIFIER_NAME_nap_invest_in_provence_mod: "Investimento na Provença"
 STATIC_MODIFIER_DESC_nap_invest_in_provence_mod: "Para a casa de Anjou, a Provença era “lar”. Tendo perdido Nápoles, o rei René passou o resto da vida na Provença, e Aix-en-Provence tornou-se centro cultural. Os laços entre Nápoles e a Provença são profundos, forjados pelo sangue e pela história da casa de Anjou."
 nap_events.1.t: "Um Reino Dividido em Dois"
 nap_events.1.d: "Em 1282, na revolta conhecida como Vésperas Sicilianas, o povo da Sicília derrubou o governo da casa de Anjou. Incapaz de suportar por mais tempo a tirania dos funcionários enviados da França, o povo da ilha ergueu-se como um só ao som dos sinos do entardecer e expulsou os franceses de nossas costas. Saudamos o rei Pedro III de Aragão como novo governante, e o Reino da Sicília ficou assim dividido em dois. Além do estreito, no continente com centro em Nápoles, o rei da casa de Anjou ainda se intitula “rei da Sicília”. Somente nós somos os legítimos reis dessa ilha. A rivalidade entre nossos dois reinos continua até hoje."
 nap_events.1.a: "Entendido"
 nap_cross_the_strait_of_otranto_desc: "O Estreito de Otranto, de apenas 70 quilômetros de largura, é a porta marítima entre a península itálica e a balcânica. Se o cruzarmos e estabelecermos uma cabeça de ponte na Albânia, nossas frotas e navios mercantes ganharão caminho mais ao leste."
 nap_influence_over_the_papacy_desc: "Se aprofundarmos nossos laços com o papado, mantendo a estabilidade interna, nossa dinastia ganhará sobre a Santa Sé uma influência impossível de não notar."
 nap_the_bells_fall_silent_desc: "A ilha da Sicília é de novo nossa, e o reino dividido, unificado. Devemos consolidar nosso governo com cuidado, para que os “sinos” que outrora romperam o reino jamais toquem de novo."
 nap_defeat_of_aragon_desc: "Privada de sua posse siciliana, a casa de Aragão já não é a ameaça ao nosso reino que foi outrora. Se a própria Aragão cair ou sua coroa for trazida à nossa suserania, a antiga rivalidade através do Mediterrâneo poderá enfim ser encerrada."
 nap_expand_influence_in_southern_france_desc: "De nossa cabeça de ponte na Provença, nossa influência estende-se agora rio Ródano acima até Lyon. Nossa presença em todo o sul da França continua a crescer."
 nap_western_mediterranean_hegemony_desc: "Se conseguirmos tomar a Sardenha e as Baleares, dois grandes bastiões do Mediterrâneo ocidental, nossas frotas dominarão as águas de Gênova à Ibéria, tornando-nos incontestados senhores do mar ocidental."
 STATIC_MODIFIER_NAME_nap_cross_the_strait_of_otranto_mod: "Cabeça de Ponte além de Otranto"
 STATIC_MODIFIER_DESC_nap_cross_the_strait_of_otranto_mod: "Nossa cabeça de ponte na Albânia permite que nossas frotas e navios mercantes naveguem mais longe."
 STATIC_MODIFIER_NAME_nap_influence_over_the_papacy_mod: "Influência sobre o Papado"
 STATIC_MODIFIER_DESC_nap_influence_over_the_papacy_mod: "Nossos laços com o papado aprofundaram-se, reforçando a legitimidade de nosso governo e nossa tolerância a hereges."
 STATIC_MODIFIER_NAME_nap_the_bells_fall_silent_mod: "Sinos Silenciosos"
 STATIC_MODIFIER_DESC_nap_the_bells_fall_silent_mod: "O governo do reino unificado estabilizou-se; o descontentamento do povo amainou, e a legitimidade da coroa aumentou."
 STATIC_MODIFIER_NAME_nap_defeat_of_aragon_mod: "A Derrota de Aragão"
 STATIC_MODIFIER_DESC_nap_defeat_of_aragon_mod: "O conflito entre Aragão e a casa de Anjou começou com as Vésperas Sicilianas de 1282 e durou mais de 160 anos, até a conquista de Nápoles por Afonso V em 1442. Derrotar enfim esse velho inimigo significaria completar a maior vingança da história do Reino de Nápoles."
 STATIC_MODIFIER_NAME_nap_expand_influence_in_southern_france_mod: "Influência no Sul da França"
 STATIC_MODIFIER_DESC_nap_expand_influence_in_southern_france_mod: "A presença comercial e diplomática do reino por todo o sul da França continua a crescer."
 STATIC_MODIFIER_NAME_nap_western_mediterranean_hegemony_mod: "Hegemonia no Mediterrâneo Ocidental"
 STATIC_MODIFIER_DESC_nap_western_mediterranean_hegemony_mod: "Tendo conquistado a Sardenha e as Baleares, nossa frota domina todo o Mediterrâneo ocidental, e seu moral é alto."
 nap_anjou_hungary_desc: "Nossa casa de Anjou tem ramos mais jovens não só em Nápoles, mas também na Hungria. Se os laços entre nossos dois reinos de sangue comum se aprofundarem, poderemos encontrar também fundamento justo para reivindicar a coroa húngara."
 nap_foothold_in_northern_italy_desc: "Se conseguirmos assegurar uma cabeça de ponte na Toscana, poderemos aprofundar nossos laços com as ricas cidades-Estado do norte da Itália, como Florença e Pisa, e ganhar vantagem em qualquer campanha por toda a península."
 nap_crossroads_of_civilizations_desc: "O Reino da Sicília há muito está na encruzilhada das civilizações grega, romana, árabe e normanda. A enorme coleção de arte, reunida em nossa corte, é prova de que nosso reino é verdadeiramente uma encruzilhada das civilizações."
 nap_anjou_homeland_desc: "Agora que Angers está assegurada, nossa influência alcança até a pátria de nossa casa de Anjou. Esse vínculo com as terras de nossos antepassados pode ainda trazer-nos reivindicação ao próprio trono francês."
 nap_french_throne_claim_desc: "A casa de Anjou nasceu como ramo mais jovem da linha real francesa. Se conseguirmos assegurar a própria Paris ou formar uma união pessoal com a coroa francesa, nosso rei portará tanto a coroa da França quanto a de Nápoles."
 STATIC_MODIFIER_NAME_nap_foothold_in_northern_italy_mod: "Cabeça de Ponte no Norte da Itália"
 STATIC_MODIFIER_DESC_nap_foothold_in_northern_italy_mod: "Nossos laços com as cidades da Toscana permitem-nos converter com mais eficácia ganhos militares em pontos de guerra por toda a península."
 STATIC_MODIFIER_NAME_nap_crossroads_of_civilizations_mod: "Encruzilhada das Civilizações"
 STATIC_MODIFIER_DESC_nap_crossroads_of_civilizations_mod: "A enorme coleção de arte, reunida em nossa corte, continua a espalhar a influência cultural do reino nas terras vizinhas."
 STATIC_MODIFIER_NAME_nap_anjou_homeland_mod: "As Terras Natais dos Anjou"
 STATIC_MODIFIER_DESC_nap_anjou_homeland_mod: "O nome da casa de Anjou vem de Angers, na França, cidade às margens do Loire. Henrique II, que fundou a Inglaterra dos Plantagenetas, era também conde de Anjou. Reconstruir os laços com a pátria Angers reavivaria a rede angevina por toda a Europa."
 STATIC_MODIFIER_NAME_nap_king_of_france_mod: "Rei da França"
 STATIC_MODIFIER_DESC_nap_king_of_france_mod: "A casa de Anjou, descendentes dos Capetos, assume a coroa de seu suserano capetíngio — uma reviravolta da história. O título de “Rei Cristianíssimo” da França é um dos mais honrosos da Europa, e sua obtenção eleva a dinastia do sul da Itália ao auge político de toda a cristandade."
 nap_mediterranean_greatest_city_desc: "A população de Nápoles alcançou agora uma escala rara até no Mediterrâneo. Desde a Roma antiga, nenhuma cidade nesse mar conheceu tal prosperidade."
 nap_university_of_frederick_ii_desc: "A Universidade de Nápoles, fundada por Frederico II, é o centro do saber do reino. Provendo-a de salas de arte e ciência, sua fama se espalhará por toda a Europa."
 nap_magnificent_royal_palace_desc: "A fundação de jardins no palácio real é essencial para mostrar a magnificência da coroa tanto aos súditos quanto aos estrangeiros. Os magníficos jardins anunciarão a todos os visitantes a prosperidade do reino."
 nap_expansion_of_naples_port_desc: "Pela construção de uma doca no porto de Nápoles, os navios podem ser reparados e construídos com mais eficiência, ajudando muito na manutenção e no crescimento da frota real."
 nap_subjugation_of_epirus_desc: "Tendo cruzado o Estreito de Otranto e erguido uma cabeça de ponte, nossas forças enfim subjugaram todo o Epiro. O litoral da Albânia está agora sob governo do reino."
 nap_caserta_palace_desc: "A construção de um novo palácio em Caserta mostrará a magnificência da coroa e, ao mesmo tempo, dará à família real uma sede tranquila de governo, longe da corte napolitana."
 nap_charles_dream_desc: "Carlos I outrora sonhou em erguer um grande império no Mediterrâneo oriental, estendendo o espírito cruzado. Agora, com uma cabeça de ponte na Moreia, esse sonho começa a tomar forma de novo."
 nap_never_die_without_seeing_naples_desc: "Como diz o velho provérbio, “ver Nápoles e depois morrer” — Nápoles tornou-se a cidade que viajantes de todo o mundo desejam. Sua beleza e prosperidade serão discutidas por gerações."
 nap_latin_empire_desc: "O Reino da Sicília já não é uma mera potência regional. No oeste, domina o Mediterrâneo; no leste, o caminho da Moreia a Constantinopla está aberto diante dele. Chegou agora a hora de proclamar-se ao mundo herdeiro do antigo Império Latino."
 STATIC_MODIFIER_NAME_nap_mediterranean_greatest_city_mod: "A Maior Cidade do Mediterrâneo"
 STATIC_MODIFIER_DESC_nap_mediterranean_greatest_city_mod: "Nápoles tornou-se uma das grandes cidades do Mediterrâneo, e sua produtividade e crescimento superam em muito os de seus vizinhos."
 STATIC_MODIFIER_NAME_nap_university_of_frederick_ii_mod: "A Universidade de Frederico II"
 STATIC_MODIFIER_DESC_nap_university_of_frederick_ii_mod: "Os eruditos, reunidos na universidade de Nápoles, trazem ao reino novo saber e inovação."
 STATIC_MODIFIER_NAME_nap_magnificent_royal_palace_mod: "O Magnífico Palácio Real"
 STATIC_MODIFIER_DESC_nap_magnificent_royal_palace_mod: "Os magníficos jardins do palácio real mostram a todos o prestígio do reino e a legitimidade da coroa."
 STATIC_MODIFIER_NAME_nap_expansion_of_naples_port_mod: "Ampliação do Porto de Nápoles"
 STATIC_MODIFIER_DESC_nap_expansion_of_naples_port_mod: "A Baía de Nápoles, com o Vesúvio ao fundo, funciona como porto natural desde a Antiguidade. As instalações portuárias, erguidas na era angevina e aragonesa, tornaram-se grande nó do comércio mediterrâneo, por onde passavam especiarias orientais, grãos norte-africanos e lã ibérica."
 STATIC_MODIFIER_NAME_nap_subjugation_of_epirus_mod: "Subjugação do Epiro"
 STATIC_MODIFIER_DESC_nap_subjugation_of_epirus_mod: "Tendo passado pela campanha no Epiro, o exército real pode levantar mais efetivos, e o peso da guerra recai mais leve sobre o reino."
 STATIC_MODIFIER_NAME_nap_caserta_palace_mod: "O Palácio de Caserta"
 STATIC_MODIFIER_DESC_nap_caserta_palace_mod: "O Palácio de Caserta, projetado por Vanvitelli (iniciado em 1752), ostentava uma escala que rivalizava com Versalhes e simbolizava o prestígio do Reino de Nápoles bourbônico. Mais de 1200 salas, jardins de três quilômetros, fontes alimentadas por um aqueduto — assentar a base antes da criação desse magnífico palácio é o objetivo desta missão."
 STATIC_MODIFIER_NAME_nap_charles_dream_mod: "O Sonho de Carlos I"
 STATIC_MODIFIER_DESC_nap_charles_dream_mod: "A velha ambição rumo ao leste arde de novo, elevando o prestígio do reino e o moral de suas tropas."
 STATIC_MODIFIER_NAME_nap_never_die_without_seeing_naples_mod: "Ver Nápoles e Depois Morrer"
 STATIC_MODIFIER_DESC_nap_never_die_without_seeing_naples_mod: "“Ver Nápoles e depois morrer” (Vedi Napoli e poi muori) — assim transmitiam em palavras os viajantes europeus do século XVIII, pois Nápoles deslumbrava todo visitante com o Vesúvio, a magnífica vista da baía, as antigas ruínas e suas animadas ruas."
 STATIC_MODIFIER_NAME_nap_latin_empire_mod: "O Império Latino"
 STATIC_MODIFIER_DESC_nap_latin_empire_mod: "A magnificência do Império Latino restaurado estende-se sobre o Mediterrâneo, elevando o prestígio e a legitimidade do reino e fortalecendo sua mão nas negociações de guerra."
