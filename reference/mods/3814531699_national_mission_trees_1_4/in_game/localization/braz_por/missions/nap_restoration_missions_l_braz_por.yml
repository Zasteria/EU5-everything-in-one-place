l_braz_por:
 nap_restoration_mission_pack: "O Caminho do Reino de Nápoles"
 nap_restoration_mission_pack_DESCRIPTION:0 "Tendo perdido a Sicília, o reino busca a unificação e a reconstrução de seu poder no Mediterrâneo. Sob o sangue e o brilho da casa de Anjou, erga uma nova era de ouro em torno de Nápoles."
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Conclua as missões como Reino de Nápoles, trabalhando pela unificação da Sicília e pela restauração do Império Latino."
 nap_restoration_mission_pack_BUTTON_TOOLTIP:0 "Conclua as missões para seguir o caminho do Reino de Nápoles."
 nap_restoration_mission_pack_BUTTON_DETAILS:0 "Una o Reino da Sicília dividido e inscreva seu nome na história como senhor do Mediterrâneo ocidental e herdeiro do antigo Império Latino!"
