 wiener_stadtrecht_town_rights: "Direito urbano de Viena"
 wiener_stadtrecht_town_rights_desc: "Um direito urbano especial, concedido apenas a Viena — melhora o acesso ao mercado, a força do centro comercial e a capacidade de mercadores. Só pode ser concedido a Viena."
 landstadt_town_rights: "Landstadt"
 landstadt_town_rights_desc: "Direito urbano concedido às cidades imperiais — fortalece a autoridade da coroa e do estamento nobre, melhorando o alcance administrativo a partir da capital."
