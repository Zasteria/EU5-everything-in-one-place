l_braz_por:
 eth_mobile_court_reform_tooltip: "A cada mudança de capital, o novo local da capital recebe um bônus temporário"
 eth_mobile_court_reform: "Acampamento itinerante (Ketema)"
 eth_mobile_court_reform_desc: "Sem capital fixa — um estilo de governo peculiar em que o Imperador, seu exército, sua corte e sua igreja percorrem o país sem cessar — alivia o peso de mudar a capital e traz a bênção a cada terra que o Imperador visita."
 STATIC_MODIFIER_NAME_eth_mobile_court_mod: "Bênção do Acampamento Imperial (Ketema)"
 STATIC_MODIFIER_DESC_eth_mobile_court_mod: "A corte do Imperador esteve aqui, trazendo a esta terra um afluxo de gente e prosperidade (diminui com o tempo)."
