 hab_integrated_crown: "Terra da coroa integrada"
 hab_integrated_crown_plural: "Terras da coroa integradas"
 eng_welsh_principality: "Principado aliado"
 eng_welsh_principality_plural: "Principados aliados"
 eng_welsh_principality_desc: "Um status especial concedido a um reino que escolheu a parceria em vez da rivalidade — o suserano não pode obrigá-lo a participar de guerras ofensivas, e esse principado tem até o direito de declarar guerra por conta própria. Em troca, a anexação torna-se praticamente impossível, e os dois Estados prosperam juntos graças a esse vínculo especial."
