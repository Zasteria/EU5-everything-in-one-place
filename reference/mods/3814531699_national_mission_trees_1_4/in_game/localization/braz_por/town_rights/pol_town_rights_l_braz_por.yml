l_braz_por:
 pol_royal_breadbasket_town_rights: "Celeiro Real Polonês"
 pol_royal_breadbasket_town_rights_desc: "Este local foi encarregado de reunir os grãos do reino para exportação pelo Vístula; seus celeiros foram ampliados para essa tarefa. Os grãos afluem das propriedades da nobreza e seguem para os portos bálticos, sustentando cidadãos e mercadores."
