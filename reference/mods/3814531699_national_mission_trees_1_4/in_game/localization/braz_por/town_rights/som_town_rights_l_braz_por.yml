l_braz_por:
 som_imperial_breadbasket_town_rights: "Celeiro Imperial Otomano"
 som_imperial_breadbasket_town_rights_desc: "Este local foi encarregado de abastecer a capital imperial e os exércitos do sultão; seus celeiros foram ampliados para alimentar a grande cidade. Os grãos afluem sob a supervisão do Estado, sustentando cidadãos e soldados."
