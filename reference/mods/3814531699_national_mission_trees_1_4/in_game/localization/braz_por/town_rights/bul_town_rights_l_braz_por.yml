l_braz_por:
 bul_chitalishte_rights: "Cidade da chitalishte"
 bul_chitalishte_rights_desc: "Uma cidade onde criou raízes o movimento cultural centrado nas “salas de leitura” (chitalishte). A consciência nacional e a alfabetização se espalham, embora a atenção dos burgueses se volte mais ao saber e à educação do que à produção."
