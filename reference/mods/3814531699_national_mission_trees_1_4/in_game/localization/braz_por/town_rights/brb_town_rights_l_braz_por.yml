l_braz_por:
 brb_joyous_entry_rights: "Cidade da Entrada Jubilosa"
 brb_joyous_entry_rights_desc: "Uma cidade autônoma agraciada com privilégios pelo duque. Parte do poder da coroa é transferida à própria cidade, o que estimula a indústria e o desenvolvimento, ao mesmo tempo que fortalece a voz da cidade nos estamentos."
