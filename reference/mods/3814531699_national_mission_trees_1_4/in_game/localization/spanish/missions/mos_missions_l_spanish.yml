 STATIC_MODIFIER_NAME_mos_great_mod: "El Imperio Ruso"
 STATIC_MODIFIER_DESC_mos_great_mod: "Imperio Ruso proclamado: una de las mayores potencias continentales de la historia."
 STATIC_MODIFIER_NAME_mos_autocrat_final_mod: "Autócrata de toda Rusia"
