 mos_great_moscow: "Fundación de la Tercera Roma: la gran expansión de Moscú"
 mos_great_moscow_desc: "Expande Moscú hasta convertirla en una gran ciudad digna de la Tercera Roma. Catedrales, palacios, mercados y fortalezas se alzarán por esta magnífica ciudad, haciendo de ella el corazón del Imperio Ruso. Cumple las tres condiciones de desarrollo, construcciones y población para merecer a Moscú el título de Ciudad Eterna."
 STATIC_MODIFIER_NAME_mos_great_moscow_mod: "Ciudad de la Tercera Roma"
 STATIC_MODIFIER_DESC_mos_great_moscow_mod: "La Gran Moscú, cuyas áureas agujas del Kremlin reverberan, se ha convertido en una metrópoli digna del nombre “Tercera Roma”."
