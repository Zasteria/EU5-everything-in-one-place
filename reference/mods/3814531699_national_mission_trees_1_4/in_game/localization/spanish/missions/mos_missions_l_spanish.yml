l_spanish:
 mos_moscow_mission_pack: "Del yugo tártaro al autócrata de toda Rusia"
 mos_moscow_mission_pack_DESCRIPTION:0 "En 1337, el Gran Principado de Moscú es un pequeño principado bajo el dominio de la Horda de Oro. Gracias a la astuta acumulación de riqueza y a la destreza diplomática de Iván I Kalitá ante los tártaros, Moscú no ha dejado de crecer. Pero Nóvgorod, Tver y Lituania la rodean, mientras la amenaza tártara persiste al sur. Sacúdete el yugo tártaro, une los principados rusos, proclámate zar, gobierna como Tercera Roma y conviértete en el autócrata de toda Rusia: señor hasta los confines de Siberia."
 mos_moscow_mission_pack_CRITERIA_DESCRIPTION:0 "Sacúdete el yugo tártaro, conquista Kazán, Astracán y Nóvgorod para unir Rusia, asume el título de zar, conviértete en la Tercera Roma y conquista Siberia."
 mos_moscow_mission_pack_BUTTON_TOOLTIP:0 "Conviértete en el autócrata de toda Rusia."
 mos_moscow_mission_pack_BUTTON_DETAILS:0 "Del Gran Principado de Moscú al Imperio Ruso: ¡cumple el destino histórico!"
 mos_rally_the_army: "Moviliza el ejército"
 mos_rally_the_army_desc: "En 1337, el Gran Principado de Moscú crece sin cesar gracias a la astuta destreza de Iván I Kalitá. Prepara el ejército e inicia la expansión del dominio moscovita sobre los principados rusos."
 mos_break_tatar_yoke: "Quiebra el yugo tártaro"
 mos_break_tatar_yoke_desc: "Desde 1237, los tributos y la sumisión a los tártaros oprimen a Rusia. El recuerdo de la victoria de Dmitri Donskói en el campo de Kulikovo sigue vivo. Declara la plena independencia y quiebra el yugo tártaro para siempre."
 mos_conquer_kazan: "Conquista de Kazán"
 mos_conquer_kazan_desc: "El Kanato de Kazán controla la ruta comercial del Volga. Conquistarlo da a Moscú el dominio sobre el gran río: adelántate a la victoria de Iván el Terrible en 1552."
 mos_subjugate_kazan: "Subyuga el Volga medio"
 mos_subjugate_kazan_desc: "Tras conquistar Kazán, toma la cuenca del Volga medio —Samara y Tambov— para abrir el camino hacia el sur."
 mos_conquer_astrakhan: "Conquista de Astracán"
 mos_conquer_astrakhan_desc: "El Kanato de Astracán controla el delta del bajo Volga. Conquístalo para asegurar el acceso al Mar Caspio y a la ruta comercial oriental."
 mos_destroy_hordes: "Destrucción de las Hordas"
 mos_destroy_hordes_desc: "Aplasta a los Estados sucesores tártaros, incluida la Horda Nogai, y abre el camino hacia la estepa."
 mos_claim_steppes: "Reclama las estepas"
 mos_claim_steppes_desc: "Conquista la estepa póntica en la costa norte del Mar Negro para revelar el rostro de Moscú como gran imperio continental."
 mos_black_sea_access: "Acceso al Mar de Azov"
 mos_black_sea_access_desc: "Avanza hacia el Mar de Azov para asegurar el acceso al comercio del Mar Negro: adelántate a la toma de Azov por Pedro el Grande en 1696."
 mos_conquer_crimea: "Conquista de Crimea"
 mos_conquer_crimea_desc: "Conquista el Kanato de Crimea para establecer la supremacía en el Mar Negro: adelántate a la anexión de Catalina la Grande en 1783."
 mos_consolidate_russia: "Consolida Rusia"
 mos_consolidate_russia_desc: "Con Moscú en el centro, consolida los principados rusos en una única y poderosa base estatal."
 mos_dev_moscow: "Desarrolla el Kremlin"
 mos_dev_moscow_desc: "Desarrolla el Kremlin de Moscú, símbolo del poder ruso. Las grandes catedrales que llenan esta sede sagrada se convierten en el corazón del Imperio Ruso."
 mos_conquer_novgorod: "Conquista de Nóvgorod"
 mos_conquer_novgorod_desc: "Nóvgorod, antaño la mayor ciudad-Estado mercantil de Rusia. Realiza aún antes la conquista decisiva de Iván III en 1478."
 mos_conquer_tver: "Conquista de Tver"
 mos_conquer_tver_desc: "Tver, antigua rival de Moscú: su poder ha menguado. Conquista esta ciudad clave a orillas del Volga para avanzar la unificación de Rusia."
 mos_conquer_ryazan: "Subyugación de Riazán"
 mos_conquer_ryazan_desc: "Riazán, devastada por primera vez por los mongoles en 1237: conquista su estepa meridional y construye una línea de defensa."
 mos_conquer_smolensk: "Conquista de Smolensk"
 mos_conquer_smolensk_desc: "Smolensk, la “llave de Rusia”: controla esta encrucijada de oriente y occidente para establecer influencia occidental."
 mos_conquer_ruthenia: "Conquista de Rutenia Blanca"
 mos_conquer_ruthenia_desc: "Rutenia Blanca: conquista esta zona controlada por Lituania, con capital en Minsk, y establece el dominio paneslavo."
 mos_window_on_west: "Ventana a Occidente"
 mos_window_on_west_desc: "Toma Víborg y Carelia para abrir la “ventana a Occidente”: adelántate al sueño de Pedro el Grande de acceso a Occidente."
 mos_baltic_ambition: "Ambición báltica"
 mos_baltic_ambition_desc: "La costa oriental del Báltico, controlada por la Orden Livona: conquistar esta zona permite entrar en el comercio del norte de Europa."
 mos_conquer_riga: "Conquista de Riga"
 mos_conquer_riga_desc: "Riga, pilar de la Hansa: conquista este centro comercial báltico para obtener acceso a la red comercial del norte de Europa."
 mos_partition_poland: "Partición de Polonia"
 mos_partition_poland_desc: "Pon fin a la larga lucha con la Mancomunidad Polaco-Lituana por Rutenia Blanca y por Europa oriental."
 mos_metropolitan_see: "La metrópoli de Moscú"
 mos_metropolitan_see_desc: "En 1448 Moscú estableció una metrópoli eclesiástica independiente. Esta autoridad ortodoxa sustenta la legitimidad política de Moscú."
 mos_land_of_churches: "Tierra de iglesias"
 mos_land_of_churches_desc: "La “Santa Rusia”: construye catedrales ortodoxas por toda la tierra y santifica Rusia como reino de Dios."
 mos_tsar_title: "El título de zar"
 mos_tsar_title_desc: "“Zar (emperador)”: Iván IV asumió formalmente este título en 1547. Proclama el poder como heredero de Roma y obtén el reconocimiento como potencia europea."
 mos_russian_patriarchate: "El Patriarcado ruso"
 mos_russian_patriarchate_desc: "El patriarcado de Moscú, establecido en 1589, independiente de Constantinopla: refuerza los cimientos religiosos de la “Tercera Roma”."
 mos_guardian_orthodoxy: "Guardiana de la ortodoxia"
 mos_guardian_orthodoxy_desc: "Con la caída de Constantinopla ante los otomanos en 1453, Rusia se convierte en guardiana de la fe ortodoxa. Construye la red ortodoxa por toda la tierra."
 mos_conquer_constantinople: "Conquista de Constantinopla"
 mos_conquer_constantinople_desc: "Recupera la santa capital ortodoxa, Constantinopla, de manos otomanas: cumple la misión de la “Tercera Roma” y reescribe la historia."
 mos_third_rome: "La Tercera Roma"
 mos_third_rome_desc: "“Moscú es la Tercera Roma, y una cuarta no habrá”: las palabras del monje Filoteo se hacen realidad. Moscú reina como centro espiritual del mundo cristiano."
 mos_march_caucasus: "Marcha al Cáucaso"
 mos_march_caucasus_desc: "Conquista Georgia, Armenia y Azerbaiyán en las montañas del Cáucaso y haz de Rusia un verdadero imperio continental."
 mos_caspian_sea: "Dominio del Mar Caspio"
 mos_caspian_sea_desc: "El “mar interior ruso”, el Caspio: conquista la ruta comercial hacia Persia y Asia central."
 mos_beyond_urals: "Más allá de los Urales"
 mos_beyond_urals_desc: "Los Montes Urales marcan la frontera entre Europa y Asia; más allá se extienden los vastos espacios de Siberia. Adelántate a la conquista de Yermak de 1582 y reclama la tierra de las pieles."
 mos_conquer_perm: "Conquista de Perm"
 mos_conquer_perm_desc: "Perm, en el alto Kama: conquista esta fuente de las “pieles de Kama” y úsala como cabeza de puente para la conquista de Siberia."
 mos_west_siberia: "Siberia occidental"
 mos_west_siberia_desc: "Siberia occidental, con capital en Tobolsk: la vasta taiga proporciona recursos de pieles sin fin. Desarrolla Tobolsk como “capital de Siberia”."
 mos_east_siberia: "Siberia oriental"
 mos_east_siberia_desc: "Hasta Irkutsk: alcanzar el lago Baikal abre la puerta a Siberia oriental."
 mos_pacific_coast: "Alcanza la costa del Pacífico"
 mos_pacific_coast_desc: "“Los cosacos han llegado al Pacífico”: de Yakutsk al Mar de Ojotsk. La bandera rusa ondea en el extremo del Pacífico."
 mos_fur_monopoly: "Monopolio de las pieles"
 mos_fur_monopoly_desc: "Las pieles siberianas son la mercancía más valiosa de los mercados europeos. Monopoliza su suministro y obtén riqueza incalculable."
 mos_sudebnik: "El Sudébnik"
 mos_sudebnik_desc: "El Sudébnik de 1497, el primer código de leyes uniforme de la Rusia de Iván III: este código, base de la servidumbre campesina, se convierte en instrumento de centralización."
 mos_handle_boyars: "Somete a los boyardos"
 mos_handle_boyars_desc: "Los boyardos controlan el poder local: quiebra esa posición y establece gobernadores directos del zar para avanzar la centralización."
 mos_oprichnina: "La Opríchnina"
 mos_oprichnina_desc: "La sombría opríchnina de Iván IV: los caballeros negros del zar purgaban a los boyardos rebeldes. Usa esta política cruel pero eficaz para hacer absoluto el poder del zar."
 mos_dev_agriculture: "Desarrolla la agricultura"
 mos_dev_agriculture_desc: "El rico chernozem ruso: desarrolla las fértiles tierras que se extienden de Ucrania al Volga para elevar la productividad agrícola."
 mos_dev_agriculture_unlock_tt: "La decisión «Fomentar el desarrollo agrícola» ya está disponible."
 mos_agriculture_decision.title: "Fomentar el desarrollo agrícola"
 mos_agriculture_decision.desc: "La tierra negra se extiende desde Ucrania hasta el Volga, pero su cosecha depende de herramientas, graneros y la cooperación de los grandes terratenientes. El tesoro y la influencia del soberano en la corte pueden gastarse para organizarla."
 mos_agriculture_decision.a: "Organizar las cosechas."
 mos_agriculture_upgrade_decision.title: "El gran cultivo de la tierra negra"
 mos_agriculture_upgrade_decision.desc: "Aseguradas las primeras cosechas, el Estado puede poner bajo el arado la propia frontera de la estepa: nuevas aldeas, nuevos molinos y nuevos caminos para sacar el grano. Costará una fortuna y buena parte de la influencia del soberano, pero la tierra negra rendirá como nunca."
 mos_agriculture_upgrade_decision.a: "Poner bajo el arado la frontera de la estepa."
 mos_pomestye_system: "El sistema pomestie"
 mos_pomestye_system_desc: "El sistema pomestie —concesión de tierras a cambio de servicio militar— crea la base del poder militar de Rusia."
 mos_streltsy: "Establece los strelitzi"
 mos_streltsy_desc: "Los strelitzi: infantería permanente de fusileros creada por Iván IV. Esta formación de élite se convierte en la columna vertebral del ejército ruso."
 mos_zasechnaya_cherta: "La línea Zasechnaya"
 mos_zasechnaya_cherta_desc: "Construye la “Línea Zasechnaya” de árboles talados y fortalezas como línea de defensa contra las incursiones de la caballería tártara."
 mos_dev_arkhangelsk: "Erige Arcángel"
 mos_dev_arkhangelsk_desc: "Arcángel, puerto en el Mar Blanco: el único puerto mercantil marítimo de Rusia antes de Pedro el Grande. Desarrolla este puerto para el comercio directo con Europa occidental."
 mos_white_sea_trade: "Comercio del Mar Blanco"
 mos_white_sea_trade_desc: "La Compañía de Moscovia inglesa (1555) entró en Rusia por aquí: adelántate y toma la ruta comercial del Mar Blanco."
 mos_dev_nizhny: "Desarrolla Nizhni Nóvgorod"
 mos_dev_nizhny_desc: "En la confluencia del Volga y el Oká: desarrolla “Nizhni Nóvgorod” como centro del comercio del Volga."
 mos_conquer_pskov: "Conquista de Pskov"
 mos_conquer_pskov_desc: "Pskov fue incorporada a Moscú en 1510. Siguiendo a Nóvgorod, conquista Pskov y somete por completo la Rusia noroccidental."
 mos_dev_yaroslavl: "Desarrolla Yaroslavl"
 mos_dev_yaroslavl_desc: "Yaroslavl, del “Anillo de Oro”: desarrolla esta ciudad mercantil a orillas del Volga como nudo de tránsito del comercio del norte."
 mos_conquer_vologda: "Desarrolla Vólogda"
 mos_conquer_vologda_desc: "Vólogda: toma esta encrucijada clave de la ruta del norte y asegura la conexión con el comercio del Mar Blanco."
 mos_amber_road: "La Ruta del Ámbar"
 mos_amber_road_desc: "El ámbar del Báltico: suministra esta mercancía a los mercados europeos por Riga y aumenta los ingresos comerciales."
 mos_reform_taxation: "Reforma tributaria"
 mos_reform_taxation_desc: "Establece un sistema tributario uniforme y fortalece las finanzas del Estado. La recaudación fiscal centralizada sostiene al ejército ruso."
 mos_dev_kazan_city: "Desarrolla la ciudad de Kazán"
 mos_dev_kazan_city_desc: "Desarrolla la conquistada Kazán en una ciudad multiétnica donde conviven tártaros, rusos y chuvasios."
 mos_conquer_vilnius: "Conquista de Vilna"
 mos_conquer_vilnius_desc: "Vilna, capital del Gran Ducado de Lituania: conquistarla pone fin al dominio lituano y traslada la hegemonía de Europa oriental a Moscú."
 mos_develop_moscow_university: "Funda la Universidad de Moscú"
 mos_develop_moscow_university_desc: "Construye aulas antes de la Universidad de Moscú (fundada en 1755). La realización temprana del sueño de Lomonósov promueve el desarrollo intelectual de Rusia."
 mos_teutonic_order: "Aplasta a la Orden Teutónica"
 mos_teutonic_order_desc: "La Orden Teutónica, legado de las cruzadas bálticas: conquistar su territorio aporta plena influencia rusa sobre el sur del Báltico."
 mos_estonian_coast: "La costa estonia"
 mos_estonian_coast_desc: "Tallin: toma este puerto clave hanseático y alcanza la plena inserción en el comercio báltico."
 mos_dev_tobolsk_city: "Desarrolla la ciudad de Tobolsk"
 mos_dev_tobolsk_city_desc: "Desarrolla Tobolsk de una vez como “capital de Siberia”: hazla centro administrativo de la conquista siberiana."
 mos_streltsy_reform: "Reforma militar"
 mos_streltsy_reform_desc: "Moderniza a los strelitzi: adopta tecnologías militares occidentales para elevar el ejército ruso a los estándares europeos."
 mos_siberian_ostrog: "Red de ostrogs siberianos"
 mos_siberian_ostrog_desc: "Desarrolla una red de fortalezas (ostrogs) que une Tobolsk, Yeniseisk e Irkutsk y sostiene la conquista de Siberia."
 mos_absolute_monarchy: "Establece la monarquía absoluta"
 mos_absolute_monarchy_desc: "Establece el poder absoluto del zar: retira el poder a los boyardos, la iglesia y los señores locales, concentrando toda la autoridad en manos del emperador."
 mos_peter_reforms: "Las reformas de Pedro"
 mos_peter_reforms_desc: "Pedro el Grande (1672-1725) transformó Rusia en un Estado moderno mediante la occidentalización. Reforma militar, creación de una flota, academia de ciencias. Realiza el espíritu de “abrir la ventana a Occidente”."
 mos_dev_st_petersburg: "Erige San Petersburgo"
 mos_dev_st_petersburg_desc: "Construida por Pedro el Grande en 1703 en los pantanos del Neva: erige San Petersburgo como la primera ciudad occidental de Rusia."
 mos_russian_navy: "Establece la Armada rusa"
 mos_russian_navy_desc: "“Rusia necesita una flota”: según la convicción de Pedro el Grande, crea las flotas de Azov y del Báltico."
 mos_dev_suzdal: "Desarrolla Súzdal"
 mos_dev_suzdal_desc: "Súzdal, del “Anillo de Oro”: desarrolla esta antigua ciudad, con muchas iglesias medievales, como centro de religión y cultura."
 mos_dev_vladimir: "Desarrolla Vladímir"
 mos_dev_vladimir_desc: "Vladímir, antaño capital del Gran Principado: desarrolla esta antigua ciudad como centro de agricultura y abastecimiento de alimentos."
 mos_salt_works: "Industria de la sal"
 mos_salt_works_desc: "La sal de Vólogda y Solikamsk: asegura un suministro estable de sal, esencial para la conservación de alimentos en Rusia."
 mos_beeswax_trade: "Comercio de cera"
 mos_beeswax_trade_desc: "La cera de abeja rusa: mercancía clave, muy demandada para las velas de la Iglesia Ortodoxa y para la exportación a Europa occidental."
 mos_iron_works: "Industria del hierro"
 mos_iron_works_desc: "El mineral de hierro de la región de los Urales: sienta las bases de la industria del hierro uraliana, que se fortalecerá en la era de Pedro."
 mos_dev_astrakhan_city: "Desarrolla la ciudad de Astracán"
 mos_dev_astrakhan_city_desc: "Astracán, la “puerta del sur”: desarróllala como centro del comercio caspio y toma el comercio con Persia y Asia central."
 mos_cossack_cavalry: "Caballería cosaca"
 mos_cossack_cavalry_desc: "Los cosacos del Don y de Zaporiyia: incorpora a estos mejores jinetes de la estepa al ejército ruso."
 mos_book_of_royal_degrees: "El Libro de los Grados"
 mos_book_of_royal_degrees_desc: "El Libro de los Grados (Stepénnaya Kniga) registra el linaje de los gobernantes rusos, reforzando la legitimidad y la eficiencia administrativa de Moscú."
 mos_kholmogory: "Desarrolla Kholmogori"
 mos_kholmogory_desc: "Kholmogori, en el Dvina septentrional: desarrolla este enclave comercial en el Mar Blanco."
 mos_protect_south_slavs: "Protege a los eslavos del sur"
 mos_protect_south_slavs_desc: "Libera a los cristianos ortodoxos de los Balcanes del dominio otomano y construye un imperio paneslavo."
 mos_conquer_carpathia: "Conquista de los Cárpatos"
 mos_conquer_carpathia_desc: "Los Montes Cárpatos: conquistar estas puertas a Europa central amplía enormemente la influencia occidental."
 mos_great_northern_war: "La Gran Guerra del Norte"
 mos_great_northern_war_desc: "En la Gran Guerra del Norte (1700-1721), Pedro el Grande derrotó a Suecia y estableció la hegemonía báltica: realiza esta victoria antes."
 mos_dev_perm_city: "Desarrolla la ciudad de Perm"
 mos_dev_perm_city_desc: "Desarrolla Perm, nudo del comercio de pieles, en una verdadera ciudad: hazla centro de comercio y recogida de pieles en el alto Kama."
 mos_yakutsk_founded: "Funda Yakutsk"
 mos_yakutsk_founded_desc: "Yakutsk, fundada en 1632: constrúyela como centro de Siberia oriental y abre el camino al Pacífico."
 mos_dev_irkutsk: "Desarrolla Irkutsk"
 mos_dev_irkutsk_desc: "Irkutsk, en el lago Baikal: desarrolla esta ciudad, más tarde la “París de Siberia”, como centro administrativo y comercial de Siberia oriental."
 mos_dev_minsk: "Desarrolla Minsk"
 mos_dev_minsk_desc: "Desarrolla Minsk, centro de Bielorrusia, como base del poder occidental."
 mos_conquer_warsaw: "Conquista de Varsovia"
 mos_conquer_warsaw_desc: "Varsovia, capital de Polonia: concluye la partición de Polonia y establece influencia sobre Europa central."
 mos_iron_ring_defense: "Defensa del Anillo de Hierro"
 mos_iron_ring_defense_desc: "Una red de fortalezas contra invasiones del sur y del oeste: el sistema de baluartes de hierro protege el territorio ruso."
 mos_form_russia: "Forma Rusia"
 mos_form_russia_desc: "Tras quebrar el yugo tártaro, conquistar Kazán y unir los principados rusos, proclama formalmente el Estado de “Rusia” y gobierna a todos como zar."
 mos_russian_empire: "El Imperio Ruso"
 mos_russian_empire_desc: "Pedro el Grande proclamó Rusia “imperio” con el Tratado de Nystad de 1721: realiza este momento antes por medio de las pieles, la agricultura y las reformas de Pedro."
 mos_autocrat_of_all_russias: "Autócrata de toda Rusia"
 mos_autocrat_of_all_russias_desc: "“Por la gracia de Dios, emperador y autócrata de todas las Rusias”: del Báltico a Siberia, del Cáucaso al Océano Ártico, todas las tierras reposan bajo la gracia soberana del zar."
 mos_events.1.t: "El Gran Principado de Moscú, bajo el yugo tártaro"
 mos_events.1.d: "En 1337, Moscú es un pequeño principado. Pero gracias a la astuta destreza de Iván I Kalitá (“bolsa de dinero”), el recaudador del tributo tártaro, Moscú ha acumulado fuerza.\n\nLa ventaja de Moscú es la geografía: su posición en el interior de los bosques dificulta el control tártaro directo.\n\nEl recuerdo de la batalla del campo de Kulikovo (1380), en la que Dmitri Donskói rechazó a los tártaros, sigue vivo. Librarse por completo del yugo tártaro y unir los principados rusos bajo el poder del zar: ese es el destino de Moscú."
 mos_events.1.a: "¡Gloria a Moscú!"
 mos_events.5.t: "¡Quiebra el yugo tártaro!"
 mos_events.5.d: "Por fin el ejército moscovita ha derrotado a los tártaros en batalla: el tributo tártaro ha terminado para siempre. En este giro histórico, comparable al “enfrentamiento en el río Ugra (1480)”, Moscú se convierte en el abanderado de la Rusia libre. Los principados rusos reconocen la hegemonía de Moscú, y el camino hacia un Estado unificado está abierto."
 mos_events.5.a: "¡Rusia es libre! ¡Ahora, a la unificación de Rusia!"
 mos_events.10.t: "Coronación del zar"
 mos_events.10.d: "“Zar y gran príncipe de toda Rusia”: al asumir este título, Moscú se proclama heredera legítima del Imperio Bizantino. Adelántate a la histórica ceremonia de coronación de Iván IV en 1547. Las cortes de Europa empiezan a reconocer a Moscú como nueva gran potencia."
 mos_events.10.a: "¡Viva el zar! ¡Viva Moscú!"
 mos_events.30.t: "El regreso de Constantinopla: la Tercera Roma completa"
 mos_events.30.d: "¡La santa ciudad ortodoxa de Constantinopla en manos rusas! La reconquista de esta ciudad, caída ante los otomanos en 1453, significa que Rusia se convierte en líder espiritual del mundo ortodoxo como “Tercera Roma”. La cruz cristiana ondea de nuevo sobre Santa Sofía."
 mos_events.30.a: "¡Viva la Tercera Roma! ¡Viva la ortodoxia rusa!"
 mos_events.50.t: "Las reformas de Pedro: ¿occidentalización o tradición?"
 mos_events.50.d: "La ola de occidentalización está a punto de inundar Rusia. ¿Adoptar activamente las tecnologías, los sistemas militares y la ciencia de Occidente para hacer de Rusia una potencia europea moderna, o defender la tradición ortodoxa y el “camino ruso”, construyendo un imperio singular?"
 mos_events.50.a: "Promover la occidentalización: Rusia es parte de Europa"
 mos_events.60.t: "Formación de Rusia: nace un nuevo imperio"
 mos_events.60.d: "Ucrania, Bielorrusia y Galitzia bajo una sola bandera: el Estado eslavo oriental unificado de “Rutenia” surge como nueva gran potencia de Europa oriental. Todos los pueblos de Rusia se reúnen bajo las cúpulas doradas de Kiev."
 mos_events.60.a: "¡Viva Rusia! ¡Viva el zar de toda Rusia!"
 mos_events.99.t: "Autócrata de toda Rusia: el imperio completo"
 mos_events.99.d: "“Por la gracia de Dios, emperador y autócrata de todas las Rusias”: del Báltico a Siberia, del Cáucaso al Océano Ártico, la bandera rusa ondea sobre el mayor imperio del mundo. Del pequeño principado de Moscú de 1337 al mayor imperio del mundo: esta hazaña histórica será contada para siempre."
 mos_events.99.a: "¡Viva el autócrata de toda Rusia! ¡Viva el Imperio Ruso!"
 mos_events.50.b: "Preservar la tradición"
