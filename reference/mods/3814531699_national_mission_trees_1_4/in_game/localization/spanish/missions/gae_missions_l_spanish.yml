l_spanish:
 gae_gaelic_ireland_mission_pack: "El contraataque gaélico de Irlanda"
 gae_gaelic_ireland_mission_pack_DESCRIPTION:0 "El dominio inglés vacila en medio de la peste y la invasión de Bruce: como jefe gaélico, encabeza el resurgimiento, reclama el trono del Alto Rey para unir Irlanda y, por último, cruza el mar para conquistar la propia Inglaterra."
 gae_gaelic_ireland_mission_pack_CRITERIA_DESCRIPTION:0 "Une el clan, conviértete en Alto Rey de toda Irlanda y conquista Inglaterra."
 gae_gaelic_ireland_mission_pack_BUTTON_TOOLTIP:0 "De clan dividido a Alto Rey que conquistó Inglaterra."
 gae_gaelic_ireland_mission_pack_BUTTON_DETAILS:0 "¡Alza el estandarte gaélico sobre la Isla Esmeralda, y también más allá del mar!"
 gae_gaelic_resurgence: "Resurgimiento gaélico"
 gae_gaelic_resurgence_desc: "En el caos de la Peste Negra y la invasión de Bruce, el dominio colonial inglés vacila: la era de los señores gaélicos vuelve a esta isla."
 gae_brehon_law: "Preserva la ley brehon"
 gae_brehon_law_desc: "La ley brehon, una tradición jurídica independiente de la costumbre romana o inglesa: preserva este sistema ancestral como cimiento del gobierno."
 gae_fili_and_bards: "Los fili y los bardos"
 gae_fili_and_bards_desc: "Los fili, poetas eruditos que guardan la historia y la genealogía del clan: protege su arte y deja que el honor del clan sea cantado por generaciones."
 gae_gallowglass_recruitment: "Recluta a los gallóglaigh"
 gae_gallowglass_recruitment_desc: "Temibles guerreros de las islas escocesas: acoge a estos “gallóglaigh” en tus filas y fortalece el poder del clan."
 gae_clan_unification: "Une el clan"
 gae_clan_unification_desc: "Ramas colaterales divididas y tierras en disputa: reúnelas y establece tu autoridad como jefe."
 gae_lord_of_the_clan: "Señor del clan"
 gae_lord_of_the_clan_desc: "Ley, poesía, armas y linaje unido: construye sobre todo ello y conviértete en el verdadero señor del clan."
 gae_rout_the_settlers: "Expulsa a los colonos"
 gae_rout_the_settlers_desc: "Los colonos ingleses, con las filas mermadas por la peste: aprovecha la oportunidad y expúlsalos de esta tierra."
 gae_ostmen_towns: "Las ciudades de los ostmen"
 gae_ostmen_towns_desc: "Ciudades portuarias fundadas hace mucho por los descendientes de los vikingos, los ostmen: toma ciudades como Dublín y Waterford."
 gae_resurgence_triumphant: "Resurgimiento triunfante"
 gae_resurgence_triumphant_desc: "La expulsión de los colonos y la toma de las ciudades de los ostmen: el resurgimiento gaélico alcanza aquí su primer triunfo."
 gae_ulster_hegemony: "Hegemonía sobre Ulster"
 gae_ulster_hegemony_desc: "Ulster, la tierra septentrional de los O’Neill y los O’Donnell: establece la hegemonía sobre esta región."
 gae_connaught_hegemony: "Hegemonía sobre Connacht"
 gae_connaught_hegemony_desc: "Connacht, la tierra salvaje del oeste: como heredero de la gloria de los O’Connor, gobierna esta región."
 gae_munster_hegemony: "Hegemonía sobre Munster"
 gae_munster_hegemony_desc: "Munster, en el sur, tierra de los MacCarthy y los O’Brien: conquista la hegemonía sobre esta rica región."
 gae_leinster_hegemony: "Hegemonía sobre Leinster"
 gae_leinster_hegemony_desc: "Leinster, que linda con el propio Pale: establece la hegemonía sobre esta región estratégica."
 gae_high_king_of_ireland: "Alto Rey de Irlanda"
 gae_high_king_of_ireland_desc: "El antiguo título de Ard Rí, el Alto Rey, dormido en la colina de Tara: supera la era de las divisiones y haz resurgir este puesto honorabilísimo."
 gae_conquer_the_pale: "Conquista el Pale"
 gae_conquer_the_pale_desc: "El Pale, último reducto de Inglaterra en torno a Dublín: devuelve esta tierra a manos gaélicas."
 gae_expel_the_english: "Expulsa a los ingleses"
 gae_expel_the_english_desc: "Los últimos vestigios del poder inglés, aún aferrados a esta isla: bárrelos por completo."
 gae_master_of_the_emerald_isle: "Señor de la Isla Esmeralda"
 gae_master_of_the_emerald_isle_desc: "El trono del Alto Rey, la conquista del Pale y la expulsión total de los ingleses: Irlanda vuelve a ser verdaderamente gaélica."
 gae_gaelic_fleet: "Construye una flota gaélica"
 gae_gaelic_fleet_desc: "Para cruzar el mar hasta la propia Inglaterra: construye una poderosa flota y vuelve la mirada hacia la patria de los antiguos invasores."
 gae_invade_wales: "Invade Gales"
 gae_invade_wales_desc: "Gales, tierra de sangre celta emparentada: desembarca en esas playas y asegura una cabeza de puente contra Inglaterra."
 gae_war_on_england: "Guerra contra Inglaterra"
 gae_war_on_england_desc: "Ha llegado el momento de invertir el curso de la historia: desafía a Inglaterra, el antiguo invasor, cara a cara."
 gae_conquest_of_england: "La conquista de Inglaterra, realizada"
 gae_conquest_of_england_desc: "La patria de quienes un día pisaron esta isla yace ahora bajo el dominio de un rey gaélico. La historia está aquí completamente invertida."
 gae_events.1.t: "El Alto Rey asciende al trono"
 gae_events.1.d: "En la colina de Tara, según la antigua costumbre, se ha proclamado a un nuevo Alto Rey. La era de las divisiones llega aquí a su fin."
 gae_events.1.a: "¡Gloria al Alto Rey!"
 gae_events.2.t: "Señor de la Isla Esmeralda"
 gae_events.2.d: "Con la caída del Pale y la expulsión total de los ingleses, esta isla ha vuelto por fin a ser verdaderamente gaélica."
 gae_events.2.a: "¡Gloria a Irlanda!"
 gae_events.99.t: "La conquista de Inglaterra, realizada"
 gae_events.99.d: "La patria de Inglaterra, que un día pisó esta isla, se arrodilla ahora ante el trono de un rey gaélico. La historia está completamente invertida."
 gae_events.99.a: "¡Historia invertida!"
 STATIC_MODIFIER_NAME_gae_resurgence_mod: "Resurgimiento gaélico"
 STATIC_MODIFIER_DESC_gae_resurgence_mod: "Desde que la peste redujo la población de colonos, la lengua y las costumbres de esta tierra vuelven a extenderse por el país."
 STATIC_MODIFIER_NAME_gae_brehon_mod: "Ley brehon preservada"
 STATIC_MODIFIER_DESC_gae_brehon_mod: "La memoria de los precedentes, transmitida por generaciones de juristas brehon, inspira más confianza que cualquier código escrito."
 STATIC_MODIFIER_NAME_gae_bards_mod: "Los fili y los bardos"
 STATIC_MODIFIER_DESC_gae_bards_mod: "Los aprendices de fili aún pasan siete años memorizando la genealogía y las hazañas del clan."
 STATIC_MODIFIER_NAME_gae_gallowglass_mod: "Gallóglaigh reclutados"
 STATIC_MODIFIER_DESC_gae_gallowglass_mod: "Los guerreros del hacha que llegaron por mar desde las Hébridas forman ahora el núcleo de la fuerza permanente del clan."
 STATIC_MODIFIER_NAME_gae_clan_mod: "Clan unido"
 STATIC_MODIFIER_DESC_gae_clan_mod: "Jefes vecinos, unidos por matrimonio y por pacto, miran ahora más allá de las viejas rencillas, hacia el enemigo común."
 STATIC_MODIFIER_NAME_gae_lord_clan_mod: "Señor del clan"
 STATIC_MODIFIER_DESC_gae_lord_clan_mod: "Elegido según la antigua costumbre de la tanistry, este jefe manda ahora las espadas de todas las ramas colaterales."
 STATIC_MODIFIER_NAME_gae_rout_settlers_mod: "Colonos expulsados"
 STATIC_MODIFIER_DESC_gae_rout_settlers_mod: "Las mansiones de los colonos, mermados por la peste, yacen vacías, volviendo una a una al estado salvaje."
 STATIC_MODIFIER_NAME_gae_ostmen_mod: "Las ciudades de los ostmen"
 STATIC_MODIFIER_DESC_gae_ostmen_mod: "De los muelles donde trabajan descendientes de sangre normanda parten sin cesar barcos cargados de pieles y lana."
 STATIC_MODIFIER_NAME_gae_triumphant_mod: "Resurgimiento triunfante"
 STATIC_MODIFIER_DESC_gae_triumphant_mod: "Tras medio siglo de retroceso, la colonia inglesa ha sido empujada a una mera franja litoral."
 STATIC_MODIFIER_NAME_gae_ulster_mod: "Hegemonía sobre Ulster"
 STATIC_MODIFIER_DESC_gae_ulster_mod: "Bajo el nombre O’Neill están ahora reunidos los guerreros de los nueve condados del norte."
 STATIC_MODIFIER_NAME_gae_connaught_hegemony_mod: "Hegemonía sobre Connacht"
 STATIC_MODIFIER_DESC_gae_connaught_hegemony_mod: "Como herederos de la sangre de los O’Connor, las levas de los clanes que habitan los páramos del oeste son aceptadas como algo natural."
 STATIC_MODIFIER_NAME_gae_munster_mod: "Hegemonía sobre Munster"
 STATIC_MODIFIER_DESC_gae_munster_mod: "De las colinas de Decies al puerto de Cork, la riqueza del sur abundante llena el tesoro."
 STATIC_MODIFIER_NAME_gae_leinster_mod: "Hegemonía sobre Leinster"
 STATIC_MODIFIER_DESC_gae_leinster_mod: "Los recaudadores de impuestos gaélicos llegan ahora hasta el propio foso del Pale."
 STATIC_MODIFIER_NAME_gae_conquer_pale_mod: "Pale conquistado"
 STATIC_MODIFIER_DESC_gae_conquer_pale_mod: "El estandarte inglés que un día ondeó en las torres del Castillo de Dublín ha sido por fin arriado."
 STATIC_MODIFIER_NAME_gae_expel_english_mod: "Ingleses expulsados"
 STATIC_MODIFIER_DESC_gae_expel_english_mod: "El dominio extranjero sobre esta isla, iniciado en tiempos de Enrique II, ha llegado por fin a un final completo."
 STATIC_MODIFIER_NAME_gae_fleet_mod: "Flota gaélica construida"
 STATIC_MODIFIER_DESC_gae_fleet_mod: "Los marineros gaélicos, antes temidos solo como saqueadores, comandan ahora una verdadera flota propia."
 STATIC_MODIFIER_NAME_gae_war_england_mod: "Guerra contra Inglaterra"
 STATIC_MODIFIER_DESC_gae_war_england_mod: "La guerra que trajeron a esta isla hace siglo y medio cae ahora sobre su propia tierra."
 STATIC_MODIFIER_NAME_gae_high_king_mod: "Alto Rey de Irlanda"
 STATIC_MODIFIER_DESC_gae_high_king_mod: "La sede del Ard Rí, abandonada desde los tiempos de Brian Boru, ha encontrado de nuevo a su señor en la colina de Tara."
 STATIC_MODIFIER_NAME_gae_emerald_isle_mod: "Señor de la Isla Esmeralda"
 STATIC_MODIFIER_DESC_gae_emerald_isle_mod: "De costa a costa, no queda ya ningún funcionario extranjero en esta isla."
 STATIC_MODIFIER_NAME_gae_conquest_england_mod: "Historia invertida"
 STATIC_MODIFIER_DESC_gae_conquest_england_mod: "En el trono antes ocupado por autoproclamados conquistadores se sienta ahora un rey gaélico."
