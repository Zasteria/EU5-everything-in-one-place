l_spanish:
 byz_restoration_mission_pack: "La restauración del Imperio romano"
 byz_restoration_mission_pack_desc: "Recupera Constantinopla, reocupa Anatolia y los Balcanes, une los cuatro patriarcados, triunfa en Roma y restaura la mayor extensión del antiguo Imperio romano."
 byz_restoration_mission_pack_BUTTON_TOOLTIP:0 "Restaura las tierras del Imperio romano."
 byz_restoration_mission_pack_DESCRIPTION:0 "Salva el imperio tambaleante y restaura su antiguo esplendor. Como heredero del legado de Roma, trae de vuelta al estandarte imperial las antiguas tierras de Oriente y Occidente."
 byz_restoration_mission_pack_BUTTON_DETAILS:0 "Restaura el Imperio bizantino desde el borde del colapso y trae de vuelta a su reino el mundo mediterráneo que Roma gobernó antaño. ¡Realiza el sueño de la Renovatio Imperii!"
 byz_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Recupera, como Bizancio, las antiguas tierras romanas y alcanza la Renovatio Imperii."
 byz_retake_anatolia_west: "Recupera la Anatolia occidental"
 byz_retake_anatolia_west_desc: "Recupera Esmirna para restaurar la autoridad imperial en la Anatolia occidental."
 byz_retake_anatolia_east: "Recupera la Anatolia oriental"
 byz_retake_anatolia_east_desc: "Conquista Ankara, Konya y Sivas para traer toda Anatolia al control imperial. Gobernar a los pueblos de cultura griega que aquí viven exigirá un nuevo enfoque administrativo."
 byz_secure_greece: "Reconstruye Grecia"
 byz_secure_greece_desc: "Recupera Atenas y Corinto y resucita la ortodoxia y la cultura griegas en la Hélade."
 byz_balkan_dominance: "Dominio de los Balcanes"
 byz_balkan_dominance_desc: "Conquista Belgrado y Tarnovo para restaurar el orden imperial en todos los Balcanes."
 byz_invasion_of_syria: "Invasión de Siria"
 byz_invasion_of_syria_desc: "Conquista las tierras de Siria, incluida Antioquía, uno de los cinco grandes patriarcados. Las antiguas rutas comerciales y los ricos centros de producción traerán al imperio nueva prosperidad."
 byz_protect_jerusalem: "Defensa de Jerusalén"
 byz_protect_jerusalem_desc: "Recupera Tierra Santa, donde Cristo sufrió. El emperador romano tiene el deber de guardián de los lugares santos. Establece un gobierno tolerante, para que los pueblos de muchas fes puedan vivir en paz en esta tierra."
 byz_dominion_of_aegyptus: "Dominio de Egipto"
 byz_dominion_of_aegyptus_desc: "Asegura Alejandría y El Cairo, grandes sedes del saber egipcio. Las tierras fértiles del Nilo alimentarán a muchos pueblos del imperio."
 byz_control_aegean: "Domina el Mar Egeo"
 byz_control_aegean_desc: "Asegura Creta y construye una poderosa flota para mantener el pleno dominio del Mar Egeo."
 byz_retake_italy_south: "Recupera el sur de Italia"
 byz_retake_italy_south_desc: "Recupera Nápoles y Sicilia para establecer una cabeza de puente en la península itálica."
 byz_reclaim_rome: "Recupera la Ciudad Eterna"
 byz_reclaim_rome_desc: "Recupera la Ciudad Eterna, Roma. Ha llegado la hora de que el legítimo heredero del Imperio romano recupere la capital occidental."
 byz_iberian_conquest: "Conquista Iberia"
 byz_iberian_conquest_desc: "Conquista Toledo y Córdoba para restaurar al imperio la antigua provincia de Hispania."
 byz_north_africa: "Recupera el norte de África"
 byz_north_africa_desc: "Conquista Túnez, Trípoli y Argel para restaurar al imperio la antigua provincia de África."
 byz_north_italy: "Norte de Italia"
 byz_north_italy_desc: "Conquista Venecia, Génova, Milán y Florencia para unir la península itálica bajo el nombre romano."
 byz_invasion_of_france: "Invasión de Francia"
 byz_invasion_of_france_desc: "Con el norte de Italia e Iberia aseguradas, la mirada del imperio se vuelve hacia la Galia. Conquista toda la región de Francia y completa el territorio imperial en el oeste."
 byz_renovatio_imperii: "Renovatio Imperii"
 byz_renovatio_imperii_desc: "La restauración del imperio. De Iberia a la Galia, del norte de África a Italia, de Asia Menor a los Balcanes y a Tierra Santa. Exige 1000+ provincias y 2000+ de ingresos mensuales."
 byz_events.2.t: "Prosperidad de Esmirna"
 byz_events.2.d: "Esmirna y los puertos de la Anatolia occidental recuperados. Estas antiguas ciudades comerciales vuelven a ser posesión de los mercaderes bizantinos, y el comercio en el Mar Egeo revive."
 byz_events.2.a: "Apoyar el comercio en Esmirna"
 byz_events.3.t: "Atenas: la reconstrucción de la Hélade"
 byz_events.3.d: "Atenas y Corinto recuperadas. La ciudad de Sócrates y Platón, la colina en que se alza el Partenón, de nuevo bizantinas. Monasterios ortodoxos son reconstruidos, y el saber griego revive."
 byz_events.3.a: "Restaurar la ortodoxia y la cultura griegas en la Hélade"
 byz_events.7.t: "Sur de Italia recuperado"
 byz_events.7.d: "Nápoles y Palermo recuperadas. Estas tierras, antaño florecientes como Magna Grecia, son de nuevo parte del Imperio romano. La riqueza del comercio mediterráneo fluye al tesoro imperial."
 byz_events.7.a: "Incorporar el sur de Italia al imperio"
 byz_events.8.t: "La Ciudad Eterna: entrada en Roma"
 byz_events.8.d: "Roma, la ciudad de las siete colinas, lugar del martirio de Pedro y Pablo: recuperada. Como antaño Constantino el Grande gobernaba el imperio desde este lugar, así de nuevo el emperador romano se sienta en Roma. La historia se ha cumplido."
 byz_events.8.a: "Hacer de la Ciudad Eterna la capital occidental"
 byz_events.10.t: "Renovatio Imperii"
 byz_events.10.d: "La restauración del Imperio romano. De Iberia a Asia Menor, del norte de África a los Balcanes, de Italia a Tierra Santa. Lo que Justiniano el Grande anheló en 527-565, lo que se soñó a lo largo de toda la Edad Media: la restauración del Imperio romano se ha hecho por fin realidad. El Mediterráneo es de nuevo Mare Nostrum."
 byz_events.10.a: "Proclamar al mundo la Renovatio Imperii"
 byz_renovatio_unlock_tt: "Renovatio Imperii alcanzada."
 byz_reclaim_bursa: "Recupera Bursa"
 byz_reclaim_bursa_desc: "Recupera Bursa, antaño importante ciudad bizantina. Situada en un punto clave de la Ruta de la Seda, el futuro rumbo del oficio de esta ciudad queda a decisión del imperio."
 byz_avoid_collapse: "Evita el colapso"
 byz_avoid_collapse_desc: "El imperio vacila al borde del colapso. Pero, si la legitimidad y la estabilidad interna pueden preservarse, el camino a la restauración aún no está cerrado."
 byz_events.20.t: "El futuro de Bursa"
 byz_events.20.d: "En los talleres de Bursa, los artesanos discuten un nuevo camino de producción. ¿Construir sobre la larga tradición de la ciudad en la tejeduría de la seda, o concentrarse en la producción de paño más fino? La decisión del imperio moldeará el futuro de la ciudad."
 byz_events.20.a: "Apoyar la producción de seda"
 byz_events.20.b: "Concentrarse en la producción de paño fino"
 byz_events.21.t: "El futuro de Nicomedia"
 byz_events.21.d: "Nicomedia, ciudad clave en la orilla sur del Mar de Mármara, ha vuelto al imperio. La corte debate qué oficio definirá el futuro de esta ciudad: apoyar la producción de armamentos o plantar moreras e iniciar la producción de seda."
 byz_events.21.a: "Apoyar la producción de armamentos"
 byz_events.21.b: "Plantar moreras e iniciar la producción de seda"
 byz_reclaim_nicomedia: "Recupera Nicomedia"
 byz_reclaim_nicomedia_desc: "Nicomedia (Izmit): ciudad clave en la orilla sur del Mar de Mármara. Transforma su producción de recursos en seda y reconstruye la economía de la seda del imperio. Asegurar 50%+ de control marca el primer paso hacia la restauración del Imperio romano."
 byz_orthodox_antioch: "Convierte Antioquía a la ortodoxia"
 byz_orthodox_antioch_desc: "Confirma que la mayoría de la población de Antioquía se ha convertido a la ortodoxia. Que la ciudad en que primero sonó el nombre “cristiano” se llene de nuevo de la luz de la ortodoxia."
 byz_orthodox_jerusalem: "Convierte Jerusalén a la ortodoxia"
 byz_orthodox_jerusalem_desc: "Confirma que la mayoría de la población de Jerusalén se ha convertido a la ortodoxia. Las campanas de la Basílica del Santo Sepulcro suenan con la liturgia ortodoxa."
 byz_orthodox_alexandria: "Convierte Alejandría a la ortodoxia"
 byz_orthodox_alexandria_desc: "Confirma que la mayoría de la población de Alejandría se ha convertido a la ortodoxia. Las tradiciones de la Iglesia copta son incorporadas a la corriente ortodoxa."
 byz_orthodox_rome: "El fin del Gran Cisma"
 byz_orthodox_rome_desc: "Confirma que la mayoría de la población de Roma se ha convertido a la ortodoxia. El cisma de 1054 termina: no por la reconciliación, sino por el triunfo de la ortodoxia sobre Roma."
 byz_hellenic_athens: "Renacimiento del Partenón"
 byz_hellenic_athens_desc: "Atenas, la ciudad de Atenea. A los dioses olímpicos se ofrecen de nuevo sacrificios en la Acrópolis, y el renacimiento de la fe helénica comienza aquí."
 byz_hellenic_corinth: "Santuario de Poseidón en Corinto"
 byz_hellenic_corinth_desc: "En el Istmo de Corinto, Poseidón —guardián de los dos mares— poseyó antaño un gran templo. Reconstruye este santuario y atrae la bendición del dios del mar al imperio."
 byz_hellenic_mystras: "Santuario de Apolo en Mistra"
 byz_hellenic_mystras_desc: "Mistra, cerca de Esparta: corazón espiritual del Peloponeso. Reconstruye aquí el santuario de Apolo y despierta el espíritu valiente de Esparta, que lleva la memoria del oráculo de Delfos."
 byz_hellenic_alexandria: "Reconstrucción del Serapeo"
 byz_hellenic_alexandria_desc: "El Serapeo de Alejandría fue antaño uno de los mayores templos del mundo antiguo. Dedicado a Serapis —nacido de la fusión de las religiones griega y egipcia—, su reconstrucción establece la religión helénica en Egipto y reúne de nuevo la sabiduría del mundo antiguo."
 byz_events.11.t: "Antioquía: el retorno a la Primera Iglesia"
 byz_events.11.d: "Antioquía, donde primero sonó el nombre “cristiano”, está ahora llena de la luz de la ortodoxia. La memoria de las obras de Pedro y Pablo renace aquí, y la ciudad asume la nueva misión de centro espiritual de la ortodoxia."
 byz_events.11.a: "Poner Antioquía bajo protección ortodoxa"
 byz_events.12.t: "Jerusalén: campanas ortodoxas en la Ciudad Santa"
 byz_events.12.d: "La Ciudad Santa, Jerusalén, deseada por todos los fieles ortodoxos, se ha convertido en una ciudad ortodoxa. La Basílica del Santo Sepulcro suena de nuevo con la liturgia oriental. No es solo conquista: es triunfo de la fe."
 byz_events.12.a: "Guardar Tierra Santa para siempre"
 byz_events.13.t: "Alejandría: la ortodoxización de la ciudad del saber"
 byz_events.13.d: "Alejandría, tesoro del saber antiguo, se ha convertido en ciudad ortodoxa. Las antiguas tradiciones de la Iglesia copta se funden con la corriente ortodoxa más amplia, y el diálogo entre la filosofía neoplatónica y la teología comienza a florecer de nuevo."
 byz_events.13.a: "Desarrollar Alejandría como ciudad del saber ortodoxo"
 byz_events.14.t: "El fin del Gran Cisma: unidad de las iglesias"
 byz_events.14.d: "Desde 1054, cuando el papa León IX y el patriarca Cerulario se excomulgaron mutuamente, han pasado siglos. No por la reconciliación, sino por la conquista ortodoxa de Roma, el Gran Cisma termina. La mayoría de los ciudadanos de Roma se ha convertido a la ortodoxia. La Ciudad Eterna se convierte en el pilar occidental de la Iglesia de Oriente. La historia ha elegido la fe bizantina."
 byz_events.14.a: "Proclamar al mundo el fin del Gran Cisma"
 byz_events.15.t: "El Partenón: el despertar de Atenea"
 byz_events.15.d: "De nuevo se ofrecen sacrificios a Atenea en la Acrópolis. El Partenón, que se había convertido en iglesia cristiana, reconstruido como templo de los antiguos dioses. El pueblo de Atenas invoca a los dioses olímpicos por su nombre, y la llama del helenismo se reenciende."
 byz_events.15.a: "Guiar el imperio bajo la protección de Atenea"
 byz_events.16.t: "Corinto: Poseidón de los estrechos"
 byz_events.16.d: "En la colina de Corinto, que contempla los dos mares, se reconstruye el templo de Poseidón. El dios del istmo protegió largamente a mercaderes y marineros. Con la restauración de sus ritos, Corinto se convierte de nuevo en centro espiritual del comercio mediterráneo."
 byz_events.16.a: "Dejar que el comercio prospere bajo la bendición de Poseidón"
 byz_events.17.t: "Delos: patria del dios de la luz"
 byz_events.17.d: "En la isla sagrada del Egeo, Delos, venerada como patria de Apolo y Artemisa, se reconstruye el antiguo templo. Peregrinos y sacerdotes se reúnen de todo el Mar Egeo, y el espíritu de la razón y la belleza griegas antiguas renace. El imperio neoplatónico con que soñó Pletón comienza a tomar forma."
 byz_events.17.a: "Iluminar el imperio con la luz de Delos"
 byz_events.18.t: "El Serapeo: la conclusión del renacimiento helénico"
 byz_events.18.d: "Alejandría: en esta tierra, donde antaño se alzaba el Serapeo, la fe en los dioses helénicos ha vuelto.\n\nCon la reconstrucción del templo concluida, los dioses del Olimpo descienden de nuevo sobre la gran tierra del Nilo. Los ciudadanos de Alejandría realizan de nuevo los antiguos ritos, y las oraciones a Serapis resuenan por el cielo de la mañana.\n\nEste sagrado renacimiento envía ondas de fe helénica por todo el Imperio bizantino: nuevos conversos surgen uno tras otro, el poder de los signos crece y la influencia religiosa aumenta. Zeus, Apolo, Atenea: todos los dioses bendicen la restauración del imperio."
 byz_events.18.a: "Hacer del Serapeo la ciudad sagrada del mundo helénico"
 byz_faith_choice: "La elección de la fe"
 byz_faith_choice_desc: "Una nueva era de ideas comienza. En la corte de Mistra, se discute la doctrina neoplatónica, mientras en Constantinopla la autoridad de la iglesia ortodoxa es cuestionada. El imperio está en una encrucijada espiritual."
 byz_faith_orthodox_chosen_tt: "Se eligió la ortodoxia"
 byz_faith_hellenic_chosen_tt: "Se eligió el helenismo"
 byz_events.19.t: "Encrucijada de la fe: ortodoxia o helenismo"
 byz_events.19.d: "Grecia recuperada. Desde la Acrópolis de Atenas, se divisa a lo lejos Constantinopla, y las ruinas de antiguos templos duermen en las cumbres del Peloponeso. La restauración del Imperio bizantino no es solo recuperar territorio: es reconstruir un alma. Dos voces disputan en la corte imperial. Una es la del clero: “Somos el pueblo de Cristo. Debemos reconstruir el imperio como guardián de la iglesia ortodoxa”. La otra es la de los filósofos helenistas: “¿Por qué adorar a un dios extranjero en la tierra de Platón y Aristóteles? Los antiguos dioses griegos son el verdadero hogar de nuestras almas”."
 byz_events.19.a: "Preservar la iglesia ortodoxa: proteger la tradición oriental"
 byz_events.19.a.tt: "Rama ortodoxa de la fe desbloqueada. Prosigue con las misiones de ortodoxización de Antioquía, Jerusalén, Alejandría y Roma."
 byz_events.19.b: "Resucitar a los antiguos dioses: reencender la llama helénica"
 byz_events.19.b.tt: "Rama helénica desbloqueada. El imperio se vuelve al helenismo, y quedan disponibles las misiones de reconstrucción de los santuarios de Atenas, Corinto, Mistra y Alejandría."
 byz_orthodox_path_start: "El camino ortodoxo"
 byz_orthodox_path_start_desc: "El camino del guardián ortodoxo abierto. Continúa recuperando y ortodoxizando las ciudades santas."
 byz_hellenic_path_start: "El camino helénico"
 byz_hellenic_path_start_desc: "El camino de los antiguos dioses abierto. Reconstruye los santuarios de la Hélade y reconstruye la antigua civilización griega."
 byz_recovery_from_decline: "Recuperación del declive"
 byz_recovery_from_decline_desc: "Somete el poder de la nobleza cortesana y reconstruye la autoridad de la corona. A medida que el poder imperial se reconstruya, la estabilidad en el gobierno vendrá."
 byz_city_the_world_desires: "La ciudad deseada por el mundo"
 byz_city_the_world_desires_desc: "Constantinopla ha crecido de nuevo hasta ser la gran ciudad que gente de todo el mundo desea ver. Que esta prosperidad se haga eterna."
 byz_islamic_heartland: "El corazón del islam"
 byz_islamic_heartland_desc: "La Meca y Medina, las dos ciudades más sagradas del islam, han caído en nuestras manos. El imperio debe ahora decidir el destino de estos lugares santos."
 byz_events.22.t: "Los lugares santos del islam"
 byz_events.22.d: "La Kaaba en La Meca y la Mezquita del Profeta en Medina —los lugares más sagrados del mundo islámico— están ahora bajo control imperial. ¿Destruirlos para mostrar la supremacía de la ortodoxia, o acogerlos para que el imperio se beneficie de la riqueza de los peregrinos?"
 byz_events.22.a: "Destruir los lugares santos"
 byz_events.22.b: "Acoger los lugares santos"
 STATIC_MODIFIER_NAME_byz_anatolia_west: "Anatolia occidental restaurada"
 STATIC_MODIFIER_DESC_byz_anatolia_west: "Los diversos pueblos de la Anatolia occidental son gradualmente incorporados a la cultura del imperio."
 STATIC_MODIFIER_NAME_byz_anatolia_east: "Anatolia oriental"
 STATIC_MODIFIER_DESC_byz_anatolia_east: "Los diversos pueblos de la Anatolia oriental son gradualmente incorporados a la cultura del imperio."
 STATIC_MODIFIER_NAME_byz_greece_restored: "Hélade restaurada"
 STATIC_MODIFIER_DESC_byz_greece_restored: "Atenas, Salónica, Peloponeso: el corazón de la antigua civilización griega y de la cultura greco-bizantina. La recuperación de estas tierras, tras el dominio latino (el Ducado franco de Atenas y otros), el saqueo de la Compañía Catalana y la conquista por los otomanos, es el cumplimiento de un sueño milenario del “helenismo” renacido."
 STATIC_MODIFIER_NAME_byz_balkan_order: "Orden balcánico"
 STATIC_MODIFIER_DESC_byz_balkan_order: "Los efectivos y el poderío militar de los Balcanes reforzados."
 STATIC_MODIFIER_NAME_byz_syria_province: "Provincia de Siria"
 STATIC_MODIFIER_DESC_byz_syria_province: "Siria fue, desde la Antigüedad, centro de comercio y artesanía como extremo occidental de la Ruta de la Seda. El acero de Damasco, el jabón de Alepo, el vidrio sirio: estas famosas mercancías eran exportadas al mundo entero. En los siglos IV-VII, fue también la provincia más rica del Imperio bizantino, trayendo enormes ingresos fiscales."
 STATIC_MODIFIER_NAME_byz_judaea_province: "Provincia de Judea"
 STATIC_MODIFIER_DESC_byz_judaea_province: "Administrar Judea, hogar de Tierra Santa, favorece mayor tolerancia a las muchas fes del imperio."
 STATIC_MODIFIER_NAME_byz_aegyptus_province: "Provincia de Egipto"
 STATIC_MODIFIER_DESC_byz_aegyptus_province: "Las tierras fértiles del Nilo permiten al imperio sostener mayor población en todas sus provincias."
 STATIC_MODIFIER_NAME_byz_aegean_mastery: "Dominio del Mar Egeo"
 STATIC_MODIFIER_DESC_byz_aegean_mastery: "En los puertos de las Islas Egeas, atracan sin cesar los navíos de guerra y mercantes del imperio, y el mar ha vuelto a ser “nuestro mar”."
 STATIC_MODIFIER_NAME_byz_rome_restored: "Ciudad Eterna restaurada"
 STATIC_MODIFIER_DESC_byz_rome_restored: "Cuando el estandarte de Bizancio ondeó de nuevo sobre las siete colinas, la corte en Constantinopla supo que el imperio había alcanzado por fin su apogeo."
 STATIC_MODIFIER_NAME_byz_hispania_province: "Provincia de Hispania"
 STATIC_MODIFIER_DESC_byz_hispania_province: "Las vastas tierras de España envían muchos soldados para engrosar las filas del ejército imperial."
 STATIC_MODIFIER_NAME_byz_gallia_province: "Provincia de la Galia"
 STATIC_MODIFIER_DESC_byz_gallia_province: "Las águilas romanas vuelan de nuevo sobre las llanuras de la Galia, y los soldados a orillas del Loira marchan con orgullo por el emperador, distante en el este."
 STATIC_MODIFIER_NAME_byz_true_rome: "La verdadera Roma"
 STATIC_MODIFIER_DESC_byz_true_rome: "Las velas y carretas de los mercaderes de Venecia, Génova y Milán conducen ahora su comercio bajo el estandarte del emperador. La península itálica ya no es una rama de Roma, sino su tronco."
 STATIC_MODIFIER_NAME_byz_renovatio_imperii_mod: "Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_imperii_mod: "El Imperio romano plenamente restaurado: los caminos con que soñó Justiniano unen de nuevo todos los rincones del imperio, y los mensajeros del emperador cabalgan sin obstáculos hasta las distantes orillas del Mediterráneo."
 STATIC_MODIFIER_NAME_byz_collapse_averted: "Colapso evitado"
 STATIC_MODIFIER_DESC_byz_collapse_averted: "El imperio aún no ha caído. Habiendo sobrevivido a la crisis, la corte alivia el peso de privar a los poderosos de privilegios y debilita la resistencia a tales reformas."
 STATIC_MODIFIER_NAME_byz_bursa_silk: "Comercio de seda de Bursa"
 STATIC_MODIFIER_DESC_byz_bursa_silk: "En los bosques de moreras de Bursa, el sonido de los gusanos de seda hilando nunca se apaga en las noches de primavera."
 STATIC_MODIFIER_NAME_byz_bursa_fine_cloth: "Comercio de paños finos de Bursa"
 STATIC_MODIFIER_DESC_byz_bursa_fine_cloth: "De los telares de los talleres de Bursa salen, uno tras otro, paños finos, disputados por los cortesanos."
 STATIC_MODIFIER_NAME_byz_nicomedia_weaponry: "Comercio de armamentos de Nicomedia"
 STATIC_MODIFIER_DESC_byz_nicomedia_weaponry: "En las fraguas de Nicomedia suenan los martillos día y noche, y espadas y armaduras para el ejército imperial se apilan en alto."
 STATIC_MODIFIER_NAME_byz_nicomedia_silk: "Comercio de seda de Nicomedia"
 STATIC_MODIFIER_DESC_byz_nicomedia_silk: "Jóvenes moreras plantadas en las colinas en torno a Nicomedia, aguardando el día en que la ciudad será famosa como hogar de la seda."
 STATIC_MODIFIER_NAME_byz_hellenic_sanctuary: "Santuario helénico"
 STATIC_MODIFIER_DESC_byz_hellenic_sanctuary: "De nuevo en el santuario de los antiguos dioses se ofrecen sacrificios, y los pasos de los peregrinos desgastan las piedras del empedrado."
 STATIC_MODIFIER_NAME_byz_hellenic_serapeum: "El Serapeo"
 STATIC_MODIFIER_DESC_byz_hellenic_serapeum: "Con la reconstrucción del Serapeo, Alejandría se ha convertido en el centro espiritual del mundo antiguo, y tanto eruditos como peregrinos se reúnen a sus puertas."
 STATIC_MODIFIER_NAME_byz_schism_ended: "El fin del Gran Cisma"
 STATIC_MODIFIER_DESC_byz_schism_ended: "Tras siglos de excomuniones mutuas de 1054, las iglesias de Oriente y Occidente se han reunido por fin junto a un solo altar por el triunfo de la ortodoxia."
 STATIC_MODIFIER_NAME_byz_islamic_sites_destroyed: "Lugares santos destruidos"
 STATIC_MODIFIER_DESC_byz_islamic_sites_destroyed: "La destrucción de los lugares santos islámicos probó poderosamente la supremacía de la ortodoxia y reforzó la fe en la religión de Estado y el prestigio del imperio."
 STATIC_MODIFIER_NAME_byz_islamic_sites_accepted: "Lugares santos acogidos"
 STATIC_MODIFIER_DESC_byz_islamic_sites_accepted: "Acoger los lugares santos islámicos multiplicó la tolerancia a herejes y paganos, y la actividad comercial floreció con la afluencia de peregrinos."
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "Recuperación del declive"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "El tiempo sombrío del declive ha pasado, y la luz de la mañana brilla de nuevo sobre la corte del emperador y los campos del imperio."
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "La ciudad deseada por el mundo"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "Constantinopla reconstruida como centro administrativo del imperio."
 STATIC_MODIFIER_NAME_byz_africa_province_mod: "Provincia de África"
 STATIC_MODIFIER_DESC_byz_africa_province_mod: "La flota imperial ha vuelto al puerto de Cartago, y el sueño de la era de Justiniano se dibuja de nuevo en el mar."
 STATIC_MODIFIER_NAME_byz_renovatio_bonus_mod: "La gloria de la Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_bonus_mod: "La restauración del Imperio romano reconoció a Bizancio como señora del imperio mundial."
 STATIC_MODIFIER_NAME_byz_antioch_orthodox_mod: "Ortodoxia de Antioquía"
 STATIC_MODIFIER_DESC_byz_antioch_orthodox_mod: "Antioquía reconstruida como templo ortodoxo, lo que eleva la autoridad religiosa del imperio."
 STATIC_MODIFIER_NAME_byz_jerusalem_orthodox_mod: "Ortodoxia de Jerusalén"
 STATIC_MODIFIER_DESC_byz_jerusalem_orthodox_mod: "La Ciudad Santa, Jerusalén, ortodoxizada, lo que da ventajas en la lucha contra los paganos."
 STATIC_MODIFIER_NAME_byz_alexandria_orthodox_mod: "Ortodoxia de Alejandría"
 STATIC_MODIFIER_DESC_byz_alexandria_orthodox_mod: "El canto ortodoxo resuena en las iglesias de Alejandría, y los mercados se llenan de familias de fieles."
 STATIC_MODIFIER_NAME_byz_serapeum_restored_mod: "Serapeo reconstruido"
 STATIC_MODIFIER_DESC_byz_serapeum_restored_mod: "El Serapeo de Alejandría reconstruido, y los dioses del Olimpo descienden de nuevo a la tierra de Egipto."
