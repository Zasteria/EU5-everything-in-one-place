l_spanish:
 sav_house_of_savoy_mission_pack: "Las ambiciones de la casa de Saboya"
 sav_house_of_savoy_mission_pack_DESCRIPTION:0 "La casa de Saboya, señora de los pasos alpinos, está destinada a alzarse de un pequeño ducado piamontés para gobernar toda Italia y el sur de Francia y fundar el Reino de Italia. Maniobra con astucia entre el papa, el emperador y Francia; toma Génova para establecer poder naval; aplasta Lombardía, Toscana y el Véneto para reivindicar Roma. Surge como Cerdeña-Piamonte y conviértete por fin en el abanderado de la unificación de Italia."
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION:0 "Como Saboya-Piamonte, conquista Italia y Francia y funda el Reino de Italia."
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para realizar las ambiciones de la casa de Saboya."
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS:0 "¡Cruza los Alpes y une Italia!"
 sav_the_savoy_ambition: "La ambición de Saboya"
 sav_the_savoy_ambition_desc: "La casa de Saboya ocupa un lugar singular en la encrucijada de los Alpes, con influencia tanto sobre Italia como sobre Francia. Mediante el dominio de las fértiles tierras del Piamonte y de las rutas comerciales alpinas, este pequeño ducado inicia su camino hacia la grandeza."
 sav_unify_piedmont: "Une el Piamonte"
 sav_unify_piedmont_desc: "Incorporar potencias independientes, como Saluzzo y Monferrato, y unir todo el Piamonte: el primer paso hacia las grandes ambiciones de Saboya."
 sav_glory_of_turin: "La gloria de Turín"
 sav_glory_of_turin_desc: "Desarrolla Turín, la ciudad central del Piamonte, en una metrópoli floreciente, digna de ser la capital de la casa de Saboya."
 sav_shroud_of_turin: "La Sábana Santa de Turín"
 sav_shroud_of_turin_desc: "El paño de lino, tenido por sudario de Cristo, reposa en la catedral de Turín. La fe en esta reliquia trae riqueza y prestigio al reino."
 sav_alpine_roads: "Los caminos alpinos"
 sav_alpine_roads_desc: "El desarrollo de la infraestructura viaria a lo largo de las rutas comerciales alpinas aumenta el beneficio que fluye a Saboya a medida que los mercaderes pasan entre Francia e Italia."
 sav_crossroads_of_europe: "Encrucijada de Europa"
 sav_crossroads_of_europe_desc: "El Piamonte, que une Génova, Venecia y Francia, se convierte en uno de los principales nudos comerciales de Europa."
 sav_order_of_saints_maurice: "La Orden de los Santos Mauricio y Lázaro"
 sav_order_of_saints_maurice_desc: "La Orden de los Santos Mauricio y Lázaro, fundada por la casa de Saboya, se convierte en símbolo de autoridad religiosa y legitimidad en el mundo católico."
 sav_savoy_academy: "La Academia de Saboya"
 sav_savoy_academy_desc: "Adoptar el espíritu del Renacimiento y desarrollar instituciones académicas en torno a Turín establece a Saboya como miembro seguro del círculo cultural italiano."
 sav_alpine_powerhouse: "La potencia alpina"
 sav_alpine_powerhouse_desc: "Mediante la unificación del Piamonte, el desarrollo cultural y el creciente poder económico, Saboya es reconocida como potencia significativa en torno a los Alpes."
 sav_alpine_fortifications: "Fortificaciones alpinas"
 sav_alpine_fortifications_desc: "Aprovechar plenamente el relieve natural de los Alpes y construir poderosas fortalezas en puntos estratégicos hace de Saboya un Estado montañés inexpugnable."
 sav_diplomatic_balance: "Equilibrio diplomático"
 sav_diplomatic_balance_desc: "Para Saboya, encajada entre grandes potencias, la maestría diplomática es indispensable para la supervivencia. Mantener alto prestigio diplomático desvía hábilmente la presión de los vecinos poderosos."
 sav_savoyard_army: "El ejército saboyano"
 sav_savoyard_army_desc: "Los soldados saboyanos, templados en el terreno accidentado de los Alpes, son considerados entre los mejores guerreros de montaña de Europa. Construir un ejército permanente sustenta la independencia militar del reino."
 sav_conquer_genoa: "Conquista Génova"
 sav_conquer_genoa_desc: "La conquista de Génova, una de las principales ciudades marítimas del Mediterráneo, permite a Saboya superar su posición terrestre y dar el primer paso hacia el poder naval, con acceso directo al Mediterráneo."
 sav_nice_naval_base: "Base naval de Niza"
 sav_nice_naval_base_desc: "Establecer una base naval en Niza, en la costa mediterránea, da a Saboya una cabeza de puente para dominar el Mar Tirreno."
 sav_sardinia_union: "Unión con Cerdeña"
 sav_sardinia_union_desc: "Tomar la mayor parte de Cerdeña y asumir el título de “Reino de Cerdeña” hace que la casa de Saboya sea reconocida como una de las casas reales significativas de Italia."
 sav_seize_lombardy: "Toma Lombardía"
 sav_seize_lombardy_desc: "Traer Lombardía, en torno a Milán, al control saboyano hace de Saboya la señora del norte de Italia."
 sav_push_tuscany: "Avanza sobre la Toscana"
 sav_push_tuscany_desc: "Subyugar las ricas ciudades-Estado de la Toscana, lideradas por Florencia, añade al territorio saboyano una tierra núcleo de la cultura renacentista."
 sav_capture_venice: "Toma Venecia"
 sav_capture_venice_desc: "La conquista de Venecia, la Reina del Adriático, establece la hegemonía marítima de Saboya en el norte de Italia."
 sav_emilia_and_beyond: "Emilia y más allá"
 sav_emilia_and_beyond_desc: "Tomar la región de Emilia y dominar las demás provincias del norte de Italia hace absoluta la hegemonía saboyana."
 sav_march_on_naples: "Marcha sobre Nápoles"
 sav_march_on_naples_desc: "La conquista de Nápoles, ciudad clave del sur de Italia, acerca la conclusión del dominio sobre la península."
 sav_eternal_rome: "La Ciudad Eterna"
 sav_eternal_rome_desc: "Dominar Roma significa dominar Italia. Habiendo tomado la Ciudad Eterna, Saboya muestra al mundo su autoridad de legítima gobernante de Italia."
 sav_integrate_geneva: "Integra Ginebra"
 sav_integrate_geneva_desc: "Traer Ginebra, con sus fuertes lazos con la Confederación Suiza, con firmeza al control saboyano establece una cabeza de puente para la expansión hacia el norte."
 sav_control_provence: "Domina Provenza"
 sav_control_provence_desc: "Tomar Provenza, a lo largo de la costa mediterránea, establece la hegemonía de Saboya en el sur de Francia y abre el camino a ambiciones mayores."
 sav_against_the_swiss: "Contra los suizos"
 sav_against_the_swiss_desc: "Suprimir la Confederación Suiza, tercamente independiente, y tomar la Suiza occidental hace de Saboya señora de las tierras al oeste del Rin."
 sav_conquer_burgundy: "Conquista Borgoña"
 sav_conquer_burgundy_desc: "Subyugar las ricas tierras que antaño gobernó el ducado de Borgoña abre el camino para la invasión de Francia."
 sav_savoyard_occitania: "La Occitania saboyana"
 sav_savoyard_occitania_desc: "Tomar las tierras de lengua occitana e incorporar todo el sur de Francia al círculo cultural saboyano."
 sav_claim_france: "Reivindica Francia"
 sav_claim_france_desc: "Ha llegado la hora de tomar París, capital del Reino de Francia, y traer bajo nuestro gobierno a la gran potencia que antaño amenazó a Saboya."
 sav_kingdom_of_italy: "El Reino de Italia"
 sav_kingdom_of_italy_desc: "La casa de Saboya cruzó los Alpes para unificar toda Italia y, como heredera del Imperio romano, fundó el Reino de Italia. El sueño del Risorgimento aquí realizado."
 STATIC_MODIFIER_NAME_sav_unified_piedmont_mod: "Unificación del Piamonte"
 STATIC_MODIFIER_DESC_sav_unified_piedmont_mod: "El Piamonte —“pie de la montaña”—, fértil llanura, cercada por los Alpes y los Apeninos, gobernada por los señores de Saboya, Monferrato, Saluzzo y otros. Solo con su unificación puede Saboya dominar plenamente la encrucijada que une los Alpes con el río Po."
 STATIC_MODIFIER_NAME_sav_shroud_of_turin_mod: "La bendición de la Sábana Santa"
 STATIC_MODIFIER_DESC_sav_shroud_of_turin_mod: "La Sábana Santa de Turín: paño de lino que, según se cree, envolvió a Cristo tras la crucifixión, con la impresión sombreada de un cuerpo humano. Desde que la casa de Saboya la obtuvo en 1353, es venerada como una de las mayores reliquias del mundo católico. Los debates sobre su autenticidad continúan, pero su impacto religioso y político es innegable."
 STATIC_MODIFIER_NAME_sav_alpine_roads_mod: "Los caminos alpinos"
 STATIC_MODIFIER_DESC_sav_alpine_roads_mod: "El Gran San Bernardo, el Mont Cenis y el San Gotardo: los caminos alpinos fueron las principales arterias de Europa desde los tiempos romanos hasta la Edad Media. Saboya, señora de estos pasos, se hizo inmensamente rica por peajes y comercio. Su papel de “guardiana de los Alpes” fue la raíz de su prosperidad."
 STATIC_MODIFIER_NAME_sav_crossroads_mod: "Encrucijada de Europa"
 STATIC_MODIFIER_DESC_sav_crossroads_mod: "El Piamonte está justo en la encrucijada de Francia, Suiza, Génova y Milán. Mercaderes italianos camino de las ferias de Champaña, peregrinos franceses camino de Roma, mercenarios rumbo a Suiza: gente y mercancías de todo tipo pasaban por el Piamonte, y, supervisando el camino, Saboya monopolizaba los beneficios del comercio de intermediación."
 STATIC_MODIFIER_NAME_sav_order_of_saints_mod: "La Orden de los Santos Mauricio y Lázaro"
 STATIC_MODIFIER_DESC_sav_order_of_saints_mod: "La Orden de los Santos Mauricio y Lázaro combinó dos órdenes fundadas por la casa de Saboya en 1434 y 1572, respectivamente. San Mauricio fue un mártir cristiano de la era romana; San Lázaro era venerado como patrón de los leprosos. La orden se convirtió en símbolo de la autoridad religiosa de la casa de Saboya en el mundo católico."
 STATIC_MODIFIER_NAME_sav_savoy_academy_mod: "La influencia de la Academia de Saboya"
 STATIC_MODIFIER_DESC_sav_savoy_academy_mod: "En la era del Renacimiento, el ducado de Saboya era conocido por su mecenazgo del saber y las artes. La Universidad de Turín, fundada en 1404, se convirtió en el centro espiritual del Piamonte, enseñando derecho, medicina y teología. La tradición de mecenazgo artístico, que más tarde llevaría a la Accademia delle Belle Arti bajo Carlos Manuel I, también echó raíces en esta era."
 STATIC_MODIFIER_NAME_sav_alpine_powerhouse_mod: "La potencia alpina"
 STATIC_MODIFIER_DESC_sav_alpine_powerhouse_mod: "“Pequeña, pero fuerte”: la fuerza de Saboya estaba en el sabio uso de su geografía. Cercada por las grandes potencias Francia, Austria y España, sobrevivió gracias a la diplomacia hábil y a una estrategia militar que explotaba la naturaleza de la tierra, y se convirtió por fin en la “dinastía del destino” que condujo la unificación de Italia."
 STATIC_MODIFIER_NAME_sav_alpine_fortifications_mod: "Fortificaciones alpinas"
 STATIC_MODIFIER_DESC_sav_alpine_fortifications_mod: "Desplegando grupos de fortalezas, como Briançon, Fenestrelle y Exilles, en los bastiones naturales de los Alpes, Saboya forjó el “escudo de los Alpes”. En los siglos XVII-XVIII, vinieron las fortalezas-baluarte al estilo de Vauban para guardar estos pasos, haciendo de Saboya uno de los Estados más inexpugnables de Europa."
 STATIC_MODIFIER_NAME_sav_diplomatic_balance_mod: "Equilibrio diplomático"
 STATIC_MODIFIER_DESC_sav_diplomatic_balance_mod: "La esencia de la diplomacia saboyana era “estar siempre al lado del más fuerte”. Equilibrándose en la cuerda floja entre Francia y Austria, Saboya obtuvo Cerdeña por el Tratado de Utrecht (1713) y se elevó al rango de reino. Víctor Amadeo II encarnó el apogeo de esta diplomacia “de equilibrio”."
 STATIC_MODIFIER_NAME_sav_savoyard_army_mod: "Élite saboyana"
 STATIC_MODIFIER_DESC_sav_savoyard_army_mod: "Los soldados saboyanos eran maestros de la guerra de montaña, forjados en el rudo terreno de los Alpes. Las reformas militares del Piamonte en los siglos XIV-XV establecieron la “Ordinanza Piemontese”, y la táctica de infantería disciplinada se convirtió en la fuerza del ejército saboyano. Incluso en el posterior Risorgimento, fueron el puntal de la liberación del norte de Italia."
 STATIC_MODIFIER_NAME_sav_conquer_genoa_mod: "La toma de Génova"
 STATIC_MODIFIER_DESC_sav_conquer_genoa_mod: "Génova, rival de Venecia, era una de las mayores ciudades-Estado marítimas medievales del Mediterráneo, extendiendo una enorme red comercial por el Mar Negro, el norte de África y Iberia. Fue también cuna de la banca (el Banco de San Jorge es uno de los más antiguos del mundo) y de los seguros. La conquista de esta “orgullosa república” abre a Saboya las puertas del Mediterráneo."
 STATIC_MODIFIER_NAME_sav_nice_naval_base_mod: "Base naval de Niza"
 STATIC_MODIFIER_DESC_sav_nice_naval_base_mod: "Niza (Nizza Marittima): antiguo puerto mediterráneo, fundado por una colonia de la griega Masalia (Marsella). Desde que la casa de Saboya lo obtuvo en 1388, este puerto, en la frontera de Francia e Italia, sirvió de única base naval de Saboya (permaneció saboyano hasta 1860)."
 STATIC_MODIFIER_NAME_sav_sardinia_union_mod: "Unión con Cerdeña"
 STATIC_MODIFIER_DESC_sav_sardinia_union_mod: "En 1720, en las reconfiguraciones tras el Tratado de Utrecht, la casa de Saboya cambió Sicilia por Cerdeña y se alzó como “Reino de Cerdeña”. La unión de esta isla con el Piamonte continental se convertirá en la base desde la que Camillo Cavour y Garibaldi alcanzarán la unificación de Italia (1861)."
 STATIC_MODIFIER_NAME_sav_seize_lombardy_mod: "La toma de Lombardía"
 STATIC_MODIFIER_DESC_sav_seize_lombardy_mod: "La llanura lombarda es una de las tierras agrícolas más fértiles de Europa, y Milán es su centro de industria y comercio. Recuperar esta rica tierra, desde hace mucho en manos de Austria, era objetivo principal del Risorgimento: la encarnación concreta del sueño de Saboya."
 STATIC_MODIFIER_NAME_sav_push_tuscany_mod: "Avance sobre la Toscana"
 STATIC_MODIFIER_DESC_sav_push_tuscany_mod: "La Toscana, en torno a Florencia, es la cuna de la cultura renacentista, que guarda el mayor legado artístico de la historia de la humanidad. Los Uffizi, la catedral, los poemas de Dante: todo apoyado por los Médici. Añadir este tesoro cultural a su territorio daría al Reino de Saboya autoridad espiritual."
 STATIC_MODIFIER_NAME_sav_capture_venice_mod: "La toma de Venecia"
 STATIC_MODIFIER_DESC_sav_capture_venice_mod: "Venecia, la “Reina del Adriático”, es una maravillosa ciudad-Estado que mantuvo su independencia durante más de mil años. Ciudad de canales, construida sobre islas de la laguna, gobernó mediante el monopolio del comercio oriental y la excelente construcción naval del Arsenale, como señora del Mediterráneo. Conquistar esta ciudad inexpugnable sería una gran hazaña de la historia."
 STATIC_MODIFIER_NAME_sav_emilia_and_beyond_mod: "Emilia y más allá"
 STATIC_MODIFIER_DESC_sav_emilia_and_beyond_mod: "Bolonia, Parma, Módena y Ferrara, dispuestas a lo largo de la Vía Emilia, eran conocidas desde la Edad Media como centros de gastronomía, cultura y saber. Bolonia alberga la más antigua universidad de Europa (fundada en 1088), y su tradición espiritual profundizaría la profundidad cultural del Reino de Saboya."
 STATIC_MODIFIER_NAME_sav_march_on_naples_mod: "Marcha sobre Nápoles"
 STATIC_MODIFIER_DESC_sav_march_on_naples_mod: "Tan bella que dio origen al proverbio “Ver Nápoles y después morir”, esta ciudad prosperó desde la Antigüedad como una de las grandes ciudades del Mediterráneo. Nápoles, que vivió una historia turbulenta bajo los dominios angevino, aragonés, español y borbónico, fue el último gran obstáculo de la unificación de Italia."
 STATIC_MODIFIER_NAME_sav_eternal_rome_mod: "La Ciudad Eterna"
 STATIC_MODIFIER_DESC_sav_eternal_rome_mod: "“Todos los caminos llevan a Roma”: capital del antiguo Imperio romano, sede de la Iglesia católica, centro de la cultura renacentista, Roma es símbolo de la civilización occidental. El Coliseo, el Panteón, la basílica de San Pedro: hacer de una ciudad de tal peso histórico la propia capital significa completar la unificación de Italia."
 STATIC_MODIFIER_NAME_sav_integrate_geneva_mod: "Integración de Ginebra"
 STATIC_MODIFIER_DESC_sav_integrate_geneva_mod: "Ginebra estuvo antaño bajo influencia de los condes de Saboya, pero, en 1536, Juan Calvino hizo de ella base de la Reforma y se convirtió en la “Roma protestante”. Reincorporar esta ciudad lacustre sería una importante cabeza de puente para la expansión saboyana hacia Suiza."
 STATIC_MODIFIER_NAME_sav_control_provence_mod: "Dominio de Provenza"
 STATIC_MODIFIER_DESC_sav_control_provence_mod: "Provenza fue antaño posesión de la casa de Anjou y fue anexionada a la corona francesa tras la muerte del rey René (1480). Los campos de lavanda, los olivares y los viñedos de la costa mediterránea: esta rica tierra del sur de Francia sería clave para una expansión territorial significativa de Saboya."
 STATIC_MODIFIER_NAME_sav_against_the_swiss_mod: "Contra los suizos"
 STATIC_MODIFIER_DESC_sav_against_the_swiss_mod: "La Confederación Suiza es un país de guerreros de montaña indomables, que derrotaron a Carlos el Temerario, duque de Borgoña, en 1476-77 en Grandson y Morat. Subyugar a este poderoso vecino no es tarea fácil, pero, para Saboya, que usaba mercenarios suizos (lansquenetes) como guardia palaciega, dominar su patria sería la mayor victoria militar."
 STATIC_MODIFIER_NAME_sav_conquer_burgundy_mod: "Conquista de Borgoña"
 STATIC_MODIFIER_DESC_sav_conquer_burgundy_mod: "Borgoña, rama más joven de los Valois, gobernó en su apogeo un inmenso “Reino del Medio”, que se extendía de los Países Bajos a Borgoña. Reanexionada a Francia con la muerte de Carlos el Temerario (1477), esta provincia rica, famosa por su vino y su cocina, se convertiría en importante cabeza de puente para la invasión de Francia."
 STATIC_MODIFIER_NAME_sav_savoyard_occitania_mod: "La Occitania saboyana"
 STATIC_MODIFIER_DESC_sav_savoyard_occitania_mod: "Los pueblos de lengua occitana del sur de Francia generaron la cultura de los trovadores, pero fueron devastados por la Cruzada Albigense del siglo XIII. Sepultada bajo la persecución a los cátaros y el gobierno de la corona francesa, la tradición occitana de autogobierno revive bajo el estandarte de Saboya."
 STATIC_MODIFIER_NAME_sav_claim_france_mod: "La reivindicación a Francia"
 STATIC_MODIFIER_DESC_sav_claim_france_mod: "Francia siempre fue, para Saboya, tanto una amenaza como una tentación. En la era de Napoleón (nacido corso, pero vecino de Niza), Saboya fue absorbida por Francia. Ahora es lo contrario: un gran giro en el que Saboya conquista el trono del rey francés para sí."
 STATIC_MODIFIER_NAME_sav_kingdom_of_italy_mod: "El Reino de Italia"
 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "El 17 de marzo de 1861, Víctor Manuel II (rey de Cerdeña) ascendió como primer rey del Reino de Italia: así ocurrió en la historia real. El mayor milagro político del siglo XIX, que combinó la diplomacia de Cavour, las armas de Garibaldi y los ideales de Mazzini, alcanzado aquí cuatro siglos antes."
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "La gloria de Turín"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "El mercado abierto “Balon”, las colinas de Langhe, que dan el Barolo y el Barbaresco, la magnífica Piazza San Carlo: Turín es la capital que la casa de Saboya moldeó como principal ciudad planificada de Italia. Como heredera de la cuadrícula romana de Augusta Taurinorum, esta ciudad muestra el rostro más delicado al sur de los Alpes."
 sav_events.1.t: "Las ambiciones de la casa de Saboya"
 sav_events.1.d: "El ducado de Saboya domina los pasos estratégicos de los Alpes, que unen Europa del Norte y del Sur. Con Francia e Italia a ambos lados, este pequeño ducado despierta a grandes ambiciones. El escudo de armas de Saboya —una cruz blanca sobre escudo escarlata— ondeará un día sobre toda Italia. Une el Piamonte, toma Génova, ocupa Roma y funda el Reino de Italia: el sueño milenario de la casa de Saboya está listo para comenzar."
 sav_events.1.a: "¡Alzar la gloria de la casa de Saboya!"
 sav_events.2.t: "La gloria de Turín"
 sav_events.2.d: "Bajo el gobierno de la casa de Saboya, Turín se desarrolla rápidamente. Con palacios e iglesias alzándose por toda la ciudad y eruditos y artistas reunidos aquí, esta ciudad emerge como centro cultural y político del norte de Italia. El florecimiento de Turín como capital digna de la casa de Saboya se convierte en la base de la prosperidad de todo el reino."
 sav_events.2.a: "Turín: la capital resplandeciente de la casa de Saboya"
 sav_woolens_of_piedmont: "La industria de la lana del Piamonte"
 sav_woolens_of_piedmont_desc: "El Piamonte es conocido como uno de los principales productores de lana y paños de Italia. La producción de lana de alta calidad y el procesamiento de paños crean la base comercial de la riqueza saboyana."
 sav_nebbiolo_vineyards: "Los viñedos de Nebbiolo"
 sav_nebbiolo_vineyards_desc: "Las uvas Nebbiolo, cultivadas en las colinas de Langhe, en el Piamonte, son la fuente de vinos famosos como el Barolo y el Barbaresco. Los vinos piamonteses son exportados por toda Europa, trayendo gran beneficio."
 sav_casa_savoia: "La autoridad de la casa de Saboya"
 sav_casa_savoia_desc: "El gobierno de la casa de Saboya se ha consolidado, y su autoridad es ahora ampliamente reconocida dentro y fuera del país. Un gobierno legítimo y estable es la base que eleva a Saboya al rango de potencia italiana significativa."
 sav_ordinanza_piedmontese: "La Ordinanza Piemontese"
 sav_ordinanza_piedmontese_desc: "En el siglo XV, Saboya estableció una táctica de infantería singular —la Ordinanza Piemontese— forjada en los Alpes elevados. Las formaciones disciplinadas de piqueros son la columna vertebral de la fuerza militar de Saboya."
 sav_university_of_turin: "La Universidad de Turín"
 sav_university_of_turin_desc: "Fundada en 1404, la Universidad de Turín sirve de corazón espiritual del Piamonte, enseñando derecho, medicina y teología. El legado espiritual de Saboya sustenta el florecimiento de la cultura renacentista."
 sav_corsica_seized: "Córcega tomada"
 sav_corsica_seized_desc: "Tomar Córcega, desde hace mucho gobernada por Génova, avanza enormemente el dominio de Saboya sobre el Mar Tirreno occidental."
 sav_towers_of_sardinia: "Las torres de Cerdeña"
 sav_towers_of_sardinia_desc: "Desde la Edad Media, incontables torres de vigía (Torre Costiera) se alinean a lo largo del litoral sardo. Desarrollar y fortificar estas instalaciones defensivas protege a Cerdeña de incursiones de piratas."
 sav_cagliari_development: "Desarrollo de Cagliari"
 sav_cagliari_development_desc: "Desarrolla Cagliari, capital de Cerdeña, como importante ciudad portuaria y nudo comercial del Mediterráneo occidental."
 sav_tyrrhenian_sea: "Señor del Mar Tirreno"
 sav_tyrrhenian_sea_desc: "Habiendo tomado tanto Córcega como Cerdeña, y construido una poderosa flota, Saboya ha establecido pleno dominio sobre el Mar Tirreno. El comercio del Mediterráneo occidental pasa a la protección saboyana."
 sav_languedoc: "Dominio del Languedoc"
 sav_languedoc_desc: "Tomar el Languedoc, punto clave del sur de Francia. Ocupar las dos grandes ciudades de Montpellier y Toulouse se convierte en cabeza de puente para dominar todo el sur de Francia."
 sav_gascony: "Gascuña tomada"
 sav_gascony_desc: "Gascuña, en torno a Burdeos, es una rica tierra de viñedos orientada hacia el Atlántico. Rompe su largo vínculo histórico con Inglaterra y añade esta tierra al territorio saboyano."
 sav_lyon_gateway: "La puerta de Lyon"
 sav_lyon_gateway_desc: "Situada en la confluencia del Ródano y el Saona, Lyon es nudo comercial que une el sur y el norte de Francia. Tomar esta ciudad abre el camino al interior de Francia."
 sav_loire_valley: "El Valle del Loira"
 sav_loire_valley_desc: "El Valle del Loira —“Jardín de Francia”— donde antaño se alzaron los castillos de la familia real francesa. Tomar Nantes y Tours significa la conquista del centro-oeste de Francia."
 sav_normandy_coast: "La costa de Normandía"
 sav_normandy_coast_desc: "Tomar Normandía, costa histórica donde antaño desembarcaron los normandos. Ruan, en el corazón de esta rica tierra, es punto clave del norte de Francia y la última barrera antes de París."
 STATIC_MODIFIER_NAME_sav_woolens_of_piedmont_mod: "La industria de la lana del Piamonte"
 STATIC_MODIFIER_DESC_sav_woolens_of_piedmont_mod: "El Piamonte fue una región lanera destacada, cuyas ovejas se mantenían en los pastos alpinos altos. El distrito de Biella, en particular, era conocido desde la Edad Media hasta hoy como una de las mejores fuentes de lana y paño fino de Europa, y la “lana piamontesa” estaba junto a la lana inglesa como marca de máxima calidad."
 STATIC_MODIFIER_NAME_sav_nebbiolo_vineyards_mod: "Los viñedos de Nebbiolo"
 STATIC_MODIFIER_DESC_sav_nebbiolo_vineyards_mod: "De las uvas Nebbiolo, cultivadas en las colinas de Langhe, en el Piamonte, nacen el Barolo, “rey de los vinos”, y el Barbaresco, “vino de la reina”. Los registros de su cultivo se remontan al siglo XIII, y era apreciado hasta en la corte saboyana: orgullo del Piamonte, aún amado en el mundo entero como la cumbre de los vinos italianos."
 STATIC_MODIFIER_NAME_sav_casa_savoia_mod: "La autoridad de la casa de Saboya"
 STATIC_MODIFIER_DESC_sav_casa_savoia_mod: "La casa de Saboya es una de las dinastías más duraderas de Europa, con origen en Humberto Manos Blancas, en el siglo XI. Su supervivencia durante más de setecientos años como “la más antigua dinastía”, que acabó por convertirse en la casa real del Reino de Italia, muestra una resistencia rara en la historia de las casas reales europeas."
 STATIC_MODIFIER_NAME_sav_ordinanza_piedmontese_mod: "La Ordinanza Piemontese"
 STATIC_MODIFIER_DESC_sav_ordinanza_piedmontese_mod: "La “Ordinanza Piemontese”, organizada por el ducado de Saboya en el siglo XV, fue un sistema militar permanente disciplinado, centrado en la infantería de piqueros. Apoyándose en la táctica de los mercenarios suizos, añadiendo sus propios refinamientos, se convirtió en la base del posterior ejército sardo y presagio de los ejércitos que condujeron las guerras de unificación del Risorgimento."
 STATIC_MODIFIER_NAME_sav_university_of_turin_mod: "La influencia de la Universidad de Turín"
 STATIC_MODIFIER_DESC_sav_university_of_turin_mod: "Fundada en 1404, la Universidad de Turín es una de las más antiguas del norte de Italia. Comenzando con tres facultades —derecho, medicina y teología—, produjo más tarde mentes notables, como Cesare Beccaria (reformador del derecho penal) y Lagrange (matemático), y se convirtió en el corazón espiritual del Piamonte ilustrado."
 STATIC_MODIFIER_NAME_sav_corsica_seized_mod: "Córcega tomada"
 STATIC_MODIFIER_DESC_sav_corsica_seized_mod: "Córcega es la llave del Mediterráneo occidental, que Génova gobernó desde 1284. Cuando Génova la vendió a Francia en 1768, Napoleón Bonaparte nació, al año siguiente, “francés”: ironía de la historia. Tomar esta isla garantizaría el dominio del Mar Tirreno occidental."
 STATIC_MODIFIER_NAME_sav_towers_of_sardinia_mod: "Las torres de Cerdeña"
 STATIC_MODIFIER_DESC_sav_towers_of_sardinia_mod: "A lo largo de las costas de Cerdeña se hallan esparcidas las “torri costiere” (torres costeras), construidas desde la Edad Media hasta principios de la era moderna. Este sistema defensivo, erigido para observar incursiones berberiscas, llegó a contar más de un centenar de torres en su apogeo y sirvió de red de alarma, avisando a los habitantes de la isla del peligro."
 STATIC_MODIFIER_NAME_sav_cagliari_development_mod: "Prosperidad de Cagliari"
 STATIC_MODIFIER_DESC_sav_cagliari_development_mod: "Cagliari (Karalis) es una ciudad portuaria fundada por los fenicios e importante centro administrativo de la era romana. Como capital de Cerdeña, en medio del Mediterráneo, se convirtió en nudo comercial con Túnez, España e Italia y permaneció punto clave del comercio del Mediterráneo occidental bajo el dominio aragonés."
 STATIC_MODIFIER_NAME_sav_tyrrhenian_sea_mod: "Señor del Mar Tirreno"
 STATIC_MODIFIER_DESC_sav_tyrrhenian_sea_mod: "El Mar Tirreno es el mar interior del Mediterráneo, cercado por la península itálica, Sicilia, Córcega y Cerdeña: un mar histórico, donde comerciaron los antiguos fenicios, griegos y romanos. Dominar Córcega y Cerdeña permite dominar todo este mar interior y obtener una cabeza de puente para avanzar sobre el Mediterráneo oriental."
 STATIC_MODIFIER_NAME_sav_languedoc_mod: "Dominio del Languedoc"
 STATIC_MODIFIER_DESC_sav_languedoc_mod: "El Languedoc (“tierra de la lengua oc”) designa la región del sur de Francia de lengua occitana. Esta región, con capital en Toulouse, ostentaba cultura, política y religión propias (los cátaros), hasta ser conquistada por la corona francesa en la Cruzada Albigense del siglo XIII. Su rescoldo, junto con Provenza, aún arde en una singular civilización del sur de Francia."
 STATIC_MODIFIER_NAME_sav_gascony_mod: "Gascuña tomada"
 STATIC_MODIFIER_DESC_sav_gascony_mod: "Gascuña es una región del suroeste de Francia de origen vasco, conocida por el atlántico Burdeos vinícola, el puerto de Bayona y el armañac. Estrechamente ligada a Inglaterra desde el matrimonio de Leonor de Aquitania, fue también el último gran campo de batalla de la Guerra de los Cien Años."
 STATIC_MODIFIER_NAME_sav_lyon_gateway_mod: "La puerta de Lyon"
 STATIC_MODIFIER_DESC_sav_lyon_gateway_mod: "Lyon (Lugdunum) fue fundada como capital de la provincia romana de la Galia y es una encrucijada de comunicaciones. En la Edad Media, albergaba las mayores ferias regulares de Francia después de las de Champaña, donde se reunían mercaderes de Italia, Flandes y Alemania. Su posición en la confluencia del Ródano y el Saona le garantizó el rango de ciudad mercantil por necesidad geográfica."
 STATIC_MODIFIER_NAME_sav_loire_valley_mod: "El Valle del Loira"
 STATIC_MODIFIER_DESC_sav_loire_valley_mod: "En el valle del Loira, el “Jardín de Francia”, se alzan castillos renacentistas, como Chambord, Chenonceau y Amboise. Los reyes franceses de los siglos XV-XVI amaban esta región por su clima más benigno que el de París, su rico abastecimiento y la seguridad de la defensa. Dominar esta bella tierra significa mantener el centro de la cultura francesa."
 STATIC_MODIFIER_NAME_sav_normandy_coast_mod: "La costa de Normandía"
 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "Normandía es la tierra que los vikingos (normandos) recibieron del rey francés en 911. La invasión de Inglaterra por Guillermo el Conquistador, en 1066, el mayor campo de batalla de la Guerra de los Cien Años, el desembarco de Normandía en 1944: esta tierra fue siempre un punto de inflexión de la historia. En Ruan fue también ejecutada Juana de Arco."
 sav_events.3.t: "Formación de Cerdeña-Piamonte"
 sav_events.3.d: "Habiendo tomado casi toda Cerdeña, la casa de Saboya ha decidido asumir formalmente el título de “Rey de Cerdeña”. En la historia (1720), Saboya obtuvo Cerdeña en la guerra de sucesión española y fundó el “Reino de Cerdeña”. Este reino doble, Cerdeña-Piamonte, se convertirá en la cuna de la unificación de Italia. Al unir el Piamonte continental con la isla de Cerdeña, este reino surgirá como potencia significativa del norte de Italia."
 sav_events.3.a: "¡Convertirse, como rey de Cerdeña, en abanderado de la unificación de Italia!"
 sav_franchises: "Las franquicias saboyanas"
 sav_franchises_desc: "En el Piamonte medieval, la casa de Saboya concedió a varias ciudades derechos urbanos, conocidos como “franquicias”. Garantizando libertad de movimiento, liberación de los campesinos y derechos comerciales ampliados a los mercaderes, este sistema anima la rivalidad urbana y el crecimiento del Piamonte. Completar esta misión permite conceder a las provincias el derecho urbano “Franquicias saboyanas”."
 sav_franchises_unlock_tt: "El privilegio urbano “Franquicias” pasa a estar disponible."
 sav_patria_legis: "Saboya-Valle de Aosta"
 sav_patria_legis_desc: "La “Patria Legis” combina las prácticas de autogobierno heredadas del Valle de Aosta con los ideales de gobierno de la casa de Saboya en una estructura jurídica racional, que refleja el espíritu del Renacimiento. Completar esta misión permite conceder a las provincias el derecho urbano “Saboya-Valle de Aosta”."
 sav_patria_legis_unlock_tt: "El privilegio urbano “Patria Legis” pasa a estar disponible."
 franchises: "Franquicias"
 franchises_desc: "Derechos urbanos, establecidos por la casa de Saboya, que garantizan libertad de movimiento a la población, liberación de los campesinos y derechos comerciales ampliados a los mercaderes."
 patria_legis: "Patria Legis"
 patria_legis_desc: "Derechos urbanos que combinan las tradiciones del Valle de Aosta con los principios jurídicos saboyanos, trayendo prosperidad urbana, movilidad social y eficiencia productiva."
