l_spanish:
 tre_trebizond_mission_pack: "El renacimiento de la dinastía Comneno y la restauración de Bizancio"
 tre_trebizond_mission_pack_DESCRIPTION:0 "En 1337, el Imperio de Trebisonda sobrevive como pequeño Estado en el litoral póntico, heredero de la dinastía Comneno. Toma el comercio del Mar Negro, reconquista Anatolia, libera Constantinopla y restaura el Imperio bizantino."
 tre_trebizond_mission_pack_CRITERIA_DESCRIPTION:0 "Conquista Anatolia, recupera Constantinopla, subyuga los Balcanes y restaura el Imperio bizantino."
 tre_trebizond_mission_pack_BUTTON_TOOLTIP:0 "Restaura el Imperio de los Comnenos."
 tre_trebizond_mission_pack_BUTTON_DETAILS:0 "¡Desde las orillas del Ponto, hereda el legado bizantino y marcha triunfal hacia Constantinopla!"
 tre_komnenian_legacy: "El legado de los Comnenos"
 tre_komnenian_legacy_desc: "El legado de la dinastía Comneno alimenta la ambición de Trebisonda de restaurar la grandeza bizantina."
 tre_pontus_coast: "Asegura el litoral póntico"
 tre_pontus_coast_desc: "Asegura el litoral póntico como base del dominio del comercio del Mar Negro."
 tre_black_sea_trade: "Comercio del Mar Negro"
 tre_black_sea_trade_desc: "Arrebata el comercio del Mar Negro a los competidores genoveses y venecianos."
 tre_dev_trebizond: "Desarrolla Trebisonda"
 tre_dev_trebizond_desc: "Desarrolla Trebisonda hasta un próspero nudo digno del Imperio de los Comnenos."
 tre_orthodox_stronghold: "Baluarte ortodoxo"
 tre_orthodox_stronghold_desc: "Fortalece los monasterios ortodoxos para afirmar a Trebisonda como heredera espiritual de Bizancio."
 tre_armenia_campaign: "Subyuga Armenia"
 tre_armenia_campaign_desc: "Subyuga Armenia para asegurar la frontera oriental y obtener guerreros de montaña."
 tre_cappadocia: "Conquista de Capadocia"
 tre_cappadocia_desc: "Conquista el corazón monástico-rupestre de Capadocia y avanza hacia Anatolia central."
 tre_central_anatolia: "Recupera Anatolia central"
 tre_central_anatolia_desc: "Recupera Anatolia central, incluida Ankara, del dominio turco."
 tre_west_anatolia: "Marcha sobre Anatolia occidental"
 tre_west_anatolia_desc: "Marcha sobre la rica costa egea de Anatolia occidental."
 tre_reclaim_nicaea: "Recupera Nicea"
 tre_reclaim_nicaea_desc: "Recupera Nicea y Bursa, la capital bizantina en el exilio, y acércate a Constantinopla."
 tre_anatolian_emperor: "Emperador de Anatolia"
 tre_anatolian_emperor_desc: "Une toda Anatolia bajo el estandarte de los Comnenos."
 tre_thrace_campaign: "Toma Tracia"
 tre_thrace_campaign_desc: "Toma Tracia para cercar Constantinopla y prepararte para su liberación."
 tre_reclaim_constantinople: "Recupera Constantinopla"
 tre_reclaim_constantinople_desc: "Libera Constantinopla y restaura la cruz ortodoxa sobre Santa Sofía."
 tre_northern_greece: "Recupera el norte de Grecia"
 tre_northern_greece_desc: "Recupera el norte de Grecia, incluida Salónica, la segunda ciudad de Bizancio."
 tre_bulgaria: "Conquista de Bulgaria"
 tre_bulgaria_desc: "Conquista Bulgaria para consolidar el dominio balcánico."
 tre_morea: "Recupera la Moreia"
 tre_morea_desc: "Recupera la Moreia y Atenas, el corazón de la antigua civilización griega."
 tre_aegean_islands: "Las islas egeas"
 tre_aegean_islands_desc: "Recupera las islas egeas de la ocupación de los cruzados latinos."
 tre_macedonian_campaign: "Conquista de Macedonia"
 tre_macedonian_campaign_desc: "Conquista Macedonia, lugar de nacimiento de Alejandro Magno."
 tre_silk_trade: "El comercio de la seda"
 tre_silk_trade_desc: "Controla el comercio de la Ruta de la Seda por Trebisonda para dominar el comercio Este-Oeste."
 tre_komnenian_army: "El ejército comneno"
 tre_komnenian_army_desc: "Construye el ejército comneno: una mezcla de mercenarios y fuerzas provinciales."
 tre_greek_culture: "Renacimiento cultural griego"
 tre_greek_culture_desc: "Revive el saber y las artes bizantinas para hacer de Trebisonda un faro cultural."
 tre_cilicia_campaign: "Subyuga Cilicia"
 tre_cilicia_campaign_desc: "Subyuga Cilicia para asegurar acceso al Mediterráneo."
 tre_dev_constantinople: "Reconstruye Constantinopla"
 tre_dev_constantinople_desc: "Reconstruye Constantinopla como magnífica capital del Imperio bizantino restaurado."
 tre_orthodox_patriarch: "Patriarcado ortodoxo"
 tre_orthodox_patriarch_desc: "Establece el Patriarcado de Constantinopla, haciendo de Trebisonda guardiana de la ortodoxia."
 tre_georgia_campaign: "Expedición a Georgia"
 tre_georgia_campaign_desc: "Conduce una expedición a Georgia para asegurar el flanco caucásico."
 tre_komnenian_navy: "La armada comnena"
 tre_komnenian_navy_desc: "Construye una poderosa armada para dominar el Mar Negro y el Egeo."
 tre_antioch_crusade: "Recupera Antioquía"
 tre_antioch_crusade_desc: "Recupera Antioquía, antaño joya de la Siria bizantina."
 tre_greek_population: "Crecimiento de la población griega"
 tre_greek_population_desc: "Haz crecer la población griega como columna vertebral cultural del imperio restaurado."
 tre_restore_byzantium: "Restaura Bizancio"
 tre_restore_byzantium_desc: "Proclama la restauración del Imperio bizantino bajo el liderazgo de los Comnenos."
 tre_komnenos_dynasty: "La gloria de la dinastía Comneno"
 tre_komnenos_dynasty_desc: "Reina como eterno emperador comneno: sucesor de la Roma de Oriente, guardián de la ortodoxia."
 tre_events.20.t: "Constantinopla recuperada: Bizancio vive"
 tre_events.20.d: "¡Constantinopla en manos de los Comnenos! La cruz ortodoxa ondea de nuevo sobre Santa Sofía. El mundo tiembla: Bizancio se ha alzado."
 tre_events.20.a: "¡Viva Constantinopla, en la gloria de Dios!"
 tre_events.60.t: "Proclamación de la restauración bizantina"
 tre_events.60.d: "Anatolia, los Balcanes y Constantinopla unidos: la dinastía Comneno proclama la restauración del Imperio bizantino. Alzado de la tragedia de 1204."
 tre_events.60.a: "¡Viva Bizancio! ¡Viva la dinastía Comneno!"
 tre_events.99.t: "La gloria eterna de la dinastía Comneno"
 tre_events.99.d: "“Emperador comneno, sucesor de la Roma de Oriente y guardián de la ortodoxia”: este título resuena por todo el mundo mediterráneo. El pequeño imperio que comenzó en Trebisonda reina como sucesor del mayor imperio de la historia."
 tre_events.99.a: "¡Viva la dinastía Comneno! ¡Viva la gloria eterna!"
 STATIC_MODIFIER_NAME_tre_komnenian_mod: "Los Comnenos"
 STATIC_MODIFIER_DESC_tre_komnenian_mod: "Alzando la vista hacia el estandarte púrpura de los Comnenos, todos en la corte imaginan el día en que la gloria de Bizancio sea recuperada en manos de Trebisonda."
 STATIC_MODIFIER_NAME_tre_pontus_mod: "El Ponto"
 STATIC_MODIFIER_DESC_tre_pontus_mod: "El litoral póntico asegurado como base del dominio del comercio del Mar Negro."
 STATIC_MODIFIER_NAME_tre_black_sea_mod: "El Mar Negro"
 STATIC_MODIFIER_DESC_tre_black_sea_mod: "Ningún barco mercante del Mar Negro puede llevar las sedas de Oriente sin echar anclas en el puerto de Trebisonda."
 STATIC_MODIFIER_NAME_tre_trebizond_city_mod: "La ciudad de Trebisonda"
 STATIC_MODIFIER_DESC_tre_trebizond_city_mod: "Trebisonda desarrollada como próspero nudo comercial del Imperio de los Comnenos."
 STATIC_MODIFIER_NAME_tre_orthodox_mod: "Ortodoxia"
 STATIC_MODIFIER_DESC_tre_orthodox_mod: "Monasterios ortodoxos fortalecidos, afirmando a Trebisonda como heredera espiritual de Bizancio."
 STATIC_MODIFIER_NAME_tre_armenia_mod: "Armenia"
 STATIC_MODIFIER_DESC_tre_armenia_mod: "Armenia subyugada, asegurando la frontera oriental y obteniendo guerreros de montaña."
 STATIC_MODIFIER_NAME_tre_cappadocia_mod: "Capadocia"
 STATIC_MODIFIER_DESC_tre_cappadocia_mod: "El corazón monástico-rupestre de Capadocia cae bajo control de los Comnenos."
 STATIC_MODIFIER_NAME_tre_anatolia_mod: "Anatolia"
 STATIC_MODIFIER_DESC_tre_anatolia_mod: "Anatolia central recuperada: el camino a Constantinopla abierto."
 STATIC_MODIFIER_NAME_tre_west_anatolia_mod: "Anatolia occidental"
 STATIC_MODIFIER_DESC_tre_west_anatolia_mod: "La rica costa egea de Anatolia occidental asegurada para el Imperio de los Comnenos."
 STATIC_MODIFIER_NAME_tre_nicaea_mod: "Nicea"
 STATIC_MODIFIER_DESC_tre_nicaea_mod: "Nicea recuperada: la capital bizantina en el exilio vuelve al gobierno ortodoxo."
 STATIC_MODIFIER_NAME_tre_thrace_mod: "Tracia"
 STATIC_MODIFIER_DESC_tre_thrace_mod: "Tracia tomada, cercando Constantinopla en preparación para su liberación."
 STATIC_MODIFIER_NAME_tre_greece_mod: "Grecia"
 STATIC_MODIFIER_DESC_tre_greece_mod: "Norte de Grecia, incluida Salónica, asegurado: la segunda ciudad de Bizancio restaurada."
 STATIC_MODIFIER_NAME_tre_bulgaria_mod: "Bulgaria"
 STATIC_MODIFIER_DESC_tre_bulgaria_mod: "Bulgaria conquistada, consolidando el dominio balcánico."
 STATIC_MODIFIER_NAME_tre_morea_mod: "Moreia"
 STATIC_MODIFIER_DESC_tre_morea_mod: "La Moreia y Atenas recuperadas: el corazón de la antigua civilización griega restaurado."
 STATIC_MODIFIER_NAME_tre_aegean_mod: "Mar Egeo"
 STATIC_MODIFIER_DESC_tre_aegean_mod: "Islas egeas recuperadas de la ocupación de los cruzados latinos."
 STATIC_MODIFIER_NAME_tre_macedonia_mod: "Macedonia"
 STATIC_MODIFIER_DESC_tre_macedonia_mod: "Macedonia, lugar de nacimiento de Alejandro, cae bajo el gobierno de los Comnenos."
 STATIC_MODIFIER_NAME_tre_silk_mod: "Seda"
 STATIC_MODIFIER_DESC_tre_silk_mod: "El comercio de la Ruta de la Seda por Trebisonda domina el comercio Este-Oeste."
 STATIC_MODIFIER_NAME_tre_army_mod: "Ejército"
 STATIC_MODIFIER_DESC_tre_army_mod: "Mercenarios y levas provinciales se adiestran bajo el mismo estandarte, y el ejército de los Comnenos ha encontrado nueva fuerza."
 STATIC_MODIFIER_NAME_tre_culture_mod: "Cultura"
 STATIC_MODIFIER_DESC_tre_culture_mod: "El saber y las artes bizantinas revividos, haciendo de Trebisonda un faro cultural."
 STATIC_MODIFIER_NAME_tre_cilicia_mod: "Cilicia"
 STATIC_MODIFIER_DESC_tre_cilicia_mod: "Cilicia subyugada, asegurando acceso al Mediterráneo."
 STATIC_MODIFIER_NAME_tre_cpole_city_mod: "La ciudad de Constantinopla"
 STATIC_MODIFIER_DESC_tre_cpole_city_mod: "Constantinopla reconstruida como magnífica capital del Imperio bizantino restaurado."
 STATIC_MODIFIER_NAME_tre_patriarch_mod: "Patriarca"
 STATIC_MODIFIER_DESC_tre_patriarch_mod: "Patriarcado de Constantinopla establecido bajo la tutela de los Comnenos."
 STATIC_MODIFIER_NAME_tre_georgia_mod: "Georgia"
 STATIC_MODIFIER_DESC_tre_georgia_mod: "Georgia asegurada, estabilizando el flanco caucásico del imperio."
 STATIC_MODIFIER_NAME_tre_navy_mod: "Armada"
 STATIC_MODIFIER_DESC_tre_navy_mod: "Una poderosa armada comnena domina el Mar Negro y el Egeo."
 STATIC_MODIFIER_NAME_tre_antioch_mod: "Antioquía"
 STATIC_MODIFIER_DESC_tre_antioch_mod: "Antioquía, joya de la Siria bizantina, recuperada."
 STATIC_MODIFIER_NAME_tre_greek_pop_mod: "Población griega"
 STATIC_MODIFIER_DESC_tre_greek_pop_mod: "Oraciones griegas y pregones de mercado llenan las calles de cada ciudad del imperio restaurado."
 STATIC_MODIFIER_NAME_tre_restore_byzantium_mod: "Restauración de Bizancio"
 STATIC_MODIFIER_DESC_tre_restore_byzantium_mod: "El Imperio bizantino formalmente restaurado bajo el liderazgo de los Comnenos."
 STATIC_MODIFIER_NAME_tre_komnenos_final_mod: "Final de los Comnenos"
 STATIC_MODIFIER_DESC_tre_komnenos_final_mod: "El Imperio de los Comnenos permanece eterno: señor del Mediterráneo oriental."
 tre_rize_tea: "Cultivo de té en Rize"
 tre_rize_tea_desc: "Rize: bendecida con un clima cálido y húmedo entre los Montes Pónticos y el Mar Negro, esta región se convertirá en la mayor zona productora de té de Turquía. A partir de 1737, transforma las colinas de Rize en plantaciones de té, usando técnicas de cultivo que llegaron por Georgia. Trae la noble bebida oriental al Imperio de los Comnenos."
 STATIC_MODIFIER_NAME_tre_rize_tea_mod: "Plantaciones de té de Rize"
 STATIC_MODIFIER_DESC_tre_rize_tea_mod: "Las colinas de Rize transformadas en plantaciones de té, estableciendo la base de la producción de té del imperio."
 STATIC_MODIFIER_NAME_tre_cpole_loc_mod: "Constantinopla restaurada"
 STATIC_MODIFIER_DESC_tre_cpole_loc_mod: "Constantinopla comienza a funcionar como centro administrativo y gubernamental del imperio."
