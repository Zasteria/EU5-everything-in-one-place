l_spanish:
 brb_brabant_mission_pack: "El legado de la Baja Lotaringia: unir los Países Bajos y absorber Borgoña"
 brb_brabant_mission_pack_DESCRIPTION:0 "El Ducado de Brabante, gobernado por una casa ducal independiente: une los Países Bajos, absorbe al advenedizo Ducado de Borgoña antes de que lo haga la historia y construye una verdadera edad de oro."
 brb_brabant_mission_pack_CRITERIA_DESCRIPTION:0 "Une los Países Bajos, absorbe Borgoña y funda una república para alcanzar una edad de oro."
 brb_brabant_mission_pack_BUTTON_TOOLTIP:0 "De pequeño ducado a gran ducado que gobierna los Países Bajos y Borgoña."
 brb_brabant_mission_pack_BUTTON_DETAILS:0 "“Je Maintiendrai”: ¡invierte la historia y planta el estandarte de Brabante por todos los Países Bajos!"
 brb_ducal_authority: "Establece la autoridad ducal"
 brb_ducal_authority_desc: "Como duque de la línea de Lovaina, haz que tu autoridad alcance todos los rincones del ducado."
 brb_joyous_entry: "La Entrada Gozosa (Blijde Inkomst)"
 brb_joyous_entry_desc: "La “Entrada Gozosa”, la ceremonia en que un nuevo duque cruza las puertas de la ciudad y confirma los privilegios de las ciudades: establece esta tradición y concede a las ciudades sus propios derechos."
 brb_joyous_entry_unlock_tt: "El privilegio urbano “Ciudad de la Entrada Gozosa” pasa a estar disponible."
 brb_develop_antwerp: "Desarrolla Amberes"
 brb_develop_antwerp_desc: "Amberes, la ciudad comercial en la desembocadura del Escalda: desarróllala más y consolida su estatus de nudo del comercio del Mar del Norte."
 brb_unify_brabant: "Une Brabante"
 brb_unify_brabant_desc: "El Ducado de Brabante, dividido entre norte y sur: únelo bajo un solo estandarte."
 brb_flemish_rivalry: "Rivalidad con Flandes"
 brb_flemish_rivalry_desc: "El Condado de Flandes, conocido por su rica industria textil: establece nuestra influencia sobre este viejo rival."
 brb_hainaut_marriage: "Un matrimonio con Henao-Holanda"
 brb_hainaut_marriage_desc: "Henao, Holanda y Zelanda, gobernadas por la casa de Wittelsbach: por matrimonio, por alianza o por rivalidad, asegura una reivindicación a este trono."
 brb_liege_relations: "Relaciones con Lieja"
 brb_liege_relations_desc: "El Principado-Obispado de Lieja, que ostenta vasto poder secular: por rivalidad o por lazos matrimoniales, asegura una reivindicación sobre esta tierra."
 brb_utrecht_bishopric: "El obispado de Utrecht"
 brb_utrecht_bishopric_desc: "El Obispado de Utrecht, que ostenta vasto poder secular: ponlo bajo nuestra influencia como cimiento para unir los Países Bajos."
 brb_burgundian_ambition: "Ambiciones hacia Borgoña"
 brb_burgundian_ambition_desc: "Habiendo dominado las principales tierras de los Países Bajos, vuelve la mirada de la ambición hacia el recién surgido Ducado de Borgoña, en manos de una rama menor de la casa real francesa."
 brb_contest_flanders_inheritance: "Disputa la herencia de Flandes"
 brb_contest_flanders_inheritance_desc: "El matrimonio de Margarita, heredera de Flandes: gana esta disputada unión y toma Flandes para nosotros antes de que pueda hacerlo la casa de Borgoña."
 brb_absorb_burgundy: "Absorbe Borgoña"
 brb_absorb_burgundy_desc: "Anexiona o subyuga el advenedizo Ducado de Borgoña: invierte la marea de la historia y prueba que Brabante, y no Borgoña, es el señor de los Países Bajos."
 brb_valois_brabant: "El Gran Ducado de Brabante"
 brb_valois_brabant_desc: "Habiendo absorbido la herencia borgoñona, Brabante ya no es un mero ducado: álzate como la gran potencia que preside los Países Bajos."
 brb_je_maintiendrai: "Je Maintiendrai"
 brb_je_maintiendrai_desc: "Brabante, Flandes, Holanda y la herencia borgoñona absorbida: como señor de las principales tierras de los Países Bajos, mantén este dominio."
 brb_hansa_relations: "Relaciones con la Hansa"
 brb_hansa_relations_desc: "La Liga Hanseática, que domina el comercio del Báltico: reconstruye las relaciones con ella desde una posición de igualdad."
 brb_bulk_trade: "Apoya el comercio a granel"
 brb_bulk_trade_desc: "El comercio a granel de grano y madera: aumenta la presencia de nuestra flota mercante en el Báltico."
 brb_baltic_supremacy: "Supremacía en el comercio báltico"
 brb_baltic_supremacy_desc: "El señor de las rutas comerciales del norte es una verdadera potencia comercial: establece la supremacía en el comercio báltico."
 brb_land_commercial_empire: "Un imperio comercial terrestre"
 brb_land_commercial_empire_desc: "No solo el mar: domina los grandes centros de mercado del interior y reivindica también el dominio del comercio terrestre."
 brb_secure_grain: "Asegura el grano del Báltico"
 brb_secure_grain_desc: "Los Países Bajos han dependido desde hace mucho del grano báltico: toma este suministro en nuestras propias manos."
 brb_reformation_choice: "La elección de la Reforma"
 brb_reformation_choice_desc: "Las enseñanzas de Lutero sacuden los Países Bajos: de pie en esta encrucijada de la fe, ¿qué camino elegiremos?"
 brb_religious_settlement: "Un arreglo religioso"
 brb_religious_settlement_desc: "Más de un siglo después de la Reforma, ahora que la fe del Estado domina sobre la inmensa mayoría de la población, trae una reconciliación estable entre las fes en conflicto."
 brb_spanish_fury: "La Furia Española"
 brb_spanish_fury_desc: "La opresión de los Habsburgo y los pesados impuestos: la ira del pueblo contra la “Furia Española” ya no puede contenerse."
 brb_sea_beggars: "Los Mendigos del Mar"
 brb_sea_beggars_desc: "Corsarios que se llaman a sí mismos “Mendigos del Mar”: sus hazañas abren brechas en el dominio español de los mares."
 brb_eighty_years_war: "La Guerra de los Ochenta Años"
 brb_eighty_years_war_desc: "Una larga lucha por la independencia: soporta esta Guerra de los Ochenta Años y gana nuestra libertad."
 brb_united_netherlands: "Los Países Bajos Unidos"
 brb_united_netherlands_desc: "Una federación de siete provincias: establece aquí una confederación principesca bajo el Gran Duque de Brabante, que continúe las tradiciones de la nobleza y de las ciudades por igual."
 brb_east_india_charter: "La Carta de las Indias Orientales"
 brb_east_india_charter_desc: "Concede la carta para fundar una Compañía de las Indias Orientales, con la mira puesta en el monopolio del comercio asiático."
 brb_voc_trade_empire: "El imperio comercial de la VOC"
 brb_voc_trade_empire_desc: "La “Compañía Unida de las Indias Orientales” (VOC): la primera sociedad por acciones del mundo extiende su red comercial desde las Islas de las Especias por toda Asia."
 brb_west_india_company: "La Compañía de las Indias Occidentales"
 brb_west_india_company_desc: "El comercio que une el Nuevo Mundo y África: funda la Compañía de las Indias Occidentales y comparte la riqueza del Atlántico."
 brb_golden_age: "La Edad de Oro"
 brb_golden_age_desc: "Rembrandt, Vermeer y un comercio floreciente: alcanza el cenit de la “Edad de Oro neerlandesa”."
 brb_amsterdam_exchange: "La Bolsa de Ámsterdam"
 brb_amsterdam_exchange_desc: "La primera bolsa de valores del mundo: haz de Ámsterdam el centro de las finanzas europeas."
 brb_form_netherlands: "El Gran Ducado de los Países Bajos concluido"
 brb_form_netherlands_desc: "El largo camino, iniciado con el legado de la Baja Lotaringia y la absorción de Borgoña, a través de la independencia y de una edad de oro, llega aquí a su conclusión como un gran ducado que conserva las profundas tradiciones de la nobleza y de las ciudades."
 brb_wool_staple_calais: "El Staple de la lana de Calais"
 brb_wool_staple_calais_desc: "La lana inglesa, savia de la industria textil flamenca: reanima el comercio mediante el staple de la lana en Calais."
 brb_anglo_dutch_alliance: "La alianza anglo-neerlandesa"
 brb_anglo_dutch_alliance_desc: "Inglaterra, nuestra vecina al otro lado del Canal: en medio del caos de la Guerra de los Cien Años, consolida una relación firme con esta nación, ya sea por alianza o por rivalidad."
 brb_english_channel_trade: "Dominio del comercio del Canal"
 brb_english_channel_trade_desc: "El Canal que une el Mar del Norte y el Atlántico: establece la supremacía en el comercio a través de este vital estrecho."
 brb_valois_suzerainty_dispute: "Disputa la suzeranía de los Valois"
 brb_valois_suzerainty_dispute_desc: "Nominalmente vasallo de la corona francesa: disputa esta suzeranía y exige una posición de igualdad."
 brb_hundred_years_war_intervention: "Intervención en la Guerra de los Cien Años"
 brb_hundred_years_war_intervention_desc: "La larga guerra que desgarra a Inglaterra y a Francia: aprovecha esta oportunidad para intervenir en beneficio propio."
 brb_somme_towns: "Las ciudades del Somme"
 brb_somme_towns_desc: "Las ricas ciudades de Picardía: trae las tierras a lo largo del Somme a nuestro dominio."
 brb_end_french_vassalage: "Pon fin al vasallaje francés"
 brb_end_french_vassalage_desc: "Corta por completo este vasallaje nominal y establece nuestro estatus de gran ducado verdaderamente independiente."
 brb_events.1.t: "Comienza la Guerra de los Ochenta Años"
 brb_events.1.d: "Por medio de la Unión de Utrecht y las hazañas de los Mendigos del Mar, la larga guerra con España ha comenzado. Esta lucha decidirá nuestra independencia."
 brb_events.1.a: "¡Libertad o muerte!"
 brb_events.2.t: "Ambiciones hacia Borgoña"
 brb_events.2.d: "El advenedizo Ducado de Borgoña: ¿qué camino elegiremos respecto a su destino?"
 brb_events.2.a: "Pagar oro y acogerlos como vasallo"
 brb_events.2.b: "Alzar una reivindicación sobre Dijon y prepararse para tomarla por la fuerza"
 brb_events.2.c: "Observar y esperar, por ahora"
 brb_events.3.t: "Disputa de la herencia de Flandes"
 brb_events.3.d: "La disputa sucesoria por Margarita, heredera de Flandes: ¿cómo aseguraremos esta rica tierra para nosotros?"
 brb_events.3.a: "Pagar oro y acogerlos como vasallo"
 brb_events.3.b: "Alzar una reivindicación sobre Brujas y prepararse para tomarla por la fuerza"
 brb_events.3.c: "Observar y esperar, por ahora"
 brb_events.99.t: "Proclamación del Gran Ducado de los Países Bajos"
 brb_events.99.d: "El pequeño ducado que heredó la Baja Lotaringia y absorbió Borgoña ha renacido, por medio de la independencia y de una edad de oro, como gran ducado bajo la casa de Brabante, que conserva las profundas tradiciones de la nobleza y de las ciudades."
 brb_events.99.a: "¡Gloria al Gran Ducado!"
 STATIC_MODIFIER_NAME_brb_ducal_mod: "Autoridad ducal establecida"
 STATIC_MODIFIER_DESC_brb_ducal_mod: "El estandarte ducal, que ondea sobre Lovaina, proclama la misma autoridad en cada ciudad-castillo del ducado."
 STATIC_MODIFIER_NAME_brb_antwerp_mod: "Amberes asegurada"
 STATIC_MODIFIER_DESC_brb_antwerp_mod: "La ciudad comercial de Amberes florece."
 STATIC_MODIFIER_NAME_brb_unify_brabant_mod: "Brabante unificada"
 STATIC_MODIFIER_DESC_brb_unify_brabant_mod: "Señores de dominios antaño divididos entre norte y sur se arrodillan ahora en la misma corte ducal."
 STATIC_MODIFIER_NAME_brb_flemish_mod: "Rivalidad con Flandes"
 STATIC_MODIFIER_DESC_brb_flemish_mod: "Hasta los tejedores de Gante y Brujas llevan ahora sus negocios con un ojo puesto en los deseos del duque de Brabante."
 STATIC_MODIFIER_NAME_brb_utrecht_mod: "El obispado de Utrecht"
 STATIC_MODIFIER_DESC_brb_utrecht_mod: "Las campanas de la catedral de Utrecht suenan ahora con oraciones que bendicen el reinado del duque de Brabante."
 STATIC_MODIFIER_NAME_brb_absorb_burgundy_mod: "Borgoña absorbida"
 STATIC_MODIFIER_DESC_brb_absorb_burgundy_mod: "Las llaves del tesoro de Dijon cuelgan ahora en la corte de Bruselas."
 STATIC_MODIFIER_NAME_brb_maintiendrai_mod: "Je Maintiendrai"
 STATIC_MODIFIER_DESC_brb_maintiendrai_mod: "“Mantendré”: señores y burgueses de los Países Bajos se reúnen por igual en una sola corte bajo este lema."
 STATIC_MODIFIER_NAME_brb_hansa_mod: "Relaciones con la Hansa"
 STATIC_MODIFIER_DESC_brb_hansa_mod: "Mercaderes hanseáticos de Lübeck toman ahora asiento como iguales en las casas de contabilidad de Amberes."
 STATIC_MODIFIER_NAME_brb_bulk_trade_mod: "Comercio a granel apoyado"
 STATIC_MODIFIER_DESC_brb_bulk_trade_mod: "Barcos cargados de grano y madera envían un flujo constante de encargos a los astilleros de la desembocadura del Escalda."
 STATIC_MODIFIER_NAME_brb_baltic_supremacy_mod: "Supremacía en el comercio báltico"
 STATIC_MODIFIER_DESC_brb_baltic_supremacy_mod: "Por todo el Báltico, las velas de incontables mercantes enarbolan el estandarte del león de Brabante."
 STATIC_MODIFIER_NAME_brb_land_commercial_empire_mod: "Un imperio comercial terrestre"
 STATIC_MODIFIER_DESC_brb_land_commercial_empire_mod: "Carretas de Colonia y París hacen fila en los mercados de Bruselas y Lovaina."
 STATIC_MODIFIER_NAME_brb_grain_mod: "Grano del Báltico asegurado"
 STATIC_MODIFIER_DESC_brb_grain_mod: "Con el grano báltico llenando para siempre los graneros, los soldados marchan a la llamada sin temor al hambre."
 STATIC_MODIFIER_NAME_brb_reformation_mod: "La elección de la Reforma"
 STATIC_MODIFIER_DESC_brb_reformation_mod: "Bajo los púlpitos y en los rincones del mercado, la gente habla en voz baja de la nueva fe."
 STATIC_MODIFIER_NAME_brb_settlement_mod: "Un arreglo religioso"
 STATIC_MODIFIER_DESC_brb_settlement_mod: "Vecinos que antaño lucharon por la fe están ahora hombro con hombro en los mismos puestos de mercado."
 STATIC_MODIFIER_NAME_brb_spanish_fury_mod: "La Furia Española"
 STATIC_MODIFIER_DESC_brb_spanish_fury_mod: "La ira de quienes vieron las cenizas de Amberes sigue dando fuerza a las manos que empuñan la espada."
 STATIC_MODIFIER_NAME_brb_sea_beggars_mod: "Los Mendigos del Mar"
 STATIC_MODIFIER_DESC_brb_sea_beggars_mod: "“Mejor mendigos que hombres del rey”: la bandera de los Mendigos del Mar se ha vuelto pesadilla en los sueños de los marineros españoles."
 STATIC_MODIFIER_NAME_brb_united_netherlands_mod: "Los Países Bajos Unidos"
 STATIC_MODIFIER_DESC_brb_united_netherlands_mod: "Los estandartes de siete provincias están uno al lado del otro en una sola sala de asambleas, y un nuevo Estado toma su primer aliento como confederación principesca."
 STATIC_MODIFIER_NAME_brb_east_india_mod: "La Carta de las Indias Orientales"
 STATIC_MODIFIER_DESC_brb_east_india_mod: "Antes de que se secara el sello de cera de la carta, las flotas rumbo a Oriente comenzaron a hacerse a la mar."
 STATIC_MODIFIER_NAME_brb_voc_mod: "El imperio comercial de la VOC"
 STATIC_MODIFIER_DESC_brb_voc_mod: "Pimienta y clavo, que llegan de las factorías de Batavia, atan incluso a gobernadores coloniales lejanos a la madre patria."
 STATIC_MODIFIER_NAME_brb_wic_mod: "La Compañía de las Indias Occidentales"
 STATIC_MODIFIER_DESC_brb_wic_mod: "Los rumores de azúcar y plata al otro lado del Atlántico llevan a los puertos a emigrantes que sueñan con un nuevo mundo."
 STATIC_MODIFIER_NAME_brb_golden_age_mod: "La Edad de Oro"
 STATIC_MODIFIER_DESC_brb_golden_age_mod: "En las mansiones junto a los canales de los grandes mercaderes cuelgan cuadros de estancias iluminadas por ventanas, impregnadas de la luz de Vermeer."
 STATIC_MODIFIER_NAME_brb_amsterdam_mod: "La Bolsa de Ámsterdam"
 STATIC_MODIFIER_DESC_brb_amsterdam_mod: "Ámsterdam, centro de las finanzas, florece."
 STATIC_MODIFIER_NAME_brb_wool_staple_mod: "El Staple de la lana de Calais"
 STATIC_MODIFIER_DESC_brb_wool_staple_mod: "En el staple de la lana de Calais, se apilan altas las balas de lana inglesa rumbo a los tejedores de Flandes."
 STATIC_MODIFIER_NAME_brb_anglo_treaty_mod: "La alianza anglo-neerlandesa"
 STATIC_MODIFIER_DESC_brb_anglo_treaty_mod: "Enviados portadores de promesas de alianza van y vienen una y otra vez entre las cortes de ambas orillas del Canal."
 STATIC_MODIFIER_NAME_brb_channel_trade_mod: "Dominio del comercio del Canal"
 STATIC_MODIFIER_DESC_brb_channel_trade_mod: "En el estrecho que lleva del Mar del Norte al Atlántico, las banderas mercantes de Brabante ondean ahora en hileras."
 STATIC_MODIFIER_NAME_brb_suzerainty_dispute_mod: "Disputa de la suzeranía de los Valois"
 STATIC_MODIFIER_DESC_brb_suzerainty_dispute_mod: "Las puertas de Bruselas rechazaron, sin vergüenza, a los heraldos enviados desde París para convocar a su vasallo."
 STATIC_MODIFIER_NAME_brb_intervention_mod: "Intervención en la Guerra de los Cien Años"
 STATIC_MODIFIER_DESC_brb_intervention_mod: "Los soldados que lucharon en el fango de la Guerra de los Cien Años regresaron habiendo aprendido los modos de guerra tanto de Francia como de Inglaterra."
 STATIC_MODIFIER_NAME_brb_somme_mod: "Las ciudades del Somme"
 STATIC_MODIFIER_DESC_brb_somme_mod: "Al ganar las murallas a lo largo del Somme, el ejército ducal ha plantado un firme punto de apoyo en las llanuras del norte de Francia."
 STATIC_MODIFIER_NAME_brb_end_vassalage_mod: "Fin del vasallaje francés"
 STATIC_MODIFIER_DESC_brb_end_vassalage_mod: "Sobre las puertas de las que se retiraron las armas del rey de Francia, solo ondea ya el estandarte del duque de Brabante."
 STATIC_MODIFIER_NAME_brb_form_netherlands_mod: "El Gran Ducado de los Países Bajos concluido"
 STATIC_MODIFIER_DESC_brb_form_netherlands_mod: "En la corte del gran ducado, donde estandartes nobles y banderas de ciudad ondean lado a lado, señores y burgueses de los Países Bajos celebran por igual el amanecer de una nueva era."
