l_spanish:
 cas_castile_dev_hub: "Desarrollo de las ciudades de la corona"
 cas_castile_dev_hub_desc: "Dirige el desarrollo de las ciudades pertenecientes al dominio de la corona castellana y asegura la base económica del reino."
 cas_granada_dev_hub: "Renacimiento de Granada"
 cas_granada_dev_hub_desc: "Trae nueva prosperidad a las ciudades del extinto Reino de Granada: la propia Granada y Málaga."
 STATIC_MODIFIER_NAME_cas_crown_domains_mod: "Desarrollo de las ciudades de la corona"
 STATIC_MODIFIER_DESC_cas_crown_domains_mod: "Los recaudadores del rey recorren con orgullo los nuevos mercados y murallas erigidos en las ciudades de la corona."
 STATIC_MODIFIER_NAME_cas_granada_dev_mod: "Granada renacida"
 STATIC_MODIFIER_DESC_cas_granada_dev_mod: "Desde las ventanas de la Alhambra, el sonido de las nuevas campanas de las iglesias se extiende por todo el valle."
 cas_castile_mission_pack: "La gloria del Reino de Castilla"
 cas_castile_mission_pack_DESCRIPTION:0 "En 1337, Castilla es un reino poderoso bajo Alfonso XI. La Reconquista está casi completa: solo resta Granada. La caída de Granada, la unión con Aragón, la navegación de Colón, los conquistadores Cortés y Pizarro y el Imperio de Felipe II, en el que el sol nunca se ponía. Recorre la historia de Castilla."
 cas_castile_mission_pack_CRITERIA_DESCRIPTION:0 "Concluye la Reconquista, forma España, construye un imperio colonial y establece el Imperio en el que el sol nunca se pone."
 cas_castile_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para establecer el Imperio en el que el sol nunca se pone."
 cas_castile_mission_pack_BUTTON_DETAILS:0 "¡De la caída de Granada al imperio mundial de Felipe II!"
 cas_sword_of_castile: "La Espada de Castilla"
 cas_sword_of_castile_desc: "Año 1337: Alfonso XI gobierna Castilla con energía. En la batalla del Salado, en 1340, destruyó las fuerzas combinadas de los benimerines y de Granada, sentando la base para expulsar de la Península Ibérica al último poder musulmán. Alza las coronas de Castilla y León y levanta de nuevo la espada de la Reconquista."
 cas_secure_castile: "Desarrollo de Valladolid"
 cas_secure_castile_desc: "Poseyendo por entero tanto Castilla como León, establece la base central de la Reconquista."
 cas_fall_of_granada: "La caída de Granada"
 cas_fall_of_granada_desc: "2 de enero de 1492: el último sultán de Granada, Boabdil, entrega las llaves a Isabel de Castilla en el “Suspiro del Moro”. La Reconquista, que duró 780 años, llega por fin a su fin."
 cas_conquer_navarre: "Conquista Navarra"
 cas_conquer_navarre_desc: "La conquista del Reino de Navarra, en la encrucijada de los Pirineos, establece la frontera con Francia y completa el dominio de la Iberia septentrional."
 cas_subdue_aragon: "Unión con Aragón"
 cas_subdue_aragon_desc: "El matrimonio de Isabel y Fernando (1469) creó la unión personal de Castilla y Aragón. Bajo los “Reyes Católicos”, España cobra forma."
 cas_form_spain: "Formación de España"
 cas_form_spain_desc: "Castilla, habiendo unido la mayor parte de la Península Ibérica, proclama formalmente el “Reino de España”. Nace la mayor potencia de Europa."
 cas_conquer_portugal: "Incorporación de Portugal"
 cas_conquer_portugal_desc: "En 1580, Felipe II heredó el trono portugués: la “Unión Ibérica”. Esto dio a España también el control del imperio colonial de Portugal."
 cas_iberian_union: "La Unión Ibérica"
 cas_iberian_union_desc: "Toda la Península Ibérica pasa al dominio español. Del Atlántico al Océano Índico, las colonias españolas y portuguesas cubren el mundo."
 cas_holy_brotherhood: "La Santa Hermandad"
 cas_holy_brotherhood_desc: "La Santa Hermandad, establecida por la reina Isabel, limita el poder de la nobleza y refuerza la autoridad real como organización de orden público."
 cas_inquisition: "La Inquisición española"
 cas_inquisition_desc: "En 1478, el papa Sixto IV concedió a Isabel y Fernando autoridad para establecer la Inquisición. Los inquisidores, bajo el liderazgo de Torquemada, trabajan para preservar la pureza de la fe."
 cas_expulsion_of_jews: "El Decreto de Expulsión"
 cas_expulsion_of_jews_desc: "El Edicto de la Alhambra, de 1492, proclama la expulsión de España de los judíos que se negaron a convertirse. Esta decisión preserva la pureza católica, pero priva al país de muchos mercaderes y eruditos talentosos."
 cas_catholic_monarchs: "Los Reyes Católicos"
 cas_catholic_monarchs_desc: "El papa Alejandro VI concede a Isabel y Fernando el título de “Reyes Católicos”. España es reconocida como guardiana del mundo católico."
 cas_absolute_crown: "Monarquía absoluta"
 cas_absolute_crown_desc: "Restringir los privilegios de la nobleza y hacer absoluto el poder real: España surge como uno de los primeros Estados absolutistas modernos de Europa."
 cas_cortes: "Las Cortes de Castilla"
 cas_cortes_desc: "Las Cortes (parlamento): la asamblea tradicional de estamentos de Castilla. Equilibrar el poder real y el parlamento establece un sistema de gobierno duradero."
 cas_leyes_de_indias: "Las Leyes de Indias"
 cas_leyes_de_indias_desc: "Las Leyes de Indias, que regulan el trato a los pueblos nativos en las colonias: establecidas en respuesta a los argumentos humanitarios de Bartolomé de las Casas."
 cas_canary_islands: "Las Islas Canarias"
 cas_canary_islands_desc: "Las Islas Canarias, en el Atlántico: punto estratégico en la rivalidad con Portugal. El control de estas islas inicia la expansión atlántica de España."
 cas_atlantic_exploration: "Exploración atlántica"
 cas_atlantic_exploration_desc: "Mientras Portugal avanza hacia el sur a lo largo de la costa africana, España se vuelve hacia el oeste, a través del Atlántico. El sueño de la “ruta occidental a las Indias” está listo para hacerse realidad."
 cas_columbus_voyage: "El viaje de Colón"
 cas_columbus_voyage_desc: "3 de agosto de 1492: Cristóbal Colón zarpa de Palos. Tres navíos —la “Santa María”, la “Pinta” y la “Niña”— surcan el Atlántico y abren las puertas de un nuevo mundo."
 cas_conquer_caribbean: "Conquista el Caribe"
 cas_conquer_caribbean_desc: "Con La Española (Santo Domingo) como base, se establece el dominio español en el Caribe. Azúcar, tabaco y metales preciosos crean un flujo de riqueza hacia España."
 cas_conquer_mexico: "Conquista México"
 cas_conquer_mexico_desc: "1519-1521: Hernán Cortés conquistó la capital azteca, Tenochtitlan, con 500 soldados. Nace el “Virreinato de la Nueva España”."
 cas_conquer_peru: "Conquista el Perú"
 cas_conquer_peru_desc: "Francisco Pizarro derrocó al Imperio inca con 168 hombres: una de las conquistas más asombrosas de la historia. El oro y la plata de los Andes fluyen hacia España."
 cas_silver_of_potosi: "La plata de Potosí"
 cas_silver_of_potosi_desc: "Las minas de plata de Potosí (descubiertas en 1545, a 4000 m de altitud): las mayores de la historia europea. La plata del “Cerro Rico” sustenta las finanzas del Imperio español."
 cas_colonial_empire: "El Imperio colonial"
 cas_colonial_empire_desc: "De México al Perú, del Caribe al litoral sur de Norteamérica: las colonias españolas cubren el mundo. Las hazañas de los conquistadores sientan la base del imperio."
 cas_manila_galleon: "El galeón de Manila"
 cas_manila_galleon_desc: "Tras la fundación de Manila en 1571, el galeón de Manila monopolizó el comercio transoceánico entre Acapulco y Manila: la primera ruta comercial verdaderamente global, que unía la seda y la porcelana asiáticas con la plata americana."
 cas_conquer_naples: "Conquista el Reino de Nápoles"
 cas_conquer_naples_desc: "“El Gran Capitán”, Gonzalo Fernández de Córdoba, derrotó a Francia y tomó Nápoles. Establecida la influencia española en Italia."
 cas_conquer_sicily: "Asegura Sicilia"
 cas_conquer_sicily_desc: "Sicilia, granero del Mediterráneo, ya bajo la corona de Aragón, se incorpora al Imperio español, completando el control de las islas mediterráneas."
 cas_conquer_milan: "Conquista Milán"
 cas_conquer_milan_desc: "Como resultado final de las guerras de Italia, el ducado de Milán pasa al dominio español. Toda la península itálica se convierte en esfera de influencia española."
 cas_mediterranean_mastery: "Dominio del Mediterráneo"
 cas_mediterranean_mastery_desc: "Nápoles, Sicilia, Cerdeña, Milán: el imperio mediterráneo de España está establecido. Por primera vez desde la Roma antigua, una sola potencia gobierna el Mediterráneo."
 cas_battle_of_lepanto: "La batalla de Lepanto"
 cas_battle_of_lepanto_desc: "7 de octubre de 1571: la flota de la Liga Santa, formada por España, Venecia y el papa, destruye la flota otomana. La “Victoria de la Liga Santa”. Establecida la superioridad cristiana en el Mediterráneo."
 cas_secure_ceuta: "Asegura Ceuta"
 cas_secure_ceuta_desc: "Ceuta, frente a la Península Ibérica a través del Estrecho de Gibraltar, es la puerta de África. Controlarla garantiza la entrada occidental del Mediterráneo."
 cas_conquer_oran: "Conquista Orán"
 cas_conquer_oran_desc: "En 1509, el cardenal Cisneros conquistó Orán: el primer paso de la “Reconquista africana”. Comienza el contraataque a las fuerzas musulmanas del norte de África."
 cas_conquer_tunis: "Conquista Túnez"
 cas_conquer_tunis_desc: "En 1535, las fuerzas españolas de Carlos V conquistaron Túnez. El poderío militar de España, que disputa al Imperio otomano el dominio del norte de África, se exhibe al mundo."
 cas_north_africa_dominion: "Dominio del norte de África"
 cas_north_africa_dominion_desc: "De Ceuta a Orán, el litoral mediterráneo del norte de África pasa al dominio español. La piratería musulmana se erradica y el comercio mediterráneo se estabiliza."
 cas_dev_sevilla: "Puerta de las Indias"
 cas_dev_sevilla_desc: "Sevilla, en el Guadalquivir: la antigua ciudad florece como puerta singular al comercio con el Nuevo Mundo. La “Casa de Contratación” hace de ella la mayor ciudad comercial del mundo."
 cas_casa_de_contratacion: "La Casa de Contratación"
 cas_casa_de_contratacion_desc: "Establecida en Sevilla en 1503, la Casa de Contratación administra en exclusiva el comercio colonial español. Todo el comercio con el Nuevo Mundo pasa por ella."
 cas_dev_toledo: "Industria del acero de Toledo"
 cas_dev_toledo_desc: "Toledo: capital histórica de Castilla y ciudad industrial famosa por sus espadas, joyas y sedas. La fama del “acero de Toledo” se extiende por el mundo."
 cas_dev_madrid: "Madrid como capital"
 cas_dev_madrid_desc: "En 1561, Felipe II declaró Madrid capital permanente: un cambio revolucionario para España, donde la corte antes iba de ciudad en ciudad. La población de Madrid crece rápidamente."
 cas_dev_burgos: "La ciudad del Cid"
 cas_dev_burgos_desc: "Burgos, la “ciudad del Cid”: capital histórica de Castilla, que florece con la exportación de lana al norte de Europa."
 cas_trade_network: "La red comercial imperial"
 cas_trade_network_desc: "De Sevilla a Manila, de Amberes al Nuevo Mundo: la red comercial imperial de España abarca todo el globo."
 cas_tercio: "El tercio"
 cas_tercio_desc: "La mayor táctica del siglo XVI: el tercio combina piqueros, arcabuceros y espadachines en una formación de infantería. La “infantería española, la más fuerte del mundo”, comprobada en el campo de batalla."
 cas_military_orders: "Las órdenes militares"
 cas_military_orders_desc: "Las tres órdenes militares —Santiago, Calatrava y Alcántara— ven, en la era de los Reyes Católicos, su patrimonio y poder puestos bajo control real para sostener la fuerza militar."
 cas_grande_armada: "La Gran Armada"
 cas_grande_armada_desc: "En 1588, Felipe II envió una gran flota de 130 navíos, la “Armada”, para conquistar Inglaterra: símbolo del apogeo del poderío naval español."
 cas_conquistadors: "Los conquistadores"
 cas_conquistadors_desc: "Cortés, Pizarro, Balboa, de Soto: los nombres de los conquistadores grabados en la historia. Conquistando vastos imperios con pocos soldados, mostraron al mundo la superioridad de la tecnología militar española."
 cas_salamanca_university: "La Universidad de Salamanca"
 cas_salamanca_university_desc: "Fundada en 1218, la Universidad de Salamanca es una de las más antiguas de Europa. Como la mejor institución de teología, derecho y medicina, forma funcionarios, clérigos y eruditos del Imperio español."
 cas_siglo_de_oro: "El Siglo de Oro"
 cas_siglo_de_oro_desc: "Cervantes, Lope de Vega, Velázquez, El Greco: florece la edad de oro cultural española de los siglos XVI-XVII. España lidera Europa en literatura, teatro y pintura."
 cas_escorial: "El Escorial"
 cas_escorial_desc: "El palacio-monasterio de El Escorial, cuya construcción ordenó Felipe II en 1563: reuniendo palacio, monasterio y mausoleo, esta estructura monumental simboliza el apogeo del Imperio español."
 cas_dev_granada_city: "La perla de España"
 cas_dev_granada_city_desc: "Granada, hogar del palacio de la Alhambra: ciudad en la que respira la herencia cultural musulmana. Desarrolla esta “perla de España” como centro cultural y económico del sur."
 cas_dev_cordoba: "La gloria del cuero de Córdoba"
 cas_dev_cordoba_desc: "Conocida por su Mezquita-Catedral, Córdoba fue antaño la capital del califato omeya y la mayor ciudad del mundo. Aprovecha esta herencia para desarrollarla como centro de cultura y saber."
 cas_inherit_flanders: "Hereda Flandes"
 cas_inherit_flanders_desc: "Flandes fue incorporada a España como parte de la herencia borgoñona. Las ricas ciudades textiles de Amberes, Brujas y Gante sostienen las finanzas del Imperio español."
 cas_revolt_of_flanders: "Pacifica Flandes"
 cas_revolt_of_flanders_desc: "Suprime la resistencia flamenca e incorpora esta próspera región como parte permanente del Imperio español."
 cas_greatest_power: "Los cimientos del imperio que nunca duerme"
 cas_greatest_power_desc: "El imperio colonial, el tercio y la Armada: tres pilares completados, y España ha alcanzado una prosperidad sin precedentes. Ha llegado el momento de dar el último paso hacia el Imperio en el que el sol nunca se pone."
 cas_empire_of_the_sun: "El Imperio en el que el sol nunca se pone"
 cas_empire_of_the_sun_desc: "“En mi Imperio nunca se pone el sol”: las palabras de Carlos V se hacen realidad. De España a Nápoles, de Flandes al Nuevo Mundo, de Manila al Caribe: la bandera española ondea en todos los rincones de la tierra."
 cas_battle_rio_salado: "Victoria en el Salado"
 cas_battle_rio_salado_desc: "En la batalla del Salado, en 1340, Alfonso XI aplastó a las fuerzas combinadas de los benimerines y de Granada: se abre el telón del último acto de la Reconquista."
 cas_dev_leon_city: "La gloria del antiguo Reino de León"
 cas_dev_leon_city_desc: "León, antigua capital del Reino de León, que un día lideró la Reconquista: desarróllala apoyándote en su historia y tradición."
 cas_church_reform: "Reforma de la Iglesia"
 cas_church_reform_desc: "La reforma eclesiástica bajo el liderazgo del cardenal Cisneros: restaurar la disciplina monástica, mejorar la educación del clero y erradicar la corrupción hace de la Iglesia católica de España la más fuerte autoridad espiritual de Europa."
 cas_counter_reformation: "La Contrarreforma"
 cas_counter_reformation_desc: "La Compañía de Jesús, fundada por Ignacio de Loyola: la Contrarreforma, liderada por España, se opone a la amenaza protestante. El Concilio de Trento reafirma la doctrina católica."
 cas_conquer_cuba: "Conquista Cuba"
 cas_conquer_cuba_desc: "En 1511, Diego Velázquez conquistó Cuba. La Habana se desarrolla como nudo comercial caribeño y se convierte en puerto clave en las rutas hacia el Nuevo Mundo."
 cas_conquer_florida: "Explora Florida"
 cas_conquer_florida_desc: "Juan Ponce de León descubrió “La Florida” en 1513: persiguiendo la leyenda de la “Fuente de la Juventud”, comienza la exploración de Norteamérica."
 cas_conquer_philippines: "Conquista Filipinas"
 cas_conquer_philippines_desc: "En 1565, Miguel López de Legazpi conquistó las Islas Filipinas y fundó Manila. Concluida la expansión asiática de España, nace el comercio transoceánico del galeón de Manila."
 cas_gold_fleets: "Las flotas de oro y plata"
 cas_gold_fleets_desc: "La plata de Potosí y el oro de los incas: la anual “Flota de Indias”, rumbo a España, crea el mayor flujo de riqueza del mundo."
 cas_sardinia: "Asegura Cerdeña"
 cas_sardinia_desc: "Cerdeña, ya bajo la corona de Aragón, se incorpora al Imperio español, completando el control de las islas del Mediterráneo occidental."
 cas_conquer_tunis_italy: "Establece el dominio italiano"
 cas_conquer_tunis_italy_desc: "Nápoles, Sicilia, Cerdeña, Milán: las principales regiones de la Península Itálica pasan al dominio español, sumando la riqueza del Renacimiento a la prosperidad del Imperio español."
 cas_garrison_system: "Red defensiva de guarniciones"
 cas_garrison_system_desc: "Una red defensiva de guarniciones que protege el vasto Imperio español: los tercios en Flandes, las fortalezas en Nápoles y los presidios en el norte de África guardan las fronteras del imperio."
 cas_dev_cadiz: "El antiguo puerto fenicio"
 cas_dev_cadiz_desc: "La antigua ciudad fenicia de Cádiz se alza en un puerto natural en una península atlántica. Está destinada a sustituir a Sevilla como puerta del comercio con las Indias."
 cas_dev_malaga: "Desarrolla Málaga"
 cas_dev_malaga_desc: "Málaga, en el litoral mediterráneo: ciudad mercantil conocida por la seda, el vino y las pasas. Se desarrolla rápidamente tras la conquista de Granada."
 cas_dev_valencia: "La ciudad del sol"
 cas_dev_valencia_desc: "Valencia, la “ciudad del sol”, es un nudo comercial mediterráneo que produce seda, azúcar y arroz. El desarrollo de la principal ciudad de la corona de Aragón trae prosperidad al litoral este de España."
 cas_dev_zaragoza: "La capital de Aragón"
 cas_dev_zaragoza_desc: "Zaragoza, capital del Reino de Aragón, es un nudo de transporte clave en el Ebro. Su desarrollo anima el comercio interno ibérico."
 cas_dev_barcelona: "La reina del Mediterráneo"
 cas_dev_barcelona_desc: "Barcelona, centro del comercio mediterráneo: desarrolla la capital catalana, la mayor ciudad comercial de Aragón, como nudo comercial mediterráneo del Imperio español."
 cas_dev_segovia: "El acueducto de Segovia"
 cas_dev_segovia_desc: "Segovia, famosa por su acueducto y su alcázar real, se desarrolla como símbolo del poder real de Castilla."
 cas_west_africa_trade: "Comercio con el África occidental"
 cas_west_africa_trade_desc: "Usando las Islas Canarias como cabeza de puente, España entra en el comercio con el África occidental, disputando a Portugal las rutas de marfil, oro y, finalmente, de la trata de esclavos."
 cas_council_of_trent: "El Concilio de Trento"
 cas_council_of_trent_desc: "El Concilio de Trento (1545-1563): liderado por España, reafirma la doctrina católica y define los rumbos de la Contrarreforma. Los jesuitas lideran el contraataque al protestantismo."
 cas_events.20.t: "La caída de Granada: fin de la Reconquista"
 cas_events.20.d: "2 de enero de 1492: se abren las puertas de la Alhambra, y el último sultán de Granada, Muhammad XII (Boabdil), entrega las llaves a Isabel y Fernando. La Reconquista, que duró 780 años, llega por fin a su fin. “Llora ahora como mujer lo que no supiste defender como hombre”: las palabras de la madre de Boabdil permanecen en la historia."
 cas_events.20.a: "¡Gloria a España! ¡Reconquista concluida! ¡Gloria a Dios y a la Virgen María!"
 cas_events.30.t: "Los Reyes Católicos: unión con Aragón"
 cas_events.30.d: "Décadas después del matrimonio de Isabel y Fernando ha llegado la hora de la unión de Castilla y Aragón. El papa Alejandro VI les concede el título de “Reyes Católicos”, y la formación de España como nación se hace realidad."
 cas_events.30.a: "¡Gloria a los Reyes Católicos! ¡España se une en una sola fe!"
 cas_events.50.t: "El viaje de Colón: descubrimiento del Nuevo Mundo"
 cas_events.50.d: "12 de octubre de 1492: Cristóbal Colón desembarca en la isla de Guanahaní, en las Bahamas. Se revela la existencia de un Nuevo Mundo, desconocido para los europeos. El descubrimiento de Colón, que creía haber llegado a las “Indias (Asia)”, traerá a España riqueza incalculable."
 cas_events.50.a: "¡Bendición de Dios sobre el Nuevo Mundo! ¡La bandera de España hasta la lejana costa del Atlántico!"
 cas_events.99.t: "El Imperio en el que el sol nunca se pone"
 cas_events.99.d: "“En mi Imperio nunca se pone el sol”: las palabras de Carlos V se hacen realidad. De España a Nápoles, de Flandes al Nuevo Mundo, de Filipinas al Caribe, la bandera española ondea en todos los rincones del mundo. En el reinado de Felipe II, el Imperio español se completa como el primer “imperio mundial” de la humanidad."
 cas_events.99.a: "¡Gloria al Imperio en el que el sol nunca se pone! ¡España para siempre!"
 STATIC_MODIFIER_NAME_cas_reconquista_spirit_mod: "El espíritu de la Reconquista"
 STATIC_MODIFIER_DESC_cas_reconquista_spirit_mod: "La espada de Castilla inspira la guerra santa contra los musulmanes de Iberia."
 STATIC_MODIFIER_NAME_cas_rio_salado_mod: "Victoria en el Salado"
 STATIC_MODIFIER_DESC_cas_rio_salado_mod: "El aplastamiento de la coalición de benimerines y Granada en el Salado abre el último acto de la Reconquista."
 STATIC_MODIFIER_NAME_cas_leon_city_mod: "La gloria del antiguo Reino de León"
 STATIC_MODIFIER_DESC_cas_leon_city_mod: "La antigua capital de León desarrollada como símbolo de la herencia de la Reconquista."
 STATIC_MODIFIER_NAME_cas_church_reform_mod: "Reforma de la Iglesia"
 STATIC_MODIFIER_DESC_cas_church_reform_mod: "La reforma de Cisneros hace de la Iglesia católica de España la más disciplinada y poderosa de Europa."
 STATIC_MODIFIER_NAME_cas_counter_ref_mod: "La Contrarreforma"
 STATIC_MODIFIER_DESC_cas_counter_ref_mod: "España lidera el contraataque católico a la Reforma protestante."
 STATIC_MODIFIER_NAME_cas_havana_mod: "La Habana, nudo caribeño"
 STATIC_MODIFIER_DESC_cas_havana_mod: "La Habana desarrollada como el mayor nudo comercial y marítimo del Caribe."
 STATIC_MODIFIER_NAME_cas_florida_mod: "La Florida"
 STATIC_MODIFIER_DESC_cas_florida_mod: "La exploración española de Norteamérica establece presencia en el sureste del continente."
 STATIC_MODIFIER_NAME_cas_philippines_mod: "Las Islas Filipinas"
 STATIC_MODIFIER_DESC_cas_philippines_mod: "Concluida la expansión asiática de España: Manila se convierte en nudo del comercio transoceánico."
 STATIC_MODIFIER_NAME_cas_sardinia_mod: "Reino de Cerdeña"
 STATIC_MODIFIER_DESC_cas_sardinia_mod: "Cerdeña, granero mediterráneo, bajo control español."
 STATIC_MODIFIER_NAME_cas_italy_dominion_mod: "Dominio italiano"
 STATIC_MODIFIER_DESC_cas_italy_dominion_mod: "La Península Itálica pasa al dominio español: la riqueza del Renacimiento sumada al imperio."
 STATIC_MODIFIER_NAME_cas_garrison_mod: "Red de guarniciones"
 STATIC_MODIFIER_DESC_cas_garrison_mod: "La red estratégica de guarniciones guarda las vastas fronteras del Imperio español."
 STATIC_MODIFIER_NAME_cas_cadiz_mod: "El antiguo puerto fenicio"
 STATIC_MODIFIER_DESC_cas_cadiz_mod: "El puerto natural de Cádiz se convierte en la principal puerta del comercio atlántico."
 STATIC_MODIFIER_NAME_cas_malaga_mod: "La seda de Málaga"
 STATIC_MODIFIER_DESC_cas_malaga_mod: "Tras la conquista de Granada, el clima cálido y la tierra fértil de Málaga se desarrollan como región productora de seda. Los artesanos de la Alhambra sostienen la industria de la seda de Málaga, comercializada a precios altos por todo el Mediterráneo."
 STATIC_MODIFIER_NAME_cas_valencia_mod: "La ciudad del sol"
 STATIC_MODIFIER_DESC_cas_valencia_mod: "La seda y el comercio mediterráneo de Valencia la convierten en el centro económico oriental de España."
 STATIC_MODIFIER_NAME_cas_zaragoza_mod: "La capital de Aragón"
 STATIC_MODIFIER_DESC_cas_zaragoza_mod: "Zaragoza, en el Ebro, anima las redes comerciales internas de Iberia."
 STATIC_MODIFIER_NAME_cas_barcelona_mod: "Barcelona, nudo mediterráneo"
 STATIC_MODIFIER_DESC_cas_barcelona_mod: "Barcelona como el mayor nudo comercial mediterráneo de España."
 STATIC_MODIFIER_NAME_cas_reconquista_done_mod: "Reconquista concluida"
 STATIC_MODIFIER_DESC_cas_reconquista_done_mod: "780 años de guerra santa terminados: España unida bajo la fe católica. La noción de “España” formada."
 STATIC_MODIFIER_NAME_cas_hermandad_mod: "La Santa Hermandad"
 STATIC_MODIFIER_DESC_cas_hermandad_mod: "Los arqueros de la Hermandad patrullan los caminos, y hasta las puertas de los castillos de la nobleza se abren a la justicia real."
 STATIC_MODIFIER_NAME_cas_inquisition_mod: "La Inquisición española"
 STATIC_MODIFIER_DESC_cas_inquisition_mod: "Los inquisidores del Santo Oficio, con hábitos negros, van de ciudad en ciudad, y la gente atestigua su fe en voces apagadas."
 STATIC_MODIFIER_NAME_cas_pure_faith_mod: "Pureza de la fe"
 STATIC_MODIFIER_DESC_cas_pure_faith_mod: "La expulsión de los judíos establece la pureza católica de España."
 STATIC_MODIFIER_NAME_cas_catholic_monarchs_mod: "El legado de los Reyes Católicos"
 STATIC_MODIFIER_DESC_cas_catholic_monarchs_mod: "El título papal de “Reyes Católicos” establece la autoridad de España."
 STATIC_MODIFIER_NAME_cas_absolutism_mod: "Absolutismo"
 STATIC_MODIFIER_DESC_cas_absolutism_mod: "El poder real se hace absoluto, y España emerge como Estado moderno centralizado."
 STATIC_MODIFIER_NAME_cas_cortes_mod: "Las Cortes"
 STATIC_MODIFIER_DESC_cas_cortes_mod: "En la cámara de las Cortes de Castilla, el rey y los delegados de las ciudades se sientan a la misma mesa, fijando las condiciones del gobierno."
 STATIC_MODIFIER_NAME_cas_colonial_law_mod: "Las Leyes de Indias"
 STATIC_MODIFIER_DESC_cas_colonial_law_mod: "El derecho de la administración colonial codificado, estabilizando el gobierno de los vastos territorios ultramarinos."
 STATIC_MODIFIER_NAME_cas_canary_mod: "Cabeza de puente en las Canarias"
 STATIC_MODIFIER_DESC_cas_canary_mod: "Establecida la cabeza de puente para la expansión atlántica."
 STATIC_MODIFIER_NAME_cas_atlantic_mod: "Espíritu de la exploración atlántica"
 STATIC_MODIFIER_DESC_cas_atlantic_mod: "El deseo de explorar mares desconocidos hace posible el dominio atlántico de España."
 STATIC_MODIFIER_NAME_cas_caribbean_mod: "Dominio del Caribe"
 STATIC_MODIFIER_DESC_cas_caribbean_mod: "El Mar Caribe se convierte en “mar interior” del Imperio español."
 STATIC_MODIFIER_NAME_cas_mexico_mod: "Virreinato de la Nueva España"
 STATIC_MODIFIER_DESC_cas_mexico_mod: "La conquista del Imperio azteca da origen al Virreinato de la Nueva España."
 STATIC_MODIFIER_NAME_cas_peru_mod: "Virreinato del Perú"
 STATIC_MODIFIER_DESC_cas_peru_mod: "La conquista del Imperio inca da origen al Virreinato del Perú. La riqueza de los Andes fluye hacia España."
 STATIC_MODIFIER_NAME_cas_potosi_mod: "Minas de plata de Potosí"
 STATIC_MODIFIER_DESC_cas_potosi_mod: "La mayor mina de plata del mundo sustenta las finanzas del Imperio español; la plata se convierte en la moneda de España."
 STATIC_MODIFIER_NAME_cas_colonial_empire_mod: "El Imperio colonial"
 STATIC_MODIFIER_DESC_cas_colonial_empire_mod: "El imperio colonial global español concluido; el sueño de los conquistadores se hace realidad."
 STATIC_MODIFIER_NAME_cas_manila_galleon_mod: "Comercio del galeón de Manila"
 STATIC_MODIFIER_DESC_cas_manila_galleon_mod: "Los galeones de Manila, cruzando el Pacífico, establecen la primera ruta comercial global, uniendo Asia y América."
 STATIC_MODIFIER_NAME_cas_naples_mod: "Reino de Nápoles"
 STATIC_MODIFIER_DESC_cas_naples_mod: "El Reino de Nápoles entra bajo la corona española, estableciendo influencia en Italia."
 STATIC_MODIFIER_NAME_cas_sicily_mod: "Reino de Sicilia"
 STATIC_MODIFIER_DESC_cas_sicily_mod: "Sicilia, granero del Mediterráneo, estabilizada bajo el dominio español."
 STATIC_MODIFIER_NAME_cas_milan_mod: "Ducado de Milán"
 STATIC_MODIFIER_DESC_cas_milan_mod: "Como resultado de las guerras de Italia, Milán entra en la esfera de influencia de España."
 STATIC_MODIFIER_NAME_cas_mediterranean_mod: "Hegemón del Mediterráneo"
 STATIC_MODIFIER_DESC_cas_mediterranean_mod: "España obtiene el dominio del Mediterráneo: por primera vez desde la Roma antigua, una sola potencia gobierna el mar."
 STATIC_MODIFIER_NAME_cas_lepanto_mod: "Héroe de Lepanto"
 STATIC_MODIFIER_DESC_cas_lepanto_mod: "La batalla de Lepanto destruye la flota otomana, estableciendo la superioridad cristiana en el Mediterráneo."
 STATIC_MODIFIER_NAME_cas_ceuta_mod: "Fortaleza de Ceuta"
 STATIC_MODIFIER_DESC_cas_ceuta_mod: "Ceuta, puerta del Estrecho de Gibraltar, asegurada: la puerta de África abierta."
 STATIC_MODIFIER_NAME_cas_oran_mod: "Conquista de Orán"
 STATIC_MODIFIER_DESC_cas_oran_mod: "La Reconquista se extiende al norte de África: Orán se convierte en un baluarte español norteafricano."
 STATIC_MODIFIER_NAME_cas_tunis_mod: "Conquista de Túnez"
 STATIC_MODIFIER_DESC_cas_tunis_mod: "Conquistando Túnez, España disputa al Imperio otomano el dominio del norte de África."
 STATIC_MODIFIER_NAME_cas_north_africa_mod: "Dominio del norte de África"
 STATIC_MODIFIER_DESC_cas_north_africa_mod: "El litoral mediterráneo del norte de África pasa al gobierno español, estabilizando el comercio mediterráneo."
 STATIC_MODIFIER_NAME_cas_casa_contratacion_mod: "La Casa de Contratación"
 STATIC_MODIFIER_DESC_cas_casa_contratacion_mod: "La Casa de Contratación de Sevilla monopoliza el comercio con el Nuevo Mundo: nace la mayor institución comercial del mundo."
 STATIC_MODIFIER_NAME_cas_tercio_mod: "El tercio"
 STATIC_MODIFIER_DESC_cas_tercio_mod: "El tercio, la mejor formación de infantería del mundo, se convierte en la base del ejército español."
 STATIC_MODIFIER_NAME_cas_military_orders_mod: "Las órdenes militares"
 STATIC_MODIFIER_DESC_cas_military_orders_mod: "Las órdenes militares de Santiago, Calatrava y Alcántara se suman al ejército español."
 STATIC_MODIFIER_NAME_cas_armada_mod: "La Armada Invencible"
 STATIC_MODIFIER_DESC_cas_armada_mod: "Con 130 navíos, la “Armada Invencible” encarna el apogeo del poderío naval español."
 STATIC_MODIFIER_NAME_cas_conquistadors_mod: "Los conquistadores"
 STATIC_MODIFIER_DESC_cas_conquistadors_mod: "La leyenda de Cortés y Pizarro vive: los conquistadores españoles recorren el mundo entero."
 STATIC_MODIFIER_NAME_cas_siglo_de_oro_mod: "El Siglo de Oro"
 STATIC_MODIFIER_DESC_cas_siglo_de_oro_mod: "La era de Cervantes, Velázquez y El Greco: la cultura española está en la cima del mundo."
 STATIC_MODIFIER_NAME_cas_escorial_mod: "El Escorial"
 STATIC_MODIFIER_DESC_cas_escorial_mod: "El palacio, monasterio y mausoleo de Felipe II encarnan el apogeo del Imperio español."
 STATIC_MODIFIER_NAME_cas_segovia_mod: "El acueducto de Segovia"
 STATIC_MODIFIER_DESC_cas_segovia_mod: "El gran acueducto romano restaurado y modernizado, mejorando enormemente el abastecimiento de agua de Segovia. Este acueducto se convierte en modelo para la infraestructura hídrica de toda Castilla."
 STATIC_MODIFIER_NAME_cas_west_africa_mod: "Comercio con el África occidental"
 STATIC_MODIFIER_DESC_cas_west_africa_mod: "España entra en el comercio con el África occidental, usando las Islas Canarias como cabeza de puente."
 STATIC_MODIFIER_NAME_cas_trent_mod: "El Concilio de Trento"
 STATIC_MODIFIER_DESC_cas_trent_mod: "El Concilio de Trento, liderado por España, reafirma la doctrina católica y define los rumbos de la Contrarreforma."
 STATIC_MODIFIER_NAME_cas_navarre_mod: "Navarra conquistada"
 STATIC_MODIFIER_DESC_cas_navarre_mod: "La encrucijada pirenaica de Navarra asegurada: la Iberia septentrional bajo control."
 STATIC_MODIFIER_NAME_cas_salamanca_mod: "La Universidad de Salamanca"
 STATIC_MODIFIER_DESC_cas_salamanca_mod: "Una de las universidades más antiguas de Europa forma a los eruditos y funcionarios de élite de España."
 STATIC_MODIFIER_NAME_cas_toledo_dev_mod: "Acero de Toledo"
 STATIC_MODIFIER_DESC_cas_toledo_dev_mod: "El acero y la orfebrería de Toledo florecen: la capital histórica plenamente desarrollada."
 STATIC_MODIFIER_NAME_cas_madrid_mod: "Madrid, capital imperial"
 STATIC_MODIFIER_DESC_cas_madrid_mod: "La capital permanente de Felipe II, Madrid, se convierte en el corazón del imperio mundial."
 STATIC_MODIFIER_NAME_cas_burgos_mod: "Burgos, ciudad internacional del Camino de Santiago"
 STATIC_MODIFIER_DESC_cas_burgos_mod: "Burgos se desarrolla como capital histórica de Castilla y centro del comercio de lana."
 STATIC_MODIFIER_NAME_cas_granada_city_mod: "La perla de España"
 STATIC_MODIFIER_DESC_cas_granada_city_mod: "La ciudad de la Alhambra se convierte en el centro cultural y económico del sur de España."
 STATIC_MODIFIER_NAME_cas_cordoba_mod: "Producción de cuero de Córdoba"
 STATIC_MODIFIER_DESC_cas_cordoba_mod: "El cordobán, cuero de cabra curtido por los artesanos de Córdoba, es estimado en las cortes de Europa, y cargamentos salen sin cesar de los talleres de la ciudad."
 STATIC_MODIFIER_NAME_cas_flanders_pacified_mod: "Flandes pacificada"
 STATIC_MODIFIER_DESC_cas_flanders_pacified_mod: "Resistencia flamenca suprimida: esta próspera región incorporada de forma permanente al imperio."
 STATIC_MODIFIER_NAME_cas_greatest_power_mod: "Cimientos del imperio en el que el sol nunca se pone"
 STATIC_MODIFIER_DESC_cas_greatest_power_mod: "Con los tres pilares en su lugar, España está a punto de completar el “imperio en el que el sol nunca se pone”."
 STATIC_MODIFIER_NAME_cas_empire_of_sun_final_mod: "El Imperio en el que el sol nunca se pone"
 STATIC_MODIFIER_DESC_cas_empire_of_sun_final_mod: "España concluida como el primer imperio global de la historia: el nombre “imperio en el que el sol nunca se pone” grabado para siempre en la historia."
 STATIC_MODIFIER_NAME_cas_gold_fleet_mod: "Las flotas del tesoro"
 STATIC_MODIFIER_DESC_cas_gold_fleet_mod: "Las flotas del tesoro, que navegan cada año hacia España, transforman la economía europea."
 STATIC_MODIFIER_NAME_cas_portugal_mod: "Unión con Portugal"
 STATIC_MODIFIER_DESC_cas_portugal_mod: "Por la Unión Ibérica, el imperio colonial de Portugal se suma también a España."
 STATIC_MODIFIER_NAME_cas_iberian_union_mod: "La Unión Ibérica"
 STATIC_MODIFIER_DESC_cas_iberian_union_mod: "Toda la Península Ibérica unida, completando la base del mayor imperio del mundo."
 STATIC_MODIFIER_NAME_cas_sevilla_mod: "Sevilla prospera"
 STATIC_MODIFIER_DESC_cas_sevilla_mod: "Sevilla, puerta del comercio con el Nuevo Mundo, desarrollada como la mayor ciudad comercial del mundo."
 STATIC_MODIFIER_NAME_cas_trade_network_mod: "La red comercial imperial"
 STATIC_MODIFIER_DESC_cas_trade_network_mod: "De Sevilla a Manila, la red comercial imperial de España abarca todo el globo."
 STATIC_MODIFIER_NAME_cas_valladolid_dev_mod: "Desarrollo de Valladolid"
 STATIC_MODIFIER_DESC_cas_valladolid_dev_mod: "Valladolid, ciudad-castillo de Castilla, desarrollada como sede de la corte, con sus mercados y talleres prosperando."
 STATIC_MODIFIER_NAME_cas_form_spain_mod: "Nacimiento del Reino de España"
 STATIC_MODIFIER_DESC_cas_form_spain_mod: "Los escribanos de la corte en Madrid redactan decretos para cada provincia en nombre de un único reino."
