l_spanish:
 por_portuguese_mission_pack: "La era de los descubrimientos: el poder marítimo de Portugal"
 por_portuguese_mission_pack_DESCRIPTION:0 "En 1337, Portugal es un pequeño reino en el extremo occidental de la Península Ibérica. Pero las expediciones organizadas por el infante don Enrique el Navegante (1394-1460) cambiarán el mundo: Madeira, Azores, África occidental, Cabo de Buena Esperanza, India, Malaca, Brasil. Del Atlántico al Océano Índico, erige el “Estado de la India”, donde los navegantes portugueses gobiernan los mares."
 por_portuguese_mission_pack_CRITERIA_DESCRIPTION:0 "Desarrolla la metrópoli, rodea África para alcanzar el Océano Índico, coloniza Brasil y gobierna como señor de los mares."
 por_portuguese_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para realizar el imperio de la era de los descubrimientos de Portugal."
 por_portuguese_mission_pack_BUTTON_DETAILS:0 "¡Del infante don Enrique al Portugal de Felipe II!"
 por_infante_henrique: "La tradición marítima de Portugal"
 por_infante_henrique_desc: "En 1337, Portugal es un pequeño reino en el extremo occidental de la Península Ibérica. Bajo Alfonso IV, Portugal apoyó a Castilla en la batalla del Salado (1340) y repelió a los benimerines como potencia marítima. Este reino, orientado al Atlántico, nutre desde hace mucho afinidad con el mar. El puerto de Lisboa, los pescadores del Algarve, los vientos atlánticos: esta tradición marítima es la base que generará la próxima generación de la era de los descubrimientos."
 por_dev_lisbon: "Desarrolla Lisboa"
 por_dev_lisbon_desc: "Lisboa, en la desembocadura del Tajo, está dotada de un puerto natural. El desarrollo de esta ciudad, fundada por los antiguos fenicios, como capital del imperio portugués la hace centro del comercio mundial."
 por_dev_porto: "Desarrolla Oporto"
 por_dev_porto_desc: "Oporto, en el Duero, es la ciudad del vino y de la pesca. Desarrolla esta antigua ciudad, que prestará su nombre a las generaciones venideras para “Portugal (puerto de Oporto)”."
 por_university_coimbra: "La Universidad de Coímbra"
 por_university_coimbra_desc: "La Universidad de Coímbra, fundada en 1290 —la más antigua de Portugal— forma navegantes, juristas y clérigos. Muchos eruditos que sirvieron al infante don Enrique estudiaron aquí."
 por_lisbon_entrepot_nmt: "Lisboa como entrepôt comercial"
 por_lisbon_entrepot_nmt_desc: "Desarrolla la gestión portuaria de Lisboa para que las mercancías orientales sean desde aquí distribuidas por toda Europa. Pimienta, especias, seda: Lisboa se convierte en el mayor mercado de especias de Europa."
 por_avis_dynasty: "Consolida la casa de Avis"
 por_avis_dynasty_desc: "La casa de Avis, que sobrevivió a la crisis dinástica de 1385 —la victoria de Juan I— estableció la dinastía portuguesa con una base estable de gobierno."
 por_ordenacoes_afonsinas: "Las Ordenaciones Alfonsinas"
 por_ordenacoes_afonsinas_desc: "Las Ordenaciones Alfonsinas, compiladas en 1446, son el primer código sistemático de leyes de Portugal. Sirviendo de modelo a los posteriores códigos manuelinos y filipinos, establecen la tradición jurídica de Portugal."
 por_dev_evora: "Desarrolla Évora"
 por_dev_evora_desc: "Évora, capital de la región del Alentejo: desarrolla esta antigua ciudad, que preserva templos romanos, como centro agrícola y cultural."
 por_algarve_fisheries: "Pesquerías del Algarve"
 por_algarve_fisheries_desc: "La región del Algarve, en el sur de Portugal, es vecina de pesqueros atlánticos. Las ricas pesquerías de bacalao, sardina y atún alimentan la afinidad portuguesa con el mar, que se convertirá en la base de la era de los descubrimientos."
 por_ceuta_gateway: "Ceuta: puerta de África"
 por_ceuta_gateway_desc: "En 1415, las tropas de Juan I conquistaron Ceuta: comienzo de la expansión ultramarina de Portugal. Aquí el infante don Enrique recibió de mercaderes musulmanes información sobre las rutas del Sáhara, lo que alimentó su ambición de navegar hacia el sur a lo largo de África."
 por_conquer_tangier: "Conquista Tánger"
 por_conquer_tangier_desc: "Tánger, situada frente a Ceuta a través del Estrecho de Gibraltar: aumenta la presión sobre las fuerzas musulmanas del norte de África y asegura la salida atlántica."
 por_moroccan_fortress: "Fortalezas marroquíes"
 por_moroccan_fortress_desc: "Mediante el dominio de las ciudades comerciales marroquíes, incluida Agadir, domina el punto final del comercio transahariano y monopoliza los beneficios del oro, el marfil y la sal."
 por_madeira_settlement: "Poblamiento de Madeira"
 por_madeira_settlement_desc: "Madeira, alcanzada por los portugueses en 1419, es la primera colonia atlántica. La introducción del azúcar en esta isla deshabitada estableció el modelo de plantaciones azucareras que más tarde se usaría en Brasil y en las Indias Occidentales."
 por_azores_settlement: "Poblamiento de las Azores"
 por_azores_settlement_desc: "La colonización de las Azores, en medio del Atlántico, asegura una estación intermedia en las rutas transatlánticas. Usándola como base, se permite proseguir la exploración hacia el oeste."
 por_guinea_trade: "Comercio con Guinea"
 por_guinea_trade_desc: "El Golfo de Guinea, alcanzado por los portugueses durante su navegación hacia el sur a lo largo de la costa del África occidental: comienza el comercio de oro, marfil y, más tarde, esclavos. El sueño del infante don Enrique se hace realidad."
 por_gold_coast: "La Costa de Oro"
 por_gold_coast_desc: "Elmina (1482): la primera fortaleza comercial permanente que Portugal erigió en África. Enormes cantidades de oro fluyen de esta “Costa de Oro” a Portugal."
 por_sao_tome_sugar: "El azúcar de Santo Tomé"
 por_sao_tome_sugar_desc: "La isla de Santo Tomé, cerca del ecuador, es ideal para plantaciones de azúcar. Con trabajo forzado del continente africano, Santo Tomé se convierte en el mayor proveedor de azúcar a Europa."
 por_angola_colony: "La colonia de Angola"
 por_angola_colony_desc: "Angola, otra cabeza de puente tras Santo Tomé, se convierte en importante colonia portuguesa. Establece relaciones comerciales con el Reino del Congo y amplía la influencia en el África centro-occidental."
 por_cape_of_good_hope: "El Cabo de Buena Esperanza"
 por_cape_of_good_hope_desc: "En 1488, Bartolomeu Dias alcanzó el extremo sur de África, el “Cabo de las Tormentas”. Juan II lo rebautizó “Cabo de Buena Esperanza”, pues el camino a las Indias estaba ahora abierto."
 por_east_africa_trading_posts: "Puestos comerciales del África oriental"
 por_east_africa_trading_posts_desc: "Mozambique, Sofala: la toma de los puestos del comercio de oro y marfil de la costa suajili alcanza la entrada en la red comercial del Océano Índico."
 por_mombasa_fort: "El fuerte de Mombasa"
 por_mombasa_fort_desc: "Mombasa y Malindi: la subyugación de las mayores ciudades comerciales del África oriental establece el control sobre el Océano Índico. En 1498, Vasco da Gama recibió en Malindi indicaciones de navegación para la India."
 por_vasco_da_gama: "Vasco da Gama llega a la India"
 por_vasco_da_gama_desc: "El 20 de mayo de 1498, Vasco da Gama desembarcó en Calicut (Kozhikode). En ese momento se abrió la ruta marítima entre Europa y Asia, y la estructura del comercio de especias, monopolizado por mercaderes árabes y Venecia, cambió radicalmente."
 por_conquer_goa: "Conquista Goa"
 por_conquer_goa_desc: "En 1510, Albuquerque conquistó Goa: nacimiento de la “capital oriental” de Portugal. El puerto natural de Goa, en la costa occidental de la India, prospera como centro del Estado de la India (India Portuguesa)."
 por_malabar_trade: "Las especias de la Costa de Malabar"
 por_malabar_trade_desc: "Cochín, Calicut, Quilon: la Costa de Malabar produce pimienta, cardamomo y jengibre. Monopolizando aquí las especias, Portugal domina los precios europeos de las especias."
 por_hormuz_control: "Domina Ormuz"
 por_hormuz_control_desc: "En 1515, Albuquerque conquistó Ormuz, en la entrada del Golfo Pérsico. Dominar este punto significa dominar el comercio persa-indio y cortar el comercio del mundo islámico."
 por_conquer_malacca: "Conquista Malaca"
 por_conquer_malacca_desc: "En julio de 1511, Afonso de Albuquerque, con 1200 soldados portugueses, conquistó Malaca: la mayor victoria estratégica de la era de los descubrimientos. El dominio sobre el “cuello del comercio oriental” conquista todas las rutas comerciales de especias, seda y porcelana."
 por_spice_monopoly: "El monopolio de las especias"
 por_spice_monopoly_desc: "Con Goa, Ormuz y Malaca aseguradas, las rutas comerciales de especias del Océano Índico están enteramente bajo control portugués. Pimienta, nuez moscada y clavo son llevados por Lisboa a Europa."
 por_indian_ocean_empire: "El Imperio del Océano Índico"
 por_indian_ocean_empire_desc: "Del África oriental a Malaca, la flota portuguesa domina el Océano Índico. La Casa de la India, en Lisboa, administra todo el comercio de especias, y enorme riqueza fluye a Portugal."
 por_brazil_discovery: "El descubrimiento de Brasil"
 por_brazil_discovery_desc: "El 22 de abril de 1500, rumbo a la India con una flota de 13 navíos, Pedro Álvares Cabral se desvió mucho hacia el oeste para evitar una tormenta y descubrió una tierra desconocida. “Isla de Vera Cruz”: más tarde llamada “Brasil” (del árbol palo brasil). Por el Tratado de Tordesillas, esta tierra pasa a ser territorio portugués y se convertirá más tarde en la mayor colonia de Portugal."
 por_brazil_colony: "Coloniza Brasil"
 por_brazil_colony_desc: "En 1532, Martim Afonso de Sousa fundó la primera colonia permanente de Brasil, “São Vicente”. Nace una nueva sociedad, en que se mezclan colonos portugueses y pueblos nativos."
 por_brazil_sugar: "La industria azucarera de Brasil"
 por_brazil_sugar_desc: "A mediados del siglo XVI, Brasil se convirtió en el mayor proveedor de azúcar a Europa. Los ingenios (molinos de azúcar) de Pernambuco y Bahía operan con trabajo forzado de África, produciendo enorme riqueza."
 por_brazil_empire: "El Imperio brasileño"
 por_brazil_empire_desc: "Bahía, Pernambuco, Río de Janeiro: las colonias de Brasil han crecido hasta la escala imperial. Azúcar, palo brasil y, más tarde, oro y gemas crean corrientes de riqueza para Portugal."
 por_naval_supremacy: "Supremacía naval"
 por_naval_supremacy_desc: "La flota portuguesa, que domina tanto el Atlántico como el Océano Índico: la maniobrabilidad de la carabela y el poder de fuego de los cañones superan a los barcos mercantes árabes, indios y chinos."
 por_caravel: "La carabela"
 por_caravel_desc: "La carabela, desarrollada en la era del infante don Enrique, es un navío pequeño y rápido, de velas latinas, capaz de navegar contra el viento, hizo posible la era de los descubrimientos. La Santa María también era una carabela."
 por_padroes: "Los padrões (columnas de piedra)"
 por_padroes_desc: "Los exploradores portugueses erigían en varios lugares de África columnas de piedra (padrões), que llevaban el nombre del rey portugués y la cruz cristiana. Era una declaración de descubrimiento y dominio: el alcance de Portugal, grabado en piedra."
 por_royal_navy: "La Armada Real"
 por_royal_navy_desc: "La más fuerte flota del mundo sustenta la supremacía portuguesa: galeones, naos y carabelas protegen todo, desde el Océano Índico hasta Brasil."
 por_dev_setubal: "Desarrolla Setúbal"
 por_dev_setubal_desc: "La bahía de Setúbal, al sur de Lisboa, es un puerto natural. Desarróllala como ciudad portuaria que complementa a Lisboa y produce sal, pescado y vino."
 por_order_of_christ: "La Orden de Cristo"
 por_order_of_christ_desc: "La Orden de Cristo (Ordem de Cristo), fundada en 1319: esta orden militar, establecida en Portugal como heredera de los templarios, financió las expediciones de don Enrique. La cruz escarlata de la orden estaba grabada en las velas portuguesas."
 por_treaty_tordesillas: "El Tratado de Tordesillas"
 por_treaty_tordesillas_desc: "En 1494, España y Portugal, por mediación del papa Alejandro VI, firmaron el Tratado de Tordesillas, dividiendo el Atlántico verticalmente, el oeste para España, el este para Portugal. Este tratado confirmó Brasil como territorio portugués."
 por_colonial_administration: "Administración colonial"
 por_colonial_administration_desc: "El aparato administrativo para dirigir el imperio de Portugal, que abarca África, la India y Brasil: gobernadores y virreyes reportan al rey en Lisboa y envían los ingresos comerciales a la metrópoli."
 por_estado_da_india_nmt: "El Estado de la India"
 por_estado_da_india_nmt_desc: "“Estado da Índia”: término que se refiere a todo el imperio asiático de Portugal. Con Goa como capital y el dominio de las rutas comerciales marítimas del África oriental a Malaca, este “imperio” es el primer imperio marítimo verdaderamente global de la historia."
 por_dev_tomar: "Desarrolla Tomar"
 por_dev_tomar_desc: "Tomar, residencia principal de la Orden de Cristo: el Convento de Cristo es considerado el mejor ejemplo de la arquitectura manuelina portuguesa. Desarróllala con los medios de la orden."
 por_wine_trade: "El comercio del vino portugués"
 por_wine_trade_desc: "Los vinos del valle del Duero —prototipo del “vino de Oporto”— importante mercancía de exportación a Inglaterra y Flandes. Establece relaciones comerciales anglo-portuguesas, adelantándote al Tratado de Methuen (1703)."
 por_dev_faro: "Desarrolla Faro"
 por_dev_faro_desc: "Faro, capital de la región del Algarve: incorporada a Portugal por la Reconquista cristiana en 1249, desarrolla esta ciudad meridional como nudo de pesca y comercio."
 por_cape_verde: "Las islas de Cabo Verde"
 por_cape_verde_desc: "Las Islas de Cabo Verde, descubiertas en 1456, ocupan posición estratégica a medio camino entre África y América. Como punto de transbordo del comercio transatlántico, se convertirán en base de abastecimiento para la posterior colonización de Brasil."
 por_lisbon_megalopolis: "Lisboa: ciudad mundial"
 por_lisbon_megalopolis_desc: "En el siglo XVI, Lisboa se convirtió en una de las mayores ciudades de Europa, con población superior a 100000. Especias orientales, oro africano y azúcar brasileño convergen aquí, valiéndole el apodo de “capital del mundo”."
 por_casa_india: "La Casa de la India"
 por_casa_india_desc: "La Casa de la India, fundada en Lisboa, administra el comercio oriental de Portugal exclusivamente como institución estatal. Toda la importación de especias pasa por aquí, generando enormes ingresos aduaneros."
 por_brazil_wood: "Palo brasil"
 por_brazil_wood_desc: "El palo brasil, del que Brasil tomó su nombre: esta madera tintórea roja se exporta en enormes cantidades, mercancía insustituible de la industria tintorera de lana europea. Es el primer producto del comercio brasileño."
 por_atlantic_domination: "Dominio del Atlántico"
 por_atlantic_domination_desc: "De Lisboa a las Azores, a Madeira, a Cabo Verde y a Brasil: Portugal domina todo el Atlántico. Habiendo superado la rivalidad con España, Portugal gobierna al principal actor del comercio atlántico."
 por_empire_of_seas: "Señor de los mares"
 por_empire_of_seas_desc: "“Portugal, pequeño país, pero gobierna la mitad del mundo”: las palabras del historiador se cumplen. Del Atlántico al Océano Índico, de Brasil a Malaca, el imperio de Portugal domina los mares del mundo. El Estado de la India concluido."
 por_events.10.t: "Cabo de Buena Esperanza: la ruta de las Indias se abre"
 por_events.10.d: "En 1488, la flota de Bartolomeu Dias rodeó el “Cabo de las Tormentas” meridional de África y alcanzó el Océano Índico. Juan II se estremeció con la noticia: quince años después, Vasco da Gama abrirá la ruta directa a las Indias. La era en que mercaderes árabes monopolizaban el comercio de especias se acerca a su fin."
 por_events.10.a: "¡Gloria a Dios y a Portugal! ¡La ruta de las Indias abierta!"
 por_events.20.t: "Vasco da Gama llega a la India"
 por_events.20.d: "El 20 de mayo de 1498, diez meses después de zarpar de Lisboa con cuatro navíos, Vasco da Gama desembarcó en Calicut. El gobernante local (el samorín) era desconfiado, pero Portugal aseguró la entrada en el comercio de especias. Mientras los mercaderes árabes hervían de ira, comenzó la era del comercio oriental de Portugal."
 por_events.20.a: "¡Pimienta y especias: Portugal ha conquistado la riqueza de la India!"
 por_events.30.t: "Conquista de Malaca: la toma del cuello del comercio de especias"
 por_events.30.d: "En julio de 1511, Afonso de Albuquerque, con 1200 fuerzas portuguesas, conquistó Malaca. “El lugar más importante de Oriente”: el dominio sobre Malaca conquista todas las rutas comerciales de China, la India y las Islas de las Especias. Albuquerque puso Malaca junto a Goa y Ormuz como uno de los tres pilares del imperio portugués."
 por_events.30.a: "¡Malaca es nuestra! ¡El comercio oriental: monopolio de Portugal!"
 por_events.40.t: "El descubrimiento de Brasil por Cabral"
 por_events.40.d: "El 22 de abril de 1500, rumbo a la India con una flotilla de 13 navíos, Pedro Álvares Cabral se desvió mucho hacia el oeste para evitar una tormenta y descubrió una tierra desconocida. “Isla de Vera Cruz”: parte del continente sudamericano, más tarde llamada “Brasil”. Por el Tratado de Tordesillas, esta tierra pasa a ser territorio portugués, y esta tierra se convertirá más tarde en la mayor colonia de Portugal."
 por_events.40.a: "¡Descubrimiento por orientación divina! ¡Brasil pertenece a Portugal!"
 por_events.99.t: "Señor de los mares: el imperio de Portugal concluido"
 por_events.99.d: "De Lisboa a Goa, de Malaca a Brasil: el imperio de Portugal domina los mares del mundo. La “Ruta de la Seda marítima” con que soñó el infante don Enrique se ha hecho realidad, y las especias, el oro, el azúcar y el marfil se encuentran en Lisboa. Portugal se ha transformado de una pequeña nación de 92000 kilómetros cuadrados en el primer “imperio marítimo global” del mundo."
 por_events.99.a: "¡Portugal para siempre! ¡Gobierna como señor de los mares!"
 STATIC_MODIFIER_NAME_por_henrique_mod: "La tradición marítima de Portugal"
 STATIC_MODIFIER_DESC_por_henrique_mod: "El Portugal de Alfonso IV cultiva su tradición marítima: la pesca atlántica, el comercio y el arte de la navegación forman la base de este reino."
 STATIC_MODIFIER_NAME_por_lisbon_mod: "Prosperidad de Lisboa"
 STATIC_MODIFIER_DESC_por_lisbon_mod: "Lisboa, en la desembocadura del Tajo, desarrollada como centro del comercio mundial."
 STATIC_MODIFIER_NAME_por_porto_mod: "Crecimiento de Oporto"
 STATIC_MODIFIER_DESC_por_porto_mod: "Oporto, en el Duero, desarrollado como ciudad del vino y de la pesca."
 STATIC_MODIFIER_NAME_por_coimbra_mod: "La Universidad de Coímbra"
 STATIC_MODIFIER_DESC_por_coimbra_mod: "La más antigua universidad de Portugal forma navegantes, juristas y clérigos."
 STATIC_MODIFIER_NAME_por_lisbon_trade_mod: "Lisboa como entrepôt comercial"
 STATIC_MODIFIER_DESC_por_lisbon_trade_mod: "Lisboa establecida como el mayor entrepôt de especias orientales de Europa."
 STATIC_MODIFIER_NAME_por_avis_mod: "Autoridad de la casa de Avis"
 STATIC_MODIFIER_DESC_por_avis_mod: "Gobierno de la dinastía de Avis estabilizado, base para la era de los descubrimientos asentada."
 STATIC_MODIFIER_NAME_por_ordenacoes_mod: "Las Ordenaciones Alfonsinas"
 STATIC_MODIFIER_DESC_por_ordenacoes_mod: "El primer código sistemático de leyes, compilado por los escribas de Lisboa, lleva los mismos principios a los tribunales de todos los rincones del reino."
 STATIC_MODIFIER_NAME_por_evora_mod: "Crecimiento de Évora"
 STATIC_MODIFIER_DESC_por_evora_mod: "La antigua ciudad del Alentejo, Évora, desarrollada como centro agrícola y cultural."
 STATIC_MODIFIER_NAME_por_fisheries_mod: "Pesquerías del Algarve"
 STATIC_MODIFIER_DESC_por_fisheries_mod: "Los pesqueros atlánticos alimentaron la afinidad portuguesa con el mar."
 STATIC_MODIFIER_NAME_por_ceuta_mod: "Cabeza de puente de Ceuta"
 STATIC_MODIFIER_DESC_por_ceuta_mod: "La puerta africana Ceuta se convirtió en punto de partida de la expansión ultramarina de Portugal."
 STATIC_MODIFIER_NAME_por_tangier_mod: "Tánger conquistada"
 STATIC_MODIFIER_DESC_por_tangier_mod: "El Estrecho de Gibraltar tomado, control de la travesía africana establecido."
 STATIC_MODIFIER_NAME_por_morocco_mod: "Fortalezas marroquíes"
 STATIC_MODIFIER_DESC_por_morocco_mod: "Puntos finales del Sáhara subyugados: la influencia portuguesa se extiende por el norte de África."
 STATIC_MODIFIER_NAME_por_madeira_mod: "Madeira desarrollada"
 STATIC_MODIFIER_DESC_por_madeira_mod: "La primera colonia del Atlántico, Madeira, estableció el modelo de plantaciones azucareras."
 STATIC_MODIFIER_NAME_por_azores_mod: "Las Azores"
 STATIC_MODIFIER_DESC_por_azores_mod: "Las Azores, en medio del Atlántico, aseguradas como base de transbordo transatlántica."
 STATIC_MODIFIER_NAME_por_guinea_trade_mod: "Comercio con Guinea"
 STATIC_MODIFIER_DESC_por_guinea_trade_mod: "Sacos de oro en polvo y marfil, llegando de los puertos de Guinea, llenan cada día los libros de la cámara comercial real de Lisboa."
 STATIC_MODIFIER_NAME_por_gold_coast_mod: "La Costa de Oro"
 STATIC_MODIFIER_DESC_por_gold_coast_mod: "El oro de la fortaleza de Elmina enriqueció la economía portuguesa."
 STATIC_MODIFIER_NAME_por_sao_tome_mod: "El azúcar de Santo Tomé"
 STATIC_MODIFIER_DESC_por_sao_tome_mod: "La ecuatorial Santo Tomé se convirtió en el mayor proveedor de azúcar a Europa."
 STATIC_MODIFIER_NAME_por_angola_mod: "La colonia de Angola"
 STATIC_MODIFIER_DESC_por_angola_mod: "Angola establecida como cabeza de puente centro-occidental africana de Portugal."
 STATIC_MODIFIER_NAME_por_east_africa_mod: "Puestos comerciales del África oriental"
 STATIC_MODIFIER_DESC_por_east_africa_mod: "La red del comercio de oro y marfil de la costa suajili tomada por Portugal."
 STATIC_MODIFIER_NAME_por_mombasa_mod: "El fuerte de Mombasa"
 STATIC_MODIFIER_DESC_por_mombasa_mod: "La mayor ciudad comercial del África oriental, Mombasa, ha caído bajo control portugués."
 STATIC_MODIFIER_NAME_por_goa_mod: "Goa, capital oriental"
 STATIC_MODIFIER_DESC_por_goa_mod: "La capital del Estado de la India, Goa, se ha convertido en el centro del comercio del Océano Índico."
 STATIC_MODIFIER_NAME_por_malabar_mod: "Las especias de la Costa de Malabar"
 STATIC_MODIFIER_DESC_por_malabar_mod: "La Costa de Malabar, que produce pimienta, cardamomo y jengibre, bajo control portugués."
 STATIC_MODIFIER_NAME_por_hormuz_mod: "Ormuz subyugada"
 STATIC_MODIFIER_DESC_por_hormuz_mod: "La entrada del Golfo Pérsico, Ormuz, tomada: comercio persa-indio subyugado."
 STATIC_MODIFIER_NAME_por_spice_monopoly_mod: "Monopolio de las especias"
 STATIC_MODIFIER_DESC_por_spice_monopoly_mod: "Las rutas comerciales de especias del Océano Índico plenamente bajo control portugués."
 STATIC_MODIFIER_NAME_por_indian_ocean_mod: "El Imperio del Océano Índico"
