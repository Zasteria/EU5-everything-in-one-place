l_spanish:
 wal_wallachia_mission_pack: "La Orden del Dragón: guardián del Danubio"
 wal_wallachia_mission_pack_DESCRIPTION:0 "Valaquia, encajada entre los Montes Cárpatos y el Danubio. Doma a la nobleza boyarda y une los principados rumanos junto a Moldavia y Transilvania, o alza el estandarte de la Orden del Dragón y declara la guerra al Imperio otomano para construir un imperio danubiano."
 wal_wallachia_mission_pack_CRITERIA_DESCRIPTION:0 "Fortalece el voivodato, une los principados rumanos y derrota al Imperio otomano para completar un imperio danubiano."
 wal_wallachia_mission_pack_BUTTON_TOOLTIP:0 "Continúa la voluntad del Empalador y conviértete en guardián del Danubio."
 wal_wallachia_mission_pack_BUTTON_DETAILS:0 "“Somos los hijos del Dragón”: ¡lobos de los Cárpatos, alzad la cruz!"
 wal_voivode_beginnings: "El amanecer del voivodato"
 wal_voivode_beginnings_desc: "En 1330, Basarab I rechazó al rey de Hungría en la batalla de Posada: hereda su espíritu de independencia y asienta los cimientos de un nuevo principado entre los Cárpatos y el Danubio."
 wal_voivode_authority: "La autoridad del voivoda"
 wal_voivode_authority_desc: "El trono del voivoda, elegido por aclamación de la nobleza boyarda: asegura esta autoridad y evita el caos de la sucesión disputada."
 wal_boyar_council: "El Consejo de los Boyardos"
 wal_boyar_council_desc: "La asamblea de los grandes boyardos terratenientes: sin su apoyo, Valaquia no puede ser gobernada. Estabiliza las relaciones con el consejo."
 wal_found_bucharest: "Funda Bucarest"
 wal_found_bucharest_desc: "Giurgiu, cerca del Danubio, donde el voivoda ha mantenido su corte de verano. Desarrolla este lugar como “Bucureşti”, bastión de la defensa y del comercio del sur."
 wal_targoviste_dev: "Desarrolla Târgovişte"
 wal_targoviste_dev_desc: "Târgovişte, la antigua capital construida al pie de los Cárpatos, sede de generaciones de voivodas: trae a esta ciudad nueva prosperidad."
 wal_fortify_carpathians: "Fortifica los Cárpatos"
 wal_fortify_carpathians_desc: "Los Montes Cárpatos, que se extienden de sur a norte: refuerza esta muralla natural con fortalezas hechas por el hombre, construyendo una línea de defensa que ningún invasor pueda romper."
 wal_orthodox_church: "Protege la Iglesia ortodoxa"
 wal_orthodox_church_desc: "La Iglesia ortodoxa, heredera de la fe bizantina: ponte a la cabeza de su patriarcado autocéfalo y presta legitimidad religiosa a la autoridad del voivoda."
 wal_dregatori: "Nombra a los dregatori"
 wal_dregatori_desc: "La tiranía de los nobles hereditarios es enemiga del Estado. Nombra “dregatori”, funcionarios elegidos por habilidad y no por linaje, y construye una administración leal a la corona."
 wal_unite_voivodes: "Une a los voivodas"
 wal_unite_voivodes_desc: "Valaquia y Moldavia, dos principados rumanos y, sin embargo, aún divididos, cuya rivalidad solo sirve a nuestros enemigos. Cualquier potencia que ostente un punto de apoyo en Moldavia puede ahora reivindicar legítimamente toda esa tierra."
 wal_subdue_moldavia: "Subyuga Moldavia"
 wal_subdue_moldavia_desc: "La gloria de Esteban el Grande pertenece ahora al pasado: trae el Principado de Moldavia al gobierno valaco y asienta la piedra angular de la unidad rumana."
 wal_conquer_transylvania: "Conquista Transilvania"
 wal_conquer_transylvania_desc: "Transilvania, largo tiempo gobernada por los reyes de Hungría y sus sucesores: trae esta tierra al dominio de Valaquia y pon fin a la injerencia extranjera."
 wal_szekely_land: "La tierra de los székelys"
 wal_szekely_land_desc: "Los székelys, pueblo guerrero de la Transilvania oriental: respeta su autonomía y su tradición marcial y haz de su valor la fuerza de Valaquia."
 wal_saxon_towns: "Integra las ciudades sajonas"
 wal_saxon_towns_desc: "Brașov, Sibiu y las demás ciudades sajonas de Transilvania: haz de estas ciudades, prósperas desde tiempos medievales, el pilar de la economía del reino."
 wal_secure_danube: "Asegura el Danubio"
 wal_secure_danube_desc: "El gran río Danubio, que divide los Balcanes de los Cárpatos: asegura sus orillas como línea vital de la defensa y del comercio del sur."
 wal_carpathian_hegemony: "Hegemonía cárpata concluida"
 wal_carpathian_hegemony_desc: "Ha llegado la hora de que toda la tierra entre los Cárpatos y el Danubio se someta a la autoridad del voivoda."
 wal_romanian_unity: "Unidad rumana concluida"
 wal_romanian_unity_desc: "Valaquia, Moldavia, Transilvania: une por fin las tierras largamente divididas del pueblo rumano bajo una sola corona."
 wal_order_of_dragon_founding: "Únete a la Orden del Dragón"
 wal_order_of_dragon_founding_desc: "El emperador del Sacro Imperio Romano, Segismundo, funda la Orden del Dragón sobre el ideal de cruzada contra los otomanos: que nuestro propio gobernante ocupe un lugar entre esta ilustre hermandad."
 wal_impale_the_sultan: "Empala al sultán"
 wal_impale_the_sultan_desc: "El sultán se cree a salvo, escondido tras sus murallas y sus legiones. En el campo de batalla contra los ejércitos del islam, que aprenda en su propia carne que nadie puede esconderse del juicio divino."
 wal_drive_out_turks: "Expulsa a los turcos"
 wal_drive_out_turks_desc: "Ha llegado la hora de liberar a los pueblos griego y búlgaro de la opresión. Empuja a los invasores turcos de vuelta a la lejana orilla del Bósforo."
 wal_liberate_serbia: "Libera Serbia"
 wal_liberate_serbia_desc: "Nuestros hermanos serbios, que sufren bajo el yugo otomano desde la derrota de Kosovo: libéralos y conviértete en guardián de los Balcanes ortodoxos."
 wal_reclaim_morea: "Recupera la Moreia"
 wal_reclaim_morea_desc: "El Despotado de la Moreia, donde ardió antaño la última luz de Bizancio: recupera este rincón del Peloponeso de manos de los infieles."
 wal_heir_of_rome: "Heredero de Roma"
 wal_heir_of_rome_desc: "Lo que el Imperio bizantino nunca logró, la derrota total y la expulsión del infiel de Europa, nosotros lo hemos cumplido. Nadie es más digno del manto de Roma que nosotros."
 wal_bulwark_of_christendom: "Baluarte de la cristiandad"
 wal_bulwark_of_christendom_desc: "Los principados rumanos son el baluarte de la cristiandad. Fortificar nuestras fronteras es nuestro deber ante Dios."
 wal_ottoman_downfall: "La caída de los otomanos"
 wal_ottoman_downfall_desc: "El Imperio otomano, antaño dominante en los Balcanes y en Oriente Medio: su amenaza ha sido por fin relegada a la historia."
 wal_reclaim_constantinople: "Recupera Constantinopla"
 wal_reclaim_constantinople_desc: "Constantinopla, largo tiempo caída en manos del infiel: como herederos de la Orden del Dragón, libera esta ciudad imperial."
 wal_danubian_empire: "El Imperio danubiano concluido"
 wal_danubian_empire_desc: "De los Cárpatos a los Balcanes y hasta el Bósforo: esta lucha, iniciada con la venganza del Empalador, termina con la conclusión de un gran imperio que gobierna el Danubio."
 wal_danube_trade: "La ruta comercial del Danubio"
 wal_danube_trade_desc: "La ruta comercial que une la Europa occidental y el Mar Negro a lo largo del Danubio: atrae este flujo de riqueza al tesoro de Valaquia."
 wal_treasury: "Construye un tesoro"
 wal_treasury_desc: "Guerra, diplomacia, mantenimiento de la corte: todo asunto de Estado exige oro. Construye un tesoro lleno y prepárate para cualquier penuria."
 wal_manufactories: "Desarrolla las manufacturas"
 wal_manufactories_desc: "Una gran transformación avanza en el campo de la producción: invierte sin vacilar en manufacturas y prepárate para la era de la industria."
 wal_events.2.t: "Constantinopla recuperada"
 wal_events.2.d: "La gran ciudad imperial de Constantinopla ha caído por fin en nuestras manos. El estandarte de la Orden del Dragón ondea ahora sobre esta ciudad, antaño en poder del infiel."
 wal_events.2.a: "¡La ciudad de Roma es nuestra!"
 wal_events.99.t: "Proclamación del Imperio danubiano"
 wal_events.99.d: "Un pequeño principado al pie de los Cárpatos ha renacido como un gran imperio que gobierna el Danubio y los Balcanes. La voluntad del Empalador ha sido, por fin, plenamente realizada."
 wal_events.99.a: "¡Gloria al Imperio danubiano!"
 STATIC_MODIFIER_NAME_wal_voivode_beginnings_mod: "El amanecer del voivodato"
 STATIC_MODIFIER_DESC_wal_voivode_beginnings_mod: "El recuerdo del día en que Basarab I se negó a arrodillarse ante un soberano extranjero es el orgullo de los soldados de Valaquia."
 STATIC_MODIFIER_NAME_wal_voivode_mod: "La autoridad del voivoda"
 STATIC_MODIFIER_DESC_wal_voivode_mod: "El trono del voivoda es estable, y la confianza en la sucesión ha crecido."
 STATIC_MODIFIER_NAME_wal_boyar_mod: "El Consejo de los Boyardos"
 STATIC_MODIFIER_DESC_wal_boyar_mod: "Las relaciones con la nobleza boyarda son estables, reforzando el cimiento del gobierno."
 STATIC_MODIFIER_NAME_wal_bucharest_mod: "Bucarest fundada"
 STATIC_MODIFIER_DESC_wal_bucharest_mod: "Giurgiu desarrollada como “Bucureşti”, bastión del sur."
 STATIC_MODIFIER_NAME_wal_targoviste_mod: "Târgovişte desarrollada"
 STATIC_MODIFIER_DESC_wal_targoviste_mod: "La antigua capital Târgovişte sigue prosperando."
 STATIC_MODIFIER_NAME_wal_carpathians_mod: "La red de fortalezas de los Cárpatos"
 STATIC_MODIFIER_DESC_wal_carpathians_mod: "Una red de fortalezas en las montañas repele a cualquier invasor."
 STATIC_MODIFIER_NAME_wal_church_mod: "Protección de la Iglesia ortodoxa"
 STATIC_MODIFIER_DESC_wal_church_mod: "La Iglesia ortodoxa valaca está bajo protección del Estado, elevando la legitimidad religiosa."
 STATIC_MODIFIER_NAME_wal_impale_mod: "Empala al sultán"
 STATIC_MODIFIER_DESC_wal_impale_mod: "El rumor de la hilera de estacas, alzada ante los enviados del sultán, aún hiela los corazones de los ejércitos del islam."
 STATIC_MODIFIER_NAME_wal_dregatori_mod: "Dregatori nombrados"
 STATIC_MODIFIER_DESC_wal_dregatori_mod: "Funcionarios elegidos por habilidad sustentan ahora una administración leal."
 STATIC_MODIFIER_NAME_wal_moldavia_mod: "Moldavia subyugada"
 STATIC_MODIFIER_DESC_wal_moldavia_mod: "El Principado de Moldavia ha sido traído al gobierno valaco."
 STATIC_MODIFIER_NAME_wal_transylvania_mod: "Transilvania conquistada"
 STATIC_MODIFIER_DESC_wal_transylvania_mod: "Transilvania ha sido traída al dominio de Valaquia."
 STATIC_MODIFIER_NAME_wal_szekely_mod: "El valor de los székelys"
 STATIC_MODIFIER_DESC_wal_szekely_mod: "Los guerreros montañeses de las tierras székely alinean sus lanzas bajo los estandartes de Valaquia."
 STATIC_MODIFIER_NAME_wal_saxon_mod: "Prosperidad de las ciudades sajonas"
 STATIC_MODIFIER_DESC_wal_saxon_mod: "Las ciudades sajonas de Transilvania se han convertido en el pilar de la economía del reino."
 STATIC_MODIFIER_NAME_wal_danube_mod: "El Danubio asegurado"
 STATIC_MODIFIER_DESC_wal_danube_mod: "Las orillas del Danubio aseguradas, abriendo una línea vital de comercio."
 STATIC_MODIFIER_NAME_wal_hegemony_mod: "Hegemonía cárpata"
 STATIC_MODIFIER_DESC_wal_hegemony_mod: "La tierra entre los Cárpatos y el Danubio se somete plenamente a la autoridad del voivoda."
 STATIC_MODIFIER_NAME_wal_unity_mod: "Unidad rumana"
 STATIC_MODIFIER_DESC_wal_unity_mod: "Valaquia, Moldavia y Transilvania unidas bajo una sola corona."
 STATIC_MODIFIER_NAME_wal_order_of_dragon_mod: "Miembro de la Orden del Dragón"
 STATIC_MODIFIER_DESC_wal_order_of_dragon_mod: "Enviados que portan la insignia de la Orden del Dragón viajan por las cortes de la cristiandad, ampliando el círculo de alianza contra los otomanos."
 STATIC_MODIFIER_NAME_wal_drive_out_mod: "Turcos expulsados"
 STATIC_MODIFIER_DESC_wal_drive_out_mod: "La guerra contra el infiel ha probado la fuerza de nuestro ejército."
 STATIC_MODIFIER_NAME_wal_serbia_mod: "Serbia liberada"
 STATIC_MODIFIER_DESC_wal_serbia_mod: "Nuestros hermanos serbios liberados, elevando nuestra posición en los Balcanes ortodoxos."
 STATIC_MODIFIER_NAME_wal_morea_mod: "Moreia recuperada"
 STATIC_MODIFIER_DESC_wal_morea_mod: "Cargamentos de vino y seda de los puertos del Peloponeso llenan los almacenes de los mercaderes valacos."
 STATIC_MODIFIER_NAME_wal_heir_of_rome_mod: "Heredero de Roma"
 STATIC_MODIFIER_DESC_wal_heir_of_rome_mod: "En la corte valaca, que reivindica la sucesión de los emperadores bizantinos, clero y nobles inclinan por igual la cabeza, sin dudar de su legitimidad."
 STATIC_MODIFIER_NAME_wal_bulwark_mod: "Baluarte de la cristiandad"
 STATIC_MODIFIER_DESC_wal_bulwark_mod: "La red de fortalezas fronterizas sirve ahora de escudo a la cristiandad."
 STATIC_MODIFIER_NAME_wal_downfall_mod: "La caída de los otomanos"
 STATIC_MODIFIER_DESC_wal_downfall_mod: "En fronteras ya no asoladas por incursiones otomanas, los soldados se muestran con orgullo unos a otros el adiestramiento que han perfeccionado."
 STATIC_MODIFIER_NAME_wal_manufactories_mod: "Manufacturas desarrolladas"
 STATIC_MODIFIER_DESC_wal_manufactories_mod: "De las chimeneas de los talleres de Bucarest sube el humo incesante de nuevo paño y herramientas en producción."
 STATIC_MODIFIER_NAME_wal_trade_mod: "La ruta comercial del Danubio"
 STATIC_MODIFIER_DESC_wal_trade_mod: "Una red comercial a lo largo del Danubio protege la riqueza del Estado."
 STATIC_MODIFIER_NAME_wal_treasury_mod: "Un tesoro lleno"
 STATIC_MODIFIER_DESC_wal_treasury_mod: "Cofres de monedas de plata se apilan en las bóvedas del palacio, y los mercaderes comercian sin dudar del peso de la moneda."
 STATIC_MODIFIER_NAME_wal_danubian_empire_mod: "La red de gobierno del Imperio danubiano"
 STATIC_MODIFIER_DESC_wal_danubian_empire_mod: "El propio Danubio se ha vuelto savia del imperio, y sus aguas llevan ejércitos río arriba y río abajo con facilidad. La legitimidad de la dinastía es inquebrantable, y el poder de la corona alcanza todos los rincones del reino."
