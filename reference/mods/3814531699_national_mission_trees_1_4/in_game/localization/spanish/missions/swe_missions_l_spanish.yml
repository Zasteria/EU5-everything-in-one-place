l_spanish:
 swe_stormaktstiden_mission_pack: "Stormaktstiden: la era de las grandes potencias de Suecia"
 swe_stormaktstiden_mission_pack_DESCRIPTION:0 "En 1337, Suecia es un reino independiente en unión personal con Noruega bajo el rey Magnus Eriksson. Al norte está la poderosa Dinamarca, y la lucha por la dominación escandinava —presagiada por la Unión de Kalmar (1397)— es inevitable. Mediante el cobre de Falun, el dominio del Báltico y las rutas orientales varegas, realiza la Stormaktstiden (era de las grandes potencias) y construye el Imperio sueco."
 swe_stormaktstiden_mission_pack_CRITERIA_DESCRIPTION:0 "Como Suecia, alcanza la dominación escandinava, la unificación, la expansión oriental y el desarrollo industrial, para establecer el Imperio escandinavo."
 swe_stormaktstiden_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para construir el Imperio sueco."
 swe_stormaktstiden_mission_pack_BUTTON_DETAILS:0 "De la revuelta de Engelbrekt a la Stormaktstiden: ¡forja Suecia en un Imperio!"
 swe_kingdom_of_sweden: "El Reino de Suecia"
 swe_kingdom_of_sweden_desc: "En 1337, Suecia es un reino independiente en unión personal con Noruega bajo el rey Magnus Eriksson. Rodeada de la poderosa Dinamarca al norte, de los principados rusos al este y de la Hansa al sur, Suecia debe reforzar su legitimidad y estabilizar su reino, preparándose para la lucha que vendrá por la dominación escandinava."
 swe_norway_union: "Unión personal con Noruega"
 swe_norway_union_desc: "Suecia y Noruega están en unión personal bajo el rey Magnus desde 1319. Reforzar esta unión combina la fuerza militar y económica del noroeste de Escandinavia contra Dinamarca."
 swe_break_from_denmark: "Opónte a Dinamarca"
 swe_break_from_denmark_desc: "La venidera Unión de Kalmar (1397) amenaza con dar a Dinamarca la dominación de Escandinavia: un futuro que Suecia debe evitar. Afirma activamente la autoridad sueca contra Dinamarca ahora y asegura la base para reclamar la dominación escandinava. Adelántate al espíritu de la revuelta de Engelbrekt (1434) y establece la autoridad real sueca antes de que llegue ese día."
 swe_control_skaane: "Controla Escania"
 swe_control_skaane_desc: "Escania: la región más meridional de Suecia, disputada desde hace mucho con Dinamarca. Tomar Malmö y Escania garantiza el estrecho del Øresund y da a Suecia libre salida al Báltico."
 swe_defeat_denmark: "Derrota a Dinamarca"
 swe_defeat_denmark_desc: "Dinamarca es la mayor enemiga de Suecia. Tomar Copenhague o convertir a Dinamarca en vasalla sueca significa que el dominio del Norte pasa a Suecia. “Suecia, verdadera líder de Escandinavia”: la posición con que soñó Gustavo Vasa está aquí realizada."
 swe_integrate_norway: "Integra Noruega"
 swe_integrate_norway_desc: "Poseer directamente Oslo, Bergen y Nidaros integra por completo Noruega como parte del Imperio sueco. Las ricas pesquerías de Noruega y la puerta al Atlántico Norte amplían enormemente el poder sueco."
 swe_unite_scandinavia: "Une Escandinavia"
 swe_unite_scandinavia_desc: "Dinamarca aplastada, Noruega integrada: toda Escandinavia está unida bajo el estandarte sueco. Esta hazaña —unir toda Escandinavia, algo que nadie había logrado desde los vikingos— se realiza aquí."
 swe_danish_navy_seizure: "Captura la flota danesa"
 swe_danish_navy_seizure_desc: "Con Dinamarca derrotada, su poderosa flota pasa a Suecia. La más fuerte fuerza naval del Báltico está ahora en manos suecas, abriendo el camino a la dominación del Mar del Norte."
 swe_danish_navy_seizure_unlock_tt: "La decisión «Incorporar la flota danesa» ya está disponible."
 swe_danish_fleet_decision.title: "Incorporar la flota danesa"
 swe_danish_fleet_decision.desc: "Los barcos daneses capturados yacen ociosos en los puertos del reino derrotado. Dotarlos de tripulación y reequiparlos costará caro al tesoro e inquietará al reino, pero seis grandes carracas bajo bandera sueca cambiarían el equilibrio del Báltico."
 swe_danish_fleet_decision.a: "Poner en servicio las seis carracas."
 swe_sound_toll: "El peaje del Øresund"
 swe_sound_toll_desc: "Con Escania asegurada, Suecia controla ahora el estrecho del Øresund por el lado sueco. Cobrar el peaje del Øresund en lugar de Dinamarca genera enormes ingresos."
 swe_control_gotland: "Controla Gotland"
 swe_control_gotland_desc: "Visby, en Gotland, es una de las mayores ciudades comerciales del Báltico. Tomar este premio —disputado con Dinamarca, la Hansa y la Orden Livona— establece la cabeza de puente de Suecia en el comercio báltico."
 swe_baltic_trade: "Comercio báltico"
 swe_baltic_trade_desc: "Usando Gotland como base, Suecia entra seriamente en el comercio báltico. Los varegos ya llevaron mercancías desde Suecia hasta Bizancio. Resucita esta tradición y crea una era de mercaderes suecos que dominan el Báltico."
 swe_conquer_estonia: "Conquista Estonia"
 swe_conquer_estonia_desc: "Tallin (Reval) fue originalmente construida por los daneses, pero Suecia conquistará Estonia en la guerra de Livonia (1558-83). Adelántate a esta conquista histórica y establece la cabeza de puente de Suecia en la costa este del Báltico."
 swe_control_livonia: "Controla Livonia"
 swe_control_livonia_desc: "Tomar Riga y Tartu (Dorpat) pone toda la costa este del Báltico bajo control sueco. En medio de la rivalidad con Polonia, Rusia y Dinamarca, Suecia se convierte en el supremo señor de Livonia."
 swe_varangian_legacy: "El legado varego"
 swe_varangian_legacy_desc: "En los siglos VIII-X, los varegos (vikingos) construyeron Nóvgorod y abrieron rutas comerciales por el Dniéper hasta Constantinopla. Tomar Nóvgorod y Pskov resucita este antiguo legado en nuestros días."
 swe_city_of_rus: "La ciudad de la Rus"
 swe_city_of_rus_desc: "Moscú es la capital del Gran Principado de Moscú y el centro del mundo ruso. Como heredera de los varegos, Suecia, controlando Moscú, completa el Imperio sueco, que se extiende del Báltico a toda la civilización eslava oriental."
 swe_bane_of_hansa: "El azote de la Hansa"
 swe_bane_of_hansa_desc: "La Liga Hanseática ha monopolizado el comercio báltico, pero surgen grietas a medida que Suecia se expande. Controla Lübeck (líder de la Hansa) o deshaz por completo la Liga Hanseática, para transferir a Suecia el papel principal en el comercio báltico."
 swe_pomeranian_coast: "La costa de Pomerania"
 swe_pomeranian_coast_desc: "Tomar Stralsund y Stettin pone la costa de Pomerania, a lo largo del Báltico meridional, bajo control sueco. Adelántate a lo que Suecia realmente conquistó en la Guerra de los Treinta Años (1618-48) y asegura esta región."
 swe_prussian_ambition: "Ambiciones prusianas"
 swe_prussian_ambition_desc: "Prusia, antaño gobernada por los caballeros teutónicos, es el nudo báltico sudeste. Asegurar Königsberg y la región de Prusia da a Suecia pleno dominio del Mar Báltico."
 swe_dominium_maris_baltici: "Dominium Maris Baltici"
 swe_dominium_maris_baltici_desc: "“Dominium Maris Baltici” (Dominio del Mar Báltico): el supremo objetivo estratégico de Suecia en el siglo XVII. Dominar toda la línea costera báltica hace de este mar interior un “lago” sueco."
 swe_secure_stockholm: "Asegura Estocolmo"
 swe_secure_stockholm_desc: "Estocolmo, “isla entre las aguas”: ciudad-fortaleza natural entre el lago Mälaren y el Báltico. Elevarla al rango de ciudad con desarrollo 30+ la establece como centro del poder real sueco."
 swe_falun_mine: "La mina de Falun"
 swe_falun_mine_desc: "Stora Kopparberget (Gran Montaña de Cobre): la mina de cobre de Falun opera desde el siglo IX, corazón de la economía sueca. Cuando Magnus IV concedió privilegios adicionales a la compañía minera en 1347, esta cubría dos tercios de la demanda europea de cobre. Maximiza esta mina."
 swe_iron_industry: "La industria sueca del hierro"
 swe_iron_industry_desc: "Las minas de hierro de Svealand son la base de la industria de defensa sueca. El hierro sueco de alta calidad era codiciado por los ejércitos de toda Europa: los cañones de la Guerra de los Treinta Años usaron hierro sueco. Amplía aún más esta ventaja industrial."
 swe_swedish_steel: "El acero sueco"
 swe_swedish_steel_desc: "El acero sueco, aclamado como el de mejor calidad de Europa. La industria del acero, sustentada por la abundante producción de cobre y hierro, simboliza el poder económico del Imperio sueco, tanto en el armamento de los ejércitos suecos como en los ingresos de exportación."
 swe_riksdag: "El Riksdag"
 swe_riksdag_desc: "El Riksdag (Parlamento), convocado por primera vez en 1435 en Suecia. Esta asamblea de estamentos de nobles, caballeros, clero y campesinos (peculiarmente, los campesinos suecos tenían su propia representación estamental) debe fortalecerse para establecer la singular tradición política de Suecia."
 swe_absolutism: "Absolutismo"
 swe_absolutism_desc: "En 1680, Carlos XI recuperó las tierras nobles mediante la “reducción” y estableció la monarquía absoluta en Suecia. Adelántate a esta transformación histórica y consolida por completo la autoridad real."
 swe_great_power: "Suecia como gran potencia"
 swe_great_power_desc: "La Stormaktstiden del siglo XVII vio a Suecia alzarse como principal potencia europea bajo Gustavo Adolfo, Carlos X Gustavo y Carlos XII. Adelántate a esta era con vasto territorio, ricos ingresos y alto prestigio."
 swe_stormakt_economy: "La economía de la gran potencia"
 swe_stormakt_economy_desc: "Acero sueco, eficiencia administrativa de la monarquía absoluta, comercio báltico: la base económica de la Stormaktstiden concluida. Demuestra el poder imperial sueco con ingresos mensuales de 400+ y numerosos centros comerciales."
 swe_religious_crossroads: "La encrucijada de la fe"
 swe_religious_crossroads_desc: "La tormenta de la Reforma barre Escandinavia. La corte sueca debate con ardor: mantener la fidelidad al papa de Roma, adoptar la revolucionaria doctrina de Martín Lutero o volver a los antiguos dioses venerados por los ancestros. La decisión del rey sueco decidirá el futuro de este reino nórdico."
 swe_catholic_sweden: "La Suecia católica"
 swe_catholic_sweden_desc: "El Reino de Suecia mantiene fidelidad a la Iglesia de Roma. Las estrechas relaciones con el papa dan a Suecia ventaja diplomática y el reconocimiento de guardiana de la civilización católica del norte."
 swe_northern_crusade: "La Cruzada del Norte"
 swe_northern_crusade_desc: "Suecia participa en la guerra santa como escudo septentrional de la cristiandad. Liderar las cruzadas del norte contra naciones no cristianas eleva la autoridad religiosa y el prestigio de Suecia."
 swe_church_reform: "Campeona del papa"
 swe_church_reform_desc: "Profunda confianza con el papado y control de Lübeck: Suecia ha establecido la posición inquebrantable de guardiana de la civilización católica del norte."
 swe_reformation: "La Reforma"
 swe_reformation_desc: "En 1527, el rey sueco Gustavo Vasa declaró el luteranismo religión de Estado de facto en la dieta de Västerås. La transferencia de los bienes de la iglesia a la corona fortaleció enormemente las finanzas del Estado. Adelántate ahora a este acto decisivo."
 swe_protestant_reform: "La Iglesia protestante"
 swe_protestant_reform_desc: "Desarrolla universidades para formar teólogos luteranos y arraigar la fe protestante en toda Suecia. La distinción de la iglesia sueca se convierte en la base de la cultura y la identidad suecas."
 swe_protestant_empire: "El Imperio protestante"
 swe_protestant_empire_desc: "El luteranismo impregna toda Escandinavia. El rey sueco reina como defensor septentrional del mundo protestante, capaz de enfrentarse a las potencias católicas del sur, como en la Guerra de los Treinta Años."
 swe_norse_revival: "El renacimiento de la fe nórdica"
 swe_norse_revival_desc: "Los dioses de los ancestros —Odín, Thor, Freyr— renacen. El rostro de Escandinavia antes de la cristianización se recrea en nuestros días. El rey sueco, reinando como representante de los dioses nórdicos: esta elección revolucionaria sacudirá a toda Europa."
 swe_berserker_army: "El ejército berserker"
 swe_berserker_army_desc: "El espíritu de los guerreros-oso de la era vikinga renace. Guerreros devotos de los dioses nórdicos, soltados como corsarios, libres para devastar las costas de los infieles."
 swe_yggdrasil_throne: "El trono de Yggdrasil"
 swe_yggdrasil_throne_desc: "Como Odín sentado en las raíces del Árbol del Mundo, el emperador sueco reina en el centro del mundo del norte. Con rango imperial y 300+ provincias, el imperio septentrional, bendecido por los dioses nórdicos, está completo."
 swe_finland_integration: "Integra Finlandia"
 swe_finland_integration_desc: "Finlandia forma parte de Suecia desde el siglo XII. Poseer directamente Turku, Víborg y Uleåborg establece la cabeza de puente de Suecia hacia el Atlántico Norte y el Mar de Barents."
 swe_lapland_expansion: "Expansión lapona"
 swe_lapland_expansion_desc: "Los vastos bosques de Norrland (norte de Suecia) son el hogar del pueblo sami. Incorporar sus tierras al reino y asegurar abundantes recursos de madera, pieles y mineral de hierro inicia el desarrollo serio de la frontera septentrional de Suecia."
 swe_arctic_empire: "El Imperio ártico"
 swe_arctic_empire_desc: "Expandiéndote hacia el Mar de Noruega y el Mar de Barents, con Uleåborg como centro, Suecia se convierte en un imperio septentrional que se extiende hasta el Círculo Polar Ártico. Se establecen gobernadores marítimos y se amplía la presencia naval para completar la frontera norte del Imperio sueco."
 swe_develop_stockholm: "La Gran Estocolmo"
 swe_develop_stockholm_desc: "Estocolmo se ha desarrollado en una gran ciudad con universidad. Esta ciudad, que une el Báltico y el Mar del Norte, se alza como la mayor ciudad de Europa septentrional, centro cultural, comercial y político del Imperio sueco."
 swe_develop_goteborg: "Desarrolla Gotemburgo"
 swe_develop_goteborg_desc: "Gotemburgo fue construida por Gustavo Adolfo en 1621 como puerto marítimo occidental de Suecia. Elevarla al rango de ciudad abre una ruta comercial directa con Dinamarca, los Países Bajos e Inglaterra."
 swe_peasant_support: "Apoyo del campesinado"
 swe_peasant_support_desc: "El estamento campesino de Suecia tiene su propia representación en el Riksdag: rasgo singular. Elevar la satisfacción de los campesinos y ampliar la producción de grano establece la estabilidad social y la singular tradición democrática de Suecia."
 swe_engelbrekt: "El espíritu de Engelbrekt"
 swe_engelbrekt_desc: "En 1434-36, Engelbrekt Engelbrektsson lideró a mineros y campesinos en la revuelta contra el dominio danés. Fue asesinado, pero su espíritu se convirtió en símbolo eterno del movimiento de liberación sueco. Encarna formalmente este espíritu ahora."
 swe_colonization: "El Imperio colonial sueco"
 swe_colonization_desc: "Suecia también construyó colonias en el siglo XVII, incluida Nueva Suecia (región del río Delaware). Apoyándote en el desarrollo de Finlandia, inicia empresas coloniales ultramarinas y amplía el alcance del Imperio sueco a todo el mundo."
 swe_develop_uppsala: "La Universidad de Upsala prospera"
 swe_develop_uppsala_desc: "La Universidad de Upsala (fundada en 1477), la más antigua de Suecia, produjo a Carl Linneo (taxonomía) y Anders Celsius (termómetro): la mejor academia de Europa septentrional. Desarrolla esta universidad y refuerza la base del saber sueco."
 swe_karoliner: "Los karoliner"
 swe_karoliner_desc: "Los karoliner (soldados del rey Carlos) eran la infantería de élite del Imperio sueco bajo Carlos XII a principios del siglo XVIII, conocida como la más fuerte infantería de su época. Desarrolla alta tradición militar y gran ejército para adelantarte a este cuerpo de élite."
 swe_amber_trade: "Comercio de ámbar"
 swe_amber_trade_desc: "El ámbar del Báltico, exportado de territorios controlados por Suecia a toda Europa: el “Oro del Norte”. Apoyándote en la base económica de la gran potencia y ampliando más el comercio de ámbar, refuerza los ingresos comerciales del Imperio sueco."
 swe_stormaktstiden: "Stormaktstiden"
 swe_stormaktstiden_desc: "Escandinavia unida, Báltico conquistado, economía de gran potencia alcanzada: tres pilares se juntan, y Suecia alcanza el apogeo de la Stormaktstiden (era de las grandes potencias). Con 600+ provincias, ingresos de 600+ y prestigio de 80+, conquista esta gloria."
 swe_swedish_empire: "El Imperio sueco"
 swe_swedish_empire_desc: "Del Báltico a Moscú, de Escandinavia a Prusia: el Imperio sueco está concluido. El camino de Suecia, iniciado en 1337 con la unión personal con Noruega, termina aquí con la llegada de un gran imperio que domina toda Europa septentrional. “Suecia ríe la última”: las palabras de Carlos XII están aquí realizadas."
 swe_events.30.t: "Unidad escandinava: amanecer de la Stormaktstiden"
 swe_events.30.d: "Dinamarca aplastada, Noruega integrada: toda Escandinavia está unida bajo el estandarte sueco. Esta hazaña, no alcanzada desde los vikingos, se realiza por fin. El rey sueco proclama ahora el título de “Rey de Escandinavia”, y comienza la construcción del mayor Estado de Europa septentrional. “El sueño de Engelbrekt se realizó hoy aquí”, escribirán los futuros historiadores."
 swe_events.30.a: "¡Viva Escandinavia! ¡La unidad del Norte para siempre!"
 swe_events.40.t: "La encrucijada de la fe: la elección religiosa de Suecia"
 swe_events.40.d: "La tormenta de la Reforma barre Escandinavia. La corte sueca debate con ardor. ¿Mantener la fidelidad al papa en Roma, adoptar la revolucionaria doctrina de Lutero o volver a los antiguos dioses venerados por los ancestros? La decisión del rey sueco decidirá el futuro de este reino nórdico."
 swe_events.40.a: "Mantener la fidelidad a Roma: el catolicismo es el alma de Suecia"
 swe_events.40.b: "Adoptar la doctrina de Lutero: ha llegado la era de la reforma"
 swe_events.40.c: "Volver a los antiguos dioses: buscar la bendición de Odín"
 swe_events.99.t: "Nace el Imperio sueco"
 swe_events.99.d: "Del Báltico a Moscú, de Escandinavia a Prusia: el Imperio sueco está por fin concluido. Desde el camino de Suecia, iniciado en 1337 con la unión personal con Noruega, Suecia se ha transformado de nación periférica del norte en un gran imperio que domina toda Europa septentrional. La Stormaktstiden (era de las grandes potencias) fue la era en que Suecia se convirtió en protagonista de la historia mundial. “De nuevo amaneció, pero esta vez es el día de Suecia”."
 swe_events.99.a: "¡Viva el Emperador del Imperio sueco! ¡Que el imperio del norte dure para siempre!"
 STATIC_MODIFIER_NAME_swe_kingdom_mod: "El Reino de Suecia"
 STATIC_MODIFIER_DESC_swe_kingdom_mod: "Colocada la piedra angular de la reconstrucción de Suecia en el reinado del rey Magnus Eriksson."
 STATIC_MODIFIER_NAME_swe_norway_union_mod: "Bonificación de la unión noruega"
 STATIC_MODIFIER_DESC_swe_norway_union_mod: "La unión personal con Noruega combina la fuerza militar del noroeste de Escandinavia."
 STATIC_MODIFIER_NAME_swe_skaane_mod: "Escania asegurada"
 STATIC_MODIFIER_DESC_swe_skaane_mod: "El lado sueco del estrecho del Øresund asegurado mediante el control de Escania."
 STATIC_MODIFIER_NAME_swe_norway_integrated_mod: "Noruega integrada: don de las pesquerías"
 STATIC_MODIFIER_DESC_swe_norway_integrated_mod: "Las ricas pesquerías de Noruega incorporadas al Imperio sueco."
 STATIC_MODIFIER_NAME_swe_scandinavia_united_mod: "Escandinavia unida"
 STATIC_MODIFIER_DESC_swe_scandinavia_united_mod: "Los estandartes de tres reinos ondean lado a lado bajo una sola corona, y las órdenes emitidas desde Estocolmo alcanzan los mares del norte."
 STATIC_MODIFIER_NAME_swe_baltic_trade_mod: "Comercio báltico"
 STATIC_MODIFIER_DESC_swe_baltic_trade_mod: "Suecia entra en serio en el comercio báltico. Las antiguas rutas comerciales varegas reviven."
 STATIC_MODIFIER_NAME_swe_estonia_mod: "Estonia conquistada"
 STATIC_MODIFIER_DESC_swe_estonia_mod: "Estonia, con centro en Tallin, pasa al control sueco."
 STATIC_MODIFIER_NAME_swe_livonia_mod: "Livonia subyugada"
 STATIC_MODIFIER_DESC_swe_livonia_mod: "Con Riga y Tartu tomadas, toda la costa este del Báltico queda bajo administración sueca."
 STATIC_MODIFIER_NAME_swe_varangian_mod: "El legado varego"
 STATIC_MODIFIER_DESC_swe_varangian_mod: "La toma de Nóvgorod resucita las antiguas rutas comerciales varegas."
 STATIC_MODIFIER_NAME_swe_eastern_empire_mod: "Dominio sobre la Rus"
 STATIC_MODIFIER_DESC_swe_eastern_empire_mod: "La toma de Moscú hace de Suecia la señora del mundo eslavo oriental."
 STATIC_MODIFIER_NAME_swe_dominium_baltici_mod: "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_swe_dominium_baltici_mod: "El Mar Báltico se convierte en “lago” de Suecia. Todo barco mercante que cruza este mar responde a Suecia."
 STATIC_MODIFIER_NAME_swe_hansa_victory_mod: "Hansa derrotada"
 STATIC_MODIFIER_DESC_swe_hansa_victory_mod: "Suecia derrota a la Liga Hanseática y se convierte en la estrella del comercio báltico."
 STATIC_MODIFIER_NAME_swe_pomerania_mod: "La costa de Pomerania"
 STATIC_MODIFIER_DESC_swe_pomerania_mod: "Adelantándose a lo que Suecia conquistó en la Guerra de los Treinta Años, la costa sur del Báltico bajo control sueco."
 STATIC_MODIFIER_NAME_swe_prussia_mod: "Ambiciones prusianas"
 STATIC_MODIFIER_DESC_swe_prussia_mod: "Prusia, incluida Königsberg, pasa al control sueco."
 STATIC_MODIFIER_NAME_swe_stockholm_mod: "Estocolmo asegurada"
 STATIC_MODIFIER_DESC_swe_stockholm_mod: "La capital real sueca, Estocolmo, desarrollada como centro administrativo."
 STATIC_MODIFIER_NAME_swe_falun_copper_mod: "La mina de cobre de Falun"
 STATIC_MODIFIER_DESC_swe_falun_copper_mod: "La mina de cobre de Falun, que sostiene la demanda europea de cobre, opera a plena capacidad."
 STATIC_MODIFIER_NAME_swe_iron_industry_mod: "La industria del hierro"
 STATIC_MODIFIER_DESC_swe_iron_industry_mod: "Las minas de hierro de Svealand operan plenamente, estableciendo la base de la industria de defensa sueca."
 STATIC_MODIFIER_NAME_swe_steel_mod: "El acero sueco"
 STATIC_MODIFIER_DESC_swe_steel_mod: "El mejor acero de Europa, el sueco, abastece a ejércitos dentro y fuera del país."
 STATIC_MODIFIER_NAME_swe_riksdag_mod: "El Riksdag"
 STATIC_MODIFIER_DESC_swe_riksdag_mod: "El Parlamento de Suecia establecido como órgano legislativo en funcionamiento. La singular tradición política de Suecia —de la que participan los campesinos— cobra forma."
 STATIC_MODIFIER_NAME_swe_absolutism_mod: "Absolutismo"
 STATIC_MODIFIER_DESC_swe_absolutism_mod: "Adelantándose a la reducción de Carlos XI, establecida la monarquía absoluta en Suecia."
 STATIC_MODIFIER_NAME_swe_great_power_mod: "Suecia como gran potencia"
 STATIC_MODIFIER_DESC_swe_great_power_mod: "La llegada de la Stormaktstiden ve a Suecia alzarse como principal potencia europea."
 STATIC_MODIFIER_NAME_swe_stormakt_economy_mod: "La economía de la gran potencia"
 STATIC_MODIFIER_DESC_swe_stormakt_economy_mod: "La economía de gran potencia de Suecia —construida sobre el acero sueco, la monarquía absoluta y el comercio báltico— concluida."
 STATIC_MODIFIER_NAME_swe_catholic_mod: "La Suecia católica"
 STATIC_MODIFIER_DESC_swe_catholic_mod: "Manteniendo la fidelidad a la Iglesia de Roma, Suecia es reconocida como guardiana de la civilización católica del norte."
 STATIC_MODIFIER_NAME_swe_crusader_glory_mod: "Gloria del cruzado del norte"
 STATIC_MODIFIER_DESC_swe_crusader_glory_mod: "Suecia participa en la guerra santa, estableciendo su reputación de guardiana de la cristiandad."
 STATIC_MODIFIER_NAME_swe_lutheran_mod: "Reforma luterana"
 STATIC_MODIFIER_DESC_swe_lutheran_mod: "Adelantándose a la proclamación luterana de Gustavo Vasa, los bienes de la iglesia pasan a la corona."
 STATIC_MODIFIER_NAME_swe_protestant_reform_mod: "La Iglesia protestante"
 STATIC_MODIFIER_DESC_swe_protestant_reform_mod: "La formación de teología luterana arraiga la fe protestante en toda Suecia."
 STATIC_MODIFIER_NAME_swe_norse_conversion_mod: "Renacimiento de la fe nórdica"
 STATIC_MODIFIER_DESC_swe_norse_conversion_mod: "La fe en Odín, Thor y Freyr renace. El espíritu guerrero de la era vikinga habita los ejércitos de Suecia."
 STATIC_MODIFIER_NAME_swe_berserker_mod: "El ejército berserker"
 STATIC_MODIFIER_DESC_swe_berserker_mod: "El espíritu de los guerreros-oso de la era vikinga renace. La piratería se suelta para devastar las costas de los infieles."
 STATIC_MODIFIER_NAME_swe_yggdrasil_mod: "El trono de Yggdrasil"
 STATIC_MODIFIER_DESC_swe_yggdrasil_mod: "Como Odín en las raíces del Árbol del Mundo, el emperador sueco reina en el centro del mundo del norte."
 STATIC_MODIFIER_NAME_swe_finland_mod: "Finlandia integrada"
 STATIC_MODIFIER_DESC_swe_finland_mod: "Finlandia integrada como parte del Imperio sueco. La política colonial abre la frontera norte."
 STATIC_MODIFIER_NAME_swe_lapland_mod: "Expansión lapona"
 STATIC_MODIFIER_DESC_swe_lapland_mod: "Los vastos bosques de Norrland incorporados a Suecia."
 STATIC_MODIFIER_NAME_swe_arctic_mod: "El Imperio ártico"
 STATIC_MODIFIER_DESC_swe_arctic_mod: "Los faros suecos erigidos en la costa ártica guían a los navegantes que cruzan el Atlántico Norte."
 STATIC_MODIFIER_NAME_swe_stormaktstiden_mod: "Stormaktstiden"
 STATIC_MODIFIER_DESC_swe_stormaktstiden_mod: "La era de las grandes potencias de Suecia: alcanzado el apogeo del imperio septentrional que domina Escandinavia, el Báltico y Europa oriental."
 STATIC_MODIFIER_NAME_swe_sound_toll_mod: "El peaje del Øresund"
 STATIC_MODIFIER_DESC_swe_sound_toll_mod: "El cobro del peaje del Øresund enriquece el tesoro sueco."
 STATIC_MODIFIER_NAME_swe_stockholm_great_mod: "Estocolmo, ciudad del Norte"
 STATIC_MODIFIER_DESC_swe_stockholm_great_mod: "Estocolmo se ha desarrollado en una gran ciudad con universidad, convirtiéndose en la mayor capital cultural y científica de Europa septentrional."
 STATIC_MODIFIER_NAME_swe_peasant_mod: "Apoyo del campesinado"
 STATIC_MODIFIER_DESC_swe_peasant_mod: "El apoyo del estamento campesino de Suecia crea una estabilidad social propia de Suecia."
 STATIC_MODIFIER_NAME_swe_engelbrekt_mod: "El espíritu de Engelbrekt"
 STATIC_MODIFIER_DESC_swe_engelbrekt_mod: "El espíritu de la revuelta de 1434 inspira a los ejércitos suecos. La lucha por la libertad es el orgullo de Suecia."
 STATIC_MODIFIER_NAME_swe_colonial_mod: "El Imperio colonial sueco"
 STATIC_MODIFIER_DESC_swe_colonial_mod: "Suecia inicia empresas coloniales ultramarinas, convirtiéndose en un imperio más allá de Europa septentrional."
 STATIC_MODIFIER_NAME_swe_papal_champion_mod: "Campeona del papa"
 STATIC_MODIFIER_DESC_swe_papal_champion_mod: "Posición inquebrantable de más fuerte guardiana de la civilización católica del norte establecida."
 STATIC_MODIFIER_NAME_swe_protestant_empire_mod: "El Imperio protestante"
 STATIC_MODIFIER_DESC_swe_protestant_empire_mod: "Suecia, con luteranismo por toda Escandinavia, reina como defensora septentrional del mundo protestante."
 STATIC_MODIFIER_NAME_swe_amber_mod: "Comercio de ámbar"
 STATIC_MODIFIER_DESC_swe_amber_mod: "El ámbar, recogido en las costas del Báltico, reluce como oro en los escaparates de los joyeros de Estocolmo."
 STATIC_MODIFIER_NAME_swe_uppsala_mod: "La Universidad de Upsala"
 STATIC_MODIFIER_DESC_swe_uppsala_mod: "La más antigua universidad de Suecia prospera como la mejor institución científica de Europa septentrional."
 STATIC_MODIFIER_NAME_swe_karoliner_mod: "Los karoliner"
 STATIC_MODIFIER_DESC_swe_karoliner_mod: "Adelantándose a la infantería de élite de Carlos, un ejército sueco altamente entrenado concluido."
 STATIC_MODIFIER_NAME_swe_scandinavian_empire_final_mod: "El Imperio sueco"
 STATIC_MODIFIER_DESC_swe_scandinavian_empire_final_mod: "El Imperio sueco, que se extiende del Báltico a Europa oriental, concluido. La Stormaktstiden perdura."
 STATIC_MODIFIER_NAME_swe_faith_steadfast_mod: "Firme en la fe"
 STATIC_MODIFIER_DESC_swe_faith_steadfast_mod: "La inquebrantable fe católica proclama la autoridad del rey al pueblo con las campanas de la catedral de Upsala."
 STATIC_MODIFIER_NAME_swe_reform_winds_mod: "Vientos de reforma"
 STATIC_MODIFIER_DESC_swe_reform_winds_mod: "La enseñanza de Lutero se extiende por Suecia."
 STATIC_MODIFIER_NAME_swe_old_gods_calling_mod: "La llamada de los antiguos dioses"
 STATIC_MODIFIER_DESC_swe_old_gods_calling_mod: "La fe en Odín y Thor renace en secreto."
 swe_norrkoping_textiles: "La industria textil de Norrköping"
 swe_norrkoping_textiles_desc: "Norrköping se ha convertido en la ciudad industrial de la costa este de Suecia, centro de producción de textiles y paños. Aprovechando la abundante energía hidráulica del río Motala, la producción de paños se convierte en importante pilar de la exportación sueca."
 STATIC_MODIFIER_NAME_swe_norrkoping_textile_mod: "Industria textil de Norrköping"
 STATIC_MODIFIER_DESC_swe_norrkoping_textile_mod: "La producción de paños con energía hidráulica en Norrköping opera a plena capacidad. La exportación sueca de paños a los mercados europeos."
 STATIC_MODIFIER_NAME_swe_goteborg_mod: "Puerto de Varberg desarrollado"
 STATIC_MODIFIER_DESC_swe_goteborg_mod: "En el puerto de Varberg, en el Kattegat, los veleros rumbo al Mar del Norte se alejan del muelle uno tras otro."
 STATIC_MODIFIER_NAME_swe_visby_mod: "Comercio de Visby"
 STATIC_MODIFIER_DESC_swe_visby_mod: "El barrio de almacenes de Visby, en Gotland, vuelve a animarse con mercaderes de todo el Báltico."
 STATIC_MODIFIER_NAME_swe_denmark_crushed_mod: "Dinamarca aplastada"
 STATIC_MODIFIER_DESC_swe_denmark_crushed_mod: "Cuando la bandera de Dinamarca, nuestra antigua enemiga, fue arriada, los señores de Escandinavia pronunciaron en silencio el nombre de su nuevo soberano."
