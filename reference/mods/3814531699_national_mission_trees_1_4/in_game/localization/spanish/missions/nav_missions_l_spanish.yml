l_spanish:
 nav_crown_mission_pack: "El legado del Reino de Navarra"
 nav_crown_mission_pack_DESCRIPTION:0 "Enraizado al pie de los Pirineos, el Reino vasco de Navarra es una pequeña potencia, cercada por los tres grandes reinos de Castilla, Aragón y Francia. Y, sin embargo, su linaje corre por las casas reales tanto de Francia como de Aragón, y, cuando las ruedas de la historia se alineen, un inesperado camino hacia la grandeza podrá aún abrirse ante él. ¿Forjarás la unidad vasca, avanzarás más allá de Gascuña para intervenir en Francia o conquistarás el dominio sobre la Península Ibérica? El destino de este pequeño reino reposa en manos de su rey."
 nav_crown_mission_pack_CRITERIA_DESCRIPTION:0 "Completa las misiones como Reino de Navarra y establece la unidad vasca, junto con influencia sobre Iberia y Francia."
 nav_crown_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para recorrer el legado del Reino de Navarra."
 nav_crown_mission_pack_BUTTON_DETAILS:0 "¡Forja la unidad vasca, avanza sobre Gascuña y reivindica el dominio sobre Iberia!"
 nav_kingdom_of_pamplona: "El Reino de Pamplona"
 nav_kingdom_of_pamplona_desc: "Fundado por Íñigo Arista, el Reino de Pamplona es una antigua línea, hondamente enraizada en las tierras vascas. Pero, rodeado por las grandes potencias de Castilla, Aragón y Francia, su supervivencia ha reposado siempre sobre un frágil equilibrio."
 nav_secure_bayonne: "Asegura Bayona"
 nav_secure_bayonne_desc: "Ha llegado la hora de unir a nuestros parientes del otro lado del mar, los vascos franceses de Bayona, bajo nuestra corona. Todos los vascos deben un día reunirse bajo un solo estandarte."
 nav_basque_unity: "Unidad vasca"
 nav_basque_unity_desc: "Un pueblo que comparte nuestra lengua y costumbres forma ahora el núcleo del reino. Ser vasco se ha convertido en nuestro mayor orgullo."
 nav_fueros_and_privileges: "Garantiza los fueros"
 nav_fueros_and_privileges_desc: "Los fueros, antiguos privilegios de autogobierno largo tiempo detentados por las ciudades vascas. A medida que la nobleza se muestra más satisfecha, garantizar estos privilegios se convierte en un cimiento sólido para la propia corona."
 nav_efficient_administration: "Una administración eficiente"
 nav_efficient_administration_desc: "Las casas de contabilidad, establecidas por todo el reino, fortalecen nuestros cimientos fiscales. Para un pequeño reino, la eficiencia del gobierno es una tabla de salvación."
 nav_renaissance_of_pamplona: "El Renacimiento de Pamplona"
 nav_renaissance_of_pamplona_desc: "Los nuevos vientos de saber que se alzan desde Italia han llegado incluso al pie de los Pirineos. Por pequeño que sea el reino, su espíritu camina a la vanguardia de la época."
 nav_intervene_hundred_years_war: "Intervén en la Guerra de los Cien Años"
 nav_intervene_hundred_years_war_desc: "La larga lucha entre Francia e Inglaterra sigue arreciando. Nuestro linaje real corre por ambas coronas, y Navarra tiene tanto el derecho como la oportunidad de intervenir como tercera potencia."
 nav_foothold_in_france: "Una cabeza de puente en Francia"
 nav_foothold_in_france_desc: "Aprovechando el caos de la Guerra de los Cien Años, asegura una parte del suelo francés. Esto extiende el alcance del reino hondo en el corazón del suroeste de Francia."
 nav_secure_gascony: "Asegura Gascuña"
 nav_secure_gascony_desc: "Dominar la tierra de Tursan y tomar el puerto de Burdeos trae toda Gascuña bajo nuestro gobierno, abriendo la puerta al Atlántico."
 nav_claims_on_france: "Una cabeza de puente para la Corona francesa"
 nav_claims_on_france_desc: "Ahora que amplios territorios dentro de la propia Francia están asegurados, la ambición que nuestra casa alberga sobre el trono francés ya no es mera fantasía."
 nav_house_of_evreux: "La ambición de la casa de Évreux"
 nav_house_of_evreux_desc: "Ya sea por unión personal con Francia, ya sea por la ocupación de la propia París, la legitimidad que nuestra casa detenta sobre el trono francés está ahora fuera de duda."
 nav_claim_french_throne: "Reivindica el trono francés"
 nav_claim_french_throne_desc: "Extinguida ya la línea real francesa, nuestra casa se alza como legítima heredera de su corona. Ha llegado la hora de que las dos coronas, la de Navarra y la de Francia, reposen sobre una sola cabeza."
 nav_aragonese_inheritance: "Lazos de sangre con Aragón"
 nav_aragonese_inheritance_desc: "Nuestra casa y la casa real de Aragón comparten la misma sangre ancestral. Los destinos de los dos reinos pueden aún ligarse en uno solo."
 nav_castilian_question: "La cuestión castellana"
 nav_castilian_question_desc: "Castilla, la mayor potencia de la Península Ibérica. Ya sea ligándonos a ella en alianza, ya sea oponiéndonos como rivales, la naturaleza de esta relación debe quedar clara."
 nav_reconquista_legacy: "El legado de la Reconquista"
 nav_reconquista_legacy_desc: "El recuerdo de siglos de lucha contra las potencias islámicas es un orgullo compartido por todos los reinos de Iberia. Nuestro reino lleva también su parte de esa gloria."
 nav_dominate_iberia: "Dominio sobre Iberia"
 nav_dominate_iberia_desc: "Lo que fue un reino menor ya no puede ser ignorado en la Península Ibérica. La corona vasca se ha hecho lo bastante poderosa para moldear el destino de toda la península."
 nav_basque_seafarers: "Los pescadores vascos"
 nav_basque_seafarers_desc: "El pueblo vasco es conocido desde hace mucho como intrépidos pescadores. Su habilidad y su valor deben ahora ponerse al servicio del Estado como un activo."
 nav_fearless_fishermen: "Los navegantes intrépidos"
 nav_fearless_fishermen_desc: "Los marineros vascos no temen ni siquiera los mares septentrionales enfurecidos. Su pericia marinera y su valor son ya famosos por todo el continente."
 nav_transatlantic_whalers: "Balleneros a través del Atlántico"
 nav_transatlantic_whalers_desc: "Los barcos de los balleneros vascos, persiguiendo a su presa, han llegado por fin muy lejos a través del Atlántico. Las operaciones en estas nuevas aguas prometen inmensa riqueza al reino."
 nav_basque_in_glory: "Los vascos en gloria"
 nav_basque_in_glory_desc: "Un pequeño reino nacido al pie de los Pirineos ha florecido en cultura, ha tomado el trono de Francia y ha reinado sobre una Iberia unificada como España. La gloria de los vascos ya no puede ser negada por nadie."
 STATIC_MODIFIER_NAME_nav_secure_bayonne_mod: "Experiencia militar de Bayona"
 STATIC_MODIFIER_DESC_nav_secure_bayonne_mod: "La integración de Bayona ha dado a nuestras fuerzas experiencia en batalla."
 STATIC_MODIFIER_NAME_nav_basque_unity_mod: "Unidad vasca"
 STATIC_MODIFIER_DESC_nav_basque_unity_mod: "Los vascos son uno de los pueblos más antiguos de Europa, de origen desconocido, que habla una lengua sin parentesco con la familia indoeuropea. La unidad cultural de los vascos que viven a ambos lados de los Pirineos conservó su propia identidad bajo el gobierno tanto francés como español."
 STATIC_MODIFIER_NAME_nav_fueros_and_privileges_mod: "Fueros garantizados"
 STATIC_MODIFIER_DESC_nav_fueros_and_privileges_mod: "Los fueros (privilegios y derecho consuetudinario) son el sistema jurídico que garantiza la autonomía tradicional de Navarra y del País Vasco. Sus propios poderes en materia de tributación, servicio militar y justicia estuvieron siempre en tensión con la corona centralizadora castellana. Esta singular tradición jurídica forma el núcleo de la identidad de Navarra."
 STATIC_MODIFIER_NAME_nav_efficient_administration_mod: "Gobierno eficiente"
 STATIC_MODIFIER_DESC_nav_efficient_administration_mod: "El Reino de Navarra creó la “Cámara de Comptos”, un despacho de gestión financiera, y adoptó un sistema administrativo al estilo francés. El refinamiento administrativo, fruto de sus largos lazos con la casa real francesa (la familia real navarra se casaba a menudo con franceses), lo distinguía de los demás reinos de Iberia."
 STATIC_MODIFIER_NAME_nav_renaissance_of_pamplona_mod: "El nuevo espíritu de Pamplona"
 STATIC_MODIFIER_DESC_nav_renaissance_of_pamplona_mod: "El espíritu del Renacimiento ha elevado la habilidad de los artistas que se inician ahora en su oficio."
 STATIC_MODIFIER_NAME_nav_foothold_in_france_mod: "Una cabeza de puente en Francia"
 STATIC_MODIFIER_DESC_nav_foothold_in_france_mod: "El Reino de Navarra poseía también tierras al norte de los Pirineos, con la Baja Navarra (el actual País Vasco francés) en su centro. Históricamente, la casa real de Navarra se casaba con frecuencia con la casa real francesa, y poseer un punto de apoyo en Francia era la base de su diplomacia."
 STATIC_MODIFIER_NAME_nav_secure_gascony_mod: "La corona de Gascuña"
 STATIC_MODIFIER_DESC_nav_secure_gascony_mod: "La seguridad de toda Gascuña ha reforzado la magnificencia de la corona."
 STATIC_MODIFIER_NAME_nav_house_of_evreux_mod: "El prestigio de la casa de Évreux"
 STATIC_MODIFIER_DESC_nav_house_of_evreux_mod: "Las fuertes relaciones con la casa real francesa han elevado la posición diplomática de nuestra nación."
 STATIC_MODIFIER_NAME_nav_claim_french_throne_mod: "Las coronas gemelas de Navarra y Francia"
 STATIC_MODIFIER_DESC_nav_claim_french_throne_mod: "Portar las coronas gemelas de Navarra y Francia ha elevado la magnificencia del reino y la estabilidad de su gobierno."
 STATIC_MODIFIER_NAME_nav_castilian_question_mod: "Relaciones claras con Castilla"
 STATIC_MODIFIER_DESC_nav_castilian_question_mod: "Las relaciones esclarecidas con Castilla han elevado la posición diplomática de nuestra nación."
 STATIC_MODIFIER_NAME_nav_reconquista_legacy_mod: "Orgullo de la Reconquista"
 STATIC_MODIFIER_DESC_nav_reconquista_legacy_mod: "El recuerdo de la lucha contra las potencias islámicas ha elevado la tolerancia a nuestra religión dominante."
 STATIC_MODIFIER_NAME_nav_dominate_iberia_mod: "Señor de Iberia"
 STATIC_MODIFIER_DESC_nav_dominate_iberia_mod: "Que Navarra, pequeño reino de la península ibérica, supere a las grandes potencias de Castilla y Aragón y se convierta en señora de la península evoca el sueño que Sancho III el Mayor (reinó 1000-1035) realizó brevemente. Es una hazaña histórica, alcanzable aprovechando plenamente la ventaja geográfica de poseer los pasos pirenaicos."
 STATIC_MODIFIER_NAME_nav_basque_seafarers_mod: "La tradición pesquera vasca"
 STATIC_MODIFIER_DESC_nav_basque_seafarers_mod: "El crecimiento de las aldeas de pescadores suministra de forma permanente 5 marineros cada mes."
 STATIC_MODIFIER_NAME_nav_fearless_fishermen_mod: "La moral de los navegantes intrépidos"
 STATIC_MODIFIER_DESC_nav_fearless_fishermen_mod: "“El marino vasco no teme tempestad alguna” era un dicho conocido por toda Europa. La pericia marinera y el temple, forjados en las aguas agitadas del Golfo de Vizcaya (“nuestro mar” para los vascos), los situaron a la vanguardia de la era atlántica. Muchos de los marineros de la Armada española eran vascos."
 STATIC_MODIFIER_NAME_nav_transatlantic_whalers_mod: "Pericia marinera de los balleneros atlánticos"
 STATIC_MODIFIER_DESC_nav_transatlantic_whalers_mod: "Se cree que balleneros vascos cazaban ballenas francas frente a la costa del Labrador, en Norteamérica, desde el siglo XV. Los restos de una estación ballenera vasca sobreviven en Red Bay, en Canadá, y están inscritos en la Lista del Patrimonio Mundial de la UNESCO. Esta actividad transatlántica pionera sentó las bases de la era colonial."
 STATIC_MODIFIER_NAME_nav_third_faction_mod: "Determinación de la tercera facción independiente"
 STATIC_MODIFIER_DESC_nav_third_faction_mod: "La determinación de no tomar partido por ninguna de las grandes potencias ha elevado la moral del ejército."
 STATIC_MODIFIER_NAME_nav_basque_in_glory_mod: "Los vascos en gloria"
 STATIC_MODIFIER_DESC_nav_basque_in_glory_mod: "Dominando la cultura, la diplomacia y el gobierno por igual, la corona vasca irradia ahora una magnificencia muy superior a la de un reino menor. La disciplina militar y la fuerza de los navíos pesados quedan también reforzadas de forma permanente."
 nav_events.1.t: "Los orígenes del Reino de Pamplona"
 nav_events.1.d: "El Reino de Navarra es heredero del Reino de Pamplona, fundado en el siglo IX por Íñigo Arista. Centrada en el País Vasco, esta línea nació como marca del Imperio carolingio y continúa trazando su propio camino entre las dos grandes potencias de los reinos islámicos y el reino de los francos. Ahora ha llegado la hora de alzar de nuevo su estandarte al pie de los Pirineos."
 nav_events.1.a: "La historia del reino, tomada a pecho"
 nav_events.2.t: "Ambición sobre el trono francés"
 nav_events.2.d: "Nuestra casa, la casa de Évreux, comparte sangre con la propia casa real de Francia. Ahora que amplios territorios dentro de Francia están asegurados, el rey de Navarra puede reivindicar abiertamente su sucesión. Esa legitimidad debe ahora probarse, tanto en la corte como en el campo de batalla."
 nav_events.2.a: "La causa de la reivindicación, alzada"
 nav_events.3.t: "Lazos de sangre con Aragón"
 nav_events.3.d: "Las casas reales de Navarra y Aragón comparten la misma sangre ancestral. No es nada raro que los herederos de ambos tronos sean una misma persona. Si cualquiera de las líneas fallara, los dos reinos podrían aún estar destinados a unirse bajo una sola corona."
 nav_events.3.a: "El significado de este parentesco, comprendido"
 nav_events.4.t: "Intervención en la Guerra de los Cien Años"
 nav_events.4.d: "La Guerra de los Cien Años entre Francia e Inglaterra ya no es un simple conflicto entre dos naciones. Nuestra casa, la casa de Évreux, desciende de la línea capetíngia francesa, al tiempo que mantiene profundos lazos matrimoniales con la corte inglesa. Además, la propia corona navarra ha servido desde hace mucho de importante precedente en los debates sobre el derecho sucesorio francés.\\n\\nEn esta era de tumulto, tres caminos están abiertos a Navarra. Uno es apoyar a Francia, por lazos de sangre y larga amistad. Otro es apoyar a Inglaterra, por intereses comerciales y como baluarte contra Castilla. El último es no tomar partido por ninguna de las grandes potencias, persiguiendo nuestros propios intereses como tercera facción independiente. Esta elección pesará mucho sobre el destino del reino."
 nav_events.4.a: "Apoyar a Francia"
 nav_events.4.b: "Apoyar a Inglaterra"
 nav_events.4.c: "Entrar en la guerra como tercera facción independiente"
