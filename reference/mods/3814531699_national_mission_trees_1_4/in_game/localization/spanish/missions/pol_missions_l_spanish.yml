l_spanish:
 pol_jagiellonian_dynasty_mission_pack: "El esplendor de la dinastía Jagellón"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION:0 "En 1337, el Reino de Polonia está gobernado por Casimiro III el Grande. Su sucesor será Luis I de Hungría (de la casa de Anjou), y la hija de Luis, Eduviges, se casará con el gran duque de Lituania, Jogaila, creando la unión personal polaco-lituana. El conflicto con la Orden Teutónica al norte, la unión con Hungría al sur, la expansión hacia el este por Lituania y las ambiciones sobre Bohemia: realiza todo esto y construye la mayor república nobiliaria de Europa centro-oriental."
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION:0 "Como Polonia, expándete en todas las direcciones —reforma interna, este, norte, sur y oeste— y realiza la edad de oro polaca."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para realizar la edad de oro polaca."
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS:0 "De Casimiro el Grande a la edad de oro de los Jagellón: ¡construye la república nobiliaria!"
 pol_kingdom_of_poland: "El Reino de Polonia"
 pol_kingdom_of_poland_desc: "Casimiro III —el “Grande”— subió al trono en 1333 y unificó la Polonia fragmentada. “Encontró una Polonia de madera y dejó una de piedra”, decían las generaciones posteriores. Favoreció la reforma jurídica, la construcción de ciudades y la protección de los judíos, y su reinado se considera el apogeo de la prosperidad polaca medieval. Eleva la legitimidad y la estabilidad y firma los cimientos del reino."
 pol_integrate_mazovia: "Integra Mazovia"
 pol_integrate_mazovia_desc: "El Ducado de Mazovia está gobernado por una rama más joven de la dinastía Piasta, situado en la fértil llanura del corazón de Polonia. Asegurar Varsovia y Lublin e integrar por completo esta rica llanura al Reino de Polonia establece el centro político de la Polonia central. Obtén antes lo que la historia solo dará en 1526."
 pol_great_sejm: "El Gran Sejm"
 pol_great_sejm_desc: "El Sejm polaco —parlamento— se desarrolló desde el siglo XIII. Esta asamblea de estamentos de magnates, nobles y clero estableció en los siglos XV-XVI el concepto de “Libertad Dorada” (Złota Wolność) y transformó gradualmente Polonia en una república nobiliaria. Fortalece el Sejm y mantén el equilibrio entre el poder real y los derechos de la nobleza."
 pol_krakow_renaissance: "El Renacimiento en Cracovia"
 pol_krakow_renaissance_desc: "Cracovia es la capital del Reino de Polonia, y la Universidad Jagellónica —alma mater de Copérnico— es la mejor academia de Europa centro-oriental. El Renacimiento italiano llega a Cracovia, y Wawel es reconstruido en estilo renacentista. Desarrolla la universidad y cultiva Cracovia como centro espiritual de Europa centro-oriental."
 pol_jagiellonian_university: "La Universidad Jagellónica florece"
 pol_jagiellonian_university_desc: "La Universidad Jagellónica, fundada por Casimiro III en 1364 y renovada por la reina Eduviges en 1400, produjo a Nicolás Copérnico (1473-1543) y a muchas otras grandes mentes. La ampliación de las universidades por toda Polonia extiende la luz del saber por el reino."
 pol_polish_golden_age: "La edad de oro polaca"
 pol_polish_golden_age_desc: "Bajo la dinastía jagellónica, Polonia vivió en los siglos XV-XVI la “Edad de Oro” (Złoty Wiek). El heliocentrismo de Copérnico, la poesía de Kochanowski, el arte de Cracovia: Polonia era no solo una gran potencia, sino también la vanguardia cultural. Demuestra esta edad de oro con vasto territorio, ricos ingresos y alto prestigio."
 pol_jadwiga_union: "El matrimonio de Eduviges y Jogaila"
 pol_jadwiga_union_desc: "La Unión de Krewo de 1385 acordó el matrimonio de la reina polaca Eduviges con el gran duque lituano Jogaila (Ladislao II Jagellón). Jogaila se convirtió al cristianismo y reivindicó el título de rey de Polonia a cambio de la catolicización de Lituania. Este matrimonio fue el comienzo del Estado unido polaco-lituano, y el amanecer de la dinastía jagellónica, destinada a durar más de dos siglos."
 pol_develop_ruthenia: "Desarrolla Rutenia"
 pol_control_kyiv: "Dominio de Kiev"
 pol_control_kyiv_desc: "Kiev fue la capital de la Rus de Kiev, cuna de la civilización eslava. Tras la devastación mongola de 1240, la ciudad cayó bajo dominio lituano. Tomar Kiev establece el control sobre toda la cuenca del Dniéper y abre el camino al Mar Negro."
 pol_push_east: "Avance hacia el Este"
 pol_push_east_desc: "Minsk es el corazón de Lituania; Smolensk es importante nudo del mundo eslavo oriental. Con el ascenso del Gran Principado de Moscú, asegurar estas ciudades hará de la unión polaco-lituana la potencia dominante del mundo eslavo oriental. La disputa histórica por Smolensk, que Iván III libró: esta vez se decide a favor de Polonia."
 pol_eastern_empire: "El Imperio oriental"
 pol_eastern_empire_desc: "La república nobiliaria polaco-lituana en su apogeo (hacia 1618) se convirtió en el mayor Estado de Europa. Del Báltico a la estepa póntica (Mar Negro), todo el mundo eslavo oriental se unió bajo la bandera polaca. Erige el gran imperio oriental, temido por igual por Rusia, los otomanos y los Habsburgo."
 pol_prussian_confederation: "La Confederación Prusiana y la Orden Teutónica"
 pol_prussian_confederation_desc: "La Orden Teutónica, que conquistó a los paganos bálticos en el siglo XIII, se convirtió en enemiga jurada de Polonia. En Grunwald, en 1410, el ejército polaco-lituano la derrotó por completo. Con el apoyo de la Confederación Prusiana —burgueses prusianos que buscaban la protección polaca—, aplasta a la Orden Teutónica y asegura a Polonia el acceso al Báltico."
 pol_gdansk_port: "El puerto de Gdansk"
 pol_gdansk_port_desc: "Gdansk es llamada “puerta de Polonia”: el más importante puerto del Báltico. Situada en la desembocadura del Vístula, esta ciudad era el principal nudo de la Hansa y la llave de la exportación de grano de Polonia. Asegurada a Polonia por la Segunda Paz de Toruń (1466), Gdansk sirvió durante dos siglos como corazón de la economía polaca."
 pol_livonian_expansion: "Expansión en Livonia"
 pol_livonian_expansion_desc: "Livonia (actuales Letonia y Estonia), antaño gobernada por la Orden de los Hermanos de la Espada, se convirtió en el siglo XVI en escenario de disputa entre Rusia, Suecia, Dinamarca y Polonia. Tomar Riga y Reval (Tallin) trae todo el Báltico al control polaco."
 pol_master_of_the_north: "Señor del Norte"
 pol_master_of_the_north_desc: "Königsberg (actual Kaliningrado), antaño baluarte de la Orden Teutónica, lleva ahora el estandarte polaco. Con una poderosa flota que domina todo el Báltico, Polonia tiene en la mano a Escandinavia, la Hansa y los holandeses: el supremo señor del Norte."
 pol_hungarian_union: "Unión personal con Hungría"
 pol_hungarian_union_desc: "Cuando Casimiro III murió sin heredero en 1370, su sobrino Luis I de Hungría (de la casa de Anjou) heredó el trono polaco. Fue el comienzo de la unión personal polaco-húngara. Dos grandes reinos, unidos bajo un solo rey: el equilibrio de poder en Europa centro-oriental cambia por completo."
 pol_moldavia_vassal: "Subyuga Moldavia"
 pol_moldavia_vassal_desc: "El Principado de Moldavia (Moldova) es un Estado tapón, disputado por Polonia, Hungría y los otomanos. Esteban el Grande (reinó 1457-1504) mantuvo la suzeranía polaca nominal, conservando la independencia de hecho. Trae este principado estratégico con firmeza bajo protección polaca y conquista la puerta al Mar Negro."
 pol_wallachia_control: "Dominio de Valaquia"
 pol_wallachia_control_desc: "Valaquia, principado al norte del Danubio, es la línea de frente contra el Imperio otomano. Vlad II (padre de Vlad el Empalador) sirvió a Hungría como miembro de la Orden del Dragón. Traer Valaquia a la protección de la unión polaco-húngara establece influencia en la Península Balcánica."
 pol_battle_of_grunwald: "El espíritu de Grunwald"
 pol_battle_of_grunwald_desc: "El 15 de julio de 1410, el ejército polaco-lituano derrotó por completo a la Orden Teutónica en los campos de Grunwald (Tannenberg). El gran maestre Ulrich von Jungingen cayó en el campo, y Polonia consolidó su reputación de “defensora de la cristiandad”. Prueba este espíritu ahora de nuevo en la guerra contra las fuerzas del islam."
 pol_shield_of_christendom: "Escudo de la cristiandad"
 pol_shield_of_christendom_desc: "Desde la política de cristianización de Eduviges, Polonia está en la línea de frente del catolicismo de Europa oriental. Tras la expulsión definitiva del Imperio otomano, el papa, Venecia y los Habsburgo reconocen por igual que Polonia es el verdadero Antemurale Christianitatis: el baluarte de la cristiandad."
 pol_silesia_integration: "Incorporación de Silesia"
 pol_silesia_integration_desc: "Silesia (Śląsk) es la cuna de la dinastía Piasta, pero cayó bajo control bohemio y habsburgo en el siglo XIV. Recuperar esta rica región industrial y comercial en torno a Breslau (Breslavia) es uno de los más importantes mandamientos nacionales y económicos de Polonia."
 pol_bohemian_claim: "La Corona de Bohemia"
 pol_bohemian_claim_desc: "La dinastía jagellónica tiene derechos hereditarios a los tronos bohemio y húngaro. Ladislao II (Jagellón) se convirtió en rey de Bohemia en 1471 y luego rey de Hungría en 1490. Tomar la corona bohemia en Praga crea una triple monarquía polaco-bohemio-húngara."
 pol_hre_influence: "Influencia sobre el Sacro Imperio Romano"
 pol_hre_influence_desc: "El rey de Polonia, que porta también la corona bohemia, puede convertirse en elector del Sacro Imperio Romano. Equilibrando la diplomacia con los Habsburgo y ampliando la influencia sobre los príncipes alemanes, Polonia se convierte en el centro político de Europa central."
 pol_central_european_power: "Potencia de Europa central"
 pol_central_european_power_desc: "Un vasto reino, que abarca Polonia, Lituania, Bohemia y Hungría, con ricos ingresos: Polonia ha emergido como la mayor potencia de Europa centro-oriental. Rodeada por las tres grandes potencias, el Sacro Imperio Romano, el Imperio otomano y el Gran Principado de Moscú, Polonia brilla con luz propia."
 pol_grand_commonwealth: "La Gran República Nobiliaria"
 pol_grand_commonwealth_desc: "La república nobiliaria que une Polonia, Lituania, Bohemia y Hungría: este Estado de singular sistema político, que concilia la libertad noble con la autoridad real, era conocido en los siglos XVI-XVII como la “República de Muchas Naciones” (Rzeczpospolita). Este extraordinario experimento político, que abarca muchas naciones, fes y lenguas, ha alcanzado su cenit."
 pol_events.10.t: "El matrimonio de Eduviges y Jogaila"
 pol_events.10.d: "La Unión de Krewo ha dado fruto: la reina polaca Eduviges y el gran duque lituano Jogaila se han casado. Jogaila recibió el bautismo cristiano y asumió, como rey de Polonia, el nombre “Ladislao II”. Lituania entra con Polonia en unión personal, y la mayor unión política de Europa oriental ha comenzado. Este matrimonio es más que un cálculo político: es el momento histórico en que dos naciones, dos culturas, dos lenguas se unen bajo una sola dinastía. “Polonia y Lituania, unidas para siempre”, proclamó la Unión de Krewo."
 pol_events.10.a: "¡Viva la nueva dinastía jagellónica!"
 pol_events.20.t: "Unión personal polaco-húngara"
 pol_events.20.d: "Polonia y Hungría han formado una unión personal. Dos grandes reinos, unidos bajo un solo rey: es un triunfo diplomático de la casa de Anjou y un evento que transforma la historia de Europa centro-oriental. Caballeros polacos y húngaros están ahora lado a lado. Del Báltico, al norte, al Adriático, al sur, un vasto reino bajo una sola dinastía cobra forma. Para el Imperio otomano, esta unión es la mayor amenaza que enfrenta."
 pol_events.20.a: "¡Polonia y Hungría unidas!"
 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "El legado de los Piastas"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "El legado milenario de la dinastía Piasta —la primera casa real polaca— sustenta la legitimidad de la corona polaca."
 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "Integración de Mazovia"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "Mazovia, en torno a Varsovia, plenamente integrada a Polonia. Esta fértil llanura funciona como corazón del reino."
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "El Gran Sejm establecido"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "El Sejm polaco establecido como institución de la Libertad Dorada. Nace un singular sistema político, que concilia la autonomía noble con la autoridad real."
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "Florecimiento cultural de Cracovia"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "Cracovia, en torno a Wawel, se baña en la luz del Renacimiento. Como mayor ciudad académica de Europa centro-oriental, reúne aquí a eruditos y artistas de toda Europa."
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "La Universidad Jagellónica prospera"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "La Universidad Jagellónica —alma mater de Copérnico— prospera como la mejor academia de Europa centro-oriental. El saber y las artes se extienden por toda Polonia."
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "La edad de oro polaca"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "El heliocentrismo de Copérnico, la poesía de Kochanowski, la arquitectura de Cracovia: en todos los aspectos Polonia disfruta su edad de oro."
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "Lazos de la unión de Eduviges y Jogaila"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "La unión personal polaco-lituana establecida. Un vasto Estado, que se extiende del Báltico al Mar Negro, cobra forma."
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "La fuerza de la alianza polaco-húngara"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "Los estandartes de los ejércitos reales, reunidos de las orillas del Vístula y del Danubio, están lado a lado en las colinas junto a la frontera otomana."
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "Desarrollo de Rutenia"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "Los campos cultivados de la Rutenia Roja plenamente desarrollados. La ruta comercial del Mar Negro por Leópolis reanimada."
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "La puerta de Kiev"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "Kiev, cuna de la civilización eslava, ha pasado al control polaco. Establecida la influencia sobre toda la cuenca del Dniéper."
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "Avance hacia el Este"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "Con Minsk y Smolensk aseguradas, todo el mundo eslavo oriental entra en la esfera de influencia polaca."
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "El Imperio oriental"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "El imperio polaco, que se extiende del Báltico al Mar Negro, concluido. Inscrito en la historia como el mayor Estado de Europa oriental."
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "Victoria sobre la Orden Teutónica"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "El espíritu de Grunwald inspira al ejército polaco. La memoria de la victoria sobre los cruzados de la cristiandad se convierte en orgullo del ejército."
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "Ciudad comercial de Gdansk"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "Gdansk se ha desarrollado como el mayor puerto de exportación de grano del Báltico. El grano polaco, que desciende por el Vístula, alimenta a toda Europa."
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "La gloria de Grunwald"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "El espíritu de Grunwald inspira al ejército polaco. En la lucha contra los infieles, Polonia conquista gloria cada vez mayor."
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "Escudo de la cristiandad"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "Polonia inscrita en la historia como Antemurale Christianitatis: baluarte de la cristiandad."
 STATIC_MODIFIER_NAME_pol_silesia_mod: "Incorporación de Silesia"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "El estandarte del águila ha vuelto a los castillos de Silesia, patria de los Piastas, y el humo de sus minas y talleres sube de nuevo al cielo polaco."
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "La Corona de Bohemia"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "La dinastía jagellónica ha conquistado la corona bohemia. La corte real bohemia en Praga se convierte en escenario de la diplomacia polaca."
 STATIC_MODIFIER_NAME_pol_central_power_mod: "Potencia de Europa central"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "Polonia ha emergido como la mayor potencia de Europa centro-oriental. Incluso entre las tres grandes potencias, brilla con luz propia."
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "La Gran República Nobiliaria"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "La Rzeczpospolita concluida: el mayor experimento político de Europa, que abarca muchas naciones, fes y lenguas."
 pol_support_merchants: "Apoyo a los mercaderes"
 pol_support_merchants_desc: "La burguesía urbana de Polonia es un importante pilar de las finanzas reales. Apoyando la red comercial en torno a la Sukiennice (Lonja de los Paños) de Cracovia, mejoran tanto la lealtad de los burgueses como la recaudación fiscal. Satisface a los mercaderes y sienta la base de Polonia como nación comercial."
 pol_black_sea_access: "Acceso al Mar Negro"
 pol_black_sea_access_desc: "Descendiendo el Dniéper, Polonia puede alcanzar el Mar Negro. Controlar la península de Crimea y la costa norte del Ponto Euxino (Mar Negro) significa asegurar la ruta comercial hacia Oriente, sorteando Constantinopla, administrada por los otomanos. Construye una flota del Mar Negro y amplía el dominio marítimo."
 pol_breadbasket_of_europe: "El granero de Europa"
 pol_breadbasket_of_europe_desc: "A finales del siglo XVI, Polonia suministraba la mayor parte del grano consumido por Europa. Mercaderes de Ámsterdam, Lisboa y Sevilla no podían hacer negocios sin el trigo y el centeno polacos. Polonia está inscrita en la historia como el “Granero de Europa”."
 pol_nieszawa_privileges: "Los privilegios de Nieszawa"
 pol_nieszawa_privileges_desc: "En 1454, Casimiro IV Jagellón necesitó la leva general de la nobleza para la guerra contra la Orden Teutónica, y pagó por ello con el Estatuto de Nieszawa, que concedía amplios privilegios a la nobleza. Desde entonces el rey no podía ni introducir nuevos impuestos ni emitir nuevas leyes sin el consentimiento de la nobleza. Se convirtió en la piedra angular de la “Libertad Dorada” polaca."
 pol_develop_krakow: "Desarrolla Cracovia"
 pol_develop_krakow_desc: "La capital polaca, Cracovia, creció en torno a Wawel. Desarrollar por completo esta ciudad —elevarla al rango de ciudad— establece su estatus de mayor ciudad comercial de Europa centro-oriental."
 pol_baltic_fleet: "La flota báltica"
 pol_baltic_fleet_desc: "Con Gdansk asegurada, Polonia ha garantizado acceso al Báltico. Ha llegado la hora de construir una flota y disputar la supremacía sobre el Báltico. Mientras Suecia, Dinamarca y la Orden de los Hermanos de la Espada se disputan estas aguas, la flota polaca se convierte en la más nueva —y mayor— potencia del Báltico."
 pol_sea_to_sea: "De mar a mar"
 pol_sea_to_sea_desc: "El dominio de Livonia en el mar y la toma de Kiev y Smolensk: la unión polaco-lituana se extiende ahora del Báltico al Mar Negro. De Reval, al norte, a Kiev, al sur, el mayor imperio ininterrumpido de Europa oriental concluido. El gran hetman Jan Zamoyski dirá más tarde: “Esta Polonia es la nación que el propio Dios construyó”."
 pol_challenge_habsburg: "Desafía a los Habsburgo"
 pol_challenge_habsburg_desc: "En el siglo XVI, los Habsburgo gobernaban el Sacro Imperio Romano, España, Bohemia y Hungría: la mayor dinastía de Europa. Pero, como rey de Bohemia y Polonia, el monarca jagellónico puede desafiar esta hegemonía. Toma Viena o trae a los Habsburgo bajo el estandarte polaco."
 pol_codify_law: "Codifica el derecho"
 pol_codify_law_desc: "Los Estatutos de Wiślica de Casimiro el Grande, de 1346/47, fueron la primera codificación sistemática del derecho polaco. Apoyándote en el mantenimiento de registros y en la infraestructura administrativa centrada en las oficinas, una codificación más completa del derecho polaco mejora enormemente la eficiencia administrativa."
 pol_develop_warsaw: "Desarrolla Varsovia"
 pol_develop_warsaw_desc: "Varsovia creció como centro del Ducado de Mazovia. Situada en el centro de Polonia, se convertirá en capital de la República de las Dos Naciones tras la Unión de Lublin de 1569. Elevarla al rango de ciudad establece la base administrativa del centro del reino."
 pol_amber_road: "La Ruta del Ámbar"
 pol_amber_road_desc: "El ámbar del Báltico —“oro del Norte”— es valorado desde la Antigüedad. Gdansk era el principal puerto de exportación del ámbar del Báltico, y la exportación a Italia y al Mediterráneo traía enorme riqueza. Reanima esta antigua ruta comercial y eleva la posición económica de Polonia."
 pol_poznan_commerce: "El comercio de Poznań"
 pol_poznan_commerce_desc: "Poznań es la ciudad comercial de la Polonia occidental, nudo del comercio con Brandeburgo y Silesia. Esta ciudad, que alberga la primera sede episcopal polaca, fue continuamente el centro comercial de la Polonia occidental desde la Edad Media. Elévala al rango de ciudad y libera plenamente su potencial comercial."
 pol_vilnius_capital: "Desarrolla Vilna"
 pol_vilnius_capital_desc: "Vilna creció rápidamente en el siglo XIV como capital del Gran Ducado de Lituania. Construida por el gran duque Gediminas, esta ciudad se convirtió en hogar de muchos judíos, católicos y cristianos ortodoxos, viviendo lado a lado: más tarde conocida como la “Jerusalén del Norte”. Elévala al rango de ciudad y desarrolla el centro de la administración lituana."
 pol_russia_rivalry: "Rivalidad con Moscú"
 pol_russia_rivalry_desc: "Iván III el Grande disputó ferozmente con Polonia-Lituania por Smolensk. Las guerras de Smolensk entre Moscú y Polonia-Lituania duraron todo el siglo XVI: una disputa de suerte. Declara a Moscú rival y establece la hegemonía oriental. Frente a la reivindicación de Moscú de ser “guardiana de la Santa Rusia”, está Polonia como “guardiana de la libertad”."
 pol_malbork_castle: "El castillo de Malbork"
 pol_malbork_castle_desc: "Malbork fue construido como sede principal de la Orden Teutónica: el mayor castillo medieval de Europa. Entregado a Polonia por la Segunda Paz de Toruń (1457), esta poderosa fortaleza se convierte en un excelente punto defensivo."
 pol_gniezno_church: "El arzobispado de Gniezno"
 pol_gniezno_church_desc: "Gniezno es la capital histórica de Polonia y sede de su primer arzobispado. Construida hacia 987, la catedral de Gniezno guarda las reliquias de San Adalberto y desde entonces sirve de corazón de la fe católica polaca. Refuerza la Iglesia polaca y realiza la misión de defensora del catolicismo de Europa oriental."
 pol_hanseatic_ties: "Lazos con la Hansa"
 pol_hanseatic_ties_desc: "La Liga Hanseática dominaba el comercio del Báltico y del Mar del Norte. Ciudades polacas, como Gdansk, Toruń y Elbląg, tenían estrechos lazos hanseáticos. Erige una vasta red comercial en torno a estas ciudades, y Polonia ascenderá como principal potencia comercial del Báltico."
 pol_transylvania_influence: "Influencia sobre Transilvania"
 pol_transylvania_influence_desc: "Transilvania es una región rica en la frontera del Reino de Hungría y de la unión personal polaca. Establecer influencia sobre Transilvania —por medio de la unión húngara o directamente— estabiliza la frontera sudeste de Polonia."
 pol_subjugate_serbia: "Subyuga Serbia"
 pol_subjugate_serbia_desc: "El Reino de Serbia se convirtió en vasallo otomano tras Kosovo (1389). Como parte de la expansión meridional de la unión polaco-húngara, asegurar Belgrado o convertir a Serbia en vasalla establece una sólida cabeza de puente en los Balcanes septentrionales."
 pol_varna_revenge: "La venganza de Varna"
 pol_varna_revenge_desc: "En la batalla de Varna, en 1444, el ejército cruzado polaco-húngaro fue aplastado por los otomanos, y el rey polaco Ladislao III cayó en el campo. Ha llegado por fin la hora de vengar esta humillación. Toma Varna luchando contra una nación musulmana, y esta tragedia será reescrita como victoria."
 pol_upper_silesia_mines: "Las minas de la Alta Silesia"
 pol_upper_silesia_mines_desc: "La Alta Silesia es conocida por sus ricas minas de plata, zinc y plomo. El pleno desarrollo de los distritos mineros en torno a Cieszyn y Gliwice establece la base industrial de Polonia. Obtén antes las riquezas naturales de esta región: más tarde se convirtió en el centro de la Revolución Industrial."
 pol_upper_silesia_mines_unlock_tt: "La decisión «Desarrollar las minas de la Alta Silesia» ya está disponible."
 pol_silesia_mining_decision.title: "Desarrollar las minas de la Alta Silesia"
 pol_silesia_mining_decision.desc: "Los distritos mineros de Silesia son vastos y la Corona no puede abrirlos todos a la vez. Cada inversión en pozos, fundiciones y caminos lleva un distrito más a la producción plena, y la obra puede renovarse cada década."
 pol_silesia_mining_decision.a: "Invertir en un nuevo distrito minero."
 pol_pomeranian_coast: "La costa de Pomerania"
 pol_pomeranian_coast_desc: "Pomerania (Pomorze) es una región báltica en torno a Stettin. Recuperar esta región históricamente perteneciente al reino polaco da a Polonia pleno control del litoral báltico."
 pol_prague_university: "La Universidad de Praga"
 pol_prague_university_desc: "La Universidad Carolina de Praga (fundada en 1348) es la más antigua de Europa centro-oriental. Antaño sede de la Reforma husita, esta academia puede ahora ser reconstruida y desarrollada bajo dominio polaco, y Praga volverá a ser centro del saber católico."
 pol_catholicism_of_lithuania: "La catolicización de Lituania"
 pol_catholicism_of_lithuania_desc: "Cuando Jogaila se convirtió en rey de Polonia, juró convertir Lituania al catolicismo. Erige iglesias y monasterios por toda Lituania en torno a Vilna y transforma esta tierra antaño pagana en un Estado plenamente católico. Sin esta conversión, no puede haber verdadera unidad de la unión polaco-lituana. “Lituania, renacida en la fe”."
 pol_royal_road: "El Camino Real"
 pol_royal_road_desc: "El “Camino Real” (Droga Królewska), que va de Cracovia por Gniezno y Poznań hasta Gdansk, es la gran arteria del Reino de Polonia. Con Mazovia incorporada y Prusia conquistada, el desarrollo de este camino mejora enormemente las comunicaciones, el comercio y la administración por todo el reino."
 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "Los privilegios de Nieszawa"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "La nobleza ha conquistado el derecho de veto a la legislación real. Comienza la “Libertad Dorada” polaca."
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "El código de leyes polaco"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "Nuevos artículos, derivados del código de leyes de Casimiro el Grande, acercan el día en que nobles y burgueses serán juzgados igualmente por el mismo tribunal."
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "Política de apoyo a los mercaderes"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "La política de apoyo a la burguesía urbana polaca eleva los ingresos comerciales."
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "La Ruta del Ámbar"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "Carretas cargadas de ámbar del Báltico siguen el antiguo camino hacia mercaderes que buscan el “oro del Norte”."
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "Nudo comercial de Poznań"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "La ciudad comercial de la Polonia occidental, Poznań, reconstruida como importante nudo comercial."
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "Vilna prospera"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "La capital del Gran Ducado de Lituania, Vilna, prospera como ciudad multicultural."
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "Acceso al Mar Negro"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "Polonia ha asegurado acceso al litoral norte del Mar Negro y entra en las rutas comerciales mediterráneas."
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "La fortaleza de Malbork"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "El mayor castillo medieval de Europa reconstruido con baluartes: una fortaleza inquebrantable."
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "El arzobispado de Gniezno"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "La catedral de Gniezno, hogar de las reliquias de San Adalberto, funciona como centro espiritual de la civilización católica polaca."
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "La venganza de Varna"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "La humillante derrota de 1444 vengada. Polonia conquista gloria cada vez mayor en la lucha contra el mundo islámico."
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "La costa de Pomerania"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "La costa pomerana en torno a Stettin reconstruida como cabeza de puente de la flota polaca."
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "La Universidad de Praga prospera"
 STATIC_MODIFIER_DESC_pol_prague_learning_mod: "La más antigua universidad de Europa centro-oriental, la Universidad Carolina, prospera de nuevo bajo dominio polaco."
 STATIC_MODIFIER_NAME_pol_habsburg_victory_mod: "Victoria sobre los Habsburgo"
 STATIC_MODIFIER_DESC_pol_habsburg_victory_mod: "Viena ocupada o unión personal con los Habsburgo: Polonia se ha convertido en señora de Europa central."
 STATIC_MODIFIER_NAME_pol_sea_to_sea_mod: "De mar a mar"
 STATIC_MODIFIER_DESC_pol_sea_to_sea_mod: "Polonia, que se extiende del Báltico al Mar Negro, domina todo el comercio de Europa oriental."
 STATIC_MODIFIER_NAME_pol_lithuanian_church_mod: "La Iglesia lituana"
 STATIC_MODIFIER_DESC_pol_lithuanian_church_mod: "La catolicización de Lituania ha alcanzado la unidad espiritual de la unión polaco-lituana."
 STATIC_MODIFIER_NAME_pol_royal_road_mod: "El Camino Real"
 STATIC_MODIFIER_DESC_pol_royal_road_mod: "Funcionarios, mercaderes y soldados viajan en larga fila por el Camino Real, de Cracovia a Gdansk."
 pol_lithuanian_relations: "Relaciones con Lituania"
 pol_lithuanian_relations_desc: "El Gran Ducado de Lituania —el más importante vecino de Polonia— puede ser un aliado o la mayor amenaza. En el siglo XIV, Lituania era la última nación pagana de Europa, pero aún un vasto Estado, que se extendía del Báltico al Mar Negro. Para asegurar la unión personal con Lituania mediante la política matrimonial de la reina Eduviges, es preciso primero asentar la base diplomática. Ya sea por relaciones amistosas o por presión militar, Polonia puede reivindicar el trono lituano."
 pol_develop_ruthenia_desc: "Halych (Halicz) y Volinia son los dos grandes principados de la Rutenia Roja. Leópolis, centro del principado de Halych, y el principado de Volinia fueron conquistados por Polonia en 1349-66. Bełz es también un importante baluarte rutenio. Traer tanto Halych como Volinia en unión personal bajo Polonia —o poseer directamente Leópolis y Bełz— establece el control sobre toda la Rutenia Roja. Esta tierra es una de las mayores zonas agrícolas de Europa, y su suelo rico sustenta la población y la economía polacas."
 STATIC_MODIFIER_NAME_pol_silesia_mines_mod: "Las minas de la Alta Silesia"
 STATIC_MODIFIER_DESC_pol_silesia_mines_mod: "En los pozos de la Alta Silesia, el sonido de las picas que extraen plata, zinc y plomo resuena día y noche."
 STATIC_MODIFIER_NAME_pol_baltic_fleet_mod: "La flota báltica polaca"
 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "La flota polaca, estacionada en Gdansk, domina el Báltico. De la desembocadura del Vístula al Mar del Norte, la bandera polaca ondea sobre las olas."
 STATIC_MODIFIER_NAME_pol_livonia_mod: "Dominio de Livonia"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "Bajo la bandera polaca, que ondea sobre los puertos de Riga y Reval, pueblos de muchas lenguas pagan tributo a los mismos recaudadores."
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "Lazos con la Hansa"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "En los kontors de Gdansk, quienes comparten la copa con los mercaderes hanseáticos conducen su comercio, confiando en la carga unos de otros."
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "Influencia sobre Transilvania"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "Por medio de la unión personal con Hungría, los enviados polacos son recibidos incluso en las cortes de los valles montañosos de Transilvania."
 pol_breadbasket_town_right_tt: "El derecho urbano «Panera real polaca» está ahora disponible. Puede concederse a ubicaciones de rango ciudad o superior que tengan un granero de nivel 5 o superior."
 STATIC_MODIFIER_NAME_pol_warsaw_location_mod: "Capital real Varsovia desarrollada"
 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "Las calles de Varsovia, construida a orillas del Vístula, se ensanchan de día en día, y los carruajes de los funcionarios de todo el reino se reúnen aquí."
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "Cracovia prospera"
 STATIC_MODIFIER_DESC_pol_krakow_location_mod: "Cracovia, en torno a Wawel, plenamente desarrollada. La ampliación del tamaño máximo de recursos y del crecimiento mensual de prosperidad la transforma en una ciudad digna de capital real polaca."
