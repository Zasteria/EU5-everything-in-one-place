l_spanish:
 ubv_oberbayern_mission_pack: "Legado de Múnich: el camino de la unificación de Baviera"
 ubv_oberbayern_mission_pack_DESCRIPTION:0 "Como casa de Múnich, descendiente del emperador Luis IV, reunifica las tierras divididas de Baviera en un solo todo."
 ubv_oberbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Desarrolla Múnich y une Baviera."
 ubv_oberbayern_mission_pack_BUTTON_TOOLTIP:0 "Desarrolla Múnich y une Baviera."
 ubv_oberbayern_mission_pack_BUTTON_DETAILS:0 "¡Álzate como duque de toda Baviera!"
 ubv_wittelsbach_legacy: "Legado de los Wittelsbach"
 ubv_wittelsbach_legacy_desc: "El ducado de Baviera, dividido por el Tratado de Pavía de 1329: como rama de Múnich, descendiente del emperador Luis IV, hereda este legado."
 ubv_secure_munich: "Desarrolla Múnich"
 ubv_secure_munich_desc: "Múnich, en el Isar: desarrolla esta ciudad, tan querida por el emperador Luis IV, como centro del ducado."
 ubv_salt_trade: "Comercio de la sal"
 ubv_salt_trade_desc: "La sal, llamada “oro blanco”: toma las minas de sal de Reichenhall y asegura la riqueza de este valioso recurso."
 ubv_imperial_relations: "Relaciones con el Imperio"
 ubv_imperial_relations_desc: "El trono imperial, un día ocupado por Luis IV: haz que nuestras relaciones con el Sacro Imperio Romano sean dignas de esa gloriosa memoria."
 ubv_bavarian_ambition: "Reivindicación de una sola Baviera"
 ubv_bavarian_ambition_desc: "Desarrollo de Múnich, comercio de la sal y relaciones con el Imperio: construye sobre ello y cultiva la reivindicación a toda Baviera."
 ubv_reunite_bavaria: "Reunifica Baviera"
 ubv_reunite_bavaria_desc: "El ducado dividido: recupera las tierras de la Baja Baviera y reunifica Baviera en un solo todo."
 ubv_duke_of_all_bavaria: "Duque de toda Baviera"
 ubv_duke_of_all_bavaria_desc: "Bajo la casa de Múnich, toda Baviera está por fin unida bajo un solo estandarte."
 ubv_events.1.t: "Proclamación de la unidad de Baviera"
 ubv_events.1.d: "Bajo la casa de Múnich, Baviera está por fin unida en un solo todo. La era de las divisiones llega a su fin."
 ubv_events.1.a: "¡Gloria a Baviera!"
 STATIC_MODIFIER_NAME_ubv_legacy_mod: "Legado de los Wittelsbach"
 STATIC_MODIFIER_DESC_ubv_legacy_mod: "La sangre de Luis IV, que un día portó la corona imperial, sigue siendo un nombre guardado con orgullo en el corazón de cada cortesano."
 STATIC_MODIFIER_NAME_ubv_munich_mod: "Múnich desarrollada"
 STATIC_MODIFIER_DESC_ubv_munich_mod: "La ciudad a orillas del Isar florece como centro del ducado."
 STATIC_MODIFIER_NAME_ubv_salt_mod: "Comercio de la sal"
 STATIC_MODIFIER_DESC_ubv_salt_mod: "Carretas cargadas de “oro blanco” de las minas de sal de Reichenhall ruedan sin cesar hacia los mercados de Múnich."
 STATIC_MODIFIER_NAME_ubv_imperial_mod: "Relaciones con el Imperio"
 STATIC_MODIFIER_DESC_ubv_imperial_mod: "Los lazos con la corte imperial, antaño presidida por Luis IV, siguen manteniendo enviados que van y vienen."
 STATIC_MODIFIER_NAME_ubv_reunite_mod: "Baviera reunificada"
 STATIC_MODIFIER_DESC_ubv_reunite_mod: "Los vasallos de las dos ramas antes divididas prestan ahora juramento bajo un único estandarte."
 STATIC_MODIFIER_NAME_ubv_unify_bavaria_mod: "Duque de toda Baviera"
 STATIC_MODIFIER_DESC_ubv_unify_bavaria_mod: "Las campanas de las torres bávaras repican, proclamando el fin de las divisiones."
 ubv_unified_duchy: "Ducado unificado de Baviera"
 ubv_unified_duchy_desc: "La era de las divisiones ha terminado: como ducado unificado de Baviera, abre una nueva era."
 ubv_bavaria_unified_tt: "Se ha unificado Baviera"
 ubv_landrecht: "Derecho territorial de Baviera"
 ubv_landrecht_desc: "Una ley uniforme para el ducado unificado: introduce el código de leyes bávaro (Landrecht) y fortalece el cimiento del gobierno."
 ubv_tyrol_ambition: "Ambiciones sobre el Tirol"
 ubv_tyrol_ambition_desc: "El condado del Tirol, escondido en el abrazo de los Alpes: alimenta ambiciones sobre esa tierra."
 ubv_swabian_expansion: "Expansión en Suabia"
 ubv_swabian_expansion_desc: "Suabia, que se extiende hacia el suroeste: refuerza nuestra influencia sobre esa región."
 ubv_greater_bavaria: "Realiza la Gran Baviera"
 ubv_greater_bavaria_desc: "Código de leyes, Tirol y Suabia: construye sobre ello y realiza la Gran Baviera."
 ubv_counter_reformation_leader: "Líder de la Contrarreforma"
 ubv_counter_reformation_leader_desc: "Encarna el espíritu del Concilio de Trento y asume el liderazgo de la Contrarreforma."
 ubv_electoral_dignity: "Dignidad electoral"
 ubv_electoral_dignity_desc: "En 1623 Maximiliano I consigue por fin el puesto de elector: haz de este honor el orgullo eterno de Baviera."
 ubv_austrian_rivalry: "Rivalidad con Austria"
 ubv_austrian_rivalry_desc: "La rivalidad con la casa de Habsburgo por la hegemonía en el Imperio: acepta este desafío de nuestro gran rival."
 ubv_war_of_austrian_succession: "Guerra de Sucesión Austríaca"
 ubv_war_of_austrian_succession_desc: "La guerra por la reivindicación de Carlos VII al trono imperial: aprovecha esta guerra de sucesión para elevar el prestigio de Baviera."
 ubv_imperial_crown: "Corona imperial"
 ubv_imperial_crown_desc: "En 1742 Carlos VII, duque de Baviera, es coronado emperador del Sacro Imperio Romano: el primero que no es Habsburgo en portar la corona en siglos."
 ubv_enlightened_absolutism: "Absolutismo ilustrado"
 ubv_enlightened_absolutism_desc: "La era de la Ilustración, que venera la razón y la ciencia: introduce esta nueva corriente de pensamiento en el gobierno de Baviera."
 ubv_napoleonic_alliance: "Desafío a Francia"
 ubv_napoleonic_alliance_desc: "Europa, sacudida por la revolución y la ambición de Napoleón: Baviera refuerza su reivindicación al trono de este poderoso vecino y abre su propio camino."
 ubv_kingdom_of_bavaria: "Proclamación del Reino de Baviera"
 ubv_kingdom_of_bavaria_desc: "En 1806 el elector Maximiliano IV José se proclama rey de Baviera: la larga historia de la casa de Wittelsbach alcanza aquí un nuevo apogeo."
 ubv_events.3.t: "Corona imperial"
 ubv_events.3.d: "En 1742 Carlos VII, duque de Baviera, fue coronado emperador del Sacro Imperio Romano en la catedral de Fráncfort. Habían pasado siglos desde que alguien que no fuera Habsburgo portara la corona imperial."
 ubv_events.3.a: "¡Gloria a Su Majestad Imperial!"
 ubv_events.99.t: "Proclamación del Reino de Baviera"
 ubv_events.99.d: "En 1806 el elector Maximiliano IV José, al amparo de la Confederación del Rin, se proclamó rey de Baviera. La larga historia de la casa de Wittelsbach alcanza aquí un nuevo apogeo."
 ubv_events.99.a: "¡Viva el Reino de Baviera!"
 STATIC_MODIFIER_NAME_ubv_unified_mod: "Ducado unificado de Baviera"
 STATIC_MODIFIER_DESC_ubv_unified_mod: "El ducado ya no necesita repartir sus cortes, rentas y guerreros entre ramas rivales."
 STATIC_MODIFIER_NAME_ubv_greater_mod: "La Gran Baviera realizada"
 STATIC_MODIFIER_DESC_ubv_greater_mod: "Desde las estribaciones de los Alpes hasta las colinas de Suabia, las tierras bajo el estandarte ducal se amplían cada estación."
 STATIC_MODIFIER_NAME_ubv_counter_reformation_mod: "Líder de la Contrarreforma"
 STATIC_MODIFIER_DESC_ubv_counter_reformation_mod: "En el espíritu del Concilio de Trento, los colegios jesuitas se abren uno tras otro en las ciudades del ducado."
 STATIC_MODIFIER_NAME_ubv_succession_war_mod: "Guerra de Sucesión Austríaca"
 STATIC_MODIFIER_DESC_ubv_succession_war_mod: "Oficiales y soldados templados en los campos de batalla de la Guerra de Sucesión Austríaca forman ahora el núcleo del ejército ducal."
 STATIC_MODIFIER_NAME_ubv_imperial_crown_mod: "Corona imperial"
 STATIC_MODIFIER_DESC_ubv_imperial_crown_mod: "El recuerdo del día en que el duque de Baviera fue coronado en la catedral de Fráncfort se guarda con orgullo en el corazón de cada cortesano."
 STATIC_MODIFIER_NAME_ubv_enlightenment_mod: "Absolutismo ilustrado"
 STATIC_MODIFIER_DESC_ubv_enlightenment_mod: "En la corte, los nuevos libros que llegan de Francia difunden los ideales de la Ilustración, y el número de escuelas crece cada año."
 STATIC_MODIFIER_NAME_ubv_electoral_dignity_mod: "Dignidad electoral"
 STATIC_MODIFIER_DESC_ubv_electoral_dignity_mod: "Cuando el duque, vestido con el manto de elector, toma asiento en las elecciones imperiales, los príncipes escuchan con atención sus palabras."
 STATIC_MODIFIER_NAME_ubv_kingdom_mod: "Reino de Baviera"
 STATIC_MODIFIER_DESC_ubv_kingdom_mod: "En el palacio de Múnich retumban las salvas que celebran la coronación del primer rey de Baviera de la casa de Wittelsbach."
