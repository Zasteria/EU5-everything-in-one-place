l_spanish:
 geo_georgia_mission_pack: "El Vellocino de Oro: el Reino del Cáucaso"
 geo_georgia_mission_pack_DESCRIPTION:0 "Bajo la dinastía Bagrationi, el Reino de Georgia se alza en la encrucijada del Cáucaso. Une el reino, reivindica la hegemonía sobre el Cáucaso y la estepa, o marcha como cruzado hacia Anatolia y Tierra Santa, y deja que la luz de la ortodoxia brille sobre Oriente."
 geo_georgia_mission_pack_CRITERIA_DESCRIPTION:0 "Reunifica Georgia, domina el Cáucaso y emprende una cruzada hacia el sur para realizar una nueva edad de oro."
 geo_georgia_mission_pack_BUTTON_TOOLTIP:0 "Desde la tierra del Vellocino de Oro, conviértete en el hegemón del Cáucaso."
 geo_georgia_mission_pack_BUTTON_DETAILS:0 "¡Restaura la gloria de la reina Tamar: de reino montañés a guardián del mundo ortodoxo!"
 geo_bagrationi_legacy: "El legado de los Bagrationi"
 geo_bagrationi_legacy_desc: "El linaje de la casa de Bagrationi gobierna el Cáucaso. Hereda este legado e inicia una nueva era de gobierno."
 geo_royal_succession: "Asegura la sucesión"
 geo_royal_succession_desc: "Sofoca las ambiciones de la nobleza y las disputas por el trono y establece un gobierno legítimo."
 geo_reunite_georgia: "Reunifica Georgia"
 geo_reunite_georgia_desc: "Tiflis, Kutaisi, Ajaltsije, Batumi: une las provincias fracturadas de Georgia bajo una sola corona."
 geo_fortify_caucasia: "Fortifica el Cáucaso"
 geo_fortify_caucasia_desc: "Endurece las escarpadas montañas con una red de fortalezas y repele las incursiones tanto de paganos como de conquistadores."
 geo_church_of_georgia: "La Iglesia georgiana"
 geo_church_of_georgia_desc: "Haz de la Iglesia ortodoxa georgiana autocéfala un pilar del Estado y forja la unidad por medio de la fe."
 geo_royal_court: "La corte real"
 geo_royal_court_desc: "Adorna la corte real de Tiflis y hazla un centro de cultura y autoridad sin igual en el Cáucaso."
 geo_georgian_army: "El ejército georgiano"
 geo_georgian_army_desc: "Forja un poderoso ejército, reclutado entre los pueblos de la montaña, y haz de él la espada del reino."
 geo_recover_strength: "Recupera fuerzas"
 geo_recover_strength_desc: "Restaura la fuerza minada por repetidas penurias y abre un nuevo futuro por medio de la alianza y el rearme."
 geo_queen_tamar_ambition: "La ambición de la reina Tamar"
 geo_queen_tamar_ambition_desc: "Las tierras de Armenia, antaño parte del dominio de la reina Tamar: libera a nuestros hermanos cristianos del dominio pagano y restaura la autoridad de Tiflis."
 geo_reclaim_shirvan: "Recupera Shirván"
 geo_reclaim_shirvan_desc: "Recupera Shirván, antaño bajo la suzeranía georgiana, y obtén una cabeza de puente en el Mar Caspio."
 geo_heirs_of_seljuks: "Los herederos de los selyúcidas"
 geo_heirs_of_seljuks_desc: "Recupera las tierras orientales de las potencias que heredaron el legado selyúcida y restaura en esta región la autoridad de la cruz."
 geo_gates_of_alexander: "Las Puertas de Alejandro"
 geo_gates_of_alexander_desc: "Cruza las llamadas “Puertas de Alejandro” a través del Cáucaso y subyuga a las tribus del norte."
 geo_bane_of_khagan: "El azote del Kan"
 geo_bane_of_khagan_desc: "Los descendientes de los mongoles siguen amenazando el mundo ortodoxo. Pon fin a su dominio y elimina este azote para siempre."
 geo_seize_crimea: "Toma Crimea"
 geo_seize_crimea_desc: "Subyuga la península de Crimea, último santuario de los tártaros, y asegura nuestro dominio sobre el Mar Negro."
 geo_control_black_sea: "Controla el Mar Negro"
 geo_control_black_sea_desc: "Habiendo tomado la mayor parte de la costa del Mar Negro, integra por completo este mar interior en la esfera comercial de Georgia."
 geo_envoy_to_tsar: "Un enviado al zar"
 geo_envoy_to_tsar_desc: "Envía un enviado al zar, alzado como potencia dominante de la Rus, y busca el camino de la alianza."
 geo_caucasus_hegemony: "Hegemonía del Cáucaso"
 geo_caucasus_hegemony_desc: "Montañas, estepa y Mar Negro: completa una hegemonía inquebrantable sobre todo el Cáucaso."
 geo_deal_with_trebizond: "Trato con Trebisonda"
 geo_deal_with_trebizond_desc: "El Imperio de Trebisonda, fundado con la ayuda de la reina Tamar: renueva el vínculo con este viejo amigo y elijan juntos un camino por delante."
 geo_conquer_jalayirids: "Subyuga el Sultanato yalayirí"
 geo_conquer_jalayirids_desc: "En el caos que siguió al colapso del Ilkanato, el Sultanato yalayirí se ha alzado en esta tierra: subyuga a este heredero del legado mongol y abre el camino hacia el Este."
 geo_encroach_mamluks: "Avanza sobre los mamelucos"
 geo_encroach_mamluks_desc: "La Tierra Santa, perdida por los antiguos cruzados: avanza hacia el Oriente gobernado por los mamelucos y prepárate para recuperar la luz de la fe."
 geo_conquer_cyprus: "Conquista Chipre"
 geo_conquer_cyprus_desc: "Toma Chipre, baluarte del Mediterráneo oriental, y asegura la hegemonía sobre la región junto a los poderes cruzados locales."
 geo_cradle_of_civilization: "Cuna de la civilización"
 geo_cradle_of_civilization_desc: "Libera Mesopotamia, cuna de la civilización humana, del dominio musulmán y reclama sus riquezas para Georgia."
 geo_claim_holy_city: "Reclama la Ciudad Santa"
 geo_claim_holy_city_desc: "Mientras Jerusalén yazga bajo dominio sarraceno, una nube oscura pende sobre la cristiandad. Recupera la Ciudad Santa y prueba el triunfo de la fe."
 geo_light_of_east: "Luz de Oriente"
 geo_light_of_east_desc: "Alejandría, Jerusalén, Antioquía: libera los antiguos patriarcados orientales y muestra al mundo que la luz de Oriente no se ha extinguido."
 geo_anatolian_incursion: "Incursión en Anatolia"
 geo_anatolian_incursion_desc: "Desde la derrota de Manzikert, Anatolia ha caído en manos de potencias túrquicas: venga esa derrota y conviértete en el nuevo hegemón de esta tierra."
 geo_empires_downfall: "La caída del Imperio"
 geo_empires_downfall_desc: "El Imperio otomano, dominante en los Balcanes y en Oriente Medio: relega a las páginas de la historia esta amenaza para toda la cristiandad."
 geo_throne_of_romans: "El trono de los romanos"
 geo_throne_of_romans_desc: "La gran ciudad de Constantinopla ha yacido largo tiempo en manos paganas. Libera esta joya y toma el trono romano como emperador georgiano."
 geo_beacon_of_christendom: "Faro de la cristiandad"
 geo_beacon_of_christendom_desc: "Restaurado el poder de la ortodoxia, ha llegado la hora de probar al mundo nuestra piedad y la rectitud que Dios nos ha dado: haz de nuestro reino un paraíso unido de la cristiandad."
 geo_georgian_crusader_realm: "El reino cruzado georgiano"
 geo_georgian_crusader_realm_desc: "Del Cáucaso al Mediterráneo: este gran imperio, construido bajo la cruz, es el cumplimiento del sueño de la reina Tamar."
 geo_rebuild_tbilisi: "Reconstruye Tiflis"
 geo_rebuild_tbilisi_desc: "Nuestra capital, Tiflis, desgastada por repetidas invasiones extranjeras: emprende la restauración de su antiguo esplendor."
 geo_georgian_vineyards: "Los viñedos georgianos"
 geo_georgian_vineyards_desc: "La tradición vinícola de Georgia, que abarca más de mil años: deja que esta orgullosa industria sea conocida por el mundo."
 geo_revive_literature: "Revive la literatura nativa"
 geo_revive_literature_desc: "Asomtavruli, Nuskhuri, Mkhedruli: tres escrituras que llevan la herencia georgiana. Revive esta cultura y difunde su lengua y su escritura por todo el Cáucaso."
 geo_legacy_of_builder: "El legado del Constructor"
 geo_legacy_of_builder_desc: "Siguiendo el reinado de David el Constructor, trae fama, riqueza e importancia a nuestras ciudades."
 geo_svetitskhoveli_cathedral: "Catedral de Svetitskhoveli"
 geo_svetitskhoveli_cathedral_desc: "La Catedral del Pilar Viviente, corazón de la Iglesia apostólica georgiana: reconstrúyela con un esplendor mayor que nunca."
 geo_patriarchate_of_georgia: "Patriarcado de toda Georgia"
 geo_patriarchate_of_georgia_desc: "A medida que crece la influencia del Estado, crece también la llamada a elevar la Iglesia georgiana autocéfala al rango de patriarcado."
 geo_silk_road_trade: "Comercio de la Ruta de la Seda"
 geo_silk_road_trade_desc: "Como nudo que une Oriente y Occidente a lo largo de la Ruta de la Seda, llena las ciudades de Georgia con la riqueza del comercio."
 geo_mountain_fortresses: "Fortalezas de montaña"
 geo_mountain_fortresses_desc: "Aprovecha el escarpado terreno del Cáucaso y completa una red de fortalezas capaz de detener a cualquier ejército."
 geo_golden_age: "La edad de oro concluida"
 geo_golden_age_desc: "La edad de oro construida por la reina Tamar y David el Constructor: eleva su gloria a alturas sin precedentes."
 geo_events.1.t: "La caída de Sarai"
 geo_events.1.d: "Sarai, capital del Estado sucesor mongol, ha caído en nuestras manos. La autoridad del Kan, que antaño sacudió el mundo ortodoxo, pertenece ahora al pasado."
 geo_events.1.a: "¡El azote del Kan ha llegado a su fin!"
 geo_events.2.t: "La caída de Constantinopla"
 geo_events.2.d: "La gran ciudad imperial de Constantinopla ha caído por fin en nuestras manos. El estandarte georgiano ondea ahora sobre esta ciudad, antaño en poder del infiel: el Rey del Cáucaso reclama el título de heredero de Roma."
 geo_events.2.a: "¡Viva el Imperio romano! ¡Viva el Emperador georgiano!"
 geo_events.99.t: "Proclamación de la edad de oro"
 geo_events.99.d: "Del Cáucaso al Mediterráneo: la edad de oro con que soñó la reina Tamar está ahora concluida. Un pequeño reino montañés ha renacido como un gran imperio que ilumina el mundo ortodoxo."
 geo_events.99.a: "¡Gloria a Georgia! ¡Viva la edad de oro!"
 STATIC_MODIFIER_NAME_geo_bagrationi_mod: "El esplendor de los Bagrationi"
 STATIC_MODIFIER_DESC_geo_bagrationi_mod: "El linaje real otorga al Estado prestigio y legitimidad."
 STATIC_MODIFIER_NAME_geo_succession_mod: "Sucesión estable"
 STATIC_MODIFIER_DESC_geo_succession_mod: "La sucesión real es estable, y los disturbios internos han amainado."
 STATIC_MODIFIER_NAME_geo_reunite_mod: "Georgia reunificada"
 STATIC_MODIFIER_DESC_geo_reunite_mod: "Las provincias fracturadas están de nuevo unidas bajo una sola corona."
 STATIC_MODIFIER_NAME_geo_fortify_mod: "La red de fortalezas del Cáucaso"
 STATIC_MODIFIER_DESC_geo_fortify_mod: "Fortalezas de piedra, erigidas en las cumbres de los pasos del Cáucaso, vigilan desde lejos la sombra del invasor."
 STATIC_MODIFIER_NAME_geo_church_mod: "La Iglesia georgiana"
 STATIC_MODIFIER_DESC_geo_church_mod: "La Iglesia ortodoxa funciona ahora como pilar del Estado, forjando la unidad por medio de la fe."
 STATIC_MODIFIER_NAME_geo_court_mod: "Esplendor de la corte real"
 STATIC_MODIFIER_DESC_geo_court_mod: "La corte real de Tiflis brilla como centro de cultura y autoridad en el Cáucaso."
 STATIC_MODIFIER_NAME_geo_army_mod: "El ejército georgiano"
 STATIC_MODIFIER_DESC_geo_army_mod: "Un poderoso ejército, reclutado entre los pueblos de la montaña, está concluido y sirve como espada del reino."
 STATIC_MODIFIER_NAME_geo_recover_mod: "Fuerzas recuperadas"
 STATIC_MODIFIER_DESC_geo_recover_mod: "Por medio de la alianza y el rearme, el reino ha dado un paso hacia un nuevo futuro."
 STATIC_MODIFIER_NAME_geo_tamar_mod: "La ambición de la reina Tamar"
 STATIC_MODIFIER_DESC_geo_tamar_mod: "Nuestros hermanos armenios han sido liberados, y la autoridad de Tiflis alcanza ahora hacia el este."
 STATIC_MODIFIER_NAME_geo_shirvan_mod: "Shirván recuperada"
 STATIC_MODIFIER_DESC_geo_shirvan_mod: "Una cabeza de puente en el Mar Caspio asegurada, y la riqueza del comercio oriental fluye hacia el reino."
 STATIC_MODIFIER_NAME_geo_seljuk_mod: "Los herederos de los selyúcidas"
 STATIC_MODIFIER_DESC_geo_seljuk_mod: "Las potencias que heredaron el legado selyúcida han sido repelidas, y la autoridad de la cruz ha vuelto a Oriente."
 STATIC_MODIFIER_NAME_geo_gates_mod: "Las Puertas de Alejandro"
 STATIC_MODIFIER_DESC_geo_gates_mod: "Cruzados los pasos del norte, las tribus al norte del Cáucaso han sido subyugadas."
 STATIC_MODIFIER_NAME_geo_crimea_mod: "Crimea tomada"
 STATIC_MODIFIER_DESC_geo_crimea_mod: "El último santuario de los tártaros ha sido subyugado, abriendo rutas comerciales a través del Mar Negro."
 STATIC_MODIFIER_NAME_geo_black_sea_mod: "Control del Mar Negro"
 STATIC_MODIFIER_DESC_geo_black_sea_mod: "La mayor parte de la costa del Mar Negro está ahora integrada en la esfera comercial de Georgia."
 STATIC_MODIFIER_NAME_geo_tsar_mod: "Alianza con el zar"
 STATIC_MODIFIER_DESC_geo_tsar_mod: "Establecidas las relaciones con la potencia dominante de la Rus, nuestra red diplomática se amplía."
 STATIC_MODIFIER_NAME_geo_hegemony_mod: "Hegemonía del Cáucaso"
 STATIC_MODIFIER_DESC_geo_hegemony_mod: "Montañas, estepa y Mar Negro: la hegemonía sobre todo el Cáucaso está completa."
 STATIC_MODIFIER_NAME_geo_trebizond_mod: "Trato con Trebisonda"
 STATIC_MODIFIER_DESC_geo_trebizond_mod: "El vínculo con nuestro viejo amigo ha sido renovado, y el comercio entre los dos reinos florece."
 STATIC_MODIFIER_NAME_geo_jalayirid_mod: "Sultanato yalayirí subyugado"
 STATIC_MODIFIER_DESC_geo_jalayirid_mod: "La amenaza yalayirí ha sido eliminada, probando la fuerza de nuestro ejército."
 STATIC_MODIFIER_NAME_geo_mamluk_mod: "Avance sobre los mamelucos"
 STATIC_MODIFIER_DESC_geo_mamluk_mod: "El estandarte de la cruz, avanzado hacia el este, ondea incluso en el horizonte del desierto, y los reyes de otras fes han oído su nombre."
 STATIC_MODIFIER_NAME_geo_cyprus_mod: "Chipre conquistada"
 STATIC_MODIFIER_DESC_geo_cyprus_mod: "Mercantes georgianos, anclados en los puertos de Chipre, cargan las especias del Mediterráneo oriental."
 STATIC_MODIFIER_NAME_geo_mesopotamia_mod: "Cuna de la civilización"
 STATIC_MODIFIER_DESC_geo_mesopotamia_mod: "Lana y tintes de las fértiles orillas del Tigris y el Éufrates son llevados a los talleres de Georgia."
 STATIC_MODIFIER_NAME_geo_holy_city_mod: "La Ciudad Santa reclamada"
 STATIC_MODIFIER_DESC_geo_holy_city_mod: "La recuperación de Jerusalén ha elevado la autoridad de la Iglesia y la devoción del pueblo."
 STATIC_MODIFIER_NAME_geo_light_east_mod: "Luz de Oriente"
 STATIC_MODIFIER_DESC_geo_light_east_mod: "La liberación de los patriarcados orientales ha elevado la moral y el honor del ejército."
 STATIC_MODIFIER_NAME_geo_anatolia_mod: "Incursión en Anatolia"
 STATIC_MODIFIER_DESC_geo_anatolia_mod: "Los soldados georgianos que de nuevo pisaron el campo de Manzikert marchan en filas, orgullosos de haber vengado la antigua humillación."
 STATIC_MODIFIER_NAME_geo_downfall_mod: "La caída del Imperio"
 STATIC_MODIFIER_DESC_geo_downfall_mod: "En la corte de Tiflis, libre de la amenaza otomana, enviados de muchas naciones se inclinan ante el Rey de Georgia."
 STATIC_MODIFIER_NAME_geo_beacon_mod: "Faro de la cristiandad"
 STATIC_MODIFIER_DESC_geo_beacon_mod: "El nombre del Rey de Georgia, llamado guardián de la fe, se pronuncia con respeto en las cortes de las naciones que portan la misma cruz."
 STATIC_MODIFIER_NAME_geo_tbilisi_mod: "Tiflis reconstruida"
 STATIC_MODIFIER_DESC_geo_tbilisi_mod: "La capital real, Tiflis, recupera su antiguo esplendor."
 STATIC_MODIFIER_NAME_geo_vineyards_mod: "Los viñedos georgianos"
 STATIC_MODIFIER_DESC_geo_vineyards_mod: "El aroma del vino, añejado mil años en tinajas de barro qvevri, llena los valles de Kajetia."
 STATIC_MODIFIER_NAME_geo_literature_mod: "Literatura nativa revivida"
 STATIC_MODIFIER_DESC_geo_literature_mod: "La difusión de la escritura Mkhedruli ha avanzado el saber y el gobierno."
 STATIC_MODIFIER_NAME_geo_builder_mod: "El legado del Constructor"
 STATIC_MODIFIER_DESC_geo_builder_mod: "Continuando la voluntad de David el Constructor, nuestras ciudades caminan hacia la prosperidad."
 STATIC_MODIFIER_NAME_geo_cathedral_mod: "Catedral de Svetitskhoveli"
 STATIC_MODIFIER_DESC_geo_cathedral_mod: "La Catedral del Pilar Viviente ha sido reconstruida, restaurando su esplendor como centro de la fe."
 STATIC_MODIFIER_NAME_geo_patriarchate_mod: "Patriarcado de toda Georgia"
 STATIC_MODIFIER_DESC_geo_patriarchate_mod: "La Iglesia georgiana ha sido elevada al rango de patriarcado, y su autoridad es ampliamente reconocida."
 STATIC_MODIFIER_NAME_geo_silk_road_mod: "Comercio de la Ruta de la Seda"
 STATIC_MODIFIER_DESC_geo_silk_road_mod: "Como nudo del comercio Este-Oeste, las ciudades de Georgia rebosan de riqueza."
 STATIC_MODIFIER_NAME_geo_mountain_fort_mod: "La red de fortalezas de montaña"
 STATIC_MODIFIER_DESC_geo_mountain_fort_mod: "Una red de fortalezas, construida sobre el terreno del Cáucaso, puede detener a cualquier gran ejército."
 STATIC_MODIFIER_NAME_geo_golden_age_mod: "La edad de oro concluida"
 STATIC_MODIFIER_DESC_geo_golden_age_mod: "La edad de oro construida por la reina Tamar y David el Constructor ha alcanzado nuevas alturas."
 STATIC_MODIFIER_NAME_geo_constantinople_fall_mod: "Legado de la Bizancio imperial"
 STATIC_MODIFIER_DESC_geo_constantinople_fall_mod: "La maquinaria diplomática y administrativa de la ciudad milenaria ha sido capturada. Heredando la burocracia y el ceremonial diplomático de Roma, nuestros súbditos se vuelven más leales, y el proceso de anexión avanza con más suavidad."
 STATIC_MODIFIER_NAME_geo_golden_age_declaration_mod: "La red de gobierno de la edad de oro"
 STATIC_MODIFIER_DESC_geo_golden_age_declaration_mod: "Un gran imperio, que se extiende del Cáucaso al Mediterráneo, está unido por caminos reales y una red de gobernadores locales. La prosperidad construida por la reina Tamar y David el Constructor lleva la luz de la corona a las provincias más lejanas, haciendo inquebrantables la legitimidad y el prestigio de la dinastía."
