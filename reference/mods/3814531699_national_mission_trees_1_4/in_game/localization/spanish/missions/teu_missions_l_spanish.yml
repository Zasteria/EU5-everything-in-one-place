l_spanish:
 teu_teutonic_mission_pack: "La Orden Teutónica: espada y cruz"
 teu_teutonic_mission_pack_DESCRIPTION:0 "La Orden Teutónica, que conquistó el Báltico en nombre de Dios. Alza el estandarte de la cruzada y destruye a los paganos y ortodoxos del Este para completar la Cruzada del Norte, o seculariza y sienta las bases de la Alemania moderna con el Reino de Prusia. Ha llegado la hora de la elección."
 teu_teutonic_mission_pack_CRITERIA_DESCRIPTION:0 "Completa la Cruzada del Norte por el camino de la cruzada, o construye el Reino de Prusia por el camino de la secularización."
 teu_teutonic_mission_pack_BUTTON_TOOLTIP:0 "Conquista el Báltico y Europa oriental con la espada y la cruz."
 teu_teutonic_mission_pack_BUTTON_DETAILS:0 "“Toda ayuda a quienes la piden, ninguna piedad al enemigo”: ¡gobierna el Báltico en nombre del Gran Maestre!"
 teu_crusaders_legacy: "El legado de la Orden Cruzada"
 teu_crusaders_legacy_desc: "Fundada en Acre en 1190 durante la Tercera Cruzada, la Orden Teutónica comenzó como orden hospitalaria en Tierra Santa. En 1226, la Bula de Oro de Rímini, de Federico II, concedió a la orden el derecho de conducir una expedición contra los paganos prusianos, y desde entonces conquistó la costa sur del Báltico con la espada cruzada. Este “Estado monje-caballero”, con capital en Malbork, permanece el último Estado cruzado de Europa, que continúa las guerras de conversión y colonización. Ahora, cercada por los poderosos rivales, la Lituania de Gediminas y la Polonia jagellónica, el verdadero valor de la orden será puesto a prueba."
 teu_secure_prussia: "Asegura Prusia"
 teu_secure_prussia_desc: "Prusia —antaño hogar de los pueblos bálticos prusianos— fue conquistada en más de cincuenta años de conquistas de la Orden Teutónica, iniciadas en la década de 1230. Tras la supresión de la “Gran Revuelta” de 1283, la población nativa fue efectivamente aniquilada, y la tierra, reconstruida por una colonia de colonos alemanes. Sin embargo, en las montañas y bosques, las brasas de la resistencia aún arden. Completa la red de fortalezas por toda Prusia y haz inquebrantable el gobierno de la orden: pues sin Prusia no hay Orden Teutónica."
 teu_christianize_prussia: "Cristianiza Prusia"
 teu_christianize_prussia_desc: "El declarado motivo de existencia de la Orden Teutónica es “convertir a los paganos”. En realidad, la mayoría de los prusianos conquistados fue convertida a la fuerza, y los que resistieron, exterminados. El Tratado de Christburg, de 1249, concedió derechos a la nobleza prusiana a cambio del bautismo, pero las revueltas posteriores quebraron esta promesa. Ahora alcanza la verdadera catolización y construye una red de iglesias para establecer la legitimidad religiosa de la orden: solo con el apoyo del papa puede este Estado convertirse verdaderamente en legítimo."
 teu_subdue_lithuania: "Subyuga Lituania"
 teu_subdue_lithuania_desc: "El Gran Ducado de Lituania —vasto Estado pagano que, bajo la dinastía de los Gediminaitis, se extendía del Báltico a Ucrania— fue tanto la mayor amenaza de la Orden Teutónica como su mayor objetivo de cruzada. La derrota en Durbe, en 1260, el desastre en Grunwald, en 1410: Lituania derrotó repetidamente a la orden. Sin embargo, con la conversión de Jogaila al catolicismo, en 1387, Lituania dejó nominalmente de ser un “Estado pagano”, lo que complicó la justificación de la cruzada. Aun así, solo ganando la lucha por la supremacía contra Lituania puede la orden gobernar verdaderamente el Báltico."
 teu_subdue_poland: "Subyuga Polonia"
 teu_subdue_poland_desc: "15 de julio de 1410, batalla de Grunwald (Tannenberg): la mayor derrota de la historia de la Orden Teutónica. El gran maestre Ulrich von Jungingen y la flor de la caballería de la orden cayeron, y la propia Malbork fue sitiada. La Segunda Paz de Toruń, de 1466, entregó Prusia Occidental a Polonia, reduciendo a la orden a poco más que vasalla. Venga esta humillación: derrota a Polonia, recupera las tierras perdidas y lava la vergüenza de Grunwald."
 teu_order_or_prussia: "La elección: cruzada o secularización"
 teu_order_or_prussia_desc: "En 1511, cuando Alberto de Hohenzollern se convirtió en Gran Maestre, la orden estaba en una encrucijada de supervivencia. Mientras la Reforma de Lutero, de 1517, sacudía Europa, Alberto se encontró con el propio Lutero y eligió secularizar la orden, fundando el ducado de Prusia en 1525. Pero ¿y si la orden, en lugar de ello, hubiera continuado su misión cruzada? Completa la “Cruzada del Norte”, subyugando a los ortodoxos, paganos y musulmanes del Este, o sienta las bases de la Prusia moderna con un ducado secular: la elección es tuya."
 teu_crusade_path: "El camino de la Cruzada del Norte"
 teu_crusade_path_desc: "El camino de la cruzada: empuña la espada en nombre de Dios. La verdadera vocación de la Orden Teutónica es convertir y conquistar a los paganos. Al este aguardan las tierras ortodoxas de la Rus; en el litoral báltico, la alianza con la Orden Livona seduce. Como en la conquista de Prusia, alza el estandarte cruzado de la costa oriental del Báltico a la Rusia septentrional. La indulgencia de cruzada, concedida por Gregorio IX, permanece eternamente válida: completa la Cruzada del Norte en nombre de Dios y graba el nombre del Gran Maestre en la historia."
 teu_path_crusade_chosen_tt: "Se eligió el camino de la cruzada"
 teu_path_secular_chosen_tt: "Se eligió el camino de la secularización"
 teu_livonian_alliance: "Alianza con la Orden Livona"
 teu_livonian_alliance_desc: "La Orden Livona: heredera de los Hermanos de la Espada, absorbida por la Orden Teutónica en 1237. Con base en Riga, esta orden controla la costa este del Báltico, pero bajo constante presión de Lituania y la Rus. Sufrió la derrota ante Alejandro Nevski en la batalla del Lago Peipus, en 1242, y un golpe aplastante de Lituania en Durbe, en 1260. Ahora forja la alianza con la Orden Livona y construye un sistema conjunto para gobernar juntos el Báltico oriental: usa la fuerza de la orden hermana para derrotar a los enemigos del Este."
 teu_crusade_east: "Cruzada hacia el Este"
 teu_crusade_east_desc: "Vuelve la espada cruzada hacia el este: los “cismáticos” ortodoxos, los “romuvianos” paganos, los “infieles” musulmanes. Todos son enemigos de la fe católica y objetivo de la cruzada. Desde la década de 1230, la Orden Teutónica condujo la “Cruzada del Norte” por tierras bálticas. Ahora amplía el horizonte más al este y conduce la guerra santa contra el corazón de la ortodoxia oriental y los últimos baluartes de los bálticos. La conversión de Lituania al catolicismo, en 1386, redujo el número de objetivos “legítimos” de la cruzada, pero los Estados ortodoxos de la Rus aún permanecen."
 teu_riga_crusade: "Riga, baluarte de la cruzada"
 teu_riga_crusade_desc: "Riga: fundada en 1201 por el obispo Alberto von Buxhoeveden, esta ciudad es el más importante baluarte en la costa oriental del Báltico. Una larga lucha de poder se dio entre la Orden Livona y el arzobispo de Riga, pero, si la Orden Teutónica consigue unificar la ciudad y desarrollarla como base avanzada de la cruzada oriental, se convertirá en cabeza de puente para oponerse a la Rus. Situada en la desembocadura del Dvina, Riga es vital tanto para el comercio como para la guerra: asegurarla establece una línea de suministro para el avance hacia el este."
 teu_march_to_orthodox: "Marcha sobre la ortodoxia"
 teu_march_to_orthodox_desc: "La “herética” iglesia ortodoxa: a ojos de la Roma católica, las iglesias bizantina y rusa mantenían una “fe falsa” desde el Gran Cisma de 1054. La República de Nóvgorod, Pskov, los principados rusos: estos Estados ortodoxos son el verdadero objetivo de la Cruzada del Norte. En 1242, Alejandro Nevski derrotó a la Orden Livona en el hielo del Lago Peipus y es hasta hoy celebrado como “el héroe que derrotó a los cruzados”. Venga esta derrota y alza el estandarte católico en tierra ortodoxa: esta es la suprema misión de la Orden Teutónica."
 teu_northern_crusade_final: "Cruzada del Norte concluida"
 teu_northern_crusade_final_desc: "La Cruzada del Norte —iniciada con la conquista de Prusia y extendida por la costa oriental del Báltico hasta el interior de la Rus— se aproxima por fin a la conclusión. Como antaño los prusianos, los ortodoxos deben ser convertidos o subyugados. El Báltico se convierte en el mar interior de la Orden Teutónica, y el estandarte del Gran Maestre ondea hasta el extremo oriental del mundo. El sueño de la “Cruzada del Norte”, heredado de los Hermanos de la Espada del siglo XIII —la unificación de las tierras de los bálticos, eslavos y fineses en un imperio sagrado— es ahora realizado."
 teu_secularize_path: "El camino de la secularización"
 teu_secularize_path_desc: "El 10 de abril de 1525, en Cracovia, Alberto de Hohenzollern proclamó la fundación del ducado de Prusia como feudo del rey Segismundo I de Polonia: la secularización de la Orden Teutónica. A cambio de la conversión al luteranismo, las tierras de la orden sobrevivirán como ducado secular. Los Estados católicos se indignaban con esta “traición”, pero la creciente ola del protestantismo dio a la orden un nuevo camino por delante. Asiéntate en la ola de la Reforma y, como duque secular, sienta las bases de la Prusia moderna: este es un nuevo modo de vida de la orden en una nueva era."
 teu_prussian_duchy: "El Ducado de Prusia"
 teu_prussian_duchy_desc: "El Ducado de Prusia —nacido de la secularización en 1525— se desarrolló rápidamente bajo los Hohenzollern. Con Königsberg como capital, apoyó activamente la Reforma luterana y, por medio de la Universidad de Königsberg (fundada en 1544), se llamó “Prusia del saber”. El antiguo Estado cruzado se transforma ahora en un ducado moderno. Construye la administración, forja la cooperación con la nobleza junker y establece las bases del Estado militar: primer paso hacia el futuro Reino de Prusia y, después, al Imperio alemán."
 teu_control_pomerania: "Domina Pomerania"
 teu_control_pomerania_desc: "Pomerania —que se extiende a lo largo de la costa meridional del Báltico, al oeste del Vístula— fue desde hace mucho disputada por príncipes alemanes, Dinamarca y Polonia. El Ducado de Pomerania, de la dinastía de los Grifos, es un pequeño Estado, encajado entre Prusia y Brandeburgo, pero su acceso al Báltico lo hace estratégicamente vital. Tomando Pomerania, Prusia se convierte en verdadera señora del Báltico. Domina el puerto de Stettin (Szczecin) y las vías fluviales del Óder y forja el “eje norgermánico”, que une Brandeburgo y Pomerania."
 teu_protestant_reformation: "La Reforma protestante"
 teu_protestant_reformation_desc: "En 1517, Martín Lutero clavó sus Noventa y Cinco Tesis en la puerta de la iglesia de Wittenberg, y la ola de la Reforma golpeó de lleno Prusia. El propio Gran Maestre Alberto se encontró con Lutero y eligió secularizar la orden. La adopción del luteranismo por Prusia se convirtió en la base de la “liga protestante” contra los Habsburgo católicos. Promueve activamente la Reforma y moderniza la educación y el gobierno: la tradición académica de la Universidad de Königsberg y la burocracia disciplinada de Prusia se convertirán en la piedra angular de la cultura prusiana durante generaciones."
 teu_dominate_hre: "Asciende en el Sacro Imperio Romano"
 teu_dominate_hre_desc: "El Sacro Imperio Romano —ridiculizado como “ni sagrado, ni romano, ni imperio”— es un orden político complejo. ¿Cómo se abrirá camino Prusia en él? El poder de los emperadores habsburgos, la rivalidad de los electores, las divisiones causadas por la Reforma: todo esto crea oportunidades para el ascenso de Prusia. La unión de Brandeburgo y Prusia de 1618 bajo la herencia de los Hohenzollern se convertirá en la base de la posterior Alemania unificada. Establece tu estatus de elector, amplía tu influencia dentro del Imperio y eleva a Prusia como rival de los Habsburgo y líder de la Alemania del Norte."
 teu_north_german_empire: "La Confederación de la Alemania del Norte"
 teu_north_german_empire_desc: "El Imperio de la Alemania del Norte: sueño de Bismarck, ambición de la casa de Hohenzollern. En el siglo XVIII, Federico el Grande probó el poder de Prusia en la Guerra de los Siete Años contra Austria; en el XIX, Bismarck unificó Alemania “por sangre y hierro”. Pero mucho antes, como Estado heredero de la Orden Teutónica, el sueño de Prusia de unificar toda la Alemania del Norte ya tenía larga historia. Brandeburgo, Pomerania, Mecklemburgo, Hannover: reúne a los príncipes de la Alemania del Norte y realiza aquí y ahora la Confederación de la Alemania del Norte, que se convertirá en precursora del Estado alemán moderno."
 teu_malbork_citadel: "Fortifica la ciudadela de Malbork"
 teu_malbork_citadel_desc: "El Castillo de Malbork (Marienburg) —esta vasta fortaleza de ladrillo en el delta del Vístula— es la sede principal de la Orden Teutónica. Trasladada de Venecia en 1309, se alza como el mayor castillo medieval de ladrillo de Europa. Tras la derrota en Grunwald, en 1410, fue sitiada por fuerzas polacas, pero resistió bajo el mando del gran maestre en funciones Heinrich von Plauen. Las murallas de Malbork —símbolo mismo del Estado de la orden—: fortificarlas en un baluarte inexpugnable es la base de toda estrategia defensiva."
 teu_konigsberg_dev: "Desarrolla Königsberg"
 teu_konigsberg_dev_desc: "Königsberg (actual Kaliningrado): fundada en 1255 con el apoyo del rey Premysl Otakar II de Bohemia, esta ciudad creció como centro de la colonia prusiana. La universidad fue allí fundada en 1544, más tarde hogar del filósofo Immanuel Kant. Situada en la desembocadura del Pregel, esta ciudad es vital nudo comercial báltico y sirvió de capital de hecho del Estado de la orden. Desarrolla su infraestructura urbana, amplía su catedral y sus mercados y déjala prosperar como punto de transbordo del comercio septentrional y de Europa oriental: fortalecer el corazón de Prusia es fuente de fuerza nacional."
 teu_danzig_port: "Desarrolla el puerto de Gdansk"
 teu_danzig_port_desc: "Gdansk —situada en la desembocadura del Vístula— es la mayor ciudad portuaria del Báltico. En 1308, la Orden Teutónica “tomó” Gdansk de sus aliados polacos y desde entonces permitió que prosperara como nudo del comercio báltico. Pero la Segunda Paz de Toruń, de 1466, entregó la ciudad a Polonia, que la estima como corazón de la “Prusia Real”. Recupera Gdansk, incorpórala a la red comercial hanseática y maximiza los beneficios del comercio báltico de grano: esta ciudad, conocida como “Reina del Báltico”, es arteria financiera de la orden."
 teu_teutonic_law: "El código teutónico"
 teu_teutonic_law_desc: "El derecho de Culm de la década de 1230 (Kulmer Handfeste) fue el primer código jurídico concedido por la Orden Teutónica a sus ciudades coloniales. Con base en él, el sistema jurídico prusiano se desarrolló y se convirtió en la base jurídica de la colonización alemana oriental. El decreto arzobispal de 1489, el código de leyes prusiano de 1529: el desarrollo jurídico es el medio por el que el Estado de la orden se transforma de “conquistador bárbaro” en “portador de la civilización”. Organiza el gobierno, protege los derechos de los campesinos y desarrolla el derecho comercial: establece Prusia como Estado regido por el derecho."
 teu_amber_trade: "Toma el comercio de ámbar"
 teu_amber_trade_desc: "El oro del Báltico: el ámbar. Llamado “oro del Norte” desde la Antigüedad, esta gema solo se encuentra a lo largo de la costa báltica y fue antaño suministrada hasta el mundo mediterráneo. Tras la conquista de Prusia, la Orden Teutónica reivindicó el monopolio del ámbar, castigando a los contrabandistas con la muerte. Este “monopolio del ámbar” es una de las más importantes fuentes de ingresos de la orden. Asume el pleno control de las regiones bálticas productoras de ámbar y domina las rutas comerciales hacia Europa central: pues, además de la espada, la riqueza del ámbar es otra fuente del poder de la orden."
 teu_hanseatic_ties: "Lazos con la Liga Hanseática"
 teu_hanseatic_ties_desc: "La Liga Hanseática —esta unión de ciudades mercantiles alemanas, liderada por Lübeck— domina el comercio del Báltico y del Mar del Norte. Gdansk, Riga, Reval (Tallin): todas estas ciudades son grandes nudos hanseáticos, y sus territorios se cruzan con el dominio de la propia Orden Teutónica. Los mercaderes hanseáticos llevaban grano, madera y ámbar de Prusia a Europa occidental y traían a cambio paño, vino y sal. Construye estrechos lazos con la Liga Hanseática y conviértete en señora eficaz de la red comercial báltica: asegura la prosperidad de la orden tanto por la espada como por el comercio."
 teu_colonize_prussia: "Coloniza Prusia"
 teu_colonize_prussia_desc: "La Ostsiedlung: gran migración histórica de alemanes, que se instalaron al este del Elba del siglo XI al XIV. La Orden Teutónica estaba a la vanguardia de este movimiento, atrayendo campesinos, artesanos y mercaderes alemanes a la conquistada Prusia. A cambio de la desaparición de los pueblos nativos prusianos, esta tierra fue colonizada como “frontera oriental alemana”. Construcción planificada de ciudades, desarrollo agrícola, construcción de caminos: estas son las medidas por las que la “tierra bárbara” es incorporada a la esfera de la civilización europea. Completa la colonización de Prusia y establécela con firmeza como tierra alemana."
 teu_torun_city: "Desarrolla Toruń"
 teu_torun_city_desc: "Toruń —construida a lo largo del Vístula— fue el primer baluarte de la Orden Teutónica, fundada en 1231. Las “Paces de Toruń” de 1454 y 1466 definieron sus relaciones con Polonia: la primera trajo paz, la segunda, la humillante cesión de territorio de la orden. En 1473 nació aquí Copérnico: el astrónomo que propuso la teoría heliocéntrica. Desarrolla Toruń, cuna de la historia de la orden, y reconstrúyela como centro del comercio fluvial del Vístula."
 teu_memel_fortress: "Fortifica Memel"
 teu_memel_fortress_desc: "Memel (Klaipėda) —en la desembocadura del Nemunas, en la frontera lituano-prusiana— esta ciudad-fortaleza fue construida por la Orden Teutónica como línea avanzada de defensa contra Lituania. El Castillo de Memel, fundado en 1252, resistió incontables batallas contra Lituania. Cuando esta fortaleza caiga, las puertas de Prusia se abrirán; al contrario, mantener Memel con firmeza es la clave para detener la invasión lituana. Fortifica esta puerta al Báltico y deja que sirva de nudo interno del comercio de ámbar."
 teu_grand_master: "Hegemonía del Gran Maestre"
 teu_grand_master_desc: "El Gran Maestre (Hochmeister) es el líder supremo de la Orden Teutónica. Como vicario de Cristo, conduce a los caballeros monjes que gobiernan el imperio cruzado, que se extiende del Báltico por toda Europa oriental. Hermann von Salza (1209-1239) estableció las bases políticas de la orden mediante la diplomacia con Federico II, y el gobierno de Winrich von Kniprode (1351-1382) marcó la edad de oro de la orden. Ahora cada enemigo subyugado, y la Cruzada del Norte concluida: la autoridad del Gran Maestre se extiende del Báltico a las tierras de los ortodoxos. Como Gran Maestre, cuyo nombre será grabado en la historia, lleva la voluntad de Dios hasta los confines del Este."
 teu_prussian_king: "Proclamación del Rey de Prusia"
 teu_prussian_king_desc: "El Rey de Prusia: el 18 de enero de 1701, Federico III se coronó en Königsberg como rey Federico I de Prusia. Coronándose en Prusia (antiguas tierras de la Orden Teutónica), que quedaba fuera de la jurisdicción del emperador del Sacro Imperio Romano, encontró un modo astuto de reivindicar el título real sin la aprobación habsburga. “Federico el Grande”, Federico II, tomó Silesia y ganó la Guerra de los Siete Años, elevando Prusia a gran potencia europea. “Prusia: no un país con ejército, sino un ejército con país”: bajo esta filosofía nacional, sienta aquí y ahora las bases de la Alemania moderna."
 teu_events.10.t: "El futuro de la orden: cruzada o secularización"
 teu_events.10.d: "Con Lituania y Polonia subyugadas, la Orden Teutónica se enfrenta ahora a una elección histórica. Continuar bajo la bandera cruzada, atacando a los paganos y ortodoxos del Este, o secularizarse en un ducado moderno y transformarse en el Reino de Prusia."
 teu_events.10.a: "El camino de la cruzada: derrotar a los paganos y ortodoxos del Este y completar la Cruzada del Norte"
 teu_events.10.b: "El camino de la secularización: construir el ducado de Prusia y sentar las bases de la Alemania moderna"
 teu_events.50.t: "Cruzada del Norte concluida"
 teu_events.50.d: "“Esta es la voluntad de Dios”: del Báltico a los distantes confines de la Rus, la cruzada de la Orden Teutónica concluida. La cruz brilla claramente sobre las tierras del norte."
 teu_events.50.a: "¡Viva la cruzada! ¡Hegemonía del Gran Maestre establecida!"
 teu_constantinople_fall: "La caída de Constantinopla"
 teu_constantinople_fall_desc: "Con la Cruzada del Norte ahora concluida, la Orden Teutónica vuelve la mirada hacia el sur. Constantinopla, antaño baluarte oriental de la cristiandad, ha caído desde hace mucho en manos de herejes e infieles. Recupera esta antigua ciudad imperial y alza el estandarte de la verdadera fe sobre el Cuerno de Oro de nuevo. El camino hacia la Tierra Santa de Jerusalén comienza por la liberación de esta ciudad."
 teu_jerusalem_reclaimed: "La recuperación de Jerusalén"
 teu_jerusalem_reclaimed_desc: "Con Constantinopla recuperada, el objetivo final de la cruzada es ahora uno solo: la propia Tierra Santa de Jerusalén. Incontables cruzados lo intentaron, e incontables cruzados cayeron en esta tierra; ahora ha llegado la hora de que la cruz negra de la Orden Teutónica ondee aquí. Ofrece oraciones junto a la Basílica del Santo Sepulcro y realiza el antiguo sueño del mundo cristiano."
 teu_events.55.t: "Constantinopla, por fin nuestra"
 teu_events.55.d: "Habiendo concluido la Cruzada del Norte, la Orden Teutónica ha vuelto su lanza hacia el sur. Constantinopla, antaño símbolo de la gloria bizantina, se había convertido en poco más que ruinas, pisoteadas por herejes e infieles. Pero los ejércitos de la orden liberaron la ciudad y alzaron de nuevo la cruz sobre Santa Sofía. El próximo objetivo es claro: recuperar la Tierra Santa de Jerusalén."
 teu_events.55.a: "El camino a Tierra Santa abierto: ¡adelante, rumbo a Jerusalén!"
 teu_events.56.t: "Jerusalén, liberada"
 teu_events.56.d: "El sueño que los cruzados persiguieron durante siglos, y la esperanza que se hizo añicos una y otra vez: la recuperación de la Tierra Santa de Jerusalén por fin realizada. Mientras el estandarte de la Orden Teutónica ondea sobre la Basílica del Santo Sepulcro, todo el mundo cristiano se regocija con esta victoria. El nombre del Gran Maestre será pronunciado para siempre junto a los nombres de los grandes líderes cruzados del pasado. Por este sagrado triunfo, la bravura y la gloria del gobernante se han hecho inmortales."
 teu_events.56.a: "¡Dios con nosotros! ¡Tierra Santa liberada!"
 teu_events.60.t: "Confederación de la Alemania del Norte proclamada"
 teu_events.60.d: "De Prusia a Pomerania y a Brandeburgo: toda la Alemania del Norte unida bajo el estandarte prusiano. El amanecer del Estado alemán moderno."
 teu_events.60.a: "¡Viva Prusia! ¡Viva la Confederación de la Alemania del Norte!"
 teu_events.99.t: "El objetivo final de la orden"
 teu_events.99.d: "La misión de la Orden Teutónica cumplida: su nombre grabado en la historia con el gran imperio que gobernó el Báltico."
 teu_events.99.a: "¡Viva la Orden Teutónica!"
 STATIC_MODIFIER_NAME_teu_amber_mod: "Monopolio del comercio de ámbar"
 STATIC_MODIFIER_DESC_teu_amber_mod: "El oro del Báltico, el ámbar: su comercio monopolizado llena el tesoro de la Orden Teutónica."
 STATIC_MODIFIER_NAME_teu_christian_mod: "Cristianización de Prusia"
 STATIC_MODIFIER_DESC_teu_christian_mod: "La fe católica ha echado raíces por toda Prusia, estableciendo la autoridad religiosa."
 STATIC_MODIFIER_NAME_teu_colonize_mod: "Colonización de Prusia"
 STATIC_MODIFIER_DESC_teu_colonize_mod: "Colonos, que llegan en carretas desde más allá del Elba, erigen nuevas aldeas en la tierra salvaje prusiana."
 STATIC_MODIFIER_NAME_teu_danzig_mod: "Prosperidad del puerto de Gdansk"
 STATIC_MODIFIER_DESC_teu_danzig_mod: "La “Reina del Báltico”, Gdansk, desarrollada como nudo del comercio marítimo de la orden."
 STATIC_MODIFIER_NAME_teu_duchy_mod: "Establecimiento del Ducado de Prusia"
 STATIC_MODIFIER_DESC_teu_duchy_mod: "El ducado secularizado de Prusia organizado como Estado administrativo moderno."
 STATIC_MODIFIER_NAME_teu_east_crusade_mod: "Cruzada hacia el Este"
 STATIC_MODIFIER_DESC_teu_east_crusade_mod: "En cada expedición a tierras paganas, los hermanos caballeros cosen la cruz negra en sus mantos blancos y renuevan los votos de la guerra santa."
 STATIC_MODIFIER_NAME_teu_hanseatic_mod: "Lazos con la Liga Hanseática"
 STATIC_MODIFIER_DESC_teu_hanseatic_mod: "Cocas hanseáticas echan anclas sin cesar en los puertos de Gdansk y Toruń, en busca de ámbar y grano."
 STATIC_MODIFIER_NAME_teu_hre_mod: "Ascenso dentro del Sacro Imperio"
 STATIC_MODIFIER_DESC_teu_hre_mod: "Prusia se ha alzado como potencia central dentro del Sacro Imperio Romano."
 STATIC_MODIFIER_NAME_teu_konigsberg_mod: "Prosperidad de Königsberg"
 STATIC_MODIFIER_DESC_teu_konigsberg_mod: "Königsberg, corazón de Prusia, prospera como ciudad de comercio y saber."
 STATIC_MODIFIER_NAME_teu_law_mod: "El código teutónico"
 STATIC_MODIFIER_DESC_teu_law_mod: "El código de la orden, construido sobre el derecho de Culm, ha ganado fama de juzgar ciudad y campo con la misma medida."
 STATIC_MODIFIER_NAME_teu_legacy_mod: "El legado de la Orden Teutónica"
 STATIC_MODIFIER_DESC_teu_legacy_mod: "Los retratos de los Grandes Maestres en el gran salón de Malbork llevan la tradición de la orden a todos los rincones de su territorio recuperado."
 STATIC_MODIFIER_NAME_teu_lithuania_mod: "Subyugación de Lituania"
 STATIC_MODIFIER_DESC_teu_lithuania_mod: "La línea de fortalezas, erigida en los bosques de Samogitia, se alza como barrera contra los ejércitos del Gran Duque de Lituania."
 STATIC_MODIFIER_NAME_teu_livonia_mod: "Dominio de Livonia"
 STATIC_MODIFIER_DESC_teu_livonia_mod: "La alianza con la Orden Livona ha asegurado el control de la costa este del Báltico."
 STATIC_MODIFIER_NAME_teu_malbork_mod: "Fortificación de Malbork"
 STATIC_MODIFIER_DESC_teu_malbork_mod: "Malbork fortificada en un baluarte inexpugnable, piedra angular de la defensa de la orden."
 STATIC_MODIFIER_NAME_teu_memel_mod: "Fortificación de Memel"
 STATIC_MODIFIER_DESC_teu_memel_mod: "Memel desarrollada como ciudad portuaria fortificada, que asegura la frontera contra Lituania."
 STATIC_MODIFIER_NAME_teu_orthodox_march_mod: "Marcha sobre la ortodoxia"
 STATIC_MODIFIER_DESC_teu_orthodox_march_mod: "Tras muchas guerras contra príncipes ortodoxos, los soldados de la orden conocen bien los caminos de la guerra de frontera en el este."
 STATIC_MODIFIER_NAME_teu_poland_mod: "Subyugación de Polonia"
 STATIC_MODIFIER_DESC_teu_poland_mod: "El orgullo perdido en la derrota de Grunwald, por fin recuperado por la victoria de la venganza."
 STATIC_MODIFIER_NAME_teu_pomerania_mod: "Control de Pomerania"
 STATIC_MODIFIER_DESC_teu_pomerania_mod: "Con los puertos de Pomerania en mano, ninguna ciudad de la costa báltica puede dejar de rendir respeto al estandarte de la orden."
 STATIC_MODIFIER_NAME_teu_protestant_mod: "La Reforma protestante"
 STATIC_MODIFIER_DESC_teu_protestant_mod: "En Prusia, que aceptó la enseñanza de Lutero, eruditos se reúnen de lejos y de cerca en los colegios de Königsberg."
 STATIC_MODIFIER_NAME_teu_prussia_mod: "Subyugación completa de Prusia"
 STATIC_MODIFIER_DESC_teu_prussia_mod: "La subyugación completa de Prusia ha extirpado las semillas de la rebelión."
 STATIC_MODIFIER_NAME_teu_prussian_kingdom_mod: "El Reino de Prusia"
 STATIC_MODIFIER_DESC_teu_prussian_kingdom_mod: "El moderno Reino de Prusia establecido como señor de la Alemania del Norte."
 STATIC_MODIFIER_NAME_teu_constantinople_reclaimed_mod: "Recuperación de Constantinopla"
 STATIC_MODIFIER_DESC_teu_constantinople_reclaimed_mod: "La cruz erguida de nuevo sobre la gran iglesia de Constantinopla, y su luz alcanza todo el Oriente."
 STATIC_MODIFIER_NAME_teu_jerusalem_ruler_mod: "Libertador de Jerusalén"
 STATIC_MODIFIER_DESC_teu_jerusalem_ruler_mod: "El Gran Maestre que se arrodilló junto al Santo Sepulcro es venerado por el pueblo como santo viviente, y su nombre se ha convertido en estandarte que guía ejércitos."
 STATIC_MODIFIER_NAME_teu_riga_mod: "Riga, baluarte de la cruzada"
 STATIC_MODIFIER_DESC_teu_riga_mod: "Riga desarrollada como centro comercial, militar y cruzado de la costa oriental del Báltico."
 STATIC_MODIFIER_NAME_teu_secular_start_mod: "Primer paso de la secularización"
 STATIC_MODIFIER_DESC_teu_secular_start_mod: "Desde el día en que el Gran Maestre asumió la corona ducal, el nuevo espíritu del Estado moderno se ha agitado en las asambleas de Prusia."
 STATIC_MODIFIER_NAME_teu_torun_mod: "Prosperidad de Toruń"
 STATIC_MODIFIER_DESC_teu_torun_mod: "Toruń, patria de Copérnico, prospera como centro del comercio fluvial del Vístula."
 teu_mazovia_subjugation: "Subyugación de Mazovia"
 teu_mazovia_subjugation_desc: "Mazovia —corazón polaco, que se extiende a lo largo del Vístula medio—. Esta tierra, donde más tarde será construida Varsovia, es la puerta de Polonia al este y principal ruta de invasión de Prusia. El Ducado de Mazovia fue gobernado por una rama más joven de la dinastía polaca Piasta, hasta ser absorbido por el Reino de Polonia en 1526 con la extinción de su línea gobernante. El control de esta tierra elimina la amenaza del sur y asegura Prusia. Haz de la rica tierra agrícola de la cuenca del Vístula el granero de la Orden Teutónica."
 teu_narva_fortress: "La fortaleza de Narva"
 teu_narva_fortress_desc: "Narva: esta ciudad-fortaleza junto al río Narva, en la costa norte de Estonia, marca la frontera estratégica entre Livonia y Rusia. Al otro lado del río se alza la fortaleza rusa de Ivangorod: verdadero punto de choque de civilizaciones. Vendida a la Orden Teutónica por Dinamarca junto con la punta norte de Estonia en 1346, Narva sirve de base avanzada para la cruzada oriental. En 1558, está destinada a una breve caída ante las fuerzas de Iván el Terrible, pero cambia este destino aquí y ahora. Fortifica Narva en un baluarte inexpugnable y mantén la presión sobre la Rusia ortodoxa."
 teu_berlin_dev: "Desarrollo de Berlín"
 teu_berlin_dev_desc: "Berlín: esta pequeña ciudad en la confluencia de los ríos Spree y Havel fue fundada en el siglo XIII como ciudades gemelas (Berlín y Cölln) por el margrave de Brandeburgo. Por ahora es solo la pequeña sede de los electores Hohenzollern de Brandeburgo, pero, una vez que Prusia se una a Brandeburgo, este lugar está destinado a convertirse en capital imperial. Con la unión personal de Brandeburgo-Prusia de 1618 y la fundación del Reino de Prusia en 1701, Berlín se convirtió en el corazón de la Alemania del Norte. Asienta esta base ahora: el desarrollo de Berlín generará una ciudad que simboliza la unificación de la Alemania del Norte."
 teu_junker_system: "Establece el sistema de los junkers"
 teu_junker_system_desc: "Junker: en alemán, “joven señor”; este término se refiere a la nobleza terrateniente militarizada de Prusia. Poseyendo vastos latifundios (Gutsherrschaft) al este del Elba, los junkers usaban trabajo servil para producir grano para exportación a Europa occidental por el Báltico. Pero su verdadero papel era militar: los junkers ocupaban la mayoría de los puestos de oficial del ejército prusiano, formando el propio núcleo de “Prusia como Estado militar”. Federico Guillermo I (el “Rey Sargento”) enviaba compulsivamente a los junkers a las academias militares, institucionalizando su deber militar. Establece ahora el sistema de los junkers y sienta la base de la “cultura militar prusiana”, que perdurará por generaciones."
 teu_silesia_claim: "Domina Silesia"
 teu_silesia_claim_desc: "Silesia —que se extiende a lo largo del alto Óder, esta región posee potencial para convertirse en la mayor zona industrial de Europa central, rica en carbón, mineral de hierro y zinc—. Antaño parte de las posesiones polacas de los Piastas, pasó al Reino de Bohemia después de 1335 y se convirtió en parte de Austria por la herencia de Bohemia por los Habsburgo en 1526. Pero en 1740, Federico el Grande lanzó una invasión relámpago de Silesia al inicio de la Guerra de Sucesión Austríaca, tomando esta rica tierra “por la fuerza”. Toma ahora Silesia para Prusia: su poderío industrial se convertirá en la base económica del imperio prusiano."
 teu_cathedral_network: "La red de catedrales"
 teu_cathedral_network_desc: "Red de catedrales por toda Prusia: la Orden Teutónica siempre construyó iglesias en tierra conquistada. La Catedral de Königsberg, la capilla del castillo de Malbork, la iglesia de San Juan en Toruń: todas fueron instrumentos para implantar la fe católica en suelo pagano. Organizar el sistema parroquial, establecer obispados, construir monasterios: estas son las medidas institucionales por las que las “tierras bárbaras” son incorporadas a la civilización cristiana. La catedral es a la vez acto de servicio a Dios y símbolo del gobierno colonial. Establece la red de catedrales por toda Prusia y refuerza la autoridad religiosa y la legitimidad del gobierno de la Orden Teutónica."
 teu_elbing_dev: "Desarrolla Elbing"
 teu_elbing_dev_desc: "Elbing (Elbląg): fundada en 1237 en el extremo oriental del delta del Vístula, esta ciudad es uno de los más importantes puertos de Prusia, junto con Gdansk, e importante miembro de la Liga Hanseática. Ligada a Königsberg por vías fluviales interiores, prosperó como puerto de exportación de grano, madera y ámbar. Como Gdansk, cayó bajo control polaco después de la Segunda Paz de Toruń (1466), pero, para Prusia, el pleno control del delta del Vístula es una salida al mar indispensable. Desarrolla Elbing y establece un sistema par de grandes puertos bálticos junto a Gdansk."
 STATIC_MODIFIER_NAME_teu_mazovia_mod: "Mazovia subyugada"
 STATIC_MODIFIER_DESC_teu_mazovia_mod: "Mazovia subyugada, asegurando la frontera meridional."
 STATIC_MODIFIER_NAME_teu_narva_mod: "La fortaleza de Narva"
 STATIC_MODIFIER_DESC_teu_narva_mod: "Narva fortificada en un baluarte inexpugnable en el este."
 STATIC_MODIFIER_NAME_teu_berlin_mod: "Desarrollo de Berlín"
 STATIC_MODIFIER_DESC_teu_berlin_mod: "Berlín desarrollada como capital de Prusia."
 STATIC_MODIFIER_NAME_teu_junker_mod: "El sistema de los junkers"
 STATIC_MODIFIER_DESC_teu_junker_mod: "Los junkers, arraigados en sus propiedades al este del Elba, sustentan el reino tanto como oficiales como funcionarios."
 STATIC_MODIFIER_NAME_teu_silesia_mod: "Silesia conquistada"
 STATIC_MODIFIER_DESC_teu_silesia_mod: "Los telares y las minas de Silesia dan nuevo pulso a las finanzas de Prusia."
 STATIC_MODIFIER_NAME_teu_cathedral_mod: "La red de catedrales"
 STATIC_MODIFIER_DESC_teu_cathedral_mod: "Catedrales construidas por toda Prusia, y la fe católica ha echado raíces."
 STATIC_MODIFIER_NAME_teu_elbing_mod: "Prosperidad del puerto de Elbing"
 STATIC_MODIFIER_DESC_teu_elbing_mod: "Elbing desarrollada como gran ciudad portuaria báltica."
 teu_mongol_empire: "Baluarte mongol caído"
 teu_mongol_empire_desc: "Sarai, Kazán, Samarcanda, Caffa, Dadu, Karakórum: una tras otra, las grandes capitales del Imperio mongol, que antaño sacudió el mundo, han caído bajo el estandarte negro y cruzado. La “gran nación mongola”, fundada por Gengis Kan en 1206, se desintegró a finales del siglo XIII, y su antigua gloria hace mucho que pasó. En lo que queda de sus posesiones, los ejércitos de hierro de la Orden Teutónica marchan tanto desde el este como desde el oeste, subyugando a los gobernantes de la estepa. Del Pacífico, al este, al Báltico, al oeste: toda la herencia mongola tomada por el imperio de la cruz."
 teu_sacred_nomads: "Trono del Gran Kan usurpado"
 teu_sacred_nomads_desc: "Con todo el Imperio mongol subyugado, el Gran Maestre reivindica ahora el título que los pueblos de la estepa más temen —“kan”— como trofeo de guerra. No es fusión ni coexistencia; es simplemente el conquistador sentándose en el trono del derrotado. La caballería pesada, que lleva la cruz, se ha convertido en señora de lo que antaño fue la horda más temida de la tierra. Une los imperios de Oriente y Occidente por la voluntad de Dios: esta es la victoria final de la Orden Teutónica."
 teu_events.70.t: "Capitales mongolas, nuestras"
 teu_events.70.d: "Sarai, Kazán, Samarcanda, Caffa, Dadu, Karakórum: todas las capitales del Imperio mongol han caído. A partir de este día, el Gran Maestre se titula “Gran Kan alemán”, pero no como heredero de la sangre o de la cultura mongola. No es nada más que un conquistador, asumiendo el título del derrotado como señal de su propio poder. Pax Deus —la paz de Dios— sustituye ahora a lo que antaño fue el gobierno de la estepa."
 teu_events.70.a: "¡Las posesiones mongolas por fin nuestras!"
 teu_events.80.t: "La Cruz de Hierro gobierna el mundo"
 teu_events.80.d: "Como acto final de la conquista del Imperio mongol, la Orden Teutónica ha traído por completo tanto el imperio oriental como el occidental a su propio gobierno. Los pueblos de la estepa se rinden, y un nuevo orden se impone bajo el poder de la cruz. No es fusión, sino pura conclusión de la conquista: la orden permanece orden y se ha convertido en señora del mayor imperio de la tierra."
 teu_events.80.a: "¡Por voluntad de Dios, el mundo es nuestro!"
 STATIC_MODIFIER_NAME_teu_mongol_empire_mod: "Subyugación de los mongoles"
 STATIC_MODIFIER_DESC_teu_mongol_empire_mod: "La máquina de guerra del Imperio mongol capturada: los jinetes de la estepa sirven ahora bajo mando cruzado."
 STATIC_MODIFIER_NAME_teu_sacred_nomads_mod: "El trono del Gran Kan"
 STATIC_MODIFIER_DESC_teu_sacred_nomads_mod: "Gobernando como señor de lo que antaño fue un imperio mundial: los mongoles plenamente subyugados a la Orden Teutónica."
 teu_great_khan_name: "Gran Kanato alemán"
 teu_events.11.t: "El voto de la Cruzada del Norte"
 teu_events.11.d: "La puerta al Este abierta: con Lituania y Polonia subyugadas, ha llegado la hora de que la Orden Teutónica tome una decisión histórica. Cada caballero jura ante la autoridad del Gran Maestre: “Por voluntad de Dios destruiremos a los paganos y ortodoxos del Este y completaremos la Cruzada del Norte”. Este voto se convierte en el principio gobernante del Estado de la Orden Teutónica, y cuanto mayor es su legitimidad, mayor es su disciplina y orden."
 teu_events.11.a: "Juramos: ¡por voluntad de Dios, completar la Cruzada del Norte!"
 teu_steppe_crusade: "La Cruzada de la estepa"
 teu_steppe_crusade_desc: "La estepa póntica: antaño corazón del Imperio mongol, ilimitado pasto, gobernado por los tártaros. Ahora, con la caballería pesada de la Orden Teutónica, fundida con la caballería ligera al estilo mongol, conquista esta estepa y establece la supremacía sobre toda Europa oriental. Quien gobierna la estepa gobierna Europa oriental: prueba esta verdad con la fuerza de la Orden Teutónica."
 STATIC_MODIFIER_NAME_teu_steppe_crusade_mod: "La Cruzada de la estepa"
 STATIC_MODIFIER_DESC_teu_steppe_crusade_mod: "Los hermanos caballeros montados, que cabalgan por los vientos de la estepa, han hecho suyos hasta los caminos de guerra de los nómadas."
 STATIC_MODIFIER_NAME_teu_crusade_loot_mod: "Saqueo cruzado"
 STATIC_MODIFIER_DESC_teu_crusade_loot_mod: "El saqueo de la cruzada ha agotado la tierra: los campos yacen en barbecho, las aldeas están vacías, y el pueblo aguarda tiempos mejores."
