l_spanish:
 sic_restoration_mission_pack: "El Camino del Reino de Sicilia"
 sic_restoration_mission_pack_DESCRIPTION:0 "Separado de Nápoles por la revuelta de 1282, el Reino de Sicilia está listo para reunir la fuerza de la isla en el corazón del Mediterráneo y volver a inscribir su nombre en la historia. ¿Cruzarás el estrecho para volver a ser uno con Nápoles, o harás de la propia isla una tierra de oro? La elección es tuya, majestad."
 sic_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Completa las misiones como Reino de Sicilia, trabajando por la reconstitución de las Dos Sicilias o por la edad de oro de la isla de Sicilia."
 sic_restoration_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para seguir el camino del Reino de Sicilia."
 sic_restoration_mission_pack_BUTTON_DETAILS:0 "Conquista Nápoles al otro lado del estrecho y forja el Reino de las Dos Sicilias, o pule la propia isla de Sicilia hasta hacer de ella la joya del Mediterráneo. ¡En ambos caminos te aguarda la prosperidad del nuevo reino!"
 sic_divided_kingdom: "Al otro lado del estrecho"
 sic_divided_kingdom_desc: "En 1282, en la revuelta conocida como las Vísperas Sicilianas, derrocamos el dominio de la casa de Anjou. Incapaz de soportar por más tiempo la tiranía de los funcionarios franceses, el pueblo de la isla se alzó como un solo hombre al son de las campanas del atardecer y expulsó a los franceses de nuestras costas. Saludamos a Pedro III de Aragón como nuevo rey, y el Reino de Sicilia quedó así dividido en dos. Más allá del estrecho, en el continente con capital en Nápoles, el rey de la casa de Anjou aún se titula “rey de Sicilia”. Solo nosotros somos los legítimos reyes de esta isla. La rivalidad entre nuestros dos reinos continúa hasta hoy."
 sic_ambitions_on_naples: "Ambiciones sobre Nápoles"
 sic_ambitions_on_naples_desc: "El rey angevino al otro lado del estrecho disputa, con razón, el propio título de rey de Sicilia. Ha llegado el momento de formar nuestro ejército permanente y alzar la causa justa: algún día, reclamar para nosotros la corona de Nápoles."
 sic_army_of_the_island: "La flota de la isla"
 sic_army_of_the_island_desc: "La isla de Sicilia es una fortaleza, rodeada de mar por todas partes. Para enviar nuestras tropas por encima del estrecho hasta Nápoles, primero debemos construir una poderosa flota que garantice tanto la defensa de la isla como la travesía segura de nuestros soldados."
 sic_conquest_of_naples: "La conquista de Nápoles"
 sic_conquest_of_naples_desc: "Nuestras fuerzas han cruzado por fin el estrecho y han desembarcado en las playas de Nápoles. Si conseguimos quebrar el ejército angevino y tomar la corona de Nápoles, el reino dividido en 1282 volverá a ser uno, bajo nuestro gobierno."
 sic_two_sicilies: "Las Dos Sicilias"
 sic_two_sicilies_desc: "Nápoles y Palermo, las dos coronas, reposan ahora en nuestras manos. Ha llegado el momento de proclamar la fundación de un nuevo reino que abarque ambas orillas del estrecho: el Reino de las Dos Sicilias. Esta hazaña histórica pone fin a la división de 1282."
 sic_golden_wheat_fields: "Campos de trigo dorado"
 sic_golden_wheat_fields_desc: "Desde la Antigüedad, la isla de Sicilia ha sido llamada el granero del Mediterráneo. Desarrollando las llanuras fértiles en torno a Palermo, las ricas cosechas alimentarán a todo el reino, y el excedente de grano se exportará como valiosa mercancía."
 sic_palermo_resurgent: "Palermo resurgente"
 sic_palermo_resurgent_desc: "En tiempos del reino normando, Palermo era una ciudad de un esplendor inigualable en el Mediterráneo. Erigir aquí nuevas construcciones y recuperar al menos una parte de aquel antiguo fasto será el primer paso para el desarrollo de toda la isla."
 sic_mediterranean_crossroads: "Encrucijada del comercio mediterráneo"
 sic_mediterranean_crossroads_desc: "La isla de Sicilia se encuentra justo en el corazón de la encrucijada del Mediterráneo, donde se cruzan las rutas comerciales de Oriente y Occidente. Estableciendo mercados en los puertos de la isla, reuniremos aquí a mercaderes de todas las tierras, elevando enormemente los ingresos comerciales del reino."
 sic_sicilian_renaissance: "El Renacimiento siciliano"
 sic_sicilian_renaissance_desc: "La corte siciliana, donde se encuentran las culturas normanda, árabe, bizantina y latina, es desde hace mucho un centro de arte y saber. Las numerosas obras de arte reunidas en Palermo anuncian el amanecer de un nuevo florecimiento cultural."
 sic_kingdom_resurgent: "El reino resurgente"
 sic_kingdom_resurgent_desc: "Ya sea como reino que abarca ambas orillas del estrecho, ya sea como isla que brilla en cultura y comercio en el corazón del Mediterráneo, Sicilia ha vuelto a inscribir su nombre en la historia. De aquí en adelante, el camino de este reino marcará el amanecer de una nueva era."
 STATIC_MODIFIER_NAME_sic_army_of_the_island_mod: "La flota de la isla"
 STATIC_MODIFIER_DESC_sic_army_of_the_island_mod: "La flota reorganizada de la isla ostenta una moral elevada y abundantes reservas de efectivos."
 STATIC_MODIFIER_NAME_sic_conquest_of_naples_mod: "La conquista de Nápoles"
 STATIC_MODIFIER_DESC_sic_conquest_of_naples_mod: "Tras la campaña de Nápoles, la disciplina del ejército real ha aumentado y nuestra posición en las negociaciones de guerra es más fuerte."
 STATIC_MODIFIER_NAME_sic_two_sicilies_mod: "Las Dos Sicilias"
 STATIC_MODIFIER_DESC_sic_two_sicilies_mod: "El prestigio y la legitimidad del nuevo reino, que abarca ambas orillas del estrecho, jamás habían sido tan altos."
 STATIC_MODIFIER_NAME_sic_golden_wheat_fields_mod: "Campos de trigo dorado"
 STATIC_MODIFIER_DESC_sic_golden_wheat_fields_mod: "La Roma antigua llamaba a Sicilia el “granero del Imperio” (Granarium Imperii). Los vastos campos de trigo del interior de la isla alimentaron sin cesar al mundo mediterráneo. El papel agrícola de Sicilia como “isla del trigo” permaneció inalterado desde la Antigüedad hasta el siglo XIX y fue un pilar de la seguridad alimentaria del Mediterráneo."
 STATIC_MODIFIER_NAME_sic_palermo_resurgent_mod: "Palermo resurgente"
 STATIC_MODIFIER_DESC_sic_palermo_resurgent_mod: "Palermo (en fenicio Panormos, “todos los puertos”) es la mayor ciudad de Sicilia, donde se mezclaron las culturas normanda, árabe y bizantina. La corte de Roger II era conocida como una de las más refinadas de Europa y un centro multicultural donde se usaban a la par el árabe, el griego y el latín."
 STATIC_MODIFIER_NAME_sic_mediterranean_crossroads_mod: "Encrucijada del comercio mediterráneo"
 STATIC_MODIFIER_DESC_sic_mediterranean_crossroads_mod: "Sicilia se halla casi en el centro del Mediterráneo y es un enclave del comercio Oriente-Occidente desde que los antiguos fenicios fundaron Cartago. Siracusa, patria del filósofo griego Arquímedes, y Palermo, impregnada de cultura árabe: esta isla es la verdadera personificación de la civilización mediterránea."
 STATIC_MODIFIER_NAME_sic_sicilian_renaissance_mod: "El Renacimiento siciliano"
 STATIC_MODIFIER_DESC_sic_sicilian_renaissance_mod: "La cultura que floreció en Palermo ha elevado la habilidad de los nuevos artistas que ingresan al servicio del reino."
 STATIC_MODIFIER_NAME_sic_kingdom_resurgent_mod: "El reino resurgente"
 STATIC_MODIFIER_DESC_sic_kingdom_resurgent_mod: "El brillo del reino resurgente ha elevado su prestigio y su legitimidad y ha fortalecido su mano en las negociaciones de guerra como nunca antes."
 sic_events.1.t: "Un reino dividido en dos"
 sic_events.1.d: "En 1282 nos alzamos contra el dominio de la casa de Anjou. Incapaz de soportar por más tiempo la tiranía de los funcionarios enviados desde Francia, el pueblo de la isla se alzó como un solo hombre al son de las campanas del atardecer y expulsó a los franceses de nuestras costas. Saludamos a Pedro III de Aragón como nuevo rey, y el Reino de Sicilia quedó así dividido en dos. Más allá del estrecho, en el continente con capital en Nápoles, el rey de la casa de Anjou aún se titula “rey de Sicilia”. Solo nosotros somos los verdaderos reyes de esta isla. La rivalidad entre nuestros dos reinos continúa hasta hoy."
 sic_events.1.a: "Entendido"
