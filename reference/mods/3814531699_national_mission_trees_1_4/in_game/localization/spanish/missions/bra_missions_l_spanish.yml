l_spanish:
 bra_brandenburg_mission_pack: "Sangre y hierro: de Brandeburgo al Imperio alemán"
 bra_brandenburg_mission_pack_DESCRIPTION:0 "De pequeña marca de la casa de Ascania, construye el Reino de Prusia bajo los Hohenzollern y alcanza la unificación de Alemania por sangre y hierro."
 bra_brandenburg_mission_pack_CRITERIA_DESCRIPTION:0 "Establece la marca, forma el Reino de Prusia y completa el Imperio alemán."
 bra_brandenburg_mission_pack_BUTTON_TOOLTIP:0 "Del arenal del Sacro Imperio Romano a la hegemonía de Europa."
 bra_brandenburg_mission_pack_BUTTON_DETAILS:0 "Las grandes cuestiones del día no se deciden con discursos ni con votos de mayoría, sino con sangre y hierro: ¡une Alemania!"
 bra_ascanian_legacy: "El legado de los ascanios"
 bra_ascanian_legacy_desc: "Hereda la marca de Brandeburgo construida por la casa de Ascania e inicia una nueva era de gobierno."
 bra_march_authority: "Establece la autoridad del margrave"
 bra_march_authority_desc: "Somete las tierras fragmentadas de la nobleza y haz que la autoridad del margrave alcance todo el país."
 bra_turmoil_ended_tt: "El desastre «Agitación en Brandeburgo» ha terminado"
 bra_altmark_secure: "Asegura la Altmark"
 bra_altmark_secure_desc: "La Altmark, patria de la marca: haz inquebrantable su gobierno."
 bra_neumark_colonization: "Coloniza la Neumark"
 bra_neumark_colonization_desc: "Avanza la colonización hacia el este, hasta la Neumark, más allá del Óder, y construye nuevos poblados."
 bra_uckermark_integration: "Integra la Uckermark"
 bra_uckermark_integration_desc: "Integra por completo la Uckermark a la marca."
 bra_pomeranian_rivalry: "Rivalidad con Pomerania"
 bra_pomeranian_rivalry_desc: "Resuelve la rivalidad con el ducado de Pomerania por el acceso al Báltico."
 bra_wendish_lands: "Las tierras vendas"
 bra_wendish_lands_desc: "Esta tierra es la patria de los casubios, descendientes de los vendos eslavos: acoge su cultura con tolerancia y profundiza tu comprensión de las costumbres alemanas, mostrando que los dos pueblos pueden coexistir."
 bra_berlin_dev: "Desarrolla Berlín"
 bra_berlin_dev_desc: "Berlín, ciudad a orillas del Spree que creció hasta el corazón de la marca tras la unión con Cölln: desarróllala más."
 bra_electoral_dignity: "Dignidad electoral"
 bra_electoral_dignity_desc: "Establece tu estatus de elector del Sacro Imperio Romano y eleva tu prestigio en él."
 bra_hohenzollern_investiture: "Investidura de los Hohenzollern"
 bra_hohenzollern_investiture_desc: "En 1417, el emperador Segismundo concedió el título electoral a la casa de Hohenzollern: establece el gobierno de esta nueva dinastía."
 bra_hohenzollern_dynasty: "Dinastía Hohenzollern asegurada"
 bra_hohenzollern_dynasty_desc: "Haz de la sangre de los Hohenzollern el pilar del Estado y asienta la base de un gobierno duradero."
 bra_imperial_diet: "Voz en la Dieta Imperial"
 bra_imperial_diet_desc: "Refuerza tu voz en la Dieta Imperial y asume un papel en la política imperial."
 bra_reformation_choice: "La elección de la Reforma"
 bra_reformation_choice_desc: "La enseñanza de Lutero sacude toda Alemania: Brandeburgo también debe elegir su fe."
 bra_secularize_prussia: "Seculariza Prusia"
 bra_secularize_prussia_desc: "Fomenta la secularización del Estado de la Orden Teutónica y trae Prusia a la influencia de Brandeburgo."
 bra_cleves_inheritance: "La herencia de Cléveris"
 bra_cleves_inheritance_desc: "Gana la guerra de sucesión de Jülich, en el Rin, y asegura el exclave occidental."
 bra_thirty_years_war: "Sobrevive a la Guerra de los Treinta Años"
 bra_thirty_years_war_desc: "La Guerra de los Treinta Años devasta Alemania: sobrevive a esta calamidad y preserva la marca."
 bra_great_elector: "El gobierno del Gran Elector"
 bra_great_elector_desc: "Bajo Federico Guillermo, más tarde llamado “Gran Elector”, reconstruye la fuerza del Estado."
 bra_standing_army: "Establece un ejército permanente"
 bra_standing_army_desc: "Crea un ejército permanente, subordinado directamente al elector, independiente de las milicias de la nobleza."
 bra_absolutism: "Establece el absolutismo"
 bra_absolutism_desc: "Somete el poder de los estamentos y construye un Estado en el que la voluntad del elector alcanza todos los rincones."
 bra_sovereign_prussia: "Soberanía sobre Prusia"
 bra_sovereign_prussia_desc: "Por el Tratado de Oliva, libérate de la suzeranía polaca sobre el ducado de Prusia."
 bra_king_in_prussia: "Coronado Rey en Prusia"
 bra_king_in_prussia_desc: "En 1701, en Königsberg, Federico I se coronó “Rey en Prusia”."
 bra_prussian_administration: "La administración prusiana"
 bra_prussian_administration_desc: "Establece una burocracia eficiente y disciplinada y sigue el camino del Estado moderno."
 bra_junker_integration: "Integra a los junkers"
 bra_junker_integration_desc: "Haz de la nobleza terrateniente al este del Elba, los junkers, el núcleo del ejército y de la administración."
 bra_potsdam_dev: "Desarrolla Potsdam"
 bra_potsdam_dev_desc: "Desarrolla Potsdam, sede de la residencia real, como centro de la cultura de corte."
 bra_soldier_king: "El legado del Rey Sargento"
 bra_soldier_king_desc: "Hereda el legado frugal y militarizado de Federico Guillermo I, el “Rey Sargento”."
 bra_royal_treasury: "El tesoro real lleno"
 bra_royal_treasury_desc: "Con una gestión financiera frugal, construye uno de los tesoros más llenos de Europa."
 bra_silesian_ambition: "Ambiciones sobre Silesia"
 bra_silesian_ambition_desc: "Reivindica con legitimidad la rica Silesia, gobernada por la casa de Habsburgo."
 bra_first_silesian_war: "La Primera Guerra de Silesia"
 bra_first_silesian_war_desc: "El joven Federico II marcha sobre Silesia en una invasión relámpago."
 bra_silesia_annexed: "Silesia anexionada"
 bra_silesia_annexed_desc: "Anexiona por completo la rica región minera e industrial de Silesia como base económica de Prusia."
 bra_prussian_enlightenment: "La Ilustración prusiana"
 bra_prussian_enlightenment_desc: "El pensamiento ilustrado florece bajo Federico el Grande: realiza el ideal de que “el rey es el primer servidor del Estado”."
 bra_seven_years_war: "Sobrevive a la Guerra de los Siete Años"
 bra_seven_years_war_desc: "La Guerra de los Siete Años pone a toda Europa contra ti: sobrevive a esta prueba y defiende tu estatus de gran potencia."
 bra_frederick_the_great: "El legado de Federico el Grande"
 bra_frederick_the_great_desc: "Lleva el legado del gran rey, recordado como “Federico el Grande”, a la era siguiente."
 bra_partitions_of_poland: "Participa en las particiones de Polonia"
 bra_invasion_of_poland: "Invasión de Polonia"
 bra_invasion_of_poland_desc: "Lleva nuestras fuerzas a la Gran Polonia y arranca territorio a este vecino debilitado."
 bra_partitions_of_poland_desc: "Únete a la partición de la decadente Mancomunidad Polaco-Lituana y toma Prusia Occidental."
 bra_prussian_academy: "La Academia de Ciencias prusiana"
 bra_prussian_academy_desc: "Cultiva la Academia de Ciencias de Berlín y conviértete en centro de ciencia y erudición."
 bra_prussian_army_reform: "Reforma del ejército prusiano"
 bra_prussian_army_reform_desc: "Calidad o cantidad: define el carácter del ejército prusiano y arraiga una doctrina militar singular en el Estado."
 bra_napoleonic_crisis: "La crisis napoleónica"
 bra_napoleonic_crisis_desc: "La derrota en Jena-Auerstedt: ante Napoleón, Prusia se enfrenta a una crisis de supervivencia."
 bra_stein_hardenberg_reforms: "Las reformas de Stein-Hardenberg"
 bra_stein_hardenberg_reforms_desc: "Ha llegado la hora de desafiar los fundamentos financieros de una Francia aún dominante: mediante la liberación de los siervos y la reforma administrativa, alcanza la recuperación de la crisis."
 bra_rhineland_acquisition: "Adquiere Renania"
 bra_rhineland_acquisition_desc: "Toma las ricas tierras a lo largo del Rin y asienta la base de la industrialización."
 bra_show_of_strength: "Demostración de fuerza"
 bra_show_of_strength_desc: "Antes de tender la mano a los vastos espacios de Alemania, muestra el poder de Prusia a los príncipes del norte."
 bra_lower_saxony_conquest: "Conquista la Baja Sajonia"
 bra_lower_saxony_conquest_desc: "Derrota a nuestros rivales en Luneburgo y Magdeburgo, asegura el puerto de Emden y amplía nuestro alcance por toda la Baja Sajonia."
 bra_westphalian_conquest: "Conquista de Westfalia"
 bra_westphalian_conquest_desc: "Extiende nuestra hegemonía sobre el norte de Alemania más al oeste, hasta las tierras de Westfalia."
 bra_zollverein: "El Zollverein"
 bra_zollverein_desc: "Lidera la Unión Aduanera (Zollverein), que une económicamente a los Estados alemanes."
 bra_prussian_constitution: "La Constitución prusiana"
 bra_prussian_constitution_desc: "Establece las bases de la monarquía constitucional por medio de la constitución de 1850."
 bra_army_reform_1860s: "Reforma militar de la década de 1860"
 bra_army_reform_1860s_desc: "Las reformas militares de Roon y Moltke: lleva la doctrina militar elegida anteriormente, de calidad o cantidad, a alturas aún mayores."
 bra_danish_war: "Guerra contra Dinamarca"
 bra_danish_war_desc: "Empuña las armas contra Dinamarca por la cuestión de Schleswig-Holstein."
 bra_austro_prussian_war: "La guerra austro-prusiana"
 bra_austro_prussian_war_desc: "Resuelve la cuestión en la batalla de Sadowa y gana el liderazgo de Alemania."
 bra_north_german_confederation: "La Confederación de Alemania del Norte"
 bra_north_german_confederation_desc: "Une los Estados alemanes al norte del Meno, excepto Austria, y establece la Confederación de Alemania del Norte."
 bra_south_german_states: "Alianza con los Estados del sur de Alemania"
 bra_south_german_states_desc: "Forja alianzas militares con los Estados surgermanos de Baviera, Wurtemberg y otros."
 bra_franco_prussian_war: "La guerra franco-prusiana"
 bra_franco_prussian_war_desc: "Provocada por el Telegrama de Ems, acepta la guerra decisiva contra el Segundo Imperio francés."
 bra_alsace_lorraine_annexed: "Alsacia-Lorena anexionadas"
 bra_alsace_lorraine_annexed_desc: "Anexiona Alsacia y Lorena como botín de guerra, grabando la enemistad eterna con Francia."
 bra_german_empire: "Imperio alemán establecido"
 bra_german_empire_desc: "Establece el Imperio alemán, con el rey de Prusia como emperador, la más nueva gran potencia de Europa."
 bra_kulturkampf: "El Kulturkampf"
 bra_kulturkampf_desc: "Somete la influencia de la Iglesia católica y redefine las relaciones entre el Estado y la iglesia."
 bra_social_legislation: "Legislación de seguridad social"
 bra_social_legislation_desc: "Establece sistemas de seguro de salud, accidentes y vejez como contrapeso al socialismo."
 bra_colonial_empire: "El Imperio colonial"
 bra_colonial_empire_desc: "Buscando un “lugar al sol”, construye colonias en África y en el Pacífico."
 bra_high_seas_fleet: "La Flota de Alta Mar"
 bra_high_seas_fleet_desc: "Bajo el mando del almirante Tirpitz, construye una Flota de Alta Mar capaz de rivalizar con Gran Bretaña."
 bra_weltpolitik: "Weltpolitik"
 bra_weltpolitik_desc: "Bajo la bandera de la “política mundial” de Guillermo II, ocupa tu lugar entre las grandes potencias del mundo."
 bra_berlin_metropolis: "La Gran Berlín concluida"
 bra_berlin_metropolis_desc: "Desarrolla Berlín en una metrópoli mundial, capaz de rivalizar con París y Londres."
 bra_ruhr_industry_complete: "La industria del Ruhr concluida"
 bra_ruhr_industry_complete_desc: "Lleva el poderío industrial del Ruhr al límite, convirtiéndote en una de las grandes potencias de la industria pesada del mundo."
 bra_german_science: "El ascenso de la ciencia alemana"
 bra_german_science_desc: "Construye una edad de oro de la ciencia alemana, liderando el mundo en física y química."
 bra_naval_race: "La carrera naval"
 bra_naval_race_desc: "Gana la carrera armamentística naval con Gran Bretaña y muestra un poderío naval capaz de rivalizar con el mundo."
 bra_balkan_influence: "Influencia en los Balcanes"
 bra_balkan_influence_desc: "Por medio de nuestro aliado austríaco, amplía la influencia sobre la Península Balcánica."
 bra_ottoman_partnership: "Asociación con los otomanos"
 bra_ottoman_partnership_desc: "Firma una alianza con el “hombre enfermo” de Europa, el Imperio otomano, como cabeza de puente hacia Oriente."
 bra_mitteleuropa: "Mitteleuropa"
 bra_mitteleuropa_desc: "Promueve la visión de “Mitteleuropa”, que une Europa central en una esfera económica alemana."
 bra_grossdeutschland: "La Gran Alemania"
 bra_grossdeutschland_desc: "Realiza por fin el ideal de la “Gran Alemania”, que incluye también a Austria."
 bra_hegemon_of_europe: "Hegemón de Europa"
 bra_hegemon_of_europe_desc: "Establece una hegemonía incontestada sobre Europa en economía, fuerza militar y diplomacia."
 bra_second_reich_eternal: "El Segundo Reich eterno"
 bra_second_reich_eternal_desc: "De pequeña marca de frontera a un imperio que gobierna Europa: la historia de la casa de Hohenzollern alcanza su cumplimiento."
 bra_events.1.t: "Rey en Prusia"
 bra_events.1.d: "El 18 de enero de 1701, en Königsberg, Federico I se coronó “Rey en Prusia”. El elector de Brandeburgo es ahora él mismo rey."
 bra_events.1.a: "¡Gloria al Rey! ¡Reino de Prusia establecido!"
 bra_events.2.t: "La proclamación en Versalles"
 bra_events.2.d: "El 18 de enero de 1871, en el Salón de los Espejos de Versalles, el rey Guillermo I de Prusia fue proclamado emperador alemán. La era de las divisiones ha terminado, y nace el Imperio alemán unificado."
 bra_events.2.a: "¡Gloria al Emperador! ¡Gloria al Imperio alemán!"
 bra_events.99.t: "El Segundo Reich eterno"
 bra_events.99.d: "El largo camino, iniciado con la pequeña marca de la casa de Ascania, ha alcanzado su destino. Bajo los Hohenzollern, Alemania gobierna ahora un imperio sin igual en Europa."
 bra_events.99.a: "¡Gloria a Alemania! ¡Gloria al Segundo Reich!"
 STATIC_MODIFIER_NAME_bra_ascanian_mod: "El legado de los ascanios"
 STATIC_MODIFIER_DESC_bra_ascanian_mod: "La memoria de los ascanios, cuyo oso heráldico un día marcó las marcas, permanece grabada en las piedras de los castillos de frontera."
 STATIC_MODIFIER_NAME_bra_march_mod: "Autoridad del margrave establecida"
 STATIC_MODIFIER_DESC_bra_march_mod: "Edictos sellados con el sello del margrave van de propiedad en propiedad, y hasta los señores se someten ahora."
 STATIC_MODIFIER_NAME_bra_altmark_mod: "Altmark asegurada"
 STATIC_MODIFIER_DESC_bra_altmark_mod: "Las defensas de la Altmark, patria de la marca, reforzadas."
 STATIC_MODIFIER_NAME_bra_neumark_mod: "Neumark colonizada"
 STATIC_MODIFIER_DESC_bra_neumark_mod: "Más allá del Óder, colonos alemanes clavan sus arados en las tierras salvajes de la Neumark."
 STATIC_MODIFIER_NAME_bra_pomerania_mod: "Rivalidad con Pomerania"
 STATIC_MODIFIER_DESC_bra_pomerania_mod: "Las largas rencillas con los duques de Pomerania han enseñado a los señores de la marca a gobernar la tierra conquistada."
 STATIC_MODIFIER_NAME_bra_uckermark_mod: "Uckermark integrada"
 STATIC_MODIFIER_DESC_bra_uckermark_mod: "Las fértiles tierras de la Uckermark figuran ahora en los libros de los recaudadores de impuestos del margrave."
 STATIC_MODIFIER_NAME_bra_berlin_mod: "Berlín desarrollada"
 STATIC_MODIFIER_DESC_bra_berlin_mod: "Berlín prospera como corazón de la marca."
 STATIC_MODIFIER_NAME_bra_electoral_mod: "Dignidad electoral"
 STATIC_MODIFIER_DESC_bra_electoral_mod: "Embajadores con el sello del elector ocupan ahora un lugar junto a los príncipes en la corte del emperador."
 STATIC_MODIFIER_NAME_bra_hohenzollern_mod: "Investidura de los Hohenzollern"
 STATIC_MODIFIER_DESC_bra_hohenzollern_mod: "La familia, nacida de los burgraves de Núremberg, alza ahora el estandarte de una nueva dinastía en los castillos de Brandeburgo."
 STATIC_MODIFIER_NAME_bra_dynasty_mod: "Dinastía asegurada"
 STATIC_MODIFIER_DESC_bra_dynasty_mod: "La sangre de los Hohenzollern es ahora reconocida como autoridad indiscutible, tanto en los castillos de frontera como en la corte."
 STATIC_MODIFIER_NAME_bra_diet_mod: "Voz en la Dieta"
 STATIC_MODIFIER_DESC_bra_diet_mod: "En la Dieta Imperial de Ratisbona, los príncipes escuchan con atención cuando habla el enviado de Brandeburgo."
 STATIC_MODIFIER_NAME_bra_reformation_mod: "La elección de la Reforma"
 STATIC_MODIFIER_DESC_bra_reformation_mod: "Bajo un elector que adoptó la doctrina de Lutero, sus súbditos aprenden tolerancia por las diferencias de fe."
 STATIC_MODIFIER_NAME_bra_secularize_mod: "Prusia secularizada"
 STATIC_MODIFIER_DESC_bra_secularize_mod: "Las rentas de las tierras, antes obispados, son ahora administradas por los funcionarios del propio elector."
 STATIC_MODIFIER_NAME_bra_cleves_mod: "La herencia de Cléveris"
 STATIC_MODIFIER_DESC_bra_cleves_mod: "El exclave occidental de Cléveris aporta nueva riqueza al tesoro."
 STATIC_MODIFIER_NAME_bra_thirty_years_mod: "La prueba de la Guerra de los Treinta Años"
 STATIC_MODIFIER_DESC_bra_thirty_years_mod: "La experiencia de sobrevivir a la guerra se ha convertido en la clave para la defensa de la patria."
 STATIC_MODIFIER_NAME_bra_great_elector_mod: "El gobierno del Gran Elector"
 STATIC_MODIFIER_DESC_bra_great_elector_mod: "El nombre del Gran Elector, vencedor en Fehrbellin, se ha convertido en la propia autoridad de la dinastía."
 STATIC_MODIFIER_NAME_bra_standing_army_mod: "Ejército permanente creado"
 STATIC_MODIFIER_DESC_bra_standing_army_mod: "Los soldados del ejército permanente, que juran lealtad solo al elector, se entrenan día tras día en las plazas de Potsdam."
 STATIC_MODIFIER_NAME_bra_absolutism_mod: "Absolutismo establecido"
 STATIC_MODIFIER_DESC_bra_absolutism_mod: "Las órdenes del rey van ahora de la corte de Berlín a los consejos rurales de todos los rincones del Estado."
 STATIC_MODIFIER_NAME_bra_sovereign_mod: "Soberanía prusiana"
 STATIC_MODIFIER_DESC_bra_sovereign_mod: "El duque de Prusia, que abandonó el juramento antes debido al rey polaco, es ahora recibido en cortes extranjeras como soberano igual."
 STATIC_MODIFIER_NAME_bra_administration_mod: "La administración prusiana"
 STATIC_MODIFIER_DESC_bra_administration_mod: "Los libros y reglamentos redactados por los escribas del Directorio General sustentan la administración de todos los rincones del reino."
 STATIC_MODIFIER_NAME_bra_junker_mod: "Junkers integrados"
 STATIC_MODIFIER_DESC_bra_junker_mod: "Los junkers funcionan ahora como núcleo del ejército y de la administración."
 STATIC_MODIFIER_NAME_bra_potsdam_mod: "Potsdam desarrollada"
 STATIC_MODIFIER_DESC_bra_potsdam_mod: "La residencia real, Potsdam, prospera como centro de la cultura de corte."
 STATIC_MODIFIER_NAME_bra_soldier_king_mod: "El legado del Rey Sargento"
 STATIC_MODIFIER_DESC_bra_soldier_king_mod: "La frugalidad y la disciplina rígida legadas por el Rey Sargento aún se aferran a las propias paredes de los cuarteles."
 STATIC_MODIFIER_NAME_bra_treasury_mod: "Tesoro lleno"
 STATIC_MODIFIER_DESC_bra_treasury_mod: "En los frugales cofres reales, cajas de plata se apilan en alto para las guerras que vendrán."
 STATIC_MODIFIER_NAME_bra_silesian_ambition_mod: "Ambiciones sobre Silesia"
 STATIC_MODIFIER_DESC_bra_silesian_ambition_mod: "Oficiales que sueñan con los valles fértiles de Silesia aguardan impacientes la orden de marcha."
 STATIC_MODIFIER_NAME_bra_first_silesian_mod: "La Primera Guerra de Silesia"
 STATIC_MODIFIER_DESC_bra_first_silesian_mod: "Marchando como un relámpago por la nieve, el ejército ya estaba en las murallas de Breslavia antes de que Austria completara la movilización."
 STATIC_MODIFIER_NAME_bra_silesia_mod: "Silesia anexionada"
 STATIC_MODIFIER_DESC_bra_silesia_mod: "La riqueza nacida de los hornos y talleres de Silesia fluye sin cesar al tesoro de Berlín."
 STATIC_MODIFIER_NAME_bra_enlightenment_mod: "La Ilustración prusiana"
 STATIC_MODIFIER_DESC_bra_enlightenment_mod: "Los ideales de la Ilustración, que se difunden desde la corte de Sanssouci, multiplican las escuelas en las aldeas."
 STATIC_MODIFIER_NAME_bra_seven_years_mod: "La prueba de la Guerra de los Siete Años"
 STATIC_MODIFIER_DESC_bra_seven_years_mod: "La experiencia de luchar contra toda Europa ha forjado la disciplina militar."
 STATIC_MODIFIER_NAME_bra_frederick_mod: "El legado de Federico el Grande"
 STATIC_MODIFIER_DESC_bra_frederick_mod: "El nombre de Federico el Grande se transmite tanto como orgullo del soldado como gloria del Estado."
 STATIC_MODIFIER_NAME_bra_partitions_mod: "Particiones de Polonia"
 STATIC_MODIFIER_DESC_bra_partitions_mod: "Funcionarios y agrimensores prusianos se mudan uno tras otro a las aldeas de Prusia Occidental, tomadas en las particiones."
 STATIC_MODIFIER_NAME_bra_academy_mod: "La Academia prusiana"
 STATIC_MODIFIER_DESC_bra_academy_mod: "Las conferencias de los eruditos reunidos en la academia de Berlín atraen estudiantes de todo el país."
 STATIC_MODIFIER_NAME_bra_invasion_poland_mod: "Invasión de Polonia"
 STATIC_MODIFIER_DESC_bra_invasion_poland_mod: "Placas y oficinas alemanas surgen una a una en las ciudades conquistadas de la Gran Polonia."
 STATIC_MODIFIER_NAME_bra_napoleonic_mod: "La crisis napoleónica"
 STATIC_MODIFIER_DESC_bra_napoleonic_mod: "La experiencia de superar la crisis se convierte en la base de la defensa de la patria."
 STATIC_MODIFIER_NAME_bra_reforms_mod: "Las reformas de Stein-Hardenberg"
 STATIC_MODIFIER_DESC_bra_reforms_mod: "Las reformas de Stein y Hardenberg liberaron al campesino de la servidumbre y abrieron la puerta al servicio público."
 STATIC_MODIFIER_NAME_bra_rhineland_mod: "Renania adquirida"
 STATIC_MODIFIER_DESC_bra_rhineland_mod: "Los impuestos que fluyen de las ricas ciudades y minas de carbón a lo largo del Rin alegran a los tesoreros de Berlín."
 STATIC_MODIFIER_NAME_bra_show_of_strength_mod: "Demostración de fuerza"
 STATIC_MODIFIER_DESC_bra_show_of_strength_mod: "Los príncipes del norte de Alemania, tras ver la formación de las tropas en la plaza de Berlín, se marcharon sin palabras innecesarias."
 STATIC_MODIFIER_NAME_bra_lower_saxony_mod: "Baja Sajonia conquistada"
 STATIC_MODIFIER_DESC_bra_lower_saxony_mod: "La victoria del ejército prusiano en las llanuras de Hannover ha trazado de nuevo el mapa del norte de Alemania."
 STATIC_MODIFIER_NAME_bra_westphalia_mod: "Westfalia conquistada"
 STATIC_MODIFIER_DESC_bra_westphalia_mod: "Los alcaldes de las ciudades westfalianas han pasado a seguir las orientaciones de los funcionarios de Berlín."
 STATIC_MODIFIER_NAME_bra_zollverein_mod: "El Zollverein"
 STATIC_MODIFIER_DESC_bra_zollverein_mod: "En las fronteras de la unión aduanera, las carretas pasan sin esperar a que se levante la barrera."
 STATIC_MODIFIER_NAME_bra_constitution_mod: "La Constitución prusiana"
 STATIC_MODIFIER_DESC_bra_constitution_mod: "Los papeles del parlamento y del monarca, fijados en los artículos de la constitución, han traído un nuevo orden a la práctica política."
 STATIC_MODIFIER_NAME_bra_danish_war_mod: "Guerra contra Dinamarca"
 STATIC_MODIFIER_DESC_bra_danish_war_mod: "El regreso triunfal de los soldados prusianos que tomaron las trincheras de Dybbøl aceleró la unión de Schleswig y Holstein."
 STATIC_MODIFIER_NAME_bra_austro_prussian_war_mod: "La guerra austro-prusiana"
 STATIC_MODIFIER_DESC_bra_austro_prussian_war_mod: "En el campo de Sadowa, el fusil de retrocarga derribó todo lo que los soldados creían reglas de la guerra."
 STATIC_MODIFIER_NAME_bra_north_confederation_mod: "La Confederación de Alemania del Norte"
 STATIC_MODIFIER_DESC_bra_north_confederation_mod: "El día en que la bandera de la Confederación de Alemania del Norte fue izada por primera vez sobre el palacio de Berlín, los enviados de los Estados supieron que había comenzado una nueva era."
 STATIC_MODIFIER_NAME_bra_south_german_mod: "Alianza con el sur"
 STATIC_MODIFIER_DESC_bra_south_german_mod: "Los enviados, guardianes del pacto con Prusia, van y vienen ahora incluso en las cortes de Baviera y Wurtemberg."
 STATIC_MODIFIER_NAME_bra_franco_prussian_mod: "La guerra franco-prusiana"
 STATIC_MODIFIER_DESC_bra_franco_prussian_mod: "La noche en que la noticia de la victoria en Sedán llegó a Berlín, todas las calles estaban tomadas por la alegría."
 STATIC_MODIFIER_NAME_bra_alsace_mod: "Alsacia-Lorena anexionadas"
 STATIC_MODIFIER_DESC_bra_alsace_mod: "Las chimeneas de las fábricas textiles y minas de hierro alsacianas mueven la industria del nuevo Imperio alemán."
 STATIC_MODIFIER_NAME_bra_kulturkampf_mod: "El Kulturkampf"
 STATIC_MODIFIER_DESC_bra_kulturkampf_mod: "Las nuevas instituciones, formadas tras la lucha del Estado contra la iglesia, han borrado las fronteras entre las oficinas estatales y las parroquias."
 STATIC_MODIFIER_NAME_bra_social_mod: "Legislación de seguridad social"
 STATIC_MODIFIER_DESC_bra_social_mod: "Los trabajadores, en fila por los subsidios por enfermedad y vejez, saben que el Estado no los abandonará."
 STATIC_MODIFIER_NAME_bra_colonial_mod: "El Imperio colonial"
 STATIC_MODIFIER_DESC_bra_colonial_mod: "En la cubierta de los vapores rumbo a las colonias de África y los Mares del Sur, hay colonos que sueñan con un nuevo mundo."
 STATIC_MODIFIER_NAME_bra_fleet_mod: "La Flota de Alta Mar"
 STATIC_MODIFIER_DESC_bra_fleet_mod: "De las chimeneas de los acorazados alineados en el puerto de guerra de Kiel sube el humo de la determinación de proteger las rutas comerciales."
 STATIC_MODIFIER_NAME_bra_weltpolitik_mod: "Política mundial"
 STATIC_MODIFIER_DESC_bra_weltpolitik_mod: "Los mapas en el ministerio de Asuntos Exteriores de Berlín reflejan ahora una política mundial que se extiende de África a Asia."
 STATIC_MODIFIER_NAME_bra_berlin_metropolis_mod: "La Gran Berlín concluida"
 STATIC_MODIFIER_DESC_bra_berlin_metropolis_mod: "La metrópoli mundial de Berlín brilla como centro de prosperidad y gobierno."
 STATIC_MODIFIER_NAME_bra_ruhr_complete_mod: "La industria del Ruhr concluida"
 STATIC_MODIFIER_DESC_bra_ruhr_complete_mod: "Los altos hornos del Ruhr escupen fuego noche y día, enviando acero alemán al mundo."
 STATIC_MODIFIER_NAME_bra_science_mod: "El ascenso de la ciencia alemana"
 STATIC_MODIFIER_DESC_bra_science_mod: "Los descubrimientos nacidos en los laboratorios de Gotinga y Berlín han hecho de Alemania el centro de la ciencia mundial."
 STATIC_MODIFIER_NAME_bra_naval_race_mod: "La carrera naval"
 STATIC_MODIFIER_DESC_bra_naval_race_mod: "En los astilleros de Wilhelmshaven, la quilla del próximo acorazado ya ha sido asentada."
 STATIC_MODIFIER_NAME_bra_balkan_mod: "Influencia en los Balcanes"
 STATIC_MODIFIER_DESC_bra_balkan_mod: "Los asuntos balcánicos, discutidos a diario por los diplomáticos de Viena y Berlín, ligan cada vez más a los dos aliados."
 STATIC_MODIFIER_NAME_bra_ottoman_mod: "Asociación con los otomanos"
 STATIC_MODIFIER_DESC_bra_ottoman_mod: "Con cada milla construida del Ferrocarril de Bagdad, los lazos entre Berlín y Constantinopla se profundizan."
 STATIC_MODIFIER_NAME_bra_mitteleuropa_mod: "Mitteleuropa"
 STATIC_MODIFIER_DESC_bra_mitteleuropa_mod: "La visión de una esfera económica unificada en Europa central se extiende en silencio incluso entre mercaderes y funcionarios de países vecinos."
 STATIC_MODIFIER_NAME_bra_grossdeutschland_mod: "La Gran Alemania"
 STATIC_MODIFIER_DESC_bra_grossdeutschland_mod: "“¿Dónde está la patria del alemán?”: la vieja pregunta, cantada de Viena a Berlín, encuentra por fin su respuesta."
 STATIC_MODIFIER_NAME_bra_hegemon_mod: "Hegemón de Europa"
 STATIC_MODIFIER_DESC_bra_hegemon_mod: "Ninguna corte de Europa puede ya tomar una decisión importante sin conocer antes la voluntad de Berlín."
 STATIC_MODIFIER_NAME_bra_king_in_prussia_mod: "Rey en Prusia"
 STATIC_MODIFIER_DESC_bra_king_in_prussia_mod: "Desde el día de la coronación en la capilla del castillo de Königsberg, la corte prusiana empezó a forjar el ceremonial de un reino."
 STATIC_MODIFIER_NAME_bra_second_reich_mod: "El Segundo Reich eterno"
 STATIC_MODIFIER_DESC_bra_second_reich_mod: "Desde la proclamación hecha en el Salón de los Espejos de Versalles, la corona de los Hohenzollern se alzó para brillar en la cumbre de Europa."
