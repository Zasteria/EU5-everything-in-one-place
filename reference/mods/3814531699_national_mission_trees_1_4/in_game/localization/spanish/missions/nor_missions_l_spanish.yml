l_spanish:
 nor_kongedommen_mission_pack: "Kongeriket Norge: la gloria de Noruega"
 nor_kongedommen_mission_pack_DESCRIPTION:0 "En 1337, Noruega está en unión personal con Suecia bajo el rey Magnus Eriksson, aún bajo influencia danesa. Como herederos de los vikingos, libérate de Dinamarca y une Escandinavia. Mediante las pesquerías de Bergen, el dominio del Mar del Norte, las colonias en Islandia y Groenlandia y la gran navegación hacia Vinland —y con la elección de la fe (católica, luterana o nórdica)—, construye el Imperio noruego."
 nor_kongedommen_mission_pack_CRITERIA_DESCRIPTION:0 "Como Noruega, alcanza la independencia, la unidad, el dominio del Atlántico Norte y un imperio colonial, para establecer el Imperio noruego."
 nor_kongedommen_mission_pack_BUTTON_TOOLTIP:0 "Completa las misiones para construir el Imperio noruego."
 nor_kongedommen_mission_pack_BUTTON_DETAILS:0 "¡Con el orgullo de los herederos de los vikingos, forja Noruega en un Imperio!"
 nor_kingdom_of_norway: "El Reino de Noruega"
 nor_kingdom_of_norway_desc: "En 1337, Noruega está en unión personal con Suecia bajo el rey Magnus Eriksson, mientras la influencia danesa amenaza sin cesar el Norte. Como herederos de los vikingos, refuerza la legitimidad real y firma los cimientos de un reino noruego independiente."
 nor_control_denmark: "Controla Dinamarca"
 nor_control_denmark_desc: "Dinamarca es la mayor amenaza y rival histórica de Noruega. Tomar Copenhague o convertir a Dinamarca en vasalla noruega transfiere a Noruega el liderazgo en la Unión de Kalmar."
 nor_sweden_union: "Unión personal con Suecia"
 nor_sweden_union_desc: "Refuerza y preserva la unión personal con Suecia, para que toda la fuerza del norte de Escandinavia se reúna bajo Noruega. Continúa el gobierno del rey Magnus y haz de esta alianza la base de la unidad escandinava."
 nor_unite_scandinavia: "Une Escandinavia"
 nor_unite_scandinavia_desc: "Dinamarca controlada, Suecia en unión personal: toda Escandinavia unida bajo el estandarte noruego. Desde los tiempos vikingos, el momento histórico en que el mundo del norte es gobernado bajo un solo rey ha llegado aquí."
 nor_sound_toll: "El peaje del Øresund"
 nor_sound_toll_desc: "Con Dinamarca derrotada, el estrecho del Øresund cae bajo control noruego. Cobrar el peaje del Øresund genera enormes ingresos."
 nor_develop_stockholm: "Desarrolla Estocolmo"
 nor_develop_stockholm_desc: "Por medio de la unión sueca, desarrolla Estocolmo como nudo administrativo oriental del Imperio noruego."
 nor_secure_bergen: "Asegura Bergen"
 nor_fleet_of_norway: "La flota de Noruega"
 nor_fleet_of_norway_desc: "Los noruegos —descendientes de los vikingos— son un pueblo del mar. Construir una poderosa flota con base en Bergen establece capacidad de empleo en todo el Mar del Norte, el Atlántico Norte y el Báltico."
 nor_north_sea_markets: "Mercados del Mar del Norte"
 nor_north_sea_markets_desc: "Noruega usa su ventaja geográfica orientada al Mar del Norte para desarrollar el comercio. Establece a Noruega como protagonista del comercio del Mar del Norte, con ingresos mensuales 100+ y varios centros comerciales."
 nor_iceland_colony: "Controla Islandia"
 nor_iceland_colony_desc: "Islandia fue poblada por noruegos en 874: una base ultramarina de la cultura noruega. Poseer varias provincias islandesas completa la cabeza de puente en el Atlántico Norte y acerca Groenlandia y Vinland."
 nor_greenland_expedition: "La expedición a Groenlandia"
 nor_greenland_expedition_desc: "En 985, Erik el Rojo (Eiríkr rauði) fundó una colonia en Groenlandia. Da este primer paso hacia el continente occidental y abre el camino a la legendaria Vinland."
 nor_vinland: "Vinland"
 nor_orkney_shetland: "Orcadas y Shetland"
 nor_orkney_shetland_desc: "Orcadas y Shetland están bajo influencia noruega desde tiempos vikingos. Asegurar estas islas estratégicas mejora enormemente la capacidad de empleo en el Mar del Norte y hacia las Islas Británicas."
 nor_conquer_scotland: "Conquista Escocia"
 nor_conquer_scotland_desc: "La costa occidental de Escocia y las Hébridas estuvieron antaño bajo dominio vikingo. Tomar Edimburgo y las Hébridas abre el camino hacia York: capital del Danelaw."
 nor_invade_england: "Invade Inglaterra"
 nor_invade_england_desc: "York fue antaño capital del reino noruego de Jórvík. Fuerzas noruegas que ocupan York resucitan la memoria del Danelaw en nuestros días."
 nor_kingdom_of_britain: "El Reino de Gran Bretaña"
 nor_master_of_north_sea: "Señor del Mar del Norte"
 nor_master_of_north_sea_desc: "Mercados del Mar del Norte asegurados, Orcadas y Shetland tomadas: Noruega es la incontestada señora del Mar del Norte. Con flota 50+ e ingresos 200+, el estandarte noruego ondea sobre todo el Mar del Norte."
 nor_secure_nidaros: "Asegura Nidaros"
 nor_fisheries: "Desarrolla la pesca"
 nor_fisheries_desc: "Noruega es la mayor potencia pesquera de Europa. Bacalao, arenque y salmón llenan el Atlántico Norte en abundancia. Desarrolla plenamente la pesca de esta nación y establece un sistema de exportación en masa al Mar del Norte y al Báltico."
 nor_timber_industry: "La industria maderera"
 nor_arctic_trade: "Comercio ártico"
 nor_develop_oslo: "Desarrolla Oslo"
 nor_absolutism: "Absolutismo"
 nor_absolutism_desc: "Establece la monarquía absoluta en Noruega. Elevar el poder real y fortalecer la legitimidad prepara la base para un gobierno imperial centralizado."
 nor_northern_economy: "La economía del Norte"
 nor_northern_economy_desc: "El comercio ártico y las reformas económicas de la monarquía absoluta: la economía noruega alcanza el nivel más alto de Europa septentrional. Demuéstralo con ingresos mensuales 300+ y varios centros comerciales."
 nor_religious_question: "La cuestión de la fe"
 nor_religious_question_desc: "La tormenta de la Reforma ha llegado a Noruega. El clero de la catedral de Nidaros pide lealtad a Roma. Pero cada vez más gente encuentra eco en la nueva doctrina de Lutero. Y algunos sueñan con un retorno a los antiguos dioses. La elección del rey noruego decidirá el alma de este reino septentrional."
 nor_catholic_norway: "La Noruega católica"
 nor_catholic_norway_desc: "El Reino de Noruega mantiene fidelidad a la Iglesia de Roma. Guardando la tradición del catolicismo septentrional, simbolizada por la catedral de Nidaros, haz de Noruega guardiana de la civilización católica del norte mediante estrechos lazos con el papa."
 nor_northern_crusade: "La Cruzada del Norte"
 nor_northern_crusade_desc: "Noruega participa en la guerra santa como escudo septentrional de la cristiandad. Luchando contra los infieles, la autoridad religiosa y el prestigio noruego crecen."
 nor_papal_champion: "Campeona del papa"
 nor_papal_champion_desc: "Profunda confianza con el papado y control de Lübeck: Noruega ha establecido la posición inquebrantable de más fuerte guardiana de la civilización católica del norte."
 nor_reformation: "La Reforma"
 nor_reformation_desc: "Noruega adopta el luteranismo (o el calvinismo). Los bienes de la iglesia pasan a la corona, fortaleciendo las finanzas del Estado."
 nor_protestant_church: "La Iglesia protestante"
 nor_protestant_church_desc: "Desarrolla universidades para formar teólogos luteranos y arraigar la fe protestante en toda Noruega."
 nor_protestant_empire: "El Imperio protestante"
 nor_protestant_empire_desc: "El luteranismo impregna Escandinavia. El rey noruego reina como defensor septentrional del mundo protestante."
 nor_norse_revival: "El renacimiento de la fe nórdica"
 nor_norse_revival_desc: "Los dioses de los ancestros —Odín, Thor, Freyr— renacen. El rostro de Escandinavia antes de la cristianización se recrea en nuestros días. El rey noruego reina como representante de los dioses nórdicos."
 nor_berserker_fleet: "La flota berserker"
 nor_berserker_fleet_desc: "El espíritu de los berserkers vikingos habita la flota. Guerreros marinos, devotos de los dioses nórdicos, soltados como corsarios para devastar las costas de los infieles."
 nor_ragnarok_empire: "El Imperio del Ragnarök"
 nor_ragnarok_empire_desc: "Como el nuevo mundo que viene después del Ragnarök, Noruega renace como imperio septentrional bajo la bendición de los antiguos dioses. Con rango imperial y 500+ provincias en posesión directa, conquista esta gloria."
 nor_bane_of_hansa: "El azote de la Hansa"
 nor_bane_of_hansa_desc: "La Liga Hanseática dominó el comercio noruego por medio del Bryggen (Muelle Alemán) en Bergen. Controla Lübeck o disuelve la Liga Hanseática para que los mercaderes noruegos recobren sus propias rutas comerciales."
 nor_baltic_access: "Acceso al Báltico"
 nor_baltic_access_desc: "Tomar Stralsund da a Noruega acceso directo al Mar Báltico. Noruega se convierte así en la mayor potencia naval de Europa septentrional, controlando tanto el Mar del Norte como el Báltico."
 nor_hanseatic_expulsion: "Expulsa a los mercaderes hanseáticos"
 nor_hanseatic_expulsion_desc: "Con la Liga Hanseática disuelta y Bergen desarrollada, Noruega ha liberado por completo Bergen del dominio mercantil alemán. Los mercaderes noruegos son señores de su propio puerto."
 nor_control_north_sea_trade: "Domina el comercio del Mar del Norte"
 nor_control_north_sea_trade_desc: "Mercados del Mar del Norte asegurados y la Liga Hanseática aplastada: Noruega toma la iniciativa sobre toda la ruta comercial del Mar del Norte. Establece el dominio con ingresos 300+ y flota 40+."
 nor_north_sea_empire: "El Imperio del Mar del Norte"
 nor_north_sea_empire_desc: "Noruega, que controla toda la costa del Mar del Norte, incluida Lübeck, ha construido el Imperio del Mar del Norte. El Imperio del Mar del Norte de Canuto el Grande renace en nuestros días."
 nor_develop_stavanger: "Desarrolla Stavanger"
 nor_amber_trade: "Comercio de ámbar"
 nor_amber_trade_desc: "El ámbar del Báltico, exportado a toda Europa por la red comercial del Mar del Norte de Noruega. El “Oro del Norte” amplía aún más los ingresos noruegos."
 nor_integrate_finland: "Integra Finlandia"
 nor_integrate_finland_desc: "Por medio de la unión sueca, integra Finlandia como parte del Imperio noruego. Poseer directamente Turku y Uleåborg extiende el reino del Atlántico Norte al Mar de Barents."
 nor_engelbrekt: "El espíritu de Engelbrekt"
 nor_engelbrekt_desc: "El espíritu de la revuelta de Engelbrekt se ha extendido a Noruega. Con el apoyo del campesinado y una dura determinación por la independencia, encarna la tradición de los hombres libres del norte."
 nor_develop_hammerfest: "Desarrolla Hammerfest"
 nor_develop_hammerfest_desc: "Hammerfest es una de las ciudades más septentrionales del mundo. Desarrollar este puesto comercial ártico en ciudad establece un centro permanente del comercio ártico."
 nor_karoliner: "El ejército de élite noruego"
 nor_karoliner_desc: "El ejército de élite noruego, sustentado por alta tradición militar, concluido. Demostrada la fuerza militar del Imperio noruego, que explota el terreno montañoso para la defensa y un ataque poderoso."
 nor_great_power: "Gran potencia del Norte"
 nor_great_power_desc: "La monarquía absoluta y la pesca e industria desarrolladas: Noruega surge como gran potencia de Europa septentrional. Establece esta posición con 200+ provincias, ingresos 250+ y prestigio 60+."
 nor_colonization: "El Imperio colonial noruego"
 nor_stormakt: "Stormakt: gran potencia del Norte"
 nor_stormakt_desc: "Escandinavia unida, Imperio del Mar del Norte construido, economía del norte alcanzada: tres pilares se juntan, y Noruega reina como Stormakt (gran potencia) de Europa septentrional. Con 600+ provincias, ingresos 600+ y prestigio 80+, conquista esta gloria."
 nor_norwegian_empire: "El Imperio noruego"
 nor_norwegian_empire_desc: "De Islandia a Vinland, de Nidaros a Gran Bretaña: el Imperio noruego está concluido. Los descendientes de los vikingos han superado incluso los sueños de sus ancestros. Un imperio de tal escala, con el que ni Canuto el Grande soñó, ha nacido aquí. “El Mar del Norte ha vuelto a ser el lago de Noruega”, escribirán los historiadores."
 nor_events.30.t: "Unidad escandinava: amanecer del poder noruego"
 nor_events.30.d: "Dinamarca controlada, Suecia unida: toda Escandinavia unida bajo el estandarte noruego. Desde los tiempos vikingos, esta hazaña, a la que nadie igualó, se realiza por fin. Las campanas de la catedral de Nidaros doblan, y el rey de Noruega proclama ahora el título de “Rey de Escandinavia”."
 nor_events.30.a: "¡Viva Escandinavia! ¡Noruega para siempre!"
 nor_events.40.t: "La encrucijada de la fe: la elección religiosa de Noruega"
 nor_events.40.d: "La tormenta de la Reforma ha llegado a Noruega. El clero de la catedral de Nidaros pide lealtad a Roma. Pero cada vez más gente encuentra eco en la nueva doctrina de Lutero. Y hay quienes sueñan con un retorno a los antiguos dioses. La elección del rey noruego decidirá el futuro de este reino septentrional."
 nor_events.40.a: "Mantener la fidelidad a Roma: el catolicismo es el alma de Noruega"
 nor_events.40.b: "Adoptar la doctrina de Lutero: ha llegado la era de la reforma"
 nor_events.40.c: "Volver a los antiguos dioses: buscar la bendición de Odín"
 nor_events.99.t: "Nace el Imperio noruego"
 nor_events.99.d: "De Islandia a Vinland, de Nidaros a Gran Bretaña: el Imperio noruego está por fin concluido. Los descendientes de los vikingos han superado a sus ancestros. Un imperio de tal escala, con el que ni Canuto el Grande soñó, ha nacido aquí. “El Mar del Norte ha vuelto a ser el mar interior de Noruega”, registrarán los historiadores."
 nor_events.99.a: "¡Viva el Emperador del Imperio noruego! ¡Herederos de los vikingos para siempre!"
 STATIC_MODIFIER_NAME_nor_kingdom_mod: "El Reino de Noruega"
 STATIC_MODIFIER_DESC_nor_kingdom_mod: "Colocada la piedra angular de la reconstrucción de Noruega en el reinado del rey Magnus Eriksson."
 STATIC_MODIFIER_NAME_nor_denmark_crushed_mod: "Dinamarca aplastada"
 STATIC_MODIFIER_DESC_nor_denmark_crushed_mod: "La mayor rival de Noruega aplastada. El liderazgo sobre Escandinavia pasa a Noruega."
 STATIC_MODIFIER_NAME_nor_sweden_union_mod: "Unión personal sueca"
 STATIC_MODIFIER_DESC_nor_sweden_union_mod: "La unión personal con Suecia sienta la base de la unidad escandinava."
 STATIC_MODIFIER_NAME_nor_scandinavia_united_mod: "Escandinavia unida"
 STATIC_MODIFIER_DESC_nor_scandinavia_united_mod: "Los estandartes de tres reinos ondean lado a lado bajo una sola corona, y las órdenes emitidas desde Oslo alcanzan los mares del norte."
 STATIC_MODIFIER_NAME_nor_bergen_mod: "Nudo comercial de Bergen"
 STATIC_MODIFIER_DESC_nor_bergen_mod: "Bergen desarrollada como centro del comercio del Atlántico Norte de Noruega."
 STATIC_MODIFIER_NAME_nor_fleet_mod: "La flota de Noruega"
 STATIC_MODIFIER_DESC_nor_fleet_mod: "La flota noruega, de sangre vikinga, se emplea por el Mar del Norte y el Atlántico Norte."
 STATIC_MODIFIER_NAME_nor_north_sea_mod: "Mercados del Mar del Norte"
 STATIC_MODIFIER_DESC_nor_north_sea_mod: "Noruega establecida como protagonista del comercio del Mar del Norte."
 STATIC_MODIFIER_NAME_nor_iceland_mod: "Islandia conquistada"
 STATIC_MODIFIER_DESC_nor_iceland_mod: "Islandia asegurada como cabeza de puente de Noruega en el Atlántico Norte."
 STATIC_MODIFIER_NAME_nor_greenland_mod: "La expedición a Groenlandia"
 STATIC_MODIFIER_DESC_nor_greenland_mod: "Navegantes noruegos, rumbo a los mares helados de Groenlandia, trazan nuevas líneas en los mapas del extremo norte."
 STATIC_MODIFIER_NAME_nor_vinland_mod: "Vinland"
 STATIC_MODIFIER_DESC_nor_vinland_mod: "Noruega se convierte en la primera nación colonial de Europa en el Nuevo Mundo, con asentamientos en Norteamérica."
 STATIC_MODIFIER_NAME_nor_orkney_mod: "Orcadas y Shetland"
 STATIC_MODIFIER_DESC_nor_orkney_mod: "Sobre las olas del Mar del Norte, visibles desde los puertos de las Orcadas, las siluetas de barcos noruegos pasan sin cesar."
 STATIC_MODIFIER_NAME_nor_scotland_mod: "Escocia conquistada"
 STATIC_MODIFIER_DESC_nor_scotland_mod: "La toma de Edimburgo abre el camino hacia Gran Bretaña."
 STATIC_MODIFIER_NAME_nor_england_invasion_mod: "Invasión de Inglaterra"
 STATIC_MODIFIER_DESC_nor_england_invasion_mod: "La memoria del Danelaw revive. Fuerzas noruegas recorren el norte de Inglaterra."
 STATIC_MODIFIER_NAME_nor_britain_mod: "El Reino de Gran Bretaña"
 STATIC_MODIFIER_DESC_nor_britain_mod: "El Imperio del Mar del Norte de Canuto el Grande revive. Todo el archipiélago británico bajo control noruego."
 STATIC_MODIFIER_NAME_nor_north_sea_master_mod: "Señor del Mar del Norte"
 STATIC_MODIFIER_DESC_nor_north_sea_master_mod: "Noruega se convierte en la incontestada señora del Mar del Norte. Todo el Mar del Norte bajo control noruego."
 STATIC_MODIFIER_NAME_nor_nidaros_mod: "Nidaros desarrollada"
 STATIC_MODIFIER_DESC_nor_nidaros_mod: "La capital histórica de Noruega desarrollada como centro religioso y cultural del Norte."
 STATIC_MODIFIER_NAME_nor_fisheries_mod: "Pesca desarrollada"
 STATIC_MODIFIER_DESC_nor_fisheries_mod: "Los ricos recursos pesqueros del Atlántico Norte plenamente aprovechados, estableciendo la base económica de Noruega."
 STATIC_MODIFIER_NAME_nor_oslo_mod: "Oslo desarrollada"
 STATIC_MODIFIER_DESC_nor_oslo_mod: "Los escribas de la fortaleza de Akershus redactan los edictos reales de valle en valle por toda la Noruega meridional."
 STATIC_MODIFIER_NAME_nor_absolutism_mod: "Absolutismo"
 STATIC_MODIFIER_DESC_nor_absolutism_mod: "Monarquía absoluta establecida en Noruega. Sentada la base de un gobierno imperial centralizado."
 STATIC_MODIFIER_NAME_nor_catholic_mod: "La Noruega católica"
 STATIC_MODIFIER_DESC_nor_catholic_mod: "Manteniendo la fidelidad a la Iglesia de Roma, Noruega es reconocida como guardiana de la civilización católica del norte."
 STATIC_MODIFIER_NAME_nor_crusader_mod: "Gloria del cruzado del norte"
 STATIC_MODIFIER_DESC_nor_crusader_mod: "Noruega gana fama de guardiana de la cristiandad por medio de la guerra santa."
 STATIC_MODIFIER_NAME_nor_lutheran_mod: "Reforma luterana"
 STATIC_MODIFIER_DESC_nor_lutheran_mod: "Los vasos sagrados retirados de los monasterios yacen en los cofres reales, y el tesoro de Noruega está más lleno que nunca."
 STATIC_MODIFIER_NAME_nor_protestant_church_mod: "La Iglesia protestante"
 STATIC_MODIFIER_DESC_nor_protestant_church_mod: "La formación de teología luterana arraiga la fe protestante en toda Noruega."
 STATIC_MODIFIER_NAME_nor_norse_conversion_mod: "Renacimiento de la fe nórdica"
 STATIC_MODIFIER_DESC_nor_norse_conversion_mod: "La fe en Odín, Thor y Freyr renace. El espíritu guerrero de la era vikinga habita los ejércitos noruegos."
 STATIC_MODIFIER_NAME_nor_berserker_fleet_mod: "La flota berserker"
 STATIC_MODIFIER_DESC_nor_berserker_fleet_mod: "El espíritu de los berserkers vikingos habita la flota. Los corsarios devastan libremente las costas de los infieles."
 STATIC_MODIFIER_NAME_nor_ragnarok_mod: "El Imperio del Ragnarök"
 STATIC_MODIFIER_DESC_nor_ragnarok_mod: "Bajo la bendición de los antiguos dioses, Noruega renace como imperio septentrional."
 STATIC_MODIFIER_NAME_nor_hansa_victory_mod: "Hansa derrotada"
 STATIC_MODIFIER_DESC_nor_hansa_victory_mod: "El dominio mercantil alemán sobre Bergen aplastado."
 STATIC_MODIFIER_NAME_nor_baltic_mod: "Acceso al Báltico"
 STATIC_MODIFIER_DESC_nor_baltic_mod: "Noruega asegura acceso directo al Báltico por Stralsund."
 STATIC_MODIFIER_NAME_nor_trade_supremacy_mod: "Dominio del comercio del Mar del Norte"
 STATIC_MODIFIER_DESC_nor_trade_supremacy_mod: "Noruega toma la iniciativa sobre toda la ruta comercial del Mar del Norte."
 STATIC_MODIFIER_NAME_nor_stavanger_mod: "Puerto de Stavanger"
 STATIC_MODIFIER_DESC_nor_stavanger_mod: "Stavanger desarrollada como nudo pesquero y comercial del suroeste de Noruega."
 STATIC_MODIFIER_NAME_nor_amber_mod: "Comercio de ámbar"
 STATIC_MODIFIER_DESC_nor_amber_mod: "El ámbar del Báltico exportado por la red comercial de Noruega."
 STATIC_MODIFIER_NAME_nor_finland_mod: "Finlandia integrada"
 STATIC_MODIFIER_DESC_nor_finland_mod: "Finlandia integrada como parte del Imperio noruego."
 STATIC_MODIFIER_NAME_nor_engelbrekt_mod: "El espíritu de Engelbrekt"
 STATIC_MODIFIER_DESC_nor_engelbrekt_mod: "La tradición de los hombres libres del norte encarnada en el orgullo de Noruega."
 STATIC_MODIFIER_NAME_nor_hammerfest_mod: "Hammerfest desarrollada"
 STATIC_MODIFIER_DESC_nor_hammerfest_mod: "El puesto comercial más septentrional del mundo establecido como centro permanente del comercio ártico."
 STATIC_MODIFIER_NAME_nor_military_tradition_mod: "El ejército de élite noruego"
 STATIC_MODIFIER_DESC_nor_military_tradition_mod: "El ejército de élite noruego altamente entrenado, sustentado por fuerte tradición militar, concluido."
 STATIC_MODIFIER_NAME_nor_great_power_mod: "Gran potencia del Norte"
 STATIC_MODIFIER_DESC_nor_great_power_mod: "Noruega surge como gran potencia de Europa septentrional."
 STATIC_MODIFIER_NAME_nor_protestant_empire_mod: "El Imperio protestante"
 STATIC_MODIFIER_DESC_nor_protestant_empire_mod: "Noruega, con luteranismo por toda Escandinavia, reina como defensora septentrional del mundo protestante."
 STATIC_MODIFIER_NAME_nor_papal_champion_mod: "Campeona del papa"
 STATIC_MODIFIER_DESC_nor_papal_champion_mod: "Posición inquebrantable de más fuerte guardiana de la civilización católica del norte establecida."
 STATIC_MODIFIER_NAME_nor_colonial_empire_mod: "El Imperio colonial noruego"
 STATIC_MODIFIER_DESC_nor_colonial_empire_mod: "Noruega se convierte en el primer verdadero imperio colonial de Europa, con 10+ colonias, incluida Vinland."
 STATIC_MODIFIER_NAME_nor_stormakt_mod: "Stormakt"
 STATIC_MODIFIER_DESC_nor_stormakt_mod: "La era de las grandes potencias de Noruega ha llegado: reina como mayor potencia de Europa septentrional."
 STATIC_MODIFIER_NAME_nor_sound_toll_mod: "El peaje del Øresund"
 STATIC_MODIFIER_DESC_nor_sound_toll_mod: "El cobro del peaje del Øresund enriquece el tesoro noruego."
 STATIC_MODIFIER_NAME_nor_stockholm_mod: "Estocolmo desarrollada"
 STATIC_MODIFIER_DESC_nor_stockholm_mod: "Estocolmo desarrollada como nudo administrativo oriental del Imperio noruego por medio de la unión sueca."
 STATIC_MODIFIER_NAME_nor_hanseatic_expulsion_mod: "Mercaderes hanseáticos expulsados"
 STATIC_MODIFIER_DESC_nor_hanseatic_expulsion_mod: "Bergen liberada del dominio mercantil alemán: los mercaderes noruegos gobiernan su propio puerto."
 STATIC_MODIFIER_NAME_nor_north_sea_empire_mod: "El Imperio del Mar del Norte"
 STATIC_MODIFIER_DESC_nor_north_sea_empire_mod: "El Imperio del Mar del Norte de Canuto el Grande renace en nuestros días. Toda la costa del Mar del Norte bajo control noruego."
 STATIC_MODIFIER_NAME_nor_norwegian_empire_final_mod: "El Imperio noruego"
 STATIC_MODIFIER_DESC_nor_norwegian_empire_final_mod: "El Imperio noruego, que se extiende de Islandia a Vinland, concluido. Los herederos de los vikingos han superado a sus ancestros."
 STATIC_MODIFIER_NAME_nor_faith_steadfast_mod: "Firme en la fe"
 STATIC_MODIFIER_DESC_nor_faith_steadfast_mod: "La inquebrantable fe católica proclama la autoridad del rey al pueblo con las campanas de la catedral de Nidaros."
 STATIC_MODIFIER_NAME_nor_reform_winds_mod: "Vientos de reforma"
 STATIC_MODIFIER_DESC_nor_reform_winds_mod: "La enseñanza de Lutero se extiende por Noruega."
 STATIC_MODIFIER_NAME_nor_old_gods_calling_mod: "La llamada de los antiguos dioses"
 STATIC_MODIFIER_DESC_nor_old_gods_calling_mod: "La fe en Odín y Thor renace en secreto."
 nor_expel_danish_nobility: "Opónte a Dinamarca"
 nor_expel_danish_nobility_desc: "En 1337, Noruega —reino independiente en unión personal con Suecia bajo el rey Magnus Eriksson— no es vasalla de Dinamarca. Dinamarca es una vecina difícil, y la venidera Unión de Kalmar (1397) amenaza con dar a Dinamarca la dominación de Escandinavia. Establece la posición de Noruega en Escandinavia mediante relaciones claras con Dinamarca ahora: ya sea por rivalidad, alianza o amistad."
 nor_secure_bergen_desc: "El Bryggen —esos coloridos almacenes de madera alineados a lo largo del muelle de Bergen— símbolo de la prosperidad mercantil hanseática. Pero Bergen debe ser una ciudad noruega. Cuando la autoridad del rey se extienda a este puerto, la riqueza del comercio del Atlántico Norte fluirá a manos noruegas."
 nor_develop_stavanger_desc: "Stavanger es una antigua ciudad episcopal en la costa suroeste de Noruega. Como corazón de Rogaland, donde se entrelazan rocas y fiordos, este puerto se convierte en nudo de la pesca del arenque y del comercio del Mar del Norte. Desarróllala como la segunda gran ciudad portuaria de Noruega, después de Bergen."
 nor_develop_oslo_desc: "Oslo, abrigada tras las murallas de la fortaleza de Akershus, es la puerta meridional entre Dinamarca y Suecia. Al este está Suecia; al sur, Dinamarca. Desarrollando Oslo en una ciudad floreciente, la frontera sur de Noruega queda asegurada, y la agricultura y el comercio empiezan a prosperar."
 nor_secure_nidaros_desc: "Nidaros: esta ciudad, construida donde sufrió martirio San Olaf, se alza bajo la mayor catedral gótica de Escandinavia y lleva la historia milenaria del centro espiritual del mundo cristiano del norte. Desarrollar Nidaros es ganar la aprobación de la autoridad del rey noruego tanto por el cielo como por la tierra."
 nor_vinland_desc: "Hace mil años, Leif, hijo de Erik el Rojo, pisó un lejano continente más allá de la niebla: Vinland. Ahora, una nación colonial bajo el estandarte noruego lleva adelante ese sueño. Noruega se inscribe en la historia como la primera nación europea en echar raíces en el Nuevo Mundo."
 nor_colonization_desc: "De Vinland a Groenlandia, de Islandia a las costas árticas: las naciones coloniales noruegas se extienden por el Atlántico Norte. El espíritu vikingo de exploración vive en nuestros días, y Noruega se alza como verdadero imperio marítimo, dominando el mundo más allá de los mares."
 nor_kingdom_of_britain_desc: "Londres, York, Edimburgo: tres grandes ciudades de las Islas Británicas unidas bajo el estandarte noruego. El sueño de Canuto el Grande, realizado de nuevo. La memoria del Danelaw revive en nuestros días, y el Mar del Norte se convierte en el lago de Noruega."
 nor_arctic_trade_desc: "La Península de Kola, tierra helada en el extremo del Ártico, es un tesoro de pieles, caza y marfil de morsa. Los productos árticos, traídos por cazadores sami, generan enorme riqueza como las mejores pieles que busca la nobleza europea. Tomando la Península de Kola, Noruega se convierte en absoluta señora del comercio ártico."
 nor_timber_industry_desc: "Los bosques de Noruega son un don tanto para constructores navales como para constructores. Abeto, pino y abedul, talados de los bosques profundos, junto con las herramientas de hierro forjadas para trabajarlos, forman la columna vertebral industrial de la economía noruega. Cuando el humo de los aserraderos se alza, Noruega se convierte en el mayor exportador de madera de Europa septentrional."
 STATIC_MODIFIER_NAME_nor_timber_mod: "La industria maderera"
 STATIC_MODIFIER_DESC_nor_timber_mod: "Madera y herramientas, forjadas en los ricos bosques de Noruega, sostienen la base industrial."
 STATIC_MODIFIER_NAME_nor_arctic_trade_mod: "Comercio ártico"
 STATIC_MODIFIER_DESC_nor_arctic_trade_mod: "Pieles y caza de la Península de Kola fluyen por toda Europa por medio de los mercaderes noruegos."
 STATIC_MODIFIER_NAME_nor_northern_economy_mod: "La economía del Norte"
 STATIC_MODIFIER_DESC_nor_northern_economy_mod: "El comercio noruego, construido sobre la pesca, la madera, las pieles y el comercio ártico, alcanza el nivel más alto de Europa septentrional. Los costes de mantenimiento de los mercaderes disminuyen, y pueden establecerse más puestos comerciales."
