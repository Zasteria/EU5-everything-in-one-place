l_spanish:
 teu_crusade_path_reform: "Disciplina de la Orden Cruzada"
 teu_crusade_path_reform_desc: "El voto de disciplina impuesto por el Gran Maestre a todos los caballeros monjes al inicio de la Cruzada del Este. El pillaje se convierte en instrumento de una expedición organizada, y el ejército marcha bajo la bandera de la guerra santa."
 teu_northern_crusade_reform: "Régimen de saqueo de la Cruz de Hierro"
 teu_northern_crusade_reform_desc: "Un reinado de terror erigido a la sombra de la cruz. La riqueza se extrae sin piedad de las tierras conquistadas, y quienes se resisten son vendidos como esclavos. Los antiguos ideales de la guerra santa se han desvaído; la Orden ya no es una simple hermandad cruzada, sino un Estado militar construido sobre la conquista y la explotación."
 teu_northern_crusade_reform_loot_tt: "Causa daño de saqueo a las provincias ocupadas (disminuye con el tiempo)"
