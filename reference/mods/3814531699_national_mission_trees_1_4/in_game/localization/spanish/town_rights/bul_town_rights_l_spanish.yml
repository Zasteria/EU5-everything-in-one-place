l_spanish:
 bul_chitalishte_rights: "Ciudad del chitalishte"
 bul_chitalishte_rights_desc: "Una ciudad donde ha echado raíces el movimiento cultural centrado en las “salas de lectura” (chitalishte). La conciencia nacional y la alfabetización se extienden, aunque la atención de los burgueses se vuelve más hacia el saber y la educación que hacia la producción."
