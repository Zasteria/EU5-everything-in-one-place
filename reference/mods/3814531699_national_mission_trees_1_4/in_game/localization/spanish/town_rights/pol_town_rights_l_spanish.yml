l_spanish:
 pol_royal_breadbasket_town_rights: "Panera real polaca"
 pol_royal_breadbasket_town_rights_desc: "Esta ubicación tiene encomendado reunir el grano del reino para su exportación por el Vístula; sus graneros se han ampliado para ello. El grano afluye desde las propiedades de la nobleza y sale hacia los puertos bálticos, y sustenta por igual a ciudadanos y mercaderes."
