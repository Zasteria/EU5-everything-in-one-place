 brb_joyous_entry_rights: "Ciudad de la Entrada Gozosa"
 brb_joyous_entry_rights_desc: "Una ciudad autónoma agraciada con privilegios por el duque. Parte del poder de la corona se transfiere a la propia ciudad, lo que estimula la industria y el desarrollo, al tiempo que refuerza la voz de la ciudad en los estamentos."
