l_spanish:
 som_imperial_breadbasket_town_rights: "Panera imperial otomana"
 som_imperial_breadbasket_town_rights_desc: "Esta ubicación tiene encomendado el abastecimiento de la capital imperial y de los ejércitos del sultán; sus graneros se han ampliado para alimentar a la gran ciudad. El grano afluye bajo la supervisión del Estado y sustenta por igual a ciudadanos y soldados."
