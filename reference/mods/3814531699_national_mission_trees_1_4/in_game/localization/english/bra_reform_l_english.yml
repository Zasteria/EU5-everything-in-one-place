l_english:
 bra_quality_doctrine_reform: "Doctrine of Elite Arms"
 bra_quality_doctrine_reform_desc: "A military doctrine favoring a small, elite force — superior soldiers and skillful levy handling let a smaller army stand against a larger one. Costly to maintain, but unmatched in combat power."
 bra_quantity_doctrine_reform: "Doctrine of Total Mobilization"
 bra_quantity_doctrine_reform_desc: "'Prussia is not a state with an army, but an army with a state' — a doctrine of quantity over quality, crushing the enemy through sheer weight of numbers. Cheap to maintain, though discipline and morale suffer somewhat."
 bra_advanced_quality_doctrine_reform: "Auftragstaktik"
 bra_advanced_quality_doctrine_reform_desc: "'Mission-type tactics' — a doctrine entrusting battlefield commanders with autonomous judgment, enabling swift action suited to the situation. An army of unmatched proficiency across every arm, infantry and artillery alike, establishes overwhelming superiority through quality. Costly in upkeep and manpower, but no army rivals its combat power."
 bra_advanced_quantity_doctrine_reform: "The Nation in Arms"
 bra_advanced_quantity_doctrine_reform_desc: "A doctrine of total national mobilization, arming the entire populace — cheap upkeep, abundant manpower, and vast frontage capacity crush the enemy through sheer numbers. Discipline and morale remain a lingering weakness."
 bra_german_empire_reform: "The Imperial German Constitution"
 bra_german_empire_reform_desc: "A uniquely German structure of governance — a federation of states crowned by an Emperor, blending central authority with federal autonomy. It raises the legitimacy and prestige of the crown, and grants both mastery over trade and flexibility in domestic administration."
