l_english:
 bra_brandenburg_mission_pack: "Blood and Iron — From Brandenburg to the German Empire"
 bra_brandenburg_mission_pack_DESCRIPTION:0 "From the small March of the House of Ascania, build the Kingdom of Prussia under the Hohenzollerns, and achieve German unification through blood and iron."
 bra_brandenburg_mission_pack_CRITERIA_DESCRIPTION:0 "Establish the March, found the Kingdom of Prussia, and complete the German Empire."
 bra_brandenburg_mission_pack_BUTTON_TOOLTIP:0 "From the sandbox of the Holy Roman Empire to the hegemon of Europe."
 bra_brandenburg_mission_pack_BUTTON_DETAILS:0 "The great questions of the day will not be decided by speeches or majority votes, but by blood and iron — unite Germany!"
 bra_ascanian_legacy: "Legacy of the Ascanians"
 bra_ascanian_legacy_desc: "Inherit the Margraviate of Brandenburg built by the House of Ascania, and begin a new age of rule."
 bra_march_authority: "Establish Margravial Authority"
 bra_march_authority_desc: "Curb the fragmented noble lands, and let the Margrave's authority reach across the realm."
 bra_turmoil_ended_tt: "The disaster 'Turmoil in Brandenburg' has ended"
 bra_altmark_secure: "Secure the Altmark"
 bra_altmark_secure_desc: "The Altmark, birthplace of the March — make its rule unshakeable."
 bra_neumark_colonization: "Colonize the Neumark"
 bra_neumark_colonization_desc: "Push eastward colonization into the Neumark beyond the Oder, and build new settlements."
 bra_uckermark_integration: "Integrate the Uckermark"
 bra_uckermark_integration_desc: "Fully incorporate the Uckermark into the Margraviate."
 bra_pomeranian_rivalry: "Rivalry with Pomerania"
 bra_pomeranian_rivalry_desc: "Settle the rivalry with the Duchy of Pomerania over access to the Baltic Sea."
 bra_wendish_lands: "The Wendish Lands"
 bra_wendish_lands_desc: "This land is home to the Kashubians, descendants of the Slavic Wends — embrace their culture with tolerance and deepen their understanding of German ways, showing that the two peoples can coexist."
 bra_berlin_dev: "Develop Berlin"
 bra_berlin_dev_desc: "Berlin, a town on the Spree that grew into the heart of the March after its union with Cölln — develop it further still."
 bra_electoral_dignity: "Electoral Dignity"
 bra_electoral_dignity_desc: "Establish your status as an Elector of the Holy Roman Empire, and raise your prestige within it."
 bra_hohenzollern_investiture: "Hohenzollern Investiture"
 bra_hohenzollern_investiture_desc: "In 1417, Emperor Sigismund granted the Electoral title to the House of Hohenzollern — establish the rule of this new dynasty."
 bra_hohenzollern_dynasty: "The Hohenzollern Dynasty Secured"
 bra_hohenzollern_dynasty_desc: "Make the Hohenzollern bloodline a pillar of the state, and lay the foundation for lasting rule."
 bra_imperial_diet: "Voice in the Imperial Diet"
 bra_imperial_diet_desc: "Strengthen your voice in the Imperial Diet, and take a role in imperial politics."
 bra_reformation_choice: "The Choice of Reformation"
 bra_reformation_choice_desc: "Luther's teachings shake all of Germany — Brandenburg too must choose its faith."
 bra_secularize_prussia: "Secularize Prussia"
 bra_secularize_prussia_desc: "Encourage the secularization of the Teutonic Order's state, and bring Prussia under Brandenburg's influence."
 bra_cleves_inheritance: "The Cleves Inheritance"
 bra_cleves_inheritance_desc: "Win the War of the Jülich Succession on the Rhine, and secure a western exclave."
 bra_thirty_years_war: "Endure the Thirty Years' War"
 bra_thirty_years_war_desc: "The Thirty Years' War ravages Germany — endure this calamity and preserve the March."
 bra_great_elector: "The Reign of the Great Elector"
 bra_great_elector_desc: "Under Frederick William, later known as the 'Great Elector,' rebuild the strength of the state."
 bra_standing_army: "Establish a Standing Army"
 bra_standing_army_desc: "Create a standing army answerable directly to the Elector, not reliant on noble levies."
 bra_absolutism: "Establish Absolutism"
 bra_absolutism_desc: "Curb the power of the Estates, and build a state where the Elector's will reaches every corner."
 bra_sovereign_prussia: "Sovereignty over Prussia"
 bra_sovereign_prussia_desc: "By the Treaty of Oliva, cast off Polish suzerainty over the Duchy of Prussia."
 bra_king_in_prussia: "Crowned King in Prussia"
 bra_king_in_prussia_desc: "In 1701 at Königsberg, Frederick I crowned himself 'King in Prussia.'"
 bra_prussian_administration: "Prussian Administration"
 bra_prussian_administration_desc: "Establish an efficient and disciplined bureaucracy, and walk the path toward a modern state."
 bra_junker_integration: "Integrate the Junkers"
 bra_junker_integration_desc: "Bring the Junker landed nobility east of the Elbe into the core of army and administration."
 bra_potsdam_dev: "Develop Potsdam"
 bra_potsdam_dev_desc: "Develop Potsdam, seat of the royal residence, into a center of court culture."
 bra_soldier_king: "Legacy of the Soldier King"
 bra_soldier_king_desc: "Inherit the frugal, militaristic legacy of Frederick William I, the 'Soldier King.'"
 bra_royal_treasury: "A Full Royal Treasury"
 bra_royal_treasury_desc: "Through frugal fiscal management, build one of the fullest treasuries in Europe."
 bra_silesian_ambition: "Ambitions in Silesia"
 bra_silesian_ambition_desc: "Assert a legitimate claim to rich Silesia, ruled by the House of Habsburg."
 bra_first_silesian_war: "The First Silesian War"
 bra_first_silesian_war_desc: "The young Frederick II marches into Silesia in a lightning invasion."
 bra_silesia_annexed: "Silesia Annexed"
 bra_silesia_annexed_desc: "Fully annex the rich mining and industrial region of Silesia as Prussia's economic foundation."
 bra_prussian_enlightenment: "The Prussian Enlightenment"
 bra_prussian_enlightenment_desc: "Enlightenment thought blossoms under Frederick the Great — embody the ideal that 'the king is the first servant of the state.'"
 bra_seven_years_war: "Endure the Seven Years' War"
 bra_seven_years_war_desc: "The Seven Years' War pits all Europe against you — endure this trial and defend your status as a great power."
 bra_frederick_the_great: "Legacy of Frederick the Great"
 bra_frederick_the_great_desc: "Carry the legacy of the great king remembered as 'Frederick the Great' into the next age."
 bra_partitions_of_poland: "Participate in the Partitions of Poland"
 bra_invasion_of_poland: "Invasion of Poland"
 bra_invasion_of_poland_desc: "March our forces into Greater Poland, and carve away territory from this weakened neighbor."
 bra_partitions_of_poland_desc: "Join in the partitioning of the declining Polish-Lithuanian Commonwealth, and gain West Prussia."
 bra_prussian_academy: "The Prussian Academy of Sciences"
 bra_prussian_academy_desc: "Cultivate the Berlin Academy of Sciences, and become a center of learning and science."
 bra_prussian_army_reform: "Prussian Army Reform"
 bra_prussian_army_reform_desc: "Quality or quantity — define the character of the Prussian army, and root a distinctive military doctrine in the state."
 bra_napoleonic_crisis: "The Napoleonic Crisis"
 bra_napoleonic_crisis_desc: "Defeat at Jena-Auerstedt — before Napoleon, Prussia faces a crisis of survival."
 bra_stein_hardenberg_reforms: "The Stein-Hardenberg Reforms"
 bra_stein_hardenberg_reforms_desc: "The time has come to undermine the fiscal foundations of a France that still outweighs us — through the emancipation of serfs and administrative reform, achieve rebirth from crisis."
 bra_rhineland_acquisition: "Acquire the Rhineland"
 bra_rhineland_acquisition_desc: "Gain the rich territories along the Rhine, and lay the foundation for industrialization."
 bra_show_of_strength: "A Show of Strength"
 bra_show_of_strength_desc: "Before reaching for the great expanses of Germany, demonstrate Prussia's might to the princes of the north."
 bra_lower_saxony_conquest: "Conquer Lower Saxony"
 bra_lower_saxony_conquest_desc: "Defeat our rivals in Lüneburg and Magdeburg, secure the port of Emden in Holstein, and extend our reach across Lower Saxony."
 bra_westphalian_conquest: "Westphalian Conquest"
 bra_westphalian_conquest_desc: "Extend our hegemony over northern Germany further west, into the lands of Westphalia."
 bra_zollverein: "The Zollverein"
 bra_zollverein_desc: "Lead the Zollverein, the customs union that economically unites the German states."
 bra_prussian_constitution: "The Prussian Constitution"
 bra_prussian_constitution_desc: "Establish the framework of constitutional monarchy through the constitution of 1850."
 bra_army_reform_1860s: "Army Reform of the 1860s"
 bra_army_reform_1860s_desc: "The military reforms of Roon and Moltke — refine the military doctrine of quality or quantity chosen earlier to even greater heights."
 bra_danish_war: "War against Denmark"
 bra_danish_war_desc: "Take up arms against Denmark over the Schleswig-Holstein question."
 bra_austro_prussian_war: "The Austro-Prussian War"
 bra_austro_prussian_war_desc: "Settle the matter at the Battle of Königgrätz, and win leadership of Germany."
 bra_north_german_confederation: "The North German Confederation"
 bra_north_german_confederation_desc: "Unite the German states north of the Main, excluding Austria, and found the North German Confederation."
 bra_south_german_states: "Alliance with the South German States"
 bra_south_german_states_desc: "Forge military alliances with the southern German states of Bavaria, Württemberg, and others."
 bra_franco_prussian_war: "The Franco-Prussian War"
 bra_franco_prussian_war_desc: "Provoked by the Ems Dispatch, face the decisive war against the Second French Empire."
 bra_alsace_lorraine_annexed: "Alsace-Lorraine Annexed"
 bra_alsace_lorraine_annexed_desc: "Annex Alsace and Lorraine as spoils of war, etching a lasting enmity with France."
 bra_german_empire: "The German Empire Founded"
 bra_german_empire_desc: "Establish the German Empire, with the King of Prussia as Emperor, as Europe's newest great power."
 bra_kulturkampf: "The Kulturkampf"
 bra_kulturkampf_desc: "Curb the influence of the Catholic Church, and redefine the relationship between state and church."
 bra_social_legislation: "Social Insurance Legislation"
 bra_social_legislation_desc: "Establish sickness, accident, and old-age insurance systems as a countermeasure against socialism."
 bra_colonial_empire: "A Colonial Empire"
 bra_colonial_empire_desc: "Seeking 'a place in the sun,' build colonies in Africa and the Pacific."
 bra_high_seas_fleet: "The High Seas Fleet"
 bra_high_seas_fleet_desc: "Under Admiral Tirpitz's direction, build a High Seas Fleet capable of rivaling Britain."
 bra_weltpolitik: "Weltpolitik"
 bra_weltpolitik_desc: "Under Wilhelm II's banner of 'world policy,' take your place among the world's great powers."
 bra_berlin_metropolis: "Greater Berlin Complete"
 bra_berlin_metropolis_desc: "Develop Berlin into a world city to rival Paris and London."
 bra_ruhr_industry_complete: "Ruhr Industry Complete"
 bra_ruhr_industry_complete_desc: "Push the industrial might of the Ruhr to its limits, becoming one of the world's great heavy-industrial powers."
 bra_german_science: "The Rise of German Science"
 bra_german_science_desc: "Build a golden age of German science, leading the world in physics and chemistry."
 bra_naval_race: "The Naval Race"
 bra_naval_race_desc: "Win the naval arms race with Britain, and demonstrate naval power to rival the world."
 bra_balkan_influence: "Influence in the Balkans"
 bra_balkan_influence_desc: "Through your Austrian ally, expand influence over the Balkan Peninsula."
 bra_ottoman_partnership: "Partnership with the Ottomans"
 bra_ottoman_partnership_desc: "Ally with the 'sick man' of Europe, the Ottoman Empire, as a foothold to the East."
 bra_mitteleuropa: "Mitteleuropa"
 bra_mitteleuropa_desc: "Advance the vision of 'Mitteleuropa,' integrating Central Europe into a German economic sphere."
 bra_grossdeutschland: "Grossdeutschland"
 bra_grossdeutschland_desc: "At last realize the ideal of a 'Greater Germany,' encompassing Austria as well."
 bra_hegemon_of_europe: "Hegemon of Europe"
 bra_hegemon_of_europe_desc: "Establish unrivaled hegemony over Europe in economy, military, and diplomacy alike."
 bra_second_reich_eternal: "The Second Reich, Eternal"
 bra_second_reich_eternal_desc: "From a small frontier march to an empire ruling Europe — the story of the House of Hohenzollern reaches its completion."
 bra_events.1.t: "King in Prussia"
 bra_events.1.d: "On 18 January 1701 at Königsberg, Frederick I crowned himself 'King in Prussia.' The Elector of Brandenburg is now a king in his own right."
 bra_events.1.a: "Long live the King! The Kingdom of Prussia is founded!"
 bra_events.2.t: "The Proclamation at Versailles"
 bra_events.2.d: "On 18 January 1871, in the Hall of Mirrors at Versailles, King Wilhelm I of Prussia was proclaimed German Emperor. The age of division has ended, and a united German Empire is born."
 bra_events.2.a: "Long live the Emperor! Long live the German Empire!"
 bra_events.99.t: "The Second Reich, Eternal"
 bra_events.99.d: "The long road that began with the small March of the House of Ascania has reached its destination. Under the Hohenzollerns, Germany now reigns as an empire without rival in Europe."
 bra_events.99.a: "Glory to Germany! Long live the Second Reich!"
 STATIC_MODIFIER_NAME_bra_ascanian_mod: "Legacy of the Ascanians"
 STATIC_MODIFIER_DESC_bra_ascanian_mod: "The memory of the Ascanians, whose bear crest once marked the marches, remains carved into the stones of the border castles."
 STATIC_MODIFIER_NAME_bra_march_mod: "Margravial Authority Established"
 STATIC_MODIFIER_DESC_bra_march_mod: "Proclamations stamped with the Margrave's seal travel from manor to manor, and even the lords now obey."
 STATIC_MODIFIER_NAME_bra_altmark_mod: "Altmark Defended"
 STATIC_MODIFIER_DESC_bra_altmark_mod: "The defenses of the Altmark, birthplace of the March, have been strengthened."
 STATIC_MODIFIER_NAME_bra_neumark_mod: "Neumark Colonized"
 STATIC_MODIFIER_DESC_bra_neumark_mod: "Beyond the Oder, German settlers drive their ploughs into the wilds of the Neumark."
 STATIC_MODIFIER_NAME_bra_pomerania_mod: "Rivalry with Pomerania"
 STATIC_MODIFIER_DESC_bra_pomerania_mod: "The long feud with the dukes of Pomerania taught the lords of the marches how to govern conquered land."
 STATIC_MODIFIER_NAME_bra_uckermark_mod: "Uckermark Integrated"
 STATIC_MODIFIER_DESC_bra_uckermark_mod: "The grain lands of the Uckermark now appear in the ledgers of the Margrave's tax collectors."
 STATIC_MODIFIER_NAME_bra_berlin_mod: "Berlin Developed"
 STATIC_MODIFIER_DESC_bra_berlin_mod: "Berlin flourishes as the heart of the March."
 STATIC_MODIFIER_NAME_bra_electoral_mod: "Electoral Dignity"
 STATIC_MODIFIER_DESC_bra_electoral_mod: "Envoys bearing the seal of an Elector now take their seats beside the princes at the emperor's court."
 STATIC_MODIFIER_NAME_bra_hohenzollern_mod: "Hohenzollern Investiture"
 STATIC_MODIFIER_DESC_bra_hohenzollern_mod: "A family born of the Burgraves of Nuremberg now raises the banner of a new dynasty in the castles of Brandenburg."
 STATIC_MODIFIER_NAME_bra_dynasty_mod: "Dynasty Secured"
 STATIC_MODIFIER_DESC_bra_dynasty_mod: "The Hohenzollern bloodline is now acknowledged as an unquestioned authority in the border castles and at court alike."
 STATIC_MODIFIER_NAME_bra_diet_mod: "Voice in the Diet"
 STATIC_MODIFIER_DESC_bra_diet_mod: "At the Imperial Diet in Regensburg, the princes listen closely when the envoy of Brandenburg speaks."
 STATIC_MODIFIER_NAME_bra_reformation_mod: "Choice of Reformation"
 STATIC_MODIFIER_DESC_bra_reformation_mod: "Under an Elector who embraced Luther's teaching, his subjects are learning tolerance for differences of faith."
 STATIC_MODIFIER_NAME_bra_secularize_mod: "Prussia Secularized"
 STATIC_MODIFIER_DESC_bra_secularize_mod: "The revenues of lands that were once bishoprics are now managed by the Elector's own officials."
 STATIC_MODIFIER_NAME_bra_cleves_mod: "The Cleves Inheritance"
 STATIC_MODIFIER_DESC_bra_cleves_mod: "The western exclave of Cleves brings new wealth to the treasury."
 STATIC_MODIFIER_NAME_bra_thirty_years_mod: "Trial of the Thirty Years' War"
 STATIC_MODIFIER_DESC_bra_thirty_years_mod: "The experience of enduring war has become the key to homeland defense."
 STATIC_MODIFIER_NAME_bra_great_elector_mod: "Reign of the Great Elector"
 STATIC_MODIFIER_DESC_bra_great_elector_mod: "The name of the Great Elector, victor of Fehrbellin, has become the very authority of the dynasty."
 STATIC_MODIFIER_NAME_bra_standing_army_mod: "Standing Army Created"
 STATIC_MODIFIER_DESC_bra_standing_army_mod: "Soldiers of the standing army, sworn to the Elector alone, drill day after day on the parade grounds of Potsdam."
 STATIC_MODIFIER_NAME_bra_absolutism_mod: "Absolutism Established"
 STATIC_MODIFIER_DESC_bra_absolutism_mod: "The king's commands now travel from the court at Berlin to the village halls of every corner of the state."
 STATIC_MODIFIER_NAME_bra_sovereign_mod: "Prussian Sovereignty"
 STATIC_MODIFIER_DESC_bra_sovereign_mod: "The Duke of Prussia, who cast off the homage once owed to the Polish king, is now received at foreign courts as an equal sovereign."
 STATIC_MODIFIER_NAME_bra_administration_mod: "Prussian Administration"
 STATIC_MODIFIER_DESC_bra_administration_mod: "The ledgers and regulations drawn up by the clerks of the General Directory hold up the administration of every corner of the kingdom."
 STATIC_MODIFIER_NAME_bra_junker_mod: "Junkers Integrated"
 STATIC_MODIFIER_DESC_bra_junker_mod: "The Junkers now function as the core of army and administration."
 STATIC_MODIFIER_NAME_bra_potsdam_mod: "Potsdam Developed"
 STATIC_MODIFIER_DESC_bra_potsdam_mod: "The royal residence of Potsdam flourishes as a center of court culture."
 STATIC_MODIFIER_NAME_bra_soldier_king_mod: "Legacy of the Soldier King"
 STATIC_MODIFIER_DESC_bra_soldier_king_mod: "The frugality and strict discipline bequeathed by the Soldier King still cling to the very walls of the barracks."
 STATIC_MODIFIER_NAME_bra_treasury_mod: "A Full Treasury"
 STATIC_MODIFIER_DESC_bra_treasury_mod: "In the thrifty royal vaults, chests of silver for the wars ahead are stacked high."
 STATIC_MODIFIER_NAME_bra_silesian_ambition_mod: "Ambitions in Silesia"
 STATIC_MODIFIER_DESC_bra_silesian_ambition_mod: "Officers who dream of the fertile valleys of Silesia wait impatiently for the order to march."
 STATIC_MODIFIER_NAME_bra_first_silesian_mod: "The First Silesian War"
 STATIC_MODIFIER_DESC_bra_first_silesian_mod: "Marching like lightning through the snow, the army stood at the gates of Breslau before Austria had even finished mobilizing."
 STATIC_MODIFIER_NAME_bra_silesia_mod: "Silesia Annexed"
 STATIC_MODIFIER_DESC_bra_silesia_mod: "The wealth born of Silesia's furnaces and looms flows ceaselessly into the treasury at Berlin."
 STATIC_MODIFIER_NAME_bra_enlightenment_mod: "The Prussian Enlightenment"
 STATIC_MODIFIER_DESC_bra_enlightenment_mod: "The ideals of the Enlightenment, spreading from the court of Sanssouci, are multiplying the schools in the villages."
 STATIC_MODIFIER_NAME_bra_seven_years_mod: "Trial of the Seven Years' War"
 STATIC_MODIFIER_DESC_bra_seven_years_mod: "The experience of fighting all Europe has forged military discipline."
 STATIC_MODIFIER_NAME_bra_frederick_mod: "Legacy of Frederick the Great"
 STATIC_MODIFIER_DESC_bra_frederick_mod: "The name of Frederick the Great is passed down both as the pride of the soldier and as the glory of the state."
 STATIC_MODIFIER_NAME_bra_partitions_mod: "The Partitions of Poland"
 STATIC_MODIFIER_DESC_bra_partitions_mod: "Prussian officials and surveyors move one after another into the villages of West Prussia won in the partitions."
 STATIC_MODIFIER_NAME_bra_academy_mod: "The Prussian Academy"
 STATIC_MODIFIER_DESC_bra_academy_mod: "The lectures of the scholars gathered at the academy in Berlin draw students from across the land."
 STATIC_MODIFIER_NAME_bra_invasion_poland_mod: "Invasion of Poland"
 STATIC_MODIFIER_DESC_bra_invasion_poland_mod: "German signboards and offices rise one after another in the conquered towns of Greater Poland."
 STATIC_MODIFIER_NAME_bra_napoleonic_mod: "The Napoleonic Crisis"
 STATIC_MODIFIER_DESC_bra_napoleonic_mod: "The experience of overcoming crisis becomes the foundation of homeland defense."
 STATIC_MODIFIER_NAME_bra_reforms_mod: "The Stein-Hardenberg Reforms"
 STATIC_MODIFIER_DESC_bra_reforms_mod: "The reforms of Stein and Hardenberg freed the peasant from serfdom and opened the doors of the civil service."
 STATIC_MODIFIER_NAME_bra_rhineland_mod: "The Rhineland Acquired"
 STATIC_MODIFIER_DESC_bra_rhineland_mod: "The taxes rising from the rich towns and coal mines along the Rhine delight the treasurers at Berlin."
 STATIC_MODIFIER_NAME_bra_show_of_strength_mod: "A Show of Strength"
 STATIC_MODIFIER_DESC_bra_show_of_strength_mod: "The princes of northern Germany, having seen the array of troops on the Berlin parade ground, withdrew with few words."
 STATIC_MODIFIER_NAME_bra_lower_saxony_mod: "Lower Saxony Conquered"
 STATIC_MODIFIER_DESC_bra_lower_saxony_mod: "The Prussian army's victory on the plains of Hanover redrew the map of northern Germany."
 STATIC_MODIFIER_NAME_bra_westphalia_mod: "Westphalia Conquered"
 STATIC_MODIFIER_DESC_bra_westphalia_mod: "The burgomasters of the Westphalian towns have begun to follow the instructions of the officials in Berlin."
 STATIC_MODIFIER_NAME_bra_zollverein_mod: "The Zollverein"
 STATIC_MODIFIER_DESC_bra_zollverein_mod: "At the borders of the customs union, wagons pass through without waiting for the toll bar to lift."
 STATIC_MODIFIER_NAME_bra_constitution_mod: "The Prussian Constitution"
 STATIC_MODIFIER_DESC_bra_constitution_mod: "The roles of parliament and monarch set down in the articles of the constitution have brought a new order to the practice of politics."
 STATIC_MODIFIER_NAME_bra_danish_war_mod: "War against Denmark"
 STATIC_MODIFIER_DESC_bra_danish_war_mod: "The triumphant return of the Prussian soldiers who stormed the trenches at Düppel hastened the union of Schleswig and Holstein."
 STATIC_MODIFIER_NAME_bra_austro_prussian_war_mod: "The Austro-Prussian War"
 STATIC_MODIFIER_DESC_bra_austro_prussian_war_mod: "On the field of Königgrätz, the breech-loading rifle overturned everything that soldiers took to be the rules of war."
 STATIC_MODIFIER_NAME_bra_north_confederation_mod: "North German Confederation"
 STATIC_MODIFIER_DESC_bra_north_confederation_mod: "On the day the flag of the North German Confederation first flew over the palace at Berlin, the envoys of the states knew a new era had begun."
 STATIC_MODIFIER_NAME_bra_south_german_mod: "Alliance with the South"
 STATIC_MODIFIER_DESC_bra_south_german_mod: "Envoys keeping the pact with Prussia now pass to and fro even at the courts of Bavaria and Württemberg."
 STATIC_MODIFIER_NAME_bra_franco_prussian_mod: "The Franco-Prussian War"
 STATIC_MODIFIER_DESC_bra_franco_prussian_mod: "On the night the news of victory at Sedan reached Berlin, every street was wrapped in cheering."
 STATIC_MODIFIER_NAME_bra_alsace_mod: "Alsace-Lorraine Annexed"
 STATIC_MODIFIER_DESC_bra_alsace_mod: "The smokestacks of the Alsatian textile mills and iron mines drive the industry of the new German Empire."
 STATIC_MODIFIER_NAME_bra_kulturkampf_mod: "The Kulturkampf"
 STATIC_MODIFIER_DESC_bra_kulturkampf_mod: "The new institutions shaped in the wake of the struggle between state and church have redrawn the boundaries between the offices of the state and the parishes."
 STATIC_MODIFIER_NAME_bra_social_mod: "Social Insurance Legislation"
 STATIC_MODIFIER_DESC_bra_social_mod: "Workers queuing at the counters for sickness insurance and old-age pensions know the state will not forsake them."
 STATIC_MODIFIER_NAME_bra_colonial_mod: "A Colonial Empire"
 STATIC_MODIFIER_DESC_bra_colonial_mod: "On the decks of steamers bound for the colonies of Africa and the South Seas stand emigrants dreaming of a new world."
 STATIC_MODIFIER_NAME_bra_fleet_mod: "The High Seas Fleet"
 STATIC_MODIFIER_DESC_bra_fleet_mod: "From the funnels of the ironclads lined up in the naval harbor at Kiel rises the smoke of a resolve to guard the trade routes."
 STATIC_MODIFIER_NAME_bra_weltpolitik_mod: "Weltpolitik"
 STATIC_MODIFIER_DESC_bra_weltpolitik_mod: "The maps in the foreign ministry at Berlin now reflect a world policy stretching from Africa to Asia."
 STATIC_MODIFIER_NAME_bra_berlin_metropolis_mod: "Greater Berlin Complete"
 STATIC_MODIFIER_DESC_bra_berlin_metropolis_mod: "The world city of Berlin shines as a center of prosperity and governance."
 STATIC_MODIFIER_NAME_bra_ruhr_complete_mod: "Ruhr Industry Complete"
 STATIC_MODIFIER_DESC_bra_ruhr_complete_mod: "The blast furnaces of the Ruhr belch fire day and night, sending German steel out to the world."
 STATIC_MODIFIER_NAME_bra_science_mod: "The Rise of German Science"
 STATIC_MODIFIER_DESC_bra_science_mod: "Discoveries born in the laboratories of Göttingen and Berlin have made Germany the center of the world's science."
 STATIC_MODIFIER_NAME_bra_naval_race_mod: "The Naval Race"
 STATIC_MODIFIER_DESC_bra_naval_race_mod: "On the slipways at Wilhelmshaven, the keel of the next battleship is already laid."
 STATIC_MODIFIER_NAME_bra_balkan_mod: "Influence in the Balkans"
 STATIC_MODIFIER_DESC_bra_balkan_mod: "The affairs of the Balkans, discussed daily by the diplomats of Vienna and Berlin, are knitting the two allies ever closer together."
 STATIC_MODIFIER_NAME_bra_ottoman_mod: "Partnership with the Ottomans"
 STATIC_MODIFIER_DESC_bra_ottoman_mod: "With every mile of the Baghdad Railway laid, the bond between Berlin and Constantinople deepens."
 STATIC_MODIFIER_NAME_bra_mitteleuropa_mod: "Mitteleuropa"
 STATIC_MODIFIER_DESC_bra_mitteleuropa_mod: "The vision of a single economic sphere in Central Europe is spreading quietly even among the merchants and officials of neighboring lands."
 STATIC_MODIFIER_NAME_bra_grossdeutschland_mod: "Grossdeutschland"
 STATIC_MODIFIER_DESC_bra_grossdeutschland_mod: "'What is the German's fatherland?' — the old question sung from Vienna to Berlin at last finds its answer."
 STATIC_MODIFIER_NAME_bra_hegemon_mod: "Hegemon of Europe"
 STATIC_MODIFIER_DESC_bra_hegemon_mod: "No court in Europe can any longer reach an important decision without first learning the wishes of Berlin."
 STATIC_MODIFIER_NAME_bra_king_in_prussia_mod: "King in Prussia"
 STATIC_MODIFIER_DESC_bra_king_in_prussia_mod: "From the day of the coronation in the castle church of Königsberg, the Prussian court set about shaping the ceremonies of a kingdom."
 STATIC_MODIFIER_NAME_bra_second_reich_mod: "The Second Reich, Eternal"
 STATIC_MODIFIER_DESC_bra_second_reich_mod: "From the proclamation that rang through the Hall of Mirrors at Versailles, the Hohenzollern crown has risen to shine at the summit of Europe."
