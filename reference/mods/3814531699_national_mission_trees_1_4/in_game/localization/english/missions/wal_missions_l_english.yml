l_english:
 wal_wallachia_mission_pack: "Order of the Dragon — Guardian of the Danube"
 wal_wallachia_mission_pack_DESCRIPTION:0 "Wallachia, wedged between the Carpathian Mountains and the Danube. Tame the boyar nobility and unite the Romanian principalities alongside Moldavia and Transylvania, or take up the banner of the Order of the Dragon and wage war on the Ottoman Empire to build a Danubian empire."
 wal_wallachia_mission_pack_CRITERIA_DESCRIPTION:0 "Strengthen the voivodeship, unite the Romanian principalities, and defeat the Ottoman Empire to complete a Danubian empire."
 wal_wallachia_mission_pack_BUTTON_TOOLTIP:0 "Carry on the will of the Impaler, and become guardian of the Danube."
 wal_wallachia_mission_pack_BUTTON_DETAILS:0 "'We are the children of the Dragon' — wolves of the Carpathians, raise the cross!"
 wal_voivode_beginnings: "Dawn of the Voivodeship"
 wal_voivode_beginnings_desc: "In 1330, Basarab I turned back the King of Hungary at the Battle of Posada — inherit his spirit of independence, and lay the foundations of a new principality between the Carpathians and the Danube."
 wal_voivode_authority: "Authority of the Voivode"
 wal_voivode_authority_desc: "The Voivode's throne, chosen by acclamation of the boyar nobility — secure this authority, and prevent the chaos of disputed succession."
 wal_boyar_council: "The Boyar Council"
 wal_boyar_council_desc: "The assembly of great landholding boyars — without their support, Wallachia cannot be governed. Stabilize relations with the council."
 wal_found_bucharest: "Found Bucharest"
 wal_found_bucharest_desc: "Giurgiu, near the Danube — where the Voivode has held his summer court. Develop this place as 'Bucureşti,' a bastion of southern defense and trade."
 wal_targoviste_dev: "Develop Târgovişte"
 wal_targoviste_dev_desc: "Târgovişte, the old capital built at the foot of the Carpathians, seat of generations of Voivodes — bring further prosperity to this city."
 wal_fortify_carpathians: "Fortify the Carpathians"
 wal_fortify_carpathians_desc: "The Carpathian Mountains, stretching from south to north — layer this natural rampart with man-made fortresses, building a line of defense no invader can breach."
 wal_orthodox_church: "Protect the Orthodox Church"
 wal_orthodox_church_desc: "The Orthodox Church, heir to the Byzantine faith — stand at the head of its autocephalous patriarchate, and lend religious legitimacy to the Voivode's authority."
 wal_dregatori: "Appoint Dregatori"
 wal_dregatori_desc: "The tyranny of hereditary nobles is the enemy of the state. Appoint 'dregatori' — officials chosen for skill rather than lineage — and build an administration loyal to the crown."
 wal_unite_voivodes: "Unite the Voivodes"
 wal_unite_voivodes_desc: "Wallachia and Moldavia — two Romanian principalities, yet still divided, their rivalry serving none but our enemies. Any power holding a foothold in Moldavia may now stake a rightful claim upon the whole of that land."
 wal_subdue_moldavia: "Subdue Moldavia"
 wal_subdue_moldavia_desc: "The glory of Stephen the Great now belongs to the past — bring the Principality of Moldavia under Wallachian rule, and lay the cornerstone of Romanian unity."
 wal_conquer_transylvania: "Conquer Transylvania"
 wal_conquer_transylvania_desc: "Transylvania, long ruled by the kings of Hungary and their successors — bring this land into Wallachia's domain, and put an end to outside interference."
 wal_szekely_land: "Land of the Székelys"
 wal_szekely_land_desc: "The Székelys, a warrior people of eastern Transylvania — respect their autonomy and martial tradition, and make their valor Wallachia's strength."
 wal_saxon_towns: "Integrate the Saxon Towns"
 wal_saxon_towns_desc: "Braşov, Sibiu, and the other Saxon towns of Transylvania — make these cities, prosperous since medieval times, the pillar of the kingdom's economy."
 wal_secure_danube: "Secure the Danube"
 wal_secure_danube_desc: "The great river Danube, dividing the Balkans from the Carpathians — secure its banks as a lifeline of southern defense and trade."
 wal_carpathian_hegemony: "Carpathian Hegemony Complete"
 wal_carpathian_hegemony_desc: "The time has come for all the land between the Carpathians and the Danube to submit to the Voivode's authority."
 wal_romanian_unity: "Romanian Unity Complete"
 wal_romanian_unity_desc: "Wallachia, Moldavia, Transylvania — unite the long-divided lands of the Romanian people under a single crown at last."
 wal_order_of_dragon_founding: "Join the Order of the Dragon"
 wal_order_of_dragon_founding_desc: "Holy Roman Emperor Sigismund is founding the Order of the Dragon upon the ideal of crusade against the Ottomans — let our own ruler take his place among this illustrious fellowship."
 wal_impale_the_sultan: "Impale the Sultan"
 wal_impale_the_sultan_desc: "The Sultan believes himself safe, hiding behind his walls and his legions. On the battlefield against the armies of Islam, let him learn in his own flesh that none can hide from divine judgment."
 wal_drive_out_turks: "Drive out the Turks"
 wal_drive_out_turks_desc: "The time has come to liberate the Greek and Bulgarian peoples from oppression. Drive the Turkish invaders back to the far shore of the Bosphorus."
 wal_liberate_serbia: "Liberate Serbia"
 wal_liberate_serbia_desc: "Our Serbian brethren, suffering under the Ottoman yoke since the defeat at Kosovo — liberate them, and become guardian of Orthodox Balkans."
 wal_reclaim_morea: "Reclaim the Morea"
 wal_reclaim_morea_desc: "The Despotate of the Morea, where Byzantium's last light once burned — reclaim this corner of the Peloponnese from infidel hands."
 wal_heir_of_rome: "Heir of Rome"
 wal_heir_of_rome_desc: "What the Byzantine Empire never achieved — the total defeat and expulsion of the infidel from Europe — we have accomplished. None is more deserving of Rome's mantle than we."
 wal_bulwark_of_christendom: "Bulwark of Christendom"
 wal_bulwark_of_christendom_desc: "The Romanian principalities are the bulwark of Christendom. Fortifying our borders is our duty before God."
 wal_ottoman_downfall: "The Ottomans' Downfall"
 wal_ottoman_downfall_desc: "The Ottoman Empire, once dominant across the Balkans and the Middle East — its threat has at last been consigned to history."
 wal_reclaim_constantinople: "Reclaim Constantinople"
 wal_reclaim_constantinople_desc: "Constantinople, long fallen to the infidel — as heirs of the Order of the Dragon, liberate this imperial city."
 wal_danubian_empire: "The Danubian Empire Complete"
 wal_danubian_empire_desc: "From the Carpathians to the Balkans, and on to the Bosphorus — this struggle, begun with the Impaler's vengeance, ends with the completion of a great empire ruling the Danube."
 wal_danube_trade: "Danube Trade Route"
 wal_danube_trade_desc: "The trade route linking Western Europe and the Black Sea along the Danube — draw this flow of wealth into Wallachia's treasury."
 wal_treasury: "Build a Treasury"
 wal_treasury_desc: "War, diplomacy, the upkeep of the court — every affair of state demands gold. Build a full treasury, and prepare for any hardship."
 wal_manufactories: "Develop Manufactories"
 wal_manufactories_desc: "A great transformation is underway in the field of production — invest without hesitation in manufactories, and prepare for an age of industry."
 wal_events.2.t: "Constantinople Reclaimed"
 wal_events.2.d: "The great imperial city of Constantinople has fallen into our hands at last. The banner of the Order of the Dragon now flies over this city, once held by the infidel."
 wal_events.2.a: "The city of Rome is ours!"
 wal_events.99.t: "Declaration of the Danubian Empire"
 wal_events.99.d: "A small principality at the foot of the Carpathians has been reborn as a great empire ruling the Danube and the Balkans. The Impaler's will has, at last, been fully realized."
 wal_events.99.a: "Glory to the Danubian Empire!"
 STATIC_MODIFIER_NAME_wal_voivode_beginnings_mod: "Dawn of the Voivodeship"
 STATIC_MODIFIER_DESC_wal_voivode_beginnings_mod: "The memory of the day Basarab I refused to kneel to a foreign overlord is the pride of Wallachia's soldiers."
 STATIC_MODIFIER_NAME_wal_voivode_mod: "Authority of the Voivode"
 STATIC_MODIFIER_DESC_wal_voivode_mod: "The Voivode's throne is stable, and confidence in the succession has grown."
 STATIC_MODIFIER_NAME_wal_boyar_mod: "The Boyar Council"
 STATIC_MODIFIER_DESC_wal_boyar_mod: "Relations with the boyar nobility are stable, strengthening the foundation of governance."
 STATIC_MODIFIER_NAME_wal_bucharest_mod: "Bucharest Founded"
 STATIC_MODIFIER_DESC_wal_bucharest_mod: "Giurgiu has been developed as 'Bucureşti,' a bastion of the south."
 STATIC_MODIFIER_NAME_wal_targoviste_mod: "Târgovişte Developed"
 STATIC_MODIFIER_DESC_wal_targoviste_mod: "The old capital of Târgovişte continues to prosper."
 STATIC_MODIFIER_NAME_wal_carpathians_mod: "The Carpathian Fortress Network"
 STATIC_MODIFIER_DESC_wal_carpathians_mod: "A network of fortresses in the mountains repels any invader."
 STATIC_MODIFIER_NAME_wal_church_mod: "Protection of the Orthodox Church"
 STATIC_MODIFIER_DESC_wal_church_mod: "The Wallachian Orthodox Church stands under state protection, raising religious legitimacy."
 STATIC_MODIFIER_NAME_wal_impale_mod: "Impale the Sultan"
 STATIC_MODIFIER_DESC_wal_impale_mod: "The rumor of the row of stakes set before the sultan's envoys still chills the hearts of the armies of Islam."
 STATIC_MODIFIER_NAME_wal_dregatori_mod: "The Dregatori Appointed"
 STATIC_MODIFIER_DESC_wal_dregatori_mod: "Officials chosen for skill now sustain a loyal administration."
 STATIC_MODIFIER_NAME_wal_moldavia_mod: "Moldavia Subdued"
 STATIC_MODIFIER_DESC_wal_moldavia_mod: "The Principality of Moldavia has been brought under Wallachian rule."
 STATIC_MODIFIER_NAME_wal_transylvania_mod: "Transylvania Conquered"
 STATIC_MODIFIER_DESC_wal_transylvania_mod: "Transylvania has been brought into Wallachia's domain."
 STATIC_MODIFIER_NAME_wal_szekely_mod: "Székely Valor"
 STATIC_MODIFIER_DESC_wal_szekely_mod: "The mountain warriors of the Székely lands set their spears in line beneath the banners of Wallachia."
 STATIC_MODIFIER_NAME_wal_saxon_mod: "Prosperity of the Saxon Towns"
 STATIC_MODIFIER_DESC_wal_saxon_mod: "The Saxon towns of Transylvania have become the pillar of the kingdom's economy."
 STATIC_MODIFIER_NAME_wal_danube_mod: "The Danube Secured"
 STATIC_MODIFIER_DESC_wal_danube_mod: "The banks of the Danube are secured, opening a lifeline of trade."
 STATIC_MODIFIER_NAME_wal_hegemony_mod: "Carpathian Hegemony"
 STATIC_MODIFIER_DESC_wal_hegemony_mod: "The land between the Carpathians and the Danube fully submits to the Voivode's authority."
 STATIC_MODIFIER_NAME_wal_unity_mod: "Romanian Unity"
 STATIC_MODIFIER_DESC_wal_unity_mod: "Wallachia, Moldavia, and Transylvania are united under a single crown."
 STATIC_MODIFIER_NAME_wal_order_of_dragon_mod: "Member of the Order of the Dragon"
 STATIC_MODIFIER_DESC_wal_order_of_dragon_mod: "Envoys wearing the badge of the Order of the Dragon travel the courts of Christendom, widening the circle of alliance against the Ottomans."
 STATIC_MODIFIER_NAME_wal_drive_out_mod: "The Turks Driven Out"
 STATIC_MODIFIER_DESC_wal_drive_out_mod: "War against the infidel has proven the strength of our army."
 STATIC_MODIFIER_NAME_wal_serbia_mod: "Serbia Liberated"
 STATIC_MODIFIER_DESC_wal_serbia_mod: "Our Serbian brethren are freed, raising our standing across the Orthodox Balkans."
 STATIC_MODIFIER_NAME_wal_morea_mod: "The Morea Reclaimed"
 STATIC_MODIFIER_DESC_wal_morea_mod: "Loads of wine and silk from the ports of the Peloponnese fill the storehouses of Wallachian merchants."
 STATIC_MODIFIER_NAME_wal_heir_of_rome_mod: "Heir of Rome"
 STATIC_MODIFIER_DESC_wal_heir_of_rome_mod: "At the Wallachian court, which claims succession to the Byzantine emperors, clergy and nobles alike bow their heads, doubting not its legitimacy."
 STATIC_MODIFIER_NAME_wal_bulwark_mod: "Bulwark of Christendom"
 STATIC_MODIFIER_DESC_wal_bulwark_mod: "A network of border fortresses now serves as a shield for Christendom."
 STATIC_MODIFIER_NAME_wal_downfall_mod: "The Ottomans' Downfall"
 STATIC_MODIFIER_DESC_wal_downfall_mod: "On borders no longer haunted by Ottoman raids, soldiers proudly show one another the drill they have honed."
 STATIC_MODIFIER_NAME_wal_manufactories_mod: "Manufactories Developed"
 STATIC_MODIFIER_DESC_wal_manufactories_mod: "From the chimneys of the workshops of Bucharest rises the ceaseless smoke of new cloth and tools in the making."
 STATIC_MODIFIER_NAME_wal_trade_mod: "The Danube Trade Route"
 STATIC_MODIFIER_DESC_wal_trade_mod: "A trading network along the Danube protects the state's wealth."
 STATIC_MODIFIER_NAME_wal_treasury_mod: "A Full Treasury"
 STATIC_MODIFIER_DESC_wal_treasury_mod: "Chests of silver coin are stacked in the palace vaults, and merchants trade without doubting the weight of the coin."
 STATIC_MODIFIER_NAME_wal_danubian_empire_mod: "The Danubian Empire's Web of Rule"
 STATIC_MODIFIER_DESC_wal_danubian_empire_mod: "The Danube itself has become the lifeblood of the empire, its waters carrying armies upstream and down with ease. The dynasty's legitimacy stands unshaken, and the power of the crown reaches into every corner of the realm."
