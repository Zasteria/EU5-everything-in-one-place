l_english:
 eth_ethiopia_mission_pack: "The New Solomonic Empire — A Cross Shining on the Horn of Africa"
 eth_ethiopia_mission_pack_DESCRIPTION:0 "Under a dynasty said to descend from the Queen of Sheba and King Solomon, contend with the Mamluks as protector of the Copts, prevail in the death struggle with Adal, and revive the glory of Aksum to build a new empire."
 eth_ethiopia_mission_pack_CRITERIA_DESCRIPTION:0 "Establish the empire, claim hegemony over the Horn of Africa, protect the Copts, and revive the glory of Aksum."
 eth_ethiopia_mission_pack_BUTTON_TOOLTIP:0 "From a highland fortress to an empire shining on the Red Sea."
 eth_ethiopia_mission_pack_BUTTON_DETAILS:0 "'King of Kings, Lion of Judah' — as heir to the Queen of Sheba, build a new Solomonic Empire!"
 eth_negus_authority: "Establish the Authority of the Negus Negast"
 eth_negus_authority_desc: "'King of Kings' — the title of Negus Negast. Let this authority reach every corner of the realm."
 eth_amba_geshen: "The Prison of Amba Geshen"
 eth_amba_geshen_desc: "To prevent succession disputes, royal princes are confined to the natural fortress of Amba Geshen — establish this custom as institution."
 eth_mobile_court: "The Itinerant Court of Ethiopia"
 eth_mobile_court_desc: "With no fixed capital, the Emperor and his army traverse the realm in a moving camp (ketema) — establish this unique style of governance as an institution of state."
 eth_coptic_church: "Protect the Ethiopian Orthodox Church"
 eth_coptic_church_desc: "The Ethiopian Orthodox Church, under the authority of Alexandria — make its faith a pillar of the state, and become protector of the Copts."
 eth_gondar_founding: "Develop Gondar"
 eth_gondar_founding_desc: "Gondar, called 'the Camelot of Africa' — develop it into a great walled city of stone."
 eth_royal_chronicle: "Compile the Royal Chronicles"
 eth_royal_chronicle_desc: "Inherit the spirit of the 'Kebra Nagast,' the chronicle recording the deeds of past emperors, and cultivate a tradition of scholarship and record-keeping."
 eth_feudal_levies: "The Feudal Levy System"
 eth_feudal_levies_desc: "Establish Ethiopia's unique feudal military system, in which regional lords lead troops at the Emperor's summons."
 eth_negus_dynasty: "The Solomonic Dynasty Secured"
 eth_negus_dynasty_desc: "With the church, chronicles, military system, and capital all in place, make the rule of the Solomonic dynasty unshakeable."
 eth_oromo_migration: "The Oromo Migrations"
 eth_oromo_migration_desc: "In the 16th century, the Oromo peoples begin a great migration — respond to this historic movement of peoples."
 eth_agaw_people: "Govern the Agaw"
 eth_agaw_people_desc: "The Agaw, ancient inhabitants of the Ethiopian highlands — govern them as subjects of the empire while respecting their culture."
 eth_beta_israel: "Coexistence with Beta Israel"
 eth_beta_israel_desc: "Beta Israel, the Ethiopian Jews also known as 'Falasha' — build a path of coexistence with them."
 eth_horn_hegemony: "Hegemony over the Horn of Africa"
 eth_horn_hegemony_desc: "As an empire uniting the Sidama, Oromo, Agaw, and Beta Israel, claim hegemony over the Horn of Africa."
 eth_nubian_alliance: "Alliance with Nubia"
 eth_nubian_alliance_desc: "Makuria and Alodia, the Coptic states to the north — forge alliances with these brethren of the same faith."
 eth_conquer_makuria: "Annex Makuria"
 eth_conquer_makuria_desc: "Makuria, the Coptic kingdom that once flourished along the Nile — protect or annex this now-declining state."
 eth_conquer_alodia: "Annex Alodia"
 eth_conquer_alodia_desc: "Alodia, the Coptic kingdom of southern Nubia — bring this land into Ethiopia's domain."
 eth_sudan_dominion: "Establish Dominion over Sudan"
 eth_sudan_dominion_desc: "From the Nile valley to the Nubian desert — establish Ethiopian dominion over this vast land."
 eth_mamluk_rivalry: "Rivalry with the Mamluks"
 eth_mamluk_rivalry_desc: "The Mamluk Sultanate ruling Egypt — as protector of the Copts, settle the rivalry with them."
 eth_liberate_jerusalem: "Liberate Jerusalem"
 eth_liberate_jerusalem_desc: "The Holy City of Jerusalem — liberate this land to protect the worship rights of the Copts."
 eth_coptic_patriarchate: "Command the Coptic Patriarchate"
 eth_coptic_patriarchate_desc: "The Coptic Patriarchate of Alexandria — bring its authority under Ethiopian control."
 eth_protector_of_copts: "Protector of the Copts"
 eth_protector_of_copts_desc: "To Copts scattered across the world, the Ethiopian Emperor is their last protector — fulfill this role."
 eth_adal_wars: "The Adal Wars"
 eth_adal_wars_desc: "The Adal Sultanate, the Islamic state on the Red Sea coast — face war with this longtime rival."
 eth_conquer_zeila: "Conquer Zeila"
 eth_conquer_zeila_desc: "Zeila, Adal's vital port city — conquer it, and gain a foothold in Red Sea trade."
 eth_conquer_harar: "Conquer Harar"
 eth_conquer_harar_desc: "Harar, a center of Islamic scholarship — conquer this holy city."
 eth_conquer_adal: "Conquer Adal"
 eth_conquer_adal_desc: "Put an end to the threat of 'Ahmad the Left-Handed' (Gragn), and conquer the longtime rival Adal Sultanate."
 eth_somali_coast: "Secure the Somali Coast"
 eth_somali_coast_desc: "The Somali coastline — sweep away the remnants of Adal, and secure this land."
 eth_red_sea_access: "Access to the Red Sea"
 eth_red_sea_access_desc: "Secure the port of Massawa, and open the long-awaited path to the sea for landlocked Ethiopia."
 eth_portuguese_contact: "Contact with the Portuguese"
 eth_portuguese_contact_desc: "The Portuguese, seeking the legendary land of 'Prester John' — contact with them brings a new age to Ethiopia."
 eth_massawa_port: "Develop the Port of Massawa"
 eth_massawa_port_desc: "Massawa, the port city on the Red Sea — develop it as a gateway for foreign trade."
 eth_firearms_adoption: "Adopt Firearms"
 eth_firearms_adoption_desc: "With Portuguese support, introduce muskets and cannon into the Ethiopian army."
 eth_european_trade: "Trade with Europe"
 eth_european_trade_desc: "Through Massawa, invigorate trade with the nations of Europe."
 eth_modernize_army: "Modernize the Army"
 eth_modernize_army_desc: "Building on firearms and European trade, transform the Ethiopian army into a modern military force."
 eth_aksum_heritage: "The Legacy of Aksum"
 eth_aksum_heritage_desc: "The Aksumite Empire, which once flourished through Red Sea trade — secure its holy city, and inherit the memory of its glory."
 eth_reclaim_aksum: "Revive Tigray"
 eth_reclaim_aksum_desc: "Tigray, the birthplace of the Aksumite Empire — revive this region as the empire's core territory."
 eth_red_sea_empire: "Rebuild the Red Sea Empire"
 eth_red_sea_empire_desc: "The Red Sea trading empire once built by Aksum — revive it in the present age."
 eth_horn_unification: "Unify the Horn of Africa"
 eth_horn_unification_desc: "Through the integration of Cushitic peoples and the revival of the Red Sea empire — unite the entirety of the Horn of Africa under Ethiopia's banner."
 eth_new_solomonic_empire: "The New Solomonic Empire"
 eth_new_solomonic_empire_desc: "Protector of the Copts, a modernized army, and a unified Horn of Africa — the bloodline of the Queen of Sheba and King Solomon is here completed as a new empire."
 eth_events.1.t: "Jerusalem Liberated"
 eth_events.1.d: "The Holy City of Jerusalem has returned to Coptic hands. For brethren scattered across the world, this day will be remembered forever."
 eth_events.1.a: "Glory to God!"
 eth_events.99.t: "Declaration of the New Solomonic Empire"
 eth_events.99.d: "A small highland kingdom has been reborn as a great empire — protector of the Copts, master of the Red Sea, ruler of the Horn of Africa. The bloodline of the Queen of Sheba and King Solomon is here completed."
 eth_events.99.a: "Glory to Ethiopia! Long live the New Solomonic Empire!"
 STATIC_MODIFIER_NAME_eth_negus_mod: "Authority of the Negus Established"
 STATIC_MODIFIER_DESC_eth_negus_mod: "The Emperor's authority reaches the realm, raising the legitimacy of rule."
 STATIC_MODIFIER_NAME_eth_amba_geshen_mod: "The Prison of Amba Geshen"
 STATIC_MODIFIER_DESC_eth_amba_geshen_mod: "Atop the cliffs of Amba Geshen, young princes of the blood grow old quietly, never allowed to covet the throne."
 STATIC_MODIFIER_NAME_eth_coptic_church_mod: "The Orthodox Church Protected"
 STATIC_MODIFIER_DESC_eth_coptic_church_mod: "The bells of the Tewahedo Church ring from valley to valley across the highlands, and even peoples of other faiths pause to hear them."
 STATIC_MODIFIER_NAME_eth_gondar_mod: "Gondar Developed"
 STATIC_MODIFIER_DESC_eth_gondar_mod: "The stone-walled city has become a symbol of the kingdom's prosperity."
 STATIC_MODIFIER_NAME_eth_chronicle_mod: "The Royal Chronicles Compiled"
 STATIC_MODIFIER_DESC_eth_chronicle_mod: "In the dim scriptoria of the monasteries, the pens of scribes copying Ge'ez chronicles never rest."
 STATIC_MODIFIER_NAME_eth_levies_mod: "The Feudal Levy System"
 STATIC_MODIFIER_DESC_eth_levies_mod: "At the sound of the drums, the lords of the highlands gather, each leading his men beneath his own banner."
 STATIC_MODIFIER_NAME_eth_dynasty_mod: "The Dynasty Secured"
 STATIC_MODIFIER_DESC_eth_dynasty_mod: "The pride of descent from King Solomon and the Queen of Sheba makes the dynasty's name revered among all peoples."
 STATIC_MODIFIER_NAME_eth_horn_hegemony_mod: "Hegemony over the Horn"
 STATIC_MODIFIER_DESC_eth_horn_hegemony_mod: "From the Abyssinian highlands to the lowlands of the Horn, peoples speaking countless tongues pay tribute in the name of a single king."
 STATIC_MODIFIER_NAME_eth_nubian_mod: "Alliance with Nubia"
 STATIC_MODIFIER_DESC_eth_nubian_mod: "Envoys arriving from our brethren in northern Nubia are warmly received as those who share the same faith of the cross."
 STATIC_MODIFIER_NAME_eth_makuria_mod: "Makuria Annexed"
 STATIC_MODIFIER_DESC_eth_makuria_mod: "Integration of annexed Makuria proceeds."
 STATIC_MODIFIER_NAME_eth_alodia_mod: "Alodia Annexed"
 STATIC_MODIFIER_DESC_eth_alodia_mod: "Integration of annexed Alodia proceeds."
 STATIC_MODIFIER_NAME_eth_sudan_mod: "Dominion over Sudan"
 STATIC_MODIFIER_DESC_eth_sudan_mod: "Caravans laden with grain and gold climb without pause from the plains of Sudan along the Nile."
 STATIC_MODIFIER_NAME_eth_mamluk_rivalry_mod: "Rivalry with the Mamluks"
 STATIC_MODIFIER_DESC_eth_mamluk_rivalry_mod: "Having crossed blades with the Mamluk cavalry, the soldiers of the highlands have been tempered into veteran warriors."
 STATIC_MODIFIER_NAME_eth_patriarchate_mod: "The Coptic Patriarchate"
 STATIC_MODIFIER_DESC_eth_patriarchate_mod: "The priests of the highlands had long awaited the day when a patriarch of their own would bestow the blessing."
 STATIC_MODIFIER_NAME_eth_protector_mod: "Protector of the Copts"
 STATIC_MODIFIER_DESC_eth_protector_mod: "Reputation as protector aids in improving diplomatic relations."
 STATIC_MODIFIER_NAME_eth_adal_wars_mod: "The Adal Wars"
 STATIC_MODIFIER_DESC_eth_adal_wars_mod: "Soldiers who survived the endless wars with Adal wear their scars like medals of honor."
 STATIC_MODIFIER_NAME_eth_zeila_mod: "Zeila Conquered"
 STATIC_MODIFIER_DESC_eth_zeila_mod: "From the warehouses of the port of Zeila, spices and pearls of the Red Sea are carried up to the court of the highlands."
 STATIC_MODIFIER_NAME_eth_harar_mod: "Harar Conquered"
 STATIC_MODIFIER_DESC_eth_harar_mod: "When the king's banner was raised over the walls of Harar, the soldiers of the highlands spoke with one voice of the victory that had won a holy city."
 STATIC_MODIFIER_NAME_eth_conquer_adal_mod: "Adal Conquered"
 STATIC_MODIFIER_DESC_eth_conquer_adal_mod: "Even in the villages of Adal, our old rival, the king's officials have begun to spread open their tax ledgers."
 STATIC_MODIFIER_NAME_eth_somali_coast_mod: "The Somali Coast Secured"
 STATIC_MODIFIER_DESC_eth_somali_coast_mod: "In the harbors of the Somali coast, ships laden with frankincense and ivory drop anchor without cease."
 STATIC_MODIFIER_NAME_eth_red_sea_access_mod: "Access to the Red Sea"
 STATIC_MODIFIER_DESC_eth_red_sea_access_mod: "With the long-closed road to the Red Sea now open, the eyes of the highland merchants turn toward the horizon."
 STATIC_MODIFIER_NAME_eth_portuguese_mod: "Contact with the Portuguese"
 STATIC_MODIFIER_DESC_eth_portuguese_mod: "Portuguese envoys from Goa are received with honor at the court of the highlands, bearing rare gifts."
 STATIC_MODIFIER_NAME_eth_massawa_mod: "Massawa Developed"
 STATIC_MODIFIER_DESC_eth_massawa_mod: "The port of Massawa flourishes as a gateway for trade."
 STATIC_MODIFIER_NAME_eth_firearms_mod: "Firearms Adopted"
 STATIC_MODIFIER_DESC_eth_firearms_mod: "The thunder of muskets and cannon in the valleys proclaims that the age of spear and shield has ended."
 STATIC_MODIFIER_NAME_eth_european_trade_mod: "Trade with Europe"
 STATIC_MODIFIER_DESC_eth_european_trade_mod: "European merchants landing at the port of Massawa buy the highlands' gold and musk in exchange for silver coin."
 STATIC_MODIFIER_NAME_eth_modernize_mod: "The Army Modernized"
 STATIC_MODIFIER_DESC_eth_modernize_mod: "Soldiers in new-style uniforms march singing the old songs of war."
 STATIC_MODIFIER_NAME_eth_aksum_heritage_mod: "The Legacy of Aksum"
 STATIC_MODIFIER_DESC_eth_aksum_heritage_mod: "Those who stand before the stelae of Aksum remember that the names of a thousand years of kings still run in their own blood."
 STATIC_MODIFIER_NAME_eth_reclaim_aksum_mod: "Tigray Revived"
 STATIC_MODIFIER_DESC_eth_reclaim_aksum_mod: "The old fields and markets of Aksum have drawn breath again, and the king's officials once more count the harvest."
 STATIC_MODIFIER_NAME_eth_red_sea_empire_mod: "The Red Sea Empire Rebuilt"
 STATIC_MODIFIER_DESC_eth_red_sea_empire_mod: "With the rebuilding of the trading empire that links the ports of the Red Sea, the king's fleets unfurl their sails all along the coast."
 STATIC_MODIFIER_NAME_eth_horn_unification_mod: "The Horn of Africa United"
 STATIC_MODIFIER_DESC_eth_horn_unification_mod: "Every prince of the Horn of Africa now kneels according to the ceremony of a single court."
 STATIC_MODIFIER_NAME_eth_new_solomonic_empire_mod: "The New Solomonic Empire"
 STATIC_MODIFIER_DESC_eth_new_solomonic_empire_mod: "The completion of the new empire has led national power to its zenith."
 STATIC_MODIFIER_NAME_eth_jerusalem_mod: "Jerusalem Liberated"
 STATIC_MODIFIER_DESC_eth_jerusalem_mod: "Before the Holy Sepulchre in Jerusalem, Ethiopian priests weep at the end of their long pilgrimage."
