l_english:
 teo_theodoro_mission_pack: "Principality of Theodoro: Gothia Reborn and Master of the Black Sea"
 teo_theodoro_mission_pack_DESCRIPTION:0 "In 1337, the Principality of Theodoro clings to the mountain fortress of Mangup on the Crimean Peninsula. Once part of the Byzantine Empire, this Greek principality is surrounded by Tatars, Genoese, and the rising Ottomans. Use the Gavras family's commercial genius and military prowess to seize Black Sea trade, revive the name of Gothia, recapture Constantinople, and reign over the Eastern Mediterranean as the Gothic Empire."
 teo_theodoro_mission_pack_CRITERIA_DESCRIPTION:0 "Dominate the Black Sea, expel the Genoese, recapture Constantinople, and rule the Eastern Mediterranean, Black Sea, and Steppes as the Gothic Empire."
 teo_theodoro_mission_pack_BUTTON_TOOLTIP:0 "Reign as the Gothic Empire over the Eastern Mediterranean."
 teo_theodoro_mission_pack_BUTTON_DETAILS:0 "From the mountain fortress of Mangup, build the Gothic Empire through Black Sea trade, Byzantine heritage, and steppe conquest!"
 teo_rise_of_theodoro: "The Rise of Theodoro"
 teo_rise_of_theodoro_desc: "From Mangup's mountain fortress, the Principality of Theodoro begins its ascent. Surrounded by Tatars, Genoese, and Ottomans, the Gavras family's genius will turn crisis into opportunity."
 teo_black_sea_fleet: "The Black Sea Fleet"
 teo_black_sea_fleet_desc: "The Black Sea is contested by Genoa, Venice, Tatars, and Ottomans. Build a fleet to assert Theodoran power on these vital waters."
 teo_build_theodoro_harbor: "Theodoro Harbor"
 teo_build_theodoro_harbor_desc: "Develop Theodoro's harbor at the foot of Mangup to establish it as a Black Sea maritime power."
 teo_genoese_question: "The Genoese Question"
 teo_genoese_question_desc: "Genoa's colony of Gazaria dominates Black Sea trade from Caffa. Purchase Gazaria as a vassal — or preserve the treasury."
 teo_expel_genoese: "Expel the Genoese"
 teo_expel_genoese_desc: "Drive the Genoese from Crimea and seize their colonies to establish Theodoran dominance."
 teo_dominate_crimea: "Dominate Crimea"
 teo_dominate_crimea_desc: "Expel all rivals from Crimea and reign as its sole master."
 teo_tana_trade: "The Tana Trade"
 teo_tana_trade_desc: "Seize the trading hub of Tana at the Don River mouth to control the eastern trade routes."
 teo_black_sea_domination: "Black Sea Domination"
 teo_black_sea_domination_desc: "Assert total mastery over the Black Sea, leaving no rival to challenge Theodoran supremacy."
 teo_greek_heritage: "Greek Heritage"
 teo_greek_heritage_desc: "Strengthen the Orthodox faith and Byzantine cultural legacy that underpins Theodoro's legitimacy."
 teo_trebizond_relations: "Trebizond Relations"
 teo_trebizond_relations_desc: "Define the relationship with the Komnenian Empire of Trebizond — offer vassalage or maintain alliance."
 teo_restore_pontus: "Restore Pontus"
 teo_restore_pontus_desc: "Conquer the Pontic coastline and restore the ancient kingdom of Pontus."
 teo_constantinople: "Recapture Constantinople"
 teo_constantinople_desc: "Reclaim the Second Rome from the Ottomans and restore the Orthodox cross over Hagia Sophia."
 teo_gothia_ascendant: "Gothia Ascendant"
 teo_gothia_ascendant_desc: "Proclaim the revival of Gothia and be recognized as the legitimate successor to Byzantium."
 teo_aegean_supremacy: "Aegean Supremacy"
 teo_aegean_supremacy_desc: "Seize the Aegean islands and coastline to extend Theodoran maritime power into the Mediterranean."
 teo_balkans: "Conquer the Balkans"
 teo_balkans_desc: "Conquer the Balkans — the heartland of the former Byzantine Empire — to solidify the Gothic Empire."
 teo_azov_gateway: "Gateway to Azov"
 teo_azov_gateway_desc: "Control the Sea of Azov to open the inland trade routes via the Don and Volga rivers."
 teo_pryazovia: "Pryazovia"
 teo_pryazovia_desc: "Secure the Pryazovia region north of the Sea of Azov, opening the path into the steppes."
 teo_tatar_wars: "Wars Against the Tatars"
 teo_tatar_wars_desc: "Battle the Crimean Tatars to forge Theodoran cavalry into elite steppe warriors."
 teo_into_steppes: "Into the Steppes"
 teo_into_steppes_desc: "Conquer the vast Pontic Steppe, transforming Theodoro into a continental empire."
 teo_caucasus_gateway: "Gateway to the Caucasus"
 teo_caucasus_gateway_desc: "Advance into the Caucasus mountains of Georgia, Armenia, and Azerbaijan."
 teo_caspian_reach: "Reach the Caspian"
 teo_caspian_reach_desc: "Reach the Caspian Sea to gain access to Persian and Central Asian trade routes."
 teo_russian_question: "The Russian Question"
 teo_russian_question_desc: "Define the relationship with Moscow and Novgorod — forge an alliance or pursue conquest."
 teo_russian_claim: "Claim the Rus"
 teo_russian_claim_desc: "Extend Theodoran influence over the Rus principalities."
 teo_ruthenia_conquest: "Conquest of Ruthenia"
 teo_ruthenia_conquest_desc: "Conquer Ruthenia including Kyiv, claiming the mantle of both Byzantium and the Rus."
 teo_dev_theodoro: "Develop Theodoro"
 teo_dev_theodoro_desc: "Develop the fortress-city of Theodoro into a worthy capital of the Gothic Empire."
 teo_trade_empire: "Trade Empire"
 teo_trade_empire_desc: "Build a trade empire at the crossroads of the Black Sea, Mediterranean, and Silk Road."
 teo_silk_road: "Silk Road Trade"
 teo_silk_road_desc: "Control the Silk Road and monopolize the flow of silk from Central Asia to Western markets."
 teo_gothic_culture: "Gothic Culture"
 teo_gothic_culture_desc: "Foster a unique Gothian culture blending Greek, Gothic, and Tatar heritage."
 teo_orthodox_fortress: "Orthodox Fortress"
 teo_orthodox_fortress_desc: "Build a network of Orthodox monasteries and military fortresses to defend the faith."
 teo_great_theodoro: "Great Theodoro"
 teo_great_theodoro_desc: "Transform Mangup into the eternal capital of the Gothic Empire, a beacon of civilization."
 teo_crimean_wine: "Crimean Wine"
 teo_crimean_wine_desc: "Revive the ancient Greek tradition of Crimean viticulture and supply wine to Mediterranean markets."
 teo_fortress_mangup: "Fortress of Mangup"
 teo_fortress_mangup_desc: "Fortify Mangup — the natural plateau fortress that even the Ottomans struggled to take."
 teo_anatolian_coast: "The Anatolian Coast"
 teo_anatolian_coast_desc: "Conquer the Black Sea southern coast of Anatolia to make the Black Sea a Theodoran lake."
 teo_orthodox_patriarch: "Orthodox Patriarchate"
 teo_orthodox_patriarch_desc: "Establish a patriarchate in Constantinople, making Theodoro the guardian of all Orthodox Christians."
 teo_merchant_republic: "Merchant Republic"
 teo_merchant_republic_desc: "Build the greatest commercial empire in the Mediterranean through trade and conquest."
 teo_dev_trebizond_city: "Develop Trebizond"
 teo_dev_trebizond_city_desc: "Develop Trebizond as a major trading hub on the Black Sea southern coast."
 teo_gavras_triumphant: "Gavras Triumphant"
 teo_gavras_triumphant_desc: "The Gavras family's commercial genius and military courage have created a great empire from a mountain fortress."
 teo_gothia_empire: "The Gothic Empire"
 teo_gothia_empire_desc: "Reign as Emperor of Gothia — master of the Black Sea, Mediterranean, and Steppes."
 teo_events.1.t: "Theodoro Rises — Greek Tradition or Gothic Pride?"
 teo_events.1.d: "In 1337, from the plateau fortress of Mangup, the Principality of Theodoro begins its ascent. Surrounded by Tatars, Genoese, and Ottomans, the Gavras family's commercial genius and military courage will turn this crisis into opportunity. Seize Black Sea trade, revive Gothia, and reclaim Constantinople."
 teo_events.1.a: "Preserve the Pontic Greek tradition — we are the heirs of Byzantium"
 teo_events.10.t: "Reunion with Trebizond — The Komnenos Connection"
 teo_events.10.d: "The Komnenos dynasty's Trebizond Empire is declining under Ottoman pressure. As fellow Greeks, should we aid Trebizond or absorb it into Gothia?"
 teo_events.10.a: "Make Trebizond a vassal — protect the Pontic legacy under Gothia"
 teo_events.20.t: "Constantinople Recaptured — Coronation of the Gothic King"
 teo_events.20.d: "Constantinople is in Gothia's hands! Recapturing the Orthodox holy city from the Ottomans means Russia becomes the spiritual leader of the Orthodox world as the 'Third Rome'. The Christian cross flies once more over Hagia Sophia."
 teo_events.20.a: "Long live the Gothic King! Long live Constantinople!"
 teo_events.30.t: "The Russian Question — Alliance or Conquest?"
 teo_events.30.d: "The Gavras family has deep ties with Russian noble houses. How shall we define our relationship with Moscow and Novgorod — forge an alliance protecting mutual interests, or place the Rus under Gothia's dominion?"
 teo_events.30.a: "Ally with Russia — cooperate as Orthodox brethren"
 teo_events.30.b: "Aim for conquest of the Rus — Gothia shall be the true master of the Rus"
 teo_events.60.t: "The Triumph of Gavras — Birth of the Gothic Empire"
 teo_events.60.d: "Black Sea mastery, Constantinople recaptured, steppes conquered — the Gavras family now reigns over the Eastern Mediterranean as 'Emperor of the Gothic Empire'. The journey from Mangup's mountain fortress ends with the founding of a world empire."
 teo_events.60.a: "Long live the Gothic Empire! Long live the Gavras family!"
 teo_events.99.t: "The Gothic Empire — Eternal Glory"
 teo_events.99.d: "'Emperor of Gothia — Master of Black Sea, Mediterranean, and Steppe' — this empire at the crossroads of Eastern and Western civilization reigns supreme. The miraculous story that began from the small fortress of Mangup in 1337 reaches its conclusion."
 teo_events.99.a: "Long live the Gothic Empire! Long live eternal glory!"
 STATIC_MODIFIER_NAME_teo_black_sea_fleet_mod: "Black Sea Fleet"
 STATIC_MODIFIER_DESC_teo_black_sea_fleet_mod: "Theodoro's Black Sea fleet asserts dominance over the vital trade waters."
 STATIC_MODIFIER_NAME_teo_theodoro_harbor_mod: "Theodoro Harbor"
 STATIC_MODIFIER_DESC_teo_theodoro_harbor_mod: "The harbor at Mangup's foot serves as the gateway for Theodoran maritime power."
 STATIC_MODIFIER_NAME_teo_crimea_trade_mod: "Crimean Trade"
 STATIC_MODIFIER_DESC_teo_crimea_trade_mod: "Crimean trade routes are secured under Theodoran control."
 STATIC_MODIFIER_NAME_teo_crimea_domination_mod: "Crimea Dominated"
 STATIC_MODIFIER_DESC_teo_crimea_domination_mod: "All rivals are expelled from Crimea — Theodoro reigns as its sole master."
 STATIC_MODIFIER_NAME_teo_tana_mod: "Tana Trade Hub"
 STATIC_MODIFIER_DESC_teo_tana_mod: "The trading hub of Tana at the Don mouth is controlled, opening eastern trade."
 STATIC_MODIFIER_NAME_teo_black_sea_dom_mod: "Master of the Black Sea"
 STATIC_MODIFIER_DESC_teo_black_sea_dom_mod: "Total mastery over the Black Sea — no rival dares challenge Theodoran supremacy."
 STATIC_MODIFIER_NAME_teo_greek_heritage_mod: "Greek Heritage"
 STATIC_MODIFIER_DESC_teo_greek_heritage_mod: "The icons and liturgy of Byzantium are still kept in the chapels of Theodoro, quietly upholding the legitimacy of this land."
 STATIC_MODIFIER_NAME_teo_pontus_mod: "Pontus Restored"
 STATIC_MODIFIER_DESC_teo_pontus_mod: "The Pontic coastline is secured, opening the path to Black Sea dominance."
 STATIC_MODIFIER_NAME_teo_gothia_mod: "Gothia Ascendant"
 STATIC_MODIFIER_DESC_teo_gothia_mod: "The Gothic Empire is proclaimed — the revival of Gothia recognized by the world."
 STATIC_MODIFIER_NAME_teo_aegean_mod: "Aegean Supremacy"
 STATIC_MODIFIER_DESC_teo_aegean_mod: "In the harbors of the Aegean islands, ships flying the flag of Gothia lie in rows, and the loads of Mediterranean trade are transshipped one after another."
 STATIC_MODIFIER_NAME_teo_balkans_mod: "Balkans Conquered"
 STATIC_MODIFIER_DESC_teo_balkans_mod: "The Balkans are conquered — the Gothic Empire stretches across the former Byzantine heartland."
 STATIC_MODIFIER_NAME_teo_azov_mod: "Gateway to Azov"
 STATIC_MODIFIER_DESC_teo_azov_mod: "The Sea of Azov gateway opens inland trade routes via the Don and Volga."
 STATIC_MODIFIER_NAME_teo_pryazovia_mod: "Pryazovia Secured"
 STATIC_MODIFIER_DESC_teo_pryazovia_mod: "The northern Sea of Azov shore is secured, opening the path into the steppes."
 STATIC_MODIFIER_NAME_teo_tatar_wars_mod: "Struggle Against the Tatars"
 STATIC_MODIFIER_DESC_teo_tatar_wars_mod: "Battles against the Crimean Tatars have forged Theodoran cavalry into elite steppe warriors."
 STATIC_MODIFIER_NAME_teo_steppes_mod: "Master of the Steppes"
 STATIC_MODIFIER_DESC_teo_steppes_mod: "The vast Pontic Steppe falls under Theodoran dominion — a continental empire emerges."
 STATIC_MODIFIER_NAME_teo_caucasus_mod: "Caucasus Campaign"
 STATIC_MODIFIER_DESC_teo_caucasus_mod: "The Caucasus gateway opens access to Persian and Central Asian trade."
 STATIC_MODIFIER_NAME_teo_caspian_mod: "Caspian Reached"
 STATIC_MODIFIER_DESC_teo_caspian_mod: "The Caspian Sea is reached — Persian and Central Asian trade routes are now accessible."
 STATIC_MODIFIER_NAME_teo_russian_claim_mod: "Claim on the Rus"
 STATIC_MODIFIER_DESC_teo_russian_claim_mod: "Envoys of the Rus princes visit the court of Gothia, and Russian nobles, too, join beneath its banner one after another."
 STATIC_MODIFIER_NAME_teo_ruthenia_mod: "Ruthenia Conquered"
 STATIC_MODIFIER_DESC_teo_ruthenia_mod: "Ruthenia including Kyiv is conquered — the mantle of Byzantium and the Rus is claimed."
 STATIC_MODIFIER_NAME_teo_theodoro_dev_mod: "Theodoro Developed"
 STATIC_MODIFIER_DESC_teo_theodoro_dev_mod: "The fortress-city of Theodoro is developed into a worthy capital of the Gothic Empire."
 STATIC_MODIFIER_NAME_teo_trade_empire_mod: "Trade Empire"
 STATIC_MODIFIER_DESC_teo_trade_empire_mod: "A great trade empire is built at the crossroads of civilizations."
 STATIC_MODIFIER_NAME_teo_silk_mod: "Silk Road Trade"
 STATIC_MODIFIER_DESC_teo_silk_mod: "The Silk Road is controlled — silk flows through Theodoran hands to Western markets."
 STATIC_MODIFIER_NAME_teo_gothic_culture_mod: "Gothic Culture"
 STATIC_MODIFIER_DESC_teo_gothic_culture_mod: "A unique Gothic culture emerges, blending Greek, Gothic, and Tatar heritage."
 STATIC_MODIFIER_NAME_teo_orthodox_fortress_mod: "Orthodox Fortress"
 STATIC_MODIFIER_DESC_teo_orthodox_fortress_mod: "Orthodox monasteries and military fortresses defend faith and frontier alike."
 STATIC_MODIFIER_NAME_teo_great_theodoro_mod: "Great Theodoro"
 STATIC_MODIFIER_DESC_teo_great_theodoro_mod: "Mangup is transformed into the eternal capital of the Gothic Empire."
 STATIC_MODIFIER_NAME_teo_wine_mod: "Crimean Wine"
 STATIC_MODIFIER_DESC_teo_wine_mod: "Crimean vineyards are revived — fine wines flow to Mediterranean markets."
 STATIC_MODIFIER_NAME_teo_mangup_fortress_mod: "Mangup Fortress"
 STATIC_MODIFIER_DESC_teo_mangup_fortress_mod: "Mangup Fortress is fortified beyond all attack — the eternal seat of the Gothic Empire."
 STATIC_MODIFIER_NAME_teo_anatolia_mod: "Anatolian Coast Secured"
 STATIC_MODIFIER_DESC_teo_anatolia_mod: "The Black Sea southern coast of Anatolia is conquered — the sea becomes a Theodoran lake."
 STATIC_MODIFIER_NAME_teo_patriarch_mod: "Orthodox Patriarchate"
 STATIC_MODIFIER_DESC_teo_patriarch_mod: "Constantinople's patriarchate makes Theodoro the guardian of all Orthodox Christians."
 STATIC_MODIFIER_NAME_teo_merchant_republic_mod: "Merchant Republic"
 STATIC_MODIFIER_DESC_teo_merchant_republic_mod: "A vast commercial network spans the Mediterranean, Black Sea, and Silk Road."
 STATIC_MODIFIER_NAME_teo_trebizond_city_mod: "Trebizond City"
 STATIC_MODIFIER_DESC_teo_trebizond_city_mod: "Trebizond is developed as a major trading hub on the Black Sea southern coast."
 STATIC_MODIFIER_NAME_teo_gavras_final_mod: "Gothic Empire Hegemony"
 STATIC_MODIFIER_DESC_teo_gavras_final_mod: "The Gavras dynasty's vision is complete — the Gothic Empire reigns over sea and steppe."
 teo_events.1.b: "Revive the Gothic pride — we are the true successors of Gothia"
 teo_events.5.t: "The Gazaria — Purchase or Refuse?"
 teo_events.5.d: "The Republic of Genoa administers its Crimean trading colony 'Gazaria (GAZ)'. By paying 300 ducats, Genoa proposes to transfer Gazaria to Theodoro as a vassal.\n\nThis is an opportunity to peacefully establish control over Crimea — but 300 ducats is a steep price. Will you purchase it?"
 teo_events.5.a: "Pay 300 ducats to purchase Gazaria — Crimea shall be ours"
 teo_events.5.b: "Decline — preserve our treasury for now"
 STATIC_MODIFIER_NAME_teo_gothic_penalty_mod: "The Pain of Gothic Conversion"
 STATIC_MODIFIER_DESC_teo_gothic_penalty_mod: "The Pontic Greeks, unable to grow used to the Gothic tongue and customs, nurse grievances that smolder in the villages — yet all know that greater rewards await when the Gothic realm is complete."
 STATIC_MODIFIER_NAME_teo_gothic_bonus_mod: "True Successor of Gothia"
 STATIC_MODIFIER_DESC_teo_gothic_bonus_mod: "The Gothic Empire completed while maintaining Gothic culture — the spirit of the ancient Goths revived, bringing eternal glory to the Gothic Empire."
 teo_events.10.b: "Maintain alliance — respect the pride of the Komnenoi"
 STATIC_MODIFIER_NAME_teo_russian_alliance_mod: "Alliance with Russia"
 STATIC_MODIFIER_DESC_teo_russian_alliance_mod: "Friendly alliance with the Russian principalities has elevated Gothia's diplomatic influence."
 STATIC_MODIFIER_NAME_teo_russian_conquest_mod: "Will to Conquer the Rus"
 STATIC_MODIFIER_DESC_teo_russian_conquest_mod: "Gothia's will to conquer the Rus suppresses antagonism received."
 teo_events.99.b: "Complete the Empire with Gothic pride — unlock the right to invade Germania"
 cb_gothic_invasion: "Gothic Invasion"
 cb_gothic_invasion_desc: "A unique casus belli against nations of the German culture group — conquest costs and antagonism reduced by 80%. Unlocked exclusively for Gothic primary culture after completing the Gothic Empire final mission."
