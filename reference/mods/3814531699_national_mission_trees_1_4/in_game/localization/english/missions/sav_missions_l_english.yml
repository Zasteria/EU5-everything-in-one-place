l_english:
 sav_house_of_savoy_mission_pack: "Ambitions of the House of Savoy"
 sav_house_of_savoy_mission_pack_DESCRIPTION:0 "The House of Savoy, commanding the Alpine passes, is destined to rise from a small Piedmontese duchy to master all of Italy and southern France, building the Kingdom of Italy. Navigate skillfully between the Pope, the Emperor, and France; conquer Genoa to establish naval power; crush Lombardy, Tuscany, and Venice to claim Rome. Rise as Sardinia-Piedmont and ultimately become the standard-bearer of Italian unification."
 sav_house_of_savoy_mission_pack_CRITERIA_DESCRIPTION:0 "As Savoy, unify Piedmont, conquer Italy and France, and establish the Kingdom of Italy."
 sav_house_of_savoy_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to fulfill the ambitions of the House of Savoy."
 sav_house_of_savoy_mission_pack_BUTTON_DETAILS:0 "Cross the Alps and unify Italy!"

 sav_the_savoy_ambition: "Ambitions of Savoy"
 sav_the_savoy_ambition_desc: "The House of Savoy occupies a unique position at the crossroads of the Alps, with influence over both Italy and France. By controlling the fertile lands of Piedmont and the Alpine trade routes, this small duchy begins its path toward greatness."

 sav_unify_piedmont: "Unify Piedmont"
 sav_unify_piedmont_desc: "Incorporating independent powers such as Saluzzo and Montferrat and unifying all of Piedmont is the first step toward Savoy's great ambitions."

 sav_glory_of_turin: "Glory of Turin"
 sav_glory_of_turin_desc: "Develop Turin, the central city of Piedmont, into a thriving metropolis befitting the capital of the House of Savoy."

 sav_shroud_of_turin: "The Shroud of Turin"
 sav_shroud_of_turin_desc: "The linen cloth believed to be the burial shroud of Christ rests in Turin Cathedral. Faith in this relic brings prosperity and prestige to the realm."

 sav_alpine_roads: "Alpine Roads"
 sav_alpine_roads_desc: "Developing road infrastructure along the Alpine trade routes increases the profits flowing to Savoy as merchants crossing between France and Italy pass through."

 sav_crossroads_of_europe: "Crossroads of Europe"
 sav_crossroads_of_europe_desc: "Piedmont, connecting Genoa, Venice, and France, is becoming one of Europe's foremost commercial hubs."

 sav_order_of_saints_maurice: "Order of Saints Maurice and Lazarus"
 sav_order_of_saints_maurice_desc: "The Order of Saints Maurice and Lazarus, founded by the House of Savoy, becomes a symbol of religious authority and legitimacy in the Catholic world."

 sav_savoy_academy: "Academy of Savoy"
 sav_savoy_academy_desc: "Embracing the Renaissance spirit and developing academic institutions centered on Turin establishes Savoy as a firm member of the Italian cultural sphere."

 sav_alpine_powerhouse: "Alpine Powerhouse"
 sav_alpine_powerhouse_desc: "Through the unification of Piedmont, cultural development, and growing economic strength, Savoy has come to be recognized as a major power centered on the Alps."

 sav_alpine_fortifications: "Alpine Fortifications"
 sav_alpine_fortifications_desc: "Making full use of the Alps' natural ruggedness and constructing formidable fortresses at strategic positions makes Savoy an impregnable mountain state."

 sav_diplomatic_balance: "Diplomatic Balance"
 sav_diplomatic_balance_desc: "For Savoy, caught between great powers, diplomatic skill is indispensable for survival. Maintaining high diplomatic reputation deftly deflects pressure from powerful neighbors."

 sav_savoyard_army: "The Savoyard Army"
 sav_savoyard_army_desc: "Savoyard soldiers, hardened by the Alps' rugged terrain, are renowned as some of Europe's finest mountain warriors. Building a standing army supports the realm's military independence."

 sav_conquer_genoa: "Conquer Genoa"
 sav_conquer_genoa_desc: "Conquering Genoa, one of the Mediterranean's foremost maritime cities, allows Savoy to break free of its landlocked status and take the first step toward becoming a naval power with direct Mediterranean access."

 sav_nice_naval_base: "The Naval Base at Nice"
 sav_nice_naval_base_desc: "Establishing a naval base at Nice on the Mediterranean coast gives Savoy a foothold for controlling the Tyrrhenian Sea."

 sav_sardinia_union: "Union with Sardinia"
 sav_sardinia_union_desc: "Seizing most of Sardinia and claiming the title of 'Kingdom of Sardinia' earns the House of Savoy recognition as one of Italy's major royal houses."

 sav_seize_lombardy: "Seize Lombardy"
 sav_seize_lombardy_desc: "Placing Lombardy, centered on Milan, under Savoyard control makes Savoy the master of northern Italy."

 sav_push_tuscany: "Push into Tuscany"
 sav_push_tuscany_desc: "Subduing the rich city-states of Tuscany led by Florence adds the heartland of Renaissance culture to Savoyard territory."

 sav_capture_venice: "Capture Venice"
 sav_capture_venice_desc: "Conquering Venice, the Queen of the Adriatic, establishes Savoy's naval hegemony in northern Italy."

 sav_emilia_and_beyond: "Emilia and Beyond"
 sav_emilia_and_beyond_desc: "Seizing the Emilia region and bringing the remaining territories of northern Italy under control makes Savoyard hegemony absolute."

 sav_march_on_naples: "March on Naples"
 sav_march_on_naples_desc: "Conquering Naples, the key city of southern Italy, brings the completion of peninsular control within reach."

 sav_eternal_rome: "The Eternal City"
 sav_eternal_rome_desc: "To control Rome is to control Italy. Having seized the Eternal City, Savoy demonstrates its authority as the legitimate ruler of Italy to the world."

 sav_integrate_geneva: "Integrate Geneva"
 sav_integrate_geneva_desc: "Bringing Geneva, with its strong ties to the Swiss Confederation, firmly under Savoyard control establishes a foothold for northward expansion."

 sav_control_provence: "Control Provence"
 sav_control_provence_desc: "Seizing Provence along the Mediterranean coast establishes Savoy's hegemony in southern France and opens the way to greater ambitions."

 sav_against_the_swiss: "Against the Swiss"
 sav_against_the_swiss_desc: "Suppressing the fiercely independent Swiss Confederation and seizing western Switzerland makes Savoy the master west of the Rhine."

 sav_conquer_burgundy: "Conquer Burgundy"
 sav_conquer_burgundy_desc: "Subduing the rich lands once controlled by the Duchy of Burgundy opens the road to the invasion of France."

 sav_savoyard_occitania: "Savoyard Occitania"
 sav_savoyard_occitania_desc: "Seizing the Occitan-speaking lands and drawing all of southern France into the Savoyard cultural sphere."

 sav_claim_france: "Claim France"
 sav_claim_france_desc: "The time has come to seize Paris, the capital of the Kingdom of France, and bring the great power that once threatened Savoy under our rule."

 sav_kingdom_of_italy: "Kingdom of Italy"
 sav_kingdom_of_italy_desc: "The House of Savoy has crossed the Alps to unify all of Italy and, as heir to the Roman Empire, founded the Kingdom of Italy. The dream of the Risorgimento has been realized here."
 STATIC_MODIFIER_NAME_sav_unified_piedmont_mod: "Unification of Piedmont"
 STATIC_MODIFIER_DESC_sav_unified_piedmont_mod: "Piedmont — 'the foot of the mountains' — is a fertile plain ringed by the Alps and the Apennines, where the lords of Savoy, Montferrat, Saluzzo, and others held sway. Only by uniting them can Savoy fully command the crossroads linking the Alps to the River Po."

 STATIC_MODIFIER_NAME_sav_shroud_of_turin_mod: "Blessing of the Shroud"
 STATIC_MODIFIER_DESC_sav_shroud_of_turin_mod: "The Shroud of Turin is a linen cloth said to have wrapped Christ after the crucifixion, bearing the shadowy imprint of a human body. Since the House of Savoy acquired it in 1353, it has been venerated as one of the greatest relics of the Catholic world. The debate over its authenticity continues, but its religious and political influence is beyond doubt."
 STATIC_MODIFIER_NAME_sav_alpine_roads_mod: "Alpine Roads"
 STATIC_MODIFIER_DESC_sav_alpine_roads_mod: "The Great St Bernard, Mont Cenis, and St Gotthard — the routes over the Alps were the most important arteries of Europe from Roman times through the Middle Ages. Savoy, master of these passes, grew immensely rich on tolls and trade. Its role as 'gatekeeper of the Alps' was the root of its prosperity."
 STATIC_MODIFIER_NAME_sav_crossroads_mod: "Crossroads of Europe"
 STATIC_MODIFIER_DESC_sav_crossroads_mod: "Piedmont lies at the crossing of France, Switzerland, Genoa, and Milan. Italian merchants bound for the Champagne fairs, French pilgrims bound for Rome, mercenaries bound for Switzerland — all manner of people and goods passed through Piedmont, and by policing the way Savoy monopolized the profits of the middleman."
 STATIC_MODIFIER_NAME_sav_order_of_saints_mod: "Order of Saints Maurice and Lazarus"
 STATIC_MODIFIER_DESC_sav_order_of_saints_mod: "The Order of Saints Maurice and Lazarus merged two orders founded by the House of Savoy, in 1434 and 1572 respectively. Saint Maurice was a Christian martyr of Roman times; Saint Lazarus was venerated as the patron saint of lepers. The order became the symbol of the House of Savoy's religious authority in the Catholic world."
 STATIC_MODIFIER_NAME_sav_savoy_academy_mod: "Influence of the Academy of Savoy"
 STATIC_MODIFIER_DESC_sav_savoy_academy_mod: "In the Renaissance, the Duchy of Savoy was known as a patron of learning and the arts. The University of Turin, founded in 1404, became the intellectual center of Piedmont, teaching law, medicine, and theology. The tradition of artistic patronage that would later give rise to the Accademia delle Belle Arti under Charles Emmanuel I also took root in this age."
 STATIC_MODIFIER_NAME_sav_alpine_powerhouse_mod: "Alpine Powerhouse"
 STATIC_MODIFIER_DESC_sav_alpine_powerhouse_mod: "'Small but strong' — Savoy's strength lay in the shrewd use of its geography. Ringed by the great powers of France, Austria, and Spain, it survived through deft diplomacy and military strategy that exploited the lay of the land, and finally became the 'dynasty of destiny' that led the unification of Italy."
 STATIC_MODIFIER_NAME_sav_alpine_fortifications_mod: "Alpine Fortifications"
 STATIC_MODIFIER_DESC_sav_alpine_fortifications_mod: "By stationing fortress groups such as Briançon, Fenestrelle, and Exilles in the natural strongholds of the Alps, Savoy forged a 'shield of the Alps.' In the 17th and 18th centuries, Vauban-style bastioned fortresses came to guard these passes, making Savoy one of the most impregnable states in Europe."
 STATIC_MODIFIER_NAME_sav_diplomatic_balance_mod: "Diplomatic Balance"
 STATIC_MODIFIER_DESC_sav_diplomatic_balance_mod: "The essence of Savoyard diplomacy was 'always side with the stronger.' Walking the tightrope between France and Austria, Savoy won Sardinia at the Treaty of Utrecht (1713) and rose to the rank of kingdom. Victor Amadeus II embodied the summit of this 'balancer' diplomacy."
 STATIC_MODIFIER_NAME_sav_savoyard_army_mod: "The Savoyard Elite"
 STATIC_MODIFIER_DESC_sav_savoyard_army_mod: "Savoyard soldiers were masters of mountain warfare, forged in the harsh terrain of the Alps. The Piedmontese military reforms of the 14th and 15th centuries established the 'Ordinanza Piedmontese,' and disciplined infantry tactics became the strength of the Savoyard army. In the later Risorgimento, too, they were the mainstay of the liberation of northern Italy."
 STATIC_MODIFIER_NAME_sav_conquer_genoa_mod: "Seizure of Genoa"
 STATIC_MODIFIER_DESC_sav_conquer_genoa_mod: "Genoa, rival to Venice, was one of the greatest maritime city-states of the medieval Mediterranean, spinning a vast commercial network across the Black Sea, North Africa, and Iberia. It is also the birthplace of banking (the Bank of St George is among the oldest in the world) and of insurance. Conquering this 'proud republic' opens the door of the Mediterranean to Savoy."
 STATIC_MODIFIER_NAME_sav_nice_naval_base_mod: "Naval Base at Nice"
 STATIC_MODIFIER_DESC_sav_nice_naval_base_mod: "Nice (Nizza Marittima) is an ancient Mediterranean port founded as a colony of Greek Massalia (Marseille). Since the House of Savoy acquired it in 1388, this harbor on the border between France and Italy served as Savoy's only naval base (it remained Savoyard until 1860)."
 STATIC_MODIFIER_NAME_sav_sardinia_union_mod: "Union with Sardinia"
 STATIC_MODIFIER_DESC_sav_sardinia_union_mod: "In 1720, in the adjustments following the Treaty of Utrecht, the House of Savoy exchanged Sicily for Sardinia and rose as the 'Kingdom of Sardinia.' The union of this island with continental Piedmont became the foundation from which Camillo Cavour and Garibaldi would achieve the unification of Italy (1861)."
 STATIC_MODIFIER_NAME_sav_seize_lombardy_mod: "Seizure of Lombardy"
 STATIC_MODIFIER_DESC_sav_seize_lombardy_mod: "The Lombard plain is among the most fertile farmland in Europe, and Milan its center of industry and commerce. Recovering this rich land, long taken by Austria, was the core aim of the Risorgimento — the concrete form of Savoy's dream."
 STATIC_MODIFIER_NAME_sav_push_tuscany_mod: "Advance into Tuscany"
 STATIC_MODIFIER_DESC_sav_push_tuscany_mod: "Tuscany, centered on Florence, is the birthplace of Renaissance culture and holds the greatest artistic legacy in human history. The Uffizi, the Duomo, Dante's verse — all nurtured by the Medici. To add this cultural treasury to its domains would lend the Kingdom of Savoy a spiritual authority."
 STATIC_MODIFIER_NAME_sav_capture_venice_mod: "Seizure of Venice"
 STATIC_MODIFIER_DESC_sav_capture_venice_mod: "Venice, 'Queen of the Adriatic,' is a miraculous city-state that preserved its independence for over a thousand years. A city of canals built on the islands of a lagoon, it reigned as master of the Mediterranean through its monopoly of the eastern trade and its supreme shipbuilding skill, the Arsenale. Conquering this unconquered city would be a feat of history."
 STATIC_MODIFIER_NAME_sav_emilia_and_beyond_mod: "Emilia and Beyond"
 STATIC_MODIFIER_DESC_sav_emilia_and_beyond_mod: "Bologna, Parma, Modena, and Ferrara, strung along the Via Emilia, were known from the Middle Ages as centers of food, culture, and learning. Bologna is home to the oldest university in Europe (founded 1088), and its intellectual tradition would deepen the cultural depth of the Kingdom of Savoy."
 STATIC_MODIFIER_NAME_sav_march_on_naples_mod: "March on Naples"
 STATIC_MODIFIER_DESC_sav_march_on_naples_mod: "So beautiful that it gave rise to the saying 'See Naples and die,' this city flourished from antiquity as one of the greatest cities of the Mediterranean. Naples, which passed through a turbulent history under Angevin, Aragonese, Spanish, and Bourbon rulers, was the last great obstacle to Italian unification."
 STATIC_MODIFIER_NAME_sav_eternal_rome_mod: "The Eternal City"
 STATIC_MODIFIER_DESC_sav_eternal_rome_mod: "'All roads lead to Rome' — capital of the ancient Roman Empire, seat of the Catholic Church, center of Renaissance culture, Rome is the symbol of Western civilization. The Colosseum, the Pantheon, St. Peter's Basilica — to make a city of such historical weight one's capital signifies the completion of Italian unification."
 STATIC_MODIFIER_NAME_sav_integrate_geneva_mod: "Integration of Geneva"
 STATIC_MODIFIER_DESC_sav_integrate_geneva_mod: "Geneva was once under the influence of the counts of Savoy, but in 1536 John Calvin made it the base of the Reformation, and it became the 'Protestant Rome.' Reintegrating this lakeside city would be an important foothold for Savoy's expansion toward Switzerland."
 STATIC_MODIFIER_NAME_sav_control_provence_mod: "Control of Provence"
 STATIC_MODIFIER_DESC_sav_control_provence_mod: "Provence was once the domain of the House of Anjou, and was absorbed into the French crown after the death of King René (1480). The lavender fields, olive groves, and vineyards of the Mediterranean coast — this rich land of southern France would be the key to greatly widening Savoy's domain."
 STATIC_MODIFIER_NAME_sav_against_the_swiss_mod: "Against the Swiss"
 STATIC_MODIFIER_DESC_sav_against_the_swiss_mod: "The Swiss Confederacy is a land of invincible mountain warriors who defeated Charles the Bold, Duke of Burgundy, at Grandson and Murten in 1476–1477. Subduing this mighty neighbor is no easy feat, but for Savoy, which used Swiss mercenaries (Landsknechte) as its court guard, ruling their homeland would be the greatest of military victories."
 STATIC_MODIFIER_NAME_sav_conquer_burgundy_mod: "Conquest of Burgundy"
 STATIC_MODIFIER_DESC_sav_conquer_burgundy_mod: "Burgundy, a cadet branch of the Valois, at its height ruled a vast 'middle kingdom' stretching from the Low Countries to Burgundy. Reabsorbed by France with the death of Charles the Bold (1477), this rich province, famed for its wine and cuisine, would become an important base for the invasion of France."
 STATIC_MODIFIER_NAME_sav_savoyard_occitania_mod: "Savoyard Occitania"
 STATIC_MODIFIER_DESC_sav_savoyard_occitania_mod: "The Occitan-speaking peoples of southern France gave rise to the culture of the troubadours, but were devastated by the Albigensian Crusade of the 13th century. Buried under the persecution of the Cathars and the rule of the French crown, the tradition of Occitan autonomy is revived beneath the banner of Savoy."
 STATIC_MODIFIER_NAME_sav_claim_france_mod: "Claim on France"
 STATIC_MODIFIER_DESC_sav_claim_france_mod: "France was always both a threat and an allure to Savoy. In the age of Napoleon (born a Corsican, yet a neighbor of Nice), Savoy was swallowed by France. Now the reverse — a grand reversal in which Savoy seizes the throne of the French king."
 STATIC_MODIFIER_NAME_sav_kingdom_of_italy_mod: "Kingdom of Italy"
 STATIC_MODIFIER_DESC_sav_kingdom_of_italy_mod: "On 17 March 1861, Victor Emmanuel II (King of Sardinia) took the throne as first King of the Kingdom of Italy — so it happened in real history. The greatest political miracle of the 19th century, fusing Cavour's diplomacy, Garibaldi's arms, and Mazzini's ideals, is here achieved four hundred years early."
 STATIC_MODIFIER_NAME_sav_glory_of_turin_mod: "Glory of Turin"
 STATIC_MODIFIER_DESC_sav_glory_of_turin_mod: "The open-air market of the 'Il Balon,' the Langhe hills that produce Barolo and Barbaresco, the resplendent Piazza San Carlo — Turin is the capital the House of Savoy shaped into Italy's foremost planned city. Inheriting the grid plan of Roman Augusta Taurinorum, this city boasts the most refined appearance south of the Alps."

 sav_events.1.t: "Ambitions of the House of Savoy"
 sav_events.1.d: "The Duchy of Savoy occupies the strategic passes of the Alps connecting northern and southern Europe. With France and Italy on either side, this small principality is awakening to grand ambitions. The Savoyard coat of arms — a white cross on a red shield — will one day fly over all of Italy. Unify Piedmont, conquer Genoa, seize Rome, and found the Kingdom of Italy — the thousand-year dream of the House of Savoy is about to begin."
 sav_events.1.a: "Raise the glory of the House of Savoy!"

 sav_events.2.t: "The Glory of Turin"
 sav_events.2.d: "Under the rule of the House of Savoy, Turin is rapidly developing. With palaces and churches rising throughout the city and scholars and artists gathering here, this city is emerging as the cultural and political center of northern Italy. The flourishing of Turin as a capital befitting the House of Savoy will become the foundation for the prosperity of the entire realm."
 sav_events.2.a: "Turin is the shining capital of the House of Savoy"

 sav_woolens_of_piedmont: "Woolens of Piedmont"
 sav_woolens_of_piedmont_desc: "Piedmont is known as one of Italy's foremost producers of wool and cloth. Quality wool production and cloth processing form the commercial foundation of Savoyard wealth."

 sav_nebbiolo_vineyards: "Nebbiolo Vineyards"
 sav_nebbiolo_vineyards_desc: "The Nebbiolo grape grown in Piedmont's Langhe hills is the source of such renowned wines as Barolo and Barbaresco. Piedmontese wines are exported across Europe, generating great profits."

 sav_casa_savoia: "Authority of the House of Savoy"
 sav_casa_savoia_desc: "The rule of the House of Savoy has stabilized, and its authority is now widely recognized at home and abroad. Legitimate, stable governance is the foundation that elevates Savoy to a major Italian power."

 sav_ordinanza_piedmontese: "Ordinanza Piedmontese"
 sav_ordinanza_piedmontese_desc: "In the 15th century, Savoy established a unique infantry tactics doctrine — the Ordinanza Piedmontese — forged in the Alpine highlands. Disciplined pike formations are the backbone of Savoyard military strength."

 sav_university_of_turin: "University of Turin"
 sav_university_of_turin_desc: "Founded in 1404, the University of Turin serves as Piedmont's academic heart, teaching law, medicine, and theology. Savoy's intellectual heritage supports the blossoming of Renaissance culture."

 sav_corsica_seized: "Corsica Seized"
 sav_corsica_seized_desc: "Taking Corsica, long controlled by Genoa, greatly advances Savoyard command of the western Tyrrhenian Sea."

 sav_towers_of_sardinia: "Towers of Sardinia"
 sav_towers_of_sardinia_desc: "Since the Middle Ages, countless watchtowers (Torre Costiera) have lined the Sardinian coast. Developing and strengthening these defenses protects Sardinia from pirate incursions."

 sav_cagliari_development: "Development of Cagliari"
 sav_cagliari_development_desc: "Developing Cagliari, the capital of Sardinia, into an important harbor city and trading hub in the western Mediterranean."

 sav_tyrrhenian_sea: "Master of the Tyrrhenian Sea"
 sav_tyrrhenian_sea_desc: "Having seized both Corsica and Sardinia and built a powerful fleet, Savoy has established complete mastery of the Tyrrhenian Sea. Trade in the western Mediterranean falls under Savoyard protection."

 sav_languedoc: "Control of Languedoc"
 sav_languedoc_desc: "Seizing Languedoc, a key position in southern France. Taking the two great cities of Montpellier and Toulouse becomes a foothold for controlling all of southern France."

 sav_gascony: "Gascony Seized"
 sav_gascony_desc: "Gascony, centered on Bordeaux, is a rich wine-producing land facing the Atlantic. Severing its long historical relationship with England and adding this land to Savoyard territory."

 sav_lyon_gateway: "The Gateway of Lyon"
 sav_lyon_gateway_desc: "Located at the confluence of the Rhône and Saône rivers, Lyon is the commercial hub connecting southern and northern France. Seizing this city opens the route into the French interior."

 sav_loire_valley: "The Loire Valley"
 sav_loire_valley_desc: "The Loire Valley — the 'Garden of France' — where the châteaux of the French royal family once stood. Seizing Nantes and Tours signifies the conquest of central western France."

 sav_normandy_coast: "The Norman Coast"
 sav_normandy_coast_desc: "Seizing Normandy, the historic coast where the Normans once landed. Rouen, at the heart of this rich land, is a key position in northern France and the last barrier before Paris."

 STATIC_MODIFIER_NAME_sav_woolens_of_piedmont_mod: "Piedmontese Wool Industry"
 STATIC_MODIFIER_DESC_sav_woolens_of_piedmont_mod: "Piedmont was a superb wool-producing region, its sheep raised on the high Alpine pastures. The Biella district in particular was known from the Middle Ages to the present as one of Europe's finest sources of wool and fine cloth, and 'Piedmontese wool' stood alongside English wool as a mark of the highest quality."
 STATIC_MODIFIER_NAME_sav_nebbiolo_vineyards_mod: "Nebbiolo Vineyards"
 STATIC_MODIFIER_DESC_sav_nebbiolo_vineyards_mod: "From the Nebbiolo grape grown on the Langhe hills of Piedmont come Barolo, 'the king of wines,' and Barbaresco, 'the queen's wine.' The records of its cultivation go back to the 13th century, and it was prized even at the Savoyard court — the pride of Piedmont, still beloved worldwide as the summit of Italian wine."
 STATIC_MODIFIER_NAME_sav_casa_savoia_mod: "Authority of the House of Savoy"
 STATIC_MODIFIER_DESC_sav_casa_savoia_mod: "The House of Savoy is one of the longest-lived dynasties in Europe, tracing its origin to Humbert the White-Handed in the 11th century. Its survival for over seven hundred years as the 'oldest dynasty,' finally becoming the royal house of the Kingdom of Italy, shows a staying power rare in the history of European royal houses."
 STATIC_MODIFIER_NAME_sav_ordinanza_piedmontese_mod: "Ordinanza Piedmontese"
 STATIC_MODIFIER_DESC_sav_ordinanza_piedmontese_mod: "The 'Ordinanza Piemontese,' organized by the Duchy of Savoy in the 15th century, was a disciplined standing-army system centered on pike infantry. Drawing on the tactics of Swiss mercenaries while adding its own refinements, it became the foundation of the later Sardinian army and the forerunner of the armies that fought the wars of unification in the Risorgimento."
 STATIC_MODIFIER_NAME_sav_university_of_turin_mod: "Influence of the University of Turin"
 STATIC_MODIFIER_DESC_sav_university_of_turin_mod: "Founded in 1404, the University of Turin is one of the oldest universities in northern Italy. Beginning with three faculties — law, medicine, and theology — it went on to produce eminent minds such as Cesare Beccaria (the penal reformer) and Lagrange (the mathematician), becoming the intellectual heart of Enlightenment Piedmont."
 STATIC_MODIFIER_NAME_sav_corsica_seized_mod: "Corsica Seized"
 STATIC_MODIFIER_DESC_sav_corsica_seized_mod: "Corsica is a key to the western Mediterranean that Genoa had ruled since 1284. When Genoa sold it to France in 1768, Napoleon Bonaparte was born the following year as a 'Frenchman' — an irony of history. To seize this island would secure command of the western Tyrrhenian Sea."
 STATIC_MODIFIER_NAME_sav_towers_of_sardinia_mod: "Towers of Sardinia"
 STATIC_MODIFIER_DESC_sav_towers_of_sardinia_mod: "Along the coasts of Sardinia stand scattered the 'torri costiere' (coastal towers) built from the Middle Ages into the early modern era. This defensive system, raised to watch for Barbary pirate raids, numbered more than a hundred towers at its height and served as a network of alarms warning the islanders of danger."
 STATIC_MODIFIER_NAME_sav_cagliari_development_mod: "Prosperity of Cagliari"
 STATIC_MODIFIER_DESC_sav_cagliari_development_mod: "Cagliari (Karalis) is a port city founded by the Phoenicians and an important administrative center in Roman times. As the capital of Sardinia, at the middle of the Mediterranean, it became a trading hub with Tunisia, Spain, and Italy, and continued under Aragonese rule as a key point of western Mediterranean trade."
 STATIC_MODIFIER_NAME_sav_tyrrhenian_sea_mod: "Master of the Tyrrhenian Sea"
 STATIC_MODIFIER_DESC_sav_tyrrhenian_sea_mod: "The Tyrrhenian Sea is an inland sea of the Mediterranean, ringed by the Italian peninsula, Sicily, Corsica, and Sardinia — a sea of history where the ancient Phoenicians, Greeks, and Romans traded. By mastering Corsica and Sardinia, one may command the whole of this inland sea and gain a base for advance into the eastern Mediterranean."
 STATIC_MODIFIER_NAME_sav_languedoc_mod: "Control of Languedoc"
 STATIC_MODIFIER_DESC_sav_languedoc_mod: "Languedoc ('the land of the Oc tongue') refers to the Occitan-speaking region of southern France. This region, with Toulouse as its capital, boasted its own culture, politics, and religion (Catharism) until it was conquered by the French crown in the Albigensian Crusade of the 13th century. Its embers, together with Provence, still glow as a civilization unique to the south of France."
 STATIC_MODIFIER_NAME_sav_gascony_mod: "Gascony Seized"
 STATIC_MODIFIER_DESC_sav_gascony_mod: "Gascony is a region of southwestern France of Basque origin, known for the Atlantic wine trade of Bordeaux, the port of Bayonne, and Armagnac brandy. Closely bound to England since the marriage of Eleanor of Aquitaine, it was also the last main battleground of the Hundred Years' War."
 STATIC_MODIFIER_NAME_sav_lyon_gateway_mod: "Gateway of Lyon"
 STATIC_MODIFIER_DESC_sav_lyon_gateway_mod: "Lyon (Lugdunum) was founded as the capital of the Roman province of Gaul and is a crossroads of communication. In the Middle Ages it held the greatest periodic fairs in France after those of Champagne, where merchants of Italy, Flanders, and Germany gathered. Its position at the confluence of the Rhône and the Saône guaranteed its standing as a trading city by geographical necessity."
 STATIC_MODIFIER_NAME_sav_loire_valley_mod: "The Loire Valley"
 STATIC_MODIFIER_DESC_sav_loire_valley_mod: "In the Loire Valley, called the 'Garden of France,' stand Renaissance châteaux such as Chambord, Chenonceau, and Amboise. The French kings of the 15th and 16th centuries loved the region for its milder climate than Paris, its rich provisions, and its security for defense. To command this beautiful land means to hold the center of French culture."
 STATIC_MODIFIER_NAME_sav_normandy_coast_mod: "The Norman Coast"
 STATIC_MODIFIER_DESC_sav_normandy_coast_mod: "Normandy is the land the Vikings (Northmen, the Normans) were granted by the French king in 911. William the Conqueror's invasion of England in 1066, the greatest battlefield of the Hundred Years' War, the D-Day landings of 1944 — this land has always been a turning point of history. Rouen is also where Joan of Arc was executed."

 sav_events.3.t: "Formation of Sardinia-Piedmont"
 sav_events.3.d: "Having seized nearly all of Sardinia, the House of Savoy has decided to formally adopt the title of 'King of Sardinia.' In history (1720), Savoy acquired Sardinia as a result of the War of the Spanish Succession, establishing the 'Kingdom of Sardinia.' This dual kingdom of Sardinia-Piedmont would become the cradle of Italian unification. Combining continental Piedmont with the island of Sardinia, this kingdom will emerge as a major power in northern Italy."
 sav_events.3.a: "As King of Sardinia, become the standard-bearer of Italian unification!"

 sav_franchises: "Savoyard Franchises"
 sav_franchises_desc: "In medieval Piedmont, the House of Savoy granted town rights known as 'franchises' to various towns. Guaranteeing freedom of migration, peasant enfranchisement, and expanded merchant trading rights, this system stimulates urban competition and revitalizes Piedmont. Completing this mission allows granting the 'Savoyard Franchises' town rights to locations."
 sav_franchises_unlock_tt: "The city privilege 'Franchises' becomes available."

 sav_patria_legis: "Savoie-Val d'Aoste"
 sav_patria_legis_desc: "The 'Patria Legis' merges the traditional self-governance practices of the Val d'Aoste region with the governing ideals of the House of Savoy into a rational legal framework reflecting the Renaissance spirit. Completing this mission allows granting the 'Savoie-Val d'Aoste' town rights to locations."
 sav_patria_legis_unlock_tt: "The city privilege 'Patria Legis' becomes available."


 franchises: "Franchises"
 franchises_desc: "Town rights established by the House of Savoy guaranteeing freedom of pop migration, peasant enfranchisement, and expanded merchant trading rights."
 patria_legis: "Patria Legis"
 patria_legis_desc: "Town rights merging Val d'Aoste traditions with Savoyard legal principles, bringing urban prosperity, social mobility, and production efficiency."
