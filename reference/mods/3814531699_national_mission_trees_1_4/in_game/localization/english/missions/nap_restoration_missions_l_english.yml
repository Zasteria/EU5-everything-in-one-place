l_english:
 nap_restoration_mission_pack: "The Path of the Kingdom of Naples"
 nap_restoration_mission_pack_DESCRIPTION:0 "Having lost Sicily, the kingdom seeks reunification and the restoration of its power in the Mediterranean. Under the blood and splendor of the House of Anjou, build a new golden age centered on Naples."
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "Complete missions as the Kingdom of Naples, working toward the reunification of Sicily and the restoration of the Latin Empire."
 nap_restoration_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to walk the path of the Kingdom of Naples."
 nap_restoration_mission_pack_BUTTON_DETAILS:0 "Reunite the Kingdom of Sicily, torn in two, and carve your name into history as master of the western Mediterranean and heir to the old Latin Empire!"
