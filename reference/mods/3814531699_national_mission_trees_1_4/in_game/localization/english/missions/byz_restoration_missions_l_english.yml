l_english:
 byz_restoration_mission_pack: "Restoration of the Roman Empire"
 byz_restoration_mission_pack_desc: "Reclaim Constantinople, retake Anatolia and the Balkans, reunite the four Patriarchates, triumph in Rome, and restore the maximum extent of the old Roman Empire."
 byz_restoration_mission_pack_BUTTON_TOOLTIP:0 "Restore the Roman Empire's territories."
 byz_restoration_mission_pack_DESCRIPTION:0 "Save the crumbling empire and restore its former glory. As heir to the legacy of Rome, bring the old lands of East and West once more under the imperial banner."
 byz_restoration_mission_pack_BUTTON_DETAILS:0 "Rebuild the Byzantine Empire from the brink of collapse, and restore the Mediterranean world once ruled by Rome to its domain. Make the dream of Renovatio Imperii a reality!"
 byz_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "As Byzantium, reclaim the old Roman lands and achieve Renovatio Imperii."
 byz_retake_anatolia_west: "Retake Western Anatolia"
 byz_retake_anatolia_west_desc: "Retake Smyrna to restore imperial authority in western Anatolia."
 byz_retake_anatolia_east: "Retake Eastern Anatolia"
 byz_retake_anatolia_east_desc: "Conquer Ankara, Konya, and Sivas to bring all of Anatolia under imperial control. Governing the Greek-culture peoples who live here will call for a new approach to administration."
 byz_secure_greece: "Restore Greece"
 byz_secure_greece_desc: "Retake Athens and Corinth and revive Orthodoxy and Greek culture in Hellas."
 byz_balkan_dominance: "Balkan Mastery"
 byz_balkan_dominance_desc: "Conquer Belgrade and Tarnovo to restore imperial order across the Balkans."
 byz_invasion_of_syria: "Invasion of Syria"
 byz_invasion_of_syria_desc: "Conquer the lands of Syria, including Antioch, one of the five great Patriarchates. Ancient trade routes and rich production centers will bring new prosperity to the Empire."
 byz_protect_jerusalem: "Protection of Jerusalem"
 byz_protect_jerusalem_desc: "Retake the Holy Land where Christ suffered. The Roman Emperor has a duty as Guardian of the Holy Places. Establish a tolerant rule so that peoples of many faiths may live in peace upon this land."
 byz_dominion_of_aegyptus: "Dominion of Aegyptus"
 byz_dominion_of_aegyptus_desc: "Secure Alexandria and Cairo, the great seats of learning in Egypt. The fertile lands of the Nile will sustain the many peoples of the Empire."
 byz_control_aegean: "Mastery of the Aegean"
 byz_control_aegean_desc: "Secure Crete and build a powerful navy to hold complete mastery of the Aegean Sea."
 byz_retake_italy_south: "Retake Southern Italy"
 byz_retake_italy_south_desc: "Retake Naples and Sicily to establish a foothold on the Italian peninsula."
 byz_reclaim_rome: "Reclaim the Eternal City"
 byz_reclaim_rome_desc: "Retake the Eternal City of Rome. The time has come for the rightful successor of the Roman Empire to reclaim the western capital."
 byz_iberian_conquest: "Conquer Iberia"
 byz_iberian_conquest_desc: "Conquer Toledo and Cordoba to restore the old Hispania province to the empire."
 byz_north_africa: "Retake North Africa"
 byz_north_africa_desc: "Conquer Tunis, Tripoli, and Algiers to restore the old Africa province to the empire."
 byz_north_italy: "Northern Italy"
 byz_north_italy_desc: "Conquer Venice, Genoa, Milan, and Florence to unify the Italian peninsula under the Roman name."
 byz_invasion_of_france: "Invasion of France"
 byz_invasion_of_france_desc: "With Northern Italy and Iberia in hand, the Empire's gaze turns toward Gaul. Conquer the entire France region and complete the Empire's domain in the West."
 byz_renovatio_imperii: "Renovatio Imperii"
 byz_renovatio_imperii_desc: "The restoration of the empire. From Iberia to Gaul, from North Africa to Italy, from Asia Minor to the Balkans and the Holy Land. Requires 1000+ locations and 2000+ monthly income."
 byz_events.2.t: "The Prosperity of Smyrna"
 byz_events.2.d: "Smyrna and the ports of western Anatolia have been retaken. These ancient trading cities become once more the domain of Byzantine merchants, and Aegean commerce revives."
 byz_events.2.a: "Promote trade in Smyrna"
 byz_events.3.t: "Athens — Restoration of Hellas"
 byz_events.3.d: "Athens and Corinth have been retaken. The city of Socrates and Plato, the hill where the Parthenon stands, are Byzantine once more. Orthodox monasteries are rebuilt and Greek scholarship revives."
 byz_events.3.a: "Restore Orthodoxy and Greek culture in Hellas"
 byz_events.7.t: "Southern Italy Reclaimed"
 byz_events.7.d: "Naples and Palermo have been retaken. These lands, once flourishing as Magna Graecia, are part of the Roman Empire once more. Mediterranean trade wealth flows into the imperial treasury."
 byz_events.7.a: "Integrate southern Italy into the empire"
 byz_events.8.t: "The Eternal City — Entry into Rome"
 byz_events.8.d: "Rome — city of seven hills, place of Peter and Paul's martyrdom — has been reclaimed. As Constantine the Great once ruled the empire from this place, so once more a Roman Emperor sits in Rome. History has come full circle."
 byz_events.8.a: "Make the Eternal City the western capital"
 byz_events.10.t: "Renovatio Imperii"
 byz_events.10.d: "The restoration of the Roman Empire. From Iberia to Asia Minor, from North Africa to the Balkans, from Italy to the Holy Land. What Justinian the Great pursued from 527 to 565, what was dreamed throughout the Middle Ages — the restoration of the Roman Empire has at last become reality. The Mediterranean is once more Mare Nostrum."
 byz_events.10.a: "Proclaim the Renovatio Imperii to the world"
 byz_renovatio_unlock_tt: "Renovatio Imperii achieved."
 byz_reclaim_bursa: "Reclaim Bursa"
 byz_reclaim_bursa_desc: "Retake Bursa, once a major Byzantine city. Located at a key point of the Silk Road, this city's future industry is left to the Empire's decision."
 byz_avoid_collapse: "Avert the Collapse"
 byz_avoid_collapse_desc: "The Empire teeters on the edge of collapse. But if legitimacy and domestic stability can be maintained, the road to restoration is not yet closed."
 byz_events.20.t: "The Future of Bursa"
 byz_events.20.d: "In the workshops of Bursa, artisans debate a new course for production. Should they build on the city's long tradition of silk weaving, or focus on producing finer cloth? The Empire's decision will shape the city's future."
 byz_events.20.a: "Encourage silk production"
 byz_events.20.b: "Focus on fine cloth production"
 byz_events.21.t: "The Future of Nicomedia"
 byz_events.21.d: "Nicomedia, the key city on the southern shore of the Sea of Marmara, has returned to the Empire. The court debates what industry should define this city's future: promoting weapons production, or planting mulberry trees to begin silk production."
 byz_events.21.a: "Promote weapons production"
 byz_events.21.b: "Plant mulberry trees and begin silk production"
 byz_reclaim_nicomedia: "Reclaim Nicomedia"
 byz_reclaim_nicomedia_desc: "Nicomedia (Izmit) is a key city on the southern shore of the Sea of Marmara. Convert its RGO to silk production and rebuild the empire's silk economy. Securing 50%+ control marks the first step in restoring the Roman Empire."
 byz_orthodox_antioch: "Orthodoxize Antioch"
 byz_orthodox_antioch_desc: "Confirm that a majority of Antioch's population has converted to Orthodoxy. The city where the name 'Christian' was first used shall be filled once more with Orthodox light."
 byz_orthodox_jerusalem: "Orthodoxize Jerusalem"
 byz_orthodox_jerusalem_desc: "Confirm that a majority of Jerusalem's population has converted to Orthodoxy. The bells of the Church of the Holy Sepulchre ring with Orthodox liturgy."
 byz_orthodox_alexandria: "Orthodoxize Alexandria"
 byz_orthodox_alexandria_desc: "Confirm that a majority of Alexandria's population has converted to Orthodoxy. The traditions of the Coptic Church are integrated into the Orthodox framework."
 byz_orthodox_rome: "End of the Great Schism"
 byz_orthodox_rome_desc: "Confirm that a majority of Rome's population has converted to Orthodoxy. The split of 1054 ends — not through reconciliation, but through Orthodox triumph over Rome."
 byz_hellenic_athens: "Revival of the Parthenon"
 byz_hellenic_athens_desc: "Athens is the city of Athena. Once more offerings are made to the Olympian gods on the Acropolis, and the revival of Hellenic religion begins here."
 byz_hellenic_corinth: "Sanctuary of Poseidon at Corinth"
 byz_hellenic_corinth_desc: "At Corinth on the Isthmus of Corinth, Poseidon — guardian of the two seas — once had a great temple. Restore this sanctuary and draw the sea god's blessing to the empire."
 byz_hellenic_mystras: "Sanctuary of Apollo at Mystras"
 byz_hellenic_mystras_desc: "Mystras near Sparta is the spiritual heart of the Peloponnese. Restore the sanctuary of Apollo here and awaken the bold spirit of Sparta, carrying forward the memory of Delphi's oracle."
 byz_hellenic_alexandria: "Reconstruction of the Serapeum"
 byz_hellenic_alexandria_desc: "The Serapeum of Alexandria was once one of the greatest temples in the ancient world. Dedicated to Serapis — born of the fusion of Greek and Egyptian religion — rebuilding it establishes Hellenic religion in Egypt and draws together the ancient world's wisdom once more."
 byz_events.11.t: "Antioch — Return to the First Church"
 byz_events.11.d: "Antioch, where the name 'Christian' was first used, is now filled with Orthodox light. The memory of Peter and Paul's ministry here is revived, and the city takes on a new mission as a spiritual center of Orthodoxy."
 byz_events.11.a: "Place Antioch under Orthodox guardianship"
 byz_events.12.t: "Jerusalem — Orthodox Bells in the Holy City"
 byz_events.12.d: "The Holy City of Jerusalem, yearned for by all the Orthodox faithful, has become an Orthodox city. The Church of the Holy Sepulchre rings with Eastern liturgy once more. This is not merely conquest — it is the triumph of faith."
 byz_events.12.a: "Guard the Holy Land forever"
 byz_events.13.t: "Alexandria — Orthodoxization of the City of Learning"
 byz_events.13.d: "Alexandria, repository of ancient knowledge, has become an Orthodox city. The old traditions of the Coptic Church merge into the greater Orthodox stream, and dialogue between Neoplatonist philosophy and theology begins to bloom again."
 byz_events.13.a: "Develop Alexandria as a city of Orthodox learning"
 byz_events.14.t: "End of the Great Schism — Unity of the Churches"
 byz_events.14.d: "Since 1054, when Pope Leo IX and Patriarch Keroularios excommunicated each other, centuries have passed. Not through reconciliation, but through Orthodox conquest of Rome — the Great Schism ends. A majority of Rome's citizens have converted to Orthodoxy. The Eternal City becomes the western pillar of the Eastern Church. History chose Byzantine faith."
 byz_events.14.a: "Proclaim the end of the Great Schism to the world"
 byz_events.15.t: "The Parthenon — Revival of Athena"
 byz_events.15.d: "Once more, offerings are made to Athena on the Acropolis. The Parthenon, which had become a Christian church, is restored as a temple to the ancient gods. The people of Athens call on the Olympian gods by name, and the flame of Hellenism is rekindled."
 byz_events.15.a: "Guide the empire under the protection of Athena"
 byz_events.16.t: "Corinth — Poseidon of the Straits"
 byz_events.16.d: "On the hill of Corinth overlooking two seas, the temple of Poseidon is restored. The god of the isthmus has long protected merchants and sailors. With the restoration of his rites, Corinth becomes once more the spiritual center of Mediterranean trade."
 byz_events.16.a: "Prosper trade with Poseidon's blessing"
 byz_events.17.t: "Delos — Birthplace of the God of Light"
 byz_events.17.d: "On the sacred Aegean island of Delos, revered as the birthplace of Apollo and Artemis, the ancient temple is rebuilt. Pilgrims and priests gather from across the Aegean, and the spirit of ancient Greek reason and beauty is revived. The Neoplatonist empire that Plethon dreamed of begins to take shape."
 byz_events.17.a: "Light the empire with the radiance of Delos"
 byz_events.18.t: "The Serapeum — Completion of the Hellenic Revival"
 byz_events.18.d: "Alexandria — in this land where the Serapeum once stood, faith in the Hellenic gods has returned.\n\nWith the temple\'s reconstruction complete, the gods of Olympus descend once more upon the Nile\'s great land. The citizens of Alexandria resume ancient rites, and prayers to Serapis echo through the dawn sky.\n\nThis sacred revival sends waves of Hellenic faith across the Byzantine Empire — new converts arise in succession, the power of omens grows, and religious influence rises. Zeus, Apollo, Athena — all the gods bless the Empire\'s restoration."
 byz_events.18.a: "Make the Serapeum the holy city of the Hellenic world"
 byz_faith_choice: "The Choice of Faith"
 byz_faith_choice_desc: "A new age of ideas is dawning. At the court in Mystras, Neoplatonist teachings are debated, while in Constantinople the authority of the Orthodox Church is questioned. The empire stands at a spiritual crossroads."
 byz_faith_orthodox_chosen_tt: "Chose Orthodoxy"
 byz_faith_hellenic_chosen_tt: "Chose Hellenism"
 byz_events.19.t: "The Crossroads of Faith — Orthodoxy or Hellenism"
 byz_events.19.d: "Greece is reclaimed. From the Acropolis of Athens, Constantinople can be seen in the distance, and the ruins of ancient temples sleep in the Peloponnesian peaks. The restoration of the Byzantine Empire is not merely the recovery of territory — it is the rebuilding of a soul. Two voices contend in the imperial court. One belongs to the clergy: 'We are the people of Christ. We must rebuild the empire as guardians of the Orthodox Church.' The other belongs to Hellenic philosophers: 'Why worship a foreign god in the land of Plato and Aristotle? The ancient Greek gods are the true home of our souls.'"
 byz_events.19.a: "Guard the Orthodox Church — protect the Eastern tradition"
 byz_events.19.a.tt: "The Orthodox religious branch is unlocked. Proceed to missions to Orthodoxize Antioch, Jerusalem, Alexandria, and Rome."
 byz_events.19.b: "Revive the ancient gods — rekindle the Hellenic flame"
 byz_events.19.b.tt: "The Hellenic branch is unlocked. The empire converts to Hellenism and missions to restore sanctuaries in Athens, Corinth, Mystras, and Alexandria become available."
 byz_orthodox_path_start: "The Orthodox Path"
 byz_orthodox_path_start_desc: "The path of the Orthodox guardian is open. Proceed to reclaim and Orthodoxize the holy cities."
 byz_hellenic_path_start: "The Hellenic Path"
 byz_hellenic_path_start_desc: "The path of the ancient gods is open. Restore the sanctuaries of Hellas and rebuild ancient Greek civilization."
 byz_recovery_from_decline: "Recovery from Decline"
 byz_recovery_from_decline_desc: "Curb the power of the court nobility and restore the authority of the crown. As imperial authority recovers, stability in governance will follow."
 byz_city_the_world_desires: "The City the World Desires"
 byz_city_the_world_desires_desc: "Constantinople has once again grown into a great city that people from across the world long to see. Let this prosperity become permanent."
 byz_islamic_heartland: "The Heartland of Islam"
 byz_islamic_heartland_desc: "Mecca and Medina, the two holiest cities of Islam, have fallen into our hands. The Empire must now make a momentous decision regarding the fate of these holy sites."
 byz_events.22.t: "The Holy Sites of Islam"
 byz_events.22.d: "The Kaaba of Mecca and the Prophet's Mosque of Medina — the holiest sites in the Islamic world — now lie under imperial control. Should they be destroyed to demonstrate the supremacy of Orthodoxy, or accepted, allowing the Empire to profit from the wealth of pilgrims?"
 byz_events.22.a: "Destroy the holy sites"
 byz_events.22.b: "Accept the holy sites"
 STATIC_MODIFIER_NAME_byz_anatolia_west: "Western Anatolia Restored"
 STATIC_MODIFIER_DESC_byz_anatolia_west: "The diverse peoples of western Anatolia are gradually integrated into the Empire's culture."
 STATIC_MODIFIER_NAME_byz_anatolia_east: "Eastern Anatolia"
 STATIC_MODIFIER_DESC_byz_anatolia_east: "The diverse peoples of eastern Anatolia are gradually integrated into the Empire's culture."
 STATIC_MODIFIER_NAME_byz_greece_restored: "Hellas Restored"
 STATIC_MODIFIER_DESC_byz_greece_restored: "Athens, Thessalonica, the Peloponnese — the heartland of ancient Greek civilization and of Byzantine Greek culture. Winning these lands back, after Latin rule (the Frankish Duchy of Athens and others), the plunder of the Catalan Company, and conquest by the Ottomans, is the fulfillment of the thousand-year dream of a revived 'Hellenism.'"
 STATIC_MODIFIER_NAME_byz_balkan_order: "Balkan Order"
 STATIC_MODIFIER_DESC_byz_balkan_order: "Balkan manpower and military strength are reinforced."
 STATIC_MODIFIER_NAME_byz_syria_province: "The Province of Syria"
 STATIC_MODIFIER_DESC_byz_syria_province: "Syria was from antiquity a center of trade and craft as the western end of the Silk Road. Damascus steel, Aleppo soap, Syrian glassware — these famed goods were exported throughout the Mediterranean world. In the 4th to 7th centuries it was also the richest province of the Byzantine Empire, bringing enormous tax revenue."
 STATIC_MODIFIER_NAME_byz_judaea_province: "The Province of Judaea"
 STATIC_MODIFIER_DESC_byz_judaea_province: "Governing Judaea, home to the Holy Land, fosters greater tolerance toward the many faiths of the Empire."
 STATIC_MODIFIER_NAME_byz_aegyptus_province: "The Province of Aegyptus"
 STATIC_MODIFIER_DESC_byz_aegyptus_province: "The fertile lands of the Nile allow the Empire to sustain a larger population across all its territories."
 STATIC_MODIFIER_NAME_byz_aegean_mastery: "Aegean Mastery"
 STATIC_MODIFIER_DESC_byz_aegean_mastery: "In the harbors of the Aegean islands, the empire's warships and merchantmen drop anchor without cease, and the sea has once again become 'our sea.'"
 STATIC_MODIFIER_NAME_byz_rome_restored: "The Eternal City Restored"
 STATIC_MODIFIER_DESC_byz_rome_restored: "When the banner of Byzantium flew once more above the seven hills, the court at Constantinople knew that the empire had at last reached its summit."
 STATIC_MODIFIER_NAME_byz_hispania_province: "The Province of Hispania"
 STATIC_MODIFIER_DESC_byz_hispania_province: "The vast lands of Hispania send many soldiers to swell the ranks of the imperial army."
 STATIC_MODIFIER_NAME_byz_gallia_province: "The Province of Gaul"
 STATIC_MODIFIER_DESC_byz_gallia_province: "The Roman eagles fly once more above the plains of Gaul, and the soldiers on the banks of the Loire march with pride for an emperor far to the east."
 STATIC_MODIFIER_NAME_byz_true_rome: "True Rome"
 STATIC_MODIFIER_DESC_byz_true_rome: "The sails and wagons of the merchants of Venice, Genoa, and Milan now do their trade beneath the emperor's banner. The Italian peninsula is no longer a branch of Rome, but its trunk."
 STATIC_MODIFIER_NAME_byz_renovatio_imperii_mod: "Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_imperii_mod: "The Roman Empire fully restored — the roads Justinian dreamed of once more bind every corner of the realm, and the emperor's couriers ride to the far shores of the Mediterranean unhindered."
 # Byzantine additional missions
 STATIC_MODIFIER_NAME_byz_collapse_averted: "Collapse Averted"
 STATIC_MODIFIER_DESC_byz_collapse_averted: "The Empire has not yet fallen. Having weathered the crisis, the court eases the burden of stripping privileges from the powerful, reducing resistance to such reforms."
 STATIC_MODIFIER_NAME_byz_bursa_silk: "Bursa's Silk Trade"
 STATIC_MODIFIER_DESC_byz_bursa_silk: "In the mulberry groves of Bursa, the sound of silkworms spinning never ceases on the spring nights."
 STATIC_MODIFIER_NAME_byz_bursa_fine_cloth: "Bursa's Fine Cloth Trade"
 STATIC_MODIFIER_DESC_byz_bursa_fine_cloth: "From the looms of Bursa's workshops come one after another the fine fabrics that courtiers vie to obtain."
 STATIC_MODIFIER_NAME_byz_nicomedia_weaponry: "Nicomedia's Weapons Trade"
 STATIC_MODIFIER_DESC_byz_nicomedia_weaponry: "In the forges of Nicomedia, hammers ring day and night, and swords and armor for the imperial army are stacked high."
 STATIC_MODIFIER_NAME_byz_nicomedia_silk: "Nicomedia's Silk Trade"
 STATIC_MODIFIER_DESC_byz_nicomedia_silk: "Young mulberry trees have been planted on the hills around Nicomedia, awaiting the day the town will be famed as a home of silk."
 STATIC_MODIFIER_NAME_byz_hellenic_sanctuary: "Hellenic Sanctuary"
 STATIC_MODIFIER_DESC_byz_hellenic_sanctuary: "Offerings are laid once more in the sanctuary of the old gods, and the feet of pilgrims wear down the paving stones."
 STATIC_MODIFIER_NAME_byz_hellenic_serapeum: "The Serapeum"
 STATIC_MODIFIER_DESC_byz_hellenic_serapeum: "With the rebuilding of the Serapeum, Alexandria has become the spiritual center of the ancient world, and scholars and pilgrims alike gather before its gates."
 STATIC_MODIFIER_NAME_byz_schism_ended: "End of the Great Schism"
 STATIC_MODIFIER_DESC_byz_schism_ended: "Centuries after the mutual excommunications of 1054, the Churches of East and West have at last gathered about a single altar through the triumph of Orthodoxy."
 STATIC_MODIFIER_NAME_byz_islamic_sites_destroyed: "The Holy Sites Destroyed"
 STATIC_MODIFIER_DESC_byz_islamic_sites_destroyed: "The destruction of the Islamic holy sites has powerfully demonstrated the supremacy of Orthodoxy, strengthening faith in the state religion and the prestige of the Empire."
 STATIC_MODIFIER_NAME_byz_islamic_sites_accepted: "The Holy Sites Accepted"
 STATIC_MODIFIER_DESC_byz_islamic_sites_accepted: "By accepting the Islamic holy sites, tolerance toward heretics and heathens has grown, and merchant activity has flourished amid the influx of pilgrims."
 STATIC_MODIFIER_NAME_byz_recovery_from_decline_mod: "Recovery from Decline"
 STATIC_MODIFIER_DESC_byz_recovery_from_decline_mod: "The dark season of decline has passed, and the morning light shines again upon the emperor's court and the empire's farmlands."
 STATIC_MODIFIER_NAME_byz_city_the_world_desires_mod: "The City the World Desires"
 STATIC_MODIFIER_DESC_byz_city_the_world_desires_mod: "Constantinople rebuilt as the administrative center of the Empire."
 STATIC_MODIFIER_NAME_byz_africa_province_mod: "Africa Province"
 STATIC_MODIFIER_DESC_byz_africa_province_mod: "The imperial fleet has returned to the harbor of Carthage, and the dream of Justinian's age is once more drawn upon the sea."
 STATIC_MODIFIER_NAME_byz_renovatio_bonus_mod: "Glory of the Renovatio Imperii"
 STATIC_MODIFIER_DESC_byz_renovatio_bonus_mod: "The restoration of the Roman Empire recognized Byzantium as master of a world empire."
 STATIC_MODIFIER_NAME_byz_antioch_orthodox_mod: "Orthodoxy of Antioch"
 STATIC_MODIFIER_DESC_byz_antioch_orthodox_mod: "Antioch restored as an Orthodox holy site, raising the Empire's religious authority."
 STATIC_MODIFIER_NAME_byz_jerusalem_orthodox_mod: "Orthodoxy of Jerusalem"
 STATIC_MODIFIER_DESC_byz_jerusalem_orthodox_mod: "The Holy City of Jerusalem Orthodoxized, granting advantage in combat against heathens."
 STATIC_MODIFIER_NAME_byz_alexandria_orthodox_mod: "Orthodoxy of Alexandria"
 STATIC_MODIFIER_DESC_byz_alexandria_orthodox_mod: "Orthodox chant rings in the churches of Alexandria, and the markets overflow with the families of the faithful."
 STATIC_MODIFIER_NAME_byz_serapeum_restored_mod: "Serapeum Restored"
 STATIC_MODIFIER_DESC_byz_serapeum_restored_mod: "The Serapeum of Alexandria has been rebuilt, and the gods of Olympus descend once more upon the land of Egypt."
