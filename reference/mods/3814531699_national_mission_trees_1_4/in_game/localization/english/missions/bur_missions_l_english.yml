l_english:
 bur_crown_of_lothair_mission_pack: "The Crown of Lothair"
 bur_crown_of_lothair_mission_pack_DESCRIPTION:0 "1337: the Hundred Years' War is beginning. The Duchy of Burgundy, wedged between France and England, has the cunning and resources to play both sides — and ultimately to resurrect Lotharingia, the ancient Middle Kingdom of Charlemagne's heirs. Secure the court at Dijon, build the Order of the Golden Fleece, and dominate Flemish cloth trade; then navigate the war between England and France to extract maximum concessions before uniting Flanders, Franche-Comté, and Lorraine into a new 'Kingdom of Lotharingia.'"
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION:0 "As Burgundy, navigate the Hundred Years' War, consolidate internally, and restore Lotharingia."
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP:0 "Complete missions to claim the Crown of Lothair."
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS:0 "Survive between England and France — then surpass them both!"

 bur_duchy_of_burgundy: "Ambitions of the Duchy"
 bur_duchy_of_burgundy_desc: "1337: the House of Valois-Burgundy is rising as a cadet branch of the French royal house. Playing England and France against each other, the Duchy aims to expand into Flanders, Franche-Comté, and Lorraine. The Hundred Years' War is a once-in-a-generation opportunity for this small duchy to become a major power."

 bur_court_of_dijon: "The Court of Dijon"
 bur_court_of_dijon_desc: "The Burgundian court at Dijon was one of the most splendid in 15th-century Europe. Jan van Eyck and Rogier van der Weyden worked under Burgundian patronage, and the ducal library rivaled any in France. This 'Northern Renaissance' avant la lettre was built on Flemish cloth revenues and the duke's extravagant ambition."

 bur_flemish_cloth: "Flemish Cloth Industry"
 bur_flemish_cloth_desc: "The triangle of Bruges, Ghent, and Ypres was medieval Europe's greatest industrial region. English wool was shipped to Flanders, worked into fine draperies by skilled craftsmen, and sold throughout Europe at the Champagne fairs. This supply chain was Burgundy's economic backbone."

 bur_golden_fleece: "The Order of the Golden Fleece"
 bur_golden_fleece_desc: "Founded at Bruges in 1430 by Philip the Good, the Order of the Golden Fleece was the most prestigious chivalric order in Catholic Christendom — membership was reserved for monarchs and great princes. Based on the legend of Jason and the Argonauts, the order's badge (a golden fleece pendant) remained a supreme honor until the 19th century."

 bur_estates_general: "The Estates General"
 bur_estates_general_desc: "As a composite state ruling over Flanders, Brabant, and Franche-Comté — each with its own legal traditions — Burgundy needed representative institutions to govern effectively. The Estates General brought together the three orders across diverse regions under a single deliberative framework."

 bur_feast_of_pheasants: "The Feast of the Pheasant"
 bur_feast_of_pheasants_desc: "In 1454, shocked by the fall of Constantinople, Philip the Good staged the 'Feast of the Pheasant' at Lille — the most lavish banquet of the medieval age. Knights swore crusading vows over a living pheasant; Philip himself pledged to follow his king to the Holy Land. The crusade never sailed, but the feast cemented Burgundy's reputation as the guardian of Christian chivalry."

 bur_balance_of_power: "Between Two Realms"
 bur_balance_of_power_desc: "Burgundy's diplomatic genius lay in its position as balancer. A French vassal by feudal law, connected to the Empire by its eastern territories, and a potential English ally — Burgundy could tip the scales of the Hundred Years' War in either direction. This leverage was the foundation of Burgundian power."

 bur_ally_england: "Alliance with England"
 bur_ally_england_desc: "After the murder of John the Fearless on the bridge of Montereau in 1419, Burgundy threw its weight behind England. The resulting Treaty of Troyes (1420) declared Henry V heir to the French crown — an outcome inconceivable without Burgundian support. The Burgundian-English alliance was one of the decisive military partnerships of the Hundred Years' War."

 bur_treaty_of_troyes: "The Treaty of Troyes"
 bur_treaty_of_troyes_desc: "The Treaty of Troyes, backed by Burgundy, made Henry V the regent and heir of France. Securing Reims (where French kings were crowned) and Paris (the capital) makes Burgundy the de facto master of France — the ultimate vindication of the English alliance."

 bur_ally_france: "Reconciliation with France"
 bur_ally_france_desc: "At the Congress of Arras in 1435, Philip the Good switched sides — abandoning England and reconciling with Charles VII. In return Burgundy received formal exemption from homage and the cession of strategic towns. This diplomatic pirouette made Burgundy the ultimate winner of the Hundred Years' War."

 bur_treaty_of_arras: "The Spirit of Arras"
 bur_treaty_of_arras_desc: "The Treaty of Arras (1435) was Burgundy's greatest diplomatic triumph — Charles VII was humiliated into a public apology while Philip walked away with territorial gains and a waived homage. Using this breathing room, Burgundy could focus on consolidating Lorraine and completing the Middle Kingdom."

 bur_flanders_in_the_war: "Flanders in the Hundred Years' War"
 bur_flanders_in_the_war_desc: "The County of Flanders was one of the most fiercely contested territories of the Hundred Years' War. England supplied wool to Flemish cloth towns and held strong economic influence there; Flemish cities often sided with England against France. Yet France claimed the Count of Flanders as a vassal. Burgundy, dependent on Flemish cloth revenues, needed to draw this pivotal region into its orbit."

 bur_integrate_brabant: "The Road to Brussels"
 bur_integrate_brabant_desc: "Antwerp, Brabant's commercial capital, would become the greatest trading city in northern Europe by the late 15th century. The Plantin printing house, diamond trade, and Spanish silver exchanges — all centered here. Securing Brabant completes Burgundian mastery of the Low Countries."

 bur_integrate_franche_comte: "Seize Dole"
 bur_integrate_franche_comte_desc: "Dole, the capital of Franche-Comté, was home to the University of Dole (founded 1422) — supported by the Burgundian ducal house. Securing this city means effective control of all Franche-Comté and opens the route toward Lorraine."

 bur_expand_into_lorraine: "Expand into Lorraine"
 bur_expand_into_lorraine_desc: "Nancy was the capital of the Duchy of Lorraine. Charles the Bold died at the Battle of Nancy in 1477 obsessing over this city — here the player writes a different ending. Seizing Nancy opens the road to Luxembourg and secures the Burgundian corridor between the Netherlands and the heartland."


 bur_crown_of_lothair: "The Crown of Lothair"
 bur_crown_of_lothair_desc: "In 843, the Treaty of Verdun created Lotharingia — the Middle Kingdom stretching from Flanders to Italy along the Rhine. Swallowed by France and Germany at the Treaty of Mersen in 870, this kingdom vanished from history for a thousand years. Now the House of Burgundy restores it: not as France, not as Germany, but as something new — the resurrection of the Carolingian center."
 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "The Court of Dijon"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "The Burgundian court at Dijon attracted Jan van Eyck, Rogier van der Weyden, and the finest musicians and poets of the age — making it the cultural capital of northern Europe and a pioneer of the Flemish painting tradition that would transform Western art."

 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "Flemish Cloth Industry"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "The cloth triangle of Bruges, Ghent, and Ypres was the engine of medieval Europe's largest industrial economy. Flemish draperies were the benchmark of quality across Europe, and control of this industry gave Burgundy financial resources that rivaled any kingdom."
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "Order of the Golden Fleece"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "Founded in 1430, the Order of the Golden Fleece was the most exclusive honor in Christendom — its membership list read like a roll call of European royalty. Granting the fleece gave Burgundy diplomatic leverage over kings and emperors alike."
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "The Estates General"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "Burgundy's Estates General unified the three orders across Flanders, Brabant, and Burgundy proper into a single deliberative assembly — an early model of representative government that influenced the later Dutch Republic and French revolutionary bodies."
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "Vow of the Pheasant"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "At the greatest banquet of the medieval age, Philip the Good swore over a living pheasant to lead a crusade against the Ottomans. The vow was never fulfilled, but the spectacle announced Burgundy as Christendom's foremost chivalric power and deepened its ties with the Papacy."
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "Between Two Realms"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "Playing the balancer between England and France, Burgundy refuses full submission to either overlord and exploits the ambiguity of its feudal obligations. The chaos of the Hundred Years' War creates the perfect opportunity to build independent military power while keeping both sides at arm's length."
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "The English Alliance"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "After Montereau, Burgundy and England formed the most consequential military alliance of the Hundred Years' War. Together they occupied Paris and nearly extinguished the Valois line — only Joan of Arc's intervention reversed the tide."
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "Treaty of Troyes"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "The Burgundian-backed Treaty of Troyes made Henry V heir to France — the high-water mark of Anglo-Burgundian power. Building on this triumph, Burgundy positions itself as the true ruler of the French realm."
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "The French Alliance"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "The Congress of Arras (1435) was Burgundy's diplomatic masterpiece — abandoning England at the moment of maximum leverage and extracting humiliating concessions from a desperate Charles VII. Burgundy emerged as the indispensable partner of the eventual French victor."
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "Treaty of Arras"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "At Arras, Philip the Good extracted a formal apology from Charles VII and gained territory, while waiving the requirement of personal homage. This made Burgundy effectively independent while remaining nominally within the French feudal order — the perfect diplomatic outcome."
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "The Crown of Lothair"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "Lost in 870, the Kingdom of Lotharingia is reborn after a thousand years. From Flanders to Franche-Comté, from Lorraine to Burgundy proper, the House of Burgundy has assembled the Middle Kingdom that Charlemagne's grandsons could not keep. Europe has a new center of gravity."

 bur_events.1.t: "Ambitions of the Duchy of Burgundy"
 bur_events.1.d: "1337: the opening shots of the Hundred Years' War are about to ring out. Edward III of England is pressing his claim to the French throne — but Burgundy watches from its unique vantage point between the two giants. A cadet branch of the French Valois house, yet possessed of mighty Flanders, an elite chivalric tradition, and revenues that match any kingdom — Burgundy is the fulcrum on which this war will turn. From the splendid court at Dijon to the teeming cloth halls of Bruges and Ghent, the Duchy harbors the greatest ambitions of any power in Europe. The question is which side to back — or whether to back either side at all."
 bur_events.1.a: "Burgundy will choose its own path between England and France!"

 bur_events.2.t: "The Feast of the Pheasant"
 bur_events.2.d: "At Lille in 1454, Duke Philip staged the most extraordinary banquet of the medieval age. A living pheasant was carried into the hall adorned with a golden collar; before it, the assembled knights of Burgundy swore crusading vows by God, the Virgin, and the pheasant itself. Philip pledged to follow his king to the Holy Land. Stage machinery produced a chapel, a ship, and a castle on the dining tables. Jugglers, poets, and musicians competed for attention. The crusade never sailed — but no one in Europe doubted that Burgundy was Christendom's foremost guardian of knightly virtue."
 bur_events.2.a: "We swear before God and the Pheasant to defend Christendom!"

 bur_events.3.t: "The Crown of Lothair"
 bur_events.3.d: "In 843, the Treaty of Verdun divided Charlemagne's empire among his three grandsons. The middle portion — stretching from Flanders to Italy along the Rhine — went to Lothair I and became 'Lotharingia.' In 870, the Treaty of Mersen erased it, splitting it between France and Germany. For a thousand years, the Middle Kingdom was no more than a memory — a ghost haunting the boundaries of France and the Empire. Now the House of Burgundy, by cunning and arms, has rebuilt what the Carolingians could not hold. Let the Crown of Lothair pass to its rightful heir."


 bur_council_of_mechelen: "The Great Council of Mechelen"
 bur_council_of_mechelen_desc: "Philip the Good's advisors established at Mechelen a 'Great Council' with jurisdiction over all Burgundian territories — a supreme court standing above the separate legal traditions of Flanders, Brabant, and Franche-Comté. This was the institutional cornerstone of genuine centralization."
 bur_siege_of_calais: "Calais Seized"
 bur_siege_of_calais_desc: "Calais was England's last foothold on the French mainland — held from 1347 to 1558. Rodin's famous 'Burghers of Calais' commemorates its heroic surrender. Seizing this strategic port gives Burgundy control of the Channel crossing and maximizes the value of the English alliance."
 bur_hainaut_namur: "Inherit Hainaut and Namur"
 bur_hainaut_namur_desc: "Philip the Good purchased Namur in 1421 and inherited Hainaut in 1433 — completing the land bridge between Flanders and Brabant. These counties with their textile towns and strategic river crossings formed the connective tissue of the Burgundian Netherlands."
 bur_holland_zeeland: "Holland and Zeeland"
 bur_holland_zeeland_desc: "The counties of Holland and Zeeland — with their herring fisheries, new commercial towns like Amsterdam, and excellent harbors — were acquired by Philip the Good in 1428. These territories would become the heartland of the Dutch Republic; under Burgundy, they are the engine of a North Sea commercial empire."
 bur_luxemburg: "Luxembourg"
 bur_luxemburg_desc: "Philip the Good conquered the Duchy of Luxembourg in 1443 after a campaign against Sigismund of the Habsburg line. One of the strongest fortresses in the Empire, Luxembourg was the eastern anchor of the Burgundian Netherlands — and the gateway to Lorraine and Alsace."
 bur_dominate_rhine: "The Rhine"
 bur_dominate_rhine_desc: "The Rhine has been the spine of European civilization from Rome to the present. To hold the river from the Netherlands to Alsace is to hold Charlemagne's heartland — the Rhineland where the Carolingian empire was administered, where cathedral cities rose, where the greatest medieval trade routes converged."

 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "Great Council of Mechelen"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "The Great Council at Mechelen was Burgundy's answer to the problem of ruling a composite state with divergent legal traditions. By creating a supreme court above Flemish, Brabantine, and Burgundian law alike, Philip's counselors built the institutional foundation for genuine centralization."
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "The Free Port of Calais"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "Calais, at the narrowest point of the English Channel, has been the key transit hub connecting North Sea, Baltic, and Mediterranean trade since antiquity. England held it for over two centuries for exactly this commercial value. Burgundy now develops Calais into the premier cloth-trading entrepôt of northern Europe."
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "Luxembourg"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "The fortress-duchy of Luxembourg, one of the strongest positions in the Empire, gave Burgundy its eastern anchor. Its acquisition in 1443 completed the encirclement of the Meuse valley and opened the road to Lorraine and Alsace."
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "The Rhine"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "From the delta to the vineyards, the Rhine is now Burgundian. The greatest river of the Carolingian heartland, the trade route of medieval Europe, the border between civilization and the forest — all are under one flag."

 bur_join_hre: "Join the Holy Roman Empire"
 bur_join_hre_desc: "Burgundy has the opportunity to be formally recognized as a prince of the Holy Roman Empire. A dual status — vassal of France and imperial prince — would give Burgundy a uniquely powerful diplomatic position. In 1473, Charles the Bold negotiated with Frederick III at Trier for elevation to a 'Kingdom of Burgundy' within the Empire — only for the Emperor to withdraw at the last moment. Now the chance comes again."
 bur_franchecomte_fiefdom: "Marriage with Franche-Comté"
 bur_franchecomte_fiefdom_desc: "In the 13th century, the House of Burgundy forged deep ties with the Counts of Franche-Comté through marriage. Duke Otto IV of Burgundy married Countess Mahaut of Artois and secured Franche-Comté's allegiance to Burgundy. The salt mines, iron ore, and University of Dole of this 'Free County' make it a vital gateway for Burgundy's eastward expansion toward Switzerland and Lorraine."
 bur_events.4.t: "The Holy Roman Empire"
 bur_events.4.d: "Burgundy has always occupied a liminal position — a vassal of France by feudal law, yet connected to the Empire through its eastern territories. The Emperor's favor opens the path to formal membership. In 1473, Charles the Bold met Frederick III at Trier and negotiated for 'Kingdom of Burgundy' status within the Empire — only for the Emperor to board his barge at dawn and sail away without signing. Now, with relations sufficiently warm, the door stands open again."
 bur_events.4.a: "Join the Empire and become an imperial prince"
 bur_events.4.b: "Preserve our independence for now"
 bur_events.5.t: "Marriage with Franche-Comté"
 bur_events.5.d: "In the 13th century, the Burgundian duke Otto IV married into the comital house of Franche-Comté, binding this wealthy 'Free County' to Burgundy through blood. The salt mines of the Jura, the iron forges, the University of Dole, and the mountain passes controlling the routes to Switzerland and Lorraine — all have been part of the Burgundian world for generations. The time has come to formalize what marriage has already created."
 bur_events.5.a: "Use the bonds of marriage to receive Franche-Comté as an enfeoffed subject"
 bur_events.5.b: "Maintain the marital bonds while respecting their autonomy"

 bur_events.6.t: "Flanders in the Hundred Years' War"
 bur_events.6.d: "The County of Flanders occupies a unique position in the Hundred Years' War. Flemish cloth production cannot function without English wool, and the wealthy citizens of Bruges, Ghent, and Ypres value their English trading relationship above all. France claims the Count as a vassal, but Flemish townspeople resist French domination and have repeatedly sided with England. By drawing Flanders into the Burgundian orbit, the duke can harness the wealth of these cloth cities. The choice: enfeoff Flanders as a Burgundian subject, or deepen ties while respecting its independence."
 bur_events.6.a: "Receive Flanders as a Burgundian vassal"
 bur_events.6.b: "Respect Flemish independence while deepening the alliance"

 bur_nevers_union: "Union with Nevers"
 bur_nevers_union_desc: "The County of Nevers lies to the south of Flanders and has historical ties to the Burgundian ducal house. With Flanders firmly in hand, establishing a claim on Nevers extends Burgundy's sphere of influence southward. The lands between Flanders and Nevers form a corridor for future expansion into France."
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "The Low Countries Unified"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "The commercial network of the Low Countries — connecting Holland, Zeeland, Brabant, and Flanders — has been unified. The commercial power of Antwerp and Amsterdam that forms the basis of the later Dutch Golden Age."

 bur_events.3.a: "Rise as the restored Kingdom of Lotharingia"
 bur_events.3.b: "Remain as Burgundy and claim the imperial title (status quo)"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "Lotharingia Reborn"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "The Kingdom of Lotharingia, successor to Middle Francia, has been revived six centuries after its fall in 869. Heir to Charlemagne's empire, this kingdom is recognized as a third imperial power standing between the Holy Roman Empire and the Kingdom of France."
