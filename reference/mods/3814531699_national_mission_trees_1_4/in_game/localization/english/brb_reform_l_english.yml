l_english:
 brb_estates_balance_reform: "The Balance of Nobles and Burghers"
 brb_estates_balance_reform_desc: "Feudal nobility or commercial burghers — whichever voice speaks louder shapes the character of the grand duchy's rule. The greater the nobles' influence, the stronger the feudal order and tax power; the greater the burghers' influence, the stronger commercial prosperity."
