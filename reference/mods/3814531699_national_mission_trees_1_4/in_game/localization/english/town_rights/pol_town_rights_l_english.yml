l_english:
 pol_royal_breadbasket_town_rights: "Polish Royal Breadbasket"
 pol_royal_breadbasket_town_rights_desc: "This location has been entrusted with gathering the grain of the realm for export down the Vistula; its granaries have been expanded for the task. Grain flows inward from the estates of the nobility and outward to the Baltic ports, sustaining citizens and merchants alike."
