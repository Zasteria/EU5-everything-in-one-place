l_japanese:
 bra_quality_doctrine_reform: "精鋭主義の軍制"
 bra_quality_doctrine_reform_desc: "少数精鋭を旨とする軍制——質の高い兵士と巧みな召集軍運用によって、少ない兵力でも大軍に対抗する。維持費は嵩むが、その戦闘力は並ぶ者なし。"
 bra_quantity_doctrine_reform: "総動員の軍制"
 bra_quantity_doctrine_reform_desc: "「プロイセンは軍を持つ国家ではなく、国家を持つ軍である」——質より量、圧倒的な動員力によって敵を押し潰す軍制。維持は安価だが、練度と士気にはやや難がある。"
 bra_advanced_quality_doctrine_reform: "アウフトラークスタクティーク"
 bra_advanced_quality_doctrine_reform_desc: "「委任戦術」——現場指揮官の自律的判断に権限を委ね、状況に応じた迅速な行動を可能にする戦術思想。歩兵・砲兵のあらゆる兵科において最高水準の練度を誇る軍が、質による圧倒的優位を確立する。維持費と人的資源の消耗は大きいが、その戦闘力に並ぶ軍は存在しない。"
 bra_advanced_quantity_doctrine_reform: "国民皆兵主義"
 bra_advanced_quantity_doctrine_reform_desc: "全国民を兵として組み込む、国家総動員の軍制——安価な維持費と潤沢な人的資源、広大な戦線展開能力によって、数の力で敵を圧殺する。練度と規律にはなお課題が残る。"
 bra_german_empire_reform: "ドイツ帝国の統治体制"
 bra_german_empire_reform_desc: "皇帝を頂点とし、諸邦の連合体でありながら中央集権的な権威を併せ持つ、ドイツ帝国独自の統治構造——王権の正統性と威信を高め、通商の主導権と柔軟な内政運営を可能にする。"
