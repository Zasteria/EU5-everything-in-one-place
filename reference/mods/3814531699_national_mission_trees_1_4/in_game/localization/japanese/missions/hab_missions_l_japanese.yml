 hab_stadtrechtsbriefe: "シュタットレヒツブリーフの発布"
 hab_stadtrechtsbriefe_desc: "シュタットレヒツブリーフ——「都市法特許状」。ハプスブルク皇帝の強力な王室権力のもとで各都市に特権を付与する——ウィーンにはウィーン法を、帝国各地にはラントシュタットの権利を。"
 hab_stadtrechtsbriefe_unlock_tt: "ウィーン法とラントシュタットの都市特権が使用可能になる。"
 hab_innsbruck_court: "インスブルックの宮廷"
 hab_innsbruck_court_desc: "インスブルック——チロルの中心都市が都市として成熟した今、ここに宮廷を整備してハプスブルク帝国のアルプス文化の中枢とせよ。"
 hab_swarovski_crystal: "スワロフスキーのクリスタル"
 hab_swarovski_crystal_desc: "1737年以降、インスブルックのガラス工芸師たちが精緻なクリスタル加工技術を確立した——スワロフスキーが生まれるはるか前から、チロルのクリスタルは欧州の宮廷を彩る。"
 STATIC_MODIFIER_NAME_hab_innsbruck_loc_mod: "インスブルック宮廷の整備"
 STATIC_MODIFIER_DESC_hab_innsbruck_loc_mod: "インスブルックがハプスブルク帝国のアルプス文化の中枢として輝き始めた。"
 STATIC_MODIFIER_NAME_hab_swarovski_mod: "チロルのクリスタル産業"
 STATIC_MODIFIER_DESC_hab_swarovski_mod: "インスブルックのガラス工芸師たちが精緻なクリスタル加工技術を確立した。"
 STATIC_MODIFIER_NAME_wiener_stadtrecht_town_rights: "ウィーン法"
 STATIC_MODIFIER_DESC_wiener_stadtrecht_town_rights: "ウィーンに付与される特別な都市特権——交易と市場の優位がウィーンの繁栄を支える。"
 STATIC_MODIFIER_NAME_landstadt_town_rights: "ラントシュタット"
 STATIC_MODIFIER_DESC_landstadt_town_rights: "帝国各地の都市に付与される特権——王室権力と貴族の影響力のバランスを保ちながら交通網を整備する。"
