l_japanese:
 hab_habsburg_mission_pack: "ハプスブルク家の覇権と普遍帝国へ"
 hab_habsburg_mission_pack_DESCRIPTION:0 "ドナウ川のほとりから——ハプスブルク家の野望は全欧州へ。神聖ローマ皇帝の座を確保し、東方にハンガリーを、西方にフランスとスペインを、南方にイタリアを制覇せよ。そしてウィーンを世界最大の都市として輝かせ、普遍帝国を実現せよ。"
 hab_habsburg_mission_pack_CRITERIA_DESCRIPTION:0 "HREを統治し、西方・東方・イタリアを制覇して普遍帝国を実現せよ。"
 hab_habsburg_mission_pack_BUTTON_TOOLTIP:0 "ハプスブルク家の覇権で欧州を統一せよ。"
 hab_habsburg_mission_pack_BUTTON_DETAILS:0 "「幸いなるかなオーストリア、汝は婚姻せよ！」——外交と征服の両輪で欧州の覇者となれ！"
 hab_habsburg_ascendancy: "ハプスブルク家の台頭"
 hab_habsburg_ascendancy_desc: "ルドルフ・フォン・ハプスブルクの血がドナウ川沿いで脈打つ——外交と征服の時代が始まった。"
 hab_secure_electors: "選帝侯の確保"
 hab_secure_electors_desc: "神聖ローマ皇帝の座は選帝侯の選挙で決まる。同盟か、それとも圧倒的な勢力で——ハプスブルク家の皇帝継続を確実にせよ。"
 hab_imperial_authority: "帝国の権威確立"
 hab_imperial_authority_desc: "神聖ローマ帝国の権威がハプスブルク家の意志のもとに集中する——帝国全土がウィーンの命令に従う時が来た。"
 hab_counter_reformation: "対抗宗教改革"
 hab_counter_reformation_desc: "マルティン・ルターの異端がドイツを揺さぶる——トリエント公会議の決議を実施してカトリック信仰を守護せよ。"
 hab_charlemagne_legacy: "シャルルマーニュの遺産"
 hab_charlemagne_legacy_desc: "カール大帝が1000年前に統一した南ドイツをハプスブルク家の旗のもとに取り戻せ——帝国改革の基盤が整う。"
 hab_imperial_reform: "帝国改革"
 hab_imperial_reform_desc: "帝国改革——統治機構の整備でハプスブルク家の支配を永続させよ。"
 hab_emperors_of_rome: "ローマ皇帝の後継者"
 hab_emperors_of_rome_desc: "シャルルマーニュ以来の夢——永遠の都ローマとHREの支配でハプスブルクが「ローマ皇帝の後継者」として宣言する。"
 hab_reclaim_burgundy: "ブルゴーニュ回収"
 hab_reclaim_burgundy_desc: "ロレーヌとブルゴーニュ——かつてハプスブルク家の領土だった西方の地を取り戻せ。"
 hab_austrian_netherlands: "オーストリア領ネーデルランド"
 hab_austrian_netherlands_desc: "フランドルとブラバントの豊かな商業都市群——低地諸国の富がハプスブルク帝国の財政を支える。"
 hab_weaken_france: "フランス弱体化"
 hab_weaken_france_desc: "宿敵フランス——この欧州覇権の最大の障害を弱体化させてドイツ・イタリアへの干渉力を削げ。"
 hab_defeat_france: "フランスの打倒"
 hab_defeat_france_desc: "「ガリアは落ちた」——宿敵フランスがハプスブルク家に敗れた。西欧の覇権はハプスブルク家のものだ。"
 hab_iberian_marriage: "イベリア半島との婚姻外交"
 hab_iberian_marriage_desc: "「幸いなるかなオーストリア、汝は婚姻せよ」——スペインとポルトガルとの婚姻で太陽の沈まない帝国の扉が開く。"
 hab_crown_of_spain: "スペイン王冠"
 hab_crown_of_spain_desc: "イベリア半島全土——ハプスブルク家の「スペイン王」宣言で太陽の沈まない帝国が実現し始めた。"
 hab_italian_ambition: "イタリアの野望"
 hab_italian_ambition_desc: "北イタリアの富裕な都市国家群——ミラノ・ヴェネツィア・ナポリをハプスブルク家の支配下に置け。"
 hab_duchy_of_milan: "ミラノ公国の掌握"
 hab_duchy_of_milan_desc: "ミラノ——北イタリアの心臓都市。この経済・軍事の要衝を掌握してイタリア征服の拠点を確立せよ。"
 hab_papal_alliance: "教皇との関係"
 hab_papal_alliance_desc: "ローマ教皇——カトリック世界の精神的権威との関係を確立してハプスブルク家の正統性を高めよ。"
 hab_venetian_ports: "ヴェネツィアの港湾"
 hab_venetian_ports_desc: "「アドリア海の女王」ヴェネツィア——その港湾と艦隊を掌握して地中海交易への参入を確立せよ。"
 hab_king_of_naples: "ナポリ王"
 hab_king_of_naples_desc: "ナポリ王国——南イタリアの要。この王冠がハプスブルク家のイタリア全土支配への第一歩となる。"
 hab_king_of_italy: "イタリア王"
 hab_king_of_italy_desc: "「鉄の王冠」がハプスブルク皇帝の頭上に輝く——ロンバルディアからシチリアまでイタリア全土が統一された。"
 hab_eastern_ambitions: "東方への野望"
 hab_eastern_ambitions_desc: "ボヘミアとハンガリー——東欧の二大強国に対する請求権を確立してハプスブルク家の東方拡張を開始せよ。"
 hab_crown_of_bohemia: "ボヘミア王冠"
 hab_crown_of_bohemia_desc: "プラハのヴァーツラフ王冠——この王冠がハプスブルク家の東方拡張の基盤となる。"
 hab_royal_hungary: "王立ハンガリー"
 hab_royal_hungary_desc: "ブダがオスマンから解放された——ハンガリー王冠がハプスブルク皇帝の頭上に戻り「王立ハンガリー」が誕生した。"
 hab_bohemian_union: "ボヘミア同君連合の統合"
 hab_bohemian_union_desc: "ボヘミアとの同君連合が深化した——今こそ統合された王冠領として直接統治するか、現状を維持するかを選べ。"
 hab_secure_croatia: "クロアチア確保"
 hab_secure_croatia_desc: "クロアチアに軍事国境線を設置してオスマン帝国の侵入を食い止め、バルカン征服の足がかりとせよ。"
 hab_ottoman_menace: "オスマンの脅威"
 hab_ottoman_menace_desc: "オスマン帝国——コンスタンティノープルを陥落させた東欧最大の敵。ハプスブルク家がその防壁となりキリスト教世界を守護せよ。"
 hab_liberate_balkans: "バルカン解放"
 hab_liberate_balkans_desc: "バルカン半島のキリスト教徒をオスマンの支配から解放せよ——正教徒の声がハプスブルクの名を呼んでいる。"
 hab_emperors_of_east: "東の皇帝"
 hab_emperors_of_east_desc: "コンスタンティノープル——東西ローマ帝国の首都がハプスブルク家の手に。これで東と西、両方の皇帝位が統合された。"
 hab_austrian_heartland: "オーストリア本国の確立"
 hab_austrian_heartland_desc: "ドナウ川沿いのオーストリア本国——帝国拡張の心臓部を固め経済・軍事の基盤を確立せよ。"
 hab_tyrol_styria: "チロルとシュタイアーマルク"
 hab_tyrol_styria_desc: "シュワーツの銀とレーオベンの鉄——チロルとシュタイアーマルクの鉱業がハプスブルク帝国の財政と軍事を支える。"
 hab_dev_vienna: "ウィーンの発展"
 hab_dev_vienna_desc: "「音楽の都」「白いハプスブルクの都市」——ウィーンを帝国の首都にふさわしい輝きで満たせ。"
 hab_graz_fortress: "グラーツの要塞化"
 hab_graz_fortress_desc: "グラーツ——シュタイアーマルクの首都をオスマン帝国の侵入に備えた難攻不落の要塞都市として整備せよ。"
 hab_baroque_vienna: "バロックのウィーン"
 hab_baroque_vienna_desc: "ウィーン宮廷でバロック音楽・建築・絵画が花開く——大学と芸術アカデミーがハプスブルク帝国文化の黄金時代を告げる。"
 hab_great_vienna: "偉大なるウィーン"
 hab_great_vienna_desc: "シェーンブルン宮殿・ステファン大聖堂——ウィーンが欧州最大・最美の都市として完成した。"
 hab_swiss_lands: "スイスの奪還"
 hab_swiss_lands_desc: "ウィリアム・テルに象徴される屈辱をすすいで——アルプスの農民たちの国をハプスブルク家に取り戻せ。"
 hab_south_german_cities: "南ドイツの商業都市"
 hab_south_german_cities_desc: "アウクスブルクとフランクフルト——フッガー家とロスチャイルド家が生まれたこの富裕な都市群を掌握せよ。"
 hab_unify_germany: "ドイツ統一"
 hab_unify_germany_desc: "バラバラのドイツ諸侯国が——今、ハプスブルクの旗のもとに一つとなった。"
 hab_north_sea_trade: "北海交易"
 hab_north_sea_trade_desc: "ハンブルクとアムステルダム——北海交易を掌握してハンザ同盟に代わる新たな商業帝国を建設せよ。"
 hab_hegemon_of_west: "西方の覇者"
 hab_hegemon_of_west_desc: "フランスもスペインも——かつてハプスブルク家に挑んだ西方の強国が全て平定された。"
 hab_tuscany: "トスカーナ征服"
 hab_tuscany_desc: "フィレンツェのルネサンス文化——メディチ家の庇護のもとで花開いたこの芸術大国をハプスブルク帝国の翼のもとに収めよ。"
 hab_surpass_poland: "ポーランドを凌駕せよ"
 hab_surpass_poland_desc: "ポーランド王国——東欧の大国との対決でハプスブルク家の軍事的優位を確立せよ。"
 hab_wallachia_moldavia: "ワラキア・モルダヴィア"
 hab_wallachia_moldavia_desc: "ドナウ川北岸のルーマニア系諸公国を制圧しバルカン支配を完成させよ。"
 hab_austrian_army: "オーストリア軍の整備"
 hab_austrian_army_desc: "ハプスブルク家の軍隊——多民族連隊を統合した欧州最強の陸軍を育成せよ。"
 hab_spanish_tercios: "スペイン式テルシオ"
 hab_spanish_tercios_desc: "テルシオ——スペイン軍の革命的戦術をハプスブルク全軍に導入して欧州最強の歩兵を完成させよ。"
 hab_multicultural: "多民族帝国"
 hab_multicultural_desc: "ドイツ人・チェコ人・ハンガリー人・クロアチア人・イタリア人——多様な民族を一つの旗のもとに統合するハプスブルク帝国の実験が完成した。"
 hab_alsace_lorraine: "アルザス＝ロレーヌ"
 hab_alsace_lorraine_desc: "ライン川沿いのアルザスとロレーヌ——この地をハプスブルク帝国の西方国境として確保せよ。"
 hab_renaissance_court: "ルネサンスの宮廷"
 hab_renaissance_court_desc: "ウィーン宮廷でルネサンスの光が輝く——イタリアの芸術とビザンツの学問が融合してハプスブルク帝国文化が花開く。"
 hab_carinthia: "ケルンテン"
 hab_carinthia_desc: "ケルンテン——アルプス山中のこの公国をハプスブルク版図に統合してイタリア・バルカンへの回廊を確保せよ。"
 hab_colonialism: "植民地帝国"
 hab_colonialism_desc: "スペインを通じてアメリカ大陸へ——ハプスブルク帝国の旗が世界中に翻る植民地帝国を建設せよ。"
 hab_universal_empire: "普遍帝国"
 hab_universal_empire_desc: "「普遍帝国——西はリスボンから東はコンスタンティノープルまで、北はハンブルクから南はパレルモまで」——シャルルマーニュ以来の夢が実現した。"
 hab_events.1.t: "ハプスブルク家、神聖ローマ皇帝へ"
 hab_events.1.d: "選帝侯たちがハプスブルク家への支持を表明した——帝国の玉座はハプスブルク家のものだ。"
 hab_events.1.a: "ハプスブルク皇帝万歳！帝国万歳！"
 hab_events.10.t: "ローマ皇帝の後継者宣言"
 hab_events.10.d: "帝国改革が完成し永遠の都ローマがHREに統合された——ハプスブルク家が「ローマ皇帝の後継者」として宣言する。"
 hab_events.10.a: "帝国改革万歳！ローマの後継者万歳！"
 hab_events.15.t: "ドイツ統一宣言"
 hab_events.15.d: "北から南まで——無数の諸侯国に分裂していたドイツがハプスブルク家の旗のもとに統一された。"
 hab_events.15.a: "ドイツ統一万歳！"
 hab_events.20.t: "フランスの衰退——王位への道"
 hab_events.20.d: "フランスがついにハプスブルク家に膝を屈した。今こそフランス王位への正式な請求権を確立する好機だ——60年の王位請求権を宣言してフランス王国の継承を見据えよ。"
 hab_events.20.a: "フランス王位への請求権を宣言する（60年間）"
 hab_events.25.t: "スペイン王冠"
 hab_events.25.d: "「スペイン王にしてオーストリア大公」——イベリア半島がハプスブルク帝国の版図となった。"
 hab_events.25.a: "スペイン万歳！ハプスブルク帝国万歳！"
 hab_events.30.t: "イタリア王"
 hab_events.30.d: "「鉄の王冠」がハプスブルク皇帝の頭上に輝く——ロンバルディアからシチリアまでイタリア全土が統一された。"
 hab_events.30.a: "イタリア王国を統合された王冠領として再編する"
 hab_events.40.t: "王立ハンガリー成立"
 hab_events.40.d: "ブダが解放された——「王立ハンガリー」がハプスブルク帝国の東方柱石となった。"
 hab_events.40.a: "ハンガリー解放！ブダ万歳！"
 hab_events.50.t: "東の皇帝"
 hab_events.50.d: "コンスタンティノープルがハプスブルク家の手に——東西ローマ帝国両方の首都を掌握した。"
 hab_events.50.a: "コンスタンティノープル万歳！東の皇帝万歳！"
 hab_events.55.t: "偉大なるウィーン"
 hab_events.55.d: "シェーンブルン宮殿・ステファン大聖堂——ウィーンが欧州最大・最美の都市として完成した。"
 hab_events.55.a: "偉大なるウィーン万歳！"
 hab_events.65.t: "ボヘミア——王冠領への編入"
 hab_events.65.d: "ボヘミアとの同君連合が深化し完全な統合の時が来た。統合された王冠領として直接統治するか、現在の同君連合を維持するか——決断せよ。"
 hab_events.65.a: "ボヘミアを統合された王冠領として編入する"
 hab_events.99.t: "普遍帝国の宣言"
 hab_events.99.d: "「普遍帝国——ハプスブルク皇帝は西はリスボンから東はコンスタンティノープルまで統治する」——この宣言が欧州全土に響き渡った。"
 hab_events.99.a: "普遍帝国万歳！ハプスブルク帝国永遠に！"
 hab_events.65.b: "現状の同君連合を維持する"
 STATIC_MODIFIER_NAME_hab_army_mod: "ハプスブルク軍の精鋭化"
 STATIC_MODIFIER_DESC_hab_army_mod: "多様な民族連隊を統合したハプスブルク軍が欧州最強の陸軍として完成した。"
 STATIC_MODIFIER_NAME_hab_balkans_mod: "バルカン解放"
 STATIC_MODIFIER_DESC_hab_balkans_mod: "バルカンのキリスト教徒がオスマンの支配から解放された。"
 STATIC_MODIFIER_NAME_hab_baroque_mod: "バロックのウィーン"
 STATIC_MODIFIER_DESC_hab_baroque_mod: "ウィーン宮廷でバロック芸術が花開き欧州文化の中心となった。"
 STATIC_MODIFIER_NAME_hab_boh_loyalty_mod: "ボヘミア統合への抵抗"
 STATIC_MODIFIER_DESC_hab_boh_loyalty_mod: "プラハの広間では、古き自由を失うことにボヘミアの貴族たちが不満の声を潜めている。"
 STATIC_MODIFIER_NAME_hab_bohemia_mod: "ボヘミア王冠"
 STATIC_MODIFIER_DESC_hab_bohemia_mod: "プラハの黄金の都市がハプスブルク家の第二首都として帝国に加わった。"
 STATIC_MODIFIER_NAME_hab_carinthia_mod: "ケルンテン制圧"
 STATIC_MODIFIER_DESC_hab_carinthia_mod: "ケルンテンがハプスブルク帝国のアルプス回廊として南北を結ぶ要衝となった。"
 STATIC_MODIFIER_NAME_hab_catholic_mod: "対抗宗教改革の実現"
 STATIC_MODIFIER_DESC_hab_catholic_mod: "カトリック信仰が帝国全土に守護される。"
 STATIC_MODIFIER_NAME_hab_charlemagne_mod: "シャルルマーニュの遺産"
 STATIC_MODIFIER_DESC_hab_charlemagne_mod: "カール大帝の遺産がハプスブルク帝国に新たな正統性を与えた。"
 STATIC_MODIFIER_NAME_hab_croatia_mod: "クロアチア軍事国境"
 STATIC_MODIFIER_DESC_hab_croatia_mod: "クロアチアに軍事国境線が設置されオスマン帝国の侵入が食い止められた。"
 STATIC_MODIFIER_NAME_hab_danubian_mod: "ドナウ帝国の拡張"
 STATIC_MODIFIER_DESC_hab_danubian_mod: "ドナウ川下流域が制圧されバルカン全体のハプスブルク支配が完成した。"
 STATIC_MODIFIER_NAME_hab_dynasty_mod: "ハプスブルク朝の目覚め"
 STATIC_MODIFIER_DESC_hab_dynasty_mod: "ハプスブルク家の野望が燃え上がった——外交と征服の時代が始まる。"
 STATIC_MODIFIER_NAME_hab_france_mod: "フランスとの戦い"
 STATIC_MODIFIER_DESC_hab_france_mod: "宿敵フランスが弱体化しハプスブルク家の欧州覇権への道が開かれた。"
 STATIC_MODIFIER_NAME_hab_graz_mod: "グラーツの要塞化"
 STATIC_MODIFIER_DESC_hab_graz_mod: "グラーツが難攻不落の要塞都市として整備されオスマン帝国の侵入を防ぐ。"
 STATIC_MODIFIER_NAME_hab_great_vienna_loc_mod: "偉大なるウィーンの完成"
 STATIC_MODIFIER_DESC_hab_great_vienna_loc_mod: "ウィーンが欧州最大の都市として完成し帝国の永遠の首都として輝く。"
 STATIC_MODIFIER_NAME_hab_heartland_mod: "オーストリア本国の安定"
 STATIC_MODIFIER_DESC_hab_heartland_mod: "オーストリア本国が安定し帝国拡張の基盤が確立された。"
 STATIC_MODIFIER_NAME_hab_hegemon_mod: "西方の覇者"
 STATIC_MODIFIER_DESC_hab_hegemon_mod: "西欧にハプスブルク家の覇権に挑む国家はもはや存在しない。"
 STATIC_MODIFIER_NAME_hab_imperial_mod: "帝国権威の確立"
 STATIC_MODIFIER_DESC_hab_imperial_mod: "神聖ローマ帝国全土がハプスブルク家の命令に従う。"
 STATIC_MODIFIER_NAME_hab_italian_mod: "イタリア戦争の恩恵"
 STATIC_MODIFIER_DESC_hab_italian_mod: "イタリア遠征でハプスブルク軍が精鋭化した。"
 STATIC_MODIFIER_NAME_hab_multiethnic_mod: "多民族帝国の確立"
 STATIC_MODIFIER_DESC_hab_multiethnic_mod: "多様な民族がハプスブルク帝国の旗のもとに共存する奇跡が実現した。"
 STATIC_MODIFIER_NAME_hab_north_sea_mod: "北海交易覇権"
 STATIC_MODIFIER_DESC_hab_north_sea_mod: "北海交易がハプスブルク帝国の支配下に入った。"
 STATIC_MODIFIER_NAME_hab_ottoman_mod: "オスマン帝国との戦い"
 STATIC_MODIFIER_DESC_hab_ottoman_mod: "オスマン帝国に勝利しハプスブルク帝国がキリスト教世界の防壁として認められた。"
