 STATIC_MODIFIER_NAME_hab_alsace_mod: "アルザス＝ロレーヌの掌握"
 STATIC_MODIFIER_DESC_hab_alsace_mod: "ライン川沿いの国境の城塞にハプスブルクの双頭の鷲が翻り、西の守りは揺るぎないものとなった。"
