 hab_events.40.b: "現状の関係を維持する"
 STATIC_MODIFIER_NAME_hab_hun_loyalty_mod: "ハンガリー統合への抵抗"
 STATIC_MODIFIER_DESC_hab_hun_loyalty_mod: "ブダの宮殿では、古来の自由を失うことにハンガリーの大貴族たちが不満の声を潜めている。"
 hab_integrated_crown_desc: "統合された王冠領はハプスブルク皇帝と統治者を共有し、外交が制限され、宗主国が直接建設・資源開発を行える特別な従属国タイプです。100年間は併合できません。"
 STATIC_MODIFIER_NAME_hab_spain_crown_mod: "スペイン王冠の獲得"
