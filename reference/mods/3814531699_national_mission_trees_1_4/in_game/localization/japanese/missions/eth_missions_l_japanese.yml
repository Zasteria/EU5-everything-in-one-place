l_japanese:
 eth_ethiopia_mission_pack: "新ソロモン帝国——アフリカの角に輝く十字架"
 eth_ethiopia_mission_pack_DESCRIPTION:0 "シバの女王とソロモン王の血を引くとされる王朝のもと、コプト教徒の守護者としてマムルーク朝と渡り合い、アダルとの死闘を制し、アクスムの栄光を蘇らせて新たな帝国を築け。"
 eth_ethiopia_mission_pack_CRITERIA_DESCRIPTION:0 "帝国を確立し、アフリカの角に覇を唱え、コプト教徒を守護し、アクスムの栄光を再興せよ。"
 eth_ethiopia_mission_pack_BUTTON_TOOLTIP:0 "高原の要塞から、紅海に輝く帝国へ。"
 eth_ethiopia_mission_pack_BUTTON_DETAILS:0 "「諸王の王、ユダの獅子」——シバの女王の末裔として、新たなソロモン帝国を打ち立てよ！"
 eth_negus_authority: "皇帝権（ネグサ・ナガスト）の確立"
 eth_negus_authority_desc: "「諸王の王」を意味するネグサ・ナガストの称号——その権威を国土の隅々にまで行き渡らせよ。"
 eth_amba_geshen: "アンバ・ゲシェンの幽閉所"
 eth_amba_geshen_desc: "王位継承の争いを防ぐため、王族の男子たちを天然の要塞アンバ・ゲシェンに幽閉する慣習——これを制度として確立せよ。"
 eth_mobile_court: "エチオピアの移動宮廷"
 eth_mobile_court_desc: "定まった首都を持たず、皇帝が軍勢と共に国土を巡り歩く「移動する陣営（ケテマ）」——この独自の統治様式を、国家の制度として確立せよ。"
 eth_coptic_church: "エチオピア正教会の保護"
 eth_coptic_church_desc: "アレクサンドリア教会の傘下にあるエチオピア正教会——その信仰を国家の柱とし、コプト教徒の守護者たれ。"
 eth_gondar_founding: "ゴンダールの発展"
 eth_gondar_founding_desc: "「アフリカのカメロット」と称されるゴンダール——石造りの城郭都市として発展させよ。"
 eth_royal_chronicle: "王統記の編纂"
 eth_royal_chronicle_desc: "歴代皇帝の事績を記録する「王統記（ケブラ・ナガスト）」の精神を受け継ぎ、学問と記録の伝統を育め。"
 eth_feudal_levies: "封建召集軍制度"
 eth_feudal_levies_desc: "各地の領主たちが皇帝の招集に応じて兵を率いる、エチオピア独自の封建的軍事制度を整備せよ。"
 eth_negus_dynasty: "ソロモン王朝の確立"
 eth_negus_dynasty_desc: "教会、記録、軍制、そして都——王国のあらゆる柱が整った今、ソロモン王朝の統治を不動のものとせよ。"
 eth_oromo_migration: "オロモ人の大移動"
 eth_oromo_migration_desc: "16世紀、オロモ人の諸集団が大規模な移動を開始する——この歴史的な民族移動に対応せよ。"
 eth_agaw_people: "アガウ人の統治"
 eth_agaw_people_desc: "古くからエチオピア高原に住むアガウ人——彼らの文化を尊重しつつ、帝国の一員として統治せよ。"
 eth_beta_israel: "ベータ・イスラエルとの共存"
 eth_beta_israel_desc: "「ファラシャ」とも呼ばれるエチオピアのユダヤ教徒ベータ・イスラエル——彼らとの共存の道を築け。"
 eth_horn_hegemony: "アフリカの角の覇権"
 eth_horn_hegemony_desc: "シダマ、オロモ、アガウ、ベータ・イスラエル——多様な民族を束ねる帝国として、アフリカの角に覇を唱えよ。"
 eth_nubian_alliance: "ヌビアとの同盟"
 eth_nubian_alliance_desc: "北方のコプト教国家、マクリアとアロディア——同じ信仰を奉じる同胞として、彼らと同盟を結べ。"
 eth_conquer_makuria: "マクリアの併合"
 eth_conquer_makuria_desc: "ナイル川流域に栄えたコプト教国家マクリア——衰退したこの国を保護、あるいは併合せよ。"
 eth_conquer_alodia: "アロディアの併合"
 eth_conquer_alodia_desc: "ヌビア南部のコプト教国家アロディア——この地をエチオピアの版図に組み込め。"
 eth_sudan_dominion: "スーダン支配の確立"
 eth_sudan_dominion_desc: "ナイル川流域からヌビア砂漠にかけての広大な地——ここにエチオピアの支配を打ち立てよ。"
 eth_mamluk_rivalry: "マムルーク朝との対立"
 eth_mamluk_rivalry_desc: "エジプトを支配するマムルーク朝——コプト教徒の守護者として、彼らとの対立に決着をつけよ。"
 eth_liberate_jerusalem: "エルサレム解放"
 eth_liberate_jerusalem_desc: "聖地エルサレム——コプト教徒の礼拝の権利を守るため、この地を解放せよ。"
 eth_coptic_patriarchate: "コプト総主教座の掌握"
 eth_coptic_patriarchate_desc: "アレクサンドリアのコプト総主教座——その権威をエチオピアの手に収めよ。"
 eth_protector_of_copts: "コプト教徒の守護者"
 eth_protector_of_copts_desc: "世界に散らばるコプト教徒たちにとって、エチオピア皇帝こそが最後の守護者である——その役割を全うせよ。"
 eth_adal_wars: "アダル戦争"
 eth_adal_wars_desc: "紅海沿岸のイスラム教国家アダル・スルタン国——長きにわたる宿敵との戦争に臨め。"
 eth_conquer_zeila: "ゼイラ征服"
 eth_conquer_zeila_desc: "アダルの重要な港湾都市ゼイラ——これを征服し、紅海交易への足がかりとせよ。"
 eth_conquer_harar: "ハラール征服"
 eth_conquer_harar_desc: "イスラム学問の中心地ハラール——この聖なる都市を征服せよ。"
 eth_conquer_adal: "アダル征服"
 eth_conquer_adal_desc: "「左利きのアハマド（グラーニュ）」の脅威に終止符を打ち、宿敵アダル・スルタン国を征服せよ。"
 eth_somali_coast: "ソマリ海岸の確保"
 eth_somali_coast_desc: "ソマリの海岸線一帯——アダルの残存勢力を一掃し、この地を確保せよ。"
 eth_red_sea_access: "紅海への進出"
 eth_red_sea_access_desc: "港湾都市マッサワを確保し、内陸国家エチオピアに待望の海への道を開け。"
 eth_portuguese_contact: "ポルトガルとの接触"
 eth_portuguese_contact_desc: "「プレスター・ジョンの国」を探し求めるポルトガル人——彼らとの接触は、エチオピアに新たな時代をもたらす。"
 eth_massawa_port: "マッサワ港の整備"
 eth_massawa_port_desc: "紅海に面する港湾都市マッサワ——これを整備し、対外交易の窓口とせよ。"
 eth_firearms_adoption: "火器の導入"
 eth_firearms_adoption_desc: "ポルトガルの支援を受け、マスケット銃と大砲をエチオピア軍に取り入れよ。"
 eth_european_trade: "対欧州交易"
 eth_european_trade_desc: "マッサワを窓口として、ヨーロッパ諸国との交易を活発化させよ。"
 eth_modernize_army: "軍制の近代化"
 eth_modernize_army_desc: "火器と欧州との交易——これらを土台に、エチオピア軍を近代的な軍隊へと生まれ変わらせよ。"
 eth_aksum_heritage: "アクスムの遺産"
 eth_aksum_heritage_desc: "かつて紅海交易で栄華を極めたアクスム帝国——その聖なる都を確保し、栄光の記憶を受け継げ。"
 eth_reclaim_aksum: "ティグレの再興"
 eth_reclaim_aksum_desc: "アクスム帝国発祥の地ティグレ——この地方を再興し、帝国の中核地帯とせよ。"
 eth_red_sea_empire: "紅海帝国の再建"
 eth_red_sea_empire_desc: "かつてアクスムが築いた紅海交易帝国——これを現代に蘇らせよ。"
 eth_horn_unification: "アフリカの角の統一"
 eth_horn_unification_desc: "クシート系民族の統合と紅海帝国の再建——アフリカの角のすべてを、エチオピアの旗のもとに統一せよ。"
 eth_new_solomonic_empire: "新ソロモン帝国"
 eth_new_solomonic_empire_desc: "コプト教徒の守護者、近代化された軍隊、そして統一されたアフリカの角——シバの女王とソロモン王の血脈は、ここに新たな帝国として完成する。"
 eth_events.1.t: "エルサレム解放"
 eth_events.1.d: "聖地エルサレムが、コプト教徒の手に戻った。世界に散らばる同胞たちにとって、この日は永遠に記憶されるだろう。"
 eth_events.1.a: "神に栄光あれ！"
 eth_events.99.t: "新ソロモン帝国の宣言"
 eth_events.99.d: "高地の小さな王国は、コプト教徒の守護者にして紅海の覇者、アフリカの角を統べる大帝国へと生まれ変わった。シバの女王とソロモン王の血脈は、ここに完成する。"
 eth_events.99.a: "エチオピアに栄光あれ！新ソロモン帝国、永遠なれ！"
 STATIC_MODIFIER_NAME_eth_negus_mod: "皇帝権の確立"
 STATIC_MODIFIER_DESC_eth_negus_mod: "皇帝の権威が国土に及び、統治の正統性が高まった。"
 STATIC_MODIFIER_NAME_eth_amba_geshen_mod: "アンバ・ゲシェンの幽閉所"
 STATIC_MODIFIER_DESC_eth_amba_geshen_mod: "アンバ・ゲシェンの断崖の上で、王族の若者たちは玉座を望むことを許されず、静かに歳を重ねている。"
 STATIC_MODIFIER_NAME_eth_coptic_church_mod: "正教会の保護"
 STATIC_MODIFIER_DESC_eth_coptic_church_mod: "テワヘド教会の鐘が高原の谷から谷へと響き、異なる信仰の民もその音に足を止めて耳を傾けている。"
 STATIC_MODIFIER_NAME_eth_gondar_mod: "ゴンダールの発展"
 STATIC_MODIFIER_DESC_eth_gondar_mod: "石造りの城郭都市が、王国の繁栄の象徴となっている。"
 STATIC_MODIFIER_NAME_eth_chronicle_mod: "王統記の編纂"
 STATIC_MODIFIER_DESC_eth_chronicle_mod: "修道院の薄暗い写字室では、ゲエズ語の年代記を写す書記たちの筆が休むことなく動いている。"
 STATIC_MODIFIER_NAME_eth_levies_mod: "封建召集軍制度"
 STATIC_MODIFIER_DESC_eth_levies_mod: "太鼓の合図に応じて、高原の領主たちがそれぞれの旗のもとに兵を率いて集まってくる。"
 STATIC_MODIFIER_NAME_eth_dynasty_mod: "王朝の確立"
 STATIC_MODIFIER_DESC_eth_dynasty_mod: "ソロモン王とシバの女王の血を引くという誇りが、王朝の名をあらゆる民の間で重んじさせている。"
 STATIC_MODIFIER_NAME_eth_horn_hegemony_mod: "アフリカの角の覇権"
 STATIC_MODIFIER_DESC_eth_horn_hegemony_mod: "アビシニアの高原からアフリカの角の低地まで、数えきれぬ言葉を話す民が一人の王の名のもとに貢納している。"
 STATIC_MODIFIER_NAME_eth_nubian_mod: "ヌビアとの同盟"
 STATIC_MODIFIER_DESC_eth_nubian_mod: "ヌビアの北の兄弟たちから届く使節は、同じ十字の信仰を分かち合う者として厚く迎えられている。"
 STATIC_MODIFIER_NAME_eth_makuria_mod: "マクリアの併合"
 STATIC_MODIFIER_DESC_eth_makuria_mod: "マクリアの併合地の統合が進んでいる。"
 STATIC_MODIFIER_NAME_eth_alodia_mod: "アロディアの併合"
 STATIC_MODIFIER_DESC_eth_alodia_mod: "アロディアの併合地の統合が進んでいる。"
 STATIC_MODIFIER_NAME_eth_sudan_mod: "スーダン支配"
 STATIC_MODIFIER_DESC_eth_sudan_mod: "ナイルの流域に広がるスーダンの平野から、穀物と金を積んだ隊商が絶え間なく上ってくる。"
 STATIC_MODIFIER_NAME_eth_mamluk_rivalry_mod: "マムルーク朝との対立"
 STATIC_MODIFIER_DESC_eth_mamluk_rivalry_mod: "マムルークの騎兵と刃を交えた経験が、高原の兵たちを歴戦の戦士に鍛え上げている。"
 STATIC_MODIFIER_NAME_eth_patriarchate_mod: "コプト総主教座"
 STATIC_MODIFIER_DESC_eth_patriarchate_mod: "自国の総主教が祝福を授ける日を、高原の司祭たちは長く待ち望んでいた。"
 STATIC_MODIFIER_NAME_eth_protector_mod: "コプト教徒の守護者"
 STATIC_MODIFIER_DESC_eth_protector_mod: "守護者としての評判が、外交関係の改善を助けている。"
 STATIC_MODIFIER_NAME_eth_adal_wars_mod: "アダル戦争"
 STATIC_MODIFIER_DESC_eth_adal_wars_mod: "アダルの軍勢との果てしない戦いを生き抜いた兵たちは、傷跡を勲章のように誇っている。"
 STATIC_MODIFIER_NAME_eth_zeila_mod: "ゼイラ征服"
 STATIC_MODIFIER_DESC_eth_zeila_mod: "ゼイラの港の倉庫から、紅海の香辛料と真珠が高原の宮廷へと運ばれていく。"
 STATIC_MODIFIER_NAME_eth_harar_mod: "ハラール征服"
 STATIC_MODIFIER_DESC_eth_harar_mod: "ハラールの城壁に王の旗が掲げられたとき、高原の兵たちは聖都を得た勝利を口々に語り合った。"
 STATIC_MODIFIER_NAME_eth_conquer_adal_mod: "アダル征服"
 STATIC_MODIFIER_DESC_eth_conquer_adal_mod: "かつての宿敵アダルの村々でも、王の役人が税の帳簿を広げ始めている。"
 STATIC_MODIFIER_NAME_eth_somali_coast_mod: "ソマリ海岸の確保"
 STATIC_MODIFIER_DESC_eth_somali_coast_mod: "ソマリの海岸の港には、乳香と象牙を積んだ船が絶えず錨を下ろしている。"
 STATIC_MODIFIER_NAME_eth_red_sea_access_mod: "紅海への進出"
 STATIC_MODIFIER_DESC_eth_red_sea_access_mod: "長く閉ざされていた紅海への道が開き、高原の商人たちの視線は水平線の彼方へ向けられている。"
 STATIC_MODIFIER_NAME_eth_portuguese_mod: "ポルトガルとの接触"
 STATIC_MODIFIER_DESC_eth_portuguese_mod: "ゴアから来たポルトガルの使節は、珍しい贈り物とともに高原の宮廷で厚遇されている。"
 STATIC_MODIFIER_NAME_eth_massawa_mod: "マッサワ港の整備"
 STATIC_MODIFIER_DESC_eth_massawa_mod: "港湾都市マッサワが、交易の窓口として繁栄している。"
 STATIC_MODIFIER_NAME_eth_firearms_mod: "火器の導入"
 STATIC_MODIFIER_DESC_eth_firearms_mod: "谷間に轟くマスケット銃と大砲の音は、槍と盾の時代の終わりを告げている。"
 STATIC_MODIFIER_NAME_eth_european_trade_mod: "対欧州交易"
 STATIC_MODIFIER_DESC_eth_european_trade_mod: "マッサワの港に着いたヨーロッパの商人たちが、銀貨と引き換えに高原の金と麝香を買い付けている。"
 STATIC_MODIFIER_NAME_eth_modernize_mod: "軍制の近代化"
 STATIC_MODIFIER_DESC_eth_modernize_mod: "新式の軍服に身を包んだ兵たちが、古い戦の歌を歌いながら行進している。"
 STATIC_MODIFIER_NAME_eth_aksum_heritage_mod: "アクスムの遺産"
 STATIC_MODIFIER_DESC_eth_aksum_heritage_mod: "アクスムの石碑の前に立つ者は、千年の王たちの名がいまも自らの血の中に流れていることを思い出す。"
 STATIC_MODIFIER_NAME_eth_reclaim_aksum_mod: "ティグレの再興"
 STATIC_MODIFIER_DESC_eth_reclaim_aksum_mod: "アクスムの古い畑と市場が息を吹き返し、王の役人は再び収穫を数えている。"
 STATIC_MODIFIER_NAME_eth_red_sea_empire_mod: "紅海帝国の再建"
 STATIC_MODIFIER_DESC_eth_red_sea_empire_mod: "紅海の港々を結ぶ交易帝国の再建に伴い、王の船団が沿岸のあちこちで帆を広げている。"
 STATIC_MODIFIER_NAME_eth_horn_unification_mod: "アフリカの角の統一"
 STATIC_MODIFIER_DESC_eth_horn_unification_mod: "アフリカの角のあらゆる王侯が、いまや一つの宮廷の礼法に従って跪いている。"
 STATIC_MODIFIER_NAME_eth_new_solomonic_empire_mod: "新ソロモン帝国"
 STATIC_MODIFIER_DESC_eth_new_solomonic_empire_mod: "新たな帝国の完成が、国威のすべてを頂点へと導いた。"
 STATIC_MODIFIER_NAME_eth_jerusalem_mod: "エルサレム解放"
 STATIC_MODIFIER_DESC_eth_jerusalem_mod: "エルサレムの聖墳墓の前に立つエチオピアの司祭たちは、長い巡礼の旅の果てに涙を流している。"
