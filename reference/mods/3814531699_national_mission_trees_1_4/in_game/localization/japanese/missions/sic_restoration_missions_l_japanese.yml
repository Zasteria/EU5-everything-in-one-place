l_japanese:
 sic_restoration_mission_pack: "シチリア王国の道"
 sic_restoration_mission_pack_DESCRIPTION:0 "1282年の蜂起によりナポリから分離したシチリア王国は、地中海の中心に位置するこの島の力を結集し、再びその名を歴史に刻む時を迎えている。海を越えてナポリと一つになるか、あるいは島そのものを黄金の地として発展させるか――選ぶのは王たる汝自身である。"
 sic_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "シチリア王国としてミッションを達成し、両シチリア王国の再建、あるいはシチリア島の黄金時代を目指せ。"
 sic_restoration_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してシチリア王国の道を歩め。"
 sic_restoration_mission_pack_BUTTON_DETAILS:0 "海峡の向こうのナポリを征服して両シチリア王国を築くか、シチリア島そのものを地中海の宝石として磨き上げるか。二つの道の先に、新たな王国の繁栄が待っている！"

 sic_divided_kingdom: "海峡の向こう"
 sic_divided_kingdom_desc: "1282年、「シチリアの晩鐘」と呼ばれる蜂起により、我らはアンジュー家の支配を打ち倒し、アラゴン家の王を新たな主として迎え入れた。海峡の向こうには、なおアンジュー家の血を引くナポリの王が座っている。彼らとの関係は、我が王国の行く末を大きく左右するだろう。"

 sic_ambitions_on_naples: "ナポリへの野心"
 sic_ambitions_on_naples_desc: "海峡の向こうに座るアンジュー家の王は、本来であればシチリア王の称号をも我らと争う立場にある。常備軍を整え、いつの日かナポリの王冠を我が手に収める大義を掲げるべき時が来た。"

 sic_army_of_the_island: "島の艦隊"
 sic_army_of_the_island_desc: "シチリア島は四方を海に囲まれた要塞である。海峡を越えてナポリへ軍を送るためには、まず強力な艦隊を整備し、島の防衛と兵の輸送を確実なものとしなければならない。"

 sic_conquest_of_naples: "ナポリ征服"
 sic_conquest_of_naples_desc: "ついに我が軍は海峡を越え、ナポリの地に上陸した。アンジュー家の軍を打ち破り、ナポリの王冠を手に入れることができれば、二つに裂かれた王国は我らの手によって一つに戻るだろう。"

 sic_two_sicilies: "両シチリア王国"
 sic_two_sicilies_desc: "ナポリとパレルモ、二つの王冠が今、我が手に握られている。海峡の両岸を統べる新たな王国――両シチリア王国――の成立を宣言する時が来た。これこそ、1282年の分裂に終止符を打つ歴史的偉業である。"

 sic_golden_wheat_fields: "黄金の小麦畑"
 sic_golden_wheat_fields_desc: "シチリア島は古来より地中海の穀倉と呼ばれてきた。パレルモ周辺の肥沃な平野を開発すれば、その豊かな実りは王国全土を潤し、余剰の穀物は交易品として各地へ運ばれるだろう。"

 sic_palermo_resurgent: "パレルモの再興"
 sic_palermo_resurgent_desc: "ノルマン王朝の時代、パレルモは地中海でも比類なき繁栄を誇る都市であった。この地に再び建造物を増やし、かつての輝きを取り戻すことが、島全体の発展への第一歩となるだろう。"

 sic_mediterranean_crossroads: "地中海交易の要衝"
 sic_mediterranean_crossroads_desc: "シチリア島は、東西の交易路が交差する地中海の十字路に位置している。島内の港に市場を整備すれば、各地から商人が集い、王国の交易収入は大いに増すだろう。"

 sic_sicilian_renaissance: "シチリア・ルネサンス"
 sic_sicilian_renaissance_desc: "ノルマン・アラブ・ビザンツ・ラテンの文化が交わるシチリアの宮廷は、古くから芸術と学問の中心地であった。パレルモに集められた数々の芸術品は、新たな文化の開花を予感させている。"

 sic_kingdom_resurgent: "王国の再興"
 sic_kingdom_resurgent_desc: "海峡の両岸を統べる王国として、あるいは地中海に輝く文化と交易の島として、シチリアは再びその名を歴史に刻んだ。これより先、この王国の歩む道は、新たな時代の幕開けとなるだろう。"

 # === 補正 ===
 STATIC_MODIFIER_NAME_sic_army_of_the_island_mod: "島の艦隊"
 STATIC_MODIFIER_DESC_sic_army_of_the_island_mod: "シチリアは古代ギリシャ植民地（カルタゴ・シラクサなど）以来の軍事的伝統を持つ。ノルマン人の征服（1061〜1091年）でルッジェーロ1世が築いた軍事組織、アラゴン時代の海軍整備——島の地理的特性が常に強力な軍事国家を必要としてきた。"

 STATIC_MODIFIER_NAME_sic_conquest_of_naples_mod: "ナポリ征服"
 STATIC_MODIFIER_DESC_sic_conquest_of_naples_mod: "1282年の「シチリアの晩鐘」でフランス人支配者を追放したシチリア人は独立を守ったが、「両シチリア王国」の統一は宿願だった。ナポリとシチリアはノルマン王国時代（1130〜1194年）には統一国家を形成しており、その分離は歴史的な異常状態だ。"

 STATIC_MODIFIER_NAME_sic_two_sicilies_mod: "両シチリア王国"
 STATIC_MODIFIER_DESC_sic_two_sicilies_mod: "「両シチリア王国（ドゥエ・シチーリエ）」は島シチリアと「この岸のシチリア（シチリア・シトラ・ファルム）」すなわちナポリ王国を合わせた国名だ。フリードリヒ2世の時代に栄光の絶頂を迎えたこの南イタリア大国の復興は、1861年のイタリア統一まで南欧政治の核心だった。"

 STATIC_MODIFIER_NAME_sic_golden_wheat_fields_mod: "黄金の小麦畑"
 STATIC_MODIFIER_DESC_sic_golden_wheat_fields_mod: "古代ローマはシチリアを「帝国の穀倉庫（グラナリウム・インペリイ）」と呼んだ。島中部の広大な小麦畑は地中海世界に食料を供給し続けた。「小麦の島」としてのシチリアの農業的役割は古代から19世紀まで変わることなく地中海の食糧安全保障の要となった。"

 STATIC_MODIFIER_NAME_sic_palermo_resurgent_mod: "パレルモの再興"
 STATIC_MODIFIER_DESC_sic_palermo_resurgent_mod: "パレルモ（フェニキア語でパノルモス＝「全ての港」）はノルマン・アラブ・ビザンツ文化が融合したシチリア最大の都市だ。ルッジェーロ2世の宮廷はヨーロッパで最も洗練された宮廷の一つとして知られ、アラビア語・ギリシャ語・ラテン語が並列して使われる多文化の中心だった。"

 STATIC_MODIFIER_NAME_sic_mediterranean_crossroads_mod: "地中海交易の要衝"
 STATIC_MODIFIER_DESC_sic_mediterranean_crossroads_mod: "シチリアは地中海のほぼ中央に位置し、古代フェニキア人がカルタゴを建てた時代から東西交易の中継点だった。古代ギリシャの哲学者アルキメデスが生まれたシラクサ、アラブ文化の薫るパレルモ——この島はまさに地中海文明の縮図だ。"

 STATIC_MODIFIER_NAME_sic_sicilian_renaissance_mod: "シチリア・ルネサンス"
 STATIC_MODIFIER_DESC_sic_sicilian_renaissance_mod: "フリードリヒ2世（神聖ローマ皇帝兼シチリア王）の宮廷はノルマン・アラブ・ビザンツ・ラテンの文化が交差するルネサンスの先駆けだった。「シチリア詩派」はイタリア語文学の最初期の姿であり、ダンテもその影響を認めた。パレルモは13世紀においてヨーロッパ最高の知的中心の一つだった。"

 STATIC_MODIFIER_NAME_sic_kingdom_resurgent_mod: "王国の再興"
 STATIC_MODIFIER_DESC_sic_kingdom_resurgent_mod: "「シチリアの晩鐘」（1282年）から始まったアラゴン系シチリア王国の独立は、カール1世・ダンジューへの民衆反乱という世界史上最も劇的な出来事の一つから生まれた。この誇り高い王国が再び地中海に君臨する日——その歴史的復興の栄光は並ぶものがない。"

 # === イベント ===
 sic_events.1.t: "二つに分かたれた王国"
 sic_events.1.d: "1282年、我らはアンジュー家の支配に対して蜂起した。フランスから来た役人たちの圧政に耐えかねた島民は、晩鐘の音を合図に一斉に立ち上がり、フランス人を島から追い出したのである。我らはアラゴン王ペドロ3世を新たな王として迎え入れ、シチリア王国はここに二つに分かたれることとなった。海峡の向こう、ナポリを首都とする本土側には、なおアンジュー家の王が「シチリア王」を名乗っている。我らこそが、この島の真の王なのだ。両国の対立は、今なお続いている。"
 sic_events.1.a: "理解した"
