l_japanese:
 nov_novgorod_mission_pack: "ノヴゴロドの栄光——商人共和国からルーシの覇者へ"
 nov_novgorod_mission_pack_DESCRIPTION:0 "1337年、ヴェリーキー・ノヴゴロド公共共和国はロシア最大の商業国家だ。ヴェーチェ（民会）が政治を動かし、ハンザ同盟との交易が富をもたらす。しかしモスクワが着々と力をつけ、タタールの脅威が東から迫る。毛皮交易・バルト海制覇・モスクワ打倒——そして「ルーシの大君主」として全ロシアに君臨せよ。"
 nov_novgorod_mission_pack_CRITERIA_DESCRIPTION:0 "交易帝国を建設し、モスクワを打倒してロシアを統一し、バルト海とシベリアを制して「ルーシの大君主」として君臨せよ。"
 nov_novgorod_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してルーシの大君主となれ。"
 nov_novgorod_mission_pack_BUTTON_DETAILS:0 "ノヴゴロドの商人共和国からロシア帝国の礎まで！"

 nov_veche_republic: "ヴェーチェの共和国"
 nov_veche_republic_desc: "ノヴゴロドのヴェーチェ（民会）は市民・貴族・商人が参加する独特の民主的機関だ。「ノヴゴロドの主はノヴゴロドのみ」——大公ではなく市民の意志が国家を動かすこの体制こそがノヴゴロドを他のロシア諸公国と区別する。ヴェーチェの伝統を強化し、商人共和国の基盤を固めよ。"
 nov_dev_novgorod: "大ノヴゴロドの整備"
 nov_dev_novgorod_desc: "「大ノヴゴロド（ヴェリーキー・ノヴゴロド）」——ヴォルホフ川沿いのこの都市は中世ロシア最大の商業都市だ。ハンザ商人・ビザンツ商人・東方のムスリム商人がここに集まり、毛皮・蜜蝋・亜麻・魚が交易される。「ノヴゴロドの居留地（コントル）」がリューベック・ブリュージュ・ロンドン・ベルゲンに設置されている。"
 nov_birch_bark: "白樺樹皮文書"
 nov_birch_bark_desc: "ノヴゴロドでは庶民が白樺の樹皮に文字を書く習慣があった——世界で最も識字率の高い中世都市の証拠だ。この識字の伝統を生かし、学術・行政・交易の記録を整備せよ。"
 nov_hanseatic_league: "ハンザ同盟との交易"
 nov_hanseatic_league_desc: "ノヴゴロドは北ヨーロッパ最大の交易都市の一つとして、ハンザ同盟のネットワークに深く組み込まれている。リューベック・ハンブルク・ブリュージュへとつながる交易路を強化せよ。"
 nov_fur_trade: "毛皮交易"
 nov_fur_trade_desc: "ノヴゴロドの最大の交易品は毛皮だ——リス・テン・ビーバー・ミンクの毛皮がシベリアの森から切り出され、西ヨーロッパの貴族に売られる。「北の黄金」とも呼ばれる毛皮交易がノヴゴロドの富の源泉だ。"
 nov_dev_pskov: "プスコフの整備"
 nov_dev_pskov_desc: "独立心旺盛なプスコフ——ノヴゴロドの「弟」都市として交易・文化の副首都となる。プスコフ・クレムリンの城壁とトロイツキー聖堂を擁するこの都市を整備せよ。"
 nov_trade_empire: "交易帝国"
 nov_trade_empire_desc: "毛皮・蜜蝋・塩・魚——ノヴゴロドの交易ネットワークが北ヨーロッパを覆った。商人ギルドが国家を動かし、交易所が各地に設置される。「北のヴェネツィア」の名声が世界に広まる。"
 nov_dev_staraya_russa: "スタラヤ・ルッサの整備"
 nov_dev_staraya_russa_desc: "「古いルス」の名を持つスタラヤ・ルッサは塩の産地として名高い。この古都の塩産業を整備し、ノヴゴロドの食料保存と交易に貢献させよ。"
 nov_secure_novgorod_region: "ノヴゴロド地域の確保"
 nov_secure_novgorod_region_desc: "ノヴゴロド本領——西・東ノヴゴロド両エリアを完全に掌握することで、拡張の基盤が確立される。"
 nov_conquer_tver: "トヴェリの征服"
 nov_conquer_tver_desc: "かつてモスクワと覇権を争ったトヴェリ大公国——今やその力は衰えている。ヴォルガ川上流のこの重要な都市を征服し、南方への進出路を開け。"
 nov_conquer_yaroslavl: "ヤロスラヴリの征服"
 nov_conquer_yaroslavl_desc: "「黄金の環」の都市ヤロスラヴリ——ヴォルガ川沿いの交易都市を征服し、北方交易路を掌握せよ。"
 nov_conquer_moscow: "モスクワの征服"
 nov_conquer_moscow_desc: "イヴァン1世（カリタ）以来、モスクワはタタールの支持を得て着々と勢力を拡大してきた。「モスクワか戦争か」——ノヴゴロドの最大の脅威を打倒し、ロシアの主導権を奪え。"
 nov_conquer_suzdal: "スーズダリ・ウラジーミルの征服"
 nov_conquer_suzdal_desc: "スーズダリとウラジーミル——かつてキエフ・ルーシの後継として栄えた古都だ。多くの黄金の円蓋教会を擁するこれらの都市を征服し、古ルーシの正当性を継承せよ。"
 nov_defeat_muscovy: "モスクワの打倒"
 nov_defeat_muscovy_desc: "モスクワ大公国が滅び、ロシアの覇権がノヴゴロドに移った。リューリク朝の野心がついに潰えた——ヴェーチェ共和国がロシアの未来を決定する。"
 nov_conquer_smolensk: "スモレンスクの征服"
 nov_conquer_smolensk_desc: "「ロシアの鍵」と呼ばれるスモレンス——東西交通の要衝を制することで西方への影響力が確立される。"
 nov_conquer_ryazan: "リャザンの征服"
 nov_conquer_ryazan_desc: "1237年、モンゴル軍に最初に蹂躙されたリャザン公国——その南方の草原地帯を征服し、タタールへの防衛線を構築せよ。"
 nov_form_russia: "ルーシの形成"
 nov_form_russia_desc: "ノヴゴロドを中心とする統一ルーシ国家の形成——モスクワではなくノヴゴロドがロシアを統一した。この歴史的転換が生む新しいロシアはどのような姿になるのか？"
 nov_vologda_trade: "ヴォログダの交易"
 nov_vologda_trade_desc: "ヴォログダとベロオーゼロ——北方交易路の要衝を掌握することで、白海へのアクセスと毛皮交易路が確立される。"
 nov_found_arkhangelsk: "アルハンゲリスクの建設"
 nov_found_arkhangelsk_desc: "白海沿岸に港町アルハンゲリスクを建設せよ——冬は凍結するが、この港が北欧・英国との直接交易を可能にする。後世、イギリス商人がここを通じてロシアに入ることになる。"
 nov_white_sea_trade: "白海交易の制覇"
 nov_white_sea_trade_desc: "白海の交易路を制覇し、北ヨーロッパとの直接交易を確立せよ。アルハンゲリスクが北方交易の中心地として発展する。"
 nov_conquer_perm: "ペルミの征服"
 nov_conquer_perm_desc: "カマ川上流のペルミ地方——「カマ毛皮」と呼ばれる高品質毛皮の産地だ。ここを征服することで毛皮交易の独占が確立される。"
 nov_kola_fortress: "コラの要塞"
 nov_kola_fortress_desc: "コラ半島の最北端——ムルマンスク湾の不凍港を掌握し、北方海路への基地を確立せよ。"
 nov_siberian_frontier: "シベリア辺境"
 nov_siberian_frontier_desc: "ウラル山脈を越えてシベリアへ——無限の毛皮資源が待つ「大地の向こう」への道が開かれた。イェルマークの征服に先駆けてシベリアに進出せよ。"
 nov_fur_monopoly: "毛皮交易の独占"
 nov_fur_monopoly_desc: "ペルミからシベリアまで——毛皮交易の全ルートがノヴゴロドの管理下に入った。ヨーロッパの王侯貴族が求める高級毛皮を独占供給し、莫大な富を得よ。"
 nov_secure_karelia: "カレリアの確保"
 nov_secure_karelia_desc: "フィンランド湾北岸のカレリア地方を掌握し、バルト海へのアクセスを確保せよ。スウェーデンとの境界線を確立する重要な戦略的要衝だ。"
 nov_conquer_viborg: "ヴィボルクの征服"
 nov_conquer_viborg_desc: "スウェーデンが築いたヴィボルク城塞——フィンランド湾の要衝を攻略することでバルト海への扉が開かれる。"
 nov_baltic_fleet: "バルト艦隊"
 nov_baltic_fleet_desc: "ノヴゴロドのバルト艦隊を建設せよ——北ヨーロッパの商業を支配するためには海軍力が不可欠だ。"
 nov_conquer_riga: "リガの征服"
 nov_conquer_riga_desc: "ドヴィナ川河口のリガ——ハンザ同盟の重要都市を征服することで、バルト海交易の主導権を握れ。「ダンツィヒか戦争か」の精神でリガも手に入れよ。"
 nov_livonia: "リヴォニアの制圧"
 nov_livonia_desc: "リヴォニア騎士団が支配する バルト海東岸——この地域を制圧することでバルト三国へのアクセスが確立される。"
 nov_neva_ports: "ネヴァ川の港"
 nov_neva_ports_desc: "ネヴァ川沿いの港町を整備せよ——後にピョートル大帝が「ペテルブルク」を築くこの地が、バルト海への玄関口となる。"
 nov_orthodox_archbishop: "正教大司教区"
 nov_orthodox_archbishop_desc: "ノヴゴロドの大司教はモスクワとコンスタンティノープルから独立した権威を持つ——宗教的自律性がノヴゴロドの独自性を支える。聖ソフィア大聖堂を擁するノヴゴロドの正教伝統を強化せよ。"
 nov_cathedral_cities: "大聖堂の都市"
 nov_cathedral_cities_desc: "ノヴゴロドの全都市に大聖堂を建立せよ——「聖なるルーシ」の理想を実現し、正教信仰の輝きで全国土を覆え。"
 nov_guardian_of_orthodoxy: "正教の守護者"
 nov_guardian_of_orthodoxy_desc: "コンスタンティノープルがオスマンに陥落した今、ロシア正教の守護者としての使命がノヴゴロドに課せられる。「第三のローマ」たる資格をモスクワではなくノヴゴロドが手にせよ。"
 nov_novgorod_chronicle: "ノヴゴロド年代記"
 nov_novgorod_chronicle_desc: "ノヴゴロド年代記（ノヴゴロツカヤ・レトピシ）——毎年の出来事を克明に記録するこの歴史書がノヴゴロドの知的遺産を後世に伝える。学術と記録の文化を発展させよ。"
 nov_dev_torzhok: "トルジョークの整備"
 nov_dev_torzhok_desc: "ノヴゴロドとモスクワの中間に位置するトルジョーク——交易の要衝として整備し、南方交易路を掌握せよ。"
 nov_kazan_subjugation: "カザンの従属"
 nov_kazan_subjugation_desc: "カザン・ハン国——タタールの後継国家としてヴォルガ中流を支配するこの国を従属させることで、東方への道が開かれる。"
 nov_ushkuiniks: "ウシュクイニキ（川賊）"
 nov_ushkuiniks_desc: "ウシュクイニキ——ノヴゴロドの川賊・探検家・兵士の混合集団だ。ヴォルガ川を下り、タタールの商船を略奪するこの荒くれ者たちをノヴゴロドの正規軍に組み込み、精鋭部隊として育成せよ。"
 nov_dev_suzdal: "スーズダリの整備"
 nov_dev_suzdal_desc: "「黄金の環」のスーズダリ——多くの中世教会と修道院を擁するこの古都を文化・宗教の中心地として整備せよ。"
 nov_conquer_beloozero: "ベロオーゼロの征服"
 nov_conquer_beloozero_desc: "「白い湖」ベロオーゼロ地方——毛皮と魚が豊富なこの地域を掌握し、北方交易路を確保せよ。"
 nov_dev_kholmogory: "コルモゴルイの整備"
 nov_dev_kholmogory_desc: "ドヴィナ川沿いのコルモゴルイ——白海への玄関口としてこの港町を整備し、後のアルハンゲリスク繁栄の基盤とせよ。"
 nov_conquer_vladimir: "ウラジーミルの征服"
 nov_conquer_vladimir_desc: "かつてウラジーミル大公国の首都——「ドミートリエフスキー聖堂」など多くの宗教建築を擁するこの古都がノヴゴロドの手に落ちた。"
 nov_tatar_wars: "タタールとの戦い"
 nov_tatar_wars_desc: "ノヴゴロドはタタールのくびきに服さなかった唯一のルーシの主要都市だ——今こそその誇りを武器にタタールと戦え。ネヴァ河畔の精神でステップの騎馬民族を打ち破れ。"
 nov_golden_horde: "黄金帳国への反撃"
 nov_golden_horde_desc: "黄金帳国（キプチャク・ハン国）の領域にノヴゴロドの旗を掲げよ——モンゴルの支配からロシアを解放した者こそが真のルーシの覇者だ。"
 nov_nizhny_novgorod: "ニジニー・ノヴゴロドの征服"
 nov_nizhny_novgorod_desc: "「下のノヴゴロド」ニジニー・ノヴゴロド——ヴォルガとオカ川の合流点に位置する交易都市を制圧し、ヴォルガ中流交易を掌握せよ。"
 nov_orthodox_mission: "正教の布教"
 nov_orthodox_mission_desc: "北方・東方の異教徒に正教信仰を広めよ——フィン系諸民族・シベリアの先住民・タタールへの布教活動がノヴゴロドの正当性を高める。"
 nov_hanseatic_kontors: "ハンザ商館"
 nov_hanseatic_kontors_desc: "ノヴゴロド・リガ・リューベック——ハンザ同盟の主要都市にノヴゴロドの商館（コントル）を設置し、北ヨーロッパ交易ネットワークを直接掌握せよ。"
 nov_ostrog_system: "オストログ（砦）システム"
 nov_ostrog_system_desc: "シベリアへの進出を支える砦（オストログ）のネットワークを構築せよ——トゥメニ・トボリスク・イルクーツクへと続くシベリア征服の前哨基地だ。"
 nov_dev_ryazan: "リャザンの整備"
 nov_dev_ryazan_desc: "モンゴルに壊滅させられたリャザン——その廃墟の上に新しいリャザン市が建設された。この南方の重要都市を整備し、草原地帯への前哨基地とせよ。"
 nov_estonian_coast: "エストニア海岸"
 nov_estonian_coast_desc: "エストニア海岸を制圧することでバルト海南岸への支配が完成する。ハンザ同盟の交易都市レヴァル（タリン）を掌握せよ。"
 nov_conquer_teutonic: "チュートン騎士団の打倒"
 nov_conquer_teutonic_desc: "バルト十字軍の遺産——チュートン騎士団とリヴォニア騎士団を打倒することで、バルト海東南岸が完全にノヴゴロドの支配下に入る。"
 nov_moscow_capital: "モスクワの整備"
 nov_moscow_capital_desc: "敵の首都モスクワをノヴゴロドの重要都市として整備せよ——かつてのモスクワ大公の宮殿をノヴゴロド総督府に改修し、支配の象徴とせよ。"
 nov_iron_ring: "鉄の環"
 nov_iron_ring_desc: "ノヴゴロドを守る要塞の環——プスコフ・ノヴゴロド・ラドガ・トヴェリを結ぶ防衛網が完成した。どの方向からの侵攻も防ぎ切れる鉄壁の防衛体制だ。"
 nov_kholmogory_trade: "コルモゴルイの交易"
 nov_kholmogory_trade_desc: "ドヴィナ川の交易拠点コルモゴルイから白海へ——イギリスのモスクワ会社に先んじてこの北方交易路を掌握せよ。"
 nov_eastern_orthodoxy: "東方正教会の確立"
 nov_eastern_orthodoxy_desc: "コンスタンティノープル陥落後、ノヴゴロドが東方正教会の中心地として台頭した。聖ソフィア大聖堂がコンスタンティノープルのアヤソフィアの後継として輝く。"
 nov_amber_road: "琥珀の道"
 nov_amber_road_desc: "バルト海から南方へ続く琥珀の交易路——バルト産の琥珀・ノヴゴロドの毛皮・東方の絹が交わるこの交易路をノヴゴロドが支配した。"
 nov_great_novgorod: "大ノヴゴロドの完成"
 nov_great_novgorod_desc: "交易帝国・軍事力・正教の権威——三本柱が揃い、ノヴゴロドは「偉大なる者（ヴェリーキー）」の称号に相応しい国家となった。「ルーシの大君主」への最後の一歩を踏み出せ。"
 nov_ruler_of_rus: "ルーシの大君主"
 nov_ruler_of_rus_desc: "「ノヴゴロドと全ルーシの大君主」——かつてモスクワが夢見た称号をノヴゴロドが手にした。商人共和国から始まり、バルト海・シベリア・南方草原を制した帝国が完成する。歴史は書き換えられた——ロシアの未来はノヴゴロドが決める。"

 nov_events.10.t: "モスクワ陥落——ルーシの主導権をノヴゴロドへ"
 nov_events.10.d: "モスクワ・クレムリンがノヴゴロド軍の手に落ちた。「タタールの番犬」と蔑まれたモスクワ大公家の野望が潰えた今、ロシアの未来はヴェーチェ共和国ノヴゴロドが決める。この勝利は単なる領土的征服ではない——ロシアの歴史を根本から変える転換点だ。"
 nov_events.10.a: "モスクワは倒れた！ノヴゴロドの時代が始まる！"

 nov_events.20.t: "ルーシの形成——ノヴゴロドを中心とする新国家"
 nov_events.20.d: "ノヴゴロドを中心とするルーシの統一国家が誕生した。その名をいかにするか？「ルーシ大公国」と改称して新たな出発を告げるか、「ノヴゴロド」の名を誇りとして保ち続けるか？"
 nov_events.20.a: "「ルーシ大公国」を宣言——新たなロシアの誕生だ"
 nov_events.20.b: "「ノヴゴロド」の名を誇りとして保ち続ける"

 nov_events.99.t: "ルーシの大君主——ノヴゴロドがロシアを統治する"
 nov_events.99.d: "「ノヴゴロドと全ルーシの大君主」——この称号がノヴゴロドのヴェーチェ広場に響き渡った。バルト海からシベリアまで、白海から黒海草原まで——ノヴゴロドの旗が全ロシアに翻る。商人共和国が世界最大の帝国の一つを建設した。歴史は書き換えられた。"
 nov_events.99.a: "ルーシの大君主万歳！ノヴゴロドよ永遠に！"

 STATIC_MODIFIER_NAME_nov_novgorod_city_mod: "大ノヴゴロドの繁栄"
 STATIC_MODIFIER_DESC_nov_novgorod_city_mod: "ハンザ同盟の拠点として大ノヴゴロドが整備され交易が活発化した。"
 STATIC_MODIFIER_NAME_nov_literacy_mod: "白樺文書の伝統"
 STATIC_MODIFIER_DESC_nov_literacy_mod: "識字の伝統がノヴゴロドの知的・商業的優位を支える。"
