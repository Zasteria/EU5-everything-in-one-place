 nov_events.1.t: "ヴェリーキー・ノヴゴロド——大いなる共和国"
 nov_events.1.d: "1337年、ヴェリーキー・ノヴゴロド（大ノヴゴロド）公共共和国はロシア最大の商業都市国家だ。\n\nヴォルホフ川の両岸に広がるこの都市は、西岸の「ソフィア側」と東岸の「交易側」に分かれる。中心にはノヴゴロドのランドマーク、聖ソフィア大聖堂がそびえる。\n\nヴェーチェ（民会）が最高決定機関として機能し、ポサドニク（市長）・ティシャツキー（千人長）・大司教が行政を担う。\n\n「ノヴゴロドの主はノヴゴロドのみ」——大公でも皇帝でもなく、市民の意志がこの共和国を動かす。\n\nハンザ同盟のコントル（商館）がここに置かれ、リューベック・ブリュージュ・ロンドン・ベルゲンとの交易が繁栄している。毛皮・蜜蝋・亜麻・魚がノヴゴロドを通じて西ヨーロッパへ供給される。\n\nしかしモスクワが着々と力をつけ、リトアニアが西から迫り、タタールが東に控える。ノヴゴロドはこの複雑な力学を利用しながら生き残ってきた。今こそその知恵と商業力を活かして、ルーシの覇者を目指せ。"
 nov_events.1.a: "ノヴゴロドの自由と繁栄を守り抜く！"
