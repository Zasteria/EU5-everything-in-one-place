l_japanese:
 por_portuguese_mission_pack: "大航海時代のポルトガル"
 por_portuguese_mission_pack_DESCRIPTION:0 "1337年、ポルトガルはイベリア半島西端の小王国だ。しかしエンリケ航海王子（1394〜1460年）が組織した探検事業が世界を変える——マデイラ・アゾレス・西アフリカ・喜望峰・インド・マラッカ・ブラジル。大西洋からインド洋まで、ポルトガルの航海者たちが世界の海を支配する「エスタード・ダ・インディア（インド国家）」を建設せよ。"
 por_portuguese_mission_pack_CRITERIA_DESCRIPTION:0 "国内を整備し、アフリカを周回してインド洋に到達し、ブラジルを植民地化して「海の覇者」として世界に君臨せよ。"
 por_portuguese_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成して大航海時代のポルトガル帝国を完成させよ。"
 por_portuguese_mission_pack_BUTTON_DETAILS:0 "エンリケ航海王子からフェリペ2世のポルトガル統治まで！"

 por_infante_henrique: "ポルトガルの海洋伝統"
 por_infante_henrique_desc: "1337年、ポルトガルはイベリア半島西端の小王国だ。アルフォンス4世の統治下、ポルトガルはリオ・サラドの戦い（1340年）でカスティーリャを支援しマリーン朝を撃退した海軍国家だ。大西洋に面したこの王国には古くから海への親しみがある。リスボンの港・アルガルヴェの漁師・大西洋の風——この海洋伝統こそが後世の大航海時代を生む土台だ。"

 por_dev_lisbon: "リスボンの整備"
 por_dev_lisbon_desc: "テージョ川河口に位置するリスボンは自然の良港に恵まれた都市だ。古代フェニキア人が建設したこの都市をポルトガル帝国の首都として整備することで、世界交易の中心地となる。"
 por_dev_porto: "ポルトの整備"
 por_dev_porto_desc: "ドウロ川沿いのポルトはワインと漁業の都市だ。後世に「ポルトガル（ポルトの港）」という国名の由来となる古都を整備せよ。"
 por_university_coimbra: "コインブラ大学"
 por_university_coimbra_desc: "1290年創設のコインブラ大学——ポルトガル最古の大学が航海士・法律家・聖職者を育成する。エンリケ航海王子の下で活躍した多くの学者がここで学んだ。"
 por_lisbon_entrepot_nmt: "リスボンの交易中継港"
 por_lisbon_entrepot_nmt_desc: "リスボンの港湾局を整備し、東方交易の商品がここを経由してヨーロッパ全土に供給される体制を確立せよ。胡椒・香辛料・絹——リスボンが「ヨーロッパの香辛料市場」となる。"
 por_avis_dynasty: "アヴィス朝の強化"
 por_avis_dynasty_desc: "1385年の王朝危機を乗り越えたアヴィス朝——ジョアン1世の勝利によって建国されたポルトガル王朝が安定した統治基盤を確立した。"
 por_ordenacoes_afonsinas: "アフォンソ法典"
 por_ordenacoes_afonsinas_desc: "1446年に編纂されたアフォンソ法典はポルトガル最初の体系的法典だ。その後のマヌエル法典・フィリペ法典の原型として、ポルトガルの法的伝統を確立する。"
 por_dev_evora: "エヴォラの整備"
 por_dev_evora_desc: "アレンテージョ地方の中心都市エヴォラ——ローマ時代の神殿が残るこの古都は農業・文化の中心として整備される。"
 por_algarve_fisheries: "アルガルヴェの漁業"
 por_algarve_fisheries_desc: "ポルトガル南部のアルガルヴェ地方は大西洋の漁場に接している。タラ・イワシ・マグロの豊かな漁業がポルトガル人の海への親しみを育て、後の大航海時代の基盤となった。"

 por_ceuta_gateway: "セウタ——アフリカへの玄関口"
 por_ceuta_gateway_desc: "1415年、ジョアン1世率いるポルトガル軍がセウタを征服した——これがポルトガルの海外膨張の始まりだ。エンリケ航海王子はここでイスラム商人からサハラ交易ルートの情報を得て、アフリカ南下の野望を抱いた。"
 por_conquer_tangier: "タンジールの征服"
 por_conquer_tangier_desc: "ジブラルタル海峡を挟んでセウタと向き合うタンジール——北アフリカのムスリム勢力への圧力を強め、大西洋への出口を確保せよ。"
 por_moroccan_fortress: "モロッコの要塞"
 por_moroccan_fortress_desc: "アガディールをはじめとするモロッコの交易都市を掌握することで、サハラ横断交易の終点を支配し、金・象牙・塩の交易利益を独占せよ。"

 por_madeira_settlement: "マデイラ島の植民"
 por_madeira_settlement_desc: "1419年にポルトガル人が到達したマデイラ島——大西洋最初の植民地だ。無人島に砂糖を持ち込み、後のブラジル・西インド諸島の砂糖プランテーション・モデルを確立した。"
 por_azores_settlement: "アゾレス諸島の植民"
 por_azores_settlement_desc: "大西洋の真ん中に浮かぶアゾレス諸島を植民地化することで、大西洋横断航路の中継点が確保される。ここを拠点にさらに西への探検が可能となる。"
 por_guinea_trade: "ギニア交易"
 por_guinea_trade_desc: "アフリカ西岸を南下するポルトガル人が到達したギニア湾——金・象牙・後には奴隷の交易が始まる。エンリケ航海王子の夢が現实となりつつある。"
 por_gold_coast: "黄金海岸"
 por_gold_coast_desc: "エルミナ（1482年）——ポルトガルが建設したアフリカ初の恒久的な交易要塞。「黄金海岸（ゴールドコースト）」と呼ばれるこの地域から大量の金がポルトガルへ流れ込む。"
 por_sao_tome_sugar: "サントメ島の砂糖"
 por_sao_tome_sugar_desc: "赤道直下のサントメ島は砂糖プランテーションの理想的な環境だ。アフリカ本土からの強制労働でサントメ島はヨーロッパ最大の砂糖供給源となる。"
 por_angola_colony: "アンゴラ植民地"
 por_angola_colony_desc: "サントメ島の次の拠点としてアンゴラがポルトガルの重要な植民地となる。コンゴ王国との交易関係を確立し、アフリカ中西部への影響力を拡大せよ。"

 por_cape_of_good_hope: "喜望峰の発見"
 por_cape_of_good_hope_desc: "1488年、バルトロメウ・ディアスがアフリカ最南端の「嵐の岬（Cabo das Tormentas）」に到達した。ジョアン2世はこれを「喜望峰（Cabo da Boa Esperança）」と改名した——インドへの道が開けたからだ。"
 por_east_africa_trading_posts: "東アフリカ交易拠点"
 por_east_africa_trading_posts_desc: "モザンビーク・ソファラ——スワヒリ海岸の黄金と象牙の交易拠点を掌握することで、インド洋交易ネットワークへの参入が果たされる。"
 por_mombasa_fort: "モンバサ要塞"
 por_mombasa_fort_desc: "モンバサとマリンディ——東アフリカ最大の交易都市を制圧することでインド洋への制海権が確立される。1498年、ヴァスコ・ダ・ガマはマリンディからインドへの航路案内人を得た。"
 por_vasco_da_gama: "ヴァスコ・ダ・ガマのインド到達"
 por_vasco_da_gama_desc: "1498年5月20日、ヴァスコ・ダ・ガマがカリカット（コジコード）に上陸した。この瞬間、ヨーロッパとアジアを結ぶ海路が開かれ、アラブ商人・ヴェネツィアが独占していた香辛料貿易の構造が根本から変わる。"
 por_conquer_goa: "ゴアの征服"
 por_conquer_goa_desc: "1510年、アルブケルケがゴアを征服した——「ポルトガルのインド首都」の誕生だ。インド西岸の天然良港ゴアはエスタード・ダ・インディア（ポルトガル領インド）の中心として栄える。"
 por_malabar_trade: "マラバール海岸の香辛料"
 por_malabar_trade_desc: "コーチン・カリカット・クイロン——マラバール海岸はコショウ・カルダモン・生姜の産地だ。ここの香辛料を独占することでポルトガルはヨーロッパの香辛料価格を支配する。"
 por_hormuz_control: "ホルムズの支配"
 por_hormuz_control_desc: "1515年、アルブケルケがペルシャ湾の入口ホルムズを征服した。ここを掌握することでペルシャ・インド間の交易路を支配し、イスラム世界との交易を遮断できる。"
 por_conquer_malacca: "マラッカの征服"
 por_conquer_malacca_desc: "1511年、アルブケルケがマラッカを征服した——これが大航海時代最大の戦略的勝利だ。「東方交易の咽喉部」マラッカを支配することで、香辛料・絹・磁器の全交易路が掌握される。"
 por_spice_monopoly: "香辛料貿易の独占"
 por_spice_monopoly_desc: "ゴア・ホルムズ・マラッカの三拠点が揃い、インド洋の香辛料交易路が完全にポルトガルの支配下に入った。コショウ・ナツメグ・クローブがリスボン経由でヨーロッパに供給される。"
 por_indian_ocean_empire: "インド洋帝国"
 por_indian_ocean_empire_desc: "東アフリカからマラッカまで——ポルトガル海軍がインド洋を支配した。「カサ・ダ・インディア（インド交易所）」がリスボンで全香辛料交易を管理し、莫大な富がポルトガルにもたらされる。"

 por_brazil_discovery: "ブラジルの発見"
 por_brazil_discovery_desc: "1500年4月22日、ペドロ・アルヴァレス・カブラルが南米海岸に到達した——偶然か意図的かは今も議論されるが、この発見がポルトガルに第二の帝国をもたらした。カブラルは新大陸を「ヴェラ・クルス島（真の十字架の島）」と名付けた。後に「ブラジル（パウ・ブラジル染料木から）」と呼ばれる。"
 por_brazil_colony: "ブラジルの植民"
 por_brazil_colony_desc: "1532年、マルティン・アフォンソ・デ・ソウザがブラジル最初の恒久的な植民地「サン・ヴィセンテ」を建設した。ポルトガル系移民と先住民が混在する新しい社会が生まれつつある。"
 por_brazil_sugar: "ブラジルの砂糖産業"
 por_brazil_sugar_desc: "16世紀半ば、ブラジルはヨーロッパ最大の砂糖供給地となった。ペルナンブコ・バイーアのエンジェニョ（砂糖精製所）がアフリカからの強制労働で稼働し、莫大な富を生み出す。"
 por_brazil_empire: "ブラジル帝国"
 por_brazil_empire_desc: "バイーア・ペルナンブコ・リオ・デ・ジャネイロ——ブラジルの植民地が帝国の規模となった。砂糖・染料木・後には黄金と宝石がポルトガルへの富の流れを作り出す。"

 por_naval_supremacy: "海軍の覇権"
 por_naval_supremacy_desc: "大西洋とインド洋を制するポルトガル海軍——カラベル帆船の優れた操縦性と大砲の火力がアラブ・インド・中国の商船を圧倒する。"
 por_caravel: "カラベル帆船"
 por_caravel_desc: "エンリケ航海王子の時代に開発されたカラベル（Caravela）——三角帆（ラテン帆）により向かい風でも航行できるこの小型高速帆船が大航海時代を可能にした。「サンタ・マリア」もカラベルだった。"
 por_padroes: "パドロン（石柱標識）"
 por_padroes_desc: "ポルトガルの探検家たちはアフリカの各地に石柱（パドロン）を立て、ポルトガル国王の名とキリストの十字架を刻んだ。これが発見と支配の宣言だ——ポルトガルの到達地点が石に刻まれる。"
 por_royal_navy: "王立海軍"
 por_royal_navy_desc: "世界最強の海軍がポルトガルの覇権を支える——ガレオン船・カラック船・キャラベル船からなる艦隊がインド洋からブラジルまでを守る。"
 por_dev_setubal: "セトゥーバルの整備"
 por_dev_setubal_desc: "リスボン南方のセトゥーバル湾は天然の良港だ。塩・魚・ワインの産地として整備し、リスボンを補完する港湾都市とせよ。"
 por_order_of_christ: "キリスト騎士修道会"
 por_order_of_christ_desc: "1319年に設立されたキリスト騎士修道会（Ordem de Cristo）——テンプル騎士団の後継組織としてポルトガルに設立されたこの修道騎士団がエンリケ航海王子の探検を財政的に支援した。修道会の赤い十字がポルトガルの帆に描かれた。"
 por_treaty_tordesillas: "トルデシシャス条約"
 por_treaty_tordesillas_desc: "1494年、スペインとポルトガルは教皇アレクサンデル6世の仲介でトルデシーリャス条約を締結した——大西洋を縦に分割し、西をスペイン、東をポルトガルの領域とする。この条約がブラジルをポルトガル領に確定させた。"
 por_colonial_administration: "植民地行政"
 por_colonial_administration_desc: "アフリカ・インド・ブラジルに広がるポルトガル帝国を管理する行政機構——各総督・副王がリスボンの国王に報告し、交易収益を本国に送る体制が確立される。"
 por_estado_da_india_nmt: "エスタード・ダ・インディア"
 por_estado_da_india_nmt_desc: "「インド国家（Estado da India）」——ポルトガルのアジア帝国全体を指す概念だ。ゴアを首都とし、東アフリカからマラッカまでの海上交易路を支配するこの「帝国」は歴史上初の真に世界的な海上帝国だ。"
 por_dev_tomar: "トマールの整備"
 por_dev_tomar_desc: "キリスト騎士修道会の本拠地トマール——コンベント・ド・クリスト（キリスト修道院）はポルトガル・マヌエル様式建築の最高傑作として知られる。修道会の財力でここを整備せよ。"
 por_wine_trade: "ポルトガルワイン交易"
 por_wine_trade_desc: "ドウロ川流域のワイン——後の「ポートワイン」の原型となるポルトガルワインはイングランドやフランドルへの主要輸出品だ。「パーセルス条約（1703年）」の先駆けとなる英ポ交易関係を確立せよ。"
 por_dev_faro: "ファロの整備"
 por_dev_faro_desc: "アルガルヴェ地方の中心都市ファロ——1249年のキリスト教再征服でポルトガルに組み込まれたこの南部の都市を漁業・交易の拠点として整備せよ。"
 por_cape_verde: "カーボベルデ諸島"
 por_cape_verde_desc: "1456年に発見されたカーボベルデ諸島はアフリカとアメリカの中間に位置する戦略的要衝だ。大西洋横断交易の中継点として、後のブラジル植民地への補給基地となる。"
 por_lisbon_megalopolis: "リスボン——世界都市"
 por_lisbon_megalopolis_desc: "16世紀のリスボンは人口10万人を超えるヨーロッパ最大の都市の一つとなった。東洋の香辛料・アフリカの黄金・ブラジルの砂糖がここに集まり、「世界の首都」と称えられる。"
 por_casa_india: "カーサ・ダ・インディア"
 por_casa_india_desc: "リスボンに設立されたカーサ・ダ・インディア（インド交易所）はポルトガルの東洋交易を独占的に管理する国家機関だ。全ての香辛料輸入がここを通過し、莫大な関税収入をもたらす。"
 por_brazil_wood: "パウ・ブラジル（ブラジル木）"
 por_brazil_wood_desc: "ブラジルの名前の由来となったパウ・ブラジル（染料木）——この赤い染料木がヨーロッパの毛織物染色産業に不可欠な商品として大量に輸出される。ブラジル交易の最初の産物だ。"
 por_atlantic_domination: "大西洋の制覇"
 por_atlantic_domination_desc: "リスボンからアゾレス・マデイラ・カーボベルデ・ブラジルまで——ポルトガルが大西洋全体を支配した。スペインとの競争を制し、大西洋交易の主役として君臨する。"
 por_empire_of_seas: "海の覇者"
 por_empire_of_seas_desc: "「ポルトガルは小さな国だが、世界の半分を支配する」——歴史家の言葉が真実となった。大西洋からインド洋まで、ブラジルからマラッカまで——ポルトガルの帝国が世界の海を支配する。エスタード・ダ・インディアが完成した。"

 por_events.10.t: "喜望峰の発見——インドへの道が開かれた"
 por_events.10.d: "1488年、バルトロメウ・ディアスの艦隊がアフリカ最南端の「嵐の岬」を回り、インド洋に到達した。リスボンでこの知らせを受けたジョアン2世は震えた——15年後、ヴァスコ・ダ・ガマがインドへの直行航路を開く。アラブ商人が独占してきた香辛料貿易の時代が終わりを告げようとしている。"
 por_events.10.a: "神とポルトガルに栄光あれ！インドへの道が開かれた！"

 por_events.20.t: "ヴァスコ・ダ・ガマのインド到達"
 por_events.20.d: "1498年5月20日——4隻の船でリスボンを出発してから10ヶ月、ヴァスコ・ダ・ガマがカリカットに上陸した。地元の支配者（サモリン）は懐疑的だったが、ポルトガルは香辛料交易への参入を果たした。アラブ商人が激怒する中、ポルトガルの東方交易時代が始まった。"
 por_events.20.a: "コショウと胡椒——ポルトガルがインドの富を手に入れた！"

 por_events.30.t: "マラッカ征服——香辛料貿易の咽喉部を掌握"
 por_events.30.d: "1511年7月、アフォンソ・デ・アルブケルケ率いる1200名のポルトガル軍がマラッカを征服した。「東方の最も重要な場所」——マラッカを支配することで、中国・インド・香辛料諸島の全交易路が掌握される。アルブケルケはマラッカをゴア・ホルムズと並ぶポルトガル帝国の三本柱と位置づけた。"
 por_events.30.a: "マラッカは我らのもの！東方交易はポルトガルが独占する！"

 por_events.40.t: "カブラルのブラジル発見"
 por_events.40.d: "1500年4月22日、13隻の大艦隊でインドへ向かう途中、ペドロ・アルヴァレス・カブラルが嵐を避けて大きく西に迂回した先に未知の陸地を発見した。「ヴェラ・クルス島」——後に「ブラジル」と呼ばれる南米大陸の一部だ。トルデシーリャス条約によりポルトガルの領土となるこの地は、後にポルトガル最大の植民地となる。"
 por_events.40.a: "神の導きによる発見！ブラジルはポルトガルのものだ！"

 por_events.99.t: "海の覇者——ポルトガル帝国の完成"
 por_events.99.d: "リスボンからゴアへ、マラッカからブラジルへ——ポルトガルの帝国が世界の海を制した。エンリケ航海王子が夢見た「海のシルクロード」が現实となり、香辛料・黄金・砂糖・象牙がリスボンに集まる。ポルトガルは国土面積92,000平方キロメートルの小国から、世界最初の「グローバル海上帝国」に変貌した。"
 por_events.99.a: "ポルトガルよ永遠に！海の覇者として世界に君臨せよ！"
 STATIC_MODIFIER_NAME_por_henrique_mod: "ポルトガルの海洋伝統"
 STATIC_MODIFIER_DESC_por_henrique_mod: "アルフォンス4世のポルトガルが育む海洋伝統——大西洋の漁業・交易・航海技術がこの王国の基盤となる。"

 STATIC_MODIFIER_NAME_por_lisbon_mod: "リスボン——大西洋の港"
 STATIC_MODIFIER_DESC_por_lisbon_mod: "テージョ川河口の天然良港リスボンが整備され、大西洋交易の拠点として発展した。港湾の整備により大型船の寄港が可能となり、国際交易が活発化する。"
 STATIC_MODIFIER_NAME_por_porto_mod: "ポルト——ワインと魚の港"
 STATIC_MODIFIER_DESC_por_porto_mod: "ドウロ川流域のワインと大西洋の豊かな漁場——ポルトは輸出港として整備され、後の「ポートワイン」の原型となるワインと干し鱈（バカリャウ）がヨーロッパへ輸出される。"
 STATIC_MODIFIER_NAME_por_coimbra_mod: "コインブラ大学"
 STATIC_MODIFIER_DESC_por_coimbra_mod: "ポルトガル最古の大学が航海士・法律家・聖職者を育成する。"
 STATIC_MODIFIER_NAME_por_lisbon_trade_mod: "リスボン交易中継港"
 STATIC_MODIFIER_DESC_por_lisbon_trade_mod: "リスボンが東方香辛料のヨーロッパ最大の中継港として確立された。"
 STATIC_MODIFIER_NAME_por_avis_mod: "アヴィス朝の権威"
 STATIC_MODIFIER_DESC_por_avis_mod: "アヴィス朝の統治が安定し、大航海時代への基盤が整った。"
 STATIC_MODIFIER_NAME_por_ordenacoes_mod: "アフォンソ法典"
 STATIC_MODIFIER_DESC_por_ordenacoes_mod: "リスボンの書記たちが編んだ最初の体系的法典は、王国の隅々の裁判所に同じ規則を行き渡らせている。"
 STATIC_MODIFIER_NAME_por_evora_mod: "エヴォラの発展"
 STATIC_MODIFIER_DESC_por_evora_mod: "アレンテージョの古都エヴォラが農業・文化の中心として整備された。"
 STATIC_MODIFIER_NAME_por_fisheries_mod: "アルガルヴェ漁業"
 STATIC_MODIFIER_DESC_por_fisheries_mod: "大西洋の豊かな漁場がポルトガル人の海への親しみを育てた。"
 STATIC_MODIFIER_NAME_por_ceuta_mod: "セウタ拠点"
 STATIC_MODIFIER_DESC_por_ceuta_mod: "アフリカへの玄関口セウタがポルトガルの海外膨張の起点となった。"
 STATIC_MODIFIER_NAME_por_tangier_mod: "タンジールの征服"
 STATIC_MODIFIER_DESC_por_tangier_mod: "ジブラルタル海峡を掌握しアフリカへの制海権が確立された。"
 STATIC_MODIFIER_NAME_por_morocco_mod: "モロッコ要塞群"
 STATIC_MODIFIER_DESC_por_morocco_mod: "北アフリカのサハラ交易終点を支配しポルトガルの影響力が広まった。"
 STATIC_MODIFIER_NAME_por_madeira_mod: "マデイラ島の開発"
 STATIC_MODIFIER_DESC_por_madeira_mod: "大西洋初の植民地マデイラ島が砂糖プランテーションの原型を確立した。"
 STATIC_MODIFIER_NAME_por_azores_mod: "アゾレス諸島"
 STATIC_MODIFIER_DESC_por_azores_mod: "大西洋中央のアゾレスが大西洋横断航路の中継拠点となった。"
 STATIC_MODIFIER_NAME_por_guinea_trade_mod: "ギニア交易"
 STATIC_MODIFIER_DESC_por_guinea_trade_mod: "ギニアの港から届く金粉と象牙の袋が、リスボンの王室商館の帳簿を日ごとに厚くしている。"
 STATIC_MODIFIER_NAME_por_gold_coast_mod: "黄金海岸"
 STATIC_MODIFIER_DESC_por_gold_coast_mod: "エルミナ要塞からの金がポルトガル経済を豊かにした。"
 STATIC_MODIFIER_NAME_por_sao_tome_mod: "サントメ砂糖"
 STATIC_MODIFIER_DESC_por_sao_tome_mod: "赤道のサントメ島がヨーロッパ最大の砂糖供給地となった。"
 STATIC_MODIFIER_NAME_por_angola_mod: "アンゴラ植民地"
 STATIC_MODIFIER_DESC_por_angola_mod: "アンゴラがポルトガルのアフリカ中西部拠点として確立された。"
 STATIC_MODIFIER_NAME_por_east_africa_mod: "東アフリカ交易拠点"
 STATIC_MODIFIER_DESC_por_east_africa_mod: "スワヒリ海岸の黄金・象牙交易ネットワークがポルトガルの手に入った。"
 STATIC_MODIFIER_NAME_por_mombasa_mod: "モンバサ要塞"
 STATIC_MODIFIER_DESC_por_mombasa_mod: "東アフリカ最大の交易都市モンバサが掌握されインド洋制海権が確立した。"
 STATIC_MODIFIER_NAME_por_goa_mod: "ゴア——ポルトガルの東方首都"
 STATIC_MODIFIER_DESC_por_goa_mod: "エスタード・ダ・インディアの首都ゴアがインド洋交易の中心地となった。"
 STATIC_MODIFIER_NAME_por_malabar_mod: "マラバール香辛料"
 STATIC_MODIFIER_DESC_por_malabar_mod: "コショウ・カルダモン・生姜の産地マラバールがポルトガルの支配下に入った。"
 STATIC_MODIFIER_NAME_por_hormuz_mod: "ホルムズ支配"
 STATIC_MODIFIER_DESC_por_hormuz_mod: "ペルシャ湾入口ホルムズの掌握でペルシャ・インド交易を支配した。"
 STATIC_MODIFIER_NAME_por_spice_monopoly_mod: "香辛料貿易の独占"
 STATIC_MODIFIER_DESC_por_spice_monopoly_mod: "インド洋の香辛料交易路が完全にポルトガルの支配下に入った。"
 STATIC_MODIFIER_NAME_por_indian_ocean_mod: "インド洋帝国"
 STATIC_MODIFIER_DESC_por_indian_ocean_mod: "東アフリカからマラッカまでポルトガル海軍がインド洋を制した。"
 STATIC_MODIFIER_NAME_por_brazil_mod: "ブラジル植民地"
 STATIC_MODIFIER_DESC_por_brazil_mod: "南米の巨大植民地ブラジルがポルトガル帝国の第二の柱となった。"
 STATIC_MODIFIER_NAME_por_brazil_sugar_mod: "ブラジル砂糖産業"
 STATIC_MODIFIER_DESC_por_brazil_sugar_mod: "ブラジルのサトウキビ農園がヨーロッパ最大の砂糖供給地となった。"
 STATIC_MODIFIER_NAME_por_brazil_empire_mod: "ブラジル帝国"
 STATIC_MODIFIER_DESC_por_brazil_empire_mod: "ブラジルが帝国規模の植民地に成長し、ポルトガルの西方帝国が完成した。"
 STATIC_MODIFIER_NAME_por_naval_mod: "海軍の覇権"
 STATIC_MODIFIER_DESC_por_naval_mod: "大西洋とインド洋を制するポルトガル海軍が確立された。"
 STATIC_MODIFIER_NAME_por_caravel_mod: "カラベル帆船"
 STATIC_MODIFIER_DESC_por_caravel_mod: "向かい風でも航行できるカラベルが大航海時代を可能にした。"
 STATIC_MODIFIER_NAME_por_padroes_mod: "パドロン（石柱標識）"
 STATIC_MODIFIER_DESC_por_padroes_mod: "ポルトガルの到達地点を示す石柱が世界中に立てられた。"
 STATIC_MODIFIER_NAME_por_royal_navy_mod: "王立海軍"
 STATIC_MODIFIER_DESC_por_royal_navy_mod: "世界最強のポルトガル王立海軍が帝国を守る。"
 STATIC_MODIFIER_NAME_por_setubal_mod: "セトゥーバル港"
 STATIC_MODIFIER_DESC_por_setubal_mod: "リスボンを補完するセトゥーバルの港湾が整備された。"
 STATIC_MODIFIER_NAME_por_order_christ_mod: "キリスト騎士修道会"
 STATIC_MODIFIER_DESC_por_order_christ_mod: "エンリケ航海王子の探検を支援した騎士修道会がポルトガルの守護者となった。"
 STATIC_MODIFIER_NAME_por_tordesillas_mod: "トルデシーリャス条約"
 STATIC_MODIFIER_DESC_por_tordesillas_mod: "スペインとの世界分割条約でブラジルと東方がポルトガルの領域に確定した。"
 STATIC_MODIFIER_NAME_por_colonial_admin_mod: "植民地行政"
 STATIC_MODIFIER_DESC_por_colonial_admin_mod: "アフリカ・インド・ブラジルを管理する行政機構が確立された。"
 STATIC_MODIFIER_NAME_por_estado_india_mod: "エスタード・ダ・インディア"
 STATIC_MODIFIER_DESC_por_estado_india_mod: "ゴアを首都とするポルトガル領インドが世界最初の海上帝国として完成した。"
 STATIC_MODIFIER_NAME_por_tomar_mod: "トマール修道院"
 STATIC_MODIFIER_DESC_por_tomar_mod: "キリスト騎士修道会の本拠地トマールがポルトガル建築の傑作として整備された。"
 STATIC_MODIFIER_NAME_por_wine_mod: "ポルトガルワイン"
 STATIC_MODIFIER_DESC_por_wine_mod: "ドウロ川流域のワインがイングランド・フランドルへの主要輸出品となった。"
 STATIC_MODIFIER_NAME_por_faro_mod: "ファロの発展"
 STATIC_MODIFIER_DESC_por_faro_mod: "アルガルヴェの中心都市ファロが漁業・交易の拠点として整備された。"
 STATIC_MODIFIER_NAME_por_empire_of_seas_final_mod: "海の覇者"
 STATIC_MODIFIER_DESC_por_empire_of_seas_final_mod: "エンリケ航海王子の夢が現实となった。大西洋からインド洋まで、ポルトガルの帝国が世界の海を支配する。"
 STATIC_MODIFIER_NAME_por_cape_verde_mod: "カーボベルデ諸島"
 STATIC_MODIFIER_DESC_por_cape_verde_mod: "大西洋横断交易の中継拠点カーボベルデが確立された。"
 STATIC_MODIFIER_NAME_por_lisbon_mega_mod: "リスボン——世界の市場"
 STATIC_MODIFIER_DESC_por_lisbon_mega_mod: "東洋の香辛料・アフリカの黄金・ブラジルの砂糖が集まるリスボンは世界最大の交易市場となった。生産効率と最大RGO規模が飛躍的に向上し、商人の集積地として君臨する。"
 STATIC_MODIFIER_NAME_por_casa_india_mod: "カーサ・ダ・インディア"
 STATIC_MODIFIER_DESC_por_casa_india_mod: "インド交易所がポルトガルの全東洋交易を独占管理する。"
 STATIC_MODIFIER_NAME_por_brazil_wood_mod: "パウ・ブラジル"
 STATIC_MODIFIER_DESC_por_brazil_wood_mod: "ブラジル染料木がヨーロッパの毛織物産業に供給される。"
 STATIC_MODIFIER_NAME_por_atlantic_mod: "大西洋制覇"
 STATIC_MODIFIER_DESC_por_atlantic_mod: "ポルトガルが大西洋全体を支配する海軍覇権を確立した。"
