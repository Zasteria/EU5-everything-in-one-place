l_japanese:
 wal_wallachia_mission_pack: "ドラゴン騎士団——ドナウの守護者"
 wal_wallachia_mission_pack_DESCRIPTION:0 "カルパティア山脈とドナウ川に挟まれたワラキア公国。ボヤール貴族を統制し、モルダヴィア・トランシルヴァニアと共にルーマニア諸公国を統一するか、あるいはドラゴン騎士団の名のもとにオスマン帝国と戦い、ドナウの帝国を打ち立てよ。"
 wal_wallachia_mission_pack_CRITERIA_DESCRIPTION:0 "ヴォイヴォダ国家を強化し、ルーマニア諸公国を統一し、オスマン帝国と戦ってドナウ帝国を完成させよ。"
 wal_wallachia_mission_pack_BUTTON_TOOLTIP:0 "串刺し公の意志を継ぎ、ドナウの守護者となれ。"
 wal_wallachia_mission_pack_BUTTON_DETAILS:0 "「我らはドラゴンの子である」——カルパティアの狼たちよ、十字架を掲げよ！"
 wal_voivode_beginnings: "ヴォイヴォダ国家の黎明"
 wal_voivode_beginnings_desc: "1330年、ポサダの戦いでハンガリー王を退けたバサラブ1世——その独立の意志を受け継ぎ、カルパティアとドナウに挟まれたこの地に、新たな公国の礎を築け。"
 wal_voivode_authority: "ヴォイヴォダの権威"
 wal_voivode_authority_desc: "ボヤール貴族たちの推挙によって選ばれるヴォイヴォダの座——その権威を盤石なものとし、公位継承の混乱を防げ。"
 wal_boyar_council: "ボヤール評議会の統制"
 wal_boyar_council_desc: "広大な荘園を有するボヤール貴族の合議体——彼らの支持なくしてワラキアの統治はままならない。評議会との関係を安定させよ。"
 wal_found_bucharest: "ブカレスト建設"
 wal_found_bucharest_desc: "ドナウ川に近いジュルジュの地——ヴォイヴォダが夏の宮廷を構えたこの地を「ブクレシュティ」として整備し、南方防衛と交易の要とせよ。"
 wal_targoviste_dev: "トゥルゴヴィシュテの発展"
 wal_targoviste_dev_desc: "カルパティアの麓に築かれた旧都トゥルゴヴィシュテ——歴代ヴォイヴォダの宮廷が置かれたこの街を、なお一層発展させよ。"
 wal_fortify_carpathians: "カルパティアの要塞化"
 wal_fortify_carpathians_desc: "南から北へと連なるカルパティア山脈——この天然の城壁に人工の要塞を重ね、いかなる侵略者も寄せ付けぬ防衛線を築け。"
 wal_orthodox_church: "正教会の保護"
 wal_orthodox_church_desc: "ビザンツの信仰を受け継ぐ正教会——その自主独立教会（総主教座）の首座に立つことで、ヴォイヴォダの権威に宗教的正統性を与えよ。"
 wal_dregatori: "デレガトリの登用"
 wal_dregatori_desc: "世襲貴族の専横は国家の敵である。家柄ではなく能力によって選ばれた「デレガトリ」（官吏）を登用し、忠実な統治機構を築け。"
 wal_unite_voivodes: "ヴォイヴォダの統一"
 wal_unite_voivodes_desc: "ワラキアとモルダヴィア——同じルーマニア人でありながら分裂を続けるこの二つの公国の争いは、敵を利するだけだ。モルダヴィアの地に足がかりを持つ全ての国は、その地の全土に対する正当な請求権を主張できるようになる。"
 wal_subdue_moldavia: "モルダヴィア服属"
 wal_subdue_moldavia_desc: "ステファン大公の栄光も今は昔——モルダヴィア公国をワラキアの支配下に組み込み、ルーマニア統一の礎とせよ。"
 wal_conquer_transylvania: "トランシルヴァニア征服"
 wal_conquer_transylvania_desc: "ハンガリー王やその後継者たちが長らく支配してきたトランシルヴァニア——この地をワラキアの版図に組み入れ、外部からの干渉に終止符を打て。"
 wal_szekely_land: "セーケイ人の地"
 wal_szekely_land_desc: "トランシルヴァニア東部に暮らす戦士の民、セーケイ人——彼らの自治と軍事的伝統を尊重しつつ、その武勇をワラキアの力とせよ。"
 wal_saxon_towns: "ザクセン人都市の統合"
 wal_saxon_towns_desc: "ブラショフ、シビウをはじめとするトランシルヴァニアのザクセン人都市——中世以来の商業的繁栄を誇るこれらの都市を、王国経済の柱とせよ。"
 wal_secure_danube: "ドナウの確保"
 wal_secure_danube_desc: "バルカンとカルパティアを分かつ大河ドナウ——その流域を確保し、南方防衛と交易の生命線とせよ。"
 wal_carpathian_hegemony: "カルパティア覇権の完成"
 wal_carpathian_hegemony_desc: "カルパティア山脈とドナウ川に囲まれたこの地の全てが、ヴォイヴォダの権威に服する時が来た。"
 wal_romanian_unity: "ルーマニア統一の完成"
 wal_romanian_unity_desc: "ワラキア、モルダヴィア、トランシルヴァニア——分断されてきたルーマニア人の地を、ついに一つの王冠のもとに統一せよ。"
 wal_order_of_dragon_founding: "ドラゴン騎士団への参加"
 wal_order_of_dragon_founding_desc: "神聖ローマ皇帝ジギスムントが、対オスマン十字軍の理念のもとに創設せんとするドラゴン騎士団——我らが統治者自身がこの栄えある結社の一員として名を連ねよ。"
 wal_impale_the_sultan: "串刺し公の逆襲"
 wal_impale_the_sultan_desc: "自らの城壁と軍勢の陰に隠れ、安穏としているスルタン——イスラムの軍勢と刃を交えるその戦場で、何人たりとも神の裁きから逃れられぬことを、その身をもって示させよ。"
 wal_drive_out_turks: "トルコ人を駆逐せよ"
 wal_drive_out_turks_desc: "ギリシャとブルガリアの民を圧政から解放する時が来た。トルコの侵略者どもを、ボスポラスの対岸へと追い返せ。"
 wal_liberate_serbia: "セルビア解放"
 wal_liberate_serbia_desc: "コソボの戦い以来オスマンの軛に苦しんできたセルビアの同胞——彼らを解放し、バルカン正教世界の守護者となれ。"
 wal_reclaim_morea: "モレアの奪還"
 wal_reclaim_morea_desc: "かつてビザンツ最後の光を灯したモレア専制公領——ペロポネソス半島のこの地を、異教徒の手から取り戻せ。"
 wal_heir_of_rome: "ローマの後継者"
 wal_heir_of_rome_desc: "ビザンツ帝国が成し得なかったこと——異教徒を打ち破り、ヨーロッパから完全に駆逐すること——を、我らは成し遂げた。ローマの外套を纏うにふさわしいのは、他の誰でもない我らである。"
 wal_bulwark_of_christendom: "キリスト教世界の防波堤"
 wal_bulwark_of_christendom_desc: "ルーマニア諸公国は、キリスト教世界を守る防波堤である。国境を要塞化することは、神に対する我らの義務だ。"
 wal_ottoman_downfall: "オスマンの没落"
 wal_ottoman_downfall_desc: "バルカンと中東に覇を唱えたオスマン帝国——その脅威を、ついに歴史の彼方へ葬り去った。"
 wal_reclaim_constantinople: "コンスタンティノープル奪還"
 wal_reclaim_constantinople_desc: "異教徒の手に落ちて久しいコンスタンティノープル——ドラゴン騎士団の末裔として、この帝都を解放せよ。"
 wal_danubian_empire: "ドナウ帝国の完成"
 wal_danubian_empire_desc: "カルパティアからバルカン、そしてボスポラスへ——串刺し公の逆襲から始まったこの戦いは、ドナウに君臨する大帝国の完成をもって終わる。"
 wal_danube_trade: "ドナウ交易路"
 wal_danube_trade_desc: "ドナウ川を通じて西欧と黒海を結ぶ交易路——この富の流れをワラキアの国庫へと引き込め。"
 wal_treasury: "国庫の充実"
 wal_treasury_desc: "戦と外交、そして宮廷の維持——あらゆる国事には金が要る。潤沢な国庫を築き、いかなる困難にも備えよ。"
 wal_manufactories: "マニュファクチュアの発展"
 wal_manufactories_desc: "生産の分野で起きつつある大きな変革——マニュファクチュアへの投資を惜しまず、産業の時代に備えよ。"
 wal_events.2.t: "コンスタンティノープル奪還"
 wal_events.2.d: "偉大なる帝都コンスタンティノープルが、ついに我らの手に落ちた。ドラゴン騎士団の旗が、異教徒に奪われていたこの都に翻る。"
 wal_events.2.a: "ローマの都は我らのものだ！"
 wal_events.99.t: "ドナウ帝国の宣言"
 wal_events.99.d: "カルパティアの麓の小さな公国は、ドナウとバルカンに君臨する大帝国へと生まれ変わった。串刺し公の意志は、ここに完全な形で成し遂げられたのだ。"
 wal_events.99.a: "ドナウ帝国に栄光あれ！"
 STATIC_MODIFIER_NAME_wal_voivode_beginnings_mod: "ヴォイヴォダ国家の黎明"
 STATIC_MODIFIER_DESC_wal_voivode_beginnings_mod: "バサラブ1世が異国の宗主に膝を屈しなかった日の記憶は、ワラキアの兵たちの誇りとなっている。"
 STATIC_MODIFIER_NAME_wal_voivode_mod: "ヴォイヴォダの権威"
 STATIC_MODIFIER_DESC_wal_voivode_mod: "ヴォイヴォダの座が安定し、公位継承への信認が高まった。"
 STATIC_MODIFIER_NAME_wal_boyar_mod: "ボヤール評議会"
 STATIC_MODIFIER_DESC_wal_boyar_mod: "ボヤール貴族との関係が安定し、統治の基盤が固まった。"
 STATIC_MODIFIER_NAME_wal_bucharest_mod: "ブカレスト建設"
 STATIC_MODIFIER_DESC_wal_bucharest_mod: "ジュルジュの地が「ブクレシュティ」として整備され、南方の要となった。"
 STATIC_MODIFIER_NAME_wal_targoviste_mod: "トゥルゴヴィシュテの発展"
 STATIC_MODIFIER_DESC_wal_targoviste_mod: "旧都トゥルゴヴィシュテが、なお一層の繁栄を見せている。"
 STATIC_MODIFIER_NAME_wal_carpathians_mod: "カルパティアの要塞網"
 STATIC_MODIFIER_DESC_wal_carpathians_mod: "山脈に築かれた要塞網が、いかなる侵略者も寄せ付けない。"
 STATIC_MODIFIER_NAME_wal_church_mod: "正教会の保護"
 STATIC_MODIFIER_DESC_wal_church_mod: "ワラキア正教会が国家の保護下に入り、宗教的正統性が高まった。"
 STATIC_MODIFIER_NAME_wal_impale_mod: "串刺し公の逆襲"
 STATIC_MODIFIER_DESC_wal_impale_mod: "スルタンの使者の前に並べられた杭の列の噂は、いまもイスラムの軍勢の心を凍らせている。"
 STATIC_MODIFIER_NAME_wal_dregatori_mod: "デレガトリの登用"
 STATIC_MODIFIER_DESC_wal_dregatori_mod: "能力によって選ばれた官吏たちが、忠実な統治機構を支えている。"
 STATIC_MODIFIER_NAME_wal_moldavia_mod: "モルダヴィア服属"
 STATIC_MODIFIER_DESC_wal_moldavia_mod: "モルダヴィア公国がワラキアの支配下に組み込まれた。"
 STATIC_MODIFIER_NAME_wal_transylvania_mod: "トランシルヴァニア征服"
 STATIC_MODIFIER_DESC_wal_transylvania_mod: "トランシルヴァニアがワラキアの版図に組み入れられた。"
 STATIC_MODIFIER_NAME_wal_szekely_mod: "セーケイ人の武勇"
 STATIC_MODIFIER_DESC_wal_szekely_mod: "セーケイの山岳の戦士たちが、ワラキアの軍旗のもとで槍を並べている。"
 STATIC_MODIFIER_NAME_wal_saxon_mod: "ザクセン人都市の繁栄"
 STATIC_MODIFIER_DESC_wal_saxon_mod: "トランシルヴァニアのザクセン人都市が、王国経済の柱となった。"
 STATIC_MODIFIER_NAME_wal_danube_mod: "ドナウの確保"
 STATIC_MODIFIER_DESC_wal_danube_mod: "ドナウ川流域が確保され、交易の生命線が開かれた。"
 STATIC_MODIFIER_NAME_wal_hegemony_mod: "カルパティア覇権"
 STATIC_MODIFIER_DESC_wal_hegemony_mod: "カルパティアとドナウに囲まれた地が、完全にヴォイヴォダの権威に服した。"
 STATIC_MODIFIER_NAME_wal_unity_mod: "ルーマニア統一"
 STATIC_MODIFIER_DESC_wal_unity_mod: "ワラキア、モルダヴィア、トランシルヴァニアが一つの王冠のもとに統一された。"
 STATIC_MODIFIER_NAME_wal_order_of_dragon_mod: "ドラゴン騎士団への参加"
 STATIC_MODIFIER_DESC_wal_order_of_dragon_mod: "竜の騎士団の紋章をまとった使者たちが、キリスト教世界の宮廷を巡り、オスマンに抗する同盟の輪を広げている。"
 STATIC_MODIFIER_NAME_wal_drive_out_mod: "トルコ人の駆逐"
 STATIC_MODIFIER_DESC_wal_drive_out_mod: "異教徒に対する戦いで、軍の精強さが大いに証明された。"
 STATIC_MODIFIER_NAME_wal_serbia_mod: "セルビア解放"
 STATIC_MODIFIER_DESC_wal_serbia_mod: "セルビアの同胞が解放され、バルカン正教世界での威信が高まった。"
 STATIC_MODIFIER_NAME_wal_morea_mod: "モレアの奪還"
 STATIC_MODIFIER_DESC_wal_morea_mod: "ペロポネソスの港から届く葡萄酒と絹の荷が、ワラキアの商人たちの蔵を満たしている。"
 STATIC_MODIFIER_NAME_wal_heir_of_rome_mod: "ローマの後継者"
 STATIC_MODIFIER_DESC_wal_heir_of_rome_mod: "ビザンツ皇帝の後継を名乗るワラキアの宮廷では、聖職者も貴族も、その正統を疑わず頭を垂れている。"
 STATIC_MODIFIER_NAME_wal_bulwark_mod: "キリスト教世界の防波堤"
 STATIC_MODIFIER_DESC_wal_bulwark_mod: "国境の要塞網が、キリスト教世界を守る盾として機能している。"
 STATIC_MODIFIER_NAME_wal_downfall_mod: "オスマンの没落"
 STATIC_MODIFIER_DESC_wal_downfall_mod: "もはやオスマンの襲来に怯えぬ国境で、兵たちは磨き上げた調練の腕を誇らしげに互いに示している。"
 STATIC_MODIFIER_NAME_wal_manufactories_mod: "マニュファクチュアの発展"
 STATIC_MODIFIER_DESC_wal_manufactories_mod: "ブクレシュティの工房の煙突からは、新しい織物と道具を生み出す煙が絶えず立ちのぼっている。"
 STATIC_MODIFIER_NAME_wal_trade_mod: "ドナウ交易路"
 STATIC_MODIFIER_DESC_wal_trade_mod: "ドナウを通じた交易網が、国家の富を守っている。"
 STATIC_MODIFIER_NAME_wal_treasury_mod: "国庫の充実"
 STATIC_MODIFIER_DESC_wal_treasury_mod: "王宮の地下蔵には銀貨の箱が積み上げられ、商人たちは貨幣の重みを疑わずに取引している。"
 STATIC_MODIFIER_NAME_wal_danubian_empire_mod: "ドナウ帝国の統治網"
 STATIC_MODIFIER_DESC_wal_danubian_empire_mod: "ドナウの流れそのものが帝国の血脈となり、遡上も下航も自在に進む。王朝の正統性は揺るぎなく、王権の力は隅々にまで行き渡る。"
