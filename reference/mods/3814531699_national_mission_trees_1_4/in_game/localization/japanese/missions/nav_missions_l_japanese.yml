l_japanese:
 nav_crown_mission_pack: "ナバラ王国の遺産"
 nav_crown_mission_pack_DESCRIPTION:0 "ピレネー山脈の麓に根を張るバスクの王国ナバラは、カスティーリャ、アラゴン、フランスという三つの大国に囲まれた小さな存在である。しかし、その血脈はフランス王家やアラゴン王家にも連なっており、歴史の歯車が噛み合えば、思いがけぬ大国へと飛躍する道も開かれている。バスクの結束を固めるか、ガスコーニュを越えてフランスに介入するか、あるいはイベリア半島の覇権を握るか。小国の運命は、王の選択次第である。"
 nav_crown_mission_pack_CRITERIA_DESCRIPTION:0 "ナバラ王国としてミッションを達成し、バスクの統一とイベリア半島・フランスへの影響力を確立せよ。"
 nav_crown_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してナバラ王国の遺産を歩め。"
 nav_crown_mission_pack_BUTTON_DETAILS:0 "バスクの結束を固め、ガスコーニュに進出し、イベリアに覇を唱えよ！"

 # === ROOT ===
 nav_kingdom_of_pamplona: "パンプローナ王国"
 nav_kingdom_of_pamplona_desc: "エネコ・アリスタによって築かれたパンプローナ王国は、バスクの地に深く根を張る古き王統である。だが周囲をカスティーリャ、アラゴン、フランスという大国に囲まれ、その存続は常に脆い均衡の上にある。"

 # === BRANCH 1: バスクの結束 ===
 nav_secure_bayonne: "バイヨンヌの確保"
 nav_secure_bayonne_desc: "海を隔てた同胞、フレンチ・バスクの地バイヨンヌを我が王国の下に統合する。バスクの民すべてが一つの旗の下に集うべき時が来た。"

 nav_basque_unity: "バスク民族の結束"
 nav_basque_unity_desc: "言語と慣習を同じくする民が、王国の中核を担うようになった。バスクであることが、我が国の何よりの誇りとなる。"

 nav_fueros_and_privileges: "フエロスと特権の保障"
 nav_fueros_and_privileges_desc: "バスクの諸都市が古くから守り続けてきた自治の特権、フエロス。貴族たちの満足が高まれば、その保障は王権にとっても確かな足場となる。"

 nav_efficient_administration: "効率的な統治機構"
 nav_efficient_administration_desc: "会計所を各地に整備し、王国の財政基盤を固める。小国であればこそ、統治の効率こそが生命線となる。"

 nav_renaissance_of_pamplona: "パンプローナのルネサンス"
 nav_renaissance_of_pamplona_desc: "イタリアより興った新しき学芸の風が、ピレネーの麓にも届いた。小さな王国であっても、その精神は時代の最先端を歩む。"

 # === BRANCH 2: ガスコーニュ進出 ===
 nav_intervene_hundred_years_war: "百年戦争への介入"
 nav_intervene_hundred_years_war_desc: "フランスとイングランドの間で繰り広げられる長き戦い。我が王統の血脈は両国の王家に連なり、ナバラには第三の勢力として介入する権利と機会がある。"

 nav_foothold_in_france: "フランスへの足掛かり"
 nav_foothold_in_france_desc: "百年戦争の混乱に乗じ、フランス本土の一部を確保する。これにより、王国の版図は南西フランスの奥深くまで及ぶことになる。"

 nav_secure_gascony: "ガスコーニュの確保"
 nav_secure_gascony_desc: "テュルサンの地を制し、ボルドーの港を手に入れる。これによりガスコーニュ全土が我が王国の支配下に入り、大西洋への扉が開かれる。"

 nav_claims_on_france: "フランス王位への布石"
 nav_claims_on_france_desc: "フランス本土に広く版図を確保した今、我が王統が抱くフランス王位への野心は、もはや単なる夢物語ではない。"

 nav_house_of_evreux: "エヴルー家の野望"
 nav_house_of_evreux_desc: "フランスとの同君連合、あるいはパリそのものの占領。いずれの形であれ、我が王統がフランスの王座に対して持つ正当性は、もはや誰の目にも疑いようがない。"

 nav_claim_french_throne: "フランス王位の請求"
 nav_claim_french_throne_desc: "フランス王家が断絶した今、我が王統こそがその王冠を継ぐ正当な相続人である。ナバラとフランス、二つの王冠が一つの頭上に戴かれる時が来た。"

 # === BRANCH 3: イベリアの統一 ===
 nav_aragonese_inheritance: "アラゴンとの血脈"
 nav_aragonese_inheritance_desc: "我が王統とアラゴン王家は、同じ祖先の血を分けている。両国の運命は、いずれ一つに結ばれる時が来るだろう。"

 nav_castilian_question: "カスティーリャとの関係"
 nav_castilian_question_desc: "イベリア半島最大の大国、カスティーリャ。これと手を結ぶか、あるいは敵として立ち向かうか。いずれにせよ、その関係を明確にせねばならない。"

 nav_reconquista_legacy: "レコンキスタの遺産"
 nav_reconquista_legacy_desc: "イスラム勢力に対する数世紀にわたる戦いの記憶は、イベリアの諸国に共通する誇りである。我が王国もまた、その栄光の一端を担う。"

 nav_dominate_iberia: "イベリアの覇権"
 nav_dominate_iberia_desc: "かつての小国は、もはやイベリア半島において無視できぬ存在となった。バスクの王冠は、半島の運命を左右する力を持つに至った。"

 # === 海への憧憬 ===
 nav_basque_seafarers: "バスクの漁師たち"
 nav_basque_seafarers_desc: "古くからバスクの民は、勇敢な漁師として知られてきた。彼らの技術と勇気を、国家の財として活かすべき時である。"

 nav_fearless_fishermen: "恐れを知らぬ船乗りたち"
 nav_fearless_fishermen_desc: "バスクの船乗りは、荒れ狂う北の海をも恐れない。その操船技術と勇敢さは、すでに大陸中にその名を知られている。"

 nav_transatlantic_whalers: "大西洋を越える捕鯨者たち"
 nav_transatlantic_whalers_desc: "クジラを追い求めるバスクの船は、ついに大西洋の彼方まで進出した。新たな海域での操業は、王国に莫大な富をもたらすだろう。"

 # === FINAL ===
 nav_basque_in_glory: "栄光のバスク"
 nav_basque_in_glory_desc: "ピレネーの麓に生まれた小さな王国は、文化を花開かせ、フランスの王座を掴み取り、スペインとして統一イベリアに君臨した。バスクの栄光は、もはや誰にも否定できない。"
 STATIC_MODIFIER_NAME_nav_secure_bayonne_mod: "バイヨンヌの軍事的経験"
 STATIC_MODIFIER_DESC_nav_secure_bayonne_mod: "バイヨンヌはフランスとスペインの国境に近いバスク地方の交通の要衝だ。ガスコーニュとイベリア半島を繋ぐこの港湾都市は百年戦争中はイングランドの拠点だったが1451年にフランスに奪われた。ナバラにとってこの都市の掌握は大西洋への出口を確保する死活問題だ。"

 # === 静的モディファイア ===


 STATIC_MODIFIER_NAME_nav_basque_unity_mod: "バスクの結束"
 STATIC_MODIFIER_DESC_nav_basque_unity_mod: "バスク人は起源不明のヨーロッパで最も古い民族集団の一つで、インド・ヨーロッパ語族とは無関係のバスク語を話す。ピレネー山脈の両側に住むバスク人の文化的統一性はフランス・スペインいずれの支配下でも独自のアイデンティティを保ち続けた。"

 STATIC_MODIFIER_NAME_nav_fueros_and_privileges_mod: "フエロスの保障"
 STATIC_MODIFIER_DESC_nav_fueros_and_privileges_mod: "フエロス（特権・慣習法）はナバラ・バスク地方の伝統的な自治権を保証する法体系だ。徴税・兵役・司法に関する独自の権限は中央集権化を目指すカスティーリャ王権と常に緊張関係にあった。この独自の法伝統こそがナバラのアイデンティティの核心をなしている。"

 STATIC_MODIFIER_NAME_nav_efficient_administration_mod: "効率的な統治"
 STATIC_MODIFIER_DESC_nav_efficient_administration_mod: "ナバラ王国は「カマラ・デ・コンポス（会計所）」という財政管理機関を整備し、フランス系の行政システムを採用した。フランス王家との長い縁（ナバラ王家はしばしばフランス王家と姻戚関係にあった）がもたらした行政の洗練さはイベリア半島の他の王国と一線を画した。"

 STATIC_MODIFIER_NAME_nav_renaissance_of_pamplona_mod: "パンプローナの新風"
 STATIC_MODIFIER_DESC_nav_renaissance_of_pamplona_mod: "ナバラの首都パンプローナはイタリア・ルネサンスをいち早く受け入れた都市の一つだ。イベリア半島とフランスの中間に位置する地理的特性から、フランス文化とイタリア文化の双方の影響を受けてナバラ独自の文化的発展を遂げた。"

 STATIC_MODIFIER_NAME_nav_foothold_in_france_mod: "フランスにおける橋頭堡"
 STATIC_MODIFIER_DESC_nav_foothold_in_france_mod: "ナバラ王国はピレネーの北側にも領土を持ち、バス＝ナバル（現在のフランス・バスク地方）がその中心だった。歴史的にナバラの王家は頻繁にフランス王家と結婚し、フランスに足がかりを持つことを外交の基本としてきた。"

 STATIC_MODIFIER_NAME_nav_secure_gascony_mod: "ガスコーニュの王冠"
 STATIC_MODIFIER_DESC_nav_secure_gascony_mod: "ガスコーニュはバスク人の言語・文化的影響を強く受けた南フランスの地域で、百年戦争でイングランドの重要な領土だった。エレアノール・オブ・アクイテーニュが嫁いだことで有名なこの豊かな地はナバラにとって「バスク世界」の完成を意味する。"

 STATIC_MODIFIER_NAME_nav_house_of_evreux_mod: "エヴルー家の威信"
 STATIC_MODIFIER_DESC_nav_house_of_evreux_mod: "エヴルー家はフランスのヴァロワ家の分家でナバラ王家となった。「ナバラ王家のフランス人」としてエヴルー家はフランスとの強い絆を保ちながらも独立したナバラ王権を主張した。カルロス2世（悪しきカルロス）はフランス王位を主張して百年戦争に干渉するほど野心的だった。"

 STATIC_MODIFIER_NAME_nav_claim_french_throne_mod: "ナバラ・フランス両王"
 STATIC_MODIFIER_DESC_nav_claim_french_throne_mod: "ナバラ女王ジャンヌ1世（1274〜1305年）がフランス王フィリップ4世（端麗王）と結婚したことで、ナバラとフランスは同君連合となった。カペー朝断絶後の継承問題でナバラ王家はフランス王位を主張する正当な根拠を持っていた。"

 STATIC_MODIFIER_NAME_nav_castilian_question_mod: "カスティーリャとの確かな関係"
 STATIC_MODIFIER_DESC_nav_castilian_question_mod: "ナバラはカスティーリャとアラゴンの両大国に挟まれた小王国として常に両者の干渉を受けてきた。1512年にはフェルナンド2世がナバラを軍事的に征服してカスティーリャに併合した——この歴史をゲームで変えることがミッションの意義だ。"

 STATIC_MODIFIER_NAME_nav_reconquista_legacy_mod: "レコンキスタの誇り"
 STATIC_MODIFIER_DESC_nav_reconquista_legacy_mod: "ナバラ王国はレコンキスタで重要な役割を果たした。サンチョ3世は11世紀にイベリア半島最大の勢力となり「諸王の王」を称した。しかし同時にナバラはムデハル（キリスト教支配下のイスラム教徒）やユダヤ人に対して他の地域より寛容な政策を採ることもあった。"

 STATIC_MODIFIER_NAME_nav_dominate_iberia_mod: "イベリアの覇者"
 STATIC_MODIFIER_DESC_nav_dominate_iberia_mod: "イベリア半島の小国ナバラが大国カスティーリャ・アラゴンを凌いで半島の覇者となる——これはサンチョ3世大王（在位1000〜1035年）が一時的に実現した夢の再現だ。ピレネーの要衝を押さえる地理的優位をフルに活用することで達成可能な歴史的偉業だ。"

 STATIC_MODIFIER_NAME_nav_basque_seafarers_mod: "バスクの漁師の伝統"
 STATIC_MODIFIER_DESC_nav_basque_seafarers_mod: "バスクの漁師たちはタラを求めてニューファンドランド沖（カナダ）まで遠征したことで知られる——コロンブス以前に大西洋を横断していた可能性さえある。バスク捕鯨船はアイルランド沖から北極圏まで漁場を広げ、その航海技術はヨーロッパ屈指だった。"

 STATIC_MODIFIER_NAME_nav_fearless_fishermen_mod: "恐れを知らぬ船乗りの士気"
 STATIC_MODIFIER_DESC_nav_fearless_fishermen_mod: "「バスクの船乗りは嵐を恐れない」という言葉はヨーロッパ中で知られた。荒波のビスケー湾（バスク人にとって「我らの海」）で磨かれた航海術と胆力は、彼らを大西洋時代の最前線に立たせた。スペインのアルマダ艦隊の多くもバスク出身の水兵だった。"

 STATIC_MODIFIER_NAME_nav_transatlantic_whalers_mod: "大西洋捕鯨の航海術"
 STATIC_MODIFIER_DESC_nav_transatlantic_whalers_mod: "バスク捕鯨船は15世紀から北米大陸のラブラドル半島沖でホッキョクセミクジラを捕獲していたと考えられている。カナダのレッドベイにはバスク捕鯨基地の遺跡が残り、ユネスコ世界遺産に登録されている。この先駆的な大西洋横断活動が植民地時代の礎を作った。"

 STATIC_MODIFIER_NAME_nav_third_faction_mod: "独立した第三陣営の覚悟"
 STATIC_MODIFIER_DESC_nav_third_faction_mod: "ナバラは百年戦争でイングランドともフランスとも明確に同盟することを避け、両者から利益を引き出す巧妙な中立政策を採った。「悪しきカルロス」と呼ばれたカルロス2世の外交はずる賢いが現実主義的であり、小国が生き残るための知恵の体現だった。"

 STATIC_MODIFIER_NAME_nav_basque_in_glory_mod: "栄光のバスク"
 STATIC_MODIFIER_DESC_nav_basque_in_glory_mod: "バスクの漁師・牧羊者・職人から成り立っていた小さな王国ナバラが、フランス・スペインいずれの野望にも屈せず地中海から大西洋まで影響力を持つ大国へと成長した。古来から不屈の独立心を誇るバスク人の精神が、この歴史的奇跡を支えている。"

 # === イベント ===
 nav_events.1.t: "パンプローナ王国の起源"
 nav_events.1.d: "ナバラ王国は、9世紀にエネコ・アリスタによって築かれたパンプローナ王国の継承者である。バスク地方を中心とするこの王統は、カロリング帝国の辺境として生まれ、イスラム勢力とフランク王国という二つの大国の間で、独自の道を歩み続けてきた。今、ピレネーの麓に再びその旗を掲げる時が来た。"
 nav_events.1.a: "王国の歴史を胸に刻んだ"

 nav_events.2.t: "フランス王位への野心"
 nav_events.2.d: "我が王統エヴルー家は、フランス王家とも血を分けた一族である。フランス本土に広く版図を確保した今、ナバラの王はその継承権を公然と主張する時を迎えた。法廷において、また戦場において、その正当性を証明せねばならない。"
 nav_events.2.a: "王位請求の大義を掲げた"

 nav_events.3.t: "アラゴンとの血脈"
 nav_events.3.d: "ナバラとアラゴンの王家は、同じ祖先の血を分けている。両国の王位継承者がしばしば同一人物となることも、決して珍しいことではない。いずれかの王統が断絶すれば、両国は一つの王冠の下に統合される運命にあるのかもしれない。"
 nav_events.3.a: "血脈の意味を理解した"

 nav_events.4.t: "百年戦争への介入"
 nav_events.4.d: "フランスとイングランドの間で続く百年戦争は、もはや単純な二国間の争いではない。我が王統エヴルー家は、フランス・カペー家の血を引くと同時に、イングランド宮廷とも深い縁戚関係を結んでいる。さらに、ナバラの王位そのものが、フランス王位継承法の議論において重要な先例となってきた歴史がある。\\n\\nこの混乱の時代において、ナバラには三つの道がある。一つは、血の繋がりと旧来の友好に基づきフランスを支持する道。一つは、貿易上の利益と対カスティーリャの防波堤としてイングランドを支持する道。そして最後に、いずれの大国にも与せず、独立した第三の勢力として己の利益のみを追求する道である。この選択は、今後の王国の運命を大きく左右することになるだろう。"
 nav_events.4.a: "フランスを支持する"
 nav_events.4.b: "イングランドを支持する"
 nav_events.4.c: "独立した第三陣営として参戦する"
