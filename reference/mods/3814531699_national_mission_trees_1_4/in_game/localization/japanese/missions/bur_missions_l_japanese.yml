l_japanese:
 bur_crown_of_lothair_mission_pack: "ロタリンギアの王冠"
 bur_crown_of_lothair_mission_pack_DESCRIPTION:0 "1337年、百年戦争の端緒。フランスとイングランドの間に挟まれたブルゴーニュ公国は、どちらの陣営にも与せず巧みな外交で生き残り、やがて「フランク王国」の後継者たる「ロタリンギア」を復興させる夢を持つ。フランドル布地・金羊毛騎士団・ディジョンの宮廷という三本柱で内政を固め、英仏間の立ち回りで外交的優位を確立し、フランシュ＝コンテ・ロレーヌ・ネーデルラントを統合して「ロタリンギア王国」を再建せよ。"
 bur_crown_of_lothair_mission_pack_CRITERIA_DESCRIPTION:0 "ブルゴーニュとして、百年戦争を立ち回り、内政を固め、ロタリンギアを再建せよ。"
 bur_crown_of_lothair_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成して「ロタリンギアの王冠」を手にせよ。"
 bur_crown_of_lothair_mission_pack_BUTTON_DETAILS:0 "英仏の間で生き残り、ロタリンギアを復興せよ！"

 bur_duchy_of_burgundy: "ブルゴーニュ公国の野望"
 bur_duchy_of_burgundy_desc: "1337年、ブルゴーニュ公爵家はフランス王家ヴァロワ朝の分家として台頭した。オトン4世（ゲームでは「善良公フィリップ」の先代）の時代から、ブルゴーニュは英仏の対立を利用してフランドル・フランシュ＝コンテ・ロレーヌへの拡張を企てる。百年戦争はこの小王国を歴史の主役にする千載一遇の機会だ。"

 bur_court_of_dijon: "ディジョンの宮廷"
 bur_court_of_dijon_desc: "ブルゴーニュ公国の首都ディジョンは、15世紀のヨーロッパで最も華やかな宮廷の一つとして知られた。芸術家・音楽家・学者を招き寄せたブルゴーニュ宮廷は、「北方ルネサンス」の先駆けともいえる文化的輝きを放った。ヤン・ファン・エイクら偉大な芸術家たちがこの宮廷の庇護を受けた。"

 bur_flemish_cloth: "フランドルの布地産業"
 bur_flemish_cloth_desc: "ブリュージュ・ヘント・イープルを中心とするフランドルの布地産業は中世ヨーロッパ最大の工業地帯だった。イングランドから輸入した原毛を精巧な技術で加工するフランドルの布地（ドラップ）はヨーロッパ全土の市場で高い評価を受け、ブルゴーニュの財政的基盤となった。"

 bur_golden_fleece: "金羊毛騎士団"
 bur_golden_fleece_desc: "1430年にフィリップ善良公がブリュージュで創設した「金羊毛騎士団（オルドル・ドゥ・ラ・トワゾン・ドール）」は、中世最高の騎士団の一つだ。アルゴナウタイ（黄金の羊毛を求めた英雄たち）の伝説に基づくこの騎士団の章（金羊の毛皮のペンダント）はカトリック君主への最高の栄誉章として19世紀まで使われ続けた。"

 bur_estates_general: "三部会の整備"
 bur_estates_general_desc: "ブルゴーニュ公爵家は貴族・聖職者・市民という三身分を代表する「三部会（エタ・ジェネロー）」を整備した。複合国家として多様な地域を統治するブルゴーニュには、合議制による統治が不可欠だった。フランドル・ブラバント・フランシュ＝コンテといった多様な「ネイション」を一つの旗の下にまとめる制度的基盤だ。"

 bur_feast_of_pheasants: "雉の饗宴"
 bur_feast_of_pheasants_desc: "1454年の「雉の饗宴（ル・バンケ・ドゥ・フェザン）」はブルゴーニュ宮廷史上最大の催し物だ。フィリップ善良公はコンスタンティノープル陥落に衝撃を受け、この豪奢な晩餐会で十字軍への参加を誓約した。騎士たちは生きた雉の上で聖なる誓いを立てた——実現しなかったが、この誓いはブルゴーニュの威信を頂点に押し上げた。"

 bur_balance_of_power: "英仏の間で"
 bur_balance_of_power_desc: "ブルゴーニュ外交の真髄は「バランサー」としての役割だ。フランス王の封臣でありながら神聖ローマ帝国にも連なり、イングランドとも同盟できるブルゴーニュは、どちらの陣営にも与せず両国から最大の利益を引き出す独特の立場にある。この二つの大国の対立こそブルゴーニュが台頭するための最大の機会だ。"

 bur_ally_england: "イングランドとの同盟"
 bur_ally_england_desc: "1419年のモントロー橋の事件でジャン無畏公がフランスのドーファン（後のシャルル7世）に暗殺されたことで、ブルゴーニュはイングランドと同盟しフランスに宣戦した。1420年のトロワ条約でイングランド王ヘンリー5世がフランス王位を継承することが決まり、ブルゴーニュはその主要な支持者となった。"

 bur_treaty_of_troyes: "トロワ条約の実現"
 bur_treaty_of_troyes_desc: "1420年のトロワ条約はフランス王シャルル6世がイングランド王ヘンリー5世をフランスの摂政・後継者と認めたものだ。ブルゴーニュの支持なしにこの条約は成立しなかった。パリとランスを掌握することでフランス王国の実質的支配者となる道が開ける。"

 bur_ally_france: "フランスとの和解"
 bur_ally_france_desc: "1435年のアラス条約でブルゴーニュはイングランドから離れ、シャルル7世のフランスと和解した。フィリップ善良公はフランス王への形式的な臣従を免除され、マコン・オーセルなどの戦略的都市を得た。この外交的転換はブルゴーニュを最終的な勝者とし、百年戦争でのフランス側の最終勝利を可能にした。"

 bur_treaty_of_arras: "アラス条約の精神"
 bur_treaty_of_arras_desc: "1435年のアラス条約はブルゴーニュ外交の最大の勝利だった。イングランドを見捨てフランスと和解することで、ブルゴーニュはロレーヌへの影響力拡大と引き換えに形式的臣従を免除された。この「フランスなき勝利」で得た利益を活かし、さらなる拡張へと進む。"

 bur_flanders_in_the_war: "百年戦争のフランドル"
 bur_flanders_in_the_war_desc: "フランドル伯国は英仏百年戦争における最重要の係争地の一つだった。イングランドはフランドルの布地産業に羊毛を供給することで経済的影響力を持ち、フランドルの都市はイングランド側と協力することも多かった。一方でフランス王はフランドル伯を封臣として主張し続けた。ブルゴーニュはフランドルの布地産業の恩恵を受ける立場として、この地方を自陣営に引き込む必要がある。"

 bur_integrate_brabant: "ブリュッセルへの道"
 bur_integrate_brabant_desc: "アントウェルペンを中心とするブラバント公国は、フランドルと並ぶネーデルラント最大の経済拠点だった。「黄金の拍車の戦い」（1302年）でフランス軍を破った誇り高いブラバント人を統合することで、ブルゴーニュはネーデルラント全体の覇者となる。後のハプスブルク帝国の核心部をここに確立する。"

 bur_integrate_franche_comte: "ドールを掌握する"
 bur_integrate_franche_comte_desc: "ドールはフランシュ＝コンテの首都であり、ドール大学（1422年設立）はブルゴーニュ公爵家の支援を受けた知的拠点だ。この都市を掌握することはフランシュ＝コンテ全体の実効支配を意味し、ロレーヌ方面への拡張路を開く。"

 bur_expand_into_lorraine: "ロレーヌへの進出"
 bur_expand_into_lorraine_desc: "ナンシーはロレーヌ公国の首都だ。シャルル突進公は1477年のナンシーの戦いでこの地に執着したが命を落とした——歴史をここで変えよ。ナンシーを掌握することでロレーヌ全土が手に届き、ルクセンブルクへの道が開ける。"


 bur_crown_of_lothair: "ロタリンギアの王冠"
 bur_crown_of_lothair_desc: "843年のヴェルダン条約で中フランク（ロタリンギア）を相続したロタール1世の王国は、ライン川沿いのフランドルからイタリアまで縦断する「中間王国」だった。870年のメルセン条約でフランスとドイツに分割されたこの王国を1000年ぶりに復興させる——ブルゴーニュはロタリンギアの真の後継者として、フランス・ドイツの両大国を超える存在となる。"
 STATIC_MODIFIER_NAME_bur_court_of_dijon_mod: "ディジョンの宮廷"
 STATIC_MODIFIER_DESC_bur_court_of_dijon_mod: "ヨーロッパ最高の文化的宮廷の一つとして知られたディジョン宮廷は、北方ルネサンスを牽引した芸術家・学者の集積地だった。ヤン・ファン・エイクやロヒール・ファン・デル・ウェイデンらの巨匠がここで活動し、ブルゴーニュ公爵家の文化的威信を高めた。"

 STATIC_MODIFIER_NAME_bur_flemish_cloth_mod: "フランドル布地産業"
 STATIC_MODIFIER_DESC_bur_flemish_cloth_mod: "ブリュージュ・ヘント・イープルを結ぶフランドル布地産業の三角地帯は中世最大の工業地帯だった。イングランドの羊毛をフランドルの職人が加工し、シャンパーニュの大市を通じてヨーロッパ全土に販売されるこのサプライチェーンがブルゴーニュの富の源泉だ。"
 STATIC_MODIFIER_NAME_bur_golden_fleece_mod: "金羊毛騎士団"
 STATIC_MODIFIER_DESC_bur_golden_fleece_mod: "フィリップ善良公が1430年に創設した金羊毛騎士団は、カトリック世界最高の騎士団として君主・大公・皇帝のみが会員となれる排他的な名誉の場だった。この騎士団の紋章を与えることはブルゴーニュが外交的に君主と対等であることを示す。"
 STATIC_MODIFIER_NAME_bur_estates_general_mod: "三部会"
 STATIC_MODIFIER_DESC_bur_estates_general_mod: "貴族・聖職者・市民の三身分から成るブルゴーニュ三部会は、複合国家の多様な地域を代表する合議機関だ。フランドル・ブラバント・フランシュ＝コンテといった異なる法的伝統を持つ地域を一つの統治体制のもとに統合するための制度的柱となった。"
 STATIC_MODIFIER_NAME_bur_feast_of_pheasants_mod: "雉の饗宴の誓い"
 STATIC_MODIFIER_DESC_bur_feast_of_pheasants_mod: "1454年、コンスタンティノープル陥落に触発されたフィリップ善良公が開いた「雉の饗宴」でブルゴーニュ宮廷の騎士たちは十字軍への参加を誓った。この壮麗な催しはキリスト教世界の守護者としてのブルゴーニュの宗教的権威を象徴し、教皇との関係を強化した。"
 STATIC_MODIFIER_NAME_bur_balance_of_power_mod: "英仏の間で"
 STATIC_MODIFIER_DESC_bur_balance_of_power_mod: "英仏の狭間でバランサーとして振る舞うブルゴーニュは、どちらの側の宗主国にも完全には服従せず、その曖昧な立場を最大限に活用する。百年戦争の混乱の中で封臣義務から距離を置き、独自の召集軍を増強する好機だ。"
 STATIC_MODIFIER_NAME_bur_ally_england_mod: "イングランドとの同盟"
 STATIC_MODIFIER_DESC_bur_ally_england_mod: "モントロー橋の暗殺事件（1419年）以降、ブルゴーニュとイングランドは対フランス同盟を結んだ。この同盟の軍事的相乗効果が1420年のトロワ条約を可能にし、ヘンリー5世のフランス王位継承という前例のない結果をもたらした。"
 STATIC_MODIFIER_NAME_bur_treaty_of_troyes_mod: "トロワ条約の成果"
 STATIC_MODIFIER_DESC_bur_treaty_of_troyes_mod: "ブルゴーニュの支持を得てイングランドがフランス王位を主張したトロワ条約は、百年戦争の最大の転換点だった。この成果を足がかりに、ブルゴーニュはフランス王国の実質的支配者として名実ともに権力の頂点に立つ。"
 STATIC_MODIFIER_NAME_bur_ally_france_mod: "フランスとの和解"
 STATIC_MODIFIER_DESC_bur_ally_france_mod: "1435年のアラス条約でフランスに鞍替えしたブルゴーニュは、戦略的に最も有利な立場を確保した。イングランドを孤立させフランスの勝利を後押しすることで、ブルゴーニュは勝者側の最大の受益者となった。"
 STATIC_MODIFIER_NAME_bur_treaty_of_arras_mod: "アラス条約の成果"
 STATIC_MODIFIER_DESC_bur_treaty_of_arras_mod: "アラス条約でシャルル7世に形式的な謝罪を迫りながら、実質的な臣従義務を免れたフィリップ善良公は、この条約を「ブルゴーニュ独立の礎」とした。フランスの再統一を助けながらも独自の王国建設への道を歩み続けた。"
 STATIC_MODIFIER_NAME_bur_crown_of_lothair_mod: "ロタリンギアの王冠"
 STATIC_MODIFIER_DESC_bur_crown_of_lothair_mod: "870年のメルセン条約で消滅したロタリンギア王国が1000年ぶりに復活した。フランドルからフランシュ＝コンテ、ロレーヌからブルゴーニュ本土まで、カール大帝の中フランク王国の後継者として、ブルゴーニュはヨーロッパ中央部の主宰者となった。"

 bur_events.1.t: "ブルゴーニュ公国の野望"
 bur_events.1.d: "1337年、英仏百年戦争の火蓋が切られようとしている。エドワード3世はフランス王位を主張してフランスに宣戦した——しかしブルゴーニュ公国は今、その渦中で独自の未来を描いている。フランス王家ヴァロワ朝の分家でありながら、強大なフランドル布地産業と精鋭の騎士団を持つブルゴーニュは、英仏どちらにも服さない「第三の道」を歩む力を持つ。ディジョンの豪奢な宮廷から、フランドルの繁栄する商業都市まで、ブルゴーニュ公国はヨーロッパ最大の野心を秘めた小国だ。"
 bur_events.1.a: "ブルゴーニュよ、英仏の間で己の道を切り開け！"

 bur_events.2.t: "雉の饗宴"
 bur_events.2.d: "1454年（史実）、フィリップ善良公はリールの城で空前絶後の宴を催した。生きた雉が宴席に運ばれ、参加者たちは「神・聖母マリア・雉」に賭けて十字軍への参加を誓った。フィリップ自身も「もし自らの君主（フランス王）が聖地遠征に赴くなら、我も従う」と誓約した。この誓いは実現しなかったが、コンスタンティノープル陥落の衝撃を受けたヨーロッパに、ブルゴーニュが騎士道精神の守護者であることを示した。宴の規模は凄まじく、テーブルの上には大型船の模型・修道院の建物・風車・城が置かれ、会場では奇術師・詩人・演奏家が競演した。"
 bur_events.2.a: "神の栄光のために、十字軍への参加を誓う！"

 bur_events.3.t: "ロタリンギア王国の復活"
 bur_events.3.d: "843年のヴェルダン条約でカール大帝の帝国が三分割された時、「ロタリンギア」はライン川沿いにフランドルからイタリアまで縦断する中間王国として生まれた。しかし870年のメルセン条約でこの王国はフランス・ドイツに飲み込まれ、1000年の歴史から消えた。今、ブルゴーニュ公爵家の手によって、フランス王もドイツ皇帝も認めなかった「中間王国」が歴史の舞台に蘇る。英仏百年戦争を巧みに立ち回り、フランドル・フランシュ＝コンテ・ロレーヌを統合したブルゴーニュは、ここにロタリンギアの王冠を戴く。"


 bur_council_of_mechelen: "メヘレン大評議会"
 bur_council_of_mechelen_desc: "マリア・ド・ブルゴーニュの摂政マクシミリアン1世が1473年に設置しようとした「メヘレン大評議会（グラン・コンセイユ）」は、ブルゴーニュ複合国家全体を管轄する中央裁判所として機能した。ブラバント・フランドル・フランシュ＝コンテのそれぞれの法的伝統を上回る「帝国的司法」の創設は、真の中央集権国家への第一歩だ。"
 bur_siege_of_calais: "カレーの占領"
 bur_siege_of_calais_desc: "カレーはイングランドがフランス北岸に保持した最後の拠点（1347〜1558年）だった。「カレーの市民」（ロダンの彫刻で有名）の物語は英仏百年戦争の悲劇を象徴する。この戦略的港湾を掌握することで、ブルゴーニュは北海交易の要衝を手中に収め、イングランドとの同盟の実利を最大化する。"
 bur_hainaut_namur: "エノーとナミュールを相続する"
 bur_hainaut_namur_desc: "エノー伯国とナミュール伯国はブルゴーニュとブラバントの間に位置する豊かな地方だ。フィリップ善良公は1421年にナミュールを買収し、1433年にエノーを相続することでネーデルラントを南北に繋ぐ回廊を確保した。この統合はブルゴーニュの「ネーデルラント複合国家」の核心を成す。"
 bur_holland_zeeland: "ホラントとゼーラントの掌握"
 bur_holland_zeeland_desc: "ホラント伯国とゼーラント伯国はアムステルダム・ライデン・ドルトレヒトなどの商業都市を擁する北海沿岸の豊かな地方だ。1428年にフィリップ善良公が征服したこれらの地は後のオランダの中核となる。ニシン漁業と海上交易で栄えるこの地方をネーデルラント帝国の一部として確保する。"
 bur_luxemburg: "ルクセンブルクの掌握"
 bur_luxemburg_desc: "ルクセンブルク公国は神聖ローマ帝国最大の公国の一つで、ハプスブルク家との係争の的だった。フィリップ善良公は1443年にルクセンブルクを征服してブルゴーニュの版図に加えた。この山岳要塞の地はロレーヌとアルザスへの拡張の足がかりとなる。"
 bur_dominate_rhine: "ライン河の支配"
 bur_dominate_rhine_desc: "ライン川はローマ時代から「文明とバルバリアの境界」とされてきた大河だ。ネーデルラントからアルザスまでライン川流域を掌握することで、ブルゴーニュは中西欧を貫く大交易路を完全にコントロールする立場に立つ。カール大帝がフランク王国の心臓部と定めたこのライン回廊こそロタリンギアの本質だ。"

 STATIC_MODIFIER_NAME_bur_council_of_mechelen_mod: "メヘレン大評議会"
 STATIC_MODIFIER_DESC_bur_council_of_mechelen_mod: "メヘレンに設置された大評議会は、ブルゴーニュの複合国家を一元的に統治する中央裁判所だった。フランドル・ブラバント・フランシュ＝コンテのバラバラな法体系を統合するこの機関は、ネーデルラント共和国の先駆的統治機構となった。"
 STATIC_MODIFIER_NAME_bur_calais_port_mod: "カレーの自由港"
 STATIC_MODIFIER_DESC_bur_calais_port_mod: "英仏海峡最狭の地カレーは中世から北海・バルト海・地中海を結ぶ交易の要衝だった。イングランドが長年ここを保持したのも、この商業的価値があったからだ。ブルゴーニュはカレーを欧州最大の毛織物交易拠点として発展させる。"
 STATIC_MODIFIER_NAME_bur_luxemburg_mod: "ルクセンブルク掌握"
 STATIC_MODIFIER_DESC_bur_luxemburg_mod: "神聖ローマ帝国最強の要塞の一つルクセンブルクを支配することで、ブルゴーニュは東方（帝国）との境界を堅固に固める。"
 STATIC_MODIFIER_NAME_bur_dominate_rhine_mod: "ライン河支配"
 STATIC_MODIFIER_DESC_bur_dominate_rhine_mod: "ネーデルラントからアルザスまでライン川流域を掌握したブルゴーニュは、中西欧最大の内陸水路を完全にコントロールする。これぞカール大帝が夢見たフランク王国の心臓部だ。"

 bur_join_hre: "神聖ローマ帝国への加盟"
 bur_join_hre_desc: "ブルゴーニュ公国は神聖ローマ帝国の諸侯として正式に認められる機会を持つ。フランス王の封臣でありながら帝国にも属するという二重の地位は、ブルゴーニュに独特の外交的強さを与える。1473年、シャルル突進公はトリーア会談でフリードリヒ3世と「王国」昇格を交渉したが失敗した——今こそ帝国との関係を確立する時だ。"
 bur_franchecomte_fiefdom: "フランシュ＝コンテとの婚姻"
 bur_franchecomte_fiefdom_desc: "13世紀、ブルゴーニュ公爵家はフランシュ＝コンテ伯家との婚姻政策によってこの豊かな「自由伯爵領」と結びついた。1295年のフィリップ4世（美男王）による合併以前、フランシュ＝コンテはブルゴーニュ公の勢力圏にあった。ジュラ山脈の塩鉱・鉄鉱石・ドール大学を擁するこの地との婚姻による結合は、ブルゴーニュの東方拡張の礎だ。"
 bur_events.4.t: "神聖ローマ帝国への加盟"
 bur_events.4.d: "ブルゴーニュは「フランス王の封臣であり神聖ローマ帝国の諸侯でもある」という二重の地位を持つことができる。HRE皇帝との関係が十分に良好になった今、帝国への正式加盟を申請する機会が到来した。神聖ローマ帝国の加盟は帝国防衛義務を生じさせるが、同時に帝国の諸侯として大きな外交的地位を得ることができる。1473年のトリーア会談でシャルル突進公は「ブルゴーニュ王国」として帝国内で承認されることをフリードリヒ3世に求めたが、最後の瞬間に皇帝は合意を反故にした。今こそ、その夢を実現する時だ。"
 bur_events.4.a: "帝国に加盟し、諸侯として認められる"
 bur_events.4.b: "今は独立を保つ"
 bur_events.5.t: "フランシュ＝コンテとの婚姻"
 bur_events.5.d: "13世紀のブルゴーニュ公爵家はフランシュ＝コンテ伯家との婚姻によってこの地と深く結びついた。ブルゴーニュ公オットー4世はフランシュ＝コンテ女伯マオーとの婚姻によりこの地を公爵家の勢力圏に取り込んだ。ジュラ山脈を越えてスイスとロレーヌに向かう交易路を支配するこの「自由伯爵領」は、ブルゴーニュが東方に伸びるための鍵だ。婚姻の絆を活かし、フランシュ＝コンテを封土として迎え入れよ。"
 bur_events.5.a: "婚姻の絆を活かし、フランシュ＝コンテを封土として迎え入れる"
 bur_events.5.b: "婚姻関係のみを維持し、独立を尊重する"

 bur_events.6.t: "百年戦争のフランドル"
 bur_events.6.d: "フランドル伯国は英仏百年戦争において特別な立場にあった。フランドルの布地産業はイングランドの羊毛なしには成立せず、ブリュージュ・ヘント・イープルの豊かな都市市民はイングランドとの交易関係を重視していた。フランス王はフランドル伯を封臣と主張するが、フランドルの都市民はフランス支配を嫌ってイングランド寄りの立場を取ることが多かった。ブルゴーニュ公がフランドルを自陣営に引き込むことで、この布地産業と商業都市の富を活用できる。フランドルを封土として迎え入れるか、独立を尊重しながら関係を深めるかの選択が迫られる。"
 bur_events.6.a: "フランドルをブルゴーニュの封土として迎え入れる"
 bur_events.6.b: "独立を尊重しつつ、同盟関係を深める"

 bur_nevers_union: "ヌヴェールとの結合"
 bur_nevers_union_desc: "ヌヴェール伯国はフランドルの南方に位置し、ブルゴーニュ公爵家と歴史的なつながりを持つ。フランドルを確実に掌握した上で、ヌヴェール伯国への請求権を確立することはブルゴーニュの勢力圏を南方に広げる第一歩となる。フランドルとヌヴェールの間の地方は将来のフランス進出への回廊となる。"
 STATIC_MODIFIER_NAME_bur_low_countries_mod: "低地諸国の統合"
 STATIC_MODIFIER_DESC_bur_low_countries_mod: "ホラント・ゼーラント・ブラバント・フランドルを繋ぐネーデルラントの交易網が統合された。アントウェルペンとアムステルダムを核とするこの低地諸国の商業力は後のオランダ黄金時代の礎だ。"

 bur_events.3.a: "ロタリンギア王国として復活する"
 bur_events.3.b: "ブルゴーニュとして帝国化する（現状維持）"
 STATIC_MODIFIER_NAME_bur_lotharingia_reborn_mod: "ロタリンギアの復活"
 STATIC_MODIFIER_DESC_bur_lotharingia_reborn_mod: "中フランク王国の後継国家ロタリンギアが869年の滅亡から600年を経て復活した。シャルルマーニュの帝国を継承するこの王国は、神聖ローマ帝国とフランス王国の間に立つ第三の帝国として認識される。"
