 nap_new_capital_of_sicily_desc: "シチリアを失った我らは、パレルモに代わる新たな首都としてナポリの地を選んだ。この地を王国に相応しき都として整備しなくてはならない。"

 nap_apulian_granary_desc: "プーリアは肥沃な平原が広がり、古来より穀物の産地として有名であった。ここの穀物は民の胃袋を満たすと共に、王国の輸出品でもある。また、プーリアはオトラント海峡を挟んでギリシャと向かい合う地でもあり、前進拠点として重要である。"

 nap_control_of_transumanza_desc: "アブルッツォやモリーゼで行われる伝統的な家畜の移牧、トランスマンツァはこれらの地域の経済の主軸である。国がトラットゥーロの管理に力を入れ、牧民を保護すれば、羊毛やチーズといった様々な物品がより盛んに生産されるだろう。"

 nap_patronage_of_diverse_arts_desc: "シチリアの地はギリシャ人、カルタゴ人、ローマ人、ゲルマン人、アラブ人、ノルマン人、フランス人が行き交った歴史を持ち、それらの文化が融合している。異なる文化にルーツを持つ多様な芸術こそ、シチリアの芸術である。"

 nap_dynastic_stability_desc: "シチリアの地には、安定した王朝は誕生せず、それが、外国勢力による侵略を幾度も招いてきた。王朝を安定させることこそ、シチリアの安定につながるだろう。"

 nap_southern_renaissance_desc: "安定した、威厳ある宮廷に招かれた各地の芸術家・学者たちが、ナポリにもルネサンスをもたらした。北イタリアとは違う、宮廷主導の文化がこの地に花開くのである。"

 # === 補正 ===
 STATIC_MODIFIER_NAME_nap_new_capital_mod: "新たな首都"
 STATIC_MODIFIER_DESC_nap_new_capital_mod: "ナポリは古代ギリシャ人（ネアポリス＝新しい市）が建設した港湾都市で、ローマ時代から中世を通じて地中海最大の都市の一つだった。カルロス1世・ダンジュー以来の歴代君主が宮殿・大学・修道院を建設し、ルネサンス期にはフィレンツェに次ぐ文化の都として栄えた。"

 STATIC_MODIFIER_NAME_nap_apulian_granary_mod: "プーリアの穀倉"
 STATIC_MODIFIER_DESC_nap_apulian_granary_mod: "アドリア海に面したプーリア（カカポ）の平野は古代から「イタリアの穀倉」と呼ばれた。小麦・大麦・オリーブ・ブドウが豊かに実るこの地の農業生産はナポリ王国の経済的基盤であり、地中海各地に輸出された。"

 STATIC_MODIFIER_NAME_nap_control_of_transumanza_mod: "トランスマンツァの管理"
 STATIC_MODIFIER_DESC_nap_control_of_transumanza_mod: "トランスマンツァとはアペニン山脈の高原と沿岸平野を往復する季節的牧畜移動のことだ。ナポリ王国の特産品である羊毛と羊肉はこの移牧システムに依存しており、14世紀に整備された幅広の移牧街道（トラットゥーロ）は王国財政の重要な収入源となった。"

 STATIC_MODIFIER_NAME_nap_patronage_of_diverse_arts_mod: "多様な芸術の保護"
 STATIC_MODIFIER_DESC_nap_patronage_of_diverse_arts_mod: "ナポリはノルマン人・ビザンツ人・アラブ人・フランス人・スペイン人の文化が交差する多文化都市だった。シチリア詩派（イタリア語文学の発祥）、アルフォンソ5世の宮廷に集ったルネサンスの人文主義者たち——この多様性がナポリの独特の文化的豊かさを生み出した。"

 STATIC_MODIFIER_NAME_nap_dynastic_stability_mod: "王朝の安定"
 STATIC_MODIFIER_DESC_nap_dynastic_stability_mod: "ナポリ王国は1266年のカルロ・ダンジュー即位以来、アンジュー家・アラゴン家・ヴァロワ家など複数の王朝が交代した波乱の歴史を持つ。王朝の安定こそがこの王国が長年の内紛から脱出するために最も必要なものだった。"

 STATIC_MODIFIER_NAME_nap_southern_renaissance_mod: "南のルネサンス"
 STATIC_MODIFIER_DESC_nap_southern_renaissance_mod: "アルフォンソ5世の宮廷にはロレンツォ・ヴァッラ（ラテン語文献批判の創始者）、ジョヴァンニ・ポンターノ（詩人・歴史家）、バルトロメオ・ファツィオ（歴史家）ら人文主義者が集った。ナポリのルネサンスはフィレンツェとは異なる南イタリアの独自の輝きを放った。"

 nap_divided_kingdom_desc: "1282年、シチリア島の民は我らアンジュー家の支配に対し蜂起し、アラゴン王家を新たな王として迎え入れた。以来、シチリア王国は二つに分かれている。我らはナポリを中心とする半島部を治めるが、シチリア島の奪還こそ、王家に課せられた歴史的使命である。"

 nap_papal_blessing_desc: "カルロ1世が教皇の招請のもとシチリア王国を征服して以来、我が王家と教皇庁は深い結びつきを持つ。教皇からの信任を維持することは、王国の正統性を保つ上で欠かせない。"

 nap_army_buildup_desc: "シチリア奪還の戦いに備え、王国の常備軍を増強せよ。北イタリアへの介入や、本土での反乱鎮圧にも、強力な陸軍は欠かせない。"

 nap_match_aragon_navy_desc: "シチリア海峡の制海権を握るアラゴンの艦隊に対抗するには、我が王国もまた強力な海軍を持たねばならない。海を制する者が、いずれシチリアを制するのだ。"

 nap_sword_of_the_guelphs_desc: "ゲルフ(教皇党)とギベリン(皇帝党)の争いは北イタリア全域を揺るがしている。教皇の盟友たる我が王国も、ゲルフの剣としてこの争いに加わり、影響力を北方へ伸ばす好機を得るだろう。"

 nap_sicilian_reunification_war_desc: "ついにシチリア島へ軍を送る時が来た。アラゴンの守備隊を打ち破り、パレルモを我が手に収めることができれば、二つに裂かれた王国を再び一つにする道が開かれる。"

 nap_invest_in_provence_desc: "アンジュー家の発祥の地であるプロヴァンス伯領は、今なお我が王家と深い縁を持つ。この地への投資は、西方への足掛かりを築くとともに、王家の故郷との結びつきを強めることになる。"

 # === 補正 ===

 STATIC_MODIFIER_NAME_nap_papal_blessing_mod: "教皇庁の支持"
 STATIC_MODIFIER_DESC_nap_papal_blessing_mod: "ナポリ王国は中世において教皇の封土として「教皇の王国」と呼ばれた。カルロ・ダンジューはクレメンス4世の後援でナポリを征服し、アラゴン家もまた教皇庁との複雑な外交関係の中で王位の正統性を確保し続けた。"

 STATIC_MODIFIER_NAME_nap_army_buildup_mod: "整備された王国軍"
 STATIC_MODIFIER_DESC_nap_army_buildup_mod: "ナポリ王国は傭兵（コンドッティエーレ）に依存した軍事文化を持っていたが、アルフォンソ5世以降はカタルーニャ兵とイタリア兵を組み合わせた常備軍の整備を進めた。南イタリアの山岳民族（サンニウム人の末裔）は古代から優秀な兵士として知られた。"

 STATIC_MODIFIER_NAME_nap_match_aragon_navy_mod: "対アラゴン艦隊"
 STATIC_MODIFIER_DESC_nap_match_aragon_navy_mod: "南イタリアとシチリアを舞台にしたナポリとアラゴンの抗争は常に海上の覇権と結びついていた。アドリア海・ティレニア海・シチリア海峡の制海権がシチリア島の帰趨を決めた。ナポリ艦隊を整備してアラゴンの海軍力に対抗することは王国存続の基本条件だ。"

 STATIC_MODIFIER_NAME_nap_sword_of_the_guelphs_mod: "ゲルフの剣"
 STATIC_MODIFIER_DESC_nap_sword_of_the_guelphs_mod: "カルロ・ダンジューは「教皇の剣」として神聖ローマ皇帝に対抗するグエルフ（教皇派）の盟主として行動した。フィレンツェ・ボローニャなどのグエルフ都市への支援と介入は北イタリア政治においてナポリ王国が大きな影響力を持つことを可能にした。"

 STATIC_MODIFIER_NAME_nap_sicilian_reunification_war_mod: "シチリア再統一戦争"
 STATIC_MODIFIER_DESC_nap_sicilian_reunification_war_mod: "1282年の「シチリアの晩鐘」でフランス支配者を追放したシチリア人がアラゴンを呼び込んで以来、ナポリとシチリアの再統一はアンジュー家・ナポリ王家の最大の悲願となった。両シチリア王国を再統合することは100年以上の屈辱に終止符を打つ歴史的事業だ。"

 STATIC_MODIFIER_NAME_nap_invest_in_provence_mod: "プロヴァンスへの投資"
 STATIC_MODIFIER_DESC_nap_invest_in_provence_mod: "アンジュー家にとってプロヴァンスは「故郷」だった。ルネ王はナポリを失った後にプロヴァンスで余生を送り、エクス＝アン＝プロヴァンスを文化の中心として育てた。ナポリとプロヴァンスの絆はアンジュー家の血と歴史で結ばれた深いものだ。"

 nap_events.1.t: "二つに分かたれた王国"
 nap_events.1.d: "1282年、シチリア島の民は「シチリアの晩鐘」と呼ばれる蜂起を起こし、アンジュー家の支配を打ち倒した。彼らはアラゴン王ペドロ3世を新たな王として迎え入れ、シチリア王国はここに二つに分かたれることとなった。我ら、ナポリを首都とする本土側こそが正統なシチリア王であり続けるが、海を挟んだシチリア島には、アラゴン家の傍流が「シチリア王」として割拠している。両国の対立は、今なお続いている。"
 nap_events.1.a: "理解した"

 nap_cross_the_strait_of_otranto_desc: "オトラント海峡は、わずか70キロほどでイタリア半島とバルカン半島を隔てる海の関門である。この海峡を越えてアルバニアの地に橋頭堡を築くことができれば、我が国の艦隊と商船は東方へさらに進出する道を得るだろう。"

 nap_influence_over_the_papacy_desc: "教皇庁との結びつきをさらに深め、国内の安定を保つことができれば、我が王家は教皇庁に対しても無視できぬ影響力を持つようになるだろう。"

 nap_the_bells_fall_silent_desc: "シチリア島を再び我が手に収め、二つに裂かれた王国は今、一つに戻った。かつて王国を引き裂いた「晩鐘」が再び鳴ることのないよう、慎重に統治を固めなければならない。"

 nap_defeat_of_aragon_desc: "シチリアを奪われたアラゴン王家は、もはや我が王国の脅威ではない。アラゴンそのものを打ち倒すか、あるいはその王座を我が宗主権の下に置くことができれば、地中海における対立に終止符を打つことができるだろう。"

 nap_expand_influence_in_southern_france_desc: "プロヴァンスを足掛かりに、我が国の影響力はローヌ河を遡り、リヨンの地にまで及び始めている。南仏一帯における我が国の存在感は、ますます高まりつつある。"

 nap_western_mediterranean_hegemony_desc: "サルデーニャとバレアレス諸島、西地中海の二つの要衝を手中に収めることができれば、我が艦隊はジェノヴァからイベリアまでの海域を支配し、地中海西部の覇者として並ぶ者なき存在となるだろう。"

 # === 補正 ===
 STATIC_MODIFIER_NAME_nap_cross_the_strait_of_otranto_mod: "オトラント海峡の橋頭堡"
 STATIC_MODIFIER_DESC_nap_cross_the_strait_of_otranto_mod: "オトラント海峡（イタリアとアルバニアの間の75km）はアドリア海とイオニア海を繋ぐ戦略的水路だ。1480年にオスマン帝国がオトラントを攻略した際は南イタリア全体に衝撃が走った。対岸のアルバニアに橋頭堡を確保することはこの海峡の制海権を手中に収めることを意味する。"

 STATIC_MODIFIER_NAME_nap_influence_over_the_papacy_mod: "教皇庁への影響力"
 STATIC_MODIFIER_DESC_nap_influence_over_the_papacy_mod: "ナポリ王と教皇の関係は中世を通じて微妙なバランスを保ち続けた。「教皇の封臣」として教皇に従属しながらも、その軍事力と財力で教皇庁に大きな影響力を行使した。アラゴン・ナポリのアルフォンソ5世はカラブリアを担保にニコラウス5世を支援するなど実利的な外交を展開した。"

 STATIC_MODIFIER_NAME_nap_the_bells_fall_silent_mod: "晩鐘の沈黙"
 STATIC_MODIFIER_DESC_nap_the_bells_fall_silent_mod: "1282年のシチリアの晩鐘（復活祭の夜に鐘の音とともに始まったフランス支配者への反乱）は南イタリア史上最も劇的な民衆蜂起だった。その鐘が再び鳴り止む時——すなわちシチリアとナポリが再統一され平和が戻る時——アンジュー家の悲願がついに成就する。"

 STATIC_MODIFIER_NAME_nap_defeat_of_aragon_mod: "アラゴンの打倒"
 STATIC_MODIFIER_DESC_nap_defeat_of_aragon_mod: "アラゴンとアンジュー家の対立は1282年のシチリアの晩鐘から始まり、1442年のアルフォンソ5世のナポリ征服まで160年以上続いた。この宿敵を最終的に打ち破ることはナポリ王国史上最大の復讐の完成を意味する。"

 STATIC_MODIFIER_NAME_nap_expand_influence_in_southern_france_mod: "南仏への影響拡大"
 STATIC_MODIFIER_DESC_nap_expand_influence_in_southern_france_mod: "アンジュー家はナポリとプロヴァンスを同時に支配した時代、南フランスからイタリア南部まで連続した領域を持つ地中海大国だった。この伝統的な影響圏を取り戻すことはナポリ王国の外交的地平を大きく広げる。"

 STATIC_MODIFIER_NAME_nap_western_mediterranean_hegemony_mod: "西地中海の海上覇権"
 STATIC_MODIFIER_DESC_nap_western_mediterranean_hegemony_mod: "西地中海はアラゴン・ジェノヴァ・ナポリが覇権を争う舞台だった。サルデーニャ島とバレアレス諸島（マジョルカ・イビサなど）はこの海域を制する戦略的要衝であり、これらを掌握することで地中海の海路を支配する力を得る。"

 nap_anjou_hungary_desc: "我が王家アンジュー家は、ナポリのみならずハンガリーにもその分家を持つ。同じ血を引く両国の関係が深まれば、ハンガリー王位継承権を主張する大義をも得られるだろう。"

 nap_foothold_in_northern_italy_desc: "トスカーナの地に足掛かりを得ることができれば、フィレンツェやピサといった北イタリアの富裕な都市国家との結びつきを深め、半島での軍事行動においても優位に立てるだろう。"

 nap_crossroads_of_civilizations_desc: "シチリア王国は古来、ギリシャ・ローマ・アラブ・ノルマンといった様々な文明が交差する地であった。宮廷に集められた数多の芸術品は、王国がまさに文明の十字路であることを示す証である。"

 nap_anjou_homeland_desc: "アンジェの地を手中に収めたことで、我が王家の祖先たるアンジュー家の故地へと、その影響力が及ぶようになった。祖先の地との結びつきは、フランス王位への請求権をも我が手にもたらすだろう。"

 nap_french_throne_claim_desc: "アンジュー家は、かつてフランス王家の傍流として産まれた家系である。パリを手中に収め、あるいはフランス王家と同君連合を結ぶことができれば、我が王はナポリのみならずフランスの王冠も戴くことになるだろう。"

 # === 補正 ===

 STATIC_MODIFIER_NAME_nap_foothold_in_northern_italy_mod: "北イタリアへの足掛かり"
 STATIC_MODIFIER_DESC_nap_foothold_in_northern_italy_mod: "ナポリ王国は南イタリアを基盤としながらも北イタリア政治に深く関与した。カルロ・ダンジューのフィレンツェ後見・教皇庁支援の伝統は、ナポリにとって北イタリアでの足場を持つことが南からの孤立を防ぐ生命線であることを示している。"

 STATIC_MODIFIER_NAME_nap_crossroads_of_civilizations_mod: "文明の十字路"
 STATIC_MODIFIER_DESC_nap_crossroads_of_civilizations_mod: "ナポリはギリシャ・ローマ・ビザンツ・アラブ・ノルマン・フランス・スペインの文明が交差した都市だ。国立考古学博物館の前身となる宮廷コレクションには古代ギリシャの彫刻からルネサンス絵画まで、地中海文明の精華が集まっている。"

 STATIC_MODIFIER_NAME_nap_anjou_homeland_mod: "アンジューの故地"
 STATIC_MODIFIER_DESC_nap_anjou_homeland_mod: "アンジュー家の名はフランスのアンジェ（ロワール川沿いの都市）に由来する。プランタジネット朝イングランドを建てたヘンリー2世もアンジュー伯だ。故地アンジェとの紐帯を回復することはアンジュー家の全ヨーロッパ的なネットワークを活性化させる。"


 STATIC_MODIFIER_NAME_nap_king_of_france_mod: "フランス王"
 STATIC_MODIFIER_DESC_nap_king_of_france_mod: "カペー朝の末裔たるアンジュー家がカペー朝宗主国の王冠を戴く——歴史の逆転だ。フランスの「最もキリスト教的な王」の称号はヨーロッパで最も権威ある称号の一つであり、これを得ることで南イタリアの王朝が全キリスト教世界の政治的頂点へと昇る。"

 nap_mediterranean_greatest_city_desc: "ナポリの人口は今、地中海でも有数の規模に達した。古代ローマ以来、これほどの繁栄を誇る都市は、この海においても稀であろう。"

 nap_university_of_frederick_ii_desc: "フリードリヒ2世が設立したナポリ大学は、王国の学問の中心地である。芸術と学問のための施設を整備すれば、その威光はヨーロッパ中に広まるだろう。"

 nap_magnificent_royal_palace_desc: "王宮に庭園を造営することは、王権の威光を内外に示す上で欠かせない事業である。壮麗な庭園は、訪れる者すべてに王国の繁栄を物語るだろう。"

 nap_expansion_of_naples_port_desc: "ナポリの港に造船施設(ドック)を整備すれば、艦船の修理と建造がより効率的に行えるようになり、王国艦隊の維持と拡充に大いに役立つだろう。"

 nap_subjugation_of_epirus_desc: "オトラント海峡を越えて橋頭堡を築いた我が軍は、ついにエピロスの地全域を制圧した。アルバニアの海岸線は今、王国の支配下に入った。"

 nap_caserta_palace_desc: "カゼルタの地に新たな宮殿を築くことは、王家の威光を示すとともに、ナポリの宮廷から離れた静かな統治の場を王家に与えることになるだろう。"

 nap_charles_dream_desc: "かつてカルロ1世は、十字軍の延長として、地中海東部に一大帝国を築くことを夢見た。モレアの地に橋頭堡を得た今、その夢は再び現実のものとなりつつある。"

 nap_never_die_without_seeing_naples_desc: "「ナポリを見ずして死ぬことなかれ」――この格言が示す通り、ナポリは今や、世界中の旅人たちが憧れる都となった。その美しさと繁栄は、何世代にもわたって語り継がれるだろう。"

 nap_latin_empire_desc: "シチリア王国は、もはや一地方の王国ではない。西は地中海の覇権を握り、東はモレアからコンスタンティノープルへの道を見据える――今こそ、かつてのラテン帝国の継承者として、世界にその名を示す時である。"

 # === 補正 ===
 STATIC_MODIFIER_NAME_nap_mediterranean_greatest_city_mod: "地中海最大の都市"
 STATIC_MODIFIER_DESC_nap_mediterranean_greatest_city_mod: "中世末期のナポリは人口10〜20万人に達する地中海最大の都市の一つだった。コンスタンティノープル・パリ・ミラノと並ぶこの大都市は港・市場・教会・宮殿が密集し、地中海文明の精華を体現していた。"

 STATIC_MODIFIER_NAME_nap_university_of_frederick_ii_mod: "フェデリコ2世大学"
 STATIC_MODIFIER_DESC_nap_university_of_frederick_ii_mod: "1224年に神聖ローマ皇帝フリードリヒ2世が創設したナポリ大学は、ヨーロッパ最古の国立大学の一つだ。教会や修道院から独立した世俗的な高等教育機関として設立されたこの大学はトマス・アクィナスが学んだことでも知られる。"

 STATIC_MODIFIER_NAME_nap_magnificent_royal_palace_mod: "壮麗なる王宮"
 STATIC_MODIFIER_DESC_nap_magnificent_royal_palace_mod: "カゼルタ宮殿（後述）以前のナポリ王宮（パラッツォ・レアーレ）は1600年に着工されスペイン副王の居城として建設された。しかしアンジュー・アラゴン時代のカステル・ヌオーヴォ（マスキオ・アンジョイーノ）こそナポリ王権の象徴的中枢だ。"

 STATIC_MODIFIER_NAME_nap_expansion_of_naples_port_mod: "ナポリ港の拡張"
 STATIC_MODIFIER_DESC_nap_expansion_of_naples_port_mod: "ナポリ湾はヴェスヴィオ火山を背景に天然の良港として古代から機能してきた。アンジュー・アラゴン時代に整備された港湾施設は地中海交易の一大拠点となり、東洋の香辛料・北アフリカの穀物・イベリアの羊毛が行き交った。"

 STATIC_MODIFIER_NAME_nap_subjugation_of_epirus_mod: "エピロスの制圧"
 STATIC_MODIFIER_DESC_nap_subjugation_of_epirus_mod: "エピロス（現在のアルバニア・ギリシャ北西部）はアドリア海対岸のナポリ王国の自然な影響圏だった。カルロ・ダンジューは1272年にアルバニア王を名乗り、バルカン半島への野心を示した。この地の支配はビザンツ帝国復興の足がかりとなる。"

 STATIC_MODIFIER_NAME_nap_caserta_palace_mod: "カゼルタ宮殿"
 STATIC_MODIFIER_DESC_nap_caserta_palace_mod: "ヴァンヴィテッリ設計のカゼルタ宮殿（1752年着工）はヴェルサイユ宮殿に匹敵する規模を誇り、ブルボン朝ナポリ王国の威信を象徴した。1200以上の部屋・全長3kmの庭園・水道橋に支えられた噴水群——この壮大な王宮が生まれる前の礎を作ることがこのミッションの目標だ。"

 STATIC_MODIFIER_NAME_nap_charles_dream_mod: "カルロ1世の夢"
 STATIC_MODIFIER_DESC_nap_charles_dream_mod: "カルロ・ダンジュー（シャルル・ダンジュー）は地中海全体の覇者を目指した。ビザンツ帝国再征服・十字軍遠征・コンスタンティノープル奪回——彼の野心はナポリを単なる南イタリアの王国に留めず、地中海帝国の首都たらしめることにあった。"

 STATIC_MODIFIER_NAME_nap_never_die_without_seeing_naples_mod: "ナポリを見ずして死ぬことなかれ"
 STATIC_MODIFIER_DESC_nap_never_die_without_seeing_naples_mod: "「ナポリを見てから死ね（Vedi Napoli e poi muori）」——18世紀のヨーロッパの旅人たちがこの言葉を残したほど、ナポリはヴェスヴィオ火山・湾の絶景・古代遺跡・活気ある街路の全てで訪れる者を圧倒する都市だった。"

 STATIC_MODIFIER_NAME_nap_latin_empire_mod: "ラテン帝国"
 STATIC_MODIFIER_DESC_nap_latin_empire_mod: "1204年の第四回十字軍によるコンスタンティノープル征服で成立した「ラテン帝国」は1261年にビザンツ帝国に奪還されたが、その称号はヴェネツィアやアンジュー家に引き継がれた。カルロ・ダンジューはビザンツ征服を準備していたが1282年のシチリアの晩鐘がその夢を断ち切った。"
