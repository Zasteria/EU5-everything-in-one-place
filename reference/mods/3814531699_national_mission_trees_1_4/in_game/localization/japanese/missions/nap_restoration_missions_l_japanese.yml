l_japanese:
 nap_restoration_mission_pack: "ナポリ王国の道"
 nap_restoration_mission_pack_DESCRIPTION:0 "シチリアを失った王国は、再統一と地中海における覇権の回復を目指す。アンジュー家の血統と威光のもと、ナポリを中心に新たな黄金時代を築け。"
 nap_restoration_mission_pack_CRITERIA_DESCRIPTION:0 "ナポリ王国としてミッションを達成し、シチリアの再統一とラテン帝国の復興を目指せ。"
 nap_restoration_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してナポリ王国の道を歩め。"
 nap_restoration_mission_pack_BUTTON_DETAILS:0 "二つに裂かれたシチリア王国を再び一つにし、地中海西部の覇者として、そしてかつてのラテン帝国の継承者として、その名を歴史に刻め！"
