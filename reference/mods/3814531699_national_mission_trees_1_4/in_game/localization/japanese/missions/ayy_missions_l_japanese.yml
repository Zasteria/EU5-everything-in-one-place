 STATIC_MODIFIER_DESC_ayy_sugar_mod: "「甘い金」エジプト産砂糖がヨーロッパ市場に供給されアイユーブ朝が莫大な富を得た。"
 STATIC_MODIFIER_NAME_ayy_iraq_ajam_mod: "イラク・アジャム進出"
 STATIC_MODIFIER_DESC_ayy_iraq_ajam_mod: "ペルシャ西部の山あいの町々に、アイユーブの使者の馬がたびたび姿を見せるようになった。"
 STATIC_MODIFIER_NAME_ayy_mosque_mod: "全土のモスク"
 STATIC_MODIFIER_DESC_ayy_mosque_mod: "帝国全土にモスクが建設されスンニ派イスラムの精神的統一が達成された。"
 STATIC_MODIFIER_NAME_ayy_sultan_mod: "エジプト・シリアのスルタン"
 STATIC_MODIFIER_DESC_ayy_sultan_mod: "エジプト・シリア・イラク・ヒジャーズを統一したスルタンとしての威光が輝く。"
 STATIC_MODIFIER_NAME_ayy_saladin_mod: "新たなるサラディン"
 STATIC_MODIFIER_DESC_ayy_saladin_mod: "サラーフッディーンの名を継ぐ者として中東全土がアイユーブ朝の下に統一された。"
 STATIC_MODIFIER_NAME_ayy_rise_mod: "アイユーブ朝の復活"
 STATIC_MODIFIER_DESC_ayy_rise_mod: "サラディンの名を呼ぶ声とともに、諸部族の戦士たちが旗のもとに続々と集まってくる。"
 ayy_mamluk_rivalry: "マムルーク朝との対決"
 ayy_mamluk_rivalry_desc: "マムルーク朝——もともとアイユーブ朝が育成したトルコ系奴隷軍人（マムルーク）が1250年にアイユーブ朝を打倒して建国したこの国家は、我らの宿敵だ。マムルーク朝を牽制し、アレッポへの請求権を確立してシリア奪還への足がかりとせよ。"
 STATIC_MODIFIER_NAME_ayy_baghdad_city_mod: "カリフの都"
 STATIC_MODIFIER_DESC_ayy_baghdad_city_mod: "バグダードがイスラム文明の交易・文化の中枢として再生した。"
 STATIC_MODIFIER_NAME_ayy_levant_control_mod: "レヴァント支配体制の確立"
 STATIC_MODIFIER_DESC_ayy_levant_control_mod: "レヴァント地方の統治体制が確立され属国・併合が効率化された。"
 STATIC_MODIFIER_NAME_ayy_holy_cities_mod: "二聖都の守護者"
 STATIC_MODIFIER_DESC_ayy_holy_cities_mod: "メッカとメディナの守護者と仰がれ、アイユーブの宮廷には学者と法官と改宗者が、世界各地から集っている。"
 STATIC_MODIFIER_NAME_ayy_jerusalem_mod: "エルサレム解放の聖戦"
 STATIC_MODIFIER_DESC_ayy_jerusalem_mod: "エルサレム解放の栄光がアイユーブ軍に異教徒との戦闘で恒久的な優位をもたらす。"
