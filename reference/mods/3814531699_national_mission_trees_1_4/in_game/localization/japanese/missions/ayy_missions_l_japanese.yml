l_japanese:
 ayy_ayyubid_mission_pack: "サラディンの再来と中東の覇者へ"
 ayy_ayyubid_mission_pack_DESCRIPTION:0 "1337年、アイユーブ朝はシリア北部の小国として存続している。かつてサラディン（1138-1193年）がエジプト・シリア・メソポタミアを統一し、十字軍をエルサレムから駆逐した栄光の時代を取り戻せ。エジプトを征服し、聖都エルサレムを解放し、バグダードを掌握し、メッカ・メディナを守護者として支配して「新たなるサラディン」となれ。"
 ayy_ayyubid_mission_pack_CRITERIA_DESCRIPTION:0 "エジプト・レヴァント・メソポタミア・アラビアを征服し、スンニ派イスラムの守護者として中東の覇者となれ。"
 ayy_ayyubid_mission_pack_BUTTON_TOOLTIP:0 "新たなるサラディンとして中東に君臨せよ。"
 ayy_ayyubid_mission_pack_BUTTON_DETAILS:0 "シリア北部の小国から始まり、十字軍を打倒してエルサレムを奪還し中東の大帝国を築け！"

 ayy_rise_of_ayyubids: "アイユーブ朝の復活"
 ayy_rise_of_ayyubids_desc: "1137年にサラディンが打ち立てたアイユーブ朝——エジプト・シリア・イエメン・メソポタミアを統一しイスラム世界に黄金時代をもたらしたこの王朝が、分裂と衰退を経て今再び立ち上がる。サラディンの栄光を継承し、中東の覇者として復活せよ。"
 ayy_secure_sinai: "シナイ半島の確保"
 ayy_secure_sinai_desc: "シナイ半島——エジプトとレヴァントを結ぶ戦略的要衝を確保することでエジプト遠征への道が開かれる。"
 ayy_conquer_lower_egypt: "下エジプト制圧"
 ayy_conquer_lower_egypt_desc: "ナイルデルタのエジプト——アレクサンドリアの港と肥沃な農地がアイユーブ朝の経済基盤となる。かつてサラディンがファーティマ朝を倒してエジプトを掌握したように、この豊かな土地を征服せよ。"
 ayy_seize_cairo: "カイロ掌握"
 ayy_seize_cairo_desc: "「千の宣礼塔の都市」カイロ——ファーティマ朝が建設したこの都市をイスラム世界の政治・文化の中心として整備せよ。"
 ayy_upper_egypt: "上エジプト制圧"
 ayy_upper_egypt_desc: "アスワンのナイル流域——古代ファラオの地を制圧することでエジプト全土の掌握が完成する。"
 ayy_nile_breadbasket: "ナイルの恵み"
 ayy_nile_breadbasket_desc: "ナイル川の氾濫が育む豊かな農地——エジプトは古来「世界の食料庫」と呼ばれた。この農業生産力を最大限に活用して帝国の基盤を固めよ。"
 ayy_dev_cairo: "帝都カイロの建設"
 ayy_dev_cairo_desc: "アイユーブ帝国の首都カイロを世界最大の都市として建設せよ——モスク・マドラサ・隊商宿・市場が立ち並ぶこの永遠の都がイスラム文明の中枢として輝く。"
 ayy_secure_levant: "レヴァント制圧"
 ayy_secure_levant_desc: "ダマスカスを中心とするレヴァント——十字軍が支配するこの地を解放してアイユーブ朝の版図を確立せよ。"
 ayy_seize_aleppo: "アレッポ掌握"
 ayy_seize_aleppo_desc: "「北のシリアの王冠」アレッポ——この古代交易都市の掌握でシリア全体の支配が確立される。"
 ayy_reclaim_jerusalem: "エルサレム解放"
 ayy_reclaim_jerusalem_desc: "「聖都」エルサレム——1187年のサラディンによる解放は歴史的偉業だった。今再びイスラムの聖地を十字軍から解放し、スンニ派の守護者としての地位を確立せよ。"
 ayy_coastal_levant: "地中海沿岸の掌握"
 ayy_coastal_levant_desc: "アッコン・ティルス・ベイルートの地中海沿岸都市——これら交易港を掌握することで地中海交易への参入が確立される。"
 ayy_antioch: "アンティオキア制圧"
 ayy_antioch_desc: "古代の大都市アンティオキア——かつてビザンツ・ペルシャが争ったこの要衝を制圧し北方への影響力を確立せよ。"
 ayy_jazira: "イル・ハン国からの独立"
 ayy_jazira_desc: "モンゴルのイル・ハン国の影響下に置かれたジャジーラ地方——チグリス・ユーフラテス間のこの豊かな土地を自国および属国による支配のもとに置き、モンゴルの くびきを断ち切ってアイユーブ朝の独立を示せ。公国への昇格がアイユーブ朝の正統性を高める。"
 ayy_kurdish_highlands: "クルド高地の制圧"
 ayy_kurdish_highlands_desc: "サラディン自身がクルド人の出身だ——クルド高地の山岳民族を統合し、アイユーブ朝の精強な騎馬軍団として活用せよ。"
 ayy_iraq_arabi: "イラク・アラビー制圧"
 ayy_iraq_arabi_desc: "メソポタミア南部のイラク・アラビー——バスラを掌握しペルシャ湾交易への参入を確立せよ。"
 ayy_seize_baghdad: "バグダード掌握"
 ayy_seize_baghdad_desc: "「平和の都市」バグダード——かつてアッバース朝カリフが君臨したこの都市を掌握することでアイユーブ朝がイスラム世界の盟主として認められる。"
 ayy_mesopotamia_trade: "メソポタミア交易"
 ayy_mesopotamia_trade_desc: "チグリス・ユーフラテス流域の交易——東方の香辛料・絹がバグダードを通じて西方に流れる交易路を掌握せよ。"
 ayy_hejaz: "ヒジャーズ進出"
 ayy_hejaz_desc: "イスラムの聖地ヒジャーズ——メッカ・メディナを擁するこの地域に進出することでアイユーブ朝が全イスラム世界の守護者となる。"
 ayy_holy_cities: "二聖都の守護"
 ayy_holy_cities_desc: "メッカとメディナ——預言者ムハンマドの聖地を守護することで「二聖都の守護者」の称号がアイユーブ朝スルタンに与えられる。"
 ayy_north_yemen: "北イエメン制圧"
 ayy_north_yemen_desc: "アラビア半島南西部のイエメン——古代シバの女王の地を制圧し紅海交易への参入を確立せよ。"
 ayy_south_yemen: "アデン港の掌握"
 ayy_south_yemen_desc: "「アラビア海の門」アデン——この天然良港の掌握でインド洋交易への参入が確立され莫大な富が流れ込む。"
 ayy_arabian_trade: "アラビア交易の掌握"
 ayy_arabian_trade_desc: "インド洋・紅海・ペルシャ湾を結ぶアラビア交易路——アデンを拠点にインドからの香辛料交易を独占せよ。"
 ayy_madrasa: "マドラサの設立"
 ayy_madrasa_desc: "マドラサ（イスラム学校）——法学・神学・哲学を教えるこの学術機関が各都市に設立されイスラム文明の知的黄金時代が到来する。"
 ayy_crusader_wars: "十字軍との聖戦"
 ayy_crusader_wars_desc: "「ジハード」——サラディンが1187年のハッティーンの戦いで十字軍を壊滅させたように、異教徒との聖戦でアイユーブ軍の精鋭を鍛えよ。"
 ayy_dev_damascus: "ダマスカスの繁栄"
 ayy_dev_damascus_desc: "「地上の楽園」ダマスカス——古代から続くこの交易都市を整備し、アイユーブ朝の文化・商業の中心として発展させよ。"
 ayy_spice_trade: "香辛料交易"
 ayy_spice_trade_desc: "東方の香辛料——インドからアデン・アレクサンドリアを経てヨーロッパに流れる高級商品の交易を掌握することで莫大な富が流れ込む。"
 ayy_silk_road_control: "シルクロード掌握"
 ayy_silk_road_control_desc: "中央アジアからバグダードを経て西方へ——シルクロードの要衝を掌握することでアイユーブ帝国が東西交易の仲介者として君臨する。"
 ayy_kurdish_cavalry: "クルド騎兵精鋭化"
 ayy_kurdish_cavalry_desc: "クルドの騎馬戦士——サラディン自身も誇ったクルド騎兵を精鋭化し、アイユーブ朝最強の騎馬軍団として育成せよ。"
 ayy_nile_fleet: "ナイル艦隊"
 ayy_nile_fleet_desc: "ナイル川と地中海を結ぶアイユーブ朝の艦隊——十字軍の補給路を遮断し、地中海交易に参入せよ。"
 ayy_defeat_crusaders: "十字軍の打倒"
 ayy_defeat_crusaders_desc: "「ハッティーンの再現」——サラディンが1187年に成し遂げた十字軍の壊滅的敗北を再現せよ。十字軍国家を地図から消し去る時が来た。"
 ayy_egypt_navy: "エジプト艦隊"
 ayy_egypt_navy_desc: "地中海・紅海を制するエジプト艦隊——両海を支配することでアイユーブ帝国が海洋覇権を確立する。"
 ayy_sugar_egypt: "エジプトの砂糖"
 ayy_sugar_egypt_desc: "ナイル川流域の砂糖キビ——「甘い金」と呼ばれるこの高級商品を独占し莫大な富を得よ。"
 ayy_iraq_ajam: "イラク・アジャム進出"
 ayy_iraq_ajam_desc: "ペルシャ西部のイラク・アジャム——この地を掌握することでペルシャへの影響力が確立される。"
 ayy_build_mosques: "全土のモスク建設"
 ayy_build_mosques_desc: "モスク（清真寺）——イスラム世界の精神的中枢として全土に礼拝の場所を建設し、スンニ派文明の栄光を示せ。"
 ayy_sultan_of_egypt_syria: "エジプト・シリアのスルタン"
 ayy_sultan_of_egypt_syria_desc: "「エジプト・シリア・イラク・ヒジャーズのスルタン」——この称号がカイロで宣言された。アイユーブ朝がイスラム世界の覇者として確立された。"
 ayy_new_saladin: "新たなるサラディン"
 ayy_new_saladin_desc: "「サラーフッディーン——信仰の廉直者」——この称号がアイユーブ朝スルタンに与えられた。エジプト・シリア・イラク・アラビアを統一し十字軍を打倒した新たなるサラディンが中東の覇者として君臨する。"

 ayy_events.1.t: "アイユーブ朝の復活——サラディンの誓い"
 ayy_events.1.d: "「アッラーの御名において——」\n\n1337年、アイユーブ朝は小国として存続しているが、その血管にはサラディンの精神が流れている。1187年のハッティーンの戦いでの栄光、そしてエルサレム解放の記憶がアイユーブ朝スルタンを鼓舞する。\n\nエジプトを征服し、聖都を解放し、メッカを守護し、新たなる「サラーフッディーン」として中東の覇者となれ——それがアイユーブ朝の使命だ。"
 ayy_events.1.a: "アッラーの道において——アイユーブ朝よ、立て！"
 ayy_events.10.t: "エルサレム解放——イスラムの聖地が蘇る"
 ayy_events.10.d: "「アッラーフ・アクバル！（神は偉大なり）」——1187年のサラディンの偉業が再び繰り返された。エルサレムがイスラムの手に戻ったのだ。岩のドームと聖なるモスクが再びイスラムの礼拝の声に包まれる。イスラム世界が沸き立った。"
 ayy_events.10.a: "エルサレム万歳！アッラーの名のもとに！"
 ayy_events.20.t: "バグダード入城——イスラム世界の中枢へ"
 ayy_events.20.d: "「平和の都市」バグダード——かつてアッバース朝カリフが支配したこの都市にアイユーブ軍が入城した。街道には「サラディンの後継者が来た」と人々が喜ぶ。バグダードの文化・学術がアイユーブ朝の庇護のもとに花開く。"
 ayy_events.20.a: "バグダード万歳！イスラムの栄光よ永遠に！"
 ayy_events.30.t: "二聖都の守護者——メッカとメディナを守れ"
 ayy_events.30.d: "メッカとメディナ——預言者ムハンマドの聖地がアイユーブ朝の守護のもとに入った。「ハーディム・アル＝ハラマイン・アル＝シャリーファイン（二聖モスクの守護者）」——この称号がアイユーブ朝スルタンに与えられ、全イスラム世界が承認した。"
 ayy_events.30.a: "二聖都の守護者として——アッラーの御名において！"
 ayy_events.60.t: "エジプト・シリアのスルタン——中東の覇者"
 ayy_events.60.d: "カイロの宮廷で宣言された——「エジプト・シリア・イラク・ヒジャーズのスルタン、アイユーブ朝の君主」。エルサレム・バグダード・メッカ・カイロが全てアイユーブ朝の旗のもとに統一された。サラディン以来の夢が実現したのだ。"
 ayy_events.60.a: "スルタン万歳！アイユーブ朝万歳！"
 ayy_events.99.t: "新たなるサラディン——中東永遠の覇者"
 ayy_events.99.d: "「サラーフッディーン・アイユーブ——信仰の廉直者、中東の覇者」——この称号が歴史に刻まれた。エジプトのナイルからメソポタミアのチグリスまで、アラビアの砂漠からアナトリアの山地まで——全ての土地がアイユーブ朝の旗のもとに統一された。1187年のサラディンが果たせなかった夢が、今完全に実現した。"
 ayy_events.99.a: "新たなるサラディン万歳！アイユーブ帝国万歳！"
