 STATIC_MODIFIER_NAME_mos_black_earth_mod: "黒土の大収穫"
 STATIC_MODIFIER_DESC_mos_black_earth_mod: "草原の辺境には新しい村と水車小屋が点在し、穀物を満載した荷車が新しい道を北へ向かう。黒土はかつてないほど王国を養っている。"
 STATIC_MODIFIER_NAME_mos_pomestye_mod: "ポメスチエ制度"
 STATIC_MODIFIER_DESC_mos_pomestye_mod: "軍役代償の土地制度でロシア軍事力の基盤が整備された。"
 STATIC_MODIFIER_NAME_mos_streltsy_mod: "ストレリツィ"
 STATIC_MODIFIER_DESC_mos_streltsy_mod: "常備火薬歩兵ストレリツィがロシア軍の主力となった。"
 STATIC_MODIFIER_NAME_mos_zaseka_mod: "ザセチナヤ・チェルタ"
 STATIC_MODIFIER_DESC_mos_zaseka_mod: "南方防衛線の完成でタタールの侵入が封じられた。"
 STATIC_MODIFIER_NAME_mos_arkhangelsk_mod: "白海唯一の港"
 STATIC_MODIFIER_DESC_mos_arkhangelsk_mod: "白海の港アルハンゲリスクが西欧との交易窓口となった。"
 STATIC_MODIFIER_NAME_mos_white_sea_mod: "白海交易"
 STATIC_MODIFIER_DESC_mos_white_sea_mod: "白海交易路の掌握で西欧との直接交易が確立された。"
 STATIC_MODIFIER_NAME_mos_nizhny_mod: "ヴォルガとオカの合流点"
 STATIC_MODIFIER_DESC_mos_nizhny_mod: "ヴォルガとオカの合流点に位置する交易都市が整備された。"
 STATIC_MODIFIER_NAME_mos_pskov_mod: "プスコフ征服"
 STATIC_MODIFIER_DESC_mos_pskov_mod: "プスコフが征服され北西ロシアの支配が完成した。"
 STATIC_MODIFIER_NAME_mos_yaroslavl_mod: "シルクとリンネルの交易地"
 STATIC_MODIFIER_DESC_mos_yaroslavl_mod: "ヴォルガ川の交易都市ヤロスラヴリが北方交易の中継地となった。"
 STATIC_MODIFIER_NAME_mos_vologda_mod: "北方交易路の要衝"
 STATIC_MODIFIER_DESC_mos_vologda_mod: "北方交易路の要衝ヴォログダが掌握された。"
 STATIC_MODIFIER_NAME_mos_amber_mod: "琥珀の道"
 STATIC_MODIFIER_DESC_mos_amber_mod: "バルト海の琥珀交易がロシアの商業収入を増大させた。"
 STATIC_MODIFIER_NAME_mos_taxation_mod: "租税改革"
 STATIC_MODIFIER_DESC_mos_taxation_mod: "全国の徴税官が同じ帳簿の様式で税を記し、その銀貨はすべてツァーリの国庫へと運ばれている。"
 STATIC_MODIFIER_NAME_mos_kazan_city_mod: "多民族都市の建設"
 STATIC_MODIFIER_DESC_mos_kazan_city_mod: "征服したカザンが多民族共存の交易都市として整備された。"
 STATIC_MODIFIER_NAME_mos_vilnius_mod: "ヴィリニュス征服"
 STATIC_MODIFIER_DESC_mos_vilnius_mod: "リトアニア大公国の首都ヴィリニュスが征服された。"
 STATIC_MODIFIER_NAME_mos_university_mod: "モスクワ大学"
 STATIC_MODIFIER_DESC_mos_university_mod: "モスクワ大学の講堂にはロシア各地から集まった学生たちの声が響き、啓蒙の光がこの地にも届いた。"
 STATIC_MODIFIER_NAME_mos_teutonic_mod: "チュートン騎士団打倒"
 STATIC_MODIFIER_DESC_mos_teutonic_mod: "バルト十字軍の遺産チュートン騎士団が打倒された。"
 STATIC_MODIFIER_NAME_mos_tallinn_mod: "タリン制圧"
 STATIC_MODIFIER_DESC_mos_tallinn_mod: "ハンザ同盟の重要港タリンがロシアの支配下に入った。"
 STATIC_MODIFIER_NAME_mos_tobolsk_city_mod: "シベリアの商業首都"
 STATIC_MODIFIER_DESC_mos_tobolsk_city_mod: "トボリスクの市場には、シベリアの毛皮と森の恵みが積み上げられ、商人たちの声が絶えず響いている。"
 STATIC_MODIFIER_NAME_mos_military_reform_mod: "軍制改革"
 STATIC_MODIFIER_DESC_mos_military_reform_mod: "西欧式の軍服に身を包んだ兵たちが、新式の銃を担いで練兵場を行進している。"
 STATIC_MODIFIER_NAME_mos_ostrog_mod: "シベリアの砦網"
 STATIC_MODIFIER_DESC_mos_ostrog_mod: "シベリアの針葉樹林の奥に築かれた木造の砦から、毛皮税を集める役人たちが帝国の名を人々に告げている。"
 STATIC_MODIFIER_NAME_mos_absolutism_mod: "絶対王政"
 STATIC_MODIFIER_DESC_mos_absolutism_mod: "ツァーリの絶対的権威が確立されロシアが中央集権国家として完成した。"
 STATIC_MODIFIER_NAME_mos_st_petersburg_mod: "サンクトペテルブルク"
 STATIC_MODIFIER_DESC_mos_st_petersburg_mod: "ネヴァ川に建設された「ヨーロッパの窓」サンクトペテルブルクがロシアの新首都となった。"
 STATIC_MODIFIER_NAME_mos_navy_mod: "ロシア海軍"
 STATIC_MODIFIER_DESC_mos_navy_mod: "ロシア海軍の創設でバルト海・カスピ海・黒海の制海権が確立された。"
 STATIC_MODIFIER_NAME_mos_suzdal_mod: "正教と文化の古都"
 STATIC_MODIFIER_DESC_mos_suzdal_mod: "黄金の環スーズダリが宗教・文化の中心地として整備された。"
 STATIC_MODIFIER_NAME_mos_vladimir_mod: "古ルーシの聖なる首都"
 STATIC_MODIFIER_DESC_mos_vladimir_mod: "古都ウラジーミルが農業・食料供給の中心地として整備された。"
 STATIC_MODIFIER_NAME_mos_salt_mod: "製塩業"
 STATIC_MODIFIER_DESC_mos_salt_mod: "ヴォログダの製塩所から運ばれた塩が、冬の食料を保存するためにロシアの村々へ届けられている。"
 STATIC_MODIFIER_NAME_mos_beeswax_mod: "蜜蝋交易"
 STATIC_MODIFIER_DESC_mos_beeswax_mod: "ロシアの蜜蝋が正教会と西欧市場に供給される重要交易品となった。"
 STATIC_MODIFIER_NAME_mos_iron_mod: "鉄鋼業"
 STATIC_MODIFIER_DESC_mos_iron_mod: "ウラルの溶鉱炉が赤々と燃え、その鉄から鍛えられた剣と鋤が国じゅうへ運ばれている。"
 STATIC_MODIFIER_NAME_mos_astrakhan_city_mod: "東西交易の十字路"
 STATIC_MODIFIER_DESC_mos_astrakhan_city_mod: "アストラハンの船着き場では、ペルシャの絨毯と中央アジアの香辛料を積んだ船が、ヴォルガを遡る日を待っている。"
 STATIC_MODIFIER_NAME_mos_cossack_mod: "コサック騎兵"
 STATIC_MODIFIER_DESC_mos_cossack_mod: "ドン・コサック・ザポリージャ・コサックがロシア最強の騎兵部隊となった。"
 STATIC_MODIFIER_NAME_mos_royal_degrees_mod: "王朝の書"
 STATIC_MODIFIER_DESC_mos_royal_degrees_mod: "「ステペンナヤ・クニガ」に記された系譜は、ツァーリの家が神に選ばれた正統な血統であることを示している。"
 STATIC_MODIFIER_NAME_mos_kholmogory_mod: "白海交易の前哨基地"
 STATIC_MODIFIER_DESC_mos_kholmogory_mod: "白海交易の前哨基地コルモゴルイが整備された。"
 STATIC_MODIFIER_NAME_mos_grand_duchy_mod: "大公国"
 STATIC_MODIFIER_DESC_mos_grand_duchy_mod: "モスクワ大公国が正式な王国として国際社会に認知された。"
 STATIC_MODIFIER_NAME_mos_balkans_mod: "南スラブの保護"
 STATIC_MODIFIER_DESC_mos_balkans_mod: "バルカンの正教徒がロシアの保護下に入り汎スラブ帝国が形成された。"
 STATIC_MODIFIER_NAME_mos_carpathia_mod: "カルパチア征服"
 STATIC_MODIFIER_DESC_mos_carpathia_mod: "カルパチアの峠に立つロシアの兵は、山の向こうの中欧の平原に帝国の影が伸びていくのを見つめている。"
 STATIC_MODIFIER_NAME_mos_western_mod: "西欧化"
 STATIC_MODIFIER_DESC_mos_western_mod: "ピョートル大帝の西欧化改革でロシアが近代的ヨーロッパ大国として台頭した。"
 STATIC_MODIFIER_NAME_mos_northern_war_mod: "大北方戦争"
 STATIC_MODIFIER_DESC_mos_northern_war_mod: "スウェーデンを破りバルト海の覇権を確立した。"
 STATIC_MODIFIER_NAME_mos_perm_city_mod: "ウラルの毛皮拠点"
 STATIC_MODIFIER_DESC_mos_perm_city_mod: "カマ川上流の毛皮集積都市ペルミが整備され、シベリア征服の前哨基地として機能する。"
 STATIC_MODIFIER_NAME_mos_yakutsk_mod: "極東への前進基地"
 STATIC_MODIFIER_DESC_mos_yakutsk_mod: "東シベリアの中心地ヤクーツクが建設された。"
 STATIC_MODIFIER_NAME_mos_irkutsk_mod: "バイカルの都"
 STATIC_MODIFIER_DESC_mos_irkutsk_mod: "バイカル湖のほとりのイルクーツクが東シベリアの行政・交易の中心となった。"
 STATIC_MODIFIER_NAME_mos_minsk_mod: "白ルテニアの中枢"
 STATIC_MODIFIER_DESC_mos_minsk_mod: "ベラルーシの中心都市ミンスクがロシア支配の拠点となった。"
 STATIC_MODIFIER_NAME_mos_warsaw_mod: "ポーランド平定"
 STATIC_MODIFIER_DESC_mos_warsaw_mod: "ポーランドの首都ワルシャワの征服でポーランド分割が完成した。"
 STATIC_MODIFIER_NAME_mos_iron_ring_mod: "鉄の防衛圏"
 STATIC_MODIFIER_DESC_mos_iron_ring_mod: "要塞網の完成でロシアの領土が鉄壁の防衛体制に守られた。"
 STATIC_MODIFIER_NAME_mos_great_mod: "ロシア帝国"
 STATIC_MODIFIER_DESC_mos_great_mod: "ロシア帝国が正式に宣言され世界の大国として台頭した。"
 STATIC_MODIFIER_NAME_mos_autocrat_final_mod: "全ロシアの専制君主"
 STATIC_MODIFIER_DESC_mos_autocrat_final_mod: "バルト海からシベリアまで——全ての土地がツァーリの御稜威のもとに統治される。"
 mos_great_moscow: "第三のローマの礎——モスクワの大拡張"
 mos_great_moscow_desc: "ツァーリの都モスクワを「第三のローマ」に相応しい大都市として大拡張せよ。聖堂・宮殿・市場・要塞が連なる壮大な都市がロシア帝国の心臓となる。開発度・建造物・人口の三条件を満たすことで、モスクワが「永遠の都」の称号を手にする。"
 STATIC_MODIFIER_NAME_mos_great_moscow_mod: "第三のローマの都"
 STATIC_MODIFIER_DESC_mos_great_moscow_mod: "クレムリンの金色の尖塔が輝く大モスクワは、「第三のローマ」の名にふさわしい大都となった。"
