 STATIC_MODIFIER_NAME_mos_astrakhan_mod: "アストラハン征服"
 STATIC_MODIFIER_DESC_mos_astrakhan_mod: "アストラハンの城壁にモスクワの旗が翻り、ヴォルガの流れはカスピ海の彼方まで大公の名のもとに通じている。"
