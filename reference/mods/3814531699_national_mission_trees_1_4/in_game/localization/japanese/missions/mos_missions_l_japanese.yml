 STATIC_MODIFIER_DESC_mos_kremlin_mod: "クレムリンの聖堂群と宮殿がツァーリの権威の象徴として完成した。"
 STATIC_MODIFIER_NAME_mos_kazan_mod: "カザン征服"
 STATIC_MODIFIER_DESC_mos_kazan_mod: "中ヴォルガの支配が確立しタタールへの完全勝利が達成された。"
