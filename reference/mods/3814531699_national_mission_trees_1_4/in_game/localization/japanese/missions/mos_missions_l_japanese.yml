l_japanese:
 mos_moscow_mission_pack: "タタールのくびきから全ロシアの専制君主へ"
 mos_moscow_mission_pack_DESCRIPTION:0 "1337年、モスクワ大公国はジョチ・ウルス（黄金帳国）の支配下にある小公国だ。イヴァン1世（カリタ）が蓄えた富とタタールとの巧みな外交でモスクワは着実に力をつけてきた。しかし周囲にはノヴゴロド・トヴェリ・リトアニアが控え、南にはタタールの脅威が続く。タタールのくびきを断ち切り、ロシア諸公国を統一し、ツァーリの称号を掲げ、第三のローマとして君臨し、そしてシベリアの果てまで支配する「全ロシアの専制君主」となれ。"
 mos_moscow_mission_pack_CRITERIA_DESCRIPTION:0 "タタールのくびきを解放し、カザン・アストラハン・ノヴゴロドを征服してロシアを統一し、ツァーリを名乗り第三のローマとなり、シベリアを征服せよ。"
 mos_moscow_mission_pack_BUTTON_TOOLTIP:0 "全ロシアの専制君主となれ。"
 mos_moscow_mission_pack_BUTTON_DETAILS:0 "モスクワ大公国からロシア帝国へ——歴史の必然を実現せよ！"

 mos_rally_the_army: "モスクワ軍の整備"
 mos_rally_the_army_desc: "1337年のモスクワ大公国は小さいながらも着実に力をつけてきた。イヴァン1世カリタ（「財布」）は蓄財と外交でモスクワを台頭させた。その遺産を引き継ぎ、まず軍を整備してルーシ諸公国への覇権拡大の準備をせよ。"
 mos_break_tatar_yoke: "タタールのくびきを断て"
 mos_break_tatar_yoke_desc: "1237年以来のタタール支配——ジョチ・ウルスへの貢納と従属がロシアを苦しめてきた。1380年のクリコヴォの戦いでドミートリー・ドンスコイがタタールを撃退した記憶は生きている。今こそ完全な独立を宣言し、タタールのくびきを断ち切れ。"
 mos_conquer_kazan: "カザン征服"
 mos_conquer_kazan_desc: "カザン・ハン国——黄金帳国の後継国家として中ヴォルガを支配するこの国を征服することで、ヴォルガ川交易路が掌握される。後のイヴァン雷帝によるカザン征服（1552年）はモスクワ最大の勝利の一つとなる。"
 mos_subjugate_kazan: "ヴォルガ中流の制圧"
 mos_subjugate_kazan_desc: "カザン征服に続き、ヴォルガ中流域——サマラとタンボフを掌握することで南方への道が開かれる。"
 mos_conquer_astrakhan: "アストラハン征服"
 mos_conquer_astrakhan_desc: "アストラハン・ハン国——ヴォルガ下流デルタを支配するこの国を征服することでカスピ海へのアクセスと東方交易路が確立される。"
 mos_destroy_hordes: "タタール諸国の解体"
 mos_destroy_hordes_desc: "ノガイ・ハン国を含むタタール系諸国家を解体し、ステップへの道を開け。"
 mos_claim_steppes: "ステップの制覇"
 mos_claim_steppes_desc: "黒海北岸のポンティックステップを制覇することで、モスクワはユーラシアの大陸帝国としての姿を現す。"
 mos_black_sea_access: "アゾフ海への進出"
 mos_black_sea_access_desc: "アゾフ海への進出により、黒海交易へのアクセスが確立される。ピョートル大帝によるアゾフ攻略（1696年）に先んじてこの戦略的要衝を掌握せよ。"
 mos_conquer_crimea: "クリミア征服"
 mos_conquer_crimea_desc: "クリミア・ハン国——オスマン帝国の保護下にあるこの半島を征服することで黒海の制海権が確立される。エカテリーナ大帝によるクリミア併合（1783年）に先んじよ。"
 mos_consolidate_russia: "ロシアの統合"
 mos_consolidate_russia_desc: "モスクワを中心にロシアの諸公国を統合し、単一の強力な国家基盤を構築せよ。"
 mos_dev_moscow: "クレムリンの整備"
 mos_dev_moscow_desc: "モスクワ・クレムリン——赤い城壁に囲まれたロシア権力の象徴を整備せよ。ウスペンスキー聖堂・ブラゴヴェシュチェンスキー聖堂・アルハンゲリスキー聖堂が建ち並ぶこの聖域がロシア帝国の心臓となる。"
 mos_conquer_novgorod: "ノヴゴロド征服"
 mos_conquer_novgorod_desc: "ノヴゴロド——かつてロシア最大の商業国家。イヴァン3世による1478年の征服がロシア統一の決定的一歩となった。「ノヴゴロドはモスクワのものだ」——この歴史の転換点をより早く実現せよ。"
 mos_conquer_tver: "トヴェリの征服"
 mos_conquer_tver_desc: "かつてモスクワと覇権を争ったトヴェリ大公国——今やその力は衰えている。ヴォルガ川上流のこの重要な都市を征服し、ルーシ統一への道を開け。"
 mos_conquer_ryazan: "リャザンの制圧"
 mos_conquer_ryazan_desc: "1237年モンゴルに最初に蹂躙されたリャザン公国——その南方の草原地帯を征服し、タタールへの防衛線を構築せよ。"
 mos_conquer_smolensk: "スモレンスク征服"
 mos_conquer_smolensk_desc: "「ロシアの鍵」スモレンス——東西交通の要衝を制することで西方への影響力が確立される。"
 mos_conquer_ruthenia: "ルテニアの征服"
 mos_conquer_ruthenia_desc: "白ルテニア——ミンスクを中心とするリトアニア支配地域を征服し、汎スラブ的な支配を確立せよ。"
 mos_window_on_west: "西方への窓"
 mos_window_on_west_desc: "ヴィボルクとカレリアを掌握し、バルト海への「西方への窓」を開け——後のピョートル大帝が夢見た西方への出口を先取りせよ。"
 mos_baltic_ambition: "バルト海への野望"
 mos_baltic_ambition_desc: "リヴォニア騎士団が支配するバルト海東岸——この地域を制圧することで北ヨーロッパ交易への参入が可能となる。"
 mos_conquer_riga: "リガ征服"
 mos_conquer_riga_desc: "ハンザ同盟の要衝リガ——バルト海交易の中心地を征服することで北欧交易ネットワークへのアクセスが確立される。"
 mos_partition_poland: "ポーランドの分割"
 mos_partition_poland_desc: "ポーランド・リトアニア共和国との争い——ルテニアと東欧の支配をめぐる長年の闘争に終止符を打て。"
 mos_metropolitan_see: "モスクワ府主教区"
 mos_metropolitan_see_desc: "コンスタンティノープルからモスクワへ——1448年にモスクワはビザンツからの独立した教会管区を設立した。この正教の権威がモスクワの政治的正当性を支える。"
 mos_land_of_churches: "聖堂の国"
 mos_land_of_churches_desc: "「聖なるルーシ」——全土に正教の聖堂を建立し、ロシアを神の国として聖別せよ。"
 mos_tsar_title: "ツァーリの称号"
 mos_tsar_title_desc: "「ツァーリ（皇帝）」——ビザンツ皇帝の称号を継承するこの称号をイヴァン4世（雷帝）は1547年に正式採用した。ローマ皇帝の後継者としての権威を宣言し、ロシアをヨーロッパの大国として認知させよ。"
 mos_russian_patriarchate: "ロシア総主教区"
 mos_russian_patriarchate_desc: "1589年にモスクワ総主教区が設立され、コンスタンティノープル総主教区から独立した。ロシア正教会の最高位を確立し、「第三のローマ」としての宗教的基盤を固めよ。"
 mos_guardian_orthodoxy: "正教の守護者"
 mos_guardian_orthodoxy_desc: "コンスタンティノープルがオスマンに陥落した1453年——「第二のローマ」の滅亡後、ロシアこそが正教信仰の守護者だ。全国に正教の網を張り巡らし、「正教の光」でロシアを満たせ。"
 mos_conquer_constantinople: "コンスタンティノープル征服"
 mos_conquer_constantinople_desc: "「第二のローマ」コンスタンティノープル——オスマン帝国の手から正教の聖都を奪還することで「第三のローマ」の使命が完成する。歴史を書き換えよ。"
 mos_third_rome: "第三のローマ"
 mos_third_rome_desc: "「モスクワは第三のローマであり、第四のローマは存在しない」——修道士フィロフェイの言葉が現実となった。モスクワはキリスト教世界の精神的・政治的中心として君臨する。"
 mos_march_caucasus: "コーカサスへの進軍"
 mos_march_caucasus_desc: "コーカサス山脈——グルジア・アルメニア・アゼルバイジャンの地を制覇し、ロシアを真の大陸帝国とせよ。"
 mos_caspian_sea: "カスピ海の制覇"
 mos_caspian_sea_desc: "「ロシアの内海」カスピ海——ペルシャ・中央アジアへの交易路を掌握せよ。"
 mos_beyond_urals: "ウラル山脈を越えて"
 mos_beyond_urals_desc: "ウラル山脈はヨーロッパとアジアの境界——その山脈を越えて広大なシベリアの地が待っている。イェルマーク・チモフェーエフィチのシベリア征服（1582年）に先んじ、毛皮の王国を手に入れよ。"
 mos_conquer_perm: "ペルミの征服"
 mos_conquer_perm_desc: "カマ川上流のペルミ地方——「カマ毛皮」の産地を征服し、シベリア征服の足がかりとせよ。"
 mos_west_siberia: "西シベリア征服"
 mos_west_siberia_desc: "トボリスクを中心とする西シベリア——広大なタイガが毛皮資源を無限に供給する。トボリスクを「シベリアの首都」として整備せよ。"
 mos_east_siberia: "東シベリア征服"
 mos_east_siberia_desc: "イルクーツクへ——バイカル湖のほとりに達することで東シベリアの扉が開かれる。"
 mos_pacific_coast: "太平洋岸到達"
 mos_pacific_coast_desc: "「コサックが太平洋に到達した」——ヤクーツクからオホーツク海へ。ロシアの旗が太平洋の波打ち際にはためく瞬間だ。"
 mos_fur_monopoly: "毛皮独占"
 mos_fur_monopoly_desc: "シベリアの毛皮——ヨーロッパ市場で最高値で取引されるこの商品を独占供給し、莫大な富を得よ。"
 mos_sudebnik: "スデブニク（法典）の制定"
 mos_sudebnik_desc: "1497年のスデブニク——イヴァン3世が制定したロシア初の統一法典だ。「農奴制」の礎となるこの法典が中央集権化の武器となる。中央行政・司法制度を整備し、ロシア国家の法的基盤を固めよ。"
 mos_handle_boyars: "ボヤールの制御"
 mos_handle_boyars_desc: "ボヤール（貴族）——世襲の土地貴族が地方権力を牛耳るこの現状を打破せよ。ツァーリ直轄の行政官制度を設立し、中央集権化を推進せよ。"
 mos_oprichnina: "オプリーチニナ"
 mos_oprichnina_desc: "イヴァン4世（雷帝）の暗黒政策オプリーチニナ——ツァーリ直属の黒い騎馬隊が反抗的ボヤールを粛清した。残酷だが効果的なこの中央集権化政策でツァーリの権威を絶対化せよ。"
 mos_dev_agriculture: "農業開発"
 mos_dev_agriculture_desc: "ロシアの豊かな黒土地帯——ウクライナからヴォルガまで広がる肥沃な農地を開発し、農業生産力を高めよ。"
 mos_dev_agriculture_unlock_tt: "決断「農業開発の推進」が解放された。"
 mos_agriculture_decision.title: "農業開発の推進"
 mos_agriculture_decision.desc: "黒土はウクライナからヴォルガまで広がるが、その収穫は農具・穀倉、そして大地主たちの協力にかかっている。国庫と宮廷での君主の影響力を投じて、その組織化を進めることができる。"
 mos_agriculture_decision.a: "収穫の組織化を進める。"
 mos_agriculture_upgrade_decision.title: "黒土地帯の大開墾"
 mos_agriculture_upgrade_decision.desc: "最初の収穫が確保されたいま、国家は草原の辺境そのものを鋤の下に置くことができる。新しい村、新しい水車小屋、穀物を運ぶ新しい道。莫大な費用と君主の影響力の多くを要するが、黒土はかつてない実りをもたらすだろう。"
 mos_agriculture_upgrade_decision.a: "草原の辺境を開墾する。"
 mos_pomestye_system: "ポメスチエ制度"
 mos_pomestye_system_desc: "ポメスチエ（俸禄領地）制度——軍役の代償として土地を給付するこの制度がロシアの軍事力の基盤となる。後のロシア騎兵隊の礎を築け。"
 mos_streltsy: "ストレリツィの創設"
 mos_streltsy_desc: "ストレリツィ（射手）——イヴァン4世が創設した常備火薬歩兵部隊だ。銃を持つこの精鋭部隊がロシア軍の主力となる。"
 mos_zasechnaya_cherta: "ザセチナヤ・チェルタ（防衛線）"
 mos_zasechnaya_cherta_desc: "南方からのタタール騎馬部隊の侵入を防ぐ防衛線——切り倒した木々と要塞が連なる「ザセチナヤ・チェルタ」を構築せよ。"
 mos_dev_arkhangelsk: "アルハンゲリスクの建設"
 mos_dev_arkhangelsk_desc: "白海の港アルハンゲリスク——ピョートル大帝以前のロシア唯一の海外交易港だ。この港を整備することで西ヨーロッパとの直接交易が可能となる。"
 mos_white_sea_trade: "白海交易"
 mos_white_sea_trade_desc: "イギリスのモスクワ会社（1555年）がここを通じてロシアに入った——その先を越して白海交易路を掌握せよ。"
 mos_dev_nizhny: "ニジニー・ノヴゴロドの整備"
 mos_dev_nizhny_desc: "ヴォルガとオカの合流点——「下のノヴゴロド」を整備してヴォルガ交易の中心地とせよ。"
 mos_conquer_pskov: "プスコフの征服"
 mos_conquer_pskov_desc: "1510年、プスコフがモスクワに併合された。ノヴゴロドに続きプスコフも征服し、北西ロシアを完全に掌握せよ。"
 mos_dev_yaroslavl: "ヤロスラヴリの整備"
 mos_dev_yaroslavl_desc: "「黄金の環」の都市ヤロスラヴリ——ヴォルガ川の交易都市を整備し、北方交易の中継地とせよ。"
 mos_conquer_vologda: "ヴォログダの整備"
 mos_conquer_vologda_desc: "ヴォログダ——北方交易路の要衝を掌握し、白海交易と本土を結ぶ経路を確保せよ。"
 mos_amber_road: "琥珀の道"
 mos_amber_road_desc: "バルト海の琥珀——リガを通じて東方の琥珀をヨーロッパ市場に供給し、交易収入を増大させよ。"
 mos_reform_taxation: "租税改革"
 mos_reform_taxation_desc: "統一的な租税制度を確立し、国家財政を強化せよ。中央集権化された税収がロシア帝国の軍事力を支える。"
 mos_dev_kazan_city: "カザン市の整備"
 mos_dev_kazan_city_desc: "征服したカザンを、タタール人・ロシア人・チュヴァシ人が共存する多民族都市へと発展させよ。"
 mos_conquer_vilnius: "ヴィリニュスの征服"
 mos_conquer_vilnius_desc: "リトアニア大公国の首都ヴィリニュス——この都市を征服することで東欧における覇権が確立される。"
 mos_develop_moscow_university: "モスクワ大学の設立"
 mos_develop_moscow_university_desc: "1755年設立のモスクワ大学——ロシア最古の大学に先んじて学術の殿堂を建設せよ。ロモノーソフの夢を早く実現することでロシアの知的発展を促進せよ。"
 mos_teutonic_order: "チュートン騎士団の打倒"
 mos_teutonic_order_desc: "バルト十字軍の遺産チュートン騎士団——その領域を制圧することでバルト海南岸が完全にロシアの影響下に入る。"
 mos_estonian_coast: "エストニア海岸の制圧"
 mos_estonian_coast_desc: "タリン——ハンザ同盟の重要港を掌握し、バルト海交易への完全参入を果たせ。"
 mos_dev_tobolsk_city: "トボリスクの整備"
 mos_dev_tobolsk_city_desc: "「シベリアの首都」トボリスクを本格的に整備せよ——シベリア征服の行政中心地として発展させる。"
 mos_streltsy_reform: "軍制改革"
 mos_streltsy_reform_desc: "ストレリツィの近代化——西欧の軍事技術を取り入れ、ロシア軍をヨーロッパ水準に引き上げよ。"
 mos_siberian_ostrog: "シベリアの砦網"
 mos_siberian_ostrog_desc: "シベリア征服を支える砦（オストログ）のネットワーク——トボリスク・イェニセイスク・イルクーツクへと連なる前進基地を整備せよ。"
 mos_absolute_monarchy: "絶対王政の確立"
 mos_absolute_monarchy_desc: "ツァーリの絶対的権威を確立せよ——ボヤール・教会・地方領主の権力を削ぎ、全ての権限を皇帝の手に集中させる。"
 mos_peter_reforms: "ピョートルの改革"
 mos_peter_reforms_desc: "ピョートル大帝（1672-1725年）——西欧化改革でロシアを近代国家に変貌させた。軍制改革・海軍創設・科学アカデミー・西暦導入。「窓を開けて西に向かう」——その改革精神を実現せよ。"
 mos_dev_st_petersburg: "サンクトペテルブルクの建設"
 mos_dev_st_petersburg_desc: "1703年にネヴァ川の沼地にピョートル大帝が建設した「ヨーロッパの窓」——サンクトペテルブルクをロシア初の西欧式都市として建設せよ。"
 mos_russian_navy: "ロシア海軍の創設"
 mos_russian_navy_desc: "「ロシアには海軍が必要だ」——ピョートル大帝の信念のもと、アゾフ艦隊・バルト海艦隊を創設せよ。"
 mos_dev_suzdal: "スーズダリの整備"
 mos_dev_suzdal_desc: "「黄金の環」スーズダリ——多くの中世教会を擁するこの古都を宗教・文化の中心地として整備せよ。"
 mos_dev_vladimir: "ウラジーミルの整備"
 mos_dev_vladimir_desc: "かつてウラジーミル大公国の首都——その古都を整備し、農業と食料供給の中心地とせよ。"
 mos_salt_works: "製塩業の発展"
 mos_salt_works_desc: "ヴォログダとソリカムスクの塩——ロシアの食料保存に不可欠な塩の安定供給を確立せよ。"
 mos_beeswax_trade: "蜜蝋交易"
 mos_beeswax_trade_desc: "ロシアの蜜蝋——正教会の蝋燭用途で需要が高く、西欧にも輸出される重要商品だ。"
 mos_iron_works: "鉄鋼業の発展"
 mos_iron_works_desc: "ウラル地方の鉄鉱石——ピョートル大帝時代に本格化するウラル製鉄業の礎を早期に築け。"
 mos_dev_astrakhan_city: "アストラハン市の整備"
 mos_dev_astrakhan_city_desc: "「南の玄関」アストラハン——カスピ海交易の中心地として整備し、ペルシャ・中央アジアとの交易を掌握せよ。"
 mos_cossack_cavalry: "コサック騎兵"
 mos_cossack_cavalry_desc: "コサック——ステップの自由な騎馬戦士たちがロシア帝国の最強の騎兵部隊となる。ドン・コサック・ザポリージャ・コサックをロシア軍に組み込め。"
 mos_book_of_royal_degrees: "ステペンナヤ・クニガ"
 mos_book_of_royal_degrees_desc: "「王朝の書」——ルーシ支配者の系譜を記録したこの書物がモスクワの正当性を強化する。行政制度の整備で帝国の統治を効率化せよ。"
 mos_kholmogory: "コルモゴルイの整備"
 mos_kholmogory_desc: "ドヴィナ川のコルモゴルイ——白海交易の前哨基地を整備せよ。"
 mos_protect_south_slavs: "南スラブの保護"
 mos_protect_south_slavs_desc: "バルカン半島の正教徒——セルビア・ブルガリア・ルーマニアの正教徒をオスマンの支配から解放し、汎スラブ的な帝国を建設せよ。"
 mos_conquer_carpathia: "カルパチアの征服"
 mos_conquer_carpathia_desc: "カルパチア山脈——中欧への門戸を制圧することで西方への影響力が大きく拡大する。"
 mos_great_northern_war: "大北方戦争"
 mos_great_northern_war_desc: "1700-1721年の大北方戦争でピョートル大帝はスウェーデンを破りバルト海の覇権を確立した——その歴史的勝利を先取りして実現せよ。"
 mos_dev_perm_city: "ペルミ市の整備"
 mos_dev_perm_city_desc: "ペルミ——毛皮交易の要衝として整備し、ウラル越えの前哨基地とせよ。"
 mos_yakutsk_founded: "ヤクーツクの建設"
 mos_yakutsk_founded_desc: "1632年建設のヤクーツク——東シベリアの中心地として建設し、太平洋への道を開け。"
 mos_dev_irkutsk: "イルクーツクの整備"
 mos_dev_irkutsk_desc: "バイカル湖のほとりのイルクーツク——「シベリアのパリ」として後に知られるこの都市を東シベリアの行政・交易の中心として整備せよ。"
 mos_dev_minsk: "ミンスクの整備"
 mos_dev_minsk_desc: "ベラルーシの中心都市ミンスクを整備し、西方支配の拠点とせよ。"
 mos_conquer_warsaw: "ワルシャワの征服"
 mos_conquer_warsaw_desc: "ポーランド・リトアニア共和国の首都ワルシャワ——この征服でポーランド分割が完成し、中欧への影響力が確立される。"
 mos_iron_ring_defense: "鉄の防衛圏"
 mos_iron_ring_defense_desc: "南方・西方からの侵攻を防ぐ要塞網——バスティオン型要塞が連なる鉄壁の防衛体制でロシアの領土を守れ。"
 mos_form_russia: "ロシア形成"
 mos_form_russia_desc: "タタールのくびきを断ち切り、カザンを征服し、ルーシ諸公国を統一した——今こそ「ロシア」という国家を正式に宣言する時だ。ツァーリとして全ロシアに君臨せよ。"
 mos_russian_empire: "ロシア帝国"
 mos_russian_empire_desc: "1721年のニスタット条約でピョートル大帝はロシアを正式に「帝国」と宣言した——その歴史的瞬間を先取りして実現せよ。毛皮・農業・西欧化改革の三本柱でロシアが大国として台頭した。"
 mos_autocrat_of_all_russias: "全ロシアの専制君主"
 mos_autocrat_of_all_russias_desc: "「神の恵みにより、全ロシアの皇帝にして専制君主——モスクワ、キエフ、ノヴゴロド、カザン、アストラハン、シベリア大君主」——この称号がロシア帝国の威容を示す。バルト海からシベリアまで、コーカサスから北極海まで——全ての土地がツァーリの御稜威のもとにある。"

 mos_events.1.t: "モスクワ大公国——タタールのくびき下で"
 mos_events.1.d: "1337年、モスクワは小さな公国だ。しかしイヴァン1世カリタ（「財布」）の才覚により、タタールの税金徴収代理人として力を蓄えてきた。\n\nモスクワの強みは地理だ——森に囲まれた内陸の位置がタタールの直接支配を困難にしている。\n\n「クリコヴォの戦い（1380年）」でドミートリー・ドンスコイがタタールを撃退した記憶は生きている。タタールのくびきを完全に断ち切り、ロシアの諸公国を統一し、ツァーリとして全ロシアに君臨せよ——その使命がモスクワに課せられている。"
 mos_events.1.a: "モスクワの栄光のために！"

 mos_events.5.t: "タタールのくびきを断て！"
 mos_events.5.d: "遂にタタールとの戦争でモスクワ軍が勝利を収めた——タタールへの貢納は永遠に終わった。「ウグラ川の対峙（1480年）」に匹敵するこの歴史的転換点で、モスクワは自由ロシアの旗手となった。ロシアの諸公国がモスクワの覇権を認め、統一国家への道が開かれる。"
 mos_events.5.a: "ロシアは自由だ！次はルーシ統一だ！"

 mos_events.10.t: "ツァーリの戴冠"
 mos_events.10.d: "「全ロシアのツァーリにして大公」——この称号の採用でモスクワはビザンツ帝国の正当な後継者として自らを位置づける。1547年のイヴァン4世戴冠式に先駆けてこの歴史的宣言をなせ。ヨーロッパの宮廷がモスクワを新たな大国として認識し始める。"
 mos_events.10.a: "ツァーリ万歳！モスクワ万歳！"

 mos_events.30.t: "コンスタンティノープル奪還——第三のローマの完成"
 mos_events.30.d: "正教の聖都コンスタンティノープルがロシアの手に！1453年にオスマンに陥落したこの都市の奪還は、ロシアが「第三のローマ」として正教世界の精神的指導者となることを意味する。聖ソフィア大聖堂に再びキリスト教の十字架が掲げられる。"
 mos_events.30.a: "第三のローマ万歳！ロシア正教万歳！"

 mos_events.50.t: "ピョートルの改革——西欧化か伝統か"
 mos_events.50.d: "西欧化の波がロシアを席巻しようとしている。西欧の技術・軍制・科学を積極的に取り入れ、ロシアを近代的なヨーロッパ大国として発展させるか——それとも正教の伝統と「ロシア的な道」を守り、独自の帝国を築くか？"
 mos_events.50.a: "西欧化を推進——ロシアはヨーロッパの一部だ"
 mos_events.50.b: "正教の伝統を守る——ロシアは独自の道を歩む"

 mos_events.60.t: "ロシア形成——新しい帝国の誕生"
 mos_events.60.d: "タタールのくびきを断ち、ロシア諸公国を統一し、カザンとアストラハンを征服した——今こそ「ロシア」という国家を世界に宣言する時だ。ニスタット条約に先んじてロシア帝国の誕生を宣言せよ。"
 mos_events.60.a: "ロシア帝国万歳！全ロシアのツァーリ万歳！"

 mos_events.99.t: "全ロシアの専制君主——帝国の完成"
 mos_events.99.d: "「神の恵みにより、全ロシアの皇帝にして専制君主」——バルト海からシベリアまで、コーカサスから北極海まで——ロシアの旗が地球上で最大の帝国に翻る。1337年の小さなモスクワ公国から世界最大の帝国へ——この歴史的偉業は永遠に語り継がれる。"
 mos_events.99.a: "全ロシアの専制君主万歳！ロシア帝国万歳！"

