 STATIC_MODIFIER_DESC_mos_pontic_mod: "黒海北岸ステップを制覇しロシアが大陸帝国の姿を現した。"
 STATIC_MODIFIER_NAME_mos_azov_mod: "アゾフ海進出"
 STATIC_MODIFIER_DESC_mos_azov_mod: "アゾフの港から見える黒海の彼方には、地中海へ通じる航路が広がっている。"
 STATIC_MODIFIER_NAME_mos_crimea_mod: "クリミア征服"
 STATIC_MODIFIER_DESC_mos_crimea_mod: "クリミア半島が征服され黒海の制海権が確立された。"
 STATIC_MODIFIER_NAME_mos_novgorod_mod: "ノヴゴロド征服"
 STATIC_MODIFIER_DESC_mos_novgorod_mod: "商業国家ノヴゴロドが征服されその交易ネットワークがモスクワに移転した。"
 STATIC_MODIFIER_NAME_mos_tver_mod: "トヴェリ征服"
 STATIC_MODIFIER_DESC_mos_tver_mod: "かつての競争相手トヴェリが征服されルーシ統一が進んだ。"
 STATIC_MODIFIER_NAME_mos_ryazan_mod: "リャザン制圧"
 STATIC_MODIFIER_DESC_mos_ryazan_mod: "南方草原への門口リャザンが掌握された。"
 STATIC_MODIFIER_NAME_mos_smolensk_mod: "スモレンスク征服"
 STATIC_MODIFIER_DESC_mos_smolensk_mod: "ロシアの鍵スモレンスクが征服され西方への道が開かれた。"
 STATIC_MODIFIER_NAME_mos_ruthenia_mod: "ルテニア征服"
 STATIC_MODIFIER_DESC_mos_ruthenia_mod: "白ルテニアが征服され汎スラブ的な支配が確立された。"
 STATIC_MODIFIER_NAME_mos_vyborg_mod: "ヴィボルク掌握"
 STATIC_MODIFIER_DESC_mos_vyborg_mod: "バルト海への西方の窓が開かれた。"
 STATIC_MODIFIER_NAME_mos_baltic_mod: "バルト海への野望"
 STATIC_MODIFIER_DESC_mos_baltic_mod: "リヴォニア制圧で北ヨーロッパ交易への参入が可能となった。"
 STATIC_MODIFIER_NAME_mos_riga_mod: "リガ征服"
 STATIC_MODIFIER_DESC_mos_riga_mod: "ハンザ同盟の要衝リガが征服され北欧交易ネットワークが掌握された。"
 STATIC_MODIFIER_NAME_mos_poland_mod: "ポーランド分割"
 STATIC_MODIFIER_DESC_mos_poland_mod: "ポーランド・リトアニア共和国との争いが決着しロシアが東欧の覇者となった。"
 STATIC_MODIFIER_NAME_mos_metropolitan_mod: "モスクワ府主教区"
 STATIC_MODIFIER_DESC_mos_metropolitan_mod: "モスクワに独立した正教会府主教区が設立された。"
 STATIC_MODIFIER_NAME_mos_churches_mod: "聖堂の国"
 STATIC_MODIFIER_DESC_mos_churches_mod: "全土に正教の聖堂が建立されロシアが「聖なるルーシ」として完成した。"
 STATIC_MODIFIER_NAME_mos_patriarchate_mod: "ロシア総主教区"
 STATIC_MODIFIER_DESC_mos_patriarchate_mod: "モスクワ総主教区が設立されロシア正教会の独立が達成された。"
 STATIC_MODIFIER_NAME_mos_orthodoxy_mod: "正教の守護者"
 STATIC_MODIFIER_DESC_mos_orthodoxy_mod: "コンスタンティノープル陥落後ロシアが正教世界の守護者となった。"
 STATIC_MODIFIER_NAME_mos_third_rome_mod: "第三のローマ"
 STATIC_MODIFIER_DESC_mos_third_rome_mod: "モスクワが第三のローマとしてキリスト教世界の精神的中心に君臨する。"
 STATIC_MODIFIER_NAME_mos_caucasus_mod: "コーカサス進軍"
 STATIC_MODIFIER_DESC_mos_caucasus_mod: "コーカサスの山々の峠にロシアの前哨の焚き火が点り、山岳の諸王国も北の皇帝の名を耳にしている。"
 STATIC_MODIFIER_NAME_mos_caspian_mod: "カスピ海制覇"
 STATIC_MODIFIER_DESC_mos_caspian_mod: "カスピ海の制覇で中央アジア・ペルシャへの交易路が開かれた。"
 STATIC_MODIFIER_NAME_mos_urals_mod: "ウラル越え"
 STATIC_MODIFIER_DESC_mos_urals_mod: "ウラル山脈を越えてシベリアへの道が開かれた。"
 STATIC_MODIFIER_NAME_mos_perm_mod: "ペルミ征服"
 STATIC_MODIFIER_DESC_mos_perm_mod: "カマ毛皮の産地ペルミが征服されシベリア征服の基盤が整った。"
 STATIC_MODIFIER_NAME_mos_tobolsk_mod: "シベリア交易の確立"
 STATIC_MODIFIER_DESC_mos_tobolsk_mod: "トボリスクを中心とする西シベリア交易ネットワークが確立され、商人の維持費が削減された。"
 STATIC_MODIFIER_NAME_mos_east_siberia_mod: "東シベリア征服"
 STATIC_MODIFIER_DESC_mos_east_siberia_mod: "東シベリアの広大な毛皮資源がロシアの支配下に入った。"
 STATIC_MODIFIER_NAME_mos_pacific_mod: "太平洋到達"
 STATIC_MODIFIER_DESC_mos_pacific_mod: "ロシアの旗が太平洋岸にはためき大陸帝国が完成した。"
 STATIC_MODIFIER_NAME_mos_fur_monopoly_mod: "毛皮独占"
 STATIC_MODIFIER_DESC_mos_fur_monopoly_mod: "シベリアの毛皮交易全ルートがロシアの独占支配下に入った。"
 STATIC_MODIFIER_NAME_mos_sudebnik_mod: "スデブニク"
 STATIC_MODIFIER_DESC_mos_sudebnik_mod: "統一法典の制定でロシアの法的・行政的基盤が確立された。"
 STATIC_MODIFIER_NAME_mos_boyar_mod: "ボヤール制御"
