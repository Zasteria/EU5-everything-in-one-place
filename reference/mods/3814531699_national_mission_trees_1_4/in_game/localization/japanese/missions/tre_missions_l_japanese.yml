l_japanese:
 tre_trebizond_mission_pack: "コムネノス朝の復活とビザンツの再興"
 tre_trebizond_mission_pack_DESCRIPTION:0 "1337年、トレビゾンド帝国はポントス海岸の小国として存続している。コムネノス王朝の末裔として、かつてのビザンツ帝国の栄光を取り戻す使命を帯びている。黒海交易を掌握し、アナトリアを奪回し、コンスタンティノープルを解放してビザンツ帝国を再興せよ。"
 tre_trebizond_mission_pack_CRITERIA_DESCRIPTION:0 "アナトリアを征服し、コンスタンティノープルを奪還し、バルカンを制圧してビザンツ帝国を再興せよ。"
 tre_trebizond_mission_pack_BUTTON_TOOLTIP:0 "コムネノス朝の帝国を再興せよ。"
 tre_trebizond_mission_pack_BUTTON_DETAILS:0 "ポントスの海岸から出発し、ビザンツの遺産を継承してコンスタンティノープルに凱旋せよ！"

 tre_komnenian_legacy: "コムネノスの遺産"
 tre_komnenian_legacy_desc: "コムネノス王朝——アレクシオス一世が創始したこの王朝はビザンツ帝国を最後の黄金時代に導いた。その血脈を引くトレビゾンド帝国が今、眠れる覇権を目覚めさせる時だ。"
 tre_pontus_coast: "ポントス海岸の制圧"
 tre_pontus_coast_desc: "黒海南岸のポントス——この古代ミトリダテス王国の地を完全制圧することで黒海交易への参入基盤が確立される。"
 tre_black_sea_trade: "黒海交易の掌握"
 tre_black_sea_trade_desc: "黒海はジェノヴァ・ヴェネツィアが支配する交易の海だ。コムネノスの艦隊でこの海の覇権を確立し、東西交易の利益を独占せよ。"
 tre_dev_trebizond: "トレビゾンド市の整備"
 tre_dev_trebizond_desc: "ポントスの真珠トレビゾンド——この交易都市を整備し帝国の首都にふさわしい輝きを与えよ。"
 tre_orthodox_stronghold: "正教の牙城"
 tre_orthodox_stronghold_desc: "トレビゾンドの正教修道院——コムネノス朝の精神的基盤である正教信仰を強化し、ビザンツ文化の継承者としての正統性を示せ。"
 tre_armenia_campaign: "アルメニア制圧"
 tre_armenia_campaign_desc: "コーカサスの山岳地帯——アルメニアを征服することで東方への防衛線と多様な文化資源が確保される。"
 tre_cappadocia: "カッパドキア征服"
 tre_cappadocia_desc: "奇岩の大地カッパドキア——古代キリスト教の洞窟修道院群を擁するこの地を征服し、アナトリア再征服の足がかりとせよ。"
 tre_central_anatolia: "中部アナトリア奪還"
 tre_central_anatolia_desc: "アンカラを中心とする中部アナトリア——セルジューク朝以来トルコ人が支配するこの地を取り戻し、ビザンツの正統な後継者としての地位を示せ。"
 tre_west_anatolia: "西部アナトリア進軍"
 tre_west_anatolia_desc: "エーゲ海沿岸の豊かな西部アナトリア——古代イオニア文明の地を奪回し、コンスタンティノープルへの道を開け。"
 tre_reclaim_nicaea: "ニカイア奪還"
 tre_reclaim_nicaea_desc: "ニカイア——第四回十字軍後にビザンツ亡命政権が置かれた歴史的都市をブルサとともに奪還し、コンスタンティノープル奪還への王手を指せ。"
 tre_anatolian_emperor: "アナトリア皇帝"
 tre_anatolian_emperor_desc: "アナトリア全土がコムネノスの旗のもとに——この偉業でトレビゾンドがビザンツ帝国の真の後継者として世界に認められる。"
 tre_thrace_campaign: "トラキア攻略"
 tre_thrace_campaign_desc: "コンスタンティノープルを囲むトラキア——この地を制圧することで聖都奪還への最終段階が整う。"
 tre_reclaim_constantinople: "コンスタンティノープル奪還"
 tre_reclaim_constantinople_desc: "「第二のローマ」コンスタンティノープル——ビザンツ帝国の心臓たる聖都を奪還する時が来た。コムネノスの旗がアヤソフィアに翻る。"
 tre_northern_greece: "北ギリシャ奪還"
 tre_northern_greece_desc: "テッサロニキを中心とする北ギリシャ——ビザンツ帝国の第二の都市を奪還しバルカン支配の基盤を固めよ。"
 tre_bulgaria: "ブルガリア征服"
 tre_bulgaria_desc: "かつてビザンツと覇権を争ったブルガリア——この地を征服しバルカン全体の制圧を進めよ。"
 tre_morea: "モレア奪還"
 tre_morea_desc: "ペロポネソス半島のモレア——アテナイとともにギリシャ文明の心臓部を奪回し、ビザンツのルネサンスを実現せよ。"
 tre_aegean_islands: "エーゲ海諸島の制圧"
 tre_aegean_islands_desc: "エーゲ海の島々——ラテン十字軍が支配するこれらの島々を奪回し地中海への扉を開けよ。"
 tre_macedonian_campaign: "マケドニア征服"
 tre_macedonian_campaign_desc: "アレクサンダー大王の故地マケドニア——この戦略的要地を制圧しバルカン支配を完成させよ。"
 tre_silk_trade: "絹の交易"
 tre_silk_trade_desc: "中央アジアから黒海を経て西方へと流れる絹——この高級品の交易路を掌握することでトレビゾンドが東西交易の要衝となる。"
 tre_komnenian_army: "コムネノス朝の軍隊"
 tre_komnenian_army_desc: "コムネノス朝の軍制改革——傭兵と地方軍を融合させた効率的な軍事システムで帝国の再征服を支えよ。"
 tre_greek_culture: "ギリシャ文化の復興"
 tre_greek_culture_desc: "「マケドニア・ルネサンス」の再来——コンスタンティノープル・トレビゾンドにおける学術・芸術の復興でビザンツ文明を再生させよ。"
 tre_cilicia_campaign: "キリキア制圧"
 tre_cilicia_campaign_desc: "地中海への玄関口キリキア——かつてアルメニア王国が栄えたこの地を征服し南方への影響力を確立せよ。"
 tre_dev_constantinople: "コンスタンティノープルの再建"
 tre_dev_constantinople_desc: "オスマン統治で荒廃したコンスタンティノープルを再建せよ——アヤソフィアに正教の十字架が輝き、かつての世界都市が蘇る。"
 tre_orthodox_patriarch: "正教の大主教区"
 tre_orthodox_patriarch_desc: "コンスタンティノープル総主教区——コムネノス朝がビザンツ正教会の最高権威として全正教徒を統率する大主教区を確立せよ。"
 tre_georgia_campaign: "グルジア遠征"
 tre_georgia_campaign_desc: "コーカサスの要衝グルジア——かつてコムネノス朝と深い婚姻関係を持ったこの国を征服し東方の安定を図れ。"
 tre_komnenian_navy: "コムネノス朝の艦隊"
 tre_komnenian_navy_desc: "黒海・エーゲ海・地中海を結ぶコムネノス艦隊——海洋帝国の基盤となる強力な海軍を育成せよ。"
 tre_antioch_crusade: "アンティオキア奪還"
 tre_antioch_crusade_desc: "「神のご意思に従い」——かつてビザンツの支配下にあったアンティオキアを奪回し東地中海の覇権を確立せよ。"
 tre_greek_population: "ギリシャ人口の増加"
 tre_greek_population_desc: "ギリシャ文化圏の拡大——正教信仰とギリシャ語によって帝国の人口基盤を固め、ビザンツ文明の担い手を育成せよ。"
 tre_restore_byzantium: "ビザンツ帝国の再興"
 tre_restore_byzantium_desc: "「ビザンツ帝国が蘇った」——コムネノス朝の旗のもとにアナトリア・バルカン・コンスタンティノープルが再統合される。1204年の第四回十字軍が破壊したビザンツ帝国が、410年ぶりに復活した。"
 tre_komnenos_dynasty: "コムネノス朝の栄光"
 tre_komnenos_dynasty_desc: "「コムネノス皇帝——東ローマの後継者、正教の守護者、東地中海の覇者」——トレビゾンドから始まった小さな帝国が、歴史上最も偉大な帝国の後継者として世界に君臨する。"

 tre_events.20.t: "コンスタンティノープル奪還——ビザンツ復活"
 tre_events.20.d: "「第二のローマ」コンスタンティノープルがコムネノスの手に！アヤソフィアに正教の十字架が再び掲げられた。世界は震えた——ビザンツ帝国が蘇ったのだ。"
 tre_events.20.a: "神の栄光のためにコンスタンティノープル万歳！"
 tre_events.60.t: "ビザンツ帝国の再興宣言"
 tre_events.60.d: "アナトリア・バルカン・コンスタンティノープルが一つとなった——コムネノス朝が「ビザンツ帝国」の再興を宣言する。1204年の悲劇から蘇った帝国が東地中海の覇者として君臨する。"
 tre_events.60.a: "ビザンツ帝国万歳！コムネノス朝万歳！"
 tre_events.99.t: "コムネノス朝の永遠の栄光"
 tre_events.99.d: "「コムネノス皇帝——東ローマの後継者にして正教の守護者」——この称号が地中海世界に響き渡る。トレビゾンドから始まった小さな帝国が、歴史上最も偉大な帝国の後継者として世界に君臨する。コムネノスの名が永遠に歴史に刻まれた。"
 tre_events.99.a: "コムネノス朝万歳！永遠の栄光よ！"

 STATIC_MODIFIER_NAME_tre_komnenian_mod: "コムネノスの遺産"
 STATIC_MODIFIER_DESC_tre_komnenian_mod: "コムネノス朝の紫の旗を仰ぐとき、宮廷の誰もがビザンツの栄光をトレビゾンドの手に取り戻す日を思い描く。"
 STATIC_MODIFIER_NAME_tre_pontus_mod: "ポントス制圧"
 STATIC_MODIFIER_DESC_tre_pontus_mod: "黒海南岸のポントス地方がトレビゾンドの完全支配下に入った。"
 STATIC_MODIFIER_NAME_tre_black_sea_mod: "黒海交易の覇者"
 STATIC_MODIFIER_DESC_tre_black_sea_mod: "黒海の商船は、トレビゾンドの港に錨を下ろすことなくしては、東方の絹を積み込むことができない。"
 STATIC_MODIFIER_NAME_tre_trebizond_city_mod: "トレビゾンド都市整備"
 STATIC_MODIFIER_DESC_tre_trebizond_city_mod: "トレビゾンドが帝国の首都にふさわしい交易都市として整備された。"
 STATIC_MODIFIER_NAME_tre_orthodox_mod: "正教の牙城"
 STATIC_MODIFIER_DESC_tre_orthodox_mod: "トレビゾンドが正教信仰の堅固な拠点として確立された。"
 STATIC_MODIFIER_NAME_tre_armenia_mod: "アルメニア征服"
 STATIC_MODIFIER_DESC_tre_armenia_mod: "アルメニアが征服され東方への防衛線が確立された。"
 STATIC_MODIFIER_NAME_tre_cappadocia_mod: "カッパドキア制圧"
 STATIC_MODIFIER_DESC_tre_cappadocia_mod: "奇岩の大地カッパドキアがトレビゾンドの支配下に入った。"
 STATIC_MODIFIER_NAME_tre_anatolia_mod: "中部アナトリア制圧"
 STATIC_MODIFIER_DESC_tre_anatolia_mod: "中部アナトリアが奪回されビザンツ再興への道が開かれた。"
 STATIC_MODIFIER_NAME_tre_west_anatolia_mod: "西部アナトリア制圧"
 STATIC_MODIFIER_DESC_tre_west_anatolia_mod: "西部アナトリアの富がコムネノス帝国の繁栄を支える。"
 STATIC_MODIFIER_NAME_tre_nicaea_mod: "ニカイア奪還"
 STATIC_MODIFIER_DESC_tre_nicaea_mod: "ニカイア奪還でビザンツ帝国の正統な後継者としての地位が確立された。"
 STATIC_MODIFIER_NAME_tre_thrace_mod: "トラキア制圧"
 STATIC_MODIFIER_DESC_tre_thrace_mod: "トラキアを制圧しコンスタンティノープル奪還への道が整った。"
 STATIC_MODIFIER_NAME_tre_greece_mod: "北ギリシャ制圧"
 STATIC_MODIFIER_DESC_tre_greece_mod: "テッサロニキを中心とする北ギリシャがコムネノスの旗のもとに集った。"
 STATIC_MODIFIER_NAME_tre_bulgaria_mod: "ブルガリア征服"
 STATIC_MODIFIER_DESC_tre_bulgaria_mod: "ブルガリアが征服されバルカンの制圧が進んだ。"
 STATIC_MODIFIER_NAME_tre_morea_mod: "モレア征服"
 STATIC_MODIFIER_DESC_tre_morea_mod: "ペロポネソス半島のモレアが奪回されギリシャ文明の地が蘇った。"
 STATIC_MODIFIER_NAME_tre_aegean_mod: "エーゲ海制覇"
 STATIC_MODIFIER_DESC_tre_aegean_mod: "エーゲ海諸島がコムネノス帝国の支配下に入り地中海への道が開かれた。"
 STATIC_MODIFIER_NAME_tre_macedonia_mod: "マケドニア征服"
 STATIC_MODIFIER_DESC_tre_macedonia_mod: "マケドニアが征服されバルカン支配が完成した。"
 STATIC_MODIFIER_NAME_tre_silk_mod: "絹の交易路"
 STATIC_MODIFIER_DESC_tre_silk_mod: "中央アジアからの絹がトレビゾンドを通じて西方へ流れる交易が確立された。"
 STATIC_MODIFIER_NAME_tre_army_mod: "コムネノス朝軍制"
 STATIC_MODIFIER_DESC_tre_army_mod: "傭兵と地方の兵が同じ旗の下で調練を重ね、コムネノスの軍は新たな力を得ている。"
 STATIC_MODIFIER_NAME_tre_culture_mod: "ギリシャ文化の復興"
 STATIC_MODIFIER_DESC_tre_culture_mod: "ビザンツ文明の復興でトレビゾンドが東地中海の知的中心となった。"
 STATIC_MODIFIER_NAME_tre_cilicia_mod: "キリキア制圧"
 STATIC_MODIFIER_DESC_tre_cilicia_mod: "キリキアが征服され地中海への道が確保された。"
 STATIC_MODIFIER_NAME_tre_cpole_city_mod: "コンスタンティノープル再建"
 STATIC_MODIFIER_DESC_tre_cpole_city_mod: "コンスタンティノープルが世界都市としての輝きを取り戻した。"
 STATIC_MODIFIER_NAME_tre_patriarch_mod: "コンスタンティノープル総主教区"
 STATIC_MODIFIER_DESC_tre_patriarch_mod: "コンスタンティノープル総主教区が確立されコムネノス帝国が正教世界の中枢となった。"
 STATIC_MODIFIER_NAME_tre_georgia_mod: "グルジア征服"
 STATIC_MODIFIER_DESC_tre_georgia_mod: "コーカサスの要衝グルジアが征服され東方の安定が確保された。"
 STATIC_MODIFIER_NAME_tre_navy_mod: "コムネノス朝艦隊"
 STATIC_MODIFIER_DESC_tre_navy_mod: "コムネノス朝の艦隊が黒海・エーゲ海・地中海を制した。"
 STATIC_MODIFIER_NAME_tre_antioch_mod: "アンティオキア奪還"
 STATIC_MODIFIER_DESC_tre_antioch_mod: "アンティオキアが奪還され東地中海の覇権が確立された。"
 STATIC_MODIFIER_NAME_tre_greek_pop_mod: "ギリシャ人口の拡大"
 STATIC_MODIFIER_DESC_tre_greek_pop_mod: "ギリシャ語の祈りと市場の呼び声が、復興した帝国のあらゆる町の通りに満ちている。"
 STATIC_MODIFIER_NAME_tre_restore_byzantium_mod: "ビザンツ帝国再興"
 STATIC_MODIFIER_DESC_tre_restore_byzantium_mod: "ビザンツ帝国の再興でコムネノス朝が東地中海の覇者として認められた。"
 STATIC_MODIFIER_NAME_tre_komnenos_final_mod: "コムネノス朝の栄光"
 STATIC_MODIFIER_DESC_tre_komnenos_final_mod: "コムネノス朝の帝国が東地中海・黒海・バルカンを支配する世界帝国として完成した。"
 tre_rize_tea: "リゼのチャイ栽培"
 tre_rize_tea_desc: "リゼ——ポントス山脈とポントス海の温暖湿潤な気候に恵まれたこの地は、将来トルコ最大の茶産地となる。1737年以降、ジョージア経由で伝わった茶の栽培技術でリゼの丘陵地帯を茶畑に転換せよ。コムネノス帝国に東方の高貴な飲み物をもたらせ。"
 STATIC_MODIFIER_NAME_tre_rize_tea_mod: "リゼのチャイ農園"
 STATIC_MODIFIER_DESC_tre_rize_tea_mod: "リゼの丘陵地帯が茶畑に転換され帝国に茶の生産基盤が確立された。"
 STATIC_MODIFIER_NAME_tre_cpole_loc_mod: "コンスタンティノープルの復活"
 STATIC_MODIFIER_DESC_tre_cpole_loc_mod: "コンスタンティノープルが帝国行政・統治の中枢として機能し始めた。"
