l_japanese:
 teu_teutonic_mission_pack: "ドイツ騎士団——剣と十字架"
 teu_teutonic_mission_pack_DESCRIPTION:0 "神の名のもとにバルトを征服したドイツ騎士団。十字軍の旗を掲げて東方の異教徒・正教徒を討伐し北方十字軍を完成させるか、世俗化してプロイセン王国として近代ドイツの礎を築くか——選択の時が来た。"
 teu_teutonic_mission_pack_CRITERIA_DESCRIPTION:0 "十字軍ルートで北方十字軍を完成させるか、世俗化ルートでプロイセン王国を建設せよ。"
 teu_teutonic_mission_pack_BUTTON_TOOLTIP:0 "剣と十字架でバルトから東欧を制覇せよ。"
 teu_teutonic_mission_pack_BUTTON_DETAILS:0 "「助けを求める者にすべてを、敵には容赦なく」——大団長の名のもとにバルト海を支配せよ！"
 teu_crusaders_legacy: "十字軍騎士団の遺産"
 teu_crusaders_legacy_desc: "1190年、第三次十字軍の最中にアッコンで創設されたドイツ騎士団。当初は聖地での病院騎士団として出発したが、1226年のリミニ黄金文書でフリードリヒ2世より異教徒プロイセンへの遠征権を授与され、以来バルト海南岸を十字軍の剣で征服してきた。マルボルクを首都とするこの「騎士修道士国家」はヨーロッパ最後の十字軍国家として異教徒の討伐と植民地建設を続けている。ゲディミナスのリトアニアとヤゲウォのポーランドという強敵に囲まれた今こそ、騎士団の真価が問われる時だ。"
 teu_secure_prussia: "プロイセン制圧"
 teu_secure_prussia_desc: "プロイセン——かつてバルト系プロイセン人が住んでいたこの地は、1230年代からドイツ騎士団による50年以上の征服戦争を経て手に入れられた。1283年の「大反乱」鎮圧後、先住民族は事実上絶滅しドイツ人入植者による植民地として再建された。しかし山岳地帯や森林地帯にはいまだ抵抗の芽が残る。プロイセン全域の城塞ネットワークを完成させ騎士団の支配を盤石なものにせよ——プロイセンなくしてドイツ騎士団はない。"
 teu_christianize_prussia: "プロイセンのキリスト教化"
 teu_christianize_prussia_desc: "ドイツ騎士団の建前上の存在理由は「異教徒の改宗」だ。しかし現実には征服したプロイセン人の多くは強制改宗させられ反抗した者は虐殺された。1249年のクリストブルク条約でプロイセン人貴族に洗礼を条件とした権利が認められたが、その後の反乱でその約束は反故にされた。今や真の意味でのカトリック化を推進し、教会網を整備してドイツ騎士団の宗教的正統性を確立せよ。ローマ教皇の後ろ盾あってこそ、この国家は正統な存在となれる。"
 teu_subdue_lithuania: "リトアニアの制圧"
 teu_subdue_lithuania_desc: "リトアニア大公国——ゲディミナス朝のもとでバルト海からウクライナまで伸びた巨大な異教国家は、ドイツ騎士団にとって最大の脅威であり同時に十字軍の標的だった。1260年のドゥルベの戦いでの敗北、1410年のグルンヴァルトの惨敗——リトアニアはドイツ騎士団を何度も打ち負かした強敵だ。しかし1387年のヨガイラのカトリック改宗でリトアニアは名目上「異教国家」でなくなり十字軍の大義も曖昧になった。それでもリトアニアとの覇権争いに勝利してこそ、バルト海の支配者たりうる。"
 teu_subdue_poland: "ポーランドの制圧"
 teu_subdue_poland_desc: "1410年7月15日、タンネンベルク（グルンヴァルト）の戦い——ドイツ騎士団史上最大の敗北。大団長ウルリヒ・フォン・ユンギンゲンをはじめ騎士団の精華が戦死し、マルボルクは包囲された。1466年の第二次トルン条約では西プロイセンをポーランドに割譲し、事実上の属国状態となった。この屈辱を晴らすことこそ騎士団の悲願だ——ポーランドを打ち負かし、失われた領土を取り戻し、タンネンベルクの汚名を雪げ。"
 teu_order_or_prussia: "選択の時——十字軍か世俗化か"
 teu_order_or_prussia_desc: "1511年、ホーエンツォレルン家のアルブレヒトが大団長に就任した時、騎士団は存亡の危機に立たされていた。1517年のルターの宗教改革が欧州を揺るがす中、アルブレヒトはルター本人と面会し、騎士団を世俗化してプロイセン公国を創設する道を選んだ——1525年のことだ。しかし、もし騎士団が十字軍の使命を続けるならば？ 東方の正教徒・異教徒・イスラム教徒を打倒する「北方十字軍」の完成を目指すか、それとも世俗的な君主国として近代プロイセンの礎を築くか——選べ。"
 teu_crusade_path: "北方十字軍の道"
 teu_crusade_path_desc: "十字軍の道——神の御名の下に剣を取れ。ドイツ騎士団の本来の使命は異教徒の改宗と征服だ。東方には正教会のルーシ、バルト海にはリヴォニア騎士団との連携が待っている。かつてのプロイセン征服と同じように、バルト海東岸から北ロシアまで十字軍の旗を立てよ。グレゴリウス9世が授けた十字軍の免状は永遠に有効だ——神の意志のもとに北方十字軍を完成させ、大団長の名を歴史に刻め。"
 teu_path_crusade_chosen_tt: "十字軍の道を選んだ"
 teu_path_secular_chosen_tt: "世俗化への道を選んだ"
 teu_livonian_alliance: "リヴォニア騎士団との連携"
 teu_livonian_alliance_desc: "リヴォニア騎士団——1237年にドイツ騎士団に合併した剣の兄弟騎士団の後継。リガを本拠地とするこの騎士団はバルト海東岸を支配しているが、リトアニアとルーシの圧力にさらされている。1242年のチュード湖の戦いでアレクサンドル・ネフスキーに敗れ、1260年のドゥルベの戦いでリトアニアに壊滅的打撃を受けた歴史を持つ。今こそリヴォニア騎士団と連携しバルト海東岸を共に支配する体制を構築せよ——兄弟騎士団の力を借りて東方の敵を打倒するのだ。"
 teu_crusade_east: "東方十字軍"
 teu_crusade_east_desc: "十字軍の剣を東方に向けよ——正教会の「分裂者」、ロムヴァの「異教徒」、イスラムの「不信者」。これらすべてがカトリックの敵であり十字軍の標的だ。ドイツ騎士団は1230年代からバルト人の地で「北方十字軍」を戦い続けてきた。今や視野をさらに東に広げ、東方正教会の中心地とバルト人最後の砦に聖戦を挑め。1386年にリトアニアがカトリックに改宗したことで「合法的な」十字軍の標的は減ったが、ロシアの正教会国家がまだ残っている。"
 teu_riga_crusade: "リガの十字軍拠点"
 teu_riga_crusade_desc: "リガ——1201年にアルベルト・フォン・ブクスヘーフェデン司教が建設したこの都市はバルト海東岸の最重要拠点だ。リヴォニア騎士団とリガ大司教の間の権力争いが続いてきたが、ドイツ騎士団がこれを統合し十字軍の東方前進基地として整備すればルーシとの対決の足がかりとなる。ドヴィナ川の河口に位置するリガは交易と軍事の両面で極めて重要——ここを確保することで東方進軍への物資補給線が確立される。"
 teu_march_to_orthodox: "正教会への進軍"
 teu_march_to_orthodox_desc: "「異端の」正教会——ローマ・カトリックから見れば、1054年の大分裂以来ビザンツとルーシの正教会は「誤った信仰」を持つ者たちだ。ノヴゴロド共和国、プスコフ、ロシア諸侯国——これらの正教会国家こそが北方十字軍の真の標的だ。1242年、アレクサンドル・ネフスキーはチュード湖の氷上でリヴォニア騎士団を打ち破り「十字軍に勝った英雄」として今も讃えられる。その雪辱を果たし、正教会の地にカトリックの旗を立てよ——これがドイツ騎士団の究極の使命だ。"
 teu_northern_crusade_final: "北方十字軍の完成"
 teu_northern_crusade_final_desc: "北方十字軍——プロイセン征服から始まりバルト海東岸、そしてルーシの深奥まで伸びるこの聖戦がついに完成しようとしている。かつてのプロイセン人のように正教徒も改宗させるか征服するかだ。バルト海はドイツ騎士団の内海となり大団長の旗が東の果てまで翻る。13世紀の剣の兄弟騎士団から続く「北方十字軍」の夢——バルト人・スラブ人・フィン人の地を聖なる帝国として統合するこの夢が今実現する。"
 teu_secularize_path: "世俗化への道"
 teu_secularize_path_desc: "1525年4月10日、クラクフにてアルブレヒト・フォン・ホーエンツォレルンがポーランド王ジグムント1世の封臣としてプロイセン公国の創設を宣言した——ドイツ騎士団の世俗化だ。ルター派への改宗と引き換えに、騎士団の領地は世俗的な公国として存続することになった。この「背信行為」にカトリック諸国は激怒したがプロテスタント勢力の台頭が騎士団に活路を与えた。宗教改革の波に乗り世俗的な君主として近代プロイセンの礎を築け——これが新たな時代の騎士団の生き方だ。"
 teu_prussian_duchy: "プロイセン公国"
 teu_prussian_duchy_desc: "プロイセン公国——1525年の世俗化によって誕生したこの国家はホーエンツォレルン家の支配のもとで急速に発展した。ケーニヒスベルクを首都とし、ルター派の宗教改革を積極的に推進、ケーニヒスベルク大学（1544年創設）を通じて「知のプロイセン」を標榜した。かつての十字軍国家が今や近代的な公国として変貌しつつある。行政機構を整備し、貴族（ユンカー）と協力関係を築き、軍事国家としての基盤を確立せよ——これが後のプロイセン王国、そしてドイツ帝国への第一歩だ。"
 teu_control_pomerania: "ポメラニア制圧"
 teu_control_pomerania_desc: "ポメラニア——バルト海南岸、ヴィスワ川西方に広がるこの地はドイツ諸侯国とデンマーク、そしてポーランドの間で争われてきた。グライフェン家のポメラニア公国はプロイセンとブランデンブルクの間に挟まれた小国だがバルト海への出口として戦略的に極めて重要だ。ポメラニアを掌握することでプロイセンはバルト海の真の覇者となる。シュテティン（シュチェチン）の港とオーデル川の水運を支配し、ブランデンブルクとポメラニアを結ぶ「北ドイツ軸」を確立せよ。"
 teu_protestant_reformation: "プロテスタント宗教改革"
 teu_protestant_reformation_desc: "1517年、ヴィッテンベルクの教会扉に95か条の論題を貼り付けたマルティン・ルター——その宗教改革の波はプロイセンを直撃した。大団長アルブレヒト自身がルターと会見し騎士団の世俗化を決断した歴史がある。プロイセンのルター派受容はカトリックのハプスブルク家に対抗する「プロテスタント同盟」の基盤となった。宗教改革を積極的に推進し、教育と行政の近代化を図れ——ケーニヒスベルク大学の学問的伝統、プロイセンの規律ある官僚制度が後世にまで続くプロイセン文化の礎となる。"
 teu_dominate_hre: "神聖ローマ帝国での台頭"
 teu_dominate_hre_desc: "神聖ローマ帝国——「神聖でも、ローマでも、帝国でもない」と揶揄されるこの複雑な政治体制の中でプロイセンはどう立ち回るか。ハプスブルク家の皇帝権力、選帝侯たちの対立、宗教改革による亀裂——これらすべてがプロイセンの台頭を可能にする。1618年のブランデンブルク＝プロイセン合同（ホーエンツォレルン家による相続）は後の統一ドイツの礎となる。選帝侯としての地位を確立し、帝国内の影響力を拡大し、ハプスブルクへの対抗馬としてプロイセンを北ドイツの盟主に押し上げよ。"
 teu_north_german_empire: "北ドイツ連邦"
 teu_north_german_empire_desc: "北ドイツ帝国——ビスマルクの夢、ホーエンツォレルン家の野望。18世紀のフリードリヒ大王はオーストリアとの七年戦争でプロイセンの強大さを証明し、19世紀のビスマルクは「鉄血政策」でドイツを統一した。しかしそれより遥か以前、ドイツ騎士団の後継国家として——プロイセンが北ドイツ全土を統合する夢は長い歴史を持つ。ブランデンブルク、ポメラニア、メクレンブルク、ハノーファー——北ドイツ諸侯を糾合し、近代ドイツ国家の先駆けとなる北ドイツ連邦を今ここで実現せよ。"
 teu_malbork_citadel: "マルボルク要塞の強化"
 teu_malbork_citadel_desc: "マルボルク城（マリエンブルク）——ヴィスワ川デルタに建つこの巨大な煉瓦城塞はドイツ騎士団の総本部だ。1309年にヴェネツィアから移転して以来、中世ヨーロッパ最大の城郭建築として知られる。1410年のグルンヴァルト敗北後、ポーランド軍に包囲されたが大団長代理ハインリヒ・フォン・プラウエンの指揮で持ちこたえた。マルボルクの城壁こそが騎士団国家の象徴——ここを難攻不落の要塞として整備することがすべての防衛戦略の基盤となる。"
 teu_konigsberg_dev: "ケーニヒスベルクの発展"
 teu_konigsberg_dev_desc: "ケーニヒスベルク（現カリーニングラード）——1255年にボヘミア王オタカル2世の支援で建設されたこの都市はプロイセン植民地の中心都市として発展した。1544年には大学が創設され、後の哲学者イマヌエル・カントの出身地ともなる。プレーゲル川の河口に位置するこの都市はバルト海交易の重要な拠点であり、騎士団国家の事実上の首都機能を果たしてきた。都市基盤を整備し、大聖堂と市場を充実させ、北欧・東欧交易の中継地として繁栄させよ——プロイセンの心臓を強くすることが国力の源となる。"
 teu_danzig_port: "ダンツィヒ港の整備"
 teu_danzig_port_desc: "ダンツィヒ（グダニスク）——ヴィスワ川の河口に位置するこの都市はバルト海最大の港湾都市だ。1308年、ドイツ騎士団はポーランドとの協力関係からダンツィヒを「奪取」し、以来バルト海交易の要衝として繁栄させてきた。しかし1466年の第二次トルン条約でポーランドに割譲されたこの都市をポーランドは「王領プロイセン」の中心として重視している。ダンツィヒを取り戻しハンザ同盟との交易ネットワークに組み込んでバルト海穀物交易の利益を最大化せよ——「バルト海の女王」と呼ばれるこの都市こそが騎士団の財政的生命線だ。"
 teu_teutonic_law: "ドイツ騎士団法典"
 teu_teutonic_law_desc: "1230年代のクルム法（クルマー・ハンドフェステ）——ドイツ騎士団が植民都市に与えた最初の法典。これに続いてプロイセン法の体系が整備され後のドイツ東方植民地における法的基盤となった。1489年の大司教令、1529年のプロイセン法典——法整備こそが騎士団国家を「野蛮な征服者」から「文明の担い手」へと変貌させる手段だ。行政の効率化、農民の権利保護、商業法の整備——これらを通じてプロイセンを法治国家として確立せよ。"
 teu_amber_trade: "琥珀交易の掌握"
 teu_amber_trade_desc: "バルト海の金——琥珀。古代から「北の黄金」と呼ばれてきたこの宝石はバルト海沿岸でのみ産出され地中海世界まで運ばれた。ドイツ騎士団はプロイセン征服後、琥珀の独占権を握り密輸業者は死刑に処された。「琥珀独占」はドイツ騎士団の最重要財源の一つだ。バルト海沿岸の琥珀産地を完全に支配し、中央ヨーロッパへの交易路を掌握して騎士団国家の財政基盤を確立せよ——剣だけでなく、琥珀の富もまた騎士団の力の源だ。"
 teu_hanseatic_ties: "ハンザ同盟との連携"
 teu_hanseatic_ties_desc: "ハンザ同盟——リューベックを盟主とするこのドイツ商人都市の連合はバルト海・北海の交易を支配する経済的帝国だ。ダンツィヒ、リガ、リヴァル（タリン）——これらの都市はすべてハンザ同盟の主要拠点であり、ドイツ騎士団の支配地域と重なる。ハンザの商人たちはプロイセンの穀物・木材・琥珀を西ヨーロッパに運び、見返りに布・ワイン・塩をもたらした。ハンザ同盟との緊密な関係を構築しバルト海交易ネットワークの実質的な支配者となれ——剣と商業の両輪でドイツ騎士団の繁栄を確実にせよ。"
 teu_colonize_prussia: "プロイセン植民"
 teu_colonize_prussia_desc: "東方植民（オストジードルング）——11世紀から14世紀にかけてドイツ人がエルベ川以東に移住・植民した歴史的大移動。ドイツ騎士団はこの動きの最先端に立ち、征服したプロイセンの地にドイツ人農民・手工業者・商人を誘致した。原住民族プロイセン人の消滅と引き換えに、この地は「ドイツ東方の辺境」として植民地化された。計画的な都市建設、農業開発、道路整備——これらが「野蛮な地」をヨーロッパ文明圏に組み込む手段だ。プロイセン植民を完成させこの地を完全なるドイツの土地として確立せよ。"
 teu_torun_city: "トルン（トルニ）の整備"
 teu_torun_city_desc: "トルン（トルニ／現トルン）——ヴィスワ川沿いに建設されたこの都市は1231年のドイツ騎士団進出の最初の拠点だ。1454年と1466年の「トルン条約」でポーランドとの関係が規定され、第一次トルン条約では和平が、第二次トルン条約ではドイツ騎士団の屈辱的な領土割譲が定められた。また1473年にはコペルニクスがここで生まれた——地動説を唱えた天文学者の故郷だ。騎士団の歴史の始まりの地であるトルンを整備しヴィスワ川交易の中心地として再建せよ。"
 teu_memel_fortress: "メーメル要塞の整備"
 teu_memel_fortress_desc: "メーメル（クライペダ）——リトアニア・プロイセン国境のネマン川河口に位置するこの要塞都市は、ドイツ騎士団がリトアニアに対する防衛線の最前線として建設した。1252年に創建されたメーメル城はリトアニアとの無数の戦闘を経験してきた。この城が落ちればプロイセンへの門戸が開かれる——逆に言えばメーメルを堅固に保つことがリトアニアの侵入を防ぐ鍵だ。バルト海への玄関口でもあるこの都市を要塞として整備し、琥珀交易の内陸拠点として機能させよ。"
 teu_grand_master: "大団長の覇権"
 teu_grand_master_desc: "大団長（ホーホマイスター）——ドイツ騎士団の最高指導者。キリストの代理人として、騎士修道士を率いてバルト海から東欧全土に及ぶ十字軍帝国を統治する。ヘルマン・フォン・ザルツァ（1209-1239）がフリードリヒ2世との外交で騎士団の政治的基盤を確立し、ウィンリッヒ・フォン・クニプローデ（1351-1382）の治世が騎士団の黄金時代だった。今やすべての敵が征服され北方十字軍が完成した——大団長の権威はバルト海から正教会の地まで及ぶ。歴史に名を刻む大団長として、神の意志を東方の果てまで実現せよ。"
 teu_prussian_king: "プロイセン王の宣言"
 teu_prussian_king_desc: "プロイセン王——1701年1月18日、フリードリヒ3世はケーニヒスベルクで自らプロイセン王「フリードリヒ1世」として戴冠した。神聖ローマ帝国皇帝の管轄外であるプロイセン（旧ドイツ騎士団の地）で戴冠することで、ハプスブルク家の承認なしに王位を得るという巧妙な手段だ。「フリードリヒ大王」フリードリヒ2世はシレジアを奪取し七年戦争を勝ち抜きプロイセンをヨーロッパの大国に押し上げた。「プロイセンは国家の中の軍隊ではなく、軍隊の中の国家だ」——この国家哲学のもとで、近代ドイツの礎を今ここで作れ。"
 teu_events.10.t: "騎士団の未来——十字軍か世俗化か"
 teu_events.10.d: "リトアニアとポーランドを制圧した今、ドイツ騎士団は歴史的な選択に直面している。十字軍の旗のもと東方の異教徒・正教徒を打倒し続けるか、それとも世俗的な君主国として近代化しプロイセン王国へと変容するか。"
 teu_events.10.a: "十字軍の道——東方の異教徒・正教徒を討伐し北方十字軍を完成させよ"
 teu_events.10.b: "世俗化の道——プロイセン公国として近代ドイツの礎を築け"
 teu_events.50.t: "北方十字軍の完成"
 teu_events.50.d: "「神の意志だ」——バルト海からルーシの果てまで、ドイツ騎士団の十字軍が完成した。北の地に十字架が輝く。"
 teu_events.50.a: "十字軍万歳！大団長の覇権が確立された！"
 teu_constantinople_fall: "コンスタンティノープル陥落"
 teu_constantinople_fall_desc: "北方十字軍を完成させた今、ドイツ騎士団の眼差しは南方へと向けられる。かつてキリスト教世界の東の砦であったコンスタンティノープルは、異端と異教徒の手に落ちて久しい。この古き帝都を奪還し、真の信仰の旗を再び金角湾に翻せ。聖地エルサレムへの道は、まずこの都市の解放から始まる。"
 teu_jerusalem_reclaimed: "エルサレム奪還"
 teu_jerusalem_reclaimed_desc: "コンスタンティノープルを奪還した今、十字軍の最終目標はただ一つ——聖地エルサレムそのものだ。幾多の十字軍が挑み、幾多の十字軍が散っていったこの地に、ドイツ騎士団の黒十字が翻る時が来た。聖墳墓教会に祈りを捧げ、キリスト教世界の悲願を成し遂げよ。"
 teu_events.55.t: "コンスタンティノープル、我らのものに"
 teu_events.55.d: "北方十字軍を完成させたドイツ騎士団は、その矛先を南へと転じた。かつてビザンツ帝国の栄光の象徴であったコンスタンティノープルは、今や異端と異教徒に蹂躙された廃墟同然の姿と成り果てていた。だが騎士団の軍勢はこの都市を解放し、聖ソフィア大聖堂に十字架を掲げ直した。次なる目標は明らかだ——聖地エルサレムを、我らの手に取り戻す。"
 teu_events.55.a: "聖地への道は開かれた——エルサレムを目指せ！"
 teu_events.56.t: "エルサレム、解放さる"
 teu_events.56.d: "幾世紀にもわたり十字軍たちが夢見て、そして幾度となく潰えてきた悲願——聖地エルサレムの奪還が、ついに成し遂げられた。ドイツ騎士団の軍旗が聖墳墓教会にはためく時、全キリスト教世界がこの勝利に歓喜する。大団長の名は、歴代の十字軍指導者たちと並び、永遠に語り継がれるだろう。統治者の武勇と威光は、この聖なる勝利によって不滅のものとなった。"
 teu_events.56.a: "神は我らと共にあり！聖地は解放された！"
 teu_events.60.t: "北ドイツ連邦の宣言"
 teu_events.60.d: "プロイセンからポメラニア、ブランデンブルクまで——北ドイツ全土がプロイセンの旗のもとに統一された。近代ドイツ国家の夜明けだ。"
 teu_events.60.a: "プロイセン万歳！北ドイツ連邦よ永遠に！"
 teu_events.99.t: "騎士団の最終目標"
 teu_events.99.d: "ドイツ騎士団の使命が完成した——バルト海を支配する大帝国として歴史に名を刻む。"
 teu_events.99.a: "ドイツ騎士団よ永遠に！"
 STATIC_MODIFIER_NAME_teu_amber_mod: "琥珀交易の独占"
 STATIC_MODIFIER_DESC_teu_amber_mod: "バルト海の黄金、琥珀の独占交易がドイツ騎士団の財政を潤す。"
 STATIC_MODIFIER_NAME_teu_christian_mod: "プロイセンのキリスト教化"
 STATIC_MODIFIER_DESC_teu_christian_mod: "カトリック信仰がプロイセン全土に根付き宗教的権威が確立された。"
 STATIC_MODIFIER_NAME_teu_colonize_mod: "プロイセン植民の促進"
 STATIC_MODIFIER_DESC_teu_colonize_mod: "エルベ川の東から荷馬車を連ねて来た入植者たちが、プロイセンの荒れ地に新たな村々を築いている。"
 STATIC_MODIFIER_NAME_teu_danzig_mod: "ダンツィヒ港の繁栄"
 STATIC_MODIFIER_DESC_teu_danzig_mod: "「バルト海の女王」ダンツィヒが騎士団の海上交易の要として整備された。"
 STATIC_MODIFIER_NAME_teu_duchy_mod: "プロイセン公国の確立"
 STATIC_MODIFIER_DESC_teu_duchy_mod: "世俗化されたプロイセン公国が近代的行政国家として整備された。"
 STATIC_MODIFIER_NAME_teu_east_crusade_mod: "東方十字軍"
 STATIC_MODIFIER_DESC_teu_east_crusade_mod: "異教の地へ向かう遠征のたびに、騎士修道士たちは白いマントに黒い十字を縫いつけ、聖戦の誓いを新たにする。"
 STATIC_MODIFIER_NAME_teu_hanseatic_mod: "ハンザ同盟との連携"
 STATIC_MODIFIER_DESC_teu_hanseatic_mod: "ダンツィヒやトルンの港には、ハンザの商船が琥珀と穀物を求めて絶え間なく錨を下ろしている。"
 STATIC_MODIFIER_NAME_teu_hre_mod: "HRE覇権"
 STATIC_MODIFIER_DESC_teu_hre_mod: "プロイセンが神聖ローマ帝国の中枢勢力として台頭した。"
 STATIC_MODIFIER_NAME_teu_konigsberg_mod: "ケーニヒスベルクの繁栄"
 STATIC_MODIFIER_DESC_teu_konigsberg_mod: "プロイセンの心臓部ケーニヒスベルクが交易と学問の都として栄える。"
 STATIC_MODIFIER_NAME_teu_law_mod: "ドイツ騎士団法典"
 STATIC_MODIFIER_DESC_teu_law_mod: "ハルムの法に基づく騎士団の法典は、都市も農村も同じ秤で裁かれるという評判を得ている。"
 STATIC_MODIFIER_NAME_teu_legacy_mod: "ドイツ騎士団の遺産"
 STATIC_MODIFIER_DESC_teu_legacy_mod: "マリーエンブルクの大広間に掲げられた歴代総長の肖像は、騎士団の伝統を新たな領土の隅々にまで及ぼしている。"
 STATIC_MODIFIER_NAME_teu_lithuania_mod: "リトアニア制圧"
 STATIC_MODIFIER_DESC_teu_lithuania_mod: "サモギティアの森に築かれた城砦の列が、リトアニア大公の軍勢に対する防壁となっている。"
 STATIC_MODIFIER_NAME_teu_livonia_mod: "リヴォニア掌握"
 STATIC_MODIFIER_DESC_teu_livonia_mod: "リヴォニア騎士団との連携でバルト海東岸の支配が確立された。"
 STATIC_MODIFIER_NAME_teu_malbork_mod: "マルボルク要塞の整備"
 STATIC_MODIFIER_DESC_teu_malbork_mod: "マルボルクが難攻不落の要塞として整備され騎士団の守護の要となった。"
 STATIC_MODIFIER_NAME_teu_memel_mod: "メーメル要塞の整備"
 STATIC_MODIFIER_DESC_teu_memel_mod: "メーメルが要塞港湾都市として整備されリトアニアへの備えが万全になった。"
 STATIC_MODIFIER_NAME_teu_orthodox_march_mod: "正教会への進軍"
 STATIC_MODIFIER_DESC_teu_orthodox_march_mod: "正教の諸侯との幾度もの戦いを経て、騎士団の兵たちは東方の国境戦争の勝手を心得ている。"
 STATIC_MODIFIER_NAME_teu_poland_mod: "ポーランド制圧"
 STATIC_MODIFIER_DESC_teu_poland_mod: "グルンヴァルトの敗北で失われた誇りは、いまや報復の勝利によって取り戻された。"
 STATIC_MODIFIER_NAME_teu_pomerania_mod: "ポメラニア制圧"
 STATIC_MODIFIER_DESC_teu_pomerania_mod: "ポメラニアの港を押さえ、バルト海沿岸のどの町も騎士団の旗に敬意を払わずにはいられない。"
 STATIC_MODIFIER_NAME_teu_protestant_mod: "プロテスタント宗教改革"
 STATIC_MODIFIER_DESC_teu_protestant_mod: "ルターの教えを受け入れたプロイセンでは、ケーニヒスベルクの学寮に各地から学徒が集まっている。"
 STATIC_MODIFIER_NAME_teu_prussia_mod: "プロイセン制圧の秩序"
 STATIC_MODIFIER_DESC_teu_prussia_mod: "プロイセン全域の完全制圧により反乱の芽が摘み取られた。"
 STATIC_MODIFIER_NAME_teu_prussian_kingdom_mod: "プロイセン王国"
 STATIC_MODIFIER_DESC_teu_prussian_kingdom_mod: "近代プロイセン王国が北ドイツの覇者として確立された。"
 STATIC_MODIFIER_NAME_teu_constantinople_reclaimed_mod: "コンスタンティノープル奪還"
 STATIC_MODIFIER_DESC_teu_constantinople_reclaimed_mod: "コンスタンティノープルの大聖堂に再び十字架が掲げられ、その光は東方全土に届いている。"
 STATIC_MODIFIER_NAME_teu_jerusalem_ruler_mod: "エルサレム奪還者"
 STATIC_MODIFIER_DESC_teu_jerusalem_ruler_mod: "聖墳墓の前に跪いた総長は、生ける聖者のように民から敬われ、その名は軍勢を導く旗印となっている。"
 STATIC_MODIFIER_NAME_teu_riga_mod: "リガ十字軍拠点"
 STATIC_MODIFIER_DESC_teu_riga_mod: "リガがバルト海東岸の商業・軍事・十字軍の中心地として整備された。"
 STATIC_MODIFIER_NAME_teu_secular_start_mod: "世俗化への第一歩"
 STATIC_MODIFIER_DESC_teu_secular_start_mod: "総長が公爵の冠を戴いた日から、プロイセンの議場には近代国家へと向かう新しい空気が流れている。"
 STATIC_MODIFIER_NAME_teu_torun_mod: "トルンの繁栄"
 STATIC_MODIFIER_DESC_teu_torun_mod: "コペルニクスの故郷トルンがヴィスワ川交易の中心地として栄える。"
 teu_mazovia_subjugation: "マゾフシェ（マゾヴィア）の制圧"
 teu_mazovia_subjugation_desc: "マゾフシェ（マゾヴィア）——ヴィスワ川中流域に広がるポーランドの核心地帯。後にワルシャワが建設されるこの地はポーランド王国の東方への出口であり、プロイセンへの主要侵入路でもある。マゾフシェ公国はポーランド王家のピャスト朝の支流が支配してきたが、1526年の当主絶家でポーランド王国に統合された。この土地を掌握することで南方からの脅威を排除しプロイセンの安全保障を確立できる。ヴィスワ川流域の豊かな農業地帯をドイツ騎士団の穀倉地帯として活用せよ。"
 teu_narva_fortress: "ナルヴァ要塞"
 teu_narva_fortress_desc: "ナルヴァ——エストニア北岸のナルヴァ川に面するこの要塞都市はリヴォニアとロシアの国境を画する戦略的要衝だ。対岸にはロシアのイヴァンゴロド城塞がそびえ立ち、まさに文明の衝突点となっている。1346年にデンマークからドイツ騎士団に売却されたエストニアの北端に位置するナルヴァは東方への十字軍における前進基地として機能する。1558年にはイヴァン雷帝のロシア軍に一時占領される運命を持つが、今ここでその運命を変えよ——ナルヴァを難攻不落の要塞として整備し、正教会ロシアへの圧力をかけ続けよ。"
 teu_berlin_dev: "ベルリンの発展"
 teu_berlin_dev_desc: "ベルリン——シュプレー川とハーフェル川の合流地点に建つこの小都市は13世紀にブランデンブルク辺境伯によって建設された双子都市（ベルリン＋ケルン）だ。今はまだホーエンツォレルン家ブランデンブルク選帝侯の小さな拠点に過ぎないがプロイセンがブランデンブルクと統合されれば、この地はやがて帝国の首都となる運命を持つ。1618年の「ブランデンブルク＝プロイセン」同君連合の結成、そして1701年のプロイセン王国成立によってベルリンは北ドイツの心臓部となった。今その礎を築け——ベルリンを整備することで北ドイツ統合の象徴となる都市が誕生する。"
 teu_junker_system: "ユンカー制度の確立"
 teu_junker_system_desc: "ユンカー——「若い主」を意味するこのドイツ語は、プロイセンの武装地主貴族階級を指す。エルベ川以東の大農場（グーツヘルシャフト）を所有するユンカーは農奴制を活用して穀物を生産しバルト海経由で西ヨーロッパに輸出した。しかし彼らの真の役割は軍事にある——プロイセン軍の将校団の大半をユンカー出身者が占め「プロイセン＝軍隊国家」の根幹をなした。フリードリヒ・ヴィルヘルム1世（兵隊王）はユンカーを強制的に士官学校に送り込み軍事的義務を制度化した。このユンカー制度を今から確立することで後世に続く「プロイセン軍事文化」の礎を築け。"
 teu_silesia_claim: "シレジア（シュレジエン）の制圧"
 teu_silesia_claim_desc: "シレジア（シュレジエン）——オーデル川上流域に広がるこの地は豊富な石炭・鉄鉱石・亜鉛を産する中欧最大の工業地帯の潜在力を秘めている。かつてはポーランドのピャスト朝の領地だったが1335年以降ボヘミア王国に属し、1526年のハプスブルク家のボヘミア継承でオーストリアの一部となった。しかし1740年、フリードリヒ大王はオーストリア継承戦争の開始直後に電撃的なシレジア侵攻を行い、この豊かな地を「力ずく」で奪取した。プロイセンはシレジアを今すぐ手に入れよ——この地の工業力がプロイセン帝国の経済基盤となる。"
 teu_cathedral_network: "聖堂ネットワーク"
 teu_cathedral_network_desc: "プロイセン全土の聖堂ネットワーク——ドイツ騎士団は征服した土地に必ず教会を建設した。ケーニヒスベルク大聖堂、マルボルクの城内礼拝堂、トルンのヨハネ教会——これらはカトリックの信仰を異教の地に根付かせる手段だった。教区制度の整備、司教区の設立、修道院の建設——これらが「野蛮な地」をキリスト教文明圏に組み込む制度的手段だ。聖堂は神への奉仕であるとともに植民地支配の象徴でもある。プロイセン全土に聖堂ネットワークを確立しドイツ騎士団の宗教的権威と統治正統性を強化せよ。"
 teu_elbing_dev: "エルビング（エルブロンク）の整備"
 teu_elbing_dev_desc: "エルビング（エルブロンク）——ヴィスワ川デルタの東端に位置するこの都市は1237年に創設された。ダンツィヒと並ぶプロイセン最重要の港湾都市であり、ハンザ同盟の重要加盟都市でもある。内陸水路でケーニヒスベルクとつながり農産物・木材・琥珀の輸出港として繁栄した。第二次トルン条約（1466年）でダンツィヒ同様ポーランド支配下に入ったが、プロイセンにとってヴィスワ川デルタの完全支配は海への出口として不可欠だ。エルビングを整備しダンツィヒと並ぶバルト海の二大港湾都市体制を確立せよ。"
 STATIC_MODIFIER_NAME_teu_mazovia_mod: "マゾフシェ制圧"
 STATIC_MODIFIER_DESC_teu_mazovia_mod: "マゾフシェが征服され南方国境が確保された。"
 STATIC_MODIFIER_NAME_teu_narva_mod: "ナルヴァ要塞"
 STATIC_MODIFIER_DESC_teu_narva_mod: "ナルヴァが東方の難攻不落の要塞として整備された。"
 STATIC_MODIFIER_NAME_teu_berlin_mod: "ベルリンの発展"
 STATIC_MODIFIER_DESC_teu_berlin_mod: "ベルリンがプロイセンの首都として整備された。"
 STATIC_MODIFIER_NAME_teu_junker_mod: "ユンカー制度"
 STATIC_MODIFIER_DESC_teu_junker_mod: "エルベ東岸の領地に根を張ったユンカーたちが、将校としても役人としても王国を支えている。"
 STATIC_MODIFIER_NAME_teu_silesia_mod: "シレジア制圧"
 STATIC_MODIFIER_DESC_teu_silesia_mod: "シュレージエンの織物と鉱山が、プロイセンの財政に新たな脈動をもたらしている。"
 STATIC_MODIFIER_NAME_teu_cathedral_mod: "聖堂ネットワーク"
 STATIC_MODIFIER_DESC_teu_cathedral_mod: "プロイセン全土に聖堂が建設されカトリック信仰が根付いた。"
 STATIC_MODIFIER_NAME_teu_elbing_mod: "エルビング港の繁栄"
 STATIC_MODIFIER_DESC_teu_elbing_mod: "エルビングがバルト海の主要港湾都市として整備された。"
 teu_mongol_empire: "モンゴルの牙城、陥落す"
 teu_mongol_empire_desc: "サライ、カザン、サマルカンド、カッファ、大都、カラコルム——かつて世界を震撼させたモンゴル帝国の中枢都市が、次々と黒十字の旗の下に屈した。1206年にチンギス・ハンが打ち立てた「大モンゴル国」は13世紀末に分裂し、もはやかつての栄光はない。その残された版図に、ドイツ騎士団の鉄の軍勢が東から西から攻め込み、草原の覇者を組み伏せた。東は太平洋から西はバルト海まで——モンゴルの遺産はことごとく十字の帝国に接収される。"
 teu_sacred_nomads: "大ハーンの座、簒奪さる"
 teu_sacred_nomads_desc: "モンゴル帝国の全土を征服した今、大団長は草原の民が畏怖する称号——「ハーン」を戦利品として自らのものとする。これは融合でも共存でもない、征服者が敗者の玉座に座る、ただそれだけのことだ。十字架を掲げた重装騎兵が、かつて世界最強と謳われた騎馬軍団の主となった。神の意志のもとに東西の帝国を統一せよ——これがドイツ騎士団の最終的な勝利である。"
 teu_events.70.t: "モンゴルの都、我らの手に"
 teu_events.70.d: "サライ、カザン、サマルカンド、カッファ、大都、カラコルム——モンゴル帝国のすべての首都が陥落した。大団長は今日より「ドイツ大ハーン」を名乗るが、それはモンゴルの血や文化を継ぐ者としてではない。征服者が敗者の称号を奪い、自らの権威の証とするに過ぎない。パクス・デウス——神の平和が、かつての草原の覇権に取って代わる。"
 teu_events.70.a: "モンゴルの版図は、今や我らのものだ！"
 teu_events.80.t: "鉄十字、世界に君臨す"
 teu_events.80.d: "モンゴル帝国征服の総仕上げとして、ドイツ騎士団は東西の帝国を完全に自らの支配下に置いた。草原の民は服従し、十字架の権威のもとに新たな秩序が敷かれる。これは融合ではなく、純然たる征服の完成——騎士団は騎士団のまま、世界最大の帝国の主となったのだ。"
 teu_events.80.a: "神の意志のもとに、世界は我らのものだ！"
 STATIC_MODIFIER_NAME_teu_mongol_empire_mod: "モンゴル征服"
 STATIC_MODIFIER_DESC_teu_mongol_empire_mod: "モンゴル帝国の軍事機構を接収し、草原の騎馬戦力がドイツ騎士団の指揮下に入った。"
 STATIC_MODIFIER_NAME_teu_sacred_nomads_mod: "大ハーンの玉座"
 STATIC_MODIFIER_DESC_teu_sacred_nomads_mod: "かつての世界帝国の主として君臨する——モンゴルはドイツ騎士団に完全に征服された。"
 teu_great_khan_name: "ドイツ大ハーン国"
 teu_events.11.t: "北方十字軍の誓い"
 teu_events.11.d: "東方への扉が開かれた——リトアニアとポーランドの制圧を経て、ドイツ騎士団は歴史的な決断を下す時が来た。大団長の権威のもとに全騎士が誓いを立てる——「神の意志のもとに東方の異教徒・正教徒を討伐し、北方十字軍を完成させる」と。この誓いがドイツ騎士団国家の統治原理となり、正統性の高さが規律と秩序に直結するようになった。"
 teu_events.11.a: "我々は誓う——神の意志のもとに北方十字軍を完成させよ！"
 teu_steppe_crusade: "ステップの十字軍"
 teu_steppe_crusade_desc: "ポンティック・ステップ——かつてモンゴル帝国の心臓部、タタール人が支配する果てしない草原。ドイツ騎士団の重装騎兵とモンゴル式軽騎兵が融合した今、この草原を征服して東欧全土の覇権を確立せよ。ステップを制する者が東欧を制する——その真理をドイツ騎士団の力で証明せよ。"
 STATIC_MODIFIER_NAME_teu_steppe_crusade_mod: "ステップの十字軍"
 STATIC_MODIFIER_DESC_teu_steppe_crusade_mod: "ステップの風を切る騎士修道士たちの騎馬隊は、遊牧の民の戦い方さえ我がものにしている。"
 STATIC_MODIFIER_NAME_teu_crusade_loot_mod: "十字軍の略奪"
 STATIC_MODIFIER_DESC_teu_crusade_loot_mod: "聖戦の略奪で土地は疲弊し、畑は荒れ、空き家の並ぶ村々で人々は良き日を待ちわびている。"
