l_japanese:
 pol_jagiellonian_dynasty_mission_pack: "ヤギェウォ朝の栄光"
 pol_jagiellonian_dynasty_mission_pack_DESCRIPTION:0 "1337年、ポーランド王国はカジミェシュ3世（大王）の統治下にある。後継者なきカジミェシュの後にはアンジュー家のラヨシュ1世（ハンガリー王）がポーランド王位を継承し、その娘ヤドヴィガがリトアニア大公ヤギェウォと結婚することでポーランド・リトアニア同君連合が誕生する。ドイツ騎士団との北方対立・ハンガリーとの同君連合・リトアニアとの東方拡大・ボヘミアへの野望——全てを実現し、中東欧最大の貴族共和国を建設せよ。"
 pol_jagiellonian_dynasty_mission_pack_CRITERIA_DESCRIPTION:0 "ポーランドとして、内政・東方・北方・南方・西方の全方面で拡大し、ポーランド黄金時代を実現せよ。"
 pol_jagiellonian_dynasty_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してポーランドの黄金時代を実現せよ。"
 pol_jagiellonian_dynasty_mission_pack_BUTTON_DETAILS:0 "カジミェシュ大王からヤギェウォ朝黄金時代へ——貴族の共和国を建設せよ！"

 pol_kingdom_of_poland: "ポーランド王国の基盤"
 pol_kingdom_of_poland_desc: "カジミェシュ3世（大王）は1333年に即位し、ポーランドを分裂状態から統一した。「瓦礫のポーランドを受け取り、石造りのポーランドを残した」と称されるこの王は、クラクフを中心に法典整備・都市建設・ユダヤ人保護政策を推進した。彼の治世はポーランド中世史上最高の繁栄期とされる。正統性と安定度を高め、王国の基盤を固めよ。"

 pol_integrate_mazovia: "マゾフシェの統合"
 pol_integrate_mazovia_desc: "マゾフシェ（マゾヴィア）公国はピャスト家の傍系が統治するポーランド中心部の公国だ。ワルシャワとルブリンを掌握し、この肥沃な低地平原をポーランド王国に完全統合することで、中部ポーランドの政治的中心が確立される。1526年に歴史的に統合されるこの地を早期に確保せよ。"

 pol_great_sejm: "大セイム（議会）"
 pol_great_sejm_desc: "ポーランドのセイム（議会）は13世紀から発展してきた身分制議会だ。大貴族（マグナート）・小貴族（シュラフタ）・聖職者が参集するこの議会は、15〜16世紀に黄金の自由（ズロタ・ヴォルノシッチ）の概念を確立し、ポーランドを貴族共和国に変えていく。セイムを強化して王権と貴族権のバランスを整えよ。"

 pol_krakow_renaissance: "クラクフのルネサンス"
 pol_krakow_renaissance_desc: "クラクフはポーランド王国の首都であり、ヤギェウォ大学（ユニヴェルシテット・ヤギェロンスキ）はコペルニクスを輩出した中東欧最高の学府だ。イタリアのルネサンスがクラクフにも波及し、ヴァヴェル城がルネサンス様式で改築された。大学を整備してクラクフを中東欧の知的中心地に育てよ。"

 pol_jagiellonian_university: "ヤギェウォ大学の隆盛"
 pol_jagiellonian_university_desc: "1364年にカジミェシュ3世が創設し、1400年にヤドヴィガ女王が復興したヤギェウォ大学は、ニコラウス・コペルニクス（1473〜1543）・ヴィトルト・ルトスワフスキなど多くの偉人を育てた。5か所以上に大学を展開することで、ポーランド全土に学問の光が広まる。"

 pol_polish_golden_age: "ポーランドの黄金時代"
 pol_polish_golden_age_desc: "15〜16世紀のポーランドはヤギェウォ朝のもとで「黄金時代（Złoty Wiek）」を迎えた。コペルニクスの地動説・コハノフスキの詩・クラクフの芸術——ポーランドは政治的大国であるとともに文化的先進国となった。広大な版図・豊かな収入・高い威信でこの黄金時代を証明せよ。"

 pol_jadwiga_union: "ヤドヴィガとヤギェウォの婚姻"
 pol_jadwiga_union_desc: "1385年のクレヴォ合意によりポーランド女王ヤドヴィガとリトアニア大公ヤギェウォ（ヴワディスワフ2世ヤギェウォ）の婚姻が決まった。ヤギェウォはキリスト教に改宗し、リトアニアをカトリック化することと引き換えにポーランド王の称号を得た。この婚姻はポーランド・リトアニア連合国家の始まりであり、以後200年以上続くヤギェウォ朝時代の幕開けだ。"

 pol_develop_ruthenia: "ルテニアの開発"

 pol_control_kyiv: "キエフの支配"
 pol_control_kyiv_desc: "キエフ（キーウ）はかつてキエフ・ルーシの首都であり、スラヴ文明発祥の地だ。モンゴル帝国による1240年の破壊後、この都市はリトアニア支配下に置かれていた。キエフを掌握することでドニエプル川流域全体の支配権が確立し、黒海への道が開かれる。"

 pol_push_east: "東方への前進"
 pol_push_east_desc: "ミンスクはリトアニアの心臓部、スモレンスクは東スラヴ世界の重要な要衝だ。モスクワ大公国が台頭しつつある中、これらの都市を確保することでポーランド・リトアニア連合が東スラヴ世界の覇者として君臨できる。イワン3世がスモレンスクを巡り戦った歴史的な争いが、今度はポーランドに有利な形で展開される。"

 pol_eastern_empire: "東方帝国"
 pol_eastern_empire_desc: "ポーランド・リトアニア連合は最盛期（1618年頃）にヨーロッパ最大の国家となった。バルト海からポントゥス・エクシヌス（黒海）まで、東スラヴ世界全体がポーランドの旗の下に統一される。ロシア・オスマン・ハプスブルクが等しく恐れる東方の大帝国を建設せよ。"

 pol_prussian_confederation: "プロイセン連合とドイツ騎士団"
 pol_prussian_confederation_desc: "ドイツ騎士団（チュートン騎士団）は13世紀にバルト海沿岸に築いた異教徒征服の拠点から、今やポーランドの宿敵となっている。1410年のグルンヴァルドの戦いでポーランド・リトアニア連合軍が騎士団を大敗させた。プロイセン連合（ポーランドに帰順を求めたプロイセン市民の団体）の支援を得てドイツ騎士団を制圧し、バルト海への出口を確保せよ。"

 pol_gdansk_port: "グダニスクの港"
 pol_gdansk_port_desc: "グダニスク（ダンツィヒ）は「ポーランドの門」と呼ばれるバルト海最重要の港市だ。ヴィスワ川の河口に位置するこの都市はハンザ同盟の主要拠点であり、ポーランドの穀物輸出の要衝。1466年のトルン条約でポーランドが獲得したグダニスクは、その後200年にわたってポーランド経済の心臓部として機能した。"


 pol_livonian_expansion: "リヴォニアへの拡大"
 pol_livonian_expansion_desc: "リヴォニア（現在のラトビアとエストニア）はかつてリヴォニア騎士団が支配したが、16世紀にはロシア・スウェーデン・デンマーク・ポーランドが争う舞台となった。リガとタリン（レヴァル）を掌握することでバルト海全域の制海権がポーランドのものとなる。"

 pol_master_of_the_north: "北方の覇者"
 pol_master_of_the_north_desc: "ケーニヒスベルク（現カリーニングラード）はかつてドイツ騎士団の本拠地、今やポーランドの支配下にある。強大な艦隊とともにバルト海全域を掌握したポーランドは、スカンジナビア・ハンザ・オランダとの交易を一手に握る北方の覇者となった。"

 pol_hungarian_union: "ハンガリーとの同君連合"
 pol_hungarian_union_desc: "1370年、カジミェシュ3世が後継者なく崩御すると、甥のアンジュー家ラヨシュ1世（ハンガリー王ラヨシュ大王）がポーランド王位を兼任した。これがポーランド・ハンガリー同君連合の始まりだ。二つの大王国が一人の王の下に統一されることで、中東欧の力の均衡が根本的に変わる。"

 pol_moldavia_vassal: "モルダヴィアの従属"
 pol_moldavia_vassal_desc: "モルダヴィア（モルドヴァ）公国はポーランド・ハンガリー・オスマンが影響力を争う緩衝国だ。シュテファン大公（1457〜1504年）はポーランドに宗主権を認めながらも事実上の独立を保った。この戦略的公国を確実にポーランドの傘下に置き、黒海への扉を押さえよ。"

 pol_wallachia_control: "ワラキアの支配"
 pol_wallachia_control_desc: "ワラキア（ハーヴァシェルフォルド）はドナウ川北岸の公国で、オスマン帝国への防衛の最前線だ。ヴラド2世（「串刺し公」の父）はドラゴン騎士団員としてハンガリーに仕えた。ワラキアをポーランド・ハンガリー連合の傘下に置くことで、バルカン半島への影響力が確立される。"

 pol_battle_of_grunwald: "グルンヴァルドの精神"
 pol_battle_of_grunwald_desc: "1410年7月15日、グルンヴァルドの野でポーランド・リトアニア連合軍はドイツ騎士団を完膚なきまでに打ち破った。騎士団総長ウルリヒ・フォン・ユンギンゲンが戦場で倒れ、ポーランドは「キリスト教世界の守護者」としての名声を不動のものにした。今またイスラム教国家との戦争でその精神を証明せよ。"

 pol_shield_of_christendom: "キリスト教世界の盾"
 pol_shield_of_christendom_desc: "ポーランドはヤドヴィガのキリスト教化政策以来、東欧カトリック世界の最前線に立ち続けてきた。オスマン帝国をついに駆逐した今、教皇もヴェネツィアもハプスブルクも、ポーランドこそが「キリスト教世界の真の盾（アンテムラーレ・クリスティアニタティス）」であると認める。"

 pol_silesia_integration: "シレジアの統合"
 pol_silesia_integration_desc: "シレジア（シロンスク）はピャスト朝ポーランドの発祥の地だが、14世紀にはボヘミア・ハプスブルクの支配下に移った。ヴロツワフ（ブレスラウ）を中心とするこの豊かな工業・商業地帯を取り戻すことは、ポーランドにとって民族的・経済的に最も重要な課題の一つだ。"

 pol_bohemian_claim: "ボヘミア王冠の掌握"
 pol_bohemian_claim_desc: "ヤギェウォ家はボヘミア・ハンガリー王位の継承権を持つ。ヴラディスラフ2世（ヤギェウォ）は1471年にボヘミア王、1490年にハンガリー王も兼任した。プラハのボヘミア王冠を掌握することで、ポーランド・ボヘミア・ハンガリー三重王国が実現する。"

 pol_hre_influence: "神聖ローマ帝国への影響力"
 pol_hre_influence_desc: "ボヘミア王を兼任するポーランド王は神聖ローマ帝国の選帝侯となりえる。ハプスブルクとの外交的均衡を図りながら、ドイツ諸侯への影響力を拡大することで、ポーランドは中欧の政治の中心となる。"

 pol_central_european_power: "中欧の大国"
 pol_central_european_power_desc: "ポーランド・リトアニア・ボヘミア・ハンガリーを含む広大な版図と豊かな収入——ポーランドは中欧最大の大国として台頭した。神聖ローマ帝国・オスマン帝国・モスクワ大公国の三大勢力に囲まれながらも、ポーランドは独自の輝きを放ち続ける。"

 pol_grand_commonwealth: "大コモンウェルス"
 pol_grand_commonwealth_desc: "ポーランド・リトアニア・ボヘミア・ハンガリーを統合した「コモンウェルス」——貴族の自由と王権が調和した独自の政治体制を持つこの国家は、16〜17世紀に「諸国民の共和国（レーチュ・ポスポリタ）」として知られた。多民族・多宗教・多言語を包摂するこの稀有な政治実験が今、最高点に達した。"


 pol_events.10.t: "ヤドヴィガとヤギェウォの婚姻"
 pol_events.10.d: "1385年のクレヴォ合意が実を結び、ポーランド女王ヤドヴィガとリトアニア大公ヤギェウォの婚姻が実現した。ヤギェウォはキリスト教洗礼を受け、「ヴワディスワフ2世」としてポーランド王を名乗る。リトアニアはポーランドとの同君連合に入り、東欧最大の政治的統合が始まった。この婚姻は単なる政略結婚ではない——二つの民族・二つの文化・二つの言語が一つの王朝の下に結集する、歴史的な瞬間だ。「ポーランドとリトアニアは永遠に一体である」とクレヴォ合意は宣言した。"
 pol_events.10.a: "新たなヤギェウォ朝の始まり万歳！"

 pol_events.20.t: "ポーランド・ハンガリー同君連合"
 pol_events.20.d: "ポーランドとハンガリーが同君連合を形成した。二つの大王国が一人の王の下に統一される——これはアンジュー家の外交的勝利であり、中東欧の歴史を塗り替える出来事だ。ポーランドとハンガリーの騎士が肩を並べて戦う日が来た。北のバルト海から南のアドリア海まで、一つの王朝が支配する巨大な版図が生まれつつある。オスマン帝国にとって、この同君連合こそが最大の脅威となるだろう。"
 pol_events.20.a: "ポーランドとハンガリーは一つだ！"
 STATIC_MODIFIER_NAME_pol_piast_heritage_mod: "ピャスト朝の遺産"
 STATIC_MODIFIER_DESC_pol_piast_heritage_mod: "ポーランド最初の王朝ピャスト朝が積み上げた1000年の遺産が、ポーランド王権の正統性を支えている。"


 STATIC_MODIFIER_NAME_pol_mazovia_integration_mod: "マゾフシェの統合"
 STATIC_MODIFIER_DESC_pol_mazovia_integration_mod: "ワルシャワを中心とするマゾフシェがポーランドに完全統合された。この肥沃な低地平原が王国の中心として機能する。"
 STATIC_MODIFIER_NAME_pol_great_sejm_mod: "大セイムの確立"
 STATIC_MODIFIER_DESC_pol_great_sejm_mod: "ポーランドのセイム（議会）が黄金の自由の制度として確立した。貴族の自治と王権が調和する独自の政治体制が生まれる。"
 STATIC_MODIFIER_NAME_pol_krakow_cultural_mod: "クラクフの文化的隆盛"
 STATIC_MODIFIER_DESC_pol_krakow_cultural_mod: "ヴァヴェル城を中心とするクラクフがルネサンスの光に包まれた。中東欧最高の学術都市として、ヨーロッパ中から学者・芸術家が集まる。"
 STATIC_MODIFIER_NAME_pol_jagiellonian_learning_mod: "ヤギェウォ大学の隆盛"
 STATIC_MODIFIER_DESC_pol_jagiellonian_learning_mod: "コペルニクスを輩出したヤギェウォ大学が中東欧最高の学府として栄えている。知識と芸術がポーランド全土に広まる。"
 STATIC_MODIFIER_NAME_pol_golden_age_mod: "ポーランドの黄金時代"
 STATIC_MODIFIER_DESC_pol_golden_age_mod: "コペルニクスの地動説・コハノフスキの詩・クラクフの建築——あらゆる面でポーランドは黄金時代を謳歌している。"
 STATIC_MODIFIER_NAME_pol_jadwiga_union_mod: "ヤドヴィガ・ヤギェウォ連合の絆"
 STATIC_MODIFIER_DESC_pol_jadwiga_union_mod: "ポーランドとリトアニアの同君連合が確立した。バルト海から黒海への広大な国家が生まれつつある。"
 STATIC_MODIFIER_NAME_pol_hungarian_union_bonus_mod: "ポーランド・ハンガリー同盟の力"
 STATIC_MODIFIER_DESC_pol_hungarian_union_bonus_mod: "ヴィスワ川とドナウ川の両岸から集った王軍の旗が、オスマンの国境を見下ろす丘の上で並び立っている。"
 STATIC_MODIFIER_NAME_pol_ruthenia_dev_mod: "ルテニアの開発"
 STATIC_MODIFIER_DESC_pol_ruthenia_dev_mod: "赤ルーシの農業地帯が本格開発された。リヴィウを通じた黒海交易路が活性化する。"
 STATIC_MODIFIER_NAME_pol_kyiv_gateway_mod: "キエフの門"
 STATIC_MODIFIER_DESC_pol_kyiv_gateway_mod: "スラヴ文明発祥の地キエフがポーランドの支配下に入った。ドニエプル川流域全体への影響力が確立する。"
 STATIC_MODIFIER_NAME_pol_eastern_expansion_mod: "東方への前進"
 STATIC_MODIFIER_DESC_pol_eastern_expansion_mod: "ミンスクとスモレンスクの掌握で東スラヴ世界全体がポーランドの影響圏に入った。"
 STATIC_MODIFIER_NAME_pol_eastern_empire_mod: "東方帝国"
 STATIC_MODIFIER_DESC_pol_eastern_empire_mod: "バルト海から黒海まで広がるポーランド帝国が完成した。東欧最大の国家として歴史に刻まれる。"
 STATIC_MODIFIER_NAME_pol_teutonic_victory_mod: "チュートン騎士団への勝利"
 STATIC_MODIFIER_DESC_pol_teutonic_victory_mod: "グルンヴァルドの精神がポーランド軍に宿っている。キリスト教世界の十字軍騎士を破った記憶が軍の誇りとなる。"
 STATIC_MODIFIER_NAME_pol_gdansk_trade_mod: "グダニスクの商業都市"
 STATIC_MODIFIER_DESC_pol_gdansk_trade_mod: "グダニスクがバルト海最大の穀物輸出港として発展した。ヴィスワ川を通じたポーランド穀物がヨーロッパ全土を養う。"
 STATIC_MODIFIER_NAME_pol_crusader_glory_mod: "グルンヴァルドの栄光"
 STATIC_MODIFIER_DESC_pol_crusader_glory_mod: "グルンヴァルドの精神がポーランド軍を鼓舞する。異教との戦いでポーランドは一層の栄光を勝ち取る。"
 STATIC_MODIFIER_NAME_pol_christendom_shield_mod: "キリスト教世界の盾"
 STATIC_MODIFIER_DESC_pol_christendom_shield_mod: "ポーランドはアンテムラーレ・クリスティアニタティス——キリスト教世界の盾——として歴史に刻まれた。"
 STATIC_MODIFIER_NAME_pol_silesia_mod: "シレジアの統合"
 STATIC_MODIFIER_DESC_pol_silesia_mod: "ピャスト家の故郷シレジアの城に鷲の旗が戻り、鉱山と工房の煙が再びポーランドの空に立ちのぼっている。"
 STATIC_MODIFIER_NAME_pol_bohemian_crown_mod: "ボヘミア王冠"
 STATIC_MODIFIER_DESC_pol_bohemian_crown_mod: "ヤギェウォ家がボヘミア王冠を掌握した。プラハのボヘミア王宮がポーランド外交の舞台となる。"
 STATIC_MODIFIER_NAME_pol_central_power_mod: "中欧の大国"
 STATIC_MODIFIER_DESC_pol_central_power_mod: "ポーランドが中東欧最大の大国として台頭した。三大勢力の間でも独自の輝きを放つ。"
 STATIC_MODIFIER_NAME_pol_grand_commonwealth_mod: "大コモンウェルス"
 STATIC_MODIFIER_DESC_pol_grand_commonwealth_mod: "レーチュ・ポスポリタが完成した。多民族・多宗教・多言語を包摂するヨーロッパ最大の政治実験。"

 pol_support_merchants: "商人階級への支援"
 pol_support_merchants_desc: "ポーランドの都市市民（ブルジョワ）は王室財政の重要な支柱だ。クラクフのスキェンニツェ（布市場）を中心とする交易網を支援することで、都市商人の忠誠心と財政収入が向上する。商人身分を満足させながら、交易国家としてのポーランドの基盤を作れ。"
 pol_black_sea_access: "黒海への出口"
 pol_black_sea_access_desc: "ドニエプル川を南下することでポーランドは黒海に到達できる。クリミア半島一帯とポントゥス・エクシヌス（黒海）北岸の支配は、オスマン帝国が掌握するコンスタンティノープルを迂回した東方交易路の確保を意味する。黒海艦隊を整備し、海上覇権を広げよ。"
 pol_breadbasket_of_europe: "ヨーロッパのパン籠"
 pol_breadbasket_of_europe_desc: "16世紀末、ポーランドはヨーロッパで消費される穀物の大部分を供給していた。アムステルダム・リスボン・セビリャの商人はポーランドの小麦・ライ麦なしに事業が成り立たなかった。ポーランドが「ヨーロッパのパン籠」として歴史に刻まれた。"

 pol_nieszawa_privileges: "ニェシャワ特権"
 pol_nieszawa_privileges_desc: "1454年、カジミェシュ4世ヤギェウォはドイツ騎士団との戦争のために貴族の軍事動員を必要とし、その見返りとして「ニェシャワ条約」でシュラフタ（小貴族）に広範な特権を付与した。国王は貴族の同意なしに新たな税を課したり法律を制定したりできなくなる——これはポーランド「黄金の自由」の礎石となった。"

 pol_develop_krakow: "クラクフの整備"
 pol_develop_krakow_desc: "ポーランドの首都クラクフはヴァヴェル城を中心に発展してきた。市場・職人・商人が集まるこの都市を本格的に整備し、ロケーションランクを都市以上に引き上げることで中東欧最大の商業都市としての地位を確立する。"

 pol_baltic_fleet: "バルト海艦隊"
 pol_baltic_fleet_desc: "グダニスクを手中に収めたポーランドはバルト海への出口を確保した。次は艦隊を整備し、バルト海の制海権を争う時だ。スウェーデン・デンマーク・リヴォニア騎士団がこの海域を争う中、ポーランド艦隊がバルト海の新たな主人公となる。"

 pol_sea_to_sea: "バルト海から黒海へ"
 pol_sea_to_sea_desc: "リヴォニアの制海権とキエフ・スモレンスクの掌握——ポーランド・リトアニア連合は今やバルト海から黒海まで広がる巨大国家となった。北のタリンから南のキエフまで、東欧最大の陸続きの帝国がここに完成した。後にヤン・ヘトマン・ザモイスキは言った——「このポーランドは神が自らの手で作り上げた国だ」と。"

 pol_challenge_habsburg: "ハプスブルクへの挑戦"
 pol_challenge_habsburg_desc: "ハプスブルク家は16世紀に神聖ローマ帝国・スペイン・ボヘミア・ハンガリーを支配し、ヨーロッパ最大の王家となった。しかしボヘミア王でもあるポーランド王はこの覇権に挑戦できる。ウィーンを占領するか、ハプスブルクをポーランドの旗の下に引き入れよ。"

 pol_codify_law: "法典の編纂"
 pol_codify_law_desc: "ポーランドの複雑な慣習法を成文化する試みが続いてきた。カジミェシュ大王の「ヴィスリツァ法令」（1346/47年）はその先例だ。計算所（counting house）を中心とする会計・行政機構を整備し、ポーランド法をより体系的に成文化することで行政効率が向上する。"

 pol_develop_warsaw: "ワルシャワの整備"
 pol_develop_warsaw_desc: "ワルシャワはマゾフシェ公国の中心都市として発展してきた。ポーランドの中部に位置するこの都市は、1569年のルブリン合同後にポーランド・リトアニア連合の首都として急速に発展する。都市ランクに引き上げることで、王国中心部の行政基盤が確立する。"

 pol_amber_road: "琥珀街道"
 pol_amber_road_desc: "バルト海沿岸で採れる琥珀は古代から「北の黄金」として珍重されてきた。ポーランドのグダニスクはバルト琥珀の主要輸出港であり、イタリア・地中海方面への琥珀輸出が莫大な富をもたらした。この古代から続く交易路を現代に甦らせ、ポーランドの経済的地位を高めよ。"

 pol_poznan_commerce: "ポズナニの商業"
 pol_poznan_commerce_desc: "ポズナニ（ポズナン）はポーランド西部の商業都市で、ブランデンブルクやシレジアとの交易の要衝だ。かつてポーランド王国最初の司教座が置かれたこの都市は、中世から一貫してポーランド西部の商業中心地として機能してきた。都市ランクに引き上げてその商業的潜在力を最大化せよ。"

 pol_vilnius_capital: "ヴィリニュスの整備"
 pol_vilnius_capital_desc: "ヴィリニュスはリトアニア大公国の首都として14世紀に急成長した都市だ。ゲディミナス大公が建設したこの都市には多くのユダヤ人・カトリック・東方正教徒が共存し、後に「北のエルサレム」と呼ばれるほどの多文化都市となった。都市ランクに引き上げ、リトアニア支配の中心として整備せよ。"

 pol_russia_rivalry: "モスクワとの対立"
 pol_russia_rivalry_desc: "イワン3世（大帝）はスモレンスクを巡りポーランド・リトアニアと激しく対立した。モスクワ大公国とポーランドのスモレンスク争奪戦は16世紀を通じて続く宿命の戦いだ。モスクワをライバルとして宣言し、東方覇権を確立せよ。「神聖なるルーシの守護者」を名乗るモスクワに対して、ポーランドは「自由の守護者」として対抗する。"

 pol_malbork_castle: "マルボルク城の確保"
 pol_malbork_castle_desc: "マルボルク城（マリーエンブルク）はかつてドイツ騎士団の本拠地として建設された中世ヨーロッパ最大の城塞だ。1457年のトルン条約でポーランドに引き渡されたこの難攻不落の城塞を確保し、完璧な防衛拠点とせよ。"

 pol_gniezno_church: "グニェズノ大司教区"
 pol_gniezno_church_desc: "グニェズノはポーランドの歴史的首都であり、ポーランド初の大司教座が置かれた聖地だ。987年頃に建設されたグニェズノ大聖堂は聖アダルベルトの遺骸を祀り、ポーランドのカトリック信仰の中心として機能してきた。ポーランド教会を強化し、東欧カトリック世界の守護者としての使命を果たせ。"

 pol_hanseatic_ties: "ハンザ同盟との結びつき"
 pol_hanseatic_ties_desc: "ハンザ同盟はバルト海・北海の交易を支配する都市連盟だ。グダニスク・トルン・エルビングなどポーランドの都市もハンザ同盟と密接な関係を持つ。これらの都市を中心に広大な交易ネットワークを構築し、バルト海交易の主役としてポーランドが台頭する。"

 pol_transylvania_influence: "トランシルヴァニアへの影響力"
 pol_transylvania_influence_desc: "トランシルヴァニアはハンガリー王国とポーランド同君連合の境界に位置する豊かな地域だ。ハンガリーとの同君連合を通じて、あるいは直接的な支配によってトランシルヴァニアへの影響力を確立することで、ポーランドの南東部国境が安定する。"

 pol_subjugate_serbia: "セルビアの従属"
 pol_subjugate_serbia_desc: "セルビア王国はコソヴォの戦い（1389年）後にオスマン帝国の属国となりつつある。ポーランド・ハンガリー連合の南方拡大の一環として、ベオグラードを掌握するかセルビアを従属国とすることで、バルカン半島北部に確固たる足場を築く。"

 pol_varna_revenge: "ヴァルナの雪辱"
 pol_varna_revenge_desc: "1444年のヴァルナの戦いでポーランド・ハンガリー十字軍はオスマン帝国に大敗し、ポーランド王ヴワディスワフ3世が戦死した。この屈辱的な敗北をついに晴らす時が来た。ヴァルナを占領しながらイスラム教国家と戦争することで、あの悲劇が勝利に塗り替えられる。"

 pol_upper_silesia_mines: "上シレジアの鉱山"
 pol_upper_silesia_mines_desc: "上シレジア（オーバーシュレージエン）は豊富な銀・亜鉛・鉛の鉱山で知られる。チェシン・グリヴィツェ周辺の鉱山地帯を本格的に開発することで、ポーランドの工業的基盤が確立される。後に産業革命の中心地となるこの地域の資源を早期に掌握せよ。"
 pol_upper_silesia_mines_unlock_tt: "決断「上シレジアの鉱山の開発」が解放された。"
 pol_silesia_mining_decision.title: "上シレジアの鉱山の開発"
 pol_silesia_mining_decision.desc: "シレジアの鉱山地帯は広大で、王権がそのすべてを一度に開発することはできない。坑道・精錬所・道路への投資のたびに、また一つの鉱区が本格稼働に入る。この事業は十年ごとに繰り返すことができる。"
 pol_silesia_mining_decision.a: "新たな鉱区に投資する。"

 pol_pomeranian_coast: "ポメラニア海岸"
 pol_pomeranian_coast_desc: "ポメラニア（ポモジェ）はバルト海沿岸の地域で、シュテッティン（シュチェチン）を中心に発展してきた。かつてはポーランドの版図に入っていたこの地域を回復することで、バルト海沿岸の制海権が完全にポーランドの手に入る。"

 pol_prague_university: "プラハ大学"
 pol_prague_university_desc: "プラハのカレル大学（1348年創設）は中東欧最古の大学だ。フス派の拠点となりこの大学からボヘミアの宗教改革が起こったが、ポーランドの支配下でこの学府を再建・発展させることで、プラハが再びカトリック学術の中心地となる。"

 pol_catholicism_of_lithuania: "リトアニアのカトリック化"
 pol_catholicism_of_lithuania_desc: "ヤギェウォはポーランド王になるにあたってリトアニアをカトリックに改宗させることを約束した。ヴィリニュスを中心にリトアニア全土にカトリックの教会・修道院を建設し、かつて異教の地だったリトアニアを完全なカトリック国家に変えよ。この改宗なくして、ポーランド・リトアニア連合の真の統合はあり得ない。"

 pol_royal_road: "王の街道"
 pol_royal_road_desc: "クラクフからグニェズノ・ポズナニへ、そしてグダニスクへ続く「王の街道（ドロガ・クルレフスカ）」はポーランド王国の大動脈だ。マゾフシェ統合とプロイセン征服によって確保されたこの街道を整備することで、王国内の交通・通信・行政が飛躍的に向上する。"

 STATIC_MODIFIER_NAME_pol_szlachta_rights_mod: "ニェシャワ特権"
 STATIC_MODIFIER_DESC_pol_szlachta_rights_mod: "シュラフタ（小貴族）が国王の立法権に対する拒否権を獲得した。ポーランド「黄金の自由」の始まりだ。"
 STATIC_MODIFIER_NAME_pol_law_codex_mod: "ポーランド法典"
 STATIC_MODIFIER_DESC_pol_law_codex_mod: "カジミェシュ大王の法典に連なる新たな条文が、貴族も市民も同じ法廷で裁かれる日を近づけている。"
 STATIC_MODIFIER_NAME_pol_merchant_support_mod: "商人支援政策"
 STATIC_MODIFIER_DESC_pol_merchant_support_mod: "ポーランドの商人ブルジョワジーへの支援政策が交易収入を押し上げる。"
 STATIC_MODIFIER_NAME_pol_amber_road_mod: "琥珀街道"
 STATIC_MODIFIER_DESC_pol_amber_road_mod: "バルト海の琥珀を積んだ荷車が、「北の黄金」を求める商人たちのもとへと古い街道を進んでいる。"
 STATIC_MODIFIER_NAME_pol_poznan_trade_mod: "ポズナニの交易拠点"
 STATIC_MODIFIER_DESC_pol_poznan_trade_mod: "ポーランド西部の商業都市ポズナニが主要交易拠点として整備された。"
 STATIC_MODIFIER_NAME_pol_vilnius_mod: "ヴィリニュスの発展"
 STATIC_MODIFIER_DESC_pol_vilnius_mod: "リトアニア大公国の首都ヴィリニュスが多文化都市として繁栄している。"
 STATIC_MODIFIER_NAME_pol_black_sea_mod: "黒海への進出"
 STATIC_MODIFIER_DESC_pol_black_sea_mod: "黒海北岸へのアクセスを確保したポーランドが地中海交易路に参入した。"
 STATIC_MODIFIER_NAME_pol_malbork_fortress_mod: "マルボルク城塞"
 STATIC_MODIFIER_DESC_pol_malbork_fortress_mod: "中世最大の城塞マルボルクにバスティオンを追加し、難攻不落の防衛拠点が完成した。"
 STATIC_MODIFIER_NAME_pol_gniezno_archbishopric_mod: "グニェズノ大司教座"
 STATIC_MODIFIER_DESC_pol_gniezno_archbishopric_mod: "聖アダルベルトを祀るグニェズノ大聖堂がポーランド・カトリック世界の精神的中心として機能している。"
 STATIC_MODIFIER_NAME_pol_varna_glory_mod: "ヴァルナの雪辱"
 STATIC_MODIFIER_DESC_pol_varna_glory_mod: "1444年の屈辱的敗北を晴らした。ポーランドはイスラム世界との戦いで一層の栄光を勝ち取る。"
 STATIC_MODIFIER_NAME_pol_pomeranian_coast_mod: "ポメラニア海岸"
 STATIC_MODIFIER_DESC_pol_pomeranian_coast_mod: "シュテッティンを中心とするポメラニア海岸がポーランド艦隊の基地として整備された。"
 STATIC_MODIFIER_NAME_pol_prague_learning_mod: "プラハ大学の隆盛"
 STATIC_MODIFIER_DESC_pol_prague_learning_mod: "中東欧最古のカレル大学がポーランドの支配下で再び繁栄している。"
 STATIC_MODIFIER_NAME_pol_habsburg_victory_mod: "ハプスブルクへの勝利"
 STATIC_MODIFIER_DESC_pol_habsburg_victory_mod: "ウィーンの占領かハプスブルクとの同君連合でポーランドが中欧の覇者となった。"
 STATIC_MODIFIER_NAME_pol_sea_to_sea_mod: "バルト海から黒海へ"
 STATIC_MODIFIER_DESC_pol_sea_to_sea_mod: "バルト海から黒海まで広がるポーランドが東欧全域の交易を支配する。"
 STATIC_MODIFIER_NAME_pol_lithuanian_church_mod: "リトアニア教会"
 STATIC_MODIFIER_DESC_pol_lithuanian_church_mod: "リトアニアのカトリック化完成によりポーランド・リトアニア連合の精神的統合が達成された。"
 STATIC_MODIFIER_NAME_pol_royal_road_mod: "王の街道"
 STATIC_MODIFIER_DESC_pol_royal_road_mod: "クラクフからグダニスクへ続く王の街道を、役人と商人と兵士が連なって進んでいく。"


 pol_lithuanian_relations: "リトアニアとの関係"
 pol_lithuanian_relations_desc: "リトアニア大公国はポーランドにとって最も重要な隣国であり、潜在的な同盟者あるいは最大の脅威だ。14世紀のリトアニアはヨーロッパ最後の異教国家でありながら、バルト海から黒海まで広がる強大な国家だった。ヤドヴィガ女王の婚姻政策によってリトアニアと同君連合を結ぶためには、まず両国の外交関係を整備する必要がある。関係を友好的に保つか、あるいは軍事的圧力をかけることで、ポーランドはリトアニアへの王位継承権を主張できる。"

 pol_develop_ruthenia_desc: "ガリチア（ハリチ）とヴォルィーニは赤ルーシを構成する二大公国だ。ガリチア公国（HAL）の中心都市リヴィウ（レンベルク）とヴォルィーニ公国（VOL）はポーランドが1349〜66年に征服した。ベウズもまたルテニアの重要拠点だ。ガリチア・ヴォルィーニ両公国をポーランドの同君連合下に置くか、リヴィウとベウズを直接領有することで、赤ルーシ全体の支配が確立される。この地はヨーロッパ最大の農業生産地帯の一つであり、その豊かな土地がポーランドの人口と経済を支える。"
 STATIC_MODIFIER_NAME_pol_silesia_mines_mod: "上シレジア鉱山"
 STATIC_MODIFIER_DESC_pol_silesia_mines_mod: "上シレジアの坑道では、銀と亜鉛と鉛を掘る鶴嘴の音が昼夜を問わず響いている。"

 STATIC_MODIFIER_NAME_pol_baltic_fleet_mod: "ポーランドのバルト海艦隊"
 STATIC_MODIFIER_DESC_pol_baltic_fleet_mod: "グダニスクを拠点とするポーランド艦隊がバルト海の制海権を握った。ヴィスワ川の河口から北海まで、ポーランドの旗が海上に翻る。"
 STATIC_MODIFIER_NAME_pol_livonia_mod: "リヴォニアの支配"
 STATIC_MODIFIER_DESC_pol_livonia_mod: "リガとタリンの港に翻るポーランドの旗のもと、さまざまな言葉を話す民が同じ徴税官に税を納めている。"
 STATIC_MODIFIER_NAME_pol_hanseatic_ties_mod: "ハンザ同盟との絆"
 STATIC_MODIFIER_DESC_pol_hanseatic_ties_mod: "ダンツィヒの商館でハンザの商人たちと杯を交わす者たちは、互いの荷を信じて商いを進めている。"
 STATIC_MODIFIER_NAME_pol_transylvania_mod: "トランシルヴァニアへの影響力"
 STATIC_MODIFIER_DESC_pol_transylvania_mod: "ハンガリーとの同君連合を通じ、トランシルヴァニアの山あいの宮廷にも、ポーランドの使節が迎えられている。"

 pol_breadbasket_town_right_tt: "都市特権「ポーランド王国のパン籠」が使用可能になった。穀倉がレベル5以上の都市ランク以上のロケーションに付与できる。"
 STATIC_MODIFIER_NAME_pol_warsaw_location_mod: "ワルシャワ王都の整備"
 STATIC_MODIFIER_DESC_pol_warsaw_location_mod: "ヴィスワ川の畔に築かれたワルシャワの街並みは日ごとに広がり、王国じゅうの官吏の馬車がここに集まっている。"
 STATIC_MODIFIER_NAME_pol_krakow_location_mod: "クラクフの繁栄"
 STATIC_MODIFIER_DESC_pol_krakow_location_mod: "ヴァヴェル城を中心とするクラクフが本格整備された。RGO最大規模の拡大と毎月の繁栄向上で、ポーランド王都にふさわしい都市へと発展する。"
