l_japanese:
 kie_kyiv_mission_pack: "ルーシの再統一とコサックの覇者へ"
 kie_kyiv_mission_pack_DESCRIPTION:0 "1337年、キーウ公国はリトアニア大公国とタタールの脅威に挟まれた小国だ。しかしキーウはかつてキエフ・ルーシの中心として輝いていた——聖ソフィア大聖堂・ペチェールスカ大修道院・黄金の門がその栄光を今も語る。左岸・右岸ウクライナを統一し、ハルィチナ・ヴォルィーニを征服し、コサックの軍事力でタタールを打倒し、ルテニアを形成して「大公国」として君臨せよ。"
 kie_kyiv_mission_pack_CRITERIA_DESCRIPTION:0 "ルーシを再統一し、コサック・ヘトマン国を確立し、正教信仰の守護者となり、ルテニアを形成してキーウ大公国として君臨せよ。"
 kie_kyiv_mission_pack_BUTTON_TOOLTIP:0 "キーウ大公国として全ルーシに君臨せよ。"
 kie_kyiv_mission_pack_BUTTON_DETAILS:0 "分断されたルーシをキーウのもとに再統一——コサックの剣でステップを制せ！"

 kie_restore_kyiv: "キーウの復興"
 kie_restore_kyiv_desc: "1337年のキーウ——かつてキエフ・ルーシの黄金都市として輝いたこの都は、1240年のモンゴル侵攻により壊滅し、その後リトアニア・ポーランドの支配下に置かれてきた。聖ソフィア大聖堂とペチェールスカ大修道院が往時の栄光を今も語る。ルーシの「母なる都」キーウを再び偉大な都市として復興させ、全ウクライナの求心力とせよ。"
 kie_dev_kyiv: "キーウの発展"
 kie_dev_kyiv_desc: "ヴォルホフ川とドニエプル川を結ぶ交易路の要衝——キーウを交易・文化・政治の中心地として整備せよ。聖ソフィア大聖堂の黄金の丸屋根がルーシの再生を象徴する。"
 kie_secure_left_bank: "左岸ウクライナの支配強化"
 kie_secure_left_bank_desc: "ドニエプル川左岸の諸都市の支配を強化せよ——ルーシ文化の伝統を守り、有能な官僚制度でこの豊かな農業地帯をキーウの礎とせよ。"
 kie_secure_right_bank: "右岸ウクライナの支配強化"
 kie_secure_right_bank_desc: "ドニエプル川右岸の諸都市に対する支配力を高めよ——ウクライナ文化の浸透と王室権力の強化で右岸ウクライナをキーウの核心領土とせよ。"
 kie_conquer_chernihiv: "チェルニーヒウ侵攻"
 kie_conquer_chernihiv_desc: "古代ルーシの公国都市チェルニーヒウ——かつてキエフ公国の重要な支城として栄えたこの都市を征服し、左岸ウクライナの支配を固めよ。"
 kie_conquer_poltava: "ポルタヴァへの進軍"
 kie_conquer_poltava_desc: "後の「ポルタヴァの戦い（1709年）」の舞台——コサックの要衝ポルタヴァを制圧し、スロボダ・ウクライナへの扉を開け。"
 kie_kyiv_metropolitan: "キーウ府主教区"
 kie_kyiv_metropolitan_desc: "キーウ府主教区——ルーシ正教会の中心として、コンスタンティノープル総主教区から独立した権威を確立せよ。聖ソフィア大聖堂が東スラブ正教会の精神的中枢となる。"
 kie_unite_rus: "ルーシの再統一"
 kie_unite_rus_desc: "「キエフ・ルーシ」の再統一——モンゴル侵攻により分断されたルーシ諸公国をキーウのもとに再統合せよ。ルーシの「母なる都」が再び全ウクライナの中心として輝く。"
 kie_secure_volhynia: "ヴォルィーニの確保"
 kie_secure_volhynia_desc: "ヴォルィーニ——ルーシとポーランドの境界地帯に位置するこの地域を確保することで西方への影響力が確立される。"
 kie_conquer_lutsk: "ルツク侵攻"
 kie_conquer_lutsk_desc: "ヴォルィーニの主要都市ルツク——ポーランドとリトアニアの争いの焦点となるこの都市を制圧し、西方への橋頭堡とせよ。"
 kie_conquer_galicia: "ハルィチナ侵攻"
 kie_conquer_galicia_desc: "ハルィチナ——ウクライナとポーランドの歴史的境界地帯を征服することで西ウクライナ全体の支配が確立される。"
 kie_red_ruthenia: "チェルヴォーナ・ルーシ（赤ルーシ）の制圧"
 kie_red_ruthenia_desc: "チェルヴォーナ・ルーシ（赤ルーシ）——リヴィウを中心とするこの地域を制圧することで西ウクライナの完全支配が完成する。"
 kie_conquer_lviv: "リヴィウの攻略"
 kie_conquer_lviv_desc: "「ライオンの都」リヴィウ——ダニーロ大公が建設したこの交易都市を征服し、西方との交易を掌握せよ。中世ヨーロッパとウクライナを結ぶ交易の要衝だ。"
 kie_conquer_podolia: "ポジーリャへの進出"
 kie_conquer_podolia_desc: "ポジーリャ——右岸ウクライナの重要農業地帯を征服し、黒海北岸への進出路を確保せよ。"
 kie_conquer_vinnytsia: "ヴィーンヌィツャの占領"
 kie_conquer_vinnytsia_desc: "ポジーリャの主要都市ヴィーンヌィツャを征服し、右岸ウクライナの農業基盤を確立せよ。"
 kie_conquer_polesia: "ポリーシャへの侵攻"
 kie_conquer_polesia_desc: "「沼地の地」ポリーシャ——モンゴルも苦労した湿地帯を征服し、北方への防衛線を確立せよ。"
 kie_conquer_minsk: "ミンスク攻略"
 kie_conquer_minsk_desc: "白ルテニアの中心ミンスク——この都市を征服することで北方への影響力が拡大する。"
 kie_cossack_host: "コサック軍団の設立"
 kie_cossack_host_desc: "コサック——ステップの自由な戦士たちがキーウの旗のもとに集まった。ザポリージャ・コサックの軍事的伝統を正規軍に組み込み、ルーシ最強の騎馬軍団を育成せよ。"
 kie_zaporizhzhia: "ザポリージャ・シーチの建設"
 kie_zaporizhzhia_desc: "「急流の先」ザポリージャ——ドニエプル川の急流の向こうに設立されたコサックの要塞「シーチ」は自由の象徴だ。この砦を建設し、ステップ防衛の拠点とせよ。"
 kie_tatar_wars: "タタールとの戦い"
 kie_tatar_wars_desc: "クリミア・タタール——ジョチ・ウルスの後継として黒海北岸を支配するこの勢力と決戦せよ。コサックの騎馬部隊でタタールに対抗し、ウクライナの草原を取り戻せ。"
 kie_black_sea_steppe: "黒海ステップの制覇"
 kie_black_sea_steppe_desc: "ポンティックステップ——広大な草原地帯を制覇することでキーウが黒海北岸の覇者となる。「野原（ポーレ）」の向こうに広がる可能性を開拓せよ。"
 kie_conquer_crimea: "クリミア征服"
 kie_conquer_crimea_desc: "「クリミア・ハン国」——タタールの後継国家が支配する半島を征服することで黒海の制海権が確立される。ジェノヴァ商人の交易拠点カッファを手に入れよ。"
 kie_black_sea_coast: "黒海艦隊の創設"
 kie_black_sea_coast_desc: "ドニエプル川を下り黒海へ——コサックの「チャイカ（カモメ）」と呼ばれる快速船でオスマン帝国の艦隊に挑め。黒海交易路を掌握せよ。"
 kie_kyiv_pechersk: "ペチェールスカ大修道院"
 kie_kyiv_pechersk_desc: "1051年建立のキーウ・ペチェールスカ大修道院——「洞窟の修道院」として知られるこの聖地はルーシ正教会の精神的心臓だ。この修道院を整備し、キーウが正教会の中心であることを宣言せよ。"
 kie_orthodox_revival: "正教会の復興"
 kie_orthodox_revival_desc: "モンゴル侵攻で破壊されたルーシの正教会を再建せよ——全土に聖堂を建立し、「聖なるルーシ」の伝統を復活させる。"
 kie_grain_breadbasket: "ウクライナ——ヨーロッパの穀倉"
 kie_grain_breadbasket_desc: "肥沃な黒土（チョルノゼム）——ウクライナの豊かな農地は「ヨーロッパの穀倉」と称される。この農業生産力を最大限に活用し、帝国の食料基盤を固めよ。"
 kie_trade_routes: "キーウの交易路"
 kie_trade_routes_desc: "「ヴァリャーグからギリシャへの道」——バルト海から黒海を結ぶこの古代交易路がキーウの繁栄を支えた。この伝統ある交易路を現代に甦らせよ。"
 kie_hetmanate: "コサック・ヘトマン国"
 kie_hetmanate_desc: "ヘトマン（コサックの最高指揮官）——コサック・ヘトマン国の確立でキーウは独自の軍事・政治体制を持つ国家として台頭する。後のボフダン・フメリニツキー（1648年）の偉業を先取りせよ。"
 kie_literacy_culture: "識字と文化の振興"
 kie_literacy_culture_desc: "キーウの知的伝統——ペチェールスカ修道院の写本制作・聖ソフィア聖堂学校・キーウ・モヒラ・アカデミー（1632年）の先駆として、教育文化を振興せよ。"
 kie_dev_chernihiv: "チェルニーヒウ市の整備"
 kie_dev_chernihiv_desc: "チェルニーヒウを左岸ウクライナの文化・交易の中心地として整備せよ。"
 kie_conquer_wallachia: "ワラキアへの進出"
 kie_conquer_wallachia_desc: "多瑙川沿いのワラキア——バルカン半島への足がかりとなるこの地域を征服し、黒海沿岸の支配を完成させよ。"
 kie_cossack_cavalry: "コサック騎兵の精鋭化"
 kie_cossack_cavalry_desc: "コサックの騎馬部隊——ステップを疾駆する軽騎兵と重騎兵が精鋭部隊として育成された。その機動力と戦闘力でタタールを圧倒せよ。"
 kie_kyiv_academy: "キーウ・モヒラ・アカデミー"
 kie_kyiv_academy_desc: "1632年設立のキーウ・モヒラ・アカデミー——東ヨーロッパ最古の大学の一つに先んじて設立せよ。ルーシの知的・文化的ルネサンスを実現する。"
 kie_conquer_krakow: "クラキウ攻略"
 kie_conquer_krakow_desc: "ポーランド王国の歴史的首都クラキウ——ヴァヴェル城を擁するこの都市を征服することで中欧への影響力が大きく拡大する。"
 kie_navy_dnipro: "ドニエプル艦隊"
 kie_navy_dnipro_desc: "「チャイカ」（カモメ）——コサックの快速帆船でドニエプル川から黒海へ進出し、オスマン帝国の海岸を奇襲せよ。ドニエプル艦隊が黒海交易を守護する。"
 kie_protect_orthodoxy: "正教の守護者"
 kie_protect_orthodoxy_desc: "コンスタンティノープル陥落後、キーウが正教世界の守護者として台頭——「第二のビザンツ」を目指してルーシ正教会の最高権威を確立せよ。"
 kie_conquer_vilnius: "ヴィリニュス占領"
 kie_conquer_vilnius_desc: "リトアニア大公国の首都ヴィリニュス——この都市を征服することでリトアニアのルーシ支配が終わり、東欧の覇権がキーウに移る。"
 kie_western_alliance: "西方との同盟"
 kie_western_alliance_desc: "ポーランド・ハンガリー・神聖ローマ帝国との外交関係を構築し、東からの脅威に対抗する西方同盟を確立せよ。"
 kie_silver_route: "銀の交易路"
 kie_silver_route_desc: "東方の銀がキーウを通じて西方へ——ドニエプル川沿いの交易路を整備し、ルーシの国際交易における地位を確立せよ。"
 kie_ruthenian_army: "ルテニア軍の近代化"
 kie_ruthenian_army_desc: "コサックの伝統に西欧の軍事技術を融合させよ——ルテニア軍が東欧最強の軍事力として君臨する。"
 kie_conquer_warsaw: "ヴァルシャヴァ攻略"
 kie_conquer_warsaw_desc: "ポーランドの首都ヴァルシャヴァ——この征服でポーランド・リトアニア共和国との長年の争いに決着をつけよ。"
 kie_beeswax_honey: "蜜蝋と蜂蜜の交易"
 kie_beeswax_honey_desc: "ウクライナの豊かな蜜蝋——正教会の蝋燭需要と西欧市場に供給するこの重要交易品を独占せよ。"
 kie_salt_of_galicia: "ハルィチナの塩"
 kie_salt_of_galicia_desc: "ハルィチナの岩塩鉱——古来「白い金」と呼ばれる塩の産地を掌握し、食料保存と交易の重要資源を確保せよ。"
 kie_dev_poltava: "ポルタヴァ市の整備"
 kie_dev_poltava_desc: "コサック左岸ウクライナの中心都市ポルタヴァを整備し、東方への前哨基地とせよ。"
 kie_beyond_donets: "ドネツ川の向こうへ"
 kie_beyond_donets_desc: "スロボダ・ウクライナ——ドネツ川沿いの「自由ウクライナ」地帯にコサック農民を入植させ、東方の草原地帯を開拓せよ。"
 kie_conquer_moldavia: "モルダヴィア侵攻"
 kie_conquer_moldavia_desc: "多瑙川デルタのモルダヴィア——黒海沿岸の重要な戦略地点を征服し、黒海交易への完全参入を果たせ。"
 kie_amber_route: "琥珀の交易路"
 kie_amber_route_desc: "バルト海からリヴィウ・ルツクを経て南方へ——古代の琥珀交易路がルテニアの交易ネットワークの基幹となる。"
 kie_fortress_line: "要塞防衛線"
 kie_fortress_line_desc: "ステップからの脅威に備える要塞ライン——ザポリージャからポジーリャまでの防衛線がウクライナの農民と都市を守護する。"
 kie_great_kyiv: "偉大なるキーウ"
 kie_great_kyiv_desc: "「ルーシの母なる都」キーウを本来の偉大さに復活させよ——モンゴル侵攻前の栄光を取り戻し、黄金の丸屋根が輝く大都市として再建せよ。"
 kie_ruthenian_culture: "ルテニア文化の確立"
 kie_ruthenian_culture_desc: "ウクライナ・ルテニアの独自文化——ウクライナ語・コサック文化・正教信仰が融合した独自のアイデンティティを確立せよ。"
 kie_conquer_zhytomyr: "ジトーミルの整備"
 kie_conquer_zhytomyr_desc: "右岸ウクライナの要衝ジトーミル——街として整備し、建造物を充実させることで西方への重要な拠点都市として機能させよ。"
 kie_form_ruthenia: "ルテニアの形成"
 kie_form_ruthenia_desc: "「ルテニア（ルーシの地）」——ウクライナ・ベラルーシ・西ロシアを包括するルテニア国家の形成を宣言せよ。モンゴル侵攻以来の夢、ルーシ諸民族の統一が遂に実現する。"
 kie_grand_principality: "キーウ大公国"
 kie_grand_principality_desc: "「キーウ大公国」——かつてキエフ・ルーシの栄光をこの称号が示す。コサックの軍事力・正教の権威・ルテニアの文化が融合したキーウが東ヨーロッパの大国として君臨する。「ルーシの母なる都」の黄金の丸屋根が再び輝き、全スラブ民族に希望の光を与える。"

 kie_events.1.t: "キーウの目覚め——ルーシの母なる都の復興"
 kie_events.1.d: "ドニエプル川沿いの丘の上——聖ソフィア大聖堂の黄金の丸屋根がキーウの空に輝く。\n\n1337年、キーウ公国は小国ながら、かつてキエフ・ルーシの中心として輝いた歴史的な重みを背負っている。「ルーシの諸都市の母」——この称号がキーウの使命を示している。\n\n周囲にはリトアニア大公国・ポーランド・タタールが圧力をかけるが、ドニエプル川の恵みと肥沃な黒土、そしてコサックの精神がキーウを支える。\n\nペチェールスカ大修道院の修道士たちが祈る——「ルーシよ、再び立て」。その祈りに答えよ。"
 kie_events.1.a: "キーウの栄光を取り戻す！"


 kie_events.20.t: "コサック・ヘトマン国の宣言"
 kie_events.20.d: "ヘトマン（コサック総指揮官）の旗のもとにザポリージャ・コサックが整列した——キーウ大公はコサックの力を正式に国家制度に組み込み、「コサック・ヘトマン国」を宣言する。この独特の軍事国家体制がルテニアの未来を決定する。"
 kie_events.20.a: "コサック・ヘトマン国万歳！自由のウクライナ万歳！"

 kie_events.60.t: "ルテニアの形成——東ヨーロッパの新興大国"
 kie_events.60.d: "ウクライナ・ベラルーシ・ハルィチナが一つの旗のもとに——「ルテニア」として統一された東スラブ国家が東ヨーロッパの新しい大国として台頭した。キーウの黄金の丸屋根の下に、全ルーシの人々が集う。"
 kie_events.60.a: "ルテニア万歳！キーウ万歳！"

 kie_events.99.t: "キーウ大公国——ルーシの栄光の復活"
 kie_events.99.d: "「キーウ大公国」——この称号がドニエプル川の岸辺に響き渡った。コサックの騎馬部隊・正教の権威・ルテニアの文化が融合した帝国が、東ヨーロッパの覇者として君臨する。モンゴルに滅ぼされたキエフ・ルーシが、新しい形で蘇った——ルーシの諸都市の母・キーウが再び輝く。"
 kie_events.99.a: "キーウ大公国万歳！ルーシの栄光よ永遠に！"

