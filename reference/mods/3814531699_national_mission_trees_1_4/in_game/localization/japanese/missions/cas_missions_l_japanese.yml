l_japanese:
 cas_castile_dev_hub: "王領都市の発展"
 cas_castile_dev_hub_desc: "カスティーリャ王領に属する諸都市の発展を統括し、王国の経済基盤を固めよ。"
 cas_granada_dev_hub: "グラナダの再興"
 cas_granada_dev_hub_desc: "陥落したグラナダ王国の諸都市——グラナダとマラガに、新たな繁栄をもたらせ。"
 STATIC_MODIFIER_NAME_cas_crown_domains_mod: "王領都市の発展"
 STATIC_MODIFIER_DESC_cas_crown_domains_mod: "王領の都市に築かれた新しい市場や城壁を、王の徴税官が誇らしげに巡回している。"
 STATIC_MODIFIER_NAME_cas_granada_dev_mod: "グラナダの再興"
 STATIC_MODIFIER_DESC_cas_granada_dev_mod: "アルハンブラの宮殿の窓からは、新しい教会の鐘の音が谷の向こうまで響いている。"
 cas_castile_mission_pack: "カスティーリャ王国の栄光"
 cas_castile_mission_pack_DESCRIPTION:0 "1337年、カスティーリャはアルフォンソ11世の統治下にある強国だ。グラナダのみを残してイベリア半島のほぼ全土を回復したレコンキスタ——しかしその完成はまだ遠い。グラナダ征服・アラゴンとの統合・コロンブスの新大陸航海・コルテスとピサロの征服者たち——そしてフェリペ2世の「太陽の沈まない帝国」まで。カスティーリャの歴史を駆け抜けろ。"
 cas_castile_mission_pack_CRITERIA_DESCRIPTION:0 "レコンキスタを完成させ、スペインを形成し、植民地帝国を建設して「太陽の沈まない帝国」を樹立せよ。"
 cas_castile_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成して「太陽の沈まない帝国」を樹立せよ。"
 cas_castile_mission_pack_BUTTON_DETAILS:0 "グラナダ陥落からフェリペ2世の世界帝国まで！"

 cas_sword_of_castile: "カスティーリャの剣"
 cas_sword_of_castile_desc: "1337年——アルフォンソ11世はカスティーリャ王として精力的な統治を続けている。1340年のリオ・サラドの戦いではマリーン朝とグラナダの連合軍を壊滅させ、イベリア半島から最後のムスリム勢力を駆逐する礎を築いた。カスティーリャとレオンの王冠を掲げ、レコンキスタの剣を今一度振るえ。"
 cas_secure_castile: "バリャドリードの拡張"
 cas_secure_castile_desc: "カスティーリャとレオン両地域を完全に掌握することで、レコンキスタの中心基地が確立される。"
 cas_fall_of_granada: "グラナダ陥落"
 cas_fall_of_granada_desc: "1492年1月2日——グラナダの最後のスルタン、ボアブディルが「嘆きの坂」でカスティーリャ・イサベル女王に鍵を差し出した。780年に及ぶレコンキスタがついに完成する。"
 cas_conquer_navarre: "ナバラの征服"
 cas_conquer_navarre_desc: "ピレネー山脈の要衝ナバラ王国を掌握することで、フランスとの国境が確立されイベリア北部の支配が完成する。"
 cas_subdue_aragon: "アラゴンとの統合"
 cas_subdue_aragon_desc: "イサベルとフェルナンドの結婚（1469年）がカスティーリャとアラゴンの同君連合を生んだ。「カトリック両王」の統治下でスペインは誕生しつつある。"
 cas_form_spain: "スペインの形成"
 cas_form_spain_desc: "イベリア半島の大部分を統一したカスティーリャが正式に「スペイン王国」を宣言する。ヨーロッパ最強国家の誕生だ。"
 cas_conquer_portugal: "ポルトガルの統合"
 cas_conquer_portugal_desc: "1580年、フェリペ2世がポルトガル王位を継承した——「イベリア同盟」の成立だ。これによりスペインはポルトガルの植民地帝国も支配することになる。"
 cas_iberian_union: "イベリア同盟"
 cas_iberian_union_desc: "イベリア半島全土がスペインの支配下に入った。大西洋からインド洋まで、スペインとポルトガルの植民地が世界を覆う。"
 cas_holy_brotherhood: "聖なる兄弟団（エルマンダッド）"
 cas_holy_brotherhood_desc: "イサベル女王が設立したエルマンダッド（聖なる兄弟団）は治安維持組織として貴族の権力を抑制し、王権を強化した。"
 cas_inquisition: "スペイン異端審問"
 cas_inquisition_desc: "1478年、教皇シクストゥス4世がイサベルとフェルナンドに異端審問所設立の権限を与えた。トルケマダ率いる審問官たちが信仰の純潔を守るために活動する。"
 cas_expulsion_of_jews: "ユダヤ人追放令"
 cas_expulsion_of_jews_desc: "1492年のアルハンブラ勅令——改宗を拒否するユダヤ人のスペインからの追放が宣言される。この決定はカトリック信仰の純潔を守るが、多くの優秀な商人・学者を失う。"
 cas_catholic_monarchs: "カトリック両王"
 cas_catholic_monarchs_desc: "教皇アレクサンデル6世がイサベルとフェルナンドに「カトリック両王（Reyes Católicos）」の称号を授けた。スペインはカトリック世界の守護者として認められた。"
 cas_absolute_crown: "絶対王政の確立"
 cas_absolute_crown_desc: "貴族の特権を制限し、王権を絶対化する——スペインはヨーロッパ最初の近代的絶対王政国家の一つとして台頭する。"
 cas_cortes: "カスティーリャ・コルテス"
 cas_cortes_desc: "コルテス（議会）はカスティーリャの伝統的な身分制議会だ。王権強化と議会の均衡を保つことで、安定した統治体制が確立される。"
 cas_leyes_de_indias: "インディアス法"
 cas_leyes_de_indias_desc: "植民地における先住民の扱いを規定するインディアス法——バルトロメ・デ・ラス・カサスらの人道主義的主張を受けて制定される。"
 cas_canary_islands: "カナリア諸島の掌握"
 cas_canary_islands_desc: "大西洋に浮かぶカナリア諸島はポルトガルとの大西洋競争における戦略的要衝だ。この島々を掌握することでスペインの大西洋進出が始まる。"
 cas_atlantic_exploration: "大西洋探検"
 cas_atlantic_exploration_desc: "ポルトガルがアフリカ沿岸を南下する一方、スペインは大西洋を西に向かう。「インディアスへの西回り航路」の夢が现实になろうとしている。"
 cas_columbus_voyage: "コロンブスの航海"
 cas_columbus_voyage_desc: "1492年8月3日、クリストファー・コロンブスがパロスを出港した。3隻の船——サンタ・マリア・ピンタ・ニーニャ——が大西洋を横断し、新大陸の扉を開く。"
 cas_conquer_caribbean: "カリブ海の征服"
 cas_conquer_caribbean_desc: "エスパニョーラ島（サント・ドミンゴ）を拠点にスペインのカリブ海支配が確立された。砂糖・タバコ・貴金属がスペインへの富の流れを作り出す。"
 cas_conquer_mexico: "メキシコの征服"
 cas_conquer_mexico_desc: "1519〜1521年、エルナン・コルテスは500人の兵士でアステカ帝国の首都テノチティトランを征服した。「新スペイン総督領」が誕生する。"
 cas_conquer_peru: "ペルーの征服"
 cas_conquer_peru_desc: "フランシスコ・ピサロが168名の兵士でインカ帝国を打倒した——歴史上最も驚愕的な征服の一つ。アンデスの金銀がスペインへと流れ込む。"
 cas_silver_of_potosi: "ポトシの銀山"
 cas_silver_of_potosi_desc: "1545年に発見されたポトシの銀山（標高4,000m）はヨーロッパ史上最大の銀鉱山だ。「セロ・リコ（豊かな山）」からの銀がスペイン帝国の財政を支える。"
 cas_colonial_empire: "植民地帝国"
 cas_colonial_empire_desc: "メキシコからペルーまで、カリブ海から北米南岸まで——スペインの植民地国家が世界を覆った。「コンキスタドール（征服者）たち」の功績が帝国の礎を築く。"
 cas_manila_galleon: "マニラ・ガレオン"
 cas_manila_galleon_desc: "1571年のマニラ建設後、マニラ・ガレオン（Manila Galleon）がアカプルコ〜マニラ間の太平洋横断交易を独占した。アジアの絹・磁器とアメリカの銀が行き交う世界最初の真のグローバル交易ルートだ。"
 cas_conquer_naples: "ナポリ王国の征服"
 cas_conquer_naples_desc: "「偉大なる大尉」ゴンサロ・デ・コルドバ率いるスペイン軍がフランスを破りナポリを制圧した。イタリアへのスペインの影響力が確立される。"
 cas_conquer_sicily: "シチリアの確保"
 cas_conquer_sicily_desc: "シチリアはアラゴン王家がすでに支配していた地中海の穀倉だ。ここを確保することで地中海の制海権確立への基盤が整う。"
 cas_conquer_milan: "ミラノの制圧"
 cas_conquer_milan_desc: "イタリア戦争の最終的な結果として、ミラノ公国がスペインの支配下に入る。イタリア半島全体がスペインの影響圏となった。"
 cas_mediterranean_mastery: "地中海の制覇"
 cas_mediterranean_mastery_desc: "ナポリ・シチリア・サルデーニャ・ミラノ——スペインの地中海帝国が確立された。かつてのローマ帝国の「内なる海」が再びキリスト教世界の中心となる。"
 cas_battle_of_lepanto: "レパントの海戦"
 cas_battle_of_lepanto_desc: "1571年10月7日、スペイン・ヴェネツィア・教皇のキリスト教同盟艦隊がオスマン帝国海軍を壊滅させた——「神聖同盟の勝利」。地中海のキリスト教覇権が確立される。"
 cas_secure_ceuta: "セウタの確保"
 cas_secure_ceuta_desc: "ジブラルタル海峡を挟んでイベリア半島と向き合うセウタはアフリカへの玄関口だ。ここを掌握することで地中海西端の制海権が確保される。"
 cas_conquer_oran: "オランの征服"
 cas_conquer_oran_desc: "1509年、カルデナル・シスネロスがオランを征服した——「アフリカのレコンキスタ」の第一歩。北アフリカのムスリム勢力への反撃が始まる。"
 cas_conquer_tunis: "チュニスの征服"
 cas_conquer_tunis_desc: "1535年、カール5世率いるスペイン軍がチュニスを征服した。オスマン帝国と北アフリカの覇権を争うスペインの軍事力が世界に示される。"
 cas_north_africa_dominion: "北アフリカ支配"
 cas_north_africa_dominion_desc: "セウタからオランまで、北アフリカの地中海沿岸がスペインの支配下に入った。ムスリム海賊の脅威が排除され地中海交易が安定する。"
 cas_dev_sevilla: "インディアスの玄関口"
 cas_dev_sevilla_desc: "セビリア——グアダルキビル川沿いの古都は新大陸交易の独占的な玄関口として繁栄する。「インディアス交易所（カーサ・デ・コントラタシオン）」がここを世界最大の商業都市に変えた。"
 cas_casa_de_contratacion: "インディアス交易所"
 cas_casa_de_contratacion_desc: "1503年、セビリアに設立されたカーサ・デ・コントラタシオン（インディアス交易所）はスペインの植民地交易を独占的に管理する機関だ。新大陸との全交易がここを通じて行われる。"
 cas_dev_toledo: "トレドの刃物産業"
 cas_dev_toledo_desc: "トレドはカスティーリャの歴史的首都であり、剣・金細工・絹で有名な工業都市でもある。「トレドの剣」の名声が世界に広まる。"
 cas_dev_madrid: "マドリードの首都化"
 cas_dev_madrid_desc: "1561年、フェリペ2世がマドリードを恒久的な首都と宣言した——それまで宮廷が各地を転々としていたスペインにとって革命的な変化だ。マドリードの人口が爆発的に増加する。"
 cas_dev_burgos: "エル・シッドの都"
 cas_dev_burgos_desc: "「エル・シッドの都市」ブルゴス——カスティーリャの歴史的首都であり、ウール交易の中心地として北欧向けの羊毛輸出で栄えた。"
 cas_trade_network: "帝国交易ネットワーク"
 cas_trade_network_desc: "セビリアからマニラまで、アントワープから新大陸まで——スペインの帝国交易ネットワークが世界を覆った。"
 cas_tercio: "テルシオ（スペイン方陣）"
 cas_tercio_desc: "16世紀最強の戦術——テルシオはパイク兵・マスケット銃兵・剣士を組み合わせた歩兵方陣だ。「スペイン歩兵は世界最強」という伝説が戦場で証明される。"
 cas_military_orders: "騎士修道会"
 cas_military_orders_desc: "サンティアゴ・カラトラバ・アルカンタラの三騎士修道会——カトリック両王の時代にその財産と権限が王室の管理下に置かれ、軍事力の一翼を担う。"
 cas_grande_armada: "無敵艦隊（アルマダ）"
 cas_grande_armada_desc: "1588年、フェリペ2世はイングランド征服のために130隻からなる大艦隊「アルマダ」を派遣した——スペイン海軍力の絶頂期を象徴する存在だ。"
 cas_conquistadors: "コンキスタドール"
 cas_conquistadors_desc: "コルテス・ピサロ・バルボア・デ・ソト——征服者たちの名前が歴史に刻まれる。少数の兵士で巨大な帝国を征服した彼らはスペイン軍事技術の優位性を世界に示した。"
 cas_salamanca_university: "サラマンカ大学"
 cas_salamanca_university_desc: "1218年創設のサラマンカ大学はヨーロッパ最古の大学の一つだ。神学・法学・医学の最高学府として、スペイン帝国の官僚・聖職者・学者を育成する。"
 cas_siglo_de_oro: "黄金時代（シグロ・デ・オロ）"
 cas_siglo_de_oro_desc: "セルバンテス・ロペ・デ・ベガ・ベラスケス・エル・グレコ——16〜17世紀のスペイン文化黄金時代が花開く。文学・演劇・絵画の分野でスペインがヨーロッパをリードする。"
 cas_escorial: "エル・エスコリアル"
 cas_escorial_desc: "1563年にフェリペ2世が建設を命じたエル・エスコリアル修道院——宮殿・修道院・廟所を兼ねたこの巨大建築物はスペイン帝国の絶頂期を象徴する。マドリード郊外の山中に聳えるその姿は永遠にスペインの誇りだ。"
 cas_dev_granada_city: "スペインの宝石"
 cas_dev_granada_city_desc: "アルハンブラ宮殿を擁するグラナダはムスリム文化の遺産が息づく都市だ。この「スペインの宝石」を整備することで南部の文化的・経済的中心地となる。"
 cas_dev_cordoba: "コルドバ革の名声"
 cas_dev_cordoba_desc: "コルドバ革（コルドバン）——ヤギの皮を使った精巧な細工革はかつてウマイヤ朝の職人が開発した技術だ。柔らかく光沢のある表面と耐久性を兼ね備えたコルドバ革は中世ヨーロッパ全土で王侯貴族の装身具・書籍の装丁・馬具として珍重され、「コルドバン（Cordovan）」という言葉がヨーロッパ各語に入るほどその名声は高かった。"
 cas_inherit_flanders: "フランドルの継承"
 cas_inherit_flanders_desc: "ブルゴーニュ家の遺産としてフランドルがスペインに組み込まれた。アントワープ・ブリュージュ・ゲントの豊かな毛織物都市がスペイン帝国の財政を支える。"
 cas_revolt_of_flanders: "フランドルの平定"
 cas_revolt_of_flanders_desc: "フランドルの抵抗を鎮圧し、この豊かな地域をスペインの安定的な一部として統合せよ。"
 cas_greatest_power: "太陽の沈まない帝国の礎"
 cas_greatest_power_desc: "植民地帝国・テルシオの陸軍・無敵艦隊——三本の柱が揃い、スペインはかつてない繁栄の頂点に達した。いま「太陽の沈まない帝国」への最後の一歩を踏み出す時だ。"
 cas_empire_of_the_sun: "太陽の沈まない帝国"
 cas_empire_of_the_sun_desc: "「私の帝国では太陽が沈まない」——カール5世の言葉が現实となった。スペインからナポリ、フランドルから新大陸、マニラからカリブ海まで——スペイン帝国が世界を覆う。"

 cas_battle_rio_salado: "リオ・サラドの勝利"
 cas_battle_rio_salado_desc: "1340年のリオ・サラドの戦いでアルフォンソ11世がマリーン朝とグラナダの連合軍を破った——レコンキスタ最後の局面の幕が上がる。"
 cas_dev_leon_city: "古王国レオンの威光"
 cas_dev_leon_city_desc: "かつてレコンキスタを指導したレオン王国の旧首都——その歴史と伝統を活かして整備せよ。"
 cas_church_reform: "教会改革"
 cas_church_reform_desc: "シスネロス枢機卿が主導する教会改革——修道院の規律回復・聖職者教育の改善・腐敗一掃によってスペインのカトリック教会がヨーロッパ最強の精神的権威となる。"
 cas_counter_reformation: "対抗宗教改革"
 cas_counter_reformation_desc: "イグナティウス・デ・ロヨラが創設したイエズス会——スペインが主導する対抗宗教改革がプロテスタントの脅威に対抗する。トリエント公会議でカトリック教義が再確認される。"
 cas_conquer_cuba: "キューバの征服"
 cas_conquer_cuba_desc: "1511年、ディエゴ・ベラスケスがキューバを征服した。ハバナはカリブ海の交易拠点として整備され、新大陸向け航路の要衝となる。"
 cas_conquer_florida: "フロリダの探検"
 cas_conquer_florida_desc: "フアン・ポンセ・デ・レオンが1513年に「花の地（フロリダ）」を発見した——「若返りの泉」伝説を追い求めて北米の探索が始まる。"
 cas_conquer_philippines: "フィリピンの征服"
 cas_conquer_philippines_desc: "1565年、ミゲル・ロペス・デ・レガスピがフィリピン諸島を征服しマニラを建設した。スペインのアジア進出が実現し、太平洋を横断するマニラ・ガレオン貿易が生まれる。"
 cas_gold_fleets: "金銀の艦隊"
 cas_gold_fleets_desc: "ポトシの銀とインカの黄金——毎年スペインへと向かう「インディアス艦隊（フロタ・デ・インディアス）」が世界最大の富の流れを作り出す。"
 cas_sardinia: "サルデーニャの確保"
 cas_sardinia_desc: "アラゴン王家がすでに支配するサルデーニャをスペイン帝国に統合することで、西地中海の島嶼支配が完成する。"
 cas_conquer_tunis_italy: "イタリア支配の確立"
 cas_conquer_tunis_italy_desc: "ナポリ・シチリア・サルデーニャ・ミラノ——イタリア半島の主要地域がスペインの支配下に入り、ルネサンスの富がスペイン帝国の繁栄に加わる。"
 cas_garrison_system: "要塞防衛網"
 cas_garrison_system_desc: "スペイン帝国の広大な版図を守る要塞防衛網——フランドルのテルシオ・ナポリの要塞・北アフリカのプレシディオ（駐屯地）が帝国の境界を守る。"
 cas_dev_cadiz: "フェニキアの古港"
 cas_dev_cadiz_desc: "フェニキア人が建設した古代都市カディスは大西洋に突き出た半島に位置する天然の良港だ。セビリアに替わってインディアス交易の玄関口となる運命にある。"
 cas_dev_malaga: "マラガの整備"
 cas_dev_malaga_desc: "地中海沿岸のマラガは絹・ワイン・干しぶどうの産地として知られる交易都市だ。グラナダ征服後に急速に発展する。"
 cas_dev_valencia: "太陽の都バレンシア"
 cas_dev_valencia_desc: "「太陽の都市」バレンシアは絹・砂糖・米の産地として地中海交易の要衝だ。アラゴン王冠の主要都市を整備することでスペインの東岸が繁栄する。"
 cas_dev_zaragoza: "アラゴン王都サラゴサ"
 cas_dev_zaragoza_desc: "アラゴン王国の首都サラゴサはエブロ川流域の交通の要衝だ。ここを整備することでイベリア半島の内陸交易が活性化する。"
 cas_dev_barcelona: "地中海の女王バルセロナ"
 cas_dev_barcelona_desc: "地中海交易の中心地バルセロナ——カタルーニャの首都としてアラゴン王冠最大の商業都市を整備し、スペイン帝国の地中海交易拠点とせよ。"
 cas_dev_segovia: "セゴビアの水道橋"
 cas_dev_segovia_desc: "水道橋で有名なセゴビアはカスティーリャの王室居城があった都市だ。ここを整備することで王権の象徴としての格式が高まる。"
 cas_west_africa_trade: "西アフリカ交易"
 cas_west_africa_trade_desc: "ポルトガルと競合するアフリカ西岸の交易路——スペインがカナリア諸島を足がかりに西アフリカに進出し、象牙・黄金・後には奴隷の交易に参入する。"
 cas_council_of_trent: "トリエント公会議"
 cas_council_of_trent_desc: "1545〜1563年のトリエント公会議——スペインが主導してカトリック教義を再確認し、対抗宗教改革の指針を確立した。イエズス会がプロテスタントへの反撃の最前線に立つ。"

 cas_events.20.t: "グラナダ陥落——レコンキスタの完成"
 cas_events.20.d: "1492年1月2日——アルハンブラ宮殿の門が開き、最後のグラナダ・スルタン、ムハンマド12世（ボアブディル）が「嘆きの坂」でイサベルとフェルナンドに鍵を差し出した。780年に及ぶレコンキスタがついに完成する。「今、泣け、男のように戦えなかったのだから」——ボアブディルの母の言葉が歴史に残る。"
 cas_events.20.a: "スペイン万歳！レコンキスタ完成！神と聖母マリアに栄光あれ！"

 cas_events.30.t: "カトリック両王——アラゴンとの統合"
 cas_events.30.d: "イサベルとフェルナンドの結婚から数十年——カスティーリャとアラゴンが統合の時を迎えた。教皇アレクサンデル6世が「カトリック両王（Reyes Católicos）」の称号を授け、スペインという国家の形成が現实となる。"
 cas_events.30.a: "カトリック両王万歳！スペインは一つの信仰のもとに！"


 cas_events.50.t: "コロンブスの航海——新世界の発見"
 cas_events.50.d: "1492年10月12日——クリストファー・コロンブスがバハマ諸島のグアナハニ島に上陸した。ヨーロッパ人が知らなかった新大陸の存在が明らかになる。「インディアス（アジア）」に到達したと信じるコロンブスの発見は、スペインに計り知れない富をもたらすことになる。"
 cas_events.50.a: "新大陸に神の加護あれ！スペインの旗を大西洋の彼方に！"

 cas_events.99.t: "太陽の沈まない帝国"
 cas_events.99.d: "「私の帝国では太陽が沈まない（En mi Imperio nunca se pone el sol）」——カール5世の言葉が現实となった。スペインからナポリ・フランドル・新大陸・フィリピンまで、世界のあらゆる場所にスペインの旗が翻る。フェリペ2世の御代に、スペイン帝国は人類史上最初の「世界帝国」として完成した。"
 cas_events.99.a: "太陽の沈まない帝国万歳！スペインよ永遠に！"
 STATIC_MODIFIER_NAME_cas_reconquista_spirit_mod: "レコンキスタの精神"
 STATIC_MODIFIER_DESC_cas_reconquista_spirit_mod: "カスティーリャの剣がイベリアのムスリムへの聖戦を鼓舞する。"

 STATIC_MODIFIER_NAME_cas_reconquista_done_mod: "レコンキスタの完成"
 STATIC_MODIFIER_DESC_cas_reconquista_done_mod: "780年の聖戦が完成した。スペインはカトリック信仰のもとに統一された。"
 STATIC_MODIFIER_NAME_cas_hermandad_mod: "聖なる兄弟団"
 STATIC_MODIFIER_DESC_cas_hermandad_mod: "エルマンダッドの弓兵たちが街道を巡り、貴族の城の門も王の裁きの前には開かれるようになった。"
 STATIC_MODIFIER_NAME_cas_inquisition_mod: "スペイン異端審問"
 STATIC_MODIFIER_DESC_cas_inquisition_mod: "異端審問所の黒衣の審問官たちが町々を巡り、人々は声を潜めて信仰の証しを立てている。"
 STATIC_MODIFIER_NAME_cas_pure_faith_mod: "純潔の信仰"
 STATIC_MODIFIER_DESC_cas_pure_faith_mod: "ユダヤ人追放によりスペインのカトリック的純潔が確立された。"
 STATIC_MODIFIER_NAME_cas_catholic_monarchs_mod: "カトリック両王の遺産"
 STATIC_MODIFIER_DESC_cas_catholic_monarchs_mod: "教皇公認の「カトリック両王」の称号がスペインの権威を確立した。"
 STATIC_MODIFIER_NAME_cas_absolutism_mod: "絶対王政"
 STATIC_MODIFIER_DESC_cas_absolutism_mod: "王権が絶対化し、スペインは近代的中央集権国家となった。"
 STATIC_MODIFIER_NAME_cas_cortes_mod: "コルテス"
 STATIC_MODIFIER_DESC_cas_cortes_mod: "カスティーリャ議会の議場では、王と諸都市の代表が同じ卓を囲み、統治の取り決めが記されている。"
 STATIC_MODIFIER_NAME_cas_colonial_law_mod: "インディアス法"
 STATIC_MODIFIER_DESC_cas_colonial_law_mod: "植民地統治法が整備され、広大な海外領土の管理が安定した。"
 STATIC_MODIFIER_NAME_cas_canary_mod: "カナリア諸島の拠点"
 STATIC_MODIFIER_DESC_cas_canary_mod: "大西洋進出の足がかりが確立された。"
 STATIC_MODIFIER_NAME_cas_atlantic_mod: "大西洋探検の精神"
 STATIC_MODIFIER_DESC_cas_atlantic_mod: "未知の海への探求心がスペインの大西洋制覇を可能にする。"
 STATIC_MODIFIER_NAME_cas_caribbean_mod: "カリブ海の支配"
 STATIC_MODIFIER_DESC_cas_caribbean_mod: "カリブ海がスペイン帝国の「内なる海」となった。"
 STATIC_MODIFIER_NAME_cas_mexico_mod: "新スペイン総督領"
 STATIC_MODIFIER_DESC_cas_mexico_mod: "アステカ帝国征服により新スペイン総督領が誕生した。"
 STATIC_MODIFIER_NAME_cas_peru_mod: "ペルー総督領"
 STATIC_MODIFIER_DESC_cas_peru_mod: "インカ帝国征服によりペルー総督領が誕生した。アンデスの富がスペインへ。"
 STATIC_MODIFIER_NAME_cas_potosi_mod: "ポトシの銀山"
 STATIC_MODIFIER_DESC_cas_potosi_mod: "世界最大の銀鉱山がスペイン帝国の財政を支える。プラタ（銀）がスペインの通貨となる。"
 STATIC_MODIFIER_NAME_cas_colonial_empire_mod: "植民地帝国"
 STATIC_MODIFIER_DESC_cas_colonial_empire_mod: "世界規模のスペイン植民地帝国が完成した。コンキスタドールの夢が現实となる。"
 STATIC_MODIFIER_NAME_cas_manila_galleon_mod: "マニラ・ガレオン貿易"
 STATIC_MODIFIER_DESC_cas_manila_galleon_mod: "太平洋を横断するマニラ・ガレオンがアジアとアメリカを結ぶ最初のグローバル交易路を確立した。"
 STATIC_MODIFIER_NAME_cas_naples_mod: "ナポリ王国"
 STATIC_MODIFIER_DESC_cas_naples_mod: "ナポリ王国がスペイン王冠の下に入り、イタリアへの影響力が確立された。"
 STATIC_MODIFIER_NAME_cas_sicily_mod: "シチリア王国"
 STATIC_MODIFIER_DESC_cas_sicily_mod: "地中海の穀倉シチリアがスペイン支配下に安定した。"
 STATIC_MODIFIER_NAME_cas_milan_mod: "ミラノ公国"
 STATIC_MODIFIER_DESC_cas_milan_mod: "イタリア戦争の結果、ミラノがスペインの影響圏に入った。"
 STATIC_MODIFIER_NAME_cas_mediterranean_mod: "地中海の覇者"
 STATIC_MODIFIER_DESC_cas_mediterranean_mod: "スペインが地中海の制海権を掌握した。古代ローマ以来初めて地中海が一国に支配される。"
 STATIC_MODIFIER_NAME_cas_lepanto_mod: "レパントの英雄"
 STATIC_MODIFIER_DESC_cas_lepanto_mod: "レパントの海戦でオスマン海軍を壊滅させた——地中海のキリスト教覇権が確立される。"
 STATIC_MODIFIER_NAME_cas_ceuta_mod: "セウタの要塞"
 STATIC_MODIFIER_DESC_cas_ceuta_mod: "ジブラルタル海峡の玄関口セウタが確保された。アフリカへの扉が開く。"
 STATIC_MODIFIER_NAME_cas_oran_mod: "オランの征服"
 STATIC_MODIFIER_DESC_cas_oran_mod: "北アフリカへのレコンキスタ拡大——オランがスペインの北アフリカ拠点となった。"
 STATIC_MODIFIER_NAME_cas_tunis_mod: "チュニスの制圧"
 STATIC_MODIFIER_DESC_cas_tunis_mod: "チュニスを征服したスペインが北アフリカの覇権争いでオスマン帝国に対抗する。"
 STATIC_MODIFIER_NAME_cas_north_africa_mod: "北アフリカ支配"
 STATIC_MODIFIER_DESC_cas_north_africa_mod: "北アフリカの地中海沿岸がスペインの支配下に入り、地中海交易が安定した。"
 STATIC_MODIFIER_NAME_cas_casa_contratacion_mod: "インディアス交易所"
 STATIC_MODIFIER_DESC_cas_casa_contratacion_mod: "セビリアのカーサ・デ・コントラタシオンが新大陸交易を独占管理する。世界最大の交易機関が誕生した。"
 STATIC_MODIFIER_NAME_cas_tercio_mod: "テルシオ戦術"
 STATIC_MODIFIER_DESC_cas_tercio_mod: "世界最強の歩兵戦術テルシオがスペイン陸軍の基盤となった。"
 STATIC_MODIFIER_NAME_cas_military_orders_mod: "騎士修道会"
 STATIC_MODIFIER_DESC_cas_military_orders_mod: "サンティアゴ・カラトラバ・アルカンタラの騎士修道会がスペイン軍に加わった。"
 STATIC_MODIFIER_NAME_cas_armada_mod: "無敵艦隊"
 STATIC_MODIFIER_DESC_cas_armada_mod: "130隻の「無敵艦隊」がスペイン海軍力の絶頂を体現する。"
 STATIC_MODIFIER_NAME_cas_conquistadors_mod: "コンキスタドール"
 STATIC_MODIFIER_DESC_cas_conquistadors_mod: "コルテス・ピサロの伝説が続く——スペイン征服者たちが世界を席巻する。"
 STATIC_MODIFIER_NAME_cas_siglo_de_oro_mod: "黄金時代"
 STATIC_MODIFIER_DESC_cas_siglo_de_oro_mod: "セルバンテス・ベラスケス・エル・グレコの時代——スペイン文化が世界の頂点に立つ。"
 STATIC_MODIFIER_NAME_cas_escorial_mod: "エル・エスコリアル"
 STATIC_MODIFIER_DESC_cas_escorial_mod: "フェリペ2世の宮殿・修道院・廟所がスペイン帝国の絶頂を象徴する。"
 STATIC_MODIFIER_NAME_cas_flanders_pacified_mod: "フランドルの平定"
 STATIC_MODIFIER_DESC_cas_flanders_pacified_mod: "フランドルが安定的にスペイン帝国の一部として統合された。"
 STATIC_MODIFIER_NAME_cas_greatest_power_mod: "太陽の沈まない帝国の礎"
 STATIC_MODIFIER_DESC_cas_greatest_power_mod: "三本の柱が揃い、スペインは「太陽の沈まない帝国」の完成を目前にしている。"
 STATIC_MODIFIER_NAME_cas_empire_of_sun_final_mod: "太陽の沈まない帝国"
 STATIC_MODIFIER_DESC_cas_empire_of_sun_final_mod: "スペインが人類史上初の世界帝国として完成した。「太陽の沈まない帝国」の名が永遠に歴史に刻まれる。"
 STATIC_MODIFIER_NAME_cas_gold_fleet_mod: "金銀の艦隊"
 STATIC_MODIFIER_DESC_cas_gold_fleet_mod: "毎年スペインに向かう金銀艦隊がヨーロッパ経済を変革する。"
 STATIC_MODIFIER_NAME_cas_portugal_mod: "ポルトガルの統合"
 STATIC_MODIFIER_DESC_cas_portugal_mod: "イベリア同盟によりポルトガルの植民地帝国もスペインに加わった。"
 STATIC_MODIFIER_NAME_cas_iberian_union_mod: "イベリア同盟"
 STATIC_MODIFIER_DESC_cas_iberian_union_mod: "イベリア半島全土が統一され、世界最大の帝国の礎が完成した。"

 STATIC_MODIFIER_NAME_cas_navarre_mod: "ナバラの征服"
 STATIC_MODIFIER_DESC_cas_navarre_mod: "ピレネーの要衝ナバラ王国を掌握しイベリア北部の支配が確立した。"
 STATIC_MODIFIER_NAME_cas_sevilla_mod: "セビリアの繁栄"
 STATIC_MODIFIER_DESC_cas_sevilla_mod: "新大陸交易の玄関口セビリアが世界最大の商業都市として整備された。"
 STATIC_MODIFIER_NAME_cas_toledo_dev_mod: "トレド鋼"
 STATIC_MODIFIER_DESC_cas_toledo_dev_mod: "ヨーロッパで最も名高い刃物の産地トレド——その剣・短剣・甲冑はキリスト教世界とイスラム世界の双方で珍重される。鉄鋼と金細工が融合したトレドの職人技が世界に名を馳せる。"
 STATIC_MODIFIER_NAME_cas_madrid_mod: "マドリード──帝国の首都"
 STATIC_MODIFIER_DESC_cas_madrid_mod: "フェリペ2世が定めた永久首都マドリードが世界帝国の心臓部となった。"
 STATIC_MODIFIER_NAME_cas_burgos_mod: "ブルゴス──巡礼街道の国際都市"
 STATIC_MODIFIER_DESC_cas_burgos_mod: "フランス街道（カミーノ・フランセス）の重要な通過都市ブルゴスは、サンティアゴ・デ・コンポステーラへ向かうフランス・ドイツ・イタリアの巡礼者で賑わう国際的な商業都市だ。この交流がブルゴスの商人文化を育て、毛織物・ワイン・宝飾品の交易が栄える。"
 STATIC_MODIFIER_NAME_cas_trade_network_mod: "帝国交易ネットワーク"
 STATIC_MODIFIER_DESC_cas_trade_network_mod: "セビリアからマニラまで、スペインの帝国交易網が世界を覆った。"
 STATIC_MODIFIER_NAME_cas_salamanca_mod: "サラマンカ大学"
 STATIC_MODIFIER_DESC_cas_salamanca_mod: "ヨーロッパ最古の大学の一つがスペイン帝国のエリートを育成する。"
 STATIC_MODIFIER_NAME_cas_granada_city_mod: "スペインの宝石"
 STATIC_MODIFIER_DESC_cas_granada_city_mod: "アルハンブラ宮殿の都グラナダが南部の文化的中心地として整備された。"
 STATIC_MODIFIER_NAME_cas_cordoba_mod: "コルドバ革の名産地"
 STATIC_MODIFIER_DESC_cas_cordoba_mod: "コルドバの革職人たちが鞣した山羊皮「コルドバン」は、ヨーロッパの宮廷で珍重され、街の工房から絶えず荷が発っている。"
 STATIC_MODIFIER_NAME_cas_rio_salado_mod: "リオ・サラドの勝利"
 STATIC_MODIFIER_DESC_cas_rio_salado_mod: "マリーン朝・グラナダ連合軍を壊滅させレコンキスタの最終局面が始まった。"
 STATIC_MODIFIER_NAME_cas_leon_city_mod: "古王国レオンの威光"
 STATIC_MODIFIER_DESC_cas_leon_city_mod: "レコンキスタを率いたレオン王国の旧首都が整備された。"
 STATIC_MODIFIER_NAME_cas_church_reform_mod: "教会改革"
 STATIC_MODIFIER_DESC_cas_church_reform_mod: "シスネロスの改革によりスペインのカトリック教会が最も規律ある組織となった。"
 STATIC_MODIFIER_NAME_cas_counter_ref_mod: "対抗宗教改革"
 STATIC_MODIFIER_DESC_cas_counter_ref_mod: "スペインが主導する対抗宗教改革がプロテスタントの脅威に対抗する。"
 STATIC_MODIFIER_NAME_cas_havana_mod: "ハバナ──カリブの要衝"
 STATIC_MODIFIER_DESC_cas_havana_mod: "ハバナがカリブ海最大の交易・海軍拠点として整備された。"
 STATIC_MODIFIER_NAME_cas_florida_mod: "ラ・フロリダ"
 STATIC_MODIFIER_DESC_cas_florida_mod: "北米南東部へのスペインの進出が確立された。"
 STATIC_MODIFIER_NAME_cas_philippines_mod: "フィリピン諸島"
 STATIC_MODIFIER_DESC_cas_philippines_mod: "スペインのアジア進出が実現し、マニラが太平洋交易の中心となった。"
 STATIC_MODIFIER_NAME_cas_sardinia_mod: "サルデーニャ王国"
 STATIC_MODIFIER_DESC_cas_sardinia_mod: "地中海の穀倉サルデーニャがスペインの支配下に安定した。"
 STATIC_MODIFIER_NAME_cas_italy_dominion_mod: "イタリア支配の確立"
 STATIC_MODIFIER_DESC_cas_italy_dominion_mod: "イタリア半島がスペインの影響圏に入りルネサンスの富が加わった。"
 STATIC_MODIFIER_NAME_cas_garrison_mod: "要塞防衛網"
 STATIC_MODIFIER_DESC_cas_garrison_mod: "スペイン帝国の広大な版図を守る戦略的要塞網が完成した。"
 STATIC_MODIFIER_NAME_cas_cadiz_mod: "フェニキアの古港"
 STATIC_MODIFIER_DESC_cas_cadiz_mod: "カディスの天然良港が大西洋交易の主要玄関口となった。"
 STATIC_MODIFIER_NAME_cas_malaga_mod: "マラガの絹"
 STATIC_MODIFIER_DESC_cas_malaga_mod: "グラナダ征服後、マラガの温暖な気候と肥沃な土地が絹の産地として開発された。アルハンブラ宮殿の職人たちの技術がマラガの絹産業を支え、地中海交易で高値で取引される。"
 STATIC_MODIFIER_NAME_cas_valencia_mod: "太陽の都バレンシア"
 STATIC_MODIFIER_DESC_cas_valencia_mod: "太陽の都市バレンシアの絹と地中海交易がスペイン東岸を繁栄させた。"
 STATIC_MODIFIER_NAME_cas_zaragoza_mod: "アラゴン王都サラゴサ"
 STATIC_MODIFIER_DESC_cas_zaragoza_mod: "エブロ川沿いのサラゴサがイベリア内陸交易の要衝として発展した。"
 STATIC_MODIFIER_NAME_cas_barcelona_mod: "バルセロナ──地中海の拠点"
 STATIC_MODIFIER_DESC_cas_barcelona_mod: "スペイン最大の地中海商業都市バルセロナが帝国の交易拠点となった。"
 STATIC_MODIFIER_NAME_cas_segovia_mod: "セゴビアの水道橋"
 STATIC_MODIFIER_DESC_cas_segovia_mod: "ローマ時代建設の巨大水道橋が修復整備され、セゴビアの都市給水が飛躍的に向上した。水道橋の建設がカスティーリャ全土で水道整備の模範となる。"
 STATIC_MODIFIER_NAME_cas_west_africa_mod: "西アフリカ交易"
 STATIC_MODIFIER_DESC_cas_west_africa_mod: "カナリア諸島を足がかりにスペインが西アフリカ交易に参入した。"
 STATIC_MODIFIER_NAME_cas_trent_mod: "トリエント公会議"
