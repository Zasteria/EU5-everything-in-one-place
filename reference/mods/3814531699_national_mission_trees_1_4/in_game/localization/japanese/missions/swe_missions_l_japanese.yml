l_japanese:
 swe_stormaktstiden_mission_pack: "ストールマクツティデン——スウェーデンの大国時代"
 swe_stormaktstiden_mission_pack_DESCRIPTION:0 "1337年、スウェーデンはノルウェーと同君連合を結ぶ独立王国だ。しかし北方にはデンマークという強大な隣国が存在し、将来のカルマル同盟（1397年）が示すようにスカンジナビアの覇権争いは避けられない。ファールン銅山・バルト海覇権・ヴァランギャンの東方路を経て、「ストールマクツティデン（大国時代）」を実現し、スウェーデン帝国を建設せよ。"
 swe_stormaktstiden_mission_pack_CRITERIA_DESCRIPTION:0 "スウェーデンとして北方覇権・統一・東方拡大・産業発展を実現し、スカンジナビア帝国を建国せよ。"
 swe_stormaktstiden_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してスウェーデン帝国を建設せよ。"
 swe_stormaktstiden_mission_pack_BUTTON_DETAILS:0 "エンゲルブレクトの反乱からストールマクツティデンへ——スウェーデンを帝国に！"

 swe_kingdom_of_sweden: "スウェーデン王国の基盤"
 swe_kingdom_of_sweden_desc: "1337年のスウェーデンはマグヌス・エーリクソン王の下でノルウェーと同君連合を結ぶ独立王国だ。北方にはデンマーク、東方にはロシア諸国、南にはハンザ同盟という強大な勢力に囲まれている。正統性を高め国内を安定させることで、将来のスカンジナビア覇権争いへの備えを整えよ。"

 swe_norway_union: "ノルウェーとの同君連合"
 swe_norway_union_desc: "スウェーデンとノルウェーは1319年からマグヌス王の下で同君連合を結んでいる。この同盟を強化することで、北方二王国の軍事・経済力を結集し、デンマークへの対抗力を高めよ。"

 swe_break_from_denmark: "デンマークへの対抗"
 swe_break_from_denmark_desc: "将来のカルマル同盟（1397年）においてデンマークが主導権を握り、スウェーデン貴族が不満を抱いた歴史は避けなければならない。今この時代に積極的にデンマークに対抗し、スカンジナビアの覇権をスウェーデンの手に収める準備をせよ。エンゲルブレクトの反乱精神（1434年）を先取りし、スウェーデン王権を確立せよ。"

 swe_control_skaane: "スコーネ地方の掌握"
 swe_control_skaane_desc: "スコーネ（スカーネ）はスウェーデン最南端のデンマーク的地域で、長らく両国が争ってきた。マルメを含むスコーネを掌握することで、エーレスンド海峡の支配が視野に入り、バルト海への自由な出口が確保される。"

 swe_defeat_denmark: "デンマークの打倒"
 swe_defeat_denmark_desc: "デンマークはスウェーデン最大の宿敵だ。コペンハーゲンを占領するか、デンマークをスウェーデンの従属国とすることで、北方の覇権はスウェーデンのものとなる。「スウェーデンこそスカンジナビアの真の盟主だ」——グスタフ・ヴァーサが夢見た地位がここに実現する。"

 swe_integrate_norway: "ノルウェーの統合"
 swe_integrate_norway_desc: "オスロ・ベルゲン・ニダロスを直接領有することで、ノルウェーがスウェーデン帝国の一部として完全統合される。ノルウェーの豊かな漁業資源と北大西洋への窓口がスウェーデンの力を大幅に拡大する。"

 swe_unite_scandinavia: "スカンジナビアの統一"
 swe_unite_scandinavia_desc: "デンマーク打倒とノルウェー統合——スカンジナビア全域がスウェーデンの旗の下に統一された。バイキング時代以来、誰も成し得なかったスカンジナビア完全統一が今実現する。"

 swe_danish_navy_seizure: "デンマーク艦隊の接収"
 swe_danish_navy_seizure_desc: "デンマーク打倒の後、その強力な艦隊をスウェーデンが接収した。バルト海最強の海軍力がスウェーデンの手に渡り、北海制覇への道が開かれる。"
 swe_danish_navy_seizure_unlock_tt: "決断「デンマーク艦隊の編入」が解放された。"
 swe_danish_fleet_decision.title: "デンマーク艦隊の編入"
 swe_danish_fleet_decision.desc: "拿捕したデンマークの艦船は、敗れた王国の港に係留されたままだ。乗員を集めて艤装し直すには国庫に大きな負担がかかり、国内も落ち着かなくなるが、スウェーデンの旗を掲げた大型帆船六隻はバルト海の力関係を変えるだろう。"
 swe_danish_fleet_decision.a: "大型帆船六隻を就役させる。"

 swe_sound_toll: "海峡通行税の掌握"
 swe_sound_toll_desc: "スコーネ掌握によりエーレスンド海峡のスウェーデン側を支配した。バルト海と北海を結ぶこの海峡の通行税をデンマークに代わってスウェーデンが徴収することで、莫大な収入が得られる。"

 swe_control_gotland: "ゴットランドの掌握"
 swe_control_gotland_desc: "ゴットランド島のヴィスビーはバルト海最大の交易都市の一つだ。デンマーク・ハンザ同盟・リヴォニア騎士団が争うこの要衝を掌握することで、バルト海交易への足がかりが確立される。"

 swe_baltic_trade: "バルト海交易"
 swe_baltic_trade_desc: "ゴットランドを基点にバルト海交易に本格参入する。スウェーデンはかつてヴァランギャン（ヴァリャーグ）の交易路でビザンツまで商品を運んだ。その伝統を甦らせ、バルト海を制するスウェーデン商人の時代を作れ。"

 swe_conquer_estonia: "エストニアの征服"
 swe_conquer_estonia_desc: "タリン（レヴァル）はかつてデンマーク人が建設した城塞都市。スウェーデンはリヴォニア戦争（1558〜1583年）でエストニアを獲得した。この歴史的征服を今こそ先取りし、バルト海東岸へのスウェーデンの橋頭堡を確立せよ。"

 swe_control_livonia: "リヴォニアの支配"
 swe_control_livonia_desc: "リガとタルトゥ（ドルパト）を掌握することでバルト海東岸全域がスウェーデンの管制下に入る。ポーランド・ロシア・デンマークとの競合の中、スウェーデンがリヴォニアの最終的な支配者となる。"

 swe_varangian_legacy: "ヴァランギャンの遺産"
 swe_varangian_legacy_desc: "8〜10世紀、ヴァランギャン（ヴァリャーグ）と呼ばれたスカンジナビア人がノヴゴロドを建設し、ドニエプル川を通ってコンスタンティノープルまで交易路を開いた。ノヴゴロドとプスコフを掌握し、その古代の遺産を現代に甦らせよ。"

 swe_city_of_rus: "ルーシの都"
 swe_city_of_rus_desc: "モスクワはモスクワ大公国の首都であり、ルーシ世界の中心だ。ヴァランギャンの末裔として、スウェーデンがモスクワを支配することでバルト海から東スラヴ世界全体に及ぶスウェーデン帝国が完成する。"

 swe_bane_of_hansa: "ハンザ同盟の打倒"
 swe_bane_of_hansa_desc: "ハンザ同盟はバルト海交易を独占してきたが、スウェーデンの拡大とともにその覇権に亀裂が入っている。リューベック（ハンザの盟主）を支配するかハンザ同盟を解体し、バルト海交易の主役をスウェーデンに交代させよ。"

 swe_pomeranian_coast: "ポメラニア海岸"
 swe_pomeranian_coast_desc: "シュトラルズントとシュテッティンを掌握することで、バルト海南岸のポメラニア海岸がスウェーデンの管制下に入る。30年戦争（1618〜48年）でスウェーデンが実際に獲得したこの地域を今こそ先取りせよ。"

 swe_prussian_ambition: "プロイセンへの野望"
 swe_prussian_ambition_desc: "プロイセンはかつてチュートン騎士団が支配した地域で、バルト海南東岸の要衝だ。ケーニヒスベルクとプロイセン地域を掌握することでバルト海全体の制海権がスウェーデンのものとなる。"

 swe_dominium_maris_baltici: "バルト海の支配"
 swe_dominium_maris_baltici_desc: "「バルト海の支配（Dominium Maris Baltici）」——スウェーデンが17世紀に追求した究極の戦略目標だ。バルト海沿岸全域を支配し、この内海をスウェーデンの「内海」とする野望がついに実現する。"

 swe_secure_stockholm: "ストックホルムの整備"
 swe_secure_stockholm_desc: "ストックホルムは「水の間の島」を意味する名の通り、メーラレン湖とバルト海の間に位置する天然の要塞都市だ。都市ランクに引き上げ開発度30以上を達成することで、スウェーデン王権の中心地として機能する。"

 swe_falun_mine: "ファールン銅山"
 swe_falun_mine_desc: "ストール・コパールベリェット（大きな銅山）——ファールンの銅山は9世紀から稼働するスウェーデン経済の心臓だ。1347年にマグヌス4世が鉱山会社に特権を付与し、ヨーロッパの銅需要の三分の二を賄うほどの産出量を誇った。この鉱山を最大限に活用せよ。"

 swe_iron_industry: "スウェーデンの鉄鋼産業"
 swe_iron_industry_desc: "スヴェアランドの鉄山はスウェーデン軍需産業の基盤だ。高品質のスウェーデン鋼鉄はヨーロッパ中の軍隊に珍重され、30年戦争の大砲もスウェーデン産の鉄が使われた。この産業的優位を更に拡大せよ。"

 swe_swedish_steel: "スウェーデン鋼鉄"
 swe_swedish_steel_desc: "スウェーデン鋼鉄（Swedish steel）はヨーロッパ最高品質として名高い。銅と鉄の豊富な産出量に支えられた製鉄産業が、スウェーデン軍の装備と輸出収入の両面でスウェーデン帝国の経済的強さを象徴する。"

 swe_riksdag: "リクスダーグ（議会）"
 swe_riksdag_desc: "リクスダーグ（Riksdag）は1435年に初めて開催されたスウェーデンの身分制議会だ。大貴族・騎士・聖職者・農民（スウェーデンは農民が独自の身分として議会参加する点でユニーク）が参集するこの議会を強化して、スウェーデン独自の政治的伝統を確立せよ。"

 swe_absolutism: "絶対王政"
 swe_absolutism_desc: "1680年、カール11世は「削減（reduktionen）」政策で貴族から土地を取り戻し、スウェーデンに絶対王政を確立した。この歴史的転換を先取りし、王権を完全に確立することでスウェーデンが強力な中央集権国家となる。"

 swe_great_power: "大国スウェーデン"
 swe_great_power_desc: "17世紀のスウェーデンは「ストールマクツティデン（大国時代）」を迎え、グスタフ2世アドルフ・カール10世グスタフ・カール12世の下でヨーロッパの強国として君臨した。広大な版図・豊かな収入・高い威信でその時代を先取りせよ。"

 swe_stormakt_economy: "大国の経済"
 swe_stormakt_economy_desc: "スウェーデン鋼鉄と絶対王政の行政効率化——ストールマクツティデンの経済的基盤が完成した。月収400以上と複数の市場中心地でスウェーデン帝国の経済的強さを証明せよ。"

 swe_religious_crossroads: "信仰の岐路"
 swe_religious_crossroads_desc: "宗教改革の波がスカンジナビアを覆い始めた。スウェーデン王国はどの信仰の道を選ぶのか——ローマへの忠誠を守るカトリック・ルターの革命的教えを受け入れるルター派・あるいは先祖たちの古い神々のもとへ帰るノルド——。この選択がスウェーデンの未来を決める。"

 swe_catholic_sweden: "カトリックスウェーデン"
 swe_catholic_sweden_desc: "スウェーデン王国はローマ教会への忠誠を守り続ける。教皇との緊密な関係がスウェーデンに外交的優位をもたらし、北欧カトリック世界の守護者として認められる。"

 swe_northern_crusade: "北方十字軍"
 swe_northern_crusade_desc: "スウェーデンがキリスト教世界の北の盾として異教徒との聖戦に参加する。北方十字軍の精神が甦り、デンマークやポーランドとともにバルカン・中東への対抗勢力として名声を高める。"

 swe_church_reform: "教皇の盾"
 swe_church_reform_desc: "教皇との絶大な信頼関係とリューベック掌握——スウェーデンは北欧カトリック世界の最強の守護者として確固たる地位を築いた。"

 swe_reformation: "宗教改革"
 swe_reformation_desc: "1527年、スウェーデン王グスタフ・ヴァーサはヴェステロース議会でルター派を事実上の国教とした。教会財産を王家に接収し、国家財政を大幅に強化したこの決断を今こそ先取りせよ。"

 swe_protestant_reform: "プロテスタント教会の整備"
 swe_protestant_reform_desc: "大学を整備してルター派神学者を育成し、スウェーデン全土にプロテスタント信仰を根付かせよ。スウェーデン教会の独自性がスウェーデン文化とアイデンティティの基盤となる。"

 swe_protestant_empire: "プロテスタント帝国"
 swe_protestant_empire_desc: "スカンジナビア全土にルター派が浸透した。スウェーデン王はプロテスタント世界の北方の盟主として君臨し、30年戦争のように南欧のカトリック勢力に対抗できる立場となる。"

 swe_norse_revival: "ノルド古信仰の復興"
 swe_norse_revival_desc: "先祖たちの神々——オーディン・トール・フレイ——への信仰が甦る。キリスト教化以前のスカンジナビアの姿が現代に再現される。スウェーデン王がノルドの神々の代理人として君臨するこの革命的な選択は、ヨーロッパ全土に衝撃を与えるだろう。"

 swe_berserker_army: "ベルセルクの軍"
 swe_berserker_army_desc: "ヴァイキング時代のベルセルク（熊の戦士）の精神が甦る。ノルドの神々に捧げる戦士たちが海賊活動を解放され、異教徒の海岸を自由に襲撃できるようになった。"

 swe_yggdrasil_throne: "ユグドラシルの玉座"
 swe_yggdrasil_throne_desc: "世界樹ユグドラシルの根元に座るオーディンのように、スウェーデン皇帝が北方世界の中心として君臨する。帝国ランクと500以上のロケーションでノルドの神々の加護を受けた北方帝国が完成した。"

 swe_finland_integration: "フィンランドの統合"
 swe_finland_integration_desc: "フィンランドはスウェーデンの重要な一部として12世紀から統合が進んできた。オーボ（トゥルク）・ヴィボルク・ウレオボルク（オウル）を直接支配することで、北大西洋・バレンツ海への橋頭堡が確立される。"

 swe_lapland_expansion: "ラップランドへの拡大"
 swe_lapland_expansion_desc: "ノルランド（スウェーデン北部）の広大な森林地帯にサーミ人が住んでいる。彼らの土地を王国に統合し、木材・毛皮・鉄鉱石の豊富な資源を確保することで、スウェーデン北方の開拓が本格化する。"

 swe_arctic_empire: "北極圏帝国"
 swe_arctic_empire_desc: "ウレオボルクを中心とするノルウェー海・バレンツ海への展開——スウェーデンは北極圏まで版図を広げた北方帝国となった。海軍総督の設置と海洋存在感の拡大でスウェーデン帝国の北方辺境が完成する。"

 swe_develop_stockholm: "ストックホルムの大整備"
 swe_develop_stockholm_desc: "ストックホルムが大学を持つ大都市として発展した。バルト海と北海を繋ぐこの都市は、スウェーデン帝国の文化・商業・政治の中心として北欧最大の都市へと成長する。"

 swe_develop_goteborg: "ヨーテボリの整備"
 swe_develop_goteborg_desc: "ヨーテボリ（ゲーテボリ）は1621年にグスタフ2世アドルフが建設したスウェーデン西岸の港市だ。北海への出口として、この都市を都市ランクに引き上げることでデンマーク・オランダへの直接交易路が開かれる。"

 swe_peasant_support: "農民の支持"
 swe_peasant_support_desc: "スウェーデンの農民身分はリクスダーグに独自の代表を持つユニークな存在だ。農民の満足度を高め穀物生産を拡大することで、社会的安定とスウェーデン独自の民主的伝統が確立される。"

 swe_engelbrekt: "エンゲルブレクトの精神"
 swe_engelbrekt_desc: "1434〜36年にエンゲルブレクト・エンゲルブレクトソンが鉱山労働者と農民を率いてデンマーク支配に反乱を起こした。彼は暗殺されたが、その反乱の精神はスウェーデン独立運動の永遠の象徴となった。この精神を今こそ正式に体現せよ。"

 swe_colonization: "スウェーデン植民地帝国"
 swe_colonization_desc: "スウェーデンも17世紀にニュー・スウェーデン（デラウェア川流域）などの植民地を建設した。フィンランドの開拓を基盤として海外植民地事業を展開し、スウェーデン帝国の版図を世界に広げよ。"

 swe_develop_uppsala: "ウプサラ大学の隆盛"
 swe_develop_uppsala_desc: "ウプサラ大学は1477年に創設されたスウェーデン最古の大学で、カール・リンネ（分類学）・アンデルス・セルシウス（温度計）などを輩出した北欧最高の学術機関だ。この大学を発展させてスウェーデン学術の基盤を固めよ。"

 swe_karoliner: "カロリーナン（カール王の兵士）"
 swe_karoliner_desc: "スウェーデン帝国の精鋭歩兵カロリーナン（Karoliner）は18世紀初頭のカール12世の下で最強の歩兵として知られた。高い軍事伝統と大規模な陸軍を整備し、このエリート軍団の精神を先取りせよ。"

 swe_amber_trade: "琥珀交易"
 swe_amber_trade_desc: "バルト海産の琥珀はスウェーデン支配地域からヨーロッパ全土へ輸出される「北の黄金」だ。大国の経済基盤の上に琥珀交易を展開することで、スウェーデン帝国の交易収入がさらに拡大する。"

 swe_stormaktstiden: "ストールマクツティデン"
 swe_stormaktstiden_desc: "スカンジナビア統一・バルチカ支配・大国の経済——三つの柱が揃い、スウェーデンはストールマクツティデン（大国時代）の頂点に達した。月収600以上・艦船600以上のロケーション・威信80以上でその栄光を掴め。"

 swe_swedish_empire: "スウェーデン帝国"
 swe_swedish_empire_desc: "バルト海からモスクワまで、スカンジナビアからプロイセンまで——スウェーデン帝国が完成した。1337年にノルウェーとの同君連合から始まったスウェーデンの旅が、今や北ヨーロッパ全域を支配する大帝国への到達で終わる。「スウェーデンが最後に笑う」——カール12世の言葉がここに実現した。"

 swe_events.30.t: "スカンジナビア統一——ストールマクツティデンの夜明け"
 swe_events.30.d: "デンマーク打倒、ノルウェー統合——スカンジナビア全域がスウェーデンの旗の下に統一された。バイキング時代以来、誰も成し得なかったこの偉業がついに実現した。スウェーデン王はここに「スカンジナビア王」の称号を宣言し、北方最大の国家の建設が始まる。「エンゲルブレクトの夢が、今ここで実現した」——後世の史家たちはこう記すだろう。"
 swe_events.30.a: "スカンジナビア万歳！北方の統一は永遠に！"

 swe_events.40.t: "信仰の岐路——スウェーデンの宗教選択"
 swe_events.40.d: "宗教改革の嵐がスカンジナビアを吹き抜けている。スウェーデン宮廷では激しい議論が続く。ローマ教皇への忠誠を守り続けるか——マルティン・ルターの革命的な教えを受け入れるか——あるいは先祖たちが崇めたオーディンとトールのもとへ帰るか。スウェーデン王の決断がこの北方王国の未来を決定する。"
 swe_events.40.a: "ローマへの忠誠を守れ——カトリックこそスウェーデンの魂だ"
 swe_events.40.b: "ルターの教えを受け入れよ——改革の時代が来た"
 swe_events.40.c: "古い神々のもとへ帰れ——オーディンの加護を求める"

 swe_events.99.t: "スウェーデン帝国の誕生"
 swe_events.99.d: "バルト海からモスクワまで、スカンジナビアからプロイセンまで——スウェーデン帝国がついに完成した。グスタフ・ヴァーサが1523年に独立を宣言してから（あるいはそれより早く）、スウェーデンはヨーロッパの辺境の小国から北方最強の帝国へと変貌を遂げた。ストールマクツティデン（大国時代）——それはスウェーデンが世界史の主役となった時代だ。「再び昼が来た——しかし今度はスウェーデンの昼だ」"
 swe_events.99.a: "スウェーデン皇帝陛下万歳！北方帝国よ永遠なれ！"
 STATIC_MODIFIER_NAME_swe_kingdom_mod: "スウェーデン王国の基盤"
 STATIC_MODIFIER_DESC_swe_kingdom_mod: "マグヌス・エーリクソン王の治世から始まるスウェーデン再建の礎が築かれた。"

 STATIC_MODIFIER_NAME_swe_norway_union_mod: "ノルウェー同君連合の恩恵"
 STATIC_MODIFIER_DESC_swe_norway_union_mod: "ノルウェーとの同君連合でスカンジナビア北西部の軍事力が統合された。"
 STATIC_MODIFIER_NAME_swe_skaane_mod: "スコーネの掌握"
 STATIC_MODIFIER_DESC_swe_skaane_mod: "スコーネ掌握でエーレスンド海峡のスウェーデン側が確保された。"
 STATIC_MODIFIER_NAME_swe_norway_integrated_mod: "ノルウェー統合——漁業の恵み"
 STATIC_MODIFIER_DESC_swe_norway_integrated_mod: "ノルウェーの豊かな漁場がスウェーデン帝国に統合された。"
 STATIC_MODIFIER_NAME_swe_scandinavia_united_mod: "スカンジナビア統一"
 STATIC_MODIFIER_DESC_swe_scandinavia_united_mod: "三つの王国の旗が一つの王冠のもとに並び、ストックホルムから発せられた命令は北の海の彼方まで届いている。"
 STATIC_MODIFIER_NAME_swe_baltic_trade_mod: "バルト海交易"
 STATIC_MODIFIER_DESC_swe_baltic_trade_mod: "スウェーデンがバルト海交易に本格参入した。ヴァランギャンの古い交易路が現代に甦る。"
 STATIC_MODIFIER_NAME_swe_estonia_mod: "エストニアの征服"
 STATIC_MODIFIER_DESC_swe_estonia_mod: "タリンを中心とするエストニアがスウェーデンの支配下に入った。"
 STATIC_MODIFIER_NAME_swe_livonia_mod: "リヴォニアの支配"
 STATIC_MODIFIER_DESC_swe_livonia_mod: "リガとタルトゥの掌握でバルト海東岸全域がスウェーデンの管制下に入った。"
 STATIC_MODIFIER_NAME_swe_varangian_mod: "ヴァランギャンの遺産"
 STATIC_MODIFIER_DESC_swe_varangian_mod: "ノヴゴロド掌握で古代ヴァランギャンの交易路が甦った。"
 STATIC_MODIFIER_NAME_swe_eastern_empire_mod: "ルーシの支配"
 STATIC_MODIFIER_DESC_swe_eastern_empire_mod: "モスクワ掌握でスウェーデンが東スラヴ世界の覇者となった。"
 STATIC_MODIFIER_NAME_swe_dominium_baltici_mod: "バルト海の支配"
 STATIC_MODIFIER_DESC_swe_dominium_baltici_mod: "バルト海全域がスウェーデンの「内海」となった。この海を通る全商船がスウェーデンに従う。"
 STATIC_MODIFIER_NAME_swe_hansa_victory_mod: "ハンザ同盟の打倒"
 STATIC_MODIFIER_DESC_swe_hansa_victory_mod: "バルト海交易の覇者ハンザ同盟を打倒したスウェーデンが交易の主役となった。"
 STATIC_MODIFIER_NAME_swe_pomerania_mod: "ポメラニア海岸"
 STATIC_MODIFIER_DESC_swe_pomerania_mod: "30年戦争でスウェーデンが獲得したポメラニアを先取りした。バルト海南岸がスウェーデンの管制下に入る。"
 STATIC_MODIFIER_NAME_swe_prussia_mod: "プロイセンへの野望"
 STATIC_MODIFIER_DESC_swe_prussia_mod: "ケーニヒスベルクを含むプロイセンがスウェーデンの支配下に入った。"
 STATIC_MODIFIER_NAME_swe_stockholm_mod: "ストックホルムの整備"
 STATIC_MODIFIER_DESC_swe_stockholm_mod: "スウェーデン王都ストックホルムが行政の中心として整備された。"
 STATIC_MODIFIER_NAME_swe_falun_copper_mod: "ファールン銅山"
 STATIC_MODIFIER_DESC_swe_falun_copper_mod: "ヨーロッパの銅需要を支えるファールン銅山が本格稼働している。"
 STATIC_MODIFIER_NAME_swe_iron_industry_mod: "鉄鋼産業"
 STATIC_MODIFIER_DESC_swe_iron_industry_mod: "スヴェアランドの鉄山が本格稼働し、スウェーデン軍需産業の基盤が確立された。"
 STATIC_MODIFIER_NAME_swe_steel_mod: "スウェーデン鋼鉄"
 STATIC_MODIFIER_DESC_swe_steel_mod: "ヨーロッパ最高品質のスウェーデン鋼鉄が国内外の軍隊に供給される。"
 STATIC_MODIFIER_NAME_swe_riksdag_mod: "リクスダーグ"
 STATIC_MODIFIER_DESC_swe_riksdag_mod: "スウェーデン議会が機能的な立法機関として確立された。農民も参加するスウェーデン独自の政治伝統が形成される。"
 STATIC_MODIFIER_NAME_swe_absolutism_mod: "絶対王政"
 STATIC_MODIFIER_DESC_swe_absolutism_mod: "カール11世の削減政策を先取りし、スウェーデンに絶対王政が確立された。"
 STATIC_MODIFIER_NAME_swe_great_power_mod: "大国スウェーデン"
 STATIC_MODIFIER_DESC_swe_great_power_mod: "ストールマクツティデンの到来でスウェーデンがヨーロッパの強国として台頭した。"
 STATIC_MODIFIER_NAME_swe_stormakt_economy_mod: "大国の経済"
 STATIC_MODIFIER_DESC_swe_stormakt_economy_mod: "スウェーデン鋼鉄・絶対王政・バルト海交易を基盤とする大国経済が完成した。"
 STATIC_MODIFIER_NAME_swe_catholic_mod: "カトリックスウェーデン"
 STATIC_MODIFIER_DESC_swe_catholic_mod: "ローマ教会への忠誠を守り続けるスウェーデンが北欧カトリック世界の守護者として認められた。"
 STATIC_MODIFIER_NAME_swe_crusader_glory_mod: "北方十字軍の栄光"
 STATIC_MODIFIER_DESC_swe_crusader_glory_mod: "スウェーデンが聖戦に参加してキリスト教世界の守護者としての名声を確立した。"
 STATIC_MODIFIER_NAME_swe_lutheran_mod: "ルター派改革"
 STATIC_MODIFIER_DESC_swe_lutheran_mod: "グスタフ・ヴァーサのルター派宣言を先取りし、教会財産が王家に接収された。"
 STATIC_MODIFIER_NAME_swe_protestant_reform_mod: "プロテスタント教会"
 STATIC_MODIFIER_DESC_swe_protestant_reform_mod: "ルター派神学者の育成でスウェーデン全土にプロテスタント信仰が根付いた。"
 STATIC_MODIFIER_NAME_swe_norse_conversion_mod: "ノルド古信仰の復興"
 STATIC_MODIFIER_DESC_swe_norse_conversion_mod: "オーディン・トール・フレイへの信仰が復活した。ヴァイキング時代の戦士精神がスウェーデン軍に宿る。"
 STATIC_MODIFIER_NAME_swe_berserker_mod: "ベルセルクの軍"
 STATIC_MODIFIER_DESC_swe_berserker_mod: "ヴァイキング時代の熊の戦士の精神が甦った。海賊活動が解放され、異教徒の海岸を自由に襲撃できる。"
 STATIC_MODIFIER_NAME_swe_yggdrasil_mod: "ユグドラシルの玉座"
 STATIC_MODIFIER_DESC_swe_yggdrasil_mod: "世界樹の根元に君臨するオーディンのように、スウェーデン皇帝が北方世界の中心として君臨する。"
 STATIC_MODIFIER_NAME_swe_finland_mod: "フィンランドの統合"
 STATIC_MODIFIER_DESC_swe_finland_mod: "フィンランドがスウェーデン帝国の一部として統合された。入植政策で北方辺境が開拓される。"
 STATIC_MODIFIER_NAME_swe_lapland_mod: "ラップランドへの拡大"
 STATIC_MODIFIER_DESC_swe_lapland_mod: "ノルランドの広大な森林地帯がスウェーデンに統合された。"
 STATIC_MODIFIER_NAME_swe_arctic_mod: "北極圏帝国"
 STATIC_MODIFIER_DESC_swe_arctic_mod: "北極圏の沿岸に立つスウェーデンの灯台は、北大西洋を行き交う船乗りたちの道しるべとなっている。"
 STATIC_MODIFIER_NAME_swe_stormaktstiden_mod: "ストールマクツティデン"
 STATIC_MODIFIER_DESC_swe_stormaktstiden_mod: "スウェーデン大国時代——スカンジナビア・バルト海・東欧を支配する北方帝国の最高点に達した。"
 STATIC_MODIFIER_NAME_swe_sound_toll_mod: "海峡通行税"
 STATIC_MODIFIER_DESC_swe_sound_toll_mod: "エーレスンド海峡通行税の徴収でスウェーデン国庫が潤う。"
 STATIC_MODIFIER_NAME_swe_stockholm_great_mod: "ストックホルム——北方の都"
 STATIC_MODIFIER_DESC_swe_stockholm_great_mod: "ストックホルムが大学を持つ大都市として発展し、北欧最大の文化・学術の都となった。"
 STATIC_MODIFIER_NAME_swe_peasant_mod: "農民の支持"
 STATIC_MODIFIER_DESC_swe_peasant_mod: "スウェーデン農民身分の支持がスウェーデン独自の社会的安定を生んだ。"
 STATIC_MODIFIER_NAME_swe_engelbrekt_mod: "エンゲルブレクトの精神"
 STATIC_MODIFIER_DESC_swe_engelbrekt_mod: "1434年の反乱精神がスウェーデン軍を鼓舞する。自由のための戦いがスウェーデン軍の誇りだ。"
 STATIC_MODIFIER_NAME_swe_colonial_mod: "スウェーデン植民地帝国"
 STATIC_MODIFIER_DESC_swe_colonial_mod: "スウェーデンが海外植民地事業を展開し、北ヨーロッパを超えた帝国となった。"
 STATIC_MODIFIER_NAME_swe_papal_champion_mod: "教皇の盾"
 STATIC_MODIFIER_DESC_swe_papal_champion_mod: "北欧カトリック世界の最強の守護者として確固たる地位を築いた。"
 STATIC_MODIFIER_NAME_swe_protestant_empire_mod: "プロテスタント帝国"
 STATIC_MODIFIER_DESC_swe_protestant_empire_mod: "スカンジナビア全土にルター派が浸透したスウェーデンがプロテスタント世界の盟主となった。"
 STATIC_MODIFIER_NAME_swe_amber_mod: "琥珀交易"
 STATIC_MODIFIER_DESC_swe_amber_mod: "バルト海の浜辺で拾われた琥珀が、ストックホルムの宝石商の店先で黄金色に輝いている。"
 STATIC_MODIFIER_NAME_swe_uppsala_mod: "ウプサラ大学"
 STATIC_MODIFIER_DESC_swe_uppsala_mod: "スウェーデン最古の大学が北欧最高の学術機関として発展している。"
 STATIC_MODIFIER_NAME_swe_karoliner_mod: "カロリーナン"
 STATIC_MODIFIER_DESC_swe_karoliner_mod: "カール王の精鋭歩兵の精神を先取りした高訓練のスウェーデン軍が完成した。"
 STATIC_MODIFIER_NAME_swe_scandinavian_empire_final_mod: "スウェーデン帝国の栄光"
 STATIC_MODIFIER_DESC_swe_scandinavian_empire_final_mod: "バルト海から東欧まで広がるスウェーデン帝国が完成した。ストールマクツティデンが永遠に続く。"
 STATIC_MODIFIER_NAME_swe_faith_steadfast_mod: "揺るぎない信仰"
 STATIC_MODIFIER_DESC_swe_faith_steadfast_mod: "揺るぎないカトリックの信仰は、ウプサラの大聖堂の鐘の音とともに、王の権威を民に告げている。"
 STATIC_MODIFIER_NAME_swe_reform_winds_mod: "改革の風"
 STATIC_MODIFIER_DESC_swe_reform_winds_mod: "ルターの教えがスウェーデン全土に広まりつつある。"
 STATIC_MODIFIER_NAME_swe_old_gods_calling_mod: "古い神々の呼び声"
 STATIC_MODIFIER_DESC_swe_old_gods_calling_mod: "オーディンとトールへの信仰が秘かに蘇りつつある。"

 swe_norrkoping_textiles: "ノルショーピングの繊維織物業"
 swe_norrkoping_textiles_desc: "ノルショーピングはスウェーデン東岸の工業都市として、繊維・織物業の中心地となった。オクセルスンダ川の豊富な水力を活用した布地生産は、スウェーデン輸出の重要な柱となる。"
 STATIC_MODIFIER_NAME_swe_norrkoping_textile_mod: "ノルショーピングの繊維産業"
 STATIC_MODIFIER_DESC_swe_norrkoping_textile_mod: "ノルショーピングの水力を活用した布地生産が本格稼働した。スウェーデン製布地がヨーロッパ市場へ輸出される。"
 STATIC_MODIFIER_NAME_swe_goteborg_mod: "ヴァールベリ港の整備"
 STATIC_MODIFIER_DESC_swe_goteborg_mod: "カテガット海峡に面したヴァールベリの港では、北海へ向かう帆船が次々と錨を上げている。"
 STATIC_MODIFIER_NAME_swe_visby_mod: "ヴィスビーの商業"
 STATIC_MODIFIER_DESC_swe_visby_mod: "ゴットランドのヴィスビーの倉庫街は、バルト海各地の商人たちで再び賑わっている。"
 STATIC_MODIFIER_NAME_swe_denmark_crushed_mod: "デンマークの打倒"
 STATIC_MODIFIER_DESC_swe_denmark_crushed_mod: "宿敵デンマークの旗が降ろされたとき、スカンジナビアの諸侯たちは新しい盟主の名を静かに口にした。"
