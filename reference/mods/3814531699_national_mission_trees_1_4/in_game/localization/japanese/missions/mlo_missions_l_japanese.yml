l_japanese:
 # === ミッションパック ===
 mlo_biscione_mission_pack: "ビショーネの遺産"
 mlo_biscione_mission_pack_DESCRIPTION:0 "ヴィスコンティ家の紋章に刻まれた、人を呑む蛇――ビショーネ。ロンバルディアの一都市国家であったミラノ公国は、北イタリアの覇権を巡る複雑な権力闘争の中で、独自の道を切り拓いていく。統治と文化を発展させ、北イタリアの盟主となり、教皇・皇帝・フランスという大国の狭間で自立を保つ。公爵の前には、いかなる遺産を築くかという選択が広がっている。"
 mlo_biscione_mission_pack_CRITERIA_DESCRIPTION:0 "ミラノ公国としてミッションを達成し、北イタリアにおける支配的地位を確立せよ。"
 mlo_biscione_mission_pack_BUTTON_TOOLTIP:0 "ミッションを達成してビショーネの遺産を継承せよ。"
 mlo_biscione_mission_pack_BUTTON_DETAILS:0 "ロンバルディアの都市国家から、イタリアの中心たる都へ！"

 # === ROOT ===
 mlo_expanded_domain: "拡大した領地の支配"
 mlo_expanded_domain_desc: "ミラノ公国はロンバルディアの諸都市を併合し、その領土を大きく広げてきた。"

 mlo_curb_della_scala: "スカラ家の覇権阻止"
 mlo_curb_della_scala_desc: "ヴェローナを支配するスカラ家の北イタリアにおける覇権の伸張を食い止めねばならない。"

 mlo_imperial_vicariate: "皇帝の代理"
 mlo_imperial_vicariate_desc: "神聖ローマ皇帝より帝国代理（インペリアル・ヴィカリアート）の地位を授けられ、ミラノの統治に正当性が与えられた。"

 mlo_serpent_that_devours_men: "人食い蛇を討ちし一族"
 mlo_serpent_that_devours_men_desc: "ヴィスコンティ家の紋章に描かれた、人を呑む蛇（ビショーネ）。その伝説は一族の力の象徴であり、ミラノの新たな時代の幕開けを告げている。"

 # === BRANCH A: 国家主導の事業 ===
 mlo_state_led_enterprises: "国家主導の事業"
 mlo_state_led_enterprises_desc: "ミラノ公国は国家の主導により、統治機構の整備と文化の発展を推し進める。"

 mlo_rigorous_plague_policy: "徹底的な防疫政策"
 mlo_rigorous_plague_policy_desc: "疫病の流行に対し、徹底した検疫と隔離の制度を整備し、公国の民を守らねばならない。"

 mlo_duomo_di_milano: "ミラノのドゥオーモ"
 mlo_duomo_di_milano_desc: "ミラノ大聖堂（ドゥオーモ）の建設を推し進め、公国の威光を天に届かせよ。"

 mlo_road_network_of_the_realm: "領国の街道整備"
 mlo_road_network_of_the_realm_desc: "公国全土を結ぶ街道網を整備し、人と物資の往来を活発化させる。"

 mlo_expand_administrative_buildings: "行政施設の拡張"
 mlo_expand_administrative_buildings_desc: "防疫政策の経験を踏まえ、公国の行政機構をさらに拡充する。"

 mlo_embrace_the_renaissance: "ルネサンスの受容"
 mlo_embrace_the_renaissance_desc: "ドゥオーモの建設と並行し、ミラノの宮廷はルネサンスの新たな精神を受け入れていく。"

 mlo_the_last_supper: "『最後の晩餐』"
 mlo_the_last_supper_desc: "レオナルド・ダ・ヴィンチに『最後の晩餐』の制作を依頼し、ミラノを芸術の都とせよ。"

 mlo_naviglio_grande_renovation: "ナヴィリオ・グランデの改修"
 mlo_naviglio_grande_renovation_desc: "ミラノと周辺地域を結ぶ運河、ナヴィリオ・グランデを改修し、交易と農業の発展を促す。"

 mlo_castello_sforzesco: "スフォルツェスコ城"
 mlo_castello_sforzesco_desc: "公爵家の威光を示すスフォルツェスコ城の増築を行い、ミラノの統治の中心とする。"

 mlo_biblioteca_ambrosiana: "アンブロジアーナ図書館"
 mlo_biblioteca_ambrosiana_desc: "古今の知識を収めるアンブロジアーナ図書館を設立し、学術の振興に努める。"

 mlo_heart_of_italy: "イタリアの中心足りうる都"
 mlo_heart_of_italy_desc: "統治・産業・芸術・学術のすべてが花開いたミラノは、もはやイタリアの中心と呼ぶにふさわしい都となった。"

 # === BRANCH B: 北イタリアの野望 ===
 mlo_north_italian_ambitions: "北イタリアの野望"
 mlo_north_italian_ambitions_desc: "ミラノ公国は北イタリア全域への支配を確立するため、軍を動かす。"

 mlo_subjugate_lombardy: "ロンバルディアの制圧"
 mlo_subjugate_lombardy_desc: "ロンバルディア地方の諸都市を完全に制圧し、公国の足元を固めよ。"

 mlo_advance_into_piedmont: "ピエモンテへ進出"
 mlo_advance_into_piedmont_desc: "西方のピエモンテ地方へと勢力を広げ、サヴォイア家の影響力に対抗する。"

 mlo_strife_over_veneto: "ヴェネトを巡る争い"
 mlo_strife_over_veneto_desc: "ヴェネトの支配を巡り、ヴェネツィアをはじめとする諸国との争いが避けられない。"

 mlo_through_emilia_and_beyond: "エミリアを抜け、その先へ"
 mlo_through_emilia_and_beyond_desc: "エミリア地方を通過し、さらに南方への進出路を開く。"

 mlo_secure_liguria: "リグーリアを確保せよ"
 mlo_secure_liguria_desc: "ジェノヴァを含むリグーリア地方を確保し、地中海への足がかりを得る。"

 mlo_reach_the_coveted_sea: "念願の海への到達"
 mlo_reach_the_coveted_sea_desc: "内陸国家であったミラノが、ついに地中海への直接の出口を手にする。"

 mlo_topple_the_old_rival_florence: "宿敵、フィレンツェの打倒"
 mlo_topple_the_old_rival_florence_desc: "長年の宿敵であるフィレンツェを打ち倒し、トスカーナへの影響力を確立する。"

 # === BRANCH C: 権威の狭間にて ===
 mlo_between_two_authorities: "権威の狭間にて"
 mlo_between_two_authorities_desc: "ミラノは教皇・皇帝・フランス王という三つの権威の狭間で、独自の道を模索する。"

 mlo_reconcile_with_the_papacy: "教皇との和解"
 mlo_reconcile_with_the_papacy_desc: "ローマ教皇庁との関係を改善し、その権威を後ろ盾とする。"

 mlo_trust_of_the_emperor: "皇帝との信頼"
 mlo_trust_of_the_emperor_desc: "神聖ローマ皇帝の信頼を得て、帝国内における公国の地位を高める。"

 mlo_overture_to_france: "フランスとの接触"
 mlo_overture_to_france_desc: "フランス王国との外交関係を構築し、新たな選択肢を確保する。"

 mlo_the_italian_wars: "イタリア戦争"
 mlo_the_italian_wars_desc: "教皇・皇帝・フランスという三大国の利害が衝突するイタリア戦争の渦中に、ミラノもまた身を投じる。"

 mlo_isolate_papal_authority: "教皇権威の隔離"
 mlo_isolate_papal_authority_desc: "イタリア戦争を経て、教皇の世俗的な権威をミラノの政治から切り離す。"

 mlo_deny_imperial_authority: "皇帝権威の否定"
 mlo_deny_imperial_authority_desc: "イタリア戦争を経て、もはや皇帝の権威に頼ることなく公国を統治する道を選ぶ。"

 mlo_repel_french_authority: "フランス権威の排斥"
 mlo_repel_french_authority_desc: "イタリア戦争を経て、フランス王国の介入を排し、公国の独立を守り抜く。"

 mlo_italian_independence: "イタリアの自立"
 mlo_italian_independence_desc: "教皇・皇帝・フランス、いずれの権威にも依存しない、イタリアの自立した強国としての地位を確立した。"

 # === FINAL ===
 mlo_who_achieves_all_things: "何事をも成し遂げる者"
 mlo_who_achieves_all_things_desc: "統治・文化・領土・外交のすべてにおいて頂点を極めたミラノ公は、もはや何事をも成し遂げる者と称されるにふさわしい。"
 STATIC_MODIFIER_NAME_mlo_expanded_domain_mod: "公国領の拡張"
 STATIC_MODIFIER_DESC_mlo_expanded_domain_mod: "ミラノ公国は14〜15世紀にヴィスコンティ家の下で急速に版図を広げた。ヴィスコンティ家の蛇の紋章（ビスコーネ）が翻る旗のもと、ベルガモ・ブレシア・ジェノヴァなどを次々と従属させ、北イタリア随一の大国へと成長した。"

 # === 静的モディファイア ===

 STATIC_MODIFIER_NAME_mlo_curb_della_scala_mod: "スカラ家への優位"
 STATIC_MODIFIER_DESC_mlo_curb_della_scala_mod: "スカラ家（デッラ・スカーラ家）はヴェローナを中心に北イタリアで強大な勢力を誇った。カングランデ・デッラ・スカーラはダンテを庇護したことでも知られる。ヴィスコンティ家がこの宿敵を1387年に打ち倒したことで北イタリアの勢力図が大きく書き換えられた。"


 STATIC_MODIFIER_NAME_mlo_state_led_enterprises_mod: "国家機構の整備"
 STATIC_MODIFIER_DESC_mlo_state_led_enterprises_mod: "ヴィスコンティ家・スフォルツァ家は国家主導の大規模土木事業を得意とした。パヴィーアのチェルトーザ修道院、ミラノのカステッロ・スフォルツェスコ、ナヴィリオ・グランデ運河網——これらはいずれも公権力が推進した壮大な建設プロジェクトだ。"

 STATIC_MODIFIER_NAME_mlo_rigorous_plague_policy_mod: "防疫体制の確立"
 STATIC_MODIFIER_DESC_mlo_rigorous_plague_policy_mod: "1348年の黒死病でミラノ公国も甚大な被害を受けたが、その後ヴィスコンティ家は積極的な公衆衛生政策を採用した。1456年にフランチェスコ・スフォルツァが建設したオスペダーレ・マッジョーレ（現在のミラノ大学）は当時ヨーロッパ最大の総合病院だった。"

 STATIC_MODIFIER_NAME_mlo_duomo_di_milano_mod: "ドゥオーモの威光"
 STATIC_MODIFIER_DESC_mlo_duomo_di_milano_mod: "1386年にジャン・ガレアッツォ・ヴィスコンティが着工したミラノ大聖堂は全ゴシック様式の石造建築で世界最大級の規模を誇る。無数の尖塔と彫刻で飾られたこの大聖堂は600年近くにわたって建設が続き、ナポレオンの時代にようやく完成した（今もまだ工事が続く）。"

 STATIC_MODIFIER_NAME_mlo_road_network_of_the_realm_mod: "街道網の発展"
 STATIC_MODIFIER_DESC_mlo_road_network_of_the_realm_mod: "ロンバルディア平野は古代ローマの街道網（ヴィア・エミリアなど）が整備された地域で、中世に入っても商業交通の主要ルートとして機能し続けた。アルプスを越えてフランス・ドイツとつながるこの街道網を管理することはミラノ公国の経済的・軍事的核心だった。"

 STATIC_MODIFIER_NAME_mlo_expand_administrative_buildings_mod: "行政機構の拡充"
 STATIC_MODIFIER_DESC_mlo_expand_administrative_buildings_mod: "スフォルツァ家は強力な官僚制度を整備した。ミラノの中央官房（カンチェレリア）には優秀な法律家・書記官が集められ、北イタリアで最も洗練された行政機構として知られた。"

 STATIC_MODIFIER_NAME_mlo_embrace_the_renaissance_mod: "ルネサンスの宮廷"
 STATIC_MODIFIER_DESC_mlo_embrace_the_renaissance_mod: "フランチェスコ・スフォルツァとその息子ルドヴィーコ・スフォルツァ（イル・モーロ）の宮廷はルネサンスの一大中心地となった。ルドヴィーコはレオナルド・ダ・ヴィンチを20年近く宮廷に迎え、ブラマンテ・クリスチャン・デ・ブルゴーニュらの芸術家・建築家も集めた。"

 STATIC_MODIFIER_NAME_mlo_the_last_supper_mod: "不朽の傑作"
 STATIC_MODIFIER_DESC_mlo_the_last_supper_mod: "レオナルド・ダ・ヴィンチが1495〜1498年にサンタ・マリア・デッレ・グラツィエ修道院の食堂壁面に描いた「最後の晩餐」は、遠近法の完璧な使用と各人物の心理描写で西洋絵画の傑作とされる。ルドヴィーコ・スフォルツァの注文で描かれたこの作品はミラノ宮廷の絶頂期の遺産だ。"

 STATIC_MODIFIER_NAME_mlo_naviglio_grande_renovation_mod: "運河網の恩恵"
 STATIC_MODIFIER_DESC_mlo_naviglio_grande_renovation_mod: "ナヴィリオ・グランデはミラノと北イタリアの水路網を繋ぐ中世最大の人工運河の一つで、1179年に着工された。大理石・建材・食料の輸送に活用され、ミラノ大聖堂の大理石もこの運河で運ばれた。レオナルド・ダ・ヴィンチ自身も運河の改修計画に携わった。"


 STATIC_MODIFIER_NAME_mlo_biblioteca_ambrosiana_mod: "学術の振興"
 STATIC_MODIFIER_DESC_mlo_biblioteca_ambrosiana_mod: "フェデリコ・ボッロメオ枢機卿が1609年に設立したアンブロジアーナ図書館はレオナルド・ダ・ヴィンチの手稿（コデックス・アトランティクス）を含む膨大なコレクションを擁する。ミラノの守護聖人アンブロシウスに捧げられたこの図書館はヨーロッパ初の公開図書館の一つだ。"

 STATIC_MODIFIER_NAME_mlo_heart_of_italy_mod: "イタリアの中心"
 STATIC_MODIFIER_DESC_mlo_heart_of_italy_mod: "ロンバルディア平野の中心に位置するミラノはアルプス越えの交易路の終点として古代ローマ時代から交通・商業の要衝だった。近代に入ってもファッション・金融・製造業の中心として「イタリアの首都」と呼ばれ続けるこの都市の力は地理的必然に根ざしている。"

 STATIC_MODIFIER_NAME_mlo_north_italian_ambitions_mod: "北イタリアへの野心"
 STATIC_MODIFIER_DESC_mlo_north_italian_ambitions_mod: "ヴィスコンティ家の最盛期（14世紀末）にはジェノヴァ・ボローニャ・ルッカ・ピサまで北イタリアの広大な地域がミラノ公国の影響下に入った。この拡張政策はフィレンツェ・ヴェネツィアとの激しい対立を生み、ルネサンス外交の複雑な均衡政治の舞台となった。"

 STATIC_MODIFIER_NAME_mlo_subjugate_lombardy_mod: "ロンバルディアの盟主"
 STATIC_MODIFIER_DESC_mlo_subjugate_lombardy_mod: "ロンバルディアの名はローマ時代にイタリアに定住したゲルマン系ランゴバルド人に由来する。肥沃なポー川流域を擁するこの地は中世を通じてヨーロッパ最大の農業・工業地帯の一つであり、その支配権を確立することは北イタリア覇権の確立を意味した。"

 STATIC_MODIFIER_NAME_mlo_advance_into_piedmont_mod: "ピエモンテへの足がかり"
 STATIC_MODIFIER_DESC_mlo_advance_into_piedmont_mod: "ピエモンテはサヴォイア家の勢力圏であり、ミラノとは長年の競争関係にあった。アルプスを越えてフランスとつながるこの戦略的回廊を掌握することは西からの侵略を防ぐ盾となる。ヴィスコンティ家もスフォルツァ家もこの地への進出を繰り返し試みた。"

 STATIC_MODIFIER_NAME_mlo_strife_over_veneto_mod: "ヴェネトの戦功"
 STATIC_MODIFIER_DESC_mlo_strife_over_veneto_mod: "ヴェネトはミラノとヴェネツィアの間に挟まれた係争地だった。ヴェロナ・パドヴァ・ヴィチェンツァを巡る争奪戦は15世紀を通じて続き、特にカンブレー同盟戦争（1508〜1516年）ではヴェネツィアの陸地支配が根底から揺らいだ。"

 STATIC_MODIFIER_NAME_mlo_through_emilia_and_beyond_mod: "南方への道"
 STATIC_MODIFIER_DESC_mlo_through_emilia_and_beyond_mod: "ヴィア・エミリア（エミリア街道）は古代ローマが紀元前187年に建設した直線道路で、リミニからピアチェンツァまでエミリア地方を縦断する。この古代の大動脈沿いにボローニャ・パルマ・モデナが並び、北イタリアの中央を南東へと抜けるこの回廊を支配することは軍事的に決定的な意味を持つ。"

 STATIC_MODIFIER_NAME_mlo_secure_liguria_mod: "リグーリアの商機"
 STATIC_MODIFIER_DESC_mlo_secure_liguria_mod: "ジェノヴァはヴェネツィアと並ぶ中世地中海の二大海洋都市国家であり、黒海・北アフリカ・イベリアに広大な商業ネットワークを持った。1421年にヴィスコンティ家がジェノヴァを一時支配したように、このリグーリアの港都を押さえることはミラノに海への出口をもたらす戦略的事業だ。"

 STATIC_MODIFIER_NAME_mlo_reach_the_coveted_sea_mod: "地中海への扉"
 STATIC_MODIFIER_DESC_mlo_reach_the_coveted_sea_mod: "内陸国ミラノにとって地中海へのアクセスは永遠の課題だった。ジェノヴァを経由するかスペツィア湾へ出るかの二択が長年議論された。レオナルド・ダ・ヴィンチも運河でポー川とアドリア海を繋ぐ計画を描いている。念願の海に達することはミラノを本物の大国へと変える。"

 STATIC_MODIFIER_NAME_mlo_topple_the_old_rival_florence_mod: "アルノの落日"
 STATIC_MODIFIER_DESC_mlo_topple_the_old_rival_florence_mod: "ミラノとフィレンツェは15世紀イタリアの二大勢力として外交・軍事の両面で長年対立した。ジャン・ガレアッツォ・ヴィスコンティは1402年にフィレンツェを孤立させ滅亡寸前まで追い詰めたが、急死によって計画は潰えた。この宿敵を最終的に倒すことはイタリア覇権の決定的な証明だ。"

 STATIC_MODIFIER_NAME_mlo_between_two_authorities_mod: "狭間の外交術"
 STATIC_MODIFIER_DESC_mlo_between_two_authorities_mod: "ミラノは神聖ローマ皇帝・ローマ教皇・フランス王という三つの権威のすべてから一定の距離を保いながら外交を操った。スフォルツァ家の外交官たちは「バランス・オブ・パワー」の概念を実践し、北イタリアに長年の相対的平和をもたらした。"

 STATIC_MODIFIER_NAME_mlo_reconcile_with_the_papacy_mod: "教皇庁との和"
 STATIC_MODIFIER_DESC_mlo_reconcile_with_the_papacy_mod: "ミラノ公国は北イタリア政治において教皇庁と複雑な関係を維持した。教皇派（グエルフ）と皇帝派（ギベリン）の対立を超えて実利的な外交を展開したスフォルツァ家だったが、ローマとの関係正常化は内政安定の重要な前提条件だった。"

 STATIC_MODIFIER_NAME_mlo_trust_of_the_emperor_mod: "皇帝の信頼"
 STATIC_MODIFIER_DESC_mlo_trust_of_the_emperor_mod: "ミラノ公国の正統性は帝国の封建秩序の中に組み込まれており、皇帝からの封土授与が必要だった。1395年の「ミラノ公」称号の下賜、1494年のカール8世のイタリア侵攻以降の政治的混乱の中でも、皇帝との関係は公国の存続に不可欠な要素であり続けた。"

 STATIC_MODIFIER_NAME_mlo_overture_to_france_mod: "フランスとの誼"
 STATIC_MODIFIER_DESC_mlo_overture_to_france_mod: "ルドヴィーコ・スフォルツァはフランス王シャルル8世のイタリア侵攻（1494年）を対抗する同盟相手として招き入れた——これがイタリア戦争（1494〜1559年）の始まりとなった悪名高い決断だ。しかしその後フランスとの同盟はスフォルツァ家にとって生命線ともなった。"

 STATIC_MODIFIER_NAME_mlo_the_italian_wars_mod: "イタリア戦争の経験"
 STATIC_MODIFIER_DESC_mlo_the_italian_wars_mod: "イタリア戦争（1494〜1559年）はフランス・スペイン・神聖ローマ帝国・ヴェネツィア・ローマ教皇庁などが入り乱れて戦った65年間の争乱だ。この戦争でミラノは最大の戦場の一つとなり、フランスとスペインの間で主権が何度も入れ替わった。"

 STATIC_MODIFIER_NAME_mlo_isolate_papal_authority_mod: "教皇からの自立"
 STATIC_MODIFIER_DESC_mlo_isolate_papal_authority_mod: "北イタリアはルターの宗教改革が比較的浸透しやすい地域だった。ヴェネツィアやミラノには異端審問に対して一定の抵抗感があり、エラスムス的人文主義や後にプロテスタントに近い思想の流布を許容する傾向があった。"

 STATIC_MODIFIER_NAME_mlo_deny_imperial_authority_mod: "皇帝からの自立"
 STATIC_MODIFIER_DESC_mlo_deny_imperial_authority_mod: "中世の「ロンバルディア同盟」の伝統——北イタリアの都市国家が連合して皇帝フリードリヒ・バルバロッサを1176年のレニャーノの戦いで破った——はミラノを含む北イタリアの自立の精神の根幹だ。皇帝に頼らない独自の統治はその精神の継承だ。"

 STATIC_MODIFIER_NAME_mlo_repel_french_authority_mod: "フランスからの自立"
 STATIC_MODIFIER_DESC_mlo_repel_french_authority_mod: "イタリア戦争を通じてフランス軍は繰り返し北イタリアに侵入した。シャルル8世・ルイ12世・フランソワ1世がミラノ支配を巡って争い、1525年のパヴィアの戦いでフランソワ1世が捕虜となるまで激しい攻防が続いた。フランスの支配を退けることはミラノの尊厳の回復だ。"

 STATIC_MODIFIER_NAME_mlo_italian_independence_mod: "イタリアの自立国家"
 STATIC_MODIFIER_DESC_mlo_italian_independence_mod: "イタリア戦争の末にスペイン帝国がイタリアを支配するようになった歴史を考えると、大国に依存せず自立したミラノ公国を維持することは「もう一つの歴史」の実現だ。この独立国家としてのミラノはマキャヴェリが夢見たが実現できなかった理想の体現でもある。"

 STATIC_MODIFIER_NAME_mlo_who_achieves_all_things_mod: "万事を成し遂げし公"
 STATIC_MODIFIER_DESC_mlo_who_achieves_all_things_mod: "「全てを成し遂げる者（Chi tutte cose fa）」——スフォルツァ家のモットーはただの誇りではなく、ルネサンスの「万能人」理想の政治的表現だ。軍事的征服者にして芸術の大後援者、法の制定者にして商業の育成者——ミラノ公国の頂点はイタリア・ルネサンスの政治的最高峰を体現する。"

 # === イベント ===
 mlo_events.1.t: "ビショーネの伝説"
 mlo_events.1.d: "ヴィスコンティ家の紋章には、人を呑み込む一匹の蛇――ビショーネが描かれている。ある者はそれを十字軍の戦功の証と語り、またある者は征服した異教徒の象徴であると語る。真実がいずれであれ、この紋章は一族の力と、ミラノという都市国家がもはや一地方の領主にとどまらぬ存在となったことを、北イタリア中に知らしめている。公爵の前には、統治者としての道、征服者としての道、そして大国の間を渡る外交者としての道――幾多の選択が広がっている。"
 mlo_events.1.a: "ミラノに新たな時代が訪れた"

 mlo_events.2.t: "1337年のミラノ"
 mlo_events.2.d: "1337年現在、ミラノはルキーノ・ヴィスコンティと、その兄である大司教ジョヴァンニ・ヴィスコンティの共同統治のもとにある。先代アッツォーネの治世に神聖ローマ皇帝ルートヴィヒ4世より帝国代理（インペリアル・ヴィカリアート）の地位を授けられたことで、ミラノの支配には帝国の権威という後ろ盾が与えられた。北イタリアでは、ヴェローナのスカラ家、マントヴァのゴンザーガ家、フェッラーラのエステ家など、有力な領主たちが割拠し、互いに鎬を削っている。教皇はアヴィニョンに座し、皇帝の力もアルプスの北に偏りがちな今、ロンバルディアの覇権を握る者こそが、北イタリアの未来を決することになるだろう。"
 mlo_events.2.a: "ミラノの礎を理解した"

 mlo_events.3.t: "スフォルツェスコ城の歴史"
 mlo_events.3.d: "ミラノの城は、もともとヴィスコンティ家が築いたコルテ・アリンギエラ（鷲の中庭）と呼ばれる城塞であった。1447年、フィリッポ・マリア・ヴィスコンティの死により公位が断絶すると、市民はアンブロジアーナ共和国を樹立し、旧支配者の象徴であった城の大部分を破壊した。しかし1450年、共和制の混乱を収めて公位を継いだフランチェスコ・スフォルツァは、自らの権威を示すため、この城を新たに、より壮大な姿で再建することを命じた。以来、スフォルツェスコ城はミラノ公権力の中心として、その威光を放ち続けている。"
 mlo_events.3.a: "歴史の重みを胸に刻んだ"

 # === 建造物 ===
 mlo_castello_sforzesco_building: "スフォルツェスコ城"
 mlo_castello_sforzesco_building_desc: "フランチェスコ・スフォルツァによって再建された、ミラノ公権力の象徴たる城塞。首都に存在する場合、文化的な伝統と影響力、そして玉座の権威を高める。"

 STATIC_MODIFIER_NAME_mlo_serpent_reward_mod: "人食い蛇の支配"
 STATIC_MODIFIER_DESC_mlo_serpent_reward_mod: "ヴィスコンティ家の蛇の紋章（ビスコーネ）——蛇が人間を飲み込む図——はミラノの力と野心の象徴だ。伝説によれば、サラセン人の騎士との決闘でヴィスコンティ家の祖先が勝利してこの紋章を得た。イタリア統一の達成はその蛇がついに全土を飲み込んだことを意味する。"

