 hab_integrated_crown: "Eingegliedertes Kronland"
 hab_integrated_crown_plural: "Eingegliederte Kronländer"
 eng_welsh_principality: "Verbündetes Fürstentum"
 eng_welsh_principality_plural: "Verbündete Fürstentümer"
 eng_welsh_principality_desc: "Ein besonderer Status für ein Königreich, das die Partnerschaft der Rivalität vorgezogen hat – der Oberherr kann es nicht zwingen, an Angriffskriegen teilzunehmen, und dieses Fürstentum besitzt sogar das Recht, aus eigenem Antrieb den Krieg zu erklären. Dafür ist eine Annexion praktisch ausgeschlossen, und beide Reiche gedeihen gemeinsam unter diesem einzigartigen Band."
