l_german:
 teu_crusade_path_reform: "Disziplin des Kreuzritterordens"
 teu_crusade_path_reform_desc: "Der Gehorsamseid, den der Hochmeister zu Beginn des Ostkreuzzugs allen Ritterbrüdern auferlegt. Die Plünderung wird zum Werkzeug geordneter Feldzüge, und das Heer zieht unter dem Banner des Heiligen Krieges."
 teu_northern_crusade_reform: "Eisernes Kreuz der Plünderung"
 teu_northern_crusade_reform_desc: "Eine Schreckensherrschaft unter dem Kreuz. Den eroberten Landen wird rücksichtslos der Reichtum entrissen, und wer sich widersetzt, wird in die Sklaverei verkauft. Die alten Ideale des Heiligen Krieges sind verblasst; der Orden ist nicht länger bloß eine Kreuzfahrerbruderschaft, sondern ein Militärstaat, der auf Eroberung und Ausbeutung gründet."
 teu_northern_crusade_reform_loot_tt: "Fügt besetzten Orten Plünderungsschaden zu (klingt mit der Zeit ab)"
