l_german:
 som_imperial_breadbasket_town_rights: "Osmanische Kaiserliche Kornkammer"
 som_imperial_breadbasket_town_rights_desc: "Diesem Ort wurde die Versorgung der Reichshauptstadt und der Heere des Sultans anvertraut; seine Kornspeicher wurden erweitert, um die große Stadt zu ernähren. Unter staatlicher Aufsicht strömt das Getreide herbei und versorgt Bürger und Soldaten gleichermaßen."
