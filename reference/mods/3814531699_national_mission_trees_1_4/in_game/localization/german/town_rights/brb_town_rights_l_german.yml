l_german:
 brb_joyous_entry_rights: "Stadt der Blijde Inkomst"
 brb_joyous_entry_rights_desc: "Eine selbstverwaltete Stadt, der der Herzog Privilegien gewährt hat. Ein Teil der Krongewalt wird an die Stadt selbst abgetreten, was Gewerbe und Entwicklung antreibt und zugleich die Stimme der Stadt in den Ständen stärkt."
