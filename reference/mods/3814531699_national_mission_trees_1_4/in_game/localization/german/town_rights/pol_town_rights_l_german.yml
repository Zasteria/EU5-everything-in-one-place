 pol_royal_breadbasket_town_rights: "Polnische Königliche Kornkammer"
 pol_royal_breadbasket_town_rights_desc: "Diesem Ort wurde die Sammlung des Getreides des Reiches für den Export die Weichsel hinab anvertraut; seine Kornspeicher wurden dafür erweitert. Das Getreide strömt von den Gütern des Adels herbei und fließt zu den Ostseehäfen weiter und versorgt Bürger und Kaufleute gleichermaßen."
