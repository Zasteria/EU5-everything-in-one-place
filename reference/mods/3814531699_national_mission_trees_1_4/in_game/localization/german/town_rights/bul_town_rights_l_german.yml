l_german:
 bul_chitalishte_rights: "Stadt des Tschitalischte"
 bul_chitalishte_rights_desc: "Eine Stadt, in der eine Kulturbewegung um die „Lesestuben“ (Tschitalischte) Wurzeln geschlagen hat. Nationales Bewusstsein und Lesefähigkeit breiten sich aus, doch richtet sich die Aufmerksamkeit der Bürger mehr auf Bildung und Aufklärung als auf die Erzeugung."
