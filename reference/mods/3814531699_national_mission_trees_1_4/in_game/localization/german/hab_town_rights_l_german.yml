l_german:
 wiener_stadtrecht_town_rights: "Wiener Stadtrecht"
 wiener_stadtrecht_town_rights_desc: "Ein besonderes Stadtrecht, das allein Wien verliehen wird – es verbessert den Marktzugang, die Macht des Handelszentrums und die Kaufmannskapazität. Kann nur Wien verliehen werden."
 landstadt_town_rights: "Landstadt"
 landstadt_town_rights_desc: "Stadtrechte, die den Reichsstädten verliehen werden – sie stärken die Macht von Krone und Adelsstand und verbessern die Reichweite der Verwaltung von der Hauptstadt aus."
