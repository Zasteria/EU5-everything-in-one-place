l_german:
 ubv_oberbayern_mission_pack: "Das Münchner Erbe – der Weg zur bayerischen Wiedervereinigung"
 ubv_oberbayern_mission_pack_DESCRIPTION:0 "Als Haus München, Nachkomme Kaiser Ludwigs IV., führe die zersplitterten Lande Bayerns wieder zu einem Ganzen zusammen."
 ubv_oberbayern_mission_pack_CRITERIA_DESCRIPTION:0 "Entwickle München und vereine Bayern wieder."
 ubv_oberbayern_mission_pack_BUTTON_TOOLTIP:0 "Entwickle München und vereine Bayern wieder."
 ubv_oberbayern_mission_pack_BUTTON_DETAILS:0 "Erhebe dich als Herzog von ganz Bayern!"
 ubv_wittelsbach_legacy: "Das wittelsbachische Erbe"
 ubv_wittelsbach_legacy_desc: "Das Herzogtum Bayern, geteilt durch den Vertrag von Pavia 1329 – als Münchner Linie, Nachkomme Kaiser Ludwigs IV., tritt dieses Erbe an."
 ubv_secure_munich: "München entwickeln"
 ubv_secure_munich_desc: "München an der Isar – entwickle diese von Kaiser Ludwig IV. geliebte Stadt zum Mittelpunkt des Herzogtums."
 ubv_salt_trade: "Der Salzhandel"
 ubv_salt_trade_desc: "Salz, „weißes Gold“ genannt – nimm die Salzbergwerke von Reichenhall in Besitz und sichere dir den Reichtum dieses kostbaren Rohstoffs."
 ubv_imperial_relations: "Beziehungen zum Reich"
 ubv_imperial_relations_desc: "Der Kaiserthron, den einst Ludwig IV. innehatte – gestalte unser Verhältnis zum Heiligen Römischen Reich dieser ruhmreichen Erinnerung würdig."
 ubv_bavarian_ambition: "Streben nach einem geeinten Bayern"
 ubv_bavarian_ambition_desc: "Münchens Entwicklung, der Salzhandel und die Beziehungen zum Reich – baue darauf auf und hege Ambitionen auf ganz Bayern."
 ubv_reunite_bavaria: "Bayern wiedervereinen"
 ubv_reunite_bavaria_desc: "Das zersplitterte Herzogtum – gewinne die Lande Niederbayerns zurück und füge Bayern wieder zu einem Ganzen zusammen."
 ubv_duke_of_all_bavaria: "Herzog von ganz Bayern"
 ubv_duke_of_all_bavaria_desc: "Unter der Blutlinie des Hauses München ist ganz Bayern endlich unter einem einzigen Banner vereint."
 ubv_events.1.t: "Verkündung der bayerischen Einheit"
 ubv_events.1.d: "Unter der Blutlinie des Hauses München ist Bayern endlich wieder eins. Das Zeitalter der Teilung geht zu Ende."
 ubv_events.1.a: "Ruhm für Bayern!"
 STATIC_MODIFIER_NAME_ubv_legacy_mod: "Das wittelsbachische Erbe"
 STATIC_MODIFIER_DESC_ubv_legacy_mod: "Das Blut Ludwigs IV., der einst die Kaiserkrone trug, bleibt ein Name, auf den jeder Höfling stolz ist."
 STATIC_MODIFIER_NAME_ubv_munich_mod: "München entwickelt"
 STATIC_MODIFIER_DESC_ubv_munich_mod: "Die Stadt an der Isar blüht als Mittelpunkt des Herzogtums."
 STATIC_MODIFIER_NAME_ubv_salt_mod: "Der Salzhandel"
 STATIC_MODIFIER_DESC_ubv_salt_mod: "Karren, beladen mit „weißem Gold“ aus den Salzbergwerken von Reichenhall, rollen unablässig zu den Märkten Münchens."
 STATIC_MODIFIER_NAME_ubv_imperial_mod: "Beziehungen zum Reich"
 STATIC_MODIFIER_DESC_ubv_imperial_mod: "Die Bande zum kaiserlichen Hof, dem Ludwig IV. einst vorstand, halten die Gesandten noch immer auf Reisen hin und her."
 STATIC_MODIFIER_NAME_ubv_reunite_mod: "Bayern wiedervereint"
 STATIC_MODIFIER_DESC_ubv_reunite_mod: "Die Vasallen der beiden einst getrennten Linien schwören ihren Eid nun unter einem einzigen Banner."
 STATIC_MODIFIER_NAME_ubv_unify_bavaria_mod: "Herzog von ganz Bayern"
 STATIC_MODIFIER_DESC_ubv_unify_bavaria_mod: "Die Glocken der bayerischen Türme läuten das Ende der Teilung ein."
 ubv_unified_duchy: "Das geeinte Herzogtum Bayern"
 ubv_unified_duchy_desc: "Das Zeitalter der Teilung ist vorüber – als geeintes Herzogtum Bayern brich in eine neue Ära auf."
 ubv_bavaria_unified_tt: "Bayern geeint"
 ubv_landrecht: "Das Bayerische Landrecht"
 ubv_landrecht_desc: "Ein Recht für ein geeintes Herzogtum – erlasse das bayerische Gesetzbuch (Landrecht) und festige das Fundament der Herrschaft."
 ubv_tyrol_ambition: "Ambitionen auf Tirol"
 ubv_tyrol_ambition_desc: "Die Grafschaft Tirol, von den Alpen umfangen – hege Ambitionen auf dieses Land."
 ubv_swabian_expansion: "Ausgreifen nach Schwaben"
 ubv_swabian_expansion_desc: "Schwaben, das sich nach Südwesten erstreckt – stärke unseren Einfluss auf diese Region."
 ubv_greater_bavaria: "Ein Größeres Bayern verwirklichen"
 ubv_greater_bavaria_desc: "Das Gesetzbuch, Tirol und Schwaben – baue darauf auf und verwirkliche ein größeres Bayern."
 ubv_counter_reformation_leader: "Wortführer der Gegenreformation"
 ubv_counter_reformation_leader_desc: "Verkörpere den Geist des Konzils von Trient und stelle dich an die Spitze der Gegenreformation."
 ubv_electoral_dignity: "Kurwürde"
 ubv_electoral_dignity_desc: "Im Jahr 1623 erringt Maximilian I. endlich den Rang eines Kurfürsten – mache diese Ehre zum ewigen Stolz Bayerns."
 ubv_austrian_rivalry: "Rivalität mit Österreich"
 ubv_austrian_rivalry_desc: "Die Rivalität mit dem Haus Habsburg um die Vorherrschaft im Reich – stelle dich diesem Wettstreit mit unserem großen Widersacher."
 ubv_war_of_austrian_succession: "Der Österreichische Erbfolgekrieg"
 ubv_war_of_austrian_succession_desc: "Der Krieg um Karls VII. Anspruch auf den Kaiserthron – nutze diesen Erbfolgekrieg, um Bayerns Ansehen zu mehren."
 ubv_imperial_crown: "Die Kaiserkrone"
 ubv_imperial_crown_desc: "Im Jahr 1742 wird Karl VII., Herzog von Bayern, zum Kaiser des Heiligen Römischen Reiches gekrönt – der erste Nicht-Habsburger seit Jahrhunderten, der die Krone trägt."
 ubv_enlightened_absolutism: "Aufgeklärter Absolutismus"
 ubv_enlightened_absolutism_desc: "Ein Zeitalter der Aufklärung, das Vernunft und Bildung schätzt – trage dieses neue Gedankengut in die Regierung Bayerns."
 ubv_napoleonic_alliance: "Trotz gegenüber Frankreich"
 ubv_napoleonic_alliance_desc: "Europa, erschüttert von Revolution und Napoleons Ehrgeiz – Bayern sichert sich einen Anspruch auf den Thron dieses mächtigen Nachbarn und geht seinen eigenen Weg."
 ubv_kingdom_of_bavaria: "Die Ausrufung des Königreichs Bayern"
 ubv_kingdom_of_bavaria_desc: "Im Jahr 1806 erklärt Kurfürst Maximilian IV. Joseph sich zum König von Bayern – die lange Geschichte des Hauses Wittelsbach erreicht hier einen neuen Gipfel."
 ubv_events.3.t: "Die Kaiserkrone"
 ubv_events.3.d: "Im Jahr 1742 wurde Karl VII., Herzog von Bayern, im Frankfurter Dom zum Kaiser des Heiligen Römischen Reiches gekrönt. Es ist Jahrhunderte her, dass jemand außer einem Habsburger die Kaiserkrone trug."
 ubv_events.3.a: "Ruhm Seiner Kaiserlichen Majestät!"
 ubv_events.99.t: "Ausrufung des Königreichs Bayern"
 ubv_events.99.d: "Im Jahr 1806 erklärte sich Kurfürst Maximilian IV. Joseph unter dem Rheinbund zum König von Bayern. Die lange Geschichte des Hauses Wittelsbach erreicht hier einen neuen Gipfel."
 ubv_events.99.a: "Es lebe das Königreich Bayern!"
 STATIC_MODIFIER_NAME_ubv_unified_mod: "Das geeinte Herzogtum Bayern"
 STATIC_MODIFIER_DESC_ubv_unified_mod: "Das Herzogtum muss Höfe, Einkünfte und Soldaten nicht länger zwischen rivalisierenden Linien aufteilen."
 STATIC_MODIFIER_NAME_ubv_greater_mod: "Ein Größeres Bayern verwirklicht"
 STATIC_MODIFIER_DESC_ubv_greater_mod: "Von den Alpenausläufern bis zu den Hügeln Schwabens weitet sich das Land unter dem herzoglichen Banner mit jeder Jahreszeit."
 STATIC_MODIFIER_NAME_ubv_counter_reformation_mod: "Wortführer der Gegenreformation"
 STATIC_MODIFIER_DESC_ubv_counter_reformation_mod: "Im Geiste des Konzils von Trient öffnen in den Städten des Herzogtums Jesuitenkollegien eines nach dem anderen ihre Tore."
 STATIC_MODIFIER_NAME_ubv_succession_war_mod: "Der Österreichische Erbfolgekrieg"
 STATIC_MODIFIER_DESC_ubv_succession_war_mod: "Offiziere und Mannschaften, gestählt auf den Schlachtfeldern des Österreichischen Erbfolgekriegs, bilden nun den Kern des herzoglichen Heeres."
 STATIC_MODIFIER_NAME_ubv_imperial_crown_mod: "Die Kaiserkrone"
 STATIC_MODIFIER_DESC_ubv_imperial_crown_mod: "Die Erinnerung an den Tag, an dem der Herzog von Bayern im Frankfurter Dom gekrönt wurde, ist jedem am Hof stolz ins Herz geprägt."
 STATIC_MODIFIER_NAME_ubv_enlightenment_mod: "Aufgeklärter Absolutismus"
 STATIC_MODIFIER_DESC_ubv_enlightenment_mod: "Bei Hofe verbreiten neue Bücher aus Frankreich die Ideale der Aufklärung, und die Zahl der Schulen wächst von Jahr zu Jahr."
 STATIC_MODIFIER_NAME_ubv_electoral_dignity_mod: "Kurwürde"
 STATIC_MODIFIER_DESC_ubv_electoral_dignity_mod: "Wenn der Herzog im Gewand eines Kurfürsten seinen Platz bei der Kaiserwahl einnimmt, lauschen die Fürsten seinen Worten mit Respekt."
 STATIC_MODIFIER_NAME_ubv_kingdom_mod: "Das Königreich Bayern"
 STATIC_MODIFIER_DESC_ubv_kingdom_mod: "Im Münchner Palast donnern Salutschüsse zur Krönung des ersten Königs von Bayern aus dem Haus Wittelsbach."
